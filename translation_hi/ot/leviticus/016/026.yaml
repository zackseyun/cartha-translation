  text: וְ/הַֽ/מְשַׁלֵּ֤חַ אֶת הַ/שָּׂעִיר֙ לַֽ/עֲזָאזֵ֔ל יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/רָחַ֥ץ אֶת בְּשָׂר֖/וֹ בַּ/מָּ֑יִם וְ/אַחֲרֵי כֵ֖ן יָב֥וֹא אֶל הַֽ/מַּחֲנֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/026.yaml
  text: The one who sends the goat away to Azazel shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp.
translation:
  language: hi
  text: जो व्यक्ति बकरे को अज़ाज़ेल के पास[a] भेजता है, वह अपने वस्त्र धोए और अपने शरीर को पानी से धोए; इसके बाद वह छावनी में आ सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अज़ाज़ेल के लिए।” इब्रानी शब्द का अर्थ विवादित है। इसे किसी नाम या उपाधि के रूप में समझा जा सकता है, अथवा हटाए जाने या तथाकथित “बलि का बकरा” से संबंधित अर्थ में लिया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַמְשַׁלֵּחַ
  choice: जो व्यक्ति ... भेजता है
  rationale: संज्ञार्थक निश्चित कृदन्त उस नियुक्त व्यक्ति को दर्शाता है जो बकरे को भेजता है; यह हिन्दी में स्वाभाविक और भूमिका-सूचक है।
- source_word: הַשָּׂעִיר
  choice: बकरे
  rationale: बलिदान-संबंधी प्रसंग में यह नर बकरे को सूचित करता है; पूर्वनिर्धारित पशु के लिए ‘बकरा’ पर्याप्त और स्वाभाविक है।
- source_word: לַעֲזָאזֵל
  choice: अज़ाज़ेल के लिए
  rationale: לְ उपसर्ग को ‘के लिए’ से व्यक्त किया गया है और विवादित पद को नाम के रूप में लिप्यंतरित कर उसकी अस्पष्टता सुरक्षित रखी गई है।
- source_word: יְכַבֵּס בְּגָדָיו
  choice: अपने वस्त्र धोए
  rationale: यह विधिक निर्देश और अनुष्ठानिक धुलाई दोनों को संक्षिप्त, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ בַּמָּיִם
  choice: अपने शरीर को पानी से स्नान कराए
  rationale: בָּשָׂר का प्रसंगगत अर्थ पूरा शरीर है; हिन्दी में ‘शरीर’ ‘मांस’ की अपेक्षा अधिक स्वाभाविक है, और पानी से शुद्धिकरण स्पष्ट रहता है।
- source_word: וְאַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह क्रियाओं का स्पष्ट कालक्रम स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: वह छावनी में आ सकता है
  rationale: यहाँ अपूर्ण क्रिया धुलाई के बाद पुनः प्रवेश की अनुमति व्यक्त करती है, न कि आवश्यक रूप से एक नया आदेश।
theological_decisions:
- issue: प्रायश्चित्त-दिवस की विधि में לַעֲזָאזֵל का अर्थ
  choice: अज़ाज़ेल के लिए
  alternative: हटाए जाने के लिए; निर्जन स्थान की किसी सत्ता के लिए; बलि-बकरे के रूप में
  rationale: इस पद का अर्थ और संकेत विवादित है। लिप्यंतरण किसी विशेष धार्मिक व्याख्या को मुख्य पाठ में थोपे बिना मूल की अस्पष्टता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक-अनुष्ठानिक प्रसंग के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज भाषा। ‘वस्त्र’ और ‘छावनी’ जैसे प्रचलित बाइबिलीय शब्द रखे गए हैं।
