source:
  edition: WLC
  text: וְ/הָיְתָ֥ה לָ/כֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם בַּ/חֹ֣דֶשׁ הַ֠/שְּׁבִיעִי בֶּֽ/עָשׂ֨וֹר לַ/חֹ֜דֶשׁ תְּעַנּ֣וּ אֶת נַפְשֹֽׁתֵי/כֶ֗ם וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/029.yaml
  text: 'And this shall be for you a permanent statute: in the seventh month[a], on the tenth day of the month, you shall humble yourselves, and you shall do no work, whether the native-born or the sojourner who sojourns among you.'
translation:
  language: hi
  text: 'यह तुम्हारे लिए सदा की विधि होगी: सातवें महीने के दसवें दिन तुम अपने आप को दीन करो और कोई भी काम मत करो—चाहे देश में जन्मा व्यक्ति हो या तुम्हारे बीच रहने वाला परदेशी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיְתָה
  choice: यह ... होगी
  rationale: इस विधिक सूत्र में היה पिछली व्यवस्था की ओर संकेत करता है। हिन्दी में ‘यह ... होगी’ स्वाभाविक है और कोई नई विषयवस्तु नहीं जोड़ता।
- source_word: לְחֻקַּת עוֹלָם
  choice: सदा की विधि
  rationale: חֻקָּה निर्धारित विधान या विधि है, और עוֹלָם यहाँ निरंतर बने रहने वाली बाध्यता व्यक्त करता है। ‘सदा की विधि’ संक्षिप्त, गरिमापूर्ण और सहज हिन्दी है।
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: सातवें महीने के दसवें दिन
  rationale: इब्रानी कालदर्शी अभिव्यक्ति का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: תְּעַנּוּ אֶת נַפְשֹׁתֵיכֶם
  choice: तुम अपने आप को दीन करना
  rationale: पिएल ענה और נֶפֶשׁ का यह प्रयोग आत्म-दमन या स्वयं को दीन करने का व्यापक भाव रखता है। मुख्य पाठ इसे केवल उपवास तक सीमित नहीं करता; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וְכָל מְלָאכָה לֹא תַעֲשׂוּ
  choice: और कोई भी काम न करना
  rationale: מְלָאכָה सामान्य काम या श्रम को दर्शाता है। निषेधात्मक क्रिया का हिन्दी विधिक शैली में स्वाभाविक रूप ‘न करना’ है।
- source_word: הָאֶזְרָח
  choice: देश में जन्मा व्यक्ति
  rationale: אֶזְרָח समुदाय के देशज या जन्मजात सदस्य को दर्शाता है। यह रूप ‘नागरिक’ के आधुनिक कानूनी अर्थ से बचते हुए परदेशी के साथ मूल विरोध बनाए रखता है।
- source_word: הַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: तुम्हारे बीच रहने वाला परदेशी
  rationale: גֵּר इस्राएली समाज में रहने वाले बाहरी निवासी को दर्शाता है। ‘परदेशी’ हिन्दी बाइबलीय-कानूनी संदर्भ में सहज है, और ‘रहने वाला’ सजातीय क्रिया के बल को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: प्रायश्चित्त-दिवस की आत्म-दमन संबंधी आज्ञा का अर्थ
  choice: मुख्य पाठ में व्यापक अर्थ ‘अपने आप को दीन करना’ रखा गया है।
  alternative: ‘अपने प्राणों को दुःख देना’ अथवा इसे केवल ‘उपवास करना’ कहना।
  rationale: इब्रानी मुहावरा उपवास को समाहित कर सकता है, पर उसका अर्थ केवल उसी अनुष्ठान तक सीमित नहीं है। व्यापक अनुवाद मूल की अर्थ-सीमा और धार्मिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक शैली अपनाई गई है। ‘तुम ... करना’ जैसी संरचना आज्ञा/विधान का सीधा बल बनाए रखती है। मुख्य पाठ में अनावश्यक तकनीकी या सांप्रदायिक शब्दावली से बचा गया है।
