  yaml_path: translation/ot/leviticus/005/020.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: याहवे ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: यह क्रिया नए वाणी-खंड का आरम्भ करती है। हिन्दी में इसके साथ आए לֵאמֹר को अलग से दोहराए बिना ‘ने…कहा’ स्वाभाविक रूप से पूरी सूत्रात्मक अभिव्यक्ति देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन है; ‘याहवे’ उसका प्रचलित हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: वाणी के संबोधित व्यक्ति को आधुनिक हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया जाता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह आगामी प्रत्यक्ष वचन का परिचय देने वाला सूत्र है। अलग से ‘यह कहते हुए’ जोड़ना हिन्दी में अनावश्यक और बोझिल होगा; संयुक्त अभिव्यक्ति ‘ने…कहा’ इसका कार्य निभाती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पद में व्यक्तिगत ईश्वरीय नाम प्रत्यक्ष रूप से है। ‘याहवे’ मूल व्यंजनात्मक नाम का आधुनिक, व्यापक विद्वत्तापूर्ण लिप्यंतरण है; ‘प्रभु’ नाम को उपाधि से बदल देता, जबकि ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। हिब्रू के दोहरे वाणी-सूत्र को हिन्दी के स्वाभाविक ‘ने…कहा’ में समेटा गया है; अल्पविराम संकेत करता है कि कथन अगले पद में जारी है।
