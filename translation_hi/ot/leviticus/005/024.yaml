reference: Leviticus 5:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: א֠וֹ מִ/כֹּ֞ל אֲשֶׁר יִשָּׁבַ֣ע עָלָי/ו֮ לַ/שֶּׁקֶר֒ וְ/שִׁלַּ֤ם אֹת/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִשִׁתָ֖י/ו יֹסֵ֣ף עָלָ֑י/ו לַ/אֲשֶׁ֨ר ה֥וּא ל֛/וֹ יִתְּנֶ֖/נּוּ בְּ/י֥וֹם אַשְׁמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/024.yaml
  text: or anything about which he swore falsely—he shall repay it in full[a], and shall add a fifth to it. He shall give it to the one to whom it belongs on the day of his guilt offering.
translation:
  language: hi
  text: या ऐसी किसी भी वस्तु के विषय में जिसके बारे में उसने झूठी शपथ खाई हो—वह उसकी पूरी भरपाई करे और उसमें उसका पाँचवाँ भाग और जोड़ दे। अपने दोष के दिन[a] वह यह सब उसके असली मालिक को दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने दोषबलि के दिन।” इब्रानी पद दोष की अवस्था या उससे संबंधित दोषबलि की ओर संकेत कर सकता है।
    reason: इब्रानी אַשְׁמָה के नैतिक-कानूनी और बलिदान-संबंधी अर्थों की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: א֠וֹ מִכֹּ֞ל אֲשֶׁר
  choice: या ऐसी किसी भी वस्तु के विषय में
  rationale: यह पिछले पद की सूची को आगे बढ़ाता है और किसी भी संबंधित वस्तु या मामले की व्यापकता बनाए रखता है।
- source_word: יִשָּׁבַ֣ע עָלָי/ו֮ לַ/שֶּׁקֶר֒
  choice: जिसके बारे में उसने झूठी शपथ खाई हो
  rationale: עַל संबंधित वस्तु की ओर संकेत करता है और לַשֶּׁקֶר शपथ के झूठे होने को स्पष्ट करता है; यह हिंदी में स्वाभाविक कानूनी अभिव्यक्ति है।
- source_word: וְ/שִׁלַּ֤ם אֹת/וֹ֙ בְּ/רֹאשׁ֔/וֹ
  choice: वह उसकी पूरी भरपाई करे
  rationale: ‘उसके मूल/प्रधान भाग सहित’ एक कानूनी मुहावरा है जिसका आशय मूल वस्तु या उसके पूरे मूल्य की प्रतिपूर्ति करना है। ‘पूरी भरपाई’ वस्तु और मूल्य दोनों स्थितियों में स्वाभाविक है।
- source_word: וַ/חֲמִשִׁתָ֖י/ו יֹסֵ֣ף עָלָ֑י/ו
  choice: और उसमें उसका पाँचवाँ भाग और जोड़ दे
  rationale: मूल भरपाई के ऊपर बीस प्रतिशत अतिरिक्त देने की मांग को सीधे व्यक्त करता है।
- source_word: לַ/אֲשֶׁ֨ר ה֥וּא ל֛/וֹ
  choice: उसके असली मालिक को
  rationale: शाब्दिक भाव ‘जिसका वह है’ है; ‘असली मालिक’ वैध स्वामित्व और प्रतिपूर्ति पाने वाले व्यक्ति को स्पष्ट, सहज हिंदी में व्यक्त करता है।
- source_word: יִתְּנֶ֖/נּוּ
  choice: वह यह सब ... दे
  rationale: यह क्रिया पूरी प्रतिपूर्ति और जोड़े गए पाँचवें भाग को अधिकार रखने वाले व्यक्ति को सौंपने की बात करती है; ‘यह सब’ हिंदी में संयुक्त रकम को स्पष्ट करता है।
- source_word: בְּ/י֥וֹם אַשְׁמָתֽ/וֹ
  choice: अपने दोष के दिन
  rationale: אַשְׁמָה का सीधा अर्थ दोष या अपराध-दशा है। यह अनुवाद मूल की संक्षिप्तता और अस्पष्टता को बनाए रखता है; बलिदान-संबंधी अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: בְּיוֹם אַשְׁמָתוֹ में אַשְׁמָה का अर्थ
  choice: अपने दोष के दिन
  alternative: अपने दोषबलि के दिन
  rationale: इब्रानी रूप सीधे ‘उसका दोष’ कह सकता है, जबकि लैव्यव्यवस्था का निकटवर्ती बलिदान-संदर्भ दोषबलि की ओर भी संकेत कर सकता है। मुख्य पाठ में ‘दोष’ रखने से शब्द का सामान्य अर्थ और मूल की धर्मवैधानिक तनावपूर्ण अस्पष्टता सुरक्षित रहती है; वैकल्पिक अनुष्ठानिक अर्थ पादटिप्पणी में है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। कानूनी अर्थ को व्यक्त करने के लिए ‘पूरी भरपाई’ और ‘असली मालिक’ जैसे सहज पद चुने गए हैं; पादटिप्पणी-चिह्न उसी स्थान पर रखा गया है जहाँ स्रोत-पाठ में अर्थगत अस्पष्टता है।
