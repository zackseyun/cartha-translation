  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। विधिक निर्देश के लिए ‘लाए’ और ‘करे’ का प्रयोग हुआ है। ‘दोष-बलि’ और ‘पाप-बलि’ में मूल पाठ का पारिभाषिक भेद बनाए रखा गया है; पशु के मादा होने की स्पष्ट सूचना भी सुरक्षित है।
