  text: וְ/הֵבִ֣יא אֶת אֲשָׁמ֣/וֹ לַ/יהוָ֡ה עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א נְקֵבָ֨ה מִן הַ/צֹּ֥אן כִּשְׂבָּ֛ה אֽוֹ שְׂעִירַ֥ת עִזִּ֖ים לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן מֵ/חַטָּאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/006.yaml
  text: 'and he shall bring his guilt offering to Yahweh for his sin that he has committed: a female from the flock[a], a lamb or a female goat, for a sin offering[b]; and the priest shall make atonement for him for his sin.'
translation:
  language: hi
  text: 'और उसने जो पाप किया है, उसके लिए वह यहोवा के लिए अपनी दोष-बलि[a] चढ़ाए: भेड़-बकरियों के झुंड में से एक मादा, अर्थात् एक मादा भेड़ या एक मादा बकरी, पाप-बलि के रूप में; और याजक उसके लिए उसके पाप के लिए[b] प्रायश्चित करे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने दोष के लिए भेंट” अथवा “अपनी क्षतिपूर्ति-भेंट।” यहाँ हिब्रू शब्द אשם दोष और क्षतिपूर्ति से जुड़ा है, जबकि इसी पद में पशु को आगे “पाप-बलि” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसके पाप से।” यह प्रायश्चित के परिणामस्वरूप पाप से मुक्ति का भाव भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: वह ... लाए
  rationale: विधिक प्रसंग में हिफ़ील रूप आदेशात्मक/अनिवार्य भाव रखता है; हिंदी में सम्मानसूचक विधिलिंग ‘लाए’ इस निर्देश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשָׁמוֹ
  choice: अपना दोष-बलि
  rationale: אשם दोष, क्षतिपूर्ति अथवा उससे संबद्ध बलि को सूचित कर सकता है। यहाँ इसे बलिदानी पद के रूप में रखना, आगे आए חטאת ‘पाप-बलि’ के साथ मूल पाठ के तनाव को सुरक्षित रखता है।
- source_word: לַיהוָה
  choice: यहोवा के पास
  rationale: दिव्य नाम יהוה को ‘यहोवा’ के रूप में लिप्यंतरित किया गया है; ‘के पास ... लाए’ चढ़ावे को परमेश्वर के सम्मुख लाने का स्वाभाविक हिंदी प्रयोग है।
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: उसने जो पाप किया है, उसके लिए
  rationale: संजातीय हिब्रू रचना को सहज हिंदी में व्यक्त करते हुए पाप और उसके किए जाने—दोनों स्पष्ट रखे गए हैं।
- source_word: נְקֵבָה מִן הַצֹּאן
  choice: भेड़-बकरियों के झुंड में से एक मादा
  rationale: צאן छोटे पालतू पशुओं, विशेषतः भेड़ और बकरियों, को दर्शाता है; नְקֵבָה द्वारा पशु का मादा होना स्पष्टतः सुरक्षित है।
- source_word: כִשְׂבָּה
  choice: एक मादा मेमना
  rationale: शब्द मादा भेड़ के बच्चे को दर्शाता है। ‘मादा मेमना’ आधुनिक पाठक के लिए स्पष्ट है और लिंग-सूचना बनाए रखता है।
- source_word: אוֹ שְׂעִירַת עִזִּים
  choice: या एक मादा बकरी
  rationale: हिब्रू पद स्पष्ट रूप से मादा बकरी निर्दिष्ट करता है; सरल आधुनिक हिंदी में यही सीधा समतुल्य है।
- source_word: לְחַטָּאת
  choice: पाप-बलि के रूप में
  rationale: बलिदानी संदर्भ में חטאת पाप अथवा शुद्धिकरण-बलि का तकनीकी नाम है। ‘पाप-बलि’ परिचित है, जबकि ‘के रूप में’ उपसर्ग ל की भूमिका बताता है।
- source_word: וְכִפֶּר עָלָיו
  choice: याजक ... उसके लिए प्रायश्चित करे
  rationale: याजकीय बलिदानी संदर्भ में כפר के लिए ‘प्रायश्चित करना’ धार्मिक अर्थ को किसी संकीर्ण प्रायश्चित-सिद्धांत में बाँधे बिना सुरक्षित रखता है।
- source_word: מֵחַטָּאתוֹ
  choice: उसके पाप के कारण
  rationale: מן यहाँ अपराध से संबंध अथवा उससे मुक्ति का भाव दे सकता है। मुख्य पाठ में ‘पाप के कारण’ सहज है; अधिक शाब्दिक निष्कासन-सूचक संभावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: एक ही पद में אשם और חטאת का प्रयोग
  choice: אשם के लिए ‘दोष-बलि’ और חטאת के लिए ‘पाप-बलि’ अलग-अलग रखा गया
  alternative: אשם को ‘दोष के लिए भेंट’ कहना, या חטאת को ‘शुद्धिकरण-बलि’ कहना
  rationale: मूल पाठ दोनों पदों को साथ रखता है। उन्हें एक ही शब्द में मिला देना या तनाव हटाना स्रोत की महत्त्वपूर्ण विशेषता को छिपा देता।
- issue: मֵחַטָּאתוֹ में प्रायश्चित और पाप से मुक्ति का संबंध
  choice: मुख्य पाठ में ‘उसके पाप के कारण’
  alternative: ‘उसके पाप से’
  rationale: हिब्रू מן संबंध/कारण के साथ पाप से छुटकारे की परिणति का संकेत भी दे सकता है। अस्पष्टता पादटिप्पणी में संरक्षित की गई है।
- issue: दिव्य नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत दिव्य नाम को उपाधि में बदलने के बजाय प्रचलित हिंदी लिप्यंतरण द्वारा सुरक्षित रखा गया है।
