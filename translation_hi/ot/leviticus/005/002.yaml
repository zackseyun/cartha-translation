id: LEV.5.2
reference: Leviticus 5:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּ/כָל דָּבָ֣ר טָמֵא֒ אוֹ֩ בְ/נִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֤וֹ בְּ/נִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּ/נִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא טָמֵ֖א וְ/אָשֵֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/002.yaml
  text: Or if a person touches any unclean thing—whether the carcass of an unclean wild animal[a], or the carcass of unclean livestock, or the carcass of an unclean swarming creature—and it is hidden from him, and he is unclean and becomes guilty[b],
translation:
  language: hi
  text: या यदि कोई व्यक्ति किसी अशुद्ध वस्तु को छू ले—चाहे किसी अशुद्ध जंगली पशु के मरे हुए शरीर को, या अशुद्ध पालतू पशु के मरे हुए शरीर को, या किसी अशुद्ध रेंगनेवाले जीव के मरे हुए शरीर को—और यह बात उससे छिपी रहे[a], और वह अशुद्ध और दोषी हो जाए[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वह इससे अनजान हो; शाब्दिक रूप से, “यह बात उससे छिपी रहे।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात उस अशुद्धता के कारण वह विधिक दोष का भागी होता है; इसका यह अर्थ नहीं कि मरे हुए पशु के शरीर को छूना अपने आप में जानबूझकर किए गए नैतिक पाप के समान है।
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: कोई व्यक्ति
  rationale: विधिक प्रसंग में यह शब्द संपूर्ण व्यक्ति या किसी व्यक्ति-विशेष को सूचित करता है, न कि केवल अमूर्त ‘आत्मा’ को।
- source_word: תִּגַּע בְּ
  choice: को छू ले
  rationale: נגע के साथ בְּ शारीरिक संपर्क को दर्शाता है; ‘छू ले’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: כָל דָּבָר טָמֵא
  choice: किसी अशुद्ध वस्तु
  rationale: דָּבָר यहाँ एक व्यापक श्रेणी है, जिसे आगे पशुओं की लोथों के उदाहरणों से स्पष्ट किया गया है।
- source_word: נִבְלַת
  choice: की लोथ
  rationale: लैव्यव्यवस्था के शुद्धता-विधान में נְבֵלָה मरे हुए पशु के शरीर को दर्शाता है; ‘लोथ’ संक्षिप्त तथा प्रसंगानुकूल है।
- source_word: חַיָּה טְמֵאָה
  choice: अशुद्ध वन-पशु
  rationale: חַיָּה का यहाँ בְּהֵמָה से भेद है और यह जंगली स्थल-पशु को सूचित करता है; ‘वन-पशु’ इस भेद को स्पष्ट रखता है।
- source_word: בְּהֵמָה טְמֵאָה
  choice: अशुद्ध पालतू पशु
  rationale: בְּהֵמָה यहाँ मनुष्य द्वारा पाले जानेवाले चौपायों की श्रेणी है और वन-पशु के साथ विरोध को बनाए रखती है।
- source_word: שֶׁרֶץ טָמֵא
  choice: अशुद्ध रेंगनेवाला जीव
  rationale: שֶׁרֶץ छोटे रेंगने या बहुतायत में चलनेवाले जीवों की विधिक श्रेणी को दर्शाता है; यह हिन्दी में समझने योग्य पारंपरिक समतुल्य है।
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: यह बात उससे छिपी रहे
  rationale: यह मूल पाठ की निष्क्रिय अभिव्यक्ति को बनाए रखता है और प्रसंग में व्यक्ति की अनभिज्ञता का अर्थ देता है।
- source_word: וְהוּא טָמֵא
  choice: तो वह अशुद्ध है
  rationale: यह अनुष्ठानिक स्थिति को बताता है। संयोजक का ‘तो’ अनभिज्ञता के बावजूद विद्यमान परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे नैतिक पाप ठहराए।
- source_word: וְאָשֵׁם
  choice: और दोषी ठहरता है
  rationale: אָשֵׁם यहाँ विधिक दोष या दायित्व की स्थिति को दर्शाता है; यह अनिवार्य रूप से जानबूझकर किए गए नैतिक अपराध का अर्थ नहीं देता।
theological_decisions:
- issue: अशुद्धता का स्वरूप
  choice: טָמֵא/טְמֵאָה के लिए ‘अशुद्ध’
  alternative: अपवित्र; दूषित; पापी
  rationale: यह पद लोथ के संपर्क से उत्पन्न अनुष्ठानिक अशुद्धता के विषय में है। ‘अशुद्ध’ लैव्यव्यवस्था की विधिक श्रेणी को व्यक्त करता है और इसे अपने आप नैतिक बुराई नहीं बनाता।
- issue: וְאָשֵׁם में दोष का अर्थ
  choice: ‘दोषी ठहरता है’, साथ में स्पष्टीकरणात्मक पादटिप्पणी
  alternative: पापी हो जाता है; अपराध करता है; दोष का भागी होता है
  rationale: मूल शब्द विधिक दोष या दायित्व का संकेत दे सकता है। अनुष्ठानिक अशुद्धता और जानबूझकर किए गए नैतिक पाप को एक मान लेना पाठ के तनाव को अनुचित रूप से सुलझा देगा।
- issue: व्यक्ति का व्याकरणिक लिंग
  choice: आरंभ में ‘कोई व्यक्ति’ और आगे एकवचन ‘वह’
  alternative: कोई मनुष्य; कोई जन
  rationale: נֶפֶשׁ का दायरा सामान्य व्यक्ति है। हिन्दी का ‘वह’ स्वाभाविक रूप से सामान्य एकवचन संदर्भ को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज विधिक शैली अपनाई गई है। ‘लोथ’, ‘वन-पशु’, ‘पालतू पशु’ और ‘रेंगनेवाला जीव’ से मूल की पशु-श्रेणियों का भेद रखा गया है। पद अगले वाक्य से जुड़ता है, इसलिए अंत में अर्धविराम रखा गया है।
