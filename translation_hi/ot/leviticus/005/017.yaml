source:
  edition: WLC
  text: וְ/אִם נֶ֨פֶשׁ֙ כִּ֣י תֶֽחֱטָ֔א וְ/עָֽשְׂתָ֗ה אַחַת֙ מִ/כָּל מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/לֹֽא יָדַ֥ע וְ/אָשֵׁ֖ם וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/017.yaml
  text: And if a person sins and does any one of all the things that by Yahweh’s commandments must not be done[a], though he did not know it[b], then he is guilty and shall bear his iniquity.
translation:
  language: hi
  text: यदि कोई व्यक्ति पाप करे और याहवे की आज्ञाओं के विरुद्ध उन कामों में से कोई एक काम करे जिन्हें नहीं किया जाना चाहिए, और उसे इसका पता न हो, तो भी वह दोषी ठहरेगा[a] और अपने अधर्म का भार उठाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दोष का भागी होगा’ अथवा ‘अपने ऊपर दोष ले आएगा।’ इब्रानी शब्द अपराध के कारण दोषी और उत्तरदायी हो जाने का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने दोष का भार उठाएगा।’ इब्रानी मुहावरा गलत काम के दोष, उत्तरदायित्व या परिणाम को उठाने के अर्थ में हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: कोई व्यक्ति
  rationale: यहाँ נֶפֶשׁ का अर्थ किसी व्यक्तिगत मनुष्य से है, न कि मनुष्य के अभौतिक ‘प्राण’ या ‘आत्मा’ पर विशेष बल देने से।
- source_word: תֶחֱטָא
  choice: पाप करे
  rationale: याजकीय कानूनी संदर्भ में חטא के सीधे और स्वाभाविक अर्थ को व्यक्त करता है।
- source_word: וְעָשְׂתָה אַחַת מִכָּל
  choice: उन सभी कामों में से ... कोई एक काम कर बैठे
  rationale: यह वाक्यांश निषिद्ध कामों में से किसी एक को करने के वितरणात्मक भाव को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִצְוֺת יְהוָה
  choice: याहवे की आज्ञा
  rationale: מִצְוֺת को कानूनी-वाचा संबंधी संदर्भ में ‘आज्ञा’ और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: जिन्हें ... नहीं किया जाना चाहिए
  rationale: यह निषिद्ध कार्यों के कानूनी भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא יָדַע
  choice: और उसे इसका पता न हो
  rationale: यह अपराध के विषय में व्यक्ति की अनभिज्ञता को व्यक्त करता है और हिन्दी में आवश्यक संदर्भसूचक ‘इसका’ जोड़ता है।
- source_word: וְאָשֵׁם
  choice: तो भी वह दोषी ठहरेगा
  rationale: אָשֵׁם यहाँ अनजाने में किए गए अपराध से उत्पन्न दोष अथवा उत्तरदायित्व को दर्शाता है; ‘तो भी’ इस बात को स्पष्ट करता है कि अनभिज्ञता दोष को समाप्त नहीं करती।
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: अपने अधर्म का भार उठाएगा
  rationale: यह נשׂא עון की गंभीर कानूनी-वाचा संबंधी उपमा को बनाए रखता है और दोष के उत्तरदायित्व अथवा परिणाम सहने का भाव देता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत वाचा-नाम יהוה है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: अनजाने पाप के बावजूद दोष
  choice: और उसे इसका पता न हो, तो भी वह दोषी ठहरेगा
  alternative: और उसे इसका पता न हो; फिर वह दोषी हो जाए
  rationale: पाठ अनभिज्ञता और दोष दोनों को साथ रखता है। अनुवाद इस तनाव को बनाए रखता है और यह नहीं बताता कि व्यक्ति किस बात से अनजान था—आज्ञा से या अपने किए हुए काम के निषिद्ध होने से।
- issue: וְנָשָׂא עֲוֺנוֹ में दोष और परिणाम का संबंध
  choice: अपने अधर्म का भार उठाएगा
  alternative: अपने दोष का भार उठाएगा; अपने अपराध का परिणाम भोगेगा
  rationale: शाब्दिक उपमा दोष, उत्तरदायित्व और परिणाम—इन परस्पर जुड़े अर्थों को खुला रखती है, किसी एक अर्थ तक सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कानूनी शैली की गंभीरता बनाए रखने के लिए ‘दोषी ठहरेगा’ और मूल उपमा की शक्ति बनाए रखने के लिए ‘अधर्म का भार उठाएगा’ चुना गया है।
