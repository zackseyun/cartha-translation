source:
  edition: WLC
  text: אֽוֹ מָצָ֧א אֲבֵדָ֛ה וְ/כִ֥חֶשׁ בָּ֖/הּ וְ/נִשְׁבַּ֣ע עַל שָׁ֑קֶר עַל אַחַ֗ת מִ/כֹּ֛ל אֲשֶׁר יַעֲשֶׂ֥ה הָ/אָדָ֖ם לַ/חֲטֹ֥א בָ/הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/022.yaml
  text: or he finds lost property and lies about it and swears falsely—about any one of all the things that a man may do to sin by them—
translation:
  language: hi
  text: या उसे कोई खोई हुई वस्तु मिले और वह उसके विषय में झूठ बोले और झूठी शपथ खाए—उन सब बातों में से किसी एक के विषय में, जिनके द्वारा मनुष्य पाप करता है—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבֵדָה
  choice: खोई हुई वस्तु
  rationale: संज्ञा का अर्थ ऐसी संपत्ति या वस्तु है जो उसके स्वामी से खो गई हो; यह सहज और पर्याप्त व्यापक हिन्दी है।
- source_word: וְכִחֶשׁ בָּהּ
  choice: और वह उसके विषय में झूठ बोले
  rationale: כחש यहाँ मिली हुई वस्तु के संबंध में असत्य कहने या उसे नकारने का भाव देता है; स्त्रीलिंग सर्वनाम का संकेत हिन्दी में ‘उसके विषय में’ से स्वाभाविक रूप में रखा गया है।
- source_word: וְנִשְׁבַּע עַל־שָׁקֶר
  choice: और झूठी शपथ खाए
  rationale: यह अभिव्यक्ति असत्य बात की शपथ खाने को बताती है; प्रचलित और गरिमापूर्ण हिन्दी मुहावरा चुना गया है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ सामान्य मानव-व्यक्ति का उल्लेख है; ‘मनुष्य’ स्रोत की सामूहिक/सामान्य प्रकृति को बिना अनावश्यक लैंगिक संकीर्णता के व्यक्त करता है।
- source_word: לַחֲטֹא בָהֵנָּה
  choice: जिन्हें करके मनुष्य पाप करता है
  rationale: शाब्दिक ‘उनके द्वारा पाप करना’ को स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि साधनात्मक संबंध सुरक्षित है।
theological_decisions:
- issue: הָאָדָם का सामान्य या पुरुष-विशिष्ट अर्थ
  choice: मनुष्य
  alternative: आदमी
  rationale: संदर्भ किसी भी मानव द्वारा किए जा सकने वाले अपराधों का सामान्य विधान है; ‘मनुष्य’ मूल के व्यापक अर्थ और विधिक गरिमा दोनों को बनाए रखता है।
- issue: पद का अगले पद से वाक्यगत संबंध
  choice: अंत में दीर्घ विराम-चिह्न रखकर वाक्य को खुला रखा गया
  alternative: पूर्णविराम लगाकर स्वतंत्र वाक्य बनाना
  rationale: इब्रानी संरचना अगले पद में परिणाम की ओर बढ़ती है; इसे स्वतंत्र पूर्ण वाक्य बनाना स्रोत के वाक्य-संबंध को छिपा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक प्रसंग के अनुरूप स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज। स्रोत की पुनरुक्ति और अगले पद की ओर बढ़ती अधूरी वाक्य-रचना को यथासंभव सुरक्षित रखा गया है।
