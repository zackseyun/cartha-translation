  yaml_path: translation/ot/leviticus/005/019.yaml
  text: It is a guilt offering[a]; he has indeed incurred guilt against Yahweh.
translation:
  language: hi
  text: यह दोष-बलि है[a]; वह निश्चय ही यहोवा के प्रति दोषी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह दोष-बलि है; वह निश्चय ही यहोवा के विरुद्ध दोषी है।” इब्रानी में “दोष-बलि” और “दोषी” के लिए एक ही मूल शब्द אשם की पुनरावृत्ति कथन पर बल देती है।
    reason: मूल में संज्ञा और क्रिया की शब्दगत पुनरावृत्ति तथा לַיהוָה के ‘के प्रति/के विरुद्ध’ अर्थ-विकल्प को स्पष्ट करना।
lexical_decisions:
- source_word: אָשָׁם
  choice: दोष-बलि
  rationale: बलिदान-संबंधी प्रसंग में यह संज्ञा दोष के कारण चढ़ाई जाने वाली विशिष्ट बलि को दर्शाती है। ‘दोष-बलि’ प्रचलित, संक्षिप्त और मूल शब्द की ‘दोष’ संबंधी पुनरावृत्ति को बनाए रखता है।
- source_word: הוּא
  choice: यह ... है
  rationale: सर्वनाम यहाँ विधेयात्मक रूप से बलि की पहचान कराता है; आधुनिक हिन्दी में ‘यह दोष-बलि है’ स्वाभाविक है।
- source_word: אָשֹׁם אָשַׁם
  choice: निश्चय ही ... दोषी ठहरा है
  rationale: एक ही धातु के पूर्ण क्रियार्थक रूप और सीमित क्रिया का मेल कथन पर बल देता है। ‘निश्चय ही’ उस प्रबलता को व्यक्त करता है, और ‘दोषी ठहरा है’ वास्तविक दोष-दायित्व का भाव देता है।
- source_word: לַיהוָה
  choice: यहोवा के प्रति
  rationale: ל यहाँ यहोवा के संबंध में व्यक्ति के दोष-दायित्व को सूचित करता है। ‘के प्रति’ उस संबंध को बनाए रखता है और ‘के विरुद्ध’ की अपेक्षा अनावश्यक रूप से प्रत्यक्ष शत्रुता का अर्थ नहीं जोड़ता।
- source_word: יהוה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को नाम के रूप में प्रस्तुत किया गया है; यह सामान्य उपाधि ‘प्रभु’ से उसका भेद भी बनाए रखता है।
theological_decisions:
- issue: אשם के साथ לַיהוָה का अर्थ-संबंध
  choice: व्यक्ति यहोवा के प्रति दोषी ठहरा है
  alternative: वह निश्चय ही यहोवा के विरुद्ध दोषी है; अथवा यह यहोवा के लिए दोष-बलि है
  rationale: शब्द-क्रम में לַיהוָה निकटतम क्रियात्मक कथन אָשֹׁם אָשַׁם से जुड़ता है और यहोवा के संबंध में वास्तविक दोष-दायित्व बताता है। ‘के प्रति’ मूल की कुछ व्यापकता बनाए रखता है, जबकि टिप्पणी में अधिक आरोपात्मक ‘के विरुद्ध’ विकल्प दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दोष-बलि’ तकनीकी बलिदानी पद है, और ‘निश्चय ही’ इब्रानी की जोरदार पुनरुक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
