  choice: जब वह पाप करे और दोषी ठहरे
  alternative: यदि वह पाप करके दोषी हो जाए
  rationale: मुख्य पाठ में अपेक्षित मामले को प्रस्तुत करने वाला ‘जब’ और कानूनी दोष का ‘दोषी ठहरे’ रखा गया है; मूल की सशर्त तथा दायित्व-संबंधी सम्भावना पादटिप्पणी में दी गई है।
