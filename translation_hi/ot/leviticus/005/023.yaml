base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/023.yaml
  text: And it shall be[a], when he sins and becomes guilty, that he shall restore what he took by robbery, or what he extorted, or the deposit that was entrusted to him, or the lost thing that he found[c][b],
translation:
  language: hi
  text: और ऐसा होगा[a] कि जब वह पाप करे और दोषी ठहरे, तब वह उस वस्तु को लौटा दे जो उसने लूट ली थी, या वह वस्तु जिसे उसने अन्याय से हड़प लिया था[b], या वह अमानत जो उसके पास रखी गई थी, या वह खोई हुई वस्तु जो उसे मिली थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि वह पाप करे और दोषी हो जाए।” इब्रानी की विधिक अभिव्यक्ति का अनुवाद “जब” या “यदि” किया जा सकता है; “दोषी ठहरे” का अर्थ “दोष का भागी हो जाए” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिसे उसने दबाव या छल से प्राप्त किया था।” इब्रानी शब्द किसी दूसरे की संपत्ति को दमनकारी, अनुचित, या कपटपूर्ण ढंग से लेने अथवा रोक रखने का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और ऐसा होगा कि जब
  rationale: इब्रानी की विधिक प्रसंग आरम्भ करने वाली शैली को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक रूप दिया गया है; כִּי को मुख्य पाठ में ‘जब’ रखा गया है, जबकि ‘यदि’ की वास्तविक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: יֶחֱטָא
  choice: वह पाप करे
  rationale: यह חטא के नैतिक और वाचा-संबंधी अर्थ को स्पष्ट रूप से बनाए रखता है।
- source_word: וְאָשֵׁם
  choice: दोषी ठहरे
  rationale: यह कानूनी रूप से दोष या दायित्व में आने का भाव व्यक्त करता है और इसे केवल अपराध-बोध की अनुभूति तक सीमित नहीं करता।
- source_word: וְהֵשִׁיב
  choice: लौटा दे
  rationale: सम्पत्ति वापस करने की कानूनी बाध्यता को सहज हिन्दी में व्यक्त करता है।
- source_word: הַגְּזֵלָה אֲשֶׁר גָּזָל
  choice: उस वस्तु को ... जिसे उसने लूटा था
  rationale: मूल के संज्ञा-क्रिया युग्म का आशय रखते हुए अनावश्यक और अस्वाभाविक पुनरुक्ति से बचता है।
- source_word: הָעֹשֶׁק אֲשֶׁר עָשָׁק
  choice: जिसे उसने अत्याचार करके हड़प लिया था
  rationale: עשׁק में निहित दमन, शोषण अथवा कपटपूर्ण ढंग से दूसरे की सम्पत्ति लेने या रोक रखने का भाव इस सम्पत्ति-विधि के प्रसंग में स्पष्ट करता है।
- source_word: הַפִּקָּדוֹן אֲשֶׁר הָפְקַד אִתּוֹ
  choice: वह धरोहर जो उसके पास सौंपी गई थी
  rationale: किसी की देखरेख में रखी गई सम्पत्ति के अर्थ को सामान्य और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הָאֲבֵדָה אֲשֶׁר מָצָא
  choice: वह खोई हुई वस्तु जो उसे मिली थी
  rationale: मिली हुई खोई सम्पत्ति का सीधा अर्थ बनाए रखता है, बिना ‘सम्पत्ति’ को मुख्य पाठ में अनिवार्य रूप से जोड़ने के।
theological_decisions:
