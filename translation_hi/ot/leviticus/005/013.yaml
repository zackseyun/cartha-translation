  yaml_path: translation/ot/leviticus/005/013.yaml
  text: Thus the priest shall make atonement for him for his sin that he committed in any one of these matters[a], and he shall be forgiven. And it shall belong to the priest, like the grain offering.
translation:
  language: hi
  text: इस प्रकार याजक उसके लिए उसके उस पाप के लिए प्रायश्चित करे जो उसने इन बातों में से किसी एक में किया है, और उसे क्षमा किया जाएगा। वह भेंट अन्नबलि के समान याजक की होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו
  choice: उसके लिए ... प्रायश्चित करे
  rationale: याजकीय बलिदान-संदर्भ में כפר עַל अपराधी की ओर से प्रायश्चित करने को व्यक्त करता है। यह प्रचलित हिंदी धार्मिक शब्दावली में अनुष्ठानिक अर्थ को बिना किसी विशिष्ट प्रायश्चित-सिद्धांत को थोपे बनाए रखता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था की उपासना-संबंधी विधियों में כֹּהֵן का मानक और स्वाभाविक हिंदी रूप।
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: उसके उस पाप के कारण जो उसने ... किया है
  rationale: यहाँ חַטָּאתוֹ के बाद אֲשֶׁר חָטָא आने से आशय भेंट की अपेक्षा किए गए पाप से है। हिंदी में 'पाप करना' स्वाभाविक प्रयोग है।
- source_word: מֵאַחַת מֵאֵלֶּה
  choice: इन बातों में से किसी एक में
  rationale: यह पद पहले गिनाए गए मामलों की ओर संकेत करता है और हिब्रू के अंशवाचक भाव को सुरक्षित रखता है।
- source_word: וְנִסְלַח לוֹ
  choice: और उसे क्षमा किया जाएगा
  rationale: यह निष्क्रिय रूप क्षमा पाने के परिणाम को व्यक्त करता है और हिब्रू की तरह क्षमा करने वाले का स्पष्ट नाम नहीं जोड़ता।
- source_word: וְהָיְתָה לַכֹּהֵן
  choice: और वह ... याजक की होगी
  rationale: स्त्रीलिंग क्रिया उस भेंट अथवा उसके अंश की ओर संकेत करती है और याजक के अधिकार को स्वाभाविक हिंदी में व्यक्त करती है।
- source_word: כַּמִּנְחָה
  choice: अन्नबलि के समान
  rationale: लैव्यव्यवस्था के अनुष्ठानिक संदर्भ में מִנְחָה विशेष रूप से अन्नबलि को दर्शाता है।
theological_decisions:
- issue: बलिदान के बाद क्षमा के सूत्र का अनुवाद
  choice: और उसे क्षमा किया जाएगा
  alternative: और उसका पाप क्षमा किया जाएगा
  rationale: हिब्रू निष्क्रिय रूप है और क्षमा करने वाले को स्पष्ट रूप से नहीं बताता। चुना हुआ अनुवाद अपराधी के क्षमा किए जाने को व्यक्त करते हुए उसी संयम को बनाए रखता है; वैकल्पिक रूप में पाप को व्याकरणिक विषय बनाना आवश्यक नहीं है।
- issue: חַטָּאתוֹ का अर्थ
  choice: उसका पाप
  alternative: उसकी पापबलि
  rationale: सापेक्ष उपवाक्य 'जो उसने किया' अपराध की ओर संकेत करता है, इसलिए यहाँ 'पाप' अधिक उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, विधिक-उपासना संबंधी शैली। 'याजक', 'प्रायश्चित' और 'अन्नबलि' जैसे परिचित बाइबलीय शब्द रखे गए हैं। हिब्रू के निष्क्रिय क्षमा-सूत्र में परमेश्वर को स्पष्ट कर्ता के रूप में नहीं जोड़ा गया है।
