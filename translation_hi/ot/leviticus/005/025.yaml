id: LEV.5.25
reference: Leviticus 5:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֶת אֲשָׁמ֥/וֹ יָבִ֖יא לַ/יהוָ֑ה אַ֣יִל תָּמִ֧ים מִן הַ/צֹּ֛אן בְּ/עֶרְכְּ/ךָ֥ לְ/אָשָׁ֖ם אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/025.yaml
  text: 'And he shall bring his guilt offering to Yahweh: a flawless ram from the flock[a], according to your valuation, as a guilt offering[b], to the priest.'
translation:
  language: hi
  text: और वह याहवे के लिये अपना दोष-बलिदान—झुंड में से एक निर्दोष मेढ़ा, तुम्हारे आकलन के अनुसार, दोष-बलिदान के रूप में—याजक के पास लाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשָׁמוֹ
  choice: अपना दोष-बलिदान
  rationale: यहाँ אָשָׁם दोष, क्षतिपूर्ति और उस हेतु चढ़ाए जाने वाले विशेष बलिदान—इन परस्पर जुड़े अर्थों को व्यक्त कर सकता है। आगे मेढ़े का स्पष्ट उल्लेख होने के कारण ‘अपना दोष-बलिदान’ स्वाभाविक और पारंपरिक बलिदानी पद है।
- source_word: יָבִיא
  choice: लाए
  rationale: हिफ़ील अपूर्ण क्रिया का यहाँ विधिक-आदेशात्मक बल है; हिंदी में ‘लाए’ इसे सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा के पास
  rationale: प्रत्यक्ष ईश्वरीय नाम יהוה को उसके प्रचलित हिंदी रूप ‘यहोवा’ से प्रस्तुत किया गया है; לְ की दिशात्मकता को ‘के पास’ व्यक्त करता है।
- source_word: אַיִל תָּמִים
  choice: एक निर्दोष मेढ़ा
  rationale: אַיִל नर भेड़ अर्थात मेढ़ा है, और תָּמִים बलिदानी संदर्भ में शारीरिक दोष से रहित तथा स्वीकार्य होने को सूचित करता है।
- source_word: מִן הַצֹּאן
  choice: झुंड में से
  rationale: צֹאן छोटे पालतू पशुओं के झुंड का सामूहिक पद है; אַיִל पहले ही पशु को मेढ़ा निर्धारित करता है।
- source_word: בְּעֶרְכְּךָ
  choice: तुम्हारे ठहराए हुए मूल्य के अनुसार
  rationale: द्वितीय पुरुष प्रत्यय को बनाए रखते हुए मूल्यांकन या निर्धारित मूल्य का विधिक आशय स्पष्ट किया गया है।
- source_word: לְאָשָׁם
  choice: दोष-बलिदान के रूप में
  rationale: यहाँ אָשָׁם मेढ़े की विशिष्ट बलिदानी श्रेणी या कार्य को दर्शाता है।
- source_word: אֶל הַכֹּהֵן
  choice: याजक के पास
  rationale: दिशात्मक वाक्यांश बताता है कि पशु officiating याजक के पास प्रस्तुत किया जाना है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा-संबंधी नाम सीधे आया है। हिंदी पाठकों के लिए स्थापित नामरूप ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: एक ही पद में אָשָׁם के दो प्रयोग
  choice: दोनों स्थानों पर ‘दोष-बलिदान’, जबकि दूसरे में ‘के रूप में’ द्वारा कार्य स्पष्ट
  alternative: पहले ‘क्षतिपूर्ति-भेंट’ और दूसरे में ‘दोष-बलिदान’
  rationale: दोनों प्रयोगों में दोष और प्रतिपूर्ति का अर्थक्षेत्र मौजूद है, पर संदर्भ में पहले से निर्दिष्ट मेढ़ा बलिदानी भेंट है। एक समान पदावली शाब्दिक संबंध बनाए रखती है और ‘के रूप में’ दूसरा प्रयोग श्रेणी-सूचक बनाता है।
- issue: תָּמִים का बलिदानी अर्थ
  choice: निर्दोष
  alternative: बिना किसी दोष का; निष्कलंक
  rationale: यह पशु की बलिदानी स्वीकार्यता और बाहरी दोष से रहित अवस्था को व्यक्त करता है; नैतिक पापहीनता का अतिरिक्त दावा अभिप्रेत नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी, विधिक-बलिदानी प्रसंग के अनुरूप गरिमापूर्ण शैली। ‘दोष-बलिदान’, ‘मेढ़ा’ और ‘याजक’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं। वाक्यक्रम मूल की प्रस्तुति-गतिशीलता को यथासंभव बनाए रखता है।
