revisions:
- from: 'और वह यहोवा के पास अपना दोष-बलिदान लाए: झुंड में से एक निर्दोष मेढ़ा, तुम्हारे ठहराए हुए मूल्य के अनुसार, दोष-बलिदान के रूप में, याजक के पास।'
  to: और वह याहवे के लिये अपना दोष-बलिदान—झुंड में से एक निर्दोष मेढ़ा, तुम्हारे आकलन के अनुसार, दोष-बलिदान के रूप में—याजक के पास लाए।
  rationale: The revision resolves the dangling final prepositional phrase, expresses the sacrificial relation to Yahweh idiomatically, retains the Hebrew’s two linked uses of אָשָׁם, and preserves the priest’s valuation and the presentation of the ram to the priest. No footnotes are required for this short Hindi rendering.
