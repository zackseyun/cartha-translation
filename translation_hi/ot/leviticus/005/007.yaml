base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/007.yaml
  text: But if his means do not suffice for a sheep[a], then he shall bring as his guilt offering for the sin that he committed two turtledoves or two young pigeons to Yahweh, one for a sin offering and one for a burnt offering.
translation:
  language: hi
  text: पर यदि उसके साधन भेड़ के लिए पर्याप्त न हों, तो वह उस पाप के लिए जो उसने किया है, अपनी दोषबलि के रूप में यहोवा के लिए दो पंडुक या कबूतर के दो बच्चे लाए—एक पापबलि[a] के लिए और दूसरा होमबलि के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शुद्धिकरण-बलि।’ इब्रानी חַטָּאת बलिदानी प्रसंगों में ‘पापबलि’ अथवा पाप और अशुद्धता दूर करने से जुड़ी ‘शुद्धिकरण-बलि’ को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַגִּיע יָדוֹ דֵּי שֶׂה
  choice: उसके साधन भेड़ के लिए पर्याप्त न हों
  rationale: इब्रानी मुहावरे में हाथ के ‘पहुँचने’ की बात आर्थिक सामर्थ्य के अर्थ में है। यह अनुवाद अर्थ को स्वाभाविक हिन्दी में रखता है, बिना उसे अत्यधिक सरल बनाकर केवल ‘खरीद न सके’ कहने के।
- source_word: אֲשָׁמוֹ
  choice: उसके दोषबलि के रूप में
  rationale: यहाँ אָשָׁם दोष के साथ-साथ उस दोष के कारण चढ़ाई जाने वाली भेंट को सूचित करता है। ‘दोषबलि’ हिन्दी बाइबलीय परंपरा में संक्षिप्त और पहचाना हुआ बलिदानी शब्द है।
- source_word: אֲשֶׁר חָטָא
  choice: उसने जो पाप किया है
  rationale: यह उपवाक्य उस अपराध को स्पष्ट करता है जिसके कारण भेंट लाई जाती है; हिन्दी में यह रचना स्वाभाविक और स्रोत के निकट है।
- source_word: שְׁתֵּי תֹרִים
  choice: दो पंडुक
  rationale: תֹר बलिदानी व्यवस्था में प्रयुक्त टर्टलडव पक्षी है; आधुनिक मानक हिन्दी में ‘पंडुक’ इसका सटीक और संक्षिप्त नाम है।
- source_word: שְׁנֵי בְנֵי יוֹנָה
  choice: कबूतर के दो बच्चे
  rationale: शाब्दिक ‘कबूतर के पुत्र’ एक इब्रानी मुहावरा है जिसका आशय कम उम्र के कबूतर हैं; हिन्दी में ‘कबूतर के दो बच्चे’ सहज है और आयु का संकेत बचाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को स्पष्ट रूप से ‘यहोवा’ रखा गया है और לְ को उद्देश्य/समर्पण के अर्थ में ‘के लिए’ अनूदित किया गया है।
- source_word: לְחַטָּאת
  choice: पापबलि
  rationale: बलिदानी प्रसंग और עֹלָה के साथ समानांतर प्रयोग के कारण यहाँ חַטָּאת एक भेंट को सूचित करता है। पारंपरिक ‘पापबलि’ मुख्य पाठ में स्पष्ट है; शुद्धिकरण संबंधी वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
- source_word: לְעֹלָה
  choice: होमबलि
  rationale: עֹלָה उस बलि का स्थापित पद है जो वेदी पर पूर्णतः जलाई जाती थी। ‘होमबलि’ हिन्दी पाठकों के लिए प्रचलित बलिदानी शब्द है।
theological_decisions:
- issue: बलिदानी पद חַטָּאת का अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: विधिक-बलिदानी प्रसंग और होमबलि के साथ इसका युग्म मुख्य पाठ में ‘पापबलि’ का समर्थन करता है। फिर भी यह पद पाप अथवा अशुद्धता दूर करने वाली बलि को भी सूचित कर सकता है, इसलिए उस महत्त्वपूर्ण अर्थ को पादटिप्पणी में रखा गया है।
- issue: אָשָׁם का दोष और बलि से संबंध
  choice: दोषबलि
  alternative: प्रायश्चित्त अथवा क्षतिपूर्ति की भेंट
  rationale: यहाँ पद लाई जाने वाली भेंट को दर्शाता है, पर उसके पीछे दोष और प्रतिपूर्ति का भाव भी उपस्थित है। ‘दोषबलि’ उस संबंध को संक्षेप में बनाए रखता है और किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। बलिदानी तकनीकी पदों के लिए प्रचलित ‘दोषबलि,’ ‘पापबलि’ और ‘होमबलि’ प्रयुक्त हुए हैं। मूल में विद्यमान आर्थिक मुहावरे का अर्थ स्पष्ट किया गया है, जबकि חַטָּאת की वास्तविक अर्थगत व्यापकता पादटिप्पणी में संरक्षित है।
