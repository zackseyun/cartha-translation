source:
  edition: WLC
  text: וֶ/הֱבִיאָ/הּ֮ אֶל הַ/כֹּהֵן֒ וְ/קָמַ֣ץ הַ/כֹּהֵ֣ן מִ֠מֶּ/נָּה מְל֨וֹא קֻמְצ֜/וֹ אֶת אַזְכָּרָתָ/ה֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה חַטָּ֖את הִֽוא־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/012.yaml
  text: Then he shall bring it to the priest[a], and the priest shall take from it a handful as its memorial portion and burn it on the altar, in addition to the food offerings of Yahweh[b]. It is a sin offering.
translation:
  language: hi
  text: फिर वह उसे याजक के पास लाए। याजक उसमें से अपनी मुट्ठी भर, अर्थात उसका स्मरण-भाग, ले और याहवे के अग्नि-चढ़ावों[b] के ऊपर वेदी पर जलाए। यह पापबलि[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह शुद्धिकरण-बलि है।” इब्रानी शब्द उस बलि को भी दर्शा सकता है जो शुद्धिकरण के द्वारा पाप से निपटती है।
    reason: חַטָּאת की बलिदानी संज्ञा में ‘पापबलि’ और ‘शुद्धिकरण-बलि’ दोनों अर्थ-बल संभव हैं।
  - marker: b
    text: “अग्नि-चढ़ावों के ऊपर” का अर्थ यहाँ “अग्नि-चढ़ावों के साथ” या “उनके अतिरिक्त” भी हो सकता है।
    reason: עַל के स्थानिक अर्थ और इस बलिदानी संदर्भ में उसके साहचर्य/अतिरिक्तता के संभावित अर्थ को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: फिर वह उसे ... लाए
  rationale: हिफ़ील क्रिया और स्त्रीलिंग प्रत्यय पिछले पद की मैदे की भेंट की ओर संकेत करते हैं; क्रमसूचक वाव को स्वाभाविक हिन्दी में ‘फिर’ से व्यक्त किया गया है।
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: अपनी मुट्ठी भर लेकर
  rationale: यह अन्नबलि में याजक द्वारा एक मुट्ठी अंश लेने की पारिभाषिक अनुष्ठानिक क्रिया है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: אֶת אַזְכָּרָתָהּ
  choice: उसके स्मरण-भाग के रूप में
  rationale: अज़काराह उस प्रतिनिधि भाग का तकनीकी नाम है जिसे वेदी पर जलाया जाता है; ‘स्मरण-भाग’ इस अनुष्ठानिक अर्थ को बनाए रखता है।
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: वेदी पर जलाए
  rationale: क़तर का हिफ़ील बलिदानी संदर्भ में वेदी पर चढ़ाकर जलाने को व्यक्त करता है।
- source_word: עַל אִשֵּׁי יְהוָה
  choice: याहवे के अग्नि-चढ़ावों के ऊपर
  rationale: ‘अग्नि-चढ़ावे’ אִשֵּׁי के अग्नि द्वारा अर्पित बलिदानों वाले तकनीकी अर्थ को सुरक्षित रखता है; עַל का स्थानिक ‘ऊपर’ अनुवाद मूल की अभिव्यक्ति को अनावश्यक रूप से ‘के अतिरिक्त’ में नहीं बदलता।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: חַטָּאת הִוא
  choice: यह पापबलि है
  rationale: यहाँ חַטָּאת बलिदान की श्रेणी बताता है; ‘पापबलि’ परिचित और संक्षिप्त पारिभाषिक रूप है, जबकि शुद्धिकरण का संभावित बल अलग टिप्पणी में रखा गया है।
theological_decisions:
- issue: याजकीय बलिदान-विधान में חַטָּאת का अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: संदर्भ में शब्द बलिदान की श्रेणी का नाम है। ‘पापबलि’ पारंपरिक और तुरंत समझ में आने वाला है, पर इब्रानी शब्द के शुद्धिकरण-संबंधी बल को दबाया नहीं गया; उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: עַל אִשֵּׁי יְהוָה का संबंध
  choice: अग्नि-चढ़ावों के ऊपर
  alternative: अग्नि-चढ़ावों के साथ / उनके अतिरिक्त
  rationale: עַל का मूल स्थानिक अर्थ ‘ऊपर’ है, जबकि प्रसंग में साथ या अतिरिक्त चढ़ाने का भाव भी समझा जा सकता है। मुख्य पाठ मूल संरचना को बनाए रखता है और वैकल्पिक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए स्पष्ट रखी गई है। ‘याजक’, ‘वेदी’, ‘स्मरण-भाग’, ‘अग्नि-चढ़ावा’ और ‘पापबलि’ जैसे शब्द याजकीय विधान की तकनीकी प्रकृति बनाए रखते हैं।
