source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּֽי תִמְעֹ֣ל מַ֔עַל וְ/חָֽטְאָה֙ בִּ/שְׁגָגָ֔ה מִ/קָּדְשֵׁ֖י יְהוָ֑ה וְ/הֵבִיא֩ אֶת אֲשָׁמ֨/וֹ לַֽ/יהוָ֜ה אַ֧יִל תָּמִ֣ים מִן הַ/צֹּ֗אן בְּ/עֶרְכְּ/ךָ֛ כֶּֽסֶף שְׁקָלִ֥ים בְּ/שֶֽׁקֶל הַ/קֹּ֖דֶשׁ לְ/אָשָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/015.yaml
  text: 'If a person acts unfaithfully and sins unintentionally in regard to the holy things of Yahweh[a], he shall bring his compensation offering to Yahweh: an unblemished ram from the flock, according to your valuation in silver shekels, by the sanctuary shekel[b], for a guilt offering.'
translation:
  language: hi
  text: यदि कोई व्यक्ति विश्वासघात करे और याहवे की पवित्र वस्तुओं के संबंध में अनजाने में पाप करे, तो वह याहवे के लिए क्षतिपूर्ति-बलि के रूप में झुंड में से एक निष्कलंक मेढ़ा लाए, जिसका मूल्य तेरे मूल्यांकन के अनुसार, पवित्रस्थान के शेकेल के मान से, चाँदी के शेकेलों में हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: कोई व्यक्ति
  rationale: व्यवस्था-संबंधी प्रसंग में נֶפֶשׁ किसी एक व्यक्ति को सूचित करता है; ‘कोई व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक और विधिक एकवचन के अनुकूल है।
- source_word: תִמְעֹל מַעַל
  choice: विश्वासघात करे
  rationale: क्रिया और उसी मूल की संज्ञा का मेल पवित्र दायित्व के उल्लंघन को तीव्रता से व्यक्त करता है; ‘विश्वासघात करे’ संक्षिप्त और स्पष्ट है।
- source_word: וְחָטְאָה בִשְׁגָגָה
  choice: अनजाने में पाप करे
  rationale: בִשְׁגָגָה जानबूझकर किए विद्रोह के बजाय अनिच्छित या अनजाने अपराध को दर्शाता है।
- source_word: מִקָּדְשֵׁי יְהוָה
  choice: याहवे की पवित्र वस्तुओं के संबंध में
  rationale: यह वाक्यांश याहवे को समर्पित वस्तुओं, भेंटों या देयों से संबंधित अपराध का क्षेत्र बताता है; अनावश्यक रूप से किसी एक प्रकार की वस्तु तक अर्थ सीमित नहीं किया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אֲשָׁמוֹ / לְאָשָׁם
  choice: क्षतिपूर्ति-बलि
  rationale: אָשָׁם अपराध से उत्पन्न दोष/दायित्व और उसके निवारण के लिए चढ़ाई जाने वाली बलि दोनों को सूचित कर सकता है। इस प्रसंग में पवित्र वस्तुओं की हानि और मूल्यांकन के कारण क्षतिपूर्ति का भाव प्रमुख है; पारंपरिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אַיִל תָּמִים
  choice: एक निर्दोष मेढ़ा
  rationale: बलिदान-संबंधी प्रसंग में תָּמִים का अर्थ शारीरिक दोष से रहित है; ‘निर्दोष’ हिन्दी बाइबलीय प्रयोग में सहज है।
- source_word: מִן הַצֹּאן
  choice: झुंड में से
  rationale: צֹאן छोटे पालतू पशुओं के झुंड को दर्शाता है; אַיִל पहले ही पशु को मेढ़ा ठहराता है।
- source_word: בְּעֶרְכְּךָ
  choice: तेरे ठहराए हुए मूल्य के अनुसार
  rationale: द्वितीय पुरुष एकवचन को बनाए रखते हुए अधिकृत मूल्यांकन का भाव व्यक्त किया गया है।
- source_word: כֶּסֶף שְׁקָלִים
  choice: चाँदी के शेकेलों में
  rationale: मूल पाठ मूल्य को चाँदी के शेकेलों में व्यक्त करता है, पर शेकेलों की निश्चित संख्या नहीं देता; अनूदित पाठ भी कोई संख्या नहीं जोड़ता।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के मान से
  rationale: यह पवित्र उपयोग में मान्य भार-माप के मानक को सूचित करता है।
theological_decisions:
- issue: אָשָׁם का बलिदान-संबंधी अर्थ
  choice: क्षतिपूर्ति-बलि
  alternative: दोष-बलि; अपराध-बलि
  rationale: इस नियम में याहवे की पवित्र वस्तुओं से हुई हानि और उसका चाँदी में मूल्यांकन सामने है, इसलिए ‘क्षतिपूर्ति-बलि’ प्रतिपूर्ति के पहलू को स्पष्ट करता है। फिर भी मूल शब्द दोष/दायित्व और बलि दोनों को समेट सकता है; इस तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत नाम है, इसलिए उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘याहवे’ उपलब्ध भाषायी साक्ष्य के निकट हिन्दी लिप्यंतरण है।
- issue: विधिक कथन में व्याकरणिक एकवचन
  choice: कोई व्यक्ति … वह
  alternative: जो कोई … वे
  rationale: मूल का प्रतिनिधिक एकवचन बनाए रखा गया है और हिन्दी में इसे सामान्य व्यक्ति पर लागू होने वाले विधिक विधान के रूप में स्वाभाविक बनाया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। विधिक शैली को ‘यदि… तो…’ संरचना से सुरक्षित रखा गया है। मूल्यांकन-वाक्य में मूल इब्रानी की अनिर्दिष्ट शेकेल-संख्या को ज्यों का त्यों रखा गया है; कोई अनुमानित संख्या नहीं जोड़ी गई। ‘क्षतिपूर्ति-बलि’ अर्थ स्पष्ट करता है, जबकि पादटिप्पणी पारंपरिक ‘दोष-बलि’ और मूल शब्द की द्विअर्थी प्रकृति सुरक्षित रखती है।
