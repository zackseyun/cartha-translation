source:
  edition: WLC
  text: נֶ֚פֶשׁ כִּ֣י תֶחֱטָ֔א וּ/מָעֲלָ֥ה מַ֖עַל בַּ/יהוָ֑ה וְ/כִחֵ֨שׁ בַּ/עֲמִית֜/וֹ בְּ/פִקָּד֗וֹן אֽוֹ בִ/תְשׂ֤וּמֶת יָד֙ א֣וֹ בְ/גָזֵ֔ל א֖וֹ עָשַׁ֥ק אֶת עֲמִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/021.yaml
  text: If a person sins and commits a breach of faith against Yahweh by deceiving his neighbor about a security entrusted to him[a], or a pledge, or through robbery, or if he has oppressed his neighbor,
translation:
  language: hi
  text: यदि कोई व्यक्ति पाप करे और यहोवा के प्रति विश्वासघात करे, अर्थात अपने पड़ोसी को धोखा दे—सुरक्षित रखने के लिए उसके पास रखी गई वस्तु, या उसके हाथ में सौंपी गई किसी वस्तु[a], या लूटी हुई वस्तु के बारे में झूठ बोलकर—या अपने पड़ोसी पर अत्याचार करे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बंधक रखी गई किसी वस्तु”; इब्रानी का शाब्दिक अर्थ “हाथ में रखी गई वस्तु” है।
    reason: תְשׂוּמֶת יָד का सटीक कानूनी अर्थ अनिश्चित है; सम्भव अर्थों में सौंपी गई वस्तु और बंधक दोनों आते हैं।
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: कोई व्यक्ति
  rationale: विधिक प्रसंग में यह शब्द संपूर्ण व्यक्ति को दर्शाता है; आधुनिक हिन्दी में ‘कोई व्यक्ति’ स्वाभाविक है।
- source_word: כִּי תֶחֱטָא
  choice: यदि ... पाप करे
  rationale: यहाँ כִּי शर्तसूचक विधिक उपवाक्य आरम्भ करता है।
- source_word: וּמָעֲלָה מַעַל
  choice: विश्वासघात करे
  rationale: एक ही धातु से बनी इस बलाघाती रचना में निष्ठा तोड़ने का संबंधपरक और वाचा-संबंधी भाव है।
- source_word: בַּיהוָה
  choice: यहोवा के प्रति
  rationale: मूल पाठ सामाजिक अपराध को स्पष्ट रूप से यहोवा के प्रति विश्वासघात बताता है।
- source_word: וְכִחֵשׁ
  choice: झूठ बोले
  rationale: क्रिया झुठलाने, मिथ्या व्यवहार करने या धोखा देने को व्यक्त कर सकती है; वस्तु के विषय में ‘झूठ बोले’ इस विधिक प्रसंग में स्पष्ट और सहज है।
- source_word: בַּעֲמִיתוֹ
  choice: अपने पड़ोसी से
  rationale: עָמִית समुदाय के सह-सदस्य को दर्शाता है; ‘पड़ोसी’ परिचित और स्वाभाविक समतुल्य है।
- source_word: בְּפִקָּדוֹן
  choice: उस धरोहर के विषय में जो उसके पास रखी गई हो
  rationale: यह सुरक्षित रखने के लिए सुपुर्द की गई संपत्ति को दर्शाता है; विस्तृत हिन्दी अभिव्यक्ति कानूनी आशय स्पष्ट करती है।
- source_word: בִתְשׂוּמֶת יָד
  choice: अपने हाथ में सौंपी गई किसी वस्तु
  rationale: शाब्दिक रूप से ‘हाथ में रखी/दी गई वस्तु’; अभिव्यक्ति का सटीक कानूनी अर्थ अनिश्चित है, इसलिए अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: בְגָזֵל
  choice: लूट की वस्तु के विषय में
  rationale: संज्ञा बलपूर्वक छीनी गई वस्तु या लूट को दर्शा सकती है; समान पूर्वसर्ग वाली सूची में इसे झूठ बोलने के तीसरे विषय के रूप में पढ़ा गया है।
- source_word: עָשַׁק אֶת עֲמִיתוֹ
  choice: अपने पड़ोसी पर अत्याचार करे
  rationale: क्रिया दबाने, शोषण करने, वंचित करने या जबरन लेने के व्यापक अर्थ को समेटती है; ‘अत्याचार’ उस व्यापकता को बनाए रखता है।
theological_decisions:
- issue: सामाजिक अथवा आर्थिक अपराध को परमेश्वर के विरुद्ध विश्वासघात के रूप में व्यक्त करना
  choice: यहोवा के प्रति विश्वासघात करे
  alternative: यहोवा के विषय में विश्वासघात करे
  rationale: इब्रानी पाठ पड़ोसी के विरुद्ध किए गए छल को यहोवा के प्रति निष्ठा भंग करना बताता है; अनुवाद इस ऊर्ध्वाधर आयाम को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- issue: יהוה के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी के सामान्य बाइबलीय प्रयोग में व्यक्तिगत दिव्य नाम को ‘यहोवा’ के रूप में प्रस्तुत किया गया है, न कि उपाधि से प्रतिस्थापित किया गया है।
- issue: בְגָזֵל का वाक्यगत संबंध
  choice: लूट की वस्तु के विषय में झूठ बोले
  alternative: लूटपाट करके धोखा दे
  rationale: समानांतर בְּ-रचनाओं के कारण इसे וְכִחֵשׁ के अंतर्गत तीसरे विषय के रूप में रखा गया है, यद्यपि इसे अपराध के साधन के रूप में भी समझा जा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण विधिक स्वर रखा गया है। वाक्य अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है। ‘पड़ोसी’ को समुदाय के सह-सदस्य के अर्थ में और ‘अत्याचार’ को आर्थिक शोषण सहित व्यापक अर्थ में प्रयोग किया गया है।
