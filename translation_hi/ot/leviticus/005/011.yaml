reference: Leviticus 5:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִם לֹא֩ תַשִּׂ֨יג יָד֜/וֹ לִ/שְׁתֵּ֣י תֹרִ֗ים אוֹ֮ לִ/שְׁנֵ֣י בְנֵי יוֹנָה֒ וְ/הֵבִ֨יא אֶת קָרְבָּנ֜/וֹ אֲשֶׁ֣ר חָטָ֗א עֲשִׂירִ֧ת הָ/אֵפָ֛ה סֹ֖לֶת לְ/חַטָּ֑את לֹא יָשִׂ֨ים עָלֶ֜י/הָ שֶׁ֗מֶן וְ/לֹא יִתֵּ֤ן עָלֶ֨י/הָ֙ לְבֹנָ֔ה כִּ֥י חַטָּ֖את הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/011.yaml
  text: But if his means are not sufficient for two turtledoves or two young pigeons[a], then he shall bring as his offering for the sin that he has committed a tenth of an ephah of fine flour for a sin offering. He shall put no oil on it and place no frankincense on it, because it is a sin offering.
translation:
  language: hi
  text: परन्तु यदि उसकी सामर्थ्य दो पंडुकों या कबूतर के दो बच्चों के लिए पर्याप्त न हो[a], तो वह अपने किए हुए पाप के लिए पापबलि के रूप में एपा का दसवाँ भाग मैदा चढ़ावे के लिए लाए। वह उस पर न तेल डाले और न लोबान रखे, क्योंकि वह पापबलि है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “यदि उसका हाथ ... तक न पहुँचे”—यह इब्रानी मुहावरा पर्याप्त साधन न होने को दर्शाता है।
    reason: मूल मुहावरे के रूप और उसके आर्थिक अर्थ दोनों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: תַשִּׂיג יָדוֹ
  choice: उसके पास ... का प्रबन्ध करने के साधन न हों
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘उसका हाथ न पहुँचे’ है; यहाँ यह आर्थिक असमर्थता बताता है। चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट है और विधिक शर्त को बनाए रखता है।
- source_word: תֹרִים
  choice: पंडुकों
  rationale: यह बलि-संबंधी प्रसंग में टर्टलडव के लिए विशिष्ट शब्द है; ‘पंडुक’ सामान्य ‘फाख्ता’ या ‘कबूतर’ से अधिक सटीक भेद रखता है।
- source_word: בְנֵי יוֹנָה
  choice: कबूतर के दो बच्चों
  rationale: शाब्दिक रूप ‘कबूतर के बच्चे’ है और कम उम्र के कबूतरों को सूचित करता है।
- source_word: קָרְבָּנוֹ
  choice: अपना चढ़ावा
  rationale: यह निकट लाकर अर्पित की जाने वाली वस्तु का व्यापक बलि-संबंधी शब्द है; यहाँ अन्न भी चढ़ाया जा सकता है, इसलिए ‘बलिदान’ की अपेक्षा ‘चढ़ावा’ उपयुक्त है।
- source_word: אֲשֶׁר חָטָא
  choice: उसने जो पाप किया है उसके लिए
  rationale: यह अपराध और चढ़ावे का संबंध स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: עֲשִׂירִת הָאֵפָה
  choice: एपा का दसवाँ भाग
  rationale: प्राचीन सूखी माप की इकाई को अनुमानित आधुनिक मात्रा में बदलने के बजाय मूल इकाई सुरक्षित रखी गई है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह बारीक पिसे हुए उत्तम आटे को दर्शाता है; ‘मैदा’ साधारण आधुनिक हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: לְחַטָּאת
  choice: पापबलि के रूप में
  rationale: यहाँ חַטָּאת अपराध नहीं, चढ़ाई जाने वाली अनुष्ठानिक पापबलि को सूचित करता है।
- source_word: לֹא יָשִׂים עָלֶיהָ שֶׁמֶן
  choice: वह उस पर न तेल डाले
  rationale: तैयारी से संबंधित प्रत्यक्ष निषेध को सरल और विधिक हिन्दी में रखा गया है।
- source_word: וְלֹא יִתֵּן עָלֶיהָ לְבֹנָה
  choice: न लोबान रखे
  rationale: לְבֹנָה सुगंधित राल ‘लोबान’ है; क्रिया मूल क्रिया से निकट रहते हुए स्वाभाविक हिन्दी देती है।
- source_word: כִּי חַטָּאת הִיא
  choice: क्योंकि वह पापबलि है
  rationale: यह तेल और लोबान न रखने का कारण बताता है और स्त्रीलिंग सर्वनाम को निकटवर्ती पापबलि से जोड़ता है।
theological_decisions:
- issue: बलि-विधान में חַטָּאת का अर्थ
  choice: पापबलि
  alternative: पाप
  rationale: शब्द दोनों अर्थ रख सकता है, पर यहाँ लाए गए पदार्थ और उसके तैयार करने के निर्देशों की चर्चा है; इसलिए अनुष्ठानिक अर्थ ‘पापबलि’ प्रसंगानुकूल है।
- issue: निर्धनता-सूचक इब्रानी मुहावरे का अनुवाद
  choice: उसके पास ... का प्रबन्ध करने के साधन न हों
  alternative: उसका हाथ ... तक न पहुँचे
  rationale: चुना हुआ पाठ आर्थिक असमर्थता और व्यवस्था में दी गई रियायत को स्पष्ट करता है, जबकि पाद-टिप्पणी मूल रूपक सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण विधिक-धार्मिक रजिस्टर अपनाया गया है। ‘पापबलि’, ‘चढ़ावा’, ‘एपा’ और ‘लोबान’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं; वाक्य-संरचना को साधारण पाठक के लिए स्पष्ट बनाया गया है।
