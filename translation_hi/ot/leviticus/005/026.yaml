base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/026.yaml
  text: And the priest shall make atonement for him before Yahweh[a], and he will be forgiven for any one of all the things by which one may incur guilt.
translation:
  language: hi
  text: और याजक उसके लिए यहवे के सामने प्रायश्चित करेगा, और उन सब कामों में से किसी एक के संबंध में, जिसे करके वह दोषी हो जाए, उसे क्षमा कर दिया जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “उन सब में से किसी एक के विषय में, जिसे वह करके उसके कारण दोषी हो जाए।”'
    reason: मूल इब्रानी की संक्षिप्त और कुछ असहज संरचना को दिखाने वाला अधिक शाब्दिक विकल्प।
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו
  choice: उसके लिए प्रायश्चित करे
  rationale: पिएल क्रिया כפר बलिदान-संबंधी प्रसंग में किसी व्यक्ति के लिए प्रायश्चित किए जाने को व्यक्त करती है; על उस व्यक्ति को सूचित करता है जिसके पक्ष में यह किया जाता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: उपासना और बलिदान के प्रसंग में כֹּהֵן का स्वाभाविक, प्रतिष्ठित हिन्दी रूप।
- source_word: לִפְנֵי יְהוָה
  choice: यहवे के सामने
  rationale: לִפְנֵי उपस्थिति का भाव रखता है, और יְהוָה को उसके व्यक्तिगत वाचा-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וְנִסְלַח לוֹ
  choice: उसे क्षमा कर दिया जाएगा
  rationale: निफ़ाल रूप परिणामस्वरूप मिली क्षमा को व्यक्त करता है और क्षमा देने वाले को निहित ही रहने देता है।
- source_word: עַל אַחַת מִכֹּל
  choice: ऐसे सभी कामों में से किसी भी एक काम के लिए
  rationale: यह समूचे वर्ग में से किसी एक भी अपराधकारी काम पर लागू होने वाला वितरणात्मक भाव बनाए रखता है।
- source_word: אֲשֶׁר יַעֲשֶׂה לְאַשְׁמָה בָהּ
  choice: जिसे करके वह दोषी हो जाए
  rationale: यह इब्रानी वाक्यांश काम करने और उसके द्वारा दोषी होने के संबंध को व्यक्त करता है; हिन्दी में यह रूप स्वाभाविक है और इसे ‘दोषबलि’ नहीं बनाता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; ‘यहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: क्षमा देने वाले कर्ता की पहचान
  choice: उसे क्षमा कर दिया जाएगा
  alternative: परमेश्वर उसे क्षमा करेगा
  rationale: इब्रानी पाठ निष्क्रिय रूप में क्षमा व्यक्त करता है और कर्ता को स्पष्ट नहीं करता; अनुवाद उसी निहितता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और उपासना-संबंधी शब्दावली रखी गई है। ‘प्रायश्चित’ और ‘याजक’ सामान्य बाइबलीय प्रयोग के अनुरूप हैं; वाक्य की मूल विधिक गंभीरता बनाए रखते हुए अनावश्यक रूप से पुरातन क्रियारूपों से बचा गया है।
