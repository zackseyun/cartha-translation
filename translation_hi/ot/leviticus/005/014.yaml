  yaml_path: translation/ot/leviticus/005/014.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: याहवे[a] ने मूसा से कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ईश्वरीय नाम चार व्यंजनों YHWH से लिखा है; इसका उच्चारण सामान्यतः ‘याहवे’ माना जाता है। इसे ‘यहोवा’ भी कहा गया है और कई अनुवादों में ‘प्रभु’ लिखा जाता है।
    reason: ईश्वरीय नाम की वर्तनी, उच्चारण की अनिश्चितता और प्रमुख वैकल्पिक प्रस्तुतियाँ स्पष्ट करना।
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: वाव-क्रमिक रूप यहाँ एक नई वाणी-घटना आरम्भ करता है। हिंदी में ‘मूसा से कहा’ इस आवर्ती संबोधन-सूत्र का स्वाभाविक और स्पष्ट रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम चार इब्रानी व्यंजनों YHWH से लिखा है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और इसे किसी उपाधि से नहीं बदलता।
- source_word: אֶל
  choice: से
  rationale: דבר के साथ אֶל संबोधित व्यक्ति को दर्शाता है; आधुनिक हिंदी में ‘मूसा से कहा’ स्वाभाविक प्रयोग है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: यह इस इब्रानी व्यक्तिगत नाम का हिंदी में स्थापित रूप है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: यह रूप आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिंदी में अलग से ‘यह कहते हुए’ जोड़ना भारी और अनावश्यक होगा; ‘कहा,’ तथा अल्पविराम उसी कार्य को स्वाभाविक ढंग से व्यक्त करते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ नाम को प्रत्यक्ष रखता है; स्वरांकन की प्राचीन अनिश्चितता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। आवर्ती इब्रानी वाणी-सूत्र को हिंदी के स्वाभाविक ‘ने…से कहा’ में व्यक्त किया गया है, जबकि अंत का अल्पविराम अगले पद में आने वाली वाणी से संबंध बनाए रखता है।
