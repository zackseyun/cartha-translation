id: LEV.5.1
reference: Leviticus 5:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נֶ֣פֶשׁ כִּֽי תֶחֱטָ֗א וְ/שָֽׁמְעָה֙ ק֣וֹל אָלָ֔ה וְ/ה֣וּא עֵ֔ד א֥וֹ רָאָ֖ה א֣וֹ יָדָ֑ע אִם ל֥וֹא יַגִּ֖יד וְ/נָשָׂ֥א עֲוֺנֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/001.yaml
  text: If a person sins[a] because he hears a public adjuration and he is a witness—whether he has seen or otherwise knows—and he does not report it[b], then he shall bear his guilt.
translation:
  language: hi
  text: यदि कोई व्यक्ति इस प्रकार पाप करे कि वह गवाही देने के लिए शपथपूर्वक की गई पुकार[a] सुने और उस मामले का गवाह हो—चाहे उसने उसे देखा हो या उसके विषय में कुछ जानता हो—और वह उसे प्रकट न करे, तो वह अपने अपराध का भार उठाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “शपथ की आवाज़” या “अभिशाप की आवाज़”; आशय ऐसी शपथपूर्वक पुकार से है जिसमें जानने वाले व्यक्ति से गवाही देने की माँग की जाती थी।
    reason: lexical_alternative
  - marker: b
    text: या “वह अपने अधर्म का भार उठाएगा”; यह इब्रानी मुहावरा बताता है कि गवाही रोकने के कारण वह अपने अपराध के लिए उत्तरदायी रहेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: कोई व्यक्ति
  rationale: व्यवस्था-संबंधी प्रसंग में נֶפֶשׁ किसी मनुष्य या व्यक्ति को सूचित करता है; ‘कोई व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक है और ‘प्राण/आत्मा’ जैसा अनपेक्षित तात्त्विक अर्थ नहीं जोड़ता।
- source_word: תֶחֱטָא
  choice: पाप करे
  rationale: חטא यहाँ नैतिक और विधिक रूप से दोषपूर्ण कार्य को व्यक्त करता है; ‘पाप करे’ इसकी संक्षिप्तता और गंभीरता बनाए रखता है।
- source_word: וְשָׁמְעָה קוֹל אָלָה
  choice: गवाही देने के लिए शपथपूर्वक की गई पुकार सुने
  rationale: קוֹל אָלָה का शाब्दिक रूप ‘शपथ/अभिशाप की आवाज़’ है, पर इस विधिक प्रसंग में यह जानने वाले गवाहों को शपथपूर्वक सामने आने की सार्वजनिक पुकार सूचित करता है। चुना गया रूप प्रसंग स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: וְהוּא עֵד
  choice: उस मामले का गवाह हो
  rationale: यह उस व्यक्ति की संबंधित घटना के विषय में गवाह की स्थिति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אוֹ רָאָה אוֹ יָדָע
  choice: चाहे उसने उसे देखा हो या उसके विषय में जानता हो
  rationale: यह युग्म प्रत्यक्ष देखने और किसी अन्य रीति से जानकारी रखने, दोनों को समेटता है; अनुवाद मूल की दोनों संभावनाएँ बनाए रखता है।
- source_word: אִם לֹא יַגִּיד
  choice: फिर भी वह उसे प्रकट न करे
  rationale: נגד के हिफ़ील रूप का अर्थ बताना, घोषित करना या प्रकट करना है। ‘प्रकट न करे’ औपचारिक गवाही तक सीमित किए बिना आवश्यक जानकारी न देने का भाव देता है।
- source_word: וְנָשָׂא עֲוֺנוֹ
  choice: अपने अपराध का भार उठाएगा
  rationale: यह मूल के ‘उठाने/ढोने’ वाले रूपक और अपराध से जुड़ी जवाबदेही दोनों को बनाए रखता है; पादटिप्पणी इस मुहावरे का आशय स्पष्ट करती है।
theological_decisions:
- issue: व्यवस्था-संबंधी एकवचन में लिंग का निरूपण
  choice: ‘कोई व्यक्ति’ और लिंग-निरपेक्ष एकवचन सर्वनाम ‘वह’
  alternative: ‘कोई पुरुष’ या बहुवचन ‘वे’
  rationale: נֶפֶשׁ यहाँ सामान्य व्यक्ति को सूचित करता है। हिन्दी का ‘वह’ स्वाभाविक रूप से लिंग-निरपेक्ष हो सकता है, इसलिए मूल के एकवचन को बनाए रखते हुए अनावश्यक रूप से केवल पुरुष का अर्थ नहीं जोड़ा गया।
- issue: וְנָשָׂא עֲוֺנוֹ में दोष और परिणाम का संबंध
  choice: मूल रूपक सहित ‘अपने अपराध का भार उठाएगा’
  alternative: ‘दोषी ठहरेगा’ या ‘अपने अपराध का दंड पाएगा’
  rationale: इब्रानी मुहावरा अपराध की जवाबदेही और उसके परिणाम दोनों की ओर संकेत कर सकता है। केवल न्यायिक निर्णय या केवल दंड कहने से अर्थ सीमित हो जाता, इसलिए व्यापक और जानबूझकर तनावपूर्ण रूप रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य को विधिक शर्त की शैली में रखा गया है, पर इब्रानी के लगातार संयोजकों को हिन्दी की स्वाभाविक संरचना—‘इस प्रकार…कि’, दीर्घ विराम और ‘फिर भी’—से व्यक्त किया गया है।
