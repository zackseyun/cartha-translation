id: LEV.5.3
reference: Leviticus 5:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: א֣וֹ כִ֤י יִגַּע֙ בְּ/טֻמְאַ֣ת אָדָ֔ם לְ/כֹל֙ טֻמְאָת֔/וֹ אֲשֶׁ֥ר יִטְמָ֖א בָּ֑/הּ וְ/נֶעְלַ֣ם מִמֶּ֔/נּוּ וְ/ה֥וּא יָדַ֖ע וְ/אָשֵֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/003.yaml
  text: Or if he touches human uncleanness—any uncleanness by which one becomes unclean—and it is hidden from him, and then he comes to know it, he is guilty.
translation:
  language: hi
  text: अथवा यदि वह किसी मनुष्य की अशुद्धता[a] को छू ले—अर्थात् ऐसी किसी भी अशुद्धता को, जिससे वह अशुद्ध होता है—और वह उससे छिपी रहे[b], फिर उसे इसका पता चले, तो वह दोषी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मनुष्य की अपवित्रता।’ यहाँ इब्रानी शब्द विधिक प्रसंग में आनुष्ठानिक अशुद्धता को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, ‘और वह उससे छिपी रहे’; अर्थात् उस समय उसे इसका पता न हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגַּע בְּ
  choice: को छू ले
  rationale: נגע के साथ ב शारीरिक संपर्क को दर्शाता है; ‘छू ले’ हिन्दी में सीधा और स्वाभाविक है।
- source_word: טֻמְאַת אָדָם
  choice: मनुष्य की अशुद्धता
  rationale: लैव्यव्यवस्था के इस विधिक प्रसंग में טֻמְאָה आनुष्ठानिक अशुद्धता को दर्शाता है और אָדָם का अर्थ सामान्य रूप से मनुष्य है।
- source_word: לְכֹל טֻמְאָתוֹ
  choice: उसकी किसी भी ऐसी अशुद्धता को
  rationale: सर्वनामिक प्रत्यय को बनाए रखते हुए यह वाक्यांश मानव-स्रोत से संबंधित किसी भी प्रकार की अशुद्धता का व्यापक अर्थ व्यक्त करता है।
- source_word: אֲשֶׁר יִטְמָא בָּהּ
  choice: जिससे वह अशुद्ध हो सकता है
  rationale: सापेक्ष उपवाक्य उस अशुद्धता के प्रभाव को बताता है; हिन्दी में यह रूप संभाव्य सामान्य स्थिति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: और यह बात उससे छिपी रहे
  rationale: निफ़अल रूप उस समय व्यक्ति की अनभिज्ञता को निष्क्रिय भाव में व्यक्त करता है; यह अनुवाद स्रोत की विधिक शैली भी बनाए रखता है।
- source_word: וְהוּא יָדַע
  choice: फिर उसे इसका पता चले
  rationale: पहले की अनभिज्ञता के बाद होने वाले बोध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאָשֵׁם
  choice: तो वह दोषी है
  rationale: इस विधिक-बलिदानी प्रसंग में אשם दोष अथवा उत्तरदायित्व लगने को दर्शाता है; ‘दोषी है’ संक्षिप्त और न्यायिक अर्थ वाला रूप है।
theological_decisions:
- issue: लैव्यव्यवस्था की विधि में טֻמְאָה का स्वरूप
  choice: ‘अशुद्धता’ के रूप में अनुवाद, नैतिक ‘पापमयता’ के रूप में नहीं
  alternative: अपवित्रता
  rationale: यह पद संपर्क से उत्पन्न आनुष्ठानिक अशुद्धता के विषय में है; स्वयं उस अवस्था को नैतिक बुराई बताना पाठ में नहीं है।
- issue: אָדָם का अर्थ
  choice: ‘मनुष्य’ के रूप में सामान्य मानवीय संदर्भ
  alternative: आदमी; मानव
  rationale: यहाँ शब्द किसी पुरुष मात्र के लिए नहीं, बल्कि सामान्य मानव-स्रोत की अशुद्धता के लिए प्रयुक्त है।
- issue: וְאָשֵׁם में दोष का कथन
  choice: ‘वह दोषी है’
  alternative: उस पर दोष आता है; वह दोष का भागी होता है
  rationale: मूल के संक्षिप्त विधिक निष्कर्ष को बनाए रखा गया है और दोष की सटीक प्रकृति पर अतिरिक्त व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक शैली रखी गई है। ‘अशुद्धता’ लैव्यव्यवस्था की आनुष्ठानिक श्रेणी को सामान्य पाठक के लिए स्पष्ट रखता है। लंबे इब्रानी वाक्य-क्रम को डैश और स्वाभाविक हिन्दी उपवाक्यों से पठनीय बनाया गया है।
