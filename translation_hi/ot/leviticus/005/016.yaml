source:
  edition: WLC
  text: וְ/אֵ֣ת אֲשֶׁר֩ חָטָ֨א מִן הַ/קֹּ֜דֶשׁ יְשַׁלֵּ֗ם וְ/אֶת חֲמִֽישִׁת/וֹ֙ יוֹסֵ֣ף עָלָ֔י/ו וְ/נָתַ֥ן אֹת֖/וֹ לַ/כֹּהֵ֑ן וְ/הַ/כֹּהֵ֗ן יְכַפֵּ֥ר עָלָ֛י/ו בְּ/אֵ֥יל הָ/אָשָׁ֖ם וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/016.yaml
  text: He shall make restitution for what he sinned against from the holy thing[a], and he shall add a fifth to it and give it to the priest. Then the priest shall make atonement for him with the ram of the guilt offering[b], and he shall be forgiven.
translation:
  language: hi
  text: पवित्र वस्तु के विषय में उसने जो पाप किया है, उसकी वह भरपाई करे[a] और उसमें पाँचवाँ भाग और जोड़कर याजक को दे। तब याजक दोषबलि के मेढ़े[b] के द्वारा उसके लिए प्रायश्चित करे, और उसे क्षमा किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र वस्तु में से जो उसने अनुचित रूप से रोक रखा था, उसकी भरपाई करे।” इब्रानी का आशय किसी पवित्र वस्तु या पवित्र देय से जुड़े अपराध की भरपाई से है।
    reason: lexical_alternative
  - marker: b
    text: या, “दोषबलि के लिए मेढ़े”; אָשָׁם को “क्षतिपूर्ति-बलि” भी कहा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: חָטָא מִן הַקֹּדֶשׁ
  choice: पवित्र वस्तु के विषय में उसने जो पाप किया है
  rationale: यह पदबंध किसी पवित्र वस्तु या पवित्र देय से जुड़े अपराध को दर्शाता है। हिन्दी में यह अनुवाद मूल की व्यापकता बनाए रखता है और बिना स्पष्ट आधार के ‘पवित्रस्थान को ठगा’ जैसा संकीर्ण अर्थ नहीं जोड़ता।
- source_word: יְשַׁלֵּם
  choice: भरपाई करे
  rationale: इस विधिक संदर्भ में क्रिया का अर्थ केवल भुगतान करना नहीं, बल्कि हानि की प्रतिपूर्ति करना है। ‘भरपाई’ आधुनिक और सहज हिन्दी में यह भाव व्यक्त करती है।
- source_word: חֲמִישִׁתוֹ יוֹסֵף עָלָיו
  choice: उसमें उसका पाँचवाँ भाग और जोड़कर
  rationale: यह मूल राशि के अतिरिक्त उसी राशि का पाँचवाँ भाग जोड़ने का निर्देश है। यह रचना संक्षिप्त और स्वाभाविक है।
- source_word: לַכֹּהֵן
  choice: याजक को
  rationale: यह प्राप्तकर्ता का सीधा और प्रचलित हिन्दी अनुवाद है।
- source_word: יְכַפֵּר עָלָיו
  choice: उसके लिए प्रायश्चित करे
  rationale: बलिदान संबंधी संदर्भ में כפר के लिए ‘प्रायश्चित करना’ हिन्दी बाइबलीय भाषा में पहचाना जाने वाला और अर्थपूर्ण पद है।
- source_word: בְּאֵיל הָאָשָׁם
  choice: दोषबलि के मेढ़े के द्वारा
  rationale: אָשָׁם अपराध और प्रतिपूर्ति दोनों से संबद्ध विशिष्ट बलि है। ‘दोषबलि’ संक्षिप्त, परिचित पद है, जबकि ‘के द्वारा’ में בְּ का साधनवाचक भाव आता है।
- source_word: וְנִסְלַח לוֹ
  choice: और उसे क्षमा किया जाएगा
  rationale: निफ़ाल रूप को हिन्दी के स्वाभाविक कर्मवाच्य में रखा गया है; मूल में क्षमा देने वाले का नाम स्पष्ट नहीं किया गया।
theological_decisions:
- issue: बलिदान-संबंधी אָשָׁם का अनुवाद
  choice: दोषबलि
  alternative: क्षतिपूर्ति-बलि
  rationale: इस शब्द में दोष और प्रतिपूर्ति दोनों पहलू हैं। ‘दोषबलि’ अधिक संक्षिप्त और प्रचलित है, जबकि पद में भरपाई और पाँचवाँ भाग जोड़ने की आज्ञा प्रतिपूर्ति का पहलू पहले ही स्पष्ट करती है।
- issue: क्षमा देने वाले का कर्ता
  choice: उसे क्षमा किया जाएगा
  alternative: परमेश्वर उसे क्षमा करेगा
  rationale: मूल इब्रानी कर्मवाच्य है और कर्ता को स्पष्ट रूप से नहीं बताती। अनुवाद उसी निहितता को बनाए रखता है और उचित धार्मिक अनुमान को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज विधिक-धार्मिक शैली अपनाई गई है। ‘पवित्र वस्तु’, ‘याजक’, ‘प्रायश्चित’ और ‘दोषबलि’ जैसे प्रमुख पदों में बाइबलीय पहचान बनाए रखते हुए वाक्य-विन्यास को स्वाभाविक रखा गया है।
