base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/004.yaml
  text: Or if a person swears rashly with his lips to do evil or to do good—whatever a man may utter in an oath—and it is hidden from him[a], and then he comes to know it and becomes guilty in one of these matters[b],
translation:
  language: hi
  text: या यदि कोई व्यक्ति बिना सोचे-समझे अपने होंठों से शपथ खाए कि वह बुरा करे या भला—या किसी भी बात के विषय में, जिसे कोई मनुष्य शपथ खाकर कहे[a]—और वह बात उससे छिपी रहे[b], फिर उसे इसका पता चले और वह इनमें से किसी एक बात में दोषी हो जाए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का अर्थ केवल ‘होंठों से कह देना’ या ‘उच्चारण करना’ भी हो सकता है; इस प्रसंग में बिना सोचे-समझे या उतावलेपन से कही गई शपथ का भाव संभावित है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वह उससे अनजान रहे। इब्रानी यह स्पष्ट नहीं करता कि उसकी अनभिज्ञता शपथ, उसके परिणाम, या उसके उल्लंघन में से ठीक किस विषय में थी।
    reason: ambiguity
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: कोई व्यक्ति
  rationale: व्यवस्था-संबंधी प्रसंग में נֶפֶשׁ का अर्थ संपूर्ण व्यक्ति है, न कि अलग अभौतिक ‘आत्मा’।
- source_word: תִשָּׁבַע
  choice: शपथ खाए
  rationale: यहाँ शׁבע का निफ़अल रूप शपथ लेने को दर्शाता है; आधुनिक हिन्दी में ‘शपथ खाना’ स्वाभाविक और स्पष्ट है।
- source_word: לְבַטֵּא בִשְׂפָתַיִם
  choice: बिना सोचे-समझे अपने होंठों से
  rationale: בטא मूलतः होंठों से बात निकालने या कहने पर बल दे सकता है; इस कानूनी प्रसंग में असावधान या उतावली शपथ का भाव संभावित है। मुख्य पाठ प्रसंगगत भाव देता है और पादटिप्पणी शाब्दिक संभावना बचाती है।
- source_word: לְהָרַע אוֹ לְהֵיטִיב
  choice: बुरा या भला करेगा
  rationale: यह शपथ के विषय को व्यापक विपरीत ध्रुवों में व्यक्त करता है; ‘बुरा या भला’ इब्रानी की व्यापकता और तनाव को बनाए रखता है।
- source_word: לְכֹל אֲשֶׁר יְבַטֵּא הָאָדָם בִּשְׁבֻעָה
  choice: ऐसी कोई भी बात, जिसे कोई मनुष्य शपथ में कह दे
  rationale: यह पहले दिए गए बुरा या भला करने के उदाहरणों को हर प्रकार की कही गई शपथ तक विस्तृत करता है। הָאָדָם के प्रतिनिधिक एकवचन को ‘कोई मनुष्य’ से रखा गया है।
- source_word: וְנֶעְלַם מִמֶּנּוּ
  choice: वह बात उससे छिपी रहे
  rationale: इब्रानी की निष्क्रिय अभिव्यक्ति को बनाए रखा गया है; इसका आशय है कि शपथ या उससे जुड़ी अपनी जवाबदेही उसकी जानकारी में न रहे।
- source_word: וְהוּא יָדַע
  choice: पर बाद में उसे इसका पता चले
  rationale: पूर्व अनभिज्ञता के बाद ज्ञान होने का क्रम प्रसंग से स्पष्ट है; ‘बाद में’ इस विकास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאָשֵׁם לְאַחַת מֵאֵלֶּה
  choice: वह इनमें से किसी बात में दोषी ठहरे
  rationale: אָשֵׁם यहाँ कानूनी-धार्मिक दोष या उत्तरदायित्व को बताता है; ‘दोषी ठहरे’ उस स्थिति को स्पष्ट करता है और לְאַחַת מֵאֵלֶּה को पिछले मामलों से जोड़ता है।
theological_decisions:
- issue: कानूनी विधान में प्रतिनिधिक पुल्लिंग
  choice: נֶפֶשׁ के लिए ‘कोई व्यक्ति’ और הָאָדָם के लिए ‘कोई मनुष्य’
  alternative: दोनों स्थानों पर ‘कोई व्यक्ति’
  rationale: इब्रानी पाठ पहले व्यक्ति-सूचक נֶפֶשׁ और फिर सामान्य मानव-सूचक הָאָדָם का प्रयोग करता है। हिन्दी में ‘मनुष्य’ स्रोत के रूप को बचाते हुए स्त्रियों को विधान से बाहर नहीं करता।
- issue: בטא में उतावलेपन का भाव
  choice: मुख्य पाठ में ‘बिना सोचे-समझे’, पादटिप्पणी में केवल मौखिक उच्चारण की संभावना
  alternative: केवल ‘अपने होंठों से कहे’
  rationale: शब्द स्वयं बोलने या होंठों से निकालने का अर्थ दे सकता है, जबकि प्रसंग असावधान शपथ की ओर संकेत करता है। दोनों को अलग स्तरों पर रखकर वास्तविक अर्थगत अनिश्चितता सुरक्षित की गई है।
- issue: וְנֶעְלַם מִמֶּנּוּ का आशय
  choice: रूपक को बनाए रखते हुए ‘वह बात उससे छिपी रहे’
  alternative: ‘वह उससे अनजान रहे’
  rationale: निष्क्रिय इब्रानी रूप को सीधे रखना यह तय नहीं करता कि व्यक्ति शपथ, उसके परिणाम या अपने उल्लंघन में से ठीक किससे अनजान था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी विधान के अनुकूल रखी गई है। वाक्य को अगले पद से जुड़ने के कारण अल्पविराम पर समाप्त किया गया है। ‘अपने होंठों से’, ‘शपथ’, और ‘दोषी ठहरे’ स्रोत की औपचारिकता बनाए रखते हैं, जबकि ‘बिना सोचे-समझे’ और ‘पता चले’ सामान्य पाठक के लिए सहज हैं।
