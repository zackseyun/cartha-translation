base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/018.yaml
  text: He shall bring to the priest a ram without blemish from the flock[a], according to your valuation, for a guilt offering; and the priest shall make atonement for him concerning the error that he committed unintentionally, though he did not know it[b], and he shall be forgiven.
translation:
  language: hi
  text: वह झुंड में से एक निर्दोष मेढ़ा, तुम्हारे ठहराए मूल्य के अनुसार, दोषबलि[a] के लिए याजक के पास लाए। तब याजक उसकी उस चूक के लिए प्रायश्चित करे, जो उसने अनजाने में की थी और जिसकी उसे जानकारी नहीं थी;[b] तब उसे क्षमा किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दोषबलि के रूप में”; एक अन्य अनुवाद “क्षतिपूर्ति-बलि” है। इब्रानी אָשָׁם बलिदान की एक विशिष्ट श्रेणी का नाम है।
    reason: lexical_alternative
  - marker: b
    text: या “उसके अनजाने पाप के लिए।” इब्रानी में अनजाने में हुई चूक या अपराध पर बल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: वह ... लाए
  rationale: कानूनी निर्देश में संयोजक सहित हिफ़ील पूर्ण क्रिया भावी-विधिक अर्थ देती है; हिंदी में “लाए” स्वाभाविक निर्देशात्मक रूप है।
- source_word: אַיִל תָּמִים
  choice: एक निर्दोष मेढ़ा
  rationale: אַיִל वयस्क नर भेड़ है और बलिदानी संदर्भ में תָּמִים पशु के किसी दोष से रहित होने को बताता है।
- source_word: מִן הַצֹּאן
  choice: झुंड में से
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़-बकरियों, के समूह का द्योतक है; मेढ़े का उल्लेख पशु को पहले ही स्पष्ट करता है।
- source_word: בְּעֶרְכְּךָ
  choice: तुम्हारे ठहराए मूल्य के अनुसार
  rationale: यह बलिदानी-कानूनी प्रक्रिया में मूल्यांकन को दर्शाता है और मूल्य ठहराने वाले की पहचान को मूल की तरह अनिर्धारित रखता है।
- source_word: לְאָשָׁם
  choice: दोषबलि के रूप में
  rationale: אָשָׁם लैव्यव्यवस्था में बलिदान की एक विशिष्ट श्रेणी है; “दोषबलि” संक्षिप्त, परिचित और प्रसंगानुकूल है।
- source_word: וְכִפֶּר עָלָיו
  choice: याजक ... उसके लिए प्रायश्चित करे
  rationale: याजकीय बलिदानी संदर्भ में כפר के धार्मिक आशय को “प्रायश्चित करना” स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: עַל שִׁגְגָתוֹ אֲשֶׁר שָׁגָג
  choice: उसकी उस चूक के लिए, जो उससे अनजाने में हुई थी
  rationale: שׁגגה और सजातीय क्रिया अनजाने में हुए अपराध या चूक पर बल देती हैं; यह रूप अर्थ को सहज हिंदी में रखता है और जानबूझकर किए पाप का भाव नहीं जोड़ता।
- source_word: וְהוּא לֹא יָדַע
  choice: जिसके विषय में वह नहीं जानता था
  rationale: यह उपवाक्य उसकी अनभिज्ञता स्पष्ट करता है और पिछले अनजाने कृत्य से स्वाभाविक रूप से जुड़ता है।
- source_word: וְנִסְלַח לוֹ
  choice: उसे क्षमा किया जाएगा
  rationale: סלח का निफ़ाल रूप क्षमा के परिणाम को कर्मवाच्य में व्यक्त करता है; यह अनकहे कर्ता को मूल की तरह अनकहा रखता है।
theological_decisions:
- issue: אָשָׁם नामक बलिदानी श्रेणी का अनुवाद
  choice: दोषबलि
  alternative: क्षतिपूर्ति-बलि
  rationale: “दोषबलि” विशिष्ट बलिदानी श्रेणी को पहचानने योग्य ढंग से व्यक्त करता है, जबकि पादटिप्पणी उसके क्षतिपूर्ति-संबंधी वैकल्पिक नाम को सुरक्षित रखती है।
- issue: כפר का अनुवाद
  choice: प्रायश्चित करे
  alternative: दोष का निवारण करे
  rationale: पाठ याजक की बलिदानी क्रिया और उसके बाद मिलने वाली क्षमा को अलग-अलग बताता है; “प्रायश्चित” इस धार्मिक भार को बिना किसी अतिरिक्त सिद्धान्तगत व्याख्या के बनाए रखता है।
- issue: שׁגגה की नैतिक-कानूनी तीव्रता
  choice: चूक
  alternative: अनजाना पाप
  rationale: “चूक” मूल में निहित अनजानेपन को सामने रखती है, जबकि पादटिप्पणी स्पष्ट करती है कि इसे “अनजाना पाप” भी समझा जा सकता है; इससे वास्तविक शाब्दिक तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी-बलिदानी प्रसंग के अनुकूल रखी गई है। “तुम्हारे” मूल के एकवचन संबोधन को आधुनिक हिंदी में स्वाभाविक रूप देता है। सजातीय इब्रानी शब्दों की पुनरुक्ति को अत्यधिक कृत्रिम बनाए बिना “चूक” और “अनजाने” से व्यक्त किया गया है।
