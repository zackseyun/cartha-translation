source:
  edition: WLC
  text: וְ/אֶת הַ/שֵּׁנִ֛י יַעֲשֶׂ֥ה עֹלָ֖ה כַּ/מִּשְׁפָּ֑ט וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן מֵ/חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/010.yaml
  text: And he shall prepare the second as a burnt offering according to the ordinance[a], and the priest shall make atonement for him for the sin that he committed[b], and he shall be forgiven.
translation:
  language: hi
  text: और दूसरे पक्षी को वह निर्धारित विधि के अनुसार होमबलि के रूप में चढ़ाएगा[a]। याजक उसके उस पाप के लिए प्रायश्चित करेगा जो उसने किया, और उसे क्षमा किया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ठहराई हुई रीति के अनुसार।’
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में क्षमा की बात कर्मवाच्य में कही गई है; क्षमा करने वाले परमेश्वर का नाम स्पष्ट रूप से नहीं लिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֵּׁנִי
  choice: दूसरे पक्षी को
  rationale: यह क्रमवाचक विशेषण पिछले प्रसंग में बताए गए दो पक्षियों में से दूसरे को दर्शाता है। स्पष्टता के लिए प्रसंग से ‘पक्षी’ जोड़ा गया है।
- source_word: יַעֲשֶׂה עֹלָה
  choice: होमबलि के रूप में चढ़ाएगा
  rationale: עשה का मूल अर्थ व्यापक है, पर बलिदान-विधि के प्रसंग में ‘चढ़ाना’ स्वाभाविक है; עֹלָה के लिए प्रचलित और सटीक शब्द ‘होमबलि’ रखा गया है।
- source_word: כַּמִּשְׁפָּט
  choice: निर्धारित विधि के अनुसार
  rationale: यहाँ מִשְׁפָּט बलि चढ़ाने की स्थापित रीति या निर्धारित प्रक्रिया को सूचित करता है, न कि न्यायिक निर्णय को।
- source_word: וְכִפֶּר עָלָיו
  choice: उसके लिए प्रायश्चित करेगा
  rationale: याजकीय बलिदान के संदर्भ में כפר के पारंपरिक धार्मिक अर्थ को बनाए रखते हुए किसी बाद की विशिष्ट धर्मसैद्धांतिक व्याख्या को नहीं जोड़ा गया।
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: उसके उस पाप के लिए ... जो उसने किया है
  rationale: हिब्रू की पुनरुक्तिपूर्ण अभिव्यक्ति का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है और संबंधित अपराध स्पष्ट रखा गया है।
- source_word: וְנִסְלַח לוֹ
  choice: उसे क्षमा किया जाएगा
  rationale: हिब्रू के कर्मवाच्य क्षमा-सूत्र को सुरक्षित रखा गया है; क्षमा करने वाले परमेश्वर को पाठ में स्पष्ट कर्ता बनाकर नहीं जोड़ा गया।
theological_decisions:
- issue: याजकीय प्रायश्चित की भाषा
  choice: उसके लिए प्रायश्चित करेगा
  alternative: उसे शुद्ध करेगा / उसके लिए क्षमा प्राप्त करेगा
  rationale: ‘प्रायश्चित’ बलिदान-संबंधी כפר की व्यापक धार्मिक धारणा को बनाए रखता है और उसे केवल शुद्धि या क्षमा-प्राप्ति तक सीमित नहीं करता।
- issue: क्षमा के कर्मवाच्य सूत्र को सुरक्षित रखना
  choice: उसे क्षमा किया जाएगा
  alternative: यहोवा उसे क्षमा करेगा
  rationale: मूल पाठ क्षमा देने वाले को स्पष्ट रूप से नामित नहीं करता। हिन्दी में कर्मवाच्य रखकर उसी श्रद्धापूर्ण अप्रत्यक्षता और धर्मवैचारिक तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण धार्मिक गद्य। ‘होमबलि’, ‘याजक’ और ‘प्रायश्चित’ जैसे स्थापित बाइबलीय शब्द सामान्य पाठक की समझ के अनुकूल बनाए रखे गए हैं।
