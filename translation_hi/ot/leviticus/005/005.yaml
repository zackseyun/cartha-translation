source:
  edition: WLC
  text: וְ/הָיָ֥ה כִֽי יֶאְשַׁ֖ם לְ/אַחַ֣ת מֵ/אֵ֑לֶּה וְ/הִ֨תְוַדָּ֔ה אֲשֶׁ֥ר חָטָ֖א עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/005.yaml
  text: And it shall be[a], when he becomes guilty in one of these matters[b], that he shall confess what he has sinned in regard to it.
translation:
  language: hi
  text: और जब कोई इन बातों में से किसी एक में दोषी ठहरे[a], तब वह उस बात के संबंध में किए गए अपने पाप को स्वीकार करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दोष का भागी हो” या “दोषी हो।” इब्रानी क्रिया केवल भीतर दोष का बोध होने के बजाय दोष अथवा दायित्व के अधीन होने पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִי
  choice: और जब
  rationale: विधिक प्रसंग में यह अगली परिस्थिति प्रस्तुत करने वाला सूत्र है। हिंदी में ‘और जब’ औपचारिक क्रम तथा अपेक्षित परिस्थिति—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יֶאְשַׁם
  choice: दोषी ठहरे
  rationale: अर्थ केवल भीतर दोष का बोध होना नहीं, बल्कि दोष अथवा विधिक दायित्व के अधीन होना है। ‘दोषी ठहरे’ इस न्यायिक बल को बनाए रखता है।
- source_word: לְאַחַת מֵאֵלֶּה
  choice: इन बातों में से किसी एक के कारण
  rationale: यह वाक्यांश पहले गिनाए गए मामलों में से किसी एक की ओर संकेत करता है। ‘बातों’ सामान्य पाठक के लिए सहज है और ‘के कारण’ दोष से उसके संबंध को स्पष्ट करता है।
- source_word: וְהִתְוַדָּה
  choice: तो वह … मान ले
  rationale: हित्पएल रूप यहाँ पाप को स्वीकार करने का अर्थ देता है। ‘मान ले’ आधुनिक हिंदी में अपराध अथवा पाप की स्पष्ट स्वीकृति के लिए स्वाभाविक है और विधिक निर्देश को व्यक्त करता है।
- source_word: אֲשֶׁר חָטָא עָלֶיהָ
  choice: उस बात को … जिसमें उसने पाप किया है
  rationale: यह अनुवाद स्वीकारोक्ति की विषय-वस्तु और स्त्रीलिंग प्रत्यय द्वारा पहले बताए मामले की ओर लौटते संकेत—दोनों को सुरक्षित रखता है, बिना हिंदी को अनावश्यक रूप से अस्वाभाविक बनाए।
theological_decisions:
- issue: יֶאְשַׁם में वस्तुगत दोष बनाम दोष का आत्मबोध
  choice: दोषी ठहरे
  alternative: उसे अपने दोष का बोध हो
  rationale: हिब्रू क्रिया विधिक दोष या दायित्व को व्यक्त करती है; केवल आत्मबोध का अर्थ जोड़ना मूल पाठ से अधिक निश्चित व्याख्या होती।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट विधिक शैली अपनाई गई है। पद की शर्त और आज्ञा का क्रम बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
