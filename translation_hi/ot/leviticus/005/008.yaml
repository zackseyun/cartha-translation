id: LEV.5.8
reference: Leviticus 5:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֵבִ֤יא אֹתָ/ם֙ אֶל הַ/כֹּהֵ֔ן וְ/הִקְרִ֛יב אֶת אֲשֶׁ֥ר לַ/חַטָּ֖את רִאשׁוֹנָ֑ה וּ/מָלַ֧ק אֶת רֹאשׁ֛/וֹ מִ/מּ֥וּל עָרְפּ֖/וֹ וְ/לֹ֥א יַבְדִּֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/008.yaml
  text: And he shall bring them to the priest[a], and he shall present first the one for the sin offering, and he shall pinch off its head from the front of its neck[c][b], but he shall not sever it.
translation:
  language: hi
  text: वह उन दोनों को याजक के पास लाए। याजक पहले उस पक्षी को अर्पित करे जो पापबलि[a] के लिए है। वह उसकी गरदन के सामने की ओर से उसका सिर मरोड़े[b], पर उसे पूरी तरह अलग न करे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अनुवाद यहाँ “शुद्धिकरण-बलि” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह पक्षी-बलि में याजक द्वारा की जाने वाली एक विशेष विधिक क्रिया का शब्द है; इसका अनुवाद “सिर ऐंठे” भी किया जाता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात पक्षी का सिर उसके शरीर से पूर्णतः अलग नहीं किया जाना था।
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיא אֹתָם אֶל הַכֹּהֵן
  choice: वह उन दोनों को याजक के पास लाए
  rationale: कानूनी निर्देश का भाव बनाए रखा गया है। बहुवचन אֹתָם पिछले पद में बताए गए दो पक्षियों की ओर संकेत करता है, इसलिए स्वाभाविक हिन्दी में ‘उन दोनों’ कहा गया है।
- source_word: וְהִקְרִיב
  choice: याजक ... अर्पित करे
  rationale: हिफ़ईल रूप बलिदान-विधि में किसी वस्तु को वेदी के निकट प्रस्तुत या अर्पित करने को दर्शाता है। ‘अर्पित करे’ सामान्य पाठक के लिए सहज है; प्रसंग से कर्ता याजक है, इसलिए हिन्दी में उसे स्पष्ट किया गया है।
- source_word: אֶת אֲשֶׁר לַחַטָּאת רִאשׁוֹנָה
  choice: पहले उस पक्षी को ... जो पापबलि के लिए है
  rationale: רִאשׁוֹנָה के क्रमसूचक अर्थ और दो पक्षियों में से एक के חַטָּאת के लिए निर्धारित होने—दोनों को स्पष्ट रखा गया है।
- source_word: חַטָּאת
  choice: पापबलि
  rationale: यह लैव्यव्यवस्था के बलिदानी संदर्भ में पाप से संबंधित बलि का प्रचलित और समझने योग्य नाम है। ‘शुद्धिकरण-बलि’ भी सम्भव विशिष्ट व्याख्या है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּמָלַק
  choice: उसका सिर मरोड़े
  rationale: מלק पक्षी-बलि में याजक की एक विशिष्ट हाथ की क्रिया का तकनीकी शब्द है। ‘मरोड़े’ हिन्दी में क्रिया की प्रकृति बताता है, जबकि अगले वाक्यांश से स्पष्ट होता है कि सिर पूरी तरह अलग नहीं किया जाना था।
- source_word: מִמּוּל עָרְפּוֹ
  choice: उसकी गरदन के सामने की ओर से
  rationale: यह कठिन वाक्यांश गरदन अथवा गरदन के पिछले भाग के सामने/विपरीत दिशा से की जाने वाली क्रिया बताता है। चुना हुआ रूप स्थानगत भाषा को बनाए रखता है और केवल ‘गरदन के पीछे से’ कहकर अस्पष्टता को अनावश्यक रूप से समाप्त नहीं करता।
- source_word: וְלֹא יַבְדִּיל
  choice: पर उसे पूरी तरह अलग न करे
  rationale: בדל का मूल अर्थ अलग करना है। यहाँ निषेध का व्यावहारिक आशय है कि सिर शरीर से पूर्णतः अलग न हो; ‘पूरी तरह’ प्रसंगगत अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: חַטָּאת का बलिदानी अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: ‘पापबलि’ हिन्दी बाइबलीय प्रयोग में परिचित है, पर इब्रानी पद शुद्धिकरण की धार्मिक क्रिया पर भी बल दे सकता है। वैकल्पिक अर्थ को पादटिप्पणी में देकर इस अर्थ-तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। विधिक निर्देश के लिए ‘लाए’ और ‘करे’ का प्रयोग किया गया है। पहले वाक्य के अर्पणकर्ता और आगे की विधि करने वाले याजक के बीच सम्भावित अस्पष्टता को प्रसंगानुसार ‘याजक’ दोहराकर स्पष्ट किया गया है। ‘गरदन के सामने की ओर से’ कठिन इब्रानी स्थानगत वाक्यांश को अत्यधिक निश्चित किए बिना प्रस्तुत करता है।
