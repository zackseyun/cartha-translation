  text: וְ/הִזָּ֞ה מִ/דַּ֤ם הַ/חַטָּאת֙ עַל קִ֣יר הַ/מִּזְבֵּ֔חַ וְ/הַ/נִּשְׁאָ֣ר בַּ/דָּ֔ם יִמָּצֵ֖ה אֶל יְס֣וֹד הַ/מִּזְבֵּ֑חַ חַטָּ֖את הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/005/009.yaml
  text: And he shall sprinkle some of the blood of the sin offering on the side of the altar[a], and the rest of the blood shall be drained out at the base of the altar; it is a sin offering.
translation:
  language: hi
  text: और वह पापबलि[a] के लहू में से कुछ वेदी की दीवार पर छिड़के, और बचा हुआ लहू वेदी के आधार पर निचोड़ा जाए; यह पापबलि है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि”; इस पद में आए “पापबलि” के दोनों प्रयोगों के लिए। इब्रानी शब्द חַטָּאת पाप के लिए चढ़ाई जाने वाली उस बलि को भी दर्शा सकता है जिसमें उसके शुद्धिकरणकारी कार्य पर बल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: वह...छिड़के
  rationale: हिफ़ील रूप यहाँ बलिदान-विधि में लहू को विधिपूर्वक लगाने या छिड़कने का बोध देता है; ‘छिड़के’ स्वाभाविक और प्रचलित हिन्दी है।
- source_word: מִדַּם
  choice: लहू में से कुछ
  rationale: 'מִן यहाँ अंशसूचक है: इस चरण में पूरे लहू के बजाय उसका कुछ भाग लगाया जाता है।'
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: यहाँ חַטָּאת पाप नहीं, पाप से संबंधित बलिदान की श्रेणी को दर्शाता है। ‘पापबलि’ संक्षिप्त, परिचित और प्रसंगानुकूल है; शुद्धिकरण के पहलू को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: वेदी की बगल पर
  rationale: קִיר का शाब्दिक अर्थ ‘दीवार’ है, पर वेदी के ठोस पार्श्व के लिए आधुनिक हिन्दी में ‘बगल’ अधिक सहज है और स्थानगत अर्थ बनाए रखता है।
- source_word: וְהַנִּשְׁאָר בַּדָּם
  choice: जो लहू बचा रहे
  rationale: निफ़ाल कृदंत का अर्थ बचा हुआ अंश है; यह हिन्दी अभिव्यक्ति उसके संबंधवाचक स्वरूप को स्वाभाविक ढंग से रखती है।
- source_word: יִמָּצֶה
  choice: निचोड़ दे
  rationale: מצה का निफ़ाल यहाँ पक्षी से बचे हुए लहू को दबाकर पूर्णतः निकालने की क्रिया सूचित करता है; ‘निचोड़ दे’ केवल उँडेलने की अपेक्षा इस विशिष्ट क्रिया को बेहतर व्यक्त करता है।
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: वेदी के आधार पर
  rationale: יְסוֹד वेदी की नींव या निचले आधार को दर्शाता है; ‘आधार’ सटीक और सहज है।
- source_word: חַטָּאת הוּא
  choice: यह पापबलि है
  rationale: यह उपवाक्य बलिदान की विधिक श्रेणी बताता है; पहले प्रयोग के साथ एकरूपता रखी गई है।
theological_decisions:
- issue: बलिदान-विधान में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: इब्रानी पद बलि का पाप से संबंध और उसके शुद्धिकरणकारी कार्य—दोनों संकेत कर सकता है। मुख्य पाठ में व्यापक रूप से पहचाना जाने वाला ‘पापबलि’ रखा गया है, जबकि वास्तविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक और गरिमापूर्ण शैली रखी गई है। ‘लहू’, ‘वेदी’ और ‘पापबलि’ जैसे परिचित बाइबलीय शब्द सामान्य पाठक के लिए स्पष्ट हैं। क्रियाओं को हिन्दी विधानात्मक शैली में ‘छिड़के’ और ‘निचोड़ दे’ के रूप में रखा गया है।
