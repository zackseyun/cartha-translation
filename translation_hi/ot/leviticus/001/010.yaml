  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֨אן קָרְבָּנ֧/וֹ מִן הַ/כְּשָׂבִ֛ים א֥וֹ מִן הָ/עִזִּ֖ים לְ/עֹלָ֑ה זָכָ֥ר תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/010.yaml
  text: And if his offering is from the flock, from the sheep or from the goats, for a burnt offering, he shall offer it, a male without blemish.
translation:
  language: hi
  text: और यदि उसका चढ़ावा भेड़-बकरियों के झुंड में से, भेड़ों में से या बकरियों में से, होमबलि[a] के लिए हो, तो वह निर्दोष[b] नर चढ़ाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “होमबलि के रूप में।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “निर्दोष” का अर्थ है शारीरिक दोष से रहित, जो इस बलिदान के लिए आवश्यक था।
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: संयोजक ו और शर्तसूचक אִם दोनों को स्वाभाविक हिन्दी में बनाए रखता है और बलिदान-विधि के अगले संभावित मामले का परिचय देता है।
- source_word: מִן הַצֹּאן
  choice: भेड़-बकरियों के झुंड में से
  rationale: צֹאן छोटे पालतू पशुओं, विशेषतः भेड़ और बकरी, का सामूहिक पद है। हिन्दी में केवल ‘झुंड’ अस्पष्ट हो सकता है, इसलिए पशु-वर्ग को स्पष्ट किया गया है; आगे आने वाले उपवर्ग भी बने रहते हैं।
- source_word: קָרְבָּנוֹ
  choice: उसका चढ़ावा
  rationale: קָרְבָּן उपासना में निकट लाकर अर्पित की जाने वाली भेंट है। ‘चढ़ावा’ सामान्य आधुनिक हिन्दी में स्पष्ट है और बलिदान-संदर्भ के अनुकूल है।
- source_word: מִן הַכְּשָׂבִים
  choice: भेड़ों में से
  rationale: כְּשָׂבִים यहाँ बकरियों के विपरीत भेड़-वर्ग को बताता है; इसे ‘मेमने’ कहने से आयु अनावश्यक रूप से सीमित हो जाती।
- source_word: אוֹ מִן הָעִזִּים
  choice: या बकरियों में से
  rationale: עִזִּים का सामान्य सामूहिक अर्थ बकरियाँ है; यह भेड़-वर्ग के साथ स्पष्ट विकल्प प्रस्तुत करता है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה उस बलिदान की स्थापित संज्ञा है जो वेदी पर पूर्णतः जलाया जाता था। ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और पहचाना हुआ पद है।
- source_word: זָכָר תָּמִים
  choice: निर्दोष नर
  rationale: זָכָר पशु का नर होना स्पष्ट करता है और תָּמִים बलिदान योग्य, शारीरिक दोष से रहित अवस्था बताता है। हिन्दी में विशेषण-संज्ञा का यह क्रम स्वाभाविक है।
- source_word: יַקְרִיבֶנּוּ
  choice: वह ... चढ़ाएगा
  rationale: קרב का हिफ़ील रूप बलिदान के रूप में प्रस्तुत या अर्पित करने को दर्शाता है। प्रत्यय का कर्म इसी निर्दोष नर पशु से स्पष्ट है, इसलिए हिन्दी में अलग ‘उसे’ जोड़ना अनावश्यक और कुछ अस्वाभाविक होता।
theological_decisions:
- issue: बलिदान-संज्ञा עֹלָה का अनुवाद
  choice: होमबलि
  alternative: पूर्णाहुति; ऊपर उठनेवाली भेंट
  rationale: संदर्भ में यह स्थापित लैव्यव्यवस्थीय बलिदान-श्रेणी है। ‘होमबलि’ आधुनिक हिन्दी पाठकों के लिए अपेक्षाकृत परिचित है और व्युत्पत्तिमूलक ‘ऊपर उठने’ के अर्थ को ऐसी व्याख्या में नहीं बदलता जिसे पद स्वयं स्पष्ट नहीं करता।
- issue: बलि-पशु के लिंग की स्पष्ट शर्त
  choice: नर
  alternative: नर पशु
  rationale: मूल पाठ זָכָר द्वारा पशु का लिंग स्पष्ट रूप से निर्धारित करता है; इसे सामान्य या लिंग-निरपेक्ष अभिव्यक्ति में नहीं बदला गया।
- issue: תָּמִים की बलिदान-संदर्भित योग्यता
  choice: निर्दोष
  alternative: बेदाग; सम्पूर्ण
  rationale: यहाँ शब्द नैतिक निष्पापता नहीं, बल्कि बलि-पशु में शारीरिक दोष न होने की अपेक्षा व्यक्त करता है। पादटिप्पणी इस सांस्कृतिक-विधिक अर्थ को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। ‘भेड़-बकरियों के झुंड’ צֹאן के सामूहिक अर्थ को सामान्य हिन्दी में स्पष्ट करता है। वाक्य में दीर्घ विरामचिह्नों से मुख्य शर्त और भेड़/बकरी के विकल्प पठनीय बनाए गए हैं।
