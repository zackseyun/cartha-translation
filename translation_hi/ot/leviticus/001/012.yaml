  yaml_path: translation/ot/leviticus/001/012.yaml
  text: And he shall cut it into its pieces[a], with its head and its fat, and the priest shall arrange them on the wood that is on the fire, which is on the altar.
translation:
  language: hi
  text: और वह उसे उसके टुकड़ों में काटे—उसके सिर और उसकी चरबी[a] समेत। तब याजक उन्हें वेदी पर की आग पर रखी लकड़ियों पर क्रम से लगाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी चर्बीयुक्त परत” अथवा “उसकी अंतड़ियों के आसपास की चरबी।” इब्रानी शब्द बलि-पशु से जुड़े वसायुक्त ऊतक को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִתַּח אֹתוֹ לִנְתָחָיו
  choice: वह उसे उसके टुकड़ों में काटे
  rationale: बलिदान-संबंधी प्रसंग में נתח पशु को अलग-अलग टुकड़ों में काटने की क्रिया बताता है। कानूनी निर्देश का भाव व्यक्त करने के लिए हिंदी में विध्यर्थक ‘काटे’ स्वाभाविक है।
- source_word: רֹאשׁוֹ
  choice: उसके सिर
  rationale: यह पशु के सिर के लिए सीधा शारीरिक पद है; संबंधसूचक रूप मूल पाठ के अनुरूप रखा गया है।
- source_word: פִּדְרוֹ
  choice: उसकी चरबी
  rationale: פדר बलि-पशु से जुड़े वसायुक्त ऊतक, संभवतः अंतड़ियों के आसपास की चरबी, को सूचित करता है। ‘चरबी’ आधुनिक हिंदी में स्पष्ट है और मूल शब्द की सीमा को अनावश्यक रूप से संकीर्ण नहीं करती।
- source_word: וְעָרַךְ
  choice: क्रम से लगाए
  rationale: पूजा-विधि में ערך वस्तुओं को व्यवस्थित ढंग से रखने का संकेत देता है। ‘क्रम से लगाए’ आदेशित व्यवस्था और स्वाभाविक हिंदी दोनों को बनाए रखता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के पूजा-विधिक संदर्भ में כהן के लिए प्रचलित और गरिमापूर्ण हिंदी पद।
- source_word: אֹתָם
  choice: उन्हें
  rationale: यह कटे हुए टुकड़ों, सिर और चरबी को सामूहिक रूप से संदर्भित करता है।
- source_word: עַל הָעֵצִים
  choice: लकड़ियों पर
  rationale: हिब्रू बहुवचन को हिंदी में स्वाभाविक बहुवचन ‘लकड़ियों’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: वेदी पर की आग के ऊपर रखी लकड़ियों पर
  rationale: हिब्रू की स्थान-संबंधी परतों—लकड़ियाँ आग पर और आग वेदी पर—को अर्थ की दृष्टि से सुरक्षित रखते हुए आधुनिक हिंदी में सुगठित किया गया है।
