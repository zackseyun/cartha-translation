source:
  edition: WLC
  text: וְ/שָׁחַ֨ט אֹת֜/וֹ עַ֣ל יֶ֧רֶךְ הַ/מִּזְבֵּ֛חַ צָפֹ֖נָ/ה לִ/פְנֵ֣י יְהוָ֑ה וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/011.yaml
  text: And he shall slaughter it on the north side of the altar before Yahweh[a], and Aaron’s sons, the priests, shall throw its blood against the altar all around.
translation:
  language: hi
  text: वह उस पशु को याहवे के सामने वेदी के उत्तर पार्श्व पर वध करे; और हारून के पुत्र, अर्थात् याजक, उसका लहू वेदी पर चारों ओर फेंकें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका लहू वेदी पर चारों ओर जोर से डालें।” इब्रानी क्रिया हल्के से छिड़कने के बजाय लहू को फेंकने या बलपूर्वक डालने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: बलि करे
  rationale: यह बलिपशु को विधिपूर्वक वध करने का मानक बलिदानी क्रिया-पद है। हिंदी में ‘बलि करे’ अनुष्ठानिक संदर्भ और विधिक निर्देश दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יֶרֶךְ הַמִּזְבֵּחַ צָפֹנָה
  choice: वेदी की उत्तर दिशा में
  rationale: יֶרֶךְ का मूल भाव ‘बगल/पार्श्व’ है और צָפֹנָה उत्तर की ओर स्थान बताता है; यह हिंदी अभिव्यक्ति निर्धारित स्थान को स्पष्ट और स्वाभाविक रखती है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह उपासना-संबंधी स्थिर अभिव्यक्ति यहोवा की उपस्थिति में किए जाने वाले कर्म को दर्शाती है; दिव्य नाम को व्यक्तिनाम के रूप में रखा गया है।
- source_word: וְזָרְקוּ
  choice: उछालें
  rationale: זרק का अर्थ फेंकना या जोर से डालना है। ‘उछालें’ लहू को हल्के से छिड़कने के बजाय वेदी पर बलपूर्वक डालने का भाव सुरक्षित रखता है।
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: हारून के पुत्र, जो याजक हैं
  rationale: यह रूप वंश और पद दोनों को स्पष्ट करता है तथा इब्रानी समानाधिकरण का अर्थ स्वाभाविक हिंदी में देता है।
- source_word: דָּמוֹ
  choice: उसका लहू
  rationale: प्रत्यय बलिपशु की ओर संकेत करता है। ‘उसका’ हिंदी में पशु के लिए स्वाभाविक है और संदर्भ से संबंध स्पष्ट है।
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: वेदी पर चारों ओर
  rationale: עַל लक्ष्य-सतह को और סָבִיב वेदी के चारों ओर की क्रिया को दर्शाता है। यह अनुवाद स्थानिक अर्थ को स्पष्ट रखते हुए अनावश्यक व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरीय दिव्य नाम है। आधुनिक हिंदी बाइबल-पाठकों में व्यापक रूप से पहचाने जाने वाले व्यक्तिनाम ‘यहोवा’ से इसे किसी उपाधि में बदले बिना सुरक्षित रखा गया है; ‘याहवे’ अधिक संभावित विद्वत्तापूर्ण उच्चारण है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण विधिक-अनुष्ठानिक शैली रखी गई है। ‘बलि करे’ और ‘उछालें’ सामान्य पाठक के लिए सहज हैं, जबकि मूल क्रियाओं की विशिष्टता भी बनाए रखते हैं।
