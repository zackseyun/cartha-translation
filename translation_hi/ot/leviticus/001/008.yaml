base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/008.yaml
  text: And Aaron’s sons[a], the priests, shall arrange the pieces, the head, and the fat on the wood that is on the fire that is on the altar.
translation:
  language: hi
  text: और हारून के पुत्र, याजक, उन टुकड़ों, सिर और चर्बी[a] को उन लकड़ियों के ऊपर क्रम से रखें जो वेदी पर की आग पर रखी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेद’ अथवा ‘चर्बी की परत’; इब्रानी शब्द बलि में प्रयुक्त पशु के किसी वसायुक्त भाग को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָרְכוּ
  choice: क्रम से सजाएँ
  rationale: बलि-संबंधी संदर्भ में ערך का अर्थ वस्तुओं को नियत क्रम में रखना है। ‘क्रम से सजाएँ’ विधिपरक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: हारून के पुत्र, जो याजक हैं
  rationale: यह पदबंध हारून के पुत्रों की पहचान याजकों के रूप में कराता है। संबंधवाचक उपवाक्य हिन्दी में इस समानाधिकरण को स्पष्ट और सहज बनाता है।
- source_word: הַנְּתָחִים
  choice: उन टुकड़ों
  rationale: यह पिछले चरण में काटे गए पशु के अंगों या खंडों को सूचित करता है। ‘टुकड़ों’ सहज और पर्याप्त रूप से ठोस है; ‘उन’ पूर्वोक्त टुकड़ों की ओर संकेत करता है।
- source_word: הָרֹאשׁ
  choice: सिर
  rationale: मूल का सीधा शारीरिक अर्थ सुरक्षित रखा गया है।
- source_word: הַפָּדֶר
  choice: चर्बी
  rationale: पद बलि में प्रयुक्त पशु के किसी वसायुक्त भाग, संभवतः मेद या चर्बी की परत, को सूचित करता है। ‘चर्बी’ सामान्य पाठक के लिए सर्वाधिक सुबोध है; शारीरिक सूक्ष्मता की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: עַל הָעֵצִים
  choice: लकड़ियों के ऊपर
  rationale: עֵצִים यहाँ ईंधन के लिए रखी लकड़ियों का बोध कराता है। हिन्दी में बहुवचन ‘लकड़ियों’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: אֲשֶׁר עַל הָאֵשׁ אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: वेदी पर की आग पर रखी लकड़ियों के ऊपर
  rationale: स्थानिक संबंध—वेदी पर आग और आग पर लकड़ियाँ—स्पष्ट रखा गया है। मूल की क्रमिक संबंधवाचक रचना को हिन्दी में स्वाभाविक रूप देकर अर्थ-संबंध सुरक्षित रखा गया है।
