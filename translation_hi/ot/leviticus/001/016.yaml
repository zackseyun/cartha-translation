  text: וְ/הֵסִ֥יר אֶת מֻרְאָת֖/וֹ בְּ/נֹצָתָ֑/הּ וְ/הִשְׁלִ֨יךְ אֹתָ֜/הּ אֵ֤צֶל הַ/מִּזְבֵּ֨חַ֙ קֵ֔דְמָ/ה אֶל מְק֖וֹם הַ/דָּֽשֶׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/016.yaml
  text: He shall remove its crop with its feathers and throw it beside the altar[a], on the east side[b], to the place of the ashes.
translation:
  language: hi
  text: वह उसकी अन्न-थैली[a] को उसके पंखों[b] समेत निकालकर वेदी के पास, उसके पूर्वी भाग में, राख के स्थान पर फेंक दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात पक्षी का वह थैलीनुमा अंग जिसमें भोजन कुछ समय रहता है; इसे ‘पोटा’ भी कहा जाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ का सीधा अर्थ ‘उसके पंखों समेत’ है; कुछ अनुवाद इसे ‘उसकी गंदगी समेत’ मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵסִיר
  choice: निकालकर
  rationale: सור के हिफ़ील रूप का अर्थ यहाँ किसी अंग को हटाना या निकालना है। ‘निकालकर’ बलिदान-विधि की क्रमिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֻרְאָתוֹ
  choice: उसकी अन्न-थैली
  rationale: पक्षी के संदर्भ में यह शब्द उस थैलीनुमा अंग को दर्शाता है जिसमें भोजन कुछ समय रहता है। ‘अन्न-थैली’ सामान्य पाठक के लिए शारीरिक अंग का अर्थ स्पष्ट करती है।
- source_word: בְּנֹצָתָהּ
  choice: उसके पंखों समेत
  rationale: व्यंजन-पाठ का सीधा संबंध נוצה, अर्थात ‘पंख/पर’, से है। कठिन पद होने के कारण वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: וְהִשְׁלִיךְ אֹתָהּ
  choice: फेंक दे
  rationale: שלך का हिफ़ील रूप यहाँ फेंकने की सीधी क्रिया बताता है; ‘फेंक दे’ विधिक निर्देश के अनुरूप है।
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: वेदी के पास
  rationale: אצל निकटता अथवा बगल में होने का बोध कराता है। ‘वेदी के पास’ स्पष्ट और स्वाभाविक है।
- source_word: קֵדְמָה
  choice: पूर्व की ओर
  rationale: यह दिशासूचक क्रियाविशेषण पूर्व दिशा में स्थित स्थान को निर्दिष्ट करता है।
- source_word: אֶל מְקוֹם הַדָּשֶׁן
  choice: राख डालने की जगह पर
  rationale: बलिदान-संदर्भ में דשן वेदी से निकाली गई राख को दर्शा सकता है। यह अनुवाद निर्धारित स्थान और उसके उपयोग दोनों को सहज हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: בְּנֹצָתָהּ का कठिन अर्थ
  choice: उसके पंखों समेत
  alternative: उसकी गंदगी समेत
  rationale: मसोरेटिक व्यंजन-पाठ का सर्वाधिक सीधा शब्दार्थ ‘पंखों समेत’ है; फिर भी प्राचीन व्याख्यात्मक परंपरा और कुछ अनुवाद इसे अन्न-थैली की गंदगी या मल से जोड़ते हैं, इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक निर्देश के अनुरूप रखी गई है। तकनीकी पक्षी-अंग के लिए केवल दुर्लभ शब्द देने के बजाय समझ में आने वाला ‘अन्न-थैली’ चुना गया है। दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
