source:
  edition: WLC
  text: וְ/שִׁסַּ֨ע אֹת֣/וֹ בִ/כְנָפָי/ו֮ לֹ֣א יַבְדִּיל֒ וְ/הִקְטִ֨יר אֹת֤/וֹ הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/017.yaml
  text: He shall tear it open by its wings[a], but he shall not divide it; and the priest shall burn it on the altar, on the wood that is on the fire. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: hi
  text: वह उसे उसके पंखों के पास से चीरकर खोले, पर उसे अलग न करे। तब याजक उसे वेदी पर, आग पर रखी लकड़ियों पर जलाए। यह होमबलि है—याहवे के लिए सुखद सुगंध वाली अग्नि-भेंट[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भोजन-भेंट।”
    reason: אִשֶּׁה के लिए ‘अग्नि-भेंट’ और ‘भोजन-भेंट’ दोनों व्याख्याएँ प्रस्तावित हैं।
lexical_decisions:
- source_word: שִׁסַּע
  choice: चीरकर खोले
  rationale: क्रिया पक्षी को चीरने या फाड़ने की क्रिया बताती है। अगले वाक्यांश में दोनों भाग अलग न करने की आज्ञा है, इसलिए ‘चीरकर खोले’ अधूरा विभाजन स्पष्ट करता है।
- source_word: בִכְנָפָיו
  choice: उसके पंखों के बीच से
  rationale: पूर्वसर्ग पंखों को चीरने की जगह या माध्यम के रूप में प्रस्तुत कर सकता है। यह अभिव्यक्ति ठोस चित्र को स्वाभाविक हिन्दी में रखती है, बिना पंख काटने का अर्थ जोड़े।
- source_word: לֹא יַבְדִּיל
  choice: उसके दोनों भाग अलग न करे
  rationale: हिफ़ील रूप का अर्थ अलग करना है। संदर्भ में पक्षी को खोला जाना है, पर पूरी तरह दो हिस्सों में नहीं बाँटा जाना।
- source_word: וְהִקְטִיר
  choice: जलाए
  rationale: बलिदानी संदर्भ में यह वेदी पर जलाकर धुआँ उठाने को दर्शाता है। ‘जलाए’ सामान्य पाठक के लिए स्पष्ट है और वेदी का संदर्भ अनुष्ठानिक अर्थ बनाए रखता है।
- source_word: עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: आग के ऊपर रखी लकड़ियों पर
  rationale: मूल पाठ में लकड़ियों और आग की परतदार व्यवस्था है। हिन्दी में संबंधों को स्पष्ट रखते हुए वही क्रम स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: लैव्यव्यवस्था के बलिदानी संदर्भ में यह पूरी तरह वेदी पर चढ़ाई जाने वाली बलि का मानक और प्रचलित हिन्दी पद है।
- source_word: אִשֵּׁה
  choice: अग्नि-भेंट
  rationale: यह शब्द आग के द्वारा चढ़ाई गई भेंट को सूचित करता है। व्युत्पत्ति और अर्थ पर मतभेद होने के कारण वैकल्पिक ‘भोजन-भेंट’ को पादटिप्पणी में रखा गया है।
- source_word: רֵיחַ נִיחֹחַ
  choice: सुखद सुगंध
  rationale: यह स्थिर बलिदानी पद भेंट की स्वीकार्यता को सुगंध के रूपक से व्यक्त करता है। ‘सुखद सुगंध’ आधुनिक, गरिमापूर्ण और सहज हिन्दी है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל संबंध या दिशा दर्शाता है; ‘के लिए’ इस बलिदानी सूत्र में स्वाभाविक है। परमेश्वर का व्यक्तिगत नाम लिप्यंतरित किया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: बलिदानी सूत्र רֵיחַ נִיחֹחַ
  choice: सुखद सुगंध
  alternative: शांतिदायक सुगंध
  rationale: यह चयन परमेश्वर द्वारा भेंट की स्वीकार्यता का रूपक बनाए रखता है, पर पाठ में बाद की कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: אִשֵּׁה का अर्थ
  choice: अग्नि-भेंट
  alternative: भोजन-भेंट
  rationale: शब्द को आग से चढ़ाई गई भेंट समझना तत्काल संदर्भ के अनुकूल है, जबकि ‘भोजन-भेंट’ की मान्य वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल लेकिन गरिमापूर्ण बलिदानी भाषा रखी गई है। ‘याजक’, ‘वेदी’ और ‘होमबलि’ जैसे परिचित बाइबलीय पद बनाए गए हैं। वाक्यरचना मूल क्रियाक्रम का अनुसरण करती है, पर हिन्दी में सहजता के लिए कर्ता और स्थान-संबंध स्पष्ट किए गए हैं।
