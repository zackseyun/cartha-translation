base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/005.yaml
  text: And he shall slaughter the young bull before Yahweh[a], and Aaron’s sons, the priests, shall present the blood and throw the blood against the altar all around[b], which is at the entrance of the tent of meeting.
translation:
  language: hi
  text: वह उस जवान बैल[a] का यहोवा के सामने वध करे। तब हारून के पुत्र, अर्थात् याजक, लहू को प्रस्तुत करें और उसे मिलापवाले तंबू के द्वार पर स्थित वेदी पर चारों ओर लहू फेंकें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘गोधन का पुत्र’; यह गोवंश के पशु के लिए एक इब्रानी मुहावरा है। यहाँ संदर्भ के अनुसार ‘जवान बैल’ कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘लहू को वेदी पर चारों ओर उछालें’; परंपरागत अनुवाद ‘छिड़कें’ है। इब्रानी क्रिया अनुष्ठान में लहू को फेंककर या उछालकर लगाने का बोध देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: वध करे
  rationale: बलि की निर्देशात्मक प्रक्रिया में प्रयुक्त क्रिया को विधिसूचक रूप में रखा गया है; ‘वध’ साधारण ‘मार डालने’ की अपेक्षा अनुष्ठानिक पशु-वध के लिए अधिक सटीक और गरिमापूर्ण है।
- source_word: בֶּן הַבָּקָר
  choice: जवान बैल
  rationale: शाब्दिक अर्थ ‘गोधन का पुत्र’ है, जो गोवंश के पशु के लिए मुहावरा है। पिछले पद में नर होने की शर्त के कारण यहाँ ‘जवान बैल’ संदर्भानुकूल है, जबकि शाब्दिक मुहावरे को पादटिप्पणी में बताया गया है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह स्थान और उपस्थिति दोनों का संकेत देने वाली वाचा-संबंधी अभिव्यक्ति है। ‘के सामने’ इसके अनुष्ठानिक स्थानबोध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וְהִקְרִיבוּ
  choice: पास लाएँ
  rationale: हिफ़ील रूप का मूल भाव ‘निकट लाना’ है। इसका कर्म लहू है, इसलिए ‘पास लाएँ’ क्रिया की दिशा को सुरक्षित रखता है और पूरे बलिदान को दोबारा चढ़ाने का अर्थ नहीं देता।
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: हारून के पुत्र, अर्थात् याजक
  rationale: यह पारिवारिक पहचान और समानाधिकरण में दी गई याजकीय भूमिका, दोनों को स्पष्ट रखता है।
- source_word: וְזָרְקוּ
  choice: फेंकें
  rationale: זרק का मूल अर्थ फेंकना या उछालना है। परंपरागत ‘छिड़कें’ की तुलना में ‘फेंकें’ अनुष्ठान में लहू को वेदी पर बलपूर्वक लगाने की क्रिया को अधिक प्रत्यक्ष रूप से व्यक्त करता है।
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: वेदी पर चारों ओर
  rationale: עַל को ‘पर’ और סָבִיב को ‘चारों ओर’ से व्यक्त किया गया है; इससे वेदी के चारों ओर उसके भागों पर लहू लगाने का आशय बना रहता है।
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के द्वार पर स्थित
  rationale: संबंधवाचक उपवाक्य वेदी का स्थान बताता है। हिन्दी में इसे संज्ञा से पहले विशेषणात्मक रूप देने पर वाक्य अधिक स्वाभाविक है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह हिन्दी बाइबलीय प्रयोग में पहचानी जाने वाली और मूल के सभा/भेंट के भाव को व्यक्त करने वाली पदावली है; ‘तंबू’ मूल की अस्थायी संरचना को भी बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम स्पष्ट रूप से आया है। उसे सामान्य उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप में रखा गया है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: लहू लगाने की अनुष्ठानिक क्रिया
  choice: वेदी पर चारों ओर फेंकें
  alternative: वेदी पर चारों ओर छिड़कें / वेदी के चारों ओर लहू डालें
  rationale: मूल क्रिया זרק को केवल हल्के छिड़काव के रूप में सीमित नहीं किया गया। ‘फेंकें’ उसके भौतिक बल और अनुष्ठानिक प्रयोग को बनाए रखता है, जबकि पादटिप्पणी पारंपरिक विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। ‘वध’, ‘याजक’, ‘वेदी’ और ‘मिलापवाला तंबू’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं, पर वाक्य-विन्यास सामान्य आधुनिक हिन्दी के अनुरूप है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित शब्दों के तुरंत बाद दिए गए हैं।
