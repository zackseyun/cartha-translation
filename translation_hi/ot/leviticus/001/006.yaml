review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the sequential conjunction, the removal of the animal's skin, and the cutting of the offering into its constituent sections. Supplying ‘पशु’ is contextually warranted, since an animal’s skin is being removed. The phrase ‘उसके टुकड़ों में काटे,’ however, is somewhat awkward in modern Hindi; ‘भागों में’ more naturally expresses the ritual division intended by לִנְתָחֶיהָ without adding interpretive detail.
  naturalness: ‘खाल उतारे’ is clear, direct modern Hindi suitable for this ritual instruction. Recasting ‘होमबलि-पशु’ as ‘होमबलि के पशु’ improves ordinary Hindi readability, and ‘उसे उसके भागों में काटे’ is more idiomatic than ‘उसे उसके टुकड़ों में काटे।’
  terminology: ‘होमबलि’ is an established Hindi rendering for עֹלָה in this context. ‘भागों’ appropriately conveys sacrificial sections/pieces and avoids the potentially colloquial or overly violent connotation of ‘टुकड़े-टुकड़े।’
  issues:
  - severity: low
    issue: The expression ‘उसे उसके टुकड़ों में काटे’ is syntactically heavy and less idiomatic.
    rationale: Although understandable and close to the Hebrew wording, ‘उसे उसके भागों में काटे’ conveys division into prescribed sections more naturally in modern standard Hindi.
  - severity: low
    issue: The hyphenated compound ‘होमबलि-पशु’ is less natural than a genitive phrase.
    rationale: ‘होमबलि के पशु’ retains the same contextual clarification while reading more smoothly in standard Hindi.
  revised_text: फिर वह होमबलि के पशु की खाल उतारे और उसे उसके भागों में काटे।
