translation:
  language: hi
  text: फिर वह होमबलि के पशु की खाल उतारे और उसे उसके भागों में काटे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִפְשִׁיט
  choice: फिर वह ... की खाल उतारे
  rationale: हिफ़ईल रूप यहाँ बलि-पशु की खाल हटाने की ठोस क्रिया बताता है। ‘खाल उतारे’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है। आरंभिक ‘फिर’ पिछले अनुष्ठानिक चरण से क्रमिक संबंध व्यक्त करता है।
- source_word: הָעֹלָה
  choice: होमबलि-पशु
  rationale: עֹלָה लैव्यव्यवस्था में पूर्णतः जलाए जाने वाले बलिदान का मानक शब्द है। इस वाक्य में उसी पशु की खाल और अंग काटे जाते हैं, इसलिए ‘होमबलि-पशु’ हिन्दी में संदर्भ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְנִתַּח
  choice: और ... काटे
  rationale: נתח बलि के पशु को निर्धारित भागों में काटने का बोध देता है। अगले पदबंध ‘उसके टुकड़ों में’ के साथ ‘काटे’ क्रिया का आशय पर्याप्त स्पष्ट है।
- source_word: לִנְתָחֶיהָ
  choice: उसके टुकड़ों में
  rationale: נתח काटे हुए भाग या खंड को दर्शाता है; यहाँ ל परिणामसूचक है—पशु को उसके अलग-अलग भागों में काटना। ‘उसके टुकड़ों में’ मूल की अभिव्यक्ति को निकटता से सुरक्षित रखता है।
