  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אָדָ֗ם כִּֽי יַקְרִ֥יב מִ/כֶּ֛ם קָרְבָּ֖ן לַֽ/יהוָ֑ה מִן הַ/בְּהֵמָ֗ה מִן הַ/בָּקָר֙ וּ/מִן הַ/צֹּ֔אן תַּקְרִ֖יבוּ אֶת קָרְבַּנְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man from among you brings an offering to Yahweh[b][a], you shall bring your offering from the livestock—from the herd or from the flock.'
translation:
  language: hi
  text: “इस्राएल के पुत्रों[a] से कहो और उनसे कहो, ‘जब तुम में से कोई मनुष्य[b] याहवे के लिए भेंट लाए, तब तुम अपनी भेंट पशुधन में से—गाय-बैलों या भेड़-बकरियों में से—लाओ।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली” अथवा “इस्राएल के लोग।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: या “कोई व्यक्ति।” इब्रानी शब्द אָדָם (आदाम) यहाँ प्रतिनिधि अर्थ में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी संबोधन का शाब्दिक रूप बनाए रखता है; अधिक सहज विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: אָדָם
  choice: कोई मनुष्य
  rationale: यहाँ एक प्रतिनिधि व्यक्ति के द्वारा भेंट लाने की स्थिति प्रस्तुत है। ‘मनुष्य’ इब्रानी एकवचन को बनाए रखता है, जबकि ‘कोई’ उसके सामान्य प्रतिनिधि अर्थ को हिंदी में स्वाभाविक बनाता है।
- source_word: יַקְרִיב / תַּקְרִיבוּ
  choice: लाए / लाना
  rationale: बलिदानी संदर्भ में हिफ़ील रूप का अर्थ किसी भेंट को निकट लाना या प्रस्तुत करना है। ‘लाना’ इस ठोस भाव को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: מִכֶּם
  choice: तुम में से
  rationale: समुदाय के भीतर से किसी एक व्यक्ति को सूचित करने वाला अंशात्मक अर्थ स्पष्ट करता है।
- source_word: קָרְבָּן
  choice: भेंट
  rationale: यह व्यापक बलिदानी शब्द है; ‘बलिदान’ यहाँ अनावश्यक रूप से अर्थ को संकीर्ण कर सकता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל संबंध को ‘के लिए’ से व्यक्त किया गया है और יהוה को उसके विशिष्ट वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: הַבְּהֵמָה
  choice: पालतू पशुओं
  rationale: यह बलि के योग्य घरेलू पशुधन की व्यापक श्रेणी है; ‘पालतू पशु’ आधुनिक हिंदी में स्पष्ट है।
- source_word: הַבָּקָר
  choice: गाय-बैलों
  rationale: यह गोवंश की सामूहिक श्रेणी को स्पष्ट और सहज हिंदी में व्यक्त करता है।
- source_word: הַצֹּאן
  choice: भेड़-बकरियों
  rationale: इब्रानी सामूहिक शब्द में मुख्यतः भेड़ और बकरियाँ सम्मिलित हैं; स्पष्ट हिंदी अभिव्यक्ति दोनों को सामने रखती है।
- source_word: תַּקְרִיבוּ אֶת קָרְבַּנְכֶם
  choice: तुम अपनी भेंट ... लाना
  rationale: दूसरे पुरुष बहुवचन को ‘तुम’ से सुरक्षित रखा गया है, जिससे एक व्यक्ति की आरंभिक स्थिति से पूरे समुदाय को दिए गए निर्देश की ओर मूल पाठ का बदलाव दिखाई देता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय विशिष्ट नाम सीधे उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और वाचा-नाम को सामान्य उपाधि में नहीं बदलता।
- issue: אָדָם और בְּנֵי יִשְׂרָאֵל में प्रतिनिधि पुरुषवाचक भाषा
  choice: ‘कोई मनुष्य’ और ‘इस्राएल के पुत्र’
  alternative: ‘कोई व्यक्ति’ और ‘इस्राएली’
  rationale: मुख्य पाठ इब्रानी की पुरुषवाचक आकृति को बनाए रखता है, पर ‘कोई’ यह संकेत देता है कि यहाँ एक सामान्य कानूनी स्थिति है। अधिक सहज सामुदायिक विकल्प पादटिप्पणियों में सुरक्षित हैं।
- issue: एकवचन से बहुवचन संबोधन का परिवर्तन
  choice: ‘कोई मनुष्य ... लाए’ के बाद ‘तुम अपनी भेंट ... लाना’
  alternative: पूरे वाक्य को एकवचन में करना
  rationale: मूल पाठ पहले किसी एक प्रतिनिधि व्यक्ति की स्थिति रखता है और फिर समुदाय को बहुवचन में निर्देश देता है; इस तनाव को समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘कह’ और ‘कहना’ मूल के एकवचन आदेश को दर्शाते हैं। पशु-श्रेणियों को हिंदी में तुरंत समझ आने वाले ‘गाय-बैल’ और ‘भेड़-बकरियाँ’ से व्यक्त किया गया है।
