source:
  edition: WLC
  text: וְ/סָמַ֣ךְ יָד֔/וֹ עַ֖ל רֹ֣אשׁ הָ/עֹלָ֑ה וְ/נִרְצָ֥ה ל֖/וֹ לְ/כַפֵּ֥ר עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/004.yaml
  text: And he shall lay his hand on the head of the burnt offering[a], and it shall be accepted for him to make atonement on his behalf.
translation:
  language: hi
  text: और वह अपना हाथ होमबलि के सिर पर रखे, और यह उसके लिए स्वीकार्य हो, ताकि उसके लिए प्रायश्चित हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְסָמַךְ
  choice: और वह…रखे
  rationale: बलिदान-संबंधी प्रसंग में סמך हाथ को पशु पर रखने या टिकाने की विधिक क्रिया बताता है; ‘रखे’ स्वाभाविक है और दबाव की मात्रा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יָדוֹ
  choice: अपना हाथ
  rationale: इब्रानी में एकवचन है; हिन्दी में कर्ता के अपने अंग के लिए ‘अपना’ स्वाभाविक संबंधसूचक रूप है।
- source_word: עַל רֹאשׁ
  choice: के सिर पर
  rationale: यह भौतिक क्रिया को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: עֹלָה उस बलिदान का प्रचलित विधिक नाम है जो पूर्णतः जलाया जाता था; ‘होमबलि’ आधुनिक हिन्दी बाइबलीय प्रयोग में संक्षिप्त और परिचित समतुल्य है।
- source_word: וְנִרְצָה
  choice: तब वह…स्वीकार की जाएगी
  rationale: רצה का निफ़अल यहाँ स्वीकार किए जाने का भाव देता है। स्त्रीलिंग ‘वह’ निकटवर्ती ‘होमबलि’ को संदर्भित करता है, जबकि कर्ता-संबंधी वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: ל लाभ या हित का संबंध व्यक्त करता है; ‘उसके लिए’ बलि चढ़ाने वाले के पक्ष में स्वीकृति को पर्याप्त रूप से खुला रखता है।
- source_word: לְכַפֵּר
  choice: ताकि…प्रायश्चित किया जाए
  rationale: כפר एक मुख्य बलिदान-संबंधी पद है। ‘प्रायश्चित’ उसका धार्मिक भार बनाए रखता है, और निष्क्रिय रचना हिन्दी में उद्देश्य को स्पष्ट करती है।
- source_word: עָלָיו
  choice: उसके लिए
  rationale: כפר के साथ על यहाँ उस व्यक्ति को सूचित करता है जिसके निमित्त प्रायश्चित होता है; ‘उसके लिए’ स्वाभाविक और सिद्धान्ततः अनिर्दिष्ट है।
theological_decisions:
- issue: וְנִרְצָה के निष्क्रिय क्रिया-रूप का संदर्भ
  choice: होमबलि स्वीकार की जाएगी
  alternative: बलि चढ़ाने वाला स्वीकार किया जाएगा
  rationale: प्रसंग और निकटवर्ती संज्ञा के आधार पर क्रिया को होमबलि से जोड़ना स्वाभाविक है। फिर भी इब्रानी पुल्लिंग एकवचन क्रिया-रूप और वाक्य की संरचना बलि चढ़ाने वाले से अधिक प्रत्यक्ष संबंध की सम्भावना को पूरी तरह समाप्त नहीं करते; इसलिए वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘होमबलि’ और ‘प्रायश्चित’ स्थापित धार्मिक पद हैं। मुख्य पाठ इब्रानी की विधिक क्रमबद्धता और निष्क्रिय भाव को बनाए रखता है; वास्तविक संदर्भगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
