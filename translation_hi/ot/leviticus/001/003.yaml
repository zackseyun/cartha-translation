source:
  edition: WLC
  text: אִם עֹלָ֤ה קָרְבָּנ/וֹ֙ מִן הַ/בָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑/נּוּ אֶל פֶּ֝תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔/וֹ לִ/רְצֹנ֖/וֹ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/003.yaml
  text: If his offering is a burnt offering from the herd[a], he shall offer a male without blemish. He shall offer it at the entrance of the tent of meeting, that he may be accepted before Yahweh.
translation:
  language: hi
  text: 'यदि उसका चढ़ावा गोवंश में से होमबलि हो, तो वह बिना दोष का एक नर पशु चढ़ाए। वह उसे मिलाप के तंबू के द्वार पर याहवे के सामने चढ़ाए, ताकि चढ़ाने वाला स्वीकार किया जाए।[a]


    [a] या, “अपनी स्वेच्छा से।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी स्वेच्छा से।”
    reason: לִרְצֹנוֹ का अर्थ चढ़ाने वाले की स्वीकृति अथवा उसकी स्वेच्छा माना जा सकता है; वैकल्पिक पारंपरिक व्याख्या सुरक्षित रखी गई है।
lexical_decisions:
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह लैव्यव्यवस्था में उस बलि का प्रचलित और स्पष्ट हिन्दी नाम है जिसे वेदी पर पूर्णतः जलाया जाता था।
- source_word: קָרְבָּנוֹ
  choice: उसका चढ़ावा
  rationale: קרבן निकट लाए गए अर्पण या भेंट का सामान्य बलिदानी शब्द है; ‘चढ़ावा’ इस संदर्भ में सहज और सामान्य हिन्दी है।
- source_word: מִן הַבָּקָר
  choice: गाय-बैलों में से
  rationale: הבקר गोवंशीय पालतू पशुओं को सूचित करता है; यह चयन आधुनिक हिन्दी में अर्थ को स्पष्ट करता है और केवल गाय या केवल बैल तक सीमित नहीं करता।
- source_word: זָכָר תָּמִים
  choice: बिना दोष का एक नर पशु
  rationale: इब्रानी पाठ पशु के नर होने और बलि के योग्य किसी शारीरिक दोष से रहित होने—दोनों बातों को स्पष्ट करता है।
- source_word: יַקְרִיבֶנּוּ / יַקְרִיב אֹתוֹ
  choice: वह ... चढ़ाए
  rationale: קרב के हिफ़ील रूप का बलिदानी संदर्भ में अर्थ अर्पित या प्रस्तुत करना है; ‘चढ़ाए’ हिन्दी धार्मिक संदर्भ में स्वाभाविक है।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के द्वार पर
  rationale: यह पवित्रस्थान के नियत तंबू और उसके प्रवेशस्थान को दर्शाने वाला पारंपरिक किंतु सुबोध हिन्दी पदबंध है।
- source_word: לִרְצֹנוֹ
  choice: ताकि वह स्वीकार किया जाए
  rationale: बलिदानी संदर्भ में यह चढ़ाने वाले की परमेश्वर के सामने स्वीकृति का संभावित अर्थ व्यक्त करता है, जबकि वैकल्पिक ‘अपनी इच्छा से’ पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने/उपस्थिति में’ है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम प्रत्यक्ष रूप से है; ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है।
- issue: לִרְצֹנוֹ का आशय
  choice: ताकि वह स्वीकार किया जाए
  alternative: वह उसे अपनी इच्छा से ... चढ़ाए
  rationale: इस पदबंध में चढ़ाने वाले की स्वीकृति और स्वेच्छा—दोनों की व्याख्यात्मक परंपरा है। मुख्य पाठ में बलिदानी स्वीकृति का संभावित अर्थ रखा गया है और वास्तविक अस्पष्टता को पादटिप्पणी द्वारा सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। बलिदानी पारिभाषिक शब्द ‘होमबलि’ तथा पवित्रस्थान के लिए परिचित ‘मिलापवाला तंबू’ बनाए रखे गए हैं।
