id: LEV.1.1
reference: Leviticus 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְרָ֖א אֶל מֹשֶׁ֑ה וַ/יְדַבֵּ֤ר יְהוָה֙ אֵלָ֔י/ו מֵ/אֹ֥הֶל מוֹעֵ֖ד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/001.yaml
  text: Then Yahweh called to Moses and spoke to him from the tent of meeting[a], saying,
translation:
  language: hi
  text: 'तब याहवे[a] ने मूसा को पुकारा और मिलाप के तंबू में से उससे यह कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का नाम יהוה है, जिसे यहाँ ‘याहवे’ लिखा गया है; परंपरागत हिन्दी अनुवादों में प्रायः ‘यहोवा’ या ‘प्रभु’ मिलता है।
    reason: divine_name
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: पुकारा
  rationale: यहाँ קרא परमेश्वर द्वारा मूसा को संबोधित करने का बोध देता है। ‘पुकारा’ स्वाभाविक है और ‘बुलवा भेजा’ जैसे अधिक प्रबल अर्थ को नहीं जोड़ता।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा को
  rationale: קרא के साथ אֶל को हिन्दी में स्वाभाविक रूप से ‘को’ कहा जाता है। משה के लिए प्रचलित हिन्दी रूप ‘मूसा’ रखा गया है।
- source_word: וַיְדַבֵּר ... אֵלָיו
  choice: उससे कहा
  rationale: शाब्दिक रूप ‘उससे बात की ... यह कहते हुए’ हिन्दी में बोझिल होता। ‘उससे कहा’ औपचारिक दिव्य वचन का अर्थ और अगले पद में आने वाली वाणी की भूमिका स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में उपाधि नहीं, परमेश्वर का निजी नाम יהוה है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है।
- source_word: מֵאֹהֶל מוֹעֵד
  choice: मिलाप के तंबू में से
  rationale: אֹהֶל מוֹעֵד उस पवित्र तंबू का निश्चित नाम है जहाँ परमेश्वर अपने लोगों से मिलता था। ‘मिलाप का तंबू’ हिन्दी में परिचित और अर्थपूर्ण पद है; מִן का स्रोतगत भाव ‘में से’ से व्यक्त हुआ है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: यह रूप आगे आने वाले प्रत्यक्ष वचन का परिचय देता है। हिन्दी में ‘कहा,’ उसी कथात्मक कार्य को सहजता से निभाता है।
- source_word: וַ
  choice: तब
  rationale: आरंभिक वाव-कन्सीक्यूटिव निर्गमन की समाप्ति से आगे कथा का क्रम बढ़ाता है; ‘तब’ इस संबंध को आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला निजी नाम יהוה है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि में बदल देता, जबकि ‘यहोवा’ एक बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मिलाप का तंबू’ परिचित बाइबलीय पदावली को बनाए रखता है। वाक्य के अंत में अल्पविराम अगले पद में आने वाले प्रत्यक्ष वचन की निरंतरता दिखाता है।
