base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/009.yaml
  text: But he shall wash its entrails and its legs with water[a], and the priest shall turn all of it into smoke on the altar, a burnt offering, a food offering[c][b], a pleasing aroma to Yahweh.
translation:
  language: hi
  text: पर वह उसके भीतरी अंगों और टाँगों को पानी से धोए, और याजक उस सबको वेदी पर जलाकर धुएँ के रूप में चढ़ाए—होमबलि, अग्नि-अर्पण[a], याहवे के लिए सुखद सुगंध[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अग्नि में चढ़ाया गया अर्पण”; कुछ विद्वान इसे “भोजन-अर्पण” समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: “सुखद सुगंध” बलिदानों में प्रयुक्त एक स्थिर अभिव्यक्ति है, जो बताती है कि अर्पण याहवे को स्वीकार्य है।
    reason: cultural_note
lexical_decisions:
- source_word: קִרְבּוֹ
  choice: उसके भीतरी अंगों
  rationale: बलिदान के संदर्भ में קֶרֶב पशु के भीतर के अंगों को सूचित करता है। ‘भीतरी अंग’ स्वाभाविक है और ‘अंतड़ियाँ’ की अपेक्षा मूल शब्द की व्यापकता बनाए रखता है।
- source_word: כְרָעָיו
  choice: टाँगों
  rationale: यह पशु के निचले पैरों या टाँगों के लिए प्रयुक्त है; ‘टाँगें’ सामान्य पाठक के लिए स्पष्ट और सहज है।
- source_word: יִרְחַץ בַּמָּיִם
  choice: पानी से धोए
  rationale: हिब्रू क्रिया धोने की क्रिया और בַּמָּיִם उसके साधन को व्यक्त करता है; आधुनिक हिन्दी में ‘पानी से धोए’ स्वाभाविक है।
- source_word: וְהִקְטִיר
  choice: जलाकर धुएँ के रूप में चढ़ाए
  rationale: हिफ़ील क्रिया का याजकीय अर्थ केवल जलाना नहीं, बल्कि वेदी पर जलाकर धुआँ ऊपर चढ़ाना है। यह अभिव्यक्ति उस विशिष्ट बलिदानी अर्थ को स्पष्ट रखती है।
- source_word: אֶת־הַכֹּל
  choice: उस सब को
  rationale: यह तैयार किए गए पशु की संपूर्णता पर बल देता है और होमबलि के पूर्णतः चढ़ाए जाने को बनाए रखता है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: ‘होमबलि’ हिन्दी बाइबलीय परंपरा में इस पूर्णतः जलाए जाने वाले बलिदान का स्थापित और संक्षिप्त नाम है।
- source_word: אִשֵּׁה
  choice: अग्नि में चढ़ाया गया अर्पण
  rationale: शब्द अग्नि के माध्यम से प्रस्तुत बलिदानी अर्पण को बताता है। यह अनुवाद पारंपरिक अग्नि-संबंधी अर्थ को स्पष्ट करता है, जबकि वैकल्पिक ‘भोजन-अर्पण’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: רֵיחַ נִיחוֹחַ
  choice: सुखद सुगंध
  rationale: यह स्थिर बलिदानी पदबंध अर्पण के याहवे को स्वीकार्य होने की छवि देता है। ‘सुखद सुगंध’ रूपक को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: לְ संबंध या दिशा को व्यक्त करता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसका आधुनिक हिन्दी में निकट लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: אִשֵּׁה का बलिदानी अर्थ
  choice: अग्नि में चढ़ाया गया अर्पण
  alternative: भोजन-अर्पण
  rationale: शब्द की व्युत्पत्ति और प्रयोग पर चर्चा है। मुख्य पाठ अग्नि-संबंधी पारंपरिक अर्थ रखता है, जबकि ‘भोजन-अर्पण’ की संभावित याजकीय समझ पादटिप्पणी में दी गई है।
- issue: רֵיחַ נִיחוֹחַ की ईश्वर-संबंधी भाषा
  choice: सुखद सुगंध
  alternative: शांतिदायक सुगंध; मनभावनी सुगंध
  rationale: मूल रूपक को बनाए रखा गया है, पर इससे ईश्वर की किसी भौतिक आवश्यकता का निष्कर्ष नहीं जोड़ा गया। पादटिप्पणी इसके बलिदानी स्वीकृति-सूचक प्रयोग को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए बोधगम्य रखी गई है। ‘होमबलि’ जैसे स्थापित धार्मिक शब्द को बनाए रखते हुए क्रियात्मक वाक्यांश ‘जलाकर धुएँ के रूप में चढ़ाए’ से उसका अर्थ संदर्भ में स्पष्ट किया गया है।
