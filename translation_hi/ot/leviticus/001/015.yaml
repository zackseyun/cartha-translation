- source_word: הַכֹּהֵן
  choice: याजक
  rationale: बलिदान-संबंधी व्यवस्था में כֹּהֵן का मानक और गरिमापूर्ण हिंदी रूप।
- source_word: אֶל הַמִּזְבֵּחַ
  choice: वेदी के पास
  rationale: אֶל वेदी की ओर गति दर्शाता है; हिंदी में 'वेदी के पास लाए' अनुष्ठानिक क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּמָלַק אֶת־רֹאשׁוֹ
  choice: उसकी गरदन मरोड़कर उसका सिर अलग कर दे
  rationale: מלק पक्षी-बलि को मारने की विशिष्ट याजकीय क्रिया का तकनीकी शब्द है। हिंदी में यह वाक्यांश क्रिया को समझने योग्य बनाता है, जबकि उसकी सटीक विधि के विषय में स्रोत की सीमित जानकारी फुटनोट में सुरक्षित है।
- source_word: וְהִקְטִיר
  choice: जलाए
  rationale: बलिदानी संदर्भ में קטר का अर्थ वेदी पर जलाकर धुआँ उठाना है; 'जलाए' सरल और स्वाभाविक मुख्य-पाठ रूप है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: यहाँ दिशासूचक रूप बलिदान को वेदी पर जलाने की क्रिया के साथ स्वाभाविक रूप से 'वेदी पर' व्यक्त होता है।
- source_word: וְנִמְצָה
  choice: निचोड़ा जाए
  rationale: מצה का निफ़ाल रूप दबाकर या निचोड़कर रक्त निकालने का निष्क्रिय भाव रखता है; 'निचोड़ा जाए' उस क्रिया और व्याकरणिक वाच्य दोनों को बनाए रखता है।
- source_word: דָמוֹ
  choice: उसका लहू
  rationale: यह पक्षी का रक्त है; धार्मिक-बलिदानी प्रसंग में 'लहू' सहज और गरिमापूर्ण है।
- source_word: עַל קִיר הַמִּזְבֵּחַ
  choice: वेदी की दीवार पर
  rationale: קִיר का सीधा अर्थ 'दीवार' है। इसे मुख्य पाठ में रखने से मूल की ठोस स्थान-सूचना बिना व्याख्यात्मक सरलीकरण के सुरक्षित रहती है।
