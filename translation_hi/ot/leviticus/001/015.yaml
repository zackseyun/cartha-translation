  yaml_path: translation/ot/leviticus/001/015.yaml
  text: And the priest shall bring it to the altar[a], and pinch off its head and burn it on the altar[b], and its blood shall be drained out on the side of the altar.
translation:
  language: hi
  text: तब याजक उस पक्षी को वेदी के पास ले आए, उसका सिर अलग करे[a] और उसे वेदी पर जलाए। फिर उसका लहू वेदी की दीवार पर[b] निचोड़ा जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया पक्षी-बलि को मारने की एक विशेष याजकीय क्रिया के लिए प्रयुक्त तकनीकी शब्द है। इसका अनुवाद “उसका सिर मरोड़कर अलग करे” या “उसका सिर चुटकी से अलग करे” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वेदी की दीवार पर”; इसे “वेदी के किनारे पर” भी अनुवादित किया जा सकता है।
    reason: lexical_alternative
