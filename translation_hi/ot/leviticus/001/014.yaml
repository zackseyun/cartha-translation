language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִ֧ם מִן הָ/ע֛וֹף עֹלָ֥ה קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה וְ/הִקְרִ֣יב מִן הַ/תֹּרִ֗ים א֛וֹ מִן בְּנֵ֥י הַ/יּוֹנָ֖ה אֶת קָרְבָּנֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/014.yaml
  text: And if his offering to Yahweh is a burnt offering from the birds, then he shall present his offering from the turtledoves or from the young pigeons.
translation:
  language: hi
  text: और यदि यहोवा के लिए उसका चढ़ावा पक्षियों में से होमबलि हो, तो वह अपना चढ़ावा पंडुकों या कबूतरों के बच्चों में से प्रस्तुत करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: संयोजक और शर्तसूचक पद पिछले निर्देशों से प्रवाह बनाए रखते हुए अगला प्रसंग आरम्भ करते हैं।
- source_word: מִן הָעוֹף
  choice: पक्षियों में से
  rationale: עוֹף यहाँ बलि के लिए प्रयुक्त पक्षियों को सूचित करता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह उस विशिष्ट बलि का प्रचलित हिन्दी बाइबलीय नाम है जो वेदी पर पूरी तरह जलाई जाती थी।
- source_word: קָרְבָּנוֹ
  choice: अपना चढ़ावा
  rationale: קָרְבָּן निकट लाकर अर्पित की जाने वाली भेंट का सामान्य शब्द है; 'चढ़ावा' प्रसंगानुकूल और सहज है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: लामेद यहाँ बलि के प्राप्तकर्ता अथवा समर्पण को दर्शाता है; वाचा के नाम को हिन्दी के परिचित रूप 'यहोवा' में लिप्यंतरित किया गया है।
- source_word: וְהִקְרִיב
  choice: तो वह ... प्रस्तुत करे
  rationale: हिफ़ील रूप का अर्थ निकट लाना अथवा विधिपूर्वक अर्पित करना है; 'प्रस्तुत करे' अनुष्ठानिक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: מִן הַתֹּרִים
  choice: पंडुकों ... में से
  rationale: תֹּרִים विशेषतः turtledoves को दर्शाता है; 'पंडुक' उसका सटीक हिन्दी पक्षी-नाम है।
- source_word: אוֹ
  choice: या
  rationale: दो अनुमत प्रकार के पक्षियों के बीच साधारण विकल्प को व्यक्त करता है।
- source_word: מִן בְּנֵי הַיּוֹנָה
  choice: कबूतर के बच्चों में से
  rationale: शाब्दिक मुहावरा 'कबूतर के पुत्र' छोटे या युवा कबूतरों को दर्शाता है; यह हिन्दी रूप अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम है, इसलिए उसे उपाधि 'प्रभु' से नहीं बदला गया। आधुनिक हिन्दी पाठकों के बीच परिचित लिप्यंतरण 'यहोवा' चुना गया, यद्यपि 'याहवे' सम्भावित उच्चारण के अधिक निकट माना जाता है।
- issue: עֹלָה की बलि-श्रेणी
  choice: होमबलि
  alternative: सर्वांग होमबलि / आरोहण-भेंट
  rationale: यहाँ शब्द एक स्थापित अनुष्ठानिक श्रेणी को दर्शाता है। 'होमबलि' उस श्रेणी को पहचानने योग्य ढंग से व्यक्त करता है, बिना मूल धातु के 'ऊपर चढ़ने' के भाव को मुख्य अर्थ बना देने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। निहित कर्ता को स्वाभाविक हिन्दी के लिए 'कोई व्यक्ति' के रूप में स्पष्ट किया गया है। 'पंडुक' अपेक्षाकृत कम प्रचलित पर सटीक पक्षी-नाम है; समान दिखने वाली दोनों बलि-श्रेणियों का भेद बनाए रखने के लिए इसे रखा गया है।
