source:
  edition: WLC
  text: וְ/הַ/קֶּ֥רֶב וְ/הַ/כְּרָעַ֖יִם יִרְחַ֣ץ בַּ/מָּ֑יִם וְ/הִקְרִ֨יב הַ/כֹּהֵ֤ן אֶת הַ/כֹּל֙ וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֔חָ/ה עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/001/013.yaml
  text: But he shall wash the entrails and the legs with water[a], and the priest shall present all of it and turn it into smoke on the altar. It is a burnt offering, a food offering, a pleasing aroma to Yahweh.
translation:
  language: hi
  text: और वह अंतड़ियों और पैरों को पानी से धोए। तब याजक उस सबको अर्पित करे और वेदी पर धुएँ के रूप में चढ़ाए। यह होमबलि है—यहोवा के लिए सुखद सुगंध वाली अग्नि-भेंट।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: अंतड़ियों
  rationale: बलिदान के संदर्भ में यह पशु के भीतरी अंगों को दर्शाता है; ‘अंतड़ियाँ’ सामान्य पाठक के लिए ठोस और सहज शब्द है।
- source_word: הַכְּרָעַיִם
  choice: पैरों
  rationale: यह बलि-पशु के पैरों, विशेषतः निचले भागों, को दर्शाता है; ‘पैर’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: יִרְחַץ בַּמָּיִם
  choice: पानी से धोए
  rationale: क्रिया और उसके साधन—पानी—दोनों को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: וְהִקְרִיב
  choice: अर्पित करे
  rationale: हिफ़ील रूप का अर्थ बलि को समीप लाकर प्रस्तुत करना है; ‘अर्पित करे’ याजकीय प्रक्रिया के अनुकूल है और अगली जलानेवाली क्रिया से अलग रहता है।
- source_word: אֶת־הַכֹּל
  choice: उस सबको
  rationale: तैयार किए गए पूरे बलि-पशु की समग्रता को व्यक्त करता है।
- source_word: וְהִקְטִיר
  choice: धुएँ में उड़ा दे
  rationale: यह सामान्यतः जलाने से अधिक विशिष्ट बलिदानी क्रिया है, जिसमें सामग्री वेदी पर धुएँ के रूप में ऊपर उठती है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: बलिदान की क्रिया का स्थान सरल और मानक हिन्दी में व्यक्त किया गया है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: पूरी तरह वेदी पर चढ़ाई जानेवाली इस विशिष्ट बलि के लिए हिन्दी बाइबलीय परंपरा में प्रचलित और संक्षिप्त शब्द है।
- source_word: אִשֵּׁה
  choice: अग्नि-भेंट
  rationale: शब्द की अग्नि से चढ़ाई जानेवाली भेंट की धारणा को सीधे बनाए रखता है; वैकल्पिक विस्तृत अभिव्यक्ति पादटिप्पणी में दी गई है।
- source_word: רֵיחַ נִיחֹחַ
  choice: जिसकी सुगंध मनभावनी है
  rationale: मूल की सुगंध-संबंधी उपमा और स्वीकार्यता का भाव सुरक्षित रखते हुए सहज हिन्दी देता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम יהוה को पारदर्शी ढंग से ‘यहोवा’ लिखा गया है।
theological_decisions:
- issue: רֵיחַ נִיחֹחַ में परमेश्वर के विषय में इंद्रिय-बिंब
  choice: जिसकी सुगंध मनभावनी है
  alternative: सुखदायक सुगंध
  rationale: अनुवाद बलि की स्वीकृति से जुड़ी मूल सुगंध-उपमा को बनाए रखता है, पर उसे परमेश्वर की शारीरिक आवश्यकता के कथन में नहीं बदलता।
- issue: אִשֵּׁה का अर्थ
  choice: अग्नि-भेंट
  alternative: भोजन-भेंट
  rationale: ‘अग्नि-भेंट’ बलिदान को आग पर चढ़ाए जाने की स्पष्ट पाठगत धारणा सुरक्षित रखता है और विवादित अथवा व्याख्यात्मक ‘भोजन-भेंट’ को मुख्य पाठ में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। याजकीय शब्दावली में ‘याजक’, ‘वेदी’ और ‘होमबलि’ जैसे स्थापित शब्द रखे गए हैं; वाक्यरचना को अत्यधिक संस्कृतनिष्ठ होने से बचाया गया है।
