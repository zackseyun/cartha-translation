  text: And the sons of Aaron the priest shall put fire on the altar and arrange wood on the fire[a].
translation:
  language: hi
  text: और याजक हारून के पुत्र वेदी पर आग रखेंगे और उस आग पर लकड़ियाँ व्यवस्थित रखेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: और ... रखेंगे
  rationale: נתן का मूल अर्थ ‘रखना/स्थापित करना’ है; विधिक संदर्भ में भविष्यत् रूप हिन्दी में निर्देशात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֵן
  choice: हारून याजक के पुत्र
  rationale: एकवचन הַכֹּהֵן को हारून के साथ जोड़ते हुए मूल संरचना और याजकीय पहचान सुरक्षित रखी गई है।
- source_word: אֵשׁ
  choice: आग
  rationale: बलिदान की प्रक्रिया में इसका सीधा, भौतिक अर्थ आग है।
- source_word: עַל הַמִּזְבֵּחַ
  choice: वेदी पर
  rationale: बलिदान-संबंधी संदर्भ में यह स्वाभाविक और मानक हिन्दी अभिव्यक्ति है।
- source_word: וְעָרְכוּ
  choice: और ... क्रम से सजाएँगे
  rationale: ערך यहाँ वस्तुओं को व्यवस्थित क्रम में लगाने का भाव देता है; ‘क्रम से सजाना’ उस व्यवस्थित क्रिया को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֵצִים
  choice: लकड़ियाँ
  rationale: हिब्रू बहुवचन को हिन्दी के गणनीय बहुवचन से व्यक्त किया गया है, जो आग पर रखे जाने वाले लकड़ी के टुकड़ों का स्वाभाविक संकेत देता है।
- source_word: עַל הָאֵשׁ
  choice: आग पर
  rationale: मूल पाठ में ‘पर’ वाले दूसरे वाक्यांश और ‘आग’ की पुनरावृत्ति को बनाए रखा गया है।
