  text: זֹ֖את הַ/תּוֹרָ֑ה לְ/כָל נֶ֥גַע הַ/צָּרַ֖עַת וְ/לַ/נָּֽתֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/054.yaml
  text: This is the law for every case of leprous disease and for an itch[a].
translation:
  language: hi
  text: साराअत[a] के हर मामले और नतेक[b] के लिए यही व्यवस्था है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द “साराअत” किसी एक आधुनिक रोग का ठीक-ठीक नाम नहीं है। लैव्यव्यवस्था में यह त्वचा के ऐसे चिह्नों और अन्य संबंधित स्थितियों के लिए प्रयुक्त होता है जिनकी जाँच याजक करता था। परंपरागत अनुवादों में इसे प्रायः “कोढ़” कहा गया है, पर इसका आधुनिक कुष्ठ रोग से सीधा समानीकरण निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द “नतेक” एक विशेष त्वचा-स्थिति को सूचित करता है, जिसका ठीक आधुनिक चिकित्सकीय समकक्ष अनिश्चित है। लैव्यव्यवस्था 13 में इसका संबंध विशेषकर सिर या दाढ़ी के बालों वाले भाग से दिखाई देता है। इसे “खुजली,” “पपड़ीदार चकत्ता,” या परंपरागत रूप से “खाज” भी कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: यही व्यवस्था है
  rationale: यह समापन-सूत्र पहले दी गई जाँच और शुद्धि-विधियों की ओर संकेत करता है। आधुनिक हिन्दी में ‘यही व्यवस्था है’ स्वाभाविक और विधिक दोनों है।
- source_word: לְכָל נֶגַע הַצָּרַעַת
  choice: साराअत के हर चिह्न
  rationale: נֶגַע यहाँ जाँच के अधीन दिखाई देने वाले चिह्न या प्रभावित स्थान को सूचित करता है। צָרַעַת का आधुनिक कुष्ठ रोग से सीधा समानीकरण भ्रामक होगा, इसलिए मूल पद का लिप्यंतरण रखा गया है और पादटिप्पणी में उसका दायरा बताया गया है।
- source_word: וְלַנָּתֶק
  choice: और सिर या दाढ़ी के पपड़ीदार रोग
  rationale: נֶתֶק लैव्यव्यवस्था 13 में विशेषतः सिर या दाढ़ी के बालों वाले भाग की दशा है। ‘खुजली’ बहुत व्यापक है; वर्णनात्मक अनुवाद अर्थ को अधिक स्पष्ट रखता है, जबकि चिकित्सकीय पहचान की अनिश्चितता पादटिप्पणी में सुरक्षित है।
