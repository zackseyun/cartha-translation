source:
  edition: WLC
  text: וְ/הִזָּ֗ה עַ֧ל הַ/מִּטַּהֵ֛ר מִן הַ/צָּרַ֖עַת שֶׁ֣בַע פְּעָמִ֑ים וְ/טִ֣הֲר֔/וֹ וְ/שִׁלַּ֛ח אֶת הַ/צִּפֹּ֥ר הַֽ/חַיָּ֖ה עַל פְּנֵ֥י הַ/שָּׂדֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/007.yaml
  text: He shall sprinkle it on the one being cleansed from the skin disease seven times[a], and he shall pronounce him clean[b], and he shall let the living bird go free over the open field.
translation:
  language: hi
  text: फिर वह चर्मरोग से शुद्ध किए जा रहे व्यक्ति पर सात बार छिड़के[a], और उसे शुद्ध ठहराए[b]; फिर जीवित पक्षी को खुले मैदान में छोड़ दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत अनुवाद ‘कुष्ठरोग’ है। यहाँ का इब्रानी शब्द लैव्यव्यवस्था में त्वचा से जुड़ी कई दशाओं के लिए प्रयुक्त होता है; यह आवश्यक नहीं कि आधुनिक कुष्ठरोग ही हो।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसे शुद्ध घोषित करे।’ याजक का यह कार्य केवल चिकित्सकीय नहीं, बल्कि अनुष्ठानिक और न्यायिक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: फिर वह ... छिड़के
  rationale: हिफ़ील रूप का अनुष्ठानिक अर्थ ‘छिड़कना’ है। छिड़की जाने वाली वस्तु पिछले पद के संदर्भ से स्पष्ट है, इसलिए हिंदी में अलग कर्म जोड़ना आवश्यक नहीं।
- source_word: הַמִּטַּהֵר
  choice: शुद्ध किए जा रहे व्यक्ति
  rationale: हित्पएल कृदंत उस व्यक्ति को दर्शाता है जो शुद्धिकरण की प्रक्रिया से गुजर रहा है; यह केवल पहले से ‘शुद्ध’ होने की स्थिति नहीं बताता।
- source_word: מִן הַצָּרַעַת
  choice: चर्मरोग से
  rationale: צָרַעַת आधुनिक कुष्ठरोग तक सीमित चिकित्सकीय पद नहीं, बल्कि लैव्यव्यवस्था में त्वचा-संबंधी व्यापक श्रेणी है। ‘चर्मरोग’ इस व्यापकता को अपेक्षाकृत स्वाभाविक हिंदी में रखता है।
- source_word: שֶׁבַע פְּעָמִים
  choice: सात बार
  rationale: संख्या और क्रिया-विशेषणीय भाव का सीधा, स्वाभाविक हिंदी रूप।
- source_word: וְטִהֲרוֹ
  choice: और उसे शुद्ध ठहराए
  rationale: यहाँ याजक की अनुष्ठानिक और न्यायिक घोषणा अभिप्रेत है। ‘शुद्ध ठहराए’ केवल शारीरिक उपचार का अर्थ देने से बचता है।
- source_word: וְשִׁלַּח
  choice: फिर ... छोड़ दे
  rationale: पिएल क्रिया यहाँ जीवित पक्षी को मुक्त कर देने की क्रिया बताती है; ‘छोड़ दे’ सहज और स्पष्ट हिंदी है।
- source_word: הַצִּפֹּר הַחַיָּה
  choice: जीवित पक्षी
  rationale: यह विशेषण इस पक्षी को पिछले पद में मारे गए पक्षी से अलग करता है।
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: खुले मैदान में
  rationale: मुहावरा मैदान या खुले भूभाग के विस्तार की ओर संकेत करता है। ‘खुले मैदान में’ शब्दशः ‘मैदान के मुख पर’ की अपेक्षा स्वाभाविक हिंदी है और स्थानिक भाव बनाए रखता है।
theological_decisions:
- issue: צָרַעַת का अनुवाद
  choice: चर्मरोग
  alternative: कुष्ठरोग
  rationale: लैव्यव्यवस्था में यह शब्द आधुनिक हैन्सन रोग से अधिक व्यापक अनुष्ठानिक-अशुद्धता की श्रेणी को दर्शाता है; ‘कुष्ठरोग’ अनावश्यक आधुनिक चिकित्सकीय विशिष्टता ला सकता है।
- issue: וְטִהֲרוֹ में याजक की भूमिका
  choice: शुद्ध ठहराए
  alternative: शुद्ध करे
  rationale: वाक्यांश याजक की औपचारिक अनुष्ठानिक घोषणा को व्यक्त कर सकता है। यह चयन उसे चिकित्सा द्वारा रोगमुक्त करने का दावा नहीं बनाता, जबकि कारणात्मक अर्थ की अंतर्निहित संभावना को टिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और अनुष्ठानिक संदर्भ के अनुरूप भाषा रखी गई है। ‘चर्मरोग’ सामान्य पाठक के लिए बोधगम्य है; ‘शुद्ध ठहराए’ याजकीय घोषणा का भाव स्पष्ट करता है।
