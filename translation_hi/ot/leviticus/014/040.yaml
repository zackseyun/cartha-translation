  yaml_path: translation/ot/leviticus/014/040.yaml
  text: then the priest shall command that they remove the stones in which the infection is[a], and throw them outside the city to an unclean place.
translation:
  language: hi
  text: तब याजक आज्ञा दे कि जिन पत्थरों में वह दाग है[a], उन्हें निकालकर नगर के बाहर किसी अशुद्ध स्थान में फेंक दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे पत्थर जिनमें वह दाग लगा है।” इब्रानी में शाब्दिक रूप से, “वे पत्थर जिनमें दाग है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: तब याजक आज्ञा दे
  rationale: वाव के साथ पूर्ण क्रिया यहाँ विधिक प्रक्रिया के अगले चरण को बताती है। ‘तब’ क्रम को स्वाभाविक रूप से व्यक्त करता है और ‘आज्ञा दे’ निर्देशात्मक बल बनाए रखता है।
- source_word: וְחִלְּצוּ אֶת הָאֲבָנִים
  choice: पत्थरों को ... निकालकर
  rationale: חלץ यहाँ भवन से पत्थर बाहर निकालने के अर्थ में है। ‘निकालना’ आधुनिक हिन्दी में स्वाभाविक है और प्रक्रिया की अनावश्यक यांत्रिक व्याख्या नहीं करता।
- source_word: אֲשֶׁר בָּהֵן הַנָּגַע
  choice: जिन पत्थरों में वह दाग है
  rationale: נגע लैव्यव्यवस्था 13–14 में त्वचा, वस्त्र या घर पर दिखाई देने वाली दोषग्रस्त अवस्था का तकनीकी शब्द है। घर के पत्थरों के संदर्भ में ‘दाग’ सहज है और किसी निश्चित आधुनिक रोग, फफूँदी या संक्रमण का दावा नहीं करता। ‘में’ इब्रानी בָּהֵן को निकटता से दर्शाता है।
- source_word: וְהִשְׁלִיכוּ אֶתְהֶן
  choice: उन्हें ... फेंक दिया जाए
  rationale: השליך का सीधा और वर्तमान हिन्दी में स्वाभाविक अर्थ ‘फेंकना’ है। कर्मवाच्य रचना याजक की आज्ञा के आशय को स्पष्ट करती है।
- source_word: אֶל מִחוּץ לָעִיר
  choice: नगर के बाहर
  rationale: यह पदबंध बाहर की ओर ले जाने की गति और नगर-सीमा से परे स्थान, दोनों को व्यक्त करता है।
- source_word: אֶל מָקוֹם טָמֵא
  choice: किसी अशुद्ध स्थान में
  rationale: טָמֵא लैव्यव्यवस्था की शुद्धता-अशुद्धता संबंधी प्रमुख संज्ञा है। ‘अशुद्ध’ हिन्दी बाइबलीय और सामान्य धार्मिक प्रयोग में स्पष्ट है; अनिश्चित מָקוֹם के लिए ‘किसी ... स्थान’ स्वाभाविक है।
theological_decisions:
- issue: लैव्यव्यवस्था की शुद्धता-संबंधी शब्दावली
  choice: טָמֵא के लिए ‘अशुद्ध’ और נֶגַע के लिए ‘दाग’
  alternative: ‘अपवित्र’ तथा ‘संक्रमण’, ‘महामारी’, ‘फफूँदी’ या ‘रोगग्रस्त भाग’
  rationale: पद अनुष्ठानिक अशुद्धता की व्यवस्था से संबंधित है, पर घर की समस्या का कोई निश्चित आधुनिक चिकित्सकीय या वैज्ञानिक निदान नहीं देता। ‘अशुद्ध’ विधिक-धार्मिक श्रेणी को सुरक्षित रखता है और ‘दाग’ दृश्य दोष को बताकर अनावश्यक निदान से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। विधिक क्रम के लिए ‘तब’, भवन-संदर्भ में ‘निकालकर’, और अनुष्ठानिक श्रेणी के लिए ‘अशुद्ध’ चुना गया है।
