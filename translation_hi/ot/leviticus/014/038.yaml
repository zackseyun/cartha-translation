base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/038.yaml
  text: Then the priest shall go out of the house to the doorway of the house and shut up the house for seven days[a].
translation:
  language: hi
  text: तब याजक घर से निकलकर घर के द्वार पर जाए और उस घर को सात दिन के लिए बंद कर दे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस घर में सात दिन तक प्रवेश बंद कर दे।” इब्रानी क्रिया जाँच की अवधि के लिए पहुँच रोकने या किसी स्थान को बंद रखने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: तब ... निकलकर ... जाए
  rationale: विधिक प्रक्रिया में क्रमिक अगला कदम व्यक्त करने के लिए वाव के साथ क्रिया का स्वाभाविक हिन्दी रूप; निर्देशात्मक भाव भी बना रहता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के धार्मिक-विधिक संदर्भ में כֹּהֵן का मानक और स्पष्ट हिन्दी रूप।
- source_word: מִן הַבַּיִת
  choice: घर से
  rationale: יָצָא के साथ स्रोत से बाहर निकलने का स्वाभाविक हिन्दी प्रयोग।
- source_word: אֶל פֶּתַח הַבָּיִת
  choice: घर के द्वार पर
  rationale: פֶּתַח प्रवेश-स्थान या द्वार को दर्शाता है; प्रसंग में याजक का घर से बाहर निकलकर प्रवेश-स्थान पर पहुँचना अभिप्रेत है।
- source_word: וְהִסְגִּיר
  choice: बंद कर दे
  rationale: סגר का हिफ़ील रूप यहाँ निर्धारित अवधि के लिए प्रवेश रोकने या घर को बंद रखने का निर्देश देता है; यह रूप बिना अतिरिक्त व्याख्या के सरल और प्रक्रियात्मक है।
- source_word: אֶת הַבַּיִת
  choice: उस घर को
  rationale: प्रत्यक्ष कर्म को स्पष्ट किया गया है; 'उस' पहले उल्लिखित घर की ओर स्वाभाविक संकेत करता है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन के लिए
  rationale: अवधि को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
