source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/שְּׁבִיעִ֜י יְגַלַּ֣ח אֶת כָּל שְׂעָר֗/וֹ אֶת רֹאשׁ֤/וֹ וְ/אֶת זְקָנ/וֹ֙ וְ/אֵת֙ גַּבֹּ֣ת עֵינָ֔י/ו וְ/אֶת כָּל שְׂעָר֖/וֹ יְגַלֵּ֑חַ וְ/כִבֶּ֣ס אֶת בְּגָדָ֗י/ו וְ/רָחַ֧ץ אֶת בְּשָׂר֛/וֹ בַּ/מַּ֖יִם וְ/טָהֵֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/009.yaml
  text: 'And on the seventh day he shall shave off all his hair: his head[a], his beard, and his eyebrows. He shall shave off all his hair, wash his clothes, and bathe his body in water; then he shall be clean.'
translation:
  language: hi
  text: और सातवें दिन वह अपने सारे बाल मूँड़ दे—अपने सिर के बाल, अपनी दाढ़ी और अपनी भौंहें; वह अपने सारे बाल मूँड़ दे। फिर वह अपने कपड़े धोए और पानी से अपना शरीर धोए; तब वह शुद्ध होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַשְּׁבִיעִי
  choice: और सातवें दिन
  rationale: यह इब्रानी मुहावरा शुद्धिकरण-विधि के अगले क्रमिक चरण को प्रस्तुत करता है; स्वाभाविक हिन्दी में कालगत और क्रमिक अर्थ सुरक्षित रखा गया है।
- source_word: יְגַלַּח אֶת כָּל שְׂעָרוֹ
  choice: वह अपने सारे बाल मूँड़ दे
  rationale: पिएल क्रिया यहाँ शरीर के बाल पूरी तरह हटाने का निर्देश देती है। ‘मूँड़ दे’ इस कर्म को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רֹאשׁוֹ
  choice: अपने सिर के बाल
  rationale: मूल में शाब्दिक रूप से ‘अपना सिर’ है, पर मूँड़ने के संदर्भ में आशय सिर के बालों से है; हिन्दी में इसे स्पष्ट करना स्वाभाविक है।
- source_word: זְקָנוֹ
  choice: अपनी दाढ़ी
  rationale: זָקָן का यहाँ सामान्य और सीधा अर्थ ‘दाढ़ी’ है।
- source_word: גַּבֹּת עֵינָיו
  choice: अपनी भौंहें
  rationale: शाब्दिक अभिव्यक्ति ‘उसकी आँखों की भौंहें’ का स्वाभाविक हिन्दी समतुल्य ‘भौंहें’ है।
- source_word: וְאֶת כָּל שְׂעָרוֹ יְגַלֵּחַ
  choice: वह अपने सारे बाल मूँड़ दे
  rationale: विशिष्ट अंगों की सूची के बाद मूल में पूर्णता पर बल देने वाली पुनरुक्ति है; उसे हटाया नहीं गया।
- source_word: וְכִבֶּס אֶת בְּגָדָיו
  choice: वह अपने कपड़े धोए
  rationale: כִּבֵּס वस्त्र धोने के लिए प्रयुक्त होता है; ‘कपड़े धोए’ आधुनिक और सहज हिन्दी है।
- source_word: וְרָחַץ אֶת בְּשָׂרוֹ בַּמַּיִם
  choice: अपने शरीर को पानी से नहाए
  rationale: בָּשָׂר का शाब्दिक अर्थ ‘मांस’ है, पर इस विधिक संदर्भ में यह व्यक्ति के शरीर को सूचित करता है। ‘शरीर को पानी से नहाए’ मूल क्रिया और साधन दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: וְטָהֵר
  choice: तब वह शुद्ध होगा
  rationale: यह क्रिया विधि के बाद प्राप्त अनुष्ठानिक स्थिति बताती है। ‘तब’ परिणाम-क्रम स्पष्ट करता है और ‘शुद्ध होगा’ नैतिक निर्दोषता के बजाय प्रसंगगत शुद्धता को व्यक्त करता है।
theological_decisions:
- issue: अनुष्ठानिक शुद्धता की शब्दावली
  choice: शुद्ध होगा
  alternative: पवित्र होगा; शुद्ध किया जाएगा
  rationale: טהר यहाँ नैतिक निष्पापता या पवित्रीकरण की प्रक्रिया नहीं, बल्कि अनुष्ठानिक रूप से शुद्ध स्थिति को दर्शाता है। ‘शुद्ध होगा’ इस भेद को सबसे स्वाभाविक ढंग से बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। विधिक निर्देश का स्वर बनाए रखने के लिए ‘मूँड़ दे’ और ‘धोए’ जैसे क्रियारूप चुने गए हैं। मूल की जोरदार पुनरुक्ति सुरक्षित है।
