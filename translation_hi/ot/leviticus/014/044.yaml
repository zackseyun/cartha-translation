base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/044.yaml
  text: then the priest shall come and inspect[a], and if indeed the infection has spread in the house, it is a destructive mildew in the house[b]; it is unclean.
translation:
  language: hi
  text: तब याजक आकर जाँच करे; और यदि दाग घर में फैल गया हो, तो घर में विनाशकारी कोढ़ है[a]; वह घर अशुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “कोढ़” आधुनिक हैन्सन रोग का नाम नहीं है। इब्रानी शब्द एक व्यापक प्रकार की अनुष्ठानिक अशुद्धता के लिए है, जो यहाँ घर पर लागू होता है; इसे “विनाशकारी दाग” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַכֹּהֵן וְרָאָה
  choice: तब याजक आकर जाँच करे
  rationale: विधिक प्रक्रिया में वाव + क़ातल क्रमिक निर्देश व्यक्त करता है। 'जाँच करे' ראה के यहाँ निरीक्षणात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: यदि वह देखे कि
  rationale: निरीक्षण के बाद पाई गई दशा को शर्त के रूप में प्रस्तुत करता है; यह हिन्दी विधिक शैली में सहज है।
- source_word: פָּשָׂה הַנֶּגַע
  choice: वह दाग ... फैल गया है
  rationale: פשׂה का अर्थ फैलना है और נגע यहाँ घर में दिखाई देने वाला दूषित दाग/प्रभाव है; 'दाग' अनावश्यक चिकित्सकीय निश्चितता से बचता है।
- source_word: צָרַעַת מַמְאֶרֶת
  choice: विनाशकारी कोढ़
  rationale: צָרַעַת लैव्यव्यवस्था की व्यापक अनुष्ठानिक श्रेणी है, आधुनिक हैन्सन रोग का सटीक नाम नहीं। हिन्दी में स्थापित पारिभाषिक निरंतरता के लिए 'कोढ़' रखा गया है और पादटिप्पणी में उसके व्यापक अर्थ को स्पष्ट किया गया है। מַמְאֶרֶת की गंभीर, नष्टकारी प्रकृति 'विनाशकारी' से व्यक्त होती है।
- source_word: טָמֵא הוּא
  choice: वह घर अशुद्ध है
  rationale: टेक्स्ट में सर्वनाम पुल्लिंग एकवचन है और निकटतम संदर्भ घर है। 'अशुद्ध' लैव्यव्यवस्था की अनुष्ठानिक स्थिति के लिए मानक हिन्दी शब्द है।
theological_decisions:
- issue: घर के लिए צָרַעַת का अनुवाद
  choice: '''कोढ़'' को पारिभाषिक नाम के रूप में रखकर पादटिप्पणी में उसका व्यापक अर्थ स्पष्ट करना'
  alternative: '''फफूँदी'', ''हानिकारक दाग'' या ''चर्मरोग'''
  rationale: मूल शब्द मनुष्यों, वस्त्रों और घरों पर लागू एक ही अनुष्ठानिक अशुद्धता-श्रेणी को दर्शाता है। 'फफूँदी' पदार्थ की पहचान को मूल से अधिक निश्चित कर देती है, जबकि 'चर्मरोग' घर के संदर्भ में अस्वाभाविक है।
- issue: טָמֵא הוּא का संदर्भ
  choice: घर को अशुद्ध घोषित करना
  alternative: दाग या कोढ़ को अशुद्ध कहना
  rationale: मूल का पुल्लिंग सर्वनाम בַּיִת के साथ स्वाभाविक रूप से मेल खाता है और विधान का परिणाम घर की अनुष्ठानिक स्थिति है।
