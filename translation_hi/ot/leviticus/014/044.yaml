  register: आधुनिक, स्पष्ट और गरिमापूर्ण विधिक हिन्दी। प्रक्रियात्मक भाव के लिए 'जाँच करे' रखा गया है। पारंपरिक शब्द 'कोढ़' को चिकित्सकीय अर्थ से अलग करने के लिए संक्षिप्त पादटिप्पणी दी गई है।
