  naturalness: The proposed revision is clear, modern legal Hindi. “यदि दाग घर में फैल गया हो” expresses the conditional observation without the redundant added subject. “वह घर अशुद्ध है” makes the final pronoun’s referent explicit and avoids ambiguity in Hindi.
  terminology: “याजक,” “जाँच,” and “अशुद्ध” are suitable. Retaining “कोढ़” as an established Levitical label is safe only with the supplied clarification that it is not modern Hansen’s disease. “विनाशकारी” adequately conveys the severe/destructive sense of מַמְאֶרֶת without asserting a specific physical diagnosis such as mildew.
