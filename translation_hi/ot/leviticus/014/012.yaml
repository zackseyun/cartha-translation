  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֣בֶשׂ הָ/אֶחָ֗ד וְ/הִקְרִ֥יב אֹת֛/וֹ לְ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֥יף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/012.yaml
  text: Then the priest shall take the one male lamb and present it as a guilt offering[a], along with the log of oil[b], and he shall wave them as a wave offering before Yahweh.
translation:
  language: hi
  text: फिर याजक उस एक नर मेमने को ले और उसे दोषबलि[a] के रूप में, तेल का एक लोग[b] साथ लेकर, प्रस्तुत करे; और वह उन दोनों को याहवे के सामने हिलाने की भेंट के लिए हिलाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘क्षतिपूर्ति-बलि’।
    reason: lexical_alternative
  - marker: b
    text: ‘लोग’ प्राचीन इस्राएल में तरल पदार्थ नापने की एक छोटी इकाई थी।
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: फिर ... ले
  rationale: वाव के साथ प्रयुक्त क्रिया अनुष्ठान की क्रमिक अगली कार्रवाई बताती है; ‘फिर’ इस प्रक्रियात्मक प्रगति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के उपासना-संबंधी संदर्भ में כֹּהֵן का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: הַכֶּבֶשׂ הָאֶחָד
  choice: उस एक नर मेमने
  rationale: लेख और संख्या पशु को अनुष्ठान में उल्लिखित अन्य पशुओं से अलग करते हैं; כֶּבֶשׂ तथा व्यापक संदर्भ के अनुसार नर मेमना स्पष्ट किया गया है।
- source_word: וְהִקְרִיב אֹתוֹ
  choice: उसे ... प्रस्तुत करे
  rationale: हिफ़ील הקריב का बलिदानी संदर्भ में अर्थ पास लाना या अर्पण हेतु प्रस्तुत करना है; ‘प्रस्तुत करे’ वध अथवा पूर्ण अर्पण की क्रिया को समय से पहले निर्दिष्ट नहीं करता।
- source_word: לְאָשָׁם
  choice: दोषबलि के रूप में
  rationale: אָשָׁם लैव्यव्यवस्था में एक तकनीकी बलिदानी पद है। ‘दोषबलि’ परिचित शब्दावली है, जबकि क्षतिपूर्ति का भाव पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לֹג הַשָּׁמֶן
  choice: एक लोग तेल
  rationale: לֹג प्राचीन इस्राएल में तरल पदार्थ की विशिष्ट छोटी माप है; अनुमानित आधुनिक मात्रा देने के बजाय तकनीकी इकाई का लिप्यंतरण रखा गया है।
- source_word: וְהֵנִיף אֹתָם
  choice: वह उन दोनों को ... हिलाए
  rationale: बहुवचन कर्म-प्रत्यय मेमने और तेल दोनों की ओर संकेत करता है। הניף अनुष्ठानिक रूप से हिलाकर प्रस्तुत करने की क्रिया है।
- source_word: תְּנוּפָה
  choice: हिलाने की भेंट
  rationale: यह הניף से संबंधित तकनीकी अनुष्ठानिक संज्ञा है; ‘हिलाने की भेंट’ क्रिया और भेंट के संबंध को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का स्वाभाविक अनुष्ठानिक अर्थ ‘के सामने’ है, और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: אָשָׁם का बलिदानी अर्थ
  choice: दोषबलि
  alternative: क्षतिपूर्ति-बलि
  rationale: यहाँ शब्द विशेष प्रकार के बलिदान का नाम है। ‘दोषबलि’ स्थापित हिन्दी शब्द है, पर शब्द में हुई हानि की भरपाई का पहलू भी हो सकता है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और अनुष्ठानिक निर्देश के अनुरूप रखी गई है। तकनीकी पद ‘दोषबलि’ और ‘हिलाने की भेंट’ अर्थ की निरंतरता बनाए रखते हैं; अपरिचित माप ‘लोग’ को पादटिप्पणी में समझाया गया है।
