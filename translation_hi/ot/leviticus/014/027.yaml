source:
  edition: WLC
  text: וְ/הִזָּ֤ה הַ/כֹּהֵן֙ בְּ/אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/027.yaml
  text: Then the priest shall sprinkle with his right finger some of the oil that is on his left palm seven times before Yahweh.
translation:
  language: hi
  text: फिर याजक अपने दाहिने हाथ की उँगली से अपनी बाईं हथेली पर रखे तेल में से कुछ यहोवा के सामने सात बार छिड़के।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזָּה
  choice: फिर ... छिड़के
  rationale: अनुष्ठानिक संदर्भ में हिफ़ील क्रिया का अर्थ ‘छिड़कना’ है; ‘फिर’ विधि के अगले क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के उपासना-विधान में כֹּהֵן के लिए प्रचलित और गरिमापूर्ण हिन्दी शब्द।
- source_word: בְּאֶצְבָּעוֹ הַיְמָנִית
  choice: अपने दाहिने हाथ की उँगली से
  rationale: मूल में एकवचन ‘उँगली’ और दाहिनी ओर का विशेष उल्लेख है; हिन्दी में यह रूप ‘दाहिनी उँगली’ से अधिक स्वाभाविक और स्पष्ट है।
- source_word: מִן הַשֶּׁמֶן
  choice: तेल में से कुछ
  rationale: מִן यहाँ अंशवाचक है—हथेली पर रखे तेल का कुछ भाग छिड़का जाता है।
- source_word: אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: अपनी बाईं हथेली पर रखे
  rationale: כַּף यहाँ हाथ की हथेली को सूचित करता है; ‘पर रखे’ सम्बन्धवाचक वाक्यांश को सहज हिन्दी में संक्षिप्त करता है।
- source_word: שֶׁבַע פְּעָמִים
  choice: सात बार
  rationale: गणना-सूचक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי अनुष्ठान को परमेश्वर की उपस्थिति के सामने किए जाने को व्यक्त करता है; יְהוָה को व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से दर्शाया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय वाचा-नाम सीधे आया है। हिन्दी के सामान्य पाठकों के लिए परिचित व्यक्तिवाचक रूप ‘यहोवा’ नाम और ‘प्रभु’ उपाधि के भेद को बनाए रखता है; ‘याहवे’ अधिक संभावित विद्वत्तापरक उच्चारण है, पर हिन्दी बाइबलीय प्रयोग में अपेक्षाकृत कम परिचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक-अनुष्ठानिक शैली को गरिमापूर्ण पर सहज रखा गया है। ‘अपनी’ से दोनों अंगों का कर्ता याजक स्पष्ट है, और शब्दक्रम तेल के स्थान तथा छिड़कने की क्रिया को बिना अनावश्यक जटिलता के जोड़ता है।
