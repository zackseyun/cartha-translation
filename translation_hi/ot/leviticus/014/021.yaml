base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/021.yaml
  text: But if he is poor and his means are insufficient[a], then he shall take one male lamb for a guilt offering to be waved, to make atonement for him, and one-tenth of an ephah of fine flour mixed with oil for a grain offering[b], and one log of oil.
translation:
  language: hi
  text: परन्तु यदि वह गरीब हो और उसके पास पर्याप्त साधन न हों[a], तो वह दोषबलि के रूप में हिलाने की रीति से अर्पित करने और उसके लिए प्रायश्चित करने के लिए एक नर मेमना, अन्नबलि के लिए तेल में मिला हुआ एक एपा का दसवाँ भाग मैदा, और एक लोग[b] तेल ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “उसका हाथ न पहुँचता हो”; अर्थात उसके पास पर्याप्त साधन न हों।
    reason: lexical_alternative
  - marker: b
    text: “लोग” इस्राएली उपासना-विधान में प्रयुक्त द्रव की एक छोटी माप थी।
    reason: cultural_note
lexical_decisions:
- source_word: דַּל
  choice: गरीब
  rationale: यह शब्द कम आर्थिक साधनों वाले व्यक्ति को दर्शाता है; आधुनिक हिन्दी में ‘गरीब’ सीधा और स्वाभाविक है।
- source_word: וְאֵין יָדוֹ מַשֶּׂגֶת
  choice: उसके पास पर्याप्त साधन न हों
  rationale: शाब्दिक मुहावरा ‘उसका हाथ न पहुँचता हो’ आर्थिक सामर्थ्य की कमी बताता है; मुख्य पाठ में उसका आशय दिया गया है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: כֶּבֶשׂ אֶחָד
  choice: एक नर मेमना
  rationale: כֶּבֶשׂ यहाँ नर मेमने के लिए प्रयुक्त विशिष्ट शब्द है।
- source_word: אָשָׁם
  choice: दोषबलि
  rationale: यह लैव्यव्यवस्था की विशिष्ट बलि-श्रेणी है; ‘दोषबलि’ उसका प्रचलित और संक्षिप्त हिन्दी रूप है।
- source_word: לִתְנוּפָה
  choice: हिलाकर चढ़ाए जाने को
  rationale: यह मेमने पर किए जाने वाले हिलाने के अनुष्ठान को व्यक्त करता है, न कि दोषबलि से अलग किसी दूसरी बलि को।
- source_word: לְכַפֵּר עָלָיו
  choice: उसके प्रायश्चित के लिए
  rationale: याजकीय संदर्भ में כפר के अनुष्ठानिक और धर्मवैज्ञानिक अर्थ को सुरक्षित रखते हुए किसी विशेष प्रायश्चित-सिद्धान्त को आरोपित नहीं करता।
- source_word: וְעִשָּׂרוֹן סֹלֶת אֶחָד
  choice: एक एपा का दसवाँ भाग मैदा
  rationale: עִשָּׂרוֹן बलि-विधान में एपा के दसवें भाग का सूखा माप है; ‘मैदा’ महीन आटे के लिए सहज हिन्दी है।
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: तेल में मिला हुआ
  rationale: यह आटे के तेल के साथ मिलाए जाने को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְמִנְחָה
  choice: अन्नबलि के लिए
  rationale: इस याजकीय संदर्भ में מִנְחָה विशिष्ट अन्नबलि को दर्शाता है।
- source_word: לֹג שָׁמֶן
  choice: एक लोग तेल
  rationale: ‘लोग’ प्राचीन इस्राएली द्रव-माप है; अनिश्चित आधुनिक समतुल्य देने के बजाय तकनीकी इकाई सुरक्षित रखी गई है।
theological_decisions:
- issue: याजकीय बलि-संबंधी पारिभाषिक शब्दावली
  choice: ‘दोषबलि’, ‘प्रायश्चित’ और ‘अन्नबलि’ जैसे विशिष्ट पद बनाए रखे गए हैं।
  alternative: व्याख्यात्मक रूप जैसे ‘क्षतिपूर्ति की भेंट’ या ‘अनुष्ठानिक शुद्धि’
  rationale: मूल पाठ अलग-अलग बलि-श्रेणियों और क्रियाओं को तकनीकी सटीकता से व्यक्त करता है; स्थापित पद इस भेद और धर्मवैज्ञानिक तनाव को बिना संकीर्ण व्याख्या के सुरक्षित रखते हैं।
- issue: לִתְנוּפָה का संबंध
  choice: दोषबलि के मेमने को ‘हिलाकर चढ़ाए जाने’ वाला बताया गया है।
  alternative: इसे अलग ‘हिलाने की भेंट’ कहना
  rationale: व्याकरणतः यह उसी एक मेमने की अनुष्ठानिक प्रस्तुति बताता है, अलग बलि-श्रेणी नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी-अनुष्ठानिक संदर्भ के अनुरूप रखी गई है। ‘परन्तु’, ‘दोषबलि’, ‘अन्नबलि’ और ‘प्रायश्चित’ जैसे परिचित बाइबलीय पद तकनीकी स्पष्टता के लिए रखे गए हैं; वाक्य-क्रम हिन्दी में स्वाभाविक बनाया गया है।
