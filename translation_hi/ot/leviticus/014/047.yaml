  yaml_path: translation/ot/leviticus/014/047.yaml
  text: And whoever lies down in the house shall wash his clothes[b][a], and whoever eats in the house shall wash his clothes.
translation:
  language: hi
  text: और जो कोई उस घर में लेटे, वह अपने कपड़े धोए[a]; और जो कोई उस घर में भोजन करे, वह अपने कपड़े धोए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सोए।’ इब्रानी क्रिया का अर्थ ‘लेटना’ या ‘सोना’ हो सकता है; यहाँ ‘लेटे’ अधिक व्यापक है और विधिक प्रसंग के अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשֹּׁכֵב
  choice: और जो कोई ... लेटे
  rationale: संज्ञा के रूप में प्रयुक्त साभिप्राय कृदन्त किसी भी ऐसे व्यक्ति को दर्शाता है जो घर में लेटे। ‘लेटे’ שׁכב के व्यापक अर्थ को बनाए रखता है और वास्तविक नींद को अनिवार्य नहीं मानता।
- source_word: בַּבַּיִת
  choice: उस घर में
  rationale: यह सीधा स्थानवाचक पद है। प्रसंग में पहले से निर्दिष्ट प्रभावित घर होने के कारण हिन्दी में ‘उस घर में’ स्वाभाविक और स्पष्ट है।
- source_word: יְכַבֵּס
  choice: धोए
  rationale: याजकीय विधि-संदर्भ में अपूर्ण क्रिया दायित्व या निर्धारित कार्य व्यक्त करती है। हिन्दी का विध्यर्थक ‘धोए’ कानूनी निर्देश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶת־בְּגָדָיו
  choice: अपने कपड़े
  rationale: בֶּגֶד का सामान्य अर्थ कपड़े है। हिन्दी में कर्ता-संदर्भित ‘अपने’ स्वाभाविक है और मूल के एकवचन संबंध को बिना अनावश्यक लैंगिक भार के व्यक्त करता है।
- source_word: וְהָאֹכֵל
  choice: और जो कोई ... भोजन करे
  rationale: यह भी संज्ञार्थक कृदन्त है और सामान्य कानूनी दायरा रखता है। ‘भोजन करे’ गरिमापूर्ण आधुनिक हिन्दी है और घर के भीतर खाने के कार्य को स्पष्ट करता है।
theological_decisions:
- issue: कानूनी निर्देश में पुल्लिंग एकवचन रूपों का सामान्य मानवीय संदर्भ
  choice: ‘जो कोई ... अपने कपड़े’
  alternative: ‘जो पुरुष ... उसके कपड़े’
  rationale: इब्रानी के पुल्लिंग एकवचन कृदन्त और प्रत्यय यहाँ प्रतिनिधिक, सामान्य कानूनी अर्थ रखते हैं; वे नियम को केवल पुरुषों तक सीमित नहीं करते। हिन्दी में ‘जो कोई’ और ‘अपने’ मूल के सामान्य दायरे तथा एकवचन संबंध—दोनों को स्वाभाविक रूप से बनाए रखते हैं।
- issue: שׁכב में लेटने और सोने की अर्थ-संभावना
  choice: ‘लेटे’ को मुख्य पाठ में रखना
  alternative: ‘सोए’
  rationale: क्रिया लेटने या सोने, दोनों का बोध करा सकती है। विधिक प्रसंग वास्तविक नींद की अपेक्षा नहीं करता, इसलिए व्यापक अर्थ ‘लेटे’ चुना गया और ‘सोए’ को पादटिप्पणी में रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण विधिक शैली अपनाई गई है। ‘जो कोई’ सामान्य दायरा स्पष्ट करता है; ‘धोए’ आदेशात्मक दायित्व को सहज हिन्दी में व्यक्त करता है। मुख्य पाठ में पादटिप्पणी-चिह्न [a] उपस्थित है।
