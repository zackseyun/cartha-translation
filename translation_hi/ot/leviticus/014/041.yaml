  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज विधानात्मक शैली। कारक क्रिया ‘खुरचवाएगा’ पुरोहित द्वारा काम करवाए जाने का भाव सुरक्षित रखती है; ‘धूल’ मूल की अनिर्दिष्टता बनाए रखता है।
