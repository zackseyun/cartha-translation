  yaml_path: translation/ot/leviticus/014/041.yaml
  text: He shall have the inside of the house scraped all around[a], and they shall pour out the dust that they scraped off outside the city into an unclean place.
translation:
  language: hi
  text: और वह घर के भीतर से चारों ओर खुरचवाएगा, और जो धूल खुरचकर निकाली गई हो उसे वे नगर के बाहर किसी अशुद्ध स्थान में डाल देंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַקְצִעַ
  choice: खुरचवाएगा
  rationale: 'हिफ़ील रूप की कारकता को स्वाभाविक हिन्दी में व्यक्त करता है: वह स्वयं सारा काम करने के बजाय उसे करवाता है।'
- source_word: מִבַּיִת סָבִיב
  choice: घर को भीतर चारों ओर से
  rationale: घर की पूरी भीतरी सतह/परिधि का भाव स्पष्ट और सहज हिन्दी में रखता है।
- source_word: וְשָׁפְכוּ
  choice: फेंक देंगे
  rationale: शाब्दिक अर्थ ‘उँडेलना’ है, पर खुरची हुई धूल को नियत स्थान पर डालकर निपटाने के प्रसंग में ‘फेंक देंगे’ स्वाभाविक है और क्रिया का आशय बनाए रखता है।
- source_word: הֶעָפָר
  choice: धूल
  rationale: मूल शब्द का सीधा अर्थ ‘धूल’ है; ‘पलस्तर’ जोड़ने से ऐसी विशिष्टता आती जिसे इब्रानी स्पष्ट नहीं करता।
- source_word: אֲשֶׁר הִקְצוּ
  choice: जो ... उन्होंने खुरची हो
  rationale: घर की दीवारों से खुरचकर निकाली गई सामग्री की ओर संकेत करता है और पहले प्रयुक्त क्रिया से संबंध बनाए रखता है।
- source_word: אֶל מִחוּץ לָעִיר
  choice: नगर के बाहर
  rationale: नगर की सीमा से बाहर ले जाने की दिशा और स्थान को सहज हिन्दी में व्यक्त करता है।
- source_word: אֶל מָקוֹם טָמֵא
  choice: किसी अशुद्ध स्थान में
  rationale: लैव्यव्यवस्था के शुद्धता-विधान में טָמֵא के पारिभाषिक धार्मिक अर्थ को ‘अशुद्ध’ सुरक्षित रखता है।
theological_decisions:
- issue: लैव्यव्यवस्था के शुद्धता-संदर्भ में טָמֵא का अनुवाद
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: ‘अशुद्ध’ अनुष्ठानिक शुद्धता की श्रेणी को व्यक्त करता है और नैतिक भ्रष्टता का अनावश्यक अर्थ नहीं जोड़ता।
