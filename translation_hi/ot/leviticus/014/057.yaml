  text: to give instruction about when it is unclean and when it is clean. This is the law concerning the defiling condition[a].
translation:
  language: hi
  text: यह सिखाने के लिए है कि किसी व्यक्ति या वस्तु को कब अशुद्ध और कब शुद्ध माना जाए। अशुद्धकारी दशा[a] के विषय में यही व्यवस्था है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत अनुवादों में ‘कोढ़’। इब्रानी शब्द मनुष्यों, कपड़ों और घरों में दिखाई देने वाली विधिगत अशुद्धता की दशाओं को भी सूचित कर सकता है और केवल आधुनिक हैंसेन रोग तक सीमित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרֹת
  choice: यह निर्देश देने के लिए
  rationale: हिफ़ील रूप अधिकारपूर्ण शिक्षा या निर्णय-संबंधी निर्देश देने का भाव व्यक्त करता है; हिन्दी में यह कानूनी निष्कर्ष के रूप में स्वाभाविक है।
- source_word: בְּיוֹם הַטָּמֵא וּבְיוֹם הַטָּהֹר
  choice: कि कब वह अशुद्ध है और कब शुद्ध
  rationale: यहाँ בְּיוֹם का आशय किसी शाब्दिक कैलेंडर-दिन से नहीं, बल्कि उस समय या परिस्थिति से है जब संबंधित वस्तु, व्यक्ति या घर को अशुद्ध अथवा शुद्ध ठहराया जाए।
- source_word: תּוֹרַת
  choice: व्यवस्था
  rationale: लैव्यव्यवस्था के इस कानूनी-सांस्कृतिक संदर्भ में ‘व्यवस्था’ निर्देशों के नियामक स्वरूप को स्पष्ट करती है।
- source_word: הַצָּרָעַת
  choice: अशुद्ध करने वाली दशा
  rationale: यह इब्रानी शब्द केवल मनुष्य की त्वचा नहीं, बल्कि वस्त्रों और घरों पर प्रकट होने वाली दशाओं को भी समेटता है; इसलिए किसी एक आधुनिक रोग का नाम देना भ्रामक होगा।
theological_decisions:
- issue: צָרַעַת को आधुनिक रोग या व्यापक सांस्कृतिक अशुद्धता-श्रेणी के रूप में प्रस्तुत करना
  choice: अशुद्ध करने वाली दशा
  alternative: कोढ़; चर्मरोग
  rationale: अध्याय में यह श्रेणी मनुष्यों, कपड़ों और घरों पर लागू होती है। व्यापक पद मूल की सांस्कृतिक श्रेणी को बनाए रखता है और इसे आधुनिक हैन्सन रोग तक सीमित नहीं करता।
- issue: הַטָּמֵא और הַטָּהֹר का स्वरूप
  choice: अशुद्ध और शुद्ध
  alternative: गंदा और साफ़
  rationale: ये शब्द मुख्यतः विधिगत/अनुष्ठानिक स्थिति बताते हैं, सामान्य स्वच्छता या गंदगी नहीं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘कब’ शाब्दिक ‘दिन’ की अपेक्षा इब्रानी काल-सूचक मुहावरे का आशय देता है। ‘वह’ जानबूझकर सामान्य रखा गया है, क्योंकि निकटवर्ती विधियाँ व्यक्ति, वस्त्र और घर—सभी से संबंधित हैं।
