  yaml_path: translation/ot/leviticus/014/015.yaml
  text: Then the priest shall take some of the log of oil and pour it into the palm of his own left hand[a].
translation:
  language: hi
  text: तब याजक तेल के लोग-माप में से कुछ तेल लेकर अपनी बाईं हथेली पर उंडेलेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लोग’ प्राचीन काल की द्रव-माप की एक इकाई थी।
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: तब ... लेकर
  rationale: वाव के साथ यह क्रिया विधि के अगले क्रमिक चरण को बताती है; हिंदी में ‘तब ... लेकर’ स्वाभाविक रूप से उस क्रम को व्यक्त करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: उपासना-विधि के संदर्भ में כֹּהֵן का मानक और स्पष्ट हिंदी अनुवाद।
- source_word: מִלֹּג הַשָּׁמֶן
  choice: तेल के लोग में से कुछ
  rationale: מִן यहाँ स्रोत अथवा अंश का भाव देता है; इससे स्पष्ट होता है कि माप-पात्र में रखे तेल में से कुछ लिया जाता है।
- source_word: לֹג
  choice: लोग
  rationale: यह प्राचीन द्रव-माप की विशिष्ट इकाई है; अनिश्चित आधुनिक समतुल्य देने के बजाय लिप्यंतरण रखा गया है।
- source_word: וְיָצַק
  choice: उंडेलेगा
  rationale: विधिक निर्देश में यह आगे की निर्धारित क्रिया को व्यक्त करता है; ‘उंडेलेगा’ तेल को हथेली पर डालने का स्वाभाविक हिंदी शब्द है।
- source_word: עַל כַּף
  choice: हथेली पर
  rationale: עַל का मूल स्थानिक अर्थ ‘पर’ है और כַּף यहाँ हथेली को दर्शाता है; हिंदी में यह क्रिया स्पष्ट और स्वाभाविक है।
- source_word: הַשְּׂמָאלִית
  choice: अपनी बाईं हथेली
  rationale: विशेषण याजक की बाईं हथेली को निर्दिष्ट करता है; ‘अपनी’ से स्पष्ट होता है कि हथेली स्वयं याजक की है।
