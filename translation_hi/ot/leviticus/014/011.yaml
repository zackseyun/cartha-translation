source:
  edition: WLC
  text: וְ/הֶעֱמִ֞יד הַ/כֹּהֵ֣ן הַֽ/מְטַהֵ֗ר אֵ֛ת הָ/אִ֥ישׁ הַ/מִּטַּהֵ֖ר וְ/אֹתָ֑/ם לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/011.yaml
  text: And the priest who cleanses shall present the man who is being cleansed, along with those things, before Yahweh at the entrance of the tent of meeting.
translation:
  language: hi
  text: और शुद्ध करने वाला याजक उस शुद्ध किए जा रहे पुरुष को और उन वस्तुओं को यहोवा के सामने, मिलापवाले तंबू के द्वार पर उपस्थित करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: उपस्थित करे
  rationale: עמד के हिफ़ील रूप का यहाँ अनुष्ठानिक अर्थ किसी व्यक्ति और वस्तुओं को यहोवा के सामने खड़ा करके प्रस्तुत करना है। ‘उपस्थित करे’ इस औपचारिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַכֹּהֵן הַמְטַהֵר
  choice: शुद्ध करने वाला याजक
  rationale: מְטַהֵר कृदन्त याजक की शुद्धिकरण-विधि में भूमिका बताता है; यह केवल शुद्ध घोषित करने तक सीमित नहीं है और नैतिक पवित्रीकरण का अनावश्यक संकेत भी नहीं देता।
- source_word: הָאִישׁ הַמִּטַּהֵר
  choice: उस शुद्ध किए जा रहे पुरुष को
  rationale: הָאִישׁ का स्पष्ट पुल्लिंग अर्थ ‘पुरुष’ रखा गया है। Hitpael कृदन्त הַמִּטַּהֵר यहाँ उस व्यक्ति को दर्शाता है जो अनुष्ठानिक शुद्धिकरण की प्रक्रिया से गुजर रहा है।
- source_word: וְאֹתָם
  choice: और उन वस्तुओं को
  rationale: बहुवचन सर्वनाम का संदर्भ पिछले पद में बताई गई सामग्री से है, व्यक्तियों से नहीं। हिन्दी में ‘वस्तुओं’ जोड़ने से संदर्भ स्पष्ट होता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי उपस्थिति का अनुष्ठानिक भाव रखता है और יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के द्वार पर
  rationale: यह पवित्रस्थान के निर्धारित प्रवेश-स्थान का प्रचलित, स्पष्ट और स्रोत-संगत हिन्दी पदबंध है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिवाचक वाचा-नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदलने के बजाय उसके नामात्मक स्वरूप को सुरक्षित रखता है; ‘याहवे’ अधिक संभावित शैक्षिक उच्चारण है, पर सामान्य हिन्दी पाठकों में कम परिचित है।
- issue: טהר की अनुष्ठानिक भूमिका
  choice: शुद्ध करने वाला / शुद्ध किए जा रहे
  alternative: शुद्ध घोषित करने वाला / अपने को शुद्ध करने वाला
  rationale: दोनों कृदन्तों को केवल घोषणा या पूर्णतः आत्मक्रियात्मक कार्य तक सीमित नहीं किया गया। पाठ याजक की विधिक भूमिका और पुरुष द्वारा झेली जा रही शुद्धिकरण-प्रक्रिया के बीच का तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट शैली। विधिक आदेश के लिए ‘करे’ और अनुष्ठानिक शब्दावली के लिए ‘शुद्ध’, ‘याजक’, ‘मिलापवाला तंबू’ तथा ‘उपस्थित’ का प्रयोग किया गया है।
