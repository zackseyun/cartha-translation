  text: וְ/הֵבִ֨יא אֹתָ֜/ם בַּ/יּ֧וֹם הַ/שְּׁמִינִ֛י לְ/טָהֳרָת֖/וֹ אֶל הַ/כֹּהֵ֑ן אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/023.yaml
  text: And on the eighth day he shall bring them for his cleansing to the priest[a], at the entrance of the tent of meeting, before Yahweh.
translation:
  language: hi
  text: वह आठवें दिन अपनी शुद्धि के लिए उन्हें याजक के पास, मिलापवाले तंबू के प्रवेश-द्वार पर, यहोवा के सामने ले आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבִיא
  choice: वह ... लाए
  rationale: विधिक निर्देश के संदर्भ में हिफ़ील रूप भावी/आदेशात्मक बल रखता है; हिंदी में आदरसूचक विध्यर्थक ‘लाए’ स्वाभाविक है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: पुल्लिंग बहुवचन कर्म-सर्वनाम पिछले पद में बताई गई बलि-सामग्री की ओर संकेत करता है।
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: आठवें दिन
  rationale: यह समय बताने वाली मानक अभिव्यक्ति है और हिंदी में यही स्वाभाविक रूप है।
- source_word: לְטָהֳרָתוֹ
  choice: अपने शुद्धीकरण के लिए
  rationale: טהר से बना यह संज्ञा-रूप इस प्रसंग में अनुष्ठानिक शुद्ध होने की प्रक्रिया अथवा उद्देश्य को व्यक्त करता है। ‘शुद्धीकरण’ अर्थ को स्पष्ट रखते हुए धार्मिक संदर्भ के अनुकूल है।
- source_word: אֶל הַכֹּהֵן
  choice: याजक के पास
  rationale: दिशासूचक वाक्यांश का स्वाभाविक आधुनिक हिंदी रूप।
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के प्रवेश-द्वार पर
  rationale: אֶל यहाँ उस स्थान को बताता है जहाँ सामग्री लाई जानी है। ‘मिलापवाला तंबू’ אֹהֶל מוֹעֵד का परिचित और अर्थपूर्ण हिंदी रूप है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: मानक उपासना-संबंधी अभिव्यक्ति, जिसका अर्थ यहोवा की उपस्थिति में है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को हिंदी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; ‘यहोवा’ हिंदी पाठकों के लिए उसका स्थापित लिप्यंतरण है और नाम को उपाधि से नहीं बदलता।
- issue: अनुष्ठानिक शुद्धता के संदर्भ में לְטָהֳרָתוֹ
  choice: अपने शुद्धीकरण के लिए
  alternative: अपने शुद्ध होने के लिए
  rationale: ‘शुद्धीकरण’ अनुष्ठानिक प्रक्रिया को संक्षेप में व्यक्त करता है और नैतिक दोष का अनावश्यक अर्थ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। विधिक निर्देश का बल ‘लाए’ से व्यक्त है। वाक्य-विन्यास मूल इब्रानी क्रम के निकट है, पर हिंदी की स्वाभाविकता के अनुसार व्यवस्थित किया गया है।
