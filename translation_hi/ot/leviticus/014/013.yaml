  text: וְ/שָׁחַ֣ט אֶת הַ/כֶּ֗בֶשׂ בִּ֠/מְקוֹם אֲשֶׁ֨ר יִשְׁחַ֧ט אֶת הַֽ/חַטָּ֛את וְ/אֶת הָ/עֹלָ֖ה בִּ/מְק֣וֹם הַ/קֹּ֑דֶשׁ כִּ֡י כַּ֠/חַטָּאת הָ/אָשָׁ֥ם הוּא֙ לַ/כֹּהֵ֔ן קֹ֥דֶשׁ קָֽדָשִׁ֖ים הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/013.yaml
  text: And he shall slaughter the lamb in the place where they slaughter the sin offering and the burnt offering[a], in the holy place; for like the sin offering, the guilt offering belongs to the priest[b]; it is most holy.
translation:
  language: hi
  text: और वह उस मेमने को उस पवित्र स्थान में बलि के लिए वध करे जहाँ पापबलि[a] और होमबलि के पशुओं का वध किया जाता है; क्योंकि दोषबलि[b] पापबलि के समान याजक की होती है; वह परमपवित्र है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि”; इब्रानी חַטָּאת याजकीय व्यवस्था में इस संस्कार के शुद्ध करने वाले कार्य पर भी बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “क्षतिपूर्ति-बलि”; इब्रानी אָשָׁם बलिदान से जुड़े प्रतिपूर्ति के पक्ष को भी उभार सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: और वह ... बलि करे
  rationale: शׁחט बलिदान-संबंधी संदर्भ में विधिपूर्वक पशु वध को दर्शाता है। हिन्दी में ‘बलि करे’ इस अनुष्ठानिक अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: הַכֶּבֶשׂ
  choice: उस मेमने को
  rationale: כֶּבֶשׂ यहाँ बलिदान के लिए निर्धारित मेमना है; पूर्ववर्ती संदर्भ के कारण निश्चयवाचकता को ‘उस’ से व्यक्त किया गया है।
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: उसी जगह ... बलि किए जाते हैं
  rationale: एकवचन क्रिया यहाँ सामान्य वैधानिक प्रथा व्यक्त करती है। हिन्दी का कर्मवाच्य बहुवचन निर्धारित अनुष्ठानिक स्थान को स्पष्ट करता है, किसी विशेष कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: यह हिन्दी में इस स्थापित बलिदान-श्रेणी का संक्षिप्त और परिचित नाम है; शुद्धिकरण पर बल देने वाला वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: עֹלָה के लिए ‘होमबलि’ प्रचलित हिन्दी पारिभाषिक शब्द है और पूर्णतः अग्नि पर चढ़ाए जाने वाले बलिदान को सूचित करता है।
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: पवित्र स्थान में
  rationale: यह निर्धारित पवित्र क्षेत्र को दर्शाता है; हिन्दी में ‘पवित्र स्थान’ स्वाभाविक और स्पष्ट है।
- source_word: כִּי כַּחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן
  choice: क्योंकि दोषबलि, पापबलि के समान, याजक की होती है
  rationale: वाक्य पापबलि और दोषबलि के बीच समानता तथा याजक के अधिकार दोनों को व्यक्त करता है। ‘याजक की होती है’ לַכֹּהֵן का सीधा, स्वाभाविक रूप है।
- source_word: קֹדֶשׁ קָדָשִׁים הוּא
  choice: वह परमपवित्र है
  rationale: קֹדֶשׁ קָדָשִׁים इब्रानी का उत्कृष्टता-सूचक पद है; ‘परमपवित्र’ तकनीकी पवित्रता-श्रेणी को संक्षेप और स्पष्टता से व्यक्त करता है।
theological_decisions:
- issue: याजकीय बलिदान-विधान में חַטָּאת का अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यह शब्द पाप और अनुष्ठानिक शुद्धिकरण दोनों से संबंधित अर्थ रख सकता है। मुख्य पाठ में परिचित बलिदान-श्रेणी ‘पापबलि’ रखी गई है, जबकि वास्तविक अर्थगत विकल्प पादटिप्पणी में सुरक्षित है।
- issue: אָשָׁם का अनुवाद
  choice: दोषबलि
  alternative: क्षतिपूर्ति-बलि
  rationale: ‘दोषबलि’ बलिदान की पारंपरिक श्रेणी को स्पष्ट रखता है; ‘क्षतिपूर्ति-बलि’ उसके प्रतिपूर्ति-पक्ष पर अधिक बल देता है और इसलिए पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वैधानिक शैली अपनाई गई है। ‘पापबलि’, ‘होमबलि’, ‘दोषबलि’, ‘याजक’ और ‘परमपवित्र’ जैसे परिचित बाइबलीय पारिभाषिक शब्द रखे गए हैं। मूल के कर्ता-संबंधी सामान्य भाव को ‘बलि किए जाते हैं’ से व्यक्त किया गया है।
