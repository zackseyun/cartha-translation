base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/008.yaml
  text: The one being cleansed shall wash his clothes[a], shave off all his hair, and bathe in water; then he shall be clean. Afterward he may come into the camp[b], but he shall stay outside his tent for seven days.
translation:
  language: hi
  text: जिस व्यक्ति को शुद्ध किया जा रहा है[a], वह अपने कपड़े धोए, अपने सारे बाल मूँड डाले और पानी में स्नान करे; तब वह शुद्ध होगा। इसके बाद वह छावनी में आ सकता है[b], पर वह सात दिन तक अपने तंबू के बाहर रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो शुद्ध हो रहा है।” इब्रानी शब्द उस व्यक्ति को दर्शाता है जो निर्धारित विधि के अनुसार शुद्धिकरण की प्रक्रिया से गुजर रहा है।
    reason: lexical_alternative
  - marker: b
    text: या “वह छावनी में आएगा।” इब्रानी रूप का अर्थ साधारण भविष्य भी हो सकता है या अनुमति भी; संदर्भ सीमित पुनःप्रवेश की अनुमति का संकेत देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּטַּהֵר
  choice: जो व्यक्ति शुद्ध किया जा रहा है
  rationale: हित्पएल कृदंत उस व्यक्ति को दर्शाता है जो निर्धारित विधिवत शुद्धिकरण की प्रक्रिया से गुजर रहा है। यह अनुवाद सक्रिय आत्म-शुद्धि के बजाय प्रक्रिया के ग्रहणकर्ता होने का भाव रखता है।
- source_word: כִבֶּס ... בְּגָדָיו
  choice: अपने कपड़े धोए
  rationale: כִּבֵּס वस्त्र धोने के लिए प्रयुक्त है; आधुनिक हिंदी में ‘कपड़े धोए’ स्वाभाविक और स्पष्ट है।
- source_word: גִלַּח אֶת כָּל שְׂעָרוֹ
  choice: अपने सारे बाल मुँडाए
  rationale: क्रिया और ‘सारे बाल’ पूर्ण रूप से बाल हटाने को व्यक्त करते हैं; ‘मुँडाए’ हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: רָחַץ בַּמַּיִם
  choice: पानी से नहाए
  rationale: यहाँ शरीर धोने का आशय है और यह पहले आए कपड़े धोने से स्पष्ट भेद रखता है।
- source_word: וְטָהֵר
  choice: तब वह शुद्ध होगा
  rationale: यह पूर्ववर्ती क्रियाओं के बाद प्राप्त होने वाली विधिगत शुद्ध अवस्था बताता है; ‘तब’ क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאַחַר
  choice: इसके बाद
  rationale: यह शुद्धिकरण की विधि के अगले चरण का परिचय देता है।
- source_word: יָבֹא אֶל הַמַּחֲנֶה
  choice: वह छावनी में आ सकता है
  rationale: 'अगली पाबंदी के संदर्भ में अपूर्ण क्रिया को अनुमतिपरक अर्थ में समझना उचित है: उसे छावनी में लौटने की अनुमति है, यद्यपि वह अभी अपने तंबू में नहीं रह सकता।'
- source_word: וְיָשַׁב מִחוּץ לְאָהֳלוֹ
  choice: पर ... अपने तंबू के बाहर ही रहे
  rationale: יָשַׁב यहाँ अस्थायी रूप से ठहरने या रहने को दर्शाता है। ‘पर’ छावनी में प्रवेश और तंबू से बाहर रहने के बीच निहित विरोध स्पष्ट करता है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: अवधि को आधुनिक हिंदी में स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: विधिगत शुद्धता की भाषा
  choice: טהר/מטהר के लिए ‘शुद्ध किया जा रहा है/शुद्ध होगा’
  alternative: ‘साफ किया जा रहा है/साफ होगा’
  rationale: संदर्भ लैव्यव्यवस्था की विधिगत शुद्ध अवस्था का है, नैतिक या आंतरिक पवित्रता का नहीं। ‘शुद्ध’ इस पारिभाषिक भाव को बनाए रखता है, जबकि वाक्य का संदर्भ इसे विधिगत अर्थ तक सीमित करता है।
- issue: छावनी में पुनः प्रवेश का भाव
  choice: अनुमतिपरक—‘आ सकता है’
  alternative: साधारण भविष्य/आदेशात्मक—‘छावनी में आएगा’ या ‘आए’
  rationale: इब्रानी अपूर्ण रूप दोनों संभावनाएँ रखता है। आगे तंबू से बाहर रहने की पाबंदी दिए जाने के कारण यहाँ सीमित पुनः प्रवेश की अनुमति संदर्भानुकूल है; विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। ‘छावनी’, ‘शुद्ध’ और ‘तंबू’ लैव्यव्यवस्था के विधिगत संदर्भ को स्पष्ट रखते हैं। विधि के निर्देशों के लिए आदरसूचक-तटस्थ संभाव्य रूप ‘धोए/मुँडाए/नहाए/रहे’ प्रयुक्त हैं।
