base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/050.yaml
  text: Then he shall slaughter the one bird into an earthenware vessel over living water[a].
translation:
  language: hi
  text: तब वह उस एक पक्षी को मिट्टी के पात्र में बहते जल के ऊपर वध करे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘जीवित जल’; अर्थात् ताज़ा या बहता हुआ जल।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַט
  choice: फिर वह ... बलि करे
  rationale: अनुष्ठान-विधि के क्रम में यह क्रिया अगले निर्देश को व्यक्त करती है। ‘फिर’ क्रमसूचक बल देता है और ‘बलि करे’ अनुष्ठानिक वध को सामान्य ‘मार डाले’ से अधिक सटीक रूप में बताता है।
- source_word: הַצִּפֹּר הָאֶחָת
  choice: एक पक्षी को
  rationale: संदर्भ में पहले बताए गए दो पक्षियों में से एक को दूसरे से अलग किया गया है; यहाँ ‘पहले पक्षी’ जैसा क्रमसूचक अर्थ जोड़ना उचित नहीं।
- source_word: אֶל כְּלִי חֶרֶשׂ
  choice: मिट्टी के पात्र में
  rationale: אֶל यहाँ उस पात्र की ओर/उसमें वध किए जाने को बताता है, ताकि रक्त पात्र में गिरे; כְּלִי חֶרֶשׂ मिट्टी से बने पात्र को दर्शाता है।
- source_word: עַל מַיִם חַיִּים
  choice: सोते के जल के ऊपर
  rationale: शाब्दिक ‘जीवित जल’ ताजे, स्वाभाविक रूप से बहते या स्रोत से निकले जल का हिब्रू मुहावरा है। ‘सोते का जल’ हिंदी में अनुष्ठानिक निर्देश का आशय स्वाभाविक ढंग से स्पष्ट करता है और ‘ऊपर’ पात्र में पहले से रखे जल के ऊपर वध किए जाने का संबंध बनाए रखता है।
theological_decisions:
- issue: शुद्धिकरण-विधि में מַיִם חַיִּים का अर्थ
  choice: सोते का जल
  alternative: जीवित जल / बहता हुआ जल / ताजा जल
  rationale: यहाँ पदबंध मुख्यतः अनुष्ठान के लिए प्राकृतिक स्रोत के ताजे जल को निर्दिष्ट करता है, न कि किसी धार्मिक रूपक को। ‘सोते का जल’ इस मुहावरे का ठोस अर्थ देता है और केवल ‘ताजा जल’ कहने से खो सकने वाले स्रोत अथवा प्रवाह के भाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण विधिक शैली। ‘पात्र’ बाइबलीय अनुष्ठानिक संदर्भ में स्वाभाविक है; वाक्य में कोई अनावश्यक तकनीकी या सांप्रदायिक शब्दावली नहीं जोड़ी गई।
