base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/039.yaml
  text: Then the priest shall return on the seventh day and look, and if the infection has spread in the walls of the house,
translation:
  language: hi
  text: तब सातवें दिन याजक लौटकर जाँच करे। यदि वह दाग घर की दीवारों पर फैल गया हो,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁב
  choice: तब ... लौटकर
  rationale: क्रिया का अर्थ ‘लौटना’ है; प्रसंग में וְ क्रमिक घटनाक्रम को आगे बढ़ाता है, इसलिए स्वाभाविक हिन्दी में ‘तब’ उपयुक्त है।
- source_word: וְרָאָה
  choice: जाँच करे
  rationale: शाब्दिक अर्थ ‘देखे’ है, पर याजक यहाँ घर की दशा का औपचारिक निरीक्षण करता है; ‘जाँच करे’ प्रसंगगत अर्थ को स्पष्ट और सहज बनाता है।
- source_word: הַנֶּגַע
  choice: वह संक्रमण
  rationale: נגע इस शुद्धि-विधान में दिखाई देने वाली हानिकारक दशा/प्रकोप को सूचित करता है। ‘संक्रमण’ आधुनिक पाठक के लिए सुबोध है, जबकि ‘वह’ पूर्वोक्त दशा की ओर संकेत बनाए रखता है; इससे किसी निश्चित आधुनिक रोग-निदान का दावा नहीं किया जाता।
- source_word: פָשָׂה
  choice: फैल गया हो
  rationale: यह क्रिया प्रभावित दशा के विस्तार को व्यक्त करती है; सशर्त वाक्य में पूर्ण संभाव्य रूप स्वाभाविक है।
- source_word: בְּקִירֹת הַבָּיִת
  choice: घर की दीवारों पर
  rationale: हिब्रू בְּ स्थानगत अर्थ देता है। दाग या संक्रमण का दीवारों की सतह पर फैलना हिन्दी में ‘पर’ से स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: וְהִנֵּה का सशर्त या दृश्यात्मक निरूपण
  choice: यदि
  alternative: और देखो,
  rationale: इस विधिक प्रसंग में וְהִנֵּה निरीक्षण के संभावित परिणाम को प्रस्तुत करता है। हिन्दी में ‘यदि’ शर्त को स्वाभाविक रूप से व्यक्त करता है और अंग्रेज़ी परामर्श-पाठ के निर्णय के अनुरूप है; ‘और देखो’ मूल की दृश्यात्मकता अधिक बचाता, पर यहाँ असहज तथा भ्रामक हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक-वर्णनात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। पद अगले आदेश से जुड़ा सशर्त उपवाक्य है, इसलिए अंत में अल्पविराम रखा गया है।
