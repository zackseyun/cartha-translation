id: LEV.14.14
reference: Leviticus 14:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לָקַ֣ח הַ/כֹּהֵן֮ מִ/דַּ֣ם הָ/אָשָׁם֒ וְ/נָתַן֙ הַ/כֹּהֵ֔ן עַל תְּנ֛וּךְ אֹ֥זֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/014.yaml
  text: Then the priest shall take some of the blood of the guilt offering[a], and the priest shall put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: hi
  text: तब याजक दोषबलि के लहू में से कुछ[a] लेकर उसे शुद्ध किए जा रहे व्यक्ति के दाहिने कान की लौ[b] पर, उसके दाहिने हाथ के अंगूठे पर और उसके दाहिने पैर के बड़े अंगूठे पर लगाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दोषबलि के लहू में से।”
    reason: हिब्रू में מִן की मूल रचना दिखाने और मुख्य पाठ में व्यक्त अंशवाचक अर्थ को पारदर्शी रखने के लिए।
  - marker: b
    text: या “दाहिने कान के सिरे पर।”
    reason: תְּנוּךְ के शारीरिक संकेत में ‘लौ’ और अधिक सामान्य ‘सिरा’ दोनों सम्भव हैं।
lexical_decisions:
- source_word: מִדַּם
  choice: लहू में से कुछ
  rationale: 'מִן का अंशवाचक अर्थ स्पष्ट करता है: अनुष्ठान के लिए पूरे लहू के बजाय उसमें से कुछ लिया जाता है।'
- source_word: הָאָשָׁם
  choice: दोषबलि
  rationale: लैव्यव्यवस्था के बलिदानी संदर्भ में אָשָׁם एक विशिष्ट बलि है; ‘दोषबलि’ प्रचलित, संक्षिप्त और संदर्भानुकूल है।
- source_word: תְּנוּךְ אֹזֶן
  choice: कान की लौ
  rationale: תְּנוּךְ कान के बाहरी सिरे या कोमल निचले भाग को सूचित करता है; आधुनिक हिन्दी में ‘कान की लौ’ सबसे स्वाभाविक शारीरिक पद है।
- source_word: הַמִּטַּהֵר
  choice: शुद्ध किए जा रहे व्यक्ति
  rationale: हित्पएल कृदन्त यहाँ उस व्यक्ति को दर्शाता है जो शुद्धीकरण की प्रक्रिया से गुजर रहा है; यह अनुष्ठान की जारी प्रक्रिया को बनाए रखता है।
- source_word: בֹּהֶן יָדוֹ
  choice: उसके दाहिने हाथ के अंगूठे
  rationale: हाथ के साथ בֹּהֶן का अर्थ अंगूठा है।
- source_word: בֹּהֶן רַגְלוֹ
  choice: उसके दाहिने पैर के बड़े अंगूठे
  rationale: पैर के साथ בֹּהֶן बड़े अंगूठे को सूचित करता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְלָקַח ... וְנָתַן
  choice: लेकर ... लगाए
  rationale: विधिक-अनुष्ठानिक संदर्भ में ये रूप निर्देश देते हैं; हिन्दी की संयुक्त निर्देशात्मक रचना अर्थ को स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: शुद्धीकरण पाने वाले व्यक्ति की भूमिका
  choice: शुद्ध किए जा रहे व्यक्ति
  alternative: अपने आप को शुद्ध करने वाला व्यक्ति
  rationale: संदर्भ में व्यक्ति याजकीय शुद्धीकरण-विधि से गुजरता है। यह अनुवाद स्वशुद्धि का अनावश्यक संकेत दिए बिना हिब्रू कृदन्त की प्रक्रियात्मक धारणा को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक-अनुष्ठानिक गरिमा बनाए रखते हुए वाक्य को सामान्य पाठक के लिए सहज रखा गया है। ‘लहू’ और ‘दोषबलि’ बाइबलीय बलिदानी संदर्भ के परिचित पद हैं।
