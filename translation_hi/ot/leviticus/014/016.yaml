id: LEV.14.16
reference: Leviticus 14:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/טָבַ֤ל הַ/כֹּהֵן֙ אֶת אֶצְבָּע֣/וֹ הַ/יְמָנִ֔ית מִן הַ/שֶּׁ֕מֶן אֲשֶׁ֥ר עַל כַּפּ֖/וֹ הַ/שְּׂמָאלִ֑ית וְ/הִזָּ֨ה מִן הַ/שֶּׁ֧מֶן בְּ/אֶצְבָּע֛/וֹ שֶׁ֥בַע פְּעָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/016.yaml
  text: The priest shall dip his right finger into some of the oil that is on his left palm[a], and with his finger he shall sprinkle some of the oil seven times before Yahweh.
translation:
  language: hi
  text: और याजक अपनी दाहिनी उँगली को अपनी बाईं हथेली पर रखे तेल में डुबोए, और अपनी उँगली से उस तेल में से कुछ यहोवा के सामने सात बार छिड़के।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טָבַל
  choice: डुबाए
  rationale: यह क्रिया किसी द्रव में अंग या वस्तु को डुबाने को दर्शाती है; यहाँ उँगली के लिए ‘डुबाए’ स्वाभाविक और सटीक है।
- source_word: אֶצְבָּעוֹ הַיְמָנִית
  choice: अपनी दाहिनी उँगली
  rationale: यह हिब्रू की शारीरिक और अनुष्ठानिक विशिष्टता को सीधे बनाए रखता है।
- source_word: מִן הַשֶּׁמֶן אֲשֶׁר עַל כַּפּוֹ הַשְּׂמָאלִית
  choice: अपनी बाईं हथेली पर रखे तेल में
  rationale: כַּף का अर्थ यहाँ विशेष रूप से हथेली है; טבל के साथ מִן का आशय तेल में उँगली डुबाकर उसमें से कुछ लेना है।
- source_word: הִזָּה
  choice: छिड़के
  rationale: याजकीय अनुष्ठान में यह निर्धारित ढंग से द्रव छिड़कने की क्रिया है; ‘छिड़के’ आधुनिक हिन्दी का स्पष्ट अनुष्ठानिक शब्द है।
- source_word: בְּאֶצְבָּעוֹ
  choice: अपनी उँगली से
  rationale: בְּ यहाँ साधन सूचित करता है; हिन्दी में ‘से’ उसी संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֶׁבַע פְּעָמִים
  choice: सात बार
  rationale: अनुष्ठानिक संख्या को अक्षरशः और स्पष्ट रूप से रखा गया है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह प्रचलित उपासना-संबंधी वाक्यांश परमेश्वर की उपस्थिति के सामने की गई क्रिया दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के विशिष्ट वाचा-नाम का परिचित लिप्यंतरण ‘यहोवा’ है; यह मूल पाठ में आए नाम को सामान्य उपाधि में नहीं बदलता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चतुरक्षरीय विशिष्ट नाम सीधे आया है। हिन्दी पाठकों के लिए परिचित रूप ‘यहोवा’ नाम की विशिष्टता बनाए रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता और ‘याहवे’ अपेक्षाकृत कम परिचित लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की क्रमिक अनुष्ठानिक क्रियाएँ तथा ‘दाहिनी उँगली’, ‘बाईं हथेली’, ‘सात बार’ जैसी मूल की विशिष्टताएँ सुरक्षित हैं।
