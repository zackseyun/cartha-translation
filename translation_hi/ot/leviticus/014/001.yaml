- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: אֶל यहाँ वाणी के संबोधित व्यक्ति को चिह्नित करता है; हिन्दी में ‘मूसा से कहा’ इसका स्वाभाविक रूप है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: לֵאמֹר अगले पद में आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिन्दी में ‘कहा’ इसी कार्य को स्वाभाविक ढंग से पूरा करता है; ‘यह कहते हुए’ अनावश्यक रूप से भारी होता।
theological_decisions:
