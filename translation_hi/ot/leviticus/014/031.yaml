source:
  edition: WLC
  text: אֵ֣ת אֲשֶׁר תַּשִּׂ֞יג יָד֗/וֹ אֶת הָ/אֶחָ֥ד חַטָּ֛את וְ/אֶת הָ/אֶחָ֥ד עֹלָ֖ה עַל הַ/מִּנְחָ֑ה וְ/כִפֶּ֧ר הַ/כֹּהֵ֛ן עַ֥ל הַ/מִּטַּהֵ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/031.yaml
  text: whatever his means can afford[a], one as a sin offering and one as a burnt offering, along with the grain offering[b]. Thus the priest shall make atonement for the one being cleansed before Yahweh.
translation:
  language: hi
  text: वह अपनी सामर्थ्य के अनुसार जो कुछ जुटा सके[a], उसमें से एक को पापबलि[b] और दूसरे को होमबलि के रूप में, अन्नबलि के साथ चढ़ाए। इस प्रकार याजक शुद्ध किए जा रहे व्यक्ति के लिए यहोवा के सामने प्रायश्चित करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “जितना उसका हाथ पा सके”; अर्थात जितना वह अपनी सामर्थ्य के अनुसार जुटा सके।
    reason: lexical_alternative
  - marker: b
    text: वैकल्पिक रूप से, “शुद्धिकरण-बलि।”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: जितना वह जुटा सके
  rationale: शाब्दिक अर्थ ‘जितना उसका हाथ पा सके’ है; यह सामर्थ्य अथवा आर्थिक साधनों का मुहावरा है। चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है और मूल भाव बनाए रखता है।
- source_word: חַטָּאת
  choice: पापबलि
  rationale: लैव्यव्यवस्था के बलिदानी संदर्भ में यह पाप और विधिपूर्वक शुद्धिकरण से संबंधित बलि का प्रचलित नाम है। ‘शुद्धिकरण-बलि’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह पूरी तरह अग्नि पर चढ़ाई जाने वाली बलि का मानक हिन्दी बाइबलीय पद है।
- source_word: עַל הַמִּנְחָה
  choice: अन्नबलि के साथ
  rationale: यहाँ עַל स्थानसूचक ‘पर’ के बजाय साथ अथवा अतिरिक्त रूप से चढ़ाए जाने का भाव देता है।
- source_word: וְכִפֶּר
  choice: प्रायश्चित करे
  rationale: याजकीय बलिदानी संदर्भ में כפר की धार्मिक-विधिक शक्ति को बनाए रखता है, बिना प्रायश्चित की किसी संकीर्ण धर्मसैद्धांतिक व्याख्या को आरोपित किए।
- source_word: הַמִּטַּהֵר
  choice: शुद्ध किए जा रहे व्यक्ति
  rationale: हित्पएल कृदंत उस व्यक्ति को दर्शाता है जो शुद्धिकरण की प्रक्रिया से गुजर रहा है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने/उपस्थिति में’ है; יְהוָה को परियोजना की रीति के अनुसार व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: बलिदानी शब्दावली और प्रायश्चित के अर्थ को अनावश्यक रूप से सीमित न करना
  choice: पापबलि, होमबलि और प्रायश्चित करे
  alternative: शुद्धिकरण-बलि; दोष मिटाए
  rationale: चुने हुए पद मूल के विधिक और बलिदानी स्वर को सुरक्षित रखते हैं, जबकि किसी बाद की विशिष्ट प्रायश्चित-व्याख्या को पाठ में नहीं जोड़ते।
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में परिचित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। बलिदानी पारिभाषिक शब्दों में प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं। मुख्य पाठ में दोनों पादटिप्पणी चिह्न अपेक्षित हैं; इसलिए ‘पापबलि’ के बाद [b] जोड़ा जाना चाहिए।
