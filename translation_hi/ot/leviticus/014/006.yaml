  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֶת הַ/צִּפֹּ֤ר הַֽ/חַיָּה֙ יִקַּ֣ח אֹתָ֔/הּ וְ/אֶת עֵ֥ץ הָ/אֶ֛רֶז וְ/אֶת שְׁנִ֥י הַ/תּוֹלַ֖עַת וְ/אֶת הָ/אֵזֹ֑ב וְ/טָבַ֨ל אוֹתָ֜/ם וְ/אֵ֣ת הַ/צִּפֹּ֣ר הַֽ/חַיָּ֗ה בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחֻטָ֔ה עַ֖ל הַ/מַּ֥יִם הַֽ/חַיִּֽים־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/006.yaml
  text: As for the living bird, he shall take it, along with the cedar wood, the scarlet yarn, and the hyssop, and dip them and the living bird in the blood of the bird that was slaughtered over the fresh water.
translation:
  language: hi
  text: वह जीवित पक्षी को देवदार की लकड़ी, लाल रंग के सूत और जूफ़े के साथ ले और इन वस्तुओं तथा जीवित पक्षी को उस पक्षी के लहू में डुबोए, जिसे बहते पानी[a] के ऊपर वध किया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “जीवित जल”; इसका अनुवाद “ताज़ा पानी” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּפֹּר הַחַיָּה
  choice: जीवित पक्षी
  rationale: यह सामान्य पक्षी-संज्ञा और उसे वध किए गए पक्षी से अलग करने वाले विशेषण, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יִקַּח
  choice: ले
  rationale: विधि-विधान के प्रसंग में यह निर्देशात्मक अपूर्ण क्रिया है; हिन्दी में आज्ञार्थक 'ले' संक्षिप्त और स्वाभाविक है।
- source_word: עֵץ הָאֶרֶז
  choice: देवदार की लकड़ी
  rationale: निर्माण-वाक्यांश का आशय अनुष्ठान में प्रयुक्त देवदार की लकड़ी से है।
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: लाल रंग का ऊन
  rationale: यह कृमिजन्य गहरे लाल रंग से रंगी अनुष्ठानिक सामग्री को दर्शाता है; हिन्दी बाइबलीय प्रयोग में 'लाल रंग का ऊन' स्पष्ट और परिचित है।
- source_word: הָאֵזֹב
  choice: जूफ़ा
  rationale: वनस्पति की ठीक पहचान विवादित है; पारंपरिक पारदर्शी नाम 'जूफ़ा' अनावश्यक वनस्पति-निश्चय से बचता है।
- source_word: וְטָבַל
  choice: डुबोए
  rationale: क्रिया किसी वस्तु को द्रव में डुबाने का बोध देती है और अनुष्ठानिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: אוֹתָם
  choice: उन वस्तुओं
  rationale: पुल्लिंग बहुवचन सर्वनाम पिछली सूची की अनुष्ठानिक सामग्रियों की ओर संकेत करता है; हिन्दी में संदर्भ स्पष्ट करने के लिए संज्ञा जोड़ी गई है।
- source_word: בְּדַם
  choice: लहू में
  rationale: पूर्वसर्ग उस द्रव को चिह्नित करता है जिसमें वस्तुओं को डुबोया जाता है।
- source_word: הַצִּפֹּר הַשְּׁחֻטָה
  choice: जिस पक्षी को वध किया गया था
  rationale: שׁחט अनुष्ठानिक ढंग से मारने के लिए प्रयुक्त मानक क्रिया है; 'वध' उसके सांस्कारिक भाव को सुरक्षित रखता है।
- source_word: עַל הַמַּיִם הַחַיִּים
  choice: बहते पानी के ऊपर
  rationale: शाब्दिक अर्थ 'जीवित पानी' है, जिसका इस प्रसंग में आशय ताज़े अथवा प्रवाहित जल से है; 'बहता पानी' हिन्दी में उस वास्तविक अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: מַיִם חַיִּים का अनुष्ठानिक अर्थ
  choice: बहता पानी
  alternative: जीवित पानी; ताज़ा पानी
  rationale: यहाँ पदबंध ठहरे हुए जल के विपरीत ताज़े या प्रवाहित जल को सूचित करता है। मुख्य पाठ में स्वाभाविक अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है, जिससे बाद के धर्मवैज्ञानिक अर्थ अनजाने में आरोपित न हों।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट विधिक-अनुष्ठानिक शैली रखी गई है। सूची और क्रियाक्रम इब्रानी वाक्य के अनुरूप हैं; जहाँ सर्वनाम हिन्दी में अस्पष्ट हो सकता था, वहाँ 'उन वस्तुओं' कहा गया है।
