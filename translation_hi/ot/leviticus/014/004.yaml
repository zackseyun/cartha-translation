base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/004.yaml
  text: Then the priest shall command that two live clean birds[a], cedar wood, scarlet yarn[b], and hyssop be taken for the one being cleansed.
translation:
  language: hi
  text: तब याजक आज्ञा दे कि शुद्ध किए जा रहे व्यक्ति के लिए दो जीवित और शुद्ध पक्षी, देवदार की लकड़ी, किरमिज़ी रंग का सूत[a] और जूफ़ा[b] लिए जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘किरमिज़ी रंग का धागा।’ इब्रानी पद שְׁנִי תוֹלַעַת किरमिज़ी रंग से रंगी सामग्री को दर्शाता है; सामग्री का सटीक रूप निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: ‘जूफ़ा’ से अभिप्रेत पौधे की सटीक पहचान अनिश्चित है; यहाँ पारंपरिक नाम रखा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה
  choice: तब याजक आज्ञा दे
  rationale: विधि-संबंधी क्रम में वाव के साथ यह क्रिया अगले चरण को आगे बढ़ाती है; ‘तब’ क्रम को स्वाभाविक रूप से व्यक्त करता है और ‘आज्ञा दे’ याजक की भूमिका बनाए रखता है।
- source_word: וְלָקַח
  choice: लिए जाएँ
  rationale: रूप की दृष्टि से क्रिया एकवचन है, पर याजक की आज्ञा के बाद इसका प्रयोग सामग्री मँगाने या लेने के निर्देश के रूप में है। हिंदी में कर्मवाच्य बहुवचन पूरी सूची को स्वाभाविक रूप से समेटता है और यह नहीं जताता कि याजक स्वयं वस्तुएँ उठाता है।
- source_word: לַמִּטַּהֵר
  choice: शुद्ध किए जा रहे व्यक्ति के लिए
  rationale: हित्पएल कृदंत शुद्धिकरण की प्रक्रिया से गुजर रहे व्यक्ति को दर्शाता है; यह अनुवाद उस जारी प्रक्रिया और कर्मवाच्य भाव को सुरक्षित रखता है।
- source_word: שְׁתֵּי צִפֳּרִים
  choice: दो ... पक्षी
  rationale: צִפּוֹר पक्षी के लिए सामान्य शब्द है; इसे किसी विशेष जाति, जैसे गौरैया, तक सीमित नहीं किया गया।
- source_word: חַיּוֹת טְהֹרוֹת
  choice: जीवित और शुद्ध
  rationale: दोनों विशेषण पक्षियों का वर्णन करते हैं। ‘शुद्ध’ लैव्यव्यवस्था के अनुष्ठानिक संदर्भ में טָהוֹר का प्रचलित और संक्षिप्त समतुल्य है।
- source_word: עֵץ אֶרֶז
  choice: देवदार की लकड़ी
  rationale: समास-पद अनुष्ठान में प्रयुक्त देवदार की लकड़ी या सामग्री को दर्शाता है; हिंदी में यह स्पष्ट और स्वाभाविक अभिव्यक्ति है।
- source_word: שְׁנִי תוֹלַעַת
  choice: लाल रंग का सूत
  rationale: यह पद कीट-जनित गहरे लाल रंग से रंगी सामग्री को दर्शाता है। ‘सूत’ आधुनिक पाठक के लिए अनुष्ठान में प्रयुक्त रेशेदार सामग्री का सहज संकेत देता है, जबकि सटीक रूप अनिश्चित है।
- source_word: אֵזֹב
  choice: जूफ़ा
  rationale: बाइबलीय अनुष्ठानिक संदर्भों में यह पारंपरिक नाम प्रचलित है; वनस्पति की निश्चित पहचान विवादित होने के कारण अधिक विशिष्ट आधुनिक पौधे का नाम नहीं चुना गया।
