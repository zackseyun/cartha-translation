source:
  edition: WLC
  text: וְ/צִוָּה֙ הַ/כֹּהֵ֔ן וְ/שָׁחַ֖ט אֶת הַ/צִּפּ֣וֹר הָ/אֶחָ֑ת אֶל כְּלִי חֶ֖רֶשׂ עַל מַ֥יִם חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/005.yaml
  text: Then the priest shall command that one bird be slaughtered over an earthenware vessel containing fresh water[a].
translation:
  language: hi
  text: तब याजक आज्ञा दे कि एक पक्षी का उस मिट्टी के पात्र के ऊपर वध किया जाए, जिसमें ताज़ा पानी भरा हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जीवित जल”; अर्थात बहता या ताज़ा पानी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: तब ... आज्ञा दे
  rationale: वाव के साथ पूर्ण क्रिया विधिक प्रक्रिया में क्रम और निर्देश का भाव रखती है; ‘तब’ क्रम को और ‘आज्ञा दे’ याजक के अधिकार को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: उपासना-विधि के संदर्भ में כֹּהֵן का मानक और सहज हिंदी रूप।
- source_word: וְשָׁחַט
  choice: काटा जाए
  rationale: रूपतः क्रिया कर्तृवाच्य है, पर ‘आज्ञा दे’ के अधीन हिंदी में कर्मवाच्य निर्देश स्वाभाविक है। ‘काटा जाए’ अनुष्ठानिक वध को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: אֶת הַצִּפּוֹר הָאֶחָת
  choice: एक पक्षी
  rationale: संदर्भ में पहले बताए गए दो पक्षियों में से एक को सूचित करता है; हिंदी में यह संक्षिप्त और स्वाभाविक है।
- source_word: כְּלִי חֶרֶשׂ
  choice: मिट्टी का पात्र
  rationale: मिट्टी अथवा मृद्भांड से बने पात्र का स्पष्ट, वर्तमान और गरिमापूर्ण हिंदी रूप।
- source_word: עַל מַיִם חַיִּים
  choice: ताज़े पानी से भरे
  rationale: शाब्दिक अर्थ ‘जीवित पानी’ है, अर्थात स्रोत से आया ताज़ा या बहता पानी। पात्र के साथ संबंध को हिंदी में स्पष्ट करने के लिए ‘से भरे’ प्रयुक्त है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: מַיִם חַיִּים का अनुष्ठानिक अर्थ
  choice: ताज़ा पानी
  alternative: जीवित पानी; बहता पानी
  rationale: यहाँ पदबंध शुद्धिकरण-विधि में गैर-ठहरे, स्रोत से आए पानी को दर्शाता है; बाद की धर्मवैज्ञानिक प्रतीकात्मकता को पाठ में आरोपित नहीं किया गया। शाब्दिक और संभावित अर्थ पादटिप्पणी में रखे गए हैं।
- issue: אֶל और עַל से व्यक्त पक्षी, पात्र और पानी का संबंध
  choice: पक्षी को ताज़े पानी से भरे पात्र के ऊपर काटा जाए
  alternative: पक्षी को मिट्टी के पात्र में, ताज़े पानी के ऊपर काटा जाए
  rationale: इब्रानी पूर्वसर्गों का संयोजन संक्षिप्त है। मुख्य अनुष्ठानिक दृश्य—रक्त का पानी वाले मिट्टी के पात्र में गिरना—स्वाभाविक हिंदी में व्यक्त किया गया है, बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण विधिक-अनुष्ठानिक शैली अपनाई गई है। ‘याजक’, ‘पात्र’ और ‘आज्ञा दे’ पारंपरिक स्पष्टता रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सरल है।
