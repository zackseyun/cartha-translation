reference: Leviticus 14:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתַ֨ן הַ/כֹּהֵ֜ן מִן הַ/שֶּׁ֣מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַל מְק֖וֹם דַּ֥ם הָ/אָשָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/028.yaml
  text: And the priest shall put some of the oil that is on his palm on the lobe of the right ear of the one being cleansed[a], and on the thumb of his right hand, and on the big toe of his right foot, on the place of the guilt-offering blood.
translation:
  language: hi
  text: और याजक अपनी हथेली पर रखे तेल में से कुछ शुद्ध किए जा रहे व्यक्ति के दाहिने कान की लौ पर, उसके दाहिने हाथ के अंगूठे पर और उसके दाहिने पैर के अंगूठे पर लगाए—उस स्थान पर जहाँ दोषबलि का लहू लगाया गया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दोषबलि के लहू के स्थान पर।”
    reason: मूल इब्रानी का संक्षिप्त स्थानवाचक पद प्रसंगानुसार उस स्थान को सूचित करता है जहाँ पहले दोषबलि का लहू लगाया गया था।
lexical_decisions:
- source_word: וְנָתַן
  choice: लगाए
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है, पर इस अनुष्ठानिक प्रसंग में शरीर के अंगों पर तेल लगाने के लिए ‘लगाए’ स्वाभाविक और सटीक है।
- source_word: מִן הַשֶּׁמֶן
  choice: तेल में से कुछ
  rationale: מִן यहाँ अंशसूचक है; इससे स्पष्ट होता है कि हथेली पर रखे तेल का कुछ भाग लगाया जाता है।
- source_word: אֲשֶׁר עַל כַּפּוֹ
  choice: अपनी हथेली पर के
  rationale: כַּף यहाँ याजक की हथेली को दर्शाता है; ‘अपनी’ का संबंध वाक्य के कर्ता याजक से स्वाभाविक रूप से जुड़ता है।
- source_word: תְּנוּךְ אֹזֶן
  choice: कान की लौ
  rationale: याजकीय अनुष्ठान के इस प्रसंग में תְּנוּךְ कान की लौ को सूचित करता है; यह आधुनिक हिन्दी में स्पष्ट शारीरिक पद है।
- source_word: הַמִּטַּהֵר
  choice: शुद्ध किए जा रहे व्यक्ति
  rationale: हित्पएल कृदंत अनुष्ठानिक शुद्धि की प्रक्रिया से गुजर रहे व्यक्ति को दर्शाता है; यह अनुवाद उस प्रक्रियात्मक भाव को बनाए रखता है।
- source_word: הַיְמָנִית
  choice: दाहिने
  rationale: शरीर के प्रत्येक संबंधित अंग के लिए मानक और स्वाभाविक हिन्दी विशेषण।
- source_word: בֹּהֶן יָדוֹ
  choice: उसके दाहिने हाथ के अंगूठे
  rationale: हाथ के संदर्भ में בֹּהֶן का सटीक हिन्दी रूप ‘अंगूठा’ है।
- source_word: בֹּהֶן רַגְלוֹ
  choice: उसके दाहिने पैर के अंगूठे
  rationale: पैर के संदर्भ में בֹּהֶן बड़े अंगूठे को दर्शाता है; हिन्दी में ‘पैर का अंगूठा’ सामान्य और स्पष्ट अभिव्यक्ति है।
- source_word: עַל מְקוֹם דַּם הָאָשָׁם
  choice: दोषबलि के लहू के स्थान पर
  rationale: यह अपेक्षाकृत औपचारिक रूप से उस स्थान को बनाए रखता है जहाँ पहले दोषबलि का लहू लगाया गया था, बिना मुख्य पाठ में निहित क्रिया को अत्यधिक स्पष्ट किए।
theological_decisions:
- issue: אָשָׁם का अनुवाद
  choice: दोषबलि
  alternative: क्षतिपूर्ति-बलि
  rationale: लैव्यव्यवस्था के बलिदानी संदर्भ में ‘दोषबलि’ परिचित और पर्याप्त रूप से सटीक पद है। אָשָׁם में दोष तथा क्षतिपूर्ति, दोनों की अर्थछाया हो सकती है; वैकल्पिक पद को मुख्य पाठ में थोपना आवश्यक नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लहू’ और ‘दोषबलि’ जैसे पद लैव्यव्यवस्था के अनुष्ठानिक स्वर को बनाए रखते हैं। विराम-चिह्न अंतिम स्थान-सूचक वाक्यांश को तेल लगाए जाने के तीनों अंगों से जोड़ता है।
