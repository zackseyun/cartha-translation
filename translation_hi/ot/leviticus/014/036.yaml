base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/036.yaml
  text: Then the priest shall command that they empty the house before the priest goes in to inspect the diseased area[a], so that everything in the house may not become unclean; and afterward the priest shall go in to inspect the house.
translation:
  language: hi
  text: तब याजक आज्ञा दे कि याजक उस प्रभावित स्थान[a] का निरीक्षण करने के लिए घर में प्रवेश करे, उससे पहले घर खाली कर दिया जाए, जिससे घर में जो कुछ है वह अशुद्ध न हो जाए। इसके बाद याजक घर का निरीक्षण करने के लिए भीतर जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चिह्न’, ‘संक्रमण’, या परंपरागत रूप से ‘विपत्ति’। इब्रानी नेगा उस प्रभावित चिह्न, स्थान या दशा को बताता है जिसका याजक निरीक्षण करता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוָּה
  choice: तब ... आज्ञा दे
  rationale: विधिक क्रम में वाव-संयुक्त पूर्ण क्रिया अगले निर्देश को व्यक्त करती है; ‘तब’ चरणबद्ध क्रम को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: וּפִנּוּ אֶת־הַבַּיִת
  choice: घर खाली कर दिया जाए
  rationale: बहुवचन क्रिया का कर्ता अनिश्चित है। हिंदी में कर्मवाच्य आज्ञा उस अनिश्चित कर्ता को अनावश्यक रूप से जोड़े बिना घर की वस्तुएँ हटाने का आशय देता है।
- source_word: לִרְאוֹת
  choice: निरीक्षण करने के लिए
  rationale: मूल अर्थ ‘देखना’ है, किंतु याजकीय जाँच के इस विधिक संदर्भ में ‘निरीक्षण’ अधिक सटीक और स्वाभाविक है।
- source_word: הַנֶּגַע
  choice: प्रभावित स्थान
  rationale: נֶגַע यहाँ जाँच के अधीन दिखाई देने वाले प्रभावित चिह्न, स्थान या दशा को सूचित करता है; ‘प्रभावित स्थान’ आधुनिक रोग-निदान को थोपे बिना व्यापकता बनाए रखता है।
- source_word: וְלֹא יִטְמָא
  choice: ताकि ... अशुद्ध न हो जाए
  rationale: यह घर खाली कराने का निवारक उद्देश्य बताता है। ‘अशुद्ध’ लैव्यव्यवस्था की अनुष्ठानिक शुद्धता की शब्दावली को नैतिक दोष बनाए बिना व्यक्त करता है।
- source_word: כָּל־אֲשֶׁר בַּבָּיִת
  choice: घर में जो कुछ है
  rationale: यह घर की सारी सामग्री को समावेशी और सहज हिंदी में व्यक्त करता है।
- source_word: וְאַחַר כֵּן
  choice: इसके बाद
  rationale: अगले विधिक चरण को स्पष्ट और स्वाभाविक रूप से चिह्नित करता है।
theological_decisions:
- issue: अनुष्ठानिक अशुद्धता की शब्दावली
  choice: अशुद्ध हो जाए
  alternative: अपवित्र हो जाए
  rationale: טמא इस प्रसंग में मुख्यतः अनुष्ठानिक स्थिति को दर्शाता है, नैतिक दोष को नहीं। ‘अशुद्ध’ प्रचलित, स्पष्ट और अपेक्षाकृत तटस्थ है।
- issue: נֶגַע की प्रकृति
  choice: प्रभावित स्थान
  alternative: रोगग्रस्त स्थान / संक्रमण / विपत्ति
  rationale: इब्रानी शब्द दिखाई देने वाले प्रभावित चिह्न अथवा दशा के लिए व्यापक है। अनिश्चित कारण को किसी आधुनिक रोग या संक्रमण के रूप में निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट विधिक शैली रखी गई है। ‘याजक’ और ‘अशुद्ध’ जैसे परिचित बाइबिलीय शब्द बनाए गए हैं, जबकि वाक्य-संरचना साधारण पाठक के लिए स्वाभाविक रखी गई है।
