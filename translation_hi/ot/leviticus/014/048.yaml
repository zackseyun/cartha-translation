base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/048.yaml
  text: But if the priest comes in and looks[a], and behold, the disease has not spread in the house after the house was plastered, then the priest shall pronounce the house clean[b], because the disease is healed.
translation:
  language: hi
  text: परन्तु यदि याजक भीतर आकर देखे कि घर पर पलस्तर किए जाने के बाद वह व्याधि[a] घर में नहीं फैली है, तो याजक उस घर को शुद्ध ठहराए, क्योंकि वह व्याधि ठीक हो गई है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ ‘व्याधि,’ ‘प्रकोप’ या ‘प्रभावित दशा’ हो सकता है; यहाँ यह घर को प्रभावित करने वाले विकार के लिए है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘चंगी हो गई है।’ इब्रानी में घर की व्याधि के मिट जाने के लिए उपचार की भाषा प्रयुक्त हुई है।
    reason: metaphor
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछली स्थिति के विपरीत वैकल्पिक दशा प्रस्तुत करता है; ‘परन्तु यदि’ इस विधिक क्रम और विरोध दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֹּא יָבֹא
  choice: भीतर आकर
  rationale: मूल में infinitive absolute के साथ क्रिया आने की क्रिया पर बल देती है। यहाँ आशय निरीक्षण के लिए घर में प्रवेश करना है; हिन्दी में ‘भीतर आकर’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְרָאָה
  choice: देखे
  rationale: मूल क्रिया सामान्यतः ‘देखना’ है। सन्दर्भ में निरीक्षण निहित है, पर ‘जाँच करे’ कहने से अधिक व्याख्या जुड़ जाती।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह निरीक्षण के परिणाम की ओर ध्यान खींचने वाला इब्रानी संकेतक है; इसे हटाने के बजाय स्वाभाविक, किंचित औपचारिक हिन्दी में सुरक्षित रखा गया है।
- source_word: לֹא פָשָׂה
  choice: नहीं फैली है
  rationale: पशׂה इस प्रसंग में व्याधि के आगे फैलने को दर्शाता है।
- source_word: הַנֶּגַע
  choice: वह व्याधि
  rationale: נגע किसी प्रहार, पीड़ादायक विकार या प्रभावित दशा को सूचित कर सकता है। ‘व्याधि’ घर से सम्बद्ध असामान्य प्रयोग और आगे आने वाली ‘ठीक हो गई’ की उपचार-रूपक भाषा दोनों को बनाए रखता है, जबकि ‘महामारी’ भ्रामक होता।
- source_word: אַחֲרֵי הִטֹּחַ אֶת־הַבָּיִת
  choice: घर पर पलस्तर किए जाने के बाद
  rationale: טוח घर पर लेप या पलस्तर करने की मरम्मत-क्रिया है। कर्मवाच्य रूप उचित है क्योंकि कर्ता पर बल नहीं है।
- source_word: וְטִהַר הַכֹּהֵן אֶת־הַבָּיִת
  choice: याजक उस घर को शुद्ध ठहराए
  rationale: याजकीय शुद्धता के विधिक सन्दर्भ में טהר यहाँ स्वयं भौतिक सफाई करने से अधिक घर की शुद्ध दशा निर्धारित या घोषित करने को व्यक्त करता है।
- source_word: כִּי נִרְפָּא הַנָּגַע
  choice: क्योंकि वह व्याधि ठीक हो गई है
  rationale: נרפא का मूल अर्थ ‘चंगी/ठीक हो गई’ है। घर की व्याधि के लिए प्रयुक्त उपचार-रूपक को सपाट करके केवल ‘समाप्त हो गई’ नहीं किया गया।
theological_decisions:
- issue: וְטִהַר में अनुष्ठानिक घोषणा या भौतिक शुद्धिकरण
  choice: याजक उस घर को शुद्ध ठहराए
  alternative: याजक उस घर को शुद्ध करे
  rationale: इस चरण पर उपचारात्मक काम पहले हो चुका है और याजक निरीक्षण के बाद घर की शुद्ध स्थिति निर्धारित करता है। ‘शुद्ध ठहराए’ उसके याजकीय-विधिक कार्य को व्यक्त करता है, पर क्रिया को केवल मौखिक घोषणा तक अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘याजक,’ ‘पलस्तर,’ और ‘शुद्ध ठहराए’ लैव्यव्यवस्था के विधिक-अनुष्ठानिक प्रसंग के अनुकूल हैं। ‘और देखो’ मूल के ध्यानाकर्षक संकेत को सुरक्षित रखते हुए पद की औपचारिक लय बनाए रखता है।
