id: LEV.14.51
reference: Leviticus 14:51
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לָקַ֣ח אֶת עֵֽץ הָ֠/אֶרֶז וְ/אֶת הָ֨/אֵזֹ֜ב וְ/אֵ֣ת שְׁנִ֣י הַ/תּוֹלַ֗עַת וְ/אֵת֮ הַ/צִּפֹּ֣ר הַֽ/חַיָּה֒ וְ/טָבַ֣ל אֹתָ֗/ם בְּ/דַם֙ הַ/צִּפֹּ֣ר הַ/שְּׁחוּטָ֔ה וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וְ/הִזָּ֥ה אֶל הַ/בַּ֖יִת שֶׁ֥בַע פְּעָמִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/051.yaml
  text: Then he shall take the cedar wood[a], the hyssop, the scarlet yarn, and the living bird, and dip them in the blood of the slaughtered bird and in the fresh water[b], and sprinkle the house seven times.
translation:
  language: hi
  text: फिर वह देवदार की लकड़ी, जूफा, लाल रंग का सूत[a] और जीवित पक्षी ले और उन सबको वध किए हुए पक्षी के लहू और ताजे जल[b] में डुबोए; फिर घर पर सात बार छिड़के।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “कृमि का लाल रंग”; परंपरागत रूप से इसका अर्थ लाल रंगा हुआ धागा या सूत समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “जीवित जल,” अर्थात ताजा या बहता हुआ जल।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: फिर वह ... ले
  rationale: विधिक अनुष्ठान के क्रम में संयोजित पूर्ण क्रिया अगले निर्देश को व्यक्त करती है; हिंदी में “फिर ... ले” स्वाभाविक और निर्देशात्मक है।
- source_word: עֵץ הָאֶרֶז
  choice: देवदार की लकड़ी
  rationale: यह रचनात्मक पद अनुष्ठान में प्रयुक्त देवदार की लकड़ी को सूचित करता है; यह हिंदी में स्पष्ट और स्रोत के निकट है।
- source_word: הָאֵזֹב
  choice: जूफा
  rationale: אֵזוֹב के लिए प्रचलित बाइबलीय वनस्पति-नाम रखा गया है; स्रोत से अधिक विशिष्ट पहचान आरोपित नहीं की गई।
- source_word: שְׁנִי הַתּוֹלַעַת
  choice: लाल रंग का सूत
  rationale: पद का शाब्दिक रूप कृमि से प्राप्त लाल रंग की ओर संकेत करता है, जबकि अनुष्ठानिक वस्तु को परंपरागत रूप से लाल रंगे धागे या सूत के रूप में समझा जाता है; मुख्य पाठ में सहज हिंदी और पादटिप्पणी में शाब्दिक सूचना दी गई है।
- source_word: הַצִּפֹּר הַחַיָּה
  choice: जीवित पक्षी
  rationale: यह विशेषण इस पक्षी को वध किए हुए पक्षी से स्पष्ट रूप से अलग करता है।
- source_word: וְטָבַל אֹתָם
  choice: उन सबको ... डुबोए
  rationale: बहुवचन सर्वनाम सभी पहले बताई गई वस्तुओं को समेटता है; “डुबोए” טבל की अनुष्ठानिक क्रिया को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְּדַם הַצִּפֹּר הַשְּׁחוּטָה
  choice: वध किए हुए पक्षी के लहू में
  rationale: שׁחט सामान्य हत्या नहीं, विधिपूर्वक वध को दर्शाता है; “लहू” अनुष्ठानिक संदर्भ में गरिमापूर्ण और स्पष्ट है।
- source_word: וּבַמַּיִם הַחַיִּים
  choice: और ताजे जल में
  rationale: शाब्दिक अर्थ “जीवित जल” है और मुहावरा ताजे अथवा बहते स्रोत के जल को दर्शाता है; मुख्य पाठ में संदर्भगत अर्थ और पादटिप्पणी में शाब्दिक रूप सुरक्षित रखा गया है।
- source_word: וְהִזָּה אֶל הַבַּיִת
  choice: फिर घर पर ... छिड़के
  rationale: हिफ़िल रूप अनुष्ठानिक छिड़काव बताता है; אֶל के लक्ष्यबोध को “घर पर” स्वाभाविक हिंदी में बनाए रखता है।
- source_word: שֶׁבַע פְּעָמִים
  choice: सात बार
  rationale: संख्यात्मक क्रियाविशेषण का सीधा और पूर्ण अनुवाद।
theological_decisions:
- issue: अनुष्ठानिक विधान में מַיִם חַיִּים का अनुवाद
  choice: ताजा जल
  alternative: जीवित जल; बहता जल
  rationale: इब्रानी मुहावरा किसी ताजे या प्रवाहित स्रोत के जल की ओर संकेत करता है। “ताजा जल” इस विधिक संदर्भ में सामान्य पाठक को आशय बताता है और बाद के धर्मवैचारिक अर्थ अनावश्यक रूप से आरोपित नहीं करता; शाब्दिक और अधिक विशिष्ट विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और निर्देशात्मक रूप अपनाया गया है। अनुष्ठान के क्रम को “फिर” से स्पष्ट किया गया है। तकनीकी शब्दावली को अनावश्यक रूप से कठिन बनाए बिना “वध,” “लहू” और “छिड़के” जैसे संदर्भानुकूल शब्द रखे गए हैं। दोनों पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद मुख्य पाठ में उपस्थित हैं।
