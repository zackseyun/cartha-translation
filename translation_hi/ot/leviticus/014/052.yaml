id: LEV.14.52
reference: Leviticus 14:52
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/חִטֵּ֣א אֶת הַ/בַּ֔יִת בְּ/דַם֙ הַ/צִּפּ֔וֹר וּ/בַ/מַּ֖יִם הַֽ/חַיִּ֑ים וּ/בַ/צִּפֹּ֣ר הַ/חַיָּ֗ה וּ/בְ/עֵ֥ץ הָ/אֶ֛רֶז וּ/בָ/אֵזֹ֖ב וּ/בִ/שְׁנִ֥י הַ/תּוֹלָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/052.yaml
  text: Thus he shall cleanse the house with the blood of the bird[a], with the living water, with the live bird, with cedar wood, with hyssop[b], and with scarlet yarn.
translation:
  language: hi
  text: और वह चिड़िया के लहू, जीवित जल[a], जीवित चिड़िया, देवदार की लकड़ी, जूफा और किरमिज़ी सूत[b] से उस घर को शुद्ध करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ताज़ा जल” अथवा “बहता जल”; इब्रानी में शाब्दिक रूप से “जीवित जल,” अर्थात ताज़े, बहते स्रोत का जल।
    reason: lexical_alternative
  - marker: b
    text: या “किरमिज़ी धागा।” इब्रानी अभिव्यक्ति शुद्धि-विधि में प्रयुक्त किरमिज़ी रंग में रंगी सामग्री को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִטֵּא
  choice: और वह…शुद्ध करे
  rationale: पिएल रूप यहाँ पाप कराने का नहीं, बल्कि विधिपूर्वक अशुद्धता दूर करके शुद्ध करने का अर्थ देता है। आरंभ का ‘और’ इब्रानी संयोजक को बनाए रखता है।
- source_word: הַבַּיִת
  choice: उस घर को
  rationale: संदर्भ में वही भौतिक घर है जिसकी शुद्धि की जा रही है; निश्चित उपपद को हिंदी में ‘उस’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּדַם הַצִּפּוֹר
  choice: चिड़िया के लहू…से
  rationale: בְ यहाँ शुद्धि के साधन को सूचित करता है। ‘लहू’ विधिक और बाइबलीय संदर्भ में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: וּבַמַּיִם הַחַיִּים
  choice: जीवित जल
  rationale: शाब्दिक अभिव्यक्ति को बनाए रखा गया है ताकि विधिक पदावली और उसकी व्यापक बाइबलीय प्रतिध्वनि सुरक्षित रहे; पादटिप्पणी इसका मुहावरेदार अर्थ स्पष्ट करती है।
- source_word: וּבַצִּפֹּר הַחַיָּה
  choice: जीवित चिड़िया
  rationale: यह उस दूसरी चिड़िया से स्पष्ट भेद रखता है जिसका लहू इस्तेमाल हुआ था।
- source_word: וּבְעֵץ הָאֶרֶז
  choice: देवदार की लकड़ी
  rationale: עֵץ यहाँ वृक्ष नहीं, विधि में प्रयुक्त उस प्रजाति की लकड़ी को दर्शाता है।
- source_word: וּבָאֵזֹב
  choice: जूफा
  rationale: वनस्पति की ठीक पहचान विवादित है; ‘जूफा’ प्रचलित बाइबलीय नाम है और अनावश्यक वनस्पति-निर्धारण से बचता है।
- source_word: וּבִשְׁנִי הַתּוֹלָעַת
  choice: किरमिज़ी सूत
  rationale: अभिव्यक्ति किरमिज़ी रंग में रंगी विधिक सामग्री को दर्शाती है; ‘सूत’ संभावित धागे/ऊन जैसे पदार्थ को सहज हिंदी में व्यक्त करता है।
