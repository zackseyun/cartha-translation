  register: भाषा आधुनिक मानक हिंदी में विधिक-अनुष्ठानिक गरिमा बनाए रखती है। तकनीकी बलिदानी शब्दावली के लिए ‘अन्नबलि’ और प्राचीन मापों के लिए ‘एपा’ तथा ‘लोग’ सुरक्षित रखे गए हैं; ‘लोग’ की व्याख्या पाद-टिप्पणी में दी गई है।
