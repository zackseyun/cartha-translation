source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִקַּ֤ח שְׁנֵֽי כְבָשִׂים֙ תְּמִימִ֔ים וְ/כַבְשָׂ֥ה אַחַ֛ת בַּת שְׁנָתָ֖/הּ תְּמִימָ֑ה וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן וְ/לֹ֥ג אֶחָ֖ד שָֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/010.yaml
  text: And on the eighth day he shall take two male lambs without blemish[a], and one ewe lamb a year old without blemish, and three-tenths of an ephah of fine flour as a grain offering mixed with oil, and one log of oil.
translation:
  language: hi
  text: और आठवें दिन वह दो दोषरहित नर मेमने, एक वर्ष की एक दोषरहित मादा मेमनी, अन्नबलि के लिए तेल से मिला हुआ एपा के तीन दसवें भाग महीन आटा, और एक लोग तेल[a] ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लोग’ इस्राएली अनुष्ठानों में प्रयुक्त एक छोटी तरल माप थी।
    reason: cultural_note
lexical_decisions:
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: और आठवें दिन
  rationale: संयोजक और समय-सूचक पद को बनाए रखते हुए अनुष्ठान की क्रमिक प्रक्रिया व्यक्त होती है।
- source_word: יִקַּח
  choice: वह ... ले
  rationale: यह अपूर्ण क्रिया विधिक निर्देश का कार्य करती है; हिंदी में संभावनार्थक रूप संक्षिप्त और आदेशात्मक बल बनाए रखता है।
- source_word: שְׁנֵי כְבָשִׂים
  choice: दो ... नर मेमने
  rationale: पुल्लिंग रूप को स्पष्ट करना आवश्यक है, क्योंकि इसके बाद अलग से मादा मेमनी का उल्लेख है।
- source_word: תְּמִימִים / תְּמִימָה
  choice: निर्दोष
  rationale: बलि के पशुओं के संदर्भ में इसका अर्थ शारीरिक दोष से रहित होना है; ‘निर्दोष’ प्रचलित, संक्षिप्त और गरिमापूर्ण धार्मिक पद है।
- source_word: וְכַבְשָׂה אַחַת בַּת שְׁנָתָהּ
  choice: एक वर्ष की एक ... मादा मेमनी
  rationale: मूल में दिए गए लिंग और आयु—दोनों विनिर्देशों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: וּשְׁלֹשָׁה עֶשְׂרֹנִים
  choice: तीन-दसवाँ एपा
  rationale: עִשָּׂרוֹן एपा के दसवें भाग की माप है; स्रोत की मात्रा को आधुनिक अनुमान में बदले बिना व्यक्त किया गया है।
- source_word: סֹלֶת מִנְחָה
  choice: अन्नबलि के लिए ... महीन आटा
  rationale: סֹלֶת बारीक पिसे आटे और מִנְחָה यहाँ अनाज-आधारित बलि को दर्शाता है; हिंदी में ‘अन्नबलि’ संक्षिप्त और स्पष्ट है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: तेल में मिला हुआ
  rationale: आटे के तेल के साथ मिश्रित होने की अवस्था को सहज हिंदी में व्यक्त करता है।
- source_word: וְלֹג אֶחָד שָׁמֶן
  choice: एक लोग तेल
  rationale: לֹג एक विशिष्ट प्राचीन तरल माप है; किसी अनिश्चित आधुनिक पात्र या मात्रा से बदलने के बजाय नाम का लिप्यंतरण किया गया है।
