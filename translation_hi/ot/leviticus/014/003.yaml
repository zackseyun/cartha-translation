  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יָצָא֙ הַ/כֹּהֵ֔ן אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה נִרְפָּ֥א נֶֽגַע הַ/צָּרַ֖עַת מִן הַ/צָּרֽוּעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/003.yaml
  text: The priest shall go out to a place outside the camp[a], and the priest shall examine him; and behold, the disease of leprosy has been healed in the one with the skin disease,
translation:
  language: hi
  text: याजक छावनी के बाहर जाएगा, और याजक उसकी जाँच करेगा; और देखे, चर्मरोग[a] का घाव उस चर्मरोग-पीड़ित व्यक्ति से दूर हो गया है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “कोढ़ का घाव कोढ़ी से दूर हो गया है।” यहाँ प्रयुक्त इब्रानी शब्द केवल आधुनिक कुष्ठ रोग नहीं, बल्कि अधिक व्यापक प्रकार के चर्मरोग या त्वचा-विकार को सूचित कर सकते हैं।'
    reason: पारंपरिक शब्दावली से परिचय बनाए रखते हुए इब्रानी צָרַעַת / צָרוּעַ की व्यापक अर्थ-सीमा स्पष्ट करना।
lexical_decisions:
- source_word: וְיָצָא
  choice: जाएगा
  rationale: विधिक प्रक्रिया में संयोजक सहित पूर्ण क्रिया निर्धारित आगामी कार्य को व्यक्त करती है; हिन्दी में साधारण भविष्य स्वाभाविक है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के उपासना-विधिक संदर्भ में כֹּהֵן का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: दिशा और बाहरी स्थान दोनों का स्वाभाविक हिन्दी में संक्षिप्त निरूपण।
- source_word: וְרָאָה
  choice: जाँच करेगा / देखे
  rationale: ראה का मूल अर्थ ‘देखना’ है, पर इस निरीक्षण-विधि में वह जाँचने का भाव रखता है; वाक्य में दोनों पक्ष स्वाभाविक रूप से व्यक्त किए गए हैं।
- source_word: וְהִנֵּה
  choice: यदि ... देखे कि
  rationale: हिब्रू में यह निरीक्षण से सामने आई स्थिति प्रस्तुत करता है। हिन्दी विधिक गद्य में ‘यदि ... देखे कि’ उसका कार्यात्मक अर्थ स्वाभाविक ढंग से देता है।
- source_word: נִרְפָּא
  choice: अच्छा हो गया है
  rationale: निफ़अल का परिणामसूचक भाव है—निरीक्षण के समय घाव स्वस्थ पाया गया है। यह सामान्य हिन्दी में ‘चंगा किया गया’ से अधिक स्वाभाविक है।
- source_word: נֶגַע הַצָּרַעַת
  choice: चर्मरोग का घाव
  rationale: נגע किसी घाव, चिह्न या विकार को और צרעת व्यापक त्वचा-संबंधी अशुद्धिकारक दशा को सूचित करता है; यह रूप आधुनिक कुष्ठ रोग से अनावश्यक समानता नहीं करता।
- source_word: מִן הַצָּרוּעַ
  choice: चर्मरोग से पीड़ित व्यक्ति में से
  rationale: מן के अलगाव अथवा हट जाने के भाव को बनाए रखते हुए पीड़ित व्यक्ति का अर्थ स्पष्ट किया गया है।
theological_decisions:
- issue: צָרַעַת / צָרוּעַ का अनुवाद
  choice: चर्मरोग / चर्मरोग से पीड़ित व्यक्ति
  alternative: कोढ़ / कोढ़ी
  rationale: बाइबिलीय צרעת आधुनिक हैन्सन रोग तक सीमित नहीं है, बल्कि त्वचा की अनेक अशुद्धिकारक दशाओं को समेट सकती है। व्यापक शब्द चिकित्सा-संबंधी अनैतिहासिक दावा करने से बचाता है।
- issue: וְהִנֵּה की प्रस्तुति
  choice: यदि याजक देखे कि
  alternative: और देखो
  rationale: ‘और देखो’ अधिक शाब्दिक है, पर यहाँ निरीक्षण के परिणामस्वरूप पाई गई दशा को प्रस्तुत किया गया है। प्रक्रियात्मक हिन्दी में शर्तात्मक रूप अर्थ को बिना अतिरिक्त व्याख्या के स्पष्ट करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘याजक’ और ‘छावनी’ जैसे स्थापित बाइबिलीय शब्द रखे गए हैं। हिब्रू में ‘याजक’ की पुनरावृत्ति को हिन्दी में स्पष्टता के लिए बनाए रखा गया है; पद के अंत का अल्पविराम अगले पद में जारी वाक्य को दर्शाता है।
