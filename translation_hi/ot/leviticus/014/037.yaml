translation:
  language: hi
  text: वह उस प्रभावित स्थान की जाँच करे। यदि घर की दीवारों में हरियाहट या लालिमा लिए धँसे हुए धब्बे[a] हों और वे दीवार की सतह से नीचे दिखाई दें[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गड्ढेनुमा चिह्न।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “उनका रूप दीवार से नीचा हो”; अर्थात वे दीवार की सतह के भीतर धँसे हुए दिखाई दें।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: जाँच करे
  rationale: याजकीय निरीक्षण की इस विधिक प्रक्रिया में क्रिया का अर्थ केवल ‘देखना’ नहीं, बल्कि ध्यान से जाँच करना है।
- source_word: הַנֶּגַע
  choice: प्रभावित स्थान
  rationale: נגע यहाँ घर की दीवार पर असामान्य रूप से प्रभावित भाग को दर्शाता है। ‘संक्रमण’ आधुनिक रोगाणु-संबंधी अर्थ दे सकता है, जबकि ‘प्रभावित स्थान’ कारण को अनावश्यक रूप से निश्चित किए बिना दृश्य समस्या बताता है।
- source_word: וְהִנֵּה
  choice: यदि
  rationale: विधिक निर्देश में यह निरीक्षण के दौरान पाई गई दशा का परिचय देता है; इसलिए स्वाभाविक हिन्दी में शर्तसूचक ‘यदि’ उपयुक्त है।
- source_word: בְּקִירֹת הַבַּיִת
  choice: घर की दीवारों पर
  rationale: हिन्दी में दीवार की दृश्य सतह पर पाए गए चिह्नों के लिए ‘पर’ स्वाभाविक है, जबकि आगे का वर्णन उनके सतह से धँसे दिखने को स्पष्ट करता है।
- source_word: שְׁקַעֲרוּרֹת
  choice: धँसे हुए धब्बे
  rationale: यह दुर्लभ शब्द खोखले या दबे हुए स्थानों का संकेत देता है। ‘धँसे हुए धब्बे’ दृश्य चिह्न और उसके भीतर धँसे रूप दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: יְרַקְרַקֹּת
  choice: हरेपन लिए
  rationale: पुनरुक्त रूप शुद्ध गहरे हरे रंग के बजाय हरेपन वाली छटा दर्शाता है।
- source_word: אֲדַמְדַּמֹּת
  choice: लालिमा लिए
  rationale: पुनरुक्त रूप पूर्ण चटख लाल रंग के बजाय लाल रंग की छटा दर्शाता है।
- source_word: וּמַרְאֵיהֶן שָׁפָל מִן־הַקִּיר
  choice: वे दीवार की सतह से नीचे दिखाई दें
  rationale: मूलतः ‘उनका रूप दीवार से नीचा’ है। हिन्दी वाक्यांश दृश्य प्रभाव को बनाए रखते हुए स्पष्ट करता है कि धब्बे सतह के भीतर धँसे दिखाई देते हैं।
