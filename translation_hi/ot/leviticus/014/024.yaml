source:
  edition: WLC
  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן אֶת כֶּ֥בֶשׂ הָ/אָשָׁ֖ם וְ/אֶת לֹ֣ג הַ/שָּׁ֑מֶן וְ/הֵנִ֨יף אֹתָ֧/ם הַ/כֹּהֵ֛ן תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/024.yaml
  text: Then the priest shall take the guilt-offering lamb and the log of oil[b][a], and the priest shall wave them as a wave offering before Yahweh.
translation:
  language: hi
  text: तब याजक दोषबलि के मेमने[a] और तेल के एक लोग[b] को लेगा, और याजक उन्हें यहवे के सामने हिलाने की भेंट के रूप में हिलाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘दोषबलि का मेमना’; परंपरागत रूप से इसे ‘अपराधबलि का मेमना’ भी कहा जाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘लोग’ प्राचीन इस्राएल की उपासना-पद्धति में प्रयुक्त द्रव की एक छोटी माप थी।
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַח
  choice: तब ... ले
  rationale: वाव के साथ यह क्रिया अनुष्ठान की क्रमिक प्रक्रिया को आगे बढ़ाती है; ‘तब’ इस क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: याजकीय और अनुष्ठानिक संदर्भ में כֹּהֵן का मानक हिन्दी रूप; इब्रानी में विषय की पुनरावृत्ति होने के कारण हिन्दी में भी दोनों क्रियाओं के साथ इसे रखा गया है।
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: दोषबलि का मेमना
  rationale: אָשָׁם एक विशिष्ट बलिदान-श्रेणी है; ‘दोषबलि’ उसे संक्षेप और स्पष्टता से व्यक्त करता है, जबकि संबंधवाचक रचना इब्रानी पदबंध के संबंध को सुरक्षित रखती है।
- source_word: לֹג הַשָּׁמֶן
  choice: तेल का एक लोग
  rationale: לֹג द्रव की विशिष्ट प्राचीन माप है; सामान्य ‘माप’ के बजाय लिप्यंतरण तकनीकी सटीकता बनाए रखता है।
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: हिलाकर अर्पित करे
  rationale: נוּף की हिफ़ील क्रिया और सजातीय संज्ञा अनुष्ठानिक रूप से हिलाकर परमेश्वर के सामने प्रस्तुत करने को दर्शाती हैं; हिन्दी में यह संयुक्त अभिव्यक्ति क्रिया और अर्पण, दोनों भावों को स्वाभाविक रूप से रखती है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: बहुवचन सर्वनाम मेमने और तेल के लोग—दोनों—की ओर संकेत करता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहवे के सामने
  rationale: לִפְנֵי उपस्थिति में अनुष्ठानिक प्रस्तुति को व्यक्त करता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘यहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और उसे उपाधि में बदलने से बचाता है।
- issue: אָשָׁם की बलिदान-श्रेणी
  choice: दोषबलि
  alternative: अपराधबलि
  rationale: ‘दोषबलि’ आधुनिक हिन्दी में incurred guilt/liability से जुड़ी विशिष्ट बलिदान-श्रेणी को स्पष्ट रखता है; ‘अपराधबलि’ संभव है, पर वह केवल किए गए अपराध पर अधिक संकीर्ण बल दे सकता है।
- issue: תְּנוּפָה की अनुष्ठानिक अभिव्यक्ति
  choice: हिलाकर अर्पित करे
  alternative: हिलाने की भेंट के रूप में हिलाए
  rationale: चुना हुआ रूप इब्रानी की अनुष्ठानिक गति और प्रस्तुति दोनों को स्पष्ट, गरिमापूर्ण हिन्दी में व्यक्त करता है, बिना गति के ठीक स्वरूप को आवश्यकता से अधिक निर्धारित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। विधिक-अनुष्ठानिक क्रम को बनाए रखते हुए तकनीकी शब्दों को आवश्यक पादटिप्पणियों के साथ रखा गया है।
