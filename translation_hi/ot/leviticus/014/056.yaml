  yaml_path: translation/ot/leviticus/014/056.yaml
  text: and for a swelling[a], and for a scab[b], and for a bright spot.
translation:
  language: hi
  text: और उभरी हुई सूजन, त्वचा के चकत्ते[a] और चमकीले धब्बे[b] के विषय में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पपड़ी’, ‘ददोरा’ अथवा ‘त्वचा पर निकला उभार’; मूल शब्द (סַפַּחַת) का ठीक चिकित्सकीय अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उजला चकत्ता’; इस संदर्भ में इसका अर्थ ‘सफेद धब्बा’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאֵת
  choice: उभरी हुई सूजन
  rationale: लैव्यव्यवस्था 13–14 के जाँच-संबंधी संदर्भ में यह त्वचा के उभरे हुए भाग या सूजन को दर्शाता है। यह अनुवाद शब्द के ऊँचे उठे होने के भाव को स्पष्ट रखते हुए किसी निश्चित आधुनिक रोग-निदान का दावा नहीं करता।
- source_word: סַפַּחַת
  choice: त्वचा का चकत्ता
  rationale: इस दुर्लभ चिकित्सकीय शब्द का सटीक आशय अनिश्चित है; यह त्वचा पर निकले चकत्ते, पपड़ी या दानेदार उभार का संकेत दे सकता है। ‘त्वचा का चकत्ता’ आधुनिक हिन्दी में स्वाभाविक और अपेक्षाकृत तटस्थ है।
- source_word: בֶּהֶרֶת
  choice: चमकीला धब्बा
  rationale: मूल शब्द त्वचा पर चमकीले या उजले दिखाई देने वाले धब्बे को व्यक्त करता है। ‘चमकीला धब्बा’ चमक के मूल भाव को बनाए रखता है और रंग को अनावश्यक रूप से केवल सफेद तक सीमित नहीं करता।
- source_word: וְ/לַ
  choice: और … के विषय में
  rationale: दोहराया गया संबंधसूचक रूप इससे पहले चली आ रही विधियों की सार-सूची में इन अवस्थाओं को जोड़ता है। हिन्दी में अंतिम ‘के विषय में’ को पूरी समन्वित सूची पर लागू करना अधिक स्वाभाविक है।
