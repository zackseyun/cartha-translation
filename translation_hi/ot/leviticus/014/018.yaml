id: LEV.14.18
reference: Leviticus 14:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר בַּ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/018.yaml
  text: And what remains of the oil that is on the priest’s palm he shall put on the head of the one being cleansed[a], and the priest shall make atonement for him before Yahweh.
translation:
  language: hi
  text: और याजक की हथेली पर बचा हुआ तेल वह शुद्ध किए जा रहे व्यक्ति के सिर पर लगाए, और याजक याहवे के सामने उसके लिए प्रायश्चित करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר בַּשֶּׁמֶן
  choice: और ... जो तेल बचा रहे
  rationale: נותר का कृदन्त बचे हुए अंश को व्यक्त करता है। हिन्दी में ‘जो तेल बचा रहे’ स्वाभाविक है और अनुष्ठान के दौरान शेष तेल का अर्थ स्पष्ट रखता है।
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: याजक की हथेली पर
  rationale: כף यहाँ हाथ की ‘हथेली’ है और על का स्थानगत अर्थ ‘पर’ से सीधे व्यक्त होता है।
- source_word: יִתֵּן עַל רֹאשׁ
  choice: सिर पर लगाए
  rationale: נתן का मूल अर्थ रखना/देना है, पर तेल से जुड़े इस अनुष्ठानिक प्रसंग में ‘लगाए’ वर्तमान हिन्दी में क्रिया को स्वाभाविक और सटीक ढंग से व्यक्त करता है।
- source_word: הַמִּטַּהֵר
  choice: शुद्ध किए जा रहे व्यक्ति
  rationale: טהר का हित्वपएल कृदन्त उस व्यक्ति को सूचित करता है जो अनुष्ठानिक शुद्धिकरण की प्रक्रिया में है; यह अनुवाद उस जारी प्रक्रिया को बनाए रखता है।
- source_word: וְכִפֶּר עָלָיו
  choice: उसके लिए प्रायश्चित करे
  rationale: याजकीय अनुष्ठान के संदर्भ में כפר को ‘प्रायश्चित करना’ कहना उसके धार्मिक-अनुष्ठानिक अर्थ को किसी विशिष्ट प्रायश्चित-सिद्धान्त तक सीमित किए बिना सुरक्षित रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לפני का अर्थ ‘के सामने/की उपस्थिति में’ है और יהוה को उसके व्यक्तिगत वाचा-नाम के लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: याजकीय प्रसंग में כפר
  choice: प्रायश्चित करे
  alternative: दोष मिटाए; प्रायश्चित सम्पन्न करे
  rationale: ‘प्रायश्चित करे’ लैव्यव्यवस्था के अनुष्ठानिक प्रयोग को बनाए रखता है, पर क्रिया कैसे प्रभावी होती है इस पर कोई संकीर्ण धर्मसैद्धान्तिक व्याख्या नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य की दो समन्वित क्रियाएँ और शुद्धिकरण की जारी प्रक्रिया मूल इब्रानी संरचना के निकट रहते हुए स्वाभाविक हिन्दी में व्यक्त की गई हैं।
