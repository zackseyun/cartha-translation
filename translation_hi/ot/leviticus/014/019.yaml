base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/019.yaml
  text: Then the priest shall offer the sin offering and make atonement for the one being cleansed from his uncleanness[a]; and afterward he shall slaughter the burnt offering.
translation:
  language: hi
  text: तब याजक पापबलि[a] चढ़ाए और अपनी अशुद्धता से शुद्ध हो रहे व्यक्ति के लिए प्रायश्चित करे। इसके बाद वह होमबलि-पशु का वध करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शुद्धि-बलि’। इब्रानी शब्द חַטָּאת लैव्यव्यवस्था की विधियों में शुद्धि के लिए चढ़ाई जाने वाली बलि को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: चढ़ाए
  rationale: मूल क्रिया का सामान्य अर्थ ‘करना/बनाना’ है, पर बलिदान-संबंधी प्रसंग में यह बलि अर्पित करने को व्यक्त करती है; ‘चढ़ाए’ स्वाभाविक और प्रचलित हिन्दी है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के उपासना-विधि संबंधी प्रसंग में כֹּהֵן का मानक और गरिमापूर्ण हिन्दी पर्याय।
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: यहाँ शब्द बलिदान की वस्तु को सूचित करता है। ‘पापबलि’ परिचित पारिभाषिक पद है; शुद्धि-विधि के इस प्रसंग में ‘शुद्धि-बलि’ की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וְכִפֶּר
  choice: प्रायश्चित करे
  rationale: याजकीय बलिदान-विधि में כפר की धार्मिक-विधिक शक्ति को बनाए रखता है, पर प्रायश्चित के कार्य की किसी एक संकीर्ण धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
- source_word: עַל
  choice: के लिए
  rationale: כפר के साथ यह उस व्यक्ति को चिह्नित करता है जिसके निमित्त प्रायश्चित किया जाता है।
- source_word: הַמִּטַּהֵר
  choice: जो ... शुद्ध किया जा रहा है
  rationale: हित्पएल कृदन्त उस व्यक्ति की चल रही शुद्धि-प्रक्रिया को दर्शाता है; हिन्दी में यह रूप उस निष्क्रिय/आत्मवाची सूक्ष्मता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִטֻּמְאָתוֹ
  choice: अपनी अशुद्धता से
  rationale: टुमआह यहाँ विधिक अशुद्धता है। ‘अपनी’ मूल के पुल्लिंग एकवचन संबंध को हिन्दी में स्वाभाविक रूप से बनाए रखता है और कर्ता-संदर्भ स्पष्ट करता है।
- source_word: וְאַחַר
  choice: इसके बाद
  rationale: विधि के कार्यों का क्रम स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: יִשְׁחַט
  choice: वध करे
  rationale: बलिदान के पशु को विधिपूर्वक काटने के लिए प्रयुक्त पारिभाषिक क्रिया का औपचारिक अर्थ बनाए रखता है।
- source_word: הָעֹלָה
  choice: होमबलि-पशु
  rationale: עֹלָה मानक रूप से ‘होमबलि’ है; चूँकि उसका वध किया जाता है, हिन्दी में ‘-पशु’ जोड़ना मूल में निहित बलि-पशु को स्पष्ट करता है और अस्वाभाविक ‘होमबलि का वध’ से बचाता है।
theological_decisions:
- issue: लैव्यव्यवस्था के शुद्धि-विधि प्रसंग में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धि-बलि
  rationale: यह शब्द बलिदान की एक तकनीकी श्रेणी का नाम है और ‘पापबलि’ हिन्दी पाठकों के लिए अधिक पहचाना हुआ पद है। फिर भी इस प्रसंग में बलि का संबंध अशुद्धता से शुद्धि पाने से है, इसलिए ‘शुद्धि-बलि’ को वास्तविक वैकल्पिक अर्थ के रूप में पादटिप्पणी में रखा गया है।
- issue: מִטֻּמְאָתוֹ में पुल्लिंग एकवचन संबंधसूचक प्रत्यय
  choice: अपनी अशुद्धता से
  alternative: उसकी अशुद्धता से
  rationale: ‘अपनी’ उसी एकवचन व्यक्ति की अशुद्धता को संदर्भित करती है और हिन्दी में लिंग की अनावश्यक पुनरुक्ति के बिना मूल संबंध को ठीक प्रकार सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध धार्मिक-विधिक रजिस्टर अपनाया गया है। ‘याजक’, ‘प्रायश्चित’, ‘होमबलि’ जैसे स्थापित पारिभाषिक शब्द रखे गए हैं, जबकि वाक्य-संरचना को सहज बनाया गया है।
