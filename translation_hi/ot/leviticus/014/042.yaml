  text: וְ/לָקְחוּ֙ אֲבָנִ֣ים אֲחֵר֔וֹת וְ/הֵבִ֖יאוּ אֶל תַּ֣חַת הָ/אֲבָנִ֑ים וְ/עָפָ֥ר אַחֵ֛ר יִקַּ֖ח וְ/טָ֥ח אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/042.yaml
  text: Then they shall take other stones and bring them in place of the stones[b][a], and he shall take other mortar and plaster the house.
translation:
  language: hi
  text: तब वे दूसरे पत्थर लेकर उन पत्थरों के स्थान पर लगाएंगे,[a] और वह दूसरी मिट्टी[b] लेकर घर पर पलस्तर चढ़ाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘उन पत्थरों के नीचे’ है; यहाँ इसका भाव ‘उन पत्थरों के स्थान पर’ या ‘उनके बदले’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दूसरा गारा’; शाब्दिक रूप से ‘दूसरी धूल/मिट्टी।’ यहाँ उस सामग्री की बात है जिससे घर पर फिर से पलस्तर चढ़ाया जाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: तब वे ... लेकर
  rationale: संयुक्त पूर्ण क्रिया विधिक प्रक्रिया के अगले चरण को बताती है; ‘तब’ क्रम को और बहुवचन ‘वे’ मूल रूप को बनाए रखते हैं।
- source_word: אֲבָנִים אֲחֵרוֹת
  choice: दूसरे पत्थर
  rationale: यह सीधा और स्वाभाविक अनुवाद है, जो पुराने पत्थरों के बदले नए पत्थरों का भाव देता है।
- source_word: וְהֵבִיאוּ אֶל תַּחַת הָאֲבָנִים
  choice: उन पत्थरों के स्थान पर लगाएंगे
  rationale: תַּחַת यहाँ भौतिक रूप से ‘नीचे’ नहीं, बल्कि प्रतिस्थापन का भाव देता है। घर की मरम्मत के संदर्भ में ‘लगाएंगे’ हिन्दी में ‘लाकर स्थान देंगे’ से अधिक स्वाभाविक है।
- source_word: וְעָפָר אַחֵר
  choice: दूसरी मिट्टी
  rationale: עָפָר का मूल अर्थ धूल/मिट्टी है; यहाँ उससे दीवार पर नया लेप चढ़ाने की सामग्री अभिप्रेत है। मुख्य पाठ में स्रोत की ठोस छवि रखी गई है और पाद-टिप्पणी में प्रसंगगत अर्थ स्पष्ट किया गया है।
- source_word: יִקַּח
  choice: वह ... लेकर
  rationale: मूल पाठ में बहुवचन से पुल्लिंग एकवचन की ओर आए बदलाव को सामंजस्यित किए बिना सुरक्षित रखा गया है।
- source_word: וְטָח אֶת הַבָּיִת
  choice: घर पर पलस्तर करेगा
  rationale: टוח घर की सतह पर लेप या पलस्तर चढ़ाने को दर्शाता है; यह हिन्दी में स्पष्ट और प्रसंगानुकूल है।
