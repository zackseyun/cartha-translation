source:
  edition: WLC
  text: וְ/שִׁלַּ֞ח אֶת הַ/צִּפֹּ֧ר הַֽ/חַיָּ֛ה אֶל מִ/ח֥וּץ לָ/עִ֖יר אֶל פְּנֵ֣י הַ/שָּׂדֶ֑ה וְ/כִפֶּ֥ר עַל הַ/בַּ֖יִת וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/053.yaml
  text: Then he shall release the live bird outside the city into the open field. Thus he shall make atonement for the house[a], and it shall be clean.
translation:
  language: hi
  text: फिर वह जीवित पक्षी को नगर के बाहर खुले मैदान में छोड़ दे। इस प्रकार वह उस घर के लिए प्रायश्चित करे[a], और वह घर शुद्ध हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस घर का परिशोधन करे” अथवा “उस घर के लिए प्रायश्चित्त करे।” यहाँ इब्रानी में अनुष्ठानिक शुद्धि के संदर्भ में याजकीय प्रायश्चित की भाषा प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּח
  choice: फिर वह ... छोड़ दे
  rationale: पिएल रूप यहाँ अनुष्ठान के अंतर्गत पक्षी को स्वतंत्र छोड़ने का बोध देता है। क्रमसूचक וְ को स्वाभाविक हिन्दी में ‘फिर’ से व्यक्त किया गया है।
- source_word: הַצִּפֹּר הַחַיָּה
  choice: जीवित पक्षी
  rationale: यह विशेषण अनुष्ठान में पहले मारे गए पक्षी से स्पष्ट विरोध दिखाता है; ‘जीवित पक्षी’ संक्षिप्त और स्वाभाविक है।
- source_word: אֶל מִחוּץ לָעִיר
  choice: नगर के बाहर
  rationale: यह पद नगर की सीमा से बाहर की ओर गति को दर्शाता है।
- source_word: אֶל פְּנֵי הַשָּׂדֶה
  choice: खुले मैदान में
  rationale: शाब्दिक रूप ‘मैदान के मुख की ओर’ खुले क्षेत्र में जाने का मुहावरेदार बोध देता है; हिन्दी में ‘खुले मैदान में’ उसी अर्थ को सहजता से व्यक्त करता है।
- source_word: וְכִפֶּר עַל הַבַּיִת
  choice: वह उस घर के लिए प्रायश्चित करे
  rationale: כפר याजकीय अनुष्ठान की प्रायश्चित-संबंधी भाषा है। ‘प्रायश्चित करे’ इस धार्मिक श्रेणी और मूल पाठ के असामान्य तनाव—घर के लिए प्रायश्चित—को बनाए रखता है।
- source_word: וְטָהֵר
  choice: वह घर शुद्ध हो जाएगा
  rationale: क्रिया अनुष्ठान के फलस्वरूप घर की शुद्ध स्थिति को बताती है। हिन्दी में विषय को स्पष्ट दोहराने से संदर्भ सहज रहता है।
theological_decisions:
- issue: घर के संबंध में כפר का अर्थ
  choice: उस घर के लिए प्रायश्चित करे
  alternative: उस घर को दोष-मुक्त करे; उस घर का शुद्धीकरण करे
  rationale: मूल पाठ शुद्धि-अनुष्ठान में भी याजकीय प्रायश्चित की भाषा का उपयोग करता है। मुख्य पाठ इस धर्मवैचारिक तनाव को केवल ‘साफ करना’ बनाकर समाप्त नहीं करता, जबकि पादटिप्पणी अर्थ-क्षेत्र स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘नगर’, ‘प्रायश्चित’ और ‘शुद्ध’ लैव्यव्यवस्था के अनुष्ठानिक संदर्भ के अनुरूप हैं।
