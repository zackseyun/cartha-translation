base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/002.yaml
  text: 'This shall be the law for the leprous person on the day of his cleansing: he shall be brought to the priest[a].'
translation:
  language: hi
  text: 'जिस व्यक्ति को चर्मरोग हो, उसकी शुद्धि के दिन उसके लिए यह व्यवस्था होगी: उसे याजक के पास लाया जाएगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘चर्मरोग’ उस इब्रानी शब्द से संबंधित दशा को दर्शाता है जिसका पारंपरिक अनुवाद ‘कोढ़’ किया गया है; इसका अर्थ आवश्यक रूप से आधुनिक कुष्ठ रोग (हैन्सन रोग) नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: यह व्यवस्था होगी
  rationale: व्यवस्थात्मक सूत्र में संकेतवाचक और היה के अपूर्ण रूप को स्वाभाविक, विधिक हिन्दी में व्यक्त करता है।
- source_word: תּוֹרַת
  choice: के लिए ... व्यवस्था
  rationale: यहाँ תּוֹרָה किसी अमूर्त शिक्षा के बजाय निर्धारित अनुष्ठानिक प्रक्रिया को सूचित करता है।
- source_word: הַמְּצֹרָע
  choice: जिस व्यक्ति को चर्मरोग हो
  rationale: מְצֹרָע צָרַעַת से प्रभावित व्यक्ति है; यह अभिव्यक्ति उसे आधुनिक कुष्ठ रोग से निश्चित रूप से समान ठहराने या उसकी पहचान को रोग तक सीमित करने से बचती है।
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: उसके शुद्ध ठहराए जाने के दिन
  rationale: טהר यहाँ अनुष्ठानिक शुद्धता और समुदाय में पुनःस्वीकार की प्रक्रिया से संबंधित है; कर्मवाच्य हिन्दी यह नहीं मानती कि रोगमुक्ति उसी दिन हुई।
- source_word: וְהוּבָא
  choice: उसे ... लाया जाएगा
  rationale: होफाल रूप का कर्मवाच्य अर्थ और प्रक्रियात्मक क्रम सुरक्षित रखा गया है।
- source_word: אֶל הַכֹּהֵן
  choice: याजक के पास
  rationale: इब्रानी निश्चित पदबंध उस प्रसंग में कार्यरत याजक को सूचित करता है; हिन्दी में जातिवाचक एकवचन बिना अनिवार्य संकेतवाचक के स्वाभाविक है।
theological_decisions:
- issue: מְצֹרָע और आधुनिक कुष्ठ रोग का संबंध
  choice: जिस व्यक्ति को चर्मरोग हो
  alternative: कोढ़ी / कुष्ठ रोग से पीड़ित व्यक्ति
  rationale: צָרַעַת बाइबलीय अनुष्ठानिक श्रेणी है और आधुनिक हैन्सन रोग के ठीक समान नहीं है। चुना हुआ पाठ सहज है और चिकित्सकीय अति-निर्धारण से बचता है; पादटिप्पणी सीमा स्पष्ट करती है।
- issue: טָהֳרָתוֹ का स्वरूप
  choice: शुद्ध ठहराए जाने
  alternative: शुद्ध होने / शुद्धीकरण
  rationale: संदर्भ में शुद्धता अनुष्ठानिक मान्यता है। ‘शुद्ध ठहराए जाने’ से यह स्पष्ट रहता है कि पद केवल शारीरिक उपचार का वर्णन नहीं कर रहा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘व्यवस्था’, ‘शुद्ध ठहराए जाने’ और ‘याजक’ लैव्यव्यवस्था के विधिक-अनुष्ठानिक संदर्भ को बनाए रखते हैं।
