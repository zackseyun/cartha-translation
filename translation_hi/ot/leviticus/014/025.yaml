source:
  edition: WLC
  text: וְ/שָׁחַט֮ אֶת כֶּ֣בֶשׂ הָֽ/אָשָׁם֒ וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/דַּ֣ם הָֽ/אָשָׁ֔ם וְ/נָתַ֛ן עַל תְּנ֥וּךְ אֹֽזֶן הַ/מִּטַּהֵ֖ר הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/025.yaml
  text: Then he shall slaughter the guilt-offering lamb[a], and the priest shall take some of the blood of the guilt offering and put it on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand[b], and on the big toe of his right foot.
translation:
  language: hi
  text: तब वह दोषबलि के मेम्ने का वध करे, और याजक दोषबलि के लहू में से कुछ लेकर शुद्ध किए जा रहे व्यक्ति के दाहिने कान की लौ पर, उसके दाहिने हाथ के अंगूठे पर और उसके दाहिने पैर के अंगूठे पर लगाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁחַט
  choice: बलि करे
  rationale: बलिदान-संबंधी विधि में यह पशु-वध का तकनीकी भाव देता है; हिंदी में ‘बलि करे’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: כֶּבֶשׂ הָאָשָׁם
  choice: दोषबलि का मेम्ना
  rationale: समास उस मेम्ने को दर्शाता है जो אָשָׁם बलि के लिए निर्धारित है।
- source_word: אָשָׁם
  choice: दोषबलि
  rationale: लैव्यव्यवस्था में यह केवल अमूर्त दोष नहीं, एक विशिष्ट बलि है; ‘दोषबलि’ संक्षिप्त और पारिभाषिक है।
- source_word: מִדַּם הָאָשָׁם
  choice: दोषबलि के लहू में से कुछ
  rationale: מִן का अंशवाचक अर्थ स्पष्ट करता है कि पूरा लहू नहीं, उसका कुछ भाग लिया जाता है।
- source_word: תְּנוּךְ אֹזֶן
  choice: कान की लौ
  rationale: यह कान के बाहरी सिरे या उभरे हुए भाग को दर्शाता है; आधुनिक हिंदी में ‘कान की लौ’ स्वाभाविक शारीरिक पद है।
- source_word: הַמִּטַּהֵר
  choice: शुद्ध किए जा रहे व्यक्ति
  rationale: हित्पएल कृदंत उस व्यक्ति को दर्शाता है जो शुद्धिकरण की प्रक्रिया से गुजर रहा है; जारी प्रक्रिया का भाव बनाए रखा गया है।
- source_word: בֹּהֶן יָדוֹ
  choice: उसके दाहिने हाथ का अंगूठा
  rationale: हाथ के साथ בֹּהֶן का अर्थ अंगूठा है।
- source_word: בֹּהֶן רַגְלוֹ
  choice: उसके दाहिने पैर का अँगूठा
  rationale: पैर के साथ בֹּהֶן बड़े अँगूठे को दर्शाता है; हिंदी में ‘पैर का अँगूठा’ पर्याप्त स्पष्ट है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: इस्राएली उपासना-विधि के अधिकारी के लिए प्रचलित और गरिमापूर्ण हिंदी पारिभाषिक शब्द।
theological_decisions:
- issue: बलि-संबंधी पद אָשָׁם का अनुवाद
  choice: दोषबलि
  alternative: प्रायश्चित्त-बलि; अपराधबलि
  rationale: यहाँ एक विशिष्ट लैव्यव्यवस्थीय बलि अभिप्रेत है। ‘दोषबलि’ मूल के दोष/दायित्व-संबंधी अर्थ को बनाए रखता है और किसी बाद की विशिष्ट धार्मिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी, विधिक-धार्मिक प्रसंग के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। क्रमिक क्रियाओं को ‘तब’ और ‘और’ से जोड़ा गया है।
