language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֗ר מִן הַ/שֶּׁ֨מֶן֙ אֲשֶׁר֙ עַל כַּ֣ף הַ/כֹּהֵ֔ן יִתֵּ֖ן עַל רֹ֣אשׁ הַ/מִּטַּהֵ֑ר לְ/כַפֵּ֥ר עָלָ֖י/ו לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/029.yaml
  text: And the rest of the oil that is in the priest’s palm he shall put on the head of the one being cleansed[a], to make atonement for him before Yahweh.
translation:
  language: hi
  text: और याजक की हथेली पर बचे हुए तेल को वह शुद्ध किए जा रहे व्यक्ति के सिर पर लगाए, ताकि वह उसके लिए यहोवा के सामने प्रायश्चित करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר מִן־הַשֶּׁמֶן
  choice: और जो तेल बचा हो
  rationale: נוֹתָר बचे हुए अंश को दर्शाता है। हिंदी में ‘जो तेल बचा हो’ स्वाभाविक है और अनुष्ठान के क्रम में शेष तेल का अर्थ स्पष्ट करता है।
- source_word: אֲשֶׁר עַל כַּף הַכֹּהֵן
  choice: याजक की हथेली पर
  rationale: כַּף हाथ की हथेली या उसका खोखला भाग है। עַל का स्थानवाचक भाव ‘हथेली पर’ से सीधे और ठोस रूप में व्यक्त होता है।
- source_word: יִתֵּן עַל רֹאשׁ
  choice: सिर पर लगाए
  rationale: נתן का मूल अर्थ देना/रखना है, पर तेल के अनुष्ठानिक प्रयोग के संदर्भ में ‘लगाए’ आधुनिक हिंदी में सबसे स्वाभाविक है।
- source_word: הַמִּטַּהֵר
  choice: शुद्ध किए जा रहे व्यक्ति
  rationale: Hitpael कृदंत उस व्यक्ति को दर्शाता है जो शुद्धिकरण की प्रक्रिया से गुजर रहा है; यह अनुवाद प्रक्रिया के जारी होने का भाव बनाए रखता है।
- source_word: לְכַפֵּר עָלָיו
  choice: उसके लिए प्रायश्चित करे
  rationale: כפר याजकीय अनुष्ठान का प्रमुख शब्द है; ‘प्रायश्चित करे’ उसके धार्मिक भार को बनाए रखता है, और עָלָיו लाभार्थी को ‘उसके लिए’ के रूप में व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי उपस्थिति का भाव देता है और יהוה को वाचा के व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יהוה है। उसे सामान्य उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ रखा गया है।
- issue: כפר का धार्मिक अर्थ
  choice: प्रायश्चित करे
  alternative: उसका दोष ढांपे / उसके लिए क्षमा का विधान पूरा करे
  rationale: यहाँ כפר अनुष्ठानिक प्रायश्चित को सूचित करता है। ‘प्रायश्चित’ अर्थ को संक्षिप्त रखते हुए उसके धार्मिक तनाव को किसी एक व्याख्यात्मक सिद्धांत तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘याजक,’ ‘शुद्ध’ और ‘प्रायश्चित’ जैसे स्थापित धार्मिक शब्द मूल अनुष्ठानिक संदर्भ को बनाए रखते हैं।
