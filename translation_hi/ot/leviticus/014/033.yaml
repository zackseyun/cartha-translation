    text: 'हिब्रू: “YHWH”; पारंपरिक हिंदी बाइबिलों में अक्सर “यहोवा”।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: वाव-क्रमिक अपूर्ण क्रिया यहाँ एक नई वाणी-घटना आरम्भ करती है। हिंदी में अगले לֵאמֹר को अलग से दोहराए बिना ‘ने…कहा’ इस सूत्र का स्वाभाविक और अर्थपूर्ण रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय ईश्वरीय नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: मूसा और हारून से
  rationale: אֶל दोनों व्यक्तियों को वाणी के प्रत्यक्ष संबोधित जन बताता है। हिंदी में ‘मूसा और हारून से’ स्वाभाविक है और दोनों को समान रूप से संबोधित रखता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह प्रत्यक्ष वचन का पारंपरिक परिचय है। ‘बोला…यह कहते हुए’ जैसी कृत्रिम पुनरुक्ति के स्थान पर हिंदी में ‘कहा’ उसी कार्य को स्वाभाविक ढंग से निभाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। इसलिए उसे किसी उपाधि से बदलने के बजाय हिंदी पाठकों में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। मूल की वाणी-सूत्रात्मक शैली को हिंदी की स्वाभाविक अभिव्यक्ति में संक्षिप्त रूप से रखा गया है।
