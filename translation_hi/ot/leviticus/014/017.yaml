source:
  edition: WLC
  text: וּ/מִ/יֶּ֨תֶר הַ/שֶּׁ֜מֶן אֲשֶׁ֣ר עַל כַּפּ֗/וֹ יִתֵּ֤ן הַ/כֹּהֵן֙ עַל תְּנ֞וּךְ אֹ֤זֶן הַ/מִּטַּהֵר֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִ֑ית עַ֖ל דַּ֥ם הָ/אָשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/017.yaml
  text: And from the rest of the oil that is on his palm[a], the priest shall put some on the lobe of the right ear of the one being cleansed, and on the thumb of his right hand, and on the big toe of his right foot[b], on top of the blood of the guilt offering.
translation:
  language: hi
  text: और याजक उसकी हथेली पर बचे हुए तेल में से कुछ शुद्ध किए जा रहे व्यक्ति के दाहिने कान की लौ, उसके दाहिने हाथ के अंगूठे और उसके दाहिने पैर के अँगूठे पर—दोषबलि के लहू के ऊपर—लगाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיֶּתֶר הַשֶּׁמֶן
  choice: बचे हुए तेल में से कुछ
  rationale: מִן का अंशवाचक अर्थ और יֶתֶר का ‘जो शेष है’ अर्थ स्वाभाविक आधुनिक हिन्दी में सुरक्षित रहता है।
- source_word: עַל כַּפּוֹ
  choice: अपनी हथेली पर
  rationale: כַּף यहाँ हाथ की हथेली है और עַל का सीधा स्थानवाचक अर्थ ‘पर’ है; कर्ता याजक होने के कारण ‘अपनी’ हिन्दी में स्पष्ट है।
- source_word: יִתֵּן
  choice: लगाए
  rationale: נתן का मूल अर्थ ‘रखना/देना’ है, पर इस अनुष्ठान में तेल को शरीर के निर्दिष्ट अंगों पर लगाने की क्रिया अभिप्रेत है; ‘लगाए’ स्वाभाविक और सटीक है।
- source_word: תְּנוּךְ אֹזֶן
  choice: कान की लौ
  rationale: תְּנוּךְ कान के बाहरी सिरे या निचले कोमल भाग को सूचित करता है; हिन्दी में ‘कान की लौ’ सबसे स्पष्ट आधुनिक शारीरिक पद है।
- source_word: הַמִּטַּהֵר
  choice: शुद्ध किए जा रहे व्यक्ति
  rationale: हित्पएल कृदन्त अनुष्ठानिक शुद्धि की चल रही प्रक्रिया में स्थित व्यक्ति को दर्शाता है; यह रूप प्रक्रिया और ग्रहणशीलता दोनों बचाता है।
- source_word: בֹּהֶן יָדוֹ
  choice: उसके दाहिने हाथ के अंगूठे
  rationale: हाथ के प्रसंग में בֹּהֶן का अर्थ अंगूठा है।
- source_word: בֹּהֶן רַגְלוֹ
  choice: उसके दाहिने पैर के अँगूठे
  rationale: पैर के प्रसंग में वही शब्द बड़े अँगूठे को सूचित करता है; सामान्य हिन्दी में ‘पैर का अँगूठा’ पर्याप्त स्पष्ट है।
- source_word: עַל דַּם הָאָשָׁם
  choice: दोषबलि के लहू के ऊपर
  rationale: עַל को ‘ऊपर’ देने से स्पष्ट होता है कि तेल उसी स्थान पर लगाया जाता है जहाँ दोषबलि का लहू पहले लगाया गया था; אָשָׁם के लिए संगत अनुष्ठानिक पद ‘दोषबलि’ रखा गया है।
theological_decisions:
- issue: אָשָׁם का बलिदानी पारिभाषिक अनुवाद
  choice: दोषबलि
  alternative: प्रायश्चित्त-बलि / क्षतिपूर्ति-बलि
  rationale: लैव्यव्यवस्था में אָשָׁם एक विशिष्ट बलिदान का पारिभाषिक नाम है। ‘दोषबलि’ हिन्दी में संक्षिप्त, पहचाना हुआ और मूल के दोष/दायित्व संबंधी अर्थ के निकट है, जबकि विकल्प अर्थ को अधिक व्याख्यायित कर सकते हैं।
- issue: तेल और लहू के स्थानिक संबंध का अर्थ
  choice: लहू के ऊपर
  alternative: लहू पर / लहू वाले उसी स्थान पर
  rationale: मूल का עַל तेल को पहले से लगे लहू के ऊपर या उसी चिह्नित स्थान पर लगाने का संबंध व्यक्त कर सकता है। मुख्य पाठ में सीधा ‘ऊपर’ रखा गया है और पादटिप्पणी में स्थानिक आशय स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण अनुष्ठानिक गद्य। ‘याजक’, ‘शुद्ध’, ‘दोषबलि’ और ‘लहू’ जैसे बाइबलीय पारिभाषिक शब्द संगति के लिए रखे गए हैं। वाक्यक्रम हिन्दी की स्वाभाविकता के अनुसार है, जबकि दाहिने कान, हाथ और पैर की त्रिक संरचना तथा अंतिम स्थानिक वाक्यांश सुरक्षित हैं।
