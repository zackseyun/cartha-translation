  text: וּ/שְׁתֵּ֣י תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑/וֹ וְ/הָיָ֤ה אֶחָד֙ חַטָּ֔את וְ/הָ/אֶחָ֖ד עֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/022.yaml
  text: and two turtledoves or two young pigeons[a], as his means can afford; and one shall be a sin offering and the other a burnt offering.
translation:
  language: hi
  text: और अपनी सामर्थ्य के अनुसार दो पंडुक या कबूतर के दो बच्चे लाए; उनमें से एक पापबलि[a] और दूसरा होमबलि हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुद्धि-बलि।” इब्रानी शब्द अनुष्ठानिक शुद्धि के लिए चढ़ाई जाने वाली बलि को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי תֹרִים
  choice: और दो पंडुक
  rationale: संयोजक पिछले पद की भेंट-सूची को आगे बढ़ाता है। תֹרִים बलि में प्रयुक्त विशिष्ट पक्षी, अर्थात पंडुक, को दर्शाता है।
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: या कबूतर के दो बच्चे
  rationale: इब्रानी मुहावरे का आशय दो युवा कबूतरों से है; यह हिंदी रूप मूल की संबंध-संरचना और आयु-सूचक भाव दोनों को स्वाभाविक ढंग से रखता है।
- source_word: אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: अपनी सामर्थ्य के अनुसार ... लाए
  rationale: शाब्दिक रूप से 'जितना उसका हाथ पा सके' आर्थिक क्षमता का मुहावरा है। 'अपनी सामर्थ्य के अनुसार' आधुनिक हिंदी में यही अर्थ स्पष्ट करता है; 'लाए' पिछले संदर्भ में अपेक्षित क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חַטָּאת
  choice: पापबलि
  rationale: यह प्रचलित और पहचानने योग्य लेवीय बलि-शब्द है। अनुष्ठानिक शुद्धि का संभावित अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: पूर्णतः वेदी पर चढ़ाई और जलाई जाने वाली बलि के लिए हिंदी बाइबलीय परंपरा का संक्षिप्त, स्थापित पद।
theological_decisions:
- issue: लेवीय अनुष्ठान में חַטָּאת का अर्थ
  choice: पापबलि
  alternative: शुद्धि-बलि
  rationale: इस संज्ञा का संबंध पाप से भी हो सकता है और अनुष्ठानिक अशुद्धि दूर करने वाली बलि से भी। मुख्य पाठ में परिचित पारिभाषिक शब्द रखा गया है, जबकि शुद्धिकरण का वास्तविक संदर्भगत भाव पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली। बलि-संबंधी स्थापित शब्दावली रखी गई है। पद पिछले वाक्य की निरंतरता है, इसलिए आरंभ में “और” रखा गया है; हिंदी में वाक्य पूर्ण और स्वाभाविक बनाने के लिए संदर्भ से निहित “लाए” जोड़ा गया है।
