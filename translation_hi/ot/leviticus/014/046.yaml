  text: And whoever enters the house during all the days that it is quarantined shall be unclean until the evening[a].
translation:
  language: hi
  text: घर के बंद रखे जाने[a] के पूरे समय में जो कोई उसमें प्रवेश करेगा, वह शाम तक अशुद्ध रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अलग रखा जाए” अथवा “प्रतिबंधित रखा जाए।” इब्रानी क्रिया याजकीय जाँच के लिए घर को बंद करके अलग रखने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/בָּא
  choice: और…जो कोई…प्रवेश करे
  rationale: निश्चित उपपद के साथ कृदंत यहाँ सामान्य रूप से किसी भी प्रवेश करने वाले व्यक्ति को दर्शाता है; ‘जो कोई’ विधिक व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל הַ/בַּיִת
  choice: उस घर में प्रवेश करे
  rationale: בוא के साथ אֶל भीतर जाने की गति व्यक्त करता है; हिन्दी में ‘घर में प्रवेश करना’ इसका स्वाभाविक रूप है।
- source_word: כָּל יְמֵי
  choice: जितने दिन…उन दिनों
  rationale: यह घर को बंद रखने की पूरी अवधि को समेटता है; यह हिन्दी संरचना पूर्ण कालावधि को स्पष्ट और सहज रखती है।
- source_word: הִסְגִּיר אֹתוֹ
  choice: वह घर बंद रखा जाए
  rationale: सन्दर्भ में סגר याजकीय जाँच के अधीन घर को अलग करके बंद रखने को दर्शाता है। ‘बंद रखा जाए’ मूल की कर्मवाच्य-सदृश अस्पष्टता बनाए रखता है और आधुनिक चिकित्सकीय ‘क्वारंटीन’ का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: יִטְמָא
  choice: अशुद्ध रहेगा
  rationale: यह क्रिया अनुष्ठानिक अशुद्धता की अवस्था को दर्शाती है; विधिक परिणाम के लिए ‘अशुद्ध रहेगा’ स्पष्ट और स्वाभाविक है।
- source_word: עַד הָ/עָרֶב
  choice: शाम तक
  rationale: अस्थायी अनुष्ठानिक अशुद्धता की अवधि बताने वाला मानक मुहावरा है।
theological_decisions:
- issue: अशुद्धता का स्वरूप
  choice: ‘अशुद्ध’ शब्द रखा गया और इसे नैतिक दोष के रूप में नहीं समझाया गया।
  alternative: ‘अनुष्ठानिक रूप से अशुद्ध’ मुख्य पाठ में लिखना।
  rationale: טמא का सन्दर्भ अनुष्ठानिक-विधिक अशुद्धता है, पर मूल में अलग से ‘अनुष्ठानिक’ विशेषण नहीं है; संक्षिप्त मुख्य पाठ मूल के रूप को बनाए रखता है।
- issue: घर को बंद करने वाले कर्ता की पहचान
  choice: ‘बंद रखा जाए’ द्वारा कर्ता को अव्यक्त रखा गया।
  alternative: ‘याजक उसे बंद रखे’ या ‘उसने उसे बंद कर रखा हो।’
  rationale: हिब्रू रूप व्याकरणतः कर्ता का संकेत दे सकता है, पर पद में उसका नाम नहीं है; कर्मवाच्य हिन्दी संदर्भगत याजकीय प्रतिबंध को बिना अतिरिक्त स्पष्टता थोपे व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज विधिक-धार्मिक स्वर रखा गया है। ‘क्वारंटीन’ से बचकर मूल के व्यापक ‘बंद/अलग रखने’ के अर्थ और ऐतिहासिक सन्दर्भ को सुरक्षित रखा गया है।
