  text: זֹ֣את תּוֹרַ֔ת אֲשֶׁר בּ֖/וֹ נֶ֣גַע צָרָ֑עַת אֲשֶׁ֛ר לֹֽא תַשִּׂ֥יג יָד֖/וֹ בְּ/טָהֳרָתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/032.yaml
  text: This is the law for him in whom there is an infection of skin disease[b][a], whose means cannot afford what is required for his cleansing.
translation:
  language: hi
  text: यह उस व्यक्ति के लिए व्यवस्था है जिसमें चर्मरोग का लक्षण[a] हो और जिसके पास उसके शुद्धीकरण के लिए पर्याप्त साधन न हों।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द צָרָעַת का पारंपरिक अनुवाद प्रायः ‘कोढ़’ किया गया है, परन्तु लैव्यव्यवस्था में यह अनेक गंभीर चर्म-स्थितियों और उनसे जुड़ी अनुष्ठानिक अशुद्धता की व्यापक श्रेणी को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ है, ‘जिसका हाथ उसके शुद्धीकरण में न पहुँचे’; यह मुहावरा बताता है कि उसके पास शुद्धीकरण के लिए निर्धारित भेंट चढ़ाने के पर्याप्त साधन नहीं हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: व्यवस्था
  rationale: याजकीय संदर्भ में यह निर्धारित विधि अथवा नियम को सूचित करता है; ‘व्यवस्था’ संक्षिप्त और गरिमापूर्ण है।
- source_word: בּוֹ
  choice: जिसमें ... हो
  rationale: यह व्यक्ति में रोग की उपस्थिति व्यक्त करने वाली इब्रानी रचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נֶגַע צָרָעַת
  choice: चर्मरोग का संक्रमण
  rationale: נֶגַע को ‘संक्रमण’ और צָרָעַת को व्यापक याजकीय-चर्मरोग श्रेणी के रूप में व्यक्त किया गया है; केवल ‘कोढ़’ कहना आधुनिक हैन्सन रोग का भ्रामक संकेत दे सकता है।
- source_word: לֹא תַשִּׂיג יָדוֹ
  choice: जिसके साधन ... पर्याप्त न हों
  rationale: शाब्दिक रूप से ‘जिसका हाथ न पहुँचे’ आर्थिक असमर्थता का मुहावरा है; हिन्दी में इसका अर्थ स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: בְּטָהֳרָתוֹ
  choice: उसके शुद्धीकरण के लिए
  rationale: यह पिछले पदों में निर्धारित शुद्धीकरण-विधि और उससे संबंधित भेंटों को संदर्भित करता है; ‘शुद्धीकरण’ अनुष्ठानिक अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: צָרָעַת की पहचान
  choice: चर्मरोग
  alternative: कोढ़
  rationale: मूल पद किसी एक आधुनिक रोग-निदान को निश्चित नहीं करता; व्यापक शब्द मूल की अर्थ-सीमा और अनुष्ठानिक संदर्भ को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘व्यवस्था’ और ‘शुद्धीकरण’ याजकीय संदर्भ को बनाए रखते हैं, जबकि पादटिप्पणियाँ रोग-श्रेणी और आर्थिक असमर्थता वाले इब्रानी मुहावरे को स्पष्ट करती हैं।
