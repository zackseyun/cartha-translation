- source_word: וּלְ
  choice: और … के विषय में
  rationale: संयोजक और संबंधसूचक उपसर्ग पिछली आयतों से चली आ रही विषय-सूची को आगे बढ़ाते हैं; यह हिंदी में उस सूची-संरचना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: צָרַעַת
  choice: रोग
  rationale: इब्रानी शब्द צָרַעַת केवल आधुनिक चिकित्सकीय अर्थ वाले कुष्ठ रोग तक सीमित नहीं है; लैव्यव्यवस्था में यह मनुष्यों के साथ वस्त्रों और घरों को प्रभावित करनेवाली दशाओं के लिए भी प्रयुक्त है। मुख्य पाठ में व्यापक शब्द रखा गया है और पादटिप्पणी में इसकी विशेष अर्थ-सीमा स्पष्ट की गई है।
- source_word: הַבֶּגֶד
  choice: वस्त्र
  rationale: यह एकवचन संज्ञा यहाँ सामान्य वर्ग का प्रतिनिधित्व करती है; ‘वस्त्र’ आधुनिक हिंदी में संक्षिप्त, गरिमापूर्ण और सटीक है।
- source_word: וְלַבָּיִת
  choice: तथा घर में
  rationale: संयोजक दूसरे प्रभावित स्थान को जोड़ता है। अध्याय के संदर्भ के अनुसार हिंदी का ‘घर में’ निहित स्थान-संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: צָרַעַת הַבֶּגֶד וְלַבָּיִת
  choice: वस्त्र तथा घर में लगनेवाले रोग
  rationale: ‘लगनेवाले’ वस्त्र और घर जैसी निर्जीव वस्तुओं पर इस दशा के प्रकट होने को सहज हिंदी में बताता है, बिना उसे किसी एक आधुनिक रोग या फफूँदी के रूप में निश्चित किए।
