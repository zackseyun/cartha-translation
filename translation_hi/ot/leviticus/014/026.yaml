translation:
  language: hi
  text: फिर याजक तेल में से अपनी बाईं हथेली पर उंडेलेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִן הַ/שֶּׁמֶן
  choice: फिर तेल में से कुछ
  rationale: וּ यहाँ विधि के अगले चरण को जोड़ता है, इसलिए स्वाभाविक हिन्दी में ‘फिर’ उपयुक्त है। מִן स्रोत/अंश का भाव देता है; उंडेलने की क्रिया के कारण हिन्दी में ‘कुछ’ निहित अंश को स्पष्ट और स्वाभाविक बनाता है।
- source_word: יִצֹק
  choice: उंडेलेगा
  rationale: अनुष्ठान संबंधी निर्देश में yiqtol निर्धारित अगली क्रिया बताता है। ‘उंडेलेगा’ तेल को हथेली पर डालने की क्रिया का सटीक और प्रचलित हिन्दी रूप है।
- source_word: הַ/כֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के उपासना-संबंधी संदर्भ में כֹּהֵן के लिए मानक और गरिमापूर्ण हिन्दी शब्द।
- source_word: עַל כַּף
  choice: हथेली पर
  rationale: כַּף यहाँ हाथ की हथेली अथवा उसका खोखला भाग है; ‘हथेली पर’ आधुनिक हिन्दी में सटीक और स्वाभाविक है।
- source_word: הַ/כֹּהֵן הַ/שְּׂמָאלִית
  choice: अपनी बाईं हथेली
  rationale: शाब्दिक रचना ‘याजक की हथेली, बाईं [वाली]’ है। कर्ता वही याजक होने के कारण ‘अपनी’ अनावश्यक पुनरावृत्ति हटाते हुए संबंध स्पष्ट करता है।
