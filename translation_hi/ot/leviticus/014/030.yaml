base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/030.yaml
  text: And he shall offer one of the turtledoves or one of the young pigeons[a], according to what his means can afford—
translation:
  language: hi
  text: और वह अपनी सामर्थ्य के अनुसार[a] पंडुकों में से एक या कबूतर के बच्चों में से एक चढ़ाए—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जितना उसका हाथ पा सके”; यह इब्रानी मुहावरा उसकी आर्थिक सामर्थ्य को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: और वह … चढ़ाए
  rationale: क्रिया का मूल अर्थ ‘करना/बनाना’ है, पर बलिदान-संबंधी प्रसंग में इसका आशय भेंट चढ़ाना है। हिंदी में ‘चढ़ाए’ इस धार्मिक-सांस्कृतिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת הָאֶחָד
  choice: एक
  rationale: अगले दो विकल्पों में से एक पक्षी चुने जाने का भाव है; हिंदी में ‘एक’ पर्याप्त और स्वाभाविक है।
- source_word: מִן הַתֹּרִים
  choice: पंडुकों में से
  rationale: תֹּרִים बलिदान-विधि में सामान्य कबूतर नहीं, बल्कि टर्टलडव अर्थात पंडुक को सूचित करता है।
- source_word: אוֹ מִן בְּנֵי הַיּוֹנָה
  choice: या कबूतर के बच्चों में से एक
  rationale: यह इब्रानी पदबंध छोटे/युवा कबूतरों के लिए प्रचलित अभिव्यक्ति है। हिंदी में दूसरा ‘एक’ जोड़ने से दोनों विकल्पों में से किसी एक पक्षी का चुनाव स्पष्ट रहता है।
- source_word: מֵאֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: अपनी सामर्थ्य के अनुसार
  rationale: शाब्दिक रूप से ‘जितना उसका हाथ पा सके’; यह आर्थिक साधन या वहन-क्षमता का इब्रानी मुहावरा है। ‘अपनी सामर्थ्य के अनुसार’ उसका आशय सहज और गरिमापूर्ण हिंदी में देता है।
