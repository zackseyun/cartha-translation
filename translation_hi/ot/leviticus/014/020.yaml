source:
  edition: WLC
  text: וְ/הֶעֱלָ֧ה הַ/כֹּהֵ֛ן אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה הַ/מִּזְבֵּ֑חָ/ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/טָהֵֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/020.yaml
  text: Then the priest shall offer up the burnt offering and the grain offering on the altar[a], and the priest shall make atonement for him, and he shall be clean.
translation:
  language: hi
  text: तब याजक होमबलि और अन्नबलि को वेदी पर चढ़ाएगा। याजक उसके लिए प्रायश्चित करेगा, और वह शुद्ध हो जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: चढ़ाएगा
  rationale: עלה के हिफ़ील रूप का बलिदान-संबंधी संदर्भ में अर्थ वेदी पर अर्पित करना है; ‘चढ़ाएगा’ इस अनुष्ठानिक अर्थ और भावी विधिक कथन, दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: लैव्यव्यवस्था में עֹלָה पूर्णतः जलाए जाने वाले बलिदान का प्रचलित पारिभाषिक शब्द है; हिंदी बाइबलीय प्रयोग में ‘होमबलि’ इसका संक्षिप्त और पहचाना हुआ समतुल्य है।
- source_word: הַמִּנְחָה
  choice: अन्नबलि
  rationale: इस बलिदान-विधि के संदर्भ में מִנְחָה सामान्य भेंट नहीं, अनाज से बनी भेंट को सूचित करता है; ‘अन्नबलि’ उस विशिष्ट अर्थ को बनाए रखता है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक प्रत्यय सहित यह रूप यहाँ बलि को वेदी पर अर्पित करने का स्थान बताता है; ‘वेदी पर’ स्वाभाविक हिंदी है।
- source_word: וְכִפֶּר עָלָיו
  choice: उसके लिए प्रायश्चित करेगा
  rationale: याजकीय बलिदान-संदर्भ में כפר का पारंपरिक और अर्थ-संगत अनुवाद ‘प्रायश्चित करना’ है; עָלָיו यहाँ उस व्यक्ति के पक्ष में किए गए कार्य को दर्शाता है।
- source_word: וְטָהֵר
  choice: और वह शुद्ध हो जाएगा
  rationale: Qal रूप अनुष्ठान के फलस्वरूप प्राप्त शुद्ध दशा को बताता है। ‘शुद्ध हो जाएगा’ आधुनिक हिंदी में परिणामी स्थिति को स्पष्ट करता है, बिना इसे नैतिक परिवर्तन ठहराए।
theological_decisions:
- issue: याजकीय व्यवस्था में शुद्धता का स्वरूप
  choice: ‘शुद्ध’ को अनुष्ठानिक स्थिति के रूप में रखा गया
  alternative: नैतिक पवित्रता या आंतरिक नैतिक परिवर्तन
  rationale: लैव्यव्यवस्था 14 का प्रसंग अशुद्धता के बाद विधिपूर्वक पुनःस्थापन का है। इसलिए पाठ का सरल शब्द रखा गया है और उसमें नैतिक परिवर्तन का अतिरिक्त दावा नहीं जोड़ा गया।
- issue: וְטָהֵר में कर्ता और परिणामी दशा
  choice: उस व्यक्ति के विषय में ‘वह शुद्ध हो जाएगा’
  alternative: ‘उसे शुद्ध किया जाएगा’ या याजक को कर्ता मानना
  rationale: इब्रानी Qal रूप परिणामी शुद्ध दशा को व्यक्त करता है; संदर्भ में इसका स्वाभाविक कर्ता वही व्यक्ति है जिसके लिए याजक प्रायश्चित करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और संक्षिप्त विधिक-अनुष्ठानिक शैली अपनाई गई है। ‘होमबलि’, ‘अन्नबलि’, ‘वेदी’, ‘प्रायश्चित’ और ‘शुद्ध’ जैसे स्थापित बाइबलीय शब्दों को बनाए रखा गया है।
