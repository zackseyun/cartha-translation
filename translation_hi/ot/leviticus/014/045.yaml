  text: וְ/נָתַ֣ץ אֶת הַ/בַּ֗יִת אֶת אֲבָנָי/ו֙ וְ/אֶת עֵצָ֔י/ו וְ/אֵ֖ת כָּל עֲפַ֣ר הַ/בָּ֑יִת וְ/הוֹצִיא֙ אֶל מִ/ח֣וּץ לָ/עִ֔יר אֶל מָק֖וֹם טָמֵֽא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/045.yaml
  text: Then he shall tear down the house—its stones[a], its timbers, and all the plaster of the house—and carry them out to an unclean place outside the city.
translation:
  language: hi
  text: तब वह उस घर को ढहा दे—उसके पत्थरों, उसकी लकड़ियों और घर के सारे पलस्तर[a] को—और उन्हें नगर के बाहर किसी अशुद्ध स्थान पर ले जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “घर की सारी धूल/मिट्टी” है; निर्माण के इस संदर्भ में आशय गारे, पलस्तर या दीवार से खुरची गई सामग्री से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַץ
  choice: तब वह ... ढहा दे
  rationale: क्रिया נתץ यहाँ दूषित घर को तोड़कर गिरा देने या ध्वस्त करने को व्यक्त करती है। संदर्भ में क्रमसूचक וְ को स्वाभाविक हिन्दी में “तब” से व्यक्त किया गया है।
- source_word: הַבַּיִת
  choice: उस घर
  rationale: בַּיִת यहाँ निवास की भावना से अधिक भौतिक भवन को सूचित करता है; इसलिए “घर” स्पष्ट और सामान्य हिन्दी है।
- source_word: אֲבָנָיו
  choice: उसके पत्थरों
  rationale: मूल बहुवचन का ठोस अर्थ सुरक्षित रखा गया है; यह घर की पत्थर वाली निर्माण-सामग्री को दर्शाता है।
- source_word: עֵצָיו
  choice: उसकी लकड़ियों
  rationale: עֵץ का बहुवचन यहाँ घर में लगी लकड़ी या लकड़ी के संरचनात्मक भागों को समष्टि रूप में बताता है। “लकड़ियों” मूल की व्यापकता रखता है और केवल शहतीरों तक अर्थ सीमित नहीं करता।
- source_word: כָּל עֲפַר הַבָּיִת
  choice: घर के सारे पलस्तर[a]
  rationale: עָפָר का शाब्दिक अर्थ “धूल/मिट्टी” है, किंतु घर को खुरचने और गिराने के इस निर्माण-संदर्भ में यह दीवार से निकली मिट्टी-आधारित परत या पलस्तर को सूचित कर सकता है। पाठ में सहज अर्थ दिया गया है और वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: וְהוֹצִיא
  choice: और उन्हें ... ले जाए
  rationale: हिफ़ील क्रिया का अर्थ बाहर निकलवाना या बाहर ले जाना है। हिन्दी में बहुवचन “उन्हें” विघटित निर्माण-सामग्री को सामूहिक रूप से स्पष्ट करता है।
- source_word: אֶל מִחוּץ לָעִיר
  choice: नगर के बाहर
  rationale: दिशासूचक वाक्यांश का स्वाभाविक हिन्दी रूप, जो सामग्री को बस्ती की सीमा से बाहर ले जाने को व्यक्त करता है।
- source_word: אֶל מָקוֹם טָמֵא
  choice: किसी अशुद्ध स्थान पर
  rationale: טָמֵא लैव्यव्यवस्था की अनुष्ठानिक शुद्धता-अशुद्धता की प्रमुख संज्ञा है। “अशुद्ध” इस विधिक और धार्मिक अर्थ को सामान्य आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: अनुष्ठानिक अशुद्धता की शब्दावली
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: “अशुद्ध” טָמֵא के विधिक-अनुष्ठानिक अर्थ को व्यक्त करता है और नैतिक दोष या किसी विशेष सम्प्रदायगत व्याख्या को अनावश्यक रूप से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। घर के विघटन की सामग्री को दोनों ओर रखे डैश से स्पष्ट किया गया है। मूल में עָפָר की वास्तविक अर्थगत व्यापकता को पाठ में “पलस्तर” और पादटिप्पणी में उसके शाब्दिक तथा संदर्भगत विकल्पों द्वारा सुरक्षित रखा गया है।
