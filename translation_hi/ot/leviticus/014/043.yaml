base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/043.yaml
  text: But if the disease returns and breaks out in the house after he has removed the stones[a], and after he has scraped the house, and after it has been plastered,
translation:
  language: hi
  text: परन्तु यदि पत्थरों को निकाल दिए जाने, घर को खुरचे जाने और उस पर पलस्तर किए जाने के बाद वह रोग[a] फिर लौट आए और घर में फूट निकले,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संक्रमण” अथवा “व्याधि।” यहाँ प्रयुक्त इब्रानी शब्द नेगा लैव्यव्यवस्था में मनुष्यों, वस्त्रों या घरों को प्रभावित करने वाली चिह्नित रोगग्रस्त दशा का तकनीकी शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह विधिक प्रक्रिया में एक नई सशर्त स्थिति प्रस्तुत करता है; ‘परन्तु यदि’ संयोजक और प्रसंगगत विरोध—दोनों को व्यक्त करता है।
- source_word: יָשׁוּב
  choice: फिर लौट आए
  rationale: שׁוב यहाँ रोग की पुनरावृत्ति बताता है; ‘फिर लौट आए’ सहज और स्पष्ट हिन्दी है।
- source_word: הַנֶּגַע
  choice: वह रोग
  rationale: נגע लैव्यव्यवस्था में मनुष्यों, वस्त्रों और घरों पर दिखाई देने वाली चिह्नित रोगग्रस्त दशा का तकनीकी शब्द है। ‘रोग’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी इसकी व्यापकता सुरक्षित रखती है।
- source_word: וּפָרַח
  choice: फैल जाए
  rationale: פרח का मूल बिंब फूटने या अंकुरित होने का है और यहाँ रोग के पुनः उभरकर फैलने को सूचित करता है; घर के संदर्भ में ‘फैल जाए’ स्वाभाविक है।
- source_word: בַּבַּיִת
  choice: घर में
  rationale: ב यहाँ स्थानवाचक है; ‘घर में’ रोगग्रस्त दशा के भवन में प्रकट होने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אַחַר חִלֵּץ אֶת הָאֲבָנִים
  choice: पत्थरों को निकाल दिए जाने के बाद
  rationale: यह पहले निर्धारित उपचार की ओर संकेत करता है। कर्मवाच्य रूप अनिर्दिष्ट कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְאַחֲרֵי הִקְצוֹת אֶת הַבַּיִת
  choice: घर को खुरचे जाने
  rationale: הקצות यहाँ घर की सतहों को भौतिक रूप से खुरचने की क्रिया है; ‘खुरचना’ इस ठोस कार्रवाई को सुरक्षित रखता है।
- source_word: וְאַחֲרֵי הִטּוֹחַ
  choice: उस पर पलस्तर किए जाने
  rationale: טוח का अर्थ लेपना या पलस्तर करना है। हिन्दी में ‘उस पर पलस्तर’ भवन की सतह पर नई परत चढ़ाने की प्रक्रिया को स्पष्ट करता है और हिब्रू के अनिर्दिष्ट कर्ता को बनाए रखता है।
