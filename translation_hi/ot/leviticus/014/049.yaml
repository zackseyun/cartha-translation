id: LEV.14.49
reference: Leviticus 14:49
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לָקַ֛ח לְ/חַטֵּ֥א אֶת הַ/בַּ֖יִת שְׁתֵּ֣י צִפֳּרִ֑ים וְ/עֵ֣ץ אֶ֔רֶז וּ/שְׁנִ֥י תוֹלַ֖עַת וְ/אֵזֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/049.yaml
  text: And he shall take, to purify the house from sin, two birds, cedar wood, scarlet yarn, and hyssop.
translation:
  language: hi
  text: और वह घर को शुद्ध करने के लिए दो पक्षी, देवदार की लकड़ी, लाल रंग का सूत[a] और जूफा ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लाल रंग का धागा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: और वह ... ले
  rationale: विधिक-रीतिगत क्रम में संयोजक सहित पूर्ण क्रिया निर्देशात्मक भाव रखती है; हिन्दी में “ले” स्वाभाविक और गरिमापूर्ण आज्ञार्थक रूप है।
- source_word: לְחַטֵּא אֶת הַבַּיִת
  choice: घर को पाप-अशुद्धि से शुद्ध करने के लिए
  rationale: पिएल रूप यहाँ किसी नैतिक अपराध के लिए घर को क्षमा करने का नहीं, बल्कि रीतिगत दूषण हटाने का संकेत देता है। “पाप-अशुद्धि” मूल धातु के पाप-संबंधी स्वर और प्रसंग की रीतिगत अशुद्धि—दोनों को बनाए रखता है।
- source_word: שְׁתֵּי צִפֳּרִים
  choice: दो पक्षी
  rationale: मूल पाठ केवल दो पक्षियों का उल्लेख करता है; इस पद में “जीवित” नहीं जोड़ा गया।
- source_word: וְעֵץ אֶרֶז
  choice: देवदार की लकड़ी
  rationale: यह रचनात्मक पदबंध सामग्री को दर्शाता है; आधुनिक हिन्दी में यह स्पष्ट और प्रचलित अनुवाद है।
- source_word: וּשְׁנִי תוֹלַעַת
  choice: लाल रंग का सूत
  rationale: यह लाल रंगी हुई धागेनुमा सामग्री को दर्शाता है; “सूत” रीतिगत वस्तु के लिए सहज हिन्दी है।
- source_word: וְאֵזֹב
  choice: जूफा
  rationale: वनस्पति की सटीक पहचान विवादित होने पर भी “जूफा” हिन्दी बाइबलीय परंपरा में पहचाना जाने वाला पारंपरिक नाम है।
theological_decisions:
- issue: לְחַטֵּא का रीतिगत अर्थ, जब उसका कर्म घर है
  choice: पाप-अशुद्धि से शुद्ध करना
  alternative: घर को शुद्ध करना; घर का प्रायश्चित करना
  rationale: प्रसंग दूषित भवन के शुद्धीकरण का है। यह अनुवाद नैतिक क्षमा का भाव नहीं देता, फिर भी धातु חטא से जुड़े पाप-संबंधी आयाम को केवल सामान्य सफाई में विलीन नहीं करता; “प्रायश्चित” कहना इस पद में व्यक्त बात से अधिक विशिष्ट होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, विधिक और गरिमापूर्ण शैली। “पाप-अशुद्धि” कुछ असामान्य होते हुए भी मूल के रीतिगत और पाप-संबंधी तनाव को सुरक्षित रखता है।
