source:
  edition: WLC
  text: כִּ֤י תָבֹ֨אוּ֙ אֶל אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֥ר אֲנִ֛י נֹתֵ֥ן לָ/כֶ֖ם לַ/אֲחֻזָּ֑ה וְ/נָתַתִּי֙ נֶ֣גַע צָרַ֔עַת בְּ/בֵ֖ית אֶ֥רֶץ אֲחֻזַּתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/014/034.yaml
  text: When you enter the land of Canaan that I am giving to you as a possession[a], and I put an outbreak of skin disease in a house in the land of your possession,
translation:
  language: hi
  text: जब तुम कनान देश में प्रवेश करोगे, जिसे मैं तुम्हें अधिकार में देने जा रहा हूँ, और मैं तुम्हारे अधिकार की भूमि के किसी घर में एक रोग-प्रकोप[a] उत्पन्न करूँगा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “कोढ़ का प्रकोप।” इब्रानी शब्द צָרַעַת केवल आधुनिक अर्थ के कुष्ठरोग को नहीं, बल्कि मनुष्यों, वस्त्रों और घरों को प्रभावित करने वाली कई प्रकार की दूषित दशाओं को दर्शाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹאוּ
  choice: जब तुम ... प्रवेश करो
  rationale: כִּי यहाँ भावी परिस्थिति का कालवाचक उपवाक्य आरम्भ करता है; बहुवचन संबोधन को स्वाभाविक हिन्दी में रखा गया है।
- source_word: אֶרֶץ כְּנַעַן
  choice: कनान देश
  rationale: भौगोलिक नाम और क्षेत्रीय अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: जिसे मैं तुम्हें ... दे रहा हूँ
  rationale: נֹתֵן के कृदन्तीय, जारी अथवा निकटवर्ती दैवी कार्य के भाव को सुरक्षित रखता है।
- source_word: לַאֲחֻזָּה / אֶרֶץ אֲחֻזַּתְכֶם
  choice: निज-भूमि / तुम्हारी निज-भूमि
  rationale: אֲחֻזָּה यहाँ स्थायी भू-स्वामित्व या अधिकार में मिली भूमि को दर्शाता है; दोनों प्रयोगों में शब्दगत संबंध बनाए रखा गया है।
- source_word: וְנָתַתִּי
  choice: और मैं ... उत्पन्न करूँ
  rationale: शाब्दिक अर्थ ‘दूँ/रखूँ’ है, पर इस प्रसंग में हिन्दी का ‘उत्पन्न करूँ’ घर में उस दशा के आने को स्वाभाविक रूप से व्यक्त करते हुए परमेश्वर की स्पष्ट कर्तृता बनाए रखता है।
- source_word: נֶגַע צָרַעַת
  choice: चर्मरोग-जैसा प्रकोप
  rationale: נֶגַע दृश्य आघात, दाग या प्रकोप और צָרַעַת लैव्यव्यवस्था की व्यापक दूषित दशा को सूचित करता है। घर के संदर्भ में साधारण ‘चर्मरोग’ असंगत होगा; ‘-जैसा’ मनुष्य, वस्त्र और घर के लिए प्रयुक्त एक ही इब्रानी वर्ग की उपमात्मक व्यापकता दर्शाता है।
- source_word: בְּבֵית
  choice: किसी घर में
  rationale: अनिश्चित संज्ञा और בְּ उपसर्ग को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: घर के प्रकोप में परमेश्वर की कर्तृता
  choice: ‘मैं ... उत्पन्न करूँ’ द्वारा प्रथम पुरुष की स्पष्ट दैवी कर्तृता रखी गई
  alternative: ‘किसी घर में प्रकोप दिखाई दे’ जैसा निर्वैयक्तिक अनुवाद
  rationale: וְנָתַתִּי घटना को सीधे वक्ता परमेश्वर से जोड़ता है। इस कठिन धर्मवैचारिक तनाव को नरम या अस्पष्ट नहीं करना चाहिए।
- issue: צָרַעַת की पहचान
  choice: चर्मरोग-जैसा प्रकोप
  alternative: कोढ़ का प्रकोप / कुष्ठरोग
  rationale: आधुनिक हैन्सेन रोग से सीधी समानता मूल शब्द की व्यापकता को अनुचित रूप से सीमित करती है, विशेषकर जब यह घर पर लागू है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘निज-भूमि’ भूमि-अधिकार के वाचाई संदर्भ को संक्षेप में व्यक्त करता है। पद अगले निर्देश से जुड़ा होने के कारण अंत में अल्पविराम रखा गया है।
