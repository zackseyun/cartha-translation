  yaml_path: translation/ot/leviticus/014/035.yaml
  text: then the owner of the house shall come and tell the priest[a], saying, ‘Something like a plague has appeared to me in the house.’
translation:
  language: hi
  text: 'तब जिस व्यक्ति का वह घर है, वह आकर याजक को यह बताए: “मुझे घर में कोई प्रकोप-सा दिखाई दिया है।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “प्रकोप/दाग-जैसा।” घर का स्वामी केवल दिखाई देने वाली दशा की सूचना देता है; वह उसका निश्चित निदान नहीं करता।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: तब ... आकर
  rationale: विधिक प्रक्रिया में संयोजक सहित यह क्रिया क्रमिक अगला कदम बताती है; ‘तब ... आकर’ आधुनिक हिन्दी में उस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר לוֹ הַבַּיִת
  choice: जिस व्यक्ति का वह घर है
  rationale: इब्रानी का शाब्दिक भाव ‘जिसका घर है’ है। यह हिन्दी में स्वाभाविक है और ‘मालिक’ की अपेक्षा मूल की संबंधवाचक रचना को अधिक निकटता से रखता है।
- source_word: וְהִגִּיד לַכֹּהֵן
  choice: याजक को बताए
  rationale: हिफ़ील क्रिया का अर्थ सूचना देना या बताना है; ‘याजक को बताए’ आधिकारिक सूचना के प्रसंग को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: לֵאמֹר
  choice: — प्रत्यक्ष कथन द्वारा व्यक्त
  rationale: इब्रानी का मानक उद्धरण-सूचक हिन्दी में अलग से ‘यह कहते हुए’ रखने के बजाय सीधे उद्धरण आरम्भ करने से स्वाभाविक रूप में व्यक्त होता है।
- source_word: כְּנֶגַע
  choice: किसी महामारी-जैसा कुछ
  rationale: כְּ अनुमान या समानता व्यक्त करता है, इसलिए गृहस्वामी निश्चित निदान नहीं करता। נֶגַע लैव्यव्यवस्था में प्रभावित दाग/प्रकोप की व्यापक श्रेणी है; ‘महामारी-जैसा’ पारंपरिक गंभीरता रखता है, जबकि ‘कुछ’ कथन की अनिश्चितता बचाता है।
- source_word: נִרְאָה לִי
  choice: मुझे ... दिखाई दिया है
  rationale: निफ़अल रूप का अर्थ ‘दिखाई दिया/प्रकट हुआ’ है। यह गृहस्वामी के सीमित अवलोकन को रखता है, न कि याजकीय निर्णय को।
- source_word: בַּבָּיִת
  choice: घर में
  rationale: בְּ यहाँ प्रभावित संरचना के भीतर या उसमें उपस्थित दशा को व्यापक रूप से सूचित करता है; ‘घर में’ स्वाभाविक और पर्याप्त है।
theological_decisions:
- issue: गृहस्वामी का कथन निदान है या केवल प्रारम्भिक अवलोकन
  choice: 'अनिश्चितता बनाए रखी गई: ‘महामारी-जैसा कुछ’'
  alternative: ‘घर में महामारी है’
  rationale: כְּ और ‘मुझे दिखाई दिया’ बताते हैं कि गृहस्वामी केवल संभावित लक्षण की सूचना देता है; निर्णायक जाँच आगे याजक करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रक्रियात्मक रखी गई है। ‘याजक’ लैव्यव्यवस्था के धार्मिक पद के लिए प्रचलित हिन्दी शब्द है। मुख्य पाठ में ‘महामारी-जैसा’ मूल נֶגַע की गंभीरता दर्शाता है, और पादटिप्पणी स्पष्ट करती है कि यहाँ आधुनिक संक्रामक रोग का निश्चित दावा नहीं है।
