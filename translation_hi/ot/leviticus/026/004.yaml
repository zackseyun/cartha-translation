base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/004.yaml
  text: then I will give you your rains in their season[a], and the land will yield its produce[b], and the tree of the field will give their fruit.
translation:
  language: hi
  text: तब मैं तुम्हें नियत समय पर वर्षा दूँगा[a], और भूमि अपनी उपज देगी, और खेत के वृक्ष अपने फल देंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वर्षाओं के नियत समय पर।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “खेत का वृक्ष” एकवचन रूप में है, पर उसका अर्थ सामूहिक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: मैं दूँगा
  rationale: נתן का सामान्य अर्थ ‘देना’ है; यह वाचा की प्रतिज्ञा को बिना अतिरिक्त व्याख्या के सीधे व्यक्त करता है।
- source_word: גִשְׁמֵיכֶם
  choice: तुम्हें ... वर्षा
  rationale: इब्रानी बहुवचन मौसमी वर्षाओं को सूचित करता है। हिन्दी में ‘तुम्हारी वर्षाएँ’ अस्वाभाविक है, इसलिए लाभार्थी प्रत्यय को ‘तुम्हें’ और संज्ञा को सामूहिक एकवचन ‘वर्षा’ से व्यक्त किया गया है।
- source_word: בְּעִתָּם
  choice: ठीक समय पर
  rationale: इस पदबंध का आशय वर्षा का उपयुक्त या नियत समय है; ‘ठीक समय पर’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְנָתְנָה הָאָרֶץ
  choice: और भूमि ... देगी
  rationale: क्रिया נתן की पुनरावृत्ति को ‘देगी’ से सुरक्षित रखा गया है; कृषि-संदर्भ में ‘भूमि अपनी उपज देगी’ स्वाभाविक हिन्दी है।
- source_word: יְבוּלָהּ
  choice: अपनी उपज
  rationale: יְבוּל भूमि से प्राप्त व्यापक कृषि-उत्पादन को दर्शाता है; ‘उपज’ संक्षिप्त और सामान्य हिन्दी है।
- source_word: וְעֵץ הַשָּׂדֶה
  choice: मैदान के वृक्ष
  rationale: इब्रानी में एकवचन का सामूहिक प्रयोग है। हिन्दी में बहुवचन ‘वृक्ष’ उसी सामूहिक अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִתֵּן פִּרְיוֹ
  choice: अपने फल देंगे
  rationale: ‘देंगे’ נתן की पुनरावृत्ति बनाए रखता है; सामूहिक संज्ञा को हिन्दी में बहुवचन करने के कारण सर्वनाम और क्रिया भी बहुवचन हैं।
theological_decisions:
- issue: आज्ञापालन से जुड़ी वाचा की कृषि-संबंधी आशीष
  choice: वर्षा, भूमि की उपज और वृक्षों के फल की ठोस प्रतिज्ञा को सीधे प्रस्तुत किया गया है।
  alternative: इसे सर्वकालिक भौतिक समृद्धि की सामान्य प्रतिज्ञा बनाना या पूरी तरह आत्मिक रूपक मानना।
  rationale: संदर्भ में यह इस्राएल के लिए वाचा के अंतर्गत वास्तविक कृषि-संबंधी आशीष है; अनुवाद बाद की धर्मवैचारिक व्याख्याएँ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मैदान के वृक्ष’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी मूल के सामूहिक एकवचन को सुरक्षित करती है।
