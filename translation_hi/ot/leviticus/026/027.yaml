  text: וְ/אִ֨ם בְּ/זֹ֔את לֹ֥א תִשְׁמְע֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י בְּ/קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/027.yaml
  text: But if in spite of this you will not listen to me[a], and you walk contrary to me[b],
translation:
  language: hi
  text: पर यदि इस सब के बावजूद[a] तुम मेरी बात न सुनो और मेरे विरोध में चलते रहो[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस सब के बाद भी।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में कठिन मुहावरा है, जिसका शाब्दिक रूप लगभग ‘मेरे साथ विरोध में चलो’ है; इसका भाव परमेश्वर के प्रति विरोधी या शत्रुतापूर्ण आचरण करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: पर यदि
  rationale: यह आगे की सशर्त चेतावनी आरम्भ करता है और पिछले अनुशासन के बाद भी बने रहने वाले विरोध को दर्शाता है।
- source_word: בְּזֹאת
  choice: इस सब के बावजूद
  rationale: संदर्भ में यह पहले बताए गए दण्डात्मक अनुशासन की ओर संकेत करता है और रियायती भाव रखता है—‘इस सब के बाद भी।’
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: तुम मेरी बात न सुनो
  rationale: שׁמע में सुनने के साथ बात मानने का भाव भी है; यह अनुवाद श्रवण-रूपक को बनाए रखते हुए आज्ञापालन का निहितार्थ खुला रखता है।
- source_word: וַהֲלַכְתֶּם
  choice: चलते रहो
  rationale: הלך यहाँ आचरण या जीवन-व्यवहार का मुहावरा है; ‘चलते रहो’ चेतावनियों के क्रम में जारी व्यवहार का स्वाभाविक हिन्दी रूप है।
- source_word: עִמִּי בְּקֶרִי
  choice: मेरे विरोध में
  rationale: शाब्दिक संरचना ‘मेरे साथ ... में’ है, पर कठिन शब्द קֶרִי के साथ पूरा पद परमेश्वर के प्रति विरोधी आचरण का संबंधपरक मुहावरा बनता है। ‘मेरे विरोध में चलते रहो’ उसके अर्थ और चलने के बिंब दोनों को बनाए रखता है।
theological_decisions:
- issue: लैव्यव्यवस्था 26 में वाचा-संबंधी चेतावनी का मुहावरा
  choice: ‘मेरे विरोध में चलते रहो’ कहकर संबंधपरक ‘चलने’ का बिंब बनाए रखा गया है।
  alternative: ‘मेरे साथ शत्रुता का व्यवहार करो’ या ‘मेरी आज्ञा न मानते रहो’
  rationale: मूल पाठ केवल आज्ञा न मानने की बात नहीं करता, बल्कि वाचा के संबंध में विरोधी रुख का वर्णन करता है। चुना हुआ रूप इस तनाव को किसी संप्रदायगत व्याख्या से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और संबोधन की बहुवचन शैली रखी गई है। वाक्य अगले पद से जुड़ी शर्त होने के कारण अंत में अल्पविराम रखा गया है।
