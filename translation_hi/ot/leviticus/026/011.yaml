  text: וְ/נָתַתִּ֥י מִשְׁכָּנִ֖/י בְּ/תוֹכְ/כֶ֑ם וְ/לֹֽא תִגְעַ֥ל נַפְשִׁ֖/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/011.yaml
  text: And I will set my dwelling place among you, and my soul will not abhor you.
translation:
  language: hi
  text: मैं तुम्हारे बीच अपना निवासस्थान स्थापित करूँगा, और मेरा प्राण तुमसे घृणा नहीं करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכָּנִי
  choice: अपना निवासस्थान
  rationale: यह शब्द परमेश्वर के निवास या पवित्र निवास की ओर संकेत करता है; ‘निवासस्थान’ इस अर्थ को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: मूल में स्पष्ट रूप से ‘मेरा नेफेश’ है। ‘मेरा प्राण’ इस व्यक्तिपरक, सजीव अभिव्यक्ति को बनाए रखता है, इसे केवल ‘मैं’ में समतल नहीं करता।
- source_word: תִגְעַל
  choice: घृणा करेगा
  rationale: क्रिया का अर्थ विकर्षण, अरुचि या घृणा से अस्वीकार करना है; ‘घृणा करना’ संदर्भ में स्वाभाविक और पर्याप्त रूप से प्रबल है।
theological_decisions:
- issue: परमेश्वर के लिए נַפְשִׁי का मानव-सदृश प्रयोग
  choice: ‘मेरा प्राण’ को स्पष्ट रूप से रखा गया
  alternative: ‘मैं तुमसे घृणा नहीं करूँगा’
  rationale: मूल पाठ की मानव-सदृश और धर्मवैचारिक रूप से तनावपूर्ण भाषा को व्याख्यात्मक ढंग से सरल करने के बजाय संरक्षित किया गया है।
- issue: מִשְׁכָּן का अर्थ
  choice: निवासस्थान
  alternative: पवित्र तम्बू
  rationale: इस प्रतिज्ञात्मक संदर्भ में शब्द परमेश्वर के उनके बीच निवास को प्रमुखता देता है; केवल ऐतिहासिक तम्बू की वस्तु तक अर्थ को सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए सहज रखा गया है। ‘तुम्हारे’ बहुवचन समुदाय को संबोधित करता है।
