base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/029.yaml
  text: And you will eat the flesh of your sons, and you will eat the flesh of your daughters.
translation:
  language: hi
  text: और तुम अपने बेटों का मांस खाओगे, और अपनी बेटियों का मांस खाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: और तुम ... खाओगे
  rationale: אכל के क़ाल द्वितीय पुरुष बहुवचन रूप और पूर्वसर्गीय वाव को न्याय-वचनों के क्रम में सीधी भविष्यवाणी के रूप में रखा गया है।
- source_word: בְּשַׂר
  choice: मांस
  rationale: यहाँ בָּשָׂר शरीर के मांस को दर्शाता है; ‘मांस’ इस भयावह, शाब्दिक अर्थ को बिना नरम किए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵיכֶם
  choice: अपने बेटों का
  rationale: पुल्लिंग बहुवचन ‘बेटों’ को विशिष्ट रखा गया है, क्योंकि अगली पंक्ति में बेटियों का अलग उल्लेख है।
- source_word: וּבְשַׂר
  choice: और ... मांस
  rationale: स्रोत में संज्ञा की पुनरावृत्ति समानांतरता और प्रबलता के लिए है; हिन्दी में भी इसे बनाए रखा गया है।
- source_word: בְּנֹתֵיכֶם
  choice: अपनी बेटियों का
  rationale: प्रत्यक्ष स्त्रीलिंग बहुवचन अनुवाद स्रोत के बेटे-बेटियों के स्पष्ट युग्म को सुरक्षित रखता है।
- source_word: תֹּאכֵלוּ
  choice: खाओगे
  rationale: दूसरी क्रिया को छोड़ा नहीं गया, ताकि इब्रानी की पुनरावृत्ति, समानांतर संरचना और चेतावनी का बल बना रहे।
theological_decisions:
- issue: वाचा के शाप में नरभक्षण का कथन
  choice: इसे सीधी भविष्यसूचक चेतावनी के रूप में शाब्दिक और स्पष्ट रखा गया है।
  alternative: अर्थ को नरम करने वाला मुहावरेदार अनुवाद
  rationale: पद की भयावहता को कम करना या अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़ना स्रोत के स्पष्ट न्याय-वचन को बदल देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गंभीर और गरिमापूर्ण शैली। ‘मांस’ की पुनरावृत्ति तथा ‘बेटों/बेटियों’ का स्पष्ट युग्म मूल पाठ की समानांतरता बनाए रखते हैं।
