base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/026.yaml
  text: When I break your supply of bread[a], ten women will bake your bread in a single oven and return your bread by weight; and you will eat, but you will not be satisfied.
translation:
  language: hi
  text: जब मैं तुम्हारी रोटी का आधार[a] तोड़ दूँगा, तब दस स्त्रियाँ एक ही तंदूर में तुम्हारी रोटी पकाएँगी और उसे तौलकर तुम्हें लौटाएँगी; तुम खाओगे, पर तृप्त नहीं होगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “रोटी की लाठी”; रोटी की जीवन-निर्वाहक आपूर्ति या आधार के लिए एक मुहावरा।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְרִי
  choice: जब मैं ... तोड़ दूँगा
  rationale: ב prefixed infinitive construct temporal clause बनाता है। ‘तोड़ दूँगा’ मूल रूपक और भावी दण्ड, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מַטֵּה לֶחֶם
  choice: तुम्हारी रोटी का सहारा
  rationale: शाब्दिक ‘रोटी की लाठी’ जीविका को थामने वाली रोटी का मुहावरा है। ‘रोटी का सहारा’ उसके रूपक और अभाव के आशय, दोनों को बनाए रखता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וְאָפוּ עֶשֶׂר נָשִׁים
  choice: दस स्त्रियाँ ... पकाएँगी
  rationale: मूल में स्त्रियों का स्पष्ट उल्लेख है और क्रिया भावी परिणाम बताती है। ‘रोटी पकाना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּתַנּוּר אֶחָד
  choice: एक ही तंदूर में
  rationale: ‘एक ही’ भीषण कमी पर बल देता है; तַנּוּר का स्वाभाविक हिन्दी समतुल्य ‘तंदूर’ है।
- source_word: וְהֵשִׁיבוּ לַחְמְכֶם בַּמִּשְׁקָל
  choice: उसे तौलकर तुम्हें लौटाएँगी
  rationale: השיב का कारणार्थक भाव ‘वापस करना’ है और בַּמִּשְׁקָל राशन के रूप में वजन से दिए जाने को दर्शाता है।
- source_word: וַאֲכַלְתֶּם וְלֹא תִשְׂבָּעוּ
  choice: तुम खाओगे, पर तृप्त नहीं होगे
  rationale: שׂבע भोजन से भरने या तृप्त होने को व्यक्त करता है। ‘तृप्त’ भूख न मिटने का अर्थ गरिमापूर्ण और स्पष्ट ढंग से देता है।
