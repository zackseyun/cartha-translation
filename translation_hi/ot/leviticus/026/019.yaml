source:
  edition: WLC
  text: וְ/שָׁבַרְתִּ֖י אֶת גְּא֣וֹן עֻזְּ/כֶ֑ם וְ/נָתַתִּ֤י אֶת שְׁמֵי/כֶם֙ כַּ/בַּרְזֶ֔ל וְ/אֶֽת אַרְצְ/כֶ֖ם כַּ/נְּחֻשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/019.yaml
  text: And I will break the pride of your strength[b][a], and I will make your heavens like iron and your land like bronze.
translation:
  language: hi
  text: और मैं तुम्हारे बल के घमंड को तोड़ दूँगा और तुम्हारे आकाश[a] को लोहे के समान और तुम्हारी भूमि को काँसे[b] के समान कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ बहुवचन रूप ‘तुम्हारे आकाशों’ है, जो प्रायः ऊपर के आकाश के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘ताँबे के समान।’ इब्रानी शब्द ताँबे या काँसे, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: और मैं ... तोड़ दूँगा
  rationale: שׁבר का सामान्य अर्थ ‘तोड़ना’ है। ‘तोड़ दूँगा’ भावी दंड की निश्चितता और हिंदी की स्वाभाविक अभिव्यक्ति दोनों को व्यक्त करता है।
- source_word: גְּאוֹן עֻזְּכֶם
  choice: तुम्हारे बल का घमंड
  rationale: גְּאוֹן यहाँ विद्रोही आत्मनिर्भरता के नकारात्मक अर्थ में ‘घमंड’ और עֹז ‘बल’ को दर्शाता है। संबंधकारक रचना को यथासंभव सुरक्षित रखा गया है।
- source_word: וְנָתַתִּי
  choice: कर दूँगा
  rationale: נתן का मूल अर्थ ‘देना/ठहराना’ है, पर इस तुलनात्मक रचना में किसी वस्तु को दूसरी के समान बना देने का परिणाम व्यक्त होता है।
- source_word: שְׁמֵיכֶם
  choice: तुम्हारे आकाश
  rationale: इब्रानी में रूप बहुवचन है, पर हिंदी में ऊपर के आकाश के लिए स्वाभाविक मानक रूप ‘आकाश’ है। स्रोत-रूप की जानकारी पादटिप्पणी में दी गई है।
- source_word: כַּבַּרְזֶל
  choice: लोहे के समान
  rationale: यह उपमा वर्षा न देने वाले कठोर, अडिग आकाश का चित्र प्रस्तुत करती है; ‘लोहे के समान’ स्रोत की उपमा को स्पष्ट और गरिमापूर्ण ढंग से रखता है।
- source_word: אַרְצְכֶם
  choice: तुम्हारी भूमि
  rationale: אֶרֶץ इस वाचा-संबंधी कृषि प्रसंग में देश की भूमि अथवा मिट्टी को सूचित करता है; ‘भूमि’ दोनों पहलुओं को स्वाभाविक रूप से समेटता है।
- source_word: כַּנְּחֻשָׁה
  choice: काँसे के समान
  rationale: נְחֻשָׁה ताँबे या काँसे को सूचित कर सकता है। इस पारंपरिक कठोर भूमि की उपमा में ‘काँसा’ स्वाभाविक है, जबकि ‘ताँबा’ पादटिप्पणी में विकल्प के रूप में रखा गया है।
theological_decisions:
- issue: शाप के रूपक का आशय
  choice: आकाश और भूमि को क्रमशः लोहे और काँसे के समान बताने वाले मूल रूपक को बनाए रखा गया है।
  alternative: मुख्य पाठ में इसे सीधे सूखा और भूमि की अनुपजाऊता कहना।
  rationale: वाचा के शाप के प्रसंग में यह चित्र सूखे और कृषि-विफलता की ओर संकेत करता है, पर मूल पाठ परिणाम की व्याख्या करने के बजाय रूपक देता है; इसलिए निहितार्थ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सहज और गरिमापूर्ण रखी गई है। ‘बल का घमंड’ मूल संबंधकारक रचना और उसके नकारात्मक भाव को बनाए रखता है। पादटिप्पणी-चिह्न संबंधित शब्दों—‘आकाश’ और ‘काँसे’—के तुरंत बाद रखे गए हैं।
