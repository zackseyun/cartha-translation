  text: Then I will remember my covenant with Jacob[a], and also my covenant with Isaac, and also my covenant with Abraham I will remember; and I will remember the land.
translation:
  language: hi
  text: तब मैं याकूब के साथ अपनी वाचा को स्मरण करूँगा[a]; और इसहाक के साथ अपनी वाचा को भी, और अब्राहम के साथ अपनी वाचा को भी स्मरण करूँगा; और मैं उस देश को स्मरण करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘और मैं स्मरण करूँगा।’ इब्रानी संयोजक का सीधा अनुवाद ‘और’ हो सकता है; ‘तब’ पिछले प्रसंग के साथ इस पद का संबंध व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: तब मैं ... स्मरण करूँगा
  rationale: זכר को उसके मूल अर्थ ‘स्मरण करना’ से अनूदित किया गया है; वाचा के संदर्भ में इससे आगे की कार्रवाई निहित हो सकती है, पर उसे पाठ में जोड़कर स्पष्ट नहीं किया गया। आरंभिक וְ को पिछले प्रसंग से परिणामात्मक संबंध दिखाने के लिए ‘तब’ कहा गया है, जबकि उसका सरल अर्थ ‘और’ भी संभव है।
- source_word: בְּרִיתִי
  choice: मेरे साथ बाँधी अपनी वाचा
  rationale: בְּרִית का मानक और धर्मवैज्ञानिक रूप से उपयुक्त हिन्दी प्रतिशब्द ‘वाचा’ है। सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘के साथ बाँधी अपनी वाचा’ प्रयोग किया गया है।
- source_word: וְאַף
  choice: और ... को भी
  rationale: यह संयोजन क्रमवृद्धि और बल दोनों देता है; ‘और ... भी’ आधुनिक हिन्दी में दोनों विशेषताओं को स्वाभाविक ढंग से रखता है।
- source_word: יַעֲקֹב / יִצְחָק / אַבְרָהָם
  choice: याकूब / इसहाक / अब्राहम
  rationale: व्यक्तिनामों के प्रचलित मानक हिन्दी बाइबलीय रूप रखे गए हैं।
- source_word: אֶזְכֹּר
  choice: स्मरण करूँगा
  rationale: इब्रानी में अब्राहम के बाद क्रिया की पुनरावृत्ति अलंकारिक बल देती है; इसलिए इसे हटाकर वाक्य को संक्षिप्त नहीं किया गया।
- source_word: וְהָאָרֶץ
  choice: और ... उस देश को
  rationale: संदर्भ में אֶרֶץ वाचा से जुड़े विशिष्ट देश की ओर संकेत करता है; हिन्दी में निश्चित संदर्भ को स्पष्ट और स्वाभाविक बनाने के लिए ‘उस देश’ चुना गया।
theological_decisions:
- issue: पूर्वजों की वाचाओं का क्रम और बल
  choice: याकूब, इसहाक, अब्राहम का इब्रानी क्रम और प्रत्येक के साथ ‘अपनी वाचा’ की पुनरावृत्ति सुरक्षित रखी गई।
  alternative: कालक्रम के अनुसार अब्राहम, इसहाक, याकूब करना, अथवा तीनों को एक संयुक्त पदबंध में समेटना।
  rationale: मूल पाठ का उलटा कालक्रम और दोहराव जानबूझकर दिया गया अलंकारिक बल है; उसे बदलना या समेटना स्रोत की बनावट को मिटा देता।
- issue: परमेश्वर के ‘स्मरण’ का अर्थ
  choice: स्मरण करूँगा
  alternative: ध्यान करके कार्य करूँगा; फिर से स्थापित करूँगा
  rationale: वाचा के प्रसंग में दिव्य स्मरण कार्रवाई की ओर संकेत कर सकता है, फिर भी मूल पाठ केवल ‘स्मरण’ कहता है। उसी तनाव को बनाए रखते हुए व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘वाचा’ स्थापित बाइबलीय शब्द है। इब्रानी की पुनरावृत्ति और पूर्वजों का असामान्य क्रम सुरक्षित रखा गया है।
