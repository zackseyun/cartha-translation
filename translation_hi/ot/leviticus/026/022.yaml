source:
  edition: WLC
  text: וְ/הִשְׁלַחְתִּ֨י בָ/כֶ֜ם אֶת חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/שִׁכְּלָ֣ה אֶתְ/כֶ֔ם וְ/הִכְרִ֨יתָה֙ אֶת בְּהֶמְתְּ/כֶ֔ם וְ/הִמְעִ֖יטָה אֶתְ/כֶ֑ם וְ/נָשַׁ֖מּוּ דַּרְכֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/022.yaml
  text: And I will send against you the wild animals of the field[a], and they will bereave you, cut off your livestock, reduce your number[c][b], and your roads will become desolate.
translation:
  language: hi
  text: और मैं तुम्हारे विरुद्ध खुले मैदान के जंगली पशुओं[a] को भेजूँगा। वे तुम्हें संतान-विहीन कर देंगे[b], तुम्हारे पालतू पशुओं का नाश कर देंगे, तुम्हारी संख्या घटा देंगे, और तुम्हारे रास्ते उजाड़ हो जाएँगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैदान के वन-पशु।”
    reason: חַיַּת הַשָּׂדֶה का अधिक शाब्दिक विकल्प।
  - marker: b
    text: इब्रानी क्रिया विशेषतः संतान की हानि से किसी को शोकित या निरसंतान करने का भाव रखती है; ‘संतान’ यहाँ निहित है, अलग से लिखी नहीं गई है।
    reason: मुख्य पाठ में स्पष्ट किए गए इब्रानी मुहावरे और उसकी निहित वस्तु को दर्शाना।
  - marker: c
    text: या “तुम्हारे मार्ग उजाड़ हो जाएँगे।” यहाँ आशय सम्भवतः आवागमन के मार्गों के निर्जन हो जाने से है।
    reason: דֶּרֶךְ और נשׁם के सम्भव शाब्दिक प्रतिरूप को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהִשְׁלַחְתִּי בָכֶם
  choice: मैं तुम्हारे विरुद्ध ... भेजूँगा
  rationale: हिफ़ील रूप का सामान्य अर्थ ‘भेजना’ है; शत्रुतापूर्ण प्रसंग में בָכֶם को ‘तुम्हारे विरुद्ध’ कहना स्वाभाविक और दंडात्मक भाव के अनुरूप है।
- source_word: חַיַּת הַשָּׂדֶה
  choice: मैदान के जंगली पशुओं
  rationale: यह पद खुले भूभाग में रहने वाले जंगली पशुओं के वर्ग को दर्शाता है। ‘मैदान के जंगली पशु’ मूल संरचना को रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: וְשִׁכְּלָה אֶתְכֶם
  choice: वे तुम्हें संतान-विहीन कर देंगे
  rationale: שׁכל का पिएल रूप सामान्यतः संतान की मृत्यु के कारण वंचित होने का अर्थ देता है। हिन्दी में ‘संतान-विहीन कर देंगे’ इस मुहावरे का आशय स्पष्ट करता है; निहित अर्थ को पाद-टिप्पणी में बताया गया है।
- source_word: וְהִכְרִיתָה אֶת בְּהֶמְתְּכֶם
  choice: तुम्हारे पालतू पशुओं का नाश कर देंगे
  rationale: הכרית यहाँ पूर्ण विनाश या मिटा देने का भाव रखता है। हिन्दी में ‘काट डालेंगे’ पशुओं की हत्या तक सीमित समझा जा सकता है, जबकि ‘नाश कर देंगे’ सामूहिक विनाश को स्वाभाविक रूप से व्यक्त करता है। בְּהֵמָה यहाँ घरेलू पशुधन है।
- source_word: וְהִמְעִיטָה אֶתְכֶם
  choice: तुम्हारी संख्या घटा देंगे
  rationale: מעט के हिफ़ील का अर्थ ‘कम कर देना’ है; इस प्रसंग में समुदाय की जनसंख्या घटने का आशय स्पष्ट है।
- source_word: וְנָשַׁמּוּ דַּרְכֵיכֶם
  choice: तुम्हारे मार्ग सुनसान हो जाएँगे
  rationale: נשׁם उजड़ने या निर्जन होने को दर्शाता है। यहाँ बहुवचन דֶּרֶךְ सामाजिक विनाश के फलस्वरूप वीरान पड़े रास्तों या आवागमन के मार्गों की ओर संकेत करता है।
theological_decisions:
- issue: शोक-वंचना वाले पद में निहित वस्तु
  choice: मुख्य पाठ में ‘संतान-विहीन’ कहकर पारंपरिक मुहावरे का आशय स्पष्ट किया गया
  alternative: केवल ‘वे तुम्हें वंचित कर देंगे’ या ‘वे तुम्हें शोकग्रस्त कर देंगे’
  rationale: इब्रानी में ‘संतान’ अलग से लिखी नहीं है, पर שׁכל का यह प्रयोग प्रायः संतान खोने को व्यक्त करता है। पाद-टिप्पणी इस निहितता को पारदर्शी रखती है और मूल की शब्दगत संक्षिप्तता को छिपाती नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन वक्ता के भविष्यकालीन न्याय और बहुवचन स्त्रीलिंग पशु-वर्ग से जुड़ी क्रियाओं को हिन्दी में स्वाभाविक बहुवचन ‘वे’ द्वारा व्यक्त किया गया है। ‘मार्ग’ साहित्यिक किंतु प्रचलित शब्द है; ‘सुनसान’ भौतिक रास्तों की निर्जनता स्पष्ट करता है।
