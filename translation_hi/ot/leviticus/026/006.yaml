source:
  edition: WLC
  text: וְ/נָתַתִּ֤י שָׁלוֹם֙ בָּ/אָ֔רֶץ וּ/שְׁכַבְתֶּ֖ם וְ/אֵ֣ין מַחֲרִ֑יד וְ/הִשְׁבַּתִּ֞י חַיָּ֤ה רָעָה֙ מִן הָ/אָ֔רֶץ וְ/חֶ֖רֶב לֹא תַעֲבֹ֥ר בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/006.yaml
  text: And I will give peace in the land[a], and you will lie down, with no one making you afraid. And I will remove harmful beasts from the land[b], and the sword will not pass through your land.
translation:
  language: hi
  text: और मैं देश में शान्ति दूँगा; तुम लेटोगे और कोई तुम्हें भयभीत न करेगा। मैं देश में से खतरनाक जंगली पशुओं को दूर कर दूँगा, और तलवार[a] तुम्हारे देश में से होकर नहीं गुज़रेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तलवार” यहाँ युद्ध या सशस्त्र आक्रमण का प्रतीक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי שָׁלוֹם
  choice: और मैं ... शान्ति दूँगा
  rationale: נתן का सीधा अर्थ ‘देना’ है और שָׁלוֹם यहाँ वाचा के अधीन सुरक्षा तथा व्यापक कुशलता को व्यक्त करता है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: אֶרֶץ यहाँ इस्राएल को दिए गए भूभाग की ओर संकेत करता है; आधुनिक हिन्दी में ‘देश’ स्वाभाविक रहते हुए ठोस भौगोलिक अर्थ रखता है।
- source_word: וּשְׁכַבְתֶּם
  choice: तुम लेटोगे
  rationale: שׁכב के प्रत्यक्ष बिम्ब को बनाए रखता है और सुरक्षित विश्राम का संकेत देता है, बिना इसे केवल नींद तक सीमित किए।
- source_word: וְאֵין מַחֲרִיד
  choice: और कोई तुम्हें भयभीत न करेगा
  rationale: מַחֲרִיד के भय उत्पन्न करने वाले कारक और कारणवाचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִשְׁבַּתִּי
  choice: मैं ... दूर कर दूँगा
  rationale: שׁבת के हिफ़ील रूप का अर्थ ‘समाप्त कर देना/हटा देना’ है; सन्दर्भ में पशुओं की धमकी का देश से दूर होना अभिप्रेत है।
- source_word: חַיָּה רָעָה
  choice: खतरनाक जंगली पशुओं
  rationale: חַיָּה पशु को और רָעָה यहाँ नैतिक बुराई नहीं, बल्कि हानिकारक या खतरनाक स्वभाव को बताता है। ‘जंगली’ से लक्षित पशुओं का प्रकार भी स्पष्ट होता है।
- source_word: וְחֶרֶב
  choice: और तलवार
  rationale: शाब्दिक बिम्ब को सुरक्षित रखा गया है; यहाँ तलवार युद्ध या सशस्त्र आक्रमण का लक्षणालंकार है।
- source_word: לֹא תַעֲבֹר בְּאַרְצְכֶם
  choice: तुम्हारे देश में से होकर नहीं गुज़रेगी
  rationale: עבר के ‘में से होकर गुजरने’ के ठोस बिम्ब तथा दूसरे बहुवचन स्वामित्वसूचक प्रत्यय, दोनों को बनाए रखता है।
theological_decisions:
- issue: प्रतिज्ञात शान्ति का दायरा
  choice: देश में भय, खतरनाक पशुओं और सैन्य आक्रमण से सुरक्षा सहित ठोस वाचा-संबंधी शान्ति
  alternative: केवल आन्तरिक आत्मिक शान्ति अथवा केवल राजनीतिक शान्ति
  rationale: सुरक्षित लेटने, खतरनाक पशुओं और तलवार के स्पष्ट उल्लेख प्रतिज्ञा को भौतिक जीवन में स्थापित करते हैं, जबकि ‘शान्ति’ का व्यापक अर्थ अनावश्यक रूप से संकुचित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘शान्ति’ और ‘तलवार’ जैसे परिचित बाइबिलीय शब्द बनाए गए हैं, जबकि वाक्यरचना को स्वाभाविक हिन्दी के अनुसार रखा गया है।
