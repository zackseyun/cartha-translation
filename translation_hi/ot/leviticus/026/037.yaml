  text: וְ/כָשְׁל֧וּ אִישׁ בְּ/אָחִ֛י/ו כְּ/מִ/פְּנֵי חֶ֖רֶב וְ/רֹדֵ֣ף אָ֑יִן וְ/לֹא תִֽהְיֶ֤ה לָ/כֶם֙ תְּקוּמָ֔ה לִ/פְנֵ֖י אֹֽיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/037.yaml
  text: They will stumble over one another as if before a sword[a], though no one is pursuing[b]; and you will have no power to stand before your enemies.
translation:
  language: hi
  text: वे एक-दूसरे पर ठोकर खाकर लड़खड़ाएँगे, मानो तलवार के सामने हों[a], जबकि उनका पीछा करने वाला कोई न होगा; और तुम अपने शत्रुओं के सामने टिक न सकोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एक व्यक्ति अपने भाई पर ठोकर खाएगा, मानो तलवार के सामने।” यहाँ घबराहट में एक-दूसरे से टकराने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारे लिए अपने शत्रुओं के सामने खड़े रहने की कोई सामर्थ्य न होगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשְׁלוּ
  choice: लड़खड़ाएँगे
  rationale: כשל ठोकर खाने, लड़खड़ाने या गिरने की ओर बढ़ने का ठोस बिंब देता है। यहाँ “लड़खड़ाएँगे” घबराहट में संतुलन खोने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ בְּאָחִיו
  choice: एक-दूसरे से टकराकर
  rationale: शाब्दिक रूप “एक व्यक्ति अपने भाई में/से” है, पर यहाँ वितरणात्मक और पारस्परिक अर्थ है। प्रसंग में आतंक के कारण आपस में टकराना अभिप्रेत है।
- source_word: כְּמִפְּנֵי חֶרֶב
  choice: मानो तलवार उनके सामने हो
  rationale: כ और מִפְּנֵי मिलकर “मानो तलवार के सामने/उससे बचते हुए” का बिंब बनाते हैं। मूल में भागने की क्रिया स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: וְרֹדֵף אָיִן
  choice: जबकि उनका पीछा करने वाला कोई न होगा
  rationale: मूल कथन है कि कोई पीछा करने वाला मौजूद नहीं होगा। “जबकि” उस विरोधाभास को स्पष्ट करता है कि वे बिना पीछा किए भी भय से ऐसे लड़खड़ाएँगे।
- source_word: וְלֹא תִהְיֶה לָכֶם תְּקוּמָה
  choice: तुम ... टिक न सकोगे
  rationale: תְּקוּמָה उठने, खड़े रहने या सामना करते हुए टिके रहने की क्षमता को सूचित करता है। शत्रुओं के प्रसंग में “टिक न सकोगे” प्रतिरोध करने में असमर्थता को सहज हिन्दी में व्यक्त करता है।
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: अपने शत्रुओं के सामने
  rationale: לִפְנֵי का सामान्य स्थानिक और सामना-सूचक अर्थ “के सामने” है; शत्रुतापूर्ण प्रसंग में यही स्वाभाविक है।
