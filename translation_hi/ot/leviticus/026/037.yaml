translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। “टिक न सकोगे” सैन्य-संघर्ष में सामना न कर पाने का भाव देता है, जबकि पादटिप्पणी मूल संज्ञा תְּקוּמָה की अधिक औपचारिक अभिव्यक्ति सुरक्षित रखती है।
