- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पद पहले कही गई आशीषों के विपरीत स्थिति प्रस्तुत करता है; इसलिए संयोजक और शर्त दोनों को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: तुम मेरी बात नहीं सुनोगे
  rationale: שׁמע ל में सुनने के साथ आज्ञा मानने का भाव भी हो सकता है। मुख्य पाठ में सुनने की मूल छवि और अगले उपवाक्य से उसका भेद सुरक्षित रखा गया है।
- source_word: וְלֹא תַעֲשׂוּ
  choice: और ... पालन नहीं करोगे
  rationale: कानूनी सन्दर्भ में עשה का अर्थ आज्ञाओं को करना या कार्यान्वित करना है; हिन्दी में ‘आज्ञाओं का पालन करना’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: इन सब आज्ञाओं का
  rationale: כָּל, מִצְוֺת और הָאֵלֶּה को क्रमशः ‘सब,’ ‘आज्ञाओं’ और ‘इन’ से व्यक्त करते हुए वाचा-संबंधी कानूनी भाषा बनाए रखी गई है।
theological_decisions:
- issue: שׁמע ל को केवल ‘सुनना’ कहा जाए या ‘आज्ञा मानना’
  choice: मेरी बात सुनना
  alternative: मेरी आज्ञा मानना
  rationale: इब्रानी पहले परमेश्वर की बात सुनने और फिर आज्ञाओं को करने का उल्लेख करता है। चुना हुआ पाठ इस भेद को बनाए रखता है, जबकि पादटिप्पणी में आज्ञापालन का निहित भाव बताया गया है।
