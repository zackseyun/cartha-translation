source:
  edition: WLC
  text: וְ/הִשִּׂ֨יג לָ/כֶ֥ם דַּ֨יִשׁ֙ אֶת בָּצִ֔יר וּ/בָצִ֖יר יַשִּׂ֣יג אֶת זָ֑רַע וַ/אֲכַלְתֶּ֤ם לַחְמְ/כֶם֙ לָ/שֹׂ֔בַע וִֽ/ישַׁבְתֶּ֥ם לָ/בֶ֖טַח בְּ/אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/005.yaml
  text: Your threshing will last for you until the grape harvest, and the grape harvest will last until sowing; and you will eat your bread to the full and live securely in your land.
translation:
  language: hi
  text: तुम्हारी मड़ाई अंगूर की तुड़ाई तक चलती रहेगी, और अंगूर की तुड़ाई बोआई तक चलती रहेगी। तुम भरपेट रोटी खाओगे और अपने देश में निश्चिन्त रहोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּיִשׁ
  choice: दँवाई
  rationale: यह अनाज से दाना अलग करने की कृषि-प्रक्रिया को दर्शाता है; आधुनिक ग्रामीण हिंदी में संक्षिप्त और सटीक शब्द है।
- source_word: בָּצִיר
  choice: अंगूर की कटनी
  rationale: यह विशेष रूप से अंगूर की फसल काटने का समय है; केवल ‘कटनी’ कहने से स्रोत की विशिष्टता खो जाती।
- source_word: יַשִּׂיג / הִשִּׂיג
  choice: तक चलेगी
  rationale: शाब्दिक अर्थ ‘जा पहुँचना/पकड़ लेना’ है, पर यहाँ लगातार प्रचुर उपज के कारण एक कृषि-कार्य के अगले ऋतु तक चलते रहने का भाव है।
- source_word: לָשֹׂבַע
  choice: भरपेट
  rationale: तृप्ति और पर्याप्त भोजन का स्वाभाविक हिंदी रूप।
- source_word: לָבֶטַח
  choice: सुरक्षित
  rationale: निर्भयता और सुरक्षा की अवस्था व्यक्त करता है, बिना भाव को अनावश्यक रूप से विस्तृत किए।
- source_word: בְּאַרְצְכֶם
  choice: अपने देश में
  rationale: אֶרֶץ यहाँ इस्राएल को मिली भूमि/देश को दर्शाता है; ‘देश’ आधुनिक हिंदी में सहज है।
theological_decisions:
- issue: वाचा की आशीष के रूप में कृषि-समृद्धि और सुरक्षा
  choice: आशीषों को प्रत्यक्ष भविष्यकालीन प्रतिज्ञाओं के रूप में रखा गया
  alternative: इन्हें सामान्य संभावनाओं या रूपकात्मक आशीषों के रूप में प्रस्तुत करना
  rationale: इब्रानी क्रियाएँ इस संदर्भ में आज्ञापालन से जुड़ी ठोस वाचा-प्रतिज्ञाएँ व्यक्त करती हैं; अनुवाद इनके स्वरूप को न तो आध्यात्मिक बनाता है, न सार्वकालिक सिद्धांत में बदलता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दँवाई’, ‘अंगूर की कटनी’ और ‘बोआई’ से मूल पद का कृषि-चक्र स्पष्ट रहता है।
