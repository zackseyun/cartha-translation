  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אֶת עָֽרֵי/כֶם֙ חָרְבָּ֔ה וַ/הֲשִׁמּוֹתִ֖י אֶת מִקְדְּשֵׁי/כֶ֑ם וְ/לֹ֣א אָרִ֔יחַ בְּ/רֵ֖יחַ נִיחֹֽחֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/031.yaml
  text: And I will make your cities a ruin[a], and I will lay waste your sanctuaries, and I will not smell the pleasing aroma of your offerings.
translation:
  language: hi
  text: मैं तुम्हारे नगरों को खंडहर बना दूँगा और तुम्हारे पवित्रस्थानों को उजाड़ दूँगा। मैं तुम्हारी भेंटों की मनभावनी सुगंध भी नहीं सूँघूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “तुम्हारी मनभावनी सुगंध।” यह बलिदानों और भेंटों के परमेश्वर द्वारा स्वीकार किए जाने से जुड़ा एक प्रचलित पद है; स्पष्टता के लिए यहाँ “भेंटों की” जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי ... חָרְבָּה
  choice: खंडहर बना दूँगा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है, पर इस विधेयात्मक रचना में इसका स्वाभाविक कारणवाचक अर्थ ‘खंडहर बना देना’ है; חָרְבָּה नगरों की उजड़ी हुई दशा बताता है।
- source_word: עָרֵיכֶם
  choice: तुम्हारे नगरों
  rationale: עִיר नगर या कस्बे को सूचित कर सकता है; ‘नगर’ आधुनिक मानक हिन्दी में व्यापक और गरिमापूर्ण विकल्प है।
- source_word: וַהֲשִׁמּוֹתִי
  choice: उजाड़ दूँगा
  rationale: שׁמם का हिफ़ील रूप किसी स्थान को निर्जन और उजाड़ कर देने का कारणवाचक भाव व्यक्त करता है।
- source_word: מִקְדְּשֵׁיכֶם
  choice: तुम्हारे पवित्रस्थानों
  rationale: बहुवचन को बनाए रखते हुए מקדש के उपासना और पवित्रता से जुड़े स्थानगत अर्थ को स्पष्ट करता है।
- source_word: וְלֹא אָרִיחַ
  choice: नहीं सूँघूँगा
  rationale: मूल पाठ की प्रत्यक्ष घ्राण-संबंधी और मानवरूपी भाषा को ‘स्वीकार नहीं करूँगा’ जैसे व्याख्यात्मक प्रतिस्थापन से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: בְּרֵיחַ נִיחֹחֲכֶם
  choice: तुम्हारी भेंटों की मनभावनी सुगंध
  rationale: רֵיחַ נִיחֹחַ बलिदान-संबंधी प्रचलित पद है। ‘मनभावनी सुगंध’ मूल बिंब बनाए रखता है; ‘भेंटों की’ संदर्भ को स्वाभाविक हिन्दी में स्पष्ट करता है, यद्यपि वह मूल में अलग संज्ञा के रूप में नहीं है।
theological_decisions:
- issue: अंतिम उपवाक्य में शाब्दिक घ्राण-बिंब रखा जाए या बलिदानों को अस्वीकार करने का निहित अर्थ सीधे कहा जाए
  choice: ‘मैं ... मनभावनी सुगंध भी नहीं सूँघूँगा’ कहकर मूल का मानवरूपी बिंब रखा गया
  alternative: ‘मैं तुम्हारी भेंटें स्वीकार नहीं करूँगा’
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘सूँघने’ की क्रिया और बलिदान-संबंधी ‘मनभावनी सुगंध’ पद का प्रयोग करता है। इस बिंब को बनाए रखना पाठ के धार्मिक तनाव और रूपक को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष भविष्यकाल अपनाया गया है। समानांतर दंड-वाक्यों को दो वाक्यों में रखा गया है ताकि सामान्य पाठक के लिए प्रवाह स्पष्ट रहे; बहुवचन ‘पवित्रस्थानों’ और मूल की मानवरूपी भाषा को सुरक्षित रखा गया है।
