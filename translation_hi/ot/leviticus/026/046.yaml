  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ וְ/הַ/תּוֹרֹת֒ אֲשֶׁר֙ נָתַ֣ן יְהוָ֔ה בֵּינ֕/וֹ וּ/בֵ֖ין בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֥ר סִינַ֖י בְּ/יַד מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/046.yaml
  text: These are the statutes and the judgments and the laws that Yahweh gave between himself and the sons of Israel at Mount Sinai by the hand of Moses[a][b].
translation:
  language: hi
  text: ये वे विधियाँ, न्याय-विधान और शिक्षाएँ हैं, जो याहवे ने सीनै पर्वत पर मूसा के द्वारा[b] अपने और इस्राएल के पुत्रों[a] के बीच दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात “इस्राएली।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “मूसा के हाथ से”; यह मुहावरा “मूसा के द्वारा” के अर्थ में है।
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये वे ... हैं
  rationale: यह संकेतवाचक पद पिछले विधान-संग्रह का समापन-सार प्रस्तुत करता है; हिन्दी में ‘ये वे ... हैं’ स्वाभाविक परिचय देता है।
- source_word: הַחֻקִּים
  choice: विधियाँ
  rationale: यह स्थिर रूप से ठहराए गए नियमों या विधियों को दर्शाता है और कानूनी-वाचा संबंधी शैली बनाए रखता है।
- source_word: הַמִּשְׁפָּטִים
  choice: न्याय-विधान
  rationale: מִשְׁפָּט कानूनी निर्णयों, नियमों या न्याय-संबंधी विधानों का बोध करा सकता है; ‘न्याय-विधान’ इसके न्यायिक स्वर को सुरक्षित रखता है।
- source_word: הַתּוֹרֹת
  choice: शिक्षाएँ
  rationale: תּוֹרֹת बहुवचन में अधिकृत शिक्षाओं या निर्देशों को दर्शाता है। ‘शिक्षाएँ’ इसे केवल आधुनिक विधि-संहिता तक सीमित नहीं करता।
- source_word: אֲשֶׁר נָתַן
  choice: जो ... दीं
  rationale: נָתַן का सीधा अर्थ ‘देना’ है; स्रोत की क्रिया को बिना ‘स्थापित करना’ जैसी व्याख्यात्मक विस्तार के रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में उसके प्रचलित विद्वत् उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: בֵּינוֹ וּבֵין בְּנֵי יִשְׂרָאֵל
  choice: अपने और इस्राएल के पुत्रों के बीच
  rationale: वाचा के दोनों पक्षों को स्पष्ट रखते हुए בְּנֵי יִשְׂרָאֵל की शाब्दिक अभिव्यक्ति सुरक्षित रखी गई है; स्वाभाविक जातिनाम फुटनोट में दिया गया है।
- source_word: בְּהַר סִינַי
  choice: सीनै पर्वत पर
  rationale: स्थान-सूचक अर्थ का स्वाभाविक हिन्दी रूप।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: इब्रानी मुहावरे का आशय मूसा की मध्यस्थता है; मुख्य पाठ में स्पष्ट आधुनिक हिन्दी दी गई है और शाब्दिक रूप फुटनोट में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: בְּנֵי יִשְׂרָאֵל का रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली
  rationale: मुख्य पाठ स्रोत की वंश-संबंधी अभिव्यक्ति को बनाए रखता है, जबकि फुटनोट आधुनिक हिन्दी का स्वाभाविक जातिनाम बताता है।
- issue: בְּיַד מֹשֶׁה में मूसा की भूमिका
  choice: मूसा के द्वारा
  alternative: मूसा के हाथ से
  rationale: यहाँ ‘हाथ’ मध्यस्थता का इब्रानी मुहावरा है। मुख्य पाठ उसका अर्थ देता है, पर फुटनोट मूल बिंब को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी-वाचा संबंधी है। तीन इब्रानी कानूनी पदों का भेद ‘विधियाँ, न्याय-विधान और शिक्षाएँ’ से बनाए रखा गया है। वाक्य-विन्यास हिन्दी के अनुरूप है, जबकि स्रोत की पुनरुक्ति और मध्यस्थता संबंधी अर्थ सुरक्षित हैं।
