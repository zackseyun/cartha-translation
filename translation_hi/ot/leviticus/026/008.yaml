id: LEV.26.8
reference: Leviticus 26:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/רָדְפ֨וּ מִ/כֶּ֤ם חֲמִשָּׁה֙ מֵאָ֔ה וּ/מֵאָ֥ה מִ/כֶּ֖ם רְבָבָ֣ה יִרְדֹּ֑פוּ וְ/נָפְל֧וּ אֹיְבֵי/כֶ֛ם לִ/פְנֵי/כֶ֖ם לֶ/חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/008.yaml
  text: Five of you will chase a hundred[a], and a hundred of you will chase ten thousand[b], and your enemies will fall before you by the sword.
translation:
  language: hi
  text: तुममें से पाँच जन सौ लोगों का पीछा करेंगे[a], और तुममें से सौ जन दस हज़ार लोगों का पीछा करेंगे[b]; और तुम्हारे शत्रु तुम्हारे सामने तलवार से गिर पड़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खदेड़ेंगे”; दोनों वाक्यांशों में।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ “दस हज़ार” या “बहुत बड़ी संख्या” हो सकता है; यहाँ संख्यात्मक समानांतरता के कारण “दस हज़ार” लिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדְפוּ / יִרְדֹּפוּ
  choice: पीछा करेंगे
  rationale: רדף का सामान्य अर्थ पीछा करना या खदेड़ना है। युद्ध के प्रसंग में “पीछा करेंगे” मूल क्रिया को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: מִכֶּם
  choice: तुममें से
  rationale: यहाँ מִן अंशवाचक अर्थ देता है—समुदाय में से पाँच और समुदाय में से सौ।
- source_word: חֲמִשָּׁה מֵאָה
  choice: तुममें से पाँच जन सौ लोगों का
  rationale: संख्यात्मक विषमता को स्पष्ट रखने के लिए लक्ष्य समूह के साथ “लोगों” जोड़ा गया है; इससे हिंदी में वाक्य स्वाभाविक रहता है और मूल अर्थ नहीं बदलता।
- source_word: רְבָבָה
  choice: दस हज़ार
  rationale: רְבָבָה का अर्थ दस हज़ार या बहुत बड़ी संख्या हो सकता है। यहाँ पाँच/सौ और सौ/दस हज़ार की बढ़ती संख्यात्मक समानांतरता के कारण निश्चित संख्या उपयुक्त है।
- source_word: וְנָפְלוּ
  choice: गिर पड़ेंगे
  rationale: נפל की मूल युद्ध-संबंधी छवि को बनाए रखा गया है; यह पराजय और मारे जाने का संकेत देती है, पर अनावश्यक रूप से उसे स्पष्ट नहीं करती।
- source_word: אֹיְבֵיכֶם
  choice: तुम्हारे शत्रु
  rationale: אֹיֵב का सीधा और प्रसंगानुकूल हिंदी रूप।
- source_word: לִפְנֵיכֶם
  choice: तुम्हारे सामने
  rationale: यह मूल स्थानिक मुहावरे और सैन्य पराजय की छवि दोनों को सुरक्षित रखता है।
- source_word: לֶחָרֶב
  choice: तलवार से
  rationale: यहाँ לְ साधन अथवा युद्ध में तलवार के कारण होने वाले पतन को दर्शाता है; “तलवार से” स्वाभाविक हिंदी है।
theological_decisions:
- issue: वाचा की आशीष में असमान सैन्य विजय—शाब्दिक प्रतिज्ञा या अलंकारिक अतिशयोक्ति
  choice: ठोस सैन्य प्रतिज्ञा को बिना नरम किए यथावत रखना
  alternative: इसे केवल सामान्य साहस या सफलता के आश्वासन के रूप में प्रस्तुत करना
  rationale: पद सीधे संख्यात्मक रूप में शत्रुओं पर विजय का वर्णन करता है। अनुवाद यह तय नहीं करता कि संख्याएँ अलंकारिक हैं या हर प्रसंग में अक्षरशः लागू होने वाली; वह मूल की प्रत्यक्षता और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और प्रत्यक्ष सैन्य भाषा रखी गई है। “जन” संख्या के साथ संक्षिप्त और सम्मानपूर्ण है; “गिर पड़ेंगे” मूल इब्रानी बिंब को सुरक्षित रखता है।
