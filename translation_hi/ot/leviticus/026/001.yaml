source:
  edition: WLC
  text: לֹֽא תַעֲשׂ֨וּ לָ/כֶ֜ם אֱלִילִ֗ם וּ/פֶ֤סֶל וּ/מַצֵּבָה֙ לֹֽא תָקִ֣ימוּ לָ/כֶ֔ם וְ/אֶ֣בֶן מַשְׂכִּ֗ית לֹ֤א תִתְּנוּ֙ בְּ/אַרְצְ/כֶ֔ם לְ/הִֽשְׁתַּחֲוֺ֖ת עָלֶ֑י/הָ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/001.yaml
  text: You shall not make idols for yourselves[a], and you shall not set up for yourselves a carved image or a standing stone, and you shall not place a figured stone in your land to bow down to it[b], for I am Yahweh your God.
translation:
  language: hi
  text: “तुम अपने लिए मूर्तियाँ न बनाना, और न अपने लिए कोई खुदी हुई प्रतिमा या खड़ा पत्थर स्थापित करना। अपने देश में कोई चित्रित पत्थर[a] दण्डवत् करने के लिए न रखना, क्योंकि मैं याहवे[b], तुम्हारा परमेश्वर हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘चित्रित पत्थर’ के लिए इब्रानी पद का अर्थ निश्चित नहीं है; इसका अनुवाद ‘नक्काशीदार पत्थर’ या ‘पत्थर की आकृति’ भी हो सकता है। ‘दण्डवत् करने’ का अर्थ ‘उस पर दण्डवत् करने’ भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: YHWH; परंपरागत रूप से इसका अनुवाद ‘प्रभु’ किया जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלִילִם
  choice: मूर्तियाँ
  rationale: यह शब्द उपासना के लिए बनाई गई मूर्तियों को दर्शाता है और इसमें निकम्मेपन का तिरस्कारपूर्ण भाव भी हो सकता है। मुख्य पाठ में सहज और स्पष्ट हिंदी ‘मूर्तियाँ’ रखी गई है।
- source_word: פֶסֶל
  choice: खुदी हुई प्रतिमा
  rationale: यह काटकर या खोदकर बनाई गई आकृति है। यह अनुवाद אֱלִילִם से इसका शब्दगत भेद बनाए रखता है।
- source_word: מַצֵּבָה
  choice: खड़ा किया हुआ पत्थर
  rationale: यह भूमि में सीधा खड़ा किया गया स्मारकीय या उपासना-संबंधी पत्थर है। ‘खड़ा किया हुआ पत्थर’ ठोस अर्थ बताता है और संज्ञा में निहित न होने पर भी ‘पवित्र’ नहीं जोड़ता।
- source_word: אֶבֶן מַשְׂכִּית
  choice: चित्रित पत्थर
  rationale: इस विवादित पदबंध से किसी आकृति, नक्काशी या चित्र वाला उपासना-संबंधी पत्थर अभिप्रेत जान पड़ता है। ‘चित्रित पत्थर’ פֶסֶל से भेद रखता है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: לְהִשְׁתַּחֲוֺת עָלֶיהָ
  choice: कि उसके आगे दण्डवत् करो
  rationale: इनफिनिटिव उद्देश्य बताता है। עַל को यहाँ उस पत्थर की ओर लक्षित श्रद्धापूर्ण झुकने के अर्थ में ‘उसके आगे’ अनूदित किया गया है, जबकि ‘उस पर’ की संभावना टिप्पणी में बताई गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चार-अक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है; पादटिप्पणी पारंपरिक प्रतिस्थापन बताती है।
- issue: निषिद्ध उपासना-वस्तुओं की अलग-अलग शब्दावली
  choice: मूर्तियाँ, खुदी हुई प्रतिमा, खड़ा किया हुआ पत्थर, और चित्रित पत्थर
  alternative: सबको ‘मूर्ति’ कहना
  rationale: पद में प्रयुक्त अलग इब्रानी संज्ञाओं को एक शब्द में समेटने के बजाय उनका ठोस भेद सुरक्षित रखा गया है।
- issue: עָלֶיהָ में संबंध या स्थान का अर्थ
  choice: उसके आगे दण्डवत् करना
  alternative: उस पर दण्डवत् करना
  rationale: संदर्भ में निषिद्ध वस्तु की ओर झुकना अधिक संभावित है, पर पूर्वसर्ग का स्थानवाचक अर्थ वास्तविक संभावना है और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज निषेधात्मक कानूनी शैली। ‘दण्डवत् करना’ उपासना-संदर्भ में परिचित हिंदी है। चारों उपासना-वस्तुओं के शब्दगत भेद बनाए गए हैं और विवादित अर्थ पादटिप्पणी में दिए गए हैं।
