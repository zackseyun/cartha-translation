  text: You will pursue your enemies[a], and they will fall before you by the sword.
translation:
  language: hi
  text: तुम अपने शत्रुओं का पीछा करोगे, और वे तुम्हारे सामने तलवार से[a] गिर पड़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तलवार के आगे गिर पड़ेंगे।’ इब्रानी प्रयोग का अनुवाद ‘तलवार से’ या ‘तलवार के आगे’ किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְדַפְתֶּם
  choice: तुम ... पीछा करोगे
  rationale: רדף का सामान्य अर्थ ‘पीछा करना’ है; यह सैन्य संदर्भ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֹיְבֵיכֶם
  choice: अपने शत्रुओं का
  rationale: אויב का मानक अर्थ ‘शत्रु’ है; सम्बद्ध सर्वनाम को ‘अपने’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְנָפְלוּ
  choice: और वे ... मारे जाएँगे
  rationale: נפל का मूल अर्थ ‘गिरना’ है, पर युद्ध के संदर्भ में तलवार के साथ इसका आशय मारे जाने से है; हिन्दी में ‘तलवार से गिरेंगे’ अस्वाभाविक होने के कारण अर्थ को स्पष्ट और सहज रूप में दिया गया है।
- source_word: לִפְנֵיכֶם
  choice: तुम्हारे सामने
  rationale: לִפְנֵי का यहाँ अर्थ ‘सामने’ या ‘सम्मुख’ है; ‘तुम्हारे सामने’ स्पष्ट और स्वाभाविक है।
- source_word: לֶחָרֶב
  choice: तलवार से
  rationale: לְ और חֶרֶב का यह युद्ध-संदर्भ तलवार के कारण या माध्यम से मृत्यु सूचित करता है; ‘तलवार से’ हिन्दी का स्वाभाविक प्रयोग है।
