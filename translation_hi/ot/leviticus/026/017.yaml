  text: וְ/נָתַתִּ֤י פָנַ/י֙ בָּ/כֶ֔ם וְ/נִגַּפְתֶּ֖ם לִ/פְנֵ֣י אֹיְבֵי/כֶ֑ם וְ/רָד֤וּ בָ/כֶם֙ שֹֽׂנְאֵי/כֶ֔ם וְ/נַסְתֶּ֖ם וְ/אֵין רֹדֵ֥ף אֶתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/017.yaml
  text: And I will set my face against you[a], and you will be struck down before your enemies; those who hate you will rule over you[c][b], and you will flee when no one is pursuing you.
translation:
  language: hi
  text: मैं अपना मुख तुम्हारे विरुद्ध करूँगा[a], और तुम अपने शत्रुओं के सामने पराजित हो जाओगे[b]। तुमसे घृणा करनेवाले तुम पर शासन करेंगे, और तुम भागोगे, हालाँकि तुम्हारा पीछा करनेवाला कोई न होगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं अपना मुख तुम्हारे विरुद्ध करूँगा”; यह मुहावरा न्याय में दृढ़ विरोध व्यक्त करता है।
    reason: cultural_note
  - marker: b
    text: या “धराशायी किए जाओगे।”
    reason: lexical_alternative
  - marker: c
    text: या “जब कोई तुम्हारा पीछा नहीं कर रहा होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי פָנַי בָכֶם
  choice: मैं अपना मुख तुम्हारे विरुद्ध करूँगा
  rationale: इब्रानी मुहावरे में परमेश्वर के न्यायपूर्ण और दृढ़ विरोध का व्यक्तिगत तथा वाचा-संबंधी भाव है। ‘मुख’ को बनाए रखने से यह चित्रात्मक शक्ति सुरक्षित रहती है।
- source_word: וְנִגַּפְתֶּם
  choice: तुम ... पराजित हो जाओगे
  rationale: यहाँ निफ़अल रूप युद्ध में परास्त होने या मार गिराए जाने का भाव देता है। ‘पराजित हो जाओगे’ संदर्भ में स्वाभाविक है और अनिवार्य रूप से मृत्यु का अर्थ नहीं जोड़ता।
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: अपने शत्रुओं के सामने
  rationale: यह स्थानिक और सैनिक अभिव्यक्ति का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: וְרָדוּ בָכֶם
  choice: तुम पर शासन करेंगे
  rationale: רדה शासन या प्रभुत्व करने को दर्शाता है। शाप के संदर्भ में अधीनता निहित है, पर ‘शासन करेंगे’ मूल से अधिक कठोर अर्थ नहीं जोड़ता।
- source_word: שֹׂנְאֵיכֶם
  choice: तुमसे घृणा करनेवाले
  rationale: कृदन्त रूप को स्पष्ट रखकर इसे पहले आए ‘शत्रुओं’ से अलग दिखाया गया है।
- source_word: וְנַסְתֶּם
  choice: तुम भागोगे
  rationale: यह भाग जाने के सामान्य इब्रानी क्रिया-रूप का संक्षिप्त और स्वाभाविक हिन्दी अनुवाद है।
- source_word: וְאֵין רֹדֵף אֶתְכֶם
  choice: जबकि तुम्हारा पीछा करनेवाला कोई न होगा
  rationale: यह उस भय को व्यक्त करता है जिसमें वास्तविक पीछा करनेवाला न होने पर भी लोग भागते हैं। ‘जबकि’ संदर्भगत विरोध को दर्शाता है; कालगत ‘जब’ भी सम्भव है।
theological_decisions:
- issue: न्याय के प्रसंग में परमेश्वर के लिए मानवरूपी भाषा
  choice: ‘मैं अपना मुख तुम्हारे विरुद्ध करूँगा’ मुहावरे को बनाए रखा
  alternative: ‘मैं तुम्हारा विरोध करूँगा’
  rationale: मूल पाठ परमेश्वर के वाचा-संबंधी, व्यक्तिगत और दृढ़ विरोध को ‘मुख’ के चित्र द्वारा व्यक्त करता है; इसे सपाट अमूर्त कथन में नहीं बदला गया।
- issue: शत्रुओं के नियंत्रण का स्वरूप
  choice: ‘तुम पर शासन करेंगे’
  alternative: ‘तुम्हें दबाकर रखेंगे’ अथवा ‘तुम पर अत्याचार करेंगे’
  rationale: पद अधीनता और प्रभुत्व बताता है, लेकिन इस वाक्य में अत्याचार की सीमा स्पष्ट नहीं करता; इसलिए अधिक व्याख्यात्मक कठोरता नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए सहज शैली रखी गई है। ‘मुख’ बाइबिलीय मुहावरे की चित्रात्मकता बचाता है, जबकि शेष वाक्य वर्तमान हिन्दी की स्वाभाविक संरचना में है।
