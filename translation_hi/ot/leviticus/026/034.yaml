base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/034.yaml
  text: Then the land will enjoy its Sabbaths all the days of its desolation[a], while you are in the land of your enemies; then the land will rest and enjoy its Sabbaths.
translation:
  language: hi
  text: तब भूमि अपने उजाड़ पड़े रहने के सारे दिनों में, जब तुम अपने शत्रुओं की भूमि में रहोगे, अपने सब्तों की भरपाई पाएगी[a]; तब भूमि विश्राम करेगी और अपने सब्तों की भरपाई पाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सब्तों का आनन्द उठाएगी।” इब्रानी क्रिया का अर्थ प्रसंग में यह है कि भूमि को वे सब्त-विश्राम मिलेंगे जिनसे वह पहले वंचित रही थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण पिछले न्याय के परिणामस्वरूप आने वाली स्थिति को दर्शाता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: תִּרְצֶה / וְהִרְצָת
  choice: कमी पूरी करेगा
  rationale: इस प्रसंग में רצה का भाव यह है कि निर्वासन के दौरान देश को वे सब्त-विश्राम मिलेंगे जिनसे वह पहले वंचित रहा था। यह प्रयोग प्रतिपूर्ति का भाव स्पष्ट करता है और दोनों स्थानों पर एक ही मूल की पुनरावृत्ति बनाए रखता है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: यहाँ संदर्भ सारी पृथ्वी का नहीं, इस्राएल के वाचा-देश का है; आधुनिक हिन्दी में ‘देश’ इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת שַׁבְּתֹתֶיהָ
  choice: अपने सब्तों की
  rationale: स्त्रीलिंग प्रत्यय देश के अपने सब्तों को सूचित करता है, विशेषकर भूमि के सब्त-वर्षों को। ‘सब्त’ मूल धार्मिक-सांस्कृतिक पद को सुरक्षित रखता है।
- source_word: כֹּל יְמֵי הֳשַׁמָּה
  choice: अपने उजाड़ पड़े रहने के सारे दिनों में
  rationale: यह वाक्यांश देश के उजाड़ रहने की पूरी अवधि बताता है और हिन्दी में अवस्था तथा अवधि दोनों को स्पष्ट करता है।
- source_word: וְאַתֶּם בְּאֶרֶץ אֹיְבֵיכֶם
  choice: जब तुम अपने शत्रुओं के देश में होगे
  rationale: यह परिस्थितिवाचक उपवाक्य उसी समयावधि को बताता है जिसमें देश उजाड़ रहेगा; भविष्यकाल संदर्भानुकूल है।
- source_word: תִּשְׁבַּת
  choice: विश्राम करेगा
  rationale: שבת यहाँ खेती-बाड़ी रुकने के कारण देश के विश्राम को व्यक्त करता है और सब्त-विषयक शब्द-संबंध बनाए रखता है।
theological_decisions:
- issue: निर्वासन के समय देश और उसके उपेक्षित सब्तों का संबंध
  choice: देश निर्वासन के दौरान छूटे हुए सब्त-विश्रामों की कमी पूरी करेगा।
  alternative: देश अपने सब्तों का सुख पाएगा अथवा उनका बकाया पाएगा।
  rationale: प्रसंग वाचा के न्याय और भूमि को न मिले सब्त-विश्राम की प्रतिपूर्ति से संबंधित है। ‘कमी पूरी करेगा’ न्यायात्मक-प्रतिपूरक भाव रखता है, पर रצה की ‘सुख/संतोष पाने’ वाली संभावित छाया को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सब्त’ को धार्मिक-सांस्कृतिक तकनीकी पद के रूप में बनाए रखा गया है। देश के लिए पुल्लिंग क्रियारूप मानक हिन्दी के अनुसार है।
