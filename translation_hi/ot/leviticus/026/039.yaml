id: LEV.26.39
reference: Leviticus 26:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֗ם יִמַּ֨קּוּ֙ בַּֽ/עֲוֺנָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/כֶ֑ם וְ/אַ֛ף בַּ/עֲוֺנֹ֥ת אֲבֹתָ֖/ם אִתָּ֥/ם יִמָּֽקּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/039.yaml
  text: And those of you who remain will waste away in the lands of your enemies because of their iniquity[b][a]; and also because of the iniquities of their fathers with them they will waste away.
translation:
  language: hi
  text: और तुममें से जो बचे रहेंगे, वे अपने शत्रुओं के देशों में अपने अधर्म के कारण क्षीण होते जाएँगे[a]; और वे अपने पुरखाओं के अधर्मों के कारण भी, उनके साथ ही[b], क्षीण होते जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गलते जाएँगे” अथवा “सड़ते जाएँगे”; इब्रानी क्रिया न्याय के अधीन धीरे-धीरे क्षीण या नष्ट होने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: “उनके साथ ही” का अर्थ यह हो सकता है कि उनके पुरखाओं के अधर्म उनके साथ बने हुए हैं, या कि वे उन पैतृक अधर्मों के साथ-साथ क्षीण होते जाते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁאָרִים בָּכֶם
  choice: और तुममें से जो बचे रहेंगे
  rationale: यह अनुवाद शेष रह जाने वाले लोगों के अर्थ और בָּכֶם में निहित सीधे संबोधन—‘तुममें से’—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: יִמַּקּוּ
  choice: क्षीण होते जाएँगे
  rationale: מקק का निफ़अल रूप न्याय के अधीन धीरे-धीरे गलने, नष्ट होने या क्षीण होने का भाव देता है। यह हिन्दी अभिव्यक्ति दोनों occurrences में गंभीर और सहज है; अधिक ठोस ‘गलते/सड़ते जाएँगे’ को पादटिप्पणी में रखा गया है।
- source_word: בַּעֲוֺנָם
  choice: अपने अधर्म के कारण
  rationale: עָוֹן में अधर्म, दोष और उसके दंडात्मक परिणाम का अर्थक्षेत्र है। कारणसूचक ‘के कारण’ यहाँ בְּ की संभावित न्यायिक शक्ति को स्पष्ट करता है, जबकि ‘अधर्म’ नैतिक अर्थ बनाए रखता है।
- source_word: בְּאַרְצֹת אֹיְבֵיכֶם
  choice: अपने शत्रुओं के देशों में
  rationale: ‘देशों’ से इब्रानी बहुवचन אַרְצֹת सुरक्षित रहता है और निर्वासन के विभिन्न विदेशी भूभागों का संकेत मिलता है। तीसरे पुरुष के वाक्य में अर्थानुसार ‘अपने शत्रुओं’ स्वाभाविक हिन्दी है।
- source_word: וְאַף
  choice: और ... भी
  rationale: यह रचना इब्रानी के योगात्मक और कुछ हद तक बलवर्धक भाव को सहज हिन्दी में व्यक्त करती है।
- source_word: בַּעֲוֺנֹת אֲבֹתָם
  choice: अपने पुरखाओं के अधर्मों के कारण
  rationale: ‘अधर्मों’ इब्रानी बहुवचन को बनाए रखता है। ‘पुरखाओं’ आधुनिक हिन्दी में पूर्वज पिताओं के लिए गरिमापूर्ण और स्पष्ट है।
- source_word: אִתָּם
  choice: उनके साथ ही
  rationale: इब्रानी पद अत्यंत संक्षिप्त और संदर्भगत रूप से अस्पष्ट है। शाब्दिक निकटता रखने वाला यह पद उस अस्पष्टता को खुला रखता है कि साथ होने का संबंध लोगों से है या पुरखाओं के अधर्मों से।
theological_decisions:
- issue: पीढ़ियों के बीच अधर्म और न्याय का संबंध
  choice: लोगों के अपने अधर्म और उनके पुरखाओं के अधर्मों—दोनों को उनके क्षीण होने के कारणों के रूप में रखा गया है।
  alternative: इसे केवल पुरखाओं के पापों के परिणाम या केवल उन्हीं पापों में संतानों की सहभागिता के रूप में स्पष्ट कर देना।
  rationale: मूल पाठ दोनों प्रकार के अधर्मों का स्पष्ट उल्लेख करता है, पर उनके बीच दोष और परिणाम के सटीक संबंध को नहीं समझाता। अनुवाद इस धर्मवैचारिक तनाव को हल किए बिना सुरक्षित रखता है।
- issue: אִתָּם (‘उनके साथ’) का संबंध
  choice: ‘उनके साथ ही’ रखकर संबंधगत अस्पष्टता बनाए रखी गई है।
  alternative: स्पष्ट रूप से कहना कि पुरखाओं के अधर्म उनके साथ बने रहते हैं, या वे उन अधर्मों के साथ-साथ क्षीण होते हैं।
  rationale: इब्रानी व्याकरण और संक्षिप्त वाक्य-विन्यास एक से अधिक संबंधों की अनुमति देते हैं; मुख्य पाठ को किसी एक व्याख्या तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘क्षीण होते जाएँगे’ क्रमिक विनाश का गंभीर भाव देता है; ‘अधर्म’ नैतिक दोष को व्यक्त करता है। मुख्य पाठ में इब्रानी की पीढ़ीगत और संबंधगत अस्पष्टता को जानबूझकर नहीं सुलझाया गया है।
