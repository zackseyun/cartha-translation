source:
  edition: WLC
  text: וְ/זָכַרְתִּ֥י לָ/הֶ֖ם בְּרִ֣ית רִאשֹׁנִ֑ים אֲשֶׁ֣ר הוֹצֵֽאתִי אֹתָ/ם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם לְ/עֵינֵ֣י הַ/גּוֹיִ֗ם לִ/הְיֹ֥ת לָ/הֶ֛ם לֵ/אלֹהִ֖ים אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/045.yaml
  text: 'But I will remember for them the covenant with their forefathers, whom I brought out from the land of Egypt in the sight of the nations, to be their God: I am Yahweh.'
translation:
  language: hi
  text: परन्तु मैं उनके लिए उन पूर्वजों के साथ बाँधी गई वाचा को स्मरण करूँगा[a], जिन्हें मैं राष्ट्रों के देखते हुए मिस्र देश से बाहर निकाल लाया था, ताकि मैं उनका परमेश्वर ठहरूँ। मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पहले के लोगों की वाचा।” इसका संकेत उस पिछली वाचा-पीढ़ी की ओर है जिसे परमेश्वर मिस्र से निकाल लाया था।
    reason: मूल इब्रानी के संक्षिप्त पदबंध और उसके शाब्दिक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: परन्तु मैं ... स्मरण करूँगा
  rationale: सन्दर्भ में וְ न्याय के कथनों के बाद आश्वासन की ओर विरोधात्मक मोड़ दिखाता है; इसलिए स्वाभाविक हिन्दी में ‘परन्तु’ उपयुक्त है।
- source_word: לָהֶם
  choice: उनके लिए
  rationale: लामेद उपसर्ग स्मरण के उनके हित में होने का भाव देता है, जिसे केवल ‘उन्हें’ कहने से पूरी तरह व्यक्त नहीं किया जाता।
- source_word: בְּרִית רִאשֹׁנִים
  choice: उन पूर्वजों के साथ बाँधी गई वाचा
  rationale: रִאשֹׁנִים का शाब्दिक अर्थ ‘पहले/पूर्व के लोग’ है। अगला सम्बन्धवाचक वाक्यांश उन लोगों को निर्गमन की पीढ़ी से जोड़ता है। ‘बाँधी गई’ हिन्दी में सम्बन्ध स्पष्ट करता है, जबकि अर्थ वाचा किए जाने का ही है।
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: जिन्हें मैं ... बाहर निकाल लाया था
  rationale: सम्बन्धवाचक वाक्यांश लोगों को सूचित करता है, वाचा को नहीं; ‘निकाल लाया’ निर्गमन की पूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: यह मूल के ‘मिस्र की भूमि से’ को संक्षिप्त, परिचित और अर्थनिष्ठ हिन्दी में व्यक्त करता है।
- source_word: לְעֵינֵי הַגּוֹיִם
  choice: जाति-जाति के लोगों के देखते हुए
  rationale: यह वाक्यांश निर्गमन के सार्वजनिक रूप से घटित होने का भाव सुरक्षित रखता है; הַגּוֹיִם यहाँ अन्य राष्ट्रों/जातियों के लोगों को सूचित करता है।
- source_word: לִהְיוֹת לָהֶם לֵאלֹהִים
  choice: ताकि मैं उनका परमेश्वर ठहरूँ
  rationale: यह वाचा-सूत्र को गरिमापूर्ण और स्वाभाविक हिन्दी में रखता है तथा उद्देश्यसूचक לִ का भाव भी व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी पाठकों में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को प्रस्तुत करता है, इसे किसी उपाधि से प्रतिस्थापित नहीं करता।
theological_decisions:
- issue: בְּרִית רִאשֹׁנִים में वाचा का सम्बन्ध
  choice: ‘उन पूर्वजों के साथ बाँधी गई वाचा’—सम्बन्धवाचक उपवाक्य के अनुसार वे लोग जिन्हें मिस्र से निकाला गया था
  alternative: ‘पहले लोगों की वाचा’ अथवा ‘पहली वाचा’
  rationale: इब्रानी पदबंध संक्षिप्त और कुछ हद तक अस्पष्ट है, पर אֲשֶׁר ... אֹתָם का बहुवचन व्यक्तिवाचक संकेत निर्गमन की पिछली पीढ़ी की ओर जाता है। पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- issue: לִהְיוֹת לָהֶם לֵאלֹהִים का वाचागत आशय
  choice: ‘ताकि मैं उनका परमेश्वर ठहरूँ’
  alternative: ‘उनके लिए परमेश्वर होने को’
  rationale: चुना हुआ रूप वाचागत सम्बन्ध और उद्देश्य दोनों को व्यक्त करता है, बिना इस कथन के धर्मवैज्ञानिक तनाव को विस्तार देकर हल किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली रखी गई है। ‘वाचा’, ‘स्मरण’ और ‘परमेश्वर’ जैसे परिचित बाइबिलीय पद बनाए गए हैं; वाक्यरचना को सामान्य पाठक के लिए स्पष्ट रखा गया है।
