source:
  edition: WLC
  text: וְ/אִ֨ם עַד אֵ֔לֶּה לֹ֥א תִשְׁמְע֖וּ לִ֑/י וְ/יָסַפְתִּי֙ לְ/יַסְּרָ֣ה אֶתְ/כֶ֔ם שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/018.yaml
  text: And if[a], despite these things, you do not listen to me[b], then I will continue to discipline you sevenfold for your sins.
translation:
  language: hi
  text: और यदि इन सबके बाद भी[a] तुम मेरी नहीं सुनोगे, तो मैं तुम्हारे पापों के कारण तुम्हें और भी सात गुना[b] अनुशासित करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इन सबके होते हुए भी” अथवा “इस सबके बाद भी।” इब्रानी मुहावरे का अर्थ पिछली विपत्तियों के बावजूद है।
    reason: lexical_alternative
  - marker: b
    text: या “सात बार।” इब्रानी में इसका आशय ठीक सात बार गिनने के बजाय दण्ड की बढ़ी हुई तीव्रता या मात्रा भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: संधिसूचक ו और शर्तसूचक אִם दोनों को स्वाभाविक हिन्दी में बनाए रखता है और पिछली चेतावनियों से इस वाक्य का संबंध दिखाता है।
- source_word: עַד אֵלֶּה
  choice: इन सबके बाद भी
  rationale: संदर्भ में यह पदबंध पिछली विपत्तियों के बावजूद अवज्ञा जारी रहने का भाव देता है; इसे केवल कालसूचक ‘तब तक’ कहना भ्रामक होगा।
- source_word: לֹא תִשְׁמְעוּ לִי
  choice: तुम मेरी नहीं सुनोगे
  rationale: שׁמע के सुननेवाले बिंब को बनाए रखता है, जबकि संदर्भ में निहित आज्ञापालन का भाव भी सहज रूप से समझ में आता है।
- source_word: וְיָסַפְתִּי
  choice: मैं ... और ... करूँगा
  rationale: यहाँ יסף पहले से चल रही ताड़ना में आगे वृद्धि या निरंतरता दर्शाता है; हिन्दी का ‘और’ इस पुनरावृत्त-वृद्धिशील भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְיַסְּרָה אֶתְכֶם
  choice: तुम्हें ... अनुशासित करूँगा
  rationale: ‘अनुशासित करना’ सुधार और दण्ड—दोनों संभावित पक्षों को बनाए रखता है और केवल प्रतिशोधात्मक अर्थ तक सीमित नहीं करता।
- source_word: שֶׁבַע
  choice: सात गुना
  rationale: यह निर्णयसूत्र में दण्ड की तीव्रता या मात्रा बढ़ने का भाव स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक संख्यात्मक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עַל חַטֹּאתֵיכֶם
  choice: तुम्हारे पापों के कारण
  rationale: עַל को यहाँ ताड़ना के आधार या कारण के रूप में स्पष्ट और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: वाचा के दण्ड-संदर्भ में יָסַר का स्वरूप
  choice: अनुशासित करूँगा
  alternative: दण्ड दूँगा; ताड़ना दूँगा
  rationale: यह प्रसंग दण्डात्मक वाचा-प्रतिबंधों का है, फिर भी יָסַר में सुधारात्मक अनुशासन का अर्थ भी संभव है। ‘अनुशासित करूँगा’ इस तनाव को बनाए रखता है, जबकि ‘दण्ड दूँगा’ सुधारात्मक पक्ष को दबा सकता है और ‘ताड़ना दूँगा’ आधुनिक पाठक को अपेक्षाकृत हल्का लग सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘मेरी नहीं सुनोगे’ मूल के श्रवण-बिंब और निहित आज्ञापालन दोनों को बनाए रखता है। ‘अनुशासित’ कुछ औपचारिक है, पर इस प्रसंग में दण्ड और सुधार के संयुक्त भाव को सबसे संतुलित ढंग से व्यक्त करता है। पादटिप्पणी-चिह्न उन्हीं पदबंधों के बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
