  text: וּ/פָנִ֣יתִי אֲלֵי/כֶ֔ם וְ/הִפְרֵיתִ֣י אֶתְ/כֶ֔ם וְ/הִרְבֵּיתִ֖י אֶתְ/כֶ֑ם וַ/הֲקִימֹתִ֥י אֶת בְּרִיתִ֖/י אִתְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/009.yaml
  text: And I will turn toward you and make you fruitful and multiply you[a], and I will establish my covenant with you.
translation:
  language: hi
  text: मैं तुम्हारी ओर मुड़ूँगा[a], तुम्हें फलवन्त करूँगा और तुम्हारी संख्या बढ़ाऊँगा, और तुम्हारे साथ अपनी वाचा स्थापित करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम पर अनुकूल दृष्टि करूँगा।” शाब्दिक अर्थ, “मैं तुम्हारी ओर मुड़ूँगा”; इस प्रसंग में यह परमेश्वर की अनुकूलता का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי אֲלֵיכֶם
  choice: मैं तुम्हारी ओर ध्यान दूँगा
  rationale: פנה का मूल चित्र किसी की ओर मुड़ने का है; हिन्दी में ‘ओर ध्यान देना’ इस प्रसंग में अनुकूल दृष्टि का भाव स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक चित्र सुरक्षित रखती है।
- source_word: וְהִפְרֵיתִי אֶתְכֶם
  choice: तुम्हें फलवन्त करूँगा
  rationale: פרה के हिफ़ील रूप का कारणवाचक अर्थ है—फलवन्त बनाना। यह उत्पत्ति और वाचा की आशीषों से जुड़े पारिभाषिक प्रतिध्वनि को भी बनाए रखता है।
- source_word: וְהִרְבֵּיתִי אֶתְכֶם
  choice: तुम्हारी संख्या बढ़ाऊँगा
  rationale: רבה के हिफ़ील का अर्थ बहुत या असंख्य करना है। आधुनिक हिन्दी में यह अभिव्यक्ति जनसंख्या-वृद्धि का आशय स्पष्ट और स्वाभाविक ढंग से देती है।
- source_word: וַהֲקִימֹתִי אֶת־בְּרִיתִי אִתְּכֶם
  choice: तुम्हारे साथ अपनी वाचा को दृढ़ करूँगा
  rationale: वाचा के साथ קום का हिफ़ील किसी वाचा को स्थापित, कायम या पुष्ट करने का अर्थ दे सकता है। यहाँ पहले से विद्यमान सीनै-वाचा के संदर्भ में ‘दृढ़ करूँगा’ उपयुक्त है और नया अनुबंध आरम्भ करने का अनावश्यक संकेत नहीं देता।
- source_word: בְּרִיתִי
  choice: अपनी वाचा
  rationale: ‘वाचा’ हिन्दी बाइबलीय परंपरा में בְּרִית का मानक और धर्मवैज्ञानिक रूप से सुसंगत पद है।
theological_decisions:
- issue: परमेश्वर के ‘मुड़ने’ में निहित अनुकूलता को मुख्य पाठ में कितना स्पष्ट किया जाए
  choice: ‘मैं तुम्हारी ओर ध्यान दूँगा’ और शाब्दिक चित्र के लिए पादटिप्पणी
  alternative: ‘मैं तुम्हारी ओर मुड़ूँगा’ या ‘मैं तुम पर कृपादृष्टि करूँगा’
  rationale: पहला विकल्प हिन्दी में कुछ अस्पष्ट हो सकता है, जबकि दूसरा क्रिया में निहित बात से अधिक व्याख्यात्मक है। चुना हुआ पाठ अनुकूल ध्यान का प्रसंगगत अर्थ देता है और पादटिप्पणी मूल चित्र बताती है।
- issue: הקים את־בריתי को नई वाचा की स्थापना या विद्यमान वाचा की पुष्टि के रूप में प्रस्तुत करना
  choice: ‘अपनी वाचा को दृढ़ करूँगा’
  alternative: ‘अपनी वाचा स्थापित करूँगा’ या ‘अपनी वाचा कायम रखूँगा’
  rationale: लैव्यव्यवस्था 26 में सम्बोधन पहले से वाचा में बँधे इस्राएल से है। इसलिए ‘दृढ़ करूँगा’ क्रिया के अर्थ-क्षेत्र और प्रसंग दोनों को सँभालता है, बिना इसे केवल मानवीय आज्ञाकारिता पर निर्भर संरक्षण के अर्थ तक सीमित किए।
- issue: फलवन्तता और वृद्धि की वाचागत भाषा
  choice: ‘तुम्हें फलवन्त करूँगा और तुम्हारी संख्या बढ़ाऊँगा’
  alternative: ‘तुम्हें उपजाऊ और बहुत करूँगा’
  rationale: चुना हुआ रूप बाइबलीय ‘फलवन्त’ शब्द को बनाए रखते हुए आधुनिक हिन्दी में जन-वृद्धि का आशय स्पष्ट करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘फलवन्त’ और ‘वाचा’ जैसे प्रमुख बाइबलीय पद बनाए गए हैं; अन्य वाक्यांश स्वाभाविक आधुनिक हिन्दी में रखे गए हैं।
