  text: וְ/הָ/אָרֶץ֩ תֵּעָזֵ֨ב מֵ/הֶ֜ם וְ/תִ֣רֶץ אֶת שַׁבְּתֹתֶ֗י/הָ בָּ/הְשַׁמָּ/ה֙ מֵ/הֶ֔ם וְ/הֵ֖ם יִרְצ֣וּ אֶת עֲוֺנָ֑/ם יַ֣עַן וּ/בְ/יַ֔עַן בְּ/מִשְׁפָּטַ֣/י מָאָ֔סוּ וְ/אֶת חֻקֹּתַ֖/י גָּעֲלָ֥ה נַפְשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/043.yaml
  text: But the land will be abandoned by them and will enjoy its Sabbaths while it lies desolate without them[a], and they will accept the punishment for their iniquity, because—indeed, because—they rejected my judgments and their soul abhorred my statutes.
translation:
  language: hi
  text: परन्तु देश उनके द्वारा छोड़ दिया जाएगा और जब वह उनके बिना उजाड़ पड़ा रहेगा, तब वह अपने सब्तों, अर्थात् विश्राम-वर्षों, का लाभ पाएगा; और वे अपने अधर्म के दण्ड को स्वीकार करेंगे[a], क्योंकि—हाँ, क्योंकि—उन्होंने मेरे न्याय-विधानों को तुच्छ जाना और उनके मन ने मेरी विधियों से घृणा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे अपने अधर्म को स्वीकार करेंगे” अथवा “वे अपने अधर्म की भरपाई करेंगे।” हिब्रू मुहावरे के एक से अधिक अर्थ हो सकते हैं; यहाँ वाचा के दण्ड के प्रसंग के अनुसार उसका न्यायिक अर्थ दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָזֵב
  choice: खाली छोड़ दिया जाएगा
  rationale: निफ़अल रूप का निष्क्रिय भाव बनाए रखता है और प्रसंग में देश के निवासियों से रहित हो जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְתִרֶץ אֶת שַׁבְּתֹתֶיהָ
  choice: अपने विश्राम-वर्षों का सुख भोगेगा
  rationale: यहाँ भूमि को मिलने वाले सब्तीय विश्राम का भाव है। 'विश्राम-वर्ष' लैव्यव्यवस्था के कृषि-संबंधी प्रसंग को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: בָּהְשַׁמָּה מֵהֶם
  choice: जब वह उनके बिना उजाड़ पड़ा रहेगा
  rationale: भूमि की उजड़ी दशा और लोगों की अनुपस्थिति—दोनों को व्यक्त करता है।
- source_word: יִרְצוּ אֶת עֲוֺנָם
  choice: अपने अधर्म का दण्ड स्वीकार करेंगे
  rationale: न्याय और वाचा के दण्ड के इस प्रसंग में मुहावरा अधर्म के फलस्वरूप दण्ड भोगने अथवा स्वीकार करने का भाव दे सकता है; अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יַעַן וּבְיַעַן
  choice: क्योंकि—हाँ, क्योंकि—
  rationale: दोहराए गए कारणसूचक पद की प्रबलता को हिन्दी में श्रव्य और स्वाभाविक ढंग से बनाए रखता है।
- source_word: בְּמִשְׁפָּטַי
  choice: मेरे न्याय-विधानों
  rationale: वाचागत कानूनी निर्णयों और नियमों का भाव रखता है तथा חֻקֹּתַי से शब्दगत भेद भी बनाए रखता है।
- source_word: חֻקֹּתַי
  choice: मेरी विधियों
  rationale: स्थापित आदेशों या विधियों का सहज आधुनिक हिन्दी रूप है और पूर्ववर्ती מִשְׁפָּטַי से अलग शब्दावली रखता है।
- source_word: גָּעֲלָה נַפְשָׁם
  choice: उनके प्राण ने ... घृणा की
  rationale: स्रोत के सामूहिक एकवचन 'उनका प्राण' की मानवशास्त्रीय अभिव्यक्ति को सपाट 'उन्होंने घृणा की' में बदलने के बजाय सुरक्षित रखता है।
theological_decisions:
- issue: יִרְצוּ אֶת עֲוֺנָם में עָוֹן का अर्थ
  choice: अपने अधर्म का दण्ड स्वीकार करेंगे
  alternative: अपने अधर्म को स्वीकार करेंगे; अपने अधर्म का प्रायश्चित करेंगे
  rationale: निर्वासन, वाचा के शाप और भूमि के छूटे हुए विश्रामों के प्रसंग में दण्डात्मक अर्थ प्रमुख प्रतीत होता है। फिर भी हिब्रू मुहावरे की वास्तविक बहुअर्थकता पादटिप्पणी में रखी गई है, और अनुवाद स्वयं-अर्जित प्रायश्चित का अनावश्यक सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। कानूनी-वाचागत शब्दावली को बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ भाषा से बचा गया है। भूमि के सब्तों को प्रसंगानुकूल 'विश्राम-वर्ष' कहा गया है।
