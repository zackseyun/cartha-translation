  yaml_path: translation/ot/leviticus/026/020.yaml
  text: Your strength will be spent in vain[a], and your land will not yield its produce, and the trees of the land will not yield their fruit.
translation:
  language: hi
  text: तुम्हारा बल व्यर्थ ही चुक जाएगा,[a] और तुम्हारी भूमि अपनी उपज नहीं देगी, और भूमि के वृक्ष अपना फल नहीं देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “तुम्हारा बल निष्फलता में समाप्त हो जाएगा”; और “भूमि का वृक्ष अपना फल नहीं देगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַם
  choice: चुक जाएगा
  rationale: תמם यहाँ बल के समाप्त या खर्च हो जाने को दर्शाता है। ‘चुक जाएगा’ आधुनिक हिन्दी में स्वाभाविक है और पूर्ण क्षय का भाव बनाए रखता है।
- source_word: לָרִיק
  choice: व्यर्थ ही
  rationale: यह पद निष्फलता और किसी परिणाम के न होने का भाव देता है; ‘व्यर्थ ही’ कृषि-परिश्रम के निष्फल होने को स्पष्ट करता है।
- source_word: כֹּחֲכֶם
  choice: तुम्हारा बल
  rationale: כח का सामान्य अर्थ बल या सामर्थ्य है। यहाँ भूमि पर किए जाने वाले परिश्रम में लगने वाली शक्ति के लिए ‘बल’ उपयुक्त और संक्षिप्त है।
- source_word: תִתֵּן
  choice: देगी / देंगे
  rationale: मूल क्रिया का अर्थ ‘देना’ है। हिन्दी में भूमि का उपज देना और पेड़ों का फल देना स्वाभाविक भी है और मूल बिंब को बनाए रखता है।
- source_word: אַרְצְכֶם
  choice: तुम्हारी भूमि
  rationale: यहाँ ארץ इस्राएलियों की कृषि-भूमि को सूचित करता है; ‘तुम्हारी भूमि’ अर्थ की व्यापकता और वाचा-संबंधी संदर्भ दोनों को बनाए रखता है।
- source_word: יְבוּלָהּ
  choice: अपनी उपज
  rationale: יבול भूमि से प्राप्त सामान्य पैदावार को दर्शाता है। ‘उपज’ स्पष्ट, व्यापक और प्रचलित कृषि-शब्द है।
- source_word: וְעֵץ הָאָרֶץ
  choice: भूमि के पेड़
  rationale: עץ व्याकरणतः एकवचन है, पर यहाँ सामूहिक अर्थ रखता है। हिन्दी में ‘पेड़’ बहुवचन स्वाभाविक रूप से उस सामूहिक अर्थ को व्यक्त करता है।
- source_word: פִּרְיוֹ
  choice: अपना फल
  rationale: इब्रानी प्रत्यय एकवचन है और सामूहिक एकवचन ‘पेड़’ से मेल खाता है। हिन्दी में बहुवचन ‘पेड़’ के साथ ‘अपना फल’ सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
