source:
  edition: WLC
  text: אַף אֲנִ֗י אֵלֵ֤ךְ עִמָּ/ם֙ בְּ/קֶ֔רִי וְ/הֵבֵאתִ֣י אֹתָ֔/ם בְּ/אֶ֖רֶץ אֹיְבֵי/הֶ֑ם אוֹ אָ֣ז יִכָּנַ֗ע לְבָבָ/ם֙ הֶֽ/עָרֵ֔ל וְ/אָ֖ז יִרְצ֥וּ אֶת עֲוֺנָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/041.yaml
  text: I too will walk contrary to them and bring them into the land of their enemies[a]; or then their uncircumcised heart will be humbled[e][d][c][b], and then they will accept the punishment for their iniquity.
translation:
  language: hi
  text: मैं भी उनके विरुद्ध चलूँगा और उन्हें उनके शत्रुओं के देश में ले आऊँगा;[a] या तब उनका खतनारहित हृदय नम्र हो जाएगा,[b] और तब वे अपने अधर्म का दण्ड स्वीकार करेंगे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में भाव यह भी हो सकता है: “मैं भी उनके साथ शत्रुतापूर्वक चलूँगा।” यह अभिव्यक्ति इस अध्याय में बार-बार आने वाली वाचा के शाप की भाषा को दोहराती है।'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “उनका खतनारहित हृदय।” यह भीतरी हठ और अशुद्धता के लिए वाचागत रूपक है। “या तब” वाला मूल इब्रानी पदबंध कठिन है और उस समय की ओर संकेत कर सकता है जब उनका हृदय नम्र होगा।'
    reason: cultural_note_and_alternative_reading
  - marker: c
    text: 'इसका अनुवाद यह भी हो सकता है: “तब वे अपने अधर्म का दण्ड भुगतेंगे” या “तब उनके अधर्म का दण्ड पूरा होगा।” इब्रानी मुहावरा दोष के उचित परिणाम को स्वीकार करने या सहने की ओर संकेत करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אֲנִי
  choice: मैं भी
  rationale: यह पदबंध परमेश्वर की प्रत्युत्तरात्मक कार्रवाई पर बल देता है; ‘मैं भी’ इस बल और पारस्परिकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֵלֵךְ עִמָּם בְּקֶרִי
  choice: उनके साथ विरोध में चलूँगा
  rationale: यह अध्याय में बार-बार आने वाली वाचा-शाप की अभिव्यक्ति को प्रतिध्वनित करता है। ‘विरोध में चलना’ मूल के चलने वाले रूपक और विरोधभाव, दोनों को सुरक्षित रखता है।
- source_word: וְהֵבֵאתִי אֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: उन्हें उनके शत्रुओं के देश में ले आऊँगा
  rationale: हिफ़ील क्रिया का अर्थ ‘ले आना’ है और वाक्यांश निर्वासन की स्थिति को स्पष्ट रूप से व्यक्त करता है।
- source_word: אוֹ אָז
  choice: या तब
  rationale: मूल पदबंध वाक्य-विन्यास की दृष्टि से कठिन है। ‘या तब’ उसके असामान्य विकल्पसूचक बल को बिना चुपचाप सरल किए बनाए रखता है।
- source_word: יִכָּנַע
  choice: नम्र हो जाएगा
  rationale: निफ़अल रूप ‘नम्र किया जाना/नम्र होना’ व्यक्त करता है; हृदय के संदर्भ में यह बाहरी पराजय से अधिक भीतरी दीनता की ओर संकेत करता है।
- source_word: לְבָבָם הֶעָרֵל
  choice: उनका खतनारहित हृदय
  rationale: शाब्दिक वाचागत रूपक को बनाए रखा गया है, क्योंकि यह केवल हठ का सामान्य वर्णन नहीं बल्कि तोराह में धर्मवैज्ञानिक महत्व रखने वाली अभिव्यक्ति है।
- source_word: וְאָז יִרְצוּ אֶת עֲוֺנָם
  choice: तब वे अपने अधर्म का दण्ड भोगेंगे
  rationale: यह मुहावरा दोष के उचित परिणाम को स्वीकार करने या सहने का भाव देता है। ‘दण्ड भोगेंगे’ न्यायिक अर्थ को स्पष्ट करता है और प्रायश्चित अर्जित करने का अनावश्यक संकेत नहीं देता।
theological_decisions:
- issue: हृदय के लिए הֶעָרֵל का रूपक
  choice: ‘खतनारहित हृदय’ के वाचागत रूपक को बनाए रखना
  alternative: ‘हठी हृदय’ या ‘पश्चात्ताप न करने वाला हृदय’
  rationale: मूल पाठ सामान्य हठ से अधिक अर्थ वाला वाचागत रूपक प्रयोग करता है। इसे बनाए रखने से व्यवस्थाविवरण और भविष्यद्वक्ताओं के साथ अंतर्पाठीय संबंध सुरक्षित रहते हैं।
- issue: יִרְצוּ אֶת עֲוֺנָם का अर्थ
  choice: अपने अधर्म का दण्ड भोगना
  alternative: अपने अधर्म का प्रायश्चित करना; अपने दोष को स्वीकार करना; उनके अधर्म का दण्ड पूरा हो जाना
  rationale: संदर्भ वाचा के दण्ड को सहने और दोष के परिणाम चुकाने का है, न कि पुण्यकारी आत्म-प्रायश्चित का। चुना हुआ पाठ न्यायिक भाव को बनाए रखते हुए बाद की धर्मसैद्धान्तिक श्रेणियाँ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘खतनारहित हृदय’ जैसे मूल धर्मवैज्ञानिक रूपक को सुरक्षित रखा गया है; कठिन ‘या तब’ को भी मूल की वास्तविक अस्पष्टता बनाए रखने के लिए पाठ में रखा गया है।
