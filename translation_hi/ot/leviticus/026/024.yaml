source:
  edition: WLC
  text: וְ/הָלַכְתִּ֧י אַף אֲנִ֛י עִמָּ/כֶ֖ם בְּ/קֶ֑רִי וְ/הִכֵּיתִ֤י אֶתְ/כֶם֙ גַּם אָ֔נִי שֶׁ֖בַע עַל חַטֹּאתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/024.yaml
  text: then I also will walk contrary to you[b][a], and I myself will strike you sevenfold for your sins.
translation:
  language: hi
  text: तब मैं भी तुम्हारे विरुद्ध चलूँगा[a], और मैं स्वयं तुम्हारे पापों के कारण तुम पर सात गुना प्रहार करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे प्रति शत्रुता से” अथवा “तुम्हारे विरोध में।” यहाँ प्रयुक्त इब्रानी शब्द लैव्यव्यवस्था 26 में बार-बार आता है और इस्राएल तथा यहोवा के पारस्परिक विरोध को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “सात बार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: तब ... चलूँगा
  rationale: הלך का मूल अर्थ ‘चलना’ है। अध्याय में बार-बार आने वाले वाचा-संबंधी मुहावरे को बनाए रखने के लिए इसे ‘चलूँगा’ रखा गया है; וְ को चेतावनियों की क्रमिक परिणति के अनुसार ‘तब’ कहा गया है।
- source_word: אַף אֲנִי
  choice: मैं भी
  rationale: 'यह पदबंध प्रत्युत्तर और बल दोनों व्यक्त करता है: इस्राएल के विरोध के उत्तर में परमेश्वर भी वैसा रुख अपनाएगा।'
- source_word: עִמָּכֶם בְּקֶרִי
  choice: तुम्हारे साथ विरोध में
  rationale: עִם का ‘साथ’ और कठिन, बार-बार प्रयुक्त קרי का विरोधात्मक भाव दोनों सुरक्षित रहते हैं। यह सहज हिन्दी में पारस्परिक विरोध को व्यक्त करता है।
- source_word: וְהִכֵּיתִי אֶתְכֶם
  choice: तुम्हें ... मारूँगा
  rationale: נכה दंडात्मक प्रहार के लिए प्रयुक्त है। ‘मारूँगा’ वर्तमान हिन्दी में स्पष्ट और सशक्त है, पर अनिवार्य रूप से प्राण लेने का अर्थ नहीं थोपता।
- source_word: גַּם אָ֔נִי
  choice: क्रिया के प्रथम पुरुष रूप में निहित
  rationale: दूसरा emphatic ‘मैं भी/मैं स्वयं’ इब्रानी में कर्ता पर बल देता है। हिन्दी में पहले ही ‘मैं भी’ आने और क्रिया के प्रथम पुरुष रूप के कारण पुनरुक्ति अप्राकृतिक होती; प्रत्यक्ष ईश्वरीय कर्तृत्व बना रहता है।
- source_word: שֶׁבַע
  choice: सात गुना
  rationale: यह दंड की तीव्रता बताने वाला सूत्र है। ‘सात गुना’ उसकी आलंकारिक तीव्रता रखता है, जबकि ‘सात बार’ अधिक गणनात्मक समझा जा सकता है।
- source_word: עַל חַטֹּאתֵיכֶם
  choice: तुम्हारे पापों के कारण
  rationale: यहाँ עַל दंड का आधार या कारण बताता है। ‘के कारण’ आधुनिक हिन्दी में इस संबंध को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर और इस्राएल के पारस्परिक रुख में בְּקֶרִי का अर्थ
  choice: विरोध में
  alternative: शत्रुता से; प्रतिकूल होकर
  rationale: ‘विरोध में’ वाचा के न्याय में पारस्परिक प्रतिरोध को सुरक्षित रखता है, पर शब्द को केवल भावनात्मक शत्रुता के रूप में सीमित नहीं करता।
- issue: שֶׁבַע वाले दंड-सूत्र की अभिव्यक्ति
  choice: सात गुना
  alternative: सात बार
  rationale: ‘सात गुना’ पाठ की तीव्र चेतावनी और संभवतः मुहावरेदार बल को बनाए रखता है, बिना उसे केवल सात अलग घटनाओं की कठोर गणना बना देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल है। ‘विरोध में चलूँगा’ जानबूझकर मूल इब्रानी के आवर्ती मुहावरे और साहित्यिक संबंध को बनाए रखता है।
