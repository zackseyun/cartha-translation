revisions:
- from: तब मैं भी तुम्हारे साथ विरोध में चलूँगा[a], और तुम्हारे पापों के कारण तुम्हें सात गुना[b] मारूँगा।
  to: तब मैं भी तुम्हारे विरुद्ध चलूँगा[a], और मैं स्वयं तुम्हारे पापों के कारण तुम पर सात गुना प्रहार करूँगा[b]।
  rationale: The revision restores the second emphatic ‘मैं स्वयं’ for गַּם אָֽנִי, renders the opposition idiom in more natural Hindi as ‘तुम्हारे विरुद्ध चलूँगा,’ and uses ‘प्रहार करूँगा’ for the non-lethal-specific force of נכה. It retains the causal relation, the sevenfold formula, and both footnote anchors and alternatives.
