id: LEV.26.12
reference: Leviticus 26:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִתְהַלַּכְתִּי֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/הָיִ֥יתִי לָ/כֶ֖ם לֵֽ/אלֹהִ֑ים וְ/אַתֶּ֖ם תִּהְיוּ לִ֥/י לְ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/012.yaml
  text: I will walk among you and will be your God[a], and you will be my people.
translation:
  language: hi
  text: मैं तुम्हारे बीच चला-फिरा करूँगा और तुम्हारा परमेश्वर रहूँगा, और तुम मेरी प्रजा रहोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְהַלַּכְתִּי
  choice: मैं ... चला-फिरा करूँगा
  rationale: हित्पएल रूप निरंतर या मुक्त रूप से चलने-फिरने और उपस्थित रहने का ठोस बिंब देता है। ‘निवास करूँगा’ अर्थ को क्रिया के साधारण आशय से अधिक सीमित कर देता।
- source_word: בְּתוֹכְכֶם
  choice: तुम्हारे बीच
  rationale: यह सामुदायिक मध्य में उपस्थिति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘तुम्हारे भीतर’ आंतरिक वास का भ्रामक संकेत दे सकता है।
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: और तुम्हारा परमेश्वर रहूँगा
  rationale: यह स्थापित वाचा-सूत्र का स्वाभाविक हिन्दी रूप है और सम्बन्धवाचक बल को बनाए रखता है। ‘रहूँगा’ हिन्दी में भावी, स्थायी सम्बन्ध को सहजता से व्यक्त करता है।
- source_word: לֵאלֹהִים
  choice: परमेश्वर
  rationale: इस्राएल की वाचा के प्रसंग में אֱלֹהִים एकमात्र परमेश्वर को सूचित करता है, किसी अनिश्चित ‘देवता’ को नहीं।
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: और तुम मेरी प्रजा रहोगे
  rationale: यह पारस्परिक वाचा-सूत्र का अर्थपूर्ण और स्वाभाविक हिन्दी रूप है; ‘मेरे लिए एक जाति होगे’ अधिक कृत्रिम और कम सम्बन्धपरक होगा।
theological_decisions:
- issue: वाचा-सूत्र का अनुवाद
  choice: ‘तुम्हारा परमेश्वर ... मेरी प्रजा’ के रूप में पारस्परिक सम्बन्ध व्यक्त किया गया।
  alternative: ‘मैं तुम्हारे लिए परमेश्वर होऊँगा, और तुम मेरे लिए एक प्रजा होगे।’
  rationale: चुना हुआ रूप इब्रानी की वाचागत पारस्परिकता और सम्बन्धपरक बल को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है और कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चला-फिरा करूँगा’ मूल क्रिया के सजीव बिंब को बचाता है; ‘प्रजा’ वाचा-सन्दर्भ में עָם के लिए परिचित और उपयुक्त शब्द है।
