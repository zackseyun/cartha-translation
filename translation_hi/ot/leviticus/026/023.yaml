  text: וְ/אִ֨ם בְּ/אֵ֔לֶּה לֹ֥א תִוָּסְר֖וּ לִ֑/י וַ/הֲלַכְתֶּ֥ם עִמִּ֖/י קֶֽרִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/023.yaml
  text: And if by these things you are not corrected by me[a], but walk contrary to me,
translation:
  language: hi
  text: और यदि इन बातों के द्वारा भी तुम मेरे द्वारा सुधारे न जाओगे, बल्कि मेरे विरोध में चलते रहोगे,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का अधिक शाब्दिक रूप है, “मेरे साथ विरोध में चलोगे।” यहाँ प्रयुक्त शब्द विरोध, प्रतिकूलता या शत्रुतापूर्ण रवैये का भाव दे सकता है।
    reason: इब्रानी मुहावरे עִמִּי קֶרִי की शाब्दिक संरचना और उसकी अर्थगत व्यापकता बताने के लिए।
lexical_decisions:
- source_word: בְּאֵלֶּה
  choice: इन सबके द्वारा भी
  rationale: ב को साधनवाचक मानते हुए यह पद पिछले दण्डों और ताड़नाओं की ओर संकेत करता है। ‘भी’ प्रसंग में लगातार चेतावनी के बावजूद बने रहने वाले रवैये को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִוָּסְרוּ
  choice: शिक्षा न लोगे
  rationale: יסר के निफ़अल रूप में ताड़ना, अनुशासन या सुधार ग्रहण करने का भाव है। ‘शिक्षा न लोगे’ यह स्पष्ट करता है कि ताड़ना दी जा चुकी है, पर उससे अपेक्षित सुधार नहीं हुआ।
- source_word: לִי
  choice: मुझसे
  rationale: यह सर्वनामिक प्रयोग परमेश्वर को अनुशासन के स्रोत और सम्बंधगत केंद्र के रूप में रखता है। ‘मुझसे’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है, यद्यपि इब्रानी संबंध कुछ मुहावरेदार है।
- source_word: וַהֲלַכְתֶּם
  choice: बल्कि ... चलते रहोगे
  rationale: वाव यहाँ पिछले खण्ड के विपरीत परिणाम को आगे बढ़ाता है। ‘बल्कि’ विरोध को और ‘रहोगे’ लगातार बने रहने वाले आचरण को व्यक्त करता है।
- source_word: עִמִּי קֶרִי
  choice: मेरे प्रति विरोध में
  rationale: शाब्दिक संरचना ‘मेरे साथ’ और विरोध/शत्रुता सूचक संज्ञा का मेल है। हिन्दी में ‘मेरे प्रति विरोध में’ संबंधगत विरोध को स्पष्ट रखता है और केवल किसी एक मनोभाव तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: वाचा-संबंधी मुहावरे עִמִּי קֶרִי का अनुवाद
  choice: मेरे प्रति विरोध में चलते रहोगे
  alternative: मेरे साथ शत्रुता से चलते रहोगे
  rationale: चुना हुआ रूप परमेश्वर के विरुद्ध बने रहने वाले व्यवहार को दर्शाता है, पर קֶרִי को केवल तीव्र ‘शत्रुता’ तक सीमित नहीं करता। पादटिप्पणी इब्रानी की असामान्य संरचना और अर्थ-सीमा को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शिक्षा लेना’ ताड़ना से सुधार ग्रहण करने का सामान्य हिन्दी मुहावरा है; ‘विरोध में चलते रहना’ जीवन-व्यवहार के निरंतर ढंग को व्यक्त करता है।
