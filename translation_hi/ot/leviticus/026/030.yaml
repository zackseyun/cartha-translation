  text: וְ/הִשְׁמַדְתִּ֞י אֶת בָּמֹֽתֵי/כֶ֗ם וְ/הִכְרַתִּי֙ אֶת חַמָּ֣נֵי/כֶ֔ם וְ/נָֽתַתִּי֙ אֶת פִּגְרֵי/כֶ֔ם עַל פִּגְרֵ֖י גִּלּוּלֵי/כֶ֑ם וְ/גָעֲלָ֥ה נַפְשִׁ֖/י אֶתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/030.yaml
  text: And I will destroy your high places[a], and cut down your incense altars, and place your corpses on the carcasses of your idols[b], and my soul will abhor you.
translation:
  language: hi
  text: मैं तुम्हारे ऊँचे पूजा-स्थलों को नष्ट कर दूँगा[a], तुम्हारे धूप-स्तंभों को काट गिराऊँगा[b], और तुम्हारे शवों को तुम्हारी मूर्तियों के शवों पर रख दूँगा[c]; और मेरा प्राण तुमसे घृणा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘तुम्हारे ऊँचे स्थान’; यह पद ऐसे पूजा-स्थलों के लिए प्रयुक्त होता है जो प्रायः ऊँचे स्थानों पर होते थे और यहाँ अस्वीकृत उपासना से जुड़े हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘धूप-स्तंभ’ का सटीक अर्थ विवादित है; इसका अर्थ ‘सूर्य-स्तंभ’ भी हो सकता है। यह अस्वीकृत उपासना से जुड़ी किसी पूजावस्तु का पद है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में लोगों और उनकी मूर्तियों—दोनों के लिए ‘शव’ शब्द दोहराया गया है। इससे मूर्तियों की निर्जीवता और उनका अपमान उभरता है; ‘मूर्तियाँ’ वाला इब्रानी शब्द स्वयं भी तिरस्कारपूर्ण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁמַדְתִּי
  choice: नष्ट कर दूँगा
  rationale: हिफ़ील रूप पूर्ण विनाश कराने की प्रबल क्रिया व्यक्त करता है; यह हिन्दी में स्वाभाविक और पर्याप्त रूप से कठोर है।
- source_word: בָּמֹתֵיכֶם
  choice: तुम्हारे पूजा-स्थलों
  rationale: במות यहाँ अवैध उपासना से जुड़े ऊँचे अथवा स्थानीय धार्मिक स्थलों को दर्शाता है। केवल ‘ऊँचे स्थान’ आधुनिक हिन्दी में अर्थ अस्पष्ट कर सकता है, इसलिए कार्यगत अर्थ मुख्य पाठ में रखा गया है।
- source_word: הִכְרַתִּי
  choice: काट गिराऊँगा
  rationale: כרת का ठोस अर्थ काटना है; खड़ी धार्मिक वस्तुओं के संदर्भ में ‘काट गिराना’ दृश्य बिंब को बनाए रखता है।
- source_word: חַמָּנֵיכֶם
  choice: तुम्हारे धूप-स्तंभों
  rationale: חמנים विवादित प्रकार की पूजावस्तुओं को सूचित करता है, संभवतः सूर्य-स्तंभ या धूप से जुड़ी संरचनाएँ। ‘धूप-स्तंभ’ पठनीय है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: פִּגְרֵיכֶם ... פִּגְרֵי גִּלּוּלֵיכֶם
  choice: तुम्हारे शवों ... तुम्हारी मूर्तियों के शवों
  rationale: פגר की पुनरावृत्ति मनुष्यों और निर्जीव मूर्तियों को जानबूझकर एक ही अपमानजनक चित्र में रखती है; हिन्दी में ‘शव’ दोहराकर यह शब्दालंकार बचाया गया है।
- source_word: גִּלּוּלֵיכֶם
  choice: तुम्हारी मूर्तियों
  rationale: यह मूर्तियों के लिए तिरस्कारपूर्ण पद है। मुख्य पाठ में स्पष्ट ‘मूर्तियाँ’ रखा गया है और उसकी अपमानसूचक छाया पादटिप्पणी में बताई गई है।
- source_word: גָעֲלָה נַפְשִׁי אֶתְכֶם
  choice: मेरा प्राण तुमसे घृणा करेगा
  rationale: शाब्दिक ‘मेरा प्राण’ ईश्वरीय विकर्षण की तीव्र, मानवरूपी अभिव्यक्ति को बनाए रखता है; इसे केवल ‘मैं घृणा करूँगा’ कहकर समतल नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय विकर्षण की मानवरूपी अभिव्यक्ति
  choice: मेरा प्राण तुमसे घृणा करेगा
  alternative: मैं तुमसे घृणा करूँगा / मैं तुम्हें ठुकरा दूँगा
  rationale: נפשי को व्यक्त रूप में बनाए रखने से मूल पाठ की तीव्रता और धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, दंडादेश-संगत स्वर रखा गया है। ‘पूजा-स्थल’ साधारण पाठक के लिए स्पष्ट है; ‘धूप-स्तंभ’ के विवादित अर्थ को पादटिप्पणी से सीमित किया गया है। ‘मेरा प्राण’ जानबूझकर औपचारिक और स्रोत-समीप है।
