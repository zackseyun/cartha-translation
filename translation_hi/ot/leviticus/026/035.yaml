  text: כָּל יְמֵ֥י הָשַּׁמָּ֖/ה תִּשְׁבֹּ֑ת אֵ֣ת אֲשֶׁ֧ר לֹֽא שָׁבְתָ֛ה בְּ/שַׁבְּתֹתֵי/כֶ֖ם בְּ/שִׁבְתְּ/כֶ֥ם עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/035.yaml
  text: All the days of its desolation it shall rest—the rest that it did not have during your Sabbaths[b][a], while you were dwelling on it.
translation:
  language: hi
  text: उसके उजाड़ पड़े रहने के पूरे समय वह विश्राम करेगी—वह विश्राम, जो तुम्हारे सब्तों[a] के समय उसे नहीं मिला था, जब तुम उस पर रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ “तुम्हारे सब्तों” से भूमि को मिलने वाले सब्तीय विश्राम अभिप्रेत हैं, विशेष रूप से आसपास के संदर्भ में बताए गए सब्त-वर्ष। अधिक शाब्दिक रूप से, यह वाक्यांश हो सकता है: “वह उतना विश्राम करेगी, जितना उसने तुम्हारे सब्तों के समय नहीं किया था।” हिब्रू में “विश्राम करना” क्रिया दोहराई गई है।'
    reason: lexical_alternative_and_context
lexical_decisions:
- source_word: כָּל יְמֵי הָשַּׁמָּה
  choice: उसके उजाड़ पड़े रहने के पूरे समय
  rationale: כָּל יְמֵי एक समग्र कालावधि व्यक्त करता है और הָשַּׁמָּה भूमि की उजड़ी अवस्था को दर्शाता है। यह हिंदी प्रयोग स्वाभाविक ढंग से पूरी अवधि को सामने रखता है।
- source_word: תִּשְׁבֹּת
  choice: वह विश्राम करेगी
  rationale: स्त्रीलिंग एकवचन क्रिया का कर्ता भूमि है। ‘विश्राम करेगी’ शׁבת के मूल अर्थ तथा भूमि के सब्तीय विश्राम—दोनों को बनाए रखता है।
- source_word: אֵת אֲשֶׁר לֹא שָׁבְתָה
  choice: वह विश्राम, जो ... उसे नहीं मिला था
  rationale: हिब्रू में ‘विश्राम करना’ क्रिया की पुनरावृत्ति है। हिंदी में संज्ञात्मक रूप स्पष्ट और स्वाभाविक है, जबकि भूमि को पहले न मिले विश्राम का भाव सुरक्षित रहता है।
- source_word: בְּשַׁבְּתֹתֵיכֶם
  choice: तुम्हारे सब्तों के समय
  rationale: शाब्दिक संबंध बनाए रखते हुए ‘सब्तों’ की बहुवचन अस्पष्टता सुरक्षित रखी गई है; निकटवर्ती संदर्भ बताता है कि भूमि को मिलने वाले सब्तीय विश्राम, विशेषतः सब्त-वर्ष, अभिप्रेत हैं।
- source_word: בְּשִׁבְתְּכֶם עָלֶיהָ
  choice: जब तुम उस पर बसे हुए थे
  rationale: ישׁב का यहाँ अर्थ भूमि पर निवास करना है। यह हिंदी में कालगत संबंध और भूमि पर इस्राएल के बसने का भाव स्पष्ट करता है।
theological_decisions:
- issue: ‘तुम्हारे सब्तों’ का संदर्भ
  choice: मुख्य पाठ में व्यापक और शाब्दिक ‘तुम्हारे सब्तों’ रखा गया
  alternative: ‘तुम्हारे सब्त-वर्षों’
  rationale: आसपास का संदर्भ भूमि के सब्तीय विश्राम, विशेषतः सब्त-वर्षों, की ओर संकेत करता है; फिर भी बहुवचन שַׁבָּתוֹת को केवल एक विशिष्ट व्याख्या तक सीमित न करके टिप्पणी में स्पष्ट करना अधिक स्रोत-संगत है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। भूमि के लिए स्त्रीलिंग सर्वनाम और क्रिया का प्रयोग किया गया है। ‘सब्त’ बाइबिलीय पदावली के रूप में रखा गया और उसकी संदर्भगत व्याख्या पादटिप्पणी में दी गई है।
