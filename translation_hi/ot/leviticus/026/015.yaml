  yaml_path: translation/ot/leviticus/026/015.yaml
  text: and if you reject my statutes[a], and if your soul abhors my judgments, so that you do not do all my commandments, thereby breaking my covenant[c][b],
translation:
  language: hi
  text: और यदि तुम मेरी विधियों को ठुकराओ, और यदि तुम्हारा प्राण[a] मेरे न्याय-विधानों[b] से घृणा करे, यहाँ तक कि तुम मेरी सभी आज्ञाओं का पालन न करो और इस प्रकार मेरी वाचा को तोड़ दो[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारा प्राण घृणा करे।” यहाँ “प्राण” पूरे व्यक्ति या अस्तित्व को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “न्याय-विधानों” का अनुवाद “नियमों” या “निर्णयों” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “इस प्रकार मेरी वाचा का उल्लंघन करो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֻקֹּתַי
  choice: मेरी विधियों
  rationale: यह निर्धारित विधान या नियम के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और מִשְׁפָּטַי से भेद बनाए रखता है।
- source_word: תִּמְאָסוּ
  choice: ठुकराओ
  rationale: इसमें केवल अस्वीकार नहीं, बल्कि तिरस्कारपूर्वक अस्वीकार करने की छाया भी है।
- source_word: מִשְׁפָּטַי
  choice: मेरे न्याय-विधानों
  rationale: यह कानूनी निर्णयों अथवा नियमों का भाव रखता है और חֻקֹּתַי से शब्दगत भेद बनाए रखता है।
- source_word: תִּגְעַל נַפְשְׁכֶם
  choice: तुम्हारा मन ... से घृणा करे
  rationale: नֶפֶשׁ यहाँ व्यक्ति के भीतरी स्व या संपूर्ण अस्तित्व को सूचित करता है; ‘मन’ हिन्दी में इस मुहावरे को सहज और तीव्र रखता है।
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: जिससे ... पालन न करो
  rationale: यह घृणा के परिणामस्वरूप होने वाली अवज्ञा को स्पष्ट करता है; आज्ञाओं को ‘करने’ के लिए हिन्दी में ‘पालन करना’ स्वाभाविक है।
- source_word: כָּל מִצְוֺתַי
  choice: मेरी सभी आज्ञाओं
  rationale: מִצְוֹת के वाचा-संबंधी आदेशात्मक अर्थ को बनाए रखता है।
- source_word: לְהַפְרְכֶם
  choice: इस प्रकार ... तोड़ दो
  rationale: हिफ़ील रूप यहाँ वाचा को भंग या निष्फल करने का अर्थ देता है और पूर्ववर्ती अवज्ञा से परिणाम का संबंध दिखाता है।
- source_word: בְּרִיתִי
  choice: मेरी वाचा
  rationale: बाइबलीय कानूनी और संबंधपरक संधि के लिए ‘वाचा’ सटीक तथा प्रचलित हिन्दी पद है।
theological_decisions:
- issue: נֶפֶשׁ को मुहावरे में कैसे व्यक्त किया जाए
  choice: तुम्हारा मन ... से घृणा करे
  alternative: तुम्हारा प्राण ... से घृणा करे / तुम्हारा पूरा अस्तित्व ... से घृणा करे
  rationale: ‘मन’ आधुनिक हिन्दी में भीतरी व्यक्ति की अरुचि को स्वाभाविक रूप से व्यक्त करता है; पादटिप्पणी मूल के ‘प्राण’ और व्यापक अर्थ की जानकारी देती है, बिना किसी विशिष्ट आत्मा-सिद्धांत को आरोपित किए।
- issue: वाचा-संबंधी कानूनी पदों का भेद
  choice: विधियाँ / न्याय-विधान / आज्ञाएँ / वाचा
  alternative: नियम / निर्णय / आदेश / वाचा
  rationale: मूल पदों की विविधता और कानूनी-वाचा संबंधी बनावट को यथासंभव बनाए रखा गया है।
- issue: לְהַפְרְכֶם का वाचा पर प्रभाव
  choice: वाचा को तोड़ दो
  alternative: वाचा का उल्लंघन करो
  rationale: ‘तोड़ना’ स्रोत के वाचा-भंग के तीखे भाव को सुरक्षित रखता है; ‘उल्लंघन’ वैध वैकल्पिक अभिव्यक्ति है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और वाचा-संबंधी कानूनी लहजा रखा गया है। ‘विधियाँ’, ‘न्याय-विधान’ और ‘आज्ञाएँ’ मूल के अलग-अलग शब्दों का भेद बचाते हैं; ‘मन’ सहज हिन्दी देता है, जबकि पादटिप्पणी נֶפֶשׁ की शाब्दिक और व्यापक अर्थ-सीमा सुरक्षित करती है।
