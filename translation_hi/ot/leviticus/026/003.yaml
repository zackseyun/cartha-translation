revisions:
- from: यदि तुम मेरी विधियों पर चलो[a], मेरी आज्ञाओं का पालन करो और उन्हें पूरा करो,
  to: यदि तुम मेरी विधियों के अनुसार चलो[a], मेरी आज्ञाओं का पालन करो और उन्हें मानो,
  rationale: The revision uses idiomatic modern Hindi for the Hebrew covenantal idiom while preserving its literal form in the footnote. It also replaces the potentially ambiguous “उन्हें पूरा करो” with “उन्हें मानो,” which naturally expresses actually doing the commandments and maintains the source’s deliberate sequence of walking, keeping, and doing.
