  yaml_path: translation/ot/leviticus/026/003.yaml
  text: If you walk in my statutes and keep my commandments and do them,[a]
translation:
  language: hi
  text: यदि तुम मेरी विधियों के अनुसार चलो[a], मेरी आज्ञाओं का पालन करो और उन्हें मानो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी विधियों पर चलो।” इब्रानी में शाब्दिक रूप से “मेरी विधियों में चलो” है; यह अपने जीवन को उनके अनुसार चलाने का वाचा-संबंधी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह स्पष्ट शर्तसूचक अव्यय है; ‘यदि’ वाचा-संबंधी कथन की शर्त को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּחֻקֹּתַי
  choice: मेरी विधियों पर
  rationale: חֻקּוֹת निर्धारित विधियों या नियमों को दर्शाता है। הלך के साथ ב जीवन-आचरण को उनके अनुसार ढालने का मुहावरा बनाता है; हिन्दी में ‘पर चलना’ कानूनी-वाचा संबंधी भाव और रूपक दोनों को रखता है।
- source_word: תֵּלֵכוּ
  choice: चलो
  rationale: הלך का मूल अर्थ ‘चलना’ है और यहाँ यह जीवन-व्यवहार का रूपक है। ‘चलो’ स्रोत की बाइबलीय छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: מִצְוֺתַי
  choice: मेरी आज्ञाओं
  rationale: מִצְוָה का अर्थ आज्ञा है; बहुवचन ‘आज्ञाओं’ पद के विधिक स्वर और परमेश्वर के निर्देशों को स्पष्ट करता है।
- source_word: תִּשְׁמְרוּ
  choice: पालन करो
  rationale: שׁמר विधिक संदर्भ में आज्ञाओं को मानने और उनका पालन करने का अर्थ देता है। शाब्दिक ‘रक्षा करो’ की अपेक्षा ‘पालन करो’ आधुनिक हिन्दी में आशय को ठीक व्यक्त करता है।
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: और उन्हें पूरा करो
  rationale: עשה यहाँ उक्त आज्ञाओं को व्यवहार में करने का बोध देता है। ‘उन्हें पूरा करो’ वास्तविक क्रियान्वयन पर दिए गए बल को स्पष्ट और सहज हिन्दी में रखता है।
theological_decisions:
- issue: वाचा-संबंधी आज्ञाकारिता का रूपक
  choice: ‘मेरी विधियों पर चलो’ रूपक को बनाए रखा गया।
  alternative: ‘मेरी विधियों के अनुसार जीवन बिताओ’ या ‘मेरी विधियों का अनुसरण करो।’
  rationale: इब्रानी अभिव्यक्ति जीवन के पूरे आचरण को विधियों के अनुरूप रखने का संकेत देती है। ‘पर चलो’ स्रोत की रूपकात्मक बनावट और वाचा-संबंधी भाव को सुरक्षित रखता है, जबकि आगे ‘पालन करो’ और ‘पूरा करो’ उसका व्यावहारिक आशय स्पष्ट करते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘विधियाँ’ और ‘आज्ञाएँ’ विधिक-वाचा संबंधी भेद को बनाए रखते हैं; ‘पर चलना’ हिन्दी का स्वाभाविक रूपक है। पद अगले वाक्य से जुड़ी शर्त का आरम्भ है, इसलिए अंत में अल्पविराम रखा गया है।
