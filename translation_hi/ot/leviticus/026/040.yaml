  edition: WLC
  text: וְ/הִתְוַדּ֤וּ אֶת עֲוֺנָ/ם֙ וְ/אֶת עֲוֺ֣ן אֲבֹתָ֔/ם בְּ/מַעֲלָ֖/ם אֲשֶׁ֣ר מָֽעֲלוּ בִ֑/י וְ/אַ֕ף אֲשֶׁר הָֽלְכ֥וּ עִמִּ֖/י בְּ/קֶֽרִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/040.yaml
  text: But if they confess their iniquity and the iniquity of their fathers[a], in the unfaithfulness by which they were unfaithful to me, and also that they walked contrary to me[b],
translation:
  language: hi
  text: परन्तु यदि वे अपने अधर्म और अपने पुरखाओं के अधर्म को, और उस विश्वासघात को भी जो उन्होंने मेरे प्रति किया, स्वीकार करें, और यह भी स्वीकार करें कि वे मेरे विरुद्ध चलते रहे[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे मेरे प्रति शत्रुता से चलते रहे।” यहाँ प्रयुक्त इब्रानी शब्द कठिन है और इस अध्याय में विरोधी अथवा शत्रुतापूर्ण आचरण के लिए बार-बार आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: यदि वे ... मान लें
  rationale: हितपाएल रूप यहाँ अपने अपराध को स्वीकार करने के अर्थ में है। पूर्ववर्ती प्रसंग की शर्तात्मक धारा को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘यदि’ रखा गया है।
- source_word: עֲוֺנָם
  choice: अपने अधर्म
  rationale: עָוֹן दोषपूर्ण पाप-कर्म, अपराध या उससे उत्पन्न दोष को सूचित कर सकता है; यहाँ स्वीकार किए जाने वाले नैतिक अपराध के लिए ‘अधर्म’ उपयुक्त और गरिमापूर्ण है।
- source_word: עֲוֺן אֲבֹתָם
  choice: अपने पुरखाओं के अधर्म
  rationale: इब्रानी रचना पूर्वज पिताओं के अधर्म को स्पष्ट रूप से रखती है। ‘पुरखाओं’ आधुनिक हिन्दी में वंशगत संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בִי
  choice: उस विश्वासघात को, जो उन्होंने मेरे प्रति किया
  rationale: संज्ञा और सजातीय क्रिया वाचा-संबंधी निष्ठाभंग पर बल देती हैं। हिन्दी में एक ही धातु की अस्वाभाविक पुनरुक्ति से बचते हुए ‘विश्वासघात’ इस संबंधपरक गंभीरता को बनाए रखता है।
- source_word: וְאַף
  choice: और यह भी
  rationale: यह स्वीकारोक्ति में एक और विषय जोड़ता है; ‘और यह भी’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: הָלְכוּ עִמִּי בְּקֶרִי
  choice: वे मेरे विरुद्ध चलते रहे
  rationale: הלך ... בקרי का संयुक्त भाव आचरण में विरोध या शत्रुतापूर्ण प्रतिकूलता है। ‘चलते रहे’ इब्रानी के चाल-चलन वाले रूपक को बनाए रखता है।
theological_decisions:
- issue: सामूहिक स्वीकारोक्ति में पुरखाओं का अधर्म
  choice: मुख्य पाठ में ‘अपने पुरखाओं के अधर्म’ को स्पष्ट रूप से बनाए रखा गया है।
  alternative: ‘अपने पूर्वजों के पाप’ या केवल उनके पापों के परिणाम
  rationale: इब्रानी पाठ उनके अपने अधर्म के साथ उनके पुरखाओं के अधर्म की स्वीकारोक्ति भी स्पष्टतः कहता है। इसे केवल परिणाम या उदाहरण तक सीमित करना पाठ के सामूहिक और वाचा-संबंधी आयाम को कम कर देगा।
- issue: קֶרִי का कठिन अर्थ
  choice: मुख्य पाठ में ‘मेरे विरुद्ध’
  alternative: ‘मेरे प्रति शत्रुता से’ या ‘हठपूर्वक मेरे विरोध में’
  rationale: इस अध्याय में बार-बार आने वाला קֶרִי दुर्लभ और अर्थ की दृष्टि से कठिन है। ‘विरुद्ध’ विरोधी आचरण को व्यक्त करता है, जबकि पादटिप्पणी शत्रुता वाले संभावित अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘मान लें’ स्वीकारोक्ति को स्वाभाविक ढंग से व्यक्त करता है; ‘अधर्म,’ ‘विश्वासघात’ और ‘मेरे विरुद्ध चलते रहे’ मूल पाठ के नैतिक, संबंधपरक और रूपकात्मक बल को बनाए रखते हैं।
