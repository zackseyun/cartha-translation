source:
  edition: WLC
  text: וְ/אַף גַּם זֹ֠את בִּֽ/הְיוֹתָ֞/ם בְּ/אֶ֣רֶץ אֹֽיְבֵי/הֶ֗ם לֹֽא מְאַסְתִּ֤י/ם וְ/לֹֽא גְעַלְתִּי/ם֙ לְ/כַלֹּתָ֔/ם לְ/הָפֵ֥ר בְּרִיתִ֖/י אִתָּ֑/ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/044.yaml
  text: Yet even then[a], when they are in the land of their enemies, I will not reject them, and I will not abhor them so as to destroy them, to break my covenant with them[c][b]; for I am Yahweh their God.
translation:
  language: hi
  text: फिर भी, जब वे अपने शत्रुओं के देश में होंगे, तब भी मैं उन्हें न तो ठुकराऊँगा, न उनसे ऐसी घृणा करूँगा कि उन्हें पूरी तरह नष्ट कर दूँ और उनके साथ अपनी वाचा तोड़ दूँ; क्योंकि मैं याहवे[a], उनका परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ उस ईश्वरीय नाम יהוה (YHWH) का लिप्यंतरण है, जिसे हिन्दी परंपरा में ‘यहोवा’ और अनेक अनुवादों में ‘प्रभु’ लिखा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף גַּם זֹאת
  choice: फिर भी ... तब भी
  rationale: यह संयुक्त पद पिछले न्याय-वचनों के बावजूद प्रबल रियायत या विरोध का भाव देता है। हिन्दी में विभाजित संरचना स्वाभाविक रूप से इस बल को व्यक्त करती है।
- source_word: בִּהְיוֹתָם בְּאֶרֶץ אֹיְבֵיהֶם
  choice: जब वे अपने शत्रुओं के देश में होंगे
  rationale: ב के साथ infinitive construct कालगत परिस्थिति बताता है; प्रसंग भावी निर्वासन की ओर उन्मुख है।
- source_word: לֹא מְאַסְתִּים
  choice: मैं उन्हें ... नहीं ठुकराऊँगा
  rationale: מָאַס का यहाँ भाव संबंध-विच्छेदकारी अस्वीकार है। ‘ठुकराना’ आधुनिक हिन्दी में इस वाचागत अर्थ को स्पष्ट रखता है।
- source_word: וְלֹא גְעַלְתִּים
  choice: न उनसे ऐसी घृणा करूँगा
  rationale: גָּעַל तीव्र घृणा या वितृष्णा दर्शाता है। ‘घृणा करना’ साधारण पाठक के लिए स्पष्ट है और क्रिया की प्रबलता बनाए रखता है।
- source_word: לְכַלֹּתָם
  choice: कि उनका पूरी तरह अन्त कर दूँ
  rationale: כָּלָה यहाँ पूर्णतः समाप्त या नष्ट कर देने का अर्थ देता है; ‘पूरी तरह’ पूर्ण विनाश के भाव को सुरक्षित रखता है।
- source_word: לְהָפֵר בְּרִיתִי אִתָּם
  choice: और उनके साथ बाँधी अपनी वाचा तोड़ दूँ
  rationale: הֵפֵר वाचा को तोड़ने या निष्प्रभावी करने का अर्थ देता है। ‘साथ बाँधी’ हिन्दी में संबंध को स्वाभाविक और स्पष्ट बनाता है।
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: क्योंकि मैं याहवे, उनका परमेश्वर हूँ
  rationale: כִּי आधार या कारण प्रस्तुत करता है और יהוה को उसके निजी वाचागत नाम के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय निजी नाम सीधे उपस्थित है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है; पादटिप्पणी पारंपरिक हिन्दी रूप की जानकारी देती है।
- issue: מְאַסְתִּים और גְעַלְתִּים के qatal रूपों का कालगत मूल्य
  choice: 'भावी प्रतिज्ञात्मक रूप: ‘नहीं ठुकराऊँगा ... न ... घृणा करूँगा’'
  alternative: 'पूर्ण भूत: ‘मैंने नहीं ठुकराया ... घृणा नहीं की’; सामान्य वर्तमान'
  rationale: रूप अपने आप में केवल एक सरल काल निर्धारित नहीं करते। अध्याय का भावी निर्वासन-संदर्भ और उस दशा में परमेश्वर की स्थायी वाचागत प्रतिबद्धता हिन्दी में भावी प्रतिज्ञात्मक रूप को उपयुक्त बनाती है, जबकि व्याख्यात्मक तनाव को टिप्पणी में स्वीकार किया गया है।
- issue: दो ל infinitives के बीच संबंध
  choice: पूर्ण अन्त करने और वाचा तोड़ने को घृणा/त्याग के परिणामी उद्देश्य के रूप में साथ रखा
  alternative: 'दो स्वतंत्र उद्देश्य: ‘उनका अन्त करने के लिए, अपनी वाचा तोड़ने के लिए’'
  rationale: हिब्रू दोनों infinitives को समानांतर रखता है। हिन्दी वाक्य उन्हें निकटता से जोड़ता है, पर यह दावा नहीं करता कि दोनों पूर्णतः एक ही क्रिया हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वाचा’ बाइबलीय संदर्भ में प्रचलित और अर्थपूर्ण पद होने के कारण रखा गया है। वाक्य की पुनरुक्त ‘फिर भी ... तब भी’ संरचना हिब्रू के प्रबल रियायती बल को स्वाभाविक हिन्दी में व्यक्त करती है।
