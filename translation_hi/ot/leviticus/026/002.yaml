  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘सब्त’ और ‘पवित्रस्थान’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं; आज्ञा के लिए सहज हिन्दी का ‘मानना’ और ‘आदर करना’ प्रयोग हुआ है।
