  yaml_path: translation/ot/leviticus/026/002.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: hi
  text: तुम मेरे सब्तों का पालन करना और मेरे पवित्रस्थान का आदर करना[a]। मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे पवित्रस्थान का भय मानना” अथवा “मेरे पवित्रस्थान के प्रति विस्मयपूर्ण श्रद्धा रखना।” इब्रानी क्रिया प्रसंग के अनुसार भय, आदर या विस्मयपूर्ण श्रद्धा व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: मेरे सब्तों
  rationale: इब्रानी में बहुवचन और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय है। बहुवचन बनाए रखने से सभी निर्धारित सब्त-समयों की व्यापकता सुरक्षित रहती है।
- source_word: תִּשְׁמֹרוּ
  choice: मानना
  rationale: שׁמר आज्ञाओं और पवित्र समयों के संदर्भ में सावधानी से पालन करने का भाव देता है; आधुनिक हिन्दी में ‘मानना’ स्वाभाविक और स्पष्ट है।
- source_word: וּמִקְדָּשִׁי
  choice: मेरे पवित्रस्थान
  rationale: מִקְדָּשׁ पवित्र स्थान अथवा उपासना-स्थान को दर्शाता है। ‘पवित्रस्थान’ प्रतिष्ठित, संक्षिप्त और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: תִּירָאוּ
  choice: आदर करना
  rationale: ירא भय, श्रद्धा और विस्मय का अर्थ दे सकता है। पवित्रस्थान के प्रति आदेश में ‘आदर करना’ श्रद्धापूर्ण पवित्र भय को सहज हिन्दी में व्यक्त करता है; अर्थ-सीमा पादटिप्पणी में रखी गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: אֲנִי יְהוָה
  choice: मैं यहोवा हूँ
  rationale: यह वाचा-सूत्र वक्ता की पहचान और आज्ञाओं के पीछे उसके अधिकार को सीधे बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में अधिक पहचाना जाने वाला नामरूप है।
- issue: पवित्रस्थान के संदर्भ में ירא का बल
  choice: आदर करना
  alternative: भय मानना / विस्मित होकर श्रद्धा रखना
  rationale: यह चयन केवल आतंक का अर्थ थोपे बिना पवित्र श्रद्धा को व्यक्त करता है, जबकि इब्रानी की व्यापक अर्थ-सीमा पादटिप्पणी में स्पष्ट की गई है।
