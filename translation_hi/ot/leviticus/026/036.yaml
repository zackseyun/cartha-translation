source:
  edition: WLC
  text: וְ/הַ/נִּשְׁאָרִ֣ים בָּ/כֶ֔ם וְ/הֵבֵ֤אתִי מֹ֨רֶךְ֙ בִּ/לְבָבָ֔/ם בְּ/אַרְצֹ֖ת אֹיְבֵי/הֶ֑ם וְ/רָדַ֣ף אֹתָ֗/ם ק֚וֹל עָלֶ֣ה נִדָּ֔ף וְ/נָס֧וּ מְנֻֽסַת חֶ֛רֶב וְ/נָפְל֖וּ וְ/אֵ֥ין רֹדֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/036.yaml
  text: As for those of you who remain, I will bring faintness into their hearts in the lands of their enemies, and the sound of a driven leaf will pursue them; they will flee as one flees from the sword, and they will fall when no one is pursuing.
translation:
  language: hi
  text: और तुममें से जो बचे रहेंगे, उनके हृदयों में मैं उनके शत्रुओं के देशों में दुर्बलता भर दूँगा। उड़ाए गए पत्ते की आवाज़[a] उनका पीछा करेगी; वे ऐसे भागेंगे मानो तलवार के सामने से भाग रहे हों, और पीछा करने वाला कोई न होने पर भी वे गिर पड़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हवा से उड़ाए गए पत्ते की आवाज़।”
    reason: नִדָּף का अर्थ ‘उड़ाया/बहाया गया’ है; हवा संभावित साधन है, पर इब्रानी पाठ उसे स्पष्ट कर्ता नहीं बताता।
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּכֶם
  choice: तुममें से जो बचे रहेंगे
  rationale: यह सहभागी रूप न्याय के बाद शेष बचे लोगों को दर्शाता है, और בכם इस समूह को इस्राएल के भीतर से चिह्नित करता है।
- source_word: וְהֵבֵאתִי מֹרֶךְ בִּלְבָבָם
  choice: उनके हृदयों में मैं ... कायरता भर दूँगा
  rationale: מֹרֶךְ साहस टूटने और भयभीत मनोदशा का बोध कराता है। स्वाभाविक हिन्दी में ‘भर दूँगा’ हिफ़ील क्रिया के कारक भाव को स्पष्ट रखता है।
- source_word: בְּאַרְצֹת אֹיְבֵיהֶם
  choice: उनके शत्रुओं के देशों में
  rationale: ‘देशों’ मूल के बहुवचन को बनाए रखता है और निर्वासन में अनेक भूभागों में बिखराव का संकेत देता है।
- source_word: קוֹל עָלֶה נִדָּף
  choice: उड़ते हुए पत्ते की आवाज़
  rationale: נדף पत्ते के उड़ाए या बहाए जाने का निष्क्रिय भाव रखता है; हिन्दी में यह रूप सहज है और हवा को अनावश्यक रूप से स्पष्ट कर्ता नहीं बनाता।
- source_word: וְרָדַף אֹתָם
  choice: उनका पीछा करेगी
  rationale: רדף का सीधा अर्थ पीछा करना है; यहाँ पत्ते की आवाज़ को पीछा करने वाली बताने वाली भयपूर्ण विडंबना सुरक्षित रहती है।
- source_word: וְנָסוּ מְנֻסַת חֶרֶב
  choice: वे ऐसे भागेंगे जैसे तलवार से भाग रहे हों
  rationale: रचना तलवार के सामने से होने वाली भगदड़ के समान भागने की रीति व्यक्त करती है। यह हिन्दी में तुलना को स्पष्ट और स्वाभाविक रखती है।
- source_word: וְנָפְלוּ וְאֵין רֹדֵף
  choice: पीछा करने वाला कोई न होने पर भी वे गिर पड़ेंगे
  rationale: ‘गिर पड़ेंगे’ נפל की संक्षिप्तता और संभावित शारीरिक गिरावट या आतंक में ढहने की अस्पष्टता बनाए रखता है; ‘फिर भी’ का भाव विडंबना स्पष्ट करता है।
theological_decisions:
- issue: न्याय का स्वरूप
  choice: निर्वासन में परमेश्वर द्वारा उत्पन्न आंतरिक कायरता और आतंक
  alternative: केवल बाहरी सैन्य पीछा या मात्र रूपकात्मक बेचैनी
  rationale: पद आंतरिक साहस टूटने को परमेश्वर की क्रिया बताता है और फिर मामूली आवाज़ से निराधार भगदड़ दिखाता है। अनुवाद ईश्वरीय कारकता और मनोवैज्ञानिक आतंक दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। प्रत्यक्ष संबोधन ‘तुममें से’ रखा गया है। ‘कायरता’ साहस के टूटने को साधारण ‘भय’ से अधिक सटीक रूप से व्यक्त करती है; वाक्य-विन्यास को हिन्दी की स्वाभाविक प्रवाहशीलता के लिए हल्का पुनर्गठित किया गया है।
