  text: You will perish among the nations[a], and the land of your enemies will consume you.
translation:
  language: hi
  text: तुम राष्ट्रों के बीच नाश हो जाओगे, और तुम्हारे शत्रुओं की भूमि तुम्हें खा जाएगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘खा जाएगी’; अर्थ ‘निगल जाएगी’ या ‘भस्म कर देगी’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲבַדְתֶּם
  choice: नाश हो जाओगे
  rationale: काल क्रम में वाचा के शाप का परिणाम व्यक्त करने वाला क़ाल रूप है। ‘नाश हो जाओगे’ विनाश और मिट जाने का भाव रखता है, पर हिंसक हत्या को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: גּוֹיִם का सामान्य अर्थ ‘राष्ट्र/जातियाँ’ है। निर्वासन के प्रसंग में ‘राष्ट्रों के बीच’ स्वाभाविक है और बाद की धार्मिक शब्दावली नहीं जोड़ता।
- source_word: וְאָכְלָה
  choice: खा जाएगी
  rationale: אכל का मूल अर्थ ‘खाना’ है। भूमि को कर्ता बनाकर प्रयुक्त इस सजीव रूपक को ‘खा जाएगी’ सीधे और प्रभावशाली ढंग से बनाए रखता है।
- source_word: אֶתְכֶם
  choice: तुम्हें
  rationale: सीधे कर्म के चिह्न के साथ द्वितीय पुरुष बहुवचन प्रत्यय को हिन्दी में स्वाभाविक कर्मरूप ‘तुम्हें’ से व्यक्त किया गया है।
- source_word: אֶרֶץ
  choice: भूमि
  rationale: निर्वासन और शत्रुओं के क्षेत्र के प्रसंग में אֶרֶץ के लिए ‘भूमि’ सटीक और साहित्यिक रूप से स्वाभाविक है।
- source_word: אֹיְבֵיכֶם
  choice: तुम्हारे शत्रुओं की
  rationale: सम्बन्धवाचक रचना को सीधा रखते हुए यह भूमि के स्वामित्व अथवा क्षेत्रीय सम्बन्ध को व्यक्त करता है।
theological_decisions:
- issue: ‘शत्रुओं की भूमि तुम्हें खा जाएगी’ रूपक का अर्थ
  choice: भूमि द्वारा निर्वासित लोगों को खा जाने का मूल रूपक बनाए रखा गया है।
  alternative: ‘तुम्हारे शत्रुओं की भूमि तुम्हें नष्ट कर देगी’ कहकर रूपक को अर्थ-स्पष्ट बनाया जा सकता था।
  rationale: इब्रानी पाठ में ‘खाना’ क्रिया और ‘भूमि’ कर्ता है। इस चित्र को बनाए रखना वाचा के शाप की तीव्रता और साहित्यिक तनाव को सुरक्षित रखता है तथा उसकी व्याख्या को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गम्भीर और प्रत्यक्ष शैली अपनाई गई है। ‘राष्ट्रों’ ऐतिहासिक निर्वासन-सन्दर्भ को बिना बाद की साम्प्रदायिक शब्दावली के व्यक्त करता है; ‘खा जाएगी’ मूल इब्रानी रूपक की सजीवता बनाए रखता है।
