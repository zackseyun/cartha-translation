  text: וְ/הֵבֵאתִ֨י עֲלֵי/כֶ֜ם חֶ֗רֶב נֹקֶ֨מֶת֙ נְקַם בְּרִ֔ית וְ/נֶאֱסַפְתֶּ֖ם אֶל עָרֵי/כֶ֑ם וְ/שִׁלַּ֤חְתִּי דֶ֨בֶר֙ בְּ/ת֣וֹכְ/כֶ֔ם וְ/נִתַּתֶּ֖ם בְּ/יַד אוֹיֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/025.yaml
  text: And I will bring against you a sword executing the vengeance of the covenant[a], and you will be gathered into your cities. Then I will send pestilence among you, and you will be given into the hand of the enemy.
translation:
  language: hi
  text: मैं तुम्हारे विरुद्ध वाचा के प्रतिशोध को कार्यान्वित करनेवाली तलवार लाऊँगा[a], और तुम अपने नगरों में इकट्ठे हो जाओगे। तब मैं तुम्हारे बीच महामारी भेजूँगा, और तुम शत्रु के हाथ में सौंप दिए जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वाचा के प्रतिशोध को लेनेवाली,” “वाचा के लिए प्रतिशोध लेनेवाली,” अथवा अधिक सहज रूप में “वाचा का प्रतिशोध करनेवाली।” इब्रानी में ‘प्रतिशोध लेनेवाली’ और ‘प्रतिशोध’ एक ही धातु से बने बलयुक्त शब्द हैं; ‘वाचा’ के साथ उनका संबंध संक्षिप्त है और उसके निकटवर्ती अर्थ संभव हैं।
    reason: मूल इब्रानी में वाचा और प्रतिशोध के संबंध की अर्थच्छाया बहुविकल्पी है; पादटिप्पणी सजातीय, बलयुक्त रचना को भी स्पष्ट करती है।
lexical_decisions:
- source_word: וְהֵבֵאתִי עֲלֵיכֶם
  choice: मैं तुम्हारे विरुद्ध ... लाऊँगा
  rationale: हिफ़ील रूप कारणात्मक क्रिया व्यक्त करता है; न्याय के प्रतिकूल संदर्भ में עַל का स्वाभाविक अर्थ ‘विरुद्ध’ है।
- source_word: חֶרֶב
  choice: तलवार
  rationale: यह युद्ध और दैवी न्याय के साधन का बिंब है; हिन्दी में अनिश्चितता अलग उपपद के बिना स्वाभाविक रूप से बनी रहती है।
- source_word: נֹקֶמֶת נְקַם בְּרִית
  choice: जो वाचा का बदला चुकाएगी
  rationale: सजातीय क्रिया और संज्ञा का बल हिन्दी मुहावरे ‘बदला चुकाना’ से व्यक्त होता है, जबकि ‘वाचा का’ संबंध जानबूझकर खुला रखा गया है।
- source_word: וְנֶאֱסַפְתֶּם אֶל עָרֵיכֶם
  choice: और तुम अपने नगरों में इकट्ठे हो जाओगे
  rationale: निफ़अल का एकत्र होने/किए जाने का भाव और नगरों के भीतर शरण या घेराबंदी के लिए सिमटने की गति दोनों व्यक्त होते हैं।
- source_word: וְשִׁלַּחְתִּי דֶבֶר בְּתוֹכְכֶם
  choice: तब मैं तुम्हारे बीच महामारी भेजूँगा
  rationale: דֶבֶר वाचा-शाप के संदर्भ में फैलने वाली घातक महामारी है; ‘तब’ न्यायों की क्रमिकता स्पष्ट करता है।
- source_word: וְנִתַּתֶּם בְּיַד אוֹיֵב
  choice: और तुम शत्रु के हाथ में सौंप दिए जाओगे
  rationale: निफ़अल का कर्मवाच्य भाव तथा ‘हाथ में’ वाला इब्रानी सत्ता-अधीनता का बिंब सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘वाचा का बदला’ का अर्थ
  choice: मूल संबंध को ‘वाचा का बदला’ के रूप में सुरक्षित रखा गया है।
  alternative: वाचा भंग करने का बदला; वाचा की ओर से लिया गया बदला; वाचा में ठहराया गया दंड
  rationale: इब्रानी संबंध-वाचक रचना निकटवर्ती अनेक अर्थच्छायाएँ स्वीकार करती है। मुख्य पाठ किसी एक व्याख्या को थोपे बिना वाचा और दैवी प्रतिशोध के संबंध को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘वाचा,’ ‘महामारी’ और ‘शत्रु के हाथ में’ मूल के न्यायिक तथा वाचाई स्वर को बनाए रखते हैं; अत्यधिक संस्कृतनिष्ठ या पुरातन शब्दावली से बचा गया है।
