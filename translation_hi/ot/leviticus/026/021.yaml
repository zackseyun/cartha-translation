base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/021.yaml
  text: And if you walk contrary to me and are not willing to listen to me[b][a], then I will continue to strike you sevenfold according to your sins.
translation:
  language: hi
  text: और यदि तुम मेरे विरुद्ध चलोगे[a] और मेरी बात सुनने को तैयार नहीं होगे, तो मैं तुम्हारे पापों के अनुसार तुम पर सात गुना और प्रहार करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यदि तुम मेरे प्रति शत्रुता से व्यवहार करोगे।’ इब्रानी मुहावरा कठिन है; इस अध्याय में यह संयोग से अधिक विरोध की मनोवृत्ति बताता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मैं तुम्हारे पापों के लिए तुम्हें सात बार और मारूँगा।’
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרִי
  choice: विरुद्ध
  rationale: इस अध्याय में यह कठिन इब्रानी शब्द संयोग या अनियमितता से अधिक विरोध की मनोवृत्ति प्रकट करता है। ‘विरुद्ध’ इस अर्थ को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: תֵּלְכוּ עִמִּי קֶרִי
  choice: मेरे विरुद्ध चलते रहोगे
  rationale: ‘चलना’ आचरण का मुहावरा है। इसे बनाए रखने से मूल की शैली बचती है, जबकि ‘विरुद्ध’ उसके प्रसंगगत आशय को स्पष्ट करता है।
- source_word: תֹאבוּ
  choice: तैयार नहीं होगे
  rationale: क्रिया इच्छा या सहमति न होने को व्यक्त करती है। यह अनुवाद केवल न सुनने के बजाय हठपूर्वक अनिच्छुक रहने का भाव रखता है।
- source_word: לִשְׁמֹעַ לִי
  choice: मेरी बात सुनने
  rationale: मूल क्रिया का अर्थ ‘सुनना’ है और वाचा के प्रसंग में आज्ञापालन का भाव निहित है। ‘मेरी बात सुनना’ दोनों पक्षों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְיָסַפְתִּי
  choice: और ... और
  rationale: मूल क्रिया ‘और बढ़ाना/जोड़ना’ बताती है। ‘और मार डालूँगा’ पहले से चल रहे दंड में आगे दंड जोड़ने का अर्थ व्यक्त करता है।
- source_word: מַכָּה
  choice: मार डालूँगा
  rationale: यह शब्द प्रहार या विपत्ति के व्यापक अर्थ में है। यहाँ हिन्दी की क्रियात्मक अभिव्यक्ति दंडात्मक प्रहार को रखती है, पर उसे किसी एक विशेष महामारी तक सीमित नहीं करती; ‘मार डालना’ का आशय यहाँ प्रहार करना है, अनिवार्यतः हत्या नहीं।
- source_word: שֶׁבַע
  choice: सात गुना
  rationale: इस दंड-सूत्र में संख्या क्रियाविशेषणात्मक और तीव्रतासूचक है। ‘सात गुना’ हिन्दी में अनुपात और बढ़े हुए दंड को स्पष्ट करता है।
- source_word: כְּחַטֹּאתֵיכֶם
  choice: तुम्हारे पापों के अनुसार
  rationale: उपसर्ग כ दंड और पापों के बीच अनुरूपता या अनुपात दर्शाता है; ‘के अनुसार’ इस सूक्ष्मता को केवल ‘के कारण’ से बेहतर बचाता है।
theological_decisions:
- issue: वाचा के दंड का स्वरूप
  choice: दंड को इस्राएल के पापों के अनुरूप सात गुना बढ़ने वाली परमेश्वर की मार के रूप में रखना, किसी खास साधन को निर्दिष्ट किए बिना
  alternative: מַכָּה को विशेष रूप से ‘महामारी’ कहना या כְּחַטֹּאתֵיכֶם को केवल ‘पापों के कारण’ कहना
  rationale: लैव्यव्यवस्था 26 में दंड क्रमशः तीव्र होते हैं। मूल पाठ दंड को किसी एक रूप तक सीमित नहीं करता और पापों के साथ उसकी अनुरूपता को बनाए रखता है।
- issue: ‘सुनने’ और ‘आज्ञा मानने’ का संबंध
  choice: ‘मेरी बात सुनने’ कहना और आज्ञापालन के निहितार्थ को खुला रखना
  alternative: स्पष्ट रूप से ‘मेरी आज्ञा मानने’ कहना
  rationale: वाचा के संदर्भ में सुनना आज्ञापालन समेटता है, पर मूल की शब्दगत छवि ‘सुनना’ है; उसे रखना अनावश्यक व्याख्यात्मक संकुचन से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। मूल का ‘चलना’ वाला आचरण-सूचक मुहावरा और ‘सुनना’ रखा गया है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न उपस्थित हैं।
