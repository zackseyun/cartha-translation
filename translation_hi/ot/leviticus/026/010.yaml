  text: You will eat old stores long kept[a], and you will clear out the old because of the new.
translation:
  language: hi
  text: तुम बहुत समय से रखी हुई पुरानी उपज खाओगे, और नई उपज के कारण पुरानी उपज को बाहर निकालोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: तुम ... खाओगे
  rationale: वाचा की आशीषों के इस क्रम में वाव के साथ आया पूर्ण रूप भविष्य की प्रतिज्ञा व्यक्त करता है।
- source_word: יָשָׁן נוֹשָׁן
  choice: बहुत समय से रखा हुआ पुराना अनाज
  rationale: יָשָׁן यहाँ संज्ञा के रूप में पुरानी उपज को और נוֹשָׁן उसके लंबे समय से भंडारित होने को व्यक्त करता है। संदर्भ कृषि-उपज का है; ‘अनाज’ सामान्य पाठक के लिए स्वाभाविक है, यद्यपि मूल शब्द वस्तु को स्पष्ट नहीं करता।
- source_word: וְיָשָׁן
  choice: पुराने को
  rationale: दूसरा יָשָׁן भी संज्ञावत् प्रयुक्त है और पहले उल्लिखित पुराने भंडार की ओर संकेत करता है।
- source_word: מִפְּנֵי חָדָשׁ
  choice: नए अनाज के कारण
  rationale: מִפְּנֵי यहाँ नई उपज के आने से पुराने भंडार के हटाए जाने का कारण बताता है। ‘नए अनाज’ से निहित कृषि-संदर्भ स्पष्ट होता है।
- source_word: תּוֹצִיאוּ
  choice: बाहर निकालोगे
  rationale: יצא का हिफ़ील रूप शाब्दिक रूप से ‘बाहर ले जाना/निकालना’ है। यह अनुवाद भंडार खाली करने का प्रसंग व्यक्त करते हुए मूल क्रिया के निकट रहता है।
