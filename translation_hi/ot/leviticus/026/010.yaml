translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल की संक्षिप्त समानांतर रचना को यथासंभव बनाए रखा गया है। ‘अनाज’ निहित वस्तु को स्वाभाविक हिंदी में स्पष्ट करता है; पद में किसी विशिष्ट प्रकार की उपज का नाम नहीं है।
