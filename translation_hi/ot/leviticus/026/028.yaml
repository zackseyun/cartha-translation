  text: וְ/הָלַכְתִּ֥י עִמָּ/כֶ֖ם בַּ/חֲמַת קֶ֑רִי וְ/יִסַּרְתִּ֤י אֶתְ/כֶם֙ אַף אָ֔נִי שֶׁ֖בַע עַל חַטֹּאתֵי/כֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/028.yaml
  text: then I also will walk contrary to you in furious hostility[b][a], and I myself will discipline you sevenfold for your sins.
translation:
  language: hi
  text: तब मैं भी प्रचण्ड क्रोध में तुम्हारे विरुद्ध चलूँगा[a], और मैं स्वयं तुम्हारे पापों के कारण तुम्हें सात गुना अनुशासित करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस कठिन इब्रानी पदबंध का अधिक शाब्दिक अनुवाद हो सकता है: “मैं भी विरोध के प्रचण्ड क्रोध में तुम्हारे साथ चलूँगा”; परम्परागत रूप से, “मैं क्रोध में तुम्हारे प्रतिकूल चलूँगा।”'
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारे पापों के कारण तुम्हें सात बार ताड़ना दूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַכְתִּי
  choice: मैं ... चलूँगा
  rationale: הלך का मूल अर्थ ‘चलना’ है। वाचा के शापों के इस प्रसंग में बार-बार आने वाली ‘चलने’ की संबंधपरक छवि को ‘व्यवहार करूँगा’ कहकर सपाट करने के बजाय बनाए रखा गया है।
- source_word: עִמָּכֶם ... קֶרִי
  choice: तुम्हारे विरुद्ध
  rationale: עִם का शाब्दिक अर्थ ‘साथ’ है, पर קֶרִי के साथ यहाँ भाव विरोधी है। स्वाभाविक हिन्दी में ‘तुम्हारे विरुद्ध’ इस आशय को स्पष्ट रखता है।
- source_word: בַּחֲמַת קֶרִי
  choice: प्रचण्ड क्रोध में ... विरुद्ध
  rationale: חֵמָה तीव्र क्रोध या प्रकोप व्यक्त करता है, जबकि दुर्लभ קֶרִי विरोध, प्रतिकूलता या वैरभाव का संकेत देता है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है और पदबंध की कठिन संरचना को पादटिप्पणी में रखा गया है।
- source_word: וְיִסַּרְתִּי
  choice: अनुशासित करूँगा
  rationale: יסר में दण्ड देने के साथ ताड़ना और सुधारात्मक अनुशासन का भाव भी हो सकता है। ‘अनुशासित’ इस व्यापकता को बनाए रखता है।
- source_word: אַף אֲנִי
  choice: मैं भी ... मैं स्वयं
  rationale: दोनों बलसूचक तत्वों को हिन्दी में ‘भी’ और ‘स्वयं’ से व्यक्त किया गया है।
- source_word: שֶׁבַע
  choice: सात गुना
  rationale: यहाँ שֶׁבַע दण्ड की तीव्रता को सात गुना करने का भाव देता है। ‘सात बार’ भी व्याकरणतः सम्भव है और पादटिप्पणी में दिया गया है।
- source_word: עַל חַטֹּאתֵיכֶם
  choice: तुम्हारे पापों के कारण
  rationale: עַל यहाँ अनुशासन का आधार या कारण बताता है; हिन्दी में ‘के कारण’ इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: वाचा के शाप में परमेश्वर की प्रतिक्रिया का स्वरूप
  choice: 'विरोध और अनुशासन—दोनों भाव बनाए गए हैं: परमेश्वर उनके विरुद्ध चलता है और उन्हें अनुशासित करता है।'
  alternative: पूरे कथन को केवल दण्डात्मक बनाकर ‘दण्ड दूँगा’ कहना, अथवा विरोध के भाव को सामान्य अप्रसन्नता तक हल्का कर देना।
  rationale: इब्रानी पाठ संबंधपरक विरोध (הלך + עם + קֶרִי) को יסר की ताड़ना/अनुशासन वाली भाषा से जोड़ता है। दोनों को बनाए रखने से पाठ को न केवल प्रतिशोधात्मक बनाया जाता है, न अनावश्यक रूप से नरम।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली रखी गई है। ‘चलूँगा’ से अध्याय की आवर्ती वाचागत छवि सुरक्षित है; ‘प्रचण्ड क्रोध’, ‘विरुद्ध’ और ‘अनुशासित’ सामान्य पाठक के लिए बोधगम्य हैं।
