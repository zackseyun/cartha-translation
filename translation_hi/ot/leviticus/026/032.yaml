source:
  edition: WLC
  text: וַ/הֲשִׁמֹּתִ֥י אֲנִ֖י אֶת הָ/אָ֑רֶץ וְ/שָֽׁמְמ֤וּ עָלֶ֨י/הָ֙ אֹֽיְבֵי/כֶ֔ם הַ/יֹּשְׁבִ֖ים בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/032.yaml
  text: And I myself will lay the land waste[a], and your enemies who dwell in it will be appalled at it.
translation:
  language: hi
  text: और मैं स्वयं उस देश को उजाड़ दूँगा, और उसमें रहने वाले तुम्हारे शत्रु उसे देखकर स्तब्ध रह जाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे देखकर चकित हो जाएँगे” अथवा “भय से भर जाएँगे।” इब्रानी क्रिया उजड़ी हुई दशा को देखकर होनेवाले भयमिश्रित विस्मय को व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: उजाड़ दूँगा
  rationale: שׁמם के कारक रूप का अर्थ देश को उजाड़ या वीरान कर देना है। यह चयन कारक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲנִי
  choice: मैं स्वयं
  rationale: क्रिया में कर्ता पहले से निहित होने पर भी स्वतंत्र सर्वनाम प्रयुक्त है, इसलिए उसके बलाघात को ‘मैं स्वयं’ से सुरक्षित रखा गया है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: इस वाचा-दण्ड के प्रसंग में शब्द पूरी पृथ्वी के बजाय इस्राएल/कनान के देश को सूचित करता है। हिन्दी में ‘उस देश’ प्रसंगगत निश्चितता को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְשָׁמְמוּ
  choice: स्तब्ध रह जाएँगे
  rationale: सरल धातुरूप यहाँ उजड़े देश को देखकर शत्रुओं की भयमिश्रित विस्मयपूर्ण प्रतिक्रिया व्यक्त कर सकता है। ‘स्तब्ध रह जाएँगे’ इस अर्थ को स्वाभाविक हिन्दी में रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: עָלֶיהָ
  choice: उसे देखकर
  rationale: שׁמם के साथ עַל उस वस्तु या कारण को दर्शाता है जिस पर विस्मय होता है। हिन्दी में ‘उसे देखकर’ प्रतिक्रिया का संबंध देश की दशा से स्पष्ट करता है।
- source_word: אֹיְבֵיכֶם
  choice: तुम्हारे शत्रु
  rationale: मूल के बहुवचन और द्वितीय पुरुष बहुवचन संबंधसूचक रूप का सीधा अनुवाद।
- source_word: הַיֹּשְׁבִים בָּהּ
  choice: उसमें रहनेवाले
  rationale: ישׁב का कृदन्त यहाँ निवास करनेवालों को सूचित करता है; ‘रहनेवाले’ वर्तमान, सहज और गरिमापूर्ण हिन्दी है।
theological_decisions:
- issue: वाचा-दण्ड के प्रसंग में הָאָרֶץ का संदर्भ
  choice: देश, अर्थात् प्रसंग में इस्राएल/कनान का देश
  alternative: पृथ्वी
  rationale: आसपास का प्रसंग इस्राएल के देश पर आनेवाले वाचा-दण्ड का वर्णन करता है; ‘देश’ न्याय को अनावश्यक रूप से पूरी पृथ्वी तक विस्तृत नहीं करता।
- issue: וְשָׁמְמוּ में शत्रुओं की प्रतिक्रिया और देश की दशा
  choice: शत्रु उजड़े देश को देखकर स्तब्ध रह जाएँगे
  alternative: शत्रु उजड़ जाएँगे / चकित या भयभीत हो जाएँगे
  rationale: वाक्य में शत्रु उस देश में रहनेवाले चेतन कर्ता हैं और עָלֶיהָ उनकी प्रतिक्रिया का विषय/कारण बताता है। फिर भी धातु की भयमिश्रित विस्मय और उजाड़पन से जुड़ी अर्थ-व्याप्ति को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘मैं स्वयं’ मूल के बलाघात को, ‘उजाड़ दूँगा’ कारक क्रिया को, और ‘स्तब्ध रह जाएँगे’ शत्रुओं की प्रतिक्रिया को व्यक्त करता है। संयोजक ‘और’ मूल के וְ को सीधे रखता है और अनावश्यक उद्देश्य या परिणाम-संबंध नहीं जोड़ता।
