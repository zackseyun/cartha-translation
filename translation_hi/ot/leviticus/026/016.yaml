source:
  edition: WLC
  text: אַף אֲנִ֞י אֶֽעֱשֶׂה זֹּ֣את לָ/כֶ֗ם וְ/הִפְקַדְתִּ֨י עֲלֵי/כֶ֤ם בֶּֽהָלָה֙ אֶת הַ/שַּׁחֶ֣פֶת וְ/אֶת הַ/קַּדַּ֔חַת מְכַלּ֥וֹת עֵינַ֖יִם וּ/מְדִיבֹ֣ת נָ֑פֶשׁ וּ/זְרַעְתֶּ֤ם לָ/רִיק֙ זַרְעֲ/כֶ֔ם וַ/אֲכָלֻ֖/הוּ אֹיְבֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/016.yaml
  text: 'I also will do this to you: I will appoint over you sudden terror[a], wasting disease and fever, consuming the eyes and draining the life; and you will sow your seed in vain[c][b], and your enemies will eat it.'
translation:
  language: hi
  text: 'मैं भी तुम्हारे साथ ऐसा ही करूँगा: मैं तुम पर अचानक भय[a], क्षयकारी रोग[b] और ज्वर ठहराऊँगा, जो आँखों को क्षीण और जीवन को दुर्बल कर देंगे[c]। तुम व्यर्थ ही अपना बीज बोओगे, और तुम्हारे शत्रु उसकी उपज खाएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम पर अचानक भय ले आऊँगा।” इब्रानी क्रिया किसी पर न्याय या विपत्ति नियुक्त करने अथवा लाने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: इस इब्रानी शब्द से ठीक किस रोग का बोध होता है, यह अनिश्चित है; सम्भवतः इसका अर्थ शरीर को क्षीण कर देने वाला रोग है।
    reason: lexical_uncertainty
  - marker: c
    text: 'शाब्दिक भाव: “आँखों को चुकाने और जीवन को क्षीण करने वाले।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף אֲנִי
  choice: मैं भी
  rationale: אַף और स्वतंत्र सर्वनाम का मेल बल तथा प्रत्युत्तर का भाव देता है; ‘मैं भी’ स्वाभाविक हिन्दी में दोनों को बनाए रखता है।
- source_word: אֶעֱשֶׂה זֹּאת לָכֶם
  choice: तुम्हारे साथ ऐसा ही करूँगा
  rationale: न्याय के प्रसंग में यह कार्य श्रोताओं की ओर निर्देशित है; ‘तुम्हारे साथ’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וְהִפְקַדְתִּי עֲלֵיכֶם
  choice: मैं तुम पर ... ठहराऊँगा
  rationale: פקד के हिफ़ील रूप में नियुक्त करने, अधीन रखने अथवा किसी पर विपत्ति लाने का भाव हो सकता है। ‘ठहराऊँगा’ उसके आरोपित/नियुक्त किए जाने के बल को बनाए रखता है।
- source_word: בֶּהָלָה
  choice: अचानक भय
  rationale: यह संज्ञा आतंक, घबराहट अथवा आकस्मिक भय को सूचित करती है; यह चयन उसके भावात्मक और आकस्मिक दोनों पहलुओं को व्यक्त करता है।
- source_word: הַשַּׁחֶפֶת
  choice: क्षयकारी रोग
  rationale: प्राचीन रोग की ठीक पहचान अनिश्चित है। यह अनुवाद शरीर को क्षीण करने वाले रोग का अर्थ देता है, पर किसी विशिष्ट आधुनिक निदान का दावा नहीं करता।
- source_word: הַקַּדַּחַת
  choice: ज्वर
  rationale: शब्द का संबंध तपने या ज्वर से है; ‘ज्वर’ संक्षिप्त, प्रचलित और गरिमापूर्ण हिन्दी है।
- source_word: מְכַלּוֹת עֵינַיִם
  choice: आँखों को क्षीण
  rationale: כלה का अर्थ समाप्त करना या क्षीण करना है। यह कठिन मुहावरा रोग से आँखों के चुकने अथवा दुर्बल होने का संकेत देता है।
- source_word: וּמְדִיבֹת נָפֶשׁ
  choice: जीवन को दुर्बल
  rationale: यह कठिन वाक्यांश जीवन-शक्ति के क्षीण होने को दर्शाता है। यहाँ נֶפֶשׁ को ‘जीवन’ कहना संदर्भानुकूल है और ‘आत्मा’ से जुड़ी बाद की दार्शनिक धारणाएँ आरोपित नहीं करता।
- source_word: וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם
  choice: तुम व्यर्थ ही अपना बीज बोओगे
  rationale: לריק निष्फलता को व्यक्त करता है; यह हिन्दी कृषि-चित्र और परिणामहीन परिश्रम दोनों को सुरक्षित रखती है।
- source_word: וַאֲכָלֻהוּ אֹיְבֵיכֶם
  choice: और तुम्हारे शत्रु उसकी उपज खाएँगे
  rationale: वाव को सीधे ‘और’ रखा गया है। एकवचन प्रत्यय बोए हुए बीज से प्राप्त उपज की ओर संकेत करता है; ‘उसकी उपज’ हिन्दी में आशय स्पष्ट करता है।
theological_decisions:
- issue: शाप के प्रसंग में נָפֶשׁ का अर्थ
  choice: जीवन
  alternative: प्राण / आत्मा / मन
  rationale: शारीरिक क्षय के संदर्भ में यह जीवनी-शक्ति या जीवन को सूचित करता है। ‘जीवन’ मूल की व्यापकता बनाए रखता है और मनुष्य की संरचना के विषय में कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
- issue: וְהִפְקַדְתִּי עֲלֵיכֶם में दैवी न्याय की क्रिया
  choice: तुम पर ... ठहराऊँगा
  alternative: तुम पर ... ले आऊँगा
  rationale: चयन विपत्तियों के दैवी रूप से नियुक्त या आरोपित होने का बल बनाए रखता है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रूप। रोग-संबंधी प्राचीन शब्दावली में अनावश्यक चिकित्सकीय विशिष्टता से बचा गया है। काव्यात्मक शारीरिक चित्र को अर्थ-स्पष्ट हिन्दी में रखा गया है और मूल की समन्वयी ‘और’ संरचना सुरक्षित है।
