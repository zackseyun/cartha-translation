source:
  edition: WLC
  text: וְ/אֶתְ/כֶם֙ אֱזָרֶ֣ה בַ/גּוֹיִ֔ם וַ/הֲרִיקֹתִ֥י אַחֲרֵי/כֶ֖ם חָ֑רֶב וְ/הָיְתָ֤ה אַרְצְ/כֶם֙ שְׁמָמָ֔ה וְ/עָרֵי/כֶ֖ם יִהְי֥וּ חָרְבָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/033.yaml
  text: And I will scatter you among the nations[a], and I will draw out the sword after you; and your land will become a desolation, and your cities will become ruins.
translation:
  language: hi
  text: और मैं तुम्हें राष्ट्रों में तितर-बितर कर दूँगा, और तुम्हारे पीछे तलवार खींचूँगा[a]; तुम्हारा देश उजाड़ हो जाएगा, और तुम्हारे नगर खंडहर हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे पीछे तलवार म्यान से निकालूँगा।”
    reason: ‘तलवार खींचूँगा’ के लिए इब्रानी मुहावरे का निकटवर्ती शाब्दिक विकल्प।
lexical_decisions:
- source_word: אֱזָרֶה
  choice: तितर-बितर कर दूँगा
  rationale: हिफ़ील क्रिया यहाँ लोगों को अलग-अलग स्थानों में बिखेर देने का भाव देती है। यह आधुनिक हिन्दी में स्वाभाविक है और न्याय के रूप में निर्वासन की छवि बनाए रखती है।
- source_word: בַגּוֹיִם
  choice: जाति-जाति के लोगों के बीच
  rationale: גּוֹיִם विदेशी जातियों अथवा राष्ट्रों के लोगों को दर्शाता है। यह प्रयोग केवल राजनीतिक राज्यों तक अर्थ को सीमित नहीं करता और बाद की धार्मिक शब्दावली भी आरोपित नहीं करता।
- source_word: וַהֲרִיקֹתִי ... חָרֶב
  choice: तलवार खींचूँगा
  rationale: ריק और חֶרֶב का मुहावरा तलवार को म्यान से खींचकर आक्रमण या पीछा करने के लिए तैयार करने को व्यक्त करता है। हिन्दी में 'तलवार खींचना' इस ठोस युद्ध-चित्र को स्वाभाविक रूप से रखता है।
- source_word: אַחֲרֵיכֶם
  choice: तुम्हारे पीछे
  rationale: इसका शाब्दिक अर्थ 'तुम्हारे पीछे' है और प्रसंग में शत्रुतापूर्ण पीछा निहित है। निकटवर्ती 'तलवार खींचूँगा' उस आशय को स्पष्ट करता है।
- source_word: שְׁמָמָה
  choice: उजाड़
  rationale: यह संज्ञा वीरानी और विनाश की अवस्था बताती है। 'उजाड़ हो जाएगा' आधुनिक हिन्दी में सहज है और परिणामस्वरूप परिवर्तन को व्यक्त करता है।
- source_word: חָרְבָּה
  choice: खंडहर
  rationale: यह उजड़े अथवा नष्ट स्थान की दशा को दर्शाता है। नगरों के संबंध में 'खंडहर हो जाएँगे' स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: וְהָיְתָה ... יִהְיוּ
  choice: हो जाएगा ... हो जाएँगे
  rationale: यहाँ היה रूप न्याय के फलस्वरूप एक नई दशा में पहुँचने का भाव रखते हैं; हिन्दी के ये रूप उस परिणामकारी परिवर्तन को स्वाभाविक ढंग से व्यक्त करते हैं।
theological_decisions:
- issue: वाचा के न्याय में निर्वासन और सैन्य पीछा करने की ईश्वरीय कर्तृता
  choice: 'प्रत्यक्ष प्रथम-पुरुष कर्तृता रखी गई है: ''मैं ... कर दूँगा'' और ''खींचूँगा''।'
  alternative: कर्तृता को नरम करने के लिए कर्मवाच्य अथवा निर्वैयक्तिक भाषा का प्रयोग।
  rationale: इब्रानी पाठ इन दंडों को स्पष्ट रूप से परमेश्वर की कार्रवाई बताता है। अनुवाद को इस धार्मिक तनाव को बिना नरम किए बनाए रखना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठकों के लिए सुबोध रखी गई है। 'तितर-बितर', 'तलवार खींचना', 'उजाड़' और 'खंडहर' मूल की निर्वासन, युद्ध और विनाश की छवियों को स्वाभाविक हिन्दी में सुरक्षित रखते हैं। अंग्रेज़ी परत में दिया गया पादटिप्पणी-चिह्न मूलतः तलवार वाले वाक्यांश से संबंधित प्रतीत होता है, जबकि मुख्य पाठ में वह 'nations' के बाद लगा है; हिन्दी में दोनों अर्थों को मुख्य पाठ में पर्याप्त रूप से व्यक्त करने के कारण पादटिप्पणी नहीं जोड़ी गई।
