  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲנִ֞י יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִֽ/הְיֹ֥ת לָ/הֶ֖ם עֲבָדִ֑ים וָ/אֶשְׁבֹּר֙ מֹטֹ֣ת עֻלְּ/כֶ֔ם וָ/אוֹלֵ֥ךְ אֶתְ/כֶ֖ם קֽוֹמְמִיּֽוּת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/026/013.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt, from being their servants[c][b]; I broke the bars of your yoke and made you walk upright.
translation:
  language: hi
  text: मैं याहवे, तुम्हारा परमेश्वर हूँ, जो तुम्हें मिस्र देश से निकाल लाया, ताकि तुम उनके दास न रहो। मैंने तुम्हारे जुए की छड़ें[a] तोड़ दीं और तुम्हें सिर ऊँचा करके चलाया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे जुए के डंडे।”
    reason: lexical_alternative
  - marker: b
    text: या “तुम्हें तनकर चलाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: वाचा-सूत्र में यह बहुवचन रूप एकवचन परमेश्वर के अर्थ में है; संबोधन सामूहिक होते हुए भी स्वाभाविक हिन्दी में ‘तुम्हारा’ उपयुक्त है।
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: तुम्हें मिस्र देश से निकाल लाया
  rationale: हिफ़ील रूप के कारण बाहर निकालने की कारक क्रिया और निर्गमन का भाव दोनों सुरक्षित रहते हैं।
- source_word: מִהְיֹת לָהֶם עֲבָדִים
  choice: ताकि तुम उनके दास न बने रहो
  rationale: इब्रानी रचना दासता की अवस्था से छुड़ाए जाने को व्यक्त करती है; हिन्दी में यह उद्देश्य/परिणाम-वाचक रूप अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: מֹטֹת עֻלְּכֶם
  choice: तुम्हारे जुए की छड़ें
  rationale: मֹטֹת जुए की ठोस छड़ों या डंडों को दर्शाता है; इससे दासता का दृश्य रूपक बना रहता है।
- source_word: וָאוֹלֵךְ אֶתְכֶם קוֹמְמִיּוּת
  choice: तुम्हें सिर ऊँचा करके चलाया
  rationale: कारक क्रिया और कוֹמְמִיּוּת में निहित तनकर, गरिमा के साथ चलने की छवि को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मिस्र में इस्राएल की स्थिति
  choice: दास
  alternative: सेवक
  rationale: संदर्भ उत्पीड़क बंधुआ अवस्था से मुक्ति का है; ‘दास’ उस सामाजिक स्थिति को ‘सेवक’ से अधिक स्पष्ट रखता है।
- issue: अंतिम मुक्ति-चित्र
  choice: सिर ऊँचा करके चलाया
  alternative: तनकर चलाया
  rationale: यह अनुवाद दासता के जुए से मुक्त होकर पुनः प्राप्त गरिमा की देहगत छवि व्यक्त करता है, पर इसे केवल नैतिक ‘सीधाई’ के अर्थ में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याहवे’ व्यक्तिगत ईश्वरीय नाम का लिप्यंतरण है। दासता और टूटे हुए जुए की ठोस छवि को नरम नहीं किया गया; अंतिम पदबंध में शारीरिक सीधापन और पुनर्स्थापित गरिमा दोनों बनाए रखे गए हैं।
