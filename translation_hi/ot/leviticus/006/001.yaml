lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: और ... ने ... कहा
  rationale: वाव-क्रमिक रूप अगले वर्णनात्मक चरण को आरम्भ करता है। हिन्दी में वाणी के परिचय के लिए ‘और ... ने ... कहा’ स्वाभाविक है; इससे अगले पद में आने वाली प्रत्यक्ष वाणी की भूमिका स्पष्ट रहती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम YHWH को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: भाषण की दिशा बताने वाले אֶל का हिन्दी मुहावरे में वक्ता के साथ स्वाभाविक रूप ‘मूसा से कहा’ है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यहाँ לֵאמֹר आगामी प्रत्यक्ष कथन का सूत्र है। हिन्दी में ‘यह कहते हुए’ जोड़ना अनावश्यक और कृत्रिम होगा; संयुक्त अभिव्यक्ति ‘ने ... से कहा’ वही कार्य स्वाभाविक ढंग से करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यंतरण है और नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। इब्रानी भाषण-सूत्र וַיְדַבֵּר ... לֵאמֹר को हिन्दी की स्वाभाविक संक्षिप्त रचना ‘और ... ने ... से कहा’ में व्यक्त किया गया है।
