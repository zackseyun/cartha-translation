  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/כֹּהֵ֛ן הַֽ/מְחַטֵּ֥א אֹתָ֖/הּ יֹאכֲלֶ֑/נָּה בְּ/מָק֤וֹם קָדֹשׁ֙ תֵּֽאָכֵ֔ל בַּ/חֲצַ֖ר אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/019.yaml
  text: The priest who makes atonement with it shall eat it. It shall be eaten in a holy place[a], in the court of the tent of meeting.
translation:
  language: hi
  text: जो याजक उसे पापबलि के रूप में चढ़ाए, वह उसे खाए। उसे किसी पवित्र स्थान में[a]—मिलापवाले तंबू के आँगन में—खाया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो याजक उसके द्वारा प्रायश्चित करता है, वह उसे खाए।” इब्रानी कृदंत विशेष रूप से पापबलि की विधि संपन्न करने का अर्थ भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: जो याजक
  rationale: כֹּהֵן का मानक और स्वाभाविक हिन्दी रूप ‘याजक’ है; निश्चितता संबंधवाचक वाक्य-रचना में व्यक्त होती है।
- source_word: הַמְחַטֵּא אֹתָהּ
  choice: उसे पापबलि के रूप में चढ़ाता है
  rationale: पिएल कृदंत यहाँ पापबलि की विधि संपन्न करने का विशिष्ट बलिदान-संबंधी अर्थ रखता है। यह रूप संदर्भ को स्पष्ट करता है, जबकि क्रिया में निहित शुद्ध करने/प्रायश्चित करने की अर्थ-छाया को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יֹאכֲלֶנָּה
  choice: वही उसे खाए
  rationale: अपूर्ण क्रिया यहाँ विधिक निर्देश देती है। ‘वही’ उस याजक पर बल देता है जो बलिदान-विधि संपन्न करता है; ‘खाए’ आधुनिक हिन्दी में आदेशात्मक विधान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: किसी पवित्र स्थान में
  rationale: מָקוֹם पर निश्चित उपपद नहीं है; इसलिए अनिश्चित भाव को ‘किसी पवित्र स्थान’ से सुरक्षित रखा गया है।
- source_word: תֵּאָכֵל
  choice: खाया जाए
  rationale: निफ़अल अपूर्ण का कर्मवाच्य विधिक बल सुरक्षित रहता है और ध्यान बलि पर बना रहता है।
- source_word: בַּחֲצַר אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के आँगन में
  rationale: אֹהֶל מוֹעֵד के लिए परिचित हिन्दी पद ‘मिलापवाला तंबू’ और חָצֵר के लिए स्वाभाविक ‘आँगन’ प्रयुक्त है।
theological_decisions:
- issue: बलिदान-विधान में חטא का विशिष्ट अर्थ
  choice: पापबलि के रूप में चढ़ाता है
  alternative: उसके द्वारा प्रायश्चित करता है; उसके द्वारा शुद्ध करता है
  rationale: यहाँ कृदंत उस याजक को बताता है जो पापबलि की विधि संपन्न करता है। मुख्य पाठ में स्पष्ट विधिक अर्थ दिया गया है, पर इब्रानी की प्रायश्चित/शुद्धिकरण संबंधी अर्थ-सीमा को पादटिप्पणी द्वारा खुला रखा गया है।
- issue: स्त्रीलिंग सर्वनामों का संदर्भ
  choice: उसे
  alternative: उस मादा पशु को
  rationale: इब्रानी सर्वनाम व्याकरणतः स्त्रीलिंग हैं और बलि/बलि-पशु की ओर संकेत करते हैं। हिन्दी में ‘उसे’ दोनों संदर्भों को स्वाभाविक ढंग से खुला रखता है और अनावश्यक रूप से पशु का लिंग नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक है। ‘पापबलि’, ‘याजक’ और ‘मिलापवाला तंबू’ जैसे परिचित लैव्यव्यवस्था-संबंधी पद रखे गए हैं। इब्रानी की वास्तविक अर्थगत व्यापकता पादटिप्पणी में संरक्षित है।
