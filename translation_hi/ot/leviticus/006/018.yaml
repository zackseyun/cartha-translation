base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/018.yaml
  text: 'Speak to Aaron and to his sons[a], saying, ‘This is the law of the sin offering: in the place where the burnt offering is slaughtered, the sin offering shall be slaughtered before Yahweh. It is most holy.’'
translation:
  language: hi
  text: '“हारून और उसके पुत्रों से कह, ‘पापबलि[a] की विधि यह है: जिस स्थान पर होमबलि का वध किया जाता है, वहीं याहवे के सामने पापबलि का भी वध किया जाए। वह परम पवित्र है।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि”; हिब्रू शब्द חַטָּאת पाप और उससे शुद्ध किए जाने से संबंधित बलि—दोनों का बोध करा सकता है।
    reason: हिब्रू बलिदानी पद का वास्तविक और महत्वपूर्ण वैकल्पिक अर्थ सुरक्षित रखना।
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן וְאֶל־בָּנָיו
  choice: हारून और उसके पुत्रों से कह
  rationale: एकवचन आज्ञार्थक क्रिया और दोनों संबोधित पक्षों को स्पष्ट रखते हुए स्वाभाविक हिंदी आदेशात्मक शैली अपनाई गई है।
- source_word: זֹאת תּוֹרַת הַחַטָּאת
  choice: पापबलि की विधि यह है
  rationale: बलिदान-संबंधी विधान में תּוֹרָה का अर्थ यहाँ विशिष्ट नियम या विधि है; ‘विधि’ आधुनिक हिंदी में कानूनी-धार्मिक निर्देश का भाव स्वाभाविक रूप से देता है। חַטָּאת को परिचित तकनीकी पद ‘पापबलि’ से व्यक्त किया गया है।
- source_word: בִּמְקוֹם אֲשֶׁר תִּשָּׁחֵט הָעֹלָה
  choice: जिस स्थान पर होमबलि का वध किया जाता है
  rationale: שׁחט के बलिदानी संदर्भ को सटीक ‘वध’ से और עֹלָה को प्रचलित ‘होमबलि’ से व्यक्त किया गया है।
- source_word: תִּשָּׁחֵט הַחַטָּאת
  choice: वहीं ... पापबलि का भी वध किया जाए
  rationale: हिब्रू अपूर्ण क्रिया के विधिक-निर्देशात्मक बल को ‘किया जाए’ से रखा गया है; ‘वहीं’ और ‘भी’ स्थान तथा दोनों बलियों के समान नियम को हिंदी में स्पष्ट करते हैं।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का उपासना-संदर्भित स्थानिक भाव ‘के सामने’ से और परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को ‘याहवे’ के रूप में रखा गया है।
- source_word: קֹדֶשׁ קָדָשִׁים הִוא
  choice: वह परम पवित्र है
  rationale: हिब्रू की सर्वोच्चता-सूचक रचना को ‘परम पवित्र’ से व्यक्त किया गया है और स्त्रीलिंग सर्वनाम का संकेत पापबलि की ओर बना रहता है।
theological_decisions:
- issue: חַטָּאת का बलिदानी अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यह पद पाप से संबंधित बलि को दर्शाता है, जबकि अनुष्ठानिक शुद्धिकरण का पहलू भी इसमें निहित हो सकता है। मुख्य पाठ में परिचित ‘पापबलि’ रखा गया और वास्तविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया।
- issue: יהוה का प्रतिलेखन
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में उपस्थित व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय आधुनिक हिंदी में निकट ध्वन्यात्मक रूप से प्रस्तुत किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘होमबलि’, ‘पापबलि’ और ‘परम पवित्र’ जैसे स्थापित बाइबिलीय पद तकनीकी सटीकता बनाए रखते हैं; वाक्य-विन्यास हिंदी के स्वाभाविक विधिक निर्देश के अनुरूप है।
