base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/009.yaml
  text: What is left of it Aaron and his sons shall eat[a]. It shall be eaten unleavened in a holy place[c][b]; they shall eat it in the court of the tent of meeting.
translation:
  language: hi
  text: उसमें से जो बचा है, उसे हारून और उसके पुत्र खाएँगे[a]। उसे किसी पवित्र स्थान में अखमीरी रूप में खाया जाए[b][c]; वे उसे मिलापवाले तंबू के आँगन में खाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका बचा हुआ भाग।”
    reason: lexical_alternative
  - marker: b
    text: या “बिना खमीर के।” इब्रानी में बलि को अखमीरी रूप में खाने की बात है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “एक पवित्र स्थान में,” न कि “उस पवित्र स्थान में”; अगला खंड उस स्थान को मिलापवाले तंबू का आँगन बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִמֶּנָּה
  choice: उसमें से जो बचा रहे
  rationale: स्त्रीलिंग एकवचन कृदंत यहाँ संज्ञा की तरह प्रयुक्त होकर अन्नबलि के बचे हुए भाग को बताता है। यह हिंदी अभिव्यक्ति מן के ‘में से’ भाव को भी स्वाभाविक रूप से रखती है।
- source_word: יֹאכְלוּ
  choice: खाएँगे
  rationale: विधिक प्रसंग में अपूर्ण क्रिया निर्देशात्मक बल रखती है। हिंदी का भविष्यकाल यहाँ नियत कर्तव्य को सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: אַהֲרֹן וּבָנָיו
  choice: हारून और उसके पुत्र
  rationale: यहाँ בנים हारून के उन पुरुष वंशजों को दर्शाता है जो याजकीय सेवा से जुड़े हैं; इसलिए ‘पुत्र’ उपयुक्त है।
- source_word: מַצּוֹת תֵּאָכֵל
  choice: उसे ... बिना खमीर के खाया जाए
  rationale: מַצּוֹת अन्नबलि को अखमीरी रूप में खाने का निर्देश देता है। ‘रोटी’ या ‘लोई’ जोड़ने से बचकर हिंदी अनुवाद मूल की रूपगत व्यापकता बनाए रखता है; निष्क्रिय विधान भी सुरक्षित है।
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: किसी पवित्र स्थान में
  rationale: מָקוֹם पर निश्चित उपपद नहीं है, इसलिए इसे अनिश्चित रखा गया है। अगला वाक्यांश उस स्थान को मिलापवाले तंबू के आँगन के रूप में स्पष्ट करता है।
- source_word: בַּחֲצַר
  choice: आँगन में
  rationale: חצר तंबू के घेरे के भीतर के खुले प्रांगण को दर्शाता है; ‘आँगन’ सामान्य आधुनिक हिंदी में स्पष्ट है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह प्रचलित और बोधगम्य बाइबलीय पद है, जो इब्रानी नाम के तंबू और नियत भेंट/मिलन के भाव को बनाए रखता है।
- source_word: יֹאכְלוּהָ
  choice: वे उसे ... खाएँगे
  rationale: अंतिम क्रिया मूल निर्देश को वस्तु-प्रत्यय सहित दोहराती है। स्थान की विशिष्टता और मूल का पुनरुक्त बल बनाए रखने के लिए हिंदी में भी इसे दोहराया गया है।
