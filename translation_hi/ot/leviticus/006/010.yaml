id: LEV.6.10
reference: Leviticus 6:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹ֤א תֵאָפֶה֙ חָמֵ֔ץ חֶלְקָ֛/ם נָתַ֥תִּי אֹתָ֖/הּ מֵ/אִשָּׁ֑/י קֹ֤דֶשׁ קָֽדָשִׁים֙ הִ֔וא כַּ/חַטָּ֖את וְ/כָ/אָשָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/010.yaml
  text: It shall not be baked with leaven[a]. I have given it as their portion from my food offerings. It is most holy[b], like the sin offering and the guilt offering.
translation:
  language: hi
  text: उसे खमीर के साथ न पकाया जाए। मैंने उसे अपनी अग्नि-भेंटों में से उनका भाग दिया है। वह परमपवित्र है—पापबलि और दोषबलि[a] के समान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्षतिपूर्ति-बलि”; परंपरागत रूप से “अपराधबलि।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵאָפֶה
  choice: पकाया जाए
  rationale: निफ़ाल अपूर्ण रूप स्त्रीलिंग एकवचन है और भेंट के लिए निष्क्रिय विधिक निर्देश देता है; हिंदी में ‘न पकाया जाए’ स्वाभाविक और औपचारिक है।
- source_word: חָמֵץ
  choice: खमीर के साथ
  rationale: संज्ञा खमीर अथवा खमीरी पदार्थ को दर्शाती है; पकाने के संदर्भ में यह अनुवाद स्पष्ट है और अनावश्यक रूप से ‘रोटी’ नहीं जोड़ता।
- source_word: חֶלְקָם
  choice: उनका भाग
  rationale: यह याजकों को दिए गए निर्धारित हिस्से को व्यक्त करता है और बहुवचन संबंधसूचक प्रत्यय को बनाए रखता है।
- source_word: נָתַתִּי אֹתָהּ
  choice: मैंने उसे ... ठहराया है
  rationale: पूर्ण क्रिया यहोवा द्वारा किए गए स्थायी आवंटन को बताती है; पूर्ण वर्तमान उसका जारी प्रभाव व्यक्त करता है।
- source_word: מֵאִשַּׁי
  choice: अपनी अग्नि-भेंटों में से
  rationale: אִשֶּׁה बलिदानी तकनीकी पद है, जिसका संबंध आग पर चढ़ाई जाने वाली भेंट से है; ‘अग्नि-भेंट’ स्रोत की अग्नि-संबंधी छवि सुरक्षित रखता है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र
  rationale: हिब्रू की परमोत्कर्ष रचना पवित्रता की सर्वोच्च श्रेणी बताती है; ‘परमपवित्र’ संक्षिप्त और प्रचलित धार्मिक हिंदी है।
- source_word: כַּחַטָּאת
  choice: पापबलि ... के समान
  rationale: उपसर्ग כ तुलना अथवा समान वर्गीकरण दर्शाता है; ‘के समान’ इस संबंध को स्पष्ट करता है।
- source_word: וְכָאָשָׁם
  choice: दोषबलि
  rationale: बलिदानी संदर्भ में אָשָׁם अपराध अथवा दोष से संबंधित भेंट है; ‘दोषबलि’ आधुनिक हिंदी में संक्षिप्त और अपेक्षाकृत पारदर्शी है।
theological_decisions:
- issue: बलिदानी पद אָשָׁם का अनुवाद
  choice: दोषबलि
  alternative: क्षतिपूर्ति-बलि; अपराधबलि
  rationale: ‘दोषबलि’ इस बलिदानी श्रेणी का स्थापित और स्पष्ट नाम है तथा किसी विशिष्ट प्रायश्चित्त-सिद्धांत को पाठ में नहीं जोड़ता; अन्य अनुवाद उसके प्रतिपूर्ति अथवा अपराध संबंधी पहलू पर बल दे सकते हैं।
- issue: तकनीकी पद אִשֶּׁה का अनुवाद
  choice: अग्नि-भेंटें
  alternative: यहोवा की भोजन-भेंटें; आग में चढ़ाई गई भेंटें
  rationale: मूल पद की व्युत्पत्ति और बलिदानी प्रयोग आग से संबंध रखते हैं। ‘अग्नि-भेंट’ उस छवि को सुरक्षित रखते हुए स्वाभाविक हिंदी देता है; ‘भोजन-भेंट’ ईश्वर के लिए प्रस्तुत अंश के कार्यात्मक पहलू को उभारता है, पर इस पद को सामान्य अन्नबलि से भ्रमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण विधिक-बलिदानी शैली रखी गई है। ‘खमीर’, ‘अग्नि-भेंट’, ‘पापबलि’ और ‘दोषबलि’ सामान्य पाठक के लिए संक्षिप्त हैं, जबकि मूल के तकनीकी भेद और तुलना सुरक्षित रहते हैं।
