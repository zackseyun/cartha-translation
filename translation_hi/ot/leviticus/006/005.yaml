  text: וְ/הָ/אֵ֨שׁ עַל הַ/מִּזְבֵּ֤חַ תּֽוּקַד בּ/וֹ֙ לֹ֣א תִכְבֶּ֔ה וּ/בִעֵ֨ר עָלֶ֧י/הָ הַ/כֹּהֵ֛ן עֵצִ֖ים בַּ/בֹּ֣קֶר בַּ/בֹּ֑קֶר וְ/עָרַ֤ךְ עָלֶ֨י/הָ֙ הָֽ/עֹלָ֔ה וְ/הִקְטִ֥יר עָלֶ֖י/הָ חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/005.yaml
  text: And the fire on the altar shall be kept burning on it[a]; it shall not go out. The priest shall burn wood on it every morning[b], and he shall arrange the burnt offering on it and burn up on it the fat portions of the peace offerings.
translation:
  language: hi
  text: और वेदी पर आग जलती रखी जाएगी; वह बुझने न पाए। याजक हर सुबह[a] उस पर लकड़ियाँ जलाएगा, उस पर होमबलि को क्रम से रखेगा और उस पर मेलबलियों[b] की चरबी के भागों को धुएँ के रूप में जलाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सुबह-सुबह”; इब्रानी में ‘सुबह’ की पुनरावृत्ति प्रतिदिन किए जाने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: इसे “शांति-बलियाँ,” “कुशल-बलियाँ” या “सहभागिता की बलियाँ” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוּקַד
  choice: जलती रहेगी
  rationale: होफ़ाल रूप आग को लगातार जलती हुई अवस्था में बनाए रखने की अपेक्षा व्यक्त करता है; ‘जलती रहेगी’ इसे स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: לֹא תִכְבֶּה
  choice: वह बुझने न पाए
  rationale: यह वेदी की आग की निरंतरता संबंधी निषेध है। यह प्रयोग स्वाभाविक है और केवल अनायास बुझने तथा जानबूझकर बुझाए जाने—दोनों को समेटता है।
- source_word: וּבִעֵר ... עֵצִים
  choice: लकड़ियाँ जलाएगा
  rationale: संदर्भ में याजक प्रतिदिन लकड़ी डालकर वेदी की आग बनाए रखता है। यह स्रोत की क्रिया को निकटता से रखते हुए नई आग आरम्भ करने का अनावश्यक संकेत नहीं देता।
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: हर सुबह
  rationale: ‘सुबह’ की पुनरावृत्ति वितरणात्मक अर्थ देती है, अर्थात यह काम प्रतिदिन सुबह किया जाना है।
- source_word: וְעָרַךְ
  choice: क्रम से रखेगा
  rationale: बलिदानी संदर्भ में ערך का अर्थ वस्तुओं को विधिपूर्वक या उचित क्रम में रखना है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: यह आधुनिक हिन्दी बाइबलीय प्रयोग में इस विशिष्ट पूर्ण-दहन बलि के लिए पहचाना जाने वाला पारिभाषिक शब्द है।
- source_word: וְהִקְטִיר
  choice: जलाकर धुआँ करेगा
  rationale: हिफ़ील קטר बलि को वेदी पर जलाकर धुएँ के रूप में ऊपर उठाने की क्रिया बताता है; यह अनुवाद केवल सामान्यतः ‘जलाने’ की अपेक्षा उस बलिदानी बारीकी को अधिक स्पष्ट रखता है।
- source_word: חֶלְבֵי
  choice: चरबी के भागों
  rationale: यहाँ उन निश्चित चरबी वाले अंशों का उल्लेख है जिन्हें वेदी पर जलाया जाता था, न कि सामान्य रूप से ‘उत्तम भागों’ का।
- source_word: הַשְּׁלָמִים
  choice: मेलबलियों
  rationale: ‘मेलबलि’ हिन्दी में इस बलिदानी श्रेणी का संक्षिप्त और पहचाना जाने वाला नाम है; शब्द में निहित शांति, कुशल और सहभागिता के व्यापक भाव को पादटिप्पणी में खुला रखा गया है।
theological_decisions:
- issue: बलिदानी पारिभाषिक शब्दावली
  choice: स्थापित हिन्दी शब्द ‘होमबलि’ और ‘मेलबलि’ का प्रयोग
  alternative: ‘सर्वांग-दाह बलि’ तथा ‘शांति/कुशल की बलियाँ’ जैसे अधिक व्याख्यात्मक अनुवाद
  rationale: विधिक और उपासना-संबंधी संदर्भ में बलियों की विशिष्ट श्रेणियों को पहचानने योग्य रखना आवश्यक है। साथ ही ‘मेलबलि’ के संभावित अर्थ-आयामों को पादटिप्पणी में दिया गया है, ताकि किसी एक धर्मवैज्ञानिक व्याख्या को अंतिम न ठहराया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। विधिक निर्देश की अनिवार्यता के लिए भविष्यत्कालीन रूपों के साथ ‘बुझने न पाए’ का प्रयोग किया गया है। बलिदानी शब्दावली में प्रचलित हिन्दी पद रखे गए हैं और जहाँ इब्रानी अर्थ-क्षेत्र व्यापक है वहाँ विकल्प पादटिप्पणी में दिए गए हैं।
