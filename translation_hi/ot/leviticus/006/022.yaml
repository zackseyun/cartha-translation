lexical_decisions:
- source_word: כָּל זָכָר
  choice: हर पुरुष
  rationale: एकवचन זָכָר के साथ כָּל का भाव वितरणात्मक है। זָכָר यहाँ पुरुष-लिंग को निर्दिष्ट करता है, इसलिए आधुनिक और सटीक हिन्दी में ‘हर पुरुष’ स्वाभाविक है।
- source_word: בַּכֹּהֲנִים
  choice: याजकों में से
  rationale: בְּ यहाँ याजकीय समूह के भीतर सदस्यता दर्शाता है; ‘याजकों में से’ इस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יֹאכַל
  choice: खा सकता है
  rationale: इस विधिक प्रसंग में अपूर्ण क्रिया अधिकृत अथवा अनुमत कार्य बताती है, न कि प्रत्येक पुरुष याजक के लिए अनिवार्य आदेश।
- source_word: אֹתָהּ
  choice: उसे
  rationale: स्त्रीलिंग सर्वनाम पहले वर्णित भेंट की ओर संकेत करता है। हिन्दी में ‘उसे’ संदर्भ को बनाए रखता है और अनावश्यक संज्ञा नहीं जोड़ता।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र
  rationale: शाब्दिक रूप ‘पवित्रताओं की पवित्रता’ इब्रानी की सर्वोच्चता-सूचक अभिव्यक्ति है; बलि-संबंधी वस्तु के लिए ‘परमपवित्र’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: הִוא
  choice: वह ... है
  rationale: स्त्रीलिंग सर्वनाम अपने इब्रानी पूर्वपद से सहमत है; हिन्दी में संदर्भित भेंट के लिए ‘वह’ स्वाभाविक है और निहित योजक क्रिया को ‘है’ से व्यक्त किया गया है।
