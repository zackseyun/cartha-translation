  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक-धार्मिक शैली रखी गई है। ‘मिलापवाला तम्बू’, ‘पवित्रस्थान’, ‘प्रायश्चित’ और ‘पापबलि’ जैसे परिचित पद सामान्य पाठक की समझ और प्रमुख याजकीय शब्दों की निरन्तरता दोनों बनाए रखते हैं।
