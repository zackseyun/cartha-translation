base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/023.yaml
  text: But any sin offering from whose blood some is brought into the tent of meeting to make atonement in the holy place shall not be eaten[a]; it shall be burned with fire.
translation:
  language: hi
  text: और हर वह पापबलि[a], जिसके लहू में से कुछ मिलाप के तम्बू में, पवित्र स्थान में प्रायश्चित करने के लिए ले जाया जाए, खाई न जाए; वह आग में जला दी जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि”; लैव्यव्यवस्था में इब्रानी शब्द חַטָּאת उस बलि को भी दर्शा सकता है जो अशुद्धता और पाप का निवारण करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: परन्तु जिस किसी
  rationale: वाव पूर्ववर्ती नियम से जोड़ते हुए यहाँ अपवादात्मक/विरोधी नियम आरम्भ करता है, और כָל व्यापकता व्यक्त करता है। स्वाभाविक हिन्दी में ‘परन्तु जिस किसी’ दोनों बातों को स्पष्ट करता है।
- source_word: חַטָּאת
  choice: पापबलि
  rationale: याजकीय बलिदान-सन्दर्भ में यह अमूर्त ‘पाप’ नहीं, बल्कि पाप से सम्बन्धित बलि को दर्शाता है। ‘पापबलि’ हिन्दी बाइबलीय परम्परा में परिचित और संक्षिप्त है; शुद्धिकरण का वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר יוּבָא מִדָּמָהּ
  choice: जिसके लहू में से कुछ … ले जाया जाए
  rationale: 'מִן का अंशवाचक अर्थ सुरक्षित रखा गया है: बलि का सारा लहू नहीं, उसमें से कुछ भीतर ले जाया जाता है।'
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: मिलापवाले तम्बू के भीतर
  rationale: यह पवित्र निवास-ढाँचे का प्रचलित नाम है; ‘भीतर’ रक्त को अन्दर ले जाने की दिशा स्पष्ट करता है।
- source_word: לְכַפֵּר
  choice: प्रायश्चित करने के लिए
  rationale: याजकीय अनुष्ठान के כפר को स्थापित धार्मिक शब्दावली में व्यक्त करता है, पर प्रायश्चित की किसी विशिष्ट सिद्धान्तगत व्याख्या को आरोपित नहीं करता।
- source_word: בַּקֹּדֶשׁ
  choice: पवित्रस्थान में
  rationale: यह अमूर्त पवित्रता नहीं, पवित्र क्षेत्र/स्थान को सूचित करता है। संयुक्त रूप ‘पवित्रस्थान’ हिन्दी बाइबल-पाठ में स्पष्ट और परिचित है।
- source_word: לֹא תֵאָכֵל
  choice: उसे खाया न जाए
  rationale: निफ़अल का कर्मवाच्य और विधिक निषेध दोनों सुरक्षित रखे गए हैं।
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: वह आग में जला दी जाए
  rationale: हिब्रू के अग्नि-दहन पर बल को स्वाभाविक हिन्दी कर्मवाच्य में रखा गया है।
theological_decisions:
- issue: याजकीय बलि-विधान में חַטָּאת का अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: शब्द पाप तथा अशुद्धता से निपटने वाली बलि को सूचित कर सकता है। मुख्य पाठ में सामान्य पाठक के लिए परिचित ‘पापबलि’ रखा गया है, जबकि शुद्धिकरण का वास्तविक अर्थ-संकेत पादटिप्पणी में सुरक्षित है।
- issue: पवित्रस्थान में ले जाए गए लहू की मात्रा
  choice: ‘लहू में से कुछ’ कहकर अंशवाचक अर्थ स्पष्ट किया गया
  alternative: ‘जिसका लहू ले जाया जाए’
  rationale: מִדָּמָהּ में लगा מִן संकेत देता है कि लहू का कुछ भाग भीतर ले जाया जाता है। इसे स्पष्ट करने से अनुष्ठानिक विवरण समतल नहीं होता।
- issue: כפר की धार्मिक व्याप्ति
  choice: प्रायश्चित करना
  alternative: शुद्ध करना / दोष ढाँपना
  rationale: ‘प्रायश्चित’ अनुष्ठानिक और धार्मिक बल बनाए रखता है, किन्तु इस पद में क्रिया की कार्यविधि पर कोई संकीर्ण मत आरोपित नहीं करता।
