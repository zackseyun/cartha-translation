base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/014.yaml
  text: On a griddle with oil it shall be made[a], well mixed; you shall bring it in baked pieces, a grain offering broken into pieces[c][b], and present it as a pleasing aroma to Yahweh.
translation:
  language: hi
  text: उसे तवे पर तेल के साथ[a] बनाया जाए; तू उसे अच्छी तरह मिलाकर लाना। टुकड़ों में बाँटी हुई अन्नबलि के पके हुए भागों[b] को याहवे के लिए सुखद सुगंध[c] के रूप में अर्पित करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेल में’।
    reason: lexical_alternative
  - marker: b
    text: यहाँ जिस इब्रानी शब्द का अनुवाद ‘पके हुए भागों’ किया गया है, वह दुर्लभ है और सम्भवतः तवे पर तैयार किए गए पके भागों को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: ‘सुखद सुगंध’ इब्रानी बलिदानी भाषा की एक प्रचलित अभिव्यक्ति है, जो याहवे के सामने भेंट के स्वीकारयोग्य होने का संकेत देती है।
    reason: cultural_note
lexical_decisions:
- source_word: מַחֲבַת
  choice: तवा
  rationale: यह समतल पकाने वाले पात्र या सतह को दर्शाता है; आधुनिक हिन्दी में ‘तवा’ स्वाभाविक और स्पष्ट है।
- source_word: בַּשֶּׁמֶן
  choice: तेल के साथ
  rationale: בְּ यहाँ साधन या माध्यम बता सकता है; ‘तेल के साथ’ स्वाभाविक हिन्दी है, जबकि ‘तेल में’ सम्भव विकल्प के रूप में पादटिप्पणी में रखा गया है।
- source_word: תֵּעָשֶׂה
  choice: बनाया जाए
  rationale: עשה के निफ़अल रूप का सीधा कर्मवाच्य अर्थ बनाए रखा गया है।
- source_word: מֻרְבֶּכֶת
  choice: अच्छी तरह मिलाया जाए
  rationale: यह तेल के साथ मिश्रित या गुँथे हुए होने का भाव देता है; किसी अनिश्चित विशिष्ट पाक-विधि को आरोपित किए बिना सामान्य अर्थ रखा गया है।
- source_word: תְּבִיאֶנָּה
  choice: तू उसे ... लाना
  rationale: क्रिया का मूल अर्थ ‘लाना’ है और स्त्रीलिंग प्रत्यय अन्नबलि की ओर संकेत करता है।
- source_word: תֻּפִינֵי
  choice: पके हुए भागों
  rationale: यह दुर्लभ पाक-संबंधी शब्द है, जो सम्भवतः तवे पर तैयार किए गए पके भागों को दर्शाता है; इसकी अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: מִנְחַת
  choice: अन्नबलि
  rationale: लैव्यव्यवस्था में अनाज या मैदे से तैयार विशिष्ट भेंट के लिए प्रचलित और संक्षिप्त हिन्दी पद।
- source_word: פִּתִּים
  choice: टुकड़ों में की हुई
  rationale: अर्पण को विभाजित या तोड़े हुए टुकड़ों में प्रस्तुत करने का अर्थ स्पष्ट करता है।
- source_word: תַּקְרִיב
  choice: अर्पित करना
  rationale: बलिदानी प्रसंग में קרב के हिफ़ील रूप का अर्थ किसी भेंट को समीप लाकर चढ़ाना या प्रस्तुत करना है।
- source_word: רֵיחַ נִיחֹחַ
  choice: मनभावनी सुगंध
  rationale: मानक बलिदानी अभिव्यक्ति का सहज हिन्दी रूप, जो याहवे के सामने भेंट की स्वीकार्यता का भाव रखता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: मूल पाठ में आए परमेश्वर के निज नाम יהוה को लिप्यंतरित कर स्पष्ट रूप से सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चतुरक्षरीय निज नाम सीधे आया है; ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और वाचा-संबंधी नाम को सामान्य उपाधि में नहीं बदलता।
- issue: רֵיחַ נִיחֹחַ का बलिदानी आशय
  choice: मनभावनी सुगंध
  alternative: सुखदायक सुगंध; सुगंधित भेंट
  rationale: यह मानक बलिदानी सूत्र को बनाए रखता है और भेंट की ईश्वरीय स्वीकार्यता का संकेत देता है, बिना अभिव्यक्ति को केवल भौतिक गंध तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। विधिक-उपदेशात्मक एकवचन ‘तू’ मूल इब्रानी संबोधन को सुरक्षित रखता है। दुर्लभ पाक-संबंधी शब्द की अनिश्चितता को मुख्य पाठ में अत्यधिक तकनीकी बनाए बिना पादटिप्पणी में स्पष्ट किया गया है।
