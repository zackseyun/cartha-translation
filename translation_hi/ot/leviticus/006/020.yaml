source:
  edition: WLC
  text: כֹּ֛ל אֲשֶׁר יִגַּ֥ע בִּ/בְשָׂרָ֖/הּ יִקְדָּ֑שׁ וַ/אֲשֶׁ֨ר יִזֶּ֤ה מִ/דָּמָ/הּ֙ עַל הַ/בֶּ֔גֶד אֲשֶׁר֙ יִזֶּ֣ה עָלֶ֔י/הָ תְּכַבֵּ֖ס בְּ/מָק֥וֹם קָדֹֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/020.yaml
  text: Anything that touches its flesh shall become holy[a], and if any of its blood is spattered on a garment, you shall wash that on which it was spattered in a holy place.
translation:
  language: hi
  text: जो भी उसके मांस को छुए, वह पवित्र हो जाएगा। और यदि उसके लहू के छींटे किसी वस्त्र पर पड़ जाएँ[a], तो उसे किसी पवित्र स्थान में धोना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छिड़का जाए।” इब्रानी क्रिया अनुष्ठानिक रूप से छिड़कने का अर्थ भी दे सकती है; यहाँ वस्त्र पर लहू पड़ने और फिर उसे धोने के प्रसंग के कारण “लहू के छींटे ... पड़ जाएँ” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: जो कुछ
  rationale: यह अनिश्चित और सर्वसमावेशी इब्रानी अभिव्यक्ति है; ‘जो कुछ’ वस्तु या व्यक्ति—दोनों की संभावना खुली रखती है और हिन्दी में स्वाभाविक है।
- source_word: יִגַּע בִּבְשָׂרָהּ
  choice: उसके मांस को छुए
  rationale: בָּשָׂר का मूल अर्थ ‘मांस’ है और यहाँ पापबलि के मांस की ओर संकेत है; स्त्रीलिंग प्रत्यय को ‘उसके’ से व्यक्त किया गया है।
- source_word: יִקְדָּשׁ
  choice: पवित्र हो जाएगा
  rationale: काल रूप संपर्क के फलस्वरूप पवित्र स्थिति में आने का बोध देता है। यह औपचारिक संस्कार या नैतिक परिवर्तन को अनावश्यक रूप से नहीं जोड़ता।
- source_word: וַאֲשֶׁר יִזֶּה מִדָּמָהּ
  choice: यदि उसके लहू में से कुछ किसी वस्त्र पर छींटे के रूप में पड़ जाए
  rationale: נזה लहू के उछलकर या छिड़ककर वस्त्र पर पहुँचने को दर्शा सकता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और अनुष्ठानिक ‘छिड़का जाए’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: עַל הַבֶּגֶד
  choice: किसी वस्त्र पर
  rationale: विधिक कथन में यह किसी भी ऐसे वस्त्र की सामान्य स्थिति बताता है; इसलिए हिन्दी में अनिश्चित ‘किसी वस्त्र’ स्वाभाविक है।
- source_word: אֲשֶׁר יִזֶּה עָלֶיהָ
  choice: उस वस्त्र को, जिस पर वह पड़ा है
  rationale: संबंधवाचक उपवाक्य वस्त्र को निर्दिष्ट करता है जिस पर लहू पड़ा। स्पष्टता के लिए ‘वस्त्र’ दोहराया गया है।
- source_word: תְּכַבֵּס
  choice: धोना
  rationale: पिएल रूप वस्त्र धोने का निर्देश देता है। हिन्दी विधिक शैली में ‘धोना’ प्रत्यक्ष आदेश का स्वाभाविक रूप है।
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: किसी पवित्र स्थान में
  rationale: इब्रानी में ‘स्थान’ के साथ निश्चित उपपद नहीं है; इसलिए किसी पवित्र ठहराए गए क्षेत्र का अर्थ रखा गया है, न कि विशेष रूप से भीतरी पवित्रस्थान का।
theological_decisions:
- issue: पापबलि के मांस के स्पर्श से प्राप्त पवित्रता का अर्थ
  choice: स्पर्श करने वाला पवित्र स्थिति में आ जाता है
  alternative: वह केवल पवित्र उपयोग के लिए प्रतिबंधित हो जाता है
  rationale: यह प्रसंग अनुष्ठानिक पवित्रता का है, आंतरिक नैतिक परिवर्तन का नहीं। ‘पवित्र हो जाएगा’ मूल कथन को बनाए रखते हुए इस तनाव को संदर्भ से समझने देता है।
- issue: נזה का अनुष्ठानिक या आकस्मिक भाव
  choice: मुख्य पाठ में वस्त्र पर छींटे के रूप में पड़ना
  alternative: लहू का विधिपूर्वक छिड़का जाना
  rationale: वस्त्र को बाद में धोने का निर्देश आकस्मिक छींटे के अनुकूल है, पर क्रिया अनुष्ठानिक छिड़काव भी व्यक्त कर सकती है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और विधिक-धार्मिक शैली। ‘लहू’ बलिदान-संबंधी बाइबलीय प्रसंग में गरिमापूर्ण और सामान्यतः समझ में आने वाला शब्द है। वाक्य को स्पष्ट रखने के लिए दूसरे खंड में ‘उस वस्त्र’ दोहराया गया है।
