source:
  edition: WLC
  text: צַ֤ו אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו לֵ/אמֹ֔ר זֹ֥את תּוֹרַ֖ת הָ/עֹלָ֑ה הִ֣וא הָ/עֹלָ֡ה עַל֩ מוֹקְדָ֨ה עַל הַ/מִּזְבֵּ֤חַ כָּל הַ/לַּ֨יְלָה֙ עַד הַ/בֹּ֔קֶר וְ/אֵ֥שׁ הַ/מִּזְבֵּ֖חַ תּ֥וּקַד בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/002.yaml
  text: 'Command Aaron and his sons[a], saying, This is the law of the burnt offering: the burnt offering itself shall remain on its hearth on the altar all night until the morning[b], and the fire of the altar shall be kept burning on it.'
translation:
  language: hi
  text: 'हारून और उसके पुत्रों को यह आज्ञा दे: “होमबलि की व्यवस्था[a] यह है: होमबलि सारी रात, भोर तक, वेदी के अग्निस्थान[b] पर रहे, और वेदी पर आग जलती रखी जाए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “होमबलि के लिए निर्देश।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू शब्द वेदी पर जलाने के स्थान या अग्निकुंड को दर्शाता है।
    reason: lexical_clarification
lexical_decisions:
- source_word: צַו
  choice: यह आज्ञा दे
  rationale: צוה के imperative का सीधा और बाध्यकारी बल बनाए रखता है; केवल ‘निर्देश दे’ की अपेक्षा अधिक सटीक है।
- source_word: אַהֲרֹן וְאֶת־בָּנָיו
  choice: हारून और उसके पुत्रों को
  rationale: याजकीय संदर्भ में בנים हारून के पुरुष वंशजों, अर्थात उसके पुत्रों, को सूचित करता है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष कथन के लिए द्विबिंदु
  rationale: हिन्दी में ‘यह कहते हुए’ जोड़ने के बजाय आज्ञा के बाद द्विबिंदु स्वाभाविक रूप से प्रत्यक्ष वचन आरम्भ करता है।
- source_word: זֹאת תּוֹרַת
  choice: व्यवस्था यह है
  rationale: बलिदान-विधि के औपचारिक नियम को व्यक्त करता है; ‘व्यवस्था’ आधुनिक हिन्दी में ‘कानून’ से अधिक स्वाभाविक है और व्यापक धर्मशास्त्रीय अर्थ अनावश्यक रूप से आरोपित नहीं करता।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: पूरी तरह जलाई जाने वाली עֹלָה के लिए स्थापित, संक्षिप्त और हिन्दी बाइबिलीय शब्द है।
- source_word: הִוא הָעֹלָה
  choice: होमबलि
  rationale: हिब्रू में सर्वनाम और संज्ञा की पुनरुक्ति विषय को सामने रखती है। हिन्दी में उसी संज्ञा को अगले उपवाक्य का स्पष्ट कर्ता बनाना अर्थ को स्वाभाविक रूप से व्यक्त करता है, बिना कृत्रिम ‘वही होमबलि’ के।
- source_word: עַל מוֹקְדָה
  choice: अग्निस्थान पर पड़ी रहे
  rationale: מוֹקְדָה वेदी पर जलने के स्थान या अग्निकुंड को दर्शाता है। ‘अग्निस्थान’ ठोस छवि को सुरक्षित रखता है; ‘पड़ी रहे’ रात भर वहीं बने रहने के आशय को स्पष्ट करता है।
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: सारी रात, भोर तक
  rationale: समयावधि और उसकी सीमा दोनों को हिब्रू क्रम के निकट रखते हुए सहज हिन्दी में व्यक्त करता है।
- source_word: וְאֵשׁ הַמִּזְבֵּחַ תּוּקַד בּוֹ
  choice: और वेदी की आग उस पर जलती रखी जाए
  rationale: Hophal रूप आग को लगातार बनाए रखने की अपेक्षा व्यक्त करता है, केवल उसके जलने का वर्णन नहीं। ‘उस पर’ हिब्रू प्रत्यय की संक्षिप्त संदर्भगत अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: बलिदान-विधान में תּוֹרָה का अनुवाद
  choice: व्यवस्था
  alternative: निर्देश; विधि; कानून
  rationale: यहाँ शब्द विशेष बलिदान को नियंत्रित करने वाले निर्धारित विधान को दर्शाता है। ‘व्यवस्था’ औपचारिकता बनाए रखती है, पर इसे सम्पूर्ण मूसा की तोराह के शीर्षक के रूप में नहीं पढ़वाती।
- issue: वेदी की आग के विषय में आज्ञा का स्वरूप
  choice: जलती रखी जाए
  alternative: जलती रहे
  rationale: תּוּקַד का रूप आग को बनाए रखने की निर्धारित जिम्मेदारी व्यक्त करता है; यह केवल आग की दशा का कथन नहीं है।
- issue: בּוֹ का संदर्भ
  choice: उस पर
  alternative: उसमें; वेदी पर
  rationale: पुंल्लिंग एकवचन प्रत्यय का निकट संदर्भ वेदी अथवा अग्निस्थान के प्रसंग से जुड़ सकता है। ‘उस पर’ अनावश्यक रूप से संदर्भ तय किए बिना हिब्रू की संक्षिप्तता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में औपचारिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘होमबलि’ और ‘वेदी’ जैसे स्थापित धार्मिक शब्द रखे गए हैं; वाक्य-विन्यास को स्वाभाविक हिन्दी के अनुरूप बनाया गया है।
