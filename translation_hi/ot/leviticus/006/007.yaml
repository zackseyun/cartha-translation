id: LEV.6.7
reference: Leviticus 6:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/מִּנְחָ֑ה הַקְרֵ֨ב אֹתָ֤/הּ בְּנֵֽי אַהֲרֹן֙ לִ/פְנֵ֣י יְהוָ֔ה אֶל פְּנֵ֖י הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/007.yaml
  text: 'And this is the law of the grain offering: the sons of Aaron shall present it before Yahweh[a], in front of the altar.'
translation:
  language: hi
  text: 'और अन्नबलि की विधि[a] यह है: हारून के पुत्र उसे याहवे के सामने, वेदी के आगे प्रस्तुत करें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अन्नबलि के लिए निर्देश” अथवा “अन्नबलि का नियम।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: और ... यह है
  rationale: संयोजक और संकेतवाचक पद नए विधि-खंड का परिचय देते हैं; हिंदी में यह संरचना मूल का संबंध बनाए रखते हुए स्वाभाविक है।
- source_word: תּוֹרַת
  choice: की विधि
  rationale: यहाँ תּוֹרָה बलि चढ़ाने की निर्धारित प्रक्रिया को दर्शाता है। “विधि” कानूनी-अनुष्ठानिक भाव को स्पष्ट और सहज हिंदी में व्यक्त करता है।
- source_word: הַמִּנְחָה
  choice: अन्नबलि
  rationale: लैव्यव्यवस्था के बलिदान-संदर्भ में מִנְחָה अनाज से चढ़ाई जाने वाली विशिष्ट भेंट है; “अन्नबलि” स्थापित, संक्षिप्त और स्पष्ट हिंदी पद है।
- source_word: הַקְרֵב אֹתָהּ
  choice: उसे ... प्रस्तुत करें
  rationale: क्रिया वेदी के पास अनुष्ठानिक रूप से भेंट लाकर उपस्थित करने का निर्देश देती है; “प्रस्तुत करें” इस क्रिया को अनावश्यक विस्तार के बिना व्यक्त करता है।
- source_word: בְּנֵי אַהֲרֹן
  choice: हारून के पुत्र
  rationale: यह मूल के पारिवारिक और याजकीय पदनाम को सीधे सुरक्षित रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי दिव्य उपस्थिति में किए जाने वाले कार्य को दर्शाता है, और יהוה को उसके व्यक्तिवाचक वाचा-नाम “याहवे” के रूप में रखा गया है।
- source_word: אֶל פְּנֵי הַמִּזְבֵּחַ
  choice: वेदी के आगे
  rationale: यह वाक्यांश वेदी के संबंध में प्रस्तुति का स्थान बताता है। “आगे” इसे पहले आए “याहवे के सामने” से अलग रखते हुए स्थानिक अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम सीधे आया है। “याहवे” उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: बलिदान-विधान में תּוֹרָה का अर्थ
  choice: विधि
  alternative: निर्देश; नियम
  rationale: इस संदर्भ में पद किसी व्यापक धर्मशास्त्रीय संहिता के बजाय अन्नबलि की निर्धारित अनुष्ठानिक प्रक्रिया का परिचय देता है। “विधि” उसके बाध्यकारी और प्रक्रियात्मक दोनों भावों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, संक्षिप्त विधिक-अनुष्ठानिक शैली रखी गई है। “प्रस्तुत करें” सामान्य पाठक के लिए सुबोध है और मूल की याजकीय क्रिया को अत्यधिक तकनीकी बनाए बिना व्यक्त करता है।
