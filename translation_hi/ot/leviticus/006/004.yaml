  yaml_path: translation/ot/leviticus/006/004.yaml
  text: Then he shall take off his garments and put on other garments[b][a], and carry the ashes outside the camp to a clean place.
translation:
  language: hi
  text: तब वह अपने वस्त्र उतारकर दूसरे वस्त्र पहने और राख को छावनी के बाहर किसी शुद्ध स्थान पर ले जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “शुद्ध” का अर्थ लैव्यव्यवस्था के अनुसार अनुष्ठानिक रूप से शुद्ध है।
    reason: cultural_note
lexical_decisions:
- source_word: וּפָשַׁט אֶת־בְּגָדָיו
  choice: तब वह अपने वस्त्र उतारकर
  rationale: वस्त्रों के संदर्भ में פשט का अर्थ ‘उतारना’ है। ‘तब’ विधि में क्रमसूचक वाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלָבַשׁ בְּגָדִים אֲחֵרִים
  choice: दूसरे वस्त्र पहने
  rationale: לבש वस्त्र पहनने को और אֲחֵרִים पहले वाले वस्त्रों से भिन्न वस्त्रों को सूचित करता है।
- source_word: וְהוֹצִיא אֶת־הַדֶּשֶׁן
  choice: और राख को ... ले जाए
  rationale: हिफ़ील रूप וְהוֹצִיא का अर्थ बाहर निकालना या बाहर ले जाना है; गंतव्य के साथ ‘ले जाए’ ठोस क्रिया को स्वाभाविक ढंग से व्यक्त करता है। דֶּשֶׁן यहाँ वेदी पर बची राख अथवा जले हुए अवशेषों के लिए है।
- source_word: אֶל־מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह पदबंध छावनी की सीमा से बाहर की ओर गति और स्थान दोनों को दर्शाता है।
- source_word: אֶל־מָקוֹם טָהוֹר
  choice: किसी शुद्ध स्थान पर
  rationale: טָהוֹר लैव्यव्यवस्था के संदर्भ में अनुष्ठानिक शुद्धता की श्रेणी है। ‘शुद्ध’ इस अर्थ को संक्षेप और गरिमा से बनाए रखता है; अनिश्चित מָקוֹם के लिए ‘किसी ... स्थान’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: טָהוֹר में अनुष्ठानिक शुद्धता का भाव
  choice: शुद्ध स्थान
  alternative: अनुष्ठानिक रूप से शुद्ध स्थान; साफ़ स्थान
  rationale: ‘शुद्ध’ लैव्यव्यवस्था की शुद्ध-अशुद्ध श्रेणी को बनाए रखता है, जबकि ‘साफ़’ इसे केवल भौतिक स्वच्छता समझे जाने का जोखिम पैदा करता है। मुख्य पाठ में ‘अनुष्ठानिक रूप से’ जोड़ना मूल से अधिक स्पष्ट कर देता; इसलिए यह बात पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिसंबंधी, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘वस्त्र’, ‘छावनी’ और ‘शुद्ध’ पुरोहितीय संदर्भ के अनुरूप हैं। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का क्रम और आशय असंगत था; इसलिए केवल वास्तविक अनुष्ठानिक-शुद्धता संबंधी टिप्पणी रखी गई है।
