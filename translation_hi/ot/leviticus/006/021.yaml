  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण विधिक-पुजारीय रजिस्टर अपनाया गया है। दोनों निष्क्रिय निर्देशों को 'जाए' से रखा गया है और सामग्री के आधार पर पात्रों के अलग व्यवहार को स्पष्ट बनाए रखा गया है।
