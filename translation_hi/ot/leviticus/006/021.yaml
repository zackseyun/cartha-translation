base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/021.yaml
  text: And an earthenware vessel in which it is boiled must be broken; but if it is boiled in a bronze vessel[a], it must be scoured and rinsed with water.
translation:
  language: hi
  text: और मिट्टी का वह पात्र जिसमें उसे उबाला जाए, तोड़ दिया जाए; पर यदि उसे काँसे के पात्र[a] में उबाला जाए, तो उस पात्र को माँजा जाए और पानी से खंगाला जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ताँबे के पात्र।” इब्रानी शब्द נְחֹשֶׁת प्रसंग के अनुसार ताँबे या काँसे का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: मिट्टी का पात्र
  rationale: यह सामान्य पात्र के साथ मिट्टी/मृद्भांड की सामग्री को स्पष्ट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תְּבֻשַּׁל / בֻּשָּׁלָה
  choice: उबाला जाए
  rationale: बलिदान-संबंधी इस प्रसंग में क्रिया उबालकर पकाने को सूचित करती है; निष्क्रिय विधिक रूप भी बनाए रखा गया है।
- source_word: בּוֹ
  choice: जिसमें
  rationale: यह प्रत्यययुक्त संबंधबोधक शब्द पात्र की ओर संकेत करता है और स्थानगत संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: יִשָּׁבֵר
  choice: तोड़ दिया जाए
  rationale: निफ़अल अपूर्ण रूप यहाँ विधिक निर्देश देता है; यह चयन दायित्व को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: כְלִי נְחֹשֶׁת
  choice: काँसे का पात्र
  rationale: נְחֹשֶׁת ताँबे या काँसे को सूचित कर सकता है। प्राचीन धातु-पात्र के लिए 'काँसा' उपयुक्त मुख्य पाठ है, जबकि वास्तविक शब्दगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וּמֹרַק
  choice: माँजा जाए
  rationale: क्रिया रगड़कर अच्छी तरह साफ करने का अर्थ देती है; धातु के पात्र के लिए 'माँजना' स्वाभाविक और सटीक हिन्दी है।
- source_word: וְשֻׁטַּף בַּמָּיִם
  choice: और पानी से धोया जाए
  rationale: שטף पानी से बहाकर धोने या खँगालने का भाव रखती है। 'पानी से धोया जाए' सामान्य पाठक के लिए स्पष्ट है और माँजने के बाद की दूसरी सफ़ाई-क्रिया को दर्शाता है।
