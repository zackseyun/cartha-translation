reference: Leviticus 6:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֵרִ֨ים מִמֶּ֜/נּוּ בְּ/קֻמְצ֗/וֹ מִ/סֹּ֤לֶת הַ/מִּנְחָה֙ וּ/מִ/שַּׁמְנָ֔/הּ וְ/אֵת֙ כָּל הַ/לְּבֹנָ֔ה אֲשֶׁ֖ר עַל הַ/מִּנְחָ֑ה וְ/הִקְטִ֣יר הַ/מִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖/הּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/008.yaml
  text: And he shall take up from it a handful of the fine flour of the grain offering and some of its oil[a], with all the frankincense that is on the grain offering[b], and he shall burn its memorial portion on the altar as a pleasing aroma to Yahweh.
translation:
  language: hi
  text: फिर वह अन्नबलि के मैदे में से अपनी मुट्ठी भर, और उसके तेल में से कुछ, तथा अन्नबलि पर रखा हुआ सारा लोबान लेगा[a]। वह उस स्मरण-भाग[b] को वेदी पर जलाएगा, जो याहवे के लिए मनभावनी सुगंध होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद यह भी हो सकता है, “वह उसमें से अपनी मुट्ठी से उठाएगा।” इब्रानी क्रिया और संज्ञा मिलकर अर्पण में से निर्धारित मुट्ठी भर भाग उठाने पर बल देती हैं।
    reason: lexical_alternative
  - marker: b
    text: “स्मरण-भाग” बलिदान से जुड़ा एक विशेष शब्द है। यह अन्नबलि के उस प्रतिनिधि भाग को दर्शाता है जिसे वेदी पर जलाया जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵרִים ... בְּקֻמְצוֹ
  choice: अपनी मुट्ठी भर उठाएगा
  rationale: हिफ़ील क्रिया רום और קֹמֶץ का मेल अर्पण में से निर्धारित मुट्ठी भर भाग उठाकर अलग करने को व्यक्त करता है। यह अनुवाद उठाने और मात्रा—दोनों भावों को सहज हिन्दी में रखता है।
- source_word: מִסֹּלֶת הַמִּנְחָה
  choice: अन्नबलि के मैदे
  rationale: סֹלֶת बारीक, छना हुआ मैदा है और מִנְחָה इस लैव्यव्यवस्था-संदर्भ में अन्नबलि है।
- source_word: וּמִשַּׁמְנָהּ
  choice: और उसके तेल में से
  rationale: מִן की पुनरावृत्ति अंश लेने का भाव बनाए रखती है; इससे यह संकेत नहीं मिलता कि सारा तेल लिया जाता है।
- source_word: כָּל הַלְּבֹנָה
  choice: सारा लोबान
  rationale: לְבֹנָה विशेष रूप से frankincense अर्थात लोबान है; כָּל बताता है कि उसका पूरा भाग लिया जाता है।
- source_word: וְהִקְטִיר
  choice: जलाएगा
  rationale: बलिदान-संदर्भ में यह क्रिया वेदी पर अर्पण को जलाकर धुआँ करने का निर्देश देती है; ‘जलाएगा’ स्वाभाविक और स्पष्ट है।
- source_word: רֵיחַ נִיחֹחַ
  choice: मनभावनी सुगंध
  rationale: यह स्थिर बलिदानी पद परमेश्वर के सामने अर्पण की स्वीकार्यता दर्शाता है; ‘मनभावनी सुगंध’ उसके रूपक और गरिमा को बनाए रखता है।
- source_word: אַזְכָּרָתָהּ
  choice: उसके स्मरण-भाग
  rationale: यह अन्नबलि के उस प्रतिनिधि भाग का तकनीकी नाम है जिसे वेदी पर जलाया जाता था।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: יהוה को उसके व्यक्तिगत वाचा-नाम के लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है; לְ यहाँ अर्पण की दिशा/समर्पण बताता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम स्पष्ट रूप से आया है। ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और उपाधि से नाम को नहीं बदलता।
- issue: רֵיחַ נִיחֹחַ का बलिदानी अर्थ
  choice: मनभावनी सुगंध
  alternative: सुखदायक सुगंध; सुहावनी सुगंध
  rationale: चुना हुआ पद दैवी स्वीकार्यता का भाव रखता है, पर बलिदान की प्रक्रिया के बारे में अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अन्नबलि’, ‘वेदी’, ‘लोबान’ और ‘स्मरण-भाग’ जैसे शब्द अनुष्ठानिक सटीकता बनाए रखते हैं; तकनीकी ‘स्मरण-भाग’ को पादटिप्पणी में स्पष्ट किया गया है।
