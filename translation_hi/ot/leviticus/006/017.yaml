  rationale: वाव-क्रमिक रूप नए कथन-खंड को पिछले प्रसंग से जोड़ता है। हिन्दी में इस परिचयात्मक सूत्र के लिए ‘और … ने कहा’ स्वाभाविक है और ‘तब’ जैसा अतिरिक्त कालक्रम नहीं जोड़ता।
- source_word: יְהוָה
