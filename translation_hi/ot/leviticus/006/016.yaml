  choice: मुख्य पाठ में ‘पूरी तरह जला दिया जाए’
  alternative: ‘संपूर्ण अर्पण हो’
  rationale: शब्द मूलतः समग्रता पर बल देता है, पर बलि-विधान के प्रसंग और ‘उसे खाया न जाए’ से इसका व्यावहारिक आशय पूर्ण दहन है। पादटिप्पणी मूल शब्द की व्यापकता बनाए रखती है।
