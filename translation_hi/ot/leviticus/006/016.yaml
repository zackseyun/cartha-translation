lexical_decisions:
- source_word: וְ/כָל
  choice: और ... हर
  rationale: וְ विधिक निर्देश की निरंतरता दिखाता है, और एकवचन संज्ञा के साथ כָּל का वितरणात्मक अर्थ ‘हर’ है।
- source_word: מִנְחַת
  choice: अन्नबलि
  rationale: लैव्यव्यवस्था में מִנְחָה अनाज से चढ़ाई जाने वाली विशिष्ट बलि का पारिभाषिक शब्द है; ‘अन्नबलि’ हिंदी बाइबिलीय प्रयोग में संक्षिप्त और सुबोध है।
- source_word: כֹּהֵן
  choice: याजक का
  rationale: निर्माण מִנְחַת כֹּהֵן का स्वाभाविक अर्थ ‘याजक का अन्नबलि’ है; हिंदी में संबंधकारक रूप सहज है।
- source_word: כָּלִיל
  choice: पूरी तरह जला दिया जाए
  rationale: כָּלִיל किसी वस्तु के संपूर्ण रूप से अर्पित होने को बताता है और यहाँ अगले निषेध से स्पष्ट है कि बलि का कोई अंश खाने के लिए नहीं बचता; हिंदी में निहित वेदी-दहन को स्पष्ट करना स्वाभाविक है।
- source_word: תִּהְיֶה
  choice: दिया जाए
  rationale: विधिक प्रसंग में अपूर्ण क्रिया का आदेशात्मक भाव हिंदी के ‘जाए’ रूप से व्यक्त होता है।
- source_word: לֹא תֵאָכֵל
  choice: उसे खाया न जाए
  rationale: निफ़अल का कर्मवाच्य और विधिक निषेध दोनों सीधे और औपचारिक हिंदी में सुरक्षित रहते हैं।
