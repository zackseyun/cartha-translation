id: LEV.6.15
reference: Leviticus 6:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/כֹּהֵ֨ן הַ/מָּשִׁ֧יחַ תַּחְתָּ֛י/ו מִ/בָּנָ֖י/ו יַעֲשֶׂ֣ה אֹתָ֑/הּ חָק עוֹלָ֕ם לַ/יהוָ֖ה כָּלִ֥יל תָּקְטָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/015.yaml
  text: 'And the anointed priest from among his sons[a], who succeeds him, shall prepare it[c][b]. It is a permanent statute for Yahweh: it shall be completely turned into smoke.'
translation:
  language: hi
  text: उसके पुत्रों में से जो अभिषिक्त याजक उसके स्थान पर आएगा[a], वह इसे तैयार करेगा। यह यहोवा के लिए सदा की विधि[b] है; इसे पूरी तरह धुएँ में चढ़ाया जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके नीचे”; प्रसंग में अर्थ “उसके स्थान पर” है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “स्थायी विधि” या “सदा का विधान” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात भेंट को वेदी पर पूरी तरह जलाकर धुएँ के रूप में चढ़ाया जाए।
    reason: clarification
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: अभिषिक्त याजक
  rationale: याजकीय पद के लिए तेल से अभिषिक्त व्यक्ति का स्वाभाविक और प्रसंगानुकूल वर्णन; यहाँ यह मसीही उपाधि नहीं है।
- source_word: תַּחְתָּיו מִבָּנָיו
  choice: उसके पुत्रों में से जो ... उसके स्थान पर आएगा
  rationale: מִבָּנָיו चयन और वंशगत उत्तराधिकार को व्यक्त करता है, जबकि תַּחְתָּיו का मूल भाव ‘उसके स्थान पर’ है।
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: वह इसे तैयार करेगा
  rationale: עָשָׂה का अर्थ व्यापक है; बलि-विधि के प्रसंग में ‘तैयार करेगा’ स्पष्ट है और ‘चढ़ाएगा’ जैसी अधिक विशिष्ट क्रिया को मूल पाठ में जोड़े बिना अर्थ देता है।
- source_word: חָק עוֹלָם
  choice: सदा की विधि
  rationale: यह स्थायी और निरंतर लागू रहने वाले विधान का भाव सरल, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ समर्पण अथवा संबंध का भाव देता है; ‘के लिए’ इस विधि और भेंट के यहोवा से संबंधित होने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּלִיל תָּקְטָר
  choice: इसे पूरी तरह धुएँ में चढ़ाया जाएगा
  rationale: כָּלִיל संपूर्णता बताता है और קטר का हिफ़ील रूप बलि को जलाकर धुएँ के रूप में चढ़ाने की विशिष्ट याजकीय क्रिया दर्शाता है।
theological_decisions:
- issue: ‘अभिषिक्त याजक’ की पहचान
  choice: पुत्रों में से पद ग्रहण करने वाला अभिषिक्त याजक
  alternative: कोई भी अभिषिक्त याजक; अथवा मसीही व्यक्ति का संकेत
  rationale: लेवीय याजकीय प्रसंग और ‘उसके पुत्रों में से ... उसके स्थान पर’ वाक्यांश इसे उत्तराधिकार में मिलने वाले याजकीय पद से जोड़ते हैं; पाठ को मसीही उपाधि बनाना प्रसंग से परे होगा।
- issue: יהוה का हिन्दी रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: ‘यहोवा’ हिन्दी पाठकों में परमेश्वर के व्यक्तिगत नाम के पारंपरिक और पहचाने जाने योग्य रूप के रूप में स्थापित है; इससे मूल पाठ में उपस्थित नाम को उपाधि में बदले बिना रखा जाता है।
- issue: חק עולם की अवधि
  choice: सदा की विधि
  alternative: स्थायी विधि; सनातन विधान
  rationale: मूल पदबंध की दीर्घस्थायिता को रखा गया है, पर उसके कालगत या वाचा-संबंधी अनुप्रयोग पर पाठ से आगे जाकर कोई धर्मवैज्ञानिक निष्कर्ष नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और याजकीय प्रसंग के अनुकूल भाषा रखी गई है। ‘याजक’, ‘अभिषिक्त’ और ‘विधि’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं; वाक्यरचना को सामान्य पाठक के लिए सहज रखा गया है।
