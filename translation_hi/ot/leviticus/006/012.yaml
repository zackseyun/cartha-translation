  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/012.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: और यहोवा ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: वाव-क्रमिक के साथ דּבר यहाँ कथा में नई वाणी का सूत्र आरम्भ करता है। आधुनिक हिन्दी में ‘मूसा से कहा’ स्वाभाविक है; अगले לֵאמֹר का अलग से ‘यह कहते हुए’ अनुवाद अनावश्यक पुनरुक्ति पैदा करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: बोलने की क्रिया के साथ אֶל सम्बोधित व्यक्ति को चिह्नित करता है; हिन्दी में ‘मूसा से’ स्वाभाविक समतुल्य है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: यह इब्रानी का परंपरागत प्रत्यक्ष-वचन परिचय सूत्र है। हिन्दी में इसे मुख्य क्रिया ‘कहा’ और उसके बाद अल्पविराम द्वारा संक्षेप में व्यक्त करना सहज और अर्थनिष्ठ है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नाम-रूप है और ‘प्रभु’ जैसी उपाधि से मूल नाम को प्रतिस्थापित नहीं करता; ‘याहवे’ अधिक संभावित विद्वत्तापरक उच्चारण है, पर हिन्दी के सामान्य पाठकों में कम परिचित है।
translation_notes:
  register: वाक्य को आधुनिक, सहज और गरिमापूर्ण हिन्दी में रखा गया है। इब्रानी के दोहरे वाणी-सूत्र को यांत्रिक रूप से ‘बोला…यह कहते हुए’ न दोहराकर हिन्दी के स्वाभाविक ‘से कहा,’ में समाहित किया गया है।
