  yaml_path: translation/ot/leviticus/006/003.yaml
  text: And the priest shall put on his linen garment, and he shall put linen undergarments on his body, and he shall remove the ashes to which the fire has reduced the burnt offering on the altar, and he shall place them beside the altar.
translation:
  language: hi
  text: और याजक अपना सन का वस्त्र पहने और अपने शरीर पर सन का अधोवस्त्र पहने। फिर वह वेदी पर अग्नि से भस्म हुई होमबलि की राख[a] उठाकर उसे वेदी के पास रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “वह राख जिसे अग्नि होमबलि को भस्म करके छोड़ती है।” यह संक्षिप्त पदबंध राख को वेदी पर अग्नि द्वारा भस्म की गई होमबलि का अवशेष बताता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדּוֹ בַד
  choice: अपना सन का वस्त्र
  rationale: यह याजकीय परिधान है और בַד उसकी सामग्री, अर्थात सन, बताता है। केवल ‘वस्त्र’ कहना उसके आकार को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מִכְנְסֵי בַד
  choice: सन का अधोवस्त्र
  rationale: यह शरीर के निचले भाग पर सीधे पहना जाने वाला याजकीय वस्त्र है। ‘अधोवस्त्र’ आधुनिक हिन्दी में इसके कार्य को स्पष्ट और मर्यादित ढंग से व्यक्त करता है।
- source_word: עַל בְּשָׂרוֹ
  choice: अपने शरीर पर
  rationale: शाब्दिक अर्थ ‘अपने मांस पर’ है; हिन्दी में ‘अपने शरीर पर’ सीधे शरीर से लगे पहनने का स्वाभाविक बोध देता है।
- source_word: וְהֵרִים
  choice: उठाकर
  rationale: क्रिया का मूल अर्थ ‘उठाना’ है; प्रसंग में राख को वेदी से उठाकर हटाने की क्रिया निहित है।
- source_word: הַדֶּשֶׁן
  choice: राख
  rationale: बलि को अग्नि द्वारा भस्म किए जाने के बाद बचा अवशेष अभिप्रेत है।
- source_word: אֲשֶׁר תֹּאכַל הָאֵשׁ אֶת הָעֹלָה
  choice: अग्नि द्वारा भस्म की गई होमबलि की राख
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ असामान्य है; यह अनुवाद आग के ‘खा लेने’ को स्वाभाविक हिन्दी ‘भस्म करना’ से व्यक्त करता है, जबकि राख और होमबलि का संबंध बनाए रखता है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: עֹלָה के लिए ‘होमबलि’ हिन्दी बाइबलीय और बलिदानी संदर्भ में प्रचलित तथा स्पष्ट पद है।
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: वेदी के पास
  rationale: यह वेदी के बगल या निकट रखे जाने का संकेत देता है; ‘के पास’ सहज आधुनिक हिन्दी है।
