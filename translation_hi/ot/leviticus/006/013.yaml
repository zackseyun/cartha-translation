source:
  edition: WLC
  text: זֶ֡ה קָרְבַּן֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו אֲשֶׁר יַקְרִ֣יבוּ לַֽ/יהוָ֗ה בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ עֲשִׂירִ֨ת הָ/אֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣/הּ בַּ/בֹּ֔קֶר וּ/מַחֲצִיתָ֖/הּ בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/013.yaml
  text: 'This is the offering of Aaron and his sons[a], which they shall present to Yahweh on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half of it in the morning and half of it in the evening.'
translation:
  language: hi
  text: 'यह हारून और उसके पुत्रों का वह चढ़ावा है, जिसे वे यहोवा को उसके अभिषेक के दिन अर्पित करेंगे: एक एपा का दसवाँ भाग बारीक आटा, नियमित अन्नबलि के रूप में; उसका आधा सवेरे और आधा शाम को[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में ‘उसके अभिषेक के दिन’ में सर्वनाम एकवचन है, हालाँकि वचन में हारून और उसके पुत्रों दोनों का नाम है। वैकल्पिक अनुवाद: ‘उनके अभिषेक के दिन।’'
    reason: मूल पाठ के एकवचन सर्वनाम और बहुवचन संदर्भ के बीच की अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: קָרְבַּן
  choice: चढ़ावा
  rationale: यह बलिदान-संबंधी व्यापक शब्द है। ‘चढ़ावा’ आधुनिक हिन्दी में स्वाभाविक है और किसी एक विशिष्ट प्रकार की बलि तक अर्थ को सीमित नहीं करता।
- source_word: יַקְרִיבוּ
  choice: अर्पित करें
  rationale: हिफ़ील रूप का बलिदान-संदर्भ में अर्थ किसी वस्तु को यहोवा के सम्मुख प्रस्तुत या अर्पित करना है। ‘अर्पित करें’ विधिक भाव और धार्मिक संदर्भ दोनों को सहज रूप से व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: चार-अक्षरीय परमेश्वर-नाम יהוה को हिन्दी पाठकों के लिए परिचित रूप ‘यहोवा’ में प्रस्तुत किया गया है।
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: उस दिन ... जिस दिन उसका अभिषेक किया जाए
  rationale: यह काल-सूचक रचना है और इब्रानी के एकवचन कर्मवाचक सर्वनाम को ‘उसका’ के रूप में सुरक्षित रखती है।
- source_word: עֲשִׂירִת הָאֵפָה
  choice: एपा का दसवाँ भाग
  rationale: मूल माप की सटीकता बनाए रखने के लिए ‘एपा’ को लिप्यंतरित करके अनुपात स्पष्ट किया गया है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह अन्नबलि में प्रयुक्त बारीक, परिष्कृत आटे को दर्शाता है; आधुनिक हिन्दी में ‘मैदा’ इसका सहज और संक्षिप्त समतुल्य है।
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: लैव्यव्यवस्था के इस संदर्भ में यह अनाज अथवा आटे से चढ़ाई जाने वाली भेंट का तकनीकी बलिदानी शब्द है।
- source_word: תָּמִיד
  choice: नियमित
  rationale: यह निर्धारित रूप से बार-बार चढ़ाए जाने का भाव देता है। ‘नियमित’ अनवरत भौतिक क्रिया का अनावश्यक अर्थ दिए बिना इस नियमितता को व्यक्त करता है।
- source_word: מַחֲצִיתָהּ ... וּמַחֲצִיתָהּ
  choice: उसका आधा ... और आधा
  rationale: यह चढ़ावे के दो बराबर भागों को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּבֹּקֶר ... בָּעָרֶב
  choice: सवेरे ... शाम को
  rationale: दोनों काल-सूचक वाक्यांशों का यह सहज आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: ‘हारून और उसके पुत्रों’ के साथ अभिषिक्त व्यक्ति के लिए एकवचन सर्वनाम
  choice: मूल पाठ का एकवचन ‘उसका’ बनाए रखा गया है।
  alternative: भाव के आधार पर बहुवचन करके ‘जिस दिन उनका अभिषेक किया जाए’ पढ़ना।
  rationale: मसोरेटिक पाठ में सर्वनाम एकवचन है, जबकि कर्ता के रूप में हारून और उसके पुत्रों का उल्लेख है। अनुवाद इस तनाव को बहुवचन बनाकर चुपचाप दूर नहीं करता; पादटिप्पणी पाठक को व्याकरणिक स्थिति बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। बलिदान-विधि के तकनीकी पदों में ‘अन्नबलि’ और पारंपरिक माप ‘एपा’ बनाए गए हैं; वाक्य में मूल की विधिक औपचारिकता तथा सर्वनाम-संबंधी अस्पष्टता सुरक्षित है।
