  text: אֵ֗שׁ תָּמִ֛יד תּוּקַ֥ד עַל הַ/מִּזְבֵּ֖חַ לֹ֥א תִכְבֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/006.yaml
  text: A continual fire shall be kept burning on the altar[a]; it shall not go out.
translation:
  language: hi
  text: वेदी पर आग निरंतर जलती रखी जाए[a]; वह बुझने न पाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वेदी पर सदा आग जलती रहे; वह बुझाई न जाए।”
    reason: इब्रानी क्रियारूपों और תָּמִיד के वैकल्पिक, अधिक शाब्दिक निरूपण को सुरक्षित रखना।
lexical_decisions:
- source_word: אֵשׁ
  choice: आग
  rationale: यहाँ बलिदान-संबंधी वास्तविक आग का उल्लेख है; ‘आग’ सामान्य, सीधा और स्वाभाविक हिन्दी पर्याय है।
- source_word: תָּמִיד
  choice: निरंतर
  rationale: यह शब्द लगातार बने रहने का भाव व्यक्त करता है। ‘निरंतर’ आधुनिक हिन्दी में स्पष्ट है और आग के सतत रखरखाव को ठीक से दर्शाता है।
- source_word: תּוּקַד
  choice: जलती रखी जाए
  rationale: 'हौफल रूप कारणवाचक-कर्मवाच्य भाव रखता है: आग को जलते रहने दिया या रखा जाए। यह अनुवाद केवल ‘जले’ की अपेक्षा निर्धारित मानवीय रखरखाव को अधिक स्पष्टता से व्यक्त करता है।'
- source_word: עַל הַמִּזְבֵּחַ
  choice: वेदी पर
  rationale: स्थान-संबंधी अर्थ को स्वाभाविक हिन्दी पदक्रम में सीधे व्यक्त किया गया है; निश्चित संदर्भ के लिए ‘वेदी’ पर्याप्त है।
- source_word: לֹא תִכְבֶּה
  choice: वह बुझने न पाए
  rationale: क्रिया आग के बुझ जाने या बुझाए जाने—दोनों संदर्भों में प्रयुक्त हो सकती है। ‘बुझने न पाए’ निषेध और आवश्यक निगरानी को स्वाभाविक हिन्दी में व्यक्त करता है।
