source:
  edition: WLC
  text: כָּל זָכָ֞ר בִּ/בְנֵ֤י אַהֲרֹן֙ יֹֽאכֲלֶ֔/נָּה חָק עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם מֵ/אִשֵּׁ֖י יְהוָ֑ה כֹּ֛ל אֲשֶׁר יִגַּ֥ע בָּ/הֶ֖ם יִקְדָּֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/006/011.yaml
  text: Every male among the sons of Aaron may eat of it[a]. It is a permanent statute throughout your generations from the food offerings of Yahweh. Whatever touches them shall become holy.
translation:
  language: hi
  text: हारून के पुत्रों में से हर पुरुष उसे खा सकता है। याहवे के अग्नि-चढ़ावों में से यह तुम्हारी पीढ़ियों के लिए सदा की विधि है। जो कुछ उन्हें छुएगा, वह पवित्र हो जाएगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ उन्हें छुए, वह पवित्र हो जाएगा।” इब्रानी संपर्क के द्वारा पवित्र हो जाने का भाव दे सकती है; कुछ लोग इसे अधिक प्रतिबंधात्मक अर्थ में समझते हैं कि केवल पवित्र वस्तु या व्यक्ति ही उन्हें छू सकता है।
    reason: अंतिम क्रिया के परिणामी या प्रतिबंधात्मक अर्थ की वास्तविक व्याख्यात्मक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: כָּל זָכָר
  choice: हर पुरुष
  rationale: याजकीय पात्रता के संदर्भ में प्रत्येक पुरुष सदस्य को स्पष्ट रूप से व्यक्त करता है; यहाँ आयु की अपेक्षा पुरुष लिंग पर बल है।
- source_word: בִּבְנֵי אַהֲרֹן
  choice: हारून के पुत्रों में से
  rationale: मूल के पारिवारिक और याजकीय पदनाम को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: יֹאכֲלֶנָּה
  choice: उसे खा सकता है
  rationale: संदर्भित चढ़ावे को खाने की अधिकृत अनुमति और अधिकार व्यक्त करता है; विधिक प्रसंग में यह स्वाभाविक हिन्दी है।
- source_word: חָק עוֹלָם
  choice: सदा की विधि
  rationale: स्थायी और बाध्यकारी विधान का भाव सहज आधुनिक हिन्दी में देता है।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-दर-पीढ़ी के लिए
  rationale: आने वाली क्रमिक पीढ़ियों तक विधान के लागू रहने की वाचाई अभिव्यक्ति को स्पष्ट करता है।
- source_word: מֵאִשֵּׁי יְהוָה
  choice: याहवे के अग्नि-चढ़ावों में से
  rationale: אִשֶּׁה को लैव्यव्यवस्था की बलिदानी शब्दावली में आग पर अर्पित चढ़ावे के रूप में संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम को उपाधि से बदलने के बजाय नाम के प्रचलित लिप्यंतरण द्वारा प्रस्तुत करता है।
- source_word: כֹּל אֲשֶׁר יִגַּע בָּהֶם
  choice: जो कुछ उन्हें छुएगा
  rationale: इब्रानी की व्यापकता को बनाए रखता है और छूने वाले को केवल व्यक्ति या केवल वस्तु तक सीमित नहीं करता।
- source_word: יִקְדָּשׁ
  choice: पवित्र हो जाएगा
  rationale: संपर्क के फलस्वरूप पवित्र अवस्था प्राप्त होने के सामान्य अर्थ को व्यक्त करता है।
theological_decisions:
- issue: अंतिम उपवाक्य में पवित्रता के संचार का अर्थ
  choice: पवित्र चढ़ावों को छूने वाला व्यक्ति या पदार्थ पवित्र हो जाएगा।
  alternative: इसे इस प्रतिबंध के रूप में भी समझा गया है कि केवल पहले से पवित्र वस्तु या व्यक्ति ही उन्हें छू सकता है; अथवा संपर्क छूने वाले को पवित्रता से जुड़े दायित्वों के अधीन कर देता है।
  rationale: יִקְדָּשׁ का सरल परिणामी अर्थ ‘पवित्र हो जाएगा’ है। फिर भी टिप्पणी में प्रतिबंधात्मक समझ का उल्लेख करके मूल की धार्मिक और व्यावहारिक जटिलता को खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘विधि’, ‘अग्नि-चढ़ावा’ और ‘पवित्र’ जैसे पद याजकीय-विधिक प्रसंग को बनाए रखते हैं; वाक्यरचना अनावश्यक रूप से संस्कृतनिष्ठ नहीं है।
