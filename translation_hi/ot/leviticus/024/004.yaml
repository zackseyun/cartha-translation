  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַ֚ל הַ/מְּנֹרָ֣ה הַ/טְּהֹרָ֔ה יַעֲרֹ֖ךְ אֶת הַ/נֵּר֑וֹת לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/004.yaml
  text: On the pure lampstand he shall arrange the lamps before Yahweh continually[a].
translation:
  language: hi
  text: वह शुद्ध दीवट पर दीपकों को यहोवा के सामने निरन्तर व्यवस्थित रखे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל הַמְּנֹרָה הַטְּהֹרָה
  choice: शुद्ध दीवट पर
  rationale: עַל स्थान-संबंध में ‘पर’ है; מְנוֹרָה उपासना-स्थान के विशिष्ट दीपाधार को दर्शाता है, जिसके लिए स्वाभाविक और गरिमापूर्ण हिन्दी ‘दीवट’ है; הַטְּהֹרָה का याजकीय संदर्भ में अर्थ ‘शुद्ध’ है।
- source_word: יַעֲרֹךְ אֶת הַנֵּרוֹת
  choice: दीपकों को ... व्यवस्थित रखे
  rationale: ערך का अर्थ क्रम से लगाना या व्यवस्थित रखना है। ‘व्यवस्थित रखे’ यहाँ केवल एक बार सजाने के बजाय नियमित रूप से ठीक क्रम में रखने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; נֵרוֹת अलग-अलग दीपक हैं।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का सीधा उपासना-संबंधी अर्थ ‘के सामने/की उपस्थिति में’ है। יְהוָה को उसके व्यक्तिगत नाम के प्रचलित हिन्दी रूप ‘यहोवा’ से दिया गया है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: याजकीय संदर्भ में यह नियमित और सतत पालन को सूचित करता है; ‘निरन्तर’ मूल की संक्षिप्तता और अर्थ-व्याप्ति बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। हिन्दी बाइबल-पाठकों में पहचाने जाने वाले रूप ‘यहोवा’ से नाम और उपाधि का भेद सुरक्षित रहता है; ‘प्रभु’ करने से यह भेद मिट जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और उपासना-संदर्भ के अनुरूप गरिमापूर्ण रखी गई है। ‘दीवट’ धार्मिक वस्तु के रूप में स्पष्ट है; वाक्यक्रम हिन्दी की स्वाभाविकता के लिए ढाला गया है।
