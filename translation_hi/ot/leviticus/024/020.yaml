base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/020.yaml
  text: fracture for fracture[a], eye for eye, tooth for tooth; as he inflicts an injury on a person[b], so it shall be inflicted on him.
translation:
  language: hi
  text: भंग के बदले भंग, आँख के बदले आँख, दाँत के बदले दाँत; जैसी शारीरिक क्षति वह किसी मनुष्य[b] को पहुँचाए[a], वैसी ही उसे पहुँचाई जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: “जैसा दोष या विकृति वह किसी मनुष्य में उत्पन्न करे, वैसा ही उसमें उत्पन्न किया जाए।” हिब्रू में ‘दोष/क्षति देना’ मुहावरा प्रयुक्त हुआ है; इसलिए मुख्य पाठ में ‘शारीरिक क्षति पहुँचाना’ किया गया है।'
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में “मनुष्य में” है। इस विधिक प्रसंग में एकवचन ‘मनुष्य’ किसी भी मानव व्यक्ति के लिए प्रतिनिधिक रूप से प्रयुक्त है।
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁבֶר
  choice: हड्डी टूटना
  rationale: इस शारीरिक चोट और विधिक सूची के संदर्भ में संज्ञा का अर्थ टूटना या अस्थिभंग है। सामान्य पाठक के लिए ‘हड्डी टूटना’ आधुनिक और स्पष्ट है।
- source_word: תַּחַת
  choice: के बदले
  rationale: प्रतिशोध-समानता के इस विधिक सूत्र में यह समान प्रत्युत्तर या प्रतिफल व्यक्त करता है; ‘के बदले’ हिन्दी में स्वाभाविक है।
- source_word: עַיִן
  choice: आँख
  rationale: सीधा शारीरिक अंग-सूचक शब्द है और विधिक सूत्र में अक्षरशः रखा गया है।
- source_word: שֵׁן
  choice: दाँत
  rationale: सीधा शारीरिक अंग-सूचक शब्द है और विधिक सूत्र में अक्षरशः रखा गया है।
- source_word: כַּאֲשֶׁר
  choice: जैसा
  rationale: यह किए गए कार्य और उसके अनुरूप परिणाम के बीच तुलना स्थापित करता है।
- source_word: יִתֵּן מוּם
  choice: घाव पहुँचाए
  rationale: शाब्दिक रूप से ‘दोष/क्षति देना’ एक हिब्रू मुहावरा है। यहाँ ‘घाव पहुँचाना’ शारीरिक क्षति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, जबकि ‘दोष देना’ भ्रामक होता।
- source_word: אָדָם
  choice: मनुष्य
  rationale: इस विधिक प्रसंग में यह किसी मानव व्यक्ति के लिए प्रतिनिधिक एकवचन है; ‘मनुष्य’ अर्थ को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: כֵּן יִנָּתֶן בּוֹ
  choice: वैसा ही उसे भी पहुँचाया जाए
  rationale: निफ़अल रूप निष्क्रिय परिणाम व्यक्त करता है। ‘वैसा ही’ विधिक समरूपता बनाए रखता है और हिन्दी में कर्ता को अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: प्रतिशोध-समानता के सूत्र का स्वरूप
  choice: ठोस सूत्र—‘हड्डी टूटने के बदले हड्डी टूटना, आँख के बदले आँख, दाँत के बदले दाँत’—को बनाए रखा गया।
  alternative: इसे ‘चोट के बराबर मुआवज़ा’ जैसे अमूर्त विधान में बदलना।
  rationale: हिब्रू पाठ ठोस पारस्परिक सूत्र देता है। केवल आर्थिक क्षतिपूर्ति या अनिवार्य शारीरिक दंड निर्धारित करना व्याख्या का विषय है; अनुवाद में किसी एक को आरोपित नहीं किया गया।
- issue: מוּם का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘घाव’, और पादटिप्पणी में ‘शारीरिक दोष या विकृति’ की संभावना।
  alternative: केवल ‘दोष’ या केवल ‘विकृति’।
  rationale: शब्द शारीरिक दोष, क्षति या विकृति को सूचित कर सकता है। प्रसंग में ‘घाव’ सहज है, पर व्यापक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। प्रसिद्ध विधिक लय बनाए रखने के लिए ‘आँख के बदले आँख, दाँत के बदले दाँत’ रखा गया है। ‘अस्थिभंग’ की अपेक्षा ‘हड्डी टूटना’ अधिक सहज है।
