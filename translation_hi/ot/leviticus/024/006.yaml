base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/006.yaml
  text: And you shall place them in two rows[a], six in each row[b], on the pure table before Yahweh.
translation:
  language: hi
  text: तुम उन्हें दो पंक्तियों[a] में—हर पंक्ति में छह—याहवे के सामने शुद्ध मेज़[b] पर रखना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दो क्रमबद्ध व्यवस्थाओं’ अथवा ‘दो ढेरों’ में; इब्रानी शब्द रोटियों की व्यवस्थित व्यवस्था को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘साफ़ मेज़’; यहाँ ‘शुद्ध’ का अर्थ केवल भौतिक सफ़ाई नहीं, बल्कि अनुष्ठानिक शुद्धता भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: तुम ... रखना
  rationale: שׂוּם का अर्थ ‘रखना/स्थापित करना’ है। यहाँ विधि-संबंधी निर्देश जारी है; ‘तुम ... रखना’ आधुनिक हिन्दी में निर्देश का स्वाभाविक बल व्यक्त करता है और इब्रानी के द्वितीय पुरुष एकवचन को बनाए रखता है।
- source_word: אוֹתָם
  choice: उन्हें
  rationale: यह कर्मवाचक सर्वनाम पिछले पद की बारह रोटियों की ओर संकेत करता है।
- source_word: שְׁתַּיִם מַעֲרָכוֹת
  choice: दो पंक्तियों में
  rationale: מַעֲרָכָה किसी क्रमबद्ध सजावट या समूह को दर्शाता है। मेज़ पर रोटियाँ रखने के प्रसंग में ‘पंक्तियाँ’ स्वाभाविक है, जबकि ‘ढेर’ भी संभव है; इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שֵׁשׁ הַמַּעֲרָכֶת
  choice: हर पंक्ति में छह
  rationale: 'शाब्दिक रचना ‘छह, वह पंक्ति’ वितरणात्मक अर्थ देती है: दोनों में से प्रत्येक पंक्ति में छह रोटियाँ। हिन्दी में अर्थ स्पष्ट करने के लिए ‘हर’ जोड़ा गया है।'
- source_word: עַל הַשֻּׁלְחָן
  choice: मेज़ पर
  rationale: עַל का सामान्य स्थानीय अर्थ ‘पर’ है।
- source_word: הַטָּהֹר
  choice: शुद्ध
  rationale: पवित्रस्थान के प्रसंग में טָהוֹר केवल भौतिक सफ़ाई नहीं, अनुष्ठानिक शुद्धता भी व्यक्त करता है; ‘शुद्ध’ इस अर्थ को सुरक्षित रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने/की उपस्थिति में’ है। יְהוָה को उसके व्यक्तिगत वाचा-नाम के रूप में ‘याहवे’ लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और नाम तथा उपाधि के भेद को बनाए रखता है।
- issue: पवित्रस्थान के प्रसंग में הַטָּהֹר
  choice: शुद्ध मेज़
  alternative: साफ़ मेज़
  rationale: ‘शुद्ध’ अनुष्ठानिक शुद्धता की संभावना को बनाए रखता है और इसे केवल दिखाई देने वाली सफ़ाई तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और विधि-संबंधी गरिमा वाली रखी गई है। ‘तुम ... रखना’ एकवचन संबोधन और निर्देशात्मक स्वर को सहज हिन्दी में व्यक्त करता है। डैश से वितरणात्मक वाक्यांश ‘हर पंक्ति में छह’ स्पष्ट होता है।
