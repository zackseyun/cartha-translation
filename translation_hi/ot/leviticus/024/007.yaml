id: LEV.24.7
reference: Leviticus 24:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתַתָּ֥ עַל הַֽ/מַּעֲרֶ֖כֶת לְבֹנָ֣ה זַכָּ֑ה וְ/הָיְתָ֤ה לַ/לֶּ֨חֶם֙ לְ/אַזְכָּרָ֔ה אִשֶּׁ֖ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/007.yaml
  text: And you shall put pure frankincense on each row[a], and it shall be for the bread as a memorial portion[b], a food offering to Yahweh.
translation:
  language: hi
  text: और तुम हर पंक्ति पर शुद्ध लोबान रखना[a]। वह रोटी के लिए स्मरण-भाग होगा—याहवे के लिए आग में चढ़ाई जाने वाली भेंट[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्रमबद्ध सजावट पर”; इस प्रसंग में इसका संकेत रोटियों की व्यवस्थित पंक्तियों की ओर है।
    reason: lexical_alternative
  - marker: b
    text: इस इब्रानी बलिदानी पद का अनुवाद “याहवे के लिए भोजन-भेंट” भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: और तुम ... रखना
  rationale: निर्देशात्मक प्रसंग में वाव-संयुक्त पूर्ण क्रिया आज्ञा का भाव देती है। यह रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए एकवचन संबोधन के अनुकूल है।
- source_word: הַמַּעֲרֶכֶת
  choice: हर पंक्ति
  rationale: शब्द का मूल अर्थ क्रमबद्ध सजावट या विन्यास है; पिछले पद की दो पंक्तियों के संदर्भ में एकवचन सामूहिक रूप को वितरणात्मक अर्थ में लिया गया है।
- source_word: לְבֹנָה זַכָּה
  choice: शुद्ध लोबान
  rationale: लְבֹנָה सुगंधित राल लोबान है और זַכָּה उसकी शुद्धता को व्यक्त करता है।
- source_word: לְאַזְכָּרָה
  choice: स्मरण-भाग
  rationale: यह याजकीय बलिदानी पद पूरी भेंट का वह प्रतिनिधि भाग बताता है जो परमेश्वर के सामने स्मरण के लिए चढ़ाया जाता है; केवल ‘स्मारक’ कहने से अनुष्ठानिक कार्य स्पष्ट नहीं होता।
- source_word: אִשֶּׁה
  choice: आग में चढ़ाई जाने वाली भेंट
  rationale: पारंपरिक और प्रसंगानुकूल अर्थ को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘भोजन-भेंट’ की महत्वपूर्ण वैकल्पिक समझ पादटिप्पणी में रखी गई है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को लिप्यंतरित करके सुरक्षित रखा गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरीय वाचा-नाम सीधे आया है; ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: לְאַזְכָּרָה का बलिदानी आशय
  choice: स्मरण-भाग
  alternative: स्मरण के लिए; स्मारक-भेंट
  rationale: यह अनुवाद उस भाग की प्रतिनिधिक बलिदानी भूमिका बताता है, पर यह निर्धारित नहीं करता कि ‘स्मरण’ परमेश्वर की ओर से है या उपासक की ओर से; मूल की संभावित अर्थगत तनातनी बनी रहती है।
- issue: אִשֶּׁה की व्याख्या
  choice: आग में चढ़ाई जाने वाली भेंट
  alternative: भोजन-भेंट
  rationale: शब्द की पारंपरिक व्युत्पत्तिगत और अनुष्ठानिक समझ मुख्य पाठ में रखी गई है, जबकि वैकल्पिक ‘भोजन-भेंट’ अर्थ को पादटिप्पणी में देकर वास्तविक शाब्दिक अनिश्चितता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और अनुष्ठानिक निर्देश के अनुरूप रखी गई है। ‘तुम ... रखना’ सहज हिन्दी आज्ञार्थ है; ‘स्मरण-भाग’ तकनीकी अर्थ को संक्षेप में स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
