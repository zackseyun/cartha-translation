base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/019.yaml
  text: And if a man inflicts an injury on his fellow[a], just as he has done[b], so it shall be done to him.
translation:
  language: hi
  text: यदि कोई व्यक्ति अपने साथी को शारीरिक क्षति पहुँचाए[a], तो जैसा उसने किया है, वैसा ही उसके साथ किया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अपने साथी में दोष या विकलता उत्पन्न करे।” प्रसंग में इसका आशय शारीरिक चोट या क्षति पहुँचाना है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: और यदि कोई व्यक्ति
  rationale: विधिक प्रसंग में כִּי शर्त प्रस्तुत करता है। אִישׁ का आशय किसी व्यक्ति से है; आधुनिक हिन्दी में ‘कोई व्यक्ति’ स्वाभाविक है और मूल के एकवचन को बनाए रखता है।
- source_word: יִתֵּן מוּם
  choice: शारीरिक दोष पहुँचा दे
  rationale: शाब्दिक अर्थ ‘दोष/विकलता दे’ है। यहाँ מוּם सामान्य चोट से अधिक, शरीर में उत्पन्न दोष या क्षति को दर्शा सकता है; ‘शारीरिक दोष पहुँचा दे’ मूल बिंब और विधिक अर्थ दोनों को सुरक्षित रखता है।
- source_word: בַּעֲמִיתוֹ
  choice: अपने संगी को
  rationale: עָמִית समुदाय के सह-सदस्य, साथी या पड़ोसी को सूचित करता है। ‘संगी’ संक्षिप्त, गरिमापूर्ण और पारस्परिक सामुदायिक संबंध के निकट है।
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: जैसा उसने किया है
  rationale: तुलनात्मक वाक्यांश प्रतिफल की समानुपातिकता बताता है; पूर्ण पक्ष को हिन्दी में ‘किया है’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: כֵּן יֵעָשֶׂה לּוֹ
  choice: वैसा ही उसके साथ किया जाए
  rationale: निफ़अल रूप निष्क्रिय और विधिक है। ‘किया जाए’ न्यायिक विधान को व्यक्त करता है, बिना इसे निजी प्रतिशोध का आदेश बनाए।
theological_decisions:
- issue: समानुपातिक प्रतिफल का विधिक सूत्र
  choice: निष्क्रिय विधिक भाषा में ‘वैसा ही उसके साथ किया जाए’
  alternative: इसे निजी बदला लेने की प्रत्यक्ष आज्ञा के रूप में कहना
  rationale: मूल पाठ निष्क्रिय क्रिया का प्रयोग कर समानुपातिक न्याय का नियम देता है और कर्ता को निर्दिष्ट नहीं करता; इसलिए अनुवाद भी उस अस्पष्टता और न्यायिक स्वर को बनाए रखता है।
- issue: מוּם की अर्थ-सीमा
  choice: मुख्य पाठ में ‘शारीरिक दोष’, पादटिप्पणी में ‘चोट/क्षति’
  alternative: केवल ‘चोट’ या केवल ‘विकलता’
  rationale: מוּם शारीरिक दोष, विकृति या क्षति को दर्शाता है। प्रसंग चोट का है, पर मूल शब्द के ठोस ‘दोष’ भाव को खोना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण विधिक स्वर रखा गया है। ‘संगी’ समुदाय के सह-सदस्य के अर्थ को व्यक्त करता है; ‘उसके साथ किया जाए’ मूल की निष्क्रियता और कर्ता की अनिर्दिष्टता को बनाए रखता है।
