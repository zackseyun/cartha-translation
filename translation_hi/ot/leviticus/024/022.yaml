base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/022.yaml
  text: There shall be one standard of judgment for you, for the sojourner as for the native, for I am the LORD your God.
translation:
  language: hi
  text: तुम्हारे लिए न्याय का एक ही मानदंड होगा; परदेशी और देश में जन्मे व्यक्ति—दोनों के लिए वही होगा, क्योंकि मैं तुम्हारा परमेश्वर यहोवा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפָּט אֶחָד
  choice: न्याय का एक ही मानदंड
  rationale: यह पद केवल किसी एक निर्णय की नहीं, परदेशी और मूल निवासी पर समान रूप से लागू होने वाले न्यायिक मानदंड की बात करता है।
- source_word: גֵּר
  choice: परदेशी
  rationale: इस्राएलियों के बीच रहने वाले गैर-मूल निवासी के लिए स्वाभाविक और संदर्भानुकूल आधुनिक हिन्दी शब्द।
- source_word: אֶזְרָח
  choice: देश में जन्मा व्यक्ति
  rationale: गेर के विपरीत समुदाय के मूल निवासी को स्पष्ट करता है; केवल आधुनिक कानूनी अर्थ वाले ‘नागरिक’ से बचता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू के व्यक्तिगत ईश्वरीय नाम को सामान्य उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: परदेशी और मूल निवासी के लिए न्याय की समानता
  choice: ‘दोनों के लिए वही होगा’ द्वारा एक ही न्यायिक मानदंड का समान अनुप्रयोग स्पष्ट किया गया।
  alternative: ‘जैसा परदेशी के लिए, वैसा ही देश में जन्मे व्यक्ति के लिए’
  rationale: हिब्रू तुलना का आशय सुरक्षित रखते हुए हिन्दी में सहज और असंदिग्ध वाक्य बनाया गया।
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: व्यक्तिगत नाम का स्वरूप बनाए रखा गया; ‘प्रभु’ अनुवाद करने से नाम और उपाधि का भेद मिट सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘न्याय का एक ही मानदंड’ कानूनी संदर्भ को व्यक्त करता है, जबकि ‘देश में जन्मा व्यक्ति’ प्राचीन सामाजिक भेद को आधुनिक नागरिकता की अवधारणा में सीमित नहीं करता।
