base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/010.yaml
  text: The son of an Israelite woman[a], and he was the son of an Egyptian man, went out among the sons of Israel[b]; and in the camp the son of the Israelite woman and an Israelite man fought.
translation:
  language: hi
  text: एक इस्राएली स्त्री का बेटा, जिसका पिता मिस्री था, इस्राएल के पुत्रों के बीच[a] निकल गया। छावनी में उस इस्राएली स्त्री का बेटा और एक इस्राएली पुरुष आपस में लड़ पड़े[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों के बीच।” हिब्रू में शाब्दिक रूप से “इस्राएल के पुत्रों के बीच” है।
    reason: lexical_alternative
  - marker: b
    text: या, “झगड़ पड़े।” हिब्रू क्रिया विवाद या लड़ाई—दोनों का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकल आया
  rationale: यह יצא की कथात्मक गति को व्यक्त करता है, पर यह नहीं बताता कि वह ठीक कहाँ से निकला; हिन्दी में प्रसंगानुकूल और स्वाभाविक है।
- source_word: בֶּן אִשָּׁה יִשְׂרְאֵלִית
  choice: एक इस्राएली स्त्री का बेटा
  rationale: मातृ-पहचान को स्पष्ट रखते हुए हिन्दी में स्वाभाविक संरचना अपनाई गई है।
- source_word: וְהוּא בֶּן אִישׁ מִצְרִי
  choice: जिसका पिता मिस्री था
  rationale: हिब्रू के शाब्दिक ‘और वह एक मिस्री पुरुष का बेटा था’ का यही स्वाभाविक हिन्दी समतुल्य है; पितृ-पहचान स्पष्ट रहती है।
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के बीच
  rationale: בְּתוֹךְ को ‘के बीच’ और पारंपरिक सामुदायिक पद בְּנֵי יִשְׂרָאֵל को औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: וַיִּנָּצוּ
  choice: आपस में लड़ पड़े
  rationale: निफ़अल रूप परस्पर विवाद या लड़ाई को सूचित करता है। ‘लड़ पड़े’ प्रसंग की तीव्रता और आगामी घटना के अनुकूल है, जबकि ‘झगड़ पड़े’ को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: בַּמַּחֲנֶה
  choice: छावनी में
  rationale: यह इस्राएली समुदाय की छावनी को दर्शाने वाला सीधा और प्रचलित हिन्दी अनुवाद है।
- source_word: בֶּן הַיִּשְׂרְאֵלִית
  choice: उस इस्राएली स्त्री का बेटा
  rationale: हिब्रू में दोहराई गई पहचान को साहित्यिक बल और स्पष्टता के लिए दोहराया गया है।
- source_word: וְאִישׁ הַיִּשְׂרְאֵלִי
  choice: और एक इस्राएली पुरुष
  rationale: यह दूसरे व्यक्ति को इस्राएली पुरुष के रूप में पहचानता है और दोनों व्यक्तियों के बीच हिब्रू में उपस्थित विरोध को बनाए रखता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का लिंगयुक्त सामुदायिक पद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: यहाँ यह इस्राएल के लोगों के लिए स्थापित वाचायी/राष्ट्रीय पद है। मुख्य पाठ में स्रोत की औपचारिक अभिव्यक्ति रखी गई है और अधिक सहज सामुदायिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट हिन्दी। मातृ और पितृ पहचान को स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है; मूल की पुनरावृत्ति तथा विवाद की lexical ambiguity सुरक्षित रखी गई है।
