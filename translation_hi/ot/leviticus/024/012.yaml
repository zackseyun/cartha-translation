base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/012.yaml
  text: So they put him in custody[a], to clarify for them according to the word of Yahweh.
translation:
  language: hi
  text: तब उन्होंने उसे हिरासत में रखा, ताकि याहवे के वचन के अनुसार उन्हें बात स्पष्ट की जाए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें साफ़-साफ़ बताया जाए।” इब्रानी क्रिया का अर्थ किसी बात को स्पष्ट करना, समझाना, या साफ़-साफ़ घोषित करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחֻהוּ
  choice: तब उन्होंने उसे … रखा
  rationale: हिफ़ील रूप का अर्थ यहाँ ‘रखना’ है; ‘तब’ कथा के क्रम को स्वाभाविक हिन्दी में आगे बढ़ाता है।
- source_word: בַּמִּשְׁמָר
  choice: हिरासत में
  rationale: यह शब्द पहरे में रखे जाने या बंदी बनाए जाने को दर्शाता है; कानूनी प्रसंग में ‘हिरासत’ स्पष्ट और आधुनिक है।
- source_word: לִפְרֹשׁ
  choice: बात स्पष्ट की जा सके
  rationale: क्रिया का अर्थ किसी बात को स्पष्ट करना, समझाना या साफ-साफ घोषित करना हो सकता है। ‘बात’ प्रसंग के विषय को व्यक्त करती है, पर ‘निर्णय’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं करती।
- source_word: לָהֶם
  choice: उनके लिए
  rationale: इब्रानी संबंध को निकटता से रखता है और यह खुला छोड़ता है कि बात उनके लाभ के लिए स्पष्ट होनी थी या उन्हें बताई जानी थी।
- source_word: עַל־פִּי
  choice: के वचन के अनुसार
  rationale: शाब्दिक मुहावरा ‘के मुख के अनुसार’ किसी प्रामाणिक कथन या आदेश के अनुरूप होने का अर्थ देता है; ‘वचन के अनुसार’ उसकी वाचिक और प्रामाणिक दोनों छटाएँ बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: स्पष्ट की जाने वाली बात की पहचान
  choice: बात स्पष्ट की जा सके
  alternative: निर्णय स्पष्ट किया जा सके
  rationale: मूल पाठ में ‘निर्णय’ जैसा कोई स्पष्ट संज्ञा-पद नहीं है। न्यायिक प्रसंग निर्णय की ओर संकेत कर सकता है, पर मुख्य पाठ उस निहितार्थ को अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हिरासत’ कानूनी प्रसंग के अनुकूल है; निष्क्रिय रचना इब्रानी infinitive में कर्ता के अनिर्दिष्ट रहने को सुरक्षित रखती है।
