  text: הוֹצֵ֣א אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וְ/סָמְכ֧וּ כָֽל הַ/שֹּׁמְעִ֛ים אֶת יְדֵי/הֶ֖ם עַל רֹאשׁ֑/וֹ וְ/רָגְמ֥וּ אֹת֖/וֹ כָּל הָ/עֵדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/014.yaml
  text: Bring the one who cursed outside the camp[a], and let all who heard lay their hands on his head[b], and let all the congregation stone him.
translation:
  language: hi
  text: “शाप देनेवाले को छावनी के बाहर ले जाओ।[a] जिन सब ने सुना है, वे अपने हाथ उसके सिर पर रखें,[b] और सारी सभा उसे पत्थरों से मार डाले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की निन्दा करनेवाले को।” इब्रानी में शाब्दिक अर्थ “शाप देनेवाले को” है।
    reason: alternative_reading
  - marker: b
    text: यहाँ हाथ रखना सम्भवतः साक्षियों द्वारा अपराधी की औपचारिक पहचान को दर्शाता है; कुछ लोग इसमें प्रतीकात्मक अर्थ भी देखते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: הוֹצֵא
  choice: बाहर ले जाओ
  rationale: हिफ़ील आज्ञार्थक रूप का अर्थ किसी को बाहर ले जाना है; गंतव्य-वाक्यांश के साथ यह स्वाभाविक हिन्दी है।
- source_word: הַמְקַלֵּל
  choice: शाप देनेवाले
  rationale: קלל के कृदन्त रूप का सीधा अर्थ सुरक्षित रखा गया है; मुख्य पाठ में अधिक व्याख्यात्मक ‘परमेश्वर की निन्दा करनेवाले’ को नहीं रखा गया।
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह स्थान-सूचक अभिव्यक्ति सामुदायिक छावनी से बाहर ले जाने का अर्थ स्पष्ट और स्वाभाविक ढंग से देती है।
- source_word: וְסָמְכוּ
  choice: अपने हाथ ... पर रखें
  rationale: सिर पर हाथ रखने की मूल क्रिया को बिना उसके प्रतीकात्मक अर्थ का निर्णय किए अक्षुण्ण रखा गया है।
- source_word: כָל הַשֹּׁמְעִים
  choice: जितनों ने उसे सुना है, वे सब
  rationale: कृदन्त उन सभी सुननेवालों/साक्षियों को सूचित करता है। हिन्दी में ‘उसे’ प्रसंगगत कर्म को स्पष्ट करता है, यद्यपि इब्रानी में कर्म व्यक्त नहीं है।
- source_word: וְרָגְמוּ אֹתוֹ
  choice: उसे पत्थरों से मार डाले
  rationale: רגם यहाँ पत्थर मारकर मृत्युदण्ड देने की क्रिया है; यह हिन्दी में अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: כָל הָעֵדָה
  choice: सारी सभा
  rationale: עֵדָה वाचा-समुदाय की संगठित सभा को दर्शाता है; ‘सारी सभा’ औपचारिक सामुदायिक अर्थ को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: अपराधी को ‘शाप देनेवाला’ कहा जाए या ‘परमेश्वर की निन्दा करनेवाला’
  choice: शाप देनेवाला
  alternative: परमेश्वर की निन्दा करनेवाला
  rationale: मूल पद קלל के कृदन्त का सीधा अर्थ ‘शाप देनेवाला’ है। व्यापक प्रसंग में अपराध परमेश्वर के नाम से संबंधित है, पर उस व्याख्या को मुख्य पाठ में अनिवार्य नहीं बनाया गया।
- issue: सिर पर हाथ रखने का अर्थ
  choice: मुख्य पाठ में केवल क्रिया का वर्णन
  alternative: इसे साक्षियों द्वारा औपचारिक पहचान या दोष के प्रतीकात्मक हस्तांतरण के रूप में स्पष्ट करना
  rationale: पद स्वयं इस क्रिया का अर्थ नहीं समझाता; इसलिए किसी एक धार्मिक व्याख्या को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आज्ञाओं की क्रमिकता के लिए ‘ले जाओ’, ‘रखें’ और ‘मार डाले’ का प्रयोग किया गया है।
