  text: וְ/אִ֕ישׁ כִּ֥י יַכֶּ֖ה כָּל נֶ֣פֶשׁ אָדָ֑ם מ֖וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/017.yaml
  text: And if a man strikes down any human being[b][a], he shall surely be put to death.
translation:
  language: hi
  text: और यदि कोई पुरुष किसी मनुष्य को मार डाले[a], तो उसे निश्चय ही मार डाला जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का शाब्दिक अर्थ ‘मारना’ या ‘प्रहार करना’ है; यहाँ दंड-विधान के संदर्भ में उसका अर्थ प्राणघातक मारना है। इब्रानी पद का अर्थ किसी मानव-व्यक्ति या मानव-जीवन से है, देह से पृथक अमूर्त ‘आत्मा’ से नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: और यदि कोई पुरुष
  rationale: וְ पिछले विधान से संबंध जोड़ता है, כִּי यहाँ शर्त प्रकट करता है, और אִישׁ के स्पष्ट पुल्लिंग एकवचन को ‘पुरुष’ के रूप में रखा गया है।
- source_word: יַכֶּה
  choice: ऐसा मारे कि वह मर जाए
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ है, किंतु इस प्रसंग में प्रहार घातक है। यह रूप क्रिया की ठोस छवि और उसके प्राणघातक परिणाम दोनों को स्पष्ट करता है।
- source_word: כָּל נֶפֶשׁ אָדָם
  choice: किसी मनुष्य को
  rationale: नֶפֶשׁ אָדָם यहाँ किसी मानव-व्यक्ति अथवा मानव-जीवन को सूचित करता है, किसी अमूर्त ‘आत्मा’ को नहीं। स्वाभाविक हिन्दी में ‘किसी मनुष्य को’ इसी आशय को व्यक्त करता है।
- source_word: מוֹת יוּמָת
  choice: वह निश्चय ही मार डाला जाए
  rationale: क्रिया-मूल के infinitive absolute और निष्क्रिय imperfect का मेल दंड की निश्चितता पर बल देता है। ‘निश्चय ही’ उस बल को और निष्क्रिय रचना इब्रानी कानूनी सूत्र को बनाए रखती है।
theological_decisions:
- issue: כָּל נֶפֶשׁ אָדָם का मानवशास्त्रीय अर्थ
  choice: किसी मनुष्य को
  alternative: किसी मनुष्य के प्राण को / किसी आत्मा को
  rationale: यह पद पूरे जीवित मानव-व्यक्ति का द्योतक है; इसे केवल देह से पृथक अमूर्त आत्मा के अर्थ में लेना अनुचित होगा।
- issue: אִישׁ का व्याकरणिक लिंग
  choice: कोई पुरुष
  alternative: जो कोई / कोई व्यक्ति
  rationale: मूल पाठ के पुल्लिंग एकवचन को मुख्य पाठ में सुरक्षित रखा गया है, यद्यपि विधान का कानूनी सिद्धांत प्रतिनिधिक रूप से व्यापक समझा जा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी स्वर वाली रखी गई है। ‘ऐसा मारे कि वह मर जाए’ घातक प्रहार का अर्थ स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि ‘निश्चय ही मार डाला जाए’ मूल के बलयुक्त निष्क्रिय दंड-सूत्र को सुरक्षित रखता है।
