source:
  edition: WLC
  text: וּ/מַכֵּ֥ה בְהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה וּ/מַכֵּ֥ה אָדָ֖ם יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/021.yaml
  text: And whoever strikes down an animal shall make restitution for it[a], but whoever strikes down a man shall be put to death.
translation:
  language: hi
  text: और जो कोई किसी पशु को मार डाले, वह उसकी भरपाई करे; पर जो कोई किसी मनुष्य को मार डाले, उसे मृत्युदंड दिया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַכֵּה
  choice: जो कोई ... मार डाले
  rationale: नכה का हिफ़ील कृदंत यहाँ प्राणघातक प्रहार को दर्शाता है, जैसा पशु के लिए भरपाई और मनुष्य के लिए मृत्युदंड के समानांतर परिणामों से स्पष्ट है। यह रूप हिन्दी में सामान्य विधिक शर्त के रूप में स्वाभाविक है।
- source_word: בְהֵמָה
  choice: पशु
  rationale: यह पालतू पशु अथवा चौपाए के लिए व्यापक शब्द है। ‘पशु’ आधुनिक हिन्दी में स्पष्ट है और ‘मवेशी’ की अपेक्षा अनावश्यक रूप से संकीर्ण नहीं है।
- source_word: יְשַׁלְּמֶנָּה
  choice: उसकी भरपाई करे
  rationale: שלם के पिएल रूप का अर्थ क्षतिपूर्ति करना है; स्त्रीलिंग प्रत्यय בְהֵמָה की ओर लौटता है। ‘उसकी भरपाई करे’ आर्थिक/विधिक प्रतिपूर्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: पशु के साथ विरोध में यह किसी एक मानव व्यक्ति को सूचित करता है। हिन्दी में ‘मनुष्य’ स्रोत के व्यापक मानवीय अर्थ और प्रतिनिधिक विधिक प्रयोग—दोनों को स्वाभाविक रूप से रखता है; ‘पुरुष’ अनावश्यक रूप से केवल नर मानव का अर्थ दे सकता है।
- source_word: יוּמָת
  choice: उसे मृत्युदंड दिया जाए
  rationale: होफ़ाल रूप कारक-कर्मवाच्य है और न्यायिक रूप से मृत्यु दिए जाने का संकेत करता है। ‘मृत्युदंड दिया जाए’ हिन्दी में विधिक निष्क्रियता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: विधिक संदर्भ में אָדָם का अनुवाद
  choice: मनुष्य
  alternative: आदमी / पुरुष
  rationale: אָדָם यहाँ मानव जाति को सामूहिक रूप से नहीं, पशु के विपरीत किसी मानव व्यक्ति को दर्शाता है। ‘मनुष्य’ हिन्दी में लिंग-विशेष थोपे बिना स्रोत का प्रतिनिधिक एकवचन अर्थ बनाए रखता है।
- issue: מַכֵּה की प्राणघातकता
  choice: मार डाले
  alternative: प्रहार करे
  rationale: अगले परिणाम—पशु के लिए भरपाई और मनुष्य के लिए मृत्युदंड—दिखाते हैं कि यहाँ प्रहार घातक है। केवल ‘प्रहार करे’ आशय को अस्पष्ट छोड़कर गैर-प्राणघातक चोट का अर्थ दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण विधिक शैली। ‘जो कोई’ सामान्य मामले का भाव रखता है; ‘भरपाई’ सामान्य पाठक के लिए सुबोध है, जबकि ‘मृत्युदंड दिया जाए’ न्यायिक कर्मवाच्य को बनाए रखता है।
