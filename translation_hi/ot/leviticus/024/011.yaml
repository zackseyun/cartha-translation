source:
  edition: WLC
  text: וַ֠/יִּקֹּב בֶּן הָֽ/אִשָּׁ֨ה הַ/יִּשְׂרְאֵלִ֤ית אֶת הַ/שֵּׁם֙ וַ/יְקַלֵּ֔ל וַ/יָּבִ֥יאוּ אֹת֖/וֹ אֶל מֹשֶׁ֑ה וְ/שֵׁ֥ם אִמּ֛/וֹ שְׁלֹמִ֥ית בַּת דִּבְרִ֖י לְ/מַטֵּה דָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/011.yaml
  text: The son of the Israelite woman blasphemed the Name and cursed[a], and they brought him to Moses. Now his mother's name was Shelomith daughter of Dibri, of the tribe of Dan.
translation:
  language: hi
  text: इस्राएली स्त्री के बेटे ने उस नाम का स्पष्ट उच्चारण किया और शाप दिया[a]; तब वे उसे मूसा के पास ले आए। उसकी माँ का नाम शलोमीत था; वह दिब्री की बेटी और दान के गोत्र की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस नाम की निन्दा की और शाप दिया।” यहाँ प्रयुक्त इब्रानी क्रिया का अर्थ “स्पष्ट रूप से उच्चारण करना” हो सकता है, पर इस प्रसंग में इसे निन्दा करने के अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקֹּב
  choice: स्पष्ट उच्चारण किया
  rationale: נקב का मूल अर्थ छेदने से विकसित होकर स्पष्ट रूप से बताने या उच्चारित करने तक जाता है। אֶת־הַשֵּׁם और इसके बाद अलग क्रिया וַיְקַלֵּל होने के कारण यहाँ नाम को स्पष्ट रूप से उच्चारित करना उपयुक्त है; संदर्भ में निन्दा का अर्थ संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: אֶת הַשֵּׁם
  choice: उस नाम
  rationale: निश्चित उपपद सहित 'नाम' इस प्रसंग में परमेश्वर के विशिष्ट नाम का आदरपूर्ण संकेत है। हिन्दी में 'उस नाम' इस विशिष्टता को स्वाभाविक ढंग से दिखाता है, बिना मूल पाठ में चतुरक्षरी नाम जोड़े।
- source_word: וַיְקַלֵּל
  choice: और शाप दिया
  rationale: पिएल रूप में קלל सामान्यतः शाप देने को व्यक्त करता है। इसे अलग क्रिया के रूप में रखना मूल की दो क्रियाओं को एक अर्थ में मिलाने से बचाता है।
- source_word: בֶּן הָאִשָּׁה הַיִּשְׂרְאֵלִית
  choice: इस्राएली स्त्री के बेटे
  rationale: यह संबंधसूचक पदबंध का सीधा, स्वाभाविक हिन्दी रूप है और पिछले प्रसंग से पहचानी गई स्त्री को सूचित करता है।
- source_word: וַיָּבִיאוּ אֹתוֹ אֶל מֹשֶׁה
  choice: तब वे उसे मूसा के पास ले आए
  rationale: मूल में कर्ता अनिर्दिष्ट बहुवचन है। 'वे' उसी अनिर्दिष्ट बहुवचन को बनाए रखता है; 'तब' कथानक-क्रम को स्वाभाविक बनाता है।
- source_word: שְׁלֹמִית בַּת דִּבְרִי
  choice: शलोमीत ... दिब्री की बेटी
  rationale: व्यक्तिनामों का हिन्दी लिप्यंतरण किया गया है और पुत्री-संबंध को स्पष्ट हिन्दी वाक्य-विन्यास में रखा गया है।
- source_word: לְמַטֵּה דָן
  choice: दान के गोत्र की
  rationale: यह मुहावरा गोत्रीय संबद्धता बताता है; चुना गया रूप संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: נקב का अर्थ जब उसका कर्म 'नाम' हो
  choice: उस नाम का स्पष्ट उच्चारण किया
  alternative: उस नाम की निन्दा की
  rationale: मूल में נקב और קלל दो अलग क्रियाएँ हैं। चुना गया पाठ दोनों को अलग रखता है और नाम उच्चारित करने तथा शाप देने के क्रम को सुरक्षित रखता है। फिर भी प्रसंग में पहली क्रिया को निन्दा समझना संभव है, इसलिए वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कथात्मक शैली रखी गई है। 'उस नाम' आदरपूर्ण विशिष्टता दिखाता है, जबकि पादटिप्पणी मूल इब्रानी की वास्तविक अर्थगत अस्पष्टता सुरक्षित रखती है।
