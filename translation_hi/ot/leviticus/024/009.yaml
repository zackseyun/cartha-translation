base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/009.yaml
  text: It shall belong to Aaron and to his sons[a], and they shall eat it in a holy place, because it is most holy to him from the food offerings of Yahweh, a permanent statute.
translation:
  language: hi
  text: यह हारून और उसके पुत्रों का होगा, और वे इसे एक पवित्र स्थान में खाएँगे, क्योंकि याहवे के अग्नि-चढ़ावों में से यह हारून के लिए परमपवित्र है। यह एक स्थायी विधि है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיְתָה לְאַהֲרֹן וּלְבָנָיו
  choice: यह हारून और उसके पुत्रों का होगा
  rationale: היה के साथ לְ यहाँ अस्तित्व नहीं, बल्कि अधिकार अथवा नियत भाग का भाव देता है। ‘का होगा’ इस कानूनी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַאֲכָלֻהוּ
  choice: और वे इसे ... खाएँगे
  rationale: यह रूप विधिक निर्देश को आगे बढ़ाता है। हिन्दी का सामान्य भविष्यकाल प्रसंग में आदेशात्मक दायित्व को सहज रूप से व्यक्त करता है।
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: किसी पवित्र स्थान में
  rationale: इब्रानी में निश्चित उपपद नहीं है; इसलिए इसे किसी एक निर्दिष्ट ‘पवित्रस्थान’ तक सीमित नहीं किया गया।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र
  rationale: यह इब्रानी की अतिशयोक्तिपरक रचना है, जिसका अर्थ पवित्रता की सर्वोच्च कोटि है; ‘परमपवित्र’ संक्षिप्त और प्रचलित हिन्दी है।
- source_word: מֵאִשֵּׁי יְהוָה
  choice: याहवे को आग में चढ़ाए जानेवाले चढ़ावों में से
  rationale: אִשֶּׁה बलिदान के रूप में आग द्वारा अर्पित वस्तुओं को सूचित करता है। मुख्य पाठ में इस पारंपरिक अग्नि-संबंधी अर्थ को स्पष्ट रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: חָק עוֹלָם
  choice: सदा की विधि
  rationale: यह पद स्थायी और निरंतर लागू रहने वाले विधान को व्यक्त करता है; यह हिन्दी में गरिमापूर्ण और सहज है।
theological_decisions:
- issue: हारून और उसके पुत्रों के बहुवचन प्रसंग में एकवचन לֹו का संदर्भ
  choice: ‘उसके लिए’ के रूप में एकवचन बनाए रखा गया
  alternative: बहुवचन के अनुसार ‘उनके लिए’ करना
  rationale: मूल पाठ एकवचन है और संभवतः हारून को याजकीय वंश के प्रतिनिधि के रूप में रखता है। एकवचन बनाए रखने से व्याकरणिक तनाव को चुपचाप समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है। ‘पुत्रों’ से पुरुष याजकीय वंश का मूल संदर्भ सुरक्षित रहता है। ‘किसी पवित्र स्थान’ मूल पाठ की अनिश्चितता बनाए रखता है और उसे स्वतः मन्दिर के किसी विशिष्ट कक्ष के रूप में नहीं ठहराता।
