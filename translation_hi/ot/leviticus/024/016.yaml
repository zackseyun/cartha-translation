id: LEV.24.16
reference: Leviticus 24:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נֹקֵ֤ב שֵׁם יְהוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ ב֖/וֹ כָּל הָ/עֵדָ֑ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח בְּ/נָקְב/וֹ שֵׁ֖ם יוּמָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/016.yaml
  text: Whoever blasphemes the name of Yahweh shall surely be put to death[a]; all the congregation shall certainly stone him[b]. The sojourner as well as the native-born—when he blasphemes the Name—shall be put to death.
translation:
  language: hi
  text: जो कोई यहोवा के नाम की निंदा करे, वह निश्चय ही मार डाला जाए[a]; सारी मण्डली उसे निश्चय ही पत्थरों से मार डाले। परदेशी हो या देश में जन्मा हुआ, जब वह उस नाम[b] की निंदा करे, तो वह मार डाला जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा के नाम का स्पष्ट उच्चारण करे,” अथवा “यहोवा के नाम को शाप दे।” इस प्रसंग में इब्रानी क्रिया का अर्थ किसी नाम को स्पष्ट रूप से बोलना या उसकी निंदा करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ केवल “नाम” है, जो श्रद्धापूर्वक ईश्वर के नाम के स्थान पर प्रयुक्त हुआ है।
    reason: cultural_note
lexical_decisions:
- source_word: וְנֹקֵב / בְּנָקְבוֹ
  choice: निन्दा करे
  rationale: נקב का मूल अर्थ स्पष्ट रूप से उच्चारण या नाम लेने से जुड़ सकता है, और इस प्रयोग पर मतभेद है; किन्तु इस दण्ड-विधान के प्रसंग में ईश-नाम का अपमानजनक प्रयोग अभिप्रेत जान पड़ता है। ‘निन्दा’ आधुनिक हिन्दी में उस अपराध को स्वाभाविक ढंग से व्यक्त करती है; अन्य सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: שֵׁם יְהוָה
  choice: यहोवा के नाम
  rationale: שֵׁם का सीधा अर्थ ‘नाम’ है और יְהוָה को व्यक्तिगत वाचा-नाम के रूप में ‘यहोवा’ लिखा गया है।
- source_word: מוֹת יוּמָת
  choice: निश्चय ही मार डाला जाए
  rationale: अनन्त क्रिया और सीमित क्रिया का संयोजन दण्ड की निश्चितता और विधिक अनिवार्यता पर बल देता है; कर्मवाच्य भी सुरक्षित रखा गया है।
- source_word: רָגוֹם יִרְגְּמוּ בוֹ
  choice: निश्चय ही उसे पत्थरवाह करे
  rationale: दोहराई हुई क्रियारचना के बल को ‘निश्चय ही’ से व्यक्त किया गया है और בוֹ के कर्मभाव को ‘उसे’ में समाहित किया गया है।
- source_word: כָּל הָעֵדָה
  choice: सारी मण्डली
  rationale: עֵדָה यहाँ एकत्रित वाचा-समुदाय को दर्शाता है; ‘मण्डली’ हिन्दी बाइबलीय और विधिक प्रसंग में सुबोध है।
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: परदेशी हो या देश में जन्मा हुआ
  rationale: גֵּר समुदाय के बीच रहने वाले गैर-मूल निवासी को और אֶזְרָח मूल निवासी को दर्शाता है। यह रूप दोनों वर्गों पर समान विधान को साफ करता है।
- source_word: בְּנָקְבוֹ שֵׁם
  choice: जब वह उस नाम की निन्दा करे
  rationale: בְּ + infinitive construct को कालगत ‘जब’ से व्यक्त किया गया है। שֵׁם के स्वतंत्र प्रयोग को ‘उस नाम’ कहा गया है, जिससे यहोवा के नाम की ओर संकेत स्पष्ट रहते हुए उसका श्रद्धासूचक स्थानापन्न प्रयोग भी बना रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। हिन्दी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को चुना गया है; इसे केवल उपाधि ‘प्रभु’ से बदलने पर मूल का व्यक्तिगत नाम छिप जाता।
- issue: ईश्वरीय नाम के साथ נקב का अर्थ
  choice: निन्दा करे
  alternative: नाम का स्पष्ट उच्चारण करे / नाम को शाप दे
  rationale: प्रसंग अपमानजनक या ईशनिन्दात्मक प्रयोग की ओर संकेत करता है, पर क्रिया का शब्दार्थ विवादित है। मुख्य पाठ में स्वाभाविक प्रसंगगत अर्थ रखा गया और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित की गई है।
- issue: परदेशी और मूल निवासी पर समान दण्ड
  choice: दोनों पर एक ही विधिक दण्ड लागू
  alternative: कोई नहीं
  rationale: כַּגֵּר כָּאֶזְרָח स्पष्ट रूप से सामाजिक स्थिति की परवाह किए बिना समान उत्तरदायित्व बताता है; पाठ में ‘हो या’ से यह समानता व्यक्त की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण विधिक रजिस्टर अपनाया गया है। ‘निश्चय ही’ मूल की बलवाचक रचना को व्यक्त करता है। पादटिप्पणी चिह्न मुख्य पाठ में सम्बद्ध दावों के ठीक बाद रखे गए हैं।
