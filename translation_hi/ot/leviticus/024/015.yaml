  text: וְ/אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵ/אמֹ֑ר אִ֥ישׁ אִ֛ישׁ כִּֽי יְקַלֵּ֥ל אֱלֹהָ֖י/ו וְ/נָשָׂ֥א חֶטְאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/015.yaml
  text: And you shall speak to the sons of Israel, saying, ‘If any man curses his God, then he shall bear his sin.
translation:
  language: hi
  text: और इस्राएल के पुत्रों[a] से यह कहो, ‘यदि कोई पुरुष[b] अपने परमेश्वर को शाप दे, तो वह अपने पाप का भार उठाएगा[c]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘इस्राएल के पुत्रों’। यह वाक्यांश सामूहिक रूप से इस्राएल की प्रजा को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: 'या ‘जो कोई’। हिब्रू में वितरणात्मक बल के लिए ‘पुरुष’ शब्द दोहराया गया है: ‘पुरुष, पुरुष’।'
    reason: lexical_alternative
  - marker: c
    text: ‘अपने पाप का भार उठाना’ हिब्रू मुहावरा है, जिसका अर्थ उस अपराध का दोष या उत्तरदायित्व अपने ऊपर लेना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: और इस्राएल के पुत्रों से
  rationale: संयोजक और संबोधन को बनाए रखते हुए בְּנֵי יִשְׂרָאֵל का शाब्दिक पारिवारिक रूप रखा गया है; यह सामूहिक रूप से इस्राएल की प्रजा को सूचित करता है।
- source_word: תְּדַבֵּר לֵ/אמֹר
  choice: कहना
  rationale: मूसा को दिया गया निर्देश आधुनिक हिन्दी में स्वाभाविक विधिसूचक शैली से व्यक्त होता है; अलग से ‘बोलकर यह कहना’ कहना अनावश्यक रूप से भारी होता।
- source_word: אִישׁ אִישׁ
  choice: कोई पुरुष
  rationale: दोहराया हुआ אִישׁ वितरणात्मक बल देता है—किसी भी पुरुष की बात। हिन्दी में ‘कोई पुरुष’ उस बल और पुल्लिंग एकवचन दोनों को स्वाभाविक रूप से रखता है।
- source_word: כִּי יְקַלֵּל
  choice: यदि ... शाप दे
  rationale: कानूनी प्रसंग में כִּי शर्त प्रस्तुत करता है। קלל के पिएल रूप का सीधा अर्थ ‘शाप देना’ है; ‘परमेश्वर की निन्दा करना’ इस पद में अधिक व्याख्यात्मक होता।
- source_word: אֱלֹהָיו
  choice: अपने परमेश्वर
  rationale: तीसरे पुरुष के स्वत्वसूचक रूप को हिन्दी की आत्मवाचक रचना से स्पष्ट किया गया है। मूल में न तो यहोवा नाम है, न स्वत्वसूचकता अनुपस्थित है।
- source_word: וְ/נָשָׂא חֶטְאוֹ
  choice: तो वह अपने पाप का भार उठाएगा
  rationale: संयोजक को शर्त के परिणाम के रूप में ‘तो’ से व्यक्त किया गया है और हिब्रू मुहावरे की ‘भार उठाने’ वाली छवि को सुरक्षित रखा गया है।
theological_decisions:
- issue: אֱלֹהָיו का दायरा
  choice: अपने परमेश्वर
  alternative: यहोवा; परमेश्वर
  rationale: हिब्रू में स्वत्वसूचक ‘उसका/अपना’ है और इस पद में यहोवा नाम नहीं है। इस शब्दावली को बनाए रखना अगले पद के अधिक विशिष्ट अपराध से इस पद के संबंध को पहले से तय नहीं करता।
- issue: कानूनी कर्ता का लिंग
  choice: कोई पुरुष
  alternative: जो कोई; कोई भी व्यक्ति
  rationale: मूल में אִישׁ दो बार, पुल्लिंग एकवचन में, वितरणात्मक ढंग से आया है। अनुवाद उसके व्याकरणिक रूप और व्यापक लागू होने के बल दोनों को बनाए रखता है।
- issue: ‘पाप का भार उठाना’ का अर्थ
  choice: मुहावरे को मुख्य पाठ में बनाए रखा
  alternative: अपने अपराध का दोषी ठहरेगा; अपने पाप का दण्ड भोगेगा
  rationale: मुहावरा दोष अथवा उत्तरदायित्व वहन करने का संकेत देता है, पर केवल दण्ड भोगने तक अर्थ को सीमित करना मूल से अधिक स्पष्टिकरण होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण कानूनी-विधिसूचक हिन्दी में रखी गई है। ‘कहना’ मूसा को संबोधित एकवचन निर्देश है; ‘शाप दे’ और ‘अपने पाप का भार उठाएगा’ मूल की शब्दावली तथा उसकी अर्थगत खुली बनावट को सुरक्षित रखते हैं।
