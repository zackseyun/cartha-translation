source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁה֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/יּוֹצִ֣יאוּ אֶת הַֽ/מְקַלֵּ֗ל אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֖/וֹ אָ֑בֶן וּ/בְנֵֽי יִשְׂרָאֵ֣ל עָשׂ֔וּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/023.yaml
  text: So Moses spoke to the sons of Israel[a], and they brought the one who had cursed outside the camp and stoned him with stones. Thus the sons of Israel did as Yahweh had commanded Moses.
translation:
  language: hi
  text: तब मूसा ने इस्राएलियों से कहा, और वे उस व्यक्ति को, जिसने शाप दिया था[a], छावनी के बाहर ले गए और उसे पत्थरों से मार डाला। इस प्रकार इस्राएलियों ने वैसा ही किया जैसा याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर-निन्दक।” इब्रानी कृदन्त का शाब्दिक अर्थ “शाप देनेवाला” है; यह पिछले प्रसंग में परमेश्वर के नाम को शाप देनेवाले व्यक्ति की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: कहा
  rationale: पिएल रूप में דבר का अर्थ ‘बोलना/कहना’ है। यहाँ ‘कहा’ आधुनिक हिन्दी में मूसा द्वारा लोगों को संबोधित करने का स्वाभाविक और संक्षिप्त रूप है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर इस प्रसंग में यह समूचे समुदाय का जातिवाचक नाम है; ‘इस्राएली’ आधुनिक हिन्दी में स्वाभाविक और अर्थतः सटीक है।
- source_word: וַיּוֹצִיאוּ
  choice: बाहर ले गए
  rationale: יצא के हिफ़ील रूप का अर्थ किसी को बाहर ले जाना है; यह न्यायिक कार्रवाई और गति दोनों को स्पष्ट करता है।
- source_word: הַמְקַלֵּל
  choice: उस व्यक्ति को, जिसने शाप दिया था
  rationale: קלל का यह निश्चित कृदन्त पिछले प्रसंग में परमेश्वर के नाम को शाप देनेवाले व्यक्ति की ओर संकेत करता है। मुख्य पाठ में सीधे शाब्दिक अर्थ को रखा गया है, न कि अधिक व्याख्यात्मक ‘परमेश्वर-निन्दक’ को।
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह पदबंध छावनी की सीमा से बाहर के स्थान को बताता है; गति का भाव ‘ले गए’ से स्पष्ट है।
- source_word: וַיִּרְגְּמוּ אֹתוֹ אָבֶן
  choice: उसे पत्थरों से मार डाला
  rationale: इब्रानी में रجم के साथ ‘पत्थर’ भी स्पष्ट रूप से आया है। हिन्दी में यह वाक्यांश पत्थरवाह द्वारा दिए गए प्राणदण्ड को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָשׂוּ כַּאֲשֶׁר צִוָּה
  choice: वैसा ही किया जैसा ... ने ... आज्ञा दी थी
  rationale: यह पहले दी गई आज्ञा के पालन का सूत्रात्मक सार है; ‘दी थी’ पूर्ववर्ती आज्ञा के कालक्रम को स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: टेट्राग्राम को किसी उपाधि से बदलने के बजाय उसके व्यक्तिगत नाम का हिन्दी लिप्यन्तरण रखा गया है।
theological_decisions:
- issue: הַמְקַלֵּל को अधिक धर्मवैचारिक ‘परमेश्वर-निन्दक’ के रूप में अनुवादित करना या उसके प्रत्यक्ष शाब्दिक अर्थ को रखना
  choice: जिसने शाप दिया था
  alternative: परमेश्वर-निन्दक
  rationale: व्यापक प्रसंग में अपराध परमेश्वर के नाम की निन्दा है, पर इस पद में प्रयुक्त कृदन्त קלל का प्रत्यक्ष अर्थ ‘शाप देनेवाला’ है। मुख्य पाठ इसी शब्दार्थ को रखता है और प्रसंगगत वैकल्पिक अर्थ को पादटिप्पणी में बताता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘इस्राएली’ सामुदायिक संबोधन के लिए स्वाभाविक हिन्दी है। ‘याहवे’ में मूल व्यक्तिगत नाम को सुरक्षित रखा गया है।
