id: LEV.24.2
reference: Leviticus 24:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: צַ֞ו אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/002.yaml
  text: Command the sons of Israel that they bring to you pure oil of beaten olives for the light[b][a], to keep a lamp burning continually.
translation:
  language: hi
  text: “इस्राएल के पुत्रों[a] को आज्ञा दे कि वे प्रकाश के लिए कूटे हुए जैतून का शुद्ध तेल[b] तेरे पास लाएँ, ताकि दीपक निरन्तर जलता रहे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों” अथवा “इस्राएल के लोगों।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों” है, जो वाचा के लोगों के लिए प्रचलित पदनाम है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पद तेल को जैतूनों से प्राप्त, शुद्ध और कूटकर निकाला हुआ बताता है; इसे “शुद्ध, कूटा हुआ जैतून का तेल” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: आज्ञा दे
  rationale: यह צוה का प्रत्यक्ष आज्ञार्थक रूप है; ‘आज्ञा दे’ उसके अधिकारपूर्ण बल को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पद का औपचारिक रूप बनाए रखता है; यहाँ यह वाचा-सम्बन्धी सामूहिक पदनाम है।
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: वे ... तेरे पास लाएँ
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर אֵלֶיךָ (‘तेरे पास’) के साथ इस प्रसंग में अभिप्राय किसी वस्तु को मूसा के पास लाना है।
- source_word: שֶׁמֶן זַיִת זָךְ כָּתִית
  choice: कूटे हुए जैतून का शुद्ध तेल
  rationale: यह तेल के स्रोत, उसकी शुद्धता और जैतून को कूटकर तेल निकालने की विधि—तीनों को स्पष्ट रखता है।
- source_word: לַמָּאוֹר
  choice: प्रकाश के लिए
  rationale: מָאוֹר प्रकाश या रोशनी को सूचित करता है; यह अनुवाद मूल के निकट रहते हुए प्रसंग में सहज है।
- source_word: לְהַעֲלֹת נֵר תָּמִיד
  choice: ताकि दीपक निरन्तर जलता रहे
  rationale: दीपक को ‘ऊपर उठाने’ का इब्रानी मुहावरा उसे जलाने और जलता रखने के अर्थ में है; תָּמִיד की निरन्तरता भी इस रूप में स्वाभाविक ढंग से व्यक्त होती है।
theological_decisions:
- issue: वाचा-सम्बन्धी पदनाम בְּנֵי יִשְׂרָאֵל का लिंगयुक्त रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल के लोगों
  rationale: इब्रानी में स्पष्ट रूप से ‘इस्राएल के पुत्र’ है और यह पूरे वाचा-समुदाय का पारम्परिक पदनाम है। मुख्य पाठ में उसका औपचारिक रूप रखा गया है, जबकि उसका सामूहिक आशय पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज धार्मिक गद्य अपनाया गया है। परमेश्वर द्वारा मूसा को एकवचन सम्बोधन के कारण ‘तेरे पास’ रखा गया है। ‘दीपक’ को ‘मोमबत्ती’ नहीं किया गया, और मूल के पारम्परिक सामूहिक पदनाम को मुख्य पाठ में सुरक्षित रखा गया है।
