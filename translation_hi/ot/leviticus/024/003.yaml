source:
  edition: WLC
  text: מִ/חוּץ֩ לְ/פָרֹ֨כֶת הָ/עֵדֻ֜ת בְּ/אֹ֣הֶל מוֹעֵ֗ד יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֜ן מֵ/עֶ֧רֶב עַד בֹּ֛קֶר לִ/פְנֵ֥י יְהוָ֖ה תָּמִ֑יד חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/003.yaml
  text: Outside the veil of the testimony[a], in the tent of meeting, Aaron shall arrange it from evening until morning before Yahweh continually[c][b]. It is a permanent statute throughout your generations.
translation:
  language: hi
  text: मिलाप के तंबू में, साक्षी के परदे के बाहर, हारून उसे शाम से सुबह तक याहवे के सामने निरंतर व्यवस्थित करे।[a] यह तुम्हारी पीढ़ियों के लिए सदा की विधि है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “निरंतर” का अर्थ इस विधि का नियमित रूप से लगातार पालन करना है; प्रत्येक अवसर की अवधि “शाम से सुबह तक” बताई गई है।
    reason: cultural_note
  - marker: b
    text: “सदा की विधि” का अनुवाद “स्थायी विधि” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ לְפָרֹכֶת הָעֵדֻת
  choice: साक्षी के परदे के बाहर
  rationale: מִחוּץ स्थान को ‘बाहर’ बताता है; פָרֹכֶת पवित्रस्थान के भीतरी परदे को दर्शाता है; הָעֵדֻת को व्याख्यात्मक विस्तार किए बिना स्थापित धार्मिक अर्थ ‘साक्षी’ से व्यक्त किया गया है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: यह तंबू-पवित्रस्थान का पारंपरिक और सामान्य हिन्दी नाम है तथा ‘भेंट/मिलने के तंबू’ के भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: उसे ... व्यवस्थित रखे
  rationale: ערך का मूल भाव क्रम से लगाने या व्यवस्थित रखने का है। पूर्ववर्ती संदर्भ के दीपक की ओर संकेत करने वाले एकवचन सर्वनाम को ‘उसे’ से सुरक्षित रखा गया है।
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: शाम से सुबह तक
  rationale: समयावधि का सीधा, स्वाभाविक आधुनिक हिन्दी अनुवाद।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי आराधनागत संदर्भ में उपस्थिति के सामने होने को दर्शाता है; יהוה को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से लिप्यंतरित किया गया है।
- source_word: תָּמִיד
  choice: निरंतर
  rationale: यहाँ शब्द नियमित रूप से जारी रहने वाले अनुष्ठान को दर्शाता है, जबकि ‘शाम से सुबह तक’ हर अवसर की समय-सीमा स्पष्ट करता है।
- source_word: חֻקַּת עוֹלָם
  choice: सदा की विधि
  rationale: यह स्थायी और पीढ़ियों तक लागू निर्धारित विधान का भाव देता है; ‘विधि’ साधारण हिन्दी में समझने योग्य और विधिक संदर्भ के अनुकूल है।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-दर-पीढ़ी
  rationale: इब्रानी मुहावरे का अर्थ आगामी क्रमिक पीढ़ियों में जारी रहने वाला दायित्व है।
theological_decisions:
- issue: תָּמִיד और ‘शाम से सुबह तक’ का संबंध
  choice: ‘निरंतर’ को नियमित, लगातार पालन के अर्थ में रखा गया और समयावधि भी स्पष्ट रखी गई
  alternative: ‘हर रात नियमित रूप से’
  rationale: अनुवाद इब्रानी के दोनों कथनों को बनाए रखता है और ‘निरंतर’ को हर क्षण जलते रहने के अर्थ में चुपचाप सीमित या विस्तृत नहीं करता।
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; हिन्दी के सामान्य पाठकों के लिए सुविख्यात लिप्यंतरण ‘यहोवा’ शीर्षक से प्रतिस्थापन किए बिना उस नाम को सुरक्षित रखता है।
- issue: חֻקַּת עוֹלָם की कालगत शक्ति
  choice: सदा की विधि
  alternative: स्थायी विधि
  rationale: עוֹלָם की दीर्घकालिक, पीढ़ियों तक बनी रहने वाली शक्ति को रखा गया है, और अगला वाक्यांश उसके पीढ़ीगत संदर्भ को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-क्रम हिन्दी की स्वाभाविकता के अनुसार है, पर स्थान, समय, परमेश्वर की उपस्थिति और निरंतरता—इन सभी मूल घटकों को सुरक्षित रखा गया है।
