  text: וּ/מַכֵּ֥ה נֶֽפֶשׁ בְּהֵמָ֖ה יְשַׁלְּמֶ֑/נָּה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/018.yaml
  text: 'And whoever strikes down an animal shall make restitution for it: life for life[a].'
translation:
  language: hi
  text: और जो कोई किसी पशु को मार डाले, वह उसकी भरपाई करे—प्राण के बदले प्राण।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “प्राण के बदले प्राण।” पशु की भरपाई के इस प्रसंग में यह उक्ति समतुल्य क्षतिपूर्ति को व्यक्त करती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַכֵּה
  choice: और जो कोई … मार डाले
  rationale: हिफ़ील कृदन्त सामान्य विधिक मामले के कर्ता को व्यक्त करता है। पशु के נֶפֶשׁ को मारने के संदर्भ में ‘मार डाले’ घातक प्रहार का अर्थ स्वाभाविक रूप से देता है।
- source_word: נֶפֶשׁ בְּהֵמָה
  choice: किसी पशु को
  rationale: इस रचना का आशय पशु के प्राण लेना, अर्थात उसे मार डालना है। हिन्दी में ‘पशु के प्राण को मारे’ अस्वाभाविक होता, इसलिए अर्थ को क्रिया में व्यक्त किया गया है।
- source_word: יְשַׁלְּמֶנָּה
  choice: वह उसकी भरपाई करे
  rationale: पिएल रूप हानि की क्षतिपूर्ति या प्रतिपूर्ति करने को दर्शाता है। स्त्रीलिंग प्रत्यय का संबंध בְּהֵמָה से है; ‘उसकी’ इसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נֶפֶשׁ תַּחַת נָפֶשׁ
  choice: प्राण के बदले प्राण
  rationale: यह चयन इब्रानी की संक्षिप्त विधिक उक्ति और उसकी पुनरावृत्ति को सुरक्षित रखता है। यहाँ ‘प्राण’ जीवित प्राणी के जीवन को दर्शाता है, अमूर्त ‘आत्मा’ को नहीं।
theological_decisions:
- issue: पशु संबंधी व्यवस्था में प्रतिपूर्ति-सूत्र का अर्थ
  choice: पशु को मार डालने पर समतुल्य भरपाई अपेक्षित है; सूत्र को ‘प्राण के बदले प्राण’ के रूप में सुरक्षित रखा गया है।
  alternative: इसे विशेष रूप से मारे गए पशु के स्थान पर दूसरा पशु देना समझा जा सकता है, अथवा व्यापक प्रतिताल-विधान की प्रतिध्वनि मानते हुए भौतिक या मौद्रिक क्षतिपूर्ति समझी जा सकती है।
  rationale: יְשַׁלְּמֶנָּה स्पष्ट रूप से भरपाई की मांग करता है, पर पद उसकी ठीक विधि नहीं बताता। इसलिए अनुवाद न तो केवल मौद्रिक भुगतान निर्धारित करता है, न अनिवार्य रूप से दूसरे पशु की अदला-बदली।
translation_notes:
  register: भाषा आधुनिक, सहज और विधिक गरिमा वाली रखी गई है। ‘मार डाले’ घातक आशय स्पष्ट करता है; ‘भरपाई’ सामान्य पाठक के लिए सुबोध है; और ‘प्राण के बदले प्राण’ मूल की सूत्रात्मकता तथा संभावित अर्थ-व्याप्ति को बनाए रखता है।
