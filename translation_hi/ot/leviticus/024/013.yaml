lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है। דִּבֵּר के लिए यहाँ ‘कहा’ सहज है, जबकि आगे का לֵאמֹר आगामी वचन का परिचय देता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित ध्वन्यात्मक रूप ‘यहवे’ से व्यक्त किया गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: דבר אל की हिन्दी में स्वाभाविक अभिव्यक्ति ‘से कहना’ है; मֹשֶׁה का मानक हिन्दी नाम ‘मूसा’ रखा गया है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: यह मानक वचन-परिचय सूत्र है। हिन्दी में ‘यह कहते हुए’ अनावश्यक रूप से भारी होता; अगले पद में कथन जारी होने के कारण ‘कहा,’ वही कार्य स्वाभाविक ढंग से करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘यहवे’ नाम को बनाए रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता और ‘यहोवा’ एक वैकल्पिक पारंपरिक स्वरांकन है।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण हिन्दी। इब्रानी सूत्र की पुनरुक्ति को शब्दशः ‘बोला...कहते हुए’ न रखकर स्वाभाविक हिन्दी ‘कहा’ में समेटा गया है; अंतिम अल्पविराम अगले पद में आने वाले कथन का संकेत देता है।
