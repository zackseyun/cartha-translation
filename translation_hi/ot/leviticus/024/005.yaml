  verdict: revise
  source_fidelity: The draft conveys the required sequence—take fine flour, bake twelve bread units, and allot two-tenths of an ephah to each. However, the imperative forms ‘तुम मैदा लेना’ and ‘...पकाना’ are not grammatical natural Hindi commands. The measurement clause is also more clearly and faithfully expressed as the amount of flour from which each loaf is made.
  naturalness: Revision is needed for idiomatic modern standard Hindi. ‘तुम ... लो’ and ‘...पकाओ’ provide clear instructional imperatives, while ‘हर रोटी एपा के दो-दसवें भाग मैदे से बनी हो’ naturally states the distributive quantity.
  terminology: ‘मैदा’ is retained for סֹלֶת as an established, accessible rendering of fine flour in this ritual context. ‘रोटियाँ’ appropriately renders חַלּוֹת; the lexical alternative is retained. ‘एपा’ and the explanatory measurement footnote are appropriate.
  issues:
  - severity: medium
    issue: The main-text verb forms are infinitives rather than imperative commands.
    rationale: ‘तुम मैदा लेना ... पकाना’ is unidiomatic and grammatically incomplete as a direct instruction. The Hebrew forms carry procedural command force.
  - severity: low
    issue: The distributive measurement is awkwardly phrased as ‘हर एक रोटी के लिए ... मैदा होगा।’
    rationale: Stating that each loaf is made from the specified amount of flour is more idiomatic Hindi and clearly preserves the source’s per-loaf measurement.
