base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/005.yaml
  text: And you shall take fine flour and bake it into twelve loaves[b][a]; each loaf shall be of two-tenths of an ephah.
translation:
  language: hi
  text: तुम मैदा लो और उससे बारह रोटियाँ[a] पकाओ; हर रोटी एपा के दो-दसवें भाग मैदे से बनी हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पकी हुई टिकियाँ।’ इब्रानी शब्द अनुष्ठान में प्रयुक्त अलग-अलग पकी हुई रोटी की इकाइयों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: तुम ... लेना
  rationale: निर्देशात्मक क्रम में संयोजक सहित पूर्ण क्रिया आज्ञा का भाव रखती है; यह रूप आधुनिक हिन्दी में विधि-संबंधी आदेश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह भेंटों और पवित्र रोटी के लिए प्रयुक्त बारीक, परिष्कृत आटे का पारिभाषिक शब्द है; हिन्दी में ‘मैदा’ सामान्य पाठक के लिए सबसे सहज समतुल्य है और मूल से अधिक अनाज-विशेष निर्धारित नहीं करता।
- source_word: וְאָפִיתָ אֹתָהּ
  choice: और उसकी ... पकाना
  rationale: स्त्रीलिंग सर्वनाम का संबंध סֹלֶת से है। हिन्दी में ‘उसकी ... रोटियाँ पकाना’ स्रोत पदार्थ और उससे बने परिणाम का संबंध स्वाभाविक रूप से बताता है।
- source_word: שְׁתֵּים עֶשְׂרֵה חַלּוֹת
  choice: बारह रोटियाँ
  rationale: חַלּוֹת अनुष्ठान में प्रयुक्त अलग-अलग पकी हुई रोटी की इकाइयाँ हैं। ‘रोटियाँ’ आधुनिक हिन्दी में स्पष्ट है; आकार के बारे में अनावश्यक विशिष्टता से बचने के लिए वैकल्पिक अर्थ फुटनोट में दिया गया है।
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: एपा का दो-दसवाँ भाग
  rationale: पुरोहितीय माप-प्रणाली में इसका अर्थ एपा के दो दशमांश है। निहित मानक ‘एपा’ को स्पष्ट करने से आधुनिक पाठक के लिए माप समझने योग्य रहता है।
- source_word: יִהְיֶה הַחַלָּה הָאֶחָת
  choice: हर एक रोटी के लिए ... होगा
  rationale: शाब्दिक रूप ‘एक रोटी होगी’ वितरणार्थक है; हिन्दी में यह रचना स्पष्ट करती है कि बताई गई मात्रा प्रत्येक रोटी पर लागू होती है।
