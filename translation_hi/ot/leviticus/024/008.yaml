base_translation:
  language: en
  yaml_path: translation/ot/leviticus/024/008.yaml
  text: Every Sabbath day he shall arrange it before Yahweh continually[c][b][a], from the sons of Israel as an everlasting covenant.
translation:
  language: hi
  text: हर सब्त के दिन वह उसे[a] यहोवा के सामने निरंतर सजाकर रखे। यह इस्राएल के पुत्रों से सदा की वाचा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसे’ से आशय सामूहिक रूप से रोटियों की पूरी व्यवस्था से है; इसका अनुवाद ‘उसे क्रम से लगाए’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם הַשַּׁבָּת בְּיוֹם הַשַּׁבָּת
  choice: हर सब्त के दिन
  rationale: हिब्रू में पदबंध की पुनरावृत्ति वितरणात्मक है और प्रत्येक सब्त को होने वाली नियमित क्रिया बताती है; स्वाभाविक हिन्दी में ‘हर सब्त के दिन’ यही अर्थ देता है।
- source_word: יַעַרְכֶנּוּ
  choice: वह उसे सजाकर रखे
  rationale: ערך का अर्थ क्रम से लगाना या व्यवस्थित करना है। पुल्लिंग एकवचन कर्म-प्रत्यय रोटियों की पूरी व्यवस्था को सामूहिक इकाई के रूप में दर्शाता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह उपासना-संबंधी प्रस्तुति को परमेश्वर की उपस्थिति में रखे जाने के रूप में व्यक्त करता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत करता है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: याजकीय प्रसंग में यह लगातार चलती नियमित व्यवस्था को सूचित कर सकता है; सब्त की साप्ताहिक समय-सूचना इसकी आवर्ती प्रकृति स्पष्ट करती है।
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों की ओर से
  rationale: מֵאֵת स्रोत को सूचित करता है, पर इस अनुष्ठानिक संदर्भ में भेंट का प्रतिनिधिक स्रोत स्वाभाविक हिन्दी में ‘की ओर से’ व्यक्त होता है; ‘पुत्रों’ मूल की पुरुषवाची सामूहिक अभिव्यक्ति सुरक्षित रखता है।
- source_word: בְּרִית עוֹלָם
  choice: सदा की वाचा
  rationale: शाब्दिक वाचा-भाषा और उसकी स्थायी अवधि दोनों को सुरक्षित रखा गया है; ‘दायित्व’ जोड़ने से बचा गया है क्योंकि वह मूल में स्पष्ट संज्ञा नहीं है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी में व्यापक रूप से पहचाना जाने वाला उसका नामरूप ‘यहोवा’ रखा गया है, न कि उसे पदवी ‘प्रभु’ से बदला गया है।
- issue: מֵאֵת בְּנֵי יִשְׂרָאֵל का संबंध
  choice: इस्राएल के पुत्रों की ओर से
  alternative: इस्राएल के पुत्रों से
  rationale: מֵאֵת सामान्यतः स्रोत दर्शाता है, पर भेंट की प्रतिनिधिक प्रकृति ‘की ओर से’ अर्थ की सम्भावना देती है। वाक्य में इसे चुना गया है, जबकि मूल संबंध को व्याख्यात्मक रूप से अधिक विस्तृत नहीं किया गया।
- issue: בְּרִית עוֹלָם की विधिक शक्ति
  choice: सदा की वाचा
  alternative: सदा की वाचा का दायित्व
  rationale: मूल अभिव्यक्ति को वाचा ही रखा गया है। अनुष्ठानिक दायित्व प्रसंग से निकलता है, पर उसे पाठ में जोड़ना धर्मवैचारिक तनाव को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘सब्त’, ‘वाचा’ और ‘यहोवा’ जैसे बाइबिलीय शब्द अर्थ-सटीकता के लिए रखे गए हैं। मूल हिब्रू की पुनरावृत्ति को स्वाभाविक वितरणात्मक हिन्दी में व्यक्त किया गया है।
