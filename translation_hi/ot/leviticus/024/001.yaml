lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर ... कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है। हिंदी में ‘फिर’ क्रम को स्वाभाविक रूप से व्यक्त करता है; דִּבֵּר और לֵאמֹר के संयुक्त प्रयोग को अनावश्यक दोहराव से बचाते हुए ‘कहा’ में समेटा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह परमेश्वर के व्यक्तिगत नाम YHWH का हिंदी में प्रचलित लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: אֶל संबोधन की दिशा बताता है। हिंदी में ‘मूसा से कहा’ स्वाभाविक वाक्य-विन्यास है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह रूप आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिंदी में मुख्य क्रिया के साथ ‘कहा’ इसका अर्थ स्वाभाविक रूप से वहन करता है; ‘यह कहते हुए’ यहाँ बोझिल और पुनरुक्तिपूर्ण होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘यहोवा’ आधुनिक हिंदी बाइबल-पाठकों में पहचाना जाने वाला नाम-रूप है और उपाधि ‘प्रभु’ के स्थान पर मूल के नाम-संबंधी स्वरूप को बनाए रखता है। ‘याहवे’ अधिक संभावित विद्वत्तापरक उच्चारण है, पर हिंदी में कम पारंपरिक है।
translation_notes:
  register: संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिंदी। मूल की कथात्मक प्रगति ‘फिर’ से व्यक्त हुई है। हिंदी की स्वाभाविकता के लिए ‘बोला ... यह कहते हुए’ जैसी शब्दशः पुनरुक्ति से बचा गया है।
