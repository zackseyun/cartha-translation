base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/009.yaml
  text: 'These you may eat from all that are in the waters: whatever in the waters[a], in the seas and in the streams, has fins and scales—these you may eat.'
translation:
  language: hi
  text: 'जल में जो कुछ है, उसमें से तुम यह खा सकते हो: जल में, समुद्रों और नदियों[a] में, जिनके पंख और शल्क हों, उन्हें तुम खा सकते हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जलधाराओं’; इब्रानी शब्द नदियों, नालों, मौसमी जलधाराओं या उनके पाटों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת זֶה
  choice: इन्हें
  rationale: इब्रानी में एकवचन संकेतवाचक रूप है, पर आहार-वर्ग के परिचय में हिन्दी का बहुवचन ‘इन्हें’ आगे बताए गए जीवों के साथ स्वाभाविक है।
- source_word: תֹּאכְלוּ
  choice: तुम ... खा सकते हो
  rationale: विधिक प्रसंग में अपूर्ण क्रिया अनुमत वस्तुओं को बताती है; ‘खा सकते हो’ इस अनुमति को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: जल में रहनेवाले जीवों में से
  rationale: מִן के अंशवाचक अर्थ को ‘में से’ से रखा गया है और हिन्दी में आशय स्पष्ट करने के लिए निहित जीवों का उल्लेख किया गया है।
- source_word: סְנַפִּיר
  choice: पंख
  rationale: मछली अथवा जलीय जीव के तैरने वाले अंग के लिए सामान्य हिन्दी शब्द चुना गया है; इब्रानी एकवचन जातिवाचक है।
- source_word: קַשְׂקֶשֶׂת
  choice: शल्क
  rationale: मछलियों के शरीर पर पाई जाने वाली परतों के लिए सटीक और प्रचलित हिन्दी शब्द; इब्रानी जातिवाचक संज्ञा है।
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: समुद्रों और नदियों[a] के जल में
  rationale: יַּמִּים को ‘समुद्रों’ और व्यापक נְחָלִים को मुख्य पाठ में सहज ‘नदियों’ से व्यक्त किया गया है; उसकी संदर्भगत व्यापकता पादटिप्पणी में सुरक्षित है।
- source_word: אֹתָם תֹּאכֵלוּ
  choice: उन्हें तुम खा सकते हो
  rationale: समापन में अनुमत जीवों को फिर से संकेत करते हुए इब्रानी की पुनरुक्ति और बल को बनाए रखा गया है।
