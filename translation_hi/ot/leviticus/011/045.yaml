  text: כִּ֣י אֲנִ֣י יְהוָ֗ה הַֽ/מַּעֲלֶ֤ה אֶתְ/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לִ/הְיֹ֥ת לָ/כֶ֖ם לֵ/אלֹהִ֑ים וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָֽנִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/045.yaml
  text: For I am Yahweh[a], who brought you up from the land of Egypt to be your God. And you shall be holy[b], because I am holy.
translation:
  language: hi
  text: क्योंकि मैं याहवे हूँ, जो तुम्हारा परमेश्वर होने के लिए तुम्हें मिस्र देश से निकाल लाया[a]। और तुम पवित्र रहो, क्योंकि[b] मैं पवित्र हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “जो तुम्हें मिस्र देश से ऊपर ले आता है।” हिब्रू में यहाँ कृदन्त रूप है, जिसका अनुवाद वर्तमान-जैसे रूप में भी हो सकता है, यद्यपि संकेत अतीत में हुए निर्गमन की ओर है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “क्योंकि” का अनुवाद “इसलिए कि” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: הַמַּעֲלֶה
  choice: निकाल लाया
  rationale: मूल participle का शाब्दिक भाव ‘ऊपर ले आनेवाला’ है, पर मिस्र से निर्गमन के इस संदर्भ में ‘निकाल लाया’ स्वाभाविक हिन्दी में अतीत की उद्धारकारी घटना को व्यक्त करता है; वर्तमान-जैसे अनुवाद की संभावना पादटिप्पणी में रखी गई है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: मूल में आए ‘देश’ को स्पष्ट रूप से बनाए रखता है और निर्गमन-संबंधी वाचा-वाक्यांश को सुरक्षित रखता है।
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: तुम्हारा परमेश्वर होने के लिए
  rationale: यह वाचा-संबंधी अभिव्यक्ति का स्वाभाविक हिन्दी रूप है और परमेश्वर तथा प्रजा के संबंध को बनाए रखता है।
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: और तुम पवित्र रहो
  rationale: संदर्भ में यह आज्ञार्थक बल रखता है। ‘पवित्र रहो’ आधुनिक हिन्दी में स्वाभाविक है और ‘पवित्र’ के धर्मवैचारिक विस्तार को केवल ‘अलग किए हुए’ तक सीमित नहीं करता।
- source_word: כִּי קָדוֹשׁ אָנִי
  choice: क्योंकि मैं पवित्र हूँ
  rationale: दूसरा כִּי इस आज्ञा का आधार बताता है; ‘क्योंकि’ आधुनिक हिन्दी में इस कारण-संबंध को स्पष्ट करता है।
theological_decisions:
- issue: पवित्रता का वाचागत आधार
  choice: इस्राएल से अपेक्षित पवित्रता को याहवे की पहचान, मिस्र से उसके उद्धारकारी कार्य और उनके परमेश्वर होने के वाचा-संबंध पर आधारित रखा गया है।
  alternative: इसे केवल भोजन-संबंधी अनुष्ठानिक शुद्धता का निर्देश मानना।
  rationale: तात्कालिक प्रसंग आहार-संबंधी शुद्धता का है, फिर भी पद स्वयं निर्गमन, वाचा-संबंध और परमेश्वर की अपनी पवित्रता को इस आज्ञा का आधार बनाता है।
- issue: हिब्रू participle का कालगत बल
  choice: निर्गमन की पूर्ण हो चुकी ऐतिहासिक घटना के कारण ‘निकाल लाया’ रखा गया है।
  alternative: ‘निकाल लाता है’ अथवा अधिक शाब्दिक ‘ऊपर ले आता है’।
  rationale: הַמַּעֲלֶה व्याकरणतः participle है और वर्तमान-जैसा रूप संभव है, पर संदर्भ स्पष्टतः अतीत के निर्गमन की ओर संकेत करता है; अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘याहवे’ विशिष्ट ईश्वरीय नाम को दर्शाता है; ‘परमेश्वर’ אֱלֹהִים के लिए सामान्य सम्मानसूचक हिन्दी रूप है। वाक्य-संरचना मूल के कारण-वाक्य और संयोजक ‘और’ को बनाए रखती है।
