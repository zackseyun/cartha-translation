reference: Leviticus 11:46
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זֹ֣את תּוֹרַ֤ת הַ/בְּהֵמָה֙ וְ/הָ/ע֔וֹף וְ/כֹל֙ נֶ֣פֶשׁ הַֽ/חַיָּ֔ה הָ/רֹמֶ֖שֶׂת בַּ/מָּ֑יִם וּ/לְ/כָל נֶ֖פֶשׁ הַ/שֹּׁרֶ֥צֶת עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/046.yaml
  text: This is the law concerning the livestock[a], the birds, every living creature that moves in the waters[c][b], and every creature that swarms on the earth.
translation:
  language: hi
  text: पशुओं, पक्षियों, जल में चलने वाले हर जीवित प्राणी और धरती पर रेंगने वाले हर जीव के विषय में यही व्यवस्था[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यही शिक्षा है”; इब्रानी शब्द תּוֹרָה अधिकारपूर्ण शिक्षा और व्यवस्था—दोनों का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: के विषय में ... व्यवस्था
  rationale: यह पद पिछले नियमों का सार प्रस्तुत करता है। ‘व्यवस्था’ अधिकारपूर्ण विधि का भाव व्यक्त करती है, जबकि ‘के विषय में’ हिन्दी में संबंध को स्वाभाविक बनाता है।
- source_word: הַבְּהֵמָה
  choice: पशुओं
  rationale: यहाँ शब्द स्थलीय पशुओं की व्यापक श्रेणी को सूचित करता है; ‘पशु’ आधुनिक हिन्दी में ‘मवेशी’ से अधिक व्यापक और प्रसंगानुकूल है।
- source_word: הָעוֹף
  choice: पक्षियों
  rationale: इस प्रसंग में उड़ने वाले जीवों की श्रेणी के लिए ‘पक्षी’ स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: כֹל נֶפֶשׁ הַחַיָּה
  choice: हर जीवित प्राणी
  rationale: यह इब्रानी पदबंध सजीव प्राणी को सूचित करता है, किसी अभौतिक ‘आत्मा’ को नहीं।
- source_word: הָרֹמֶשֶׂת בַּמָּיִם
  choice: जल में चलने वाले
  rationale: רמש गति करने का व्यापक भाव रखता है। जलीय जीवों के लिए ‘चलने वाले’ स्वाभाविक है और इसे अगले שׁרץ से अलग रखता है।
- source_word: כָל נֶפֶשׁ הַשֹּׁרֶצֶת
  choice: रेंगने वाले हर जीव
  rationale: שׁרץ छोटे जीवों के रेंगने, बहुतायत से फैलने या झुंड में होने का भाव दे सकता है। स्थलीय जीवों के इस प्रसंग में ‘रेंगने वाले’ सहज हिन्दी है।
- source_word: עַל הָאָרֶץ
  choice: धरती पर
  rationale: यह जल के विपरीत स्थलीय क्षेत्र को दर्शाता है; ‘धरती पर’ व्यापकता और सामान्य हिन्दी दोनों बनाए रखता है।
theological_decisions:
- issue: נֶפֶשׁ का अर्थ
  choice: जीवित प्राणी / जीव
  alternative: जीवित आत्मा
  rationale: यहाँ נֶפֶשׁ पशु-जगत के सजीव प्राणियों के लिए प्रयुक्त है; ‘आत्मा’ आधुनिक पाठक को शरीर से पृथक सत्ता का अनपेक्षित अर्थ दे सकती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सूची की औपचारिक सारांश-शैली बनाए रखते हुए हिन्दी वाक्यक्रम को स्वाभाविक बनाया गया है।
