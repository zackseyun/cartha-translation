base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/021.yaml
  text: 'Yet these you may eat from all the swarming things that fly[b][a], that go on all fours: those that have jointed legs above their feet to hop on the ground with them.'
translation:
  language: hi
  text: फिर भी, चार पैरों पर चलनेवाले सभी उड़नेवाले रेंगनेवाले जीवों में से तुम उन्हें खा सकते हो जिनके पैरों के ऊपर कूदने के लिए विशेष टाँगें हों[a], जिनसे वे भूमि पर कूदते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लिखित इब्रानी पाठ का शाब्दिक अर्थ “जिनकी टाँगें नहीं” है; परंपरागत पाठ-पठन, संदर्भ और प्राचीन अनुवादों के अनुसार अर्थ “जिनकी टाँगें हैं” है। यहाँ इब्रानी शब्द का अर्थ “जोड़दार टाँगें” भी किया जा सकता है; आशय कूदने के काम आनेवाली विशेष पिछली टाँगों से है।
