  edition: WLC
  text: אַ֤ךְ אֶת זֶה֙ לֹ֣א תֹֽאכְל֔וּ מִֽ/מַּעֲלֵי֙ הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֖י הַ/פַּרְסָ֑ה אֶֽת הַ֠/גָּמָל כִּֽי מַעֲלֵ֨ה גֵרָ֜ה ה֗וּא וּ/פַרְסָה֙ אֵינֶ֣/נּוּ מַפְרִ֔יס טָמֵ֥א ה֖וּא לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/004.yaml
  text: 'Nevertheless[a], you shall not eat these from among those that chew the cud or from among those that divide the hoof: the camel, because it chews the cud but does not divide the hoof[b]; it is unclean to you.'
translation:
  language: hi
  text: 'फिर भी, जो पशु जुगाली करते हैं या जिनके खुर चिरे हुए हैं[a], उनमें से ये पशु न खाना: ऊँट, क्योंकि वह जुगाली तो करता है, पर उसका खुर चिरा हुआ नहीं है; वह तुम्हारे लिए अशुद्ध[b] है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो खुर को दो भागों में बाँटते हैं।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात इस्राएल के आहार-विधानों के अनुसार तुम्हारे लिए अशुद्ध।
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: फिर भी
  rationale: यह पिछले नियम पर अपवाद या सीमा प्रकट करता है; ‘फिर भी’ उसके विरोधात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: जो पशु जुगाली करते हैं
  rationale: इब्रानी मुहावरे का शाब्दिक भाव जुगाली को ऊपर लाना है; आधुनिक हिन्दी में ‘जुगाली करना’ स्पष्ट और प्रचलित समतुल्य है।
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה
  choice: या जिनके खुर चिरे हुए हैं
  rationale: यह दूसरी आहार-वर्गीकरण विशेषता बताता है। सन्दर्भ में आगे ऐसे पशु गिनाए गए हैं जिनमें दोनों में से केवल एक विशेषता है, इसलिए हिन्दी में ‘या’ आशय को स्पष्ट करता है; ‘खुर चिरे हुए’ मूल क्रिया और संज्ञा के भाव को रखता है।
- source_word: הַגָּמָל
  choice: ऊँट
  rationale: नामित पशु का सीधा और सर्वमान्य हिन्दी समतुल्य।
- source_word: כִּי מַעֲלֵה גֵרָה הוּא
  choice: क्योंकि वह जुगाली तो करता है
  rationale: ‘तो’ उस पहली विशेषता और आगे आनेवाली कमी के बीच विरोध को स्वाभाविक रूप से उभारता है।
- source_word: וּפַרְסָה אֵינֶנּוּ מַפְרִיס
  choice: पर उसका खुर चिरा हुआ नहीं है
  rationale: ऊँट के दूसरी आवश्यक विशेषता पूरी न करने को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: טָמֵא הוּא לָכֶם
  choice: वह तुम्हारे लिए अशुद्ध है
  rationale: ‘अशुद्ध’ लैव्यव्यवस्था के शुद्धता-वर्गीकरण का स्थापित हिन्दी शब्द है; ‘तुम्हारे लिए’ सम्बोधित समुदाय के प्रति कानूनी-वाचा सम्बन्धी दृष्टि बनाए रखता है।
theological_decisions:
- issue: लैव्यव्यवस्था के आहार-विधान में अशुद्धता का स्वरूप
  choice: अशुद्ध
  alternative: अनुष्ठानिक रूप से अशुद्ध
  rationale: मुख्य पाठ में इब्रानी טָמֵא के व्यापक और केंद्रीय शब्द को रखा गया है। ‘अनुष्ठानिक’ जोड़ने से अर्थ समय से पहले संकरा हो सकता है; प्रसंगगत सीमा पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जुगाली करना’, ‘खुर चिरा हुआ’ और ‘अशुद्ध’ जैसे परिचित बाइबलीय तथा सामान्य हिन्दी पद चुने गए हैं। वाक्य में ‘तो...पर’ मूल के निहित विरोध को स्पष्ट करता है, बिना किसी सम्प्रदायगत व्याख्या को जोड़े।
