  text: וְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ שֶׁ֥קֶץ ה֖וּא לֹ֥א יֵאָכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/041.yaml
  text: And every swarming thing that swarms on the earth is detestable[b][a]; it shall not be eaten.
translation:
  language: hi
  text: और धरती पर रेंगने-फिरने वाले सभी छोटे जीव घृणित[a] हैं; उन्हें खाया न जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घृणित वस्तु।” यहाँ यह शब्द भोजन के रूप में धार्मिक-विधि की दृष्टि से वर्जित होने को दर्शाता है, न कि आवश्यक रूप से नैतिक दोष को। “रेंगने-फिरने वाले छोटे जीव” के लिए “रेंगनेवाले जीव” भी कहा जा सकता है; इब्रानी शब्द छोटे, झुंड में या धरती के निकट चलने वाले प्राणियों के व्यापक वर्ग को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: और ... हर
  rationale: וְ इस निषेध को पिछले आहार-संबंधी नियमों से जोड़ता है, और כָּל समग्रता व्यक्त करता है।
- source_word: הַ/שֶּׁרֶץ הַ/שֹּׁרֵץ
  choice: रेंगने वाला ... छोटा जीव
  rationale: שֶׁרֶץ और שׁרץ धरती के पास चलने या बड़ी संख्या में गतिशील रहने वाले छोटे जीवों के व्यापक वर्ग को दर्शाते हैं। हिंदी में मूल की पुनरुक्ति को यथावत रखने पर वाक्य अस्वाभाविक होता; यह रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל הָ/אָ֑רֶץ
  choice: धरती पर
  rationale: यहाँ אָרֶץ जल और आकाश के विपरीत स्थलीय क्षेत्र को सूचित करता है।
- source_word: שֶׁ֥קֶץ
  choice: घिनौना
  rationale: यह शब्द इस प्रसंग में भोजन के रूप में धार्मिक-विधि की दृष्टि से घृणित और वर्जित होने का बोध देता है; 'घिनौना' आधुनिक, स्पष्ट और सहज है।
- source_word: לֹ֥א יֵאָכֵֽל
  choice: उसे खाया न जाए
  rationale: निफ़अल अपूर्ण क्रिया निष्क्रिय निषेध व्यक्त करती है; यह हिंदी रूप कानूनी निर्देश का भाव बनाए रखता है।
theological_decisions:
- issue: שֶׁקֶץ का धार्मिक-विधिक आशय
  choice: मुख्य पाठ में 'घिनौना', और पादटिप्पणी में भोजन के रूप में विधिक संदर्भ स्पष्ट
  alternative: '''अशुद्ध'' या ''घृणित वस्तु'''
  rationale: '''अशुद्ध'' मूल के इस विशिष्ट शब्द को טָמֵא के साथ मिला सकता है, जबकि ''घृणित वस्तु'' हिंदी में कम स्वाभाविक है। पादटिप्पणी नैतिक और विधिक घृणा के बीच अनावश्यक मिश्रण से बचाती है।'
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त और गरिमापूर्ण विधिक शैली। 'छोटा जीव' व्यापक प्राणी-वर्ग का संकेत देता है, जबकि 'रेंगने वाला' उसके धरती के पास चलने के ढंग को सहज हिंदी में व्यक्त करता है।
