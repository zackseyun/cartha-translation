source:
  edition: WLC
  text: וְ/הָֽ/אֹכֵל֙ מִ/נִּבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/הּ יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/040.yaml
  text: And the one who eats any of its carcass shall wash his clothes and be unclean until the evening[b][a], and the one who carries its carcass shall wash his clothes and be unclean until the evening.
translation:
  language: hi
  text: और जो उसकी लाश में से कुछ खाए[a], वह अपने कपड़े धोए और शाम तक अशुद्ध रहे[b]; और जो उसकी लाश उठाए, वह अपने कपड़े धोए और शाम तक अशुद्ध रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसकी लाश में से’; इब्रानी अभिव्यक्ति लाश के किसी भाग का बोध कराती है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात इस्राएल की अनुष्ठानिक शुद्धता-विधियों के अनुसार अशुद्ध।
    reason: cultural_note
lexical_decisions:
- source_word: הָאֹכֵל
  choice: जो ... खाए
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत किसी भी ऐसे व्यक्ति को बताता है जो यह काम करे। हिन्दी की कानूनी शैली में ‘जो ... वह’ स्वाभाविक और सामान्य-व्यक्ति-सूचक है।
- source_word: מִנִּבְלָתָהּ
  choice: उसकी लोथ में से कुछ
  rationale: מִן यहाँ अंशवाचक है—लोथ का कुछ भाग खाने का भाव देता है। प्रत्यय का संकेत प्रसंग में बताए गए पशु की ओर है।
- source_word: נְבֵלָה / נִבְלָתָהּ
  choice: लोथ
  rationale: शुद्धता-विधि के इस प्रसंग में यह शब्द पशु के मृत शरीर को दर्शाता है; ‘लोथ’ मनुष्य के शव का अनावश्यक संकेत दिए बिना इसे संक्षेप और सटीक रूप से व्यक्त करता है।
- source_word: יְכַבֵּס בְּגָדָיו
  choice: अपने कपड़े धोए
  rationale: विधिक प्रसंग में अपूर्ण क्रिया आदेशात्मक दायित्व व्यक्त करती है। ‘अपने कपड़े धोए’ आधुनिक हिन्दी में स्वाभाविक है और एकवचन निर्देश बनाए रखता है।
- source_word: וְטָמֵא
  choice: और ... अशुद्ध रहे
  rationale: यह खंड उस व्यक्ति की परिणामी शुद्धता-संबंधी स्थिति बताता है। ‘अशुद्ध रहे’ अवधि के बने रहने का भाव स्पष्ट करता है, बिना मुख्य पाठ में ‘अनुष्ठानिक’ जोड़ने के।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: यह हिन्दी में समय-सीमा बताने का स्वाभाविक और स्रोत के अनुरूप रूप है।
- source_word: הַנֹּשֵׂא
  choice: जो ... उठाए
  rationale: संज्ञात्मक कृदंत पहले खंड के समान किसी भी ऐसे व्यक्ति को दर्शाता है जो लोथ को उठाए या ले चले; ‘जो ... उठाए’ समानांतर कानूनी संरचना बनाए रखता है।
- source_word: אֶת נִבְלָתָהּ
  choice: उसकी लोथ
  rationale: प्रत्यक्ष कर्म-सूचक के बाद प्रत्यययुक्त संज्ञा को हिन्दी में स्वाभाविक रूप से ‘उसकी लोथ’ कहा गया है।
theological_decisions:
- issue: अशुद्धता का स्वरूप
  choice: मुख्य पाठ में טָמֵא के लिए केवल ‘अशुद्ध’
  alternative: ‘अनुष्ठानिक रूप से अशुद्ध’ अथवा ‘विधिगत रूप से अशुद्ध’
  rationale: प्रसंग इस्राएल की शुद्धता-विधियों का है, पर मूल इब्रानी में अलग से ‘अनुष्ठानिक’ शब्द नहीं है। इसलिए मुख्य पाठ स्रोत की संक्षिप्तता रखता है और सांस्कृतिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- issue: विधिक कृदंत में लिंग और संख्या
  choice: एकवचन ‘जो ... वह’ तथा ‘अपने कपड़े’
  alternative: बहुवचन या स्पष्ट पुरुषवाचक रूप
  rationale: इब्रानी में एकवचन पुल्लिंग रूप सामान्य प्रतिनिधिक कानूनी प्रयोग है। हिन्दी की ‘जो ... वह’ संरचना संख्या को बनाए रखते हुए किसी भी लागू व्यक्ति को स्वाभाविक रूप से समेटती है और स्रोत से बाहर लिंग पर अतिरिक्त बल नहीं देती।
translation_notes:
  register: आधुनिक मानक हिन्दी की सरल, गरिमापूर्ण विधिक शैली अपनाई गई है। दोनों समानांतर खंडों में ‘जो ... वह’ की रचना रखी गई है। ‘लोथ’ पशु के मृत शरीर के लिए संक्षिप्त और प्रसंगानुकूल है; अंशवाचक अर्थ को मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित रखा गया है।
