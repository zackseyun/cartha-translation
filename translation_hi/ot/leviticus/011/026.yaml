base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/026.yaml
  text: As for every animal that has a divided hoof[a], but does not split the hoof completely and does not chew the cud, they are unclean to you. Everyone who touches them shall be unclean.
translation:
  language: hi
  text: 'हर उस पशु के विषय में जिसका खुर तो चिरा हुआ है, पर पूरी तरह बँटा नहीं है[a], और जो जुगाली नहीं करता: वह तुम्हारे लिए अशुद्ध है। जो कोई उसे छुएगा, वह अशुद्ध हो जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ एक ही मूल की संज्ञा और क्रिया साथ प्रयुक्त हुई हैं; इससे खुर के पूरी तरह चिरे होकर दो भागों में बँटने पर बल पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הַבְּהֵמָה
  choice: हर उस पशु के विषय में
  rationale: לְ यहाँ विचाराधीन वर्ग को सामने लाता है। यह हिंदी में उसकी विषयसूचक शक्ति को स्वाभाविक ढंग से व्यक्त करता है; בְּהֵמָה के लिए व्यापक और सहज शब्द ‘पशु’ चुना गया है।
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: जिसका खुर चिरा हुआ तो है
  rationale: यह पदबंध चिरे हुए खुर की दशा बताता है। ‘तो है’ आगे आने वाले विरोध—पर पूरा विभाजन न होना—को हिंदी में स्पष्ट करता है।
- source_word: וְשֶׁסַע אֵינֶנָּה שֹׁסַעַת
  choice: पर पूरी तरह दो भागों में बँटा नहीं है
  rationale: सजातीय संज्ञा-क्रिया का प्रयोग खुर के पूर्ण रूप से फटे या दो भागों में विभाजित होने पर बल देता है। यह चयन उस बल को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: וְגֵרָה אֵינֶנָּה מַעֲלָה
  choice: और जो जुगाली नहीं करता
  rationale: इब्रानी मुहावरा शाब्दिक रूप से जुगाली को ऊपर लाने की बात करता है; ‘जुगाली करना’ इसका प्रचलित और सटीक हिंदी प्राणी-विज्ञान संबंधी समतुल्य है।
- source_word: טְמֵאִים הֵם לָכֶם
  choice: वे तुम्हारे लिए अशुद्ध हैं
  rationale: बहुवचन ‘वे’ मूल पाठ के הֵם को सुरक्षित रखता है, जबकि ‘तुम्हारे लिए’ לָכֶם के विधान-संबंधी दृष्टिकोण को बनाए रखता है। लैव्यव्यवस्था के शुद्धता-विधान में טָמֵא के लिए ‘अशुद्ध’ स्वाभाविक है।
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: जो कोई उन्हें छुएगा
  rationale: כָּל के साथ एकवचन कृदंत सामान्य नियम व्यक्त करता है; ‘जो कोई’ हिंदी में उसी व्यापक अर्थ को सहजता से देता है।
- source_word: יִטְמָא
  choice: वह अशुद्ध हो जाएगा
  rationale: यहाँ अपूर्ण क्रिया विधान के परिणामस्वरूप आने वाली अवस्था बताती है। ‘अशुद्ध हो जाएगा’ उस परिणामी परिवर्तन को स्पष्ट रखता है।
theological_decisions:
- issue: लैव्यव्यवस्था के विधान में शुद्धता-संबंधी शब्दावली
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: यह पद अनुष्ठानिक शुद्धता की श्रेणी बताता है, अनिवार्यतः नैतिक दोष नहीं। ‘अशुद्ध’ उस भेद को बनाए रखता है और आधुनिक हिंदी में स्पष्ट है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य में एकवचन ‘हर उस पशु’ के बाद मूल इब्रानी के बहुवचन ‘वे’ को बनाए रखा गया है, क्योंकि कथन पूरे वर्ग पर लागू होता है।
