  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַתִּנְשֶׁמֶת
  choice: उल्लू
  rationale: इस पक्षी की सटीक पहचान अनिश्चित है; 'उल्लू' एक पारंपरिक और सामान्यतः समझ में आने वाला व्यापक नाम है, जो स्रोत की अनिश्चितता को अनावश्यक विशिष्टता से नहीं ढकता।
- source_word: הַקָּאָת
  choice: हवासिल
  rationale: यह शब्द प्रायः पेलिकन के लिए समझा जाता है; आधुनिक मानक हिन्दी में उसका प्रचलित नाम 'हवासिल' है।
- source_word: הָרָחָם
  choice: गिद्ध
  rationale: यह संभवतः किसी विशेष प्रकार के गिद्ध, अक्सर मिस्री गिद्ध, को सूचित करता है; किन्तु प्रजाति की पहचान पूरी तरह निश्चित न होने से व्यापक और स्वाभाविक 'गिद्ध' चुना गया है।
