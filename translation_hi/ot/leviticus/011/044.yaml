source:
  edition: WLC
  text: כִּ֣י אֲנִ֣י יְהוָה֮ אֱלֹֽהֵי/כֶם֒ וְ/הִתְקַדִּשְׁתֶּם֙ וִ/הְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָ֑נִי וְ/לֹ֤א תְטַמְּאוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הָ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/044.yaml
  text: For I am Yahweh your God[a]. Consecrate yourselves therefore, and be holy, for I am holy[b]. And you shall not defile yourselves with any swarming thing that moves on the earth.
translation:
  language: hi
  text: क्योंकि मैं याहवे, तुम्हारा परमेश्वर हूँ। इसलिए अपने आप को पवित्र करो[a] और पवित्र बनो, क्योंकि मैं पवित्र हूँ। धरती पर रेंगनेवाले किसी भी जीव से अपने आप को अशुद्ध न करना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आप को पवित्र ठहराओ।” हिब्रू क्रिया आत्मवाचक है और अपने आप को पवित्रता के लिए अलग करने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में “रेंगनेवाला जीव” के लिए प्रयुक्त शब्द छोटे, झुंडों में चलने या उमड़ने वाले जीवों को भी सूचित कर सकता है। “अपने आप को” का शाब्दिक रूप “अपने प्राणों को” है; यहाँ उसका अर्थ व्यक्ति स्वयं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसके प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: याहवे के साथ वाचा-सूत्र में यह एकवचन अर्थ रखता है; हिन्दी में आदरसूचक और प्रचलित पद ‘परमेश्वर’ स्वाभाविक है।
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: अपने आप को पवित्र करो
  rationale: हित्पएल रूप का आत्मवाचक अर्थ स्पष्ट करता है—लोग स्वयं को पवित्रता के लिए अलग करें। ‘अभिषिक्त/संस्कारित करो’ जैसे विकल्प अनावश्यक रूप से संकीर्ण धार्मिक अर्थ दे सकते हैं।
- source_word: וִהְיִיתֶם קְדֹשִׁים
  choice: और पवित्र बने रहो
  rationale: आदेशात्मक संदर्भ में अपेक्षित अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है और पहले खंड से परिणामात्मक संबंध बनाए रखता है।
- source_word: קָדוֹשׁ
  choice: पवित्र
  rationale: परमेश्वर और प्रजा दोनों के लिए एक ही शब्द रखकर मूल के קדשׁ शब्द-समूह और उसके धर्मवैचारिक संबंध को सुरक्षित रखा गया है।
- source_word: תְטַמְּאוּ אֶת נַפְשֹׁתֵיכֶם
  choice: अपने आप को अशुद्ध न करना
  rationale: נַפְשֹׁתֵיכֶם यहाँ पूरे व्यक्तियों का संकेत करता है, किसी तकनीकी देह-आत्मा विभाजन का नहीं; ‘अशुद्ध’ धार्मिक और नैतिक अपवित्रता दोनों के लिए उपयुक्त है।
- source_word: שֶּׁרֶץ הָרֹמֵשׂ
  choice: रेंगनेवाला कोई भी जीव
  rationale: दोनों निकटवर्ती गतिसूचक पदों को शब्दशः दोहराने से हिन्दी अस्वाभाविक होती; यह चयन भूमि पर सरकने/रेंगने वाले जीवों का संदर्भ स्पष्ट करता है, जबकि शׁרץ की ‘बहुतायत से चलने/उमड़ने’ की छाया पादटिप्पणी में दी गई है।
- source_word: עַל הָאָרֶץ
  choice: धरती पर
  rationale: स्थलीय गति को सरल और स्वाभाविक हिन्दी में व्यक्त करता है; ‘भूमि पर’ भी संभव है।
theological_decisions:
- issue: परमेश्वर की पवित्रता और इस्राएल की अपेक्षित पवित्रता का संबंध
  choice: दोनों के लिए ‘पवित्र’ शब्द बनाए रखा गया
  alternative: लोगों के लिए ‘अलग किए हुए’ और परमेश्वर के लिए ‘पवित्र’
  rationale: एक ही קדשׁ शब्द-समूह की पुनरावृत्ति इस आदेश को परमेश्वर के अपने चरित्र में आधारित करती है; अलग-अलग शब्द उस संबंध को कमजोर कर देते।
- issue: נַפְשֹׁתֵיכֶם का मानव-स्वरूप संबंधी अर्थ
  choice: ‘अपने आप को’
  alternative: ‘अपने प्राणों/आत्माओं को’
  rationale: यहाँ निषिद्ध जीवों से व्यक्ति के अशुद्ध होने की बात है। ‘आत्माओं’ कहने से ऐसा देह-आत्मा भेद आ सकता है जिसे यह वाक्य स्वयं स्थापित नहीं करता।
- issue: निषेध का बल
  choice: ‘अशुद्ध न करना’
  alternative: ‘अशुद्ध नहीं करोगे’
  rationale: हिब्रू अपूर्ण क्रिया के निषेधात्मक आदेश को हिन्दी में स्पष्ट आज्ञा के रूप में रखा गया है, बिना उसे केवल भविष्यवाणी बना देने के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण आज्ञात्मक शैली में रखी गई है। ‘याहवे’ को नाम के रूप में और ‘परमेश्वर’ को उपाधि के रूप में अलग रखा गया है। ‘पवित्र’ की पुनरावृत्ति जानबूझकर सुरक्षित है।
