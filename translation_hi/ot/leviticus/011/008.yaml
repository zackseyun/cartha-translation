  choice: ‘अशुद्ध’ को अनुष्ठानिक/विधिक श्रेणी के रूप में रखा गया है।
  alternative: ‘अपवित्र’ कहना, जिससे नैतिक दोष का अर्थ अधिक उभर सकता है।
  rationale: पद इस्राएल की शुद्धता-व्यवस्था की भाषा बोलता है; अनुवाद बाद की वाचा-संबंधी प्रयोज्यता या नैतिक बुराई के प्रश्न का निर्णय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा विधिक निषेध रखा गया है। ‘कुछ भी’ अंशसूचक מִן को स्वाभाविक ढंग से व्यक्त करता है। पाद-टिप्पणी का चिह्न उसी पदांश पर रखा गया है जिसका वह स्पष्टीकरण करती है।
