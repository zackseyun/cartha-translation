  text: तुम उनके मांस में से कुछ भी न खाओ और उनके मृत शरीरों[a] को न छुओ; वे तुम्हारे लिए अशुद्ध हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनकी लाशों।’ इब्रानी शब्द मृत पशु के शरीर को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּשָׂרָם
  choice: उनके मांस में से कुछ भी
  rationale: 'מִן के अंशसूचक भाव को स्वाभाविक हिन्दी में स्पष्ट करता है: उनके मांस का कोई भी भाग नहीं खाना है।'
- source_word: לֹא תֹאכֵלוּ
  choice: न खाना
  rationale: विधिक प्रसंग में यह बहुवचन निषेध को स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וּבְנִבְלָתָם
  choice: उनके मरे हुए शरीरों
  rationale: נְבֵלָה यहाँ मरे हुए पशु के शरीर को सूचित करता है। यह सामान्य पाठक के लिए ‘लोथों’ से अधिक सहज है और पशु-संदर्भ को बनाए रखता है।
- source_word: לֹא תִגָּעוּ
  choice: न छूना
  rationale: נגע का सीधा अर्थ ‘छूना’ है; अनुष्ठानिक परिणाम को अनावश्यक रूप से अनुवाद में नहीं जोड़ा गया।
- source_word: טְמֵאִים
  choice: अशुद्ध
  rationale: लैव्यव्यवस्था के शुद्धता-विधान में טָמֵא की स्थापित धार्मिक-अनुष्ठानिक श्रेणी को व्यक्त करता है, बिना इसे नैतिक बुराई बताने के।
- source_word: הֵם לָכֶם
  choice: वे तुम्हारे लिए अशुद्ध हैं
  rationale: לָכֶם के संबंधसूचक भाव को निकटता से रखता है और इस्राएल के लिए इन पशुओं की अशुद्ध स्थिति बताता है।
theological_decisions:
