  to: किसी भी रेंगनेवाले जीव से, जो रेंगता-फिरता है,[a] अपने आपको घृणित न बनाओ। उनके कारण अपने आपको अशुद्ध न करो, ऐसा न हो कि तुम उनके कारण अशुद्ध हो जाओ।
