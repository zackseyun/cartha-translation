  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण आज्ञार्थक शैली। ‘घिनौना’ और ‘अशुद्ध’ को अलग रखकर मूल के दो भिन्न शब्दों का भेद सुरक्षित किया गया है।
