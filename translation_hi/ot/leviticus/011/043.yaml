source:
  edition: WLC
  text: אַל תְּשַׁקְּצוּ֙ אֶת נַפְשֹׁ֣תֵי/כֶ֔ם בְּ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֑ץ וְ/לֹ֤א תִֽטַּמְּאוּ֙ בָּ/הֶ֔ם וְ/נִטְמֵתֶ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/043.yaml
  text: Do not make yourselves detestable by any swarming thing that swarms[a], and do not make yourselves unclean by them, so that you do not become unclean by them.
translation:
  language: hi
  text: किसी भी रेंगनेवाले जीव से, जो रेंगता-फिरता है,[a] अपने आपको घृणित न बनाओ। उनके कारण अपने आपको अशुद्ध न करो, ऐसा न हो कि तुम उनके कारण अशुद्ध हो जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी भी बहुतायत में चलने-फिरनेवाले छोटे जीव से।” हिब्रू शब्द छोटे जीवों की उस व्यापक श्रेणी को दर्शाता है जो बहुतायत में चलते-फिरते या रेंगते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: अपने आप को घिनौना न बनाना
  rationale: शׁקץ का अर्थ घिनौना या घृणित ठहरना/बनाना है। कर्म נַפְשֹׁתֵיכֶם होने से आत्मवाचक अर्थ रखा गया है; इसे ‘अशुद्ध’ कहना आगे आए טמא से भेद मिटा देता।
- source_word: נַפְשֹׁתֵיכֶם
  choice: अपने आप को
  rationale: यहाँ נֶפֶשׁ पूरे व्यक्ति या स्वयं को दर्शाता है; ‘अपनी आत्माओं को’ आधुनिक हिन्दी में अनावश्यक रूप से केवल आत्मिक पक्ष का संकेत देता।
- source_word: בְּכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: किसी भी रेंगनेवाले जीव से, जो रेंगता-फिरता है
  rationale: שׁרץ छोटे, बहुतायत में चलने-फिरने या रेंगनेवाले जीवों की व्यापक श्रेणी है। हिन्दी में ‘रेंगनेवाला जीव’ सहज श्रेणी-संज्ञा है और ‘रेंगता-फिरता’ मूल की पुनरुक्ति को यथासंभव बचाता है।
- source_word: תִטַּמְּאוּ
  choice: अपने आप को अशुद्ध न करना
  rationale: आत्मवाचक रूप को स्पष्ट रखा गया है और लैव्यव्यवस्था की शुद्ध-अशुद्ध संबंधी शब्दावली के लिए ‘अशुद्ध’ स्वाभाविक तथा स्थापित है।
- source_word: בָּהֶם / בָּם
  choice: उनके कारण
  rationale: בְּ यहाँ माध्यम या कारण व्यक्त करता है। ‘उनके कारण’ हिन्दी में स्पष्ट करता है कि ये जीव अशुद्धता लगने का माध्यम हैं।
- source_word: וְנִטְמֵתֶם
  choice: नहीं तो तुम ... अशुद्ध हो जाओगे
  rationale: निषेधों के बाद यह परिणाम की चेतावनी के रूप में स्वाभाविक है। ‘नहीं तो’ समन्वयी וְ के प्रसंगगत परिणामार्थ को व्यक्त करता है, बिना उसे कठोर उद्देश्यवाचक अर्थ देने के।
theological_decisions:
- issue: पवित्रता-विधान में טמא की शब्दावली
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: यहाँ शब्द वाचा-संबंधी विधिक/अनुष्ठानिक अशुद्धता बताता है। ‘अशुद्ध’ हिन्दी पाठकों के लिए स्पष्ट है और अपने आप नैतिक अपराध का अतिरिक्त अर्थ नहीं जोड़ता।
- issue: अंतिम वाक्यांश का संबंध
  choice: परिणाम की चेतावनी—‘नहीं तो ... अशुद्ध हो जाओगे’
  alternative: उद्देश्य/परिणाम—‘ताकि तुम ... अशुद्ध न हो जाओ’
  rationale: हिब्रू וְנִטְמֵתֶם शाब्दिक रूप से समन्वित है और निषेध के बाद चेतावनीस्वरूप परिणाम बता सकता है। हिन्दी में ‘नहीं तो’ इस संबंध को स्वाभाविक रूप से रखता है, जबकि मूल की अस्पष्टता को किसी विशिष्ट धर्मवैज्ञानिक उद्देश्य में नहीं बदलता।
