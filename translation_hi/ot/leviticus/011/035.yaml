source:
  edition: WLC
  text: וְ֠/כֹל אֲשֶׁר יִפֹּ֨ל מִ/נִּבְלָתָ֥/ם עָלָי/ו֮ יִטְמָא֒ תַּנּ֧וּר וְ/כִירַ֛יִם יֻתָּ֖ץ טְמֵאִ֣ים הֵ֑ם וּ/טְמֵאִ֖ים יִהְי֥וּ לָ/כֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/035.yaml
  text: And anything on which any part of their carcass falls shall become unclean[a]. Whether oven or hearth, it must be broken down; they are unclean[b], and they shall be unclean for you.
translation:
  language: hi
  text: और जिस किसी वस्तु पर उनके मरे हुए शरीर का कोई भाग गिर पड़े, वह अशुद्ध हो जाएगी। तंदूर हो या चूल्हा[a], उन्हें तोड़ दिया जाए; वे अशुद्ध हैं और तुम्हारे लिए अशुद्ध रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘चूल्हा’ खाना पकाने की किसी स्थायी संरचना को दर्शाता है; इब्रानी शब्द का अर्थ बर्तन रखने वाला चूल्हा, अंगीठी या भट्ठी-सदृश व्यवस्था भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: נִבְלָתָם
  choice: उनकी लोथ
  rationale: नְבֵלָה मरे हुए पशु की देह या लोथ को दर्शाता है, विशेषकर शुद्धता-विधि के संदर्भ में। हिंदी में ‘लोथ’ पशु के मृत शरीर के लिए संक्षिप्त और सटीक है।
- source_word: יִפֹּל
  choice: गिरे
  rationale: यह अपूर्ण क्रिया विधिक सामान्य स्थिति व्यक्त करती है; ‘गिरे’ हिंदी में ऐसी शर्त के लिए स्वाभाविक है।
- source_word: עָלָיו יִטְמָא
  choice: जिस ... पर ... गिरे, वह अशुद्ध हो जाएगी
  rationale: यह उस वस्तु की परिणामी अशुद्ध अवस्था स्पष्ट करता है जिस पर लोथ का कोई भाग गिरता है।
- source_word: תַּנּוּר
  choice: तंदूर
  rationale: यह रोटी पकाने के मिट्टी के तंदूर को दर्शाता है; हिंदी में ‘तंदूर’ प्राचीन घरेलू संरचना के लिए सहज और सटीक है।
- source_word: כִירַיִם
  choice: चूल्हा
  rationale: यह खाना पकाने की संरचना, संभवतः बर्तन टिकाने वाले चूल्हे या अंगीठी-सदृश व्यवस्था, को दर्शाता है। ‘चूल्हा’ सामान्य पाठक के लिए स्वाभाविक है, जबकि इसकी संभावित व्यापकता पाद-टिप्पणी में दी गई है।
- source_word: יֻתָּץ
  choice: उसे तोड़ दिया जाए
  rationale: निष्क्रिय रूप दूषित पकाने की संरचना को तोड़ने की विधिक अनिवार्यता दर्शाता है; यह हिंदी में स्पष्ट है और मिट्टी की संरचनाओं के अनुकूल है।
- source_word: טְמֵאִים הֵם
  choice: वे अशुद्ध हैं
  rationale: बहुवचन मूल के अनुरूप तंदूर और चूल्हे दोनों के विषय में अशुद्धता कही गई है।
- source_word: וּטְמֵאִים יִהְיוּ לָכֶם
  choice: तुम्हारे लिए अशुद्ध ही रहेंगे
  rationale: לָכֶם इस्राएली श्रोताओं के संबंध में इन वस्तुओं की स्थिति बताता है। ‘ही रहेंगे’ दोहराव का बल और स्थायी माने जाने वाली स्थिति स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: लैव्यव्यवस्था में अशुद्धता की प्रकृति
  choice: मुख्य पाठ में טמא को ‘अशुद्ध’ रखा गया है।
  alternative: रीति के अनुसार अशुद्ध; धार्मिक विधि की दृष्टि से अशुद्ध
  rationale: संदर्भ धार्मिक-विधिक अशुद्धता का है, नैतिक बुराई का नहीं। फिर भी ‘अशुद्ध’ प्रमुख बाइबलीय शब्दावली बनाए रखता है और संदर्भ से इसका विधिक अर्थ स्पष्ट होता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘तंदूर’ और ‘चूल्हा’ घरेलू पकाने की प्राचीन संरचनाओं को सामान्य पाठक के लिए स्पष्ट रखते हैं। मूल के बहुवचन ‘वे’ को बनाए रखा गया है।
