  text: וְ/הַ/נֹּשֵׂא֙ אֶת נִבְלָתָ֔/ם יְכַבֵּ֥ס בְּגָדָ֖י/ו וְ/טָמֵ֣א עַד הָ/עָ֑רֶב טְמֵאִ֥ים הֵ֖מָּה לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/028.yaml
  text: Whoever carries their carcass shall wash his clothes and be unclean until the evening[a]. They are unclean for you.
translation:
  language: hi
  text: और जो कोई उनका शव[a] उठाए, वह अपने कपड़े धोए और शाम तक अशुद्ध रहे। वे तुम्हारे लिए अशुद्ध हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे वितरणात्मक अर्थ में ‘उनमें से किसी का शव’ भी समझा जा सकता है। इब्रानी में ‘उनका’ बहुवचन है, जबकि ‘शव’ एकवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּשֵׂא
  choice: और जो कोई … उठाए
  rationale: संज्ञीकृत कृदंत सामान्य कानूनी नियम व्यक्त करता है। ‘जो कोई’ इस व्यापक अर्थ को स्वाभाविक हिन्दी में रखता है; ‘उठाए’ में शव को उठाने या ले जाने का भाव समाहित है।
- source_word: נִבְלָתָם
  choice: उनका शव
  rationale: נְבֵלָה पशु के मृत शरीर या शव को दर्शाता है। एकवचन संज्ञा के साथ बहुवचन संबंधसूचक प्रत्यय को ‘उनका शव’ के रूप में रखा गया है, जिससे मूल की सामूहिक अथवा वितरणात्मक अस्पष्टता बनी रहती है।
- source_word: יְכַבֵּס בְּגָדָיו
  choice: वह अपने कपड़े धोए
  rationale: इस विधिक प्रसंग में अपूर्ण क्रिया आदेशात्मक दायित्व बताती है। ‘कपड़े धोए’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: וְטָמֵא
  choice: और … अशुद्ध रहे
  rationale: यह संपर्क के फलस्वरूप बनी रहने वाली अनुष्ठानिक स्थिति बताता है। ‘अशुद्ध रहे’ अवधि के साथ स्वाभाविक बैठता है और नैतिक दोष का अर्थ नहीं जोड़ता।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: यह समय-सीमा का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: טְמֵאִים הֵמָּה לָכֶם
  choice: वे तुम्हारे लिए अशुद्ध हैं
  rationale: यह पहले बताए गए पशुओं की स्थिति का सार है। ‘तुम्हारे लिए’ לָכֶם को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: अनुष्ठानिक अशुद्धता की शब्दावली
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: लैव्यव्यवस्था के शुद्धता-संबंधी नियमों में טמא एक तकनीकी अनुष्ठानिक श्रेणी है। ‘अशुद्ध’ इसे नैतिक अपराध या पाप के रूप में प्रस्तुत किए बिना लगातार व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, विधिक प्रसंग के अनुरूप संक्षिप्त और गरिमापूर्ण रखी गई है। ‘जो कोई’ सामान्य नियम को और ‘वह … धोए’ उसके दायित्व को स्पष्ट करता है।
