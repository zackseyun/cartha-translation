base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/002.yaml
  text: Speak to the sons of Israel[a], saying[c][b], ‘These are the living creatures that you may eat from among all the animals that are on the earth.’
translation:
  language: hi
  text: “इस्राएल के पुत्रों[a] से कहो, ‘धरती[c] पर रहने वाले सब पशुओं में से ये वे जीव हैं जिन्हें तुम खा सकते हो[b]।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों” है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में शाब्दिक रूप एकवचन है: “यह वह जीव है जिसे तुम खा सकते हो”; यहाँ ‘जीव’ सामूहिक अर्थ में है और आगे विभिन्न जीवों की श्रेणियाँ दी गई हैं।'
    reason: lexical_alternative
  - marker: c
    text: या “भूमि पर।” यह वाक्यांश इस अध्याय में स्थल पर रहने वाले जीवों को अन्य श्रेणियों से अलग करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: कहो
  rationale: यह דבר का बहुवचन आज्ञार्थक रूप है, जो प्रसंग में मूसा और हारून को संबोधित है। आधुनिक हिन्दी में ‘से कहो’ निर्देश और आगामी प्रत्यक्ष वचन को स्वाभाविक रूप से जोड़ता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल इब्रानी पारिवारिक अभिव्यक्ति का सीधा अर्थ सुरक्षित रखा गया है; इसका सामूहिक अर्थ ‘इस्राएली’ भी हो सकता है।
- source_word: לֵאמֹר
  choice: से कहो
  rationale: यह प्रत्यक्ष कथन का परिचय देने वाला प्रचलित इब्रानी कथन-सूचक रूप है। हिन्दी में अलग से ‘यह कहते हुए’ जोड़ना बोझिल होता, इसलिए इसे मुख्य क्रिया के साथ स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: זֹאת הַחַיָּה
  choice: ये वे जीव हैं
  rationale: זֹאת और חַיָּה रूप में एकवचन हैं, पर यहाँ सामूहिक और वर्गीकरणात्मक अर्थ रखते हैं तथा आगे अनेक जीवों की सूची आती है। हिन्दी बहुवचन इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר תֹּאכְלוּ
  choice: जिन्हें तुम खा सकते हो
  rationale: विधिक प्रसंग में अपूर्ण क्रिया अनुमत आहार बताती है; ‘खा सकते हो’ अनुमति का अर्थ स्पष्ट करता है, केवल भविष्यकाल नहीं।
- source_word: מִכָּל
  choice: सब ... में से
  rationale: מן के साथ כל बड़े समूह में से चयन का अंशवाचक अर्थ देता है।
- source_word: הַבְּהֵמָה
  choice: पशुओं
  rationale: यहाँ शब्द स्थल पर रहने वाले पशुओं की व्यापक श्रेणी को दर्शाता है; ‘पशु’ आधुनिक हिन्दी में स्पष्ट और पर्याप्त व्यापक है।
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: धरती पर पाए जाने वाले
  rationale: यह स्थलचर प्राणियों को अध्याय में आगे आने वाले जलचर वर्गों से अलग करता है। ‘धरती पर’ मूल के निकट है और ‘पाए जाने वाले’ हिन्दी में स्वाभाविक संबंधवाचक अभिव्यक्ति है।
