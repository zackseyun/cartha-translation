source:
  edition: WLC
  text: לְ/הַבְדִּ֕יל בֵּ֥ין הַ/טָּמֵ֖א וּ/בֵ֣ין הַ/טָּהֹ֑ר וּ/בֵ֤ין הַֽ/חַיָּה֙ הַֽ/נֶּאֱכֶ֔לֶת וּ/בֵין֙ הַֽ/חַיָּ֔ה אֲשֶׁ֖ר לֹ֥א תֵאָכֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/047.yaml
  text: to distinguish between the unclean and the clean[a], and between the creature that may be eaten and the creature that may not be eaten.
translation:
  language: hi
  text: अशुद्ध और शुद्ध के बीच, तथा जिस प्राणी को खाने की अनुमति है और जिस प्राणी को खाने की अनुमति नहीं है, उनके बीच भेद करने के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַבְדִּיל
  choice: भेद करने के लिए
  rationale: हिफ़ील क्रिया का यह रूप पिछले संदर्भ से जुड़े उद्देश्य को व्यक्त करता है। ‘भेद करने’ से व्यवस्था के अनुसार पहचानने का भाव स्वाभाविक रूप से आता है।
- source_word: בֵּין ... וּבֵין
  choice: '... में ... और ... में'
  rationale: इब्रानी में दो समानांतर विरोधी युग्म हैं। हिंदी में ‘अशुद्ध और शुद्ध में’ तथा ‘उस प्राणी में... तथा उस प्राणी में...’ इस संरचना और समानांतरता को स्पष्ट रखते हैं।
- source_word: הַטָּמֵא / הַטָּהֹר
  choice: अशुद्ध / शुद्ध
  rationale: ये लैव्यव्यवस्था में विधिक-अनुष्ठानिक श्रेणियाँ हैं। यह जोड़ी इनके पारिभाषिक विरोध को बनाए रखती है और नैतिक बुराई का अतिरिक्त अर्थ नहीं जोड़ती।
- source_word: הַחַיָּה
  choice: प्राणी
  rationale: यह शब्द यहाँ जीव या पशु को सूचित कर सकता है। ‘प्राणी’ व्यापक है और केवल जंगली पशुओं तक अर्थ को सीमित नहीं करता।
- source_word: הַנֶּאֱכֶלֶת
  choice: जिसे खाया जा सकता है
  rationale: निफ़अल कृदंत इस आहार-विधि के संदर्भ में उस प्राणी की ओर संकेत करता है जिसे खाना अनुमत है; यह अनुवाद केवल प्रचलित व्यवहार के बजाय उस विधिक भेद को व्यक्त करता है।
- source_word: אֲשֶׁר לֹא תֵאָכֵל
  choice: जिसे नहीं खाया जा सकता
  rationale: यह वाक्यांश निषिद्ध प्राणी को अनुमत प्राणी के विपरीत रखता है। हिंदी में यह समानांतर और सहज निषेध व्यक्त करता है।
theological_decisions:
- issue: लैव्यव्यवस्था में शुद्धता की शब्दावली
  choice: טָמֵא/טָהֹר का अनुवाद ‘अशुद्ध/शुद्ध’ किया गया है।
  alternative: अपवित्र/पवित्र
  rationale: यह पद आहार-संबंधी विधिक और अनुष्ठानिक वर्गीकरण का सार देता है। ‘अशुद्ध/शुद्ध’ स्रोत की श्रेणियों को रखता है, बिना यह कहे कि अशुद्ध प्राणी अपने आप में नैतिक रूप से बुरा है।
- issue: खाए जाने वाले प्राणी का विधिक भाव
  choice: ‘जिसे खाया जा सकता है’
  alternative: ‘जिसे खाया जाता है’ या ‘जो खाने योग्य है’
  rationale: संदर्भ अनुमति और निषेध के बीच भेद का है। चुना हुआ रूप इस विधिक भाव को स्पष्ट करता है, जबकि ‘खाया जाता है’ केवल व्यवहार भी बता सकता है और ‘खाने योग्य’ अंतर्निहित खाद्यता का अर्थ दे सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और विधिक संदर्भ के अनुरूप है। पद मूल में उद्देश्यसूचक वाक्यांश है, इसलिए हिंदी में भी ‘भेद करने के लिए’ के साथ उसका खंडात्मक स्वरूप बनाए रखा गया है।
