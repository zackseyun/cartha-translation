  text: וְ/כֹל֙ שֶׁ֣רֶץ הָ/ע֔וֹף אֲשֶׁר ל֖/וֹ אַרְבַּ֣ע רַגְלָ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/023.yaml
  text: But every winged swarming thing that has four feet is detestable to you[a][b].
translation:
  language: hi
  text: परन्तु हर पंखवाला रेंगनेवाला जीव, जिसके चार पैर हैं, तुम्हारे लिए घिनौना है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: परन्तु हर
  rationale: पिछले पद में दी गई अनुमति के बाद וְ यहाँ विरोधसूचक संबंध व्यक्त करता है; כֹל का वितरणात्मक भाव ‘हर’ से स्पष्ट होता है।
- source_word: שֶׁרֶץ הָעֹוף
  choice: पंखवाला रेंगनेवाला जीव
  rationale: यह संयुक्त पद छोटे उड़ने या झुंड में पाए जाने वाले जीवों, विशेषतः कीटों, की व्यापक श्रेणी बताता है। ‘पंखवाला’ उड़ने की क्षमता और ‘रेंगनेवाला जीव’ पारंपरिक प्राणी-श्रेणी—दोनों को सहज हिन्दी में बनाए रखते हैं।
- source_word: אֲשֶׁר לוֹ
  choice: जिसके ... हैं
  rationale: यह अधिकार या शारीरिक विशेषता बताने वाली सामान्य सम्बन्धवाचक रचना है।
- source_word: אַרְבַּע רַגְלָיִם
  choice: चार पैर
  rationale: רַגְלָיִם का सामान्य हिन्दी समतुल्य ‘पैर’ है; स्रोत में कही गई संख्या को उसकी प्राणी-विज्ञान संबंधी जटिलता के बावजूद यथावत रखा गया है।
- source_word: שֶׁקֶץ הוּא לָכֶם
  choice: तुम्हारे लिए घिनौना है
  rationale: शुद्धता और आहार-विधि के प्रसंग में שֶׁקֶץ निषिद्ध और घृणित वस्तु को दर्शाता है। ‘घिनौना’ इसका प्रबल भाव रखता है, जबकि ‘तुम्हारे लिए’ इस्राएली श्रोताओं के प्रति विधिक निर्देश को सुरक्षित रखता है।
