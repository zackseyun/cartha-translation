  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּל֩ הוֹלֵ֨ךְ עַל גָּח֜ וְ/כֹ֣ל הוֹלֵ֣ךְ עַל אַרְבַּ֗ע עַ֚ד כָּל מַרְבֵּ֣ה רַגְלַ֔יִם לְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ לֹ֥א תֹאכְל֖וּ/ם כִּי שֶׁ֥קֶץ הֵֽם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/042.yaml
  text: Anything that goes on its belly[a], and anything that goes on four feet, even every creature with many feet, among all the swarming things that swarm on the earth—you shall not eat them[c][b], for they are detestable.
translation:
  language: hi
  text: धरती पर रेंगनेवाले सभी जीवों[b] में से जो अपने पेट के बल चलते हैं[a], जो चार पैरों पर चलते हैं, और जिनके बहुत-से पैर होते हैं—उन्हें तुम न खाना, क्योंकि वे घृणित हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पेट के बल रेंगते हैं।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “धरती पर रेंगनेवाला रेंगता जीव” जैसे एक ही मूल की पुनरुक्ति है, जो छोटे रेंगनेवाले जीवों के इस वर्ग पर बल देती है।
    reason: lexical_alternative
  - marker: c
    text: या, “वे घिनौनी वस्तुएँ हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הוֹלֵךְ עַל גָּח
  choice: जो कोई अपने पेट के बल चलता है
  rationale: यह इब्रानी की गति-विधि को निकटता से व्यक्त करता है; ‘रेंगता है’ संभव है, पर कुछ अधिक व्याख्यात्मक है।
- source_word: וְכֹל הוֹלֵךְ עַל אַרְבַּע
  choice: या चार पैरों पर चलता है
  rationale: ठोस इब्रानी चित्र को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: עַד כָּל מַרְבֵּה רַגְלַיִם
  choice: या जिसके बहुत-से पैर हैं
  rationale: עַד यहाँ श्रेणी को अनेक पैरों वाले जीवों तक समावेशी रूप से बढ़ाता है; हिन्दी में ‘या’ वर्गों की सूची को सहज बनाता है।
- source_word: לְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ עַל הָאָרֶץ
  choice: धरती पर रेंगनेवाले सभी जीवों में से
  rationale: संज्ञा और उसी धातु के कृदंत की पुनरुक्ति को शब्दशः दोहराने के बजाय वर्गीकरण का अर्थ स्पष्ट और स्वाभाविक हिन्दी में दिया गया है।
- source_word: לֹא תֹאכְלוּם
  choice: उसे तुम न खाना
  rationale: कानूनी निषेध की सीधी शक्ति को गरिमापूर्ण और समझने योग्य हिन्दी में व्यक्त करता है; एकवचन ‘उसे’ सूची के ‘जो कोई’ से मेल खाता है।
- source_word: שֶׁקֶץ
  choice: घृणित
  rationale: आहार-विधि के संदर्भ में धार्मिक रूप से वीभत्स या त्याज्य होने का प्रबल भाव देता है, बिना बाद की धर्मवैज्ञानिक धारणाएँ जोड़े।
theological_decisions:
- issue: पवित्रता-विधान में निषेध का स्वरूप
  choice: पद को सीधे आहार-संबंधी निषेध के रूप में प्रस्तुत किया गया है।
  alternative: इसे सार्वकालिक नैतिक आदेश घोषित करना, या केवल सांस्कृतिक वर्जना कहकर हल्का करना।
  rationale: इब्रानी पाठ लैव्यव्यवस्था की शुद्धता-विधि में प्रत्यक्ष निषेध देता है; अनुवाद इसके बाद के लागू होने पर किसी धर्मसैद्धांतिक विवाद का निर्णय नहीं करता।
- issue: שֶׁקֶץ का धार्मिक भाव
  choice: घृणित
  alternative: घिनौनी वस्तु; अत्यंत अशुद्ध
  rationale: ‘घृणित’ मूल की तीव्र अरुचि को सुरक्षित रखता है, जबकि ‘अशुद्ध’ इस पद के अलग शब्द को मिला सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण विधिक स्वर रखा गया है। ‘रेंगनेवाले जीव’ सामान्य पाठक के लिए बोधगम्य है; मुख्य पाठ में अनावश्यक तकनीकी प्राणिवैज्ञानिक शब्दावली से बचा गया है।
