  text: וְ/כָל כְּלִי חֶ֔רֶשׂ אֲשֶׁר יִפֹּ֥ל מֵ/הֶ֖ם אֶל תּוֹכ֑/וֹ כֹּ֣ל אֲשֶׁ֧ר בְּ/תוֹכ֛/וֹ יִטְמָ֖א וְ/אֹת֥/וֹ תִשְׁבֹּֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/033.yaml
  text: And every earthenware vessel into which any of them falls—everything that is in it shall become unclean[a], and you shall break it.
translation:
  language: hi
  text: और मिट्टी का हर बर्तन, जिसमें उनमें से कोई गिर जाए—उसके भीतर जो कुछ है, वह अशुद्ध हो जाएगा, और उस बर्तन को तुम तोड़ देना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּלִי חֶרֶשׂ
  choice: मिट्टी का बरतन
  rationale: כְּלִי किसी पात्र या बरतन को और חֶרֶשׂ पकाई हुई मिट्टी की सामग्री को दर्शाता है। आधुनिक हिन्दी में ‘मिट्टी का बरतन’ स्वाभाविक है और विधिक संदर्भ में सामग्री-विशेष को बनाए रखता है।
- source_word: יִפֹּל מֵהֶם
  choice: उनमें से कोई गिर जाए
  rationale: बहुवचन सर्वनाम पिछले संदर्भ में बताए गए अशुद्ध जीवों में से किसी एक की ओर संकेत करता है। ‘कोई’ हिब्रू के वितरणात्मक भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל תּוֹכוֹ
  choice: जिसमें
  rationale: תּוֹךְ बरतन के भीतर के भाग को दर्शाता है। सम्बन्धवाचक रचना ‘जिसमें’ हिन्दी में ‘उसके भीतर गिरने’ का अर्थ सहजता से देती है।
- source_word: כֹּל אֲשֶׁר בְּתוֹכוֹ
  choice: उसके भीतर जो कुछ है
  rationale: यह अभिव्यक्ति बरतन की समस्त सामग्री को समाविष्ट करती है और כֹּל की व्यापकता को बनाए रखती है।
- source_word: יִטְמָא
  choice: अशुद्ध हो जाएगा
  rationale: लैव्यव्यवस्था के शुद्धता-विधान में טמא के लिए ‘अशुद्ध’ मानक और स्पष्ट हिन्दी शब्द है। ‘हो जाएगा’ सम्पर्क के फलस्वरूप उत्पन्न अवस्था को व्यक्त करता है।
- source_word: וְאֹתוֹ תִשְׁבֹּרוּ
  choice: और उस बरतन को तुम तोड़ देना
  rationale: हिब्रू में कर्म को आगे रखकर बरतन पर बल दिया गया है। ‘उस बरतन को’ उस बल और सर्वनाम के स्पष्ट सन्दर्भ को सुरक्षित रखता है, जबकि ‘तोड़ देना’ आदेश को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मिट्टी का बरतन’ हिन्दी में स्पष्ट है; इसलिए अंग्रेज़ी की सामग्री-संबंधी वैकल्पिक पदावली वाली पादटिप्पणी आवश्यक नहीं मानी गई।
