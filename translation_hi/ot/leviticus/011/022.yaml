base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/022.yaml
  text: 'These of them you may eat: the locust according to its kind[a], and the bald locust according to its kind, and the cricket according to its kind, and the grasshopper according to its kind.'
translation:
  language: hi
  text: 'इनमें से तुम ये खा सकते हो: टिड्डे को उसकी जाति के अनुसार[a], सलआम को उसकी जाति के अनुसार, झींगुर को उसकी जाति के अनुसार, और छोटे टिड्डे को उसकी जाति के अनुसार।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहले नाम, “टिड्डे,” को छोड़कर इन हिब्रू कीट-नामों की सटीक पहचान अनिश्चित है। סָלְעָם का पारंपरिक अनुवाद कभी-कभी “गंजा टिड्डा,” חַרְגֹּל का “झींगुर,” और חָגָב का “छोटा टिड्डा” या “टिड्डा” किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מֵהֶם
  choice: इनमें से तुम इन्हें
  rationale: यह पद पहले बताए गए पंखवाले झुंड में चलनेवाले जीवों में से अनुमत जीवों का एक उपसमूह प्रस्तुत करता है। यह हिंदी प्रयोग उस चयनात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תֹּאכֵלוּ
  choice: खा सकते हो
  rationale: आहार-विधि के इस संदर्भ में अपूर्ण क्रिया अनुमति व्यक्त करती है, आदेश नहीं।
- source_word: הָאַרְבֶּה
  choice: टिड्डे
  rationale: אַרְבֶּה टिड्डे के लिए सामान्य और सर्वाधिक सुनिश्चित शब्द है।
- source_word: לְמִינוֹ / לְמִינֵהוּ
  choice: जाति-जाति के
  rationale: तोरा में बार-बार आनेवाले वर्गीकरण-सूत्र का स्वाभाविक हिंदी रूप है और प्रत्येक नाम के अंतर्गत उसकी विभिन्न जातियों को समेटता है।
- source_word: הַסָּלְעָם
  choice: सोलआम
  rationale: इस कीट की सटीक पहचान अनिश्चित है। पारंपरिक अनुमान को मुख्य पाठ में निश्चित तथ्य बनाने के बजाय हिब्रू नाम का लिप्यंतरण रखा गया है।
- source_word: הַחַרְגֹּל
  choice: झींगुर
  rationale: यह एक प्रचलित पारंपरिक समतुल्य है, यद्यपि सटीक प्राणीवैज्ञानिक पहचान अनिश्चित है; इस अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הֶחָגָב
  choice: छोटे टिड्डे
  rationale: חָגָב टिड्डे/फुदकनेवाले कीट के लिए प्रयुक्त होता है। उसी पद के אַרְבֶּה से हिंदी में भेद बनाए रखने के लिए 'छोटे टिड्डे' चुना गया है, पर सटीक पहचान का दावा नहीं किया गया।
