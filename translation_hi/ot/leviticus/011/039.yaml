base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/039.yaml
  text: And if any of the livestock that may be used for food dies[a], the one who touches its carcass shall be unclean until the evening.
translation:
  language: hi
  text: और यदि उन पशुओं में से, जो तुम्हारे लिए खाने योग्य हैं[a], कोई मर जाए, तो जो कोई उसके शव को छुए, वह शाम तक अशुद्ध हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “जो तुम्हारे लिए भोजन के लिए हैं।” इब्रानी वाक्यांश भोजन के लिए अनुमत पशुओं के वर्ग की पहचान करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: और यदि
  rationale: वाव पिछले नियमों से संबंध जोड़ता है और כִּי यहाँ शर्त प्रस्तुत करता है; इसलिए “और यदि” दोनों पक्षों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִן הַבְּהֵמָה
  choice: उन पशुओं में से ... कोई
  rationale: מִן का अंशवाचक अर्थ है—पूरे वर्ग में से कोई एक पशु। इस संदर्भ में בְּהֵמָה पालतू या चौपाए पशुओं के वर्ग को सूचित करता है; सामान्य पाठक के लिए “पशुओं” के साथ अंशवाचक रचना स्पष्ट है।
- source_word: אֲשֶׁר הִיא לָכֶם לְאָכְלָה
  choice: जो तुम्हारे लिए भोजन हैं
  rationale: यह निकट-औपचारिक अनुवाद पशुओं को भोजन के लिए निर्धारित या अनुमत वर्ग के रूप में पहचानता है, बिना केवल खाने की क्रिया तक अर्थ को सीमित किए।
- source_word: יָמוּת
  choice: मर जाए
  rationale: शर्तवाचक वाक्य में Qal अपूर्ण रूप को हिंदी में संभाव्य “मर जाए” स्वाभाविक और सटीक रूप से व्यक्त करता है।
- source_word: הַנֹּגֵעַ
  choice: जो कोई ... छुए
  rationale: संज्ञात्मक कृदंत उस प्रत्येक व्यक्ति को सूचित करता है जो यह कार्य करे; “जो कोई” हिंदी विधिक शैली में स्पष्ट है।
- source_word: בְּנִבְלָתָהּ
  choice: उसके शव को
  rationale: נְבֵלָה मरे हुए पशु के शरीर को सूचित करता है। हिंदी में पशु के लिए “शव” संक्षिप्त, गरिमापूर्ण और शुद्धता-विधि के संदर्भ में स्पष्ट है।
- source_word: יִטְמָא
  choice: अशुद्ध रहेगा
  rationale: क्रिया अनुष्ठानिक अशुद्धता की अवस्था में होने या आ जाने को व्यक्त करती है। समय-सीमा के साथ “अशुद्ध रहेगा” स्वाभाविक है और इसे नैतिक दोष नहीं बनाता।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: यह प्रचलित विधिक समय-सूत्र है; “शाम तक” आधुनिक हिंदी में सहज और अर्थ की दृष्टि से पूर्ण है।
theological_decisions:
- issue: अशुद्धता का स्वरूप
  choice: “अशुद्ध” शब्द को बिना अतिरिक्त व्याख्या के रखा गया
  alternative: “अनुष्ठानिक रूप से अशुद्ध”
  rationale: संदर्भ शुद्धता-विधि का है, पर मूल पद स्वयं विशेषण जोड़कर नैतिक और अनुष्ठानिक अशुद्धता में भेद नहीं बताता। मुख्य पाठ में विस्तार न करके मूल की संक्षिप्तता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी की सहज, गरिमापूर्ण विधिक शैली अपनाई गई है। “जो कोई,” “शव,” और “अशुद्ध रहेगा” सामान्य पाठक के लिए स्पष्ट हैं तथा मूल की शर्त, शुद्धता-विधि और समय-सीमा को बनाए रखते हैं।
