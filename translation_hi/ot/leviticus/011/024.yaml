base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/024.yaml
  text: 'And by these you shall become unclean: everyone who touches their carcass shall be unclean until the evening[a][b].'
translation:
  language: hi
  text: इनसे तुम अशुद्ध हो जाओगे:[a] जो कोई उनके मृत शरीर को छुएगा, वह शाम तक अशुद्ध रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इनके विषय में तुम अशुद्ध हो जाओगे।” आरम्भिक वाक्यांश अगली श्रेणी का सामान्य परिचय भी हो सकता है, न कि केवल अशुद्ध होने का साधन।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאֵלֶּה
  choice: इनसे
  rationale: लामेद उपसर्ग यहाँ अशुद्ध होने के साधन को व्यक्त कर सकता है; संक्षिप्त और स्वाभाविक हिन्दी में ‘इनसे’ यही अर्थ देता है। साथ ही, अधिक सामान्य विषय-सूचक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תִּטַּמָּאוּ
  choice: तुम अशुद्ध हो जाओगे
  rationale: यह रूप परिणामी धार्मिक/अनुष्ठानिक अशुद्धता बताता है, नैतिक दोष नहीं। ‘हो जाओगे’ क्रिया की परिणामवाचकता स्पष्ट करता है।
- source_word: כָּל הַנֹּגֵעַ
  choice: जो कोई ... छुएगा
  rationale: सहभागी रूप के सामान्य और सार्वभौमिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּנִבְלָתָם
  choice: उनकी लोथ
  rationale: נְבֵלָה मृत पशु के शव को दर्शाता है। ‘लोथ’ पशु-संदर्भ में सटीक और संक्षिप्त है; इब्रानी के एकवचन संज्ञा तथा बहुवचन संबंधसूचक प्रत्यय को भी बनाए रखता है।
- source_word: יִטְמָא
  choice: अशुद्ध रहेगा
  rationale: अगला काल-सीमा वाक्यांश अशुद्ध दशा की अवधि बताता है, इसलिए हिन्दी में ‘रहेगा’ स्वाभाविक है; इसका अर्थ नैतिक अपराध नहीं बल्कि अनुष्ठानिक अशुद्धता है।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: यह अशुद्धता की समय-सीमा को आधुनिक और स्वाभाविक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: पवित्रता-विधान में अशुद्धता का स्वरूप
  choice: טמא को अनुष्ठानिक अशुद्धता के रूप में ‘अशुद्ध’ कहना
  alternative: ‘अपवित्र’ या नैतिक रूप से दूषित समझना
  rationale: संदर्भ मृत पशु की लोथ छूने से उत्पन्न धार्मिक/अनुष्ठानिक दशा का है, नैतिक दोष का नहीं।
- issue: וּלְאֵלֶּה में संबंध का प्रकार
  choice: मुख्य पाठ में साधनवाचक ‘इनसे’
  alternative: विषय-सूचक ‘इनके विषय में’
  rationale: संदर्भ में इन जीवों अथवा उनकी लोथ के संपर्क से अशुद्धता उत्पन्न होती है, इसलिए साधनवाचक अर्थ उपयुक्त है; फिर भी इब्रानी संरचना अधिक सामान्य विषय-सूचक परिचय की अनुमति देती है, जिसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लोथ’ पशु के मृत शरीर के लिए सटीक है। पद के विधिक स्वर को बनाए रखते हुए अनावश्यक पुरातनता से बचा गया है।
