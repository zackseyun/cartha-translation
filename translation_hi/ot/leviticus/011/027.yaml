source:
  edition: WLC
  text: וְ/כֹ֣ל הוֹלֵ֣ךְ עַל כַּפָּ֗י/ו בְּ/כָל הַֽ/חַיָּה֙ הַ/הֹלֶ֣כֶת עַל אַרְבַּ֔ע טְמֵאִ֥ים הֵ֖ם לָ/כֶ֑ם כָּל הַ/נֹּגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָ֥א עַד הָ/עָֽרֶב׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/027.yaml
  text: And every one that walks on its paws, among all the animals that walk on four feet, they are unclean to you. Everyone who touches their carcass shall be unclean until the evening.
translation:
  language: hi
  text: और चार पैरों पर चलने वाले सभी पशुओं में से जो अपने पंजों के बल चलते हैं, वे तुम्हारे लिए अशुद्ध हैं।[a] उनकी मरी हुई देह[b] को छूने वाला हर व्यक्ति शाम तक अशुद्ध रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चारों पैरों के बल चलते हैं।”
    reason: हिब्रू अभिव्यक्ति का अधिक मुहावरेदार वैकल्पिक अनुवाद।
  - marker: b
    text: हिब्रू में “मरी हुई देह” के लिए संज्ञा एकवचन है, पर उसके साथ बहुवचन संबंधसूचक प्रत्यय है; इसका प्रयोग सामूहिक अर्थ में हुआ है।
    reason: मूल भाषा की एकवचन-सामूहिक रचना को स्पष्ट करना।
lexical_decisions:
- source_word: וְכֹל הוֹלֵךְ עַל כַּפָּיו
  choice: और जितने अपने पंजों के बल चलते हैं
  rationale: כַּף का मूल अर्थ हथेली या पादतल है, पर पशुओं के संदर्भ में ‘पंजे’ स्वाभाविक और सटीक है। एकवचन कृदंत का वर्गसूचक अर्थ हिन्दी में ‘जितने...चलते हैं’ से स्पष्ट होता है।
- source_word: בְּכָל הַחַיָּה הַהֹלֶכֶת עַל אַרְבַּע
  choice: चार पैरों पर चलने वाले सभी पशुओं में से
  rationale: यहाँ חַיָּה आहार-विधि के संदर्भ में स्थल-पशुओं को दर्शाता है। ‘में से’ वर्ग के भीतर उपवर्ग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: טְמֵאִים הֵם לָכֶם
  choice: वे तुम्हारे लिए अशुद्ध हैं
  rationale: बहुवचन विधिक कथन को सुरक्षित रखा गया है। ‘अशुद्ध’ यहाँ नैतिक दोष नहीं, अनुष्ठानिक शुद्धता की स्थिति बताता है।
- source_word: כָּל הַנֹּגֵעַ בְּנִבְלָתָם
  choice: उनकी लोथ को छूने वाला हर व्यक्ति
  rationale: נְבֵלָה मृत पशु की देह या लोथ को दर्शाता है। ‘हर व्यक्ति’ distributive कानूनी बल को स्पष्ट करता है।
- source_word: יִטְמָא עַד הָעָרֶב
  choice: शाम तक अशुद्ध रहेगा
  rationale: हिब्रू अपूर्ण क्रिया का विधिक परिणाम हिन्दी में ‘रहेगा’ से स्वाभाविक रूप से व्यक्त होता है; समय-सीमा अक्षुण्ण रहती है।
theological_decisions:
- issue: अनुष्ठानिक शुद्धता की शब्दावली
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: इस प्रसंग में טמא अनुष्ठानिक स्थिति का तकनीकी शब्द है, नैतिक पाप का सीधा निर्णय नहीं। ‘अशुद्ध’ यह भेद अधिक स्पष्टता से बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण विधिक स्वर रखा गया है। वाक्यरचना सामान्य पाठक के लिए सहज है, जबकि मूल के वर्गसूचक बहुवचन और अनुष्ठानिक शब्दावली को सुरक्षित रखा गया है।
