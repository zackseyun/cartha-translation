  text: और लगलग[a], बगुला अपनी जाति के अनुसार[b], हुदहुद[c], और चमगादड़।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् स्टॉर्क नामक लंबी टाँगों वाला पक्षी।
    reason: lexical_clarification
  - marker: b
    text: इब्रानी पक्षी-नाम की ठीक पहचान अनिश्चित है; ‘बगुला’ एक प्रचलित पहचान है। सम्भवतः यह आइबिस या कोई दूसरा लंबी टाँगों वाला जलपक्षी हो सकता है। “अपनी जाति के अनुसार” इसी सामान्य प्रकार की संबंधित किस्मों को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: पुराने अनुवादों में कभी-कभी एक दूसरे पक्षी का नाम मिलता है, पर इब्रानी शब्द से सम्भवतः हुदहुद ही अभिप्रेत है।
    reason: alternative_reading
