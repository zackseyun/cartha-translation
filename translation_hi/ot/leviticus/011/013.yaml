base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/013.yaml
  text: 'And these from among the birds you shall regard as detestable[a]; they shall not be eaten; they are detestable: the eagle, the vulture[c][b], and the black vulture.'
translation:
  language: hi
  text: 'पक्षियों में से इनको तुम घृणित समझना[a]; इन्हें न खाया जाए; ये घृणित हैं: उकाब, दाढ़ीवाला गिद्ध[b] और काला गिद्ध[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस सूची के कई इब्रानी पक्षी-नामों की ठीक पहचान निश्चित नहीं है। यहाँ ‘उकाब’ किसी बड़े शिकारी पक्षी या गिद्ध को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस पक्षी की पहचान अनिश्चित है; इसे सामान्यतः ‘दाढ़ीवाला गिद्ध’ या ‘लैमर्गाइअर’ माना जाता है।
    reason: lexical_alternative
  - marker: c
    text: इस पक्षी की पहचान अनिश्चित है। कुछ अनुवादों में ‘मछलीमार’ या किसी प्रकार का उकाब अथवा गिद्ध मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׁקְּצוּ
  choice: घिनौना मानना
  rationale: पिएल रूप केवल भावनात्मक घृणा नहीं, बल्कि भोजन-विधान के संदर्भ में किसी वस्तु को घृणित और निषिद्ध मानने का भाव देता है।
- source_word: מִן הָעוֹף
  choice: पक्षियों में से
  rationale: מִן का अंशसूचक अर्थ सुरक्षित रहता है और इस आहार-सूची में עוֹף के लिए ‘पक्षी’ स्वाभाविक है।
- source_word: לֹא יֵאָכְלוּ
  choice: इन्हें खाया न जाए
  rationale: निफ़अल अपूर्ण रूप का निषेधात्मक कर्मवाच्य अर्थ और विधिक लहजा सुरक्षित रहता है।
- source_word: שֶׁקֶץ
  choice: घिनौने
  rationale: यह शब्द आहार-विधान में धार्मिक रूप से वर्जित और घृणित वस्तु को दर्शाता है; केवल ‘अशुद्ध’ कहने से इसकी तीव्रता घट जाती।
- source_word: הַנֶּשֶׁר
  choice: उकाब
  rationale: यह पारंपरिक और व्यापक हिन्दी समतुल्य है, यद्यपि इब्रानी नाम किसी बड़े शिकारी अथवा मृतभक्षी पक्षी को भी सूचित कर सकता है।
- source_word: הַפֶּרֶס
  choice: दाढ़ीवाला गिद्ध
  rationale: इस पक्षी की सामान्य आधुनिक पहचान bearded vulture/lammergeier से की जाती है, पर पहचान पूर्णतः निश्चित नहीं है।
- source_word: הָעָזְנִיָּה
  choice: काला गिद्ध
  rationale: यह एक प्रचलित आधुनिक पहचान है, यद्यपि इस इब्रानी पक्षी-नाम की ठीक पहचान अनिश्चित है।
