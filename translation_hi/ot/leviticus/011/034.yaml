  yaml_path: translation/ot/leviticus/011/034.yaml
  text: Any food that may be eaten[a], on which water comes, becomes unclean; and any drink that may be drunk in any vessel becomes unclean.
translation:
  language: hi
  text: खाए जाने योग्य कोई भी भोजन[क], जिस पर पानी पड़ जाए, अशुद्ध हो जाएगा; और किसी भी पात्र में रखा हुआ हर पीने योग्य पेय अशुद्ध हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: 'या अधिक शाब्दिक रूप से: “हर वह भोजन जो खाया जाता है, जिस पर पानी आता है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל הָאֹכֶל
  choice: खाए जाने योग्य किसी भी भोजन
  rationale: מִכָּל का यहाँ सामान्य/वितरणात्मक अर्थ है और הָאֹכֶל भोजन को सूचित करता है। यह हिंदी अभिव्यक्ति कानूनी संदर्भ में स्वाभाविक ढंग से पूरी श्रेणी को समेटती है।
- source_word: אֲשֶׁר יֵאָכֵל
  choice: खाए जाने योग्य
  rationale: निफ़अल अपूर्ण रूप भोजन की उस श्रेणी को बताता है जिसे खाया जा सकता है; ‘योग्य’ इस वर्गीकरण को संक्षिप्त और स्वाभाविक हिंदी में रखता है।
- source_word: אֲשֶׁר יָבֹא עָלָיו מַיִם
  choice: पर यदि पानी पड़ जाए
  rationale: शाब्दिक अर्थ ‘जिस पर पानी आए’ है। हिंदी में ‘पानी पड़ जाए’ क्रिया के घटित होने को स्वाभाविक रूप से व्यक्त करता है और किसी मानवीय कर्ता को नहीं जोड़ता।
- source_word: יִטְמָא
  choice: अशुद्ध हो जाएगा
  rationale: טמא यहाँ विधिवत/अनुष्ठानिक अशुद्धता की परिणामी अवस्था बताता है; ‘अशुद्ध हो जाएगा’ अवस्था-परिवर्तन और कानूनी भविष्यसूचक बल दोनों रखता है।
- source_word: מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה
  choice: पीने योग्य कोई भी पेय
  rationale: מַשְׁקֶה पीने की वस्तु है और निफ़अल रूप पीने योग्य श्रेणी को सीमित करता है। ‘पेय’ आधुनिक मानक हिंदी में संक्षिप्त और स्पष्ट है।
- source_word: בְּכָל כְּלִי
  choice: किसी भी पात्र में
  rationale: כְּלִי का व्यापक अर्थ पात्र/बरतन है। ‘पात्र’ लैव्यव्यवस्था के गरिमापूर्ण विधिक संदर्भ में उपयुक्त है और כָּל की वितरणात्मक शक्ति ‘किसी भी’ से आती है।
theological_decisions:
- issue: अशुद्धता की प्रकृति
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: यहाँ טמא अनुष्ठानिक/विधिगत अशुद्धता का तकनीकी शब्द है। ‘अशुद्ध’ इसे स्पष्ट रखता है, जबकि ‘अपवित्र’ नैतिक या आध्यात्मिक दोष का अनावश्यक संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण विधिक शैली। वाक्य स्रोत की दोनों समानांतर श्रेणियों—भोजन और पेय—को बनाए रखता है; अस्पष्ट अनुष्ठानिक कारण को विस्तार देकर नहीं समझाया गया है।
