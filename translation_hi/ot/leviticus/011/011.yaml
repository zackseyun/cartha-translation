id: LEV.11.11
reference: Leviticus 11:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שֶׁ֖קֶץ יִהְי֣וּ לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וְ/אֶת נִבְלָתָ֖/ם תְּשַׁקֵּֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/011.yaml
  text: And they shall be detestable to you; you shall not eat any of their flesh[a], and you shall regard their carcasses as detestable.
translation:
  language: hi
  text: और वे तुम्हारे लिए घृणित होंगे; तुम उनके मांस में से कुछ भी न खाना, और उनके मृत शरीरों को घृणित मानना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁקֶץ
  choice: घृणित
  rationale: यह शब्द भोजन-विधि के संदर्भ में धार्मिक रीति से अत्यंत अप्रिय और त्याज्य वस्तु को सूचित करता है। ‘अशुद्ध’ अपेक्षाकृत कमजोर है और दूसरे इब्रानी अशुद्धता-संबंधी शब्दों से इसका भेद मिटा सकता है।
- source_word: יִהְיוּ לָכֶם
  choice: तुम्हारे लिए ... होंगे
  rationale: दत्तिव संबंध को बनाए रखते हुए यह बताता है कि इस्राएल को इन जीवों को किस दृष्टि से देखना है।
- source_word: מִבְּשָׂרָם
  choice: उनके मांस में से कुछ भी
  rationale: निषेधात्मक खाने की क्रिया के बाद מִן अंशवाचक है; यह हिंदी में पूरे निषेध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: לֹא תֹאכֵלוּ
  choice: न खाना
  rationale: विधिक संदर्भ में निषेध की आज्ञात्मक शक्ति को आधुनिक और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: נִבְלָתָם
  choice: उनकी लोथों
  rationale: यह पशुओं के मृत शरीर को दर्शाता है। ‘लोथ’ इस संदर्भ में संक्षिप्त और सटीक है तथा सामान्य ‘मृत शरीर’ की अपेक्षा पशु-संदर्भ को अधिक स्पष्ट करता है।
- source_word: תְּשַׁקֵּצוּ
  choice: घृणित मानना
  rationale: यह शֶׁקֶץ से संबंधित पियेल क्रिया है और केवल भावनात्मक घृणा नहीं, बल्कि किसी वस्तु को घृणित या त्याज्य ठहराने का भाव देती है।
theological_decisions:
- issue: भोजन-विधि में अशुद्धता की भाषा का स्वरूप
  choice: ‘घृणित’ की धार्मिक-विधिक भाषा
  alternative: ‘घोर पापमय’ या केवल ‘अशुद्ध’
  rationale: पद इस्राएल की वाचा-संबंधी भोजन-व्यवस्था की श्रेणी व्यक्त करता है। ‘घृणित’ प्रबल नकारात्मक मूल्यांकन को सुरक्षित रखता है, पर पाठ में स्पष्ट न की गई व्यापक नैतिक श्रेणी आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट विधिक शैली। दोनों सजातीय इब्रानी रूपों के लिए ‘घृणित’ को दोहराकर मूल की शब्दगत प्रतिध्वनि रखी गई है। ‘लोथ’ संदर्भानुकूल है, यद्यपि बोलचाल के ‘मरे हुए शरीर’ से अधिक संक्षिप्त और साहित्यिक है।
