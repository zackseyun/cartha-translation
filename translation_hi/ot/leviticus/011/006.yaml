id: LEV.11.6
reference: Leviticus 11:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֶת הָ/אַרְנֶ֗בֶת כִּֽי מַעֲלַ֤ת גֵּרָה֙ הִ֔וא וּ/פַרְסָ֖ה לֹ֣א הִפְרִ֑יסָה טְמֵאָ֥ה הִ֖וא לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/006.yaml
  text: And the hare[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: hi
  text: और खरहा[a]—क्योंकि वह जुगाली तो करता है, पर उसके खुर चिरे हुए नहीं हैं—तुम्हारे लिए अशुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खरगोश।” इब्रानी אַרְנֶבֶת को परंपरागत रूप से “खरहा” समझा गया है, हालाँकि कुछ लोग इसे अधिक व्यापक अर्थ में लेते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְנֶבֶת
  choice: खरहा
  rationale: यह इब्रानी पशु-नाम परंपरागत और संभवतः प्राणिवैज्ञानिक रूप से खरहे को सूचित करता है; ‘खरगोश’ प्रचलित व्यापक विकल्प है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह पशु को अशुद्ध ठहराने का कारण प्रस्तुत करता है।
- source_word: מַעֲלַת גֵּרָה
  choice: जुगाली करता है
  rationale: इब्रानी मुहावरे का आशय जुगाली ऊपर लाने से है; आधुनिक हिन्दी में ‘जुगाली करना’ इसका स्वाभाविक और स्थापित समतुल्य है।
- source_word: וּפַרְסָה לֹא הִפְרִיסָה
  choice: पर उसके खुर चिरे हुए नहीं हैं
  rationale: ‘पर’ दोनों आहार-संबंधी कसौटियों के बीच विरोध स्पष्ट करता है; यह रूप खुर के विभाजित न होने का अर्थ सहज हिन्दी में व्यक्त करता है।
- source_word: טְמֵאָה הִוא לָכֶם
  choice: तुम्हारे लिए अशुद्ध है
  rationale: यह विधान-संबंधी अशुद्धता को व्यक्त करता और לָכֶם के संबोधन को बनाए रखता है, बिना उसे नैतिक बुराई बताने के।
theological_decisions:
- issue: लैव्यव्यवस्था के आहार-विधान में अशुद्धता का स्वरूप
  choice: ‘अशुद्ध’ शब्द द्वारा विधान-संबंधी अशुद्धता
  alternative: नैतिक रूप से अपवित्र या बुरा
  rationale: संदर्भ इस्राएल के आहार-वर्गीकरण का है, पशु के नैतिक रूप से बुरा होने का नहीं। मुख्य पाठ व्यापक बाइबलीय पद ‘अशुद्ध’ को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘तो…पर’ से इब्रानी वाक्य का कारण और विरोध स्वाभाविक रूप में सामने आता है।
