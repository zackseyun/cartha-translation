source:
  edition: WLC
  text: אַ֣ךְ מַעְיָ֥ן וּ/ב֛וֹר מִקְוֵה מַ֖יִם יִהְיֶ֣ה טָה֑וֹר וְ/נֹגֵ֥עַ בְּ/נִבְלָתָ֖/ם יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/036.yaml
  text: However[a], a spring or a cistern collecting water shall remain clean, but whoever touches their carcass shall be unclean.
translation:
  language: hi
  text: परन्तु सोता या हौज, अर्थात् जल का संग्रह[a], शुद्ध रहेगा; पर जो कोई उनके मृत शरीर को छुएगा, वह अशुद्ध हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जल का संग्रह।” इसका अर्थ “एकत्र जल” या “जलाशय” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु
  rationale: यह पिछले नियम के विपरीत एक अपवाद का संकेत देता है; ‘परन्तु’ आधुनिक हिन्दी में इस विरोध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מַעְיָן
  choice: सोता
  rationale: यह प्राकृतिक रूप से फूटने वाले जल-स्रोत को दर्शाता है; ‘सोता’ इसका सटीक और प्रचलित हिन्दी पर्याय है।
- source_word: בּוֹר
  choice: हौज
  rationale: इस प्रसंग में आशय पानी रखने या जमा करने के मानव-निर्मित गड्ढे अथवा कुंड से है; ‘हौज’ सामान्य पाठक के लिए स्पष्ट है और ‘कुआँ’ की अपेक्षा अधिक उपयुक्त है।
- source_word: מִקְוֵה מַיִם
  choice: जहाँ पानी जमा होता है
  rationale: इब्रानी पद का शाब्दिक भाव ‘जल का संग्रह’ है। हिन्दी में यह संबंधवाचक अभिव्यक्ति सोते या हौज से जुड़े एकत्र जल का अर्थ स्वाभाविक रूप से देती है; वैकल्पिक अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: יִהְיֶה טָהוֹר
  choice: शुद्ध रहेगा
  rationale: क्रिया का मूल अर्थ ‘शुद्ध होगा/रहेगा’ है। प्रसंग में बताया गया है कि ऐसा जल-स्रोत अशुद्ध नहीं होता, इसलिए ‘शुद्ध रहेगा’ निहित निरंतरता को स्पष्ट करता है।
- source_word: נֹגֵעַ
  choice: जो कोई ... छुएगा
  rationale: एकवचन कृदन्त यहाँ सामान्य रूप से किसी भी छूने वाले व्यक्ति को दर्शाता है; यह हिन्दी में स्वाभाविक और व्यापक प्रयोग+n है।
- source_word: נִבְלָתָם
  choice: उनकी लोथ
  rationale: נְבֵלָה किसी मरे हुए पशु या जीव की देह को दर्शाता है। ‘लोथ’ अनुष्ठानिक शुद्धता के इस प्रसंग में ‘शव’ से अधिक सटीक है और इब्रानी के सामूहिक एकवचन को बनाए रखता है।
- source_word: יִטְמָא
  choice: अशुद्ध हो जाएगा
  rationale: यह छूने के फलस्वरूप अनुष्ठानिक अशुद्ध अवस्था में आने को व्यक्त करता है; ‘हो जाएगा’ उस परिणामी अवस्था को स्पष्ट रखता है।
theological_decisions:
- issue: अनुष्ठानिक शुद्धता की शब्दावली
  choice: शुद्ध / अशुद्ध
  alternative: साफ / नापाक
  rationale: लैव्यव्यवस्था 11 का विषय अनुष्ठानिक शुद्धता है। ‘शुद्ध / अशुद्ध’ हिन्दी में स्थापित, गरिमापूर्ण और स्पष्ट शब्द हैं तथा नैतिक दोष का अनावश्यक अर्थ नहीं जोड़ते।
- issue: जल-स्रोत पर अशुद्धता का प्रभाव
  choice: शुद्ध रहेगा
  alternative: शुद्ध होगा
  rationale: प्रसंग में यह पिछले पद के अशुद्धता-नियम का अपवाद है। ‘रहेगा’ इस निहित बात को व्यक्त करता है कि सोता या हौज अशुद्ध नहीं बनाया जाता, बिना किसी अतिरिक्त धर्मसिद्धान्त को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। ‘सोता’, ‘हौज’, ‘लोथ’ और ‘शुद्ध/अशुद्ध’ प्रसंग-सटीक शब्द हैं; वाक्य की विरोधात्मक संरचना इब्रानी के अनुरूप बनाए रखी गई है।
