  yaml_path: translation/ot/leviticus/011/003.yaml
  text: You may eat any animal that has a split hoof[a], completely divided[b], and that chews the cud.
translation:
  language: hi
  text: पशुओं में से जिस किसी के खुर चिरे हुए हों और पूरी तरह दो भागों में बँटे हों[a], और जो जुगाली करता हो[b], उसे तुम खा सकते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो खुर को विभाजित करता है और खुरों में एक चीर करता है।” खुर के सचमुच और पूरी तरह विभाजित होने को स्पष्ट करने के लिए इब्रानी में दो परस्पर संबंधित पद प्रयुक्त हुए हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जुगाली को ऊपर लाता है”; अर्थात् जुगाली करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: जिस किसी
  rationale: यह शब्द यहाँ अनुमत पशुओं के पूरे वर्ग को वितरणात्मक रूप से दर्शाता है; ‘जिस किसी’ आधुनिक हिन्दी में समावेशी कानूनी अनुमति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: जिसके खुर चिरे हुए हों
  rationale: इब्रानी कृदन्त और उसके कर्म का आशय खुर के चिरे होने से है। बहुवचन ‘खुर’ हिन्दी में पशु की इस शारीरिक विशेषता को सहज और स्पष्ट बनाता है।
- source_word: וְשֹׁסַעַת שֶׁסַע פְּרָסֹת
  choice: और पूरी तरह दो भागों में बँटे हों
  rationale: 'यह संबंधित शब्दों की पुनरुक्ति से पहले कही गई खुर की दशा को स्पष्ट और बलयुक्त करता है: केवल दरार नहीं, बल्कि खुर का पूर्णतः दो भागों में विभाजित होना।'
- source_word: מַעֲלַת גֵּרָה
  choice: जुगाली करता हो
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘जुगाली को ऊपर लाता है’ है। ‘जुगाली करता हो’ सामान्य आधुनिक हिन्दी में उसी पशु-व्यवहार का प्रचलित और सटीक रूप है।
- source_word: בַּבְּהֵמָה
  choice: पशुओं में से
  rationale: इस आहार-विधि के संदर्भ में בְּהֵמָה भूमि के पशुओं की श्रेणी बताता है। ‘पशुओं में से’ वर्ग के भीतर चयन को स्पष्ट करता है और ‘मवेशी’ जैसी अनावश्यक संकीर्णता से बचता है।
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: उसे तुम खा सकते हो
  rationale: इस विधिक संदर्भ में क्रिया सेवन की आज्ञा देने के बजाय अनुमति प्रकट करती है। ‘खा सकते हो’ आधुनिक हिन्दी में यह अनुमतिपरक भाव साफ़ रखता है।
