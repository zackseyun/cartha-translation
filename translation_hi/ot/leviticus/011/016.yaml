  text: और शुतुरमुर्ग[a], बाज़, सीगल और हर प्रकार का शिकरा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस आयत में कई इब्रानी पक्षी-नामों की पहचान अनिश्चित है। पारंपरिक वैकल्पिक पहचानों में ‘शुतुरमुर्ग’ के स्थान पर ‘उल्लू’, ‘बाज़’ के स्थान पर ‘रात का बाज़’ या ‘उल्लू’, ‘सीगल’ के स्थान पर ‘कोयल’, और ‘शिकरा’ के स्थान पर ‘बाज़’ शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: शुतुरमुर्ग
  rationale: यह इब्रानी पद शाब्दिक रूप से ‘याअनाह की बेटी’ है, पर पक्षियों की सूची में एक पक्षी का रूढ़ नाम है। व्यापक शब्द-साक्ष्य और सजातीय भाषाओं के आधार पर ‘शुतुरमुर्ग’ संभावित पहचान है।
- source_word: הַתַּחְמָס
  choice: बाज़
  rationale: ठीक प्रजाति अनिश्चित है। यह व्यापक और स्वाभाविक हिन्दी शब्द किसी शिकारी पक्षी को दर्शाता है तथा अनावश्यक प्रजातिगत सटीकता से बचता है।
- source_word: הַשָּׁחַף
  choice: समुद्री चील
  rationale: पक्षी की पहचान अनिश्चित है; आधुनिक कोशों में सामान्यतः gull समझा जाता है। ‘समुद्री चील’ आम हिन्दी पाठक के लिए उस समुद्री पक्षी का सुबोध नाम है, यद्यपि वैज्ञानिक दृष्टि से यह चील नहीं है।
- source_word: הַנֵּץ
  choice: शिकरा
  rationale: यह शब्द बाज़ अथवा शिकरे जैसे शिकारी पक्षी को दर्शाता है। ‘शिकरा’ इसे תַּחְמָס के लिए प्रयुक्त ‘बाज़’ से अलग रखता है, बिना अत्यधिक विशिष्ट प्रजाति का दावा किए।
- source_word: לְמִינֵהוּ
  choice: हर प्रकार का
  rationale: वर्गीकरण-सूचियों में यह पद उस पक्षी के प्रकारों अथवा जाति-समूह को समेटता है। हिन्दी में ‘हर प्रकार का’ स्वाभाविक है और प्रत्यय के एकवचन संबंध को निकटतम पक्षी से जोड़ता है।
- source_word: וְאֵת / וְאֶת
  choice: और
  rationale: संयोजक के साथ बार-बार आया कर्मसूचक चिह्न पिछली आयत से जारी सूची को रचता है। हिन्दी में कर्मसूचक चिह्न का अलग अनुवाद आवश्यक नहीं, जबकि ‘और’ सूची की निरंतरता व्यक्त करता है।
