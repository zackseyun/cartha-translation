  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण सूची-शैली रखी गई है। दुर्लभ पक्षी-नामों के लिए सामान्यतः समझ में आने वाले शब्द चुने गए हैं और मूल की वास्तविक शब्दार्थगत अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
