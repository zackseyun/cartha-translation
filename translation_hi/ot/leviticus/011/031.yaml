base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/031.yaml
  text: These are unclean for you among all the swarming things[b][a]. Everyone who touches them when they are dead shall be unclean until the evening.
translation:
  language: hi
  text: सभी रेंगने वाले जीव-जंतुओं[a] में ये तुम्हारे लिए अशुद्ध हैं। जो कोई उनके मरे हुए शरीरों को छुएगा[b], वह शाम तक अशुद्ध होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सभी झुंड में चलने वाले जीवों में।’ इब्रानी शब्द छोटे जीवों की एक व्यापक श्रेणी को दर्शाता है, जो रेंगते या बहुतायत से फैलते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उनकी मृत्यु में’; आशय है, उनके मरे हुए होने की अवस्था में उन्हें छूना।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये
  rationale: यह संकेतवाचक बहुवचन अभी-अभी गिनाए गए जीवों की ओर संकेत करता है; ‘ये’ स्वाभाविक और सटीक है।
- source_word: הַטְּמֵאִים לָכֶם
  choice: तुम्हारे लिए अशुद्ध
  rationale: यह इस्राएल की विधिक और अनुष्ठानिक शुद्धता के संदर्भ में उनकी स्थिति बताता है; ‘अशुद्ध’ आधुनिक हिन्दी में स्पष्ट है और नैतिक दोष का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: בְּכָל הַשָּׁרֶץ
  choice: सब रेंगनेवाले जीव-जंतुओं में
  rationale: שֶׁרֶץ छोटे रेंगने, सरकने या बहुतायत से चलनेवाले जीवों की व्यापक श्रेणी है। प्रचलित हिन्दी पद ‘रेंगनेवाले जीव-जंतु’ वर्ग को समझने योग्य रखता है, जबकि पादटिप्पणी उसकी व्यापकता स्पष्ट करती है।
- source_word: כָּל הַנֹּגֵעַ
  choice: जो कोई ... छुएगा
  rationale: यह रचना सार्वभौमिक और सामान्य नियम व्यक्त करती है; ‘जो कोई’ उसके वितरक बल को सहज हिन्दी में बनाए रखता है।
- source_word: בְּמֹתָם
  choice: उनकी मरी हुई अवस्था में
  rationale: वाक्यांश केवल मरने के क्षण की नहीं, मृत अवस्था में संपर्क की बात करता है। यह चयन उस आशय को स्पष्ट रखते हुए मूल अभिव्यक्ति से निकट रहता है।
- source_word: יִטְמָא עַד הָעָרֶב
  choice: वह शाम तक अशुद्ध रहेगा
  rationale: क्रिया स्पर्श के फलस्वरूप रहने वाली अनुष्ठानिक अशुद्धता और उसकी समय-सीमा बताती है; ‘रहेगा’ यहाँ स्वाभाविक विधिक हिन्दी है।
