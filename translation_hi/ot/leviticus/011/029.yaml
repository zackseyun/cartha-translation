  text: וְ/זֶ֤ה לָ/כֶם֙ הַ/טָּמֵ֔א בַּ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ הַ/חֹ֥לֶד וְ/הָ/עַכְבָּ֖ר וְ/הַ/צָּ֥ב לְ/מִינֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/029.yaml
  text: 'And these are unclean for you among the swarming things that swarm on the earth: the mole-rat[a], and the mouse, and the great lizard according to its kind.'
translation:
  language: hi
  text: 'और भूमि पर रेंगने-फिरनेवाले जीवों में ये तुम्हारे लिए अशुद्ध हैं: छछूँदर[a], चूहा और बड़ी छिपकली, अपनी जाति के अनुसार।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: חֹלֶד और צָב से अभिप्रेत जीवों की सटीक पहचान अनिश्चित है। חֹלֶד के पारंपरिक अनुवादों में “नेवला” या “मोल” और צָב के अनुवादों में “कछुआ” या केवल “छिपकली” शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: और ... ये
  rationale: यद्यपि हिब्रू संकेतवाचक शब्द व्याकरण की दृष्टि से एकवचन है, वह आगे दी गई अनेक जीवों की सूची का परिचय देता है; इसलिए स्वाभाविक हिन्दी में बहुवचन रखा गया है।
- source_word: לָכֶם
  choice: तुम्हारे लिए
  rationale: यह इस्राएली श्रोताओं के संबंध में इन जीवों की अशुद्ध स्थिति बताता है और हिन्दी में सहज है।
- source_word: הַטָּמֵא
  choice: अशुद्ध
  rationale: लैव्यव्यवस्था की विधिगत शुद्धता-अशुद्धता के संदर्भ में यह स्पष्ट और प्रचलित हिन्दी शब्द है।
- source_word: בַּשֶּׁרֶץ הַשֹּׁרֵץ
  choice: रेंगनेवाले जीवों में
  rationale: שֶׁרֶץ छोटे भूमि-जीवों की व्यापक श्रेणी को सूचित करता है। हिन्दी में कृदंत रूप मूल की धारणा को पर्याप्त रूप से व्यक्त करता है; शब्दशः पुनरावृत्ति करने पर वाक्य अनावश्यक रूप से बोझिल होता।
- source_word: עַל הָאָרֶץ
  choice: भूमि पर
  rationale: इस संदर्भ में אָרֶץ उस धरातल को दर्शाता है जिस पर ये जीव चलते हैं; ‘भूमि पर’ स्वाभाविक और सटीक है।
- source_word: הַחֹלֶד
  choice: छछूँदर
  rationale: जीव की सटीक पहचान अनिश्चित है। ‘छछूँदर’ आधुनिक हिन्दी पाठक के लिए परिचित छोटे भूमिगत स्तनपायी का नाम है; अन्य पारंपरिक संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: הָעַכְבָּר
  choice: चूहा
  rationale: यह עַכְבָּר का सामान्य और व्यापक रूप से समझा जाने वाला हिन्दी पर्याय है।
- source_word: הַצָּב
  choice: बड़ी छिपकली
  rationale: सटीक प्रजाति अनिश्चित है, पर इस सूची में किसी बड़े छिपकली-नुमा जीव का संकेत संभावित है; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: לְמִינֵהוּ
  choice: अपनी जाति के अनुसार
  rationale: यह मानक वर्गीकरण-वाक्यांश है और निकटतम उल्लिखित जीव की विभिन्न जातियों को समेटता है। हिन्दी में यही रूप संक्षिप्त रहते हुए वर्गगत अर्थ बनाए रखता है।
