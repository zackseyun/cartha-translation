source:
  edition: WLC
  text: וְ/כִ֤י יֻתַּן מַ֨יִם֙ עַל זֶ֔רַע וְ/נָפַ֥ל מִ/נִּבְלָתָ֖/ם עָלָ֑י/ו טָמֵ֥א ה֖וּא לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/038.yaml
  text: But if water is put on the seed[a], and any of their carcasses falls on it, it is unclean to you.
translation:
  language: hi
  text: लेकिन यदि बीज पर पानी डाला गया हो और उन जानवरों में से किसी का शव उस पर गिर जाए, तो वह बीज तुम्हारे लिए अशुद्ध है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: लेकिन यदि
  rationale: यह पिछले पद की स्थिति के विपरीत एक शर्त प्रस्तुत करता है; ‘लेकिन यदि’ संयोजक और विरोधात्मक भाव दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יֻתַּן מַיִם עַל זֶרַע
  choice: बीज पर पानी डाला गया हो
  rationale: होफ़ाल रूप की कर्मवाच्य क्रिया को सुरक्षित रखते हुए यह हिन्दी में परिणामी अवस्था वाली शर्त को स्वाभाविक ढंग से व्यक्त करता है। ‘भिगोया गया हो’ अपेक्षाकृत अधिक व्याख्यात्मक होता।
- source_word: וְנָפַל
  choice: और ... गिर जाए
  rationale: शर्तसूचक विधिक प्रसंग में हिब्रू पूर्ण क्रिया को हिन्दी की संभावनार्थक शर्त के रूप में व्यक्त करना स्वाभाविक है।
- source_word: מִנִּבְלָתָם
  choice: उनमें से किसी की लोथ
  rationale: נְבֵלָה पशु के मृत शरीर या लोथ को दर्शाता है। מִן को यहाँ समूह में से किसी एक का संकेत देने वाला मानकर अनुवाद किया गया है। ‘लोथ’ इस पशु-शुद्धता प्रसंग में संक्षिप्त और उपयुक्त है।
- source_word: עָלָיו
  choice: उस पर
  rationale: यह पुल्लिंग एकवचन सामूहिक संज्ञा זֶרַע, अर्थात बीज, की ओर लौटता है।
- source_word: טָמֵא הוּא לָכֶם
  choice: वह बीज तुम्हारे लिए अशुद्ध है
  rationale: ‘अशुद्ध’ लैव्यव्यवस्था की अनुष्ठानिक शुद्धता-श्रेणी को व्यक्त करता है। अस्पष्ट सर्वनाम के स्थान पर ‘वह बीज’ कहना हिन्दी में आशय स्पष्ट करता है, बिना अर्थ बदले।
theological_decisions:
- issue: अशुद्धता का स्वरूप
  choice: अनुष्ठानिक अशुद्धता (‘अशुद्ध’)
  alternative: अपवित्र या दूषित
  rationale: यह विधान अनुष्ठानिक शुद्धता की स्थिति से संबंधित है, अनिवार्य रूप से नैतिक दोष से नहीं। ‘अशुद्ध’ इस विधिक श्रेणी को सबसे सीधे रूप में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और विधिक गरिमा वाली रखी गई है। ‘वह बीज’ कहकर हिन्दी में कर्ता स्पष्ट किया गया है; मूल का सामूहिक एकवचन भाव बना रहता है।
