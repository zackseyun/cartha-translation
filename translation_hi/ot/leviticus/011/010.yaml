id: LEV.11.10
reference: Leviticus 11:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר אֵֽין ל֜/וֹ סְנַפִּ֣יר וְ/קַשְׂקֶ֗שֶׂת בַּ/יַּמִּים֙ וּ/בַ/נְּחָלִ֔ים מִ/כֹּל֙ שֶׁ֣רֶץ הַ/מַּ֔יִם וּ/מִ/כֹּ֛ל נֶ֥פֶשׁ הַ/חַיָּ֖ה אֲשֶׁ֣ר בַּ/מָּ֑יִם שֶׁ֥קֶץ הֵ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/010.yaml
  text: But everything in the seas and in the streams that does not have fins and scales[b][a], among all the swarming things in the waters and among all the living creatures that are in the waters—they are detestable to you.
translation:
  language: hi
  text: परन्तु समुद्रों और जलधाराओं[a] में, जल के सब रेंगनेवाले जीवों और जल में रहनेवाले सब जीवित प्राणियों में से जिनके पर और शल्क नहीं हैं, वे तुम्हारे लिए घृणित[b] हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जलधाराओं’ का अनुवाद ‘नदियों’ या ‘मौसमी नालों’ के रूप में भी किया जा सकता है; इब्रानी शब्द बहते जलमार्गों के लिए व्यापक रूप से प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: ‘घृणित’ का अर्थ यहाँ आहार-विधि के अनुसार धार्मिक रूप से त्याज्य या घृणा की वस्तु है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: परन्तु ... जिस किसी
  rationale: वाव यहाँ पिछले पद में बताए गए अनुमत जलचरों के विपरीत वर्ग को प्रस्तुत करता है; ‘परन्तु’ इस संदर्भगत विरोध को स्पष्ट करता है, और ‘जिस किसी’ כֹל की व्यापकता को स्वाभाविक हिन्दी में रखता है।
- source_word: אֲשֶׁר אֵין לוֹ
  choice: जिस किसी के ... नहीं हैं
  rationale: यह अपेक्षित शारीरिक चिह्नों के अभाव को सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: पंख और शल्क
  rationale: ये अनुमत जलचरों के दो संयुक्त पहचान-चिह्न हैं। ‘और’ मूल के योगात्मक संबंध को बनाए रखता है; ‘शल्क’ मछलियों की त्वचा पर पाए जानेवाले scales के लिए मानक हिन्दी शब्द है।
- source_word: בַּיַּמִּים וּבַנְּחָלִים
  choice: समुद्रों और जलधाराओं में
  rationale: ‘समुद्रों’ יַמִּים का सीधा बहुवचन है। נְחָלִים बहते जलमार्गों, नदियों या मौसमी धाराओं को दर्शा सकता है; ‘जलधाराओं’ इसकी व्यापकता बनाए रखता है।
- source_word: מִכֹּל שֶׁרֶץ הַמַּיִם
  choice: जल के सब रेंगनेवाले जीवों में से
  rationale: שֶׁרֶץ रेंगने या बड़ी संख्या में फैलनेवाले छोटे जीवों की श्रेणी बताता है। ‘में से’ अंशसूचक מִן को हिन्दी में स्पष्ट करता है।
- source_word: וּמִכֹּל נֶפֶשׁ הַחַיָּה אֲשֶׁר בַּמָּיִם
  choice: और सब जलचर प्राणियों में से
  rationale: נֶפֶשׁ הַחַיָּה यहाँ सजीव प्राणियों का व्यापक वर्ग है। ‘जलचर प्राणी’ पूरे पदबंध और उसके स्थानसूचक संबंध को संक्षिप्त, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: שֶׁקֶץ הֵם לָכֶם
  choice: वे तुम्हारे लिए घृणित हैं
  rationale: नामवाचक वाक्य उनके लिए निर्धारित स्थिति बताता है। ‘घृणित’ שֶׁקֶץ की तीव्र धार्मिक-आहारगत अरुचि को व्यक्त करता है, बिना अपने-आप अतिरिक्त नैतिक अर्थ जोड़े।
theological_decisions:
- issue: आहार-विधि में שֶׁקֶץ का धार्मिक-विधिक आशय
  choice: घृणित
  alternative: तुम्हारे लिए घिनौनी वस्तु / घृणा की वस्तु
  rationale: यह पद वाचा-संबंधी आहार-वर्गीकरण करता है। ‘घृणित’ मूल की प्रबल अरुचि को बनाए रखता है, पर उसे हर संदर्भ में सामान्य नैतिक निंदा के रूप में नहीं समझाता।
- issue: विधिक वाक्य का काल और बल
  choice: वे ... हैं
  alternative: वे ... ठहरें / होंगे
  rationale: हिब्रू में यह स्पष्ट भविष्यकालीन क्रिया नहीं, बल्कि नामवाचक स्थिति-वाक्य है; वर्तमानकालीन ‘हैं’ उसी रूप और स्थायी वर्गीकरण को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य-विन्यास को हिन्दी के अनुरूप पुनर्गठित किया गया है, जबकि समुद्र/जलधारा, रेंगनेवाले जीव/जलचर प्राणी और पंख/शल्क जैसी मूल श्रेणियाँ सुरक्षित हैं।
