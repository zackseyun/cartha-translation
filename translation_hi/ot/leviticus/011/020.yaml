  text: כֹּ֚ל שֶׁ֣רֶץ הָ/ע֔וֹף הַ/הֹלֵ֖ךְ עַל אַרְבַּ֑ע שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/020.yaml
  text: Every swarming winged creature that walks on four feet is detestable to you[a][b][c].
translation:
  language: hi
  text: हर पंखवाला रेंगनेवाला जीव[a], जो चार पैरों पर चलता है[b], तुम्हारे लिए घृणित है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर उड़नेवाला रेंगनेवाला जीव।” इब्रानी शब्द עוֹף उड़नेवाले जीवों को व्यापक रूप से सूचित कर सकता है, केवल पक्षियों को नहीं; और שֶׁרֶץ रेंगनेवाले या बहुतायत में पाए जानेवाले छोटे जीवों के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में अक्षरशः “चार पर चलता है।” इससे चार पैरों के सहारे चलना अभिप्रेत है; हालाँकि अगले पदों में उछलनेवाले कुछ कीटों को अपवाद माना गया है।
    reason: cultural_note
  - marker: c
    text: या “तुम्हारे लिए घृणा की वस्तु है।” यहाँ यह शब्द आहार-विधियों के अनुसार विधिगत रूप से घृणित और वर्जित होने का भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: हर
  rationale: यहाँ शब्द पूरे वर्ग के प्रत्येक सदस्य को सम्मिलित करता है; विधिक कथन में ‘हर’ स्वाभाविक और व्यापक है।
- source_word: שֶׁרֶץ
  choice: झुंड में ... जीव
  rationale: यह संज्ञा छोटे, बड़ी संख्या में उमड़ने या झुंड बनानेवाले जीवों को दर्शाती है। ‘झुंड में’ आधुनिक हिन्दी में इस भाव को सहज रूप से व्यक्त करता है।
- source_word: הָעוֹף
  choice: उड़नेवाला
  rationale: यह शब्द केवल पक्षियों तक सीमित नहीं, बल्कि उड़नेवाले जीवों के व्यापक वर्ग को सूचित कर सकता है; इस प्रसंग में कीट भी शामिल हैं।
- source_word: הַהֹלֵךְ
  choice: जो ... चलता है
  rationale: कृदंत जीव की सामान्य गतिशीलता बताता है; ‘चलता है’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: עַל אַרְבַּע
  choice: चार पैरों पर
  rationale: इब्रानी में अक्षरशः ‘चार पर’ है। हिन्दी में ‘चार पैरों पर’ स्पष्ट है और अगले पदों में उछलनेवाले कुछ कीटों के अपवाद के लिए स्थान बनाए रखता है।
- source_word: שֶׁקֶץ
  choice: घृणित
  rationale: आहार-विधियों में यह शब्द धार्मिक रीति से वर्जित और घृणा योग्य वस्तु को दर्शाता है। ‘घृणित’ इसकी तीव्रता रखता है, बिना इसे सामान्य ‘अशुद्ध’ शब्द में मिला देने के।
- source_word: לָכֶם
  choice: तुम्हारे लिए
  rationale: सम्बन्धसूचक रूप बताता है कि इस व्यवस्था के अधीन इस्राएलियों को इन जीवों को किस प्रकार मानना है।
theological_decisions:
- issue: שֶׁקֶץ का धार्मिक-विधिक आशय
  choice: मुख्य पाठ में ‘घृणित’, और पादटिप्पणी में आहार-विधि का धार्मिक सन्दर्भ स्पष्ट किया गया है।
  alternative: ‘अशुद्ध’ या ‘घृणा की वस्तु’
  rationale: ‘अशुद्ध’ अलग और अधिक व्यापक इब्रानी श्रेणी के साथ भेद मिटा देता, जबकि ‘घृणा की वस्तु’ हिन्दी में अनावश्यक रूप से भारी है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज पर गरिमापूर्ण रखी गई है। ‘झुंड में उड़नेवाला’ शाब्दिक संरचना को हिन्दी में बोझिल बनाए बिना שֶׁרֶץ और עוֹף दोनों के भाव को समेटता है।
