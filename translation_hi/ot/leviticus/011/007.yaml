base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/007.yaml
  text: And the pig[a], because it has a divided hoof and splits the hoof, but does not chew the cud[b], is unclean to you.
translation:
  language: hi
  text: और सूअर[a]—क्योंकि उसका खुर चिरा हुआ और पूरी तरह दो भागों में बँटा है, पर वह जुगाली नहीं करता[b]—तुम्हारे लिए अशुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
