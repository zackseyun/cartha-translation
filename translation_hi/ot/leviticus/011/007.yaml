    text: अथवा, “शूकर।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “जुगाली को ऊपर नहीं लाता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזִיר
  choice: सूअर
  rationale: यह आधुनिक मानक हिन्दी में इस पशु का सामान्य और सहज नाम है; हिब्रू शब्द पूरी जाति को सूचित करता है।
- source_word: כִּי
  choice: यद्यपि
  rationale: इस वाक्य में सूअर के एक शुद्धता-लक्षण के होते हुए दूसरे के अभाव का विरोध प्रमुख है; हिन्दी में ‘यद्यपि…फिर भी’ इस तर्क को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַפְרִיס פַּרְסָה
  choice: उसका खुर चिरा हुआ है
  rationale: यह खुर के विभाजित होने की अवस्था को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְשֹׁסַע שֶׁסַע פַּרְסָה
  choice: अर्थात उसका खुर पूरी तरह दो भागों में बँटा है
  rationale: हिब्रू की दूसरी, अधिक विशिष्ट खुर-वर्णना को छोड़े बिना हिन्दी में उसका स्पष्टीकरण देता है; ‘अर्थात’ दोनों निकटवर्ती वर्णनों का संबंध स्पष्ट करता है।
- source_word: גֵּרָה לֹא יִגָּר
  choice: वह जुगाली नहीं करता
  rationale: यह हिब्रू मुहावरे का प्रचलित और अर्थ-सटीक हिन्दी रूप है।
- source_word: טָמֵא הוּא לָכֶם
  choice: वह तुम्हारे लिए अशुद्ध है
  rationale: ‘अशुद्ध’ लैव्यव्यवस्था के अनुष्ठानिक और आहार-संबंधी वर्गीकरण को व्यक्त करता है, नैतिक बुराई का अनावश्यक अर्थ नहीं जोड़ता; ‘तुम्हारे लिए’ संबोधित समुदाय से संबंध बनाए रखता है।
theological_decisions:
- issue: आहार-विधान में טָמֵא का स्वरूप
  choice: अशुद्ध—अनुष्ठानिक/आहार-संबंधी अर्थ में
  alternative: अपवित्र; दूषित
  rationale: लैव्यव्यवस्था 11 में यह इस्राएल के लिए भोजन और पवित्रता के वर्गीकरण का पद है। ‘अशुद्ध’ इस भेद को स्पष्ट रखता है और इसे नैतिक दुष्टता नहीं बनाता।
- issue: सूअर के खुर और जुगाली के लक्षणों के बीच तार्किक संबंध
  choice: ‘यद्यपि…फिर भी’ द्वारा विरोध व्यक्त किया गया
  alternative: ‘क्योंकि…परन्तु’ के साथ हिब्रू संयोजनों का अधिक सीधा रूप
  rationale: हिब्रू כִּי व्याख्यात्मक कारण प्रस्तुत करता है, पर पूरे उपवाक्य में एक मान्य लक्षण और एक अनुपस्थित लक्षण का विरोध है। चुना हुआ हिन्दी रूप इस तनाव को स्पष्ट करता है, बिना वर्गीकरण का आधार बदले।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। खुर के बारे में हिब्रू की दोहरी अभिव्यक्ति को पूरी तरह समेटने के बजाय स्पष्ट पुनर्व्याख्या के रूप में बनाए रखा गया है। वाक्य में विराम-चिह्नों से पशु-वर्णन और अंतिम विधिक निर्णय अलग और सुबोध किए गए हैं।
