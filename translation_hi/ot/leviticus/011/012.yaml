  text: כֹּ֣ל אֲשֶׁ֥ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת בַּ/מָּ֑יִם שֶׁ֥קֶץ ה֖וּא לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/012.yaml
  text: Everything in the water that does not have fins and scales is detestable to you[a].
translation:
  language: hi
  text: पानी में रहनेवाला हर जीव, जिसके न तो पर हैं और न शल्क, तुम्हारे लिए घृणित है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे लिए घृणित वस्तु है।” यहाँ इब्रानी शब्द שֶׁקֶץ आहार-विधि के संदर्भ में ऐसी वस्तु के लिए है जो घृणित या धार्मिक रूप से वर्जित मानी जाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: हर जीव जो
  rationale: यह पद पानी में पाई जानेवाली पूरी श्रेणी को समेटता है। संदर्भ के आधार पर ‘जीव’ जोड़ने से हिन्दी में आशय स्वाभाविक और स्पष्ट होता है।
- source_word: אֵין לוֹ
  choice: जिसके … नहीं हैं
  rationale: इब्रानी अस्तित्ववाचक निषेध और सर्वनामिक संबंध को हिन्दी में स्वाभाविक अधिकार-सूचक रचना से व्यक्त किया गया है।
- source_word: סְנַפִּיר
  choice: पंख
  rationale: जलचर के संदर्भ में यह तैरने के लिए प्रयुक्त fins का प्रचलित, सरल हिन्दी नाम है; इब्रानी एकवचन यहाँ जातिवाचक है, इसलिए हिन्दी बहुवचन स्वाभाविक है।
- source_word: קַשְׂקֶשֶׂת
  choice: छिलके
  rationale: मछलियों के scales के लिए सामान्य, सुबोध हिन्दी शब्द; इब्रानी एकवचन जातिवाचक होने के कारण बहुवचन चुना गया है।
- source_word: בַּמָּיִם
  choice: पानी में रहनेवाला
  rationale: स्थानवाचक पद को ‘हर जीव’ के साथ स्वाभाविक हिन्दी विशेषण-रचना में रखा गया है; इससे मूल का जलीय क्षेत्र सुरक्षित रहता है।
- source_word: שֶׁקֶץ
  choice: घिनौना
  rationale: आहार-विधि के प्रसंग में यह ऐसी वस्तु को दर्शाता है जो धार्मिक रूप से घृणित या वर्जित मानी जाती है। ‘घिनौना’ आधुनिक हिन्दी में इसकी तीव्र मूल्यात्मक शक्ति को स्पष्ट रखता है।
- source_word: הוּא
  choice: है
  rationale: इब्रानी की बलयुक्त नामवाचक विधेय-रचना हिन्दी में स्वाभाविक योजक क्रिया से व्यक्त होती है।
- source_word: לָכֶם
  choice: तुम्हारे लिए
  rationale: यह बहुवचन संबोधन और इस्राएल पर लागू विधान को सीधे बनाए रखता है।
theological_decisions:
- issue: आहार-विधि में שֶׁקֶץ की धार्मिक स्थिति
  choice: घिनौना
  alternative: घृणित वस्तु; अशुद्ध
  rationale: ‘घिनौना’ मूल की प्रबल घृणा और धार्मिक वर्जना को संप्रेषित करता है, जबकि ‘अशुद्ध’ कहने से यहाँ प्रयुक्त शब्द का अन्य इब्रानी अशुद्धता-संबंधी शब्दावली के साथ अनुचित विलय हो सकता है। पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण विधानात्मक स्वर अपनाया गया है। ‘रहनेवाला’ संदर्भगत पूर्ति है, जो पानी में पाए जानेवाले जीवों की श्रेणी स्पष्ट करती है।
