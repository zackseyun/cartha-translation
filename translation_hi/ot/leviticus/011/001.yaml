  rationale: परमेश्वर के व्यक्तिगत नाम YHWH को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: मूसा और हारून से
  rationale: दोनों व्यक्तियों को वाणी के सह-संबोधित जनों के रूप में रखा गया है; हिन्दी में दोनों के बाद एक बार ‘से’ लगाना स्वाभाविक है।
- source_word: לֵאמֹר אֲלֵהֶם
  choice: कहा
  rationale: शाब्दिक रूप ‘उनसे यह कहते हुए’ हिन्दी में अनावश्यक और असहज पुनरुक्ति पैदा करता। ‘कहा’ आने वाली प्रत्यक्ष वाणी का स्वाभाविक परिचय देता है और दोनों को संबोधित किए जाने का अर्थ पहले ही ‘मूसा और हारून से’ में सुरक्षित है।
