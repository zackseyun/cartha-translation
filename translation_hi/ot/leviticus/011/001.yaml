  choice: कहा
  rationale: यह क्रिया एक नई कथात्मक वाणी-घटना आरम्भ करती है। आधुनिक हिन्दी में ‘कहा’ दिव्य संबोधन के लिए स्वाभाविक है और आगे आए לֵאמֹר तथा אֲלֵהֶם की पुनरुक्ति को बोझिल बनाए बिना उसका आशय व्यक्त करता है।
- source_word: יְהוָה
