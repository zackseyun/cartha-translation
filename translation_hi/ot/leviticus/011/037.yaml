    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: और यदि
  rationale: यह पिछले विधिक प्रसंग से जोड़ते हुए एक शर्त प्रस्तुत करता है; ‘और यदि’ संयोजक וְ और प्रसंगगत शर्त दोनों को व्यक्त करता है।
- source_word: יִפֹּל
  choice: गिर जाए
  rationale: विधिक शर्त में कालगत अपूर्ण क्रिया को आधुनिक हिन्दी में संभाव्य घटना के रूप में ‘गिर जाए’ कहना स्वाभाविक है।
- source_word: מִנִּבְלָתָם
  choice: उनकी लोथ का कोई अंश
  rationale: מִן की अंशवाचक शक्ति और נְבֵלָה के मृत पशु-शरीर के अर्थ को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है; बहुवचन संबंधसूचक प्रत्यय ‘उनकी’ में सुरक्षित है।
- source_word: עַל כָּל
  choice: किसी ... पर
  rationale: शर्तवाचक विधिक कथन में כָּל का वितरणात्मक अर्थ हिन्दी में ‘किसी’ से सहज रूप में आता है, और עַל का स्थानवाचक अर्थ ‘पर’ है।
- source_word: זֶרַע זֵרוּעַ אֲשֶׁר יִזָּרֵעַ
  choice: बोने के लिए रखे किसी बीज
  rationale: शब्द-समूह ऐसे बीज को निर्दिष्ट करता है जो बोने के उद्देश्य से है; यह अनावश्यक पुनरुक्ति के बिना उसके भावी प्रयोजन को सुरक्षित रखता है।
- source_word: טָהוֹר הוּא
  choice: वह बीज शुद्ध है
  rationale: लैव्यव्यवस्था के अनुष्ठानिक शुद्धता-संबंधी प्रसंग में טָהוֹר के लिए ‘शुद्ध’ उपयुक्त है। हिन्दी में संदर्भ स्पष्ट करने हेतु सर्वनाम के साथ ‘बीज’ दोहराया गया है; ‘शुद्ध रहता है’ जैसा अनिर्दिष्ट भाव नहीं जोड़ा गया।
