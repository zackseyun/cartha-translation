translation:
  language: hi
  text: गेको[a], गोह, छिपकली, रेत की छिपकली और गिरगिट।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में बताए गए कई जीवों की ठीक-ठीक पहचान अनिश्चित है। ‘गेको’ के लिए फेरेट, छछूँदर, या कराहने वाली छिपकली; ‘गोह’ के लिए गिरगिट या स्थल-मगरमच्छ; ‘रेत की छिपकली’ के लिए स्किंक या पुरानी परंपरा में घोंघा; और ‘गिरगिट’ के लिए छछूँदर, बड़ी छिपकली, या किसी दूसरी प्रकार की छिपकली भी प्रस्तावित की गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָקָה
  choice: छिपकली
  rationale: इस जीव की ठीक-ठीक पहचान अनिश्चित है। इस रेंगने वाले जीवों की सूची में स्तनपायी जीव के बजाय छिपकली-जाति का जीव अधिक संभावित है; इसलिए सहज और व्यापक शब्द चुना गया है।
- source_word: הַכֹּחַ
  choice: गोह
  rationale: यह संभवतः बड़े आकार की छिपकली को दर्शाता है। आधुनिक हिन्दी में ‘गोह’ मॉनिटर लिज़र्ड का स्वाभाविक और प्रचलित नाम है।
- source_word: הַלְּטָאָה
  choice: गिरगिट
  rationale: सटीक प्रजाति निश्चित नहीं है। सूची में अलग-अलग नाम बनाए रखने और हिन्दी की पारंपरिक बाइबलीय शब्दावली से जुड़ाव के लिए ‘गिरगिट’ चुना गया है, यद्यपि सामान्य ‘छिपकली’ भी संभव है।
- source_word: הַחֹמֶט
  choice: रेत की छिपकली
  rationale: सरीसृपों के इस संदर्भ में पुराने ‘घोंघा’ की अपेक्षा छिपकली-जाति का जीव अधिक संगत है। ‘रेत की छिपकली’ संभावित अर्थ देता है, पर निश्चितता का दावा नहीं करता।
- source_word: הַתִּנְשָׁמֶת
  choice: बहुरूपिया
  rationale: यहाँ रेंगने वाले जीवों की सूची होने के कारण किसी छिपकली-जाति के जीव का अर्थ अपेक्षित है। ‘बहुरूपिया’ आधुनिक हिन्दी में कैमीलियन के लिए समझ में आने वाला नाम है और इसे ‘गिरगिट’ से अलग रखता है।
