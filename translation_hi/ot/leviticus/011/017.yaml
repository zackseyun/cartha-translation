  text: the little owl[a], the cormorant, and the great owl.
translation:
  language: hi
  text: छोटा उल्लू[a], पनकौआ और बड़ा उल्लू।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन पक्षियों की पहचान निश्चित नहीं है। ‘छोटा उल्लू,’ ‘पनकौआ’ और ‘बड़ा उल्लू’ संभावित पारंपरिक या विद्वत्तापूर्ण अनुवाद हैं। כּוֹס के लिए ‘उल्लू’ या ‘चीखने वाला उल्लू,’ שָׁלָךְ के लिए ‘हवासील,’ और יַנְשׁוּף के लिए ‘सींगदार उल्लू’ या ‘गरुड़-उल्लू’ भी प्रस्तावित किए गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכּוֹס
  choice: छोटा उल्लू
  rationale: यह शब्द अशुद्ध माने गए पक्षियों की सूची में किसी विशिष्ट पक्षी का नाम है, पर उसकी ठीक प्रजाति अनिश्चित है। ‘छोटा उल्लू’ एक प्रचलित और प्रसंगानुकूल पहचान है।
- source_word: הַשָּׁלָךְ
  choice: पनकौआ
  rationale: इस पक्षी की सटीक पहचान विवादित है। शब्द को प्रायः पानी में गोता लगाकर शिकार करने वाले पक्षी से जोड़ा जाता है; इसलिए ‘पनकौआ’ एक संभव पारंपरिक पहचान है, जबकि अनिश्चितता पाद-टिप्पणी में स्पष्ट की गई है।
- source_word: הַיַּנְשׁוּף
  choice: बड़ा उल्लू
  rationale: यह संभवतः किसी बड़े निशाचर पक्षी, विशेषतः उल्लू, का नाम है। ‘बड़ा उल्लू’ किसी आधुनिक प्रजाति को निश्चित किए बिना मूल की अपेक्षाकृत विशिष्ट पहचान को व्यक्त करता है।
- source_word: וְאֶת
  choice: और / सूचीगत संयोजन
  rationale: बार-बार आया संयोजक और कर्म-सूचक चिह्न पिछली सूची को आगे बढ़ाता है। स्वाभाविक हिन्दी में अल्पविरामों और अंतिम ‘और’ से यही सूचीगत संबंध व्यक्त होता है।
