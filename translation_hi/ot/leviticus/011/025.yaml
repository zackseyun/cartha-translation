base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/025.yaml
  text: And everyone who carries any of their carcasses shall wash his clothes and be unclean until the evening[a].
translation:
  language: hi
  text: और जो कोई उनकी किसी लोथ को उठाए[a], वह अपने कपड़े धोए और शाम तक अशुद्ध रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी लोथ में से उठाए।” इब्रानी पूर्वसर्ग का यह अधिक औपचारिक अनुवाद है; मुख्य पाठ ‘उनकी किसी लोथ को’ वितरक अर्थ को अधिक स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל הַ/נֹּשֵׂא
  choice: और जो कोई…उठाए
  rationale: וְ पिछले नियम से संबंध जोड़ता है; כָּל के साथ कृदन्त सामान्य और सार्वभौमिक नियम व्यक्त करता है। נָשָׂא का अर्थ यहाँ लोथ के किसी अंश को उठाना या ढोना है; संक्षिप्त हिंदी में ‘उठाए’ स्वाभाविक है।
- source_word: מִ/נִּבְלָתָ/ם
  choice: उनकी लोथ में से कुछ
  rationale: נְבֵלָה पशु की मृत देह अथवा लोथ को दर्शाता है। מִן का अंशसूचक भाव बनाए रखने के लिए ‘में से कुछ’ चुना गया है; इससे यह स्पष्ट होता है कि नियम लोथ के किसी अंश को उठाने पर भी लागू है।
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: वह अपने कपड़े धोए
  rationale: यहाँ अपूर्ण क्रिया विधिक दायित्व व्यक्त करती है। ‘धोए’ हिंदी में नियमात्मक बल रखता है, और ‘अपने’ प्रतिनिधिक एकवचन कर्ता के साथ स्वाभाविक रूप से संबंध बताता है।
- source_word: וְ/טָמֵא
  choice: और…अशुद्ध रहे
  rationale: טָמֵא यहाँ नैतिक बुराई नहीं, बल्कि अनुष्ठानिक अशुद्धता को दर्शाता है। समय-सीमा के साथ ‘अशुद्ध रहे’ उस दशा की अवधि को स्पष्ट करता है।
- source_word: עַד הָ/עָרֶב
  choice: शाम तक
  rationale: यह पद अशुद्धता की समय-सीमा बताता है। ‘शाम तक’ आधुनिक हिंदी में सहज और सटीक है।
theological_decisions:
- issue: प्रतिनिधिक पुल्लिंग एकवचन को हिंदी में व्यक्त करना
  choice: ‘जो कोई…वह अपने कपड़े…अशुद्ध रहे’
  alternative: ‘जो लोग…वे अपने कपड़े…अशुद्ध रहें’
  rationale: इब्रानी पाठ प्रतिनिधिक पुल्लिंग एकवचन का प्रयोग करता है। हिंदी का ‘जो कोई…वह अपने’ सार्वभौमिक दायरा बनाए रखते हुए एकवचन संरचना को स्वाभाविक ढंग से सुरक्षित रखता है।
- issue: טָמֵא का स्वरूप
  choice: ‘अशुद्ध’ को अनुष्ठानिक दशा के अर्थ में रखना
  alternative: इसे नैतिक दोष या पाप के रूप में स्पष्ट करना
  rationale: लैव्यव्यवस्था के इस प्रसंग में शब्द अनुष्ठानिक शुद्धता की स्थिति से संबंधित है; पाठ इसे नैतिक अपराध नहीं कहता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और विधिक गरिमा वाली रखी गई है। ‘लोथ’ पशु की मृत देह के लिए सटीक है, जबकि ‘शव’ मानव देह का आभास दे सकता है। मुख्य पाठ में अंशसूचक इब्रानी रचना सुरक्षित रखी गई है और वैकल्पिक व्यापक पाठ फुटनोट में दिया गया है।
