base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/005.yaml
  text: And the rock badger[a], because it chews the cud but does not divide the hoof, is unclean for you.
translation:
  language: hi
  text: और हाइरैक्स[a] को भी—क्योंकि वह जुगाली तो करता है, पर उसके खुर चिरे हुए नहीं हैं—वह तुम्हारे लिए अशुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘रॉक हाइरैक्स’। पारंपरिक अनुवादों में इसे कभी-कभी ‘शाफान’ या ‘कोनी’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁפָן
  choice: चट्टानी बिज्जू
  rationale: यह छोटा, चट्टानों में रहने वाला स्तनपायी सामान्यतः रॉक हाइरैक्स माना जाता है। ‘चट्टानी बिज्जू’ सहज वर्णनात्मक नाम है; अधिक सटीक प्राणिवैज्ञानिक नाम फुटनोट में दिया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पशु को अशुद्ध ठहराने का कारण प्रस्तुत करता है।
- source_word: מַעֲלֵה גֵרָה
  choice: जुगाली करता है
  rationale: शाब्दिक अर्थ ‘जुगाली ऊपर लाता है’ है; आधुनिक हिंदी में ‘जुगाली करना’ स्वाभाविक और प्रचलित समतुल्य है।
- source_word: וּפַרְסָה לֹא יַפְרִיס
  choice: पर उसके खुर चिरे हुए नहीं हैं
  rationale: यह खुर के विभाजित न होने को स्पष्ट, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: טָמֵא
  choice: अशुद्ध
  rationale: लैव्यव्यवस्था 11 के आहार-विधान में यह अनुष्ठानिक शुद्धता की विधिक श्रेणी है; ‘अशुद्ध’ हिंदी बाइबलीय प्रयोग में स्पष्ट और स्थापित है।
- source_word: לָכֶם
  choice: तुम्हारे लिए
  rationale: यह बताता है कि यह वर्गीकरण संबोधित समुदाय पर लागू है।
theological_decisions:
- issue: लैव्यव्यवस्था के आहार-विधान में טָמֵא का स्वरूप
  choice: अनुष्ठानिक रूप से अशुद्ध
  alternative: नैतिक रूप से बुरा या अपवित्र
  rationale: इस अध्याय में शब्द आहार-संबंधी अनुष्ठानिक स्थिति बताता है, पशु के नैतिक चरित्र पर निर्णय नहीं। ‘अशुद्ध’ पाठ की विधिक-धार्मिक श्रेणी को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज विधिक शैली रखी गई है। ‘तो…पर’ से दोनों पहचान-लक्षणों का विरोध स्पष्ट किया गया है। आरंभ का ‘और…को भी’ हिब्रू की सूचीगत निरंतरता को बनाए रखता है।
