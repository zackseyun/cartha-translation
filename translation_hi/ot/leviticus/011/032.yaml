language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כֹ֣ל אֲשֶׁר יִפֹּל עָלָי/ו֩ מֵ/הֶ֨ם בְּ/מֹתָ֜/ם יִטְמָ֗א מִ/כָּל כְּלִי עֵץ֙ א֣וֹ בֶ֤גֶד אוֹ עוֹר֙ א֣וֹ שָׂ֔ק כָּל כְּלִ֕י אֲשֶׁר יֵעָשֶׂ֥ה מְלָאכָ֖ה בָּ/הֶ֑ם בַּ/מַּ֧יִם יוּבָ֛א וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/011/032.yaml
  text: And everything on which any of them falls when they are dead shall become unclean—from any wooden vessel or garment or skin or sackcloth, any vessel with which work is done. It shall be put into the water, and it shall be unclean until the evening; then it shall be clean.
translation:
  language: hi
  text: और जिस किसी वस्तु पर इन मरे हुए जीवों में से कोई गिर जाए, वह अशुद्ध हो जाएगी—लकड़ी का कोई पात्र, वस्त्र, चमड़ा या टाट, अर्थात् ऐसी कोई भी वस्तु जिससे काम किया जाता हो। उसे पानी में डाला जाए[a], और वह शाम तक अशुद्ध रहेगी; उसके बाद वह शुद्ध हो जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसे पानी में लाया जाए”; इसका अर्थ “पानी में डुबोया जाए” भी हो सकता है।
    reason: इब्रानी יוּבָא का शाब्दिक अर्थ ‘लाया जाए’ है, जबकि इस शुद्धि-संदर्भ में पानी में डालने या डुबोने का आशय संभव है।
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִפֹּל עָלָיו מֵהֶם בְּמֹתָם
  choice: और जिस किसी वस्तु पर इन मरे हुए जीवों में से कोई गिर जाए
  rationale: כֹל की व्यापकता को ‘जिस किसी वस्तु’ से व्यक्त किया गया है। בְּמֹתָם को प्रसंगानुसार मृत अवस्था के रूप में रखा गया है; ‘जीवों’ शब्द पूर्ववर्ती पद में उल्लिखित रेंगनेवाले प्राणियों की ओर संकेत स्पष्ट करता है, बिना ‘शव’ को मूल पाठ में संज्ञा के रूप में जोड़ने के।
- source_word: יִטְמָא
  choice: वह अशुद्ध हो जाएगी
  rationale: क्रिया के परिणामकारी भाव को ‘हो जाएगी’ व्यक्त करता है। ‘अशुद्ध’ यहाँ अनुष्ठानिक-विधिक स्थिति का सूचक है, नैतिक दोष का नहीं।
- source_word: מִכָּל כְּלִי עֵץ אוֹ בֶגֶד אוֹ עוֹר אוֹ שָׂק
  choice: चाहे वह लकड़ी का कोई पात्र हो, कपड़ा हो, चमड़ा हो या टाट
  rationale: מן को सूची प्रस्तुत करने वाले अंश के रूप में ‘चाहे’ से स्वाभाविक हिन्दी में व्यक्त किया गया है। כְּלִי עֵץ के लिए ‘लकड़ी का पात्र’, בֶּגֶד के लिए व्यापक ‘कपड़ा’, עוֹר के लिए सामग्री-सूचक ‘चमड़ा’, और שַׂק के लिए प्रचलित ‘टाट’ चुना गया है।
- source_word: כָּל כְּלִי אֲשֶׁר יֵעָשֶׂה מְלָאכָה בָּהֶם
  choice: ऐसी कोई भी वस्तु जिससे काम लिया जाता हो
  rationale: כְּלִי का व्यापक अर्थ यहाँ ‘वस्तु’ से और कर्म में उसके साधनात्मक उपयोग को ‘जिससे काम लिया जाता हो’ से स्वाभाविक ढंग से व्यक्त किया गया है। בָּהֶם का बहुवचन सूचीबद्ध सामग्रियों की ओर संकेत करता है।
- source_word: בַּמַּיִם יוּבָא
  choice: उसे पानी में डाला जाए
  rationale: हिफ़ील कर्मवाच्य का शाब्दिक अर्थ ‘पानी में लाया जाए’ है; शुद्धि के संदर्भ में ‘पानी में डाला जाए’ स्वाभाविक है और पानी के भीतर ले जाने का भाव बनाए रखता है। शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְטָמֵא עַד הָעֶרֶב וְטָהֵר
  choice: और वह शाम तक अशुद्ध रहेगी; उसके बाद वह शुद्ध हो जाएगी
  rationale: अशुद्धता की अवधि और फिर शुद्ध स्थिति में परिवर्तन को क्रमशः ‘रहेगी’ तथा ‘हो जाएगी’ से स्पष्ट किया गया है।
theological_decisions:
- issue: טמא और טהר की प्रकृति
  choice: ‘अशुद्ध’ और ‘शुद्ध’ के रूप में अनुष्ठानिक-विधिक स्थिति
  alternative: ‘अपवित्र’ और ‘पवित्र’ अथवा नैतिक रूप से दूषित/निर्दोष
  rationale: लैव्यव्यवस्था के इस प्रसंग में शब्द धार्मिक-विधिक शुद्धता की स्थिति बताते हैं; अनुवाद में नैतिक अपराध या पाप का अर्थ नहीं जोड़ा गया।
- issue: शुद्ध होने का समय और प्रक्रिया
  choice: पानी में डाले जाने के बाद भी वस्तु शाम तक अशुद्ध रहती है और उसके बाद शुद्ध होती है
  alternative: पानी में डालते ही तत्काल शुद्ध हो जाना
  rationale: इब्रानी वाक्य दोनों तत्वों—पानी में डाला जाना और शाम तक अशुद्ध रहना—को स्पष्ट रूप से बनाए रखता है; अनुवाद ने इसी तनाव और क्रम को सुरक्षित रखा है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘टाट’ शַׂק के खुरदरे बुने पदार्थ को सहज रूप में व्यक्त करता है। विरामचिह्न सूची और उसके व्याख्यात्मक सारांश को स्पष्ट करते हैं।
