source:
  edition: WLC
  text: וְ֠/אִם מִ/בֶּן שִׁשִּׁ֨ים שָׁנָ֤ה וָ/מַ֨עְלָ/ה֙ אִם זָכָ֔ר וְ/הָיָ֣ה עֶרְכְּ/ךָ֔ חֲמִשָּׁ֥ה עָשָׂ֖ר שָׁ֑קֶל וְ/לַ/נְּקֵבָ֖ה עֲשָׂרָ֥ה שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/007.yaml
  text: And if from sixty years old and upward[a], if male, then your valuation shall be fifteen shekels[b], and for the female ten shekels.
translation:
  language: hi
  text: और यदि कोई साठ वर्ष या उससे अधिक आयु का हो—यदि वह पुरुष हो, तो तुम्हारे द्वारा ठहराया गया मूल्य पन्द्रह शेकेल होगा, और स्त्री के लिए दस शेकेल।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן שִׁשִּׁים שָׁנָה וָמַעְלָה
  choice: साठ वर्ष या उससे अधिक आयु का
  rationale: यह इब्रानी मुहावरा साठ वर्ष से आरम्भ होने वाली आयु-सीमा को दर्शाता है। यह हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: זָכָר
  choice: पुरुष
  rationale: इस मूल्यांकन-संदर्भ में यह पुरुष लिंग के व्यक्ति को सूचित करता है; आधुनिक हिन्दी में ‘पुरुष’ सहज और गरिमापूर्ण है।
- source_word: עֶרְכְּךָ
  choice: तुम्हारे द्वारा ठहराया गया मूल्य
  rationale: अध्याय 27 में यह मन्नत-संबंधी निर्धारित मूल्य की तकनीकी संज्ञा है। हिन्दी वाक्यांश संबोधित व्यक्ति की भूमिका और मूल्यांकन का भाव दोनों स्पष्ट रखता है।
- source_word: חֲמִשָּׁה עָשָׂר שָׁקֶל
  choice: पन्द्रह शेकेल
  rationale: संख्या और प्राचीन भार/मुद्रा-इकाई का सीधा लिप्यंतरण है।
- source_word: לַנְּקֵבָה
  choice: स्त्री के लिए
  rationale: यह समानांतर स्त्री-वर्ग के लिए निर्धारित मूल्य बताता है और ‘पुरुष’ के साथ स्वाभाविक हिन्दी जोड़ी बनाता है।
- source_word: עֲשָׂרָה שְׁקָלִים
  choice: दस शेकेल
  rationale: संख्या और इकाई का सीधा अनुवाद है।
