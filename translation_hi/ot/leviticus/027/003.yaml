id: LEV.27.3
reference: Leviticus 27:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר מִ/בֶּן֙ עֶשְׂרִ֣ים שָׁנָ֔ה וְ/עַ֖ד בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וְ/הָיָ֣ה עֶרְכְּ/ךָ֗ חֲמִשִּׁ֛ים שֶׁ֥קֶל כֶּ֖סֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/003.yaml
  text: And your valuation for the male from twenty years old up to sixty years old shall be fifty shekels of silver[a], according to the sanctuary shekel.
translation:
  language: hi
  text: और बीस वर्ष से लेकर साठ वर्ष तक के पुरुष के लिए तुम्हारा निर्धारित मूल्य पवित्रस्थान के शेकेल के मान के अनुसार चाँदी के पचास शेकेल होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: तुम्हारा निर्धारित मूल्य
  rationale: यहाँ עֵרֶךְ मन्नत के विधान में तय की गई मूल्य-राशि को दर्शाता है, व्यक्ति के अंतर्निहित मूल्य को नहीं; द्वितीय पुरुष प्रत्यय को ‘तुम्हारा’ से सुरक्षित रखा गया है।
- source_word: הַזָּכָר
  choice: पुरुष
  rationale: इब्रानी पद स्पष्ट रूप से पुल्लिंग वर्ग को सूचित करता है। आधुनिक हिन्दी में आयु-निर्दिष्ट मानवीय श्रेणी के लिए ‘पुरुष’ स्वाभाविक और सटीक है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וְעַד בֶּן שִׁשִּׁים שָׁנָה
  choice: बीस वर्ष से लेकर साठ वर्ष तक
  rationale: यह इब्रानी मुहावरा आयु-सीमा बताता है; चुना हुआ रूप आधुनिक हिन्दी में सहज रहते हुए दोनों सीमाओं को स्पष्ट रखता है।
- source_word: חֲמִשִּׁים שֶׁקֶל כֶּסֶף
  choice: पचास शेकेल चाँदी
  rationale: मूल में भार और धातु की अभिव्यक्ति है। ‘शेकेल’ प्राचीन माप-इकाई को सुरक्षित रखता है और ‘चाँदी’ पदार्थ को स्पष्ट करता है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: בְּ यहाँ माप के मानक को दर्शाता है। ‘पवित्रस्थान का शेकेल’ उपासना-स्थान से जुड़े अधिकृत पवित्र मानक को व्यक्त करता है।
- source_word: וְהָיָה ... וְהָיָה
  choice: होगा
  rationale: इस विधिक प्रसंग में यह निर्धारित परिणाम बताता है; हिन्दी में ‘होगा’ स्वाभाविक रूप से विधान का बाध्यकारी भाव व्यक्त करता है।
theological_decisions:
- issue: लिंग-आधारित मूल्यांकन की श्रेणी
  choice: पुरुष
  alternative: नर; मनुष्य
  rationale: पद आयु और लिंग के आधार पर विधिक श्रेणी बनाता है। ‘पुरुष’ लिंग-विशिष्टता बनाए रखता है, जबकि ‘मनुष्य’ उसे अनावश्यक रूप से तटस्थ कर देता।
- issue: עֵרֶךְ का स्वरूप
  choice: निर्धारित मूल्य
  alternative: मूल्य; आकलन
  rationale: यह मन्नत से जुड़े पवित्रस्थान-विधान की तय राशि है, मानवीय गरिमा या बाजार-मूल्य पर कथन नहीं। ‘निर्धारित मूल्य’ इस कानूनी-अनुष्ठानिक अर्थ को स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। विधिक स्वर बना रहता है, पर अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है। ‘शेकेल’ को प्राचीन भार/मुद्रा-संबंधी इकाई के रूप में लिप्यंतरित किया गया है।
