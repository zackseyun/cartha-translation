  text: כָּל חֵ֗רֶם אֲשֶׁ֧ר יָחֳרַ֛ם מִן הָ/אָדָ֖ם לֹ֣א יִפָּדֶ֑ה מ֖וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/029.yaml
  text: No devoted thing that is devoted from man may be redeemed[b][a]; it must surely be put to death.
translation:
  language: hi
  text: मनुष्यों में से जो कोई पूर्णतः समर्पित ठहराया गया हो[a], उसे छुड़ाया नहीं जा सकता; उसे अवश्य मार डाला जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पूर्णतः समर्पित” हिब्रू חֵרֶם की तकनीकी धार्मिक-कानूनी स्थिति को दर्शाता है। इसका अर्थ किसी व्यक्ति को अपरिवर्तनीय रूप से अलग ठहराना है; इस पद का संबंध अगले वाक्य में बताए गए मृत्यु-विधान से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרֶם
  choice: अर्पण करके पूर्णतः समर्पित
  rationale: חֵרֶם किसी व्यक्ति या वस्तु को अपरिवर्तनीय रूप से अलग कर दिए जाने का तकनीकी धार्मिक-कानूनी भाव रखता है। हिंदी में केवल ‘समर्पित’ अस्पष्ट हो सकता है; ‘अर्पण करके पूर्णतः समर्पित’ उसकी तीव्रता और अटलता को व्यक्त करता है, जबकि अंतिम उपवाक्य इसके घातक परिणाम को स्पष्ट करता है।
- source_word: יָחֳרַם
  choice: समर्पित किया गया हो
  rationale: कर्मवाच्य रूप को बनाए रखते हुए यह उसी חרם शब्द-परिवार से संबंध प्रकट करता है और ‘विनाश के लिए’ जैसी व्याख्यात्मक वृद्धि मुख्य पाठ में नहीं जोड़ता।
- source_word: מִן הָאָדָם
  choice: मनुष्यों में से जो कोई
  rationale: इस प्रसंग में אָדָם किसी मानव व्यक्ति को श्रेणी के रूप में निर्दिष्ट करता है। ‘मनुष्यों में से’ हिंदी में स्वाभाविक रूप से מִן का वर्गगत अर्थ व्यक्त करता है, और ‘जो कोई’ एकवचन मानवीय संदर्भ स्पष्ट करता है।
- source_word: יִפָּדֶה
  choice: उसका छुटकारा नहीं कराया जा सकता
  rationale: פדה का अर्थ छुड़ाना, छुड़ौती देकर वापस लेना या मूल्य देकर मुक्त कराना है। अध्याय के मूल्यांकन और छुड़ाने के कानूनी संदर्भ में यह सहज हिंदी है।
- source_word: מוֹת יוּמָת
  choice: उसे निश्चय ही मार डाला जाए
  rationale: infinitive absolute और finite verb का संयोजन प्रबल निश्चितता व्यक्त करता है। ‘निश्चय ही’ उस बल को और कर्मवाच्य ‘मार डाला जाए’ हिब्रू दंड-विधान सूत्र को व्यक्त करता है।
theological_decisions:
- issue: मानव से संबंधित חֵרֶם का धार्मिक-कानूनी अर्थ
  choice: तकनीकी ‘पूर्णतः समर्पित’ भाषा को रखा और मृत्यु का परिणाम अलग उपवाक्य में व्यक्त किया।
  alternative: मनुष्यों में से विनाश के लिए ठहराए गए किसी व्यक्ति का छुटकारा नहीं कराया जा सकता; उसे निश्चय ही मार डाला जाए।
  rationale: हिब्रू पाठ חרם को सीधे केवल ‘मृत्युदंड’ में सीमित नहीं करता, यद्यपि अंतिम वाक्य मृत्यु को अनिवार्य बताता है। यह रूप धार्मिक समर्पण और विनाश के बीच मूल तनाव को सुरक्षित रखता है।
- issue: אָדָם का संदर्भ
  choice: मनुष्यों में से जो कोई
  alternative: मनुष्य में से
  rationale: शाब्दिक ‘मनुष्य में से’ आधुनिक हिंदी में अस्वाभाविक और संदिग्ध है। प्रसंग किसी मानव व्यक्ति को वर्ग में से निर्दिष्ट करता है, इसलिए यह अनुवाद अर्थ और एकवचन संदर्भ दोनों स्पष्ट करता है।
- issue: מוֹת יוּמָת की विधिक शक्ति
  choice: उसे निश्चय ही मार डाला जाए
  alternative: वह अवश्य मार डाला जाएगा
  rationale: हिब्रू सूत्र निश्चित और बाध्यकारी दंड व्यक्त कर सकता है। हिंदी में ‘मार डाला जाए’ विधिक आदेश का स्वर बनाए रखता है, जबकि ‘निश्चय ही’ मूल की तीव्रता दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गंभीर विधिक-धार्मिक स्तर रखा गया है। ‘जो कोई’ और ‘उसका/उसे’ मानवीय संदर्भ को स्वाभाविक बनाते हैं; अत्यधिक संस्कृतनिष्ठ ‘मोचन’ या अस्पष्ट ‘प्रतिबंधित’ से बचा गया है।
