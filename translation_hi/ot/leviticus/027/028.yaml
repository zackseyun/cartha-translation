base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/028.yaml
  text: However[a], every devoted thing that a man devotes to Yahweh from all that belongs to him—whether human or animal, or from the field of his inherited property—shall not be sold or redeemed. Every devoted thing is most holy to Yahweh.
translation:
  language: hi
  text: परन्तु जो कुछ कोई पुरुष अपनी सारी संपत्ति में से—चाहे मनुष्य हो, पशु हो, या उसकी पैतृक भूमि का कोई खेत—यहोवा के लिए पूर्णतः समर्पित[a] करे, वह न बेचा जाए और न छुड़ाया जाए। हर पूर्णतः समर्पित वस्तु यहोवा के लिए परमपवित्र है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘पूर्णतः समर्पित’ के लिए इब्रानी शब्द खेरेम (חֵרֶם) है। यह यहोवा के लिए अपरिवर्तनीय रूप से अलग कर दिए गए व्यक्ति या वस्तु का तकनीकी शब्द है; कुछ प्रसंगों में इसका अर्थ प्रतिबंध के अधीन रखना या विनाश के लिए अर्पित करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु
  rationale: यह शब्द पिछले नियमों के विपरीत एक प्रतिबंधात्मक अपवाद प्रस्तुत करता है; ‘परन्तु’ इस संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: חֵרֶם / יַחֲרִם
  choice: पूर्णतः समर्पित वस्तु / पूर्णतः समर्पित कर दे
  rationale: यह शब्द-समूह यहोवा के लिए अपरिवर्तनीय रूप से अलग कर दी गई वस्तु या व्यक्ति का तकनीकी बोध देता है। मुख्य पाठ में पूर्ण समर्पण पर बल रखा गया है, जबकि ‘प्रतिबंध’ या विनाश की संभावित अर्थछाया पादटिप्पणी में सुरक्षित है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: इब्रानी कानूनी शैली के व्याकरणिक पुल्लिंग एकवचन को बनाए रखता है, जिसका प्रयोग यहाँ प्रतिनिधिक रूप में हुआ है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: दिव्य नाम יהוה को हिन्दी में प्रचलित और प्रत्यक्ष रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: अपनी सारी संपत्ति में से
  rationale: व्यक्ति के अधिकार में आने वाली समस्त वस्तुओं के स्रोत-क्षेत्र को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵאָדָם וּבְהֵמָה
  choice: चाहे कोई मनुष्य हो, पशु हो
  rationale: אָדָם और בְּהֵמָה के मनुष्य-पशु वर्गभेद को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: וּמִשְּׂדֵה אֲחֻזָּתוֹ
  choice: या उसकी पैतृक भूमि का कोई खेत
  rationale: אֲחֻזָּה के वंशानुगत भू-संपत्ति संबंधी कानूनी अर्थ को ‘पैतृक भूमि’ से स्पष्ट किया गया है।
- source_word: לֹא יִמָּכֵר וְלֹא יִגָּאֵל
  choice: उसे न बेचा जाए और न छुड़ाया जाए
  rationale: दोनों कानूनी निषेधों को समानांतर रूप में रखता है; ‘छुड़ाया’ इस अध्याय में संपत्ति को मूल्य देकर वापस लेने के तकनीकी भाव को व्यक्त करता है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र
  rationale: इब्रानी अतिशयोक्तिपरक संरचना द्वारा व्यक्त पवित्रता की सर्वोच्च कोटि को संक्षिप्त, प्रतिष्ठित हिन्दी में दर्शाता है।
theological_decisions:
- issue: इस कानूनी प्रसंग में חֵרֶם का अर्थ
  choice: मुख्य पाठ में ‘पूर्णतः समर्पित’
  alternative: ‘विनाश के लिए अर्पित’ या ‘प्रतिबंध के अधीन’
  rationale: इस पद का प्रत्यक्ष जोर इस बात पर है कि ऐसी वस्तु बेची या छुड़ाई नहीं जा सकती और वह यहोवा के लिए परमपवित्र है। इसलिए मुख्य पाठ अपरिवर्तनीय समर्पण को सामने रखता है; विनाश या प्रतिबंध की वास्तविक संभावित अर्थछाया पादटिप्पणी में दी गई है।
- issue: मनुष्यों को חֵרֶם के अंतर्गत रखने का कठिन आशय
  choice: ‘चाहे कोई मनुष्य हो’ को स्पष्ट रूप से बनाए रखा
  alternative: इसे केवल संपत्ति या दास के अर्थ में सीमित करना
  rationale: मूल पाठ אָדָם को पशु और पैतृक खेत के साथ स्पष्ट श्रेणी के रूप में रखता है। अनुवाद इस धार्मिक और कानूनी तनाव को बिना व्याख्यात्मक रूप से सीमित किए सुरक्षित रखता है।
- issue: कानूनी शैली का प्रतिनिधिक पुल्लिंग
  choice: אִישׁ के लिए ‘कोई पुरुष’
  alternative: ‘कोई व्यक्ति’
  rationale: स्रोत के पुल्लिंग एकवचन रूप को बनाए रखते हुए उसकी प्रतिनिधिक कानूनी भूमिका को स्वाभाविक हिन्दी में व्यक्त किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कानूनी गरिमा और सामान्य पाठक की समझ के संतुलन के साथ रखी गई है। ‘पूर्णतः समर्पित’ को पूरे पद में एकरूप तकनीकी पदबंध के रूप में प्रयोग किया गया है; कठिन अर्थछायाओं को मुख्य पाठ में मिटाने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
