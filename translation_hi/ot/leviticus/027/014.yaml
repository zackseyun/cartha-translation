  text: וְ/אִ֗ישׁ כִּֽי יַקְדִּ֨שׁ אֶת בֵּית֥/וֹ קֹ֨דֶשׁ֙ לַֽ/יהוָ֔ה וְ/הֶעֱרִיכ/וֹ֙ הַ/כֹּהֵ֔ן בֵּ֥ין ט֖וֹב וּ/בֵ֣ין רָ֑ע כַּ/אֲשֶׁ֨ר יַעֲרִ֥יךְ אֹת֛/וֹ הַ/כֹּהֵ֖ן כֵּ֥ן יָקֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/014.yaml
  text: And if a man consecrates his house as holy to Yahweh[a], then the priest shall assess it, whether good or bad; as the priest assesses it[b], so it shall stand.
translation:
  language: hi
  text: और यदि कोई पुरुष अपने घर को यहोवा के लिए पवित्र ठहराए, तो याजक उसका मूल्य आँके, चाहे वह अच्छा हो या बुरा[a]। याजक उसका जो मूल्य आँकेगा[b], वही मान्य होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अच्छे और बुरे के बीच”; अर्थात घर की दशा या गुणवत्ता चाहे जैसी हो।
    reason: cultural_note
  - marker: b
    text: या “उसका जो मूल्य निर्धारित करेगा”; इब्रानी में वही क्रिया दोहराई गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: और यदि कोई पुरुष
  rationale: यह विधान की एक शर्तयुक्त स्थिति आरम्भ करता है; אִישׁ के एकवचन पुल्लिंग रूप को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति चुनी गई है।
- source_word: יַקְדִּשׁ אֶת־בֵּיתוֹ קֹדֶשׁ לַיהוָה
  choice: अपने घर को यहोवा के लिए पवित्र ठहराए
  rationale: हिफ़ील रूप यहाँ घर को पवित्र संपत्ति के रूप में अलग करने का भाव देता है; 'पवित्र ठहराए' समर्पण और पवित्र दर्जे दोनों को व्यक्त करता है।
- source_word: וְהֶעֱרִיכוֹ הַכֹּהֵן
  choice: याजक ... उसका मूल्य आँके
  rationale: ערך का हिफ़ील रूप लैव्यव्यवस्था 27 में आधिकारिक मूल्य-निर्धारण को सूचित करता है; 'मूल्य आँके' साधारण पाठक के लिए स्पष्ट और विधिक संदर्भ में उपयुक्त है।
- source_word: בֵּין טוֹב וּבֵין רָע
  choice: उसकी अच्छी या बुरी दशा के अनुसार
  rationale: शाब्दिक 'अच्छे और बुरे के बीच' यहाँ घर की दशा या गुणवत्ता के आकलन का मुहावरा है; अनुवाद उसका प्रसंगगत अर्थ स्पष्ट करता है और पादटिप्पणी शाब्दिक रूप बताती है।
- source_word: כֵּן יָקוּם
  choice: वही मान्य होगा
  rationale: קום यहाँ याजक द्वारा निर्धारित मूल्य के कायम और प्रभावी रहने को दर्शाता है; 'मान्य होगा' हिन्दी के विधिक संदर्भ में इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम יהוה है; उसे उपाधि से बदलने के बजाय प्रचलित हिन्दी रूप 'यहोवा' में प्रस्तुत किया गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाना जाने वाला 'यहोवा' नाम की विशिष्टता बनाए रखता है; 'याहवे' संभावित उच्चारण है और 'प्रभु' उपाधि है।
- issue: याजक के मूल्यांकन की अंतिमता
  choice: वही मान्य होगा
  alternative: वैसा ही स्थिर रहेगा
  rationale: मूल כֵּן יָקוּם का विधिक बल यह है कि याजक का आकलन प्रभावी ठहरेगा; इसमें आगे के पद में दी गई छुड़ाने की व्यवस्था को नकारने जैसा कोई अतिरिक्त परम अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण विधिक-धार्मिक शैली। 'याजक', 'पवित्र ठहराना' और 'मूल्य आँकना' जैसे परिचित शब्द रखे गए हैं; मूल की शर्तयुक्त संरचना और याजकीय मूल्यांकन का आधिकारिक बल सुरक्षित है।
