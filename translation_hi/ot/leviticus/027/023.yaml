id: LEV.27.23
reference: Leviticus 27:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/חִשַּׁב ל֣/וֹ הַ/כֹּהֵ֗ן אֵ֚ת מִכְסַ֣ת הָֽ/עֶרְכְּ/ךָ֔ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נָתַ֤ן אֶת הָ/עֶרְכְּ/ךָ֙ בַּ/יּ֣וֹם הַ/ה֔וּא קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/023.yaml
  text: then the priest shall calculate for him the proportion of your valuation up to the Year of Jubilee[a], and on that day he shall give your valuation as a holy offering to Yahweh.
translation:
  language: hi
  text: तब याजक उसके लिए जुबली के वर्ष तक उसके मूल्य की रकम गिनेगा; और वह उसी दिन वह मूल्य देगा, जो याहवे के लिए पवित्र ठहरेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: तब ... अनुपात निकालेगा
  rationale: पिएल रूप यहाँ किसी राशि की गणना करने का अर्थ देता है। ‘तब’ पिछले विधान से स्वाभाविक क्रम व्यक्त करता है।
- source_word: לּוֹ
  choice: उसके लिए
  rationale: सम्प्रदान कारक बताता है कि याजक उस व्यक्ति के लिए राशि की गणना करता है।
- source_word: מִכְסַת
  choice: अनुपात
  rationale: यह शब्द निर्धारित मात्रा या हिस्से को दर्शाता है; यहाँ पूरी मूल्य-राशि को जुबली के वर्ष तक बचे समय के अनुसार अनुपात में निकाला जाता है।
- source_word: הָעֶרְכְּךָ
  choice: तुम्हारे ठहराए हुए मूल्य
  rationale: लैव्यव्यवस्था 27 में עֵרֶךְ मन्नत से जुड़ी निर्धारित मूल्य-राशि का तकनीकी शब्द है। यह अनुवाद दूसरे पुरुष एकवचन प्रत्यय को भी बनाए रखता है।
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: जुबली के वर्ष तक
  rationale: वाक्यांश उस अंतिम समय-सीमा को बताता है जिसके अनुसार आनुपातिक राशि निकाली जाती है। ‘जुबली का वर्ष’ इस संस्था का प्रचलित और समझने योग्य नाम है।
- source_word: וְנָתַן
  choice: वह ... देगा
  rationale: נתן का मूल अर्थ ‘देना’ है। कर्ता इब्रानी में निहित है; प्रसंग के अनुसार भूमि समर्पित करने वाला व्यक्ति राशि देता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: यह स्वाभाविक हिन्दी में निर्दिष्ट दिन पर तत्काल दिए जाने को व्यक्त करता है।
- source_word: קֹדֶשׁ לַיהוָה
  choice: याहवे को पवित्र भेंट के रूप में
  rationale: शाब्दिक अर्थ ‘याहवे के लिए पवित्र’ है। राशि देने के प्रसंग में ‘पवित्र भेंट’ उपासना-संबंधी आशय स्पष्ट करती है; अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
theological_decisions:
- issue: וְנָתַן का निहित कर्ता
  choice: 'भूमि समर्पित करने वाला व्यक्ति समझा गया है: ‘वह ... देगा’'
  alternative: याजक देगा
  rationale: याजक गणना करता है, पर निकटवर्ती प्रसंग में भूमि समर्पित या छुड़ाने वाला व्यक्ति निर्धारित राशि देता है। फिर भी हिन्दी में केवल ‘वह’ रखकर इब्रानी की निहितता कुछ हद तक सुरक्षित रखी गई है।
- issue: קֹדֶשׁ לַיהוָה का अनुवाद
  choice: याहवे को पवित्र भेंट के रूप में
  alternative: याहवे के लिए पवित्र
  rationale: यह वाक्यांश याहवे के लिए अभिषिक्त या अलग की गई वस्तु को दर्शाता है। मुख्य पाठ में उपासना-संबंधी अर्थ स्पष्ट किया गया है और औपचारिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी रखी गई है। ‘ठहराया हुआ मूल्य’ अध्याय के तकनीकी मूल्यांकन-भाव को व्यक्त करता है, जबकि ‘जुबली का वर्ष’ संस्थागत पद को पहचानने योग्य बनाए रखता है।
