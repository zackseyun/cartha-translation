revisions:
- from: तब याजक उसके लिए जुबली के वर्ष तक तुम्हारे ठहराए हुए मूल्य का अनुपात निकालेगा; और वह उसी दिन तुम्हारा ठहराया हुआ मूल्य याहवे को पवित्र भेंट[a] के रूप में देगा।
  to: तब याजक उसके लिए जुबली के वर्ष तक उसके मूल्य की रकम गिनेगा; और वह उसी दिन वह मूल्य देगा, जो याहवे के लिए पवित्र ठहरेगा।
  rationale: The revision removes the distracting person shift, renders the calculated payable amount in natural Hindi, and expresses קֹדֶשׁ לַיהוָה directly as consecration to Yahweh. Because the main text no longer requires an alternate wording at a defined anchor, the former footnote marker is removed; the lexical alternative is retained here in the revised footnote set for editorial use if an anchor is desired.
