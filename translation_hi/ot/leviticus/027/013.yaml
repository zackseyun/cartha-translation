lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह शर्त पिछले विधान के विपरीत विकल्प को प्रस्तुत करती है; इसलिए ‘परन्तु यदि’ प्रसंग के विरोधात्मक प्रवाह को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גָּאֹל יִגְאָלֶנָּה
  choice: वह उसे छुड़ाता ही है
  rationale: धातु גאל के क्रियार्थक संज्ञारूप और समापिका क्रिया का संयुक्त प्रयोग क्रिया पर बल देता है। ‘छुड़ाता ही है’ उस बल को रखता है; स्त्रीलिंग कर्म-प्रत्यय का संकेत पिछले पद के पशु की ओर है।
- source_word: וְיָסַף
  choice: तो वह … और जोड़ दे
  rationale: इस विधिक संदर्भ में वाव के साथ पूर्ण क्रिया शर्त का अनिवार्य परिणाम बताती है। ‘तो … जोड़ दे’ आधुनिक हिन्दी में निर्देशात्मक परिणाम स्पष्ट करता है।
- source_word: חֲמִישִׁתוֹ
  choice: उसका पाँचवाँ भाग
  rationale: संज्ञा का अर्थ ‘पाँचवाँ भाग’ है और प्रत्यय उस मूल्यांकन की राशि की ओर संकेत करता है; हिन्दी में ‘उसका पाँचवाँ भाग’ अनुपात को स्पष्ट रखता है।
- source_word: עַל עֶרְכֶּךָ
  choice: तुम्हारे मूल्यांकन में … और
  rationale: עַל यहाँ मूल मूल्यांकन के ऊपर अतिरिक्त राशि जोड़ने का भाव देता है। עֶרְכֶּךָ में द्वितीय पुरुष एकवचन संबोधन को ‘तुम्हारे मूल्यांकन’ से सुरक्षित रखा गया है।
