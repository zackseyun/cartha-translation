  yaml_path: translation/ot/leviticus/027/025.yaml
  text: And every valuation of yours shall be by the sanctuary shekel[a]; the shekel shall be twenty gerahs.
translation:
  language: hi
  text: और तुम्हारा हर मूल्यांकन पवित्रस्थान के शेकेल[a] के अनुसार होगा; एक शेकेल बीस गेरा का होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र शेकेल के अनुसार।” इब्रानी पदबंध पवित्रस्थान से संबंधित मूल्यांकनों में प्रयुक्त मानक शेकेल को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְכְּךָ
  choice: तुम्हारा हर मूल्यांकन
  rationale: लैव्यव्यवस्था 27 में यह शब्द मन्नत से संबंधित व्यक्तियों या वस्तुओं के निर्धारित मूल्य के लिए तकनीकी अर्थ रखता है। ‘मूल्यांकन’ इस अर्थ को बनाए रखता है, और द्वितीय पुरुष एकवचन प्रत्यय को ‘तुम्हारा’ द्वारा व्यक्त किया गया है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह पवित्रस्थान से संबंधित मूल्यांकनों में प्रयुक्त आधिकारिक मानक शेकेल को दर्शाता है। यह अनुवाद केवल नैतिक रूप से ‘पवित्र’ सिक्के का अर्थ देने से बचता है।
- source_word: גֵּרָה
  choice: गेरा
  rationale: गेरा भार अथवा मुद्रा की एक छोटी प्राचीन इकाई है; इसका सहज आधुनिक हिन्दी समतुल्य न होने के कारण लिप्यंतरण उचित है।
- source_word: עֶשְׂרִים גֵּרָה יִהְיֶה הַשָּׁקֶל
  choice: एक शेकेल बीस गेरा का होगा
  rationale: यह वाक्य शेकेल का मान परिभाषित करता है और हिन्दी में स्वाभाविक रहते हुए इब्रानी अर्थ को निकटता से व्यक्त करता है।
- source_word: וְכָל
  choice: और ... हर
  rationale: 'संयोजक और वितरणात्मक अर्थ दोनों सुरक्षित रखे गए हैं: प्रत्येक मूल्यांकन इसी मानक से होना है।'
- source_word: יִהְיֶה
  choice: होगा
  rationale: विधिक संदर्भ में इब्रानी अपूर्ण क्रिया का निर्देशात्मक बल हिन्दी भविष्यत् रूप से स्वाभाविक और पर्याप्त रूप में व्यक्त होता है।
