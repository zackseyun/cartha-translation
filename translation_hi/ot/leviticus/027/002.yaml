source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם אִ֕ישׁ כִּ֥י יַפְלִ֖א נֶ֑דֶר בְּ/עֶרְכְּ/ךָ֥ נְפָשֹׁ֖ת לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man makes a special vow, involving the valuation of persons to Yahweh,'
translation:
  language: hi
  text: '“तू इस्राएलियों से बोल और उनसे कह: जब कोई पुरुष व्यक्तियों के तेरे मूल्यांकन के अनुसार याहवेह के लिए विशेष मन्नत माने—[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध कठिन है। शाब्दिक रूप से, “व्यक्तियों के तेरे मूल्यांकन के अनुसार” है; ‘तेरे’ से संबोधन मूसा को है। इसका अर्थ व्यक्तियों के उस मूल्यांकन से संबंधित मन्नत भी हो सकता है, जिसके मूल्य आगे की आयतों में दिए गए हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों से कह
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्रों’ का आधुनिक मानक हिन्दी में स्वाभाविक सामुदायिक समतुल्य ‘इस्राएली’ है; आज्ञार्थक ‘कह’ ईश्वरीय निर्देश की शैली बनाए रखता है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: विधिक कथन के प्रतिनिधिक भाव को ‘कोई’ और स्रोत के पुल्लिंग एकवचन को ‘पुरुष’ द्वारा सुरक्षित रखा गया है।
- source_word: יַפְלִא נֶדֶר
  choice: एक विशेष मन्नत माने
  rationale: हिफ़ील क्रिया यहाँ साधारण मन्नत से अलग, विशेष रूप से की गई मन्नत का संकेत देती है; ‘मन्नत मानना’ स्वाभाविक हिन्दी धार्मिक-विधिक प्रयोग है।
- source_word: בְּעֶרְכְּךָ נְפָשֹׁת
  choice: व्यक्तियों के निर्धारित मूल्य के संबंध में
  rationale: यह कठिन इब्रानी पदबंध आगामी आयतों में दिए व्यक्ति-मूल्यांकन से संबंधित है। ‘निर्धारित मूल्य’ विधिक संदर्भ स्पष्ट करता है, जबकि संबंध की सटीक प्रकृति को अत्यधिक निश्चित नहीं करता।
- source_word: לַיהוָה
  choice: याहवेह के लिए
  rationale: लामेद समर्पण अथवा लाभार्थी संबंध बताता है; ईश्वरीय व्यक्तिगत नाम יהוה को लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवेह
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिवाचक वाचा-नाम है; लिप्यंतरण इसे किसी उपाधि से प्रतिस्थापित नहीं करता। हिन्दी में ‘याहवेह’ उच्चारण-सहायक रूप है।
- issue: אִישׁ का लैंगिक और विधिक बल
  choice: कोई पुरुष
  alternative: कोई व्यक्ति
  rationale: मूल का पुल्लिंग एकवचन बनाए रखा गया है, साथ ही ‘कोई’ उसके सामान्य विधिक विन्यास को व्यक्त करता है।
- issue: מְעֶרְכְּךָ की कठिनता
  choice: निर्धारित मूल्य के संबंध में
  alternative: तेरे मूल्यांकन के अनुसार
  rationale: दूसरा विकल्प द्वितीय पुरुष प्रत्यय को अधिक प्रत्यक्ष रखता है, पर ऐसा आभास दे सकता है कि मूसा स्वयं प्रत्येक मूल्य तय करता है। मुख्य पाठ आगामी निर्धारित मूल्य-सारणी से संबंध दिखाता है और फुटनोट वास्तविक अस्पष्टता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और मौखिक पठन के अनुकूल हिन्दी। पद्यांश अगले नियमों की भूमिका है, इसलिए अंत में डैश रखा गया है। ‘इस्राएलियों’ को शाब्दिक ‘इस्राएल के पुत्रों’ की अपेक्षा स्वाभाविक हिन्दी के लिए चुना गया है।
