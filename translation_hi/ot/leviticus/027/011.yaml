source:
  edition: WLC
  text: וְ/אִם֙ כָּל בְּהֵמָ֣ה טְמֵאָ֔ה אֲ֠שֶׁר לֹא יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה וְ/הֶֽעֱמִ֥יד אֶת הַ/בְּהֵמָ֖ה לִ/פְנֵ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/011.yaml
  text: But if it is any unclean animal from which they may not present an offering to Yahweh[a], then he shall set the animal before the priest,
translation:
  language: hi
  text: परन्तु यदि कोई अशुद्ध पशु ऐसा हो, जिसमें से याहवे के लिए भेंट नहीं चढ़ाई जाती, तो वह उस पशु को याजक के सामने खड़ा करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले विधान से भिन्न अगली सशर्त स्थिति प्रस्तुत करता है; ‘परन्तु यदि’ विरोध और शर्त दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל בְּהֵמָה טְמֵאָה
  choice: कोई अशुद्ध पशु
  rationale: एकवचन संज्ञा के साथ כָּל यहाँ अनिश्चित अर्थ देता है। टָמֵא का आशय अनुष्ठानिक अशुद्धता है, न कि केवल गंदा होना।
- source_word: אֲשֶׁר לֹא יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: जिसमें से ... भेंट नहीं चढ़ाई जा सकती
  rationale: מִמֶּנָּה के ‘जिसमें से’ अर्थ को रखा गया है और सामान्य/निरपेक्ष बहुवचन יַקְרִיבוּ को हिन्दी के स्वाभाविक भाववाच्य से व्यक्त किया गया है। ‘भेंट चढ़ाना’ הקריב के बलिदान-संबंधी भाव को दर्शाता है।
- source_word: קָרְבָּן
  choice: भेंट
  rationale: यह परमेश्वर के निकट लाई जाने वाली उपासना-संबंधी भेंट का मानक और सर्वसुलभ हिन्दी पद है।
- source_word: לַיהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए विशिष्ट वाचा-नाम יהוה को सामान्य उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: וְהֶעֱמִיד
  choice: तो वह ... खड़ा करे
  rationale: עמד के हिफ़ील रूप का मूल अर्थ ‘खड़ा करना’ है; कानूनी निर्देश के प्रसंग में यह स्पष्ट और स्वाभाविक है।
- source_word: אֶת הַבְּהֵמָה לִפְנֵי הַכֹּהֵן
  choice: उस पशु को याजक के सामने
  rationale: वस्तु और स्थान-सूचक वाक्यांश का सीधा अनुवाद है, जो अगले पद में याजकीय मूल्यांकन की औपचारिक परिस्थिति बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का विशिष्ट ईश्वरीय नाम सुरक्षित रखा गया है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है; पादटिप्पणी ‘याहवे’ विकल्प को स्पष्ट करती है।
- issue: अशुद्ध पशु से भेंट चढ़ाने की अयोग्यता
  choice: भेंट नहीं चढ़ाई जा सकती
  alternative: वे भेंट नहीं चढ़ाते
  rationale: मूल के तृतीय पुरुष बहुवचन का प्रयोग सामान्य/निरपेक्ष है। हिन्दी का भाववाच्य इस सामान्य निषेध या अनुपयुक्तता को किसी विशेष कर्ता से जोड़े बिना व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक निर्देश के अनुकूल रखी गई है। ‘अशुद्ध’ अनुष्ठानिक श्रेणी को, ‘याजक’ धार्मिक पद को, और ‘खड़ा करे’ हिफ़ील क्रिया की ठोस छवि को सुरक्षित रखते हैं।
