source:
  edition: WLC
  text: וְ/אִ֣ם מִ/שְּׂדֵ֣ה אֲחֻזָּת֗/וֹ יַקְדִּ֥ישׁ אִישׁ֙ לַֽ/יהוָ֔ה וְ/הָיָ֥ה עֶרְכְּ/ךָ֖ לְ/פִ֣י זַרְע֑/וֹ זֶ֚רַע חֹ֣מֶר שְׂעֹרִ֔ים בַּ/חֲמִשִּׁ֖ים שֶׁ֥קֶל כָּֽסֶף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/016.yaml
  text: 'If a man consecrates to Yahweh part of the field of his possession[a], then your valuation shall be according to its seed requirement: fifty shekels of silver for the seed of a homer of barley.'
translation:
  language: hi
  text: '“यदि कोई पुरुष अपनी पैतृक भूमि के खेत का कुछ भाग यहोवा के लिए पवित्र ठहराए, तो उसका मूल्यांकन उसमें बोए जानेवाले बीज की मात्रा के अनुसार हो: जौ के बीज का एक होमेर, चाँदी के पचास शेकेल।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘होमेर’ सूखी वस्तुओं की एक प्राचीन माप-इकाई थी। यहाँ खेत का मूल्य उसमें बोने के लिए आवश्यक जौ के बीज की मात्रा के आधार पर निर्धारित किया गया है।
    reason: measurement_clarification
lexical_decisions:
- source_word: מִשְּׂדֵה אֲחֻזָּתוֹ
  choice: अपनी पैतृक भूमि के खेत का कुछ भाग
  rationale: מִן उपसर्ग खेत के पूरे भाग के बजाय उसमें से कुछ भाग का संकेत देता है; אֲחֻזָּה वंशानुगत भू-अधिकार या पैतृक संपत्ति को दर्शाता है।
- source_word: יַקְדִּישׁ
  choice: पवित्र ठहराए
  rationale: यह क्रिया किसी वस्तु को यहोवा के लिए अलग करके पवित्र करने का उपासना-संबंधी अर्थ रखती है; अध्याय के मूल्यांकन-विषयक संदर्भ में यह स्वाभाविक और सटीक है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: इब्रानी शब्द व्याकरण की दृष्टि से पुल्लिंग एकवचन है और इस कानूनी निर्देश में प्रतिनिधिक रूप से प्रयुक्त हुआ है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה है; हिंदी में प्रचलित नामरूप ‘यहोवा’ उसे उपाधि में बदले बिना व्यक्त करता है।
- source_word: עֶרְכְּךָ
  choice: उसका मूल्यांकन
  rationale: शाब्दिक रूप ‘तुम्हारा मूल्यांकन’ है, पर हिंदी में आशय मूल्य निर्धारित करने की क्रिया/निर्धारित मूल्य से है; ‘उसका मूल्यांकन’ खेत के आकलन को स्पष्ट करता है, बिना कर्ता के विषय में अनावश्यक निष्कर्ष जोड़े।
- source_word: לְפִי זַרְעוֹ
  choice: उसमें बोए जानेवाले बीज की मात्रा के अनुसार
  rationale: यह खेत को बोने के लिए आवश्यक बीज की मात्रा पर आधारित कृषि-माप है; यह अनुवाद अर्थ को स्पष्ट करता है।
- source_word: זֶרַע חֹמֶר שְׂעֹרִים
  choice: एक होमेर जौ के बीज के लिए
  rationale: यह जौ के बीज की ‘होमेर’ नामक मात्रा को मूल्यांकन की इकाई बनाता है; तकनीकी माप को लिप्यंतरित रखा गया है।
- source_word: בַּחֲמִשִּׁים שֶׁקֶל כָּסֶף
  choice: पचास शेकेल चाँदी
  rationale: मूल पाठ में निर्धारित आकलन-राशि है; प्राचीन भार/मुद्रा-इकाई ‘शेकेल’ को सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहोवा’ आधुनिक हिंदी बाइबलीय प्रयोग में व्यापक और साधारण पाठकों के लिए परिचित है; ‘प्रभु’ नाम को उपाधि बना देता, जबकि ‘याहवे’ भी संभावित लिप्यंतरण है।
- issue: कानूनी निर्देश में אִישׁ का प्रतिनिधिक पुल्लिंग
  choice: कोई पुरुष
  alternative: कोई व्यक्ति
  rationale: स्रोत का व्याकरणिक पुल्लिंग बनाए रखा गया है, साथ ही ‘कोई’ उसके सामान्य कानूनी अनुप्रयोग को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण कानूनी-धार्मिक शैली। प्राचीन तकनीकी इकाइयाँ ‘होमेर’ और ‘शेकेल’ लिप्यंतरित हैं। मुख्य पाठ में अर्थ स्पष्ट करने के लिए सहज वाक्य-विन्यास अपनाया गया है।
