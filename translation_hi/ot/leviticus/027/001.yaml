  text: याहवे ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: यह क्रिया यहाँ वाणी के मानक कथात्मक सूत्र का आरम्भ करती है। हिन्दी में इसके बाद לֵאמֹר के साथ शाब्दिक दोहराव करने के बजाय ‘ने…कहा’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה का लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אֶל מֹשֶׁה
  choice: मूसा से
  rationale: दिव्य वाणी के संबोधित व्यक्ति को आधुनिक हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया जाता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह आगामी वचन की विषयवस्तु प्रस्तुत करता है। हिन्दी में ‘कहते हुए कहा’ जैसे अस्वाभाविक दोहराव से बचते हुए इसे मुख्य वाणी-क्रिया में समाहित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसके संभावित उच्चारण का प्रचलित आधुनिक लिप्यंतरण है और नाम को उपाधि में बदलने से बचाता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। इब्रानी वाणी-सूत्र וַיְדַבֵּר…לֵאמֹר को हिन्दी के स्वाभाविक ‘ने…से कहा’ में संक्षिप्त किया गया है; अंत का अल्पविराम अगले पद में आने वाले कथन का संकेत देता है।
