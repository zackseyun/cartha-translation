  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹ֧א יְבַקֵּ֛ר בֵּֽין ט֥וֹב לָ/רַ֖ע וְ/לֹ֣א יְמִירֶ֑/נּוּ וְ/אִם הָמֵ֣ר יְמִירֶ֔/נּוּ וְ/הָֽיָה ה֧וּא וּ/תְמוּרָת֛/וֹ יִֽהְיֶה קֹ֖דֶשׁ לֹ֥א יִגָּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/033.yaml
  text: He shall not inspect whether it is good or bad[a], nor shall he exchange it; and if he does in fact exchange it, then both it and its substitute shall be holy[b]; it shall not be redeemed.
translation:
  language: hi
  text: वह यह जाँच न करे कि वह अच्छा है या बुरा[a], और न उसे बदले। यदि वह सचमुच उसे बदल दे[b], तो वह पशु और उसके बदले रखा गया पशु—दोनों पवित्र होंगे; उसे छुड़ाया नहीं जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अच्छे और बुरे के बीच जाँच न करे।” इब्रानी मुहावरा पशु चुनते समय उसकी गुणवत्ता के आधार पर भेद करने को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में infinitive absolute के साथ क्रिया द्वारा जोर दिया गया है: “यदि वह निश्चय ही उसे बदल दे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקֵּר / בֵּין טוֹב לָרַע
  choice: अच्छे और बुरे के बीच जाँच-पड़ताल करे
  rationale: पिएल क्रिया यहाँ दशमांश के पशुओं में गुण के आधार पर जाँचकर चुनाव या भेद करने को व्यक्त करती है। यह रूप इब्रानी मुहावरे की संरचना और विधिक संदर्भ दोनों को बनाए रखता है।
- source_word: יְמִירֶנּוּ / הָמֵר יְמִירֶנּוּ
  choice: उसे बदले / उसे बदल ही दे
  rationale: मूल מור किसी पशु के स्थान पर दूसरा पशु रखने का विधिक अर्थ देता है। ‘ही दे’ infinitive absolute और finite verb के जोर को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: תְמוּרָתוֹ
  choice: उसके बदले का पशु
  rationale: संदर्भ में यह मूल पशु के स्थान पर रखे गए दूसरे पशु को सूचित करता है; ‘पशु’ जोड़ने से हिन्दी में संदर्भ स्पष्ट रहता है।
- source_word: קֹדֶשׁ
  choice: पवित्र
  rationale: लैव्यव्यवस्था में यह परमेश्वर के लिए अलग किए जाने की उपासना-संबंधी स्थिति है; ‘पवित्र’ उस धार्मिक-विधिक अर्थ को सुरक्षित रखता है।
- source_word: לֹא יִגָּאֵל
  choice: उन्हें छुड़ाया नहीं जा सकेगा
  rationale: निफ़अल रूप समर्पित स्थिति से छुड़ाए या वापस लिए जाने को व्यक्त करता है। निकटतम संयुक्त कर्ता दोनों पशु हैं, इसलिए हिन्दी में बहुवचन अर्थ स्पष्ट किया गया है।
- source_word: הוּא וּתְמוּרָתוֹ
  choice: वह पशु और उसके बदले का पशु—दोनों
  rationale: मूल और स्थानापन्न दोनों के पवित्र होने को सहज और असंदिग्ध हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: समर्पण की उपासना-संबंधी और विधिक शक्ति
  choice: קֹדֶשׁ के लिए ‘पवित्र’ और גאל के लिए ‘छुड़ाया’
  alternative: ‘समर्पित’ और ‘वापस खरीदा’
  rationale: चुने हुए शब्द इस्राएल की उपासना-व्यवस्था में पशुओं की परमेश्वर के लिए अलग की गई स्थिति और उस स्थिति से उन्हें छुड़ाने की मनाही को बनाए रखते हैं, बिना बाद की किसी विशिष्ट धर्मसैद्धान्तिक धारणा को जोड़ने के।
- issue: अंतिम निषेध का वचन-सामंजस्य
  choice: ‘उन्हें छुड़ाया नहीं जा सकेगा’ द्वारा दोनों पशुओं पर निषेध लागू करना
  alternative: 'शाब्दिक एकवचन: ‘उसे छुड़ाया नहीं जाएगा’'
  rationale: इब्रानी क्रिया एकवचन है, पर निकटवर्ती कथन मूल और स्थानापन्न दोनों को पवित्र ठहराता है। हिन्दी बहुवचन इस विधिक परिणाम को स्पष्ट करता है; एकवचन रूप को वैकल्पिक टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण विधिक-धार्मिक स्वर रखा गया है। ‘जाँच-पड़ताल’, ‘बदल ही दे’, ‘पवित्र’ और ‘छुड़ाया’ सामान्य पाठक के लिए सुबोध हैं, जबकि मूल की उपासना-संबंधी गंभीरता और जोर भी बनाए रखते हैं।
