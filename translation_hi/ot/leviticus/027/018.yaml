  text: וְ/אִם אַחַ֣ר הַ/יֹּבֵל֮ יַקְדִּ֣ישׁ שָׂדֵ/הוּ֒ וְ/חִשַּׁב ל֨/וֹ הַ/כֹּהֵ֜ן אֶת הַ/כֶּ֗סֶף עַל פִּ֤י הַ/שָּׁנִים֙ הַ/נּ֣וֹתָרֹ֔ת עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/נִגְרַ֖ע מֵֽ/עֶרְכֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/018.yaml
  text: But if he consecrates his field after the Jubilee[a], then the priest shall calculate the money for him according to the years remaining until the year of Jubilee[c][b], and it shall be deducted from your valuation.
translation:
  language: hi
  text: लेकिन यदि वह जुबली के बाद[a] अपने खेत को पवित्र ठहराता है, तो याजक जुबली के वर्ष तक बचे हुए वर्षों के अनुसार उसके लिए धनराशि की गणना करेगा[b], और उसे तुम्हारे मूल्यांकन में से घटा दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जुबली के वर्ष के बाद।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘याजक उसके लिए मूल्य आँके।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַיֹּבֵל
  choice: जुबली के बाद
  rationale: यह पदबंध समयगत क्रम बताता है और लैव्यव्यवस्था में जुबली की स्थापित व्यवस्था अथवा उसके वर्ष की ओर संकेत करता है।
- source_word: יַקְדִּישׁ
  choice: पवित्र ठहराए
  rationale: קדשׁ यहाँ खेत को यहोवा के लिए पवित्र रूप से अलग करने का भाव रखता है; यह सामान्य समर्पण से अधिक स्पष्ट रूप से उपासना-संबंधी अर्थ व्यक्त करता है।
- source_word: שָׂדֵהוּ
  choice: अपना खेत
  rationale: इब्रानी में तीसरे पुरुष का संबंधसूचक प्रत्यय है; हिन्दी में कर्ता की ओर लौटता ‘अपना’ स्वाभाविक और सटीक है।
- source_word: וְחִשַּׁב לוֹ הַכֹּהֵן אֶת הַכֶּסֶף
  choice: तो याजक उसके लिए धनराशि की गणना करे
  rationale: חשב का अर्थ इस कानूनी संदर्भ में हिसाब लगाना है और הַכֶּסֶף यहाँ मूल्य की मौद्रिक राशि को दर्शाता है।
- source_word: עַל פִּי הַשָּׁנִים הַנּוֹתָרֹת
  choice: बचे हुए वर्षों के अनुसार
  rationale: עַל־פִּי का अर्थ ‘के अनुसार/के आधार पर’ है और गणना शेष वर्षों के अनुपात में होती है।
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: जुबली के वर्ष तक
  rationale: यह शेष वर्षों की गणना की अंतिम सीमा को स्पष्ट करता है।
- source_word: וְנִגְרַע
  choice: और वह ... घटाई जाए
  rationale: גרע का निफ़अल रूप यहाँ निर्धारित मूल्य में से राशि कम किए जाने को व्यक्त करता है।
- source_word: מֵעֶרְכֶּךָ
  choice: तुम्हारे ठहराए हुए मूल्य में से
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को ‘तुम्हारे’ के रूप में बनाए रखा गया है और ערך को इस कानूनी संदर्भ में निर्धारित मूल्य के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: מֵעֶרְכֶּךָ में द्वितीय पुरुष एकवचन प्रत्यय
  choice: तुम्हारे ठहराए हुए मूल्य में से
  alternative: ठहराए हुए मूल्य में से
  rationale: इब्रानी पाठ का प्रत्यक्ष एकवचन संबोधन बनाए रखने से कानूनी शैली और पिछले निर्धारित मूल्य से उसका संबंध सुरक्षित रहता है।
- issue: יַקְדִּישׁ के लिए उपासना-संबंधी शब्दावली
  choice: पवित्र ठहराए
  alternative: समर्पित करे
  rationale: यह खेत को पवित्र उपयोग के लिए अलग करने का भाव सुरक्षित रखता है, बिना किसी अतिरिक्त सांप्रदायिक अर्थ को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कानूनी-धार्मिक शैली रखी गई है। ‘जुबली’ और ‘याजक’ जैसे प्रचलित बाइबलीय पद बनाए गए हैं; वाक्यरचना सामान्य पाठक के लिए सहज रखी गई है।
