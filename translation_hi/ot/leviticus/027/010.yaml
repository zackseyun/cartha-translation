source:
  edition: WLC
  text: לֹ֣א יַחֲלִיפֶ֗/נּוּ וְ/לֹֽא יָמִ֥יר אֹת֛/וֹ ט֥וֹב בְּ/רָ֖ע אוֹ רַ֣ע בְּ/ט֑וֹב וְ/אִם הָמֵ֨ר יָמִ֤יר בְּהֵמָה֙ בִּ/בְהֵמָ֔ה וְ/הָֽיָה ה֥וּא וּ/תְמוּרָת֖/וֹ יִֽהְיֶה קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/010.yaml
  text: He shall not replace it or exchange it[a], good for bad or bad for good; and if he does indeed exchange one animal for another[b], then both it and its substitute shall be holy.
translation:
  language: hi
  text: वह उस पशु को न तो दूसरे पशु से बदले, न उसकी अदला-बदली करे[a]—न अच्छे के बदले बुरा, और न बुरे के बदले अच्छा। और यदि वह एक पशु की दूसरे पशु से अदला-बदली कर ही दे[b], तो वह पशु और उसके बदले दिया गया पशु—दोनों पवित्र होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में बदलने या अदला-बदली करने के लिए दो संबंधित, पर अलग क्रियाएँ प्रयुक्त हुई हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में क्रिया को बल देकर कहा गया है; अर्थ है, ‘यदि वह अदला-बदली कर ही दे’ या ‘यदि वह सचमुच अदला-बदली करे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲלִיפֶנּוּ
  choice: उस पशु को ... दूसरे पशु से बदले
  rationale: हिफ़ील रूप यहाँ समर्पित पशु को किसी अन्य पशु से बदल देने का संकेत देता है। यह चयन अगले, संबंधित किंतु भिन्न क्रियापद מוּר से कुछ भेद बनाए रखता है।
- source_word: יָמִיר אֹתוֹ
  choice: उसकी अदला-बदली करे
  rationale: מוּר इस कानूनी प्रसंग में एक पशु के स्थान पर दूसरा देने का अर्थ रखता है। ‘अदला-बदली’ स्वाभाविक हिंदी है और पहले क्रियापद के साथ इब्रानी के दो-क्रियापद विन्यास को दर्शाती है।
- source_word: טוֹב בְּרָע אוֹ רַע בְּטוֹב
  choice: न अच्छे के बदले बुरा, और न बुरे के बदले अच्छा
  rationale: विशेषण यहाँ संज्ञा के समान प्रयुक्त हैं और ב विनिमय का संबंध बताता है। संक्षिप्त समानांतर रचना मूल के कानूनी विरोध को सुरक्षित रखती है।
- source_word: וְאִם הָמֵר יָמִיר
  choice: फिर भी यदि वह ... अदला-बदली कर ही दे
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute कार्रवाई पर बल देता है। ‘कर ही दे’ आधुनिक हिंदी में उस बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּהֵמָה בִּבְהֵמָה
  choice: एक पशु की दूसरे पशु से
  rationale: यह हिंदी में एक पशु के बदले दूसरा पशु देने के पारस्परिक विनिमय को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: וְהָיָה הוּא וּתְמוּרָתוֹ
  choice: वह पशु और उसके बदले दिया गया पशु—दोनों
  rationale: सर्वनाम मूल पशु को और תְמוּרָתוֹ उसके स्थान पर दिए गए पशु को दर्शाता है। ‘दोनों’ परिणाम को स्पष्ट करता है, बिना संदर्भ में अनुपस्थित कोई नई धारणा जोड़े।
- source_word: קֹדֶשׁ
  choice: पवित्र
  rationale: मन्नत और बलि-संबंधी व्यवस्था में यह परमेश्वर के लिए अलग किए जाने की पवित्र स्थिति बताता है। ‘पवित्र’ इसका सीधा और स्थापित हिंदी रूप है।
theological_decisions:
- issue: अदला-बदली के प्रयास के बाद मूल और बदले में दिए गए पशु की स्थिति
  choice: मूल पशु और उसके बदले दिया गया पशु, दोनों पवित्र होते हैं।
  alternative: केवल बदले में दिया गया पशु पवित्र होता है; अथवा कथन केवल अदला-बदली की अमान्यता बताता है।
  rationale: ‘वह और उसका बदला पवित्र होगा’ व्याकरणतः दोनों पशुओं को पवित्र स्थिति देता है। अनुवाद ‘दोनों’ से इस द्विविध परिणाम को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण कानूनी शैली रखी गई है। ‘पशु’ संदर्भ से स्पष्ट किया गया है; ‘बदले’ और ‘अदला-बदली’ मूल की दो निकटार्थी क्रियाओं का सीमित भेद बनाए रखते हैं। बलसूचक इब्रानी रचना के लिए ‘कर ही दे’ चुना गया है।
