source:
  edition: WLC
  text: וְ/אִם בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֧יבוּ מִמֶּ֛/נָּה קָרְבָּ֖ן לַֽ/יהוָ֑ה כֹּל֩ אֲשֶׁ֨ר יִתֵּ֥ן מִמֶּ֛/נּוּ לַ/יהוָ֖ה יִֽהְיֶה קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/009.yaml
  text: And if it is an animal from which they present an offering to Yahweh[a], everything that one gives from it to Yahweh shall be holy.
translation:
  language: hi
  text: और यदि कोई पशु ऐसा हो जिसमें से याहवे के लिए भेंट चढ़ाई जाती है[a], तो उसमें से जो कुछ कोई याहवे को दे, वह पवित्र होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऐसा पशु जिसमें से याहवे के लिए भेंट चढ़ाई जाए।” इब्रानी वाक्यांश का अर्थ ऐसा पशु हो सकता है जिसमें से वास्तव में भेंट चढ़ाई जाती है, अथवा ऐसा पशु जो याहवे को भेंट चढ़ाने योग्य हो।
    reason: मूल इब्रानी में מִמֶּנָּה के संबंध और बलिदान-संबंधी वाक्यांश की बनावट के कारण दो सम्भव अर्थ हैं।
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: विधिक प्रसंग की शर्त को आगे बढ़ाने वाले संयोजक וְ और शर्तसूचक אִם—दोनों का स्वाभाविक हिन्दी रूप।
- source_word: בְּהֵמָה
  choice: पशु
  rationale: यह सामान्य पशु-वाचक शब्द है; बलिदान-संबंधी प्रसंग में ‘पशु’ आधुनिक हिन्दी में स्पष्ट और पर्याप्त व्यापक है।
- source_word: אֲשֶׁר יַקְרִיבוּ מִמֶּנָּה קָרְבָּן
  choice: जिसमें से … भेंट चढ़ाई जाती है
  rationale: יַקְרִיבוּ का बलिदान-संबंधी अर्थ ‘निकट लाना/चढ़ाना’ है और מִמֶּנָּה स्रोत या श्रेणी दर्शाता है। कर्मवाच्य हिन्दी अनिर्दिष्ट बहुवचन कर्ता को स्वाभाविक ढंग से व्यक्त करती है; मूल वाक्यांश की दूसरी सम्भव समझ पादटिप्पणी में सुरक्षित है।
- source_word: קָרְבָּן
  choice: भेंट
  rationale: बलिदान या परमेश्वर को अर्पित वस्तु के लिए सरल, प्रतिष्ठित और व्यापक हिन्दी शब्द।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: मूल में आए परमेश्वर के विशिष्ट वाचा-नाम יהוה का लिप्यंतरण किया गया है।
- source_word: כֹּל אֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: उसमें से जो कुछ कोई … दे
  rationale: एकवचन क्रिया का अनिर्दिष्ट सामान्य कर्ता ‘कोई’ से व्यक्त होता है, और מִמֶּנּוּ का पशु की ओर संकेत ‘उसमें से’ से बना रहता है।
- source_word: יִהְיֶה קֹדֶשׁ
  choice: पवित्र होगा
  rationale: कानूनी और उपासना-संबंधी प्रसंग में परमेश्वर के लिए अलग किए जाने की स्थिति को ‘पवित्र’ सटीक धार्मिक गरिमा के साथ व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी में लिप्यंतरित करता है।
- issue: अंतिम पवित्रता-वचन का स्वरूप
  choice: वह पवित्र होगा
  alternative: वह पवित्र ठहरेगा
  rationale: יִהְיֶה अस्तित्व अथवा स्थिति को व्यक्त करता है। ‘होगा’ मूल की विधिक घोषणा को बनाए रखता है और यह अतिरिक्त व्याख्या नहीं जोड़ता कि पवित्रता केवल मानवीय निर्धारण से उत्पन्न होती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण विधिक-धार्मिक शैली रखी गई है। ‘चढ़ाई जाती है’ अनिर्दिष्ट कर्ता को स्वाभाविक बनाता है, जबकि पादटिप्पणी स्रोत-पाठ की वास्तविक संरचनात्मक अस्पष्टता को सुरक्षित रखती है।
