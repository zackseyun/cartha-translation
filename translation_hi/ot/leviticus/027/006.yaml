source:
  edition: WLC
  text: וְ/אִ֣ם מִ/בֶּן חֹ֗דֶשׁ וְ/עַד֙ בֶּן חָמֵ֣שׁ שָׁנִ֔ים וְ/הָיָ֤ה עֶרְכְּ/ךָ֙ הַ/זָּכָ֔ר חֲמִשָּׁ֥ה שְׁקָלִ֖ים כָּ֑סֶף וְ/לַ/נְּקֵבָ֣ה עֶרְכְּ/ךָ֔ שְׁלֹ֥שֶׁת שְׁקָלִ֖ים כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/006.yaml
  text: If it is from a month old up to five years old, your valuation for the male shall be five shekels of silver, and for the female your valuation shall be three shekels of silver.
translation:
  language: hi
  text: यदि किसी की आयु एक महीने से लेकर पाँच वर्ष तक हो, तो पुरुष के लिए तुम्हारा निर्धारित मूल्य चाँदी के पाँच शेकेल और स्त्री के लिए तुम्हारा निर्धारित मूल्य चाँदी के तीन शेकेल होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן־חֹדֶשׁ
  choice: आयु एक महीने से
  rationale: इब्रानी आयु-सूचक मुहावरे को स्वाभाविक और कानूनी रूप से स्पष्ट हिन्दी में व्यक्त करता है; सीमा एक महीने की आयु से आरम्भ होती है।
- source_word: וְעַד בֶּן־חָמֵשׁ שָׁנִים
  choice: पाँच वर्ष तक
  rationale: आयु-वर्ग की ऊपरी सीमा को संक्षिप्त और सहज हिन्दी में सुरक्षित रखता है।
- source_word: עֶרְכְּךָ
  choice: तुम्हारा निर्धारित मूल्य
  rationale: लैव्यव्यवस्था 27 में यह मन्नत से संबंधित नियत मूल्यांकन है; 'निर्धारित मूल्य' सामान्य पाठक के लिए स्पष्ट है और द्वितीय पुरुष एकवचन प्रत्यय 'तुम्हारा' को बनाए रखता है।
- source_word: הַזָּכָר
  choice: पुरुष
  rationale: यहाँ शब्द जैविक लिंग की कानूनी श्रेणी बताता है; आयु-विशिष्ट 'लड़का' कहने से बचते हुए हिन्दी में स्वाभाविक संज्ञा चुनी गई है।
- source_word: חֲמִשָּׁה שְׁקָלִים כָּסֶף
  choice: चाँदी के पाँच शेकेल
  rationale: राशि और धातु दोनों को सीधे व्यक्त करता है तथा प्राचीन भार-मुद्रा इकाई 'शेकेल' को सुरक्षित रखता है।
- source_word: וְלַנְּקֵבָה
  choice: और स्त्री के लिए
  rationale: पुरुष के समानांतर स्त्री-लिंग की कानूनी श्रेणी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁלֹשֶׁת שְׁקָלִים כָּסֶף
  choice: चाँदी के तीन शेकेल
  rationale: मूल में दी गई राशि को पुरुष के मूल्यांकन वाले वाक्यांश के अनुरूप प्रस्तुत करता है।
- source_word: וְהָיָה
  choice: होगा
  rationale: विधिक प्रसंग में निर्धारित व्यवस्था का भाव देता है और आधुनिक हिन्दी में सहज है।
theological_decisions: []
