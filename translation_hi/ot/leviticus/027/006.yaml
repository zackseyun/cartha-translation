  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट विधिक शैली अपनाई गई है। मूल के आयु-वर्ग, द्वितीय पुरुष एकवचन संबोधन और अलग-अलग निर्धारित मूल्यों को बनाए रखा गया है।
