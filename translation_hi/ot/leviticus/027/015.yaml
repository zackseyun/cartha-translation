  yaml_path: translation/ot/leviticus/027/015.yaml
  text: And if the one who consecrated it redeems his house[a], then he shall add a fifth of the silver of your valuation to it[b], and it shall be his.
translation:
  language: hi
  text: और यदि जिस व्यक्ति ने अपने घर को पवित्र ठहराया है वह उसे छुड़ाए, तो वह याजक द्वारा निर्धारित चाँदी के मूल्य में उसका पाँचवाँ भाग और जोड़ देगा[a]; तब वह घर उसका हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वह याजक द्वारा निर्धारित चाँदी के मूल्य में उसका एक-पाँचवाँ भाग अतिरिक्त जोड़ेगा।
    reason: cultural_note
lexical_decisions:
- source_word: הַמַּקְדִּישׁ
  choice: पवित्र ठहरानेवाला
  rationale: यह कृदन्त उस व्यक्ति को दर्शाता है जिसने अपना घर यहोवा के लिए पवित्र उपयोग हेतु अलग किया। ‘पवित्र ठहरानेवाला’ धार्मिक भाव बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: יִגְאַל
  choice: छुड़ा ले
  rationale: इस विधिक और पवित्र संदर्भ में क्रिया भुगतान करके संपत्ति फिर अपने अधिकार में लेने को दर्शाती है; ‘छुड़ा ले’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक और अर्थ-सटीक है।
- source_word: בֵּיתוֹ
  choice: उस घर को … वह घर
  rationale: मूल का अर्थ ‘उसका घर’ है। हिन्दी में संदर्भ स्पष्ट रखने और अस्पष्ट सर्वनाम से बचने के लिए ‘उस घर’ और अंतिम खंड में ‘वह घर’ रखा गया है।
- source_word: וְיָסַף
  choice: और जोड़ेगा
  rationale: शर्त पूरी होने पर अपेक्षित विधिक कार्य को भविष्यत् रूप में व्यक्त करता है; ‘और जोड़ेगा’ आदेशात्मक दायित्व को संदर्भ से स्पष्ट रखता है।
- source_word: חֲמִישִׁית
  choice: पाँचवाँ भाग
  rationale: शाब्दिक अर्थ एक-पाँचवाँ है। यह ‘बीस प्रतिशत’ की अपेक्षा प्राचीन विधिक अभिव्यक्ति के अधिक निकट है।
- source_word: כֶּסֶף עֶרְכְּךָ
  choice: तुम्हारे ठहराए हुए मूल्य की चाँदी
  rationale: כֶּסֶף का ठोस अर्थ ‘चाँदी’ और עֶרְכְּךָ का अर्थ संबोधित व्यक्ति द्वारा किया गया मूल्यांकन है। यह रूप दोनों तत्वों को बनाए रखता है।
- source_word: עָלָיו
  choice: उसमें और
  rationale: यहाँ पूर्वसर्ग निर्धारित रकम के ऊपर अतिरिक्त राशि जोड़ने का भाव देता है; ‘उसमें और’ हिन्दी में उस योगात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהָיָה לוֹ
  choice: तब वह घर उसका हो जाएगा
  rationale: यह भुगतान के बाद स्वामित्व के परिणाम को व्यक्त करता है। ‘हो जाएगा’ विधिक परिणाम को स्पष्ट और सहज हिन्दी में बताता है।
theological_decisions:
- issue: परमेश्वर के लिए अलग की गई संपत्ति की पवित्र-विधिक शब्दावली
  choice: पवित्र ठहरानेवाला
  alternative: समर्पित करनेवाला; पवित्र करनेवाला
  rationale: ‘पवित्र ठहराना’ घर को पवित्र उपयोग के लिए अलग किए जाने का भाव सुरक्षित रखता है, जबकि ‘समर्पित करना’ इस धार्मिक-विधिक अर्थ को कुछ हल्का कर सकता है और ‘पवित्र करना’ नैतिक शुद्धि का अनचाहा अर्थ दे सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध विधिक हिन्दी। मूल की शर्त, पवित्र-संपत्ति संबंधी शब्दावली, चाँदी का उल्लेख और एक-पाँचवें की अतिरिक्त राशि सुरक्षित रखी गई है।
