source:
  edition: WLC
  text: וְ/אִ֨ם בַּ/בְּהֵמָ֤ה הַ/טְּמֵאָה֙ וּ/פָדָ֣ה בְ/עֶרְכֶּ֔/ךָ וְ/יָסַ֥ף חֲמִשִׁת֖/וֹ עָלָ֑י/ו וְ/אִם לֹ֥א יִגָּאֵ֖ל וְ/נִמְכַּ֥ר בְּ/עֶרְכֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/027.yaml
  text: But if it is among the unclean animals[a], then he shall redeem it at your valuation and add a fifth of it to it; and if it is not redeemed[b], then it shall be sold at your valuation.
translation:
  language: hi
  text: परन्तु यदि वह अशुद्ध पशुओं में से हो[a], तो वह तुम्हारे निर्धारित मूल्य पर उसे छुड़ा सकता है और निर्धारित मूल्य में उसके मूल्य का पाँचवाँ भाग और जोड़ दे[b]; और यदि उसे न छुड़ाया जाए, तो वह तुम्हारे निर्धारित मूल्य पर बेच दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अशुद्ध मवेशियों में से।” इब्रानी वाक्यांश ऐसे पशु को दर्शाता है जो अनुष्ठान की दृष्टि से अशुद्ध पशुओं की श्रेणी में आता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका पाँचवाँ भाग उस पर जोड़ दे”; अर्थात निर्धारित मूल्य में बीस प्रतिशत और जोड़ दे।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבְּהֵמָה הַטְּמֵאָה
  choice: अशुद्ध पशुओं में से
  rationale: यहाँ בְּהֵמָה पशु या मवेशी को दर्शाता है और पूर्वसर्गीय वाक्यांश उस पशु को विधिवत अशुद्ध पशुओं की श्रेणी में रखता है। ‘अशुद्ध’ लैव्यव्यवस्था के अनुष्ठानिक वर्गीकरण को व्यक्त करता है।
- source_word: וּפָדָה
  choice: वह ... उसे छुड़ा सकता है
  rationale: פדה का अर्थ मूल्य देकर छुड़ाना या वापस लेना है। आगे ‘यदि उसे न छुड़ाया जाए’ आने से स्पष्ट है कि छुड़ाना उपलब्ध विकल्प है, हर दशा में अनिवार्य आदेश नहीं; इसलिए ‘सकता है’ कानूनी आशय को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְעֶרְכֶּךָ
  choice: तुम्हारे ठहराए मूल्य पर
  rationale: עֵרֶךְ यहाँ निर्धारित आकलित मूल्य है। ‘तुम्हारे’ मूल के एकवचन पुरुष संबोधन को सुरक्षित रखता है और संदर्भ में याजक द्वारा किए गए मूल्यांकन की ओर संकेत करता है।
- source_word: וְיָסַף חֲמִשִׁתוֹ עָלָיו
  choice: उस मूल्य का पाँचवाँ भाग उसमें और जोड़ दे
  rationale: इब्रानी मुहावरे का आशय निर्धारित मूल्य के ऊपर उसका पाँचवाँ भाग, अर्थात बीस प्रतिशत, जोड़ना है। हिंदी वाक्य अर्थ को स्पष्ट रखते हुए अतिरिक्त राशि के जोड़े जाने को व्यक्त करता है।
- source_word: וְאִם לֹא יִגָּאֵל
  choice: और यदि उसे न छुड़ाया जाए
  rationale: גאל का निफ़अल रूप कर्ता को अनिर्दिष्ट छोड़ता है। कर्मवाच्य हिंदी मूल की इसी अनिश्चितता को बनाए रखती है।
- source_word: וְנִמְכַּר
  choice: तो वह ... बेच दिया जाए
  rationale: निफ़अल यहाँ कानूनी कर्मवाच्य है। ‘बेच दिया जाए’ आधुनिक हिंदी में विधिक निर्देश को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘अशुद्ध’ का अर्थ
  choice: इसे विधिवत अथवा अनुष्ठानिक वर्गीकरण के रूप में रखा गया है
  alternative: नैतिक रूप से दूषित या गंदा पशु
  rationale: लैव्यव्यवस्था के संदर्भ में טָמֵא बलिदान और पवित्रता-व्यवस्था से संबंधित श्रेणी है, नैतिक दोष या सामान्य गंदगी का कथन नहीं।
- issue: छुड़ाने की क्रिया का विधिक बल
  choice: ‘छुड़ा सकता है’ द्वारा विकल्प व्यक्त किया गया है
  alternative: ‘उसे छुड़ाए’ द्वारा पूर्ण अनिवार्यता
  rationale: अगला उपवाक्य उस स्थिति की स्पष्ट व्यवस्था करता है जिसमें पशु छुड़ाया नहीं जाता; इसलिए पाठ में उपलब्ध विकल्प और उसके परिणाम, दोनों को बनाए रखना उचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ठहराए मूल्य’ लैव्यव्यवस्था 27 के मूल्यांकन-संदर्भ को व्यक्त करता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदबंधों के तुरंत बाद दिए गए हैं।
