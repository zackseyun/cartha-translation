base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/026.yaml
  text: However[a], a firstborn among the livestock, which as a firstborn belongs to Yahweh, no man may consecrate; whether an ox or a sheep[b], it belongs to Yahweh.
translation:
  language: hi
  text: परन्तु पशुओं में जो यहोवा के लिए पहलौठा होता है, उसे कोई व्यक्ति समर्पित न करे; चाहे वह बैल हो या भेड़-बकरी[a], वह यहोवा का है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द שֶׂה का अर्थ भेड़ या बकरी—इनमें से कोई छोटा झुंड-पशु—हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु
  rationale: यह शब्द पिछली विधियों के संबंध में अपवाद अथवा सीमा प्रस्तुत करता है।
- source_word: בְּכוֹר
  choice: पहलौठा
  rationale: यह पशु की पहली संतान को दर्शाता है; ‘पहलौठा’ हिन्दी बाइबलीय प्रयोग में परिचित और संक्षिप्त है।
- source_word: אֲשֶׁר יְבֻכַּר לַיהוָה בִּבְהֵמָה
  choice: पशुओं में जो पहलौठा यहोवा का पहलौठा ठहरता है
  rationale: निष्क्रिय क्रिया पशु की पहलौठे के रूप में स्थिति बताती है; वाक्य यह भी बनाए रखता है कि उस स्थिति के कारण वह पहले से यहोवा का है।
- source_word: לֹא יַקְדִּישׁ אִישׁ אֹתוֹ
  choice: उसे कोई मनुष्य समर्पित न करे
  rationale: קדש के हिफ़ील रूप का धार्मिक अर्थ किसी वस्तु को पवित्र उपयोग के लिए अर्पित या समर्पित करना है; ‘कोई मनुष्य’ निषेध के सामान्य मानवीय दायरे को स्पष्ट करता है।
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: चाहे वह बैल हो या भेड़-बकरी
  rationale: שֶׂה केवल भेड़ नहीं, भेड़ या बकरी के छोटे पशु को दर्शा सकता है; ‘भेड़-बकरी’ इस व्यापकता को संक्षेप में सुरक्षित रखता है।
- source_word: לַיהוָה הוּא
  choice: वह यहोवा का है
  rationale: यह स्वामित्व अथवा पहले से स्थापित दैवी अधिकार को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में दिव्य नाम का प्रचलित और पहचाना जाने वाला रूप।
theological_decisions:
- issue: पहलौठे पशु को अलग से समर्पित न किए जाने का कारण
  choice: वह पहलौठा होने के कारण पहले से यहोवा का है, इसलिए मनुष्य उसे नई मन्नत या समर्पण के रूप में अर्पित नहीं कर सकता।
  alternative: पहलौठे की स्थिति अपने आप में पवित्रीकरण है, स्वामित्व पर विशेष बल दिए बिना।
  rationale: अंतिम कथन ‘वह यहोवा का है’ पहले से विद्यमान दैवी अधिकार को प्रमुख बनाता है, जबकि पहलौठे की पवित्र स्थिति भी निहित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक-धार्मिक गरिमा रखी गई है। ‘समर्पित’ सामान्य पाठक के लिए स्वाभाविक है और धार्मिक अर्पण का अर्थ देता है; ‘भेड़-बकरी’ मूल शब्द की व्यापकता सुरक्षित रखता है।
