id: LEV.27.20
reference: Leviticus 27:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִם לֹ֤א יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה וְ/אִם מָכַ֥ר אֶת הַ/שָּׂדֶ֖ה לְ/אִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/020.yaml
  text: But if he does not redeem the field[a], or if he has sold the field to another man, it may not be redeemed again.
translation:
  language: hi
  text: परन्तु यदि वह उस खेत को न छुड़ाए, या उस खेत को किसी दूसरे पुरुष को बेच दे, तो वह फिर कभी नहीं छुड़ाया जा सकेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि / या
  rationale: पहला संयोजन पिछली व्यवस्था के विपरीत परिणाम वाली शर्त को आगे बढ़ाता है; दूसरे में समानांतर वैकल्पिक शर्त होने के कारण स्वाभाविक हिन्दी में ‘या’ उपयुक्त है।
- source_word: יִגְאַל / יִגָּאֵל
  choice: छुड़ाए / छुड़ाया जा सकेगा
  rationale: इस समर्पित संपत्ति के कानूनी-सांस्कारिक प्रसंग में ‘छुड़ाना’ वापस मूल्य देकर पाने की क्रिया को व्यक्त करता है और सक्रिय तथा कर्मवाच्य रूपों का संबंध बनाए रखता है।
- source_word: הַשָּׂדֶה
  choice: उस खेत
  rationale: निश्चित पद पहले से चर्चा में आए विशेष खेत की ओर संकेत करता है; ‘खेत’ שׂדה का प्रसंगानुकूल ठोस अर्थ है।
- source_word: מָכַר
  choice: बेच दे
  rationale: शर्तसूचक वाक्य में हिब्रू पूर्ण क्रिया भावी संभावित, पर परिणामकारी बिक्री बताती है; हिन्दी में ‘बेच दे’ इसे सहज रूप से व्यक्त करता है।
- source_word: לְאִישׁ אַחֵר
  choice: किसी दूसरे पुरुष के हाथ
  rationale: ‘पुरुष’ איש के स्पष्ट पुल्लिंग रूप को बनाए रखता है; ‘के हाथ बेचना’ आधुनिक हिन्दी में किसी को संपत्ति बेच देने का स्वाभाविक प्रयोग है।
- source_word: עוֹד
  choice: फिर कभी नहीं
  rationale: לֹא के साथ यह आगे से पुनः छुटकारे की स्थायी असम्भवता बताता है; ‘फिर कभी नहीं’ कानूनी परिणाम को स्पष्ट और सहज बनाता है।
theological_decisions:
- issue: कानूनी कथन में सामान्य पुल्लिंग
  choice: किसी दूसरे पुरुष के हाथ
  alternative: किसी दूसरे व्यक्ति को
  rationale: मूल में איש स्पष्टतः पुल्लिंग एकवचन है। ‘पुरुष’ स्रोत-रूप को सुरक्षित रखता है, यद्यपि इस कानूनी कथन का प्रयोग व्यापक अर्थ में समझा जा सकता है।
- issue: גאל का कानूनी-सांस्कारिक बल
  choice: छुड़ाना
  alternative: वापस खरीदना
  rationale: ‘छुड़ाना’ समर्पित संपत्ति को निर्धारित मूल्य देकर पुनः पाने के तकनीकी भाव को बनाए रखता है; ‘वापस खरीदना’ अर्थ को केवल वाणिज्यिक लेन-देन तक सीमित कर सकता है।
- issue: अंतिम निषेध की शक्ति
  choice: फिर कभी नहीं छुड़ाया जा सकेगा
  alternative: फिर नहीं छुड़ाया जाएगा
  rationale: नियम केवल भविष्य की घटना का निषेध नहीं, बल्कि बिक्री के बाद छुटकारे की कानूनी सम्भावना समाप्त होने की बात कहता है; इसलिए ‘जा सकेगा’ उपयुक्त है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परन्तु यदि…या यदि…’ की शाब्दिक पुनरावृत्ति से बचते हुए दोनों वैकल्पिक शर्तें स्पष्ट रखी गई हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ में איש का स्रोत-सटीक अर्थ ‘पुरुष’ दिया गया है।
