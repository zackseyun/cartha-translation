  text: וְ/אִם מָ֥ךְ הוּא֙ מֵֽ/עֶרְכֶּ֔/ךָ וְ/הֶֽעֱמִיד/וֹ֙ לִ/פְנֵ֣י הַ/כֹּהֵ֔ן וְ/הֶעֱרִ֥יךְ אֹת֖/וֹ הַ/כֹּהֵ֑ן עַל פִּ֗י אֲשֶׁ֤ר תַּשִּׂיג֙ יַ֣ד הַ/נֹּדֵ֔ר יַעֲרִיכֶ֖/נּוּ הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/008.yaml
  text: But if he is too poor for your valuation[a], then he shall be made to stand before the priest, and the priest shall assess him[b]; the priest shall assess him according to what the one making the vow can afford.
translation:
  language: hi
  text: परन्तु यदि वह तुम्हारे ठहराए हुए मूल्य को चुकाने में असमर्थ हो[a], तो उसे याजक के सामने खड़ा किया जाए और याजक उसका मूल्य ठहराए। मन्नत माननेवाला जितना चुका सकता हो[b], उसी के अनुसार याजक उसका मूल्य ठहराए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का अधिक शाब्दिक अनुवाद ‘वह तुम्हारे ठहराए हुए मूल्य से निर्धन हो’ हो सकता है; आशय यह है कि वह निर्धारित धनराशि चुकाने में असमर्थ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘मन्नत माननेवाले का हाथ जितना पहुँच सके।’ यह आर्थिक सामर्थ्य बताने वाला इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָךְ ... מֵעֶרְכֶּךָ
  choice: तुम्हारे ठहराए हुए मूल्य को चुकाने में असमर्थ
  rationale: מָךְ आर्थिक निर्धनता या साधनों की कमी बताता है और מִן के साथ यहाँ निर्धारित मूल्य चुका न पाने का तुलनात्मक भाव देता है। यह हिंदी में स्वाभाविक ढंग से प्रसंग का अर्थ व्यक्त करता है।
- source_word: וְהֶעֱמִידוֹ
  choice: उसे ... खड़ा किया जाए
  rationale: עמד के हिफ़ील रूप का मूल अर्थ ‘खड़ा कराना’ है। कर्मवाच्य रूप अज्ञात कर्ता को अनावश्यक रूप से निश्चित किए बिना विधिक प्रक्रिया को बनाए रखता है।
- source_word: לִפְנֵי הַכֹּהֵן
  choice: याजक के सामने
  rationale: यह उपासना और विधि के प्रसंग में याजकीय अधिकारी के समक्ष उपस्थित किए जाने का सामान्य वाक्यांश है।
- source_word: וְהֶעֱרִיךְ אֹתוֹ / יַעֲרִיכֶנּוּ
  choice: उसका मूल्य ठहराए
  rationale: लैव्यव्यवस्था 27 में ערך किसी व्यक्ति के लिए धनराशि निर्धारित करने का तकनीकी क्रियापद है। ‘मूल्य ठहराना’ आधुनिक हिंदी में स्पष्ट है और दोनों आवृत्तियों को एक समान रखता है।
- source_word: עַל פִּי
  choice: उसी के अनुसार
  rationale: यह उस आधार या मानदंड को प्रस्तुत करता है जिसके अनुसार याजक धनराशि निर्धारित करता है।
- source_word: אֲשֶׁר תַּשִּׂיג יַד
  choice: जितना चुका सकता हो
  rationale: शाब्दिक रूप से ‘हाथ जितना पहुँच सके’ आर्थिक सामर्थ्य का इब्रानी मुहावरा है। हिंदी चयन उसका आशय स्वाभाविक और स्पष्ट रूप में देता है।
- source_word: הַנֹּדֵר
  choice: मन्नत माननेवाला
  rationale: यह נדר से बना कृदन्त है और मन्नत करने वाले व्यक्ति को सूचित करता है। ‘मन्नत माननेवाला’ सामान्य हिंदी पाठक के लिए सहज और प्रसंगानुकूल है।
