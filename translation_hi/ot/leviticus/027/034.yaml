source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֗ת אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/034.yaml
  text: These are the commandments that Yahweh commanded Moses for the sons of Israel at Mount Sinai[a].
translation:
  language: hi
  text: ये वे आज्ञाएँ हैं जो याहवे ने मूसा को इस्राएलियों के लिए दी थीं, सीनै पर्वत पर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों को।”
    reason: אֶל का अनुवाद यहाँ ‘के लिए’ अथवा ‘को’ किया जा सकता है।
lexical_decisions:
- source_word: אֵלֶּה הַמִּצְוֺת
  choice: ये वे आज्ञाएँ हैं
  rationale: यह पुस्तक के अंत में आने वाला सार-सूत्र है। ‘आज्ञाएँ’ मूल संज्ञा का विधिक बल बनाए रखता है और हिन्दी में ‘ये वे ... हैं’ सापेक्ष उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: אֲשֶׁר צִוָּה
  choice: जिन्हें ... दिया था
  rationale: हिन्दी में ‘आज्ञाएँ देना’ स्वाभाविक पदबंध है; इससे संज्ञा और क्रिया के बीच मूल अर्थ-संबंध बना रहता है, यद्यपि एक ही धातु की पुनरावृत्ति नहीं होती।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶת מֹשֶׁה
  choice: मूसा को
  rationale: אֶת मूल व्याकरण में प्रत्यक्ष कर्म को चिह्नित करता है, पर ‘आज्ञाएँ देना’ के स्वाभाविक हिन्दी विन्यास में प्राप्तकर्ता ‘मूसा को’ होता है।
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के लिए
  rationale: यह आदेशों के अभिप्रेत समुदाय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। אֶל के कारण ‘इस्राएलियों को’ भी सम्भव है, इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: בְּהַר סִינָי
  choice: सीनै पर्वत पर
  rationale: בְּ का स्थानवाचक अर्थ और पर्वत से जुड़ा सामान्य हिन्दी प्रयोग ‘पर’ द्वारा व्यक्त होता है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, उपाधि नहीं। हिन्दी पाठकों के लिए प्रचलित रूप ‘यहोवा’ रखा गया है; ‘याहवे’ अधिक प्रत्यक्ष अकादमिक लिप्यंतरण है।
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक अर्थ
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह स्थिर इब्रानी जातीय पद पूरे इस्राएली समुदाय को सूचित करता है। शाब्दिक ‘पुत्र’ आधुनिक हिन्दी में केवल पुरुषों का भ्रामक संकेत दे सकता है, इसलिए सामुदायिक अर्थ स्पष्ट किया गया है।
- issue: אֶל का संबंध
  choice: इस्राएलियों के लिए
  alternative: इस्राएलियों को
  rationale: वाक्य का आशय मूसा को दिए गए उन आदेशों से है जो इस्राएल के लिए थे; फिर भी אֶל का अधिक सीधा लक्ष्यवाचक अनुवाद ‘को’ सम्भव है और पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण समापन-सूत्र। ‘इस्राएली’ सामान्य पाठक के लिए जातीय-सामुदायिक अर्थ स्पष्ट करता है; ‘सीनै पर्वत’ बाइबलीय नाम का परिचित हिन्दी रूप है।
