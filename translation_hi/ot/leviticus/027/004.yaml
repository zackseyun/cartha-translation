  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज विधिक रजिस्टर अपनाया गया है। ‘स्त्री’ मानव संदर्भ में ‘मादा’ से अधिक स्वाभाविक और सम्मानजनक है। मूल पाठ में कोई ऐसी आवश्यक अस्पष्टता नहीं है जिसके लिए हिन्दी पाठ में पादटिप्पणी अनिवार्य हो।
