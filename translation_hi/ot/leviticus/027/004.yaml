  yaml_path: translation/ot/leviticus/027/004.yaml
  text: But if it is a female[a], then your valuation shall be thirty shekels.
translation:
  language: hi
  text: परन्तु यदि वह स्त्री हो, तो तुम्हारा ठहराया हुआ मूल्य तीस शेकेल होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह संयोजन पिछले पद के पुरुष-संबंधी मामले के विपरीत स्थिति प्रस्तुत करता है; ‘परन्तु यदि’ उस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְקֵבָה הִוא
  choice: वह स्त्री हो
  rationale: נְקֵבָה स्त्री-लिंग/महिला व्यक्ति को सूचित करता है और הִוא स्त्रीलिंग एकवचन सर्वनाम है। मनुष्य की आयु और मूल्यांकन के इस प्रसंग में ‘वह स्त्री हो’ आधुनिक हिन्दी में स्वाभाविक है, जबकि केवल ‘मादा’ मनुष्य के लिए असम्मानजनक सुनाई दे सकता है।
- source_word: וְהָיָה
  choice: तो ... होगा
  rationale: शर्त के परिणाम को बताने वाली विधिक संरचना हिन्दी में ‘तो ... होगा’ से स्पष्ट और स्वाभाविक रूप में व्यक्त होती है।
- source_word: עֶרְכְּךָ
  choice: तुम्हारा ठहराया हुआ मूल्य
  rationale: עֶרֶךְ यहाँ मन्नत के लिए निर्धारित मूल्यांकन है और प्रत्यय द्वितीय पुरुष एकवचन है। ‘ठहराया हुआ मूल्य’ विधिक अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: שְׁלֹשִׁים שָׁקֶל
  choice: तीस शेकेल
  rationale: संख्या और भार/मुद्रा-इकाई को सीधे रखा गया है; मूल में इस पद पर ‘चाँदी’ स्पष्ट रूप से नहीं है, इसलिए उसे नहीं जोड़ा गया।
