id: LEV.27.5
reference: Leviticus 27:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִ֨ם מִ/בֶּן חָמֵ֜שׁ שָׁנִ֗ים וְ/עַד֙ בֶּן עֶשְׂרִ֣ים שָׁנָ֔ה וְ/הָיָ֧ה עֶרְכְּ/ךָ֛ הַ/זָּכָ֖ר עֶשְׂרִ֣ים שְׁקָלִ֑ים וְ/לַ/נְּקֵבָ֖ה עֲשֶׂ֥רֶת שְׁקָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/005.yaml
  text: And if it is from five years old up to twenty years old, your valuation shall be twenty shekels for the male and ten shekels for the female.
translation:
  language: hi
  text: और यदि आयु पाँच वर्ष से लेकर बीस वर्ष तक हो, तो पुरुष के लिए तुम्हारा निर्धारित मूल्य बीस शेकेल और स्त्री के लिए दस शेकेल होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: संयोजक और शर्तसूचक अव्यय दोनों को बनाए रखता है तथा इस नियम को पिछले मूल्यांकन-वर्गों से जोड़ता है।
- source_word: מִבֶּן חָמֵשׁ שָׁנִים וְעַד בֶּן עֶשְׂרִים שָׁנָה
  choice: आयु पाँच वर्ष से लेकर बीस वर्ष तक
  rationale: इब्रानी आयु-सूचक मुहावरे को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और सीमा-संबंधी भाषा को जानबूझकर उसी प्रकार खुला रखता है।
- source_word: וְהָיָה
  choice: होगा
  rationale: विधिक-निर्देशात्मक प्रसंग में निर्धारित परिणाम को स्वाभाविक हिन्दी भविष्यत् रूप से व्यक्त करता है।
- source_word: עֶרְכְּךָ
  choice: तुम्हारा निर्धारित मूल्य
  rationale: दूसरे पुरुष एकवचन प्रत्यय को बनाए रखते हुए मन्नतों के संदर्भ में ठहराए गए औपचारिक मूल्य का अर्थ स्पष्ट करता है।
- source_word: הַזָּכָר
  choice: पुरुष
  rationale: इस आयु-वर्ग में इब्रानी के पुल्लिंग कानूनी वर्ग को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֶשְׂרִים שְׁקָלִים
  choice: बीस शेकेल
  rationale: ऐतिहासिक भार/मुद्रा इकाई को आधुनिक मुद्रा में बदले बिना सीधे सुरक्षित रखता है।
- source_word: וְלַנְּקֵבָה
  choice: और स्त्री के लिए
  rationale: समानांतर स्त्री-वर्ग तथा इब्रानी संयोजक और संबंधसूचक उपसर्ग को स्पष्ट रखता है।
- source_word: עֲשֶׂרֶת שְׁקָלִים
  choice: दस शेकेल
  rationale: संख्या और ऐतिहासिक इकाई का सीधा अनुवाद है तथा पुरुष-वर्ग के मूल्य से अंतर बनाए रखता है।
theological_decisions:
- issue: विधिक/उपासनात्मक पाठ में लिंग-आधारित मूल्यांकन-वर्ग
  choice: पुरुष के लिए ... स्त्री के लिए
  alternative: नर के लिए ... मादा के लिए
  rationale: यहाँ शब्द मनुष्यों के आयु-वर्गों के लिए प्रयुक्त हैं। ‘पुरुष’ और ‘स्त्री’ आधुनिक हिन्दी में मानवीय संदर्भ को स्वाभाविक रूप से व्यक्त करते हैं, जबकि पाठ में दिए अलग कानूनी वर्गों को बनाए रखते हैं और उनसे आगे कोई व्यापक सामाजिक दावा नहीं जोड़ते।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘निर्धारित मूल्य’ लैव्यव्यवस्था 27 की मन्नत-संबंधी कानूनी शब्दावली को समझने योग्य बनाता है। कोई पादटिप्पणी आवश्यक नहीं है।
