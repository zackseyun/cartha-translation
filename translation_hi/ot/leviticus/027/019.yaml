source:
  edition: WLC
  text: וְ/אִם גָּאֹ֤ל יִגְאַל֙ אֶת הַ/שָּׂדֶ֔ה הַ/מַּקְדִּ֖ישׁ אֹת֑/וֹ וְ֠/יָסַף חֲמִשִׁ֧ית כֶּֽסֶף עֶרְכְּ/ךָ֛ עָלָ֖י/ו וְ/קָ֥ם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/019.yaml
  text: But if the one who consecrated it indeed redeems the field[a], then he shall add a fifth of your valuation money to it[c][b], and it shall remain his.
translation:
  language: hi
  text: परन्तु यदि उस खेत को पवित्र ठहराने वाला उसे अवश्य छुड़ाए, तो वह तुम्हारे ठहराए हुए मूल्य की रकम का पाँचवाँ भाग उस मूल्य में और जोड़ दे, और वह खेत उसी का बना रहेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले विधान से जुड़ी हुई शर्त प्रस्तुत करता है और प्रसंग में हल्का विरोधात्मक भाव भी रखता है।
- source_word: גָּאֹל יִגְאַל
  choice: अवश्य छुड़ा ले
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute छुड़ाने की क्रिया पर बल देता है; ‘अवश्य’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַשָּׂדֶה
  choice: उस खेत को
  rationale: यह पिछले प्रसंग में बताए गए विशिष्ट खेत को सूचित करता है; ‘खेत’ यहाँ सटीक और सामान्य शब्द है।
- source_word: הַמַּקְדִּישׁ אֹתוֹ
  choice: उस खेत को पवित्र ठहरानेवाला
  rationale: הקדישׁ किसी वस्तु को पवित्र उपयोग के लिए अलग ठहराने का उपासना-संबंधी अर्थ रखता है; यह पदबंध कर्ता और खेत से उसके संबंध को स्पष्ट रखता है।
- source_word: וְיָסַף חֲמִשִׁית כֶּסֶף עֶרְכְּךָ עָלָיו
  choice: वह तुम्हारे ठहराए हुए मूल्य में उसका पाँचवाँ भाग और जोड़ दे
  rationale: कानूनी निर्देश का विधिक बल सुरक्षित रखते हुए ‘तुम्हारे मूल्यांकन की चाँदी’ का अर्थ स्वाभाविक हिन्दी में दिया गया है; ‘उसका’ मूल्य के पाँचवें भाग की ओर संकेत करता है।
- source_word: וְקָם לוֹ
  choice: तब वह खेत उसी का बना रहेगा
  rationale: शाब्दिक रूप से ‘उसके लिए स्थिर होगा’; कानूनी प्रसंग में इसका आशय खेत पर उसका अधिकार स्थापित और कायम रहना है।
theological_decisions:
- issue: הקדישׁ का उपासना-संबंधी अर्थ
  choice: पवित्र ठहरानेवाला
  alternative: समर्पित करनेवाला
  rationale: यह क्रिया केवल दान देने की नहीं, किसी संपत्ति को पवित्र प्रयोजन के लिए अलग ठहराने की धारणा व्यक्त करती है।
- issue: विधिक वाक्यक्रम का बल
  choice: जोड़ दे; तब ... बना रहेगा
  alternative: जोड़ेगा; और ... उसका होगा
  rationale: अध्याय का कानूनी संदर्भ पहले खंड में दायित्व और दूसरे में उसके परिणाम को व्यक्त करता है; हिन्दी में यह रचना स्पष्ट और स्वाभाविक है।
- issue: וְקָם לוֹ में स्वामित्व की परिणति
  choice: उसी का बना रहेगा
  alternative: उसका हो जाएगा
  rationale: यह खेत छुड़ाने के बाद अधिकार के स्थापित रहने को व्यक्त करता है; ‘बना रहेगा’ मूल मुहावरे के स्थायित्व-भाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक के लिए सुबोध कानूनी-पवित्रशास्त्रीय स्तर। ‘छुड़ा लेना’ मोचन-संबंधी आर्थिक क्रिया के लिए और ‘पवित्र ठहराना’ cultic הקדישׁ के लिए चुना गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ में अर्थ पर्याप्त स्पष्ट है।
