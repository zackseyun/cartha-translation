  yaml_path: translation/ot/leviticus/027/032.yaml
  text: And every tithe of the herd and the flock[a], every tenth animal that passes under the rod[b], shall be holy to Yahweh.
translation:
  language: hi
  text: और गाय-बैलों और भेड़-बकरियों का हर दशमांश, अर्थात लाठी के नीचे से गुजरनेवाला हर दसवाँ पशु[a], याहवे के लिए पवित्र होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दसवाँ।” पशुओं को गिनते समय उन्हें लाठी के नीचे से एक-एक करके गुजारा जाता था; हर दसवाँ पशु दशमांश के रूप में अलग किया जाता था।
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: מַעְשַׂר
  choice: दशमांश
  rationale: यह दसवाँ भाग अलग रखने के लिए प्रयुक्त पारिभाषिक शब्द है; ‘दशमांश’ हिन्दी में संक्षिप्त और इस विधिक प्रसंग के अनुकूल है।
- source_word: בָּקָר
  choice: गाय-बैल
  rationale: यह गोवंशीय पालतू पशुओं का सामूहिक उल्लेख है; ‘गाय-बैल’ सामान्य पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: इब्रानी सामूहिक संज्ञा छोटे पालतू पशुओं, विशेषतः भेड़ों और बकरियों, दोनों को समेटती है।
- source_word: יַעֲבֹר תַּחַת הַשָּׁבֶט
  choice: चरवाहे की लाठी के नीचे से गुजरनेवाला
  rationale: यह पशुओं को एक-एक करके गिनने की पशुपालकीय रीति का चित्र है। ‘चरवाहे की’ प्रसंग से निहित अर्थ को स्पष्ट करता है।
- source_word: הָעֲשִׂירִי
  choice: हर दसवाँ पशु
  rationale: मूल में शाब्दिक रूप से ‘दसवाँ’ है; संदर्भ में निहित ‘पशु’ जोड़ने से विधिक आशय स्पष्ट रहता है।
- source_word: יִהְיֶה קֹּדֶשׁ
  choice: पवित्र होगा
  rationale: यह मूल की पवित्रता-संबंधी विधिक और धार्मिक श्रेणी को सीधे बनाए रखता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: समर्पण और अधिकार का भाव व्यक्त करता है तथा परमेश्वर के व्यक्तिगत वाचा-नाम को लिप्यंतरित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: ‘दसवाँ’ में निहित संज्ञा को स्पष्ट करना
  choice: हर दसवाँ पशु
  alternative: दसवाँ
  rationale: गिनती के क्रम में प्रत्येक दसवें पशु का आशय संदर्भ से स्पष्ट है; ‘पशु’ जोड़ना नई सूचना नहीं जोड़ता, बल्कि आधुनिक हिन्दी में कानूनी अर्थ को साफ करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘गाय-बैल’ और ‘भेड़-बकरियाँ’ सामूहिक पशु-श्रेणियों को सहज हिन्दी में व्यक्त करते हैं। मूल के स्पष्टीकरणात्मक संबंध को दिखाने के लिए ‘अर्थात’ और दीर्घ विराम-चिह्न का प्रयोग किया गया है।
