base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/021.yaml
  text: But the field[a], when it is released in the Jubilee, shall be holy to Yahweh, like a field devoted to destruction; it shall be the priest’s possession.
translation:
  language: hi
  text: परन्तु जुबली के समय छूटने पर वह खेत याहवे के लिए पवित्र होगा, पूर्णतः समर्पित खेत के समान[a]; वह याजक की भूमि-सम्पत्ति होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “प्रतिबंध के अधीन खेत” या “नाश के लिए अर्पित खेत” भी समझा जा सकता है। इब्रानी शब्द ऐसी वस्तु को दर्शाता है जो अपरिवर्तनीय रूप से याहवे को अर्पित करके सामान्य मानवीय उपयोग से अलग कर दी गई हो।
    reason: חֵרֶם की अपरिवर्तनीय अर्पण, प्रतिबंध और कभी-कभी विनाश से जुड़ी अर्थ-सीमा को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהָיָה הַשָּׂדֶה
  choice: परन्तु ... वह खेत ... होगा
  rationale: वाव इस कानूनी प्रसंग को आगे बढ़ाते हुए पिछली आयत की सम्भावना से परिणामात्मक विरोध दिखाता है; ‘परन्तु’ हिन्दी में इस सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּצֵאתוֹ בַיֹּבֵל
  choice: जुबली के समय छूटने पर
  rationale: शाब्दिक अर्थ ‘जुबली में उसके निकलने पर’ है, पर भूमि-विधान में यह सम्पत्ति के मुक्त होने को सूचित करता है। ‘छूटने पर’ कानूनी भाव को स्पष्ट रखते हुए मूल मुहावरे के निकट है।
- source_word: קֹדֶשׁ לַיהוָה
  choice: याहवे के लिए पवित्र
  rationale: यह वाक्यांश उस खेत के याहवे के लिए अलग और समर्पित किए जाने को व्यक्त करता है। परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ रूप में रखा गया है।
- source_word: כִּשְׂדֵה הַחֵרֶם
  choice: उस खेत के समान जो पूर्णतः अर्पित किया गया हो
  rationale: חֵרֶם साधारण समर्पण से अधिक, ऐसा अपरिवर्तनीय अर्पण बताता है जो सामान्य मानवीय उपयोग से हटा दिया गया हो। ‘पूर्णतः अर्पित’ इस बल को रखता है, जबकि पाद-टिप्पणी विनाश अथवा प्रतिबंध से जुड़ी सम्भावित अर्थ-छाया सुरक्षित करती है।
- source_word: לַכֹּהֵן תִּהְיֶה אֲחֻזָּתוֹ
  choice: वह याजक की भूमि-सम्पत्ति होगी
  rationale: אֲחֻזָּה यहाँ स्थायी भू-धारण अथवा भूमि-सम्पत्ति है। यह अनुवाद याजक को मिलने वाले कानूनी अधिकार को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: חֵרֶם का अर्थ और उसकी कठोर अर्थ-छाया
  choice: पूर्णतः अर्पित किया गया खेत
  alternative: नाश के लिए अर्पित खेत; प्रतिबंध के अधीन खेत
  rationale: इस प्रसंग में मुख्य बात खेत का याहवे को अपरिवर्तनीय रूप से अर्पित होकर सामान्य उपयोग और मूल स्वामी के अधिकार से निकल जाना है। ‘नाश के लिए’ को मुख्य पाठ में रखने से यहाँ विनाश का भाव आवश्यकता से अधिक निश्चित हो सकता है; उसे पाद-टिप्पणी में सम्भावित अर्थ-छाया के रूप में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘जुबली’ को स्थापित विधिक पद के रूप में रखा गया है; ‘भूमि-सम्पत्ति’ से אֲחֻזָּה का भू-अधिकार सम्बन्धी भाव व्यक्त होता है।
