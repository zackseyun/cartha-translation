  text: וְ/כָל מַעְשַׂ֨ר הָ/אָ֜רֶץ מִ/זֶּ֤רַע הָ/אָ֨רֶץ֙ מִ/פְּרִ֣י הָ/עֵ֔ץ לַ/יהוָ֖ה ה֑וּא קֹ֖דֶשׁ לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/030.yaml
  text: Every tithe of the land[a], from the seed of the land and from the fruit of the tree, belongs to Yahweh; it is holy to Yahweh.
translation:
  language: hi
  text: भूमि का हर दशमांश[a]—भूमि की उपज से और वृक्ष के फल से—याहवे का है; वह याहवे के लिए पवित्र है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक रूप से: “भूमि का हर दशमांश—भूमि के बीज से और वृक्ष के फल से—याहवे का है।”'
    reason: मूल इब्रानी में ‘भूमि का बीज’ कृषि-उपज के अर्थ में है; मुख्य पाठ में ‘भूमि की उपज’ उस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
lexical_decisions:
- source_word: וְכָל מַעְשַׂר הָאָרֶץ
  choice: भूमि का हर दशमांश
  rationale: एकवचन संज्ञा के साथ כָּל का यहाँ वितरणात्मक अर्थ है। ‘हर दशमांश’ स्वाभाविक हिन्दी में इसे स्पष्ट करता है; आरम्भिक וְ को स्वतंत्र पद के रूप में देना हिन्दी में आवश्यक नहीं है।
- source_word: מִזֶּרַע הָאָרֶץ
  choice: भूमि के बीज में से
  rationale: यह अनुवाद इब्रानी की ठोस ‘भूमि का बीज’ वाली छवि को बनाए रखता है, यद्यपि सन्दर्भ में इसका आशय बोई गई उपज से है।
- source_word: מִפְּרִי הָעֵץ
  choice: वृक्ष के फल में से
  rationale: एकवचन הָעֵץ सामूहिक अर्थ में प्रयुक्त हो सकता है। ‘वृक्ष के फल’ मूल रूप के निकट और हिन्दी में बोधगम्य है।
- source_word: לַיהוָה הוּא
  choice: याहवे का है
  rationale: यहाँ לְ अधिकार अथवा समर्पण दर्शाता है। ‘याहवे का है’ संक्षिप्त और स्वाभाविक रूप से दोनों भावों को वहन करता है।
- source_word: קֹדֶשׁ לַיהוָה
  choice: याहवे के लिए पवित्र है
  rationale: यह वाक्यांश उस दशमांश के याहवे के लिए अलग किए जाने को व्यक्त करता है। ‘परमपवित्र’ कहना मूल में निहित न होने वाली अतिशयोक्ति जोड़ देता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है और ‘प्रभु’ जैसी प्रतिस्थापन-उपाधि नहीं लाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘दशमांश’ स्थापित धार्मिक-कृषि शब्द है। विराम-चिह्नों से मुख्य कथन और उसके दो कृषि-स्रोत स्पष्ट किए गए हैं।
