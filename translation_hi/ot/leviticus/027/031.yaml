    reason: मूल इब्रानी की बलसूचक infinitive absolute रचना को स्पष्ट करना।
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह संयोजन विधिक क्रम में एक शर्त प्रस्तुत करता है; ‘परन्तु यदि’ प्रसंग के संक्रमण और शर्त—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גָּאֹל יִגְאַל
  choice: अवश्य छुड़ाए
  rationale: धातु גאל का infinitive absolute और imperfect साथ आकर क्रिया पर बल देते हैं। ‘अवश्य छुड़ाए’ उस बल को व्यक्त करता है, बिना इसे इच्छा या अभिप्राय का अर्थ दिए।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: मूल शब्द व्याकरणतः पुल्लिंग एकवचन है और यहाँ विधिक शैली में सामान्य मामले के व्यक्ति को सूचित करता है।
- source_word: מִמַּעַשְׂרוֹ
  choice: अपने दशमांश में से कुछ
  rationale: מִן का प्रयोग यहाँ अंशवाचक है—दशमांश की पूरी मात्रा नहीं, उसमें से कुछ भाग छुड़ाने की बात है।
- source_word: חֲמִשִׁיתוֹ
  choice: उसका पाँचवाँ भाग
  rationale: यह संज्ञा किसी वस्तु या राशि के पाँचवें भाग को दर्शाती है; हिन्दी में यह मूल के संबंधसूचक प्रत्यय को भी सुरक्षित रखती है।
- source_word: יֹסֵף עָלָיו
  choice: उसमें और जोड़ दे
  rationale: יסף का हिफ़ील रूप ‘जोड़ना’ और עַל मूल राशि में वृद्धि को व्यक्त करता है। ‘और’ अतिरिक्त मात्रा के भाव को स्वाभाविक बनाता है।
