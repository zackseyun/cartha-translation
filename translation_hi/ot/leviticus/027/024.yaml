base_translation:
  language: en
  yaml_path: translation/ot/leviticus/027/024.yaml
  text: In the year of jubilee the field shall return to the one from whom it was bought[a], to the one to whom the possession of the land belongs.
translation:
  language: hi
  text: जुबली के वर्ष में वह खेत उस व्यक्ति के पास लौट जाएगा, जिससे उसने वह खेत खरीदा था, जिसके लिए वह भूमि-धारण है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसकी पैतृक भू-संपत्ति वह है।” यहाँ इब्रानी शब्द אֲחֻזָּה भूमि-धारण या भूमि पर वैधानिक अधिकार को दर्शाता है; इस प्रसंग में यह मूल परिवार को मिली भूमि के हिस्से को सूचित करता है।
    reason: शाब्दिक विकल्प और संदर्भगत अर्थ स्पष्ट करना
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל
  choice: जुबली के वर्ष में
  rationale: यह समय-सूचक पद है और लैव्यव्यवस्था में स्थापित विशेष जुबली-वर्ष की ओर संकेत करता है।
- source_word: יָשׁוּב הַשָּׂדֶה
  choice: वह खेत ... लौट जाएगा
  rationale: अपूर्ण क्रिया यहाँ व्यवस्था के निश्चित कानूनी परिणाम को व्यक्त करती है; हिंदी में ‘लौट जाएगा’ स्वाभाविक और स्पष्ट है।
- source_word: לַאֲשֶׁר קָנָהוּ מֵאִתּוֹ
  choice: उस व्यक्ति के पास ... जिससे उसने उसे खरीदा था
  rationale: हिब्रू का सक्रिय रूप और सर्वनाम-संबंध सुरक्षित रखा गया है; निकटवर्ती संदर्भ में ‘उसने’ खरीदे हुए खेत को समर्पित करने वाले व्यक्ति को सूचित करता है।
- source_word: לַאֲשֶׁר לוֹ אֲחֻזַּת הָאָרֶץ
  choice: उसके पास, जिसकी भू-संपत्ति वह है
  rationale: אֲחֻזָּה का अर्थ भूमि पर वैधानिक अधिकार वाली संपत्ति या भू-धारण है। ‘भू-संपत्ति’ कानूनी भाव रखता है, पर मुख्य पाठ में ‘पैतृक’ जोड़कर निहित संदर्भ को अनावश्यक रूप से स्पष्ट नहीं करता।
theological_decisions:
- issue: जुबली की व्यवस्था में אֲחֻזַּת הָאָרֶץ का स्वरूप
  choice: मुख्य पाठ में ‘जिसकी भू-संपत्ति वह है’
  alternative: ‘जिसकी पैतृक भू-संपत्ति वह है’
  rationale: व्यापक संदर्भ मूल परिवार को मिली भूमि की ओर संकेत करता है, लेकिन इस पद का संज्ञा-रूप स्वयं मुख्यतः स्थायी भू-धारण या संपत्ति बताता है। इसलिए पैतृकता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जुबली’ लैव्यव्यवस्था के इस विशेष कानूनी-सांस्कृतिक शब्द के लिए प्रचलित बाइबलीय रूप है। डैश के बाद का वाक्यांश पहले प्राप्तकर्ता की कानूनी पहचान स्पष्ट करता है।
