source:
  edition: WLC
  text: אַל תִּפְנ֤וּ אֶל הָ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים אַל תְּבַקְשׁ֖וּ לְ/טָמְאָ֣ה בָ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/031.yaml
  text: Do not turn to mediums or to spiritists; do not seek them out[a], to become unclean by them. I am Yahweh your God.
translation:
  language: hi
  text: ओझाओं और प्रेत-साधकों की ओर मत फिरो; उन्हें मत खोजो और उनके कारण अशुद्ध मत हो जाओ। मैं याहवे, तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּפְנוּ
  choice: की ओर न फिरना
  rationale: פנה का मूल अर्थ ‘मुड़ना/किसी की ओर फिरना’ है। निषेध में यह सहायता या परामर्श के लिए उनकी ओर रुख करने का भाव स्वाभाविक रूप से व्यक्त करता है, बिना इसे स्पष्ट रूप से ‘सलाह लेना’ बना देने के।
- source_word: הָאֹבֹת
  choice: ओझाओं
  rationale: इन विधिक प्रसंगों में אוֹב मृतकों या आत्माओं से संपर्क कराने वाले माध्यम अथवा उससे जुड़े साधक को सूचित करता है। ‘ओझा’ सामान्य आधुनिक हिन्दी में ऐसे साधक के लिए समझ में आने वाला निकटतम शब्द है।
- source_word: הַיִּדְּעֹנִים
  choice: प्रेत-साधकों
  rationale: יִדְּעֹנִי निषिद्ध आत्मिक ज्ञान या आत्माओं से संपर्क से जुड़े साधक को सूचित करता है। ‘प्रेत-साधक’ इसे पहले पद से कुछ अलग रखते हुए इसके आत्मवादी क्षेत्र को स्पष्ट करता है; ‘जादूगर’ आधुनिक पाठक को भटका सकता है।
- source_word: תְּבַקְשׁוּ
  choice: उन्हें न खोजना
  rationale: בקש का अर्थ ‘खोजना/ढूँढ़ना’ है। यह अनुवाद ऐसे साधकों तक पहुँचने के सक्रिय प्रयास को व्यक्त करते हुए मूल क्रिया के निकट रहता है।
- source_word: לְטָמְאָה בָהֶם
  choice: ताकि उनके द्वारा अशुद्ध न हो जाओ
  rationale: טמא का यह रूप उद्देश्य या परिणाम—उनसे संबंध रखने के कारण अशुद्ध हो जाना—व्यक्त कर सकता है। ‘अशुद्ध’ नैतिक और अनुष्ठानिक दोनों संभावित आयामों को खुला रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: मूल के द्वितीय पुरुष बहुवचन संबंधसूचक रूप और वाचा-संबंधी पहचान को सीधे व्यक्त करता है।
theological_decisions:
- issue: निषिद्ध साधकों से होने वाली अशुद्धता का स्वरूप
  choice: ‘अशुद्ध’ रखा गया है, बिना इसे केवल अनुष्ठानिक या केवल नैतिक बताने के।
  alternative: ‘अनुष्ठानिक रूप से अशुद्ध’ अथवा ‘नैतिक रूप से भ्रष्ट’
  rationale: लैव्यव्यवस्था में טמא अनुष्ठानिक और नैतिक दोनों आयाम ग्रहण कर सकता है। पद स्वयं यहाँ किसी एक आयाम तक अर्थ को सीमित नहीं करता।
- issue: אוֹב और יִדְּעֹנִי की सटीक पहचान
  choice: मुख्य पाठ में इन्हें दो प्रकार के निषिद्ध आत्मवादी साधकों—‘ओझाओं’ और ‘प्रेत-साधकों’—के रूप में प्रस्तुत किया गया है।
  alternative: शब्दों को ‘मृतात्माएँ’ और ‘परिचित आत्माएँ’ जैसे आत्मिक अस्तित्वों के नाम मानना
  rationale: इन इब्रानी पदों में साधक और उससे संबद्ध आत्मा के बीच संदर्भगत अस्पष्टता है। इस विधिक निषेध में व्यक्तियों की ओर फिरने और उन्हें खोजने की समानांतर क्रियाएँ साधक-वाचक अनुवाद का समर्थन करती हैं, जबकि पादटिप्पणी अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ओझा’ लोकप्रचलित है, पर यहाँ तांत्रिक-लोकाचार की किसी विशिष्ट भारतीय परंपरा को नहीं, बल्कि मृतकों या आत्माओं से संपर्क कराने वाले निषिद्ध साधक को सूचित करता है। बहुवचन आज्ञा के लिए ‘न फिरना/न खोजना’ और ‘न हो जाओ’ का स्वाभाविक हिन्दी संयोजन अपनाया गया है।
