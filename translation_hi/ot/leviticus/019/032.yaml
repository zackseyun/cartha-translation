base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/032.yaml
  text: You shall rise before gray hair[a], and you shall honor the face of an old man, and you shall fear your God[b]; I am Yahweh.
translation:
  language: hi
  text: पके बालों वाले के सामने उठ खड़े हो[a], वृद्ध का आदर करो[b], और अपने परमेश्वर का भय मानो; मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पके बालों की उपस्थिति में।’ इब्रानी वृद्धावस्था के लिए ‘पके बाल’ की ठोस अभिव्यक्ति का प्रयोग करता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘वृद्ध की उपस्थिति का आदर करो।’ इब्रानी में शाब्दिक रूप से ‘वृद्ध के मुख का आदर करो’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי שֵׂיבָה
  choice: पके बालों वाले के सामने
  rationale: इब्रानी में वृद्धावस्था के लिए ‘पके बाल’ का ठोस बिंब है। קום के साथ מִפְּנֵי का अर्थ किसी के सामने अथवा उसकी उपस्थिति में सम्मानपूर्वक उठना है।
- source_word: תָּקוּם
  choice: उठ खड़े हो
  rationale: यहाँ קום सम्मान प्रकट करने के लिए बैठे स्थान से खड़े होने की आज्ञा देता है; ‘उठ खड़े हो’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְהָדַרְתָּ
  choice: सम्मान करो
  rationale: पिएल रूप में הדר का अर्थ आदर या सम्मान देना है; ‘सम्मान करो’ धार्मिक उपासना का अनावश्यक भाव जोड़े बिना नैतिक आज्ञा व्यक्त करता है।
- source_word: פְּנֵי זָקֵן
  choice: वृद्ध के मुख
  rationale: मूल अभिव्यक्ति का शाब्दिक अर्थ ‘वृद्ध का मुख’ है। मुख्य पाठ में ‘मुख’ रखकर इब्रानी की ठोस और समानांतर अभिव्यक्ति सुरक्षित रखी गई है, जबकि आशय वृद्ध व्यक्ति का सम्मान करना है।
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: अपने परमेश्वर का भय मानो
  rationale: ירא भय, श्रद्धामिश्रित भय या विस्मय व्यक्त कर सकता है। ‘भय मानो’ वाचा-संबंधी आज्ञा की गंभीरता और उसके धार्मिक तनाव को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वत्तापूर्ण लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
theological_decisions:
- issue: זָקֵן में पुल्लिंग अभिव्यक्ति
  choice: वृद्ध
  alternative: वृद्ध व्यक्ति / बुज़ुर्ग
  rationale: इब्रानी शब्द पुल्लिंग एकवचन है। ‘वृद्ध’ उस रूप को बनाए रखता है, यद्यपि संदर्भ में आज्ञा का नैतिक सिद्धांत केवल पुरुषों तक सीमित नहीं समझा जाना चाहिए।
- issue: परमेश्वर के भय का अर्थ
  choice: अपने परमेश्वर का भय मानो
  alternative: अपने परमेश्वर का श्रद्धापूर्वक आदर करो
  rationale: ‘भय’ मूल क्रिया की शक्ति तथा पवित्रता-संहिता में पाए जाने वाले भय और श्रद्धा के तनाव को सुरक्षित रखता है; इसे केवल सामान्य आदर तक सीमित नहीं किया गया।
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। लिप्यंतरण उसे उपाधि से प्रतिस्थापित किए बिना सामने रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सम्मानसूचक बहुवचन आज्ञार्थ ‘हो/करो/मानो’ हिन्दी में सामान्य पाठकीय संबोधन के रूप में प्रयुक्त है, जबकि इब्रानी संबोधन व्याकरणतः पुल्लिंग एकवचन है।
