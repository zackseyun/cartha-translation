source:
  edition: WLC
  text: וְ/הֵבִ֤יא אֶת אֲשָׁמ/וֹ֙ לַֽ/יהוָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד אֵ֖יל אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/021.yaml
  text: 'And he shall bring his guilt offering to Yahweh[a], to the entrance of the tent of meeting: a ram as a guilt offering.'
translation:
  language: hi
  text: और वह यहोवा के लिए अपना दोष-बलिदान, अर्थात् दोष-बलिदान के लिए एक मेढ़ा, मिलाप के तंबू के प्रवेश-द्वार पर ले आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבִיא
  choice: और वह ... ले आए
  rationale: विधिक संदर्भ में यह क्रियारूप आदेशात्मक दायित्व व्यक्त करता है; हिंदी में आदरसूचक/विधिक संभाव्य रूप स्वाभाविक और निर्देशात्मक है।
- source_word: אֲשָׁמוֹ
  choice: अपना दोष-बलिदान
  rationale: संदर्भ में אָשָׁם अपराध-दोष से संबंधित प्रायश्चित्तकारी बलिदान को दर्शाता है; ‘दोष-बलिदान’ संक्षिप्त है और शब्द की द्विअर्थी पृष्ठभूमि को पादटिप्पणी में सुरक्षित रखता है।
- source_word: לַיהוָה
  choice: यहोवा के पास
  rationale: ל प्रस्तुति की दिशा दर्शाता है; ‘के पास ... ले आए’ हिंदी में स्वाभाविक ढंग से बलिदान को यहोवा के सम्मुख लाने का भाव देता है।
- source_word: אֶל־פֶּתַח
  choice: प्रवेश-द्वार पर
  rationale: פֶּתַח तंबू के प्रवेश या द्वार को सूचित करता है; गंतव्य के साथ हिंदी में ‘पर’ स्वाभाविक है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह पवित्रस्थान के तंबू का पारंपरिक किंतु बोधगम्य हिंदी पद है, जहाँ यहोवा और इस्राएल की भेंट/मिलन का भाव निहित है।
- source_word: אֵיל
  choice: एक मेढ़ा
  rationale: אֵיל विशेष रूप से नर भेड़ अर्थात मेढ़े को दर्शाता है।
- source_word: אָשָׁם
  choice: दोष-बलिदान के रूप में
  rationale: अंतिम पद मेढ़े की बलिदानी श्रेणी को समानाधिकरण रूप में स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है; उसे सामान्य उपाधि ‘प्रभु’ से बदलने के बजाय हिंदी में व्यापक रूप से पहचाने जाने वाले नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
- issue: אָשָׁם में दोष और प्रतिपूर्ति-बलिदान का संबंध
  choice: दोष-बलिदान
  alternative: क्षतिपूर्ति-बलिदान
  rationale: यहाँ शब्द बलिदानी वस्तु को दर्शाता है, पर उसमें दोष के निवारण/प्रतिपूर्ति का भाव भी है; मुख्य पाठ में प्रचलित पद रखा गया और वैकल्पिक अर्थ पादटिप्पणी में दिया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य विधिक-धार्मिक हिंदी। वाक्य की पुनरुक्ति मूल इब्रानी के समानाधिकरण को सुरक्षित रखने के लिए रखी गई है।
