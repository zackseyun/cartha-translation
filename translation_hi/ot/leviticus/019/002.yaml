id: LEV.19.2
reference: Leviticus 19:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל וְ/אָמַרְתָּ֥ אֲלֵ/הֶ֖ם קְדֹשִׁ֣ים תִּהְי֑וּ כִּ֣י קָד֔וֹשׁ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/002.yaml
  text: Speak to all the congregation of the sons of Israel[a], and say to them, ‘You shall be holy, for I, Yahweh your God[b], am holy.’
translation:
  language: hi
  text: “इस्राएलियों की सारी सभा[a] से बोल और उनसे कह, ‘तुम पवित्र रहो[b], क्योंकि मैं, याहवे तुम्हारा परमेश्वर, पवित्र हूँ।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “इस्राएल के पुत्रों की सारी सभा”; अर्थात् इस्राएलियों का पूरा समुदाय।'
    reason: lexical_alternative
  - marker: b
    text: इसे “तुम पवित्र होगे” या “तुम्हें पवित्र होना चाहिए” भी समझा जा सकता है; यहाँ क्रिया-रूप आदेश और दायित्व का भाव व्यक्त करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: बोल
  rationale: पिएल आज्ञार्थक रूप मूसा को दिया गया सीधा आदेश है। ‘बोल’ मूल क्रिया और विधिक प्रसंग की गंभीरता को सहज हिन्दी में बनाए रखता है।
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की सारी सभा
  rationale: עֵדָה सामूहिक रूप से एकत्र वाचा-समुदाय को दर्शाता है, और כָּל का अर्थ ‘सारी’ से स्पष्ट होता है। בְּנֵי יִשְׂרָאֵל का यहाँ स्वाभाविक सामुदायिक अर्थ ‘इस्राएली’ है; उसका अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: और उनसे कह
  rationale: यह विधिक भाषण में प्रयुक्त सामान्य आदेश-क्रम को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קְדֹשִׁים תִּהְיוּ
  choice: तुम पवित्र रहो
  rationale: विशेषण के साथ היה का अपूर्ण रूप यहाँ आदेशात्मक/बाध्यकारी बल रखता है। ‘पवित्र रहो’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी की संक्षिप्त गंभीरता बनाए रखता है; संभावित भविष्यसूचक या अनिवार्य छायाएँ पादटिप्पणी में दी गई हैं।
- source_word: קָדוֹשׁ
  choice: पवित्र
  rationale: यह परमेश्वर की पवित्रता और उससे अपेक्षित सामुदायिक पवित्रता, दोनों के लिए स्थापित तथा पर्याप्त व्यापक हिन्दी शब्द है; केवल ‘अलग किया हुआ’ कहना अर्थ को संकुचित कर देता।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह उपाधि से बदलने के बजाय इब्रानी चतुरक्षरीय दिव्य नाम का हिन्दी लिप्यंतरण है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय को ‘तुम्हारा’ से व्यक्त किया गया है, जो सम्बोधित समुदाय के साथ वाचा-सूत्र की भाषा को बनाए रखता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל की सामुदायिक पहचान
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: इब्रानी पद का रूप शाब्दिक रूप से ‘इस्राएल के पुत्र’ है, पर इस प्रसंग में वह पूरे इस्राएली वाचा-समुदाय के लिए रूढ़ अभिव्यक्ति है। मुख्य पाठ में स्वाभाविक सामुदायिक अर्थ रखा गया और रूपगत शाब्दिकता पादटिप्पणी में सुरक्षित की गई।
- issue: पवित्रता-वचन का आदेशात्मक अथवा भविष्यसूचक बल
  choice: तुम पवित्र रहो
  alternative: तुम पवित्र होगे / तुम्हें पवित्र होना चाहिए
  rationale: अपूर्ण क्रिया-रूप विधिक प्रसंग में आदेश या दायित्व व्यक्त करता है, फिर भी उसका रूप भविष्यसूचक ढंग से भी सुना जा सकता है। मुख्य पाठ स्पष्ट आदेशात्मक बल देता है और अन्य संभव छायाएँ पादटिप्पणी में सुरक्षित रखता है।
- issue: दिव्य नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है, उपाधि नहीं। इसलिए उसे ‘याहवे’ के रूप में लिप्यंतरित किया गया है, बिना उसे ‘प्रभु’ से प्रतिस्थापित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और विधिक-गंभीर रखी गई है। ‘सभा’, ‘पवित्र’ और ‘परमेश्वर’ जैसे परिचित धार्मिक शब्द सामान्य पाठक के लिए बोधगम्य हैं। सम्बोधन में बहुवचन ‘तुम’ और मूसा को दिए एकवचन आदेश ‘बोल/कह’ का भेद सुरक्षित है।
