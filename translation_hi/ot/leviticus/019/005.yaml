source:
  edition: WLC
  text: וְ/כִ֧י תִזְבְּח֛וּ זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה לִֽ/רְצֹנְ/כֶ֖ם תִּזְבָּחֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/005.yaml
  text: And when you sacrifice a peace offering to Yahweh[a], you shall sacrifice it so that you may be accepted.
translation:
  language: hi
  text: और जब तुम याहवे के लिए मेलबलि चढ़ाओ, तो उसे इस प्रकार चढ़ाना कि तुम स्वीकार किए जाओ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “तुम्हारी स्वीकृति के लिए।”
    reason: לִרְצֹנְכֶם के अधिक शाब्दिक रूप को सुरक्षित रखना।
lexical_decisions:
- source_word: וְכִי
  choice: और जब
  rationale: विधिक प्रसंग में यह पद एक समय-सापेक्ष परिस्थिति प्रस्तुत करता है; ‘और जब’ पिछले निर्देशों से इसका संबंध बनाए रखता है।
- source_word: תִזְבְּחוּ ... תִּזְבָּחֻהוּ
  choice: चढ़ाओ ... उसे ... चढ़ाना
  rationale: זבח बलि के रूप में वध या अर्पण करने को दर्शाता है। हिंदी में ‘बलि चढ़ाना’ स्वाभाविक है; दूसरी क्रिया को बनाए रखने से इब्रानी की पुनरावृत्ति और आदेश का बल सुरक्षित रहता है।
- source_word: זֶבַח שְׁלָמִים
  choice: मेलबलि
  rationale: यह इस्राएली बलि-व्यवस्था की एक निश्चित श्रेणी है। ‘मेलबलि’ प्रचलित, संक्षिप्त और समझने योग्य हिंदी पद है, जो इसे केवल सामान्य बलिदान नहीं बनने देता।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל समर्पण या अभिमुखता व्यक्त करता है; ‘के लिए’ स्पष्ट करता है कि बलि याहवे को समर्पित है।
- source_word: לִרְצֹנְכֶם
  choice: कि तुम स्वीकार किए जाओ
  rationale: बलि-संबंधी प्रसंग में רָצוֹן का आशय उपासक की इच्छा नहीं, बल्कि परमेश्वर के सामने स्वीकृति है। यह हिंदी में अर्थ को स्वाभाविक रूप से व्यक्त करता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יהוה है। ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: לִרְצֹנְכֶם में स्वीकृति का आशय
  choice: कि तुम स्वीकार किए जाओ
  alternative: तुम्हारी स्वीकृति के लिए; अपनी इच्छा के अनुसार
  rationale: यहाँ बलि के परमेश्वर को स्वीकार्य होने और उसके फलस्वरूप चढ़ाने वालों की स्वीकृति का भाव है। ‘अपनी इच्छा के अनुसार’ बलि चढ़ाने वाले की पसंद का अर्थ दे सकता है, जो इस याजकीय प्रसंग में अनुपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण विधिक-धार्मिक शैली रखी गई है। बहुवचन संबोधन ‘तुम’ मूल के दूसरे पुरुष बहुवचन को दर्शाता है। ‘इस प्रकार’ आगे आने वाले नियमों की ओर स्वाभाविक संकेत भी देता है।
