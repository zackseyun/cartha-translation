id: LEV.19.15
reference: Leviticus 19:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹא תַעֲשׂ֥וּ עָ֨וֶל֙ בַּ/מִּשְׁפָּ֔ט לֹא תִשָּׂ֣א פְנֵי דָ֔ל וְ/לֹ֥א תֶהְדַּ֖ר פְּנֵ֣י גָד֑וֹל בְּ/צֶ֖דֶק תִּשְׁפֹּ֥ט עֲמִיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/015.yaml
  text: You shall not commit injustice in judgment. You shall not show partiality to the poor, nor honor the face of the great; with righteousness you shall judge your neighbor.
translation:
  language: hi
  text: न्याय में अन्याय न करना। गरीब का पक्ष न लेना और न बड़े व्यक्ति का लिहाज़ करना। न्यायपूर्वक[a] अपने संगी का न्याय करना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धार्मिकता से अपने संगी का न्याय करना।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक मुहावरे हैं, “गरीब का चेहरा उठाना” और “बड़े व्यक्ति के चेहरे का आदर करना”; न्यायालय के सन्दर्भ में इनका अर्थ पक्षपात करना या किसी के ऊँचे पद के कारण उसका लिहाज़ करना है।
    reason: cultural_note
lexical_decisions:
- source_word: עָוֶל בַּמִּשְׁפָּט
  choice: न्याय करते समय अन्याय
  rationale: यह पदबंध न्यायिक निर्णय में होने वाले अन्याय को दर्शाता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: תִשָּׂא פְנֵי דָל
  choice: गरीब का पक्ष लेना
  rationale: शाब्दिक अर्थ ‘गरीब का चेहरा उठाना’ है, पर न्यायिक सन्दर्भ में यह पक्षपात करने का मुहावरा है।
- source_word: תֶהְדַּר פְּנֵי גָדוֹל
  choice: बड़े आदमी का लिहाज़ करना
  rationale: यहाँ גָדוֹל ऊँचे पद या सामाजिक प्रतिष्ठा वाले व्यक्ति को दर्शाता है; ‘लिहाज़ करना’ अनुचित सम्मानजन्य पक्षपात का स्वाभाविक हिन्दी संकेत देता है।
- source_word: בְּצֶדֶק
  choice: धार्मिकता से
  rationale: צֶדֶק में नैतिक धार्मिकता और न्याय—दोनों अर्थ-आयाम हैं; मुख्य पाठ नैतिक-न्यायिक तनाव को बनाए रखता है और पादटिप्पणी वैकल्पिक अर्थ देती है।
- source_word: תִּשְׁפֹּט
  choice: न्याय करना
  rationale: שׁפט का सीधा न्यायिक अर्थ रखा गया है; विधिक निर्देश का बल ‘करना’ से व्यक्त होता है।
- source_word: עֲמִיתֶךָ
  choice: अपने संगी
  rationale: עָמִית समुदाय के साथी या सह-सदस्य को दर्शाता है; ‘संगी’ केवल भौगोलिक पड़ोसी की अपेक्षा इस सामुदायिक अर्थ को बेहतर रखता है।
theological_decisions:
- issue: कानूनी-नैतिक सन्दर्भ में צֶדֶק का अनुवाद
  choice: धार्मिकता से
  alternative: न्यायपूर्वक
  rationale: इब्रानी शब्द नैतिक धार्मिकता और न्यायिक निष्पक्षता दोनों को समेटता है। मुख्य पाठ ‘धार्मिकता’ रखता है, जबकि पादटिप्पणी न्यायिक विकल्प सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट विधिक शैली रखी गई है। ‘बड़े आदमी’ सामाजिक प्रतिष्ठा या ऊँचे पद वाले व्यक्ति को सूचित करता है; ‘लिहाज़’ इस सन्दर्भ में अनुचित पक्षपात को व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
