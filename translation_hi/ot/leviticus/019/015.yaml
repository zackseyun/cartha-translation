review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the legal prohibitions: no injustice in adjudication, no favoritism toward the poor, no deferential favoritism toward the socially prominent, and judging one’s fellow with צדק. However, ‘धार्मिकता से’ in present-day Hindi commonly suggests piety or religiosity more than the legal-ethical quality intended here.'
  naturalness: The infinitive legal style is understandable, but ‘न्याय में अन्याय न करना’ is more direct and idiomatic than ‘न्याय करते समय अन्याय न करना.’ ‘बड़े व्यक्ति’ is more natural in a formal, generic legal instruction than ‘बड़े आदमी.’
  terminology: ‘न्यायपूर्वक’ is the clearest modern Hindi rendering of בְּצֶדֶק in this judicial setting. The viable moral-ethical sense of ‘righteousness’ is retained in the footnote as ‘धार्मिकता से.’ ‘संगी’ appropriately conveys a fellow member/associate, though it is slightly elevated in register.
  issues:
  - severity: medium
    issue: ‘धार्मिकता से’ may be misconstrued as personal religiosity.
    rationale: In modern standard Hindi, धार्मिकता primarily denotes piety or religious devotion. In this legal context, בְּצֶדֶק calls for just and right adjudication; ‘न्यायपूर्वक’ communicates this directly while a note can retain the alternative ‘धार्मिकता से.’
  - severity: low
    issue: The current footnote placement does not identify the clauses to which the notes apply as precisely as it could.
    rationale: Placing [a] immediately after ‘न्यायपूर्वक’ and [b] after the paired idiomatic prohibitions makes the anchors clear without altering meaning.
