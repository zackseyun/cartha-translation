revisions:
- from: न्याय करते समय अन्याय न करना। न तो गरीब का पक्ष लेना, और न बड़े आदमी का लिहाज़ करना; धार्मिकता से अपने संगी का न्याय करना।[a][b]
  to: न्याय में अन्याय न करना। गरीब का पक्ष न लेना और न बड़े व्यक्ति का लिहाज़ करना। न्यायपूर्वक[a] अपने संगी का न्याय करना।[b]
  rationale: The revision preserves the Hebrew’s legal force and parallel prohibitions while improving modern Hindi clarity. ‘न्यायपूर्वक’ avoids the misleadingly devotional connotation of ‘धार्मिकता से’; the latter remains available as a faithful lexical alternative. Footnote anchors are moved next to their relevant wording.
