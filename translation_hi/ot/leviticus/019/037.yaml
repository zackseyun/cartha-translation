  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/037.yaml
  text: So you shall keep all my statutes and all my judgments[a], and do them. I am Yahweh.
translation:
  language: hi
  text: इसलिए तुम मेरी सारी विधियों और मेरे सारे न्याय-विधानों[a] को मानो और उनका पालन करो। मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विधियों’ के स्थान पर ‘ठहराए हुए नियम’ और ‘न्याय-विधानों’ के स्थान पर ‘नियम’ या ‘अध्यादेश’ भी कहा जा सकता है। इब्रानी में यहाँ दो अलग-अलग विधिक शब्द हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: इसलिए तुम ... पालन करना
  rationale: שׁמר का विधिक और वाचागत संदर्भ में अर्थ आज्ञाओं को मानना या उनका पालन करना है। आरंभिक וּ को अध्याय के समापन-सार का भाव देते हुए ‘इसलिए’ कहा गया है।
- source_word: כָּל
  choice: सब
  rationale: दोनों बार आए כָּל की समग्रता को बनाए रखता है।
- source_word: חֻקֹּתַי
  choice: मेरी ... विधियों
  rationale: חֻקִּים निर्धारित विधियों या अधिनियमों को सूचित करता है; ‘विधियाँ’ आधुनिक हिंदी में स्पष्ट है और अगले विधिक पद से भेद बनाए रखता है।
- source_word: מִשְׁפָּטַי
  choice: मेरे ... न्याय-विधानों
  rationale: מִשְׁפָּטִים न्यायिक निर्णयों, नियमों या विधानों का बोध करा सकता है। ‘न्याय-विधान’ इसके न्यायिक-विधिक रंग को रखता और חֻקִּים से भेद दिखाता है।
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: और उन्हें मानना
  rationale: עשה का विधिक वस्तुओं के साथ अर्थ उन्हें करना, मानना या कार्यान्वित करना है। हिंदी में ‘उन्हें मानना’ स्वाभाविक है और व्यावहारिक आज्ञाकारिता व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय निजी नाम יהוה को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में निजी वाचागत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिंदी बाइबल-प्रयोग में पहचाना जाने वाला लिप्यंतरण है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दो इब्रानी विधिक पदों का अंतर मुख्य पाठ और पाद-टिप्पणी दोनों में सुरक्षित है।
