  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֹֽכְלָי/ו֙ עֲוֺנ֣/וֹ יִשָּׂ֔א כִּֽי אֶת קֹ֥דֶשׁ יְהוָ֖ה חִלֵּ֑ל וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/008.yaml
  text: Whoever eats it shall bear his iniquity[a], because he has profaned the holy thing of Yahweh[d][c][b], and that person shall be cut off from his people.
translation:
  language: hi
  text: जो कोई उसे खाएगा, वह अपने अधर्म का भार उठाएगा[a], क्योंकि उसने यहोवा की पवित्र वस्तु को अपवित्र किया है[b]; और वह व्यक्ति अपने लोगों में से काट डाला जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने दोष का भार उठाएगा।” इब्रानी मुहावरा दोषी होने और उसके परिणाम भुगतने—दोनों का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “यहोवा की पवित्र वस्तु” से आशय यहोवा के लिए पवित्र ठहराई गई वस्तु से है; यहाँ प्रसंग में यह बलि का मांस है।
    reason: cultural_note
  - marker: c
    text: “काट डाला जाएगा” वाचा-संबंधी दण्ड का सूत्र है। यहाँ यह स्पष्ट नहीं किया गया कि इसका अर्थ मृत्यु, समुदाय से निष्कासन या परमेश्वर का प्रत्यक्ष न्याय है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֹכְלָיו
  choice: जो कोई उसे खाएगा
  rationale: कृदन्त और प्रत्यय का आशय उस बलि-मांस को खाने वाले किसी भी व्यक्ति से है जिसका उल्लेख पिछले पद में है; यह प्रयोग सामान्य एकवचन भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: अपने अधर्म का भार उठाएगा
  rationale: इब्रानी मुहावरा दोष और उसके परिणामों की जवाबदेही दोनों समेट सकता है। यह अनुवाद उस रूपक और अर्थगत व्यापकता को बनाए रखता है।
- source_word: קֹדֶשׁ יְהוָה
  choice: यहोवा की पवित्र वस्तु
  rationale: शब्दसमूह यहोवा के लिए पवित्र ठहराई गई वस्तु को दर्शाता है; प्रसंग में यह बलि का मांस है, पर इस उपवाक्य में 'बलि' स्पष्ट रूप से नहीं लिखा है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य नाम के प्रचलित और गरिमापूर्ण हिन्दी रूप का प्रयोग किया गया है।
- source_word: חִלֵּל
  choice: अपवित्र किया है
  rationale: पिएल रूप का अर्थ पवित्र वस्तु को साधारण या अपवित्र मानकर व्यवहार करना है; आधुनिक हिन्दी में यह स्पष्ट और स्वाभाविक समतुल्य है।
- source_word: וְנִכְרְתָה
  choice: काट डाला जाएगा
  rationale: वाचा-संबंधी दण्डसूचक सूत्र को उसके रूपक सहित रखा गया है और दण्ड की विधि को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: वह व्यक्ति
  rationale: व्यवस्थागत प्रसंग में נֶפֶשׁ संपूर्ण व्यक्ति को सूचित करता है; शाब्दिक 'प्राण' की अपेक्षा 'व्यक्ति' आधुनिक हिन्दी में अर्थ को ठीक व्यक्त करता है।
- source_word: מֵעַמֶּיהָ
  choice: अपने लोगों में से
  rationale: स्त्रीलिंग प्रत्यय הַנֶּפֶשׁ से व्याकरणिक सामंजस्य रखता है; हिन्दी में सामान्य अपराधी के लिए 'अपने लोगों में से' स्वाभाविक और लिंग-निरपेक्ष है।
theological_decisions:
- issue: '''काट डाला जाएगा'' दण्डसूत्र का अभिप्राय'
  choice: दण्डसूत्र को ज्यों का त्यों बनाए रखना
  alternative: मार डाला जाएगा; समुदाय से निकाल दिया जाएगा; परमेश्वर के न्याय से नष्ट किया जाएगा
  rationale: यह पद दण्ड की विधि स्पष्ट नहीं करता। सूत्र को बनाए रखने से मृत्यु, निष्कासन अथवा प्रत्यक्ष ईश्वरीय न्याय के बीच की वास्तविक व्याख्यात्मक अनिश्चितता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और मूल-पाठ के निकट शैली अपनाई गई है। व्यवस्थागत अर्थ में נֶפֶשׁ का अनुवाद 'व्यक्ति' किया गया है; दिव्य नाम के लिए 'यहोवा' रखा गया है।
