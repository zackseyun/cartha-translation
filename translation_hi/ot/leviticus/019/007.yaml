  text: וְ/אִ֛ם הֵאָכֹ֥ל יֵאָכֵ֖ל בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י פִּגּ֥וּל ה֖וּא לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/007.yaml
  text: But if it is eaten at all on the third day[a], it is a defiled thing; it will not be accepted.
translation:
  language: hi
  text: परन्तु यदि उसे तीसरे दिन खाया ही जाए, तो वह दूषित वस्तु है[a]; वह स्वीकार नहीं किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘घृणास्पद वस्तु’ अथवा ‘कलुषित वस्तु’। इब्रानी शब्द यहाँ उस बलिदान के मांस को दर्शाता है जो निर्धारित समय बीतने के बाद खाए जाने से अस्वीकार्य हो जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: संयोजक और शर्त मिलकर पिछली आज्ञा के विपरीत स्थिति प्रस्तुत करते हैं; यह हिंदी में उस विरोध और शर्त दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֵאָכֹל יֵאָכֵל
  choice: खाया जाए
  rationale: इनफिनिटिव एब्सोल्यूट क्रिया को बल देता है। हिंदी में ‘तीसरे दिन भी खाया जाए’ निषिद्ध समय तक खाने पर अपेक्षित बल को सहज ढंग से व्यक्त करता है।
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: यह मूल के समय-सूचक वाक्यांश का सीधा और स्वाभाविक अनुवाद है।
- source_word: פִּגּוּל
  choice: दूषित वस्तु
  rationale: बलिदान-संबंधी संदर्भ में यह उस मांस को बताता है जो निर्धारित समय के बाद खाए जाने के कारण धार्मिक रीति से अस्वीकार्य हो गया है। ‘दूषित वस्तु’ इसके नकारात्मक और अनुष्ठानिक भाव को रखता है, जबकि पादटिप्पणी इसकी विशिष्टता स्पष्ट करती है।
- source_word: הוּא
  choice: वह ... है
  rationale: सर्वनाम विधेय पर बल देता है; हिंदी में स्पष्ट कर्ता और सहायक क्रिया के साथ इसे रखा गया है।
- source_word: לֹא יֵרָצֶה
  choice: वह स्वीकार नहीं किया जाएगा
  rationale: बलिदान-संबंधी प्रयोग में רצה का निफ़ाल रूप परमेश्वर के सामने स्वीकार्य होने को दर्शाता है; यह हिंदी रूप उस धार्मिक अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: तीसरे दिन खाए गए बलिदान के मांस की स्थिति
  choice: ऐसा मांस बलिदान-विधि के अनुसार दूषित और अस्वीकार्य घोषित होता है।
  alternative: यह केवल शारीरिक रूप से सड़ा हुआ मांस है, अथवा अन्य इब्रानी निषेध-संज्ञाओं के समान व्यापक अर्थ में ‘घृणित वस्तु’ है।
  rationale: निकटवर्ती प्रसंग बलिदान की स्वीकार्यता और उसे खाने की निर्धारित अवधि से संबंधित है। अंतिम उपवाक्य ‘स्वीकार नहीं किया जाएगा’ פִּגּוּל का अनुष्ठानिक-बलिदानी अर्थ पुष्ट करता है, पर उसके अर्थ को किसी व्यापक दार्शनिक या नैतिक श्रेणी तक नहीं फैलाता।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘दूषित वस्तु’ को पादटिप्पणी सहित रखा गया है ताकि פִּגּוּל के कठिन बलिदानी अर्थ को किसी एक संकीर्ण अर्थ में न बाँधा जाए।
