  register: आधुनिक मानक हिंदी में गरिमापूर्ण कानूनी-उपदेशात्मक शैली रखी गई है। ‘तुम’ इब्रानी में आरंभिक बहुवचन और आगे के एकवचन संबोधन के बीच संख्या-भेद को हिंदी में अनावश्यक रूप से कठोर नहीं बनाता। तकनीकी शब्द ‘शाअतनेज़’ को मुख्य पाठ में रखा गया है और उसका स्पष्टीकरण पाद-टिप्पणी में दिया गया है।
