  text: אֶֽת חֻקֹּתַ/י֮ תִּשְׁמֹרוּ֒ בְּהֶמְתְּ/ךָ֙ לֹא תַרְבִּ֣יעַ כִּלְאַ֔יִם שָׂדְ/ךָ֖ לֹא תִזְרַ֣ע כִּלְאָ֑יִם וּ/בֶ֤גֶד כִּלְאַ֨יִם֙ שַֽׁעַטְנֵ֔ז לֹ֥א יַעֲלֶ֖ה עָלֶֽי/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/019.yaml
  text: You shall keep my statutes. You shall not breed your livestock with two different kinds; you shall not sow your field with two kinds of seed; and a garment of mixed material[a], shaatnez, shall not come upon you.
translation:
  language: hi
  text: मेरी विधियों का पालन करो। अपने पशुधन को भिन्न प्रकार के पशुओं के साथ प्रजनन न कराओ; अपने खेत में भिन्न प्रकार के बीज न बोओ; और मिले-जुले रेशों का वस्त्र—शाअतनेज़—तुम्हारे शरीर पर न आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: मेरी विधियों
  rationale: यह पद निर्धारित कानूनी नियमों को दर्शाता है; ‘विधियों’ से उसका वैधानिक बल बना रहता है और भाषा सहज रहती है।
- source_word: תִּשְׁמֹרוּ
  choice: पालन करना
  rationale: वाचा और व्यवस्था के संदर्भ में שׁמר का अर्थ नियमों को मानना और उनका पालन करना है। निषेधात्मक आज्ञाओं के साथ ‘करना’ शैली स्वाभाविक हिंदी देती है।
- source_word: בְּהֶמְתְּךָ
  choice: अपने पालतू पशुओं
  rationale: בְּהֵמָה यहाँ केवल गाय-बैल नहीं, बल्कि मनुष्य द्वारा पाले जाने वाले पशुओं के लिए व्यापक शब्द है।
- source_word: תַרְבִּיעַ כִּלְאַיִם
  choice: भिन्न जाति के पशुओं से संकरण न कराना
  rationale: हिफ़ील क्रिया पशुओं को आपस में मिलाने या मैथुन कराने की बात करती है, और כִּלְאַיִם भिन्न प्रकारों के मिश्रण को सूचित करता है। ‘संकरण’ कृषि-पशुपालन के संदर्भ में सटीक है।
- source_word: שָׂדְךָ לֹא תִזְרַע כִּלְאָיִם
  choice: अपने खेत में दो भिन्न प्रकार के बीज न बोना
  rationale: זרע का अर्थ बीज बोना है। ‘बीज’ संदर्भ से निहित है और हिंदी में उसे स्पष्ट करने से वाक्य स्वाभाविक बनता है।
- source_word: בֶגֶד כִּלְאַיִם
  choice: मिले-जुले रेशों का वस्त्र
  rationale: בֶגֶד वस्त्र है और כִּלְאַיִם उसकी मिश्रित संरचना को बताता है। ‘रेशों’ से कपड़े के संदर्भ का आशय स्पष्ट होता है, पर मुख्य पाठ में ऊन और सन को निश्चित नहीं किया गया।
- source_word: שַׁעַטְנֵז
  choice: शाअतनेज़
  rationale: यह एक दुर्लभ तकनीकी इब्रानी शब्द है। लिप्यंतरण मूल सांस्कृतिक पद को सुरक्षित रखता है, जबकि पाद-टिप्पणी उसका पारंपरिक अर्थ बताती है।
- source_word: יַעֲלֶה עָלֶיךָ
  choice: तुम्हारे शरीर पर न आए
  rationale: शाब्दिक अर्थ ‘तुम पर न चढ़े’ है। ‘शरीर पर न आए’ वस्त्र पहनने का आशय समझने योग्य ढंग से व्यक्त करता है और वाक्य की मूल संरचना को ‘न पहनना’ की अपेक्षा अधिक निकटता से रखता है।
