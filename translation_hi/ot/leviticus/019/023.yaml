base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/023.yaml
  text: When you come into the land and plant any kind of tree for food[a], you shall regard its fruit as uncircumcised. For three years it shall be forbidden to you; it shall not be eaten.
translation:
  language: hi
  text: जब तुम उस देश में पहुँचो और हर खाने योग्य फलदार पेड़ लगाओ, तो उसके फल को खतनारहित[a] मानना। तीन वर्ष तक उसके फल तुम्हारे लिए खतनारहित रहेंगे; वे खाए न जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘खतनारहित’ है। यहाँ यह शब्द रूपक के रूप में उन फलों के लिए प्रयुक्त है जिन्हें पहले तीन वर्षों के दौरान खाने की अनुमति नहीं थी।
    reason: मूल इब्रानी रूपक और उसका कानूनी-व्यावहारिक आशय स्पष्ट करना।
lexical_decisions:
- source_word: וְכִי תָבֹאוּ אֶל־הָאָרֶץ
  choice: जब तुम उस देश में पहुँचो
  rationale: कानूनी निर्देश में וְכִי भावी परिस्थिति प्रस्तुत करता है, इसलिए स्वाभाविक हिन्दी में ‘जब’ उपयुक्त है। ‘उस देश’ निश्चित covenant-land संदर्भ को बनाए रखता है, बिना पाठ में न आए ‘कनान’ को जोड़ने के।
- source_word: וּנְטַעְתֶּם כָּל־עֵץ מַאֲכָל
  choice: और खाने के लिए किसी भी प्रकार का पेड़ लगाओ
  rationale: यह फल देने वाले खाद्य-वृक्षों का वितरणात्मक उल्लेख है। यह रूप शाब्दिक ‘हर खाद्य-पेड़’ की अपेक्षा आधुनिक हिन्दी में अधिक स्पष्ट है।
- source_word: וַעֲרַלְתֶּם עָרְלָתוֹ אֶת־פִּרְיוֹ
  choice: तो उसके फल को खतनारहित समझना
  rationale: ערל/ערלה के जानबूझकर प्रयुक्त रूपक को मुख्य पाठ में सुरक्षित रखा गया है। ‘समझना’ फल की भौतिक दशा नहीं, उसकी निर्धारित धार्मिक-कानूनी स्थिति बताता है।
- source_word: שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים
  choice: तीन वर्ष तक वह तुम्हारे लिए वर्जित रहेगा
  rationale: फल को सामूहिक एकवचन ‘वह’ से ग्रहण किया गया है। इस पुनरुक्त पद में रूपक के व्यावहारिक आशय को ‘वर्जित’ कहने से हिन्दी स्पष्ट रहती है, जबकि पहले पद और पादटिप्पणी में मूल रूपक सुरक्षित है।
- source_word: לֹא יֵאָכֵל
  choice: उसे खाया न जाए
  rationale: निफ़अल का निष्क्रिय/अव्यक्तिगत निषेध हिन्दी के ‘खाया न जाए’ से निकटता से व्यक्त होता है।
theological_decisions:
- issue: फल के लिए ערל/ערלה के रूपक को बनाए रखना या केवल उसका व्यावहारिक अर्थ देना
  choice: पहले उल्लेख में ‘खतनारहित’ रूपक सुरक्षित रखा गया और पादटिप्पणी में स्पष्ट किया गया
  alternative: मुख्य पाठ में दोनों स्थानों पर ‘वर्जित’
  rationale: मूल इब्रानी की वाचा-संबंधी और धार्मिक शब्दावली को पूरी तरह समतल कर देना उचित नहीं। साथ ही दूसरे पद में ‘वर्जित’ व्यावहारिक निषेध स्पष्ट करता है और अस्पष्ट हिन्दी पुनरावृत्ति से बचाता है।
- issue: ‘देश’ की पहचान
  choice: ‘उस देश’
  alternative: ‘कनान देश’
  rationale: संदर्भ प्रतिज्ञात देश की ओर संकेत करता है, पर इस पद में ‘कनान’ नाम नहीं है; इसलिए उसे पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, बहुवचन संबोधन ‘तुम’, और गरिमापूर्ण किंतु सहज कानूनी शैली अपनाई गई है। ‘खतनारहित’ मूल रूपक की पारदर्शिता बनाए रखता है; पादटिप्पणी पाठक को उसका प्रसंगगत अर्थ देती है।
