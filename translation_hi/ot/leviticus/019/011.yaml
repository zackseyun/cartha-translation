base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/011.yaml
  text: You shall not steal[a], and you shall not deal falsely, and you shall not lie to one another.
translation:
  language: hi
  text: तुम चोरी न करो, न छल करो और न एक-दूसरे से झूठ बोलो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּגְנֹבוּ
  choice: तुम चोरी न करना
  rationale: לֹא के साथ क़ाल अपूर्ण 2 बहुवचन विधिक निषेध व्यक्त करता है। גנב का सीधा और सामान्य अर्थ ‘चोरी करना’ है।
- source_word: תְכַחֲשׁוּ
  choice: न छल करना
  rationale: כחש का पिएल रूप छल करने, कपटपूर्ण व्यवहार करने या झूठा इनकार करने का अर्थ दे सकता है। ‘छल करना’ इस व्यापक अर्थ को बनाए रखता है और इसे केवल मौखिक इनकार तक सीमित नहीं करता।
- source_word: תְשַׁקְּרוּ
  choice: न ... झूठ बोलना
  rationale: שקר का पिएल रूप यहाँ पारस्परिक संबंध में झूठ बोलने को दर्शाता है। आधुनिक हिन्दी में ‘झूठ बोलना’ स्वाभाविक और स्पष्ट है।
- source_word: אִישׁ בַּעֲמִיתוֹ
  choice: एक-दूसरे से
  rationale: शाब्दिक रूप से ‘मनुष्य अपने साथी/समुदाय के सदस्य के साथ’ यह अभिव्यक्ति प्रसंग में वितरणात्मक और पारस्परिक है। ‘एक-दूसरे से’ उसके आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: עֲמִית
  choice: एक-दूसरे
  rationale: עמית किसी साथी, सह-समुदाय सदस्य या पड़ोसी को सूचित करता है; पूरी इब्रानी अभिव्यक्ति का पारस्परिक आशय हिन्दी के ‘एक-दूसरे’ में स्वाभाविक रूप से आता है।
theological_decisions:
- issue: אִישׁ ... עֲמִיתוֹ की व्याकरणिक रूप से पुल्लिंग वितरणात्मक अभिव्यक्ति
  choice: मुख्य पाठ में समावेशी ‘एक-दूसरे से’
  alternative: ‘हर पुरुष अपने पड़ोसी से’ या ‘मनुष्य अपने साथी से’
  rationale: इब्रानी पुल्लिंग एकवचन यहाँ केवल पुरुषों तक आज्ञा सीमित नहीं करता, बल्कि प्रतिनिधिक और पारस्परिक अर्थ रखता है। हिन्दी में ‘एक-दूसरे से’ स्रोत के आशय को बिना अनावश्यक लैंगिक सीमांकन के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। तीनों निषेध समानांतर रूप में रखे गए हैं; ‘छल करना’ और ‘झूठ बोलना’ के बीच स्रोत-पाठ का अर्थगत भेद भी बना रहता है।
