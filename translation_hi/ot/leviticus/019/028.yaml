base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/028.yaml
  text: You shall not make any cuts in your flesh for the dead[a], and you shall not put a tattoo mark on yourselves[b]. I am Yahweh.
translation:
  language: hi
  text: तुम मृतकों के लिए अपनी देह पर चीरे न लगाना[a], और न अपने शरीर पर कोई गोदा हुआ चिह्न बनाना[b]। मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘किसी मृत व्यक्ति के लिए।’ इब्रानी वाक्यांश मुहावरेदार है और सामान्यतः मृतक के लिए शोक मनाने से संबंधित प्रथा को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘कोई अंकित चिह्न’ अथवा ‘गोदना।’ यह इब्रानी अभिव्यक्ति दुर्लभ है और संभवतः शरीर पर बनाए गए स्थायी चिह्न को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂרֶט
  choice: चीरे
  rationale: यह संज्ञा देह पर लगाए गए कट या चीरे को दर्शाती है। बहुवचन ‘चीरे’ सामूहिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और कट की गंभीरता या साधन को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לָנֶפֶשׁ
  choice: किसी मृतक के लिए
  rationale: इस विधिक और शोक-संबंधी संदर्भ में נֶפֶשׁ मृत व्यक्ति को सूचित करता है। ‘किसी मृतक के लिए’ इब्रानी मुहावरे का अर्थ स्पष्ट रखता है।
- source_word: בִּבְשַׂרְכֶם
  choice: अपनी देह पर
  rationale: בָּשָׂר का मूल अर्थ ‘मांस/देह’ है। हिन्दी में शरीर पर चीरा लगाने के लिए ‘देह पर’ स्वाभाविक है और मूल की ठोस शारीरिक भाषा भी बनाए रखता है।
- source_word: כְתֹבֶת קַעֲקַע
  choice: गोदने का कोई चिह्न
  rationale: यह दुर्लभ संयुक्त अभिव्यक्ति शरीर पर अंकित या स्थायी रूप से गोदे गए चिह्न की ओर संकेत करती जान पड़ती है। ‘गोदने का चिह्न’ संभावित आशय बताता है, जबकि पादटिप्पणी इसकी शब्दार्थगत अनिश्चितता सुरक्षित रखती है।
- source_word: לֹא תִתְּנוּ ... בָּכֶם
  choice: न अपने ऊपर ... बनाना
  rationale: נתן के साथ ב यहाँ शरीर पर कोई निशान लगाने या अंकित करने का भाव देता है। ‘अपने ऊपर ... बनाना’ आधुनिक हिन्दी में सीधा और स्वाभाविक निषेध है।
- source_word: אֲנִי יְהוָה
  choice: मैं याहवे हूँ
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को नाम के रूप में ‘याहवे’ लिखा गया है, जिससे मूल की वाचिक और वाचागत आत्म-पहचान सुरक्षित रहती है।
theological_decisions:
- issue: शरीर पर चिह्न लगाने के निषेध की सीमा
  choice: पहले निषेध को मृतक के लिए किए जाने वाले चीरों से स्पष्ट रूप से जोड़ना और दूसरे निषेध को अलग वाक्यांश के रूप में रखना
  alternative: दोनों निषेधों को केवल शोक-संस्कारों तक सीमित मानना, अथवा इस पद में हर संस्कृति के सभी आधुनिक टैटू के विषय में स्पष्ट सार्वकालिक निष्कर्ष जोड़ना
  rationale: मूल पाठ पहले निषेध के साथ לָנֶפֶשׁ जोड़ता है, पर दूसरे निषेध के साथ उसे दोहराता नहीं। अनुवाद इसी संरचना को बनाए रखता है और पद की सीमा को न संकुचित करता है, न विस्तृत।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘चीरे’ और ‘देह’ मूल की ठोस शारीरिक भाषा को बनाए रखते हैं; ‘गोदने का कोई चिह्न’ सामान्य पाठक के लिए बोधगम्य है, जबकि दुर्लभ इब्रानी पद की अनिश्चितता पादटिप्पणी में सुरक्षित है।
