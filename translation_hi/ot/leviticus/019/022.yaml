base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/022.yaml
  text: And the priest shall make atonement for him before Yahweh with the ram of the guilt offering for the sin that he committed[a], and he shall be forgiven for the sin that he committed.
translation:
  language: hi
  text: और याजक उसके लिए दोष-बलि के मेढ़े के द्वारा यहोवा के सामने उसके किए हुए पाप के लिए प्रायश्चित करे[a]; तब उसके किए हुए पाप के लिए उसे क्षमा मिलेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दोष-बलि’ का अनुवाद ‘क्षतिपूर्ति-बलि’ भी हो सकता है। इब्रानी אָשָׁם में दोष और उसकी क्षतिपूर्ति—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר עָלָיו הַכֹּהֵן
  choice: याजक उसके लिए ... प्रायश्चित करे
  rationale: כפר के याजकीय अनुष्ठान-संबंधी अर्थ को प्रचलित और स्पष्ट हिन्दी ‘प्रायश्चित करे’ से व्यक्त किया गया है; עליו लाभार्थी को ‘उसके लिए’ के रूप में रखता है।
- source_word: בְּאֵיל הָאָשָׁם
  choice: दोष-बलि के मेढ़े के द्वारा
  rationale: איל का विशिष्ट अर्थ ‘मेढ़ा’ है और אָשָׁם यहाँ दोष तथा क्षतिपूरक पक्ष वाली बलि का नाम है; साधनसूचक ב को ‘के द्वारा’ से व्यक्त किया गया है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לפני का उपासना-संबंधी स्थानगत भाव ‘के सामने’ से और वाचा के नाम יהוה को पारंपरिक हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: उसके किए हुए पाप के लिए
  rationale: हिब्रू की सजातीय पुनरुक्ति को स्वाभाविक हिन्दी में रखते हुए अपराध और प्रायश्चित के संबंध को स्पष्ट किया गया है।
- source_word: וְנִסְלַח לוֹ
  choice: तब ... उसे क्षमा मिलेगी
  rationale: סלח के निफ़अल रूप में क्षमा देने वाला कर्ता अप्रकट है; हिन्दी में ‘उसे क्षमा मिलेगी’ उसी दैवी निष्क्रियता को स्वाभाविक ढंग से बनाए रखता है।
- source_word: מֵחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: उसके किए हुए पाप के लिए
  rationale: क्षमा-सूत्र में מן को शब्दशः ‘से’ करने के बजाय हिन्दी के स्वाभाविक प्रयोग ‘पाप के लिए क्षमा’ से अर्थ व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का व्यक्तिगत नाम स्पष्ट रूप से आया है; उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले नामरूप ‘यहोवा’ से दिया गया है।
- issue: אָשָׁם का बलिदानी अर्थ
  choice: दोष-बलि
  alternative: क्षतिपूर्ति-बलि
  rationale: ‘दोष-बलि’ स्थापित और संक्षिप्त हिन्दी पद है, पर मूल शब्द में क्षतिपूर्ति का पक्ष भी संभव है; इसलिए उस अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: क्षमा देने वाले अप्रकट कर्ता का निरूपण
  choice: उसे क्षमा मिलेगी
  alternative: यहोवा उसे क्षमा करेगा
  rationale: हिब्रू निष्क्रिय वाक्य में कर्ता का नाम नहीं लिया गया है; अनुवाद में उसे स्पष्ट जोड़कर मूल की व्याकरणिक और धर्मवैचारिक सूक्ष्मता को नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘याजक’, ‘बलि’ और ‘प्रायश्चित’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं; हिब्रू की पुनरुक्ति भी अर्थगत बल बनाए रखने के लिए दोनों खंडों में व्यक्त की गई है।
