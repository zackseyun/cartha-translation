  text: לֹֽא תִשְׂנָ֥א אֶת אָחִ֖י/ךָ בִּ/לְבָבֶ֑/ךָ הוֹכֵ֤חַ תּוֹכִ֨יחַ֙ אֶת עֲמִיתֶ֔/ךָ וְ/לֹא תִשָּׂ֥א עָלָ֖י/ו חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/017.yaml
  text: You shall not hate your brother in your heart. You shall surely rebuke your neighbor[a], and you shall not bear sin because of him.
translation:
  language: hi
  text: तुम अपने भाई से अपने मन में बैर न रखना। अपने पड़ोसी को अवश्य समझाना, और उसके कारण पाप का दोषी न बनना[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अर्थ यह भी हो सकता है: “उसके कारण दोषी न ठहरना” या “उसका पाप अपने ऊपर न लेना।” इब्रानी पदबंध मुहावरेदार है और संभवतः गलत काम का सामना न करने से दोषी बनने की ओर संकेत करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂנָא
  choice: बैर रखना
  rationale: यह प्रयोग שׂנא की प्रबल नैतिक निषेधात्मकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘मन में बैर रखना’ भीतर पाले गए द्वेष के भाव को स्पष्ट रखता है।
- source_word: אָחִיךָ
  choice: अपने भाई
  rationale: ‘भाई’ मूल के पारिवारिक और वाचा-समुदाय संबंधी दोनों संकेतों को बनाए रखता है।
- source_word: בִּלְבָבֶךָ
  choice: अपने मन में
  rationale: हिन्दी में ‘मन में’ भीतरी विचार, भावना और मंशा का स्वाभाविक बोध कराता है।
- source_word: הוֹכֵחַ תּוֹכִיחַ
  choice: अवश्य डाँटना
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute आदेश पर जोर देता है; ‘अवश्य’ उस बल को और ‘डाँटना’ नैतिक गलत काम का सीधे सामना करने को व्यक्त करता है।
- source_word: עֲמִיתֶךָ
  choice: अपने पड़ोसी
  rationale: यह समुदाय के सह-सदस्य के लिए प्रचलित और लैव्यव्यवस्था 19 के संदर्भ में पहचाना जाने वाला हिन्दी समतुल्य है।
- source_word: תִשָּׂא עָלָיו חֵטְא
  choice: उसके कारण पाप के भागी न बनना
  rationale: मुहावरे का आशय यह हो सकता है कि गलत काम का सामना न करने से व्यक्ति दोषी ठहरे या दूसरे के पाप में सहभागी बने; चयन अर्थ को स्वाभाविक हिन्दी में रखता है और टिप्पणी में अन्य संभावना सुरक्षित करता है।
theological_decisions:
- issue: वाचा-संबंधी नैतिकता में संबंधसूचक शब्दों का दायरा
  choice: ‘भाई’ और ‘पड़ोसी’ के एकवचन पुल्लिंग रूप बनाए रखे गए।
  alternative: ‘संगी मनुष्य’ या ‘साथी इस्राएली’
  rationale: इब्रानी में व्याकरणतः पुल्लिंग एकवचन रूप प्रतिनिधिक अर्थ में हैं। मूल का पारिवारिक और सामुदायिक स्वर बनाए रखना उसे सामान्यीकृत करके सपाट कर देने से बेहतर है।
- issue: תִשָּׂא עָלָיו חֵטְא में दोष का संबंध
  choice: ‘उसके कारण पाप के भागी न बनना’
  alternative: ‘उसके कारण दोषी न ठहरना’ या ‘उसका पाप अपने ऊपर न लेना’
  rationale: इब्रानी पदबंध मुहावरेदार और कुछ हद तक अस्पष्ट है। मुख्य पाठ सहभागिता/दोषभागिता को व्यक्त करता है, जबकि पाद-टिप्पणी दोष उठाने या उसके कारण दोषी होने की संभावना को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष आदेशात्मक रूप। ‘बैर रखना’ और ‘मन में’ सामान्य पाठक के लिए स्वाभाविक हैं। ‘अवश्य’ मूल की जोरदार व्याकरणिक रचना को दर्शाता है; अस्पष्ट अंतिम पदबंध की वैकल्पिक व्याख्याएँ पाद-टिप्पणी में सुरक्षित हैं।
