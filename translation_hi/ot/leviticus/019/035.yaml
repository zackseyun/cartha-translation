  yaml_path: translation/ot/leviticus/019/035.yaml
  text: You shall not commit injustice in judgment[a], in measures of length, weight, or volume.
translation:
  language: hi
  text: न्याय में[a], लंबाई के माप में, तौल में या धारिता के माप में अन्याय न करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्याय करते समय’।
    reason: מִשְׁפָּט का अर्थ न्याय, न्यायिक निर्णय, या न्याय करने की प्रक्रिया हो सकता है।
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ
  choice: न करना
  rationale: यह बहुवचन निषेध है। ‘न करना’ हिन्दी की विधिक-आज्ञात्मक शैली में स्वाभाविक है और मूल क्रिया עשה के निकट रहता है।
- source_word: עָוֶל
  choice: अन्याय
  rationale: इस शब्द का अर्थ गलत, अनुचित या अन्यायपूर्ण व्यवहार है। ‘अन्याय’ न्यायिक और व्यापारिक—दोनों प्रसंगों को समेटता है और इसे केवल धोखाधड़ी तक सीमित नहीं करता।
- source_word: בַּמִּשְׁפָּט
  choice: न्याय करते समय
  rationale: מִשְׁפָּט का अर्थ न्याय, निर्णय या न्यायिक कार्य हो सकता है। यह अभिव्यक्ति हिन्दी में सहज रहते हुए उस व्यापक अर्थ-क्षेत्र को बनाए रखती है।
- source_word: בַּמִּדָּה
  choice: लंबाई ... नापते समय
  rationale: מִדָּה सामान्य माप है, पर भार और धारिता के अलग उल्लेख के कारण यहाँ लंबाई/आकार का माप अभिप्रेत होने की संभावना है। ‘लंबाई’ तीन श्रेणियों को स्पष्ट करता है।
- source_word: בַּמִּשְׁקָל
  choice: भार
  rationale: מִשְׁקָל वजन या तौल को दर्शाता है। ‘भार’ मापन की श्रेणी के रूप में सटीक और मानक हिन्दी है।
- source_word: וּבַמְּשׂוּרָה
  choice: आयतन
  rationale: מְשׂוּרָה धारिता या नापी हुई मात्रा को दर्शाता है। ‘आयतन’ आधुनिक हिन्दी में तरल या सूखी वस्तु, दोनों की क्षमता-माप को समेटता है।
