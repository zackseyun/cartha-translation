  terminology: ‘विश्राम-दिनों’ adequately reflects the plural Sabbath observances, and ‘पवित्र-स्थान’ appropriately avoids specifying tabernacle or temple. ‘आदर’ is slightly broad but acceptable in context; the footnote preserves the lexical ‘fear’ alternative. ‘याहवे’ follows the project’s specified rendering of יהוה.
