  yaml_path: translation/ot/leviticus/019/030.yaml
  text: You shall keep my Sabbaths and revere my sanctuary[a]; I am Yahweh.
translation:
  language: hi
  text: तुम मेरे विश्राम-दिनों का पालन करो और मेरे पवित्र-स्थान का आदर करो।[a] मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “मेरे पवित्र-स्थान से डरो।” इब्रानी क्रिया का अर्थ “डरना” या “श्रद्धापूर्वक आदर करना” हो सकता है; यहाँ यह याहवे के पवित्र स्थान के प्रति पवित्र आदर दर्शाती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְּתֹתַי
  choice: मेरे विश्राम-दिनों
  rationale: इब्रानी में बहुवचन स्पष्ट है। ‘विश्राम-दिनों’ से सब्त की ठहराई हुई नियमित पवित्र मान्यताओं का बोध होता है और रूप भी बहुवचन रहता है।
- source_word: תִּשְׁמֹרוּ
  choice: पालन करना
  rationale: שׁמר का अर्थ रखना, चौकसी करना या पालन करना हो सकता है। विधिक संदर्भ में ‘पालन करना’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: מִקְדָּשִׁי
  choice: मेरे पवित्र-स्थान
  rationale: מִקְדָּשׁ परमेश्वर के लिए अलग किए गए पवित्र स्थान को दर्शाता है। ‘पवित्र-स्थान’ तम्बू या मन्दिर को अनावश्यक रूप से निश्चित किए बिना इस अर्थ को सुरक्षित रखता है।
- source_word: תִּירָאוּ
  choice: आदर करना
  rationale: ירא में भय और श्रद्धापूर्ण आदर दोनों अर्थ हैं। इस उपासना-संबंधी संदर्भ में ‘आदर करना’ पवित्र स्थान के प्रति उचित श्रद्धा व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֲנִי יְהוָה
  choice: मैं यहोवा हूँ
  rationale: यह आवर्ती वाचा-सूत्र परमेश्वर की स्पष्ट आत्म-पहचान है; हिन्दी में यह रूप सहज और दृढ़ है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी के सामान्य पाठकों के लिए स्थापित ‘यहोवा’ नाम को रखा गया है, न कि ‘प्रभु’ जैसी उपाधि को।
- issue: पवित्र-स्थान के संबंध में ירא का भाव
  choice: मेरे पवित्र-स्थान का आदर करना
  alternative: मेरे पवित्र-स्थान से डरना
  rationale: मूल क्रिया भय और श्रद्धा दोनों व्यक्त कर सकती है। संदर्भ में पवित्र स्थान के प्रति श्रद्धापूर्ण व्यवहार मुख्य है, पर वास्तविक शाब्दिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण विधिक हिन्दी। दोनों आदेशों के लिए साझा ‘तुम’ और क्रमिक ‘करना’ संरचना अपनाई गई है। बहुवचन तथा ईश्वरीय व्यक्तिगत नाम सुरक्षित रखे गए हैं।
