base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/027.yaml
  text: You shall not round off the hair at the sides of your head[c][b][a], and you shall not mar the edges of your beard.
translation:
  language: hi
  text: तुम अपने सिर के किनारों के बालों को गोलाई में न काटना[a][b], और अपनी दाढ़ी का किनारा न बिगाड़ना।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने सिर या बालों की किनारी को।’ इब्रानी शब्द का अर्थ ‘किनारा,’ ‘बगल’ या ‘कोना’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: संभवतः इसका आशय सिर के किनारों के बालों को गोल ढंग से मुँडाने या काटने से है।
    reason: cultural_note
  - marker: c
    text: ‘बिगाड़ना’ के लिए प्रयुक्त इब्रानी क्रिया का अनुवाद ‘नष्ट करना,’ ‘खराब करना’ या ‘विकृत करना’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַקִּפוּ
  choice: गोल आकार में न काटना
  rationale: हिफ़ील रूप यहाँ सिर के किनारे के बालों को चारों ओर गोल ढंग से काटने की क्रिया बताता है। यह अनुवाद क्रिया को ठोस रखता है, पर काटने की विधि को अनावश्यक रूप से अधिक निश्चित नहीं करता।
- source_word: פְּאַת
  choice: किनारों के बाल / किनारा
  rationale: פֵּאָה का अर्थ किनारा, बगल या छोर हो सकता है। पहले वाक्यांश में स्वाभाविक हिन्दी के लिए बाल स्पष्ट किए गए हैं; दूसरे में दाढ़ी का ‘किनारा’ मूल की ठोस छवि बनाए रखता है।
- source_word: רֹאשְׁכֶם
  choice: अपने सिर
  rationale: इब्रानी में बहुवचन समुदाय को संबोधित करता है। हिन्दी में सामूहिक ‘तुम’ के साथ ‘अपने सिर’ स्वाभाविक है और प्रत्येक संबोधित व्यक्ति पर आज्ञा लागू होने का भाव देता है।
- source_word: תַשְׁחִית
  choice: न बिगाड़ना
  rationale: שׁחת के हिफ़ील का मूल भाव नष्ट करना, खराब करना या विकृत करना है। दाढ़ी सँवारने के संदर्भ में ‘बिगाड़ना’ अर्थ की व्यापकता बनाए रखता है और किसी एक विधि, जैसे केवल मुँडाने, को आरोपित नहीं करता।
- source_word: זְקָנֶךָ
  choice: अपनी दाढ़ी
  rationale: इस प्रसंग में זָקָן का सामान्य और स्पष्ट हिन्दी अर्थ ‘दाढ़ी’ है।
- source_word: לֹא ... וְלֹא
  choice: न काटना ... और ... न बिगाड़ना
  rationale: हिन्दी निषेधात्मक विधान की स्वाभाविक शैली में दोनों निषेध समानांतर रखे गए हैं।
theological_decisions:
- issue: निषेध का स्वरूप और कारण
  choice: विशिष्ट बाल तथा दाढ़ी काटने की क्रियाओं का ठोस निषेध, बिना उसके धार्मिक या सांस्कृतिक कारण को मुख्य पाठ में जोड़ने के
  alternative: इसे विशेष रूप से मूर्तिपूजक शोक-विधि अथवा आसपास की जातियों की सामान्य सज्जा-शैली के निषेध के रूप में स्पष्ट करना
  rationale: इस पद का इब्रानी पाठ निषिद्ध क्रियाएँ बताता है, पर उनका कारण स्पष्ट नहीं करता। इसलिए अनुवाद उस व्याख्यात्मक तनाव को खुला रखता है और किसी प्रस्तावित ऐतिहासिक उद्देश्य को पाठ में नहीं मिलाता।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज किंतु गरिमापूर्ण विधान-शैली अपनाई गई है। ‘तुम’ सामूहिक संबोधन है। पहले खंड में अर्थ स्पष्ट करने के लिए ‘बाल’ जोड़ा गया है; मूल के ‘किनारे/कोने’ की सम्भावना पादटिप्पणी में सुरक्षित है।
