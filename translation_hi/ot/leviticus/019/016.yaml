id: LEV.19.16
reference: Leviticus 19:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹא תֵלֵ֤ךְ רָכִיל֙ בְּ/עַמֶּ֔י/ךָ לֹ֥א תַעֲמֹ֖ד עַל דַּ֣ם רֵעֶ֑/ךָ אֲנִ֖י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/016.yaml
  text: You shall not go about as a slanderer among your people[a]. You shall not stand against the blood of your neighbor. I am Yahweh.
translation:
  language: hi
  text: अपने लोगों के बीच बदनामी फैलाते मत फिरना। अपने पड़ोसी के खून के विरुद्ध खड़े मत होना।[a] मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तुम्हारे पड़ोसी का खून बहाया जा रहा हो, तब चुपचाप खड़े मत रहना।”
    reason: इब्रानी वाक्यांश का वैकल्पिक अर्थ, जो जानलेवा संकट में निष्क्रिय बने रहने का निषेध समझता है।
lexical_decisions:
- source_word: תֵלֵךְ רָכִיל
  choice: बदनामी फैलाते मत फिरना
  rationale: הלך के घूमने-फिरने के बिंब और רכיל के हानिकारक बातें फैलाने के अर्थ को स्वाभाविक आधुनिक हिन्दी में संयुक्त रूप से व्यक्त करता है।
- source_word: בְּעַמֶּיךָ
  choice: अपने लोगों के बीच
  rationale: समुदाय के भीतर आचरण का भाव स्पष्ट और सहज रूप से व्यक्त होता है।
- source_word: תַעֲמֹד עַל
  choice: के विरुद्ध खड़े मत होना
  rationale: עמד का ‘खड़ा होना’ बिंब बनाए रखता है और על के संभावित विरोधी अर्थ को मुख्य पाठ में रखता है; निष्क्रिय दर्शक बने रहने वाला अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: דַּם רֵעֶךָ
  choice: अपने पड़ोसी के खून
  rationale: דם की ठोस ‘खून’ भाषा और רֵעַ के स्थापित नैतिक-सामुदायिक अर्थ ‘पड़ोसी’ को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय व्यक्त करता है।
theological_decisions:
- issue: לֹא תַעֲמֹד עַל דַּם רֵעֶךָ का अर्थ
  choice: ‘अपने पड़ोसी के खून के विरुद्ध खड़े मत होना’—पड़ोसी के जीवन के विरुद्ध कार्य करने या उसे संकट में डालने का निषेध।
  alternative: ‘जब तुम्हारे पड़ोसी का खून बहाया जा रहा हो, तब चुपचाप खड़े मत रहना’—जानलेवा संकट में निष्क्रिय दर्शक न बने रहना; एक अन्य संभावना मृत्युदंड वाले मुकदमे में उसके विरुद्ध गवाही देना है।
  rationale: इब्रानी वाक्यांश संक्षिप्त और अर्थ की दृष्टि से बहुसंभावी है। मुख्य पाठ ‘खून’ और ‘खड़े होना’ के बिंब को सुरक्षित रखता है तथा על को ‘विरुद्ध’ के रूप में देता है; व्यापक रूप से स्वीकृत निष्क्रियता-विरोधी समझ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और समुदाय-केंद्रित कानूनी-नैतिक शैली। ‘बदनामी फैलाते फिरना’ बोलचाल की सहजता के साथ רכיל की गंभीर हानिकारकता व्यक्त करता है।
