  choice: पवित्र होगा—याहवे की स्तुति के लिए
  alternative: पवित्र होगा—याहवे के लिए स्तुतियाँ / पवित्र, याहवे के लिए उत्सवपूर्ण स्तुति
  rationale: यह अनुवाद फल के पवित्र ठहराए जाने और उसके द्वारा याहवे की स्तुति किए जाने, दोनों को रखता है, पर हिब्रू में स्पष्ट रूप से न आए ‘भेंट’ जैसे तकनीकी शब्द को मुख्य पाठ में नहीं जोड़ता। दुर्लभ वाक्यांश की अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
- issue: יהוה का रूपान्तरण
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में आए व्यक्तिगत ईश्वरीय नाम को नाम के रूप में प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और विधिक शैली रखी गई है। ‘परन्तु’ संदर्भगत विरोध स्पष्ट करता है; डैश दुर्लभ पदबंध के उद्देश्यात्मक संबंध को पठनीय बनाता है। पाद-टिप्पणी चिह्न [a] मुख्य पाठ में उपस्थित है।
