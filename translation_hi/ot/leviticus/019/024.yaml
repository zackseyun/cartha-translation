base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/024.yaml
  text: But in the fourth year all its fruit shall be holy[a], for giving praise to Yahweh.
translation:
  language: hi
  text: परन्तु चौथे वर्ष में उसका सारा फल पवित्र होगा—याहवे की स्तुति के लिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “पवित्र—याहवे के लिए स्तुतियाँ” या “पवित्र—याहवे की स्तुति के लिए।” यह इब्रानी पदबंध दुर्लभ है और फल के साथ की जाने वाली उत्सवपूर्ण स्तुति पर बल दे सकता है।
    reason: दुर्लभ הִלּוּלִים और पूरे पदबंध קֹדֶשׁ הִלּוּלִים की वास्तविक शाब्दिक तथा अर्थगत अस्पष्टता दिखाना।
lexical_decisions:
- source_word: וּבַשָּׁנָה הָרְבִיעִת
  choice: परन्तु चौथे वर्ष में
  rationale: ו को पिछले तीन वर्षों के निषेध के साथ विरोध दर्शाने के लिए ‘परन्तु’ और ב को कालसूचक ‘में’ के रूप में व्यक्त किया गया है।
- source_word: יִהְיֶה כָּל־פִּרְיוֹ
  choice: उसका सारा फल ... होगा
  rationale: כָּל और एकवचन संज्ञा पर लगे प्रत्यय का स्वाभाविक अर्थ उस वृक्ष की पूरी उपज है; विधिक भविष्य को ‘होगा’ से व्यक्त किया गया है।
- source_word: קֹדֶשׁ
  choice: पवित्र
  rationale: यह विधेय रूप में फल को परमेश्वर के लिए अलग ठहराया हुआ बताता है; ‘पवित्र’ संक्षिप्त और धार्मिक भार को बनाए रखता है।
- source_word: הִלּוּלִים
  choice: स्तुति के लिए
  rationale: यह दुर्लभ बहुवचन शब्द स्तुति और उत्सवपूर्ण प्रशंसा से जुड़ा है। ‘स्तुति के लिए’ बिना किसी विशिष्ट बलि या भेंट का अर्थ जोड़े इसके प्रयोजन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַיהוָה
  choice: याहवे की
  rationale: ל यहाँ लक्ष्य/समर्पण का भाव देता है; הִלּוּלִים के साथ हिन्दी में ‘याहवे की स्तुति के लिए’ स्वाभाविक है। वाचा के व्यक्तिगत नाम को ‘याहवे’ के रूप में रखा गया है।
theological_decisions:
