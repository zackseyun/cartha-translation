source:
  edition: WLC
  text: לֹא תְקַלֵּ֣ל חֵרֵ֔שׁ וְ/לִ/פְנֵ֣י עִוֵּ֔ר לֹ֥א תִתֵּ֖ן מִכְשֹׁ֑ל וְ/יָרֵ֥אתָ מֵּ/אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/014.yaml
  text: 'You shall not curse a deaf man[a], and before a blind man you shall not put a stumbling block; but you shall fear your God: I am Yahweh.'
translation:
  language: hi
  text: तुम किसी बहरे पुरुष को शाप न देना[a], और किसी अंधे पुरुष के आगे ठोकर खाने की वस्तु न रखना; बल्कि अपने परमेश्वर का भय मानना। मैं यहोवा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहरे’ और ‘अंधे’। इब्रानी में पुल्लिंग एकवचन रूप प्रतिनिधिक विधिक उदाहरणों के रूप में प्रयुक्त हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְקַלֵּל
  choice: शाप देना
  rationale: पिएल रूप में קלל का अर्थ शाप देना या तिरस्कारपूर्वक बोलना हो सकता है। यहाँ ‘शाप देना’ निषेध की सीधी और प्रबल वाचिक धार को बनाए रखता है।
- source_word: חֵרֵשׁ
  choice: किसी बहरे पुरुष
  rationale: इब्रानी में पुल्लिंग एकवचन रूप है, जो विधिक उदाहरण के रूप में प्रतिनिधिक ढंग से प्रयुक्त हुआ है; हिन्दी में ‘पुरुष’ जोड़ने से स्रोत का लिंग और एकवचन स्पष्ट रहता है।
- source_word: לִפְנֵי
  choice: के आगे
  rationale: यह स्थान-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और जानबूझकर मार्ग में बाधा रखने की छवि बनाए रखता है।
- source_word: עִוֵּר
  choice: किसी अंधे पुरुष
  rationale: यह भी पुल्लिंग एकवचन प्रतिनिधिक विधिक उदाहरण है; अनुवाद स्रोत-रूप को बनाए रखता है।
- source_word: תִתֵּן
  choice: रखना
  rationale: נתן का मूल अर्थ ‘देना’ है, पर מִכְשֹׁל के साथ हिन्दी मुहावरे में ‘रखना’ स्वाभाविक है।
- source_word: מִכְשֹׁל
  choice: ठोकर का कारण
  rationale: यह ऐसी वस्तु या बाधा को दर्शाता है जिससे कोई ठोकर खाए। ‘ठोकर का कारण’ शाब्दिक चित्र और व्यापक नैतिक संकेत दोनों को बचाता है।
- source_word: וְיָרֵאתָ
  choice: बल्कि ... भय मानना
  rationale: वाव को यहाँ निषिद्ध गुप्त दुर्व्यवहार और परमेश्वर के प्रति उत्तरदायित्व के बीच व्यतिरेकी मोड़ के रूप में व्यक्त किया गया है।
- source_word: מֵאֱלֹהֶיךָ
  choice: अपने परमेश्वर का
  rationale: ירא के साथ מן भय के लक्ष्य को चिह्नित करता है; स्वाभाविक हिन्दी प्रयोग ‘परमेश्वर का भय मानना’ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित नामरूप ‘यहोवा’ चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: विधिक उदाहरणों में प्रतिनिधिक पुल्लिंग एकवचन
  choice: ‘किसी बहरे पुरुष’ और ‘किसी अंधे पुरुष’ द्वारा पुल्लिंग एकवचन बनाए रखा गया
  alternative: ‘बहरे व्यक्ति’ और ‘अंधे व्यक्ति,’ अथवा ‘बहरों’ और ‘अंधों’
  rationale: मूल इब्रानी के पुल्लिंग एकवचन रूपों को सुरक्षित रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि ये विधिक प्रतिनिधिक उदाहरण हैं।
- issue: अंतिम प्रेरक उपवाक्य का बल
  choice: ‘बल्कि अपने परमेश्वर का भय मानना’
  alternative: ‘और अपने परमेश्वर का भय मानना’
  rationale: यह चयन उन दुर्व्यवहारों से, जो पीड़ित की असमर्थता के कारण मानवीय दंड से छिप सकते हैं, परमेश्वर के सामने उत्तरदायित्व की ओर होने वाले नैतिक मोड़ को व्यक्त करता है; साथ ही वाव की संभावित साधारण संयोजकता वैकल्पिक रूप रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण विधिक-नैतिक रजिस्टर अपनाया गया है। ‘न देना/न रखना/भय मानना’ समानांतर आज्ञार्थक शैली बनाए रखते हैं।
