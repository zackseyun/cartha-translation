base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/029.yaml
  text: Do not profane your daughter by making her a prostitute[c][b][a], lest the land become prostituted and the land be filled with depravity.
translation:
  language: hi
  text: अपनी बेटी को वेश्या बनाकर[a] उसे अपवित्र न करना, कहीं ऐसा न हो कि देश भी वेश्यावृत्ति में पड़ जाए[b] और देश घोर दुराचार से भर जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उससे वेश्यावृत्ति करवाकर।” इब्रानी क्रिया कारणवाचक है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “देश वेश्यावृत्ति करने लगे।” यहाँ पूरे समाज के भ्रष्ट हो जाने की बात रूपक में कही गई है।
    reason: lexical_alternative
  - marker: c
    text: या, “निर्लज्जता” अथवा “दुष्टता।” इब्रानी शब्द घोर नैतिक भ्रष्टता को दर्शाता है, प्रायः यौन संदर्भ में।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַלֵּל
  choice: अपवित्र न करना
  rationale: पिएल रूप यहाँ किसी को पवित्रता के क्षेत्र से गिराकर अपवित्र ठहराने या उसके साथ अपवित्र वस्तु जैसा व्यवहार करने का भाव देता है। ‘अपवित्र’ लैव्यव्यवस्था की पवित्रता-संबंधी शब्दावली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בִּתְּךָ
  choice: अपनी बेटी
  rationale: एकवचन संज्ञा और द्वितीय पुरुष पुल्लिंग एकवचन संबंधसूचक प्रत्यय का सीधा और स्वाभाविक अनुवाद।
- source_word: לְהַזְנוֹתָהּ
  choice: वेश्या बनाकर
  rationale: 'זנה का हिफ़ील क्रियार्थक रूप है: बेटी से वेश्यावृत्ति करवाना या उसे उस दशा में डालना। यह चयन उस कारणवाचक बल को स्पष्ट रखता है।'
- source_word: תִזְנֶה הָאָרֶץ
  choice: देश भी वेश्यावृत्ति में पड़ जाए
  rationale: मूल में देश को मानवीकृत करके उसके ‘वेश्यावृत्ति करने’ की तीखी उपमा दी गई है। यह हिन्दी रूप उस उपमा और सामुदायिक भ्रष्टता के परिणाम—दोनों को बनाए रखता है।
- source_word: וּמָלְאָה הָאָרֶץ
  choice: और देश ... से भर जाए
  rationale: चेतावनी के परिणाम को व्यक्त करने वाला स्वाभाविक हिन्दी वाक्य-विन्यास।
- source_word: זִמָּה
  choice: घोर दुराचार
  rationale: यह शब्द योजनाबद्ध, लज्जाजनक और विशेषतः यौन संदर्भ वाले गंभीर नैतिक भ्रष्टाचार को सूचित कर सकता है। ‘घोर दुराचार’ इसकी तीव्रता को बनाए रखता है, पर अर्थ को केवल एक प्रकार के यौन पाप तक सीमित नहीं करता।
theological_decisions:
- issue: देश के ‘वेश्यावृत्ति करने’ वाले रूपक का अनुवाद
  choice: देश भी वेश्यावृत्ति में पड़ जाए
  alternative: देश अनैतिक हो जाए
  rationale: सामान्य ‘अनैतिकता’ कहने से मूल का यौन और सामुदायिक रूपक मिट जाता। चुना गया रूप मूल की तीखी भाषा को रखते हुए आधुनिक हिन्दी में समझने योग्य है।
- issue: חלל के लिए पवित्रता-संबंधी शब्दावली
  choice: अपवित्र करना
  alternative: बदनाम करना / अनादर करना
  rationale: लैव्यव्यवस्था के पवित्र–अपवित्र वैचारिक संदर्भ में ‘अपवित्र करना’ अधिक उपयुक्त है; ‘बदनाम’ या ‘अनादर’ अर्थ को केवल सामाजिक प्रतिष्ठा तक सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण निषेधात्मक विधान अपनाया गया है। ‘अपवित्र’ से लैव्यव्यवस्था का पवित्रता-विषयक स्वर और ‘वेश्यावृत्ति में पड़ जाए’ से मूल रूपक सुरक्षित रहता है।
