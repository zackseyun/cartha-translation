  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִ֣ישׁ אִמּ֤/וֹ וְ/אָבִי/ו֙ תִּירָ֔אוּ וְ/אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/003.yaml
  text: Each man shall fear his mother and his father[a], and you shall keep my Sabbaths[b]. I am Yahweh your God.
translation:
  language: hi
  text: तुममें से हर पुरुष[a] अपनी माता और अपने पिता का भय माने[b], और तुम मेरे सब्तों का पालन करो। मैं याहवे, तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुममें से हर व्यक्ति।” इब्रानी में “हर पुरुष” के लिए पुल्लिंग एकवचन रूप का प्रयोग पूरी समुदाय के प्रत्येक सदस्य के लिए वितरणात्मक अर्थ में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या, “आदर करे” अथवा “श्रद्धा रखे।” इब्रानी क्रिया यहाँ श्रद्धायुक्त भय या विस्मय का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: तुममें से हर पुरुष
  rationale: इब्रानी पुल्लिंग एकवचन का प्रयोग पूरी समुदाय के प्रत्येक सदस्य के लिए वितरणात्मक रूप में करता है। यह अनुवाद उस रूप को बनाए रखते हुए हिन्दी में संबोधन को स्पष्ट करता है।
- source_word: אִמּוֹ וְאָבִיו
  choice: अपनी माता और अपने पिता
  rationale: मूल पाठ में माता का उल्लेख पिता से पहले है और दोनों संबंधवाचक संज्ञाएँ अलग-अलग दी गई हैं; उसी क्रम और विशिष्टता को रखा गया है।
- source_word: תִּירָאוּ
  choice: भय माने
  rationale: यह ירא के भय, श्रद्धा और विस्मय से जुड़े अर्थ-क्षेत्र को अपेक्षाकृत सीधे रूप में व्यक्त करता है; प्रसंग में यह श्रद्धायुक्त भय है, मात्र आतंक नहीं।
- source_word: שַׁבְּתֹתַי
  choice: मेरे सब्तों
  rationale: इब्रानी में बहुवचन और प्रथम पुरुष संबंध दोनों स्पष्ट हैं; ‘मेरे सब्तों’ दोनों को सुरक्षित रखता है।
- source_word: תִּשְׁמֹרוּ
  choice: पालन करो
  rationale: सब्तों के संदर्भ में שׁמר का आशय सावधानी से मानना और पालन करना है; आधुनिक हिन्दी में ‘पालन करो’ स्वाभाविक और स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: इस वाचागत सूत्र में शब्द का संदर्भ एकवचन में इस्राएल के परमेश्वर से है, जबकि प्रत्यय बहुवचन समुदाय को संबोधित करता है।
theological_decisions:
- issue: माता-पिता के प्रति आज्ञा की भावात्मक शक्ति
  choice: भय माने
  alternative: आदर करे / श्रद्धा रखे
  rationale: मूल क्रिया वास्तविक भय और श्रद्धापूर्ण आदर दोनों का अर्थ दे सकती है। मुख्य पाठ अधिक सीधा और प्रबल शब्द रखता है, जबकि पादटिप्पणी प्रसंगगत अर्थ स्पष्ट करती है।
- issue: आरंभिक वितरणात्मक पुल्लिंग एकवचन
  choice: तुममें से हर पुरुष
  alternative: तुममें से हर व्यक्ति / हर कोई
  rationale: मूल का אִישׁ व्याकरणिक रूप से पुल्लिंग एकवचन है, पर आज्ञा समुदाय में प्रत्येक सदस्य पर वितरणात्मक ढंग से लागू होती है। मुख्य पाठ स्रोत-रूप को बनाए रखता है और पादटिप्पणी उसके व्यापक सामुदायिक प्रयोग को बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘माता’ को ‘पिता’ से पहले रखने, ‘सब्तों’ के बहुवचन और एकवचन से बहुवचन संबोधन में हुए मूल बदलाव को सुरक्षित रखा गया है।
