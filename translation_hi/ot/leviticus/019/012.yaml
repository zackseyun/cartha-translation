source:
  edition: WLC
  text: וְ/לֹֽא תִשָּׁבְע֥וּ בִ/שְׁמִ֖/י לַ/שָּׁ֑קֶר וְ/חִלַּלְתָּ֛ אֶת שֵׁ֥ם אֱלֹהֶ֖י/ךָ אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/012.yaml
  text: You shall not swear falsely by my name and so profane the name of your God[a]. I am Yahweh.
translation:
  language: hi
  text: तुम मेरे नाम की झूठी शपथ न खाना, और इस प्रकार अपने परमेश्वर के नाम को अपवित्र न करना। मैं याहवे हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִשָּׁבְעוּ
  choice: शपथ ... न खाना
  rationale: निफ़अल रूप यहाँ शपथ लेने को व्यक्त करता है। आधुनिक मानक हिन्दी में ‘शपथ खाना’ सीधा और स्वाभाविक निषेध है।
- source_word: בִשְׁמִי
  choice: मेरे नाम की
  rationale: शपथ के प्रसंग में ב साधन या आधार बताता है; हिन्दी में ‘नाम की शपथ’ स्वाभाविक रूप से ‘नाम के द्वारा/नाम पर शपथ’ का अर्थ देता है।
- source_word: לַשָּׁקֶר
  choice: झूठ के लिए
  rationale: यह ל उपसर्ग और שׁקר का अपेक्षाकृत औपचारिक रूपान्तरण है और मूल की सम्भव अस्पष्टता बचाता है—झूठी शपथ अथवा झूठ को पुष्ट करने के लिए शपथ। अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְחִלַּלְתָּ
  choice: और इस प्रकार ... अपवित्र न करना
  rationale: पिएल क्रिया חלל का अर्थ अपवित्र करना है। हिन्दी वाक्य-विन्यास में निषेध को दूसरी समन्वित क्रिया तक पहुँचाया गया है; ‘इस प्रकार’ झूठी शपथ और परमेश्वर के नाम के अपवित्रीकरण का परिणामात्मक सम्बन्ध स्पष्ट करता है।
- source_word: שֵׁם
  choice: नाम
  rationale: ‘नाम’ को अक्षरशः रखा गया है, क्योंकि यह परमेश्वर की प्रकट पहचान और प्रतिष्ठा दोनों को सूचित करता है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर के
  rationale: यहाँ אֱלֹהִים एकवचन सन्दर्भ में इस्राएल के परमेश्वर को दर्शाता है; हिन्दी सम्बन्धवाचक रचना में ‘अपने परमेश्वर के नाम’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूपान्तरण
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए ‘प्रभु’ जैसी प्रतिस्थापन उपाधि नहीं अपनाई गई। हिन्दी के सामान्य पाठकों में पहचाना जाने वाला ‘यहोवा’ नामरूप चुना गया; ‘याहवे’ अधिक निकट विद्वत्तापरक लिप्यन्तरण है।
- issue: दूसरे उपवाक्य का सम्बन्ध
  choice: परिणामात्मक—‘और इस प्रकार’
  alternative: सरल समन्वय—‘और ... अपवित्र न करना’
  rationale: मूल ו सामान्य समन्वय भी हो सकता है, पर सन्दर्भ में झूठी शपथ परमेश्वर के नाम को अपवित्र करती है। ‘इस प्रकार’ इस निहित सम्बन्ध को स्पष्ट करता है, बिना अलग धार्मिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। कानूनी निषेध के लिए ‘न खाना/न करना’ का समानान्तर विन्यास अपनाया गया है। ‘झूठ के लिए’ मूल לַשָּׁקֶר की बनावट और अर्थगत विस्तार बचाता है; पादटिप्पणी अधिक स्वाभाविक हिन्दी देती है।
