  yaml_path: translation/ot/leviticus/019/010.yaml
  text: And you shall not strip your vineyard bare[a], nor shall you gather the fallen grapes of your vineyard; you shall leave them for the poor and for the sojourner[c][b]. I am Yahweh your God.
translation:
  language: hi
  text: तुम अपनी दाखबारी को पूरी तरह न बीनना[a], और अपनी दाखबारी में गिरे हुए अंगूरों को न बटोरना[b]। इन्हें गरीब और निवासी परदेशी के लिए छोड़ देना[c]। मैं याहवे, तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी दाखबारी से बची हुई दाखें न बीनना’; इब्रानी क्रिया मुख्य कटनी के बाद बेलों पर बचे फल लेने के लिए फिर से जाने को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी दाखबारी के छूटे हुए अंगूर’; इब्रानी शब्द कटनी के समय गिरे या पीछे छूटे अंगूरों को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘तुम्हारे बीच रहने वाला परदेशी’; इब्रानी शब्द इस्राएलियों के बीच रहने वाले गैर-देशज व्यक्ति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַרְמְךָ
  choice: अपनी दाखबारी
  rationale: כֶּרֶם अंगूर की खेती की जगह को दर्शाता है। ‘दाखबारी’ मानक, संक्षिप्त और कृषि-संदर्भ के अनुरूप है।
- source_word: תְעוֹלֵל
  choice: बची हुई दाखों को फिर से ... तोड़ना
  rationale: इस संदर्भ में क्रिया मुख्य कटनी के बाद बेलों पर बची दाखों को लेने के लिए दाखबारी में दोबारा जाने को दर्शाती है। यह अनुवाद क्रिया को स्पष्ट करता है, पर यह दावा नहीं करता कि हर बेल पूरी तरह खाली की गई थी।
- source_word: פֶרֶט
  choice: गिरे हुए अंगूरों
  rationale: פֶּרֶט कटनी के समय अलग होकर गिरे या पीछे छूटे फलों को दर्शाता है; दाखबारी के संदर्भ में ‘गिरे हुए अंगूर’ ठोस और स्वाभाविक है।
- source_word: תְלַקֵּט
  choice: बटोरना
  rationale: לקט जमीन पर बिखरी वस्तुओं को चुनकर इकट्ठा करने के अर्थ में है। ‘बटोरना’ गिरे अंगूरों के साथ सहज हिंदी प्रयोग है।
- source_word: לֶעָנִי
  choice: गरीब
  rationale: עָנִי यहां आर्थिक रूप से अभावग्रस्त व्यक्ति को दर्शाता है; ‘गरीब’ सीधा और सर्वसुलभ रूप है।
- source_word: וְלַגֵּר
  choice: तुम्हारे बीच रहने वाले परदेशी
  rationale: גֵּר केवल बाहर से आए किसी भी व्यक्ति के बजाय इस्राएल के बीच बसे गैर-देशज निवासी को दर्शाता है। यह विस्तृत रूप उस कानूनी-सामाजिक अर्थ को स्पष्ट करता है।
- source_word: תַּעֲזֹב אֹתָם
  choice: उन्हें ... छोड़ देना
  rationale: עזב यहां उपज को दूसरों के लिए वहीं छोड़ देने का आदेश देता है; ‘छोड़ देना’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का निजी वाचा-नाम יהוה है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय लिप्यंतरित करता है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: यह आज्ञा को आधार देने वाले वाचागत सूत्र का सीधा अनुवाद है। मूल में संबोधित समुदाय के लिए बहुवचन प्रत्यय है, जबकि हिंदी में ‘तुम्हारा’ सामूहिक संबोधन के साथ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में יהוה नाम प्रत्यक्ष रूप से आया है। ‘याहवे’ मूल के व्यक्तिगत वाचा-नाम को सुरक्षित रखता है और उसे उपाधि में नहीं बदलता।
- issue: גֵּר की सामाजिक पहचान
  choice: तुम्हारे बीच रहने वाला परदेशी
  alternative: विदेशी; प्रवासी
  rationale: यह शब्द इस्राएली समाज में रहने वाले गैर-देशज निवासी को सूचित करता है। चुना हुआ रूप न तो उसे सामान्य विदेशी तक विस्तृत करता है, न आधुनिक प्रशासनिक श्रेणी में सीमित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कृषि-संदर्भ के लिए ‘दाखबारी’, ‘दाख’ और ‘अंगूर’ का प्रयोग किया गया है। आदेशात्मक शैली में ‘न ... करना’ और ‘छोड़ देना’ मूल कानूनी स्वर को स्वाभाविक हिंदी में व्यक्त करते हैं।
