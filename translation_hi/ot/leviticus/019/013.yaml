  yaml_path: translation/ot/leviticus/019/013.yaml
  text: You shall not oppress your neighbor or rob him[a]. The wages of a hired worker shall not remain with you until morning.
translation:
  language: hi
  text: तुम अपने पड़ोसी का शोषण न करना और न उसे लूटना। मज़दूर की मज़दूरी तुम्हारे पास सुबह तक न पड़ी रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: अत्याचार करना
  rationale: यह क्रिया अधिकार या सामर्थ्य का दुरुपयोग करके किसी का हक दबाने, उसका शोषण करने या उसे सताने का व्यापक अर्थ रखती है। ‘अत्याचार करना’ इस व्यापक नैतिक बल को बनाए रखता है।
- source_word: רֵעֲךָ
  choice: अपने पड़ोसी
  rationale: व्यवस्था-संबंधी संदर्भ में यह शब्द समुदाय के दूसरे व्यक्ति को सूचित करता है। ‘पड़ोसी’ तोराह की प्रचलित शब्दावली से मेल खाता और सामान्य हिन्दी में स्पष्ट है।
- source_word: תִגְזֹל
  choice: उसे लूटना
  rationale: मूल क्रिया बलपूर्वक या अन्यायपूर्वक किसी वस्तु को छीन लेने का बोध देती है। ‘लूटना’ साधारण ‘चोरी करना’ की अपेक्षा इस प्रबल अर्थ को बेहतर व्यक्त करता है।
- source_word: תָלִין
  choice: न पड़ी रहे
  rationale: यह स्त्रीलिंग क्रिया ‘मज़दूरी’ को कर्ता मानकर उसके रात भर रोके रहने का निषेध करती है। ‘न पड़ी रहे’ हिन्दी में स्वाभाविक रहते हुए उसी व्याकरणिक संरचना को सुरक्षित रखता है।
- source_word: פְּעֻלַּת
  choice: मज़दूरी
  rationale: यहाँ काम के बदले मिलने वाला भुगतान अभिप्रेत है; अगले शब्द और भुगतान रोकने के निषेध के कारण ‘मज़दूरी’ सबसे स्पष्ट अर्थ है।
- source_word: שָׂכִיר
  choice: मज़दूर
  rationale: मूल शब्द मज़दूरी पर रखे गए कामगार को दर्शाता है। इस संदर्भ में ‘मज़दूर’ सहज और संक्षिप्त हिन्दी है।
- source_word: אִתְּךָ
  choice: तुम्हारे पास
  rationale: इससे सूचित होता है कि भुगतान मालिक के अधिकार या कब्ज़े में रोककर रखा गया है। ‘तुम्हारे पास’ मूल अभिव्यक्ति के निकट और स्वाभाविक है।
- source_word: עַד בֹּקֶר
  choice: सुबह तक
  rationale: यह भुगतान टालने की समय-सीमा को ठोस रूप से व्यक्त करता है और मूल के समय-सूचक वाक्यांश को बनाए रखता है।
