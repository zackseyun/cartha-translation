source:
  edition: WLC
  text: וְ֠/אִישׁ כִּֽי יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה שִׁכְבַת זֶ֗רַע וְ/הִ֤וא שִׁפְחָה֙ נֶחֱרֶ֣פֶת לְ/אִ֔ישׁ וְ/הָפְדֵּה֙ לֹ֣א נִפְדָּ֔תָה א֥וֹ חֻפְשָׁ֖ה לֹ֣א נִתַּן לָ֑/הּ בִּקֹּ֧רֶת תִּהְיֶ֛ה לֹ֥א יוּמְת֖וּ כִּי לֹ֥א חֻפָּֽשָׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/020.yaml
  text: If a man lies with a woman and has an emission of semen[a], and she is a servant woman designated for a man, but she has not been redeemed or given her freedom, there shall be an inquiry; they shall not be put to death[b], because she had not been freed.
translation:
  language: hi
  text: यदि कोई पुरुष किसी स्त्री के साथ सहवास करके वीर्यपात करे, और वह स्त्री दासी हो, जो किसी पुरुष के लिए ठहराई गई हो[a], पर न तो उसे मूल्य देकर छुड़ाया गया हो और न उसे स्वतंत्रता दी गई हो, तो इस मामले की जाँच की जाए[b]। उन दोनों को मृत्युदंड न दिया जाए, क्योंकि वह स्त्री स्वतंत्र नहीं की गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी पुरुष से मंगनी की गई” या “किसी पुरुष को वचन दी गई।” इब्रानी शब्द संभवतः बताता है कि दासी किसी पुरुष के लिए निर्धारित या उससे वचनबद्ध थी, यद्यपि उसकी कानूनी स्थिति पूर्णतः स्वतंत्र पत्नी जैसी नहीं थी।
    reason: lexical_alternative
  - marker: b
    text: “जाँच” के लिए प्रयुक्त इब्रानी शब्द दुर्लभ है और उसका अर्थ अनिश्चित है; इसका अर्थ “दंड” या “क्षतिपूर्ति” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: इब्रानी कानूनी शैली में यह एक पुरुष को सूचित करता है; ‘कोई पुरुष’ आधुनिक हिन्दी में स्वाभाविक शर्तसूचक आरंभ है।
- source_word: יִשְׁכַּב אֶת אִשָּׁה שִׁכְבַת זֶרַע
  choice: किसी स्त्री के साथ सहवास करके वीर्यपात करे
  rationale: यह यौन संबंध और वीर्यस्खलन, दोनों को व्यक्त करने वाले इब्रानी कानूनी मुहावरे की विशिष्टता बनाए रखता है।
- source_word: שִׁפְחָה
  choice: दासी
  rationale: यह शब्द स्त्री की बंधुआ कानूनी स्थिति को संक्षिप्त और प्रचलित हिन्दी में स्पष्ट करता है।
- source_word: נֶחֱרֶפֶת לְאִישׁ
  choice: किसी दूसरे पुरुष के लिए ठहराई गई
  rationale: दुर्लभ रूप का आशय संभवतः किसी पुरुष को सौंपी या वचनबद्ध की गई दासी है; ‘ठहराई गई’ पूर्ण वैधानिक सगाई का अर्थ अनावश्यक रूप से निश्चित नहीं करता। प्रसंग के कारण ‘दूसरे’ जोड़ा गया है ताकि संबंधों के पक्ष स्पष्ट रहें।
- source_word: וְהָפְדֵּה לֹא נִפְדָּתָה
  choice: न तो उसे मूल्य देकर छुड़ाया गया हो
  rationale: ‘मूल्य देकर छुड़ाना’ दासता से आर्थिक छुटकारे के अर्थ को सामान्य हिन्दी में स्पष्ट करता है और इब्रानी के बलयुक्त निषेध को ‘न तो’ संरचना में रखता है।
- source_word: חֻפְשָׁה לֹא נִתַּן לָהּ
  choice: न उसे स्वतंत्रता दी गई हो
  rationale: यह दासता से विधिक मुक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בִּקֹּרֶת
  choice: इस मामले की जाँच की जाए
  rationale: यह दुर्लभ और विवादित संज्ञा संभवतः आधिकारिक जाँच को सूचित करती है; अनिश्चित विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: לֹא יוּמְתוּ
  choice: उन दोनों को मृत्युदंड न दिया जाए
  rationale: बहुवचन क्रिया दोनों व्यक्तियों को समेटती है और न्यायिक संदर्भ में ‘मृत्युदंड’ अर्थ स्पष्ट करती है।
- source_word: כִּי לֹא חֻפָּשָׁה
  choice: क्योंकि वह स्त्री स्वतंत्र नहीं की गई थी
  rationale: यह कम दंड के दिए गए कारण को पहले कही गई दासता की स्थिति से स्पष्ट रूप से जोड़ता है।
theological_decisions:
- issue: נֶחֱרֶפֶת לְאִישׁ की कानूनी स्थिति
  choice: किसी दूसरे पुरुष के लिए ठहराई गई
  alternative: किसी पुरुष से मंगनी की गई / किसी पुरुष को वचन दी गई
  rationale: पद दासी की स्थिति को स्वतंत्र, विधिवत मंगनी की गई स्त्री के बराबर स्पष्टतः नहीं ठहराता। चुना गया रूप संबंध या नियोजन को बनाए रखता है, पर पूर्ण वैधानिक सगाई का निर्णय आरोपित नहीं करता।
- issue: בִּקֹּרֶת का अर्थ
  choice: इस मामले की जाँच की जाए
  alternative: दंड दिया जाए / क्षतिपूर्ति की जाए
  rationale: शब्द दुर्लभ और अर्थगत रूप से अनिश्चित है। मुख्य पाठ में आधिकारिक जाँच का संभावित अर्थ रखा गया है और अन्य प्रमुख संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी प्रसंग के अनुकूल रखी गई है। ‘दासी’, ‘मूल्य देकर छुड़ाया’ और ‘स्वतंत्रता’ सामाजिक-कानूनी स्थिति को स्पष्ट करते हैं। दुर्लभ इब्रानी पदों की अनिश्चितता पादटिप्पणियों में सुरक्षित रखी गई है; पादटिप्पणी-चिह्न संबंधित वाक्यांशों पर लगाए गए हैं।
