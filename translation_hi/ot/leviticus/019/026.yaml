source:
  edition: WLC
  text: לֹ֥א תֹאכְל֖וּ עַל הַ/דָּ֑ם לֹ֥א תְנַחֲשׁ֖וּ וְ/לֹ֥א תְעוֹנֵֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/026.yaml
  text: You shall not eat over the blood[b][a]. You shall not practice divination or interpret omens.
translation:
  language: hi
  text: तुम लहू के ऊपर कुछ मत खाना[a]। न भविष्य-कथन करो, न शकुनों का अर्थ लगाओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लहू सहित कुछ मत खाना।” इब्रानी पदबंध कठिन है; इसका संकेत ऐसे मांस को खाने की ओर हो सकता है जिसमें लहू हो, या लहू से जुड़े किसी अनुष्ठानिक भोज की ओर।
    reason: alternative_reading
  - marker: b
    text: या, “शुभ-अशुभ समय का विचार न करना” अथवा “भविष्य-कथन का अभ्यास न करना।” इस इब्रानी क्रिया का सटीक अर्थ अनिश्चित है; इसका अनुवाद “शकुन-विचार करना” भी किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכְלוּ
  choice: तुम ... न खाना
  rationale: निषेध के साथ अपूर्ण क्रिया कानूनी आज्ञा व्यक्त करती है। यह रूप आधुनिक हिन्दी में स्पष्ट है और विधान की गरिमा बनाए रखता है।
- source_word: עַל הַדָּם
  choice: लहू के ऊपर
  rationale: इब्रानी पदबंध कठिन और बहुअर्थी है। अपेक्षाकृत शाब्दिक अनुवाद उस अनिश्चितता को बनाए रखता है कि निषेध लहू सहित मांस खाने, लहू के पास भोजन करने या किसी रक्त-संबंधी अनुष्ठान से जुड़ा है।
- source_word: תְנַחֲשׁוּ
  choice: शकुनों से भविष्य जानने का प्रयत्न करना
  rationale: पिएल रूप शकुन अथवा संकेत के आधार पर गुप्त या भावी बात जानने की क्रिया बताता है। यह अनुवाद ‘टोना करना’ की अपेक्षा अधिक सटीक और सामान्य पाठक के लिए स्पष्ट है।
- source_word: תְעוֹנֵנוּ
  choice: शुभ-अशुभ समय का विचार करना
  rationale: इस दुर्लभ क्रिया का ठीक अर्थ अनिश्चित है; प्राचीन और पारंपरिक व्याख्याओं में इसका संबंध भविष्य-कथन, शकुन-विचार या समय को शुभ-अशुभ मानने से जोड़ा गया है। मुख्य पाठ में प्रचलित अर्थ लिया गया है और विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: עַל הַדָּם में निषिद्ध कर्म की सटीक प्रकृति
  choice: मुख्य पाठ में अपेक्षाकृत शाब्दिक ‘लहू के ऊपर’ बनाए रखना
  alternative: ‘लहू सहित’, ‘जब तक उसमें लहू हो’, या ‘लहू से जुड़े अनुष्ठानिक भोज में’
  rationale: मूल पदबंध का आशय विवादित है। किसी एक संभावित रक्त-संबंधी प्रथा को निश्चित ठहराने के बजाय अनुवाद मूल की अस्पष्टता बनाए रखता है।
- issue: תְעוֹנֵנוּ का अर्थ
  choice: शुभ-अशुभ समय का विचार करना
  alternative: भविष्य बताना या शकुन-विचार करना
  rationale: क्रिया दुर्लभ है और उसका सटीक आशय निश्चित नहीं। चुना हुआ अर्थ पारंपरिक समझ को स्पष्ट हिन्दी में व्यक्त करता है, जबकि निकटवर्ती विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और विधिक गरिमा वाली रखी गई है। ‘लहू’ लैव्यव्यवस्था के बलिदान-संबंधी प्रसंग में स्वाभाविक धार्मिक शब्द है। कठिन पहले पदबंध को जानबूझकर पूरी तरह व्याख्यायित नहीं किया गया; दूसरे निषेधों में अत्यधिक प्राचीन या सांप्रदायिक शब्दावली से बचा गया है।
