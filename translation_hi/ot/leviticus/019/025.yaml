id: LEV.19.25
reference: Leviticus 19:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/חֲמִישִׁ֗ת תֹּֽאכְלוּ֙ אֶת פִּרְי֔/וֹ לְ/הוֹסִ֥יף לָ/כֶ֖ם תְּבוּאָת֑/וֹ אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/025.yaml
  text: And in the fifth year you may eat its fruit, so that it may increase its produce for you. I am Yahweh your God.
translation:
  language: hi
  text: और पाँचवें वर्ष तुम उसका फल खा सकते हो, जिससे उसकी उपज तुम्हारे लिए बढ़े। मैं यहोवा, तुम्हारा परमेश्वर, हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַשָּׁנָה הַחֲמִישִׁת
  choice: और पाँचवें वर्ष
  rationale: संयोजक וּ और संबंधसूचक בַ को विधिक निर्देशों के क्रम में स्वाभाविक ढंग से व्यक्त करता है और पिछले वर्षों के नियम से संबंध बनाए रखता है।
- source_word: תֹּאכְלוּ
  choice: तुम ... खा सकते हो
  rationale: इस विधिक संदर्भ में अपूर्ण क्रिया पिछले निषेध के बाद अनुमति व्यक्त करती है; आधुनिक हिन्दी में यह रूप उस आशय को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אֶת־פִּרְיוֹ
  choice: उसका फल
  rationale: פְּרִי यहाँ पेड़ के फल को दर्शाता है; एकवचन पुल्लिंग प्रत्यय को संदर्भानुसार ‘उसका’ से व्यक्त किया गया है।
- source_word: לְהוֹסִיף לָכֶם תְּבוּאָתוֹ
  choice: जिससे उसकी उपज तुम्हारे लिए बढ़े
  rationale: לְ लगा infinitive उद्देश्य अथवा अपेक्षित परिणाम बता सकता है। ‘जिससे’ इस संबंध को सहज हिन्दी में रखता है, जबकि ‘तुम्हारे लिए’ לָכֶם को सुरक्षित रखता है।
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: मैं तुम्हारा परमेश्वर यहोवा हूँ
  rationale: वाचा-संबंधी आत्मपरिचय को गरिमापूर्ण हिन्दी में रखा गया है और יְהוָה को व्यक्तिगत नाम ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। हिन्दी में व्यापक रूप से पहचाने जाने वाले पारंपरिक लिप्यंतरण ‘यहोवा’ को अपनाया गया है; इसे पदवी ‘प्रभु’ से नहीं बदला गया।
- issue: לְהוֹסִיף का उद्देश्य या परिणाम
  choice: जिससे ... बढ़े
  alternative: ताकि ... बढ़े
  rationale: हिब्रू रचना उद्देश्य और अपेक्षित परिणाम के बीच कुछ खुलापन रखती है। ‘जिससे’ उस संबंध को व्यक्त करती है, बिना यह दावा किए कि फल खाना स्वयं जादुई या यांत्रिक रूप से उपज बढ़ाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, बहुवचन संबोधन ‘तुम’, और सरल किंतु गरिमापूर्ण विधिक शैली। ‘फल’ और ‘उपज’ का भेद मूल के פְּרִי तथा תְּבוּאָה के भेद को दर्शाता है।
