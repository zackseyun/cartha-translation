  naturalness: 'The verse is clear and modern. The final self-identification is understandable as drafted, but Hindi reads more naturally and solemnly when the divine name is set in apposition: “मैं यहोवा, तुम्हारा परमेश्वर, हूँ।”'
  terminology: “यहोवा” consistently renders the divine name, and “परमेश्वर” suitably renders אֱלֹהֵיכֶם. “फल” and “उपज” preserve the source distinction well.
