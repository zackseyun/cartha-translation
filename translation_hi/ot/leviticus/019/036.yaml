source:
  edition: WLC
  text: מֹ֧אזְנֵי צֶ֣דֶק אַבְנֵי צֶ֗דֶק אֵ֥יפַת צֶ֛דֶק וְ/הִ֥ין צֶ֖דֶק יִהְיֶ֣ה לָ/כֶ֑ם אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/036.yaml
  text: You shall have honest scales[a], honest weights, an honest ephah, and an honest hin. I am Yahweh your God[c][b], who brought you out of the land of Egypt.
translation:
  language: hi
  text: तुम्हारे पास सही तराज़ू[a], सही बाट, सही एपा[b] और सही हीन[c] होने चाहिए। मैं याहवे, तुम्हारा परमेश्वर हूँ, जो तुम्हें मिस्र देश से निकाल लाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्यायपूर्ण तराज़ू, न्यायपूर्ण बाट’; यहाँ चार बार आया इब्रानी शब्द צֶדֶק सामान्यतः ‘न्याय’ या ‘धार्मिकता’ का भाव रखता है और इस पद में व्यापारिक मापों पर लागू हुआ है।
    reason: lexical_alternative
  - marker: b
    text: एपा सूखी वस्तुओं को मापने की एक प्राचीन इकाई थी।
    reason: cultural_note
  - marker: c
    text: हीन तरल पदार्थों को मापने की एक प्राचीन इकाई थी।
    reason: cultural_note
lexical_decisions:
- source_word: מֹאזְנֵי צֶדֶק
  choice: सही तराज़ू
  rationale: מֹאזְנַיִם व्यापार में तौलने के तराज़ू को और צֶדֶק यहाँ न्यायसंगत तथा बेईमानी-रहित माप को दर्शाता है। ‘सही तराज़ू’ आधुनिक हिन्दी में स्वाभाविक है और शुद्धता तथा नैतिक ईमानदारी—दोनों का संकेत देता है।
- source_word: אַבְנֵי צֶדֶק
  choice: सही बाट
  rationale: אַבְנֵי का शाब्दिक अर्थ ‘पत्थर’ है, पर यहाँ उससे आशय तौलने के लिए प्रयुक्त बाटों से है। ‘बाट’ इस सांस्कृतिक वस्तु को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: אֵיפַת צֶדֶק
  choice: सही एपा
  rationale: אֵיפָה सूखी वस्तुओं के लिए प्राचीन माप था। अनुमानित आधुनिक इकाई देने के बजाय ‘एपा’ को लिप्यंतरित किया गया है, और צֶדֶק की पुनरावृत्ति ‘सही’ से बनाए रखी गई है।
- source_word: וְהִין צֶדֶק
  choice: और सही हीन
  rationale: הִין तरल पदार्थों का प्राचीन माप था। ‘हीन’ स्रोत-संस्कृति की विशिष्ट इकाई को सुरक्षित रखता है; ‘सही’ व्यापारिक न्याय की माँग को व्यक्त करता है।
- source_word: יִהְיֶה לָכֶם
  choice: तुम्हारे पास ... हों
  rationale: इसका शाब्दिक भाव ‘तुम्हारे लिए हों’ है। हिन्दी में ‘तुम्हारे पास ... हों’ अधिकार और अनिवार्य मानक, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वत्तापूर्ण उच्चारण ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: वाचा-सूत्र में यह बहुवचन संबोधित समुदाय के संबंध में एकवचन परमेश्वर को दर्शाता है।
- source_word: הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: जो तुम्हें मिस्र देश से निकाल लाया
  rationale: यह निर्गमन का परिचित वाचा-सूत्र है। यह अनुवाद causative क्रिया और मिस्र से बाहर लाने की ऐतिहासिक बात को सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: व्यापारिक व्यवस्था में चार बार आए צֶדֶק का अनुवाद
  choice: सही
  alternative: न्यायपूर्ण; खरा; ईमानदार
  rationale: צֶדֶק का व्यापक अर्थ न्याय और धार्मिकता है, पर तराज़ू, बाट और मापों के साथ यह सही तथा बेईमानी-रहित मानक को बताता है। ‘सही’ चारों स्थानों पर स्वाभाविक पुनरावृत्ति बनाए रखता है; व्यापक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- issue: प्राचीन माप-इकाइयों का निरूपण
  choice: एपा और हीन को लिप्यंतरित रखना
  alternative: सूखी वस्तुओं का माप और तरल पदार्थों का माप; आधुनिक अनुमानित मात्राएँ
  rationale: विशिष्ट प्राचीन इकाइयों को सामान्य या अनुमानित आधुनिक मात्राओं में बदलने से अनावश्यक सटीकता या सांस्कृतिक सूचना की हानि हो सकती है। पादटिप्पणियाँ उनका प्रकार स्पष्ट करती हैं।
- issue: יְהוָה का निरूपण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना पारदर्शी ढंग से प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सही’ की चार बार पुनरावृत्ति मूल इब्रानी की लय और एक ही नैतिक मानक पर उसके बल को बनाए रखती है। ‘एपा’ और ‘हीन’ के साथ लगे पादटिप्पणी-चिह्न मुख्य पाठ में स्पष्ट रूप से दिए गए हैं।
