base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/004.yaml
  text: Do not turn to idols[a], and do not make cast-metal gods for yourselves[b]. I am Yahweh your God.
translation:
  language: hi
  text: मूर्तियों[a] की ओर मत फिरो, और अपने लिए धातु से ढाले हुए देवता[b] मत बनाओ। मैं याहवे, तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निकम्मी मूर्तियाँ”; ‘मूर्तियों’ के लिए प्रयुक्त इब्रानी शब्द में तिरस्कार का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “ढले हुए देवता” अथवा “धातु की मूर्तियाँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְנוּ
  choice: की ओर मत फिरो
  rationale: פנה के मूल अर्थ ‘मुड़ना/फिरना’ को बनाए रखता है और ध्यान, निष्ठा या उपासना में उनकी ओर उन्मुख होने की व्यापकता को केवल ‘पूजा करना’ तक सीमित नहीं करता।
- source_word: אֱלִילִים
  choice: मूरतों
  rationale: यह आधुनिक पाठक के लिए उपासना हेतु बनाई गई प्रतिमाओं का स्वाभाविक और स्पष्ट संकेत है; इब्रानी शब्द में निहित संभावित तिरस्कारपूर्ण अर्थ को पादटिप्पणी में रखा गया है।
- source_word: אֱלֹהֵי מַסֵּכָה
  choice: ढली हुई धातु के देवता
  rationale: यह पदबंध धातु ढालकर बनाए गए देवताओं/प्रतिरूपों को दर्शाता है। अनुवाद אֱלֹהֵי के बहुवचन ‘देवता’ और מַסֵּכָה की निर्माण-विधि दोनों को सुरक्षित रखता है।
- source_word: תַעֲשׂוּ לָכֶם
  choice: अपने लिए ... मत बनाओ
  rationale: לָכֶם के लाभार्थक भाव—अपने उपयोग या अधिकार के लिए बनाना—को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: रूपात्मक बहुवचन होने पर भी वाचा-सूत्र में यह इस्राएल के एक परमेश्वर का एकवचन बोध कराता है; ‘परमेश्वर’ हिन्दी में यहाँ स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: मूरतों की ओर फिरने में उपासना को स्पष्ट करना या न करना
  choice: मूरतों की ओर मत फिरो
  alternative: मूरतों की पूजा मत करो
  rationale: פנה स्वयं केवल ‘पूजा करना’ नहीं कहता, बल्कि उनकी ओर उन्मुख होने का व्यापक निषेध देता है। इसलिए मूल की अर्थगत व्यापकता और तनाव को बनाए रखा गया है।
- issue: אֱלֹהֵי מַסֵּכָה में देवताओं और प्रतिमाओं का संबंध
  choice: ढली हुई धातु के देवता
  alternative: धातु की ढली हुई मूरतें
  rationale: मुख्य पाठ में אֱלֹהֵי के स्पष्ट बहुवचन ‘देवता’ को सुरक्षित रखा गया है, जबकि पादटिप्पणी प्रतिमा-संबंधी वैकल्पिक अभिव्यक्ति बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त निषेधात्मक शैली और गरिमापूर्ण वाचा-सूत्र। ‘मत फिरो’ तथा ‘मत बनाओ’ सामान्य पाठकों के लिए सहज हैं। ‘याहवे’ को दिव्य व्यक्तिगत नाम के रूप में रखा गया है।
