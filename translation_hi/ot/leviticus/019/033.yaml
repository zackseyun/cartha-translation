  text: When a foreigner resides with you in your land[b][a], you shall not mistreat him.
translation:
  language: hi
  text: जब कोई परदेशी[a] तुम्हारे साथ तुम्हारे देश में रहता हो, तो उसके साथ दुर्व्यवहार[b] न करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परदेशी’ से आशय किसी अनजान यात्री से नहीं, बल्कि इस्राएलियों के बीच रहने वाले गैर-स्थानीय निवासी से है।
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद ‘न सताना’, ‘उस पर अत्याचार न करना’ या ‘उसके साथ अन्याय न करना’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: जब
  rationale: यह कानूनी प्रसंग में संभावित परिस्थिति प्रस्तुत करता है। ‘जब’ स्वाभाविक हिन्दी है और ऐसी स्थिति की वास्तविक संभावना को व्यक्त करता है।
- source_word: יָגוּר
  choice: रहने लगे
  rationale: גור यहाँ किसी गैर-स्थानीय व्यक्ति के निवासी के रूप में रहने को दर्शाता है; यह चयन केवल थोड़े समय के लिए ठहरने का भाव नहीं देता।
- source_word: אִתְּךָ
  choice: तुम्हारे साथ
  rationale: इब्रानी एकवचन संबोधन का सीधा और स्वाभाविक रूप है।
- source_word: גֵּר
  choice: परदेशी
  rationale: यह इस्राएल के बीच रहने वाले गैर-स्थानीय निवासी को दर्शाता है। ‘परदेशी’ सामान्य पाठक के लिए सुबोध है, जबकि निवास का स्थायी पहलू क्रिया और पादटिप्पणी से स्पष्ट होता है।
- source_word: בְּאַרְצְכֶם
  choice: तुम्हारे देश में
  rationale: अर्थ समुदाय की भूमि अथवा देश से है। ‘देश’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में भूभाग तथा सामाजिक क्षेत्र दोनों को व्यक्त करता है।
- source_word: לֹא תוֹנוּ
  choice: दुर्व्यवहार न करना
  rationale: ינה के हिफ़ील रूप में किसी को सताने, दबाने या उसके साथ अन्याय करने का व्यापक भाव है। ‘दुर्व्यवहार’ सहज हिन्दी में इस व्यापकता को बनाए रखता है।
- source_word: אֹתוֹ
  choice: उसके साथ
  rationale: पुल्लिंग एकवचन सर्वनाम גֵּר की ओर लौटता है; हिन्दी में ‘उसके साथ’ चुनी हुई क्रिया के साथ स्वाभाविक है।
theological_decisions:
- issue: पवित्रता-संबंधी व्यवस्था में גֵּר का अर्थ
  choice: परदेशी
  alternative: प्रवासी निवासी; गैर-इस्राएली निवासी; अजनबी
  rationale: शब्द किसी अनजान राहगीर के बजाय इस्राएली समाज के बीच रहने वाले गैर-स्थानीय व्यक्ति को सूचित करता है। मुख्य पाठ को सहज रखते हुए यह विशेष अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- issue: ינה द्वारा निषिद्ध व्यवहार का दायरा
  choice: दुर्व्यवहार न करना
  alternative: न सताना; न दबाना; अन्याय न करना
  rationale: मूल क्रिया का अर्थ किसी एक प्रकार के उत्पीड़न तक सीमित नहीं है। व्यापक हिन्दी पद मूल की नैतिक और कानूनी गंभीरता बनाए रखता है, और संभावित विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुम्हारे साथ’ मूल के एकवचन संबोधन को और आगे का वाक्य पूरे समुदाय पर लागू निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
