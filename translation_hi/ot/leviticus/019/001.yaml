  yaml_path: translation/ot/leviticus/019/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: याहवे ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: कहा
  rationale: यह क्रिया यहाँ परमेश्वर के संबोधन की नई वाणी-घटना आरम्भ करती है। हिन्दी में अगले पद से जुड़ने वाले इस सूत्र के लिए ‘कहा’ स्वाभाविक और सटीक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: אֶל
  choice: से
  rationale: ‘कहना’ क्रिया के साथ आधुनिक हिन्दी में संबोधित व्यक्ति को ‘से’ द्वारा व्यक्त करना स्वाभाविक है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: מֹשֶׁה का हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप ‘मूसा’ है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: इब्रानी वाणी-परिचय सूत्र में לֵאמֹר आगामी प्रत्यक्ष कथन का संकेत देता है। हिन्दी में ‘यह कहते हुए कहा’ अनावश्यक पुनरुक्ति होगी; इसलिए पूरे सूत्र को स्वाभाविक रूप से ‘से कहा’ किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम יהוה है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत लिप्यंतरण है और मूल में उपस्थित नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी है। पद अगले वचन में आने वाले प्रत्यक्ष कथन की भूमिका है, इसलिए अंत में अल्पविराम रखा गया है।
