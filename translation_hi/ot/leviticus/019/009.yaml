  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण विधिक शैली रखी गई है। बहुवचन संबोधन ‘तुम’ के बाद खेत और फसल के लिए इब्रानी में एकवचन रूप आते हैं; हिन्दी में इसे सामूहिक नियम के स्वाभाविक ढंग से बनाए रखा गया है।
