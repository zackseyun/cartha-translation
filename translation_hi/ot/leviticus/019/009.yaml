source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶם֙ אֶת קְצִ֣יר אַרְצְ/כֶ֔ם לֹ֧א תְכַלֶּ֛ה פְּאַ֥ת שָׂדְ/ךָ֖ לִ/קְצֹ֑ר וְ/לֶ֥קֶט קְצִֽירְ/ךָ֖ לֹ֥א תְלַקֵּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/009.yaml
  text: When you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest.
translation:
  language: hi
  text: जब तुम अपनी भूमि की फसल काटो, तब अपने खेत के किनारे को पूरी तरह न काटना,[a] और अपनी फसल की गिरी हुई बालियाँ न बटोरना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने खेत के कोने को पूरी तरह न काटना।” इब्रानी शब्द का अर्थ किनारा, छोर या कोना हो सकता है; यहाँ खेत का वह बाहरी भाग अभिप्रेत है जिसे बिना काटे छोड़ना था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם
  choice: जब तुम ... काटो
  rationale: בְּ के साथ infinitive construct यहाँ समयसूचक परिस्थिति व्यक्त करता है; ‘जब तुम ... काटो’ स्वाभाविक हिन्दी में विधिक प्रसंग को स्पष्ट रखता है।
- source_word: קְצִיר אַרְצְכֶם
  choice: अपनी भूमि की फसल
  rationale: קְצִיר यहाँ कृषि-उपज/फसल को और אֶרֶץ खेती की भूमि को सूचित करता है; यह राजनीतिक अर्थ में ‘देश’ नहीं है।
- source_word: לֹא תְכַלֶּה ... לִקְצֹר
  choice: पूरी तरह न काटना
  rationale: Piel תְכַלֶּה ‘समाप्त कर देना/पूरा कर देना’ का भाव देता है और לִקְצֹר काटने की क्रिया स्पष्ट करता है; संयुक्त हिन्दी पदबंध खेत को पूरा साफ काट लेने की मनाही व्यक्त करता है।
- source_word: פְּאַת שָׂדְךָ
  choice: अपने खेत के किनारे
  rationale: פֵּאָה का अर्थ किनारा, छोर या कोना हो सकता है; यहाँ खेत का बाहरी भाग अभिप्रेत है। ‘किनारा’ मुख्य पाठ में स्वाभाविक है, जबकि ‘कोना’ पादटिप्पणी में रखा गया है।
- source_word: לֶקֶט קְצִירְךָ
  choice: अपनी फसल की गिरी हुई बालियाँ
  rationale: לֶקֶט कटाई के समय गिरे या पीछे छूटे हुए उस अन्न को दर्शाता है जिसे बाद में बटोरा जा सकता था। हिन्दी में ‘गिरी हुई बालियाँ’ कृषि-संदर्भ को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: לֹא תְלַקֵּט
  choice: न बटोरना
  rationale: לקט का अर्थ अलग-अलग पड़ी उपज को चुनकर इकट्ठा करना है; ‘बटोरना’ इस क्रिया का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
