  text: כְּ/אֶזְרָ֣ח מִ/כֶּם֩ יִהְיֶ֨ה לָ/כֶ֜ם הַ/גֵּ֣ר הַ/גָּ֣ר אִתְּ/כֶ֗ם וְ/אָהַבְתָּ֥ ל/וֹ֙ כָּמ֔וֹ/ךָ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/034.yaml
  text: The sojourner who sojourns with you shall be to you like a native among you[a], and you shall love him as yourself, for you were sojourners in the land of Egypt. I am Yahweh your God.
translation:
  language: hi
  text: तुम्हारे बीच रहने वाला परदेशी तुम्हारे लिए तुम्हारे ही बीच के मूल निवासी के समान हो[a]। तुम उससे अपने ही समान प्रेम करना, क्योंकि तुम भी मिस्र देश में परदेशी थे। मैं याहवे, तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रवासी,” “निवासी विदेशी,” अथवा “अजनबी।” इब्रानी शब्द ऐसे गैर-मूल निवासी को दर्शाता है जो इस्राएलियों के बीच रहता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּאֶזְרָח מִכֶּם
  choice: तुम्हारे बीच के मूल निवासी के समान
  rationale: אֶזְרָח समुदाय के देशज या मूल निवासी को दर्शाता है; כְּ की तुलना को ‘के समान’ से स्पष्ट रखा गया है।
- source_word: הַגֵּר הַגָּר אִתְּכֶם
  choice: तुम्हारे बीच रहनेवाला परदेशी
  rationale: גֵּר यहाँ केवल राहगीर नहीं, बल्कि इस्राएल के बीच निवास करनेवाला गैर-मूल निवासी है। सहज हिन्दी के लिए संज्ञा और कृदंत की इब्रानी पुनरुक्ति को स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: יִהְיֶה לָכֶם
  choice: तुम्हारे लिए ... हो
  rationale: यह बताता है कि समुदाय उस परदेशी को किस रूप में माने और उसके साथ कैसा व्यवहार करे; विधिक आदेश का भाव रखा गया है।
- source_word: וְאָהַבְתָּ לוֹ כָּמוֹךָ
  choice: तुम उससे अपने समान प्रेम रखना
  rationale: एकवचन संबोधन और आज्ञार्थक बल को रखा गया है तथा כָּמוֹךָ का लैव्यव्यवस्था 19:18 से शब्दगत संबंध बना रहता है।
- source_word: כִּי גֵרִים הֱיִיתֶם
  choice: क्योंकि तुम भी ... परदेशी थे
  rationale: उसी हिन्दी शब्द की पुनरावृत्ति से वर्तमान निवासी परदेशी और मिस्र में इस्राएल के ऐतिहासिक अनुभव का संबंध सुरक्षित रहता है।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: इब्रानी के ‘मिस्र की भूमि’ का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: वाचा-सूत्र का सीधा और स्वाभाविक हिन्दी अनुवाद।
theological_decisions:
- issue: विधिक-सामाजिक संदर्भ में גֵּר का अनुवाद
  choice: परदेशी
  alternative: प्रवासी; निवासी विदेशी; अजनबी
  rationale: यह शब्द इस्राएल के बीच रहनेवाले गैर-मूल निवासी को दर्शाता है। ‘परदेशी’ सामान्य हिन्दी में समझने योग्य है और आधुनिक प्रशासनिक आप्रवासन-श्रेणियाँ आरोपित नहीं करता; अर्थ-सीमा पादटिप्पणी में स्पष्ट की गई है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; इसलिए उसे किसी उपाधि से प्रतिस्थापित किए बिना लिप्यंतरित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण। ‘तुम’ मूल के सामूहिक संबोधन और एकवचन आज्ञा के हिन्दी प्रयोग के अनुकूल है। ‘रहनेवाला परदेशी’ सहजता को प्राथमिकता देता है, जबकि पादटिप्पणी विधिक-सामाजिक अर्थ स्पष्ट करती है।
