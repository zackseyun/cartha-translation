base_translation:
  language: en
  yaml_path: translation/ot/leviticus/019/018.yaml
  text: You shall not take vengeance or bear a grudge against the sons of your people[a], but you shall love your neighbor as yourself; I am Yahweh.
translation:
  language: hi
  text: तुम अपने लोगों[a] के विरुद्ध बदला न लेना और न उनके प्रति बैर बनाए रखना, बल्कि अपने पड़ोसी से अपने समान प्रेम करना। मैं यहोवा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने ही लोगों के विरुद्ध।’ शाब्दिक रूप से, ‘अपने लोगों के पुत्रों के विरुद्ध।’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקֹּם
  choice: बदला न लेना
  rationale: נקם का अर्थ प्रतिशोध लेना या बदला चुकाना है। आधुनिक हिन्दी में ‘बदला लेना’ सक्रिय प्रतिशोध के भाव को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: תִטֹּר
  choice: बैर बनाए न रखना
  rationale: נטר यहाँ क्रोध या वैमनस्य को मन में कायम रखने का बोध देता है। ‘बैर बनाए रखना’ इसकी निरंतरता और संबंधपरक कटुता दोनों को व्यक्त करता है।
- source_word: בְּנֵי עַמֶּךָ
  choice: अपने लोगों
  rationale: शाब्दिक रूप ‘तुम्हारे लोगों के पुत्र’ है, पर यहाँ वाक्यांश अपने समुदाय के सदस्यों को सामूहिक रूप से सूचित करता है। ‘अपने लोगों’ स्वाभाविक हिन्दी है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וְאָהַבְתָּ
  choice: प्रेम रखना
  rationale: कानूनी संदर्भ में वाव + पूर्ण क्रिया का आदेशात्मक बल है। ‘प्रेम रखना’ निषेधों के समानांतर आज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְרֵעֲךָ
  choice: अपने पड़ोसी से
  rationale: רֵעַ का अर्थ साथी, सहचर या निकटवर्ती व्यक्ति हो सकता है। इस नैतिक-कानूनी संदर्भ में ‘पड़ोसी’ स्थापित और उपयुक्त हिन्दी पर्याय है, जबकि तत्काल संदर्भ में वह समुदाय के सह-सदस्य को सूचित करता है।
- source_word: כָּמוֹךָ
  choice: अपने समान
  rationale: तुलनात्मक पद का सीधा अर्थ ‘अपने जैसा/अपने समान’ है। ‘अपने समान’ संक्षिप्त, स्वाभाविक और अर्थसटीक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में ‘यहोवा’ चार-अक्षरीय ईश्वरीय नाम का प्रचलित व्यक्तिनाम-रूप है और इसे किसी उपाधि से प्रतिस्थापित नहीं करता।
theological_decisions:
- issue: आज्ञा के संबोधित संबंधों का दायरा
  choice: בְּנֵי עַמֶּךָ को ‘अपने लोगों’ और רֵעַ को ‘पड़ोसी’ रूप में अलग-अलग बनाए रखा गया है।
  alternative: दोनों पदों को मुख्य पाठ में व्यापक सार्वभौमिक भाषा से समान कर देना।
  rationale: पद स्वयं ‘अपने लोगों’ और ‘पड़ोसी’ के लिए अलग अभिव्यक्तियाँ रखता है। अनुवाद इस पाठगत भेद को बचाता है और न तो बाद के विस्तार को, न किसी संकुचन को चुपचाप पाठ में जोड़ता है।
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में יְהוָה व्यक्तिनाम है। ‘यहोवा’ नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि से बदल देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, आज्ञात्मक और गरिमापूर्ण रखी गई है। एकवचन ‘तुम’ मूल के एकवचन संबोधन को दर्शाता है। निषेधों और सकारात्मक आज्ञा का संतुलन बनाए रखने के लिए ‘न लेना’, ‘न ... रखना’, और ‘बल्कि ... प्रेम रखना’ का प्रयोग किया गया है।
