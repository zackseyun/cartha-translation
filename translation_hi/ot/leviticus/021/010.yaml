id: LEV.21.10
reference: Leviticus 21:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/כֹּהֵן֩ הַ/גָּד֨וֹל מֵ/אֶחָ֜י/ו אֲֽשֶׁר יוּצַ֥ק עַל רֹאשׁ֣/וֹ שֶׁ֤מֶן הַ/מִּשְׁחָה֙ וּ/מִלֵּ֣א אֶת יָד֔/וֹ לִ/לְבֹּ֖שׁ אֶת הַ/בְּגָדִ֑ים אֶת רֹאשׁ/וֹ֙ לֹ֣א יִפְרָ֔ע וּ/בְגָדָ֖י/ו לֹ֥א יִפְרֹֽם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/010.yaml
  text: And the high priest, who is greater than his brothers[a], on whose head the anointing oil has been poured and whose hand has been filled to wear the garments, shall not let his head hang loose[b], nor shall he tear his garments.
translation:
  language: hi
  text: और वह महायाजक, जो अपने भाइयों से ऊँचा है, जिसके सिर पर अभिषेक का तेल उंडेला गया है और वस्त्र पहनने के लिए जिसका हाथ भरा गया है[a], वह अपने सिर के बाल बिखरे न छोड़े[b] और न अपने वस्त्र फाड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जिसका हाथ भरा गया है।” यह किसी को याजकीय सेवा में नियुक्त या प्रतिष्ठित करने का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वह शोक के प्रचलित चिह्न न अपनाए—जैसे बालों को अस्त-व्यस्त छोड़ना या वस्त्र फाड़ना।
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक
  rationale: यह पद सर्वोच्च याजकीय पदवी को सूचित करता है; ‘महायाजक’ हिन्दी में स्थापित और प्रसंगानुकूल शब्द है।
- source_word: מֵאֶחָיו
  choice: अपने भाइयों से ऊँचा
  rationale: यहाँ מִן तुलना और पदगत श्रेष्ठता व्यक्त करता है, केवल भाइयों के बीच से चुने जाने का भाव नहीं। ‘भाइयों’ से पुरुष याजकीय समुदाय का संकेत बना रहता है।
- source_word: יוּצַק עַל רֹאשׁוֹ שֶׁמֶן הַמִּשְׁחָה
  choice: जिसके सिर पर अभिषेक का तेल उंडेला गया है
  rationale: निष्क्रिय क्रिया और सिर पर तेल उंडेलने की ठोस अनुष्ठानिक छवि दोनों सुरक्षित रहती हैं।
- source_word: וּמִלֵּא אֶת יָדוֹ
  choice: जिसका हाथ भरा गया है
  rationale: इब्रानी याजकीय नियुक्ति के विशिष्ट मुहावरे को मुख्य पाठ में सुरक्षित रखा गया है; उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לִלְבֹּשׁ אֶת הַבְּגָדִים
  choice: वस्त्र पहनने के लिए
  rationale: निश्चित पद ‘वस्त्रों’ को बिना ‘याजकीय’ जोड़कर सीधा रखा गया है, क्योंकि प्रसंग उनका स्वरूप स्पष्ट करता है।
- source_word: אֶת רֹאשׁוֹ לֹא יִפְרָע
  choice: अपने सिर के बाल बिखरे न छोड़े
  rationale: प्रसंग में क्रिया शोक के चिह्न के रूप में बालों या सिर को अस्त-व्यस्त छोड़ने की ओर संकेत करती है; हिन्दी में यह अर्थ स्पष्ट और स्वाभाविक है।
- source_word: וּבְגָדָיו לֹא יִפְרֹם
  choice: न अपने वस्त्र फाड़े
  rationale: वस्त्र फाड़ने की प्रचलित शोक-क्रिया को सरल और सीधी हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: याजकीय नियुक्ति के मुहावरे מִלֵּא אֶת יָדוֹ का अनुवाद
  choice: मुख्य पाठ में ‘जिसका हाथ भरा गया है’ रखकर पादटिप्पणी में नियुक्ति का अर्थ बताना
  alternative: जिसे याजक नियुक्त किया गया है
  rationale: शाब्दिक अनुष्ठानिक अभिव्यक्ति पाठ की सांस्कृतिक और धर्मवैधानिक बनावट को सुरक्षित रखती है, जबकि पादटिप्पणी आधुनिक पाठक को उसका मुहावरेदार अर्थ देती है।
- issue: מֵאֶחָיו में पदगत तुलना
  choice: अपने भाइयों से ऊँचा
  alternative: अपने भाइयों में प्रधान / अपने भाइयों में से
  rationale: पूर्वसर्ग यहाँ तुलना का भाव देता है। ‘ऊँचा’ पद और प्रतिष्ठा को व्यक्त करता है, आयु या शारीरिक कद को नहीं।
- issue: יִפְרָע के शोक-संबंधी आशय को व्यक्त करना
  choice: अपने सिर के बाल बिखरे न छोड़े
  alternative: अपना सिर खुला न छोड़े
  rationale: शब्द के अनावरण और अस्त-व्यस्तता से जुड़े अर्थों में कुछ तनाव है; निकट प्रसंग और शोक-रीति अस्त-व्यस्त बालों का समर्थन करते हैं, और पादटिप्पणी व्यापक सांस्कृतिक आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘महायाजक’ और ‘अभिषेक’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं। इब्रानी नियुक्ति-मुहावरे को जानबूझकर मुख्य पाठ में औपचारिक रूप से सुरक्षित रखा गया है और पादटिप्पणी से स्पष्ट किया गया है।
