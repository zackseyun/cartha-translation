source:
  edition: WLC
  text: קְדֹשִׁ֤ים יִהְיוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/לֹ֣א יְחַלְּל֔וּ שֵׁ֖ם אֱלֹהֵי/הֶ֑ם כִּי֩ אֶת אִשֵּׁ֨י יְהוָ֜ה לֶ֧חֶם אֱלֹהֵי/הֶ֛ם הֵ֥ם מַקְרִיבִ֖ם וְ/הָ֥יוּ קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/006.yaml
  text: They shall be holy to their God and shall not profane the name of their God[a], because they present the food offerings of Yahweh, the food of their God; therefore they shall be holy.
translation:
  language: hi
  text: वे अपने परमेश्वर के लिए पवित्र रहें और अपने परमेश्वर के नाम को अपवित्र न करें, क्योंकि वे याहवे के अग्नि में चढ़ाए जाने वाले अर्पण[a]—अपने परमेश्वर का भोजन—चढ़ाते हैं; और वे पवित्र रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “याहवे के अग्नि-अर्पण, अपने परमेश्वर की रोटी।”
    reason: אִשֵּׁי יְהוָה के तकनीकी बलिदानी पद और לֶחֶם के शाब्दिक ‘रोटी’ को दर्शाता है।
lexical_decisions:
- source_word: קְדֹשִׁים יִהְיוּ לֵאלֹהֵיהֶם
  choice: वे अपने परमेश्वर के लिए पवित्र हों
  rationale: यह अनुवाद पवित्रता और परमेश्वर के लिए अलग किए जाने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; विधिक प्रसंग में ‘हों’ निर्देशात्मक बल बनाए रखता है।
- source_word: יְחַלְּלוּ
  choice: अपवित्र न करें
  rationale: पिएल रूप यहाँ किसी पवित्र वस्तु को साधारण या अशुद्ध ठहराने का भाव देता है। ‘अपवित्र करना’ लैव्यव्यवस्था के पवित्रता-विषयक विरोध को स्पष्ट रखता है।
- source_word: שֵׁם אֱלֹהֵיהֶם
  choice: अपने परमेश्वर के नाम
  rationale: यह इब्रानी संबंधवाचक संरचना का सीधा और गरिमापूर्ण हिन्दी रूप है।
- source_word: אִשֵּׁי יְהוָה
  choice: याहवे के अग्नि-अर्पण
  rationale: אִשֶּׁה एक तकनीकी बलिदानी पद है, जो आग के द्वारा चढ़ाए जाने वाले अर्पण को सूचित करता है। ‘अग्नि-अर्पण’ उसके उपासना-संबंधी स्वरूप को संक्षेप में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का निज नाम टेट्राग्रामटन है; उसका लिप्यंतरण उपाधि से बदलने के बजाय नाम को सुरक्षित रखता है।
- source_word: לֶחֶם אֱלֹהֵיהֶם
  choice: अपने परमेश्वर का भोजन
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, पर बलिदानी प्रसंग में इसका व्यापक अर्थ ‘भोजन’ है; इससे केवल पकी हुई रोटी का भ्रामक संकुचन नहीं होता।
- source_word: מַקְרִיבִם
  choice: चढ़ाते हैं
  rationale: קרב का हिफ़ील कृदंत किसी वस्तु को बलिदान के रूप में समीप लाने या प्रस्तुत करने का भाव देता है। हिन्दी के उपासना-संबंधी प्रसंग में ‘चढ़ाते हैं’ स्वाभाविक और सटीक है।
- source_word: וְהָיוּ קֹדֶשׁ
  choice: इसलिए वे पवित्र हों
  rationale: अंतिम वाक्यांश आरंभिक अपेक्षा को पुरोहितों की बलिदानी सेवा के आधार पर दोहराता है। ‘इसलिए’ पूर्ववर्ती כִּי से प्रकट तर्क-संबंध को सहज हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के निज नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में निज नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और पाठ में नाम तथा उपाधि के भेद को बनाए रखता है।
- issue: אִשֵּׁי יְהוָה לֶחֶם אֱלֹהֵיהֶם का बलिदानी रूपक
  choice: याहवे के अग्नि-अर्पण—अपने परमेश्वर का भोजन
  alternative: याहवे को चढ़ाए जाने वाले खाद्य-अर्पण, उनके परमेश्वर की रोटी
  rationale: अनुवाद बलिदानों को परमेश्वर का भौतिक पोषण बताने की दिशा में अर्थ को नहीं बढ़ाता, बल्कि मूल के उपासना-संबंधी ‘भोजन’ रूपक और अग्नि-अर्पण की तकनीकी भाषा दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पवित्र’, ‘अपवित्र’ और ‘अग्नि-अर्पण’ जैसे प्रमुख उपासना-संबंधी पद मूल के पवित्रता-विषयक तनाव को बनाए रखते हैं।
