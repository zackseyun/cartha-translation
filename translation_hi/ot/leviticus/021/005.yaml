source:
  edition: WLC
  text: לֹֽא יקרחה קָרְחָה֙ בְּ/רֹאשָׁ֔/ם וּ/פְאַ֥ת זְקָנָ֖/ם לֹ֣א יְגַלֵּ֑חוּ וּ/בִ֨/בְשָׂרָ֔/ם לֹ֥א יִשְׂרְט֖וּ שָׂרָֽטֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/005.yaml
  text: They shall not make a bald patch on their head[a], nor shave off the edge of their beard, nor make cuts in their flesh.
translation:
  language: hi
  text: वे अपने सिर पर गंजा स्थान न बनाएँ, न अपनी दाढ़ी का किनारा[a] मुँड़ाएँ, और न अपने शरीर पर चीरे लगाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी दाढ़ी का कोना’। इब्रानी शब्द का अर्थ किनारा, बाजू या कोना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יקרחה ... קָרְחָה
  choice: गंजा स्थान न बनाएँ
  rationale: क्रिया और संज्ञा का यह संयोजन जानबूझकर सिर पर बालरहित स्थान बनाने को व्यक्त करता है, न कि स्वाभाविक रूप से गंजा होने को। यह हिंदी में ठोस और सहज है।
- source_word: בְּרֹאשָׁם
  choice: अपने सिर पर
  rationale: इब्रानी में संज्ञा एकवचन और संबंधसूचक प्रत्यय बहुवचन है; हिंदी में ‘अपने सिर पर’ प्रत्येक व्यक्ति के लिए वितरणात्मक अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: פְאַת זְקָנָם
  choice: अपनी दाढ़ी का किनारा
  rationale: פאה का अर्थ किनारा, बाजू या कोना हो सकता है। ‘किनारा’ किसी विशेष प्रकार की कटाई को अनावश्यक रूप से निश्चित किए बिना मूल चित्र को बनाए रखता है।
- source_word: יְגַלֵּחוּ
  choice: मुँड़ाएँ
  rationale: यहाँ पिएल रूप बाल हटाने की क्रिया बताता है। ‘मुँड़ाएँ’ आधुनिक हिंदी में दाढ़ी के भाग को उस्तरे से हटाने का स्पष्ट और स्वाभाविक शब्द है।
- source_word: וּבִבְשָׂרָם
  choice: अपने शरीर पर
  rationale: בשר का मूल अर्थ ‘मांस’ है, पर शरीर को काटने के इस संदर्भ में ‘अपने शरीर पर’ स्वाभाविक हिंदी में वही शारीरिक आशय स्पष्ट करता है।
- source_word: יִשְׂרְטוּ שָׂרָטֶת
  choice: चीरे लगाएँ
  rationale: क्रिया-संज्ञा संयोजन शरीर को काटकर निशान या घाव बनाने को दर्शाता है। ‘चीरे लगाएँ’ सीधा, गरिमापूर्ण और गैर-चिकित्सकीय अनुवाद है।
theological_decisions:
- issue: निषेध का स्वरूप
  choice: केवल पद में उल्लिखित केश-सज्जा और शरीर काटने के ठोस निषेधों का अनुवाद किया गया है।
  alternative: समानांतर पदों के आधार पर मुख्य पाठ में ‘मृतकों के लिए’ या शोक-संबंधी उद्देश्य जोड़ना।
  rationale: इस पद में निषिद्ध क्रियाएँ दी गई हैं, पर उनका उद्देश्य स्पष्ट करने वाला वाक्यांश नहीं है। इसलिए समानांतर पदों की सूचना को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और ठोस रखी गई है। ‘गंजा स्थान’ जानबूझकर बनाए गए बालरहित हिस्से को स्पष्ट करता है; ‘चीरे लगाएँ’ शारीरिक काट-छाँट को सहज भाषा में व्यक्त करता है। पादटिप्पणी का चिह्न उसी अस्पष्ट इब्रानी पद ‘दाढ़ी का किनारा’ के बाद रखा गया है।
