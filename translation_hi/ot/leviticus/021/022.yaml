  text: לֶ֣חֶם אֱלֹהָ֔י/ו מִ/קָּדְשֵׁ֖י הַ/קֳּדָשִׁ֑ים וּ/מִן הַ/קֳּדָשִׁ֖ים יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/022.yaml
  text: He may eat the food of his God[a], from the most holy things and from the holy things.
translation:
  language: hi
  text: वह अपने परमेश्वर का भोजन[a] खा सकता है—परम-पवित्र वस्तुओं में से भी और पवित्र वस्तुओं में से भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने परमेश्वर की रोटी।” यहाँ “रोटी” याजक को मिलने वाले भोजन के पवित्र अंशों के लिए प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: भोजन
  rationale: शाब्दिक अर्थ ‘रोटी’ है, पर इस याजकीय और बलिदान-संबंधी प्रसंग में यह याजक को मिलने वाले पवित्र खाद्य अंशों के लिए व्यापक रूप से प्रयुक्त हुआ है। ‘भोजन’ हिन्दी में इस मुहावरेदार अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֱלֹהָיו
  choice: अपने परमेश्वर का
  rationale: एकवचन पुल्लिंग प्रत्यय संबंधित याजक की ओर संकेत करता है। हिन्दी में कर्ता से संबंध स्पष्ट करने के लिए ‘अपने’ स्वाभाविक है और इब्रानी के संबंधसूचक भाव को बनाए रखता है।
- source_word: מִקָּדְשֵׁי הַקֳּדָשִׁים
  choice: परम-पवित्र वस्तुओं में से
  rationale: यह रचना पवित्र वस्तुओं की सर्वोच्च श्रेणी बताने वाला मानक इब्रानी अतिशयोक्तिपरक पद है। ‘परम-पवित्र’ दोनों श्रेणियों का विधिक भेद स्पष्ट रखता है।
- source_word: וּמִן הַקֳּדָשִׁים
  choice: और पवित्र वस्तुओं में से भी
  rationale: यह पिछली परम-पवित्र श्रेणी के विपरीत सामान्य पवित्र अंशों की श्रेणी है। ‘पवित्र वस्तुएँ’ קדש से जुड़ी शब्दावली और श्रेणीगत अंतर को सुरक्षित रखता है।
- source_word: יֹאכֵל
  choice: खा सकता है
  rationale: 'इस विधिक संदर्भ में अपूर्ण क्रिया अनुमति व्यक्त करती है: शारीरिक दोष वाला याजक कुछ सेवाएँ नहीं कर सकता, फिर भी उसे पवित्र अंश खाने का अधिकार है। ‘खा सकता है’ इस अनुमति को साधारण आधुनिक हिन्दी में स्पष्ट करता है।'
theological_decisions:
- issue: याजकीय विधान में יֹאכֵל का विधिक बल
  choice: अनुमति—‘खा सकता है’
  alternative: साधारण भविष्य—‘खाएगा’; अथवा बाध्यता—‘खाए’/‘खाना होगा’
  rationale: आस-पास का संदर्भ निषिद्ध याजकीय कार्यों और बनी रहने वाली भोजन-संबंधी पात्रता में अंतर करता है। अनुमति वाला अनुवाद इस विरोध को बिना अनावश्यक बाध्यता जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘परम-पवित्र’ और ‘पवित्र’ के समान मूल वाले पदों से मूल पाठ का धार्मिक-विधिक श्रेणीभेद बनाए रखा गया है; ‘भी…भी’ दोनों श्रेणियों में खाने की अनुमति पर स्वाभाविक बल देता है।
