  text: וּ/מִן הַ/מִּקְדָּשׁ֙ לֹ֣א יֵצֵ֔א וְ/לֹ֣א יְחַלֵּ֔ל אֵ֖ת מִקְדַּ֣שׁ אֱלֹהָ֑י/ו כִּ֡י נֵ֠זֶר שֶׁ֣מֶן מִשְׁחַ֧ת אֱלֹהָ֛י/ו עָלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/012.yaml
  text: And he shall not go out from the sanctuary[a], nor shall he profane the sanctuary of his God, because the consecration of the anointing oil of his God is upon him. I am Yahweh.
translation:
  language: hi
  text: वह पवित्रस्थान से बाहर न निकले और अपने परमेश्वर के पवित्रस्थान को अपवित्र न करे, क्योंकि उसके परमेश्वर के अभिषेक के तेल से मिला पवित्र समर्पण[a] उस पर है। मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “उसके परमेश्वर के अभिषेक के तेल का मुकुट उस पर है।” इब्रानी शब्द का अर्थ “मुकुट” या “पवित्र समर्पण” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַמִּקְדָּשׁ
  choice: पवित्रस्थान से
  rationale: מִקְדָּשׁ पवित्र या अलग ठहराए गए स्थान, विशेषतः उपासना-स्थान, को दर्शाता है। याजकीय विधान के संदर्भ में ‘पवित्रस्थान’ स्वाभाविक और सटीक है।
- source_word: לֹא יֵצֵא
  choice: बाहर न निकले
  rationale: यָצָא का मूल अर्थ ‘बाहर निकलना’ है। निषेधात्मक अपूर्ण क्रिया को हिन्दी के विधिक निर्देश ‘न निकले’ से व्यक्त किया गया है।
- source_word: וְלֹא יְחַלֵּל
  choice: और ... अपवित्र न करे
  rationale: पिएल रूप में חלל किसी पवित्र वस्तु या स्थान की पवित्रता भंग करने को दर्शाता है। ‘अपवित्र न करे’ आधुनिक हिन्दी में स्पष्ट है और पवित्रता-विषयक विरोध को बनाए रखता है।
- source_word: אֵת מִקְדַּשׁ אֱלֹהָיו
  choice: अपने परमेश्वर के पवित्रस्थान को
  rationale: सम्बन्धसूचक प्रत्यय को ‘अपने परमेश्वर के’ से व्यक्त किया गया है और मूल पाठ की पुनरुक्ति को विधिक बल के लिए बनाए रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पिछले निषेध का कारण प्रस्तुत करता है; ‘क्योंकि’ उसके कारणसूचक अर्थ को साफ़ रखता है।
- source_word: נֵזֶר
  choice: समर्पण
  rationale: נֵזֶר का अर्थ ‘मुकुट/राजमुकुट’ भी हो सकता है और समर्पित या अभिषिक्त दशा भी। यहाँ अभिषेक के तेल और महायाजक की विशेष पवित्र स्थिति के संदर्भ में ‘समर्पण’ मुख्य आशय को सहज हिन्दी में व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: שֶׁמֶן מִשְׁחַת אֱלֹהָיו
  choice: उसके परमेश्वर के अभिषेक का तेल
  rationale: निर्माण-श्रृंखला के सभी घटकों को बनाए रखते हुए इसे हिन्दी की स्वाभाविक सम्बन्धसूचक रचना में प्रस्तुत किया गया है।
- source_word: עָלָיו
  choice: उस पर है
  rationale: यह वाक्यांश अभिषेक से चिह्नित निरंतर समर्पित स्थिति को व्यक्त करता है। ‘उस पर है’ मूल की स्थानसूचक छवि और गंभीर शैली दोनों बचाता है।
- source_word: אֲנִי יְהוָה
  choice: मैं याहवे हूँ
  rationale: व्यक्तिगत वाचा-नाम יהוה को लिप्यंतरित ‘याहवे’ से दिया गया है और लैव्यव्यवस्था में बार-बार आने वाले ईश्वरीय प्रमाणीकरण-सूत्र को पूर्ण रूप में रखा गया है।
theological_decisions:
- issue: महायाजक की स्थिति के संबंध में נֵזֶר का अर्थ
  choice: मुख्य पाठ में ‘समर्पण’
  alternative: ‘उसके परमेश्वर के अभिषेक के तेल का मुकुट उस पर है’
  rationale: संदर्भ में अभिषेक का तेल महायाजक की अलग ठहराई हुई पवित्र स्थिति का आधार है। ‘समर्पण’ उस धार्मिक आशय को बिना किसी भौतिक तेल-मुकुट का अनावश्यक संकेत दिए व्यक्त करता है। फिर भी נֵזֶר में वास्तविक ‘मुकुट/राजमुकुट’ का अर्थ और उससे जुड़ी छवि संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट विधिक शैली अपनाई गई है। ‘पवित्रस्थान,’ ‘अभिषेक’ और ‘अपवित्र’ जैसे प्रचलित बाइबलीय शब्द संदर्भ की याजकीय पवित्रता बनाए रखते हैं।
