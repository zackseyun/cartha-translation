id: LEV.21.7
reference: Leviticus 21:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִשָּׁ֨ה זֹנָ֤ה וַ/חֲלָלָה֙ לֹ֣א יִקָּ֔חוּ וְ/אִשָּׁ֛ה גְּרוּשָׁ֥ה מֵ/אִישָׁ֖/הּ לֹ֣א יִקָּ֑חוּ כִּֽי קָדֹ֥שׁ ה֖וּא לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/007.yaml
  text: They shall not take a woman who is a prostitute or defiled, and they shall not take a woman divorced from her husband, for he is holy to his God.
translation:
  language: hi
  text: वे किसी वेश्या या अपवित्र स्त्री से विवाह न करें, और न उस स्त्री से जिसे उसके पति ने तलाक दे दिया हो; क्योंकि वह अपने परमेश्वर के लिए पवित्र है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִקָּחוּ
  choice: विवाह करें
  rationale: शाब्दिक अर्थ ‘लें’ है, पर इस वैवाहिक प्रसंग में आधुनिक हिन्दी में ‘विवाह करें’ आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: זֹנָה
  choice: वेश्या
  rationale: यह संज्ञा यौन-व्यापार अथवा वेश्यावृत्ति में लगी स्त्री को दर्शाती है; ‘वेश्या’ इसका सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: חֲלָלָה
  choice: अपवित्र स्त्री
  rationale: मूल शब्द ऐसी स्त्री को सूचित करता है जिसका पवित्र अथवा वैधानिक दर्जा भंग माना गया हो। ‘अपवित्र स्त्री’ स्रोत की व्यापकता बनाए रखता है और किसी अधिक विशिष्ट स्थिति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: גְּרוּשָׁה מֵאִישָׁהּ
  choice: ऐसी स्त्री जिसका उसके पति ने त्यागपत्र देकर संबंध-विच्छेद कर दिया हो
  rationale: यह पद पति से अलग की गई अथवा तलाक दी गई स्त्री को दर्शाता है। यह अभिव्यक्ति प्राचीन वैवाहिक विच्छेद को स्पष्ट करती है और केवल आधुनिक न्यायालय-केंद्रित शब्दावली तक अर्थ को सीमित नहीं करती।
- source_word: קָדֹשׁ
  choice: पवित्र
  rationale: याजक का परमेश्वर के लिए अलग किया हुआ धार्मिक दर्जा व्यक्त करने वाला मानक और सटीक हिन्दी शब्द।
theological_decisions:
- issue: बहुवचन निषेध के बाद एकवचन कारण-वाक्य
  choice: ‘वे ... न करें’ के बाद ‘वह ... पवित्र है’
  alternative: दोनों खंडों को बहुवचन में करना
  rationale: इब्रानी पाठ पहले याजकों के लिए बहुवचन आज्ञा देता है, फिर प्रत्येक याजक पर लागू कारण को एकवचन में रखता है। इस संख्या-परिवर्तन को सुरक्षित रखा गया है।
- issue: חֲלָלָה की विशिष्ट पहचान
  choice: अपवित्र स्त्री
  alternative: कुलटा, यौन-दुराचारिणी, अथवा याजकीय विवाह के लिए अयोग्य स्त्री
  rationale: शब्द के सटीक सामाजिक-कानूनी दायरे पर अनिश्चितता है। व्यापक अनुवाद मूल की अस्पष्टता को बनाए रखता है और उसे केवल यौन अनैतिकता या किसी विशेष वंशगत श्रेणी तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘विवाह करें’ प्रसंगानुकूल स्वाभाविकता देता है, जबकि अंतिम खंड में मूल पाठ का एकवचन जानबूझकर सुरक्षित है।
