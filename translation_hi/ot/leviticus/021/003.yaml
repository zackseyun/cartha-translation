  yaml_path: translation/ot/leviticus/021/003.yaml
  text: and for his virgin sister who is near to him[a], who has not belonged to a man, he may make himself unclean.
translation:
  language: hi
  text: और अपनी उस कुँवारी बहन के लिए, जो उसके निकट है और जिसका किसी पुरुष से संबंध नहीं हुआ है,[a] वह अपने आपको अनुष्ठानिक रूप से अशुद्ध कर सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसका कोई पति नहीं हुआ,” अथवा “जो किसी पुरुष के साथ नहीं रही।” इब्रानी मुहावरा ऐसी बहन को दर्शाता है जो किसी पुरुष के साथ वैवाहिक या यौन संबंध में नहीं आई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲחֹתוֹ
  choice: और अपनी बहन के लिए
  rationale: संयोजक और संबंधसूचक उपसर्ग सूची में एक और अनुमत निकट संबंधी को जोड़ते हैं; स्वत्वसूचक प्रत्यय को स्वाभाविक हिन्दी में ‘अपनी’ से व्यक्त किया गया है।
- source_word: הַבְּתוּלָה
  choice: कुँवारी
  rationale: यह शब्द यहाँ बहन की यौन और वैवाहिक स्थिति बताता है; ‘कुँवारी’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: הַקְּרוֹבָה אֵלָיו
  choice: जो उसकी निकट संबंधी है
  rationale: इब्रानी में निकटता की भाषा पारिवारिक निकटता दर्शाती है। ‘निकट संबंधी’ इसे केवल भावनात्मक नज़दीकी समझे जाने से बचाता है।
- source_word: אֲשֶׁר לֹא הָיְתָה לְאִישׁ
  choice: जिसका किसी पुरुष से संबंध नहीं हुआ है
  rationale: इब्रानी मुहावरा किसी पुरुष के साथ वैवाहिक अथवा यौन संबंध में न आने को सूचित करता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और अर्थ-सीमा पादटिप्पणी में स्पष्ट की गई है।
- source_word: יִטַּמָּא
  choice: वह अपने आपको अशुद्ध कर सकता है
  rationale: इस याजकीय व्यवस्था में क्रिया शव के कारण अनुष्ठानिक अशुद्धता ग्रहण करने की अनुमति बताती है, नैतिक भ्रष्टता नहीं।
theological_decisions:
- issue: याजकीय व्यवस्था में अशुद्धता का स्वरूप
  choice: अनुष्ठानिक अशुद्धता के अर्थ में ‘अपने आपको अशुद्ध कर सकता है’
  alternative: ‘अपने आपको अपवित्र कर सकता है’
  rationale: संदर्भ मृत देह के संपर्क से उत्पन्न शुद्धता-अशुद्धता की स्थिति का है; इसे नैतिक पाप या चरित्रगत अपवित्रता के रूप में प्रस्तुत नहीं किया गया।
- issue: אֲשֶׁר לֹא הָיְתָה לְאִישׁ की अर्थ-सीमा
  choice: मुख्य पाठ में ‘किसी पुरुष से संबंध नहीं हुआ’ और पादटिप्पणी में वैवाहिक/यौन अर्थ की व्याख्या
  alternative: केवल ‘जिसका विवाह नहीं हुआ’
  rationale: मूल मुहावरा विवाह या पुरुष के साथ यौन-संघ दोनों की ओर संकेत कर सकता है; केवल विवाह कहना वास्तविक अस्पष्टता को संकरा कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कुँवारी’ और ‘निकट संबंधी’ कानूनी शर्तों को स्पष्ट करते हैं; ‘अशुद्ध’ लैव्यव्यवस्था की अनुष्ठानिक श्रेणी बनाए रखता है।
