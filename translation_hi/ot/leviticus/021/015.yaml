base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/015.yaml
  text: He shall not profane his offspring among his people[c][b][a], for I am Yahweh who sanctifies him.
translation:
  language: hi
  text: वह अपने लोगों के बीच अपनी सन्तान को अपवित्र न करे,[a][b] क्योंकि मैं याहवे हूँ, जो उसे पवित्र करता हूँ।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “अपनी सन्तान को अशुद्ध न करे” अथवा “अपनी सन्तान का अनादर न करे।” इब्रानी क्रिया का मूल भाव है: जो पवित्र होना चाहिए, उसे अपवित्र या साधारण बना देना।'
    reason: lexical_alternative
  - marker: b
    text: इस संदर्भ में आशय यह है कि विवाह-संबंधी इन प्रतिबंधों का उल्लंघन करके वह अपने लोगों के बीच अपनी सन्तान पर अपवित्रता लाएगा।
    reason: cultural_note
  - marker: c
    text: या “जो उसे पवित्र बनाता हूँ” अथवा “जो उसे पवित्र सेवा के लिए अलग ठहराता हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַלֵּל
  choice: अपवित्र करे
  rationale: 'यह חלל के पिएल रूप का याजकीय पवित्रता-संदर्भ में स्वाभाविक अर्थ है: जो पवित्र होना चाहिए उसे अपवित्र या साधारण ठहराना।'
- source_word: זַרְעוֹ
  choice: अपने वंश को
  rationale: זֶרַע का अर्थ बीज, संतान या वंश हो सकता है। विवाह और याजकीय वंशावली के इस संदर्भ में ‘वंश’ स्वाभाविक है और केवल एक संतान तक अर्थ को सीमित नहीं करता।
- source_word: בְּעַמָּיו
  choice: अपनी प्रजा के बीच
  rationale: בְּ के साथ עַמָּיו उस समुदाय को दर्शाता है जिसके बीच महायाजक का वंश स्थित है; ‘अपनी प्रजा के बीच’ सामाजिक और वाचा-संबंधी संदर्भ बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी में प्रचलित लिप्यंतरण है और उसके स्थान पर कोई उपाधि नहीं रखता।
- source_word: מְקַדְּשׁוֹ
  choice: जो उसे पवित्र करता हूँ
  rationale: קדשׁ का यह कृदंत रूप पवित्र करने या पवित्र उपयोग के लिए अलग ठहराने को व्यक्त करता है। यह चयन याजकीय पवित्रता की शब्दावली को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: निषेध का आशय और पवित्रता-वाक्य में सर्वनाम का संदर्भ
  choice: मुख्य पाठ में व्यापक इब्रानी कथन रखा गया है कि वह अपनी प्रजा के बीच अपने वंश को अपवित्र न करे, क्योंकि यहोवा उसे पवित्र करता है।
  alternative: इसे अधिक स्पष्ट रूप से इस प्रकार समझाया जा सकता है कि निषिद्ध विवाह करके महायाजक अपने वंश को याजकीय पद के अयोग्य न बनाए।
  rationale: निकटवर्ती संदर्भ महायाजक के विवाह-प्रतिबंधों का है, पर इब्रानी पद स्वयं याजकीय पद से अयोग्यता को स्पष्ट शब्दों में नहीं कहता। इसलिए उस व्याख्या को मुख्य पाठ में जोड़ने के बजाय टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अपवित्र’ और ‘पवित्र’ की समान मूल-धारणा से इब्रानी पद में उपस्थित पवित्रता-विरोध स्पष्ट रहता है; व्याख्यात्मक विस्तार मुख्य पाठ के बजाय पादटिप्पणी में दिया गया है।
