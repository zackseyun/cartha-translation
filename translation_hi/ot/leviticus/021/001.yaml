source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה אֱמֹ֥ר אֶל הַ/כֹּהֲנִ֖ים בְּנֵ֣י אַהֲרֹ֑ן וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לְ/נֶ֥פֶשׁ לֹֽא יִטַּמָּ֖א בְּ/עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/001.yaml
  text: 'And Yahweh said to Moses[a], “Speak to the priests, the sons of Aaron[b], and say to them: None shall make himself unclean for a dead person among his people,”'
translation:
  language: hi
  text: 'याहवे ने मूसा से कहा, “हारून के पुत्र याजकों से कहो और उनसे कहना: कोई भी याजक अपने लोगों में किसी मृत व्यक्ति[a] के कारण अपने आपको अशुद्ध[b] न करे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘किसी नेफेश के कारण’ है; शुद्धता-विधि के इस संदर्भ में ‘नेफेश’ मृत व्यक्ति या शव के लिए प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘अशुद्ध न हो जाए’ या ‘अपने आपको अपवित्र न करे’ भी हो सकता है। यहाँ इब्रानी शब्द मृतक के संपर्क से होने वाली आनुष्ठानिक अशुद्धता को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: אֱמֹר ... וְאָמַרְתָּ
  choice: कहो; उनसे कहना
  rationale: मूल में אמר क्रिया की पुनरावृत्ति है; हिंदी में स्वाभाविक रहते हुए दोनों निर्देशों को बनाए रखा गया है।
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: याजकों से, जो हारून के पुत्र हैं
  rationale: यह पदबंध याजकों की पहचान हारून के पुत्रों के रूप में करता है; संबंध को स्पष्ट करने के लिए व्याख्यात्मक उपवाक्य रखा गया है।
- source_word: לְנֶפֶשׁ
  choice: किसी मृत व्यक्ति के कारण
  rationale: शुद्धता-विधि के इस संदर्भ में נֶפֶשׁ मृत व्यक्ति अथवा शव के लिए प्रयुक्त मुहावरा है; ‘मृत व्यक्ति’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: יִטַּמָּא
  choice: अपने आपको अशुद्ध न करे
  rationale: क्रिया के आत्मवाचक भाव और मृतक-संपर्क से उत्पन्न आनुष्ठानिक अशुद्धता, दोनों को व्यक्त करता है।
- source_word: בְּעַמָּיו
  choice: अपने लोगों में
  rationale: मूल पदबंध का सीधा अर्थ ‘अपने लोगों के बीच’ है; अगले पद निकट संबंधियों से जुड़े अपवाद स्पष्ट करते हैं।
theological_decisions:
- issue: याजकीय व्यवस्था में अशुद्धता का स्वरूप
  choice: ‘अपने आपको अशुद्ध न करे’ के द्वारा आनुष्ठानिक अशुद्धता की भाषा रखी गई है।
  alternative: ‘अपने आपको अपवित्र न करे’
  rationale: संदर्भ मृतक के संपर्क से होने वाली विधिक/आनुष्ठानिक अशुद्धता का है, न कि सीधे नैतिक पाप का; इसलिए नैतिक अर्थ से अधिक भारित विकल्प से बचा गया है।
- issue: निषेध का कर्ता
  choice: ‘उनमें से कोई भी’
  alternative: ‘कोई याजक’
  rationale: मूल पाठ बहुवचन में याजकों को संबोधित करके एकवचन क्रिया का वितरणात्मक प्रयोग करता है; यह रूप प्रत्येक याजक पर निषेध लागू होने को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, सरल किंतु गरिमापूर्ण रखी गई है। ‘याजक’, ‘अशुद्ध’ और ‘याहवे’ जैसे बाइबिलीय पद संदर्भगत सटीकता के लिए बनाए गए हैं। मूल स्रोत में दिए गए अंग्रेज़ी फुटनोट-चिह्न विषय से असंगत स्थानों पर लगे थे; हिंदी पाठ में [a] को ‘मृत व्यक्ति’ और [b] को ‘अशुद्ध’ के साथ रखा गया है ताकि प्रत्येक टिप्पणी अपने वास्तविक शब्द से जुड़े।
