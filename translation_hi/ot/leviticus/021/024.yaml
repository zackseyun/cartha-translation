  yaml_path: translation/ot/leviticus/021/024.yaml
  text: So Moses spoke to Aaron and to his sons and to all the sons of Israel[a].
translation:
  language: hi
  text: इस प्रकार मूसा ने हारून, हारून के पुत्रों और इस्राएल के सभी लोगों से बात की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: इस प्रकार ... यह बात कही
  rationale: वाव-क्रमिक रूप कथानक को आगे बढ़ाता है और यहाँ खंड के समापन का भाव भी देता है। हिन्दी में ‘इस प्रकार ... यह बात कही’ उस निष्कर्षात्मक-सारांशात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל
  choice: से
  rationale: कहने की क्रिया के साथ हिन्दी में संबोधित व्यक्तियों के लिए ‘से’ स्वाभाविक है।
- source_word: בָּנָיו
  choice: उसके पुत्रों
  rationale: मूल पाठ का पुल्लिंग बहुवचन और तृतीय पुरुष एकवचन प्रत्यय हारून के पुत्रों को निर्दिष्ट करता है।
- source_word: כָּל
  choice: सभी
  rationale: यह अगले जनसमूह की समग्रता को सीधे व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी लोगों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यह नियमित सामूहिक वाचा-संबंधी पद पूरे इस्राएली समुदाय के लिए प्रयुक्त होता है। मुख्य पाठ में ‘इस्राएल के सभी लोगों’ आधुनिक हिन्दी में अर्थ को स्पष्ट और स्वाभाविक रखता है; मूल रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: वाचा-संबंधी जातिनाम בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के सभी लोगों
  alternative: इस्राएल के पुत्रों / इस्राएलियों
  rationale: यह पद रूप की दृष्टि से ‘इस्राएल के पुत्र’ है, किंतु प्रायः पूरे समुदाय का सामूहिक नाम है। मुख्य पाठ सामूहिक अर्थ स्पष्ट करता है और पादटिप्पणी शाब्दिक तथा प्रचलित विकल्प देती है; इससे कोई सांप्रदायिक निष्कर्ष नहीं थोपा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘यह बात’ प्रसंग में पहले दिए गए निर्देशों की ओर संकेत करता है और हिन्दी वाक्य को स्वाभाविक बनाता है।
