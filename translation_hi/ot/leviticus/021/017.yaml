  text: דַּבֵּ֥ר אֶֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אִ֣ישׁ מִֽ/זַּרְעֲ/ךָ֞ לְ/דֹרֹתָ֗/ם אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם לֹ֣א יִקְרַ֔ב לְ/הַקְרִ֖יב לֶ֥חֶם אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/017.yaml
  text: 'Speak to Aaron[b][a], saying: Any man from your offspring throughout their generations who has a defect shall not come near to offer the food of his God.'
translation:
  language: hi
  text: “हारून से कह, ‘तेरे वंश में पीढ़ी-दर-पीढ़ी जिस किसी पुरुष में कोई शारीरिक दोष[a] हो, वह अपने परमेश्वर के लिए भोजन-भेंट[b] चढ़ाने के लिए पास न आए।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अंग-दोष।” यहाँ इब्रानी מוּם (मूम) ऐसे शारीरिक दोष को दर्शाता है जो इस विशेष याजकीय सेवा के लिए अयोग्य ठहराता था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “अपने परमेश्वर की रोटी।” इस याजकीय प्रसंग में “रोटी” का अर्थ अधिक व्यापक रूप से बलिदान में चढ़ाई जाने वाली भोजन-भेंट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־אַהֲרֹן לֵאמֹר
  choice: हारून से कह
  rationale: हिब्रू के आज्ञार्थक वाक्य और कथन-परिचय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ מִזַּרְעֲךָ
  choice: तेरे वंश में ... जिस किसी पुरुष
  rationale: हारून के याजकीय वंश के किसी भी पुरुष सदस्य का आशय स्पष्ट करता है और मूल के पुल्लिंग एकवचन को बनाए रखता है।
- source_word: לְדֹרֹתָם
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह नियम हारून के वंश की आगामी पीढ़ियों पर निरंतर लागू होने का भाव सहज हिन्दी में देता है।
- source_word: מוּם
  choice: शारीरिक दोष
  rationale: इस याजकीय प्रसंग में शब्द शरीर की ऐसी दशा को सूचित करता है जो इस विशेष सेवा से अयोग्य ठहराती है; ‘शारीरिक’ जोड़ने से आधुनिक पाठक के लिए संदर्भ स्पष्ट होता है।
- source_word: לֹא יִקְרַב
  choice: पास न आए
  rationale: निषेध की कानूनी शक्ति और पवित्रस्थान के निकट आने से जुड़ा याजकीय मुहावरा दोनों सुरक्षित रहते हैं।
- source_word: לְהַקְרִיב
  choice: चढ़ाने के लिए
  rationale: हिफ़ील रूप यहाँ भेंट प्रस्तुत करने के अर्थ में है; बलिदानी संदर्भ में ‘चढ़ाना’ स्वाभाविक हिन्दी है।
- source_word: לֶחֶם אֱלֹהָיו
  choice: अपने परमेश्वर का भोजन
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, पर यहाँ यह व्यापक रूप से बलिदानी भोजन-भेंटों को दर्शाता है; मुख्य पाठ अर्थ स्पष्ट रखता है और पादटिप्पणी शाब्दिक रूप बताती है।
theological_decisions:
- issue: शारीरिक दोष वाले याजकों पर अनुष्ठानिक प्रतिबंध
  choice: इसे भोजन-भेंट चढ़ाने की विशिष्ट याजकीय सेवा से संबंधित नियम के रूप में व्यक्त किया गया है।
  alternative: ऐसी भाषा जो व्यक्ति की नैतिक दोषिता, कम मानवीय गरिमा या वाचा से व्यापक बहिष्कार का संकेत दे।
  rationale: मूल पाठ केवल एक विशेष पवित्रस्थानीय कार्य के लिए योग्यता सीमित करता है; वह नैतिक अपराध या व्यक्ति के मूल्य के विषय में कोई दावा नहीं करता।
- issue: לֶחֶם אֱלֹהָיו का अर्थ
  choice: अपने परमेश्वर का भोजन
  alternative: अपने परमेश्वर की रोटी
  rationale: ‘भोजन’ याजकीय संदर्भ में बलिदानी खाद्य-भेंटों के व्यापक अर्थ को संप्रेषित करता है, जबकि पादटिप्पणी मूल के शाब्दिक ‘रोटी’ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘तेरे’ का प्रयोग हारून को किए गए एकवचन संबोधन को सुरक्षित रखता है। कानूनी-याजकीय स्वर बनाए रखते हुए अनावश्यक प्राचीनता से बचा गया है।
