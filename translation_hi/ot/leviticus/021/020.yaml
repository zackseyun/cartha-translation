base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/020.yaml
  text: or hunchbacked[a], or dwarfed, or with a defect in his eye, or with an itch, or with scabs[d][c][b], or with crushed testicles.
translation:
  language: hi
  text: या जिसकी पीठ झुकी हुई हो,[a] या जिसका शरीर अविकसित हो,[b] या जिसकी आँख में कोई दोष हो,[c] या जिसे खुजली का रोग हो, या जिसे पपड़ीदार चर्मरोग हो,[d] या जिसके अंडकोष कुचले हुए हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिसकी पीठ टेढ़ी हो।”
    reason: lexical_alternative
  - marker: b
    text: इस इब्रानी शब्द का अर्थ अनिश्चित है; इसका संकेत बौनेपन, रुकी हुई शारीरिक वृद्धि या अत्यधिक क्षीण शरीर की ओर हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “जिसकी आँख में धब्बा हो”; आँख के इस दोष का ठीक स्वरूप अनिश्चित है।
    reason: lexical_alternative
  - marker: d
    text: यहाँ प्रयुक्त दोनों इब्रानी शब्द संभवतः अलग-अलग चर्मरोगों को सूचित करते हैं; उनके सटीक आधुनिक निदान अनिश्चित हैं।
    reason: cultural_note
lexical_decisions:
- source_word: גִבֵּן
  choice: जिसकी पीठ कुबड़ी हो
  rationale: यह शब्द पीठ की वक्रता या उभार को सूचित करता है। यह हिंदी अभिव्यक्ति स्पष्ट और सहज है तथा किसी अधिक विशिष्ट आधुनिक चिकित्सकीय निदान का दावा नहीं करती।
- source_word: דַק
  choice: जिसका शरीर अविकसित हो
  rationale: इस कठिन शब्द का आशय बौनेपन, ठिगनेपन, क्षीणता या शारीरिक वृद्धि रुकने से हो सकता है। व्यापक अनुवाद मूल की अनिश्चितता को बनाए रखता है।
- source_word: תְּבַלֻּל בְּעֵינוֹ
  choice: जिसकी आँख में कोई दोष हो
  rationale: यह किसी नेत्र-विकार का संकेत देता है, पर उसका ठीक स्वरूप निश्चित नहीं है; इसलिए मोतियाबिंद या धब्बे जैसा विशिष्ट निदान नहीं अपनाया गया।
- source_word: גָרָב
  choice: जिसे खुजली का चर्मरोग हो
  rationale: यह खुजली या त्वचा की जलन से जुड़ा रोग है। केवल 'खुजली' की अपेक्षा 'चर्मरोग' इसे रोगों की सूची में अधिक स्पष्ट बनाता है।
- source_word: יַלֶּפֶת
  choice: पपड़ीदार चर्मरोग
  rationale: यह גָרָב से अलग त्वचा की दशा है। यह अनुवाद दोनों में भेद रखता है, पर आधुनिक रोग-नाम निश्चित नहीं करता।
- source_word: מְרֹחַ אָשֶׁךְ
  choice: जिसके अंडकोष कुचले हुए हों
  rationale: वाक्यांश अंडकोषों की कुचलने से हुई क्षति को प्रत्यक्ष रूप से बताता है; शारीरिक आशय को किसी शिष्टोक्ति से अस्पष्ट नहीं किया गया।
- source_word: אוֹ
  choice: या
  rationale: हर दशा को अलग विकल्प के रूप में जोड़ने वाले बार-बार आए वियोजक को लगातार 'या' से व्यक्त किया गया है।
theological_decisions:
- issue: याजकीय पवित्रता-विधान में शारीरिक दशाओं की भाषा
  choice: शारीरिक दशाओं का सीधा वर्णन, बिना नैतिक दोष का संकेत दिए
  alternative: भाषा को शिष्टोक्तिपूर्ण बनाना या आधुनिक चिकित्सकीय निदान देना
  rationale: पद वेदी की सेवा से संबंधित याजकीय पात्रता की शारीरिक शर्तें गिनाता है; वह इन दशाओं को नैतिक अपराध नहीं ठहराता। अतः ठोस शारीरिक भाषा रखी गई है, पर नैतिक मूल्यांकन नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और प्रत्यक्ष शैली अपनाई गई है। सूची की पुनरावृत्त संरचना को 'या' से बनाए रखा गया है। शारीरिक दशाओं के लिए न तो अपमानसूचक भाषा और न ही अनिश्चित आधुनिक चिकित्सकीय नाम प्रयुक्त किए गए हैं।
