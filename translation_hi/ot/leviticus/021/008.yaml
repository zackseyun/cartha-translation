source:
  edition: WLC
  text: וְ/קִדַּשְׁתּ֔/וֹ כִּֽי אֶת לֶ֥חֶם אֱלֹהֶ֖י/ךָ ה֣וּא מַקְרִ֑יב קָדֹשׁ֙ יִֽהְיֶה לָּ֔/ךְ כִּ֣י קָד֔וֹשׁ אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/008.yaml
  text: You shall treat him as holy[a], because he offers the food of your God. He shall be holy to you, for I, Yahweh who sanctify you, am holy.
translation:
  language: hi
  text: तुम उसे पवित्र मानना, क्योंकि वह तुम्हारे परमेश्वर का भोजन[a] अर्पित करता है। वह तुम्हारे लिए पवित्र हो, क्योंकि मैं, यहोवा, जो तुम्हें पवित्र करता हूँ, पवित्र हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे परमेश्वर की रोटी।” यहाँ “रोटी” से सम्भवतः परमेश्वर को अर्पित की जाने वाली खाद्य-भेंटें व्यापक रूप से अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתּוֹ
  choice: तुम उसे पवित्र मानना
  rationale: पिएल रूप किसी व्यक्ति को पवित्र ठहराने अथवा उसके साथ पवित्र के रूप में व्यवहार करने का आदेश देता है। यह हिन्दी में स्वाभाविक रहते हुए आज्ञार्थक बल को बनाए रखता है।
- source_word: לֶחֶם אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर का भोजन
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, पर याजकीय बलिदानी संदर्भ में यह परमेश्वर को चढ़ाई जाने वाली खाद्य-भेंटों को व्यापक रूप से सूचित कर सकता है। शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: מַקְרִיב
  choice: अर्पित करता है
  rationale: हिफ़ील कृदन्त बलिदानी संदर्भ में किसी भेंट को प्रस्तुत या अर्पित करने को व्यक्त करता है।
- source_word: קָדֹשׁ יִהְיֶה לָּךְ
  choice: वह तुम्हारे लिए पवित्र हो
  rationale: यह अनुवाद לְ के संबंधपरक भाव और मूल पाठ में दोहराए गए ‘पवित्र’ शब्द को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को शीर्षक से अलग रखता है।
- source_word: מְקַדִּשְׁכֶם
  choice: जो तुम्हें पवित्र करता हूँ
  rationale: यह आरम्भिक קדשׁ धातु के साथ शब्दगत संबंध बनाए रखता और परमेश्वर की पवित्र करने वाली क्रिया को स्पष्ट करता है।
theological_decisions:
- issue: לֶחֶם אֱלֹהֶיךָ का बलिदानी अर्थ
  choice: तुम्हारे परमेश्वर का भोजन
  alternative: तुम्हारे परमेश्वर की रोटी
  rationale: संदर्भ याजक द्वारा भेंटें चढ़ाने का है, इसलिए व्यापक ‘भोजन’ उपयुक्त है; फिर भी शाब्दिक ‘रोटी’ को पादटिप्पणी में संरक्षित किया गया है।
- issue: קדשׁ भाषा की पुनरावृत्ति
  choice: पवित्र मानना / पवित्र / पवित्र करता हूँ
  alternative: अलग ठहराना / समर्पित / पवित्र बनाता हूँ
  rationale: ‘पवित्र’ की पुनरावृत्ति याजक की स्थिति, यहोवा की अपनी पवित्रता और लोगों को पवित्र करने की उसकी क्रिया के बीच मूल पाठ का धर्मवैचारिक संबंध बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। एकवचन सम्बोधन के लिए ‘तुम’ का प्रयोग संदर्भानुसार किया गया है। ‘यहोवा’ हिन्दी में परिचित दैवी नाम है; ‘परमेश्वर’ אֱלֹהִים के लिए रखा गया है।
