source:
  edition: WLC
  text: אַלְמָנָ֤ה וּ/גְרוּשָׁה֙ וַ/חֲלָלָ֣ה זֹנָ֔ה אֶת אֵ֖לֶּה לֹ֣א יִקָּ֑ח כִּ֛י אִם בְּתוּלָ֥ה מֵ/עַמָּ֖י/ו יִקַּ֥ח אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/014.yaml
  text: 'He shall not take these as wife: a widow[a], or a divorced woman, or a defiled woman, or a prostitute. Rather, he shall take a virgin from his own people as wife.'
translation:
  language: hi
  text: वह किसी विधवा, तलाकशुदा स्त्री, अपवित्र स्त्री[a] या वेश्या से विवाह न करे। वह केवल अपने लोगों में से किसी कुँवारी से विवाह करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपवित्र की गई स्त्री” अथवा “जिसकी पवित्र स्थिति भंग हुई हो”; इब्रानी शब्द याजकीय पवित्रता-विधान के संदर्भ में ऐसी स्त्री की स्थिति को दर्शाता है, जिससे विवाह निषिद्ध था।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: विधवा
  rationale: यह शब्द अपने सामान्य और स्पष्ट अर्थ में विधवा को दर्शाता है।
- source_word: גְרוּשָׁה
  choice: तलाक दी गई स्त्री
  rationale: इब्रानी निष्क्रिय रूप ऐसी स्त्री को दर्शाता है जिसे उसके पति ने वैधानिक रूप से छोड़ दिया हो; आधुनिक हिन्दी में यह प्रयोग अर्थ को स्पष्ट रखता है।
- source_word: חֲלָלָה
  choice: पवित्रता से वंचित स्त्री[a]
  rationale: याजकीय पवित्रता-विधान में यह शब्द ऐसी स्त्री की धार्मिक-सामाजिक स्थिति दर्शाता है जिसे पवित्र पद के योग्य नहीं माना जाता। यह अनुवाद मूल धातु में निहित ‘पवित्रता भंग होने’ का भाव रखता है, बिना किसी विशेष कारण को पाठ में जोड़ने के।
- source_word: זֹנָה
  choice: वेश्या
  rationale: यह समकालीन हिन्दी में स्पष्ट और सीधा अर्थ देता है तथा पुराने या अत्यधिक अपमानजनक शब्दों से बचता है।
- source_word: אֶת אֵלֶּה לֹא יִקָּח
  choice: इनमें से किसी ... से विवाह न करे
  rationale: शाब्दिक ‘न ले’ इब्रानी विवाह-संबंधी मुहावरा है; हिन्दी में ‘विवाह न करे’ उसी आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי אִם
  choice: वह ... बनाए
  rationale: निषेध के बाद केवल अनुमत विकल्प प्रस्तुत करने वाला विरोध मूल वाक्य-विन्यास और दो वाक्यों के क्रम से स्पष्ट है।
- source_word: בְּתוּלָה
  choice: कुँवारी
  rationale: इस विवाह-विधान में शब्द उस स्त्री को दर्शाता है जिसने यौन-संबंध नहीं रखा; ‘कुँवारी’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: מֵעַמָּיו
  choice: अपने ही लोगों में से
  rationale: पूर्वसर्ग और बहुवचन संज्ञा मिलकर उसके अपने समुदाय के भीतर से चयन का अर्थ देते हैं।
- source_word: יִקַּח אִשָּׁה
  choice: पत्नी बनाए
  rationale: इब्रानी का शाब्दिक अर्थ ‘स्त्री/पत्नी ले’ है; हिन्दी में ‘पत्नी बनाए’ विवाह का आशय गरिमापूर्ण और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: याजकीय विवाह-विधान में חֲלָלָה का अर्थ
  choice: पवित्रता से वंचित स्त्री
  alternative: अपवित्र ठहराई गई स्त्री; जिसकी पवित्र स्थिति भंग हुई हो
  rationale: यह तकनीकी शब्द सामान्य शारीरिक अशुद्धता मात्र नहीं, बल्कि याजकीय पवित्रता-विधान के अनुसार अनुपयुक्त मानी गई स्थिति को व्यक्त करता है। मुख्य पाठ पठनीय रखा गया है और मूल की व्यापकता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और विधिक स्वर रखा गया है। इब्रानी मुहावरे ‘पत्नी लेना’ को स्वाभाविक हिन्दी ‘विवाह करना/पत्नी बनाना’ से व्यक्त किया गया है। तकनीकी पवित्रता-संबंधी पद की अनिश्चित व्यापकता पादटिप्पणी में संरक्षित है।
