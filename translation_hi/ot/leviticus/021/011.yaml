base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/011.yaml
  text: He shall not go near any dead body[a]; he shall not make himself unclean even for his father or for his mother.
translation:
  language: hi
  text: वह किसी भी शव[a] के पास न जाए; अपने पिता या माता के कारण भी वह अपने को अशुद्ध न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मृत देह।’ शाब्दिक रूप से, ‘मृत व्यक्ति/प्राणी’; शुद्धता-विधियों में यह मानव शव के लिए प्रयुक्त मुहावरेदार अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל כָּל נַפְשֹׁת מֵת
  choice: किसी भी शव के पास
  rationale: בוא על का प्रयोग यहाँ शव के निकट जाने के अर्थ में है। נַפְשֹׁת מֵת शाब्दिक रूप से मृत व्यक्ति/मृतकों से जुड़ी अभिव्यक्ति है, पर शुद्धता-विधियों में मानव शव को सूचित करती है। नकार के साथ כָּל का स्वाभाविक हिन्दी रूप ‘किसी भी’ है।
- source_word: לֹא יָבֹא
  choice: न जाए
  rationale: विधिक निषेध को आधुनिक, स्वाभाविक हिन्दी में स्पष्ट रूप से व्यक्त करता है; ‘के पास’ के साथ मूल मुहावरे का आशय पूरा होता है।
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: अपने पिता या अपनी माता के लिए भी
  rationale: לְ यहाँ संबंध अथवा प्रसंग दर्शाता है—माता-पिता की मृत्यु के अवसर पर भी सामान्य निषेध का अपवाद नहीं है। ‘भी’ निकटतम परिजनों के उल्लेख में निहित बल को व्यक्त करता है, और ‘या’ प्रत्येक माता-पिता पर निषेध को अलग-अलग लागू करता है।
- source_word: לֹא יִטַּמָּא
  choice: वह अपने आपको अशुद्ध न करे
  rationale: טמא का हित्पएल रूप आत्मवाचक है। ‘अपने आपको अशुद्ध न करे’ धार्मिक शुद्धता की श्रेणी बनाए रखता है और इसे नैतिक पाप का पर्याय नहीं बनाता।
theological_decisions:
- issue: धार्मिक शुद्धता की शब्दावली
  choice: अशुद्ध
  alternative: अपवित्र; धार्मिक रीति से अशुद्ध
  rationale: पद याजकीय शव-संपर्क से उत्पन्न अशुद्धता की बात करता है। ‘अशुद्ध’ बाइबिल की इस श्रेणी को बनाए रखता है; ‘अपवित्र’ नैतिक अर्थ का अधिक संकेत दे सकता है और ‘धार्मिक रीति से’ मुख्य पाठ में अनावश्यक व्याख्या जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण विधिक शैली। ‘शव’ सामान्य पाठक के लिए स्पष्ट और प्रसंगानुकूल है; वाक्य-विन्यास मूल के सामान्य निषेध और फिर माता-पिता के विशेष उल्लेख को सुरक्षित रखता है।
