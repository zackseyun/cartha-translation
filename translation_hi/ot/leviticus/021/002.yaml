- source_word: הַקָּרֹב אֵלָיו
  choice: निकटतम
  rationale: यह पदबंध सम्बन्ध की निकटता बताता है; सूची के सन्दर्भ में ‘निकटतम’ संक्षिप्त और स्वाभाविक है।
- source_word: לְאִמּוֹ וּלְאָבִיו וְלִבְנוֹ וּלְבִתּוֹ וּלְאָחִיו
  choice: अपनी माँ के लिए, अपने पिता के लिए, अपने बेटे के लिए, अपनी बेटी के लिए और अपने भाई के लिए
  rationale: हर संज्ञा के साथ दोहराए गए לְ को ‘के लिए’ द्वारा बनाए रखा गया है, जिससे उन व्यक्तियों की स्पष्ट कानूनी सूची सुरक्षित रहती है जिनके कारण अशुद्ध होना अनुमत है।
