- source_word: מֹשֶׁה
  choice: मूसा
  rationale: यह इस व्यक्तिगत नाम का मानक और व्यापक रूप से समझा जाने वाला हिन्दी रूप है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: לֵאמֹר अगले पद में आने वाले सीधे कथन की भूमिका बाँधता है। हिन्दी में ‘कहा’ इस सूत्र को सहज रूप से व्यक्त करता है; ‘यह कहते हुए’ यहाँ अनावश्यक रूप से बोझिल होता।
