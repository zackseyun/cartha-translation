  text: לֹ֥א יִטַּמָּ֖א בַּ֣עַל בְּ/עַמָּ֑י/ו לְ/הֵ֖חַלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/004.yaml
  text: He shall not defile himself as a husband among his people[a], and so profane himself.
translation:
  language: hi
  text: वह अपने लोगों के बीच पति के नाते स्वयं को अशुद्ध न करे[a], और इस प्रकार स्वयं को अपवित्र न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने लोगों के बीच प्रधान व्यक्ति के रूप में स्वयं को अशुद्ध न करे और इस प्रकार स्वयं को अपवित्र न करे।” इब्रानी उपवाक्य कठिन है; कुछ लोग इसे पति के विशेष अर्थ के बजाय अधिक सामान्य निषेध के रूप में समझते हैं कि वह अपने लोगों के बीच एक प्रमुख व्यक्ति के तौर पर स्वयं को अशुद्ध न करे।
    reason: alternative_reading
lexical_decisions:
- source_word: יִטַּמָּא
  choice: अपने आपको अशुद्ध करे
  rationale: हित्पाएल रूप यहाँ मृतक के संपर्क से लगने वाली विधिक अशुद्धता को दर्शाता है। ‘अपने आपको अशुद्ध करे’ आधुनिक हिन्दी में स्वाभाविक है और लैव्यव्यवस्था के शुद्धता-संबंधी संदर्भ को स्पष्ट रखता है।
- source_word: בַּעַל
  choice: पति के रूप में
  rationale: इस कठिन वाक्यांश में בַּעַל का सामान्य संबंधपरक अर्थ ‘पति’ निकट संबंधियों के लिए शोक और मृतक-संपर्क की आसपास की व्यवस्था से मेल खाता है; फिर भी ‘प्रधान व्यक्ति’ का अर्थ संभव है और उसे पादटिप्पणी में रखा गया है।
- source_word: בְּעַמָּיו
  choice: अपने लोगों के बीच
  rationale: यह इब्रानी अभिव्यक्ति का निकट अनुवाद है। संदर्भ में ‘लोगों’ में अपने कुल या संबंधी-समुदाय का भाव हो सकता है, पर मुख्य पाठ में व्यापक और अस्पष्ट अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: לְהֵחַלּוֹ
  choice: और इस प्रकार अपने आपको अपवित्र न करे
  rationale: यहाँ अशुद्ध होने के परिणाम अथवा उद्देश्य का भाव है। ‘अपवित्र’ חלל की पवित्रता-विरोधी शब्दावली को सुरक्षित रखता है और इसे केवल सामान्य अशुद्धता में नहीं मिला देता।
theological_decisions:
- issue: कठिन वाक्यांश בַּעַל בְּעַמָּיו का अर्थ
  choice: अपने लोगों के बीच पति के रूप में
  alternative: अपने लोगों के बीच प्रधान व्यक्ति के रूप में; अथवा, अपने लोगों के बीच अपने आपको अशुद्ध न करे, जिससे वह अपने आपको अपवित्र करे
  rationale: इब्रानी वाक्य रचना संक्षिप्त और कठिन है। בַּעַל का प्रचलित अर्थ ‘पति’ निकट संबंधियों के विषय वाले संदर्भ में संगत है, पर ‘स्वामी/प्रधान व्यक्ति’ और अधिक सामान्य वाक्य-विभाजन भी संभव हैं। इसलिए मुख्य पाठ में संभावित संबंधपरक अर्थ लिया गया है और वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘अशुद्ध’ और ‘अपवित्र’ को अलग रखकर טמא तथा חלל के विधिक-पवित्रता संबंधी भेद को यथासंभव सुरक्षित रखा गया है।
