id: LEV.21.21
reference: Leviticus 21:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר בּ֣/וֹ מ֗וּם מִ/זֶּ֨רַע֙ אַהֲרֹ֣ן הַ/כֹּהֵ֔ן לֹ֣א יִגַּ֔שׁ לְ/הַקְרִ֖יב אֶת אִשֵּׁ֣י יְהוָ֑ה מ֣וּם בּ֔/וֹ אֵ֚ת לֶ֣חֶם אֱלֹהָ֔י/ו לֹ֥א יִגַּ֖שׁ לְ/הַקְרִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/021.yaml
  text: No man from the offspring of Aaron the priest who has a defect shall come near to offer the food offerings of Yahweh[a]. A defect is in him[b]; he shall not come near to offer the bread of his God.
translation:
  language: hi
  text: याजक हारून के वंश का कोई भी पुरुष, जिसमें शारीरिक दोष हो, याहवे की अग्नि-भेंटें[a] चढ़ाने के लिए निकट न आए। उसमें दोष है; वह अपने परमेश्वर की रोटी[b] चढ़ाने के लिए निकट न आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की खाद्य-भेंटें।”
    reason: lexical_alternative
  - marker: b
    text: “अपने परमेश्वर की रोटी” याजकीय भाषा में बलिदान के रूप में परमेश्वर को प्रस्तुत भोजन के लिए प्रयुक्त मुहावरा है; या, “अपने परमेश्वर का भोजन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ ... לֹא
  choice: कोई भी पुरुष ... न आए
  rationale: כָּל के साथ निषेध सार्वभौमिक मनाही व्यक्त करता है। याजकीय पुरुष-विषयक संदर्भ को बनाए रखते हुए आधुनिक हिन्दी में इसे स्वाभाविक निषेध के रूप में रखा गया है।
- source_word: מוּם
  choice: शारीरिक दोष
  rationale: इस याजकीय प्रसंग में מוּם सेवा के लिए अयोग्य ठहराने वाली शारीरिक अवस्था को सूचित करता है। केवल ‘दोष’ नैतिक कमी भी समझा जा सकता था, इसलिए अर्थ स्पष्ट किया गया है।
- source_word: מִזֶּרַע אַהֲרֹן הַכֹּהֵן
  choice: हारून याजक के वंश का
  rationale: זֶרַע यहाँ जैविक वंशावली को दर्शाता है; ‘वंश’ आधुनिक हिन्दी में स्वाभाविक है और हारून के साथ ‘याजक’ का समानाधिकरण भी सुरक्षित रखता है।
- source_word: יִגַּשׁ
  choice: निकट न आए
  rationale: बलिदानी सेवा के लिए आगे आने के धार्मिक अर्थ को व्यक्त करता है और पद में इसकी पुनरावृत्ति बनाए रखता है।
- source_word: לְהַקְרִיב
  choice: चढ़ाने के लिए
  rationale: हिफ़ील הקריב का बलिदानी प्रसंग में अर्थ किसी भेंट को परमेश्वर के सामने प्रस्तुत या अर्पित करना है; ‘चढ़ाना’ हिन्दी धार्मिक भाषा में स्पष्ट और स्वाभाविक है।
- source_word: אִשֵּׁי יְהוָה
  choice: याहवे की अग्नि-भेंटें
  rationale: אִשֶּׁה को उसके पारंपरिक अग्नि-संबंधी बलिदानी अर्थ के साथ प्रस्तुत किया गया है; खाद्य-भेंट का अर्थ पादटिप्पणी में दिया गया है, क्योंकि अगले वाक्यांश में भोजन की छवि आती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय निजी नाम को उपाधि से बदलने के बजाय हिन्दी में ध्वन्यंतरित किया गया है।
- source_word: לֶחֶם אֱלֹהָיו
  choice: अपने परमेश्वर की रोटी
  rationale: לֶחֶם का प्रत्यक्ष अर्थ ‘रोटी’ सुरक्षित रखा गया है। याजकीय मुहावरे में इससे बलिदान में परमेश्वर को प्रस्तुत भोजन अभिप्रेत है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में वाचा का निजी नाम सीधे आया है; ‘याहवे’ उसका व्यापक रूप से स्वीकृत ध्वन्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि में नहीं बदलता।
- issue: ‘परमेश्वर की रोटी’ का बलिदानी अर्थ
  choice: मुख्य पाठ में शाब्दिक याजकीय मुहावरा बनाए रखना
  alternative: अपने परमेश्वर का भोजन
  rationale: ‘रोटी’ मूल की ठोस छवि और लैव्यव्यवस्था की याजकीय भाषा बनाए रखती है; पादटिप्पणी बताती है कि यहाँ सामान्य भोजन नहीं, बलिदान में प्रस्तुत सामग्री अभिप्रेत है।
translation_notes:
  register: भाषा आधुनिक, औपचारिक और सामान्य पाठकों के लिए स्पष्ट रखी गई है। विधिक निषेध और पद की दोहरावपूर्ण संरचना सुरक्षित हैं। ‘शारीरिक दोष’ प्रसंगगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणियाँ बलिदानी तकनीकी शब्दों की वास्तविक वैकल्पिक व्याख्याएँ बनाए रखती हैं।
