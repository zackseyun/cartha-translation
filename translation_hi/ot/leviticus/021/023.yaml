source:
  edition: WLC
  text: אַ֣ךְ אֶל הַ/פָּרֹ֜כֶת לֹ֣א יָבֹ֗א וְ/אֶל הַ/מִּזְבֵּ֛חַ לֹ֥א יִגַּ֖שׁ כִּֽי מ֣וּם בּ֑/וֹ וְ/לֹ֤א יְחַלֵּל֙ אֶת מִקְדָּשַׁ֔/י כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/023.yaml
  text: However[a], he shall not go in to the veil or come near the altar, because there is a defect in him, so that he may not profane my sanctuaries[c][b]; for I am Yahweh who sanctifies them.
translation:
  language: hi
  text: फिर भी वह परदे तक न जाए और वेदी के निकट न आए, क्योंकि उसमें शारीरिक दोष[a] है, ताकि वह मेरे पवित्र स्थानों[b] को अपवित्र न करे; क्योंकि मैं याहवे हूँ, जो उन्हें पवित्र करता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘दोष’ से आशय शारीरिक दोष है, नैतिक अपराध से नहीं; इस विधान में उसके कारण याजक को कुछ पवित्र सेवाएँ करने की अनुमति नहीं थी।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘मेरे पवित्र स्थानों’ बहुवचन है; कुछ अनुवाद इसे एकवचन ‘मेरे पवित्रस्थान’ करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: फिर भी
  rationale: यह पिछले पद में दी गई अनुमति के बाद यहाँ लगाए गए प्रतिबंध को स्वाभाविक विरोधात्मक ढंग से व्यक्त करता है।
- source_word: הַפָּרֹכֶת
  choice: परदा
  rationale: यह पवित्रस्थान के भीतरी परदे का सामान्य, स्पष्ट और वर्तमान हिन्दी रूप है।
- source_word: יָבֹא
  choice: पास भीतर जाए
  rationale: אֶל הַפָּרֹכֶת के साथ यह परदे तक अथवा उसके भीतर के निषिद्ध क्षेत्र में प्रवेश का भाव देता है; हिन्दी में स्थानिक संबंध को खुला रखा गया है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: याजकीय और बलिदान-संबंधी संदर्भ में मानक हिन्दी शब्द।
- source_word: יִגַּשׁ
  choice: निकट आए
  rationale: याजकीय सेवा के लिए पवित्र वस्तु के पास आने की स्रोत-पाठ की भाषा को सुरक्षित रखता है।
- source_word: מוּם בּוֹ
  choice: उसमें शारीरिक दोष है
  rationale: इस व्यवस्था में מוּם शरीर-संबंधी ऐसा दोष है जो विशेष याजकीय सेवा से अयोग्य ठहराता है; यह नैतिक दोष नहीं है।
- source_word: יְחַלֵּל
  choice: अपवित्र करे
  rationale: पवित्र को साधारण या अपवित्र ठहराने के याजकीय भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: מִקְדָּשַׁי
  choice: मेरे पवित्र स्थानों
  rationale: इब्रानी बहुवचन को बनाए रखता है; एकवचन ‘मेरे पवित्रस्थान’ करके पाठ को समतल नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम के स्थान पर उपाधि रखने के बजाय इब्रानी नाम का लिप्यंतरण किया गया है।
- source_word: מְקַדְּשָׁם
  choice: जो उन्हें पवित्र करता हूँ
  rationale: पुंलिंग बहुवचन प्रत्यय को निकटतम बहुवचन पूर्वपद ‘पवित्र स्थानों’ से संबद्ध रखा गया है और קדש की पवित्रता-संबंधी शब्दावली सुरक्षित है।
theological_decisions:
- issue: מְקַדְּשָׁם में बहुवचन सर्वनाम का संदर्भ
  choice: ‘उन्हें’ का संबंध ‘मेरे पवित्र स्थानों’ से
  alternative: इसका व्यापक संबंध याजकों या इस्राएलियों से माना जा सकता है
  rationale: निकटतम व्याकरणिक पूर्वपद बहुवचन ‘मेरे पवित्र स्थानों’ है और तत्काल प्रसंग पवित्र क्षेत्र में प्रवेश का है; फिर भी सर्वनाम को संज्ञा से बदलकर संभावित तनाव समाप्त नहीं किया गया।
- issue: याजकीय पवित्रता-विधान में מוּם का अर्थ
  choice: शारीरिक दोष
  alternative: दाग या अंग-दोष
  rationale: यहाँ बात नैतिक अपराध या व्यक्ति के कम मूल्य की नहीं, बल्कि विशेष याजकीय निकटता पर लगाए गए शारीरिक योग्यता-संबंधी प्रतिबंध की है।
- issue: וְלֹא יְחַלֵּל का संबंध
  choice: उद्देश्य/परिणाम की चेतावनी—‘ऐसा न हो कि वह…अपवित्र करे’
  alternative: समानांतर सीधा निषेध—‘और वह…अपवित्र न करे’
  rationale: दोनों व्याकरणतः संभव हैं; प्रसंग में प्रवेश-प्रतिबंध का उद्देश्य बताने वाला हिन्दी रूप स्वाभाविक है और स्रोत की धार्मिक गंभीरता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘वेदी’, ‘पवित्र’ और ‘अपवित्र’ जैसी परिचित धर्मग्रंथीय शब्दावली बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ रचना से बचा गया है।
