lexical_decisions:
- source_word: וְהוּא
  choice: और वह
  rationale: संयोजक और स्वतंत्र सर्वनाम पूर्ववर्ती विधान से संबंध बनाए रखते हैं और कर्ता पर हल्का बल देते हैं।
- source_word: אִשָּׁה
  choice: स्त्री को पत्नी
  rationale: לקח के साथ यह विवाह का मुहावरा है; हिंदी में केवल ‘पत्नी’ के बजाय ‘स्त्री को पत्नी बनाए’ विवाह ग्रहण करने का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּבְתוּלֶיהָ
  choice: कुँवारी
  rationale: इब्रानी पद का शाब्दिक अर्थ ‘उसकी कुँवारापन की अवस्था में’ है। मुख्य पाठ में ‘कुँवारी’ आधुनिक हिंदी में वही अवस्था स्पष्ट और सहज ढंग से व्यक्त करता है; शाब्दिक बनावट पादटिप्पणी में सुरक्षित है।
- source_word: יִקָּח
  choice: पत्नी बनाए
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर पत्नी के संदर्भ में यह विवाह करने का स्थापित मुहावरा है। हिंदी में ‘पत्नी बनाए’ कानूनी निर्देश और वैवाहिक आशय दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: याजकीय विवाह-विधान की शब्दावली
  choice: विवाह के मुहावरे को ‘एक कुँवारी स्त्री को पत्नी बनाए’ के रूप में व्यक्त करना
  alternative: वह कुँवारी अवस्था में एक पत्नी को ग्रहण करे
  rationale: चुना हुआ पाठ मूल के वैवाहिक मुहावरे और स्त्री की कुँवारी अवस्था दोनों को बनाए रखता है, पर अस्वाभाविक शाब्दिक हिंदी से बचता है। इससे कोई अतिरिक्त सांप्रदायिक या धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज कानूनी शैली। ‘कुँवारी’ प्रचलित और स्पष्ट है; पादटिप्पणी मूल इब्रानी की अधिक शाब्दिक अभिव्यक्ति देती है।
