base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/009.yaml
  text: And the daughter of a priest[a], if she profanes herself by prostituting herself, profanes her father[b]; she shall be burned with fire.
translation:
  language: hi
  text: और किसी याजक की बेटी यदि वेश्यावृत्ति करके अपने को अपवित्र करती है[a], तो वह अपने पिता को अपवित्र करती है; उसे आग में जलाया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यदि वह वेश्यावृत्ति करना शुरू करती है।’ इब्रानी क्रिया का यह अर्थ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת אִישׁ כֹּהֵן
  choice: और यदि किसी याजक की बेटी
  rationale: इब्रानी पदबंध का स्वाभाविक हिन्दी अर्थ ‘किसी याजक की बेटी’ है। अगले כִּי के साथ ‘यदि’ रखकर विधिक शर्त स्पष्ट की गई है।
- source_word: כִּי
  choice: यदि
  rationale: इस विधिक प्रसंग में यह किसी संभावित मामले की शर्त प्रस्तुत करता है।
- source_word: תֵחֵל
  choice: अपने-आपको अपवित्र करती है
  rationale: חלל के निफ़अल रूप का यहाँ अर्थ ‘अपवित्र होना/अपने-आपको अपवित्र करना’ है। आत्मवाचक हिन्दी मूल के परिणामात्मक भाव को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: לִזְנוֹת
  choice: वेश्यावृत्ति करके
  rationale: זנה यहाँ ठोस यौन अर्थ में वेश्या का आचरण करने को सूचित करता है; यह व्यापक ‘व्यभिचार’ की अपेक्षा स्रोत की विशिष्टता बनाए रखता है।
- source_word: אֶת אָבִיהָ הִיא מְחַלֶּלֶת
  choice: तो वह अपने पिता को अपवित्र करती है
  rationale: מְחַלֶּלֶת का पिएल अर्थ ‘अपवित्र करना’ है। उसी हिन्दी शब्द को दोहराने से पद में חלל की जानबूझकर की गई शब्दावली-संगति सुरक्षित रहती है।
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: उसे आग में जला दिया जाए
  rationale: निफ़अल अपूर्ण विधिक दण्डादेश व्यक्त करता है। ‘जला दिया जाए’ आधुनिक, गंभीर और स्पष्ट विधिक हिन्दी है; בָּאֵשׁ को स्वाभाविक रूप से ‘आग में’ कहा गया है।
theological_decisions:
- issue: याजकीय पवित्रता के विधान में חלל की शब्दावली
  choice: दोनों उपवाक्यों में ‘अपवित्र’ का प्रयोग
  alternative: पहले ‘भ्रष्ट’ और दूसरे में ‘अपने पिता का अपमान’
  rationale: एक ही इब्रानी मूल की पुनरावृत्ति याजकीय पवित्रता के उल्लंघन को बेटी और पिता दोनों से जोड़ती है। ‘अपमान’ सामाजिक अर्थ तक सीमित कर सकता है, इसलिए धार्मिक-विधिक तनाव बनाए रखने हेतु ‘अपवित्र’ रखा गया है।
- issue: दण्ड-विधान की अभिव्यक्ति
  choice: उसे आग में जला दिया जाए
  alternative: वह आग में जलाई जाएगी
  rationale: इब्रानी रूप केवल भविष्यवाणी नहीं, निर्धारित दण्ड व्यक्त करता है। हिन्दी भाववाच्य विधिक आदेश को स्पष्ट करता है, बिना दण्ड के ऐतिहासिक क्रियान्वयन या क्रम के बारे में अतिरिक्त निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर विधिक-धार्मिक शैली रखी गई है। ‘याजक’ और ‘अपवित्र’ सामान्य बाइबलीय शब्दावली के अनुरूप हैं; वाक्य को साधारण पाठक के लिए स्पष्ट रखते हुए इब्रानी की חלל-शब्द पुनरावृत्ति बचाई गई है।
