lexical_decisions:
- source_word: אוֹ
  choice: या
  rationale: यह सूची में अगली शारीरिक दशा जोड़ने वाला सामान्य विकल्पसूचक समुच्चयबोधक है।
- source_word: אִישׁ
  choice: ऐसा पुरुष
  rationale: याजकीय विधि के इस संदर्भ में एक पुरुष याजक की बात है; ‘पुरुष’ मूल के लिंग और एकवचन को स्पष्ट रखता है।
- source_word: אֲשֶׁר יִהְיֶה בוֹ
  choice: जिसका … हो
  rationale: शाब्दिक भाव ‘जिसमें … हो’ है, पर शारीरिक दशा व्यक्त करने के लिए आधुनिक हिन्दी में ‘जिसका … हो’ अधिक स्वाभाविक है।
- source_word: שֶׁבֶר
  choice: टूटा
  rationale: संज्ञा का अर्थ टूटना या अस्थिभंग है; शरीर के अंग के साथ ‘टूटा’ सहज और गैर-तकनीकी हिन्दी है।
- source_word: רָגֶל
  choice: पैर
  rationale: यहाँ शब्द का सीधा और सामान्य अर्थ ‘पैर’ है; संदर्भ इसे ‘टाँग’ करने की माँग नहीं करता।
- source_word: שֶׁבֶר יָד
  choice: हाथ टूटा
  rationale: יָד का सीधा अर्थ ‘हाथ’ रखा गया है और שֶׁבֶר को पहले पद के समान ही अनूदित किया गया है।
