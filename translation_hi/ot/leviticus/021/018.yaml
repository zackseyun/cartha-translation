source:
  edition: WLC
  text: כִּ֥י כָל אִ֛ישׁ אֲשֶׁר בּ֥/וֹ מ֖וּם לֹ֣א יִקְרָ֑ב אִ֤ישׁ עִוֵּר֙ א֣וֹ פִסֵּ֔חַ א֥וֹ חָרֻ֖ם א֥וֹ שָׂרֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/021/018.yaml
  text: 'For no man who has a defect shall come near: a blind man[a], or a lame man, or one with a disfigured face[d][c][b], or one with a limb too long.'
translation:
  language: hi
  text: क्योंकि जिस पुरुष में कोई शारीरिक दोष हो, वह निकट न आए—चाहे वह अंधा हो, लँगड़ा हो, उसका चेहरा विकृत हो[a], या उसका कोई अंग असामान्य रूप से लंबा हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दुर्लभ इब्रानी शब्द का ठीक अर्थ अनिश्चित है; यह विशेष रूप से क्षतिग्रस्त या विकृत नाक का उल्लेख कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द संभवतः किसी बढ़े हुए, खिंचे हुए या अनुपातहीन अंग को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले निषेध का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: כָל אִישׁ אֲשֶׁר בּוֹ מוּם
  choice: जिस पुरुष में कोई शारीरिक दोष हो
  rationale: निषेध के साथ כָל אִישׁ का आशय ऐसे किसी भी पुरुष से है; याजकीय संदर्भ के कारण ‘पुरुष’ उचित है। מוּם यहाँ याजकीय सेवा के लिए अयोग्य ठहराने वाले शारीरिक दोष को दर्शाता है।
- source_word: לֹא יִקְרָב
  choice: वह निकट न आए
  rationale: קרב याजकीय प्रसंग में सेवा के लिए पवित्र स्थान के निकट आने का पारिभाषिक भाव रखता है; मुख्य पाठ उसकी औपचारिक संक्षिप्तता बनाए रखता है।
- source_word: אִישׁ עִוֵּר
  choice: वह अंधा हो
  rationale: इब्रानी विशेषण का सीधा, स्वाभाविक और सम्मानजनक हिन्दी रूप।
- source_word: פִסֵּחַ
  choice: लँगड़ा हो
  rationale: चलने की शारीरिक अक्षमता के लिए प्रचलित और संक्षिप्त हिन्दी शब्द।
- source_word: חָרֻם
  choice: उसका चेहरा विकृत हो
  rationale: दुर्लभ शब्द संभवतः चेहरे, विशेषकर नाक, की क्षति या विकृति बताता है; यह अनुवाद संभावित अर्थ देता है, जबकि पादटिप्पणी अनिश्चितता सुरक्षित रखती है।
- source_word: שָׂרוּעַ
  choice: उसका कोई अंग असामान्य रूप से लंबा हो
  rationale: शब्द संभवतः खिंचे हुए, बढ़े हुए या अनुपातहीन अंग को दर्शाता है; ‘असामान्य रूप से लंबा’ स्पष्ट है, पर निश्चितता का अतिरेक नहीं करता।
theological_decisions:
- issue: याजकीय व्यवस्था में इस निषेध का स्वरूप
  choice: इसे पवित्र स्थान के निकट आकर याजकीय सेवा करने की शारीरिक योग्यता से संबंधित नियम के रूप में प्रस्तुत किया गया है।
  alternative: इसे व्यक्ति के सामाजिक मूल्य, नैतिक स्थिति या व्यापक सामुदायिक बहिष्कार का कथन समझना।
  rationale: संदर्भ हारून के पुरुष वंशजों की याजकीय सेवा और ‘निकट आने’ से संबंधित है। पद स्वयं व्यक्ति की गरिमा या नैतिक दोष के विषय में कोई दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘शारीरिक दोष’ प्रसंगगत अर्थ स्पष्ट करता है; ‘निकट न आए’ याजकीय पारिभाषिकता को बिना अनावश्यक विस्तार के बनाए रखता है।
