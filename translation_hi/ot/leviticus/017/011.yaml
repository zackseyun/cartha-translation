source:
  edition: WLC
  text: כִּ֣י נֶ֣פֶשׁ הַ/בָּשָׂר֮ בַּ/דָּ֣ם הִוא֒ וַ/אֲנִ֞י נְתַתִּ֤י/ו לָ/כֶם֙ עַל הַ/מִּזְבֵּ֔חַ לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶ֑ם כִּֽי הַ/דָּ֥ם ה֖וּא בַּ/נֶּ֥פֶשׁ יְכַפֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/011.yaml
  text: For the life of the flesh is in the blood[a], and I have given it to you on the altar to make atonement for your lives[b], for it is the blood that makes atonement by the life.
translation:
  language: hi
  text: क्योंकि देह का जीवन लहू में है, और मैंने उसे तुम्हारे लिए वेदी पर दिया है, ताकि तुम्हारे जीवन के लिए प्रायश्चित किया जाए; क्योंकि लहू ही जीवन के द्वारा प्रायश्चित करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि लहू उसमें निहित जीवन के द्वारा प्रायश्चित करता है।”
    reason: अंतिम पदबंध בַּנֶּפֶשׁ के अधिक स्पष्ट, पर कुछ व्याख्यात्मक, करणार्थक अनुवाद को दर्ज करना।
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: जीवन / प्राणों
  rationale: पहली और अंतिम occurrences में यह जीवित देह के प्राणदायी जीवन को दर्शाता है, इसलिए ‘जीवन’ स्वाभाविक है। עַל נַפְשֹׁתֵיכֶם में बहुवचन और व्यक्तियों के जीवन का संदर्भ बनाए रखने के लिए ‘तुम्हारे प्राणों’ रखा गया है; यहाँ ‘प्राण’ का अर्थ जीवन है, किसी अलग अमूर्त आत्मा का आग्रह नहीं।
- source_word: הַבָּשָׂר
  choice: शरीर
  rationale: यहाँ בשר जीवित प्राणी की देह को सूचित करता है। आधुनिक हिन्दी में ‘शरीर’ स्पष्ट और स्वाभाविक है; ‘मांस’ इस प्रसंग में केवल देह-मांस या खाने के मांस का भ्रामक अर्थ दे सकता है।
- source_word: בַּדָּם
  choice: लहू में
  rationale: בְּ स्थान अथवा क्षेत्र व्यक्त करता है। ‘लहू’ बाइबिलीय-बलिदानी प्रसंग में गरिमापूर्ण और सामान्यतः बोधगम्य है।
- source_word: נְתַתִּיו לָכֶם
  choice: मैंने उसे तुम्हारे लिए दिया है
  rationale: हिब्रू perfect की वर्तमान प्रासंगिकता और לָכֶם के लाभार्थक भाव को आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַל הַמִּזְבֵּחַ
  choice: वेदी पर
  rationale: बलिदानी व्यवस्था का सीधा और प्रचलित हिन्दी पद।
- source_word: לְכַפֵּר
  choice: ताकि ... प्रायश्चित किया जाए
  rationale: כפר के लैव्यव्यवस्था-संबंधी अनुष्ठानिक अर्थ को रखता है और कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: तुम्हारे प्राणों के लिए
  rationale: עַל के हित/संबंध के भाव और נֶפֶשׁ के ‘जीवन’ अर्थ को बनाए रखता है। ‘आत्माओं’ से उत्पन्न संभावित देह-आत्मा द्वैत को नहीं थोपता।
- source_word: כִּי הַדָּם הוּא
  choice: क्योंकि लहू ही
  rationale: כִּי का कारणसूचक बल और הוּא की emphatic पहचान हिन्दी के ‘ही’ से स्वाभाविक ढंग से व्यक्त होती है।
- source_word: בַּנֶּפֶשׁ
  choice: जीवन के द्वारा
  rationale: कठिन और संक्षिप्त हिब्रू पदबंध में בְּ को करणार्थक समझते हुए मूल की theological tension बचाई गई है। अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: יְכַפֵּר
  choice: प्रायश्चित करता है
  rationale: पहले आए כפר के साथ शब्दावली की संगति रखता है और अनुष्ठानिक अर्थ को किसी एक विशिष्ट प्रायश्चित-सिद्धांत तक सीमित नहीं करता।
theological_decisions:
- issue: बलिदानी व्यवस्था में נֶפֶשׁ का अर्थ
  choice: ‘जीवन’ और प्रसंगानुसार ‘प्राणों’
  alternative: ‘आत्मा’ अथवा ‘व्यक्ति’
  rationale: पद लहू की प्रायश्चितकारी भूमिका को उसमें निहित जीवन से जोड़ता है। ‘आत्मा’ कहना हिब्रू में अनिवार्य न होने वाला बाद का मानवशास्त्रीय भेद सुझा सकता है।
- issue: अंतिम उपवाक्य में בַּנֶּפֶשׁ का बल
  choice: ‘जीवन के द्वारा’
  alternative: ‘उसमें निहित जीवन के कारण/द्वारा’ अथवा ‘जीवन में’
  rationale: हिब्रू वाक्यांश व्याकरणतः संक्षिप्त और विवादित है। मुख्य पाठ करणार्थक संभावना रखता है, जबकि पादटिप्पणी अधिक स्पष्ट पर व्याख्यात्मक विकल्प दर्ज करती है।
- issue: כפר का धार्मिक अर्थ
  choice: ‘प्रायश्चित करना’
  alternative: ‘दोष मिटाना’, ‘ढाँपना’ या ‘शुद्ध करना’
  rationale: ‘प्रायश्चित’ लैव्यव्यवस्था के अनुष्ठानिक संदर्भ को पर्याप्त व्यापकता से व्यक्त करता है और क्रिया को किसी एक संप्रदायगत सिद्धांत में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘लहू’, ‘वेदी’ और ‘प्रायश्चित’ बलिदानी प्रसंग के स्थापित बाइबिलीय पद हैं। मुख्य पाठ हिब्रू की पुनरुक्ति और अंतिम वाक्यांश की वास्तविक अस्पष्टता को यथासंभव बनाए रखता है।
