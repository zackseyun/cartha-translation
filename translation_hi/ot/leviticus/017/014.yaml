  text: כִּֽי נֶ֣פֶשׁ כָּל בָּשָׂ֗ר דָּמ֣/וֹ בְ/נַפְשׁ/וֹ֮ הוּא֒ וָֽ/אֹמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל דַּ֥ם כָּל בָּשָׂ֖ר לֹ֣א תֹאכֵ֑לוּ כִּ֣י נֶ֤פֶשׁ כָּל בָּשָׂר֙ דָּמ֣/וֹ הִ֔וא כָּל אֹכְלָ֖י/ו יִכָּרֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/014.yaml
  text: For the life of all flesh is its blood[a]; in its life it is. So I said to the sons of Israel, ‘You shall not eat the blood of any flesh[b], for the life of all flesh is its blood.’ Everyone who eats it shall be cut off.
translation:
  language: hi
  text: क्योंकि हर प्राणी का जीवन उसका रक्त है—वह उसके जीवन में है[a]। इसलिए मैंने इस्राएल के पुत्रों[b] से कहा, ‘तुम किसी भी प्राणी का रक्त न खाना, क्योंकि हर प्राणी का जीवन उसका रक्त है।’ जो कोई उसे खाएगा, वह अलग कर दिया जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी वाक्यांश का अनुवाद ‘उसका रक्त उसके जीवन में है’ अथवा, अधिक व्याख्यात्मक रूप से, ‘उसका रक्त ही उसका जीवन है’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् इस्राएली।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘काट दिया जाएगा।’ यह इब्रानी दंड-सूत्र दंड का साधन स्पष्ट नहीं करता; इसका आशय मृत्यु, समुदाय से अलग किया जाना, या परमेश्वर का न्याय हो सकता है।
    reason: theological_ambiguity
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: जीवन
  rationale: इस आहार-संबंधी और बलिदान-संबंधी प्रसंग में यह शब्द प्राणी के जीवन को दर्शाता है, किसी अभौतिक ‘आत्मा’ को नहीं।
- source_word: בָּשָׂר
  choice: प्राणी
  rationale: शाब्दिक ‘देह/मांस’ हिंदी में यहाँ अस्वाभाविक या भ्रामक हो सकता है; ‘हर प्राणी’ समस्त देहधारी जीवों का आशय स्पष्ट करता है और आवृत्ति बनाए रखता है।
- source_word: דָּם / דָּמוֹ
  choice: रक्त / उसका रक्त
  rationale: रक्त इस निषेध और उसके आधार का केंद्रीय शब्द है, इसलिए इसका सीधा अनुवाद रखा गया है।
- source_word: בְנַפְשׁוֹ הוּא
  choice: वह उसके जीवन में है
  rationale: इब्रानी की संक्षिप्त और कुछ अस्पष्ट रचना को अत्यधिक व्याख्यायित किए बिना रखा गया है; अधिक स्वाभाविक वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: וָאֹמַר
  choice: इसलिए मैंने ... कहा
  rationale: संयोजक यहाँ बताए गए सिद्धांत से आज्ञा की ओर निष्कर्षात्मक बढ़त दिखाता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल इब्रानी पदबंध को औपचारिक रूप से सुरक्षित रखा गया है; उसका स्वाभाविक सामूहिक अर्थ पादटिप्पणी में स्पष्ट है।
- source_word: לֹא תֹאכֵלוּ
  choice: तुम ... न खाना
  rationale: यह हिंदी में सीधी, गंभीर और स्वाभाविक निषेधात्मक आज्ञा है।
- source_word: אֹכְלָיו
  choice: जो कोई उसे खाएगा
  rationale: कृदंत का सार्वत्रिक और व्यक्ति-व्यक्ति पर लागू होने वाला भाव स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: יִכָּרֵת
  choice: काटकर अलग कर दिया जाएगा
  rationale: वाचा-संबंधी दंड की इब्रानी उपमा बनाए रखी गई है, पर यह तय नहीं किया गया कि इसका साधन मृत्यु, समुदाय से निष्कासन या ईश्वरीय न्याय है।
theological_decisions:
- issue: रक्त और נֶפֶשׁ का संबंध
  choice: נֶפֶשׁ को ‘जीवन’ कहा गया है और रक्त को प्राणी के जीवन से अभिन्न रूप में जोड़ा गया है।
  alternative: ‘आत्मा’ अथवा रक्त को केवल जीवन का प्रतीक कहना
  rationale: पद रक्त-निषेध का आधार जीवन और रक्त के संबंध में रखता है; ‘आत्मा’ बाद की तत्त्वमीमांसात्मक धारणा ला सकती है, जबकि ‘प्रतीक’ कहना मूल से अधिक व्याख्यात्मक होगा।
- issue: יִכָּרֵת दंड का स्वरूप
  choice: ‘काटकर अलग कर दिया जाएगा’ कहकर दंड का रूप अनिर्धारित रखा गया है।
  alternative: मार डाला जाएगा; समुदाय से निकाल दिया जाएगा; नष्ट किया जाएगा
  rationale: इब्रानी सूत्र इस पद में दंड के निश्चित साधन को स्पष्ट नहीं करता; इसलिए किसी एक विवादित अर्थ को मुख्य पाठ में नहीं थोपा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, किंतु व्यवस्था-संबंधी गंभीरता बनाए रखती है। ‘रक्त’ को ‘खून’ पर वरीयता दी गई है। कठिन आरंभिक इब्रानी वाक्य को पूरी तरह सहज बनाकर उसकी वास्तविक अस्पष्टता मिटाई नहीं गई; पादटिप्पणी उसके प्रमुख संभावित अर्थ देती है।
