base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/008.yaml
  text: 'And you shall say to them: Any man from the house of Israel[a], or from the sojourner who sojourns among them[b], who offers up a burnt offering or a sacrifice—'
translation:
  language: hi
  text: '“और उनसे कहना: इस्राएल के घराने में से कोई भी पुरुष[a], या उनके बीच रहनेवाला कोई परदेशी[b], जो होमबलि या बलिदान चढ़ाए—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘पुरुष, पुरुष’ है; यह कानूनी मुहावरा प्रत्येक अलग मामले, अर्थात् ‘कोई भी पुरुष’, को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् ऐसा गैर-इस्राएली जो इस्राएलियों के बीच रहता हो; इसका अनुवाद ‘निवासी परदेशी’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲלֵהֶם תֹּאמַר
  choice: और उनसे कहना
  rationale: संयोजक वाव पिछले विधान से संबंध बनाए रखता है, और यहाँ अपूर्ण क्रिया मूसा को दिए गए निर्देश के रूप में प्रयुक्त है। हिंदी में ‘कहना’ स्वाभाविक निर्देशात्मक शैली है।
- source_word: אִישׁ אִישׁ
  choice: कोई भी पुरुष
  rationale: दोहराया हुआ אִישׁ कानूनी भाषा का वितरणसूचक मुहावरा है, जिसका अर्थ प्रत्येक लागू पुरुष से है; ‘कोई भी’ इस वितरणसूचक बल को व्यक्त करता है।
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने में से
  rationale: ‘घराना’ मूल के सामुदायिक-वाचाई पद ‘घर’ को सुरक्षित रखता है, जबकि ‘में से’ prefixed מִן का स्वाभाविक हिंदी रूप है।
- source_word: וּמִן הַגֵּר אֲשֶׁר יָגוּר בְּתוֹכָם
  choice: या उनके बीच रहनेवाला कोई परदेशी निवासी
  rationale: גֵּר किसी ऐसे गैर-इस्राएली को सूचित करता है जो समुदाय के बीच निवास करता है। ‘परदेशी निवासी’ उसकी विदेशी पहचान और स्थानीय निवास, दोनों को स्पष्ट करता है।
- source_word: אֲשֶׁר יַעֲלֶה
  choice: जो ... चढ़ाए
  rationale: עלה का हिफ़ील रूप बलिदानी संदर्भ में किसी भेंट को वेदी पर अर्पित करने का अर्थ देता है; हिंदी में ‘चढ़ाए’ स्थापित और सहज धार्मिक पद है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह उस बलि का पारंपरिक और संक्षिप्त हिंदी नाम है जो पूर्णतः वेदी पर जलाई जाती थी।
- source_word: אוֹ זָבַח
  choice: या कोई बलिदान
  rationale: यहाँ זֶבַח होमबलि से अलग, वध करके चढ़ाई जानेवाली बलि के व्यापक वर्ग को दर्शाता है; ‘बलिदान’ स्वाभाविक और पर्याप्त रूप से व्यापक है।
theological_decisions:
- issue: אִישׁ אִישׁ का लिंगयुक्त वितरणसूचक प्रयोग
  choice: कोई भी पुरुष
  alternative: कोई भी व्यक्ति / जो कोई
  rationale: मूल पाठ व्याकरणिक रूप से पुल्लिंग एकवचन को वितरणसूचक कानूनी मुहावरे के रूप में प्रयोग करता है। मुख्य पाठ में ‘पुरुष’ उस रूप को सुरक्षित रखता है, जबकि पादटिप्पणी उसके प्रत्येक मामले पर लागू होनेवाले कानूनी बल को स्पष्ट करती है।
- issue: גֵּר की सामाजिक-वाचाई श्रेणी
  choice: परदेशी निवासी
  alternative: प्रवासी / परदेशी / अजनबी
  rationale: यह पद इस्राएल के बीच रहनेवाले गैर-इस्राएली को दर्शाता है, केवल आगंतुक या अपरिचित व्यक्ति को नहीं। ‘परदेशी निवासी’ दोनों पहलुओं को बिना आधुनिक कानूनी आव्रजन श्रेणी थोपे व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण कानूनी-धार्मिक शैली रखी गई है। वाक्य को मूल की तरह अगले पद में जारी रहनेवाली शर्त के रूप में दीर्घ विराम-चिह्न पर छोड़ा गया है। ‘होमबलि’ और ‘बलिदान’ प्रचलित बाइबलीय शब्दावली हैं; ‘परदेशी निवासी’ सामान्य पाठक के लिए श्रेणी को स्पष्ट करता है।
