base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/010.yaml
  text: And any man from the house of Israel[a], or from the sojourner who sojourns among them, who eats any blood—I will set my face against the person who eats the blood[c][b], and I will cut him off from among his people.
translation:
  language: hi
  text: “इस्राएल के घराने का कोई भी पुरुष, या उनके बीच निवास करनेवाला कोई परदेशी[a], जो किसी भी प्रकार का खून खाए, मैं उस खून खानेवाले व्यक्ति[b] के विरुद्ध अपना मुख करूँगा और उसे उसके लोगों के बीच से काट डालूँगा[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात विदेशी मूल का ऐसा व्यक्ति जो उनके बीच निवास करता हो; इसे “प्रवासी” या “निवासी विदेशी” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “वह प्राण/व्यक्ति जो खाता है”; यहाँ आशय अपराध करनेवाले व्यक्ति से है।
    reason: lexical_alternative
  - marker: c
    text: “काट डालना” वाचागत दण्ड का सूत्र है। यह पद अपने आप में स्पष्ट नहीं करता कि इसका अर्थ मृत्यु, समुदाय से निष्कासन, या किसी अन्य प्रकार का दैवी न्याय है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אִישׁ
  choice: कोई भी पुरुष
  rationale: दोहराया हुआ אִישׁ वितरणात्मक कानूनी प्रयोग है, जिसका अर्थ ‘कोई भी पुरुष’ या ‘जो कोई’ है; यहाँ मूल का पुल्लिंग रूप बनाए रखा गया है।
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने का
  rationale: ‘घराना’ मूल की वाचाई और कानूनी अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּמִן הַגֵּר הַגָּר בְּתוֹכָם
  choice: या उनके बीच रहनेवाला कोई परदेशी
  rationale: גֵּר ऐसे गैर-इस्राएली निवासी को दर्शाता है जो समुदाय के बीच रहता है; ‘परदेशी’ के साथ ‘बीच रहनेवाला’ यह अर्थ स्पष्ट करता है।
- source_word: אֲשֶׁר יֹאכַל כָּל דָּם
  choice: किसी भी प्रकार का खून खाए
  rationale: כָּל דָּם पूर्ण निषेध व्यक्त करता है; ‘किसी भी प्रकार का खून’ आधुनिक हिन्दी में इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: וְנָתַתִּי פָנַי
  choice: मैं ... के विरुद्ध अपना मुख करूँगा
  rationale: यह परमेश्वर के सक्रिय विरोध और न्याय का स्थिर मुहावरा है; ‘अपना मुख करूँगा’ मूल की मानवरूपी छवि को सुरक्षित रखता है।
- source_word: בַּנֶּפֶשׁ הָאֹכֶלֶת
  choice: उस खून खानेवाले व्यक्ति के विरुद्ध
  rationale: यहाँ נֶפֶשׁ अपराध करनेवाले व्यक्ति को दर्शाता है, न कि अलग किसी तत्त्व के रूप में ‘आत्मा’ को।
- source_word: וְהִכְרַתִּי אֹתָהּ מִקֶּרֶב עַמָּהּ
  choice: उसे उसके लोगों के बीच से काट डालूँगा
  rationale: ‘काट डालना’ मूल वाचाई दण्ड-सूत्र को बनाए रखता है और दण्ड की ठीक विधि को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: ‘काट डालूँगा’ दण्ड-सूत्र का अर्थ
  choice: मूल मुहावरे को बनाए रखा गया है और उसकी विधि निश्चित नहीं की गई।
  alternative: ‘मार डालूँगा’, ‘समुदाय से निकाल दूँगा’, या ‘दैवी न्याय से नष्ट करूँगा’
  rationale: यह पद कठोर वाचाई न्याय घोषित करता है, पर यहाँ यह नहीं बताता कि उसका अर्थ मृत्यु, निष्कासन या कोई अन्य दैवी दण्ड है; इसलिए मूल की व्याख्यात्मक अनिश्चितता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कानूनी-वाचाई शैली रखी गई है। ‘खून’ सामान्य पाठक के लिए स्वाभाविक है; ‘इस्राएल का घराना’, ‘अपना मुख करना’ और ‘काट डालना’ जैसे मूल मुहावरे अर्थ की धार्मिक तथा व्याख्यात्मक गहराई बनाए रखते हैं।
