source:
  edition: WLC
  text: וְ/כָל נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּ/טְרֵפָ֔ה בָּ/אֶזְרָ֖ח וּ/בַ/גֵּ֑ר וְ/כִבֶּ֨ס בְּגָדָ֜י/ו וְ/רָחַ֥ץ בַּ/מַּ֛יִם וְ/טָמֵ֥א עַד הָ/עֶ֖רֶב וְ/טָהֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/015.yaml
  text: And every person who eats an animal found dead or one torn by beasts[a], whether native or sojourner, shall wash his clothes and bathe in water, and he shall be unclean until the evening[b]; then he shall be clean.
translation:
  language: hi
  text: और जो कोई किसी ऐसे पशु का मांस खाए जो अपने-आप मर गया हो या जिसे किसी हिंसक पशु ने फाड़ डाला हो[a]—चाहे वह देशी हो या परदेशी निवासी[b]—वह अपने कपड़े धोए और पानी से स्नान करे। वह शाम तक अशुद्ध रहेगा; उसके बाद वह शुद्ध होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपने-आप मरे हुए पशु’ के लिए इब्रानी पद ऐसा पशु सूचित करता है जो विधिवत वध के बिना मर गया हो।
    reason: lexical_clarification
  - marker: b
    text: ‘परदेशी निवासी’ से आशय इस्राएलियों के बीच रहने वाले बाहरी निवासी से है।
    reason: lexical_clarification
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: जो कोई
  rationale: विधिक प्रसंग में इसका अर्थ किसी व्यक्ति से है; हिंदी में शर्तसूचक वाक्य के लिए ‘जो कोई’ स्वाभाविक है।
- source_word: נְבֵלָה
  choice: ऐसे पशु का मांस ... जो अपने-आप मर गया हो
  rationale: यह उस पशु के शव को सूचित करता है जो विधिवत वध के बिना मर गया हो; भोजन के संदर्भ में ‘मांस’ जोड़ने से हिंदी में आशय स्पष्ट होता है।
- source_word: טְרֵפָה
  choice: जिसे जंगली पशु ने फाड़ डाला हो
  rationale: शब्द किसी हिंसक जीव द्वारा फाड़े गए पशु को दर्शाता है; यह कारण को स्पष्ट रखते हुए मूल अर्थ सुरक्षित करता है।
- source_word: אֶזְרָח
  choice: देशी
  rationale: इस्राएली समाज के मूल निवासी सदस्य के लिए संक्षिप्त और सहज कानूनी पद।
- source_word: גֵּר
  choice: प्रवासी
  rationale: यह समुदाय के बीच रहने वाले बाहरी निवासी को दर्शाता है, केवल राहगीर या अतिथि को नहीं।
- source_word: וְכִבֶּס בְּגָדָיו
  choice: अपने कपड़े धोए
  rationale: अनुष्ठानिक निर्देश का स्वाभाविक आधुनिक हिंदी रूप।
- source_word: וְרָחַץ בַּמַּיִם
  choice: पानी से स्नान करे
  rationale: यह शरीर धोने का निर्देश है; ‘स्नान करे’ स्पष्ट और गरिमापूर्ण है।
- source_word: וְטָמֵא עַד הָעֶרֶב
  choice: शाम तक अशुद्ध रहेगा
  rationale: यहाँ अशुद्धता अनुष्ठानिक स्थिति है और उसकी समय-सीमा स्पष्ट है।
- source_word: וְטָהֵר
  choice: उसके बाद वह शुद्ध होगा
  rationale: धुलाई, स्नान और समयावधि के पूरा होने के बाद अनुष्ठानिक शुद्धता की पुनर्स्थापना व्यक्त होती है।
theological_decisions:
- issue: लैव्यव्यवस्था की शुद्धता-विधि में अशुद्धता का स्वरूप
  choice: טָמֵא/טָהֵר को ‘अशुद्ध/शुद्ध’ के रूप में प्रस्तुत किया गया है, जिसका अर्थ यहाँ अनुष्ठानिक स्थिति है।
  alternative: ‘अपवित्र/पवित्र किया गया’ या नैतिक दोष की भाषा
  rationale: पद भोजन से उत्पन्न अस्थायी अनुष्ठानिक स्थिति का विधान करता है; नैतिक अपराध या आंतरिक भ्रष्टता का अर्थ जोड़ना मूल से अधिक कहना होगा।
translation_notes:
  register: आधुनिक मानक हिंदी, सामान्य पाठकों के लिए स्पष्ट किंतु विधिक और धार्मिक प्रसंग के अनुरूप गरिमापूर्ण। ‘अशुद्ध/शुद्ध’ को नैतिक निंदा के बजाय लैव्यव्यवस्था की अनुष्ठानिक श्रेणी के रूप में रखा गया है।
