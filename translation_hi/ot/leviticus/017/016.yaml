  text: וְ/אִם֙ לֹ֣א יְכַבֵּ֔ס וּ/בְשָׂר֖/וֹ לֹ֣א יִרְחָ֑ץ וְ/נָשָׂ֖א עֲוֺנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/016.yaml
  text: But if he does not wash his clothes and does not bathe his body[b][a], then he shall bear his guilt.
translation:
  language: hi
  text: परन्तु यदि वह अपने कपड़े न धोए और अपने शरीर को न नहाए, तो वह अपने दोष का भार उठाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपने दोष का भार उठाएगा’ का अर्थ यह भी हो सकता है कि वह अपने दोष और उसके परिणाम के लिए उत्तरदायी ठहरेगा।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: पिछले पद में दी गई शुद्धि-विधि के विपरीत स्थिति प्रस्तुत होती है; इसलिए सशर्त और विरोधसूचक दोनों भाव व्यक्त किए गए हैं।
- source_word: יְכַבֵּס
  choice: अपने कपड़े न धोए
  rationale: पिएल रूप सामान्यतः वस्त्र धोने के लिए आता है। मूल में कर्म लुप्त है, पर पिछले पद और विधिक प्रयोग से ‘कपड़े’ स्पष्ट रूप से निहित है।
- source_word: וּבְשָׂרוֹ לֹא יִרְחָץ
  choice: अपने शरीर को न नहाए
  rationale: בשר का शाब्दिक अर्थ ‘मांस’ है, किन्तु स्नान के इस प्रसंग में इसका आशय पूरा शरीर है। ‘नहाए’ वस्त्र धोने और शरीर धोने की क्रियाओं में स्वाभाविक भेद रखता है।
- source_word: וְנָשָׂא עֲוֹנוֹ
  choice: तो वह अपने अधर्म का भार उठाएगा
  rationale: यह विधिक मुहावरा दोष और उसके परिणाम—दोनों को समेट सकता है। ‘अधर्म का भार उठाना’ मूल की ठोस अभिव्यक्ति और उसकी अर्थगत व्यापकता बनाए रखता है।
theological_decisions:
- issue: ‘अपना עון उठाना’ विधिक अभिव्यक्ति का अर्थ
  choice: अपने अधर्म का भार उठाएगा
  alternative: अपने दोष का फल भोगेगा / अपने अधर्म का दण्ड उठाएगा
  rationale: इब्रानी अभिव्यक्ति अपराध, दोष-दायित्व और उसके परिणाम को एक साथ सूचित कर सकती है। मुख्य पाठ में केवल ‘दण्ड’ कहने से अर्थ अनावश्यक रूप से संकुचित हो जाता; इसलिए मूल का तनाव बनाए रखा गया है और पादटिप्पणी में विस्तार दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक शैली रखी गई है। ‘शरीर’ ने प्रसंगानुसार शाब्दिक ‘मांस’ का अर्थ स्पष्ट किया है। ‘अधर्म का भार उठाएगा’ जानबूझकर कुछ व्यापक रखा गया है, ताकि दोष और दण्ड के बीच मूल इब्रानी की अर्थगत गुंजाइश बनी रहे।
