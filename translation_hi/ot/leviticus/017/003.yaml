base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/003.yaml
  text: Any man from the house of Israel who slaughters an ox or a sheep or a goat in the camp[a], or who slaughters it outside the camp—
translation:
  language: hi
  text: “इस्राएल के घराने का कोई भी पुरुष[a], जो छावनी के भीतर या छावनी के बाहर किसी बैल, भेड़ या बकरी का वध करे—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “पुरुष, पुरुष” है। यह वितरणात्मक अभिव्यक्ति है और इस्राएली समाज के किसी भी सदस्य के लिए सामान्य रूप से प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: कोई भी पुरुष
  rationale: दोहराया गया संज्ञा-रूप वितरणात्मक मुहावरा है, जिसका अर्थ ‘कोई भी पुरुष’ या ‘हर पुरुष’ है। ‘कोई भी पुरुष’ मूल के व्याकरणिक रूप और विधिक व्यापकता दोनों को बनाए रखता है।
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने का
  rationale: यह मूल वाचा-संबंधी राष्ट्रीय मुहावरे ‘इस्राएल के घराने’ को सुरक्षित रखता है।
- source_word: יִשְׁחַט
  choice: वध करे
  rationale: क्रिया पशु को काटकर मारने, विशेषकर बलिदानी संदर्भ में, प्रयुक्त होती है। ‘वध करे’ वर्तमान हिंदी में गरिमापूर्ण और संदर्भानुकूल है।
- source_word: שׁוֹר
  choice: बैल
  rationale: बलिदान योग्य बड़े पालतू पशु के लिए प्रचलित और सहज हिंदी शब्द; यह सूची में एकवचन पशु के रूप में स्वाभाविक है।
- source_word: כֶשֶׂב
  choice: भेड़
  rationale: यह शब्द सामान्य रूप से भेड़ को सूचित कर सकता है, केवल मेमने को नहीं; इसलिए ‘भेड़’ आयु की अनावश्यक विशिष्टता से बचता है।
- source_word: עֵז
  choice: बकरी
  rationale: इस पशु-संज्ञा का सामान्य और स्वाभाविक हिंदी रूप।
- source_word: בַּמַּחֲנֶה ... מִחוּץ לַמַּחֲנֶה
  choice: छावनी के भीतर या छावनी के बाहर
  rationale: दोनों स्थान-विकल्पों का स्पष्ट समानांतर रूप देता है और हिंदी में स्वाभाविक है।
- source_word: אֲשֶׁר ... אֲשֶׁר
  choice: जो ... या ...
  rationale: हिंदी वाक्य में एक ही संबंधवाचक खंड के अंतर्गत दोनों वैकल्पिक स्थानों को जोड़ना मूल की विधिक समानांतरता और अर्थ को सहज रूप से व्यक्त करता है।
