source:
  edition: WLC
  text: לְמַעַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת זִבְחֵי/הֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל פְּנֵ֣י הַ/שָּׂדֶה֒ וֶֽ/הֱבִיאֻ֣/ם לַֽ/יהוָ֗ה אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵ֑ן וְ/זָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽ/יהוָ֖ה אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/005.yaml
  text: so that the sons of Israel may bring their sacrifices that they are sacrificing in the open field[a], and bring them to Yahweh at the entrance of the tent of meeting, to the priest[b], and sacrifice them as peace offerings to Yahweh.
translation:
  language: hi
  text: ताकि इस्राएल के पुत्र[a] अपने उन बलिदानों को, जिन्हें वे खुले मैदान में चढ़ाते हैं, याहवे के लिए मिलाप के तंबू के प्रवेश-द्वार पर याजक के पास ले आएँ और उन्हें याहवे के लिए मेल-बलियों[b] के रूप में चढ़ाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली”; मूल में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: या “शांति-बलियाँ” अथवा “कुशल-बलियाँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: ताकि
  rationale: यह पिछले आदेश का उद्देश्य बताता है और आधुनिक हिन्दी में प्रयोजन का स्वाभाविक बोध कराता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: इब्रानी के पारिवारिक और व्याकरणतः पुल्लिंग बहुवचन रूप को औपचारिक रूप से बनाए रखता है; अधिक मुहावरेदार विकल्प ‘इस्राएली’ है।
- source_word: זִבְחֵיהֶם אֲשֶׁר הֵם זֹבְחִים
  choice: अपने उन बलिदानों को ... जिन्हें वे ... चढ़ाते हैं
  rationale: זבח की बलिदान-संबंधी पुनरावृत्ति को यथासंभव रखते हुए हिन्दी में सहज वाक्य बनाया गया है; कृदन्त जारी या प्रचलित क्रिया का भाव देता है।
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: खुले मैदान में
  rationale: शब्दशः ‘मैदान की सतह पर’ के बजाय यह बाहर खुले क्षेत्र में किए जाने वाले बलिदान का स्वाभाविक अर्थ व्यक्त करता है।
- source_word: וְהֱבִיאֻם לַיהוָה
  choice: वे उन्हें याहवे के पास ... लाएँ
  rationale: स्पष्ट कर्म-प्रत्यय ‘उन्हें’ को बनाए रखता है और आरम्भिक ‘ले आएँ’ के बाद स्रोत की पुनरावृत्ति भी सुरक्षित रखता है।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के द्वार पर
  rationale: पवित्रस्थान के निर्धारित प्रवेश-स्थान के लिए प्रचलित, स्पष्ट और गरिमापूर्ण हिन्दी अभिव्यक्ति है।
- source_word: אֶל הַכֹּהֵן
  choice: याजक के पास
  rationale: इब्रानी निश्चित उपपद के अनुसार उस स्थान पर सेवा करने वाले निर्दिष्ट याजक का संकेत बना रहता है।
- source_word: זִבְחֵי שְׁלָמִים
  choice: मेल-बलि
  rationale: यह विशिष्ट बलिदान-श्रेणी को संक्षेप में व्यक्त करता है और שׁלם से जुड़े मेल, कुशल और संपूर्णता के अर्थक्षेत्र की ओर संकेत करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יהוה है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक संदर्भ
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल की संतान
  rationale: मुख्य पाठ में मूल का पारिवारिक, पुल्लिंग रूप रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि यह इस्राएली समुदाय के लिए प्रयुक्त पद है।
- issue: זִבְחֵי שְׁלָמִים की बलिदान-श्रेणी
  choice: मेल-बलि
  alternative: शांति-बलि; कुशल-बलि
  rationale: शब्द का अर्थ केवल आंतरिक शांति तक सीमित नहीं है; इसमें मेल, कुशलता और संपूर्णता का व्यापक भाव हो सकता है। इसलिए एक व्यवहार्य पारंपरिक पद मुख्य पाठ में और विकल्प पादटिप्पणी में रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। स्रोत में ‘लाने’ की पुनरावृत्ति को दो वाक्यांशों में बनाए रखा गया है। ‘इस्राएल के पुत्र’ औपचारिक स्रोत-साम्य के कारण रखा गया है, और उसका स्वाभाविक सामुदायिक अर्थ पादटिप्पणी में दिया गया है।
