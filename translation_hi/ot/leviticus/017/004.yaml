source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֣הֶל מוֹעֵד֮ לֹ֣א הֱבִיא/וֹ֒ לְ/הַקְרִ֤יב קָרְבָּן֙ לַֽ/יהוָ֔ה לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה דָּ֣ם יֵחָשֵׁ֞ב לָ/אִ֤ישׁ הַ/הוּא֙ דָּ֣ם שָׁפָ֔ךְ וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מִ/קֶּ֥רֶב עַמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/004.yaml
  text: 'and has not brought it to the entrance of the tent of meeting to present it as an offering to Yahweh before the tabernacle of Yahweh[a], blood shall be imputed to that man: he has shed blood[c][b], and that man shall be cut off from among his people.'
translation:
  language: hi
  text: और यदि वह उसे मिलाप के तंबू के प्रवेश-द्वार पर, याहवे के पवित्र निवास के सामने, याहवे को भेंट के रूप में चढ़ाने के लिए नहीं लाया, तो उस मनुष्य को रक्तपात का दोषी माना जाएगा[a]; उसने खून बहाया है। उस मनुष्य को उसके लोगों के बीच से काट दिया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “उस मनुष्य के लिए खून गिना जाएगा।” इसका आशय रक्तपात की जवाबदेही या दोष से है।
    reason: lexical_alternative
  - marker: b
    text: “काट दिया जाएगा” से यहाँ यह स्पष्ट नहीं होता कि दंड मृत्युदंड, निष्कासन, या वाचा के समुदाय से किसी अन्य प्रकार का हटाया जाना है।
    reason: cultural_note
lexical_decisions:
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के द्वार पर
  rationale: यह इस्राएली पवित्रस्थान के लिए प्रचलित और सुबोध हिन्दी पद है; פֶּתַח का स्थानवाचक अर्थ ‘द्वार पर’ स्वाभाविक रूप से व्यक्त होता है।
- source_word: הֱבִיאוֹ
  choice: वह उसे ... नहीं लाया
  rationale: हिफ़ील क्रिया का अर्थ ‘लाना’ है और ‘उसे’ पिछले पद में वध किए गए पशु की ओर संकेत करता है।
- source_word: לְהַקְרִיב קָרְבָּן
  choice: भेंट के रूप में चढ़ाने के लिए
  rationale: הקריב का बल बलिदानी संदर्भ में पास लाकर अर्पित करने पर है; यह अनुवाद हिन्दी में अनावश्यक पुनरुक्ति से बचते हुए קָרְבָּן को ‘भेंट’ के रूप में रखता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: याहवे के निवास-स्थान के सामने
  rationale: מִשְׁכָּן मूलतः निवास या निवास-स्थान है; यह पद उसके पवित्रस्थान-संबंधी अर्थ को स्पष्ट रखते हुए ‘मिलापवाले तंबू’ से शब्दगत भेद भी बनाए रखता है।
- source_word: דָּם יֵחָשֵׁב לָאִישׁ הַהוּא
  choice: उस मनुष्य को रक्तपात का दोषी माना जाएगा
  rationale: शाब्दिक रूप से ‘उस मनुष्य के लिए खून गिना जाएगा’; कानूनी संदर्भ में यह रक्तपात की जवाबदेही बताता है। मुख्य पाठ स्वाभाविक हिन्दी देता है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: דָּם שָׁפָךְ
  choice: उसने खून बहाया है
  rationale: यह मूल इब्रानी मुहावरे का सीधा और हिन्दी में प्रचलित रूप है।
- source_word: וְנִכְרַת ... מִקֶּרֶב עַמּוֹ
  choice: उस मनुष्य को उसके लोगों के बीच से काट दिया जाएगा
  rationale: ‘काट दिया जाएगा’ मूल वाचा-संबंधी कानूनी अभिव्यक्ति को बनाए रखता है और दंड की अनिर्दिष्ट विधि को किसी एक अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: דָּם יֵחָשֵׁב का कानूनी मुहावरा
  choice: उस मनुष्य को रक्तपात का दोषी माना जाएगा
  alternative: उस मनुष्य के लिए खून गिना जाएगा
  rationale: संदर्भ अनधिकृत पशुवध को रक्तपात की जवाबदेही ठहराता है। स्वाभाविक हिन्दी में कानूनी आशय स्पष्ट किया गया है, जबकि मूल की ठोस और कुछ हद तक अस्पष्ट अभिव्यक्ति पादटिप्पणी में दी गई है।
- issue: וְנִכְרַת में दंड का स्वरूप
  choice: काट दिया जाएगा
  alternative: मार डाला जाएगा / समुदाय से निकाल दिया जाएगा
  rationale: यह पद स्वयं नहीं बताता कि काटे जाने का अर्थ मृत्युदंड, निष्कासन या वाचा से किसी अन्य प्रकार का हटाया जाना है; इसलिए अस्पष्टता को मुख्य पाठ में बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद पिछले वाक्य की शर्त को आगे बढ़ाता है; हिन्दी में खंड को पठनीय बनाने के लिए आरंभ में ‘यदि’ जोड़ा गया है। ‘मनुष्य’ मूल के पुल्लिंग एकवचन को बनाए रखता है।
