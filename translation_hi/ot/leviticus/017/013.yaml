  text: וְ/אִ֨ישׁ אִ֜ישׁ מִ/בְּנֵ֣י יִשְׂרָאֵ֗ל וּ/מִן הַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם אֲשֶׁ֨ר יָצ֜וּד צֵ֥יד חַיָּ֛ה אוֹ ע֖וֹף אֲשֶׁ֣ר יֵאָכֵ֑ל וְ/שָׁפַךְ֙ אֶת דָּמ֔/וֹ וְ/כִסָּ֖/הוּ בֶּ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/013.yaml
  text: And any man from the sons of Israel[a], or from the sojourner who sojourns among them, who hunts game—whether wild animal or bird—that may be eaten[b], shall pour out its blood and cover it with earth.
translation:
  language: hi
  text: और इस्राएल के पुत्रों में से कोई भी पुरुष, या उनके बीच रहनेवाला कोई परदेशी, यदि खाने योग्य किसी वन-पशु या पक्षी का शिकार करे, तो वह उसका लहू बहा दे और उसे[a] मिट्टी से ढक दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसे’ का सबसे स्वाभाविक अर्थ ‘लहू को’ है; अर्थात् लहू को मिट्टी से ढक देना।
    reason: मूल हिब्रू के सर्वनाम का संदर्भ स्पष्ट करना।
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: कोई भी पुरुष
  rationale: दोहराया हुआ אִישׁ वितरणात्मक अर्थ देता है; ‘कोई भी पुरुष’ उस अर्थ और पुल्लिंग अभिव्यक्ति दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों में से
  rationale: यह בני ישראל की पारिवारिक और वाचागत भाषा को औपचारिक किंतु बोधगम्य रूप में सुरक्षित रखता है।
- source_word: הַגֵּר הַגָּר בְּתוֹכָם
  choice: उनके बीच रहनेवाला कोई परदेशी
  rationale: גר समुदाय में निवास करनेवाले गैर-इस्राएली को सूचित करता है; हिन्दी में संज्ञा और समजात क्रिया की हूबहू पुनरावृत्ति अस्वाभाविक होती, इसलिए अर्थ को सहज रूप दिया गया है।
- source_word: יָצוּד צֵיד
  choice: शिकार करे
  rationale: हिब्रू की समजात क्रिया-संज्ञा रचना का स्वाभाविक हिन्दी समतुल्य ‘शिकार करे’ है।
- source_word: חַיָּה אוֹ עוֹף
  choice: वन-पशु या पक्षी
  rationale: शिकार के प्रसंग में חַיָּה सामान्य पशु नहीं, जंगली पशु का बोध कराता है; ‘वन-पशु’ संक्षिप्त और स्पष्ट है।
- source_word: אֲשֶׁר יֵאָכֵל
  choice: खाने योग्य
  rationale: निफ़अल रूप यहाँ भोजन के लिए अनुमत या उपयुक्त होने का भाव देता है; ‘खाने योग्य’ उस अर्थ को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: וְשָׁפַךְ אֶת־דָּמוֹ
  choice: उसका लहू बहा दे
  rationale: वाव-सहित पूर्ण क्रिया का यहाँ विधिक आदेशात्मक बल है; ‘बहा दे’ वर्तमान हिन्दी में स्पष्ट निर्देश देता है।
- source_word: וְכִסָּהוּ בֶּעָפָר
  choice: उसे मिट्टी से ढक दे
  rationale: עָפָר यहाँ धूल या भुरभुरी मिट्टी हो सकता है; इस क्रिया के प्रसंग में ‘मिट्टी’ अधिक स्वाभाविक है। ‘उसे’ मूल के सर्वनाम को बनाए रखता है।
theological_decisions:
- issue: וְכִסָּהוּ में कर्म-सर्वनाम का संदर्भ
  choice: मुख्य पाठ में ‘उसे’ रखा गया है, जिसका निकटतम और स्वाभाविक पूर्वपद लहू है
  alternative: इसे मारे गए पशु या पक्षी के संदर्भ में समझना
  rationale: व्याकरण और लैव्यव्यवस्था 17 के रक्त-विषयक प्रसंग में लहू सबसे स्वाभाविक संदर्भ है; फिर भी मूल का सर्वनाम बनाए रखने से पाठ अनावश्यक रूप से विस्तार नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; विधिक गरिमा बनाए रखते हुए वाक्य को सामान्य पाठक के लिए सहज रखा गया है। ‘लहू’ लैव्यव्यवस्था के धार्मिक-विधिक प्रसंग में ‘खून’ की अपेक्षा अधिक गरिमापूर्ण और प्रचलित बाइबलीय शब्द है।
