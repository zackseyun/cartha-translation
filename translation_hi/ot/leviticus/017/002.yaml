language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/אֶל֙ כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵי/הֶ֑ם זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/002.yaml
  text: Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them, ‘This is the thing that Yahweh has commanded[b], saying,’
translation:
  language: hi
  text: हारून, उसके पुत्रों और इस्राएल के सभी पुत्रों[a] से बोल और उनसे कह, “यह वह बात[b] है जिसकी आज्ञा याहवे ने दी है:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सभी इस्राएलियों”; परम्परागत रूप से “इस्राएल की सभी सन्तानें”।
    reason: lexical_alternative
  - marker: b
    text: “बात” के स्थान पर “वचन” या “विषय” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: बोल
  rationale: यह पिएल आज्ञार्थक, द्वितीय पुरुष एकवचन है। ‘बोल’ मूसा को दी गई सीधी आज्ञा की शक्ति और अगले ‘कह’ से उसका भेद बनाए रखता है।
- source_word: בָּנָיו
  choice: उसके पुत्रों
  rationale: पुल्लिंग बहुवचन रूप हारून के पुत्रों, अर्थात याजकीय भूमिका वाले पुरुष वंशजों, को सूचित करता है; इसलिए व्यापक ‘संतानों’ के बजाय ‘पुत्रों’ रखा गया है।
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी पुत्रों
  rationale: यह इस्राएली समुदाय का प्रचलित जातीय-सामुदायिक पद है, पर मूल की पारिवारिक अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखा गया है; अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: और उनसे कह
  rationale: पहली आज्ञा के बाद आने वाली समन्वित आज्ञा को सरल और प्रत्यक्ष हिन्दी में रखा गया है।
- source_word: זֶה הַדָּבָר
  choice: यह वह बात है
  rationale: דָּבָר का अर्थ ‘वचन’, ‘बात’ या ‘विषय’ हो सकता है। यहाँ यह आगे आने वाली आज्ञा का परिचय देता है, इसलिए ‘बात’ स्वाभाविक है और अर्थ को अनावश्यक रूप से केवल बोले हुए ‘वचन’ तक सीमित नहीं करता।
- source_word: צִוָּה
  choice: आज्ञा ... दी है
  rationale: पूर्ण क्रिया को वर्तमान प्रभाव वाली पूर्व आज्ञा के रूप में स्वाभाविक हिन्दी पूर्णकाल में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाली उक्ति का परिचय देता है। हिन्दी में उद्धरण के अंतर्गत द्विबिंदु अगले पद में आने वाली आज्ञा को स्वाभाविक ढंग से संकेत करता है, बिना कृत्रिम ‘यह कहते हुए’ जोड़े।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: בְּנֵי יִשְׂרָאֵל की पारिवारिक अभिव्यक्ति
  choice: इस्राएल के सभी पुत्रों
  alternative: सभी इस्राएलियों; इस्राएल की सभी सन्तानों
  rationale: यह पद समुदाय के लिए रूढ़ जातीय नाम की तरह प्रयुक्त होता है, फिर भी मुख्य पाठ मूल की पुल्लिंग पारिवारिक बनावट को बनाए रखता है और उसके सामुदायिक अर्थ को पादटिप्पणी स्पष्ट करती है।
- issue: זֶה הַדָּבָר में דָּבָר का अर्थ
  choice: यह वह बात है
  alternative: यह वह वचन है; यह वह विषय है
  rationale: सन्दर्भ में यह आगे दिए जाने वाले आदेश का सूत्रात्मक परिचय है। ‘बात’ शब्द ‘वचन’ और ‘विषय’ के बीच मूल की अर्थ-व्याप्ति को अपेक्षाकृत खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष आज्ञार्थक रूप अपनाया गया है। मूल में ‘बोल’ और ‘कह’ की पुनरुक्ति जानबूझकर सुरक्षित है। उद्धरण अगले पद में जारी रहने के कारण अंत में द्विबिंदु रखा गया है।
