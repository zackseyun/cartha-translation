lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: यह रूप कथा में वाणी की नई घटना आरम्भ करता है। हिंदी में अगले לֵאמֹר के साथ पूरे सूत्र का स्वाभाविक और सटीक रूप ‘ने…कहा’ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֶל
  choice: से
  rationale: ‘बोलना/कहना’ के हिंदी वाक्य-विन्यास में संबोधित व्यक्ति को ‘से’ द्वारा स्वाभाविक रूप से चिह्नित किया जाता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: यह מֹשֶׁה नाम का मानक हिंदी बाइबलीय रूप है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह आगे आने वाली वाणी की विषयवस्तु प्रस्तुत करने वाला सूत्र है। हिंदी में וַיְדַבֵּר…לֵאמֹר का अक्षरशः दोहराव अस्वाभाविक होता; संयुक्त रूप ‘ने…कहा’ उसका अर्थ स्पष्ट रूप से देता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
