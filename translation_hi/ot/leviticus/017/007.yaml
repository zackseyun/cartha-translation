  text: וְ/לֹא יִזְבְּח֥וּ עוֹד֙ אֶת זִבְחֵי/הֶ֔ם לַ/שְּׂעִירִ֕ם אֲשֶׁ֛ר הֵ֥ם זֹנִ֖ים אַחֲרֵי/הֶ֑ם חֻקַּ֥ת עוֹלָ֛ם תִּֽהְיֶה זֹּ֥את לָ/הֶ֖ם לְ/דֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/007.yaml
  text: They shall no longer sacrifice their sacrifices to the goat-demons, after which they prostitute themselves. This shall be a permanent statute for them throughout their generations.
translation:
  language: hi
  text: वे फिर कभी अपने बलिदान बकरे-रूपी दुष्टात्माओं[a] को न चढ़ाएँ, जिनके पीछे वे व्यभिचार करते हैं[b]। यह उनके लिए पीढ़ी-दर-पीढ़ी स्थायी विधि होगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बकरे की आकृति वाली मूर्तियों” अथवा “सटायरों”; इब्रानी शब्द का शाब्दिक संबंध बकरों या रोएँदार प्राणियों से है और यहाँ वह निषिद्ध उपासना से जुड़े बकरे-जैसे प्राणियों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “जिनके पीछे वे वेश्यावृत्ति करते हैं”; यह धार्मिक बेवफाई या मूर्तिपूजा का रूपक है।
    reason: cultural_note
  - marker: c
    text: या “सदा की विधि” अथवा “चिरस्थायी विधि।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ ... זִבְחֵיהֶם
  choice: अपने बलिदान ... न चढ़ाएँ
  rationale: निषेधात्मक अपूर्ण क्रिया को स्वाभाविक हिन्दी विधिक निषेध में रखा गया है। हिन्दी में संज्ञा और क्रिया की अनावश्यक पुनरुक्ति से बचाते हुए बलिदान का उपासना-संबंधी अर्थ सुरक्षित है।
- source_word: עוֹד
  choice: फिर कभी ... न
  rationale: यह पहले से चली आ रही अथवा पूर्व में हुई प्रथा को आगे न दोहराने का निषेध स्पष्ट करता है।
- source_word: לַשְּׂעִירִם
  choice: बकरे-जैसे दुष्टात्माओं
  rationale: शब्द का मूल बकरे अथवा रोएँदार प्राणी से जुड़ा है, पर इस उपासना-संदर्भ में अलौकिक और मूर्तिपूजक आशय सम्भावित है। यह चयन बकरे की आकृति और दुष्टात्मिक संदर्भ दोनों बनाए रखता है।
- source_word: זֹנִים אַחֲרֵיהֶם
  choice: जिनके पीछे वे वेश्यागमन करते हैं
  rationale: मूल का स्पष्ट यौन रूपक धार्मिक बेवफाई के लिए प्रयुक्त है; उसे केवल 'मूर्तिपूजा करते हैं' कहकर सपाट नहीं किया गया। 'जिनके' सजीव माने गए दुष्टात्माओं से मेल खाता है।
- source_word: חֻקַּת עוֹלָם
  choice: स्थायी विधि
  rationale: विधिक सूत्र में दीर्घकालिक और बाध्यकारी स्वर स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है, जबकि 'सनातन' से उत्पन्न सम्भावित अतिरिक्त धार्मिक अर्थ से बचा गया है।
- source_word: לְדֹרֹתָם
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह आने वाली क्रमिक पीढ़ियों में विधि की निरंतर लागू होने की बात सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: שְּׂעִירִם का उपासना-संदर्भ में अभिप्राय
  choice: बकरे-जैसे दुष्टात्माएँ
  alternative: बकरे; बकरे की मूर्तियाँ; वनदेव/सटायर
  rationale: साधारण पशुओं को बलिदान चढ़ाने की अपेक्षा यहाँ निषिद्ध धार्मिक उपासना के अलौकिक पात्र अधिक सम्भावित हैं। फिर भी पादटिप्पणी में शब्द की संभावित मूर्ति-संबंधी व्याख्या सुरक्षित रखी गई है।
- issue: זֹנִים में धार्मिक बेवफाई का रूपक
  choice: वेश्यागमन का रूपक स्पष्ट रूप से बनाए रखना
  alternative: बेवफा होते हैं; मूर्तिपूजा करते हैं
  rationale: इब्रानी पाठ यौन-अनैतिकता की तीखी भाषा द्वारा धार्मिक बेवफाई व्यक्त करता है। व्याख्यात्मक विकल्पों की तुलना में मूल रूपक को बनाए रखना पाठ की धार्मिक और भावात्मक तीव्रता सुरक्षित रखता है।
- issue: עוֹלָם की कालगत शक्ति
  choice: स्थायी
  alternative: सदा की; चिरस्थायी
  rationale: वाचा-विधि के सूत्र में निरंतरता व्यक्त की गई है, बिना इस मुहावरे की दार्शनिक रूप से अनंत अवधि पहले से तय किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। विधिक स्वर हेतु “न चढ़ाएँ” और “विधि होगी” प्रयुक्त हैं। मूल की कठोर धार्मिक-बेवफाई की उपमा को जानबूझकर बनाए रखा गया है; वैकल्पिक शब्दार्थ पादटिप्पणियों में दिए गए हैं।
