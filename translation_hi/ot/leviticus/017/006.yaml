  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/זָרַ֨ק הַ/כֹּהֵ֤ן אֶת הַ/דָּם֙ עַל מִזְבַּ֣ח יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הִקְטִ֣יר הַ/חֵ֔לֶב לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/006.yaml
  text: And the priest shall throw the blood against the altar of Yahweh at the entrance of the tent of meeting[b][a], and shall burn the fat as a pleasing aroma to Yahweh.
translation:
  language: hi
  text: और याजक उस खून को मिलापवाले तंबू के प्रवेश-द्वार पर यहोवा की वेदी पर छिड़केगा[a], और चर्बी को यहोवा के लिए सुखद सुगंध[b] के रूप में जलाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “छिड़केगा” का अर्थ यहाँ खून को वेदी पर अनुष्ठानपूर्वक फेंककर या उछालकर लगाना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस वाक्यांश का अनुवाद “मनभावनी सुगंध” या “शांतिदायक सुगंध” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַק
  choice: छिड़केगा
  rationale: बलि-संबंधी संदर्भ में यह क्रिया खून को वेदी पर अनुष्ठानपूर्वक फेंककर या उछालकर लगाने को बताती है। सहज हिन्दी में ‘छिड़केगा’ प्रचलित है; पादटिप्पणी इसके अपेक्षाकृत प्रबल क्रियात्मक भाव को स्पष्ट करती है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: कोहेन के लिए मानक, गरिमापूर्ण और सामान्य हिन्दी बाइबलीय शब्द।
- source_word: הַדָּם
  choice: उस खून को
  rationale: निर्दिष्ट बलि-पशु के रक्त का संकेत है; ‘खून’ आधुनिक सामान्य हिन्दी में ‘रक्त’ से अधिक सहज है।
- source_word: עַל מִזְבַּח יְהוָה
  choice: यहोवा की वेदी पर
  rationale: זָרַק के साथ עַל खून को वेदी पर/उसके विरुद्ध लगाने का भाव देता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और क्रिया की विधि पादटिप्पणी में बताई गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम की स्थापित लिप्यंतरण-परंपरा ‘यहोवा’ है; इसे उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के प्रवेश-द्वार पर
  rationale: स्थान-सूचक वाक्यांश को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है; ‘मिलापवाला तंबू’ אֹהֶל מוֹעֵד का परिचित हिन्दी रूप है।
- source_word: וְהִקְטִיר
  choice: जलाएगा
  rationale: हिफ़ील रूप बलि को वेदी पर जलाकर धुएँ के रूप में चढ़ाने की याजकीय क्रिया बताता है; ‘जलाएगा’ संदर्भ में स्पष्ट और सहज है।
- source_word: הַחֵלֶב
  choice: चर्बी
  rationale: यह बलि की वे चर्बीदार चरबियाँ हैं जो वेदी पर जलाई जाती थीं; ‘चर्बी’ आधुनिक हिन्दी में सीधा समतुल्य है।
- source_word: לְרֵיחַ נִיחֹחַ
  choice: सुखदायक सुगंध के रूप में
  rationale: यह स्थिर बलि-वाक्यांश यहोवा को स्वीकार्य और प्रसन्न करनेवाली सुगंध का भाव रखता है; ‘सुखदायक’ उस भाव को बिना अधिक व्याख्या के बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ल उपसर्ग बलि के यहोवा की ओर निर्देशित होने का भाव देता है; हिन्दी में ‘के लिए’ स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए स्थापित रूप ‘यहोवा’ नाम को नाम के रूप में सुरक्षित रखता है और उसे केवल उपाधि ‘प्रभु’ से नहीं बदलता।
- issue: רֵיחַ נִיחֹחַ का भाव
  choice: सुखदायक सुगंध
  alternative: मनभावनी सुगंध; सुगंधित महक
  rationale: वाक्यांश को केवल भौतिक गंध तक सीमित न करके बलि की स्वीकार्यता और प्रसन्नता का भाव रहने दिया गया है, पर इसका अतिरिक्त धर्मवैज्ञानिक अर्थ मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘खून’ और ‘चर्बी’ जैसे ठोस शब्द मूल के प्रत्यक्ष बलि-संबंधी चित्र को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न संबंधित पदांश के तुरंत बाद रखे गए हैं।
