source:
  edition: WLC
  text: עַל כֵּ֤ן אָמַ֨רְתִּי֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל כָּל נֶ֥פֶשׁ מִ/כֶּ֖ם לֹא תֹ֣אכַל דָּ֑ם וְ/הַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶ֖ם לֹא יֹ֥אכַל דָּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/012.yaml
  text: Therefore I said to the sons of Israel[a], ‘No person among you shall eat blood[b], and the sojourner who sojourns among you shall not eat blood.’
translation:
  language: hi
  text: इसी कारण मैंने इस्राएल के पुत्रों से कहा, ‘तुममें से कोई भी व्यक्ति खून न खाए, और जो परदेशी तुम्हारे बीच रहता है[a], वह भी खून न खाए।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“परदेशी” से आशय ऐसे गैर-इस्राएली व्यक्ति से है जो इस्राएलियों के बीच रहकर उनकी सामुदायिक व्यवस्था के अधीन था; अन्य सम्भव अनुवाद: “निवासी विदेशी।”'
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: यह पद पिछले कथन से निकला निष्कर्ष बताता है; ‘इसी कारण’ उसके अनुमानात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אָמַרְתִּי
  choice: मैंने ... कहा
  rationale: साधारण पूर्ण भूतकाल कानूनी-वर्णनात्मक संदर्भ में मूल क्रिया के अर्थ को सीधे व्यक्त करता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों से
  rationale: यह मूल इब्रानी के पुरुषवाची प्रतिनिधिक पदबंध को बनाए रखता है; इसे अधिक व्याख्यात्मक ‘इस्राएलियों’ में नहीं बदला गया।
- source_word: כָּל נֶפֶשׁ מִכֶּם
  choice: तुममें से कोई भी व्यक्ति
  rationale: נֶפֶשׁ यहाँ अलग-अलग व्यक्ति के लिए मुहावरेदार ढंग से प्रयुक्त है; ‘प्राण’ या ‘आत्मा’ इस कानूनी संदर्भ में भ्रामक होता।
- source_word: לֹא תֹאכַל דָּם
  choice: खून न खाए
  rationale: यह निषेध को स्पष्ट और स्वाभाविक हिन्दी में रखता है तथा ‘खून खाना’ की मूल ठोस अभिव्यक्ति को बनाए रखता है।
- source_word: הַגֵּר
  choice: परदेशी
  rationale: यहाँ גֵּר ऐसे गैर-इस्राएली निवासी को दर्शाता है जो इस्राएली समुदाय के बीच रहता और उसकी सामुदायिक व्यवस्था के अधीन होता है; ‘परदेशी’ सामान्य हिन्दी में सुबोध है।
- source_word: הַגָּר בְּתוֹכְכֶם
  choice: जो परदेशी तुम्हारे बीच रहता है
  rationale: यह कृदंत वाक्यांश के निवास-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; साथ की टिप्पणी परदेशी की कानूनी-सामुदायिक स्थिति स्पष्ट करती है।
- source_word: לֹא יֹאכַל דָּם
  choice: वह भी खून न खाए
  rationale: दोहराया गया निषेध परदेशी पर भी समान रूप से लागू है; हिन्दी का ‘भी’ इस समानांतरता को स्पष्ट करता है।
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל में वाचा-समुदाय का पुरुषवाची नाम
  choice: इस्राएल के पुत्रों से
  alternative: इस्राएलियों से / इस्राएल की सन्तान से
  rationale: चुना हुआ रूप मूल की शाब्दिक लैंगिक अभिव्यक्ति सुरक्षित रखता है, पर इससे यह अतिरिक्त दावा नहीं किया जाता कि आदेश केवल वयस्क पुरुषों तक सीमित था।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध कानूनी शैली। ‘खून’ सामान्य आधुनिक हिन्दी के कारण चुना गया; ‘रक्त’ अधिक औपचारिक विकल्प है। मुख्य पाठ में मूल की पुनरुक्ति और निषेधात्मक बल बनाए रखा गया है।
