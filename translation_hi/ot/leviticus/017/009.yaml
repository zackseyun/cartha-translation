source:
  edition: WLC
  text: וְ/אֶל פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ לֹ֣א יְבִיאֶ֔/נּוּ לַ/עֲשׂ֥וֹת אֹת֖/וֹ לַ/יהוָ֑ה וְ/נִכְרַ֛ת הָ/אִ֥ישׁ הַ/ה֖וּא מֵ/עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/017/009.yaml
  text: and does not bring it to the entrance of the tent of meeting to offer it to Yahweh[b][a], that man shall be cut off from his people.
translation:
  language: hi
  text: और उसे मिलापवाले तंबू के प्रवेश-द्वार पर न लाए ताकि वह उसे याहवे के लिए बलि चढ़ाए[a], तो वह मनुष्य अपने लोगों में से काट दिया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “उसे याहवे के लिए करने के लिए”; यहाँ यह इब्रानी मुहावरा बलि अर्पित करने को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “काट दिया जाएगा” एक कानूनी सूत्र है। यहाँ दंड का ठीक रूप नहीं बताया गया है; इसका अर्थ वाचा के समुदाय से अलग किया जाना या परमेश्वर का सीधा न्याय हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: प्रवेश-द्वार
  rationale: यह शब्द किसी स्थान के खुलने या प्रवेश करने की जगह को दर्शाता है; पवित्रस्थान के संदर्भ में ‘प्रवेश-द्वार’ स्पष्ट और स्वाभाविक है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह जंगल के पवित्र तंबू का स्थापित नाम है। ‘मिलापवाला तंबू’ हिंदी बाइबलीय प्रयोग में परिचित है और उस स्थान को दर्शाता है जहाँ परमेश्वर और इस्राएल की भेंट होती थी।
- source_word: יְבִיאֶנּוּ
  choice: उसे ... न लाए
  rationale: प्रत्यय पिछले संदर्भ में बताए गए बलि-पशु की ओर संकेत करता है। ‘उसे लाए’ ठोस क्रिया को बनाए रखता है।
- source_word: לַעֲשׂוֹת אֹתוֹ לַיהוָה
  choice: उसे याहवे के लिए बलि चढ़ाए
  rationale: शाब्दिक अर्थ ‘उसे याहवे के लिए करना/बनाना’ है, पर बलिदान-संबंधी संदर्भ में यह बलि अर्पित करने का मुहावरा है। स्पष्ट अर्थ मुख्य पाठ में दिया गया है और अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְנִכְרַת
  choice: काट दिया जाएगा
  rationale: निफ़अल रूप के कानूनी मुहावरे को यथासंभव औपचारिक रूप से रखा गया है, क्योंकि दंड किस प्रकार लागू होगा यह पद स्वयं स्पष्ट नहीं करता।
- source_word: הָאִישׁ הַהוּא
  choice: वह मनुष्य
  rationale: इब्रानी में पुल्लिंग एकवचन कानूनी अभिव्यक्ति है; ‘वह मनुष्य’ उसके संकेत और व्याकरणिक रूप को बनाए रखता है।
- source_word: מֵעַמָּיו
  choice: अपने लोगों में से
  rationale: यह अपराधी के अपने समुदाय से अलग किए जाने को व्यक्त करता है और हिंदी में स्वाभाविक है।
theological_decisions:
- issue: ‘काट दिया जाएगा’ दंड का आशय
  choice: औपचारिक अभिव्यक्ति ‘अपने लोगों में से काट दिया जाएगा’ को बनाए रखा गया है।
  alternative: ‘मार डाला जाएगा’, ‘समुदाय से निकाल दिया जाएगा’, या ‘नष्ट कर दिया जाएगा’।
  rationale: यह इब्रानी कानूनी सूत्र इस स्थान पर दंड की ठीक विधि निश्चित नहीं करता। औपचारिक अभिव्यक्ति मृत्यु, समुदाय से बहिष्कार और सीधे दैवी न्याय जैसी संभावनाओं के बीच की वास्तविक अस्पष्टता को सुरक्षित रखती है।
- issue: הָאִישׁ का लिंग-संबंधी रूप
  choice: ‘वह मनुष्य’
  alternative: ‘वह व्यक्ति’ या ‘जो कोई’
  rationale: मूल पाठ पुल्लिंग एकवचन कानूनी अभिव्यक्ति का प्रयोग करता है; अनावश्यक रूप से उसे लिंग-निरपेक्ष नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मिलापवाला तंबू’ परिचित हिंदी बाइबलीय पदावली है। कानूनी सूत्र की अस्पष्टता को मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित रखा गया है।
