  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָיֹ֖ת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/010.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: hi
  text: और दोनों गुर्दे, और उन पर की वह चर्बी जो कटि-प्रदेश पर है, और कलेजे के ऊपर का उपांग[a]—उसे वह गुर्दों के साथ निकाल दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कलेजे का खंड।’ इस अंग-भाग के लिए प्रयुक्त इब्रानी शब्द (יֹתֶרֶת) का ठीक अर्थ अनिश्चित है; मुख्य पाठ में ‘उपांग’ इस अनिश्चितता को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: दोनों गुर्दे
  rationale: बलि-संबंधी शरीर-रचना में כְּלָיֹת स्पष्ट रूप से गुर्दों को दर्शाता है; यह ठोस और सहज आधुनिक हिन्दी शब्द है।
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: उन पर की चर्बी
  rationale: חֵלֶב यहाँ बलि के लिए अलग की जाने वाली भीतरी चर्बी है, और सापेक्ष उपवाक्य उसके गुर्दों पर होने का स्थान बताता है।
- source_word: הַכְּסָלִים
  choice: कमर के दोनों ओर
  rationale: यह शब्द कमर/पार्श्व के उस क्षेत्र को सूचित करता है जहाँ गुर्दे स्थित होते हैं। यह अनुवाद हिन्दी में स्वाभाविक रहते हुए स्थान-संबंधी अर्थ सुरक्षित रखता है।
- source_word: הַיֹּתֶרֶת
  choice: उपांग
  rationale: यह यकृत से जुड़े किसी अंग-भाग के लिए प्रयुक्त अनिश्चित शरीर-रचनात्मक शब्द है। ‘उपांग’ किसी निश्चित आधुनिक संरचना को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: עַל הַכָּבֵד
  choice: कलेजे के ऊपर का
  rationale: עַל स्थान अथवा जुड़ाव बता सकता है। ‘ऊपर का’ मूल की व्यापक स्थान-संबंधी अभिव्यक्ति को बनाए रखता है।
- source_word: עַל הַכְּלָיֹת יְסִירֶנָּה
  choice: इसे वह गुर्दों के साथ निकाल दे
  rationale: एकवचन स्त्रीलिंग प्रत्यय निकटवर्ती יֹתֶרֶת की ओर संकेत करता है; इस बलि-विधि में עַל को गुर्दों के साथ निकालने के प्रक्रियात्मक अर्थ में स्वाभाविक हिन्दी दी गई है।
