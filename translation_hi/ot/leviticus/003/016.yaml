source:
  edition: WLC
  text: וְ/הִקְטִירָ֥/ם הַ/כֹּהֵ֖ן הַ/מִּזְבֵּ֑חָ/ה לֶ֤חֶם אִשֶּׁה֙ לְ/רֵ֣יחַ נִיחֹ֔חַ כָּל חֵ֖לֶב לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/016.yaml
  text: And the priest shall burn them on the altar as food[a], an offering made by fire for a pleasing aroma[c][b]. All the fat belongs to Yahweh.
translation:
  language: hi
  text: और याजक उन्हें वेदी पर अग्नि-भेंट के भोजन के रूप में, सुखद सुगंध के लिए जलाए। सारी चरबी याहवे की है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְטִירָם
  choice: और याजक उन्हें … जलाए
  rationale: बलिदान के प्रसंग में קטר का हिफ़ील रूप वेदी पर जलाकर धुआँ ऊपर उठाने को दर्शाता है। ‘जलाए’ सहज हिन्दी है, और ‘उन्हें’ मूल के बहुवचन कर्म-प्रत्यय को बनाए रखता है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक प्रत्यय यहाँ जलाने के स्थान को बताता है; हिन्दी में ‘वेदी पर’ स्वाभाविक और सटीक है।
- source_word: לֶחֶם אִשֶּׁה
  choice: भोजन के रूप में … आग में चढ़ाई गई भेंट
  rationale: לֶחֶם का अर्थ यहाँ केवल ‘रोटी’ नहीं, व्यापक रूप से ‘भोजन’ है; אִשֶּׁה अग्नि के द्वारा चढ़ाई जाने वाली भेंट को सूचित करता है। यह रूपक और बलिदानी अभिव्यक्ति दोनों को स्पष्ट रखता है।
- source_word: לְרֵיחַ נִיחֹחַ
  choice: जिसकी सुगंध मनभावनी है
  rationale: यह स्थिर बलिदानी पदबंध स्वीकार्य अथवा प्रसन्न करने वाली सुगंध का रूपक बनाए रखता है, बिना उसके धर्मवैज्ञानिक आशय को मुख्य पाठ में अधिक खोलने के।
- source_word: כָּל חֵלֶב
  choice: सारी चरबी
  rationale: כָּל की समग्रता और बलिदान में निर्धारित चरबी के अंगों का संदर्भ दोनों सुरक्षित रहते हैं।
- source_word: לַיהוָה
  choice: याहवे की है
  rationale: ל यहाँ समर्पण अथवा अधिकार का भाव देता है। ‘याहवे की है’ संक्षिप्त, स्वाभाविक और मूल के वाचा-नाम को प्रत्यक्ष रूप से प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और वाचा-नाम को किसी उपाधि से नहीं बदलता।
- issue: बलिदानी सूत्र לְרֵיחַ נִיחֹחַ
  choice: जिसकी सुगंध मनभावनी है
  alternative: सुखदायक सुगंध के लिए; सुहावनी सुगंध के लिए
  rationale: यह चयन मूल के सुगंध-संबंधी रूपक और परमेश्वर के सम्मुख भेंट की स्वीकार्यता के बीच की धर्मवैज्ञानिक अर्थ-छाया को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। बलिदानी तकनीकी अर्थ को स्पष्ट करने के लिए ‘आग में चढ़ाई गई भेंट’ कहा गया है; ‘चरबी’ और ‘वेदी’ जैसे परिचित बाइबलीय शब्द बनाए रखे गए हैं।
