id: LEV.3.9
reference: Leviticus 3:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִקְרִ֨יב מִ/זֶּ֣בַח הַ/שְּׁלָמִים֮ אִשֶּׁ֣ה לַ/יהוָה֒ חֶלְבּ/וֹ֙ הָ/אַלְיָ֣ה תְמִימָ֔ה לְ/עֻמַּ֥ת הֶ/עָצֶ֖ה יְסִירֶ֑/נָּה וְ/אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/009.yaml
  text: 'And from the sacrifice of peace offerings he shall present an offering made by fire to Yahweh: its fat[a], the whole fat tail, which he shall remove close to the backbone, and the fat that covers the entrails, and all the fat that is on the entrails[c][b],'
translation:
  language: hi
  text: 'और वह शान्ति-बलि[a] में से याहवे के लिए अग्नि में चढ़ाया जाने वाला अर्पण प्रस्तुत करे: उसकी चरबी—पूरी चरबीदार पूँछ[b], जिसे वह रीढ़ के पास से[c] अलग करे—और वह चरबी जो अंतड़ियों को ढके रहती है, तथा वह सारी चरबी जो अंतड़ियों पर लगी रहती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सहभागिता-बलि” अथवा “कुशल-क्षेम की बलि।”
    reason: lexical_alternative
  - marker: b
    text: यह भेड़ की चौड़ी, चरबीदार पूँछ है, जिसे बलि में पूरा चढ़ाया जाता था।
    reason: cultural_note
  - marker: c
    text: या “रीढ़ के सामने से” अथवा “रीढ़ के निचले सिरे से।” इब्रानी वाक्यांश का सटीक शारीरिक संकेत अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח הַשְּׁלָמִים
  choice: शान्ति-बलि
  rationale: यह बलिदान-सम्बन्धी पारिभाषिक पद है। ‘शान्ति-बलि’ परम्परागत पहचान बनाए रखता है, जबकि पादटिप्पणी में सहभागिता और कुशल-क्षेम के अर्थ-पक्ष सुरक्षित रखे गए हैं।
- source_word: אִשֶּׁה
  choice: अग्नि में चढ़ाया जाने वाला अर्पण
  rationale: यह वेदी की आग पर चढ़ाए जाने वाले अर्पण को दर्शाता है; यह अनुवाद अनुष्ठानिक अर्थ स्पष्ट करता है और इसे साधारण भोजन नहीं बनाता।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम יהוה है; उसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: חֶלְבּוֹ
  choice: उसकी चरबी
  rationale: यह बलि के लिए निर्धारित पशु की चरबी के भागों का सामान्य परिचय देता है।
- source_word: הָאַלְיָה תְמִימָה
  choice: पूरी चरबीदार पूँछ
  rationale: אַלְיָה भेड़ की विशिष्ट मोटी, चरबीदार पूँछ है और תְמִימָה उसके पूरे अथवा अखण्ड रूप में निकाले जाने को बताता है।
- source_word: לְעֻמַּת הֶעָצֶה
  choice: रीढ़ के पास से
  rationale: यह पूँछ हटाने के स्थान को रीढ़/मेरुदण्ड के सम्बन्ध में बताता है। सटीक स्थान-वाचक सम्बन्ध कुछ अस्पष्ट है, इसलिए अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: יְסִירֶנָּה
  choice: जिसे वह ... अलग करे
  rationale: हिफ़िल रूप का अर्थ हटाना या अलग करना है; सम्बन्धवाचक वाक्यांश इसे चरबीदार पूँछ से स्वाभाविक रूप से जोड़ता है।
- source_word: הַחֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: वह चरबी जो अंतड़ियों को ढके रहती है
  rationale: बलि-पशु की शारीरिक रचना के इस सन्दर्भ में קֶרֶב भीतर के अंगों/अंतड़ियों को दर्शाता है।
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: वह सारी चरबी जो अंतड़ियों पर लगी रहती है
  rationale: यह पिछले वाक्यांश की ढकने वाली चरबी और भीतर के अंगों पर लगी सारी चरबी के बीच मूल पाठ का सूक्ष्म भेद बनाए रखता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा-नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यन्तरण है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: זֶבַח הַשְּׁלָמִים का अर्थ-पक्ष
  choice: शान्ति-बलि
  alternative: सहभागिता-बलि; कुशल-क्षेम की बलि
  rationale: इस बलि के नाम में शान्ति, कुशलता और सहभागिता से जुड़े अर्थ-पक्ष सम्भव हैं। मुख्य पाठ में परिचित पारिभाषिक रूप रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं, ताकि किसी एक धर्मवैज्ञानिक व्याख्या को अनिवार्य न बनाया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और अनुष्ठानिक सन्दर्भ के अनुकूल रखी गई है। ‘प्रस्तुत करे’, ‘अर्पण’ और ‘अलग करे’ औपचारिक हैं, पर सामान्य पाठक के लिए स्पष्ट हैं। शरीर-रचना के लिए अत्यधिक तकनीकी शब्दों के बजाय ‘रीढ़’ और ‘अंतड़ियाँ’ प्रयुक्त हुए हैं।
