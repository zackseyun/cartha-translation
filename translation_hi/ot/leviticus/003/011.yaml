  text: The priest shall burn it on the altar as food[a], an offering made by fire to Yahweh.
translation:
  language: hi
  text: याजक उसे वेदी पर जलाए; यह याहवे के लिए अग्नि-भेंट का भोजन[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘अग्नि-भेंट की रोटी’; यहाँ ‘रोटी’ बलिदान-व्यवस्था में भोजन के अर्थ में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִירוֹ
  choice: उसे ... जलाए
  rationale: बलिदान-संबंधी प्रसंग में קטר का हिफ़ील रूप वेदी पर जलाने और धुआँ उठाने को दर्शाता है। ‘जलाए’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया का अनुष्ठानिक अर्थ स्पष्ट रखता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के उपासना-संबंधी प्रसंग में כֹּהֵן के लिए मानक और गरिमापूर्ण हिन्दी शब्द।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक रूप यहाँ उस स्थान को बताता है जहाँ बलि का अंश जलाया जाता है; हिन्दी में ‘वेदी पर’ स्वाभाविक है।
- source_word: לֶחֶם
  choice: भोजन
  rationale: לֶחֶם का सामान्य अर्थ ‘रोटी’ है, पर यहाँ बलिदान-संबंधी मुहावरे में यह वेदी पर चढ़ाए जाने वाले भोजन को सूचित करता है। ‘भोजन’ शाब्दिक आधार को बनाए रखते हुए वास्तविक रोटी का भ्रामक संकेत नहीं देता।
- source_word: אִשֶּׁה
  choice: आग में चढ़ाई गई भेंट
  rationale: यह तकनीकी बलिदान-संबंधी शब्द आग के द्वारा प्रस्तुत की जाने वाली भेंट को दर्शाता है। यह हिन्दी रूप अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत दिव्य नाम יהוה को ‘यहोवा’ से और समर्पण-सूचक ל को ‘के लिए’ से व्यक्त किया गया है।
theological_decisions:
- issue: לֶחֶם אִשֶּׁה में बलिदान-संबंधी ‘भोजन’ की भाषा
  choice: वह भोजन है, यहोवा के लिए आग में चढ़ाई गई भेंट
  alternative: वह अग्नि-भेंट का भोजन है
  rationale: मुख्य पाठ ‘भोजन’ और ‘आग में चढ़ाई गई भेंट’ दोनों पदों को बनाए रखता है तथा उन्हें समानाधिकरण में रखता है। इससे परमेश्वर की शारीरिक आवश्यकता का अर्थ आरोपित किए बिना इब्रानी की उपासना-संबंधी चित्रात्मक भाषा और उसकी कुछ व्याकरणिक कसावट सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और उपासना-संबंधी गरिमा वाली रखी गई है। ‘याजक’, ‘वेदी’ और ‘भेंट’ सामान्य बाइबिलीय हिन्दी से परिचित शब्द हैं; वाक्य का डैश इब्रानी पदबंध के समानाधिकरण को पठनीय बनाता है।
