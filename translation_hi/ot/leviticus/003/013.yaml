source:
  edition: WLC
  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹאשׁ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/013.yaml
  text: And he shall lay his hand on its head and slaughter it before the tent of meeting[a], and the sons of Aaron shall throw its blood against the altar all around.
translation:
  language: hi
  text: वह अपना हाथ उसके सिर पर रखे और उसे मिलाप के तंबू के सामने वध करे। हारून के पुत्र वेदी के चारों ओर उसका लहू उछालें[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वेदी के चारों ओर उसका लहू जोर से डालें।” बलिदान-संबंधी प्रसंगों में इब्रानी क्रिया का अर्थ लहू को वेदी की ओर उछालकर या जोर से डालकर लगाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת־יָדוֹ
  choice: अपना हाथ … रखे
  rationale: सामक् यद् की बलिदान-संबंधी अभिव्यक्ति उपासक द्वारा पशु के सिर पर एक हाथ रखने या टिकाने को बताती है। हिंदी में “हाथ रखे” स्वाभाविक है और इब्रानी के एकवचन “हाथ” को बनाए रखता है।
- source_word: עַל־רֹאשׁוֹ
  choice: उसके सिर पर
  rationale: प्रत्यय बलि के पशु की ओर संकेत करता है; हिंदी में पशु के लिए “उसके” स्वाभाविक और स्पष्ट है।
- source_word: וְשָׁחַט אֹתוֹ
  choice: उसे … वध करे
  rationale: שׁחט बलिदान के लिए विधिपूर्वक पशु मारने का सामान्य क्रियापद है। “वध करे” इस विशेष अर्थ को साधारण “मार डाले” से अधिक ठीक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: मिलाप के तंबू के सामने
  rationale: यह उपासना-स्थान का पारिभाषिक नाम है। “मिलाप का तंबू” आधुनिक हिंदी में समझने योग्य है और “के सामने” स्थान-संबंधी अर्थ को स्पष्ट रखता है।
- source_word: בְּנֵי אַהֲרֹן
  choice: हारून के पुत्र
  rationale: यह इब्रानी की औपचारिक याजकीय पदवी और संबंध दोनों को सीधे बनाए रखता है।
- source_word: וְזָרְקוּ
  choice: उछालें
  rationale: זרק यहाँ लहू को वेदी की ओर जोर से डालने या उछालकर लगाने की बलिदानी क्रिया बताता है। “उछालें” सीधे क्रियात्मक बल को रखता है; “छिड़कें” किसी दूसरी, अधिक हल्की क्रिया का आभास दे सकता है।
- source_word: אֶת־דָּמוֹ
  choice: उसका लहू
  rationale: प्रत्यय बलि के पशु की ओर संकेत करता है। “लहू” धार्मिक प्रसंग में प्रचलित, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है।
- source_word: עַל־הַמִּזְבֵּחַ סָבִיב
  choice: वेदी पर चारों ओर
  rationale: עַל क्रिया के लक्ष्य के रूप में वेदी को और סביב उसके चारों ओर होने वाले व्यापक प्रयोग को बताता है। हिंदी क्रम क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
