base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/007.yaml
  text: If he is presenting a sheep as his offering[a], then he shall present it before Yahweh.
translation:
  language: hi
  text: यदि वह अपनी भेंट के लिए भेड़[a] लाता है, तो वह उसे याहवे के सामने प्रस्तुत करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मेमना’।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह बलिदान-संबंधी निर्देशों में एक शर्तयुक्त स्थिति आरंभ करता है; आधुनिक हिन्दी में ‘यदि’ स्पष्ट और स्वाभाविक है।
- source_word: כֶּשֶׂב
  choice: भेड़
  rationale: यह शब्द भेड़, और संदर्भानुसार मेमने, को सूचित कर सकता है। मुख्य पाठ में व्यापक अर्थ वाला ‘भेड़’ रखा गया है और ‘मेमना’ पाद-टिप्पणी में सुरक्षित है।
- source_word: מַקְרִיב
  choice: चढ़ाता है
  rationale: हिफ़ील कृदंत यहाँ भेंट के रूप में पशु को निकट लाने/अर्पित करने का अर्थ देता है; ‘चढ़ाता है’ हिन्दी के बलिदानी संदर्भ में स्वाभाविक है।
- source_word: קָרְבָּנוֹ
  choice: अपनी भेंट के रूप में
  rationale: קָרְבָּן परमेश्वर के पास लाई गई सामान्य भेंट है; यह अभिव्यक्ति पशु और उसकी भेंटगत भूमिका का संबंध स्पष्ट करती है।
- source_word: וְהִקְרִיב אֹתוֹ
  choice: तो वह उसे ... प्रस्तुत करे
  rationale: विधिक संदर्भ में यह क्रम और निर्देश व्यक्त करता है। ‘प्रस्तुत करे’ पशु को परमेश्वर के सामने लाने की क्रिया को बिना अनावश्यक व्याख्या के दर्शाता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: स्थानिक और उपासना-संबंधी अर्थ में इसका सीधा, स्वाभाविक हिन्दी समतुल्य है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ इसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना सुरक्षित रखता है; ‘याहवे’ अधिक ध्वन्यात्मक विकल्प है।
- issue: כֶּשֶׂב की आयु-संबंधी व्यापकता
  choice: मुख्य पाठ में ‘भेड़’
  alternative: मेमना
  rationale: मूल शब्द सामान्यतः भेड़ को और कभी युवा भेड़ को सूचित कर सकता है। आयु को निश्चित न करते हुए मुख्य पाठ में व्यापक शब्द रखा गया है और विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण विधिक-उपासना शैली। ‘चढ़ाता है’ और ‘प्रस्तुत करे’ के भेद से मूल की दो संबंधित क्रियाओं तथा निर्देशात्मक क्रम को पठनीय रूप में रखा गया है।
