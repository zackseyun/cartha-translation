id: LEV.3.2
reference: Leviticus 3:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/סָמַ֤ךְ יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וּ/שְׁחָט֕/וֹ פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/זָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַ/כֹּהֲנִ֧ים אֶת הַ/דָּ֛ם עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/002.yaml
  text: He shall lay his hand on the head of his offering and slaughter it at the entrance of the tent of meeting[a], and Aaron’s sons, the priests[b], shall throw the blood against the altar all around.
translation:
  language: hi
  text: वह अपने चढ़ावे के सिर पर अपना हाथ रखे और उसे मिलापवाले तंबू के प्रवेश-द्वार[a] पर बलि करे। तब हारून के पुत्र, अर्थात् याजक, वेदी के चारों ओर लहू उछालें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिलापवाले तंबू के द्वार पर।”
    reason: lexical_alternative
  - marker: b
    text: या, “वेदी के चारों ओर लहू फेंकें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: अपना हाथ रखे
  rationale: बलिदान-संबंधी प्रसंग में סמך पशु के सिर पर हाथ रखने या दबाने की क्रिया बताता है। ‘हाथ रखे’ स्वाभाविक हिंदी है और मूल से अधिक दबाव की मात्रा निर्धारित नहीं करता।
- source_word: רֹאשׁ קָרְבָּנוֹ
  choice: अपने चढ़ावे के सिर पर
  rationale: רֹאשׁ शारीरिक ‘सिर’ है और קָרְבָּן परमेश्वर के सामने लाया गया व्यापक प्रकार का चढ़ावा है; ‘चढ़ावा’ यहाँ ‘बलिदान’ से अधिक व्यापक और उपयुक्त है।
- source_word: וּשְׁחָטוֹ
  choice: उसे ... बलि करे
  rationale: שׁחט बलिदानी पशु के विधिपूर्वक वध की क्रिया है। हिंदी में ‘बलि करे’ इस अनुष्ठानिक अर्थ को सामान्य ‘मार डाले’ से बेहतर व्यक्त करता है।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के प्रवेश-द्वार पर
  rationale: פֶּתַח द्वार/प्रवेश का स्थान है। אֹהֶל מוֹעֵד के लिए ‘मिलापवाला तंबू’ परिचित, अर्थपूर्ण और मंदिर-संबंधी बाद की भाषा से अलग पद है।
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: हारून के पुत्र, अर्थात् याजक
  rationale: मूल में ‘याजक’ हारून के पुत्रों की समानाधिकरण पहचान है; ‘अर्थात्’ इस संबंध को साधारण आधुनिक हिंदी में स्पष्ट करता है।
- source_word: וְזָרְקוּ
  choice: उछालें
  rationale: זרק लहू को वेदी पर/उसकी ओर फेंकने या उछालने की क्रिया दर्शाता है। ‘उछालें’ अनुष्ठानिक क्रिया को ‘छिड़कें’ से अलग रखता है, क्योंकि ‘छिड़कना’ किसी दूसरी, अधिक विशिष्ट क्रिया का आभास दे सकता है।
- source_word: אֶת הַדָּם עַל הַמִּזְבֵּחַ סָבִיב
  choice: उसका लहू वेदी के चारों ओर उस पर
  rationale: עַל को वेदी पर लहू लगाए जाने के रूप में और סָבִיב को उसकी चारों ओर की परिधि के रूप में रखा गया है। ‘उसका लहू’ हिंदी में पशु के संदर्भ को स्पष्ट करता है।
theological_decisions:
- issue: लहू लगाने की अनुष्ठानिक क्रिया
  choice: लहू ... उछालें
  alternative: लहू ... छिड़कें / लहू ... फेंकें
  rationale: זרק का मूल बल फेंकने या उछालने पर है। ‘छिड़कें’ संभावित रूप से अलग अनुष्ठानिक तकनीक आयात करता है, जबकि ‘फेंकें’ आधुनिक हिंदी में अनादरपूर्ण सुन सकता है; ‘उछालें’ अर्थ और गरिमा का संतुलन रखता है।
- issue: קָרְבָּן का अनुवाद
  choice: चढ़ावा
  alternative: बलिदान
  rationale: קָרְבָּן व्यापक भेंट/चढ़ावे का पद है। पशु-वध का भाव अगले क्रियापद में पहले ही व्यक्त है, इसलिए संज्ञा को अनावश्यक रूप से संकीर्ण नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आज्ञार्थक विधान के लिए ‘रखे’, ‘बलि करे’ और ‘उछालें’ का प्रयोग हुआ है। ‘मिलापवाला तंबू’ और ‘याजक’ बाइबलीय धार्मिक शब्दावली की परिचितता बनाए रखते हैं।
