  yaml_path: translation/ot/leviticus/003/012.yaml
  text: But if his offering is a goat[a], then he shall present it before Yahweh.
translation:
  language: hi
  text: और यदि उसका चढ़ावा बकरी जाति का पशु हो, तो वह उसे याहवे[a] के सामने प्रस्तुत करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘YHWH’ (परमेश्वर का नाम); पारंपरिक रूप से ‘यहोवा’ अथवा ‘प्रभु’ भी कहा जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: यह संयोजन बलि-विधि में अगले संभावित मामले को प्रस्तुत करता है। ‘और यदि’ क्रम तथा शर्त—दोनों को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: עֵז
  choice: बकरी
  rationale: यह शब्द बकरी जाति के पशु के लिए प्रयुक्त होता है; यहाँ एकवचन रूप रखा गया है। संदर्भ में इसका आशय केवल मादा तक सीमित होना आवश्यक नहीं है, इसलिए इस बात को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: קָרְבָנוֹ
  choice: उसका चढ़ावा
  rationale: קָרְבָּן किसी ऐसी भेंट या चढ़ावे का व्यापक शब्द है जिसे परमेश्वर के सामने लाया जाता है। ‘चढ़ावा’ आधुनिक हिंदी में स्वाभाविक है और ‘बलिदान’ की अपेक्षा कम संकीर्ण है।
- source_word: וְהִקְרִיבוֹ
  choice: तो वह उसे … प्रस्तुत करे
  rationale: קרב के हिफ़ील रूप का अर्थ पास लाना अथवा अर्पण के लिए प्रस्तुत करना है। विधिक संदर्भ का निर्देशात्मक बल ‘प्रस्तुत करे’ से व्यक्त होता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह स्थान अथवा उपस्थिति सूचित करने वाला सीधा और स्वाभाविक हिंदी रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम YHWH को किसी उपाधि से बदलने के बजाय ध्वन्यात्मक रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना प्रस्तुत करता है; वैकल्पिक पारंपरिक रूप पादटिप्पणी में दिया गया है।
- issue: עֵז से पशु के लिंग का संकेत
  choice: मुख्य पाठ में ‘बकरी’, पर पादटिप्पणी में व्यापक अर्थ स्पष्ट
  alternative: केवल मादा बकरी; बकरा या बकरी
  rationale: इब्रानी शब्द बकरी जाति के पशु को सूचित कर सकता है और इस संदर्भ में पशु का लिंग स्पष्ट रूप से सीमित नहीं करता। मुख्य पाठ को अनावश्यक रूप से विस्तृत किए बिना इस अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चढ़ावा’ व्यापक बलि-संबंधी पद को व्यक्त करता है, जबकि ‘प्रस्तुत करे’ विधिक निर्देश और परमेश्वर के सामने लाने की क्रिया—दोनों को संजोता है।
