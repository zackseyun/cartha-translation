source:
  edition: WLC
  text: וְ/הִקְטִ֨ירוּ אֹת֤/וֹ בְנֵֽי אַהֲרֹן֙ הַ/מִּזְבֵּ֔חָ/ה עַל הָ֣/עֹלָ֔ה אֲשֶׁ֥ר עַל הָ/עֵצִ֖ים אֲשֶׁ֣ר עַל הָ/אֵ֑שׁ אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/005.yaml
  text: And Aaron’s sons shall burn it on the altar[a], on top of the burnt offering that is on the wood that is on the fire. It is a food offering, a pleasing aroma to Yahweh.
translation:
  language: hi
  text: हारून के पुत्र उसे वेदी पर, उस होमबलि के ऊपर जो आग पर रखी लकड़ियों पर है, धुएँ में चढ़ाएँ। यह याहवे के लिए आग में चढ़ाई गई भेंट[a] है, एक सुखद सुगंध।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भोजन-भेंट।”
    reason: אִשֶּׁה के लिए एक मान्य वैकल्पिक बलिदानी अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהִקְטִירוּ
  choice: जलाकर उसका धुआँ उठाएँ
  rationale: קטר के हिफ़ील रूप का बल वेदी पर सामग्री जलाने और उसका धुआँ ऊपर उठाने पर है। यह अनुवाद केवल ‘जलाएँ’ की अपेक्षा बलिदानी क्रिया को अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: אֹתוֹ
  choice: उसे
  rationale: यह कर्मवाचक सर्वनाम पिछले पद में बताए गए मेलबलि के उस अंश की ओर संकेत करता है जिसे वेदी पर चढ़ाया जाना है।
- source_word: בְנֵי אַהֲרֹן
  choice: हारून के पुत्र
  rationale: यह इब्रानी संबंध-वाचक संरचना का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है तथा याजकीय पहचान को बनाए रखता है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक प्रत्यय सहित यह रूप बलिदानी सामग्री को वेदी पर रखकर जलाने का गंतव्य बताता है।
- source_word: עַל הָעֹלָה
  choice: होमबलि के ऊपर
  rationale: עַל यहाँ स्थान-संबंध को व्यक्त करता है। ‘होमबलि’ עֹלָה के लिए प्रचलित हिन्दी धार्मिक पद है और ‘के ऊपर’ पाठ की स्थानिक शृंखला को सुरक्षित रखता है।
- source_word: אֲשֶׁר עַל הָעֵצִים אֲשֶׁר עַל הָאֵשׁ
  choice: जो आग पर रखी लकड़ियों पर है
  rationale: 'यह वेदी पर वस्तुओं की क्रमिक व्यवस्था को स्वाभाविक हिन्दी में व्यक्त करता है: होमबलि लकड़ियों पर और लकड़ियाँ आग पर हैं। ‘लकड़ियाँ’ इब्रानी बहुवचन को अनावश्यक विशिष्टता के बिना दर्शाता है।'
- source_word: אִשֵּׁה
  choice: आग में चढ़ाई गई भेंट
  rationale: यह बलिदानी तकनीकी पद अग्नि के द्वारा वेदी पर चढ़ाई गई भेंट को दर्शाता है। हिन्दी में यह अर्थ स्पष्ट है और ‘अग्नि-भेंट’ जैसे कम स्वाभाविक संक्षिप्त रूप से बचता है; वैकल्पिक ‘भोजन-भेंट’ को पादटिप्पणी में रखा गया है।
- source_word: רֵיחַ נִיחֹחַ
  choice: एक सुखद सुगंध
  rationale: यह स्थिर बलिदानी अभिव्यक्ति याहवे को प्रिय या स्वीकार्य सुगंध का भाव देती है। ‘सुखद सुगंध’ सहज है और ‘शांत करने वाली’ जैसा अतिरिक्त भाव नहीं जोड़ती।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל समर्पण या संबंध को व्यक्त करता है। ‘के लिए’ भेंट के याहवे को अर्पित होने का भाव स्वाभाविक हिन्दी में देता है, और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत ध्वन्यात्मक रूप है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: बलिदानी पद אִשֵּׁה का अर्थ
  choice: आग में चढ़ाई गई भेंट
  alternative: भोजन-भेंट
  rationale: शब्द की व्युत्पत्ति और बलिदानी प्रयोग के संबंध में दोनों अर्थ-परंपराएँ मिलती हैं। मुख्य पाठ अग्नि से चढ़ाने के स्पष्ट संदर्भ को व्यक्त करता है, जबकि ‘भोजन-भेंट’ के सांस्कृतिक-बलिदानी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: רֵיחַ נִיחֹחַ में ईश्वरीय स्वीकार्यता का भाव
  choice: एक सुखद सुगंध
  alternative: शांतिदायक सुगंध
  rationale: यह वाक्यांश भेंट की प्रसन्नतापूर्वक स्वीकार्यता का संकेत देता है, पर पाठ स्पष्ट रूप से यह नहीं कहता कि परमेश्वर का क्रोध शांत हुआ। इसलिए अधिक तटस्थ और स्वाभाविक रूप चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और अनुष्ठान-संगत रूप रखा गया है। ‘होमबलि’ और ‘वेदी’ जैसे परिचित बाइबलीय पद बनाए गए हैं, जबकि क्रिया को ‘जलाकर उसका धुआँ उठाएँ’ कहकर मूल की बलिदानी क्रिया स्पष्ट की गई है।
