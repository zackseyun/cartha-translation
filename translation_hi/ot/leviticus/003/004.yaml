source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָי֖וֹת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys, he shall remove.
translation:
  language: hi
  text: और दोनों गुर्दे, उन पर की चर्बी जो कमर के भाग पर है, और कलेजे पर का उपांग[a]—उसे गुर्दों के साथ निकाल दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कलेजे की पालि’। इस शारीरिक भाग के लिए प्रयुक्त इब्रानी शब्द का ठीक अर्थ अनिश्चित है; मुख्य पाठ में ‘उपांग’ रखा गया है ताकि आवश्यकता से अधिक सटीकता का दावा न हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: दोनों गुर्दे
  rationale: यह पदबंध बलि-पशु के दो गुर्दों को स्पष्ट रूप से दर्शाता है; ‘दोनों गुर्दे’ स्वाभाविक और सटीक हिन्दी है।
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵהֶן
  choice: उन पर की चर्बी
  rationale: बलिदान-संबंधी प्रसंग में חֵלֶב चढ़ाई जाने वाली चर्बी को दर्शाता है, और सम्बन्धवाचक उपवाक्य उसका स्थान गुर्दों पर बताता है।
- source_word: הַכְּסָלִים
  choice: कमर के भाग
  rationale: यह शब्द कमर अथवा पार्श्व के शारीरिक क्षेत्र को दर्शाता है; ‘कमर के भाग’ आधुनिक हिन्दी में स्पष्ट है और अनावश्यक शारीरिक सूक्ष्मता नहीं जोड़ता।
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: कलेजे पर का उपांग
  rationale: יוֹתֶרֶת एक अनिश्चित शारीरिक अंग-भाग है जो कलेजे से जुड़ा बताया गया है। ‘उपांग’ उसकी सटीक पहचान का दावा किए बिना उभरे या जुड़े अंग-भाग का अर्थ देता है।
- source_word: עַל הַכְּלָיוֹת
  choice: गुर्दों के साथ
  rationale: इस बलिदान-विधि में वाक्यांश उपांग को गुर्दों के साथ निकाले जाने की प्रक्रिया बताता है; यह शाब्दिक स्थानगत अनुवाद से अधिक स्वाभाविक है।
- source_word: יְסִירֶנָּה
  choice: उसे ... निकाल दे
  rationale: हिफ़ील क्रिया विधि-संबंधी निर्देश देती है। स्त्रीलिंग एकवचन प्रत्यय को ‘उसे’ द्वारा बनाए रखा गया है, जिसका निकटतम संदर्भ कलेजे का उपांग है।
