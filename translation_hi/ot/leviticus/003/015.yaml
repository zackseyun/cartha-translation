  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָיֹ֖ת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/015.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, with the kidneys[b], he shall remove.
translation:
  language: hi
  text: और दोनों गुर्दों को, उन पर की चर्बी को जो कमर के पास है, और जिगर के ऊपर का निकला हुआ भाग[a]—गुर्दों के साथ[b]—वह निकाल दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिगर की पालि।” इस शारीरिक भाग के लिए प्रयुक्त इब्रानी शब्द (יֹתֶרֶת) का ठीक अर्थ अनिश्चित है; इसलिए मुख्य पाठ में अधिक सामान्य अभिव्यक्ति रखी गई है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “गुर्दों पर।” यहाँ सम्भवतः आशय है कि यह भाग गुर्दों के साथ निकाला जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: दोनों गुरदों
  rationale: यह बलिदान-संबंधी शरीर-रचना में दोनों kidneys को स्पष्ट रूप से दर्शाता है; ‘दोनों गुरदे’ सहज और सटीक हिन्दी है।
- source_word: הַחֵלֶב
  choice: चर्बी
  rationale: लैव्यव्यवस्था के बलिदान-संदर्भ में यह चढ़ाई जाने वाली विशेष चर्बी को दर्शाता है; ‘चर्बी’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: אֲשֶׁר עֲלֵהֶן
  choice: उन पर की
  rationale: सम्बन्धवाचक उपवाक्य गुरदों पर स्थित चर्बी की ओर संकेत करता है।
- source_word: הַכְּסָלִים
  choice: कमर के पास
  rationale: यह पशु की कमर अथवा पार्श्व-प्रदेश को दर्शाता है। ‘कमर के पास’ शरीर-रचना को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अत्यधिक आधुनिक शारीरिक सटीकता थोपे।
- source_word: הַיֹּתֶרֶת
  choice: निकला हुआ भाग
  rationale: इस अनिश्चित शारीरिक शब्द का आशय जिगर से सम्बद्ध किसी उभरे या बढ़े हुए भाग से है। यह चयन ‘पालि’ जैसी विवादित सटीक पहचान थोपने से बचता है।
- source_word: עַל הַכָּבֵד
  choice: जिगर के ऊपर
  rationale: עַל का सीधा स्थानवाचक अर्थ ‘ऊपर/पर’ सुरक्षित रखा गया है।
- source_word: עַל הַכְּלָיֹת
  choice: गुरदों के साथ
  rationale: शाब्दिक अर्थ ‘गुरदों पर’ है, पर इस बलिदान-विधि में सम्भवतः उस भाग को गुरदों के साथ निकालने का प्रक्रियात्मक अर्थ है; मुख्य पाठ में स्वाभाविक अर्थ दिया गया और शाब्दिक रूप पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: יְסִירֶנָּה
  choice: वह निकाल दे
  rationale: हिफ़ील क्रिया यहाँ विधिक निर्देश में हटाने या निकालने का अर्थ देती है; हिन्दी में ‘निकाल दे’ स्वाभाविक आदेशात्मक-विधिक शैली है।
