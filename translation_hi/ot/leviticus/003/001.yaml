id: LEV.3.1
reference: Leviticus 3:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִם זֶ֥בַח שְׁלָמִ֖ים קָרְבָּנ֑/וֹ אִ֤ם מִן הַ/בָּקָר֙ ה֣וּא מַקְרִ֔יב אִם זָכָר֙ אִם נְקֵבָ֔ה תָּמִ֥ים יַקְרִיבֶ֖/נּוּ לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/001.yaml
  text: If his offering is a sacrifice of peace offerings[a], if he offers it from the herd, whether male or female[b], he shall offer it without blemish before Yahweh.
translation:
  language: hi
  text: “यदि उसका चढ़ावा मेलबलि का बलिदान हो[a], और वह उसे गाय-बैलों में से चढ़ाए, तो चाहे वह नर हो या मादा, उसे बिना किसी दोष के याहवे के सामने चढ़ाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “शांति/कुशलता की बलियों का बलिदान।” इसका अनुवाद “शांति-बलि” या “सहभागिता-बलि” भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח שְׁלָמִים
  choice: मेलबलि का बलिदान
  rationale: זֶבַח को ‘बलिदान’ और שְׁלָמִים को बलि के प्रकार ‘मेलबलि’ के रूप में व्यक्त किया गया है। यह इब्रानी पदबंध के दोनों अंगों को बनाए रखता है; ‘मेलबलि’ शांति, कुशल और सहभागिता से जुड़े व्यापक अर्थक्षेत्र को किसी एक व्याख्या तक सीमित नहीं करता।
- source_word: קָרְבָּנוֹ
  choice: उसका चढ़ावा
  rationale: קָרְבָּן किसी वस्तु को परमेश्वर के निकट लाकर अर्पित करने के सामान्य अर्थ में है। ‘चढ़ावा’ आधुनिक हिन्दी में स्पष्ट और बलिदानी प्रसंग के अनुकूल है।
- source_word: מִן הַבָּקָר
  choice: गाय-बैलों में से
  rationale: בָּקָר गोवंश अथवा बड़े पालतू पशुओं के झुंड को सूचित करता है। ‘गाय-बैलों में से’ हिन्दी पाठक के लिए पशु-वर्ग को सहज और ठीक रूप से स्पष्ट करता है।
- source_word: מַקְרִיב / יַקְרִיבֶנּוּ
  choice: चढ़ाए
  rationale: קרב का हिफ़ील रूप बलिदानी प्रसंग में निकट लाकर प्रस्तुत करने या अर्पित करने के लिए प्रयुक्त है। ‘चढ़ाए’ हिन्दी में स्वाभाविक धार्मिक-कानूनी पद है।
- source_word: אִם זָכָר אִם נְקֵבָה
  choice: चाहे वह नर हो या मादा
  rationale: दोहराया हुआ אִם विकल्प को दर्शाता है। ‘चाहे…या…’ दोनों में से किसी भी लिंग के पशु की अनुमति को सहज हिन्दी में बनाए रखता है।
- source_word: תָּמִים
  choice: बिना किसी दोष के
  rationale: बलिदानी विधान में תָּמִים शारीरिक खोट से रहित पशु को दर्शाता है। यह पद नैतिक ‘निर्दोषता’ का अनचाहा संकेत देने से बचता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने/की उपस्थिति में’ है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: שְׁלָמִים नामक बलि का स्वरूप
  choice: मेलबलि
  alternative: शांति-बलि; सहभागिता-बलि
  rationale: שְׁלָמִים का अर्थक्षेत्र शांति, कुशलता, संपूर्णता और साझा भोज/सहभागिता से जुड़ सकता है। ‘मेलबलि’ इस स्थापित बलिदानी श्रेणी को संक्षेप में व्यक्त करती है, जबकि अन्य संभव अर्थ पादटिप्पणी में सुरक्षित हैं।
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे नाम के रूप में प्रत्यक्ष रखता है और ‘प्रभु’ करके नाम व उपाधि का अंतर नहीं मिटाता।
translation_notes:
  register: भाषा आधुनिक, सरल और विधिक गरिमा वाली रखी गई है। ‘मेलबलि का बलिदान’ कुछ हद तक औपचारिक संरचना है, पर इससे मूल के זֶבַח और שְׁלָמִים दोनों सुरक्षित रहते हैं। मुख्य पाठ में केवल वही [a] चिह्न रखा गया है जिसकी पादटिप्पणी दी गई है।
