  text: וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ קָרְבָּנ֔/וֹ וְ/שָׁחַ֣ט אֹת֔/וֹ לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠/זָרְקוּ בְּנֵ֨י אַהֲרֹ֧ן אֶת דָּמ֛/וֹ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/008.yaml
  text: He shall lay his hand on the head of his offering and slaughter it before the tent of meeting[a], and Aaron’s sons shall throw its blood against the altar all around.
translation:
  language: hi
  text: वह अपना हाथ अपने चढ़ावे के सिर पर रखे और उसे मिलाप के तंबू के सामने वध करे। तब हारून के पुत्र उसका लहू वेदी के चारों ओर फेंकें[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छिटकाएँ” अथवा “उछालें”; हिब्रू क्रिया लहू को वेदी पर बलपूर्वक फेंकने की अनुष्ठानिक क्रिया बताती है, हलके छिड़काव की नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: अपना हाथ ... पर रखे
  rationale: बलिदान-संबंधी संदर्भ में यह क्रिया पशु के सिर पर हाथ रखने या टिकाने की विधिपूर्वक क्रिया बताती है। हिंदी में ‘हाथ रखे’ स्वाभाविक है और दबाव की मात्रा को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: קָרְבָּנוֹ
  choice: अपने चढ़ावे
  rationale: קָרְבָּן परमेश्वर के सम्मुख लाई गई भेंट या चढ़ावे का व्यापक शब्द है। ‘चढ़ावा’ इस बलिदान-संदर्भ में सहज और पर्याप्त रूप से व्यापक है।
- source_word: וְשָׁחַט
  choice: बलि करे
  rationale: यह बलि-पशु के विधिपूर्वक वध की तकनीकी क्रिया है। ‘बलि करे’ आधुनिक हिंदी में अनुष्ठानिक आशय स्पष्ट करता है, यद्यपि क्रिया में वध का भाव निहित है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू
  rationale: यह स्थापित हिंदी पदबंध है और उस तंबू को दर्शाता है जहाँ नियत भेंट या मिलन होता था।
- source_word: וְזָרְקוּ
  choice: उछालें
  rationale: זרק लहू को बलपूर्वक वेदी की ओर फेंकने या छिटकाने की अनुष्ठानिक क्रिया बताता है। ‘उछालें’ इसे कोमल छिड़काव से अलग रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: בְּנֵי אַהֲרֹן
  choice: हारून के पुत्र
  rationale: हिब्रू में स्पष्टतः ‘पुत्र’ है; इसे वंशज या याजक कहकर व्यापक नहीं किया गया।
- source_word: דָּמוֹ
  choice: उसके लहू
  rationale: प्रत्यय बलि-पशु की ओर संकेत करता है। हिंदी में ‘उसके’ स्वाभाविक है और पशु-संदर्भ में स्पष्ट रहता है।
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: वेदी पर चारों ओर
  rationale: यह लहू को वेदी के चारों ओर उसके भागों पर लगाने की क्रिया दर्शाता है; ‘चारों ओर’ वितरण का भाव बनाए रखता है।
theological_decisions:
- issue: बलिदान के पशु पर हाथ रखना
  choice: क्रिया को केवल ‘अपना हाथ ... पर रखे’ कहा गया है।
  alternative: इसे दोष के स्थानांतरण, प्रतिनिधित्व या पहचान के रूप में व्याख्यायित करना; अथवा दबाव पर बल देने के लिए ‘हाथ टिकाए’।
  rationale: पद स्वयं क्रिया बताता है, उसका धर्मवैचारिक अर्थ नहीं समझाता। इसलिए किसी विशिष्ट व्याख्या को पाठ में नहीं जोड़ा गया।
- issue: בְּנֵי אַהֲרֹן का लिंग और संबंध
  choice: हारून के पुत्र
  alternative: हारून के वंशज; हारून के याजक
  rationale: मूल पाठ का पुरुषवाची पारिवारिक पद सुरक्षित रखा गया है और उसे अधिक व्यापक पद से नहीं बदला गया।
- issue: לִפְנֵי אֹהֶל מוֹעֵד का स्थानिक अर्थ
  choice: मिलापवाले तंबू के सामने
  alternative: मिलापवाले तंबू के सम्मुख/उपस्थिति में
  rationale: यहाँ सरल स्थानिक अर्थ स्पष्ट है; ‘सामने’ अनुष्ठानिक स्थान को स्वाभाविक हिंदी में व्यक्त करता है, बिना दिव्य उपस्थिति का अतिरिक्त अर्थ आरोपित किए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘मिलापवाला तंबू’, ‘लहू’, ‘वेदी’ और ‘हारून’ जैसे परिचित बाइबलीय पद रखे गए हैं। वाक्य को दो भागों में बाँटा गया है ताकि विधिक निर्देश स्पष्ट रहे।
