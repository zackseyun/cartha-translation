source:
  edition: WLC
  text: חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בְּ/כֹ֖ל מֽוֹשְׁבֹתֵי/כֶ֑ם כָּל חֵ֥לֶב וְ/כָל דָּ֖ם לֹ֥א תֹאכֵֽלוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/017.yaml
  text: 'It shall be a permanent statute throughout your generations, in all your dwellings: you shall eat neither any fat nor any blood.'
translation:
  language: hi
  text: 'यह तुम्हारी पीढ़ियों तक, तुम्हारे सभी निवास-स्थानों में, एक स्थायी विधि[a] होगी: तुम न किसी प्रकार की चर्बी खाओ, न किसी प्रकार का खून।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्थायी विधि’ का अनुवाद ‘सदा की विधि,’ ‘सदैव की विधि,’ या ‘निरन्तर बनी रहने वाली विधि’ भी हो सकता है। विधिक संदर्भों में इब्रानी עוֹלָם प्रायः दीर्घकाल तक बनी रहने वाली वैधता दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקַּת
  choice: विधि
  rationale: यह शब्द किसी निश्चित और बाध्यकारी नियम को दर्शाता है; ‘विधि’ आधुनिक, गरिमापूर्ण और सहज हिन्दी में इसके कानूनी बल को व्यक्त करता है।
- source_word: עוֹלָם
  choice: सदा की
  rationale: विधिक सूत्र में यह निरंतर और स्थायी वैधता का बोध देता है; ‘सदा की’ स्वाभाविक हिन्दी है और शब्द की कालगत व्यापकता को बनाए रखती है।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-दर-पीढ़ी
  rationale: यह क्रमिक पीढ़ियों में आज्ञा की निरंतरता व्यक्त करता है; यह रूप सामान्य हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: तुम्हारे सभी निवास-स्थानों में
  rationale: यह नियम के प्रत्येक रहने के स्थान में लागू होने का दायरा स्पष्ट करता है और मूल की स्थानवाचक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: כָּל חֵלֶב
  choice: किसी प्रकार की चर्बी
  rationale: निषेध के साथ כָּל की समावेशी शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है। बलि-संबंधी संदर्भ में חֵלֶב के लिए ‘चर्बी’ उपयुक्त सामान्य शब्द है।
- source_word: וְכָל דָּם
  choice: किसी प्रकार का खून
  rationale: यह समानांतर समग्र निषेध को स्पष्ट रूप से व्यक्त करता है; ‘खून’ आम आधुनिक हिन्दी में सहज और प्रत्यक्ष है।
- source_word: לֹא תֹאכֵלוּ
  choice: तुम न…खाना, न…
  rationale: कानूनी निषेध को आधुनिक हिन्दी के स्वाभाविक आज्ञार्थक ढंग में व्यक्त करता है और दोनों निषिद्ध वस्तुओं को समान बल देता है।
theological_decisions:
- issue: עוֹלָם द्वारा आज्ञा की अवधि
  choice: ‘सदा की विधि’
  alternative: ‘अनन्तकाल की विधि’ या ‘स्थायी विधि’
  rationale: मूल विधिक सूत्र पीढ़ियों तक बनी रहने वाली बाध्यकारी वैधता पर बल देता है। ‘सदा की’ उस व्यापकता को बनाए रखता है, जबकि यह अपने आप दार्शनिक अर्थ में निरपेक्ष अनंतता का निर्णय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन है। वाक्य में विधिक गरिमा रखी गई है, पर अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है। ‘पीढ़ी-दर-पीढ़ी’ और ‘न किसी प्रकार की…न किसी प्रकार का…’ सामान्य पाठक के लिए स्पष्ट हैं।
