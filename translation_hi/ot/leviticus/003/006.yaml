id: LEV.3.6
reference: Leviticus 3:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִם מִן הַ/צֹּ֧אן קָרְבָּנ֛/וֹ לְ/זֶ֥בַח שְׁלָמִ֖ים לַ/יהוָ֑ה זָכָר֙ א֣וֹ נְקֵבָ֔ה תָּמִ֖ים יַקְרִיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/006.yaml
  text: And if his offering for a sacrifice of peace offerings to Yahweh is from the flock[a], male or female, he shall offer it without blemish.
translation:
  language: hi
  text: और यदि यहोवा के लिए मेल-बलि के रूप में उसकी भेंट भेड़-बकरियों के झुंड में से हो, तो वह पशु नर हो या मादा, वह उसे दोषरहित चढ़ाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: संयोजक और शर्त—दोनों को बनाए रखता है और इस विधान को पिछले निर्देशों से जोड़ता है।
- source_word: מִן הַצֹּאן
  choice: भेड़-बकरियों के झुंड में से
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, का सामूहिक पद है; हिन्दी में दोनों को स्पष्ट करना स्वाभाविक और सटीक है।
- source_word: קָרְבָּנוֹ
  choice: उसकी भेंट
  rationale: क़ोरबान के बलिदानी संदर्भ को सरल, प्रचलित हिन्दी में व्यक्त करता है।
- source_word: לְזֶבַח שְׁלָמִים
  choice: मेलबलि के रूप में
  rationale: זֶבַח שְׁלָמִים के तकनीकी बलिदानी अर्थ को संक्षिप्त रूप से व्यक्त करता है; शांति, कुशलता और सहभागी भोज से जुड़े अर्थ-विस्तार को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: लामेद समर्पण/प्रस्तुति को सूचित करता है और יהוה के व्यक्तिगत वाचा-नाम को लिप्यंतरित रूप में रखता है।
- source_word: זָכָר אוֹ נְקֵבָה
  choice: नर हो या मादा
  rationale: पशु के जैविक लिंग के दोनों अनुमत विकल्पों को सीधे व्यक्त करता है।
- source_word: תָּמִים
  choice: निर्दोष पशु
  rationale: बलिदानी संदर्भ में ऐसा पशु अभिप्रेत है जिसमें कोई दोष न हो; संज्ञा जोड़ने से हिन्दी में संदर्भ स्पष्ट रहता है।
- source_word: יַקְרִיבֶנּוּ
  choice: वह ... चढ़ाए
  rationale: हिफ़ील रूप की बलिदानी प्रस्तुति को हिन्दी के स्वाभाविक धार्मिक क्रियापद से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में आए व्यक्तिगत वाचा-नाम को सामान्य उपाधि से बदलने के बजाय हिन्दी में परिचित लिप्यंतरण द्वारा सुरक्षित रखा गया है; उच्चारण की अनिश्चितता के कारण वैकल्पिक रूप संभव है।
- issue: שְׁלָמִים का बलिदानी अर्थ
  choice: मेलबलि
  alternative: शान्ति-बलि / सहभागिता-बलि
  rationale: यह पारंपरिक शांति के साथ कुशलता, मेल और साझा बलिदानी भोजन के संबंध को भी धारण कर सकता है; मुख्य पाठ किसी एक विस्तृत धर्मवैज्ञानिक व्याख्या को अंतिम नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक-धार्मिक गरिमा बनाए रखते हुए वाक्य को सामान्य पाठक के लिए सहज रखा गया है। ‘भेड़-बकरियों के झुंड’ से इब्रानी सामूहिक संज्ञा का दायरा स्पष्ट किया गया है।
