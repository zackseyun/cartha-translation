  text: וְ/הִקְרִ֤יב מִמֶּ֨/נּוּ֙ קָרְבָּנ֔/וֹ אִשֶּׁ֖ה לַֽ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/014.yaml
  text: 'And from it he shall present his offering[a], a food offering to Yahweh: the fat that covers the entrails, and all the fat that is on the entrails,'
translation:
  language: hi
  text: 'और वह उसमें से यहोवा के लिए अपनी भेंट—एक खाद्य-भेंट[a]—चढ़ाए: वह चरबी जो अंतड़ियों को ढकती है, और वह सारी चरबी जो अंतड़ियों पर है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अग्नि-भेंट” (अर्थात् आग में चढ़ाई जाने वाली भेंट)। इब्रानी शब्द אִשֶּׁה का बलिदान-संबंधी संदर्भों में पारंपरिक अनुवाद इस प्रकार भी किया जाता है।
    reason: इब्रानी אִשֶּׁה के संभावित बलिदान-संबंधी अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: चढ़ाए
  rationale: हिफ़ील रूप यहाँ बलिदान की वस्तु को परमेश्वर के सामने विधिपूर्वक प्रस्तुत करने को दर्शाता है; हिंदी में ‘चढ़ाए’ स्वाभाविक और अनुष्ठान-संगत है।
- source_word: מִמֶּנּוּ
  choice: उसमें से
  rationale: सर्वनाम का संकेत पिछले संदर्भ के बलि-पशु की ओर है, किसी व्यक्ति की ओर नहीं।
- source_word: קָרְבָּנוֹ
  choice: अपनी भेंट
  rationale: קָרְבָּן बलिदान-संबंधी तकनीकी शब्द है; ‘भेंट’ स्पष्ट और प्रचलित हिंदी समतुल्य है।
- source_word: אִשֶּׁה
  choice: खाद्य-भेंट
  rationale: याजकीय ग्रंथों में यह शब्द यहोवा को वेदी पर अर्पित भेंट के लिए प्रयुक्त होता है और खाद्य-भेंट की संकल्पना से जुड़ता है; पारंपरिक ‘अग्नि-भेंट’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל उद्देश्य अथवा प्राप्तकर्ता को सूचित करता है; परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
- source_word: הַחֵלֶב
  choice: चरबी
  rationale: बलिदान-विधि में חֵלֶב पशु की वे विशिष्ट चरबीदार परतें हैं जिन्हें वेदी पर जलाया जाता था।
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: जो अंतड़ियों को ढकती है
  rationale: इब्रानी कृदंत और उसके कर्म को हिंदी में स्वाभाविक संबंधवाचक उपवाक्य से व्यक्त किया गया है।
- source_word: וְאֵת כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: और वह सारी चरबी जो अंतड़ियों पर है
  rationale: यह अनुवाद כָּל की समग्रता और עַל के स्थान-संबंध दोनों को बनाए रखता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है; उसे उपाधि से बदलने के बजाय परिचित हिंदी रूप ‘यहोवा’ रखा गया है।
- issue: אִשֶּׁה का बलिदान-संबंधी अर्थ
  choice: खाद्य-भेंट
  alternative: अग्नि-भेंट
  rationale: शब्द की सटीक व्युत्पत्ति और बलिदान-संबंधी अर्थ पर मतभेद है। मुख्य पाठ में याजकीय ‘खाद्य-भेंट’ की संकल्पना व्यक्त की गई है, जबकि पारंपरिक अग्नि-संबंधी अर्थ पादटिप्पणी में दिया गया है ताकि अस्पष्टता न मिटे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘चढ़ाए,’ ‘भेंट,’ ‘चरबी’ और ‘अंतड़ियाँ’ जैसे ठोस शब्द लैव्यव्यवस्था के अनुष्ठानिक तथा शारीरिक संदर्भ को बिना अनावश्यक संस्कृतीकरण के व्यक्त करते हैं।
