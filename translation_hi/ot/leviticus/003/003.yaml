id: LEV.3.3
reference: Leviticus 3:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִקְרִיב֙ מִ/זֶּ֣בַח הַ/שְּׁלָמִ֔ים אִשֶּׁ֖ה לַ/יהוָ֑ה אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/003/003.yaml
  text: And from the sacrifice of peace offerings he shall present as a food offering to Yahweh the fat that covers the entrails[a], and all the fat that is on the entrails,
translation:
  language: hi
  text: 'और वह मेलबलि में से यहोवा के लिए अग्नि में चढ़ाया जाने वाला अर्पण[a] प्रस्तुत करे: वह चरबी जो अंतड़ियों को ढकती है, और वह सारी चरबी जो अंतड़ियों पर है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भोजन-अर्पण”; परंपरागत रूप से “अग्नि-अर्पण।”
    reason: אִשֶּׁה के अर्थ में अग्नि में चढ़ाए जाने और परमेश्वर के लिए भोजन-सदृश अर्पण—दोनों अर्थ-छायाएँ मानी गई हैं।
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: प्रस्तुत करे
  rationale: हिफ़ील रूप बलिदान-संबंधी प्रसंग में विधिपूर्वक अर्पण प्रस्तुत करने को दर्शाता है; यह चयन ‘निकट लाए’ की अपेक्षा स्वाभाविक है और क्रिया के अनुष्ठानिक भाव को बनाए रखता है।
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: मेलबलि में से
  rationale: זֶבַח बलिदान को और שְׁלָמִים उस स्थापित बलिदान-श्रेणी को दर्शाता है जिसका संबंध शांति, कुशल और सहभागिता से है। ‘मेलबलि’ संक्षिप्त, पारंपरिक और सामान्य पाठक के लिए बोधगम्य है।
- source_word: אִשֶּׁה
  choice: अग्नि में चढ़ाया जाने वाला अर्पण
  rationale: यह शब्द अग्नि पर रखकर धुएँ में परिणत किए जाने वाले अर्पण की याजकीय श्रेणी बताता है। यह अनुवाद अग्नि-संबंधी मूल भाव को स्पष्ट रखता है; वैकल्पिक ‘भोजन-अर्पण’ पादटिप्पणी में दिया गया है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत वाचा-नाम יהוה को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הַחֵלֶב
  choice: चरबी
  rationale: बलिदान-विधान में यह पशु के अर्पण के लिए अलग किए गए चरबीदार भागों को संदर्भित करता है।
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: जो अंतड़ियों को ढकती है
  rationale: सहभागी रूप चरबी के उस भाग का वर्णन करता है जो भीतरी अंगों/अंतड़ियों पर आवरण होता है।
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: वह सारी चरबी जो अंतड़ियों पर है
  rationale: वाक्यांश आवरणवाली चरबी के साथ अंतड़ियों पर लगी बाकी समस्त चरबी को भी सम्मिलित करता है; עַל का सीधा स्थानवाचक अर्थ सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा-नाम प्रत्यक्ष है। हिन्दी में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला रूप है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: बलिदान-संबंधी אִשֶּׁה का अर्थ
  choice: अग्नि में चढ़ाया जाने वाला अर्पण
  alternative: भोजन-अर्पण
  rationale: शब्द की व्युत्पत्ति और याजकीय प्रयोग पर मतभेद है। मुख्य पाठ में अग्नि द्वारा चढ़ाए जाने का ठोस अनुष्ठानिक भाव रखा गया है, जबकि ‘भोजन-अर्पण’ की अर्थ-संभावना पादटिप्पणी में सुरक्षित है।
- issue: זֶבַח הַשְּׁלָמִים की बलिदान-श्रेणी
  choice: मेलबलि
  alternative: शांति-बलि; कुशल-बलि
  rationale: शब्द में शांति, कुशलता और सहभागिता की अर्थ-छायाएँ हैं। ‘मेलबलि’ किसी एक अर्थ-छाया को अत्यधिक सीमित किए बिना प्रचलित बलिदान-श्रेणी को दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक-याजकीय गरिमा रखी गई है। ‘प्रस्तुत करे’ आदेशात्मक विधान की शैली देता है; ‘चरबी’ और ‘अंतड़ियाँ’ शारीरिक विवरण को सामान्य पाठक के लिए स्पष्ट रखते हैं।
