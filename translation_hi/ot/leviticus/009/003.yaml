  rationale: संयोजक וְ को ‘और’ से तथा संबोधित समुदाय के पुल्लिंग बहुवचन पद को औपचारिक रूप से ‘इस्राएल के पुत्रों’ से व्यक्त किया गया है; हिन्दी में דּבר אֶל के साथ ‘से कहना’ स्वाभाविक है।
- source_word: תְּדַבֵּר לֵאמֹר
  choice: कहना
  rationale: निर्देशात्मक अपूर्ण क्रिया और उद्धरणसूचक לֵאמֹר को हिन्दी के स्वाभाविक आज्ञार्थक ‘कहना’ तथा उसके बाद प्रत्यक्ष कथन से व्यक्त किया गया है।
- source_word: קְחוּ
  choice: लो
  rationale: यह समुदाय को संबोधित बहुवचन आज्ञा है; ‘लो’ לקח का सीधा और सहज अर्थ रखता है।
- source_word: שְׂעִיר עִזִּים
  choice: एक बकरा
  rationale: यह पद नर बकरी को सूचित करता है; ‘बकरा’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: याजकीय बलिदान-संदर्भ में חַטָּאת एक विशिष्ट बलि-श्रेणी है। ‘पापबलि’ प्रचलित और सुबोध है; शुद्धिकरण के वैकल्पिक बल को पादटिप्पणी में रखा गया है।
- source_word: וְעֵגֶל וָכֶבֶשׂ
  choice: एक बछड़ा और एक मेमना
  rationale: दोनों पशुओं को उनके सामान्य, विशिष्ट हिन्दी नामों से व्यक्त किया गया है।
- source_word: בְּנֵי שָׁנָה תְּמִימִם
  choice: ये दोनों एक-एक वर्ष के और निर्दोष हों
  rationale: बहुवचन विशेषण बछड़े और मेमने दोनों को संशोधित करते हैं। ‘एक-एक’ वितरणार्थ स्पष्ट करता है और ‘निर्दोष’ बलि के लिए शारीरिक दोष से रहित होने का अर्थ देता है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: याजकीय प्रयोग में עֹלָה पूर्णतः जलाई जाने वाली बलि है; ‘होमबलि’ मानक और संक्षिप्त हिन्दी बाइबलीय पद है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक संबोधन
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल के पुल्लिंग बहुवचन रूप को पारदर्शी रखा गया है, यद्यपि यह वाचा-समुदाय का सामूहिक पद भी है।
- issue: याजकीय संदर्भ में חַטָּאת
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: मुख्य पाठ में परिचित बलि-नाम रखा गया है, पर शब्द में निहित शुद्धिकरण-संबंधी समझ को पादटिप्पणी द्वारा खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। वाक्य-विन्यास हिन्दी के अनुरूप है, जबकि बलि-संबंधी मुख्य पदों और मूल के सामुदायिक संबोधन को पारदर्शी रखा गया है।
