  text: और इस्राएल के पुत्रों से यह कहो, ‘पापबलि[a] के लिए एक बकरा लो, और होमबलि के लिए एक वर्ष के और दोषरहित एक बछड़ा और एक मेमना लो।’
  philosophy: optimal-equivalence
