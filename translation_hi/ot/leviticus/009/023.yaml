  text: וַ/יָּבֹ֨א מֹשֶׁ֤ה וְ/אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וַ/יֵּ֣צְא֔וּ וַֽ/יְבָרֲכ֖וּ אֶת הָ/עָ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/023.yaml
  text: Moses and Aaron went into the tent of meeting, and when they came out, they blessed the people. Then the glory of Yahweh appeared to all the people.
translation:
  language: hi
  text: मूसा और हारून मिलाप के तंबू में गए। फिर वे बाहर आए और उन्होंने लोगों को आशीर्वाद दिया। तब याहवे[a] की महिमा सभी लोगों को दिखाई दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ परमेश्वर के उस विशिष्ट नाम का रूप है जिसे हिब्रू में चार अक्षरों יהוה (YHWH) से लिखा गया है।
    reason: ईश्वरीय नाम की पहचान स्पष्ट करना
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: मिलाप का तंबू
  rationale: यह इस्राएल के पवित्र मिलन-स्थान के तकनीकी अर्थ को बनाए रखता है और आधुनिक हिंदी में स्वाभाविक है। विभक्ति के साथ मुख्य पाठ में इसका रूप ‘मिलाप के तंबू’ है।
- source_word: וַיָּבֹא ... וַיֵּצְאוּ
  choice: में गए ... बाहर आए
  rationale: हिब्रू की क्रियाओं की दिशा और क्रम को सहज हिंदी में व्यक्त करता है। पहली क्रिया का रूप एकवचन है, पर संयुक्त कर्ता ‘मूसा और हारून’ और आगे की बहुवचन क्रियाएँ दोनों व्यक्तियों को कर्ता समझने का समर्थन करती हैं।
- source_word: וַיְבָרֲכוּ
  choice: उन्होंने ... आशीर्वाद दिया
  rationale: हिब्रू क्रिया का सीधा और स्वाभाविक हिंदी रूप है; आशीर्वाद के शब्द या रीति के बारे में अतिरिक्त बात नहीं जोड़ता।
- source_word: הָעָם / כָּל הָעָם
  choice: लोगों / सभी लोगों
  rationale: यहाँ עָם एकत्र वाचा-समुदाय को दर्शाता है; ‘लोग’ आधुनिक हिंदी में स्पष्ट और व्यापक समतुल्य है।
- source_word: כְבוֹד יְהוָה
  choice: याहवे की महिमा
  rationale: כָּבוֹד की प्रत्यक्ष ईश्वरीय महिमा का भाव और יְהוָה का व्यक्तिगत वाचा-नाम दोनों सुरक्षित रहते हैं।
- source_word: וַיֵּרָא
  choice: दिखाई दी
  rationale: निफ़अल रूप दृश्य रूप से प्रकट होने का भाव देता है; ‘दिखाई दी’ हिंदी में स्वाभाविक है और यह स्पष्ट करता है कि महिमा लोगों के सामने दृश्य हुई।
- source_word: אֶל כָּל הָעָם
  choice: सभी लोगों को
  rationale: ‘दिखाई दी’ के साथ אֶל का यह स्वाभाविक हिंदी संयोजन है और प्रकट होने के प्राप्तकर्ताओं को सीधे व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में प्रस्तुत करता है; पादटिप्पणी पाठक को इसकी पहचान बताती है।
- issue: अंतिम उपवाक्यों का कालिक/क्रमिक संबंध
  choice: फिर ... तब
  alternative: और ... और
  rationale: हिब्रू के वय्यिक्तोल क्रम में घटनाएँ आगे बढ़ती हैं। ‘फिर’ और ‘तब’ आधुनिक हिंदी में उस कथा-क्रम को स्पष्ट करते हैं, बिना कोई अतिरिक्त कारणात्मक संबंध जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मिलाप का तंबू’ पारंपरिक धार्मिक पद को बनाए रखता है, जबकि वाक्य-विन्यास आज की हिंदी के अनुरूप है।
