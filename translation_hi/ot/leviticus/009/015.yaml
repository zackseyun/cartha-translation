  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּקְרֵ֕ב אֵ֖ת קָרְבַּ֣ן הָ/עָ֑ם וַ/יִּקַּ֞ח אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וַ/יִּשְׁחָטֵ֥/הוּ וַֽ/יְחַטְּאֵ֖/הוּ כָּ/רִאשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/015.yaml
  text: Then he presented the people's offering[a], and he took the goat of the sin offering that was for the people, and slaughtered it and offered it for sin, as with the first one.
translation:
  language: hi
  text: फिर उसने लोगों की भेंट प्रस्तुत की। उसने लोगों के लिए पापबलि का बकरा लिया, उसका वध किया और उसे पापबलि के रूप में चढ़ाया, जैसे पहले किया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके द्वारा शुद्धीकरण की विधि की।” पुरोहितीय अनुष्ठानों में यहाँ प्रयुक्त इब्रानी क्रिया पापबलि की रीति संपन्न करने या पाप/अशुद्धता दूर करने का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: प्रस्तुत की
  rationale: हिफ़ील में קרב बलि-संबंधी संदर्भ में किसी भेंट को निकट लाने या विधिपूर्वक प्रस्तुत करने को व्यक्त करता है। ‘प्रस्तुत की’ स्वाभाविक हिंदी है और इसे पूरी बलि-क्रिया के समान नहीं ठहराती।
- source_word: קָרְבַּן הָעָם
  choice: लोगों की भेंट
  rationale: קָרְבָּן सामान्य रूप से परमेश्वर के निकट लाई गई भेंट है; संबंधवाचक रचना को सरल और स्वाभाविक हिंदी में रखा गया है।
- source_word: שְׂעִיר הַחַטָּאת
  choice: पापबलि का बकरा
  rationale: שְׂעִיר नर बकरे को और חַטָּאת यहाँ अमूर्त पाप नहीं, बलि की एक श्रेणी को दर्शाता है।
- source_word: אֲשֶׁר לָעָם
  choice: लोगों के लिए
  rationale: ל यहाँ स्वामित्व से अधिक लोगों की ओर से या उनके निमित्त नियत किए जाने का भाव देता है।
- source_word: וַיִּשְׁחָטֵהוּ
  choice: उसे बलि किया
  rationale: שׁחט बलि-पशु को विधिपूर्वक वध करने का मानक क्रियापद है। हिंदी में ‘बलि किया’ इस अनुष्ठानिक संदर्भ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וַיְחַטְּאֵהוּ
  choice: उससे पापबलि की विधि पूरी की
  rationale: חטא का पिएल रूप यहाँ बकरे के साथ पापबलि का अनुष्ठान करने का संकेत देता है। यह अनुवाद बकरे को स्वयं ‘शुद्ध’ किए जाने की भ्रामक धारणा से बचता है, फिर भी क्रिया की अनुष्ठानिक व्यापकता बनाए रखता है।
- source_word: כָּרִאשׁוֹן
  choice: पहले की तरह
  rationale: यह अध्याय में पहले चढ़ाई गई पापबलि और उसी प्रक्रिया की ओर संकेत करता है; हिंदी में संदर्भ पर्याप्त स्पष्ट है।
theological_decisions:
- issue: बलि-संबंधी संदर्भ में חַטָּאת का अर्थ
  choice: पापबलि
  alternative: पाप
  rationale: लैव्यव्यवस्था 9 का संदर्भ बलिदान का है, जहाँ חַטָּאת बलि की श्रेणी अथवा बलि-पशु को सूचित करता है, केवल अमूर्त पाप को नहीं।
- issue: וַיְחַטְּאֵהוּ का अनुष्ठानिक आशय
  choice: उससे पापबलि की विधि पूरी की
  alternative: उसे शुद्ध किया; उसे पापबलि के रूप में चढ़ाया
  rationale: क्रिया का अर्थ पुरोहितीय संदर्भ में शुद्ध करने अथवा पापबलि की विधि करने तक विस्तृत हो सकता है। मुख्य पाठ में कार्यात्मक अनुवाद पशु को शुद्ध किए जाने का अनपेक्षित अर्थ टालता है, जबकि पादटिप्पणी वास्तविक शाब्दिक-अर्थगत संभावना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सहज और गरिमापूर्ण रखी गई है। ‘पापबलि’ लैव्यव्यवस्था की बलि-संबंधी पारिभाषिक संगति बनाए रखता है। अस्पष्ट इब्रानी क्रिया को मुख्य पाठ में स्वाभाविक कार्यात्मक रूप में और वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
