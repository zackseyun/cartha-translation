  text: וַ/יִּשְׁחַ֤ט אֶת הַ/שּׁוֹר֙ וְ/אֶת הָ/אַ֔יִל זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לָ/עָ֑ם וַ֠/יַּמְצִאוּ בְּנֵ֨י אַהֲרֹ֤ן אֶת הַ/דָּם֙ אֵלָ֔י/ו וַ/יִּזְרְקֵ֥/הוּ עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/018.yaml
  text: Then he slaughtered the ox and the ram[a], the sacrifice of peace offerings that was for the people. Aaron’s sons brought the blood to him, and he splashed it on the altar all around.
translation:
  language: hi
  text: फिर उसने बैल और मेढ़े का लोगों के लिए मेलबलि के रूप में वध किया[a]। हारून के पुत्र लहू उसके पास ले आए, और उसने उसे वेदी के चारों ओर छिड़क दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेलबलि” को “शांति-बलि,” “सहभागिता-बलि” या “कुशलता-बलि” भी कहा जा सकता है। इब्रानी शब्द में शांति, संपूर्ण कुशलता और सहभागिता के भाव जुड़े हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: फिर उसने ... बलि किया
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, इसलिए ‘फिर’ स्वाभाविक है। बलिदान के प्रसंग में ‘बलि किया’ सामान्य ‘मार डाला’ से अधिक सटीक और गरिमापूर्ण है।
- source_word: הַשּׁוֹר
  choice: बैल
  rationale: שׁוֹר गोवंश के नर पशु के लिए प्रयुक्त हो सकता है; इस बलिदानी प्रसंग में ‘बैल’ सहज और प्रचलित हिंदी है।
- source_word: הָאַיִל
  choice: मेढ़ा
  rationale: אַיִל का विशिष्ट अर्थ नर भेड़ है; ‘मेढ़ा’ इसका सीधा आधुनिक हिंदी प्रतिरूप है।
- source_word: זֶבַח הַשְּׁלָמִים
  choice: मेलबलि
  rationale: שְׁלָמִים में शांति, कुशलता/सम्पूर्णता और संगति के भाव जुड़े हैं। ‘मेलबलि’ संबंधगत शांति और सहभागिता का भाव संक्षेप में व्यक्त करता है; अन्य संभावित अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: אֲשֶׁר לָעָם
  choice: जो लोगों के लिए ... थे
  rationale: यह संबंधवाचक खंड इन बलियों को लोगों की ओर से या उनके हित में चढ़ाई जाने वाली बलियों के रूप में पहचानता है।
- source_word: וַיַּמְצִאוּ
  choice: ले आए
  rationale: यहाँ क्रिया याजक के पास लहू लाने या प्रस्तुत करने की विधिक क्रिया बताती है; ‘ले आए’ स्पष्ट और स्वाभाविक है।
- source_word: אֶת הַדָּם אֵלָיו
  choice: लहू उसके पास
  rationale: मूल में सर्वनाम है और संदर्भ में उसका संकेत हारून की ओर स्पष्ट है; हिंदी में भी सर्वनाम को बनाए रखा गया है।
- source_word: וַיִּזְרְקֵהוּ
  choice: उसे ... छिड़क दिया
  rationale: זָרַק वेदी पर लहू फेंककर लगाने की क्रिया है। हिंदी के धार्मिक-विधिक प्रयोग में ‘छिड़क दिया’ स्वाभाविक है, यद्यपि इसे हल्की बूंदें डालने तक सीमित नहीं समझना चाहिए।
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: वेदी पर चारों ओर
  rationale: यह वेदी के चारों ओर लहू लगाने का वितरण बताता है और मूल की स्थानगत अभिव्यक्ति को निकटता से रखता है।
theological_decisions:
- issue: שְׁלָמִים के बलिदानी नाम का अर्थ
  choice: मेलबलि
  alternative: शांतिबलि; कुशल-बलि; सहभागिता-बलि
  rationale: हिब्रू पद केवल संघर्ष की अनुपस्थिति नहीं, बल्कि शांति, पूर्ण कुशलता और परमेश्वर के साथ सहभागिता से जुड़े अर्थ रखता है। मुख्य पाठ में संक्षिप्त, समझने योग्य पद चुना गया है और अर्थ-व्याप्ति पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘लहू’ और ‘वेदी’ बाइबलीय बलिदानी प्रसंग के परिचित शब्द हैं। वाक्यरचना को मूल के क्रम के निकट रखते हुए हिंदी में स्वाभाविक बनाया गया है।
