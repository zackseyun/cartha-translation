  text: וְ/אֵ֣ת הֶ/חָז֗וֹת וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין הֵנִ֧יף אַהֲרֹ֛ן תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּ֥ה מֹשֶֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/021.yaml
  text: And Aaron waved the breasts and the right thigh as a wave offering before Yahweh, just as Moses had commanded.
translation:
  language: hi
  text: और हारून ने छाती के भागों और दाहिनी जाँघ को याहवे के सामने लहराने की भेंट के रूप में प्रस्तुत किया, जैसा मूसा ने आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזוֹת
  choice: छाती के भागों
  rationale: बलिदान के प्रसंग में חָזֶה पशु की छाती के नियत भाग को दर्शाता है। बहुवचन को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘छाती के भागों’ चुना गया है।
- source_word: שׁוֹק הַיָּמִין
  choice: दाहिनी जाँघ
  rationale: שׁוֹק बलिदान में पैर या जाँघ के मांसल भाग को दर्शाता है; ‘दाहिनी जाँघ’ हिन्दी में स्पष्ट और प्रचलित धार्मिक शब्दावली है।
- source_word: הֵנִיף ... תְּנוּפָה
  choice: हिलाने की भेंट के रूप में हिलाया
  rationale: क्रिया और उसी मूल से बने अनुष्ठानिक संज्ञा-रूप, दोनों को बनाए रखते हुए यह वाक्यांश भेंट को याहवे के सामने विधिपूर्वक हिलाकर प्रस्तुत करने की क्रिया बताता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का सीधा अर्थ ‘के सामने/उपस्थिति में’ है, और יְהוָה को उसके निज नाम के हिन्दी लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: ठीक वैसे ही जैसे मूसा ने आज्ञा दी थी
  rationale: यह उपवाक्य हारून के कार्य का मूसा की पहले दी हुई आज्ञा के अनुरूप होना स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का निज नाम सीधे प्रयुक्त है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘हिलाने की भेंट’ अनुष्ठानिक तकनीकी अर्थ को बनाए रखती है, जबकि ‘छाती के भागों’ बहुवचन बलिदानी हिस्सों को स्वाभाविक हिन्दी में व्यक्त करता है।
