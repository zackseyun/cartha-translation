- source_word: וַיְמַלֵּא כַפּוֹ מִמֶּנָּה
  choice: उसमें से अपनी हथेली भर ली
  rationale: यह मूल के ठोस बिंब ‘उसमें से अपनी हथेली भरना’ को बनाए रखता है; आशय हाथ में जलाने योग्य अंश लेने का है।
- source_word: וַיַּקְטֵר
  choice: उसे ... जला दिया
  rationale: बलिदान-संदर्भ में קטר का हिफ़ील वेदी पर धुएँ के रूप में जलाने को दर्शाता है; ‘जला दिया’ सहज हिन्दी है और वेदी का उल्लेख अनुष्ठानिक अर्थ स्पष्ट करता है।
- source_word: עַל הַמִּזְבֵּחַ
  choice: वेदी पर
  rationale: स्थानवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מִלְּבַד
  choice: के अतिरिक्त
  rationale: यह बताता है कि अन्नबलि का यह कार्य नियमित सुबह के होमबलि के अलावा किया गया था।
- source_word: עֹלַת הַבֹּקֶר
  choice: सुबह के होमबलि
  rationale: עֹלָה के लिए ‘होमबलि’ प्रचलित हिन्दी बाइबलीय शब्द है; पदबंध नियमित प्रातःकालीन बलि को स्पष्ट करता है।
