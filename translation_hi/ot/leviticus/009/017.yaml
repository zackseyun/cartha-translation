    text: 'शाब्दिक अर्थ: “उसमें से अपनी हथेली भर ली।” अर्थात उसने अन्नबलि का एक अंश अपने हाथ में लिया, ताकि उसे वेदी पर जलाए।'
    reason: lexical_alternative
lexical_decisions:
