  choice: चढ़ाई
  rationale: हिफ़ील में क्रिया का अर्थ बलिदान-संदर्भ में पास लाना या प्रस्तुत करना है; हिन्दी में ‘अन्नबलि चढ़ाई’ स्वाभाविक है और अनुष्ठानिक भाव स्पष्ट रखता है।
- source_word: הַמִּנְחָה
