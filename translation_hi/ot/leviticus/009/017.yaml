translation:
  language: hi
  text: फिर उसने अन्नबलि चढ़ाई, उसमें से अपनी हथेली भर अन्न लिया[a] और उस अंश को वेदी पर जला दिया। यह सुबह की होमबलि के अतिरिक्त था।
  philosophy: optimal-equivalence
  footnotes:
