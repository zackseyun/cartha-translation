id: LEV.9.9
reference: Leviticus 9:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ֠/יַּקְרִבוּ בְּנֵ֨י אַהֲרֹ֣ן אֶת הַ/דָּם֮ אֵלָי/ו֒ וַ/יִּטְבֹּ֤ל אֶצְבָּע/וֹ֙ בַּ/דָּ֔ם וַ/יִּתֵּ֖ן עַל קַרְנ֣וֹת הַ/מִּזְבֵּ֑חַ וְ/אֶת הַ/דָּ֣ם יָצַ֔ק אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/009.yaml
  text: And Aaron’s sons brought the blood to him[a], and he dipped his finger in the blood and put it on the horns of the altar[c][b], and he poured out the blood at the base of the altar.
translation:
  language: hi
  text: हारून के पुत्र लहू उसके पास ले आए[a]। तब उसने अपनी उँगली लहू में डुबोई और उसे वेदी के सींगों[b] पर लगाया; और लहू को वेदी के आधार पर उंडेल दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लहू उसके निकट प्रस्तुत किया”; इस इब्रानी क्रिया का अनुष्ठानिक प्रसंग में अर्थ “निकट लाना” या “प्रस्तुत करना” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: वेदी के “सींग” उसके कोनों पर बने सींग-जैसे उभरे हुए भाग थे।
    reason: cultural_note
  - marker: c
    text: या, “वेदी की नींव पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִבוּ
  choice: ले आए
  rationale: हिफ़ील रूप का अर्थ ‘निकट लाना’ या अनुष्ठान में ‘प्रस्तुत करना’ हो सकता है। यहाँ सहायक याजकों द्वारा लहू हारून के पास लाने की ठोस क्रिया के लिए ‘ले आए’ सहज और सटीक है।
- source_word: בְּנֵי אַהֲרֹן
  choice: हारून के पुत्र
  rationale: सम्बन्धसूचक इब्रानी पदबंध का सीधा, गरिमापूर्ण और स्वाभाविक हिन्दी रूप।
- source_word: הַדָּם
  choice: लहू
  rationale: यह पहले से संदर्भित बलि के निश्चित लहू को दर्शाता है। ‘लहू’ आधुनिक हिन्दी में समझने योग्य है और धार्मिक अनुष्ठान के प्रसंग में स्वाभाविक बैठता है।
- source_word: אֵלָיו
  choice: उसके पास
  rationale: मूल पाठ के सर्वनाम को बनाए रखा गया है; निकटवर्ती संदर्भ में इसका स्वाभाविक संकेत हारून की ओर है।
- source_word: וַיִּטְבֹּל
  choice: डुबोई
  rationale: טבל का मूल अर्थ किसी वस्तु को तरल में डुबाना है; उँगली और लहू के प्रसंग में यही स्पष्ट और स्वाभाविक क्रिया है।
- source_word: אֶצְבָּעוֹ
  choice: अपनी उँगली
  rationale: कर्ता हारून ही बना रहता है; हिन्दी में कर्ता की अपनी देह के अंग के लिए ‘अपनी’ अधिक स्वाभाविक है और मूल के एकवचन को सुरक्षित रखता है।
- source_word: וַיִּתֵּן עַל
  choice: उसे … पर लगाया
  rationale: נתן के सामान्य अर्थ ‘रखना/देना’ को इस अनुष्ठानिक प्रसंग में ‘लगाया’ स्वाभाविक रूप से व्यक्त करता है; ‘उसे’ का संकेत लहू की ओर है।
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: वेदी के सींगों
  rationale: मूल उपासना-संबंधी बिंब को ज्यों का त्यों रखा गया है; इसका आशय वेदी के सींग-जैसे उभरे हुए कोनों से है।
- source_word: יָצַק
  choice: उंडेल दिया
  rationale: यह क्रिया तरल को डालने या उंडेलने को व्यक्त करती है; यहाँ जानबूझकर लहू डालने की क्रिया स्पष्ट होती है।
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: वेदी की नींव पर
  rationale: יְסוֹד का अर्थ ‘नींव/आधार’ है। हिन्दी में ‘वेदी की नींव पर’ स्थान और क्रिया दोनों को स्पष्ट तथा स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: אֵלָיו में सर्वनाम का संकेत
  choice: सर्वनाम ‘उसके’ को बनाए रखते हुए इसे संदर्भतः हारून की ओर संकेत करने दिया गया है।
  alternative: सर्वनाम को स्पष्ट करके ‘हारून के पास’ कहना, अथवा किसी अन्य निहित संदर्भ—जैसे वेदी—से जोड़ना।
  rationale: तत्काल प्रसंग में हारून अनुष्ठान कर रहा है और उसके पुत्र सहायता कर रहे हैं, इसलिए हारून सबसे स्वाभाविक पूर्वपद है। फिर भी मूल के सर्वनाम को नाम से बदलकर अस्पष्टता को अनावश्यक रूप से समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘वेदी’, ‘लहू’ और ‘सींग’ जैसे पारंपरिक उपासना-संबंधी शब्द मूल बिंब को सुरक्षित रखते हैं; सांस्कृतिक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
