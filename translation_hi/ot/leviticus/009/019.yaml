translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘कलेजा’ धार्मिक हिन्दी में प्रचलित और ‘यकृत’ से अधिक सहज है; पद मूल वाक्य की सूची-जैसी संरचना को बनाए रखता है।
