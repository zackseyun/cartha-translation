  text: וְ/אֶת הַ/חֲלָבִ֖ים מִן הַ/שּׁ֑וֹר וּ/מִן הָ/אַ֔יִל הָֽ/אַלְיָ֤ה וְ/הַֽ/מְכַסֶּה֙ וְ/הַ/כְּלָיֹ֔ת וְ/יֹתֶ֖רֶת הַ/כָּבֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/019.yaml
  text: 'and the fat pieces from the ox and from the ram: the fat tail[a], the covering fat, the kidneys, and the lobe of the liver.'
translation:
  language: hi
  text: और बैल[a] तथा मेढ़े की चर्बी के भाग—चर्बीदार पूँछ, ढकनेवाली चर्बी, दोनों गुर्दे और कलेजे का उभार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “साँड़।” इब्रानी शब्द शोर गोवंश के नर पशु के लिए व्यापक रूप से प्रयुक्त हो सकता है; बलि के संदर्भ में इसका अनुवाद “बैल” या “साँड़” किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הַחֲלָבִים
  choice: और ... चर्बी के भाग
  rationale: बहुवचन חֲלָבִים बलि के लिए निकाले गए निश्चित चर्बीदार भागों को दर्शाता है; ‘चर्बी के भाग’ सामान्य चर्बी की अपेक्षा इस अनुष्ठानिक अर्थ को अधिक स्पष्ट रखता है।
- source_word: מִן הַשּׁוֹר
  choice: बैल की
  rationale: שׁוֹר गोवंश के पशु, और इस बलि-संदर्भ में नर पशु, को सूचित करता है; पिछले संदर्भ के अनुरूप ‘बैल’ स्वाभाविक और सटीक है।
- source_word: וּמִן הָאַיִל
  choice: तथा मेढ़े की
  rationale: אַיִל बलि-संदर्भ में स्पष्ट रूप से नर भेड़, अर्थात ‘मेढ़ा’, है।
- source_word: הָאַלְיָה
  choice: चर्बीदार पूँछ
  rationale: אַלְיָה भेड़ की विशिष्ट मोटी अथवा चर्बीदार पूँछ को सूचित करता है; यह हिन्दी में शारीरिक अंग और उसकी विशेषता दोनों स्पष्ट करता है।
- source_word: הַמְכַסֶּה
  choice: ढकनेवाली चर्बी
  rationale: כסה ‘ढकना’ से बना यह पद भीतर के अंगों को ढकने वाली चर्बी की ओर संकेत करता है; प्रसंग से निहित ‘चर्बी’ जोड़ने पर अर्थ सहज होता है।
- source_word: הַכְּלָיֹת
  choice: दोनों गुर्दे
  rationale: इब्रानी बहुवचन शरीर के युग्म अंगों को दर्शाता है; हिन्दी में ‘दोनों गुर्दे’ स्वाभाविक और स्पष्ट है।
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: कलेजे का उभार
  rationale: יֹתֶרֶת उस अंग-भाग को दर्शाता है जो कलेजे से लगा या निकला हुआ है; उसकी ठीक आधुनिक शारीरिक पहचान विवादित होने के कारण ‘उभार’ मूल की सामान्य शारीरिक छवि को बिना अति-निर्धारण के रखता है।
