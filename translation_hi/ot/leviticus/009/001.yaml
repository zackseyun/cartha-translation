  text: And it happened on the eighth day that Moses called Aaron and his sons and the elders of Israel[a].
translation:
  language: hi
  text: आठवें दिन ऐसा हुआ कि मूसा ने हारून, उसके पुत्रों और इस्राएल के बुज़ुर्गों को बुलाया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बुलाया” का अर्थ यहाँ “सभा के लिए बुलाया” भी हो सकता है; इब्रानी क्रिया प्रसंग में दोनों भाव रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ कि
  rationale: यह इब्रानी कथात्मक संक्रमण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना पुरातन शैली अपनाए।
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: आठवें दिन
  rationale: यह स्पष्ट कालवाचक पद का सीधा अनुवाद है; पिछले सात दिनों के बाद होने की व्याख्या पाठ में नहीं जोड़ी गई।
- source_word: קָרָא
  choice: बुलाया
  rationale: क्रिया का सामान्य अर्थ ‘बुलाना’ है; प्रसंग में ‘बुलवा भेजा’ या ‘सभा के लिए बुलाया’ भी सम्भव है, पर वे अधिक व्याख्यात्मक हैं।
- source_word: לְאַהֲרֹן
  choice: हारून
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: וּלְבָנָיו
  choice: उसके पुत्रों
  rationale: याजकीय प्रसंग में בנים हारून के पुरुष वंशजों, अर्थात उसके पुत्रों, को सूचित करता है।
- source_word: וּלְזִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनियों
  rationale: यह इस्राएल के मान्य वरिष्ठ प्रतिनिधियों या अगुओं के लिए प्रचलित, गरिमापूर्ण हिन्दी पद है।
