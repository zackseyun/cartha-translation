source:
  edition: WLC
  text: וַ/תֵּ֤צֵא אֵשׁ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וַ/תֹּ֨אכַל֙ עַל הַ/מִּזְבֵּ֔חַ אֶת הָ/עֹלָ֖ה וְ/אֶת הַ/חֲלָבִ֑ים וַ/יַּ֤רְא כָּל הָ/עָם֙ וַ/יָּרֹ֔נּוּ וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/024.yaml
  text: And fire came out from before Yahweh and consumed on the altar the burnt offering and the fat portions[a]. And all the people saw[b], and they shouted for joy and fell on their faces.
translation:
  language: hi
  text: तब याहवे के सामने से आग निकली और उसने वेदी पर होमबलि और चर्बी के भागों को भस्म कर दिया। यह देखकर सभी लोगों ने आनंद से जयजयकार की[a] और मुँह के बल गिर पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने आनंद की ऊँची पुकार लगाई।”
    reason: रנן उल्लासपूर्ण जयध्वनि या ऊँची पुकार—दोनों भाव व्यक्त कर सकता है।
lexical_decisions:
- source_word: וַתֵּצֵא אֵשׁ
  choice: आग निकली
  rationale: יצא आग की बाहर की ओर गति बताता है; ‘आग निकली’ हिन्दी में सहज है और दृश्य की सजीवता बनाए रखता है।
- source_word: מִלִּפְנֵי יְהוָה
  choice: यहोवा के सामने से
  rationale: מִלִּפְנֵי का शाब्दिक भाव ‘के सामने से’ है, जो आग के यहोवा की उपस्थिति से निकलने का संकेत सुरक्षित रखता है।
- source_word: וַתֹּאכַל
  choice: भस्म कर दिया
  rationale: क्रिया का मूल चित्र ‘खा जाना’ है, पर आग और बलि के प्रसंग में ‘भस्म कर दिया’ स्वाभाविक और सटीक हिन्दी है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: עֹלָה के लिए ‘होमबलि’ स्थापित हिन्दी बलिदानी पद है और पूरी तरह अग्नि पर चढ़ाई जाने वाली बलि को सूचित करता है।
- source_word: הַחֲלָבִים
  choice: चरबी के भागों
  rationale: बहुवचन חֲלָבִים बलिदान में चढ़ाए जाने वाले निर्धारित चरबीदार भागों को दर्शाता है, केवल सामान्य चरबी को नहीं।
- source_word: וַיָּרֹנּוּ
  choice: आनन्द से जयजयकार करने लगे
  rationale: רנן यहाँ उल्लासपूर्ण ऊँची पुकार को व्यक्त करता है; यह अनुवाद खुशी और सामूहिक जयध्वनि दोनों को स्पष्ट करता है।
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם
  choice: मुँह के बल गिर पड़े
  rationale: यह ठोस इब्रानी बिंब को बनाए रखता है और विस्मय तथा दण्डवत् भाव वाली शारीरिक मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का विशिष्ट ईश्वरीय नाम है। हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को मुख्य पाठ में रखा गया है; ‘प्रभु’ करने से व्यक्तिवाचक नाम का स्वरूप छिप जाता।
- issue: लोगों की प्रतिक्रिया का स्वरूप
  choice: आनन्द से जयजयकार
  alternative: उन्होंने ऊँची पुकार लगाई
  rationale: רנן में उल्लास का भाव हो सकता है; इसलिए प्रतिक्रिया को केवल भय की चीख नहीं माना गया, जबकि किसी औपचारिक गीत या उपासना-विधि को भी पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। बलिदानी शब्दावली में ‘वेदी’, ‘होमबलि’ और ‘चरबी के भाग’ जैसे परिचित तथा स्रोत-सटीक पद रखे गए हैं।
