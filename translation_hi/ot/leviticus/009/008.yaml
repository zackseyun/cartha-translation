source:
  edition: WLC
  text: וַ/יִּקְרַ֥ב אַהֲרֹ֖ן אֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁחַ֛ט אֶת עֵ֥גֶל הַ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/008.yaml
  text: Then Aaron came near to the altar and slaughtered the calf of the sin offering that was for himself[a].
translation:
  language: hi
  text: तब हारून वेदी के पास आया और उसने अपने लिए पापबलि के बछड़े का वध किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुद्धिकरण-बलि का बछड़ा।” इब्रानी शब्द उस बलि को सूचित कर सकता है जो पाप और अशुद्धता को दूर करने से संबंधित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב
  choice: पास गया
  rationale: यह קרב की ठोस गतिशीलता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और हारून के वेदी की ओर बढ़ने को स्पष्ट रखता है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: बलिदान-संबंधी प्रसंग में מִזְבֵּחַ का मानक और सहज हिन्दी पर्याय है।
- source_word: וַיִּשְׁחַט
  choice: बलि के लिए काटा
  rationale: שׁחט यहाँ पशु के बलिदानी वध को दर्शाता है। यह अभिव्यक्ति केवल सामान्य हत्या के बजाय अनुष्ठानिक वध का आशय स्पष्ट करती है।
- source_word: עֵגֶל
  choice: बछड़ा
  rationale: עֵגֶל का सीधा अर्थ कम आयु का गोवंशीय पशु, अर्थात बछड़ा, है और यह निकटवर्ती प्रसंग से मेल खाता है।
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: यहाँ חַטָּאת बलिदान की श्रेणी को सूचित करता है। हिन्दी बाइबलीय प्रयोग में 'पापबलि' संक्षिप्त और समझने योग्य है; शुद्धिकरण से जुड़ी संभावित अर्थछाया पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אֲשֶׁר לוֹ
  choice: अपने लिए
  rationale: प्रसंग में यह बलि हारून की अपनी ओर से है, लोगों की ओर से चढ़ाई जाने वाली बलियों के विपरीत। 'अपने लिए' इस संबंध को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: याजकीय बलिदानी प्रसंग में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: इब्रानी शब्द यहाँ बलिदान की एक श्रेणी का नाम है और पाप तथा अशुद्धता को दूर करने की क्रिया से संबद्ध हो सकता है। मुख्य पाठ में परिचित 'पापबलि' रखा गया है, जबकि वैकल्पिक अनुष्ठानिक अर्थछाया को पादटिप्पणी में दिया गया है ताकि विवादित अर्थ को एकतरफा न बनाया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। 'बलि के लिए काटा' अनुष्ठानिक वध को स्पष्ट करता है; 'पापबलि' स्थापित धार्मिक पद है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
