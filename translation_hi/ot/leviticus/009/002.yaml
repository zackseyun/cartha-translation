id: LEV.9.2
reference: Leviticus 9:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶֽל אַהֲרֹ֗ן קַח לְ֠/ךָ עֵ֣גֶל בֶּן בָּקָ֧ר לְ/חַטָּ֛את וְ/אַ֥יִל לְ/עֹלָ֖ה תְּמִימִ֑ם וְ/הַקְרֵ֖ב לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/002.yaml
  text: And he said to Aaron[a], “Take for yourself a calf, a son of the herd, for a sin offering, and a ram for a burnt offering, both without blemish, and present them before Yahweh.”
translation:
  language: hi
  text: फिर उसने हारून से कहा, “अपने लिए पापबलि के लिए गाय-बैल के झुंड का एक बछड़ा[a] और होमबलि के लिए एक मेढ़ा ले—दोनों में कोई दोष न हो—और उन्हें याहवे के सामने प्रस्तुत कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “एक बछड़ा, गाय-बैल के झुंड का बच्चा”—अर्थात् कम उम्र का एक गोवंशीय पशु।
    reason: मूल इब्रानी पदबंध की विशेष बनावट और पशु की पहचान स्पष्ट करना।
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אַהֲרֹן
  choice: फिर उसने हारून से कहा
  rationale: कथात्मक वय्यिक्तोल को स्वाभाविक हिन्दी प्रवाह में ‘फिर’ से व्यक्त किया गया है; कर्ता पिछले संदर्भ से समझा जाता है, जैसा इब्रानी में है।
- source_word: קַח לְךָ
  choice: अपने लिए ... ले
  rationale: לְךָ के आत्म-संबंधी भाव को बनाए रखते हुए आज्ञार्थक अभिव्यक्ति को सहज हिन्दी में रखा गया है।
- source_word: עֵגֶל בֶּן בָּקָר
  choice: गाय-बैल के झुंड का एक बछड़ा
  rationale: इब्रानी पदबंध का आशय एक कम उम्र का गोवंशीय पशु है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक बनावट पादटिप्पणी में दी गई है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: बलिदानी संदर्भ में חַטָּאת अमूर्त ‘पाप’ नहीं, पाप के लिए चढ़ाई जाने वाली बलि को दर्शाता है।
- source_word: וְאַיִל לְעֹלָה
  choice: और होमबलि के लिए एक मेढ़ा
  rationale: אַיִל का सामान्य बलिदानी अर्थ ‘मेढ़ा’ और עֹלָה का पारंपरिक तथा स्पष्ट हिन्दी प्रतिशब्द ‘होमबलि’ है।
- source_word: תְּמִימִם
  choice: दोनों में कोई दोष न हो
  rationale: बहुवचन विशेषण दोनों पशुओं पर लागू होता है। यह अभिव्यक्ति बलिदानी शारीरिक अखंडता को स्पष्ट करती है और नैतिक ‘निर्दोषता’ का अनचाहा अर्थ टालती है।
- source_word: וְהַקְרֵב
  choice: और उन्हें ... प्रस्तुत कर
  rationale: קרב के हिफ़ील रूप का अर्थ निकट लाना या विधिपूर्वक सामने प्रस्तुत करना है। ‘बलि चढ़ा’ कहने से आगे होने वाली क्रिया को समय से पहले व्यक्त किया जाता, इसलिए ‘प्रस्तुत कर’ चुना गया है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי उपस्थिति का भाव देता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: חַטָּאת का अर्थ
  choice: पापबलि
  alternative: पाप के लिए
  rationale: यहाँ पशु और बलिदानी विधि का संदर्भ स्पष्ट है, इसलिए शब्द एक बलि को सूचित करता है; फिर भी उसके प्रायश्चित-संबंधी पूरे धर्मवैज्ञानिक अर्थ को अतिरिक्त व्याख्या से सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। बलिदानी पारिभाषिक शब्द ‘पापबलि’ और ‘होमबलि’ बनाए गए हैं। एकवचन आज्ञार्थक ‘ले/कर’ हारून को सीधे संबोधन के अनुरूप है।
