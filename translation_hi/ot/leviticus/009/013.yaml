source:
  edition: WLC
  text: וְ/אֶת הָ/עֹלָ֗ה הִמְצִ֧יאוּ אֵלָ֛י/ו לִ/נְתָחֶ֖י/הָ וְ/אֶת הָ/רֹ֑אשׁ וַ/יַּקְטֵ֖ר עַל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/013.yaml
  text: And they brought the burnt offering to him[a], piece by piece, and the head[b]; and he burned them on the altar.
translation:
  language: hi
  text: उन्होंने होमबलि को उसके टुकड़ों और सिर समेत उसके पास लाया, और उसने उन्हें वेदी पर जलाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: लैव्यव्यवस्था के बलिदानी संदर्भ में עֹלָה के लिए यह प्रचलित और संक्षिप्त हिन्दी पद है; इससे वेदी पर पूरी तरह जलाए जाने वाले बलिदान का बोध होता है।
- source_word: הִמְצִיאוּ אֵלָיו
  choice: हारून के पास पहुँचाया
  rationale: हिफ़ील रूप यहाँ किसी वस्तु को उसके पास लाने या सौंपने का भाव देता है। पूर्ववर्ती संदर्भ से ‘उसने’ हारून है, इसलिए हिन्दी में स्पष्टता के लिए नाम रखा गया है।
- source_word: לִנְתָחֶיהָ
  choice: उसके टुकड़ों
  rationale: נֶתַח काटे हुए पशु के अलग-अलग अंगों या टुकड़ों को दर्शाता है। ‘टुकड़ों’ सहज हिन्दी में इस विभाजित प्रस्तुति को व्यक्त करता है।
- source_word: הָרֹאשׁ
  choice: सिर
  rationale: यह सीधा शारीरिक पद है और मूल पाठ सिर को अन्य कटे हुए टुकड़ों से अलग उल्लेखित करता है।
- source_word: וַיַּקְטֵר
  choice: धूप में जलाया
  rationale: बलिदानी संदर्भ में קטר का अर्थ वेदी पर इस प्रकार जलाना है कि अर्पण का धुआँ उठे। ‘धूप में जलाया’ साधारण ‘जलाया’ से इस अनुष्ठानिक अर्थ को अधिक स्पष्ट करता है।
- source_word: עַל הַמִּזְבֵּחַ
  choice: वेदी पर
  rationale: यह मानक, स्वाभाविक हिन्दी बलिदानी अभिव्यक्ति है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण बलिदानी शब्दावली। सर्वनाम की संभावित अस्पष्टता से बचने के लिए संदर्भानुसार ‘हारून’ स्पष्ट किया गया है।
