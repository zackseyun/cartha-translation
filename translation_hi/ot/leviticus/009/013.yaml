review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the burnt offering, its cut pieces, the head, Aaron as the antecedent of 'to him,' and the altar. However, 'धूप में जलाया' means burning in incense/incense smoke and does not represent the sacrificial sense of וַיַּקְטֵר.
  naturalness: The sentence is generally readable, but 'धूप में जलाया' is unnatural and misleading in this context. 'उसके टुकड़ों और सिर समेत' naturally conveys that the offering was brought in its portions, including the head.
  terminology: '''होमबलि'' and ''वेदी'' are suitable established Hindi sacrificial terms. ''जलाया'' adequately renders the altar-burning action without importing the unrelated idea of incense.'
  issues:
  - severity: high
    issue: ‘धूप में जलाया’
    rationale: Hebrew וַיַּקְטֵר refers to burning the sacrificial portions on the altar so that they go up in smoke; it does not mean burning something ‘in incense’ (धूप में). This wording changes the ritual action.
  - severity: low
    issue: Initial ‘फिर’
    rationale: The Hebrew conjunction simply continues the narrative (‘and’). ‘फिर’ is not impossible, but omitting it gives a closer and smoother rendering here.
  revised_text: उन्होंने होमबलि को उसके टुकड़ों और सिर समेत उसके पास लाया, और उसने उन्हें वेदी पर जलाया।
