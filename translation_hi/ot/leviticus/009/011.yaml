source:
  edition: WLC
  text: וְ/אֶת הַ/בָּשָׂ֖ר וְ/אֶת הָ/ע֑וֹר שָׂרַ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/011.yaml
  text: But the flesh and the hide he burned with fire outside the camp[a].
translation:
  language: hi
  text: लेकिन मांस और खाल को उसने छावनी के बाहर आग में जला दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मांस और खाल को उसने छावनी के बाहर आग में जला दिया।”
    reason: आरंभिक וְ का मूल अर्थ ‘और’ है; ‘लेकिन’ पिछले पद से विरोध को स्पष्ट करने वाला प्रसंगगत अनुवाद है।
lexical_decisions:
- source_word: וְ/אֶת
  choice: लेकिन … को
  rationale: וְ क्रम को आगे बढ़ाता है, पर पिछले पद में वेदी पर चढ़ाई गई वस्तुओं और यहाँ छावनी के बाहर जलाई गई वस्तुओं के बीच विरोध है; इसलिए हिंदी में ‘लेकिन’ स्वाभाविक है। אֵת प्रत्यक्ष कर्म का चिह्न है और उसका अलग अनुवाद नहीं किया गया।
- source_word: הַ/בָּשָׂר
  choice: मांस
  rationale: בָּשָׂר पशु के मांस को दर्शाता है; आधुनिक हिंदी में ‘मांस’ स्पष्ट, गरिमापूर्ण और बलिदान-संदर्भ के अनुकूल है।
- source_word: הָ/עוֹר
  choice: खाल
  rationale: עוֹר यहाँ बलि-पशु की त्वचा है; पशु के संदर्भ में ‘खाल’ सामान्य हिंदी के ‘चमड़ी’ से अधिक उपयुक्त और गरिमापूर्ण है।
- source_word: שָׂרַף
  choice: उसने … जला दिया
  rationale: שָׂרַף का अर्थ जलाना है। ‘जला दिया’ हिंदी में पूर्ण हुई क्रिया को स्वाभाविक ढंग से व्यक्त करता है, बिना यह जोड़े कि वस्तुएँ पूरी तरह भस्म हो गईं।
- source_word: בָּ/אֵשׁ
  choice: आग में
  rationale: בְּ + אֵשׁ को हिंदी में स्वाभाविक रूप से ‘आग में’ कहा जाता है; यह जलाने के माध्यम को स्पष्ट करता है।
- source_word: מִ/חוּץ לַ/מַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह वाक्यांश इस्राएली पड़ाव की सीमा के बाहर का स्थान बताता है। ‘छावनी’ आधुनिक पाठक के लिए स्पष्ट है और अनुष्ठानिक भौगोलिक भेद बनाए रखता है।
theological_decisions:
- issue: बलिदान-संदर्भ में अनुष्ठानिक निपटान की भाषा
  choice: मांस और खाल को छावनी के बाहर जलाने की ठोस क्रिया को सीधे व्यक्त किया गया है।
  alternative: बाद के बाइबिलीय प्रतीकों या प्रतिरूपात्मक अर्थ को अनुवाद में प्रमुख बनाना।
  rationale: इब्रानी पाठ यहाँ याजकीय प्रक्रिया का वर्णन करता है; इसलिए बाद की धर्मवैज्ञानिक व्याख्या को पाठ में जोड़े बिना क्रिया और स्थान को स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल किंतु गरिमापूर्ण शैली। ‘मांस’, ‘खाल’ और ‘छावनी’ जैसे ठोस शब्द बलिदान-विधि को सामान्य पाठक के लिए स्पष्ट रखते हैं।
