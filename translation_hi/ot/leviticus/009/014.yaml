id: LEV.9.14
reference: Leviticus 9:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּרְחַ֥ץ אֶת הַ/קֶּ֖רֶב וְ/אֶת הַ/כְּרָעָ֑יִם וַ/יַּקְטֵ֥ר עַל הָ/עֹלָ֖ה הַ/מִּזְבֵּֽחָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/014.yaml
  text: He washed the entrails and the lower legs[a], and he burned them on the altar, on top of the burnt offering.
translation:
  language: hi
  text: उसने अंतड़ियों और निचली टाँगों को धोया, और उन्हें वेदी पर होमबलि के ऊपर धुएँ में चढ़ा दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें वेदी पर होमबलि के ऊपर जला दिया।”
    reason: קטר के अनुष्ठानिक अर्थ को ‘धुएँ में चढ़ाना’ कहा जा सकता है, जबकि प्रसंगानुसार सरल ‘जलाना’ भी सम्भव अनुवाद है।
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: उसने ... धोया
  rationale: רחץ बलिदान-संबंधी प्रसंग में पानी से धोने की क्रिया बताता है; ‘धोया’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: הַקֶּרֶב
  choice: अंतड़ियों
  rationale: इस बलिदान-संबंधी प्रसंग में קֶרֶב पशु के भीतरी अंगों को सूचित करता है; ‘अंतड़ियाँ’ सामान्य पाठक के लिए ठोस और सहज शब्द है।
- source_word: הַכְּרָעָיִם
  choice: निचली टाँगों
  rationale: כְּרָעַיִם पशु की टाँगों, विशेषतः उनके निचले भागों को सूचित करता है; यह अनुवाद उसकी शारीरिक विशिष्टता बनाए रखता है।
- source_word: וַיַּקְטֵר
  choice: धुएँ में चढ़ा दिया
  rationale: קטר का हिफ़ील रूप याजकीय बलिदान के प्रसंग में किसी वस्तु को वेदी पर जलाकर उसका धुआँ ऊपर चढ़ाने का अनुष्ठानिक भाव रखता है; यह वाक्यांश सामान्य ‘जलाया’ से उस भाव को अधिक स्पष्ट करता है।
- source_word: עַל הָעֹלָה
  choice: होमबलि के ऊपर
  rationale: עַל यहाँ वेदी पर पहले से रखी होमबलि के ऊपर स्थान या संबंध को व्यक्त करता है; ‘के ऊपर’ मूल की संरचना और संभावित अर्थ को सुरक्षित रखता है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: עֹלָה उस बलिदान का प्रचलित याजकीय पद है जो वेदी पर पूर्णतः जलाया जाता था; ‘होमबलि’ मानक, संक्षिप्त और समझने योग्य हिन्दी पद है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: מִזְבֵּחַ का अर्थ ‘वेदी’ है और दिशासूचक प्रत्यय को हिन्दी में ‘पर’ के द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘धुएँ में चढ़ा दिया’ बलिदान की अनुष्ठानिक क्रिया को व्यक्त करता है, और अधिक सामान्य विकल्प पादटिप्पणी में दिया गया है।
