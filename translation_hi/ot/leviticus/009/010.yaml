base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/010.yaml
  text: And the fat[a], the kidneys, and the lobe of the liver from the sin offering he turned into smoke on the altar, just as Yahweh had commanded Moses.
translation:
  language: hi
  text: और पापबलि[a] की चर्बी, दोनों गुर्दे और कलेजे की लोब उसने वेदी पर धुएँ में जलाया, जैसा यहोवा ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुद्धिकरण-बलि।” इब्रानी शब्द पाप से निपटने के साथ-साथ अशुद्धता दूर करने में इस बलि की भूमिका पर भी बल दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶב
  choice: चर्बी
  rationale: बलिदान के प्रसंग में यह वे चर्बी वाले भाग हैं जो वेदी पर चढ़ाए जाते थे; ‘चर्बी’ सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: כְּלָיֹת
  choice: दोनों गुर्दे
  rationale: इब्रानी पद शरीर के गुर्दों को सूचित करता है; हिन्दी में द्विवचन का अर्थ स्पष्ट करने के लिए ‘दोनों’ जोड़ा गया है।
- source_word: יֹּתֶרֶת מִן־הַכָּבֵד
  choice: कलेजे का उभार
  rationale: यह कलेजे से जुड़ा अतिरिक्त भाग अथवा उपांग सूचित करता है; ‘उभार’ शारीरिक संदर्भ को सहज हिन्दी में रखता है और अत्यधिक निश्चित आधुनिक शरीर-रचनात्मक पहचान नहीं थोपता।
- source_word: חַטָּאת
  choice: पापबलि
  rationale: यह प्रचलित और संक्षिप्त बलिदानी पद है; शुद्धिकरण से संबंधित उसकी वैध कार्यात्मक छाया को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הִקְטִיר
  choice: जलाकर धुआँ किया
  rationale: हिफ़ील रूप सामान्यतः केवल जलाने के बजाय वेदी पर चढ़ी वस्तु को धुएँ में ऊपर उठाने की बलिदानी क्रिया बताता है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक रूप के बावजूद क्रिया के साथ हिन्दी में ‘वेदी पर’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: बलिदानी विधान में חַטָּאת का अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यह शब्द पाप से संबंधित बलि तथा अशुद्धता दूर करने वाली बलि—दोनों कार्यात्मक पहलुओं को समेट सकता है। मुख्य पाठ में परिचित वर्गनाम रखा गया और दूसरा वैध अर्थ पादटिप्पणी में दिया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। बलिदानी क्रिया की विशिष्टता के लिए ‘जलाकर धुआँ किया’ और अस्पष्ट शारीरिक पद के लिए ‘कलेजे का उभार’ चुना गया है।
