  yaml_path: translation/ot/leviticus/009/016.yaml
  text: And he presented the burnt offering and offered it according to the ordinance[a].
translation:
  language: hi
  text: फिर उसने होमबलि प्रस्तुत की और उसे विधान[a] के अनुसार चढ़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्धारित रीति के अनुसार”।
    reason: מִשְׁפָּט यहाँ औपचारिक विधान और निर्धारित प्रक्रिया—दोनों भाव व्यक्त कर सकता है।
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: प्रस्तुत की
  rationale: हिफ़ील रूप का मूल भाव ‘निकट लाना/प्रस्तुत करना’ है। बलिदान-संबंधी प्रसंग में ‘प्रस्तुत की’ अनुष्ठानिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है और अगले क्रियापद से अनावश्यक पुनरुक्ति से बचता है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: यह उस बलि का प्रचलित बाइबिलीय हिन्दी नाम है जो पूरी तरह वेदी पर जलाई जाती थी; यह इब्रानी बलिदान-संबंधी तकनीकी पद को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיַּעֲשֶׂהָ
  choice: उसे ... चढ़ाया
  rationale: עשה का मूल अर्थ व्यापक रूप से ‘करना/बनाना’ है, पर यहाँ बलिदान-विधि को पूरा करना अभिप्रेत है। ‘चढ़ाया’ हिन्दी में प्रसंगानुकूल और स्वाभाविक है, यद्यपि मूल क्रिया अपने आप में इससे अधिक व्यापक है।
- source_word: כַּמִּשְׁפָּט
  choice: विधान के अनुसार
  rationale: מִשְׁפָּט यहाँ बलि चढ़ाने के निर्धारित नियम या विधि को सूचित करता है। ‘विधान के अनुसार’ उसके औपचारिक और अनुष्ठानिक बल को बनाए रखता है।
theological_decisions: []
