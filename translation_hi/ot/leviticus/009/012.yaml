base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/012.yaml
  text: Then he slaughtered the burnt offering[a], and Aaron’s sons brought the blood to him, and he splashed it against the altar on all sides.
translation:
  language: hi
  text: तब उसने होमबलि के पशु का वध किया। हारून के पुत्र लहू उसके पास ले आए, और उसने वेदी पर चारों ओर लहू उछाल दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “वेदी पर चारों ओर छिड़का” भी किया जाता है। लहू लगाने के लिए प्रयुक्त इब्रानी क्रिया हल्के छिड़काव के बजाय उसे बलपूर्वक उछालने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: तब उसने ... वध किया
  rationale: बलिदान के प्रसंग में שׁחט अनुष्ठानिक रूप से पशु का वध करने को दर्शाता है; ‘तब’ कथात्मक क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָעֹלָה
  choice: होमबलि के पशु
  rationale: עֹלָה उस बलिदान का प्रचलित नाम है जो वेदी पर पूर्णतः जलाया जाता था। हिन्दी में ‘होमबलि के पशु का वध’ अर्थ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: וַיַּמְצִאוּ
  choice: ले आए
  rationale: यहाँ क्रिया हारून के पुत्रों द्वारा लहू को हारून के पास लाकर देने की अनुष्ठानिक क्रिया बताती है।
- source_word: בְּנֵי אַהֲרֹן
  choice: हारून के पुत्र
  rationale: यह पारिवारिक और याजकीय पहचान दोनों को औपचारिक, सहज हिन्दी में बनाए रखता है।
- source_word: הַדָּם
  choice: लहू
  rationale: ‘लहू’ आधुनिक हिन्दी में समझने योग्य, गरिमापूर्ण और बलिदान-संबंधी प्रसंग के अनुकूल शब्द है।
- source_word: וַיִּזְרְקֵהוּ
  choice: उसे ... उछालकर लगाया
  rationale: זרק यहाँ लहू को हल्के से छिड़कने के बजाय वेदी की ओर फेंककर लगाने की क्रिया दर्शाता है। यह अभिव्यक्ति क्रिया की शक्ति और उसके अनुष्ठानिक उद्देश्य दोनों को स्पष्ट करती है।
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: वेदी पर चारों ओर
  rationale: यह वेदी के चारों ओर उसके विभिन्न भागों पर लहू लगाए जाने का वितरणात्मक भाव व्यक्त करता है।
