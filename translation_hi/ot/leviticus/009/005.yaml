reference: Leviticus 9:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽ/יִּקְרְבוּ֙ כָּל הָ֣/עֵדָ֔ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/005.yaml
  text: So they brought what Moses had commanded to the front of the tent of meeting, and all the congregation came near and stood before Yahweh.
translation:
  language: hi
  text: तब वे जो कुछ मूसा ने आज्ञा दी थी, उसे मिलाप के तंबू के सामने ले आए। सारी मंडली पास आई और याहवे के सामने खड़ी हो गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: ले आए
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर गंतव्य की ओर गति के इस प्रसंग में ‘ले आए’ स्वाभाविक हिंदी है और वस्तुओं को तंबू के सामने पहुँचाने का भाव स्पष्ट करता है।
- source_word: אֵת אֲשֶׁר צִוָּה מֹשֶׁה
  choice: मूसा की आज्ञा के अनुसार वस्तुएँ
  rationale: सापेक्ष वाक्यांश पूर्वपदों में बताई गई बलि-सामग्री की ओर संकेत करता है। हिंदी में ‘वस्तुएँ’ जोड़ने से संदर्भ स्पष्ट होता है, जबकि ‘आज्ञा के अनुसार’ यह अस्पष्टता बनाए रखता है कि मूसा ने उन वस्तुओं को लाने का आदेश दिया था।
- source_word: אֶל־פְּנֵי
  choice: के सामने
  rationale: यह स्थानसूचक प्रयोग तंबू के अग्रभाग की ओर संकेत करता है; ‘के सामने’ सहज और सटीक है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह पारदर्शी, प्रचलित बाइबलीय हिंदी पद है और तंबू के नियत भेंट-स्थान होने का भाव रखता है।
- source_word: וַיִּקְרְבוּ
  choice: पास आकर
  rationale: קרב के निकट आने के स्थानिक अर्थ को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: כָּל־הָעֵדָה
  choice: सारी मंडली
  rationale: עֵדָה यहाँ इस्राएल के एकत्र समुदाय को दर्शाता है; ‘मंडली’ सामुदायिक और उपासना-संबंधी दोनों भावों के लिए उपयुक्त है।
- source_word: וַיַּעַמְדוּ
  choice: खड़ी हो गई
  rationale: עמד के सामान्य अर्थ ‘खड़ा होना’ को सामूहिक कर्ता ‘मंडली’ के अनुरूप हिंदी में व्यक्त किया गया है।
- source_word: לִפְנֵי יְהוָה
  choice: यहवे के सामने
  rationale: वाक्यांश में स्थानिक और आराधनात्मक उपस्थिति दोनों निहित हैं; ‘के सामने’ दोनों को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: हिब्रू पाठ में चार-अक्षरीय वाचा-नाम सीधे आया है। ‘यहवे’ उसका आधुनिक विद्वतापरक हिंदी लिप्यंतरण है और नाम को उपाधि में बदलने से बचाता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘मिलापवाला तंबू’ और ‘मंडली’ जैसे परिचित बाइबलीय पदों का उपयोग किया गया है, किंतु वाक्य-विन्यास स्वाभाविक आधुनिक हिंदी का है।
