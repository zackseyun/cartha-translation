revisions:
- from: और मेल-बलियों[a] के लिए एक बैल और एक मेढ़ा, जिन्हें याहवे[b] के सामने बलि चढ़ाना है, और तेल मिला हुआ अन्नबलि भी लाना; क्योंकि आज याहवे तुम्हारे सामने प्रकट होगा।
  to: और याहवे[b] के सामने बलि चढ़ाने के लिए शांति-बलियों[a] के रूप में एक बैल और एक मेढ़ा, तथा तेल से मिली हुई अन्नबलि; क्योंकि आज याहवे तुम्हें दिखाई देगा।
  rationale: The revision uses the established Hindi cultic term “शांति-बलियाँ,” removes the unsupported explicit verb “लाना,” and renders the final clause as “याहवे तुम्हें दिखाई देगा” to reflect the Hebrew “will appear to you.” It retains the future force of the Niphal perfect and does not import “glory” from the following verse.
