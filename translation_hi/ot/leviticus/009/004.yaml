id: LEV.9.4
reference: Leviticus 9:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שׁ֨וֹר וָ/אַ֜יִל לִ/שְׁלָמִ֗ים לִ/זְבֹּ֨חַ֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/מִנְחָ֖ה בְּלוּלָ֣ה בַ/שָּׁ֑מֶן כִּ֣י הַ/יּ֔וֹם יְהוָ֖ה נִרְאָ֥ה אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/004.yaml
  text: and an ox and a ram for peace offerings[a], to sacrifice before Yahweh, and a grain offering mixed with oil[b]; for today Yahweh will appear to you.
translation:
  language: hi
  text: और याहवे[b] के सामने बलि चढ़ाने के लिए शांति-बलियों[a] के रूप में एक बैल और एक मेढ़ा, तथा तेल से मिली हुई अन्नबलि; क्योंकि आज याहवे तुम्हें दिखाई देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “मेल-बलियाँ,” “सहभागिता-बलियाँ” या “कुशल-क्षेम की बलियाँ” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में परमेश्वर का नाम יהוה (YHWH) है; यहाँ उसका लिप्यंतरण “याहवे” किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: बैल
  rationale: यह गोवंश के पशु का सामान्य शब्द है; बलिदान के प्रसंग में ‘बैल’ स्वाभाविक और स्पष्ट हिन्दी है, यद्यपि मूल रूप अपने-आप में पशु के लिंग को पूरी तरह निर्दिष्ट नहीं करता।
- source_word: אַיִל
  choice: मेढ़ा
  rationale: यह विशेष रूप से नर भेड़ को दर्शाता है; बलिदान-संबंधी प्रसंग में ‘मेढ़ा’ सटीक हिन्दी शब्द है।
- source_word: שְׁלָמִים
  choice: मेल-बलियाँ
  rationale: यह बहुवचन बलिदानी पद कुशल-क्षेम, शान्ति और सहभागिता से जुड़े बलिदानों को दर्शाता है। ‘मेल-बलियाँ’ हिन्दी पाठकों के लिए संबंध और सहभागिता का भाव व्यक्त करता है, जबकि पादटिप्पणी अन्य सम्भव अर्थ देती है।
- source_word: לִזְבֹּחַ
  choice: बलि चढ़ाना
  rationale: यहाँ क्रिया केवल पशु-वध नहीं, बल्कि धार्मिक रीति से बलिदान करने को दर्शाती है; इसलिए ‘बलि चढ़ाना’ अधिक उपयुक्त है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का अर्थ ‘सामने/उपस्थिति में’ है। यह रूप संक्षिप्त है और उपासना के प्रसंग को बनाए रखता है।
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: लैव्यव्यवस्था के बलिदानी विधान में यह अनाज से तैयार की जाने वाली भेंट है; ‘अन्नबलि’ संक्षिप्त और प्रचलित हिन्दी पद है।
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: तेल मिला हुआ
  rationale: यह अन्नबलि को तेल के साथ मिलाकर तैयार किए जाने का सहज आधुनिक हिन्दी वर्णन है।
- source_word: כִּי הַיּוֹם
  choice: क्योंकि आज
  rationale: כִּי यहाँ निर्देश का कारण बताता है और הַיּוֹם समय पर बल देता है; ‘क्योंकि आज’ दोनों बातों को स्पष्ट रखता है।
- source_word: נִרְאָה אֲלֵיכֶם
  choice: तुम्हारे सामने प्रकट होगा
  rationale: निफ़अल पूर्ण रूप प्रसंग में निकट भविष्य की प्रत्याशित दिव्य अभिव्यक्ति बताता है। ‘प्रकट होगा’ इस भाव को रखता है; ‘तुम्हारे सामने’ अֲלֵיכֶם के संबंधपरक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम सीधे आया है। ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: दिव्य प्रकटन के कथन का अर्थ
  choice: याहवे तुम्हारे सामने प्रकट होगा
  alternative: याहवे की महिमा तुम्हें दिखाई देगी; याहवे तुम्हारे सामने प्रकट हुआ है
  rationale: इस पद में कर्ता स्वयं יְהוָה है, ‘याहवे की महिमा’ नहीं; इसलिए अगले पद की भाषा यहाँ नहीं जोड़ी गई। प्रसंग आगामी प्रकटन की ओर संकेत करता है, अतः भविष्यकाल रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। बलिदानी पारिभाषिक शब्दों में ‘मेल-बलियाँ’ और ‘अन्नबलि’ प्रयुक्त हुए हैं; अपरिचित अर्थ-परास को पादटिप्पणी से स्पष्ट किया गया है।
