source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א אַהֲרֹ֧ן אֶת יד/ו אֶל הָ/עָ֖ם וַֽ/יְבָרְכֵ֑/ם וַ/יֵּ֗רֶד מֵ/עֲשֹׂ֧ת הַֽ/חַטָּ֛את וְ/הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/022.yaml
  text: Then Aaron lifted up his hands toward the people and blessed them[a], and he came down from offering the sin offering, the burnt offering[c][b], and the peace offerings.
translation:
  language: hi
  text: तब हारून ने लोगों की ओर अपने हाथ[a] उठाकर उन्हें आशीर्वाद दिया। फिर वह पापबलि[b], होमबलि और मेलबलियों[c] को चढ़ाने के बाद नीचे उतरा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल हिब्रू में व्याकरणतः ‘अपना हाथ’ एकवचन है; इसे आशीर्वाद देने के लिए हाथ उठाने की सामूहिक मुद्रा के रूप में भी समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पापबलि’ का अनुवाद ‘शुद्धिकरण-बलि’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘मेलबलियों’ का अनुवाद ‘सहभागिता-बलियों’ या ‘कुशल-बलियों’ के रूप में भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: उठाकर
  rationale: נשׂא का हाथ के साथ प्रयोग उठाने की शारीरिक क्रिया बताता है; हिन्दी में ‘हाथ उठाकर’ स्वाभाविक और स्पष्ट है।
- source_word: יָדוֹ
  choice: अपने हाथ
  rationale: मसोरेटिक रूप व्याकरणतः एकवचन ‘उसका हाथ’ है, पर आशीर्वाद की मुद्रा में इसे दोनों हाथों के सामूहिक अर्थ में भी समझा जाता है; हिन्दी में ‘हाथ’ रूप संख्या को खुला रख सकता है।
- source_word: אֶל הָעָם
  choice: लोगों की ओर
  rationale: אֶל दिशा सूचित करता है; यह अनुवाद हारून के हाथों की लोगों की ओर अभिमुखता बनाए रखता है।
- source_word: וַיְבָרְכֵם
  choice: उन्हें आशीर्वाद दिया
  rationale: ברך के पिएल रूप का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: וַיֵּרֶד
  choice: नीचे उतरा
  rationale: ירד का मूल अर्थ नीचे जाना या उतरना है; यह वेदी के पास के ऊँचे स्थान से उतरने का संकेत दे सकता है, बिना स्थान को अनावश्यक रूप से निश्चित किए।
- source_word: מֵעֲשֹׂת
  choice: चढ़ाने के बाद
  rationale: מן के साथ infinitive construct उस कार्य की समाप्ति के बाद संक्रमण दर्शाता है; बलिदानी प्रसंग में ‘चढ़ाने के बाद’ स्वाभाविक हिन्दी है।
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: लैव्यव्यवस्था में חטאת के लिए यह प्रचलित तकनीकी शब्द है; शुद्धिकरण की कार्यगत छाया को पाद-टिप्पणी में रखा गया है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: עֹלָה के लिए प्रचलित हिन्दी बाइबलीय तकनीकी पद, जो पूर्णतः जलाई जाने वाली बलि को सूचित करता है।
- source_word: הַשְּׁלָמִים
  choice: मेलबलियों
  rationale: שׁלמים के सामंजस्य, सहभागिता और कुशलता-संबंधी अर्थक्षेत्र को हिन्दी में पहचाने जाने योग्य बलिदानी पद के रूप में व्यक्त करता है; वैकल्पिक अर्थ पाद-टिप्पणी में दिए गए हैं।
theological_decisions:
- issue: बलिदानों की तकनीकी शब्दावली
  choice: मुख्य पाठ में ‘पापबलि’, ‘होमबलि’ और ‘मेलबलि’
  alternative: ‘शुद्धिकरण-बलि’, ‘सर्वांग होमबलि’, और ‘सहभागिता-बलि’ या ‘कुशल-बलि’
  rationale: मुख्य पाठ में प्रचलित और परस्पर पहचाने जाने योग्य लैव्यीय श्रेणियाँ रखी गई हैं, जबकि חטאת और שׁלמים की कार्यगत अथवा अर्थगत वैकल्पिक छायाएँ पाद-टिप्पणियों में संरक्षित हैं।
- issue: יָדוֹ की संख्या
  choice: ‘अपने हाथ’—हिन्दी में संख्या को संदर्भगत रूप से खुला रखने वाला प्रयोग
  alternative: स्पष्ट एकवचन ‘अपना एक हाथ’ या स्पष्ट बहुवचन ‘अपने दोनों हाथ’
  rationale: हिब्रू रूप एकवचन है, पर आशीर्वाद की पुरोहितीय मुद्रा को सामूहिक/द्विवचन अर्थ में समझना प्राचीन और सामान्य है। हिन्दी ‘हाथ’ अनावश्यक निर्णय किए बिना मूल की वास्तविक अस्पष्टता बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। बलिदानी तकनीकी पदों में हिन्दी बाइबलीय परिचितता रखी गई है, पर वैकल्पिक अर्थों को पाद-टिप्पणियों में स्पष्ट किया गया है।
