  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קְרַ֤ב אֶל הַ/מִּזְבֵּ֨חַ֙ וַ/עֲשֵׂ֞ה אֶת חַטָּֽאתְ/ךָ֙ וְ/אֶת עֹ֣לָתֶ֔/ךָ וְ/כַפֵּ֥ר בַּֽעַדְ/ךָ֖ וּ/בְעַ֣ד הָ/עָ֑ם וַ/עֲשֵׂ֞ה אֶת קָרְבַּ֤ן הָ/עָם֙ וְ/כַפֵּ֣ר בַּֽעֲדָ֔/ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/007.yaml
  text: And Moses said to Aaron[a], “Come near to the altar, and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering, and make atonement for them, just as Yahweh commanded.”
translation:
  language: hi
  text: तब मूसा ने हारून से कहा, “वेदी के पास आओ और अपनी पापबलि[a] और अपनी होमबलि चढ़ाओ, और अपने तथा लोगों के लिए प्रायश्चित करो। फिर लोगों की भेंट चढ़ाओ और उनके लिए प्रायश्चित करो, ठीक वैसे ही जैसे यहोवा ने आज्ञा दी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी शुद्धिकरण-बलि।” इब्रानी शब्द חַטָּאת पापबलि को दर्शा सकता है और कुछ संदर्भों में अशुद्धता से शुद्धिकरण पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרַב אֶל הַמִּזְבֵּחַ
  choice: वेदी के पास आओ
  rationale: पूजा-संबंधी प्रसंग में קרב का अर्थ निकट आना/आगे बढ़ना है। यह हिंदी में स्वाभाविक है और हारून को दिए सीधे आदेश को बनाए रखता है।
- source_word: וַעֲשֵׂה
  choice: चढ़ाओ
  rationale: शाब्दिक अर्थ ‘करो/बनाओ’ है, पर बलियों के साथ यह बलि अर्पित करने की क्रिया बताता है; इसलिए ‘चढ़ाओ’ सहज और प्रसंगानुकूल है।
- source_word: חַטָּאתְךָ
  choice: अपना पापबलि
  rationale: बलिदान-संबंधी विधान में חַטָּאת उस बलि को दर्शाता है जो पाप और अशुद्धता से संबंधित है। प्रचलित ‘पापबलि’ मुख्य पाठ में रखा गया है और शुद्धिकरण वाला अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: עֹלָתֶךָ
  choice: अपना होमबलि
  rationale: עֹלָה पूर्णतः जलाई जाने वाली बलि का पारिभाषिक नाम है; ‘होमबलि’ इसका स्थापित हिंदी बाइबलीय प्रतिशब्द है।
- source_word: וְכַפֵּר
  choice: प्रायश्चित करो
  rationale: याजकीय बलिदान के संदर्भ में כפר प्रायश्चित/शुद्धिकरण की क्रिया व्यक्त करता है। ‘प्रायश्चित करो’ किसी एक सिद्धान्तगत व्याख्या को थोपे बिना इसका धार्मिक भार बनाए रखता है।
- source_word: בַּעַדְךָ וּבְעַד הָעָם
  choice: अपने तथा लोगों के लिए
  rationale: בְּעַד प्रतिनिधित्व अथवा हित में किए गए कार्य को दर्शाता है; हिंदी में ‘के लिए’ स्वाभाविक रूप से यह अर्थ देता है।
- source_word: קָרְבַּן הָעָם
  choice: लोगों की भेंट
  rationale: קָרְבָּן अर्पित की जाने वाली भेंट का सामान्य शब्द है और संबंधवाचक रचना को ‘लोगों की भेंट’ स्पष्ट रूप से दर्शाती है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: ठीक वैसे ही जैसे यहोवा ने आज्ञा दी है
  rationale: כַּאֲשֶׁר आदेश के अनुरूप कार्य करने पर बल देता है। יְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: बलिदान-संबंधी संदर्भ में חַטָּאת का अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यह शब्द अपराध से संबंधित बलि और अशुद्धता के शुद्धिकरण—दोनों आयाम रख सकता है। परिचित और वैध ‘पापबलि’ मुख्य पाठ में है, जबकि वैकल्पिक आयाम पादटिप्पणी में रखा गया है।
- issue: כפר का अनुवाद
  choice: प्रायश्चित करो
  alternative: शुद्धि-विधान पूरा करो
  rationale: इब्रानी क्रिया का अर्थक्षेत्र प्रायश्चित और धार्मिक शुद्धिकरण दोनों को समेटता है। चुना हुआ अनुवाद किसी संकीर्ण प्रायश्चित-सिद्धान्त को आरोपित नहीं करता।
- issue: याजक का अपने और लोगों के लिए प्रायश्चित करना
  choice: अपने तथा लोगों के लिए प्रायश्चित करो
  alternative: अपनी ओर से और लोगों की ओर से प्रायश्चित करो
  rationale: पाठ हारून के प्रतिनिधिक याजकीय कार्य और स्वयं उसके लिए प्रायश्चित—दोनों को स्पष्ट रूप से रखता है; अनुवाद इस तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट धार्मिक शैली अपनाई गई है। ‘वेदी’, ‘पापबलि’, ‘होमबलि’ और ‘प्रायश्चित’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं; वाक्यरचना साधारण पाठक के लिए सहज बनाई गई है।
