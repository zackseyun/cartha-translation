  text: They placed the fat pieces on the breasts[a], and he burned the fat pieces on the altar.
translation:
  language: hi
  text: उन्होंने चर्बी के टुकड़े छाती के भागों पर रखे, और उसने चर्बी के टुकड़ों को वेदी पर जलाया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “उसने चर्बी के टुकड़ों को वेदी पर धुएँ में चढ़ाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: उन्होंने … रखे
  rationale: שׂים का सामान्य अर्थ ‘रखना’ है। बहुवचन कर्ता को बनाए रखते हुए यह अनुष्ठानिक क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַחֲלָבִים
  choice: चरबी के टुकड़े
  rationale: बलिदान के प्रसंग में חֵלֶב का बहुवचन चढ़ाए जाने के लिए अलग किए गए चरबी वाले भागों को सूचित करता है; ‘टुकड़े’ बहुवचन को ठोस और स्पष्ट बनाता है।
- source_word: עַל הֶחָזוֹת
  choice: छाती के हिस्सों पर
  rationale: חָזֶה यहाँ बलि-पशु की छाती के निर्धारित हिस्से को दर्शाता है। ‘छाती के हिस्से’ आधुनिक हिन्दी में स्पष्ट है और अनुष्ठानिक शारीरिक अर्थ को बनाए रखता है।
- source_word: וַיַּקְטֵר
  choice: उसने … जलाया
  rationale: याजकीय बलिदान के संदर्भ में קטר वेदी पर किसी चढ़ावे को जलाने, अर्थात धुआँ उठाने, की क्रिया है। मुख्य पाठ में ‘जलाया’ स्वाभाविक और संक्षिप्त है; अधिक शाब्दिक धुएँ वाला भाव पाद-टिप्पणी में दिया गया है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक प्रत्यय के बावजूद קטר के साथ यह हिन्दी में स्वाभाविक रूप से उस स्थान को सूचित करता है जहाँ चरबी जलाई गई—‘वेदी पर’।
