source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה זֶ֧ה הַ/דָּבָ֛ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה תַּעֲשׂ֑וּ וְ/יֵרָ֥א אֲלֵי/כֶ֖ם כְּב֥וֹד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/009/006.yaml
  text: And Moses said[a], “This is the thing that Yahweh has commanded you to do, that the glory of Yahweh may appear to you.”
translation:
  language: hi
  text: और मूसा ने कहा, “यह वह बात है जिसे यहोवा ने तुम्हें करने की आज्ञा दी है, ताकि यहोवा की महिमा तुम्हें दिखाई दे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और यहोवा की महिमा तुम्हें दिखाई देगी।”
    reason: अंतिम इब्रानी उपवाक्य को उद्देश्य/परिणाम के बजाय समन्वित भविष्य या प्रतिज्ञा के रूप में भी समझा जा सकता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: और ... ने कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘और ... ने कहा’ उसके सीधे कथात्मक प्रवाह को बनाए रखता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबल परंपरा में इस व्यक्तिगत नाम का मानक रूप।
- source_word: זֶה הַדָּבָר
  choice: यह वही बात है
  rationale: मूल का एकवचन और ठोस भाव बनाए रखते हुए यह हिन्दी में स्वाभाविक है; ‘वही’ सामने बताई गई आज्ञा की ओर संकेत को स्पष्ट करता है।
- source_word: צִוָּה
  choice: आज्ञा दी है
  rationale: यह क्रिया अधिकारपूर्ण आदेश को व्यक्त करती है; पूर्ण पक्ष को वर्तमान-संबद्ध हिन्दी रूप ‘दी है’ से प्रकट किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: תַּעֲשׂוּ
  choice: तुम्हें करने
  rationale: द्वितीय पुरुष बहुवचन को स्पष्ट रखते हुए ‘आज्ञा दी है’ के साथ स्वाभाविक हिन्दी रचना बनाई गई है।
- source_word: וְיֵרָא
  choice: ताकि ... दिखाई दे
  rationale: आज्ञा के बाद आया निफ़अल अपूर्ण रूप उद्देश्य अथवा परिणाम का भाव दे सकता है; यह चयन उस संबंध को दर्शाता है, जबकि वैकल्पिक समन्वित भविष्य-पाठ पादटिप्पणी में सुरक्षित है।
- source_word: אֲלֵיכֶם
  choice: तुम्हें
  rationale: प्रकट होने के संदर्भ में אֶל के प्राप्तकर्ता-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּבוֹד יְהוָה
  choice: यहोवा की महिमा
  rationale: समास-संबंध को स्पष्ट और परिचित बाइबलीय हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे प्रयुक्त है; उसे किसी उपाधि से प्रतिस्थापित न करके हिन्दी में प्रचलित नाम-रूप रखा गया है।
- issue: अंतिम वाक्यांश וְיֵרָא אֲלֵיכֶם כְּבוֹד יְהוָה का बल
  choice: 'उद्देश्य/परिणाम: ‘ताकि यहोवा की महिमा तुम्हें दिखाई दे’'
  alternative: 'समन्वित भविष्य/प्रतिज्ञा: ‘और यहोवा की महिमा तुम्हें दिखाई देगी’'
  rationale: इब्रानी रचना आज्ञापालन के बाद होने वाले परिणाम या उद्देश्य का संकेत दे सकती है, पर ‘और ... दिखाई देगी’ भी व्याकरणतः संभव है। मुख्य पाठ और पादटिप्पणी मिलकर इस तनाव को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘यह वही बात है’ मूल की ठोस एकवचन अभिव्यक्ति को बनाए रखता है, और ‘तुम्हें’ बहुवचन संबोधन है।
