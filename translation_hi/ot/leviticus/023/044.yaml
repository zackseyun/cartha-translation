  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה אֶת מֹעֲדֵ֖י יְהוָ֑ה אֶל בְּנֵ֖י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/044.yaml
  text: So Moses declared the appointed times of Yahweh to the sons of Israel[a].
translation:
  language: hi
  text: मूसा ने इस्राएलियों[a] को याहवे के नियत समयों की घोषणा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, शाब्दिक रूप से, ‘इस्राएल के पुत्रों’।
    reason: इब्रानी בְּנֵי יִשְׂרָאֵל का शाब्दिक रूप सुरक्षित रखते हुए मुख्य पाठ में स्वाभाविक सामुदायिक जातिनाम रखा गया है।
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: घोषणा की
  rationale: पिएल क्रिया का मूल अर्थ ‘कहा/बोला’ है, पर यहाँ पर्व-संबंधी विधान के समापन-सार में प्रत्यक्ष कर्म के साथ ‘घोषणा की’ उसके सार्वजनिक रूप से अवगत कराने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֹעֲדֵי
  choice: ठहराए हुए समयों
  rationale: מוֹעֵד नियत या निर्धारित समय को दर्शाता है। अध्याय 23 में इसका दायरा केवल भोज वाले पर्वों तक सीमित नहीं है; इसमें सब्त भी सम्मिलित है, इसलिए ‘पर्वों’ की अपेक्षा यह व्यापक पद चुना गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचा-नाम की प्रचलित लिप्यंतरण-परंपरा ‘यहोवा’ है; यहाँ उपाधि से प्रतिस्थापन करने के बजाय नाम को रखा गया है।
- source_word: אֶל
  choice: को
  rationale: यह संबंधबोधक पद उन लोगों को चिह्नित करता है जिन्हें मूसा ने घोषणा सुनाई; हिन्दी में ‘इस्राएलियों को’ स्वाभाविक है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: इब्रानी का शाब्दिक रूप ‘इस्राएल के पुत्र’ है, किंतु इस संदर्भ में यह पूरे इस्राएली समुदाय का सामान्य जातिनाम है। आधुनिक हिन्दी में ‘इस्राएलियों’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी के सामान्य बाइबलीय प्रयोग में पहचाना जाने वाला रूप ‘यहोवा’ रखा गया है, न कि उसे केवल ‘प्रभु’ जैसी उपाधि से बदला गया।
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक आशय
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यह वाक्यांश यहाँ वाचा-समुदाय को सामूहिक रूप से संबोधित करता है। ‘इस्राएलियों’ स्त्री-पुरुष पूरे समुदाय को स्वाभाविक रूप से समेटता है, जबकि शाब्दिक विकल्प आधुनिक हिन्दी में केवल पुरुषों का संकेत दे सकता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘ठहराए हुए समय’ अध्याय के पवित्र कैलेंडर का व्यापक अर्थ बनाए रखता है, और वाक्य-क्रम सहज हिन्दी के अनुसार है।
