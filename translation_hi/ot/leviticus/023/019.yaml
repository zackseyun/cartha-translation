  text: וַ/עֲשִׂיתֶ֛ם שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּ֑את וּ/שְׁנֵ֧י כְבָשִׂ֛ים בְּנֵ֥י שָׁנָ֖ה לְ/זֶ֥בַח שְׁלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/019.yaml
  text: And you shall offer one male goat for a sin offering[b][a], and two male lambs a year old for a sacrifice of peace offerings.
translation:
  language: hi
  text: और तुम पापबलि[a] के रूप में एक बकरा और मेलबलि[b] के रूप में एक वर्ष के दो नर मेमने चढ़ाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शुद्धिकरण-बलि’।
    reason: lexical_alternative
  - marker: b
    text: या ‘शांति-बलि’ अथवा ‘सहभागिता-बलि’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: तुम ... चढ़ाना
  rationale: क्रिया का मूल अर्थ ‘करना/बनाना’ है, पर पशुओं और बलियों के इस विधिक संदर्भ में ‘चढ़ाना’ स्वाभाविक और अर्थानुकूल है। बहुवचन संबोधन भी सुरक्षित रखा गया है।
- source_word: שְׂעִיר עִזִּים אֶחָד
  choice: एक बकरा
  rationale: यह पदबंध नर बकरी को दर्शाता है; आधुनिक हिन्दी में ‘बकरा’ लिंग और संख्या दोनों को स्पष्ट करता है।
- source_word: לְחַטָּאת
  choice: पापबलि के रूप में
  rationale: लैव्यव्यवस्था की बलि-संबंधी शब्दावली में חַטָּאת के लिए ‘पापबलि’ प्रचलित और संक्षिप्त है; इसके शुद्धिकरण-संबंधी अर्थ को पादटिप्पणी में रखा गया है।
- source_word: וּשְׁנֵי כְבָשִׂים
  choice: दो नर मेमने
  rationale: संख्या और पशुओं का प्रकार स्पष्ट रखा गया है; बलि-विधान में अपेक्षित नर पशु को हिन्दी में प्रत्यक्ष किया गया है।
- source_word: בְּנֵי שָׁנָה
  choice: एक वर्ष के
  rationale: यह इब्रानी मुहावरा एक वर्ष की आयु वाले पशुओं को दर्शाता है; ‘एक वर्ष के’ सहज और संक्षिप्त हिन्दी है।
- source_word: לְזֶבַח שְׁלָמִים
  choice: मेलबलि के बलिदान के लिए
  rationale: ‘मेलबलि’ שְׁלָמִים की स्थापित बलि-श्रेणी को व्यक्त करती है, जबकि ‘बलिदान’ זֶבַח के वध करके चढ़ाए जाने वाले बलि-पक्ष को बनाए रखता है।
theological_decisions:
- issue: חַטָּאת का बलि-विधान में अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: ‘पापबलि’ हिन्दी पाठकों के लिए परिचित पारिभाषिक शब्द है, लेकिन मूल शब्द के शुद्धिकरण-संबंधी बल पर विद्वानों का ध्यान भी उचित है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- issue: שְׁלָמִים का अनुवाद
  choice: मेलबलि
  alternative: शांति-बलि या सहभागिता-बलि
  rationale: ‘मेलबलि’ मूल शब्द से जुड़े शांति, संपूर्णता और संबंध के व्यापक भाव को किसी एक व्याख्या तक सीमित किए बिना परिचित हिन्दी बलि-श्रेणी के रूप में प्रस्तुत करती है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध विधिक शैली अपनाई गई है। ‘चढ़ाना’ आदेशात्मक विधान की हिन्दी शैली के अनुकूल है। बलि-संबंधी पारिभाषिक शब्दों को संक्षिप्त रखा गया है और जहाँ मूल अर्थ पर मतांतर संभव है वहाँ पादटिप्पणी दी गई है।
