id: LEV.23.40
reference: Leviticus 23:40
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֨ם לָ/כֶ֜ם בַּ/יּ֣וֹם הָ/רִאשׁ֗וֹן פְּרִ֨י עֵ֤ץ הָדָר֙ כַּפֹּ֣ת תְּמָרִ֔ים וַ/עֲנַ֥ף עֵץ עָבֹ֖ת וְ/עַרְבֵי נָ֑חַל וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/040.yaml
  text: And on the first day you shall take for yourselves the fruit of majestic trees[a], branches of palm trees, boughs of leafy trees, and willows of the brook, and you shall rejoice before Yahweh your God for seven days.
translation:
  language: hi
  text: पहले दिन तुम अपने लिए शोभायमान वृक्ष का फल[a], खजूर की डालियाँ, घने पत्तों वाले वृक्षों की शाखाएँ और नाले के बेद वृक्षों की डालियाँ लो; और सात दिन तक अपने परमेश्वर याहवे के सामने आनन्द मनाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, बाद की यहूदी परम्परा के अनुसार, “बीजपूर (एत्रोग) का फल।” इब्रानी में शाब्दिक अर्थ है, “शोभायमान/सुन्दर वृक्ष का फल।”
    reason: वैकल्पिक पारम्परिक पहचान तथा इब्रानी पद की व्यापकता स्पष्ट करना।
lexical_decisions:
- source_word: וּלְקַחְתֶּם לָכֶם
  choice: तुम अपने लिए ... लो
  rationale: विधिक प्रसंग में यह निर्देशात्मक भाव व्यक्त करता है; ‘अपने लिए’ לָכֶם को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: पहले दिन
  rationale: यह सीधा कालवाचक पद है; पद में न दिए गए ‘पर्व के’ शब्द नहीं जोड़े गए।
- source_word: פְּרִי עֵץ הָדָר
  choice: शोभायमान वृक्षों के फल
  rationale: הָדָר शोभा, सौन्दर्य या वैभव का बोध कराता है। सामान्य अनुवाद मूल की व्यापकता बनाए रखता है और बाद की ‘एत्रोग’ पहचान को मुख्य पाठ में नहीं लाता।
- source_word: כַּפֹּת תְּמָרִים
  choice: खजूर की डालियाँ
  rationale: यह खजूर के वृक्ष की पत्तेदार डालियों को दर्शाता है; आधुनिक हिन्दी में स्वाभाविक और मूल के निकट है।
- source_word: וַעֲנַף עֵץ עָבֹת
  choice: घने पत्तों वाले वृक्षों की शाखाएँ
  rationale: עָבֹת घनत्व का संकेत देता है, सम्भवतः घनी पत्तियों का; चयन इस अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְעַרְבֵי נָחַל
  choice: नाले के किनारे उगने वाली बेंत
  rationale: עֲרָבָה जलधारा के पास उगने वाले विलो अथवा उससे मिलते-जुलते वृक्ष को दर्शाता है; ‘बेंत’ सामान्य हिन्दी में इस वनस्पति के लिए बोधगम्य शब्द है, जबकि נָחַל के स्थानगत सम्बन्ध को भी व्यक्त किया गया है।
- source_word: וּשְׂמַחְתֶּם
  choice: आनन्द मनाओ
  rationale: यह क्रिया आनन्दित होने या उल्लास मनाने का निर्देश देती है; हिन्दी में ‘आनन्द मनाओ’ स्वाभाविक निर्देशात्मक रूप है।
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर यहोवा के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने/उपस्थिति में’ है और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: अवधि को हिन्दी में स्वाभाविक रूप से व्यक्त करने के लिए ‘तक’ लगाया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि में बदलने के बजाय उसकी विशिष्टता बनाए रखता है।
- issue: פְּרִי עֵץ הָדָר की पहचान
  choice: सामान्य अर्थ ‘शोभायमान वृक्षों के फल’
  alternative: बिजौरे/एत्रोग का फल
  rationale: बाद की यहूदी परम्परा इसे एत्रोग से पहचानती है, पर इब्रानी पद स्वयं अधिक व्यापक है। मुख्य पाठ में व्यापक अर्थ और पादटिप्पणी में पारम्परिक पहचान रखने से वास्तविक अनिश्चितता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज निर्देशात्मक शैली अपनाई गई है। सूची की लय और विधिक बल बनाए रखते हुए कठिन वनस्पति-संबंधी शब्दों को सामान्य पाठक के लिए बोधगम्य बनाया गया है।
