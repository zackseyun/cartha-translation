base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/043.yaml
  text: so that your generations may know that I made the sons of Israel dwell in booths when I brought them out of the land of Egypt[b][a]. I am Yahweh your God.
translation:
  language: hi
  text: जिससे तुम्हारी आनेवाली पीढ़ियाँ जानें कि जब मैं इस्राएल के पुत्रों[b] को मिस्र देश से निकाल लाया, तब मैंने उन्हें झोंपड़ियों[a] में बसाया। मैं याहवे, तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अस्थायी आश्रयों में।’ इब्रानी शब्द सुक्कोत अस्थायी झोंपड़ियों या आश्रयों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘इस्राएलियों’ अथवा ‘इस्राएल के लोगों।’ शाब्दिक रूप से, ‘इस्राएल के पुत्र।’
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן יֵדְעוּ דֹרֹתֵיכֶם
  choice: जिससे तुम्हारी आनेवाली पीढ़ियाँ जानें
  rationale: לְמַעַן उद्देश्य बताता है और उसके बाद का अपूर्ण क्रियारूप अभिप्रेत परिणाम व्यक्त करता है। ‘आनेवाली पीढ़ियाँ’ आधुनिक हिन्दी में स्वाभाविक है और बहु-पीढ़ीय भाव बनाए रखता है।
- source_word: בַסֻּכּוֹת
  choice: झोंपड़ियों में
  rationale: סֻכּוֹת अस्थायी छप्परदार निवासों या आश्रयों को दर्शाता है। ‘झोंपड़ियाँ’ सामान्य पाठक के लिए स्पष्ट है और पर्व के नाम से जुड़ी मूल छवि को बनाए रखता है।
- source_word: הוֹשַׁבְתִּי
  choice: मैंने ... बसाया था
  rationale: यह ישׁב का हिफ़ील रूप है और कारणवाचक अर्थ देता है। ‘बसाया’ हिन्दी में इस कारणवाचक भाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह मूल इब्रानी पद का निकट अनुवाद है और वाचा-समुदाय के सामूहिक नाम को सुरक्षित रखता है; अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
- source_word: בְּהוֹצִיאִי אוֹתָם
  choice: जब मैं ... निकाल लाया
  rationale: ב prefixed infinitive construct यहाँ समयगत परिस्थिति बताता है। ‘जब’ इसे स्वाभाविक हिन्दी में स्पष्ट करता है, और ‘निकाल लाया’ निर्गमन की गति और पूर्ण क्रिया को व्यक्त करता है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: ‘देश’ मूल के אֶרֶץ को बनाए रखता है और हिन्दी में ‘मिस्र देश से’ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चार अक्षरों वाले व्यक्तिगत दिव्य नाम YHWH का हिन्दी लिप्यंतरण है, न कि उसके स्थान पर प्रयुक्त कोई उपाधि।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: यह वाचा-सूत्र का सीधा और प्रतिष्ठित हिन्दी रूप है। सन्दर्भ से ‘तुम्हारा’ का सामूहिक बहुवचन आशय स्पष्ट है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। ‘याहवे’ उस नाम को स्पष्ट रूप से प्रस्तुत करता है और उसे किसी उपाधि से नहीं बदलता।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों; इस्राएल के लोगों
  rationale: चुना हुआ रूप मूल की पुरुषवाचक बहुवचन अभिव्यक्ति और वंशगत-वाचागत भाषा को बनाए रखता है, जबकि पादटिप्पणी अधिक स्वाभाविक सामूहिक विकल्प बताती है।
- issue: सुक्कोत में बसाने का कथन
  choice: झोंपड़ियों में बसाया था
  alternative: आश्रयों में रखा था
  rationale: मूल पाठ अस्थायी निवासों और परमेश्वर की कारणवाचक क्रिया—उन्हें वहाँ बसाने—दोनों को व्यक्त करता है। अनुवाद इस कथन को किसी विशेष ऐतिहासिक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में उद्देश्य, निर्गमन की समयगत परिस्थिति और कारणवाचक ‘बसाया’ स्पष्ट हैं। ‘याहवे’ दिव्य नाम का देवनागरी लिप्यंतरण है।
