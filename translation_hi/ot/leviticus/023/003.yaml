base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/003.yaml
  text: For six days work may be done[a], but on the seventh day is a Sabbath of complete rest, a holy convocation. You shall do no work[b]; it is a Sabbath to Yahweh in all your dwellings.
translation:
  language: hi
  text: छह दिन काम किया जा सकता है, पर सातवाँ दिन पूर्ण विश्राम का सब्त, पवित्र सभा का दिन है। तुम कोई भी काम न करना। यह तुम्हारे सभी निवास-स्थानों में याहवे के लिए सब्त है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘तुम्हारी सभी बस्तियों में’ भी हो सकता है। इब्रानी शब्द निवास-स्थानों या बसी हुई बस्तियों, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  choice: काम किया जा सकता है
  rationale: निफ़अल रूप की कर्मवाच्य संरचना और प्रसंग के अनुमतिपरक भाव, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: पूर्ण विश्राम का सब्त
  rationale: दोहराव-जैसी गहन अभिव्यक्ति सब्त के पूर्ण विराम और विश्राम पर बल देती है; हिन्दी में यह रूप उस तीव्रता को स्पष्ट रखता है।
- source_word: מִקְרָא קֹדֶשׁ
  choice: पवित्र सभा
  rationale: यह निर्धारित पवित्र अवसर पर बुलाई गई सामुदायिक सभा को दर्शाता है; ‘पवित्र सभा’ आधुनिक हिन्दी में सहज और उपासना-संदर्भ के अनुकूल है।
- source_word: כָּל מְלָאכָה לֹא תַעֲשׂוּ
  choice: तुम कोई काम न करना
  rationale: द्वितीय पुरुष बहुवचन के सीधे निषेध को स्पष्ट, गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שַׁבָּת הִוא לַיהוָה
  choice: यह ... याहवे के लिए सब्त है
  rationale: לַ का दिशात्मक/समर्पण-संबंधी भाव बनाए रखता है और दिन को याहवे के लिए नियत बताता है, बिना इसे केवल स्वामित्व में बदलने के।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम YHWH का हिन्दी लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: तुम्हारे रहने के सभी स्थानों में
  rationale: מוֹשָׁב के निवास-स्थान अथवा बस्ती-संबंधी अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है और आज्ञा की व्यापक भौगोलिक लागूता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में निजी वाचा-नाम है; ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है।
- issue: שַׁבַּת שַׁבָּתוֹן की तीव्रता
  choice: पूर्ण विश्राम का सब्त
  alternative: गंभीर विश्राम का सब्त
  rationale: यह पदबंध सामान्य विश्राम से अधिक पूर्ण काम-बंदी पर बल देता है; चुना हुआ रूप इस बल को रखता है और बाद की धर्मशास्त्रीय व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज लेकिन गरिमापूर्ण विधिक-उपासना शैली रखी गई है। ‘सब्त’ को पारिभाषिक बाइबलीय शब्द के रूप में बनाए रखा गया है। मूल के बहुवचन संबोधन को हिन्दी के सामूहिक ‘तुम’ से व्यक्त किया गया है।
