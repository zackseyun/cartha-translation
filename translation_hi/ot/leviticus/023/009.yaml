- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस व्यक्तिगत नाम का मानक हिन्दी रूप ‘मूसा’ है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह सूत्र अगले पद में आने वाले कथन का परिचय देता है। हिन्दी में וַיְדַבֵּר … לֵאמֹר को अलग से ‘बोलते हुए कहा’ कहने के बजाय ‘कहा’ में समेटना स्वाभाविक और अर्थपूर्ण है।
