reference: Leviticus 23:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מִנְחָת/וֹ֩ שְׁנֵ֨י עֶשְׂרֹנִ֜ים סֹ֣לֶת בְּלוּלָ֥ה בַ/שֶּׁ֛מֶן אִשֶּׁ֥ה לַ/יהוָ֖ה רֵ֣יחַ נִיחֹ֑חַ וְ/נִסְכֹּ֥/ה יַ֖יִן רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/013.yaml
  text: Its grain offering shall be two-tenths of an ephah of fine flour mixed with oil[a], a food offering to Yahweh, a pleasing aroma; and its drink offering shall be wine, a fourth of a hin.
translation:
  language: hi
  text: और उसके साथ की अन्नबलि एपा के दो-दशमांश बारीक आटा हो, जो तेल में मिला हुआ हो—याहवे के लिए अग्नि-बलि, सुखद सुगंध। और उसकी पेय-बलि एक-चौथाई हीन दाखमधु हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִנְחָתוֹ
  choice: और उसका अन्नबलि
  rationale: बलिदान-संबंधी प्रसंग में מִנְחָה अन्नबलि को सूचित करता है; पुल्लिंग एकवचन प्रत्यय पिछले पद में बताए मेम्ने की ओर संकेत करता है।
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: दो-दशमांश एपा
  rationale: इब्रानी में शाब्दिक अर्थ ‘दो दशमांश’ है; याजकीय माप-पद्धति में निहित इकाई एपा है, इसलिए उसे स्पष्ट किया गया है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह चढ़ावे में प्रयुक्त बारीक, परिष्कृत आटे का पारिभाषिक शब्द है; आधुनिक हिंदी में ‘मैदा’ स्वाभाविक और स्पष्ट है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: तेल में मिला हुआ
  rationale: निष्क्रिय कृदंत आटे के तेल के साथ मिलाए जाने को व्यक्त करता है।
- source_word: אִשֶּׁה לַיהוָה
  choice: यहोवा के लिए आग में चढ़ाया जाने वाला बलिदान
  rationale: אִשֶּׁה आग द्वारा वेदी पर चढ़ाए जाने वाले अर्पण का तकनीकी पद है; यह अनुवाद उसकी रीति-संबंधी धारणा को स्पष्ट रखता है।
- source_word: רֵיחַ נִיחֹחַ
  choice: जिसकी सुगंध उसे प्रसन्न करती है
  rationale: स्थिर बलिदानी पदबंध चढ़ावे की ईश्वरीय स्वीकार्यता को सुगंध के रूपक द्वारा व्यक्त करता है; हिंदी में संबंध को स्वाभाविक ढंग से रखा गया है।
- source_word: וְנִסְכֹּה
  choice: और उसका अर्घ
  rationale: נֶסֶךְ साथ में उंडेले जाने वाले पेय-चढ़ावे को दर्शाता है; ‘अर्घ’ संक्षिप्त, गरिमापूर्ण हिंदी धार्मिक पद है। प्रत्यय फिर उसी मेम्ने की ओर संकेत करता है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: यह יַיִן का स्पष्ट हिंदी समतुल्य है और चढ़ावे के पदार्थ को बताता है।
- source_word: רְבִיעִת הַהִין
  choice: एक-चौथाई हीन
  rationale: प्राचीन द्रव-माप ‘हीन’ को सुरक्षित रखते हुए उसका अंश स्वाभाविक हिंदी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का निज नाम יהוה है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिंदी में प्रचलित नाम-रूप ‘यहोवा’ द्वारा प्रस्तुत किया गया है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: רֵיחַ נִיחֹחַ में प्रसन्नता का आशय
  choice: जिसकी सुगंध उसे प्रसन्न करती है
  alternative: सुखदायक सुगंध
  rationale: वाक्यांश की बलिदानी रूपक-भाषा और परमेश्वर द्वारा चढ़ावे की स्वीकार्यता दोनों सुरक्षित रखी गई हैं, बिना यह स्पष्ट किए कि प्रभाव भावात्मक, न्यायिक या केवल अनुष्ठानिक है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सामान्य पाठकों के लिए बोधगम्य धार्मिक-वैधानिक रजिस्टर अपनाया गया है। ‘एपा’ और ‘हीन’ जैसे प्राचीन माप मूल सांस्कृतिक रूप में रखे गए हैं।
