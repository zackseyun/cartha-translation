  text: כִּ֤י כָל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁ֣ר לֹֽא תְעֻנֶּ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/נִכְרְתָ֖ה מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/029.yaml
  text: For every person who does not humble himself on this very day shall be cut off from his people[a].
translation:
  language: hi
  text: क्योंकि जो कोई इसी दिन अपने को विनम्र नहीं करता[a], वह अपने लोगों में से काट दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने को कष्ट नहीं देता।” इब्रानी मुहावरा आत्म-विनय या आत्म-दमन को दर्शाता है, जिसे परंपरागत रूप से उपवास से जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आदेश का कारण या आधार बताता है और विधिक प्रवाह में स्वाभाविक है।
- source_word: כָל הַנֶּפֶשׁ
  choice: जो कोई
  rationale: यहाँ נֶפֶשׁ का अर्थ संपूर्ण व्यक्ति है, तकनीकी अर्थ में अमूर्त ‘प्राण’ या ‘आत्मा’ नहीं; हिंदी विधिक शैली में ‘जो कोई’ व्यापक और स्वाभाविक है।
- source_word: אֲשֶׁר לֹא תְעֻנֶּה
  choice: अपने आप को दीन नहीं करता
  rationale: प्रायश्चित-दिवस के संदर्भ में यह आत्म-दमन/आत्म-विनय का मुहावरा है। ‘अपने आप को दीन करना’ पश्चात्तापपूर्ण विनम्रता व्यक्त करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: इस दिन
  rationale: עֶצֶם समय-वाचक पद को बल देता है। हिंदी में ‘इसी दिन’ संभव है, पर संदर्भ में ‘इस दिन’ सहज है; दिन की निश्चितता पद के संकेतवाचक रूप से बनी रहती है।
- source_word: וְנִכְרְתָה
  choice: काट दिया जाएगा
  rationale: כרת के निफ़अल रूप की वाचा-संबंधी विधिक गंभीरता सुरक्षित रहती है और दंड की सटीक रीति—मृत्यु, निष्कासन या ईश्वरीय न्याय—निर्धारित नहीं की जाती।
- source_word: מֵעַמֶּיהָ
  choice: अपने लोगों में से
  rationale: स्त्रीलिंग प्रत्यय व्याकरणिक रूप से נֶפֶשׁ के अनुरूप है, पर आशय सामान्य व्यक्ति से है। ‘अपने लोगों में से’ हिंदी में लिंग-निरपेक्ष और स्वाभाविक है।
theological_decisions:
- issue: प्रायश्चित-दिवस पर अपने को दीन/पीड़ित करने की आज्ञा
  choice: मुख्य पाठ में ‘अपने आप को दीन नहीं करता’
  alternative: ‘अपने आप को पीड़ित नहीं करता’ या ‘आत्म-संयम नहीं करता’
  rationale: इब्रानी मुहावरा पश्चात्ताप, आत्म-विनय और उपवास से जुड़े आत्म-दमन की ओर संकेत करता है। मुख्य पाठ उसका धार्मिक और आंतरिक भाव व्यक्त करता है; अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: ‘काट दिए जाने’ के दंड का स्वरूप
  choice: ‘अपने लोगों में से काट दिया जाएगा’ को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: ‘निकाल दिया जाएगा’ या ‘नष्ट कर दिया जाएगा’
  rationale: इब्रानी पाठ यहाँ दंड की क्रियाविधि स्पष्ट नहीं करता। अनुवाद मृत्यु, समुदाय से निष्कासन या प्रत्यक्ष ईश्वरीय न्याय में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘दीन करना’ धार्मिक संदर्भ में परिचित है, और ‘काट दिया जाएगा’ मूल विधिक सूत्र की गंभीरता तथा अस्पष्टता दोनों बनाए रखता है।
