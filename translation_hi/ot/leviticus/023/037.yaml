- from: ये यहोवा के नियत पर्व हैं, जिन्हें तुम पवित्र सभाओं के रूप में घोषित करना, ताकि यहोवा को अग्नि-भेंट चढ़ाई जाए—होम-बलि और अन्न-भेंट, बलिदान और अर्घ—हर दिन के लिए उसी दिन का निर्धारित चढ़ावा।
