id: LEV.23.37
reference: Leviticus 23:37
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ לְ/הַקְרִ֨יב אִשֶּׁ֜ה לַ/יהוָ֗ה עֹלָ֧ה וּ/מִנְחָ֛ה זֶ֥בַח וּ/נְסָכִ֖ים דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/037.yaml
  text: 'These are the appointed times of the LORD, which you shall proclaim as holy convocations, to present a food offering to the LORD: a burnt offering and a grain offering, a sacrifice and drink offerings, each day''s matter on its day.'
translation:
  language: hi
  text: 'ये यहोवा के नियत पर्व हैं, जिन्हें तुम्हें पवित्र सभाओं के रूप में घोषित करना है, ताकि तुम यहोवा के लिए अग्नि-भेंट चढ़ाओ: होम-बलि, अन्न-भेंट, बलिदान और पेय-भेंटें—हर दिन के लिए जो निर्धारित है, वह उसी दिन।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹעֲדֵי
  choice: नियत पर्व
  rationale: यहाँ מוֹעֵד उन निर्धारित धार्मिक अवसरों को सूचित करता है जिनकी सूची अध्याय में दी गई है; ‘नियत पर्व’ समय और उत्सवी अवसर दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के विशिष्ट ईश्वरीय नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: पवित्र सभाओं
  rationale: इस पदबंध का आशय पवित्र उद्देश्य से बुलाई या घोषित की गई सामुदायिक सभाएँ हैं।
- source_word: אִשֶּׁה
  choice: अग्नि-भेंट
  rationale: यह बलि-विधान का तकनीकी शब्द है और ऐसी भेंट को सूचित करता है जो वेदी की आग पर चढ़ाई जाती है; ‘भोजन-भेंट’ सम्भव व्युत्पत्तिगत अर्थ को प्रमुख बनाकर वास्तविक अनुष्ठानिक स्वरूप को धुँधला कर सकता है।
- source_word: עֹלָה
  choice: होम-बलि
  rationale: पूरी तरह वेदी पर जलाई जाने वाली बलि के लिए हिन्दी बाइबलीय परम्परा में परिचित और संक्षिप्त तकनीकी पद।
- source_word: מִנְחָה
  choice: अन्न-भेंट
  rationale: लैव्यव्यवस्था के बलि-संदर्भ में यह सामान्य ‘भेंट’ नहीं, अनाज से तैयार की जाने वाली भेंट है।
- source_word: זֶבַח
  choice: बलिदान
  rationale: पशु-वध से सम्बद्ध बलि का व्यापक अर्थ बनाए रखता है; मूल इस पद में इसका कोई अधिक विशिष्ट प्रकार नहीं बताता।
- source_word: נְסָכִים
  choice: अर्घ
  rationale: वेदी पर उँडेली जाने वाली पेय-भेंट के लिए संक्षिप्त, प्रतिष्ठित हिन्दी धार्मिक पद।
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: हर दिन के लिए उसी दिन का निर्धारित चढ़ावा
  rationale: शाब्दिक ‘दिन की बात उसके दिन में’ हिन्दी में अस्पष्ट होगी; प्रसंगानुसार प्रत्येक दिन के नियत अर्पण का अर्थ व्यक्त किया गया है।
theological_decisions:
- issue: אִשֶּׁה का अर्थ
  choice: अग्नि-भेंट
  alternative: भोजन-भेंट
  rationale: शब्द की व्युत्पत्ति और अर्थ पर चर्चा है, पर लैव्यव्यवस्था में इसका प्रत्यक्ष अनुष्ठानिक संदर्भ वेदी की आग पर चढ़ाई जाने वाली भेंट है। अनिश्चित व्युत्पत्ति के आधार पर ‘भोजन’ जोड़ना आवश्यक नहीं।
- issue: ईश्वरीय नाम יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: विशिष्ट नाम और सामान्य उपाधि के बीच मूल पाठ का भेद बनाए रखा गया है; इससे कोई सांप्रदायिक व्याख्या नहीं जोड़ी जाती।
- issue: अन्तिम वाक्यांश का सम्बन्ध
  choice: प्रत्येक दिन के निर्धारित चढ़ावे से
  alternative: सामान्यतः प्रत्येक दिन के कर्तव्य से
  rationale: निकटवर्ती बलि-सूची और अध्याय के विधिक प्रसंग से यह अर्पणों की दैनिक नियत मात्रा/प्रकार की ओर संकेत करता है, फिर भी अनावश्यक विशिष्ट विवरण नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। बलि-विधान के आवश्यक तकनीकी पद—होम-बलि, अन्न-भेंट और अर्घ—बनाए गए हैं, जबकि वाक्य-विन्यास साधारण हिन्दी पाठक के लिए सहज किया गया है।
