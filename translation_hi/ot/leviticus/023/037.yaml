review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the appointed times, holy convocations, and the sequence of offerings. However, the infinitive לְהַקְרִיב has the addressed plural as its implied agent; the passive wording “चढ़ाई जाए” unnecessarily suppresses this. The closing phrase דְּבַר־יוֹם בְּיוֹמוֹ is broader than a specifically ‘determined offering’; it denotes what is prescribed/required for each day on that day.
  naturalness: “जिन्हें तुम ... घोषित करना” is not a complete or natural finite Hindi construction in this public-reading register. “जिन्हें तुम्हें ... घोषित करना है” is clear and idiomatic. “पेय-भेंटें” is more immediately comprehensible and exact than the unqualified, potentially opaque “अर्घ.”
  terminology: “नियत पर्व,” “पवित्र सभाएँ,” “अग्नि-भेंट,” “होम-बलि,” and “अन्न-भेंट” are suitable technical renderings. “बलिदान” appropriately preserves the generality of זֶבַח. The divine name “यहोवा” consistently renders יהוה. No footnotes are required for this verse.
  issues:
  - severity: medium
    issue: 'The offering clause is cast in the passive: “ताकि ... चढ़ाई जाए.”'
    rationale: The Hebrew infinitive ‘to present/offer’ follows an addressed plural verb and naturally retains the people as the implied agents. The passive is not required and weakens the syntax.
  - severity: medium
    issue: The final phrase is restricted to “निर्धारित चढ़ावा.”
    rationale: דְּבַר יוֹם בְּיוֹמוֹ literally concerns each day’s prescribed matter/requirement on its own day. In context it includes offerings, but the Hebrew itself does not limit the expression to a single ‘offering.’
  - severity: low
    issue: “जिन्हें तुम ... घोषित करना” is grammatically incomplete/awkward.
    rationale: A finite obligation construction is needed in modern standard Hindi.
  revised_text: 'ये यहोवा के नियत पर्व हैं, जिन्हें तुम्हें पवित्र सभाओं के रूप में घोषित करना है, ताकि तुम यहोवा के लिए अग्नि-भेंट चढ़ाओ: होम-बलि, अन्न-भेंट, बलिदान और पेय-भेंटें—हर दिन के लिए जो निर्धारित है, वह उसी दिन।'
