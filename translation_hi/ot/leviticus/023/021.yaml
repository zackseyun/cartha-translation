- from: उसी दिन तुम यह घोषणा करना कि तुम्हारे लिए एक पवित्र सभा[a] हो। मेहनत का कोई काम[b] न करना। यह तुम्हारी पीढ़ी-पीढ़ी के लिए, तुम्हारे सभी निवास-स्थानों में, सदा की विधि[c] होगी।
  to: उसी दिन तुम एक पवित्र सभा[a] की घोषणा करना; वह तुम्हारे लिए पवित्र सभा होगी। मेहनत का कोई काम[b] न करना। यह तुम्हारे सभी निवास-स्थानों में तुम्हारी पीढ़ियों के लिए सदा की विधि[c] होगी।
