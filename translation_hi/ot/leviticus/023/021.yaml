  source_fidelity: 'The draft accurately conveys the exact-day emphasis, the prohibition of ordinary labor, and the enduring, generational scope of the statute. However, its opening construction (“तुम यह घोषणा करना कि तुम्हारे लिए... हो”) does not clearly represent the Hebrew sequence: proclaim a holy convocation; it shall be for you. The revised wording retains both clauses distinctly.'
