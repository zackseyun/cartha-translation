id: LEV.23.21
reference: Leviticus 23:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/קְרָאתֶ֞ם בְּ/עֶ֣צֶם הַ/יּ֣וֹם הַ/זֶּ֗ה מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֥ת עוֹלָ֛ם בְּ/כָל מוֹשְׁבֹ֥תֵי/כֶ֖ם לְ/דֹרֹֽתֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/021.yaml
  text: And on that very day you shall proclaim a holy convocation[a]; you shall do no laborious work[c][b]. It is a permanent statute throughout your dwellings for your generations.
translation:
  language: hi
  text: उसी दिन तुम एक पवित्र सभा[a] की घोषणा करना; वह तुम्हारे लिए पवित्र सभा होगी। मेहनत का कोई काम[b] न करना। यह तुम्हारे सभी निवास-स्थानों में तुम्हारी पीढ़ियों के लिए सदा की विधि[c] होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र जनसभा’ अथवा ‘धार्मिक सभा’।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में, ‘श्रम/सेवा का कोई काम’; अर्थात्, सामान्य मेहनत का काम।
    reason: lexical_alternative
  - marker: c
    text: या ‘स्थायी विधि’ अथवा ‘सदा-सर्वदा की विधि’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם
  choice: तुम यह घोषणा करना
  rationale: קרא का यहाँ अर्थ किसी पवित्र सभा को औपचारिक रूप से घोषित करना या बुलाना है; ‘घोषणा करना’ इसके सार्वजनिक और आधिकारिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: उसी दिन
  rationale: यह पदबंध ठीक उसी दिन पर बल देता है। ‘उसी दिन’ आधुनिक हिन्दी में इस बल को संक्षिप्त और सहज रूप से रखता है।
- source_word: מִקְרָא קֹדֶשׁ
  choice: पवित्र सभा
  rationale: यह लैव्यव्यवस्था में विधिवत बुलाई गई धार्मिक सभा के लिए प्रयुक्त स्थिर पदबंध है। ‘पवित्र सभा’ तकनीकी भाव को स्पष्ट और सामान्य पाठक के लिए बोधगम्य रखता है।
- source_word: יִהְיֶה לָכֶם
  choice: तुम्हारे लिए ... हो
  rationale: हिब्रू की विधिक अपेक्षा और ‘तुम्हारे लिए’ का संबंध दोनों सुरक्षित रखे गए हैं।
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: मेहनत का कोई काम
  rationale: यह पदबंध सामान्य श्रम या सेवा-संबंधी काम को निषिद्ध करता है, अनिवार्यतः हर प्रकार की गतिविधि को नहीं। ‘मेहनत का कोई काम’ इस सीमा को हिन्दी में बनाए रखता है।
- source_word: לֹא תַעֲשׂוּ
  choice: न करना
  rationale: विधिक निषेध को सीधी, प्रतिष्ठित और स्वाभाविक हिन्दी आज्ञा के रूप में व्यक्त किया गया है।
- source_word: חֻקַּת עוֹלָם
  choice: सदा की विधि
  rationale: कानूनी सूत्र में עוֹלָם निरंतर और स्थायी वैधता को दर्शाता है। ‘सदा की विधि’ उसके कालगत बल को बनाए रखता है, जबकि पादटिप्पणी वैकल्पिक अभिव्यक्ति देती है।
- source_word: בְּכָל מוֹשְׁבֹתֵיכֶם
  choice: तुम्हारे सभी निवास-स्थानों में
  rationale: यह विधान इस्राएलियों के हर बसने के स्थान पर लागू होने की बात कहता है; यह अनुवाद वितरणात्मक अर्थ को स्पष्ट रखता है।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-पीढ़ी के लिए
  rationale: यह कानूनी सूत्र आने वाली पीढ़ियों में निरंतर लागू होने का भाव देता है। दोहरावयुक्त हिन्दी अभिव्यक्ति स्वाभाविक रूप से उत्तराधिकार की निरंतरता बताती है।
theological_decisions:
- issue: पर्व के दिन काम के निषेध का दायरा
  choice: כָּל מְלֶאכֶת עֲבֹדָה का अनुवाद ‘मेहनत का कोई काम’ किया गया है।
  alternative: ‘कोई काम’, ‘रोज़मर्रा का कोई काम’ या ‘सेवा का कोई काम’।
  rationale: हिब्रू पदबंध सामान्य श्रम या सेवा के काम की ओर संकेत करता है और हर कल्पनीय गतिविधि पर पूर्ण निषेध आवश्यक रूप से नहीं लगाता। इससे पाठ को उससे अधिक कठोर सब्त-संबंधी अर्थ नहीं दिया जाता जितना उसके शब्द व्यक्त करते हैं।
- issue: חֻקַּת עוֹלָם की कालगत शक्ति
  choice: ‘सदा की विधि’
  alternative: ‘स्थायी विधि’ या ‘सदा-सर्वदा की विधि’।
  rationale: अनुवाद कानूनी सूत्र की स्थायी, पीढ़ीगत शक्ति को बनाए रखता है, पर इसे दार्शनिक अर्थ में अनंतता की अलग व्याख्या से नहीं बाँधता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, विधिक और गरिमापूर्ण रखी गई है। ‘पवित्र सभा’, ‘विधि’ और ‘पीढ़ी-पीढ़ी’ जैसे पद धार्मिक-कानूनी संदर्भ को स्पष्ट रखते हैं, जबकि अत्यधिक संस्कृतनिष्ठ या संप्रदाय-विशिष्ट शब्दावली से बचा गया है।
