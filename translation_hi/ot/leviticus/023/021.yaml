  terminology: “पवित्र सभा,” “मेहनत का कोई काम,” and “सदा की विधि” are suitable non-sectarian renderings. The footnote alternative “पवित्र सम्मेलन” is less appropriate, since सम्मेलन commonly suggests a conference rather than a summoned sacred assembly.
  issues:
  - severity: medium
    issue: The opening clause conflates proclamation and the following predication.
    rationale: וּקְרָאתֶם ... מִקְרָא־קֹדֶשׁ יִהְיֶה לָכֶם first commands the proclamation of a holy convocation and then states that it shall be one for the addressees. “घोषणा करना कि ... हो” weakens this syntactic and semantic distinction.
  - severity: low
    issue: Footnote a uses “पवित्र सम्मेलन” as an alternative.
    rationale: In contemporary Hindi, सम्मेलन ordinarily denotes a conference, which is not the most fitting alternative for the cultic assembly denoted by מִקְרָא קֹדֶשׁ.
  revised_text: उसी दिन तुम एक पवित्र सभा[a] की घोषणा करना; वह तुम्हारे लिए पवित्र सभा होगी। मेहनत का कोई काम[b] न करना। यह तुम्हारे सभी निवास-स्थानों में तुम्हारी पीढ़ियों के लिए सदा की विधि[c] होगी।
