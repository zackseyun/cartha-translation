lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर ... कहा
  rationale: वाव-युक्त क्रिया कथा के अगले चरण को प्रस्तुत करती है। हिन्दी में ‘फिर ... कहा’ इस सूत्र को स्वाभाविक रूप से व्यक्त करता है; अलग से ‘बोला ... यह कहते हुए’ कहना अनावश्यक रूप से भारी होता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: אֶל
  choice: से
  rationale: דבר के साथ संबोधित व्यक्ति को हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया जाता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: नाम का मानक और व्यापक रूप से पहचाना जाने वाला हिन्दी रूप।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह परंपरागत भाषण-परिचय सूत्र है, जो अगले पद में आने वाले कथन को आरम्भ करता है। हिन्दी में मुख्य क्रिया के साथ ‘कहा’ इस पूरे सूत्र का स्वाभाविक समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में निजी नाम YHWH है। ‘यहोवा’ आधुनिक हिन्दी बाइबल-पाठकों के लिए परिचित नामरूप है और इसे केवल ‘प्रभु’ उपाधि से बदलता नहीं; ‘याहवे’ मूल उच्चारण का एक सम्भावित विद्वत्तापूर्ण पुनर्निर्माण है।
