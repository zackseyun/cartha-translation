reference: Leviticus 23:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/025.yaml
  text: You shall do no laborious work[a], and you shall present a food offering to Yahweh.
translation:
  language: hi
  text: तुम कोई मेहनत का काम न करना, और यहोवा को अग्नि-भेंट[a] चढ़ाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भोजन-भेंट”; अथवा, “आग में चढ़ाई गई भेंट।”
    reason: אִשֶּׁה के लिए प्रचलित वैकल्पिक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: כָּל ... לֹא תַעֲשׂוּ
  choice: कोई ... न करना
  rationale: हिब्रू निषेध की समग्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और बहुवचन समुदाय को संबोधित निर्देश का भाव बनाए रखता है।
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: मेहनत का काम
  rationale: यह पदबंध सामान्य श्रम अथवा सेवा-संबंधी काम को दर्शाता है, हर प्रकार की गतिविधि को नहीं। यह अभिव्यक्ति सहज और व्यापक है; ‘दासोचित काम’ पुराना तथा भ्रामक हो सकता है।
- source_word: וְהִקְרַבְתֶּם
  choice: और ... चढ़ाना
  rationale: हिफ़ील रूप बलिदानी संदर्भ में किसी वस्तु को भेंट के रूप में समीप लाने अथवा प्रस्तुत करने का अर्थ देता है। हिन्दी में ‘भेंट चढ़ाना’ इसका स्वाभाविक धार्मिक प्रयोग है।
- source_word: אִשֶּׁה
  choice: अग्नि-भेंट
  rationale: यह याजकीय बलिदानी शब्द अग्नि पर अर्पित भेंट की श्रेणी बताता है। ‘अग्नि-भेंट’ संक्षिप्त और पारदर्शी है; ‘भोजन-भेंट’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि से प्रतिस्थापित किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में वाचा का नाम स्पष्ट रूप से है। हिन्दी पाठकों के लिए ‘यहोवा’ उसका स्थापित नाम-रूप है और ‘प्रभु’ की तरह नाम को उपाधि में नहीं बदलता।
- issue: बलिदानी पद אִשֶּׁה का अर्थ
  choice: अग्नि-भेंट
  alternative: भोजन-भेंट; आग में चढ़ाई गई भेंट
  rationale: इस पद की सटीक व्यंजना पर शब्दार्थगत अनिश्चितता है। मुख्य पाठ में अग्नि द्वारा अर्पण का प्रत्यक्ष भाव रखा गया है और वैकल्पिक याजकीय श्रेणी ‘भोजन-भेंट’ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण है। ‘तुम ... न करना’ व्यवस्था-संबंधी निर्देश का बल रखता है और मूल के बहुवचन संबोधन को हिन्दी के स्वाभाविक सामुदायिक ‘तुम’ से व्यक्त करता है।
