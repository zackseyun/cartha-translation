  text: שִׁבְעַ֣ת יָמִ֔ים תַּקְרִ֥יבוּ אִשֶּׁ֖ה לַ/יהוָ֑ה בַּ/יּ֣וֹם הַ/שְּׁמִינִ֡י מִקְרָא קֹדֶשׁ֩ יִהְיֶ֨ה לָ/כֶ֜ם וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֲצֶ֣רֶת הִ֔וא כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/036.yaml
  text: For seven days you shall present a food offering to Yahweh. On the eighth day you shall have a holy convocation[a], and you shall present a food offering to Yahweh. It is a solemn assembly; you shall do no ordinary work.
translation:
  language: hi
  text: सात दिन तक तुम यहोवा को अग्नि-भेंट[a] चढ़ाते रहो। आठवें दिन तुम्हारे लिए एक पवित्र सभा होगी, और तुम यहोवा को अग्नि-भेंट चढ़ाओ। यह एक विशेष सभा[b] है; कोई भी नियमित काम-काज न करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात आग पर चढ़ाई जाने वाली भेंट। इब्रानी शब्द אִשֶּׁה बलिदान-संबंधी एक पारिभाषिक शब्द है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘गंभीर सभा’। इब्रानी शब्द עֲצֶרֶת का सटीक शब्दार्थ निश्चित नहीं है; इस संदर्भ में यह आठवें दिन की विशेष पर्व-सभा को सूचित करता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह पद बलिदान चढ़ाने की अवधि बताता है; ‘तक’ आधुनिक हिन्दी में सातों दिनों तक जारी रहने वाले निर्देश को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תַּקְרִיבוּ / וְהִקְרַבְתֶּם
  choice: चढ़ाते रहना / चढ़ाना
  rationale: हिफ़ील में קרב का यहाँ उपासना-संबंधी अर्थ किसी भेंट को परमेश्वर के सामने अर्पित करना है। ‘चढ़ाना’ हिन्दी के बलिदानी संदर्भ में स्वाभाविक और स्पष्ट है।
- source_word: אִשֶּׁה
  choice: अग्नि-भेंट
  rationale: यह याजकीय साहित्य का पारिभाषिक शब्द है, जो आग पर चढ़ाई जाने वाली भेंट को सूचित करता है। संक्षिप्त ‘अग्नि-भेंट’ मूल की बलिदानी श्रेणी को बनाए रखता है; फुटनोट इसकी व्याख्या करता है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: ל समर्पण अथवा दिशा बताता है। ‘यहोवा को’ हिन्दी में भेंट के प्राप्तकर्ता को स्वाभाविक रूप से व्यक्त करता और मूल के निजी दिव्य नाम को सुरक्षित रखता है।
- source_word: מִקְרָא קֹדֶשׁ
  choice: एक पवित्र सभा
  rationale: यह पर्व-संबंधी निश्चित पदबंध बुलाकर एकत्र की गई पवित्र सभा को दर्शाता है। ‘पवित्र सभा’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: עֲצֶרֶת
  choice: विशेष समापन-सभा
  rationale: आठवें दिन के संदर्भ में यह पर्व के अंत में आयोजित विशेष सभा को दर्शाता है, जिसमें सामान्य काम से विरत रहना शामिल है। ‘विशेष समापन-सभा’ संदर्भगत अर्थ देता है, जबकि फुटनोट शब्द की संभावित व्यापकता सुरक्षित रखता है।
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: कोई भी नियमित काम-काज
  rationale: यह पर्व के दिन निषिद्ध सामान्य या पेशागत श्रम को दर्शाता है, न कि हर प्रकार की गतिविधि को। ‘नियमित काम-काज’ आधुनिक हिन्दी में यह भेद स्पष्ट करता है।
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: आठवें दिन
  rationale: मूल का सीधा और स्वाभाविक कालवाचक अनुवाद।
- source_word: יִהְיֶה לָכֶם
  choice: तुम्हारे लिए ... होगी
  rationale: היה + ל की रचना को स्वाभाविक हिन्दी में व्यक्त करता है और पर्व-संबंधी निर्देश का भाव बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का निजी नाम יהוה है। उसका लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: עֲצֶרֶת का स्वरूप
  choice: विशेष समापन-सभा
  alternative: गंभीर सभा / विशेष सभा
  rationale: इस पर्व-विधान में यह आठवें दिन की निष्कर्षात्मक सभा है। फिर भी शब्द केवल ‘समापन’ तक सीमित नहीं हो सकता, इसलिए फुटनोट वैकल्पिक अर्थ बताता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, निर्देशात्मक किंतु सहज और गरिमापूर्ण रखी गई है। ‘अग्नि-भेंट’, ‘पवित्र सभा’ और ‘समापन-सभा’ जैसे पद उपासना-संबंधी औपचारिकता बनाए रखते हैं, जबकि ‘नियमित काम-काज’ सामान्य पाठक के लिए निषेध का आशय स्पष्ट करता है।
