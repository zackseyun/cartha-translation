lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर … कहा
  rationale: वाव-क्रमिक क्रिया यहाँ वाणी की एक नई घटना आरम्भ करती है। हिंदी में לֵאמֹר के साथ मिलाकर ‘फिर … कहा’ सूत्रबद्ध भाव को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को हिंदी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है, न कि किसी उपाधि से बदला गया है।
- source_word: אֶל
  choice: से
  rationale: דבר के साथ संबोधित व्यक्ति को आधुनिक हिंदी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया जाता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: यह משה नाम का मानक हिंदी रूप है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह क्रियारूप आगे आने वाले कथन का परिचय देता है। हिंदी में וַיְדַבֵּר के साथ इसे अलग से ‘यह कहते हुए’ कहना अनावश्यक रूप से भारी होगा; संयुक्त रूप ‘कहा’ वही कार्य स्वाभाविक ढंग से करता है।
theological_decisions:
