  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है। हिंदी पाठकों के लिए सुविख्यात रूप ‘यहोवा’ नाम को नाम ही बनाए रखता है; ‘याहवे’ अधिक प्रत्यक्ष शैक्षिक लिप्यंतरण है, पर सामान्य हिंदी में कम परिचित है।
