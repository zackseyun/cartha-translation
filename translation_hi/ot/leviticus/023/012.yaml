  text: וַ/עֲשִׂיתֶ֕ם בְּ/י֥וֹם הֲנִֽיפְ/כֶ֖ם אֶת הָ/עֹ֑מֶר כֶּ֣בֶשׂ תָּמִ֧ים בֶּן שְׁנָת֛/וֹ לְ/עֹלָ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/012.yaml
  text: On the day you wave the sheaf[a], you shall offer a male lamb without blemish, a year old, as a burnt offering to Yahweh.
translation:
  language: hi
  text: जिस दिन तुम उस पूले को लहराओ[a], उसी दिन एक वर्ष का दोषरहित नर मेमना यहवे के लिए होमबलि के रूप में चढ़ाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ओमेर”; यहाँ यह शब्द संभवतः केवल सूखी माप नहीं, बल्कि अर्पण-विधि में प्रस्तुत किए गए अनाज के पूले को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: चढ़ाना
  rationale: बलिदान-संबंधी प्रसंग में עשה का अर्थ बलि अर्पित करना है; हिंदी में ‘चढ़ाना’ स्वाभाविक और स्पष्ट है।
- source_word: בְּיוֹם
  choice: जिस दिन … उस दिन
  rationale: इब्रानी काल-सूचक रचना को सहज आधुनिक हिंदी में संबंधसूचक ढाँचे द्वारा व्यक्त किया गया है।
- source_word: הֲנִיפְכֶם
  choice: हिलाकर चढ़ाओगे
  rationale: हिफ़ील रूप यहाँ यहवे के सामने अर्पण को विधिपूर्वक हिलाने की क्रिया बताता है; केवल ‘हिलाना’ अनुष्ठानिक आशय पूरी तरह स्पष्ट नहीं करता।
- source_word: הָעֹמֶר
  choice: उस पूले
  rationale: फसल और अर्पण के इस प्रसंग में עֹמֶר सूखी माप की अपेक्षा अनाज के पूले को सूचित करता है; संकेतवाचक ‘उस’ पूर्ववर्ती विधि से संबंध बनाए रखता है।
- source_word: כֶּבֶשׂ
  choice: नर मेमना
  rationale: यह शब्द मेमने को दर्शाता है और बलिदान-संबंधी प्रयोग में उसका नर होना निहित है।
- source_word: תָּמִים
  choice: निर्दोष
  rationale: बलि-पशु के संदर्भ में इसका अर्थ किसी शारीरिक दोष से रहित होना है; ‘निर्दोष’ हिंदी बाइबलीय और सामान्य दोनों प्रयोगों में सुबोध है।
- source_word: בֶּן שְׁנָתוֹ
  choice: एक वर्ष का
  rationale: यह इब्रानी मुहावरा पशु की आयु बताता है; यह हिंदी में संक्षिप्त और स्वाभाविक अभिव्यक्ति है।
- source_word: לְעֹלָה
  choice: होमबलि के रूप में
  rationale: עֹלָה पूर्णतः जलाए जाने वाले विशिष्ट बलिदान का पारिभाषिक नाम है; ‘होमबलि’ प्रचलित और संक्षिप्त हिंदी पद है।
- source_word: לַיהוָה
  choice: यहवे के लिए
  rationale: לְ अर्पण के अभिप्रेत प्राप्तकर्ता को सूचित करता है और יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘यहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिवाचक चतुराक्षरी नाम का प्रयोग करता है। ‘यहवे’ उस वाचा-नाम को उपाधि में बदले बिना सीधे प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पूला’, ‘नर मेमना’ और ‘होमबलि’ बलिदान-विधि की ठोस तथा पारिभाषिक भाषा को बनाए रखते हैं।
