base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/020.yaml
  text: The priest shall wave them with the bread of the firstfruits as a wave offering before Yahweh[a], with the two lambs. They shall be holy to Yahweh for the priest.
translation:
  language: hi
  text: याजक उन्हें पहली उपज की रोटी और दोनों मेमनों के साथ यहोवा के सामने हिलाने की भेंट के रूप में हिलाए।[a] वे यहोवा के लिए पवित्र हों; वे याजक के लिए हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “के साथ” का अधिक शाब्दिक अनुवाद दोनों स्थानों पर “के ऊपर” भी हो सकता है; इब्रानी संबंधबोधक शब्द यहाँ अनुष्ठान में साथ प्रस्तुत किए जाने का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  choice: हिलाए
  rationale: हिफ़ील रूप नוּף यहाँ बलिदानी अनुष्ठान में वस्तुओं को परमेश्वर के सामने विधिपूर्वक हिलाने या प्रस्तुत करने की क्रिया बताता है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: पुल्लिंग बहुवचन सर्वनाम का संदर्भ पिछले प्रसंग में बताई गई भेंटों से है; अनुवाद मूल की संदर्भगत अनिश्चितता को बनाए रखता है।
- source_word: עַל לֶחֶם הַבִּכּוּרִים
  choice: पहले फल की रोटी ... के साथ
  rationale: עַל का मूल स्थानवाचक अर्थ ‘ऊपर’ हो सकता है, पर इस अनुष्ठानिक संदर्भ में संयुक्त प्रस्तुति के लिए ‘के साथ’ स्वाभाविक है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: תְּנוּפָה
  choice: हिलाने की भेंट
  rationale: यह परमेश्वर के सामने विधिपूर्वक हिलाई जाने वाली भेंट का पारिभाषिक बलिदानी शब्द है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह उपासना-संबंधी कार्य के परमेश्वर की उपस्थिति में किए जाने का सामान्य इब्रानी मुहावरा है।
- source_word: עַל שְׁנֵי כְּבָשִׂים
  choice: दोनों मेमनों के साथ
  rationale: पहले עַל की तरह यहाँ भी ‘के साथ’ संयुक्त अनुष्ठानिक प्रस्तुति स्पष्ट करता है, जबकि ‘ऊपर’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: קֹדֶשׁ יִהְיוּ
  choice: पवित्र ... हों
  rationale: संज्ञा קֹדֶשׁ और היה का संयोजन इन वस्तुओं की पवित्र स्थिति व्यक्त करता है।
- source_word: לַיהוָה לַכֹּהֵן
  choice: यहोवा के लिए ... और याजक के लिए
  rationale: दोनों ל वाक्यांश यह बताते हैं कि वस्तुएँ यहोवा को समर्पित होकर याजक के हिस्से में आती हैं; संक्षिप्त संरचना मूल के तनाव को बनाए रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: पवित्र वस्तुओं का यहोवा और याजक दोनों के लिए होना
  choice: वे यहोवा के लिए पवित्र और याजक के लिए हों
  alternative: वे यहोवा के लिए पवित्र हों; वे याजक के लिए हों
  rationale: इब्रानी में लगातार आए לַיהוָה לַכֹּהֵן समर्पण और याजकीय अधिकार दोनों बताते हैं। अनुवाद इस संबंध को स्पष्ट करता है, पर ऐसा अतिरिक्त स्पष्टीकरण नहीं जोड़ता कि याजक उनका किस प्रकार उपयोग करेगा।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी के साधारण बाइबलीय पाठक के लिए परिचित नामरूप ‘यहोवा’ रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज विधिक-अनुष्ठानिक शैली रखी गई है। ‘याजक’, ‘पहले फल’ और ‘हिलाने की भेंट’ जैसे पद सामान्य पाठक के लिए समझने योग्य रहते हुए लैव्यव्यवस्था की पारिभाषिक भाषा को सुरक्षित रखते हैं।
