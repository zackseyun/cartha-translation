source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֲמִשָּׁ֨ה עָשָׂ֜ר י֗וֹם לַ/חֹ֤דֶשׁ הַ/שְּׁבִיעִי֙ הַ/זֶּ֔ה חַ֧ג הַ/סֻּכּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים לַ/יהֹוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/034.yaml
  text: 'Speak to the sons of Israel[a], saying: On the fifteenth day of this seventh month is the Feast of Booths for seven days to Yahweh.'
translation:
  language: hi
  text: '“इस्राएल के पुत्रों से यह कह: इस सातवें महीने के पंद्रहवें दिन याहवे के लिए झोंपड़ियों का पर्व है, जो सात दिन तक रहता है[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत नाम: “मंडपों का पर्व।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל לֵאמֹר
  choice: इस्राएल के पुत्रों से कह
  rationale: आज्ञार्थक शैली और मूल के सूत्रबद्ध ‘इस्राएल के पुत्र’ को बनाए रखते हुए स्वाभाविक हिन्दी वाक्य-विन्यास अपनाया गया है।
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: इस सातवें महीने के पंद्रहवें दिन से
  rationale: हिब्रू तिथि-सूत्र का स्पष्ट, स्वाभाविक हिन्दी रूप; ‘से’ अगले सात दिनों की अवधि को सहजता से व्यक्त करता है।
- source_word: חַג הַסֻּכּוֹת
  choice: झोंपड़ियों का पर्व
  rationale: סֻכּוֹת अस्थायी झोंपड़ियों या आश्रयों को दर्शाता है; यह रूप पारंपरिक नाम की अपेक्षा मूल अर्थ को आधुनिक पाठक के लिए अधिक स्पष्ट करता है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: पर्व की अवधि को स्वाभाविक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ल उपसर्ग यहाँ पर्व के समर्पण या अभिमुखता को दर्शाता है; परमेश्वर के व्यक्तिगत वाचा-नाम को ‘याहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम सीधे आया है; ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: סֻכּוֹת पर्व का नाम
  choice: झोंपड़ियों का पर्व
  alternative: मंडपों का पर्व
  rationale: मुख्य पाठ में हिब्रू शब्द का ठोस अर्थ स्पष्ट रखा गया है, जबकि परिचित पारंपरिक नाम पाठक की सहायता के लिए पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और स्पष्ट शैली रखी गई है। विधिक-उपासना संबंधी सूत्र की औपचारिकता बचाने के लिए ‘इस्राएल के पुत्रों’ और एकवचन आज्ञार्थक ‘कह’ का प्रयोग किया गया है।
