base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/014.yaml
  text: And you shall not eat bread or roasted grain or fresh grain until this very day[a], until you have brought the offering of your God[c][b]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: hi
  text: तुम इस दिन तक, अर्थात जब तक तुम अपने परमेश्वर को भेंट न चढ़ाओ, रोटी, भुना हुआ अनाज[a] या ताज़ा अनाज[b] मत खाना। यह तुम्हारी पीढ़ी-दर-पीढ़ी, तुम्हारे सभी निवास-स्थानों में सदा की विधि[c] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेंका हुआ अनाज’।
    reason: lexical_alternative
  - marker: b
    text: या ‘नया अनाज’।
    reason: lexical_alternative
  - marker: c
    text: या ‘चिरस्थायी विधि’ अथवा ‘सदा के लिए ठहराई हुई विधि’।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: रोटी
  rationale: यहाँ अनाज से बने खाद्य पदार्थों की सूची में ठोस और सामान्य अर्थ ‘रोटी’ उपयुक्त है; व्यापक ‘भोजन’ कृषि-संदर्भ की विशिष्टता घटा देता।
- source_word: קָלִי
  choice: भुना हुआ अनाज
  rationale: यह आग में भूनकर तैयार किए गए अनाज को दर्शाता है। यह आधुनिक हिन्दी में स्पष्ट है; ‘सेंका हुआ अनाज’ पादटिप्पणी में वैकल्पिक रूप से दिया गया है।
- source_word: כַרְמֶל
  choice: ताज़ा अनाज
  rationale: रोटी और भुने अनाज के साथ यह नए पके हुए दानों या बालियों को सूचित करता है, कर्मेल नामक स्थान को नहीं।
- source_word: לֹא תֹאכְלוּ
  choice: न तो ... खाना, न ...
  rationale: निषेधात्मक अपूर्ण क्रिया का विधिक बल हिन्दी के स्पष्ट निषेध ‘न ... खाना’ से व्यक्त किया गया है।
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: ठीक इसी दिन तक
  rationale: עֶצֶם समय-सूचक पद पर बल देता है; ‘ठीक इसी दिन’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עַד הֲבִיאֲכֶם
  choice: ले आने तक
  rationale: यह उस कार्य को सीमा या आवश्यक पूर्वशर्त के रूप में रखता है जिसके पूरा होने तक निषेध लागू है।
- source_word: קָרְבַּן אֱלֹהֵיכֶם
  choice: अपने परमेश्वर की भेंट
  rationale: ‘भेंट’ קָרְבָּן का सामान्य धार्मिक अर्थ देता है और बलिदान के किसी अधिक विशिष्ट प्रकार को अनावश्यक रूप से नहीं जोड़ता।
- source_word: חֻקַּת עוֹלָם
  choice: सदा की विधि
  rationale: यह वाक्यांश व्यवस्था की निरंतर और स्थायी बाध्यता व्यक्त करता है; ‘सदा की विधि’ आधुनिक, संक्षिप्त और गरिमापूर्ण है।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-दर-पीढ़ी
  rationale: यह लगातार आने वाली पीढ़ियों में विधि की निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: तुम्हारे सभी निवास-स्थानों में
  rationale: यह इस्राएलियों के रहने के सभी स्थानों को समेटता है और मूल के विधिक भाव को बनाए रखता है।
theological_decisions:
- issue: मूसा की व्यवस्था में חֻקַּת עוֹלָם का बल
  choice: सदा की विधि
  alternative: चिरस्थायी विधि; सदा के लिए ठहराई हुई विधि
  rationale: अनुवाद लैव्यव्यवस्था के वाचा-संबंधी और विधिक संदर्भ में इसकी निरंतर बाध्यता को बनाए रखता है, पर बाद के युगों में मूसा की अनुष्ठानिक व्यवस्था के लागू होने या न होने पर कोई धर्मवैज्ञानिक निष्कर्ष नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक शैली रखी गई है। दोहराए गए עַד को डैशों के बीच समान सीमा के दो परस्पर संबद्ध वर्णनों के रूप में रखा गया है, जिससे ‘ठीक इसी दिन’ और भेंट लाने की पूर्वशर्त दोनों सुरक्षित रहें। सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
