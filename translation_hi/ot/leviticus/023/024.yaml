source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר בַּ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ יִהְיֶ֤ה לָ/כֶם֙ שַׁבָּת֔וֹן זִכְר֥וֹן תְּרוּעָ֖ה מִקְרָא קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/024.yaml
  text: 'Speak to the sons of Israel[a], saying: In the seventh month, on the first day of the month, there shall be for you a solemn rest, a memorial of trumpet blasts, a holy convocation.'
translation:
  language: hi
  text: '“इस्राएल के पुत्रों से कहो: सातवें महीने में, महीने के पहले दिन, तुम्हारे लिए पूर्ण विश्राम होगा—संकेत-ध्वनि का स्मरणोत्सव और पवित्र सभा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी पारिवारिक अभिव्यक्ति का निकट और स्वाभाविक हिन्दी रूप; यह सामूहिक रूप से वाचा-समुदाय को संबोधित करती है।
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בְּאֶחָד לַחֹדֶשׁ
  choice: सातवें महीने के पहले दिन
  rationale: इब्रानी काल-सूचक मुहावरे को संक्षिप्त, स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שַׁבָּתוֹן
  choice: परम विश्राम का दिन
  rationale: साधारण विश्राम से अधिक, विधिवत काम से विराम रखने की प्रबल धारणा को व्यक्त करता है।
- source_word: זִכְרוֹן
  choice: स्मरणोत्सव
  rationale: ऐसे धार्मिक आयोजन की धारणा व्यक्त करता है जो स्मरण कराने या स्मृति-चिह्न का काम करे।
- source_word: תְּרוּעָה
  choice: ऊँची ध्वनि
  rationale: शब्द के व्यापक अर्थ को बनाए रखता है; यह जयघोष, ऊँची पुकार अथवा नरसिंगे/तुरही की ध्वनि हो सकती है।
- source_word: מִקְרָא קֹדֶשׁ
  choice: पवित्र सभा
  rationale: पवित्र उद्देश्य से बुलाई गई सभा का स्पष्ट और आधुनिक हिन्दी रूप।
theological_decisions:
- issue: उत्सव के नाम में תְּרוּעָה का स्वरूप
  choice: मुख्य पाठ में व्यापक अर्थ ‘ऊँची ध्वनि’ रखा गया
  alternative: तुरहियों का निनाद; नरसिंगों की ध्वनि; जयघोष
  rationale: इब्रानी शब्द किसी ऊँची संकेत-ध्वनि को दर्शाता है और अपने आप वाद्य को निश्चित नहीं करता। पर्व-संदर्भ में नरसिंगे या तुरही का निनाद सम्भव है, पर उसे मुख्य पाठ में अनिवार्य करना मूल की वास्तविक अस्पष्टता मिटा देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘इस्राएल के पुत्रों’ से मूल की पारिवारिक अभिव्यक्ति बचती है; ‘पवित्र सभा’ सामान्य पाठक के लिए ‘पवित्र दीक्षांत/महासम्मेलन’ जैसे अधिक कृत्रिम विकल्पों से स्पष्ट है।
