source:
  edition: WLC
  text: אֵ֚לֶּה מוֹעֲדֵ֣י יְהוָ֔ה מִקְרָאֵ֖י קֹ֑דֶשׁ אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם בְּ/מוֹעֲדָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/004.yaml
  text: These are the appointed times of Yahweh[a], holy convocations[b], which you shall proclaim at their appointed times.
translation:
  language: hi
  text: ये याहवे के नियत समय, अर्थात् पवित्र सभाएँ हैं, जिन्हें तुम उनके नियत समयों पर घोषित करोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये ... हैं
  rationale: यह बहुवचन संकेतवाचक पद आगे दी जाने वाली सूची का परिचय देता है; स्वाभाविक हिन्दी में ‘हैं’ जोड़ा गया है।
- source_word: מוֹעֲדֵי
  choice: ठहराए हुए समय
  rationale: מוֹעֵד किसी नियत समय या मिलन-अवसर को दर्शाता है। यहाँ इसका अर्थ केवल भोज वाले पर्वों तक सीमित नहीं है, इसलिए व्यापक कालगत अर्थ रखा गया है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: पवित्र सभाएँ
  rationale: यह रचना पवित्र घोषित सभाओं या समागमों को दर्शाती है। ‘सभाएँ’ सामान्य आधुनिक हिन्दी में स्पष्ट है, जबकि घोषणा द्वारा बुलाए जाने का भाव क्रिया में बना रहता है।
- source_word: תִּקְרְאוּ
  choice: घोषणा ... करना
  rationale: इस प्रसंग में קרא केवल नाम रखने के बजाय सार्वजनिक रूप से घोषित करने या बुलाने का अर्थ देता है।
- source_word: בְּמוֹעֲדָם
  choice: उनके ठहराए हुए समय पर
  rationale: प्रत्येक पवित्र सभा के अपने नियत अवसर का भाव व्यक्त होता है और पहले आए מוֹעֵד की पुनरावृत्ति भी सुरक्षित रहती है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है। उसका लिप्यंतरण नाम और उपाधि के बीच का अंतर बनाए रखता है; ‘यहवे’ आधुनिक हिन्दी में Yahweh का निकट रूप है।
- issue: מוֹעֲדֵי का दायरा
  choice: ठहराए हुए समय
  alternative: नियत पर्व
  rationale: अध्याय में यह पद केवल उत्सवी भोजों से अधिक व्यापक पवित्र अवसरों को समेटता है। ‘समय’ इस व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ठहराए हुए समय’ की पुनरावृत्ति मूल इब्रानी की शब्दगत कड़ी को सुरक्षित रखती है; ‘अर्थात्’ दो संज्ञा-पदों के व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
