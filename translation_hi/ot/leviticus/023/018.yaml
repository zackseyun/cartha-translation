- from: रोटी के साथ[a] तुम एक-एक वर्ष के सात निर्दोष नर मेमने, गाय-बैलों के झुंड में से एक बछड़ा और दो मेढ़े चढ़ाना। वे यहोवा के लिए होमबलि होंगे। उनके साथ उनका अन्नबलि और अर्घ भी चढ़ाना—यह यहोवा के लिए आग में चढ़ाया हुआ बलिदान[b] होगा, जिसकी सुगंध उसे भाती है।
