  text: וְ/הִקְרַבְתֶּ֣ם עַל הַ/לֶּ֗חֶם שִׁבְעַ֨ת כְּבָשִׂ֤ים תְּמִימִם֙ בְּנֵ֣י שָׁנָ֔ה וּ/פַ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד וְ/אֵילִ֣ם שְׁנָ֑יִם יִהְי֤וּ עֹלָה֙ לַֽ/יהוָ֔ה וּ/מִנְחָתָ/ם֙ וְ/נִסְכֵּי/הֶ֔ם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/018.yaml
  text: And with the bread you shall present seven male lambs a year old[a], without blemish, and one bull from the herd, and two rams. They shall be a burnt offering to Yahweh, with their grain offering and their drink offerings, a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: hi
  text: रोटी के साथ[a] तुम एक वर्ष के सात निर्दोष नर मेमने, झुंड का एक बैल और दो मेढ़े चढ़ाओ। वे यहोवा के लिए होमबलि होंगे, उनके अन्न-भेंट और पेय-भेंटों सहित—यहोवा के लिए सुखद सुगंध वाली अग्नि-भेंट।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रोटी के अतिरिक्त”; इब्रानी संबंधबोधक शब्द साथ या अतिरिक्त चढ़ाए जाने का भाव दे सकता है, न कि रोटी के ऊपर रखे जाने का।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: तुम ... चढ़ाना
  rationale: हिफ़ील रूप का बलिदानी संदर्भ में अर्थ भेंट को समीप लाकर प्रस्तुत करना है। हिंदी में ‘चढ़ाना’ स्वाभाविक है और बलिदानी क्रिया स्पष्ट करता है।
- source_word: עַל הַלֶּחֶם
  choice: रोटी के साथ
  rationale: यहाँ עַל भौतिक रूप से रोटी के ऊपर रखने के बजाय पहले बताई गई रोटी के साथ इन पशुबलियों के चढ़ाए जाने को व्यक्त करता है; इसकी संभावित वैकल्पिक बारीकी पादटिप्पणी में रखी गई है।
- source_word: שִׁבְעַת כְּבָשִׂים תְּמִימִם בְּנֵי שָׁנָה
  choice: एक-एक वर्ष के सात निर्दोष नर मेमने
  rationale: כְּבָשִׂים पुल्लिंग मेमनों को, תְּמִימִם बलिदान के योग्य दोषरहित दशा को और בְּנֵי שָׁנָה प्रत्येक पशु की एक वर्ष की आयु को दर्शाता है।
- source_word: וּפַר בֶּן־בָּקָר אֶחָד
  choice: गाय-बैलों के झुंड में से एक बछड़ा
  rationale: פַר בֶּן־בָּקָר गोवंश के एक नर बछड़े या युवा बैल को दर्शाता है। ‘बछड़ा’ उसके नर होने और आयु की सामान्य बारीकी को सहज हिंदी में व्यक्त करता है।
- source_word: וְאֵילִם שְׁנָיִם
  choice: दो मेढ़े
  rationale: אַיִל वयस्क नर भेड़ के लिए विशिष्ट शब्द है; ‘मेढ़ा’ इसका सटीक हिंदी समतुल्य है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह पूरी तरह वेदी पर जलाए जाने वाले बलिदान का पारंपरिक तकनीकी पद है; एकवचन यहाँ सूचीबद्ध पशुओं के लिए सामूहिक अर्थ रखता है।
- source_word: מִנְחָתָם
  choice: उनका अन्नबलि
  rationale: लैव्यव्यवस्था के बलिदानी संदर्भ में מִנְחָה साथ चढ़ाई जाने वाली अन्न-भेंट है।
- source_word: נִסְכֵּיהֶם
  choice: अर्घ
  rationale: נֶסֶךְ उंडेली जाने वाली पेय-भेंट है। ‘अर्घ’ संक्षिप्त और प्रतिष्ठित हिंदी बलिदानी पद है।
- source_word: אִשֵּׁה
  choice: आग में चढ़ाया हुआ बलिदान
  rationale: यह पद आग के द्वारा चढ़ाई जाने वाली भेंट की श्रेणी बताता है। इस अनुवाद में अस्पष्ट व्युत्पत्ति पर निर्भर ‘भोजन-भेंट’ के बजाय प्रत्यक्ष अनुष्ठानिक अर्थ रखा गया है।
- source_word: רֵיחַ נִיחֹחַ
  choice: जिसकी सुगंध उसे भाती है
  rationale: मुहावरे का अर्थ यहोवा को प्रसन्न करने वाली सुगंध है। हिंदी वाक्यांश प्राकृतिक है और स्रोत के मानवीकरण को बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत वाचा-नाम יהוה को ‘यहोवा’ के रूप में लिप्यंतरित किया गया है और ל को अर्पण के प्राप्तकर्ता के अर्थ में ‘के लिए’ कहा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं बल्कि चार-अक्षरीय व्यक्तिगत नाम है। ‘यहोवा’ हिंदी पाठकों में प्रचलित रूप है और वाचा-नाम को उपाधि में बदलने से बचाता है।
- issue: רֵיחַ נִיחֹחַ में ईश्वर के प्रति मानवीय भाषा
  choice: जिसकी सुगंध उसे भाती है
  alternative: सुखदायक सुगंध
  rationale: चुना हुआ रूप स्पष्ट रखता है कि सुगंध यहोवा को भाती है और मूल की धर्मवैज्ञानिक मानवीय अभिव्यक्ति को मंद नहीं करता।
- issue: אִשֵּׁה को भोजन या अग्नि से संबंधित भेंट समझना
  choice: आग में चढ़ाया हुआ बलिदान
  alternative: भोजन-भेंट
  rationale: बलिदान आग पर चढ़ाया जाता है, जो संदर्भ में निश्चित है; ‘भोजन-भेंट’ संभव संकल्पना है, पर वह विवादित व्युत्पत्तिगत व्याख्या को मुख्य पाठ में स्थापित कर सकती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिंदी रखी गई है। ‘होमबलि’, ‘अन्नबलि’ और ‘अर्घ’ जैसे स्थापित बलिदानी पदों का प्रयोग तकनीकी सटीकता के लिए किया गया है; कम परिचित अर्थों को वाक्य-संदर्भ और पादटिप्पणियों से स्पष्ट किया गया है।
