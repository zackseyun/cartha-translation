  text: וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֛ה לַ/יהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הַ/שְּׁבִיעִי֙ מִקְרָא קֹ֔דֶשׁ כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/008.yaml
  text: And you shall present a food offering to Yahweh for seven days[a]. On the seventh day there shall be a holy convocation; you shall do no laborious work.
translation:
  language: hi
  text: और सात दिन तक तुम यहोवा के लिए अग्नि-भेंट[a] चढ़ाओ। सातवें दिन एक पवित्र सभा होगी; उस दिन कोई भी श्रम का काम मत करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भोजन-भेंट।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: चढ़ाना
  rationale: हिफ़ील रूप बलिदान-संदर्भ में किसी भेंट को निकट लाने या अर्पित करने का बोध देता है; हिंदी में ‘चढ़ाना’ स्वाभाविक और उपासना-संदर्भ के अनुकूल है।
- source_word: אִשֶּׁה
  choice: अग्नि-भेंट
  rationale: यह याजकीय पद अग्नि पर अर्पित भेंट को सूचित करता है। ‘अग्नि-भेंट’ मूल रूप से जुड़े अग्नि-संबंध को बचाता है और हिंदी में संक्षिप्त है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל समर्पण या प्राप्तकर्ता का बोध देता है; ‘के लिए’ भेंट के यहोवा को समर्पित होने को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह वाक्यांश उस पूरी अवधि को सूचित करता है जिसमें प्रतिदिन भेंट चढ़ाई जानी है।
- source_word: מִקְרָא קֹדֶשׁ
  choice: पवित्र सभा
  rationale: यह नियत पर्व पर बुलाई गई पवित्र सामुदायिक सभा है; ‘पवित्र सभा’ आधुनिक पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: कोई श्रम का काम
  rationale: यह हर प्रकार की गतिविधि नहीं, बल्कि सामान्य श्रम या व्यवसाय-संबंधी काम को निषिद्ध करता है; यह चयन उस सीमा को बनाए रखता है।
- source_word: לֹא תַעֲשׂוּ
  choice: न करना
  rationale: बहुवचन निषेध को हिंदी की विधिक-आदेशात्मक शैली में स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में व्यक्तिगत वाचा-नाम है। हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखते हुए इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: אִשֶּׁה का अर्थ
  choice: अग्नि-भेंट
  alternative: भोजन-भेंट
  rationale: शब्द की सटीक व्युत्पत्ति और अर्थ पर चर्चा है, पर याजकीय संदर्भ में अग्नि पर चढ़ाई जाने वाली भेंट स्पष्ट है। मुख्य पाठ में अग्नि-संबंध रखा गया और वैकल्पिक अर्थ टिप्पणी में दिया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और आदेशात्मक रखी गई है। ‘पवित्र सभा’ तकनीकी पर्व-संबंधी पद को स्पष्ट बनाता है, जबकि ‘श्रम का काम’ निषेध को हर संभव गतिविधि तक अनावश्यक रूप से नहीं फैलाता।
