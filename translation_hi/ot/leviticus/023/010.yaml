  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר אֲנִי֙ נֹתֵ֣ן לָ/כֶ֔ם וּ/קְצַרְתֶּ֖ם אֶת קְצִירָ֑/הּ וַ/הֲבֵאתֶ֥ם אֶת עֹ֛מֶר רֵאשִׁ֥ית קְצִירְ/כֶ֖ם אֶל הַ/כֹּהֵֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/010.yaml
  text: 'Speak to the sons of Israel and say to them: When you come into the land that I am giving to you[a], and reap its harvest[b], then you shall bring the sheaf of the firstfruits of your harvest to the priest.'
translation:
  language: hi
  text: '“इस्राएल के पुत्रों से बोलो और उनसे कहो: जब तुम उस देश में आओगे जिसे मैं तुम्हें दे रहा हूँ, और उसकी फसल काटोगे, तब तुम्हारी फसल की पहली उपज का पूला याजक के पास ले आना।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी संबोधन के पुरुषवाचक बहुवचन और उसके पारंपरिक वाचा-संबंधी रूप को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: כִּי תָבֹאוּ
  choice: जब तुम ... आओगे
  rationale: כִּי यहाँ आज्ञा के लागू होने की भावी परिस्थिति प्रस्तुत करता है; हिन्दी में ‘जब’ स्वाभाविक है।
- source_word: הָאָרֶץ אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: उस देश में ... जिसे मैं तुम्हें दे रहा हूँ
  rationale: ‘देश’ यहाँ इस्राएल को दिए जाने वाले भूभाग का स्वाभाविक हिन्दी बोध देता है, और वर्तमान कृदन्त נֹתֵן को ‘दे रहा हूँ’ सुरक्षित रखता है।
- source_word: וּקְצַרְתֶּם אֶת קְצִירָהּ
  choice: और उसकी फसल काटोगे
  rationale: क्रिया और संज्ञा के कृषि-संबंधी अर्थ को सहज हिन्दी में व्यक्त करता है; ‘उसकी’ का संकेत देश की ओर है।
- source_word: וַהֲבֵאתֶם
  choice: तब ... लाना
  rationale: शर्त के बाद आने वाली विधिक आज्ञा को हिन्दी के स्वाभाविक आज्ञार्थक रूप में व्यक्त करता है।
- source_word: עֹמֶר
  choice: एक पूला
  rationale: इस प्रसंग में काटी हुई बालियों के बँधे हुए गट्ठर का ठोस अर्थ उपयुक्त है; तकनीकी लिप्यंतरण ‘ओमेर’ पादटिप्पणी में रखा गया है।
- source_word: רֵאשִׁית קְצִירְכֶם
  choice: अपनी फसल के पहले फल का
  rationale: רֵאשִׁית की आरम्भिक उपज और अर्पण-संबंधी महत्ता दोनों को ‘पहले फल’ से व्यक्त किया गया है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के उपासना-संबंधी विधान में כֹּהֵן का मानक और स्पष्ट हिन्दी रूप।
theological_decisions:
- issue: वाचा-संबंधी लिंगयुक्त संबोधन
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल के लोगों
  rationale: मूल इब्रानी की स्पष्ट पुरुषवाचक बहुवचन अभिव्यक्ति को मुख्य पाठ में रखा गया है, बिना उसके सामुदायिक संबोधन को किसी आधुनिक वैचारिक दिशा में बदलने के।
- issue: उपासना-संबंधी शब्द עֹמֶר
  choice: एक पूला
  alternative: एक ओमेर
  rationale: तात्कालिक प्रसंग में याजक के पास लाई जाने वाली काटी हुई उपज का पूला अभिप्रेत प्रतीत होता है, पर तकनीकी शब्द होने की संभावना पादटिप्पणी में सुरक्षित है।
- issue: רֵאשִׁית का अर्थ
  choice: पहले फल
  alternative: पहला भाग
  rationale: कटनी और अर्पण के प्रसंग में यह आरम्भिक उपज को सूचित करता है; ‘पहले फल’ समयगत प्राथमिकता और धार्मिक उपयोग दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘इस्राएल के पुत्रों’ मूल संबोधन की औपचारिकता को सुरक्षित रखता है; ‘पूला’ कृषि-संदर्भ में सहज है।
