review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the complete-rest Sabbath, the self-directed ritual command, and the evening-to-evening duration. However, the final expression should render the Hebrew future/modal command in grammatical Hindi rather than the infinitive-like “मानना.”
  naturalness: “तुम अपना सब्त मानना” is not natural or grammatically parallel to the surrounding future forms. “तुम अपने सब्त का पालन करोगे” is idiomatic modern standard Hindi. “अपने आप को दीन करोगे” is understandable but comparatively less natural and less direct than “अपने आप को कष्ट दोगे” for the self-affliction idiom.
  terminology: “पूर्ण विश्राम का सब्त” appropriately retains the intensified Sabbath-rest terminology. “सब्त” is a suitable established biblical term. “अपने सब्त का पालन करोगे” retains the possessive expression without implying a distinct doctrinal interpretation.
  issues:
