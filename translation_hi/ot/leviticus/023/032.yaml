    issue: Final clause uses “मानना” rather than a finite future/modal form.
    rationale: The Hebrew תִּשְׁבְּתוּ is a second-person plural imperfect in a command context, coordinated with “होगा” and “करोगे.” The draft’s “तुम अपना सब्त मानना” is grammatically awkward in modern Hindi and should be changed to a finite form.
  - severity: low
    issue: “अपने आप को दीन करोगे” is less direct and less idiomatic for the Hebrew self-affliction expression.
    rationale: It can mean humble yourselves, an acknowledged lexical alternative, but the main text can more directly preserve the broader self-affliction sense with “अपने आप को कष्ट दोगे,” while retaining ‘दीन’ in the footnote as an alternative.
