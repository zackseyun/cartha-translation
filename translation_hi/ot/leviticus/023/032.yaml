source:
  edition: WLC
  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הוּא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם בְּ/תִשְׁעָ֤ה לַ/חֹ֨דֶשׁ֙ בָּ/עֶ֔רֶב מֵ/עֶ֣רֶב עַד עֶ֔רֶב תִּשְׁבְּת֖וּ שַׁבַּתְּ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/032.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall afflict yourselves. On the ninth day of the month, in the evening, from evening to evening[b], you shall keep your Sabbath.
translation:
  language: hi
  text: यह तुम्हारे लिए पूर्ण विश्राम का सब्त होगा, और तुम अपने आप को कष्ट दोगे[a]। महीने के नौवें दिन की शाम को, शाम से शाम तक[b], तुम अपने सब्त का पालन करोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम अपने आप को दीन करोगे” अथवा “तुम अपने आप को वंचित रखोगे।” इब्रानी मुहावरा पश्चात्तापपूर्ण धार्मिक पालन में स्वयं को कष्ट देने को दर्शाता है, जो परंपरागत रूप से उपवास से जुड़ा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “शाम से शाम तक”; यह इस्राएली दिन-गणना के अनुसार पालन की अवधि बताता है।
    reason: cultural_note
lexical_decisions:
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: पूर्ण विश्राम का सब्त
  rationale: दोनों संबद्ध संज्ञाएँ विश्राम और काम से रुकने के भाव को प्रबल करती हैं। यह रूप उस गहनता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: तुम अपने आप को दीन करोगे
  rationale: यह इब्रानी मुहावरा प्रायश्चित्त के संदर्भ में आत्म-दमन या स्वयं को नम्र करने को व्यक्त करता है और उपवास से जुड़ा हो सकता है। ‘दीन करोगे’ मूल की व्यापकता बनाए रखता है, जबकि केवल ‘उपवास करोगे’ कहना अर्थ को अनावश्यक रूप से सीमित कर देता।
- source_word: נַפְשֹׁתֵיכֶם
  choice: अपने आप को
  rationale: इस मुहावरे में נֶפֶשׁ पूरे व्यक्ति के लिए आत्मवाचक अर्थ में प्रयुक्त है; ‘अपने प्राणों को’ आधुनिक हिन्दी में भ्रामक या अस्वाभाविक हो सकता है।
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ בָּעֶרֶב
  choice: महीने के नौवें दिन की शाम से
  rationale: यह वाक्यांश नौवें दिन की शाम में अनुष्ठान के आरम्भ को बताता है। ‘से’ अगले वाक्यांश के ‘अगली शाम तक’ के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: מֵעֶרֶב עַד עֶרֶב
  choice: शाम से लेकर अगली शाम तक
  rationale: मूलतः ‘शाम से शाम तक’। हिन्दी में ‘अगली’ जोड़ने से अवधि स्पष्ट होती है, बिना दिन-गणना की सांस्कृतिक पृष्ठभूमि को बदलने के।
- source_word: תִּשְׁבְּתוּ שַׁבַּתְּכֶם
  choice: तुम अपना सब्त मानना
  rationale: क्रिया שבת का मूल भाव रुकना या विश्राम करना है; ‘सब्त मानना’ इस विशेष संयोग का सहज हिन्दी मुहावरेदार अर्थ देता है।
theological_decisions:
- issue: आराधनात्मक संदर्भ में अपने को दीन करने का अर्थ
  choice: मुख्य पाठ में व्यापक आदेश ‘अपने आप को दीन करोगे’ रखा गया।
  alternative: ‘तुम उपवास करोगे’ अथवा ‘तुम अपने आप को कष्ट दोगे’
  rationale: पद में उपवास का स्पष्ट शब्द नहीं है, यद्यपि यह व्यवहार परंपरागत रूप से उपवास से जुड़ा है। व्यापक अभिव्यक्ति मूल पाठ की अर्थगत गुंजाइश और धार्मिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामुदायिक निर्देश का स्वर रखा गया है। ‘सब्त’ बाइबिलीय सांस्कृतिक पद के रूप में सुरक्षित है; आज्ञार्थक भाव के लिए हिन्दी में स्वाभाविक ‘मानना’ प्रयुक्त हुआ है।
