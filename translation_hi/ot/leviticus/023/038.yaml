base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/038.yaml
  text: besides the Sabbaths of Yahweh[a], and besides your gifts, and besides all your vows, and besides all your freewill offerings[b], which you give to Yahweh.
translation:
  language: hi
  text: याहवे के विश्राम-दिनों के अतिरिक्त[a], और तुम्हारी भेंटों के अतिरिक्त, और तुम्हारी सभी मन्नतों[b] के अतिरिक्त, और तुम्हारी उन सभी स्वेच्छा-भेंटों के अतिरिक्त जो तुम याहवे को देते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हर बार आए “के अतिरिक्त” का अर्थ “से अलग” या “के अलावा और भी” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मन्नतों” का अर्थ यहाँ मन्नत के अनुसार दी जाने वाली भेंटें भी हो सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: מִלְּבַד
  choice: के अतिरिक्त
  rationale: यह पदबंध पहले बताई गई पर्व-संबंधी भेंटों से अलग अथवा उनके साथ जोड़ी जाने वाली बातों को दर्शाता है। इसकी पुनरावृत्ति हिब्रू की बलाघाती सूची-रचना को बनाए रखती है।
- source_word: שַׁבְּתֹת יְהוָה
  choice: याहवे के विश्राम-दिनों
  rationale: बहुवचन שַׁבְּתֹת को बहुवचन में रखा गया है और याहवे के साथ संबंधसूचक रचना को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מַתְּנוֹתֵיכֶם
  choice: तुम्हारी भेंटों
  rationale: מַתָּנָה का व्यापक अर्थ ‘भेंट’ है; यहाँ परमेश्वर को दी जाने वाली भेंटों का संदर्भ है, इसलिए अनावश्यक रूप से किसी विशिष्ट बलिदान-प्रकार को नहीं जोड़ा गया।
- source_word: כָּל נִדְרֵיכֶם
  choice: तुम्हारी सभी मन्नतों
  rationale: נֶדֶר मन्नत तथा संदर्भानुसार मन्नत के अंतर्गत दी जाने वाली वस्तु, दोनों को सूचित कर सकता है। मुख्य पाठ में संक्षिप्त और प्रचलित ‘मन्नत’ रखा गया है।
- source_word: כָּל נִדְבֹתֵיכֶם
  choice: तुम्हारी सभी स्वेच्छा-भेंटों
  rationale: बलिदान-संबंधी संदर्भ में נְדָבָה ऐसी भेंट है जो स्वेच्छा से दी जाती है। ‘स्वेच्छा-भेंट’ अर्थ को स्पष्ट रखते हुए सहज हिन्दी देती है।
- source_word: אֲשֶׁר תִּתְּנוּ לַיהוָה
  choice: ये सब तुम याहवे को दोगे
  rationale: संबंधवाचक उपवाक्य को हिन्दी में स्पष्ट समाहार-वाक्य बनाया गया है, ताकि वह सूची की सभी भेंटों से स्वाभाविक रूप से जुड़े; נתן का सामान्य अर्थ ‘देना’ बनाए रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक दिव्य नाम को उपाधि से बदलने के बजाय लिप्यंतरित रूप ‘याहवे’ में रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम आया है; ‘याहवे’ उस नाम को प्रत्यक्ष रूप से सुरक्षित रखता है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: נֶדֶר का आशय
  choice: मन्नत
  alternative: मन्नत की भेंट
  rationale: शब्द स्वयं मन्नत अथवा मन्नत के अनुसार अर्पित वस्तु को सूचित कर सकता है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी संदर्भगत संभावना बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और उपासना-संदर्भ के अनुरूप गरिमापूर्ण रखी गई है। हिब्रानी सूची की पुनरावृत्ति सुरक्षित है, जबकि अंतिम संबंधवाचक वाक्य को स्वाभाविक हिन्दी के लिए समाहार-वाक्य के रूप में रखा गया है।
