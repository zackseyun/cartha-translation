  text: And he shall wave the sheaf before Yahweh for your acceptance[a]; on the day after the Sabbath the priest shall wave it.
translation:
  language: hi
  text: और वह अनाज के उस पूले को याहवे के सामने लहराए, ताकि तुम स्वीकार किए जाओ[a]। सब्त के अगले दिन याजक उसे लहराए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी स्वीकृति के लिए।” इब्रानी पद भेंट के द्वारा उपासकों के याहवे के सामने स्वीकार किए जाने का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנִיף
  choice: और वह ... लहराए
  rationale: हिफ़ील रूप यहाँ भेंट को विधिपूर्वक हिलाने या लहराकर प्रस्तुत करने की क्रिया बताता है। ‘लहराए’ अनुष्ठानिक क्रिया को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: הָעֹמֶר
  choice: उस पूले को
  rationale: इस प्रसंग में עֹמֶר केवल माप नहीं, कटे हुए अनाज का वह पूला है जिसे प्रथम उपज के रूप में लाया जाता है। निकट प्रसंग के कारण निश्चितता दिखाने के लिए ‘उस’ रखा गया है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: यह परमेश्वर की उपस्थिति में अनुष्ठानिक प्रस्तुति का सामान्य इब्रानी मुहावरा है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: לִרְצֹנְכֶם
  choice: तुम्हारी स्वीकृति के लिए
  rationale: यह संक्षिप्त पद भेंट की स्वीकार्यता और उसके द्वारा उपासकों के स्वीकार किए जाने—दोनों निकट अर्थों के बीच इब्रानी की अर्थगत गुंजाइश बनाए रखता है; वैकल्पिक स्पष्टता पादटिप्पणी में दी गई है।
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: सब्त के अगले दिन
  rationale: यह विशिष्ट रूप से सब्त के बाद आने वाले दिन को बताता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְנִיפֶנּוּ
  choice: उसे लहराए
  rationale: क्रिया पहले प्रयुक्त अनुष्ठानिक क्रिया को दोहराती है और प्रत्यय का संकेत पूले की ओर है; ‘उसे’ उस संदर्भ को स्पष्ट करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: इस्राएली उपासना-विधान में כֹּהֵן का मानक और सुबोध हिन्दी रूप।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ नाम को उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: बलिदानी प्रसंग में לִרְצֹנְכֶם का आशय
  choice: तुम्हारी स्वीकृति के लिए
  alternative: ताकि तुम स्वीकार किए जाओ; ताकि वह तुम्हारी ओर से स्वीकार हो
  rationale: इब्रानी पद भेंट की स्वीकार्यता और उसके माध्यम से उपासकों के स्वीकार किए जाने का संबंध व्यक्त कर सकता है। मुख्य पाठ संक्षिप्तता और तनाव बनाए रखता है, जबकि पादटिप्पणी संभावित व्यक्तिगत अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘पूला’, ‘सब्त’ और ‘याजक’ जैसे प्रचलित बाइबलीय शब्द अनुष्ठानिक संदर्भ को स्पष्ट रखते हैं; वाक्य-विन्यास मूल की पुनरुक्ति को बनाए रखता है।
