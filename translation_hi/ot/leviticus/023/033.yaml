  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम YHWH है। हिन्दी पाठकों के लिए ‘यहोवा’ सुस्थापित रूप है; वैकल्पिक उच्चारण ‘याहवे’ पादटिप्पणी में दिया गया है, क्योंकि प्राचीन उच्चारण पूर्णतः निश्चित नहीं है।
