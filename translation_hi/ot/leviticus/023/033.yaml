- source_word: וַיְדַבֵּר
  choice: तब … ने … कहा
  rationale: वाव-क्रमिक रूप कथा में अगले वचन-प्रसंग का आरम्भ करता है। हिन्दी में ‘तब … कहा’ इस सूत्र को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: יְהוָה
