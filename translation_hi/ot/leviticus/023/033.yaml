  rationale: यह परमेश्वर के व्यक्तिगत नाम के चार इब्रानी व्यंजनों (YHWH) का हिन्दी में प्रचलित लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: इब्रानी में भाषण के संबोधित व्यक्ति को चिह्नित करता है; आधुनिक हिन्दी में ‘मूसा से कहा’ स्वाभाविक प्रयोग है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह अगले कथन का परिचय देने वाला पारंपरिक इब्रानी सूत्र है। अलग से ‘यह कहते हुए’ जोड़ना हिन्दी में अनावश्यक पुनरुक्ति होगी; ‘कहा’ उसका कार्य सहज रूप से निभाता है।
