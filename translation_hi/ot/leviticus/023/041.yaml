id: LEV.23.41
reference: Leviticus 23:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/חַגֹּתֶ֤ם אֹת/וֹ֙ חַ֣ג לַֽ/יהוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּ/שָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/041.yaml
  text: You shall celebrate it as a feast to Yahweh for seven days in the year[a]. It is a permanent statute throughout your generations[b]; in the seventh month you shall celebrate it.
translation:
  language: hi
  text: तुम इसे हर वर्ष सात दिन तक याहवे के लिए पर्व के रूप में मनाओ। यह तुम्हारी पीढ़ियों के लिए स्थायी विधि है। सातवें महीने में इसे मनाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחַגֹּתֶם / תָּחֹגּוּ
  choice: मनाना
  rationale: חָגַג का अर्थ किसी पर्व को मनाना या उसका पालन करना है। आधुनिक हिन्दी में ‘मनाना’ स्वाभाविक है और दोनों occurrences में क्रिया की पुनरावृत्ति बनाए रखता है।
- source_word: אֹתוֹ
  choice: इसे
  rationale: सर्वनाम प्रसंग में पहले बताए गए पर्व की ओर संकेत करता है; ‘इसे’ बिना अनावश्यक विस्तार के उस संदर्भ को व्यक्त करता है।
- source_word: חַג
  choice: पर्व
  rationale: חַג धार्मिक उत्सव, विशेषतः तीर्थ-पर्व, को दर्शाता है। ‘पर्व’ हिन्दी में स्पष्ट, गरिमापूर्ण और इस विधिक-उपासना संबंधी प्रसंग के अनुकूल है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל समर्पण या सम्मान के लिए किए जाने का भाव देता है। ‘यहोवा के लिए’ सहज हिन्दी में इसे व्यक्त करता है; יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह पर्व की अवधि बताता है; ‘तक’ हिन्दी में सात दिनों की अवधि स्वाभाविक रूप से प्रकट करता है।
- source_word: בַּשָּׁנָה
  choice: हर वर्ष
  rationale: शाब्दिक रूप ‘वर्ष में’ है, पर प्रसंग वार्षिक आयोजन का है। ‘हर वर्ष’ आधुनिक हिन्दी में अपेक्षित आवृत्ति को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חֻקַּת עוֹלָם
  choice: सदा की विधि
  rationale: חֻקָּה निर्धारित विधान है और עוֹלָם दीर्घकालीन अथवा स्थायी वैधता बताता है। ‘सदा की विधि’ स्रोत की प्रबल निरंतरता को बनाए रखती है, बिना दार्शनिक रूप से निरपेक्ष कालातीतता तय किए।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-पीढ़ी के लिए
  rationale: यह मुहावरा आने वाली क्रमिक पीढ़ियों पर निरंतर लागू होने का भाव देता है। ‘पीढ़ी-पीढ़ी के लिए’ सहज और प्रचलित हिन्दी है।
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: सातवें महीने में
  rationale: यह पर्व मनाने का समय बताने वाला सीधा कालवाचक पदबंध है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम יהוה का प्रयोग करता है। हिन्दी के सामान्य पाठकों के लिए स्थापित और पहचाना हुआ रूप ‘यहोवा’ अपनाया गया है, न कि उपाधि ‘प्रभु’।
- issue: उपासना-विधि में עוֹלָם की अवधि
  choice: सदा की विधि
  alternative: स्थायी विधि
  rationale: עוֹלָם विधान की निरंतर और पीढ़ीगत बाध्यता पर बल देता है। ‘सदा की’ इस प्रबलता को सुरक्षित रखता है, जबकि संदर्भ स्वयं उसके वाचागत दायरे को निर्धारित करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है; आज्ञार्थक भविष्यसूचक इब्रानी रूप को गरिमापूर्ण विधिक निर्देश ‘मनाना’ से व्यक्त किया गया है। वाक्य-विन्यास सरल रखा गया है और मूल में क्रिया की पुनरावृत्ति भी सुरक्षित है।
