  text: You shall dwell in booths for seven days[a]; every native-born person in Israel shall dwell in booths.
translation:
  language: hi
  text: तुम सात दिन तक झोंपड़ियों[a] में रहो; इस्राएल का हर मूल निवासी झोंपड़ियों में रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अस्थायी आश्रयों”; इब्रानी शब्द पर्व के लिए बनाए गए अस्थायी निवासों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסֻּכֹּת
  choice: झोंपड़ियों में
  rationale: סֻכּוֹת से आशय पर्व के लिए बनाए गए अस्थायी आश्रयों से है। ‘झोंपड़ियाँ’ ठोस बिंब बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: תֵּשְׁבוּ / יֵשְׁבוּ
  choice: रहना / रहे
  rationale: निवास के प्रसंग में ישׁב का अर्थ बैठना नहीं, बल्कि रहना या निवास करना है। हिन्दी में ‘रहना’ इस आज्ञा को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: अवधि सूचित करने के लिए ‘तक’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
- source_word: כָּל הָאֶזְרָח
  choice: हर मूल निवासी
  rationale: אֶזְרָח समुदाय के मूल निवासी सदस्य को सूचित करता है, न कि केवल पुरुष को। ‘मूल निवासी’ बाद की राजनीतिक ‘नागरिक’ श्रेणी आरोपित किए बिना भेद को बनाए रखता है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल का
  rationale: हिन्दी में ‘इस्राएल का हर मूल निवासी’ समुदाय से संबंध को सहज रूप में व्यक्त करता है और आशयतः ‘इस्राएल में हर मूल निवासी’ के अनुरूप है।
theological_decisions:
- issue: הָאֶזְרָח के व्याकरणिक पुल्लिंग एकवचन का प्रतिनिधिक दायरा
  choice: हर मूल निवासी
  alternative: हर मूल निवासी पुरुष
  rationale: यह संज्ञा व्याकरणिक रूप से पुल्लिंग है, पर यहाँ प्रतिनिधिक और सामान्य अर्थ में प्रयुक्त है। हिन्दी में ‘हर मूल निवासी’ अनावश्यक पुरुष-सीमा जोड़े बिना स्रोत का दायरा बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और विधिक-आज्ञात्मक है। पहले खंड में ‘रहना’ सीधी आज्ञा के रूप में और दूसरे में ‘रहे’ सार्वभौमिक निर्देश के रूप में प्रयुक्त है।
