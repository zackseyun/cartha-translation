id: LEV.23.28
reference: Leviticus 23:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כָל מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י י֤וֹם כִּפֻּרִים֙ ה֔וּא לְ/כַפֵּ֣ר עֲלֵי/כֶ֔ם לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/028.yaml
  text: You shall do no work on this very day[a], for it is a Day of Atonement, to make atonement for you before Yahweh your God.
translation:
  language: hi
  text: और इसी दिन कोई भी काम मत करना, क्योंकि यह प्रायश्चित्त का दिन है, ताकि तुम्हारे परमेश्वर याहवे के सामने तुम्हारे लिए प्रायश्चित्त किया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל מְלָאכָה לֹא תַעֲשׂוּ
  choice: तुम कोई भी काम न करना
  rationale: मְלָאכָה पर्व और विश्राम-दिन संबंधी विधानों में सामान्यतः काम या श्रम को दर्शाता है। निषेधात्मक हिंदी रचना कानूनी बल को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: इस दिन
  rationale: यह इब्रानी मुहावरा उसी निश्चित दिन पर बल देता है। हिंदी में 'इस दिन' संदर्भानुसार स्पष्ट और स्वाभाविक है; अत्यधिक शाब्दिक 'इस दिन के ठीक मध्य में' अर्थ को बिगाड़ देता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי काम न करने की आज्ञा का कारण प्रस्तुत करता है।
- source_word: יוֹם כִּפֻּרִים
  choice: प्रायश्चित्त का दिन
  rationale: शाब्दिक रूप बहुवचन 'प्रायश्चित्तों का दिन' है, पर हिंदी में पर्व का सुबोध और स्थापित नाम 'प्रायश्चित्त का दिन' है; बहुवचन रूप पादटिप्पणी में सुरक्षित है।
- source_word: לְכַפֵּר עֲלֵיכֶם
  choice: तुम्हारे लिए प्रायश्चित्त किया जाए
  rationale: पिएल रूप כפר याजकीय संदर्भ में प्रायश्चित्त करने को और עַל उन लोगों को दर्शाता है जिनके लिए वह किया जाता है। कर्मवाच्य हिंदी मूल में निहित अनिर्दिष्ट कर्ता को बनाए रखती है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह उपासना-संबंधी प्रसंग में यहोवा की उपस्थिति के सम्मुख होने का बोध कराता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित नाम-रूप 'यहोवा' चतुरक्षरीय दिव्य नाम को किसी उपाधि से प्रतिस्थापित किए बिना व्यक्त करता है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर
  rationale: यहोवा के साथ वाचा-सूत्र में यह रूप एकवचन अर्थ रखता है; 'परमेश्वर' आधुनिक हिंदी बाइबलीय भाषा में स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिंदी पाठकों के लिए परिचित 'यहोवा' नाम को सुरक्षित रखता है और 'प्रभु' जैसी उपाधि से उसे नहीं बदलता।
- issue: כפר / כִּפֻּרִים का याजकीय अर्थ
  choice: प्रायश्चित्त / प्रायश्चित्त का दिन
  alternative: शुद्धिकरण / प्रायश्चित्तों का दिन
  rationale: यह पद याजकीय पर्व-विधान में है। 'प्रायश्चित्त' संस्कारगत मेल-मिलाप और दोष-निवारण के अर्थभार को बनाए रखता है, पर किसी एक उत्तरकालीन प्रायश्चित्त-सिद्धांत को आरोपित नहीं करता।
- issue: לְכַפֵּר में कर्ता की अनिर्दिष्टता
  choice: प्रायश्चित्त किया जाए
  alternative: प्रायश्चित्त करने के लिए
  rationale: मूल का क्रियार्थक रूप स्पष्ट नहीं करता कि तात्कालिक कर्ता कौन है। कर्मवाच्य हिंदी इस खुलापन को बचाती है और परमेश्वर या याजक को चुपचाप कर्ता निर्धारित नहीं करती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सर्वसाधारण के लिए सुबोध हिंदी। विधिक निषेध के लिए 'न करना' रखा गया है। 'प्रायश्चित्त' याजकीय शब्दावली का भार बनाए रखता है।
