- from: अपने निवास-स्थानों से तुम हिलाकर अर्पित करने की भेंट के लिए दो रोटियाँ लाना। वे दो-दहाई एपा[a] मैदे की हों और खमीर के साथ पकाई जाएँ[b]। वे याहवे के लिए पहले फल की भेंट हों।
  to: तुम अपने निवास-स्थानों से लहराने की भेंट के रूप में दो रोटियाँ ले आओ। वे दो-दसवाँ एपा[a] बारीक आटे की हों और खमीर डालकर पकाई जाएँ[b]। वे याहवे के लिए पहली उपज हों।
  rationale: The revision identifies the two loaves themselves as the wave offering, uses an idiomatic plural directive, improves the Hindi measure construction without deciding whether the amount is distributive, renders סֹלֶת as ‘बारीक आटा,’ and expresses בִּכּוּרִים naturally as ‘पहली उपज.’ Footnote anchors remain attached to the measure and the leavened-baking expression.
