id: LEV.23.17
reference: Leviticus 23:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/מּוֹשְׁבֹ֨תֵי/כֶ֜ם תָּבִ֣יאּוּ לֶ֣חֶם תְּנוּפָ֗ה שְׁ֚תַּיִם שְׁנֵ֣י עֶשְׂרֹנִ֔ים סֹ֣לֶת תִּהְיֶ֔ינָה חָמֵ֖ץ תֵּאָפֶ֑ינָה בִּכּוּרִ֖ים לַֽ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/017.yaml
  text: From your dwellings you shall bring two loaves of bread for a wave offering[a]; they shall be of two-tenths of an ephah of fine flour, baked with leaven[b], as firstfruits to Yahweh.
translation:
  language: hi
  text: तुम अपने निवास-स्थानों से लहराने की भेंट के रूप में दो रोटियाँ ले आओ। वे दो-दसवाँ एपा[a] बारीक आटे की हों और खमीर डालकर पकाई जाएँ[b]। वे याहवे के लिए पहली उपज हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “दो दसवें भाग” है; याजकीय माप-पद्धति में इसका अर्थ एपा के दो-दसवें भाग है।
    reason: cultural_note
  - marker: b
    text: या, “खमीरी रोटियों के रूप में पकाई जाएँ।” इब्रानी स्पष्ट रूप से बताता है कि पहली उपज की ये रोटियाँ खमीरयुक्त थीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמּוֹשְׁבֹתֵיכֶם
  choice: अपने निवास-स्थानों से
  rationale: מוֹשָׁב लोगों के रहने के स्थान या बस्ती को सूचित करता है। यह चयन स्रोत की स्थान-संबंधी छवि बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לֶחֶם תְּנוּפָה
  choice: हिलाकर अर्पित करने की भेंट के लिए ... रोटियाँ
  rationale: לֶחֶם रूप में एकवचन है, पर שְׁתַּיִם के कारण यहाँ दो रोटियाँ अभिप्रेत हैं। תְּנוּפָה वेदीय उपासना में हिलाकर प्रस्तुत की जाने वाली भेंट का तकनीकी पद है; क्रियात्मक हिन्दी इसका अनुष्ठानिक अर्थ स्पष्ट करती है।
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: दो-दहाई एपा
  rationale: इब्रानी में शाब्दिक रूप से ‘दो दहाई’ है; याजकीय माप-पद्धति में इसका अर्थ एपा के दो-दहाई भाग है। ‘एपा’ को पाठ में रखकर प्राचीन माप और उसकी संरचना दोनों सुरक्षित रहते हैं।
- source_word: סֹלֶת
  choice: मैदा
  rationale: סֹלֶת अन्नबलि में प्रयुक्त बारीक, परिष्कृत आटे को दर्शाता है। आधुनिक हिन्दी में ‘मैदा’ इसका सरल और स्वाभाविक समतुल्य है।
- source_word: חָמֵץ תֵּאָפֶינָה
  choice: खमीर के साथ पकाई जाएँ
  rationale: חָמֵץ रोटियों के खमीरी होने और תֵּאָפֶינָה उनके पकाए जाने को व्यक्त करता है। यह अनुवाद उस उल्लेखनीय बात को स्पष्ट रखता है कि पहले फल की ये रोटियाँ खमीरयुक्त थीं।
- source_word: בִּכּוּרִים
  choice: पहले फल की भेंट
  rationale: בִּכּוּרִים परमेश्वर को अर्पित उपज के आरम्भिक भाग को दर्शाता है। ‘पहले फल की भेंट’ रोटियों की अर्पण-संबंधी भूमिका को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל समर्पण या अर्पण के लक्ष्य को दर्शाता है और יהוה वाचा के ईश्वरीय नाम को। ‘याहवे के लिए’ दोनों बातों को सीधे व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला वाचा का नाम יהוה है। ‘याहवे’ नाम को नाम के रूप में बनाए रखता है, उसे उपाधि में नहीं बदलता।
- issue: अनुष्ठानिक पद תְּנוּפָה
  choice: हिलाकर अर्पित करने की भेंट
  alternative: लहराने की भेंट / उठाकर अर्पित की जाने वाली भेंट
  rationale: यह पद इस्राएल की उपासना में भेंट प्रस्तुत करने की विशिष्ट क्रिया को दर्शाता है। चयन क्रिया को स्पष्ट करता है, पर उसकी ठीक दिशा या गति के बारे में मूल से अधिक दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। विधिक निर्देश के स्वर के लिए ‘लाना’, ‘हों’ और ‘पकाई जाएँ’ का प्रयोग हुआ है। प्राचीन माप ‘एपा’ को बनाए रखकर पाद-टिप्पणी में उसका आशय स्पष्ट किया गया है।
