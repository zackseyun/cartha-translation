- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: कोई भी सामान्य काम
  rationale: नकार के साथ כָּל निषेध की व्यापकता व्यक्त करता है, जबकि מְלֶאכֶת עֲבֹדָה पर्व-संबंधी विधान में सामान्य अथवा रोज़मर्रा के श्रम को दर्शाता है, हर संभव गतिविधि को नहीं।
- source_word: לֹא תַעֲשׂוּ
  choice: न करना
  rationale: हिन्दी के विधिक-आज्ञार्थक प्रयोग में यह स्पष्ट और स्वाभाविक निषेध है।
theological_decisions:
- issue: מְלֶאכֶת עֲבֹדָה में पर्व के दिन काम का निषेध
  choice: सामान्य काम का निषेध
  alternative: बिना किसी भेद के हर प्रकार के काम का निषेध
  rationale: विशिष्ट इब्रानी पदबंध सामान्य श्रम या सेवा-संबंधी काम को सूचित करता है; इसे ‘हर प्रकार का काम’ कहना मूल की अपेक्षा निषेध को अधिक व्यापक बना देगा।
