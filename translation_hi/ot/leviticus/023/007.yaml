  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पवित्र सभा’ धार्मिक विधान का भाव बनाए रखते हुए ‘पवित्र दीक्षांत’ जैसे अप्रचलित या भ्रामक शब्दों से बचता है। निषेध के लिए ‘न करना’ सामान्य आधुनिक हिन्दी में आज्ञात्मक और विधिक दोनों स्वर देता है।
