source:
  edition: WLC
  text: וְ/כָל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר תַּעֲשֶׂה֙ כָּל מְלָאכָ֔ה בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/הַֽאֲבַדְתִּ֛י אֶת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/030.yaml
  text: And every person who does any work on this very day—I will destroy that person from among his people[a].
translation:
  language: hi
  text: और जो कोई इसी दिन किसी भी प्रकार का काम करेगा, उस व्यक्ति को मैं उसके लोगों के बीच से नष्ट कर दूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस व्यक्ति को मैं उसके लोगों के बीच से काट डालूँगा।” यहाँ प्रयुक्त इब्रानी क्रिया का अर्थ “नष्ट करना/नाश कर देना” है; यह सामान्यतः “काट डालना” के लिए प्रयुक्त क्रिया नहीं है, यद्यपि न्याय के द्वारा समुदाय से हटाए जाने का भाव निकट से संबंधित है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: व्यक्ति
  rationale: वैधानिक और वाचा-संबंधी गद्य में נֶפֶשׁ यहाँ अमूर्त ‘आत्मा’ नहीं, बल्कि एक व्यक्ति को सूचित करता है।
- source_word: תַּעֲשֶׂה כָּל מְלָאכָה
  choice: किसी प्रकार का काम करेगा
  rationale: עשה के साथ מְלָאכָה का स्वाभाविक अर्थ काम करना है; ‘किसी प्रकार का’ כָּל की व्यापकता व्यक्त करता है।
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: इस दिन ही
  rationale: यह इब्रानी मुहावरा दिन के उल्लेख पर बल देता है; आधुनिक हिन्दी में ‘इस दिन ही’ उस बल को स्पष्ट और सहज रूप से रखता है।
- source_word: וְהַאֲבַדְתִּי
  choice: मैं ... नष्ट कर दूँगा
  rationale: אבד का हिफ़ील रूप ‘नष्ट करना/नाश कर देना’ है। यह सामान्य ‘काट डालना’ वाले כרת क्रियापद से भिन्न शब्द है।
- source_word: מִקֶּרֶב עַמָּהּ
  choice: उसके लोगों के बीच से
  rationale: यह समुदाय के मध्य से न्यायपूर्वक हटाए जाने का भाव रखता है। ‘उसके’ व्यक्ति के लिंग को अनिर्धारित रखते हुए हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: וְהַאֲבַדְתִּי ... מִקֶּרֶב עַמָּהּ में दण्ड का स्वरूप
  choice: उस व्यक्ति को मैं उसके लोगों के बीच से नष्ट कर दूँगा
  alternative: उस व्यक्ति को मैं उसके लोगों के बीच से अलग कर दूँगा
  rationale: मुख्य पाठ אבד के प्रत्यक्ष अर्थ ‘नष्ट करना’ को बनाए रखता है। प्रसंग में समुदाय से हटाने का भाव संभव है, पर सामान्य तकनीकी ‘काट डालना’ वाला כרת यहाँ प्रयुक्त नहीं हुआ; इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वैधानिक प्रसंग के अनुरूप गरिमापूर्ण और स्पष्ट शैली। ‘जो कोई’ समावेशी है, और ‘उस व्यक्ति’ נֶפֶשׁ को ‘आत्मा’ समझे जाने से बचाता है।
