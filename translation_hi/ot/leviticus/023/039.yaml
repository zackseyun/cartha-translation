id: LEV.23.39
reference: Leviticus 23:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֡ךְ בַּ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בְּ/אָסְפְּ/כֶם֙ אֶת תְּבוּאַ֣ת הָ/אָ֔רֶץ תָּחֹ֥גּוּ אֶת חַג יְהוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/יּ֤וֹם הָֽ/רִאשׁוֹן֙ שַׁבָּת֔וֹן וּ/בַ/יּ֥וֹם הַ/שְּׁמִינִ֖י שַׁבָּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/039.yaml
  text: However[a], on the fifteenth day of the seventh month, when you have gathered in the produce of the land, you shall celebrate the feast of Yahweh for seven days. On the first day there shall be a solemn rest[b], and on the eighth day a solemn rest.
translation:
  language: hi
  text: परन्तु सातवें महीने के पंद्रहवें दिन, जब तुम देश की उपज इकट्ठी कर चुके होगे, तब सात दिन तक याहवे का पर्व[a] मनाना। पहले दिन विशेष विश्राम[b] होगा, और आठवें दिन भी विशेष विश्राम होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे का उत्सव।” इब्रानी शब्द उत्सवपूर्ण धार्मिक आयोजन को दर्शा सकता है, जो प्रायः तीर्थ-पर्व होता था।
    reason: lexical_alternative
  - marker: b
    text: या “सब्त-जैसा विश्राम।” इब्रानी शब्द पवित्र उपासना से जुड़े एक विशेष विश्राम-दिन को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु
  rationale: यहाँ यह अव्यय पिछली विधियों से एक संक्रमण और विशेष निर्देश की ओर संकेत करता है; ‘परन्तु’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: सातवें महीने के पंद्रहवें दिन
  rationale: इब्रानी तिथि-वाक्यांश की निश्चितता को मानक और सहज हिन्दी में सुरक्षित रखता है।
- source_word: בְּאָסְפְּכֶם
  choice: जब तुम ... इकट्ठी कर चुके होगे
  rationale: בְּ के साथ infinitive construct समयगत परिस्थिति बताता है; यह रूप पर्व मनाने से पहले उपज बटोर लिए जाने का भाव स्पष्ट करता है।
- source_word: תְּבוּאַת הָאָרֶץ
  choice: देश की उपज
  rationale: תְּבוּאָה भूमि से प्राप्त व्यापक पैदावार को दर्शाता है; ‘उपज’ इसे केवल अन्न तक सीमित नहीं करता।
- source_word: תָּחֹגּוּ אֶת חַג יְהוָה
  choice: याहवे का पर्व मनाना
  rationale: חגג धार्मिक पर्व मनाने को व्यक्त करता है और חַג उत्सव, प्रायः तीर्थ-पर्व, का बोध करा सकता है। हिन्दी आज्ञार्थक ‘मनाना’ विधिक निर्देश में स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: क्रिया ‘मनाना’ के साथ अवधि को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: שַׁבָּתוֹן
  choice: विशेष विश्राम
  rationale: यह शब्द पवित्र अवसर पर काम से विश्राम को सूचित करता है, पर इसे केवल साप्ताहिक सब्त मानना आवश्यक नहीं; ‘विशेष विश्राम’ उस भेद को बनाए रखता है।
- source_word: וּבַיּוֹם הַשְּׁמִינִי
  choice: और आठवें दिन भी
  rationale: पर्व के सात दिनों के बाद आठवें दिन के अलग विश्राम को स्पष्ट रखता है; ‘भी’ पहले दिन के समान विधान को सहजता से जोड़ता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: पर्व-विधान में שַׁבָּתוֹן का अर्थ
  choice: विशेष विश्राम
  alternative: सब्त-जैसा विश्राम; पूर्ण विश्राम
  rationale: यह पवित्र पर्व से जुड़ा काम-विराम है। ऐसा अनुवाद इसकी धार्मिक गंभीरता बनाए रखता है, पर इसे अनिवार्यतः साप्ताहिक सब्त नहीं ठहराता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, विधिक परन्तु सहज और गरिमापूर्ण रखी गई है। ‘उपज’ कृषि-उत्पादन की व्यापकता बनाए रखता है, और दोनों विश्राम-दिनों की समानता स्पष्ट करने के लिए दूसरे वाक्य में ‘भी’ जोड़ा गया है।
