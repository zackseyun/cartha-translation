source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם מוֹעֲדֵ֣י יְהוָ֔ה אֲשֶׁר תִּקְרְא֥וּ אֹתָ֖/ם מִקְרָאֵ֣י קֹ֑דֶשׁ אֵ֥לֶּה הֵ֖ם מוֹעֲדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/002.yaml
  text: 'Speak to the sons of Israel and say to them: The appointed times of Yahweh[c][b][a], which you shall proclaim as holy convocations—these are my appointed times.'
translation:
  language: hi
  text: '“इस्राएल के पुत्रों से बोल और उनसे कह: याहवे[a] के नियत समय[b], जिन्हें तुम पवित्र सभाओं[c] के रूप में घोषित करोगे—ये मेरे नियत समय हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का वाचा-नाम יהוה (YHWH) है; ‘यहोवा’ एक प्रचलित वैकल्पिक रूप है।
    reason: lexical_alternative
  - marker: b
    text: या ‘नियत पर्व’; इब्रानी शब्द निश्चित पवित्र अवसरों के लिए व्यापक रूप से प्रयुक्त हो सकता है, केवल भोज वाले पर्वों के लिए नहीं।
    reason: lexical_alternative
  - marker: c
    text: या ‘पवित्र सम्मेलन’।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: बोल
  rationale: पिएल आज्ञार्थक रूप सीधे संबोधन की आज्ञा देता है; ‘बोल’ विधिक निर्देश की संक्षिप्त और औपचारिक शैली बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: शाब्दिक पुरुषवाचक वाचा-संबंधी अभिव्यक्ति को सुरक्षित रखा गया है; यहाँ यह सामूहिक रूप से इस्राएल की प्रजा को सूचित करती है।
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: और उनसे कह
  rationale: इब्रानी की सामान्य आज्ञात्मक शृंखला और एकवचन संबोधन को स्पष्ट रूप से दर्शाता है।
- source_word: מוֹעֲדֵי / מוֹעֲדָי
  choice: नियत समय / मेरे नियत समय
  rationale: מוֹעֵד नियत अवसर या समय को सूचित करता है; अध्याय में सब्त भी सम्मिलित होने के कारण ‘पर्व’ की अपेक्षा यह व्यापक और अधिक सटीक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: אֲשֶׁר תִּקְרְאוּ אֹתָם
  choice: जिन्हें तुम ... घोषित करोगे
  rationale: קרא यहाँ सार्वजनिक घोषणा या निर्धारण का भाव देता है; बहुवचन ‘तुम’ समुदाय को संबोधित करता है।
- source_word: מִקְרָאֵי קֹדֶשׁ
  choice: पवित्र सभाओं
  rationale: यह औपचारिक रूप से बुलाई गई पवित्र सामुदायिक सभाओं को दर्शाता है; स्वाभाविक आधुनिक हिन्दी में आह्वान और पवित्रता का मुख्य भाव संप्रेषित होता है।
- source_word: אֵלֶּה הֵם
  choice: ये ... हैं
  rationale: प्रदर्शक सर्वनाम और सर्वनामयुक्त विधेय की बलाघातपूर्ण पहचान को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: यְהוָה वाचा-नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत दिव्य नाम को केवल उपाधि ‘प्रभु’ से नहीं बदला गया; ‘यहोवा’ साधारण हिन्दी पाठकों के लिए स्थापित देवनागरी रूप है, जबकि उच्चारण-विकल्प पादटिप्पणी में दिया गया है।
- issue: מוֹעֲדֵי को पर्वों तक सीमित करना
  choice: नियत समय
  alternative: नियत पर्व; त्योहार
  rationale: यह पद और अध्याय पवित्र अवसरों की व्यापक श्रेणी प्रस्तुत करते हैं, जिसमें सब्त भी आता है; इसलिए उत्सव-विशेष अर्थ नहीं थोपा गया।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक पुरुषवाचक रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों; इस्राएल की सन्तान
  rationale: मूल का पुरुषवाचक वाचा-संबंधी रूप बनाए रखा गया है, यद्यपि संदर्भ में यह इस्राएल की प्रजा के लिए सामूहिक अभिव्यक्ति है।
- issue: मִקְרָאֵי קֹדֶשׁ में सभा और आह्वान का संबंध
  choice: पवित्र सभाओं के रूप में
  alternative: पवित्र बुलावे; पवित्र महासभाएँ
  rationale: अभिव्यक्ति को उन पवित्र सभाओं के रूप में समझा गया है जिनकी सार्वजनिक घोषणा की जाती है; इससे अवसर और सभा की पहचान बनी रहती है, बिना किसी विशिष्ट धार्मिक परंपरा की तकनीकी शब्दावली थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण विधिक-धार्मिक शैली अपनाई गई है। मूसा को दिए गए एकवचन आदेश के लिए ‘बोल/कह’ और समुदाय के बहुवचन संबोधन के लिए ‘तुम ... करोगे’ रखा गया है। स्रोत का क्रम और अंतिम बलाघात—‘ये मेरे नियत समय हैं’—सुरक्षित हैं।
