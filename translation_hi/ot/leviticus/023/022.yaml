revisions:
- from: जब तुम अपने देश की उपज काटो, तब अपने खेत के किनारे[a] को पूरी तरह न काटना और अपनी कटनी की गिरी हुई बालियाँ न बटोरना। उन्हें गरीब और तुम्हारे बीच रहनेवाले परदेशी[b] के लिए छोड़ देना। मैं याहवे, तुम्हारा परमेश्वर हूँ।
  to: जब तुम अपनी भूमि की फसल काटो, तब अपने खेत के किनारे तक पूरी कटाई न करना और अपनी कटनी में छूटा हुआ अन्न न बटोरना। इन्हें गरीबों और तुम्हारे बीच रहनेवाले परदेशियों के लिए छोड़ देना। मैं याहवे, तुम्हारा परमेश्वर हूँ।
  rationale: 'The revision corrects the overly specific rendering of לֶקֶט and improves the idiomatic expression of the field-edge prohibition. It retains the original scope of the command: the unharvested edge and harvest remnants are to be left, rather than directly distributed, for economically vulnerable people and resident foreigners. Footnote markers remain anchored after “किनारे” and “परदेशियों,” respectively.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:17:48Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the temporal legal instruction, the prohibition on harvesting the field''s extremity, the prohibition on collecting leqet, the designated beneficiaries, and the covenant formula. However, “गिरी हुई बालियाँ” is narrower than לֶקֶט: it limits the term to fallen ears of grain, whereas the Hebrew denotes gleanings/harvest remnants more broadly. A less restrictive rendering is needed.'
  naturalness: The legal register is clear and modern. “अपनी भूमि की फसल” and “खेत के किनारे तक पूरी कटाई” are slightly more idiomatic and make the agricultural instruction clearer than treating the field-edge itself as the direct object of काटना. Plural collective nouns for the beneficiaries are natural Hindi.
  terminology: “याहवे” appropriately represents יהוה, and “परदेशी” is suitable for גֵּר when supported by a clarifying footnote. “कटनी में छूटा हुआ अन्न” avoids over-specifying the gleanings as ears of grain while retaining the agricultural sense.
  issues:
  - severity: medium
    issue: “गिरी हुई बालियाँ” renders לֶקֶט too narrowly.
    rationale: לֶקֶט refers to gleanings or scattered harvest remnants, not exclusively ears that have fallen. “बालियाँ” also constrains the wording to a particular crop-form. “कटनी में छूटा हुआ अन्न” is broader and remains clear in contemporary Hindi.
  - severity: low
    issue: The wording for the field's edge is somewhat awkward.
    rationale: “खेत के किनारे को पूरी तरह न काटना” is intelligible, but “खेत के किनारे तक पूरी कटाई न करना” more naturally expresses the prohibition against reaping to the extremity.
  revised_text: जब तुम अपनी भूमि की फसल काटो, तब अपने खेत के किनारे तक पूरी कटाई न करना और अपनी कटनी में छूटा हुआ अन्न न बटोरना। इन्हें गरीबों और तुम्हारे बीच रहनेवाले परदेशियों के लिए छोड़ देना। मैं याहवे, तुम्हारा परमेश्वर हूँ।
  revised_footnotes:
  - marker: a
    text: या “कोने।” इब्रानी शब्द का अर्थ खेत का किनारा, पार्श्व या कोना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ऐसा गैर-इस्राएली व्यक्ति जो इस्राएलियों के बीच रह रहा हो और उनकी सामाजिक व्यवस्था के संरक्षण में हो।
    reason: lexical_clarification
  revision_rationale: 'The revision corrects the overly specific rendering of לֶקֶט and improves the idiomatic expression of the field-edge prohibition. It retains the original scope of the command: the unharvested edge and harvest remnants are to be left, rather than directly distributed, for economically vulnerable people and resident foreigners. Footnote markers remain anchored after “किनारे” and “परदेशियों,” respectively.'
