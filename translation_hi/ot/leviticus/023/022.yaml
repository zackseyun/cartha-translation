id: LEV.23.22
reference: Leviticus 23:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּֽ/בְ/קֻצְרְ/כֶ֞ם אֶת קְצִ֣יר אַרְצְ/כֶ֗ם לֹֽא תְכַלֶּ֞ה פְּאַ֤ת שָֽׂדְ/ךָ֙ בְּ/קֻצְרֶ֔/ךָ וְ/לֶ֥קֶט קְצִירְ/ךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽ/עָנִ֤י וְ/לַ/גֵּר֙ תַּעֲזֹ֣ב אֹתָ֔/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/022.yaml
  text: And when you reap the harvest of your land[a], you shall not completely reap the edge of your field, and you shall not gather the gleanings of your harvest; you shall leave them for the poor and for the sojourner[b]. I am Yahweh your God.
translation:
  language: hi
  text: जब तुम अपनी भूमि की फसल काटो, तब अपने खेत के किनारे तक पूरी कटाई न करना और अपनी कटनी में छूटा हुआ अन्न न बटोरना। इन्हें गरीबों और तुम्हारे बीच रहनेवाले परदेशियों के लिए छोड़ देना। मैं याहवे, तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְקֻצְרְכֶם אֶת קְצִיר אַרְצְכֶם
  choice: जब तुम अपने देश की उपज काटो
  rationale: इन्फिनिटिव कंस्ट्रक्ट का कालवाचक अर्थ स्वाभाविक हिन्दी में ‘जब...काटो’ से व्यक्त होता है; ‘उपज’ कृषि-संदर्भ में קְצִיר के अर्थ को सहज रूप से बताती है।
- source_word: לֹא תְכַלֶּה פְּאַת שָׂדְךָ
  choice: अपने खेत के किनारे को पूरी तरह न काटना
  rationale: Piel תְכַלֶּה का आशय कटाई को अंतिम सीमा तक पूरा करने से है। פֵּאָה की स्थानगत व्यापकता को ‘किनारा’ बनाए रखता है।
- source_word: וְלֶקֶט קְצִירְךָ לֹא תְלַקֵּט
  choice: अपनी कटनी की गिरी हुई बालियाँ न बटोरना
  rationale: לֶקֶט कटाई के समय गिरे हुए उस अंश को दर्शाता है जिसे बाद में बटोरा जा सकता है। हिन्दी कृषि-संदर्भ में ‘गिरी हुई बालियाँ’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: לֶעָנִי
  choice: गरीब के लिए
  rationale: עָנִי यहाँ आर्थिक रूप से अभावग्रस्त व्यक्ति को सूचित करता है; ‘गरीब’ सीधा और स्वाभाविक हिन्दी शब्द है।
- source_word: וְלַגֵּר
  choice: तुम्हारे बीच रहनेवाले परदेशी के लिए
  rationale: גֵּר केवल आगंतुक अजनबी नहीं, बल्कि इस्राएल के बीच रहनेवाला गैर-स्थानीय निवासी है। यह वाक्यांश उसके निवास और परदेशीपन दोनों को स्पष्ट करता है।
- source_word: תַּעֲזֹב אֹתָם
  choice: उन्हें ... के लिए छोड़ देना
  rationale: עָזַב यहाँ जानबूझकर पीछे छोड़ने के अर्थ में है, न कि भावनात्मक रूप से त्यागने के अर्थ में।
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: मैं याहवे, तुम्हारा परमेश्वर हूँ
  rationale: व्यक्तिगत वाचा-नाम יהוה को लिप्यंतरित ‘याहवे’ से तथा אֱלֹהִים को प्रचलित और गरिमापूर्ण ‘परमेश्वर’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसका आधुनिक विद्वतापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: इस्राएली व्यवस्था में גֵּר की सामाजिक पहचान
  choice: तुम्हारे बीच रहनेवाला परदेशी
  alternative: प्रवासी / अजनबी
  rationale: यह पद देशज इस्राएली न होते हुए समुदाय में बसे व्यक्ति को दर्शाता है। चुना हुआ पदबंध आधुनिक कानूनी श्रेणियाँ थोपे बिना निवास और बाहरी मूल दोनों को बनाए रखता है।
- issue: कानून का लाभार्थी और खेत-मालिक की जिम्मेदारी
  choice: गिरी हुई बालियाँ गरीब और परदेशी के लिए छोड़ना
  alternative: उन्हें काटकर गरीब और परदेशी को देना
  rationale: मूल आज्ञा मालिक को अवशेष न बटोरने और उन्हें वहीं छोड़ने को कहती है; वह प्रत्यक्ष वितरण का आदेश नहीं देती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण विधिक-कथन रखा गया है। एकवचन खेत-मालिक के लिए सामान्य बोलचाल का ‘तुम’ और सामूहिक संबोधन में ‘तुम्हारा’ हिन्दी में सहज रूप से प्रयुक्त हैं। ‘गिरी हुई बालियाँ’ तकनीकी कृषि-शब्दावली की अपेक्षा सामान्य पाठक को לֶקֶט का आशय अधिक स्पष्ट करती है।
