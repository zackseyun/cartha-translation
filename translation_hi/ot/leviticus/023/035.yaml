- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: कोई नियमित काम-काज
  rationale: यह पद उत्सव के दिन निषिद्ध सामान्य पेशागत अथवा सेवामूलक श्रम को सूचित करता है, न कि अनिवार्य रूप से हर प्रकार की गतिविधि को। ‘नियमित काम-काज’ आधुनिक हिन्दी में इस भेद को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֹא תַעֲשׂוּ
  choice: न करना
  rationale: द्वितीय पुरुष बहुवचन का यह निषेध कानूनी निर्देश है। हिन्दी में ‘न करना’ समुदाय को दिए गए दृढ़ आदेश को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
