id: LEV.23.5
reference: Leviticus 23:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בְּ/אַרְבָּעָ֥ה עָשָׂ֛ר לַ/חֹ֖דֶשׁ בֵּ֣ין הָ/עַרְבָּ֑יִם פֶּ֖סַח לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/005.yaml
  text: In the first month[a], on the fourteenth day of the month, at twilight[b], is the Passover to Yahweh.
translation:
  language: hi
  text: पहले महीने में, महीने के चौदहवें दिन, गोधूलि के समय[a], याहवे के लिए फ़सह[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “दो संध्याओं के बीच”; यह इब्रानी मुहावरा सूर्यास्त के आसपास की गोधूलि को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: अथवा “फ़सह की भेंट” या “फ़सह का बलिदान।”
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: पहले महीने में
  rationale: यह वाक्यांश उपासना-वर्ष के पहले महीने को बताता है; पंचांग के इस संदर्भ में חֹדֶשׁ का स्वाभाविक अर्थ ‘महीना’ है।
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ
  choice: महीने के चौदहवें दिन
  rationale: इब्रानी में महीने की तारीख बताने का यह सामान्य ढंग है; हिन्दी में स्पष्टता और स्वाभाविकता के लिए ‘दिन’ जोड़ा गया है।
- source_word: בֵּין הָעַרְבָּיִם
  choice: गोधूलि के समय
  rationale: शाब्दिक अर्थ ‘दो संध्याओं के बीच’ है और यह सूर्यास्त के आसपास के धुँधलके का द्योतक है। मुख्य पाठ में सहज हिन्दी रखी गई है और शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- source_word: פֶּסַח
  choice: फ़सह
  rationale: यह प्रचलित हिन्दी बाइबलीय नाम पर्व/अनुष्ठान के व्यापक अर्थ को बनाए रखता है; बलि या बलि-पशु का संभावित अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל समर्पण या संबंध व्यक्त करता है। ‘याहवे के लिए’ इब्रानी संरचना को निकटता से रखता है और दिव्य नाम को नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम सीधे प्रयुक्त है; ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है।
- issue: उपासना-संदर्भ में פֶּסַח का अर्थ
  choice: फ़सह
  alternative: फ़सह की भेंट / फ़सह का बलिदान
  rationale: यह शब्द पर्व, अनुष्ठान अथवा बलि को सूचित कर सकता है। मुख्य पाठ में व्यापक पद रखकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया; बलिदानी अर्थ पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। मूल की पंचांगीय पुनरुक्ति (‘पहले महीने में, महीने के चौदहवें दिन’) तथा פֶּסַח की अर्थगत व्यापकता को बनाए रखा गया है। सभी पाद-टिप्पणी चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
