  yaml_path: translation/ot/leviticus/023/031.yaml
  text: You shall do no work[b][a]. It is a permanent statute throughout your generations in all your dwelling places.
translation:
  language: hi
  text: तुम कोई भी काम न करना। यह तुम्हारी पीढ़ियों के लिए तुम्हारे सभी निवास-स्थानों[b] में स्थायी विधि[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सदा की विधि’ अथवा ‘सदा तक रहने वाली विधि।’ इब्रानी עוֹלָם निरंतर, दीर्घस्थायी या चिरस्थायी अवधि का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तुम्हारी सभी बस्तियों में’ अथवा ‘जहाँ कहीं तुम रहते हो।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מְלָאכָה
  choice: कोई भी काम
  rationale: מְלָאכָה सामान्यतः काम या श्रम को दर्शाता है; निषेध के साथ כָּל की व्यापकता को स्वाभाविक हिन्दी में ‘कोई भी काम’ व्यक्त करता है।
- source_word: לֹא תַעֲשׂוּ
  choice: न करना
  rationale: विधिक प्रसंग में यह द्वितीय पुरुष बहुवचन निषेधात्मक आदेश है। ‘न करना’ स्पष्ट, गरिमापूर्ण और वर्तमान हिन्दी में स्वाभाविक है।
- source_word: חֻקַּת עוֹלָם
  choice: स्थायी विधि
  rationale: חֻקָּה निर्धारित विधि या विधान है, और עוֹלָם दीर्घस्थायी अथवा निरंतर अवधि का बोध करा सकता है। ‘स्थायी विधि’ कानूनी बल बनाए रखते हुए अवधि को अनावश्यक रूप से दार्शनिक निरपेक्षता नहीं देता।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी सभी पीढ़ियों के लिए
  rationale: यह वाक्यांश आने वाली पीढ़ियों में निरंतर लागू रहने को दर्शाता है; चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּכֹל מֹשְׁבֹתֵיכֶם
  choice: तुम्हारे सभी निवास-स्थानों में
  rationale: מוֹשָׁב रहने की जगह या बस्ती को दर्शाता है। ‘निवास-स्थानों’ मूल के स्थानवाचक और व्यापक अर्थ को बनाए रखता है।
theological_decisions:
- issue: उपासना-संबंधी व्यवस्था में अवधि का अर्थ
  choice: स्थायी विधि
  alternative: सदा की विधि / सदा तक रहने वाली विधि
  rationale: עֹולָם निरंतर या दीर्घस्थायी वैधता व्यक्त कर सकता है। ‘स्थायी’ व्यवस्था की गंभीरता को बनाए रखता है, पर मूल से आगे बढ़कर पूर्ण दार्शनिक कालातीतता निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और विधिक है। सामूहिक निषेध की व्यापकता ‘कोई भी काम’ से व्यक्त की गई है; अवधि और निवास-स्थान से जुड़ी वास्तविक शब्दार्थगत संभावनाएँ पादटिप्पणियों में सुरक्षित रखी गई हैं।
