id: LEV.23.16
reference: Leviticus 23:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַ֣ד מִֽ/מָּחֳרַ֤ת הַ/שַּׁבָּת֙ הַ/שְּׁבִיעִ֔ת תִּסְפְּר֖וּ חֲמִשִּׁ֣ים י֑וֹם וְ/הִקְרַבְתֶּ֛ם מִנְחָ֥ה חֲדָשָׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/016.yaml
  text: You shall count fifty days[a], up to the day after the seventh Sabbath; then you shall present a new grain offering to Yahweh.
translation:
  language: hi
  text: सातवें विश्राम-दिन के अगले दिन तक पचास दिन गिनो[a]। तब यहोवा के लिए अन्न की नई भेंट चढ़ाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सातवें सप्ताह के अगले दिन तक।” इब्रानी में शाब्दिक रूप से “सातवें विश्राम-दिन के अगले दिन” है; पर्व की इस गिनती को कैलेंडर के अनुसार कैसे व्यक्त किया जाए, इस पर व्याख्याकारों में मतभेद है।
    reason: वैकल्पिक कैलेंडर-संबंधी अर्थ और मूल इब्रानी की अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: עַד מִמָּחֳרַת
  choice: के अगले दिन तक
  rationale: यह पदबंध गिनती की समय-सीमा बताता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: הַשַּׁבָּת הַשְּׁבִיעִת
  choice: सातवें विश्राम-दिन
  rationale: इब्रानी में सामान्य 'सप्ताह' नहीं, बल्कि शब्बात का शब्द है; 'विश्राम-दिन' मूल अर्थ और कैलेंडर-संबंधी अस्पष्टता को बनाए रखता है।
- source_word: תִּסְפְּרוּ חֲמִשִּׁים יוֹם
  choice: तुम पचास दिन गिनना
  rationale: विधिक निर्देश को साधारण आधुनिक हिन्दी में सीधे रूप से व्यक्त करता है।
- source_word: וְהִקְרַבְתֶּם
  choice: तब तुम ... चढ़ाना
  rationale: बलिदान-संदर्भ में क्रिया का अर्थ भेंट को प्रस्तुत या अर्पित करना है; 'तब' निर्देशों का क्रम स्पष्ट करता है।
- source_word: מִנְחָה חֲדָשָׁה
  choice: नया अन्नबलि
  rationale: लैव्यव्यवस्था में מִנְחָה अनाज से अर्पित बलि के लिए पारिभाषिक शब्द है; חֲדָשָׁה का सीधा अर्थ 'नया' है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: पूर्वसर्ग ל अर्पण के प्राप्तकर्ता को दर्शाता है; हिन्दी बाइबल-परंपरा में परिचित रूप 'यहोवा' यहाँ व्यक्तिगत दिव्य नाम को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। 'यहोवा' आधुनिक हिन्दी बाइबल पाठकों में व्यापक रूप से पहचाना जाता है और इसे उपाधि 'प्रभु' से नहीं बदलता।
- issue: הַשַּׁבָּת הַשְּׁבִיעִת को कैलेंडर-संबंधी रूप में व्यक्त करना
  choice: सातवें विश्राम-दिन
  alternative: सातवें सप्ताह
  rationale: मूल में שַׁבָּת है, सामान्य 'सप्ताह' का शब्द नहीं। मुख्य पाठ मूल शब्दावली को रखता है और वैकल्पिक कैलेंडर-समझ को टिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। 'गिनना' और 'चढ़ाना' विधिक आज्ञा के सहज हिन्दी रूप हैं; 'अन्नबलि' लैव्यव्यवस्था की बलिदान-संबंधी शब्दावली को संक्षेप में व्यक्त करता है।
