reference: Leviticus 23:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֡ךְ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֩ הַ/שְּׁבִיעִ֨י הַ/זֶּ֜ה י֧וֹם הַ/כִּפֻּרִ֣ים ה֗וּא מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם וְ/הִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/027.yaml
  text: But on the tenth day of this seventh month[a], it is the Day of Atonement. It shall be a holy convocation for you[c][b], and you shall afflict yourselves and present a food offering to Yahweh.
translation:
  language: hi
  text: किन्तु इसी सातवें महीने के दसवें दिन प्रायश्चित्त का दिन[a] है। तुम्हारे लिए पवित्र सभा होगी। तुम अपने आपको दुःख दोगे[b] और यहोवा को अग्नि-भेंट[c] चढ़ाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से ‘प्रायश्चित्तों का दिन’ है।
    reason: मूल भाषा के बहुवचन रूप को सुरक्षित रखना।
  - marker: b
    text: या, ‘अपने आपको दीन करना’ अथवा ‘अपने आपको वंचित रखना।’
    reason: हिब्रू मुहावरे की सम्भव अर्थ-छटाएँ बताना और इसे केवल उपवास तक सीमित न करना।
  - marker: c
    text: या, ‘भोजन-भेंट’; परम्परागत अनुवाद ‘अग्नि के द्वारा चढ़ाई गई भेंट’ है।
    reason: बलिदानी पद אִשֶּׁה के प्रमुख अनुवाद-विकल्प बताना।
lexical_decisions:
- source_word: אַךְ
  choice: किन्तु
  rationale: यह अव्यय पिछले पर्व के निर्देशों से अलग एक बलयुक्त अथवा सीमाबोधक परिवर्तन लाता है; ‘किन्तु’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הַשְּׁבִיעִי הַזֶּה
  choice: इसी सातवें महीने के दसवें दिन
  rationale: हिब्रू कालवाचक पदबंध में निहित ‘दिन’ को हिन्दी में स्पष्ट किया गया है और הַזֶּה के संकेतात्मक बल को ‘इसी’ से रखा गया है।
- source_word: יוֹם הַכִּפֻּרִים
  choice: प्रायश्चित्त का दिन
  rationale: यह हिन्दी में पर्व का स्वाभाविक और परिचित नाम है। हिब्रू כִּפֻּרִים का रूप बहुवचन है, जिसे पाठक के लिए पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מִקְרָא קֹדֶשׁ
  choice: पवित्र सभा
  rationale: यह विधिवत बुलाई गई उपासना-सभा का तकनीकी भाव स्वाभाविक और समझने योग्य हिन्दी में व्यक्त करता है।
- source_word: וְעִנִּיתֶם אֶת נַפְשֹׁתֵיכֶם
  choice: तुम अपने आपको दुःख देना
  rationale: यह हिब्रू मुहावरे की कठोरता और व्यापकता को बनाए रखता है तथा अर्थ को केवल उपवास या केवल भीतरी नम्रता तक सीमित नहीं करता।
- source_word: אִשֶּׁה
  choice: अग्नि-भेंट
  rationale: याजकीय संदर्भ में यह अग्नि पर चढ़ाई जाने वाली भेंट को सूचित करता है। संक्षिप्त हिन्दी पद परंपरागत अर्थ को बनाए रखता है, जबकि वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से स्पष्ट रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: पर्व के नाम में हिब्रू बहुवचन כִּפֻּרִים
  choice: मुख्य पाठ में ‘प्रायश्चित्त का दिन’
  alternative: ‘प्रायश्चित्तों का दिन’
  rationale: बहुवचन रूप वास्तविक है, पर हिन्दी में शाब्दिक बहुवचन अस्वाभाविक और संभावित रूप से भ्रामक है। परिचित पर्व-नाम मुख्य पाठ में रखा गया और मूल रूप पादटिप्पणी में बताया गया है।
- issue: इस दिन अपने आपको दुःख देने का अर्थ
  choice: ‘अपने आपको दुःख देना’
  alternative: ‘अपने आपको दीन करना’ अथवा ‘अपने आपको वंचित रखना’
  rationale: आज्ञा को केवल उपवास तक सीमित नहीं किया गया और न उसे केवल मनोभाव में बदल दिया गया; हिब्रू मुहावरे की अनुष्ठानिक और पश्चात्ताप-संबंधी व्यापकता बनी रहती है।
- issue: אִשֶּׁה का बलिदानी अर्थ
  choice: ‘अग्नि-भेंट’
  alternative: ‘भोजन-भेंट’
  rationale: शब्द की व्युत्पत्ति और याजकीय प्रयोग पर चर्चा है। मुख्य पाठ में अग्नि पर चढ़ाए जाने का पारंपरिक और पाठ-समीप अर्थ रखा गया है, जबकि भोजन के रूपक वाली सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक और उपासना-संबंधी गरिमा रखी गई है। वाक्य छोटे और सार्वजनिक पाठ के अनुकूल हैं। ‘तुम ... देना/चढ़ाना’ आज्ञार्थक शैली पंचग्रन्थ के विधानात्मक स्वर को बनाए रखती है।
