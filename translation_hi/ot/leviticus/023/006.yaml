base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/006.yaml
  text: And on the fifteenth day of this month is the Feast of Unleavened Bread to Yahweh[a]; for seven days you shall eat unleavened bread.
translation:
  language: hi
  text: और इस महीने के पन्द्रहवें दिन याहवे[a] के लिए अखमीरी रोटी का पर्व है; सात दिन तक तुम अखमीरी रोटी खाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का।” इब्रानी पूर्वसर्ग समर्पण या संबंध—दोनों अर्थ व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: और इसी महीने के पन्द्रहवें दिन
  rationale: इब्रानी तिथिसूचक वाक्यांश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; וּ पिछले विधान से संबंध जोड़ता है।
- source_word: חַג הַמַּצּוֹת
  choice: अख़मीरी रोटी का पर्व
  rationale: חַג धार्मिक पर्व को और מַצּוֹת बिना ख़मीर की रोटी को दर्शाता है; यह नाम स्पष्ट और सामान्य पाठक के लिए बोधगम्य है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: यहोवा नाम चतुरक्षरीय दिव्य नाम को प्रत्यक्ष रूप से दर्शाता है; ל समर्पण अथवा संबंध व्यक्त कर सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: अवधि-सूचक पद का स्वाभाविक हिन्दी रूप, जो पूरे सात दिन की अवधि बताता है।
- source_word: מַצּוֹת תֹּאכֵלוּ
  choice: तुम अख़मीरी रोटी खाना
  rationale: इब्रानी अपूर्ण क्रिया यहाँ विधिक निर्देश देती है; हिन्दी का यह रूप आदेशात्मक बल को सहजता से बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके उसके व्यक्तिवाचक स्वरूप को सुरक्षित रखा गया है; हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है।
- issue: לַיהוָה में ל का संबंध
  choice: यहोवा के लिए
  alternative: यहोवा का
  rationale: पूर्वसर्ग समर्पण या संबंध दोनों व्यक्त कर सकता है। मुख्य पाठ में उद्देश्य/समर्पण का स्वाभाविक अर्थ रखा गया है और वास्तविक अस्पष्टता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज विधिक-धार्मिक स्तर। ‘अख़मीरी रोटी’ सामान्य पाठक के लिए संक्षिप्त और स्पष्ट है; ‘खाना’ आदेश को स्वाभाविक हिन्दी में व्यक्त करता है।
