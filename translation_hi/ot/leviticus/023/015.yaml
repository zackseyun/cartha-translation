id: LEV.23.15
reference: Leviticus 23:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/סְפַרְתֶּ֤ם לָ/כֶם֙ מִ/מָּחֳרַ֣ת הַ/שַּׁבָּ֔ת מִ/יּוֹם֙ הֲבִ֣יאֲ/כֶ֔ם אֶת עֹ֖מֶר הַ/תְּנוּפָ֑ה שֶׁ֥בַע שַׁבָּת֖וֹת תְּמִימֹ֥ת תִּהְיֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/023/015.yaml
  text: 'And you shall count for yourselves from the day after the Sabbath[a], from the day you bring the sheaf of the wave offering: seven complete Sabbaths shall there be.'
translation:
  language: hi
  text: तुम अपने लिए सब्त के अगले दिन से, अर्थात् जिस दिन तुम लहराने की भेंट का पूला लाओगे, गिनोगे; सात पूरे सब्त हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּסְפַרְתֶּם
  choice: गिनना आरम्भ करना
  rationale: विधिक संदर्भ में यह क्रिया निर्देश देती है। आरम्भ-बिंदु के साथ हिन्दी में यह प्रयोग स्वाभाविक और स्पष्ट है।
- source_word: לָכֶם
  choice: अपने लिए
  rationale: समुदाय के स्वयं गिनने की दत्तिवाचक/आत्मसंबंधी छाया को बनाए रखता है।
- source_word: מִמָּחֳרַת הַשַּׁבָּת
  choice: विश्राम-दिन के अगले दिन से
  rationale: मूल पाठ के काल-संबंध और शब्बात के पारिभाषिक अर्थ को स्पष्ट आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: מִיּוֹם הֲבִיאֲכֶם
  choice: जिस दिन तुम ... लाओगे
  rationale: गिनती के आरम्भ-बिंदु को स्वाभाविक हिन्दी उपवाक्य में व्यक्त करता है।
- source_word: עֹמֶר
  choice: पूला
  rationale: यहाँ शब्द अन्न की उस बँधी हुई राशि को दर्शाता है जिसे अनुष्ठान में चढ़ाया जाता है; ‘पूला’ आधुनिक पाठक के लिए ‘ओमेर’ से अधिक बोधगम्य है।
- source_word: הַתְּנוּפָה
  choice: हिलाई हुई भेंट
  rationale: अनुष्ठान में भेंट को हिलाकर प्रस्तुत करने की विशिष्ट क्रिया को सामान्य ‘भेंट’ में विलीन किए बिना व्यक्त करता है।
- source_word: שֶׁבַע שַׁבָּתוֹת
  choice: सात ... विश्राम-दिन
  rationale: मूल में सामान्य ‘सप्ताह’ के बजाय शब्बात वाला शब्द है; मुख्य पाठ उसे बनाए रखता है और वैकल्पिक अर्थ पादटिप्पणी में देता है।
- source_word: תְּמִימֹת
  choice: पूरे
  rationale: काल-गणना में पूर्णता का स्वाभाविक हिन्दी अर्थ देता है, न कि नैतिक सिद्धता या निर्दोषता।
- source_word: תִּהְיֶינָה
  choice: हों
  rationale: अंतिम अस्तित्वसूचक/विधिक कथन को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: पंचांग-संबंधी निर्देश में שַׁבָּת / שַׁבָּתוֹת का अर्थ
  choice: मुख्य पाठ में ‘विश्राम-दिन’ बनाए रखा गया है।
  alternative: ‘सप्ताह’ या ‘सात पूरे सप्ताह’
  rationale: इब्रानी पाठ शब्बात के शब्द का स्पष्ट प्रयोग करता है। ‘सप्ताह’ चुनने से गिनती के आरम्भ और सात अवधियों की प्रकृति से जुड़ी वास्तविक व्याख्यात्मक अस्पष्टता अनावश्यक रूप से सुलझ जाती; इसलिए विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘विश्राम-दिन’ से पारिभाषिक शब्बात-संबंधी शब्द सुरक्षित है; ‘हिलाई हुई भेंट’ अनुष्ठानिक क्रिया को स्पष्ट करता है।
