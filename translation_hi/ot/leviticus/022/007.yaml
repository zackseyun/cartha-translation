  yaml_path: translation/ot/leviticus/022/007.yaml
  text: When the sun has set, he will be clean; and afterward he may eat from the holy things, because they are his food.
translation:
  language: hi
  text: सूरज डूब जाने पर वह शुद्ध हो जाएगा। इसके बाद वह पवित्र वस्तुओं[b] में से खा सकता है, क्योंकि वह उसका भोजन है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्योंकि वह उसकी रोटी है।” यहाँ “रोटी” का अर्थ पवित्र अंशों में से उसे मिलने वाला भोजन है।
    reason: lexical_alternative
  - marker: b
    text: “पवित्र वस्तुओं” का अनुवाद “पवित्र भेंटों” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַשֶּׁמֶשׁ
  choice: सूरज डूब जाने पर
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘सूरज का आना’ है, पर यहाँ उसका आशय सूर्यास्त से है। यह रूप समय-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְטָהֵר
  choice: वह शुद्ध हो जाएगा
  rationale: यह क्रिया सूर्यास्त के बाद अनुष्ठानिक अशुद्धता समाप्त होने और शुद्ध दशा बहाल होने को बताती है; नैतिक निष्पापता इसका आशय नहीं है।
- source_word: וְאַחַר
  choice: इसके बाद
  rationale: यह नियम में अगले क्रमिक चरण को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יֹאכַל
  choice: खा सकता है
  rationale: इस विधिक संदर्भ में क्रिया शुद्ध होने के बाद खाने की अनुमति व्यक्त करती है, केवल भविष्य की घटना नहीं।
- source_word: מִן הַקֳּדָשִׁים
  choice: पवित्र वस्तुओं में से
  rationale: बहुवचन संज्ञा का पारदर्शी और अपेक्षाकृत औपचारिक अनुवाद है। संदर्भ में ये पवित्र भेंटों के याजकीय अंश हैं, पर मुख्य पाठ उस व्याख्या को अनावश्यक रूप से सीमित नहीं करता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अनुमति का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में कारण-संबंध को स्पष्ट रखता है।
- source_word: לַחְמוֹ הוּא
  choice: क्योंकि वही उसका भोजन है
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, लेकिन यहाँ व्यापक अर्थ में आहार या जीविका के लिए मिला भोजन अभिप्रेत है। एकवचन הוּא को ‘वही’ से बनाए रखा गया है और उसका संकेत सामूहिक रूप से पवित्र भोजन की ओर समझा जाता है।
theological_decisions:
- issue: शुद्धता की प्रकृति
  choice: अनुष्ठानिक शुद्धता
  alternative: नैतिक या आत्मिक शुद्धता
  rationale: लैव्यव्यवस्था 22 में विषय अशुद्ध दशा के बाद याजक का पवित्र भोजन ग्रहण करना है। ‘शुद्ध’ शब्द रखा गया है और संदर्भ को उसका अनुष्ठानिक अर्थ निर्धारित करने दिया गया है।
- issue: לַחְמוֹ הוּא में वचन और संकेत
  choice: एकवचन अभिव्यक्ति ‘वही उसका भोजन है’
  alternative: बहुवचन-सामंजस्य के अनुसार ‘वे उसका भोजन हैं’
  rationale: इब्रानी में ‘उसकी रोटी/भोजन’ और सर्वनाम दोनों एकवचन हैं। हिन्दी में ‘वही उसका भोजन है’ इस रूप को बनाए रखते हुए पवित्र अंशों को सामूहिक भोजन मानने देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शुद्ध’ और ‘पवित्र वस्तुएँ’ जैसे प्रमुख लैव्यव्यवस्थाई शब्दों को औपचारिक स्पष्टता के लिए बनाए रखा गया है।
