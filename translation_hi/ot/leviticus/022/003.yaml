base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/003.yaml
  text: 'Say to them[a], throughout your generations: Any man from any of your offspring who comes near the holy things that the sons of Israel consecrate to Yahweh while his uncleanness is on him—that person shall be cut off from before me[c][b]. I am Yahweh.'
translation:
  language: hi
  text: 'उनसे कहो: तुम्हारी पीढ़ियों तक, तुम्हारे वंशजों में से जो भी पुरुष उन पवित्र वस्तुओं के निकट आए जिन्हें इस्राएली यहोवा के लिए पवित्र ठहराते हैं, जब उसकी अशुद्धता उस पर हो, वह व्यक्ति मेरे सामने से काट दिया जाए[a]। मैं यहोवा हूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “काट दिया जाए” वाचा-संबंधी दंड का एक प्रचलित सूत्र है। यहाँ दंड का सटीक प्रकार स्पष्ट नहीं है; “मेरे सामने से” का अर्थ “मेरी उपस्थिति से” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֱמֹר אֲלֵהֶם
  choice: उनसे कहो
  rationale: एकवचन आज्ञार्थक क्रिया मूसा को संबोधित है; सरल और प्रत्यक्ष हिन्दी स्रोत की आज्ञात्मक शैली बनाए रखती है।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-पीढ़ी में
  rationale: यह विधिक-वाचागत सूत्र आने वाली सभी पीढ़ियों में निरंतर लागू होने का भाव देता है।
- source_word: כָּל אִישׁ ... מִכָּל זַרְעֲכֶם
  choice: तुम्हारे वंश का जो भी पुरुष
  rationale: संदर्भ हारून के पुरुष वंशजों का है; यह अनुवाद אִישׁ के पुल्लिंग और זֶרַע के वंशगत अर्थ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: יִקְרַב
  choice: निकट आए
  rationale: याजकीय संदर्भ में क्रिया पवित्र वस्तुओं के पास आने या उनसे संबंधित सेवा में पहुँचने का अनुष्ठानिक भाव रखती है; इसे अस्पष्ट ही रखा गया है।
- source_word: הַקֳּדָשִׁים
  choice: पवित्र वस्तुओं
  rationale: बहुवचन संज्ञा का दायरा पवित्र चढ़ावों या भेंटों तक सीमित किए बिना स्रोत की व्यापकता बनाए रखता है।
- source_word: יַקְדִּישׁוּ
  choice: पवित्र ठहराते हैं
  rationale: हिफ़ील रूप किसी वस्तु को पवित्र उपयोग के लिए अलग करने का अर्थ देता है; यह वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक 'इस्राएल के पुत्र' का जातीय आशय आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְטֻמְאָתוֹ עָלָיו
  choice: उस समय उसकी अशुद्धता उस पर हो
  rationale: सिर्फ 'वह अशुद्ध हो' कहने के बजाय स्रोत में अशुद्धता के व्यक्ति पर होने की अनुष्ठानिक अवस्था और बिंब सुरक्षित रखे गए हैं।
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: वह व्यक्ति ... काट डाला जाए
  rationale: נֶפֶשׁ यहाँ व्यक्ति को दर्शाता है और Niphal כרת प्रचलित वाचागत दंड-सूत्र है; हिन्दी अभिव्यक्ति उसके कठोर भाव को रखती है, पर दंड का निश्चित साधन नहीं बताती।
- source_word: מִלְּפָנַי
  choice: मेरे सामने से
  rationale: स्थानवाचक/उपस्थितिवाचक इब्रानी अभिव्यक्ति को निकट रूप में रखा गया है; इसका अर्थ परमेश्वर की उपस्थिति से हटाया जाना भी हो सकता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्राम को सामान्य आधुनिक हिन्दी बाइबलीय रूप 'यहोवा' से दर्शाया गया है और उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: וְנִכְרְתָה दंड-सूत्र का सटीक अर्थ
  choice: '''काट डाला जाए'' को बिना दंड की विधि निश्चित किए रखा गया'
  alternative: मार डाला जाए; समुदाय से निकाल दिया जाए; वाचा के लोगों में से हटा दिया जाए
  rationale: पद स्वयं यह निश्चित नहीं करता कि दंड दैवी मृत्यु, न्यायिक मृत्युदंड, बहिष्कार या कोई अन्य प्रकार का हटाया जाना है; इसलिए मूल का धर्मवैचारिक तनाव सुरक्षित रखा गया है।
- issue: מִלְּפָנַי का आशय
  choice: मेरे सामने से
  alternative: मेरी उपस्थिति से
  rationale: शाब्दिक स्थानवाचक भाषा और परमेश्वर की उपस्थिति संबंधी संभावित अर्थ दोनों को खुला रखने के लिए मुख्य पाठ में निकट अनुवाद चुना गया है।
- issue: ईश्वरीय नाम יְהוָה
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; इसे मुख्य पाठ में नाम के रूप में रखा गया है, यद्यपि हिन्दी में इसके लिप्यंतरण के एक से अधिक रूप प्रचलित हैं।
