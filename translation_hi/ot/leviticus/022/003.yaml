  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण विधिक शैली में रखी गई है। 'पवित्र वस्तुएँ', 'अशुद्धता उस पर हो' और 'काट डाला जाए' जैसे पद स्रोत की याजकीय शब्दावली तथा वास्तविक अस्पष्टता को सुरक्षित रखते हैं।
