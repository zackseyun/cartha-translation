source:
  edition: WLC
  text: וּ/מָע֤וּךְ וְ/כָתוּת֙ וְ/נָת֣וּק וְ/כָר֔וּת לֹ֥א תַקְרִ֖יבוּ לַֽ/יהוָ֑ה וּֽ/בְ/אַרְצְ/כֶ֖ם לֹ֥א תַעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/024.yaml
  text: You shall not present to Yahweh anything with bruised[a], crushed, torn, or cut testicles, and in your land you shall not do this.
translation:
  language: hi
  text: जिस पशु के अंडकोष दबाकर क्षतिग्रस्त किए गए हों, कुचले गए हों, उखाड़े गए हों या काटे गए हों, उसे तुम यहोवा को भेंट के लिए प्रस्तुत न करो; और अपने देश में ऐसा मत करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָעוּךְ
  choice: कुचले
  rationale: दबाव से क्षतिग्रस्त होने का भाव देता है; अगले पद से कुछ भिन्न रखते हुए शारीरिक दोष स्पष्ट करता है।
- source_word: כָתוּת
  choice: पीसे
  rationale: पीटकर या बुरी तरह चूर किए जाने का ठोस भाव व्यक्त करता है और पहले शब्द से भेद बनाए रखता है।
- source_word: נָתוּק
  choice: नोचे
  rationale: खींचकर अलग करने या फाड़ डालने की चोट को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָרוּת
  choice: काटे गए
  rationale: काट देने या अलग कर देने की दशा को सीधे व्यक्त करता है।
- source_word: תַקְרִיבוּ
  choice: भेंट के लिए प्रस्तुत न करना
  rationale: बलिदानी संदर्भ में निकट लाने अथवा अर्पण हेतु प्रस्तुत करने का व्यापक अर्थ रखता है, केवल वेदी पर जलाने तक सीमित नहीं करता।
- source_word: לַיהוָה
  choice: यहोवा के सामने
  rationale: दिव्य नाम को परियोजना की प्रचलित हिन्दी वर्तनी में रखा गया है; संबंध यहाँ अर्पण हेतु उसके सम्मुख प्रस्तुत करने का है।
- source_word: בְאַרְצְכֶם
  choice: अपने देश में
  rationale: समुदाय को मिली भूमि अथवा देश में लागू निषेध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תַעֲשׂוּ
  choice: ऐसा न करना
  rationale: इब्रानी क्रिया व्यापक और लोपयुक्त है; यह अनुवाद पूर्वोक्त अंग-विकृति करने की ओर संकेत करते हुए उसकी व्यापकता बनाए रखता है।
- source_word: चारों कृदंतों का निहित कर्म
  choice: अंडकोष
  rationale: संदर्भ नर पशु के जननांगों की क्षति का संकेत देता है; आधुनिक हिन्दी में शारीरिक रूप से सटीक और स्पष्ट शब्द आवश्यक है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नाम रखा गया है, और इसे सामान्य उपाधि में नहीं बदला गया।
- issue: अंतिम निषेध וּבְאַרְצְכֶם לֹא תַעֲשׂוּ का दायरा
  choice: देश में ऐसी अंग-विकृति करने का सामान्य निषेध
  alternative: देश में ऐसे पशु को चढ़ाने या बलिदान के लिए तैयार करने का निषेध
  rationale: ‘करना’ व्यापक और लोपयुक्त है; निकटतम पूर्ववर्ती क्रियाएँ अंडकोषों को क्षतिग्रस्त करने की विधियाँ हैं। ‘ऐसा न करना’ इसी व्यापकता को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। शारीरिक विषय को euphemism के बिना किंतु असभ्य हुए बिना व्यक्त किया गया है। चार इब्रानी क्षति-शब्दों का क्रम और यथासंभव पारस्परिक भेद सुरक्षित रखा गया है।
