source:
  edition: WLC
  text: וְ/שׁ֥וֹר וָ/שֶׂ֖ה שָׂר֣וּעַ וְ/קָל֑וּט נְדָבָה֙ תַּעֲשֶׂ֣ה אֹת֔/וֹ וּ/לְ/נֵ֖דֶר לֹ֥א יֵרָצֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/023.yaml
  text: But an ox or a sheep that has a limb too long or too short—you may make it a freewill offering[a], but for a vow it will not be accepted.
translation:
  language: hi
  text: पर ऐसा बैल या भेड़, जिसका कोई अंग बहुत लंबा या बहुत छोटा हो, उसे तुम स्वेच्छा-भेंट के रूप में चढ़ा सकते हो[a]; लेकिन मन्नत की भेंट के रूप में वह स्वीकार नहीं किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक व्यापक अर्थ में, “विकृत या अविकसित।” इब्रानी शब्द संभवतः शरीर के अनुपात में दो विपरीत प्रकार की असमानताओं का वर्णन करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשׁוֹר
  choice: बैल
  rationale: שׁוֹר गोवंश के एक पशु को दर्शाता है; बलिदान-संबंधी इस एकवचन विधान में ‘बैल’ स्वाभाविक और स्पष्ट है।
- source_word: וָשֶׂה
  choice: या भेड़
  rationale: שֶׂה भेड़-बकरी वर्ग के पशु के लिए प्रयुक्त हो सकता है; यहाँ गोवंश के विपरीत झुंड के पशु को सामान्य रूप से दर्शाने के लिए ‘भेड़’ उपयुक्त है।
- source_word: שָׂרוּעַ וְקָלוּט
  choice: जिसका कोई अंग बहुत लंबा या बहुत छोटा हो
  rationale: ये दोनों दुर्लभ शब्द संभवतः शारीरिक अनुपात की विपरीत विकृतियाँ—किसी अंग का अधिक बढ़ा या सिकुड़ा होना—बताते हैं। मुख्य पाठ में संभावित ठोस अर्थ रखा गया है और अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: נְדָבָה
  choice: स्वेच्छा-भेंट
  rationale: यह किसी बाध्यकारी मन्नत से अलग, अपनी इच्छा से दी गई भेंट को दर्शाता है।
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: उसे ... के रूप में चढ़ा सकते हो
  rationale: शाब्दिक अर्थ ‘उसे करना/बनाना’ है, पर बलिदान के संदर्भ में हिन्दी का स्वाभाविक अर्थ ‘भेंट के रूप में चढ़ाना’ है।
- source_word: וּלְנֵדֶר
  choice: लेकिन मन्नत की भेंट के रूप में
  rationale: נֵדֶר बाध्यकारी मन्नत को दर्शाता है; यह स्वेच्छा-भेंट के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: לֹא יֵרָצֶה
  choice: वह स्वीकार नहीं होगा
  rationale: बलिदान-संबंधी संदर्भ में רצה का निफ़अल रूप अनुग्रहपूर्वक स्वीकार किए जाने को दर्शाता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: שָׂרוּעַ और קָלוּט से सूचित दोष का स्वरूप
  choice: किसी अंग का बहुत लंबा या बहुत छोटा होना
  alternative: विकृत या अविकसित होना; शरीर का कोई भाग अनुपात से बड़ा या छोटा होना
  rationale: शब्दों की जोड़ी विपरीत प्रकार की शारीरिक असमानता का संकेत देती प्रतीत होती है। ठोस अर्थ मुख्य पाठ में रखा गया है, पर सटीक शारीरिक आशय अनिश्चित होने के कारण व्यापक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक-धार्मिक संदर्भ के अनुरूप गरिमापूर्ण लेकिन सामान्य पाठक के लिए स्पष्ट भाषा। ‘स्वेच्छा-भेंट’ और ‘मन्नत की भेंट’ के बीच मूल विरोध को स्पष्ट रखा गया है।
