source:
  edition: WLC
  text: נְבֵלָ֧ה וּ/טְרֵפָ֛ה לֹ֥א יֹאכַ֖ל לְ/טָמְאָה בָ֑/הּ אֲנִ֖י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/008.yaml
  text: He shall not eat an animal found dead or torn by beasts[a], making himself unclean by it. I am Yahweh.
translation:
  language: hi
  text: वह ऐसा जानवर न खाए जो अपने-आप मर गया हो या जिसे जंगली पशु ने फाड़ डाला हो, ताकि वह उससे अशुद्ध न हो। मैं याहवे हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְבֵלָה
  choice: मरा पाया गया जानवर
  rationale: यह शब्द ऐसे पशु के शव को सूचित करता है जो विधिपूर्वक वध किए जाने के बजाय अपने-आप मर गया हो। ‘मरा पाया गया जानवर’ आधुनिक हिन्दी में स्पष्ट है और केवल ‘शव’ कहने से अधिक स्वाभाविक रूप से आहार-विधि के संदर्भ को व्यक्त करता है।
- source_word: וּטְרֵפָה
  choice: या जंगली पशु से फाड़ा गया जानवर
  rationale: यह शब्द सामान्यतः शिकारी पशु द्वारा फाड़े गए जानवर को सूचित करता है। इब्रानी में कर्ता निहित है; हिन्दी में ‘जंगली पशु से’ उसे स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: לֹא יֹאכַל
  choice: न खाए
  rationale: निषेध के साथ अपूर्ण क्रिया कानूनी आज्ञा व्यक्त करती है। ‘न खाए’ आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और विधिक बल वाला रूप है।
- source_word: לְטָמְאָה בָהּ
  choice: और इस तरह उससे अशुद्ध न हो
  rationale: ל के साथ infinitive खाने से होने वाले परिणाम अथवा उद्देश्य को व्यक्त कर सकता है। ‘इस तरह’ खाने और अनुष्ठानिक अशुद्धता के परिणाम का संबंध स्पष्ट करता है, जबकि ‘अशुद्ध’ טמא की शुद्धता-संबंधी शब्दावली बनाए रखता है।
- source_word: אֲנִי יְהוָה
  choice: मैं याहवे हूँ
  rationale: यह लैव्यव्यवस्था में बार-बार आने वाला वाचा-सूत्र है। परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि में बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ सीधे चतुरक्षरीय वाचा-नाम का प्रयोग करता है। ‘याहवे’ नाम को नाम के रूप में बनाए रखता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: अशुद्धता वाले वाक्यांश का संबंध
  choice: खाने के परिणाम के रूप में ‘और इस तरह उससे अशुद्ध न हो’
  alternative: ‘उससे अशुद्ध होने के लिए’ अथवा एक अलग निषेध ‘और उससे अपने को अशुद्ध न करे’
  rationale: इब्रानी infinitive उद्देश्य और परिणाम के बीच कुछ लचीलापन रखता है। चुना हुआ रूप स्वाभाविक हिन्दी में परिणाम सामने रखता है, पर जानबूझकर स्वयं को अपवित्र करने का अतिरिक्त भाव नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य संक्षिप्त और विधिक है, पर अत्यधिक संस्कृतनिष्ठ नहीं। ‘अशुद्ध’ लैव्यव्यवस्था की अनुष्ठानिक शुद्धता की शब्दावली को बनाए रखता है।
