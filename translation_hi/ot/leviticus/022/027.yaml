id: LEV.22.27
reference: Leviticus 22:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שׁ֣וֹר אוֹ כֶ֤שֶׂב אוֹ עֵז֙ כִּ֣י יִוָּלֵ֔ד וְ/הָיָ֛ה שִׁבְעַ֥ת יָמִ֖ים תַּ֣חַת אִמּ֑/וֹ וּ/מִ/יּ֤וֹם הַ/שְּׁמִינִי֙ וָ/הָ֔לְאָה יֵרָצֶ֕ה לְ/קָרְבַּ֥ן אִשֶּׁ֖ה לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/027.yaml
  text: When an ox or a sheep or a goat is born[a], it shall remain seven days under its mother, and from the eighth day onward it shall be accepted as a food offering to Yahweh.
translation:
  language: hi
  text: “जब गाय-बैल, भेड़ या बकरी का कोई बच्चा जन्मे, तो वह सात दिन तक अपनी माँ के साथ रहे[a]। आठवें दिन से और उसके बाद वह यहोवा के लिए अग्नि-भेंट के रूप में स्वीकार्य होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “अपनी माँ के नीचे।”'
    reason: हिब्रू मुहावरे के शाब्दिक रूप को दिखाते हुए मुख्य पाठ में उसका स्वाभाविक हिन्दी अर्थ दिया गया है।
lexical_decisions:
- source_word: שׁוֹר
  choice: बछड़ा
  rationale: यहाँ जन्म के तुरंत बाद के पशु की बात है; हिन्दी में प्रजाति-सूचक ‘बैल’ नवजात के लिए अस्वाभाविक और नर-विशेष है, इसलिए गोवंश के बच्चे के लिए ‘बछड़ा’ चुना गया।
- source_word: כֶשֶׂב
  choice: मेमना
  rationale: शब्द भेड़-वर्ग को सूचित करता है, पर जन्म और पहले सात दिनों के संदर्भ में ‘मेमना’ स्वाभाविक हिन्दी है।
- source_word: עֵז
  choice: बकरी का बच्चा
  rationale: यह प्रजाति-सूचक संज्ञा है; नवजात संदर्भ में यह रूप लिंग को अनावश्यक रूप से निश्चित किए बिना अर्थ स्पष्ट करता है।
- source_word: כִּי יִוָּלֵד
  choice: जब ... जन्मे
  rationale: विधिक प्रसंग में כִּי एक संभावित स्थिति प्रस्तुत करता है; आधुनिक हिन्दी में ‘जब’ सहज है और निष्क्रिय जन्म-अर्थ को बनाए रखता है।
- source_word: וְהָיָה שִׁבְעַת יָמִים תַּחַת אִמּוֹ
  choice: वह सात दिन तक अपनी माँ के नीचे रहे
  rationale: ‘माँ के नीचे’ मूल तַּחַת की छवि को सुरक्षित रखता है, जबकि ‘रहे’ इस अवधि की निरंतरता व्यक्त करता है।
- source_word: וּמִיּוֹם הַשְּׁמִינִי וָהָלְאָה
  choice: आठवें दिन से आगे
  rationale: समय की आरंभ-सीमा और उसके बाद की निरंतर पात्रता दोनों स्पष्ट होती हैं।
- source_word: יֵרָצֶה
  choice: स्वीकार किया जाएगा
  rationale: निफ़अल रूप यहाँ बलिदान के लिए स्वीकृति या ग्राह्यता बताता है।
- source_word: לְקָרְבַּן אִשֶּׁה
  choice: आग में चढ़ाई जानेवाली भेंट के रूप में
  rationale: קָרְבָּן को ‘भेंट’ और אִשֶּׁה को आग द्वारा अर्पण के रूप में व्यक्त किया गया है; इससे विवादित ‘भोजन-भेंट’ की व्याख्या आरोपित नहीं होती।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: पूर्वसर्ग भेंट की दिशा/समर्पण बताता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। हिन्दी के सामान्य और प्रतिष्ठित रूप ‘यहोवा’ से नाम को नाम के रूप में रखा गया है, उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: אִשֶּׁה का अर्थ
  choice: आग में चढ़ाई जानेवाली भेंट
  alternative: भोजन-भेंट / अग्नि-भेंट
  rationale: शब्द की सटीक व्युत्पत्ति और अर्थ पर चर्चा है; मुख्य पाठ आग से प्रस्तुत बलिदान का न्यूनतम, प्रसंग-संगत अर्थ देता है और ‘भोजन’ की व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, विधिक किंतु सहज शैली। पशुओं के सामान्य वर्गनामों के बजाय नवजात संदर्भ के अनुरूप ‘बछड़ा, मेमना, बकरी का बच्चा’ रखा गया है। मूल की ‘माँ के नीचे’ वाली ठोस छवि सुरक्षित रखी गई है।
