  yaml_path: translation/ot/leviticus/022/006.yaml
  text: The person who touches it shall be unclean until the evening[b][a], and shall not eat any of the holy things unless he has washed his body with water.
translation:
  language: hi
  text: जो व्यक्ति उसे छुए, वह शाम तक अशुद्ध रहेगा और पवित्र अर्पणों[a] में से तब तक कुछ न खाए, जब तक कि वह अपने शरीर[b] को पानी से न धो ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र वस्तुओं” अथवा “समर्पित वस्तुओं”।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने मांस को पानी में धो ले।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: व्यक्ति
  rationale: याजकीय विधि के इस प्रसंग में यह शब्द अमूर्त ‘प्राण’ नहीं, बल्कि किसी एक व्यक्ति को सूचित करता है।
- source_word: אֲשֶׁר תִּגַּע בּוֹ
  choice: जो व्यक्ति उसे छुए
  rationale: क्रिया का स्त्रीलिंग रूप נֶפֶשׁ के व्याकरणिक लिंग के कारण है। ‘उसे’ पिछले प्रसंग में अशुद्धता के स्रोत की ओर संकेत करता है और उसके व्यक्ति या वस्तु होने का अनावश्यक निर्णय नहीं करता।
- source_word: וְטָמְאָה עַד הָעָרֶב
  choice: वह शाम तक अशुद्ध रहेगा
  rationale: यह संपर्क के फलस्वरूप होने वाली अनुष्ठानिक अशुद्धता और उसकी अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא יֹאכַל
  choice: कुछ न खाए
  rationale: विधिक प्रसंग में यह निषेध व्यक्त करता है; ‘न खाए’ आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: מִן הַקֳּדָשִׁים
  choice: पवित्र वस्तुओं में से ... कुछ
  rationale: बहुवचन संज्ञा पवित्र ठहराई गई वस्तुओं या भोज्य अर्पणों को सूचित करती है, और ‘में से कुछ’ מִן के अंशवाचक भाव को प्रकट करता है।
- source_word: כִּי אִם
  choice: जब तक कि ... न
  rationale: यह उस आवश्यक शर्त को व्यक्त करता है जिसके पूरा होने से पहले पवित्र वस्तुओं में से खाना वर्जित है।
- source_word: רָחַץ בְּשָׂרוֹ בַּמָּיִם
  choice: अपने शरीर को पानी से न धो ले
  rationale: בָּשָׂר का शाब्दिक अर्थ ‘मांस’ है, पर यहाँ पूरे शरीर के लिए प्रयुक्त है; यह रूप ठोस क्रिया और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
theological_decisions:
- issue: अशुद्धता का स्वरूप
  choice: अनुष्ठानिक अशुद्धता
  alternative: नैतिक अशुद्धता
  rationale: प्रसंग पवित्र वस्तुओं को खाने की पात्रता, संपर्क से हुई अशुद्धता और पानी से धोने से संबंधित है। इसलिए अनुवाद नैतिक दोष या अपराध का भाव नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण विधिक शैली अपनाई गई है। ‘व्यक्ति’ जैविक लिंग का अनावश्यक संकेत टालता है; ‘अशुद्ध’ को प्रसंगानुसार अनुष्ठानिक अर्थ में समझा गया है।
