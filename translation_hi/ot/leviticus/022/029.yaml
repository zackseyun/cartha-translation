theological_decisions:
- issue: יהוה परमेश्वर के निज नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में नाम सीधे आया है। हिंदी बाइबल-परंपरा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: לִרְצֹנְכֶם का आशय
  choice: तुम्हारी ओर से स्वीकार की जाए
  alternative: तुम्हारी इच्छा के अनुसार
  rationale: लैव्यव्यवस्था के बलिदान-संबंधी संदर्भ में यह पद स्वीकार्यता को व्यक्त करता है, न कि मुख्यतः बलि चढ़ाने वालों की व्यक्तिगत इच्छा को।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘इस रीति से’ विधिक निर्देश के भाव को स्पष्ट करता है, जबकि स्वीकार्यता को परमेश्वर की ओर से निहित कर्म के रूप में व्यक्त किया गया है।
