  text: וְ/אִ֕ישׁ כִּֽי יֹאכַ֥ל קֹ֖דֶשׁ בִּ/שְׁגָגָ֑ה וְ/יָסַ֤ף חֲמִֽשִׁית/וֹ֙ עָלָ֔י/ו וְ/נָתַ֥ן לַ/כֹּהֵ֖ן אֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/014.yaml
  text: And if a man eats a holy thing unintentionally[d][c][b][a], then he shall add a fifth to it and give the holy thing to the priest.
translation:
  language: hi
  text: यदि कोई पुरुष[a] अनजाने में[c] कोई पवित्र वस्तु[b] खा ले, तो वह उसमें उसका पाँचवाँ भाग[d] और जोड़कर पवित्र वस्तु याजक को दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कोई व्यक्ति’; इब्रानी में ‘पुरुष’ (אִישׁ) है, जो इस विधिक कथन में सामान्य अर्थ में भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पवित्र वस्तु’ से आशय परमेश्वर को समर्पित उस पवित्र भोजन या संपत्ति से है जो याजकीय उपयोग के लिए अलग रखी गई थी।
    reason: cultural_note
  - marker: c
    text: या ‘भूल से’।
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप से, ‘उसमें उसका पाँचवाँ भाग और जोड़े’।
    reason: literal_rendering
lexical_decisions:
- source_word: וְאִישׁ
  choice: यदि कोई पुरुष
  rationale: אִישׁ पुल्लिंग एकवचन है और यहाँ विधिक शर्त का कर्ता है। ‘कोई पुरुष’ स्रोत-रूप को बनाए रखता है; इस प्रकार का विधान सामान्य रूप से किसी भी व्यक्ति पर लागू हो सकता है।
- source_word: יֹאכַל קֹדֶשׁ
  choice: कोई पवित्र वस्तु खा ले
  rationale: יֹאכַל विधिक शर्त में घटित होने वाली क्रिया बताता है। קֹדֶשׁ का अर्थ यहाँ याजकीय उपयोग के लिए अलग रखी गई पवित्र खाद्य-वस्तु या संपत्ति है; व्यापक ‘पवित्र वस्तु’ मूल की सीमा को सुरक्षित रखता है।
- source_word: בִּשְׁגָגָה
  choice: अनजाने में
  rationale: यह शब्द जानबूझकर किए गए उल्लंघन के विपरीत भूल या अनिच्छित कार्य को सूचित करता है।
- source_word: וְיָסַף חֲמִשִׁיתוֹ עָלָיו
  choice: तो वह उसमें उसका पाँचवाँ भाग और जोड़कर
  rationale: वाक्यांश मूल मात्रा के अतिरिक्त उसी का पाँचवाँ भाग देने की क्षतिपूर्ति बताता है। ‘पाँचवाँ भाग’ प्राचीन विधिक अनुपात को यथावत रखता है।
- source_word: וְנָתַן לַכֹּהֵן אֶת־הַקֹּדֶשׁ
  choice: पवित्र वस्तु याजक को दे
  rationale: ‘दे’ נתן का सीधा अर्थ रखता है और ‘पवित्र वस्तु’ की पुनरावृत्ति मूल पाठ के शब्द-संबंध को बनाए रखती है, बिना इसे केवल धनराशि या भोजन तक सीमित किए।
theological_decisions:
- issue: विधिक कथन में पुल्लिंग एकवचन का सामान्य प्रयोग
  choice: मुख्य पाठ में ‘कोई पुरुष’
  alternative: ‘कोई व्यक्ति’ या ‘जो कोई’
  rationale: मूल में אִישׁ स्पष्ट रूप से पुल्लिंग एकवचन है। इसे मुख्य पाठ में रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि विधिक प्रयोग सामान्य अर्थ भी रख सकता है।
- issue: क्षतिपूर्ति की पवित्र वस्तु का स्वरूप
  choice: दोनों स्थानों पर ‘पवित्र वस्तु’
  alternative: ‘पवित्र भोजन’, ‘पवित्र अंश’ या ‘उसका मूल्य’
  rationale: קֹדֶשׁ व्यापक शब्द है। प्रसंग खाने योग्य समर्पित वस्तु का संकेत देता है, पर पद स्वयं क्षतिपूर्ति को केवल भोजन अथवा धन के रूप में स्पष्ट नहीं करता; इसलिए मूल की व्यापकता और तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज विधिक शैली अपनाई गई है। ‘खा ले’ शर्तवाचक प्रसंग में स्वाभाविक है; ‘याजक’ लैव्यव्यवस्था की स्थापित धार्मिक शब्दावली के अनुरूप है।
