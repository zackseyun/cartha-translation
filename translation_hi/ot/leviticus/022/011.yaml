source:
  edition: WLC
  text: וְ/כֹהֵ֗ן כִּֽי יִקְנֶ֥ה נֶ֨פֶשׁ֙ קִנְיַ֣ן כַּסְפּ֔/וֹ ה֖וּא יֹ֣אכַל בּ֑/וֹ וִ/ילִ֣יד בֵּית֔/וֹ הֵ֖ם יֹאכְל֥וּ בְ/לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/011.yaml
  text: But if a priest buys a person as his property with his money[a], he may eat of it[b], and those born in his house may eat of his food.
translation:
  language: hi
  text: परन्तु यदि कोई याजक अपने धन से किसी व्यक्ति को अपनी संपत्ति के रूप में खरीद ले[a], तो वह व्यक्ति उसमें से खा सकता है; और उसके घर में जन्मे लोग भी उसके भोजन में से खा सकते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “एक व्यक्ति, उसके धन से खरीदी हुई संपत्ति”—अर्थात वह व्यक्ति जिसे उसने अपने धन से खरीदा हो।'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “उसकी रोटी में से।” यहाँ “रोटी” संभवतः व्यापक अर्थ में उस भोजन को दर्शाती है जो याजक को मिला था।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹהֵן כִּי
  choice: परन्तु यदि कोई याजक
  rationale: यह पद पिछले नियम के विपरीत एक नई कानूनी स्थिति प्रस्तुत करता है; כִּי को इस शर्तसूचक प्रसंग में ‘यदि’ कहा गया है।
- source_word: יִקְנֶה נֶפֶשׁ
  choice: किसी व्यक्ति को मोल ले
  rationale: קנה यहाँ धन देकर प्राप्त करने को और נֶפֶשׁ एक मनुष्य को दर्शाता है; ‘व्यक्ति’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: קִנְיַן כַּסְפּוֹ
  choice: अपने धन से … अपनी सम्पत्ति के रूप में
  rationale: यह अभिव्यक्ति धन से प्राप्त सम्पत्ति होने की कानूनी स्थिति को स्पष्ट रखती है और दासता/स्वामित्व के पहलू को नरम नहीं करती।
- source_word: הוּא יֹאכַל בּוֹ
  choice: तो वह व्यक्ति उसमें से खा सकता है
  rationale: הוּא का संदर्भ मोल लिए गए व्यक्ति से है; ‘वह व्यक्ति’ सम्भावित सर्वनाम-संदेह दूर करता है। בּוֹ प्रसंग में पवित्र भोजन की ओर संकेत करता है।
- source_word: וִילִיד בֵּיתוֹ
  choice: जो उसके घर में जन्मे हैं
  rationale: एकवचन सामूहिक पद के बाद बहुवचन सर्वनाम और क्रिया हैं; यह अनुवाद सामूहिक अर्थ को रखता है और पाठ से अधिक कानूनी पहचान निर्धारित नहीं करता।
- source_word: הֵם יֹאכְלוּ בְלַחְמוֹ
  choice: वे भी उसके भोजन में से खा सकते हैं
  rationale: कानूनी प्रसंग में अपूर्ण क्रिया अनुमति व्यक्त करती है। לֶחֶם का मूल अर्थ ‘रोटी’ है, पर यहाँ वह याजक को मिलने वाले भोजन के व्यापक अर्थ में प्रयुक्त है।
theological_decisions:
- issue: दासता और सम्पत्ति से सम्बन्धित कानूनी भाषा
  choice: अपने धन से किसी व्यक्ति को अपनी सम्पत्ति के रूप में मोल ले
  alternative: अपने धन से किसी व्यक्ति को मोल ले
  rationale: चुना गया रूप קִנְיַן כַּסְפּוֹ में निहित सम्पत्ति/स्वामित्व की धारणा को ईमानदारी से प्रकट करता है; यह उस व्यवस्था का समर्थन नहीं, बल्कि पाठ की पारदर्शी प्रस्तुति है।
- issue: पवित्र भोजन में भाग लेने की अनुमति
  choice: खा सकता है
  alternative: खाएगा
  rationale: इस कानूनी सन्दर्भ में क्रिया भविष्यवाणी या आज्ञा की अपेक्षा पात्रता और अनुमति बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कानूनी शैली रखी गई है। ‘मोल ले’ बाइबलीय प्रसंग में स्वाभाविक है, जबकि ‘अपनी सम्पत्ति के रूप में’ मूल पाठ की कठोर कानूनी वास्तविकता को स्पष्ट रखता है।
