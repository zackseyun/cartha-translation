base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/018.yaml
  text: 'Speak to Aaron and to his sons and to all the sons of Israel[a], and say to them: Any man from the house of Israel, or from the sojourners in Israel, who presents his offering for any of their vows or any of their freewill offerings[c][b], which they present to Yahweh as a burnt offering—'
translation:
  language: hi
  text: '“हारून से, उसके पुत्रों से और इस्राएल के सभी पुत्रों[a] से बात कर, और उनसे कह: इस्राएल के घराने में से कोई भी पुरुष, या इस्राएल में रहनेवाले परदेशियों में से कोई, जो अपनी किसी भी मन्नत या किसी भी स्वेच्छा-बलि के लिए अपना चढ़ावा यहोवा के लिए होमबलि के रूप में चढ़ाए—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘सभी इस्राएली।’ हिब्रानी में शाब्दिक पदबंध ‘इस्राएल के सभी पुत्र’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר ... וְאָמַרְתָּ
  choice: से कह और उनसे कहना
  rationale: दोनों हिब्रानी क्रियाओं को रखा गया है; पहली प्रत्यक्ष आज्ञा है और दूसरी आगे दिए जाने वाले संदेश का परिचय देती है।
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी पुत्रों
  rationale: मूल के वंश और संबंधसूचक पदबंध को औपचारिक रूप से सुरक्षित रखता है; स्वाभाविक विकल्प पादटिप्पणी में दिया गया है।
- source_word: אִישׁ אִישׁ
  choice: कोई भी पुरुष
  rationale: दोहराव का वितरणात्मक अर्थ ‘हर/कोई भी पुरुष’ है; कानूनी संदर्भ के प्रतिनिधिक पुल्लिंग को बनाए रखा गया है।
- source_word: מִבֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने में से
  rationale: वाचाई और सामुदायिक अभिव्यक्ति ‘इस्राएल का घराना’ को सामान्य जातिनाम में नहीं बदला गया।
- source_word: הַגֵּר בְּיִשְׂרָאֵל
  choice: इस्राएल में रहनेवाले परदेशियों में से
  rationale: גֵּר किसी अस्थायी यात्री मात्र के बजाय इस्राएली समुदाय के बीच रहने वाले गैर-इस्राएली निवासी को दर्शाता है; सामूहिक वर्ग को हिन्दी में स्वाभाविक बहुवचन से व्यक्त किया गया है।
- source_word: קָרְבָּנוֹ
  choice: अपना चढ़ावा
  rationale: यह बलिदानी संदर्भ में परमेश्वर के निकट लाया गया सामान्य अर्पण है; ‘चढ़ावा’ व्यापक अर्थ बनाए रखता है।
- source_word: נִדְרֵיהֶם ... נִדְבוֹתָם
  choice: अपनी मन्नतों या स्वेच्छा-बलियों
  rationale: दो अलग श्रेणियों—मन्नत से संबद्ध अर्पण और स्वेच्छा से दिए गए अर्पण—को स्पष्ट रखा गया है।
- source_word: לַיהוָה
  choice: यहोवा के सामने
  rationale: दिव्य नाम को ‘यहोवा’ के रूप में प्रत्यक्ष रखा गया है; ‘के सामने’ बलि प्रस्तुत करने की लक्ष्यगत भाषा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְעֹלָה
  choice: होमबलि के रूप में
  rationale: עֹלָה के लिए प्रचलित तकनीकी बलिदानी पद ‘होमबलि’ प्रयुक्त है।
theological_decisions:
- issue: कानूनी निर्देश में प्रतिनिधिक पुल्लिंग
  choice: कोई भी पुरुष
  alternative: कोई भी व्यक्ति / जो कोई
  rationale: אִישׁ אִישׁ व्याकरणतः पुल्लिंग और वितरणात्मक है। अनावश्यक रूप से लिंग-निरपेक्ष किए बिना मूल का रूप रखा गया है।
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में वाचाई नाम प्रत्यक्ष है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से इसे नाम के रूप में रखा गया है, उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: मन्नतों से जुड़े अर्पणों की वाक्यगत सीमा
  choice: अपनी मन्नतों या स्वेच्छा-बलियों के लिए
  alternative: अपनी सभी मन्नत-बलियों और सभी स्वेच्छा-बलियों के लिए
  rationale: हिब्रानी पदबंध मन्नतों को स्वयं इंगित कर सकता है अथवा उनसे संबंधित विशिष्ट बलियों को। मुख्य पाठ अपेक्षाकृत कम विशिष्ट है और अधिक विशिष्ट समझ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण हिन्दी में लैव्यव्यवस्था की विधिक-याजकीय शैली रखी गई है। वाक्य अगले पद में जारी रहने के कारण अंत में दीर्घ डैश रखा गया है।
