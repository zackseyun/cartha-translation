source:
  edition: WLC
  text: וּ/בַת כֹּהֵ֔ן כִּ֥י תִהְיֶ֖ה לְ/אִ֣ישׁ זָ֑ר הִ֕וא בִּ/תְרוּמַ֥ת הַ/קֳּדָשִׁ֖ים לֹ֥א תֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/012.yaml
  text: But if a priest’s daughter becomes the wife of an outsider[b][a], she shall not eat from the contribution of the holy things.
translation:
  language: hi
  text: लेकिन यदि किसी याजक की बेटी किसी गैर-याजक पुरुष से विवाह कर ले[a], तो वह पवित्र वस्तुओं की भेंट में से नहीं खाएगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: ‘किसी बाहरी/अजनबी पुरुष की हो जाए।’ यहाँ आशय अनिवार्य रूप से किसी दूसरी जाति के व्यक्ति से नहीं, बल्कि याजकीय पात्रता के बाहर के पुरुष से है।'
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘पवित्र भेंटों में से’ या ‘पवित्र चढ़ावों के अंश में से’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן
  choice: लेकिन यदि किसी याजक की बेटी
  rationale: वाव यहाँ पिछले पद की व्यवस्था के साथ विरोध दिखाता है, इसलिए ‘लेकिन’ स्वाभाविक है; संबंधसूचक रचना का अर्थ ‘याजक की बेटी’ है।
- source_word: כִּי תִהְיֶה לְ/אִישׁ זָר
  choice: याजकीय परिवार से बाहर के किसी पुरुष से विवाह कर ले
  rationale: शाब्दिक रचना ‘किसी बाहरी पुरुष की हो जाए’ वैवाहिक स्थिति को सूचित करती है। संदर्भ में זָר जातीय विदेशी नहीं, बल्कि याजकीय घराने और उसकी पात्रता से बाहर का पुरुष है।
- source_word: הִוא
  choice: वह
  rationale: स्वतंत्र सर्वनाम बेटी को स्पष्ट कर्ता बनाता है; हिन्दी में ‘वह’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּ/תְרוּמַת הַ/קֳּדָשִׁים
  choice: पवित्र वस्तुओं में से दी गई भेंट
  rationale: תְּרוּמָה अलग करके दी गई भेंट या अंश है, और הַקֳּדָשִׁים व्यापक रूप से पवित्र वस्तुओं को दर्शाता है। यह अनुवाद दोनों तत्वों को बनाए रखता है।
- source_word: לֹא תֹאכֵל
  choice: नहीं खाएगी
  rationale: विधिक संदर्भ में निषेधात्मक अपूर्ण क्रिया बाध्यकारी मनाही व्यक्त करती है; आधुनिक हिन्दी में ‘नहीं खाएगी’ इसकी विधिक शक्ति को स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: याजकीय विधान में זָר का आशय
  choice: याजकीय परिवार से बाहर का पुरुष
  alternative: परदेशी, अजनबी, गैर-याजक
  rationale: लैव्यव्यवस्था 22 का प्रसंग पवित्र भोजन में याजकीय घराने की सहभागिता का है। इसलिए यहाँ जातीय परदेशीपन के बजाय याजकीय परिवार और उसकी पात्रता से बाहर होना मुख्य है।
- issue: תְרוּמַת הַקֳּדָשִׁים की व्याप्ति
  choice: पवित्र वस्तुओं में से दी गई भेंट
  alternative: पवित्र भेंटें; पवित्र चढ़ावों का अंश
  rationale: मूल पदबंध एक अलग करके दिए गए अंश को व्यापक ‘पवित्र वस्तुओं’ से जोड़ता है; चुना गया रूप इस संबंध को किसी एक विशेष प्रकार के चढ़ावे तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘याजकीय परिवार से बाहर’ संदर्भगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी मूल की अधिक शाब्दिक अस्पष्टता सुरक्षित रखती है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
