base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/009.yaml
  text: They shall keep my charge[a], so that they do not bear sin because of it and die by it when they profane it[d][c][b]. I am Yahweh who sanctifies them.
translation:
  language: hi
  text: वे मेरे सौंपे हुए दायित्व[a] का पालन करें, ऐसा न हो कि वे उसके कारण पाप का भार[b] उठाएँ और उसे अपवित्र[d] करने पर उसी के कारण मर जाएँ[c]। मैं याहवे हूँ, जो उन्हें पवित्र[e] करता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी सौंपी हुई जिम्मेदारी।’
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके कारण दोषी ठहरें।’ ‘पाप का भार उठाना’ इब्रानी मुहावरा है, जिसका अर्थ पाप के लिए दोषी और दंड के भागी होना हो सकता है।
    reason: idiom_clarification
  - marker: c
    text: या ‘उसी के कारण मर जाएँ।’ इब्रानी सर्वनाम का संदर्भ अनिर्दिष्ट है।
    reason: source_form_and_referential_ambiguity
  - marker: d
    text: या ‘उसे साधारण न समझें’ अथवा ‘उसकी पवित्रता भंग न करें।’ सर्वनाम पवित्र वस्तु या सौंपे गए पवित्र दायित्व की ओर संकेत कर सकता है।
    reason: lexical_and_referential_ambiguity
  - marker: e
    text: या ‘जो उन्हें पवित्र बनाता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ אֶת־מִשְׁמַרְתִּי
  choice: मेरे सौंपे हुए दायित्व का पालन करें
  rationale: שׁמר का विधिक अर्थ ‘पालन करना’ है, और מִשְׁמֶרֶת किसी को सौंपी गई जिम्मेदारी या सेवा-दायित्व को सूचित करता है। यह रूप स्वाभाविक हिन्दी में आज्ञात्मक भाव और सौंपे गए कर्तव्य—दोनों को रखता है।
- source_word: יִשְׂאוּ עָלָיו חֵטְא
  choice: उसके कारण पाप का भार उठाएँ
  rationale: נשׂא חטא का शाब्दिक मुहावरा पाप या दोष का भार उठाना है; עָלָיו को ‘उसके कारण’ कहा गया है। इससे दोषी ठहरने का भाव बना रहता है, पर मुहावरे को केवल ‘दोषी हों’ कहकर संकुचित नहीं किया गया।
- source_word: וּמֵתוּ בוֹ
  choice: और मर न जाएँ
  rationale: निषेध וְלֹא का प्रभाव संयुक्त क्रियाओं पर है। हिन्दी वाक्य में कारण पहले ही ‘उसके कारण’ से व्यक्त है; पादटिप्पणी में בוֹ की अधिक स्पष्ट कारणात्मक सम्भावना दी गई है।
- source_word: יְחַלְּלֻהוּ
  choice: उसे अपवित्र करके
  rationale: חלל पवित्रता के प्रसंग में किसी पवित्र वस्तु या दायित्व को अपवित्र करना अथवा साधारण समझना है। ‘अपवित्र करना’ लैव्यव्यवस्था के पवित्र–अपवित्र विरोध को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में निकट ध्वन्यात्मक लिप्यंतरण दिया गया है।
- source_word: מְקַדְּשָׁם
  choice: जो उन्हें पवित्र करता हूँ
  rationale: קדשׁ का पिएल कृदंत यहाँ याहवे को उन्हें पवित्र ठहराने या पवित्र बनाने वाले के रूप में प्रस्तुत करता है। ‘पवित्र करता हूँ’ सहज हिन्दी में इस निरंतर पहचान और कार्य को बनाए रखता है।
theological_decisions:
- issue: עָלָיו, בוֹ और יְחַלְּלֻהוּ में एकवचन सर्वनाम का संदर्भ
  choice: ‘उसे/उसके कारण’ कहकर संदर्भ को अनिर्दिष्ट रखा गया है।
  alternative: इसे विशेष रूप से पवित्र भोजन, पवित्र वस्तुओं या याहवे के सौंपे हुए दायित्व का संदर्भ माना जा सकता है।
  rationale: इब्रानी पद सर्वनामों के संज्ञात्मक संदर्भ को दोबारा स्पष्ट नहीं करता। निकटवर्ती प्रसंग पवित्र वस्तुओं से और पद स्वयं याहवे के दायित्व से जुड़ा है; इसलिए किसी एक संदर्भ को अनिवार्य बनाना मूल की वास्तविक अस्पष्टता मिटा देता।
- issue: מְקַדְּשָׁם में पवित्रीकरण का भाव
  choice: ‘जो उन्हें पवित्र करता हूँ’
  alternative: ‘जो उन्हें अपने लिए अलग करता हूँ’ या ‘जो उन्हें पवित्र बनाता हूँ’
  rationale: यह अनुवाद קדשׁ की पवित्रता-संबंधी भाषा को बनाए रखता है और यह निर्धारित नहीं करता कि यहाँ केवल पद के लिए अलग करना अभिप्रेत है या नैतिक/अनुष्ठानिक पवित्रीकरण का व्यापक अर्थ।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘पालन करें’ विधिक आज्ञा को स्वाभाविक बनाता है; ‘सौंपे हुए दायित्व’ याजकीय जिम्मेदारी का भाव देता है। मूल के एकवचन सर्वनामों की संदिग्धता जानबूझकर नहीं सुलझाई गई है।
