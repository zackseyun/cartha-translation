base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/032.yaml
  text: And you shall not profane my holy name[a], and I will be sanctified among the sons of Israel. I am Yahweh[b], who sanctifies you.
translation:
  language: hi
  text: और तुम मेरे पवित्र नाम को अपवित्र मत करना, और मैं इस्राएल के पुत्रों[b] के बीच पवित्र माना जाऊँगा[a]। मैं याहवे हूँ, जो तुम्हें पवित्र करता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मुझे पवित्र माना जाएगा’ अथवा ‘मैं पवित्र ठहरूँगा।’
    reason: lexical_alternative
  - marker: b
    text: ‘इस्राएल के पुत्र’ इब्रानी में इस्राएल के लोगों के लिए प्रयुक्त एक प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחַלְּלוּ
  choice: अपवित्र न करना
  rationale: पिएल रूप यहाँ किसी पवित्र वस्तु को साधारण ठहराने, उसका अनादर करने या उसकी पवित्रता भंग करने का अर्थ देता है। ‘अपवित्र करना’ हिन्दी में इसके धार्मिक और नैतिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֵׁם קָדְשִׁי
  choice: मेरे पवित्र नाम
  rationale: यह रूप मूल पाठ के ‘नाम’ और ‘पवित्रता’ दोनों तत्त्वों को स्पष्ट, पारंपरिक और सहज हिन्दी में बनाए रखता है।
- source_word: וְנִקְדַּשְׁתִּי
  choice: मैं पवित्र माना जाऊँगा
  rationale: निफ़ाल रूप का आशय है कि याहवे की पवित्रता समुदाय के बीच स्वीकार और प्रकट हो। यह अनुवाद निष्क्रिय भाव बनाए रखते हुए ‘पवित्र किया जाऊँगा’ से उत्पन्न होने वाली उस भ्रामक धारणा से बचता है कि मनुष्य परमेश्वर को वास्तव में पवित्र बनाते हैं। वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: בְּתוֹךְ
  choice: के बीच
  rationale: यह समुदाय के मध्य या उसके भीतर होने के स्थानिक-सामुदायिक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पद की व्याकरणिक बनावट को निकटता से सुरक्षित रखता है; साथ ही पादटिप्पणी स्पष्ट करती है कि यह पूरे इस्राएली समुदाय के लिए प्रचलित पद है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में उसके प्रचलित उच्चारणानुसार प्रस्तुत किया गया है।
- source_word: מְקַדִּשְׁכֶם
  choice: जो तुम्हें पवित्र करता हूँ
  rationale: कर्तृवाचक कृदन्त याहवे की निरंतर या चरित्रगत क्रिया दर्शाता है। ‘पवित्र करता’ इसी पद में קדשׁ धातु की पुनरावृत्ति को बनाए रखता है।
theological_decisions:
- issue: וְנִקְדַּשְׁתִּי में परमेश्वर के पवित्र माने जाने का भाव
  choice: मैं पवित्र माना जाऊँगा
  alternative: मैं पवित्र ठहरूँगा / मेरी पवित्रता प्रकट होगी
  rationale: मूल निफ़ाल रूप में निष्क्रिय अथवा आत्मवाची तनाव है। मुख्य पाठ ऐसा स्वाभाविक हिन्दी रूप चुनता है जो समुदाय द्वारा याहवे को पवित्र मानने का भाव देता है, जबकि पादटिप्पणी अन्य संभावित अभिव्यक्तियाँ सुरक्षित रखती है।
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना आधुनिक विद्वतापूर्ण उच्चारण के निकट देवनागरी में प्रस्तुत करता है।
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक संदर्भ
  choice: इस्राएल के पुत्रों
  alternative: इस्राएल के लोग / इस्राएली
  rationale: मुख्य पाठ इब्रानी के पुल्लिंग बहुवचन रूप को सुरक्षित रखता है, पर पादटिप्पणी बताती है कि संदर्भ केवल पुरुषों तक सीमित नहीं, बल्कि इस्राएल के समुदाय का है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पवित्रता से जुड़े קדשׁ और חלל के परस्पर विरोधी शब्द-संबंध को ‘पवित्र/अपवित्र’ द्वारा सुनाई देने योग्य बनाया गया है। मूल के दोनों וְ संयोजकों का संबंध आरंभिक ‘और’ तथा अर्धविराम से सुरक्षित है।
