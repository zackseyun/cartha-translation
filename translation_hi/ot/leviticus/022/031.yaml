  text: וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אֲנִ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/031.yaml
  text: So you shall keep my commandments and do them[a]; I am Yahweh.
translation:
  language: hi
  text: इसलिए तुम मेरी आज्ञाओं का पालन करना और उन्हें पूरा करना। मैं याहवे[a] हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; परंपरागत रूप से ‘प्रभु’ अनूदित; ‘यहोवा’ भी प्रचलित रूप है।'
    reason: ईश्वरीय नाम के पारंपरिक अनुवाद और वैकल्पिक रूप को स्पष्ट करना।
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: इसलिए तुम…पालन करना
  rationale: שׁמר का विधिक-वाचायी अर्थ आज्ञाओं को संभालकर मानना या उनका पालन करना है। हिंदी में ‘पालन करना’ स्वाभाविक और गरिमापूर्ण है; आरंभिक וּ को पिछले प्रसंग से परिणामात्मक संबंध दिखाने के लिए ‘इसलिए’ कहा गया है।
- source_word: מִצְוֺתַי
  choice: मेरी आज्ञाओं
  rationale: מִצְוָה के लिए ‘आज्ञा’ तोराह के विधिक और वाचायी संदर्भ में स्पष्ट तथा प्रचलित शब्द है।
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: और उन्हें पूरा करना
  rationale: עשה का मूल भाव ‘करना’ है; आज्ञाओं के साथ ‘उन्हें पूरा करना’ हिंदी में उनके अनुसार कार्य करने का स्वाभाविक अर्थ देता है और पहले क्रियापद से अलग दूसरी क्रिया को बनाए रखता है।
- source_word: אֲנִי יְהוָה
  choice: मैं याहवे हूँ
  rationale: यह लैव्यव्यवस्था में बार-बार आने वाला आत्म-परिचय सूत्र है। ‘मैं…हूँ’ उसकी स्पष्टता बनाए रखता है और יְהוָה को व्यक्तिवाचक वाचा-नाम के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है; पादटिप्पणी पारंपरिक और वैकल्पिक रूपों की जानकारी देती है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, विधिक और गरिमापूर्ण शैली रखी गई है। ‘पालन करना’ और ‘पूरा करना’ की जोड़ी मूल के ‘रखना’ और ‘करना’—दोनों पहलुओं को बिना एक में मिलाए व्यक्त करती है।
