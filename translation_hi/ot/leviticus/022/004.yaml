source:
  edition: WLC
  text: אִ֣ישׁ אִ֞ישׁ מִ/זֶּ֣רַע אַהֲרֹ֗ן וְ/ה֤וּא צָר֨וּעַ֙ א֣וֹ זָ֔ב בַּ/קֳּדָשִׁים֙ לֹ֣א יֹאכַ֔ל עַ֖ד אֲשֶׁ֣ר יִטְהָ֑ר וְ/הַ/נֹּגֵ֨עַ֙ בְּ/כָל טְמֵא נֶ֔פֶשׁ א֣וֹ אִ֔ישׁ אֲשֶׁר תֵּצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/004.yaml
  text: Any man from the offspring of Aaron[a], if he is afflicted with a skin disease or has a discharge, shall not eat from the holy things until he becomes clean. And whoever touches anything unclean by a dead person, or a man from whom an emission of semen comes out[b],
translation:
  language: hi
  text: हारून के वंश का कोई भी पुरुष, यदि वह अनुष्ठानिक रूप से अशुद्ध करने वाले त्वचा-रोग से ग्रस्त[a] हो या उसे स्राव हो रहा हो, तो वह पवित्र वस्तुओं में से तब तक न खाए, जब तक वह शुद्ध न हो जाए। और जो किसी मृत व्यक्ति के कारण अशुद्ध हुए किसी व्यक्ति को छुए[b], या वह पुरुष जिससे वीर्य निकला हो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “कोढ़ से ग्रस्त।” इब्रानी शब्द अनुष्ठानिक रूप से अशुद्ध करने वाली कई प्रकार की त्वचा-दशाओं के लिए प्रयुक्त होता है; इसका अर्थ आवश्यक रूप से आधुनिक कोढ़ (हैन्सन रोग) नहीं है।'
    reason: lexical_alternative
  - marker: b
    text: या संभवतः, “शव-संबंधी अशुद्ध किसी वस्तु को छुए।” इब्रानी अभिव्यक्ति कठिन है और मृत व्यक्ति या शव से संबंधित अशुद्धि को सूचित करती है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: אִישׁ אִישׁ מִזֶּרַע אַהֲרֹן
  choice: हारून के वंश का कोई भी पुरुष
  rationale: दोहरे אִישׁ का वितरणात्मक अर्थ ‘कोई भी पुरुष’ है; प्रसंग हारून के पुरुष वंशजों और याजकीय पात्रता का है। זֶרַע को यहाँ स्वाभाविक वंशावली अर्थ में ‘वंश’ किया गया है।
- source_word: צָרוּעַ
  choice: अशुद्ध करने वाले चर्म रोग से ग्रस्त
  rationale: यह शब्द अनुष्ठानिक रूप से अशुद्ध करने वाली व्यापक त्वचा-दशा बताता है, जिसे आधुनिक हैन्सन रोग तक सीमित करना भ्रामक होगा।
- source_word: זָב
  choice: उसके शरीर से स्राव होता हो
  rationale: यह अशुद्धि उत्पन्न करने वाले शारीरिक स्राव की दशा है। ‘शरीर से स्राव’ स्पष्ट और मर्यादित आधुनिक हिन्दी है।
- source_word: בַּקֳּדָשִׁים לֹא יֹאכַל
  choice: पवित्र वस्तुओं में से ... न खाए
  rationale: बहुवचन ‘पवित्र वस्तुएँ’ याजकों के लिए निर्धारित पवित्र खाद्य अंशों को समेटता है; खाने के प्रसंग में ‘में से’ हिन्दी में स्वाभाविक है।
- source_word: עַד אֲשֶׁר יִטְהָר
  choice: जब तक वह शुद्ध न हो जाए
  rationale: क्रिया अनुष्ठानिक शुद्धता की अवस्था में आने को व्यक्त करती है, इसलिए ‘शुद्ध न हो जाए’ उपयुक्त है।
- source_word: בְּכָל טְמֵא נֶפֶשׁ
  choice: शव के कारण अशुद्ध हुई किसी वस्तु को
  rationale: कठिन इब्रानी पद मृत्यु या शव से जुड़ी अशुद्धि का संकेत देता है। मुख्य पाठ एक सम्भावित वस्तुगत अर्थ रखता है और वैकल्पिक व्यक्तिवाचक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אִישׁ אֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: वह पुरुष जिसका वीर्यस्खलन हुआ हो
  rationale: इब्रानी मुहावरा वीर्य निकलने को बताता है। ‘वीर्यस्खलन’ संक्षिप्त, स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी है।
theological_decisions:
- issue: अनुष्ठानिक अशुद्धि को आधुनिक रोग-निदान या नैतिक दोष के रूप में न प्रस्तुत करना
  choice: ‘अशुद्ध करने वाले चर्म रोग’ और ‘शुद्ध हो जाए’
  alternative: ‘कोढ़ी’ और ‘चंगा हो जाए’
  rationale: पद का विषय याजकीय भोजन के लिए अनुष्ठानिक पात्रता है, न कि आधुनिक चिकित्सकीय निदान अथवा नैतिक अपराध।
- issue: मृत्यु-संबंधी अशुद्धि वाले कठिन इब्रानी पद की अस्पष्टता
  choice: मुख्य पाठ में शव के कारण अशुद्ध वस्तु; पादटिप्पणी में शव के कारण अशुद्ध व्यक्ति
  alternative: केवल ‘शव को छुए’
  rationale: इब्रानी अभिव्यक्ति को सीधे शव-स्पर्श तक सीमित करना उसकी व्याकरणिक और अर्थगत जटिलता को अनावश्यक रूप से सुलझा देगा।
- issue: याजकीय कानूनी विषय का लिंग
  choice: ‘कोई भी पुरुष’
  alternative: ‘कोई भी व्यक्ति’
  rationale: यहाँ इब्रानी पुल्लिंग है और प्रसंग हारून के पुरुष वंशजों से संबंधित है; लिंग-निरपेक्ष रूप स्रोत के संदर्भ को धुंधला कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक प्रसंग के अनुरूप रखी गई है। पद अगले पद में जारी रहने वाली सूची का भाग है, इसलिए अंत में पूर्णविराम के बजाय अल्पविराम रखा गया है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के साथ मुख्य पाठ में रखे गए हैं।
