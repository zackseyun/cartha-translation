  text: who brought you out of the land of Egypt to be your God[a]. I am Yahweh.
translation:
  language: hi
  text: जो तुम्हें मिस्र की भूमि से निकाल लाया, ताकि मैं तुम्हारा परमेश्वर होऊँ। मैं यहोवा[a] हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: “YHWH” (परंपरागत रूप से “प्रभु” अनूदित; वैकल्पिक लिप्यंतरण “याहवे”)।'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוֹצִיא
  choice: जो ... निकाल लाया
  rationale: हिफ़ील कृदंत यहाँ यहोवा का संबंधवाचक वर्णन करता है; आधुनिक हिन्दी में पूर्ण हुई निर्गमन-घटना के लिए यह स्वाभाविक रूप है।
- source_word: אֶתְכֶם
  choice: तुम्हें
  rationale: प्रत्यक्ष कर्म-चिह्न के साथ द्वितीय पुरुष बहुवचन प्रत्यय है; हिन्दी में ‘तुम्हें’ सामूहिक संबोधन को सहज रूप से व्यक्त करता है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: ‘देश’ को बनाए रखकर निर्गमन-वाचा के पूर्ण सूत्र को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है।
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: ताकि मैं तुम्हारा परमेश्वर ठहरूँ
  rationale: उद्देश्यसूचक לִ और वाचागत संबंध को स्पष्ट करता है। हिन्दी में कर्ता ‘मैं’ जोड़ना निहित प्रथम पुरुष वक्ता को स्वाभाविक बनाता है; ‘ठहरूँ’ वाचागत पहचान और स्थायी संबंध का भाव रखता है।
- source_word: אֲנִי יְהוָה
  choice: मैं यहोवा हूँ
  rationale: हिब्रू के क्रियारहित पहचान-वाक्य को स्वाभाविक हिन्दी में व्यक्त किया गया है और व्यक्तिगत वाचा-नाम को लिप्यंतरित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत वाचा-नाम सीधे आया है। प्रचलित हिन्दी बाइबलीय रूप ‘यहोवा’ नाम को उपाधि में बदले बिना सामान्य पाठकों के लिए पहचान योग्य रखता है।
- issue: לִהְיוֹת לָכֶם לֵאלֹהִים में वाचागत संबंध
  choice: ताकि मैं तुम्हारा परमेश्वर ठहरूँ
  alternative: तुम्हारा परमेश्वर होने के लिए
  rationale: दोनों व्याकरणतः संभव हैं; चुना गया रूप हिन्दी में उद्देश्य और वक्ता की पहचान को स्पष्ट करता है, पर वाक्य में निहित वाचागत संबंध से आगे कोई विशिष्ट धर्मसैद्धांतिक अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किंतु सहज। पद पिछले वाक्य से जुड़ा संबंधवाचक खंड है; इसलिए आरम्भ ‘जो’ से किया गया है। ‘परमेश्वर’ सामान्य और प्रतिष्ठित बाइबलीय शब्दावली है।
