source:
  edition: WLC
  text: וְ/כָל זָ֖ר לֹא יֹ֣אכַל קֹ֑דֶשׁ תּוֹשַׁ֥ב כֹּהֵ֛ן וְ/שָׂכִ֖יר לֹא יֹ֥אכַל קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/010.yaml
  text: No outsider may eat the holy thing[b][a]; a sojourner of a priest or a hired worker may not eat the holy thing.
translation:
  language: hi
  text: कोई भी बाहरी व्यक्ति पवित्र वस्तु[a] में से न खाए। याजक के यहाँ रहनेवाला व्यक्ति[b] या मजदूरी पर रखा गया कामगार पवित्र वस्तु में से न खाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र भोजन” अथवा “पवित्र अंश।” इब्रानी में शाब्दिक अर्थ “पवित्र वस्तु” है; यहाँ इससे पवित्र चढ़ावों का वह खाद्य-अंश अभिप्रेत है जिसे याजक खा सकते थे।
    reason: lexical_alternative
  - marker: b
    text: इसका अर्थ याजक के परिवार का सदस्य न होते हुए भी उसके घराने से जुड़ा हुआ निवासी हो सकता है; अन्य संभव अनुवाद हैं, “याजक का प्रवासी निवासी” या “याजक के यहाँ रहनेवाला परदेशी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָר
  choice: बाहरी व्यक्ति
  rationale: इस याजकीय संदर्भ में यह शब्द मुख्यतः जातीय रूप से विदेशी व्यक्ति नहीं, बल्कि पवित्र भोजन खाने के अधिकार से बाहर व्यक्ति को दर्शाता है।
- source_word: קֹדֶשׁ
  choice: पवित्र वस्तु
  rationale: इब्रानी में एकवचन संज्ञा का औपचारिक अर्थ बनाए रखा गया है; संदर्भ में इससे बलिदानों का वह पवित्र खाद्य-अंश अभिप्रेत है जो याजकों के लिए रखा गया था। ‘में से’ इसे हिंदी में खाने योग्य अंश के रूप में स्वाभाविक बनाता है।
- source_word: תּוֹשַׁב כֹּהֵן
  choice: याजक के यहाँ रहनेवाला व्यक्ति
  rationale: यह अभिव्यक्ति याजक से जुड़े निवासी को दर्शाती है, याजक को स्वयं प्रवासी नहीं बताती। यह अनुवाद उसकी घरेलू संबद्धता को बनाए रखते हुए उसकी विदेशी स्थिति के विषय में आवश्यकता से अधिक निश्चित नहीं होता।
- source_word: שָׂכִיר
  choice: मजदूरी पर रखा गया कामगार
  rationale: यह शब्द वेतन या मजदूरी के बदले काम करनेवाले व्यक्ति को दर्शाता है; यह आधुनिक हिंदी में स्पष्ट और सामाजिक रूप से सटीक है।
- source_word: לֹא יֹאכַל
  choice: न खाए
  rationale: नकार के साथ अपूर्ण क्रिया यहाँ कानूनी निषेध व्यक्त करती है; हिंदी विधिक शैली में ‘न खाए’ स्वाभाविक और संक्षिप्त है।
- source_word: וְכָל
  choice: कोई भी
  rationale: आगे आनेवाले निषेध के साथ इसका हिंदी में स्वाभाविक रूप ‘कोई भी ... न’ है।
