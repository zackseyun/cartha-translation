lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने...कहा
  rationale: वाव-क्रमिक क्रिया דּבר यहाँ वाणी की एक नई घटना आरम्भ करती है। आधुनिक हिन्दी में ‘कहा’ स्वाभाविक है और अगले पद में आने वाले सीधे कथन की भूमिका बनाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: वाणी के संबोधित व्यक्ति को हिन्दी की स्वाभाविक रचना ‘मूसा से कहा’ द्वारा व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह क्रियार्थक रूप आगे आने वाले सीधे कथन का परिचय देता है। हिन्दी में ‘यह कहते हुए कहा’ अनावश्यक पुनरुक्ति होगी, इसलिए इसकी भूमिका मुख्य क्रिया ‘कहा’ और अंत के विराम-चिह्न में समाहित की गई है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश-नाम सीधे प्रयुक्त है; इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है, जबकि ‘याहवे’ वैकल्पिक पुनर्निर्मित उच्चारण है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। मूल की सूत्रात्मक वाणी-भूमिका को रखा गया है, पर לֵאמֹר की शाब्दिक पुनरुक्ति से बचकर स्वाभाविक हिन्दी वाक्य बनाया गया है।
