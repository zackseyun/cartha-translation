source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יַקְרִ֤יב זֶֽבַח שְׁלָמִים֙ לַ/יהוָ֔ה לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ לִ/נְדָבָ֔ה בַּ/בָּקָ֖ר א֣וֹ בַ/צֹּ֑אן תָּמִ֤ים יִֽהְיֶה֙ לְ/רָצ֔וֹן כָּל מ֖וּם לֹ֥א יִהְיֶה בּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/021.yaml
  text: And if a man presents a sacrifice of peace offerings to Yahweh[a], to fulfill a vow or as a freewill offering, from the herd or from the flock, it shall be without blemish to be accepted[b]; there shall be no defect in it.
translation:
  language: hi
  text: और यदि कोई पुरुष याहवे के लिए मेलबलि[a] चढ़ाए—मन्नत पूरी करने के लिए अथवा स्वेच्छा-भेंट के रूप में—तो वह गाय-बैलों या भेड़-बकरियों में से हो और ग्रहणयोग्य होने के लिए निष्कलंक हो; उसमें कोई दोष न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सहभागिता-बलि”; इब्रानी नाम שְׁלָמִים मेल, कुशलता और पूर्णता से संबंधित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: और यदि कोई पुरुष
  rationale: कानूनी प्रसंग में כִּי शर्त प्रस्तुत करता है और אִישׁ पुल्लिंग एकवचन ‘पुरुष’ है; मूल की व्याकरणिक लैंगिकता को बनाए रखा गया है।
- source_word: יַקְרִיב
  choice: चढ़ाए
  rationale: קרב का हिफ़ील रूप बलिदानी प्रसंग में किसी भेंट या पशु को परमेश्वर के सामने अर्पित करने का सामान्य अर्थ देता है; ‘चढ़ाए’ स्वाभाविक और उपासना-संदर्भ के अनुकूल है।
- source_word: זֶבַח שְׁלָמִים
  choice: मेलबलि का पशु
  rationale: זֶבַח बलि के पशु/बलिदान को और שְׁלָמִים बलि के प्रकार को सूचित करता है। ‘मेलबलि’ שׁלם से जुड़े मेल/शांति के भाव को बनाए रखता है, जबकि ‘का पशु’ अगले वाक्यांश में पशुधन की श्रेणियों से स्वाभाविक रूप से जुड़ता है।
- source_word: לְפַלֵּא נֶדֶר
  choice: मन्नत पूरी करने के लिए
  rationale: इस बलिदानी कानूनी प्रसंग में पदबंध मानी हुई मन्नत के अनुसार भेंट अर्पित करके उसे पूरा करने को सूचित करता है।
- source_word: אוֹ לִנְדָבָה
  choice: या स्वेच्छा-बलि के रूप में
  rationale: נְדָבָה बिना बाध्यता के स्वेच्छा से दी गई भेंट है और यहाँ मन्नत की बलि के वैकल्पिक प्रकार के रूप में आती है।
- source_word: בַּבָּקָר אוֹ בַצֹּאן
  choice: गाय-बैलों या भेड़-बकरियों में से
  rationale: בָּקָר बड़े पालतू पशुधन और צֹאן छोटे झुंड-पशुओं, अर्थात भेड़-बकरियों, को दर्शाता है; हिंदी में प्रजातियों को स्पष्ट करना अधिक सहज है।
- source_word: תָּמִים
  choice: निर्दोष
  rationale: बलिदानी व्यवस्था में शब्द का अर्थ शारीरिक दाग या त्रुटि से रहित होना है; ‘निर्दोष’ यहाँ पशु की आवश्यक पूर्ण दशा को संक्षेप में व्यक्त करता है।
- source_word: לְרָצוֹן
  choice: ग्रहणयोग्य होने के लिए
  rationale: यह पदबंध परमेश्वर के सामने बलि की स्वीकार्यता को सूचित करता है; ‘ग्रहणयोग्य’ उद्देश्य/परिणाम दोनों के संबंध को सुरक्षित रखता है।
- source_word: כָּל מוּם לֹא יִהְיֶה בּוֹ
  choice: उसमें कोई भी दोष न हो
  rationale: מוּם बलि को अयोग्य बनाने वाली शारीरिक त्रुटि है। हिंदी निषेधात्मक विधान मूल की कानूनी अपेक्षा को स्पष्ट रूप से रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है। ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: אִישׁ में लैंगिक रूप
  choice: कोई पुरुष
  alternative: कोई व्यक्ति
  rationale: मूल में विषय स्पष्ट रूप से पुल्लिंग एकवचन है। प्रतिनिधिक कानूनी प्रयोग की संभावना को मानते हुए भी अनुवाद ने उसकी व्याकरणिक लैंगिकता को अस्पष्ट नहीं किया।
- issue: שְׁלָמִים नामक बलि का अर्थ
  choice: मेलबलि
  alternative: सहभागिता-बलि; शांति-बलि
  rationale: शब्द का सटीक धार्मिक आशय केवल एक आधुनिक अवधारणा तक सीमित नहीं है। ‘मेलबलि’ שׁלם से संबंध बनाए रखता है, और पादटिप्पणी वैकल्पिक व्याख्यात्मक नाम बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी-उपासना प्रसंग के अनुकूल रखी गई है। लंबे इब्रानी वाक्य के घटकों को डैश और स्पष्ट संयोजकों से व्यवस्थित किया गया है, पर उसकी शर्त, विकल्प और पात्रता की क्रम-रचना सुरक्षित है।
