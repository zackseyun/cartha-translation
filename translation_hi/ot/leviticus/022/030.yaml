base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/030.yaml
  text: It shall be eaten on that same day[a]; you shall leave none of it until morning[b]. I am Yahweh.
translation:
  language: hi
  text: उसी दिन[a] उसे खाया जाए; उसमें से कुछ भी सुबह तक न बचाना। मैं यहोवा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस दिन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: मूलतः ‘उस दिन’; बलसूचक ‘उसी’ बलि चढ़ाए जाने वाले दिन ही उसे खाने की तात्कालिक सीमा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יֵאָכֵל
  choice: उसे खा लिया जाए
  rationale: निफ़अल अपूर्ण रूप यहाँ निष्क्रिय/निर्वैयक्तिक विधिक निर्देश है; यह अनुवाद उसके आदेशात्मक भाव और निष्क्रिय रचना को बनाए रखता है।
- source_word: לֹא תוֹתִירוּ מִמֶּנּוּ
  choice: उसमें से कुछ भी ... बचाकर न रखना
  rationale: हित्प्रेरक रूप का अर्थ ‘शेष छोड़ना’ है। आधुनिक हिन्दी में यह निषेध स्पष्ट और स्वाभाविक है।
- source_word: עַד בֹּקֶר
  choice: सुबह तक
  rationale: यह प्रचलित कालवाचक अभिव्यक्ति रात भर कुछ शेष न रखने की सीमा बताती है।
- source_word: אֲנִי יְהוָה
  choice: मैं यहोवा हूँ
  rationale: इब्रानी की वाचकरहित आत्म-पहचान को हिन्दी में स्वाभाविक ‘हूँ’ के साथ व्यक्त किया गया है और व्यक्तिगत दिव्य नाम को लिप्यंतरित किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम सीधे आया है। हिन्दी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से अलग रखता है; ‘याहवे’ वैकल्पिक विद्वत पुनर्निर्माण है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; विधिक निर्देश का संक्षिप्त स्वर तथा मूल पाठ की निष्क्रिय अभिव्यक्ति यथासंभव सुरक्षित रखी गई है। अंग्रेज़ी परत की दूसरी पादटिप्पणी मूल पाठ से मेल नहीं खाती, क्योंकि ‘मैं यहोवा हूँ’ मुख्य इब्रानी पाठ ही है, इसलिए उसे शामिल नहीं किया गया।
