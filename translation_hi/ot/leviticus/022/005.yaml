id: LEV.22.5
reference: Leviticus 22:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אוֹ אִישׁ֙ אֲשֶׁ֣ר יִגַּ֔ע בְּ/כָל שֶׁ֖רֶץ אֲשֶׁ֣ר יִטְמָא ל֑/וֹ א֤וֹ בְ/אָדָם֙ אֲשֶׁ֣ר יִטְמָא ל֔/וֹ לְ/כֹ֖ל טֻמְאָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/005.yaml
  text: or a man who touches any swarming thing by which he becomes unclean[a], or a person by whom he becomes unclean[b], whatever his uncleanness.
translation:
  language: hi
  text: या कोई पुरुष जो किसी भी रेंगनेवाले जीव[a] को छुए, जिससे वह अशुद्ध हो जाए, या किसी ऐसे व्यक्ति को छुए, जिससे वह अशुद्ध हो जाए—उसकी अशुद्धता चाहे किसी भी प्रकार की हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झुंड में चलनेवाले छोटे जीव।’ इब्रानी शब्द छोटे जीवों की उस व्यापक श्रेणी को दर्शाता है जो भूमि के निकट रेंगते या बहुतायत से चलते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘व्यक्ति’ और उससे जुड़े सर्वनाम पुल्लिंग एकवचन में हैं, पर इस विधिक संदर्भ में उनका प्रयोग सामान्य अर्थ में हुआ है। ‘उसकी’ का संबंध मूल पाठ में कुछ अस्पष्ट है।
    reason: lexical_and_grammatical_ambiguity
lexical_decisions:
- source_word: אוֹ
  choice: या
  rationale: यह पिछले पद से चली आ रही सूची में एक और विकल्प जोड़ने वाला सामान्य वियोजक समुच्चयबोधक है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: इब्रानी का पुल्लिंग एकवचन रूप सुरक्षित रहता है और हिन्दी विधिक शैली में स्वाभाविक भी लगता है।
- source_word: יִגַּע
  choice: छुए
  rationale: शुद्धता-विषयक व्यवस्था में נגע का सीधा और स्वाभाविक अर्थ ‘छूना’ है।
- source_word: בְּכָל שֶׁרֶץ
  choice: किसी भी रेंगनेवाले जीव
  rationale: שֶׁרֶץ छोटे, भूमि के निकट चलने या बहुतायत से गतिशील होने वाले जीवों की व्यापक श्रेणी है; यह पद उसे किसी विशेष प्राणी-वर्ग तक सीमित नहीं करता।
- source_word: אֲשֶׁר יִטְמָא לוֹ
  choice: जिससे वह अशुद्ध हो जाए
  rationale: यह संपर्क के फलस्वरूप होने वाली विधिक अशुद्धता व्यक्त करता है और इब्रानी की कारण/माध्यम संबंधी लचीली रचना को स्वाभाविक हिन्दी में रखता है।
- source_word: בְאָדָם
  choice: किसी ऐसे व्यक्ति को
  rationale: אָדָם यहाँ अशुद्धता के मानवीय स्रोत को बताता है; ‘व्यक्ति’ इसके सामान्य मानवीय अर्थ को ठीक ढंग से व्यक्त करता है।
- source_word: לְכֹל טֻמְאָתוֹ
  choice: उसकी अशुद्धता चाहे किसी भी प्रकार की हो
  rationale: यह संक्षिप्त और कुछ हद तक संदिग्ध इब्रानी पदबंध का विस्तार किए बिना अशुद्धता के हर प्रकार को समेटता है; ‘उसकी’ मूल के सर्वनाम-संबंध की लचक भी बनाए रखता है।
- source_word: טֻמְאָה
  choice: अशुद्धता
  rationale: यह טמא के साथ शब्दगत संबंध बनाए रखता है और लैव्यव्यवस्था की अनुष्ठानिक शुद्धता की भाषा के लिए प्रचलित हिन्दी पद है।
theological_decisions:
- issue: लैव्यव्यवस्था में अशुद्धता का स्वरूप
  choice: טמא / טֻמְאָה का अनुवाद ‘अशुद्ध / अशुद्धता’ किया गया है, जो अनुष्ठानिक या विधिक स्थिति को दर्शाता है।
  alternative: ‘अपवित्र / अपवित्रता’
  rationale: संदर्भ याजकीय शुद्धता-विधान का है, नैतिक दोष का अनिवार्य आरोप नहीं। ‘अशुद्धता’ हिन्दी पाठक के लिए इस भेद को अपेक्षाकृत स्पष्ट रखती है।
- issue: לְכֹל טֻמְאָתוֹ में सर्वनाम का संबंध
  choice: ‘उसकी अशुद्धता’ रखकर सर्वनाम-संबंध की मूल अस्पष्टता बनाए रखी गई है।
  alternative: स्पष्ट रूप से ‘उस व्यक्ति की अशुद्धता’ कहना
  rationale: इब्रानी में दोनों संभावित संदर्भ पुल्लिंग एकवचन हैं; किसी एक को स्पष्ट कर देना मूल पाठ की वास्तविक अस्पष्टता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य को पिछले पद से जुड़ी विधिक सूची के अंश के रूप में ‘या’ से आरम्भ किया गया है। ‘अशुद्ध’ और ‘अशुद्धता’ की पुनरावृत्ति मूल शब्दमूल के संबंध को बनाए रखती है।
