  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर ... कहा
  rationale: वाव-क्रम के साथ यह क्रिया एक नए वचन-खंड का आरम्भ करती है। आधुनिक हिन्दी में ‘फिर ... कहा’ स्वाभाविक रूप से कथानक की प्रगति और वाणी का परिचय देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह परमेश्वर के व्यक्तिगत नाम יהוה का हिन्दी में प्रचलित लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: हिन्दी में बोलने के प्राप्तकर्ता को ‘से’ के द्वारा व्यक्त करना स्वाभाविक है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: इब्रानी में यह आगामी वचन की विषयवस्तु का परिचय देता है। ‘ने ... से कहा’ हिन्दी की स्वाभाविक वचन-प्रस्तावना है; अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक पुनरुक्ति होता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे प्रयुक्त है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ उस नाम को नाम के रूप में बनाए रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता; ‘याहवे’ एक वैकल्पिक विद्वत्तापरक लिप्यंतरण है।
translation_notes:
