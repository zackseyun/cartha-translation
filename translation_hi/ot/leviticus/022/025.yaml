source:
  edition: WLC
  text: וּ/מִ/יַּ֣ד בֶּן נֵכָ֗ר לֹ֥א תַקְרִ֛יבוּ אֶת לֶ֥חֶם אֱלֹהֵי/כֶ֖ם מִ/כָּל אֵ֑לֶּה כִּ֣י מָשְׁחָתָ֤/ם בָּ/הֶם֙ מ֣וּם בָּ֔/ם לֹ֥א יֵרָצ֖וּ לָ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/025.yaml
  text: And from the hand of a foreigner you shall not present any of these as the food of your God[a], because their corruption is in them; a defect is in them[b]. They shall not be accepted for you.
translation:
  language: hi
  text: और किसी विदेशी के हाथ से भी इन में से कोई भी पशु अपने परमेश्वर के भोजन के रूप में अर्पित न करना, क्योंकि उनमें विकृति है; उनमें दोष है। वे तुम्हारी ओर से स्वीकार नहीं किए जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִיַּד
  choice: और ... के हाथ से भी
  rationale: מִיַּד का शाब्दिक अर्थ ‘के हाथ से’ है और यहाँ स्रोत या माध्यम बताता है। ‘भी’ पूर्ववर्ती निषेध से संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בֶּן נֵכָר
  choice: किसी परदेशी
  rationale: यह इब्रानी मुहावरा गैर-इस्राएली या विदेशी व्यक्ति को दर्शाता है। ‘परदेशी’ आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: תַקְרִיבוּ
  choice: अर्पित न करना
  rationale: קרב का हिफ़ील रूप बलिदान-संदर्भ में भेंट चढ़ाने या प्रस्तुत करने का अर्थ देता है। ‘अर्पित करना’ हिन्दी के धार्मिक-सांस्कृतिक संदर्भ में स्पष्ट है।
- source_word: לֶחֶם אֱלֹהֵיכֶם
  choice: अपने परमेश्वर के भोजन
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, पर याजकीय बलिदान-संदर्भ में यह परमेश्वर को अर्पित भोजन के लिए प्रयुक्त होता है। मुख्य पाठ में ‘भोजन’ संदर्भगत अर्थ स्पष्ट करता है और पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: מִכָּל אֵלֶּה
  choice: इनमें से कोई पशु
  rationale: यह वाक्यांश पहले बताए गए दोषयुक्त पशुओं की ओर संकेत करता है। ‘पशु’ संदर्भ से स्पष्ट पूर्ति है और ‘कोई’ מִן־כָּל की वितरणात्मक शक्ति व्यक्त करता है।
- source_word: מָשְׁחָתָם
  choice: उनमें विकृति है
  rationale: संज्ञा बिगाड़, खराबी या विकृति को दर्शाती है। पशुओं की शारीरिक दशा के संदर्भ में ‘विकृति’ उपयुक्त है और अगले מוּם से अर्थगत भेद कुछ हद तक बनाए रखती है।
- source_word: מוּם
  choice: दोष
  rationale: लैव्यव्यवस्था 21–22 में यह बलिदान के लिए अयोग्य ठहराने वाली शारीरिक कमी या दाग का मानक शब्द है। ‘दोष’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: לֹא יֵרָצוּ לָכֶם
  choice: वे तुम्हारी ओर से स्वीकार नहीं किए जाएँगे
  rationale: רצה का निफ़ाल बलिदान-संदर्भ में अनुकूल रूप से स्वीकार किए जाने को दर्शाता है। ‘तुम्हारी ओर से’ לָכֶם को बनाए रखता है और अर्पणकर्ताओं के संबंध में स्वीकृति व्यक्त करता है।
theological_decisions:
- issue: बलिदानी भेंट के लिए याजकीय अभिव्यक्ति
  choice: अपने परमेश्वर के भोजन
  alternative: अपने परमेश्वर की रोटी
  rationale: पद पशु-बलियों की स्वीकार्यता के विषय में है। ‘भोजन’ इब्रानी याजकीय मुहावरे का संदर्भगत अर्थ बताता है, जबकि पादटिप्पणी में ‘रोटी’ का शाब्दिक रूप सुरक्षित है; इसमें कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
- issue: बलिदान की स्वीकृति का संबंध
  choice: तुम्हारी ओर से स्वीकार नहीं किए जाएँगे
  alternative: तुम्हारे लिए ग्रहणयोग्य नहीं होंगे
  rationale: לָכֶם को अर्पणकर्ताओं से संबंधित स्वीकार्यता के रूप में रखा गया है। यह वाक्यांश इस तनाव को खुला रखता है कि बलिदान स्वयं अस्वीकार्य हैं और उनकी ओर से स्वीकार नहीं होते।
translation_notes:
  register: आधुनिक मानक हिन्दी, मध्यम औपचारिक और गरिमापूर्ण शैली। आज्ञा को हिन्दी में स्वाभाविक सामूहिक निषेध ‘अर्पित न करना’ से व्यक्त किया गया है। ‘परमेश्वर’ के साथ आदरसूचक बहुवचन नहीं लगाया गया, क्योंकि मूल में संबोधन इस्राएली समुदाय से है और हिन्दी बाइबिलीय प्रयोग में यह स्वाभाविक है।
