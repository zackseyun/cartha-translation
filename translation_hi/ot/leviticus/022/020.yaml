  yaml_path: translation/ot/leviticus/022/020.yaml
  text: You shall not present anything that has a blemish[b][a], for it will not be accepted for you.
translation:
  language: hi
  text: जिसमें कोई दोष हो, उसे अर्पित मत करना,[a] क्योंकि वह तुम्हारी ओर से स्वीकार नहीं किया जाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिसमें कोई खोट हो, उसे भेंट न चढ़ाना।” इब्रानी बलिदान-संबंधी शब्द प्रायः ऐसे शारीरिक दोष को दर्शाता है जो किसी भेंट को अयोग्य ठहराता है।
    reason: lexical_alternative
  - marker: b
    text: या “वह तुम्हारे लिए स्वीकारयोग्य नहीं होगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּל אֲשֶׁר בּוֹ מוּם
  choice: जिसमें कोई दोष हो
  rationale: यह अनिश्चित और सर्वसमावेशी अभिव्यक्ति है—शाब्दिक रूप से ‘वह सब जिसमें दोष हो।’ संदर्भ में इसका आशय बलि के लिए लाए जाने वाले पशु से है, पर मूल की सामान्य अभिव्यक्ति बनाए रखी गई है।
- source_word: מוּם
  choice: दोष
  rationale: याजकीय और बलिदान-संबंधी संदर्भ में यह ऐसा शारीरिक दोष या खोट दर्शाता है जो भेंट को अयोग्य ठहराता है। ‘दोष’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: לֹא תַקְרִיבוּ
  choice: अर्पित न करना
  rationale: קרב का हिफ़ईल रूप बलिदान के संदर्भ में किसी वस्तु को परमेश्वर के सामने भेंट के रूप में प्रस्तुत करने का अर्थ देता है। ‘अर्पित करना’ इस धार्मिक संदर्भ को सहज हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह निषेध का कारण प्रस्तुत करता है।
- source_word: לֹא לְרָצוֹן יִהְיֶה לָכֶם
  choice: वह तुम्हारी ओर से स्वीकार नहीं किया जाएगा
  rationale: לְרָצוֹן बलिदान की अनुकूल स्वीकृति और לָכֶם अर्पणकर्ताओं के संबंध या उनकी ओर से होने का भाव व्यक्त करता है। यह रूप दोनों अर्थों को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: बलिदान की स्वीकृति का भाव
  choice: तुम्हारी ओर से स्वीकार नहीं किया जाएगा
  alternative: तुम्हारे लिए स्वीकारयोग्य नहीं होगा
  rationale: वाक्य केवल किसी अमूर्त मानक पर खरा उतरने की बात नहीं करता, बल्कि परमेश्वर के सामने अर्पण की अनुकूल स्वीकृति का संकेत देता है। ‘तुम्हारी ओर से’ לָכֶם के प्रतिनिधिक/लाभार्थक भाव को बनाए रखता है, बिना किसी बाद की धर्मवैज्ञानिक धारणा को जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दोष’ स्पष्टता देता है, जबकि पादटिप्पणी में ‘खोट’ और बलिदान-संबंधी तकनीकी अर्थ बताया गया है। ‘अर्पित’ धार्मिक संदर्भ को स्वाभाविक ढंग से व्यक्त करता है।
