  text: וְ/הִשִּׂ֤יאוּ אוֹתָ/ם֙ עֲוֺ֣ן אַשְׁמָ֔ה בְּ/אָכְלָ֖/ם אֶת קָדְשֵׁי/הֶ֑ם כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדְּשָֽׁ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/016.yaml
  text: and so cause them to bear guilt requiring restitution by eating their holy things[c][b][a], for I am Yahweh who sanctifies them.
translation:
  language: hi
  text: और इस प्रकार वे उनके पवित्र अंशों[b] को खाने से उन पर क्षतिपूर्ति-योग्य दोष का भार डालें[a]; क्योंकि मैं याहवे हूँ, जो उन्हें पवित्र करता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन पर दोष लाएँ।” इब्रानी अभिव्यक्ति कठिन है और दोष-अपराध के दायित्व पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “उनके पवित्र अंशों” से अभिप्राय समर्पित पवित्र अंशों या भेंटों से है।
    reason: cultural_note
  - marker: c
    text: या, “जो उन्हें पवित्र ठहराता है” अथवा “जो उन्हें पवित्र करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשִּׂיאוּ
  choice: और इस प्रकार ... उन पर ... भार डालें
  rationale: हिफ़ील रूप का कारणवाचक अर्थ है—किसी पर दोष या दायित्व लाना। पूर्ववर्ती निषेध के परिणाम से इसका संबंध भी बना रहता है।
- source_word: עֲוֺן אַשְׁמָה
  choice: दोष का भार ... जिसके लिए क्षतिपूर्ति आवश्यक है
  rationale: यह कठिन युग्म दोष और ऐसे अपराधजन्य दायित्व को व्यक्त करता है जिसमें प्रतिपूर्ति या दोषबलि की अपेक्षा हो सकती है; अनुवाद कानूनी-उपासनात्मक भाव को स्पष्ट करता है।
- source_word: בְּאָכְלָם
  choice: खाने के कारण
  rationale: בְּ के साथ क्रियार्थक संज्ञा यहाँ परिस्थिति अथवा कारण-साधन व्यक्त करती है।
- source_word: קָדְשֵׁיהֶם
  choice: उनके पवित्र चढ़ावों
  rationale: शाब्दिक अर्थ ‘उनकी पवित्र वस्तुएँ’ है; लैव्यव्यवस्था के प्रसंग में अभिषिक्त अंश या चढ़ावे अभिप्रेत हैं। ‘पवित्र चढ़ावे’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित रूप के द्वारा परमेश्वर के व्यक्तिगत नाम को उपाधि से अलग रखा गया है।
- source_word: מְקַדְּשָׁם
  choice: जो उन्हें पवित्र करता है
  rationale: पिएल कृदंत का अर्थ ‘पवित्र करना/अर्पित करना’ है। सरल हिन्दी में ‘पवित्र करता है’ उपासनात्मक और धर्मवैचारिक अर्थ बनाए रखता है।
theological_decisions:
- issue: अंतिम ‘उन्हें’ का संदर्भ
  choice: मुख्य पाठ में सर्वनाम ‘उन्हें’ को अनिर्दिष्ट रखते हुए निकटवर्ती लोगों की ओर स्वाभाविक संकेत
  alternative: इसे ‘पवित्र चढ़ावों’ के संदर्भ में समझना
  rationale: इब्रानी पुल्लिंग बहुवचन प्रत्यय का स्वाभाविक संदर्भ प्रसंग में उल्लिखित लोग हैं, पर मुख्य पाठ सर्वनाम को ज्यों का त्यों रखकर अनावश्यक व्याख्यात्मक निर्धारण से बचता है।
- issue: עֲוֺן אַשְׁמָה का उपासनात्मक दायित्व
  choice: दोष के साथ आवश्यक क्षतिपूर्ति को व्यक्त करना
  alternative: केवल ‘दोष’ या ‘दोष का अधर्म’
  rationale: संयुक्त पद दोष-अपराध और उससे उत्पन्न दायित्व का भाव रखता है; स्पष्ट हिन्दी में इसे व्यक्त किया गया है, जबकि संभावित दोषबलि को सीधे पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली अपनाई गई है। ‘क्षतिपूर्ति’ कानूनी-उपासनात्मक आशय स्पष्ट करती है; ‘पवित्र चढ़ावे’ शाब्दिक ‘पवित्र वस्तुएँ’ की अपेक्षा सामान्य पाठक के लिए अधिक स्वाभाविक है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
