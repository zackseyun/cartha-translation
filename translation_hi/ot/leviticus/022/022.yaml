id: LEV.22.22
reference: Leviticus 22:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַוֶּרֶת֩ א֨וֹ שָׁב֜וּר אוֹ חָר֣וּץ אֽוֹ יַבֶּ֗לֶת א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת לֹא תַקְרִ֥יבוּ אֵ֖לֶּה לַ/יהוָ֑ה וְ/אִשֶּׁ֗ה לֹא תִתְּנ֥וּ מֵ/הֶ֛ם עַל הַ/מִּזְבֵּ֖חַ לַ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/022.yaml
  text: Anything blind[a], broken, mutilated, or with a wart, scab, or skin disease, these you shall not present to Yahweh; and you shall not place any of them on the altar as a food offering to Yahweh.
translation:
  language: hi
  text: जो पशु अंधा हो, टूटा हुआ या कटा-चीरा हुआ हो, अथवा जिसे मस्सा, खाज या कोई चर्मरोग हो, उसे याहवे के सामने भेंट न करना; और उनमें से किसी को भी याहवे के लिए आग में चढ़ाई जाने वाली भेंट[a] के रूप में वेदी पर न रखना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भोजन-भेंट।”
    reason: अִשֶּׁה के लिए एक मान्य वैकल्पिक अर्थ; यह शब्द आग में चढ़ाई गई भेंट अथवा परमेश्वर के लिए भोजन-भेंट के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: עַוֶּרֶת
  choice: जो पशु अंधा हो
  rationale: यह रूप बलि के अयोग्य पशु के दोष को बताता है। हिन्दी में संज्ञा को स्पष्ट करके कहना स्वाभाविक है।
- source_word: שָׁבוּר
  choice: जिसका कोई अंग टूटा हो
  rationale: शब्द किसी टूटे हुए अंग या शारीरिक टूट-फूट का संकेत देता है; केवल ‘टूटा’ कहने की अपेक्षा यह हिन्दी में अधिक स्पष्ट है।
- source_word: חָרוּץ
  choice: जिसका कोई अंग कटा हो
  rationale: मूल अर्थ काटे या चीरे जाने से उत्पन्न अंग-भंग की ओर संकेत करता है। यह अनिश्चित शारीरिक विकृति को बिना अनावश्यक विशिष्टता के व्यक्त करता है।
- source_word: יַבֶּלֶת
  choice: मस्सा
  rationale: यह त्वचा पर उभरी असामान्य गाँठ या वृद्धि को दर्शाने वाला सहज आधुनिक हिन्दी शब्द है।
- source_word: גָרָב
  choice: खाज
  rationale: यह त्वचा की दिखाई देने वाली पीड़ा या खुजलीदार रोग का संकेत देता है; ‘खाज’ साधारण हिन्दी में सुबोध है।
- source_word: יַלֶּפֶת
  choice: कोई चर्मरोग
  rationale: ठीक रोग की पहचान अनिश्चित है, इसलिए किसी विशिष्ट आधुनिक रोग का नाम देने के बजाय व्यापक अर्थ रखा गया है।
- source_word: תַקְרִיבוּ
  choice: भेंट न करना
  rationale: हिफ़ील रूप का बलिदानी संदर्भ में अर्थ किसी भेंट को परमेश्वर के सामने प्रस्तुत करना है।
- source_word: אִשֶּׁה
  choice: आग में चढ़ाई जानेवाली भेंट
  rationale: यह बलिदानी पारिभाषिक शब्द आग से संबंधित भेंट को दर्शाता है। यह हिन्दी में अर्थ को स्पष्ट करता है और ‘भोजन-भेंट’ विकल्प को टिप्पणी में सुरक्षित रखता है।
- source_word: תִתְּנוּ מֵהֶם עַל הַמִּזְבֵּחַ
  choice: उनमें से किसी को भी ... वेदी पर न रखना
  rationale: यह वेदी पर उन पशुओं में से किसी को रखने के निषेध और मूल के वितरणात्मक भाव दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַיהוָה
  choice: याहवे के लिए / याहवे के सामने
  rationale: יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है; पहले प्रसंग में प्रस्तुति के लक्ष्य के लिए ‘के सामने’ और दूसरे में अर्पण के प्राप्तकर्ता के लिए ‘के लिए’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: बलिदानी शब्द אִשֶּׁה का अर्थ
  choice: आग में चढ़ाई जानेवाली भेंट
  alternative: भोजन-भेंट
  rationale: शब्द की व्युत्पत्ति और याजकीय प्रयोग पर मतभेद है। मुख्य पाठ आग से उसका स्पष्ट संबंध व्यक्त करता है, जबकि भोजन के रूप में परमेश्वर को दी गई भेंट की समझ को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, औपचारिक और सामान्य पाठक के लिए सुबोध रखी गई है। दोषों की सूची को स्पष्ट करने के लिए ‘पशु’ और ‘अंग’ जोड़े गए हैं, पर कोई विशिष्ट पशु या रोग मूल से आगे जाकर निर्धारित नहीं किया गया।
