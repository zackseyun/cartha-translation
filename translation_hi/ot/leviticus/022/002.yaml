reference: Leviticus 22:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דַּבֵּ֨ר אֶֽל אַהֲרֹ֜ן וְ/אֶל בָּנָ֗י/ו וְ/יִנָּֽזְרוּ֙ מִ/קָּדְשֵׁ֣י בְנֵֽי יִשְׂרָאֵ֔ל וְ/לֹ֥א יְחַלְּל֖וּ אֶת שֵׁ֣ם קָדְשִׁ֑/י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖/י אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/002.yaml
  text: Speak to Aaron and to his sons[a], that they keep themselves from the holy things of the sons of Israel, and not profane my holy name, which they sanctify for me[c][b]. I am Yahweh.
translation:
  language: hi
  text: हारून और उसके पुत्रों से कह कि वे इस्राएलियों[b] की उन पवित्र वस्तुओं से अलग रहें[a], जिन्हें वे मेरे लिए पवित्र ठहराते हैं,[c] और मेरे पवित्र नाम को अपवित्र न करें। मैं याहवे हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने को अलग रखें’ अथवा ‘उनसे दूर रहें’।
    reason: lexical_alternative
  - marker: b
    text: मूल हिब्रू में शाब्दिक रूप से ‘इस्राएल के पुत्रों’ है; यह पूरे इस्राएली समुदाय का प्रचलित राष्ट्रीय पदबंध है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात वे पवित्र वस्तुएँ जिन्हें इस्राएली याहवे के लिए पवित्र ठहराते हैं।
    reason: referent_clarification
lexical_decisions:
- source_word: דַּבֵּר
  choice: कह
  rationale: पिएल आज्ञार्थक रूप को मूसा को दिए गए सीधे आदेश के रूप में स्वाभाविक और निकटता से व्यक्त करता है।
- source_word: וְיִנָּזְרוּ
  choice: अलग रहें
  rationale: निफ़ाल रूप यहाँ पवित्र वस्तुओं के संबंध में अपने को अलग रखने या उनसे दूर रहने का भाव देता है। ‘अलग रहें’ प्रतिवर्ती अर्थ को बनाए रखता है; प्रसंग आगे उन दशाओं को स्पष्ट करता है जिनमें याजकों को उनसे दूर रहना है।
- source_word: מִקָּדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की पवित्र वस्तुओं से
  rationale: ‘पवित्र वस्तुएँ’ קָדְשֵׁי की व्यापक उपासना-संबंधी अर्थ-सीमा को बनाए रखता है और इसे केवल ‘भेंटों’ तक सीमित नहीं करता।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: यह मानक हिब्रू राष्ट्रीय पदबंध है। आधुनिक हिन्दी में ‘इस्राएली’ पूरे समुदाय को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: יְחַלְּלוּ
  choice: अपवित्र न करें
  rationale: पिएल रूप का आशय किसी पवित्र वस्तु या नाम को साधारण अथवा अपवित्र ठहराना है। ‘अपवित्र करना’ हिन्दी में स्पष्ट और धर्मविधिक प्रसंग के अनुकूल है।
- source_word: שֵׁם קָדְשִׁי
  choice: मेरे पवित्र नाम
  rationale: यह संबंधवाचक पदबंध का सीधा, स्वाभाविक हिन्दी रूप है और परमेश्वर के नाम की पवित्रता को बनाए रखता है।
- source_word: אֲשֶׁר הֵם מַקְדִּשִׁים לִי
  choice: जिन्हें वे मेरे लिए पवित्र ठहराते हैं
  rationale: बहुवचन संबंधवाचक ‘जिन्हें’ इस उपवाक्य को निकटवर्ती अर्थगत बहुवचन ‘पवित्र वस्तुओं’ से जोड़ता है। ‘पवित्र ठहराते हैं’ मूल की पवित्रता-संबंधी शब्दावली को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय निजी नाम का हिन्दी लिप्यंतरण किया गया है, किसी उपाधि से उसका प्रतिस्थापन नहीं।
theological_decisions:
- issue: अֲשֶׁר הֵם מַקְדִּשִׁים לִי संबंधवाचक उपवाक्य का पूर्वपद
  choice: इसे ‘इस्राएलियों की पवित्र वस्तुओं’ से जोड़ा गया है।
  alternative: वाक्य-प्रवाह में इसे ‘मेरे पवित्र नाम’ से ढीले रूप में जोड़ा जा सकता है।
  rationale: व्याकरण और प्रसंग के अनुसार इस्राएली पवित्र वस्तुओं को याहवे के लिए पवित्र ठहराते हैं; उन्हीं के अनुचित व्यवहार से उसका पवित्र नाम अपवित्र होता है। हिन्दी में ‘जिन्हें’ इस संबंध को स्पष्ट करता है।
- issue: याजकों का पवित्र वस्तुओं से अलग रहना
  choice: आज्ञा को सामान्य शब्दों में रखा गया है और इस पद में कोई अतिरिक्त शर्त नहीं जोड़ी गई।
  alternative: इसे स्पष्ट रूप से केवल अशुद्ध अवस्था में पवित्र भेंटों से दूर रहने के रूप में अनूदित किया जा सकता है।
  rationale: आगे का प्रसंग इस आज्ञा की परिस्थितियाँ बताता है, पर इस पद में वे स्पष्ट रूप से नहीं कही गईं; इसलिए उन्हें मुख्य पाठ में आयात नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पवित्र वस्तुएँ’ विधि-संबंधी व्यापकता बचाता है; ‘याहवे’ को निजी नाम के रूप में रखा गया है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न [a], [b], [c] उपस्थित हैं।
