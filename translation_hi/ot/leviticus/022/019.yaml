  language: hi
  text: ताकि तुम स्वीकार किए जाओ, वह गोवंश, भेड़ों या बकरियों में से निर्दोष नर हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְצֹנְכֶם
  choice: तुम्हारी ओर से स्वीकार किए जाने के लिए
  rationale: बलिदान के स्वीकार्य होने का भाव व्यक्त करता है और प्रत्यय में निहित बहुवचन ‘तुम्हारी’ को बनाए रखता है।
- source_word: תָּמִים
  choice: निर्दोष
  rationale: बलिदानी पशु की शारीरिक अखंडता और दोषरहित दशा के लिए हिंदी बाइबलीय संदर्भ में स्वाभाविक शब्द है; इसका आशय नैतिक निष्पापता नहीं है।
- source_word: זָכָר
  choice: नर
  rationale: पशु के लिंग को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּבָּקָר
  choice: गाय-बैलों
  rationale: सामूहिक संज्ञा בקר को केवल ‘बैल’ कहने के बजाय गोवंश के व्यापक अर्थ में प्रस्तुत करता है।
- source_word: בַּכְּשָׂבִים וּבָעִזִּים
  choice: भेड़ों या बकरियों
  rationale: दोनों पशु-वर्गों को सामान्य आधुनिक हिंदी में स्पष्ट करता है; विकल्पों की सूची में ‘या’ स्वाभाविक है।
theological_decisions:
- issue: לִרְצֹנְכֶם में स्वीकार्यता का संबंध
  choice: तुम्हारी ओर से स्वीकार किए जाने के लिए
  alternative: तुम्हारी प्रसन्नता के लिए
  rationale: निकटवर्ती बलिदानी विधान में अर्थ चढ़ाने वालों की व्यक्तिगत प्रसन्नता से अधिक भेंट के उनकी ओर से स्वीकार किए जाने का है।
- issue: תָּמִים का स्वरूप
  choice: निर्दोष
  alternative: संपूर्ण / सही-सलामत
  rationale: यहाँ शब्द बलिदानी पशु में किसी शारीरिक दोष के न होने की शर्त बताता है; अनुवाद को नैतिक सिद्धता की शिक्षा नहीं बनाना चाहिए।
