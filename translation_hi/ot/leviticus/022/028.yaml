  yaml_path: translation/ot/leviticus/022/028.yaml
  text: Whether an ox or a sheep, you shall not slaughter it and its young on one day.
translation:
  language: hi
  text: चाहे बैल हो या भेड़, उस पशु और उसके बच्चे का एक ही दिन वध न करना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसे और उसके पुत्र को’ है। यहाँ आशय किसी पशु और उसकी संतान से है। שֶׂה का अर्थ संदर्भानुसार भेड़ या बकरी भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹר
  choice: बैल
  rationale: यह शब्द गोवंश के एक पशु को सूचित करता है। इस कानूनी वाक्य में ‘बैल’ सहज एकवचन है; ‘गाय-बैल’ मूल से अधिक विस्तार करता।
- source_word: שֶׂה
  choice: भेड़
  rationale: यह शब्द भेड़ या बकरी जैसे छोटे पालतू पशु के लिए आ सकता है। यहाँ गोवंश के विपरीत वर्ग के प्रतिनिधि रूप में ‘भेड़’ स्पष्ट और स्वाभाविक है, यद्यपि मूल की व्यापकता को पादटिप्पणी में बताया गया है।
- source_word: אֹתוֹ וְאֶת־בְּנוֹ
  choice: उसे और उसके बच्चे को
  rationale: शाब्दिक अर्थ ‘उसे और उसके पुत्र को’ है। पशु के संदर्भ में ‘बच्चे’ स्वाभाविक है और मूल में स्पष्ट न की गई मातृ-संबंधी व्याख्या नहीं जोड़ता।
- source_word: תִשְׁחֲטוּ
  choice: वध न करना
  rationale: שׁחט पशुओं को काटकर मारने, विशेषकर बलिदान या कानूनी संदर्भ में वध करने का मानक क्रियापद है। ‘मारना’ बहुत व्यापक और ‘काटना’ अकेले अस्पष्ट होता।
- source_word: בְּיוֹם אֶחָד
  choice: एक ही दिन
  rationale: शाब्दिक रूप से ‘एक दिन में/एक दिन पर’; हिन्दी कानूनी निषेध में ‘एक ही दिन’ स्वाभाविक रूप से उसी दिन दोनों के वध की मनाही व्यक्त करता है।
- source_word: וְ...אוֹ
  choice: चाहे ... हो या
  rationale: आरंभिक संयोजक और אוֹ मिलकर कानूनी मामले के दो विकल्प प्रस्तुत करते हैं; हिन्दी में ‘चाहे ... हो या’ इस संरचना को सहज बनाता है।
theological_decisions:
- issue: पशु और उसकी संतान के संबंध का लिंग
  choice: माता या नर अभिभावक को स्पष्ट किए बिना ‘उसे और उसके बच्चे को’
  alternative: ‘माँ और उसके बच्चे को’
  rationale: इब्रानी सर्वनाम और ‘पुत्र’ की अभिव्यक्ति इस पद में पशु को स्पष्टतः मादा नहीं कहती; इसलिए अनावश्यक लिंग-विशिष्ट व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण कानूनी शैली। ‘वध’ बलिदान-संबंधी संदर्भ की तकनीकी गंभीरता बनाए रखता है; ‘न करना’ सीधे विधिक निषेध के रूप में स्वाभाविक है।
