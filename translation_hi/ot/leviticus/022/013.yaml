source:
  edition: WLC
  text: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒ וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙ כִּ/נְעוּרֶ֔י/הָ מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל וְ/כָל זָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/013.yaml
  text: But if a priest’s daughter becomes a widow or divorced[a], and has no offspring, and returns to her father’s house as in her youth, she may eat from her father’s food[b]; but no outsider may eat of it.
translation:
  language: hi
  text: पर यदि याजक की बेटी विधवा हो जाए या तलाकशुदा हो जाए, और उसकी कोई संतान न हो, और वह अपने पिता के घर लौट आए, जैसे वह अपनी युवावस्था में थी, तो वह अपने पिता के भोजन[a] में से खा सकती है; पर कोई भी अनधिकृत व्यक्ति[b] उसमें से न खाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “अपने पिता की रोटी।” यहाँ “रोटी” से सम्भवतः याजक के घराने का भोजन व्यापक रूप से अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या “कोई बाहरी व्यक्ति।” इब्रानी शब्द उस व्यक्ति को सूचित करता है जो अनुमति पाए हुए याजकीय दायरे से बाहर हो; वह अनिवार्य रूप से किसी दूसरी जाति का व्यक्ति नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַת כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה
  choice: पर यदि किसी याजक की बेटी ... हो जाए
  rationale: पूर्ववर्ती विधान से विरोध को दिखाने के लिए וּ को स्वाभाविक हिन्दी में ‘पर’ और कानूनी शर्त כִּי תִהְיֶה को ‘यदि ... हो जाए’ से व्यक्त किया गया है।
- source_word: אַלְמָנָ֣ה וּ/גְרוּשָׁ֗ה
  choice: विधवा हो जाए या उसका तलाक हो जाए
  rationale: हिब्रू וְ दो वैकल्पिक स्थितियाँ गिनाता है; हिन्दी में ‘या’ यह स्पष्ट करता है कि दोनों स्थितियाँ एक साथ आवश्यक नहीं हैं। ‘उसका तलाक हो जाए’ גרושה की निष्क्रिय स्थिति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְ/זֶרַע֮ אֵ֣ין לָ/הּ֒
  choice: और उसकी कोई संतान न हो
  rationale: זֶרַע का शाब्दिक अर्थ ‘बीज’ है, पर इस पारिवारिक-कानूनी संदर्भ में यह संतान/वंशज को दर्शाता है; ‘संतान’ लिंग और संख्या को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְ/שָׁבָ֞ה אֶל בֵּ֤ית אָבִ֨י/הָ֙ כִּ/נְעוּרֶ֔י/הָ
  choice: और वह अपनी युवावस्था की तरह अपने पिता के घर लौट आए
  rationale: שׁוב का लौटना और כִּנְעוּרֶיהָ द्वारा उसकी पहले की, पिता के घर वाली अवस्था से तुलना—दोनों सुरक्षित रखे गए हैं।
- source_word: מִ/לֶּ֥חֶם אָבִ֖י/הָ תֹּאכֵ֑ל
  choice: तो वह अपने पिता के भोजन[a] में से खा सकती है
  rationale: לֶחֶם शाब्दिक रूप से ‘रोटी’ है, किंतु यहाँ याजकीय घराने के खाद्य प्रबंध का व्यापक संकेत देता है। कानूनी अनुमति को ‘खा सकती है’ से व्यक्त किया गया है।
- source_word: וְ/כָל זָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ
  choice: पर कोई भी अनधिकृत व्यक्ति[b] उसमें से न खाए
  rationale: याजकीय विधान में זָר जातीय ‘विदेशी’ नहीं, बल्कि अनुमत याजकीय दायरे से बाहर व्यक्ति है। निषेध को स्वाभाविक विधिक हिन्दी ‘न खाए’ में रखा गया है।
theological_decisions:
- issue: याजक के पिता के לֶחֶם का आशय
  choice: ‘भोजन’—याजकीय घराने के उपलब्ध खाद्य प्रबंध का व्यापक संकेत
  alternative: शाब्दिक ‘रोटी’
  rationale: लैव्यव्यवस्था 22 का विषय पवित्र वस्तुओं/याजकीय खाद्य को खाने की पात्रता है। ‘भोजन’ आधुनिक पाठक को अर्थ स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- issue: זָר की पहचान
  choice: ‘अनधिकृत व्यक्ति’—जो खाने की अनुमति वाले याजकीय दायरे से बाहर हो
  alternative: ‘पराया’, ‘अजनबी’ या ‘विदेशी’
  rationale: यह शब्द यहाँ जातीयता के बजाय धार्मिक-कानूनी पात्रता दर्शाता है; इसलिए ऐसा अनुवाद चुना गया है जो किसी विदेशी जाति का अर्थ आरोपित न करे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कानूनी शैली अपनाई गई है। ‘याजक’, ‘विधवा’, ‘संतान’ और ‘युवावस्था’ परिचित बाइबलीय-साहित्यिक शब्द हैं; कठिन याजकीय पद זָר को मुख्य पाठ में अर्थ-स्पष्ट ‘अनधिकृत व्यक्ति’ और पादटिप्पणी में वैकल्पिक ‘बाहरी व्यक्ति’ से समझाया गया है।
