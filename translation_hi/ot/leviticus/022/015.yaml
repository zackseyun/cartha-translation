source:
  edition: WLC
  text: וְ/לֹ֣א יְחַלְּל֔וּ אֶת קָדְשֵׁ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ת אֲשֶׁר יָרִ֖ימוּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/022/015.yaml
  text: They shall not profane the holy things of the sons of Israel[b][a], which they lift up to Yahweh.
translation:
  language: hi
  text: वे इस्राएलियों की उन पवित्र वस्तुओं को अपवित्र न करें, जिन्हें इस्राएली यहोवा को अर्पित करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְחַלְּלוּ
  choice: अपवित्र करें
  rationale: पूजा-संबंधी संदर्भ में पिएल रूप का अर्थ किसी पवित्र वस्तु की पवित्रता भंग करना है; ‘अपवित्र करना’ पवित्र और साधारण के बीच के विरोध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: קָדְשֵׁי
  choice: पवित्र वस्तुओं
  rationale: शाब्दिक अर्थ ‘पवित्र वस्तुएँ’ है। इसे ‘भेंटें’ तक सीमित न करके मूल की व्यापकता और संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह मानक वाचाई जातिनाम है; आधुनिक हिन्दी में ‘इस्राएलियों’ स्वाभाविक है और पूरे समुदाय को सूचित करता है।
- source_word: אֲשֶׁר יָרִימוּ
  choice: जिन्हें वे … अर्पित करते हैं
  rationale: रום के हिफ़ील का मूल बिंब ‘ऊपर उठाना’ है, पर बलिदानी संदर्भ में इसका अर्थ भेंट चढ़ाना अथवा प्रस्तुत करना है; ‘अर्पित करते हैं’ साधारण हिन्दी में आशय स्पष्ट रखता है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וְלֹא
  choice: न करें
  rationale: विधिक संदर्भ में नकारयुक्त अपूर्ण क्रिया निषेध व्यक्त करती है; हिन्दी में ‘न करें’ उपयुक्त और गरिमापूर्ण है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत वाचाई नाम सीधे आया है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नामरूप है और इसे केवल ‘प्रभु’ उपाधि में नहीं बदलता।
- issue: क्रिया का कर्ता
  choice: वे
  alternative: याजक
  rationale: इस पद में कर्ता सर्वनाम के रूप में निहित है और उसका संदर्भ पूर्ववर्ती पदों से मिलता है। पाठ में ‘याजक’ जोड़ना अर्थ स्पष्ट करता, पर मूल पद से अधिक स्पष्टता लाता; इसलिए सर्वनाम रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त विधिक शैली और पूजा-संबंधी गरिमा। ‘पवित्र वस्तुओं’ मूल की व्यापक अभिव्यक्ति को बनाए रखता है, जबकि ‘अर्पित करते हैं’ बलिदानी संदर्भ में क्रिया का स्वाभाविक हिन्दी अर्थ देता है।
