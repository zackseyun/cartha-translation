  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जुबली’ स्थापित बाइबलीय कानूनी पद के रूप में रखा गया है; फुटनोट इब्रानी मुहावरे और उसके संपत्ति-संबंधी आशय को स्पष्ट करते हैं।
