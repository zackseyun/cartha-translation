  text: וּ/בָתֵּ֣י הַ/חֲצֵרִ֗ים אֲשֶׁ֨ר אֵין לָ/הֶ֤ם חֹמָה֙ סָבִ֔יב עַל שְׂדֵ֥ה הָ/אָ֖רֶץ יֵחָשֵׁ֑ב גְּאֻלָּה֙ תִּהְיֶה לּ֔/וֹ וּ/בַ/יֹּבֵ֖ל יֵצֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/031.yaml
  text: But the houses of the villages that have no wall around them shall be regarded as the fields of the land[a]; redemption shall be available for them[b], and in the Jubilee they shall go out.
translation:
  language: hi
  text: परन्तु जिन गाँवों के चारों ओर दीवार नहीं है, उनके घर देश के खेतों के समान गिने जाएँगे[a]। उन्हें छुड़ाने का अधिकार रहेगा, और जुबली के वर्ष में वे छूट जाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भूमि के खेत के रूप में गिना जाएगा”; अर्थात ऐसे गाँवों के घरों के साथ कानूनी रूप से चारदीवारी वाले नगरों के घरों जैसा नहीं, बल्कि ग्रामीण भूमि जैसा व्यवहार होगा।
    reason: lexical_alternative
  - marker: b
    text: या, “जुबली में वह निकल जाएगा”; अर्थात जुबली के वर्ष में संपत्ति पर लगा बंधन समाप्त हो जाएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתֵּי הַחֲצֵרִים
  choice: परन्तु ... गाँवों ... के घर
  rationale: חֲצֵרִים यहाँ ग्रामीण बस्तियों या गाँवों को सूचित करता है। अगला उपवाक्य स्पष्ट करता है कि ये चारदीवारी वाले नगर नहीं हैं, इसलिए संज्ञा में ही ‘बिना दीवार वाले’ जोड़ना आवश्यक नहीं है।
- source_word: אֲשֶׁר אֵין לָהֶם חֹמָה סָבִיב
  choice: जिन गाँवों के चारों ओर दीवार नहीं है
  rationale: यह अनुवाद חֹמָה और סָבִיב दोनों को सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַל שְׂדֵה הָאָרֶץ יֵחָשֵׁב
  choice: देश के खेत के समान गिने जाएँगे
  rationale: 'इब्रानी का शाब्दिक कानूनी वर्गीकरण बनाए रखा गया है: ऐसे घर चारदीवारी वाले नगरों के घरों के बजाय ग्रामीण भूमि के समान माने जाते हैं।'
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: उन्हें छुड़ाने का अधिकार रहेगा
  rationale: גְּאֻלָּה संपत्ति को मूल्य देकर वापस लेने या छुड़ाने के अधिकार को दर्शाता है। हिन्दी में बहुवचन ‘उन्हें’ पूर्ववर्ती ‘घर’ के अनुसार स्वाभाविक है, जबकि इब्रानी संपत्ति को एक वर्ग के रूप में एकवचन में रखता है।
- source_word: וּבַיֹּבֵל יֵצֵא
  choice: और जुबली के वर्ष में वे छूट जाएँगे
  rationale: יֵצֵא का मूल अर्थ ‘निकलना’ है, पर इस भूमि-कानून में आशय जुबली पर संपत्ति के बंधन से छूटकर लौटने का है। ‘छूट जाएँगे’ कानूनी परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है और ‘घर’ के अनुसार बहुवचन रखता है।
