source:
  edition: WLC
  text: וְ/צִוִּ֤יתִי אֶת בִּרְכָתִ/י֙ לָ/כֶ֔ם בַּ/שָּׁנָ֖ה הַ/שִּׁשִּׁ֑ית וְ/עָשָׂת֙ אֶת הַ/תְּבוּאָ֔ה לִ/שְׁלֹ֖שׁ הַ/שָּׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/021.yaml
  text: Then I will command my blessing for you in the sixth year[a], and it will produce the yield for three years.
translation:
  language: hi
  text: तब मैं छठे वर्ष में तुम्हारे लिए अपनी आशीष का आदेश दूँगा, और तीन वर्षों के लिए उपज होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצִוִּיתִי
  choice: तब मैं…आज्ञा दूँगा
  rationale: प्रथम पुरुष एकवचन में צוה दैवी आदेश को व्यक्त करता है। प्रसंग में यह पद 20वें पद की आशंका का उत्तर देता है, इसलिए וְ को स्वाभाविक हिन्दी में ‘तब’ से व्यक्त किया गया है।
- source_word: אֶת־בִּרְכָתִי
  choice: अपनी आशीष की
  rationale: בְּרָכָה यहाँ परमेश्वर द्वारा दी गई ऐसी कृपा है जिसका परिणाम कृषि की बहुतायत है। ‘अपनी आशीष’ व्यापक अर्थ को बनाए रखता है।
- source_word: לָכֶם
  choice: तुम्हारे लिए
  rationale: ל लाभ पाने वालों को चिह्नित करता है; ‘तुम्हारे लिए’ आधुनिक हिन्दी में सहज लाभार्थक प्रयोग है।
- source_word: בַּשָּׁנָה הַשִּׁשִּׁית
  choice: छठे वर्ष में
  rationale: यह विश्राम-वर्ष के चक्र के संबंध में प्रतिज्ञात आशीष का समय सीधे बताता है।
- source_word: וְעָשָׂת
  choice: और वह…उत्पन्न करेगा
  rationale: स्त्रीलिंग एकवचन क्रिया का निहित कर्ता निकटवर्ती ‘वर्ष’ समझा जा सकता है। हिन्दी में ‘वर्ष’ पुल्लिंग होने के कारण ‘वह…करेगा’ रखा गया है; असाधारण उपज आशीष के फल के रूप में व्यक्त होती है।
- source_word: הַתְּבוּאָה
  choice: उपज
  rationale: תְּבוּאָה कृषि से प्राप्त पैदावार या उपज को दर्शाता है। ‘उपज’ आधुनिक हिन्दी में संक्षिप्त, स्पष्ट और प्रसंगानुकूल है।
- source_word: לִשְׁלֹשׁ הַשָּׁנִים
  choice: तीन वर्षों के लिए
  rationale: इब्रानी वाक्यांश तीन वर्षों तक चलने वाली अथवा उनके लिए पर्याप्त पैदावार को इंगित करता है। ‘तीन वर्षों के लिए’ पर्याप्तता को समझने देता है, पर उसे स्पष्ट रूप से जोड़कर अर्थ का निर्णय नहीं करता।
theological_decisions:
- issue: प्रतिज्ञात आशीष का स्वरूप
  choice: परमेश्वर का सीधा आदेश, जिसके फलस्वरूप असाधारण कृषि-उपज होती है
  alternative: सामान्य ईश्वरीय प्रबंध का केवल व्यापक कथन
  rationale: ‘मैं…आज्ञा दूँगा’ और ‘अपनी आशीष’ का संयोजन इसे सामान्य फसल-चक्र का वर्णन नहीं, बल्कि परमेश्वर की विशिष्ट प्रतिज्ञा के रूप में प्रस्तुत करता है।
- issue: וְעָשָׂת का व्याकरणिक कर्ता
  choice: हिन्दी में निकटवर्ती ‘छठा वर्ष’ को ‘वह’ के रूप में व्यक्त करना
  alternative: भूमि या आशीष को निहित कर्ता मानना
  rationale: इब्रानी स्त्रीलिंग क्रिया से कर्ता कुछ हद तक अस्पष्ट रहता है और भूमि, वर्ष अथवा आशीष के फल से संबंध समझा जा सकता है। अनुवाद निकटतम व्यक्त संज्ञा ‘वर्ष’ को स्वाभाविक हिन्दी में ग्रहण करता है, बिना इस कृषि-फल को परमेश्वर की आशीष से अलग किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आशीष की आज्ञा दूँगा’ जानबूझकर कुछ औपचारिक है, ताकि मूल के दैवी आदेश की शक्ति बनी रहे। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
