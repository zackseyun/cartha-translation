  yaml_path: translation/ot/leviticus/025/015.yaml
  text: According to the number of years after the Jubilee[a], you shall buy from your fellow; according to the number of years of crops he shall sell to you.
translation:
  language: hi
  text: जुबली के बाद बीते हुए वर्षों की संख्या के अनुसार तुम अपने साथी से खरीदोगे; और उपज के वर्षों[a] की संख्या के अनुसार वह तुम्हें बेचेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ है, “उपजों या कटनियों के वर्षों की संख्या के अनुसार।” आशय यह है कि मूल्य अगली जुबली तक बचे उन वर्षों की संख्या पर आधारित हो जिनमें भूमि से उपज मिल सकती है, न कि भूमि के स्थायी हस्तांतरण पर।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר שָׁנִים אַחַר הַיּוֹבֵל
  choice: जुबली के बाद जितने वर्ष बीत चुके हों, उनकी संख्या के अनुसार
  rationale: בְּמִסְפַּר माप या गणना के मानदंड को व्यक्त करता है। हिंदी में यह रूप कानूनी निर्देश को स्वाभाविक बनाता है और אַחַר הַיּוֹבֵל के कालगत संबंध को स्पष्ट रखता है।
- source_word: תִּקְנֶה
  choice: तुम ... मोल लेना
  rationale: द्वितीय पुरुष एकवचन अपूर्ण क्रिया यहाँ विधिक निर्देश देती है। ‘मोल लेना’ आधुनिक पाठक के लिए समझने योग्य है और क्रय के अर्थ को स्पष्ट करता है।
- source_word: מֵאֵת עֲמִיתֶךָ
  choice: अपने साथी से
  rationale: עָמִית कानूनी संदर्भ में समुदाय के सह-सदस्य या साथी को दर्शाता है। ‘साथी’ जातीय अर्थ जोड़े बिना पारस्परिक संबंध बनाए रखता है।
- source_word: בְּמִסְפַּר שְׁנֵי תְבוּאֹת
  choice: उपज के वर्षों की संख्या के अनुसार
  rationale: शाब्दिक अर्थ ‘उपजों/फसलों के वर्ष’ है। यह अभिव्यक्ति कैलेंडर वर्षों से अधिक उन वर्षों पर ध्यान रखती है जिनमें भूमि से उपज प्राप्त हो सकती है।
- source_word: יִמְכָּר לָךְ
  choice: वह तुम्हें बेचे
  rationale: तृतीय पुरुष एकवचन क्रिया खरीदार के निर्देश के समांतर विक्रेता की कार्रवाई बताती है; हिंदी में विधिक उपवाक्य के रूप में इसे संक्षिप्त रखा गया है।
theological_decisions:
- issue: भूमि की बिक्री स्थायी हस्तांतरण है या जुबली तक की उपज का मूल्यांकन
  choice: मुख्य पाठ में ‘उपज के वर्षों’ को बनाए रखा और व्याख्या पादटिप्पणी में दी
  alternative: इसे सीधे ‘अगली जुबली तक बचे वर्षों’ के अनुसार बिक्री कहना
  rationale: मूल इब्रानी अगली जुबली का उल्लेख इस वाक्य में प्रत्यक्ष रूप से नहीं करता; संदर्भ से मिलने वाले आर्थिक आशय को पादटिप्पणी में स्पष्ट करना मूल की अभिव्यक्ति और संदर्भगत अर्थ दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिंदी। विधिक निर्देश का स्वर बनाए रखने के लिए ‘मोल लेना’ और ‘बेचे’ का प्रयोग किया गया है। ‘जुबली’ लैव्यव्यवस्था 25 के तकनीकी पर्व-वर्ष के लिए स्थापित रूप में रखा गया है।
