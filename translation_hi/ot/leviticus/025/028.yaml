base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/028.yaml
  text: But if his hand does not find enough to restore it to him[a], then what he sold shall remain in the hand of the one who bought it until the year of Jubilee; and it shall go out in the Jubilee, and he shall return to his property.
translation:
  language: hi
  text: परन्तु यदि उसके पास उसे वापस पाने के लिए पर्याप्त साधन न हों, तो उसकी बेची हुई भूमि जुबली के वर्ष तक खरीदार के अधिकार में रहेगी। जुबली में वह भूमि उसके अधिकार से निकल जाएगी, और वह अपनी भूमि-संपत्ति पर लौट आएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह भूमि उसके अधिकार में लौट आएगी।” अन्तिम इब्रानी क्रिया का कर्ता विक्रेता के बजाय बेची हुई भूमि भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מָצְאָה יָדוֹ דֵּי
  choice: उसके पास ... पर्याप्त धन न हो
  rationale: शाब्दिक मुहावरा ‘उसका हाथ पर्याप्त न पाए’ साधनों की कमी बताता है। भूमि छुड़ाने के आर्थिक संदर्भ में ‘पर्याप्त धन न हो’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: הָשִׁיב לוֹ
  choice: उसे छुड़ाने के लिए
  rationale: यहाँ आशय खरीदार को आवश्यक राशि देकर बेची हुई पैतृक भूमि वापस प्राप्त करने से है; लैव्यव्यवस्था 25 के कानूनी संदर्भ में ‘छुड़ाना’ इस प्रक्रिया को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: מִמְכָּרוֹ
  choice: उसकी बेची हुई भूमि
  rationale: संज्ञा बिक्री अथवा बेची हुई वस्तु को सूचित कर सकती है। निकटवर्ती संदर्भ खेत या पैतृक भूमि के विक्रय का है, इसलिए ‘बेची हुई भूमि’ निहित विषय को स्पष्ट करता है।
- source_word: בְּיַד הַקֹּנֶה אֹתוֹ
  choice: उसे खरीदने वाले के अधिकार में
  rationale: ‘हाथ में’ अधिकार या कब्जे का इब्रानी मुहावरा है। हिन्दी में ‘अधिकार में’ कानूनी अर्थ को स्वाभाविक ढंग से प्रकट करता है।
- source_word: שְׁנַת הַיּוֹבֵל
  choice: जुबली का वर्ष
  rationale: यह स्रोत की संरचना के निकट रहते हुए हिन्दी बाइबलीय-कानूनी शब्दावली में समझने योग्य है।
- source_word: וְיָצָא בַּיּוֹבֵל
  choice: जुबली में वह भूमि उसके अधिकार से निकल जाएगी
  rationale: יצא के मूल अर्थ ‘निकलना’ को बनाए रखा गया है और प्रसंग के आधार पर खरीदार के अधिकार से निकलने का आशय स्पष्ट किया गया है।
- source_word: וְשָׁב לַאֲחֻזָּתוֹ
  choice: वह अपनी पैतृक सम्पत्ति में लौट जाएगा
  rationale: אֲחֻזָּה यहाँ विरासत में मिली स्थायी भू-सम्पत्ति है। ‘पैतृक सम्पत्ति’ इस कानूनी-सामाजिक अर्थ को सामान्य हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: अन्तिम क्रिया וְשָׁב का कर्ता
  choice: 'मूल विक्रेता/स्वामी: ‘वह अपनी पैतृक सम्पत्ति में लौट जाएगा’'
  alternative: 'बेची हुई भूमि: ‘वह भूमि उसकी पैतृक सम्पत्ति में लौट जाएगी’'
  rationale: पुल्लिंग एकवचन क्रिया व्याकरणतः व्यक्ति या बेची हुई सम्पत्ति, दोनों की ओर संकेत कर सकती है। जुबली-विधान के व्यापक संदर्भ में व्यक्ति का अपनी पैतृक सम्पत्ति में लौटना अधिक सम्भावित है, पर वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। इब्रानी आर्थिक मुहावरे को शब्दशः रखने के बजाय उसका अर्थ दिया गया है; भूमि-विमोचन और जुबली की कानूनी शब्दावली को बनाए रखा गया है।
