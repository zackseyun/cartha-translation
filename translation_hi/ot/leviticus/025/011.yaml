id: LEV.25.11
reference: Leviticus 25:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יוֹבֵ֣ל הִ֗וא שְׁנַ֛ת הַ/חֲמִשִּׁ֥ים שָׁנָ֖ה תִּהְיֶ֣ה לָ/כֶ֑ם לֹ֣א תִזְרָ֔עוּ וְ/לֹ֤א תִקְצְרוּ֙ אֶת סְפִיחֶ֔י/הָ וְ/לֹ֥א תִבְצְר֖וּ אֶת נְזִרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/011.yaml
  text: It is a Jubilee[a]; the fiftieth year shall be for you. You shall not sow, and you shall not reap its volunteer growth[c][b], and you shall not gather the grapes of its unpruned vines.
translation:
  language: hi
  text: यह जुबली है; पचासवाँ वर्ष तुम्हारे लिए होगा। तुम न बोओ, न उस वर्ष की अपने-आप उगी उपज काटो, और न उसकी बिना छाँटी बेलों के अंगूर तोड़ो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹבֵל
  choice: जुबली का वर्ष
  rationale: लैव्यव्यवस्था 25 में यह शब्द नरसिंगे के बजाय विशेष पवित्र वर्ष की व्यवस्था को दर्शाता है; ‘जुबली’ स्थापित नाम को सुरक्षित रखता है और ‘का वर्ष’ हिन्दी में अर्थ स्पष्ट करता है।
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: पचासवाँ वर्ष
  rationale: यह हिब्रू पदबंध का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: תִּהְיֶה לָכֶם
  choice: तुम्हारे लिए ऐसा ही होगा
  rationale: ‘तुम्हारे लिए होगा’ के दत्तिव भाव को बनाए रखते हुए ‘ऐसा ही’ पहले वाक्य के जुबली-वर्ष से संबंध स्पष्ट करता है, बिना कोई नया अर्थ जोड़े।
- source_word: לֹא תִזְרָעוּ
  choice: तुम न बोना
  rationale: विधिक निषेध को आधुनिक, सीधी और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא תִקְצְרוּ
  choice: न ... उपज काटना
  rationale: खेत की फसल काटने वाले कृषि-कार्य को बाद के अंगूर तोड़ने से अलग रखता है।
- source_word: סְפִיחֶיהָ
  choice: अपने-आप उगी हुई उसकी उपज
  rationale: उस उपज को स्पष्ट करता है जो बिना बोए स्वयं उग आती है; हिन्दी पाठक के लिए तकनीकी शब्द की अपेक्षा यह अधिक सहज है।
- source_word: לֹא תִבְצְרוּ
  choice: न ... अंगूर तोड़ना
  rationale: यह क्रिया विशेष रूप से अंगूर की कटाई के लिए प्रयुक्त है; ‘अंगूर तोड़ना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: נְזִרֶיהָ
  choice: उसकी बिना छाँटी बेलों के अंगूर
  rationale: कृषि-संदर्भ में यह ऐसी बेलों की बढ़त को दर्शाता है जिन्हें अलग छोड़ दिया गया या सँवारा नहीं गया; वस्तु के रूप में अंगूरों को स्पष्ट करना בצר के साथ अर्थपूर्ण है।
theological_decisions:
- issue: יוֹבֵל का संस्थागत अर्थ
  choice: जुबली का वर्ष
  alternative: नरसिंगे का वर्ष
  rationale: इस अध्याय के विधिक संदर्भ में शब्द विशेष पचासवें वर्ष का नाम है, यद्यपि इसका संबंध नरसिंगे से है; यहाँ ‘नरसिंगा’ चुनना संदर्भगत अर्थ को भटका देगा।
- issue: נְזִרֶיהָ की कृषि-संदर्भगत व्याख्या
  choice: बिना छाँटी बेलें
  alternative: अलग रखी हुई/समर्पित बढ़त
  rationale: मूल शब्द में अलग छोड़े जाने का भाव है, पर दाख की बारी और अंगूर तोड़ने के संदर्भ में बिना छाँटी, असँवारी बेलें अभिप्रेत हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। आदेशों में ‘तुम न ...’ का प्रयोग विधिक दृढ़ता और पठनीयता दोनों बनाए रखता है। ‘जुबली’ को संस्थागत नाम की तरह रखा गया है; अनावश्यक अंग्रेज़ी-आधारित पदावली से बचा गया है।
