  text: כִּ/שְׂכִ֥יר שָׁנָ֛ה בְּ/שָׁנָ֖ה יִהְיֶ֣ה עִמּ֑/וֹ לֹֽא יִרְדֶּ֥/נּֽוּ בְּ/פֶ֖רֶךְ לְ/עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/053.yaml
  text: Like a hired worker year by year he shall be with him[a]; he shall not rule over him harshly in your sight.
translation:
  language: hi
  text: वह साल-दर-साल उसके साथ भाड़े के मज़दूर के समान रहेगा[a]; स्वामी तुम्हारी आँखों के सामने उस पर कठोरता से अधिकार न चलाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भाड़े के सेवक की तरह, वह साल-दर-साल उसके साथ रहेगा।”
    reason: כִּשְׂכִיר के लिए अधिक पारंपरिक ‘सेवक’ एक वैकल्पिक शब्द है; मुख्य पाठ का ‘भाड़े का मज़दूर’ आधुनिक हिन्दी में अधिक सटीक है।
lexical_decisions:
- source_word: כִּשְׂכִיר
  choice: भाड़े के मज़दूर के समान
  rationale: כְּ तुलना व्यक्त करता है और שָׂכִיר मजदूरी पर रखे गए श्रमिक को दर्शाता है, दास को नहीं। यह पदबंध आधुनिक हिन्दी में स्पष्ट है और मूल तुलना को बनाए रखता है।
- source_word: שָׁנָה בְּשָׁנָה
  choice: साल-दर-साल
  rationale: यह मुहावरा हर वर्ष जारी रहने वाली स्थिति का बोध कराता है; ‘साल-दर-साल’ सहज हिन्दी में उसके वितरणात्मक अर्थ को सुरक्षित रखता है।
- source_word: יִהְיֶה עִמּוֹ
  choice: उसके साथ रहेगा
  rationale: मूल अर्थ ‘उसके साथ होगा’ है। हिन्दी में ‘रहेगा’ स्वाभाविक है और ‘सेवा करेगा’ जैसी अनकही बात नहीं जोड़ता।
- source_word: לֹא יִרְדֶּנּוּ
  choice: वह ... उस पर ... शासन न करे
  rationale: רדה का सामान्य अर्थ शासन करना या अधिकार चलाना है। यह चयन स्वामी द्वारा प्रभुत्व के प्रयोग को व्यक्त करता है, बिना अर्थ को केवल काम करवाने तक सीमित किए।
- source_word: בְּפֶרֶךְ
  choice: कठोरता से
  rationale: यह शब्द कठोर और निर्दयी व्यवहार, विशेषतः कठोर श्रम-व्यवस्था, को सूचित करता है। ‘कठोरता से’ शासन करने की क्रिया के साथ स्वाभाविक बैठता है।
- source_word: לְעֵינֶיךָ
  choice: तुम्हारी आँखों के सामने
  rationale: यह मूल के दृश्य-साक्ष्य वाले मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है और संबोधित व्यक्ति की निगरानी तथा उत्तरदायित्व को व्यक्त करता है।
theological_decisions:
- issue: परदेशी स्वामी के अधीन इस्राएली की स्थिति
  choice: उसकी तुलना भाड़े के मज़दूर से की गई है, उसे दास के रूप में परिभाषित नहीं किया गया।
  alternative: ‘भाड़े के सेवक के समान’
  rationale: संदर्भ में निवासी परदेशी के हाथ बिके इस्राएली के व्यवहार को नियमित किया गया है। שָׂכִיר अस्थायी मजदूरी वाले श्रमिक की छवि देता है; इसलिए अनावश्यक रूप से संपत्ति-सदृश दासता का अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; कानूनी निर्देश की गरिमा बनाए रखते हुए सामान्य पाठक के लिए सहज शब्दावली। ‘भाड़े का मज़दूर’ स्पष्ट और समकालीन है; ‘कठोरता से शासन’ मूल के शासन-संबंधी क्रिया और कठोर व्यवहार दोनों को सुरक्षित रखता है।
