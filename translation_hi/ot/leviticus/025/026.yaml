id: LEV.25.26
reference: Leviticus 25:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּ֛י לֹ֥א יִֽהְיֶה לּ֖/וֹ גֹּאֵ֑ל וְ/הִשִּׂ֣יגָה יָד֔/וֹ וּ/מָצָ֖א כְּ/דֵ֥י גְאֻלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/026.yaml
  text: But if a man has no redeemer[a], and his hand attains enough and he finds sufficient means for his redemption[b],
translation:
  language: hi
  text: परन्तु यदि किसी पुरुष का कोई छुड़ानेवाला[a] न हो, और उसके पास साधन आ जाएँ और वह अपनी भूमि छुड़ाने के लिए पर्याप्त धन पा ले,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात निकट संबंधी छुड़ानेवाला, जिसे परिवार की भूमि वापस छुड़ाने का अधिकार या दायित्व होता था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका हाथ पहुँच जाए और वह उसके छुड़ाने भर पा ले।” “हाथ पहुँच जाना” इब्रानी मुहावरा है, जिसका अर्थ पर्याप्त साधन हो जाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ כִּי
  choice: परन्तु यदि किसी पुरुष
  rationale: यहाँ כִּי शर्त प्रस्तुत करता है। אִישׁ का एकवचन पुल्लिंग अर्थ बनाए रखते हुए पिछले प्रसंग से विरोधात्मक संबंध के लिए ‘परन्तु’ स्वाभाविक है।
- source_word: לֹא יִהְיֶה לּוֹ גֹּאֵל
  choice: उसका कोई छुड़ानेवाला न हो
  rationale: גֹּאֵל निकट संबंधी को सूचित करता है जिसे परिवार की भूमि छुड़ाने का अधिकार या दायित्व था। मुख्य पाठ में संक्षिप्त ‘छुड़ानेवाला’ रखा गया है और पारिवारिक आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְהִשִּׂיגָה יָדוֹ
  choice: वह स्वयं इतना समर्थ हो जाए
  rationale: शाब्दिक रूप से ‘उसका हाथ पहुँच जाए’; यह इब्रानी मुहावरा पर्याप्त आर्थिक सामर्थ्य प्राप्त होने का संकेत देता है। हिंदी में अर्थ को स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: וּמָצָא כְּדֵי גְאֻלָּתוֹ
  choice: अपने छुटकारे के लिए आवश्यक धन जुटा ले
  rationale: מָצָא का मूल अर्थ ‘पाना’ है, जबकि כְּדֵי पर्याप्त मात्रा और גְאֻלָּה यहाँ संपत्ति को वापस छुड़ाने की कानूनी-आर्थिक प्रक्रिया बताते हैं। ‘आवश्यक धन जुटा ले’ संदर्भगत भाव को स्पष्ट करता है।
theological_decisions:
- issue: גֹּאֵל और גְאֻלָּה का अर्थक्षेत्र
  choice: छुड़ानेवाला / छुटकारा
  alternative: कुटुम्बी-छुड़ानेवाला / भूमि को वापस मोल लेना
  rationale: मूल शब्दावली की व्यापकता बनाए रखी गई है, पर पादटिप्पणी स्पष्ट करती है कि इस व्यवस्था में बात मुख्यतः पारिवारिक भूमि छुड़ाने की है; इसे आध्यात्मिक उद्धार तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण कानूनी शैली रखी गई है। ‘छुड़ानेवाला’ और ‘छुटकारा’ मूल की शब्दगत संगति को बनाए रखते हैं; आर्थिक आशय को सहज बनाने के लिए ‘आवश्यक धन जुटा ले’ प्रयुक्त है।
