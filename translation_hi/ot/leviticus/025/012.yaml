source:
  edition: WLC
  text: כִּ֚י יוֹבֵ֣ל הִ֔וא קֹ֖דֶשׁ תִּהְיֶ֣ה לָ/כֶ֑ם מִן הַ֨/שָּׂדֶ֔ה תֹּאכְל֖וּ אֶת תְּבוּאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/012.yaml
  text: For it is a jubilee; it shall be holy to you[a]. From the field you shall eat its produce.
translation:
  language: hi
  text: क्योंकि यह जुबली का वर्ष है; यह तुम्हारे लिए पवित्र होगा। तुम खेत से उसकी उपज खाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले निर्देश का कारण बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक-कारणात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יוֹבֵל
  choice: जुबली का वर्ष
  rationale: लैव्यव्यवस्था 25 में यह शब्द नरसिंगे के बजाय विशेष पचासवें वर्ष को दर्शाता है। केवल ‘जुबली’ की अपेक्षा ‘जुबली का वर्ष’ सामान्य पाठक के लिए आशय स्पष्ट करता है।
- source_word: קֹדֶשׁ תִּהְיֶה לָכֶם
  choice: यह तुम्हारे लिए पवित्र होगा
  rationale: ‘पवित्र’ वाचा-संबंधी अलगाव और धार्मिक महत्त्व को बनाए रखता है तथा आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מִן הַשָּׂדֶה
  choice: खेत से ही
  rationale: यह खेत से सीधे मिलने वाली उपज पर बल देता है; ‘ही’ प्रसंग में नियमित कटाई और भंडारण के विपरीत इस सीमा को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: תֹּאכְלוּ
  choice: तुम ... खाओगे
  rationale: कानूनी प्रसंग में अपूर्ण क्रिया निर्देशात्मक भविष्य का कार्य करती है; हिन्दी का सामान्य भविष्यकाल इस विधिक निर्देश को सहज रूप में व्यक्त करता है।
- source_word: תְּבוּאָתָהּ
  choice: उसकी उपज
  rationale: यह खेत से उत्पन्न होने वाली पैदावार को व्यापक रूप से दर्शाता है; ‘उपज’ संक्षिप्त, वर्तमान और कृषि-संदर्भ में स्वाभाविक है।
theological_decisions:
- issue: जुबली वर्ष के लिए पवित्रता की भाषा
  choice: यह तुम्हारे लिए पवित्र होगा
  alternative: यह तुम्हारे लिए अलग ठहराया जाएगा
  rationale: ‘पवित्र’ קֹדֶשׁ का वाचा-संबंधी धार्मिक भार बनाए रखता है और इसे केवल विशेष या नागरिक रूप से अलग समय बनाकर सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण विधिक शैली। ‘जुबली का वर्ष’ पारंपरिक बाइबलीय पद को रखते हुए सामान्य पाठक के लिए उसका आशय स्पष्ट करता है।
