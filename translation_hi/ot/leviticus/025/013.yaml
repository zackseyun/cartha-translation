  text: इस जुबली-वर्ष में तुम में से प्रत्येक अपनी भूमि-संपत्ति को लौट जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת הַיּוֹבֵל הַזֹּאת
  choice: इस जुबली-वर्ष में
  rationale: בְּ का कालवाचक अर्थ ‘में’ है; הַזֹּאת को स्वाभाविक हिन्दी क्रम में संज्ञा से पहले ‘इस’ रखा गया है। יוֹבֵל लैव्यव्यवस्था 25 की विशेष व्यवस्था और वर्ष को दर्शाता है, इसलिए ‘जुबली-वर्ष’ संक्षिप्त और स्पष्ट है।
- source_word: תָּשֻׁבוּ אִישׁ
  choice: तुममें से हर एक ... लौट जाए
  rationale: बहुवचन क्रिया के साथ वितरक אִישׁ का अर्थ प्रत्येक संबोधित व्यक्ति है। यह हिन्दी में ‘तुममें से हर एक’ से स्वाभाविक रूप में व्यक्त होता है; विधिक निर्देश के लिए ‘लौट जाए’ उपयुक्त है।
- source_word: אֶל אֲחֻזָּתוֹ
  choice: अपनी भूमि पर
  rationale: इस अध्याय में אֲחֻזָּה मुख्यतः परिवार को मिली स्थायी भू-संपत्ति या भू-अधिकार को दर्शाता है। ‘अपनी भूमि’ प्रसंग में स्पष्ट और सहज है; ‘निज संपत्ति’ व्यापक वैकल्पिक अर्थ है।
theological_decisions:
- issue: वितरक אִישׁ का लिंग और संबोधन
  choice: तुममें से हर एक
  alternative: हर पुरुष
  rationale: यहाँ אִישׁ बहुवचन संबोधन को व्यक्ति-व्यक्ति पर लागू करता है। ‘तुममें से हर एक’ उसके वितरक बल को बनाए रखता है और प्रसंग से अधिक संकीर्ण लैंगिक दावा नहीं जोड़ता।
- issue: אֲחֻזָּה की प्रकृति
  choice: भूमि
  alternative: निज संपत्ति
  rationale: जुबली-वर्ष के निकटवर्ती कानूनी प्रसंग में वापसी पैतृक भू-धारण की ओर है। फिर भी शब्द का सामान्य अर्थ ‘अधिकार में मिली संपत्ति/निज संपत्ति’ हो सकता है, जिसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कानूनी निर्देश का गरिमापूर्ण किंतु सहज स्वर। ‘जुबली-वर्ष’ इस अध्याय की संस्थागत संज्ञा के रूप में रखा गया है।
