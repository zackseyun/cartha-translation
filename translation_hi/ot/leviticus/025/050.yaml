  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/חִשַּׁב֙ עִם קֹנֵ֔/הוּ מִ/שְּׁנַת֙ הִמָּ֣כְר/וֹ ל֔/וֹ עַ֖ד שְׁנַ֣ת הַ/יֹּבֵ֑ל וְ/הָיָ֞ה כֶּ֤סֶף מִמְכָּר/וֹ֙ בְּ/מִסְפַּ֣ר שָׁנִ֔ים כִּ/ימֵ֥י שָׂכִ֖יר יִהְיֶ֥ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/050.yaml
  text: He shall calculate with his buyer from the year he sold himself to him until the year of jubilee[a], and the price of his sale shall be according to the number of years[b]; like the days of a hired worker he shall be with him.
translation:
  language: hi
  text: वह अपने खरीदार के साथ उस वर्ष से, जब उसने अपने आपको उसे बेच दिया था[a], जुबली के वर्ष तक हिसाब लगाए। उसके बिकने का दाम वर्षों की संख्या के अनुसार होगा; उसके साथ उसकी सेवा किसी मज़दूर की सेवा-अवधि के समान होगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक रूपनिष्ठ अनुवाद: “उसके उसे बेचे जाने के वर्ष से।” प्रसंग से स्पष्ट है कि उस व्यक्ति ने अपने आपको सेवा में बेच दिया था।'
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक रूप में: “मज़दूर के दिनों के समान वह उसके साथ रहेगा।” तुलना बताती है कि मूल्यांकन स्थायी स्वामित्व के रूप में नहीं, बल्कि मज़दूर की सेवा-अवधि के आधार पर होना था।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: हिसाब लगाए
  rationale: यह क्रिया यहाँ छुड़ौती की राशि का आर्थिक हिसाब लगाने को दर्शाती है; यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: קֹנֵהוּ
  choice: अपने खरीदार
  rationale: कנה का कृदन्त उस व्यक्ति को सूचित करता है जिसने उसे सेवा के लिए खरीदा था; ‘खरीदार’ मूल के लेन-देन संबंधी अर्थ को बनाए रखता है।
- source_word: מִשְּׁנַת הִמָּכְרוֹ לוֹ
  choice: उस वर्ष से, जब उसने अपने आपको उसके हाथ बेच दिया था
  rationale: संदर्भ में ऋण के कारण स्वयं को सेवा में बेचने की बात है। हिन्दी में सक्रिय आत्मवाचक रूप स्वाभाविक है, जबकि पादटिप्पणी अधिक रूपनिष्ठ विकल्प सुरक्षित रखती है।
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: जुबली के वर्ष तक
  rationale: यह इस अध्याय में स्थापित विशेष पचासवें वर्ष का नाम है; ‘जुबली’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जा सकता है।
- source_word: וְהָיָה כֶּסֶף מִמְכָּרוֹ
  choice: उसके बिकने का दाम ... होगा
  rationale: כֶּסֶף का शाब्दिक अर्थ चाँदी या धन है, पर इस कानूनी संदर्भ में इससे बिक्री का मौद्रिक मूल्य अभिप्रेत है।
- source_word: בְּמִסְפַּר שָׁנִים
  choice: वर्षों की संख्या के अनुसार
  rationale: यह वाक्यांश बताता है कि मूल्य का निर्धारण वर्षों की संख्या के अनुपात में किया जाए।
- source_word: כִּימֵי שָׂכִיר
  choice: किसी मज़दूर की सेवा-अवधि के समान
  rationale: שָׂכִיר वेतन पर रखा गया कामगार है। ‘सेवा-अवधि’ ‘दिनों’ के कालगत आशय को स्वाभाविक हिन्दी में व्यक्त करती है और तुलना को बनाए रखती है।
- source_word: יִהְיֶה עִמּוֹ
  choice: उसके साथ उसका रहना ... होगा
  rationale: यह निकट-रूपनिष्ठ अभिव्यक्ति खरीदार के अधीन बिताई अवधि को बताती है और उसे स्थायी स्वामित्व कहने से बचती है।
theological_decisions:
- issue: सेवा में बिके व्यक्ति की स्थिति
  choice: अंतिम उपवाक्य को मज़दूर की सीमित सेवा-अवधि से तुलना के रूप में रखा गया है।
  alternative: इसे स्थायी दासत्व या स्थायी स्वामित्व की स्पष्ट व्याख्या बनाना।
  rationale: मूल पाठ स्वयं मज़दूर के दिनों से तुलना करता है; अनुवाद उसी कानूनी तुलना को रखता है और उससे आगे कोई साम्प्रदायिक या नैतिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में कानूनी और गरिमापूर्ण शैली रखी गई है। ‘हिसाब लगाए’, ‘खरीदार’ और ‘दाम’ सामान्य पाठक के लिए स्पष्ट हैं। कठिन हिब्रू अंतिम उपवाक्य को स्वाभाविक हिन्दी में व्यक्त किया गया है, और उसका अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
