  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם כִּ֤י תָבֹ֨אוּ֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן לָ/כֶ֑ם וְ/שָׁבְתָ֣ה הָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/002.yaml
  text: Speak to the sons of Israel and say to them, ‘When you come into the land that I am giving to you, then the land shall keep a Sabbath to Yahweh.
translation:
  language: hi
  text: “इस्राएल के पुत्रों[a] से बोल और उनसे कह, ‘जब तुम उस देश में प्रवेश करो जिसे मैं तुम्हें दे रहा हूँ, तब वह देश यहोवा के लिए सब्त का विश्राम करेगा[b]।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली”। इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों”।
    reason: lexical_alternative
  - marker: b
    text: या “वह देश यहोवा के लिए एक सब्त मानेगा।” इब्रानी में देश को इस प्रकार व्यक्त किया गया है मानो वह स्वयं सब्त मना रहा हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों से बोल
  rationale: मूल के पारिवारिक पदबंध ‘इस्राएल के पुत्र’ और एकवचन आज्ञार्थक क्रिया को औपचारिक ढंग से सुरक्षित रखता है। स्वाभाविक विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: और उनसे कह
  rationale: आज्ञा के क्रम और विधिक कथन की सीधी शैली को बनाए रखता है।
- source_word: כִּי תָבֹאוּ אֶל־הָאָרֶץ
  choice: जब तुम उस देश में प्रवेश करो
  rationale: यहाँ כִּי अपेक्षित भावी परिस्थिति का समयवाचक परिचय देता है; בוא אל के लिए ‘प्रवेश करना’ स्वाभाविक हिन्दी है।
- source_word: אֲשֶׁר אֲנִי נֹתֵן לָכֶם
  choice: जिसे मैं तुम्हें दे रहा हूँ
  rationale: नֹתֵן के कृदन्तीय, जारी अथवा आसन्न दान के पक्ष को व्यक्त करता है।
- source_word: וְשָׁבְתָה הָאָרֶץ שַׁבָּת
  choice: तब वह देश ... विश्राम-दिन मनाएगा
  rationale: देश के मानवीकरण और शब्बात के पालन—दोनों को ‘विश्राम-दिन मनाएगा’ से व्यक्त किया गया है; केवल ‘विश्राम करेगा’ कहने पर संज्ञा שַׁבָּת की पुनरुक्ति और धार्मिक पालन का भाव कम हो जाता।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ल उपसर्ग के समर्पण/उद्देश्य भाव को ‘के लिए’ से और दिव्य नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम स्पष्ट है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से रखा गया है; ‘याहवे’ ध्वन्यात्मक वैकल्पिक रूप है।
- issue: देश द्वारा शब्बात मनाने का मानवीकरण
  choice: वह देश ... विश्राम-दिन मनाएगा
  alternative: देश यहोवा के लिए विश्राम करेगा
  rationale: मूल में देश स्वयं שבת करता और שַׁבָּת रखता हुआ चित्रित है। अनुवाद इस धर्मवैधानिक मानवीकरण को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण विधिक शैली अपनाई गई है। मूसा को संबोधित एकवचन ‘बोल/कह’ और समुदाय के लिए बहुवचन ‘तुम’ सुरक्षित हैं। ‘विश्राम-दिन’ सामान्य पाठक के लिए बोधगम्य है, जबकि पादटिप्पणी में ‘शब्बात’ मूल सांस्कृतिक पद को दर्शाता है।
