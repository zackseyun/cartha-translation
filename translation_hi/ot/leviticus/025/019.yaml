  text: The land will yield its fruit[a], and you will eat your fill and live securely on it.
translation:
  language: hi
  text: भूमि अपना फल देगी, और तुम भरपेट खाओगे और उस पर सुरक्षित बसे रहोगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर सुरक्षित रहोगे।” इब्रानी क्रिया का अर्थ किसी स्थान पर ‘रहना’ या ‘बसना’ दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנָה
  choice: देगी
  rationale: मूल क्रिया נתן का अर्थ ‘देना’ है; भूमि को कर्ता रखते हुए यह हिंदी में स्वाभाविक है और उपज प्रदान करने का भाव बनाए रखता है।
- source_word: הָאָרֶץ
  choice: भूमि
  rationale: यहाँ संदर्भ उस देश की कृषि-भूमि का है जहाँ इस्राएली बसेंगे; ‘भूमि’ पृथ्वी के व्यापक अर्थ से बचते हुए उपयुक्त संदर्भ देता है।
- source_word: פִּרְיָהּ
  choice: अपना फल
  rationale: פְּרִי का ठोस चित्र ‘फल’ है, जो यहाँ समूची कृषि-उपज को भी समेटता है।
- source_word: וַאֲכַלְתֶּם לָשֹׂבַע
  choice: तुम भरपेट खाओगे
  rationale: שֹׂבַע तृप्ति या पेट भरने का भाव देता है; ‘भरपेट’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: וִישַׁבְתֶּם
  choice: बसे रहोगे
  rationale: ישב यहाँ किसी स्थान पर स्थायी रूप से रहने या बसने को व्यक्त करता है; ‘बसे रहोगे’ इस निवासगत अर्थ को स्पष्ट रखता है।
- source_word: לָבֶטַח
  choice: सुरक्षित
  rationale: בֶּטַח सुरक्षा और निश्चिंतता की अवस्था बताता है; ‘सुरक्षित’ बिना अतिरिक्त व्याख्या जोड़े मूल भाव देता है।
- source_word: עָלֶיהָ
  choice: उस पर
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ भूमि से है; ‘उस पर’ इब्रानी संबंध का सीधा और स्वाभाविक अनुवाद है।
