  text: If many years still remain[a], in proportion to them he shall repay his redemption price from the money of his purchase.
translation:
  language: hi
  text: यदि अभी बहुत वर्ष बाकी हों, तो वह उन वर्षों के अनुपात में जिस रकम में वह खरीदा गया था, उसमें से अपने छुटकारे की कीमत लौटाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह विधिक स्थिति में एक शर्त प्रस्तुत करने वाला सामान्य शर्तसूचक अव्यय है।
- source_word: עוֹד רַבּוֹת בַּשָּׁנִים
  choice: अभी बहुत वर्ष बाकी हों
  rationale: עוֹד का ‘अभी/अब भी’ और רַבּוֹת का ‘बहुत’ अर्थ रखते हुए हिन्दी में निहित ‘बाकी होना’ स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: לְפִיהֶן
  choice: उन वर्षों के अनुपात में
  rationale: शाब्दिक मुहावरा ‘उनके मुँह के अनुसार’ यहाँ शेष वर्षों की संख्या के अनुपात को दर्शाता है। संज्ञा दोहराने से हिन्दी में संकेत स्पष्ट रहता है।
- source_word: יָשִׁיב
  choice: लौटाए
  rationale: שוב के हिफ़ील रूप का अर्थ यहाँ धन वापस देना है; ‘लौटाए’ मूल क्रिया के निकट और वित्तीय प्रसंग में सहज है।
- source_word: גְּאֻלָּתוֹ
  choice: अपने छुटकारे का मूल्य
  rationale: גְּאֻלָּה मूलतः छुटकारे/छुड़ाने की क्रिया को भी सूचित कर सकता है, पर इस गणनात्मक संदर्भ में उससे देय रकम अभिप्रेत होने की प्रबल संभावना है।
- source_word: מִכֶּסֶף מִקְנָתוֹ
  choice: अपने खरीदे जाने की रकम में से
  rationale: यह मूल खरीद की रकम को दर्शाता है, जिसके आधार पर छुटकारे की आनुपातिक राशि लौटाई जानी है; कर्मवाच्य रूप व्यक्ति की खरीद का आशय स्पष्ट करता है।
