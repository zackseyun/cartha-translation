base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/010.yaml
  text: And you shall consecrate the fiftieth year[a], and proclaim liberty in the land to all its inhabitants. It shall be a jubilee for you, and each of you shall return to his property[d][c][b], and each of you shall return to his family.
translation:
  language: hi
  text: तुम पचासवें वर्ष को पवित्र ठहराओ और देश में उसके सभी निवासियों के लिए स्वतंत्रता[a] की घोषणा करो। वह तुम्हारे लिए जुबली का वर्ष[b] होगा। तुममें से हर एक अपनी भूमि-संपत्ति[c] पर लौट आए और हर एक अपने कुल[d] में लौट आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रिहाई” अथवा “मुक्ति।” इब्रानी शब्द दरोर जुबली वर्ष में की जाने वाली औपचारिक मुक्ति-घोषणा को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “जुबली” इब्रानी योवेल का लिप्यंतरण है। यहाँ यह पचासवें वर्ष की मुक्ति और पुनर्स्थापना की विशेष व्यवस्था का नाम है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से “अपनी संपत्ति”; इस प्रसंग में यह मुख्यतः वंशानुगत भूमि-अधिकार को दर्शाता है।
    reason: lexical_alternative
  - marker: d
    text: या “परिवार”; इब्रानी शब्द निकट परिवार से व्यापक नातेदारी समूह या कुल को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתֶּם
  choice: पवित्र ठहराना
  rationale: पिएल रूप यहाँ वर्ष को पवित्र मानकर विशेष उद्देश्य के लिए अलग ठहराने की आज्ञा देता है; यह सहज हिन्दी में धार्मिक अर्थ बनाए रखता है।
- source_word: שְׁנַת הַחֲמִשִּׁים שָׁנָה
  choice: पचासवें वर्ष
  rationale: इब्रानी संख्या-विन्यास का स्वाभाविक हिन्दी क्रमवाचक रूप।
- source_word: וּקְרָאתֶם דְּרוֹר
  choice: स्वतंत्रता की घोषणा करना
  rationale: דְּרוֹר औपचारिक मुक्ति अथवा स्वतंत्रता की सार्वजनिक घोषणा को सूचित करता है; संदर्भ में दासत्व से मुक्ति और संपत्ति की पुनर्स्थापना दोनों सम्मिलित हैं।
- source_word: בָּאָרֶץ לְכָל יֹשְׁבֶיהָ
  choice: देश में उसके सभी निवासियों के लिए
  rationale: בְּ का स्थान-सूचक अर्थ और לְ का संबोधन/लाभार्थक संबंध अलग-अलग सुरक्षित हैं।
- source_word: יוֹבֵל הִוא תִּהְיֶה לָכֶם
  choice: वह तुम्हारे लिए जुबली का वर्ष होगा
  rationale: इस अध्याय में יוֹבֵל पचासवें वर्ष की संस्था का तकनीकी नाम है; केवल नरसिंगे का संकेत नहीं। स्पष्टता के लिए ‘वर्ष’ जोड़ा गया है।
- source_word: וְשַׁבְתֶּם ... תָּשֻׁבוּ
  choice: लौट जाए ... लौट जाए
  rationale: שׁוב की पुनरावृत्ति रखी गई है, जिससे पुनर्स्थापना का बल बना रहता है।
- source_word: אִישׁ
  choice: तुममें से हर एक ... हर एक
  rationale: אִישׁ रूप से पुल्लिंग एकवचन है, पर यहाँ वितरणार्थक है और बहुवचन संबोधन के प्रत्येक सदस्य को इंगित करता है; हिन्दी में ‘हर एक’ उसका बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל אֲחֻזָּתוֹ
  choice: अपनी पैतृक संपत्ति के पास
  rationale: אֲחֻזָּה इस कानूनी संदर्भ में विशेषतः वंशानुगत भूमि-अधिकार है; ‘पैतृक संपत्ति’ सामान्य पाठक के लिए स्पष्ट है। אֶל के लक्ष्य-सूचक अर्थ को ‘के पास’ से रखा गया है।
- source_word: אֶל מִשְׁפַּחְתּוֹ
  choice: अपने कुल के पास
  rationale: מִשְׁפָּחָה यहाँ केवल निकट परिवार से व्यापक नातेदारी समूह भी हो सकता है; ‘कुल’ इस सामाजिक अर्थ को बेहतर बनाए रखता है।
theological_decisions:
- issue: वितरणार्थक אִישׁ का अनुवाद
  choice: तुममें से हर एक
  alternative: हर पुरुष
  rationale: कानूनी आज्ञा पूरे संबोधित समुदाय में प्रत्येक व्यक्ति पर वितरणार्थ लागू होती है। ‘हर एक’ स्रोत के वितरणार्थक बल को रखता है, जबकि ‘पुरुष’ हिन्दी में अनावश्यक रूप से केवल वयस्क पुरुषों तक अर्थ सीमित कर सकता है।
- issue: יוֹבֵל का तकनीकी अर्थ
  choice: जुबली का वर्ष
  alternative: नरसिंगे का वर्ष
  rationale: लैव्यव्यवस्था 25 में यह शब्द पचासवें वर्ष की स्थापित व्यवस्था को बताता है; शब्द की नरसिंगे से संबद्ध पृष्ठभूमि मुख्य पाठ में संस्था के अर्थ को विस्थापित नहीं करती।
- issue: דְּרוֹר का दायरा
  choice: स्वतंत्रता
  alternative: रिहाई
  rationale: शब्द औपचारिक मुक्ति-घोषणा को बताता है और इस प्रसंग में व्यक्तिगत रिहाई तथा पैतृक संपत्ति की बहाली दोनों से जुड़ा है। ‘स्वतंत्रता’ व्यापकता रखती है; ‘रिहाई’ पादटिप्पणी में विकल्प है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कानूनी-आज्ञार्थक शैली अपनाई गई है। ‘तुम ... ठहराना/घोषणा करना’ से इब्रानी दूसरे पुरुष बहुवचन आज्ञार्थक भाव व्यक्त किया गया है। तकनीकी ‘जुबली’ को संक्षिप्त पादटिप्पणी से समझाया गया है; मुख्य पाठ में स्रोत की पुनरावृत्ति और सामाजिक-कानूनी तनाव बनाए रखे गए हैं।
