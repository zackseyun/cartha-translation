  text: And for your livestock[a], and for the wild animals that are in your land, all its produce shall be for food.
translation:
  language: hi
  text: और तुम्हारे घरेलू पशुओं और तुम्हारे देश में रहने वाले जंगली पशुओं के लिए, उस भूमि की सारी उपज भोजन के लिए होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְהֶמְתְּךָ
  choice: तुम्हारे पालतू पशुओं के लिए
  rationale: בְּהֵמָה यहाँ संबोधित व्यक्ति के अधीन घरेलू पशुओं को सामूहिक रूप से दर्शाता है। ‘पालतू पशु’ आगे आने वाले जंगली पशुओं से स्पष्ट भेद रखता है।
- source_word: לַחַיָּה
  choice: जंगली पशुओं के लिए
  rationale: חַיָּה घरेलू पशुओं के विपरीत वन्य पशुओं को दर्शाता है; यह आधुनिक हिन्दी में ठोस और स्पष्ट है।
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: तुम्हारे देश में रहने वाले
  rationale: सम्बन्धवाचक उपवाक्य जंगली पशुओं को विशेषित करता है। ‘देश’ यहाँ उस भूभाग को स्वाभाविक हिन्दी में व्यक्त करता है जहाँ वे रहते हैं।
- source_word: כָּל תְּבוּאָתָהּ
  choice: उसकी सारी उपज
  rationale: תְּבוּאָה भूमि की कृषि-उपज को दर्शाता है और स्त्रीलिंग प्रत्यय का संकेत पूर्वपद ‘भूमि/देश’ की ओर है।
- source_word: לֶאֱכֹל
  choice: भोजन
  rationale: ל के साथ क्रियारूप यहाँ प्रयोजन अथवा उपयोग बताता है। ‘भोजन होगी’ हिन्दी में स्वाभाविक रहते हुए ‘खाने के लिए होगी’ का अर्थ सुरक्षित रखता है।
