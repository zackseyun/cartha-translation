source:
  edition: WLC
  text: אֲנִ֗י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֤ת לָ/כֶם֙ אֶת אֶ֣רֶץ כְּנַ֔עַן לִ/הְי֥וֹת לָ/כֶ֖ם לֵ/אלֹהִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/038.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to give you the land of Canaan, to be your God.
translation:
  language: hi
  text: मैं याहवे, तुम्हारा परमेश्वर हूँ, जो तुम्हें मिस्र देश से निकाल लाया, ताकि तुम्हें कनान देश देने और तुम्हारा परमेश्वर होने के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण के रूप में रखा गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: रूप बहुवचन-जैसा होने पर भी यहाँ एकवचन सन्दर्भ और वाचा-सूत्र के कारण इस्राएल के एक परमेश्वर का बोध है।
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: तुम्हें ... निकाल लाया
  rationale: हिफ़ील रूप निर्गमन के सन्दर्भ में ‘बाहर निकाल लाना’ व्यक्त करता है; यह हिन्दी में स्वाभाविक और स्रोत के अनुरूप है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: אֶרֶץ को ‘देश’ के रूप में स्पष्ट रखते हुए हिन्दी की स्वाभाविक पदावली अपनाई गई है।
- source_word: לָתֵת לָכֶם אֶת אֶרֶץ כְּנַעַן
  choice: ताकि तुम्हें कनान देश दूँ
  rationale: לָתֵת का प्रयोजनार्थक सम्बन्ध ‘ताकि’ से स्पष्ट किया गया है और भूमि-दान की वाचागत भाषा सुरक्षित रखी गई है।
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: तुम्हारा परमेश्वर रहूँ
  rationale: यह वाचा-सम्बन्ध का सूत्र है। ‘रहूँ’ पिछले और निरन्तर सम्बन्ध को व्यक्त करता है तथा परमेश्वर के अस्तित्व में परिवर्तन का अर्थ नहीं जोड़ता।
- source_word: אֲנִי
  choice: मैं ... हूँ
  rationale: इब्रानी का स्वतन्त्र सर्वनाम आत्म-परिचय पर बल देता है; हिन्दी की निर्बाध पहचान-वाचक रचना में ‘हूँ’ आवश्यक है।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों में पहचाने जाने वाले ‘यहोवा’ से नाम को नाम ही रखा गया है, उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: לִהְיוֹת לָכֶם לֵאלֹהִים में वाचा-सूत्र
  choice: तुम्हारा परमेश्वर रहूँ
  alternative: तुम्हारा परमेश्वर बनूँ; तुम्हारे लिए परमेश्वर होऊँ
  rationale: सन्दर्भ पहले से स्थापित वाचा-सम्बन्ध की पुष्टि करता है। ‘रहूँ’ निरन्तर सम्बन्ध बताता है, जबकि ‘बनूँ’ अनावश्यक रूप से किसी नए परिवर्तन का संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सीधे वाक्य-विन्यास का प्रयोग किया गया है। ‘तुम्हारा’ सामूहिक एकवचन-सदृश हिन्दी रूप है, जो यहाँ बहुवचन समुदाय को सम्बोधित करता है।
