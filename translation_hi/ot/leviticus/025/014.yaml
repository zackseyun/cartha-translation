  text: וְ/כִֽי תִמְכְּר֤וּ מִמְכָּר֙ לַ/עֲמִיתֶ֔/ךָ א֥וֹ קָנֹ֖ה מִ/יַּ֣ד עֲמִיתֶ֑/ךָ אַל תּוֹנ֖וּ אִ֥ישׁ אֶת אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/014.yaml
  text: And if you sell something to your neighbor[a], or buy from your neighbor, no man shall oppress his brother.
translation:
  language: hi
  text: और यदि तुम अपने समुदाय के किसी साथी को कुछ बेचो, या उससे कुछ खरीदो, तो कोई अपने भाई के साथ अन्याय न करे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने भाई को न ठगे” अथवा “अपने भाई का अनुचित लाभ न उठाए”; इब्रानी क्रिया विशेषकर लेन-देन में किसी के साथ अन्याय करने या उसका अनुचित लाभ उठाने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: और जब
  rationale: व्यवस्था-संबंधी प्रसंग में यह किसी सम्भावित लेन-देन की स्थिति प्रस्तुत करता है; ‘और जब’ हिन्दी में स्वाभाविक है और संयोजक बल भी रखता है।
- source_word: מִמְכָּר
  choice: कुछ
  rationale: संज्ञा बिकने वाली वस्तु अथवा बिक्री के लेन-देन को सूचित करती है; ‘कुछ बेचो’ सहज हिन्दी में वस्तु का भाव बनाए रखता है।
- source_word: עָמִית
  choice: अपने समुदाय का व्यक्ति
  rationale: यह शब्द केवल पास रहने वाले पड़ोसी के बजाय अपने समुदाय के सह-सदस्य को दर्शाता है; इसलिए यह चयन उसके सामाजिक-कानूनी अर्थ को अधिक स्पष्ट रखता है।
- source_word: קָנֹה מִיַּד
  choice: उससे कुछ खरीदो
  rationale: शाब्दिक ‘उसके हाथ से खरीदो’ हिन्दी में अनावश्यक रूप से कठोर लगता है; यहाँ מִיַּד स्रोत अथवा विक्रेता को दर्शाता है।
- source_word: תּוֹנוּ
  choice: बेईमानी करना
  rationale: ינה का यह रूप व्यापारिक प्रसंग में किसी को गलत ठहराने, ठगने या अनुचित लाभ उठाने का संकेत देता है; ‘बेईमानी’ उस आर्थिक अन्याय को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: אִישׁ אֶת־אָחִיו
  choice: एक-दूसरे के साथ
  rationale: इब्रानी का शाब्दिक रूप ‘कोई अपने भाई के साथ’ है, पर यहाँ पारस्परिक और सामुदायिक निषेध है; हिन्दी का ‘एक-दूसरे’ प्रतिनिधिक बल को स्पष्ट और सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: אִישׁ אֶת־אָחִיו में प्रतिनिधिक पुल्लिंग और सामुदायिक संबंध
  choice: एक-दूसरे के साथ
  alternative: कोई अपने भाई के साथ
  rationale: यह नियम समुदाय के सदस्यों के पारस्परिक व्यवहार पर लागू है। सहज हिन्दी में ‘एक-दूसरे’ उसी व्यापक सामुदायिक दायरे को व्यक्त करता है, बिना इसे केवल सगे पुरुष भाइयों तक सीमित सुनाई देने दिए।
- issue: תּוֹנוּ का व्यापारिक नैतिक अर्थ
  choice: बेईमानी न करना
  alternative: अत्याचार न करना / एक-दूसरे को न ठगना
  rationale: निकटवर्ती प्रसंग बिक्री और खरीद का है, इसलिए आर्थिक अन्याय मुख्य है। फिर भी क्रिया में अनुचित लाभ उठाने का कुछ व्यापक भाव हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘अपने समुदाय के किसी व्यक्ति’ עָמִית के सामुदायिक अर्थ को स्पष्ट करता है; निषेध को व्यापारिक संदर्भ के अनुरूप रखा गया है और क्रिया की व्यापक अर्थ-छाया पादटिप्पणी में दी गई है।
