source:
  edition: WLC
  text: וְ֠/הָיְתָה שַׁבַּ֨ת הָ/אָ֤רֶץ לָ/כֶם֙ לְ/אָכְלָ֔ה לְ/ךָ֖ וּ/לְ/עַבְדְּ/ךָ֣ וְ/לַ/אֲמָתֶ֑/ךָ וְ/לִ/שְׂכִֽירְ/ךָ֙ וּ/לְ/תוֹשָׁ֣בְ/ךָ֔ הַ/גָּרִ֖ים עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/006.yaml
  text: The Sabbath produce of the land shall be for you for food—for you[a], for your male servant, for your female servant, for your hired worker[b], and for your resident foreigner who dwells with you.
translation:
  language: hi
  text: भूमि के विश्राम-वर्ष की उपज तुम्हारे भोजन के लिए होगी—तुम्हारे लिए, तुम्हारे दास और दासी के लिए, तुम्हारे मज़दूर के लिए, और तुम्हारे साथ रहनेवाले परदेशी निवासी[a] के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परदेशी निवासी” से आशय ऐसे गैर-इस्राएली व्यक्ति से है जो इस्राएलियों के बीच रहता था; इसका अनुवाद “प्रवासी” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת הָאָרֶץ
  choice: भूमि के विश्राम-वर्ष की उपज
  rationale: शाब्दिक अर्थ ‘भूमि का सब्त’ है, पर इस वाक्य में भोजन के रूप में उपलब्ध उस वर्ष की उपज अभिप्रेत है। यह रूप पिछले संदर्भ के विश्राम-वर्ष से संबंध और वर्तमान वाक्य का व्यावहारिक अर्थ दोनों स्पष्ट करता है।
- source_word: לָכֶם לְאָכְלָה
  choice: तुम्हारे भोजन के लिए
  rationale: उद्देश्य अथवा उपयोग का अर्थ सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַבְדְּךָ וְלַאֲמָתֶךָ
  choice: तुम्हारे दास और दासी के लिए
  rationale: इब्रानी में पुरुष और स्त्री बंधुआ गृह-सदस्यों की अलग संज्ञाएँ हैं; ‘दास और दासी’ इस सामाजिक और लैंगिक भेद को बनाए रखता है।
- source_word: שְׂכִירְךָ
  choice: तुम्हारे मज़दूर के लिए
  rationale: यह वेतन पर काम करनेवाले व्यक्ति को दास-दासी से अलग दर्शाता है; ‘मज़दूर’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תוֹשָׁבְךָ הַגָּרִים עִמָּךְ
  choice: तुम्हारे साथ रहनेवाले परदेशी निवासी
  rationale: यह गैर-स्थानीय व्यक्ति की समुदाय के बीच जारी निवास की स्थिति व्यक्त करता है; ‘परदेशी निवासी’ बाहरी मूल और स्थानीय निवास दोनों भाव रखता है।
theological_decisions:
- issue: दासता और मज़दूरी की सामाजिक श्रेणियाँ
  choice: עבד/אמה को ‘दास और दासी’ तथा שׂכיר को ‘मज़दूर’ कहना
  alternative: सभी को व्यापक रूप से ‘सेवक’ कहना
  rationale: मूल पाठ अलग कानूनी-सामाजिक स्थितियों को अलग करता है। सबको ‘सेवक’ कहने से यह भेद मिट जाएगा।
- issue: ‘भूमि के सब्त’ का संदर्भ
  choice: ‘भूमि के विश्राम-वर्ष की उपज’
  alternative: ‘भूमि का सब्त’ अथवा ‘भूमि का विश्राम’
  rationale: मूल पदबंध विश्राम की संस्था को नाम देता है, जबकि ‘भोजन के लिए’ से यहाँ उस दौरान स्वतः मिलनेवाली उपज का आशय उभरता है। चयन दोनों पक्षों को जोड़ता है और किसी अतिरिक्त धार्मिक निष्कर्ष को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन संबोधन ‘तुम्हारे’ को मूल पाठ के अनुसार बनाए रखा गया है। ‘विश्राम-वर्ष’ लैव्यव्यवस्था 25 के निकट संदर्भ को स्वाभाविक रूप से सामने लाता है।
