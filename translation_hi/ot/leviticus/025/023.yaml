  yaml_path: translation/ot/leviticus/025/023.yaml
  text: The land must not be sold permanently[a], because the land is mine[b]. For you are strangers and sojourners with me.
translation:
  language: hi
  text: “भूमि सदा के लिए[a] न बेची जाए, क्योंकि भूमि मेरी है; क्योंकि तुम मेरे साथ परदेशी और अस्थायी निवासी[b] हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘स्थायी रूप से’; अर्थात ऐसा हस्तांतरण जो वापस न लिया जा सके।
    reason: lexical_alternative
  - marker: b
    text: ‘परदेशी और अस्थायी निवासी’ इस्राएलियों की उस आश्रित स्थिति को व्यक्त करता है जिसमें भूमि का वास्तविक स्वामी परमेश्वर है।
    reason: cultural_note
lexical_decisions:
- source_word: תִמָּכֵר
  choice: न बेची जाए
  rationale: निफ़अल अपूर्ण रूप यहाँ विधिक निषेध का निष्क्रिय भाव देता है; यह प्रयोग उसी भाव को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: לִצְמִתֻת
  choice: सदा के लिए
  rationale: यह शब्द भूमि के स्थायी अथवा अपरिवर्तनीय हस्तांतरण को दर्शाता है। ‘सदा के लिए’ सामान्य पाठक के लिए स्पष्ट है; टिप्पणी में अधिक तकनीकी अर्थ दिया गया है।
- source_word: כִּי לִי הָאָרֶץ
  choice: क्योंकि भूमि मेरी है
  rationale: כִּי का कारणसूचक बल और भूमि पर परमेश्वर के सीधे स्वामित्व का दावा दोनों सुरक्षित रहते हैं।
- source_word: גֵרִים
  choice: परदेशी
  rationale: גֵר ऐसे निवासी को दर्शाता है जिसकी उस भूमि पर पैतृक स्वामित्व-दावेदारी नहीं है और जो आश्रित स्थिति में रहता है।
- source_word: וְתוֹשָׁבִים
  choice: अस्थायी निवासी
  rationale: תּוֹשָׁב निवासी या बसनेवाले को सूचित करता है जिसके पास स्थायी पैतृक अधिकार नहीं; युग्म में यह भूमि पर इस्राएल के सीमित और आश्रित निवास को उभारता है।
- source_word: עִמָּדִי
  choice: मेरे साथ
  rationale: עם तथा प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘मेरे साथ’ है; इसे व्याख्यात्मक रूप से ‘मेरे अधीन’ बनाकर मूल की अभिव्यक्ति को संकुचित नहीं किया गया।
theological_decisions:
- issue: भूमि के साथ इस्राएल का संबंध
  choice: भूमि परमेश्वर की है और इस्राएली उसमें उसके साथ परदेशी तथा अस्थायी निवासी हैं; इसलिए उनका अधिकार आश्रित और सीमित है।
  alternative: इसे केवल सामाजिक-आर्थिक नियम मानना, अथवा पद के तात्कालिक जुबली-संदर्भ से आगे पूर्ण बेदखली का सिद्धान्त निकालना।
  rationale: मूल पाठ स्वयं निषेध को ‘भूमि मेरी है’ से आधार देता है। अनुवाद विधिक और धर्मवैचारिक दोनों बलों को रखता है, पर उनसे आगे कोई प्रणाली आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘सदा के लिए’ सहज हिन्दी है, जबकि ‘स्थायी हस्तांतरण’ का भूमि-अधिकार संबंधी सूक्ष्म अर्थ पाद-टिप्पणी में स्पष्ट किया गया है। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
