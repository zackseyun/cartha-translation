    reason: lexical_alternative
lexical_decisions:
- source_word: תִרְדֶּה
  choice: शासन करना
  rationale: רדה का मूल अर्थ ‘शासन करना/अधिकार चलाना’ है। इस कानूनी प्रसंग में यह सेवक बने साथी इस्राएली पर अधिकार के प्रयोग को व्यक्त करता है।
- source_word: בּוֹ
  choice: उस पर
  rationale: पुल्लिंग एकवचन सर्वनाम पहले उल्लिखित व्यक्ति को सूचित करता है; ‘शासन करना’ के साथ हिंदी में ‘उस पर’ स्वाभाविक है।
- source_word: בְּפָרֶךְ
  choice: कठोरता से
  rationale: פָּרֶךְ कठोर, दमनकारी या कुचल देने वाले व्यवहार को व्यक्त करता है। ‘कठोरता से’ मूल अर्थ को बिना अनावश्यक रूप से तीव्र किए स्वाभाविक हिंदी में रखता है।
- source_word: וְיָרֵאתָ
  choice: बल्कि ... भय मानना
  rationale: וְ औपचारिक रूप से ‘और’ है, पर निषेध के बाद यह विपरीत नैतिक अपेक्षा प्रस्तुत करता है। हिंदी में ‘बल्कि’ उस संबंध को स्पष्ट करता है।
- source_word: מֵאֱלֹהֶיךָ
  choice: अपने परमेश्वर का
  rationale: ירא के साथ מִן भय के विषय को चिह्नित करता है। हिंदी मुहावरे में ‘अपने परमेश्वर का भय मानना’ स्वाभाविक है और संबंधसूचक भाव बनाए रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य का नैतिक आधार के रूप में कार्य
  choice: ‘बल्कि अपने परमेश्वर का भय मानना’
  alternative: ‘और अपने परमेश्वर का भय मानना’
  rationale: अनुवाद यह बनाए रखता है कि परमेश्वर के प्रति श्रद्धापूर्ण भय सामाजिक अधिकार के कठोर प्रयोग को रोकता है। ‘बल्कि’ प्रसंगगत विरोध को स्पष्ट करता है, कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन एकवचन रखा गया है। भाषा सरल और गरिमापूर्ण है। ‘परमेश्वर का भय मानना’ प्रचलित बाइबलीय अभिव्यक्ति है और यहाँ श्रद्धा तथा उत्तरदायित्व दोनों का भाव रखती है।
