  yaml_path: translation/ot/leviticus/025/009.yaml
  text: Then you shall sound a trumpet blast in the seventh month[a], on the tenth day of the month[b]. On the Day of Atonement you shall sound the trumpet throughout all your land.
translation:
  language: hi
  text: तब सातवें महीने के दसवें दिन तुम नरसिंगा ज़ोर से फूँकना। प्रायश्चित के दिन[b] तुम अपने सारे देश में नरसिंगा फूँकना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘प्रायश्चित के दिन’ के लिए इब्रानी में शाब्दिक रूप से ‘प्रायश्चितों के दिन’ (बहुवचन) है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: तब ... गुँजाना
  rationale: हिफ़ील रूप का शाब्दिक अर्थ ‘पार कराना’ है, पर नरसिंगे के साथ इसका आशय उसकी ध्वनि को चारों ओर गुँजाना है। आरंभिक וְ का क्रमसूचक भाव ‘तब’ से व्यक्त किया गया है।
- source_word: שׁוֹפַר
  choice: नरसिंगा
  rationale: यह सींग से बना फूँक-वाद्य है। ‘नरसिंगा’ आधुनिक हिंदी पाठक के लिए ‘तुरही’ की अपेक्षा इसके सींग-वाद्य स्वरूप को अधिक स्पष्ट करता है; इसकी परंपरागत सामग्री पादटिप्पणी में दी गई है।
- source_word: תְּרוּעָה
  choice: जयघोष
  rationale: शब्द ऊँची संकेत-ध्वनि, ललकार या घोष को दर्शाता है। यहाँ शׁוֹפַר के साथ यह नरसिंगे से निकाली जाने वाली प्रबल घोष-ध्वनि है; ‘जयघोष’ हिंदी में इस उत्सवी और सार्वजनिक संकेत को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: सातवें महीने के दसवें दिन
  rationale: दोनों कालवाचक पदों को सहज हिंदी में एक ही वाक्यांश में जोड़ा गया है, अर्थ में कोई परिवर्तन किए बिना।
- source_word: בְּיוֹם הַכִּפֻּרִים
  choice: प्रायश्चित के दिन
  rationale: यह इस्राएल के निर्धारित पवित्र दिन का प्रचलित और सुबोध हिंदी नाम है। मूल में כִּפֻּרִים बहुवचन रूप में है, जिसकी सूचना पादटिप्पणी में सुरक्षित है।
- source_word: תַּעֲבִירוּ שׁוֹפָר
  choice: तुम ... नरसिंगा गुँजाना
  rationale: पुनरुक्त हिफ़ील क्रिया को उसी वाद्य-संदर्भ में ‘गुँजाना’ कहा गया है। हिंदी में ‘तुम ... गुँजाना’ विधिक आज्ञा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּכָל אַרְצְכֶם
  choice: अपने सारे देश में
  rationale: यह पूरे इस्राएली भूभाग में व्यापक रूप से नरसिंगा गुँजाने का निर्देश है; ‘अपने सारे देश में’ समग्र विस्तार को स्पष्ट रखता है।
theological_decisions:
- issue: יוֹם הַכִּפֻּרִים का अनुवाद
  choice: प्रायश्चित के दिन
  alternative: प्रायश्चितों के दिन
  rationale: यद्यपि इब्रानी संज्ञा रूपतः बहुवचन है, पूरा पद निर्धारित उपासना-दिवस का नाम है। प्रचलित एकवचन नाम पाठ में रखा गया है और मूल का बहुवचन रूप पादटिप्पणी में बताया गया है, जिससे भाषिक तनाव मिटाया नहीं जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक विधिक घोषणा के अनुरूप रखी गई है। ‘नरसिंगा गुँजाना’ बोलचाल में बोधगम्य है और मूल के ‘ध्वनि को आगे/चारों ओर पहुँचाने’ वाले मुहावरे को सँभालता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
