id: LEV.25.35
reference: Leviticus 25:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כִֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָ֥טָה יָד֖/וֹ עִמָּ֑/ךְ וְ/הֶֽחֱזַ֣קְתָּ בּ֔/וֹ גֵּ֧ר וְ/תוֹשָׁ֛ב וָ/חַ֖י עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/035.yaml
  text: If your brother becomes poor and his hand falters beside you[a], then you shall support him[b]; so that he may live beside you as a resident foreigner or a temporary resident.
translation:
  language: hi
  text: यदि तुम्हारा भाई निर्धन हो जाए और तुम्हारे पास रहते हुए उसके साधन चुकने लगें[a], तो तुम उसे सहारा देना[b], ताकि वह तुम्हारे साथ निवासी परदेशी या अस्थायी निवासी के समान रह सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका हाथ तुम्हारे साथ डगमगाए”; यह साधन चुकने या अपना भरण-पोषण न कर पाने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में “निवासी परदेशी और अस्थायी निवासी” पद संक्षिप्त और वाक्यगत रूप से अस्पष्ट है। इसे इस प्रकार भी समझा जा सकता है: “तुम उसे—निवासी परदेशी और अस्थायी निवासी को—सहारा देना।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: यदि
  rationale: यह व्यवस्था के अंतर्गत एक शर्तपूर्ण स्थिति प्रस्तुत करता है; आधुनिक हिन्दी में ‘यदि’ स्वाभाविक और स्पष्ट है।
- source_word: יָמוּךְ
  choice: निर्धन हो जाए
  rationale: आर्थिक दशा में गिरावट और साधनहीन होने का भाव व्यक्त करता है।
- source_word: אָחִיךָ
  choice: तुम्हारा भाई
  rationale: मूल का पारिवारिक संबोधन बनाए रखता है; प्रसंग में यह वाचा-समुदाय के सहसदस्य की ओर संकेत करता है।
- source_word: וּמָטָה יָדוֹ עִמָּךְ
  choice: तुम्हारे पास रहते हुए उसके साधन चुकने लगें
  rationale: ‘हाथ डगमगाना’ आर्थिक सामर्थ्य खोने का इब्रानी मुहावरा है। हिन्दी में अर्थ स्पष्ट किया गया है, जबकि עִמָּךְ का सामुदायिक-समीपी भाव ‘तुम्हारे पास रहते हुए’ से रखा गया है।
- source_word: וְהֶחֱזַקְתָּ בּוֹ
  choice: तुम उसे सहारा देना
  rationale: हिफ़ील रूप यहाँ संकटग्रस्त व्यक्ति को थामने और संभालने का आदेश देता है; ‘सहारा देना’ आर्थिक और सामाजिक सहायता दोनों को समेटता है।
- source_word: גֵּר
  choice: परदेशी निवासी
  rationale: उस गैर-स्थानीय व्यक्ति को सूचित करता है जो समुदाय के बीच निवास करता है; यह कानूनी-सामाजिक भेद को स्पष्ट रखता है।
- source_word: וְתוֹשָׁב
  choice: अस्थायी निवासी
  rationale: कम स्थायी या आश्रित निवास-स्थिति को दर्शाता है और גֵּר से भेद बनाए रखता है।
- source_word: וָחַי
  choice: ताकि वह ... जीवित रह सके
  rationale: सहारा देने के उद्देश्य अथवा परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עִמָּךְ
  choice: तुम्हारे पास
  rationale: व्यक्ति के समुदाय के निकट और उसके बीच बने रहने का संबंधपरक-स्थानिक भाव सुरक्षित रखता है।
theological_decisions:
- issue: ‘तुम्हारा भाई’ का दायरा
  choice: मूल का ‘तुम्हारा भाई’ बनाए रखा गया है, जिसे प्रसंग में वाचा-समुदाय के सहसदस्य के रूप में समझा जा सकता है।
  alternative: ‘तुम्हारा साथी इस्राएली’ या ‘तुम्हारा स्वजन’
  rationale: अनुवाद स्रोत के रिश्तेदारी-वाचक रूप को किसी व्याख्यात्मक सामान्यीकरण से नहीं बदलता।
- issue: גֵּר וְתוֹשָׁב का वाक्यगत संबंध
  choice: 'इसे निर्धन भाई की संरक्षित निवास-स्थिति से तुलना करने वाला पद माना गया है: ‘परदेशी निवासी या अस्थायी निवासी के समान।’'
  alternative: 'इसे सहायता पाने वाले अतिरिक्त वर्गों के रूप में पढ़ा जा सकता है: ‘उसे—अर्थात परदेशी निवासी और अस्थायी निवासी को—सहारा देना।’'
  rationale: इब्रानी रचना संक्षिप्त और वाक्यगत रूप से अस्पष्ट है। मुख्य पाठ एक संभावित स्वाभाविक संबंध चुनता है और दूसरा पाठांतर टिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और निर्देशात्मक विधान-शैली वाला रूप। ‘निर्धन’, ‘सहारा देना’, और निवास-श्रेणियों के स्पष्ट पद सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की कानूनी-सामाजिक बारीकियाँ रखते हैं।
