base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/033.yaml
  text: And if one of the Levites redeems it[a], then the sale of the house in the city of his possession shall be released in the Jubilee[b]; for the houses of the cities of the Levites are their possession among the sons of Israel.
translation:
  language: hi
  text: और यदि लेवियों में से कोई उसे छुड़ा ले, तो उसके अधिकार के नगर में बेचा गया घर जुबली के वर्ष में मुक्त हो जाएगा[a]; क्योंकि लेवियों के नगरों के घर इस्राएलियों के बीच उनकी संपत्ति हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘निकल जाएगा’; अर्थात वह घर खरीदार के अधिकार से निकलकर उस लेवी के पास लौट जाएगा जिसका उस पर अधिकार था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם
  choice: और यदि लेवियों में से कोई उसे छुड़ा ले
  rationale: מן को यहाँ समूह में से किसी एक को सूचित करने वाला अंशवाचक माना गया है। גאל संपत्ति को कानूनी रूप से वापस छुड़ाने की क्रिया है; ‘उसे’ पिछले संदर्भ में उल्लिखित घर को सूचित करता है।
- source_word: וְיָצָא מִמְכַּר בַּיִת
  choice: बेचा गया घर ... मुक्त हो जाएगा
  rationale: וְיָצָא का शाब्दिक अर्थ ‘निकल जाएगा’ है, पर जुबली-संबंधी संपत्ति-कानून में आशय यह है कि घर खरीदार के अधिकार से मुक्त होकर लौटेगा। מִמְכַּר को केवल लेन-देन नहीं, बेची गई वस्तु के अर्थ में लिया गया है।
- source_word: וְעִיר אֲחֻזָּתוֹ
  choice: उसके अधिकार वाले नगर में
  rationale: संक्षिप्त हिब्रू रचना को प्रसंगानुसार उस लेवी के अधिकार/हिस्से वाले नगर में स्थित घर के रूप में व्यक्त किया गया है।
- source_word: בַּיֹּבֵל
  choice: जुबली के वर्ष में
  rationale: यह भूमि और संपत्ति की वापसी के ठहराए हुए जुबली वर्ष का तकनीकी उल्लेख है।
- source_word: בָּתֵּי עָרֵי הַלְוִיִּם
  choice: लेवियों के नगरों के घर
  rationale: हिब्रू की संबंधसूचक संज्ञा-शृंखला को निकटता से रखा गया है।
- source_word: הִוא אֲחֻזָּתָם
  choice: उनकी अपनी संपत्ति हैं
  rationale: אֲחֻזָּה स्थायी या वंशगत अधिकार वाली संपत्ति को सूचित करता है; ‘अपनी संपत्ति’ स्वामित्व के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के बीच
  rationale: בְּנֵי יִשְׂרָאֵל यहाँ पूरे वाचा-समुदाय का रूढ़ सामूहिक नाम है; आधुनिक हिन्दी में ‘इस्राएली’ उसका सहज और सटीक रूप है।
theological_decisions:
- issue: מִן הַלְוִיִּם का संबंध
  choice: लेवियों में से कोई
  alternative: कोई लेवियों से छुड़ाए
  rationale: व्यवस्था का प्रसंग लेवी द्वारा अपने नगर के घर को छुड़ाने का है; अंशवाचक अर्थ व्याकरण और संदर्भ दोनों के अनुकूल है और संबंध को उलटने से बचाता है।
- issue: בְּנֵי יִשְׂרָאֵל का हिन्दी रूप
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह वाक्यांश यहाँ केवल पुरुष वंशजों को अलग करके नहीं, समस्त इस्राएली समुदाय को सूचित करने वाला स्थापित सामूहिक पद है। ‘इस्राएली’ आधुनिक हिन्दी में उसी अर्थ को गरिमापूर्वक रखता है।
- issue: जुबली में घर के ‘निकलने’ का अर्थ
  choice: मुक्त हो जाएगा
  alternative: लौट जाएगा
  rationale: मूल क्रिया की कानूनी छवि खरीदार के अधिकार से निकलने की है। ‘मुक्त’ इस प्रभाव को रखता है, जबकि वापसी का आशय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक प्रसंग के अनुरूप रखी गई है। ‘छुड़ा ले’, ‘अधिकार वाले नगर’ और ‘मुक्त हो जाएगा’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि मूल के संपत्ति-कानून संबंधी अर्थ को बनाए रखते हैं।
