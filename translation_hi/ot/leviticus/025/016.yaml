  text: לְ/פִ֣י רֹ֣ב הַ/שָּׁנִ֗ים תַּרְבֶּה֙ מִקְנָת֔/וֹ וּ/לְ/פִי֙ מְעֹ֣ט הַ/שָּׁנִ֔ים תַּמְעִ֖יט מִקְנָת֑/וֹ כִּ֚י מִסְפַּ֣ר תְּבוּאֹ֔ת ה֥וּא מֹכֵ֖ר לָֽ/ךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/016.yaml
  text: In proportion to the greater number of years you shall increase its purchase price[a], and in proportion to the fewer number of years you shall reduce its purchase price, because he is selling to you a number of harvests.
translation:
  language: hi
  text: वर्षों की संख्या जितनी अधिक हो, तुम उसका खरीद-मूल्य उतना ही बढ़ाना; और वर्षों की संख्या जितनी कम हो, उसका खरीद-मूल्य उतना ही घटाना, क्योंकि वह तुम्हें फसलों[a] की संख्या बेच रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपजों” अथवा “कटाइयों।” इब्रानी शब्द תְּבוּאוֹת के ये अर्थ हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפִי
  choice: जितनी… उतना ही / के अनुसार
  rationale: यह इब्रानी मुहावरा संख्या और मूल्य के बीच अनुपात प्रकट करता है। हिंदी की ‘जितनी… उतना ही’ रचना उस आनुपातिक संबंध को स्वाभाविक और स्पष्ट बनाती है।
- source_word: רֹב הַשָּׁנִים / מְעֹט הַשָּׁנִים
  choice: वर्षों की संख्या जितनी अधिक / जितनी कम
  rationale: दोनों समानांतर पद अधिक और कम वर्षों का तुलनात्मक विरोध व्यक्त करते हैं; यह रूप कानूनी निर्देश की समरूपता बनाए रखता है।
- source_word: תַּרְבֶּה / תַּמְעִיט
  choice: बढ़ाना / घटाना
  rationale: दोनों हिफ़ील क्रियाएँ मूल्य को क्रमशः अधिक और कम करने का निर्देश देती हैं। हिंदी में आदेशात्मक ‘बढ़ाना/घटाना’ संहिता की शैली में सहज है।
- source_word: מִקְנָתוֹ
  choice: उसका खरीद-मूल्य
  rationale: מִקְנָה का अर्थ खरीदी गई वस्तु, खरीद अथवा खरीद का मूल्य हो सकता है। वर्षों और फसलों के आधार पर मूल्य तय करने के संदर्भ में ‘खरीद-मूल्य’ लेन-देन का आशय सबसे स्पष्ट रूप से बताता है, जबकि ‘उसका’ इब्रानी प्रत्यय को बनाए रखता है।
- source_word: מִסְפַּר תְּבוּאֹת
  choice: फसलों की एक निश्चित संख्या
  rationale: यह पद गिनी जा सकने वाली भावी उपजों या फसल-चक्रों को दर्शाता है। ‘एक निश्चित संख्या’ अनिश्चित מִסְפַּר का आशय स्वाभाविक हिंदी में व्यक्त करता है, और ‘फसलें’ सामान्य पाठक के लिए ठोस तथा सुबोध है।
- source_word: הוּא מֹכֵר לָךְ
  choice: वह तुम्हें … बेच रहा है
  rationale: पुल्लिंग एकवचन कर्ता और संबोधित व्यक्ति को बनाए रखते हुए कृदंत को वर्तमान प्रगतिशील रूप में व्यक्त किया गया है; यह लेन-देन के वास्तविक स्वरूप की व्याख्या करता है।
