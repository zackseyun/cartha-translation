id: LEV.25.42
reference: Leviticus 25:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם לֹ֥א יִמָּכְר֖וּ מִמְכֶּ֥רֶת עָֽבֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/042.yaml
  text: For they are my servants[a], whom I brought out from the land of Egypt[b]; they shall not be sold as servants are sold.
translation:
  language: hi
  text: क्योंकि वे मेरे दास[a] हैं, जिन्हें मैं मिस्र देश से निकाल लाया; उन्हें उस तरह न बेचा जाए जैसे किसी दास को बेचा जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दास’ का अनुवाद ‘सेवक’ भी हो सकता है। यहाँ इब्रानी शब्द स्वामित्व और सेवा दोनों का भाव रखता है; आगे बिक्री की मनाही होने के कारण दासत्व का कानूनी पक्ष विशेष रूप से उभरता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘दास की बिक्री के साथ’; अर्थात उन्हें सामान्य दास-विक्रय की रीति से न बेचा जाए।
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शब्द पिछली व्यवस्था का आधार बताता है; ‘क्योंकि’ उसके कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֲבָדַי
  choice: मेरे दास
  rationale: עֶבֶד के साथ प्रथम पुरुष एकवचन प्रत्यय है। ‘दास’ सेवा और स्वामित्व, दोनों अर्थ-छायाओं को रखता है; इस प्रसंग में इस्राएलियों का यहोवा से संबंध ही उन्हें सामान्य दास-संपत्ति की तरह बेचे जाने से रोकता है।
- source_word: הֵם
  choice: वे ... हैं
  rationale: स्पष्ट सर्वनाम पर बल है; हिन्दी में ‘हैं’ जोड़कर नामवाचक वाक्य स्वाभाविक रूप से व्यक्त होता है।
- source_word: אֲשֶׁר הוֹצֵאתִי אֹתָם
  choice: जिन्हें मैं ... निकाल लाया
  rationale: संबंधवाचक उपवाक्य और निर्गमन के प्रचलित क्रियात्मक भाव—परमेश्वर द्वारा बाहर लाना—दोनों सुरक्षित रहते हैं।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: भौगोलिक पदबंध का संक्षिप्त, स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: לֹא יִמָּכְרוּ
  choice: उन्हें ... न बेचा जाए
  rationale: निफ़अल रूप की कर्मवाच्य निषेधात्मक कानूनी शक्ति को हिन्दी के ‘न बेचा जाए’ से व्यक्त किया गया है।
- source_word: מִמְכֶּרֶת עָבֶד
  choice: उस तरह ... जैसे किसी दास को बेचा जाता है
  rationale: शाब्दिक पदबंध ‘दास की बिक्री’ बिक्री के प्रकार या ढंग को बताता है। यह रूप सामान्य दास-विक्रय जैसी लेन-देन की मनाही को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: यहोवा के साथ इस्राएल के संबंध में עֶבֶד का अर्थ
  choice: दास
  alternative: सेवक
  rationale: ‘सेवक’ संभव अर्थ है, पर इस पद में स्वामित्व और बिक्री की मनाही केंद्रीय हैं। ‘दास’ उस सामाजिक-कानूनी तनाव को अधिक स्पष्ट रखता है, फिर भी हिन्दी में सेवा की अर्थ-छाया को पूरी तरह नहीं मिटाता।
- issue: निर्गमन को बिक्री की मनाही का आधार बनाना
  choice: कारणसूचक ‘क्योंकि’ को स्पष्ट रखा गया
  alternative: दो स्वतंत्र कथनों की तरह अनुवाद
  rationale: 'मूल पाठ में כִּי इस व्यवस्था का धर्मवैधानिक आधार देता है: जिन्हें परमेश्वर मिस्र से निकाल लाया, उन पर किसी इस्राएली का साधारण दास-संपत्ति जैसा अधिकार नहीं हो सकता। अनुवाद इस संबंध को स्पष्ट रखता है, पर उससे आगे कोई संप्रदायगत निष्कर्ष नहीं जोड़ता।'
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘दास’ मूल के एक ही शब्द को दोनों स्थानों पर दोहराता है और ‘गुलाम’ की अपेक्षा बाइबलीय-कानूनी शैली में अधिक स्वाभाविक रहते हुए बंधुआ स्थिति को छिपाता नहीं। अर्धविराम कारण और निषेध के निकट संबंध को दिखाता है।
