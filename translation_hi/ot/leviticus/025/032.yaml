source:
  edition: WLC
  text: וְ/עָרֵי֙ הַ/לְוִיִּ֔ם בָּתֵּ֖י עָרֵ֣י אֲחֻזָּתָ֑/ם גְּאֻלַּ֥ת עוֹלָ֖ם תִּהְיֶ֥ה לַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/032.yaml
  text: As for the cities of the Levites[a], the houses in the cities of their possession may be redeemed permanently by the Levites.
translation:
  language: hi
  text: लेवियों के नगरों के विषय में, उनकी संपत्ति के नगरों में जो घर हैं, उन्हें छुड़ाने का अधिकार लेवियों को सदा रहेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक औपचारिक रूप से: “लेवियों के लिए सदा का छुड़ाने का अधिकार होगा।”'
    reason: हिब्रू की संज्ञात्मक कानूनी रचना का अधिक शब्दशः विकल्प।
lexical_decisions:
- source_word: וְ/עָרֵי הַ/לְוִיִּם
  choice: लेवियों के नगरों की बात यह है
  rationale: संयोजक वाव के साथ यह पद कानूनी चर्चा में एक नया विषय प्रस्तुत करता है। यह हिंदी प्रयोग उस विषय-परिवर्तन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בָּתֵּי עָרֵי אֲחֻזָּתָם
  choice: उनके अधिकार में मिले नगरों के घरों
  rationale: אֲחֻזָּה भूमि अथवा विरासत में प्राप्त स्थायी संपत्ति या अधिकार को दर्शाता है। ‘अधिकार में मिले’ उसके कानूनी और प्रदत्त-अधिकार वाले भाव को सहज हिंदी में रखता है।
- source_word: גְּאֻלַּת
  choice: छुड़ाने का अधिकार
  rationale: यहाँ संज्ञा ‘छुड़ाना/मोचन’ कानूनी रूप से संपत्ति को वापस लेने के अधिकार को व्यक्त करती है; केवल ‘छुटकारा’ इस संपत्ति-संबंधी अर्थ को स्पष्ट नहीं करेगा।
- source_word: עוֹלָם
  choice: सदा
  rationale: कानूनी संदर्भ में यह निरंतर और स्थायी रूप से उपलब्ध अधिकार बताता है। ‘सदा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: תִּהְיֶה לַ/לְוִיִּם
  choice: लेवियों को ... रहेगा
  rationale: लामेद उस समुदाय को चिह्नित करता है जिसके लिए यह अधिकार सुरक्षित है; हिंदी में ‘लेवियों को ... अधिकार रहेगा’ इस कानूनी प्रावधान को स्पष्ट करता है।
theological_decisions:
- issue: लेवीय घरों को छुड़ाने संबंधी विधान का कानूनी बल
  choice: लेवियों को अपने नगरों के घर छुड़ाने का स्थायी अधिकार है।
  alternative: ‘लेवियों के लिए सदा छुड़ाना होगा’ जैसा अधिक शब्दशः कथन।
  rationale: हिब्रू का संज्ञात्मक विधान גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם किसी हर समय अनिवार्य कार्य की अपेक्षा निरंतर उपलब्ध कानूनी अधिकार स्थापित करता है। मुख्य पाठ इस बल को स्पष्ट करता है और अधिक औपचारिक रचना पादटिप्पणी में रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सामान्य पाठक के लिए स्पष्ट और कानूनी संदर्भ के अनुरूप गरिमापूर्ण रखी गई है। ‘छुड़ाने’ को संपत्ति वापस लेने के अर्थ में प्रयोग किया गया है; पादटिप्पणी मूल की औपचारिक संरचना सुरक्षित रखती है।
