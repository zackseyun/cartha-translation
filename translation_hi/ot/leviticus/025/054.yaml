base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/054.yaml
  text: But if he is not redeemed by these means[a], then he and his sons with him shall go out in the year of Jubilee.
translation:
  language: hi
  text: परन्तु यदि वह इन उपायों से[a] छुड़ाया न जाए, तो वह अपने बेटों समेत जुबली के वर्ष में निकल जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इनसे”—अर्थात पिछली आयतों में बताए गए छुड़ाने के प्रावधानों से।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले छुटकारे के प्रावधानों से जुड़ी शर्त प्रस्तुत करता है और हल्का विरोध भी व्यक्त करता है।
- source_word: יִגָּאֵל
  choice: छुड़ाया जाए
  rationale: निफ़अल रूप इस कानूनी प्रसंग में किसी निकट संबंधी या निर्धारित भुगतान द्वारा दासता से छुड़ाए जाने को दर्शाता है।
- source_word: בְּאֵלֶּה
  choice: इन उपायों से
  rationale: संकेतवाचक शब्द पिछली आयतों में बताए गए छुड़ाने के प्रावधानों की ओर लौटता है; 'उपायों' से हिन्दी में संदर्भ स्वाभाविक रूप से स्पष्ट होता है।
- source_word: וְיָצָא
  choice: तो ... निकल जाएँ
  rationale: मूलतः 'और वह निकलेगा'; शर्त के परिणाम को हिन्दी में 'तो' स्पष्ट करता है, जबकि 'निकलना' इब्रानी कानूनी मुहावरे को बनाए रखता है।
- source_word: בִּשְׁנַת הַיֹּבֵל
  choice: जुबली के वर्ष में
  rationale: यह लैव्यव्यवस्था में יוֹבֵל के विशेष कानूनी वर्ष का प्रचलित बाइबलीय पद है।
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: वह और उसके साथ उसके बेटे
  rationale: स्वतंत्र सर्वनाम को रखा गया है और בָנָיו के स्पष्ट पुल्लिंग अर्थ 'बेटे' को व्यापक बनाकर 'बच्चे' नहीं किया गया।
theological_decisions:
- issue: בָנָיו का लिंग-सूचक घरेलू पद
  choice: बेटे
  alternative: बच्चे
  rationale: इब्रानी पाठ स्पष्ट रूप से पुल्लिंग बहुवचन 'बेटे' कहता है; अनुवाद स्रोत की लिंग-सूचक अभिव्यक्ति को सुरक्षित रखता है।
- issue: יָצָא का कानूनी आशय
  choice: निकल जाएँ
  alternative: मुक्त कर दिए जाएँ
  rationale: प्रसंग दासता से रिहाई का है, पर मूल पाठ के ठोस मुहावरे 'निकलना' को बनाए रखने से उसका कानूनी आशय बिना अतिरिक्त व्याख्या थोपे सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कानूनी-विधिक लहजा अपनाया गया है। 'जुबली' को पुस्तक के पारिभाषिक पद के रूप में रखा गया है; वाक्य-क्रम हिन्दी की स्वाभाविकता के अनुसार समायोजित है।
