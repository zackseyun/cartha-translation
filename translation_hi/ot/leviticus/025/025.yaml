source:
  edition: WLC
  text: כִּֽי יָמ֣וּךְ אָחִ֔י/ךָ וּ/מָכַ֖ר מֵ/אֲחֻזָּת֑/וֹ וּ/בָ֤א גֹֽאֲל/וֹ֙ הַ/קָּרֹ֣ב אֵלָ֔י/ו וְ/גָאַ֕ל אֵ֖ת מִמְכַּ֥ר אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/025.yaml
  text: If your brother becomes poor and sells some of his property[b][a], then his nearest kinsman-redeemer shall come and redeem what his brother has sold.
translation:
  language: hi
  text: यदि तुम्हारा भाई निर्धन हो जाए और अपनी पैतृक भूमि का कुछ भाग बेच दे, तो उसका निकटतम छुड़ाने वाला संबंधी आए और उस भूमि को छुड़ाए जिसे उस भाई ने बेचा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “छुड़ाने वाला संबंधी” वह निकट संबंधी था जिसे परिवार की पैतृक भूमि छुड़ाने का अधिकार और दायित्व था।
    reason: cultural_note
lexical_decisions:
- source_word: יָמוּךְ
  choice: निर्धन हो जाए
  rationale: यह क्रिया आर्थिक रूप से कमजोर या गरीब हो जाने को दर्शाती है; कानूनी प्रसंग में यह स्वाभाविक और स्पष्ट है।
- source_word: אָחִיךָ
  choice: तुम्हारा भाई
  rationale: मूल पाठ का शाब्दिक पारिवारिक संबोधन रखा गया है; इस व्यवस्था में इसका दायरा इस्राएली समुदाय के सदस्य तक हो सकता है।
- source_word: מֵאֲחֻזָּתוֹ
  choice: अपनी पैतृक भूमि का कुछ भाग
  rationale: इस संदर्भ में אֲחֻזָּה सामान्य संपत्ति नहीं, बल्कि कुल और गोत्र में मिली वंशानुगत भूमि है।
- source_word: גֹאֲלוֹ הַקָּרֹב אֵלָיו
  choice: उसका निकटतम छुड़ानेवाला रिश्तेदार
  rationale: גאל परिवार की भूमि वापस लेने का अधिकार और दायित्व रखने वाले निकट संबंधी को सूचित करता है; ‘रिश्तेदार’ से नातेदारी स्पष्ट होती है।
- source_word: וּבָא וְגָאַל
  choice: आकर ... छुड़ा ले
  rationale: कानूनी निर्देश के प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है और न तो इसे केवल संभावना बनाता है, न भविष्यवाणी।
- source_word: אֵת מִמְכַּר אָחִיו
  choice: उसके भाई की बेची हुई भूमि
  rationale: מִמְכָּר यहाँ बेची गई वस्तु को दर्शाता है; प्रसंग से वह वस्तु पैतृक भूमि है।
theological_decisions:
- issue: इस्राएली व्यवस्था में नातेदारी की भाषा
  choice: तुम्हारा भाई
  alternative: तुम्हारा सजातीय / तुम्हारा साथी इस्राएली
  rationale: मूल का ‘भाई’ सुरक्षित रखा गया है, जबकि उसके सामुदायिक कानूनी विस्तार को अनुवाद में चुपचाप प्रतिस्थापित नहीं किया गया।
- issue: גאל की कानूनी और धर्मवैचारिक शब्दावली
  choice: छुड़ानेवाला रिश्तेदार / छुड़ा ले
  alternative: छुड़ानेवाला / वापस खरीद ले
  rationale: यह रूप पारिवारिक भूमिका और भूमि को पुनः प्राप्त करने की कानूनी क्रिया दोनों को व्यक्त करता है; केवल व्यापारिक ‘वापस खरीदना’ शब्द की व्यापक प्रतिध्वनि घटा देता।
- issue: וּבָא וְגָאַל का विधिक बल
  choice: आकर ... छुड़ा ले
  alternative: आ सकता है और छुड़ा सकता है
  rationale: क्रमबद्ध वाव-रूप इस प्रासंगिक व्यवस्था में अपेक्षित कानूनी कार्रवाई बताते हैं। हिन्दी का आज्ञार्थक-विधिक रूप उस बल को रखता है, पर उसे भविष्यवाणी नहीं बनाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘पैतृक भूमि’ से इस्राएल की वंशानुगत भू-व्यवस्था स्पष्ट होती है; ‘छुड़ानेवाला रिश्तेदार’ कानूनी पद को सहज हिन्दी में व्यक्त करता है।
