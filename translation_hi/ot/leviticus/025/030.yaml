base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/030.yaml
  text: But if it is not redeemed before a full year is completed for it[a], then the house that is in a city that has no wall shall pass permanently to the one who bought it, throughout his generations[b]; it shall not go out in the Jubilee.
translation:
  language: hi
  text: परन्तु यदि पूरा एक वर्ष बीतने तक उसे छुड़ाया न जाए, तो जिस नगर की चारदीवारी है[a], उसमें स्थित वह घर स्थायी रूप से उस खरीदार और उसकी पीढ़ियों का हो जाएगा[b]; वह जुबली-वर्ष में वापस नहीं जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मसोरेटी पठन-परंपरा के अनुसार, ‘जिसकी चारदीवारी है।’ लिखित व्यंजनात्मक पाठ का अर्थ ‘जिसकी चारदीवारी नहीं है’ हो सकता है। प्रसंग और पद 31 परंपरागत पठन का समर्थन करते हैं।
    reason: textual_variant
  - marker: b
    text: शाब्दिक रूप से, ‘घर स्थायी रूप से कायम रहेगा।’ यह इब्रानी कानूनी मुहावरा बताता है कि खरीदार का स्वामित्व पक्का हो जाता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात वह घर जुबली-वर्ष में मूल मालिक के परिवार को वापस नहीं मिलेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגָּאֵל
  choice: छुड़ाया जाए
  rationale: निफ़अल रूप यहाँ संपत्ति को निर्धारित अवधि में मूल्य देकर वापस लेने का कानूनी अर्थ व्यक्त करता है। ‘छुड़ाया जाए’ लैव्यव्यवस्था 25 की मोचन-संबंधी शब्दावली बनाए रखता है।
- source_word: עַד מְלֹאת לוֹ שָׁנָה תְמִימָה
  choice: पूरे एक वर्ष के पूरा होने तक
  rationale: यह घर की बिक्री के बाद उसे छुड़ाने की पूर्ण एक-वर्षीय समय-सीमा बताता है; हिन्दी में सर्वनाम को दोहराए बिना अर्थ स्वाभाविक रूप से स्पष्ट है।
- source_word: וְקָם ... לַצְּמִיתֻת
  choice: स्थायी अधिकार हो जाएगा
  rationale: शाब्दिक ‘खड़ा रहेगा’ इस कानूनी प्रसंग में बिक्री अथवा स्वामित्व के स्थायी रूप से पक्का हो जाने का मुहावरा है। चुना हुआ रूप कानूनी परिणाम स्पष्ट करता है।
- source_word: הַבַּיִת אֲשֶׁר בָּעִיר אֲשֶׁר לא/לוֹ חֹמָה
  choice: जिस नगर की चारदीवारी है, उसमें स्थित वह घर
  rationale: मसोरेटी पठन-परंपरा (क़ेरे) לוֹ, ‘जिसकी चारदीवारी है,’ पढ़ती है और निकटवर्ती नियम तथा पद 31 से मेल खाती है। व्यंजनात्मक लेखन לא, ‘नहीं,’ को पाठ-संबंधी पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לַקֹּנֶה אֹתוֹ לְדֹרֹתָיו
  choice: खरीदने वाले और उसकी आने वाली पीढ़ियों का
  rationale: यह खरीदार के वंश में लगातार बने रहने वाले स्वामित्व को व्यक्त करता है। ‘आने वाली पीढ़ियाँ’ आधुनिक हिन्दी में अर्थ को स्पष्ट करती हैं।
- source_word: לֹא יֵצֵא בַּיּוֹבֵל
  choice: वह जुबली-वर्ष में वापस नहीं जाएगा
  rationale: ‘बाहर नहीं निकलेगा’ का कानूनी आशय है कि घर जुबली में मूल मालिक के परिवार को वापस नहीं मिलेगा। ‘वापस नहीं जाएगा’ मूल की गतिसूचक छवि और कानूनी अर्थ दोनों रखता है।
- source_word: יּוֹבֵל
  choice: जुबली-वर्ष
  rationale: लैव्यव्यवस्था 25 की स्थापित संस्था के लिए ‘जुबली-वर्ष’ संक्षिप्त और पहचाना जाने वाला पद है।
theological_decisions:
- issue: चारदीवारी वाले नगर के घर की बिक्री का स्थायी कानूनी प्रभाव
  choice: यदि घर पूरे एक वर्ष में न छुड़ाया जाए, तो वह खरीदार और उसकी पीढ़ियों के स्थायी अधिकार में रहता है तथा जुबली में मूल परिवार को वापस नहीं जाता।
  alternative: וְקָם को केवल ‘कायम रहेगा’ कहकर स्वामित्व के कानूनी परिणाम को कम स्पष्ट रखना।
  rationale: וְקָם, לַצְּמִיתֻת, לְדֹרֹתָיו और לֹא יֵצֵא בַּיּוֹבֵל का संयुक्त बल स्थायी, वंशानुगत और जुबली से अप्रभावित स्वामित्व बताता है; अनुवाद इससे आगे कोई सम्प्रदायगत निष्कर्ष नहीं जोड़ता।
- issue: לא का लेखित रूप और לוֹ का परंपरागत पठन
  choice: मुख्य पाठ में मसोरेटी क़ेरे ‘जिसकी चारदीवारी है’ अपनाना और केतिव ‘जिसकी चारदीवारी नहीं है’ को पादटिप्पणी में देना।
  alternative: व्यंजनात्मक केतिव के अनुसार ‘जिसकी चारदीवारी नहीं है’ मुख्य पाठ में रखना।
  rationale: क़ेरे, पद 29 में आरम्भ हुए चारदीवारी वाले नगर के नियम और पद 31 में चारदीवारी रहित बस्तियों के विपरीत प्रावधान से संगत है; फिर भी वास्तविक पाठांतर को छिपाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कानूनी अर्थ समझाने के लिए ‘स्थायी अधिकार’ प्रयुक्त हुआ है, जबकि मूल इब्रानी मुहावरे और महत्वपूर्ण क़ेरे/केतिव भेद पादटिप्पणियों में सुरक्षित हैं।
