  text: And in all the land of your possession[b][a], you shall grant redemption for the land.
translation:
  language: hi
  text: और तुम्हारे अधिकार में जो सारी भूमि है, उसमें तुम भूमि को छुड़ाने का अधिकार दोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכֹל
  choice: और अपनी सारी … में
  rationale: संयोजक וּ और בְכֹל को स्वाभाविक हिन्दी में ‘और … सारी … में’ से व्यक्त किया गया है; इससे पूरे भू-क्षेत्र पर लागू सामान्य नियम स्पष्ट होता है।
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: अपनी सारी निज-भूमि
  rationale: אֲחֻזָּה यहाँ इस्राएल में मिली स्थायी अथवा पैतृक भू-संपत्ति को सूचित करता है। ‘निज-भूमि’ कानूनी भूमि-अधिकार का भाव रखता है, जबकि टिप्पणी इसके विरासती संदर्भ को स्पष्ट करती है।
- source_word: גְּאֻלָּה
  choice: छुड़ाने का अधिकार
  rationale: यह संज्ञा मूल्य देकर बेची हुई भूमि को फिर प्राप्त करने की क्रिया या उसके अधिकार—दोनों को सूचित कर सकती है। कानूनी प्रसंग में ‘छुड़ाने का अधिकार’ सहज है, पर वैकल्पिक अधिक शाब्दिक अर्थ टिप्पणी में रखा गया है।
- source_word: תִּתְּנוּ
  choice: तुम … दोगे
  rationale: मूल क्रिया का सीधा अर्थ ‘देना’ है। व्यवस्था-संबंधी आदेश में हिन्दी का भविष्यत् रूप ‘दोगे’ बाध्यकारी विधान को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לָאָרֶץ
  choice: भूमि को
  rationale: לְ यहाँ छुड़ाने की व्यवस्था के संबंध-विषय को चिह्नित करता है। हिन्दी में ‘भूमि को छुड़ाने’ से यह संबंध स्पष्ट और स्वाभाविक बनता है।
theological_decisions:
- issue: बेची हुई पैतृक भूमि के विषय में आदेश का स्वरूप
  choice: आदेश भूमि को फिर छुड़ा लेने का अधिकार देने की माँग करता है।
  alternative: अधिक शाब्दिक रूप से इसे ‘भूमि के लिए छुड़ौती दोगे’ कहा जा सकता है, जिसमें अधिकार की अपेक्षा छुड़ाने की क्रिया पर बल होगा।
  rationale: लैव्यव्यवस्था 25 का कानूनी संदर्भ पैतृक भूमि की वापसी की वास्तविक व्यवस्था बताता है। ‘अधिकार’ इस संदर्भ को स्पष्ट करता है, पर גְּאֻלָּה में निहित क्रिया/अधिकार की अस्पष्टता को टिप्पणी में सुरक्षित रखा गया है और किसी बाद की धर्मवैज्ञानिक धारणा को आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘निज-भूमि’ कानूनी-पैतृक भाव को संक्षेप में व्यक्त करता है; ‘छुड़ाने का अधिकार’ प्रसंगानुकूल है, और मूल की क्रिया/अधिकार संबंधी अर्थ-व्याप्ति पादटिप्पणी में बनी रहती है।
