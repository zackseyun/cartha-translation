source:
  edition: WLC
  text: כִּֽי לִ֤/י בְנֵֽי יִשְׂרָאֵל֙ עֲבָדִ֔ים עֲבָדַ֣/י הֵ֔ם אֲשֶׁר הוֹצֵ֥אתִי אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/055.yaml
  text: For the sons of Israel are my servants[a]; they are my servants, whom I brought out of the land of Egypt[b]. I am Yahweh your God.
translation:
  language: hi
  text: क्योंकि इस्राएल के पुत्र[a] मेरे दास[b] हैं; वे मेरे दास हैं, जिन्हें मैं मिस्र देश से निकाल लाया हूँ। मैं यहोवा, तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात इस्राएली; इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’। यह पूरे इस्राएली समुदाय के लिए प्रयुक्त सामूहिक पद है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सेवक’। इब्रानी शब्द बंधी हुई सेवा को भी दर्शा सकता है; यहाँ जोर इस बात पर है कि इस्राएली मनुष्यों के नहीं, यहोवा के अधिकार में हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले विधान का कारण बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִי
  choice: मेरे
  rationale: यहाँ पूर्वसर्ग और सर्वनाम अधिकार अथवा संबंध व्यक्त करते हैं; ‘मेरे दास’ संक्षिप्त और स्वाभाविक है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: मूल इब्रानी के पारिवारिक-सामूहिक पदबंध को बनाए रखता है; पादटिप्पणी स्पष्ट करती है कि आशय समस्त इस्राएली समुदाय से है।
- source_word: עֲבָדִים / עֲבָדַי
  choice: दास / मेरे ही दास
  rationale: ‘दास’ बंधी हुई सेवा और स्वामित्व-संबंध दोनों का बल रखता है। ‘ही’ मूल की पुनरुक्ति और यहोवा से विशिष्ट संबंध पर जोर को स्वाभाविक हिन्दी में उभारता है।
- source_word: אֲשֶׁר הוֹצֵאתִי אוֹתָם
  choice: जिन्हें मैं ... निकाल लाया हूँ
  rationale: हिफ़ील क्रिया निर्गमन के स्थापित भाव, अर्थात परमेश्वर द्वारा बाहर निकाल लाने, को व्यक्त करती है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: मूल के निर्गमन-सूत्र को स्पष्ट और सहज हिन्दी में प्रस्तुत करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य नाम को उपाधि से प्रतिस्थापित न करके हिन्दी में प्रचलित नामरूप से प्रस्तुत किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: मूल के वाचा-संबंधी संबोधन और बहुवचन ‘तुम्हारा’ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: वाचागत संबंध और बंधी हुई सेवा के संदर्भ में עבד का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: अध्याय का तर्क यह है कि इस्राएली स्थायी रूप से मनुष्य के स्वामित्व में नहीं दिए जा सकते, क्योंकि वे यहोवा के हैं। ‘दास’ इस अधिकार-संबंध और बंधी सेवा का बल ‘सेवक’ से अधिक स्पष्ट रखता है, पर पादटिप्पणी शब्द की अर्थ-सीमा भी बताती है।
- issue: בְנֵי יִשְׂרָאֵל का लिंगयुक्त सामूहिक पदबंध
  choice: इस्राएल के पुत्र
  alternative: इस्राएली / इस्राएल की संतान
  rationale: मुख्य पाठ मूल के रूपकात्मक-पारिवारिक पदबंध को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि यह पूरे इस्राएली समुदाय का सामूहिक नाम है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की दोहरी घोषणा को अर्धविराम और ‘ही’ के द्वारा बनाए रखा गया है; दिव्य नाम के लिए ‘यहोवा’ प्रयुक्त है।
