  yaml_path: translation/ot/leviticus/025/017.yaml
  text: And no man shall oppress his neighbor[a], but you shall fear your God, for I am Yahweh your God.
translation:
  language: hi
  text: कोई पुरुष अपने साथी का शोषण न करे[a], बल्कि अपने परमेश्वर का भय माने; क्योंकि मैं याहवे, तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके साथ अन्याय न करे” अथवा “उसका अनुचित लाभ न उठाए।” इब्रानी क्रिया सामाजिक या आर्थिक व्यवहार में किसी के साथ अनुचित आचरण करने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹנוּ
  choice: शोषण न करे
  rationale: हिफ़ील रूप यहाँ सामाजिक-आर्थिक व्यवहार में किसी का अनुचित लाभ उठाने या उसके साथ अन्याय करने का भाव रखता है। ‘शोषण’ इसकी गंभीरता और व्यापक नैतिक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: मूल शब्द व्याकरण की दृष्टि से पुल्लिंग एकवचन है और यहाँ प्रत्येक व्यक्ति के लिए वितरणात्मक रूप से प्रयुक्त हुआ है; इसलिए उसके प्रतिनिधिक पुल्लिंग रूप को बनाए रखा गया है।
- source_word: עֲמִיתוֹ
  choice: अपने संगी का
  rationale: यह शब्द कानूनी प्रसंग में अपने समुदाय के साथी या सह-सदस्य को दर्शाता है। ‘संगी’ इस पारस्परिक और सामुदायिक संबंध को संक्षिप्त रूप से रखता है।
- source_word: וְיָרֵאתָ
  choice: बल्कि तुम ... भय मानना
  rationale: वाव का मूल अर्थ ‘और’ है, पर यहाँ निषेध के विपरीत अपेक्षित आचरण सामने आता है। ‘बल्कि’ यह संबंध स्पष्ट करता है; ‘भय मानना’ आधुनिक हिन्दी में ईश्वर के प्रति श्रद्धामय भय की आज्ञा को व्यक्त करता है।
- source_word: מֵאֱלֹהֶיךָ
  choice: अपने परमेश्वर का
  rationale: ירא के साथ מן भय के विषय को चिह्नित करता है; हिन्दी में इसका स्वाभाविक रूप ‘परमेश्वर का भय मानना’ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: כִּי אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: क्योंकि मैं याहवे, तुम्हारा परमेश्वर हूँ
  rationale: ‘क्योंकि’ כִּי के कारणसूचक बल को बनाए रखता है, और वाचा-सूत्र आज्ञा को इस्राएल के परमेश्वर की पहचान और अधिकार पर आधारित करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: אִישׁ में प्रतिनिधिक पुल्लिंग
  choice: कोई पुरुष
  alternative: कोई व्यक्ति; कोई जन
  rationale: मूल पाठ के व्याकरणिक पुल्लिंग एकवचन को बनाए रखा गया है, जबकि वितरणात्मक वाक्य-विन्यास दिखाता है कि आज्ञा समुदाय के हर सदस्य पर लागू है।
- issue: ईश्वर का ‘भय’
  choice: अपने परमेश्वर का भय मानना
  alternative: अपने परमेश्वर से डरना; अपने परमेश्वर का आदर करना
  rationale: ‘भय मानना’ ירא की वास्तविक भय-संबंधी भाषा और उसके श्रद्धामय धार्मिक आयाम दोनों को सुरक्षित रखता है; केवल ‘आदर’ कहना अर्थ को अनावश्यक रूप से हल्का कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘संगी’ कानूनी-सामुदायिक संबंध को व्यक्त करता है, जबकि ‘शोषण’ जुबली-विधान के आर्थिक संदर्भ से मेल खाता है। एकवचन संबोधन और अंत में समुदाय-संबंधी ‘तुम्हारा परमेश्वर’ के तनाव को हिन्दी में यथासंभव स्वाभाविक रखते हुए सुरक्षित रखा गया है।
