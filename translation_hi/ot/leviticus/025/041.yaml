base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/041.yaml
  text: Then he and his sons with him shall go out from you[b][a], and he shall return to his clan and return to the property of his fathers.
translation:
  language: hi
  text: तब वह और उसके बेटे जो उसके साथ हैं, तेरे यहाँ से निकल जाएँगे। वह अपने कुल[a] में लौटेगा और अपने पुरखाओं की भूमि-संपत्ति[b] में लौट जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने विस्तृत परिवार में”; इब्रानी शब्द निकट परिवार से बड़े नातेदारी-समूह या कुल को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने पुरखाओं की मिल्कियत” अथवा “अपनी पैतृक संपत्ति”; इब्रानी शब्द विशेष रूप से वंशानुगत भूमि-धारण या संपत्ति का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא מֵעִמָּךְ
  choice: तेरे यहाँ से निकल जाएँगे
  rationale: शाब्दिक भाव ‘तेरे साथ से निकलना’ है। कानूनी प्रसंग में यह स्वामी की सेवा और घराने से प्रस्थान दर्शाता है; ‘मुक्त किए जाएँगे’ की अपेक्षा मूल क्रिया का ठोस बिंब बनाए रखा गया है। संयुक्त कर्ता के कारण हिन्दी में बहुवचन क्रिया स्वाभाविक है।
- source_word: הוּא וּבָנָיו עִמּוֹ
  choice: वह और उसके साथ उसके बेटे
  rationale: मूल पाठ के पुरुषवाचक बहुवचन בָּנָיו को ‘बेटे’ से स्पष्ट रखा गया है और עִמּוֹ का ‘उसके साथ’ भी सुरक्षित है।
- source_word: וְשָׁב ... יָשׁוּב
  choice: लौट जाएगा ... वापस जाएगा
  rationale: मूल में שׁוב की पुनरावृत्ति बहाली पर बल देती है। हिन्दी में अर्थगत पुनरावृत्ति रखते हुए वाक्य को सहज बनाने के लिए ‘लौट’ और ‘वापस’ प्रयोग किए गए हैं।
- source_word: מִשְׁפַּחְתּוֹ
  choice: अपने कुल
  rationale: भूमि और नातेदारी के इस संदर्भ में מִשְׁפָּחָה निकट परिवार से व्यापक संबंध-समूह को सूचित कर सकता है; ‘कुल’ आधुनिक हिन्दी में इस सामाजिक इकाई को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: אֲחֻזַּת אֲבֹתָיו
  choice: अपने पुरखाओं की पैतृक संपत्ति
  rationale: אֲחֻזָּה स्थायी या वंशानुगत भू-संपत्ति है। ‘पैतृक संपत्ति’ इसका कानूनी-सामाजिक आशय स्पष्ट करती है, जबकि ‘पुरखाओं की’ मूल के अֲבֹתָיו को बनाए रखता है।
theological_decisions:
- issue: पुरुषवाचक नातेदारी की भाषा
  choice: उसके बेटे ... उसके पुरखाओं
  alternative: उसकी संतान ... उसके पूर्वजों
  rationale: मूल में בָּנָיו और אֲבֹתָיו स्पष्टतः पुरुषवाचक रूप हैं और पैतृक उत्तराधिकार के कानूनी प्रसंग से जुड़े हैं; इसलिए उन्हें लिंग-निरपेक्ष नहीं किया गया।
- issue: ऋण-दासता से निकलने का कानूनी आशय
  choice: तेरे यहाँ से निकल जाएँगे
  alternative: तेरी सेवा से मुक्त हो जाएँगे
  rationale: जयंती-वर्ष के प्रसंग में मुक्ति निहित है, पर मूल क्रिया ‘निकलना’ है। अनुवाद मूल अभिव्यक्ति को रखता है और उसके कानूनी आशय को संदर्भ पर छोड़ता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर द्वारा संबोधित एकवचन व्यक्ति को ध्यान में रखते हुए ‘तेरे’ रखा गया है। मूल की कानूनी ठोसता और बहाली के दोहरे कथन को बनाए रखते हुए अनावश्यक तकनीकी शब्दावली से बचा गया है।
