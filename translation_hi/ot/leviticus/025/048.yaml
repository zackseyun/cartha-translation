  text: אַחֲרֵ֣י נִמְכַּ֔ר גְּאֻלָּ֖ה תִּהְיֶה לּ֑/וֹ אֶחָ֥ד מֵ/אֶחָ֖י/ו יִגְאָלֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/048.yaml
  text: After he has been sold[a], he may be redeemed; one of his brothers may redeem him.
translation:
  language: hi
  text: उसके बिक जाने के बाद[क], उसे छुड़ाया जा सकता है; उसके भाइयों में से कोई एक उसे छुड़ा सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, व्यापक अर्थ में, “उसके संबंधियों में से कोई एक उसे छुड़ा सकता है।” इब्रानी में शाब्दिक रूप से “उसके भाइयों में से एक” है; इस कानूनी संदर्भ में यह छुड़ाने वाला पुरुष पारिवारिक सदस्य हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי נִמְכַּר
  choice: उसके बिक जाने के बाद भी
  rationale: אַחֲרֵי समयगत अर्थ देता है और נִמְכַּר निफ़अल रूप में ‘बेचा जाना/बिक जाना’ है। ‘भी’ संदर्भानुसार यह स्पष्ट करता है कि बिक्री हो चुकने पर भी छुड़ाने की व्यवस्था बनी रहती है।
- source_word: גְּאֻלָּה תִּהְיֶה לּוֹ
  choice: उसका छुड़ाया जाना सम्भव होगा
  rationale: शाब्दिक संरचना ‘उसके लिए छुड़ौती होगी’ कानूनी उपलब्धता या अधिकार व्यक्त करती है। हिन्दी में यह वाक्यांश स्वाभाविक ढंग से उस सम्भावना को बताता है, बिना इसे निश्चित घटना बनाए।
- source_word: אֶחָד מֵאֶחָיו
  choice: उसके भाइयों में से कोई एक
  rationale: इब्रानी में स्पष्ट रूप से ‘उसके भाइयों में से एक’ है। ‘कोई एक’ समूह में से पात्र व्यक्ति का वितरणात्मक भाव व्यक्त करता है।
- source_word: יִגְאָלֶנּוּ
  choice: उसे छुड़ा सकता है
  rationale: גאל निकट संबंधी द्वारा कानूनी रूप से छुड़ाने का मानक क्रियापद है। ‘छुड़ा सकता है’ इस प्रावधान की अनुमतिमूलक प्रकृति और व्यक्ति को वापस मुक्त कराने के अर्थ को सहज हिन्दी में रखता है।
theological_decisions:
- issue: אֶחָיו में संबंध की सीमा
  choice: उसके भाइयों
  alternative: उसके संबंधियों / उसके कुल के पुरुष संबंधियों
  rationale: मुख्य पाठ में मूल का स्पष्ट पुल्लिंग बहुवचन ‘भाइयों’ सुरक्षित रखा गया है। आसपास के पद क्रमशः अधिक दूर के पुरुष संबंधियों का उल्लेख करते हैं, इसलिए यहाँ अर्थ को सामान्य ‘संबंधियों’ तक विस्तृत नहीं किया गया।
- issue: छुड़ाए जाने की विधिक सामर्थ्य बनाम निश्चितता
  choice: छुड़ाया जाना सम्भव होगा; ... छुड़ा सकता है
  alternative: उसे अवश्य छुड़ाया जाएगा; ... उसे छुड़ाएगा
  rationale: यह पद छुड़ौती की उपलब्धता और पात्र संबंधी की सामर्थ्य बताता है; इसे अनिवार्य या निश्चित घटना के रूप में प्रस्तुत करना मूल की विधिक बारीकी को अधिक निश्चित कर देगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘छुड़ाना’ को तकनीकी ‘मोल देकर वापस लेना’ की अपेक्षा चुना गया है, क्योंकि यह גאל के कानूनी-मुक्तिकारी भाव को संक्षेप में रखता है। मुख्य पाठ में ‘भाइयों’ रखकर मूल की लिंग-विशिष्ट संबंध-संज्ञा सुरक्षित की गई है।
