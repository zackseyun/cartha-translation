source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֗ת שַׁבַּ֤ת שַׁבָּתוֹן֙ יִהְיֶ֣ה לָ/אָ֔רֶץ שַׁבָּ֖ת לַ/יהוָ֑ה שָֽׂדְ/ךָ֙ לֹ֣א תִזְרָ֔ע וְ/כַרְמְ/ךָ֖ לֹ֥א תִזְמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/004.yaml
  text: But in the seventh year there shall be a sabbath of complete rest for the land[a], a sabbath to Yahweh. You shall not sow your field, and you shall not prune your vineyard.
translation:
  language: hi
  text: परन्तु सातवें वर्ष भूमि के लिए पूर्ण विश्राम का सब्त[a] होगा—याहवे के लिए एक सब्त। तुम अपने खेत में बीज न बोना और अपनी दाख की बारी की छँटाई न करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गम्भीर विश्राम का सब्त।’ इब्रानी अभिव्यक्ति काम से पूरी तरह विरत रहने के भाव पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: परन्तु सातवें वर्ष
  rationale: वाव पिछले पद में छह वर्षों तक खेती करने की अनुमति के विपरीत सातवें वर्ष का निर्देश प्रस्तुत करता है; इसलिए आधुनिक हिन्दी में ‘परन्तु’ प्रसंगगत विरोध को स्पष्ट करता है।
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: पूर्ण विश्राम का सब्त
  rationale: दोनों सम्बद्ध शब्द विश्राम अथवा काम से पूर्ण विराम की धारणा को प्रबल करते हैं। यह अनुवाद ‘सब्त’ की संकल्पना और इब्रानी की तीव्रता दोनों बनाए रखता है।
- source_word: יִהְיֶה לָאָרֶץ
  choice: भूमि के लिए ... होगा
  rationale: इब्रानी में विश्राम भूमि के लिए होने की बात है; हिन्दी में यह रचना स्वाभाविक रहते हुए भूमि को इस विश्राम का प्राप्तकर्ता बनाए रखती है।
- source_word: שַׁבָּת לַיהוָה
  choice: याहवे के लिए एक सब्त
  rationale: ל समर्पण अथवा अभिमुखता व्यक्त करता है; ‘के लिए’ इस विश्राम को याहवे को समर्पित बताता है, बिना सम्बन्ध को ‘का’ कहकर पुनर्परिभाषित किए।
- source_word: שָׂדְךָ לֹא תִזְרָע
  choice: तुम अपने खेत में बीज न बोना
  rationale: द्वितीय पुरुष एकवचन की विधिक आज्ञा को सहज हिन्दी निषेधात्मक निर्देश में रखा गया है; זרע का कृषि-सन्दर्भ में अर्थ बीज बोना है।
- source_word: וְכַרְמְךָ לֹא תִזְמֹר
  choice: और अपनी दाख की बारी की छँटाई न करना
  rationale: כרם दाख की बारी है और זמר यहाँ बेलों की छँटाई को सूचित करता है। दोहराया निषेध इब्रानी की समानान्तर आज्ञाओं को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यन्तरण है और ‘प्रभु’ जैसी उपाधि से नाम को प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सब्त’ बाइबलीय संकल्पना को बनाए रखता है, जबकि ‘पूर्ण विश्राम’ उसका आशय स्पष्ट करता है। कृषि-शब्दावली के लिए स्वाभाविक हिन्दी ‘बीज बोना’ और ‘छँटाई करना’ प्रयुक्त हुई है।
