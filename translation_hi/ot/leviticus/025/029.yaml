source:
  edition: WLC
  text: וְ/אִ֗ישׁ כִּֽי יִמְכֹּ֤ר בֵּית מוֹשַׁב֙ עִ֣יר חוֹמָ֔ה וְ/הָיְתָה֙ גְּאֻלָּת֔/וֹ עַד תֹּ֖ם שְׁנַ֣ת מִמְכָּר֑/וֹ יָמִ֖ים תִּהְיֶ֥ה גְאֻלָּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/029.yaml
  text: If a man sells a house for dwelling in a walled city[a], its redemption may be made until the completion of a full year from its sale; its right of redemption shall last for days, that is, a full year.
translation:
  language: hi
  text: यदि कोई पुरुष परकोटे वाले नगर में रहने के लिए बना हुआ घर बेच दे, तो उसके बिकने की तारीख से पूरा एक वर्ष समाप्त होने तक उसे छुड़ाने का अधिकार होगा; यह अधिकार दिनों[a] तक, अर्थात् पूरे एक वर्ष तक, रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘दिनों’; इस विधिक मुहावरे का अर्थ पूरे एक वर्ष की अवधि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ כִּי
  choice: यदि कोई पुरुष
  rationale: यह विधिक शर्त को आरम्भ करता है। ‘पुरुष’ मूल के एकवचन पुल्लिंग प्रतिनिधि रूप को बनाए रखता है, जबकि ‘कोई’ हिन्दी में शर्त को स्वाभाविक बनाता है।
- source_word: בֵּית מוֹשַׁב
  choice: रहने का घर
  rationale: यह निवास के लिए प्रयुक्त घर को सूचित करता है और मूल रचनात्मक भेद को स्पष्ट, सहज हिन्दी में रखता है।
- source_word: עִיר חוֹמָה
  choice: शहरपनाह वाला नगर
  rationale: यह ऐसे नगर को दर्शाता है जो दीवार से घिरा हो; ‘शहरपनाह’ विधिक-बाइबलीय प्रसंग में समझ में आने वाला, सटीक शब्द है।
- source_word: וְהָיְתָה גְּאֻלָּתוֹ
  choice: वह ... उसे छुड़ा सकता है
  rationale: इस प्रसंग में גְּאֻלָּה बिक्री के बाद संपत्ति को मूल्य देकर वापस लेने की वैधानिक संभावना या अधिकार है। हिन्दी में सक्रिय वाक्य अधिक स्वाभाविक है।
- source_word: עַד תֹּם שְׁנַת מִמְכָּרוֹ
  choice: उसके बेचे जाने से पूरा एक वर्ष समाप्त होने तक
  rationale: अर्थ बिक्री की तारीख से एक पूर्ण वर्ष है, न कि बिक्री वाले कैलेंडर वर्ष का अंत।
- source_word: יָמִים
  choice: दिनों भर, अर्थात् पूरे एक वर्ष तक
  rationale: शाब्दिक ‘दिनों’ को सुरक्षित रखते हुए प्रसंगगत इब्रानी मुहावरे का आशय स्पष्ट किया गया है।
- source_word: תִּהְיֶה גְאֻלָּתוֹ
  choice: उसे छुड़ाने का अधिकार ... रहेगा
  rationale: अंतिम खंड छुड़ाने के वैधानिक अधिकार की अवधि बताता है; ‘अधिकार रहेगा’ हिन्दी में विधिक अर्थ को स्पष्ट करता है।
