translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक शैली रखी गई है। ‘छुड़ाना’ भूमि-संपत्ति को मूल्य देकर वापस लेने के अर्थ में प्रयुक्त है। मूल के ‘दिनों’ मुहावरे को पाठ में बनाए रखकर तत्क्षण स्पष्ट किया गया है और पादटिप्पणी में उसका शाब्दिक आधार दिया गया है।
