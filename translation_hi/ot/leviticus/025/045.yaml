source:
  edition: WLC
  text: וְ֠/גַם מִ/בְּנֵ֨י הַ/תּוֹשָׁבִ֜ים הַ/גָּרִ֤ים עִמָּ/כֶם֙ מֵ/הֶ֣ם תִּקְנ֔וּ וּ/מִ/מִּשְׁפַּחְתָּ/ם֙ אֲשֶׁ֣ר עִמָּ/כֶ֔ם אֲשֶׁ֥ר הוֹלִ֖ידוּ בְּ/אַרְצְ/כֶ֑ם וְ/הָי֥וּ לָ/כֶ֖ם לַֽ/אֲחֻזָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/045.yaml
  text: You may also buy from the sons of the sojourners who reside with you[a], and from their families who are with you, whom they have fathered in your land[b]; and they shall become your possession.
translation:
  language: hi
  text: तुम अपने बीच रहनेवाले परदेशी निवासियों के पुत्रों में से भी, और उनके उन परिवारों के लोगों में से भी मोल ले सकते हो जो तुम्हारे बीच हैं और जिन्हें उन्होंने तुम्हारे देश में जन्म दिया है[a]। वे तुम्हारी संपत्ति हो जाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे बीच रहनेवाले निवासी परदेशियों के वंशजों में से भी।”
    reason: בְּנֵי का अर्थ प्रसंग के अनुसार ‘पुत्र’ या ‘वंशज’ हो सकता है; संयुक्त निवासी-परदेशी पदबंध का यह एक स्वाभाविक वैकल्पिक अनुवाद है।
  - marker: b
    text: इब्रानी, “संपत्ति के रूप में” या “अधिकार में रखी वस्तु के रूप में”; इस विधिक प्रसंग में यह ऐसी संपत्ति को सूचित करता है जिसे उत्तराधिकार में दिया जा सकता था।
    reason: אֲחֻזָּה के औपचारिक विधिक अर्थ और इस प्रसंग में उसकी उत्तराधिकार-योग्य प्रकृति को स्पष्ट किया गया है।
lexical_decisions:
- source_word: וְגַם ... מֵהֶם תִּקְנוּ
  choice: उनमें से भी लोगों को मोल ले सकते हो
  rationale: विधिक संदर्भ में קנה का वाणिज्यिक अर्थ ‘मोल लेना’ स्पष्ट है; ‘सकते हो’ प्रसंग में अनुमति का भाव व्यक्त करता है। ‘लोगों को’ हिन्दी में कर्म को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: מִבְּנֵי הַתּוֹשָׁבִים הַגָּרִים עִמָּכֶם
  choice: अपने बीच रहनेवाले परदेशियों के वंशजों में से
  rationale: בני यहाँ केवल पुरुष संतानों तक सीमित न होकर वंशजों को सूचित करता है। תושב और גר का संयुक्त प्रयोग गैर-इस्राएली निवासी परदेशियों को दर्शाता है; ‘अपने बीच रहनेवाले’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וּמִמִּשְׁפַּחְתָּם אֲשֶׁר עִמָּכֶם
  choice: और उनके उन कुलों में से भी, जो तुम्हारे बीच रहते हैं
  rationale: מִשְׁפָּחָה परिवार या कुल हो सकता है; व्यापक वंश-समूह के इस विधिक संदर्भ में ‘कुल’ उपयुक्त है।
- source_word: אֲשֶׁר הוֹלִידוּ בְּאַרְצְכֶם
  choice: जिनसे तुम्हारे देश में संतान उत्पन्न हुई है
  rationale: הוליד का हिफ़ील रूप संतान उत्पन्न करने/जन्म देने का भाव रखता है। हिन्दी में ‘जिनसे ... संतान उत्पन्न हुई’ वंशगत अर्थ को बनाए रखते हुए अनावश्यक रूप से केवल पिता पर बल नहीं देता।
- source_word: וְהָיוּ לָכֶם לַאֲחֻזָּה
  choice: वे तुम्हारी संपत्ति हो जाएँगे
  rationale: אֲחֻזָּה विधिक अधिकार में रखी जानेवाली संपत्ति या मिल्कियत है। ‘संपत्ति’ यहाँ मनुष्यों की कठोर कानूनी स्थिति को बिना नरम किए स्पष्ट करता है।
theological_decisions:
- issue: दासता और स्वामित्व की विधिक भाषा
  choice: ‘मोल ले सकते हो’ और ‘तुम्हारी संपत्ति’ जैसी सीधी भाषा
  alternative: ‘प्राप्त कर सकते हो’, ‘सेवक’, या केवल ‘अधिकार में रहेंगे’
  rationale: इब्रानी पाठ खरीद और संपत्ति के रूप में स्वामित्व की वास्तविक विधिक स्थिति बताता है। अनुवाद इस नैतिक तनाव को व्यंजना से नरम नहीं करता और न ही पाठ से बाहर कोई धार्मिक निष्कर्ष जोड़ता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और स्पष्ट हिन्दी। बहुवचन संबोधन के लिए सामान्य बाइबलीय ‘तुम’ शैली रखी गई है। दासता की कठोर विधिक भाषा को न तो शिष्टोक्ति से नरम किया गया है, न उससे आगे व्याख्यात्मक निर्णय जोड़ा गया है।
