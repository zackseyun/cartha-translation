id: LEV.25.36
reference: Leviticus 25:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תִּקַּ֤ח מֵֽ/אִתּ/וֹ֙ נֶ֣שֶׁךְ וְ/תַרְבִּ֔ית וְ/יָרֵ֖אתָ מֵֽ/אֱלֹהֶ֑י/ךָ וְ/חֵ֥י אָחִ֖י/ךָ עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/036.yaml
  text: Do not take interest or profit from him[a], but fear your God[b], and let your brother live with you.
translation:
  language: hi
  text: तू उससे ब्याज या बढ़ोतरी मत लेना[a], बल्कि अपने परमेश्वर का भय मान; और तेरा भाई तेरे साथ जीवित रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बढ़ोतरी’ के लिए ‘वृद्धि’ या ‘लाभ’ भी संभव है; इब्रानी में दो निकटार्थी शब्द साथ रखे गए हैं, जो अभावग्रस्त ऋणी से लिए जाने वाले ब्याज या अतिरिक्त लाभ को दर्शाते हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘तेरा भाई’ वाचा-समुदाय के साथी सदस्य को सूचित करता है, केवल सगे भाई को नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּקַּח
  choice: न लेना
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है। ‘न लेना’ हिंदी में सीधे आदेश का स्वाभाविक और संक्षिप्त रूप है।
- source_word: מֵאִתּוֹ
  choice: उससे
  rationale: यह उस अभावग्रस्त सहसमुदायी को स्रोत के रूप में दिखाता है जिससे अनुचित आर्थिक लाभ लिया जा सकता था।
- source_word: נֶשֶׁךְ
  choice: ब्याज
  rationale: यह ऋण पर लिए जाने वाले ब्याज का सामान्य शब्द है। ‘सूद’ संभव है, पर आधुनिक हिंदी में प्रायः अत्यधिक या शोषणकारी ब्याज का अतिरिक्त भाव देता है।
- source_word: וְתַרְבִּית
  choice: बढ़ोतरी
  rationale: यह נֶשֶׁךְ के समानांतर ऋण के मूल पर ली गई अतिरिक्त राशि या वृद्धि को दर्शाता है। ‘बढ़ोतरी’ मूल अर्थ को खुला रखती है; ‘लाभ’ भी संभव है।
- source_word: וְיָרֵאתָ מֵאֱלֹהֶיךָ
  choice: बल्कि अपने परमेश्वर का भय मानना
  rationale: 'वाव यहाँ नैतिक विरोध को व्यक्त करता है: सहसमुदायी का आर्थिक शोषण करने के बजाय परमेश्वर का भय मानना है। ‘अपने परमेश्वर’ इब्रानी के संबंधपरक बल को सुरक्षित रखता है।'
- source_word: וְחֵי
  choice: और ... जीवित रहे
  rationale: यह रूप संदर्भ में आदेशात्मक/परिणामसूचक बल रख सकता है। सीधा ‘और ... जीवित रहे’ संयोजक की अस्पष्टता बनाए रखता है और अनावश्यक रूप से केवल उद्देश्यसूचक अर्थ तय नहीं करता।
- source_word: אָחִיךָ
  choice: तेरा भाई
  rationale: शाब्दिक पारिवारिक शब्द को रखा गया है; इस व्यवस्था में इसका आशय वाचा-समुदाय के साथी सदस्य से है, केवल सगे भाई से नहीं।
- source_word: עִמָּךְ
  choice: तेरे साथ
  rationale: यह संबोधित व्यक्ति के साथ समुदाय में बने रहने और जीवनयापन करने का सीधा भाव देता है।
theological_decisions:
- issue: वाचा-संबंधी व्यवस्था में אָחִיךָ का अर्थ
  choice: तेरा भाई
  alternative: तेरा साथी इस्राएली / तेरा बंधु
  rationale: ‘भाई’ इब्रानी के पारिवारिक और सामुदायिक दोनों बलों को सुरक्षित रखता है। विस्तृत सामुदायिक आशय पादटिप्पणी में स्पष्ट किया गया है।
- issue: וְחֵי का वाक्यगत बल
  choice: और तेरा भाई तेरे साथ जीवित रहे
  alternative: ताकि तेरा भाई तेरे साथ जीवित रहे / अपने भाई को अपने साथ जीवित रहने देना
  rationale: इब्रानी वाव और क्रियारूप आदेश, परिणाम अथवा उद्देश्य की निकटवर्ती छायाएँ रख सकते हैं। मुख्य पाठ में समन्वयी रूप रखने से उस तनाव को अनावश्यक रूप से हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सीधी विधिक शैली अपनाई गई है। एकवचन संबोधन के कारण ‘तेरा/तेरे’ रखा गया है। ‘परमेश्वर का भय मानना’ बाइबिलीय नैतिक-धार्मिक मुहावरे के रूप में सुरक्षित है।
