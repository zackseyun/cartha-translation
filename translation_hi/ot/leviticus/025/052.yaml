  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध विधिक हिन्दी। ‘छुटकारे की रकम’ आर्थिक अर्थ को स्पष्ट करती है, जबकि मूल पद की मुक्त किए जाने संबंधी धारणा बनाए रखती है।
