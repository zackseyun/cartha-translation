  text: But if few years remain until the Year of Jubilee, then he shall calculate with him; according to his years he shall repay his redemption.
translation:
  language: hi
  text: और यदि जुबली के वर्ष तक थोड़े ही वर्ष शेष हों, तो वह उसके साथ हिसाब करे; अपने शेष वर्षों के अनुपात में वह अपने छुटकारे की रकम चुकाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְעַט נִשְׁאַר בַּשָּׁנִים
  choice: थोड़े ही वर्ष शेष हों
  rationale: इब्रानी में वर्षों की कम बची हुई संख्या बताई गई है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: שְׁנַת הַיּוֹבֵל
  choice: जुबली का वर्ष
  rationale: यह लैव्यव्यवस्था 25 की विधिक-संस्था का प्रचलित हिन्दी नाम है।
- source_word: וְחִשַּׁב לוֹ
  choice: वह उसके साथ हिसाब लगाए
  rationale: विधिक-आर्थिक संदर्भ में חִשַּׁב का अर्थ रकम की गणना करना है, और לוֹ दोनों पक्षों के बीच होने वाले हिसाब को व्यक्त करता है।
- source_word: כְּפִי שָׁנָיו
  choice: अपने शेष वर्षों के अनुपात में
  rationale: כְּפִי अनुपात को व्यक्त करता है। संदर्भ से ये जुबली तक शेष वर्ष हैं; ‘शेष’ जोड़ने से हिन्दी में आशय स्पष्ट होता है।
- source_word: יָשִׁיב אֶת גְּאֻלָּתוֹ
  choice: वह अपने छुटकारे की रकम लौटाए
  rationale: यहाँ גְּאֻלָּה अमूर्त छुटकारे के बजाय रिहाई के लिए देय आर्थिक राशि को सूचित करता है, और יָשִׁיב उसे चुकाने या लौटाने का भाव देता है।
