  yaml_path: translation/ot/leviticus/025/020.yaml
  text: And if you say, ‘What will we eat in the seventh year, since we will not sow or gather our produce?’
translation:
  language: hi
  text: और यदि तुम कहो, ‘हम सातवें वर्ष क्या खाएँगे, क्योंकि हम न तो बोएँगे और न अपनी उपज इकट्ठी करेंगे?’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּבוּאָתֵנוּ
  choice: अपनी उपज
  rationale: यह शब्द भूमि की पैदावार या उपज को दर्शाता है; यहाँ स्वाभाविक और प्रसंगानुकूल हिंदी में ‘अपनी उपज’ उपयुक्त है।
- source_word: הֵן
  choice: क्योंकि
  rationale: मूल में यह ध्यान दिलाने वाला अव्यय है, पर इस प्रश्न में कारणसूचक आशय रखता है; आधुनिक हिंदी में ‘क्योंकि’ कथन का तर्क स्वाभाविक रूप से व्यक्त करता है।
- source_word: נֶאֱסֹף
  choice: इकट्ठी करेंगे
  rationale: मूल निष्क्रिय रूप का शाब्दिक अर्थ ‘इकट्ठा किया जाएगा’ हो सकता है, किंतु प्रथम पुरुष बहुवचन के प्रसंगगत आशय को हिंदी में सक्रिय वाक्य अधिक स्पष्टता से व्यक्त करता है।
