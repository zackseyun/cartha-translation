  text: וּֽ/שְׂדֵ֛ה מִגְרַ֥שׁ עָרֵי/הֶ֖ם לֹ֣א יִמָּכֵ֑ר כִּֽי אֲחֻזַּ֥ת עוֹלָ֛ם ה֖וּא לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/034.yaml
  text: But the field of pastureland belonging to their cities must not be sold[b][a], for it is their permanent possession.
translation:
  language: hi
  text: परन्तु उनके नगरों की चरागाह-भूमि बेची न जाए,[a] क्योंकि वह उनकी स्थायी संपत्ति है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘चरागाह-भूमि’ के लिए ‘सामुदायिक भूमि’ या ‘खुली भूमि’ भी सम्भव है; इब्रानी शब्द लेवीय नगरों के चारों ओर की भूमि को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सदा की संपत्ति।’ यहाँ इब्रानी शब्द भूमि के स्थायी और अहस्तांतरणीय स्वामित्व को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/שְׂדֵה
  choice: परन्तु ... खेत
  rationale: שָׂדֶה का सामान्य अर्थ ‘खेत’ है। आरम्भिक וּ को पिछले पद में लेवीय घरों के विषय में दी गई अनुमति के साथ विरोध दिखाने के लिए ‘परन्तु’ किया गया है।
- source_word: מִגְרַשׁ
  choice: चरागाह
  rationale: मִגְרָשׁ नगर के चारों ओर की खुली भूमि को दर्शाता है, जिसका उपयोग विशेषकर पशु चराने के लिए होता था; ‘चरागाह’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עָרֵי/הֶם
  choice: उनके नगरों की
  rationale: यह सम्बन्धवाचक रचना नगरों और उनसे जुड़ी चरागाह की भूमि के बीच अधिकार-संबंध को संक्षेप और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: לֹא יִמָּכֵר
  choice: बेचा न जाए
  rationale: מכר का निफ़अल अपूर्ण रूप निष्क्रिय अर्थ ‘बेचा जाए’ देता है; निषेध के साथ यह कानूनी मनाही को सहज हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: כִּי यहाँ इस मनाही का कारण प्रस्तुत करता है।
- source_word: אֲחֻזַּת עוֹלָם
  choice: स्थायी अधिकार
  rationale: אֲחֻזָּה भूमि पर प्राप्त अधिकार या पैतृक संपत्ति है, और עוֹלָם यहाँ उसके स्थायी, अहस्तांतरणीय स्वरूप पर बल देता है। ‘स्थायी अधिकार’ कानूनी आशय को स्वाभाविक हिन्दी में रखता है।
- source_word: הוּא לָ/הֶם
  choice: वह उनका ... है
  rationale: सर्वनाम और संबंधसूचक पद भूमि को उनका अधिकार बताते हैं; हिन्दी में यह रचना स्वाभाविक है।
theological_decisions:
- issue: इस्राएल की भूमि-व्यवस्था में עוֹלָם का बल
  choice: स्थायी
  alternative: सदा का / चिरस्थायी
  rationale: इस कानूनी संदर्भ में עוֹלָם भूमि के निरन्तर और अहस्तांतरणीय अधिकार को दर्शाता है; ‘स्थायी’ अनावश्यक रूप से दार्शनिक अनन्तता का दावा किए बिना इस बल को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘चरागाह का खेत’ इब्रानी की दोहरी संज्ञा-रचना को बनाए रखता है, जबकि पदक्रम हिन्दी के अनुरूप है।
