base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/044.yaml
  text: As for your male servant and your female servant who may belong to you[a], from the nations that are around you[b], from them you may buy a male servant and a female servant.
translation:
  language: hi
  text: तुम्हारे जो दास और दासियाँ[a] होंगे, उन्हें तुम अपने चारों ओर के राष्ट्रों[b] में से खरीद सकते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दास’ और ‘दासी’ के लिए इब्रानी में अलग-अलग पुरुषवाचक और स्त्रीवाचक शब्द हैं। इनका अनुवाद ‘सेवक’ और ‘सेविका’ भी हो सकता है, पर यहाँ खरीदने और स्वामित्व का संदर्भ होने के कारण ‘दास’ और ‘दासी’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: '‘राष्ट्रों’ से आशय इस्राएल के चारों ओर रहने वाले गैर-इस्राएली जनसमूहों से है; वैकल्पिक अनुवाद: ‘तुम्हारे आसपास के लोगों में से।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ / עֶבֶד
  choice: तुम्हारे दास / दास
  rationale: עֶבֶד का अर्थ सेवक से लेकर दास तक हो सकता है, पर यहाँ व्यक्ति को मोल लेने और उसके स्वामित्व की कानूनी स्थिति स्पष्ट है; इसलिए ‘दास’ संदर्भ के अधिक अनुरूप है।
- source_word: אֲמָתְךָ / אָמָה
  choice: तुम्हारी दासी / दासी
  rationale: यह स्त्रीलिंग पद पुरुषवाचक עֶבֶד के साथ जोड़ा गया है। ‘दासी’ आधुनिक हिन्दी में स्वाभाविक है और मूल का लिंग-भेद बनाए रखता है।
- source_word: אֲשֶׁר יִהְיוּ לָךְ
  choice: जो तुम्हारे हों
  rationale: यह वाक्यांश कानूनी अधिकार या स्वामित्व को व्यक्त करता है। यह अनुवाद भविष्यकाल को अनावश्यक रूप से कठोर किए बिना मूल की संबंधात्मक अस्पष्टता बनाए रखता है।
- source_word: מֵאֵת הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: अपने चारों ओर की जातियों में से
  rationale: גּוֹיִם यहाँ इस्राएल के आसपास के गैर-इस्राएली समुदायों को सूचित करता है। ‘जातियाँ’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और ‘अन्यजाति’ जैसे अधिक धर्मशास्त्रीय रंग से बचता है।
- source_word: מֵהֶם
  choice: उनमें से
  rationale: यह आसपास की जातियों को खरीद के स्रोत के रूप में पुनः इंगित करता है; हिन्दी वाक्य-रचना में इसे ‘जातियों में से’ के भीतर स्वाभाविक रूप से समाहित किया गया है।
- source_word: תִּקְנוּ
  choice: मोल ले सकते हो
  rationale: קנה का अर्थ खरीदना या प्राप्त करना है। इस कानूनी संदर्भ में क्रिया आज्ञा नहीं, अनुमति व्यक्त करती है; ‘मोल ले सकते हो’ उस अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: दासता-संबंधी शब्दावली का अनुवाद
  choice: עֶבֶד और אָמָה के लिए ‘दास’ और ‘दासी’
  alternative: ‘सेवक’ और ‘सेविका’
  rationale: पद में मनुष्यों को मोल लेने और उनके किसी के ‘होने’ की बात है; इसलिए केवल सेवा नहीं, बल्कि बंधित और स्वामित्वाधीन स्थिति अर्थ का केंद्रीय भाग है। ‘सेवक’ उस कठोर कानूनी वास्तविकता को हल्का कर सकता है।
- issue: תִּקְנוּ का विधिक बल
  choice: अनुमतिपरक ‘मोल ले सकते हो’
  alternative: आज्ञार्थक ‘मोल लो’ या भविष्यसूचक ‘मोल लोगे’
  rationale: आसपास की व्यवस्था इस्राएलियों को खरीदने की आज्ञा नहीं देती, बल्कि यह बताती है कि वे किन लोगों में से दास-दासी प्राप्त कर सकते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘जहाँ तक…का प्रश्न है’ आरम्भिक विषय-सूचक संरचना को स्वाभाविक हिन्दी में व्यक्त करता है। ‘मोल लेना’ कानूनी खरीद को सीधे बताता है, जबकि ‘ले सकते हो’ अनुमति का भाव बनाए रखता है।
