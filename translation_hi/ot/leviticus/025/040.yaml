  edition: WLC
  text: כְּ/שָׂכִ֥יר כְּ/תוֹשָׁ֖ב יִהְיֶ֣ה עִמָּ֑/ךְ עַד שְׁנַ֥ת הַ/יֹּבֵ֖ל יַעֲבֹ֥ד עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/040.yaml
  text: He shall be with you like a hired worker[a], like a sojourner; he shall serve with you until the year of jubilee.
translation:
  language: hi
  text: वह तेरे यहाँ मज़दूरी पर काम करने वाले और परदेशी निवासी के समान रहे; वह जुबली के वर्ष तक तेरे यहाँ काम करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּשָׂכִיר
  choice: मज़दूर के समान
  rationale: שָׂכִיר मजदूरी पर काम करने वाले व्यक्ति को दर्शाता है। ‘मज़दूर’ आधुनिक हिंदी में स्पष्ट है और प्रसंग में दास से भिन्न उसकी स्थिति बनाए रखता है।
- source_word: כְּתוֹשָׁב
  choice: परदेशी निवासी के समान
  rationale: תּוֹשָׁב ऐसे गैर-स्थानीय व्यक्ति को दर्शाता है जो समुदाय के बीच रह रहा हो। ‘परदेशी निवासी’ अस्थायी प्रवास और निवासी की सामाजिक-कानूनी स्थिति दोनों को व्यक्त करता है।
- source_word: יִהְיֶה עִמָּךְ
  choice: वह तेरे यहाँ ... रहे
  rationale: शाब्दिक अर्थ ‘वह तेरे साथ हो’ है; हिंदी में स्थिति और निवास-संबंध व्यक्त करने के लिए ‘तेरे यहाँ रहे’ अधिक स्वाभाविक है, जबकि तुलना दोनों כְּ उपसर्गों से बनी रहती है।
- source_word: עַד שְׁנַת הַיֹּבֵל
  choice: जुबली के वर्ष तक
  rationale: यह लैव्यव्यवस्था 25 में मुक्ति के नियत वर्ष का तकनीकी नाम है। ‘जुबली’ प्रचलित बाइबलीय पद को सुरक्षित रखता है।
- source_word: יַעֲבֹד עִמָּךְ
  choice: वह ... तेरे यहाँ सेवा करे
  rationale: עבד का अर्थ ‘सेवा करना’ या ‘काम करना’ हो सकता है। ‘सेवा करे’ मूल क्रिया की व्यापकता रखता है, और ‘तेरे यहाँ’ עִמָּךְ को स्वाभाविक हिंदी में व्यक्त करते हुए अनुचित दासत्व-संकेत से बचता है।
theological_decisions:
- issue: ऋण के कारण सेवा करने वाले इस्राएली की स्थिति
  choice: उसे मज़दूर और परदेशी निवासी के समान प्रस्तुत किया गया है, दास के रूप में नहीं।
  alternative: ‘भाड़े के दास के समान’ या ऐसा शब्दांकन जो दास-मालिक संबंध को प्रमुख करे।
  rationale: निकटवर्ती प्रसंग (पद 39-43) उसे दास की श्रेणी से अलग करता है और उसकी सेवा को सीमित तथा संरक्षित रखता है। अनुवाद इसी अंतर को बनाए रखता है, बिना पाठ से आगे कोई धार्मिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। संबोधन के लिए एकवचन ‘तेरे’ रखा गया है, जो मूल के एकवचन प्रत्यय को दर्शाता है। ‘परदेशी निवासी’ सामाजिक-कानूनी श्रेणी को स्पष्ट करता है; ‘जुबली’ अध्याय का तकनीकी बाइबलीय शब्द है।
