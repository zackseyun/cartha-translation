base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/049.yaml
  text: or his uncle[a], or his uncle’s son, may redeem him; or one of his close blood relatives from his clan may redeem him; or if his hand prospers[b], he may redeem himself.
translation:
  language: hi
  text: या उसका चाचा, या उसके चाचा का बेटा[a], उसे छुड़ा सकता है; या उसके कुल में से कोई निकट रक्त-संबंधी उसे छुड़ा सकता है; या यदि उसके हाथ में सामर्थ्य आ जाए[b], तो वह स्वयं को छुड़ा सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके चाचा का बेटा”; अर्थात उसका चचेरा भाई।
    reason: lexical_alternative
  - marker: b
    text: अर्थात यदि उसके पास अपने छुटकारे का मूल्य चुकाने के लिए पर्याप्त साधन हो जाएँ। शाब्दिक रूप से, “यदि उसके हाथ में सामर्थ्य आ जाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹדוֹ
  choice: उसका चाचा
  rationale: इस संबंधी-मोचन की कानूनी व्यवस्था में דּוֹד का अर्थ ‘चाचा’ है, न कि ‘प्रिय व्यक्ति’। हिंदी में यह पैतृक निकट पुरुष-संबंधी को सहज रूप से व्यक्त करता है।
- source_word: בֶן דֹּדוֹ
  choice: उसके चाचा का बेटा
  rationale: यह इब्रानी अभिव्यक्ति का सीधा रूप है; आधुनिक संबंध-शब्द ‘चचेरा भाई’ फुटनोट में दिया गया है।
- source_word: יִגְאָלֶנּוּ
  choice: उसे छुड़ा सकता है
  rationale: גאל यहाँ संबंधी द्वारा मूल्य देकर दासत्व से छुड़ाने का कानूनी अर्थ रखता है। ‘छुड़ा’ अध्याय की मोचन-विषयक शब्दावली को बनाए रखता है, और ‘सकता है’ इस प्रसंग की अनुमतिपरक शक्ति व्यक्त करता है।
- source_word: מִשְּׁאֵר בְּשָׂרוֹ
  choice: कोई निकट रक्त-संबंधी
  rationale: शाब्दिक ‘उसके मांस का निकट जन’ रक्त-संबंधी निकट कुटुंबी के लिए मुहावरा है; चुना हुआ रूप अर्थ को स्वाभाविक और स्पष्ट रखता है।
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: उसके कुल का
  rationale: מִשְׁפָּחָה इस सामाजिक-कानूनी संदर्भ में केवल छोटे परिवार के बजाय व्यापक वंशीय समूह को दर्शाता है; ‘कुल’ हिंदी में उपयुक्त है।
- source_word: הִשִּׂיגָה יָדוֹ
  choice: यदि उसका हाथ समर्थ हो जाए
  rationale: यह रूप मूल के ‘हाथ’ वाले ठोस मुहावरे को बचाता है और हिंदी में इस आशय को समझने योग्य रखता है कि उसके पास पर्याप्त साधन आ गए हैं।
- source_word: וְנִגְאָל
  choice: तो वह स्वयं को छुड़ा सकता है
  rationale: रूप व्याकरणतः निष्प्रेरक/कर्मवाच्य है, पर संदर्भ में अपने साधनों से अपना मोचन कराने का अर्थ है; हिंदी में ‘स्वयं को छुड़ा सकता है’ इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: संबंधी-मोचन की शब्दावली
  choice: גאל के लिए ‘छुड़ाना’ रखा गया है।
  alternative: वापस मोल लेना
  rationale: ‘छुड़ाना’ कानूनी मूल्य-भुगतान और दासत्व से मुक्ति—दोनों भावों को वहन करता है तथा पाठ को केवल व्यापारिक लेन-देन तक सीमित नहीं करता।
- issue: הִשִּׂיגָה יָדוֹ के मुहावरे का अनुवाद
  choice: ‘यदि उसका हाथ समर्थ हो जाए’ द्वारा हाथ की मूल छवि बनाए रखी गई है।
  alternative: यदि उसके पास पर्याप्त साधन हो जाएँ
  rationale: मुख्य पाठ मूल की ठोस और अर्थपूर्ण छवि को सुरक्षित रखता है; फुटनोट उसका आर्थिक आशय स्पष्ट करता है।
- issue: וְנִגְאָל का कर्तृवाचक आशय
  choice: संदर्भानुसार ‘वह स्वयं को छुड़ा सकता है’।
  alternative: वह छुड़ाया जाए
  rationale: इब्रानी रूप की कर्मवाच्य अस्पष्टता स्वीकार करते हुए भी पूर्ववर्ती वाक्यांश उसके स्वयं साधन-संपन्न होने की बात करता है; इसलिए हिंदी में संदर्भगत आत्म-मोचन का आशय आवश्यक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी प्रसंग के अनुकूल रखी गई है। ‘कुल’, ‘निकट रक्त-संबंधी’ और ‘छुड़ा सकता है’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि मूल की संबंधी-मोचन शब्दावली और ‘हाथ’ वाला मुहावरा भी सुरक्षित है।
