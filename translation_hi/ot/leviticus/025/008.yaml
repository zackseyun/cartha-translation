base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/008.yaml
  text: You shall count for yourself seven sabbaths of years[a], seven years seven times, and the days of the seven sabbaths of years shall be for you forty-nine years.
translation:
  language: hi
  text: तुम अपने लिए वर्षों के सात विश्रामकाल[a] गिनना—सात वर्ष, सात बार; और वर्षों के इन सात विश्रामकालों की कुल अवधि तुम्हारे लिए उनचास वर्ष होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वर्षों के सात सप्ताह।’ इब्रानी में शाब्दिक रूप से ‘वर्षों के सात विश्रामकाल’ है; इसका आशय सात-सात वर्षों के सात चक्रों से है।
    reason: lexical_alternative
