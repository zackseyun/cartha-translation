  choice: तुम ... गिनना
  rationale: क्रिया ספר यहाँ निश्चित समय-खंडों की गणना करने के अर्थ में है। ‘गिनना’ आधुनिक हिन्दी में स्वाभाविक है और विधिक निर्देश का भाव रखता है।
- source_word: לְךָ
  choice: अपने लिए
  rationale: इब्रानी में स्पष्ट द्वितीय-पुरुष दत्तिवाचक सर्वनाम है। ‘अपने लिए’ गणना करने वाले व्यक्ति की जिम्मेदारी को व्यक्त करता है।
- source_word: שֶׁבַע שַׁבְּתֹת שָׁנִים
  choice: वर्षों के सात विश्रामकाल
  rationale: שַׁבְּתֹת का मूल विश्राम/सब्त का बिंब बनाए रखते हुए यह पदबंध सात-सात वर्षों के चक्रों की ओर संकेत करता है। ‘विश्रामकाल’ प्रसंग में साप्ताहिक दिनों के साथ भ्रम घटाता है, जबकि स्रोत की उपमा को मिटाता नहीं।
- source_word: שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים
  choice: सात वर्ष सात बार
  rationale: स्रोत का क्रम और पुनरुक्त गणनात्मक बल निकटता से सुरक्षित रखा गया है।
- source_word: יְמֵי
  choice: दिन
  rationale: शाब्दिक ‘दिन’ को बनाए रखा गया है; यहाँ यह गिने गए कालों की पूरी अवधि बताता है।
- source_word: תֵּשַׁע וְאַרְבָּעִים שָׁנָה
  choice: उनचास वर्ष
  rationale: इब्रानी संख्या-क्रम का स्वाभाविक आधुनिक हिन्दी समतुल्य है।
