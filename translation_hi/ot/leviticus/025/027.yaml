translation:
  language: hi
  text: तब वह उस भूमि की बिक्री के बाद बीते वर्षों का हिसाब लगाए और बची हुई रकम[a] उस व्यक्ति को लौटा दे, जिसे उसने वह भूमि बेची थी; फिर वह अपनी भू-संपत्ति[b] में लौट आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शेष रकम” अथवा “अतिरिक्त रकम।” इब्रानी शब्द उस रकम को दर्शाता है जो बिक्री की अवधि का हिसाब करने पर शेष ठहरती है।
    reason: lexical_alternative
  - marker: b
    text: यह उस भूमि-सम्पत्ति को दर्शाता है जो इस्राएल में किसी व्यक्ति या उसके कुल के अधिकार में थी; इस व्यवस्था में उसका पारिवारिक या वंशानुगत संबंध भी था।
    reason: cultural_note
lexical_decisions:
- source_word: וְחִשַּׁב
  choice: तब वह ... हिसाब लगाए
  rationale: क्रिया חשׁב यहाँ छुड़ाने की रकम निर्धारित करने के लिए गणना करने को दर्शाती है। ‘हिसाब लगाए’ सहज आधुनिक हिन्दी है, और ‘तब’ प्रसंग की क्रमिक प्रक्रिया व्यक्त करता है।
- source_word: שְׁנֵי מִמְכָּרוֹ
  choice: उस भूमि की बिक्री के बाद बीते वर्षों
  rationale: शाब्दिक रूप ‘उसकी बिक्री के वर्ष’ है। भूमि छुड़ाने के प्रसंग में आशय बिक्री के बाद बीत चुके वर्षों की संख्या से है; ‘उस भूमि’ कहने से हिन्दी में संदर्भ स्पष्ट रहता है।
- source_word: וְהֵשִׁיב
  choice: लौटा दे
  rationale: हिफ़ील रूप यहाँ किसी रकम को वापस करने या चुकाने का अर्थ देता है। ‘लौटा दे’ अगले וְשָׁב के ‘लौट जाए’ से शब्दगत संबंध भी बनाए रखता है।
- source_word: הָעֹדֵף
  choice: बची हुई रकम
  rationale: עודף से बना यह रूप गणना के बाद शेष रहने वाले अंश या अतिरिक्त रकम को दर्शाता है। वित्तीय प्रसंग में ‘बची हुई रकम’ सामान्य पाठक के लिए ‘अधिशेष’ से अधिक स्पष्ट है।
- source_word: לָאִישׁ אֲשֶׁר מָכַר לוֹ
  choice: उस व्यक्ति को ... जिसे उसने वह भूमि बेची थी
  rationale: इब्रानी में व्यक्तिगत अभिव्यक्ति ‘उस मनुष्य को, जिसे उसने बेचा’ है। हिन्दी में कर्म ‘वह भूमि’ स्पष्ट करने से वाक्य स्वाभाविक और असंदिग्ध बनता है।
- source_word: וְשָׁב
  choice: फिर वह ... लौट जाए
  rationale: שוב का क़ाल रूप मूल विक्रेता के भूमि पर वापस आने को बताता है। ‘लौट जाए’ कानूनी निर्देश और क्रियाओं का क्रम स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַאֲחֻזָּתוֹ
  choice: अपनी पैतृक भूमि
  rationale: लैव्यव्यवस्था 25 में אֲחֻזָּה सामान्य संपत्ति मात्र नहीं, बल्कि इस्राएल में किसी व्यक्ति या कुल को प्राप्त स्थायी भू-अधिकार को सूचित करती है। ‘पैतृक भूमि’ इस कानूनी-सांस्कृतिक आशय को संक्षेप में व्यक्त करती है।
theological_decisions:
- issue: जुबली-विधान में אֲחֻזָּה का स्वरूप
  choice: पैतृक भूमि
  alternative: अपनी संपत्ति / अपनी भू-संपत्ति
  rationale: यह पद इस्राएल की वाचा-संबंधी भूमि-व्यवस्था में प्राप्त पारिवारिक भू-अधिकार की ओर संकेत करता है। ‘पैतृक भूमि’ उस विशेष अर्थ को सामने रखती है, बिना किसी अतिरिक्त सम्प्रदायगत व्याख्या के।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। कानूनी प्रक्रिया को सहज हिन्दी में क्रमबद्ध किया गया है। ‘भूमि’ को जहाँ इब्रानी में निहित है वहाँ स्पष्ट किया गया है, और तकनीकी ‘अधिशेष’ के स्थान पर सामान्य पाठक के लिए ‘बची हुई रकम’ चुना गया है।
