base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/046.yaml
  text: You may pass them on as an inheritance to your sons after you[a], to inherit as a possession permanently; from them you may exact labor. But over your brothers, the sons of Israel[b], no man shall rule over his brother harshly.
translation:
  language: hi
  text: तुम उन्हें अपने बाद अपने पुत्रों को विरासत में दे सकते हो[a], ताकि वे उन्हें सदा के लिए वंशानुगत संपत्ति के रूप में प्राप्त करें। तुम उनसे श्रम करा सकते हो। परन्तु तुम्हारे भाइयों, अर्थात् इस्राएल के पुत्रों, के विषय में—कोई व्यक्ति अपने भाई पर कठोरता से शासन न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम उन्हें अपने बाद अपने पुत्रों को वंशानुगत संपत्ति के रूप में दे सकते हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְנַחֲלְתֶּם
  choice: विरासत के रूप में सौंप सकते हो
  rationale: हिथपएल रूप यहाँ किसी को उत्तराधिकार में हस्तांतरित करने का कानूनी भाव देता है; यह हिंदी प्रयोग उस वंशानुगत हस्तांतरण को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִבְנֵיכֶם אַחֲרֵיכֶם
  choice: अपने बाद अपने पुत्रों को
  rationale: בנים का प्रत्यक्ष अर्थ ‘पुत्र’ है; स्रोत के पुरुषवाची उत्तराधिकार-संबंधी विधान को बनाए रखा गया है।
- source_word: לָרֶשֶׁת אֲחֻזָּה
  choice: पैतृक संपत्ति के रूप में उनके अधिकारी हों
  rationale: ירש और אֲחֻזָּה दोनों के उत्तराधिकार तथा स्थायी संपत्ति के पहलू को सुबोध हिंदी में व्यक्त करता है।
- source_word: לְעֹלָם
  choice: स्थायी
  rationale: कानूनी संदर्भ में यह दीर्घस्थायी अथवा निरंतर संपत्ति-दर्जा बताता है; ‘स्थायी’ अनावश्यक रूप से metaphysical अनंतता नहीं जोड़ता।
- source_word: בָּהֶם תַּעֲבֹדוּ
  choice: तुम उनसे काम करा सकते हो
  rationale: संदर्भ में עבד अधीन व्यक्तियों से श्रम कराने को दर्शाता है। यह अनुवाद बाध्यकारी सामाजिक वास्तविकता को छिपाए बिना सहज हिंदी रखता है।
- source_word: וּבְאַחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: लेकिन अपने भाइयों, अर्थात इस्राएल के पुत्रों
  rationale: पिछले खंड से विरोध और ‘भाइयों’ तथा ‘इस्राएल के पुत्रों’ की समानाधिकरण संरचना दोनों सुरक्षित हैं।
- source_word: אִישׁ בְּאָחִיו
  choice: कोई भी अपने भाई पर
  rationale: वितरणात्मक विधान को स्वाभाविक निषेधात्मक हिंदी में व्यक्त करता है।
- source_word: לֹא תִרְדֶּה בוֹ
  choice: शासन न करे
  rationale: רדה का मूल भाव अधिकार अथवा प्रभुत्व चलाना है; कठोरता का विशेष अर्थ अगले पदबंध से आता है।
- source_word: בְּפָרֶךְ
  choice: कठोरता से
  rationale: यह बाध्य श्रम के प्रसंग में निर्दय कठोरता दर्शाता है; ‘कठोरता से’ सीधा और गरिमापूर्ण है।
theological_decisions:
- issue: इस्राएली सामाजिक विधान में नातेदारी की भाषा
  choice: ‘भाइयों’ और ‘इस्राएल के पुत्रों’ को बनाए रखना
  alternative: ‘संगी इस्राएलियों’ अथवा ‘स्वदेशियों’ से सामान्यीकृत करना
  rationale: इब्रानी पाठ वाचा-समुदाय को स्पष्ट पुरुषवाची पारिवारिक शब्दों में प्रस्तुत करता है; उनका संरक्षण कानूनी और नातेदारी-संबंधी तनाव को बनाए रखता है।
- issue: दासता और संपत्ति-संबंधी भाषा की प्रत्यक्षता
  choice: विरासत, पैतृक संपत्ति और काम कराने की भाषा स्पष्ट रखना
  alternative: इसे केवल सेवा या रोजगार की नरम भाषा में प्रस्तुत करना
  rationale: पाठ मनुष्यों के वंशानुगत संपत्ति-दर्जे और उनसे श्रम कराने की बात करता है; इसे नरम करना मूल विधान की सामाजिक और नैतिक गंभीरता को घटा देगा।
translation_notes:
  register: आधुनिक मानक हिंदी, कानूनी विधान के अनुरूप गरिमापूर्ण और स्पष्ट शैली। ‘पैतृक संपत्ति’ वंशानुगत अधिकार को सहजता से व्यक्त करती है; दासता की वास्तविकता को नरम नहीं किया गया है।
