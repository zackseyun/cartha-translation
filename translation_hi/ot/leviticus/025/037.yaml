base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/037.yaml
  text: You shall not lend him your money at interest[b][a], nor give him your food for increase.
translation:
  language: hi
  text: तुम उसे अपना पैसा[a] ब्याज पर उधार न देना, और अपना भोजन बढ़ोतरी के लिए न देना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी चाँदी।” इब्रानी शब्द का अर्थ “चाँदी” और “पैसा” दोनों हो सकता है; यहाँ ऋण के संदर्भ में “पैसा” अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बढ़ोतरी के लिए।” इसका आशय दिए गए भोजन के बदले अतिरिक्त मात्रा या लाभ लेने से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפְּךָ (כֶּסֶף)
  choice: अपना पैसा
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ है, पर आर्थिक और ऋण-संबंधी संदर्भ में यह सामान्यतः ‘पैसा’ दर्शाता है। आधुनिक हिन्दी में ‘पैसा’ यहाँ अर्थ को स्वाभाविक और स्पष्ट रखता है।
- source_word: תִתֵּן לוֹ
  choice: उसे ... देना
  rationale: क्रिया נתן का सामान्य अर्थ ‘देना’ है। ब्याज का उल्लेख इसे ऋण देने के संदर्भ में रखता है; फिर भी एक ही क्रिया पैसे और भोजन दोनों के साथ प्रयुक्त हुई है, इसलिए हिन्दी में ‘देना’ रखकर मूल की समानांतर रचना बचाई गई है।
- source_word: בְּנֶשֶׁךְ
  choice: ब्याज पर
  rationale: נֶשֶׁךְ ऋण पर लिए जाने वाले अतिरिक्त धन को दर्शाता है। ‘ब्याज पर’ आधुनिक हिन्दी में स्पष्ट है और ‘सूदखोरी’ जैसे शब्द से उत्पन्न केवल अत्यधिक या अन्यायपूर्ण ब्याज के संकुचित अर्थ से बचता है।
- source_word: וּבְמַרְבִּית
  choice: उससे अधिक वापस लेने के लिए
  rationale: מַרְבִּית का अर्थ बढ़ोतरी, वृद्धि या अतिरिक्त लाभ है। भोजन के संदर्भ में शाब्दिक ‘बढ़ोतरी पर’ अस्वाभाविक होता; यह वाक्यांश इस भाव को स्पष्ट करता है कि दिए गए भोजन से अधिक मात्रा वापस ली जाए, बिना इसे केवल व्यापारिक ‘मुनाफे’ तक सीमित किए।
- source_word: אָכְלֶךָ (אֹכֶל)
  choice: अपना भोजन
  rationale: אֹכֶל का सीधा अर्थ ‘भोजन’ है। ‘रसद’ या ‘खाद्य-सामग्री’ की अपेक्षा ‘भोजन’ अधिक सीधा और सामान्य पाठक के लिए सहज है।
- source_word: לֹא ... לֹא
  choice: न ... और न
  rationale: दोहराया गया निषेध दो समानांतर मनाहियों को जोड़ता है। ‘न ... और न’ हिन्दी में इस कानूनी बल और समानांतरता को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: क्या निषेध केवल अत्यधिक ब्याज या लाभ पर लागू है
  choice: ऐसे किसी सीमित अर्थ को पाठ में नहीं जोड़ा गया
  alternative: ‘सूदखोरी’ या ‘अनुचित लाभ’ कहना
  rationale: इब्रानी पद स्वयं निषेध को केवल अत्यधिक दर या अन्यायपूर्ण लाभ तक सीमित नहीं करता। इसलिए अनुवाद उस सीमा को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और विधिक निषेध का स्वर रखा गया है। ‘ब्याज’ और ‘अधिक वापस लेने’ के बीच मूल पाठ का समानांतर आर्थिक संबंध स्पष्ट है, जबकि מַרְבִּית की ‘बढ़ोतरी/अतिरिक्त लाभ’ संबंधी अर्थ-व्याप्ति पादटिप्पणी में सुरक्षित रखी गई है।
