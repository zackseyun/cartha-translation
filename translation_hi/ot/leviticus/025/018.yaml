source:
  edition: WLC
  text: וַ/עֲשִׂיתֶם֙ אֶת חֻקֹּתַ֔/י וְ/אֶת מִשְׁפָּטַ֥/י תִּשְׁמְר֖וּ וַ/עֲשִׂיתֶ֣ם אֹתָ֑/ם וִֽ/ישַׁבְתֶּ֥ם עַל הָ/אָ֖רֶץ לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/018.yaml
  text: So you shall carry out my statutes and keep my judgments[a], and do them[c][b], and you shall dwell in the land securely.
translation:
  language: hi
  text: इसलिए मेरी विधियों का पालन करो और मेरे न्याय-विधानों को मानो, और इन सबका पालन करो; तब तुम उस देश में सुरक्षित बसे रहोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקֹּתַי
  choice: मेरी विधियों
  rationale: यह निर्धारित विधियों या नियमों का बोध कराता है। ‘विधियाँ’ कानूनी-वाचा संबंधी भाव रखता है और अगले भिन्न कानूनी पद से अलग भी रहता है।
- source_word: מִשְׁפָּטַי
  choice: मेरे न्याय-विधानों
  rationale: यह न्यायिक निर्णयों, नियमों या विधानों को सूचित करता है। ‘न्याय-विधान’ उसके न्याय-संबंधी कानूनी भाव को बनाए रखते हुए חֻקֹּתַי से भेद प्रकट करता है।
- source_word: תִּשְׁמְרוּ
  choice: मानना
  rationale: वाचा और व्यवस्था के संदर्भ में שׁמר का अर्थ ध्यानपूर्वक मानना या पालन करना है; आधुनिक हिन्दी में ‘मानना’ सहज और स्पष्ट है।
- source_word: וַעֲשִׂיתֶם ... אֹתָם
  choice: पालन करना ... उन पर चलना
  rationale: इब्रानी में עשה दो बार आया है। हिन्दी में असहज शब्दशः पुनरावृत्ति के बजाय दो समानार्थी अभिव्यक्तियाँ वास्तविक आज्ञाकारिता के दोहरे बल को स्वाभाविक रूप से व्यक्त करती हैं।
- source_word: וִישַׁבְתֶּם
  choice: बसे रहोगे
  rationale: यह देश में स्थायी निवास को दर्शाता है; ‘बसे रहना’ आधुनिक हिन्दी में ‘निवास करना’ से अधिक सहज है और स्थिर बसावट का भाव देता है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: संदर्भ में यह इस्राएल को दिए जाने वाले विशिष्ट देश की ओर संकेत करता है। हिन्दी में ‘उस देश’ इस संदर्भगत निश्चितता को स्पष्ट करता है।
- source_word: לָבֶטַח
  choice: सुरक्षित
  rationale: यह सुरक्षा और निर्भयता की अवस्था बताता है; ‘सुरक्षित बसे रहोगे’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: आज्ञाकारिता और देश में सुरक्षित निवास का संबंध
  choice: ‘तब’ के द्वारा देश में सुरक्षित बसने को इस्राएल की वाचा-संबंधी आज्ञाकारिता से जुड़े परिणाम के रूप में व्यक्त किया गया है।
  alternative: इसे हर युग के प्रत्येक विश्वासी के लिए व्यक्तिगत सुरक्षा या समृद्धि का सामान्य और बिना शर्त वादा मानना।
  rationale: इब्रानी वाक्य आज्ञाओं के पालन और उसी देश में सुरक्षित निवास को क्रमिक रूप से जोड़ता है। अनुवाद इस वाचा और देश-संबंधी संदर्भ को बनाए रखता है, पर इसे पाठ की सीमा से बाहर सार्वभौमिक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दो इब्रानी कानूनी पदों का भेद ‘विधियाँ’ और ‘न्याय-विधान’ से सुरक्षित रखा गया है। मूल में ‘करना’ की पुनरावृत्ति को हिन्दी में ‘पालन करना ... उन पर चलना’ द्वारा अर्थपूर्ण और स्वाभाविक बल दिया गया है।
