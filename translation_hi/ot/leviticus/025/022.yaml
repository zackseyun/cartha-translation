source:
  edition: WLC
  text: וּ/זְרַעְתֶּ֗ם אֵ֚ת הַ/שָּׁנָ֣ה הַ/שְּׁמִינִ֔ת וַ/אֲכַלְתֶּ֖ם מִן הַ/תְּבוּאָ֣ה יָשָׁ֑ן עַ֣ד הַ/שָּׁנָ֣ה הַ/תְּשִׁיעִ֗ת עַד בּוֹא֙ תְּב֣וּאָתָ֔/הּ תֹּאכְל֖וּ יָשָֽׁן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/022.yaml
  text: And you shall sow in the eighth year and eat from the old produce until the ninth year; until its produce comes in[a], you shall eat the old.
translation:
  language: hi
  text: तुम आठवें वर्ष में बोओगे और नौवें वर्ष तक पुरानी उपज में से खाते रहोगे। नौवें वर्ष की उपज आने तक तुम पुरानी उपज खाते रहोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּזְרַעְתֶּם
  choice: तुम ... बोओगे
  rationale: वैधानिक और भावी संदर्भ में यह रूप उस कार्य को बताता है जो इस्राएली आठवें वर्ष में करेंगे; सामान्य आधुनिक हिन्दी में भविष्यकाल स्वाभाविक है।
- source_word: הַשָּׁנָה הַשְּׁמִינִת
  choice: आठवें वर्ष में
  rationale: क्रमवाचक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וַאֲכַלְתֶּם
  choice: खाते रहोगे
  rationale: यह आगे तक जारी रहने वाली क्रिया है; 'रहोगे' नौवें वर्ष और नई उपज आने तक की अवधि स्पष्ट करता है।
- source_word: מִן הַתְּבוּאָה יָשָׁן
  choice: पुरानी उपज में से
  rationale: תְּבוּאָה कृषि-उपज को दर्शाता है और יָשָׁן पिछली फसल से बची पुरानी उपज को; हिन्दी में संज्ञा को स्पष्ट रखना अधिक स्वाभाविक है।
- source_word: עַד הַשָּׁנָה הַתְּשִׁיעִת
  choice: नौवें वर्ष तक
  rationale: समय-सीमा का सीधा अनुवाद।
- source_word: עַד בּוֹא תְּבוּאָתָהּ
  choice: जब तक उस वर्ष की उपज नहीं आ जाती
  rationale: स्त्रीलिंग प्रत्यय का निकटतम संदर्भ नौवाँ वर्ष है। नकारात्मक 'जब तक ... नहीं' हिन्दी में हिब्रू की समय-सीमा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תֹּאכְלוּ יָשָׁן
  choice: तुम पुरानी उपज ही खाओगे
  rationale: हिब्रू में संज्ञा प्रसंग से समझी जाती है, पर हिन्दी में 'उपज' दोहराने से अर्थ स्पष्ट और सहज रहता है; 'ही' पुरानी उपज खाते रहने की निरंतरता पर बल देता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और निर्देशात्मक-भावी रजिस्टर। हिब्रू की पुनरुक्ति को दोनों बार 'पुरानी उपज' कहकर अर्थपूर्ण ढंग से बनाए रखा गया है।
