id: LEV.25.47
reference: Leviticus 25:47
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כִ֣י תַשִּׂ֗יג יַ֣ד גֵּ֤ר וְ/תוֹשָׁב֙ עִמָּ֔/ךְ וּ/מָ֥ךְ אָחִ֖י/ךָ עִמּ֑/וֹ וְ/נִמְכַּ֗ר לְ/גֵ֤ר תּוֹשָׁב֙ עִמָּ֔/ךְ א֥וֹ לְ/עֵ֖קֶר מִשְׁפַּ֥חַת גֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/047.yaml
  text: If the means of a resident foreigner among you become sufficient[a], and your brother beside him becomes poor and sells himself to the resident foreigner among you, or to a member of the foreigner’s clan,
translation:
  language: hi
  text: यदि तुम्हारे बीच रहने वाला कोई परदेशी आर्थिक रूप से समर्थ हो जाए, और उसके पास तुम्हारा भाई निर्धन हो जाए और अपने आपको तुम्हारे बीच रहने वाले उस परदेशी के हाथ या किसी परदेशी के कुल के किसी सदस्य के हाथ बेच दे[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी परदेशी के परिवार की किसी शाखा के हाथ।” इब्रानी पदबंध का ठीक अर्थ कठिन है।
    reason: עֵקֶר מִשְׁפַּחַת גֵּר के कठिन और संभावित रूप से अधिक शाब्दिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: תַשִּׂיג יַד
  choice: आर्थिक रूप से समर्थ हो जाए
  rationale: ‘हाथ पहुँचने’ का यह इब्रानी मुहावरा पर्याप्त आर्थिक साधन प्राप्त होने को दर्शाता है। चुना हुआ अनुवाद आधुनिक हिन्दी में इस आर्थिक अर्थ को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: גֵּר וְתוֹשָׁב
  choice: तुम्हारे बीच रहनेवाला ... परदेशी
  rationale: दोनों शब्द मिलकर इस्राएली समाज के बीच बसे गैर-इस्राएली व्यक्ति को सूचित करते हैं। हिन्दी में ‘रहनेवाला परदेशी’ उसके निवास और बाहरी सामाजिक पहचान, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּמָךְ
  choice: निर्धन हो जाए
  rationale: क्रिया आर्थिक दशा के बिगड़कर गरीबी में पहुँचने को बताती है; ‘निर्धन हो जाए’ इस परिवर्तन को स्पष्ट रखता है।
- source_word: אָחִיךָ
  choice: तुम्हारा भाई
  rationale: मूल का पारिवारिक और वाचा-समुदाय संबंधी संबोधन सुरक्षित रखा गया है; प्रसंग में इसका आशय साथी इस्राएली से है।
- source_word: עִמּוֹ
  choice: उसके पास रहनेवाला
  rationale: यह पद निर्धन भाई को समृद्ध परदेशी के साथ या उसके निकट की परिस्थिति में रखता है। ‘उसके पास रहनेवाला’ मूल संबंध को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: וְנִמְכַּר
  choice: अपने आपको ... बेच दे
  rationale: निफ़अल रूप व्याकरणतः ‘बेचा जाए’ हो सकता है, पर ऋणजनित दास-सेवा के इस कानूनी प्रसंग में आत्म-विक्रय का भाव स्वाभाविक है। हिन्दी में यह वाक्यांश उसी अर्थ को स्पष्ट करता है।
- source_word: לְגֵר תּוֹשָׁב עִמָּךְ
  choice: तुम्हारे बीच रहनेवाले उस परदेशी के हाथ
  rationale: यह पहले उल्लिखित सामाजिक श्रेणी को दोहराता है। ‘के हाथ’ हिन्दी में किसी के हाथ बिकने का स्वाभाविक मुहावरा है।
- source_word: לְעֵקֶר מִשְׁפַּחַת גֵּר
  choice: किसी परदेशी के कुल के किसी सदस्य के हाथ
  rationale: עֵקֶר यहाँ कठिन शब्द है और परिवार की जड़, शाखा, वंश या किसी सदस्य का संकेत दे सकता है। मुख्य पाठ में प्रसंगानुकूल और सहज ‘किसी सदस्य’ रखा गया है, जबकि अधिक शाब्दिक संभावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: इस्राएली संबंध के लिए אָחִיךָ का अनुवाद
  choice: तुम्हारा भाई
  alternative: तुम्हारा साथी इस्राएली / तुम्हारा संबंधी
  rationale: ‘भाई’ मूल पाठ की पारिवारिक और नैतिक शक्ति को बनाए रखता है तथा सामाजिक कानून को केवल नागरिक श्रेणी में नहीं बदलता।
- issue: וְנִמְכַּר में विक्रय की प्रकृति
  choice: अपने आपको ... बेच दे
  alternative: बेच दिया जाए
  rationale: व्याकरणिक निष्क्रियता संभव है, किंतु लैव्यव्यवस्था 25 का ऋण-दासता संबंधी प्रसंग आत्म-विक्रय का समर्थन करता है। यह चयन किसी अतिरिक्त धार्मिक सिद्धांत को जोड़े बिना कानूनी परिस्थिति स्पष्ट करता है।
- issue: גֵּר וְתוֹשָׁב को एक संयुक्त सामाजिक वर्णन मानना
  choice: रहनेवाला परदेशी
  alternative: परदेशी और निवासी
  rationale: संदर्भ में दोनों पद एक बसे हुए गैर-इस्राएली की स्थिति का संयुक्त वर्णन कर सकते हैं। हिन्दी में संयुक्त रूप स्वाभाविक है, फिर भी व्यक्ति की परदेशी पहचान और स्थानीय निवास दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी प्रसंग के अनुरूप रखी गई है। ‘आर्थिक रूप से समर्थ’, ‘निर्धन’ और ‘के हाथ बेच दे’ सामान्य पाठक के लिए स्पष्ट हैं। वाक्य अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
