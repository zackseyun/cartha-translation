source:
  edition: WLC
  text: אֵ֣ת סְפִ֤יחַ קְצִֽירְ/ךָ֙ לֹ֣א תִקְצ֔וֹר וְ/אֶת עִנְּבֵ֥י נְזִירֶ֖/ךָ לֹ֣א תִבְצֹ֑ר שְׁנַ֥ת שַׁבָּת֖וֹן יִהְיֶ֥ה לָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/005.yaml
  text: You shall not reap the aftergrowth of your harvest[a], and you shall not gather the grapes of your unpruned vine[c][b]; it shall be a year of complete rest for the land.
translation:
  language: hi
  text: तू अपनी फसल की अपने-आप उगी उपज[a] को न काटना, और अपनी बिना छाँटी हुई दाखलता के अंगूर[b] न तोड़ना; यह भूमि के लिए पूर्ण विश्राम का वर्ष[c] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात बिना बोए अपने-आप उगी उपज; या “स्वतः उगी फसल।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, “अपनी अलग छोड़ी हुई दाखलता के अंगूर”; आशय उस दाखलता से है जिसे इस विश्राम-वर्ष में छाँटा या सँवारा नहीं गया।
    reason: lexical_alternative
  - marker: c
    text: या “भूमि के लिए सब्त का वर्ष” अथवा “गंभीर विश्राम का वर्ष।”
    reason: lexical_alternative
lexical_decisions:
- source_word: סְפִיחַ קְצִירְךָ
  choice: अपनी पिछली फसल से अपने-आप उगी उपज
  rationale: यह पद पिछली फसल के गिरे हुए बीज से बिना बोए अपने-आप उगने वाली उपज को दर्शाता है। यह हिन्दी में अर्थ को स्पष्ट रखता है और इसे जानबूझकर बोई गई फसल नहीं बताता।
- source_word: תִקְצֹר
  choice: काटना
  rationale: यह खेत की उपज काटने के लिए प्रयुक्त कृषि-संबंधी क्रिया है; सामान्य आधुनिक हिन्दी में 'काटना' स्वाभाविक है।
- source_word: עִנְּבֵי נְזִירֶךָ
  choice: अपनी बिना छाँटी हुई दाखलता के अंगूर
  rationale: कृषि-संदर्भ में נָזִיר ऐसी दाखलता को सूचित करता है जिसे विश्राम-वर्ष में सँवारा या छाँटा नहीं गया। 'बिना छाँटी हुई' व्यावहारिक आशय को स्पष्ट करता है, जबकि 'अलग की हुई' हिन्दी में अस्पष्ट होता।
- source_word: תִבְצֹר
  choice: न तोड़ना
  rationale: यह विशेषतः अंगूर बटोरने या तोड़ने की क्रिया है; 'तोड़ना' सहज और कृषि-संदर्भ के अनुकूल है।
- source_word: שְׁנַת שַׁבָּתוֹן
  choice: पूर्ण विश्राम का वर्ष
  rationale: שַׁבָּתוֹן साधारण रुकने से अधिक गहन या पूर्ण विश्राम का भाव व्यक्त करता है। यह अनुवाद उस बल को सुबोध हिन्दी में रखता है।
- source_word: לָאָרֶץ
  choice: भूमि के लिए
  rationale: लैव्यव्यवस्था 25 में आशय खेती की भूमि से है; इसलिए 'भूमि' यहाँ 'पृथ्वी' से अधिक सटीक है।
theological_decisions:
- issue: विश्राम-वर्ष की शब्दावली को बाद की सांप्रदायिक या अनुष्ठानिक धारणाएँ जोड़े बिना प्रस्तुत करना
  choice: भूमि के लिए पूर्ण विश्राम का वर्ष
  alternative: भूमि के लिए सब्त का वर्ष
  rationale: चुना गया रूप שַׁבָּתוֹן के प्रबल विश्राम-भाव को व्यक्त करता और भूमि को इस विधान का केंद्र बनाए रखता है। 'सब्त का वर्ष' संभव है, पर सामान्य पाठक के लिए गहन विश्राम का अर्थ कम स्पष्ट कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कृषि-संदर्भ के अनुकूल भाषा। एकवचन संबोधन के अनुरूप 'तू' रखा गया है। 'दाखलता' बाइबलीय हिन्दी में पहचाना जाने वाला और यहाँ सटीक कृषि-शब्द है।
