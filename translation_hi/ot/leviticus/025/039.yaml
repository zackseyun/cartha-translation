source:
  edition: WLC
  text: וְ/כִֽי יָמ֥וּךְ אָחִ֛י/ךָ עִמָּ֖/ךְ וְ/נִמְכַּר לָ֑/ךְ לֹא תַעֲבֹ֥ד בּ֖/וֹ עֲבֹ֥דַת עָֽבֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/025/039.yaml
  text: And if your brother becomes poor with you and sells himself to you[b][a], you shall not make him serve as a servant.
translation:
  language: hi
  text: और यदि तुम्हारा भाई तुम्हारे साथ रहते हुए गरीब हो जाए और अपने को तुम्हें बेच दे[b], तो उससे दास का काम न कराना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “उससे दास की सेवा न करवाना।”'
    reason: lexical_alternative
  - marker: b
    text: या, “और तुम्हें बेच दिया जाए”; हिब्रू रूप कर्मवाच्य भी समझा जा सकता है, यद्यपि इस प्रसंग में निर्धन व्यक्ति द्वारा अपने आपको ऋण-सेवा के लिए बेचने का भाव है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִי
  choice: और यदि
  rationale: संयोजक वाव और शर्तसूचक כי—दोनों को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: יָמוּךְ
  choice: गरीब हो जाए
  rationale: यह क्रिया आर्थिक दशा गिरने और निर्धन हो जाने को बताती है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: אָחִיךָ
  choice: तुम्हारा भाई
  rationale: मूल का पारिवारिक संबोधन सुरक्षित रखा गया है; प्रसंग में यह समुदाय के सह-सदस्य को सूचित कर सकता है, पर मुख्य पाठ में उसका अर्थ विस्तार से नहीं खोला गया।
- source_word: עִמָּךְ
  choice: तुम्हारे पास रहते हुए
  rationale: सम्बन्धवाचक स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है; केवल 'तुम्हारे साथ' की सम्भावित अस्पष्टता से बचता है।
- source_word: וְנִמְכַּר לָךְ
  choice: और अपने आपको तुम्हारे हाथ बेच दे
  rationale: निफ़अल रूप व्याकरणतः कर्मवाच्य हो सकता है, किन्तु इस निर्धनता-सम्बन्धी कानूनी प्रसंग में आत्म-विक्रय का भाव सम्भव है। मुख्य पाठ में प्रसंगानुकूल मुहावरेदार अर्थ है और कर्मवाच्य विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: לֹא תַעֲבֹד בּוֹ
  choice: तो उससे ... न करवाना
  rationale: निर्माण का आशय उस व्यक्ति से श्रम या सेवा कराने का निषेध है; हिन्दी में यह विधिक आज्ञा संक्षिप्त और सहज है।
- source_word: עֲבֹדַת עָבֶד
  choice: दास का काम
  rationale: शाब्दिक रूप से 'दास की सेवा/मजदूरी' है। 'दास का काम' सामाजिक स्थिति और श्रम की कठोरता को बिना नरम किए व्यक्त करता है।
theological_decisions:
- issue: ऋण-सेवा के प्रसंग में עבד सम्बन्धी सामाजिक दर्जे का अनुवाद
  choice: दास का काम
  alternative: सेवक का काम / दास के समान सेवा
  rationale: '''दास'' बंधुआ सामाजिक दर्जे की शक्ति को बनाए रखता है; ''सेवक'' यहाँ अनुचित रूप से नरम हो सकता है। फिर भी पद यह नहीं कहता कि निर्धन भाई कोई सेवा नहीं करेगा, बल्कि उससे दासोचित श्रम कराने को निषिद्ध करता है।'
- issue: וְנִמְכַּר की वाच्यगत अस्पष्टता
  choice: अपने आपको ... बेच दे
  alternative: तुम्हारे हाथ बेच दिया जाए
  rationale: प्रसंग आत्म-विक्रय की ओर संकेत करता है, पर हिब्रू का निफ़अल कर्मवाच्य रूप भी ग्रहण कर सकता है; इसलिए वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन अनौपचारिक/निकट संबोधन ‘तुम्हारा/तुम्हारे’ मूल के दूसरे पुरुष एकवचन को व्यक्त करता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
