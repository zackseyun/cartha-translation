  text: מַדּ֗וּעַ לֹֽא אֲכַלְתֶּ֤ם אֶת הַֽ/חַטָּאת֙ בִּ/מְק֣וֹם הַ/קֹּ֔דֶשׁ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִ֑וא וְ/אֹתָ֣/הּ נָתַ֣ן לָ/כֶ֗ם לָ/שֵׂאת֙ אֶת עֲוֺ֣ן הָ/עֵדָ֔ה לְ/כַפֵּ֥ר עֲלֵי/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/017.yaml
  text: Why did you not eat the sin offering in the holy place? For it is most holy[a], and he has given it to you to bear the iniquity of the congregation, to make atonement for them before Yahweh.
translation:
  language: hi
  text: “तुमने पवित्र स्थान में पापबलि[a] क्यों नहीं खाई? क्योंकि वह परमपवित्र है, और उसने उसे तुम्हें इसलिए दिया है कि तुम समुदाय का अधर्म उठाओ और यहोवा के सामने उनके लिए प्रायश्चित करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि।” इब्रानी शब्द חַטָּאת पाप से संबंधित बलि के साथ-साथ अशुद्धता दूर करने वाली बलि को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ לֹא אֲכַלְתֶּם
  choice: तुमने ... क्यों नहीं खाई?
  rationale: कारण पूछने वाले प्रत्यक्ष प्रश्न और बीते हुए कार्य के संदर्भ में मूसा की फटकार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: यहाँ शब्द निश्चित रूप से बलिदान को सूचित करता है। ‘पापबलि’ हिन्दी बाइबल-परंपरा में परिचित और संक्षिप्त है; शुद्धिकरण-संबंधी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בִּמְקוֹם הַקֹּדֶשׁ
  choice: पवित्र स्थान में
  rationale: याजकों द्वारा बलि का अंश खाने के लिए निर्धारित पवित्र क्षेत्र का सीधा और स्पष्ट अनुवाद।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र
  rationale: इब्रानी की अतिशयोक्तिपरक रचना का स्वाभाविक हिन्दी रूप; इससे भीतरी पवित्रस्थान का अनुचित संकेत नहीं मिलता।
- source_word: וְאֹתָהּ נָתַן לָכֶם
  choice: और उसने उसे तुम्हें ... दिया है
  rationale: इब्रानी क्रिया का कर्ता व्यक्त नहीं है, पर संदर्भ में परमेश्वर निहित है। पुल्लिंग एकवचन ‘उसने’ इस निहित कर्ता को बिना नाम जोड़कर बनाए रखता है।
- source_word: לָשֵׂאת אֶת־עֲוֹן הָעֵדָה
  choice: कि तुम समुदाय का अधर्म उठाओ
  rationale: נשא עון की प्रतिनिधिक तथा अनुष्ठानिक भाषा और עָוֹן की ‘अधर्म/दोष’ संबंधी अर्थ-व्याप्ति को निकटता से सुरक्षित रखता है।
- source_word: הָעֵדָה
  choice: समुदाय
  rationale: इस्राएल के सामूहिक निकाय के लिए सामान्य आधुनिक हिन्दी; ‘मण्डली’ की अपेक्षा व्यापक सामाजिक-सामुदायिक अर्थ स्पष्ट करता है।
- source_word: לְכַפֵּר עֲלֵיהֶם
  choice: उनके लिए प्रायश्चित करो
  rationale: बलिदान-संबंधी כפר के स्थापित अर्थ को संक्षिप्त और धर्मवैज्ञानिक रूप से अनिर्णायक ढंग से व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: दिव्य नाम को लिप्यंतरित करते हुए परमेश्वर की उपस्थिति में किए जाने वाले याजकीय कार्य का भाव रखता है।
theological_decisions:
- issue: חַטָּאת का बलिदान-संबंधी अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: संदर्भ में बलि-पशु का याजकीय भोजन निश्चित है। मुख्य पाठ में परिचित शब्द रखा गया है, जबकि अनुष्ठान की शुद्धिकरण भूमिका को पादटिप्पणी में दिया गया है।
- issue: נָתַן का अप्रकट कर्ता
  choice: ‘उसने’, संदर्भतः परमेश्वर
  alternative: ‘वह तुम्हें दी गई है’
  rationale: मूल में तृतीय पुरुष एकवचन सक्रिय क्रिया है। संदर्भ दिव्य व्यवस्था की ओर संकेत करता है, इसलिए सक्रिय रूप बनाए रखा गया है, पर ‘परमेश्वर’ स्पष्ट रूप से नहीं जोड़ा गया।
- issue: לָשֵׂאת אֶת־עֲוֹן का आशय
  choice: समुदाय का अधर्म उठाना
  alternative: समुदाय का दोष उठाना
  rationale: यह पद याजकीय प्रतिनिधित्व और प्रायश्चित के बीच तनाव रखता है। ‘अधर्म उठाना’ मूल रूपक को बनाए रखता है और इसे केवल दोष हटाने या दण्ड सहने के रूप में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी फटकार। ‘पापबलि’, ‘परमपवित्र’ और ‘प्रायश्चित’ जैसे स्थापित धार्मिक शब्द सामान्य पाठकों के लिए पर्याप्त रूप से परिचित हैं। सर्वनामों में लिंग-सामंजस्य ‘बलि’ के स्त्रीलिंग के अनुसार रखा गया है।
