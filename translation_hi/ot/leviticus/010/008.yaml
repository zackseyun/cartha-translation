lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर ... ने ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, इसलिए ‘फिर’ स्वाभाविक है। דּבר के साथ לֵאמֹר वाली इब्रानी वाणी-सूत्र शैली को हिन्दी में दोहराव से बचाते हुए सहज रूप से ‘कहा’ व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह परमेश्वर के व्यक्तिगत नाम YHWH का हिन्दी में प्रचलित लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया है।
- source_word: אֶל
  choice: से
  rationale: हिन्दी में ‘किसी से कहना’ बोलने के संबोधन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַהֲרֹן
  choice: हारून
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय रूप।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह आगामी वचन की विषयवस्तु प्रस्तुत करता है। हिन्दी में וַיְדַבֵּר ... לֵאמֹר के पूरे सूत्र का स्वाभाविक रूप ‘ने ... से कहा’ है; ‘यह कहते हुए’ अनावश्यक और असहज दोहराव होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ उसका पारंपरिक लिप्यंतरण है; पादटिप्पणी ‘याहवे’ विकल्प को स्पष्ट करती है और नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदलती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। इब्रानी वाणी-सूत्र का शब्दशः दोहराव करने के बजाय उसका पूरा अर्थ स्वाभाविक हिन्दी ‘ने ... से कहा’ में दिया गया है।
