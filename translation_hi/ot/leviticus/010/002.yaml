source:
  edition: WLC
  text: וַ/תֵּ֥צֵא אֵ֛שׁ מִ/לִּ/פְנֵ֥י יְהוָ֖ה וַ/תֹּ֣אכַל אוֹתָ֑/ם וַ/יָּמֻ֖תוּ לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/002.yaml
  text: And fire came out from before Yahweh and consumed them[a], and they died before Yahweh.
translation:
  language: hi
  text: और याहवे के सामने से[a] आग निकली और उसने उन्हें भस्म कर दिया, और वे याहवे के सामने मर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘याहवे के सामने से’; वैकल्पिक अनुवाद: ‘याहवे की उपस्थिति से।’'
    reason: मूल לִפְנֵי में स्थानवाचक ‘सामने’ और ‘उपस्थिति’ दोनों अर्थछटाएँ संभव हैं।
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: निकली
  rationale: יצא का क्रमसूचक रूप कथा को आगे बढ़ाते हुए एक साधारण भूतकालीन घटना बताता है। ‘निकली’ आग के याहवे के सामने से बाहर आने की दिशा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֵשׁ
  choice: आग
  rationale: यहाँ संज्ञा का सीधा अर्थ वास्तविक आग है, जो तत्काल न्याय का साधन बनती है।
- source_word: מִלִּפְנֵי יְהוָה
  choice: याहवे के सामने से
  rationale: शाब्दिक अर्थ ‘याहवे के मुख/उपस्थिति के सामने से’ है। यह चयन मूल इब्रानी स्थानवाचक भाव और पद के अंत में होने वाली पुनरावृत्ति को सुरक्षित रखता है।
- source_word: וַתֹּאכַל
  choice: भस्म कर दिया
  rationale: אכל का मूल अर्थ ‘खा जाना’ है, पर आग के कर्ता होने पर ‘भस्म कर दिया’ स्वाभाविक हिन्दी है और विनाशकारी क्रिया की पूरी शक्ति व्यक्त करता है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: यह कर्मवाचक सर्वनाम निकटवर्ती प्रसंग के नादाब और अबीहू की ओर संकेत करता है।
- source_word: וַיָּמֻתוּ
  choice: वे मर गए
  rationale: מות का यह सक्रिय अकर्मक रूप साधारण परिणाम बताता है। पिछले खंड में मृत्यु का कारण स्पष्ट होने के कारण ‘वे मारे गए’ जैसा कारणसूचक विस्तार नहीं जोड़ा गया।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: यह मुख्य स्थानवाचक-धर्मवैज्ञानिक वाक्यांश को दोहराता है। ‘याहवे के सामने’ मूल की गंभीर पुनरावृत्ति को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יְהוָה है। ‘याहवे’ उसका लिप्यंतरण करके नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: וַיָּמֻתוּ को सक्रिय अकर्मक परिणाम या निष्क्रिय कारणसूचक रूप में प्रस्तुत करना
  choice: वे मर गए
  alternative: वे मारे गए
  rationale: इब्रानी क्रिया सक्रिय और अकर्मक है; पहले खंड की आग मृत्यु का कारण पहले ही बता चुकी है। इसलिए स्रोत से आगे बढ़कर निष्क्रिय कारणसूचक अर्थ नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भस्म कर दिया’ आग के साथ स्वाभाविक हिन्दी प्रयोग है। दोनों स्थानों पर ‘याहवे के सामने’ की पुनरावृत्ति मूल की संरचना और गंभीरता को सुरक्षित रखती है।
