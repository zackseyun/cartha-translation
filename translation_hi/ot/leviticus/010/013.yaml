id: LEV.10.13
reference: Leviticus 10:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹתָ/הּ֙ בְּ/מָק֣וֹם קָדֹ֔שׁ כִּ֣י חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ הִ֔וא מֵ/אִשֵּׁ֖י יְהוָ֑ה כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/013.yaml
  text: You shall eat it in a holy place[a], because it is your portion and the portion of your sons from the food offerings of Yahweh, for so I have been commanded.
translation:
  language: hi
  text: तुम उसे किसी पवित्र स्थान में खाओ, क्योंकि यह यहोवा की भोजन-भेंटों[a] में से तुम्हारा और तुम्हारे पुत्रों का नियत भाग है; क्योंकि मुझे ऐसी ही आज्ञा दी गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “यहोवा की अग्नि-भेंटों में से।”
    reason: אִשֶּׁה के आग पर चढ़ाई जाने वाली भेंट से जुड़े अधिक शाब्दिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: तुम उसे ... खाना
  rationale: यह बहुवचन संबोधन में दिया गया निर्देश है। आधुनिक हिन्दी में ‘खाना’ प्रसंगानुसार स्पष्ट और स्वाभाविक आज्ञार्थक प्रयोग है।
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: किसी पवित्र स्थान में
  rationale: इब्रानी में निश्चित उपपद नहीं है; ‘किसी पवित्र स्थान में’ किसी एक निश्चित कक्ष का अनावश्यक संकेत दिए बिना अनिश्चितता बनाए रखता है।
- source_word: חָקְךָ ... וְחָק בָּנֶיךָ
  choice: तुम्हारा और तुम्हारे पुत्रों का नियत भाग
  rationale: याजकीय प्रसंग में חֹק किसी अमूर्त विधि से अधिक निर्धारित हिस्से या अधिकार को बताता है। ‘नियत भाग’ उस ठोस अर्थ को स्पष्ट करता है, और ‘पुत्रों’ से स्रोत की पुरुषवाचक विशिष्टता बनी रहती है।
- source_word: מֵאִשֵּׁי יְהוָה
  choice: यहोवा की भोजन-भेंटों में से
  rationale: אִשֶּׁה बलिदानी भेंटों की उस श्रेणी को दर्शाता है जो वेदी पर चढ़ाई जाती थी। ‘भोजन-भेंट’ आधुनिक पाठक के लिए याजकीय श्रेणी को सहज रूप से व्यक्त करता है; आग से संबंधित अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिवाचक नाम יהוה को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ द्वारा व्यक्त किया गया है।
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: क्योंकि मुझे ऐसी ही आज्ञा दी गई है
  rationale: यह रूप मूसा को मिली आज्ञा का कर्मवाच्य भाव सुरक्षित रखता है और आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: याजकीय अधिकार के लिए חֹק का अर्थ
  choice: नियत भाग
  alternative: विधि; अधिकार; बँटा हुआ हिस्सा
  rationale: प्रसंग याजकों को बलिदानी भेंट से मिलने वाले निर्धारित हिस्से का है, इसलिए ठोस ‘नियत भाग’ अमूर्त ‘विधि’ से अधिक उपयुक्त है।
- issue: אִשֵּׁי יְהוָה का अनुवाद
  choice: यहोवा की भोजन-भेंटें
  alternative: यहोवा की अग्नि-भेंटें; यहोवा को आग में चढ़ाई गई भेंटें
  rationale: शब्द का बलिदानी-भोजन और आग पर चढ़ाए जाने से दोनों संबंध है। मुख्य पाठ में सहज श्रेणी-सूचक अनुवाद रखा गया है और अधिक शाब्दिक आग-संबंधी रूप पादटिप्पणी में सुरक्षित है।
- issue: ‘तुम्हारे पुत्रों’ का संदर्भ
  choice: तुम्हारे पुत्रों
  alternative: तुम्हारी सन्तान
  rationale: इब्रानी में स्पष्टतः ‘पुत्र’ हैं और प्रसंग हारून के पुरुष याजकीय वंशजों से संबंधित है; व्यापक लिंग-निरपेक्ष शब्द स्रोत की विशिष्टता घटा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नियत भाग’ याजकीय अधिकार को स्पष्ट करता है, जबकि ‘भोजन-भेंट’ के साथ पादटिप्पणी मूल शब्द की आग-संबंधी छवि भी सुरक्षित रखती है।
