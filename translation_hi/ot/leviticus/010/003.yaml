language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן הוּא֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֤ה לֵ/אמֹר֙ בִּ/קְרֹבַ֣/י אֶקָּדֵ֔שׁ וְ/עַל פְּנֵ֥י כָל הָ/עָ֖ם אֶכָּבֵ֑ד וַ/יִּדֹּ֖ם אַהֲרֹֽן־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/003.yaml
  text: 'Then Moses said to Aaron[a], “This is what Yahweh spoke, saying: ‘Among those who come near me I will be sanctified[b], and before all the people I will be glorified.’” And Aaron was silent.'
translation:
  language: hi
  text: 'तब मूसा ने हारून से कहा, “याहवे ने यही कहा था: ‘जो मेरे निकट आते हैं, उनके बीच मैं पवित्र ठहरूँगा[a], और समस्त प्रजा के सामने मेरी महिमा होगी[b]।’” हारून चुप रहा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मेरे निकट आते हैं, उनके द्वारा मैं पवित्र माना जाऊँगा।” इब्रानी से परमेश्वर की पवित्रता का प्रकट होना अथवा निकट आने वालों द्वारा उसे पवित्र माना जाना—दोनों भाव निकल सकते हैं।
    reason: alternative_reading
  - marker: b
    text: या, “मेरा आदर होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בִּקְרֹבַי
  choice: जो मेरे निकट आते हैं, उनके बीच
  rationale: यह रूप शाब्दिक रूप से ‘मेरे निकट वालों में/बीच’ है; याजकीय प्रसंग में इसमें उपासना और सेवा के लिए परमेश्वर के निकट आने का भाव है, पर इसे केवल ‘याजकों’ तक सीमित नहीं किया गया।
- source_word: אֶקָּדֵשׁ
  choice: मैं पवित्र ठहरूँगा
  rationale: 'קדש के निफ़ाल रूप की वास्तविक अस्पष्टता बनाए रखता है: परमेश्वर की पवित्रता प्रकट भी हो सकती है और निकट आने वालों द्वारा मानी भी जा सकती है।'
- source_word: וְעַל פְּנֵי כָל הָעָם
  choice: समस्त प्रजा के सामने
  rationale: इब्रानी मुहावरे के सार्वजनिक आयाम को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֶכָּבֵד
  choice: मेरी महिमा होगी
  rationale: כבד के निफ़ाल का भाव परमेश्वर को सार्वजनिक रूप से महिमा अथवा आदर मिलने का है; यह हिन्दी में स्वाभाविक रहते हुए मूल की धार्मिक गरिमा रखता है।
- source_word: וַיִּדֹּם
  choice: चुप रहा
  rationale: हारून की स्तब्ध और मौन प्रतिक्रिया को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के निकट आने वालों के संबंध में उसकी पवित्रता की घोषणा
  choice: जो मेरे निकट आते हैं, उनके बीच मैं पवित्र ठहरूँगा
  alternative: जो मेरे निकट आते हैं, उनके द्वारा मैं पवित्र माना जाऊँगा
  rationale: इब्रानी में परमेश्वर की पवित्रता के प्रकट होने और मनुष्यों द्वारा उसे पवित्र मानने—दोनों की गुंजाइश है। मुख्य पाठ इस तनाव को किसी एक अर्थ तक सीमित नहीं करता और वैकल्पिक भाव पादटिप्पणी में देता है।
- issue: אֶכָּבֵד में सार्वजनिक गौरव या आदर
  choice: मेरी महिमा होगी
  alternative: मेरा आदर होगा
  rationale: दोनों अर्थ संभव हैं। ‘महिमा’ परमेश्वर के विषय में כבד का धार्मिक भार बनाए रखती है, जबकि ‘आदर’ उसका निकट वैकल्पिक अर्थ है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सामान्य पाठकों के लिए बोधगम्य रूप। ‘प्रजा’ लैव्यव्यवस्था के सामुदायिक प्रसंग के अनुकूल है; वाक्य-विन्यास मूल की गंभीरता और समानांतर पंक्तियों को बनाए रखता है।
