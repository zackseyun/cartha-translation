source:
  edition: WLC
  text: שׁ֣וֹק הַ/תְּרוּמָ֞ה וַ/חֲזֵ֣ה הַ/תְּנוּפָ֗ה עַ֣ל אִשֵּׁ֤י הַ/חֲלָבִים֙ יָבִ֔יאוּ לְ/הָנִ֥יף תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֨ה לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אִתְּ/ךָ֙ לְ/חָק עוֹלָ֔ם כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/015.yaml
  text: They shall bring the thigh of the contribution and the breast of the wave offering[a], along with the food offerings of the fat portions, to wave as a wave offering before Yahweh; and it shall be for you and for your sons with you as a permanent statute[d][c][b], just as Yahweh commanded.
translation:
  language: hi
  text: वे अंशदान की जाँघ[a] और हिलाने की भेंट की छाती को चरबी के अग्नि-चढ़ावों के साथ यहोवा[b] के सामने हिलाने की भेंट के रूप में हिलाने के लिए लाएँ। यह तुम्हारे और तुम्हारे साथ तुम्हारे पुत्रों के लिए सदा का नियत भाग होगा, जैसा यहोवा ने आज्ञा दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “टाँग।”
    reason: lexical_alternative
  - marker: b
    text: “यहोवा” इब्रानी ईश्वरीय नाम YHWH को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: जाँघ
  rationale: बलि-पशु के पिछले पैर के ऊपरी भाग को दर्शाता है; ‘जाँघ’ आधुनिक हिन्दी में ‘टाँग’ से अधिक सटीक है।
- source_word: תְּרוּמָה
  choice: अंशदान
  rationale: यह अलग करके दिए गए समर्पित अंश को सूचित करता है; ‘अंशदान’ अर्थ को पुरातन अनुष्ठानिक शब्दावली के बिना व्यक्त करता है।
- source_word: חָזֶה
  choice: छाती
  rationale: बलि-संबंधी शारीरिक भाग के लिए स्पष्ट और स्वाभाविक हिन्दी शब्द।
- source_word: תְּנוּפָה / לְהָנִיף
  choice: हिलाने की भेंट / हिलाया जाए
  rationale: संज्ञा और उसी मूल की क्रिया, दोनों को बनाए रखकर यहोवा के सामने किए जाने वाले अनुष्ठानिक प्रस्तुतीकरण को व्यक्त करता है।
- source_word: עַל אִשֵּׁי הַחֲלָבִים
  choice: चरबी के अग्नि-चढ़ावों के साथ
  rationale: अग्नि में चढ़ाए जाने वाले चरबी के भागों का सीधा और स्रोत-सन्निकट अनुवाद; עַל को यहाँ साथ लाए जाने के अर्थ में लिया गया है।
- source_word: וְהָיָה לְךָ וּלְבָנֶיךָ אִתְּךָ לְחָק עוֹלָם
  choice: ये तुम्हारे और तुम्हारे साथ तुम्हारे पुत्रों के लिए सदा का नियत भाग होगा
  rationale: दोहरे कर्ता—जाँघ और छाती—के कारण हिन्दी में ‘ये’ रखा गया है; חֹק यहाँ केवल विधान नहीं, याजकों को ठहराया गया भाग भी सूचित करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम YHWH को हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रत्यक्ष रूप से प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसे सामान्य उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में परिचित नामरूप रखा गया है।
- issue: לְחָק עוֹלָם में विधान और याजकीय अधिकार का संबंध
  choice: सदा का नियत भाग
  alternative: सदा की विधि
  rationale: प्रसंग में जाँघ और छाती हारून तथा उसके पुत्रों को मिलने वाले अंश हैं। ‘नियत भाग’ इस ठहराए हुए अधिकार को व्यक्त करता है, जबकि इसकी स्थायी वैधानिकता भी बनाए रखता है।
- issue: תְּנוּפָה की अनुष्ठानिक क्रिया
  choice: हिलाने की भेंट
  alternative: प्रस्तुति-भेंट
  rationale: मूल में संज्ञा और क्रिया की पुनरुक्ति है; ‘हिलाने’ से यह अनुष्ठानिक क्रिया सुरक्षित रहती है, यद्यपि उसकी ठीक गति पाठ में स्पष्ट नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। बलि-विधान की तकनीकी प्रकृति के कारण ‘हिलाने की भेंट’ और ‘अग्नि-चढ़ाव’ जैसे शब्द बनाए गए हैं; वाक्य-विन्यास को स्वाभाविक हिन्दी के लिए दो वाक्यों में बाँटा गया है।
