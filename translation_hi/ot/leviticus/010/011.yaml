source:
  edition: WLC
  text: וּ/לְ/הוֹרֹ֖ת אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֚ת כָּל הַ֣/חֻקִּ֔ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֲלֵי/הֶ֖ם בְּ/יַד מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/011.yaml
  text: and to teach the sons of Israel all the statutes that Yahweh has spoken to them by the hand of Moses[a].
translation:
  language: hi
  text: और इस्राएलियों को वे सभी विधान सिखाना जो याहवे ने मूसा के द्वारा उन्हें बताए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/הוֹרֹת
  choice: और ... सिखाना
  rationale: संयोजक वाव और לְ सहित हिफ़ील infinitive पिछले पद में याजकों के कर्तव्यों की सूची को आगे बढ़ाता है; आधुनिक हिन्दी में ‘सिखाना’ स्वाभाविक और स्पष्ट है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे वाचा-समुदाय का प्रचलित सामूहिक नाम है; ‘इस्राएलियों’ साधारण आधुनिक हिन्दी में उसी आशय को स्पष्ट रूप से व्यक्त करता है।
- source_word: כָּל הַחֻקִּים
  choice: वे सभी विधियाँ
  rationale: חֻקִּים निर्धारित दैवी नियमों या विधानों को दर्शाता है; ‘विधियाँ’ कानूनी-वाचाई भाव बनाए रखते हुए हिन्दी में सुबोध है।
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיהֶם
  choice: जिन्हें यहोवा ने ... उनसे कहा है
  rationale: संबंधवाचक उपवाक्य विधियों को विशेषित करता है; पूर्ण क्रिया को ‘कहा है’ से वर्तमान संदर्भ में प्रभावी पूर्ण कथन के रूप में रखा गया है, और אֲלֵיהֶם का ‘उनसे’ हिन्दी में बोलने के लक्ष्य को स्वाभाविक रूप से बताता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित नामरूप ‘यहोवा’ चतुरक्षरीय व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: शाब्दिक मुहावरा ‘मूसा के हाथ से’ माध्यम को दर्शाता है; ‘मूसा के द्वारा’ उसका स्वाभाविक हिन्दी समतुल्य है। शाब्दिक रूप को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है; हिन्दी पाठकों में स्थापित नामरूप ‘यहोवा’ उसे नाम के रूप में बनाए रखता है, जबकि ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक आशय
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यह पद पूरे वाचा-समुदाय को याजकीय शिक्षा का प्राप्तकर्ता बताता है। ‘इस्राएलियों’ सामूहिक आशय स्पष्ट करता है; शाब्दिक पुरुषवाची पारिवारिक अभिव्यक्ति इस संदर्भ में केवल पुरुषों तक अर्थ को सीमित समझे जाने का जोखिम रखती है।
- issue: मूसा की मध्यस्थ भूमिका व्यक्त करने वाला בְּיַד
  choice: मूसा के द्वारा
  alternative: मूसा के हाथ से
  rationale: दोनों रूप मूसा को दिव्य विधान पहुँचाने का माध्यम बताते हैं; मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और हिब्रू मुहावरा पादटिप्पणी में संरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य पिछले पद से जुड़ी कर्तव्य-सूची का अंश है, इसलिए आरम्भ में ‘और’ तथा infinitival ‘सिखाना’ बनाए रखे गए हैं।
