  text: הֵ֚ן לֹא הוּבָ֣א אֶת דָּמָ֔/הּ אֶל הַ/קֹּ֖דֶשׁ פְּנִ֑ימָה אָכ֨וֹל תֹּאכְל֥וּ אֹתָ֛/הּ בַּ/קֹּ֖דֶשׁ כַּ/אֲשֶׁ֥ר צִוֵּֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/018.yaml
  text: Look, its blood was not brought into the sanctuary, inside. You certainly should have eaten it in the holy place, as I commanded.
translation:
  language: hi
  text: देखो, उसका लहू पवित्रस्थान के भीतर नहीं लाया गया। तुम्हें उसे पवित्र स्थान में अवश्य खाना चाहिए था,[a] जैसा मैंने आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में ‘खाना’ क्रिया का बलयुक्त रूप प्रयोग हुआ है; इससे आज्ञा पर विशेष जोर पड़ता है: ‘तुम्हें उसे अवश्य खाना चाहिए था।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह शब्द अगले कथन की ओर जोर देकर ध्यान खींचता है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक और प्रत्यक्ष है।
- source_word: הוּבָא
  choice: लाया गया
  rationale: בוא का होफ़ाल रूप निष्क्रिय भाव व्यक्त करता है; इसलिए सीधा अनुवाद ‘लाया गया’ है।
- source_word: דָּמָהּ
  choice: उसका लहू
  rationale: स्त्रीलिंग एकवचन प्रत्यय पापबलि के पशु अथवा बलि की ओर संकेत करता है; ‘उसका’ इस संदर्भ में स्वाभाविक है और ‘लहू’ बलिदान-संबंधी गरिमा बनाए रखता है।
- source_word: אֶל־הַקֹּדֶשׁ פְּנִימָה
  choice: पवित्रस्थान के भीतर
  rationale: אֶל गति की दिशा और פְּנִימָה भीतर की ओर जाने का भाव देता है। संयुक्त हिन्दी पद भीतर स्थित पवित्र क्षेत्र में प्रवेश को स्पष्ट करता है, बिना ‘परदे के भीतर’ जैसी अतिरिक्त विशिष्टता जोड़े।
- source_word: אָכוֹל תֹּאכְלוּ
  choice: तुम्हें ... अवश्य खाना चाहिए था
  rationale: क्रियार्थक संज्ञा और अपूर्ण क्रिया का मेल क्रिया को बल देता है। प्रसंग अतीत में न मानी गई आज्ञा पर उलाहना है, इसलिए ‘अवश्य ... चाहिए था’ अर्थ और जोर दोनों व्यक्त करता है।
- source_word: אֹתָהּ
  choice: उसे
  rationale: स्त्रीलिंग एकवचन कर्म-सर्वनाम बलि की ओर संकेत करता है; हिन्दी में ‘उसे’ संदर्भ को पर्याप्त रूप से बनाए रखता है।
- source_word: בַּקֹּדֶשׁ
  choice: पवित्र स्थान में
  rationale: यह याजकों के बलि खाने के निर्धारित पवित्र क्षेत्र को दर्शाता है। अलग लिखे ‘पवित्र स्थान’ से पहले आए ‘पवित्रस्थान के भीतर’ के आंतरिक क्षेत्र से उचित भेद उभरता है।
- source_word: כַּאֲשֶׁר צִוֵּיתִי
  choice: जैसा मैंने आज्ञा दी थी
  rationale: यह मूसा की पहले दी गई आज्ञा की ओर लौटता है; हिन्दी में पूर्ण भूत ‘दी थी’ काल-संबंध को स्वाभाविक ढंग से स्पष्ट करता है।
theological_decisions:
- issue: पवित्र क्षेत्र से संबंधित स्थानवाचक शब्दावली
  choice: लहू के लिए ‘पवित्रस्थान के भीतर’ और बलि खाने के लिए ‘पवित्र स्थान में’
  alternative: दोनों पदों को एक ही तरह ‘पवित्र स्थान में’ कहना, अथवा पहले पद को ‘परदे के भीतर’ कहना
  rationale: पहले इब्रानी पद में भीतर की दिशा बताने वाला פְּנִימָה भी है, जबकि दूसरे में केवल पवित्र क्षेत्र में खाने की बात है। भेद बनाए रखने से अनुष्ठान की तर्क-श्रृंखला सुरक्षित रहती है और पाठ से अधिक विशिष्ट स्थान निर्धारित नहीं होता।
- issue: बलयुक्त क्रिया का काल और दायित्व
  choice: ‘अवश्य खाना चाहिए था’
  alternative: ‘निश्चय ही खाओगे’ या केवल ‘खाना था’
  rationale: रूप अपने आप में क्रिया को बल देता है, जबकि प्रसंग मूसा द्वारा बीती चूक पर की गई फटकार है। चुना हुआ रूप बल और अतीत के अपूर्ण दायित्व दोनों को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और अनुष्ठानिक संदर्भ के अनुरूप शैली। ‘पवित्रस्थान’ पहले पद में आंतरिक पवित्र क्षेत्र के तकनीकी संकेत के लिए संयुक्त रखा गया है, जबकि खाने के स्थान के लिए ‘पवित्र स्थान’ प्रयुक्त है।
