source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אַהֲרֹ֜ן אֶל מֹשֶׁ֗ה הֵ֣ן הַ֠/יּוֹם הִקְרִ֨יבוּ אֶת חַטָּאתָ֤/ם וְ/אֶת עֹֽלָתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּקְרֶ֥אנָה אֹתִ֖/י כָּ/אֵ֑לֶּה וְ/אָכַ֤לְתִּי חַטָּאת֙ הַ/יּ֔וֹם הַ/יִּיטַ֖ב בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/019.yaml
  text: And Aaron said to Moses[a], “Look, today they presented their sin offering and their burnt offering before Yahweh, and things like these have happened to me. If I had eaten the sin offering today[c][b], would it have been good in the sight of Yahweh?”
translation:
  language: hi
  text: तब हारून ने मूसा से कहा, “देखिए, आज उन्होंने अपनी पापबलि[a] और होमबलि यहोवा के सामने चढ़ाया है, और मेरे साथ ऐसी घटनाएँ घटी हैं।[b] यदि मैं आज पापबलि खा लेता, तो क्या यह यहोवा की दृष्टि में अच्छा होता?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पापबलि’ के दोनों प्रयोगों का अनुवाद ‘शुद्धिकरण-बलि’ भी हो सकता है। इब्रानी חַטָּאת का अर्थ ‘पाप’ अथवा पाप या अशुद्धता से शुद्ध करने के लिए चढ़ाया जाने वाला बलिदान हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और मेरे साथ ऐसी ही बातें घटी हैं।” हारून उस दिन आई विपत्तियों की ओर, विशेषकर अपने पुत्रों की मृत्यु की ओर, संकेत करता है।
    reason: cultural_note
  - marker: c
    text: या, “तो क्या इससे यहोवा प्रसन्न होता?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला अव्यय है। ‘देखिए’ आधुनिक और स्वाभाविक है तथा मूसा से हारून के संबोधन के अनुरूप आदरपूर्ण भी है।
- source_word: הִקְרִיבוּ
  choice: चढ़ाया है
  rationale: हिफ़ील रूप का यहाँ बलिदान प्रस्तुत करने का पारिभाषिक अर्थ है। ‘चढ़ाया है’ हिन्दी में बलिदान-संबंधी संदर्भ के लिए सहज है।
- source_word: חַטָּאתָם / חַטָּאת
  choice: अपना पापबलि / पापबलि
  rationale: लैव्यव्यवस्था के इस प्रसंग में शब्द अमूर्त ‘पाप’ नहीं, बल्कि पाप से संबंधित बलिदान को दर्शाता है। ‘पापबलि’ प्रचलित और संक्षिप्त पद है; ‘शुद्धिकरण-बलि’ को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: עֹלָתָם
  choice: होमबलि
  rationale: यह पूरी तरह जलाए जाने वाले बलिदान का पारंपरिक हिन्दी नाम है और सामान्य बाइबलीय पाठकों के लिए परिचित है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह परमेश्वर की उपस्थिति में बलिदान प्रस्तुत करने का भाव रखता है और इब्रानी संबंधसूचक अभिव्यक्ति के निकट है।
- source_word: וַתִּקְרֶאנָה אֹתִי כָּאֵלֶּה
  choice: मेरे साथ ऐसी घटनाएँ घटी हैं
  rationale: अभिव्यक्ति उन दुखद बातों की ओर संकेत करती है जो उस दिन हारून के साथ हुईं, पर मूल पाठ उन्हें स्पष्ट रूप से परिभाषित नहीं करता। यह अनुवाद उसी संकेतात्मकता को बनाए रखता है।
- source_word: וְאָכַלְתִּי
  choice: यदि मैं ... खाता
  rationale: वाव + क़ातल रूप यहाँ अगले आलंकारिक प्रश्न के साथ एक अवास्तविक शर्त का भाव देता है। हिन्दी में ‘यदि मैं ... खाता’ उस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַיִּיטַב בְּעֵינֵי יְהוָה
  choice: क्या यह यहोवा की दृष्टि में अच्छा होता?
  rationale: यह अनुवाद दिव्य स्वीकृति के विषय में आलंकारिक प्रश्न को व्यक्त करते हुए ‘दृष्टि में अच्छा’ वाली इब्रानी उपमा को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में उसके प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: हारून द्वारा पापबलि न खाने के बचाव का स्वरूप
  choice: हारून उस दिन अपने साथ घटी दुखद घटनाओं के संदर्भ में पूछता है कि उसका पापबलि खाना क्या यहोवा की दृष्टि में अच्छा होता।
  alternative: हारून केवल अपना व्यक्तिगत शोक व्यक्त कर रहा है; अथवा वह अपनी वर्तमान दशा में बलिदान खाने की धार्मिक उपयुक्तता पर प्रश्न उठा रहा है।
  rationale: मूल पाठ दुखद घटनाओं और बलिदान खाने के बीच संबंध तो स्थापित करता है, पर यह नहीं बताता कि मुख्य प्रश्न शोक, अनुष्ठानिक दशा या अधिक व्यापक धार्मिक उपयुक्तता का था। अनुवाद इस तनाव को अनिर्णीत रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, आदरपूर्ण और सहज रखी गई है। ‘देखिए’ संबोधन को स्वाभाविक बनाता है; ‘पापबलि’ और ‘होमबलि’ बलिदान-संबंधी परिचित पारिभाषिक शब्द हैं। वाक्य की आलंकारिक प्रश्न-रचना तथा हारून के कारण की मूल अस्पष्टता सुरक्षित रखी गई है।
