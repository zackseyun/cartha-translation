  text: וַ/יֹּ֣אמֶר מֹשֶׁ֣ה אֶֽל אַהֲרֹ֡ן וּ/לְ/אֶלְעָזָר֩ וּ/לְ/אִֽיתָמָ֨ר בָּנָ֜י/ו רָֽאשֵׁי/כֶ֥ם אַל תִּפְרָ֣עוּ וּ/בִגְדֵי/כֶ֤ם לֹֽא תִפְרֹ֨מוּ֙ וְ/לֹ֣א תָמֻ֔תוּ וְ/עַ֥ל כָּל הָ/עֵדָ֖ה יִקְצֹ֑ף וַ/אֲחֵי/כֶם֙ כָּל בֵּ֣ית יִשְׂרָאֵ֔ל יִבְכּוּ֙ אֶת הַ/שְּׂרֵפָ֔ה אֲשֶׁ֖ר שָׂרַ֥ף יְהוָֽה־׀־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/006.yaml
  text: And Moses said to Aaron and to Eleazar and Ithamar his sons[a], “Do not let your heads hang loose, and do not tear your garments, so that you do not die and he become angry with all the congregation. But your brothers, the whole house of Israel[b], shall weep for the burning that Yahweh has kindled.”
translation:
  language: hi
  text: मूसा ने हारून और उसके पुत्रों एलआज़ार और ईतामार से कहा, “अपने सिर के बाल खुले न छोड़ो[a] और अपने वस्त्र न फाड़ो, कहीं ऐसा न हो कि तुम मर जाओ और सारी मंडली पर क्रोध भड़क उठे। पर तुम्हारे भाई, इस्राएल का समस्त घराना, उस अग्निदाह पर विलाप करें जो याहवे ने किया है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सिर न खोलो” अथवा “अपने बाल अस्त-व्यस्त न रहने दो।” इब्रानी वाक्यांश सिर या बालों से जुड़े शोक-संकेत को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उस दहन पर जो याहवे ने जलाया।” इब्रानी में ‘दहन’ और ‘जलाया’ सजातीय शब्द हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁיכֶם אַל תִּפְרָעוּ
  choice: अपने सिर के बाल खुले न छोड़ो
  rationale: प्रע यहाँ सिर या बालों को खुला अथवा अस्त-व्यस्त छोड़ने के उस संकेत को बताता है जो शोक से जुड़ा था। हिन्दी में ‘सिर के बाल खुले न छोड़ो’ इस भाव को स्पष्ट रखता है, बिना इसे केवल सिर ढकने की प्रथा मान लेने के।
- source_word: וּבִגְדֵיכֶם לֹא תִפְרֹמוּ
  choice: अपने वस्त्र न फाड़ो
  rationale: प्रם वस्त्र फाड़ने को दर्शाता है, विशेषकर शोक के संकेत के रूप में; यह आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: וְלֹא תָמֻתוּ
  choice: कहीं ऐसा न हो कि तुम मर जाओ
  rationale: निषेधों के बाद यह चेतावनी उनके संभावित घातक परिणाम को व्यक्त करती है।
- source_word: וְעַל כָּל הָעֵדָה יִקְצֹף
  choice: और सारी मंडली पर क्रोध भड़क उठे
  rationale: इब्रानी में क्रिया एकवचन है पर कर्ता स्पष्ट नहीं है। ‘क्रोध भड़क उठे’ उस व्याकरणिक अस्पष्टता को बनाए रखता और हिन्दी में चेतावनी को स्वाभाविक बनाता है।
- source_word: וַאֲחֵיכֶם כָּל בֵּית יִשְׂרָאֵל
  choice: तुम्हारे भाई, इस्राएल का समस्त घराना
  rationale: ‘भाई’ मूल के पुल्लिंग बहुवचन को बनाए रखता है और उसके बाद का समानाधिकरण पूरे राष्ट्रीय समुदाय को स्पष्ट करता है।
- source_word: יִבְכּוּ אֶת הַשְּׂרֵפָה
  choice: उस दहन पर विलाप करे
  rationale: שְׂרֵפָה वास्तविक जलाए जाने या दहन की घटना को दर्शाता है। ‘दहन’ ठोस अग्नि-चित्र बनाए रखता है, और ‘विलाप करे’ शोक के आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר שָׂרַף יְהוָה
  choice: जिसे यहोवा ने भड़काया है
  rationale: मूल में ‘वह दहन जिसे यहोवा ने जलाया’ जैसा सजातीय प्रयोग है। हिन्दी में ‘भड़काया है’ पुनरुक्ति घटाते हुए ईश्वरीय कर्तृत्व को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय ईश्वरीय नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
theological_decisions:
- issue: יִקְצֹף के अप्रकट कर्ता को कैसे प्रस्तुत किया जाए
  choice: क्रोध भड़क उठे
  alternative: वह सारी मंडली पर क्रोधित हो जाए
  rationale: मूल में कर्ता अलग से व्यक्त नहीं है। अमूर्त रचना हिन्दी में स्वाभाविक रहते हुए इस अप्रकटता को सुरक्षित रखती है और ‘वह’ जोड़कर कर्ता को आवश्यकता से अधिक स्पष्ट नहीं करती।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: यहाँ मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ से नाम को उपाधि में बदले बिना रखा गया है।
- issue: यहोवा द्वारा दहन भड़काने का कथन
  choice: जिसे यहोवा ने भड़काया है
  alternative: जो यहोवा की ओर से भड़का है
  rationale: सक्रिय क्रिया मूल पाठ में यहोवा को सीधे कर्ता बताती है; इसे नरम करके केवल स्रोत या अनुमति का भाव नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए बोधगम्य रखी गई है। ‘मंडली’, ‘वस्त्र’, ‘समस्त घराना’ और ‘विलाप’ धार्मिक-साहित्यिक प्रसंग के अनुरूप हैं, पर अत्यधिक पुरातन नहीं।
