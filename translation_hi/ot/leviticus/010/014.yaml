source:
  edition: WLC
  text: וְ/אֵת֩ חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּ/מָק֣וֹם טָה֔וֹר אַתָּ֕ה וּ/בָנֶ֥י/ךָ וּ/בְנֹתֶ֖י/ךָ אִתָּ֑/ךְ כִּֽי חָקְ/ךָ֤ וְ/חָק בָּנֶ֨י/ךָ֙ נִתְּנ֔וּ מִ/זִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/014.yaml
  text: And you[a], and your sons and your daughters with you, shall eat the breast of the wave offering and the thigh of the contribution in a clean place[c][b], because they have been given as your portion and your sons’ portion from the sacrifices of the peace offerings of the sons of Israel.
translation:
  language: hi
  text: और लहराने की भेंट की छाती[a] और उठाई हुई भेंट की जाँघ[b] को तुम, और तुम्हारे बेटे-बेटियाँ तुम्हारे साथ, किसी शुद्ध स्थान में खाओ, क्योंकि वे इस्राएल के पुत्रों की मेलबलियों[c] में से तुम्हारे हिस्से और तुम्हारे बेटों के हिस्से के रूप में दिए गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रस्तुत की हुई भेंट की छाती।” इब्रानी पद उस भाग को दर्शाता है जिसे यहोवा के सामने अनुष्ठानपूर्वक लहराया जाता था।
    reason: lexical_alternative
  - marker: b
    text: या, “अलग रखी हुई भेंट की जाँघ।” इब्रानी शब्द का मूल भाव किसी वस्तु को उठाकर अथवा अलग करके याजकीय अंश के रूप में देना है।
    reason: lexical_alternative
  - marker: c
    text: “मेलबलि” का अनुवाद “शान्ति-बलि” भी किया जा सकता है; इब्रानी शब्द में शांति, संपूर्णता और कुशलता का व्यापक भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה הַתְּנוּפָה
  choice: हिलाई हुई भेंट की छाती
  rationale: חֲזֶה पशु की छाती का भाग है और תְּנוּפָה यहोवा के सामने अनुष्ठानपूर्वक हिलाकर प्रस्तुत की गई भेंट को सूचित करता है। यह रूप क्रिया-चित्र को स्पष्ट रखते हुए हिंदी के स्थापित बलिदानी पद से मेल खाता है।
- source_word: שׁוֹק הַתְּרוּמָה
  choice: उठाई हुई भेंट की जाँघ
  rationale: שׁוֹק यहाँ पशु की जाँघ/टाँग का भाग है; תְּרוּמָה उठाकर या अलग करके दिए गए याजकीय अंश को सूचित करती है। 'उठाई हुई भेंट' मूल बिंब को बनाए रखती है।
- source_word: תֹּאכְלוּ
  choice: खाना
  rationale: अपूर्ण क्रिया यहाँ विधिक निर्देश का काम करती है। हिंदी में संदर्भगत आज्ञार्थक 'खाना' स्वाभाविक और स्पष्ट है।
- source_word: בְּמָקוֹם טָהוֹר
  choice: किसी शुद्ध स्थान में
  rationale: टָהוֹר लैव्यव्यवस्था में अनुष्ठानिक शुद्धता से जुड़ा है। 'शुद्ध स्थान' बिना अनावश्यक व्याख्या जोड़े इस अर्थ को व्यक्त करता है।
- source_word: חָקְךָ וְחָק בָּנֶיךָ
  choice: तुम्हारे और तुम्हारे बेटों के नियत भाग
  rationale: חֹק यहाँ नियम मात्र नहीं, बल्कि ठहराया हुआ याजकीय हिस्सा है। 'नियत भाग' इस प्रसंगगत अर्थ को स्पष्ट करता है।
- source_word: זִבְחֵי שַׁלְמֵי
  choice: मेलबलियों
  rationale: שְׁלָמִים का अर्थक्षेत्र शांति, कुशलता और संपूर्णता से जुड़ा है। हिंदी बाइबलीय प्रयोग में 'मेलबलि' समझने योग्य है, पर वैकल्पिक अर्थ-पहलू पादटिप्पणी में सुरक्षित है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह मूल के स्पष्ट वंशगत सामूहिक पद को औपचारिक रूप से सुरक्षित रखता है; प्रसंग में यह इस्राएली समुदाय को सामूहिक रूप से दर्शाता है।
theological_decisions:
- issue: שְׁלָמִים का अनुवाद
  choice: मेलबलि
  alternative: शान्ति-बलि
  rationale: मुख्य पाठ में 'मेलबलि' हिंदी पाठक के लिए प्रचलित और सहज है, जबकि पादटिप्पणी मूल शब्द के व्यापक शांति, कुशलता और संपूर्णता वाले अर्थक्षेत्र को बनाए रखती है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक वंशगत पद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल में प्रयुक्त पुत्र-संबंधी अभिव्यक्ति को बनाए रखा गया है, यद्यपि यह पूरे समुदाय का पारंपरिक सामूहिक नाम है।
- issue: חֹק का प्रसंगगत अर्थ
  choice: नियत भाग
  alternative: हक़
  rationale: बलिदानी संदर्भ में यह परमेश्वर द्वारा ठहराए गए याजकीय हिस्से को दर्शाता है; 'नियत भाग' अधिकार और आवंटन दोनों को संप्रेषित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक-बलिदानी प्रसंग के अनुरूप रखी गई है। वाक्यक्रम को स्वाभाविक हिंदी के लिए समायोजित किया गया है, जबकि सभी सहभागी—हारून, उसके बेटे और बेटियाँ—स्पष्ट रूप से बनाए गए हैं।
