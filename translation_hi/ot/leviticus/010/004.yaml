base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/004.yaml
  text: Then Moses called Mishael and Elzaphan[a], the sons of Uzziel, Aaron’s uncle, and said to them, “Come near[b]; carry your brothers away from before the sanctuary to outside the camp.”
translation:
  language: hi
  text: तब मूसा ने हारून के चाचा उज्जीएल के पुत्रों, मीशाएल और एलसाफान को बुलाकर कहा, “पास आओ और अपने भाइयों[a] को पवित्रस्थान के सामने से[b] उठाकर छावनी के बाहर ले जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भाइयों” का अर्थ निकट पुरुष संबंधी भी हो सकता है; नादाब और अबीहू वास्तव में उनके चचेरे भाई थे।
    reason: lexical_alternative
  - marker: b
    text: या “पवित्रस्थान के आगे से।”
    reason: lexical_alternative
