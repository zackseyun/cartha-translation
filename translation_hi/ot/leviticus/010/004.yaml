- source_word: בְּנֵי עֻזִּיאֵל דֹּד אַהֲרֹן
  choice: हारून के चाचा उज्जीएल के पुत्रों
  rationale: यह शब्दक्रम स्पष्ट करता है कि उज्जीएल हारून के चाचा थे और मीशाएल तथा एलसाफान उज्जीएल के पुत्र थे।
- source_word: קִרְבוּ
  choice: पास आओ
  rationale: आज्ञार्थक क्रिया का स्थान-संबंधी अर्थ सीधे और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: שְׂאוּ
  choice: उठाकर … ले जाओ
  rationale: נשא में उठाने और ढोकर ले जाने दोनों का भाव हो सकता है; प्रसंग में शवों को वहाँ से बाहर ले जाना अभिप्रेत है।
- source_word: אֲחֵיכֶם
  choice: अपने भाइयों
  rationale: शाब्दिक संबंध-संज्ञा को बनाए रखा गया है, यद्यपि इब्रानी में אָח निकट पुरुष संबंधियों के लिए भी प्रयुक्त हो सकता है।
- source_word: מֵאֵת פְּנֵי הַקֹּדֶשׁ
  choice: पवित्रस्थान के सामने से
  rationale: פְּנֵי के स्थान-संबंधी ‘सामने’ भाव और הַקֹּדֶשׁ के पवित्र परिसर/स्थान-सूचक अर्थ को सुरक्षित रखता है।
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर ले जाओ
  rationale: अभिव्यक्ति गंतव्य की ओर गति बताती है; हिंदी में ‘बाहर ले जाओ’ इसका स्वाभाविक रूप है।
