  yaml_path: translation/ot/leviticus/010/005.yaml
  text: So they came near and carried them in their tunics to outside the camp[a], just as Moses had said.
translation:
  language: hi
  text: तब वे पास आए और उन्हें उनके अंगरखों समेत छावनी के बाहर उठा ले गए[a], ठीक वैसे ही जैसे मूसा ने कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें उनके अंगरखों से पकड़कर छावनी के बाहर उठा ले गए।” इब्रानी संबंधबोधक शब्द यहाँ साधन भी बता सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: वे पास आए
  rationale: क्रिया קרב के काल रूप में शवों की ओर बढ़ने का भाव है; ‘पास आए’ आधुनिक और सहज हिन्दी है तथा अनावश्यक रीति-संबंधी अर्थ नहीं जोड़ता।
- source_word: וַיִּשָּׂאֻם
  choice: उन्हें ... उठा ले गए
  rationale: נשׂא यहाँ नादाब और अबीहू के शवों को उठाकर बाहर ले जाने को बताता है। ‘उठा ले गए’ उठाने और स्थान से हटाकर ले जाने, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּכֻתֳּנֹתָם
  choice: उनके अंगरखों समेत
  rationale: כֻּתֹּנֶת शरीर पर पहना जाने वाला लंबा वस्त्र था। בְּ परिस्थिति (‘अंगरखे पहने हुए/समेत’) या साधन (‘अंगरखों से पकड़कर’) बता सकता है। मुख्य पाठ में ‘समेत’ पहले अर्थ को सहज रूप में रखता है और दूसरे को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह पदबंध छावनी से बाहर के स्थान की ओर गति बताता है। ‘उठा ले गए’ में दिशा पहले ही स्पष्ट है, इसलिए ‘छावनी के बाहर’ स्वाभाविक हिन्दी में पूरा अर्थ देता है।
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: ठीक वैसे ही जैसे मूसा ने कहा था
  rationale: यह मूसा के पहले दिए आदेश की ओर संकेत करता है। ‘कहा था’ पूर्ववर्ती वचन को और ‘ठीक वैसे ही’ उसके अनुरूप किए गए कार्य को स्पष्ट करता है।
