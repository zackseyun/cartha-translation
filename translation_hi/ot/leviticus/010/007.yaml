id: LEV.10.7
reference: Leviticus 10:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ פֶּן תָּמֻ֔תוּ כִּי שֶׁ֛מֶן מִשְׁחַ֥ת יְהוָ֖ה עֲלֵי/כֶ֑ם וַֽ/יַּעֲשׂ֖וּ כִּ/דְבַ֥ר מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/007.yaml
  text: And you shall not go out from the entrance of the tent of meeting, lest you die, because the anointing oil of Yahweh is on you.” And they did according to the word of Moses.
translation:
  language: hi
  text: और मिलाप के तंबू के प्रवेश-द्वार से बाहर न निकलना, कहीं ऐसा न हो कि तुम मर जाओ, क्योंकि याहवे का अभिषेक-तेल तुम पर है।” और उन्होंने मूसा के वचन के अनुसार किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/פֶּתַח
  choice: और ... प्रवेश-द्वार से
  rationale: संयोजक וּ और संबंधसूचक מִ का अर्थ क्रमशः ‘और’ तथा ‘से’ है। פֶּתַח के लिए ‘प्रवेश-द्वार’ तंबू में प्रवेश और बाहर निकलने के स्थान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह पवित्रस्थान के तंबू का स्थापित धार्मिक पद है। ‘मिलापवाला तंबू’ आधुनिक हिंदी बाइबल-पाठकों के लिए परिचित है और भेंट/सभा के भाव को बनाए रखता है।
- source_word: לֹא תֵצְאוּ
  choice: बाहर न निकलना
  rationale: निषेध के साथ अपूर्ण क्रिया यहाँ स्पष्ट आदेश देती है। संदर्भ में मूसा सीधे हारून और उसके पुत्रों को निर्देश दे रहा है; ‘न निकलना’ दृढ़ किंतु स्वाभाविक हिंदी निषेध है।
- source_word: פֶּן תָּמֻתוּ
  choice: कहीं ऐसा न हो कि तुम मर जाओ
  rationale: פֶּן आशंकित परिणाम की चेतावनी देता है। यह हिंदी अभिव्यक्ति ‘lest’ का गंभीर चेतावनी-भाव बनाए रखती है, बिना परिणाम को सपाट अनिवार्यता में बदलने के।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिंदी में स्पष्ट और सहज है।
- source_word: שֶׁמֶן מִשְׁחַת יְהוָה
  choice: यहोवा का अभिषेक का तेल
  rationale: यह रचना उस अभिषेक-तेल को सूचित करती है जो यहोवा से संबद्ध और याजकीय अभिषेक के लिए निर्धारित है। यह रूप स्रोत की संज्ञा-श्रृंखला को निकटता से रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: עֲלֵי/כֶם
  choice: तुम पर है
  rationale: עַל तेल के अभिषिक्त व्यक्तियों पर होने का संकेत देता है। ‘तुम पर है’ सरल, स्वाभाविक और मूल के निकट है।
- source_word: וַ/יַּעֲשׂוּ
  choice: और उन्होंने ... किया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है और आज्ञा के पालन को बताता है। ‘और उन्होंने ... किया’ मूल संरचना को स्पष्ट रूप से बनाए रखता है।
- source_word: כִּ/דְבַר מֹשֶׁה
  choice: मूसा के वचन के अनुसार
  rationale: כְּ अनुरूपता व्यक्त करता है और דָּבָר यहाँ मूसा के बोले हुए निर्देश को सूचित करता है। यह अनुवाद औपचारिक निकटता और हिंदी की गरिमा दोनों रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम प्रत्यक्ष रूप से आया है। हिंदी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है, न कि ‘प्रभु’ जैसी उपाधि को, ताकि नाम की विशिष्टता बनी रहे।
- issue: अभिषेक के तेल का ‘तुम पर’ होना
  choice: शाब्दिक स्थानिक कथन बनाए रखा गया
  alternative: तुम्हारा अभिषेक हुआ है
  rationale: मूल तेल के उनके ऊपर होने की ठोस छवि देता है और उसी से उनके पवित्र अभिषेक तथा दायित्व का संकेत निकलता है। इसे केवल अमूर्त धार्मिक स्थिति में बदलने से मूल छवि मिट जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आदेश की गंभीरता के लिए ‘बाहर न निकलना’ और चेतावनी के लिए ‘कहीं ऐसा न हो कि’ चुना गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
