language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן וְ/אֶ֣ל אֶ֠לְעָזָר וְ/אֶל אִ֨יתָמָ֥ר בָּנָי/ו֮ הַ/נּֽוֹתָרִים֒ קְח֣וּ אֶת הַ/מִּנְחָ֗ה הַ/נּוֹתֶ֨רֶת֙ מֵ/אִשֵּׁ֣י יְהוָ֔ה וְ/אִכְל֥וּ/הָ מַצּ֖וֹת אֵ֣צֶל הַ/מִּזְבֵּ֑חַ כִּ֛י קֹ֥דֶשׁ קָֽדָשִׁ֖ים הִֽוא־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/012.yaml
  text: 'Then Moses spoke to Aaron and to Eleazar and to Ithamar[a], his remaining sons: “Take the grain offering that remains from the food offerings of Yahweh, and eat it unleavened beside the altar, because it is most holy.”'
translation:
  language: hi
  text: फिर मूसा ने हारून और उसके शेष पुत्रों, एलआज़ार और ईतामार, से कहा, “याहवे के अग्नि-अर्पणों में से बची हुई अन्नबलि लो और उसे बिना खमीर के वेदी के पास खाओ, क्योंकि वह परमपवित्र है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर मूसा ने … कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘फिर’ आधुनिक हिन्दी में स्वाभाविक क्रम व्यक्त करता है।
- source_word: הַנּוֹתָרִים
  choice: शेष पुत्रों
  rationale: यह नादाब और अबीहू की मृत्यु के बाद बचे हारून के पुत्रों को सूचित करता है; ‘शेष’ मूल की संक्षिप्तता बनाए रखता है और ‘जीवित बचे’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: הַמִּנְחָה
  choice: अन्नबलि
  rationale: लैव्यव्यवस्था के बलिदान-संबंधी संदर्भ में מִנְחָה विशेष रूप से अनाज के अर्पण को दर्शाता है; ‘अन्नबलि’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और संक्षिप्त है।
- source_word: מֵאִשֵּׁי יְהוָה
  choice: याहवे को आग में चढ़ाए गए अर्पणों में से
  rationale: यह रूप אִשֶּׁה की अग्नि-संबंधी बलिदानी धारणा को स्पष्ट, सहज हिन्दी में रखता है और यह भी दिखाता है कि बचा हुआ अन्नबलि उन्हीं अर्पणों का भाग है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: וְאִכְלֻהָ מַצּוֹת
  choice: उसे … बिना खमीर के … खाओ
  rationale: מַצּוֹת यहाँ अन्नबलि को अखमीरी रूप में खाने का निर्देश देता है; अनावश्यक रूप से ‘रोटियाँ’ या ‘टिकियाँ’ जोड़ने से बचा गया है।
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: वेदी के पास
  rationale: אֵצֶל निकटता व्यक्त करता है; ‘के पास’ स्वाभाविक हिन्दी है और स्पर्श का भाव नहीं देता।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र
  rationale: इब्रानी की अतिशयोक्तिपरक रचना सर्वोच्च स्तर की पवित्रता बताती है; ‘परमपवित्र’ हिन्दी में उसका संक्षिप्त और प्रतिष्ठित समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: קֹדֶשׁ קָדָשִׁים की तीव्रता
  choice: परमपवित्र
  alternative: पवित्र वस्तुओं में परमपवित्र
  rationale: यह इब्रानी सर्वोच्चता-सूचक मुहावरा अर्पण की अत्युच्च पवित्रता बताता है; ‘परमपवित्र’ इसे बिना किसी विशेष पवित्रस्थान का संकेत दिए व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अन्नबलि’, ‘वेदी’ और ‘परमपवित्र’ जैसे स्थापित धार्मिक पदों का प्रयोग किया गया है, जबकि वाक्य-विन्यास समकालीन हिन्दी का है।
