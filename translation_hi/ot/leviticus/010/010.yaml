  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र और अपवित्र’। यहाँ इब्रानी में उस चीज़ के बीच भेद है जो पवित्र ठहराई गई है और जो पवित्र नहीं है; ‘साधारण’ शब्द इसलिए रखा गया है ताकि जानबूझकर किए गए अनादर का भाव न आए।
    reason: lexical_alternative
  - marker: b
