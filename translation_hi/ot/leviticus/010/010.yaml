lexical_decisions:
- source_word: וּלֲהַבְדִּיל
  choice: भेद कर सको
  rationale: लामेदयुक्त धातुरूप पिछले पद से जुड़ा उद्देश्य व्यक्त करता है। ‘भेद कर सको’ याजकों की पहचान और विवेक की भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֵּין
  choice: के बीच
  rationale: दो-दो श्रेणियों के परस्पर विरोध को दिखाने वाली इस दोहराई गई रचना का सटीक और सहज हिन्दी रूप।
- source_word: הַקֹּדֶשׁ
  choice: पवित्र
  rationale: यह किसी एक वस्तु के बजाय पवित्र मानी जाने वाली पूरी श्रेणी को सूचित करता है; संज्ञा के रूप में ‘पवित्र’ उस व्यापक अर्थ को बनाए रखता है।
- source_word: הַחֹל
  choice: साधारण
  rationale: याजकीय संदर्भ में इसका अर्थ पवित्र के विपरीत, अर्थात जो पवित्र उपयोग के लिए अलग नहीं किया गया है। ‘साधारण’ अनादर या दुष्टता का अनावश्यक भाव नहीं जोड़ता।
- source_word: הַטָּמֵא
  choice: अशुद्ध
  rationale: लैव्यव्यवस्था के संदर्भ में यह मुख्यतः अनुष्ठानिक स्थिति की श्रेणी है। हिन्दी बाइबलीय प्रयोग में ‘अशुद्ध’ परिचित और उपयुक्त है।
- source_word: הַטָּהוֹר
  choice: शुद्ध
  rationale: ‘अशुद्ध’ के साथ स्वाभाविक जोड़ी बनाता है और याजकीय व्यवस्था में अनुष्ठानिक शुद्धता की स्थिति को व्यक्त करता है।
theological_decisions:
- issue: חֹל और קֹדֶשׁ के याजकीय विरोध का अनुवाद
  choice: पवित्र और साधारण
  alternative: पवित्र और अपवित्र
  rationale: मूल विरोध उस वस्तु या क्षेत्र के बीच है जो पवित्र ठहराया गया है और जो ऐसा नहीं है। ‘साधारण’ यह भेद बनाए रखता है, जबकि ‘अपवित्र’ आधुनिक हिन्दी में नैतिक बुराई या दूषण का अधिक प्रबल भाव दे सकता है।
- issue: טָמֵא / טָהוֹר श्रेणियों का स्वरूप
  choice: अशुद्ध / शुद्ध को अनुष्ठानिक श्रेणियों के रूप में समझना
  alternative: अपवित्र / पवित्र अथवा नैतिक रूप से बुरा / अच्छा
  rationale: लैव्यव्यवस्था के इस याजकीय संदर्भ में ये शब्द मुख्यतः अनुष्ठानिक दशा बताते हैं; अनुवाद हर प्रकार की अशुद्धता को नैतिक दोष नहीं ठहराता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। पद पिछले वाक्य से उद्देश्यसूचक रूप में जुड़ता है, इसलिए ‘ताकि ... कर सको’ अपनाया गया। श्रेणीसूचक संज्ञाओं को अनावश्यक रूप से वस्तुविशेष में नहीं बदला गया।
