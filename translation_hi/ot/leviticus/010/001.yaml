  text: וַ/יִּקְח֣וּ בְנֵֽי אַ֠הֲרֹן נָדָ֨ב וַ/אֲבִיה֜וּא אִ֣ישׁ מַחְתָּת֗/וֹ וַ/יִּתְּנ֤וּ בָ/הֵן֙ אֵ֔שׁ וַ/יָּשִׂ֥ימוּ עָלֶ֖י/הָ קְטֹ֑רֶת וַ/יַּקְרִ֜בוּ לִ/פְנֵ֤י יְהוָה֙ אֵ֣שׁ זָרָ֔ה אֲשֶׁ֧ר לֹ֦א צִוָּ֖ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/001.yaml
  text: Then Nadab and Abihu[a], Aaron’s sons, each took his firepan, put fire in it, placed incense on it, and presented unauthorized fire before Yahweh, which he had not commanded them.
translation:
  language: hi
  text: तब हारून के पुत्र नादाब और अबीहू ने अपने-अपने अंगारदान लिए, उनमें आग रखी और उन पर धूप डाली; फिर उन्होंने यहोवा के सामने अनधिकृत आग[a] अर्पित की, जिसकी उसने उन्हें आज्ञा नहीं दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पराई आग” या “विदेशी आग।” हिब्रू पद उस आग को दर्शाता है जो यहोवा द्वारा अनुमोदित नहीं थी, जैसा कि आगे का वाक्यांश स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ בְנֵי־אַהֲרֹן נָדָב וַאֲבִיהוּא
  choice: तब हारून के पुत्र नादाब और अबीहू ने ... लिए
  rationale: हिब्रू कथात्मक क्रम को स्वाभाविक हिन्दी में “तब” से व्यक्त किया गया है; नामों और पारिवारिक संबंध को सीधे रखा गया है।
- source_word: אִישׁ מַחְתָּתוֹ
  choice: अपने-अपने अंगारदान
  rationale: אִישׁ का यहाँ वितरणात्मक अर्थ “प्रत्येक” है। מַחְתָּה वेदी के अंगारे रखने का पात्र है; “अंगारदान” आधुनिक पाठक के लिए “धूपदान” से अधिक सटीक है, क्योंकि धूप बाद में उस पर रखी जाती है।
- source_word: וַיִּתְּנוּ בָהֵן אֵשׁ
  choice: उनमें आग रखी
  rationale: बहुवचन सर्वनाम בָהֵן को स्पष्ट रूप से बहुवचन “उनमें” से व्यक्त किया गया है, जो दोनों अंगारदानों की ओर संकेत करता है।
- source_word: וַיָּשִׂימוּ עָלֶיהָ קְטֹרֶת
  choice: उस पर धूप डाली
  rationale: एकवचन स्त्रीलिंग प्रत्यय को वितरणात्मक रूप में “उस पर” रखा गया है—अर्थात हर व्यक्ति ने अपने पात्र की आग पर धूप रखी। “धूप” קְטֹרֶת का सहज धार्मिक-सांस्कृतिक समतुल्य है।
- source_word: וַיַּקְרִבוּ לִפְנֵי יְהוָה
  choice: यहोवा के सामने ... अर्पित की
  rationale: קרב के हिफ़ील का याजकीय अर्थ “अर्पित करना” है। לִפְנֵי को “के सामने” और वाचा के नाम יהוה को “यहोवा” से व्यक्त किया गया है।
- source_word: אֵשׁ זָרָה
  choice: ऐसी आग ... जिसकी ... आज्ञा नहीं दी थी
  rationale: זָרָה का मूल भाव बाहरी/अपरिचित/अनधिकृत हो सकता है। मुख्य वाक्य में अगले व्याख्यात्मक उपवाक्य के साथ स्वाभाविक हिन्दी रखी गई है, जबकि वैकल्पिक शाब्दिक अर्थ फुटनोट में सुरक्षित हैं।
- source_word: אֲשֶׁר לֹא צִוָּה אֹתָם
  choice: जिसकी उसने उन्हें आज्ञा नहीं दी थी
  rationale: सापेक्ष उपवाक्य आग के अनुचित होने का कारण बताता है; אֹתָם के स्पष्ट बहुवचन कर्म “उन्हें” को बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के विशिष्ट वाचा-नाम को उपाधि “प्रभु” से प्रतिस्थापित नहीं किया गया। आधुनिक मानक हिन्दी में व्यापक रूप से पहचाना जाने वाला रूप “यहोवा” चुना गया है।
- issue: אֵשׁ זָרָה की व्याख्या
  choice: ऐसी आग जिसकी उसने उन्हें आज्ञा नहीं दी थी
  alternative: अनधिकृत आग; पराई आग; असामान्य आग
  rationale: अगला मूल-पाठीय उपवाक्य स्वयं अपराध का स्वरूप स्पष्ट करता है। अनुवाद उस स्पष्टीकरण को बनाए रखता है और זָרָה की संभावित शब्दगत व्यापकता को फुटनोट में सुरक्षित रखता है, बिना अपराध की कोई अतिरिक्त विधि गढ़े।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। “अपने-अपने” वितरणात्मक अर्थ को सहज बनाता है। “अंगारदान” याजकीय पात्र के कार्य को स्पष्ट करता है, और छोटे वाक्यों में विभाजन से लंबी हिब्रू शृंखला हिन्दी में पठनीय रहती है।
