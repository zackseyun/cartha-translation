    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ने यह सुना
  rationale: שׁמע का सामान्य काल-वाचक अर्थ यहाँ ‘सुनना’ है। पिछले पद में हारून की बात सुनने की कथा-क्रमिकता बनी रहती है और ‘समझा’ या ‘मान लिया’ जैसा अतिरिक्त निष्कर्ष नहीं जोड़ा जाता।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबिल परंपरा में इस इब्रानी नाम का प्रचलित रूप ‘मूसा’ है।
- source_word: וַיִּיטַב
  choice: अच्छा था
  rationale: יטב का अर्थ ‘अच्छा होना’ या ‘भला/मनभावन लगना’ हो सकता है। यह चयन मूल अभिव्यक्ति के मूल्यांकनात्मक अर्थ को बनाए रखता है।
- source_word: בְּעֵינָיו
  choice: उसकी दृष्टि में
  rationale: शाब्दिक बिंब ‘उसकी आँखों में’ है, पर आधुनिक हिन्दी में ‘उसकी दृष्टि में’ उसी इब्रानी मुहावरे को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
