source:
  edition: WLC
  text: וְ/אֵ֣ת שְׂעִ֣יר הַֽ/חַטָּ֗את דָּרֹ֥שׁ דָּרַ֛שׁ מֹשֶׁ֖ה וְ/הִנֵּ֣ה שֹׂרָ֑ף וַ֠/יִּקְצֹף עַל אֶלְעָזָ֤ר וְ/עַל אִֽיתָמָר֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/נּוֹתָרִ֖ם לֵ/אמֹֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/016.yaml
  text: Moses diligently searched for the goat of the sin offering[a], and behold, it had been burned up. So he was angry with Eleazar and with Ithamar, Aaron’s remaining sons, saying[c][b],
translation:
  language: hi
  text: मूसा ने पापबलि के बकरे को भली-भाँति खोजा[a], और देखा, वह जला हुआ था[b]। तब वह एलिआज़ार और ईतामार, हारून के बचे हुए पुत्रों[c], पर क्रोधित हुआ और कहने लगा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “खोजते हुए खोजा।” इब्रानी में अनन्त रूप और क्रिया की यह संरचना खोज पर विशेष बल देती है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “वह पूरी तरह जल चुका था” भी हो सकता है। इब्रानी रूप उस बकरे की मिली हुई जली अवस्था बताता है।
    reason: lexical_alternative
  - marker: c
    text: “हारून के बचे हुए पुत्र” एलिआज़ार और ईतामार हैं, जो नादाब और अबीहू की मृत्यु के बाद बचे थे (लैव्यव्यवस्था 10:1–2, 12)।
    reason: cross_reference
lexical_decisions:
- source_word: שְׂעִיר הַחַטָּאת
  choice: पापबलि का बकरा
  rationale: שְׂעִיר नर बकरे को और הַחַטָּאת यहाँ बलिदान की श्रेणी को सूचित करता है; यह पदबंध आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: דָּרֹשׁ דָּרַשׁ
  choice: बहुत ढूँढ़ा
  rationale: क्रिया के साथ infinitive absolute खोज की तीव्रता और तत्परता पर बल देता है; ‘बहुत ढूँढ़ा’ इस बल को सहज हिन्दी में व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: पर देखा कि
  rationale: הִנֵּה आकस्मिक खोज की ओर ध्यान खींचता है। ‘पर देखा कि’ कथानक में मिली हुई अप्रत्याशित स्थिति और विरोध को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: שֹׂרָף
  choice: जलाया जा चुका था
  rationale: निष्क्रिय कृदंत उस समय मिली जली हुई अवस्था बताता है; पूर्णतासूचक हिन्दी रूप पूर्व घटित परिणाम को स्पष्ट करता है, जबकि पूर्णतः भस्म होने को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: וַיִּקְצֹף
  choice: क्रोधित हुआ
  rationale: यह क्रिया रोष व्यक्त करती है; ‘क्रोधित हुआ’ गरिमापूर्ण और अनुपातपूर्ण है तथा तीव्रता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: הַנּוֹתָרִם
  choice: बचे हुए
  rationale: यह एलआज़ार और ईतामार को नादाब और अबीहू की मृत्यु के बाद शेष पुत्रों के रूप में पहचानता है; ‘बचे हुए’ स्पष्ट और प्रसंगानुकूल है।
- source_word: לֵאמֹר
  choice: कहने लगा,
  rationale: यह अगले पद में आने वाले कथन का परिचय देता है और हिन्दी में अधूरे उद्धरण की ओर स्वाभाविक संक्रमण बनाता है।
