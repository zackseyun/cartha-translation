id: LEV.10.9
reference: Leviticus 10:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יַ֣יִן וְ/שֵׁכָ֞ר אַל תֵּ֣שְׁתְּ אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִתָּ֗/ךְ בְּ/בֹאֲ/כֶ֛ם אֶל אֹ֥הֶל מוֹעֵ֖ד וְ/לֹ֣א תָמֻ֑תוּ חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/010/009.yaml
  text: You and your sons with you shall not drink wine or strong drink when you enter the tent of meeting[a], lest you die[c][b]. It is a permanent statute throughout your generations.
translation:
  language: hi
  text: तुम और तुम्हारे पुत्र, जब मिलाप के तंबू में प्रवेश करो, तब दाखमधु या मादक पेय न पीना, ताकि तुम न मरो[a]। यह तुम्हारी पीढ़ियों तक सदा की विधि है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और तुम न मरोगे।” संदर्भ में यह निषेध के उल्लंघन के घातक परिणाम की चेतावनी है।
    reason: इब्रानी वְלֹא תָמֻתוּ की समन्वित बनावट और संदर्भगत चेतावनी—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: יַיִן
  choice: दाखमधु
  rationale: यह अंगूर से बने मद्य के लिए सामान्य इब्रानी शब्द है; ‘दाखमधु’ हिंदी में इसका स्पष्ट और पारंपरिक अर्थ देता है।
- source_word: שֵׁכָר
  choice: कोई अन्य मादक पेय
  rationale: यह दाखमधु से भिन्न नशीले मद्य के लिए व्यापक शब्द है। ‘कोई अन्य मादक पेय’ इसके दायरे को बनाए रखता है और किसी एक पेय, जैसे बीयर, तक सीमित नहीं करता।
- source_word: אַל תֵּשְׁתְּ
  choice: न पीना
  rationale: אַל के साथ क्रियारूप स्पष्ट निषेध व्यक्त करता है। ‘न पीना’ हिंदी में आदेश की दृढ़ता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אַתָּה וּבָנֶיךָ אִתָּךְ
  choice: तुम और तुम्हारे साथ तुम्हारे पुत्र
  rationale: इससे हारून और उसके साथ उसके पुत्रों—दोनों—का स्पष्ट उल्लेख तथा אִתָּךְ (‘तुम्हारे साथ’) का बल सुरक्षित रहता है।
- source_word: בְּבֹאֲכֶם אֶל אֹהֶל מוֹעֵד
  choice: जब ... मिलापवाले तंबू में प्रवेश करो
  rationale: בְּ के साथ क्रियार्थक संज्ञा प्रवेश के समय या परिस्थिति को दर्शाती है। यह वाक्यांश निषेध को तंबू में प्रवेश करने के प्रसंग से जोड़ता है।
- source_word: וְלֹא תָמֻתוּ
  choice: जिससे तुम मर न जाओ
  rationale: यह निषेध के उल्लंघन से जुड़ी मृत्यु की चेतावनी को उद्देश्य अथवा बचाए जाने वाले परिणाम के रूप में स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: חֻקַּת עוֹלָם
  choice: सदा की विधि
  rationale: यह स्थायी और निरंतर लागू रहने वाली धार्मिक-कानूनी व्यवस्था का सूत्रबद्ध वर्णन है।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-पीढ़ी के लिए
  rationale: यह आगामी पीढ़ियों में व्यवस्था की निरंतरता व्यक्त करने वाला प्रचलित वाचा-संबंधी वाक्यांश है।
theological_decisions:
- issue: मृत्यु-संबंधी उपवाक्य का बल
  choice: ‘जिससे तुम मर न जाओ’—निषेध से जुड़ी घातक परिणति की चेतावनी
  alternative: ‘और तुम नहीं मरोगे’ अथवा ‘कहीं ऐसा न हो कि तुम मर जाओ’
  rationale: इब्रानी וְלֹא תָמֻתוּ का रूप शाब्दिक रूप से समन्वित उपवाक्य है, पर संदर्भ में वह निषेध के उल्लंघन से बचाई जाने वाली मृत्यु बताता है। मुख्य पाठ स्वाभाविक हिंदी में यह संबंध रखता है; पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
- issue: निषेध का दायरा
  choice: निषेध मिलापवाले तंबू में प्रवेश करने के समय लागू है
  alternative: याजकों के लिए हर परिस्थिति में पूर्ण मद्यत्याग का आदेश
  rationale: בְּבֹאֲכֶם (‘जब तुम प्रवेश करो’) निषेध को स्पष्ट रूप से प्रवेश के प्रसंग से सीमित करता है। अनुवाद इससे अधिक व्यापक धार्मिक निष्कर्ष आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मिलापवाला तंबू’ परिचित बाइबलीय पद है। ‘कोई अन्य मादक पेय’ שֵׁכָר को किसी एक प्रकार के मद्य तक सीमित किए बिना साधारण पाठक के लिए स्पष्ट करता है।
