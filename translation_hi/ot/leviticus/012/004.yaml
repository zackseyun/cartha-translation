source:
  edition: WLC
  text: וּ/שְׁלֹשִׁ֥ים יוֹם֙ וּ/שְׁלֹ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב בִּ/דְמֵ֣י טָהֳרָ֑ה בְּ/כָל קֹ֣דֶשׁ לֹֽא תִגָּ֗ע וְ/אֶל הַ/מִּקְדָּשׁ֙ לֹ֣א תָבֹ֔א עַד מְלֹ֖את יְמֵ֥י טָהֳרָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/004.yaml
  text: Then she shall remain for thirty-three days in the blood of her purification. She shall not touch any holy thing[a], and she shall not come into the sanctuary, until the days of her purification are completed.
translation:
  language: hi
  text: फिर वह तैंतीस दिन तक शुद्धिकरण के रक्त में[a] रहेगी। वह किसी पवित्र वस्तु को न छुए और पवित्रस्थान में तब तक प्रवेश न करे, जब तक उसके शुद्धिकरण के दिन पूरे न हो जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “शुद्धिकरण के रक्तों/रक्त में” है। यह प्रसव के बाद रक्तस्राव से जुड़ी अनुष्ठानिक शुद्धि की अवधि को सूचित करता है।
    reason: मूल इब्रानी पदबंध की असामान्य बहुवचन-रचना और प्रसंगगत अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: וּ/שְׁלֹשִׁים יוֹם וּ/שְׁלֹשֶׁת יָמִים
  choice: तैंतीस दिन तक
  rationale: इब्रानी में शाब्दिक रूप से “तीस दिन और तीन दिन” है; आधुनिक हिन्दी में कुल अवधि को “तैंतीस दिन तक” कहना स्वाभाविक और सटीक है।
- source_word: תֵּשֵׁב
  choice: रहेगी
  rationale: यद्यपि मूल क्रिया का सामान्य अर्थ “बैठना/निवास करना” भी है, यहाँ वह निर्धारित अवधि तक एक अवस्था में बने रहने को व्यक्त करती है।
- source_word: בִּ/דְמֵי טָהֳרָה
  choice: शुद्धिकरण के रक्त में
  rationale: यह कठिन इब्रानी पदबंध प्रसवोत्तर रक्तस्राव से जुड़ी अनुष्ठानिक शुद्धि की अवधि बताता है। अनुवाद मूल की ठोस रक्त-संबंधी भाषा और उसकी असामान्यता को बनाए रखता है।
- source_word: בְּ/כָל קֹדֶשׁ
  choice: किसी पवित्र वस्तु को
  rationale: यह पदबंध व्यापक रूप से किसी भी पवित्र वस्तु अथवा पवित्र ठहराई गई चीज़ को सूचित करता है।
- source_word: לֹא תִגָּע
  choice: न छुए
  rationale: विधिक निषेध को आधुनिक और गरिमापूर्ण हिन्दी में सीधे व्यक्त किया गया है।
- source_word: וְ/אֶל הַ/מִּקְדָּשׁ לֹא תָבֹא
  choice: और पवित्रस्थान में ... प्रवेश न करे
  rationale: מִקְדָּשׁ उपासना के पवित्रस्थान को दर्शाता है; “प्रवेश न करे” इब्रानी के स्थानगत आशय को हिन्दी में स्वाभाविक रूप देता है।
- source_word: עַד מְלֹאת יְמֵי טָהֳרָהּ
  choice: जब तक उसके शुद्धिकरण के दिन पूरे न हो जाएँ
  rationale: यह निर्धारित शुद्धिकरण-अवधि की पूर्णता को दर्शाता है और स्त्रीलिंग प्रत्यय को “उसके” द्वारा स्पष्ट करता है।
theological_decisions:
- issue: अनुष्ठानिक शुद्धता की भाषा को नैतिक दोष समझने से बचाना
  choice: शुद्धिकरण
  alternative: शुद्धि / शुद्ध होने की अवधि
  rationale: यह प्रसंग प्रसव के बाद की अनुष्ठानिक स्थिति से संबंधित है, नैतिक पाप या व्यक्तिगत दोष से नहीं। “शुद्धिकरण” विधिक-उपासना संबंधी श्रेणी को बनाए रखता है।
- issue: “शुद्धिकरण के रक्त” की कठिन अभिव्यक्ति
  choice: मूल रूपक को मुख्य पाठ में बनाए रखना और पादटिप्पणी में समझाना
  alternative: प्रसवोत्तर रक्तस्राव की अवस्था में
  rationale: व्याख्यात्मक विकल्प अधिक सहज है, पर वह मूल की वास्तविक अस्पष्टता और ठोस भाषा को हल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक शैली रखी गई है। “पवित्रस्थान” लैव्यव्यवस्था के उपासना-संबंधी संदर्भ के लिए संक्षिप्त और परिचित शब्द है; वाक्यरचना साधारण पाठकों के लिए सहज रखी गई है।
