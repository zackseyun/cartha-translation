lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है। हिन्दी में इस प्रचलित दिव्य-वाणी सूत्र के लिए “फिर ... कहा” स्वाभाविक और सटीक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण “यहोवा” से व्यक्त किया गया है।
- source_word: אֶל
  choice: से
  rationale: דבר אל के साथ हिन्दी में बोलने के संबोधित व्यक्ति को स्वाभाविक रूप से “से” द्वारा व्यक्त किया जाता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस इब्रानी व्यक्तिगत नाम का मानक हिन्दी बाइबलीय रूप “मूसा” है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह रूप आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिन्दी में “कहा” यही कार्य स्वाभाविक ढंग से करता है; अलग से “यह कहते हुए” जोड़ना अनावश्यक रूप से कृत्रिम होता।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। उसे “प्रभु” जैसी उपाधि से प्रतिस्थापित नहीं किया गया; आधुनिक हिन्दी पाठकों में अधिक परिचित नाम-रूप “यहोवा” चुना गया है, जबकि प्राचीन उच्चारण पूरी निश्चितता से ज्ञात नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी वाक्य के “बोला ... यह कहते हुए” जैसे औपचारिक ढाँचे को हिन्दी के स्वाभाविक वाणी-सूत्र “ने ... से कहा” में व्यक्त किया गया है।
