source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אִשָּׁה֙ כִּ֣י תַזְרִ֔יעַ וְ/יָלְדָ֖ה זָכָ֑ר וְ/טָֽמְאָה֙ שִׁבְעַ֣ת יָמִ֔ים כִּ/ימֵ֛י נִדַּ֥ת דְּוֺתָ֖/הּ תִּטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a woman conceives and gives birth to a male child, then she shall be unclean seven days[c][b]; she shall be unclean as in the days of her menstrual impurity.'
translation:
  language: hi
  text: इस्राएलियों से कहो, “यदि कोई स्त्री गर्भ धारण करे और लड़के को जन्म दे, तो वह सात दिन तक अशुद्ध रहेगी; अपनी मासिक धर्म की अशुद्धता के दिनों के समान वह अशुद्ध रहेगी।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘अशुद्ध’ से धार्मिक-अनुष्ठानिक अशुद्धता की स्थिति अभिप्रेत है, न कि नैतिक दोष या गन्दगी।
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह प्रचलित राष्ट्रीय-सामुदायिक संबोधन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; सन्दर्भ में यह केवल पुरुष वंशजों तक सीमित नहीं है।
- source_word: אִשָּׁה כִּי תַזְרִיעַ
  choice: यदि कोई स्त्री गर्भवती हो
  rationale: कानूनी प्रसंग में כִּי को शर्तसूचक ‘यदि’ और idiomatic תַזְרִיעַ को ‘गर्भवती हो’ कहना स्पष्ट तथा स्वाभाविक है; ‘जब’ भी सम्भव है।
- source_word: וְיָלְדָה זָכָר
  choice: लड़के को जन्म दे
  rationale: यह जन्म लेने वाले शिशु के पुरुष होने को साफ़ और सामान्य हिन्दी में व्यक्त करता है।
- source_word: וְטָמְאָה שִׁבְעַת יָמִים
  choice: तो वह सात दिन तक अशुद्ध रहेगी
  rationale: विधिक परिणाम और अवधि दोनों सुरक्षित रहते हैं; ‘अशुद्ध’ मूल טמא को बिना अतिरिक्त व्याख्यात्मक विशेषण के दर्शाता है।
- source_word: כִּימֵי נִדַּת דְּוֺתָהּ תִּטְמָא
  choice: जैसे वह अपने मासिक धर्म के दिनों में अशुद्ध रहती है, वैसे ही वह अशुद्ध रहेगी
  rationale: तुलना और अन्त में दोहराए गए अशुद्धता-विधान को बनाए रखते हुए נִדָּה/דְּוֺתָהּ का मासिक धर्म सम्बन्धी आशय स्पष्ट किया गया है।
theological_decisions:
- issue: טמא की अशुद्धता का स्वरूप
  choice: अशुद्ध
  alternative: अनुष्ठानिक रूप से अशुद्ध
  rationale: लैव्यव्यवस्था के प्रसंग में यह धार्मिक-अनुष्ठानिक शुद्धता की स्थिति है, पर मूल क्रिया स्वयं केवल ‘अशुद्ध होना’ कहती है; इसलिए मुख्य पाठ में अतिरिक्त व्याख्यात्मक शब्द नहीं जोड़ा गया।
- issue: בְּנֵי יִשְׂרָאֵל का हिन्दी रूप
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यह इब्रानी का राष्ट्रीय-सामुदायिक पद है। आधुनिक हिन्दी में ‘इस्राएली’ पूरे समुदाय के लिए स्वाभाविक है और मूल संबोधन के आशय को अनावश्यक पुरुष-सीमा दिए बिना व्यक्त करता है।
- issue: कानूनी כִּי का मूल्य
  choice: यदि
  alternative: जब
  rationale: यहाँ पद एक संभावित मामले का विधान प्रस्तुत करता है; ‘यदि’ उस विधिक संरचना को बनाए रखता है, जबकि ‘जब’ भी प्रसंगानुसार सम्भव है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। विधिक शैली के लिए ‘यदि…तो’ संरचना अपनाई गई है। मूल में अशुद्ध होने की बात दो बार आती है, इसलिए हिन्दी में भी उसका पुनरुक्त विधान सुरक्षित रखा गया है।
