source:
  edition: WLC
  text: וְ/אִם לֹ֨א תִמְצָ֣א יָדָ/הּ֮ דֵּ֣י שֶׂה֒ וְ/לָקְחָ֣ה שְׁתֵּֽי תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֶחָ֥ד לְ/עֹלָ֖ה וְ/אֶחָ֣ד לְ/חַטָּ֑את וְ/כִפֶּ֥ר עָלֶ֛י/הָ הַ/כֹּהֵ֖ן וְ/טָהֵֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/008.yaml
  text: But if she cannot afford a lamb[a], then she shall take two turtledoves or two young pigeons, one for a burnt offering and one for a sin offering; and the priest shall make atonement for her, and she shall be clean.
translation:
  language: hi
  text: परन्तु यदि वह मेम्ने का खर्च न उठा सके, तो वह दो फाख्ते या कबूतर के दो बच्चे ले—एक होमबलि के लिए और एक पापबलि[a] के लिए। याजक उसके लिए प्रायश्चित करे, और वह शुद्ध हो जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धि-बलि”; इस प्रसंग में यह बलि प्रसव के बाद की अनुष्ठानिक अशुद्धता से सम्बन्धित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִמְצָא יָדָהּ דֵּי שֶׂה
  choice: वह मेम्ने का खर्च न उठा सके
  rationale: इब्रानी मुहावरे का आशय पर्याप्त आर्थिक साधन न होना है; यह अभिव्यक्ति आधुनिक हिन्दी में उसी अर्थ को सहज और स्पष्ट रूप से बताती है।
- source_word: שֶׂה
  choice: मेम्ना
  rationale: पिछले पद के बलिदानी संदर्भ में यह छोटे पशु, विशेषतः मेम्ने, को सूचित करता है; हिन्दी में 'मेम्ना' स्वाभाविक और पर्याप्त रूप से विशिष्ट है।
- source_word: שְׁתֵּי תֹרִים
  choice: दो पंडुक
  rationale: תֹרִים सामान्य कबूतर नहीं, विशेष रूप से turtledoves को दर्शाता है; 'पंडुक' हिन्दी में इस पक्षी का सटीक नाम है।
- source_word: שְׁנֵי בְּנֵי יוֹנָה
  choice: कबूतर के दो बच्चे
  rationale: शाब्दिक रूप से 'कबूतर के बच्चे'; यह स्पष्ट, स्वाभाविक और स्रोत के वचन-विन्यास के निकट है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह पूर्णतः जलाए जाने वाले बलिदान का स्थापित हिन्दी बाइबलीय पद है।
- source_word: חַטָּאת
  choice: पापबलि
  rationale: मुख्य पाठ में पारंपरिक और सुसंगत बलिदानी पद रखा गया है; प्रसवोत्तर विधिक शुद्धि के संदर्भ में 'शुद्धि-बलि' की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וְכִפֶּר עָלֶיהָ
  choice: याजक उसके लिए प्रायश्चित करे
  rationale: यह כפר की याजकीय-बलिदानी शक्ति को बनाए रखता है और क्रिया की विधि को आवश्यकता से अधिक परिभाषित नहीं करता।
- source_word: וְטָהֵרָה
  choice: वह शुद्ध हो जाएगी
  rationale: क्रिया विधिक अशुद्धता से शुद्ध अवस्था में आने को दर्शाती है; हिन्दी रूप परिणामी अवस्था को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: प्रसवोत्तर शुद्धि के संदर्भ में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धि-बलि
  rationale: इब्रानी पद का सामान्य और पारंपरिक अनुवाद 'पापबलि' है, पर यहाँ प्रसंग नैतिक अपराध के बजाय विधिक अशुद्धता का है। इसलिए मुख्य पाठ में पद-संगति रखी गई है और प्रसंगानुकूल वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। स्थापित बलिदानी शब्दावली—'होमबलि', 'पापबलि', 'प्रायश्चित'—को बनाए रखते हुए आर्थिक असमर्थता के मुहावरे को सहज हिन्दी में व्यक्त किया गया है।
