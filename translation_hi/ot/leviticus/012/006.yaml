  text: וּ/בִ/מְלֹ֣את יְמֵ֣י טָהֳרָ֗/הּ לְ/בֵן֮ א֣וֹ לְ/בַת֒ תָּבִ֞יא כֶּ֤בֶשׂ בֶּן שְׁנָת/וֹ֙ לְ/עֹלָ֔ה וּ/בֶן יוֹנָ֥ה אוֹ תֹ֖ר לְ/חַטָּ֑את אֶל פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד אֶל הַ/כֹּהֵֽן׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/006.yaml
  text: And when the days of her purification are completed[a], whether for a son or for a daughter, she shall bring a year-old lamb for a burnt offering, and a young pigeon or a turtledove for a sin offering, to the priest at the entrance of the tent of meeting.
translation:
  language: hi
  text: जब उसके शुद्धिकरण के दिन पूरे हो जाएँ—चाहे पुत्र के लिए हों या पुत्री के लिए—तब वह होमबलि के लिए एक वर्ष का मेमना और पापबलि[a] के लिए कबूतर का एक बच्चा या पंडुक, मिलापवाले तंबू के द्वार पर याजक को लाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुद्धिकरण-बलि।” यहाँ प्रयुक्त इब्रानी शब्द उस बलि को भी दर्शा सकता है जो अनुष्ठानिक अशुद्धता दूर करने के लिए चढ़ाई जाती थी; इसका अर्थ केवल नैतिक अपराध के लिए चढ़ाई गई बलि नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאת יְמֵי טָהֳרָהּ
  choice: जब उसके शुद्धिकरण के दिन पूरे हो जाएँ
  rationale: ב + מלא का infinitive construct समयावधि की समाप्ति बताता है; यह हिंदी में स्वाभाविक रहते हुए मूल का कालगत अर्थ सुरक्षित रखता है। טָהֳרָה यहाँ अनुष्ठानिक शुद्धता से संबंधित है।
- source_word: לְבֵן אוֹ לְבַת
  choice: चाहे पुत्र के लिए हों या पुत्री के लिए
  rationale: यह स्पष्ट करता है कि विधान पुत्र और पुत्री, दोनों के जन्म के प्रसंग में लागू है।
- source_word: תָּבִיא
  choice: वह ... लाए
  rationale: विधिक प्रसंग में हिफ़ील अपूर्ण क्रिया का निर्देशात्मक बल हिंदी के सम्मानपूर्ण विधिक रूप ‘लाए’ से व्यक्त होता है।
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: एक वर्ष का मेमना
  rationale: हिब्रू मुहावरा जीवन के पहले वर्ष के मेमने को सूचित करता है; यह संक्षिप्त और स्वाभाविक हिंदी रूप है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה का स्थापित बलिदानी पारिभाषिक रूप ‘होमबलि’ है।
- source_word: וּבֶן יוֹנָה אוֹ תֹר
  choice: कबूतर का एक बच्चा या पंडुक
  rationale: בֶּן־יוֹנָה कम उम्र के कबूतर को और תֹר विशेषतः पंडुक अथवा turtledove को दर्शाता है; दोनों का भेद बनाए रखा गया है।
- source_word: לְחַטָּאת
  choice: पापबलि[a] के लिए
  rationale: חַטָּאת का परंपरागत और पहचाना हुआ बलिदानी पद ‘पापबलि’ रखा गया है, जबकि इस शुद्धिकरण-संबंधी प्रसंग में संभव अर्थ ‘शुद्धिकरण-बलि’ पादटिप्पणी में सुरक्षित है।
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד אֶל הַכֹּהֵן
  choice: मिलापवाले तंबू के द्वार पर याजक के पास
  rationale: यह भेंट चढ़ाने का स्थान और उसे ग्रहण करने वाले याजक—दोनों को मूल क्रम के निकट रखते हुए स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: प्रसवोत्तर शुद्धिकरण के संदर्भ में חַטָּאת का अनुवाद
  choice: मुख्य पाठ में ‘पापबलि’, पादटिप्पणी में ‘शुद्धिकरण-बलि’
  alternative: मुख्य पाठ में ‘शुद्धिकरण-बलि’
  rationale: याजकीय बलिदानी भाषा में ‘पापबलि’ स्थापित पारिभाषिक अनुवाद है, पर यहाँ संस्कार अनुष्ठानिक अशुद्धता दूर करने से संबंधित है। पादटिप्पणी यह तनाव बनाए रखती है और यह अनुचित निष्कर्ष नहीं निकलने देती कि प्रसव स्वयं नैतिक पाप है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सुबोध विधिक-धार्मिक शैली अपनाई गई है। ‘होमबलि’, ‘पापबलि’, ‘मिलापवाला तंबू’ और ‘याजक’ जैसे स्थापित बाइबलीय पद बनाए गए हैं; ‘पंडुक’ पक्षी-भेद की सटीकता सुरक्षित रखता है।
