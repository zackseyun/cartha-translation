  text: וְ/אִם נְקֵבָ֣ה תֵלֵ֔ד וְ/טָמְאָ֥ה שְׁבֻעַ֖יִם כְּ/נִדָּתָ֑/הּ וְ/שִׁשִּׁ֥ים יוֹם֙ וְ/שֵׁ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב עַל דְּמֵ֥י טָהֳרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/005.yaml
  text: But if she gives birth to a female child[a], then she shall be unclean for two weeks, as in her menstruation[b]; and for sixty-six days she shall remain in the blood of purification.
translation:
  language: hi
  text: पर यदि वह लड़की को जन्म दे[a], तो वह दो सप्ताह तक अशुद्ध रहेगी, जैसे वह अपने मासिक धर्म के समय अशुद्ध रहती है; और छियासठ दिन तक वह शुद्धिकरण के रक्त की अवधि में रहेगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘स्त्री-लिंग की संतान’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘शुद्धिकरण के रक्त की अवधि’ प्रसव के बाद शुद्धिकरण के लिए निर्धारित समय को दर्शाती है; इसका अर्थ नैतिक दोष नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: पर यदि
  rationale: पिछले पद में पुत्र-जन्म के विधान के विपरीत स्थिति प्रस्तुत करता है; ‘पर यदि’ प्रसंगगत विरोध और शर्त दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְקֵבָה תֵלֵד
  choice: वह लड़की को जन्म दे
  rationale: נְקֵבָה का मूल अर्थ ‘स्त्री-लिंग/मादा’ है; मानव-जन्म के प्रसंग में ‘लड़की’ आधुनिक हिन्दी में स्वाभाविक है और ‘पुत्री’ की अपेक्षा मूल के लिंग-सूचक शब्द के निकट है।
- source_word: וְטָמְאָה
  choice: तो वह ... अशुद्ध रहेगी
  rationale: यह प्रसव के बाद की विधिक-अनुष्ठानिक स्थिति बताता है। ‘अशुद्ध’ पारंपरिक बाइबिलीय पद को बनाए रखता है, जबकि ‘रहेगी’ इस अवधि में स्थिति की निरंतरता व्यक्त करता है।
- source_word: שְׁבֻעַיִם
  choice: दो सप्ताह तक
  rationale: द्विवचन रूप इस प्रसंग में दो सप्ताह को दर्शाता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: כְּנִדָּתָהּ
  choice: जैसे अपने मासिक धर्म के समय रहती है
  rationale: נִדָּה मासिक धर्म से जुड़ी अवस्था या अवधि को सूचित करता है। यह अनुवाद तुलना स्पष्ट करता है, पर मुख्य पाठ में अनावश्यक तकनीकी भाषा नहीं जोड़ता।
- source_word: וְשִׁשִּׁים יוֹם וְשֵׁשֶׁת יָמִים
  choice: छियासठ दिन तक
  rationale: इब्रानी की ‘साठ दिन और छह दिन’ संख्या-रचना को स्वाभाविक हिन्दी संख्या में जोड़ा गया है, मात्रा ज्यों की त्यों रखते हुए।
- source_word: תֵּשֵׁב
  choice: वह ... रहेगी
  rationale: शाब्दिक अर्थ ‘बैठेगी/निवास करेगी’ है, किंतु इस विधिक मुहावरे में किसी अवस्था या निर्धारित अवधि में बने रहना अभिप्रेत है।
- source_word: דְּמֵי טָהֳרָה
  choice: शुद्धिकरण के रक्त की अवधि
  rationale: इब्रानी में शाब्दिक रूप ‘शुद्धिकरण के रक्तों’ है। ‘अवधि’ जोड़ने से प्रसंगगत मुहावरा हिन्दी में बोधगम्य होता है और इसे नैतिक दोष के बजाय प्रसवोत्तर शुद्धिकरण-काल के रूप में समझने में सहायता मिलती है।
theological_decisions:
- issue: लैव्यव्यवस्था में अशुद्धता की प्रकृति
  choice: ‘अशुद्ध’ शब्द रखते हुए इसे अनुष्ठानिक-विधिक स्थिति के रूप में समझना
  alternative: मुख्य पाठ में ‘अनुष्ठानिक रूप से अशुद्ध’ कहना
  rationale: טמא यहाँ व्यक्तिगत पाप या नैतिक कलंक नहीं, बल्कि उपासना-संबंधी विधिक स्थिति बताता है। मूल शब्द की पारदर्शिता के लिए ‘अशुद्ध’ रखा गया है; स्पष्टीकरण पादटिप्पणी में दिया गया है।
- issue: דְּמֵי טָהֳרָה का अर्थ
  choice: ‘शुद्धिकरण के रक्त की अवधि’
  alternative: ‘शुद्धिकरण का रक्त’ या ‘शुद्ध होने का समय’
  rationale: मूल की रक्त-संबंधी भाषा और निर्धारित अवधि—दोनों को बनाए रखने के लिए यह रूप चुना गया है। इससे नैतिक अपराध का अर्थ नहीं निकाला गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। कानूनी शैली के लिए भविष्यकालीन ‘रहेगी’ का प्रयोग किया गया है। ‘मासिक धर्म’ सामान्य आधुनिक हिन्दी है; ‘अशुद्ध’ मूल की विधिक शब्दावली को सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
