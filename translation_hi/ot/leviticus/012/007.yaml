id: LEV.12.7
reference: Leviticus 12:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִקְרִיב֞/וֹ לִ/פְנֵ֤י יְהוָה֙ וְ/כִפֶּ֣ר עָלֶ֔י/הָ וְ/טָהֲרָ֖ה מִ/מְּקֹ֣ר דָּמֶ֑י/הָ זֹ֤את תּוֹרַת֙ הַ/יֹּלֶ֔דֶת לַ/זָּכָ֖ר א֥וֹ לַ/נְּקֵבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/012/007.yaml
  text: And he shall present it before Yahweh and make atonement for her[a], and she shall be cleansed from the source of her blood. This is the law for the woman who gives birth, whether to a male or to a female.
translation:
  language: hi
  text: वह उसे याहवे के सामने अर्पित करेगा और उसके लिए प्रायश्चित करेगा; तब वह अपने रक्त के स्रोत से[a] शुद्ध हो जाएगी। जो स्त्री लड़के या लड़की को जन्म देती है, उसके लिए यही व्यवस्था है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “अपने रक्तस्राव से।” इब्रानी में शाब्दिक रूप से “अपने रक्त के स्रोत से” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיבוֹ
  choice: वह उसे अर्पित करेगा
  rationale: हिफ़ील रूप और एकवचन पुल्लिंग कर्म-प्रत्यय पिछले पद में बताई गई भेंट की ओर संकेत करते हैं। ‘अर्पित करेगा’ बलिदान-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: लִפְנֵי का अर्थ ‘के सामने/उपस्थिति में’ है और יְהוָה को उसके वाचा-नाम के लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: וְכִפֶּר עָלֶיהָ
  choice: उसके लिए प्रायश्चित करेगा
  rationale: याजकीय बलिदानी संदर्भ में כפר के लिए ‘प्रायश्चित करना’ सुलभ और स्थापित हिन्दी है; यह किसी विशिष्ट प्रायश्चित-सिद्धांत को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: וְטָהֲרָה
  choice: तब वह ... शुद्ध हो जाएगी
  rationale: क्रमसूचक वाव के साथ यह क्रिया याजक की कार्रवाई के परिणाम को बताती है। ‘शुद्ध हो जाएगी’ अनुष्ठानिक शुद्धता को दर्शाता है, न कि नैतिक दोष को।
- source_word: מִמְּקֹר דָּמֶיהָ
  choice: अपने रक्त के स्रोत से
  rationale: מָקוֹר का मूल अर्थ ‘स्रोत/सोता’ है। मुख्य पाठ इब्रानी बिंब को बनाए रखता है, जबकि पादटिप्पणी प्रसंगानुकूल ‘रक्तस्राव’ विकल्प देती है।
- source_word: זֹאת תּוֹרַת
  choice: यही व्यवस्था है
  rationale: इस लैव्यव्यवस्था-सूत्र में תּוֹרָה निर्धारित विधि या नियम को दर्शाता है। ‘व्यवस्था’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से औपचारिक है।
- source_word: הַיֹּלֶדֶת
  choice: जो स्त्री ... जन्म देती है
  rationale: कर्तृवाचक कृदन्त प्रसव करने वाली स्त्री को निर्दिष्ट करता है; अनुवाद उसके अर्थ को स्पष्ट और स्वाभाविक रूप में रखता है।
- source_word: לַזָּכָר אֹו לַנְּקֵבָה
  choice: लड़के या लड़की को
  rationale: इब्रानी में शाब्दिक शब्द ‘नर या मादा’ हैं, पर मानव शिशुओं के लिए ‘लड़का या लड़की’ आधुनिक हिन्दी में स्वाभाविक है और मूल भेद को ठीक बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: प्रसवोत्तर शुद्धि की प्रकृति
  choice: शुद्ध हो जाएगी
  alternative: पवित्र हो जाएगी; क्षमा पा जाएगी
  rationale: טהר यहाँ लैव्यव्यवस्था की अनुष्ठानिक शुद्धता की श्रेणी से संबंधित है। ‘शुद्ध’ मूल तनाव को बनाए रखता है और इसे नैतिक पाप या क्षमा की भाषा में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। विधिक-याजकीय भाव के लिए भविष्यत्/निर्देशात्मक क्रियारूप और ‘प्रायश्चित’, ‘शुद्ध’, ‘व्यवस्था’ जैसे परिचित बाइबिलीय पद प्रयुक्त हैं।
