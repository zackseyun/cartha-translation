  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹֽנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם כִּֽי לָכַ֨ד יְהוֹשֻׁ֣עַ אֶת הָ/עַי֮ וַ/יַּחֲרִימָ/הּ֒ כַּ/אֲשֶׁ֨ר עָשָׂ֤ה לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ כֵּן עָשָׂ֥ה לָ/עַ֖י וּ/לְ/מַלְכָּ֑/הּ וְ/כִ֨י הִשְׁלִ֜ימוּ יֹשְׁבֵ֤י גִבְעוֹן֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽהְי֖וּ בְּ/קִרְבָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/001.yaml
  text: It happened[a], when Adoni-zedek king of Jerusalem heard that Joshua had captured Ai and had devoted it to destruction, just as he had done to Jericho and its king, so he had done to Ai and its king, and that the inhabitants of Gibeon had made peace with Israel and were among them[b],
translation:
  language: hi
  text: ऐसा हुआ कि जब यरूशलेम के राजा अदोनी-सेदेक ने सुना कि यहोशू ने ऐ को जीत लिया और उसे विनाश के लिए समर्पित कर दिया था[a]—जैसा उसने यरीहो और उसके राजा के साथ किया था, वैसा ही उसने ऐ और उसके राजा के साथ भी किया था—और यह कि गिबोन के निवासियों ने इस्राएल के साथ शांति कर ली थी[b] और उनके बीच थे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे पूरी तरह नष्ट कर दिया था।” इब्रानी में यहाँ חרם शब्दावली है, जिसका अर्थ किसी वस्तु या व्यक्ति को विनाश के लिए अलग ठहराना या समर्पित करना है।
    reason: lexical_alternative
  - marker: b
    text: या “इस्राएल के साथ शांति की शर्तें तय कर ली थीं।”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: ऐसा हुआ कि जब ... ने सुना
  rationale: वाक्यांश नए कथात्मक प्रसंग और समयवाचक परिस्थिति को प्रस्तुत करता है। यह हिन्दी रूप पद 2 में पूरी होने वाली अधूरी वाक्य-संरचना को बनाए रखता है।
- source_word: אֲדֹנִי צֶדֶק
  choice: अदोनी-सेदेक
  rationale: व्यक्तिनाम का निकट देवनागरी लिप्यंतरण; यौगिक रूप स्पष्ट रखने के लिए योजक चिह्न रखा गया है।
- source_word: לָכַד
  choice: जीत लिया
  rationale: नगर को सैन्य बल से अधिकार में लेने का स्वाभाविक और स्पष्ट आधुनिक हिन्दी रूप।
- source_word: וַיַּחֲרִימָהּ
  choice: उसे सर्वनाश के लिए अर्पित कर दिया था
  rationale: हिफ़िल חרם में केवल नष्ट करने से बढ़कर विनाश के लिए अलग या समर्पित करने का धार्मिक-न्यायिक भाव है; यह रूप उस विशेष अर्थ को बनाए रखता है।
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: जैसा ... वैसा ही
  rationale: मूल की तुलनात्मक और समानांतर संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: עָשָׂה לְ
  choice: के साथ किया
  rationale: नगर और राजा के प्रति किए गए व्यवहार को व्यक्त करता है तथा मूल में क्रिया की पुनरावृत्ति बनाए रखता है।
- source_word: הִשְׁלִימוּ ... אֶת
  choice: के साथ शांति कर ली थी
  rationale: यहाँ क्रिया शांतिपूर्ण संबंध या समझौता स्थापित करने को दर्शाती है; चुना हुआ रूप सामान्य पाठक के लिए सहज है।
- source_word: וַיִּהְיוּ בְּקִרְבָּם
  choice: और उनके बीच थे
  rationale: इस्राएलियों के मध्य होने की स्थिति को बिना अतिरिक्त निवास या समावेशन का अर्थ जोड़े सीधे व्यक्त करता है।
theological_decisions:
- issue: विजय-वर्णन में חרם का अनुवाद
  choice: सर्वनाश के लिए अर्पित कर दिया था
  alternative: पूरी तरह नष्ट कर दिया था
  rationale: मूल शब्द में पूर्ण विनाश के साथ किसी वस्तु या समुदाय को विनाश के लिए अलग ठहराने का विशेष धार्मिक अर्थ भी है। मुख्य पाठ उस तनाव को बनाए रखता है, जबकि पादटिप्पणी सरल विकल्प बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। पद मूल की तरह अगले पद में पूरा होने वाला आश्रित वाक्य है, इसलिए अंत में अल्पविराम रखा गया है। नामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं; חרם की विशिष्टता को मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित रखा गया है।
