  yaml_path: translation/ot/joshua/010/023.yaml
  text: 'And they did so, and brought out to him from the cave these five kings: the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon.'
translation:
  language: hi
  text: 'उन्होंने वैसा ही किया और इन पाँच राजाओं को गुफा से निकालकर उसके पास ले आए: यरूशलेम के राजा को, हेब्रोन के राजा को, यर्मूत के राजा को, लाकीश के राजा को और एग्लोन के राजा को।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: उन्होंने वैसा ही किया
  rationale: यह आज्ञा के पालन को बताने वाली इब्रानी कथात्मक अभिव्यक्ति का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: וַיֹּצִיאוּ ... מִן הַמְּעָרָה
  choice: गुफा से निकालकर ... ले आए
  rationale: हिफ़ील क्रिया यहाँ भीतर से बाहर निकालने का भाव देती है; हिन्दी में संयुक्त क्रिया पूरी गति को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: אֵלָיו
  choice: उसके पास
  rationale: इब्रानी का सीधा अर्थ ‘उसकी ओर/उसके पास’ है। संदर्भ में सर्वनाम यहोशू के लिए है, पर मूल पाठ नाम को दोहराता नहीं, इसलिए सर्वनाम बनाए रखा गया है।
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: उन पाँचों राजाओं को
  rationale: पूर्व-संदर्भ में पहचाने जा चुके पाँच राजाओं के लिए हिन्दी में ‘उन पाँचों’ स्वाभाविक है और निश्चित पूरे समूह का भाव रखता है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: यह पद राजनीतिक शासक के लिए सामान्य और सटीक हिन्दी शब्द है।
- source_word: יְרוּשָׁלִַם / חֶבְרוֹן / יַרְמוּת / לָכִישׁ / עֶגְלוֹן
  choice: यरूशलेम / हेब्रोन / यर्मूत / लाकीश / एग्लोन
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित और स्रोत-नामों के निकट देवनागरी रूप अपनाए गए हैं।
