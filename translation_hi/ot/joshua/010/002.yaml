source:
  edition: WLC
  text: וַ/יִּֽירְא֣וּ מְאֹ֔ד כִּ֣י עִ֤יר גְּדוֹלָה֙ גִּבְע֔וֹן כְּ/אַחַ֖ת עָרֵ֣י הַ/מַּמְלָכָ֑ה וְ/כִ֨י הִ֤יא גְדוֹלָה֙ מִן הָ/עַ֔י וְ/כָל אֲנָשֶׁ֖י/הָ גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/002.yaml
  text: And they feared greatly[a], because Gibeon was a great city, like one of the royal cities, and because it was greater than Ai, and all its men were mighty.
translation:
  language: hi
  text: वे बहुत डर गए, क्योंकि गिबोन एक बड़ा नगर था, राज्य के नगरों में से एक के समान; और क्योंकि वह ऐ से बड़ा था और उसके सभी पुरुष वीर थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सभी पुरुष वीर योद्धा थे।”
    reason: גִּבֹּרִים का यहाँ स्पष्ट सैन्य अर्थ भी हो सकता है।
lexical_decisions:
- source_word: וַיִּירְאוּ מְאֹד
  choice: तब वे बहुत डर गए
  rationale: बहुवचन क्रिया और कथात्मक क्रम को बनाए रखते हुए ירא के भय-संबंधी अर्थ तथा מְאֹד की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עִיר גְּדוֹלָה
  choice: एक बड़ा नगर
  rationale: גָּדוֹל आकार और महत्त्व दोनों का संकेत दे सकता है; ‘बड़ा’ इस अर्थ-विस्तार को ‘विशाल’ या ‘महत्त्वपूर्ण’ की अपेक्षा अधिक खुला रखता है।
- source_word: גִּבְעוֹן
  choice: गिबोन
  rationale: इब्रानी स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: כְּאַחַת עָרֵי הַמַּמְלָכָה
  choice: राजनगरों में से एक के समान
  rationale: शाब्दिक ‘राज्य के नगरों में से एक’ के भाव को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है तथा नगर की राजकीय प्रतिष्ठा का संकेत बनाए रखता है।
- source_word: הִיא גְדוֹלָה מִן הָעַי
  choice: वह ऐ से बड़ा था
  rationale: स्त्रीलिंग सर्वनाम का संदर्भ नगर से है। ‘बड़ा’ पहले आए גָּדוֹל से शब्दगत संबंध और आकार/महत्त्व की संभावित द्विअर्थता दोनों बनाए रखता है। हिन्दी में ‘नगर’ पुल्लिंग होने के कारण ‘था’ प्रयुक्त है।
- source_word: וְכָל אֲנָשֶׁיהָ
  choice: और उसके सभी पुरुष
  rationale: सैन्य प्रसंग में אֲנָשִׁים नगर के पुरुषों, विशेषतः युद्ध करने योग्य पुरुषों, को सूचित करता है; इसे सामान्य ‘लोग’ कहकर व्यापक नहीं किया गया।
- source_word: גִּבֹּרִים
  choice: वीर
  rationale: यह शब्द बलवान अथवा पराक्रमी पुरुषों और योद्धाओं को सूचित कर सकता है। ‘वीर’ मुख्य पाठ में संक्षिप्त और स्वाभाविक है; स्पष्ट सैन्य अर्थ पादटिप्पणी में रखा गया है।
