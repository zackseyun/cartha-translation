base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/041.yaml
  text: And Joshua struck them from Kadesh-barnea as far as Gaza[a], and all the land of Goshen, as far as Gibeon.
translation:
  language: hi
  text: और यहोशू ने कादेश-बर्ने से गाज़ा तक, और गोशेन के सारे देश में गिबोन तक, उन पर प्रहार किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें पराजित किया” अथवा “उन्हें मार गिराया।” हिब्रू क्रिया सैन्य प्रहार या पराजय बता सकती है और हर बार प्रहार के ठीक स्वरूप को स्पष्ट नहीं करती।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: उन्हें पराजित किया
  rationale: נכה का यह रूप सैन्य प्रहार या पराजय को व्यक्त करता है, पर अपने-आप में मारे जाने का ढंग या प्रत्येक व्यक्ति की मृत्यु निश्चित नहीं करता। आधुनिक हिन्दी में ‘पराजित किया’ प्रसंग को स्वाभाविक और स्पष्ट रखता है।
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: कादेश-बर्ने से
  rationale: यह अभियान की दक्षिणी सीमा बताने वाला स्थान-नाम है; हिन्दी लिप्यंतरण में संयुक्त नाम को योजक-चिह्न के साथ रखा गया है।
- source_word: וְעַד עַזָּה
  choice: लेकर गाज़ा तक
  rationale: עַד भौगोलिक विस्तार की सीमा व्यक्त करता है; ‘से लेकर ... तक’ हिन्दी में उसी सीमा-विन्यास को स्वाभाविक रूप से प्रकट करता है।
- source_word: וְאֵת כָּל אֶרֶץ גֹּשֶׁן
  choice: और गोशेन के सारे प्रदेश को
  rationale: אֵת अतिरिक्त प्रत्यक्ष कर्म को प्रस्तुत करता है। ‘सारे प्रदेश’ אֶרֶץ के क्षेत्रीय अर्थ को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: וְעַד גִּבְעוֹן
  choice: गिबोन तक
  rationale: עַד यहाँ भी विजय के भौगोलिक विस्तार की सीमा बताता है।
- source_word: וְאֵת ... וְעַד
  choice: और ... को ... तक जीत लिया
  rationale: हिब्रू में आरंभिक क्रिया बाद के दूसरे कर्म पर भी लागू होती है। हिन्दी में ‘जीत लिया’ दोहराने से वाक्य स्वाभाविक होता है और सैन्य विजय का आशय स्पष्ट रहता है, बिना नई घटना जोड़े।
