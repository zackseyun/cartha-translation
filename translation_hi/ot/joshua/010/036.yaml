lexical_decisions:
- source_word: וַיַּעַל
  choice: चढ़ गए
  rationale: עלה यहाँ एक स्थान से दूसरे, ऊँचे स्थान की ओर जाने को व्यक्त करता है; ‘चढ़ गए’ दिशात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְכָל יִשְׂרָאֵל
  choice: और उसके साथ सारा इस्राएल
  rationale: यह इस्राएल की सामूहिक युद्ध-सेना के लिए प्रयुक्त पारंपरिक सामूहिक अभिव्यक्ति है; ‘सारा इस्राएल’ मूल का रूप और भाव दोनों बनाए रखता है।
- source_word: מֵעֶגְלוֹנָה חֶבְרוֹנָה
  choice: एग्लोन से हेब्रोन को
  rationale: מִן स्रोत को और स्थाननाम पर लगा दिशासूचक ה हेब्रोन की ओर गति को दर्शाता है।
- source_word: וַיִּלָּחֲמוּ
  choice: युद्ध किया
  rationale: לחם का निफ़अल रूप यहाँ युद्ध में भिड़ने का अर्थ देता है; ‘युद्ध किया’ वर्तमान मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: עָלֶיהָ
  choice: उसके विरुद्ध
  rationale: עַל विरोध का भाव देता है और स्त्रीलिंग एकवचन प्रत्यय हेब्रोन नगर की ओर संकेत करता है।
