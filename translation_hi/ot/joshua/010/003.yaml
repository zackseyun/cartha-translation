  text: וַ/יִּשְׁלַ֨ח אֲדֹנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם אֶל הוֹהָ֣ם מֶֽלֶךְ חֶ֠בְרוֹן וְ/אֶל פִּרְאָ֨ם מֶֽלֶךְ יַרְמ֜וּת וְ/אֶל יָפִ֧יעַ מֶֽלֶךְ לָכִ֛ישׁ וְ/אֶל דְּבִ֥יר מֶֽלֶךְ עֶגְל֖וֹן לֵ/אמֹֽר־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/003.yaml
  text: So Adoni-zedek king of Jerusalem sent to Hoham king of Hebron, to Piram king of Jarmuth, to Japhia king of Lachish, and to Debir king of Eglon, saying,
translation:
  language: hi
  text: 'तब यरूशलेम के राजा अदोनी-सेदेक ने हेब्रोन के राजा होहाम, यर्मूत के राजा पिराम, लाकीश के राजा यापी और एग्लोन के राजा दबीर के पास यह संदेश भेजा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब ... यह संदेश भेजा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है। שׁלח का सामान्य अर्थ ‘भेजना’ है; हिंदी में प्राप्तकर्ताओं और לֵאמֹר के साथ ‘यह संदेश भेजा’ स्वाभाविक और स्पष्ट है।
- source_word: אֲדֹנִי צֶדֶק
  choice: अदोनी-सेदेक
  rationale: व्यक्तिवाचक नाम का अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है; योजक चिह्न संयुक्त नाम की संरचना दिखाता है।
- source_word: מֶלֶךְ יְרוּשָׁלִַם
  choice: यरूशलेम के राजा
  rationale: इब्रानी संबंधसूचक संरचना को स्वाभाविक हिंदी ‘के राजा’ में व्यक्त किया गया है।
- source_word: אֶל
  choice: के पास
  rationale: यह पूर्वसर्ग संदेश पाने वालों को चिह्नित करता है; ‘संदेश भेजा’ के साथ ‘के पास’ सहज आधुनिक हिंदी है।
- source_word: הוֹהָם
  choice: होहाम
  rationale: व्यक्तिवाचक नाम का स्रोतानुसार देवनागरी लिप्यंतरण।
- source_word: חֶבְרוֹן
  choice: हेब्रोन
  rationale: स्थान-नाम का प्रचलित हिंदी बाइबलीय रूप।
- source_word: פִּרְאָם
  choice: पिराम
  rationale: व्यक्तिवाचक नाम का स्रोतानुसार देवनागरी लिप्यंतरण।
- source_word: יַרְמוּת
  choice: यर्मूत
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण, जिसमें मूल उच्चारण की निकटता रखी गई है।
- source_word: יָפִיעַ
  choice: यापी
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: לָכִישׁ
  choice: लाकीश
  rationale: स्थान-नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: דְּבִיר
  choice: दबीर
  rationale: संदर्भ में यह राजा का व्यक्तिवाचक नाम है, इसलिए सामान्य संज्ञा के रूप में अनुवाद न करके लिप्यंतरित किया गया है।
- source_word: עֶגְלוֹן
  choice: एग्लोन
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण।
- source_word: לֵאמֹר
  choice: 'यह संदेश ... :'
  rationale: इब्रानी उद्धरण-प्रस्तावना ‘कहते हुए’ को हिंदी कथन-शैली में ‘यह संदेश भेजा:’ के रूप में स्वाभाविक ढंग से व्यक्त किया गया है; आगे आने वाले कथन के लिए द्विबिंदु रखा गया है।
