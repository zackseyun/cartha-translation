  text: וְ/אֶת מַקֵּדָה֩ לָכַ֨ד יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יַּכֶּ֣/הָ לְ/פִי חֶרֶב֮ וְ/אֶת מַלְכָּ/הּ֒ הֶחֱרִ֣ם אוֹתָ֗/ם וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וַ/יַּ֨עַשׂ֙ לְ/מֶ֣לֶךְ מַקֵּדָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/028.yaml
  text: And Joshua captured Makkedah on that day and struck it with the edge of the sword[a], and he devoted to destruction its king and every person in it; he left no survivor. And he did to the king of Makkedah just as he had done to the king of Jericho.
translation:
  language: hi
  text: उसी दिन यहोशू ने मक्केदा पर अधिकार कर लिया और तलवार की धार से उस पर प्रहार किया। उसने उसके राजा और उसमें के हर व्यक्ति को विनाश के लिए समर्पित कर दिया[a]; उसने कोई जीवित बचा हुआ नहीं छोड़ा। उसने मक्केदा के राजा के साथ वैसा ही किया जैसा उसने यरीहो के राजा के साथ किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरी तरह नष्ट कर दिया”; इब्रानी क्रिया का अर्थ किसी वस्तु या व्यक्ति को विनाश के लिए प्रतिबंध के अधीन समर्पित करना है।
    reason: חרם के विशेष धार्मिक-सैनिक अर्थ तथा उसके अधिक सामान्य अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: לָכַד
  choice: अधिकार कर लिया
  rationale: नगर को सैन्य रूप से अपने कब्ज़े में लेने का सामान्य अर्थ; आधुनिक हिन्दी में स्वाभाविक और स्पष्ट।
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: उसे तलवार की धार से मार डाला
  rationale: नכה की आघात/संहार संबंधी ठोस क्रिया और ‘तलवार के मुँह/धार’ की इब्रानी छवि दोनों को बनाए रखता है।
- source_word: הֶחֱרִם
  choice: विनाश के लिए अर्पित कर दिया
  rationale: हिफ़ील रूप यहाँ केवल नष्ट करने से अधिक, किसी को חרם के अधीन विनाश हेतु समर्पित करने का धार्मिक-सैनिक भाव रखता है।
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: उसमें रहनेवाले हर व्यक्ति
  rationale: נפש यहाँ अमूर्त ‘आत्मा’ नहीं, जीवित व्यक्ति को सूचित करता है; हिन्दी में आशय स्पष्ट रहता है।
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: किसी भी जीवित बचे व्यक्ति को नहीं छोड़ा
  rationale: שָׂרִיד का अर्थ जीवित बचा हुआ व्यक्ति है; अभिव्यक्ति सहज हिन्दी में पूर्ण निषेध व्यक्त करती है।
- source_word: וַיַּעַשׂ לְמֶלֶךְ מַקֵּדָה כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: उसने मक्केदा के राजा के साथ वैसा ही किया जैसा उसने यरीहो के राजा के साथ किया था
  rationale: इब्रानी की जानबूझकर संक्षिप्त तुलना को बिना घटना का अतिरिक्त विवरण जोड़े सुरक्षित रखता है।
- source_word: מַקֵּדָה / יְרִיחוֹ / יְהוֹשֻׁעַ
  choice: मक्केदा / यरीहो / यहोशू
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और मूल उच्चारण के निकट नाम-रूप।
theological_decisions:
- issue: विजय-वृत्तांत में חרם का अनुवाद
  choice: विनाश के लिए अर्पित कर दिया
  alternative: पूरी तरह नष्ट कर दिया; विनाश के प्रतिबंध के अधीन कर दिया
  rationale: यह क्रिया साधारण हत्या या विनाश से अधिक धार्मिक प्रतिबंध के अंतर्गत विनाश हेतु समर्पण का भाव रखती है। मुख्य पाठ में इस तनाव को बचाया गया है और पादटिप्पणी में संक्षिप्त विकल्प दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। हिंसक वर्णन को न नरम किया गया है, न विस्तार देकर तीखा; मूल की संक्षिप्तता और חרם की धार्मिक अस्पष्टता सुरक्षित रखी गई है।
