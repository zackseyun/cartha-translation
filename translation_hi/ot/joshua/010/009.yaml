lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: उन पर आ पहुँचा
  rationale: בוא का मूल अर्थ ‘आना/पहुँचना’ और אֶל का अर्थ ‘की ओर/के पास’ है। युद्ध के प्रसंग में ‘उन पर आ पहुँचा’ आकस्मिक शत्रुतापूर्ण पहुँच को स्वाभाविक हिन्दी में व्यक्त करता है, पर आक्रमण आरम्भ होने की बात पाठ में नहीं जोड़ता।
- source_word: פִּתְאֹם
  choice: अचानक
  rationale: यह क्रियाविशेषण घटना की आकस्मिकता अथवा अप्रत्याशितता बताता है; ‘अचानक’ इसका सीधा और सहज हिन्दी समतुल्य है।
- source_word: כָּל הַלַּיְלָה
  choice: रात-भर
  rationale: यह पूरी रात की अवधि दर्शाता है; ‘रात-भर’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: עָלָה
  choice: चढ़ाई करके
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है। गिलगाल से सेना की स्थलाकृतिक यात्रा के प्रसंग में ‘चढ़ाई करके’ ऊपर की ओर सैन्य बढ़त का भाव रखता है; इसे केवल युद्ध-संबंधी ‘चढ़ाई’ समझे जाने की सम्भावना के कारण शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: מִן הַגִּלְגָּל
  choice: गिलगाल से
  rationale: स्रोत-स्थान को सीधे व्यक्त किया गया है और स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
