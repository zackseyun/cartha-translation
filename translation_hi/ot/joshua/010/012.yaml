  text: אָ֣ז יְדַבֵּ֤ר יְהוֹשֻׁעַ֙ לַֽ/יהוָ֔ה בְּ/י֗וֹם תֵּ֤ת יְהוָה֙ אֶת הָ֣/אֱמֹרִ֔י לִ/פְנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֣אמֶר לְ/עֵינֵ֣י יִשְׂרָאֵ֗ל שֶׁ֚מֶשׁ בְּ/גִבְע֣וֹן דּ֔וֹם וְ/יָרֵ֖חַ בְּ/עֵ֥מֶק אַיָּלֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/012.yaml
  text: Then Joshua spoke to Yahweh on the day when Yahweh gave the Amorites over before the sons of Israel[a], and he said in the sight of Israel, “Sun, stand still at Gibeon, and moon[c][b], in the Valley of Aijalon.”
translation:
  language: hi
  text: 'तब, जिस दिन याहवे ने अमोरियों को इस्राएल के पुत्रों के सामने सौंप दिया था,[a] उस दिन यहोशू ने याहवे से बात की। उसने इस्राएल के सामने कहा,


    “हे सूर्य, गिबोन में ठहर जा;[b]


    और हे चन्द्रमा,[c] अय्यालोन की घाटी में।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों के सामने।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों के सामने” है।
    reason: lexical_alternative
  - marker: b
    text: या “शान्त हो जा” अथवा “रुक जा।” इब्रानी क्रिया स्थिर हो जाने, चुप हो जाने या किसी क्रिया के रुक जाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में दूसरी पंक्ति शाब्दिक रूप से “और हे चन्द्रमा, अय्यालोन की घाटी में” है; पिछली पंक्ति की क्रिया “ठहर जा” यहाँ समझी जाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבֵּר
  choice: बात की
  rationale: पिएल रूप का सामान्य अर्थ ‘बोलना/बात करना’ है। ‘बात की’ अगले וַיֹּאמֶר (‘कहा’) से क्रियात्मक भेद बनाए रखता है और यह भी स्पष्ट करता है कि यहोशू यहोवा को संबोधित कर रहा था।
- source_word: לַיהוָה
  choice: यहोवा से
  rationale: ל उपसर्ग यहोशू के संबोधन का लक्ष्य बताता है। हिन्दी में ‘यहोवा से बात की’ स्वाभाविक है और इब्रानी व्यंजन-नाम יהוה को व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
- source_word: בְּיוֹם תֵּת יְהוָה
  choice: जिस दिन यहोवा ने … सौंप दिया था, उस दिन
  rationale: בְּיוֹם के साथ infinitive construct समयसूचक है। हिन्दी की सहसंबंधी रचना ‘जिस दिन … उस दिन’ मूल के स्पष्ट काल-संदर्भ को सहज रूप से व्यक्त करती है।
- source_word: הָאֱמֹרִי
  choice: अमोरियों
  rationale: रूप व्याकरणतः एकवचन है, पर यहाँ वह जाति के लिए समूहवाचक है; युद्ध के प्रसंग में हिन्दी बहुवचन अधिक स्पष्ट और स्वाभाविक है।
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के सामने
  rationale: 'यह मूल का निकट रूप है: ‘इस्राएल के पुत्रों के सामने।’ ‘सामने सौंप दिया’ पराजित शत्रु को उनके सम्मुख कर देने का भाव रखता है, जबकि अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।'
- source_word: וַיֹּאמֶר לְעֵינֵי יִשְׂרָאֵל
  choice: उसने इस्राएल के सामने कहा
  rationale: לְעֵינֵי का शाब्दिक भाव ‘आँखों के सामने’ और मुहावरेदार अर्थ सार्वजनिक उपस्थिति में है। हिन्दी में ‘इस्राएल के सामने’ संक्षिप्त, स्वाभाविक और अर्थसंगत है।
- source_word: שֶׁמֶשׁ ... דּוֹם
  choice: हे सूर्य, … ठहर जा
  rationale: דום स्थिर हो जाने, रुकने या शांत रहने का अर्थ दे सकता है। इस आकाशीय आज्ञा के प्रसंग में ‘ठहर जा’ गति रुकने का प्रमुख अर्थ व्यक्त करता है, पर अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: בְּגִבְעוֹן
  choice: गिबोन में
  rationale: בְּ का मूल स्थानवाचक अर्थ रखा गया है। ‘में’ सटीक स्थानिक संबंध को अनावश्यक रूप से ‘ऊपर’ जैसे अर्थ में सीमित नहीं करता।
- source_word: וְיָרֵחַ בְּעֵמֶק אַיָּלוֹן
  choice: और हे चन्द्रमा, अय्यालोन की घाटी में
  rationale: दूसरी काव्य-पंक्ति में क्रिया व्यक्त नहीं की गई; पहली पंक्ति का דּוֹם इसमें समझा जाता है। हिन्दी में भी इसी अपूर्ण समानांतरता को रखा गया है और पादटिप्पणी में आशय स्पष्ट किया गया है।
- source_word: אַיָּלוֹן
  choice: अय्यालोन
  rationale: यह इब्रानी स्थान-नाम का हिन्दी में उच्चारण-सन्निकट लिप्यंतरण है; योड के व्यंजनात्मक प्रभाव को ‘य्य’ से दिखाया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम יהוה दो बार स्पष्ट रूप से आया है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है; ‘याहवे’ एक अन्य सम्भव विद्वत्तापरक लिप्यंतरण है।
- issue: सूर्य और चन्द्रमा को दी गई आज्ञा का स्वरूप
  choice: काव्यात्मक प्रत्यक्ष संबोधन को यथावत रखा गया
  alternative: इसे खगोलीय घटना की व्याख्या के रूप में विस्तार देना
  rationale: पद स्वयं घटना की भौतिक प्रक्रिया नहीं समझाता, बल्कि यहोशू के सार्वजनिक काव्यात्मक शब्द देता है। इसलिए अनुवाद किसी विशेष खगोलीय या चमत्कार-संबंधी व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। गद्य-परिचय स्वाभाविक हिन्दी क्रम में है, जबकि प्रत्यक्ष वचन की काव्यात्मक समानांतरता और दूसरी पंक्ति की मूल क्रिया-विहीनता सुरक्षित रखी गई है। ‘चन्द्रमा’ औपचारिक किन्तु सामान्यतः बोधगम्य रूप है।
