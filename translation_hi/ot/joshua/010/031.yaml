base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/031.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Libnah to Lachish[b], and camped against it and fought against it.
translation:
  language: hi
  text: तब यहोशू अपने साथ सारे इस्राएल को लेकर लिब्ना से लाकीश गया[a]। उसने उसके विरुद्ध पड़ाव डाला[b] और उससे युद्ध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पार होकर गया” या “आगे गया।” यहाँ आशय एक नगर से दूसरे नगर तक सैन्य रूप से आगे बढ़ने से है।
    reason: lexical_alternative
  - marker: b
    text: या “उसके विरुद्ध डेरा डाला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: बढ़े
  rationale: עבר का मूल अर्थ ‘पार जाना/आगे जाना’ है। यहाँ किसी नदी को पार करने का उल्लेख नहीं, बल्कि सेना का एक नगर से दूसरे नगर की ओर आगे बढ़ना है; इसलिए ‘बढ़े’ स्वाभाविक और संदर्भानुकूल है।
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: और उसके साथ समस्त इस्राएल
  rationale: यह सामूहिक पद यहोशू के साथ चल रहे इस्राएली समुदाय अथवा सैन्य दल को दर्शाता है। ‘समस्त इस्राएल’ मूल की व्यापक सामूहिक अभिव्यक्ति बनाए रखता है।
- source_word: מִלִּבְנָה לָכִישָׁה
  choice: लिब्ना से लाकीश की ओर
  rationale: לָכִישָׁה में दिशासूचक ה गति को लाकीश की ओर दर्शाता है। ‘लाकीश की ओर’ इस रूप को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיִּחַן עָלֶיהָ
  choice: उन्होंने उसके सामने पड़ाव डाला
  rationale: חנה का अर्थ पड़ाव डालना है और עַל इस घेराबंदी-संदर्भ में नगर के सामने शत्रुतापूर्ण सैन्य स्थिति दर्शाता है। ‘उसके सामने पड़ाव डाला’ निकटता और आक्रमणकारी संदर्भ दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַיִּלָּחֶם בָּהּ
  choice: और उससे युद्ध किया
  rationale: Niphal रूप में לחם का अर्थ युद्ध करना है; בָּהּ यहाँ नगर को युद्ध का लक्ष्य बताता है। ‘उससे युद्ध किया’ मूल की संक्षिप्तता और विरोधी भाव बनाए रखता है।
