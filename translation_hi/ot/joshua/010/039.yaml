base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/039.yaml
  text: And they captured it[a], along with its king and all its towns, and struck them with the edge of the sword, and they devoted to destruction every person who was in it; they left no survivor. Just as he had done to Hebron, so he did to Debir and its king, and just as he had done to Libnah and its king.
translation:
  language: hi
  text: और उसने उस नगर को, उसके राजा और उसके सभी नगरों को अपने अधिकार में कर लिया। उन्होंने तलवार की धार से उन्हें मार डाला और उसमें रहने वाले हर व्यक्ति को विनाश के लिए समर्पित कर दिया[a]; उसने कोई जीवित बचा हुआ व्यक्ति नहीं छोड़ा। जैसा उसने हेब्रोन के साथ किया था, वैसा ही उसने दबीर और उसके राजा के साथ किया; और जैसा उसने लिब्ना और उसके राजा के साथ किया था, वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उन्हें पूरी तरह नष्ट कर दिया।” हिब्रू में यहाँ חרם से जुड़ी अभिव्यक्ति है, जिसका अर्थ किसी व्यक्ति या वस्तु को पूर्ण विनाश के लिए ठहराना या समर्पित करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: उन्होंने उस नगर को अपने अधिकार में कर लिया
  rationale: לכד का सैनिक प्रसंग में अर्थ पकड़ना या अधिकार में करना है। स्त्रीलिंग प्रत्यय दबीर नगर की ओर संकेत करता है। हिब्रू क्रिया व्याकरणतः एकवचन है, पर निकटवर्ती बहुवचन क्रियाएँ सामूहिक सैन्य कार्रवाई व्यक्त करती हैं; इसलिए हिन्दी में बहुवचन रखा गया और संदर्भ स्पष्ट करने के लिए ‘उस नगर’ कहा गया।
- source_word: כָּל עָרֶיהָ
  choice: उसके अधीन सभी नगरों
  rationale: עיר नगर या बस्ती हो सकता है। यहाँ दबीर मुख्य नगर है और बहुवचन उसके आश्रित नगरों को सूचित करता है, इसलिए ‘उसके अधीन सभी नगर’ अर्थ को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: तलवार की धार से उन्हें मार डाला
  rationale: לְפִי חֶרֶב का शब्दचित्र ‘तलवार की धार/मुख’ है। हिन्दी में ‘तलवार की धार से’ उस चित्र को बनाए रखता है और ‘मार डाला’ הכה के प्रसंगगत परिणाम को स्पष्ट करता है।
- source_word: וַיַּחֲרִימוּ
  choice: विनाश के लिए अर्पित कर दिया
  rationale: חרם का हिफ़ील रूप सामान्य नाश से अधिक, किसी को पूर्ण विनाश के अधीन ठहराने का तकनीकी भाव रखता है। यह अनुवाद उस धार्मिक-न्यायिक आयाम को संक्षेप में बनाए रखता है।
- source_word: כָּל נֶפֶשׁ אֲשֶׁר בָּהּ
  choice: उसमें रहने वाले हर व्यक्ति
  rationale: נפש यहाँ अमूर्त आत्मा नहीं, नगर में उपस्थित प्रत्येक व्यक्ति को दर्शाता है।
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: उन्होंने किसी को जीवित न छोड़ा
  rationale: שָׂרִיד जीवित बचे व्यक्ति को दर्शाता है। हिब्रू में क्रिया एकवचन है, किंतु पूर्ववर्ती सामूहिक बहुवचन कर्ता के संदर्भ में हिन्दी की स्वाभाविकता के लिए बहुवचन रखा गया; अगले स्वतंत्र तुलना-वाक्य में एकवचन ‘उसने’ संरक्षित है।
- source_word: כַּאֲשֶׁר עָשָׂה לְחֶבְרוֹן כֵּן עָשָׂה
  choice: जैसा उसने हेब्रोन के साथ किया था, वैसा ही उसने किया
  rationale: तुलनात्मक सूत्र पिछली विजय को वर्तमान कार्रवाई का नमूना बताता है। एकवचन क्रियाएँ सम्भवतः यहोशू को प्रतिनिधि अगुवा के रूप में सामने रखती हैं और हिन्दी में भी एकवचन रखा गया है।
- source_word: לִדְבִרָהּ וּלְמַלְכָּהּ
  choice: दबीर और उसके राजा के साथ
  rationale: עשה עם के हिन्दी समतुल्य भाव को यहाँ ‘के साथ किया’ स्वाभाविक रूप से व्यक्त करता है; स्त्रीलिंग प्रत्यय दबीर नगर की ओर संकेत करता है।
- source_word: וְכַאֲשֶׁר עָשָׂה לְלִבְנָה וּלְמַלְכָּהּ
  choice: और वैसा ही उसने लिब्ना और उसके राजा के साथ किया था
  rationale: अंतिम तुलना दबीर की दशा को लिब्ना और उसके राजा की पिछली दशा से जोड़ती है; ‘किया था’ पूर्व घटना को स्पष्ट करता है।
theological_decisions:
- issue: חרם संबंधी युद्ध-भाषा
  choice: विनाश के लिए अर्पित कर दिया
  alternative: पूरी तरह नष्ट कर दिया / विनाश के अधीन कर दिया
  rationale: यह पद तकनीकी חרם शब्दावली का प्रयोग करता है। ‘विनाश के लिए अर्पित’ सामान्य हत्या से अधिक उसके समर्पण और पूर्ण विनाश के संयुक्त भाव को बनाए रखता है, जबकि पादटिप्पणी वैकल्पिक अर्थ स्पष्ट करती है।
- issue: बहुवचन और एकवचन कथावाचक कर्ता का परिवर्तन
  choice: पहली कार्रवाई में बहुवचन और तुलना-वाक्यों में एकवचन
  alternative: सभी क्रियाओं को केवल बहुवचन या केवल एकवचन करना
  rationale: हिब्रू सेना की सामूहिक कार्रवाई और यहोशू के प्रतिनिधि नेतृत्व के बीच वचन बदलता है। हिन्दी की पठनीयता के लिए निकटवर्ती प्रथम अनुक्रम बहुवचन में है, पर स्पष्ट तुलना-वाक्यों का एकवचन सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘अपने अधिकार में कर लिया’, ‘तलवार की धार’ और ‘किसी को जीवित न छोड़ा’ जैसे परिचित वाक्यांश रखे गए हैं। मुख्य पाठ में तकनीकी חרם भाव को बनाए रखने के लिए ‘विनाश के लिए अर्पित’ प्रयुक्त है।
