source:
  edition: WLC
  text: וַ/יַּכֶּ֣ה יְהוֹשֻׁ֣עַ אֶת כָּל הָ/אָ֡רֶץ הָ/הָר֩ וְ/הַ/נֶּ֨גֶב וְ/הַ/שְּׁפֵלָ֜ה וְ/הָ/אֲשֵׁד֗וֹת וְ/אֵת֙ כָּל מַלְכֵי/הֶ֔ם לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וְ/אֵ֤ת כָּל הַ/נְּשָׁמָה֙ הֶחֱרִ֔ים כַּ/אֲשֶׁ֣ר צִוָּ֔ה יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/040.yaml
  text: So Joshua struck all the land—the hill country[a], the Negev, the lowland, and the slopes—and all their kings. He left no survivor, but devoted to destruction every breathing thing, just as Yahweh, the God of Israel[b], had commanded.
translation:
  language: hi
  text: इस प्रकार यहोशू ने सारे देश—पहाड़ी प्रदेश, नेगेव, निचला प्रदेश और ढलानों—को, और उनके सभी राजाओं को, परास्त किया। उसने किसी जीवित बचे हुए को नहीं छोड़ा, बल्कि हर साँस लेनेवाले प्राणी को[a] विनाश के लिए समर्पित कर दिया[b], ठीक वैसे ही जैसे इस्राएल के परमेश्वर याहवे ने आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हर साँस” अथवा “जो कुछ साँस लेता था, वह सब।”
    reason: lexical_alternative
  - marker: b
    text: या “पूरी तरह नष्ट कर दिया” अथवा “विनाश के प्रतिबंध के अधीन कर दिया।” इब्रानी क्रिया किसी वस्तु या व्यक्ति को अपरिवर्तनीय रूप से विनाश के लिए अलग कर देने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: परास्त किया
  rationale: नכה युद्ध में प्रहार करने या पराजित करने को दर्शाता है। यहाँ इसका कर्म पूरा भूभाग और उसके राजा हैं, इसलिए हिन्दी में ‘परास्त किया’ स्वाभाविक है और युद्ध-संबंधी बल बनाए रखता है।
- source_word: כָּל הָאָרֶץ
  choice: सारे देश
  rationale: אֶרֶץ यहाँ पूरी पृथ्वी नहीं, अभियान के अंतर्गत आनेवाले क्षेत्र को सूचित करता है।
- source_word: הָהָר
  choice: पहाड़ी प्रदेश
  rationale: यहोशू में यह प्रायः एक विशिष्ट भू-प्रदेश का नाम है, केवल अलग-अलग पहाड़ों का नहीं।
- source_word: הַנֶּגֶב
  choice: नेगेव
  rationale: यह दक्षिण के शुष्क भू-प्रदेश का भौगोलिक नाम है; लिप्यंतरण उसके क्षेत्रीय अर्थ को सुरक्षित रखता है।
- source_word: הַשְּׁפֵלָה
  choice: निचला प्रदेश
  rationale: यह पहाड़ी देश और तट के बीच के निम्न भू-प्रदेश को दर्शाता है; यह रूप सामान्य पाठक के लिए स्पष्ट है।
- source_word: הָאֲשֵׁדוֹת
  choice: ढलानों
  rationale: אֲשֵׁדוֹת पर्वतीय ढलानों या उतरते भूभाग को सूचित करता है।
- source_word: כָּל מַלְכֵיהֶם
  choice: उसके सभी राजाओं
  rationale: सर्वनाम का सम्बन्ध सामूहिक रूप से उल्लिखित देश और उसके प्रदेशों से है; हिन्दी में एकवचन ‘उसके’ इस सामूहिक भौगोलिक संदर्भ के अनुकूल है।
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: किसी जीवित बचे हुए को नहीं छोड़ा
  rationale: שָׂרִיד युद्ध के बाद बचे व्यक्ति या जीवित बचे हुए को दर्शाता है। यह अनुवाद अर्थ को स्पष्ट रखता है।
- source_word: כָּל הַנְּשָׁמָה
  choice: हर साँस लेनेवाले को
  rationale: शाब्दिक इब्रानी मुहावरा ‘हर साँस’ अथवा ‘हर साँस लेनेवाला’ है। इसे बनाए रखने से कथन का विस्तार संकीर्ण नहीं किया जाता।
- source_word: הֶחֱרִים
  choice: सर्वनाश के लिए समर्पित कर दिया
  rationale: חרם का हिफ़ील रूप किसी को अपरिवर्तनीय रूप से विनाश के अधीन करने का धर्म-संबंधी युद्धार्थ रखता है। यह केवल ‘नष्ट किया’ कहने से अधिक मूल अर्थ बचाता है।
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ठीक वैसे ही जैसे ... ने आज्ञा दी थी
  rationale: यह वाक्यांश पहले दी गई ईश्वरीय आज्ञा के अनुरूप कार्य किए जाने पर बल देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का ध्वन्यात्मक रूप रखा गया है, उसके स्थान पर कोई उपाधि नहीं दी गई।
theological_decisions:
- issue: חרם से जुड़ी युद्ध-भाषा
  choice: सर्वनाश के लिए समर्पित कर दिया
  alternative: पूरी तरह नष्ट कर दिया; विनाश के प्रतिबंध के अधीन कर दिया
  rationale: चुना हुआ रूप इस क्रिया के अपरिवर्तनीय विनाश और धर्म-संबंधी समर्पण—दोनों पक्षों को व्यक्त करता है, बिना इसे केवल सामान्य सैन्य विनाश बना देने के।
- issue: כָּל הַנְּשָׁמָה का विस्तार
  choice: हर साँस लेनेवाले को
  alternative: हर व्यक्ति को; जो कुछ साँस लेता था, उस सबको
  rationale: मूल पाठ का मुहावरा और उसकी कठोर व्यापकता सुरक्षित रखी गई है; इसे व्याख्यात्मक रूप से केवल मनुष्यों तक सीमित नहीं किया गया।
- issue: ईश्वरीय नाम יהוה
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत नाम को नाम के रूप में ही प्रस्तुत किया गया है; ‘प्रभु’ जैसी उपाधि से उसका प्रतिस्थापन नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। भूगोल-संबंधी पदों में ‘नेगेव’ को नाम के रूप में रखा गया है, जबकि अन्य क्षेत्रों के लिए सहज हिन्दी प्रयोग हुई है। मूल इब्रानी की कठोर युद्ध-भाषा को न तो नरम किया गया है और न उससे आगे बढ़ाकर स्पष्ट किया गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न अपने विषयों से असंगत स्थानों पर थे; हिन्दी मुख्य पाठ में [a] को ‘हर साँस लेनेवाले’ और [b] को ‘सर्वनाश के लिए समर्पित’ के साथ सही स्थान पर रखा गया है।
