base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/016.yaml
  text: But these five kings fled and hid in the cave at Makkedah[a].
translation:
  language: hi
  text: परन्तु ये पाँचों राजा भाग गए और मक्केदा की गुफा में छिप गए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और ये पाँचों राजा भाग गए और मक्केदा की गुफा में छिप गए।”
    reason: आरम्भिक וַ को सामान्य संयोजक ‘और’ भी समझा जा सकता है; मुख्य पाठ का ‘परन्तु’ प्रसंगगत बदलाव को उभारता है।
lexical_decisions:
- source_word: וַיָּנֻסוּ
  choice: भाग गए
  rationale: נוּס संकट या शत्रु से भागने को व्यक्त करता है; ‘भाग गए’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ये पाँचों राजा
  rationale: ‘ये’ संकेतवाचक הָאֵלֶּה को बनाए रखता है। ‘पाँचों’ ज्ञात पाँच राजाओं के पूरे समूह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֵּחָבְאוּ
  choice: छिप गए
  rationale: חבא का यहाँ आत्मवाचक भाव है; ‘छिप गए’ साधारण, स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: בַמְּעָרָה
  choice: गुफा में
  rationale: हिब्रू में संज्ञा निश्चित है। हिन्दी में प्रसंग और ‘मक्केदा की’ संबंध-रचना उस पहचानी हुई गुफा का बोध पर्याप्त रूप से कराती है; कृत्रिम रूप से ‘उस’ जोड़ना आवश्यक नहीं।
- source_word: בְּמַקֵּדָה
  choice: मक्केदा की
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण किया गया है। गुफा के स्थान को हिन्दी में स्वाभाविक रूप से ‘मक्केदा की गुफा’ कहा गया है।
- source_word: וַ
  choice: परन्तु
  rationale: वाव कथा को आगे बढ़ाता है और प्रसंग में राजाओं के भागने की ओर बदलाव को विरोधसूचक ढंग से व्यक्त किया जा सकता है; मूल का सामान्य संयोजक अर्थ पादटिप्पणी में सुरक्षित है।
