lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौटे
  rationale: שׁוב का यह कथात्मक रूप दिशा बदलकर वापस जाने को व्यक्त करता है। संयुक्त कर्ता के साथ ‘लौटे’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: और उसके साथ समस्त इस्राएल
  rationale: इब्रानी सामूहिक अभिव्यक्ति और עִמּוֹ (‘उसके साथ’) दोनों को स्पष्ट तथा संक्षिप्त रूप में सुरक्षित रखा गया है।
- source_word: דְּבִרָה
  choice: दबीर
  rationale: स्थाननाम से जुड़ा दिशासूचक ה motion toward the city दर्शाता है; हिन्दी में ‘दबीर लौटे’ स्वाभाविक रूप से ‘दबीर को/की ओर लौटे’ का अर्थ देता है।
- source_word: וַיִּלָּחֶם
  choice: युद्ध किया
  rationale: לחם का निफ़अल कथात्मक रूप यहाँ युद्ध में संलग्न होने का सीधा अर्थ देता है; ‘युद्ध किया’ गरिमापूर्ण और सामान्य हिन्दी है।
- source_word: עָלֶיהָ
  choice: उससे
  rationale: यह दबीर नगर के विरुद्ध युद्ध करने का संकेत देता है। हिन्दी में ‘उससे युद्ध किया’ स्वाभाविक है और अनावश्यक मानवीकरण से बचता है।
