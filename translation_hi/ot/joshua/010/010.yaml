  edition: WLC
  text: וַ/יְהֻמֵּ֤/ם יְהוָה֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכֵּ֥/ם מַכָּֽה גְדוֹלָ֖ה בְּ/גִבְע֑וֹן וַֽ/יִּרְדְּפֵ֗/ם דֶּ֚רֶךְ מַעֲלֵ֣ה בֵית חוֹרֹ֔ן וַ/יַּכֵּ֥/ם עַד עֲזֵקָ֖ה וְ/עַד מַקֵּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/010.yaml
  text: And Yahweh threw them into confusion before Israel[a], and struck them down with a great slaughter at Gibeon, and pursued them by the way of the ascent of Beth-horon, and struck them down as far as Azekah and Makkedah.
translation:
  language: hi
  text: तब याहवे ने इस्राएल के सामने उन्हें भ्रम और घबराहट में डाल दिया[a]। उसने गिबोन में उनका भारी संहार किया, बेत-होरोन की चढ़ाई के मार्ग से उनका पीछा किया और अजेका और मक्केदा तक उन्हें मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें आतंकित कर दिया” अथवा “उन्हें तितर-बितर कर दिया।” इब्रानी क्रिया युद्ध में भ्रम, घबराहट और अव्यवस्था उत्पन्न करने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהֻמֵּם
  choice: उन्हें भ्रम और घबराहट में डाल दिया
  rationale: ה־מ־ם युद्ध के प्रसंग में शत्रु को आतंकित, व्याकुल या अव्यवस्थित करने को दर्शाता है। संयुक्त पदबंध मानसिक घबराहट और युद्ध-पंक्ति की अव्यवस्था दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; पादटिप्पणी संक्षिप्त विकल्प देती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: इस्राएल के सामने
  rationale: मूल स्थानवाचक मुहावरे को बनाए रखता है; प्रसंग में इसका अर्थ इस्राएल की उपस्थिति में अथवा उसके आगे हो सकता है।
- source_word: וַיַּכֵּם מַכָּה גְדוֹלָה
  choice: उनका भारी संहार किया
  rationale: युद्ध के प्रसंग में נכה और מַכָּה का मेल केवल सामान्य प्रहार नहीं, बल्कि बड़ी संख्या में मार गिराने को व्यक्त करता है। ‘भारी संहार’ मूल की तीव्रता और सैन्य संदर्भ दोनों को संक्षेप में रखता है।
- source_word: בְּגִבְעוֹן
  choice: गिबोन में
  rationale: युद्ध की घटना के स्थान को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיִּרְדְּפֵם
  choice: उनका पीछा किया
  rationale: רדף भागते शत्रुओं का पीछा करने के लिए सामान्य इब्रानी क्रिया है। एकवचन क्रिया-क्रम के अनुसार कर्ता याहवे ही रखा गया है।
- source_word: דֶּרֶךְ מַעֲלֵה בֵית חוֹרֹן
  choice: बेत-होरोन की चढ़ाई के मार्ग से
  rationale: ‘मार्ग’ और ‘चढ़ाई’ दोनों भौगोलिक विवरणों को सुरक्षित रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: וַיַּכֵּם
  choice: उन्हें मार गिराया
  rationale: पीछा किए जाने के युद्ध-संदर्भ में נכה की हिंसक और निर्णायक शक्ति को व्यक्त करता है।
- source_word: עַד עֲזֵקָה וְעַד מַקֵּדָה
  choice: अजेका और मक्केदा तक
  rationale: दोनों स्थानों के साथ दोहराए गए עַד को सुबोध हिन्दी में एक बार ‘तक’ लगाकर व्यक्त किया गया है, जबकि दोनों भौगोलिक सीमाएँ बनी रहती हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पद में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: पीछा करने और मार गिराने वाली क्रियाओं का कर्ता
  choice: याहवे को कर्ता बनाए रखा गया
  alternative: इस्राएल को निहित कर्ता मानना
  rationale: मसोरेटिक पाठ की एकवचन क्रियाएँ उसी एकवचन कर्ता יהוה के साथ निरंतर पढ़ी जा सकती हैं। इस्राएली सेना के साधन होने की संभावना को नकारे बिना अनुवाद व्याकरणिक क्रम को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण ऐतिहासिक-वर्णन शैली रखी गई है। छोटे वाक्यों से घटनाक्रम स्पष्ट किया गया है; स्थान-नामों का रूप हिन्दी बाइबिलीय प्रयोग और इब्रानी उच्चारण के निकट रखा गया है।
