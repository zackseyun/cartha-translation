base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/037.yaml
  text: And they captured it and struck it with the edge of the sword[a], along with its king, all its cities, and every person who was in it. He left no survivor, just as he had done to Eglon. He devoted it to destruction, along with every person who was in it.
translation:
  language: hi
  text: उन्होंने उस पर अधिकार कर लिया और तलवार की धार से उसका, उसके राजा का, उसके सभी नगरों का और उसमें रहने वाले हर व्यक्ति का विनाश कर दिया। उसने किसी को जीवित नहीं छोड़ा, ठीक वैसे ही जैसे उसने एग्लोन के साथ किया था। उसने उसे और उसमें रहने वाले हर व्यक्ति को विनाश के लिए समर्पित कर दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे पूरी तरह नष्ट कर दिया।” इब्रानी क्रिया का अर्थ किसी को या किसी वस्तु को विनाश के लिए अलग अथवा समर्पित करना है।
    reason: חרם के तकनीकी अर्थ और उसके परिणामपरक वैकल्पिक अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: उन्होंने उस पर अधिकार कर लिया
  rationale: לכד का यहाँ अर्थ किसी नगर को पकड़ना या अपने अधिकार में लेना है। हिंदी में नगर के संदर्भ में ‘उस पर अधिकार कर लिया’ स्वाभाविक और सैन्य भाव को स्पष्ट रखने वाला प्रयोग है।
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: तलवार की धार से मार डाला
  rationale: נכה के प्रहार करने के अर्थ और לְפִי חֶרֶב के ‘तलवार की धार से’ वाले मुहावरे को मिलाकर स्पष्ट, स्वाभाविक हिंदी दी गई है। इससे केवल ‘हरा दिया’ जैसा कमजोर अर्थ नहीं आता।
- source_word: מַלְכָּהּ
  choice: उसके राजा
  rationale: यह नगर के राजा को सूचित करने वाला सीधा संबंधसूचक प्रयोग है।
- source_word: כָּל עָרֶיהָ
  choice: उसके सभी नगरों
  rationale: עיר नगर या बस्ती को सूचित कर सकता है; बहुवचन और मुख्य नगर से संबद्ध स्थानों का भाव रखते हुए ‘सभी नगरों’ चुना गया है।
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: उसमें रहने वाले हर व्यक्ति
  rationale: נפש यहाँ अमूर्त ‘आत्मा’ नहीं, बल्कि जीवित व्यक्ति को सूचित करता है। चुना गया रूप आधुनिक हिंदी में स्पष्ट है।
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: उसने किसी को जीवित नहीं छोड़ा
  rationale: שָׂרִיד बचे हुए व्यक्ति या जीवित बचे जन को सूचित करता है। यह रूप संक्षिप्त और स्वाभाविक है तथा एकवचन क्रिया के कारण यहोशू की ओर संकेत करने वाले ‘उसने’ को बनाए रखता है।
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְעֶגְלוֹן
  choice: ठीक वैसे ही जैसे उसने एग्लोन के साथ किया था
  rationale: यह पहले एग्लोन के साथ किए गए व्यवहार से स्पष्ट तुलना है; ‘किया था’ पूर्ववर्ती घटना को सहज रूप से दर्शाता है।
- source_word: וַיַּחֲרֵם
  choice: विनाश के लिए समर्पित कर दिया
  rationale: חרם का यहाँ तकनीकी अर्थ किसी वस्तु या जनसमूह को पूर्ण विनाश के लिए अलग अथवा समर्पित करना है। यह अनुवाद केवल ‘नष्ट किया’ कहने की अपेक्षा उस विशेष धार्मिक-सैन्य भाव को बनाए रखता है।
theological_decisions:
- issue: युद्ध और न्याय के प्रसंग में חרם का अनुवाद
  choice: विनाश के लिए समर्पित कर दिया
  alternative: पूरी तरह नष्ट कर दिया
  rationale: इब्रानी पद केवल विनाश का परिणाम नहीं, बल्कि विनाश के लिए अलग या समर्पित किए जाने का तकनीकी भाव भी रखता है। मुख्य पाठ में इस तनाव को सुरक्षित रखा गया है और अधिक सरल परिणामपरक अर्थ पादटिप्पणी में दिया गया है।
- issue: बहुवचन से एकवचन कर्ता में परिवर्तन
  choice: पहले ‘उन्होंने’, फिर ‘उसने’
  alternative: पूरे पद में ‘उन्होंने’
  rationale: मूल इब्रानी में आरंभिक क्रियाएँ बहुवचन हैं, जबकि ‘जीवित नहीं छोड़ा’ और ‘समर्पित कर दिया’ एकवचन हैं। संभावित कर्ता यहोशू है, पर नाम जोड़ने के बजाय मूल की व्याकरणिक भिन्नता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। युद्ध-वर्णन की कठोरता को न तो हल्का किया गया है, न अतिरिक्त व्याख्या से बढ़ाया गया है। मूल में बहुवचन से एकवचन कर्ता की ओर परिवर्तन को हिंदी में भी बनाए रखा गया है।
