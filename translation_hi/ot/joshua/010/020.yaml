  text: וַ/יְהִי֩ כְּ/כַלּ֨וֹת יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ/הַכּוֹתָ֛/ם מַכָּ֥ה גְדוֹלָֽה מְאֹ֖ד עַד תֻּמָּ֑/ם וְ/הַ/שְּׂרִידִים֙ שָׂרְד֣וּ מֵ/הֶ֔ם וַ/יָּבֹ֖אוּ אֶל עָרֵ֥י הַ/מִּבְצָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/020.yaml
  text: And it happened that when Joshua and the sons of Israel had finished striking them with a very great slaughter[a], until they were wiped out, and the survivors from them survived and entered the fortified cities[b],
translation:
  language: hi
  text: और ऐसा हुआ कि जब यहोशू और इस्राएलियों[a] ने उन्हें बहुत बड़ी मार मार चुके थे, यहाँ तक कि उनका अंत हो गया था, और उनमें से बचे हुए लोग बच निकले[b] और किलेबंद नगरों में जा पहुँचे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “इस्राएल के पुत्रों।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “बचे हुए लोग बच निकले” के समान संज्ञा और क्रिया की पुनरुक्ति है, जो बचे रहने पर बल देती है।
    reason: source_form
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह कथानक में अगले चरण का परिचय देता है। यह अनुवाद इब्रानी की वाक्य-संरचना को रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כְּכַלּוֹת
  choice: जब ... समाप्त किया
  rationale: כ उपसर्ग सहित infinitive construct यहाँ समय-संबंध व्यक्त करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ के बजाय समुदाय के लिए प्रचलित और स्वाभाविक हिन्दी रूप चुना गया है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לְהַכּוֹתָם מַכָּה גְדוֹלָה מְאֹד
  choice: उन्हें बहुत बड़ी मार से मारना
  rationale: नכה और מַכָּה के क्रिया-संज्ञा संबंध को हिन्दी में ‘मार से मारना’ द्वारा यथासंभव सुरक्षित रखा गया है; प्रसंग इसकी घातक सैन्य तीव्रता स्पष्ट करता है।
- source_word: עַד תֻּמָּם
  choice: यहाँ तक कि उनका अंत हो गया
  rationale: यह निष्क्रिय रूप पूर्ण अंत तक पहुँचाए जाने का भाव देता है। ‘अंत हो गया’ अगले वाक्यांश में बचे हुए लोगों के उल्लेख के साथ मूल पाठ का तनाव बनाए रखता है।
- source_word: וְהַשְּׂרִידִים שָׂרְדוּ מֵהֶם
  choice: और उनमें से बचे हुए लोग बच निकले
  rationale: ו को सामान्य संयोजक ‘और’ माना गया है, न कि अर्थ की दृष्टि से अधिक व्याख्यात्मक ‘फिर भी’। संज्ञा और क्रिया की पुनरुक्ति ‘बचे हुए ... बच निकले’ में सुरक्षित है।
- source_word: עָרֵי הַמִּבְצָר
  choice: गढ़वाले नगरों
  rationale: यह ऐसे नगरों को दर्शाता है जो रक्षात्मक किलेबंदी से सुरक्षित थे; ‘गढ़वाले नगर’ सरल और सटीक हिन्दी है।
theological_decisions:
- issue: ‘उनका अंत हो गया’ के बाद बचे हुए लोगों का उल्लेख
  choice: दोनों कथनों को बिना सामंजस्य बैठाए साथ रखा गया है।
  alternative: पहले कथन को ‘लगभग सबका अंत हो गया’ बनाना
  rationale: मूल इब्रानी ‘लगभग’ नहीं कहता। अतः व्यापक विनाश और कुछ लोगों के बच निकलने के बीच मूल पाठ का कथात्मक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। पद का अंतिम अल्पविराम जानबूझकर रखा गया है, क्योंकि इसकी ‘जब’ वाली संरचना का मुख्य वाक्य अगले पद में पूरा होता है।
