base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/013.yaml
  text: So the sun stood still[a], and the moon stopped, until the nation took vengeance on its enemies[d][c][b]. Is this not written in the Book of Jashar? The sun stood still in the middle of the sky and did not hurry to set for about a full day.
translation:
  language: hi
  text: तब सूर्य ठहर गया, और चन्द्रमा रुक गया, जब तक उस राष्ट्र ने अपने शत्रुओं से बदला न ले लिया।[a] क्या यह याशार की पुस्तक में नहीं लिखा है?[b] सूर्य आकाश के बीच में ठहर गया और लगभग पूरे एक दिन तक अस्त होने में जल्दबाज़ी नहीं की।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक उस राष्ट्र ने अपने शत्रुओं से अपना बदला न लिया।” इब्रानी अभिव्यक्ति में प्रतिशोध और न्यायसिद्धि, दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: “याशार की पुस्तक”; सम्भव अर्थ, “सीधे-सच्चे की पुस्तक” या “धर्मी की पुस्तक।”'
    reason: alternative_reading
  - marker: c
    text: इब्रानी वाक्यांश का अनुवाद “एक पूरे दिन के समान” या “लगभग पूरे एक दिन तक” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדֹּם הַשֶּׁמֶשׁ
  choice: सूर्य ठहर गया
  rationale: דמם का अर्थ मौन या स्थिर होना हो सकता है; चन्द्रमा के रुकने की समानांतर पंक्ति और खगोलीय प्रसंग में ‘ठहर गया’ गति के रुकने का स्वाभाविक हिन्दी रूप है।
- source_word: וְיָרֵחַ עָמָד
  choice: और चन्द्रमा रुक गया
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है, पर खगोलीय पिंड के संदर्भ में ‘रुक गया’ स्वाभाविक है और अनावश्यक पुनरावृत्ति से बचता है।
- source_word: עַד יִקֹּם גּוֹי אֹיְבָיו
  choice: जब तक उस राष्ट्र ने अपने शत्रुओं से बदला न ले लिया
  rationale: इस मुहावरे में נקם के अर्थ-क्षेत्र से प्रतिशोध या न्यायपूर्ण बदला लेने का भाव आता है; גוי को ‘राष्ट्र’ और एकवचन सामूहिक प्रत्यय को ‘अपने’ से व्यक्त किया गया है।
- source_word: סֵפֶר הַיָּשָׁר
  choice: याशार की पुस्तक
  rationale: यह किसी स्रोत-ग्रन्थ का शीर्षक प्रतीत होता है; इसलिए יָשָׁר का अर्थ अनिवार्य रूप से तय करने के बजाय नाम का लिप्यन्तरण रखा गया है।
- source_word: בַּחֲצִי הַשָּׁמַיִם
  choice: आकाश के बीच में
  rationale: शाब्दिक ‘आकाशों के आधे/मध्य में’ का यह सहज और स्पष्ट आधुनिक हिन्दी रूप है।
- source_word: וְלֹא אָץ לָבוֹא
  choice: अस्त होने की जल्दी नहीं की
  rationale: אוץ ‘जल्दी करना’ है और सूर्य के साथ בוא उसके अस्त होने की ओर जाने का मुहावरा है; हिन्दी में निहित गन्तव्य को स्पष्ट करना स्वाभाविक है।
- source_word: כְּיוֹם תָּמִים
  choice: लगभग पूरे एक दिन तक
  rationale: תמים पूर्णता दर्शाता है और तुलनात्मक כ सटीक गणितीय अवधि के बजाय ‘लगभग/जैसे’ का भाव देता है।
theological_decisions:
- issue: खगोलीय चमत्कार का स्वरूप
  choice: वर्णन को सीधे सूर्य और चन्द्रमा के रुकने के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल दृश्य-प्रतीति, वैज्ञानिक सामंजस्य, या मात्र काव्यात्मक कथन के रूप में समझाना।
  rationale: इब्रानी कथा घटना को असाधारण रूप में प्रस्तुत करती है और एक लिखित स्रोत का उल्लेख करती है; अनुवाद को आधुनिक वैज्ञानिक व्याख्या जोड़कर या इसे रूपक बनाकर तनाव समाप्त नहीं करना चाहिए।
- issue: יִקֹּם में प्रतिशोध और न्यायसिद्धि का तनाव
  choice: अपने शत्रुओं से बदला न ले लिया
  alternative: अपने शत्रुओं पर न्याय न पा लिया / अपने शत्रुओं से अपना बदला न चुका लिया
  rationale: प्रसंग प्रतिशोध का भाव समर्थित करता है, पर यह क्रिया न्यायसिद्धि का अर्थ भी ग्रहण कर सकती है; वैकल्पिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। ‘चन्द्रमा’ और ‘राष्ट्र’ औपचारिक किन्तु सामान्यतः बोधगम्य शब्द हैं। चमत्कार के दावे को न वैज्ञानिक शब्दावली से समझाया गया है, न काव्य-मात्र बनाकर कम किया गया है।
