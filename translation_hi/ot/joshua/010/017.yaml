    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: तब ... बताया गया
  rationale: निष्क्रिय कथात्मक क्रिया का भाव सुरक्षित रखा गया है। ‘तब’ हिब्रू के क्रमसूचक וַ־ को स्वाभाविक हिन्दी कथा-प्रवाह में व्यक्त करता है, और किसी अनिर्दिष्ट सूचना देने वाले को नहीं जोड़ता।
- source_word: לִיהוֹשֻׁעַ
  choice: यहोशू को
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण और क्रिया का स्वाभाविक सम्प्रदान-रूप।
- source_word: לֵאמֹר
  choice: उद्धरण द्वारा व्यक्त
  rationale: हिब्रू का मानक उद्धरण-सूचक पद हिन्दी में सीधे उद्धरण आरम्भ करके स्वाभाविक रूप से व्यक्त होता है; अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक और बोझिल होता।
- source_word: נִמְצְאוּ
  choice: पाए गए हैं
  rationale: מצא के निष्क्रिय बहुवचन रूप को सुरक्षित रखता है और अभी-अभी मिली सूचना के लिए हिन्दी का पूर्ण वर्तमान स्वाभाविक है।
- source_word: חֲמֵשֶׁת הַמְּלָכִים
  choice: वे पाँचों राजा
  rationale: निश्चितता और पहले से उल्लिखित पाँच राजाओं की ओर संकेत दोनों व्यक्त होते हैं; ‘पाँचों’ पूरे ज्ञात समूह को स्पष्ट करता है।
- source_word: נֶחְבְּאִים
  choice: छिपे हुए
  rationale: कृदन्त राजाओं की मिली हुई अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि उसकी क्रियात्मक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: בַּמְּעָרָה
  choice: गुफा में
  rationale: निश्चित स्थान का सीधा और स्वाभाविक अनुवाद। हिन्दी में प्रसंग से गुफा की निश्चितता स्पष्ट है।
- source_word: בְּמַקֵּדָה
  choice: मक्केदा की
  rationale: हिन्दी में ‘मक्केदा की गुफा’ उस नामित स्थान से सम्बद्ध गुफा को ‘मक्केदा में स्थित गुफा’ की अपेक्षा अधिक सहज रूप से व्यक्त करता है।
