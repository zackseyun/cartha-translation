  yaml_path: translation/ot/joshua/010/022.yaml
  text: Then Joshua said[a], “Open the mouth of the cave[b], and bring those five kings out of the cave to me.”
translation:
  language: hi
  text: तब यहोशू ने कहा, “गुफा का मुँह खोलो और उन पाँचों राजाओं को गुफा से निकालकर मेरे पास लाओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम को स्पष्ट रखता है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का हिन्दी बाइबल परंपरा में प्रचलित लिप्यंतरण।
- source_word: פִּתְחוּ
  choice: खोलो
  rationale: बहुवचन आज्ञार्थ का सीधा और सहज हिन्दी रूप।
- source_word: פִּי הַמְּעָרָה
  choice: गुफा का मुँह
  rationale: इब्रानी के ठोस रूपक ‘गुफा का मुँह’ को सुरक्षित रखता है और हिन्दी में समझने योग्य है।
- source_word: וְהוֹצִיאוּ
  choice: निकालकर ... लाओ
  rationale: हिफ़ील आज्ञार्थ भीतर से बाहर लाने की क्रिया बताता है; यह हिन्दी प्रयोग दिशा और कारणात्मक भाव दोनों व्यक्त करता है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: यहोशू की ओर गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: उन पाँचों राजाओं को
  rationale: संदर्भ में पहले से पहचाने गए विशिष्ट पाँच राजाओं के लिए ‘उन’ स्वाभाविक है; ‘पाँचों’ समूह की पूर्ण संख्या को स्पष्ट करता है।
- source_word: מִן הַמְּעָרָה
  choice: गुफा से
  rationale: निकालने की क्रिया के साथ स्रोत-स्थान को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
