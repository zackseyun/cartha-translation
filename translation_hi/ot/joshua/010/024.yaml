  text: וַ֠/יְהִי כְּֽ/הוֹצִיאָ֞/ם אֶת הַ/מְּלָכִ֣ים הָ/אֵלֶּה֮ אֶל יְהוֹשֻׁעַ֒ וַ/יִּקְרָ֨א יְהוֹשֻׁ֜עַ אֶל כָּל אִ֣ישׁ יִשְׂרָאֵ֗ל וַ֠/יֹּאמֶר אֶל קְצִינֵ֞י אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הֶ/הָלְכ֣וּא אִתּ֔/וֹ קִרְב֗וּ שִׂ֚ימוּ אֶת רַגְלֵי/כֶ֔ם עַֽל צַוְּארֵ֖י הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַֽ/יִּקְרְב֔וּ וַ/יָּשִׂ֥ימוּ אֶת רַגְלֵי/הֶ֖ם עַל צַוְּארֵי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/024.yaml
  text: And when they brought these kings out to Joshua[a], Joshua called all the men of Israel and said to the commanders of the men of war who had gone with him, “Come near[b]; put your feet on the necks of these kings.” So they came near and put their feet on their necks.
translation:
  language: hi
  text: जब वे इन राजाओं को बाहर निकालकर यहोशू के पास ले आए, तब यहोशू ने इस्राएल के सभी पुरुषों[a] को बुलाया और उन योद्धाओं के अधिकारियों से, जो उसके साथ गए थे, कहा, “पास आओ और इन राजाओं की गर्दनों पर अपने पैर रखो।” तब वे पास आए और उन्होंने उनकी गर्दनों पर अपने पैर रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के हर पुरुष को”; यहाँ सैन्य प्रसंग में सेना के साथ एकत्र पुरुष अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהוֹצִיאָם
  choice: जब वे ... निकालकर ... ले आए, तब
  rationale: वַיְהִי और כְּ के साथ infinitive construct यहाँ समय-सूचक कथात्मक वाक्य बनाते हैं। हिन्दी में ‘जब ... तब’ स्वाभाविक रूप से घटनाक्रम व्यक्त करता है।
- source_word: הַמְּלָכִים הָאֵלֶּה
  choice: इन राजाओं
  rationale: निकट उपस्थित राजाओं की ओर संकेत करनेवाले इब्रानी demonstrative का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के सभी पुरुषों
  rationale: सैन्य प्रसंग में אִישׁ के पुरुषवाचक अर्थ को बनाए रखा गया है; इसे व्यापक और लिंग-निरपेक्ष ‘सारे इस्राएल’ नहीं बनाया गया।
- source_word: קְצִינֵי אַנְשֵׁי הַמִּלְחָמָה
  choice: युद्ध करनेवाले ... पुरुषों के अधिकारियों
  rationale: קְצִינֵי का नेतृत्वकारी सैन्य भाव और אַנְשֵׁי הַמִּלְחָמָה की संरचना दोनों सुरक्षित रहते हैं, जबकि हिन्दी समझने योग्य बनी रहती है।
- source_word: הֶהָלְכוּא אִתּוֹ
  choice: जो उसके साथ गए थे
  rationale: यह attributive खंड उन अधिकारियों की पहचान कराता है जो अभियान में यहोशू के साथ गए थे।
- source_word: קִרְבוּ
  choice: पास आओ
  rationale: शारीरिक रूप से निकट आने की सीधी बहुवचन आज्ञा का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: שִׂימוּ אֶת רַגְלֵיכֶם עַל צַוְּארֵי
  choice: गरदनों पर अपने पैर रखो
  rationale: मूल के ठोस और कठोर अधीनता-सूचक कार्य को बिना नरम किए स्पष्ट रूप में रखा गया है।
- source_word: וַיִּקְרְבוּ וַיָּשִׂימוּ
  choice: तब वे पास आए और उन्होंने ... रखे
  rationale: दोनों क्रमिक wayyiqtol क्रियाओं और आज्ञा के तत्काल पालन को सहज हिन्दी कथन में व्यक्त करता है।
theological_decisions:
- issue: כָּל אִישׁ יִשְׂרָאֵל और אַנְשֵׁי הַמִּלְחָמָה में पुरुषवाचक भाषा
  choice: इस्राएल के सभी पुरुषों / युद्ध करनेवाले पुरुषों
  alternative: सारे इस्राएल / इस्राएली / सैनिक
  rationale: यह सैन्य दृश्य पुरुष योद्धाओं और उनके अधिकारियों पर केंद्रित है। इसलिए मूल की पुरुषवाचक विशिष्टता को सामान्य या लिंग-निरपेक्ष नहीं किया गया।
- issue: पराजित राजाओं की गरदनों पर पैर रखने का चित्र
  choice: गरदनों पर अपने पैर रखो
  alternative: उन्हें अपने अधीन मानो
  rationale: मूल पाठ एक ठोस तथा प्रतीकात्मक सैन्य कार्य बताता है। अनुवाद उसके कठोर चित्र को नैतिक या धार्मिक व्याख्या द्वारा नरम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज सैन्य-कथात्मक शैली रखी गई है। ‘अधिकारी’, ‘योद्धा’ और ‘गरदन पर पैर रखना’ जैसे शब्द सामान्य पाठक के लिए स्पष्ट हैं; मूल की हिंसक विजय-छवि को न तो बढ़ाया गया है, न नरम किया गया है।
