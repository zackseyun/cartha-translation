source:
  edition: WLC
  text: וְ/לֹ֨א הָיָ֜ה כַּ/יּ֤וֹם הַ/הוּא֙ לְ/פָנָ֣י/ו וְ/אַחֲרָ֔י/ו לִ/שְׁמֹ֥עַ יְהוָ֖ה בְּ/ק֣וֹל אִ֑ישׁ כִּ֣י יְהוָ֔ה נִלְחָ֖ם לְ/יִשְׂרָאֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/014.yaml
  text: And there was no day like that before it or after it[a], when Yahweh listened to the voice of a man, for Yahweh fought for Israel.
translation:
  language: hi
  text: उस दिन के समान कोई दिन न तो उससे पहले हुआ था और न उसके बाद[a], जब याहवे ने एक मनुष्य की आवाज़ सुनी; क्योंकि याहवे इस्राएल की ओर से लड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब याहवे ने एक मनुष्य की विनती मानी।” इब्रानी में शाब्दिक रूप से है, “एक मनुष्य की आवाज़ सुनना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא הָיָה כַּיּוֹם הַהוּא
  choice: उस दिन के समान ... कोई दिन हुआ था
  rationale: नकारात्मक अस्तित्ववाचक कथन और तुलना दोनों को स्वाभाविक हिन्दी में रखते हुए उस दिन की अद्वितीयता व्यक्त करता है।
- source_word: לְפָנָיו וְאַחֲרָיו
  choice: न तो उससे पहले ... और न उसके बाद
  rationale: प्रत्यय का निकटतम और स्वाभाविक संदर्भ ‘दिन’ है; समानांतर हिन्दी रचना दोनों काल-दिशाओं को स्पष्ट करती है।
- source_word: לִשְׁמֹעַ יְהוָה בְּקוֹל אִישׁ
  choice: जब यहोवा ने एक मनुष्य की आवाज़ सुनी
  rationale: ‘आवाज़ सुनना’ मूल इब्रानी मुहावरे को निकटता से सुरक्षित रखता है और परमेश्वर के किसी मनुष्य की अधीनता में होने का अनावश्यक अर्थ नहीं जोड़ता। संदर्भ में इसका भाव उसकी विनती पर ध्यान देने का है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला परमेश्वर के व्यक्तिगत नाम का रूप है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उस असाधारण घटना का कारण या स्पष्टीकरण प्रस्तुत करने वाले संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: इस्राएल की ओर से लड़ रहा था
  rationale: निफ़अल कृदंत की चल रही युद्धात्मक क्रिया और לְ के हितार्थ भाव—इस्राएल के पक्ष में—दोनों को व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: ‘यहोवा’ आधुनिक हिन्दी के सामान्य बाइबलीय पाठकों के लिए अधिक परिचित है; इसे उपाधि ‘प्रभु’ से बदलने के बजाय व्यक्तिगत नाम के रूप में रखा गया है।
- issue: לִשְׁמֹעַ ... בְּקוֹל אִישׁ का आशय
  choice: यहोवा ने एक मनुष्य की आवाज़ सुनी
  alternative: यहोवा ने एक मनुष्य की विनती मानी
  rationale: मुख्य पाठ इब्रानी अभिव्यक्ति की ठोस भाषा और उसके संभावित तनाव को बनाए रखता है; पादटिप्पणी संदर्भगत अर्थ बताती है, बिना यह संकेत दिए कि परमेश्वर मनुष्य के अधीन होकर उसकी आज्ञा मानता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘एक मनुष्य की आवाज़ सुनी’ मूल मुहावरे को सुरक्षित रखता है, जबकि पादटिप्पणी सामान्य हिन्दी में उसका संदर्भगत भाव देती है।
