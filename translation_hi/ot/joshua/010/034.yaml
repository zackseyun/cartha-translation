base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/034.yaml
  text: Then Joshua, and all Israel with him, passed on from Lachish to Eglon; and they camped against it and fought against it.
translation:
  language: hi
  text: तब यहोशू और उसके साथ समस्त इस्राएल लाकीश से एग्लोन की ओर बढ़े। उन्होंने उसके विरुद्ध छावनी डाली और उसके विरुद्ध युद्ध किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: की ओर बढ़े
  rationale: यहाँ עבר किसी सीमा या जलराशि को पार करने के बजाय अभियान में एक नगर से दूसरे नगर की ओर आगे बढ़ने को व्यक्त करता है।
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: और उसके साथ समस्त इस्राएल
  rationale: सहभागिता का भाव और सामूहिक पदनाम दोनों सुरक्षित रखे गए हैं; ‘समस्त’ गरिमापूर्ण और स्पष्ट है।
- source_word: מִלָּכִישׁ עֶגְלֹנָה
  choice: लाकीश से एग्लोन की ओर
  rationale: מִן प्रस्थान-बिंदु बताता है और दिशासूचक ה एग्लोन की ओर गति को सूचित करता है।
- source_word: וַיַּחֲנוּ עָלֶיהָ
  choice: उन्होंने उसके विरुद्ध छावनी डाली
  rationale: सैन्य प्रसंग में חנה छावनी डालने और עַל नगर के विरुद्ध शत्रुतापूर्ण मोर्चाबंदी का भाव देता है।
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: उससे युद्ध किया
  rationale: לחם का निफ़ाल रूप युद्ध में संलग्न होने को व्यक्त करता है; हिंदी में ‘युद्ध किया’ स्वाभाविक है और עַל का विरोधात्मक संबंध बनाए रखता है।
