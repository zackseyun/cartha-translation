  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण सैन्य-वर्णन। नगर के लिए पुल्लिंग सर्वनाम हिंदी प्रयोग के अनुसार रखा गया है। स्रोत की क्रमिक वाव-रचना को पठनीयता के लिए दो वाक्यों में प्रस्तुत किया गया है।
