source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֶת לָכִ֜ישׁ בְּ/יַ֣ד יִשְׂרָאֵ֗ל וַֽ/יִּלְכְּדָ/הּ֙ בַּ/יּ֣וֹם הַ/שֵּׁנִ֔י וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֔רֶב וְ/אֶת כָּל הַ/נֶּ֖פֶשׁ אֲשֶׁר בָּ֑/הּ כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה לְ/לִבְנָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/032.yaml
  text: And Yahweh gave Lachish into the hand of Israel[a], and he captured it on the second day and struck it with the edge of the sword, along with every person who was in it, just as he had done to Libnah.
translation:
  language: hi
  text: और यहोवा ने लाकीश को इस्राएल के हाथ में कर दिया। उसने दूसरे दिन उस पर अधिकार कर लिया और तलवार की धार से उस नगर का संहार कर दिया, साथ ही उसमें रहने वाले हर व्यक्ति का भी, ठीक जैसे उसने लिब्ना के साथ किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित और सामान्य पाठकों के लिए पहचाना जाने वाला परमेश्वर का व्यक्तिगत नाम।
- source_word: וַיִּתֵּן ... בְּיַד
  choice: हाथ में कर दिया
  rationale: किसी को दूसरे के अधिकार में सौंपने वाले इब्रानी मुहावरे की छवि और अर्थ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: לָכִישׁ
  choice: लाकीश
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַיִּלְכְּדָהּ
  choice: उस नगर पर अधिकार कर लिया
  rationale: सैन्य प्रसंग में किसी नगर को जीतकर अपने नियंत्रण में लेने का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: दूसरे दिन
  rationale: काल-संबंधी विवरण का सीधा अनुवाद; इसे अनावश्यक रूप से 'अगले दिन' नहीं बनाया गया।
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: उसे ... तलवार की धार से मार डाला
  rationale: נכה और 'तलवार के मुँह/धार' के संयुक्त सैन्य मुहावरे का अर्थ स्पष्ट करता है और तलवार की धार की मूल छवि बनाए रखता है।
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: उसमें रहने वाले हर व्यक्ति
  rationale: यहाँ נֶפֶשׁ जीवित मानव व्यक्तियों के लिए सामूहिक रूप में प्रयुक्त है; 'प्राण' आधुनिक पाठक को भ्रामक शरीर-आत्मा भेद की ओर ले जा सकता है।
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלִבְנָה
  choice: ठीक वैसे ही जैसे उसने लिब्ना के साथ किया था
  rationale: तुलना को स्वाभाविक हिन्दी में व्यक्त करते हुए इब्रानी के एकवचन कर्ता को बनाए रखता है।
theological_decisions:
- issue: विजय-वर्णन में नगर के निवासियों के मारे जाने की अभिव्यक्ति
  choice: उसमें रहने वाले हर व्यक्ति को ... मार डाला
  alternative: उसमें रहने वाले हर प्राण को मारा
  rationale: मूल की कठोरता को नरम किए बिना נֶפֶשׁ का प्रसंगानुकूल मानव-सामूहिक अर्थ स्पष्ट किया गया है।
- issue: अंतिम तुलना-वाक्य में कर्ता की संख्या
  choice: जैसे उसने ... किया था
  alternative: जैसे उन्होंने ... किया था
  rationale: इब्रानी क्रिया एकवचन है; सम्भवतः यह यहोशू को प्रतिनिधि अगुवा के रूप में सामने रखती है। इसलिए सामूहिक बहुवचन से इसे चुपचाप नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। वाक्य को सहज बनाने के लिए दूसरे खंड में 'उस नगर' कहा गया है। मूल में कोई ऐसी पाठगत या अर्थगत कठिनाई नहीं जो प्रकाशन-पाठ में फुटनोट अनिवार्य करे।
