  text: And Joshua said[a], “Roll large stones to the mouth of the cave[b], and appoint men over it to guard it.”
translation:
  language: hi
  text: तब यहोशू ने कहा, “गुफा के मुँह पर बड़े पत्थर लुढ़का दो और उनकी रखवाली करने के लिए उसके पास पुरुषों को तैनात कर दो[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘उनकी रखवाली करने के लिए’ है। ‘उनकी’ पुल्लिंग बहुवचन है और संभवतः गुफा के भीतर बंद राजाओं की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक कथात्मक क्रम व्यक्त करता है, बिना समय-संबंध को अनावश्यक रूप से विशिष्ट बनाए।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित और मूल नाम के निकट रूप।
- source_word: גֹּלּוּ
  choice: लुढ़का दो
  rationale: גלל का बहुवचन आदेश पत्थरों को लुढ़काने की ठोस क्रिया बताता है।
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: बड़े-बड़े पत्थर
  rationale: पत्थरों के बड़े आकार को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֶל פִּי הַמְּעָרָה
  choice: गुफा के मुँह पर
  rationale: मूल के ‘गुफा के मुँह’ रूपक को बनाए रखता है; ‘पर’ यहाँ पत्थरों को द्वार पर लगाकर बंद करने के प्रसंग में स्वाभाविक है।
- source_word: וְהַפְקִידוּ
  choice: तैनात कर दो
  rationale: हिफ़ील रूप लोगों को किसी जिम्मेदारी पर नियुक्त या तैनात करने का भाव देता है; पहरे के प्रसंग में यह स्वाभाविक है।
- source_word: עָלֶיהָ
  choice: वहाँ
  rationale: स्त्रीलिंग एकवचन प्रत्यय गुफा की ओर संकेत करता है; हिन्दी में ‘वहाँ’ स्थानगत अर्थ को स्पष्ट और सहज रखता है।
- source_word: אֲנָשִׁים
  choice: कुछ पुरुषों को
  rationale: אֲנָשִׁים का लैंगिक अर्थ ‘पुरुष’ रखा गया है; हिन्दी में अनिश्चित बहुवचन को स्वाभाविक बनाने के लिए ‘कुछ’ जोड़ा गया है।
- source_word: לְשָׁמְרָם
  choice: उनकी निगरानी के लिए
  rationale: मसोराई पाठ का पुल्लिंग बहुवचन कर्म-प्रत्यय गुफा से मेल नहीं खाता और प्रसंगतः भीतर बंद राजाओं को सूचित करता है; हिन्दी वाक्य में इसका संदर्भ पादटिप्पणी से स्पष्ट किया गया है।
