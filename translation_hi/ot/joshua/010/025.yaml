source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ יְהוֹשֻׁ֔עַ אַל תִּֽירְא֖וּ וְ/אַל תֵּחָ֑תּוּ חִזְק֣וּ וְ/אִמְצ֔וּ כִּ֣י כָ֗כָה יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל אֹ֣יְבֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם נִלְחָמִ֥ים אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/025.yaml
  text: And Joshua said to them[a], “Do not fear and do not be dismayed. Be strong and courageous, for thus Yahweh will do to all your enemies against whom you are fighting.”
translation:
  language: hi
  text: तब यहोशू ने उनसे कहा, “न डरो और न हताश हो[a]। मज़बूत और साहसी बनो, क्योंकि याहवे तुम्हारे उन सभी शत्रुओं के विरुद्ध ऐसा ही करेगा जिनसे तुम लड़ रहे हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भय से टूट मत जाओ।”
    reason: חתת के निफ़ल रूप में भय अथवा निराशा से टूट जाने का अधिक प्रबल, लगभग शाब्दिक भाव भी संभव है।
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְהוֹשֻׁעַ
  choice: तब यहोशू ने उनसे कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है। नाम יְהוֹשֻׁעַ का मानक हिन्दी रूप ‘यहोशू’ रखा गया है।
- source_word: אַל תִּירְאוּ
  choice: न डरो
  rationale: निषेधात्मक बहुवचन आज्ञा और ירא के ‘डरना’ अर्थ को सीधी, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאַל תֵּחָתּוּ
  choice: और न हताश हो
  rationale: Niphal रूप यहाँ भय से टूट जाने, निरुत्साहित या व्याकुल हो जाने का भाव रखता है। ‘हताश हो’ पहले निषेध से अर्थगत भेद रखते हुए आधुनिक हिन्दी में स्वाभाविक है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: חִזְקוּ וְאִמְצוּ
  choice: मज़बूत और साहसी बनो
  rationale: दोनों बहुवचन आदेशों में क्रमशः शक्ति और दृढ़ साहस का भाव सुरक्षित रहता है। यह आधुनिक पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: כִּי כָכָה
  choice: क्योंकि ... ऐसा ही
  rationale: כִּי exhortation का कारण प्रस्तुत करता है और כָכָה सामने दिखाए गए नमूने की ओर संकेत करता है; ‘क्योंकि ... ऐसा ही’ दोनों कार्यों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יַעֲשֶׂה יְהוָה
  choice: याहवे ... करेगा
  rationale: yiqtol को प्रसंगानुसार भविष्यकाल में लिया गया है और परमेश्वर के निज नाम को लिप्यंतरित किया गया है।
- source_word: לְכָל אֹיְבֵיכֶם
  choice: तुम्हारे उन सभी शत्रुओं के साथ
  rationale: עשה לְ का आशय शत्रुओं के प्रति वही कार्य करना है; ‘के साथ ... करेगा’ हिन्दी में इस संबंध को स्पष्ट करता है।
- source_word: אֲשֶׁר אַתֶּם נִלְחָמִים אוֹתָם
  choice: जिनसे तुम लड़ रहे हो
  rationale: हिब्रू के संबंधवाचक वाक्य और लड़ाई के विरोधात्मक संबंध को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के निज नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में टेट्राग्राम יְהוָה स्पष्ट रूप से है। ‘याहवे’ उसका सीधा हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। बहुवचन संबोधन हिन्दी में रूपतः अस्पष्ट है, पर प्रसंग और ‘उनसे’ उसे स्पष्ट करते हैं।
