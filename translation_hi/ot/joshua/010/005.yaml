base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/005.yaml
  text: So the five kings of the Amorites—the king of Jerusalem[a], the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon—gathered together and went up, they and all their armies; and they encamped against Gibeon and fought against it.
translation:
  language: hi
  text: तब एमोरियों के पाँच राजा—यरूशलेम का राजा, हेब्रोन का राजा, यर्मूत का राजा, लाकीश का राजा और एग्लोन का राजा—इकट्ठे हुए और वे अपनी सारी सेनाओं[a] के साथ चढ़ गए। उन्होंने गिबोन के विरुद्ध छावनी डाली और उससे युद्ध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनकी सारी छावनियाँ।” यहाँ इब्रानी शब्द सैन्य छावनियों अथवा सैन्य दलों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: इकट्ठे हुए
  rationale: निफ़अल रूप सामूहिक रूप से एकत्र होने का भाव देता है; यह सैन्य गठबंधन जैसी अतिरिक्त व्याख्या जोड़े बिना अर्थ स्पष्ट करता है।
- source_word: וַיַּעֲלוּ
  choice: चढ़ आए
  rationale: עלה के मूल ‘ऊपर जाना/चढ़ना’ भाव को बनाए रखता है और यहाँ भूगोल अथवा पारंपरिक दिशासूचक प्रयोग—दोनों की संभावना खुली छोड़ता है।
- source_word: חֲמֵשֶׁת מַלְכֵי הָאֱמֹרִי
  choice: एमोरियों के पाँच राजा
  rationale: इब्रानी की संबंध-संरचना और जातीय पहचान दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: מֶלֶךְ יְרוּשָׁלִַם ... מֶלֶךְ עֶגְלוֹן
  choice: यरूशलेम का राजा ... एग्लोन का राजा
  rationale: मूल पाठ की तरह प्रत्येक शासक के साथ ‘राजा’ दोहराया गया है, ताकि जानबूझकर की गई अलग-अलग गणना बनी रहे।
- source_word: הֵם וְכָל מַחֲנֵיהֶם
  choice: अपनी सारी सेनाओं समेत
  rationale: מַחֲנֶה का शाब्दिक अर्थ ‘छावनी’ है, पर सैन्य संदर्भ में यह छावनी में उपस्थित सेना अथवा सैन्य दलों को सूचित करता है। सहज हिन्दी के लिए ‘सेनाओं’ चुना गया और ठोस शाब्दिक रूप पादटिप्पणी में रखा गया।
- source_word: וַיַּחֲנוּ עַל גִּבְעוֹן
  choice: गिबोन के विरुद्ध छावनी डाली
  rationale: इसके तुरंत बाद युद्ध का उल्लेख होने के कारण עַל को केवल स्थानसूचक न मानकर विरोधसूचक ‘के विरुद्ध’ अनूदित किया गया है।
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: उससे युद्ध किया
  rationale: स्त्रीलिंग प्रत्यय नगर गिबोन को सूचित करता है; हिन्दी में नगर के लिए स्वाभाविक सर्वनाम ‘उससे’ है।
