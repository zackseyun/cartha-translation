base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/015.yaml
  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: hi
  text: तब यहोशू और उसके साथ समस्त इस्राएल गिलगाल की छावनी में लौट आए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गिलगाल लौटने का ऐसा ही कथन यहोशू 10:43 में मिलता है। कुछ व्याख्याकार इस पद को आगे होने वाली घटना का पूर्वसंकेत या अपने मूल स्थान से हटे हुए पाठ के रूप में देखते हैं; पर यहाँ हिब्रू पाठ का अनुवाद उसी रूप में किया गया है, जैसा वह उपलब्ध है।
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: तब ... लौट आए
  rationale: שׁוב का वय्यिक्तोल रूप क्रमिक कथात्मक क्रिया बताता है। ‘लौट आए’ पहले के स्थान की ओर वापसी को स्वाभाविक हिन्दी में व्यक्त करता है; बहुवचन क्रिया संयुक्त कर्ता ‘यहोशू और ... इस्राएल’ के अनुसार है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: וְכָל יִשְׂרָאֵל
  choice: और उसके साथ समस्त इस्राएल
  rationale: ‘समस्त इस्राएल’ हिब्रू के सामूहिक भाव को बनाए रखता है और इसे केवल सैनिकों या प्रत्येक इस्राएली व्यक्ति तक सीमित नहीं करता।
- source_word: עִמּוֹ
  choice: उसके साथ
  rationale: עם और तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का सीधा और स्वाभाविक अनुवाद।
- source_word: אֶל הַמַּחֲנֶה
  choice: छावनी में
  rationale: מַחֲנֶה यहाँ सैन्य पड़ाव है; ‘छावनी’ आधुनिक हिन्दी में इस प्रसंग को स्पष्ट करती है। गमनसूचक אֶל के साथ हिन्दी में ‘छावनी में लौट आए’ स्वाभाविक है।
- source_word: הַגִּלְגָּלָה
  choice: गिलगाल की
  rationale: स्थाननाम पर दिशासूचक הָ गति को गिलगाल की ओर दर्शाता है। ‘गिलगाल की छावनी में’ लक्ष्य और छावनी के स्थान दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: कथा में इस कथन का स्थान और यहोशू 10:43 से इसकी समानता
  choice: मसोरेटिक हिब्रू पाठ को यथास्थान अनूदित किया गया है।
  alternative: कुछ व्याख्याकार इसे आगे होने वाली वापसी का पूर्वसंकेत या अपने मूल स्थान से हटे हुए कथन के रूप में देखते हैं।
  rationale: मुख्य पाठ साहित्यिक या पाठालोचनात्मक प्रश्न को स्वयं हल नहीं करता। इसलिए प्राप्त हिब्रू पाठ को बिना हटाए या सामंजस्य बैठाए प्रस्तुत किया गया है और प्रश्न को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘समस्त इस्राएल’ मूल के सामूहिक और संभावित रूप से व्यापक अर्थ को सुरक्षित रखता है; ‘छावनी’ सैन्य प्रसंग के अनुकूल है।
