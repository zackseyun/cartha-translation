  yaml_path: translation/ot/joshua/010/026.yaml
  text: After this Joshua struck them down and put them to death[a], and he hanged them on five trees; and they remained hanging on the trees until the evening.
translation:
  language: hi
  text: इसके बाद यहोशू ने उन पर प्रहार किया और उन्हें मार डाला। फिर उसने उन्हें पाँच पेड़ों पर लटका दिया[a], और वे शाम तक उन पेड़ों पर लटके रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “टाँग दिया।” इब्रानी क्रिया का अर्थ किसी व्यक्ति या शव को पेड़ अथवा लकड़ी पर लटकाना है; “खूँटे पर चढ़ा दिया” भी संभव है, पर यहाँ यह अर्थ कम निश्चित है।
    reason: lexical_alternative
