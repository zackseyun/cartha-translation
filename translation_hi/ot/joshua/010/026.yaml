- source_word: וַיִּהְיוּ תְּלוּיִם
  choice: वे ... लटके रहे
  rationale: היה और कर्मवाच्य कृदन्त का मेल लगातार बनी हुई अवस्था को दिखाता है, जिसे ‘लटके रहे’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: प्रदर्शन की अवधि का अंतिम समय बताता है; ‘सूर्यास्त तक’ की अपेक्षा यह मूल के अधिक निकट है।
theological_decisions:
- issue: दंड-प्रदर्शन के प्रसंग में עֵץ का अनुवाद
  choice: पेड़
  alternative: लकड़ी के खंभे / फाँसी के ढाँचे
  rationale: मूल शब्द सामान्यतः पेड़ या लकड़ी को दर्शाता है और यहाँ किसी विशिष्ट दंड-विधि या ढाँचे को निश्चित नहीं करता। ‘पेड़’ स्रोत की अस्पष्टता को बनाए रखता है।
