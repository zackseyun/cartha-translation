- source_word: וַיְמִיתֵם
  choice: उन्हें मार डाला
  rationale: מות के हिफ़ील रूप का कारणवाचक अर्थ स्पष्ट करता है और यहाँ मृत्युदंड के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּתְלֵם
  choice: उन्हें ... लटका दिया
  rationale: תלה किसी व्यक्ति या शव को पेड़ अथवा लकड़ी पर लटकाने को दर्शाता है। ‘खूँटे पर चढ़ा दिया’ विधि को आवश्यकता से अधिक निश्चित कर देगा।
- source_word: עַל חֲמִשָּׁה עֵצִים
