source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א מֵ/הֶ֔ם כִּ֥י בְ/יָדְ/ךָ֖ נְתַתִּ֑י/ם לֹֽא יַעֲמֹ֥ד אִ֛ישׁ מֵ/הֶ֖ם בְּ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/008.yaml
  text: And Yahweh said to Joshua, “Do not fear them, for I have given them into your hand. Not a man among them will stand before you.”
translation:
  language: hi
  text: और याहवे ने यहोशू से कहा, “उनसे मत डरो, क्योंकि मैंने उन्हें तुम्हारे हाथ में दे दिया है। उनमें से कोई भी पुरुष तुम्हारे सामने ठहर न सकेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिंदी लिप्यंतरण ‘यहोवा’ द्वारा व्यक्त किया गया है।
- source_word: אַל תִּירָא מֵהֶם
  choice: उनसे मत डर
  rationale: हिब्रू निषेध और ירא के साथ מן द्वारा सूचित भय के विषय को स्वाभाविक तथा संक्षिप्त हिंदी में व्यक्त करता है।
- source_word: כִּי בְיָדְךָ נְתַתִּים
  choice: क्योंकि मैंने उन्हें तेरे हाथ में कर दिया है
  rationale: ‘हाथ में देना’ वाला हिब्रू बिंब सुरक्षित रहता है और अधिकार में सौंपे जाने का अर्थ स्पष्ट है; पूर्ण क्रिया को वर्तमान-संबद्ध पूर्णता के रूप में रखा गया है।
- source_word: לֹא יַעֲמֹד אִישׁ מֵהֶם
  choice: उनमें से एक भी पुरुष ... टिक नहीं पाएगा
  rationale: सैनिक संदर्भ में אִישׁ का पुरुषवाचक अर्थ रखा गया है; ‘टिक नहीं पाएगा’ यहाँ सफलतापूर्वक सामना न कर पाने का स्वाभाविक हिंदी सैन्य प्रयोग है।
- source_word: בְּפָנֶיךָ
  choice: तेरे सामने
  rationale: हिब्रू के स्थानात्मक बिंब को सुरक्षित रखते हुए संदर्भगत अर्थ—यहोशू का सामना करके टिकना—स्वाभाविक हिंदी में व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ हिंदी पाठकों में इस नाम का स्थापित लिप्यंतरण है।
- issue: אִישׁ का लिंग-सूचक अनुवाद
  choice: पुरुष
  alternative: कोई भी; एक भी व्यक्ति
  rationale: यहाँ संदर्भ शत्रु सेनानियों का है, इसलिए मूल का पुल्लिंग संदर्भ बनाए रखना उचित है।
- issue: נְתַתִּים के पूर्ण रूप का कालगत बल
  choice: मैंने ... कर दिया है
  alternative: मैं ... कर दूँगा; मैं ... देता हूँ
  rationale: ईश्वरीय घोषणा भविष्य की विजय को निश्चित और मानो संपन्न बताती है; हिंदी पूर्णकाल इस निश्चितता और वर्तमान प्रासंगिकता दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिंदी है। यहोवा का यहोशू से एकवचन निकट संबोधन होने के कारण ‘तेरे/तू’ के अनुरूप रूप रखे गए हैं। ‘टिक नहीं पाएगा’ शाब्दिक ‘खड़ा नहीं होगा’ की अपेक्षा सैन्य संदर्भ का आशय अधिक स्वाभाविक ढंग से देता है।
