  yaml_path: translation/ot/joshua/010/029.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Makkedah to Libnah and fought against Libnah.
translation:
  language: hi
  text: तब यहोशू और उसके साथ समस्त इस्राएल मक्केदा से आगे बढ़कर लिब्ना गए और लिब्ना के विरुद्ध युद्ध किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: आगे बढ़कर ... गए
  rationale: עבר यहाँ सैन्य अभियान में एक स्थान से अगले स्थान की ओर बढ़ने को बताता है; यह प्रयोग किसी नदी को पार करने का अनावश्यक संकेत दिए बिना आगे की यात्रा व्यक्त करता है।
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: और उसके साथ समस्त इस्राएल
  rationale: यह वाक्यांश यहोशू के साथ पूरे इस्राएली सैन्य समुदाय की संगति को सीधे बनाए रखता है।
- source_word: מִמַּקֵּדָה
  choice: मक्केदा से
  rationale: מן उपसर्ग प्रस्थान-बिंदु दर्शाता है; स्थान-नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: לִבְנָה
  choice: लिब्ना गए
  rationale: गति के संदर्भ में ל गंतव्य को दर्शाता है; स्थान-नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: וַיִּלָּחֶם
  choice: युद्ध किया
  rationale: निफ़अल रूप यहाँ लड़ने या युद्ध करने के अर्थ में है; हिंदी कथात्मक शैली में 'युद्ध किया' स्वाभाविक और गरिमापूर्ण है।
- source_word: עִם לִבְנָה
  choice: लिब्ना के विरुद्ध
  rationale: לחם के बाद עִם मुहावरेदार रूप से युद्ध के प्रतिपक्ष को सूचित करता है; हिंदी में विरोधी संबंध स्पष्ट करने के लिए 'के विरुद्ध' उपयुक्त है।
