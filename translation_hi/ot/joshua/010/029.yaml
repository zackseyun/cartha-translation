  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली रखी गई है। 'समस्त इस्राएल' मूल के כָל יִשְׂרָאֵל को सामूहिक अर्थ में व्यक्त करता है। किसी पादटिप्पणी की आवश्यकता नहीं, क्योंकि युद्ध-संबंधी मुहावरा हिंदी मुख्य पाठ में स्वाभाविक रूप से स्पष्ट है।
