base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/035.yaml
  text: And they captured it that day and struck it with the edge of the sword[a], and every person who was in it he devoted to destruction that day[b], according to all that he had done to Lachish.
translation:
  language: hi
  text: और उन्होंने उसी दिन उस नगर पर अधिकार कर लिया और उसे तलवार की धार से मारा। उसमें रहने वाले हर व्यक्ति को यहोशू ने उसी दिन विनाश के लिए समर्पित कर दिया[a], ठीक वैसा ही जैसा उसने लाकीश के साथ किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरी तरह नष्ट कर दिया।” इब्रानी क्रिया का अर्थ किसी व्यक्ति या वस्तु को विनाश के लिए समर्पित करना, अर्थात हेरम के अधीन करना, है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: उन्होंने उस नगर पर अधिकार कर लिया
  rationale: לכד सैन्य प्रसंग में नगर को जीत लेने या अपने अधिकार में कर लेने को दर्शाता है। स्त्रीलिंग सर्वनाम का पूर्वपद एग्लोन नगर है; हिन्दी में स्पष्टता के लिए ‘उस नगर’ कहा गया है।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: यह स्वाभाविक हिन्दी है और उस दिन ही नगर-विजय तथा विनाश होने पर दिए गए बल को बनाए रखती है।
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: उसे तलवार की धार से मारा
  rationale: לְפִי חֶרֶב का चित्रात्मक अर्थ ‘तलवार की धार से’ है। यह इब्रानी मुहावरे को समझने योग्य हिन्दी में निकटता से सुरक्षित रखता है।
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: उसमें रहने वाले हर प्राणी को
  rationale: נֶפֶשׁ यहाँ नगर में रहने वाले प्रत्येक जीवित व्यक्ति का बोध कराता है, न कि शरीर से पृथक आत्मा का। ‘हर प्राणी’ मूल के सामूहिक एकवचन और जीवित व्यक्ति के अर्थ को बनाए रखता है।
- source_word: הֶחֱרִים
  choice: विनाश के लिए अर्पित कर दिया
  rationale: חרם के हिफ़ील रूप में किसी को पवित्र प्रतिबंध के अधीन विनाश के लिए समर्पित करने का विशेष भाव है; यह चयन केवल ‘नष्ट किया’ कहने की अपेक्षा उस तकनीकी अर्थ को अधिक सुरक्षित रखता है।
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלָכִישׁ
  choice: ठीक वैसा ही जैसा उसने लाकीश के साथ किया था
  rationale: כְּכֹל पूर्व में लाकीश के साथ की गई पूरी कार्रवाई से अनुरूपता दर्शाता है। हिन्दी में यह रूप स्वाभाविक है और עָשָׂה के पुल्लिंग एकवचन को ‘उसने’ से बनाए रखता है।
theological_decisions:
- issue: विजय-वर्णन में חרם/החרים का अनुवाद
  choice: विनाश के लिए अर्पित कर दिया
  alternative: पूरी तरह नष्ट कर दिया; प्रतिबंध के अधीन कर दिया
  rationale: क्रिया में केवल मार डालने से अधिक, विनाश के लिए समर्पित करने का धार्मिक-सैन्य भाव है। चुना हुआ अनुवाद उस तनाव को बिना अतिरिक्त सांप्रदायिक व्याख्या के बनाए रखता है।
- issue: הֶחֱרִים और עָשָׂה के एकवचन कर्ता की पहचान
  choice: मुख्य पाठ में ‘यहोशू ने’ और फिर ‘उसने’
  alternative: उन्होंने
  rationale: दोनों क्रियाएँ तीसरे पुरुष पुल्लिंग एकवचन में हैं और निकटवर्ती कथानक में उनका कर्ता यहोशू है। नाम स्पष्ट करने से हिन्दी में अचानक आए एकवचन का संदर्भ साफ होता है, जबकि सामूहिक सैन्य कार्रवाई और यहोशू की प्रतिनिधिक भूमिका के बीच मूल का व्याकरणिक बदलाव सुरक्षित रहता है।
- issue: נֶפֶשׁ का मानव-समुदाय संबंधी अर्थ
  choice: प्राणी
  alternative: व्यक्ति; जीव; प्राण
  rationale: यहाँ शब्द नगर के जीवित निवासियों को सूचित करता है। ‘आत्मा’ कहना ऐसा मनुष्य-विज्ञान संबंधी अर्थ ला सकता है जिसे यह प्रसंग व्यक्त नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। ‘उस नगर’ से इब्रानी स्त्रीलिंग सर्वनाम का संदर्भ स्पष्ट किया गया है। सामूहिक बहुवचन ‘उन्होंने’ से एकवचन ‘यहोशू ने’ की ओर मूल पाठ में आया व्याकरणिक परिवर्तन जानबूझकर सुरक्षित रखा गया है।
