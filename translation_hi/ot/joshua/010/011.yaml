  text: וַ/יְהִ֞י בְּ/נֻסָ֣/ם מִ/פְּנֵ֣י יִשְׂרָאֵ֗ל הֵ֞ם בְּ/מוֹרַ֤ד בֵּית חוֹרֹן֙ וַֽ/יהוָ֡ה הִשְׁלִ֣יךְ עֲלֵי/הֶם֩ אֲבָנִ֨ים גְּדֹל֧וֹת מִן הַ/שָּׁמַ֛יִם עַד עֲזֵקָ֖ה וַ/יָּמֻ֑תוּ רַבִּ֗ים אֲשֶׁר מֵ֨תוּ֙ בְּ/אַבְנֵ֣י הַ/בָּרָ֔ד מֵ/אֲשֶׁ֥ר הָרְג֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל בֶּ/חָֽרֶב׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/011.yaml
  text: And as they fled before Israel[a], while they were on the descent of Beth-horon, Yahweh threw large stones from heaven on them as far as Azekah, and they died. More died from the hailstones than the sons of Israel killed with the sword.
translation:
  language: hi
  text: जब वे इस्राएलियों के सामने से भाग रहे थे और बेथ-होरोन की उतराई पर थे, तब याहवे ने स्वर्ग से उन पर अजेका तक बड़े-बड़े पत्थर फेंके, और वे मर गए। इस्राएलियों ने तलवार से जितनों को मारा था, उससे अधिक लोग ओलों से मरे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֻסָם מִפְּנֵי יִשְׂרָאֵל
  choice: जब वे इस्राएलियों के सामने से भाग रहे थे
  rationale: ב prefixed infinitive construct contemporaneous action व्यक्त करता है। מִפְּנֵי यहाँ शत्रु के सामने से पीछे हटने का मुहावरा है; आधुनिक हिन्दी में जातिवाचक 'इस्राएलियों' से आशय स्पष्ट रहता है।
- source_word: בְּמוֹרַד בֵּית חוֹרֹן
  choice: बेथ-होरोन की उतराई पर
  rationale: מוֹרָד नीचे उतरते ढाल या मार्ग को दर्शाता है; 'उतराई' स्थलाकृतिक विशेषता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיהוָה
  choice: यहोवा
  rationale: इब्रानी पाठ में आए वाचा-नाम יהוה को उसके पारंपरिक हिन्दी रूप 'यहोवा' से व्यक्त किया गया है।
- source_word: הִשְׁלִיךְ עֲלֵיהֶם
  choice: उन पर ... बरसाए
  rationale: हִשְׁלִיךְ का मूल अर्थ फेंकना/डालना है; आकाश से अनेक पत्थरों के संदर्भ में 'बरसाए' लक्ष्य पर ऊपर से गिराने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: बड़े-बड़े पत्थर
  rationale: पहले उल्लेख में वस्तुओं को सामान्यतः पत्थर कहा गया है; हिन्दी पुनरुक्ति आकार और बहुवचन पर स्वाभाविक बल देती है।
- source_word: מִן הַשָּׁמַיִם
  choice: आकाश से
  rationale: यहाँ שָׁמַיִם ऊपर के दृश्यमान आकाश को भी दर्शाता है, जहाँ से ओले आते हैं; दिव्य कर्ता 'यहोवा' वाक्य में स्पष्ट है।
- source_word: עַד עֲזֵקָה
  choice: अजेका तक
  rationale: עַד तूफ़ानी प्रहार के स्थानिक विस्तार को चिह्नित करता है।
- source_word: בְּאַבְנֵי הַבָּרָד
  choice: ओलों के पत्थरों से
  rationale: शाब्दिक संरचना 'ओलों के पत्थर' पहले आए 'पत्थरों' से शब्दगत संबंध बनाए रखती है और बाद में उनकी प्रकृति स्पष्ट करती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह स्थापित इब्रानी जातिवाचक पद है; आधुनिक हिन्दी में 'इस्राएली' 'इस्राएल के पुत्रों' से अधिक सहज और सामूहिक आशय में सटीक है।
- source_word: בֶּחָרֶב
  choice: तलवार से
  rationale: करणवाचक ב को हिन्दी के करण-चिह्न 'से' द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को उपाधि 'प्रभु' से नहीं बदला गया। 'यहोवा' आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नामरूप है।
- issue: आकाशीय प्रहारों की प्रकृति
  choice: पहले 'बड़े-बड़े पत्थर', फिर 'ओलों के पत्थर'
  alternative: दोनों स्थानों पर सीधे 'बड़े-बड़े ओले'
  rationale: इब्रानी वर्णन पहले उन्हें बड़े पत्थर कहता है और बाद में ओलों के पत्थर के रूप में पहचानता है; यह प्रगति सुरक्षित रखी गई है।
- issue: בְּנֵי יִשְׂרָאֵל का जातिवाचक अर्थ
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: संदर्भ में पद इस्राएली युद्धदल/लोगों का स्थापित जातिवाचक नाम है, जैविक पुत्रत्व पर बल नहीं देता।
translation_notes:
  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। स्थलनामों के लिए 'बेथ-होरोन' और 'अजेका' रूप अपनाए गए हैं। मुख्य पाठ में कोई पादटिप्पणी आवश्यक नहीं मानी गई।
