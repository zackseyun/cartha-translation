reference: Joshua 10:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּשֻׁבוּ֩ כָל הָ/עָ֨ם אֶל הַ/מַּחֲנֶ֧ה אֶל יְהוֹשֻׁ֛עַ מַקֵּדָ֖ה בְּ/שָׁל֑וֹם לֹֽא חָרַ֞ץ לִ/בְנֵ֧י יִשְׂרָאֵ֛ל לְ/אִ֖ישׁ אֶת לְשֹׁנֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/021.yaml
  text: And all the people returned to the camp[a], to Joshua at Makkedah, in peace. No one moved his tongue against any of the sons of Israel.
translation:
  language: hi
  text: तब सब लोग सकुशल मक्केदा की छावनी में यहोशू के पास लौट आए। इस्राएलियों में से किसी के विरुद्ध किसी ने भी अपनी जीभ नहीं चलाई[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों में से किसी के विरुद्ध किसी ने एक शब्द भी न कहा।” इब्रानी में शाब्दिक चित्र है, “किसी ने अपनी जीभ पैनी नहीं की।”
    reason: मुहावरे का सहज अर्थ और उसका शाब्दिक चित्र दोनों बताने के लिए।
lexical_decisions:
- source_word: וַיָּשֻׁבוּ כָל הָעָם
  choice: तब सब लोग ... लौट आए
  rationale: שׁוּב यहाँ पीछा करने के बाद वास्तविक रूप से वापस आने को बताता है। כָל הָעָם का सीधा और स्वाभाविक सामूहिक अनुवाद ‘सब लोग’ है; प्रसंग सैन्य है, पर עָם स्वयं तकनीकी रूप से ‘सेना’ नहीं है।
- source_word: אֶל הַמַּחֲנֶה אֶל יְהוֹשֻׁעַ מַקֵּדָה
  choice: मक्केदा की छावनी में यहोशू के पास
  rationale: इब्रानी में स्थान-सूचक पद संक्षिप्त रूप से एक के बाद एक आए हैं। हिन्दी में यह क्रम स्पष्ट करता है कि लोग मक्केदा स्थित छावनी में यहोशू के पास लौटे, बिना पाठ में कोई नया स्थान जोड़े।
- source_word: בְּשָׁלוֹם
  choice: सकुशल
  rationale: यहाँ שָׁלוֹם लौटने वालों के सुरक्षित और अहानिकर लौट आने का भाव देता है। ‘सकुशल’ आधुनिक हिन्दी में इस प्रसंग के लिए स्वाभाविक है और ‘शान्ति से’ की सम्भावित भ्रामकता से बचाता है।
- source_word: לֹא חָרַץ ... אֶת לְשֹׁנוֹ
  choice: किसी ने अपनी जीभ तक न चलाई
  rationale: חָרַץ לָשׁוֹן विरोधी या धमकीपूर्ण वचन बोलने का चित्रात्मक मुहावरा है। हिन्दी का ‘जीभ चलाना’ उसी वाचिक चित्र को स्वाभाविक ढंग से बनाए रखता है; ‘तक’ पूर्ण निषेध को उभारता है।
- source_word: לִבְנֵי יִשְׂרָאֵל לְאִישׁ
  choice: इस्राएलियों में से किसी के विरुद्ध
  rationale: בני ישראל मानक राष्ट्रीय-सामुदायिक पद है। ‘इस्राएली’ आधुनिक हिन्दी में अर्थ को स्पष्ट और स्वाभाविक रखता है, जबकि לְאִישׁ के साथ नकार का अर्थ ‘किसी के विरुद्ध’ है।
theological_decisions:
- issue: בני ישראל के लिंग-चिह्नित सामुदायिक पद का अनुवाद
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यह पद यहाँ वंशगत/राष्ट्रीय समुदाय का रूढ़ नाम है, केवल पुरुष सदस्यों पर बल देने वाला कथन नहीं। ‘इस्राएलियों’ से सामुदायिक अर्थ स्वाभाविक हिन्दी में आता है और कोई संप्रदायगत व्याख्या नहीं जोड़ी जाती।
- issue: लोगों के विरुद्ध किसी के न बोलने का आशय
  choice: जीभ तक न चलाई
  alternative: एक शब्द भी न कहा
  rationale: मुख्य पाठ में स्रोत का सजीव जीभ-वाला रूपक रखा गया है। इससे विरोधी भाषण का आशय व्यक्त होता है, पर यह अनावश्यक रूप से तय नहीं किया जाता कि बात केवल शिकायत, धमकी या निन्दा की थी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मक्केदा की छावनी’ संक्षिप्त इब्रानी स्थान-क्रम को स्पष्ट करती है; ‘सकुशल’ प्रसंगगत अर्थ देता है; और ‘जीभ तक न चलाई’ मूल रूपक तथा हिन्दी की स्वाभाविक अभिव्यक्ति दोनों को बनाए रखता है।
