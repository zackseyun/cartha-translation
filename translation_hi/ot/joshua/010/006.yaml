base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/006.yaml
  text: Then the men of Gibeon sent to Joshua[a], to the camp at Gilgal, saying, “Do not withdraw your hand from your servants. Come up to us quickly, and save us and help us, for all the kings of the Amorites who live in the hill country have gathered against us.”
translation:
  language: hi
  text: 'तब गिबोन के पुरुषों ने गिलगाल की छावनी में यहोशू के पास यह संदेश भेजा: “अपने सेवकों से अपना हाथ न खींचिए[a]। शीघ्र हमारे पास ऊपर आइए, हमें बचाइए और हमारी सहायता कीजिए, क्योंकि पहाड़ी प्रदेश में रहनेवाले एमोरियों के सभी राजा हमारे विरुद्ध इकट्ठे हो गए हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने सेवकों से अपना हाथ ढीला न कीजिए”; यह मुहावरा सहायता या समर्थन देना बंद न करने, अथवा उन्हें न छोड़ने का अर्थ देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אַנְשֵׁי גִבְעוֹן
  choice: तब गिबोन के लोगों ने ... यह संदेश भेजा
  rationale: וַיִּשְׁלְחוּ कथा की अगली घटना बताता है। אַנְשֵׁי का शाब्दिक अर्थ ‘पुरुष’ हो सकता है, पर नगर के प्रतिनिधियों या निवासियों के लिए आधुनिक हिन्दी में ‘लोगों’ अधिक स्वाभाविक है और अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּלָה
  choice: गिलगाल की छावनी में यहोशू के पास
  rationale: दोहराया गया אֶל संदेश पानेवाले और उसके स्थान दोनों को चिह्नित करता है; हिन्दी में यह क्रम स्पष्ट और स्वाभाविक है।
- source_word: אַל תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ
  choice: अपने सेवकों से अपना हाथ मत खींचिए
  rationale: रפה के साथ ‘हाथ’ सहायता या सक्रिय समर्थन रोकने का मुहावरा है। हिन्दी में ‘हाथ खींचना’ वही अर्थ स्वाभाविक रूप से व्यक्त करता है और स्रोत का बिंब भी बनाए रखता है।
- source_word: עֲלֵה אֵלֵינוּ מְהֵרָה
  choice: शीघ्र हमारे पास ऊपर आइए
  rationale: עלה भौगोलिक चढ़ाई को व्यक्त करता है—गिलगाल से पहाड़ी क्षेत्र की ओर जाना—इसलिए ‘ऊपर आइए’ रखा गया है; מְהֵרָה की तात्कालिकता ‘शीघ्र’ से व्यक्त होती है।
- source_word: וְהוֹשִׁיעָה לָּנוּ וְעָזְרֵנוּ
  choice: हमें बचाइए और हमारी सहायता कीजिए
  rationale: ישע यहाँ सैन्य संकट से बचाने और עזר सहायता देने के लिए है। दोनों अलग क्रियाओं को बनाए रखा गया है।
- source_word: כָּל מַלְכֵי הָאֱמֹרִי יֹשְׁבֵי הָהָר
  choice: पहाड़ी प्रदेश में रहनेवाले एमोरियों के सभी राजा
  rationale: הָהָר यहाँ किसी एक पहाड़ से अधिक पहाड़ी भूभाग को दर्शाता है। ‘एमोरी’ का बहुवचन हिन्दी में ‘एमोरियों’ किया गया है।
- source_word: נִקְבְּצוּ אֵלֵינוּ
  choice: हमारे विरुद्ध इकट्ठे हो गए हैं
  rationale: युद्ध-संदर्भ में אֶל शत्रुतापूर्ण दिशा दर्शाता है; ‘विरुद्ध’ इस प्रसंगगत अर्थ को स्पष्ट करता है।
