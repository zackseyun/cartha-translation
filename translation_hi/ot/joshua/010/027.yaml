source:
  edition: WLC
  text: וַ/יְהִ֞י לְ/עֵ֣ת בּ֣וֹא הַ/שֶּׁ֗מֶשׁ צִוָּ֤ה יְהוֹשֻׁ֨עַ֙ וַ/יֹּֽרִידוּ/ם֙ מֵ/עַ֣ל הָ/עֵצִ֔ים וַ/יַּ֨שְׁלִכֻ֔/ם אֶל הַ/מְּעָרָ֖ה אֲשֶׁ֣ר נֶחְבְּאוּ שָׁ֑ם וַ/יָּשִׂ֜מוּ אֲבָנִ֤ים גְּדֹלוֹת֙ עַל פִּ֣י הַ/מְּעָרָ֔ה עַד עֶ֖צֶם הַ/יּ֥וֹם הַ/זֶּֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/027.yaml
  text: And at the time of the sun’s going down[a], Joshua commanded, and they took them down from the trees and threw them into the cave where they had hidden there[b], and they placed large stones over the mouth of the cave to this very day.
translation:
  language: hi
  text: और जब सूर्य डूबने का समय हुआ[a], तब यहोशू ने आज्ञा दी। उन्होंने उन राजाओं को पेड़ों पर से उतारकर उसी गुफा में फेंक दिया जहाँ वे छिपे थे[b], और गुफा के मुँह पर बड़े-बड़े पत्थर रख दिए, जो आज के दिन तक वहीं हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात सूर्यास्त के समय।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “जहाँ वे वहाँ छिपे थे”; मूल में “वहाँ” शब्द जोर के लिए स्पष्ट रूप से मौजूद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת בּוֹא הַשֶּׁמֶשׁ
  choice: जब सूर्य डूबने का समय हुआ
  rationale: इब्रानी पदबंध सूर्य के ‘अंदर आने’ अर्थात अस्त होने के समय को चित्रात्मक ढंग से व्यक्त करता है। यह हिन्दी अनुवाद उस चित्र और समय-सूचक अर्थ दोनों को स्वाभाविक रूप में रखता है।
- source_word: צִוָּה יְהוֹשֻׁעַ
  choice: यहोशू ने आज्ञा दी
  rationale: क्रिया का सीधा अर्थ ‘आज्ञा देना’ है; आगे के बहुवचन कर्ताओं द्वारा किए गए काम इसी आज्ञा के पालन को दर्शाते हैं।
- source_word: וַיּוֹרִידוּם מֵעַל הָעֵצִים
  choice: उन्होंने उन राजाओं को पेड़ों पर से उतारकर
  rationale: हिफ़ील क्रिया नीचे उतारने की सकर्मक क्रिया बताती है। संदर्भ से सर्वनाम पाँच राजाओं को सूचित करता है; स्पष्टता के लिए ‘उन राजाओं’ कहा गया है।
- source_word: וַיַּשְׁלִכֻם
  choice: फेंक दिया
  rationale: मूल क्रिया का अर्थ ‘फेंकना’ है और शवों के साथ किए गए कठोर व्यवहार को बिना नरम किए व्यक्त करता है।
- source_word: אֶל הַמְּעָרָה
  choice: उसी गुफा में
  rationale: אֶל गति की दिशा बताता है। ‘उसी’ पिछली परिचित गुफा से संबंध स्पष्ट करता है और हिन्दी में स्वाभाविक है।
- source_word: אֲשֶׁר נֶחְבְּאוּ שָׁם
  choice: जहाँ वे छिपे थे
  rationale: שָׁם का स्थानवाची अर्थ हिन्दी के ‘जहाँ’ में स्वाभाविक रूप से समाहित है। उसे अलग से ‘वहाँ’ जोड़ना हिन्दी में अनावश्यक पुनरुक्ति पैदा करता; पादटिप्पणी मूल की स्पष्ट शब्दावली बताती है।
- source_word: וַיָּשִׂמוּ אֲבָנִים גְּדֹלוֹת
  choice: बड़े-बड़े पत्थर रख दिए
  rationale: ‘बड़े-बड़े’ पत्थरों के आकार और बहुवचन को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘रख दिए’ स्थापित करने की पूर्ण क्रिया बताता है।
- source_word: עַל פִּי הַמְּעָרָה
  choice: गुफा के मुँह पर
  rationale: मूल का ‘गुफा का मुँह’ रूपक हिन्दी में भी सामान्य और स्पष्ट है; ‘पर’ द्वारा प्रवेश को पत्थरों से ढकने का भाव बना रहता है।
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: जो आज के दिन तक वहीं हैं
  rationale: यह मुहावरा कथाकार के समय तक जारी अवस्था बताता है। हिन्दी में केवल ‘आज के दिन तक’ क्रिया के बिना अधूरा लगेगा, इसलिए पत्थरों की निरंतर उपस्थिति स्पष्ट की गई है।
theological_decisions:
- issue: अंतिम वाक्यांश में निरंतर रहने वाली वस्तु
  choice: ‘जो आज के दिन तक वहीं हैं’ को निकटतम बहुवचन संज्ञा ‘पत्थर’ से जोड़ा गया
  alternative: केवल ‘आज के दिन तक’ या पूरी व्यवस्था/स्मारक को सामान्य रूप से जारी मानना
  rationale: इब्रानी में अंतिम वाक्यांश का व्याकरणिक कर्ता व्यक्त नहीं है। संदर्भ में सबसे स्वाभाविक संबंध रखे गए बड़े पत्थरों से है, पर इसे किसी धार्मिक स्मारक-सिद्धांत के रूप में नहीं बढ़ाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण ऐतिहासिक-वर्णन शैली। छोटे वाक्य से घटनाक्रम स्पष्ट रखा गया है; हिंसक क्रियाओं को न तो बढ़ाया गया है, न नरम किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
