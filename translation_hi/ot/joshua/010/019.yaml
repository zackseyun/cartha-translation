source:
  edition: WLC
  text: וְ/אַתֶּם֙ אַֽל תַּעֲמֹ֔דוּ רִדְפוּ֙ אַחֲרֵ֣י אֹֽיְבֵי/כֶ֔ם וְ/זִנַּבְתֶּ֖ם אוֹתָ֑/ם אַֽל תִּתְּנ֗וּ/ם לָ/בוֹא֙ אֶל עָ֣רֵי/הֶ֔ם כִּ֧י נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֵי/כֶ֖ם בְּ/יֶדְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/019.yaml
  text: But as for you[a], do not stand still; pursue your enemies and strike their rear guard. Do not let them enter their cities, for Yahweh your God has given them into your hand.
translation:
  language: hi
  text: पर तुम रुके मत रहो; अपने शत्रुओं का पीछा करो और उनके पीछे के भाग पर प्रहार करो[a]। उन्हें अपने नगरों में प्रवेश न करने दो, क्योंकि तुम्हारे परमेश्वर यहोवा ने उन्हें तुम्हारे हाथ में कर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके पिछले भाग पर प्रहार करो” या “पीछे रह गए लोगों पर आक्रमण करो”; इब्रानी क्रिया भागती हुई सेना के पिछले सिरे पर वार करने को सूचित करती है।
    reason: इब्रानी וְזִנַּבְתֶּם के सैन्य, ‘पीछे के सिरे पर प्रहार’ वाले अर्थ और उसके स्वाभाविक हिन्दी विकल्पों को स्पष्ट करता है।
lexical_decisions:
- source_word: וְאַתֶּם
  choice: पर तुम
  rationale: संयोजक और स्वतंत्र सर्वनाम पिछले निर्देश के विपरीत शेष सैनिकों पर बल देते हैं; आधुनिक हिन्दी में ‘पर तुम’ इस बदलाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַל תַּעֲמֹדוּ
  choice: रुके मत रहो
  rationale: עמד का मूल बिंब ‘खड़ा रहना’ है, पर सैन्य संदर्भ में आशय पीछा रोकने से है; यह चयन बिंब और प्रसंगगत अर्थ दोनों को संप्रेषित करता है।
- source_word: רִדְפוּ אַחֲרֵי אֹיְבֵיכֶם
  choice: अपने शत्रुओं का पीछा करो
  rationale: רדף אחרי पीछा करने का सामान्य इब्रानी मुहावरा है; हिन्दी में यह सीधा और स्वाभाविक सैन्य निर्देश है।
- source_word: וְזִנַּבְתֶּם אוֹתָם
  choice: उनके पिछले दल पर प्रहार करो
  rationale: זנב मूलतः ‘पूँछ/पिछला सिरा’ से संबंधित है और भागती सेना के सबसे पीछे के भाग पर आक्रमण करने को दर्शाता है। ‘पिछला दल’ अनिवार्य रूप से औपचारिक rear guard मानने के बजाय मूल की व्यापकता बनाए रखता है।
- source_word: אַל תִּתְּנוּם לָבוֹא
  choice: उन्हें ... प्रवेश न करने दो
  rationale: נתן और infinitive का यह प्रयोग अनुमति देने के अर्थ में है; हिन्दी में यह उसका स्वाभाविक समतुल्य है।
- source_word: אֶל עָרֵיהֶם
  choice: अपने नगरों में
  rationale: עיר नगर या शहर को दर्शाता है; इस विजय-वृत्तांत में ‘नगर’ गरिमापूर्ण और सहज है। प्रत्यावर्ती ‘अपने’ का संबंध उन्हीं भागते शत्रुओं से स्पष्ट है।
- source_word: כִּי נְתָנָם
  choice: क्योंकि ... ने उन्हें ... कर दिया है
  rationale: पूर्ण क्रिया विजय को परमेश्वर द्वारा प्रभावी रूप से संपन्न तथ्य के रूप में प्रस्तुत करती है; हिन्दी पूर्णकाल इस बल को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम स्पष्ट रूप से आया है; हिन्दी बाइबलीय प्रयोग में परिचित लिप्यंतरण ‘यहोवा’ शीर्षक से प्रतिस्थापित किए बिना नाम को बनाए रखता है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर
  rationale: यह द्वितीय पुरुष बहुवचन प्रत्यय सहित सीधा संबंधसूचक रूप है।
- source_word: בְּיֶדְכֶם
  choice: तुम्हारे हाथ में
  rationale: एकवचन ‘हाथ’ अधिकार और वश का इब्रानी मुहावरा है; हिन्दी में भी यह बोधगम्य और बाइबलीय अभिव्यक्ति है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम है, इसलिए उसे ‘प्रभु’ जैसे पद से नहीं बदला गया। ‘यहोवा’ आधुनिक हिन्दी के व्यापक बाइबलीय पाठक-वर्ग के लिए परिचित नाम-रूप है; ‘याहवे’ अधिक निकट वैकल्पिक लिप्यंतरण है।
- issue: נְתָנָם בְּיֶדְכֶם में दैवी विजय की पूर्णता
  choice: ने उन्हें तुम्हारे हाथ में कर दिया है
  alternative: ने उन्हें तुम्हारे वश में कर दिया है
  rationale: मूल का पूर्ण क्रियारूप विजय को सुनिश्चित दैवी कार्य के रूप में रखता है। ‘हाथ में’ मूल मुहावरे और उसकी धर्मवैचारिक तीव्रता को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, मध्यम औपचारिक और गरिमापूर्ण शैली। सैन्य भाषा स्पष्ट रखी गई है; कठिन शाब्दिक ‘उनकी पूँछ पर प्रहार’ के स्थान पर अर्थ-सटीक ‘पिछले दल पर प्रहार’ चुना गया है।
