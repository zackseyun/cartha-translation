reference: Joshua 10:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה גַּם אוֹתָ֜/הּ בְּ/יַ֣ד יִשְׂרָאֵ֘ל וְ/אֶת מַלְכָּ/הּ֒ וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֗רֶב וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹֽא הִשְׁאִ֥יר בָּ֖/הּ שָׂרִ֑יד וַ/יַּ֣עַשׂ לְ/מַלְכָּ֔/הּ כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/030.yaml
  text: And Yahweh also gave it and its king into the hand of Israel[a], and he struck it with the edge of the sword, and every person who was in it. He left no survivor in it, and he did to its king just as he had done to the king of Jericho.
translation:
  language: hi
  text: और यहोवा ने उस नगर और उसके राजा को भी इस्राएल के हाथ में कर दिया। यहोशू ने उस नगर और उसमें रहनेवाले हर व्यक्ति को तलवार से मार डाला। उसने वहाँ एक भी जीवित व्यक्ति नहीं छोड़ा, और उसके राजा के साथ वैसा ही किया जैसा उसने यरीहो के राजा के साथ किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को सामान्य हिन्दी बाइबल परंपरा के परिचित और गरिमापूर्ण रूप में रखा गया है।
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: इस्राएल के हाथ में कर दिया
  rationale: यह चयन इब्रानी मुहावरे की 'हाथ' वाली छवि बनाए रखते हुए किसी के अधिकार में सौंप देने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אוֹתָהּ ... וְאֶת מַלְכָּהּ
  choice: उस नगर और उसके राजा को
  rationale: स्त्रीलिंग सर्वनाम का संदर्भ पिछले पद के लिब्ना नगर से है; हिन्दी में केवल 'उसे' कहने की अपेक्षा 'उस नगर' अधिक स्पष्ट है।
- source_word: וַיַּכֶּהָ
  choice: मार डाला
  rationale: युद्ध-वर्णन और आगे किसी जीवित व्यक्ति के न छोड़े जाने के कथन के संदर्भ में נכה का यहाँ घातक प्रहार का अर्थ है।
- source_word: לְפִי חֶרֶב
  choice: तलवार से
  rationale: शाब्दिक 'तलवार के मुँह/धार से' हिन्दी में अस्वाभाविक होता; प्रचलित हिन्दी मुहावरा उसी साधन और परिणाम को स्पष्ट करता है।
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: उसमें रहनेवाले हर व्यक्ति को
  rationale: נפש यहाँ नगर के प्रत्येक जीवित मनुष्य को दर्शाता है, न कि देह से अलग आत्मा के विषय में कोई सिद्धांत।
- source_word: לֹא הִשְׁאִיר ... שָׂרִיד
  choice: एक भी जीवित व्यक्ति नहीं छोड़ा
  rationale: שָׂרִיד का आशय बचे हुए जीवित व्यक्ति से है; यह रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וַיַּעַשׂ לְמַלְכָּהּ כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: उसके राजा के साथ वैसा ही किया जैसा उसने यरीहो के राजा के साथ किया था
  rationale: तुलनात्मक सूत्र और עשה की पुनरावृत्ति को स्वाभाविक हिन्दी में बनाए रखा गया है।
theological_decisions:
- issue: युद्ध के संदर्भ में נֶפֶשׁ का अर्थ
  choice: हर व्यक्ति
  alternative: हर प्राण / हर आत्मा
  rationale: यहाँ शब्द नगर के निवासियों को सूचित करता है। 'आत्मा' लिखने से ऐसा परवर्ती मानवशास्त्रीय अर्थ आ सकता है जो मूल पाठ में अभिप्रेत नहीं है।
- issue: हिंसात्मक कथन की स्पष्टता
  choice: मार डाला; एक भी जीवित व्यक्ति नहीं छोड़ा
  alternative: पराजित किया; कोई शेष न छोड़ा
  rationale: मूल के तलवार और जीवित बचे व्यक्ति के अभाव संबंधी कथनों को नरम किए बिना स्पष्ट रखा गया है, पर उनसे आगे कोई नैतिक या धार्मिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। कर्ता की संभावित अस्पष्टता से बचने के लिए दूसरे वाक्य में संदर्भानुसार 'यहोशू' स्पष्ट किया गया है; शेष सर्वनाम उसी कर्ता को दर्शाते हैं।
