  yaml_path: translation/ot/joshua/010/042.yaml
  text: Joshua captured all these kings and their land at one time[a], because Yahweh, the God of Israel, fought for Israel.
translation:
  language: hi
  text: यहोशू ने इन सभी राजाओं और उनकी भूमि को एक ही समय में[a] अपने अधिकार में कर लिया, क्योंकि इस्राएल का परमेश्वर याहवे इस्राएल के लिए लड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक ही अभियान में।” इब्रानी में शाब्दिक अर्थ “एक समय” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  choice: अपने अधिकार में कर लिया
  rationale: सैन्य प्रसंग में क्रिया का अर्थ पकड़ना या अधीन कर लेना है। राजाओं और भूमि—दोनों के साथ यह हिंदी में स्वाभाविक है और ‘जीत लिया’ की अपेक्षा मूल क्रिया के निकट रहता है।
- source_word: וְאֵת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: इन सभी राजाओं
  rationale: प्रत्यक्ष कर्म-वाक्यांश और संकेतवाचक का सीधा, स्वाभाविक अनुवाद।
- source_word: וְאֶת אַרְצָם
  choice: और उनकी भूमि
  rationale: אֶרֶץ के व्यापक अर्थ को रखता है और राजाओं के अधीन भूभाग को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פַּעַם אֶחָת
  choice: एक ही समय में
  rationale: इब्रानी का शाब्दिक अर्थ ‘एक समय’ है। प्रसंग में एक अभियान का भाव संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहोशू की सफलता का कारण स्पष्ट रूप से प्रस्तुत करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय प्रयोग में प्रचलित रूप से दिव्य व्यक्तिगत नाम को प्रस्तुत करता है, किसी उपाधि से नहीं बदलता।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धसूचक रचना का सीधा और प्रतिष्ठित हिंदी रूप।
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: इस्राएल के लिए युद्ध कर रहा था
  rationale: נלחם के युद्ध करने और ל के हितार्थ भाव को सुरक्षित रखता है। इब्रानी कृदंतात्मक रूप यहाँ इस सफलता की आधारभूत, जारी गतिविधि को सूचित कर सकता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय दिव्य नाम सीधे आया है। हिंदी के व्यापक बाइबलीय पाठक-वर्ग के लिए परिचित ‘यहोवा’ व्यक्तिगत नाम को बनाए रखता है; ‘याहवे’ अधिक निकट शैक्षिक लिप्यंतरण है।
- issue: נִלְחָם का कालगत रूप
  choice: युद्ध कर रहा था
  alternative: युद्ध किया
  rationale: रूप कृदंतात्मक है और मुख्य क्रिया के पीछे चल रही दिव्य युद्ध-क्रिया को व्यक्त कर सकता है। सरल भूतकाल भी प्रसंगानुकूल संभव है, इसलिए कालगत तनाव को स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण पर सामान्य पाठक के लिए स्पष्ट। सैन्य भाषा स्वाभाविक रखी गई है और मूल की संभावित अभियान-संबंधी व्याख्या पादटिप्पणी में सुरक्षित है।
