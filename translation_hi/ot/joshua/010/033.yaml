  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘चढ़ आया’ सैन्य गति का संकेत देता है, और ‘प्रहार किया’ मूल क्रिया की छवि बनाए रखते हुए अगले परिणाम-वाक्य के साथ स्वाभाविक रूप से जुड़ता है।
