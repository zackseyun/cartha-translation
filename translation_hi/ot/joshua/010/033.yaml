source:
  edition: WLC
  text: אָ֣ז עָלָ֗ה הֹרָם֙ מֶ֣לֶךְ גֶּ֔זֶר לַ/עְזֹ֖ר אֶת לָכִ֑ישׁ וַ/יַּכֵּ֤/הוּ יְהוֹשֻׁ֨עַ֙ וְ/אֶת עַמּ֔/וֹ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/033.yaml
  text: Then Horam king of Gezer went up to help Lachish[a], and Joshua struck him and his people until he left him no survivor.
translation:
  language: hi
  text: तब गेज़ेर का राजा होराम लाकीश की सहायता करने चढ़ आया। यहोशू ने उस पर और उसकी प्रजा पर ऐसा प्रहार किया कि उसका एक भी व्यक्ति जीवित न छोड़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कथा में अगली घटना को क्रम से प्रस्तुत करने वाला स्वाभाविक कालवाचक शब्द है।
- source_word: עָלָה
  choice: चढ़ आया
  rationale: मूल क्रिया ऊपर जाने या चढ़ने को व्यक्त करती है और यहाँ सैन्य सहायता के लिए आगे बढ़ने के संदर्भ में है; ‘चढ़ आया’ इस भौगोलिक-सैन्य भाव को बिना अनावश्यक विस्तार के रखता है।
- source_word: הֹרָם מֶלֶךְ גֶּזֶר
  choice: गेज़ेर का राजा होराम
  rationale: व्यक्तिनाम और स्थाननाम का आधुनिक हिन्दी में स्पष्ट लिप्यंतरण करते हुए इब्रानी संबंध-विन्यास को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: לַעְזֹר אֶת לָכִישׁ
  choice: लाकीश की सहायता करने
  rationale: עזר का सीधा अर्थ सहायता देना है; सैन्य संदर्भ स्वतः स्पष्ट है, इसलिए ‘बचाने’ या ‘सेना लेकर सहायता करने’ जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: וַיַּכֵּהוּ
  choice: उस पर ... प्रहार किया
  rationale: נכה के ‘मारना/प्रहार करना’ भाव को सुरक्षित रखा गया है; केवल ‘पराजित किया’ कहने से मूल की प्रहार-संबंधी छवि दब जाती।
- source_word: וְאֶת עַמּוֹ
  choice: और उसकी प्रजा पर
  rationale: עַם व्यापक रूप से लोगों या प्रजा को दर्शाता है। संदर्भ सैन्य है, पर मूल इसे केवल ‘सेना’ तक सीमित नहीं करता।
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ
  choice: ऐसा ... कि उसके लिए ... न छोड़ा
  rationale: यह रचना प्रहार की चरम सीमा या परिणाम व्यक्त करती है। हिन्दी का ‘ऐसा...कि’ संबंध इस अर्थ को स्वाभाविक रूप से प्रकट करता है और ‘उसके लिए’ मूल के לוֹ को बनाए रखता है।
- source_word: שָׂרִיד
  choice: एक भी जीवित व्यक्ति
  rationale: शब्द किसी बचे हुए या जीवित बचे जन को दर्शाता है। इस प्रसंग में ‘एक भी जीवित व्यक्ति’ सहज हिन्दी है, जबकि पादटिप्पणी ‘शेष जन’ की वैकल्पिक छाया सुरक्षित रखती है।
