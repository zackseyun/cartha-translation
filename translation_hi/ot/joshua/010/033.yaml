- from: तब गेज़ेर का राजा होराम लाकीश की सहायता करने चढ़ आया। यहोशू ने उस पर और उसकी प्रजा पर ऐसा प्रहार किया कि उसके लिए एक भी जीवित व्यक्ति[a] न छोड़ा।
  to: तब गेज़ेर का राजा होराम लाकीश की सहायता करने चढ़ आया। यहोशू ने उस पर और उसकी प्रजा पर ऐसा प्रहार किया कि उसका एक भी व्यक्ति जीवित न छोड़ा।
  rationale: केवल अंतिम परिणाम-वाक्य को अधिक स्वाभाविक आधुनिक हिन्दी में सुधारा गया है। संशोधन यह बनाए रखता है कि होराम के लिए कोई जीवित बचा हुआ व्यक्ति नहीं रहा, और שָׂרִיד का ‘survivor/remnant’ अर्थ पादटिप्पणी में सुरक्षित है।
