  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और स्पष्ट शैली। इब्रानी वाक्य के दो सैन्य समूहों का भेद बनाए रखा गया है; ‘वह स्वयं’ स्वतंत्र सर्वनाम के बल को व्यक्त करता है।
