base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/007.yaml
  text: So Joshua went up from Gilgal[a], he and all the fighting men with him[b], and all the mighty men of valor.
translation:
  language: hi
  text: तब यहोशू गिलगाल से चढ़ गया—वह स्वयं और उसके साथ युद्ध के सभी लोग, और सभी पराक्रमी योद्धा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: चढ़ गया
  rationale: עלה का मूल दिशात्मक अर्थ ‘ऊपर जाना/चढ़ना’ है। ‘चढ़ गया’ सैन्य संदर्भ में स्वाभाविक है, पर ‘कूच किया’ जैसी अतिरिक्त विशिष्टता नहीं जोड़ता।
- source_word: מִן הַגִּלְגָּל
  choice: गिलगाल से
  rationale: מן के स्रोत-बोध और स्थाननाम को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הוּא
  choice: वह स्वयं
  rationale: स्वतंत्र सर्वनाम यहोशू की व्यक्तिगत भागीदारी पर बल देता है; ‘वह स्वयं’ हिन्दी में इस बल को स्पष्ट और सहज रूप से रखता है।
- source_word: כָל עַם הַמִּלְחָמָה
  choice: युद्ध करनेवाले सभी लोग
  rationale: शाब्दिक रूप से ‘युद्ध के सब लोग’; यह चयन सामूहिक सैन्य अर्थ को बनाए रखता है और आधुनिक हिन्दी में समझने योग्य है।
- source_word: עִמּוֹ
  choice: उसके साथ
  rationale: עם और उसके सर्वनाम-प्रत्यय का सीधा, स्वाभाविक अनुवाद।
- source_word: כֹל גִּבּוֹרֵי הֶחָיִל
  choice: सभी पराक्रमी योद्धा
  rationale: यह प्रचलित इब्रानी पद शक्तिशाली, सक्षम और वीर लड़ाकों को दर्शाता है। ‘पराक्रमी योद्धा’ पहले समूह से भेद रखते हुए शक्ति और युद्ध-कौशल दोनों व्यक्त करता है।
