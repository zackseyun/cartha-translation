    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָאוֹת
  choice: और लबाओत
  rationale: नगरों की सूची में यह स्थान-नाम है; आरम्भिक संयोजक को सूची की संरचना बनाए रखने के लिए रखा गया है।
- source_word: וְשִׁלְחִים
  choice: शिलहीम
  rationale: स्थान-नाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְעַיִן
  choice: ऐन
  rationale: यहाँ עַיִן सामान्य संज्ञा ‘आँख/सोता’ नहीं, बल्कि स्थान-नाम है; इसलिए इसका लिप्यंतरण किया गया है।
- source_word: וְרִמּוֹן
  choice: रिम्मोन
  rationale: सूची के संदर्भ में यह स्थान-नाम है, इसलिए सामान्य अर्थ ‘अनार’ के बजाय लिप्यंतरण किया गया है।
- source_word: כָּל עָרִים
  choice: कुल ... नगर
  rationale: यह पद सूची में आए नगरों की कुल संख्या बताता है; आधुनिक हिंदी में ‘कुल ... नगर’ स्वाभाविक है।
- source_word: עֶשְׂרִים וָתֵשַׁע
  choice: उनतीस
  rationale: हिब्रू संख्या को मानक हिंदी संख्या-शब्द में व्यक्त किया गया है।
- source_word: וְחַצְרֵיהֶן
  choice: और उनके गाँव
  rationale: क्षेत्रीय सूचियों में חָצֵר आश्रित गाँवों या छोटी बस्तियों को सूचित कर सकता है; ‘गाँव’ सबसे सहज और व्यापक हिंदी विकल्प है।
