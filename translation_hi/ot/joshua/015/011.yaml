  text: Then the border went out to the shoulder of Ekron northward[a], and the border bent toward Shikkeron, and passed over Mount Baalah, and went out to Jabneel[c][b]; and the ends of the border were at the sea.
translation:
  language: hi
  text: फिर सीमा उत्तर की ओर, एक्रोन के पार्श्व तक निकली[a]। वहाँ से सीमा शिक्रोन की ओर मुड़ी, बालाह पर्वत को पार करके यब्नेल तक निकली; और सीमा के छोर समुद्र तक पहुँचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक्रोन के उत्तरी पार्श्व तक।” शाब्दिक रूप से, “एक्रोन के कंधे तक, उत्तर की ओर”; “कंधा” यहाँ पार्श्व या ढलान का भौगोलिक अर्थ रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא
  choice: निकली
  rationale: सीमा-वर्णनों में यह क्रिया रेखा के अगले स्थान तक बढ़ने या पहुँचने को दर्शाती है। हिंदी में ‘सीमा ... निकली’ इसकी पुनरावृत्त गति को संक्षेप में बनाए रखता है।
- source_word: גְּבוּל
  choice: सीमा
  rationale: भूभाग के सीमांकन के संदर्भ में यह स्वाभाविक और स्पष्ट आधुनिक हिंदी शब्द है।
- source_word: כֶּתֶף
  choice: कंधा
  rationale: मूल ठोस भौगोलिक बिंब को सुरक्षित रखा गया है; यहाँ इसका आशय किसी स्थान के पार्श्व या ढलान से हो सकता है।
- source_word: עֶקְרוֹן צָפוֹנָה
  choice: एक्रोन के उत्तरी कंधे
  rationale: दिशासूचक रूप צָפוֹנָה को כֶּתֶף के साथ पढ़ते हुए एक्रोन के उत्तर की ओर स्थित पार्श्व का अर्थ व्यक्त किया गया है।
- source_word: תָּאַר
  choice: मुड़ी
  rationale: सीमा-रेखा के दिशा बदलने का अर्थ स्वाभाविक हिंदी में व्यक्त करता है, बिना अत्यधिक तकनीकी भाषा के।
- source_word: שִׁכְּרוֹנָה
  choice: शिक्रोन की ओर
  rationale: स्थान-नाम का लिप्यंतरण किया गया है और दिशासूचक प्रत्यय को ‘की ओर’ से व्यक्त किया गया है।
- source_word: עָבַר
  choice: पार करती हुई
  rationale: सीमा के किसी भौगोलिक स्थल को पार करके आगे बढ़ने की क्रमिक गति स्पष्ट होती है।
- source_word: הַר הַבַּעֲלָה
  choice: बालाह पर्वत
  rationale: הַר को भौगोलिक नाम के साथ ‘पर्वत’ और בַּעֲלָה को स्थान-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: יַבְנְאֵל
  choice: यब्नेल
  rationale: हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: תֹּצְאוֹת
  choice: अंत
  rationale: इस सीमा-वर्णन में शब्द सीमा के अंतिम छोर या समाप्ति-बिंदु को दर्शाता है; एकवचन हिंदी वाक्य में सामूहिक सीमा-रेखा के लिए स्वाभाविक है।
- source_word: יָמָּה
  choice: समुद्र पर
  rationale: यह रूप ‘समुद्र की ओर’ अथवा ‘पश्चिम की ओर’ हो सकता है; यहाँ הָיוּ תֹּצְאוֹת के साथ सीमा के समुद्र पर समाप्त होने का अर्थ संदर्भानुकूल है।
