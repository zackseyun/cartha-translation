lexical_decisions:
- source_word: וְעָבַר
  choice: फिर वह ... से होकर
  rationale: सीमा-वर्णन में यह क्रिया सीमा-रेखा के एक स्थान से आगे बढ़ने को दर्शाती है; ‘से होकर’ स्वाभाविक हिन्दी है और अनावश्यक रूप से किसी वस्तु को पार करने का भाव नहीं थोपती।
- source_word: עַצְמֹנָה
  choice: अस्मोन
  rationale: यह स्थान-नाम है, इसलिए इसका अनुवाद न करके हिन्दी में लिप्यंतरण किया गया है।
- source_word: וְיָצָא
  choice: तक निकली
  rationale: मूल क्रिया का अर्थ ‘निकलना’ है; सीमा-वर्णन में यह किसी गंतव्य तक पहुँचने या वहाँ निकलने का संकेत देती है।
- source_word: נַחַל מִצְרַיִם
  choice: मिस्र का नाला
  rationale: נחל प्रायः मौसमी जलधारा, नाले या वादी को दर्शाता है, किसी बड़ी नदी को नहीं। ‘नाला’ सामान्य हिन्दी में सुबोध है और नील नदी का भ्रामक संकेत नहीं देता।
- source_word: וְהָיוּ תֹּצְאוֹת הַגְּבוּל יָמָּה
  choice: सीमा समुद्र पर समाप्त हुई
  rationale: इब्रानी मुहावरा सीमा के अंतिम बिंदु को समुद्र की ओर बताता है। यह अनुवाद उस अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל נֶגֶב
  choice: यही तुम्हारी दक्षिणी सीमा होगी
  rationale: यहाँ נֶגֶב दिशा-सूचक ‘दक्षिण’ है, नेगेव क्षेत्र का व्यक्तिवाचक नाम नहीं; वाक्य पिछली सीमा-रेखा का सार देता है।
