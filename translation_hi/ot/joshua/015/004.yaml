  text: फिर वह अस्मोन तक आगे बढ़ी और मिस्र के नाले[a] तक निकली; सीमा समुद्र तक पहुँची। यही तुम्हारी दक्षिणी सीमा होगी।
  philosophy: optimal-equivalence
  footnotes:
