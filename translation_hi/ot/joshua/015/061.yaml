  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: मरुभूमि में
  rationale: בַּ में पूर्वसर्ग और निश्चित उपपद मिलकर स्थानसूचक पद बनाते हैं। यहूदा के इस भौगोलिक क्षेत्र के लिए ‘मरुभूमि’ आधुनिक हिन्दी में स्वाभाविक है और निर्जन, शुष्क भूभाग का भाव देता है।
- source_word: בֵּית הָעֲרָבָה
  choice: बेत-अराबा
  rationale: यह स्थान-नाम है; इसलिए अर्थानुवाद ‘अराबा का घर’ करने के बजाय इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: מִדִּין
  choice: मिद्दीन
  rationale: स्थान-नाम को इब्रानी व्यंजन-द्वित्व के संकेत सहित देवनागरी में लिप्यंतरित किया गया है।
- source_word: וּסְכָכָה
  choice: और सकाका
  rationale: וּ का अनुवाद ‘और’ किया गया है तथा स्थान-नाम סְכָכָה को उसके इब्रानी स्वरूप के निकट ‘सकाका’ लिप्यंतरित किया गया है।
