lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: हसर-शूआल
  rationale: यह नगर का नाम है; इसलिए अर्थानुवाद करने के बजाय इब्रानी रूप का देवनागरी लिप्यंतरण किया गया है। חצר का अर्थ बस्ती/घेरा और שועל का अर्थ लोमड़ी या सियार हो सकता है, पर नगर-सूची में नाम को नाम के रूप में रखना अधिक उपयुक्त है।
- source_word: בְּאֵר שֶׁבַע
  choice: बेर्शेबा
  rationale: प्रसिद्ध स्थान-नाम का प्रचलित और स्रोत-संगत देवनागरी रूप रखा गया है। इसके घटकों से जुड़े ‘सात का कुआँ’ और शब्दालंकार द्वारा ‘शपथ का कुआँ’ अर्थ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: בִּזְיוֹתְיָה
  choice: बिज्योत्याह
  rationale: इस स्थान-नाम की व्युत्पत्ति अनिश्चित है; इसलिए इब्रानी व्यंजनों और स्वरों के निकट देवनागरी लिप्यंतरण अपनाया गया है।
- source_word: וַ / וּ
  choice: और
  rationale: उपसर्गीय समुच्चयबोधक नगरों को जोड़ता है; स्वाभाविक हिन्दी सूची में अंतिम नाम से पहले ‘और’ रखा गया है।
