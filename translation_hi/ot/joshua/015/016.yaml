  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him Achsah my daughter as a wife.”
translation:
  language: hi
  text: तब कालेब ने कहा[a], “जो कोई किर्यत-सेपेर पर आक्रमण करके उसे अपने अधिकार में कर लेगा, उसे मैं अपनी बेटी अकसा पत्नी के रूप में दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किर्यत-सेपेर पर आक्रमण करके उसे अपने अधिकार में करनेवाले को मैं अपनी बेटी अकसा पत्नी के रूप में दूँगा।”
    reason: אֲשֶׁר को ‘जो कोई’ वाली खुली शर्त या ‘...करनेवाले को’ वाली संबंधवाचक रचना, दोनों रूपों में स्वाभाविक ढंग से समझा जा सकता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वय्यिक्तोल कथात्मक क्रम में अगले प्रसंग को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम को व्यक्त करता है, बिना अनावश्यक कारणात्मक अर्थ जोड़े।
- source_word: כָּלֵב
  choice: कालेब
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֲשֶׁר
  choice: जो कोई
  rationale: यह अनिश्चित संबंधवाचक उपवाक्य आरम्भ करता है और कालेब की खुली चुनौती को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יַכֶּה
  choice: पर आक्रमण करके
  rationale: נכה का हिफ़ील रूप मूलतः मारने या प्रहार करने का अर्थ रखता है; नगर के सैन्य प्रसंग में ‘आक्रमण करना’ उसका स्वाभाविक और पर्याप्त निकट हिन्दी रूप है।
- source_word: אֶת קִרְיַת סֵפֶר
  choice: किर्यत-सेपेर
  rationale: स्थान-नाम को लिप्यंतरित किया गया है; קִרְיַת नाम का अभिन्न अंग है।
- source_word: וּלְכָדָהּ
  choice: और उसे अपने अधिकार में कर लेगा
  rationale: לכד सैन्य प्रसंग में नगर को पकड़ने या जीतकर अधिकार में लेने का बोध देता है; स्त्रीलिंग प्रत्यय का संदर्भ नगर से है और हिन्दी में ‘उसे’ द्वारा व्यक्त है।
- source_word: וְנָתַתִּי לוֹ
  choice: उसे मैं ... दूँगा
  rationale: प्रसंग में यह भविष्यकालीन प्रतिज्ञा है; לוֹ के प्राप्तकर्ता को ‘उसे’ से स्पष्ट रखा गया है।
- source_word: עַכְסָה
  choice: अकसा
  rationale: व्यक्तिवाचक नाम का स्रोत-ध्वनियों के निकट हिन्दी लिप्यंतरण।
- source_word: בִתִּי
  choice: अपनी बेटी
  rationale: कालेब के साथ संबंध हिन्दी में स्वाभाविक रूप से ‘अपनी बेटी’ द्वारा व्यक्त होता है।
- source_word: לְאִשָּׁה
  choice: पत्नी के रूप में
  rationale: यह विवाह में पत्नी के रूप में देने का मुहावरा है; अनावश्यक स्वामित्वसूचक शब्द जोड़े बिना अर्थ स्पष्ट किया गया है।
