lexical_decisions:
- source_word: קִרְיַת בַּעַל
  choice: किर्यत-बाल
  rationale: यह स्थान-नाम है, इसलिए अर्थानुवाद करने के बजाय हिन्दी ध्वन्यंतरण किया गया है।
- source_word: הִיא
  choice: अर्थात्
  rationale: यहाँ सर्वनाम पहले स्थान-नाम की पहचान दूसरे नाम से कराता है; ‘अर्थात्’ इस व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קִרְיַת יְעָרִים
  choice: किर्यत-यारीम
  rationale: वैकल्पिक स्थान-नाम होने के कारण इसका हिन्दी ध्वन्यंतरण किया गया है।
- source_word: הָרַבָּה
  choice: रब्बा
  rationale: इब्रानी में लगे निश्चित उपपद को हिन्दी स्थान-नाम में अलग से व्यक्त करना आवश्यक नहीं; प्रचलित नामरूप रखा गया है।
- source_word: עָרִים שְׁתַּיִם
  choice: दो नगर
  rationale: क्षेत्र-विभाजन की सूची में עָרִים के लिए ‘नगर’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: חַצְרֵיהֶן
  choice: उनकी बस्तियाँ
  rationale: यह शब्द नामित नगरों से जुड़ी आश्रित या आसपास की बसाहटों को सूचित करता है; ‘बस्तियाँ’ आधुनिक हिन्दी में व्यापक और सहज है।
