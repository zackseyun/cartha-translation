    text: या “यह यहूदा के वंशजों के गोत्र का विरासत-भाग है, उनके कुलों के अनुसार।”
    reason: इब्रानी संज्ञात्मक वाक्य में स्पष्ट क्रिया नहीं है; अतः इसे वर्तमानकाल में भी अनूदित किया जा सकता है।
lexical_decisions:
- source_word: זֹאת
  choice: वह ... था
  rationale: यह स्त्रीलिंग संकेतवाचक शब्द पहले वर्णित भू-भाग की ओर संकेत करता है। वर्णन के समापन पर आधुनिक हिन्दी में भूतकाल स्वाभाविक है; इब्रानी की कालरहित संज्ञात्मक रचना के कारण वर्तमानकाल भी संभव है।
- source_word: נַחֲלַת
  choice: विरासत-भाग
  rationale: यह शब्द विरासत में प्राप्त अथवा आवंटित स्थायी भू-भाग को दर्शाता है। ‘विरासत-भाग’ भूमि-विभाजन और पैतृक अधिकार, दोनों भावों को बनाए रखता है।
- source_word: מַטֵּה
  choice: गोत्र
  rationale: इस जनजातीय संदर्भ में अर्थ ‘गोत्र’ है, न कि इसका मूर्त अर्थ ‘लाठी’।
- source_word: בְנֵי יְהוּדָה
  choice: यहूदा के वंशजों
  rationale: शाब्दिक रूप ‘यहूदा के पुत्र’ है; आधुनिक हिन्दी में ‘वंशजों’ जनजातीय और वंशावली संबंधी भाव को अधिक स्वाभाविक तथा समावेशी ढंग से व्यक्त करता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: यहाँ מִשְׁפָּחָה गोत्र के भीतर के वंश-आधारित कुल को दर्शाता है, और לְ वितरण का भाव देता है—‘के अनुसार’।
