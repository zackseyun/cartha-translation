- source_word: וְ
  choice: और
  rationale: नामों को जोड़ने वाले उपसर्ग का स्वाभाविक हिन्दी समतुल्य 'और' रखा गया है; सूची में हिन्दी शैली के अनुसार अंतिम नाम से पहले इसे व्यक्त किया गया है।
