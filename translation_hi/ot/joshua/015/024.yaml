  rationale: यह नगर-सूची में आया स्थान-नाम है; इसलिए इसका अर्थानुवाद न करके आधुनिक हिन्दी में प्रचलित बाइबलीय रूप के अनुसार लिप्यंतरण किया गया है।
- source_word: טֶלֶם
