- source_word: בְעָלוֹת
  choice: बालोत
  rationale: यह स्थान-नाम है। हिन्दी में בעל घटक को सामान्यतः ‘बाल’ के रूप में लिखा जाता है; वैकल्पिक स्वरांकन ‘बेआलोत’ को पादटिप्पणी में रखा गया है।
- source_word: וָ / וּ
  choice: और
  rationale: दोनों उपसर्ग सूची की मदों को जोड़ने वाले समुच्चयबोधक हैं; हिन्दी में अंतिम संयोजन को स्वाभाविक रूप से ‘और’ से व्यक्त किया गया है, जबकि पहले को अल्पविराम से दर्शाया गया है।
