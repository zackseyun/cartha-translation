  text: וְ֠/יָצָא אֶל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה וְ/עָלָ֥ה מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/עָבַ֤ר חֶצְרוֹן֙ וְ/עָלָ֣ה אַדָּ֔רָ/ה וְ/נָסַ֖ב הַ/קַּרְקָֽעָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/003.yaml
  text: Then it went out southward to the ascent of Akrabbim[a], crossed over to Zin, went up from the south to Kadesh-barnea, crossed over Hezron, went up to Addar[b], and turned toward Karka.
translation:
  language: hi
  text: फिर सीमा दक्षिण की ओर अक्रब्बीम की चढ़ाई[a] तक गई, सीन को पार करती हुई आगे बढ़ी, दक्षिण से कादेश-बर्ने[b] तक ऊपर गई, हेस्रोन के पार गई, अद्दार तक ऊपर गई और मुड़कर करका[c] की ओर बढ़ी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अक्रब्बीम” का अर्थ संभवतः “बिच्छू” है; यहाँ यह स्थान-नाम है, इसलिए इसका लिप्यंतरण किया गया है।
    reason: lexical_alternative
  - marker: b
    text: “दक्षिण से कादेश-बर्ने तक” का अनुवाद “कादेश-बर्ने के दक्षिण से होकर” भी किया जा सकता है।
    reason: alternative_reading
  - marker: c
    text: “करका” नाम का उच्चारण या वर्तनी अनिश्चित है; इसे “करकाआ” भी लिखा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָא
  choice: फिर सीमा ... गई
  rationale: सीमा-वर्णन के संदर्भ में स्त्रीलिंग क्रिया का निहित कर्ता ‘सीमा’ है। इसे स्पष्ट करना स्वाभाविक हिन्दी के लिए आवश्यक है; ‘फिर’ क्रमसूचक וְ को व्यक्त करता है।
- source_word: אֶל מִנֶּגֶב
  choice: दक्षिण की ओर
  rationale: यह सीमा की दिशा बताता है। यह अनुवाद इब्रानी की दिशात्मक शक्ति को सहज हिन्दी में बनाए रखता है।
- source_word: לְמַעֲלֵה עַקְרַבִּים
  choice: अक्रब्बीम की चढ़ाई तक
  rationale: מַעֲלֶה ऊँचाई की ओर जाने वाली चढ़ाई या घाटी-पथ को दर्शाता है। עַקְרַבִּים यहाँ स्थान-नाम है, इसलिए अर्थानुवाद के बजाय लिप्यंतरण किया गया है।
- source_word: וְעָבַר צִנָה
  choice: सीन को पार करती हुई आगे बढ़ी
  rationale: עבר सीमा के किसी स्थान से पार या होकर आगे जाने को दर्शाता है; צִנָה में दिशासूचक प्रत्यय है। चुना गया रूप गति और क्रम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְעָלָה מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: दक्षिण से कादेश-बर्ने तक ऊपर गई
  rationale: यह מִן को ‘से’ और לְ को गंतव्य के रूप में सीधे व्यक्त करता है। वाक्यांश को ‘कादेश-बर्ने के दक्षिण से’ भी समझा जा सकता है, इसलिए वैकल्पिक स्थानगत अर्थ टिप्पणी में सुरक्षित रखा गया है।
- source_word: וְעָבַר חֶצְרוֹן
  choice: हेस्रोन के पार गई
  rationale: सीमा-यात्रा के सूत्र में עבר का अर्थ किसी स्थल के पार आगे बढ़ना है; स्थान-नाम को लिप्यंतरित किया गया है।
- source_word: וְעָלָה אַדָּרָה
  choice: अद्दार तक ऊपर गई
  rationale: עלה ऊँचाई की ओर गति दर्शाता है और स्थान-नाम के दिशासूचक रूप को हिन्दी में ‘तक’ से व्यक्त किया गया है।
- source_word: וְנָסַב הַקַּרְקָעָה
  choice: और मुड़कर करका की ओर बढ़ी
  rationale: נסב सीमा के मुड़ने या दिशा बदलने को बताता है। स्थान-नाम का दिशासूचक रूप ‘की ओर’ से व्यक्त किया गया है, जिससे यह अनावश्यक रूप से नहीं कहा जाता कि सीमा उस स्थान तक अवश्य पहुँची।
theological_decisions:
- issue: מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ का दिशात्मक या स्थानगत संबंध
  choice: दक्षिण से कादेश-बर्ने तक ऊपर गई
  alternative: कादेश-बर्ने के दक्षिण से होकर ऊपर गई
  rationale: इब्रानी מִן और לְ का सीधा क्रम आरंभ-बिंदु से गंतव्य की गति का समर्थन करता है, लेकिन सीमा-वर्णन में ‘किसी स्थान के दक्षिण में/दक्षिण की ओर से’ वाला अर्थ भी संभव है। मुख्य पाठ दिशात्मक पठन रखता है और टिप्पणी वास्तविक अस्पष्टता को सुरक्षित रखती है; इसका कोई विशिष्ट सांप्रदायिक प्रभाव नहीं है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। सीमा को निहित कर्ता के रूप में स्पष्ट किया गया है। स्थान-नामों का हिन्दी ध्वन्यात्मक लिप्यंतरण किया गया है और गति बताने वाली क्रियाओं की पुनरावृत्ति मूल सीमा-वर्णन की यात्रा-शैली को बनाए रखती है।
