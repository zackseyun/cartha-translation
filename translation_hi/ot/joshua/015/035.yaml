- source_word: וַ/עֲזֵקָה
  choice: और अजेका
  rationale: अंतिम नगर-नाम से पहले हिब्रू संयोजक वाव को हिंदी में स्वाभाविक रूप से ‘और’ द्वारा व्यक्त किया गया है; नाम का उच्चारण-संगत लिप्यंतरण ‘अजेका’ है।
