lexical_decisions:
- source_word: יִפְתָּח
  choice: यिफ़्ताह
  rationale: यह नगरों की सूची में एक स्थान-नाम है। हिन्दी लिप्यंतरण में आरम्भिक य ध्वनि और मध्य की फ़ ध्वनि रखी गई है; इसे न्यायी के अधिक परिचित नाम के अनुसार बदलकर सामंजस्य नहीं किया गया।
- source_word: אַשְׁנָה
  choice: अश्ना
  rationale: यह यहूदा के नगर का स्थान-नाम है; हिब्रू व्यंजन और स्वर-रूप के निकट स्वाभाविक देवनागरी लिप्यंतरण किया गया है।
- source_word: נְצִיב
  choice: नसीब
  rationale: यह स्थान-नाम है। हिब्रू צ को आधुनिक हिन्दी पाठक के लिए स्वाभाविक 'स' से दर्शाया गया है; अधिक ध्वन्यात्मक 'त्स' रूप को पादटिप्पणी में रखा गया है।
- source_word: וְ
  choice: और
  rationale: उपसर्गीय समुच्चयबोधक नगरों की क्रमिक सूची को जोड़ता है; हिन्दी में सूची की निरंतरता बनाए रखने के लिए 'और' प्रयुक्त हुआ है।
