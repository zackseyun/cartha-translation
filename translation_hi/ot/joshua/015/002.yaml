  yaml_path: translation/ot/joshua/015/002.yaml
  text: Their southern border was from the end of the Salt Sea[b][a], from the tongue that faces southward.
translation:
  language: hi
  text: उनकी दक्षिणी सीमा खारे सागर के छोर से, उस जीभनुमा खाड़ी से, जो दक्षिण की ओर मुड़ी हुई है, आरम्भ होती थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: उनकी ... आरम्भ होती थी
  rationale: यहाँ היה के साथ לָהֶם यहूदा के भाग की सीमा का वर्णन आरम्भ करता है। हिंदी में स्वाभाविक संबंधवाचक रचना और आरम्भ-बिंदु को व्यक्त करने वाली क्रिया मूल आशय स्पष्ट करती है।
- source_word: גְּבוּל נֶגֶב
  choice: दक्षिणी सीमा
  rationale: यहाँ נֶגֶב दिशा बताता है, किसी विशिष्ट भूभाग के नाम के रूप में नहीं; इसलिए ‘दक्षिणी सीमा’ उपयुक्त है।
- source_word: מִקְצֵה
  choice: दक्षिणी छोर से
  rationale: קָצֶה किसी वस्तु के अंतिम सिरे या छोर को दर्शाता है। अगले वाक्यांश में दक्षिणमुखी भौगोलिक आकृति के कारण यहाँ सागर का दक्षिणी छोर अभिप्रेत है।
- source_word: יָם הַמֶּלַח
  choice: खारा सागर
  rationale: इब्रानी नाम का अर्थ ‘नमक/खारेपन का सागर’ है। ‘खारा सागर’ आधुनिक हिंदी में स्वाभाविक है और स्रोत का नाम सुरक्षित रखता है।
- source_word: מִן הַלָּשׁוֹן
  choice: उस खाड़ी से
  rationale: शाब्दिक अर्थ ‘जीभ’ है, पर यहाँ यह जीभ जैसी आकृति वाली खाड़ी या जल-प्रवेशिका के लिए स्थलाकृतिक शब्द है। मुख्य पाठ में ‘खाड़ी’ अर्थ को सहज बनाता है; शाब्दिक बिंब पादटिप्पणी में रखा गया है।
- source_word: הַפֹּנֶה נֶגְבָּה
  choice: जिसका मुख दक्षिण की ओर है
  rationale: פנה यहाँ उस स्थलाकृति की दक्षिण की ओर अभिमुखता बताता है। ‘जिसका मुख ... की ओर है’ स्रोत के बिंब और दिशा दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘खारा सागर’ मूल इब्रानी नाम को बनाए रखता है, जबकि प्रचलित नाम पादटिप्पणी में दिया गया है। सीमा के आरम्भ-बिंदु को हिंदी में स्वाभाविक बनाने के लिए ‘आरम्भ होती थी’ जोड़ा गया है।
