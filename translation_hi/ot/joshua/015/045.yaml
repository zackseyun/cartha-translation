lexical_decisions:
- source_word: עֶקְרוֹן
  choice: एक्रोन
  rationale: स्थानवाचक नाम को हिन्दी में प्रचलित बाइबलीय लिप्यंतरण के अनुसार प्रस्तुत किया गया है।
- source_word: וּבְנֹתֶיהָ
  choice: और उसके अधीन नगर
  rationale: शाब्दिक अर्थ ‘और उसकी बेटियाँ’ है, पर क्षेत्रीय सूचियों में בנות प्रधान नगर से जुड़े आश्रित नगरों या बस्तियों के लिए प्रयुक्त इब्रानी मुहावरा है। ‘उसके अधीन नगर’ इस संबंध को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: וַחֲצֵרֶיהָ
  choice: और उसके गाँव
  rationale: भूमि-विभाजन के संदर्भ में חצרים छोटे ग्रामीण अधीनस्थ निवास-स्थानों को दर्शाता है; ‘गाँव’ आधुनिक हिन्दी में इसका स्पष्ट और स्वाभाविक समतुल्य है।
