- source_word: אֶת־עַכְסָה בִתּוֹ לְאִשָּׁה
  choice: अपनी बेटी अकसा का विवाह उसके साथ कर दिया
  rationale: शाब्दिक ‘अपनी बेटी अकसा को उसे पत्नी के रूप में दिया’ के स्थान पर विवाह देने की हिब्रू प्रथा-सूचक अभिव्यक्ति को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त किया गया है, बिना अतिरिक्त विवरण जोड़े।
