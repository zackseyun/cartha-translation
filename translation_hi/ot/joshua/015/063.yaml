source:
  edition: WLC
  text: וְ/אֶת הַ/יְבוּסִי֙ יוֹשְׁבֵ֣י יְרֽוּשָׁלִַ֔ם לֹֽא יוכלו בְנֵֽי יְהוּדָ֖ה לְ/הֽוֹרִישָׁ֑/ם וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י יְהוּדָה֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/063.yaml
  text: But the sons of Judah could not dispossess the Jebusites[a], the inhabitants of Jerusalem, so the Jebusites have lived with the sons of Judah in Jerusalem to this day.
translation:
  language: hi
  text: परन्तु यहूदा के वंशज यरूशलेम के निवासी यबूसियों[a] को बेदखल न कर सके। इसलिए यबूसी यहूदा के वंशजों के साथ यरूशलेम में आज तक रहते आए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘यबूसी’ एकवचन है, पर यहाँ वह पूरी जाति के लिए सामूहिक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: परन्तु
  rationale: यह संयोजन पिछले विवरण के बाद एक अपवाद अथवा विरोध प्रस्तुत करता है; आधुनिक हिन्दी में ‘परन्तु’ उसका प्रवचनात्मक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַיְבוּסִי
  choice: यबूसियों
  rationale: इब्रानी में जातिवाचक शब्द व्याकरणतः एकवचन है, पर अर्थ में पूरे समुदाय को दर्शाता है; हिन्दी में बहुवचन अधिक स्वाभाविक है।
- source_word: יוֹשְׁבֵי יְרוּשָׁלַם
  choice: यरूशलेम के निवासी
  rationale: कृदन्तीय पद यबूसियों की पहचान यरूशलेम में रहनेवालों के रूप में कराता है; यह रूप संक्षिप्त और स्वाभाविक है।
- source_word: לֹא יוכלו
  choice: न कर सके
  rationale: क्रिया भूतकालीन असमर्थता व्यक्त करती है; हिन्दी का यह रूप उसी अर्थ को सहजता से देता है।
- source_word: בְנֵי יְהוּדָה
  choice: यहूदा के वंशज
  rationale: शाब्दिक ‘यहूदा के पुत्र’ यहाँ गोत्र के सदस्यों के लिए सामूहिक वंशगत मुहावरा है; ‘वंशज’ अर्थ को स्पष्ट रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְהוֹרִישָׁם
  choice: उन्हें वहाँ से बेदखल करना
  rationale: हिफ़ील रूप का आशय किसी को उसके अधिकार अथवा निवास से वंचित करना है। ‘बेदखल’ इस विजय-संदर्भ में ‘निकाल देना’ से अधिक सटीक है; ‘वहाँ से’ हिन्दी में अभिप्रेत स्थान स्पष्ट करता है।
- source_word: וַיֵּשֶׁב
  choice: रहते आए हैं
  rationale: ‘आज तक’ के साथ यह भूतकाल से कथावाचक के वर्तमान तक जारी अवस्था को व्यक्त करता है; हिन्दी का पूर्ण-वर्तमान निरंतर रूप इस भाव को स्वाभाविक ढंग से देता है।
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: यहूदा के वंशजों के साथ
  rationale: यहाँ אֶת का प्रयोग असामान्य है, पर संदर्भ सह-अस्तित्व का अर्थ देता है। ‘के साथ’ संबंध को स्पष्ट करता है और पाठ की अस्वाभाविक शाब्दिकता से बचाता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह मानक हिन्दी अभिव्यक्ति कथावाचक के समय तक स्थिति के जारी रहने को ठीक व्यक्त करती है।
theological_decisions:
- issue: בְנֵי יְהוּדָה का सामूहिक वंशगत अर्थ
  choice: यहूदा के वंशज
  alternative: यहूदा के पुत्र; यहूदा के लोग; यहूदा का गोत्र
  rationale: यह पद केवल पुरुष व्यक्तियों को नहीं, बल्कि यहूदा के गोत्रीय समुदाय को सामूहिक रूप से दर्शाता है। ‘वंशज’ स्रोत के पारिवारिक-वंशगत भाव को बनाए रखते हुए आधुनिक पाठक के लिए अर्थ स्पष्ट करता है।
- issue: וַיֵּשֶׁב ... אֶת בְּנֵי יְהוּדָה की असामान्य रचना
  choice: यहूदा के वंशजों के साथ ... रहते आए हैं
  alternative: यहूदा के वंशजों के बीच रहे; उनके साथ बसे रहे
  rationale: शब्दशः रचना हिन्दी में भ्रामक होगी। संदर्भ सह-निवास का समर्थन करता है; ‘के साथ’ इस अर्थ को व्यक्त करता है, पर संबंध की प्रकृति के बारे में अतिरिक्त निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘बेदखल’ अधिकार और निवास से हटाने का सटीक भाव देता है। ‘यहूदा के वंशज’ शाब्दिक मुहावरे और उसके सामूहिक गोत्रीय अर्थ के बीच संतुलन रखता है।
