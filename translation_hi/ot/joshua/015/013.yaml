id: JOS.15.13
reference: Joshua 15:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/לְ/כָלֵ֣ב בֶּן יְפֻנֶּ֗ה נָ֤תַן חֵ֨לֶק֙ בְּ/ת֣וֹךְ בְּנֵֽי יְהוּדָ֔ה אֶל פִּ֥י יְהוָ֖ה לִֽ/יהוֹשֻׁ֑עַ אֶת קִרְיַ֥ת אַרְבַּ֛ע אֲבִ֥י הָ/עֲנָ֖ק הִ֥יא חֶבְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/013.yaml
  text: 'And to Caleb son of Jephunneh he gave a portion among the sons of Judah[a], according to the command of Yahweh to Joshua: Kiriath-arba (Arba was the father of Anak), that is[b], Hebron.'
translation:
  language: hi
  text: और यपुन्ने के पुत्र कालेब को उसने यहूदा के वंशजों के बीच एक भाग दिया, यहोशू को दिए गए याहवे के आदेश के अनुसार[a]—किर्यत-अर्बा (अर्बा अनाक का पिता था)[b], अर्थात् हेब्रोन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे के वचन के अनुसार।” हिब्रू मुहावरे का शाब्दिक अर्थ है “याहवे के मुख के अनुसार।”
    reason: lexical_alternative
  - marker: b
    text: “अनाक का पिता” का अर्थ “अनाक का पूर्वज” या “अनाक का संस्थापक” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/כָלֵב בֶּן יְפֻנֶּה
  choice: और यपुन्ने के पुत्र कालेब को
  rationale: संयोजक और संबंधसूचक उपसर्गों को स्वाभाविक हिन्दी में रखते हुए पुत्र-संबंध और व्यक्तिनामों को स्पष्ट रूप से व्यक्त किया गया है।
- source_word: נָתַן חֵלֶק
  choice: उसने ... एक भाग दिया
  rationale: हिब्रू क्रिया का कर्ता व्यक्त नहीं किया गया है; ‘उसने’ उसी अनिर्दिष्ट पुल्लिंग कर्ता को बनाए रखता है और ‘भाग दिया’ भूमि के हिस्से के आवंटन को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּתוֹךְ בְּנֵי יְהוּדָה
  choice: यहूदा के वंशजों के बीच
  rationale: ‘बीच’ בְּתוֹךְ का स्वाभाविक अर्थ देता है। जनजातीय संदर्भ में ‘वंशज’ शाब्दिक ‘पुत्रों’ की अपेक्षा आधुनिक हिन्दी में अधिक स्पष्ट है।
- source_word: אֶל פִּי יְהוָה לִיהוֹשֻׁעַ
  choice: यहोशू को दिए गए याहवे के आदेश के अनुसार
  rationale: ‘मुख के अनुसार’ हिब्रू मुहावरा है जिसका आशय आदेश या वचन के अनुसार है। हिन्दी पाठ में आदेश का भाव रखा गया और यह स्पष्ट किया गया कि आदेश यहोशू को संबोधित था।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: קִרְיַת אַרְבַּע
  choice: किर्यत-अर्बा
  rationale: स्थाननाम को अर्थानुवाद करने के बजाय पहचान योग्य रूप में लिप्यंतरित किया गया है।
- source_word: אֲבִי הָעֲנָק
  choice: अर्बा अनाक का पिता था
  rationale: हिब्रू पदबंध में ‘पिता’ का संबंध अर्बा से है, नगर के नाम से नहीं; कोष्ठकीय स्पष्टीकरण इस संबंध को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: הִיא חֶבְרוֹן
  choice: अर्थात् हेब्रोन
  rationale: यह पद किर्यत-अर्बा की पहचान हेब्रोन के रूप में करता है; ‘अर्थात्’ हिन्दी में इस समानाधिकरण को स्पष्ट और संक्षिप्त बनाता है।
theological_decisions:
- issue: ‘एक भाग दिया’ के अव्यक्त कर्ता की पहचान
  choice: कर्त्ता को ‘उसने’ कहकर अनिर्दिष्ट रखा गया है।
  alternative: ‘यहोशू ने दिया’ अथवा ‘याहवे ने दिया’ कहकर कर्ता को स्पष्ट करना।
  rationale: हिब्रू वाक्य में कर्ता व्यक्त नहीं है। किसी एक को स्पष्ट कर्ता बनाने से स्रोत की वास्तविक अस्पष्टता अनावश्यक रूप से समाप्त हो जाती।
- issue: אָב का अर्थ
  choice: पिता
  alternative: पूर्वज अथवा संस्थापक
  rationale: ‘पिता’ स्रोत का सबसे सीधा रूप है, जबकि व्यापक संभावित अर्थों को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। जनजातीय पदबंध में ‘वंशजों’ का प्रयोग सामान्य पाठक के लिए स्पष्ट है। अव्यक्त कर्ता और אָב के अर्थ की व्यापकता को बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखा गया है।
