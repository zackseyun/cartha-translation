- source_word: וּ/מַעֲרָת
  choice: और मारात
  rationale: स्थान-नाम को अनुवादित करने के बजाय आधुनिक हिन्दी में स्वाभाविक देवनागरी लिप्यंतरण दिया गया है; उपसर्ग וּ को ‘और’ से व्यक्त किया गया है।
- source_word: וּ/בֵית עֲנוֹת
  choice: बेत-अनोत
  rationale: यह संयुक्त स्थान-नाम है। ‘बेत’ को नाम का अंग रखते हुए हाइफ़न द्वारा उसकी संयुक्त संरचना स्पष्ट की गई है।
- source_word: וְ/אֶלְתְּקֹן
  choice: और एलतेकोन
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण किया गया है और आरंभिक conjunction को ‘और’ से व्यक्त किया गया है।
- source_word: עָרִים
  choice: नगर
  rationale: भूभाग-सूची में यह शब्द आबाद नगर या बस्ती को सूचित करता है; ‘नगर’ पारंपरिक और सहज हिन्दी विकल्प है।
- source_word: שֵׁשׁ
  choice: छः
  rationale: मूल पाठ की संख्या को सीधे व्यक्त किया गया है।
- source_word: וְ/חַצְרֵי/הֶן
  choice: और उनके गाँव
  rationale: यहाँ חָצֵר मुख्य नगरों से जुड़े आश्रित ग्रामीण बसावों को दर्शाता है; ‘गाँव’ साधारण आधुनिक हिन्दी में इस भौगोलिक संबंध को स्पष्ट करता है।
