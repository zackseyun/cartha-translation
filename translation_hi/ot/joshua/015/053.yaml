  rationale: आरम्भिक ו को सूची के संयोजक ‘और’ के रूप में प्रस्तुत किया गया है। स्थान-नाम ינים का अनुवाद करने के बजाय उसके मासोरेटिक स्वरांकन के अनुसार ‘यनीम’ लिप्यंतरित किया गया है।
- source_word: וּ/בֵית תַּפּוּחַ
  choice: बेत-तप्पूह
  rationale: यह एक संयुक्त स्थान-नाम है; इसलिए בֵית को अर्थानुवाद ‘घर’ न देकर ‘बेत’ और תַּפּוּחַ को ‘तप्पूह’ रूप में लिप्यंतरित किया गया है। हिन्दी सूची में प्रत्येक नाम से पहले ‘और’ दोहराना आवश्यक नहीं है।
- source_word: וַ/אֲפֵקָה
  choice: और अफेका
  rationale: וַ को ‘और’ तथा स्थान-नाम אֲפֵקָה को अंतिम ה सहित ‘अफेका’ लिप्यंतरित किया गया है; इसे छोटे रूप ‘अफेक’ में नहीं बदला गया।
