  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण सूचीगत रूप। मूल इब्रानी में किर्यत-सन्ना और दबीर की स्पष्ट पहचान को कोष्ठक में स्वाभाविक ढंग से रखा गया है। अंग्रेज़ी मसौदे का [a] चिह्न दन्ना के बाद भ्रामक प्रतीत होता है, क्योंकि उसकी टिप्पणी किर्यत-सन्ना से संबंधित है; हिन्दी मुख्य पाठ स्वयं पहचान स्पष्ट करता है, इसलिए पादटिप्पणी आवश्यक नहीं मानी गई।
