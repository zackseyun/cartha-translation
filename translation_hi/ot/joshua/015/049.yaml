lexical_decisions:
- source_word: דַנָּה
  choice: दन्ना
  rationale: यह स्थान का नाम है; इसलिए अर्थानुवाद के बजाय आधुनिक हिन्दी में निकट लिप्यंतरण किया गया है।
- source_word: קִרְיַת סַנָּה
  choice: किर्यत-सन्ना
  rationale: संयुक्त स्थान-नाम को एक स्थलनाम के रूप में लिप्यंतरित किया गया है; पहले घटक का ‘नगर’ अनुवाद करने से नाम का रूप अस्पष्ट हो सकता था।
- source_word: הִיא
  choice: अर्थात्
  rationale: यहाँ सर्वनाम दो स्थान-नामों की समान पहचान बताता है; हिन्दी में ‘अर्थात्’ इस संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: דְּבִר
  choice: दबीर
  rationale: यह स्थान का वैकल्पिक नाम है; अतः इसका लिप्यंतरण किया गया है।
- source_word: וְ
  choice: और
  rationale: नगरों की सूची की संयोजक संरचना बनाए रखने के लिए सामान्य हिन्दी समुच्चयबोधक रखा गया है।
