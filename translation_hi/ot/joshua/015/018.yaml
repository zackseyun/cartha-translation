  yaml_path: translation/ot/joshua/015/018.yaml
  text: And when she came[a], she urged him to ask her father for a field. Then she got down from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: hi
  text: जब वह आई, तो उसने उसे अपने पिता कालेब से एक खेत माँगने को उकसाया[a]। फिर वह गधे पर से झट उतर गई[b]। कालेब ने उससे कहा, “तुम क्या चाहती हो?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसने उसे मनाया” अथवा “उसने उसे प्रेरित किया।”
    reason: lexical_alternative
  - marker: b
    text: या “वह गधे पर से उतर गई”; इब्रानी क्रिया अचानक या तेज़ी से उतरने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी मुहावरे का शाब्दिक अर्थ है, “तुम्हें क्या है?” प्रसंग के अनुसार इसका अर्थ “तुम क्या चाहती हो?” या “तुम्हें क्या परेशानी है?” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: जब वह आई
  rationale: בְּ + infinitive construct with 3fs suffix forms a temporal clause. यह अनुवाद स्वाभाविक है और गंतव्य को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: וַתְּסִיתֵהוּ
  choice: उसने उसे उकसाया
  rationale: סות में उकसाने, प्रेरित करने या मनाने का अर्थ हो सकता है। ‘उकसाया’ क्रिया की सक्रिय और कुछ तीखी छाया सुरक्षित रखता है; अपेक्षाकृत सौम्य विकल्प पादटिप्पणी में दिया गया है।
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ שָׂדֶה
  choice: कि वह उसके पिता से एक खेत माँगे
  rationale: שאל और מֵאֵת को आधुनिक हिन्दी में ‘किसी से कुछ माँगना’ के स्वाभाविक विन्यास में रखा गया है; שָׂדֶה का सीधा अर्थ ‘एक खेत’ है।
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: वह गधे पर से झट उतर गई
  rationale: צנח उतरने को दर्शाता है और उसमें आकस्मिक या तेज़ गति की छाया हो सकती है। ‘झट उतर गई’ इस जीवंतता को बिना अत्यधिक नाटकीय बनाए व्यक्त करता है।
- source_word: מַה לָּךְ
  choice: तुम क्या चाहती हो?
  rationale: शाब्दिक मुहावरा ‘तुम्हें क्या है?’ है, पर प्रसंग में कालेब उसके अनुरोध के बारे में पूछ रहा है। चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
