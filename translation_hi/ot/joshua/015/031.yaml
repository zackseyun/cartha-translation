lexical_decisions:
- source_word: צִקְלַג
  choice: सिकलाग
  rationale: यह स्थान का नाम है; इसका अनुवाद करने के बजाय हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है। हिंदी बाइबल परंपरा में भी ‘सिकलाग’ प्रचलित और सहज रूप है।
- source_word: מַדְמַנָּה
  choice: मदमन्ना
  rationale: यह स्थान का नाम है; हिब्रू व्यंजन-रचना और दागेश से सूचित द्वित्व को ‘न्न’ द्वारा दर्शाते हुए देवनागरी में लिप्यंतरित किया गया है।
- source_word: סַנְסַנָּה
  choice: सनसन्ना
  rationale: यह स्थान का नाम है; हिब्रू रूप के निकट रहते हुए द्वित्व को ‘न्न’ द्वारा दर्शाया गया है। अंतिम ה को अलग ‘ह’ न देकर ‘आ’ से व्यक्त किया गया है, जो आधुनिक हिंदी लिप्यंतरण में स्वाभाविक है।
- source_word: וְ
  choice: और
  rationale: उपसर्गीय समुच्चयबोधक इस स्थान-सूची की अंतिम मद को जोड़ता है; हिंदी सूची-शैली में पहले नामों के बीच अल्पविराम और अंतिम नाम से पहले ‘और’ स्वाभाविक है।
