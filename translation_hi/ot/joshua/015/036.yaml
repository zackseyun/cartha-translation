  footnotes:
  - marker: a
    text: कुछ व्याख्याकार ध्यान दिलाते हैं कि इस पद में दिए गए चार स्थान-नाम स्पष्ट रूप से बताई गई ‘चौदह नगर’ की संख्या पूरी नहीं करते। संभव है कि इस बड़े खंड के पाठ-इतिहास के कारण यह अंतर आया हो; फिर भी यहाँ हिब्रू पाठ का अनुवाद उसी रूप में किया गया है जैसा वह उपलब्ध है।
