  register: भाषा आधुनिक, संक्षिप्त और भौगोलिक सूची के अनुरूप रखी गई है। मूल हिब्रू की सूची-संरचना और आरम्भिक ‘और’ को बनाए रखा गया है। अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न ‘Gederoth’ के बाद था, जबकि टिप्पणी ‘Beth-dagon’ से संबंधित है; हिन्दी मुख्य पाठ में चिह्न को उसके सही संबद्ध नाम ‘बेत-दागोन’ के बाद रखा गया है।
