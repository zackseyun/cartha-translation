base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/041.yaml
  text: 'and Gederoth[a], Beth-dagon, Naamah, and Makkedah: sixteen cities with their villages.'
translation:
  language: hi
  text: और गदेरोत, बेत-दागोन[a], नामा और मक्केदा—सोलह नगर और उनके गाँव।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेत-दागोन’ का शाब्दिक अर्थ ‘दागोन का घर’ है, पर यहाँ यह एक स्थान-नाम है; इसलिए इसका लिप्यंतरण किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְדֵרוֹת
  choice: और गदेरोत
  rationale: संयोजक וּ को ‘और’ से व्यक्त किया गया है तथा स्थान-नाम גְדֵרוֹת का देवनागरी लिप्यंतरण ‘गदेरोत’ किया गया है।
- source_word: בֵּית דָּגוֹן
  choice: बेत-दागोन
  rationale: यह ‘घर’ और ‘दागोन’ से बना स्थान-नाम है; इसलिए अर्थानुवाद के बजाय लिप्यंतरण किया गया है और संयुक्त नाम स्पष्ट करने के लिए योजक-चिह्न रखा गया है।
- source_word: וְ/נַעֲמָה
  choice: नामा
  rationale: स्थान-नाम נַעֲמָה का सरल, प्रचलन-संगत देवनागरी लिप्यंतरण किया गया है।
- source_word: וּ/מַקֵּדָה
  choice: और मक्केदा
  rationale: संयोजक को ‘और’ से व्यक्त करके स्थान-नाम का देवनागरी लिप्यंतरण किया गया है; हिब्रू के द्वित्व को ‘क्क’ से दर्शाया गया है।
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה
  choice: सोलह नगर
  rationale: क्षेत्र-विभाजन की सूची में עָרִים आबादी वाले नगरों को दर्शाता है; संख्या और संज्ञा को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: וְ/חַצְרֵיהֶן
  choice: और उनके गाँव
  rationale: חֲצֵרִים यहाँ नामित नगरों से जुड़े अधीनस्थ ग्रामीण निवासों के अर्थ में है; ‘गाँव’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
theological_decisions: []
