  text: And the eastern border was the Salt Sea, as far as the mouth of the Jordan. And the border on the north side was from the tongue of the sea, from the mouth of the Jordan.
translation:
  language: hi
  text: और पूर्वी सीमा यरदन के मुहाने तक खारा समुद्र थी। उत्तरी ओर की सीमा यरदन के मुहाने पर समुद्र की खाड़ी से आरम्भ होती थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָם הַמֶּלַח
  choice: खारा समुद्र
  rationale: इब्रानी पद का सीधा और सामान्य आधुनिक हिन्दी रूप; यह भौगोलिक नाम की अर्थवत्ता बनाए रखता है।
- source_word: קְצֵה הַיַּרְדֵּן
  choice: यरदन का मुहाना
  rationale: शाब्दिक अर्थ 'यरदन का सिरा/अंत' है; इस सीमा-वर्णन में आशय उस स्थान से है जहाँ यरदन नदी समुद्र में मिलती है।
- source_word: לְשׁוֹן הַיָּם
  choice: समुद्र की खाड़ी
  rationale: शाब्दिक रूप 'समुद्र की जीभ' है, जो यहाँ भीतर निकले जलभाग अथवा खाड़ी जैसी भौगोलिक आकृति को दर्शाता है; स्वाभाविक हिन्दी में 'खाड़ी' स्पष्ट है।
- source_word: לִפְאַת צָפוֹנָה
  choice: उत्तरी ओर
  rationale: सीमा की उत्तर दिशा/भुजा का सहज आधुनिक हिन्दी निरूपण।
