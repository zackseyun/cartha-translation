base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/062.yaml
  text: 'and Nibshan[a], the City of Salt, and En-gedi: six cities with their settlements.'
translation:
  language: hi
  text: और निबशान, नमक का नगर और एन-गदी—कुल छह नगर और उनकी बस्तियाँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנִּבְשָׁן
  choice: निबशान
  rationale: यह स्थान-नाम है; हिब्रू उपपद को नाम का अंग बनाए बिना देवनागरी में प्रचलित ध्वन्यात्मक रूप दिया गया है।
- source_word: עִיר הַמֶּלַח
  choice: नमक का नगर
  rationale: इस पारदर्शी रचना का अर्थ अक्षुण्ण रखते हुए स्वाभाविक हिन्दी स्थान-नाम के रूप में अनुवाद किया गया है।
- source_word: עֵין גֶּדִי
  choice: एन-गदी
  rationale: स्थापित स्थान-नाम होने के कारण उसके घटकों का अर्थानुवाद करने के बजाय लिप्यंतरण किया गया है।
- source_word: עָרִים שֵׁשׁ
  choice: कुल छह नगर
  rationale: सूची के संख्यात्मक सार को हिन्दी में स्पष्ट करने के लिए 'कुल' जोड़ा गया है; 'नगर' עָרִים का सामान्य उपयुक्त रूप है।
- source_word: חַצְרֵיהֶן
  choice: उनकी बस्तियाँ
  rationale: यह मुख्य नगरों से संबद्ध छोटे या आश्रित निवास-स्थानों को सूचित कर सकता है; 'बस्तियाँ' अर्थ की व्यापकता बनाए रखता है।
- source_word: וְ
  choice: और
  rationale: पद बड़ी स्थान-सूची का हिस्सा है, इसलिए आरंभिक तथा सूची-संयोजक वाव को 'और' से दर्शाया गया है।
theological_decisions: []
