  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण सूची-शैली रखी गई है। स्थान-नाम देवनागरी में लिप्यंतरित हैं; पारदर्शी नाम עִיר הַמֶּלַח का अर्थानुवाद किया गया है।
