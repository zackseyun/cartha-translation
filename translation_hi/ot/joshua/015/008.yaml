base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/008.yaml
  text: Then the border went up by the Valley of Ben-hinnom to the slope of the Jebusite on the south (that is[a], Jerusalem), and the border went up to the top of the mountain that lies west of the Valley of Hinnom[c][b], at the northern end of the Valley of Rephaim.
translation:
  language: hi
  text: फिर सीमा बेन-हिन्नोम की घाटी से होकर यबूसी नगर की दक्षिणी ढलान तक ऊपर गई—वही यरूशलेम है[a]। वहाँ से सीमा उस पहाड़ की चोटी तक ऊपर गई, जो हिन्नोम की घाटी के पश्चिम[b] में है और रपाईम की घाटी के उत्तरी छोर पर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अर्थात् यरूशलेम।” इब्रानी पाठ यबूसी स्थल की पहचान यरूशलेम के रूप में करता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “समुद्र की ओर”; यह पश्चिम दिशा के लिए प्रचलित मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה
  choice: फिर ... ऊपर गई
  rationale: सीमा-वर्णन में यह क्रिया क्रमिक आगे बढ़ने के साथ ऊँचाई की ओर जाने को बताती है; आधुनिक हिन्दी में यह रूप स्वाभाविक है।
- source_word: הַגְּבוּל
  choice: सीमा
  rationale: भूमि-विभाजन के प्रसंग में यह क्षेत्र की सीमा-रेखा को सूचित करता है।
- source_word: גֵּי בֶן הִנֹּם
  choice: बेन-हिन्नोम की घाटी
  rationale: स्थान-नाम का स्वरूप बनाए रखने के लिए ‘बेन-हिन्नोम’ का लिप्यंतरण किया गया है।
- source_word: כֶּתֶף
  choice: ढलान
  rationale: शाब्दिक अर्थ ‘कंधा’ है, पर स्थलाकृतिक प्रयोग में पहाड़ी का पार्श्व या ढलान अभिप्रेत है।
- source_word: הַיְבוּסִי
  choice: यबूसी
  rationale: इब्रानी रूप को निकटता से रखते हुए यबूसी स्थल/निवासी-संबंधी संज्ञा को सुरक्षित रखा गया है।
- source_word: מִנֶּגֶב
  choice: दक्षिणी
  rationale: यहाँ वाक्यांश यबूसी स्थल की दक्षिणी ओर स्थित ढलान को सूचित करता है।
- source_word: הִיא יְרוּשָׁלִָם
  choice: वही यरूशलेम है
  rationale: इब्रानी का स्पष्ट पहचान-वाक्य बनाए रखा गया है, बिना उसे केवल कोष्ठकीय सूचना में बदलने के।
- source_word: רֹאשׁ הָהָר
  choice: पहाड़ की चोटी
  rationale: यह ऊँचे स्थल के शीर्ष के लिए स्वाभाविक आधुनिक हिन्दी अभिव्यक्ति है।
- source_word: אֲשֶׁר עַל פְּנֵי גֵי הִנֹּם יָמָּה
  choice: हिन्नोम की घाटी के पश्चिम में स्थित
  rationale: स्थलाकृतिक संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; יָמָּה का दिशात्मक अर्थ ‘पश्चिम’ है।
- source_word: בִּקְצֵה ... צָפֹנָה
  choice: उत्तरी छोर पर
  rationale: दोनों तत्वों को साथ रखकर घाटी के उत्तर की ओर वाले अंतिम किनारे का अर्थ दिया गया है।
- source_word: עֵמֶק רְפָאִים
  choice: रपाईम की घाटी
  rationale: यह स्थान-नाम है; विवादित जातीय या अलौकिक अर्थ आरोपित करने के बजाय लिप्यंतरण रखा गया है।
