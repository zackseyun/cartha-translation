- source_word: הִיא
  choice: अर्थात्
  rationale: यह सर्वनाम यहाँ पिछले स्थान-नाम की पहचान स्पष्ट करता है; आधुनिक हिंदी में ‘अर्थात्’ उसका स्वाभाविक समतुल्य है।
- source_word: חָצוֹר
  choice: हासोर
  rationale: अंतिम शब्द पूर्ववर्ती नगर की वैकल्पिक पहचान बताने वाला स्थान-नाम है; हिब्रू उच्चारण के निकट लिप्यंतरण रखा गया है।
