  text: וַ/יְהִ֣י הַ/גּוֹרָ֗ל לְ/מַטֵּ֛ה בְּנֵ֥י יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם אֶל גְּב֨וּל אֱד֧וֹם מִדְבַּר צִ֛ן נֶ֖גְבָּ/ה מִ/קְצֵ֥ה תֵימָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/001.yaml
  text: And the lot for the tribe of the sons of Judah[a], according to their clans, was to the border of Edom, to the wilderness of Zin, southward[c][b], at the farthest south.
translation:
  language: hi
  text: यहूदा के वंशजों के गोत्र को, उनके कुलों के अनुसार, चिट्ठी से मिला भाग एदोम की सीमा तक था—दक्षिण की ओर सीन के निर्जन प्रदेश में, दक्षिण के अंतिम छोर पर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, ‘तेमान/दक्षिण के छोर से।’ यहाँ ‘तेमान’ का अर्थ दक्षिण भी हो सकता है और एक स्थाननाम भी।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: जो चिट्ठी मिली
  rationale: भूमि-विभाजन के संदर्भ में גורל चिट्ठी डालकर मिले भाग को दर्शाता है। हिंदी में ‘चिट्ठी मिली’ उस ठोस प्रक्रिया और उसके परिणाम दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְמַטֵּה בְּנֵי יְהוּדָה
  choice: यहूदा के वंशजों के गोत्र को
  rationale: מַטֶּה का प्रसंगानुकूल अर्थ ‘गोत्र’ है और בְּנֵי יְהוּדָה यहाँ यहूदा के जनजातीय वंशजों को सूचित करता है; ‘वंशजों’ से आधुनिक हिंदी में आशय स्पष्ट रहता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: इस जनगणना और भूमि-विभाजन संबंधी संदर्भ में מִשְׁפָּחָה गोत्र के भीतर के कुल को दर्शाता है।
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: एदोम की सीमा तक
  rationale: גְּבוּל क्षेत्रीय सीमा को दर्शाता है और אֶל यहाँ विस्तार की सीमा बताता है।
- source_word: מִדְבַּר צִן
  choice: सीन का निर्जन प्रदेश
  rationale: מִדְבָּר सूखे, कम आबाद वन्य क्षेत्र को दर्शाता है; ‘निर्जन प्रदेश’ आधुनिक हिंदी में ‘जंगल’ की भ्रामक हरित-वन वाली छवि से बचता है।
- source_word: נֶגְבָּה
  choice: दक्षिण की ओर
  rationale: यह रूप यहाँ दिशासूचक क्रिया-विशेषण है, इसलिए इसे ‘नेगेव’ नामक क्षेत्र न मानकर दिशा के रूप में प्रस्तुत किया गया है।
- source_word: מִקְצֵה תֵימָן
  choice: दक्षिणी छोर तक
  rationale: प्रसंग में תֵימָן का दिशात्मक अर्थ ‘दक्षिण’ अधिक स्वाभाविक है और קָצֶה चरम सीमा या छोर को दर्शाता है।
