lexical_decisions:
- source_word: יָמָּה
  choice: पश्चिम की ओर
  rationale: इस भौगोलिक संदर्भ में ‘समुद्र की ओर’ का आशय भूमध्य सागर की दिशा, अर्थात पश्चिम, है; मुख्य पाठ में स्वाभाविक दिशा-सूचक अभिव्यक्ति रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: עַל יַד אַשְׁדּוֹד
  choice: अशदोद के पास
  rationale: मुहावरे का अर्थ अशदोद के निकट या बगल में स्थित क्षेत्र है; ‘के पास’ आधुनिक हिन्दी में सहज और अर्थनिष्ठ है।
- source_word: חַצְרֵיהֶן
  choice: उनके गाँव
  rationale: חצר यहाँ दीवाररहित बस्तियों या आश्रित गाँवों को सूचित करता है; ‘गाँव’ संदर्भ में स्पष्ट और सामान्य हिन्दी है।
