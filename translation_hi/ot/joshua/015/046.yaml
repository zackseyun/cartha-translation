  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। यह पद नगरों और उनसे जुड़े क्षेत्रों की सूची का अंश है; इसलिए इसकी संक्षिप्त सूचीगत संरचना बनाए रखी गई है। ‘सारा क्षेत्र’ मूल के ‘सब जो…’ को स्वाभाविक हिन्दी में व्यक्त करता है।
