- source_word: מָעוֹן
  choice: माओन
  rationale: यह बस्तियों की सूची में एक स्थान-नाम है; इसलिए सामान्य संज्ञा ‘निवास’ के रूप में अनुवाद करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: כַּרְמֶל
  choice: कर्मेल
