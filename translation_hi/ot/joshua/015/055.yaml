- source_word: וָזִיף
  choice: ज़ीप
  rationale: ו को सूची के समापन में ‘और’ से व्यक्त किया गया है और זִיף को पहचान योग्य स्थान-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וְיוּטָּה
  choice: और युत्ता
  rationale: संयोजक ו को ‘और’ तथा स्थान-नाम יוּטָּה को देवनागरी में ‘युत्ता’ के रूप में प्रस्तुत किया गया है।
