- source_word: וַ / וּ
  choice: और
  rationale: सूची की अंतिम इकाइयों को जोड़ने वाले हिब्रू समुच्चयबोधकों को स्वाभाविक आधुनिक हिन्दी में ‘और’ से व्यक्त किया गया है।
