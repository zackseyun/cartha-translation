translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। प्राचीन स्थान-नामों का देवनागरी लिप्यंतरण किया गया है। लंबे इब्रानी संबंधवाचक क्रम को स्पष्ट करने के लिए अर्धविराम और ‘यह चढ़ाई’ का प्रयोग किया गया है, बिना भौगोलिक सूचना बदले।
