  text: וְ/עָלָ֨ה הַ/גְּב֥וּל דְּבִרָ/ה֮ מֵ/עֵ֣מֶק עָכוֹר֒ וְ/צָפ֜וֹנָ/ה פֹּנֶ֣ה אֶל הַ/גִּלְגָּ֗ל אֲשֶׁר נֹ֨כַח֙ לְ/מַעֲלֵ֣ה אֲדֻמִּ֔ים אֲשֶׁ֥ר מִ/נֶּ֖גֶב לַ/נָּ֑חַל וְ/עָבַ֤ר הַ/גְּבוּל֙ אֶל מֵי עֵ֣ין שֶׁ֔מֶשׁ וְ/הָי֥וּ תֹצְאֹתָ֖י/ו אֶל עֵ֥ין רֹגֵֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/007.yaml
  text: And the border went up to Debir from the Valley of Achor[a], and turned northward toward Gilgal, which is opposite the Ascent of Adummim, which is south of the wadi. Then the border passed on to the waters of En-shemesh[c][b], and its end was at En-rogel.
translation:
  language: hi
  text: और सीमा आकोर की घाटी से दबीर तक ऊपर गई और उत्तर की ओर मुड़कर गिलगाल[a] की तरफ गई, जो अदुम्मीम की चढ़ाई के सामने है; यह चढ़ाई नाले[b] के दक्षिण में है। फिर सीमा एन-शेमेश के जल तक आगे गई, और उसका अंत[c] एन-रोगेल पर हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गिलगाल तक गई”; इब्रानी में यहाँ प्रयुक्त शब्द उस स्थान की दिशा में बढ़ने या वहाँ तक पहुँचने—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “नाला” इब्रानी נחל का अनुवाद है, जो प्रायः बरसाती जलधारा, उसके पाट या उससे बनी खड्ड को दर्शाता है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से “उसके निकास”; इब्रानी में बहुवचन रूप है, जो इस सीमा के समाप्ति-बिंदु को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה הַגְּבוּל
  choice: सीमा ... ऊपर गई
  rationale: सीमा-वर्णन में עלה भू-भाग की ऊँचाई की ओर बढ़ने या ऊपर जाने का संकेत देता है; यह हिंदी में स्वाभाविक रहते हुए स्थलाकृतिक अर्थ बनाए रखता है।
- source_word: דְּבִרָה מֵעֵמֶק עָכוֹר
  choice: आकोर की घाटी से दबीर तक
  rationale: दिशासूचक ה दबीर की ओर गति बताता है, और עֵמֶק का सीधा अर्थ ‘घाटी’ है।
- source_word: וְצָפוֹנָה פֹּנֶה
  choice: उत्तर की ओर मुड़कर
  rationale: פּנה यहाँ सीमा-रेखा के दिशा बदलने या उस ओर मुख करने को दर्शाता है; ‘मुड़कर’ सीमा-वर्णन में सहज है।
- source_word: אֶל הַגִּלְגָּל
  choice: गिलगाल की तरफ
  rationale: אֶל गंतव्य अथवा दिशा दोनों बता सकता है; ‘की तरफ’ यहाँ दिशा को प्रमुख रखता है और संभावित आगमन को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֲשֶׁר נֹכַח לְמַעֲלֵה אֲדֻמִּים
  choice: जो अदुम्मीम की चढ़ाई के सामने है
  rationale: נֹכַח का अर्थ ‘सामने/आमने-सामने’ और מַעֲלֵה का अर्थ चढ़ाई वाला मार्ग या आरोहण है।
- source_word: אֲשֶׁר מִנֶּגֶב לַנָּחַל
  choice: यह चढ़ाई नाले के दक्षिण में है
  rationale: निकटतम पूर्वपद ‘अदुम्मीम की चढ़ाई’ को संबंधवाचक उपवाक्य का संदर्भ माना गया है। נֶגֶב यहाँ दिशा ‘दक्षिण’ है और נַחַל इस भू-वर्णन में जलधारा अथवा मौसमी नाले की घाटी को सूचित करता है।
- source_word: וְעָבַר הַגְּבוּל
  choice: फिर सीमा ... आगे गई
  rationale: सीमा-वर्णन में עבר अगले स्थल तक आगे बढ़ने को बता सकता है; ‘आगे गई’ किसी अनिश्चित वास्तविक पारगमन को आरोपित नहीं करता।
- source_word: אֶל מֵי עֵין שֶׁמֶשׁ
  choice: एन-शेमेश के जल तक
  rationale: מֵי का शाब्दिक अर्थ ‘जल’ है; स्थान-नाम एन-शेमेश को लिप्यंतरित रखते हुए स्रोत की अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: וְהָיוּ תֹצְאֹתָיו אֶל עֵין רֹגֵל
  choice: और उसका अंत एन-रोगेल पर हुआ
  rationale: सीमा-वर्णन में תֹצְאוֹת उसके अंतिम बिंदु या समाप्ति को दर्शाता है। सहज हिंदी में एकवचन ‘अंत’ रखा गया है, जबकि स्रोत के बहुवचन रूप की सूचना पादटिप्पणी में दी गई है।
