- source_word: וְ
  choice: और
  rationale: इब्रानी संयोजक नगरों की सूची को जोड़ता है। स्वाभाविक हिन्दी सूची-शैली में पहले नामों के बीच अल्पविराम और अंतिम नाम से पहले ‘और’ रखा गया है।
