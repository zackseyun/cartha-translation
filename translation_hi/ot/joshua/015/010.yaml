  text: וְ/נָסַב֩ הַ/גְּב֨וּל מִ/בַּעֲלָ֥ה יָ֨מָּ/ה֙ אֶל הַ֣ר שֵׂעִ֔יר וְ/עָבַ֕ר אֶל כֶּ֧תֶף הַר יְעָרִ֛ים מִ/צָּפ֖וֹנָ/ה הִ֣יא כְסָל֑וֹן וְ/יָרַ֥ד בֵּֽית שֶׁ֖מֶשׁ וְ/עָבַ֥ר תִּמְנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/010.yaml
  text: Then the border turned from Baalah westward to Mount Seir[a], passed along to the northern slope of Mount Jearim (that is, Chesalon), went down to Beth-shemesh, and passed on to Timnah.
translation:
  language: hi
  text: तब सीमा बालाह से पश्चिम की ओर[a] मुड़कर सेईर पर्वत तक गई। वहाँ से वह यारीम पर्वत की उत्तरी ढलान तक आगे बढ़ी—वही कसालोन है—फिर बेत-शेमेश तक नीचे उतरी और तिम्ना तक आगे बढ़ी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘समुद्र की ओर’; यह पश्चिम दिशा के लिए प्रचलित मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב הַגְּבוּל
  choice: सीमा ... मुड़कर
  rationale: सीमा-वर्णन में यह क्रिया दिशा बदलने को व्यक्त करती है; ‘मुड़कर’ स्वाभाविक और भौगोलिक अर्थ में स्पष्ट है।
- source_word: מִבַּעֲלָה
  choice: बालाह से
  rationale: स्थान-नाम को ध्वन्यंतरित किया गया है और מִן का स्रोत-सूचक अर्थ ‘से’ द्वारा रखा गया है।
- source_word: יָמָּה
  choice: पश्चिम की ओर
  rationale: शाब्दिक अर्थ ‘समुद्र की ओर’ है, जो इस्राएल के भूगोल में पश्चिम दिशा का प्रचलित संकेत है; मुख्य पाठ में दिशा स्पष्ट की गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: אֶל הַר שֵׂעִיר
  choice: सेईर पर्वत तक
  rationale: הַר को यहाँ सीमा के भौगोलिक चिह्न के रूप में ‘पर्वत’ और אֶל को गंतव्यसूचक ‘तक’ से व्यक्त किया गया है।
- source_word: וְעָבַר אֶל כֶּתֶף
  choice: ढलान तक आगे बढ़ी
  rationale: כֶּתֶף का मूल बिंब ‘कंधा/पार्श्व’ है; पर्वत के संदर्भ में ‘ढलान’ सहज भौगोलिक शब्द है। וְעָבַר सीमा-रेखा के आगे बढ़ने को दर्शाता है।
- source_word: הַר יְעָרִים מִצָּפוֹנָה
  choice: यारीम पर्वत की उत्तरी ढलान
  rationale: संदर्भ में מִצָּפוֹנָה पर्वत के उत्तर वाले पार्श्व को निर्दिष्ट करता है; हिंदी में ‘उत्तरी ढलान’ स्वाभाविक है।
- source_word: הִיא כְסָלוֹן
  choice: वही कसालोन है
  rationale: स्त्रीलिंग सर्वनाम को पूर्वोक्त भौगोलिक इकाई की पहचान बताने वाली व्याख्यात्मक उपवाक्य के रूप में रखा गया है, बिना पहचान को अधिक स्पष्ट करके मूल की संभावित व्याकरणिक अस्पष्टता मिटाए।
- source_word: וְיָרַד בֵּית שֶׁמֶשׁ
  choice: फिर नीचे बेत-शेमेश को गई
  rationale: יָרַד ऊँचाई से नीचे जाने का स्थलाकृतिक भाव रखता है; ‘नीचे ... को गई’ उस दिशा और गंतव्य दोनों को बनाए रखता है।
- source_word: וְעָבַר תִּמְנָה
  choice: तिम्ना से आगे निकल गई
  rationale: सीमा-वर्णन में עבר किसी स्थान के पास से होकर आगे जाने का भाव दे सकता है; यह रूप अनावश्यक रूप से नगर के भीतर से गुजरना निश्चित नहीं करता।
