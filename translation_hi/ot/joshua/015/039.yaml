lexical_decisions:
- source_word: לָכִישׁ
  choice: लाकीश
  rationale: यह यहूदा के एक नगर का व्यक्तिवाचक नाम है; हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: בָצְקַת
  choice: बोसकत
  rationale: नगर-सूची में आया स्थान-नाम है। हिब्रू व्यंजन צ को यहाँ प्रचलित सरल हिंदी लिप्यंतरण में ‘स’ से दर्शाया गया है।
- source_word: עֶגְלוֹן
  choice: एग्लोन
  rationale: यहाँ यह नगर का नाम है, मोआबी राजा का उल्लेख नहीं; इसलिए नाम का लिप्यंतरण किया गया है।
- source_word: וּ / וְ
  choice: और
  rationale: उपसर्गीय समुच्चयबोधक नगरों की सूची को जोड़ते हैं; स्वाभाविक हिंदी सूची-विन्यास में अंतिम नाम से पहले ‘और’ रखा गया है।
