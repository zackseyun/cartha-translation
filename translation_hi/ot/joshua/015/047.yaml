  text: Ashdod[a], its daughter towns and its villages; Gaza, its daughter towns and its villages; as far as the Brook of Egypt, and the Great Sea[c][b], which is its boundary.
translation:
  language: hi
  text: अश्दोद, उसके संबद्ध नगरों[a] और उसके गाँवों समेत; गाज़ा, उसके संबद्ध नगरों और उसके गाँवों समेत; मिस्र के नाले[b] तक, और समुद्र, जो उसकी सीमा है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “बेटियाँ” है। यह मुख्य नगर से जुड़े या उसके आश्रित छोटे नगरों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या “मिस्र की मौसमी जलधारा” या “मिस्र की वादी।” इब्रानी शब्द נחל किसी मौसमी जलमार्ग या वादी को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात भूमध्य सागर।
    reason: cross_reference
lexical_decisions:
- source_word: בְּנוֹתֶיהָ
  choice: उसके अधीन नगर
  rationale: शाब्दिक अर्थ ‘उसकी बेटियाँ’ है, पर भू-क्षेत्रीय सूचियों में यह मुख्य नगर पर आश्रित छोटे नगरों के लिए प्रयुक्त मुहावरा है। ‘अधीन नगर’ आधुनिक हिन्दी में संबंध स्पष्ट करता है।
- source_word: חֲצֵרֶיהָ
  choice: उसके गाँव
  rationale: इस भौगोलिक संदर्भ में यह बाहर स्थित छोटी बस्तियों को दर्शाता है; ‘गाँव’ सहज और स्पष्ट हिन्दी है।
- source_word: נַחַל מִצְרָיִם
  choice: मिस्र का नाला
  rationale: נחל नदी, नाला अथवा मौसमी जलधारा का संकेत कर सकता है। ‘नाला’ स्रोत की भौगोलिक अनिश्चितता को बनाए रखता है और सामान्य पाठक के लिए सुबोध है।
- source_word: הַיָּם
  choice: महासागर
  rationale: शाब्दिक पाठ में ‘समुद्र’ है; इस सीमा-वर्णन में संकेत भूमध्य सागर की ओर है। हिन्दी बाइबलीय भौगोलिक प्रयोग में ‘महासागर’ उसके विख्यात बड़े समुद्र होने का भाव संक्षेप में व्यक्त करता है, जबकि पादटिप्पणी पहचान स्पष्ट करती है।
- source_word: הַגְבוּל וּגְבוּל
  choice: जो उसकी सीमा है
  rationale: मसोरेटिक पाठ का अंत संक्षिप्त और कुछ कठिन है। यह अनुवाद समुद्र के सीमा होने का संभावित आशय स्वाभाविक हिन्दी में देता है, बिना अतिरिक्त भूगोल जोड़े।
- source_word: עַד
  choice: तक
  rationale: सीमा अथवा विस्तार की अंतिम हद बताने के लिए आधुनिक हिन्दी का स्वाभाविक पद।
- source_word: אַשְׁדּוֹד / עַזָּה
  choice: अशदोद / गाज़ा
  rationale: स्थान-नामों का प्रचलित हिन्दी लिप्यंतरण।
