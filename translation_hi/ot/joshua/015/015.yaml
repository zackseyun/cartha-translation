  yaml_path: translation/ot/joshua/015/015.yaml
  text: From there he went up against the inhabitants of Debir[a]. (Formerly the name of Debir was Kiriath-sepher.)
translation:
  language: hi
  text: वहाँ से वह दबीर के निवासियों पर चढ़ाई करने गया। (पहले दबीर का नाम किर्यत-सेपेर[a] था।)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “किर्यत-सेपेर” का अर्थ “पुस्तक का नगर” या “लेखन का नगर” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: वह ... पर चढ़ाई करने गया
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है; सैन्य प्रसंग में यह किसी स्थान या उसके निवासियों के विरुद्ध आगे बढ़ने का भाव भी देता है। ‘चढ़ाई करने गया’ चढ़ने और शत्रुतापूर्ण अभियान—दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: यह पहले बताए गए स्थान से आगे की गति दर्शाने वाला सामान्य स्थानवाचक पद है।
- source_word: אֶל יֹשְׁבֵי דְּבִר
  choice: दबीर के निवासियों पर
  rationale: יֹשְׁבֵי का अर्थ ‘निवासी’ है। सैन्य प्रसंग और וַיַּעַל के साथ ‘पर’ विरोध की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דְּבִר
  choice: दबीर
  rationale: स्थान-नाम को अर्थानुवाद के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: וְשֵׁם דְּבִר לְפָנִים
  choice: पहले दबीर का नाम ... था
  rationale: לְפָנִים यहाँ कालवाचक है, अर्थात ‘पहले/पूर्वकाल में।’ हिन्दी में यह विन्यास संक्षिप्त और सहज है।
- source_word: קִרְיַת סֵפֶר
  choice: किर्यत-सेपेर
  rationale: मुख्य पाठ में स्थान-नाम का लिप्यंतरण रखा गया है। इसके घटकों से सम्भावित अर्थ ‘पुस्तक का नगर’ अथवा ‘लेखन का नगर’ निकलता है, जिसे पादटिप्पणी में सुरक्षित किया गया है।
