  yaml_path: translation/ot/joshua/015/006.yaml
  text: Then the border went up to Beth-hoglah[a], and passed north of Beth-arabah; and the border went up to the stone of Bohan son of Reuben.
translation:
  language: hi
  text: तब सीमा बेथ-होग्ला तक ऊपर गई और बेथ-अराबा के उत्तर से होकर गुज़री; और सीमा रूबेन के पुत्र बोहन के पत्थर[a] तक ऊपर गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बोहन की शिला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה
  choice: ऊपर गई
  rationale: सीमा-वर्णन में यह क्रिया सीमा-रेखा के ऊँचाई की ओर बढ़ने को दर्शा सकती है; ‘ऊपर गई’ इस स्थलाकृतिक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַגְּבוּל
  choice: सीमा
  rationale: यहाँ शब्द पूरे भूभाग के बजाय उसकी सीमा-रेखा को सूचित करता है; ‘सीमा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בֵּית חָגְלָה
  choice: बेथ-होग्ला
  rationale: स्थान-नाम का अनुवाद करने के बजाय उसका प्रचलित लिप्यंतरण रखा गया है।
- source_word: וְעָבַר
  choice: से होकर आगे बढ़ी
  rationale: सीमा-सूची में यह क्रिया किसी स्थान के पास से सीमा के आगे बढ़ने को व्यक्त करती है; यह हिन्दी प्रयोग प्रसंग को स्पष्ट करता है।
- source_word: מִצְּפוֹן לְבֵית הָעֲרָבָה
  choice: बेथ-अराबा के उत्तर से
  rationale: सीमा-सूत्र में यह वाक्यांश बेथ-अराबा के सापेक्ष सीमा की स्थिति बताता है; ‘के उत्तर से’ मूल भौगोलिक संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶבֶן בֹּהַן
  choice: बोहन के पत्थर
  rationale: इब्रानी संबंधवाचक संरचना को सीधे रखा गया है और אֶבֶן का सामान्य अर्थ ‘पत्थर’ चुना गया है।
- source_word: בֶּן רְאוּבֵן
  choice: रूबेन के पुत्र
  rationale: मूल पाठ स्पष्ट रूप से ‘रूबेन का पुत्र’ कहता है; इसे अधिक व्याख्यात्मक ‘रूबेनी’ में नहीं बदला गया है।
