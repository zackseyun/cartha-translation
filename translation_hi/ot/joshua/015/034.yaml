translation:
  language: hi
  text: ज़ानोह, एन-गन्नीम[a], तप्पूह[b] और एनाम[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “एन-गन्नीम” का संभावित अर्थ “बाग़ों का सोता” है।
    reason: lexical_alternative
  - marker: b
    text: “तप्पूह” एक स्थान-नाम है; इसका मूल इब्रानी शब्द “सेब” या किसी फलदार पेड़ को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: “एनाम” एक स्थान-नाम है; इब्रानी रूप में निश्चित उपपद और द्विवचन रूप है, इसलिए इसका शाब्दिक अर्थ लगभग “दो सोते” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנוֹחַ
  choice: ज़ानोह
  rationale: नगरों की सूची में यह स्थान-नाम है; इसलिए इसका अर्थानुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: עֵין גַּנִּים
  choice: एन-गन्नीम
  rationale: यह עֵין (‘सोता/जलस्रोत’) और גַּנִּים (‘बाग़’) से बना संयुक्त स्थान-नाम है। मुख्य पाठ में स्थान-नाम के रूप में लिप्यंतरण रखा गया और अर्थ पादटिप्पणी में दिया गया है।
- source_word: תַּפּוּחַ
  choice: तप्पूह
  rationale: यहाँ यह स्थान-नाम के रूप में प्रयुक्त है। मूल इब्रानी शब्द किसी सेब अथवा फलदार पेड़ को भी सूचित कर सकता है, पर मुख्य पाठ में लिप्यंतरण अधिक उपयुक्त है।
- source_word: הָעֵינָם
  choice: एनाम
  rationale: यह निश्चित उपपद सहित एक स्थान-नाम है। हिंदी मुख्य पाठ में इसे स्थापित नाम की तरह लिप्यंतरित किया गया है; उसके शाब्दिक रूप की सूचना पादटिप्पणी में दी गई है।
