  language: hi
  text: हक्कैन, गिबा और तिम्ना—दस नगर और उनकी बस्तियाँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके गाँव।” इब्रानी शब्द नामित नगरों से संबद्ध छोटी या आश्रित बसाहटों का संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקַּיִן
  choice: हक्कैन
  rationale: नगर-सूची में यह स्थान-नाम है। आरंभिक निश्चित उपपद को नाम के पारंपरिक रूप का अंग मानते हुए लिप्यंतरित किया गया है।
- source_word: גִּבְעָה
  choice: गिबा
  rationale: यहाँ सामान्य अर्थ ‘पहाड़ी’ नहीं, बल्कि स्थान-नाम है; इसलिए उसका लिप्यंतरण किया गया है।
- source_word: תִמְנָה
  choice: तिम्ना
  rationale: यह भूमि-विभाजन की नगर-सूची में प्रयुक्त स्थान-नाम है, इसलिए लिप्यंतरण उपयुक्त है।
- source_word: עָרִים עֶשֶׂר
  choice: दस नगर
  rationale: यह सूची में गिने गए नगरीय स्थानों की संख्या बताने वाला मानक इब्रानी पदबंध है।
- source_word: חַצְרֵיהֶן
  choice: उनके आसपास की बस्तियाँ
  rationale: इब्रानी शब्द नामित नगरों से संबद्ध छोटी, आश्रित या निकटवर्ती बसाहटों को दर्शाता है; ‘आसपास की बस्तियाँ’ आधुनिक हिंदी में इस संबंध को स्वाभाविक रूप से स्पष्ट करता है।
