  text: Then the border curved from the top of the mountain to the spring of the waters of Nephtoah[a], and went out to the cities of Mount Ephron; then the border curved to Baalah (that is, Kiriath-jearim).
translation:
  language: hi
  text: फिर सीमा पहाड़ की चोटी से नप्तोह के जल के सोते तक मुड़ी[a] और एप्रोन पर्वत के नगरों तक आगे बढ़ी। फिर सीमा बालाह की ओर मुड़ी; वही किर्यत-यारीम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सीमा का मार्ग अंकित किया गया” या “सीमा मुड़कर आगे बढ़ी।” सीमा-वर्णन में इब्रानी क्रिया दिशा बदलने अथवा किसी स्थल के चारों ओर सीमा-रेखा खींचे जाने का अर्थ दे सकती है।
    reason: इब्रानी וְתָאַר के सीमा-वर्णनात्मक वैकल्पिक अर्थ को सुरक्षित रखने और अंग्रेज़ी audit trail के lexical_alternative एंकर के अनुरूप रखने के लिए।
lexical_decisions:
- source_word: וְתָאַר
  choice: मुड़ी
  rationale: सीमा-वर्णन में यह क्रिया सीमा-रेखा के दिशा बदलने या किसी स्थल के चारों ओर खिंचने का बोध करा सकती है। यहाँ स्वाभाविक हिन्दी में ‘मुड़ी’ स्थलाकृतिक गति को स्पष्ट रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַגְּבוּל
  choice: सीमा
  rationale: भूमि-विभाजन और प्रादेशिक सीमा के प्रसंग में यह मानक, स्पष्ट हिन्दी शब्द है।
- source_word: מֵרֹאשׁ הָהָר
  choice: पहाड़ की चोटी से
  rationale: भौगोलिक प्रयोग में רֹאשׁ का सीधा और स्वाभाविक अर्थ ‘चोटी’ है।
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: नप्तोह के जलस्रोत
  rationale: मूल के संयुक्त पद में सोते/स्रोत और नप्तोह के जल का संबंध है। ‘जलस्रोत’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है तथा स्थाननाम को लिप्यंतरित रखता है।
- source_word: וְיָצָא
  choice: तक गई
  rationale: सीमा-वर्णन में यह क्रिया सीमा-रेखा के आगे बढ़ने या किसी स्थान तक पहुँचने को बताती है। लक्ष्यसूचक אֶל के साथ ‘तक गई’ हिन्दी में स्वाभाविक है।
- source_word: עָרֵי הַר עֶפְרוֹן
  choice: एप्रोन पहाड़ के नगरों
  rationale: संक्षिप्त इब्रानी संबंध-पदावली को औपचारिक रूप से सुरक्षित रखते हुए עָרֵי को ‘नगरों’ और הַר עֶפְרוֹן को ‘एप्रोन पहाड़’ किया गया है।
- source_word: בַּעֲלָה
  choice: बाला
  rationale: स्थाननाम का देवनागरी लिप्यंतरण।
- source_word: הִיא קִרְיַת יְעָרִים
  choice: जो किर्यत-यारीम है
  rationale: मूल सर्वनाम बाला की पहचान दूसरे स्थाननाम से कराता है; ‘जो ... है’ इस संबंध को सहज हिन्दी में बनाए रखता है।
