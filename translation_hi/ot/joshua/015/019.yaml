  yaml_path: translation/ot/joshua/015/019.yaml
  text: She said[a], “Please give me a blessing, since you have given me the land of the Negev[c][b]; give me also springs of water.” So he gave her the upper springs and the lower springs.
translation:
  language: hi
  text: उसने कहा, “कृपया मुझे एक आशीष[a] दीजिए। आपने मुझे नेगेव की भूमि[b] दी है, इसलिए मुझे पानी के सोते[c] भी दीजिए।” तब उसके पिता ने उसे ऊपर के सोते और नीचे के सोते दे दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपहार।” इब्रानी में “आशीष” है; यहाँ यह किसी लाभकारी दान या अनुदान के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: “नेगेव” का अर्थ “दक्षिणी प्रदेश” या “शुष्क प्रदेश” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ प्रयुक्त इब्रानी शब्द पानी के सोतों, कुंडों या जलाशयों को सूचित कर सकता है; इस प्रसंग में “सोते” सबसे उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרָכָה
  choice: आशीष
  rationale: मूल शब्द का सामान्य अर्थ ‘आशीष’ है और यहाँ वह लाभकारी दान या अनुदान को दर्शाता है। ‘आशीष’ मूल की वाचा-संबंधी भाषा को बनाए रखता है, जबकि ‘उपहार’ अधिक व्याख्यात्मक होता।
- source_word: אֶרֶץ הַנֶּגֶב
  choice: नेगेव की भूमि
  rationale: נֶגֶב दक्षिणी अथवा शुष्क क्षेत्र को सूचित कर सकता है, पर यहाँ भौगोलिक नाम के रूप में ‘नेगेव’ सबसे स्पष्ट है।
- source_word: גֻּלֹּת מָיִם
  choice: पानी के सोते
  rationale: גֻּלֹּת का सटीक आशय विवादित है, पर प्रसंग में यह भूमि से जुड़े जल-स्रोतों को सूचित करता है। ऊपर और नीचे के स्रोतों के अगले उल्लेख को देखते हुए ‘सोते’ स्वाभाविक और उपयुक्त है।
- source_word: תְּנָה
  choice: कृपया ... दीजिए
  rationale: आज्ञार्थक रूप को पिता से किए गए विनम्र निवेदन के रूप में सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: וְנָתַתָּה לִי
  choice: मुझे ... भी दीजिए
  rationale: संयोजक वाव पहले दिए गए भूभाग के अतिरिक्त जल-स्रोत माँगने का भाव देता है; ‘भी’ इस योगात्मक संबंध को स्पष्ट करता है।
- source_word: גֻּלֹּת עִלִּיּוֹת
  choice: ऊपर के सोते
  rationale: עִלִּיּוֹת ऊँची स्थिति वाले जल-स्रोतों को दर्शाता है और पहले प्रयुक्त ‘सोते’ से संगति रखता है।
- source_word: גֻּלֹּת תַּחְתִּיּוֹת
  choice: नीचे के सोते
  rationale: यह ‘ऊपर के सोते’ के समानांतर निचली स्थिति वाले जल-स्रोतों को दर्शाता है।
- source_word: וַיִּתֶּן לָהּ
  choice: तब उसने उसे ... दे दिए
  rationale: कथात्मक वाव अनुरोध के बाद अगले कार्य को आगे बढ़ाता है; ‘तब’ हिन्दी में इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
