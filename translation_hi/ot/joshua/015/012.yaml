    text: या, “उनके परिवारों के अनुसार।” हिब्रू शब्द गोत्र के भीतर के कुल-समूहों को सूचित करता है।
    reason: lexical_alternative
  revision_rationale: “महासागर” को स्रोत-सटीक “बड़ा समुद्र” से बदला गया, समुद्र के साथ आए दूसरे “सीमा” को “उसकी तटरेखा” द्वारा व्यक्त किया गया, और व्याख्यात्मक भौगोलिक पहचान को फुटनोट में स्थानांतरित किया गया। कुलों-संबंधी वाक्यांश को अल्पविरामों से अलग कर उसके संबंध को स्पष्ट किया गया।
