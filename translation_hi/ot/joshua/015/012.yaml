base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/012.yaml
  text: And the western border was the Great Sea as a border[a]. This was the border of the sons of Judah all around[b], by their clans.
translation:
  language: hi
  text: और पश्चिम की सीमा बड़ा समुद्र और उसकी तटरेखा थी। यह यहूदा के वंशजों की, उनके कुलों के अनुसार, चारों ओर की सीमा थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּגְבוּל יָם
  choice: और पश्चिमी सीमा
  rationale: सीमा-विवरण में יָם पश्चिम की दिशा को सूचित करता है, क्योंकि समुद्र यहूदा के पश्चिम में था।
- source_word: הַיָּם הַגָּדוֹל
  choice: महासागर, अर्थात् भूमध्य सागर
  rationale: शाब्दिक अर्थ ‘बड़ा समुद्र’ है और इसका भौगोलिक संकेत भूमध्य सागर की ओर है; आधुनिक हिन्दी में ‘महासागर’ के साथ पहचान स्पष्ट की गई है।
- source_word: בְּנֵי יְהוּדָה
  choice: यहूदा के वंशजों
  rationale: यह हिब्रू वंशसूचक पद पूरे गोत्र के सदस्यों को सामूहिक रूप से दर्शाता है; ‘वंशज’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: סָבִיב
  choice: चारों ओर की
  rationale: यह पद उस समूची सीमा का सार देता है जो आवंटित क्षेत्र को चारों ओर से घेरे थी।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर के कुल-समूह को दर्शाता है; ‘कुलों के अनुसार’ वितरण-संबंधी आशय बनाए रखता है।
theological_decisions:
- issue: בְּנֵי יְהוּדָה का सामूहिक वंशसूचक अर्थ
  choice: यहूदा के वंशजों
  alternative: यहूदा के पुत्रों
  rationale: मूल पद व्याकरणतः पुल्लिंग है, पर इस भू-आवंटन प्रसंग में पूरे गोत्र को सामूहिक रूप से दर्शाता है। ‘वंशज’ लिंग-विशेष का अनावश्यक संकुचन किए बिना वंशगत संबंध सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भौगोलिक पहचान स्पष्ट है और गोत्र के भीतर कुल-आधारित व्यवस्था का आशय सुरक्षित है।
