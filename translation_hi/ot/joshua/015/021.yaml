  text: And the cities at the extremity of the tribe of the sons of Judah[a], toward the border of Edom in the Negev, were Kabzeel, Eder[b], and Jagur.
translation:
  language: hi
  text: 'और यहूदा के वंशजों के गोत्र के सुदूर छोर पर[a], एदोम की सीमा की ओर, नेगेव[b] में, ये नगर थे: कबसेएल, एदेर और यागूर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यहूदा के वंशजों के गोत्र के अंतिम सिरे से’; इब्रानी पदबंध यहूदा के गोत्रीय क्षेत्र के बाहरी छोर को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘नेगेव’ का अनुवाद ‘दक्षिण’ या ‘दक्षिणी प्रदेश’ भी किया जा सकता है। यहाँ सम्भवतः यह यहूदा के विशिष्ट दक्षिणी भूभाग का नाम है।
    reason: lexical_alternative
lexical_decisions:
