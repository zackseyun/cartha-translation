- source_word: מִקְצֵה לְמַטֵּה בְנֵי יְהוּדָה
  choice: यहूदा के वंशजों के गोत्र की भूमि के छोर पर
  rationale: מִקְצֵה बाहरी छोर या सीमा-प्रदेश को सूचित करता है। यहाँ क्षेत्रीय संदर्भ स्पष्ट करने के लिए ‘भूमि’ जोड़ा गया है; ‘यहूदा के वंशज’ पारंपरिक जनजातीय पदबंध בְנֵי יְהוּדָה को व्यक्त करता है।
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: एदोम की सीमा की ओर
  rationale: אֶל की दिशात्मक बारीकी को ‘की ओर’ से सुरक्षित रखा गया है; इससे ठीक सीमा पर स्थित होने का अनावश्यक दावा नहीं होता।
- source_word: בַּנֶּגְבָּה
  choice: नेगेव में
  rationale: यहूदा के भौगोलिक वर्णन में נֶגֶב विशिष्ट दक्षिणी क्षेत्र का नाम हो सकता है, इसलिए इसका लिप्यंतरण किया गया है; ‘दक्षिण’ वैकल्पिक अर्थ है।
- source_word: קַבְצְאֵל וְעֵדֶר וְיָגוּר
  choice: कबसेएल, एदेर और यागूर
  rationale: तीनों स्थान-नामों को उनके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
