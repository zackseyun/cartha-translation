  text: רְאוּ֩ הִפַּ֨לְתִּי לָ/כֶ֜ם אֶֽת הַ֠/גּוֹיִם הַ/נִּשְׁאָרִ֥ים הָ/אֵ֛לֶּה בְּ/נַחֲלָ֖ה לְ/שִׁבְטֵי/כֶ֑ם מִן הַ/יַּרְדֵּ֗ן וְ/כָל הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִכְרַ֔תִּי וְ/הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֥וֹא הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/004.yaml
  text: See[a], I have allotted to you these nations that remain as an inheritance for your tribes, from the Jordan, along with all the nations that I have cut off, to the Great Sea toward the going down of the sun.
translation:
  language: hi
  text: देखो, मैंने इन बची हुई जातियों को तुम्हारे गोत्रों के लिए विरासत के रूप में बाँट दिया है—यरदन से लेकर सूर्यास्त की ओर स्थित बड़े समुद्र[a] तक, उन सब जातियों समेत जिन्हें मैंने नाश कर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “सूर्य के अस्त होने की ओर,” अर्थात पश्चिम की ओर।'
    reason: मूल हिब्रू के दिशासूचक मुहावरे को स्पष्ट करना।
lexical_decisions:
- source_word: רְאוּ
  choice: देखो
  rationale: बहुवचन आज्ञार्थक रूप श्रोताओं का ध्यान जोर देकर खींचता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और मूल का प्रत्यक्ष आह्वान बनाए रखता है।
- source_word: הִפַּלְתִּי
  choice: बाँट दिया है
  rationale: हिफ़ील रूप यहाँ चिट्ठी द्वारा भूमि का भाग निर्धारित करने के मुहावरे में है। ‘बाँट दिया है’ हिन्दी में भूमि-वितरण का आशय स्पष्ट करता है; ‘चिट्ठी डालकर’ जोड़ना सम्भव है, पर मूल क्रिया के प्रसंगगत अर्थ को अनावश्यक रूप से विस्तार देता।
- source_word: הַגּוֹיִם הַנִּשְׁאָרִים הָאֵלֶּה
  choice: इन बची हुई जातियों
  rationale: यह पद उन जातियों को दर्शाता है जो अभी देश में बची हुई थीं। ‘बची हुई’ कृदन्त का अर्थ स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: בְּנַחֲלָה
  choice: विरासत के रूप में
  rationale: नחלה यहोशू में प्रायः पीढ़ी-दर-पीढ़ी प्राप्त भू-भाग को सूचित करता है। ‘विरासत’ इस भूमि-अधिकार के भाव को सुरक्षित रखता है।
- source_word: לְשִׁבְטֵיכֶם
  choice: तुम्हारे गोत्रों के लिए
  rationale: लाम यहाँ बाँटे गए भू-भाग के प्राप्तकर्ताओं को चिह्नित करता है। ‘के लिए’ हिन्दी में इस लाभार्थी सम्बन्ध को स्पष्ट करता है।
- source_word: וְכָל הַגּוֹיִם אֲשֶׁר הִכְרַתִּי
  choice: और उन सभी जातियों को जिन्हें मैंने नष्ट कर दिया है
  rationale: כרת का यहाँ प्रसंगगत अर्थ जातियों को काट डालना अथवा नष्ट करना है। ‘नष्ट कर दिया’ हिन्दी में अर्थ स्पष्ट करता है, जबकि अत्यधिक शाब्दिक ‘काट दिया’ जातियों के साथ अस्वाभाविक होता।
- source_word: מִן הַיַּרְדֵּן ... וְהַיָּם הַגָּדוֹל
  choice: यरदन से लेकर ... महासागर तक
  rationale: वाक्यांश भू-भाग की सीमा बताता है। यद्यपि दूसरे सिरे से पहले हिब्रू में वाव है, हिन्दी में सीमा का स्वाभाविक रूप ‘से लेकर ... तक’ है।
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: सूर्यास्त की ओर
  rationale: मूल में सूर्य के भीतर जाने या अस्त होने की चित्रात्मक अभिव्यक्ति है, जो पश्चिम दिशा का मुहावरा है। ‘सूर्यास्त की ओर’ मूल बिम्ब और दिशात्मक अर्थ दोनों बनाए रखता है।
theological_decisions:
- issue: הִכְרַתִּי में न्याय और विनाश का भाव
  choice: नष्ट कर दिया है
  alternative: काट डाला है
  rationale: चयन प्रसंग में वास्तविक विनाश को स्पष्ट करता है, पर ‘समूल’ जैसी अतिरिक्त तीव्रता नहीं जोड़ता और किसी विशिष्ट धर्मसैद्धान्तिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। सीमा-वर्णन को हिन्दी के स्वाभाविक ‘से लेकर ... तक’ ढाँचे में रखा गया है, जबकि ‘सूर्यास्त की ओर’ मूल की काव्यात्मक दिशात्मक छवि को सुरक्षित रखता है।
