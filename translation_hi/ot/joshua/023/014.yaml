base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/014.yaml
  text: And behold[a], today I am going the way of all the earth, and you know with all your heart and with all your soul that not one word has fallen from all the good words that Yahweh your God spoke concerning you. All of them have come to you[b]; not one word from them has fallen.
translation:
  language: hi
  text: देखो, आज मैं सारी पृथ्वी के मार्ग पर जा रहा हूँ[a]। तुम अपने पूरे हृदय और पूरे प्राण से जानते हो कि याहवे, तुम्हारे परमेश्वर, ने तुम्हारे विषय में जितनी भी भली बातें कही थीं, उनमें से एक भी बात विफल नहीं हुई[b]। वे सब तुम्हारे लिए पूरी हुई हैं; उनमें से एक भी बात विफल नहीं हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सारी पृथ्वी के मार्ग पर जाना’ एक इब्रानी मुहावरा है, जिसका अर्थ सभी मनुष्यों की समान नियति—मृत्यु—की ओर जाना है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, ‘एक भी बात नहीं गिरी।’ इसका अर्थ है कि एक भी बात विफल या अधूरी नहीं रही।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: देखो
  rationale: यह आरम्भ में ध्यान आकर्षित करने वाला गंभीर संवाद-सूचक है। हिन्दी में ‘देखो’ स्वाभाविक और गरिमापूर्ण है; अलग से ‘और’ जोड़ना आवश्यक नहीं।
- source_word: אָנֹכִי הוֹלֵךְ הַיּוֹם בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: आज मैं सारी पृथ्वी की राह पर जा रहा हूँ
  rationale: मृत्यु के लिए प्रयुक्त इब्रानी रूपक को सीधे ‘मैं मरने वाला हूँ’ कहकर समतल करने के बजाय सुरक्षित रखा गया है; उसके आशय को पादटिप्पणी स्पष्ट करती है।
- source_word: וִידַעְתֶּם
  choice: तुम ... जानते हो
  rationale: पूर्ण रूप यहाँ अनुभव पर आधारित वर्तमान दृढ़ ज्ञान व्यक्त करता है; हिन्दी वर्तमान काल इस प्रसंग में स्वाभाविक है।
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: अपने सारे हृदय और अपने सारे प्राण से
  rationale: ‘हृदय’ और ‘प्राण’ की वाचाई जोड़ी को बनाए रखते हुए सम्पूर्ण आन्तरिक निश्चय का भाव व्यक्त किया गया है।
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: एक भी बात विफल नहीं हुई
  rationale: शाब्दिक चित्र ‘एक भी बात नहीं गिरी’ आधुनिक हिन्दी में अस्पष्ट और अस्वाभाविक होगा। ‘विफल नहीं हुई’ मुहावरे का आशय देता है, जबकि ‘बात’ आगे के ‘कही थीं’ से शब्दगत सम्बन्ध बनाए रखती है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: מִכֹּל הַדְּבָרִים הַטּוֹבִים
  choice: जितनी भी भली बातें
  rationale: דברים का ‘बातें’ अर्थ और अगले क्रियापद ‘कही थीं’ के साथ उसका सम्बन्ध सुरक्षित है। ‘प्रतिज्ञाएँ’ कहना सम्भव अर्थ को आवश्यकता से अधिक निश्चित कर देता।
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֱלֹהֵיכֶם עֲלֵיכֶם
  choice: तुम्हारे परमेश्वर याहवे ने तुम्हारे विषय में ... कही थीं
  rationale: עֲלֵיכֶם को ‘तुम्हारे विषय में’ प्रस्तुत किया गया है, जो ‘तुमसे’ की अपेक्षा मूल पूर्वसर्ग के अर्थ को बेहतर सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यन्तरित किया गया है।
- source_word: הַכֹּל בָּאוּ לָכֶם
  choice: वे सब तुम्हारे लिए पूरी हुईं
  rationale: शाब्दिक ‘वे सब तुम्हारे पास आईं’ हिन्दी में पूर्ति का आशय स्पष्ट नहीं करता। यह रूप आगमन के प्रसंगगत भाव—कही गई बातों का पूरा होना—को सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא נָפַל מִמֶּנּוּ דָּבָר אֶחָד
  choice: उनमें से एक भी बात विफल नहीं हुई
  rationale: पहले कथन की जानबूझकर की गई पुनरावृत्ति बनाए रखी गई है और सामूहिक पूर्ववर्ती ‘भली बातें’ स्पष्ट किया गया है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यन्तरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: דברים को ‘बातें’ या ‘प्रतिज्ञाएँ’ कहना
  choice: भली बातें
  alternative: भली प्रतिज्ञाएँ
  rationale: ‘प्रतिज्ञाएँ’ प्रसंगगत रूप से सम्भव है, पर मूल संज्ञा व्यापक है और ‘कही थीं’ से जुड़ी है। ‘बातें’ उस व्यापकता और शब्दगत सम्बन्ध को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में स्वाभाविक, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। इब्रानी मृत्यु-रूपक सुरक्षित है, पर विफलता वाले मुहावरे को स्पष्ट हिन्दी में दिया गया है और उसका शाब्दिक चित्र पादटिप्पणी में रखा गया है।
