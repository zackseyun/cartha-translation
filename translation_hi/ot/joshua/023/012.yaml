base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/012.yaml
  text: For if you indeed turn back and cling to the remnant of these nations[a], these that remain with you, and intermarry with them and go in to them, and they to you[b],
translation:
  language: hi
  text: क्योंकि यदि तुम सचमुच पीछे हट जाओगे और इन जातियों के बचे हुए लोगों से—जो तुम्हारे बीच रह गए हैं—दृढ़ता से जुड़े रहोगे[a], और उनके साथ विवाह-संबंध बनाओगे और उनके साथ मेल-जोल रखोगे, और वे तुम्हारे साथ मेल-जोल रखेंगे[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनसे लिपटे रहोगे।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम उनके बीच आओ-जाओगे और वे तुम्हारे बीच।” हिब्रू मुहावरा केवल शारीरिक आवागमन से अधिक व्यापक मेल-जोल भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि यदि
  rationale: यह पिछले कथन से जुड़े हुए सशर्त चेतावनी-वाक्य का आरंभ करता है; ‘क्योंकि यदि’ संयोजक और शर्त दोनों को बनाए रखता है।
- source_word: שׁוֹב תָּשׁוּבוּ
  choice: सचमुच फिर जाओगे
  rationale: धातु के infinitive absolute और finite verb का मेल क्रिया पर बल देता है। संदर्भ में यह वाचा की निष्ठा से पीछे फिरने की नकारात्मक गति है।
- source_word: וּדְבַקְתֶּם
  choice: लिपटे रहोगे
  rationale: דבק घनिष्ठ और दृढ़ लगाव व्यक्त करता है। यह चुनाव केवल सामान्य संपर्क के बजाय संबंधपरक आसक्ति की तीव्रता बनाए रखता है।
- source_word: בְּיֶתֶר הַגּוֹיִם הָאֵלֶּה הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: इन जातियों के बचे हुए लोगों से—जो तुम्हारे बीच रह गए हैं—
  rationale: ‘बचे हुए लोगों’ से יֶתֶר का साधारण अवशिष्ट अर्थ आता है, जबकि ‘जो तुम्हारे बीच रह गए हैं’ दोहराए गए विशिष्टीकरण और उनकी निरंतर उपस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִתְחַתַּנְתֶּם בָּהֶם
  choice: उनके साथ विवाह-संबंध बनाओगे
  rationale: חתן का hitpael रूप पारस्परिक वैवाहिक संबंध स्थापित करने को दर्शाता है; यह हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: וּבָאתֶם בָּהֶם וְהֵם בָּכֶם
  choice: उनके साथ मेल-जोल रखोगे और वे तुम्हारे साथ
  rationale: בוא ב का व्यक्ति-संबंधी प्रयोग सामाजिक संपर्क या घुलने-मिलने का व्यापक भाव दे सकता है। वैवाहिक संबंध पहले ही स्पष्ट है, इसलिए इसे केवल शारीरिक प्रवेश या गति तक सीमित नहीं किया गया; अंतिम खंड की हिब्रू संक्षिप्तता भी रखी गई है।
theological_decisions:
- issue: שׁוֹב תָּשׁוּבוּ में वाचा से पीछे हटने का चेतावनी-भाव
  choice: सचमुच फिर जाओगे
  alternative: सचमुच लौटोगे
  rationale: ‘फिर जाओगे’ संदर्भ में निष्ठा से पीछे हटने की नकारात्मक दिशा को ‘लौटोगे’ की अपेक्षा अधिक स्पष्ट करता है, पर किसी विशिष्ट धर्मसैद्धांतिक प्रणाली को आरोपित नहीं करता।
- issue: יֶתֶר को धर्मवैचारिक ‘शेष’ के रूप में अधिक पढ़ने का जोखिम
  choice: बचे हुए लोग
  alternative: शेष लोग
  rationale: यहाँ शब्द केवल उन जातियों के जीवित/उपस्थित बचे भाग को बताता है। ‘बचे हुए लोग’ अनावश्यक सकारात्मक ‘शेष’ धर्मविज्ञान से बचता है।
- issue: וּבָאתֶם בָּהֶם का संभावित यौन अथवा केवल स्थानगत अर्थ
  choice: उनके साथ मेल-जोल रखोगे
  alternative: उनके बीच आना-जाना रखोगे
  rationale: मूल मुहावरा व्यापक पारस्परिक संगति की अनुमति देता है और विवाह पहले ही अलग से कहा गया है। इसलिए अनिश्चितता को पादटिप्पणी में रखते हुए मुख्य पाठ में सहज सामाजिक अर्थ चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, बहुवचन ‘तुम’ संबोधन और गरिमापूर्ण चेतावनी-शैली रखी गई है। वाक्य अगले पद में पूरा होता है, इसलिए अंत में अल्पविराम रखा गया है।
