source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִ/יָּמִ֣ים רַבִּ֔ים אַ֠חֲרֵי אֲשֶׁר הֵנִ֨יחַ יְהוָ֧ה לְ/יִשְׂרָאֵ֛ל מִ/כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִ֑יב וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/001.yaml
  text: And it happened[a], after many days, after Yahweh had given Israel rest from all their enemies around them, that Joshua was old[b], advanced in years.
translation:
  language: hi
  text: बहुत समय बीतने के बाद, जब यहोवा ने इस्राएल को उसके चारों ओर के सब शत्रुओं से विश्राम दे दिया था, तब ऐसा हुआ कि यहोशू बूढ़ा हो गया था और बहुत वृद्ध था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים רַבִּים
  choice: बहुत समय बीतने के बाद
  rationale: इब्रानी कथात्मक आरंभ और समय के पर्याप्त अंतराल को स्वाभाविक आधुनिक हिन्दी में एक साथ व्यक्त करता है; शाब्दिक ‘बहुत दिनों के बाद ऐसा हुआ’ की अपेक्षा अधिक सहज है।
- source_word: אַחֲרֵי אֲשֶׁר
  choice: जब ... था
  rationale: मुख्य घटना से पहले पूरी हो चुकी परिस्थिति को हिन्दी के स्वाभाविक काल-संबंध में व्यक्त करता है।
- source_word: הֵנִיחַ
  choice: विश्राम दे दिया था
  rationale: हिफ़ील रूप का अर्थ शत्रुओं से राहत और स्थिरता प्रदान करना है; ‘विश्राम देना’ इस वाचा-ऐतिहासिक भाव को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित सीधे लिप्यंतरण से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल को
  rationale: जनसमुदाय/राष्ट्र के नाम का मानक हिन्दी बाइबलीय लिप्यंतरण।
- source_word: מִכָּל אֹיְבֵיהֶם מִסָּבִיב
  choice: उसके चारों ओर के सब शत्रुओं से
  rationale: מִסָּבִיב के स्थानिक बल और ‘सब’ द्वारा व्यक्त व्यापकता, दोनों को स्पष्ट रखता है; एकवचन ‘उसके’ हिन्दी में राष्ट्र इस्राएल से मेल खाता है।
- source_word: וִיהוֹשֻׁעַ זָקֵן
  choice: तब यहोशू बूढ़ा हो चुका था
  rationale: लंबी काल-संबंधी भूमिका के बाद मुख्य कथन को ‘तब’ से स्पष्ट किया गया है; זָקֵן को सीधी और सामान्य हिन्दी में व्यक्त किया गया है।
- source_word: בָּא בַּיָּמִים
  choice: उसकी आयु बहुत हो गई थी
  rationale: शाब्दिक इब्रानी मुहावरा ‘दिनों में आ गया’ अत्यधिक वृद्धावस्था दर्शाता है; चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से नाम को उपाधि में बदले बिना सुरक्षित रखा गया है; ‘याहवे’ अधिक आलोचनात्मक पुनर्निर्मित उच्चारण है।
- issue: ‘विश्राम’ का आशय
  choice: शत्रुओं से मिली राहत और स्थिरता के अर्थ वाला ‘विश्राम’
  alternative: सिर्फ युद्ध का पूर्ण और स्थायी अंत
  rationale: हिफ़ील הֵנִיחַ राहत देने को व्यक्त करता है, पर पद स्वयं इस विश्राम की अंतिमता या सर्वथा स्थायित्व निर्धारित नहीं करता; इसलिए उस तनाव को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण शैली। इब्रानी काल-संरचना को सहज हिन्दी वाक्य में ढाला गया है। זָקֵן और בָּא בַּיָּמִים की पुनरुक्त वृद्धावस्था-सूचना को दो संबद्ध पदबंधों में सुरक्षित रखा गया है।
