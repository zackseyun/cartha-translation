  text: יָד֨וֹעַ֙ תֵּֽדְע֔וּ כִּי֩ לֹ֨א יוֹסִ֜יף יְהוָ֣ה אֱלֹהֵי/כֶ֗ם לְ/הוֹרִ֛ישׁ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֜ם לְ/פַ֣ח וּ/לְ/מוֹקֵ֗שׁ וּ/לְ/שֹׁטֵ֤ט בְּ/צִדֵּי/כֶם֙ וְ/לִ/צְנִנִ֣ים בְּ/עֵינֵי/כֶ֔ם עַד אֲבָדְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/013.yaml
  text: know for certain that Yahweh your God will no longer drive out these nations from before you[a], but they will become for you a trap and a snare, a scourge on your sides and thorns in your eyes[b], until you perish from off this good land that Yahweh your God has given you.
translation:
  language: hi
  text: यह निश्चित रूप से जान लो कि तुम्हारा परमेश्वर याहवे इन जातियों को तुम्हारे सामने से अब नहीं निकालेगा; बल्कि वे तुम्हारे लिए फंदा और जाल, तुम्हारी पसलियों में कोड़ा[a] और तुम्हारी आँखों में काँटे बन जाएँगी, जब तक कि तुम इस अच्छी भूमि पर से मिट न जाओ, जिसे तुम्हारे परमेश्वर याहवे ने तुम्हें दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ अनिश्चित है; सम्भवतः “तुम्हारी पसलियों में मारने वाला कोड़ा” या व्यापक अर्थ में “पीड़ादायक विपत्ति।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹעַ תֵּדְעוּ
  choice: यह निश्चित रूप से जान लो
  rationale: धातु के infinitive absolute और finite verb का संयोग कथन को बल देता है; यह हिन्दी में उस ज़ोर को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֹא יוֹסִיף ... לְהוֹרִישׁ
  choice: अब ... नहीं निकालेगा
  rationale: יסף के साथ infinitive आगे उसी कार्य को करते रहने की समाप्ति दर्शाता है; ‘अब ... नहीं’ इसे संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
- source_word: מִלִּפְנֵיכֶם
  choice: तुम्हारे सामने से
  rationale: यह मूल स्थानगत बिंब को बनाए रखता है और युद्ध/निष्कासन के प्रसंग में स्वाभाविक हिन्दी है।
- source_word: לְפַח וּלְמוֹקֵשׁ
  choice: फंदा और जाल
  rationale: दो निकटार्थक जाल-संबंधी शब्दों की आलंकारिक जोड़ी और उनका कुछ lexical भेद सुरक्षित रहता है।
- source_word: לְשֹׁטֵט בְּצִדֵּיכֶם
  choice: तुम्हारी पसलियों पर कोड़ा
  rationale: दुर्बोध संज्ञा को दण्ड देने या पीड़ा पहुँचाने वाले साधन के रूप में समझते हुए शारीरिक पीड़ा का मूल रूपक बनाए रखा गया है; ‘पसलियों’ से צדים का शारीरिक आशय स्पष्ट होता है।
- source_word: לִצְנִנִים בְּעֵינֵיכֶם
  choice: तुम्हारी आँखों में काँटे
  rationale: तीखी और निरन्तर पीड़ा का मूल बिंब हिन्दी में परिचित तथा स्पष्ट है।
- source_word: עַד אֲבָדְכֶם מֵעַל הָאֲדָמָה
  choice: और अन्त में तुम इस अच्छी भूमि पर से मिट जाओगे
  rationale: עד परिणाम की चरम सीमा बताता है और אבד भूमि से विनाश/लुप्त हो जाने को; ‘मिट जाओगे’ चेतावनी की तीव्रता को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में दिव्य नाम के प्रचलित लिप्यंतरण द्वारा चतुरक्षरीय नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को नाम ही रहने देता है, उपाधि नहीं बनाता।
- issue: चेतावनी का स्वरूप
  choice: यहोवा द्वारा जातियों को निकालना बन्द करना, जिसके फलस्वरूप वे इस्राएल के लिए पीड़ा और भूमि से विनाश का कारण बनेंगी
  alternative: केवल एक सामान्य सैनिक भविष्यवाणी
  rationale: वाक्य परमेश्वर की कार्रवाई की समाप्ति, जातियों से होने वाली पीड़ा और दी हुई भूमि से मिटने को सीधे जोड़ता है; अनुवाद इस वाचा-संबंधी तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- issue: לְשֹׁטֵט का अनिश्चित अर्थ
  choice: कोड़ा
  alternative: पीड़ा/विपत्ति; चाबुक
  rationale: शब्द दुर्बोध है, इसलिए मुख्य पाठ में प्राचीन शारीरिक रूपक रखा गया और पादटिप्पणी में अनिश्चितता स्पष्ट की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘फंदा और जाल’, ‘पसलियों पर कोड़ा’ और ‘आँखों में काँटे’ जैसे मूल रूपकों को सुरक्षित रखा गया है।
