  text: לְ/בִלְתִּי בוֹא֙ בַּ/גּוֹיִ֣ם הָ/אֵ֔לֶּה הַ/נִּשְׁאָרִ֥ים הָ/אֵ֖לֶּה אִתְּ/כֶ֑ם וּ/בְ/שֵׁ֨ם אֱלֹהֵי/הֶ֤ם לֹא תַזְכִּ֨ירוּ֙ וְ/לֹ֣א תַשְׁבִּ֔יעוּ וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִֽשְׁתַּחֲו֖וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/007.yaml
  text: so that you do not come among these nations[a], these that remain with you[b], and do not mention the name of their gods or make anyone swear by them or serve them or bow down to them.
translation:
  language: hi
  text: ताकि तुम इन जातियों में न जाओ, जो तुम्हारे साथ शेष रह गई हैं, और उनके देवताओं का नाम न लो[a], न किसी को उनके नाम की शपथ दिलाओ[b], न उनकी सेवा करो और न उनके सामने दण्डवत करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके देवताओं का नाम लेकर उन्हें न पुकारो।” इब्रानी क्रिया का अर्थ “नाम लेना” या, इस प्रसंग में, “नाम लेकर पुकारना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनके नाम की शपथ न खाओ।” इब्रानी क्रिया प्रेरणार्थक है, जिसका शाब्दिक अर्थ “शपथ दिलाना” है; इसमें किसी दूसरे से उन देवताओं के नाम पर शपथ दिलाना शामिल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי בוֹא בַּגּוֹיִם הָאֵלֶּה
  choice: ताकि तुम इन जातियों के बीच न जाओ
  rationale: לְבִלְתִּי के साथ धातु का अनंत रूप निषेधात्मक उद्देश्य या रोक व्यक्त करता है। בוא के साथ ב यहाँ केवल भौगोलिक प्रवेश नहीं, बल्कि इन लोगों के बीच जाने और उनसे मेल रखने की दिशा बताता है; इसलिए सहज हिन्दी में ‘बीच न जाओ’ रखा गया है।
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: इनके बीच, जो तुम्हारे साथ बची हुई हैं
  rationale: שׁאר का कृदन्त उन जातियों को दर्शाता है जो अभी शेष हैं, और אִתְּכֶם को सीधे ‘तुम्हारे साथ’ कहा गया है। पुनरुक्त संकेतवाचक הָאֵלֶּה को डैश के बीच स्पष्टीकरण के रूप में रखा गया है।
- source_word: וּבְשֵׁם אֱלֹהֵיהֶם לֹא תַזְכִּירוּ
  choice: उनके देवताओं का नाम न लो
  rationale: הזכיר के हिफ़ील रूप का अर्थ ‘उल्लेख करना/नाम लेना’ और प्रसंगानुसार ‘नाम लेकर पुकारना’ हो सकता है। ‘नाम न लो’ संक्षिप्त, स्वाभाविक और दोनों अर्थों के निकट है; वैकल्पिक धार्मिक आह्वान को पादटिप्पणी में रखा गया है।
- source_word: וְלֹא תַשְׁבִּיעוּ
  choice: न किसी को उनकी शपथ खिलाओ
  rationale: שׁבע का हिफ़ील रूप प्रेरणार्थक है—‘शपथ खिलाना’। इब्रानी में कर्म व्यक्त नहीं है, इसलिए हिन्दी में स्पष्टता के लिए ‘किसी को’ जोड़ा गया है, जबकि वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: וְלֹא תַעַבְדוּם
  choice: न उनकी सेवा करो
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है और यहाँ वह धार्मिक सेवा को समेटता है। ‘सेवा’ रखने से अगले क्रियापद, दण्डवत करने, के साथ उसका भेद बना रहता है।
- source_word: וְלֹא תִשְׁתַּחֲווּ לָהֶם
  choice: न उनके आगे दण्डवत करो
  rationale: שׁחה का यह रूप अपने को झुकाने या भूमि तक झुककर प्रणाम करने का ठोस कार्य बताता है। ‘दण्डवत करो’ हिन्दी बाइबलीय प्रयोग में समझने योग्य है और सामान्यीकृत ‘आराधना’ की अपेक्षा मूल क्रिया को अधिक स्पष्ट रखता है।
theological_decisions:
- issue: मूर्तिपूजा से जुड़ी अलग-अलग निषिद्ध क्रियाएँ
  choice: नाम लेना, शपथ खिलाना, सेवा करना और दण्डवत करना—चारों को अलग रखा गया है।
  alternative: इन सबको सामान्य रूप से ‘उनकी उपासना न करना’ कह देना।
  rationale: इब्रानी पाठ निष्ठा और धार्मिक व्यवहार की कई ठोस क्रियाएँ गिनाता है। उन्हें अलग रखने से पाठ का क्रम और धर्मवैचारिक तनाव सुरक्षित रहता है तथा अनावश्यक संक्षेप से बचा जाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी अपनाई गई है। वाक्य पिछले पद से जुड़े उद्देश्य-वाक्य के रूप में ‘ताकि’ से आरम्भ होता है। जातियों के वर्णन में मूल की पुनरुक्ति को डैश द्वारा सुनने योग्य बनाया गया है। ‘देवताओं,’ ‘सेवा’ और ‘दण्डवत’ धार्मिक संदर्भ बनाए रखते हैं, पर चारों निषेधों को एक सामान्य ‘उपासना’ में नहीं मिलाते।
