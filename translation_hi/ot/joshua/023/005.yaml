  text: וַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֗ם ה֚וּא יֶהְדֳּפֵ֣/ם מִ/פְּנֵי/כֶ֔ם וְ/הוֹרִ֥ישׁ אֹתָ֖/ם מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּם֙ אֶת אַרְצָ֔/ם כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/005.yaml
  text: And Yahweh your God[a], he himself will drive them out from before you and dispossess them from before you, and you will take possession of their land[b], just as Yahweh your God spoke to you.
translation:
  language: hi
  text: और याहवे, तुम्हारा परमेश्वर, स्वयं उन्हें तुम्हारे सामने से खदेड़ देगा और उन्हें तुम्हारे सामने से बेदखल कर देगा; और तुम उनकी भूमि पर अधिकार कर लोगे[a], ठीक वैसे ही जैसे याहवे, तुम्हारे परमेश्वर, ने तुमसे कहा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुम उनकी भूमि को उत्तराधिकार में पाओगे।’ इब्रानी क्रिया का अर्थ ‘उत्तराधिकार में पाना’ या ‘अधिकार करना’ हो सकता है; यहाँ विजय के प्रसंग के कारण ‘अधिकार कर लोगे’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘जैसे याहवे, तुम्हारे परमेश्वर, ने तुमसे कहा था।’ इस कथन में प्रतिज्ञा का भाव भी निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: याहवे के साथ संयुक्त और बहुवचन संबोधन-प्रत्यय सहित यह इस्राएल के एकमात्र परमेश्वर को दर्शाता है।
- source_word: הוּא
  choice: स्वयं
  rationale: 'स्वतंत्र सर्वनाम का बल सुरक्षित रखता है: इस्राएल की ओर से कार्य करने वाला याहवे स्वयं है।'
- source_word: יֶהְדֳּפֵם
  choice: उन्हें ... खदेड़ देगा
  rationale: הדף बलपूर्वक पीछे हटाने या निकालने का भाव देता है; विजय के प्रसंग में ‘खदेड़ना’ स्वाभाविक और सटीक है।
- source_word: מִפְּנֵיכֶם / מִלִּפְנֵיכֶם
  choice: तुम्हारे सामने से
  rationale: दोनों बार आए स्थानसूचक इब्रानी मुहावरे और उसकी पुनरावृत्ति को स्पष्ट हिन्दी में बनाए रखता है।
- source_word: וְהוֹרִישׁ אֹתָם
  choice: उन्हें ... बेदखल कर देगा
  rationale: ירש के हिफ़ील रूप में वर्तमान निवासियों को उनके अधिकार या कब्ज़े से हटाने का भाव है; यह पहले क्रियापद ‘खदेड़ देगा’ से भूमि-अधिकार का अर्थ अलग रखता है।
- source_word: וִירִשְׁתֶּם אֶת־אַרְצָם
  choice: तुम उनकी भूमि पर अधिकार कर लोगे
  rationale: ירש के काल रूप में भूमि को अपने अधिकार में लेने का सक्रिय भाव प्रसंगानुकूल है, जबकि ‘उत्तराधिकार में पाना’ भी सम्भव अर्थ है।
- source_word: כַּאֲשֶׁר דִּבֶּר ... לָכֶם
  choice: ठीक वैसे ही जैसे ... ने तुमसे कहा था
  rationale: דבר का मूल अर्थ ‘कहना/बोलना’ रखा गया है; प्रसंग में निहित प्रतिज्ञा का भाव पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में विशिष्ट वाचा-नाम प्रत्यक्ष रूप से है। उसका लिप्यंतरण नाम और ‘परमेश्वर’ उपाधि के बीच भेद बनाए रखता है।
- issue: ירש धातु के हिफ़ील और काल रूपों का भेद
  choice: बेदखल कर देगा / अधिकार कर लोगे
  alternative: दोनों स्थानों पर ‘निकालना’; दूसरे स्थान पर ‘उत्तराधिकार में पाना’
  rationale: पहला रूप राष्ट्रों के कब्ज़े के अंत और दूसरा इस्राएल द्वारा भूमि पाने को व्यक्त करता है। अलग हिन्दी क्रियाएँ मूल के व्याकरणिक और भूमि-अधिकार संबंधी तनाव को सुरक्षित रखती हैं।
- issue: דִּבֶּר में कथन और प्रतिज्ञा का संबंध
  choice: कहा था
  alternative: प्रतिज्ञा की थी
  rationale: ‘कहा’ मूल क्रिया के अधिक निकट है और साथ ही प्रसंगगत प्रतिज्ञात्मक अर्थ को मिटाता नहीं; वैकल्पिक अर्थ पादटिप्पणी में स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन वाला रूप अपनाया गया है। ‘तुम्हारे सामने से’ की पुनरावृत्ति शैलीगत रूप से कुछ भारी होते हुए भी मूल इब्रानी की जानबूझकर की गई पुनरावृत्ति सुरक्षित रखती है। पद-विभाजन में दूसरा हिन्दी वाक्य पठनीयता बढ़ाता है; आरम्भ का ‘और’ प्रसंग-संबंध बनाए रखता है।
