  text: בְּ֠/עָבְרְ/כֶם אֶת בְּרִ֨ית יְהוָ֥ה אֱלֹהֵי/כֶם֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֒ וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶ֑ם וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וַ/אֲבַדְתֶּ֣ם מְהֵרָ֔ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר נָתַ֥ן לָ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/016.yaml
  text: If you transgress the covenant of Yahweh your God[a], which he commanded you, and go and serve other gods and bow down to them, then the anger of Yahweh will burn against you[b], and you will perish quickly from the good land that he has given you.
translation:
  language: hi
  text: यदि तुम अपने परमेश्वर यहोवा की उस वाचा का उल्लंघन करो[a], जिसकी आज्ञा उसने तुम्हें दी है, और जाकर दूसरे देवताओं की सेवा करो और उन्हें दण्डवत् करो, तो यहोवा का क्रोध तुम पर भड़क उठेगा, और तुम उस अच्छे देश से शीघ्र नष्ट हो जाओगे[b], जिसे उसने तुम्हें दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तुम अपने परमेश्वर यहोवा की वाचा का उल्लंघन करोगे।” इब्रानी आरंभ को शर्त (“यदि”) या समय (“जब”)—दोनों अर्थों में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “अच्छे देश की सतह से।” यह अभिव्यक्ति उस देश से हटा दिए जाने पर बल देती है जिसे यहोवा ने उन्हें दिया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָבְרְכֶם
  choice: यदि तुम ... का उल्लंघन करो
  rationale: ב के साथ infinitive construct यहाँ चेतावनी की शर्त व्यक्त कर सकता है; עבר ברית वाचा का उल्लंघन करने का प्रचलित मुहावरा है।
- source_word: בְּרִית
  choice: वाचा
  rationale: यह इस्राएल और यहोवा के संबंध का मानक धार्मिक-कानूनी शब्द है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत वाचागत नाम को शीर्षक से अलग रखते हुए प्रस्तुत करता है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर
  rationale: यहोवा के साथ यह बहुवचन रूप एकवचन उपाधि ‘परमेश्वर’ के अर्थ में है।
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם
  choice: जिसकी आज्ञा उसने तुम्हें दी है
  rationale: सापेक्ष उपवाक्य को सीधे रखता है और ‘पालन करने’ जैसा अप्रकट पूरक नहीं जोड़ता।
- source_word: וַהֲלַכְתֶּם וַעֲבַדְתֶּם
  choice: और जाकर ... सेवा करो
  rationale: क्रियाओं के क्रम और धर्मत्याग की ओर बढ़ने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: प्रतिद्वंद्वी देवताओं के लिए सामान्य इब्रानी पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: और उनके सामने दण्डवत् करो
  rationale: झुकने अथवा भूमि पर गिरकर सम्मान देने की शारीरिक क्रिया को सुरक्षित रखता है और इसे पिछली ‘सेवा’ में नहीं मिलाता।
- source_word: וְחָרָה אַף יְהוָה בָּכֶם
  choice: तो यहोवा का क्रोध तुम पर भड़क उठेगा
  rationale: חרה אף में क्रोध के जलने का रूपक है; ‘भड़क उठेगा’ हिन्दी में उसका बल स्वाभाविक ढंग से रखता है।
- source_word: וַאֲבַדְתֶּם מְהֵרָה
  choice: और तुम ... शीघ्र नष्ट हो जाओगे
  rationale: אבד के विनाश/मिट जाने और מְהֵרָה की तीव्रता को स्पष्ट करता है।
- source_word: מֵעַל הָאָרֶץ הַטּוֹבָה
  choice: उस अच्छे देश पर से
  rationale: מֵעַל के हटाए जाने वाले स्थानिक बल को हिन्दी में बनाए रखता है।
theological_decisions:
- issue: आरंभिक בְּעָבְרְכֶם की शर्तात्मक या कालात्मक व्याख्या
  choice: यदि तुम ... उल्लंघन करो
  alternative: जब तुम ... उल्लंघन करोगे
  rationale: दोनों अर्थ व्याकरणतः संभव हैं, पर इस उपदेशात्मक प्रसंग में ‘यदि’ चेतावनी को धर्मत्याग पर निर्भर परिणाम के रूप में रखता है और उसे अनिवार्य भविष्यवाणी नहीं बनाता।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचागत नाम आया है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में अत्यधिक पहचाना जाने वाला रूप है।
- issue: אבד और देश से हटाए जाने का संबंध
  choice: देश पर से शीघ्र नष्ट हो जाओगे
  alternative: देश में से शीघ्र मिटा दिए जाओगे
  rationale: कर्तृवाच्य इब्रानी क्रिया और מֵעַל के स्थानिक बल दोनों को रखा गया है, बिना यह तय किए कि परिणाम केवल निर्वासन है या व्यापक विनाश।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। ‘वाचा’, ‘दण्डवत्’ और ‘यहोवा’ बाइबलीय संदर्भ के आवश्यक पारिभाषिक पद हैं; शेष वाक्य-विन्यास सहज रखा गया है।
