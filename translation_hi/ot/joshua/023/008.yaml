  text: כִּ֛י אִם בַּ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּדְבָּ֑קוּ כַּ/אֲשֶׁ֣ר עֲשִׂיתֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/008.yaml
  text: But you shall cling to Yahweh your God[a], just as you have done to this day.
translation:
  language: hi
  text: परन्तु तुम अपने परमेश्वर याहवे से दृढ़ता से जुड़े रहो[a], जैसे तुम आज तक करते आए हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘लिपटे रहो’ या ‘दृढ़ता से चिपके रहो’; इब्रानी क्रिया निकट और अटल वाचा-संबंधी लगाव व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यह पद पिछले निषेधों के विपरीत अपेक्षित आचरण प्रस्तुत करता है; ‘बल्कि’ इस प्रबल विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּיהוָה
  choice: यहोवा से
  rationale: דבק के साथ ב उस व्यक्ति को सूचित करता है जिससे दृढ़ता से जुड़े रहना है; हिन्दी में ‘से लिपटे रहना’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय हिन्दी के प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: प्रत्यय बहुवचन संबोधित समुदाय के साथ वाचा-संबंध दर्शाता है; ‘अपने परमेश्वर’ हिन्दी में ‘तुम्हारे परमेश्वर’ की अपेक्षा इस वाक्य में अधिक सहज है।
- source_word: תִּדְבָּקוּ
  choice: लिपटे रहो
  rationale: דבק निकट, दृढ़ और निरंतर वाचा-निष्ठा व्यक्त करता है। ‘लिपटे रहो’ संबंधपरक तीव्रता बनाए रखता है।
- source_word: כַּאֲשֶׁר עֲשִׂיתֶם
  choice: जैसे तुम ... करते आए हो
  rationale: यह अब तक जारी रहे आचरण से तुलना करता है; ‘करते आए हो’ उसकी निरंतरता को स्पष्ट करता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह मूल इब्रानी काल-सूचक मुहावरे का संक्षिप्त और स्वाभाविक आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: वाचा-नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का व्यक्तिगत नाम सुरक्षित रखा गया है; हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ चुना गया, न कि ‘प्रभु’ जैसा स्थानापन्न शीर्षक।
- issue: דבק की वाचा-संबंधी छवि
  choice: लिपटे रहो
  alternative: दृढ़ बने रहो
  rationale: अधिक अमूर्त विकल्प के बजाय मूल की निकट और दृढ़ आसक्ति की छवि रखी गई है, बिना उसका धर्मवैज्ञानिक अर्थ विस्तार से पाठ में जोड़ने के।
translation_notes:
  register: आधुनिक, सुबोध और गरिमापूर्ण हिन्दी। बहुवचन ‘तुम’ मूल संबोधन के अनुरूप है। आदेशात्मक ‘लिपटे रहो’ प्रसंग के उपदेशात्मक बल और निरंतर निष्ठा—दोनों को व्यक्त करता है।
