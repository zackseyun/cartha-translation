  edition: WLC
  text: אִישׁ אֶחָ֥ד מִ/כֶּ֖ם יִרְדָּף אָ֑לֶף כִּ֣י יְהוָ֣ה אֱלֹהֵי/כֶ֗ם ה֚וּא הַ/נִּלְחָ֣ם לָ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/010.yaml
  text: One man from among you will chase a thousand[a], because Yahweh your God is the one who fights for you[c][b], just as he spoke to you.
translation:
  language: hi
  text: तुम में से एक पुरुष एक हज़ार को खदेड़ेगा[a], क्योंकि याहवे, तुम्हारा परमेश्वर, ही तुम्हारी ओर से लड़ता है, ठीक वैसे ही जैसे उसने तुमसे कहा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक हज़ार का पीछा करेगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “ठीक वैसे ही जैसे उसने तुमसे प्रतिज्ञा की थी।” इब्रानी में अधिक शाब्दिक अर्थ है, “जैसे उसने तुमसे कहा था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד מִכֶּם
  choice: तुम में से एक पुरुष
  rationale: इब्रानी में पुल्लिंग एकवचन का प्रतिनिधिक प्रयोग है। यह हिंदी में स्वाभाविक रहते हुए मूल की लिंग-सूचना और अंशवाची भाव दोनों को बनाए रखता है।
- source_word: יִרְדָּף
  choice: खदेड़ेगा
  rationale: רדף का अर्थ पीछा करना या खदेड़ना है। युद्ध के प्रसंग में ‘खदेड़ेगा’ विजय और शत्रु को पीछे हटाने का सजीव भाव देता है।
- source_word: אָלֶף
  choice: एक हज़ार
  rationale: मूल संख्या को यथावत रखा गया है ताकि कथन का बल सुरक्षित रहे।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह इस असाधारण विजय का कारण प्रस्तुत करता है।
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर यहोवा
  rationale: יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है और אֱלֹהֵיכֶם का सीधा अर्थ रखा गया है।
- source_word: הוּא הַנִּלְחָם לָכֶם
  choice: ही तुम्हारी ओर से लड़ता है
  rationale: הוּא के बलाघात को ‘ही’ से और לָכֶם के हितार्थक भाव को ‘तुम्हारी ओर से’ से व्यक्त किया गया है। कृदंत परमेश्वर के निरंतर/विशिष्ट कार्य का वर्णन करता है।
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: ठीक वैसे ही जैसे उसने तुमसे कहा था
  rationale: ‘कहा था’ דִּבֶּר का निकट अर्थ है; संदर्भ में वचन या प्रतिज्ञा का भाव निहित है, पर मुख्य पाठ में उसे स्पष्ट करके अस्पष्टता समाप्त नहीं की गई।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिंदी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ पाठक के लिए सुबोध है और ‘प्रभु’ जैसे पद से बदलने के बजाय चतुरक्षरीय दिव्य नाम को नाम के रूप में सुरक्षित रखता है।
- issue: אִישׁ אֶחָד का प्रतिनिधिक लिंग
  choice: एक पुरुष
  alternative: एक व्यक्ति
  rationale: मूल पाठ पुल्लिंग एकवचन है; ‘एक पुरुष’ उसके रूप को बनाए रखता है, जबकि कथन समुदाय के एक प्रतिनिधि योद्धा के विषय में है।
- issue: דִּבֶּר का प्रतिज्ञात्मक आशय
  choice: कहा था
  alternative: प्रतिज्ञा की थी
  rationale: मूल क्रिया का सामान्य अर्थ ‘बोलना/कहना’ है। प्रसंग प्रतिज्ञा का संकेत देता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है, मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सहज और गरिमापूर्ण रखी गई है। ‘खदेड़ेगा’ युद्ध-संदर्भ को स्पष्ट करता है; ‘तुम्हारी ओर से’ परमेश्वर द्वारा इस्राएल के पक्ष में युद्ध करने का भाव स्वाभाविक हिंदी में व्यक्त करता है। सभी सर्वनाम बहुवचन समुदाय के लिए हैं।
