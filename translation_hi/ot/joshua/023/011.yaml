base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/011.yaml
  text: Therefore, take great care to love Yahweh your God.
translation:
  language: hi
  text: इसलिए अपने परमेश्वर यहोवा से प्रेम करने के लिए बहुत सावधान रहो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם
  choice: इसलिए ... सावधान रहो
  rationale: क्रिया सजग होकर अपनी रक्षा करने का आदेश देती है। प्रसंगगत संबंध को हिंदी में स्वाभाविक रूप से दिखाने के लिए וְ को ‘इसलिए’ से व्यक्त किया गया है।
- source_word: מְאֹד
  choice: बहुत
  rationale: यह आदेश की तीव्रता बढ़ाता है; ‘बहुत सावधान’ आधुनिक हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: לְנַפְשֹׁתֵיכֶם
  choice: अपने विषय में
  rationale: यहाँ נֶפֶשׁ पूरे व्यक्ति की ओर संकेत करता है, किसी अलग अभौतिक ‘आत्मा’ की ओर नहीं। ‘अपने विषय में सावधान’ आत्म-सजगता और आत्म-रक्षा का भाव बनाए रखता है।
- source_word: לְאַהֲבָה
  choice: कि तुम ... प्रेम करते रहो
  rationale: लְ + infinitive construct यहाँ सावधानी के उद्देश्य या परिणाम को व्यक्त करता है। ‘प्रेम करते रहो’ वर्तमान वाचा-निष्ठा में निरंतर बने रहने के आग्रह को स्वाभाविक हिंदी में सामने लाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय वाचा-संबंध को व्यक्त करता है; हिंदी वाक्य-विन्यास में ‘अपने परमेश्वर’ स्वाभाविक रूप से ‘तुम्हारे परमेश्वर’ का अर्थ देता है।
theological_decisions:
- issue: वाचा-संबंधी उपदेश में נֶפֶשׁ का अर्थ
  choice: पूरे व्यक्ति से संबंधित आत्म-रक्षात्मक अर्थ (‘अपने विषय में’)
  alternative: ‘अपने प्राणों की’ या ‘अपनी आत्माओं की’
  rationale: इस मुहावरे में נֶפֶשׁ मनुष्य के संपूर्ण व्यक्तित्व को सूचित करता है। ‘आत्माओं’ से अनावश्यक देह-आत्मा विभाजन जुड़ सकता है, जबकि ‘प्राणों’ से केवल जीवन-रक्षा का अर्थ निकल सकता है।
- issue: לְאַהֲבָה में प्रेम की कालगत छाया
  choice: ‘प्रेम करते रहो’
  alternative: ‘प्रेम करो’
  rationale: मूल infinitive स्वयं काल निर्धारित नहीं करता। प्रसंग में यह पहले से स्थापित वाचा-निष्ठा में बने रहने का आग्रह है; ‘करते रहो’ इसे स्वाभाविक हिंदी में व्यक्त करता है, बिना प्रेम को केवल भावना या एकबारगी कार्य बनाने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। बहुवचन आदेश के लिए ‘रहो’ प्रयुक्त है। ‘इसलिए’ पिछले उपदेश से तार्किक संबंध दिखाता है; ‘बहुत सावधान’ हिब्रू की तीव्रता बनाए रखता है।
