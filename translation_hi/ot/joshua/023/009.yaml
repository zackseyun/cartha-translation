  text: וַ/יּ֤וֹרֶשׁ יְהוָה֙ מִ/פְּנֵי/כֶ֔ם גּוֹיִ֖ם גְּדֹלִ֣ים וַ/עֲצוּמִ֑ים וְ/אַתֶּ֗ם לֹא עָ֤מַד אִישׁ֙ בִּ/פְנֵי/כֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/009.yaml
  text: For Yahweh has driven out from before you great and mighty nations[a], and as for you[b], not a man has stood before you to this day.
translation:
  language: hi
  text: क्योंकि याहवे ने तुम्हारे सामने से बड़ी और शक्तिशाली जातियों को निकाल दिया है[a]; और जहाँ तक तुम्हारी बात है, आज तक कोई भी तुम्हारे सामने टिक नहीं सका[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बेदखल कर दिया है” अथवा “दूर कर दिया है।” हिब्रानी क्रिया उन लोगों को देश से हटाने पर बल दे सकती है, ताकि इस्राएल उस पर अधिकार करे।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “कोई पुरुष तुम्हारे सामने खड़ा नहीं हुआ।” यह एक मुहावरा है, जिसका अर्थ है कि कोई भी तुम्हारा सामना करके टिक नहीं सका।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶשׁ
  choice: निकाल दिया है
  rationale: हिफ़ील रूप यहाँ देश से लोगों को हटाने अथवा बेदखल करने का भाव रखता है। युद्ध और भूमि के इस संदर्भ में यह सहज हिन्दी है और सम्पन्न कार्य का भाव व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम टेट्राग्रामटन है; हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: מִפְּנֵיכֶם
  choice: तुम्हारे सामने से
  rationale: यह विजय-संदर्भ में किसी की राह अथवा उपस्थिति से हटा दिए जाने का हिब्रानी मुहावरा है।
- source_word: גּוֹיִם גְּדֹלִים וַעֲצוּמִים
  choice: बड़ी और शक्तिशाली जातियों
  rationale: גְּדֹלִים आकार या महत्ता और עֲצוּמִים सामर्थ्य व्यक्त करता है; यह चयन दोनों पहलुओं को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: וְאַתֶּם
  choice: और जहाँ तक तुम्हारी बात है
  rationale: स्वतंत्र सर्वनाम आगे रखे जाने से आए बल और विषय-परिवर्तन को हिन्दी में व्यक्त करता है, बिना संबंध को अनावश्यक रूप से विरोधात्मक बनाए।
- source_word: לֹא עָמַד אִישׁ בִּפְנֵיכֶם
  choice: कोई भी तुम्हारे सामने टिक नहीं सका
  rationale: शाब्दिक रूप ‘कोई पुरुष तुम्हारे सामने खड़ा नहीं हुआ’ युद्ध-संदर्भ का मुहावरा है, जिसका आशय है कि कोई उनका सफलतापूर्वक सामना नहीं कर सका। ‘टिक नहीं सका’ आधुनिक हिन्दी में यही अर्थ स्पष्ट करता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज के दिन तक
  rationale: यह स्थिति के कथन-समय तक जारी रहने को दर्शाने वाला मानक मुहावरा है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा-नाम सीधे प्रयुक्त है। ‘यहोवा’ आधुनिक हिन्दी बाइबल-परंपरा में व्यापक और सामान्य पाठकों के लिए परिचित लिप्यंतरण है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘जहाँ तक तुम्हारी बात है’ मूल के बलयुक्त וְאַתֶּם को सुरक्षित रखता है; युद्ध-संबंधी मुहावरे को मुख्य पाठ में स्वाभाविक हिन्दी और पादटिप्पणी में उसका शाब्दिक रूप दिया गया है।
