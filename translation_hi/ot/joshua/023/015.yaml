base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/015.yaml
  text: And it shall happen that[a], just as every good word that Yahweh your God spoke to you has come upon you, so Yahweh will bring upon you every evil word, until he has destroyed you from off this good land that Yahweh your God has given to you.
translation:
  language: hi
  text: और ऐसा होगा कि, जैसे हर भली बात, जो तुम्हारे परमेश्वर यहोवा ने तुमसे कही थी, तुम पर पूरी हुई है, वैसे ही यहोवा हर बुरी बात[a] तुम पर लाएगा, जब तक कि वह तुम्हें इस अच्छी भूमि में से मिटा न दे, जिसे तुम्हारे परमेश्वर यहोवा ने तुम्हें दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर विपत्ति” अथवा “हर अनिष्ट।” इब्रानी में शाब्दिक रूप से “हर बुरी बात/वचन” है, जो पद के पहले भाग की “हर भली बात” के समानांतर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा कि
  rationale: यह भविष्य की परिस्थिति का गंभीर परिचय देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: जैसे ... वैसे ही
  rationale: इब्रानी की तुलनात्मक और सहसंबंधी संरचना को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: בָּא עֲלֵיכֶם
  choice: तुम पर आ पूरी हुई है
  rationale: עַל के स्थानिक रूपक और पहले से साकार हो चुकी ईश्वरीय वाणी—दोनों को हिन्दी में बोधगम्य ढंग से व्यक्त करता है।
- source_word: כָּל הַדָּבָר הַטּוֹב
  choice: हर भली बात
  rationale: דָּבָר के ‘बात/वचन/विषय’ अर्थक्षेत्र को बनाए रखता है तथा अगले समानांतर पदबंध ‘हर बुरी बात’ से शब्दगत संबंध सुरक्षित करता है।
- source_word: דִּבֶּר ... אֲלֵיכֶם
  choice: तुमसे कही थी
  rationale: प्रत्यक्ष संबोधन और पूर्व में कही गई वाणी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के विशिष्ट वाचक नाम को नाम के रूप में प्रस्तुत करता है, सामान्य उपाधि से प्रतिस्थापित नहीं करता।
- source_word: יָבִיא ... עֲלֵיכֶם
  choice: तुम पर लाएगा
  rationale: हिफ़ील की कारक शक्ति और עַל की पुनरावृत्ति दोनों को सुरक्षित रखता है।
- source_word: כָּל הַדָּבָר הָרָע
  choice: हर बुरी बात
  rationale: ‘हर भली बात’ के साथ जानबूझकर रखी गई शाब्दिक समानांतरता को बनाए रखता है; पादटिप्पणी प्रसंगगत ‘विपत्ति’ अर्थ बताती है।
- source_word: עַד הַשְׁמִידוֹ אֹתְכֶם
  choice: जब तक कि वह तुम्हें ... नष्ट न कर दे
  rationale: न्याय की प्रक्रिया के अंतिम परिणाम को दर्शाने वाले इब्रानी पदबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: इस अच्छे देश में से
  rationale: यहाँ אֲדָמָה उस प्रदत्त भूभाग को सूचित करती है; ‘देश में से’ हिन्दी में वहाँ से मिटा दिए जाने का भाव स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के विशिष्ट नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में विशिष्ट वाचक नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को उपाधि में बदलने से बचाता है।
- issue: परमेश्वर द्वारा लाए जाने वाले הָרָע का अर्थ
  choice: बुरी बात
  alternative: विपत्ति; अनिष्ट; बुरा वचन
  rationale: पाठ भली और बुरी דָּבָר के बीच तनावपूर्ण समानांतरता रखता है। मुख्य पाठ उस समानांतरता को बचाता है, जबकि पादटिप्पणी स्पष्ट करती है कि यहाँ नैतिक दुष्टता नहीं, प्रतिकूल न्याय या विपत्ति भी अभिप्रेत हो सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर किंतु सहज शैली रखी गई है। ‘भली बात/बुरी बात’ से मूल की शाब्दिक समानांतरता बनी रहती है; ‘आ पूरी हुई है’ पूर्व कथन के साकार होने का अर्थ स्पष्ट करता है।
