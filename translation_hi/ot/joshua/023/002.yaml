base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/002.yaml
  text: Then Joshua called for all Israel—for its elders[a], its heads, its judges, and its officers—and said to them, “I am old[c][b]; I have advanced in years.”
translation:
  language: hi
  text: तब यहोशू ने सारे इस्राएल को—उसके बुज़ुर्गों, प्रधानों, न्यायियों और अधिकारियों को—बुलाया और उनसे कहा, “मैं बूढ़ा हो गया हूँ; मेरी आयु ढल चुकी है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: हिब्रू मुहावरे का शाब्दिक रूप है, “मैं दिनों में आया हूँ”; अर्थात, “मैं आयु में बहुत आगे बढ़ गया हूँ।”
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाया
  rationale: קרא के साथ לְ यहाँ लोगों को अपने पास एकत्र होने के लिए बुलाने का अर्थ देता है। ‘बुलाया’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से कठोर ‘तलब किया’ से बेहतर बैठता है।
- source_word: לְכָל יִשְׂרָאֵל
  choice: सारे इस्राएल को
  rationale: मूल पाठ के सामूहिक राष्ट्रीय उल्लेख को बनाए रखता है; इसके बाद आने वाली पदाधिकारियों की सूची स्पष्ट करती है कि इस्राएल अपने प्रतिनिधि अगुओं के रूप में उपस्थित है।
- source_word: לִזְקֵנָיו
  choice: उसके पुरनियों
  rationale: प्रत्यय का संबंध सामूहिक संज्ञा ‘इस्राएल’ से है। ‘पुरनिये’ स्थापित बाइबिलीय प्रशासनिक पदनाम है और सामान्य हिन्दी पाठक के लिए भी बोधगम्य है।
- source_word: וּלְרָאשָׁיו
  choice: प्रधानों
  rationale: शाब्दिक अर्थ ‘सिरों’ से यहाँ प्रमुख अगुओं या मुखियाओं का बोध होता है। ‘प्रधान’ स्रोत की प्रशासनिक भूमिका को स्वाभाविक हिन्दी में व्यक्त करता और अन्य पदों से अलग रखता है।
- source_word: וּלְשֹׁפְטָיו
  choice: न्यायियों
  rationale: इस नागरिक-प्रशासनिक सूची में यह न्याय करने वाले पदाधिकारियों को दर्शाता है; ‘न्यायी’ सटीक और प्रचलित हिन्दी पद है।
- source_word: וּלְשֹׁטְרָיו
  choice: अधिकारियों
  rationale: यह अधीनस्थ प्रशासनिक पदाधिकारियों को सूचित करता है। ‘अधिकारी’ व्यापक किंतु प्रसंगानुकूल है; ‘लेखक’ अर्थ को अनावश्यक रूप से संकीर्ण कर देता।
- source_word: אֲנִי זָקַנְתִּי
  choice: मैं बूढ़ा हो गया हूँ
  rationale: हिब्रू पूर्ण क्रिया वृद्ध होने की प्रक्रिया और उससे बनी वर्तमान अवस्था दोनों व्यक्त करती है; हिन्दी का यह रूप दोनों को स्वाभाविक ढंग से रखता है।
- source_word: בָּאתִי בַּיָּמִים
  choice: मेरी आयु बहुत बढ़ गई है
  rationale: शाब्दिक मुहावरा ‘मैं दिनों में आ गया हूँ’ अधिक आयु हो जाने का संकेत देता है। चुना हुआ रूप आधुनिक हिन्दी में अर्थ स्पष्ट करता है और पिछले वाक्यांश की समानांतरता बनाए रखता है।
theological_decisions:
- issue: अगली नेतृत्व-सूची के संदर्भ में ‘सारे इस्राएल’ का आशय
  choice: ‘सारे इस्राएल’ को पाठ में बनाए रखते हुए अगली सूची को उसके प्रतिनिधि अगुओं का स्पष्टीकरण माना गया है।
  alternative: इसे समेटकर ‘इस्राएल के सभी अगुओं’ के रूप में अनुवाद करना।
  rationale: हिब्रू पहले स्पष्ट रूप से ‘सारे इस्राएल’ कहता है और फिर पुरनियों, प्रधानों, न्यायियों और अधिकारियों को गिनाता है। दोनों तत्व बनाए रखने से सामूहिक संबोधन और प्रतिनिधिक उपस्थिति के बीच का तनाव समाप्त नहीं होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। प्रशासनिक पदों में ‘पुरनिये, प्रधान, न्यायी और अधिकारी’ का भेद सुरक्षित है। डैश द्वारा ‘सारे इस्राएल’ के बाद की सूची को व्याख्यात्मक/प्रतिनिधिक रूप में दिखाया गया है, बिना मूल सामूहिक अभिव्यक्ति को हटाए।
