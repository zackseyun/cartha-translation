  text: וְ/אַתֶּ֣ם רְאִיתֶ֗ם אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם לְ/כָל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/003.yaml
  text: And you yourselves have seen all that Yahweh your God has done to all these nations before you[a], for Yahweh your God is the one who has fought for you.
translation:
  language: hi
  text: और तुमने स्वयं वह सब देखा है जो तुम्हारे परमेश्वर याहवे ने तुम्हारे सामने इन सब जातियों पर किया है[a], क्योंकि तुम्हारा परमेश्वर याहवे ही तुम्हारे लिए लड़ा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘तुम्हारे सामने से’; यह मुहावरा इस्राएल के सामने से उन जातियों को हटाए जाने की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: और तुम लोगों ने स्वयं
  rationale: स्वतंत्र बहुवचन सर्वनाम का बल ‘स्वयं’ से व्यक्त किया गया है; ‘और’ पिछले कथन से वाक्य का संबंध बनाए रखता है।
- source_word: רְאִיתֶם
  choice: देखा है
  rationale: पूर्ण हो चुके प्रत्यक्ष अनुभव की वर्तमान प्रासंगिकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה
  choice: वह सब ... किया है
  rationale: इब्रानी अभिव्यक्ति के व्यापक अर्थ को बिना कार्य का स्वरूप अनावश्यक रूप से निश्चित किए सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का देवनागरी लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय और वाचागत संबोधन को सीधे व्यक्त करता है।
- source_word: לְכָל הַגּוֹיִם הָאֵלֶּה
  choice: इन सभी जातियों के साथ
  rationale: यहाँ לְ से प्रभावित कर्म का संकेत मिलता है; ‘के साथ’ עשה के व्यापक अर्थ को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: מִפְּנֵיכֶם
  choice: तुम्हारे सामने
  rationale: प्रसंगानुकूल सहज हिन्दी; मूल का अधिक शाब्दिक ‘तुम्हारे सामने से’ निष्कासन का भाव रखता है, जिसे पादटिप्पणी में बताया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: पहले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: הוּא הַנִּלְחָם
  choice: याहवे ही ... लड़ा है
  rationale: הוּא के बल को ‘ही’ से और इस पूर्वदर्शी प्रसंग में संज्ञार्थक कृदंत को पूर्ण क्रिया से व्यक्त किया गया है।
- source_word: לָכֶם
  choice: तुम्हारे लिए
  rationale: लाभ अथवा पक्ष में कार्य करने का भाव स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका निकट देवनागरी लिप्यंतरण है और नाम को किसी उपाधि में नहीं बदलता।
- issue: युद्ध में कर्ता पर बल
  choice: तुम्हारा परमेश्वर याहवे ही तुम्हारे लिए लड़ा है
  alternative: वह तुम्हारे लिए लड़ता रहा है
  rationale: इब्रानी הוּא का बल सुरक्षित रखते हुए बीते कार्य पर केंद्रित प्रसंग व्यक्त किया गया है; कृदंत में निहित चरित्रगत या निरंतर भाव को अनिवार्य रूप से अलग सिद्धान्त में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य शैली। बहुवचन संबोधन को ‘तुम लोगों’ से स्पष्ट किया गया है और मूल के बल को ‘स्वयं’ तथा ‘ही’ से सुरक्षित रखा गया है।
