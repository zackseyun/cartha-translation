base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/006.yaml
  text: Therefore be very strong to keep and to do all that is written in the Book of the Law of Moses[a], so as not to turn from it to the right or to the left.
translation:
  language: hi
  text: इसलिए तुम बहुत दृढ़ रहो, ताकि मूसा की व्यवस्था की पुस्तक[a] में लिखी हुई सभी बातों का पालन करो और उन्हें पूरा करो; उससे दाएँ या बाएँ न हटो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मूसा की शिक्षा की पुस्तक’; इब्रानी शब्द तोराह का अर्थ ‘शिक्षा’ या ‘निर्देश’ भी हो सकता है, यद्यपि यहाँ इसका संकेत विशेष रूप से मूसा से जुड़ी व्यवस्था के लिखित संग्रह की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזַקְתֶּם מְאֹד
  choice: इसलिए तुम बहुत दृढ़ रहो
  rationale: חזק का बहुवचन रूप यहाँ प्रोत्साहन/आज्ञा का भाव रखता है और מְאֹד उसे तीव्र करता है। हिंदी में ‘बहुत दृढ़ रहो’ सामूहिक संबोधन और नैतिक संकल्प दोनों को स्वाभाविक ढंग से व्यक्त करता है। आरंभिक וַ को प्रसंगगत निष्कर्ष के रूप में ‘इसलिए’ से व्यक्त किया गया है।
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: पालन करो और उन्हें पूरा करो
  rationale: שׁמר विधि-विधान के संदर्भ में सावधानी से पालन करने और עשה उसे व्यवहार में पूरा करने का भाव देता है। दोनों क्रियाओं को बनाए रखने से इब्रानी की युग्मित अभिव्यक्ति सुरक्षित रहती है।
- source_word: כָּל הַכָּתוּב
  choice: लिखी हुई सब बातों
  rationale: यह पदबंध लिखित विषयवस्तु की समग्रता बताता है। ‘लिखी हुई सब बातों’ आधुनिक हिंदी में स्पष्ट और स्रोत के निकट है।
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: मूसा की व्यवस्था की पुस्तक
  rationale: סֵפֶר के लिए ‘पुस्तक’ और इस मूसीय वाचा-संदर्भ में תּוֹרָה के लिए ‘व्यवस्था’ उपयुक्त हैं। यह स्थापित संदर्भ को व्यक्त करता है, जबकि व्यापक अर्थ ‘शिक्षा/निर्देश’ को पादटिप्पणी में रखा गया है।
- source_word: לְבִלְתִּי סוּר מִמֶּנּוּ
  choice: उससे न ... मुड़ो
  rationale: यह विचलित न होने का निषेधात्मक प्रयोजन व्यक्त करता है। एकवचन ‘उससे’ लिखित व्यवस्था को एक समग्र इकाई के रूप में संदर्भित करता है।
- source_word: יָמִין וּשְׂמֹאול
  choice: न तो दाएँ ... न बाएँ
  rationale: यह किसी भी दिशा में मार्ग से हटने का प्रचलित इब्रानी रूपक है। हिंदी में समान रूपक स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: मूसीय वाचा के संदर्भ में תּוֹרָה का अनुवाद
  choice: ‘मूसा की व्यवस्था की पुस्तक’ में ‘व्यवस्था’
  alternative: ‘मूसा की शिक्षा की पुस्तक’ अथवा ‘मूसा के निर्देश की पुस्तक’
  rationale: תּוֹרָה का अर्थ व्यापक रूप से शिक्षा या निर्देश हो सकता है, पर इस सूत्रबद्ध संदर्भ में संकेत मूसा से संबद्ध लिखित वाचा-विधि-संग्रह की ओर है। ‘व्यवस्था’ उस विशिष्ट संदर्भ को स्पष्ट रखता है, और व्यापक शब्दार्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी, सामूहिक ‘तुम’ संबोधन और गरिमापूर्ण उपदेशात्मक शैली। ‘पालन करो और उन्हें पूरा करो’ स्रोत की दो समानांतर क्रियाओं को स्वाभाविक हिंदी में बनाए रखता है।
