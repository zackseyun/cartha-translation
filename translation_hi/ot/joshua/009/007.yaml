reference: Joshua 9:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ו/יאמרו אִֽישׁ יִשְׂרָאֵ֖ל אֶל הַ/חִוִּ֑י אוּלַ֗י בְּ/קִרְבִּ/י֙ אַתָּ֣ה יוֹשֵׁ֔ב וְ/אֵ֖יךְ אכרות לְ/ךָ֥ בְרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/007.yaml
  text: But the men of Israel said to the Hivite[a], “Perhaps you are living among us[b]; how then could I make a covenant with you?”
translation:
  language: hi
  text: इस्राएल के लोगों ने हिव्वी[a] से कहा, “हो सकता है कि तुम हमारे बीच[b] रहते हों; फिर मैं तुम्हारे साथ वाचा[c] कैसे बाँध सकता हूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में जातिनाम एकवचन है; सम्भवतः समूह के प्रतिनिधि को संबोधित किया गया है।
    reason: grammatical_clarification
  - marker: b
    text: मूल इब्रानी में शाब्दिक रूप से ‘मेरे बीच’ है; एक प्रतिनिधि इस्राएल की ओर से बोल रहा है।
    reason: lexical_alternative
  - marker: c
    text: मूल इब्रानी मुहावरे का शाब्दिक अर्थ ‘वाचा काटना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के लोगों
  rationale: אִישׁ रूप में एकवचन है, पर बहुवचन क्रिया ויאמרו के साथ यहाँ सामूहिक अर्थ देता है। आधुनिक हिन्दी में ‘इस्राएल के लोगों’ से प्रतिनिधियों का समूह स्वाभाविक और स्पष्ट रूप से व्यक्त होता है।
- source_word: הַחִוִּי
  choice: हिव्वी
  rationale: मूल पाठ की एकवचन जातिनाम-संज्ञा को रखा गया है; सम्भवतः समूह के प्रतिनिधि को संबोधित किया गया है।
- source_word: אוּלַי
  choice: हो सकता है कि
  rationale: यह संशय या सम्भावना व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּקִרְבִּי
  choice: हमारे ही बीच
  rationale: शाब्दिक रूप ‘मेरे बीच में’ है, किन्तु वक्ता सामूहिक इस्राएल का प्रतिनिधित्व करता है। ‘ही’ उस आशंका पर उपयुक्त बल देता है कि वे निषिद्ध स्थानीय निवासी हो सकते हैं।
- source_word: יוֹשֵׁב
  choice: रहते हो
  rationale: ישׁב का कृदन्त यहाँ लगातार निवास करने का अर्थ देता है; ‘रहते हो’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: וְאֵיךְ
  choice: फिर ... कैसे
  rationale: संयोजक और प्रश्नवाचक शब्द आशंका से निकलने वाले परिणाम को व्यक्त करते हैं; ‘फिर ... कैसे’ इस तर्क-संबंध को स्वाभाविक रूप से रखता है।
- source_word: אכרות ... בְרִית
  choice: वाचा बाँध सकता हूँ
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘वाचा काटना’ है। हिन्दी में ‘वाचा बाँधना’ अर्थपूर्ण, प्रतिष्ठित और सहज मुहावरा है, तथा प्रथम पुरुष एकवचन क्रिया को भी सुरक्षित रखता है।
- source_word: לְךָ
  choice: तुम्हारे साथ
  rationale: वाचा बाँधने के प्रसंग में לְ संबंध के दूसरे पक्ष को दर्शाता है; हिन्दी में ‘के साथ’ इसका स्वाभाविक रूप है।
theological_decisions:
- issue: इस्राएल की ओर से प्रतिनिधि वक्ता और सामूहिक एकवचन
  choice: समूह के लिए ‘हमारे बीच’ रखा गया, लेकिन אכרות के प्रथम पुरुष एकवचन को ‘मैं ... बाँध सकता हूँ’ के रूप में सुरक्षित रखा गया।
  alternative: 'पूरे कथन को बहुवचन बनाना: ‘हमारे बीच ... हम वाचा कैसे बाँध सकते हैं?’ अथवा सभी एकवचन रूपों को अक्षरशः रखना: ‘मेरे बीच ... मैं’।'
  rationale: इब्रानी में सामूहिक और प्रतिनिधिक एकवचन के बीच तनाव है। मिश्रित हिन्दी रूप उस तनाव को मिटाए बिना पाठक को यह समझने देता है कि एक प्रतिनिधि इस्राएल की ओर से बोल रहा है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वाचा बाँधना’ बाइबलीय अवधारणा को स्पष्ट रखते हुए हिन्दी में स्वाभाविक है। संबोधन में ‘तुम’ मूल के एकवचन रूप के अनुरूप है।
