base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/015.yaml
  text: So Joshua made peace with them and made a covenant with them to let them live[c][b][a], and the leaders of the congregation swore to them.
translation:
  language: hi
  text: तब यहोशू ने उनके साथ शांति स्थापित की और उन्हें जीवित रहने देने के लिए उनके साथ वाचा बाँधी[a]; और मंडली के प्रधानों ने उनसे शपथपूर्वक प्रतिज्ञा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का शाब्दिक अर्थ है, “वाचा काटी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם יְהוֹשֻׁעַ שָׁלוֹם
  choice: यहोशू ने उनके साथ शान्ति स्थापित की
  rationale: इब्रानी मुहावरा शांतिपूर्ण संबंध स्थापित करने को व्यक्त करता है। ‘शान्ति स्थापित की’ आधुनिक हिन्दी में स्वाभाविक है और राजनीतिक-वाचागत भाव बनाए रखता है।
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: उनके साथ वाचा बाँधी
  rationale: शाब्दिक रूप से इब्रानी में ‘वाचा काटी’ है, पर हिन्दी में ‘वाचा बाँधना’ उसी औपचारिक संबंध को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: לְחַיּוֹתָם
  choice: उन्हें जीवित रहने देने के लिए
  rationale: यह उद्देश्यसूचक रूप है और उनके प्राण न लेने, अर्थात उन्हें जीवित छोड़ने, को व्यक्त करता है; चुना हुआ रूप मूल की संरचना और आशय दोनों रखता है।
- source_word: וַיִּשָּׁבְעוּ לָהֶם
  choice: उनसे शपथ खाई
  rationale: क्रिया औपचारिक शपथ लेने को दर्शाती है। हिन्दी मुहावरे में ‘उनसे शपथ खाई’ संक्षिप्त और स्पष्ट है।
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: मण्डली के प्रधानों
  rationale: נְשִׂיאִים मान्य प्रधानों या अगुओं को और עֵדָה सामुदायिक सभा को दर्शाता है। यह पदबंध बाद की किसी विशिष्ट कलीसियाई संरचना को आरोपित किए बिना सामूहिक भाव रखता है।
theological_decisions:
- issue: वाचा बाँधने के इब्रानी मुहावरे का अनुवाद
  choice: वाचा बाँधी
  alternative: वाचा काटी / वाचा की
  rationale: ‘वाचा काटी’ स्रोत की छवि तो बचाता है, पर सामान्य हिन्दी में भ्रामक है। ‘वाचा बाँधी’ औपचारिक और पारस्परिक प्रतिबद्धता का वाचागत भाव स्वाभाविक रूप से बनाए रखता है।
- issue: הָעֵדָה का सामुदायिक अर्थ
  choice: मण्डली
  alternative: सभा / समुदाय
  rationale: यहाँ शब्द इस्राएल के संगठित सामुदायिक निकाय को दर्शाता है। ‘मण्डली’ उस सामूहिक अर्थ को रखता है, पर किसी विशिष्ट बाद की धार्मिक संस्था का संकेत अनिवार्य नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथा के अनुरूप संक्षिप्त और गरिमापूर्ण रखी गई है। ‘शान्ति स्थापित की’, ‘वाचा बाँधी’ और ‘शपथ खाई’ जैसे प्रचलित पद स्रोत के कानूनी तथा सामुदायिक स्वर को बनाए रखते हैं।
