source:
  edition: WLC
  text: וְ/עַתָּ֖ה אֲרוּרִ֣ים אַתֶּ֑ם וְ/לֹֽא יִכָּרֵ֨ת מִ/כֶּ֜ם עֶ֗בֶד וְ/חֹטְבֵ֥י עֵצִ֛ים וְ/שֹֽׁאֲבֵי מַ֖יִם לְ/בֵ֥ית אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/023.yaml
  text: So now you are cursed[a], and there shall never cease to be from among you servants, cutters of wood and drawers of water for the house of my God.
translation:
  language: hi
  text: अब तुम शापित हो, और तुममें से दास—मेरे परमेश्वर के भवन के लिए लकड़ी काटनेवाले और पानी भरनेवाले—कभी समाप्त नहीं होंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “तुममें से दास काटा या हटाया नहीं जाएगा।” इब्रानी मुहावरे का आशय है कि उनके समुदाय से इस अधीनस्थ श्रम के लिए लोग निरंतर मिलते रहेंगे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद यहोशू के पिछले कथन से उसके परिणामस्वरूप दिए गए दंड की ओर बढ़ता है; ‘इसलिए अब’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲרוּרִים אַתֶּם
  choice: तुम शापित हो
  rationale: बहुवचन विधेय विशेषण को सीधे और स्पष्ट रूप में प्रस्तुत करता है।
- source_word: וְלֹא יִכָּרֵת מִכֶּם עֶבֶד
  choice: तुममें से दास ... कभी समाप्त नहीं होंगे
  rationale: כרת के निफ़अल और מִן की रचना का शाब्दिक भाव ‘तुममें से काटा/हटाया न जाएगा’ है। यहाँ एकवचन עֶבֶד सामूहिक अर्थ रखता है; हिन्दी बहुवचन उस निरंतर सामुदायिक दशा को स्पष्ट करता है।
- source_word: עֶבֶד
  choice: दास
  rationale: यह थोपी गई अधीनस्थ श्रम-दशा को ‘सेवक’ की अपेक्षा अधिक ठीक ढंग से व्यक्त करता है, बिना आधुनिक नस्लीय अर्थ आरोपित किए।
- source_word: חֹטְבֵי עֵצִים
  choice: लकड़ी काटनेवाले
  rationale: निर्धारित शारीरिक श्रम को आधुनिक, सहज हिन्दी में ठोस रूप से व्यक्त करता है।
- source_word: שֹׁאֲבֵי מַיִם
  choice: पानी भरनेवाले
  rationale: कुएँ या जलस्रोत से पानी निकालने और लाने के कार्य के लिए यह स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: לְבֵית אֱלֹהָי
  choice: मेरे परमेश्वर के भवन के लिए
  rationale: यहाँ בַּיִת घरेलू परिवार नहीं, परमेश्वर के पवित्रस्थान को सूचित करता है; ‘भवन’ इस संदर्भ को स्पष्ट रखते हुए मूल रूपक बचाता है।
theological_decisions:
- issue: यहोशू के शाप में थोपी गई अधीनस्थ स्थिति
  choice: दास
  alternative: सेवक
  rationale: संदर्भ में स्वतंत्र सेवा नहीं, स्थायी रूप से थोपा गया निम्न श्रम है। ‘दास’ शाप की कठोरता को बनाए रखता है; ‘सेवक’ उसे अनावश्यक रूप से नरम कर सकता है।
- issue: दंड की निरंतरता और उसका सामूहिक आशय
  choice: तुममें से दास ... कभी समाप्त नहीं होंगे
  alternative: तुममें से कोई दास कभी काटा नहीं जाएगा
  rationale: मूल की ‘काटा न जाएगा’ वाली अभिव्यक्ति वंश/समुदाय से इस श्रम-वर्ग के कभी समाप्त न होने का संकेत देती है। चुना हुआ पाठ इसे स्पष्ट करता है, पर पादटिप्पणी में अधिक शाब्दिक रूप सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। डैश द्वारा ‘दास’ के बाद आने वाले दोनों श्रम-कार्यों को उसकी व्याख्या के रूप में जोड़ा गया है। ‘भवन’ पवित्रस्थान के संदर्भ को बनाए रखता है, जबकि पाठ में उससे आगे की ऐतिहासिक अवस्था निर्दिष्ट नहीं की गई।
