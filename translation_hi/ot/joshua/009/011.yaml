  text: וַ/יֹּאמְר֣וּ אֵלֵ֡י/נוּ זְֽקֵינֵי/נוּ֩ וְ/כָל יֹשְׁבֵ֨י אַרְצֵ֜/נוּ לֵ/אמֹ֗ר קְח֨וּ בְ/יֶדְ/כֶ֤ם צֵידָה֙ לַ/דֶּ֔רֶךְ וּ/לְכ֖וּ לִ/קְרָאתָ֑/ם וַ/אֲמַרְתֶּ֤ם אֲלֵי/הֶם֙ עַבְדֵי/כֶ֣ם אֲנַ֔חְנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/011.yaml
  text: So our elders and all the inhabitants of our land said to us[a], ‘Take provisions in your hand for the journey, and go to meet them. Say to them, “We are your servants”[b]; and now make a covenant with us.’
translation:
  language: hi
  text: इसलिए हमारे पुरनियों और हमारे देश के सभी निवासियों ने हमसे कहा, ‘यात्रा के लिए अपने साथ भोजन-सामग्री लो और उनसे मिलने जाओ। उनसे कहना, “हम आपके सेवक हैं[a]।” और अब हमारे साथ वाचा बाँधिए[b]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सेवक’ विनम्र राजनयिक भाषा को दर्शाता है; इब्रानी शब्द का अर्थ दूसरे संदर्भों में ‘दास’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘हमारे साथ वाचा काटिए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵינֵינוּ
  choice: हमारे पुरनियों
  rationale: संदर्भ में यह केवल वृद्ध पुरुषों का नहीं, बल्कि समुदाय के अगुओं का पदनाम है; ‘पुरनियों’ बाइबलीय संदर्भ में इस सामाजिक-राजनीतिक भूमिका को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יֹשְׁבֵי אַרְצֵנוּ
  choice: हमारे देश के सभी निवासियों
  rationale: यह कृदन्तीय पद देश में रहने वाले समस्त लोगों को सामूहिक रूप से दर्शाता है।
- source_word: צֵידָה
  choice: भोजन-सामग्री
  rationale: शब्द यात्रा के लिए रखे गए खाद्य अथवा रसद को दर्शाता है; ‘भोजन-सामग्री’ सामान्य पाठक के लिए स्पष्ट है और केवल एक बार के भोजन तक अर्थ को सीमित नहीं करता।
- source_word: בְיֶדְכֶם
  choice: अपने साथ
  rationale: शाब्दिक अर्थ ‘अपने हाथ में’ है, पर यहाँ वस्तु साथ ले जाने का भाव है; आधुनिक हिन्दी में ‘अपने साथ’ अधिक स्वाभाविक है।
- source_word: לַדֶּרֶךְ
  choice: यात्रा के लिए
  rationale: इस संदर्भ में דֶּרֶךְ मार्ग से अधिक यात्रा की परिस्थिति और उद्देश्य को सूचित करता है।
- source_word: לִקְרָאתָם
  choice: उनसे मिलने
  rationale: यह किसी के पास जाकर उससे मिलने का सामान्य भाव व्यक्त करता है।
- source_word: עַבְדֵיכֶם
  choice: आपके सेवक
  rationale: עבד का अर्थ ‘दास’ भी हो सकता है, किंतु यहाँ संधि माँगते समय प्रयुक्त विनम्र राजनयिक भाषा प्रमुख है।
- source_word: וְעַתָּה
  choice: अब
  rationale: यह कथन से निवेदन की ओर संक्रमण कराता है; हिन्दी में ‘अब’ उस प्रवाह को स्पष्ट और स्वाभाविक रखता है।
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: हमारे साथ वाचा बाँधिए
  rationale: כרת ברית का शाब्दिक रूप ‘वाचा काटना’ है, जबकि हिन्दी की स्वाभाविक बाइबलीय अभिव्यक्ति ‘वाचा बाँधना’ है; इससे ‘वाचा’ की श्रेणी भी बनी रहती है।
