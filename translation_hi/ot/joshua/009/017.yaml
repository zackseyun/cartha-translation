  text: So the sons of Israel set out and came to their cities on the third day[a]. Now their cities were Gibeon, Chephirah, Beeroth[b], and Kiriath-jearim.
translation:
  language: hi
  text: तब इस्राएली[a] चल पड़े और तीसरे दिन उनके नगरों में पहुँचे। उनके नगर थे—गिबोन, कपीरा, बेरोत और किर्यत-यारीम।
  philosophy: optimal-equivalence
  footnotes:
