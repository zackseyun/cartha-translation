  rationale: נסע का यह कथात्मक रूप प्रस्थान और यात्रा आरम्भ करने को दर्शाता है; ‘चल पड़े’ स्वाभाविक हिन्दी में कथा की गति बनाए रखता है।
- source_word: בְנֵי יִשְׂרָאֵל
