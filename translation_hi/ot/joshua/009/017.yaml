  rationale: हिब्रू כְּפִירָה का देवनागरी में निकट और पठनीय लिप्यंतरण; आरम्भिक व्यंजन को ‘क’ से व्यक्त किया गया है।
- source_word: בְּאֵרוֹת
  choice: बेरोत
  rationale: हिब्रू स्थान-नाम का निकट, पठनीय देवनागरी लिप्यंतरण।
- source_word: קִרְיַת יְעָרִים
  choice: किर्यत-यारीम
  rationale: संयुक्त हिब्रू स्थान-नाम की संरचना को योजक चिह्न के साथ सुरक्षित रखने वाला लिप्यंतरण।
