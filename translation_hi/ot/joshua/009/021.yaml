source:
  edition: WLC
  text: וַ/יֹּאמְר֧וּ אֲלֵי/הֶ֛ם הַ/נְּשִׂיאִ֖ים יִֽחְי֑וּ וַ֠/יִּֽהְיוּ חֹטְבֵ֨י עֵצִ֤ים וְ/שֹֽׁאֲבֵי מַ֨יִם֙ לְ/כָל הָ֣/עֵדָ֔ה כַּ/אֲשֶׁ֛ר דִּבְּר֥וּ לָ/הֶ֖ם הַ/נְּשִׂיאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/021.yaml
  text: The leaders said to them[a], “Let them live.” So they became woodcutters and water-drawers for all the congregation, just as the leaders had spoken to them.
translation:
  language: hi
  text: प्रधानों ने उनसे कहा, “उन्हें जीवित रहने दो।” इसलिए वे सारी सभा के लिए लकड़ी काटने और पानी भरनेवाले बन गए, जैसा प्रधानों ने उनसे कहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּשִׂיאִים
  choice: प्रधानों
  rationale: यहाँ नָשִׂיא इस्राएली समुदाय के मान्य अगुओं को सूचित करता है। ‘प्रधान’ आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: אֲלֵיהֶם / לָהֶם
  choice: उनके विषय में
  rationale: यद्यपि सामान्य अर्थ ‘उनसे’ हो सकता है, यहाँ बहुवचन आज्ञा ‘उन्हें जीवित रहने दो’ के कारण कथन गिबोनियों के विषय में सभा से कहा गया जान पड़ता है। हिन्दी में ‘उनके विषय में’ इस वाक्य-संबंध को स्वाभाविक बनाता है और आगे के לָהֶם के साथ भी मेल रखता है।
- source_word: יִחְיוּ
  choice: उन्हें जीवित रहने दो
  rationale: अपूर्ण क्रिया यहाँ आज्ञार्थक/निर्णयात्मक बल रखती है; यह गिबोनियों को न मारने और जीवित छोड़ने का निर्णय व्यक्त करती है।
- source_word: וַיִּהְיוּ
  choice: बन गए
  rationale: यह नेताओं के निर्णय के फलस्वरूप गिबोनियों को मिले नए और स्थायी कार्य-दायित्व की ओर संकेत करता है।
- source_word: חֹטְבֵי עֵצִים
  choice: लकड़ी काटने
  rationale: कृदंत पद निरंतर श्रम-भूमिका बताता है। ‘लकड़ी काटनेवाले’ स्वाभाविक आधुनिक हिन्दी है और मूल बिंब बनाए रखता है।
- source_word: שֹׁאֲבֵי מַיִם
  choice: पानी भरनेवाले
  rationale: शׁאב का मूल भाव कुएँ या स्रोत से पानी निकालना/भरना है। ‘पानी भरनेवाले’ सामान्य हिन्दी में स्पष्ट है और इसे केवल ढोने तक सीमित नहीं करता।
- source_word: לְכָל הָעֵדָה
  choice: पूरी सभा के लिए
  rationale: עֵדָה यहाँ इस्राएल के संगठित सामुदायिक निकाय को दर्शाता है। ‘पूरी सभा’ इस सामूहिक अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: כַּאֲשֶׁר דִּבְּרוּ
  choice: जैसा ... कहा था
  rationale: यह परिणाम को प्रधानों के पहले दिए गए निर्णय से जोड़ता है; ‘कहा था’ हिन्दी में पूर्वकालिक संबंध स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions:
- issue: प्रधानों का कथन किससे या किसके विषय में था
  choice: उनके विषय में
  alternative: उनसे
  rationale: मसोरेटी पाठ में אֲלֵיהֶם और לָהֶם सामान्यतः ‘उनसे’ हो सकते हैं, पर ‘उन्हें जीवित रहने दो’ तृतीय पुरुष में है। निकट प्रसंग (पद 19–20) में प्रधान सभा को उत्तर दे रहे हैं, इसलिए गिबोनियों ‘के विषय में’ कहना सम्भावित वाक्यार्थ है। यह चयन प्रसंग को स्पष्ट करता है, पर किसी doctrinal निष्कर्ष को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘लकड़ी काटने और पानी भरनेवाले’ मूल की समानांतर श्रम-भूमिकाओं को मुहावरेदार ढंग से बनाए रखता है।
