source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל אֲשֶׁ֣ר עָשָׂ֗ה לִ/שְׁנֵי֙ מַלְכֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן לְ/סִיחוֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן וּ/לְ/ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן אֲשֶׁ֥ר בְּ/עַשְׁתָּרֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/010.yaml
  text: and all that he did to the two kings of the Amorites who were beyond the Jordan—to Sihon king of Heshbon and to Og king of Bashan[b][a], who was at Ashtaroth—
translation:
  language: hi
  text: और यरदन के पार[a] के एमोरियों के उन दो राजाओं के साथ उसने जो कुछ किया—हेशबोन के राजा सीहोन के साथ और बाशान के राजा ओग के साथ, जो अश्तारोत में था[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरदन के उस पार।”
    reason: בְּעֵבֶר הַיַּרְדֵּן के भौगोलिक वाक्यांश का वैकल्पिक हिन्दी रूप।
  - marker: b
    text: या, “जो अश्तारोत पर था।”
    reason: בְּ का स्थानवाचक अर्थ ‘में’ या ‘पर/के पास’ हो सकता है; मुख्य पाठ निवास की अतिरिक्त धारणा जोड़े बिना स्थान बताता है।
lexical_decisions:
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה
  choice: और ... उसने जो कुछ किया था
  rationale: וְאֵת पिछले पद की सूची को आगे बढ़ाता है, जबकि כָּל אֲשֶׁר कार्यों की समग्रता बताता है। हिन्दी में ‘और ... जो कुछ’ इस प्रवाह को स्वाभाविक रूप से व्यक्त करता है। पूर्ववर्ती घटना के संदर्भ के कारण पूर्ण भूतकाल ‘किया था’ उपयुक्त है।
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: एमोरियों के दोनों राजाओं के साथ
  rationale: לִשְׁנֵי से उन व्यक्तियों का संकेत मिलता है जिनके साथ यह किया गया। ‘के साथ’ इब्रानी की अपेक्षाकृत तटस्थ रचना को बनाए रखता है और अनावश्यक रूप से ‘के विरुद्ध’ नहीं जोड़ता। सामूहिक जातिनाम को स्वाभाविक हिन्दी बहुवचन ‘एमोरियों’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: जो यरदन के पार रहनेवाले थे
  rationale: בְּעֵבֶר का अर्थ वक्ता की भौगोलिक दृष्टि से यरदन के पार का क्षेत्र है। राजाओं के स्थान को हिन्दी में स्पष्ट और स्वाभाविक बनाने के लिए ‘रहनेवाले’ प्रयुक्त है।
- source_word: לְסִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: हेशबोन के राजा सीहोन के साथ
  rationale: राजकीय उपाधि और स्थान को हिन्दी की स्वाभाविक संबंधवाचक संरचना में रखा गया है; नामों का लिप्यंतरण प्रचलित हिन्दी बाइबलीय रूपों के निकट है।
- source_word: וּלְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: और बाशान के राजा ओग के साथ
  rationale: यह सीहोन वाले समानांतर पदबंध को बनाए रखता है और दोनों राजाओं को स्पष्ट रूप से अलग करता है।
- source_word: אֲשֶׁר בְּעַשְׁתָּרוֹת
  choice: जो अश्तारोत में रहता था
  rationale: निकटतम एकवचन पूर्वपद ओग है, इसलिए संबंधवाचक उपवाक्य उसी से जोड़ा गया है। בְּ स्थान सूचित करता है; ‘में रहता था’ राजकीय निवास या केंद्र की धारणा को सहज हिन्दी में व्यक्त करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: עָשָׂה का निहित कर्ता
  choice: ‘उसने’ रखकर कर्ता को इसी पद में स्पष्ट रूप से नामित नहीं किया गया
  alternative: ‘यहोवा ने’ स्पष्ट रूप से जोड़ना
  rationale: इब्रानी में क्रिया तीसरे पुरुष एकवचन में है, पर इस पद में कर्ता का नाम नहीं है; संदर्भ से उसका संकेत मिलता है। ‘उसने’ स्रोत की अभिव्यक्ति और उसकी संदर्भ-निर्भरता को सुरक्षित रखता है।
- issue: राजाओं के प्रति किए गए कार्य का स्वरूप
  choice: ‘के साथ ... किया’
  alternative: ‘के विरुद्ध ... किया’
  rationale: लामेद के साथ עשה बताता है कि उनके साथ क्या किया गया, लेकिन ‘के विरुद्ध’ संघर्ष की दिशा को अधिक स्पष्ट करके व्याख्या जोड़ता। तटस्थ हिन्दी रचना मूल की व्यापकता बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज ऐतिहासिक शैली रखी गई है। पद पिछले वाक्य की सूची को आगे बढ़ाता है, इसलिए आरंभ में ‘और’ रखा गया है। राजाओं के लंबे परिचय को डैश और समानांतर पदबंधों से पठनीय बनाया गया है।
