reference: Joshua 9:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א לָ/הֶם֙ יְהוֹשֻׁ֔עַ וַ/יְדַבֵּ֥ר אֲלֵי/הֶ֖ם לֵ/אמֹ֑ר לָ/מָּה֩ רִמִּיתֶ֨ם אֹתָ֜/נוּ לֵ/אמֹ֗ר רְחוֹקִ֨ים אֲנַ֤חְנוּ מִ/כֶּם֙ מְאֹ֔ד וְ/אַתֶּ֖ם בְּ/קִרְבֵּ֥/נוּ יֹשְׁבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/022.yaml
  text: Then Joshua called for them and spoke to them[a], saying, “Why did you deceive us, saying, ‘We are very far from you,’ when you are living among us?”
translation:
  language: hi
  text: तब यहोशू ने उन्हें बुलाया और उनसे कहा, “तुमने हमें यह कहकर क्यों धोखा दिया, ‘हम तुमसे बहुत दूर रहते हैं,’ जबकि तुम हमारे बीच[a] रहते हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे मध्य”।
    reason: ‘हमारे मध्य’ בְּקִרְבֵּנוּ का अधिक औपचारिक, समानार्थी अनुवाद है।
lexical_decisions:
- source_word: וַיִּקְרָא לָהֶם
  choice: उन्हें बुलवाकर
  rationale: यहाँ קרא का आशय गिबोनियों को अपने सामने बुलाने से है। ‘बुलवाकर’ इस प्रसंग में बुलाए जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיְדַבֵּר אֲלֵיהֶם לֵאמֹר
  choice: उनसे कहा
  rationale: यह इब्रानी में वचन आरम्भ करने का प्रचलित सूत्र है। हिन्दी में ‘उनसे कहा’ उसका अर्थ बिना अनावश्यक दोहराव के स्वाभाविक रूप से देता है।
- source_word: רִמִּיתֶם אֹתָנוּ
  choice: हमें धोखा क्यों दिया
  rationale: पिएल रूप जानबूझकर छल करने का आरोप व्यक्त करता है; ‘धोखा दिया’ आधुनिक हिन्दी में स्पष्ट और उपयुक्त रूप से गंभीर है।
- source_word: רְחוֹקִים אֲנַחְנוּ מִכֶּם מְאֹד
  choice: हम तुमसे बहुत दूर के रहनेवाले हैं
  rationale: ‘बहुत दूर’ מְאֹד की तीव्रता बनाए रखता है, और ‘के रहनेवाले’ कथित भौगोलिक निवास को हिन्दी में स्पष्ट करता है।
- source_word: בְּקִרְבֵּנוּ
  choice: हमारे ही बीच
  rationale: בקרבנו का स्वाभाविक अर्थ ‘हमारे बीच/हमारे मध्य’ है। ‘ही’ कथित दूरी और वास्तविक निकटता के विरोध को हिन्दी में उभारता है, बिना नया अर्थ जोड़े।
- source_word: יֹשְׁבִים
  choice: रहते हो
  rationale: ישב का कृदन्त यहाँ लगातार निवास करने को दर्शाता है; प्रत्यक्ष संबोधन में ‘रहते हो’ सहज वर्तमानकालीन हिन्दी है।
theological_decisions:
- issue: आरोप में वाचा-संबंधी आशय जोड़ना
  choice: केवल भौगोलिक दूरी के विषय में किए गए छल को स्पष्ट रूप से व्यक्त किया गया है।
  alternative: मुख्य पाठ में संधि अथवा वाचा के उल्लंघन का निहितार्थ जोड़ना।
  rationale: इस पद में यहोशू का प्रत्यक्ष आरोप उनके झूठे दूरी-दावे पर केंद्रित है। संधि के व्यापक परिणाम प्रसंग में हैं, पर इस पद के शब्दों में उन्हें जोड़ना अतिव्याख्या होगी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष कथन में ‘तुम’ मूल इब्रानी के बहुवचन संबोधन के अनुरूप है।
