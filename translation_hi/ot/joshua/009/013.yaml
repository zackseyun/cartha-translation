source:
  edition: WLC
  text: וְ/אֵ֨לֶּה נֹאד֤וֹת הַ/יַּ֨יִן֙ אֲשֶׁ֣ר מִלֵּ֣אנוּ חֲדָשִׁ֔ים וְ/הִנֵּ֖ה הִתְבַּקָּ֑עוּ וְ/אֵ֤לֶּה שַׂלְמוֹתֵ֨י/נוּ֙ וּ/נְעָלֵ֔י/נוּ בָּל֕וּ מֵ/רֹ֥ב הַ/דֶּ֖רֶךְ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/013.yaml
  text: And these wineskins[a], which we filled when they were new—look, they have burst[c][b]; and these our garments and our sandals have worn out from the journey being very long.
translation:
  language: hi
  text: और दाखमधु की ये मशकें, जिन्हें हमने तब भरा था जब ये नई थीं—देखो, ये फट गई हैं; और हमारे ये वस्त्र और सैंडल बहुत लंबी यात्रा के कारण घिस गए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹאדוֹת הַיַּיִן
  choice: दाखमधु की मशकें
  rationale: נֹאד पशु-चर्म से बने तरल रखने के पात्र को दर्शाता है। ‘मशकें’ प्राचीन वस्तु का भौतिक स्वरूप बनाए रखता है, और ‘दाखमधु की’ उसके उपयोग को स्पष्ट करता है।
- source_word: מִלֵּאנוּ חֲדָשִׁים
  choice: जिन्हें हमने नई रहते भरा था
  rationale: חֲדָשִׁים मशकों की उस अवस्था को बताता है जिसमें वे भरी गई थीं। ‘नई रहते’ यह सम्बन्ध स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला कथन-कण है; ‘देखो’ आधुनिक हिन्दी में उसका प्रत्यक्ष संकेतात्मक बल बनाए रखता है।
- source_word: הִתְבַּקָּעוּ
  choice: फट गई हैं
  rationale: क्रिया मशकों के चिर जाने या फटकर खुल जाने को दर्शाती है। ‘फट गई हैं’ पात्रों के लिए सहज और सटीक हिन्दी है।
- source_word: שַׂלְמוֹתֵינוּ
  choice: हमारे ये वस्त्र
  rationale: שַׂלְמוֹת कपड़ों या बाहरी वस्त्रों के लिए व्यापक शब्द है। ‘वस्त्र’ कथात्मक गरिमा और व्यापक अर्थ दोनों बनाए रखता है।
- source_word: נְעָלֵינוּ
  choice: हमारे ... जूते
  rationale: נַעַל पाँव में पहनी जाने वाली वस्तु को दर्शाता है, जो उस ऐतिहासिक परिवेश में प्रायः सैंडलनुमा होती थी। ‘जूते’ आधुनिक हिन्दी का सहज व्यापक शब्द है।
- source_word: בָּלוּ
  choice: घिस गए हैं
  rationale: क्रिया उपयोग के कारण पुराना या जीर्ण हो जाने को व्यक्त करती है। वस्त्रों और जूतों दोनों के लिए ‘घिस गए हैं’ स्वाभाविक है और परिणामी अवस्था बताता है।
- source_word: מֵרֹב הַדֶּרֶךְ מְאֹד
  choice: बहुत लम्बी यात्रा के कारण
  rationale: इब्रानी पदबंध यात्रा की अत्यधिक विशालता या लम्बाई को घिसने का कारण बताता है। यह रूप कारण और तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है।
