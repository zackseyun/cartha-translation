reference: Joshua 9:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּלְכ֧וּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּ֑ל וַ/יֹּאמְר֨וּ אֵלָ֜י/ו וְ/אֶל אִ֣ישׁ יִשְׂרָאֵ֗ל מֵ/אֶ֤רֶץ רְחוֹקָה֙ בָּ֔אנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/006.yaml
  text: They went to Joshua at the camp at Gilgal and said to him and to the men of Israel[a], “We have come from a distant land; so now make a covenant with us.”
translation:
  language: hi
  text: वे गिलगाल के पड़ाव में यहोशू के पास गए और उससे तथा इस्राएल के पुरुषों से कहा, “हम दूर देश से आए हैं। इसलिए अब हमारे साथ वाचा बाँधिए[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे साथ संधि कीजिए।” इब्रानी मुहावरे का शाब्दिक अर्थ है, “हमारे लिए वाचा काटिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: वे ... गए
  rationale: הלך का सामान्य अर्थ ‘जाना’ है; कथात्मक क्रम और गंतव्यसूचक पदबंध के साथ ‘गए’ स्वाभाविक और स्रोत के निकट है।
- source_word: אֶל־יְהוֹשֻׁעַ אֶל־הַמַּחֲנֶה הַגִּלְגָּל
  choice: गिलगाल के पड़ाव में यहोशू के पास
  rationale: दोनों אֶל पदबंधों को सहज हिन्दी में गंतव्य और स्थान के रूप में व्यक्त किया गया है। מַחֲנֶה के लिए ‘पड़ाव’ यहाँ शिविर-स्थल का स्वाभाविक अर्थ देता है।
- source_word: אֵלָיו וְאֶל־אִישׁ יִשְׂרָאֵל
  choice: उससे तथा इस्राएल के पुरुषों से
  rationale: אִישׁ יִשְׂרָאֵל सामूहिक एकवचन है। ‘इस्राएल के पुरुषों’ से उसका व्याकरणिक पुरुषवाचक और सामूहिक आशय सुरक्षित रहता है।
- source_word: מֵאֶרֶץ רְחוֹקָה בָּאנוּ
  choice: हम दूर देश से आए हैं
  rationale: אֶרֶץ और רְחוֹקָה के अर्थ क्रमशः ‘देश/भूमि’ और ‘दूर’ हैं; पूर्ण क्रिया को वर्तमान परिणाम सहित स्वाभाविक हिन्दी में ‘आए हैं’ कहा गया है।
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद अनुरोध की ओर निष्कर्षात्मक संक्रमण करता है; ‘इसलिए अब’ उस संबंध को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: हमारे साथ वाचा बाँधिए
  rationale: כרת ברית का शाब्दिक बिंब ‘वाचा काटना’ हिन्दी में अपारदर्शी है। ‘वाचा बाँधना’ प्रचलित हिन्दी मुहावरा है, जो בְרִית की प्रमुख पारिभाषिक संगति भी बनाए रखता है। बहुवचन आदेश का सम्मानसूचक रूप ‘बाँधिए’ है।
theological_decisions:
- issue: राजनीतिक समझौते के प्रसंग में בְרִית का अनुवाद
  choice: वाचा
  alternative: संधि
  rationale: यद्यपि प्रसंग कूटनीतिक है, בְרִית वही व्यापक बाइबलीय शब्द है जिसे सामान्यतः ‘वाचा’ कहा जाता है। मुख्य पाठ में पारिभाषिक संगति रखी गई है और राजनीतिक अर्थ ‘संधि’ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘पड़ाव’, ‘वाचा’ और सम्मानसूचक बहुवचन ‘बाँधिए’ सामान्य पाठक के लिए सुबोध रहते हुए स्रोत की शैली और आशय को सुरक्षित रखते हैं।
