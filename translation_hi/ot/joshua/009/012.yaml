base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/012.yaml
  text: This bread of ours was warm when we took it as our provisions from our houses on the day we set out to come to you[a], but now, look, it is dry and has become moldy.
translation:
  language: hi
  text: हमारी यह रोटी उस दिन गरम थी, जब हम तुम्हारे पास आने के लिए निकले थे और इसे अपने घरों से यात्रा के लिए साथ लिया था। पर अब देखो, यह सूख गई है और धब्बेदार हो गई है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस पर फफूँदी लग गई है” अथवा “यह भुरभुरी हो गई है।” इब्रानी शब्द का शाब्दिक भाव बिंदुओं या धब्बों से चिह्नित होना है; पुरानी रोटी के प्रसंग में इसका ठीक आशय फफूँदी के धब्बे पड़ना, दरारें पड़ना, या भुरभुरी हो जाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה לַחְמֵנוּ
  choice: हमारी यह रोटी
  rationale: सम्बन्धसूचक प्रत्यय और संकेतवाचक शब्द दोनों को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: חָם
  choice: गरम
  rationale: मूल विशेषण का सीधा अर्थ रखा गया है; ‘ताज़ी’ निहित अर्थ होता, प्रत्यक्ष अर्थ नहीं।
- source_word: הִצְטַיַּדְנוּ אֹתוֹ
  choice: इसे ... यात्रा के भोजन के रूप में साथ लिया था
  rationale: क्रिया यहाँ यात्रा के लिए रसद जुटाने या साथ लेने को व्यक्त करती है; यह हिन्दी में अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: מִבָּתֵּינוּ
  choice: अपने घरों से
  rationale: मूल के बहुवचन ‘घरों’ को बनाए रखा गया है।
- source_word: בְּיוֹם צֵאתֵנוּ לָלֶכֶת אֲלֵיכֶם
  choice: उस दिन ... जब हम तुम्हारे पास आने के लिए निकले
  rationale: समय और यात्रा के उद्देश्य को सहज हिन्दी वाक्य-विन्यास में व्यक्त किया गया है; वक्ता श्रोताओं से प्रत्यक्ष बात कर रहे हैं, इसलिए ‘तुम्हारे पास आने’ स्वाभाविक है।
- source_word: וְעַתָּה הִנֵּה
  choice: पर अब देखो
  rationale: ‘पर’ वर्तमान दशा का पहले की दशा से विरोध दिखाता है और ‘देखो’ प्रत्यक्ष प्रमाण की ओर ध्यान खींचता है।
- source_word: יָבֵשׁ
  choice: सूख गई है
  rationale: वर्तमान परिणामी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהָיָה נִקֻּדִים
  choice: चित्तीदार हो गई है
  rationale: נִקֻּדִים का मूल भाव बिंदुओं या धब्बों से चिह्नित होना है। यह अनिश्चितता को ‘फफूँदी लगी’ या ‘चूर-चूर’ कहकर समय से पहले नहीं सुलझाता।
