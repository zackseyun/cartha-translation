base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/020.yaml
  text: This is what we will do to them and let them live[b][a], so that wrath may not come upon us because of the oath that we swore to them.
translation:
  language: hi
  text: हम उनके साथ यह करेंगे और उन्हें जीवित रहने देंगे[a], ताकि उस शपथ के कारण जो हमने उनसे खाई है, हम पर कोप[b] न आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्हें जीवित रखेंगे’ अथवा ‘उन्हें बख्श देंगे।’
    reason: lexical_alternative
  - marker: b
    text: प्रसंग में यह संभवतः परमेश्वर का कोप है, यद्यपि इब्रानी पाठ इस पद में स्पष्ट रूप से ‘यहोवा का कोप’ नहीं कहता।
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת נַעֲשֶׂה לָהֶם
  choice: हम उनके साथ यह करेंगे
  rationale: זֹאת प्रस्तावित कार्य की ओर संकेत करता है और नַעֲשֶׂה भावी संकल्प व्यक्त करता है। हिन्दी में ‘उनके साथ’ प्रभावित व्यक्तियों के संबंध में לָהֶם का स्वाभाविक रूप है।
- source_word: וְהַחֲיֵה אוֹתָם
  choice: उन्हें जीवित रहने देंगे
  rationale: חיה का हिफ़ील रूप यहाँ उन्हें न मारने, अर्थात जीवित रहने देने का भाव देता है। यह ‘उन्हें बचा छोड़ेंगे’ की अपेक्षा मूल क्रिया की जीवन-संबंधी छवि अधिक स्पष्ट रखता है।
- source_word: וְלֹא יִהְיֶה עָלֵינוּ קֶצֶף
  choice: ताकि हम पर कोप न आए
  rationale: प्रस्तावित कार्य के उद्देश्य या परिणाम को हिन्दी में ‘ताकि’ स्वाभाविक रूप से व्यक्त करता है। ‘हम पर ... आए’ עָלֵינוּ के साथ היה की चेतावनीपूर्ण अभिव्यक्ति को बनाए रखता है।
- source_word: קֶצֶף
  choice: कोप
  rationale: यह शब्द तीव्र क्रोध को सूचित करता है। ‘कोप’ प्रसंग की गंभीरता बनाए रखता है और अपने आप परमेश्वर को स्पष्ट कर्ता नहीं बनाता।
- source_word: עַל הַשְּׁבוּעָה אֲשֶׁר נִשְׁבַּעְנוּ לָהֶם
  choice: उस शपथ के कारण, जो हमने उनसे खाई है
  rationale: עַל यहाँ कारण बताता है। ‘शपथ खाना’ आधुनिक मानक हिन्दी में शपथ लेने की स्वाभाविक अभिव्यक्ति है; לָהֶם को इस संबंध में ‘उनसे’ से व्यक्त किया गया है।
theological_decisions:
- issue: शपथ तोड़ने के प्रसंग में קֶצֶף किसका कोप है
  choice: मुख्य पाठ में केवल ‘कोप’ रखा गया है
  alternative: ‘यहोवा का कोप’ या ‘परमेश्वर का कोप’
  rationale: प्रसंग में परमेश्वर का कोप अभिप्रेत होना संभवतः सही है, लेकिन इस पद के इब्रानी पाठ में परमेश्वर या यहोवा का नाम स्पष्ट रूप से नहीं है। इसलिए मुख्य पाठ मूल की अस्पष्टता बनाए रखता है और टिप्पणी में संभावित आशय बताता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। डैश मूल वाक्य के दूसरे खंड को पहले खंड में बताए गए कार्य की व्याख्या के रूप में स्पष्ट करते हैं, बिना उसे अलग वाक्य बनाए। ‘कोप’ गंभीर धार्मिक प्रसंग के अनुरूप है, पर मुख्य पाठ में उसके स्रोत को अनावश्यक रूप से स्पष्ट नहीं किया गया।
