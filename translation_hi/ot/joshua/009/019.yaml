source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ כָל הַ/נְּשִׂיאִים֙ אֶל כָּל הָ֣/עֵדָ֔ה אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ לָ/הֶ֔ם בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/עַתָּ֕ה לֹ֥א נוּכַ֖ל לִ/נְגֹּ֥עַ בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/019.yaml
  text: But all the leaders said to all the congregation[a], “We have sworn to them by Yahweh, the God of Israel, and now we cannot touch them.”
translation:
  language: hi
  text: लेकिन सभी प्रधानों ने पूरी सभा से कहा, “हमने इस्राएल के परमेश्वर याहवे की शपथ लेकर उनसे वचन दिया है; इसलिए अब हम उन्हें छू नहीं सकते[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें हानि नहीं पहुँचा सकते” अथवा “उन पर प्रहार नहीं कर सकते”; शाब्दिक अर्थ “उन्हें छू नहीं सकते” है।
    reason: नגע के शाब्दिक अर्थ और इस प्रसंग में उसके संभावित हानिकारक या आक्रामक अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: लेकिन ... ने कहा
  rationale: वाव-युक्त क्रिया मूलतः घटनाक्रम को आगे बढ़ाती है, पर प्रसंग में प्रधानों का कथन सभा की शिकायत के विपरीत उत्तर है; इसलिए ‘लेकिन’ स्वाभाविक विरोध-सूचक संबंध व्यक्त करता है।
- source_word: כָל הַנְּשִׂיאִים
  choice: सभी प्रधानों
  rationale: נָשִׂיא यहाँ इस्राएल के शासकीय प्रतिनिधियों या मुखियाओं को दर्शाता है; ‘प्रधान’ संक्षिप्त, प्रतिष्ठित और आधुनिक हिन्दी में स्पष्ट है।
- source_word: כָל הָעֵדָה
  choice: पूरी सभा
  rationale: עֵדָה इस्राएल के एकत्र समुदाय को सूचित करता है; ‘पूरी सभा’ उसके सामूहिक और समावेशी अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: נִשְׁבַּעְנוּ לָהֶם
  choice: हमने उनसे ... की शपथ खाई है
  rationale: निफ़अल रूप शपथ खाने को व्यक्त करता है। पूर्ण वर्तमान ‘खाई है’ उस पहले ली गई शपथ की अब भी जारी बाध्यता को दर्शाता है।
- source_word: בַּיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर याहवे की शपथ
  rationale: בְּ शपथ के प्रसंग में उस व्यक्ति को बताता है जिसके नाम की शपथ ली गई। रचना-क्रम को स्वाभाविक हिन्दी में रखते हुए परमेश्वर की पहचान और निज नाम दोनों सुरक्षित हैं।
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: शाब्दिक अर्थ ‘और अब’ है, किंतु यहाँ वर्तमान निष्कर्ष पहले ली गई शपथ से निकलता है; ‘इसलिए अब’ उस प्रसंगगत परिणाम को स्पष्ट करता है।
- source_word: לֹא נוּכַל
  choice: हम ... नहीं सकते
  rationale: יכל असमर्थता व्यक्त करता है। यहाँ शपथ के कारण नैतिक और व्यावहारिक असमर्थता दोनों निहित हैं; ‘नहीं सकते’ इस तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: לִנְגֹּעַ בָּהֶם
  choice: उन्हें छू
  rationale: נגע का मूल अर्थ ‘छूना’ है, जबकि प्रसंग में यह हानि पहुँचाने या आक्रमण करने का मुहावरा हो सकता है। मुख्य पाठ मूल बिंब रखता है और पादटिप्पणी प्रसंगगत अर्थ बताती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी पाठ में चतुरक्षरीय निज नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है और स्रोत के साथ पारदर्शिता बनाए रखता है।
- issue: शपथ से उत्पन्न असमर्थता का स्वरूप
  choice: हम ... नहीं सकते
  alternative: हमारे लिए ... करना उचित नहीं; हम ... नहीं करेंगे
  rationale: पाठ יכל द्वारा असमर्थता कहता है, किंतु प्रसंग में वह शपथजनित नैतिक बाध्यता है। चुना गया रूप इस दोहरे अर्थ को बनाए रखता है और उसे केवल नैतिक निषेध या केवल भविष्य के निश्चय में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रधान’, ‘पूरी सभा’ और ‘शपथ खाई है’ परिचित हिन्दी प्रयोग हैं। विरामचिह्न द्वारा शपथ और उसके वर्तमान परिणाम का संबंध स्पष्ट किया गया है।
