source:
  edition: WLC
  text: וְ/לֹ֤א הִכּוּ/ם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּֽי נִשְׁבְּע֤וּ לָ/הֶם֙ נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלֹּ֥נוּ כָל הָ/עֵדָ֖ה עַל הַ/נְּשִׂיאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/018.yaml
  text: But the sons of Israel did not strike them[a], because the leaders of the congregation had sworn to them by Yahweh, the God of Israel[c][b]. And all the congregation grumbled against the leaders.
translation:
  language: hi
  text: लेकिन इस्राएलियों[a] ने उन्हें नहीं मारा[b], क्योंकि समुदाय के प्रधानों ने याहवे, इस्राएल के परमेश्वर, की शपथ लेकर उनसे प्रतिज्ञा की थी। तब सारे समुदाय ने प्रधानों के विरुद्ध बड़बड़ाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘इस्राएल के पुत्रों’।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘उन पर आक्रमण नहीं किया’ या ‘उन्हें मार नहीं डाला’ भी हो सकता है। हिब्रानी क्रिया का अर्थ प्रसंग के अनुसार प्रहार करना, आक्रमण करना, या घातक रूप से मारना हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘कुड़कुड़ाया’ अथवा ‘शिकायत की’।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: हिब्रानी मुहावरे का शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर आधुनिक हिन्दी में पूरे समुदाय के लिए ‘इस्राएली’ अधिक स्वाभाविक और समावेशी है।
- source_word: הִכּוּם
  choice: उन्हें नहीं मारा
  rationale: נכה का मूल भाव प्रहार करना है और युद्ध-संदर्भ में यह आक्रमण करने या मार डालने तक का अर्थ दे सकता है। हिन्दी ‘मारा’ इस प्रसंग में उसी अर्थ-विस्तार को काफी हद तक खुला रखता है।
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: समुदाय के प्रधानों
  rationale: נְשִׂיאִים मान्य अगुओं या प्रधानों को और עֵדָה संगठित समुदाय को दर्शाता है। ‘प्रधान’ पद और अधिकार का भाव बनाए रखता है।
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: शपथ खाकर उनसे वचन दिया था
  rationale: यह हिन्दी में उस शपथ की बाध्यकारी और पारस्परिक प्रकृति को स्वाभाविक ढंग से व्यक्त करता है; पूर्वपूर्ण काल बताता है कि शपथ पहले ली जा चुकी थी।
- source_word: בַּיהוָה
  choice: याहवे की शपथ खाकर
  rationale: שׁבע के साथ बेत उस सत्ता को सूचित करता है जिसके नाम पर शपथ ली गई। दिव्य नाम יהוה को नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: וַיִּלֹּנוּ
  choice: कुड़कुड़ाया
  rationale: लून इस रूप में सामूहिक असंतोष और अगुओं के विरुद्ध बड़बड़ाने को व्यक्त करता है। ‘कुड़कुड़ाया’ आधुनिक हिन्दी में शिकायत-भरी प्रतिक्रिया को स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका अधिक निकट लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: עֵדָה के लिए सामुदायिक पद
  choice: समुदाय
  alternative: सभा; मंडली
  rationale: ‘समुदाय’ इस्राएल की संगठित सामूहिक देह का भाव देता है, पर बाद की किसी विशिष्ट कलीसियाई व्यवस्था को पाठ में नहीं लाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रधान’, ‘शपथ’ और ‘याहवे’ मूल पाठ की औपचारिक तथा वाचा-संबंधी गंभीरता बनाए रखते हैं; ‘मारा’ क्रिया मूल की संभावित अर्थ-सीमा को बिना अनावश्यक रूप से केवल ‘हत्या’ या केवल ‘आक्रमण’ तक सीमित किए प्रस्तुत करती है।
