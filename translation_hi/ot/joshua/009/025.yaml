source:
  edition: WLC
  text: וְ/עַתָּ֖ה הִנְ/נ֣וּ בְ/יָדֶ֑/ךָ כַּ/טּ֨וֹב וְ/כַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לַ/עֲשׂ֥וֹת לָ֖/נוּ עֲשֵֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/025.yaml
  text: And now[a], here we are in your hand. Do to us as it is good and right in your eyes to do.
translation:
  language: hi
  text: और अब, देखो, हम तुम्हारे हाथ में हैं। हमारे साथ जो करना तुम्हारी दृष्टि में अच्छा और सही हो, वही करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक וְ और काल-सूचक עַתָּה दोनों को रखते हुए यह गिबोनियों के वर्तमान समर्पण की ओर स्वाभाविक संक्रमण व्यक्त करता है।
- source_word: הִנְנוּ
  choice: देखो, हम
  rationale: यह वर्तमान स्थिति की ओर ध्यान खींचने वाली प्रस्तुति है। ‘देखो, हम’ उसके संकेतात्मक बल को आधुनिक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: בְיָדֶךָ
  choice: तुम्हारे हाथ में
  rationale: मूल इब्रानी रूपक को सुरक्षित रखता है, जिसका आशय किसी के अधिकार या नियंत्रण में होना है; हिन्दी में भी यह बोधगम्य है।
- source_word: כַּטּוֹב וְכַיָּשָׁר
  choice: अच्छा और सही
  rationale: טוֹב और יָשָׁר के सामान्य अर्थों को सीधे व्यक्त करता है और नैतिक तथा व्यावहारिक निर्णय—दोनों की गुंजाइश बनाए रखता है।
- source_word: בְּעֵינֶיךָ
  choice: तुम्हारी दृष्टि में
  rationale: इब्रानी के ‘तुम्हारी आँखों में’ मुहावरे का स्वाभाविक हिन्दी समतुल्य है और निर्णय का अधिकार यहोशू के पास होने का भाव रखता है।
- source_word: לַעֲשׂוֹת לָנוּ עֲשֵׂה
  choice: हमारे साथ जो करना ... हो, वही करो
  rationale: क्रिया עשה की पुनरावृत्ति और निवेदन की बलयुक्त संरचना को स्वाभाविक हिन्दी में यथासंभव बनाए रखता है।
theological_decisions: []
