  register: आधुनिक मानक हिन्दी; वाक्य विनम्र, गंभीर और समर्पणपूर्ण है। ‘तुम्हारे हाथ में’ तथा ‘तुम्हारी दृष्टि में’ मूल इब्रानी बिंबों को रखते हैं, जबकि अंतिम उपवाक्य हिन्दी में स्वाभाविक बनाया गया है।
