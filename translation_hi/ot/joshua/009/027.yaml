source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/ם יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא חֹטְבֵ֥י עֵצִ֛ים וְ/שֹׁ֥אֲבֵי מַ֖יִם לָֽ/עֵדָ֑ה וּ/לְ/מִזְבַּ֤ח יְהוָה֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר יִבְחָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/027.yaml
  text: So Joshua made them woodcutters and water carriers on that day for the congregation and for the altar of Yahweh[a], to this day, in the place that he would choose.
translation:
  language: hi
  text: उस दिन यहोशू ने उन्हें मंडली के लिए और याहवे की वेदी के लिए लकड़ी काटनेवाले और पानी भरनेवाले ठहरा दिया, और वे आज तक उस स्थान पर हैं जिसे वह चुनेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: उन्हें ... ठहरा दिया
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है, पर विधेय रूप में आए कामगार-सूचक कृदंतों के साथ यहाँ इसका अर्थ किसी सेवा के लिए नियुक्त या निर्धारित करना है।
- source_word: חֹטְבֵי עֵצִים
  choice: लकड़ी काटनेवाले
  rationale: यह सहभागी पद लकड़ी काटने का काम करनेवालों को दर्शाता है; आधुनिक हिन्दी में यह सहज और स्पष्ट है।
- source_word: וְשֹׁאֲבֵי מַיִם
  choice: पानी भरनेवाले
  rationale: שאב का अर्थ कुएँ या जलस्रोत से पानी निकालना/भरना है। ‘पानी भरनेवाले’ हिन्दी में इस श्रम-भूमिका को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָעֵדָה
  choice: मंडली के लिए
  rationale: עֵדָה इस्राएल के संगठित सामुदायिक समूह को सूचित करता है; ‘मंडली’ उसके सामूहिक और उपासना-संबंधी रंग को बनाए रखता है।
- source_word: וּלְמִזְבַּח יְהוָה
  choice: और याहवे की वेदी के लिए
  rationale: यह वेदी से जुड़ी सेवा को दर्शाता है और इब्रानी संबंध-विन्यास को स्वाभाविक हिन्दी में रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह इब्रानी मुहावरा वर्णित व्यवस्था के लेखक के समय तक जारी रहने को व्यक्त करता है।
- source_word: אֶל הַמָּקוֹם אֲשֶׁר יִבְחָר
  choice: उस स्थान पर जिसे वह चुनेगा
  rationale: אֶל को प्रसंगानुसार सेवा के स्थल के अर्थ में ‘पर’ किया गया है। יבחר का भविष्याभिमुख रूप कथा के उस समय से आगे होनेवाले चुनाव को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: ‘जिसे वह चुनेगा’ में कर्ता का संदर्भ
  choice: सर्वनाम ‘वह’ बनाए रखा गया; प्रसंग में इसका संकेत याहवे की ओर है
  alternative: ‘जिसे याहवे चुनेगा’ अथवा कर्मवाच्य ‘जो चुना जाएगा’
  rationale: इब्रानी में कर्ता सर्वनाम के भीतर निहित है। व्यक्तिगत सर्वनाम बनाए रखने से मूल अभिव्यक्ति और पवित्रस्थान के चुनाव में परमेश्वर की सक्रिय भूमिका दोनों सुरक्षित रहते हैं।
- issue: אֶל הַמָּקוֹם का संबंध
  choice: ‘उस स्थान पर’—सेवा के स्थल के रूप में
  alternative: ‘उस स्थान के लिए’
  rationale: प्रसंग वेदी की सेवा कहाँ होगी, इसे सूचित करता है; फिर भी אֶל के लक्ष्यसूचक अर्थ के कारण वैकल्पिक संबंध पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘ठहरा दिया’ नियुक्ति का अर्थ देता है; डैश मूल वाक्य के अंतिम काल-स्थान संबंधी पदों को बिना अतिरिक्त क्रिया जोड़े जोड़ता है।
