source:
  edition: WLC
  text: וַ/יִּקְח֥וּ הָֽ/אֲנָשִׁ֖ים מִ/צֵּידָ֑/ם וְ/אֶת פִּ֥י יְהוָ֖ה לֹ֥א שָׁאָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/014.yaml
  text: So the men took some of their provisions[a], but did not ask for the counsel of Yahweh.
translation:
  language: hi
  text: तब उन लोगों ने उनकी रसद में से कुछ ले लिया, पर याहवे से परामर्श नहीं किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे का मुँह”; अर्थात् उसका निर्देश या निर्णय।
    reason: मूल हिब्रू मुहावरे के शाब्दिक रूप और उसके संदर्भगत अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: ले लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है। यहाँ गिबोनियों की रसद में से कुछ लेकर उसकी जाँच या प्रमाण के रूप में स्वीकार करने की ठोस क्रिया बनी रहती है।
- source_word: הָאֲנָשִׁים
  choice: उन पुरुषों ने
  rationale: मूल पाठ केवल ‘पुरुषों’ कहता है। संदर्भ से वे इस्राएली प्रतिनिधि हैं, पर पद में ‘अगुवे’ या ‘इस्राएली’ जोड़ना आवश्यक नहीं।
- source_word: מִצֵּידָם
  choice: उनकी रसद में से कुछ
  rationale: צֵיד यात्रा के लिए रखे भोजन या सामग्री को दर्शाता है। उपसर्ग מִן यहाँ अंशवाचक है, इसलिए ‘में से कुछ’ मूल अर्थ को स्पष्ट करता है।
- source_word: פִּי יְהוָה
  choice: याहवे की सम्मति
  rationale: शाब्दिक रूप ‘याहवे का मुँह’ है, पर यह उसकी ओर से मिलने वाले निर्देश या निर्णय के लिए मुहावरा है। ‘सम्मति’ अर्थ को स्वाभाविक और संक्षिप्त हिंदी में व्यक्त करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय ‘याहवे’ रूप में लिप्यंतरित किया गया है।
- source_word: לֹא שָׁאָלוּ
  choice: नहीं पूछी
  rationale: שׁאל का सामान्य अर्थ ‘पूछना’ या ‘जानना चाहना’ है। स्त्रीलिंग क्रिया ‘पूछी’ का संबंध ‘सम्मति’ से है और वाक्य स्वाभाविक रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है; इसलिए उसे उपाधि से प्रतिस्थापित किए बिना हिंदी में लिप्यंतरित किया गया है।
- issue: פִּי יְהוָה मुहावरे का अर्थ
  choice: याहवे की सम्मति
  alternative: याहवे का मुँह; याहवे का वचन; याहवे का निर्णय
  rationale: ‘मुँह’ शाब्दिक रूप है, किंतु संदर्भ में आशय याहवे से निर्देश या निर्णय पूछने का है। ‘सम्मति’ इस मुहावरे का अर्थ बताती है, पर उसे किसी विशेष प्रकार की भविष्यवाणी या आज्ञा तक सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘रसद’ यात्रा के भोजन और सामग्री दोनों को समेटती है; ‘सम्मति पूछी’ संक्षिप्त रूप से ईश्वरीय मार्गदर्शन न लेने की बात व्यक्त करता है।
