base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/001.yaml
  text: And it happened[a], when all the kings who were beyond the Jordan—in the hill country, in the lowland, and along the whole coast of the Great Sea toward Lebanon—the Hittite, the Amorite, the Canaanite, the Perizzite, the Hivite, and the Jebusite—heard of it[c][b],
translation:
  language: hi
  text: और ऐसा हुआ कि जब उन सभी राजाओं ने, जो यरदन के पार[a] पहाड़ी प्रदेश में, निचले प्रदेश[b] में और लबानोन की दिशा में महासमुद्र के पूरे तट पर थे—अर्थात् हित्ती, एमोरी, कनानी, परिज्जी, हिव्वी और यबूसी राजाओं ने—यह समाचार सुना[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यरदन के उस पार।” इब्रानी पदबंध का अनुवाद भौगोलिक दृष्टिकोण के अनुसार दोनों प्रकार से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “शफेला में,” अर्थात पश्चिमी तलहटी वाले प्रदेश में।
    reason: cultural_note
  - marker: c
    text: मूल इब्रानी में केवल “ने सुना” है; क्या सुना, यह स्पष्ट नहीं कहा गया। “यह समाचार” आस-पास के संदर्भ से जोड़ा गया है।
    reason: lexical_alternative
