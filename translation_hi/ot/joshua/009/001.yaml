- source_word: כָּל הַמְּלָכִים
  choice: सभी राजाओं
  rationale: परिमाण और संज्ञा को सीधे तथा स्वाभाविक हिन्दी में रखा गया है।
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार ... रहनेवाले
  rationale: בְּעֵבֶר का अर्थ दृष्टिकोण के अनुसार ‘पार’ या ‘उस पार’ हो सकता है; मुख्य पाठ में भौगोलिक दिशा को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: בָּהָר
  choice: पहाड़ी प्रदेश में
  rationale: यहाँ הַר किसी एक पहाड़ के बजाय मध्यवर्ती ऊँचे भूभाग को दर्शाता है।
- source_word: וּבַשְּׁפֵלָה
  choice: निचले प्रदेश में
  rationale: שְׁפֵלָה पश्चिमी तलहटी वाले विशिष्ट भूभाग का नाम/वर्णन है। पारदर्शी हिन्दी मुख्य पाठ में है और पारंपरिक नाम पाद-टिप्पणी में दिया गया है।
- source_word: וּבְכֹל חוֹף הַיָּם הַגָּדוֹל
  choice: महासमुद्र के पूरे तट पर
  rationale: חוֹף तट है और הַיָּם הַגָּדוֹל भूमध्य सागर का इब्रानी पदनाम ‘महासमुद्र’ है।
- source_word: אֶל מוּל הַלְּבָנוֹן
  choice: लबानोन की दिशा में
  rationale: यह पदबंध लबानोन के सापेक्ष दिशा या स्थिति बताता है; चयन उस स्थानिक संबंध को बिना अत्यधिक निर्धारण के व्यक्त करता है।
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: हित्ती, एमोरी, कनानी, परिज्जी, हिव्वी और यबूसी राजाओं
  rationale: एकवचन जातिवाचक रूप सामूहिक अर्थ रखते हैं। ‘राजाओं’ की पुनरावृत्ति हिन्दी में यह स्पष्ट करती है कि सूची उन सभी राजाओं के जातीय/राजनीतिक समूहों को निर्दिष्ट करती है।
