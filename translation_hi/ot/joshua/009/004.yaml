- source_word: גַם הֵמָּה
  choice: उन्होंने भी
  rationale: यह पदबंध बताता है कि गिबोनियों ने भी, अन्य लोगों की तरह, परिस्थिति के प्रत्युत्तर में कार्रवाई की।
- source_word: בְּעָרְמָה
  choice: चालाकी से
  rationale: यहाँ संज्ञा का अर्थ चतुराई या धूर्तता है; कथा के छलपूर्ण संदर्भ में ‘चालाकी से’ स्वाभाविक है और आवश्यकता से अधिक नैतिक व्याख्या नहीं जोड़ता।
- source_word: וַיִּצְטַיָּרוּ
  choice: अपना वेश बदल लिया
  rationale: यह कठिन और दुर्लभ क्रियारूप है। आगे वर्णित पुरानी वस्तुओं के माध्यम से दूर देश के यात्रियों जैसा रूप बनाने के संदर्भ में यह अर्थ कथा-प्रवाह के अनुकूल है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: שַׂקִּים בָּלִים
  choice: घिसे-पिटे बोरे
  rationale: שַׂקִּים मोटे सामान ढोने वाले बोरों को और בָּלִים उपयोग या आयु से जीर्ण अवस्था को दर्शाता है।
- source_word: לַחֲמוֹרֵיהֶם
  choice: अपने गधों के लिए
  rationale: पूर्वसर्ग इन बोरों का गधों के साथ उपयोग-संबंध व्यक्त करता है; हिन्दी में यह सीधा और स्वाभाविक है।
- source_word: נֹאדוֹת יַיִן
  choice: मदिरा की मशकें
  rationale: चमड़े के उन पात्रों के लिए ‘मशकें’ प्रचलित हिन्दी शब्द है जिनमें मदिरा रखी जाती थी।
- source_word: מְבֻקָּעִים
  choice: फटी हुई
  rationale: בקע से बना यह कर्मवाच्य कृदन्त चिरने या फटने की भौतिक अवस्था बताता है।
- source_word: מְצֹרָרִים
  choice: बाँधकर सुधारी गई
  rationale: यह कृदन्त सम्भवतः फटी मशकों को बाँध देने का संकेत करता है। अनुवाद मरम्मत के उद्देश्य और बाँधने की विधि दोनों को स्पष्ट रखता है।
