base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/004.yaml
  text: They too acted with cunning[a], and went and made provisions, and took worn-out sacks for their donkeys, and worn-out wineskins[b], split open and patched.
translation:
  language: hi
  text: उन्होंने भी चालाकी से काम किया; वे गए और भेस बनाया[a]। उन्होंने अपने गधों के लिए घिसे-पिटे बोरे और मदिरा-मशकें लीं, जो घिसी-पिटी, फटी हुई और बाँधी हुई थीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने लिए रसद तैयार की”; सम्भवतः, “दूतों का रूप धारण किया।” इब्रानी क्रिया וַיִּצְטַיָּרוּ कठिन है और इसके एक से अधिक अर्थ समझे गए हैं। यहाँ छलपूर्ण रूप बनाने का संदर्भ “भेस बनाया” अर्थ का समर्थन करता है।
    reason: alternative_reading
  - marker: b
    text: या, “बँधी हुई” या “कसी हुई।” आशय सम्भवतः उन मशकों से है जिन्हें फटने के बाद बाँधकर फिर उपयोग के योग्य बनाया गया था।
    reason: lexical_alternative
