base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/026.yaml
  text: So he did this for them[a], and he delivered them from the hand of the sons of Israel, and they did not kill them.
translation:
  language: hi
  text: तब उसने उनके लिए ऐसा ही किया और उन्हें इस्राएल के पुत्रों[a] के हाथ से बचाया, और उन्होंने उन्हें नहीं मारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों।” इब्रानी में “इस्राएल के पुत्रों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: तब उसने उनके साथ ऐसा ही किया
  rationale: עשה ל... כן का अर्थ ‘उनके साथ ऐसा ही करना’ है। ‘तब’ कथानक की क्रमिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּצֵּל אֹתָם
  choice: उन्हें ... बचाया
  rationale: हिफ़ील रूप וַיַּצֵּל यहाँ किसी के हाथ या अधिकार से छुड़ाने अथवा बचाने का अर्थ देता है; वर्तमान सन्दर्भ में ‘बचाया’ सहज और सटीक है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: मूल पाठ में शक्ति या अधिकार का ठोस रूपक ‘हाथ से’ है, जिसे हिन्दी में भी स्वाभाविक रूप से रखा जा सकता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पद का निकट और बोधगम्य रूप है। प्रचलित राष्ट्रीय अर्थ ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: וְלֹא הֲרָגוּם
  choice: और उन्होंने उन्हें नहीं मारा
  rationale: הרג का सीधा अर्थ ‘मारना’ है। बहुवचन कर्ता निकटवर्ती ‘इस्राएल के पुत्रों’ की ओर संकेत करता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל में लिंगसूचक सामूहिक पदनाम
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल पद का व्याकरणिक रूप स्पष्टतः पुल्लिंग बहुवचन है, इसलिए मुख्य पाठ में उसे बनाए रखा गया है; फिर भी यह एक प्रचलित राष्ट्रीय पदनाम है, अतः उसके सामान्य अर्थ को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। वाक्य में मूल इब्रानी की क्रमिक संयोजक संरचना रखी गई है; अर्धविराम अंतिम उपवाक्य के बहुवचन कर्ता को स्पष्ट पढ़ने में सहायता देता है।
