  yaml_path: translation/ot/joshua/009/005.yaml
  text: They had worn-out and patched sandals on their feet[a], and worn-out clothes on themselves; and all the bread of their provision was dry and crumbly.
translation:
  language: hi
  text: उनके पैरों में घिसी हुई और पैबंद लगी जूतियाँ थीं, और उनके शरीर पर घिसे हुए कपड़े थे। उनकी यात्रा की खाद्य-सामग्री की सारी रोटी सूखी और टुकड़े-टुकड़े हुई थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फफूँदी लगी हुई।” यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है। सम्भवतः इसका अर्थ है कि रोटी सूखी और टुकड़े-टुकड़े हुई थी; कुछ इसे “फफूँदी लगी हुई” समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָלוֹת
  choice: जूतियाँ
  rationale: यह प्राचीन निकट-पूर्व के पैरों में पहने जाने वाले साधारण पादत्राण को दर्शाता है; आधुनिक हिन्दी में ‘जूतियाँ’ सहज और ठोस है।
- source_word: בָּלוֹת
  choice: घिसी हुई / घिसे हुए
  rationale: शब्द उपयोग और पुरानापन से खराब हो चुकी दशा बताता है, केवल पुराना होना नहीं।
- source_word: מְטֻלָּאוֹת
  choice: पैबंद लगी
  rationale: निष्क्रिय कृदन्त पैबंद लगाकर मरम्मत किए जाने की दशा व्यक्त करता है।
- source_word: שְׂלָמוֹת
  choice: कपड़े
  rationale: सामान्य वस्त्रों के लिए आधुनिक, स्वाभाविक और सर्वसुलभ शब्द।
- source_word: לֶחֶם צֵידָם
  choice: उनकी यात्रा के लिए रखा सारा भोजन
  rationale: लֶחֶם का मूल अर्थ रोटी है, पर צֵידָם के साथ यह यात्रा की खाद्य-सामग्री को सूचित करता है; इस प्रसंग में हिन्दी का ‘भोजन’ समग्र आशय सहजता से देता है।
- source_word: יָבֵשׁ הָיָה
  choice: सूखा ... हो गया था
  rationale: वर्णित वर्तमान दशा के साथ उस दशा तक पहुँचने का भाव प्रसंग में स्वाभाविक हिन्दी से व्यक्त होता है।
- source_word: נִקֻּדִים
  choice: चूर-चूर
  rationale: यह दुर्लभ शब्द अनिश्चित है; प्रसंग में सूखी रोटी के टूटकर टुकड़े हो जाने का अर्थ सम्भव है। वैकल्पिक ‘फफूँदी लगी’ अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
