lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: वे इकट्ठे हुए
  rationale: निफ़अल रूप सामूहिक रूप से एकत्र होने को व्यक्त करता है; यह आधुनिक हिन्दी में सहज और अर्थनिष्ठ है।
- source_word: יַחְדָּו
  choice: एक साथ
  rationale: यह क्रियाविशेषण संयुक्त कार्रवाई पर बल देता है और इकट्ठे होने के भाव को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: לְהִלָּחֵם
  choice: ताकि ... लड़ें
  rationale: लामेद सहित निफ़अल infinitive यहाँ उद्देश्य बताता है; हिन्दी में उद्देश्यवाचक उपवाक्य सहज है।
- source_word: עִם יְהוֹשֻׁעַ וְעִם יִשְׂרָאֵל
  choice: यहोशू और इस्राएल से
  rationale: युद्धवाचक क्रिया के साथ עִם विरोधी पक्ष को दर्शाता है। हिन्दी में ‘से लड़ना’ स्वाभाविक है; दोनों नामों को जोड़कर अनावश्यक पुनरावृत्ति से बचा गया है।
- source_word: פֶּה אֶחָד
  choice: एकमत होकर
  rationale: शाब्दिक अर्थ ‘एक मुँह’ है, पर यह मुहावरा पूर्ण सहमति और एक उद्देश्य से कार्य करने का भाव देता है।
