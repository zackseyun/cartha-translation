  text: וַ/יַּעֲנ֨וּ אֶת יְהוֹשֻׁ֜עַ וַ/יֹּאמְר֗וּ כִּי֩ הֻגֵּ֨ד הֻגַּ֤ד לַ/עֲבָדֶ֨י/ךָ֙ אֵת֩ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ לָ/תֵ֤ת לָ/כֶם֙ אֶת כָּל הָ/אָ֔רֶץ וּ/לְ/הַשְׁמִ֛יד אֶת כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶ֑ם וַ/נִּירָ֨א מְאֹ֤ד לְ/נַפְשֹׁתֵ֨י/נוּ֙ מִ/פְּנֵי/כֶ֔ם וַֽ/נַּעֲשֵׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/024.yaml
  text: 'They answered Joshua and said[a], “Because it was clearly told to your servants what Yahweh your God commanded his servant Moses: to give you all the land and to destroy all the inhabitants of the land before you. So we feared greatly for our lives because of you, and we did this thing.”'
translation:
  language: hi
  text: उन्होंने यहोशू को उत्तर देकर कहा, “आपके सेवकों को साफ़-साफ़ बताया गया था[a] कि आपके परमेश्वर याहवे ने अपने सेवक मूसा को आज्ञा दी थी कि वह आपको यह सारा देश दे और आपके सामने से इस देश के सभी निवासियों का नाश कर दे। इसलिए हमें आपके कारण अपने प्राणों का बहुत डर लगा, और हमने यह काम किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपके सेवकों को निश्चय ही बताया गया था।” हिब्रू में बल देने के लिए क्रिया के साथ उसी धातु का इन्फिनिटिव ऐब्सोल्यूट प्रयुक्त हुआ है।
    reason: मूल हिब्रू की बलात्मक रचना और उसके वैकल्पिक अनुवाद को बताना।
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ
  choice: उन्होंने यहोशू को उत्तर दिया
  rationale: संवाद में प्रत्युत्तर का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है; अगले सामान्य वाक्-परिचायक को अलग से दोहराना आवश्यक नहीं है।
- source_word: הֻגֵּד הֻגַּד
  choice: साफ़-साफ़ बताया गया था
  rationale: इन्फिनिटिव ऐब्सोल्यूट और सीमित निष्क्रिय क्रिया के संयोजन का बल हिन्दी के स्वाभाविक द्विरुक्ति-प्रयोग से व्यक्त होता है।
- source_word: לַעֲבָדֶיךָ
  choice: आपके सेवकों को
  rationale: यह गिबोनियों का अपने लिए विनम्र राजनयिक संबोधन है, दासत्व पर विशेष बल नहीं।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: आपके परमेश्वर यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को लिप्यंतरित करके रखा गया है और सम्बोधन में आदरसूचक हिन्दी अपनाई गई है।
- source_word: לָתֵת לָכֶם אֶת־כָּל־הָאָרֶץ
  choice: तुम्हें यह सारा देश दे
  rationale: आज्ञा की विषयवस्तु में इस्राएल समूह के लिए मूल बहुवचन को बनाए रखते हुए הָאָרֶץ को प्रसंगानुसार 'देश' कहा गया है।
- source_word: וּלְהַשְׁמִיד
  choice: और ... नाश कर दे
  rationale: मूल क्रिया के प्रबल विनाशार्थ को स्पष्ट रखता है, बिना आधुनिक अतिरिक्त अर्थ आरोपित किए।
- source_word: מִפְּנֵיכֶם
  choice: तुम्हारे सामने से
  rationale: यहाँ निवासियों को इस्राएल की उपस्थिति और आगे बढ़ने के मार्ग से हटा देने का स्थानिक भाव सुरक्षित रहता है।
- source_word: וַנִּירָא מְאֹד לְנַפְשֹׁתֵינוּ
  choice: हमें ... अपने प्राणों का बहुत डर लगा
  rationale: जीवन के लिए तीव्र भय को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַנַּעֲשֶׂה אֶת־הַדָּבָר הַזֶּה
  choice: हमने यह काम किया
  rationale: हिब्रू के सामान्य 'यह बात/काम' मुहावरे को प्रसंगानुकूल सहज हिन्दी दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में आए चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप द्वारा स्पष्ट रखा गया है।
- issue: विनाश की आज्ञा की अभिव्यक्ति
  choice: इस देश के सभी निवासियों का नाश कर दे
  alternative: इस देश में रहनेवाले सब लोगों को मिटा दे
  rationale: वक्ता द्वारा मूसा को दी गई आज्ञा के वर्णन को बिना नरम किए रखा गया है; पद स्वयं उसके नैतिक या धर्मवैचारिक तनाव की व्याख्या नहीं करता।
- issue: צִוָּה का काल-संबंध
  choice: आज्ञा दी थी
  alternative: आज्ञा दी
  rationale: हिब्रू परिपूर्ण क्रिया अपने आप में प्लूपरफेक्ट निर्धारित नहीं करती, पर हिन्दी में पहले दी जा चुकी आज्ञा और बाद में उसके समाचार मिलने का क्रम 'दी थी' से स्वाभाविक रूप से स्पष्ट होता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। यहोशू के लिए आदरसूचक ‘आप’, पर उसके कथन में इस्राएल समुदाय के लिए बहुवचन ‘तुम’ रखा गया है। ‘साफ़-साफ़’ बलात्मक हिब्रू को सहज हिन्दी में सामने लाता है।
