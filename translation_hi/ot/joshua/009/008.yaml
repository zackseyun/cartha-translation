translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली। गिबोनियों की विनम्र संबोधन-भंगिमा दिखाने के लिए वे यहोशू से ‘आप’ कहते हैं, जबकि अधिकारपूर्ण प्रत्युत्तर में यहोशू उनसे ‘तुम’ कहते हैं।
