base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/008.yaml
  text: They said to Joshua[a], “We are your servants.” Then Joshua said to them, “Who are you, and where do you come from?”
translation:
  language: hi
  text: उन्होंने यहोशू से कहा, “हम आपके सेवक[a] हैं।” तब यहोशू ने उनसे कहा, “तुम कौन हो और कहाँ से आए हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपके दास।” इब्रानी शब्द עֲבָדֶיךָ का अर्थ “आपके सेवक” या “आपके दास” दोनों हो सकता है। यहाँ बोलने वाले कूटनीतिक विनम्रता से अपने को अधीनस्थ बता रहे हैं, इसलिए मुख्य पाठ में “सेवक” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: आपके सेवक
  rationale: עֶבֶד का अर्थ संदर्भ के अनुसार ‘सेवक’ या ‘दास’ हो सकता है। यहाँ गिबोनी कूटनीतिक विनम्रता से अपने को अधीनस्थ याचकों के रूप में प्रस्तुत कर रहे हैं; इसलिए मुख्य पाठ में ‘सेवक’ स्वाभाविक है, जबकि ‘दास’ की वास्तविक शाब्दिक संभावना पाद-टिप्पणी में रखी गई है।
- source_word: אֲנָחְנוּ
  choice: हम ... हैं
  rationale: इब्रानी नामवाचक वाक्य में स्पष्ट संयोजक क्रिया नहीं है; स्वाभाविक हिन्दी के लिए ‘हैं’ जोड़ा गया है।
- source_word: מִי אַתֶּם
  choice: तुम कौन हो
  rationale: प्रश्नवाचक מִי और सर्वनाम אַתֶּם का सीधा और स्वाभाविक हिन्दी रूप; स्रोत में न होने वाला कोई संज्ञा-पद नहीं जोड़ा गया।
- source_word: וּמֵאַיִן תָּבֹאוּ
  choice: और कहाँ से आए हो
  rationale: מֵאַיִן उद्गम पूछता है। इस प्रसंग में בוא का अपूर्ण रूप हिन्दी में आगमन और मूल स्थान दोनों को स्वाभाविक रूप से व्यक्त करने वाले ‘कहाँ से आए हो’ से प्रस्तुत किया गया है।
- source_word: וַיֹּאמְרוּ / וַיֹּאמֶר
  choice: उन्होंने ... कहा / तब यहोशू ने ... कहा
  rationale: वाव-क्रमिक कथा-प्रवाह को स्वाभाविक हिन्दी भूतकाल में रखा गया है; ‘तब’ वक्ता-परिवर्तन और कथात्मक क्रम स्पष्ट करता है।
