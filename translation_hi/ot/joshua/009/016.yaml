source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קְצֵה֙ שְׁלֹ֣שֶׁת יָמִ֔ים אַחֲרֵ֕י אֲשֶׁר כָּרְת֥וּ לָ/הֶ֖ם בְּרִ֑ית וַֽ/יִּשְׁמְע֗וּ כִּי קְרֹבִ֥ים הֵם֙ אֵלָ֔י/ו וּ/בְ/קִרְבּ֖/וֹ הֵ֥ם יֹשְׁבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/016.yaml
  text: And it happened at the end of three days, after they had made a covenant with them, that they heard that they were near to them and were living among them.
translation:
  language: hi
  text: उनके साथ वाचा बाँधने के तीन दिन पूरे होने पर इस्राएलियों ने सुना कि वे उनके निकट हैं और उनके बीच बसे हुए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְצֵה שְׁלֹשֶׁת יָמִים
  choice: तीन दिन बाद
  rationale: इब्रानी पदबंध का स्वाभाविक आधुनिक हिन्दी रूप; इसका अर्थ तीन दिनों की अवधि पूरी होने पर है।
- source_word: כָּרְתוּ לָהֶם בְּרִית
  choice: उनके साथ वाचा बाँधने
  rationale: כרת ברית का पारंपरिक और अर्थ-सटीक हिन्दी मुहावरा ‘वाचा बाँधना’ है; לָהֶם यहाँ दूसरे पक्ष के साथ संबंध व्यक्त करता है।
- source_word: קְרֹבִים הֵם אֵלָיו
  choice: वे उनके निकट ही रहते हैं
  rationale: ‘निकट’ को अगले निवास-वाक्यांश के साथ पढ़ते हुए स्थानीय निकटता व्यक्त की गई है; ‘ही’ धोखे के खुलासे पर बल को स्वाभाविक हिन्दी में उभारता है।
- source_word: וּבְקִרְבּוֹ הֵם יֹשְׁבִים
  choice: और उनके बीच में बसे हुए हैं
  rationale: בקרבו का सामूहिक एकवचन इस्राएल की सामुदायिक सीमा के भीतर रहने को दर्शाता है; ‘बसे हुए’ ישבים की स्थायी निवास-संबंधी छाया रखता है।
theological_decisions:
- issue: सर्वनाम אֵלָיו और בְּקִרְבּוֹ का संदर्भ
  choice: दोनों को सामूहिक रूप से इस्राएलियों के संदर्भ में ‘उनके’ किया गया
  alternative: एकवचन रूप ‘उसके निकट’ और ‘उसके बीच’ रखना
  rationale: इब्रानी में सामूहिक इस्राएल के लिए एकवचन सर्वनाम आ सकता है; आधुनिक हिन्दी में बहुवचन संदर्भ स्पष्ट और स्वाभाविक है, बिना अर्थ बदलने के।
- issue: कर्ता की स्पष्टता
  choice: וַיִּשְׁמְעוּ के निहित कर्ता को ‘इस्राएलियों’ के रूप में स्पष्ट किया गया
  alternative: केवल ‘उन्होंने सुना’
  rationale: पिछले प्रसंग के आधार पर कर्ता इस्राएली हैं; हिन्दी में लगातार आने वाले ‘वे/उनके’ से उत्पन्न भ्रम दूर करने के लिए नाम स्पष्ट करना आवश्यक है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वाचा’ बाइबलीय संदर्भ में प्रचलित तथा मूल בְּרִית के लिए सटीक है। कोई पादटिप्पणी आवश्यक नहीं।
