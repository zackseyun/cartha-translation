reference: Joshua 9:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יֹשְׁבֵ֨י גִבְע֜וֹן שָׁמְע֗וּ אֵת֩ אֲשֶׁ֨ר עָשָׂ֧ה יְהוֹשֻׁ֛עַ לִֽ/ירִיח֖וֹ וְ/לָ/עָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/003.yaml
  text: But the inhabitants of Gibeon heard what Joshua had done to Jericho and to Ai[a].
translation:
  language: hi
  text: परन्तु गिबोन के निवासियों ने सुना कि यहोशू ने यरीहो और ऐ के साथ क्या किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और गिबोन के निवासियों ने सुना कि यहोशू ने यरीहो और ऐ के साथ क्या किया था।”
    reason: आरम्भिक וְ का शाब्दिक समन्वयकारी अर्थ ‘और’ भी सम्भव है।
lexical_decisions:
- source_word: וְ/יֹשְׁבֵי
  choice: परन्तु ... के निवासियों ने
  rationale: 'יֹשְׁבֵי का सीधा अर्थ ‘निवासी’ है। आरम्भिक וְ को प्रसंग में विपरीत प्रतिक्रिया दिखाने के लिए ‘परन्तु’ किया गया है: पहले राजाओं ने युद्ध के लिए गठबंधन किया, जबकि गिबोन के लोगों ने अलग उपाय अपनाया।'
- source_word: גִבְעוֹן
  choice: गिबोन
  rationale: स्थाननाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: שָׁמְעוּ
  choice: सुना
  rationale: काल रूप यहाँ सीधे ‘सुना’ अर्थ देता है; यह ‘पता चला’ से अधिक स्रोत-निकट है और हिन्दी में स्वाभाविक है।
- source_word: אֵת אֲשֶׁר
  choice: कि ... क्या
  rationale: यह रचना सुनी गई बात की विषयवस्तु प्रस्तुत करती है। हिन्दी में ‘सुना कि ... क्या किया था’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָשָׂה
  choice: क्या किया था
  rationale: עָשָׂה का सामान्य अर्थ ‘करना’ है। ‘किया था’ सुनने से पहले पूरी हो चुकी कार्रवाइयों को हिन्दी कथन में स्पष्ट करता है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: לִֽ/ירִיחוֹ
  choice: यरीहो ... के साथ
  rationale: ל यहाँ नगर पर लक्षित कार्रवाई बताता है। ‘के साथ क्या किया’ हिन्दी में स्वाभाविक रहते हुए ‘के विरुद्ध’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: וְ/לָ/עָי
  choice: और ऐ के साथ
  rationale: पहले नगर के समानान्तर रचना को बनाए रखा गया है; ऐ स्थाननाम का प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: पद के आरम्भ में וְ का अनुवाद
  choice: परन्तु
  alternative: और
  rationale: यह सिद्धान्तगत नहीं, कथाविन्यास का निर्णय है। मूल संयोजक सामान्यतः ‘और’ हो सकता है, पर यहाँ 9:1–2 के राजाओं की प्रतिक्रिया से गिबोन की भिन्न प्रतिक्रिया की ओर मोड़ है; इसलिए ‘परन्तु’ प्रसंगगत विरोध को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘निवासियों’ स्रोत के निकट और सामान्यतः बोधगम्य है; ‘के साथ क्या किया’ लक्षित कार्रवाई को बिना अनावश्यक सैन्य व्याख्या के व्यक्त करता है।
