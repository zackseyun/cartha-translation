base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/009.yaml
  text: And they said to him[a], “Your servants have come from a very distant land for the name of Yahweh your God, for we have heard of his fame and all that he did in Egypt.”
translation:
  language: hi
  text: और उन्होंने उससे कहा, “तेरे सेवक बहुत दूर के देश से तेरे परमेश्वर याहवे के नाम के कारण आए हैं, क्योंकि हमने उसकी कीर्ति[a] और वह सब सुना है जो उसने मिस्र में किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमने उसकी खबर सुनी है,” अथवा, “हमने उसकी ख्याति सुनी है।” इब्रानी में एक ही मूल से बनी अभिव्यक्ति है, जिसका शाब्दिक अर्थ लगभग “हमने उसका समाचार सुना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: और उन्होंने उससे कहा
  rationale: कथात्मक wayyiqtol को स्वाभाविक हिन्दी क्रम में रखते हुए इब्रानी कथा-प्रवाह का ‘और’ सुरक्षित रखा गया है।
- source_word: מֵאֶרֶץ רְחוֹקָה מְאֹד
  choice: बहुत दूर के देश से
  rationale: רְחוֹקָה के दूरी-बोध और מְאֹד की तीव्रता को सरल, मुहावरेदार आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עֲבָדֶיךָ
  choice: तेरे सेवक
  rationale: यहाँ शब्द कूटनीतिक विनम्रता की आत्म-पहचान है; ‘दास’ अनावश्यक रूप से बंधुआपन पर बल दे सकता है।
- source_word: לְשֵׁם יְהוָה אֱלֹהֶיךָ
  choice: तेरे परमेश्वर यहवे के नाम के कारण
  rationale: לְשֵׁם को आगमन के कारण अथवा प्रेरणा के रूप में व्यक्त किया गया है; ‘नाम’ प्रतिष्ठा और प्रकट पहचान दोनों की गुंजाइश बनाए रखता है।
- source_word: שָׁמַעְנוּ שָׁמְעוֹ
  choice: हमने उसकी कीर्ति सुनी है
  rationale: सजातीय इब्रानी अभिव्यक्ति किसी के विषय में फैली खबर, ख्याति या यश सुनने को दर्शाती है; ‘कीर्ति’ प्रसंग में स्वाभाविक है और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה בְּמִצְרָיִם
  choice: और वह सब सुना है जो उसने मिस्र में किया
  rationale: ‘सुना है’ को संयुक्त क्रिया के दोनों कर्मों—उसकी कीर्ति और उसके कार्यों—से स्वाभाविक रूप से जोड़ा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा का विशिष्ट नाम सीधे आया है; ‘यहवे’ उसका पारदर्शी लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: לְשֵׁם में ‘नाम’ का आशय
  choice: नाम के कारण
  alternative: नाम के लिए; कीर्ति के कारण
  rationale: मुख्य पाठ ‘नाम’ को सुरक्षित रखता है और संबंधसूचक לְ के कारण/प्रेरणा वाले अर्थ को हिन्दी में स्पष्ट करता है, बिना ‘नाम’ को केवल ‘कीर्ति’ तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। यहोशू को संबोधन में एकवचन ‘तेरे’ रखा गया है, जो मूल के एकवचन प्रत्ययों और प्राचीन कूटनीतिक भाषण को दर्शाता है।
