lexical_decisions:
- source_word: קְדֵמוֹת
  choice: कदेमोत
  rationale: स्थान-नाम को अनूदित करने के बजाय हिब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִגְרָשֶׁהָ
  choice: उसकी चरागाहें
