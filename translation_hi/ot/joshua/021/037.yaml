- source_word: עָרִים אַרְבַּע
  choice: कुल चार नगर
  rationale: सूची के अंत में दी गई संख्यात्मक गणना को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: और ... तथा ...
  rationale: बार-बार आए कर्मचिह्न को यांत्रिक ढंग से न दोहराकर हिन्दी में नगरों और उनसे जुड़ी चरागाहों की सूची स्वाभाविक रूप में रखी गई है।
