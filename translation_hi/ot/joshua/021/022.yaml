- source_word: בֵּית חוֹרֹן
  choice: बेत-होरोन
  rationale: इस स्थापित स्थान-नाम को शाब्दिक अर्थ में अनूदित करने के बजाय हिब्रू के निकट लिप्यंतरित किया गया है।
- source_word: עָרִים אַרְבַּע
  choice: कुल चार नगर
  rationale: सूची के अंत में आए संख्यात्मक सार को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘कुल’ जोड़ा गया है; इसका अर्थ मूल पाठ में निहित है।
- source_word: וְאֶת ... וְאֶת
  choice: और ... तथा
  rationale: दोहराए गए संयोजक से सूची की संरचना सुरक्षित रखी गई है, जबकि अनूदित न होने वाले निश्चित कर्म-चिह्न को हिन्दी में नहीं दर्शाया गया।
