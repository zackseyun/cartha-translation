  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। इब्रानी वाक्य पिछले पद से जुड़ी एक अपूर्ण आवंटन-सूची है; हिन्दी में अर्थपूर्ण पूर्ण वाक्य बनाने के लिए संदर्भानुसार ‘दिए गए’ जोड़ा गया है। सूची की पुनरावृत्त संरचना को यथासंभव बनाए रखा गया है।
