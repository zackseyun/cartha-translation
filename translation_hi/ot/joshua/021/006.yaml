  text: וְ/לִ/בְנֵ֣י גֵרְשׁ֗וֹן מִ/מִּשְׁפְּח֣וֹת מַטֵּֽה יִשָּׂשכָ֣ר וּ/מִ/מַּטֵּֽה אָ֠שֵׁר וּ/מִ/מַּטֵּ֨ה נַפְתָּלִ֜י וּ֠/מֵ/חֲצִי מַטֵּ֨ה מְנַשֶּׁ֤ה בַ/בָּשָׁן֙ בַּ/גּוֹרָ֔ל עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/006.yaml
  text: And to the sons of Gershon[a], from the families of the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali, and from the half-tribe of Manasseh in Bashan, by lot, thirteen cities.
translation:
  language: hi
  text: और गेर्शोन के वंशजों को इस्साकार गोत्र के कुलों[a] में से, आशेर गोत्र में से, नप्ताली गोत्र में से और बाशान में मनश्शे के आधे गोत्र में से चिट्ठी डालकर तेरह नगर दिए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परिवारों।” इब्रानी शब्द विस्तृत पारिवारिक समूहों या कुलों, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: और गेर्शोन के वंशजों को
  rationale: संबंधसूचक וְ और לִ को पिछले पद की आवंटन-सूची से जोड़ते हुए रखा गया है। वंश-संबंधी संदर्भ में ‘वंशजों’ आधुनिक हिन्दी में ‘पुत्रों’ से अधिक स्वाभाविक है और आशय स्पष्ट करता है।
- source_word: מִ/מִּשְׁפְּחֹת
  choice: कुलों
  rationale: מִשְׁפָּחוֹת यहाँ गोत्र के भीतर के विस्तृत पारिवारिक समूहों को दर्शाता है। ‘कुलों’ जनजातीय संदर्भ में स्वाभाविक है; ‘परिवारों’ भी संभव है और पाद-टिप्पणी में दिया गया है।
- source_word: מַטֵּה
  choice: गोत्र
  rationale: भूमि और नगरों के बँटवारे के संदर्भ में מַטֶּה इस्राएल की जनजातीय इकाई को दर्शाता है; हिन्दी बाइबलीय प्रयोग में ‘गोत्र’ स्पष्ट और प्रचलित है।
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה בַ/בָּשָׁן
  choice: और बाशान में मनश्शे के आधे गोत्र में से
  rationale: ‘आधे गोत्र’ मनश्शे के प्रादेशिक विभाजन को संक्षेप और ठीक रूप में व्यक्त करता है; ‘बाशान में’ का स्थानिक संबंध बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
- source_word: בַּ/גּוֹרָל
  choice: चिट्ठी डालकर
  rationale: यह वितरण की विधि बताता है। ‘चिट्ठी डालकर’ आधुनिक हिन्दी में लॉट डालने की प्राचीन प्रथा को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: तेरह नगर
  rationale: עָרִים के लिए ‘नगर’ इस आवंटन-सूची के गरिमापूर्ण गद्य में उपयुक्त और पारंपरिक है।
