source:
  edition: WLC
  text: וַ/יָּ֨נַח יְהוָ֤ה לָ/הֶם֙ מִ/סָּבִ֔יב כְּ/כֹ֥ל אֲשֶׁר נִשְׁבַּ֖ע לַ/אֲבוֹתָ֑/ם וְ/לֹא עָ֨מַד אִ֤ישׁ בִּ/פְנֵי/הֶם֙ מִ/כָּל אֹ֣יְבֵי/הֶ֔ם אֵ֚ת כָּל אֹ֣יְבֵי/הֶ֔ם נָתַ֥ן יְהוָ֖ה בְּ/יָדָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/044.yaml
  text: And Yahweh gave them rest on every side[a], according to all that he had sworn to their fathers. Not one man from all their enemies stood before them[b]; Yahweh gave all their enemies into their hand.
translation:
  language: hi
  text: याहवे ने उन्हें चारों ओर से विश्राम दिया, ठीक उसके अनुसार जो कुछ उसने उनके पुरखों से शपथ खाकर कहा था। उनके सभी शत्रुओं में से एक भी पुरुष उनके सामने टिक न सका[a]; याहवे ने उनके सभी शत्रुओं को उनके हाथ में दे दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके सामने खड़ा न हुआ।” इब्रानी मुहावरे का अर्थ है कि कोई भी उनका सफलतापूर्वक सामना नहीं कर सका।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके हाथ में दे दिया”; यह किसी को दूसरे के अधिकार में कर देने का सामान्य इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנַח
  choice: विश्राम दिया
  rationale: नוח के हिफ़ील रूप का अर्थ यहाँ ‘विश्राम देना’ है; यह विजय के बाद मिली सुरक्षा और स्थिरता के विषय को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: מִסָּבִיב
  choice: चारों ओर से
  rationale: यह आसपास के हर ओर से मिली व्यापक सुरक्षा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כְּכֹל אֲשֶׁר נִשְׁבַּע לַאֲבוֹתָם
  choice: ठीक उसके अनुसार जो कुछ उसने उनके पुरखों से शपथ खाकर कहा था
  rationale: ‘ठीक उसके अनुसार’ तुलना के भाव को और ‘जो कुछ’ כֹּל की समग्रता को रखता है; ‘पुरखों’ से पितृ-पूर्वजों का आशय स्वाभाविक हिन्दी में आता है।
- source_word: וְלֹא עָמַד אִישׁ בִּפְנֵיהֶם מִכָּל אֹיְבֵיהֶם
  choice: उनके सभी शत्रुओं में से एक भी पुरुष उनके सामने टिक न सका
  rationale: ‘सामने टिकना’ मूल इब्रानी बिंब को रखते हुए सफलतापूर्वक प्रतिरोध करने का मुहावरेदार अर्थ स्पष्ट करता है; ‘एक भी पुरुष’ אִישׁ के एकवचन पुल्लिंग और वितरणात्मक बल को दर्शाता है।
- source_word: נָתַן ... בְּיָדָם
  choice: उनके हाथ में कर दिया
  rationale: यह किसी को दूसरे के अधिकार में सौंपने का इब्रानी मुहावरा है; ‘हाथ’ का सामूहिक एकवचन भी सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसे उपाधि से बदले बिना प्रस्तुत करता है।
- issue: לַאֲבוֹתָם और אִישׁ में पुल्लिंग भाषा
  choice: उनके पुरखों / एक भी पुरुष
  alternative: उनके पूर्वजों / कोई भी व्यक्ति
  rationale: मूल पाठ के पुल्लिंग पारिवारिक और व्यक्तिगत पदों को वहाँ बनाए रखा गया है जहाँ वे पितृ-पूर्वजों और शत्रु-योद्धाओं के संदर्भ में स्वाभाविक हैं।
- issue: ‘उनके सामने खड़ा होना’ मुहावरे का अर्थ
  choice: उनके सामने टिक न सका
  alternative: उनके सामने खड़ा न हुआ
  rationale: शाब्दिक बिंब को काफी हद तक रखते हुए सफल प्रतिरोध की अभिप्रेत धारणा स्पष्ट की गई है; इससे यह गलत अर्थ नहीं निकलता कि कोई शत्रु मात्र उनके सामने खड़ा ही नहीं हुआ।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चारों ओर से विश्राम’, ‘सामने टिकना’ और ‘हाथ में कर देना’ मूल इब्रानी के प्रमुख बिंबों तथा विजय-सुरक्षा के संदर्भ को बनाए रखते हैं।
