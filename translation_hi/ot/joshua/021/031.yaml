  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶלְקָת
  choice: हेल्कत
  rationale: यह स्थान का नाम है; हिब्रू व्यंजन-रूप के निकट रहते हुए इसे अनूदित करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִגְרָשֶׁהָ
  choice: उसकी चरागाहें
  rationale: यह नगर से लगी उस भूमि को दर्शाता है जो पशुओं को चराने और सामुदायिक उपयोग के लिए थी। स्त्रीलिंग एकवचन प्रत्यय प्रत्येक नगर की ओर संकेत करता है।
- source_word: רְחֹב
  choice: रहोब
  rationale: यह स्थान का नाम है; प्रचलित हिन्दी बाइबलीय रूप के अनुरूप देवनागरी में लिप्यंतरित किया गया है।
- source_word: עָרִים אַרְבַּע
  choice: कुल चार नगर
  rationale: यह इस पद और इससे पहले की सूची में दिए गए नगरों की कुल संख्या बताने वाला सारांश है; हिन्दी में संबंध स्पष्ट करने के लिए ‘कुल’ जोड़ा गया है।
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: और ... और ...
  rationale: बार-बार आया אֶת कर्म-सूचक चिह्न है और उसका अलग अनुवाद नहीं किया जाता; संयोजक ‘और’ सूची की हिब्रू संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
