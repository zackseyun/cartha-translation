  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה אָשֵׁ֔ר אֶת מִשְׁאָ֖ל וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת עַבְדּ֖וֹן וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/030.yaml
  text: 'and from the tribe of Asher: Mishal with its pasturelands[b][a], and Abdon with its pasturelands.'
translation:
  language: hi
  text: 'और आशेर के गोत्र में से: मिशाल और उसकी चरागाहें[a], तथा अब्दोन और उसकी चरागाहें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘चरागाहें’ से आशय नगर की वह खुली भूमि है जो विशेष रूप से पशु चराने और अन्य सामुदायिक उपयोगों के लिए थी।
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: और ... के गोत्र में से
  rationale: मַטֶּה यहाँ इस्राएल के जनजातीय विभाजन को दर्शाता है; उपसर्ग וּמִ का स्वाभाविक हिन्दी रूप ‘और ... में से’ है।
- source_word: אָשֵׁר
  choice: आशेर
  rationale: गोत्र के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶת
  choice: —
  rationale: यह निश्चित कर्म का सूचक है और हिन्दी में इसका अलग अनुवाद आवश्यक नहीं है।
- source_word: מִשְׁאָל
  choice: मिशाल
  rationale: इब्रानी व्यंजनात्मक रूप को निकटता से दर्शाने वाला स्थान-नाम का लिप्यंतरण।
- source_word: מִגְרָשֶׁהָ
  choice: उसकी चरागाहें
  rationale: מִגְרָשׁ नगर से जुड़ी खुली सामुदायिक भूमि को दर्शाता है, जिसका उपयोग विशेषकर पशु चराने के लिए होता था; सूची के संदर्भ में ‘चरागाहें’ सहज और स्पष्ट है।
- source_word: עַבְדּוֹן
  choice: अब्दोन
  rationale: स्थान-नाम का मानक और स्रोत-संगत हिन्दी लिप्यंतरण।
- source_word: וְ/אֶת
  choice: तथा
  rationale: וְ को सूची में सहज संयोजक ‘तथा’ से व्यक्त किया गया है; אֶת का पृथक अनुवाद नहीं किया गया।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण सूची-शैली रखी गई है। इब्रानी में नगर के साथ प्रयुक्त एकवचन स्त्रीलिंग प्रत्यय को हिन्दी में ‘उसकी’ से व्यक्त किया गया है। अंग्रेज़ी परंपरा में स्थान-नाम के वैकल्पिक रूप से जुड़ी टिप्पणी हिन्दी पाठ के लिए आवश्यक नहीं मानी गई, क्योंकि ‘मिशाल’ स्रोत रूप का सीधा देवनागरी लिप्यंतरण है।
