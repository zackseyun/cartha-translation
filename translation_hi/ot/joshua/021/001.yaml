reference: Joshua 21:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יִּגְּשׁ֗וּ רָאשֵׁי֙ אֲב֣וֹת הַ/לְוִיִּ֔ם אֶל אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וְ/אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וְ/אֶל רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/001.yaml
  text: Then the heads of the fathers’ houses of the Levites came near to Eleazar the priest[a], to Joshua son of Nun[b], and to the heads of the fathers’ houses of the tribes of the sons of Israel.
translation:
  language: hi
  text: तब लेवियों के पितृकुलों के मुखिया याजक एलीआज़ार, नून के पुत्र यहोशू, और इस्राएलियों[a] के गोत्रों के पितृकुलों के मुखियाओं के पास गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: पास आए
  rationale: नגשׁ का मूल भाव निकट आने या सामने उपस्थित होने का है; प्रशासनिक निवेदन के इस प्रसंग में ‘पास आए’ स्वाभाविक और सटीक है।
- source_word: רָאשֵׁי אֲבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह इब्रानी पदबंध पैतृक वंश पर आधारित कुल-समूहों के अगुओं को दर्शाता है। ‘पितृकुल’ सामाजिक संरचना को बनाए रखते हुए आधुनिक हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: लेवी के वंशज अथवा समूह के लिए हिन्दी बाइबलीय प्रयोग में प्रचलित रूप।
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: एलीआज़ार याजक
  rationale: כֹּהֵן का सीधा अर्थ ‘याजक’ है; मूल में निहित न होने वाली पदवी जोड़ना उचित नहीं।
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: नून के पुत्र यहोशू
  rationale: इब्रानी वंशसूचक रचना का स्वाभाविक हिन्दी रूप, जिसमें पिता-पुत्र संबंध स्पष्ट रहता है।
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: गोत्रों के पितृकुलों के मुखिया
  rationale: यह रूप गोत्र और उसके अंतर्गत पितृकुल—दोनों सामाजिक स्तरों को स्पष्ट रखता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ यह समूचे जातीय समुदाय की स्थापित संज्ञा है; ‘इस्राएली’ आधुनिक हिन्दी में अधिक स्वाभाविक है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: इस्राएल की गोत्रीय व्यवस्था में लिंगसूचक संबंध-भाषा
  choice: ‘पितृकुल’ को मुख्य पाठ में बनाए रखना और לִבְנֵי יִשְׂרָאֵל के लिए स्वाभाविक सामुदायिक रूप ‘इस्राएली’ रखना
  alternative: ‘पूर्वजों के कुल’ और ‘इस्राएल के पुत्र’
  rationale: ‘पितृकुल’ मूल की पैतृक सामाजिक संरचना को स्पष्ट रखता है। दूसरी ओर, ‘इस्राएल के पुत्र’ यहाँ जातीय समुदाय का रूढ़ पद है; ‘इस्राएली’ अर्थ को बिना अनावश्यक कठोरता के व्यक्त करता है, और शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पितृकुल’ से प्राचीन गोत्रीय-सामाजिक संरचना दिखाई देती है, जबकि वाक्यक्रम हिन्दी की स्वाभाविकता के अनुरूप है।
