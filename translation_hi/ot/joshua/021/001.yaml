  terminology: ‘पितृकुल,’ ‘मुखिया,’ ‘लेवी,’ ‘याजक,’ and ‘गोत्र’ appropriately preserve the source’s social and religious terminology. The spelling ‘एलीआज़ार’ is retained from the draft for consistency.
