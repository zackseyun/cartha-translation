  yaml_path: translation/ot/joshua/021/016.yaml
  text: Ain with its pasturelands[a], Juttah with its pasturelands, Beth-shemesh with its pasturelands—nine cities from these two tribes.
translation:
  language: hi
  text: ऐन और उसकी चरागाहें[a], युत्ता और उसकी चरागाहें, और बेत-शेमेश और उसकी चरागाहें—इन दोनों गोत्रों से कुल नौ नगर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘साझी भूमि’ अथवा ‘आस-पास की भूमि’; इससे आशय प्रत्येक नगर से लगी और उसके उपयोग के लिए निर्धारित भूमि से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: ऐन
  rationale: स्थान-नाम को उसके हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी चरागाहें
  rationale: यह नगर से लगी हुई उपयोग की खुली भूमि को दर्शाता है, विशेषकर पशुओं के चरने के लिए; ‘चरागाहें’ आधुनिक और सहज हिंदी है।
- source_word: יֻטָּה
  choice: युत्ता
  rationale: स्थान-नाम का हिब्रू रूप देवनागरी में लिप्यंतरित किया गया है।
- source_word: בֵּית שֶׁמֶשׁ
  choice: बेत-शेमेश
  rationale: यह स्थापित स्थान-नाम है; इसलिए इसके शाब्दिक अर्थ ‘सूर्य का घर’ का अनुवाद करने के बजाय लिप्यंतरण किया गया है।
- source_word: עָרִים תֵּשַׁע
  choice: कुल नौ नगर
  rationale: ‘नगर’ बसी हुई प्रशासनिक इकाइयों के लिए स्वाभाविक हिंदी शब्द है; ‘कुल’ सूची के सार को स्पष्ट करता है।
- source_word: מֵאֵת שְׁנֵי הַשְּׁבָטִים הָאֵלֶּה
  choice: इन दोनों गोत्रों से
  rationale: यह पहले बताए गए दो गोत्रों में से दिए गए नगरों के स्रोत या आवंटन को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
