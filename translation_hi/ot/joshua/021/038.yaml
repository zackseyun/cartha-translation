source:
  edition: WLC
  text: וּ/מִ/מַּטֵּה גָ֗ד אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת רָמֹ֥ת בַּ/גִּלְעָ֖ד וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶֽת מַחֲנַ֖יִם וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/038.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead[a], the city of refuge for the manslayer, with its pasturelands[c][b], and Mahanaim with its pasturelands.'
translation:
  language: hi
  text: 'और गाद के गोत्र में से: जिसने किसी का प्राण लिया हो उसके लिए शरण-नगर, गिलाद में रामोत[b], उसके चरागाहों[c] समेत, और महनैम, उसके चरागाहों समेत।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: इसे ‘गिलाद का रामोत’ या संयुक्त नाम के रूप में ‘रामोत-गिलाद’ भी कहा जा सकता है।
    reason: alternative_reading
  - marker: c
    text: ‘चरागाहों’ से आशय नगर के चारों ओर उसके उपयोग के लिए दी गई भूमि से है।
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה גָד
  choice: और गाद के गोत्र में से
  rationale: गोत्रों के भूमि-विभाजन के संदर्भ में מַטֶּה का अर्थ ‘गोत्र’ है; उपसर्गों को स्वाभाविक हिंदी में ‘और ... में से’ कहा गया है।
- source_word: עִיר מִקְלַט
  choice: शरण-नगर
  rationale: यह इस्राएली व्यवस्था में आश्रय के लिए ठहराए गए नगर का पारिभाषिक पद है; ‘शरण-नगर’ संक्षिप्त और स्पष्ट है।
- source_word: הָרֹצֵחַ
  choice: हत्यारे
  rationale: रֹצֵחַ किसी मनुष्य की जान लेने वाले व्यक्ति को दर्शाता है। शरण-नगर के कानूनी संदर्भ में यह आवश्यक नहीं कि हत्या पूर्वनियोजित रही हो; फुटनोट इस व्यापकता को स्पष्ट करता है।
- source_word: רָמֹת בַּ/גִּלְעָד
  choice: गिलाद का रामोत
  rationale: हिब्रू पदबंध स्थान को गिलाद से संबद्ध करता है। हिंदी में प्रचलित और स्वाभाविक नाम-रूप ‘गिलाद का रामोत’ रखा गया है।
- source_word: מִגְרָשֶׁהָ
  choice: उसके चरागाहों
  rationale: लेवीय नगरों की सूचियों में מִגְרָשׁ नगर के चारों ओर उपयोग हेतु दी गई भूमि, विशेषतः पशुओं के चरने की भूमि, को दर्शाता है।
- source_word: מַחֲנַיִם
  choice: महनैम
  rationale: यह स्थान का व्यक्तिवाचक नाम है; इसे हिंदी लिप्यंतरण में रखा गया है।
theological_decisions:
- issue: शरण लेने वाले व्यक्ति के लिए רֹצֵחַ का कानूनी आशय
  choice: मुख्य पाठ में ‘हत्यारे’, साथ में स्पष्टीकरण कि दोष या पूर्वनियोजन स्वतः सिद्ध नहीं होता
  alternative: ‘खूनी’ या ‘अनजाने में हत्या करने वाला’
  rationale: ‘खूनी’ पूर्वनियोजित अपराध का अधिक कठोर संकेत दे सकता है, जबकि ‘अनजाने में हत्या करने वाला’ इस पद के अपने आप में व्यक्त अर्थ से अधिक विशिष्ट है। मूल की कानूनी अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सूची की हिब्रू संरचना को बनाए रखते हुए विराम-चिह्नों से वाक्य स्पष्ट किया गया है। स्थान-नामों के लिए प्रचलित बाइबलीय हिंदी रूप अपनाए गए हैं।
