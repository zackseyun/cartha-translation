  text: 'और इस्साकार के गोत्र में से: किश्योन और उसकी चराई की भूमि, तथा दाब्रत और उसकी चराई की भूमि।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַטֵּה
  choice: गोत्र
  rationale: भूमि-विभाजन के इस संदर्भ में इस्राएल के जनजातीय समूह के लिए आधुनिक हिन्दी बाइबलीय प्रयोग में ‘गोत्र’ स्वाभाविक और स्पष्ट है।
- source_word: קִשְׁיוֹן
  choice: किश्योन
  rationale: इब्रानी स्थाननाम का निकट देवनागरी लिप्यंतरण; मध्य का yod ‘य’ ध्वनि से दर्शाया गया है।
- source_word: דָּבְרַת
  choice: दाबरत
  rationale: इब्रानी स्थाननाम का निकट लिप्यंतरण, जिसमें दीर्घ आरंभिक स्वर और अंतिम त व्यंजन सुरक्षित हैं।
- source_word: מִגְרָשֶׁהָ
  choice: उसकी चरागाहें
  rationale: नगर से लगी पशु-चराई और सामुदायिक उपयोग की खुली भूमि को संदर्भानुकूल तथा सहज हिन्दी में व्यक्त करता है।
