source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן יְהוָה֙ לְ/יִשְׂרָאֵ֔ל אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/תֵ֣ת לַ/אֲבוֹתָ֑/ם וַ/יִּרָשׁ֖וּ/הָ וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/043.yaml
  text: So Yahweh gave Israel all the land that he had sworn to give to their fathers[a], and they took possession of it and lived in it.
translation:
  language: hi
  text: इस प्रकार याहवे ने इस्राएल को वह सारा देश दे दिया, जिसे उसने उनके पुरखों को देने की शपथ ली थी। उन्होंने उस देश पर अधिकार कर लिया[a] और उसमें बस गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे विरासत में पाया”; इब्रानी क्रिया वाचा के संदर्भ में विरासत पाने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट नाम YHWH को सामान्य उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: וַיִּתֵּן
  choice: दे दिया
  rationale: यहाँ נתן भूमि प्रदान करने की सीधी क्रिया व्यक्त करता है; ‘दे दिया’ हिन्दी में पूर्ण हुई क्रिया को स्वाभाविक ढंग से प्रकट करता है।
- source_word: כָּל הָאָרֶץ
  choice: वह सारा देश
  rationale: संदर्भ प्रतिज्ञा किए गए भूभाग का है, पूरी पृथ्वी का नहीं; ‘सारा’ כָּל की समग्रता बनाए रखता है।
- source_word: אֲשֶׁר נִשְׁבַּע לָתֵת
  choice: जिसे ... देने की शपथ उसने खाई थी
  rationale: निफ़अल נִשְׁבַּע की शपथ-बद्ध प्रतिज्ञा और इस शपथ के पहले किए जाने—दोनों को स्पष्ट रखा गया है।
- source_word: לַאֲבוֹתָם
  choice: उनके पुरखों को
  rationale: ‘पुरखे’ यहाँ इस्राएल के पितृपुरुषों के लिए स्वाभाविक आधुनिक हिन्दी शब्द है और मूल के पुरुषवाची पारिवारिक संदर्भ को बनाए रखता है।
- source_word: וַיִּרָשׁוּהָ
  choice: उन्होंने उस देश पर अधिकार कर लिया
  rationale: ירשׁ यहाँ देश को अपने अधिकार में लेने का ठोस भाव देता है, जबकि इसकी संभावित विरासत-संबंधी छाया को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: उसमें बस गए
  rationale: ישׁב ב भूमि में निवास करने या बसने को व्यक्त करता है; विजय और बसावट के संदर्भ में ‘बस गए’ संक्षिप्त और स्वाभाविक है।
- source_word: וַ
  choice: इस प्रकार
  rationale: आरंभिक वाव पिछली कथा के निष्कर्ष और सारात्मक परिणाम को जोड़ता है; ‘इस प्रकार’ उस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: देश की प्रतिज्ञा की पूर्ति के कथन का दायरा और बल
  choice: पद के अनुसार याहवे ने इस्राएल को प्रतिज्ञा किया हुआ सारा देश दिया और इस्राएल ने उस पर अधिकार करके उसमें बसना आरंभ किया—इसे एक प्रबल पूर्ति-सारांश के रूप में अनूदित किया गया है।
  alternative: कथन को अन्य विजय-वृत्तांतों के कारण केवल आंशिक घोषित करना, अथवा इसे ऐसा सर्वथा निरपेक्ष कथन बनाना जो उन वृत्तांतों की हर शेष जटिलता को समाप्त कर दे।
  rationale: כָּל הָאָרֶץ और क्रमिक क्रियाएँ इस पद में संपूर्णता और पूर्ति पर बल देती हैं। अनुवाद उसी बल को रखता है, पर व्यापक धर्मवैज्ञानिक सामंजस्य को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘याहवे’ विशिष्ट ईश्वरीय नाम को सुरक्षित रखता है; ‘पुरखे’ पितृपुरुषों का स्वाभाविक हिन्दी उल्लेख है। दो हिन्दी वाक्यों में विभाजन से दीर्घ इब्रानी वाक्य का प्रवाह सामान्य पाठक के लिए स्पष्ट होता है।
