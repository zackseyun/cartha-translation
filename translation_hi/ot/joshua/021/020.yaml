  yaml_path: translation/ot/joshua/021/020.yaml
  text: And for the families of the sons of Kohath[a], the Levites who remained from the sons of Kohath, the cities of their lot were from the tribe of Ephraim.
translation:
  language: hi
  text: और कहात के वंशजों के परिवारों के लिए—अर्थात कहात के वंशजों में से बचे हुए लेवियों के लिए—उनके भाग में आए नगर[a] एप्रैम के गोत्र से थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक स्पष्ट रूप में: “चिट्ठी डालकर उन्हें दिए गए नगर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִשְׁפְּחוֹת בְּנֵי קְהָת
  choice: कहात के वंशजों के परिवारों के लिए
  rationale: לְ वितरण के संदर्भ में संबद्ध प्राप्तकर्ताओं को दर्शाता है। בְּנֵי वंशावली-सूचक प्रयोग में केवल प्रत्यक्ष पुत्र नहीं, बल्कि वंशज भी दर्शाता है; आधुनिक हिन्दी में ‘वंशज’ अर्थ को अधिक स्वाभाविक रूप से स्पष्ट करता है।
- source_word: הַלְוִיִּם הַנּוֹתָרִים מִבְּנֵי קְהָת
  choice: कहात के वंशजों में से शेष लेवियों के लिए
  rationale: הַנּוֹתָרִים पहले किए गए बँटवारे के बाद बचे हुए समूह को दर्शाता है, और מִן का प्रयोग अंश-सूचक है। ‘में से शेष’ दोनों बातों को स्पष्ट रखता है।
- source_word: עָרֵי גוֹרָלָם
  choice: उनके भाग में आए नगर
  rationale: גורל का मूल अर्थ ‘चिट्ठी’ और उससे निर्धारित ‘भाग’ है। ‘भाग में आए नगर’ हिन्दी में स्वाभाविक है और चिट्ठी द्वारा हुए आवंटन के परिणाम को व्यक्त करता है; स्पष्टतर रूप पाद-टिप्पणी में दिया गया है।
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: एप्रैम के गोत्र से
  rationale: जनजातीय सूची में מַטֶּה का अर्थ ‘गोत्र’ है; מִן स्रोत अथवा उस गोत्र से लिए गए नगरों को दर्शाता है।
