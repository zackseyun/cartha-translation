reference: Joshua 21:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּתְּנ֤וּ בְנֵֽי יִשְׂרָאֵל֙ לַ/לְוִיִּ֔ם אֶת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/אֶת מִגְרְשֵׁי/הֶ֑ן כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה בַּ/גּוֹרָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/008.yaml
  text: So the sons of Israel gave to the Levites these cities with their pasturelands[a], as Yahweh had commanded by the hand of Moses, by lot.
translation:
  language: hi
  text: इस प्रकार इस्राएल के वंशजों ने लेवियों को चिट्ठी डालकर ये नगर और इनके चरागाह दिए, जैसा यहोवा ने मूसा के द्वारा आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: दिए
  rationale: נתן का सामान्य और सीधा अर्थ रखा गया है; प्रसंग में नगरों के आवंटन का भाव भी इससे स्पष्ट है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के वंशजों
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ के सामुदायिक अर्थ को आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: לַלְוִיִּם
  choice: लेवियों को
  rationale: जनजातीय समुदाय और सम्प्रदान कारक को सीधे व्यक्त करता है।
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ये नगर
  rationale: निर्देशक सर्वनाम और संदर्भित नगरों को संक्षेप तथा स्वाभाविकता से सुरक्षित रखता है।
- source_word: מִגְרְשֵׁיהֶן
  choice: इनके चरागाह
  rationale: नगरों के चारों ओर पशु चराने और सामुदायिक उपयोग की खुली भूमि का ठोस अर्थ व्यक्त करता है।
- source_word: כַּאֲשֶׁר צִוָּה
  choice: जैसा ... आज्ञा दी थी
  rationale: पूर्व में दी गई आज्ञा के अनुरूप कार्य होने का अर्थ और कथात्मक कालक्रम दोनों रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत वाचा-नाम को पदवी से बदले बिना प्रस्तुत करता है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: ‘मूसा के हाथ से’ नामक इब्रानी मुहावरे का स्वाभाविक हिन्दी अर्थ—मध्यस्थ साधन—व्यक्त करता है।
- source_word: בַּגּוֹרָל
  choice: चिट्ठी डालकर
  rationale: नगरों का वितरण चिट्ठी डालने की प्रक्रिया से हुआ था; यह हिन्दी में ‘by lot’ का स्पष्ट और प्रचलित वर्णन है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; हिन्दी पाठकों के लिए सुस्थापित ‘यहोवा’ रूप नाम को पदवी ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: בְּיַד מֹשֶׁה में मध्यस्थता का भाव
  choice: मूसा के द्वारा
  alternative: मूसा के हाथ से
  rationale: यह चयन किसी विशेष धर्मसैद्धान्तिक व्याख्या को जोड़े बिना इब्रानी मुहावरे में निहित माध्यमिक अभिकरण को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण कथात्मक रूप। ‘चिट्ठी डालकर’ को वाक्य में ‘दिए’ के पास रखा गया है, ताकि आवंटन की विधि स्पष्ट रहे और अन्त में अस्वाभाविक पदक्रम न बने।
