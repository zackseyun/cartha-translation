  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। हिब्रू में यह पद एक संक्षिप्त सूची-वाक्य है; हिन्दी में ‘मिले’ जोड़कर आवंटन का संदर्भ स्वाभाविक बनाया गया है, जबकि स्रोत का आशय सुरक्षित है।
