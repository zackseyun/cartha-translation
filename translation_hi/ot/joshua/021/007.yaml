base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/007.yaml
  text: 'For the sons of Merari[a], according to their families, from the tribe of Reuben and from the tribe of Gad and from the tribe of Zebulun: twelve cities.'
translation:
  language: hi
  text: मरारी के वंशजों को[a] उनके कुलों के अनुसार रूबेन के गोत्र में से, गाद के गोत्र में से और ज़बूलून के गोत्र में से बारह नगर मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मरारी के पुत्रों को।”
    reason: हिब्रू בני के औपचारिक पारिवारिक रूप को दर्शाता है; मुख्य पाठ में ‘वंशजों’ संदर्भगत अनुवाद है।
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: मरारी के वंशजों को
  rationale: לִבְנֵי का शाब्दिक रूप ‘पुत्रों को’ हो सकता है, पर यहाँ लेवीय वंश-समूह और नगरों के आवंटन की बात है; इसलिए ‘वंशजों को’ आधुनिक हिन्दी में आशय स्पष्ट करता है। ל उपसर्ग प्राप्तकर्ता/आवंटन को दर्शाता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ विस्तृत परिवार या कुल-समूह को सूचित करता है; ‘कुलों के अनुसार’ वितरण की संगठनात्मक रीति बनाए रखता है।
- source_word: מִמַּטֵּה
  choice: के गोत्र में से
  rationale: भूमि और नगरों के आवंटन के इस संदर्भ में מַטֶּה का अर्थ ‘गोत्र’ है, न कि छड़ी या डंडा।
- source_word: רְאוּבֵן / גָד / זְבוּלֻן
  choice: रूबेन / गाद / जबूलून
  rationale: हिब्रू नामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
- source_word: עָרִים
  choice: नगर
  rationale: आवंटन-सूचियों में עִיר के लिए ‘नगर’ स्वाभाविक और प्रतिष्ठित हिन्दी शब्द है।
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: बारह
  rationale: हिब्रू की स्पष्ट संख्या का सीधा, स्वाभाविक हिन्दी रूप।
theological_decisions: []
