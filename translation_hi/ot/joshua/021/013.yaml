  text: וְ/לִ/בְנֵ֣י אַהֲרֹ֣ן הַ/כֹּהֵ֗ן נָֽתְנוּ֙ אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת חֶבְר֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶת לִבְנָ֖ה וְ/אֶת מִגְרָשֶֽׁ/הָ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/013.yaml
  text: And to the sons of Aaron the priest they gave Hebron[a], the city of refuge for the manslayer, with its pasturelands, and Libnah with its pasturelands.
translation:
  language: hi
  text: और उन्होंने याजक हारून के वंशजों को जिसने किसी की जान ली है उसके लिए शरण-नगर हेब्रोन[a] और उसकी चरागाहें, तथा लिब्ना और उसकी चरागाहें दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘जिसने किसी की जान ली है’ उस व्यक्ति के लिए प्रयुक्त कानूनी पद का अर्थ व्यक्त करता है जो शरण-नगर में भाग सकता था; इससे यह आवश्यक नहीं कि उसने पहले से सोच-समझकर हत्या की थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: और याजक हारून के वंशजों को
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर इस याजकीय वंश के संदर्भ में ‘वंशज’ स्वाभाविक और सटीक है; לְ अप्रत्यक्ष कर्म को चिह्नित करता है।
- source_word: נָתְנוּ
  choice: उन्होंने ... दीं
  rationale: मूल क्रिया का सामान्य अर्थ ‘देना’ है; नगरों के वितरण के संदर्भ में भी यही सहज है।
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: हत्यारे के लिए शरण-नगर
  rationale: यह व्यवस्था-संबंधी पद उस व्यक्ति के लिए है जिसने किसी की जान ली हो और जो शरण-नगर भाग सकता हो; ‘हत्यारा’ हिंदी में व्यापक रूप से जान लेने वाले को दर्शा सकता है, जबकि पादटिप्पणी स्पष्ट करती है कि यहाँ पूर्वनियोजित हत्या अनिवार्यतः अभिप्रेत नहीं।
- source_word: חֶבְרוֹן
  choice: हेब्रोन
  rationale: स्थान-नाम का हिंदी में प्रचलित लिप्यंतरण।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी चरागाहें
  rationale: מִגְרָשׁ नगर से जुड़ी खुली भूमि, विशेषतः पशुओं के चरने की भूमि, को सूचित करता है; ‘चरागाहें’ संदर्भानुकूल और सुबोध है।
- source_word: לִבְנָה
  choice: लिब्ना
  rationale: स्थान-नाम का मानक हिंदी लिप्यंतरण।
theological_decisions:
- issue: הָרֹצֵחַ में जान लेने वाले की नैतिक/कानूनी स्थिति
  choice: मुख्य पाठ में ‘हत्यारे’ रखा और पादटिप्पणी में अर्थ-सीमा स्पष्ट की
  alternative: ‘अनजाने में हत्या करने वाले’
  rationale: इस पद का हिब्रू शब्द अपने आप में अनजानेपन को स्पष्ट नहीं करता। संदर्भ शरण पाने योग्य जान लेने वाले का है, इसलिए अनजानेपन को मुख्य पाठ में जोड़ना मूल की अस्पष्टता को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिंदी। ‘वंशजों’ से याजकीय वंश का आशय स्पष्ट होता है; ‘शरण-नगर’ और ‘चरागाहें’ पूरे प्रसंग में एकरूप रखे जाने योग्य पद हैं।
