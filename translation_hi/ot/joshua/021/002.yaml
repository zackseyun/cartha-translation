  edition: WLC
  text: וַ/יְדַבְּר֨וּ אֲלֵי/הֶ֜ם בְּ/שִׁלֹ֗ה בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה בְ/יַד מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ עָרִ֖ים לָ/שָׁ֑בֶת וּ/מִגְרְשֵׁי/הֶ֖ן לִ/בְהֶמְתֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/002.yaml
  text: And they spoke to them at Shiloh in the land of Canaan[a], saying, “Yahweh commanded through Moses to give us cities to dwell in[b], along with their pasturelands for our livestock.”
translation:
  language: hi
  text: उन्होंने कनान देश के शीलो में उनसे कहा, “याहवे ने मूसा के द्वारा आज्ञा दी थी कि हमें रहने के लिए नगर और हमारे पशुओं के लिए उनके चरागाह दिए जाएँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֲלֵיהֶם
  choice: उन्होंने उनसे कहा
  rationale: דבר का मूल अर्थ ‘बोलना’ है, पर इसके बाद לֵאמֹר से कथन आरम्भ होने के कारण आधुनिक हिन्दी में संयुक्त रूप से ‘उन्होंने उनसे कहा’ अधिक स्वाभाविक है और अर्थ को पूरा रखता है।
- source_word: בְּשִׁלֹה בְּאֶרֶץ כְּנַעַן
  choice: कनान देश में शीलो में
  rationale: दोनों स्थान-सूचक पदों को रखा गया है; ‘कनान देश’ मूल में आए אֶרֶץ को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: בְיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: शाब्दिक ‘मूसा के हाथ से’ यहाँ माध्यम अथवा प्रतिनिधित्व का इब्रानी मुहावरा है; ‘के द्वारा’ आधुनिक हिन्दी में वही भाव देता है।
- source_word: לָתֶת לָנוּ עָרִים לָשָׁבֶת
  choice: कि हमें रहने के लिए नगर ... दिए जाएँ
  rationale: נתן का सीधा अर्थ ‘देना’ और ישׁב का यहाँ उद्देश्य ‘रहना’ है। हिन्दी का कर्मवाच्य विन्यास याहवे की आज्ञा के आशय को स्वाभाविक ढंग से व्यक्त करता है, बिना अनुल्लिखित कर्ता जोड़ने के।
- source_word: וּמִגְרְשֵׁיהֶן
  choice: और ... उनके चरागाह
  rationale: מִגְרָשׁ नगरों के आसपास पशुओं के उपयोग की खुली भूमि को सूचित करता है; इस प्रसंग में ‘चरागाह’ उसका स्पष्ट और सहज हिन्दी रूप है।
- source_word: לִבְהֶמְתֵּנוּ
  choice: हमारे पशुओं के लिए
  rationale: בְּהֵמָה यहाँ सामूहिक अर्थ में पालतू पशुधन को दर्शाता है; ‘हमारे पशु’ सामान्य हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: आज्ञा के कार्यान्वयन का अनुल्लिखित कर्ता
  choice: ‘दिए जाएँ’ के द्वारा कर्ता को अनिर्दिष्ट रखना
  alternative: ‘तुम हमें दो’ या ‘इस्राएली हमें दें’
  rationale: इब्रानी לָתֶת में देने वाले का स्पष्ट उल्लेख नहीं है। कर्मवाच्य हिन्दी इस वास्तविक अस्पष्टता को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘बसने’ के बजाय ‘रहने’ और ‘नगरों की चराई की भूमि’ के बजाय संक्षिप्त ‘चरागाह’ सामान्य पाठक के लिए अधिक स्वाभाविक हैं। मूल पाठ में इस पद पर कोई ऐसी आवश्यक पाठालोचनात्मक या अर्थगत टिप्पणी नहीं है जिसके लिए पादटिप्पणी अनिवार्य हो।
