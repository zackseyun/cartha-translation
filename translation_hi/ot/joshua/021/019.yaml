  text: All the cities of the sons of Aaron[a], the priests, were thirteen cities with their pasturelands.
translation:
  language: hi
  text: हारून के वंशजों, अर्थात् याजकों, के कुल तेरह नगर और उनकी चरागाहें थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: कुल नगर
  rationale: समापन-सारांश में כָּל पूरे गिने हुए नगरों की कुल संख्या बताता है; आधुनिक हिन्दी में ‘कुल नगर’ स्वाभाविक और संक्षिप्त है।
- source_word: בְנֵי אַהֲרֹן
  choice: हारून के वंशजों
  rationale: वंश-संबंधी इस प्रसंग में בְנֵי केवल हारून के प्रत्यक्ष पुत्रों के बजाय उनकी वंश-परंपरा के लोगों को दर्शाता है; ‘वंशजों’ से आशय स्पष्ट और स्वाभाविक रहता है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: यह हारून के वंशजों की समानाधिकरण पहचान है; हिन्दी बाइबलीय प्रयोग में ‘याजक’ सटीक, प्रतिष्ठित और समझने योग्य पद है।
- source_word: שְׁלֹשׁ עֶשְׂרֵה עָרִים
  choice: तेरह थे
  rationale: ‘नगर’ पहले आ चुका है, इसलिए हिन्दी में संख्या के साथ उसकी पुनरावृत्ति टालना स्वाभाविक है, जबकि अर्थ पूर्णतः बना रहता है।
- source_word: וּמִגְרְשֵׁיהֶן
  choice: और उनके साथ उनकी चरागाहें भी थीं
  rationale: वाव के साधारण संयोजन ‘और’ को सुरक्षित रखा गया है। מִגְרָשׁ लेवीय नगरों से लगी पशु चराने की खुली भूमि को दर्शाता है; ‘चरागाहें’ इसका सहज हिन्दी समतुल्य है।
