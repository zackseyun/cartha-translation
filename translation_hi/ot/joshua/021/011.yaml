base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/011.yaml
  text: So they gave them Kiriath-arba (Arba was the father of Anak)[a], that is, Hebron, in the hill country of Judah, along with its pasturelands around it.
translation:
  language: hi
  text: तब उन्होंने उन्हें किर्यत-अरबा (अरबा अनाक का पिता था)[a], अर्थात् हेब्रोन, जो यहूदा के पहाड़ी प्रदेश में है, और उसके आसपास की चरागाहें दे दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अरबा अनाक का पूर्वज था।” इब्रानी अभिव्यक्ति प्रत्यक्ष पिता या पहले के किसी पूर्वज, दोनों को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: इस प्रकार उन्होंने ... दे दीं
  rationale: वय्यिक्तोल कथा के अगले क्रमिक कार्य को बताता है; ‘इस प्रकार’ प्रसंगगत प्रगति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָהֶם
  choice: उन्हें
  rationale: इब्रानी के तृतीय पुरुष बहुवचन सर्वनाम को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
- source_word: קִרְיַת אַרְבַּע
  choice: किर्यत-अरबा
  rationale: स्थापित स्थान-नाम को लिप्यंतरित किया गया है; इसका शाब्दिक अर्थ ‘अरबा का नगर’ है।
- source_word: אֲבִי הָעֲנֹוק
  choice: अरबा अनाक का पिता था
  rationale: संबंधसूचक समानाधिकरण को स्पष्ट हिन्दी वाक्यांश बनाया गया है; ‘पिता’ मूल अर्थ को रखता है, जबकि यहाँ पूर्वज का व्यापक अर्थ भी संभव है।
- source_word: הִיא חֶבְרוֹן
  choice: अर्थात् हेब्रोन
  rationale: यह पदबंध किर्यत-अरबा की पहचान हेब्रोन के रूप में करता है।
- source_word: בְּהַר יְהוּדָה
  choice: यहूदा के पहाड़ी प्रदेश में
  rationale: यहाँ הַר किसी एक पहाड़ के बजाय यहूदा के ऊँचे पहाड़ी भूभाग को सूचित करता है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी ... चरागाहें
  rationale: מִגְרָשׁ नगर के आसपास उपयोग, विशेषतः पशु चराने, के लिए खुली भूमि को दर्शाता है।
- source_word: סְבִיבֹתֶיהָ
  choice: उसके चारों ओर की
  rationale: नगर को घेरे हुए क्षेत्र का स्थानिक संबंध सहज हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: אֲבִי में संबंध की सीमा
  choice: मुख्य पाठ में ‘पिता’
  alternative: ‘पूर्वज’
  rationale: मूल शब्द का सीधा अर्थ ‘पिता’ है, पर इब्रानी प्रयोग अधिक दूर के पूर्वज को भी सूचित कर सकता है; इस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। स्थान-नामों का देवनागरी लिप्यंतरण किया गया है और संबंधगत अस्पष्टता को मुख्य पाठ में मिटाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
