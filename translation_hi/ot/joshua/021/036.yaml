- source_word: יַהְצָה
  choice: यहसा
  rationale: स्थान-नाम का ऐसा हिन्दी लिप्यंतरण चुना गया है जो हिब्रू रूप को निकटता से दर्शाता है; अन्य प्रचलित रूप पादटिप्पणी में दिए गए हैं।
