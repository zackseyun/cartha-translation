base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/032.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee[a], the city of refuge for the manslayer, with its pasturelands; Hammoth-dor with its pasturelands[b]; and Kartan with its pasturelands—three cities.'
translation:
  language: hi
  text: 'और नप्ताली के गोत्र में से: गलील में केदेश, जान लेने वाले के लिए शरण-नगर, और उसके चरागाह; हम्मोत-दोर और उसके चरागाह; तथा कर्तान और उसके चरागाह—कुल तीन नगर।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: और नप्ताली के गोत्र में से
  rationale: जनजातीय बँटवारे के प्रसंग में מַטֶּה का अर्थ ‘गोत्र’ है; उपसर्गों को स्वाभाविक हिन्दी में ‘और ... में से’ किया गया है।
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: जो अनजाने में किसी की जान लेने वाले के लिए शरण-नगर था
  rationale: עִיר מִקְלַט स्थापित विधिक पद ‘शरण-नगर’ है। הָרֹצֵחַ का मूल अर्थ जान लेने वाला है; इस शरण-विधान के संदर्भ में हिन्दी वाक्यांश अनजाने वध की विधिक स्थिति स्पष्ट करता है, जबकि पादटिप्पणी हिब्रू पद की व्यापकता सुरक्षित रखती है।
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: गलील में केदेश
  rationale: स्थान-नाम का लिप्यंतरण किया गया है और क्षेत्र-सूचक पद को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसके चरागाह
  rationale: מִגְרָשׁ नगर से लगी सामुदायिक खुली भूमि को दर्शाता है, जिसका उपयोग विशेषतः पशु चराने के लिए होता था; ‘चरागाह’ सरल और प्रसंगानुकूल है।
- source_word: חַמֹּת דֹּאר
  choice: हम्मोत-दोर
  rationale: मसोरेटी व्यंजन-पाठ संयुक्त स्थान-नाम का समर्थन करता है; योजक-चिह्न हिब्रू रूप और पठनीयता दोनों बनाए रखता है।
- source_word: קַרְתָּן
  choice: कर्तान
  rationale: हिब्रू स्थान-नाम का सीधा देवनागरी लिप्यंतरण।
- source_word: עָרִים שָׁלֹשׁ
  choice: कुल तीन नगर
  rationale: हिब्रू की अंतिम गणनात्मक संक्षिप्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: הָרֹצֵחַ में वध की नैतिक और विधिक प्रकृति
  choice: मुख्य पाठ में ‘अनजाने में किसी की जान लेने वाला’
  alternative: ‘जान लेने वाला’ या ‘हत्यारा’
  rationale: यहोशू में शरण-नगर की व्यवस्था अनिच्छित वध से संबंधित है; ‘हत्यारा’ पूर्वनियोजित हत्या का अर्थ आरोपित कर सकता है। फिर भी हिब्रू शब्द अपने आप में केवल ‘जान लेने वाला’ कहता है, इसलिए यह बात पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सूची-पाठ के अनुरूप रखी गई है। ‘शरण-नगर’, ‘गोत्र’ और ‘चरागाह’ जैसे परिचित बाइबलीय-विधिक शब्दों का उपयोग किया गया है। स्थान-नाम मूल हिब्रू के निकट देवनागरी में लिप्यंतरित हैं।
