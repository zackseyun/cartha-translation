lexical_decisions:
- source_word: יַתִּר
  choice: यत्तीर
  rationale: स्थान-नाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִגְרָשֶׁהָ
  choice: उसके चरागाह
  rationale: यह शब्द नगर के चारों ओर की खुली, सामुदायिक रूप से प्रयुक्त चराई-भूमि को सूचित करता है; ‘चरागाह’ आधुनिक हिंदी में सहज और संदर्भानुकूल है। स्त्रीलिंग एकवचन प्रत्यय प्रत्येक नगरी की ओर संकेत करता है।
- source_word: אֶשְׁתְּמֹעַ
  choice: एश्तमोआ
  rationale: स्थान-नाम को हिब्रू रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְאֶת
  choice: और … तथा
  rationale: אֶת कर्म-चिह्न है, जिसका हिंदी में अलग अनुवाद आवश्यक नहीं; וְ को सूची की संरचना स्पष्ट रखने के लिए ‘और’ तथा ‘तथा’ से व्यक्त किया गया है।
