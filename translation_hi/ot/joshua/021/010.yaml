  yaml_path: translation/ot/joshua/021/010.yaml
  text: It was for the sons of Aaron[a], from the families of the Kohathites, from the sons of Levi, because the first lot was for them.
translation:
  language: hi
  text: वह हारून के पुत्रों के लिए था—जो लेवी के वंशजों में से कहाती कुलों के थे—क्योंकि पहला चिट्ठा उनके लिए था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן
  choice: वह हारून के वंशजों को मिला
  rationale: लामेद यहाँ आवंटन सूचित करता है। हिंदी में केवल ‘था’ की अपेक्षा ‘मिला’ नगरों के बाँटे जाने के प्रसंग को स्वाभाविक रूप से व्यक्त करता है; ‘वंशज’ वंशावली-संबंध बनाए रखता है।
- source_word: מִמִּשְׁפְּחוֹת הַקְּהָתִי
  choice: कहातियों के कुलों के
  rationale: מִשְׁפָּחוֹת विस्तृत पारिवारिक समूहों को दर्शाता है; इस गोत्रीय संदर्भ में ‘कुल’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है। הַקְּהָתִי को सामूहिक बहुवचन ‘कहातियों’ से व्यक्त किया गया है।
- source_word: מִבְּנֵי לֵוִי
  choice: लेवी के वंशजों में से
  rationale: मूल की वंशावली-संरचना और व्यापक लेवीय समूह से संबंध दोनों सुरक्षित रहते हैं।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अगले कथन को पहले आवंटन का कारण बताने वाला स्पष्ट कारणवाचक संबंध मानता है।
- source_word: לָהֶם הָיָה הַגּוֹרָל רִאשֹׁנָה
  choice: पहला चिट्ठा उन्हीं के लिए निकला था
  rationale: ‘चिट्ठा निकलना’ आवंटन के लिए डाली गई चिट्ठी का स्वाभाविक हिंदी मुहावरा है। ‘उन्हीं’ मूल के לָהֶם पर प्रसंगानुकूल बल देता है और רִאשֹׁנָה को ‘पहला’ व्यक्त करता है।
