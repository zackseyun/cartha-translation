  text: וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל לַ/לְוִיִּ֛ם מִ/נַּחֲלָתָ֖/ם אֶל פִּ֣י יְהוָ֑ה אֶת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/אֶת מִגְרְשֵׁי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/003.yaml
  text: So the sons of Israel gave to the Levites[a], from their inheritance, at the command of Yahweh[c][b], these cities and their pasturelands.
translation:
  language: hi
  text: तब इस्राएल के पुत्रों[a] ने याहवे के आदेश[b] के अनुसार अपनी विरासत में से इन नगरों और इनके चारों ओर की खुली भूमि[c] लेवियों को दे दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों।” इब्रानी में शाब्दिक अर्थ “इस्राएल के पुत्रों” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “याहवे के मुख के अनुसार” है; यह वाक्यांश उनके आदेश को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात इन नगरों से लगी खुली भूमि; इसमें पशुओं को चराने का क्षेत्र भी शामिल हो सकता था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: दे दीं
  rationale: נתן का मूल अर्थ ‘देना’ है। भूमि-वितरण के प्रसंग में ‘सौंपना’ संभव है, पर ‘दे दीं’ इब्रानी के अधिक निकट और स्वाभाविक है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पारिवारिक अभिव्यक्ति का सीधा रूप है; अधिक सहज सामूहिक विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: לַלְוִיִּם
  choice: लेवियों को
  rationale: यह दान पाने वाले समूह को दर्शाने वाला सीधा दैविक प्रयोग है।
- source_word: מִנַּחֲלָתָם
  choice: अपनी विरासत में से
  rationale: נחלה यहाँ गोत्रों को विरासत के रूप में मिली भूमि को दर्शाता है; यह रूप संक्षिप्त रहते हुए उस अर्थ को बनाए रखता है।
- source_word: אֶל פִּי יְהוָה
  choice: याहवे के आदेश के अनुसार
  rationale: אֶל־פִּי का प्रसंगगत मुहावरेदार अर्थ ‘के आदेश के अनुसार’ है; शाब्दिक रूप ‘के मुख के अनुसार’ पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה का लिप्यंतरण किया गया है, न कि उसके स्थान पर कोई उपाधि रखी गई है।
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ये नगर
  rationale: यह संकेतवाचक पदबंध का सीधा और स्वाभाविक अनुवाद है।
- source_word: מִגְרְשֵׁיהֶן
  choice: उनकी चरागाहें
  rationale: מִגְרָשׁ नगर से जुड़ी खुली भूमि को दर्शाता है, जिसका उपयोग विशेषतः पशुओं को चराने के लिए होता था; ‘चरागाहें’ आधुनिक पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि से नहीं बदलता।
- issue: בְנֵי יִשְׂרָאֵל की पारिवारिक अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मुख्य पाठ में मूल की स्पष्ट पुल्लिंग पारिवारिक अभिव्यक्ति रखी गई है, जबकि उसके स्वाभाविक सामूहिक अर्थ को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। मुख्य पाठ में मूल इब्रानी की पारिवारिक अभिव्यक्ति और ईश्वरीय नाम को रखा गया है; कठिन मुहावरे तथा सांस्कृतिक भूमि-शब्द पादटिप्पणियों में स्पष्ट किए गए हैं।
