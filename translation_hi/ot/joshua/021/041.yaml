base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/041.yaml
  text: All the cities of the Levites within the possession of the sons of Israel were forty-eight cities[b][a], with their pasturelands.
translation:
  language: hi
  text: इस्राएल के पुत्रों की भूमि-संपत्ति के भीतर लेवियों के सभी नगर—उनके चरागाहों[a] समेत—अड़तालीस नगर थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके खुले भू-भागों” अथवा “उनकी सामुदायिक भूमियों” समेत; इब्रानी शब्द नगरों के चारों ओर की भूमि को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל עָרֵי הַלְוִיִּם
  choice: लेवियों के सभी नगर
  rationale: इब्रानी संबंधवाचक संरचना ‘लेवियों के नगर’ को स्पष्ट रूप से बनाए रखते हुए כֹּל की समग्रता को ‘सभी’ से व्यक्त किया गया है।
- source_word: בְּתוֹךְ אֲחֻזַּת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों की संपत्ति के बीच
  rationale: בְּתוֹךְ को स्थान-सूचक ‘के बीच’ और אֲחֻזָּה को भू-भाग/अधिकार में मिली मिल्कियत के अर्थ में ‘संपत्ति’ कहा गया है; בְּנֵי יִשְׂרָאֵל की औपचारिक पुरुषवाची अभिव्यक्ति भी सुरक्षित है।
- source_word: עָרִים אַרְבָּעִים וּשְׁמֹנֶה
  choice: अड़तालीस नगर थे
  rationale: इब्रानी की समानाधिकरणात्मक संख्या-सूचना को स्वाभाविक पूर्ण हिन्दी वाक्य बनाने के लिए ‘थे’ के साथ प्रस्तुत किया गया है।
- source_word: וּמִגְרְשֵׁיהֶן
  choice: उनकी चरागाहों समेत
  rationale: מִגְרָשׁ नगरों के चारों ओर उनसे संबद्ध खुले भू-भाग को दर्शाता है, जिसका इस संदर्भ में मुख्य उपयोग पशुओं के चरने के लिए था; ‘चरागाह’ सरल और संदर्भानुकूल है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का राष्ट्रीय और व्याकरणतः पुरुषवाची पदनाम
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल की संतान
  rationale: मूल पाठ की औपचारिक संरचना और पुरुषवाची रूप को सुरक्षित रखा गया है, यद्यपि यह पद पूरे इस्राएली समुदाय का सामूहिक राष्ट्रीय नाम है।
- issue: אֲחֻזָּה का भूमि-संबंधी अर्थ
  choice: संपत्ति
  alternative: विरासत / अधिकार की भूमि
  rationale: यहाँ आशय इस्राएल के अधिकार में आए भू-भाग से है। ‘संपत्ति’ उस स्थानिक अर्थ को रखती है और ‘विरासत’ से जुड़ी अतिरिक्त धर्मवैचारिक छाया को अनिवार्य नहीं बनाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मूल इब्रानी संरचना के निकट पाठ। संख्या पर जोर देने वाली इब्रानी सारांश-रचना को डैशों के माध्यम से स्वाभाविक हिन्दी में रखा गया है।
