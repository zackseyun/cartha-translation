base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/025.yaml
  text: 'And from the half-tribe of Manasseh: Taanach with its pasturelands[a], and Gath-rimmon with its pasturelands—two cities.'
translation:
  language: hi
  text: 'और मनश्शे के आधे गोत्र में से: तानाक और उसकी चरागाहें[a], और गत-रिम्मोन और उसकी चरागाहें—दो नगर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ इब्रानी पांडुलिपियों और 1 इतिहास 6:70 के समानांतर विवरण में मनश्शे से दिए गए नगरों के नाम अलग हैं।
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה
  choice: और ... के आधे गोत्र में से
  rationale: מִן स्रोत अथवा आवंटन को सूचित करता है और מַחֲצִית מַטֵּה का स्वाभाविक हिन्दी रूप ‘आधे गोत्र’ है।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: इब्रानी व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: תַּעְנַךְ
  choice: तानाक
  rationale: नगर के नाम का स्रोत-अनुरूप और हिन्दी में सुबोध लिप्यंतरण।
- source_word: מִגְרָשֶׁהָ
  choice: उसकी चरागाहें
  rationale: מִגְרָשׁ नगर से जुड़ी खुली भूमि, विशेषकर पशुओं के चरने की भूमि, को दर्शाता है; स्त्रीलिंग एकवचन प्रत्यय प्रत्येक नगर की ओर संकेत करता है।
- source_word: גַּת רִמּוֹן
  choice: गत-रिम्मोन
  rationale: संयुक्त स्थान-नाम का स्रोत-अनुरूप हिन्दी लिप्यंतरण।
- source_word: עָרִים שְׁתָּיִם
  choice: दो नगर
  rationale: सूची के अंत में दिए गए दोनों स्थानों की स्पष्ट गणना; עָרִים के लिए ‘नगर’ गरिमापूर्ण और प्रचलित रूप है।
