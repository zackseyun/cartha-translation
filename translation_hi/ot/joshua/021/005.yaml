  text: וְ/לִ/בְנֵ֨י קְהָ֜ת הַ/נּוֹתָרִ֗ים מִ/מִּשְׁפְּחֹ֣ת מַטֵּֽה אֶ֠פְרַיִם וּֽ/מִ/מַּטֵּה דָ֞ן וּ/מֵ/חֲצִ֨י מַטֵּ֧ה מְנַשֶּׁ֛ה בַּ/גּוֹרָ֖ל עָרִ֥ים עָֽשֶׂר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/005.yaml
  text: And for the remaining sons of Kohath[a], from the clans of the tribe of Ephraim, from the tribe of Dan, and from the half-tribe of Manasseh, there were by lot ten cities.
translation:
  language: hi
  text: और कहात के शेष वंशजों को एप्रैम के गोत्र के कुलों में से, दान के गोत्र से, और मनश्शे के आधे गोत्र से चिट्ठी डालकर दस नगर दिए गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִבְנֵי קְהָת הַנּוֹתָרִים
  choice: और शेष कहातियों को
  rationale: בני קהת वंशजों अथवा कहाती कुल-समूह को सूचित करता है। प्रसंग में पहले दिए गए कहातियों से अलग बचे हुए समूह का संकेत है; इसलिए स्वाभाविक हिन्दी में ‘शेष कहातियों’ रखा गया है, और अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: מִמִּשְׁפְּחֹת מַטֵּה אֶפְרַיִם
  choice: एप्रैम के गोत्र के कुलों में से
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर के कुल अथवा वंश-समूह को दर्शाता है, जबकि מַטֶּה जनजातीय ‘गोत्र’ है।
- source_word: וּמִמַּטֵּה דָן
  choice: दान के गोत्र में से
  rationale: מַטֶּה इस वितरण-संदर्भ में छड़ी नहीं, बल्कि गोत्रीय इकाई को दर्शाता है।
- source_word: וּמֵחֲצִי מַטֵּה מְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र में से
  rationale: यह मनश्शे गोत्र के भौगोलिक और प्रशासनिक विभाजन का पारंपरिक, स्पष्ट हिन्दी रूप है।
- source_word: בַּגּוֹרָל
  choice: चिट्ठी द्वारा
  rationale: גּוֹרָל वितरण का निर्णय करने के लिए डाली गई चिट्ठी को दर्शाता है; ‘चिट्ठी द्वारा’ साधनात्मक अर्थ बनाए रखता है।
- source_word: עָרִים עָשֶׂר
  choice: दस नगर
  rationale: עִיר के लिए इस भू-वितरण सूची में ‘नगर’ सहज और सटीक है।
- source_word: implicit verbless clause
  choice: मिले
  rationale: इब्रानी सूची-शैली में क्रिया निहित है। हिन्दी में ‘मिले’ वितरण के प्रसंग को स्वाभाविक रूप से व्यक्त करता है, बिना किसी अतिरिक्त कर्ता को जोड़े।
theological_decisions: []
