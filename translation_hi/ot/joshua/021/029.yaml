- source_word: יַרְמוּת
  choice: यर्मूत
  rationale: स्थान-नाम को हिब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִגְרָשֶׁהָ
  choice: उसकी चरागाहें
  rationale: नगर के चारों ओर पशुओं के चरने और सामुदायिक उपयोग के लिए निर्धारित खुली भूमि इस सूची के संदर्भ में अभिप्रेत है; स्त्रीलिंग एकवचन प्रत्यय प्रत्येक नगर की ओर संकेत करता है।
- source_word: עֵין גַּנִּים
  choice: एन-गन्नीम
  rationale: स्थान-नाम का अर्थानुवाद न करके हिब्रानी रूप के निकट लिप्यंतरण किया गया है।
- source_word: עָרִים אַרְבַּע
  choice: कुल चार नगर
  rationale: सूची के अंत की गणनात्मक सार-सूचना को स्वाभाविक आधुनिक हिन्दी में स्पष्ट किया गया है।
