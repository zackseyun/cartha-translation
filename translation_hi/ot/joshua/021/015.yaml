  text: Holon with its pasturelands[a], and Debir with its pasturelands.
translation:
  language: hi
  text: और होलोन को उसकी चरागाहों[a] समेत, और दबीर को उसकी चरागाहों समेत।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 इतिहास 6:58 की समानांतर सूची में इस नगर का नाम ‘हीलेन’ है; यहाँ यहोशू के पाठ में ‘होलोन’ है।
    reason: cross_reference
lexical_decisions:
- source_word: חֹלֹן
  choice: होलोन
  rationale: नगर के नाम का मूल हिब्रू पाठ के अनुसार देवनागरी में लिप्यंतरण किया गया है; समानांतर सूची में भिन्न रूप मिलने की सूचना पादटिप्पणी में दी गई है।
- source_word: מִגְרָשֶׁהָ
  choice: उसकी चरागाहों समेत
  rationale: מִגְרָשׁ नगर से जुड़ी खुली सामुदायिक भूमि को दर्शाता है, जिसका उपयोग विशेष रूप से पशु चराने के लिए होता था। हिंदी में ‘चरागाहों’ इस संदर्भ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है; स्त्रीलिंग एकवचन प्रत्यय का संबंध प्रत्येक नगरी से है।
- source_word: דְּבִר
  choice: दबीर
  rationale: यह स्थानवाचक नाम है, इसलिए इसका अर्थानुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: וְאֶת
  choice: और … को
  rationale: וְ का अर्थ ‘और’ रखा गया है और निश्चित कर्मसूचक אֶת को हिंदी के स्वाभाविक कर्मचिह्न ‘को’ से व्यक्त किया गया है। नगर और उसकी चरागाहों का संबंध ‘समेत’ द्वारा सहज ढंग से दिखाया गया है।
