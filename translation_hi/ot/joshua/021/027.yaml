source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י גֵרְשׁוֹן֮ מִ/מִּשְׁפְּחֹ֣ת הַ/לְוִיִּם֒ מֵ/חֲצִ֞י מַטֵּ֣ה מְנַשֶּׁ֗ה אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת גלון בַּ/בָּשָׁן֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶֽת בְּעֶשְׁתְּרָ֖ה וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שְׁתָּֽיִם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/027.yaml
  text: And to the sons of Gershon[a], from the clans of the Levites, from the half-tribe of Manasseh, they gave Golan in Bashan, the city of refuge for the manslayer, with its pasturelands, and Beeshterah with its pasturelands—two cities.
translation:
  language: hi
  text: और लेवियों के कुलों में से गेर्शोन के वंशजों को मनश्शे के आधे गोत्र की ओर से बाशान में गोलान—मनुष्य-वध करने वाले के लिए शरण-नगर—उसकी चरागाहों समेत, और बेश्तेरा[a] उसकी चरागाहों समेत दिए गए—कुल दो नगर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘बेश्तेरा’; तुलना करें 1 इतिहास 6:71, जहाँ ‘अश्तारोत’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: गेर्शोन के वंशजों को
  rationale: בני का शाब्दिक अर्थ ‘पुत्र’ है, पर गोत्रीय आवंटन के इस संदर्भ में यह व्यापक वंशज-समूह को सूचित करता है; ‘वंशज’ आधुनिक हिन्दी में अर्थ को स्वाभाविक और स्पष्ट रखता है।
- source_word: מִ/מִּשְׁפְּחֹת הַ/לְוִיִּם
  choice: लेवियों के कुलों में से
  rationale: מִשְׁפָּחוֹת यहाँ बड़े गोत्र के भीतर के नातेदारी-आधारित उपसमूह हैं; ‘कुल’ इस प्रशासनिक-वंशीय संदर्भ में उपयुक्त है।
- source_word: מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र की ओर से
  rationale: מַטֶּה भूमि-विभाजन के संदर्भ में ‘गोत्र’ है। ‘की ओर से’ प्राप्तकर्ता और देनेवाले गोत्र के बीच संबंध को हिन्दी में स्पष्ट करता है, जबकि मूल का מִן-संबंध बनाए रखता है।
- source_word: עִיר מִקְלַט הָ/רֹצֵחַ
  choice: मनुष्य-वध करनेवाले के लिए शरण-नगर
  rationale: यह व्यवस्था का पारिभाषिक पद है। ‘शरण-नगर’ מִקְלָט का संक्षिप्त और स्पष्ट रूप है; ‘मनुष्य-वध करनेवाला’ רֹצֵחַ को केवल पूर्वनियोजित ‘हत्यारा’ मानकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: גלון בַּ/בָּשָׁן
  choice: बाशान में गोलान
  rationale: दोनों स्थान-नामों का देवनागरी लिप्यंतरण किया गया है और בְּ का स्थानवाचक अर्थ ‘में’ से व्यक्त किया गया है।
- source_word: מִגְרָשֶׁ/הָ
  choice: उसकी चरागाहों समेत
  rationale: מִגְרָשׁ लेवीय नगर के आसपास पशु चराने और संबंधित उपयोग के लिए खुली भूमि को सूचित करता है; ‘चरागाहों’ सामान्य पाठक के लिए सहज है।
- source_word: בְּעֶשְׁתְּרָה
  choice: बेश्तेरा
  rationale: मुख्य पाठ में मसोरेटिक पाठ का स्थान-नाम रखा गया है; 1 इतिहास 6:71 के भिन्न नाम को सामंजस्य बैठाकर मुख्य पाठ में नहीं लाया गया, बल्कि पाद-टिप्पणी में बताया गया है।
- source_word: עָרִים שְׁתָּיִם
  choice: कुल दो नगर
  rationale: यह सूची के अंत में नगरों की संख्या का सार है; ‘कुल’ हिन्दी में इस समापन-भूमिका को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: implicit verbal sense in allotment list
  choice: दिए गए
  rationale: इस पद में सीमित क्रिया व्यक्त नहीं है; आसपास के आवंटन-सूत्र से ‘देना’ निहित है। हिन्दी वाक्य पूर्ण करने के लिए कर्मवाच्य ‘दिए गए’ रखा गया है, जिससे अनुल्लिखित कर्ता जोड़ा नहीं जाता।
theological_decisions:
- issue: הָרֹצֵחַ की कानूनी सीमा
  choice: मनुष्य-वध करनेवाला
  alternative: हत्यारा / अनजाने में हत्या करनेवाला
  rationale: ‘हत्यारा’ पूर्वनियोजित हत्या का आभास दे सकता है, जबकि ‘अनजाने में’ मूल पद में प्रत्यक्षतः नहीं है, भले ही शरण-नगर की व्यवस्था में वह महत्त्वपूर्ण संदर्भ हो। चुना हुआ रूप कानूनी तनाव और मूल की व्यापकता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वंशीय-प्रशासनिक शब्दावली में ‘कुल’ और ‘गोत्र’, तथा कानूनी संस्था के लिए ‘शरण-नगर’ का प्रयोग किया गया है। मूल में क्रिया के अभाव को हिन्दी में कर्मवाच्य से पूरा किया गया है।
