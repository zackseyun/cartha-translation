  text: गेर्शोनियों के कुलों के सब नगर—उनके चरागाहों समेत—तेरह नगर थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: सब नगर
  rationale: כָּל पूरे समूह को समेटता है और עָרֵי का इस भूमि-वितरण प्रसंग में स्वाभाविक हिन्दी रूप ‘नगर’ है।
- source_word: הַגֵּרְשֻׁנִּי
  choice: गेर्शोनियों
  rationale: निश्चित जातिवाचक एकवचन यहाँ गेर्शोन के वंशजों के समुदाय के लिए सामूहिक रूप से प्रयुक्त है; हिन्दी में बहुवचन ‘गेर्शोनी’ स्वाभाविक है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: לְ यहाँ वर्गीकरण अथवा कुल-आधारित वितरण का भाव देता है; ‘के अनुसार’ इस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: तेरह नगर
  rationale: हिन्दी की सामान्य संख्या-संज्ञा क्रम-रचना अपनाई गई है और עִיר के लिए पूरे पद में ‘नगर’ की संगति रखी गई है।
- source_word: וּמִגְרְשֵׁיהֶן
  choice: चरागाहों समेत
  rationale: מִגְרָשׁ इन नगर-वितरण पदों में नगर से लगी पशु चराने की खुली भूमि को दर्शाता है; ‘चरागाहों समेत’ संयुक्त गणना के सूत्र को संक्षेप और स्पष्ट रूप में देता है।
