  rationale: इब्रानी में שְׂדֵה एकवचन संबंध-रूप में है। हिंदी में ‘नगर का खेत’ उसका रूप और नगर से जुड़ी कृषि-भूमि का सामूहिक भाव दोनों बनाए रखता है।
- source_word: חֲצֵרֶיהָ
  choice: उसकी बस्तियाँ
  rationale: חֲצֵרֶיהָ यहाँ नगर से संबद्ध आश्रित या बाहरी बस्तियों को सूचित कर सकता है। ‘बस्तियाँ’ प्रसंग में स्वाभाविक है और इसे अनावश्यक रूप से चरागाह नहीं बनाता।
- source_word: נָתְנוּ
  choice: उन्होंने ... दे दीं
  rationale: נתן का सामान्य अर्थ ‘देना’ है। हिंदी में निकटवर्ती स्त्रीलिंग बहुवचन ‘बस्तियाँ’ के कारण संयुक्त कर्म के साथ ‘दे दीं’ सहज है।
- source_word: לְכָלֵב בֶּן־יְפֻנֶּה
  choice: यपुन्ने के पुत्र कालेब को
  rationale: लकार को अप्रत्यक्ष कर्म ‘को’ से व्यक्त किया गया है और नामों को प्रचलित हिंदी बाइबलीय रूप में रखा गया है।
- source_word: בַּאֲחֻזָּתוֹ
  choice: उसकी निज सम्पत्ति के रूप में
  rationale: אֲחֻזָּה भूमि पर वैधानिक अधिकार या स्थायी स्वामित्व को दर्शाता है। ‘निज सम्पत्ति’ इसे उत्तराधिकार की प्रक्रिया तक सीमित किए बिना स्पष्ट करता है।
- source_word: וְאֶת
  choice: परन्तु
  rationale: 'आरंभिक וְ पिछले पद से विरोधात्मक संबंध बनाता है: नगर का दिया जाना एक ओर, जबकि उसका खेत और बस्तियाँ कालेब को दिए गए। ‘परन्तु’ इस संबंध को स्वाभाविक हिंदी में स्पष्ट करता है।'
