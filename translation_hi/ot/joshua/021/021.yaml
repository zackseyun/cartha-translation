  yaml_path: translation/ot/joshua/021/021.yaml
  text: They gave them Shechem with its pasturelands in the hill country of Ephraim[a], the city of refuge for the manslayer[b], and Gezer with its pasturelands.
translation:
  language: hi
  text: उन्होंने उन्हें एप्रैम के पहाड़ी प्रदेश में स्थित शकेम—किसी की मृत्यु का कारण बननेवाले के लिए शरण-नगर[a]—और उसकी चरागाहें, तथा गेजेर और उसकी चरागाहें दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “मारनेवाले के लिए शरण-नगर।” यहाँ प्रयुक्त हिब्रू कानूनी पद ऐसे व्यक्ति को भी दर्शा सकता है जिसने किसी की मृत्यु कर दी हो और निर्णय होने तक शरण ले सकता हो; वह आवश्यक रूप से जानबूझकर हत्या का दोषी सिद्ध व्यक्ति नहीं है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לָהֶם
  choice: उन्होंने उन्हें ... दीं
  rationale: नतन के कथात्मक भूतकाल और लेवियों को दिए जाने के अप्रत्यक्ष कर्म को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: अनजाने में किसी की जान लेनेवाले के लिए शरण-नगर
  rationale: यह कानूनी प्रसंग उस व्यक्ति की ओर संकेत करता है जो किसी की मृत्यु का कारण बना और न्याय होने तक शरण ले सकता था; हिन्दी में केवल ‘हत्यारा’ कहना जानबूझकर हत्या और सिद्ध अपराध का भाव ला सकता है। प्रसंग-स्पष्टता के लिए ‘अनजाने में’ मुख्य पाठ में रखा गया है, जबकि पद का अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: שְׁכֶם
  choice: शकेम
  rationale: हिब्रू स्थान-नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी चरागाहें
  rationale: नगर से लगी पशु चराने और सामुदायिक उपयोग की खुली भूमि को सरल तथा प्रसंगानुकूल हिन्दी में व्यक्त करता है।
- source_word: בְּהַר אֶפְרָיִם
  choice: एप्रैम के पहाड़ी प्रदेश में
  rationale: यहाँ הַר किसी एक पर्वत के बजाय एप्रैम के पहाड़ी भूभाग का भौगोलिक नाम है।
- source_word: גֶּזֶר
  choice: गेजेर
  rationale: हिब्रू स्थान-नाम का हिन्दी लिप्यंतरण।
theological_decisions:
- issue: הָרֹצֵחַ में दोष और आशय का प्रश्न
  choice: अनजाने में किसी की जान लेनेवाला
  alternative: हत्यारा / जान लेनेवाला
  rationale: व्यवस्था के शरण-नगर संबंधी कानूनी संदर्भ में व्यक्ति को पहले से अपराधी हत्यारा ठहराना उचित नहीं। फिर भी हिब्रू शब्द की व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्थान-नामों के लिए प्रचलित हिन्दी रूप अपनाए गए हैं। शरण-नगर वाले पदबंध को डैश के बीच रखकर शकेम की व्याख्या के रूप में स्पष्ट किया गया है।
