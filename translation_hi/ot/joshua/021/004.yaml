base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/004.yaml
  text: Then the lot came out for the families of the Kohathites[a], and for the sons of Aaron the priest, from among the Levites, there fell by lot thirteen cities from the tribe of Judah, from the tribe of Simeon, and from the tribe of Benjamin.
translation:
  language: hi
  text: तब कहातियों के कुलों के लिए चिट्ठी निकली[a]। लेवियों में से हारून याजक के पुत्रों को यहूदा के गोत्र, शिमोन के गोत्र और बिन्यामीन के गोत्र में से चिट्ठी द्वारा तेरह नगर मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चिट्ठी पड़ी।” इब्रानी मुहावरे का शाब्दिक अर्थ “चिट्ठी निकली” है, पर इसे “चिट्ठी पड़ी” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: चिट्ठी निकली
  rationale: यह इब्रानी मुहावरे की ठोस छवि को बनाए रखता है और हिन्दी में चिट्ठी डालकर निर्णय किए जाने के संदर्भ में समझ में आता है।
- source_word: לְמִשְׁפְּחֹת הַקְּהָתִי
  choice: कहातियों के कुलों के लिए
  rationale: מִשְׁפְּחֹת यहाँ विस्तृत पारिवारिक समूहों या कुलों को सूचित करता है; ‘कुलों’ इस सामाजिक इकाई को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: हारून याजक के पुत्रों को ... मिले
  rationale: इब्रानी संबंधवाचक अभिव्यक्ति ‘हारून के पुत्र’ को बनाए रखते हुए हिन्दी में आवंटन का अर्थ स्वाभाविक रूप से स्पष्ट किया गया है।
- source_word: מִן הַלְוִיִּם
  choice: लेवियों में से
  rationale: यह पदबंध हारून के पुत्रों को लेवियों के व्यापक समुदाय के भीतर एक समूह के रूप में पहचानता है; ‘में से’ उसके अंशवाचक बल को व्यक्त करता है।
- source_word: מִמַּטֵּה יְהוּדָה וּמִמַּטֵּה הַשִּׁמְעֹנִי וּמִמַּטֵּה בִנְיָמִן
  choice: यहूदा के गोत्र, शिमोन के गोत्र और बिन्यामीन के गोत्र में से
  rationale: מַטֶּה यहाँ जनजातीय विभाग के अर्थ में है। प्रत्येक नाम के साथ ‘गोत्र’ दोहराने से मूल की संरचना और अर्थ स्पष्ट रहते हैं।
- source_word: בַּגּוֹרָל
  choice: चिट्ठी द्वारा
  rationale: पूर्वसर्ग यहाँ आवंटन के साधन को दर्शाता है; ‘चिट्ठी द्वारा’ उसी प्रक्रिया को स्वाभाविक हिन्दी में बताता है।
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: तेरह नगर
  rationale: עָרִים के लिए ‘नगर’ क्षेत्रीय आवंटन के प्रसंग में सुसंगत और गरिमापूर्ण हिन्दी शब्द है।
