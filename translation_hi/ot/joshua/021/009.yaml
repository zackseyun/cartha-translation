base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/009.yaml
  text: 'From the tribe of the sons of Judah and from the tribe of the sons of Simeon they gave these cities[a], which are called by name:'
translation:
  language: hi
  text: 'उन्होंने यहूदा के पुत्रों के गोत्र और शिमोन के पुत्रों के गोत्र से ये नगर[a] दिए, जिनके नाम ये हैं:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिनका नाम लेकर उल्लेख किया गया है” या “जिनके नाम निर्दिष्ट किए गए हैं।” इब्रानी अभिव्यक्ति संकेत करती है कि आगे की सूची में इन नगरों के नाम अलग-अलग दिए गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: उन्होंने ... दिए
  rationale: נתן का मूल अर्थ ‘देना’ है; यहाँ लेवीय नगरों के बँटवारे के संदर्भ में इसका भाव सौंपने या प्रदान करने का है। सीधे और स्वाभाविक हिंदी रूप ‘दिए’ रखा गया है।
- source_word: מִמַּטֵּה
  choice: के गोत्र में से
  rationale: מַטֶּה का शाब्दिक अर्थ ‘लाठी’ भी हो सकता है, पर भूमि-विभाजन के इस संदर्भ में यह ‘गोत्र’ का द्योतक है।
- source_word: בְּנֵי יְהוּדָה
  choice: यहूदा के वंशजों
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, किंतु यहाँ यह यहूदा से निकले गोत्रीय समुदाय को दर्शाता है। ‘वंशजों’ आधुनिक हिंदी में वंश-संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּמִמַּטֵּה בְּנֵי שִׁמְעוֹן
  choice: और शिमोन के वंशजों के गोत्र में से
  rationale: यह पहले पदांश की समानांतर संरचना बनाए रखता है और शिमोन के वंशगत गोत्रीय समुदाय को स्पष्ट करता है।
- source_word: אֵת הֶעָרִים הָאֵלֶּה
  choice: ये नगर
  rationale: यह सीधा कर्म है; עָרִים के लिए भूमि-विभाजन की सूची में ‘नगर’ उपयुक्त और मानक हिंदी शब्द है।
- source_word: אֲשֶׁר יִקְרָא אֶתְהֶן בְּשֵׁם
  choice: जिनके नाम ये हैं
  rationale: इब्रानी मुहावरे का आशय है कि आगे नगरों के नाम अलग-अलग बताए जाएंगे। यह हिंदी रूप उस अर्थ को स्वाभाविक ढंग से देता है, जबकि वैकल्पिक अधिक शाब्दिक अर्थ पाद-टिप्पणी में सुरक्षित है।
