lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: हेशबोन
  rationale: स्थान-नाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִגְרָשֶׁהָ
  choice: उसकी चरागाहें
  rationale: מִגְרָשׁ नगर से संबंधित खुली भूमि को दर्शाता है, जिसका उपयोग प्रायः पशु चराने के लिए होता था; स्त्रीलिंग एकवचन प्रत्यय नगर की ओर संकेत करता है।
- source_word: יַעְזֵר
  choice: याजेर
  rationale: स्थान-नाम को इब्रानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: כָּל עָרִים אַרְבַּע
  choice: कुल चार नगर
  rationale: इब्रानी का शाब्दिक विन्यास ‘सब नगर, चार’ है; स्वाभाविक आधुनिक हिन्दी में इसका सारांश ‘कुल चार नगर’ है।
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: और ... और
  rationale: दोहराया गया אֶת प्रत्यक्ष कर्म को चिह्नित करता है और हिन्दी में उसका अलग शब्दगत अनुवाद आवश्यक नहीं; सूची का संबंध समुच्चयबोधक ‘और’ से व्यक्त किया गया है।
