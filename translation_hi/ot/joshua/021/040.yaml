  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। हिब्रू की पुनरुक्त संरचना को सहज हिन्दी संबंधवाचक वाक्य में बदला गया है, जबकि मरारी के वंशजों की पहचान, पारिवारिक विभाजन, शेष लेवी समूह और चिट्ठी द्वारा आवंटन—सभी अर्थगत तत्व सुरक्षित हैं।
