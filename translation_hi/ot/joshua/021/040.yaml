base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/040.yaml
  text: All the cities for the sons of Merari[b][a], by their families—the remaining ones from the families of the Levites—were twelve cities by lot.
translation:
  language: hi
  text: मरारी के वंशजों[a] के परिवारों को—जो लेवियों के परिवारों में से शेष थे[b]—चिट्ठी के द्वारा कुल बारह नगर मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मरारी के पुत्रों।”
    reason: lexical_alternative
  - marker: b
    text: या, “लेवियों के कुलों में से जो शेष थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: कुल ... नगर
  rationale: כָּל यहाँ आवंटित नगरों की समग्र संख्या बताता है; हिन्दी में संख्या के साथ ‘कुल बारह नगर’ स्वाभाविक है। עִיר को इस आवंटन-सूची में ‘नगर’ किया गया है।
- source_word: לִבְנֵי מְרָרִי
  choice: मरारी के वंशजों को
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर वंशगत और आवंटन-संदर्भ में यह बाद की पीढ़ियों सहित वंशजों को सूचित करता है; ‘वंशज’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: के परिवारों को
  rationale: מִשְׁפָּחָה परिवार अथवा कुल को दर्शा सकता है। ‘परिवार’ सरल और स्वाभाविक है तथा बहुवचन व पारिवारिक विभाजन को बनाए रखता है।
- source_word: הַנּוֹתָרִים מִמִּשְׁפְּחוֹת הַלְוִיִּם
  choice: जो लेवी के परिवारों में शेष थे
  rationale: संबंधवाचक उपवाक्य हिब्रू के substantival participle הַנּוֹתָרִים को सहज हिन्दी में व्यक्त करता है और उन्हें व्यापक लेवी परिवारों का शेष भाग बताता है।
- source_word: וַיְהִי גּוֹרָלָם
  choice: चिट्ठी डालकर ... मिले
  rationale: גּוֹרָל आवंटन निर्धारित करने वाली चिट्ठी को सूचित करता है। हिन्दी वाक्य में ‘मिले’ जोड़ने से प्राप्त आवंटन का भाव स्वाभाविक ढंग से व्यक्त होता है।
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: बारह नगर
  rationale: हिन्दी की सामान्य शब्द-व्यवस्था के अनुसार संख्या संज्ञा से पहले रखी गई है।
