  yaml_path: translation/ot/joshua/021/034.yaml
  text: 'And to the families of the sons of Merari[a], the remaining Levites, from the tribe of Zebulun: Jokneam with its pasturelands, and Kartah with its pasturelands.'
translation:
  language: hi
  text: 'और शेष लेवियों में से मरारी के वंशजों के कुलों को जबूलून के गोत्र से ये नगर मिले: योकनाम और उसकी चरागाहें, तथा कर्ता[a] और उसकी चरागाहें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थाननाम को कुछ अनुवादों में “कार्था” भी लिखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִשְׁפְּחוֹת
  choice: और ... कुलों को
  rationale: संयोजक और संबंधसूचक उपसर्ग पिछले पद से नगर-वितरण की सूची को आगे बढ़ाते हैं। מִשְׁפָּחוֹת के लिए ‘कुलों’ आधुनिक हिन्दी में जनजातीय उपसमूह का स्वाभाविक शब्द है।
- source_word: בְּנֵי מְרָרִי
  choice: मरारी के वंशजों
  rationale: यह वंश-सूचक इब्रानी प्रयोग है; हिन्दी में ‘वंशज’ अभिप्रेत सामूहिक अर्थ को ‘पुत्रों’ से अधिक स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַלְוִיִּם הַנּוֹתָרִים
  choice: शेष लेवियों में से
  rationale: वाक्य में मरारी के वंशजों के कुलों को उन लेवियों के शेष समूह के रूप में पहचानता है जिन्हें पिछली सूचियों में नगर नहीं दिए गए थे।
- source_word: מֵאֵת מַטֵּה זְבוּלֻן
  choice: जबूलून के गोत्र से
  rationale: इस भूमि-वितरण प्रसंग में מַטֶּה का अर्थ ‘गोत्र’ है और מֵאֵת आवंटन के स्रोत को बताता है।
- source_word: יָקְנְעָם
  choice: योकनाम
  rationale: इब्रानी स्थाननाम का ध्वन्यात्मक देवनागरी लिप्यंतरण।
- source_word: מִגְרָשֶׁהָ
  choice: उसकी चरागाहें
  rationale: מִגְרָשׁ नगर के आसपास की खुली भूमि को सूचित करता है, विशेषकर पशुओं के चरने हेतु; बहुवचन ‘चरागाहें’ सूची की शैली में सहज है।
- source_word: קַרְתָּה
  choice: कर्ता
  rationale: इब्रानी स्थाननाम קַרְתָּה का निकट देवनागरी लिप्यंतरण; वैकल्पिक हिन्दी वर्तनी पादटिप्पणी में दी गई है।
