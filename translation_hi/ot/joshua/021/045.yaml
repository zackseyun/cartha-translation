source:
  edition: WLC
  text: לֹֽא נָפַ֣ל דָּבָ֔ר מִ/כֹּל֙ הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל בֵּ֣ית יִשְׂרָאֵ֑ל הַ/כֹּ֖ל בָּֽא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/045.yaml
  text: Not one word failed from all the good word that Yahweh had spoken to the house of Israel[a]; all of it came to pass.
translation:
  language: hi
  text: याहवे ने इस्राएल के घराने को जो सभी भले वचन कहे थे, उनमें से एक भी निष्फल नहीं हुआ[a]; सब कुछ पूरा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे ने इस्राएल के घराने को जो सभी भली प्रतिज्ञाएँ दी थीं, उनमें से एक भी निष्फल नहीं हुई।”
    reason: दָּבָר का प्रसंगानुसार ‘प्रतिज्ञा’ अर्थ संभव है, यद्यपि मूल शब्द अधिक व्यापक रूप से ‘बात/वचन’ भी हो सकता है।
lexical_decisions:
- source_word: לֹא נָפַל דָּבָר
  choice: एक भी बात निष्फल नहीं हुई
  rationale: शाब्दिक चित्र ‘एक बात भी नहीं गिरी’ है, पर इस प्रयोग में आशय कही हुई बात के विफल न होने से है। ‘निष्फल नहीं हुई’ अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: מִכֹּל הַדָּבָר הַטּוֹב
  choice: जो भी भली बात ... उसमें से
  rationale: ‘भली बात’ मूल के דָּבָר और הַטּוֹב को बनाए रखती है; ‘जो भी ... उसमें से’ समग्रता और विभाजक מִן का स्वाभाविक हिन्दी रूप है।
- source_word: אֲשֶׁר דִּבֶּר
  choice: जो ... कही थी
  rationale: यह पूर्व में किए गए ईश्वरीय कथन को सूचित करता है। ‘कही थी’ हिन्दी में स्वाभाविक है और דָּבָר के साथ वाचिक संबंध बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू चतुरक्षरीय निजी नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने से
  rationale: ‘घराना’ सामूहिक और वाचागत अभिव्यक्ति ‘इस्राएल का घर’ को स्वाभाविक हिन्दी में सुरक्षित रखता है। ‘से कहना’ हिन्दी में संबोधन के लिए स्वाभाविक प्रयोग है।
- source_word: הַכֹּל בָּא
  choice: सब कुछ पूरा हुआ
  rationale: मूलतः ‘सब आया’ एक पूर्ति-सूचक मुहावरा है। ‘सब कुछ पूरा हुआ’ उसके अभिप्रेत अर्थ को स्पष्ट करता है, बिना उसे केवल औपचारिक ‘प्रतिज्ञा-पूर्ति’ शब्दावली तक सीमित किए।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: דָּבָר को ‘बात’ या ‘प्रतिज्ञा’ कहना
  choice: मुख्य पाठ में ‘बात’
  alternative: ‘प्रतिज्ञा’
  rationale: ‘बात’ मूल शब्द की व्यापकता और ‘कही थी’ के साथ उसका संबंध सुरक्षित रखती है। प्रसंग में ‘प्रतिज्ञा’ उचित व्याख्यात्मक अर्थ है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली अपनाई गई है। ‘भली बात’ मूल की शाब्दिक व्यापकता रखती है, जबकि ‘निष्फल नहीं हुई’ और ‘पूरा हुआ’ हिब्रू मुहावरों का स्पष्ट हिन्दी रूप देते हैं।
