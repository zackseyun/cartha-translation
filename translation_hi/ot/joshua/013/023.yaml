  text: וַ/יְהִ֗י גְּבוּל֙ בְּנֵ֣י רְאוּבֵ֔ן הַ/יַּרְדֵּ֖ן וּ/גְב֑וּל זֹ֣את נַחֲלַ֤ת בְּנֵֽי רְאוּבֵן֙ לְ/מִשְׁפְּחֹתָ֔/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/023.yaml
  text: And the border of the sons of Reuben was the Jordan and its border. This was the inheritance of the sons of Reuben according to their clans[a], the cities and their villages.
translation:
  language: hi
  text: रूबेन के वंशजों की सीमा यरदन और उसकी सीमा थी।[a] यह रूबेन के वंशजों का उनके कुलों के अनुसार विरासत में मिला भाग था—नगर और उनके गाँव।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सीमा के रूप में यरदन।” इब्रानी पदबंध “यरदन और सीमा” संक्षिप्त है और इसका अर्थ यह भी हो सकता है कि यरदन ही सीमा-रेखा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי גְּבוּל
  choice: सीमा … थी
  rationale: सीमा-वर्णन के इस सूत्र में היה किसी परिवर्तन के बजाय सीमा की स्थिति बताता है; इसलिए स्वाभाविक हिंदी में भूतकाल का प्रयोग किया गया है।
- source_word: בְּנֵי רְאוּבֵן
  choice: रूबेन के वंशज
  rationale: यह चुनाव इब्रानी वंशावली-संबंधी मुहावरे को बनाए रखते हुए आधुनिक हिंदी में ‘पुत्रों’ की अपेक्षा अधिक स्पष्ट है, क्योंकि यहाँ पूरी गोत्रीय प्रजा अभिप्रेत है।
- source_word: הַיַּרְדֵּן וּגְבוּל
  choice: यरदन और उसकी सीमा
  rationale: इब्रानी पदबंध अत्यंत संक्षिप्त है। मुख्य पाठ उसकी संरचना और अस्पष्टता को यथासंभव सुरक्षित रखता है; संभावित अर्थ कि यरदन स्वयं सीमा था, पादटिप्पणी में दिया गया है।
- source_word: נַחֲלַת
  choice: विरासत में मिला भाग
  rationale: यह भूमि के गोत्रीय आवंटन और विरासत—दोनों भावों को साधारण आधुनिक हिंदी में स्पष्ट करता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: इस गोत्रीय भूमि-विभाजन के संदर्भ में מִשְׁפָּחוֹת परिवारों से बड़े कुलगत विभागों को सूचित करता है।
- source_word: הֶעָרִים וְחַצְרֵיהֶן
  choice: नगर और उनके गाँव
  rationale: עָרִים के लिए ‘नगर’ और उनसे संबद्ध छोटी, प्रायः बिना शहरपनाह वाली बस्तियों के लिए ‘गाँव’ सहज और संदर्भानुकूल हैं।
