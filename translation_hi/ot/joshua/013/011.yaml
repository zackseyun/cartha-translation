  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज भूगोल-सूची शैली रखी गई है। पद पिछले और अगले वाक्यांश से जुड़ा है, इसलिए अंत में डैश रखा गया है। व्यक्तिवाचक स्थान-नामों के रूप ‘गिलाद’, ‘हर्मोन’, ‘बाशान’ और ‘सल्का’ रखे गए हैं।
