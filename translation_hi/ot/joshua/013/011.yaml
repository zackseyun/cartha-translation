base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/011.yaml
  text: and Gilead[a], and the territory of the Geshurite and the Maacathite, and all Mount Hermon[b], and all Bashan as far as Salecah—
translation:
  language: hi
  text: और गिलाद, गशूरी और माकाती लोगों का क्षेत्र[a], पूरा हर्मोन पर्वत[b], और सल्का तक पूरा बाशान—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गशूरी और माकाती लोगों की सीमा।” इब्रानी शब्द का अर्थ सीमा-रेखा या किसी जाति का क्षेत्र—दोनों हो सकता है; यहाँ भूभागों की सूची में “क्षेत्र” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “पूरा हर्मोन पर्वत”; इसका आशय केवल चोटी नहीं, बल्कि हर्मोन का पूरा पर्वतीय क्षेत्र भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָד
  choice: गिलाद
  rationale: यह एक क्षेत्र का नाम है; हिन्दी में इब्रानी निश्चित उपपद को अलग से व्यक्त करना स्वाभाविक नहीं है।
- source_word: גְבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: गशूरी और माकाती लोगों का क्षेत्र
  rationale: इस भूभाग-सूची में גְּבוּל केवल सीमा-रेखा नहीं, बल्कि इन समुदायों से संबंधित क्षेत्र को सूचित करता है; एकवचन जातिवाचक रूपों का सामूहिक अर्थ हिन्दी में ‘लोगों’ से स्पष्ट किया गया है।
- source_word: כֹל הַר חֶרְמוֹן
  choice: पूरा हर्मोन पर्वत
  rationale: הַר का सामान्य अर्थ ‘पर्वत’ है; כֹל पूरे पर्वतीय विस्तार को सूचित कर सकता है, जिसकी व्यापकता पादटिप्पणी में सुरक्षित है।
- source_word: כָל הַבָּשָׁן
  choice: पूरा बाशान
  rationale: כָל क्षेत्र की संपूर्णता बताता है; हिन्दी में ‘पूरा बाशान’ स्वाभाविक और स्पष्ट है।
- source_word: עַד סַלְכָה
  choice: सल्का तक
  rationale: עַד भूभाग की अंतिम सीमा या विस्तार बताता है; ‘तक’ इसका संक्षिप्त और स्वाभाविक हिन्दी रूप है।
