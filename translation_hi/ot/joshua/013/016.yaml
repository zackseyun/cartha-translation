base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/016.yaml
  text: Their border was from Aroer[a], which is on the edge of the Valley of the Arnon, and the city that is in the middle of the valley[b], and all the tableland as far as Medeba.
translation:
  language: hi
  text: उनकी सीमा अरोएर से थी, जो अर्नोन की घाटी[a] के किनारे है; उसमें घाटी के बीच में स्थित नगर और मेदबा तक का सारा समतल पठार[b] शामिल था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘घाटी’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ बरसाती नदी, उसका पाट, या सँकरी घाटी भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘समतल पठार’ का अनुवाद ‘ऊँचा समतल भूभाग’ या ‘मैदान’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: उनकी सीमा ... थी
  rationale: हिब्रू स्वामित्व-संरचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और सीमा-वर्णन का आशय बनाए रखता है।
- source_word: מֵעֲרוֹעֵר
  choice: अरोएर से
  rationale: מִן सीमा के आरम्भ-बिंदु को दर्शाता है; स्थान-नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: אֲשֶׁר עַל שְׂפַת נַחַל אַרְנוֹן
  choice: अर्नोन की घाटी के किनारे बसे
  rationale: שָׂפָה का स्थानगत अर्थ ‘किनारा’ है; נַחַל यहाँ घाटी, बरसाती नदी की धारा या उसका पाट सूचित कर सकता है। ‘बसे’ अरोएर के स्थान-संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וְהָעִיר אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: घाटी के बीच में बसे नगर से
  rationale: בְּתוֹךְ का मध्य/भीतर का स्थानगत भाव सुरक्षित है। समानान्तर ‘से’ इन भौगोलिक बिंदुओं को सीमा-विवरण से जोड़ता है।
- source_word: וְכָל הַמִּישֹׁר
  choice: पूरे समतल पठार
  rationale: מִישׁוֹר यरदन-पार के ऊँचे, समतल भूभाग को सूचित करता है; ‘समतल पठार’ ‘मैदान’ की अपेक्षा इस भू-आकृति को अधिक ठीक व्यक्त करता है।
- source_word: עַל מֵידְבָא
  choice: मेदबा तक
  rationale: सीमा-विवरण में עַל विस्तार की अंतिम दिशा अथवा सीमा सूचित कर सकता है; ‘तक’ हिन्दी में इस अर्थ को स्पष्ट और सहज बनाता है।
