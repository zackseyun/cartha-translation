  yaml_path: translation/ot/joshua/013/025.yaml
  text: And their territory was Jazer[a], and all the cities of Gilead, and half the land of the Ammonites, as far as Aroer, which is opposite Rabbah.
translation:
  language: hi
  text: और उनका क्षेत्र याज़ेर, गिलाद के सभी नगर, और अम्मोनियों के देश का आधा भाग था, अरोएर तक, जो रब्बा के सामने है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो रब्बा के सम्मुख है।” इब्रानी मुहावरे का शाब्दिक अर्थ है, “जो रब्बा के आगे है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: और उनका क्षेत्र ... था
  rationale: यह वाक्यांश गोत्र को मिले भूभाग का विस्तार बताता है। גְּבוּל का मूल अर्थ सीमा है, पर स्थानों की सूची के इस संदर्भ में ‘क्षेत्र’ स्वाभाविक रूप से पूरे भूभाग को व्यक्त करता है।
- source_word: יַעְזֵר
  choice: याज़ेर
  rationale: इब्रानी स्थाननाम का देवनागरी लिप्यंतरण।
- source_word: וְכָל עָרֵי הַגִּלְעָד
  choice: गिलाद के सभी नगर
  rationale: עָרֵי के लिए ‘नगर’ औपचारिक भू-विवरण में स्वाभाविक है और ‘गिलाद’ प्रचलित देवनागरी रूप है।
- source_word: וַחֲצִי אֶרֶץ בְּנֵי עַמּוֹן
  choice: अम्मोनियों के देश का आधा भाग
  rationale: בְּנֵי עַמּוֹן यहाँ जातीय-भौगोलिक नाम है; ‘अम्मोनी’ इसका स्वाभाविक हिन्दी रूप है। אֶרֶץ को इस राजनीतिक-भौगोलिक संदर्भ में ‘देश’ कहा गया है।
- source_word: עַד עֲרוֹעֵר
  choice: अरोएर तक
  rationale: עַד सीमा की अंतिम हद बताता है; ‘तक’ संक्षिप्त और सटीक है। עֲרוֹעֵר का रूप ‘अरोएर’ रखा गया है।
- source_word: אֲשֶׁר עַל פְּנֵי רַבָּה
  choice: रब्बा के सामने वाले
  rationale: עַל־פְּנֵי का स्थानिक अर्थ ‘के सामने/सम्मुख’ है। यह अनुवाद संबंध को बनाए रखता है और ‘पूर्व में’ जैसी अनुल्लिखित दिशा नहीं जोड़ता।
