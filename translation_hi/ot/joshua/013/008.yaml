language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עִמּ֗/וֹ הָ/רֽאוּבֵנִי֙ וְ/הַ/גָּדִ֔י לָקְח֖וּ נַחֲלָתָ֑/ם אֲשֶׁר֩ נָתַ֨ן לָ/הֶ֜ם מֹשֶׁ֗ה בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה כַּ/אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/008.yaml
  text: With him[a], the Reubenites and the Gadites received their inheritance, which Moses gave them beyond the Jordan eastward, just as Moses the servant of Yahweh gave them.
translation:
  language: hi
  text: उसके साथ, रूबेनियों और गादियों ने अपनी विरासत पा ली थी, जिसे मूसा ने उन्हें यरदन के पार[a] पूर्व की ओर दिया था—ठीक वैसे ही जैसे याहवे के सेवक मूसा ने उन्हें दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात यरदन के पूर्वी भाग में।
    reason: भौगोलिक वाक्यांश ‘यरदन के पार’ की संदर्भानुसार दिशा स्पष्ट करना।
lexical_decisions:
- source_word: עִמּוֹ
  choice: उसके साथ
  rationale: तीसरे पुरुष एकवचन पुल्लिंग प्रत्यय को यथावत रखा गया है; पिछले संदर्भ में इसका स्वाभाविक संकेत मनश्शे के आधे गोत्र की ओर है।
- source_word: הָרְאוּבֵנִי וְהַגָּדִי
  choice: रूबेनियों और गादियों
  rationale: दोनों एकवचन जातिवाचक रूप पूरे-पूरे गोत्रों के लिए सामूहिक अर्थ में प्रयुक्त हैं, इसलिए हिन्दी में स्वाभाविक बहुवचन रखा गया है।
- source_word: לָקְחוּ נַחֲלָתָם
  choice: अपनी विरासत पा ली थी
  rationale: לקח का मूल भाव ‘लेना/पाना’ है; भूमि के विरासती भाग के संदर्भ में ‘पा ली थी’ स्वाभाविक है और पूर्व में पूरा हो चुका कार्य भी स्पष्ट करता है।
- source_word: נַחֲלָתָם
  choice: अपनी विरासत
  rationale: נחלה वंशानुगत रूप से मिले भूमि-भाग को दर्शाता है; ‘विरासत’ उसके भूमि और वाचा-संबंधी दोनों भावों को बनाए रखती है।
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: यरदन के पार पूर्व की ओर
  rationale: मूल भौगोलिक अभिव्यक्ति को निकटता से रखा गया है; संदर्भ में इसका अर्थ यरदन का पूर्वी भाग है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: तुलना और पुष्टि के बल को स्पष्ट रूप से व्यक्त करता है तथा मूल वाक्य की पुनरुक्ति को बनाए रखता है।
- source_word: עֶבֶד יְהוָה
  choice: याहवे के सेवक
  rationale: यह मूसा की सम्मानसूचक उपाधि है; ‘सेवक’ यहाँ स्वाभाविक हिन्दी है और याहवे को व्यक्तिगत दिव्य नाम के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत दिव्य नाम सीधे आया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: मूसा को עֶבֶד יְהוָה कहना
  choice: याहवे का सेवक
  alternative: याहवे का दास
  rationale: यहाँ यह सम्मानसूचक संबंधपरक उपाधि है, बंधुआ स्थिति पर बल नहीं; इसलिए ‘सेवक’ प्रसंग के अनुकूल है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की दोहराई हुई ‘मूसा ने उन्हें दिया’ संरचना को अर्थपूर्ण जोर के रूप में सुरक्षित रखा गया है। पूर्ण हुए पूर्वकालीन बँटवारे को दिखाने के लिए ‘पा ली थी’ और ‘दिया था’ प्रयुक्त हैं।
