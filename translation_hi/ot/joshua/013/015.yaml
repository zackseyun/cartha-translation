lexical_decisions:
- source_word: וַיִּתֵּן
  choice: और ... भाग दिया
  rationale: נתן का वय्यिक्तोल रूप कथा को आगे बढ़ाता है। इस भू-भाग-वितरण के प्रसंग में केवल ‘दिया’ की अपेक्षा ‘भाग दिया’ हिन्दी में आशय को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबल परंपरा में इस व्यक्ति-नाम का प्रचलित रूप।
- source_word: לְמַטֵּה
  choice: गोत्र को
  rationale: भूमि-वितरण के संदर्भ में מַטֶּה का अर्थ ‘गोत्र’ है; उपसर्ग לְ प्राप्तकर्ता को चिह्नित करता है।
- source_word: בְנֵי רְאוּבֵן
  choice: रूबेन के वंशजों
  rationale: शाब्दिक अर्थ ‘रूबेन के पुत्र’ है, पर यहाँ पूरी जनजातीय संतति अभिप्रेत है; ‘वंशजों’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर के कुल-समूह को दर्शाता है और לְ वितरण की व्यवस्था सूचित करता है; इसलिए ‘कुलों के अनुसार’ उपयुक्त है।
