  text: וּ/מֵ/חֶשְׁבּ֛וֹן עַד רָמַ֥ת הַ/מִּצְפֶּ֖ה וּ/בְטֹנִ֑ים וּ/מִֽ/מַּחֲנַ֖יִם עַד גְּב֥וּל לִדְבִֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/026.yaml
  text: and from Heshbon to Ramath-mizpeh and Betonim[a], and from Mahanaim to the border of Debir.
translation:
  language: hi
  text: और हेशबोन से रामत-मिस्पे और बतोनीम तक, और महनैम से दबीर की सीमा तक।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מֵ/חֶשְׁבּוֹן
  choice: और हेशबोन से
  rationale: वाव के साथ מִן आरंभ-बिंदु बताता है; स्थान-नाम को प्रचलित बाइबलीय हिंदी रूप में लिप्यंतरित किया गया है।
- source_word: עַד רָמַת הַ/מִּצְפֶּה וּ/בְטֹנִים
  choice: रामत-मिस्पे और बतोनीम तक
  rationale: सीमा-वर्णन में עַד विस्तार की अंतिम सीमा दर्शाता है। दोनों स्थान-नामों को अनूदित करने के बजाय लिप्यंतरित किया गया है।
- source_word: וּ/מִֽ/מַּחֲנַיִם
  choice: और महनैम से
  rationale: संयोजक और पूर्वसर्ग सहित यह अगले भूभाग का आरंभ-बिंदु बताता है; महनैम स्थान-नाम है।
- source_word: עַד גְּב֥וּל לִדְבִֽר
  choice: दबीर की सीमा तक
  rationale: גְּבוּל का अर्थ इस भू-आवंटन प्रसंग में ‘सीमा’ है। उसके बाद לִדְבִר को स्वाभाविक हिंदी में संबंधसूचक ‘दबीर की’ के रूप में व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण भौगोलिक सूची। मूल पद की समांतर ‘से…तक’ संरचना सुरक्षित रखी गई है। अंग्रेज़ी परामर्श-पाठ की पाद-टिप्पणी मूलतः अंग्रेज़ी अभिव्यक्ति की समस्या से संबंधित प्रतीत होती है; हिब्रू לִדְבִר के लिए हिंदी ‘दबीर की सीमा’ स्वाभाविक है, इसलिए पाठ में अनावश्यक पाद-टिप्पणी नहीं जोड़ी गई।
