  text: מִֽן הַ/שִּׁיח֞וֹר אֲשֶׁ֣ר עַל פְּנֵ֣י מִצְרַ֗יִם וְ/עַ֨ד גְּב֤וּל עֶקְרוֹן֙ צָפ֔וֹנָ/ה לַֽ/כְּנַעֲנִ֖י תֵּחָשֵׁ֑ב חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים הָ/עַזָּתִ֤י וְ/הָ/אַשְׁדּוֹדִי֙ הָ/אֶשְׁקְלוֹנִ֣י הַ/גִּתִּ֔י וְ/הָ/עֶקְרוֹנִ֖י וְ/הָ/עַוִּֽים־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/003.yaml
  text: 'from the Shihor, which is east of Egypt, as far as the border of Ekron to the north—it is counted as Canaanite territory—the five rulers of the Philistines: the Gazite, the Ashdodite, the Ashkelonite, the Gittite, and the Ekronite, and the Avvim.'
translation:
  language: hi
  text: मिस्र के पूर्व में स्थित शीहोर से लेकर उत्तर की ओर एक्रोन की सीमा तक का प्रदेश कनानियों का माना जाता है; इसमें पलिश्तियों के पाँच शासक—गाज़ा का शासक, अशदोद का शासक, अश्कलोन का शासक, गत का शासक और एक्रोन का शासक—तथा अव्वी लोग शामिल हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל־פְּנֵי מִצְרַיִם
  choice: मिस्र के पूर्व में स्थित
  rationale: मुहावरा शाब्दिक रूप से ‘मिस्र के सामने’ है; भौगोलिक संदर्भ में पूर्व दिशा अभिप्रेत हो सकती है। सहज हिन्दी के लिए परामर्श-पाठ का दिशात्मक अर्थ रखा गया।
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: पलिश्तियों के पाँच शासक
  rationale: סֶרֶן पलिश्ती नगर-राज्यों के विशिष्ट शासक पद को दर्शाता है; सामान्य पाठक के लिए ‘शासक’ स्पष्ट और तटस्थ है।
- source_word: לַכְּנַעֲנִי תֵּחָשֵׁב
  choice: कनानियों का माना जाता है
  rationale: हिब्रू के निष्क्रिय भाव और जातीय विशेषण को स्वाभाविक हिन्दी में सुरक्षित रखा गया।
- source_word: הָעַוִּים
  choice: अव्वी लोग
  rationale: जाति-नाम का ध्वन्यात्मक रूप देकर उसे सामान्य संज्ञा समझे जाने से बचाया गया।
theological_decisions:
- issue: क्षेत्र और पाँच शासकों/जातीय नामों के बीच वाक्यगत संबंध
  choice: ‘इसमें ... क्षेत्र ... शामिल है’ द्वारा सूची को पूर्ववर्ती भूभाग से जोड़ा
  alternative: सूची को मूल की तरह खंडित समानाधिकरण में रखना
  rationale: हिब्रू पद में सूची का वाक्य-विन्यास संक्षिप्त और कुछ हद तक अस्पष्ट है। हिन्दी में अर्थगम्यता के लिए क्षेत्रीय संबंध स्पष्ट किया गया, बिना किसी धार्मिक निष्कर्ष को जोड़ने के।
- issue: עַל־פְּנֵי का भौगोलिक अर्थ
  choice: मिस्र के पूर्व में
  alternative: मिस्र के सामने / मिस्र के निकट
  rationale: संदर्भ और उपलब्ध परामर्श-पाठ ‘पूर्व’ का समर्थन करते हैं, यद्यपि हिब्रू मुहावरा स्वयं अधिक व्यापक है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज। स्थान और जाति-नामों का देवनागरी लिप्यंतरण किया गया है। पद मूल वाक्य का अंश है, फिर भी हिन्दी में स्वतंत्र रूप से पठनीय बनाया गया।
