source:
  edition: WLC
  text: רַ֚ק לְ/שֵׁ֣בֶט הַ/לֵּוִ֔י לֹ֥א נָתַ֖ן נַחֲלָ֑ה אִשֵּׁ֨י יְהוָ֜ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּר לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/014.yaml
  text: Only to the tribe of Levi he gave no inheritance[a]; the offerings by fire to Yahweh, the God of Israel, are his inheritance[b], as he spoke to him.
translation:
  language: hi
  text: केवल लेवी के गोत्र को उसने कोई विरासत नहीं दी[a]; इस्राएल के परमेश्वर यहोवा को आग में चढ़ाए जाने वाले बलिदान ही उसकी विरासत हैं[b], जैसा उसने उससे कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “विरासत” से आशय भूमि में मिलने वाले पैतृक हिस्से से है।
    reason: clarification
  - marker: b
    text: कुछ लोग आसपास के पदों के प्रकाश में इसका अर्थ लेते हैं, “इस्राएल का परमेश्वर यहोवा ही उसकी विरासत है।”
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: केवल
  rationale: यह पहले वर्णित भूमि-वितरण से लेवी के गोत्र को अपवाद के रूप में अलग करता है और इब्रानी के सीमित करने वाले बल को बनाए रखता है।
- source_word: לְשֵׁבֶט הַלֵּוִי
  choice: लेवी के गोत्र को
  rationale: נתן के साथ לְ का स्वाभाविक हिन्दी रूप ‘को’ है।
- source_word: לֹא נָתַן נַחֲלָה
  choice: उसने कोई विरासत नहीं दी
  rationale: नकार, क्रिया और भूमि के पैतृक हिस्से के भाव को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אִשֵּׁי יְהוָה
  choice: यहोवा को आग में चढ़ाए जाने वाले बलिदान
  rationale: אִשֵּׁי का अग्नि द्वारा चढ़ाई जाने वाली भेंटों का भाव स्पष्ट करता है; ‘बलिदान’ इस धार्मिक संदर्भ में सामान्य हिन्दी पाठक के लिए सहज है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य नाम को हिन्दी में प्रचलित प्रतिलेखन से प्रस्तुत किया गया है, न कि उपाधि ‘प्रभु’ से बदला गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: इब्रानी संबंध-रचना का स्वाभाविक हिन्दी रूप है और ‘यहोवा’ का समानाधिकरण करता है।
- source_word: הוּא נַחֲלָתוֹ
  choice: ही उसकी विरासत हैं
  rationale: निकटतम पूर्वपद अग्नि में चढ़ाए जाने वाले बलिदान हैं; ‘ही’ हिब्रू सर्वनाम के बलात्मक/पहचानसूचक कार्य को व्यक्त करता है। वैकल्पिक रूप से यहोवा को स्वयं विरासत मानने की समझ पादटिप्पणी में सुरक्षित है।
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: जैसा उसने उससे कहा था
  rationale: ‘कहा’ मूल ‘बोला’ के भाव को बिना ‘प्रतिज्ञा की’ जैसी व्याख्या जोड़े रखता है; ‘था’ पूर्ववर्ती कथन को सहज हिन्दी में दर्शाता है।
theological_decisions:
- issue: लेवी की विरासत का स्वरूप
  choice: आग में चढ़ाए जाने वाले बलिदान ही उसकी विरासत हैं
  alternative: इस्राएल का परमेश्वर यहोवा ही उसकी विरासत है
  rationale: तात्कालिक वाक्य-विन्यास में אִשֵּׁי יְהוָה निकटतम पूर्वपद है, इसलिए मुख्य पाठ उसी को विरासत मानता है। फिर भी आसपास के पदों और प्रचलित पाठ-समझ के कारण यहोवा को स्वयं विरासत मानने वाला विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘यहोवा’ दिव्य नाम के रूप में और ‘इस्राएल’ आधुनिक हिन्दी बाइबिलीय वर्तनी के अनुसार है। वाक्य ने मूल की निकटवर्ती व्याकरणिक समझ को मुख्य पाठ में रखा है और वास्तविक व्याख्यात्मक विकल्प को पादटिप्पणी में सुरक्षित किया है।
