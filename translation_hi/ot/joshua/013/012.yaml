base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/012.yaml
  text: all the kingdom of Og in Bashan[a], who reigned in Ashtaroth and in Edrei—he was left of the remnant of the Rephaim. Moses struck them down and dispossessed them.
translation:
  language: hi
  text: बाशान में ओग का पूरा राज्य, जिसने अश्तारोत और एद्रेई में राज किया था—वह रपाइयों[a] के बचे हुओं में से था। मूसा ने उन्हें मार गिराया और उन्हें बेदखल कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दैत्य।” इब्रानी में “रपाईम”; सम्भवतः यह एक प्राचीन जनसमूह का नाम है।
    reason: रपाइयों को जाति-नाम के रूप में रखना मूल की अस्पष्टता बचाता है, जबकि प्रचलित वैकल्पिक अर्थ पाठक को उपलब्ध कराता है।
lexical_decisions:
- source_word: כָּל מַמְכוּת עוֹג בַּבָּשָׁן
  choice: बाशान में ओग का पूरा राज्य
  rationale: एकवचन מַמְלְכוּת के साथ כָּל ओग के समूचे राज्य को दर्शाता है; בַּבָּשָׁן का स्थानवाचक अर्थ ‘बाशान में’ रखा गया है।
- source_word: אֲשֶׁר מָלַךְ בְּעַשְׁתָּרוֹת וּבְאֶדְרֶעִי
  choice: जिसने अश्तारोत और एद्रेई में राज किया था
  rationale: מָלַךְ की राजकीय छाया ‘राज किया’ से बनी रहती है और दोनों स्थान-नाम आधुनिक हिन्दी में स्वाभाविक ढंग से प्रस्तुत होते हैं।
- source_word: הוּא נִשְׁאַר מִיֶּתֶר הָרְפָאִים
  choice: वह रपाइयों के बचे हुओं में से था
  rationale: यह स्वाभाविक हिन्दी में इस बात को व्यक्त करता है कि ओग रपाइयों के शेष बचे समूह में से था; ‘अकेला’ नहीं जोड़ा गया क्योंकि वह मूल में स्पष्ट नहीं है।
- source_word: הָרְפָאִים
  choice: रपाइयों
  rationale: इसे प्राचीन जनसमूह के नाम के रूप में लिप्यंतरित किया गया है; ‘दैत्य’ जैसी व्याख्यात्मक पहचान मुख्य पाठ में नहीं थोपी गई।
- source_word: וַיַּכֵּם מֹשֶׁה
  choice: मूसा ने उन्हें मार गिराया
  rationale: נכה के सैन्य और प्राणघातक बल को ‘मार गिराया’ व्यक्त करता है; बहुवचन प्रत्यय ओग और उससे जुड़े लोगों की ओर संकेत करता है।
- source_word: וַיֹּרִשֵׁם
  choice: और उनके अधिकार से उनकी भूमि छीन ली
  rationale: हिफ़ील ירשׁ यहाँ अधिकार या कब्ज़े से बेदखल करने का भाव देता है। हिन्दी में केवल ‘उन्हें बेदखल किया’ की तुलना में यह वाक्यांश विजय और भू-अधिकार का आशय अधिक स्पष्ट करता है।
theological_decisions:
- issue: רְפָאִים का अर्थ
  choice: रपाइयों
  alternative: दैत्य / विशालकाय लोग
  rationale: शब्द को प्राचीन जनसमूह के नाम के रूप में सुरक्षित रखने से उनकी प्रकृति के विषय में कोई विशिष्ट व्याख्या मुख्य पाठ पर नहीं थोपी जाती; संभावित वर्णनात्मक अर्थ पादटिप्पणी में दिया गया है।
- issue: נִשְׁאַר में बचे रहने की सीमा
  choice: बचे हुओं में से था
  alternative: वही अकेला बचा था
  rationale: मूल पाठ ओग को बचे हुए रपाइयों में से बताता है, पर ‘अकेला’ शब्द स्पष्ट रूप से नहीं कहता; इसलिए उसे नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। भौगोलिक और जातीय नामों का देवनागरी लिप्यंतरण किया गया है। विजय-वर्णन की तीव्रता बनाए रखते हुए अनावश्यक व्याख्या नहीं जोड़ी गई।
