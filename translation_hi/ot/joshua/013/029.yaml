  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पहले वाक्य में ‘उसका भाग’ तथा दूसरे में ‘यह भाग’ संदर्भ में निहित भूमि-आवंटन को स्पष्ट करते हैं; अंत का द्विबिंदु अगले पद में आने वाले क्षेत्र-विवरण की भूमिका बनाए रखता है।
