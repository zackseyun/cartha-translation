base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/029.yaml
  text: 'And Moses gave to the half-tribe of Manasseh[a], and it was for the half-tribe of the sons of Manasseh according to their clans:'
translation:
  language: hi
  text: 'मूसा ने मनश्शे के आधे गोत्र को भाग दिया, और यह भाग मनश्शे के वंशजों[a] के आधे गोत्र को उनके कुलों के अनुसार मिला:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनश्शे के पुत्रों”; यह मनश्शे से निकले गोत्रीय वंशजों के लिए प्रयुक्त संबंधसूचक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: दिया
  rationale: נתן का सामान्य अर्थ ‘देना’ है; भूमि-विभाजन के संदर्भ में यह आवंटित भाग देने को व्यक्त करता है।
- source_word: לַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र को
  rationale: חֲצִי का अर्थ ‘आधा’ और שֵׁבֶט का इस प्रसंग में अर्थ ‘गोत्र’ है। हिंदी पदक्रम संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיְהִי
  choice: यह भाग ... मिला
  rationale: शाब्दिक अर्थ ‘और वह था’ है, पर भूमि-वितरण के इस सूत्र में प्राप्त आवंटन का भाव निहित है। ‘यह भाग ... मिला’ संदर्भित वस्तु स्पष्ट करते हुए स्वाभाविक हिंदी देता है।
- source_word: מַטֵּה
  choice: गोत्र
  rationale: מַטֶּה का मूल अर्थ ‘लाठी’ भी हो सकता है, किंतु यहाँ यह प्रशासनिक-वंशीय इकाई अर्थात गोत्र को सूचित करता है।
- source_word: בְנֵי מְנַשֶּׁה
  choice: मनश्शे के वंशजों
  rationale: इब्रानी का शाब्दिक रूप ‘मनश्शे के पुत्रों’ है, किंतु इस प्रसंग में इससे मनश्शे के गोत्रीय वंशज अभिप्रेत हैं। मुख्य पाठ में अर्थ स्पष्ट किया गया और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לְמִשְׁפְּחוֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחוֹת गोत्र के भीतर के कुल-समूहों को दर्शाता है और לְ यहाँ वितरण के आधार का भाव देता है।
