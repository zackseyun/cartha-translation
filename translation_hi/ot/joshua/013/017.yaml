  rationale: यहाँ इसे ‘बाल के ऊँचे स्थान’ के रूप में अनुवाद करने के बजाय संयुक्त स्थान-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וּבֵית בַּעַל מְעוֹן
