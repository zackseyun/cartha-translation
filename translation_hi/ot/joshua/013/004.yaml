lexical_decisions:
- source_word: מִתֵּימָן
  choice: दक्षिण से
  rationale: תֵּימָן यहाँ क्षेत्रीय सीमा-वर्णन में दक्षिण दिशा अथवा दक्षिणी भूभाग को सूचित करता है; इसे ‘तेमान से’ स्थान-नाम मानना संभव तो है, पर प्रसंग में कम स्वाभाविक है।
- source_word: כָּל אֶרֶץ הַכְּנַעֲנִי
  choice: कनानियों का सारा देश
  rationale: इब्रानी में जातिनाम एकवचन रूप में सामूहिक अर्थ रखता है। आधुनिक हिन्दी में ‘कनानियों’ उस सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּמְעָרָה
  choice: और ... मआरा
  rationale: מְעָרָה का सामान्य अर्थ ‘गुफा’ हो सकता है, पर इस भौगोलिक सूची में इसे स्थान-नाम मानना अधिक उपयुक्त है; लिप्यंतरण उस सम्भावना को सुरक्षित रखता है।
- source_word: אֲשֶׁר לַצִּידֹנִים
  choice: सीदोनियों का
  rationale: לַצִּידֹנִים सम्बन्ध अथवा अधिकार को दर्शाता है। हिन्दी का सम्बन्धकारक ‘का’ इसे संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַד אֲפֵקָה
  choice: अपेक तक
  rationale: עַד भौगोलिक विस्तार की अंतिम सीमा बताता है; स्थान-नाम पर लगा दिशासूचक प्रत्यय हिन्दी में ‘तक’ से पर्याप्त रूप से व्यक्त होता है।
- source_word: עַד גְּבוּל הָאֱמֹרִי
  choice: अमोरियों की सीमा तक
  rationale: גְּבוּל यहाँ भूसीमा को दर्शाता है। एकवचन जातिनाम הָאֱמֹרִי का सामूहिक भाव हिन्दी बहुवचन ‘अमोरियों’ से स्वाभाविक रूप में व्यक्त होता है।
