source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֣י הָ֠/הָר מִֽן הַ/לְּבָנ֞וֹן עַד מִשְׂרְפֹ֥ת מַ֨יִם֙ כָּל צִ֣ידֹנִ֔ים אָֽנֹכִי֙ אוֹרִישֵׁ֔/ם מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֠ק הַפִּלֶ֤/הָ לְ/יִשְׂרָאֵל֙ בְּֽ/נַחֲלָ֔ה כַּ/אֲשֶׁ֖ר צִוִּיתִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/006.yaml
  text: All the inhabitants of the hill country from Lebanon to Misrephoth-maim[a], all the Sidonians—I myself will drive them out before the sons of Israel. Only allot it to Israel as an inheritance[c][b], as I have commanded you.
translation:
  language: hi
  text: लबानोन से लेकर मिस्रपोत-माइम[a] तक के पहाड़ी प्रदेश के सभी निवासियों को, सभी सीदोनी लोगों को—मैं स्वयं उन्हें इस्राएल के पुत्रों के सामने से निकाल दूँगा। केवल उस भूमि को इस्राएल के लिए विरासत के रूप में बाँट दे[c], जैसा मैंने तुझे आज्ञा दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मिस्रपोत-माइम एक स्थान का नाम है। नाम का अर्थ संभवतः ‘जल के दहन/जलाने के स्थान’ जैसा हो सकता है, पर इसका ठीक अर्थ अनिश्चित है।
    reason: cultural_note
  - marker: c
    text: इब्रानी में यहाँ ‘उसे गिरा’ भूमि का भाग ठहराने के मुहावरे में आया है; यह प्रायः चिट्ठी डालकर भूमि बाँटने से संबद्ध है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי הָהָר
  choice: पहाड़ी प्रदेश के सभी निवासी
  rationale: הָהָר यहाँ किसी एक पहाड़ के बजाय भौगोलिक पहाड़ी क्षेत्र को सूचित करता है; यह हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: מִן הַלְּבָנוֹן עַד מִשְׂרְפֹת מַיִם
  choice: लबानोन से लेकर मिस्रपोत-माइम तक
  rationale: दोनों को स्थान-नाम माना गया है। दूसरे नाम का अर्थ अनिश्चित होने के कारण उसका अर्थानुवाद नहीं किया गया।
- source_word: כָּל צִידֹנִים
  choice: सभी सीदोनी
  rationale: यह सीदोन से संबद्ध जनसमूह का सामूहिक जातीय-भौगोलिक नाम है और כָּל की व्यापकता को बनाए रखता है।
- source_word: אָנֹכִי אוֹרִישֵׁם
  choice: मैं स्वयं उन्हें ... निकाल दूँगा
  rationale: स्वतंत्र सर्वनाम אָנֹכִי का बल ‘मैं स्वयं’ से व्यक्त होता है; ירשׁ के हिफ़ील का यहाँ भाव निवासियों को उनके क्षेत्र से निकालना है।
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के सामने से
  rationale: यह मूल की स्थानिक-सम्बन्धपरक छवि और בְּנֵי की पुत्रवाचक भाषा दोनों को सुरक्षित रखता है।
- source_word: הַפִּלֶהָ
  choice: उस देश को चिट्ठी डालकर ... बाँट दे
  rationale: नפל के हिफ़ील का भूमि-विभाजन संबंधी मुहावरा चिट्ठी डालकर भाग ठहराने को सूचित करता है। स्त्रीलिंग कर्म-प्रत्यय का आशय प्रसंगतः देश/भूमि है, जिसे हिन्दी में स्पष्ट किया गया है।
- source_word: לְיִשְׂרָאֵל בְּנַחֲלָה
  choice: इस्राएल को विरासत के रूप में
  rationale: נַחֲלָה केवल सामान्य अधिकार नहीं, बल्कि सौंपे गए पैतृक भूभाग का कानूनी और वाचा-संबंधी भाव रखता है।
- source_word: כַּאֲשֶׁר צִוִּיתִיךָ
  choice: जैसा मैंने तुझे आज्ञा दी है
  rationale: पूर्ण क्रिया पूर्व में दी गई और अब भी लागू आज्ञा को दर्शाती है; एकवचन संबोधन ‘तुझे’ से सुरक्षित है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली / इस्राएल के लोग
  rationale: मूल की स्पष्ट पुत्रवाचक और वंश-संबंधी अभिव्यक्ति को बनाए रखा गया है, बिना उसे लिंग-निरपेक्ष बनाकर समतल किए।
- issue: נַחֲלָה का भूमि-वितरण संदर्भ
  choice: विरासत
  alternative: अधिकार / संपत्ति
  rationale: ‘विरासत’ इस भूमि के सौंपे हुए पैतृक हिस्से होने के कानूनी और धर्मवैचारिक आयाम को सुरक्षित रखती है।
- issue: भूमि-वितरण की विधि का व्यक्तीकरण
  choice: चिट्ठी डालकर ... बाँट दे
  alternative: विरासत के रूप में ठहरा दे
  rationale: हिब्रू का ‘गिराना’ वाला causative मुहावरा चिट्ठी डालकर भूमि बाँटने की ओर संकेत करता है; इसे हिन्दी पाठक के लिए स्पष्ट किया गया है, जबकि टिप्पणी मुहावरे की जानकारी देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। परमेश्वर द्वारा यहोशू को एकवचन संबोधन के लिए ‘तू/तुझे’ रखा गया है। स्थान-नामों का देवनागरी लिप्यंतरण किया गया है और मूल की बलाघातपूर्ण ‘मैं स्वयं’ संरक्षित है।
