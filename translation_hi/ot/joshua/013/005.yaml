lexical_decisions:
- source_word: הָאָרֶץ הַגִּבְלִי
  choice: गबाली लोगों का देश
  rationale: הַגִּבְלִי गबाल से जुड़े निवासियों के लिए जातिवाचक रूप है। ‘गबाली लोगों’ से स्थान-नाम का संबंध स्पष्ट रहता है और हिन्दी में समूह का भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: כָל הַלְּבָנוֹן
  choice: पूरा लबानोन
  rationale: כָל की समग्रता को ‘पूरा’ से और भौगोलिक नाम को लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: सूर्योदय की ओर का
  rationale: मूल की शाब्दिक छवि ‘सूर्योदय’ को बनाए रखते हुए पूर्व दिशा का भौगोलिक संकेत स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מִבַּעַל גָּד
  choice: बाल-गाद से
  rationale: स्थान-नाम को लिप्यंतरित किया गया है और מִן का आरंभ-बिंदु ‘से’ द्वारा व्यक्त है।
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: हर्मोन पर्वत के नीचे
  rationale: सीमा-वर्णन में תַּחַת पर्वत की अपेक्षा निचली भौगोलिक स्थिति बताता है; ‘के नीचे’ मूल की अनिश्चित स्थलाकृतिक व्यापकता बनाए रखता है।
- source_word: עַד לְבוֹא חֲמָת
  choice: लबो-हमात तक
  rationale: मुख्य पाठ में इसे सीमा-स्थल के नाम के रूप में रखा गया है। इसे ‘हमात के प्रवेश-मार्ग तक’ समझने की वास्तविक भाषिक संभावना पादटिप्पणी में सुरक्षित है।
