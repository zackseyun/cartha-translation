  text: और मूसा ने गाद के गोत्र को, यानी गाद के पुत्रों को, उनके कुलों के अनुसार दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: भूमि दी
  rationale: נתן का मूल अर्थ ‘देना’ है। भूमि-विभाजन के प्रसंग में दी गई वस्तु भूमि है; स्वाभाविक हिन्दी के लिए उसे स्पष्ट किया गया है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबल परम्परा में इस नाम का प्रचलित रूप ‘मूसा’ है।
- source_word: לְמַטֵּה גָד
  choice: गाद के गोत्र को
  rationale: इस वंशावली और भू-विभाजन के प्रसंग में מַטֶּה का अर्थ छड़ी नहीं, बल्कि ‘गोत्र’ है।
- source_word: לִבְנֵי גָד
  choice: गाद के वंशजों को
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ यह मानक गोत्रीय अभिव्यक्ति है और गाद के वंशजों/गोत्र-सदस्यों को सूचित करती है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर के कुल या वंश-समूह को दर्शाता है; לְ का प्रयोग वितरण को सूचित करता है।
