    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית פְּעוֹר
  choice: बेत-पोर
  rationale: यह एक स्थान-नाम है, इसलिए इसके अर्थ का अनुवाद करने के बजाय इसका देवनागरी लिप्यंतरण किया गया है। योजक-चिह्न नाम के दो घटकों को स्पष्ट रखता है।
- source_word: אַשְׁדּוֹת
  choice: ढलानें
  rationale: इस स्थलाकृतिक संदर्भ में शब्द का सबसे स्वाभाविक अर्थ पर्वत की उतरती हुई ढलानें है। यह आधुनिक हिंदी में स्पष्ट और सहज है; अन्य संभव अर्थ पाद-प्रदेश या जल-स्रोत से जुड़े हो सकते हैं।
- source_word: הַפִּסְגָּה
  choice: पिसगा
  rationale: यहाँ इसका प्रयोग भौगोलिक नाम के रूप में है, इसलिए लिप्यंतरण किया गया है। इब्रानी निश्चित उपपद को हिंदी स्थान-नाम में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: בֵית הַיְשִׁמוֹת
  choice: बेत-यशीमोत
  rationale: यह एक स्थान-नाम है, इसलिए शाब्दिक अर्थ देने के बजाय इसका लिप्यंतरण किया गया है।
