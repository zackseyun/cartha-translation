lexical_decisions:
- source_word: זֹאת הָאָרֶץ הַנִּשְׁאָרֶת
  choice: जो देश अब भी बाकी है, वह यह है
  rationale: इब्रानी स्त्रीलिंग संकेतवाचक, संज्ञा और निफ़ाल कृदंत को स्वाभाविक हिन्दी प्रस्तुतिवाचक वाक्य में रखा गया है; ‘अब भी बाकी’ उस भूभाग को सूचित करता है जिस पर अभी अधिकार नहीं हुआ था।
- source_word: כָּל גְּלִילוֹת
  choice: सभी क्षेत्र
  rationale: גְּלִילוֹת भौगोलिक इलाकों या प्रदेशों को दर्शाता है। ‘क्षेत्र’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक प्रशासनिक विशिष्टता आरोपित नहीं करता।
- source_word: הַפְּלִשְׁתִּים
  choice: पलिश्तियों के
  rationale: मूल पाठ लोगों के समुदाय का नाम लेकर उसके क्षेत्रों से संबंध व्यक्त करता है; संबंधकारक हिन्दी रूप इसे बनाए रखता है।
- source_word: וְכָל הַגְּשׁוּרִי
  choice: और सभी गशूरी
  rationale: एकवचन जातिवाचक रूप यहाँ सामूहिक अर्थ में है। हिन्दी में ‘सभी गशूरी’ उस सामूहिकता को व्यक्त करता है, जबकि मूल के जातिवाचक स्वरूप के निकट रहता है।
