translation:
  language: hi
  text: लेकिन इस्राएलियों ने गशूरी और माकाती लोगों को नहीं निकाला, और गशूर और माकात आज तक इस्राएल के बीच रहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक ‘इस्राएल के पुत्र’ के स्थान पर आधुनिक हिन्दी में समुदाय के लिए स्वाभाविक और अर्थसटीक रूप।
- source_word: הוֹרִישׁוּ
  choice: निकाला
  rationale: हिफ़ील रूप यहाँ किसी भूभाग से लोगों को बेदखल करने या निकाल देने का अर्थ देता है; ‘नष्ट किया’ अनावश्यक रूप से अधिक कठोर और संकीर्ण होगा।
- source_word: הַגְּשׁוּרִי וְאֶת הַמַּעֲכָתִי
  choice: गशूरी और माकाती लोगों
  rationale: ये जाति-सूचक एकवचन सामूहिक संज्ञाएँ हैं; हिन्दी में ‘लोगों’ जोड़ने से आशय स्पष्ट और स्वाभाविक होता है।
- source_word: גְּשׁוּר וּמַעֲכָת
  choice: गशूर और माकात
  rationale: दूसरे खंड में मूल पाठ जाति-सूचक रूपों के बजाय इन नामों का प्रयोग करता है; उस बदलाव को बनाए रखा गया है।
- source_word: וַיֵּשֶׁב
  choice: रहते आए हैं
  rationale: हिब्रू एकवचन क्रिया संयुक्त सामूहिक नामों के साथ है और ‘आज तक’ जारी स्थिति बताता है; हिन्दी में बहुवचन और निरंतरता स्वाभाविक है।
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: इस्राएल के बीच
  rationale: मूल की सामुदायिक/भौगोलिक व्यापकता को बनाए रखता है; ‘इस्राएलियों के बीच’ भी संभव है, पर वह नाम को केवल लोगों तक सीमित कर सकता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: प्रचलित, संक्षिप्त और मूल मुहावरे का सटीक हिन्दी रूप।
