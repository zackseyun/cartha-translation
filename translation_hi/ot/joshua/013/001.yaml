language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו אַתָּ֤ה זָקַ֨נְתָּה֙ בָּ֣אתָ בַ/יָּמִ֔ים וְ/הָ/אָ֛רֶץ נִשְׁאֲרָ֥ה הַרְבֵּֽה מְאֹ֖ד לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/001.yaml
  text: Joshua was old[a], advanced in years, and Yahweh said to him, “You are old, advanced in years, and very much of the land remains to be possessed.”
translation:
  language: hi
  text: यहोशू बूढ़ा हो गया था और उसकी आयु बहुत बढ़ चुकी थी। याहवे ने उससे कहा, “तुम बूढ़े हो गए हो और तुम्हारी आयु बहुत बढ़ चुकी है, और बहुत-सी भूमि पर अधिकार करना अभी बाकी है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָקֵן / זָקַנְתָּה
  choice: बूढ़ा हो गया था / बूढ़े हो गए हो
  rationale: यह पद यहोशू की वृद्धावस्था बताता है। हिंदी में ‘बूढ़ा हो गया’ अवस्था और आयु के बढ़ने—दोनों को सहज रूप से व्यक्त करता है तथा कथन और प्रत्यक्ष वचन की पुनरावृत्ति बनाए रखता है।
- source_word: בָּא בַּיָּמִים / בָּאתָ בַיָּמִים
  choice: आयु बहुत बढ़ चुकी थी / आयु बहुत बढ़ चुकी है
  rationale: शाब्दिक अर्थ ‘दिनों में आ पहुँचना’ है, पर यह वृद्धावस्था का इब्रानी मुहावरा है। चुना हुआ हिंदी रूप अर्थ को स्पष्ट और सम्मानपूर्ण ढंग से देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी लिपि में लिप्यंतरित किया गया है।
- source_word: הָאָרֶץ נִשְׁאֲרָה הַרְבֵּה מְאֹד
  choice: देश का बहुत बड़ा भाग अभी ... बाकी है
  rationale: यह रूप उस भूमि की बड़ी मात्रा को स्पष्ट करता है जो अब तक अधिकार में नहीं ली गई थी। ‘देश’ यहाँ प्रतिज्ञात भौगोलिक भूमि के अर्थ में है।
- source_word: לְרִשְׁתָּהּ
  choice: अधिकार में लेना
  rationale: ירשׁ इस प्रसंग में भूमि पर अधिकार करने अथवा उसे विरासत के रूप में पाने का अर्थ रख सकता है। मुख्य पाठ में तत्काल प्रसंग के अनुकूल ‘अधिकार में लेना’ रखा गया है और दूसरा अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; इसलिए उपाधि ‘प्रभु’ से प्रतिस्थापित न करके उसका निकट हिंदी लिप्यंतरण रखा गया है।
- issue: ירשׁ में अधिकार और विरासत का अर्थ-संबंध
  choice: अधिकार में लेना
  alternative: विरासत में पाना
  rationale: यहोशू के विजय-वर्णन के निकट प्रसंग में अधिकार ग्रहण करना प्रमुख है, किंतु वाचा और विरासत की अर्थ-छाया वास्तविक है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सहज किंतु गरिमापूर्ण रखी गई है। कथावाचक और याहवे के कथन में मूल की पुनरावृत्ति सुरक्षित है। संबोधन में आधुनिक और सम्मानपूर्ण ‘तुम’ का प्रयोग किया गया है।
