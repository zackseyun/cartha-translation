  yaml_path: translation/ot/joshua/013/007.yaml
  text: Now divide this land as an inheritance to the nine tribes and the half-tribe of Manasseh[a].
translation:
  language: hi
  text: अब इस देश को नौ गोत्रों और मनश्शे के आधे गोत्र को विरासत के रूप में बाँट दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अब इस देश को नौ गोत्रों और मनश्शे के आधे गोत्र के लिए विरासत के रूप में बाँट दे।”
    reason: हिब्रू आरम्भिक संयोजक का ‘और अब’ तथा उत्तराधिकार के लिए वितरण का वैकल्पिक हिन्दी विन्यास।
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह अगले आदेश की ओर कथन का संक्रमण दिखाता है। हिन्दी में ‘अब’ स्वाभाविक है और आरम्भिक וְ का क्रमसूचक भाव संदर्भ से स्पष्ट रहता है।
- source_word: חַלֵּק
  choice: बाँट दे
  rationale: यह यहोशू को संबोधित एकवचन पुल्लिंग आज्ञार्थक है। ‘बाँट दे’ भूमि-विभाजन के संदर्भ में सरल, स्वाभाविक और स्पष्ट है।
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: इस देश को
  rationale: यह आदेश का निश्चित प्रत्यक्ष कर्म है। यहाँ אֶרֶץ से चर्चा के अधीन पूरा भूभाग अभिप्रेत है; ‘देश’ हिन्दी बाइबलीय भू-संदर्भ में स्वाभाविक है।
- source_word: בְּנַחֲלָה
  choice: विरासत के रूप में
  rationale: נַחֲלָה पैतृक/वंशगत अधिकार के रूप में आवंटित भूमि को सूचित करता है। यह चुनाव कानूनी आवंटन और स्थायी विरासत, दोनों भावों को रखता है।
- source_word: לְתִשְׁעַת הַשְּׁבָטִים
  choice: नौ गोत्रों ... में
  rationale: לְ प्राप्तकर्ताओं को चिह्नित करता है। हिन्दी में ‘देश को ... में बाँट दे’ वितरण का स्वाभाविक निर्माण है, यद्यपि स्रोत का प्राप्तकर्ता-भाव भी बना रहता है।
- source_word: וַחֲצִי הַשֵּׁבֶט
  choice: और ... के आधे गोत्र
  rationale: यह मनश्शे के गोत्र के मान्य आधे भाग को दर्शाता है। हिन्दी में नाम के साथ ‘मनश्शे के आधे गोत्र’ अधिक स्वाभाविक है।
- source_word: הַמְנַשֶּׁה
  choice: मनश्शे
  rationale: व्यक्तिगत/गोत्रीय नाम का हिन्दी में प्रचलित लिप्यंतरण रखा गया है।
