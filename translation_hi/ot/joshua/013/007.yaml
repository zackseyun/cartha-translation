  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण आज्ञार्थक शैली अपनाई गई है। ‘गोत्र’ इस्राएली जनजातीय इकाइयों के लिए परिचित बाइबलीय शब्द है; ‘विरासत’ נַחֲלָה के भूमि-अधिकार और पीढ़ीगत प्राप्ति के भाव को सुरक्षित रखता है।
