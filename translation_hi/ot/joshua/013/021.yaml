base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/021.yaml
  text: 'and all the cities of the plateau[a], and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses struck down—him and the chiefs of Midian: Evi, Rekem, Zur, Hur, and Reba, the princes of Sihon[c][b], who lived in the land.'
translation:
  language: hi
  text: और पठार[a] के सभी नगर, और अमोरियों के राजा सीहोन का सारा राज्य, जो हेशबोन में राज्य करता था—उसे मूसा ने मिद्यान के प्रधानों, एवी, रेकेम, सूर, हूर और रेबा को मार गिराया था; ये उस देश में रहने वाले सीहोन के राजकुमार[b] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैदान के सभी नगर” अथवा “समतल ऊँचे प्रदेश के सभी नगर।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “मिद्यान के प्रधानों” और “सीहोन के राजकुमारों” के लिए दो अलग-अलग पदनाम हैं। यहाँ दोनों पदनाम एवी, रेकेम, सूर, हूर और रेबा के लिए प्रयुक्त हैं; “राजकुमार” पदवाचक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּישֹׁר
  choice: पठार के सभी नगर
  rationale: מִישׁוֹר यहाँ यरदन-पार के समतल ऊँचे भूभाग को सूचित करता है; ‘पठार’ आधुनिक हिन्दी में इस भौगोलिक अर्थ को सहज रूप से व्यक्त करता है।
- source_word: מַמְלְכוּת סִיחוֹן
  choice: सीहोन का पूरा राज्य
  rationale: מַמְלְכוּת का सीधा अर्थ ‘राज्य’ है; כָל के बल को ‘पूरा’ से व्यक्त किया गया है।
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: अमोरियों का राजा
  rationale: इब्रानी संबंध-वाक्यांश को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: אֲשֶׁר מָלַךְ בְּחֶשְׁבּוֹן
  choice: जो हेशबोन में राज्य करता था
  rationale: מָלַךְ विशेषतः राजा के रूप में राज्य करने को बताता है, इसलिए सामान्य ‘शासन करता था’ के बजाय ‘राज्य करता था’ चुना गया।
- source_word: אֲשֶׁר הִכָּה מֹשֶׁה אֹתוֹ
  choice: मूसा ने उसे ... मार गिराया था
  rationale: सैनिक प्रसंग में נכה निर्णायक रूप से मारने या पराजित करने का बोध देता है। यहाँ व्यक्तियों के साथ ‘मार गिराया’ प्रसंगानुकूल है; इब्रानी के कर्म-सर्वनाम को ‘उसे’ से बनाए रखा गया है।
- source_word: נְשִׂיאֵי מִדְיָן
  choice: मिद्यान के प्रधान
  rationale: נָשִׂיא नेतृत्व और उच्च पद सूचित करता है; ‘प्रधान’ बाद में आए भिन्न पदनाम נְסִיכֵי से अंतर बनाए रखता है।
- source_word: אֱוִי וְאֶת רֶקֶם וְאֶת צוּר וְאֶת חוּר וְאֶת רֶבַע
  choice: एवी, रेकेम, सूर, हूर और रेबा
  rationale: व्यक्तिनामों का देवनागरी में स्रोत-आधारित लिप्यंतरण किया गया है।
- source_word: נְסִיכֵי סִיחוֹן
  choice: सीहोन के अधीन शासक
  rationale: נְסִיכֵי शासकीय पद वाले अधिपतियों को सूचित करता है। संबंध-वाक्य के प्रसंग में ‘सीहोन के अधीन शासक’ हिन्दी में स्वाभाविक है और इन्हें सीहोन की संतान कहने की संभावित गलतफहमी से बचाता है।
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: जो उस देश में रहते थे
  rationale: ישׁב का कृदन्त निवास करने का अर्थ देता है; ‘जो ... रहते थे’ आधुनिक और स्पष्ट हिन्दी है।
theological_decisions:
- issue: מֹשֶׁה הִכָּה का आशय
  choice: मार गिराया
  alternative: पराजित किया
  rationale: सैनिक प्रसंग में दोनों अर्थ संभव हैं। गिनाए गए व्यक्तियों पर क्रिया लागू होने के कारण ‘मार गिराया’ अधिक ठोस है, पर पाठ से आगे बढ़कर युद्ध का विवरण नहीं जोड़ा गया।
- issue: נְסִיכֵי סִיחוֹן का संबंध
  choice: सीहोन के अधीन शासक
  alternative: सीहोन के राजकुमार
  rationale: इब्रानी पदनाम ‘राजकुमार/शासक’ दोनों अर्थ दे सकता है। यहाँ मिद्यानी प्रधानों का सीहोन से राजनीतिक संबंध अधिक संभावित है; वंशगत संबंध आरोपित न हो, इसलिए ‘अधीन शासक’ चुना गया और पदनाम का अंतर पादटिप्पणी में सुरक्षित रखा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लम्बे इब्रानी वाक्य को पठनीयता के लिए तीन हिन्दी वाक्यों में बाँटा गया है, जबकि संबंधों और पदनामों की भिन्नता सुरक्षित रखी गई है।
