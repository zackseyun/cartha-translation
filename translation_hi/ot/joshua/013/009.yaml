translation:
  language: hi
  text: अरोएर से, जो अर्नोन की घाटी के किनारे पर है, और उस नगर से, जो घाटी के बीच में है, और मेदबा से दीबोन तक के पूरे समतल प्रदेश से,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: अर्नोन की घाटी के किनारे
  rationale: שׂפה का मूल अर्थ ‘किनारा’ है; נחל यहाँ अर्नोन की घाटी अथवा जलधारा से बनी खड्ड को दर्शाता है। ‘घाटी के किनारे’ मूल की भौगोलिक अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּתוֹךְ הַנַּחַל
  choice: घाटी के बीच में
  rationale: בְּתוֹךְ का अर्थ ‘बीच में’ है और समान पद נחל के लिए पूरे वाक्य में ‘घाटी’ बनाए रखा गया है।
- source_word: הַמִּישֹׁר
  choice: समतल प्रदेश
  rationale: यह शब्द ऊँचे सपाट भूभाग या पठारी मैदान को सूचित कर सकता है; ‘समतल प्रदेश’ अर्थ को स्पष्ट रखता है और अनावश्यक रूप से अधिक विशिष्ट भौगोलिक व्याख्या नहीं थोपता।
