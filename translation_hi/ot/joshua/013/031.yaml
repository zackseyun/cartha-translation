base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/031.yaml
  text: and half of Gilead[a], and Ashtaroth and Edrei, the cities of the kingdom of Og in Bashan, belonged to the sons of Machir son of Manasseh—to half of the sons of Machir[b], according to their clans.
translation:
  language: hi
  text: और गिलाद का आधा भाग, और अश्तारोत और एद्रेई—जो बाशान में ओग के राज्य के नगर थे—मनश्शे के पुत्र माकीर के पुत्रों को, अर्थात् माकीर के पुत्रों में से आधे को, उनके कुलों के अनुसार मिला।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “माकीर के पुत्र” से माकीर के वंशज भी अभिप्रेत हो सकते हैं; अनुवाद में इब्रानी की पारिवारिक अभिव्यक्ति बनाए रखी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲצִי הַגִּלְעָד
  choice: और गिलाद का आधा भाग
  rationale: संयोजक וַ पिछले पद की भूमि-वितरण सूची को आगे बढ़ाता है; חֲצִי का क्षेत्रीय संदर्भ में स्वाभाविक अर्थ ‘आधा भाग’ है।
- source_word: עַשְׁתָּרוֹת וְאֶדְרֶעִי
  choice: अश्तारोत और एद्रेई
  rationale: दोनों स्थान-नामों का स्रोत के निकट और हिन्दी में पठनीय लिप्यंतरण रखा गया है।
- source_word: עָרֵי מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: जो बाशान में ओग के राज्य के नगर थे
  rationale: इब्रानी संबंध-श्रृंखला को सीधे रखा गया है; इसे केवल ‘राजनगर’ कहने से नगरों की भूमिका के बारे में अनावश्यक विशिष्टता आ सकती है।
- source_word: לִבְנֵי מָכִיר בֶּן־מְנַשֶּׁה
  choice: मनश्शे के पुत्र माकीर के पुत्रों को ... मिला
  rationale: לְ यहाँ आवंटन का संकेत देता है। क्रियारहित इब्रानी वाक्य को स्वाभाविक हिन्दी में ‘मिला’ से व्यक्त किया गया है, जबकि ‘पुत्रों’ की पारिवारिक भाषा बनाए रखी गई है।
- source_word: לַחֲצִי בְנֵי מָכִיר
  choice: अर्थात् माकीर के आधे पुत्रों को
  rationale: यह पहले वाक्यांश को अधिक ठीक रूप से सीमित करता है कि माकीर के वंश का केवल आधा भाग अभिप्रेत है; स्रोत में न होने के कारण ‘आधा गोत्र’ नहीं जोड़ा गया।
- source_word: לְמִשְׁפְּחוֹתָם
  choice: उनके कुलों के अनुसार
  rationale: भूमि-वितरण के वंशावली-संदर्भ में מִשְׁפָּחוֹת बड़े पारिवारिक-कुल समूहों को दर्शाता है; ‘कुलों’ आधुनिक हिन्दी में उपयुक्त और स्पष्ट है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्थान-नामों में स्रोत-सापेक्ष लिप्यंतरण और भूमि-वितरण की प्रशासनिक-वंशावली भाषा में ‘कुल’ का प्रयोग किया गया है।
