  yaml_path: translation/ot/joshua/013/033.yaml
  text: But to the tribe of Levi Moses gave no inheritance; Yahweh[a], the God of Israel, is their inheritance, just as he spoke to them.
translation:
  language: hi
  text: परन्तु मूसा ने लेवी के गोत्र को कोई विरासत[a] नहीं दी; याहवे, इस्राएल के परमेश्वर, स्वयं उनकी विरासत हैं, जैसा उन्होंने उनसे कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विरासत’ के लिए दोनों स्थानों पर ‘भाग’ भी अनुवादित किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/שֵׁבֶט הַ/לֵּוִי
  choice: परन्तु लेवी के गोत्र को
  rationale: संयोजक וּ संदर्भ में पिछले गोत्रों को मिले भूभाग के विपरीत लेवी की स्थिति बताता है; इसलिए ‘परन्तु’ स्वाभाविक है। שֵׁבֶט הַלֵּוִי पूरे लेवी गोत्र को सूचित करता है।
- source_word: לֹא נָתַן מֹשֶׁה נַחֲלָה
  choice: मूसा ने कोई विरासत नहीं दी
  rationale: यह सरल भूतकाल और स्पष्ट निषेध को बनाए रखता है। ‘विरासत’ भूमि के पैतृक भाग तथा वाचा-संबंधी अर्थ, दोनों को वहन करती है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में सीधे लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह इब्रानी संबंधवाचक रचना का सहज और सटीक हिन्दी रूप है।
- source_word: הוּא נַחֲלָתָם
  choice: ही उनकी विरासत हैं
  rationale: स्पष्ट הוּא के बल को ‘ही’ से व्यक्त किया गया है और दोनों स्थानों पर נַחֲלָה के लिए ‘विरासत’ रखकर मूल रूपक सुरक्षित रखा गया है। परमेश्वर के लिए आदरसूचक बहुवचन क्रिया ‘हैं’ स्वाभाविक हिन्दी है।
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: जैसा उन्होंने उनसे कहा था
  rationale: ‘कहा’ דִּבֶּר का स्वाभाविक हिन्दी रूप है और ‘वादा किया’ जैसी अधिक व्याख्यात्मक धारणा जोड़े बिना पूर्व कथन का भाव देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; इसलिए उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: लेवी की ‘विरासत’ का स्वरूप
  choice: यहवे स्वयं उनकी विरासत हैं
  alternative: यहवे उनका भाग हैं
  rationale: मूल पाठ परमेश्वर को ही लेवी की נַחֲלָה कहता है। अनुवाद इस रूपक और उसके धर्मवैज्ञानिक तनाव को किसी संस्थागत सुविधा या याजकीय अधिकार में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘विरासत’ की पुनरावृत्ति जानबूझकर रखी गई है ताकि इब्रानी נַחֲלָה के दोनों प्रयोग और उनका पारस्परिक संबंध सुरक्षित रहें।
