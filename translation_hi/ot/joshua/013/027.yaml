  text: וּ/בָ/עֵ֡מֶק בֵּ֣ית הָרָם֩ וּ/בֵ֨ית נִמְרָ֜ה וְ/סֻכּ֣וֹת וְ/צָפ֗וֹן יֶ֚תֶר מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַ/יַּרְדֵּ֖ן וּ/גְבֻ֑ל עַד קְצֵה֙ יָם כִּנֶּ֔רֶת עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/027.yaml
  text: and in the valley[a], Beth-haram, Beth-nimrah, Succoth, and Zaphon—the rest of the kingdom of Sihon king of Heshbon—with the Jordan as its border, as far as the lower end of the Sea of Kinnereth, beyond the Jordan eastward.
translation:
  language: hi
  text: और घाटी में बेत-हाराम, बेत-निम्रा, सुक्कोत और साफोन—हेशबोन के राजा सीहोन के राज्य का शेष भाग—यरदन उसकी सीमा था, किन्नेरत झील के निचले छोर[a] तक, यरदन के पार, पूर्व की ओर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किन्नेरत झील के किनारे तक” अथवा “किन्नेरत झील के छोर तक।”
    reason: कְצֵה का अर्थ ‘छोर,’ ‘किनारा,’ या ‘अंतिम सिरा’ हो सकता है; ‘निचला’ संदर्भगत भौगोलिक समझ है।
lexical_decisions:
- source_word: וּ/בָ/עֵמֶק
  choice: और घाटी में
  rationale: עֵמֶק घाटी या निचले भूभाग को दर्शाता है; नगरों की इस भौगोलिक सूची में ‘घाटी’ सहज और सटीक है।
- source_word: בֵּית הָרָם ... וְ/צָפוֹן
  choice: बेत-हाराम, बेत-निम्रा, सुक्कोत और साफोन
  rationale: ये स्थान-नाम हैं, इसलिए इनके अर्थ का अनुवाद करने के बजाय हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है; צָפוֹן को यहाँ दिशासूचक ‘उत्तर’ नहीं माना गया।
- source_word: יֶתֶר מַמְלְכוּת סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: अर्थात हेशबोन के राजा सीहोन के राज्य का शेष भाग
  rationale: יֶתֶר का अर्थ बचा हुआ या शेष भाग है। ‘अर्थात’ इस संक्षिप्त समानाधिकरण संबंध को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: הַ/יַּרְדֵּן וּ/גְבֻל
  choice: और यरदन उसकी सीमा थी
  rationale: हिब्रू वाक्यांश संक्षिप्त और समानाधिकरणात्मक है; हिंदी में स्वाभाविक रूप से स्पष्ट किया गया है कि यरदन उस भूभाग की सीमा थी।
- source_word: עַד קְצֵה יָם כִּנֶּרֶת
  choice: किन्नेरत झील के निचले छोर तक
  rationale: קְצֵה का मूल अर्थ छोर या अंतिम सिरा है। भूगोल और यरदन की सीमा के संदर्भ में ‘निचला छोर’ अभिप्रेत दिशा को स्पष्ट करता है, जबकि विकल्प को पादटिप्पणी में सुरक्षित रखा गया है। יָם को इस अंतर्देशीय जलाशय के लिए स्वाभाविक हिंदी ‘झील’ कहा गया है।
- source_word: עֵבֶר הַ/יַּרְדֵּן מִזְרָחָ/ה
  choice: यरदन के पार पूर्व की ओर
  rationale: यह प्रचलित प्रादेशिक सूत्र यरदन के पूर्वी पार्श्व को बताता है; अनुवाद दिशा और ‘पार’ दोनों को बनाए रखता है।
