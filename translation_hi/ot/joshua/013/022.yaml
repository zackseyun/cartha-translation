  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वाक्य-क्रम हिंदी के अनुसार स्वाभाविक बनाया गया है, पर ‘इस्राएल के पुत्रों’ जैसी मूल की ठोस अभिव्यक्ति सुरक्षित रखी गई है।
