  text: इस्राएलियों ने बओर के पुत्र, भावी बतानेवाले बिलाम को भी अपने द्वारा मारे गए लोगों के साथ[a] तलवार से मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने द्वारा मारे गए लोगों के बीच।” अंत का इब्रानी पदबंध कुछ असामान्य है; उसका आशय है कि बिलाम भी उन अन्य लोगों के संबंध में मारा गया जिन्हें इस्राएल ने मार डाला था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: को भी
  rationale: וְ यहाँ विजय-विवरण में बिलाम को एक अतिरिक्त मारे गए व्यक्ति के रूप में जोड़ता है, जबकि אֶת कर्म-चिह्न है। हिंदी में ‘को भी’ दोनों भूमिकाओं को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: बओर के पुत्र बिलाम
  rationale: इब्रानी पितृनाम-संरचना को स्पष्ट और प्रचलित हिंदी क्रम में रखा गया है।
- source_word: הַקּוֹסֵם
  choice: जो भविष्य बतानेवाला था
  rationale: קֹסֵם का अर्थ शकुन अथवा अन्य साधनों से भविष्य बतानेवाला व्यक्ति है। यह पदबंध आधुनिक पाठक के लिए स्पष्ट है और ‘भविष्यवक्ता’ कहकर उसे नबी के अर्थ में नहीं बदलता।
- source_word: הָרְגוּ
  choice: मार डाला
  rationale: क्रिया का पूर्ण और स्पष्ट अर्थ देता है तथा आधुनिक हिंदी में स्वाभाविक है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों ने
  rationale: मूल के ‘इस्राएल के पुत्र’ रूप को बनाए रखता है और कर्ता का कारक स्पष्ट करता है।
- source_word: בַּחֶרֶב
  choice: तलवार से
  rationale: करणवाचक בְ को युद्ध में प्रयुक्त साधन के रूप में सीधा और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל חַלְלֵיהֶם
  choice: अपने मारे हुओं के साथ
  rationale: 'असामान्य इब्रानी पदबंध को सह-संबंध के अर्थ में प्रस्तुत करता है: बिलाम भी इस्राएल द्वारा मारे गए अन्य लोगों के साथ मारा गया। ‘बीच’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।'
theological_decisions:
- issue: बिलाम के लिए קֹסֵם की पहचान
  choice: भविष्य बतानेवाला
  alternative: भविष्यवक्ता
  rationale: ‘भविष्यवक्ता’ हिंदी में प्रायः परमेश्वर के नबी का बोध कराता है और इस प्रसंग की नकारात्मक अथवा निषिद्ध भविष्य-कथन की धारणा को धुंधला कर सकता है। चुना हुआ पद मूल की पहचान को बिना संप्रदायगत व्याख्या जोड़े बनाए रखता है।
