source:
  edition: WLC
  text: וְ/כֹ֗ל עָרֵי֙ סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן עַד גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/010.yaml
  text: and all the cities of Sihon king of the Amorites[a], who reigned in Heshbon, as far as the border of the sons of Ammon.
translation:
  language: hi
  text: और एमोरियों के राजा सीहोन के सभी नगर—वह हेशबोन में राज्य करता था—अम्मोन के पुत्रों[a] की सीमा तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “अम्मोनियों।” इब्रानी में: “अम्मोन के पुत्र।”'
    reason: मूल की वंश-संबंधी अभिव्यक्ति तथा उसका सहज जातिवाचक विकल्प दर्शाने के लिए।
lexical_decisions:
- source_word: וְ/כֹל
  choice: और ... सभी
  rationale: וְ पिछले भू-भाग-वर्णन से जोड़ता है और כֹל सम्पूर्णता व्यक्त करता है; हिन्दी में अलग स्थानों पर रखे गए ये शब्द दोनों अर्थ स्वाभाविक रूप से बनाए रखते हैं।
- source_word: עָרֵי
  choice: नगर
  rationale: עִיר का रचनात्मक बहुवचन है; भू-भाग की सूची में ‘नगर’ मानक, गरिमापूर्ण और सहज है।
- source_word: סִיחוֹן
  choice: सीहोन
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: एमोरियों के राजा
  rationale: इब्रानी एकवचन जातिवाचक הָאֱמֹרִי सामूहिक अर्थ में है; हिन्दी में ‘एमोरियों के राजा’ स्वाभाविक रूप से वही संबंध व्यक्त करता है।
- source_word: אֲשֶׁר מָלַךְ
  choice: वह ... राज्य करता था
  rationale: מָלַךְ विशेष रूप से राजा के रूप में शासन करने को दर्शाता है; ‘राज्य करता था’ इस राजकीय अर्थ को सुरक्षित रखता है।
- source_word: בְּ/חֶשְׁבּוֹן
  choice: हेशबोन में
  rationale: नगर के नाम के साथ בְ स्थान बताता है, जिसे हिन्दी में ‘में’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַד גְּבוּל
  choice: की सीमा तक
  rationale: עַד क्षेत्र के विस्तार की अंतिम सीमा बताता है; ‘सीमा तक’ इसका स्पष्ट और संक्षिप्त हिन्दी रूप है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोन के वंशजों
  rationale: शाब्दिक रूप ‘अम्मोन के पुत्र’ है, पर जातीय समुदाय के लिए आधुनिक हिन्दी में ‘वंशज’ अधिक स्वाभाविक है और मूल की वंश-संबंधी अभिव्यक्ति भी बनाए रखता है।
