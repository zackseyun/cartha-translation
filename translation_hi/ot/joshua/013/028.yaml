  yaml_path: translation/ot/joshua/013/028.yaml
  text: This was the inheritance of the sons of Gad according to their clans—the cities and their villages[a].
translation:
  language: hi
  text: यह गाद के वंशजों की, उनके कुलों के अनुसार, विरासत थी—नगर और उनके गाँव।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह गाद के वंशजों की, उनके कुलों के अनुसार, विरासत है—नगर और उनके गाँव।” इब्रानी के इस सारांश-वाक्य को वर्तमानकाल या भूतकाल, दोनों में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: यह ... था
  rationale: स्त्रीलिंग एकवचन संकेतवाचक शब्द पीछे वर्णित भू-भाग की ओर संकेत करता है। इस सारांश-वाक्य में हिन्दी में भूतकाल स्वाभाविक है, यद्यपि वर्तमानकाल भी सम्भव है।
- source_word: נַחֲלַת
  choice: विरासत का भाग
  rationale: यह शब्द विरासत में मिले अथवा बाँटे गए भू-भाग को दर्शाता है। ‘विरासत का भाग’ भूमि-वितरण और विरासत—दोनों भावों को साधारण आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: בְּנֵי גָד
  choice: गाद के वंशजों
  rationale: शाब्दिक अर्थ ‘गाद के पुत्र’ है, पर यहाँ आशय गाद से निकले पूरे गोत्र से है; ‘वंशज’ आधुनिक हिन्दी में यही वंशावली-संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: उपसर्ग לְ यहाँ वितरण अथवा वर्गीकरण का भाव देता है और מִשְׁפָּחוֹת गोत्र के भीतर के कुल-समूहों को सूचित करता है।
- source_word: הֶעָרִים
  choice: नगर
  rationale: עָרִים भूमि-विभाजन की सूचियों में बसे हुए नगरों के लिए सामान्य शब्द है।
- source_word: וְחַצְרֵיהֶם
  choice: और उनके गाँव
  rationale: חָצֵר यहाँ नगरों से जुड़े आश्रित ग्रामीण बसावों को दर्शाता है; ‘गाँव’ आधुनिक पाठक के लिए इस संबंध को स्पष्ट और सहज बनाता है।
