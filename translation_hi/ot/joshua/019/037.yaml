lexical_decisions:
- source_word: קֶדֶשׁ
  choice: केदेश
  rationale: नगर-सूची में आया स्थान-नाम है; इसका अर्थानुवाद करने के बजाय प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: אֶדְרֶעִי
  choice: एद्रेई
  rationale: स्थान-नाम को हिब्रू उच्चारण के निकट और हिन्दी में सहज रूप से लिप्यंतरित किया गया है।
- source_word: עֵין חָצוֹר
  choice: एन-हासोर
  rationale: यह संयुक्त स्थान-नाम है। עֵין का अर्थ ‘सोता’ हो सकता है, पर नगरों की सूची में इसके नामात्मक कार्य को बनाए रखने के लिए पूरे नाम का लिप्यंतरण किया गया है।
- source_word: וְ
  choice: और
  rationale: हर स्थान के पहले दोहराया गया संयोजक हिब्रू सूची की समन्वयी संरचना को व्यक्त करता है, इसलिए उसकी पुनरावृत्ति सुरक्षित रखी गई है।
