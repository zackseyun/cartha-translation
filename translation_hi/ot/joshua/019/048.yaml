  rationale: यह इब्रानी के ‘दान के पुत्रों’ का स्वाभाविक हिन्दी रूप है और पूरे दानी समुदाय को सूचित करता है, न कि केवल प्रत्यक्ष पुत्रों को।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
