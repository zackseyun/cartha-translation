  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज सीमा-वर्णन। स्थान-नामों को देवनागरी में लिप्यंतरित किया गया है। कठिन अंतिम उपवाक्य को पाठ में पठनीय बनाया गया है, पर उसकी वास्तविक भाषिक अनिश्चितता पादटिप्पणी में सुरक्षित है।
