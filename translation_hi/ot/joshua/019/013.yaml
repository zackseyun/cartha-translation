base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/013.yaml
  text: From there it passed eastward[a], toward the sunrise, to Gath-hepher, to Eth-kazin, and went out to Rimmon[c][b], which extends to Neah.
translation:
  language: hi
  text: वहाँ से वह पूर्व की ओर[a], सूर्योदय की दिशा में, गथ-हेपेर और एत-कासीन[b] तक गई, और रिम्मोन तक निकली, जो नेआ तक फैला हुआ है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहाँ से वह पूर्व की ओर गई।” इब्रानी में दिशा बताने वाले दो पद हैं, जिनका शाब्दिक अर्थ “पूर्व की ओर, सूर्योदय की ओर” है; संभवतः यह बल देने के लिए है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: “एत-कासीन”; कुछ लोग इस रूप को “इत्ता-कासीन” समझते हैं।'
    reason: alternative_reading
  - marker: c
    text: इस उपवाक्य का इब्रानी पाठ कठिन है; उसका शाब्दिक रूप लगभग “रिम्मोन, जो नेआ की ओर चिह्नित है” है। बहुत-से लोग इसका अर्थ यह समझते हैं कि सीमा रिम्मोन से नेआ तक जाती थी।
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: वहाँ से
  rationale: संयोजक सहित पद का शाब्दिक अर्थ ‘और वहाँ से’ है; हिन्दी में सीमा-वर्णन की क्रमिक गति ‘वहाँ से’ द्वारा स्वाभाविक रूप से व्यक्त होती है।
- source_word: עָבַר
  choice: वह ... गई
  rationale: सीमा-वर्णन में यह क्रिया सीमा-रेखा के एक स्थान से दूसरे स्थान की ओर जाने को बताती है; निहित कर्ता ‘सीमा’ स्त्रीलिंग है।
- source_word: קֵדְמָה מִזְרָחָה
  choice: पूर्व की ओर, सूर्योदय की दिशा में
  rationale: दोनों दिशासूचक पदों को रखकर इब्रानी की पुनरुक्ति और बल सुरक्षित किया गया है।
- source_word: גִּתָּה חֵפֶר
  choice: गथ-हेपेर
  rationale: यौगिक स्थान-नाम का प्रचलित बाइबलीय लिप्यंतरण।
- source_word: עִתָּה קָצִין
  choice: एत-कासीन
  rationale: मसोरेटी पद-विभाजन को एक स्थान-नाम के रूप में लिया गया है; स्वरूप अनिश्चित होने के कारण पादटिप्पणी दी गई है।
- source_word: וְיָצָא
  choice: और ... निकली
  rationale: सीमाओं के वर्णन में यह क्रिया सीमा के आगे निकलने या किसी बिंदु तक पहुँचने का स्थानिक बिंब देती है।
- source_word: רִמּוֹן
  choice: रिम्मोन
  rationale: स्थान-नाम का ध्वन्यात्मक लिप्यंतरण।
- source_word: הַמְּתֹאָר הַנֵּעָה
  choice: जहाँ से सीमा नेआ तक जाती थी
  rationale: कठिन इब्रानी वाक्यांश को सीमा के रिम्मोन से नेआ तक विस्तार के संभावित अर्थ में स्वाभाविक हिन्दी दी गई है, जबकि अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
