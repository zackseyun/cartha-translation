  yaml_path: translation/ot/joshua/019/015.yaml
  text: 'Kattath[a], Nahalal, Shimron, Idalah, and Bethlehem: twelve cities with their villages.'
translation:
  language: hi
  text: और कत्तात, नहलाल, शिमरोन, यिदअला और बेतलेहेम[a]—कुल बारह नगर और उनके गाँव।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ बेतलेहेम एक स्थान का नाम है; इसका अनुवाद “रोटी का घर” नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קַטָּת
  choice: कत्तात
  rationale: स्थान-नाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: נַהֲלָל
  choice: नहलाल
  rationale: स्थान-नाम का स्वाभाविक हिंदी लिप्यंतरण।
- source_word: שִׁמְרוֹן
  choice: शिमरोन
  rationale: हिब्रू स्थान-नाम को अनुवादित करने के बजाय लिप्यंतरित किया गया है।
- source_word: יִדְאֲלָה
  choice: यिदअला
  rationale: आरंभिक योड और बीच के अलेफ को यथासंभव स्पष्ट रखते हुए हिब्रू रूप के निकट लिप्यंतरण।
- source_word: בֵית לָחֶם
  choice: बेतलेहेम
  rationale: यहाँ यह एक स्थान-नाम है; इसलिए इसके घटकों का शाब्दिक अनुवाद करने के बजाय प्रचलित हिंदी बाइबलीय रूप अपनाया गया है।
- source_word: עָרִים
  choice: नगर
  rationale: क्षेत्र-विभाजन की सूची में बसे हुए स्थानों के लिए गरिमापूर्ण और सहज आधुनिक हिंदी शब्द।
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: बारह
  rationale: नगरों की संख्या बताने वाला मूल कार्डिनल अंक।
- source_word: חַצְרֵיהֶן
  choice: उनके गाँव
  rationale: इन नगरों से संबद्ध आश्रित या छोटे, प्रायः बिना दीवार वाले बसेरे; आधुनिक हिंदी में 'गाँव' स्पष्ट और स्वाभाविक है।
