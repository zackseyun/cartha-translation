  text: Then the border turned to Ramah[a], and to the fortified city of Tyre; then the border turned to Hosah, and its boundary points were at the sea[b], from the region of Achzib.
translation:
  language: hi
  text: फिर सीमा रामा की ओर मुड़ी और किलाबंद नगर सोर तक पहुँची। इसके बाद सीमा होसा की ओर मुड़ी, और उसके अंतिम छोर अखज़ीब के भूभाग से समुद्र की ओर[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पश्चिम की ओर’; इब्रानी में शाब्दिक रूप से ‘समुद्र की ओर’ है, जो प्रायः पश्चिम दिशा के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: मुड़ी
  rationale: सीमा-वर्णनों में यह क्रिया सीमा की दिशा बदलने को दर्शाती है; ‘मुड़ी’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: הַגְּבוּל
