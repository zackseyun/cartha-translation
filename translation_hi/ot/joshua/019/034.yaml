base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/034.yaml
  text: Then the border turned westward to Aznoth-tabor[a], and from there it went out to Hukkok, and it reached Zebulun on the south, and it reached Asher on the west, and Judah at the Jordan toward the east, where the sun rises.
translation:
  language: hi
  text: फिर सीमा पश्चिम की ओर मुड़कर अज़नोत-ताबोर तक गई। वहाँ से वह हुक्कोक की ओर बढ़ी। वह दक्षिण में जबूलून से और पश्चिम में आशेर से जा मिली, और यहूदा से यरदन के किनारे, पूर्व में, सूर्योदय की दिशा में जा मिली[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में क्रमशः ‘और यहूदा, यरदन, सूर्योदय की दिशा में’ है। इसका भूगोल कठिन है, क्योंकि सामान्य रूप से समझे जाने वाले गोत्रीय क्षेत्रों में नप्ताली की सीमा सीधे यहूदा से नहीं मिलती थी। कुछ लोग इन शब्दों को अलग ढंग से समझते हैं या यहाँ पाठगत कठिनाई मानते हैं; मुख्य पाठ में इब्रानी को उसके वर्तमान रूप के अनुसार अनुवादित किया गया है।
    reason: textual_variant
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  choice: फिर सीमा ... मुड़कर
  rationale: सीमाओं के वर्णन में שׁוב दिशा बदलने को दर्शाता है; ‘मुड़कर’ आधुनिक हिन्दी में स्वाभाविक है और क्रमसूचक וְ का भाव ‘फिर’ से व्यक्त होता है।
- source_word: יָמָּה
  choice: पश्चिम की ओर
  rationale: शाब्दिक अर्थ ‘समुद्र की ओर’ है, पर इस भौगोलिक संदर्भ में यह पश्चिम दिशा का संकेत है।
- source_word: אַזְנוֹת תָּבוֹר
  choice: अज़नोत-ताबोर
  rationale: स्थान-नाम को अनुवादित करने के बजाय स्रोत के निकट देवनागरी लिप्यंतरण में रखा गया है।
- source_word: וְיָצָא מִשָּׁם
  choice: वहाँ से वह ... बढ़ी
  rationale: सीमा-वर्णन में יצא किसी बिंदु से सीमा के आगे जाने को बताता है; ‘बढ़ी’ हिन्दी में सहज है।
- source_word: חוּקֹקָה
  choice: हुक्कोक की ओर
  rationale: हुक्कोक स्थान-नाम का देवनागरी लिप्यंतरण है; दिशासूचक ה को ‘की ओर’ से व्यक्त किया गया है।
- source_word: וּפָגַע
  choice: जा मिली
  rationale: क्षेत्रीय सीमा के संदर्भ में פגע दूसरी सीमा या भूभाग के संपर्क में आने का अर्थ देता है।
- source_word: מִנֶּגֶב
  choice: दक्षिण में
  rationale: यहाँ מן के साथ נגב सीमा के दक्षिणी पक्ष को सूचित करता है।
- source_word: מִיָּם
  choice: पश्चिम में
  rationale: शाब्दिक रूप से ‘समुद्र की ओर/समुद्र की तरफ़ से’ है, पर दिशात्मक संदर्भ में पश्चिमी पक्ष अभिप्रेत है।
- source_word: וּבִיהוּדָה הַיַּרְדֵּן מִזְרַח הַשָּׁמֶשׁ
  choice: और पूर्व में, सूर्योदय की ओर, यरदन के पास यहूदा से जा मिली
  rationale: मसोरेटिक पाठ में यहूदा का स्पष्ट उल्लेख बनाए रखा गया है। वाक्य को हिन्दी में पठनीय बनाया गया है, पर कठिन भूगोल को बदलकर सामंजस्यपूर्ण नहीं किया गया।
theological_decisions:
- issue: ‘यरदन के पास यहूदा’ वाला भौगोलिक रूप से कठिन वाक्यांश
  choice: मुख्य पाठ में मसोरेटिक शब्दावली को रखते हुए यहूदा का उल्लेख स्पष्ट रूप से बनाए रखा गया।
  alternative: ‘यहूदा’ को लिपिकीय त्रुटि मानना, उसे यरदन-पार किसी बस्ती से जोड़ना, या ऐसा सहज रूप देना जिससे नप्ताली और यहूदा के सीधे संपर्क का संकेत न रहे।
  rationale: यह मुख्यतः पाठालोचनात्मक और भौगोलिक कठिनाई है, न कि सिद्धान्तगत प्रश्न। प्राप्त इब्रानी पाठ को बिना अनुमानित संशोधन के प्रस्तुत करना और कठिनाई को पाद-टिप्पणी में बताना उचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। सीमा-वर्णन की पुनरावृत्ति को बचाए रखते हुए हिन्दी वाक्य-प्रवाह को सहज बनाया गया है। कठिन ‘यहूदा’ वाक्यांश को न हटाया गया है, न किसी अनुमानित पाठ से बदला गया है।
