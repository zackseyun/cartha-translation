    text: शाब्दिक रूप से ‘ऊपर आई’; चिट्ठी डालने के प्रसंग में इसका अर्थ ‘निकली’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: निकली
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/आना’ है; चिट्ठी डालने के प्रसंग में हिन्दी का स्वाभाविक प्रयोग ‘चिट्ठी निकलना’ है। पादटिप्पणी मूल इब्रानी बिंब को सुरक्षित रखती है।
- source_word: הַגּוֹרָל הַשְּׁלִישִׁי
  choice: तीसरी चिट्ठी
  rationale: भूमि-विभाजन का निर्णय करने के लिए डाली गई lot के लिए ‘चिट्ठी’ सामान्य और स्पष्ट हिन्दी शब्द है; क्रमवाचक विशेषण को यथावत रखा गया है।
- source_word: לִבְנֵי זְבוּלֻן
  choice: जबूलून के वंशजों के लिए
  rationale: בני का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ पूरा गोत्र अभिप्रेत है; ‘वंशज’ पारिवारिक-गोत्रीय संबंध बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: משפחה यहाँ गोत्र के भीतर की कुलगत इकाइयों को दर्शाता है और לְ वितरण के आधार को व्यक्त करता है।
- source_word: גְּבוּל נַחֲלָתָם
  choice: उनकी विरासत की सीमा
  rationale: גבול सीमा-रेखा को और נחלה विरासत में मिली आवंटित भूमि को व्यक्त करता है; यह अनुवाद दोनों अर्थों को अलग और स्पष्ट रखता है।
- source_word: עַד שָׂרִיד
  choice: सारीद तक
  rationale: सीमा-वर्णन में עַד विस्तार की अंतिम हद बताता है; स्थान-नाम שָׂרִיד का देवनागरी लिप्यंतरण ‘सारीद’ किया गया है।
