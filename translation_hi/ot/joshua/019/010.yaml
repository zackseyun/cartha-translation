  text: The third lot came up for the sons of Zebulun[a], according to their clans, and the border of their inheritance was as far as Sarid.
translation:
  language: hi
  text: तीसरी चिट्ठी ज़बूलून के वंशजों के लिए उनके कुलों के अनुसार निकली[a], और उनकी विरासत की सीमा सारीद तक थी।
  philosophy: optimal-equivalence
  footnotes:
