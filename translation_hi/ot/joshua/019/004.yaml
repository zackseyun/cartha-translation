- source_word: חָרְמָה
  choice: होर्मा
  rationale: यह स्थान-नाम है। प्रचलित हिन्दी बाइबलीय रूप और इब्रानी स्वरांकन को ध्यान में रखते हुए ‘होर्मा’ रखा गया है।
- source_word: וְ / וּ
  choice: और
  rationale: संयोजक उपसर्ग तीन स्थान-नामों को एक सूची में जोड़ते हैं। स्वाभाविक हिन्दी में अल्पविराम और अंतिम नाम से पहले ‘और’ पर्याप्त है।
