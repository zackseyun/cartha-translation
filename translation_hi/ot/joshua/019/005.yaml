lexical_decisions:
- source_word: צִקְלַג
  choice: सिकलग
  rationale: यह स्थान का नाम है; नगरों की सूची में अर्थानुवाद के बजाय प्रचलित ध्वन्यात्मक रूप रखा गया है।
- source_word: בֵית הַמַּרְכָּבוֹת
  choice: बेत-मर्काबोत
  rationale: ‘घर’ और ‘रथों’ से बना यह स्थान-नाम है। मुख्य पाठ में इसे नाम के रूप में लिप्यंतरित किया गया है और इसका संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: חֲצַר סוּסָה
  choice: हसर-सूसा
  rationale: यह חצר (‘बस्ती/घेरा’) और घोड़े से संबंधित סוסה से बना स्थान-नाम है। नगरों की सूची में लिप्यंतरण स्वाभाविक है; अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְ / וּ / וַ
  choice: और
  rationale: सूची की वस्तुओं को जोड़ने वाले हिब्रू समुच्चयबोधकों का सहज हिन्दी रूप।
