  text: Then it turned back from Sarid eastward[a], toward the sunrise, to the border of Kisloth-tabor, and went out to Daberath and up to Japhia.
translation:
  language: hi
  text: फिर सीमा सारीद से मुड़कर पूर्व की ओर[a], सूर्योदय की दिशा में, किसलोथ-ताबोर की सीमा तक गई; वहाँ से वह दाबरत तक निकल गई और ऊपर यापीआ तक गई।
  philosophy: optimal-equivalence
  footnotes:
