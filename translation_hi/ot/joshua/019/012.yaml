    text: या “पूर्व की ओर, पूरब की दिशा में”; शाब्दिक अर्थ, “पूर्व की ओर, सूर्य के उदय की दिशा में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: फिर सीमा … मुड़कर
  rationale: सीमा-वर्णन में שׁוב दिशा बदलने का संकेत देता है। हिन्दी में स्पष्टता के लिए निहित कर्ता ‘सीमा’ जोड़ा गया है और ‘मुड़कर’ स्वाभाविक भौगोलिक अभिव्यक्ति है।
- source_word: מִשָּׂרִיד
  choice: सारीद से
  rationale: स्थान-नाम का निकट देवनागरी लिप्यंतरण किया गया है; מִן को आरंभ-बिंदु बताने के लिए ‘से’ कहा गया है।
- source_word: קֵדְמָה מִזְרַח הַשֶּׁמֶשׁ
  choice: पूर्व की ओर, सूर्योदय की दिशा में
  rationale: इब्रानी के दोनों दिशासूचक पदों को बनाए रखते हुए पूर्व दिशा और सूर्योदय की छवि दोनों सुरक्षित रखी गई हैं।
- source_word: עַל גְּבוּל
  choice: की सीमा तक
  rationale: इस सीमा-वर्णन में על גְּבוּל किसी स्थान की सीमा तक पहुँचने को व्यक्त करता है; ‘सीमा तक’ सहज और सटीक हिन्दी है।
- source_word: כִּסְלֹת תָּבֹר
  choice: किसलोथ-ताबोर
  rationale: संयुक्त स्थान-नाम का स्रोतानुसार देवनागरी लिप्यंतरण; योजक-चिह्न दोनों घटकों की एकता दिखाता है।
- source_word: וְיָצָא
  choice: वहाँ से वह … निकली
  rationale: सीमा-वर्णन में יצא सीमा-रेखा के आगे निकलने या बढ़ने को दर्शाता है। ‘निकली’ ठोस मूल बिंब बनाए रखता है; ‘वहाँ से’ हिन्दी प्रवाह के लिए जोड़ा गया है।
- source_word: אֶל הַדָּבְרַת
  choice: दाबरत को
  rationale: स्थान-नाम का निकट लिप्यंतरण किया गया है; हिन्दी में गंतव्य को स्वाभाविक रूप से ‘को’ से व्यक्त किया गया है।
- source_word: וְעָלָה
  choice: ऊपर … तक गई
  rationale: עלה स्थलाकृतिक चढ़ाई का संकेत दे सकता है। ‘ऊपर … तक गई’ ऊँचाई की भौगोलिक बारीकी को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יָפִיעַ
  choice: यापीआ
  rationale: इब्रानी व्यंजन और स्वर-रूप के निकट देवनागरी लिप्यंतरण।
