  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत के निकट वाक्य। ‘आशेर के वंशजों के गोत्र’ इब्रानी की वंशावली-सूचक जनजातीय अभिव्यक्ति को स्पष्ट रखता है।
