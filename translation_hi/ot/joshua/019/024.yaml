  text: וַ/יֵּצֵא֙ הַ/גּוֹרָ֣ל הַֽ/חֲמִישִׁ֔י לְ/מַטֵּ֥ה בְנֵֽי אָשֵׁ֖ר לְ/מִשְׁפְּחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/024.yaml
  text: The fifth lot came out for the tribe of the sons of Asher[a], according to their clans.
translation:
  language: hi
  text: पाँचवीं चिट्ठी आशेर के वंशजों के गोत्र के लिए, उनके कुलों के अनुसार निकली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकली
  rationale: יצא का मूल अर्थ ‘निकलना’ है। चिट्ठी डालकर भूमि बाँटने के प्रसंग में ‘चिट्ठी ... निकली’ स्वाभाविक हिन्दी है और इब्रानी बिंब को बनाए रखती है; ‘निकाली गई’ अधिक व्याख्यात्मक होगा।
- source_word: הַגּוֹרָל
  choice: चिट्ठी
  rationale: גורל यहाँ निर्णय अथवा बँटवारे के लिए डाली गई चिट्ठी को दर्शाता है। ‘चिट्ठी’ हिन्दी बाइबलीय प्रयोग में स्पष्ट है और परिणामसूचक ‘भाग’ की अपेक्षा मूल प्रक्रिया को अधिक निकटता से व्यक्त करती है।
- source_word: הַחֲמִישִׁי
  choice: पाँचवीं
  rationale: यह גורל के साथ लिंग-संगत क्रमवाचक विशेषण है; हिन्दी में ‘चिट्ठी’ के अनुसार ‘पाँचवीं’ स्वाभाविक है।
- source_word: לְמַטֵּה
  choice: गोत्र के लिए
  rationale: מַטֶּה का मूल अर्थ ‘डंडा/छड़ी’ भी हो सकता है, पर इस भूमि-विभाजन सूत्र में यह इस्राएल के ‘गोत्र’ का स्थापित पद है।
- source_word: בְנֵי אָשֵׁר
  choice: आशेर के वंशजों
  rationale: शाब्दिक अर्थ ‘आशेर के पुत्र’ है, पर यहाँ संपूर्ण जनजातीय वंश का संकेत है। ‘वंशजों’ आधुनिक हिन्दी में समावेशी और प्रसंगानुकूल है, बिना वंशगत संबंध खोए।
- source_word: לְמִשְׁפְּחוֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחוֹתָם गोत्र के भीतर के कुल-समूहों को दर्शाता है। उपसर्ग לְ की वितरणात्मक शक्ति को ‘के अनुसार’ व्यक्त करता है।
theological_decisions: []
