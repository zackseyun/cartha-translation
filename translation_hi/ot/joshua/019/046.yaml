lexical_decisions:
- source_word: וּמֵי הַיַּרְקוֹן
  choice: और यरकोन के जल-स्रोत
  rationale: מֵי, מַיִם का संबंध-रूप है और शाब्दिक अर्थ ‘जल’ है। सीमा-सूची के संदर्भ में स्वाभाविक हिन्दी के लिए ‘जल-स्रोत’ रखा गया है; इसे ‘मे-यरकोन’ स्थान-नाम मानने की संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: וְהָרַקּוֹן
  choice: और रक्कोन
  rationale: इसे व्यक्तिवाचक स्थान-नाम मानकर देवनागरी में लिप्यंतरित किया गया है; हिब्रू उपपद को हिन्दी में अलग से नहीं दर्शाया गया।
- source_word: עִם הַגְּבוּל
  choice: और ... सीमा-क्षेत्र
  rationale: עִם का मूल अर्थ ‘के साथ’ है, पर सूची में हिन्दी का संयोजक ‘और’ अधिक स्वाभाविक है। גְּבוּל सीमा-रेखा, सरहद या सीमावर्ती भूभाग सूचित कर सकता है; ‘सीमा-क्षेत्र’ इस संदर्भ में दोनों स्थानिक पहलुओं को खुला रखता है।
- source_word: מוּל
  choice: के सामने
  rationale: यह स्थानिक रूप से ‘सामने’ या ‘आमने-सामने’ होने का बोध देता है और याफ़ा के सापेक्ष सीमा-क्षेत्र की स्थिति बताता है।
- source_word: יָפוֹ
  choice: याफ़ा
  rationale: हिब्रू नाम का आधुनिक हिन्दी में पहचानने योग्य और स्रोत के निकट लिप्यंतरण।
