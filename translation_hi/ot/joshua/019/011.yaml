  text: And their border went up westward to Maralah, and touched Dabbesheth, and touched the wadi that is opposite Jokneam.
translation:
  language: hi
  text: उनकी सीमा पश्चिम की ओर माराला तक चढ़ी, और दब्बेशेत से मिली, और उस नाले से मिली जो योकनाम के सामने है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: चढ़ी
  rationale: मूल क्रिया עלה के आरोहण-संबंधी भौगोलिक भाव को बनाए रखता है।
- source_word: לַיָּמָּה
  choice: पश्चिम की ओर
  rationale: शाब्दिक रूप से ‘समुद्र की ओर’; इस सीमावर्णन में इसका प्रचलित दिशात्मक अर्थ ‘पश्चिम की ओर’ है।
- source_word: וּפָגַע
  choice: छूती हुई … पहुँची
  rationale: פגע सीमा के किसी स्थान से मिलने या उसे छूने का भाव देता है; हिंदी में लगातार दोहराव से बचते हुए पहले प्रसंग में ‘छूती हुई’ और अंतिम लक्ष्य के लिए ‘पहुँची’ स्वाभाविक है।
- source_word: הַנַּחַל
  choice: नाले
  rationale: נחל यहाँ जलधारा अथवा घाटी में बहने वाले नाले को सूचित कर सकता है; ‘नाला’ संदर्भानुकूल और सामान्य पाठक के लिए स्पष्ट है।
- source_word: עַל־פְּנֵי
  choice: के सामने
  rationale: स्थान-संबंधी मूल अभिव्यक्ति का सीधा और स्वाभाविक हिंदी रूप।
