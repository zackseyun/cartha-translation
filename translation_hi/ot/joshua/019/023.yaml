  text: यह इस्साकार के वंशजों के गोत्र का विरासत में मिला भाग था, उनके कुलों के अनुसार—नगर और उनके गाँव।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: यह ... था
  rationale: स्त्रीलिंग एकवचन संकेतवाचक शब्द पहले वर्णित भूभाग की ओर संकेत करता है। इब्रानी वाक्य में क्रिया नहीं है; वर्णनात्मक प्रसंग में हिन्दी भूतकाल स्वाभाविक है।
- source_word: נַחֲלַת
  choice: भाग
  rationale: यहाँ נַחֲלָה विरासत में मिले भू-भाग को दर्शाता है। सामान्य आधुनिक हिन्दी में ‘भाग’ भूमि-विभाजन के संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: מַטֵּה בְנֵי יִשָּׂשכָר
  choice: इस्साकार के वंशजों का गोत्र
  rationale: מַטֵּה का संदर्भगत अर्थ ‘गोत्र’ है, और בְנֵי יִשָּׂשכָר वंशगत सामुदायिक पहचान बताता है; ‘वंशज’ आधुनिक हिन्दी में ‘पुत्रों’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחוֹת गोत्र के भीतर के कुल-समूह हैं और לְ यहाँ वितरण या व्यवस्था का भाव देता है।
- source_word: הֶעָרִים
  choice: नगर
  rationale: עָרִים आबाद केंद्रों को दर्शाता है; यहोशू की भू-सूचियों में ‘नगर’ उपयुक्त पारंपरिक और स्पष्ट शब्द है।
- source_word: וְחַצְרֵיהֶן
  choice: और उनके गाँव
  rationale: חָצֵר यहाँ नगरों से जुड़े छोटे ग्रामीण निवासों को दर्शाता है; ‘गाँव’ सामान्य पाठक के लिए स्पष्ट है।
