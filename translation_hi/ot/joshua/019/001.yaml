base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/001.yaml
  text: The second lot came out for Simeon[a], for the tribe of the sons of Simeon according to their clans[b], and their inheritance was within the inheritance of the sons of Judah.
translation:
  language: hi
  text: दूसरा चिट्ठा शिमोन के लिए[a], अर्थात् शिमोन के वंशजों के गोत्र के लिए, उनके कुलों के अनुसार निकला; और उनकी विरासत यहूदा के वंशजों की विरासत के भीतर थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूसरा चिट्ठा शिमोन के नाम पड़ा।” हिब्रू क्रिया का शाब्दिक अर्थ “निकला” है और यहाँ चिट्ठा डालने के परिणाम के लिए प्रयुक्त हुई है।
    reason: lexical_alternative
  - marker: b
    text: “शिमोन के वंशज” और “यहूदा के वंशज” उन गोत्रों के सदस्यों के लिए प्रयुक्त हिब्रू वंशगत पद हैं।
    reason: cultural_note
