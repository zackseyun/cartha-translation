  naturalness: A reordered nominal summary is more idiomatic in modern standard Hindi. “विरासत में मिला भाग” clearly expresses the territorial inheritance without excessive literalism.
  terminology: “गोत्र” is retained for מַטֶּה and “कुल” for מִשְׁפָּחָה, preserving the source’s distinction. “वंशज” is natural for the tribal sense of בְנֵי, with a note giving the literal wording.
