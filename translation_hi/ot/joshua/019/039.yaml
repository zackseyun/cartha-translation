    rationale: 'The summary’s demonstrative and the following city list are better expressed with a colon and a singular demonstrative: “यह ... था: नगर और उनके गाँव।”'
  - severity: low
    issue: Footnote b explains “भाग,” although the translation’s significant nonliteral choice is “वंशज” for “sons of Naphtali.”
    rationale: The footnote should align with the source expression and clarify that “वंशज” represents the Hebrew tribal kinship idiom.
