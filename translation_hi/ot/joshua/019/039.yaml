    issue: The main text renders נַחֲלָה merely as “भाग.”
    rationale: In Joshua’s land-allotment context, the word specifically denotes an inherited territorial portion. The supplied footnote mitigates this but the main text should retain the inherited-land sense.
  - severity: medium
