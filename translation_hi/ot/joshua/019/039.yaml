base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/039.yaml
  text: This was the inheritance of the tribe of the sons of Naphtali according to their clans—the cities and their villages[a][b].
translation:
  language: hi
  text: 'उनके कुलों के अनुसार नप्ताली के वंशजों के गोत्र का विरासत में मिला भाग यह था: नगर और उनके गाँव।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह है।” इब्रानी के इस संज्ञात्मक वाक्य का अनुवाद वर्तमान या भूतकाल में किया जा सकता है; यहाँ पिछली सूची का सार होने के कारण भूतकाल रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक, “नप्ताली के पुत्र।” यह इब्रानी जनजातीय अभिव्यक्ति नप्ताली के वंशजों या उसके गोत्र के लोगों को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: यही था
  rationale: यह स्त्रीलिंग संकेतवाचक सर्वनाम पिछले पदों में दी गई भूमि और नगरों की सूची का सार प्रस्तुत करता है। हिन्दी में इस पूर्ववर्ती विवरण के निष्कर्ष के रूप में भूतकाल स्वाभाविक है; वर्तमानकाल भी व्याकरणतः सम्भव है।
- source_word: נַחֲלַת
  choice: भाग
  rationale: भूमि-वितरण के प्रसंग में यह विरासत में मिले भू-भाग को दर्शाता है। सहज आधुनिक हिन्दी में ‘भाग’ स्पष्ट है, जबकि पादटिप्पणी में अधिक शाब्दिक ‘विरासत’ दिया गया है।
- source_word: מַטֵּה בְנֵי נַפְתָּלִי
  choice: नप्ताली के वंशजों का गोत्र
  rationale: מַטֶּה यहाँ ‘गोत्र’ के अर्थ में है, न कि ‘लाठी’। בְנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर वंशगत सामुदायिक अर्थ को स्वाभाविक हिन्दी में ‘वंशज’ व्यक्त करता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: भूमि-वितरण के संदर्भ में מִשְׁפָּחָה विस्तृत कुल-समूह को दर्शाता है; לְ वितरण या वर्गीकरण के भाव में ‘के अनुसार’ है।
- source_word: הֶעָרִים
  choice: ये नगर
  rationale: עִיר का पारंपरिक और प्रसंगानुकूल अर्थ ‘नगर’ है। संकेतसूचक ‘ये’ सार-वाक्य को हिन्दी में स्पष्ट बनाता है।
- source_word: וְחַצְרֵיהֶן
  choice: और इनके गाँव
  rationale: חָצֵר यहाँ नगरों से जुड़े अधीनस्थ ग्रामीण निवासों को दर्शाता है; ‘गाँव’ साधारण पाठक के लिए स्पष्ट और स्वाभाविक है।
