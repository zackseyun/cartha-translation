lexical_decisions:
- source_word: אֲדָמָה
  choice: अदामा
  rationale: यह नगरों की सूची में आया स्थान-नाम है; इसलिए इसके सामान्य संज्ञा-संबंधी अर्थ के बजाय नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: הָרָמָה
  choice: रामा
  rationale: यह स्थान-नाम है। आरंभिक निश्चित उपपद को हिंदी में अलग से व्यक्त नहीं किया गया, क्योंकि यहाँ स्वाभाविक रूप में प्रचलित नाम अपेक्षित है।
- source_word: חָצוֹר
  choice: हासोर
  rationale: यह नगर का नाम है; हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण रखा गया है।
- source_word: וְ
  choice: और
  rationale: संयोजक नगरों की सूची को जोड़ता है; हिंदी में अंतिम नाम से पहले स्वाभाविक रूप से ‘और’ रखा गया है।
