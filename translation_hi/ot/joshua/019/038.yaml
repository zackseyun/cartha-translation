source:
  edition: WLC
  text: וְ/יִרְאוֹן֙ וּ/מִגְדַּל אֵ֔ל חֳרֵ֥ם וּ/בֵית עֲנָ֖ת וּ/בֵ֣ית שָׁ֑מֶשׁ עָרִ֥ים תְּשַֽׁע עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/038.yaml
  text: 'and Yiron[a], Migdal-el, Horem, Beth-anath, and Beth-shemesh: nineteen cities[b], with their villages.'
translation:
  language: hi
  text: और यिरोन, मिग्दल-एल[a], होरेम, बेत-अनात[b] और बेत-शेमेश[b]—कुल उन्नीस नगर और उनके गाँव।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मिग्दल-एल’ एक स्थान-नाम है; इसके शब्द-घटकों का शाब्दिक अर्थ ‘एल/परमेश्वर की मीनार’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘बेत-अनात’ और ‘बेत-शेमेश’ स्थान-नाम हैं; उनके शाब्दिक अर्थ क्रमशः ‘अनात का घर’ और ‘सूर्य का घर’ हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יִרְאוֹן
  choice: और यिरोन
  rationale: स्थान-नाम को उसके हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है; आरंभिक וְ को ‘और’ से व्यक्त किया गया है।
- source_word: וּ/מִגְדַּל אֵל
  choice: मिग्दल-एल
  rationale: संयुक्त स्थान-नाम को अर्थानुवाद करने के बजाय लिप्यंतरित किया गया है; योजक-चिह्न उसके दो घटकों को स्पष्ट रखता है।
- source_word: חֳרֵם
  choice: होरेम
  rationale: स्थान-नाम का हिब्रू रूप देवनागरी में लिप्यंतरित किया गया है।
- source_word: וּ/בֵית עֲנָת
  choice: बेत-अनात
  rationale: यह संयुक्त स्थान-नाम है, इसलिए इसे ‘अनात का घर’ कहकर अनूदित करने के बजाय लिप्यंतरित किया गया है।
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: बेत-शेमेश
  rationale: यह संयुक्त स्थान-नाम है, इसलिए इसे ‘सूर्य का घर’ कहकर अनूदित करने के बजाय लिप्यंतरित किया गया है।
- source_word: עָרִים
  choice: नगर
  rationale: क्षेत्र-विभाजन की इस सूची में עָרִים के लिए स्वाभाविक और प्रचलित हिन्दी शब्द ‘नगर’ चुना गया है।
- source_word: תְּשַׁע עֶשְׂרֵה
  choice: कुल उन्नीस
  rationale: हिब्रू गणना-सूत्र को स्वाभाविक हिन्दी में प्रस्तुत करने के लिए ‘कुल’ जोड़ा गया है; संख्या ‘उन्नीस’ मूल के अनुरूप है।
- source_word: וְ/חַצְרֵי/הֶן
  choice: और उनके गाँव
  rationale: חֲצֵרִים यहाँ नामित नगरों से जुड़े आश्रित गाँवों या छोटी बस्तियों को सूचित करता है; ‘उनके गाँव’ सहज और प्रसंगानुकूल है।
