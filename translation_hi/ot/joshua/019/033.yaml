- source_word: וַאֲדָמִי הַנֶּקֶב
  choice: अदामी-नेकेब
  rationale: सीमा-विवरण में इसे संयुक्त स्थान-नाम मानना सबसे स्वाभाविक है।
- source_word: וְיַבְנְאֵל
  choice: यब्नेल
  rationale: स्थान-नाम का स्रोत-संगत देवनागरी लिप्यंतरण।
- source_word: עַד לַקּוּם
  choice: लक्कूम तक
  rationale: עַד सीमा के विस्तार के अंतिम बिंदु को चिह्नित करता है।
- source_word: תֹצְאֹתָיו
  choice: उसका अंतिम छोर
  rationale: शाब्दिक अर्थ ‘उसके निकलने के स्थान’ है; सीमावर्णन में यह सीमा के अंतिम बिंदु या छोर का मुहावरा है।
- source_word: הַיַּרְדֵּן
  choice: यरदन
  rationale: नदी का प्रचलित बाइबलीय नाम; संदर्भ में ‘नदी’ जोड़ना आवश्यक नहीं है।
