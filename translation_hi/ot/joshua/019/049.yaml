  text: וַ/יְכַלּ֥וּ לִ/נְחֹל אֶת הָ/אָ֖רֶץ לִ/גְבֽוּלֹתֶ֑י/הָ וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל נַחֲלָ֛ה לִ/יהוֹשֻׁ֥עַ בִּן נ֖וּן בְּ/תוֹכָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/049.yaml
  text: When they finished apportioning the land by its territories[b][a], the sons of Israel gave an inheritance to Joshua son of Nun among them.
translation:
  language: hi
  text: जब वे देश को उसकी सीमाओं[a] के अनुसार विरासत के लिए बाँटने का काम पूरा कर चुके थे, तब इस्राएलियों[b] ने अपने बीच नून के पुत्र यहोशू को विरासत का एक भाग दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके क्षेत्रों के अनुसार।” इब्रानी शब्द सीमा-रेखाओं और उनसे निर्धारित भूभागों, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों ने।” यह पूरे इस्राएली समुदाय के लिए प्रयुक्त पदनाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ לִנְחֹל
  choice: जब वे ... विरासत के रूप में बाँट चुके
  rationale: वाव-क्रमिक क्रिया और अनंत रूप मिलकर पहले कार्य की पूर्णता तथा भूमि के विरासती बँटवारे को व्यक्त करते हैं; हिंदी में यह समय-संबंध स्वाभाविक है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: यहोशू के प्रसंग में यह कनान के निर्धारित भूभाग को दर्शाता है; हिंदी बाइबलीय आख्यान में ‘देश’ स्वाभाविक है।
- source_word: לִגְבוּלֹתֶיהָ
  choice: उसकी सीमाओं के अनुसार
  rationale: גְּבוּל सीमा-रेखाओं और उनसे निर्धारित क्षेत्रों, दोनों को सूचित कर सकता है। मुख्य पाठ स्रोत की सीमा-संबंधी अभिव्यक्ति को बनाए रखता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: यह मानक राष्ट्रीय पदनाम का सहज और समावेशी आधुनिक हिंदी रूप है; शाब्दिक संरचना फुटनोट में दी गई है।
- source_word: נַחֲלָה
  choice: विरासत का एक भाग
  rationale: נַחֲלָה विरासत में मिले निर्धारित भूभाग को दर्शाता है। ‘एक भाग’ जोड़ने से भूमि-वितरण का आशय हिंदी में स्पष्ट होता है, जबकि ‘विरासत’ का वाचा-संबंधी भाव बना रहता है।
- source_word: לִיהוֹשֻׁעַ בִּן נוּן
  choice: नून के पुत्र यहोशू को
  rationale: नाम और पितृनाम का मानक, स्वाभाविक हिंदी क्रम।
- source_word: בְּתוֹכָם
  choice: अपने बीच
  rationale: यह दर्शाता है कि यहोशू का भाग इस्राएल के लोगों और उनके बाँटे गए भूभागों के भीतर दिया गया, उनसे अलग नहीं।
theological_decisions:
- issue: נַחֲלָה का भूमि-वितरण संबंधी अर्थ
  choice: विरासत का एक भाग
  alternative: अधिकार का भाग; संपत्ति
  rationale: ‘विरासत’ भूमि के कानूनी और वाचा-संबंधी स्वर को सुरक्षित रखती है, और ‘भाग’ निर्धारित आवंटन को स्पष्ट करता है।
- issue: בְנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह वाक्य में पूरे राष्ट्र का प्रचलित पदनाम है। आधुनिक हिंदी में ‘इस्राएली’ अधिक स्वाभाविक है; मूल की शाब्दिक बनावट फुटनोट में सुरक्षित है।
- issue: לִגְבוּלֹתֶיהָ की अर्थ-व्याप्ति
  choice: उसकी सीमाओं के अनुसार
  alternative: उसके क्षेत्रों के अनुसार
  rationale: इब्रानी शब्द सीमा-रेखाओं तथा उनसे बने प्रादेशिक विभागों दोनों पर बल दे सकता है; मुख्य पाठ एक अर्थ चुनता है और दूसरा फुटनोट में रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण आख्यान-शैली। ‘विरासत के रूप में बाँटना’ और ‘विरासत का एक भाग’ भूमि-वितरण की पुनरुक्ति को जानबूझकर रखते हैं, क्योंकि मूल में נחל और נַחֲלָה का शब्द-संबंध अर्थपूर्ण है।
