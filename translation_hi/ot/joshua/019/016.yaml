lexical_decisions:
- source_word: זֹאת
  choice: यही था
  rationale: स्त्रीलिंग एकवचन संकेतवाचक शब्द पहले बताए गए भू-भाग की ओर संकेत करता है। हिन्दी कथात्मक सारांश में भूतकाल स्वाभाविक है; क्रियारहित इब्रानी वाक्य के कारण वर्तमानकाल भी संभव है।
- source_word: נַחֲלַת
  choice: विरासत का भाग
  rationale: भूमि-वितरण के प्रसंग में यह पैतृक अधिकार से मिले भू-भाग को दर्शाता है। ‘विरासत का भाग’ कानूनी और वाचा-संबंधी भाव रखते हुए सामान्य हिन्दी में स्पष्ट है।
- source_word: בְּנֵי זְבוּלֻן
  choice: जबूलून के वंशजों
  rationale: शाब्दिक अर्थ ‘जबूलून के पुत्र’ है, पर यहाँ अभिव्यक्ति सामूहिक रूप से गोत्र के वंशजों को बताती है; ‘वंशज’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: לְמִשְׁפְּחוֹתָם
  choice: अपने कुलों के अनुसार
  rationale: लामेद यहाँ वितरण अथवा वर्गीकरण दिखाता है और מִשְׁפָּחוֹת गोत्र के भीतर के कुलों को सूचित करता है।
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ये नगर
  rationale: यह निश्चित पदबंध पहले गिनाए गए नगरों का सार प्रस्तुत करता है; ‘नगर’ भूमि-सूचियों के लिए मानक और गरिमापूर्ण हिन्दी है।
- source_word: וְחַצְרֵיהֶן
  choice: और इनके गाँव
  rationale: इस प्रसंग में חָצֵר नगरों से जुड़े आश्रित ग्रामीण निवासों को दर्शाता है; ‘गाँव’ सबसे स्पष्ट और स्वाभाविक हिन्दी समतुल्य है।
