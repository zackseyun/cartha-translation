  text: וְ/כָל הַֽ/חֲצֵרִ֗ים אֲשֶׁ֤ר סְבִיבוֹת֙ הֶֽ/עָרִ֣ים הָ/אֵ֔לֶּה עַד בַּֽעֲלַ֥ת בְּאֵ֖ר רָ֣אמַת נֶ֑גֶב זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי שִׁמְע֖וֹן לְ/מִשְׁפְּחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/008.yaml
  text: along with all the villages that were around these cities[a], as far as Baalath-beer, Ramath-negeb. This was the inheritance of the tribe of the sons of Simeon according to their clans.
translation:
  language: hi
  text: और इन नगरों के चारों ओर के सभी गाँव बालात-बएर, रामत-नेगेव तक[a] थे। यह उनके कुलों के अनुसार शिमोन के वंशजों के गोत्र की विरासत थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभवतः इसका अर्थ है, “बालात-बएर, अर्थात् रामत-नेगेव,” जहाँ दूसरा नाम पहले स्थान की पहचान बताता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל הַחֲצֵרִים
  choice: और ... सभी गाँव
  rationale: संयोजक इस पद को पहले की नगर-सूची से जोड़ता है; חֲצֵרִים यहाँ नगरों के अधीन आसपास की छोटी बस्तियों या गाँवों को सूचित करता है।
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: उन नगरों के चारों ओर के
  rationale: यह स्वाभाविक हिन्दी में उन गाँवों का पूर्वोक्त नगरों से भौगोलिक संबंध स्पष्ट करता है। हिन्दी में पहले उल्लिखित नगरों के लिए 'उन' अधिक सहज है।
- source_word: עַד
  choice: तक
  rationale: सीमा अथवा भौगोलिक विस्तार बताने के लिए हिन्दी में 'तक' सटीक और स्वाभाविक है।
- source_word: בַּעֲלַת בְּאֵר
  choice: बालात-बएर
  rationale: स्थान-नाम का अर्थानुवाद न करके उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: רָאמַת נֶגֶב
  choice: रामत-नेगेव
  rationale: लिप्यंतरण मूल स्थान-नाम को बनाए रखता और इस अनिश्चितता को नहीं सुलझाता कि यह अलग स्थान है या बालात-बएर का दूसरा नाम।
- source_word: נַחֲלַת
  choice: भाग ... जो ... मिला
  rationale: इस भूमि-वितरण प्रसंग में शब्द पैतृक अथवा आवंटित भू-भाग को दर्शाता है। सहज आधुनिक हिन्दी में 'भाग ... मिला' कानूनी और वितरणात्मक आशय स्पष्ट करता है।
- source_word: מַטֵּה בְנֵי שִׁמְעוֹן
  choice: शिमोन के वंशजों के गोत्र
  rationale: מַטֵּה यहाँ सामाजिक इकाई 'गोत्र' है और בְנֵי का वंशावली-संबंध 'वंशजों' से स्वाभाविक रूप में व्यक्त होता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: भूमि-वितरण के संदर्भ में מִשְׁפָּחוֹת गोत्र के भीतर के कुल-समूहों को दर्शाता है; 'कुलों के अनुसार' वितरण की व्यवस्था को सुरक्षित रखता है।
