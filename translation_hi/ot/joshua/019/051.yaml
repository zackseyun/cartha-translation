reference: Joshua 19:51
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵ֣לֶּה הַ/נְּחָלֹ֡ת אֲשֶׁ֣ר נִחֲל֣וּ אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וִ/יהוֹשֻׁ֪עַ בִּן נ֟וּן וְ/רָאשֵׁ֣י הָֽ/אָב֣וֹת לְ/מַטּוֹת֩ בְּנֵי יִשְׂרָאֵ֨ל בְּ/גוֹרָ֤ל בְּ/שִׁלֹה֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יְכַלּ֕וּ מֵֽ/חַלֵּ֖ק אֶת הָ/אָֽרֶץ׀־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/051.yaml
  text: These are the inheritances that Eleazar the priest[a], Joshua son of Nun, and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned by lot at Shiloh before Yahweh, at the entrance of the tent of meeting. So they finished dividing the land.
translation:
  language: hi
  text: ये वे विरासतें हैं जिन्हें एलीआज़र याजक, नून के पुत्र यहोशू और इस्राएल के पुत्रों के गोत्रों के पितृकुलों के मुखियाओं ने शीलो में, याहवे के सामने, मिलापवाले तंबू के द्वार पर चिट्ठियाँ डालकर बाँटा। इस प्रकार उन्होंने भूमि का बँटवारा पूरा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּחָלֹת
  choice: विरासतें
  rationale: यह शब्द भूमि के उन हिस्सों को दर्शाता है जो गोत्रों को स्थायी पैतृक अधिकार के रूप में मिले; ‘विरासतें’ उसके कानूनी और वाचा-संबंधी भाव को बनाए रखता है।
- source_word: נִחֲלוּ
  choice: बाँटा
  rationale: संदर्भ में अगुओं द्वारा गोत्रीय विरासतों के आवंटन की क्रिया है; ‘बाँटा’ आधुनिक हिन्दी में स्वाभाविक है और भूमि-विभाजन का अर्थ स्पष्ट करता है।
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह अभिव्यक्ति वंश या पैतृक घरानों के प्रतिनिधि अगुओं को सूचित करती है; ‘पितृकुल’ संक्षिप्त और स्रोत की सामाजिक संरचना के निकट है।
- source_word: לְמַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के गोत्रों के
  rationale: ‘गोत्र’ מַטּוֹת का सटीक संदर्भगत अर्थ है और ‘इस्राएल के पुत्र’ स्रोत की लिंगयुक्त वंशगत अभिव्यक्ति को सुरक्षित रखता है।
- source_word: בְּגוֹרָל
  choice: चिट्ठी डालकर
  rationale: हिन्दी बाइबलीय प्रयोग में यह निर्णय अथवा आवंटन के लिए चिट्ठियाँ डालने की प्रथा को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहवे के सामने
  rationale: ईश्वरीय नाम को सामान्य उपाधि में बदलने के बजाय स्रोत के व्यक्तिगत वाचा-नाम के रूप में प्रस्तुत किया गया है।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के द्वार पर
  rationale: यह हिन्दी में स्थापित और समझने योग्य पदबंध है; ‘द्वार’ तंबू के प्रवेश-स्थान को दर्शाता है।
- source_word: וַיְכַלּוּ מֵחַלֵּק אֶת הָאָרֶץ
  choice: इस प्रकार उन्होंने देश का बँटवारा पूरा किया
  rationale: वाक्य कथा के समापन-परिणाम को बताता है; यह रूप उस परिणामगत प्रवाह और विभाजन की पूर्णता दोनों को सहज हिन्दी में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है। ‘यहवे’ उसे उपाधि से प्रतिस्थापित किए बिना नाम के रूप में सुरक्षित रखता है।
- issue: בְּנֵי יִשְׂרָאֵל की लिंगयुक्त वंशगत अभिव्यक्ति
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल की संतान
  rationale: स्रोत की औपचारिक पुरुष-वाचक वंशगत भाषा को बनाए रखा गया है; यहाँ यह गोत्रीय पूर्वज से उत्पन्न समुदाय का पारंपरिक नाम है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। प्रशासनिक भूमि-विभाजन की भाषा और मूल की वंशगत संरचना सुरक्षित रखी गई है; अनावश्यक अंग्रेज़ी-सदृश वाक्य-विन्यास से बचा गया है।
