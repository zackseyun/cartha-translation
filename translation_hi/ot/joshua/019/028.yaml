- source_word: עַד
  choice: तक
  rationale: यह शब्द सीमा अथवा क्षेत्र के विस्तार का अंतिम बिंदु बताता है; हिन्दी में ‘तक’ इसका संक्षिप्त और स्वाभाविक रूप है।
- source_word: צִידוֹן רַבָּה
  choice: बड़े सीदोन
  rationale: विशेषण को नगर-नाम के साथ स्वाभाविक हिन्दी रूप में रखा गया है और सीदोन की प्रमुखता का भाव सुरक्षित है।
