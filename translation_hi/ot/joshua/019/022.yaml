  text: और सीमा ताबोर[a], शहाज़ूमाह और बेत-शेमेश से मिली, और उनकी सीमा का अंतिम छोर यरदन था[b]—सोलह नगर और उनके गाँव।
  philosophy: optimal-equivalence
