  text: לְ/מַטֵּ֥ה בְנֵי דָ֖ן לְ/מִשְׁפְּחֹתָ֑/ם יָצָ֖א הַ/גּוֹרָ֥ל הַ/שְּׁבִיעִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/040.yaml
  text: For the tribe of the sons of Dan, according to their clans, the seventh lot came out.
translation:
  language: hi
  text: दान के वंशजों के गोत्र के लिए, उनके कुलों के अनुसार, सातवीं चिट्ठी निकली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: गोत्र के लिए
  rationale: यहोशू के भूमि-विभाजन प्रसंग में מַטֶּה का अर्थ शाब्दिक ‘लाठी’ नहीं, बल्कि ‘गोत्र’ है; לְ को आवंटन सूचित करने के लिए ‘के लिए’ कहा गया है।
- source_word: בְנֵי דָן
  choice: दान के वंशजों
  rationale: यह आधुनिक हिन्दी में स्वाभाविक रहते हुए इब्रानी के वंश-संबंधी भाव को सुरक्षित रखता है; ‘दान के पुत्रों’ से केवल प्रत्यक्ष पुत्रों का भ्रम हो सकता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחוֹת यहाँ गोत्र के भीतर के कुल-समूहों को बताता है; ‘कुल’ इस सामाजिक संरचना के लिए संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: יָצָא
  choice: निकली
  rationale: चिट्ठी डालने के प्रसंग में יָצָא का मूल भाव ‘बाहर आना/निकलना’ है; ‘निकली’ हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: הַגּוֹרָל
  choice: चिट्ठी
  rationale: भूमि के आवंटन का निर्णय करने वाली पर्ची/लॉट के लिए ‘चिट्ठी’ प्रचलित बाइबलीय हिन्दी है और यहाँ साधन तथा उससे निर्धारित क्रम, दोनों का संकेत देती है।
- source_word: הַשְּׁבִיעִי
  choice: सातवीं
  rationale: यह चिट्ठी निकलने के क्रम को बताने वाला सीधा क्रमवाचक विशेषण है।
