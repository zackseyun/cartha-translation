translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सूची-वर्णन के अनुकूल वाक्य। इब्रानी स्थान-नामों को अनूदित करने के बजाय देवनागरी में लिप्यंतरित किया गया है। अंग्रेज़ी परामर्श-पाठ की ‘Achshaph’ वाली टिप्पणी अंग्रेज़ी वर्तनी-परंपरा से संबंधित है और हिन्दी पाठ के लिए उपयोगी पाठांतर नहीं है, इसलिए पादटिप्पणी नहीं रखी गई।
