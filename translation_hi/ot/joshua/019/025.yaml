  text: और उनकी सीमा हेल्कत, हाली, बेतेन और अकशाफ थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: और ... थे
  rationale: वय्यिक्तोल रूप सीमा-वर्णन की कथा को आगे बढ़ाता है। हिन्दी में स्थानों की सूची के साथ बहुवचन ‘थे’ स्वाभाविक है।
- source_word: גְּבוּלָם
  choice: उनकी सीमा में
  rationale: גְּבוּל सीमा या सीमाक्षेत्र को दर्शाता है। सूचीबद्ध नगरों के संदर्भ में ‘उनकी सीमा में’ सहज हिन्दी है और इसे पूरे ‘प्रदेश’ के रूप में अनावश्यक रूप से विस्तृत नहीं करता।
- source_word: חֶלְקַת
  choice: हेल्कत
  rationale: स्थान-नाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַחֲלִי
  choice: हाली
  rationale: स्थान-नाम חֲלִי का सरल, पठनीय देवनागरी लिप्यंतरण।
- source_word: וָבֶטֶן
  choice: बेतेन
  rationale: स्थान-नाम का इब्रानी स्वरूप के निकट देवनागरी लिप्यंतरण।
- source_word: וְאַכְשָׁף
  choice: अकशाफ
  rationale: स्थान-नाम אַכְשָׁף में כְ को ‘क’ और שׁ को ‘श’ द्वारा दर्शाते हुए आधुनिक हिन्दी में पठनीय लिप्यंतरण किया गया है।
