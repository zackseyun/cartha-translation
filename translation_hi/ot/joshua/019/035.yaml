  text: 'और किलेबंद नगर ये थे: सिद्दीम[a], सेर, हम्मत, रक्कत और किन्नरेत।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘गढ़-नगर।’
    reason: इब्रानी עָרֵי מִבְצָר का एक अधिक संक्षिप्त वैकल्पिक अनुवाद; दोनों रूप नगरों की किलेबंदी का भाव रखते हैं।
lexical_decisions:
- source_word: וְ/עָרֵי מִבְצָר
  choice: और गढ़वाले नगर
  rationale: וְ सूची को आगे बढ़ाता है, इसलिए ‘और’ स्वाभाविक है। עָרֵי מִבְצָר का अर्थ ऐसे नगर हैं जिन्हें सुरक्षा के लिए दृढ़ किया गया था; ‘गढ़वाले नगर’ इस सैनिक और संरचनात्मक भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַ/צִּדִּים
  choice: सिद्दीम
  rationale: स्थान-नाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है। नाम से पहले का इब्रानी निश्चित उपपद हिन्दी की नगर-सूची में अलग से व्यक्त करना स्वाभाविक नहीं है।
- source_word: צֵר
  choice: सेर
  rationale: स्थान-नाम का इब्रानी ध्वनि-रूप के निकट सरल देवनागरी लिप्यंतरण।
- source_word: וְ/חַמַּת
  choice: हम्मत
  rationale: स्थान-नाम में मध्य व्यंजन के द्वित्व को ‘म्म’ द्वारा बनाए रखा गया है और इसे अन्य ‘हमात’ नाम से अलग रखा गया है।
- source_word: רַקַּת
  choice: रक्कत
  rationale: स्थान-नाम का लिप्यंतरण, जिसमें मध्य व्यंजन के द्वित्व को ‘क्क’ से दर्शाया गया है।
- source_word: וְ/כִנָּרֶת
  choice: और किन्नरेत
  rationale: स्थान-नाम का परिचित और स्रोत के निकट देवनागरी रूप; सूची के अंतिम पद से पहले וְ को ‘और’ से व्यक्त किया गया है।
