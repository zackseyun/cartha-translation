  yaml_path: translation/ot/joshua/019/014.yaml
  text: Then the border turned around it on the north to Hannathon[b][a], and its end was at the Valley of Iphtah-el.
translation:
  language: hi
  text: तब सीमा उसके चारों ओर मुड़कर उत्तर की ओर हन्नातोन तक गई[a], और उसके अंतिम छोर[b] यिफ्तह-एल की घाटी पर थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हन्नातोन के उत्तर में।” इब्रानी वाक्यांश को हन्नातोन के उत्तर में स्थिति बताने वाला अथवा उत्तर दिशा में हन्नातोन की ओर गति बताने वाला समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसके निकलने के स्थान”; सीमा-वर्णन में इसका अर्थ उसके अंतिम छोर या अंतिम बिंदु हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: तब ... चारों ओर मुड़कर ... गई
  rationale: सीमा-वर्णनों में נָסַב सीमा के मुड़ने या किसी स्थान के चारों ओर घूमने को दर्शाता है। यह अभिव्यक्ति उस भौगोलिक गति को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: אֹתוֹ
  choice: उसके चारों ओर
  rationale: पुल्लिंग एकवचन सर्वनाम पिछले संदर्भ के किसी स्थान या सीमा-बिंदु की ओर संकेत करता है; हिन्दी में प्रसंगानुकूल सर्वनाम रखा गया है, उसे किसी व्यक्ति के रूप में नहीं समझाया गया।
- source_word: הַגְּבוּל
  choice: सीमा
  rationale: भूमि के बँटवारे के संदर्भ में גְּבוּל प्रादेशिक सीमा-रेखा को दर्शाता है; ‘सीमा’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: מִצְּפוֹן חַנָּתֹן
  choice: हन्नातोन के उत्तर से
  rationale: मुख्य पाठ में מן के स्थानसूचक अर्थ को रखा गया है—सीमा हन्नातोन के उत्तरी भाग से होकर जाती है। दिशासूचक समझ भी संभव है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: וְהָיוּ תֹּצְאֹתָיו
  choice: और उसके अंतिम छोर ... थे
  rationale: תֹּצְאוֹתָיו व्याकरणतः बहुवचन है और सीमा-वर्णन में अंतिम बिंदुओं या छोरों के लिए प्रयुक्त होता है। हिन्दी में बहुवचन बनाए रखा गया है।
- source_word: גֵּי
  choice: घाटी
  rationale: גֵּי घाटी अथवा सँकरी घाटी को सूचित करता है; स्थान-नाम के साथ ‘घाटी’ सहज और पर्याप्त है।
- source_word: יִפְתַּח אֵל
  choice: यिफ्तह-एल
  rationale: यह स्थान-नाम है, इसलिए इसका अनुवाद करने के बजाय इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
