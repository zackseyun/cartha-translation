  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सीमा-वर्णन की भौगोलिक प्रकृति को स्पष्ट किया गया है, पर מִצְּפוֹן की वास्तविक स्थानसूचक-दिशासूचक अस्पष्टता पादटिप्पणी में सुरक्षित है। תֹּצְאוֹתָיו का इब्रानी बहुवचन मुख्य पाठ में जानबूझकर बनाए रखा गया है।
