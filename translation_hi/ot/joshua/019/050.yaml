base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/050.yaml
  text: At the command of Yahweh they gave him the city that he asked for[a], Timnath-serah in the hill country of Ephraim. He built the city and lived in it.
translation:
  language: hi
  text: याहवे के आदेश पर उन्होंने उसे वह नगर दिया जो उसने माँगा था—अर्थात् एप्रैम के पहाड़ी प्रदेश में तिम्नत-सेरह। उसने उस नगर का निर्माण किया[a] और उसमें रहने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उस नगर का पुनर्निर्माण किया।” इब्रानी क्रिया का सामान्य अर्थ “निर्माण करना” है; नगर के पहले से उल्लिखित होने के कारण संदर्भ में “पुनर्निर्माण” का अर्थ भी संभव माना जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: याहवे के आदेश के अनुसार
  rationale: עַל־פִּי एक मुहावरा है जिसका यहाँ अर्थ अधिकारपूर्ण आदेश या निर्देश है; यह हिन्दी में स्वाभाविक रहते हुए मूल अर्थ को सुरक्षित रखता है।
- source_word: נָתְנוּ לוֹ
  choice: उन्होंने उसे ... दिया
  rationale: बहुवचन क्रिया और अप्रत्यक्ष कर्म को सरल, स्वाभाविक हिन्दी में ज्यों का त्यों रखा गया है।
- source_word: הָעִיר אֲשֶׁר שָׁאָל
  choice: वह नगर ... जिसे उसने माँगा था
  rationale: שׁאל का अर्थ यहाँ किसी वस्तु या स्थान को माँगना है; पूर्ण भूतकाल प्रसंग में पहले किए गए अनुरोध को स्पष्ट करता है।
- source_word: תִּמְנַת סֶרַח
  choice: तिम्नत-सेरह
  rationale: स्थान-नाम का अनुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: בְּהַר אֶפְרָיִם
  choice: एप्रैम के पहाड़ी प्रदेश में
  rationale: הַר यहाँ किसी एक पर्वत के बजाय पहाड़ी भूभाग का द्योतक है।
- source_word: וַיִּבְנֶה אֶת הָעִיר
  choice: उसने उस नगर का निर्माण किया
  rationale: בנה का मूल और सीधा अर्थ ‘निर्माण करना’ है। नगर पहले से विद्यमान होने के कारण ‘पुनर्निर्माण’ संभव है, पर वह अर्थ मूल क्रिया में स्पष्ट नहीं है; इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: וַיֵּשֶׁב בָּהּ
  choice: और उसमें रहने लगा
  rationale: ישׁב यहाँ नगर में निवास आरम्भ करने का अर्थ देता है; ‘रहने लगा’ कथानक के क्रम को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से है; उसे किसी उपाधि से बदलने के बजाय प्रचलित विद्वत्तापूर्ण लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- issue: בנה को निर्माण या पुनर्निर्माण समझना
  choice: निर्माण किया
  alternative: पुनर्निर्माण किया / फिर से बसने योग्य बनाया
  rationale: क्रिया स्वयं सामान्यतः ‘बनाना/निर्माण करना’ कहती है। नगर के पहले से अस्तित्व में होने के कारण पुनर्निर्माण संदर्भगत संभावना है, पर मुख्य पाठ में उसे निश्चित करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘पहाड़ी प्रदेश’ भौगोलिक अर्थ स्पष्ट करता है। मुख्य पाठ में मूल की अस्पष्टता को अनावश्यक रूप से हल नहीं किया गया है।
