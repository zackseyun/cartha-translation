base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/032.yaml
  text: For the sons of Naphtali[a], the sixth lot came out, for the sons of Naphtali according to their clans.
translation:
  language: hi
  text: नप्ताली के वंशजों के लिए छठी चिट्ठी निकली—नप्ताली के वंशजों के लिए, उनके कुलों के अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי נַפְתָּלִי
  choice: नप्ताली के वंशजों के लिए
  rationale: शाब्दिक ‘नप्ताली के पुत्रों’ के बजाय यहाँ पूरे गोत्र के लोगों का बोध है; ‘वंशजों’ आधुनिक हिन्दी में स्वाभाविक और संदर्भानुकूल है। לְ प्राप्तकर्ता को सूचित करता है, इसलिए ‘के लिए’ रखा गया है।
- source_word: יָצָא
  choice: निकली
  rationale: मूल क्रिया का अर्थ ‘बाहर निकली’ है और चिट्ठी डालने के परिणाम के लिए हिन्दी में ‘चिट्ठी निकली’ स्वाभाविक तथा मूल के निकट है।
- source_word: הַגּוֹרָל
  choice: चिट्ठी
  rationale: भूमि-विभाजन के लिए डाली गई lot को आधुनिक हिन्दी में ‘चिट्ठी’ स्पष्ट और प्रचलित ढंग से व्यक्त करती है।
- source_word: הַשִּׁשִּׁי
  choice: छठी
  rationale: यह स्त्रीलिंग संज्ञा ‘चिट्ठी’ के अनुरूप क्रमवाचक विशेषण है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחוֹת यहाँ गोत्र के भीतर के वंश-समूह हैं; ‘कुल’ आधुनिक हिन्दी में ‘परिवार’ से अधिक व्यापक और सटीक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल पद में ‘नप्ताली के वंशजों के लिए’ की पुनरावृत्ति को जानबूझकर बनाए रखा गया है; डैश वाक्य के दूसरे, स्पष्टीकरणात्मक खंड को स्पष्ट करता है।
