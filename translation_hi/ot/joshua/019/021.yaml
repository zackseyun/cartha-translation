  text: रेमेत[a], एन-गन्नीम, एन-हद्दा और बेत-पस्सेस।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू स्थान-नामों में ‘एन-गन्नीम’ का संभावित अर्थ ‘बगीचों का सोता’ है; ‘एन-हद्दा’ का पहला भाग ‘सोता’ और ‘बेत-पस्सेस’ का पहला भाग ‘घर’ है। मुख्य पाठ में इन्हें लिप्यंतरित किया गया है, क्योंकि यहाँ ये नगरों के नाम हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶמֶת
  choice: रेमेत
  rationale: नगर-सूची में प्रयुक्त स्थान-नाम है; अर्थानुवाद के बजाय हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: עֵין גַּנִּים
  choice: एन-गन्नीम
  rationale: यह עֵין (‘सोता’) और גַּנִּים (‘बगीचे’) से बना स्थान-नाम है। मुख्य पाठ में नगर के नाम के रूप में लिप्यंतरित किया गया है।
- source_word: עֵין חַדָּה
  choice: एन-हद्दा
  rationale: यह עֵין से आरंभ होने वाला संयुक्त स्थान-नाम है। दूसरे घटक का अर्थ संदिग्ध होने और पूरे पद के नगर-नाम होने के कारण लिप्यंतरण उपयुक्त है।
- source_word: בֵית פַּצֵּץ
  choice: बेत-पस्सेस
  rationale: בֵית (‘घर’) से आरंभ होने वाला संयुक्त स्थान-नाम है; भौगोलिक सूची में इसे अर्थानुवाद करने के बजाय लिप्यंतरित किया गया है।
- source_word: וְ
  choice: और
  rationale: बार-बार आया संयोजक स्थान-नामों को जोड़ता है; स्वाभाविक हिन्दी सूची-शैली में अल्पविरामों और अंतिम ‘और’ से इसे व्यक्त किया गया है।
