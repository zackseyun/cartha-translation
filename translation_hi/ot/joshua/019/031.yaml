  yaml_path: translation/ot/joshua/019/031.yaml
  text: This was the inheritance of the tribe of the sons of Asher according to their clans—these cities and their settlements[a][b].
translation:
  language: hi
  text: यह आशेर के वंशजों के गोत्र का, उनके कुलों के अनुसार, विरासत में मिला भाग था[a]—ये नगर और उनकी बस्तियाँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह ... का विरासत में मिला भाग है।” इब्रानी नामवाचक वाक्य को वर्तमान काल में भी अनूदित किया जा सकता है, लेकिन प्रसंग के कथात्मक सारांश में भूतकाल अधिक स्वाभाविक है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनके गाँव।” इब्रानी शब्द उन छोटे ग्रामीण बसेरों को दर्शा सकता है जो सूचीबद्ध नगरों से संबद्ध थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: यह ... था
  rationale: यह स्त्रीलिंग संकेतवाचक शब्द पहले बताए गए भू-भाग की ओर लौटकर संकेत करता है। कथात्मक सारांश में भूतकाल स्वाभाविक है, यद्यपि इब्रानी नामवाचक वाक्य को वर्तमान काल में भी समझा जा सकता है।
- source_word: נַחֲלַת
  choice: भाग
  rationale: भूमि-वितरण के संदर्भ में यह विरासत में मिले प्रादेशिक हिस्से को दर्शाता है। सहज आधुनिक हिन्दी में ‘भाग’ स्पष्ट है और ‘मिला था’ उसके प्राप्त उत्तराधिकार का भाव प्रकट करता है।
- source_word: מַטֵּה בְנֵי אָשֵׁר
  choice: आशेर के वंशजों का गोत्र
  rationale: מַטֵּה यहाँ जनजातीय इकाई है और בְנֵי אָשֵׁר आशेर से निकले लोगों को दर्शाता है। यह हिन्दी में ‘आशेर के पुत्रों का गोत्र’ की अपेक्षा अधिक स्वाभाविक है, जबकि वंशगत संबंध बनाए रखता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: भूमि-वितरण की सूत्रात्मक भाषा में מִשְׁפָּחָה गोत्र के भीतर के कुलों को और לְ वितरणात्मक संबंध को व्यक्त करता है।
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ये नगर
  rationale: यह पहले गिनाए गए बसे हुए स्थानों को स्पष्ट रूप से संदर्भित करता है; ‘नगर’ मानक बाइबलीय हिन्दी में उपयुक्त है।
- source_word: וְחַצְרֵיהֶן
  choice: और उनके अधीन बस्तियाँ
  rationale: חָצֵר यहाँ सूचीबद्ध नगरों से संबद्ध छोटे, प्रायः ग्रामीण या बिना परकोटे के आश्रित बसेरे दर्शाता है। ‘अधीन बस्तियाँ’ संबंध को स्पष्ट करती है, बिना हर स्थान को आधुनिक अर्थ में गाँव मान लेने के।
