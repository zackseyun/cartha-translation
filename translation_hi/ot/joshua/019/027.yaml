base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/027.yaml
  text: Then it turned eastward[a], toward the sunrise, to Beth-dagon, and reached to Zebulun and to the Valley of Iphtah-el northward, to Beth-emek and Neiel; then it went out to Cabul on the left.
translation:
  language: hi
  text: फिर सीमा सूर्योदय की ओर मुड़कर बेत-दागोन पहुँची और जबूलून तथा यिफ्तह-एल की घाटी से मिली; फिर वह उत्तर की ओर बेत-एमेक और नेईएल तक गई, और बाईं ओर[a] काबूल तक निकली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक अर्थ ‘बाईं ओर से’ है। प्राचीन दिशाभिमुखता में पूर्व की ओर मुख करके देखने पर बाईं ओर उत्तर होता है; इसलिए यहाँ आशय ‘उत्तर की ओर’ या ‘उत्तर की तरफ़’ भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁב
  choice: फिर सीमा ... मुड़कर
  rationale: सीमा-वर्णन में क्रिया का अर्थ लौटना नहीं, दिशा बदलना है; स्पष्टता के लिए निहित कर्ता ‘सीमा’ व्यक्त किया गया है।
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: सूर्योदय की ओर
  rationale: हिब्रू के शाब्दिक बिंब ‘सूर्य का उदय’ को स्वाभाविक हिन्दी में सुरक्षित रखता है और पूर्व दिशा बताता है।
- source_word: בֵּית דָּגֹן
  choice: बेत-दागोन
  rationale: स्थान-नाम का अनुवाद करने के बजाय हिब्रू के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וּפָגַע
  choice: से मिली
  rationale: सीमा-वर्णन में यह क्रिया किसी भूभाग या सीमा के संपर्क में आने का बोध देती है।
- source_word: בִּזְבֻלוּן
  choice: जबूलून
  rationale: यहाँ जबूलून के क्षेत्र से सीमा के मिलने का भाव है; नाम को प्रचलित हिन्दी बाइबलीय रूप में रखा गया है।
- source_word: וּבְגֵי יִפְתַּח אֵל
  choice: तथा यिफ्तह-एल की घाटी से
  rationale: גֵי का अर्थ ‘घाटी’ है और यिफ्तह-एल स्थान-नाम का लिप्यंतरण है; समानांतर संपर्क को ‘से’ द्वारा व्यक्त किया गया है।
- source_word: צָפוֹנָה
  choice: उत्तर की ओर
  rationale: दिशासूचक क्रियाविशेषण को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: בֵּית הָעֵמֶק
  choice: बेत-एमेक
  rationale: स्थान-नाम को अर्थानुवाद किए बिना लिप्यंतरित किया गया है।
- source_word: וּנְעִיאֵל
  choice: और नयीएल
  rationale: हिब्रू स्थान-नाम का देवनागरी लिप्यंतरण।
- source_word: וְיָצָא אֶל כָּבוּל
  choice: फिर ... काबूल तक निकली
  rationale: सीमा-सूत्र में יצא रेखा के आगे निकलने या फैलने को बताता है; ‘तक निकली’ लक्ष्य-बिंदु सहित स्वाभाविक हिन्दी है।
- source_word: מִשְּׂמֹאל
  choice: बाईं ओर[a]
  rationale: मूल पाठ का ठोस और संभावित रूप से संदिग्ध दिशात्मक पद सुरक्षित रखा गया है; उत्तर दिशा की सम्भावना पादटिप्पणी में बताई गई है।
