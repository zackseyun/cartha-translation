lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: उनके ... थे
  rationale: यह इब्रानी मुहावरा यहाँ उनके लिए निर्धारित या उनके अधिकार में होने का भाव देता है; हिन्दी में नगरों को विषय बनाकर बहुवचन ‘थे’ स्वाभाविक है।
- source_word: בְּנַחֲלָתָם
  choice: उनके भाग में
  rationale: נחלה गोत्र को मिले पैतृक भूमि-भाग या आवंटित हिस्से को दर्शाता है। ‘भाग’ इस सूची के संदर्भ में संक्षिप्त और सहज है।
- source_word: בְּאֵר שֶׁבַע
  choice: बेर्शेबा
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण; संयुक्त प्रचलित रूप उसके एक नाम होने को स्पष्ट करता है।
- source_word: וְשֶׁבַע
  choice: शेबा
  rationale: मसोरेटिक व्यंजन-पाठ इसे सूची में ‘और शेबा’ के रूप में प्रस्तुत करता है; बेर्शेबा के तुरंत बाद इसकी उपस्थिति की पाठगत कठिनाई टिप्पणी में सुरक्षित रखी गई है।
- source_word: וּמוֹלָדָה
  choice: और मोलादा
  rationale: स्थान-नाम का लिप्यंतरण किया गया है और सूची के अंतिम पद का संयोजक बनाए रखा गया है।
