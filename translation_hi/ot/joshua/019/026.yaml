translation:
  language: hi
  text: और अल्लम्मेलेक, अमाद और मिशाल; और सीमा पश्चिम की ओर कर्मेल तक और शीहोर-लिब्नात तक पहुँची।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלַּמֶּלֶךְ
  choice: अल्लम्मेलेक
  rationale: यह स्थान का नाम है; इब्रानी रूप के व्यंजनों को यथासंभव सुरक्षित रखते हुए देवनागरी में लिप्यंतरित किया गया है।
- source_word: עַמְעָד
  choice: अमाद
  rationale: यह स्थान का नाम है; सामान्य और सहज हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: מִשְׁאָל
  choice: मिशाल
  rationale: यह स्थान का नाम है; שׁ को ‘श’ से दर्शाते हुए पठनीय देवनागरी रूप दिया गया है।
- source_word: וּפָגַע
  choice: फिर सीमा ... तक पहुँची
  rationale: सीमा-वर्णन में פגע का अर्थ किसी स्थल तक पहुँचना या उससे मिलना है। हिन्दी में स्पष्टता के लिए निहित कर्ता ‘सीमा’ व्यक्त किया गया है।
- source_word: בְּכַרְמֶל
  choice: कर्मेल तक
  rationale: פגע के साथ בְ यहाँ उस स्थल को बताता है जहाँ सीमा पहुँचती है; ‘तक’ हिन्दी सीमा-वर्णन में स्वाभाविक है।
- source_word: הַיָּמָּה
  choice: पश्चिम की ओर
  rationale: शाब्दिक अर्थ ‘समुद्र की ओर’ है, पर इस भौगोलिक प्रयोग में भूमध्य सागर की दिशा अर्थात पश्चिम अभिप्रेत है। शाब्दिक रूप को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: וּבְשִׁיחוֹר לִבְנָת
  choice: और शीहोर-लिब्नात तक
  rationale: इसे संयुक्त स्थान-नाम मानकर हाइफ़न सहित लिप्यंतरित किया गया है; ‘तक’ पूर्ववर्ती सीमा-वर्णन को आगे बढ़ाता है।
