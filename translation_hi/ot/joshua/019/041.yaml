  yaml_path: translation/ot/joshua/019/041.yaml
  text: And the border of their inheritance was Zorah[a], Eshtaol, and Ir-shemesh.
translation:
  language: hi
  text: 'और उनकी विरासत की सीमा ये थी: सोराह, एश्ताओल और ईर-शेमेश[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ईर-शेमेश का अर्थ है “सूर्य का नगर।”
    reason: स्थाननाम के पारदर्शी शाब्दिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיְהִי
  choice: और ... थे
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है। हिंदी में सूची के साथ स्वाभाविक अस्तित्वसूचक वाक्य बनाया गया है; बहुवचन ‘थे’ आगे आए नगरों के अनुरूप है।
- source_word: גְּבוּל
  choice: सीमा
  rationale: भूमि-विभाजन के प्रसंग में यह शब्द विरासत में मिले भूभाग की सीमा अथवा सीमाक्षेत्र को सूचित करता है। यहाँ नगरों की सूची सीमा से संबद्ध है, इसलिए ‘सीमा’ उपयुक्त है।
- source_word: נַחֲלָתָם
  choice: उनकी विरासत
  rationale: यह दान गोत्र को मिली पैतृक/वाचा-संबंधी भूमि के हिस्से को दर्शाता है; ‘विरासत’ इस अर्थ को बनाए रखता है।
- source_word: צָרְעָה
  choice: सोरा
  rationale: इब्रानी स्थाननाम का सरल और प्रचलित हिंदी लिप्यंतरण।
- source_word: אֶשְׁתָּאוֹל
  choice: एश्ताओल
  rationale: इब्रानी स्थाननाम का देवनागरी लिप्यंतरण।
- source_word: עִיר שָׁמֶשׁ
  choice: ईर-शेमेश
  rationale: स्थाननाम को अनुवाद करने के बजाय लिप्यंतरित किया गया है; उसके पारदर्शी शाब्दिक अर्थ को पादटिप्पणी में रखा गया है।
