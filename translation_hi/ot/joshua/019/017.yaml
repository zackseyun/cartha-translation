  yaml_path: translation/ot/joshua/019/017.yaml
  text: For Issachar[a], the fourth lot came out[b], for the sons of Issachar according to their clans.
translation:
  language: hi
  text: इस्साकार के लिए चौथी चिट्ठी निकली—इस्साकार के वंशजों के लिए, उनके कुलों के अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: इस्साकार के लिए
  rationale: उपसर्ग ל इस्साकार गोत्र को चिट्ठी द्वारा मिलने वाले भाग के प्राप्तकर्ता के रूप में दिखाता है।
- source_word: יָצָא הַגּוֹרָל הָרְבִיעִי
  choice: चौथी चिट्ठी निकली
  rationale: यह चिट्ठी डालने की प्रक्रिया और क्रम को स्वाभाविक हिन्दी में व्यक्त करता है तथा יָצָא के ‘निकलने’ वाले बिंब को बनाए रखता है।
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: इस्साकार के वंशजों के लिए
  rationale: शाब्दिक ‘इस्साकार के पुत्रों’ का आशय यहाँ इस्साकार से उत्पन्न गोत्रीय समुदाय है; ‘वंशज’ आधुनिक हिन्दी में इसी वंश-संबंध को स्पष्ट करता है।
- source_word: לְמִשְׁפְּחוֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחוֹת गोत्र के भीतर के वंशाधारित सामाजिक समूहों को दर्शाता है; ‘कुल’ इस संदर्भ में स्वाभाविक और सटीक है।
