source:
  edition: WLC
  text: מֵ/חֶ֨בֶל֙ בְּנֵ֣י יְהוּדָ֔ה נַחֲלַ֖ת בְּנֵ֣י שִׁמְע֑וֹן כִּֽי הָיָ֞ה חֵ֤לֶק בְּנֵֽי יְהוּדָה֙ רַ֣ב מֵ/הֶ֔ם וַ/יִּנְחֲל֥וּ בְנֵֽי שִׁמְע֖וֹן בְּ/ת֥וֹךְ נַחֲלָתָֽ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/009.yaml
  text: From the portion of the sons of Judah came the inheritance of the sons of Simeon[a], because the share of the sons of Judah was too large for them[c][b]; so the sons of Simeon received their inheritance within Judah's inheritance.
translation:
  language: hi
  text: यहूदा के वंशजों के भूभाग में से शिमोन के वंशजों को पैतृक भाग मिला,[a] क्योंकि यहूदा के वंशजों का हिस्सा उनके लिए बहुत बड़ा था। इसलिए शिमोन के वंशजों ने यहूदा के पैतृक भाग के भीतर अपना पैतृक भाग पाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के वंशजों के हिस्से में से।” इब्रानी חֶबֶל नपे हुए भूमि-भाग या भू-क्षेत्र का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵ/חֶבֶל
  choice: भूभाग में से
  rationale: भूमि-विभाजन के संदर्भ में חֶבֶל नापे या निर्धारित किए गए भूभाग को दर्शाता है; ‘भूभाग’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: נַחֲלַת / נַחֲלָתָם
  choice: पैतृक भाग
  rationale: नחלה यहाँ विरासत में प्राप्त भूमि-अंश है। ‘पैतृक भाग’ भूमि और वंशगत अधिकार दोनों का भाव रखता है, जबकि केवल ‘विरासत’ अधिक व्यापक हो सकती है।
- source_word: בְּנֵי יְהוּדָה / בְּנֵי שִׁמְעוֹן
  choice: यहूदा के वंशज / शिमोन के वंशज
  rationale: בני का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ वह पूरे जनजातीय समुदाय का वंश-सूचक पद है; ‘वंशज’ अर्थ को स्वाभाविक हिन्दी में ठीक व्यक्त करता है।
- source_word: חֵלֶק
  choice: हिस्सा
  rationale: यह शब्द यहूदा को बाँटकर दिए गए भाग को दर्शाता है; ‘हिस्सा’ חֶבֶל और נַחֲלָה से उपयुक्त शब्दगत भिन्नता भी बनाए रखता है।
- source_word: רַב מֵ/הֶם
  choice: उनकी आवश्यकता से अधिक बड़ा था
  rationale: तुलनात्मक अभिव्यक्ति का आशय है कि यहूदा का हिस्सा उनके लिए जरूरत से अधिक था; यह हिन्दी रूप उस संदर्भगत अर्थ को स्पष्ट और सहज बनाता है।
- source_word: וַ/יִּנְחֲלוּ
  choice: अपना पैतृक भाग पाया
  rationale: נחל भूमि-वितरण में विरासत का भाग प्राप्त करने को दर्शाता है; ‘पाया’ यहाँ प्रशासनिक आवंटन और अधिकार-प्राप्ति दोनों के लिए सहज है।
- source_word: בְּ/תוֹךְ
  choice: के भीतर
  rationale: यह स्थानगत रूप से शिमोन के भाग का यहूदा के भूभाग के अंदर होना स्पष्ट करता है।
