  text: And their border was Jezreel[a], Chesulloth[b], and Shunem.
translation:
  language: hi
  text: 'और उनकी सीमा इस प्रकार थी: यिज्रेल[a] की ओर, केसुल्लोत[b] और शूनेम।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यिज्रेल’ के इब्रानी रूप में दिशासूचक प्रत्यय है, जिसका अर्थ ‘यिज्रेल की ओर’ या ‘यिज्रेल तक’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'दूसरा सम्भव अनुवाद: “और उनकी सीमा यिज्रेल, केसुल्लोत और शूनेम थी।” इसमें पहले स्थान-नाम की दिशात्मक बारीकी अलग से व्यक्त नहीं की गई है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: और ... इस प्रकार थी
  rationale: वाव-क्रमवाचक रूप अगले सीमा-विवरण को जोड़ता है। हिंदी में स्थानों की सूची को स्वाभाविक बनाने के लिए ‘और ... इस प्रकार थी’ रखा गया है।
- source_word: גְּבוּלָם
  choice: उनकी सीमा
  rationale: גְּבוּל सीमा अथवा सरहद को दर्शाता है; प्रत्यय ‘उनकी’ है और पूर्ववर्ती संदर्भ के गोत्र की ओर संकेत करता है।
- source_word: יִזְרְעֶאלָה
  choice: यिज्रेल की ओर
  rationale: स्थान-नाम के अंत में दिशासूचक ה है, इसलिए ‘की ओर’ मूल पाठ की दिशात्मक बारीकी को व्यक्त करता है।
- source_word: הַכְּסוּלֹת
  choice: कसुल्लोत
  rationale: यह स्थान-नाम है। आरंभिक निश्चित उपपद को हिंदी में अलग अर्थपूर्ण पद बनाने के बजाय नाम के पारंपरिक लिप्यंतरण में समाहित माना गया है।
- source_word: שׁוּנֵם
  choice: शूनेम
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण।
