  text: וַ/יֵּצֵ֥א גְבוּל בְּנֵי דָ֖ן מֵ/הֶ֑ם וַ/יַּעֲל֣וּ בְנֵֽי דָ֠ן וַ/יִּלָּחֲמ֨וּ עִם לֶ֜שֶׁם וַ/יִּלְכְּד֥וּ אוֹתָ֣/הּ וַ/יַּכּ֧וּ אוֹתָ֣/הּ לְ/פִי חֶ֗רֶב וַ/יִּֽרְשׁ֤וּ אוֹתָ/הּ֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַ/יִּקְרְא֤וּ לְ/לֶ֨שֶׁם֙ דָּ֔ן כְּ/שֵׁ֖ם דָּ֥ן אֲבִי/הֶֽם־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/047.yaml
  text: But the territory of the sons of Dan went out beyond them[a], so the sons of Dan went up and fought against Leshem, and they captured it and struck it with the edge of the sword, and they took possession of it and lived in it, and they called Leshem Dan[b], after the name of Dan their father.
translation:
  language: hi
  text: परन्तु दान के वंशजों का इलाका उनसे आगे निकल गया[a]। दान के वंशज ऊपर गए और लेशेम से युद्ध किया। उन्होंने उस पर अधिकार कर लिया और उसे तलवार की धार से मारा; फिर उन्होंने उसे अपने अधिकार में लेकर उसमें निवास किया। उन्होंने अपने पूर्वज दान के नाम पर लेशेम का नाम दान रखा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दान के वंशजों की सीमा उनसे आगे तक फैल गई।” कुछ अनुवाद व्यापक संदर्भ के आधार पर इसका अर्थ “दान के वंशजों का इलाका उनके लिए बहुत छोटा था” करते हैं, पर इब्रानी शब्दावली अधिक शाब्दिक रूप से स्थान या दिशा का भाव रखती है।
    reason: alternative_reading
  - marker: b
    text: न्यायियों 18:7, 14, 27, 29 में लेशेम का संबंध लाएश से माना जाता है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא גְבוּל בְּנֵי דָן מֵהֶם
  choice: दान के वंशजों का इलाका उनसे आगे निकल गया
  rationale: גְבוּל यहाँ सीमा या आवंटित इलाके को सूचित कर सकता है। कठिन पद מֵהֶם के स्थानिक और अस्पष्ट भाव को बनाए रखने के लिए व्याख्यात्मक ‘उनके लिए बहुत छोटा था’ के बजाय ‘उनसे आगे निकल गया’ रखा गया है।
- source_word: בְּנֵי דָן
  choice: दान के वंशज
  rationale: शाब्दिक पारिवारिक-गोत्रीय मुहावरे ‘दान के पुत्र’ का आधुनिक हिन्दी में स्वाभाविक अर्थ ‘दान के वंशज’ है।
- source_word: וַיַּעֲלוּ
  choice: ऊपर गए
  rationale: עלה के भौगोलिक या सैनिक आरोहण के सामान्य अर्थ को सीधे बनाए रखता है।
- source_word: וַיִּלָּחֲמוּ עִם לֶשֶׁם
  choice: लेशेम से युद्ध किया
  rationale: हिन्दी में किसी नगर या उसके निवासियों के विरुद्ध लड़ने के लिए ‘से युद्ध किया’ स्वाभाविक है और मूल का सैनिक अर्थ सुरक्षित रखता है।
- source_word: לֶשֶׁם
  choice: लेशेम
  rationale: मसोरेटी पाठ के स्थाननाम को लाएश से बदलने के बजाय उसी रूप में लिप्यंतरित किया गया है; लाएश से संबंध पादटिप्पणी में दिया गया है।
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: उन्होंने उस पर अधिकार कर लिया
  rationale: לכד के सैनिक संदर्भ में नगर को जीतने या कब्ज़े में लेने का भाव है; यह हिन्दी में सहज रूप से व्यक्त होता है।
- source_word: וַיַּכּוּ אוֹתָהּ לְפִי חֶרֶב
  choice: उसे तलवार की धार से मारा
  rationale: לְפִי חֶרֶב की मूल ‘तलवार के मुँह/धार’ वाली छवि को पठनीय हिन्दी में सुरक्षित रखा गया है।
- source_word: וַיִּרְשׁוּ אוֹתָהּ
  choice: उसे अपने अधिकार में लेकर
  rationale: ירשׁ यहाँ अधिकार या कब्ज़ा प्राप्त करने का अर्थ देता है; ‘अपने अधिकार में लेना’ पूर्ववर्ती विजय के बाद के स्थायी अधिग्रहण को स्पष्ट करता है।
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: उसमें निवास किया
  rationale: ישׁב के ‘रहना/निवास करना’ अर्थ के लिए dignified किंतु सामान्य आधुनिक हिन्दी चुनी गई है।
- source_word: וַיִּקְרְאוּ לְלֶשֶׁם דָּן
  choice: लेशेम का नाम दान रखा
  rationale: नामकरण की इब्रानी रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּשֵׁם דָּן אֲבִיהֶם
  choice: अपने पूर्वज दान के नाम पर
  rationale: אָב का अर्थ वंश-संदर्भ में ‘पिता’ या ‘पूर्वज’ हो सकता है। यहाँ गोत्र के मूलपुरुष दान की बात होने के कारण ‘पूर्वज’ आधुनिक पाठक के लिए अधिक स्पष्ट है।
