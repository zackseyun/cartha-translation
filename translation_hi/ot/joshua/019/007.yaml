  text: 'Ain[a], Rimmon, Ether, and Ashan: four cities, with their villages.'
translation:
  language: hi
  text: अयिन[a], रिम्मोन, एतेर और आशान—चार नगर और उनके गाँव।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू पाठ में चार स्थान-नाम हैं: अयिन, रिम्मोन, एतेर और आशान। कुछ व्याख्याकार 1 इतिहास 4:32 से तुलना करके ‘अयिन-रिम्मोन’ को एक संयुक्त नाम मानते हैं; इससे नगरों की गिनती प्रभावित होती है।'
    reason: cross_reference
lexical_decisions:
- source_word: עַיִן
  choice: अयिन
  rationale: यहाँ यह नगर का नाम है, इसलिए इसके सामान्य अर्थ ‘आँख’ या ‘सोता’ का अनुवाद न करके हिब्रू उच्चारण के निकट लिप्यंतरण किया गया है।
- source_word: רִמּוֹן
  choice: रिम्मोन
  rationale: यह स्थान-नाम है; इसलिए इसके सामान्य अर्थ ‘अनार’ के बजाय लिप्यंतरण रखा गया है।
- source_word: וָעֶתֶר
  choice: एतेर
  rationale: संयोजक सहित यह एक स्थान-नाम है; हिब्रू व्यंजन ע का अलग हिंदी संकेत न देकर स्वाभाविक देवनागरी लिप्यंतरण किया गया है।
- source_word: וְעָשָׁן
  choice: और आशान
  rationale: यह सूची का अंतिम स्थान-नाम है; आरंभिक संयोजक को हिंदी में ‘और’ से व्यक्त किया गया है।
- source_word: עָרִים
  choice: नगर
  rationale: क्षेत्र-विभाजन की इस सूची में यह बसी हुई नगरीय जगहों के लिए सामान्य शब्द है; ‘नगर’ आधुनिक और गरिमापूर्ण हिंदी है।
- source_word: אַרְבַּע
  choice: चार
  rationale: नगरों की संख्या को सीधे व्यक्त किया गया है।
- source_word: וְחַצְרֵיהֶן
  choice: और उनके गाँव
  rationale: חָצֵר यहाँ मुख्य नगरों से संबद्ध ग्रामीण बस्तियों को दर्शाता है; ‘गाँव’ सहज और संदर्भानुकूल है।
