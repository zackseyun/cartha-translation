  register: आधुनिक मानक हिंदी में संक्षिप्त भौगोलिक सूची। स्थान-नामों का अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है। मूल पाठ की चार नगरों वाली स्पष्ट गणना रखी गई है, जबकि संभावित संयुक्त स्थान-नाम की अस्पष्टता पादटिप्पणी में सुरक्षित है।
