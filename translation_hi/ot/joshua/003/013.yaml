  text: וְ/הָיָ֡ה כְּ/נ֣וֹחַ כַּפּ֣וֹת רַגְלֵ֣י הַ/כֹּהֲנִ֡ים נֹשְׂאֵי֩ אֲר֨וֹן יְהוָ֜ה אֲד֤וֹן כָּל הָ/אָ֨רֶץ֙ בְּ/מֵ֣י הַ/יַּרְדֵּ֔ן מֵ֤י הַ/יַּרְדֵּן֙ יִכָּ֣רֵת֔וּ/ן הַ/מַּ֥יִם הַ/יֹּרְדִ֖ים מִ/לְ/מָ֑עְלָ/ה וְ/יַעַמְד֖וּ נֵ֥ד אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/013.yaml
  text: And when the soles of the feet of the priests carrying the ark of Yahweh[a], the Lord of all the earth, come to rest in the waters of the Jordan, the waters flowing down from above will be cut off in the Jordan[b], and they will stand in one heap.
translation:
  language: hi
  text: और जब याहवे, जो सारी पृथ्वी के प्रभु हैं, के संदूक[a] को उठाए हुए याजकों के पैरों के तलवे यरदन के पानी में टिक जाएँगे, तब यरदन का पानी कट जाएगा, और ऊपर से उतरकर आने वाला पानी[b] एक ढेर की तरह खड़ा हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारी पृथ्वी के प्रभु का संदूक।” इब्रानी में “सारी पृथ्वी के प्रभु” को “संदूक” के साथ निकटता से जोड़ा जा सकता है; मुख्य पाठ इसे याहवे की उपाधि मानता है।
    reason: alternative_reading
  - marker: b
    text: या, “ऊपरी धारा से बहकर आने वाला पानी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּנוֹחַ
  choice: और जब ... टिकेंगे, तब
  rationale: यह आगामी परिस्थिति और उसके परिणाम को व्यक्त करता है। ‘टिकेंगे’ נוח के ठहरने या टिक जाने के ठोस भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: כַּפּוֹת רַגְלֵי
  choice: पैरों के तलवे
  rationale: כַּף यहाँ पैर के निचले भाग, अर्थात तलवे, को सूचित करता है; हिन्दी में यह सटीक और सहज है।
- source_word: הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן
  choice: संदूक को उठाए हुए याजक
  rationale: सहभागी रूप נֹשְׂאֵי याजकों की जारी क्रिया बताता है। ‘उठाए हुए’ धार्मिक गरिमा रखते हुए सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: सारी पृथ्वी के प्रभु
  rationale: אֲדוֹן के अधिकारपूर्ण उपाधिगत भाव को ‘प्रभु’ और כָּל הָאָרֶץ की व्यापकता को ‘सारी पृथ्वी’ व्यक्त करते हैं।
- source_word: בְּמֵי הַיַּרְדֵּן
  choice: यरदन के पानी में
  rationale: בְּ यहाँ नदी के पानी में संपर्क या प्रवेश का भाव देता है; ‘पानी में’ स्वाभाविक हिन्दी है।
- source_word: יִכָּרֵתוּן
  choice: रुक जाएगा
  rationale: निफ़अल रूप का प्रसंगगत अर्थ पानी के प्रवाह का काट दिया जाना या रुक जाना है। हिन्दी में ‘पानी रुक जाएगा’ अधिक सहज है और परिणाम स्पष्ट रखता है।
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמָעְלָה
  choice: ऊपर से बहकर आने वाला पानी
  rationale: शाब्दिक ऊँचाई और नदी-संदर्भ में ऊपरी धारा—दोनों का संकेत बचता है; वैकल्पिक पाठ टिप्पणी में स्पष्ट किया गया है।
- source_word: וְיַעַמְדוּ נֵד אֶחָד
  choice: एक ही ढेर बनकर खड़ा हो जाएगा
  rationale: נֵד पानी की इकट्ठी, ढेर जैसी राशि को दर्शाता है और עמד उसके खड़े रहने की चमत्कारिक छवि को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रत्यक्ष लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: ‘सारी पृथ्वी के प्रभु’ का वाक्यगत संबंध
  choice: 'याहवे के लिए समानाधिकरण उपाधि: ‘सारी पृथ्वी के प्रभु, याहवे का संदूक’'
  alternative: ‘सारी पृथ्वी के प्रभु का संदूक’
  rationale: इब्रानी पदक्रम दोनों संबंधों की अनुमति देता है। मुख्य पाठ इसे याहवे की समानाधिकरण उपाधि मानता है, जबकि दूसरी सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। ‘याजक’, ‘संदूक’ और ‘प्रभु’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। मूल की पुनरुक्ति को हिन्दी की स्पष्टता के अनुसार संयोजित किया गया है, और वास्तविक वाक्यगत तथा दिशासूचक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
