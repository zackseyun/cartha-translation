- issue: בְּנֵי יִשְׂרָאֵל का रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल की सन्तानों
  rationale: मुख्य पाठ हिब्रू की पुरुषवाचक बहुवचन संरचना को सुरक्षित रखता है, जबकि यह स्वीकार किया जाता है कि पदबंध सामूहिक जातीय अर्थ में भी प्रयुक्त होता है।
