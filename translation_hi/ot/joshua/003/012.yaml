translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। “आदमी” की अपेक्षा “पुरुष” प्रतिनिधियों के लिंग और औपचारिक प्रसंग को अधिक ठीक ढंग से व्यक्त करता है। इब्रानी वितरणात्मक पुनरुक्ति को स्वाभाविक हिन्दी वाक्यांश में प्रस्तुत किया गया है; अर्थ स्पष्ट होने के कारण पादटिप्पणी आवश्यक नहीं मानी गई।
