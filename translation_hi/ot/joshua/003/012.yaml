  yaml_path: translation/ot/joshua/003/012.yaml
  text: Now take for yourselves twelve men from the tribes of Israel[a], one man from each tribe.
translation:
  language: hi
  text: अब अपने लिए इस्राएल के गोत्रों में से बारह पुरुष ले लो—हर गोत्र से एक-एक पुरुष।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह अगले निर्देश की ओर बढ़ने वाला कथन-संयोजक है। आधुनिक हिन्दी में “अब” स्वाभाविक रूप से क्रम और संक्रमण दोनों व्यक्त करता है।
- source_word: קְחוּ לָכֶם
  choice: अपने लिए चुन लो
  rationale: לקח का मूल अर्थ “लेना” है, पर प्रतिनिधियों के संदर्भ में “चुन लो” अपेक्षित चयन को अधिक स्वाभाविक हिन्दी में व्यक्त करता है; “अपने लिए” לָכֶם की हितार्थक छाया को बनाए रखता है।
- source_word: שְׁנֵי עָשָׂר אִישׁ
  choice: बारह पुरुषों
  rationale: אִישׁ यहाँ प्रत्येक गोत्र से लिए जाने वाले पुरुष प्रतिनिधियों को सूचित करता है; इसलिए लिंग-विशिष्ट “पुरुष” उपयुक्त है।
- source_word: מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों में से
  rationale: מִן स्रोत अथवा समूह में से चयन को दर्शाता है। “गोत्रों में से” हिन्दी में इस चयन-संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד לַשָּׁבֶט
  choice: हर गोत्र से एक पुरुष
  rationale: इब्रानी पुनरुक्ति का प्रयोग वितरणात्मक अर्थ में हुआ है—प्रत्येक गोत्र के लिए एक प्रतिनिधि। हिन्दी में “हर गोत्र से एक पुरुष” इसी अर्थ को संक्षिप्त और स्पष्ट रूप से देता है।
