  text: וַ/יַּעַמְד֡וּ הַ/מַּיִם֩ הַ/יֹּרְדִ֨ים מִ/לְ/מַ֜עְלָ/ה קָ֣מוּ נֵד אֶחָ֗ד הַרְחֵ֨ק מְאֹ֜ד ב/אדם הָ/עִיר֙ אֲשֶׁר֙ מִ/צַּ֣ד צָֽרְתָ֔ן וְ/הַ/יֹּרְדִ֗ים עַ֣ל יָ֧ם הָ/עֲרָבָ֛ה יָם הַ/מֶּ֖לַח תַּ֣מּוּ נִכְרָ֑תוּ וְ/הָ/עָ֥ם עָבְר֖וּ נֶ֥גֶד יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/016.yaml
  text: the waters flowing down from above stood still[a]; they rose up in one heap, very far away, at Adam, the city beside Zarethan. And those flowing down toward the Sea of the Arabah, the Salt Sea, were completely cut off[b], and the people crossed over opposite Jericho.
translation:
  language: hi
  text: ऊपर से बहते हुए जल ठहर गए[a]। वे बहुत दूर, आदाम में—उस नगर में जो सारतान के पास था—एक ही ढेर के रूप में उठ खड़े हुए। और अराबा के समुद्र, अर्थात् खारे समुद्र[b], की ओर बहता हुआ जल पूरी तरह कट गया; और लोग यरीहो के सामने पार गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वे एक ही ढेर के रूप में खड़े हो गए।’ इब्रानी चित्र में जल एक ही ढेर के रूप में इकट्ठा होकर खड़ा है।
    reason: lexical_alternative
  - marker: b
    text: ‘खारा समुद्र’ उस जलाशय का इब्रानी नाम है जिसे बाद में सामान्यतः मृत सागर कहा गया।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: ठहर गया
  rationale: עמד यहाँ नदी के जल के सामान्य बहाव के रुकने को दर्शाता है; ‘ठहर गया’ खड़े होने और रुक जाने, दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמַעְלָה
  choice: ऊपर से बहकर आने वाला जल
  rationale: यह पदबंध ऊँचाई की ओर से नीचे बहते हुए आने वाले, अर्थात् नदी के ऊपरी भाग के जल को दर्शाता है।
- source_word: קָמוּ נֵד אֶחָד
  choice: एक ही ढेर बनकर खड़ा हो गया
  rationale: קום और נֵד का मेल जल के एकत्र होकर एक खड़े हुए ढेर या अवरोध का सजीव चित्र सुरक्षित रखता है।
- source_word: הַרְחֵק מְאֹד
  choice: बहुत दूर
  rationale: यह दूरी पर दिए गए प्रबल बलाघात को सरल और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְאָדָם
  choice: आदाम नगर के पास
  rationale: आदाम यहाँ व्यक्ति नहीं, स्थान का नाम है; ‘नगर’ अगले पद הָעִיר से स्पष्ट किया गया है।
- source_word: הָעִיר אֲשֶׁר מִצַּד צָרְתָן
  choice: जो सारतान के बगल में है
  rationale: מִצַּד निकटता या पार्श्व स्थिति बताता है; ‘बगल में’ इस भौगोलिक संबंध को सीधे व्यक्त करता है।
- source_word: וְהַיֹּרְדִים עַל יָם הָעֲרָבָה
  choice: और अराबा के समुद्र ... की ओर बहने वाला जल
  rationale: कृदन्त नीचे की दिशा में बहते जल को फिर से ग्रहण करता है और עַל यहाँ समुद्र की ओर दिशा दर्शाता है।
- source_word: יָם הַמֶּלַח
  choice: खारा समुद्र
  rationale: यह इब्रानी नाम का सीधा अर्थ है; बाद में यही जलाशय सामान्यतः मृत सागर कहलाया।
- source_word: תַּמּוּ נִכְרָתוּ
  choice: पूरी तरह रुक गया
  rationale: दोनों क्रियाएँ मिलकर नीचे की ओर बहते जल के पूर्णतः समाप्त और कट जाने पर बल देती हैं; हिन्दी में ‘पूरी तरह रुक गया’ स्वाभाविक रूप से यही समेकित बल देता है।
- source_word: וְהָעָם עָבְרוּ
  choice: तब लोग ... पार गए
  rationale: עבר इस प्रसंग में यरदन पार करने को सूचित करता है; ‘तब’ परिणामस्वरूप आगे बढ़ती कथा को स्वाभाविक बनाता है।
- source_word: נֶגֶד יְרִיחוֹ
  choice: यरीहो के सामने से
  rationale: נֶגֶד किसी स्थान के आमने-सामने या विपरीत स्थिति को दर्शाता है; नदी पार करने के प्रसंग में ‘के सामने से’ स्वाभाविक भौगोलिक अभिव्यक्ति है।
