base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/010.yaml
  text: And Joshua said[a], “By this you will know that the living God is among you, and that he will surely drive out from before you the Canaanites, the Hittites, the Hivites, the Perizzites, the Girgashites, the Amorites, and the Jebusites.”
translation:
  language: hi
  text: तब यहोशू ने कहा, “इससे तुम जान लोगे कि जीवित परमेश्वर तुम्हारे बीच में है और वह तुम्हारे सामने से कनानियों, हित्तियों, हिव्वियों, परिज्जियों, गिर्गाशियों, एमोरियों और यबूसियों को निश्चय ही निकाल देगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निश्चय ही बेदखल कर देगा।” हिब्रू क्रिया भूमि से उनका हटाया जाना निश्चित होने पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: हिब्रू कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में आगे बढ़ाता है; ‘तब’ यहाँ प्रसंगगत अनुक्रम बताता है, कठोर कालगत अर्थ नहीं जोड़ता।
- source_word: בְּזֹאת
  choice: इससे
  rationale: उस चिह्न अथवा आगामी घटना को जानने के साधन के रूप में प्रस्तुत करता है और हिन्दी में स्वाभाविक है।
- source_word: תֵּדְעוּן
  choice: तुम जान लोगे
  rationale: द्वितीय पुरुष बहुवचन अपूर्ण क्रिया का प्रसंगानुसार भविष्य अर्थ स्पष्ट और सहज हिन्दी में व्यक्त होता है।
- source_word: אֵל חַי
  choice: जीवित परमेश्वर
  rationale: परमेश्वर के सचमुच जीवित और सक्रिय होने का गुणात्मक दावा सुरक्षित रहता है; यहाँ יהוה नहीं बल्कि אֵל है।
- source_word: בְּקִרְבְּכֶם
  choice: तुम्हारे बीच में
  rationale: समुदाय के मध्य परमेश्वर की उपस्थिति व्यक्त करता है और ‘तुम्हारे भीतर’ से उत्पन्न व्यक्तिगत आंतरिक निवास की संभावित गलतफहमी से बचता है।
- source_word: וְהוֹרֵשׁ יוֹרִישׁ
  choice: निश्चय ही निकाल देगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute की प्रबल निश्चितता को ‘निश्चय ही’ व्यक्त करता है; ‘निकाल देगा’ भूमि से हटाने के अर्थ को सहज हिन्दी में रखता है।
- source_word: מִפְּנֵיכֶם
  choice: तुम्हारे सामने से
  rationale: हिब्रू स्थानवाचक मुहावरे और इस्राएल के मार्ग से लोगों के हटाए जाने, दोनों को निकटता से व्यक्त करता है।
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: कनानियों ... यबूसियों
  rationale: हिब्रू के एकवचन सामूहिक जातिनामों को हिन्दी की स्वाभाविक बहुवचन जातिसूची के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: אֵל חַי का अनुवाद
  choice: जीवित परमेश्वर
  alternative: जीवता-जागता ईश्वर / जीवित ईश्वर
  rationale: यहाँ मूल पाठ में אֵל है, יהוה नहीं; इसलिए वाचा-नाम को पाठ में नहीं जोड़ा गया। ‘जीवित परमेश्वर’ हिन्दी बाइबिलीय गरिमा और जीवित-सक्रिय उपस्थिति के दावे को सुरक्षित रखता है।
- issue: विजय-संबंधी क्रिया की तीव्रता
  choice: निश्चय ही निकाल देगा
  alternative: निश्चय ही बेदखल कर देगा
  rationale: मूल क्रिया निर्णायक रूप से भूमि से हटाने का भाव रखती है। मुख्य पाठ में स्वाभाविक ‘निकाल देगा’ रखा गया है, जबकि ‘बेदखल’ का भूमि-अधिकार संबंधी अर्थ पादटिप्पणी में सुरक्षित है; क्रिया की कठोरता को नरम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्पष्ट किंतु गरिमापूर्ण शैली। जातिनाम प्रचलित हिन्दी बाइबिलीय रूपों में हैं। ‘तुम’ बहुवचन समुदाय को संबोधित करता है।
