source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ אֶל הַ/כֹּהֲנִ֣ים לֵ/אמֹ֔ר שְׂאוּ֙ אֶת אֲר֣וֹן הַ/בְּרִ֔ית וְ/עִבְר֖וּ לִ/פְנֵ֣י הָ/עָ֑ם וַ/יִּשְׂאוּ֙ אֶת אֲר֣וֹן הַ/בְּרִ֔ית וַ/יֵּלְכ֖וּ לִ/פְנֵ֥י הָ/עָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/006.yaml
  text: Then Joshua said to the priests, “Take up the ark of the covenant and cross over before the people.” So they took up the ark of the covenant and went before the people.
translation:
  language: hi
  text: तब यहोशू ने याजकों से कहा, “वाचा का संदूक उठाओ और लोगों के आगे पार जाओ।” तब उन्होंने वाचा का संदूक उठाया और लोगों के आगे चले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम का स्वाभाविक संकेत देता है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: इस व्यक्ति-नाम का मानक हिन्दी बाइबलीय लिप्यंतरण।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: इस्राएल के धार्मिक सेवकों के लिए निश्चित बहुवचन संज्ञा का सीधा और प्रचलित हिन्दी रूप।
- source_word: שְׂאוּ
  choice: उठाओ
  rationale: נשא यहाँ संदूक को उठाकर ले चलने की क्रिया बताता है; ‘उठाओ’ ठोस क्रिया को बनाए रखता है।
- source_word: אֲרוֹן הַבְּרִית
  choice: वाचा का संदूक
  rationale: सम्बन्धवाचक इब्रानी पदबंध का पारदर्शी और प्रचलित हिन्दी अनुवाद, जो संदूक और वाचा के सम्बन्ध को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: וְעִבְרוּ
  choice: पार जाओ
  rationale: עבר का अर्थ इस यरदन-पारगमन प्रसंग में पार जाना है; हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: לִפְנֵי הָעָם
  choice: लोगों के आगे
  rationale: यह पदबंध लोगों के सामने अथवा उनसे आगे की स्थिति बताता है; ‘लोगों के आगे’ स्थानिक अर्थ को स्वाभाविक ढंग से रखता है।
- source_word: וַיִּשְׂאוּ
  choice: उन्होंने ... उठाया
  rationale: आज्ञा वाले उसी मूल शब्द की पुनरावृत्ति रखते हुए याजकों की आज्ञाकारिता स्पष्ट करता है।
- source_word: וַיֵּלְכוּ
  choice: चलने लगे
  rationale: הלך सामान्यतः चलने या जाने को व्यक्त करता है। यहाँ आज्ञा के बाद जुलूस की गति आरम्भ होने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना गन्तव्य पूरा हो जाने का संकेत दिए।
theological_decisions:
- issue: पवित्र उपासना-सन्दर्भ में वाचा-सम्बन्धी पदबंध का अनुवाद
  choice: वाचा का संदूक
  alternative: वाचा-संदूक
  rationale: ‘वाचा का संदूक’ इब्रानी रचना को स्पष्ट रूप से दर्शाता है और प्रभु की वाचा से जुड़े पवित्र संदूक का बोध कराता है, पर उसके सम्बन्ध की प्रकृति पर अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘याजक’, ‘वाचा’ और ‘संदूक’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं; वाक्यरचना सामान्य पाठक के लिए सहज है।
