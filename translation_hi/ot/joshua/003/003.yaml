source:
  edition: WLC
  text: וַ/יְצַוּוּ֮ אֶת הָ/עָ֣ם לֵ/אמֹר֒ כִּ/רְאֽוֹתְ/כֶ֗ם אֵ֣ת אֲר֤וֹן בְּרִית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/הַ/כֹּֽהֲנִים֙ הַ/לְוִיִּ֔ם נֹשְׂאִ֖ים אֹת֑/וֹ וְ/אַתֶּ֗ם תִּסְעוּ֙ מִ/מְּק֣וֹמְ/כֶ֔ם וַ/הֲלַכְתֶּ֖ם אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/003.yaml
  text: And they commanded the people[a], saying, “When you see the ark of the covenant of Yahweh your God, and the Levitical priests carrying it, then you shall set out from your place and go after it.”
translation:
  language: hi
  text: उन्होंने लोगों को आज्ञा दी, “जब तुम अपने परमेश्वर याहवे की वाचा का संदूक देखो और लेवीय याजकों[a] को उसे उठाए हुए देखो, तब अपने स्थान से कूच करो और उसके पीछे चलो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याजक, लेवी।”
    reason: इब्रानी पदबंध הַכֹּהֲנִים הַלְוִיִּם को विशेषणात्मक ‘लेवीय याजक’ या समानाधिकरणीय ‘याजक, लेवी’ समझा जा सकता है।
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: उन्होंने … आज्ञा दी
  rationale: पिएल रूप की अधिकारपूर्ण आज्ञा को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है। बहुवचन कर्ता पिछले संदर्भ से ग्रहण किया गया है।
- source_word: הָעָם
  choice: लोगों को
  rationale: यहाँ עָם समूचे इस्राएली समुदाय के लिए प्रयुक्त है; ‘लोगों’ आधुनिक हिन्दी में स्वाभाविक सामूहिक अभिव्यक्ति है।
- source_word: כִּרְאוֹתְכֶם
  choice: जब तुम … देखो
  rationale: כְּ के साथ infinitive construct यहाँ समयसूचक है; ‘जब’ तत्कालता को अनावश्यक रूप से बढ़ाए बिना मूल अर्थ रखता है।
- source_word: אֲרוֹן בְּרִית
  choice: वाचा का संदूक
  rationale: ‘संदूक’ אָרוֹן का ठोस अर्थ देता है और ‘वाचा का संदूक’ हिन्दी बाइबलीय प्रयोग में स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: प्रतिस्थापनात्मक उपाधि के बजाय इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: लेवीय याजकों
  rationale: यह स्वाभाविक हिन्दी में याजकों की लेवीय पहचान बताता है और दो अलग समूहों का भ्रम नहीं पैदा करता; इब्रानी की संभावित समानाधिकरणीय संरचना पादटिप्पणी में दी गई है।
- source_word: נֹשְׂאִים אֹתוֹ
  choice: उसे उठाए हुए
  rationale: संदूक को ले जाने की चल रही क्रिया को सहज हिन्दी में व्यक्त करता है; केवल ‘उठाते हुए’ क्षणिक उठाने का अर्थ दे सकता था।
- source_word: תִּסְעוּ מִמְּקוֹמְכֶם
  choice: अपने स्थान से कूच करके
  rationale: נָסַע यात्रा के लिए पड़ाव से आगे बढ़ने का भाव रखता है; ‘कूच’ इस प्रसंग में संक्षिप्त और स्वाभाविक है, जबकि ‘डेरा उखाड़ना’ मूल से अधिक विशिष्ट होता।
- source_word: וַהֲלַכְתֶּם אַחֲרָיו
  choice: उसके पीछे चलना
  rationale: הלך אחרי की स्थानगत छवि और अनुसरण करने का अर्थ दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है। लिप्यंतरण उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: הַכֹּהֲנִים הַלְוִיִּם की संरचना
  choice: लेवीय याजक
  alternative: याजक, अर्थात् लेवी
  rationale: मुख्य पाठ में विशेषणात्मक अर्थ सहज है, पर इब्रानी को समानाधिकरण के रूप में भी समझा जा सकता है; इसलिए उस वास्तविक व्याकरणिक विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। बहुवचन ‘तुम’ समुदाय को संबोधित करता है। आज्ञा के लिए ‘कूच करके … चलना’ हिन्दी में प्रत्यक्ष निर्देश का स्वाभाविक रूप है। पादटिप्पणी-चिह्न उसी पदबंध के बाद रखा गया है जिससे वह संबंधित है।
