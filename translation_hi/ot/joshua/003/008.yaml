id: JOS.3.8
reference: Joshua 3:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּצַוֶּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֥י אֲרֽוֹן הַ/בְּרִ֖ית לֵ/אמֹ֑ר כְּ/בֹאֲ/כֶ֗ם עַד קְצֵה֙ מֵ֣י הַ/יַּרְדֵּ֔ן בַּ/יַּרְדֵּ֖ן תַּעֲמֹֽדוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/008.yaml
  text: And you shall command the priests who carry the ark of the covenant[a], saying, ‘When you come to the edge of the waters of the Jordan, you shall stand in the Jordan.’
translation:
  language: hi
  text: 'और तू उन याजकों को, जो वाचा का सन्दूक उठाते हैं, यह आज्ञा देना: “जब तुम यरदन के जल के किनारे[a] पहुँचो, तो यरदन में खड़े हो जाना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरदन के जल के छोर तक।”
    reason: קְצֵה का अर्थ ‘किनारा’, ‘सीमा’ या ‘छोर’ हो सकता है; वैकल्पिक अनुवाद इस स्थानगत शब्द-छाया को सुरक्षित रखता है।
lexical_decisions:
- source_word: וְאַתָּה
  choice: और तू
  rationale: संयोजक וְ के साथ स्वतंत्र सर्वनाम אַתָּה यहोशू पर बल देता है। ‘और तू’ इस निरन्तरता और एकवचन सम्बोधन, दोनों को बनाए रखता है।
- source_word: תְּצַוֶּה
  choice: आज्ञा देना
  rationale: पिएल अपूर्ण, द्वितीय पुरुष एकवचन यहाँ निर्देशात्मक बल रखता है; ‘आज्ञा देना’ स्वाभाविक हिन्दी में उस आदेश को व्यक्त करता है।
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: उन याजकों को, जो … उठाते हैं
  rationale: निश्चित संज्ञा और उसे विशेषित करने वाले कर्तृवाचक कृदन्त को हिन्दी में सम्बन्धवाचक उपवाक्य द्वारा स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: אֲרוֹן הַבְּרִית
  choice: वाचा का सन्दूक
  rationale: यह रचना-सम्बन्ध को ठीक रखता है और ‘वाचा’ के धार्मिक-साहित्यिक अर्थ को बिना अतिरिक्त व्याख्या के संप्रेषित करता है।
- source_word: לֵאמֹר
  choice: 'यह आज्ञा देना:'
  rationale: उद्धरण आरम्भ कराने वाले इब्रानी पद को हिन्दी में ‘यह … देना’ और द्विबिन्दु से स्वाभाविक रूप दिया गया है।
- source_word: כְּבֹאֲכֶם
  choice: जब तुम … पहुँचो
  rationale: כְּ और धातु के क्रियार्थक रूप का कालवाचक अर्थ है; प्रसंग में गन्तव्य तक आने को हिन्दी में ‘पहुँचो’ अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַד קְצֵה מֵי הַיַּרְדֵּן
  choice: यरदन के जल के किनारे
  rationale: קְצֵה यहाँ जल की सीमा, किनारे या छोर का बोध देता है। मुख्य पाठ में ‘किनारे’ सहज है; वैकल्पिक शब्द-छाया पादटिप्पणी में रखी गई है।
- source_word: בַּיַּרְדֵּן תַּעֲמֹדוּ
  choice: यरदन में खड़े हो जाना
  rationale: בְּ स्थान को और עמד खड़े होने या स्थान ग्रहण करने को दर्शाता है। ‘खड़े हो जाना’ आदेश के प्रसंग में स्वाभाविक है और नदी के भीतर स्थान लेने का अर्थ बनाए रखता है।
