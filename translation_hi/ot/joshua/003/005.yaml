  yaml_path: translation/ot/joshua/003/005.yaml
  text: Then Joshua said to the people, “Consecrate yourselves, because tomorrow the LORD will do wonders among you.”
translation:
  language: hi
  text: तब यहोशू ने लोगों से कहा, “अपने आपको पवित्र करो, क्योंकि कल यहोवा तुम्हारे बीच अद्भुत काम करेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְקַדָּשׁוּ
  choice: अपने आपको पवित्र करो
  rationale: हिब्रू हित्पाएल आज्ञार्थक का आत्मवाची भाव बनाए रखता है और सामान्य पाठक के लिए स्वाभाविक है; प्रसंग में इसका अर्थ आगामी ईश्वरीय कार्य के लिए स्वयं को अलग और तैयार करना है।
- source_word: נִפְלָאוֹת
  choice: अद्भुत काम
  rationale: बहुवचन संज्ञा का आशय विस्मयकारी ईश्वरीय कार्यों से है; हिंदी में यह प्रयोग स्पष्ट और स्वाभाविक है।
- source_word: בְּקִרְבְּכֶם
  choice: तुम्हारे बीच
  rationale: समुदाय के मध्य होने वाले कार्य का स्वाभाविक हिंदी रूप; 'तुम्हारे भीतर' की संभावित भ्रामक व्यक्तिगत व्याख्या से बचाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को हिंदी की प्रचलित बाइबलीय वर्तनी में प्रत्यक्ष रूप से प्रस्तुत करता है।
theological_decisions:
- issue: हִתְקַדָּשׁוּ में मानवीय तैयारी और धार्मिक पवित्रीकरण का संबंध
  choice: अपने आपको पवित्र करो
  alternative: अपने आपको तैयार करो
  rationale: मूल क्रिया पवित्रता/अलग किए जाने की धारणा रखती है; केवल 'तैयार करो' कहने से धार्मिक अर्थ घट जाता।
- issue: כִּי का संबंध
  choice: क्योंकि
  alternative: निश्चय ही
  rationale: यहाँ आगामी ईश्वरीय अद्भुत कार्य को आज्ञा का कारण बताना सर्वाधिक स्वाभाविक है, यद्यपि हिब्रू अव्यय कभी-कभी बलसूचक भी हो सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। प्रत्यक्ष कथन और सामूहिक बहुवचन संबोधन को स्पष्ट रखा गया है।
