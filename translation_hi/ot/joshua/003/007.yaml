id: JOS.3.7
reference: Joshua 3:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ גַּדֶּלְ/ךָ֔ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל אֲשֶׁר֙ יֵֽדְע֔וּ/ן כִּ֗י כַּ/אֲשֶׁ֥ר הָיִ֛יתִי עִם מֹשֶׁ֖ה אֶהְיֶ֥ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/007.yaml
  text: And Yahweh said to Joshua[a], “Today I will begin to make you great in the sight of all Israel, so that they may know that just as I was with Moses, I will be with you.”
translation:
  language: hi
  text: तब याहवे ने यहोशू से कहा, “आज मैं सारे इस्राएल की दृष्टि में तुम्हें महान बनाना शुरू करूँगा[a], ताकि वे जान लें कि जैसे मैं मूसा के साथ था, वैसे ही मैं तुम्हारे साथ भी रहूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हें ऊँचा उठाना शुरू करूँगा।”
    reason: ‘महान बनाना’ के लिए प्रयुक्त इब्रानी क्रिया सार्वजनिक प्रतिष्ठा बढ़ाने या ऊँचा उठाने का भाव भी व्यक्त कर सकती है।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: इब्रानी कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַיּוֹם הַזֶּה
  choice: आज
  rationale: शाब्दिक अर्थ ‘यह दिन’ है; ‘आज’ उसी कालगत बल को सहज हिन्दी में रखता है।
- source_word: אָחֵל
  choice: शुरू करूँगा
  rationale: यहाँ हिफ़ील रूप आरम्भ करने का अर्थ देता है और संदर्भ में निकट भविष्य की घोषणा है।
- source_word: גַּדֶּלְךָ
  choice: तुम्हें महान बनाना
  rationale: पिएल रूप यहोशू को सार्वजनिक रूप से बड़ा या प्रतिष्ठित करने का भाव देता है; ‘महान बनाना’ मूल रूपक को बनाए रखता है।
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल की दृष्टि में
  rationale: ‘आँखों में’ वाली इब्रानी उक्ति सार्वजनिक धारणा और मान्यता दर्शाती है; यह हिन्दी अभिव्यक्ति उस भाव को सुरक्षित रखती है।
- source_word: אֲשֶׁר יֵדְעוּן
  choice: ताकि वे जान लें
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम बताने वाले उपवाक्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: जैसे मैं मूसा के साथ था
  rationale: तुलनात्मक रचना मूसा और यहोशू के साथ परमेश्वर की उपस्थिति के स्पष्ट समानांतर को बनाए रखती है।
- source_word: אֶהְיֶה עִמָּךְ
  choice: वैसे ही मैं तुम्हारे साथ भी रहूँगा
  rationale: भविष्यकालीन प्रतिज्ञा को स्पष्ट करता है; ‘वैसे ही’ और ‘भी’ हिन्दी में पूर्ववर्ती तुलना को स्वाभाविक ढंग से पूरा करते हैं।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: यहोशू को ‘महान बनाने’ का आशय
  choice: मूल अभिव्यक्ति को बनाए रखा गया
  alternative: तुम्हें प्रतिष्ठित करूँगा; तुम्हें ऊँचा उठाऊँगा
  rationale: पाठ सार्वजनिक रूप से यहोशू का कद बढ़ाने की बात करता है। अधिक व्याख्यात्मक शब्द चुनकर इस कार्य के स्वरूप को अनावश्यक रूप से सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘सारे इस्राएल की दृष्टि में’ मूल इब्रानी मुहावरे के सार्वजनिक मान्यता वाले अर्थ को सहज हिन्दी में रखता है; वाक्य में मूसा और यहोशू के बीच तुलना स्पष्ट बनी रहती है।
