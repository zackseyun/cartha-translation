base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/015.yaml
  text: And when those carrying the ark came as far as the Jordan[a], and the feet of the priests carrying the ark were dipped in the edge of the water (now the Jordan was full over all its banks all the days of harvest)[b],
translation:
  language: hi
  text: और जब सन्दूक को उठानेवाले यरदन तक पहुँचे, और सन्दूक को उठानेवाले याजकों के पाँव पानी के किनारे में डूब गए[a]—यरदन कटनी के सारे दिनों में अपने सब तटों के ऊपर भरा रहता था[b]—,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘पानी के छोर में’ है; अर्थात याजकों के पाँव किनारे पर पानी में प्रवेश कर गए।
    reason: lexical_alternative
  - marker: b
    text: अर्थात कटनी के मौसम में यरदन बाढ़ की अवस्था में अपने तटों से ऊपर भरा रहता था।
    reason: cultural_note
lexical_decisions:
- source_word: וּכְבוֹא
  choice: और जब ... पहुँचे
  rationale: संयोजक, कालवाचक पूर्वसर्ग और धातु के infinitive construct का मेल एक कालवाचक उपवाक्य आरम्भ करता है। ‘और जब ... पहुँचे’ क्रम और आगमन, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: सन्दूक उठानेवाले
  rationale: कृदन्त उन लोगों को सूचित करता है जो सन्दूक को ले जा रहे थे। ‘उठानेवाले’ सरल और वर्तमान हिन्दी में स्पष्ट है।
- source_word: עַד הַיַּרְדֵּן
  choice: यरदन तक
  rationale: עַד गति के उस बिन्दु को दर्शाता है जहाँ तक पहुँचा गया; ‘यरदन तक’ नदी के पास पहुँचने का स्वाभाविक हिन्दी रूप है।
- source_word: וְרַגְלֵי הַכֹּהֲנִים
  choice: और ... याजकों के पाँव
  rationale: सम्बन्धवाचक हिब्रू रचना का सीधा रूप है और मूल के पाँवों पर दिए गए बल को बनाए रखता है।
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: सन्दूक उठानेवाले
  rationale: मूल में दोहराए गए कृदन्त को छोड़ा नहीं गया, क्योंकि यह स्पष्ट करता है कि किन याजकों की बात हो रही है।
- source_word: נִטְבְּלוּ
  choice: डूबे
  rationale: טבל का निफ़अल रूप पानी में डाले या डुबोए जाने का भाव देता है। यहाँ पाँव पानी के किनारे में प्रवेश करते हैं; ‘डूबे’ केवल ‘छुए’ से अधिक सटीक है, पर पूरे शरीर के निमज्जन का संकेत नहीं देता।
- source_word: בִּקְצֵה הַמָּיִם
  choice: पानी के किनारे
  rationale: शाब्दिक अर्थ ‘पानी के छोर/किनारे में’ है। हिन्दी में ‘पानी के किनारे डूबे’ स्वाभाविक रहते हुए यह स्पष्ट करता है कि पाँव पानी की बाहरी धार में प्रवेश कर गए।
- source_word: וְהַיַּרְדֵּן מָלֵא
  choice: यरदन ... बहता था
  rationale: यह पृष्ठभूमि बताने वाला प्रसंगान्तर है। מָלֵא मूलतः ‘भरा हुआ था’ है, पर अगले वाक्यांश के साथ नदी के तटों के ऊपर बहने की स्थिति व्यक्त करता है।
- source_word: עַל כָּל גְּדוֹתָיו
  choice: अपने सभी तटों के ऊपर
  rationale: यह वाक्यांश नदी के बाढ़ की अवस्था में तटों से ऊपर बहने का चित्र देता है; ‘ऊपर’ उस स्थानिक छवि को बनाए रखता है।
- source_word: כֹּל יְמֵי קָצִיר
  choice: कटनी के पूरे समय
  rationale: यह पूरी कटनी की अवधि को सूचित करता है। ‘कटनी के पूरे समय’ निकटार्थी, संक्षिप्त और स्वाभाविक हिन्दी है।
