  text: And at the end of three days[a], the officers went through the midst of the camp.
translation:
  language: hi
  text: और तीन दिन पूरे होने पर अधिकारी छावनी के बीच से होकर गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: और
  rationale: यहाँ वाव-क्रमिक के साथ היה कथा में अगले घटनाक्रम की ओर संक्रमण कराता है; आधुनिक हिन्दी में सरल संयोजक स्वाभाविक है।
- source_word: מִקְצֵה שְׁלֹשֶׁת יָמִים
  choice: तीन दिन पूरे होने पर
  rationale: यह समय-सीमा के अंत को व्यक्त करता है। यह हिन्दी में स्वाभाविक है और 'तीन दिनों के अंत में' की अपेक्षा अधिक सहजता से वही अर्थ देता है।
- source_word: וַיַּעַבְרוּ
  choice: से होकर गए
  rationale: עבר और בְּקֶרֶב साथ मिलकर छावनी के भीतर से गुजरने की गति व्यक्त करते हैं, न कि किसी सीमा या नदी को पार करने की।
- source_word: הַשֹּׁטְרִים
  choice: अधिकारी
  rationale: इस प्रशासनिक और सैन्य प्रसंग में यह नियुक्त अधिकारियों को दर्शाता है, जो निर्देश पहुँचाते और लागू कराते थे।
- source_word: בְּקֶרֶב הַמַּחֲנֶה
  choice: छावनी के बीच से
  rationale: यह छावनी के भीतरी भाग में से गति को व्यक्त करता है; 'बीच से होकर' स्थान और गति दोनों को स्पष्ट रखता है।
