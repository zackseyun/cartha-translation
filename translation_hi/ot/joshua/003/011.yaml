  yaml_path: translation/ot/joshua/003/011.yaml
  text: Look[a], the ark of the covenant, the Lord of all the earth, is crossing ahead of you in the Jordan.
translation:
  language: hi
  text: देखो, सारी पृथ्वी के प्रभु की वाचा का सन्दूक तुम्हारे आगे-आगे यरदन में से पार जा रहा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान खींचने वाला अव्यय है। ‘देखो’ आधुनिक हिन्दी में इसकी तात्कालिकता और सजीवता बनाए रखता है।
- source_word: אֲרוֹן הַבְּרִית
  choice: वाचा का सन्दूक
  rationale: यह इब्रानी पदबंध के सम्बन्ध को स्पष्ट और प्रचलित बाइबिलीय हिन्दी में व्यक्त करता है।
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: सारी पृथ्वी का प्रभु
  rationale: ‘प्रभु’ सार्वभौम अधिकार के इस पदनाम का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; ‘सारी पृथ्वी’ כָּל הָאָרֶץ की व्यापकता को बनाए रखता है।
- source_word: עֹבֵר
  choice: पार जा रहा है
  rationale: वर्तमान कृदन्त चल रही अथवा निकट भविष्य में घटने वाली सजीव क्रिया दिखाता है। नदी के प्रसंग में ‘पार जा रहा है’ स्वाभाविक है।
- source_word: לִפְנֵיכֶם
  choice: तुम्हारे आगे-आगे
  rationale: यह लोगों से पहले और उनका मार्ग दिखाते हुए आगे बढ़ने का भाव स्पष्ट करता है।
- source_word: בַּיַּרְדֵּן
  choice: यरदन में से
  rationale: בְּ का मूल स्थानवाचक भाव रखते हुए ‘में से पार जाना’ हिन्दी में नदी पार करने की गतिशील क्रिया को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: אֲדוֹן כָּל הָאָרֶץ का वाचा के सन्दूक से वाक्यगत सम्बन्ध
  choice: वाचा का सन्दूक—सारी पृथ्वी का प्रभु—
  alternative: सारी पृथ्वी के प्रभु की वाचा का सन्दूक
  rationale: मसोरेटी विराम और पदक्रम शीर्षक को अलग, समीपस्थ पदबंध के रूप में प्रस्तुत करते हैं, जबकि अर्थ की दृष्टि से इसे प्रभु के साथ सम्बन्धसूचक श्रृंखला भी समझा गया है। मुख्य पाठ निकटतर संरचना और उसकी धार्मिक तीक्ष्णता को बनाए रखता है; पादटिप्पणी दूसरे सम्भव अर्थ को दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सन्दूक,’ ‘वाचा’ और ‘प्रभु’ प्रचलित बाइबिलीय शब्दावली हैं। डैश इब्रानी पदक्रम में उपस्थित निकटस्थ शीर्षक को दिखाते हैं, और पादटिप्पणी सम्बन्धसूचक वैकल्पिक समझ को सुरक्षित रखती है।
