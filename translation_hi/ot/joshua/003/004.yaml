  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֣ךְ רָח֣וֹק יִהְיֶ֗ה בֵּֽינֵי/כֶם֙ ו/בינ/ו כְּ/אַלְפַּ֥יִם אַמָּ֖ה בַּ/מִּדָּ֑ה אַֽל תִּקְרְב֣וּ אֵלָ֗י/ו לְמַ֤עַן אֲשֶׁר תֵּֽדְעוּ֙ אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ כִּ֣י לֹ֧א עֲבַרְתֶּ֛ם בַּ/דֶּ֖רֶךְ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/004.yaml
  text: Yet there shall be a distance between you and it[a], about two thousand cubits by measure. Do not come near it, so that you may know the way by which you shall go[b], for you have not passed this way before.
translation:
  language: hi
  text: परन्तु तुम्हारे और उसके बीच नाप के अनुसार लगभग दो हज़ार हाथ[a] की दूरी रहे। उसके पास मत जाना, ताकि तुम उस मार्ग को जान सको जिस पर तुम चलोगे, क्योंकि तुम इससे पहले[b] इस मार्ग से नहीं गुज़रे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हाथ’ प्राचीन काल की लंबाई की एक मानक इकाई थी, जो लगभग कोहनी से उँगलियों के सिरे तक की लंबाई के बराबर होती थी।
    reason: cultural_note
  - marker: b
    text: मूल भाषा में शाब्दिक रूप से ‘कल और परसों से’; यह एक मुहावरा है, जिसका अर्थ ‘पहले’ या ‘इससे पूर्व’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु
  rationale: यह पिछले निर्देश के साथ एक सीमित करने वाला विरोध अथवा अपवाद जोड़ता है; ‘परन्तु’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רָחוֹק יִהְיֶה בֵּינֵיכֶם וּבֵינוֹ
  choice: तुम्हारे और उसके बीच ... दूरी रहे
  rationale: इब्रानी वाक्य सीधे आज्ञा देने के बजाय दोनों के बीच दूरी बने रहने की बात कहता है। ‘उसके’ का संदर्भ प्रसंग में वाचा के सन्दूक से है।
- source_word: כְּאַלְפַּיִם אַמָּה בַּמִּדָּה
  choice: नाप के अनुसार लगभग दो हज़ार हाथ
  rationale: כְּ का अनुमानसूचक भाव ‘लगभग’ से व्यक्त किया गया है। प्राचीन माप אַמָּה के लिए प्रचलित हिन्दी बाइबलीय शब्द ‘हाथ’ रखा गया है और उसका अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: אַל תִּקְרְבוּ אֵלָיו
  choice: उसके पास मत जाना
  rationale: यह बहुवचन में सीधा निषेध है; चुना हुआ रूप स्पष्ट और स्वाभाविक आधुनिक हिन्दी है।
- source_word: לְמַעַן אֲשֶׁר תֵּדְעוּ
  choice: ताकि तुम ... जान सको
  rationale: उद्देश्यसूचक रचना को हिन्दी में स्वाभाविक ‘ताकि’ से व्यक्त किया गया है।
- source_word: אֶת־הַדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: उस मार्ग को ... जिस पर तुम चलोगे
  rationale: ‘मार्ग’ דֶּרֶךְ का स्वाभाविक और गरिमापूर्ण प्रतिरूप है। ‘चलोगे’ इब्रानी अपूर्ण क्रिया का भविष्यगत भाव रखता है और अनावश्यक बाध्यता नहीं जोड़ता।
- source_word: כִּי לֹא עֲבַרְתֶּם בַּדֶּרֶךְ
  choice: क्योंकि तुम ... इस मार्ग से नहीं गुज़रे हो
  rationale: עָבַר का मार्ग के प्रसंग में अर्थ ‘गुज़रना’ है; पूर्ण क्रिया को वर्तमान से संबद्ध भूतकाल के रूप में व्यक्त किया गया है।
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: इससे पहले
  rationale: यह शब्दसमूह शाब्दिक रूप से ‘कल और परसों से’ है, पर मुहावरे के रूप में ‘पहले’ अथवा ‘पूर्वकाल में’ अर्थ देता है; शाब्दिक चित्र पाद-टिप्पणी में सुरक्षित है।
