id: JOS.3.14
reference: Joshua 3:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/נְסֹ֤עַ הָ/עָם֙ מֵ/אָ֣הֳלֵי/הֶ֔ם לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּ֑ן וְ/הַ/כֹּהֲנִ֗ים נֹֽשְׂאֵ֛י הָ/אָר֥וֹן הַ/בְּרִ֖ית לִ/פְנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/014.yaml
  text: And it happened[a], when the people set out from their tents to cross the Jordan, and the priests carrying the ark of the covenant were before the people,
translation:
  language: hi
  text: और ऐसा हुआ कि जब लोग यरदन पार करने के लिए अपने तंबुओं से निकले, तब वाचा का संदूक उठाए हुए याजक लोगों के आगे[a] थे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लोगों के सामने।’
    reason: לִפְנֵי स्थान की ऐसी स्थिति व्यक्त कर सकता है जिसे हिन्दी में ‘आगे’ या ‘सामने’ कहा जा सकता है।
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह हिब्रू कथा में नई घटना आरम्भ करने वाला प्रचलित सूत्र है; यह अनुवाद उसके कथात्मक कार्य को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: בִּנְסֹעַ הָעָם
  choice: जब लोग … निकले
  rationale: ב के साथ infinitive construct समयसूचक परिस्थिति बताता है। यहाँ נסע का अर्थ डेरा छोड़कर प्रस्थान करना है, जिसे ‘निकले’ सहज रूप से व्यक्त करता है।
- source_word: מֵאָהֳלֵיהֶם
  choice: अपने तंबुओं से
  rationale: אֹהֶל का ठोस अर्थ ‘तंबू’ है; इस पड़ाव के संदर्भ में यही व्यापक ‘डेरे’ की अपेक्षा अधिक सटीक है।
- source_word: לַעֲבֹר אֶת־הַיַּרְדֵּן
  choice: यरदन पार करने के लिए
  rationale: עבר का infinitive यहाँ उद्देश्य प्रकट करता है। ‘यरदन पार करना’ नदी पार करने के लिए स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: וְהַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן הַבְּרִית
  choice: तब वाचा का संदूक उठाए हुए याजक
  rationale: हिब्रू की संज्ञात्मक/विशेषणात्मक रचना ‘याजक, वाचा के संदूक को उठाने वाले’ को स्पष्ट और गरिमापूर्ण हिन्दी में रखा गया है; ‘उठाए हुए’ अनावश्यक रूप से गति नहीं जोड़ता।
- source_word: הָאָרוֹן הַבְּרִית
  choice: वाचा का संदूक
  rationale: ארון के लिए ‘संदूक’ ठोस अर्थ देता है और ‘वाचा’ ברית का स्थापित बाइबलीय अर्थ सुरक्षित रखती है।
- source_word: לִפְנֵי הָעָם
  choice: लोगों के आगे
  rationale: לִפְנֵי यहाँ स्थान की दृष्टि से लोगों के सामने या उनसे आगे होने को बताता है। ‘आगे’ संक्षिप्त और स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। पद के अंत में अल्पविराम रखा गया है क्योंकि हिब्रू वाक्य अगली आयत में आगे बढ़ता है। पादटिप्पणी-चिह्न को उसके वास्तविक स्रोत-वाक्यांश ‘लोगों के आगे’ पर रखा गया है।
