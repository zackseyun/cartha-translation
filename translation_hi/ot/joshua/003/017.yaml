base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/017.yaml
  text: And the priests carrying the ark of the covenant of Yahweh stood firmly on dry ground in the middle of the Jordan[c][b][a], while all Israel was crossing on dry ground until the whole nation had finished crossing the Jordan.
translation:
  language: hi
  text: याहवे की वाचा का सन्दूक[a] उठाए हुए याजक यरदन के बीचोंबीच सूखी भूमि पर दृढ़ता से खड़े रहे,[b] और सारा इस्राएल सूखी भूमि पर होकर पार जाता रहा, जब तक कि पूरे राष्ट्र[c] ने यरदन को पार नहीं कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की वाचा वाला सन्दूक।”
    reason: इब्रानी सम्बन्धवाचक पद-श्रृंखला को हिन्दी में एक से अधिक स्वाभाविक ढंग से समझाया जा सकता है।
  - marker: b
    text: 'इब्रानी में स्थिरता पर बल है: याजक नदी के तल में अपने स्थान पर दृढ़ता से खड़े रहे।'
    reason: הָכֵן याजकों के अटल और स्थिर बने रहने को रेखांकित करता है।
  - marker: c
    text: या, “सारे लोग”; इब्रानी में इस्राएल के लिए एकवचन सामूहिक शब्द है।
    reason: גּוֹי का अर्थ प्रसंग में ‘राष्ट्र’ या सामूहिक रूप से ‘लोग’ हो सकता है।
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: खड़े रहे
  rationale: क्रिया עמד यहाँ याजकों के खड़े होने और नदी के तल में उसी स्थान पर बने रहने, दोनों को व्यक्त करती है; ‘खड़े रहे’ इस निरंतरता को स्वाभाविक हिन्दी में दिखाता है।
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: उठाए हुए याजक
  rationale: कृदन्त נֹשְׂאֵי याजकों द्वारा सन्दूक उठाए रखने की जारी अवस्था बताता है।
- source_word: הָאָרוֹן בְּרִית יְהוָה
  choice: याहवे की वाचा का सन्दूक
  rationale: सम्बन्धवाचक इब्रानी पद-श्रृंखला को स्पष्ट और प्रचलित हिन्दी रूप में रखा गया है; वैकल्पिक सम्बन्ध नीचे टिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: בֶּחָרָבָה
  choice: सूखी भूमि पर
  rationale: जल हटने से प्रकट सूखे तल के लिए यह स्वाभाविक हिन्दी है; पद में दोनों बार एक ही रूप रखा गया है।
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: यरदन के बीच
  rationale: בְּתוֹךְ नदी के भीतर या मध्य में स्थित होने का बोध कराता है; ‘के बीच’ संक्षिप्त और स्पष्ट है।
- source_word: הָכֵן
  choice: दृढ़ता से
  rationale: यहाँ शब्द तैयारी से अधिक स्थिर और अटल ढंग से खड़े रहने पर बल देता है।
- source_word: וְכָל יִשְׂרָאֵל עֹבְרִים
  choice: और सारा इस्राएल ... पार जाता रहा
  rationale: कृदन्त जारी क्रिया दिखाता है, जबकि सामूहिक ‘इस्राएल’ के साथ एकवचन हिन्दी क्रिया स्वाभाविक है।
- source_word: עַד אֲשֶׁר תַּמּוּ
  choice: तब तक ... जब तक ... नहीं कर चुका
  rationale: यह वाक्यांश उस समय-बिंदु को बताता है जब पार जाने का कार्य पूरी तरह समाप्त हुआ।
- source_word: כָּל הַגּוֹי
  choice: पूरा राष्ट्र
  rationale: גּוֹי यहाँ इस्राएल के लिए एकवचन सामूहिक संज्ञा है; ‘पूरा राष्ट्र’ उस रूप को बनाए रखता है।
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: यरदन पार
  rationale: हिन्दी में नदी पार करने की पूर्ण हुई क्रिया को संक्षिप्त और स्वाभाविक ढंग से व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज कथात्मक शैली। ‘वाचा’, ‘सन्दूक’, ‘याजक’ और ‘इस्राएल’ जैसे स्थापित बाइबलीय पद प्रसंग की पहचान बनाए रखते हैं; वाक्य में जारी और समकालिक क्रियाओं को ‘खड़े रहे’ तथा ‘पार जाता रहा’ से व्यक्त किया गया है।
