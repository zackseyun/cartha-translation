  text: וַ/יַּשְׁכֵּם֩ יְהוֹשֻׁ֨עַ בַּ/בֹּ֜קֶר וַ/יִּסְע֣וּ מֵֽ/הַ/שִּׁטִּ֗ים וַ/יָּבֹ֨אוּ֙ עַד הַ/יַּרְדֵּ֔ן ה֖וּא וְ/כָל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּלִ֥נוּ שָׁ֖ם טֶ֥רֶם יַעֲבֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/001.yaml
  text: Joshua rose early in the morning[a], and they set out from Shittim and came to the Jordan, he and all the sons of Israel, and they spent the night there before they crossed over.
translation:
  language: hi
  text: यहोशू सुबह बहुत जल्दी उठा; फिर वह और इस्राएल के सभी लोग शित्तीम से चल पड़े और यरदन तक पहुँचे। पार जाने से पहले उन्होंने वहीं रात बिताई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: सुबह तड़के उठा
  rationale: यह स्वाभाविक आधुनिक हिन्दी में जल्दी उठने और प्रातःकाल—दोनों भावों को व्यक्त करता है।
- source_word: וַיִּסְעוּ
  choice: चल पड़े
  rationale: यात्रा-वृत्तांत में यह क्रिया छावनी छोड़कर आगे की यात्रा आरम्भ करने का संकेत देती है; ‘चल पड़े’ संक्षिप्त और सहज है।
- source_word: מֵהַשִּׁטִּים
  choice: शित्तीम से
  rationale: यह स्थान-नाम है, इसलिए इसके संभावित अर्थ ‘बबूलों’ का अनुवाद करने के बजाय इसका लिप्यंतरण किया गया है।
- source_word: וַיָּבֹאוּ עַד הַיַּרְדֵּן
  choice: यरदन तक पहुँचे
  rationale: עַד गन्तव्य की सीमा तक पहुँचने का भाव रखता है; हिन्दी में यह रूप स्पष्ट और स्वाभाविक है।
- source_word: הוּא וְכָל בְּנֵי יִשְׂרָאֵל
  choice: वह और इस्राएल के सभी पुत्र
  rationale: एकवचन सर्वनाम यहोशू को फिर से स्पष्ट करता है, और ‘इस्राएल के पुत्र’ इब्रानी राष्ट्रीय-वंशगत अभिव्यक्ति के रूप को सुरक्षित रखता है।
- source_word: וַיָּלִנוּ שָׁם
  choice: उन्होंने वहीं रात बिताई
  rationale: लून का यहाँ अर्थ रात भर ठहरना है; यह हिन्दी में सहज और सटीक अभिव्यक्ति है।
- source_word: טֶרֶם יַעֲבֹרוּ
  choice: पार जाने से पहले
  rationale: טֶרֶם पूर्वकालिक सम्बन्ध बताता है और नदी के प्रसंग में עבר का अर्थ पार जाना है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के सभी पुत्र
  alternative: सभी इस्राएली
  rationale: मुख्य पाठ इब्रानी की पुरुषवाचक बहुवचन वंशगत अभिव्यक्ति को दृश्यमान रखता है; अधिक मुहावरेदार सामूहिक अर्थ पादटिप्पणी में दिया गया है। यहाँ किसी विशिष्ट साम्प्रदायिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल पर गरिमापूर्ण कथात्मक शैली। मूल के घटनाक्रम और यहोशू को पुनः स्पष्ट करने वाले सर्वनाम को सुरक्षित रखा गया है।
