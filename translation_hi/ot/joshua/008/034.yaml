  yaml_path: translation/ot/joshua/008/034.yaml
  text: And afterward he read all the words of the law[a], the blessing and the curse[b], according to all that is written in the Book of the Law.
translation:
  language: hi
  text: इसके बाद उसने व्यवस्था[b] की सारी बातें—आशीष और शाप—पढ़कर सुनाईं[a], ठीक वैसे ही जैसे व्यवस्था की पुस्तक में लिखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घोषित कीं” अथवा “ऊँचे स्वर में पढ़ीं”; यहाँ इब्रानी क्रिया सार्वजनिक रूप से पढ़ने या सुनाने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “व्यवस्था” के लिए इब्रानी शब्द तोराह है, जिसका अर्थ “शिक्षा” या “निर्देश” भी हो सकता है। यहाँ वाचा और लिखित दस्तावेज़ के प्रसंग के कारण “व्यवस्था” रखा गया है।
    reason: lexical_alternative
