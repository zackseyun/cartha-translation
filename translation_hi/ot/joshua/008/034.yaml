- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: आशीष और शाप
  rationale: एकवचन संज्ञाएँ वाचा की आशीष और शाप को समष्टिगत श्रेणियों के रूप में व्यक्त करती हैं; हिन्दी में यह शाब्दिक और स्वाभाविक है।
- source_word: כְּכָל הַכָּתוּב
  choice: ठीक वैसे ही जैसे ... लिखा है
  rationale: यह पढ़े गए विषय की लिखित मानक से पूर्ण अनुरूपता व्यक्त करता है और हिन्दी में सहज है।
- source_word: בְּסֵפֶר הַתּוֹרָה
  choice: व्यवस्था की पुस्तक में
  rationale: סֵפֶר एक लिखित दस्तावेज़ को सूचित करता है; 'व्यवस्था की पुस्तक' स्पष्ट, प्रचलित और प्रसंगानुकूल पदबंध है।
