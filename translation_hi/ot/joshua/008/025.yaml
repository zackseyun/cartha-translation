  yaml_path: translation/ot/joshua/008/025.yaml
  text: And all who fell that day[a], from man to woman, were twelve thousand—all the people of Ai.
translation:
  language: hi
  text: उस दिन पुरुष से लेकर स्त्री तक जितने लोग मारे गए, वे कुल बारह हज़ार थे—ऐ के सभी लोग[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “ऐ के सभी पुरुष।” यहाँ यह अभिव्यक्ति नगर के सभी लोगों अथवा निवासियों के लिए सामूहिक रूप से प्रयुक्त हो सकती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: वे कुल ... थे
  rationale: यहाँ क्रिया युद्ध के परिणाम का सार प्रस्तुत करती है। स्वाभाविक आधुनिक हिन्दी में इसे वाक्य की मुख्य संयोजक क्रिया ‘थे’ से व्यक्त किया गया है।
- source_word: כָל הַנֹּפְלִים
  choice: जितने लोग मारे गए
  rationale: נפל का शाब्दिक अर्थ ‘गिरे’ है, पर युद्ध के प्रसंग में इसका आशय मारे गए लोगों से है। हिन्दी में केवल ‘गिरे’ अस्पष्ट हो सकता था, इसलिए प्रसंगगत अर्थ स्पष्ट किया गया।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह इब्रानी कालवाचक पद का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: पुरुष से लेकर स्त्री तक
  rationale: एकवचन वितरणात्मक संरचना और पूरी आबादी को समेटने वाला बल दोनों सुरक्षित रखे गए हैं।
- source_word: שְׁנֵים עָשָׂר אָלֶף
  choice: बारह हज़ार
  rationale: संख्या का सीधा अनुवाद।
- source_word: כֹּל אַנְשֵׁי הָעָי
  choice: ऐ के सभी लोग
  rationale: אַנְשֵׁי का रूप शाब्दिक रूप से ‘पुरुष’ कह सकता है, किन्तु तत्काल पूर्ववर्ती ‘पुरुष से लेकर स्त्री तक’ के कारण यहाँ यह नगर की समूची जनसंख्या के लिए सामूहिक मुहावरा है। ‘सभी लोग’ अर्थ और संदर्भ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: हताहतों के सारांश में लिंगसूचक और सामूहिक भाषा
  choice: मुख्य पाठ में ‘पुरुष से लेकर स्त्री तक’ और ‘ऐ के सभी लोग’
  alternative: ‘पुरुष से लेकर स्त्री तक’ और ‘ऐ के सभी पुरुष’
  rationale: पहला पद मूल की स्पष्ट लिंगसूचक व्यापकता को बनाए रखता है। अंतिम אַנְשֵׁי הָעָי को शाब्दिक रूप से ‘ऐ के सभी पुरुष’ कहना पूर्ववर्ती स्त्रियों के समावेश के साथ हिन्दी में अनावश्यक विरोध पैदा करता; इसलिए उसे सामूहिक अर्थ में रखा गया और शाब्दिक रूप पादटिप्पणी में दर्ज किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। युद्ध-संदर्भ में ‘मारे गए’ अर्थ को स्पष्ट करता है; ‘ऐ’ स्थाननाम के प्रचलित हिन्दी बाइबलीय रूप के अनुरूप है।
