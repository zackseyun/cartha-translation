  edition: WLC
  text: וַ/יִּכְתָּב שָׁ֖ם עַל הָ/אֲבָנִ֑ים אֵ֗ת מִשְׁנֵה֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁ֣ר כָּתַ֔ב לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/032.yaml
  text: And there[a], on the stones, he wrote a copy of the law of Moses[b], which he had written before the sons of Israel.
translation:
  language: hi
  text: और वहाँ उसने पत्थरों पर मूसा की व्यवस्था की एक प्रति[a] लिखी, जिसे मूसा ने इस्राएल के पुत्रों के सामने[b] लिखी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मूसा की व्यवस्था की पुनरावृत्ति” अथवा “मूसा की व्यवस्था की दूसरी प्रति।” हिब्रू शब्द किसी प्रति या दोहराए गए रूप का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “इस्राएल के पुत्रों की उपस्थिति में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתָּב
  choice: उसने ... लिखी
  rationale: כתב का सामान्य अर्थ ‘लिखना’ है। पत्थरों पर लिखने के कारण ‘अंकित किया’ संभव है, पर मूल क्रिया स्वयं सामान्य लेखन-क्रिया को व्यक्त करती है।
- source_word: שָׁם עַל הָאֲבָנִים
  choice: वहाँ उन पत्थरों पर
  rationale: स्थानवाचक שָׁם को ‘वहाँ’ और लेखन की सतह बताने वाले עַל को ‘पर’ से स्वाभाविक रूप में व्यक्त किया गया है। निश्चित पद הָאֲבָנִים के लिए ‘उन पत्थरों’ रखा गया है।
- source_word: מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: मूसा की व्यवस्था की एक प्रति
  rationale: מִשְׁנֵה यहाँ प्रति, प्रतिलिपि या पुनरावृत्त रूप का बोध करा सकता है। पत्थरों पर लिखने के संदर्भ में ‘एक प्रति’ सर्वाधिक स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: תּוֹרַת מֹשֶׁה
  choice: मूसा की व्यवस्था
  rationale: תּוֹרָה का अर्थ ‘शिक्षा’ भी हो सकता है, पर इस वाचा-संबंधी विधिक प्रसंग और प्रचलित पदबंध में ‘व्यवस्था’ स्पष्ट तथा परिचित है।
- source_word: אֲשֶׁר כָּתַב
  choice: जिसे उसने ... लिखा था
  rationale: संबंधवाचक उपवाक्य में लिखने वाला स्वाभाविक रूप से मूसा समझा जाता है; ‘लिखा था’ मुख्य घटना से पूर्व की क्रिया दर्शाता है।
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के सामने
  rationale: לִפְנֵי यहाँ सार्वजनिक उपस्थिति में किए गए कार्य का बोध देता है। ‘सामने’ संक्षिप्त और स्वाभाविक है; ‘उपस्थिति में’ पादटिप्पणी में दिया गया है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह रूप हिब्रू के पुल्लिंग बहुवचन पदबंध को औपचारिक रूप से सुरक्षित रखता है।
theological_decisions:
- issue: מִשְׁנֵה תּוֹרַת מֹשֶׁה का विस्तार
  choice: ‘मूसा की व्यवस्था की एक प्रति’ कहा गया है, पर यह निर्धारित नहीं किया गया कि पूरी तोराह लिखी गई थी या उसका कोई विधिक भाग।
  alternative: ‘मूसा की व्यवस्था की पुनरावृत्ति’ या ‘मूसा की व्यवस्था की दूसरी प्रति’।
  rationale: पद स्वयं लिखी गई सामग्री की सीमा स्पष्ट नहीं करता; इसलिए अनुवाद किसी सामंजस्यकारी या संकुचित व्याख्या को पाठ में नहीं जोड़ता।
- issue: אֲשֶׁר כָּתַב में कर्ता की पहचान
  choice: ‘उसने’ को मूसा के संदर्भ में रखा गया है।
  alternative: व्याकरणतः निकटवर्ती मुख्य कर्ता यहोशू से जोड़कर समझना।
  rationale: ‘मूसा की व्यवस्था, जिसे उसने लिखा था’ का स्वाभाविक संदर्भ मूसा के पूर्व लेखन की ओर है; फिर भी हिंदी में मूल की सर्वनामिक संक्षिप्तता बनाए रखी गई है, नाम दोहराकर अर्थ को अत्यधिक स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। ‘व्यवस्था’ और ‘इस्राएल के पुत्र’ जैसे पद मूल की वाचा-संबंधी तथा औपचारिक बनावट को दर्शाते हैं। मुख्य पाठ के दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
