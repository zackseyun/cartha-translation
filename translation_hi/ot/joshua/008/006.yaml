  text: וְ/יָצְא֣וּ אַחֲרֵ֗י/נוּ עַ֣ד הַתִּיקֵ֤/נוּ אוֹתָ/ם֙ מִן הָ/עִ֔יר כִּ֣י יֹֽאמְר֔וּ נָסִ֣ים לְ/פָנֵ֔י/נוּ כַּ/אֲשֶׁ֖ר בָּ/רִֽאשֹׁנָ֑ה וְ/נַ֖סְנוּ לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/006.yaml
  text: And they will come out after us until we have drawn them away from the city[a], for they will say[b], ‘They are fleeing before us as at the first,’ and we will flee before them.
translation:
  language: hi
  text: और वे हमारा पीछा करते हुए बाहर निकल आएँगे, जब तक कि हम उन्हें नगर से दूर न खींच लें[a], क्योंकि वे कहेंगे[b], ‘वे पहले की तरह हमारे सामने से भाग रहे हैं।’ और हम उनके सामने से भागेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक व्याख्यात्मक रूप में, “जब तक कि हम उन्हें नगर से दूर फुसलाकर न ले आएँ।” इब्रानी क्रिया का अर्थ दूर खींचना या अलग करना है; “फुसलाकर” इस युद्ध-युक्ति को अधिक स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: “पहले की तरह” ऐ के सामने इस्राएल के पहले पीछे हटने की ओर संकेत करता है (देखें यहोशू 7:4–5)।
    reason: cross_reference
lexical_decisions:
- source_word: וְיָצְאוּ אַחֲרֵינוּ
  choice: तब वे हमारे पीछे निकल आएँगे
  rationale: योजना के प्रसंग में क्रिया भावी कार्रवाई बताती है। ‘पीछे निकल आएँगे’ नगर से बाहर आकर पीछा करने का सैनिक भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַד הַתִּיקֵנוּ אוֹתָם מִן הָעִיר
  choice: जब तक कि हम उन्हें नगर से दूर न खींच लाएँ
  rationale: הַתִּיקֵנוּ, נתק के हिफ़इल रूप में, अलग या दूर खींचने का अर्थ देता है। यह अनुवाद युक्ति को व्यक्त करता है, पर ‘लुभाकर’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
- source_word: כִּי יֹאמְרוּ
  choice: क्योंकि वे कहेंगे
  rationale: כִּי यहाँ उस कारण को प्रस्तुत करता है जिसके चलते शत्रु पीछा करता रहेगा।
- source_word: נָסִים לְפָנֵינוּ
  choice: वे ... हमारे सामने से भाग रहे हैं
  rationale: नूस का कृदन्त जारी क्रिया दर्शाता है; ‘भाग रहे हैं’ उस पक्ष को बनाए रखता है। ‘सामने से’ युद्ध में शत्रु के आगे से पीछे हटने का स्वाभाविक हिन्दी प्रयोग है।
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: पहले की तरह
  rationale: यह ऐ के सामने इस्राएल की पिछली पराजय और पीछे हटने की ओर संकेत करता है; आधुनिक हिन्दी में यह संक्षिप्त और स्पष्ट है।
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: और हम उनके सामने से भागेंगे
  rationale: योजनाबद्ध भावी कार्रवाई को भविष्यकाल में रखा गया है और पहले कथन के समानांतर ‘सामने से भागेंगे’ प्रयुक्त हुआ है।
