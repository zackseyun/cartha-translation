  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। सैनिक प्रसंग के लिए ‘पीछे निकल आएँगे’, ‘दूर खींच लाएँ’ और ‘सामने से भागेंगे’ जैसे सामान्य किंतु सटीक पद चुने गए हैं। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
