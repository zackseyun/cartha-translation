base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/029.yaml
  text: And he hanged the king of Ai on a tree until evening[a]. And at sunset Joshua commanded, and they took his corpse down from the tree and threw it at the entrance of the city gate[b], and they raised over him a large heap of stones that remains to this day.
translation:
  language: hi
  text: उसने ऐ के राजा को एक पेड़ पर साँझ तक लटका दिया[a]। सूर्य अस्त होने पर यहोशू ने आज्ञा दी, और उन्होंने उसकी लाश पेड़ से उतारकर नगर के फाटक के प्रवेश पर फेंक दी। फिर उन्होंने उसके ऊपर पत्थरों का एक बड़ा ढेर लगा दिया, जो आज तक बना हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “टाँग दिया”; इब्रानी क्रिया का अर्थ लटकाना या टाँगना है और वह यहाँ मृत्यु का ठीक तरीका स्पष्ट नहीं करती।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּלָה
  choice: लटका दिया
  rationale: क्रिया का मूल अर्थ किसी को लटकाना या टाँगना है। यह अनुवाद इब्रानी की क्रिया को व्यक्त करता है और मृत्यु के ठीक तरीके को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הָעֵץ
  choice: एक पेड़
  rationale: עֵץ का सामान्य अर्थ ‘पेड़’ है; प्रसंग में लकड़ी का ढाँचा भी अभिप्रेत हो सकता है, पर ‘पेड़’ मूल शब्द का सीधा और स्वाभाविक रूप है।
- source_word: עַד עֵת הָעָרֶב
  choice: साँझ तक
  rationale: यह इब्रानी समय-सूचक पदबंध का स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: सूर्य अस्त होने पर
  rationale: इब्रानी मुहावरा सूर्य के डूबने को सूचित करता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: נִבְלָתוֹ
  choice: उसकी लाश
  rationale: נְבֵלָה मृत देह को दर्शाता है। ‘लाश’ मूल की कठोरता बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: नगर के फाटक के मुहाने पर
  rationale: यह फाटक के प्रवेश या खुलने के स्थान को सहज हिन्दी में व्यक्त करता है।
- source_word: גַּל אֲבָנִים גָּדוֹל
  choice: पत्थरों का एक बड़ा ढेर
  rationale: यह גַּל का स्पष्ट, सामान्य और प्रसंगानुकूल अनुवाद है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज के दिन तक वहीं है
  rationale: इब्रानी सूत्र की निरंतरता को स्पष्ट करने के लिए हिन्दी में आवश्यक क्रिया और स्थानवाचक संकेत जोड़ा गया है।
theological_decisions:
- issue: आरम्भिक उपवाक्य का कर्ता
  choice: ‘उसने’—संदर्भ के अनुसार यहोशू
  alternative: ‘उन्होंने’ या ‘लोगों ने’
  rationale: इब्रानी क्रिया तीसरे पुरुष एकवचन पुल्लिंग में है और अगले उपवाक्य में यहोशू स्पष्ट रूप से कर्ता है; इसलिए एकवचन कर्ता रखा गया, पर नाम को मूल से पहले स्पष्ट रूप से नहीं जोड़ा गया।
- issue: राजा की मृत्यु और लटकाए जाने का क्रम या तरीका
  choice: ‘लटका दिया’
  alternative: ‘फाँसी दे दी’ या ‘सूली पर चढ़ा दिया’
  rationale: मूल क्रिया केवल लटकाने को निश्चित करती है; वह स्वयं यह स्पष्ट नहीं करती कि लटकाना मृत्यु का साधन था या मृत्यु के बाद देह का प्रदर्शन।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘साँझ’, ‘लाश’ और ‘मुहाना’ मूल की कथात्मक संक्षिप्तता तथा कठोरता बनाए रखते हैं।
