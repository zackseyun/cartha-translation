  text: וַ/אֲנִ֗י וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתִּ֔/י נִקְרַ֖ב אֶל הָ/עִ֑יר וְ/הָיָ֗ה כִּֽי יֵצְא֤וּ לִ/קְרָאתֵ֨/נוּ֙ כַּ/אֲשֶׁ֣ר בָּ/רִֽאשֹׁנָ֔ה וְ/נַ֖סְנוּ לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/005.yaml
  text: And I and all the people who are with me will approach the city[a]. And when they come out to meet us, as before[b], we will flee before them.
translation:
  language: hi
  text: और मैं तथा मेरे साथ के सब लोग नगर के पास जाएँगे[a]। जब वे पहले की तरह[b] हमारा सामना करने बाहर निकलेंगे, तब हम उनके सामने से भागेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नगर के निकट आएँगे।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘जैसा पहले अवसर पर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרַב
  choice: नगर के पास जाएँगे
  rationale: क्रב का क़ाल अपूर्ण, प्रथम पुरुष बहुवचन रूप यहाँ योजनाबद्ध भावी क्रिया व्यक्त करता है। यह अनुवाद नगर की ओर बढ़ने का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: הָעָם
  choice: सब लोग
  rationale: עם साथ चलने वाले पूरे समूह को सूचित करता है; ‘लोग’ मूल शब्द की व्यापकता बनाए रखता है और उसे केवल सैनिकों या पुरुषों तक सीमित नहीं करता।
- source_word: אֲשֶׁר אִתִּי
  choice: मेरे साथ के
  rationale: यह स्वाभाविक और संक्षिप्त हिन्दी में यहोशू के साथ उपस्थित समूह की पहचान कराता है।
- source_word: וְהָיָה כִּי
  choice: जब … तब
  rationale: सामान्य इब्रानी कालवाचक रचना को आधुनिक हिन्दी के स्वाभाविक ‘जब…तब’ क्रम में व्यक्त किया गया है।
- source_word: יֵצְאוּ לִקְרָאתֵנוּ
  choice: हमारा सामना करने बाहर निकलेंगे
  rationale: יצא + לקראת का अर्थ सामने मिलने के लिए बाहर आना है। युद्ध-संदर्भ में ‘सामना करने’ उद्देश्य को स्पष्ट करता है, पर आक्रमण जैसी अतिरिक्त धारणा नहीं जोड़ता।
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: पहले की तरह
  rationale: यह वाक्यांश ऐ के साथ हुई पिछली मुठभेड़ की ओर संकेत करता है; चयन संक्षिप्त और आधुनिक हिन्दी में सहज है।
- source_word: וְנַסְנוּ
  choice: हम … भागेंगे
  rationale: נוס का मूल भाव भागना है। योजनाबद्ध छलपूर्ण वापसी के बावजूद ‘पीछे हटेंगे’ कहने से इसकी शब्दार्थगत शक्ति कम हो जाती।
- source_word: לִפְנֵיהֶם
  choice: उनके सामने से
  rationale: נוס के साथ यह पदबंध उनके सामने से दूर भागने का भाव देता है; हिन्दी में ‘सामने से’ इस गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַאֲנִי וְכָל הָעָם
  choice: और मैं तथा … सब लोग
  rationale: आरम्भिक वाव पिछले निर्देश से संबंध बनाए रखता है। ‘तथा’ संयुक्त कर्ता को गरिमापूर्ण और स्पष्ट हिन्दी में जोड़ता है।
