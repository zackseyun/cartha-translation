base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/009.yaml
  text: So Joshua sent them[a], and they went to the ambush and stayed between Bethel and Ai, west of Ai. And Joshua spent that night among the people.
translation:
  language: hi
  text: यहोशू ने उन्हें भेजा, और वे घात लगाने की जगह[a] गए और बेतेल और ऐ के बीच, ऐ के पश्चिम में, ठहरे। और उस रात यहोशू लोगों के बीच ठहरा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घात लगाने वाला दल।” इब्रानी शब्द घात लगाने वाले दल या घात की जगह, दोनों को सूचित कर सकता है; यहाँ प्रसंग स्थान के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: उसने उन्हें भेजा
  rationale: שׁלח का यहाँ सीधा अर्थ किसी को जाने के लिए भेजना है; आधुनिक हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: הַמַּאְרָב
  choice: घात लगाने की जगह
  rationale: संज्ञा घात लगाए हुए दल या घात की स्थिति/स्थान, दोनों का संकेत दे सकती है। यहाँ जाने और फिर वहाँ ठहरने का संदर्भ स्थानगत अर्थ का समर्थन करता है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וַיֵּשְׁבוּ
  choice: ठहरे
  rationale: ישׁב का मूल अर्थ बैठना, बसना या बने रहना हो सकता है। सैन्य प्रसंग में ‘ठहरे’ उनके उस स्थान पर बने रहने को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘मोर्चा संभाला’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: בֵּין בֵּית־אֵל וּבֵין הָעַי
  choice: बेतेल और ऐ के बीच
  rationale: यह सीधा भौगोलिक विवरण है; स्थान-नामों के प्रचलित हिन्दी लिप्यंतरण रखे गए हैं।
- source_word: מִיָּם לָעָי
  choice: ऐ के पश्चिम में
  rationale: יָם का शाब्दिक अर्थ ‘समुद्र’ है, पर भौगोलिक दिशा के मुहावरे में यह पश्चिम को दर्शाता है।
- source_word: וַיָּלֶן
  choice: रहा
  rationale: לוּן रात बिताने या रात भर ठहरने को व्यक्त करता है। ‘उस रात ... रहा’ हिन्दी में समय और ठहराव दोनों को स्पष्ट करता है।
- source_word: בְּתוֹךְ הָעָם
  choice: लोगों के बीच
  rationale: यह किसी समुदाय के मध्य उपस्थित रहने का स्वाभाविक आधुनिक हिन्दी रूप है।
