  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִשְׂרָאֵ֡ל לַ/הֲרֹג֩ אֶת כָּל יֹשְׁבֵ֨י הָ/עַ֜י בַּ/שָּׂדֶ֗ה בַּ/מִּדְבָּר֙ אֲשֶׁ֣ר רְדָפ֣וּ/ם בּ֔/וֹ וַֽ/יִּפְּל֥וּ כֻלָּ֛/ם לְ/פִי חֶ֖רֶב עַד תֻּמָּ֑/ם וַ/יָּשֻׁ֤בוּ כָל יִשְׂרָאֵל֙ הָ/עַ֔י וַ/יַּכּ֥וּ אֹתָ֖/הּ לְ/פִי חָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/024.yaml
  text: And it happened that when Israel had finished killing all the inhabitants of Ai in the field[a], in the wilderness where they had pursued them, and all of them had fallen by the edge of the sword until they were finished off, then all Israel returned to Ai and struck it with the edge of the sword.
translation:
  language: hi
  text: ऐसा हुआ कि जब इस्राएल ने ऐ के सभी निवासियों को उस मैदान में, उस निर्जन प्रदेश में जहाँ उन्होंने उनका पीछा किया था, मार डालने का काम पूरा कर लिया, और वे सब तलवार की धार से गिर पड़े, यहाँ तक कि उनका अंत हो गया, तब समस्त इस्राएल ऐ नगर में लौट आया और उस पर तलवार की धार से प्रहार किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: जब ... ने ... मार डाला
  rationale: यह इब्रानी कालसूचक रचना पहले कार्य के पूरा होने और उसके बाद नगर लौटने का क्रम बताती है। हिन्दी में ‘जब ... मार डाला’ इसे स्वाभाविक ढंग से व्यक्त करता है; अलग से ‘और ऐसा हुआ’ जोड़ना बोझिल होता।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यहाँ सामूहिक रूप से इस्राएली सेना/जन का उल्लेख है; मूल पाठ की सामूहिक संज्ञा बनाए रखी गई है।
- source_word: יֹשְׁבֵי הָעַי
  choice: ऐ के ... सभी निवासी
  rationale: ישׁב का कृदन्त संज्ञा के रूप में नगर में रहने वालों को सूचित करता है।
- source_word: בַּשָּׂדֶה בַּמִּדְבָּר
  choice: खुले मैदान में, उस निर्जन प्रदेश में
  rationale: שדה नगर के विपरीत खुले मैदान को और מדבר निर्जन/अनुपजाऊ खुले भूभाग को दर्शाता है; ‘निर्जन प्रदेश’ रेतीले मरुस्थल का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: אֲשֶׁר רְדָפוּם בּוֹ
  choice: जहाँ उन्होंने उनका पीछा किया था
  rationale: सम्बन्धवाचक उपवाक्य पीछा किए जाने के स्थान को बताता है और ‘किया था’ पूर्ववर्ती घटना-क्रम स्पष्ट करता है।
- source_word: וַיִּפְּלוּ כֻלָּם לְפִי חֶרֶב
  choice: वे सब तलवार की धार से मारे गए
  rationale: युद्ध-सन्दर्भ में ‘गिरना’ मृत्यु का मुहावरा है। हिन्दी में ‘मारे गए’ अर्थ स्पष्ट करता है, जबकि ‘तलवार की धार से’ इब्रानी मुहावरे की सजीवता बनाए रखता है।
- source_word: עַד תֻּמָּם
  choice: यहाँ तक कि उनका पूरी तरह अन्त हो गया
  rationale: यह पद पूर्ण समाप्ति पर बल देता है। चयन मूल की पूर्णता-सूचक बारीकी और कठोरता रखता है, पर बोलचाल के ‘काम तमाम’ जैसे अनुपयुक्त मुहावरे से बचता है।
- source_word: וַיָּשֻׁבוּ כָל יִשְׂרָאֵל הָעַי
  choice: तब समस्त इस्राएल ऐ को लौट आया
  rationale: שוב गन्तव्य के साथ लौटने का भाव देता है। ‘तब’ घटनाओं का क्रम स्पष्ट करता है और सामूहिक ‘इस्राएल’ के साथ एकवचन क्रिया स्वाभाविक है।
- source_word: וַיַּכּוּ אֹתָהּ לְפִי חָרֶב
  choice: और उसे तलवार की धार से मारा
  rationale: स्त्रीलिंग एकवचन कर्म नगर ऐ की ओर संकेत करता है। ‘उसे’ मूल की व्याकरणिक अस्पष्टता को बनाए रखता है और ‘उसके लोगों’ जैसा विस्तार नहीं जोड़ता।
theological_decisions:
- issue: युद्ध और पूर्ण विनाश की भाषा
  choice: हत्या और सम्पूर्ण अन्त को स्पष्ट, असंशोधित भाषा में रखा गया
  alternative: ‘हरा दिया’ या ‘पराजित किया’ जैसे नरम शब्द प्रयोग करना, अथवा इसे स्पष्ट रूप से ईश्वरीय न्याय कहना
  rationale: पद सैन्य वध को सीधे बयान करता है। अनुवाद को न इसकी कठोरता घटानी चाहिए, न इस पद में अनुपस्थित धार्मिक व्याख्या जोड़नी चाहिए।
- issue: नगर को तलवार से मारने का आशय
  choice: ‘उसे तलवार की धार से मारा’
  alternative: ‘उसके निवासियों को मार डाला’
  rationale: मूल में स्त्रीलिंग सर्वनाम नगर की ओर लौटता है और निवासियों को इस दूसरे खण्ड में स्पष्ट नहीं करता; इसलिए सम्भावित लक्षणा को व्याख्यात्मक विस्तार द्वारा निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण कथात्मक गद्य। ‘खुला मैदान’ नगर के बाहर के भूभाग का विरोध स्पष्ट करता है; ‘निर्जन प्रदेश’ מדבר को अनिवार्यतः रेतीला ‘रेगिस्तान’ मानने से बचाता है। हिंसा को न नरम किया गया है, न अतिरिक्त धार्मिक औचित्य जोड़ा गया है।
