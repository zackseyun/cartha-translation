revisions:
- from: जब इस्राएल ने ऐ के उन सभी निवासियों को मार डाला जो खुले मैदान में, उस निर्जन प्रदेश में थे जहाँ उन्होंने उनका पीछा किया था, और वे सब तलवार की धार से मारे गए, यहाँ तक कि उनका पूरी तरह अन्त हो गया,[a] तब समस्त इस्राएल ऐ को लौट आया और उसे तलवार की धार से मारा।
  to: ऐसा हुआ कि जब इस्राएल ने ऐ के सभी निवासियों को उस मैदान में, उस निर्जन प्रदेश में जहाँ उन्होंने उनका पीछा किया था, मार डालने का काम पूरा कर लिया, और वे सब तलवार की धार से गिर पड़े, यहाँ तक कि उनका अंत हो गया, तब समस्त इस्राएल ऐ नगर में लौट आया और उस पर तलवार की धार से प्रहार किया।
  rationale: The revision more clearly assigns the field and wilderness to the setting of the killing and pursuit, restores the Hebrew narrative transition in natural Hindi, and replaces two strained Hindi expressions. It neither softens the violence nor adds a theological explanation. The final feminine singular reference remains directed to Ai as a city, as in the Hebrew.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:58:02Z'
review_pass:
  verdict: revise
  source_fidelity: The draft generally reflects the sequence and the stark military language of the Hebrew. However, its opening relative clause (“निवासियों ... जो ... थे”) makes the field/wilderness describe the inhabitants rather than unambiguously locating the killing and pursuit. The narrative introducer וַיְהִי is also omitted without a compelling need. The revision restores both features while retaining the source’s city-object pronoun at the end.
  naturalness: 'Several expressions are understandable but less idiomatic in modern formal Hindi: “उनका पूरी तरह अन्त हो गया” is awkward, and “ऐ को लौट आया” is less natural than returning “ऐ नगर में.” “उस पर तलवार की धार से प्रहार किया” is natural Hindi while preserving the Hebrew’s feminine singular reference to the city.'
  terminology: “इस्राएल,” “ऐ,” “निवासी,” “निर्जन प्रदेश,” and “तलवार की धार” are suitable. “समस्त इस्राएल” appropriately represents the collective subject.
  issues:
  - severity: medium
    issue: Location phrase is attached to the inhabitants
    rationale: In “ऐ के उन सभी निवासियों को ... जो खुले मैदान में, उस निर्जन प्रदेश में थे,” the relative clause presents the people as being residents located in the field/wilderness. Hebrew locates the killing and the pursuit there. Recasting the clause places these phrases with the action.
  - severity: low
    issue: Narrative introducer omitted
    rationale: וַיְהִי introduces the temporal clause. Modern Hindi can render it naturally as “ऐसा हुआ कि,” without archaizing the narration.
  - severity: medium
    issue: Awkward completion expression and city-object verb
    rationale: “उनका पूरी तरह अन्त हो गया” is not idiomatic in this context. Further, “नगर को ... मारा” is semantically strained in Hindi. The revised wording preserves the totalizing phrase and the city as the object without adding an explicit reference to its inhabitants.
  revised_text: ऐसा हुआ कि जब इस्राएल ने ऐ के सभी निवासियों को उस मैदान में, उस निर्जन प्रदेश में जहाँ उन्होंने उनका पीछा किया था, मार डालने का काम पूरा कर लिया, और वे सब तलवार की धार से गिर पड़े, यहाँ तक कि उनका अंत हो गया, तब समस्त इस्राएल ऐ नगर में लौट आया और उस पर तलवार की धार से प्रहार किया।
  revised_footnotes:
  - marker: a
    text: या, “यहाँ तक कि वे पूरी तरह समाप्त हो गए” या “यहाँ तक कि वे नष्ट हो गए।”
