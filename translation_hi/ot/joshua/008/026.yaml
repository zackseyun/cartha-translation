reference: Joshua 8:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֨עַ֙ לֹֽא הֵשִׁ֣יב יָד֔/וֹ אֲשֶׁ֥ר נָטָ֖ה בַּ/כִּיד֑וֹן עַ֚ד אֲשֶׁ֣ר הֶחֱרִ֔ים אֵ֖ת כָּל יֹשְׁבֵ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/026.yaml
  text: And Joshua did not draw back his hand[a], which he had stretched out with the javelin, until he had devoted all the inhabitants of Ai to destruction.
translation:
  language: hi
  text: और यहोशू ने अपना वह हाथ, जिसे उसने भाला लिए आगे बढ़ाया था, तब तक वापस नहीं खींचा, जब तक उसने ऐ के सभी निवासियों को विनाश के लिए समर्पित[a] नहीं कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरी तरह नष्ट कर दिया।” इब्रानी में ऐसी क्रिया है जिसका संबंध किसी को प्रतिबंध के अधीन करने, अर्थात विनाश के लिए समर्पित करने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: वापस नहीं खींचा
  rationale: हिफ़ील रूप का मूल अर्थ ‘वापस लाना’ है; युद्ध के इस प्रसंग में हाथ के साथ ‘वापस खींचना’ स्वाभाविक हिन्दी है और बताता है कि यहोशू ने हाथ बढ़ाए रखा।
- source_word: יָדוֹ
  choice: अपना वह हाथ
  rationale: शरीर के अंग का सीधा उल्लेख रखा गया है; ‘वह’ आगे आने वाले संबंधवाचक उपवाक्य से इसे सहज रूप से जोड़ता है।
- source_word: נָטָה
  choice: आगे बढ़ाया था
  rationale: क्रिया हाथ को फैलाने या आगे बढ़ाने का भाव देती है; पूर्णभूत रूप पहले से बढ़ाए हुए हाथ को दर्शाता है।
- source_word: בַּכִּידוֹן
  choice: भाला लिए
  rationale: כידון भाले या बरछे जैसा हथियार है। ‘भाला’ सामान्य आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है, जबकि हथियार की अधिक विशिष्ट पहचान अनिश्चित है।
- source_word: הֶחֱרִים
  choice: विनाश के लिए समर्पित
  rationale: यह חרם का तकनीकी भाव बनाए रखता है—किसी व्यक्ति या वस्तु को प्रतिबंध के अधीन करके विनाश के लिए ठहराना—और इसे केवल सामान्य सैन्य हत्या के अर्थ तक सीमित नहीं करता।
- source_word: כָּל יֹשְׁבֵי הָעָי
  choice: ऐ के सभी निवासियों
  rationale: यह मूल के ‘ऐ में रहने वाले सभी लोगों’ का संक्षिप्त, स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: וִיהוֹשֻׁעַ
  choice: और यहोशू
  rationale: संयोजक को बनाए रखते हुए नाम का प्रचलित हिन्दी बाइबलीय रूप लिया गया है।
theological_decisions:
- issue: युद्ध और न्याय के प्रसंग में חרם का अनुवाद
  choice: विनाश के लिए समर्पित
  alternative: पूरी तरह नष्ट कर दिया
  rationale: चुना हुआ रूप इस क्रिया के धार्मिक-विधिक और न्याय-संबंधी तनाव को सुरक्षित रखता है, बिना मुख्य पाठ में अतिरिक्त व्याख्या जोड़ने या इसे केवल सामान्य विनाश बना देने के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। वाक्य की लंबी कालगत संरचना मूल इब्रानी के ‘तब तक…जब तक’ संबंध को स्पष्ट रूप से बनाए रखती है।
