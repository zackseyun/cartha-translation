  text: וְ/כָל הָ/עָ֨ם הַ/מִּלְחָמָ֜ה אֲשֶׁ֣ר אִתּ֗/וֹ עָלוּ֙ וַֽ/יִּגְּשׁ֔וּ וַ/יָּבֹ֖אוּ נֶ֣גֶד הָ/עִ֑יר וַֽ/יַּחֲנוּ֙ מִ/צְּפ֣וֹן לָ/עַ֔י וְ/הַ/גַּ֖י בינ/ו וּ/בֵין הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/011.yaml
  text: And all the fighting people who were with him went up and approached[a], and they came before the city and camped north of Ai, with the valley between him and Ai.
translation:
  language: hi
  text: और उसके साथ के सभी योद्धा ऊपर चढ़े और निकट आए। वे नगर के सामने पहुँचे और ऐ के उत्तर में छावनी डाली; उसके और ऐ के बीच घाटी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “उसके और ऐ के बीच।” एकवचन सर्वनाम सम्भवतः यहोशू की ओर संकेत करता है, हालाँकि कुछ लोग इसका सामूहिक अर्थ “उनके और ऐ के बीच” समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם הַמִּלְחָמָה
  choice: सभी योद्धा
  rationale: यह पदबंध युद्ध में भाग लेने वाले पूरे समुदाय को दर्शाता है। ‘सभी योद्धा’ स्वाभाविक आधुनिक हिन्दी है और इब्रानी עָם में निहित सामूहिक अर्थ को अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं करता।
- source_word: אֲשֶׁר אִתּוֹ
  choice: उसके साथ के
  rationale: यह यहोशू के साथ चल रहे योद्धाओं की पहचान कराने वाला स्वाभाविक और संक्षिप्त हिन्दी प्रयोग है।
- source_word: עָלוּ
  choice: ऊपर चढ़े
  rationale: עלה का मूल दिशात्मक अर्थ ‘ऊपर जाना/चढ़ना’ सुरक्षित रखा गया है; इसे केवल ‘कूच किया’ बनाकर भौगोलिक संकेत नहीं मिटाया गया।
- source_word: וַיִּגְּשׁוּ
  choice: निकट आए
  rationale: נגשׁ के पास आने के अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: וַיָּבֹאוּ נֶגֶד הָעִיר
  choice: नगर के सामने पहुँचे
  rationale: נֶגֶד यहाँ नगर में प्रवेश नहीं, बल्कि उसके सामने या सम्मुख पहुँचने की स्थिति बताता है।
- source_word: וַיַּחֲנוּ
  choice: छावनी डाली
  rationale: सैन्य प्रसंग में חנה के लिए यह स्वाभाविक आधुनिक हिन्दी है।
- source_word: מִצְּפוֹן לָעַי
  choice: ऐ के उत्तर में
  rationale: ऐ के सापेक्ष छावनी का स्थान सीधी और स्पष्ट हिन्दी में बताया गया है।
- source_word: הַגַּי
  choice: घाटी
  rationale: גַּי का व्यापक और सामान्य अर्थ ‘घाटी’ है; प्रसंग किसी अधिक विशिष्ट ‘खड्ड’ या ‘दर्रे’ की माँग नहीं करता।
- source_word: בֵּינוֹ וּבֵין הָעָי
  choice: उसके और ऐ के बीच
  rationale: व्यंजन-पाठ में एकवचन पुल्लिंग प्रत्यय है। कठिन एकवचन को मुख्य पाठ में सुरक्षित रखा गया है, यद्यपि सामूहिक आशय सम्भव है।
