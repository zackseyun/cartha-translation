  text: רַ֣ק הַ/בְּהֵמָ֗ה וּ/שְׁלַל֙ הָ/עִ֣יר הַ/הִ֔יא בָּזְז֥וּ לָ/הֶ֖ם יִשְׂרָאֵ֑ל כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה אֶת יְהוֹשֻֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/027.yaml
  text: Only the livestock and the spoil of that city Israel took as plunder for themselves[b][a], according to the word of Yahweh that he had commanded Joshua.
translation:
  language: hi
  text: केवल उस नगर के पशुधन और लूट का माल ही इस्राएल ने अपने लिए लिया, जैसा याहवे ने यहोशू को आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: परन्तु ... ही
  rationale: यह पिछले विनाश-वृत्तांत के विपरीत अपवाद और प्रतिबंध दोनों प्रकट करता है; हिन्दी में ‘परन्तु ... ही’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַבְּהֵמָה
  choice: पशुओं
  rationale: संदर्भ में युद्ध की लूट के रूप में लिए गए पालतू पशु अभिप्रेत हैं; ‘पशु’ सरल और व्यापक सामूहिक शब्द है।
- source_word: וּשְׁלַל הָעִיר הַהִיא
  choice: और उस नगर के ... लूट के माल को
  rationale: שׁלל युद्ध में प्राप्त वस्तुओं को दर्शाता है। ‘लूट का माल’ आधुनिक हिन्दी में इस सैनिक संदर्भ को स्पष्ट रखता है।
- source_word: בָּזְזוּ לָהֶם
  choice: अपने लिए ले लिया
  rationale: לָהֶם लाभ अथवा स्वामित्व का भाव देता है। वस्तु पहले ही ‘लूट का माल’ कही गई है, इसलिए ‘लूट को लूट लिया’ जैसी अस्वाभाविक पुनरुक्ति से बचते हुए पूरे वाक्य में लूटकर अपने अधिकार में करने का अर्थ सुरक्षित रखा गया है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यहाँ राष्ट्र को सामूहिक एकवचन के रूप में प्रस्तुत किया गया है; स्रोत की संरचना बनाए रखी गई है।
- source_word: כִּדְבַר יְהוָה
  choice: जैसा याहवे ने ... आज्ञा दी थी
  rationale: כִּדְבַר आज्ञा के अनुरूप किए गए कार्य को बताता है। हिन्दी में यह उपवाक्य स्रोत का आशय अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֲשֶׁר צִוָּה אֶת יְהוֹשֻׁעַ
  choice: जैसा ... यहोशू को आज्ञा दी थी
  rationale: आज्ञा इस वर्णित कार्य से पहले दी गई थी; ‘दी थी’ उस पूर्वकालिक संबंध को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि में बदले बिना सीधे प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परन्तु ... ही’ पिछले संदर्भ से विरोध और अपवाद को बनाए रखता है; ‘लूट के माल को ... अपने लिए ले लिया’ सैनिक लूट का अर्थ रखते हुए हिन्दी की अनावश्यक पुनरुक्ति से बचता है।
