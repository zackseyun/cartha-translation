  yaml_path: translation/ot/joshua/008/018.yaml
  text: Then Yahweh said to Joshua[a], “Stretch out the javelin that is in your hand toward Ai, for I will give it into your hand.” So Joshua stretched out the javelin that was in his hand toward the city.
translation:
  language: hi
  text: तब यहोवा ने यहोशू से कहा, “जो बरछा तुम्हारे हाथ में है, उसे ऐ की ओर बढ़ा दो[a], क्योंकि मैं उसे तुम्हारे हाथ में दे दूँगा।” तब यहोशू ने जो बरछा उसके हाथ में था, उसे नगर की ओर बढ़ा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाला” अथवा “साँग।” इब्रानी शब्द כִּידוֹן का सटीक हथियार-प्रकार निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचा-नाम को प्रचलित और स्पष्ट रूप में प्रस्तुत करता है; इसे उपाधि ‘प्रभु’ से नहीं बदलता।
- source_word: נְטֵה / וַיֵּט (נטה)
  choice: तान दो / तान दिया
  rationale: हथियार को किसी दिशा में बढ़ाकर स्थिर रखने की शारीरिक क्रिया व्यक्त करता है और आदेश तथा उसके पालन की समानांतरता बनाए रखता है।
- source_word: כִּידוֹן
  choice: बरछा
  rationale: यहाँ एक नुकीले दंडाकार हथियार का बोध होता है। ‘बरछा’ सहज आधुनिक हिन्दी में भाला/साँग जैसे संभावित अर्थ-क्षेत्र को पर्याप्त रूप से दर्शाता है; सटीक हथियार-प्रकार अनिश्चित है।
- source_word: אֲשֶׁר בְּיָדְךָ / אֲשֶׁר בְּיָדוֹ
  choice: जो ... तुम्हारे हाथ में है / अपने हाथ का
  rationale: पहले वाक्य में इब्रानी संबंधवाचक संरचना स्पष्ट रखी गई है; वर्णन में स्वाभाविक हिन्दी के लिए संक्षिप्त रूप अपनाया गया है।
- source_word: אֶל הָעַי / אֶל הָעִיר
  choice: ऐ की ओर / नगर की ओर
  rationale: אֶל की दिशात्मकता को ‘की ओर’ से व्यक्त किया गया है और मूल पाठ में स्थान-नाम से ‘नगर’ की ओर हुए बदलाव को सुरक्षित रखा गया है।
- source_word: כִּי בְיָדְךָ אֶתְּנֶנָּה
  choice: क्योंकि मैं उसे तुम्हारे हाथ में कर दूँगा
  rationale: विजय या अधिकार में सौंपने के इब्रानी मुहावरे को हिन्दी में जानबूझकर दृश्यात्मक रूप में बनाए रखता है। स्त्रीलिंग प्रत्यय का संदर्भ नगर से है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है, जबकि ‘याहवे’ अधिक निकट लिप्यंतरण माना जाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तान दो/तान दिया’ से आदेश और उसके तत्काल पालन का साहित्यिक समानांतर सुरक्षित है। ‘ऐ’ स्थान-नाम का प्रचलित हिन्दी रूप है।
