  yaml_path: translation/ot/joshua/008/020.yaml
  text: Then the men of Ai turned behind them and looked[a], and behold, the smoke of the city was going up to the sky, and there was no power in them to flee this way or that[c][b]. And the people who had fled to the wilderness turned back against the pursuer.
translation:
  language: hi
  text: तब आय के पुरुषों ने पीछे मुड़कर देखा, और क्या देखा कि नगर का धुआँ आकाश की ओर उठ रहा था। उनमें इधर या उधर भाग निकलने की सामर्थ्य न थी। और जो लोग वीराने की ओर भागे थे, वे पलटकर पीछा करने वालों के विरुद्ध मुड़ गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ ... אַחֲרֵיהֶם וַיִּרְאוּ
  choice: पीछे मुड़कर देखा
  rationale: यह दोनों क्रियाओं—पीछे की ओर मुड़ने और देखने—को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: אַנְשֵׁי הָעַי
  choice: ऐ के पुरुषों
  rationale: सैन्य प्रसंग में यह नगर के पुरुषों, विशेषकर लड़ने वालों, को सूचित करता है और मूल के निकट है।
- source_word: וְהִנֵּה
  choice: और क्या देखा कि
  rationale: हिन्दी कथा-शैली में अचानक दिखाई पड़ी बात पर ध्यान खींचने का स्वाभाविक और गरिमापूर्ण ढंग है।
- source_word: עָלָה עֲשַׁן הָעִיר הַשָּׁמַיְמָה
  choice: नगर का धुआँ आकाश की ओर उठ रहा था
  rationale: दिशासूचक रूप का अर्थ 'आकाश की ओर' है; इससे अनावश्यक पारलौकिक अर्थ जोड़े बिना ऊपर उठते धुएँ का दृश्य व्यक्त होता है।
- source_word: וְלֹא הָיָה בָהֶם יָדַיִם
  choice: उनमें ... भागने की सामर्थ्य थी
  rationale: शाब्दिक इब्रानी मुहावरा 'उनमें हाथ नहीं थे' यहाँ कार्य करने या बच निकलने की क्षमता न होने का अर्थ देता है; हिन्दी में 'सामर्थ्य' वही भाव स्पष्ट करता है।
- source_word: לָנוּס הֵנָּה וָהֵנָּה
  choice: न तो इधर भागने की ... न उधर
  rationale: युग्मित दिशासूचक क्रियाविशेषणों को सहज हिन्दी में रखकर हर ओर से पलायन असंभव होने का भाव व्यक्त किया गया है।
- source_word: וְהָעָם הַנָּס הַמִּדְבָּר
  choice: जो लोग वीराने की ओर भागे थे
  rationale: संज्ञीकृत कृदंत उस समूह को उसके पहले से चल रहे पलायन द्वारा पहचानता है; 'भागे थे' घटनाक्रम को स्पष्ट करता है।
- source_word: נֶהְפַּךְ אֶל הָרֹדֵף
  choice: पलटकर पीछा करने वालों पर टूट पड़े
  rationale: युद्ध-संदर्भ में केवल दिशा बदलना नहीं, बल्कि पीछा करती सेना के विरुद्ध आक्रमण करना अभिप्रेत है। मूल का एकवचन कृदंत सामूहिक अर्थ में लिया गया है।
