  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथात्मक शैली। 'वीराना' युद्धस्थल के बाहर के निर्जन क्षेत्र के लिए सामान्य पाठक को समझ आने वाला शब्द है। इब्रानी मुहावरे का अर्थ मुख्य पाठ में स्पष्ट किया गया है, इसलिए अलग पादटिप्पणी आवश्यक नहीं।
