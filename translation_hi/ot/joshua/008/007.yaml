base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/007.yaml
  text: Then you shall rise up from the ambush and take the city[a], for Yahweh your God will give it into your hand.
translation:
  language: hi
  text: तब तुम घात की जगह से उठकर नगर पर अधिकार कर लेना[a], क्योंकि याहवे, तुम्हारा परमेश्वर, उसे तुम्हारे हाथ में कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नगर को जीत लेना।” इब्रानी क्रिया केवल सैन्य विजय ही नहीं, किसी वस्तु या स्थान को अपने अधिकार में लेने का अर्थ भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקֻמוּ
  choice: उठकर
  rationale: קום का क़ाल अपूर्ण 2 बहुवचन यहाँ सैन्य निर्देशों के क्रम में है; यह छिपे हुए स्थान से सक्रिय रूप से उठने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵהָאוֹרֵב
  choice: घात की जगह से
  rationale: אֹרֵב घात लगाकर प्रतीक्षा करने की स्थिति या स्थान को दर्शाता है; हिन्दी में यह केवल अमूर्त ‘घात’ की अपेक्षा स्थानगत अर्थ अधिक स्पष्ट करता है।
- source_word: וְהוֹרַשְׁתֶּם
  choice: अधिकार कर लेना
  rationale: ירשׁ के हिफ़ील रूप में यहाँ नगर को अपने अधिकार में लेने का भाव है; यह सैन्य कब्ज़े और अधिकार-प्राप्ति दोनों को समेटता है।
- source_word: הָעִיר
  choice: नगर
  rationale: सप्रत्यय עִיר का सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: וּנְתָנָהּ
  choice: उसे ... कर देगा
  rationale: निर्देशात्मक क्रम के बाद संयोजक सहित पूर्ण क्रिया निश्चित भावी परिणाम व्यक्त करती है; ‘कर देगा’ प्रतिज्ञा की निश्चितता दिखाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: सम्बद्ध रूप और द्वितीय पुरुष बहुवचन प्रत्यय का सीधा अनुवाद।
- source_word: בְּיֶדְכֶם
  choice: तुम्हारे हाथ में
  rationale: इब्रानी मुहावरे को सुरक्षित रखा गया है; हिन्दी में भी यह अधिकार या वश में दिए जाने का बोध कराता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ सामान्य पाठक के लिए अधिक पहचाना हुआ लिप्यंतरण है और इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: וְהוֹרַשְׁתֶּם में अधिकार और सैन्य विजय का संबंध
  choice: नगर पर अधिकार कर लेना
  alternative: नगर को जीत लेना
  rationale: चुना हुआ रूप मूल धातु के अधिकार-प्राप्ति संबंधी बल को बनाए रखता है, जबकि प्रसंग स्वयं सैन्य विजय को स्पष्ट करता है; ‘जीत लेना’ अर्थ को केवल युद्ध की क्रिया तक सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और निर्देशात्मक सैन्य कथन। ‘घात की जगह’ स्थानगत अर्थ स्पष्ट करता है; ‘तुम’ बहुवचन संबोधन है।
