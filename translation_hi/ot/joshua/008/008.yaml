source:
  edition: WLC
  text: וְ/הָיָ֞ה כְּ/תָפְשְׂ/כֶ֣ם אֶת הָ/עִ֗יר תַּצִּ֤יתוּ אֶת הָ/עִיר֙ בָּ/אֵ֔שׁ כִּ/דְבַ֥ר יְהוָ֖ה תַּעֲשׂ֑וּ רְא֖וּ צִוִּ֥יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/008.yaml
  text: And when you have taken the city[a], you shall set the city on fire. According to the word of Yahweh, you shall do. See, I have commanded you.
translation:
  language: hi
  text: और जब तुम नगर पर अधिकार कर लो, तब नगर को आग लगा देना। याहवे के वचन[a] के अनुसार करना। देखो, मैंने तुम्हें आज्ञा दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की आज्ञा के अनुसार करना।” इब्रानी में शाब्दिक रूप से, “याहवे के वचन के अनुसार करना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּתָפְשְׂכֶם
  choice: और जब तुम ... पर अधिकार कर लो
  rationale: वाक्यांश आगामी कार्य के लिए काल-सूचक परिस्थिति बताता है। सैन्य प्रसंग में ‘पर अधिकार कर लो’ नगर को जीत लेने का स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: תַּצִּיתוּ אֶת־הָעִיר בָּאֵשׁ
  choice: नगर में आग लगा देना
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘आग लगाना’ है; यह आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल अर्थ को सुरक्षित रखता है।
- source_word: כִּדְבַר יְהוָה
  choice: याहवे के वचन के अनुसार
  rationale: דָּבָר का मूल अर्थ ‘वचन/बात’ है। ‘वचन’ औपचारिक अर्थ बनाए रखता है; प्रसंगानुसार ‘आज्ञा’ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: תַּעֲשׂוּ
  choice: ही करना
  rationale: यहाँ अपूर्ण क्रिया निर्देशात्मक बल रखती है। ‘करना’ स्वाभाविक हिन्दी आज्ञार्थ है और ‘ही’ बताए गए वचन के ठीक अनुसार चलने पर बल देता है।
- source_word: רְאוּ
  choice: देखो
  rationale: मूल का ध्यान आकर्षित करने वाला बहुवचन आज्ञार्थ सीधे रूप में सुरक्षित है।
- source_word: צִוִּיתִי אֶתְכֶם
  choice: मैंने तुम्हें आज्ञा दे दी है
  rationale: पूर्ण क्रिया पहले से दी जा चुकी आज्ञा की ओर संकेत करती है; यह हिन्दी रूप उस पूर्णता और वर्तमान प्रासंगिकता को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: כִּדְבַר में דָּבָר का अर्थ
  choice: वचन
  alternative: आज्ञा
  rationale: ‘वचन’ मूल शब्द की व्यापकता और औपचारिक अभिव्यक्ति को बनाए रखता है, जबकि इस प्रसंग में वह आज्ञा के अर्थ में भी समझा जा सकता है; इसलिए विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष सैन्य-वर्णनात्मक शैली अपनाई गई है। बहुवचन ‘तुम’ को पूरे पद में बनाए रखा गया है; हिन्दी में क्रियारूप संख्या को अलग से स्पष्ट नहीं करता।
