base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/021.yaml
  text: When Joshua and all Israel saw that the ambush had captured the city and that the smoke of the city had gone up[a], they turned back and struck down the men of Ai.
translation:
  language: hi
  text: यहोशू और समस्त इस्राएल ने देखा कि घात लगाए हुए दल[a] ने नगर पर अधिकार कर लिया था और नगर का धुआँ ऊपर उठ चुका था; तब वे मुड़े और ऐ के पुरुषों को मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घात लगाए हुए लोगों ने।” इब्रानी में प्रयुक्त कृदन्त घात में छिपे हुए दल को सामूहिक रूप से दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ
  choice: देखा
  rationale: यह सामान्य देखने या प्रत्यक्ष रूप से जान लेने का क्रियापद है। ‘देखा’ ठोस कथात्मक अर्थ बनाए रखता है।
- source_word: כִּי ... וְכִי
  choice: कि ... और
  rationale: यहाँ दोनों अव्यय उस बात की विषय-वस्तु बताते हैं जिसे यहोशू और इस्राएल ने देखा।
- source_word: לָכַד
  choice: अधिकार कर लिया था
  rationale: क्रिया का अर्थ पकड़ना या जीतकर अपने अधिकार में लेना है; पूर्णभूत रूप उनके देखने से पहले पूरी हुई कार्रवाई को स्पष्ट करता है।
- source_word: הָאֹרֵב
  choice: घात लगाए हुए दल
  rationale: एकवचन कृदन्त यहाँ सामूहिक रूप से घात में छिपी सैन्य टुकड़ी को सूचित करता है। यह अनुवाद आधुनिक हिन्दी में कर्ता को स्पष्ट करता है।
- source_word: עָלָה עֲשַׁן הָעִיר
  choice: नगर का धुआँ ऊपर उठ रहा था
  rationale: मूल की ऊपर उठने की छवि को बनाए रखते हुए दृश्य के प्रत्यक्ष और जारी दिखाई देने वाले स्वरूप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיָּשֻׁבוּ
  choice: वे मुड़े
  rationale: युद्ध के प्रसंग में क्रिया दिशा पलटकर फिर शत्रु का सामना करने को दर्शाती है।
- source_word: וַיַּכּוּ
  choice: मार गिराया
  rationale: נכה युद्ध में प्रहार करने और प्रायः घातक रूप से धराशायी करने का अर्थ देता है; ‘मार गिराया’ इसकी युद्ध-संबंधी शक्ति बनाए रखता है।
- source_word: אַנְשֵׁי הָעָי
  choice: ऐ के पुरुषों
  rationale: אַנְשֵׁי का सीधा अर्थ ‘पुरुष’ है। मूल के लैंगिक संकेत को बनाए रखा गया है और इसे बिना आधार केवल ‘योद्धा’ तक सीमित नहीं किया गया।
