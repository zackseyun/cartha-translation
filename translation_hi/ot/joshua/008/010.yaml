  yaml_path: translation/ot/joshua/008/010.yaml
  text: Joshua rose early in the morning and mustered the people[a], and he and the elders of Israel went up before the people to Ai.
translation:
  language: hi
  text: यहोशू भोर होते ही उठा और उसने लोगों की जाँच-परख की[a]। फिर वह और इस्राएल के पुरनिये लोगों के आगे-आगे ऐ को चढ़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लोगों की गिनती की” अथवा “लोगों का निरीक्षण किया”; इब्रानी क्रिया का अर्थ गिनना, निरीक्षण करना, नियुक्त करना, या लोगों को एकत्र करके व्यवस्थित करना हो सकता है। यहाँ सैन्य प्रसंग ‘जाँच-परख की’ के अर्थ के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: सुबह सवेरे उठा
  rationale: שׁכם के हिफ़ील रूप का अर्थ प्रातः जल्दी उठना है; यह हिन्दी में स्वाभाविक रूप से समय के बल को बनाए रखता है।
- source_word: וַיִּפְקֹד אֶת־הָעָם
  choice: लोगों को युद्ध के लिए इकट्ठा किया
  rationale: פקד का अर्थ गिनना, निरीक्षण करना या सैन्य दल को एकत्र और व्यवस्थित करना हो सकता है। ऐ पर चढ़ाई के संदर्भ में सैन्य अर्थ प्रमुख है; 'युद्ध के लिए' इसे सामान्य हिन्दी में स्पष्ट करता है, जबकि पादटिप्पणी मूल की व्यापकता बताती है।
- source_word: הָעָם
  choice: लोगों
  rationale: मूल में व्यापक शब्द 'लोग' है; सैन्य संदर्भ होने पर भी इसे केवल 'सैनिकों' तक सीमित नहीं किया गया।
- source_word: וַיַּעַל
  choice: चढ़ गए
  rationale: עלה का मूल अर्थ ऊपर जाना या चढ़ना है। बहुवचन हिन्दी क्रिया यह स्पष्ट करती है कि यहोशू और पुरनिये दोनों कर्ता हैं तथा सम्भावित स्थलाकृतिक भाव भी बना रहता है।
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: वह और इस्राएल के पुरनिये
  rationale: स्पष्ट सर्वनाम और इस्राएल के पुरनियों—दोनों को संयुक्त कर्ता के रूप में सुरक्षित रखा गया है।
- source_word: לִפְנֵי הָעָם
  choice: लोगों के आगे-आगे
  rationale: לפני का स्थानवाचक अर्थ स्वाभाविक हिन्दी में व्यक्त होता है और नेतृत्व का सम्भावित संकेत बिना अधिक व्याख्या के बना रहता है।
- source_word: הָעָי
  choice: ऐ
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप; इब्रानी का निश्चित उपपद हिन्दी में अलग से नहीं दर्शाया जाता।
