  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א וְ/אַל תֵּחָ֔ת קַ֣ח עִמְּ/ךָ֗ אֵ֚ת כָּל עַ֣ם הַ/מִּלְחָמָ֔ה וְ/ק֖וּם עֲלֵ֣ה הָ/עָ֑י רְאֵ֣ה נָתַ֣תִּי בְ/יָדְ/ךָ֗ אֶת מֶ֤לֶךְ הָ/עַי֙ וְ/אֶת עַמּ֔/וֹ וְ/אֶת עִיר֖/וֹ וְ/אֶת אַרְצֽ/וֹ־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/001.yaml
  text: Then Yahweh said to Joshua[a], “Do not fear and do not be dismayed. Take with you all the fighting men, and arise, go up to Ai. See, I have given into your hand the king of Ai, his people, his city, and his land.”
translation:
  language: hi
  text: तब याहवे ने यहोशू से कहा, “मत डर और हिम्मत मत हार। सभी योद्धाओं[a] को अपने साथ ले, उठ, ऐ को ऊपर जा। देख, मैंने ऐ के राजा, उसकी प्रजा, उसके नगर और उसके देश को तेरे हाथ में दे दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “युद्ध के सभी जन”; अर्थात युद्ध में भाग लेने वाला समस्त सैन्य बल।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: मत डर और हिम्मत मत हार
  rationale: दोनों निषेधों को अलग रखा गया है; दूसरा वाक्यांश חתת के भय से भीतर से टूटने या निरुत्साहित होने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: קַח עִמְּךָ אֵת כָּל עַם הַמִּלְחָמָה
  choice: सभी योद्धाओं को अपने साथ ले
  rationale: עִמְּךָ को स्पष्ट रूप से व्यक्त किया गया है और सैन्य समूह के लिए संक्षिप्त, स्वाभाविक ‘योद्धाओं’ का प्रयोग किया गया है।
- source_word: וְקוּם עֲלֵה הָעָי
  choice: उठ और ऐ नगर पर चढ़ाई कर
  rationale: दोनों आदेश सुरक्षित हैं। यहाँ עֲלֵה सैन्य प्रसंग में केवल भौगोलिक रूप से ऊपर जाने के बजाय आक्रमण के लिए बढ़ने का संकेत देता है।
- source_word: רְאֵה
  choice: देख
  rationale: यह आदेश आगे आने वाली ईश्वरीय निश्चितता की ओर ध्यान खींचता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: נָתַתִּי בְיָדְךָ
  choice: मैंने ... तेरे हाथ में कर दिया है
  rationale: इब्रानी पूर्ण क्रिया द्वारा व्यक्त सुनिश्चित परिणाम और ‘हाथ में’ नियंत्रण सौंपने की उपमा, दोनों बनाए रखे गए हैं।
- source_word: עַמּוֹ וְאֶת עִירוֹ וְאֶת אַרְצוֹ
  choice: उसकी प्रजा, उसके नगर और उसके देश
  rationale: एकवचन पुल्लिंग प्रत्ययों को निकटतम पूर्वपद, ऐ के राजा, के संबंध में उसी क्रम में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है। हिन्दी पाठकों के बीच स्थापित नामरूप ‘यहोवा’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: כָּל עַם הַמִּלְחָמָה में सैन्य समूह का स्वरूप
  choice: सभी योद्धा
  alternative: युद्ध के सभी लोग; सारी सेना
  rationale: वाक्यांश युद्ध में भाग लेने वाले सैन्य बल को सूचित करता है। ‘सभी योद्धा’ सामूहिक अर्थ को स्पष्ट रखता है, जबकि पादटिप्पणी उसके अधिक शाब्दिक रूप को दर्ज करती है।
- issue: ईश्वरीय पूर्ण क्रिया נָתַתִּי की कालगत शक्ति
  choice: मैंने ... कर दिया है
  alternative: मैं ... कर देता हूँ; मैं ... कर दूँगा
  rationale: घटना का ऐतिहासिक कार्यान्वयन आगे होना है, पर पूर्ण रूप विजय की ईश्वरीय निश्चितता को ऐसे प्रस्तुत करता है मानो सौंपना हो चुका हो; हिन्दी पूर्ण वर्तमान इस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सीधा, गरिमापूर्ण कथात्मक रूप अपनाया गया है। यहोशू को संबोधन एकवचन निकट रूप ‘तू/तेरा’ के क्रियारूपों से व्यक्त है, जो बाइबिलीय ईश्वरीय संबोधन में स्वाभाविक है। स्थान-नाम הָעָי को प्रचलित हिन्दी रूप ‘ऐ’ और स्पष्टता के लिए ‘ऐ नगर’ कहा गया है।
