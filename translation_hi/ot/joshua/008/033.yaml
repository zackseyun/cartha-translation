base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/033.yaml
  text: And all Israel[a], with its elders, officers, and judges, was standing on this side and on that side of the ark, opposite the Levitical priests carrying the ark of the covenant of Yahweh, both the sojourner and the native-born alike. Half of them were in front of Mount Gerizim and half of them in front of Mount Ebal, just as Moses the servant of Yahweh had commanded at the first[b], to bless the people of Israel.
translation:
  language: hi
  text: इस्राएल के सब लोग अपने पुरनियों, अधिकारियों और न्यायाधीशों समेत वाचा के सन्दूक के इस ओर और उस ओर, उन लेवीय याजकों के सामने खड़े थे जो याहवे की वाचा का सन्दूक उठाए हुए थे; उनमें निवासी परदेशी और देश में जन्मे लोग दोनों थे।[a] उनमें से आधे गरिज्जीम पर्वत के सामने और आधे एबाल पर्वत के सामने थे, जैसा याहवे के सेवक मूसा ने इस्राएल की प्रजा को आशीर्वाद देने के लिए पहले आज्ञा दी थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘परदेशी और देशी।’ इब्रानी पद निवासी परदेशी और देश में जन्मे व्यक्ति, दोनों को सूचित करते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘पहले’ है। इसका अर्थ मूसा की पहले दी हुई आज्ञा हो सकता है, या यह कि आशीर्वाद देना आरम्भिक कार्य था।
    reason: ambiguity
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: इस्राएल के सब लोग
  rationale: राष्ट्रीय समुदाय की सामूहिकता को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּזְקֵנָיו וְשֹׁטְרִים וְשֹׁפְטָיו
  choice: अपने पुरनियों, अधिकारियों और न्यायाधीशों समेत
  rationale: सम्बन्धवाचक प्रत्ययों को इस्राएल समुदाय से जोड़ता है; שֹׁטְרִים के प्रशासनिक अर्थ के लिए ‘अधिकारी’ उपयुक्त है।
- source_word: מִזֶּה וּמִזֶּה לָאָרוֹן
  choice: सन्दूक के इस ओर और उस ओर
  rationale: इब्रानी की दोहरावयुक्त स्थान-सूचक अभिव्यक्ति को बनाए रखता है।
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: लेवीय याजक
  rationale: याजकों की लेवीय पहचान को संक्षिप्त और प्रचलित हिन्दी में व्यक्त करता है, जबकि इब्रानी में सम्भव समानाधिकरण का अर्थ सुरक्षित रहता है।
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: याहवे की वाचा का सन्दूक उठाए हुए
  rationale: वर्तमान कृदन्त की जारी क्रिया तथा वाचा से सन्दूक का सम्बन्ध दोनों सुरक्षित हैं।
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: चाहे परदेशी हो या देशी, दोनों समान रूप से
  rationale: दोनों सामाजिक वर्गों की समान सहभागिता व्यक्त करता है; ‘परदेशी’ को केवल आकस्मिक यात्री समझे जाने की सम्भावना फुटनोट में स्पष्ट की गई है।
- source_word: חֶצְיוֹ ... וְהַחֶצְיוֹ
  choice: उनमें से आधे ... और आधे
  rationale: विभाजित जनसमूह की ओर संकेत करने वाले प्रत्यय को हिन्दी में स्पष्ट करता है।
- source_word: בָּרִאשֹׁנָה
  choice: पहले
  rationale: मूल का काल-सूचक भाव संक्षेप में रखता है और उसके सम्भव सम्बन्धों को फुटनोट में खुला छोड़ता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में आए व्यक्तिगत वाचा-नाम को हिन्दी लिप्यन्तरण में रखा गया है, शीर्षक से प्रतिस्थापित नहीं किया गया।
- issue: גֵּר और אֶזְרָח की सामाजिक श्रेणियाँ
  choice: परदेशी और देशी
  alternative: निवासी परदेशी और देश में जन्मा हुआ व्यक्ति
  rationale: पाठ की समावेशी समानता सुरक्षित रखते हुए मुख्य पाठ को सहज रखा गया है; अधिक स्पष्ट सामाजिक अर्थ फुटनोट में दिया गया है।
- issue: בָּרִאשֹׁנָה का वाक्यगत सम्बन्ध
  choice: मूसा ने पहले ... आज्ञा दी थी
  alternative: पहले कार्य के रूप में आशीर्वाद देना
  rationale: एक स्वाभाविक सम्भावना मुख्य पाठ में दी गई है, पर इब्रानी वाक्यांश की वास्तविक अस्पष्टता फुटनोट में संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किन्तु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘पुरनियों’, ‘याजक’, ‘वाचा’ और ‘सन्दूक’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; वाक्य को हिन्दी में सुबोध बनाने के लिए मूल के दीर्घ विन्यास को छोटे वाक्यों में बाँटा गया है।
