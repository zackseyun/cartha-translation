source:
  edition: WLC
  text: וְ/עָשִׂ֨יתָ לָ/עַ֜י וּ/לְ/מַלְכָּ֗/הּ כַּ/אֲשֶׁ֨ר עָשִׂ֤יתָ לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ רַק שְׁלָלָ֥/הּ וּ/בְהֶמְתָּ֖/הּ תָּבֹ֣זּוּ לָ/כֶ֑ם שִׂים לְ/ךָ֥ אֹרֵ֛ב לָ/עִ֖יר מֵ/אַחֲרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/002.yaml
  text: And you shall do to Ai and its king as you did to Jericho and its king[a]. Only its spoil and its livestock you may plunder for yourselves[b]. Set an ambush for yourself behind the city.
translation:
  language: hi
  text: और तुम ऐ और उसके राजा के साथ वैसा ही करना जैसा तुमने यरीहो और उसके राजा के साथ किया था। केवल उसकी लूट और उसके पशुधन को तुम अपने लिए लूट सकते हो[a]। नगर के पीछे घात लगाओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम अपने लिए लूट लेना।” इब्रानी रूप को साधारण भविष्य अथवा अधिकृत निर्देश के रूप में समझा जा सकता है; मुख्य पाठ यरीहो में लूट की मनाही के विपरीत यहाँ दी गई अनुमति को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या “नगर के पीछे घात लगाने वाला दल तैनात करो।” इब्रानी का एकवचन रूप घात को एक इकाई के रूप में अथवा घात लगाने वाले दल को सामूहिक रूप से सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: और तुम ... करना
  rationale: संयोजक सहित क़ाल पूर्ण 2 पुल्लिंग एकवचन यहाँ यहोशू को दिए निर्देश का काम करता है; हिंदी में प्रसंगानुकूल आज्ञार्थक रचना स्वाभाविक है।
- source_word: לָעַי
  choice: ऐ के साथ
  rationale: स्थाननाम עַי का प्रचलित हिंदी बाइबलीय लिप्यंतरण ‘ऐ’ रखा गया; עשה ל־ की इस तुलना में ‘के साथ करना’ स्वाभाविक हिंदी है।
- source_word: כַּאֲשֶׁר עָשִׂיתָ
  choice: वैसा ही ... जैसा तुमने ... किया था
  rationale: तुलनात्मक संबंध को स्पष्ट और सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: לִירִיחוֹ וּלְמַלְכָּהּ
  choice: यरीहो और उसके राजा के साथ
  rationale: यरीहो का मान्य हिंदी रूप और समन्वित संबंध स्वाभाविक ढंग से रखा गया है।
- source_word: רַק
  choice: केवल
  rationale: यरीहो के साथ तुलना में आने वाले अपवाद को सीधे बनाए रखता है।
- source_word: שְׁלָלָהּ
  choice: उसकी लूट
  rationale: युद्ध में प्राप्त की जाने वाली संपत्ति के लिए ‘लूट’ वर्तमान हिंदी में स्पष्ट और संक्षिप्त है।
- source_word: וּבְהֶמְתָּהּ
  choice: और उसके पशुधन
  rationale: בְּהֵמָה यहाँ संपत्ति माने जाने वाले पालतू पशुओं को सूचित करता है; ‘पशुधन’ आर्थिक और सामूहिक अर्थ बचाता है।
- source_word: תָּבֹזּוּ לָכֶם
  choice: तुम अपने लिए लूट सकते हो
  rationale: बहुवचन रूप सेना को संबोधित करता है। यरीहो में निषिद्ध लूट के विपरीत यहाँ अनुमति का भाव प्रसंग से उभरता है; ‘अपने लिए’ לָכֶם को सुरक्षित रखता है।
- source_word: שִׂים לְךָ אֹרֵב
  choice: घात लगाओ
  rationale: आज्ञा का सैन्य अर्थ हिंदी के मुहावरे ‘घात लगाना’ से स्वाभाविक रूप में व्यक्त होता है; אֹרֵב घात अथवा घात लगाने वाले दल, दोनों को सूचित कर सकता है।
- source_word: מֵאַחֲרֶיהָ
  choice: नगर के पीछे
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ नगर है; स्थान-संबंध सीधे व्यक्त किया गया है।
theological_decisions:
- issue: תָּבֹזּוּ का निर्देशात्मक बल
  choice: लूट सकते हो
  alternative: लूटोगे / लूट लेना
  rationale: रूप साधारण भविष्य अथवा अधिकृत निर्देश समझा जा सकता है। यरीहो की लूट पर प्रतिबंध के विपरीत यहाँ अनुमति प्रमुख है, पर वैकल्पिक पठन पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में स्पष्ट, गरिमापूर्ण और निर्देशात्मक शैली रखी गई है। सैन्य पदों को अनावश्यक रूप से पुरातन न बनाते हुए ‘घात लगाओ’ जैसे सहज मुहावरे का प्रयोग किया गया है।
