lexical_decisions:
- source_word: וַיִּנָּגְעוּ
  choice: अपने को पराजित होने दिया
  rationale: निफ़ाल रूप सैन्य प्रसंग में पराजित होने या पराजित दिखाई देने का भाव देता है। आसपास के घात-वाले प्रसंग में यह रणनीतिक दिखावटी हार थी; यह अनुवाद उस आशय को व्यक्त करता है, जबकि पादटिप्पणी सरल कर्मवाच्य विकल्प सुरक्षित रखती है।
- source_word: לִפְנֵיהֶם
  choice: उनके सामने
  rationale: לִפְנֵי के स्थानवाचक अर्थ का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: וַיָּנֻסוּ
  choice: भागे
  rationale: נוּס का सामान्य अर्थ भागना है। 'पीछे हटे' रणनीति को अधिक स्पष्ट कर देता, इसलिए मूल क्रिया के निकट 'भागे' चुना गया।
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: जंगल के मार्ग से
  rationale: דֶּרֶךְ मार्ग या रास्ता और מִדְבָּר निर्जन/जंगली प्रदेश दर्शाता है। यह रूप मार्ग के माध्यम से जाने का स्वाभाविक पाठ देता है; गंतव्यवाचक समझ पादटिप्पणी में दी गई है।
- source_word: יְהוֹשֻׁעַ וְכָל יִשְׂרָאֵל
  choice: यहोशू और समस्त इस्राएल
  rationale: व्यक्तिनाम और सामूहिक वाचा-समुदाय की मूल अभिव्यक्ति को बनाए रखता है; 'समस्त' dignified आधुनिक हिन्दी में כָל को स्पष्ट करता है।
