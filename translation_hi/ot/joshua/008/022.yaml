  text: וְ/אֵ֨לֶּה יָצְא֤וּ מִן הָ/עִיר֙ לִ/קְרָאתָ֔/ם וַ/יִּֽהְי֤וּ לְ/יִשְׂרָאֵל֙ בַּ/תָּ֔וֶךְ אֵ֥לֶּה מִ/זֶּ֖ה וְ/אֵ֣לֶּה מִ/זֶּ֑ה וַ/יַּכּ֣וּ אוֹתָ֔/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִ֥יד וּ/פָלִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/022.yaml
  text: And these came out from the city to meet them[a], so that they were in the midst of Israel, these on one side and those on the other[b]; and they struck them down until he left for him not a survivor or a fugitive.
translation:
  language: hi
  text: तब वे नगर से निकलकर उनका सामना करने आए। इस प्रकार ऐ के लोग इस्राएल के बीच में फँस गए—इस्राएली उनके एक ओर भी थे और दूसरी ओर भी[a]। उन्होंने ऐ के लोगों को तब तक मार गिराया, जब तक उनमें से न कोई जीवित बचा और न कोई भाग निकला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “ये इस ओर और वे उस ओर”; अर्थात ऐ के लोग दोनों ओर से इस्राएलियों के बीच घिर गए थे।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी के अंतिम वाक्यांश में शाब्दिक रूप से एकवचन है: “जब तक उसने उसके लिए न कोई बचा हुआ और न कोई भागा हुआ छोड़ा।” कर्ता और सर्वनाम का ठीक संदर्भ स्पष्ट नहीं है; आशय यह है कि कोई जीवित या भाग निकलने वाला नहीं छोड़ा गया।'
    reason: ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: तब वे
  rationale: संकेतवाचक पद पहले बताए गए घात लगाए दल की ओर संकेत करता है। हिन्दी में “तब वे” कथानक का संबंध स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: יָצְאוּ מִן הָעִיר לִקְרָאתָם
  choice: नगर से निकलकर उनका सामना करने आए
  rationale: יצא का अर्थ निकलना और לקראת का अर्थ मिलने या सामना करने की ओर बढ़ना है; युद्ध के प्रसंग में “सामना करने आए” शत्रुतापूर्ण मुठभेड़ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּהְיוּ לְיִשְׂרָאֵל בַּתָּוֶךְ
  choice: ऐ के लोग इस्राएल के बीच में फँस गए
  rationale: शाब्दिक अर्थ “इस्राएल के बीच में हो गए” है। “फँस गए” सामरिक परिणाम को स्पष्ट करता है, जिसे अगला द्विपक्षीय वाक्यांश पुष्ट करता है।
- source_word: אֵלֶּה מִזֶּה וְאֵלֶּה מִזֶּה
  choice: इस्राएली उनके एक ओर भी थे और दूसरी ओर भी
  rationale: इब्रानी मुहावरा दोनों ओर से घिर जाने का चित्र देता है। हिन्दी रूप अर्थ स्पष्ट करता है और दोनों दिशाओं की संरचना सुरक्षित रखता है।
- source_word: וַיַּכּוּ אוֹתָם
  choice: उन्होंने ऐ के लोगों को ... मार गिराया
  rationale: युद्ध-संदर्भ में נכה केवल प्रहार करना नहीं, प्राणघातक रूप से परास्त करना भी व्यक्त करता है; “मार गिराया” इस बल को बनाए रखता है।
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד וּפָלִיט
  choice: जब तक उनमें से न कोई जीवित बचा और न कोई भाग निकला
  rationale: यह स्वाभाविक हिन्दी में कार्य की पूर्णता बताता है और שָׂרִיד तथा פָלִיט के दो अलग पहलुओं—जीवित बचना और भाग निकलना—को सुरक्षित रखता है। इब्रानी के असामान्य एकवचन सर्वनामों की जानकारी पादटिप्पणी में दी गई है।
theological_decisions:
- issue: अंतिम उपवाक्य में एकवचन कर्ता और परोक्ष कर्म के संदर्भ
  choice: मुख्य पाठ में सामूहिक अर्थ स्पष्ट करते हुए “उनमें से न कोई जीवित बचा और न कोई भाग निकला”
  alternative: 'अति-शाब्दिक रूप: “जब तक उसने उसके लिए न कोई बचा हुआ और न कोई भागा हुआ छोड़ा”'
  rationale: इब्रानी बहुवचन “उन्होंने मारा” से अचानक एकवचन “उसने उसके लिए छोड़ा” पर जाता है और संदर्भ स्पष्ट नहीं करता। अटपटा शाब्दिक रूप हिन्दी में अर्थ को धुँधला करता; इसलिए मुख्य पाठ संदर्भगत परिणाम देता है, जबकि व्याकरणिक तनाव पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण रखी गई है। “ऐ” स्थाननाम के रूप में और “इस्राएल” सामूहिक नाम के रूप में प्रयुक्त है। सामरिक घेराव को सहज हिन्दी में स्पष्ट किया गया है, पर इब्रानी की असामान्य सर्वनाम-संरचना को पादटिप्पणी में दर्ज कर वास्तविक अस्पष्टता सुरक्षित रखी गई है।
