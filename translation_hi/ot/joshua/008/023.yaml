    text: या, “परन्तु।”
    reason: आरम्भिक हिब्रू संयोजक को कथानक-संयोजक ‘और’ अथवा प्रसंगानुसार हल्के विरोधसूचक ‘परन्तु’ के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: וְ/אֶת
  choice: परन्तु
  rationale: यह संयोजक कथा में अगली घटना को जोड़ता है, साथ ही आसपास के वध-वर्णन के विपरीत राजा के जीवित पकड़े जाने का हल्का विरोध भी व्यक्त करता है। औपचारिक रूप से ‘और’ भी संभव है।
- source_word: מֶלֶךְ הָעַי
  choice: ऐ के राजा
  rationale: सम्बन्धसूचक हिब्रू पदबंध का स्वाभाविक हिन्दी रूप ‘ऐ के राजा’ है; ‘ऐ’ स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण है।
- source_word: תָּפְשׂוּ
  choice: पकड़ लिया
  rationale: सैन्य प्रसंग में क्रिया का अर्थ किसी को अपने अधिकार में कर लेना है; ‘पकड़ लिया’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: חָי
  choice: जीवित
  rationale: यह विधेयात्मक विशेषण बताता है कि राजा मारा नहीं गया, बल्कि जीवित पकड़ा गया।
- source_word: וַיַּקְרִבוּ אֹתוֹ אֶל יְהוֹשֻׁעַ
  choice: और उसे यहोशू के पास ले आए
  rationale: हिफ़ील क्रिया קרב में निकट लाने की दिशा निहित है। ‘के पास ले आए’ इसे स्वाभाविक हिन्दी में सुरक्षित रखता है, जबकि ‘सामने प्रस्तुत किया’ न्यायिक भाव जोड़ सकता है जो मूल में स्पष्ट नहीं है।
