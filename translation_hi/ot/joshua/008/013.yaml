base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/013.yaml
  text: So the people positioned the whole camp that was north of the city[a], with its rear west of the city[b], and Joshua went that night into the midst of the valley.
translation:
  language: hi
  text: इस प्रकार उन्होंने लोगों को, अर्थात् उस पूरी छावनी को जो नगर के उत्तर में थी, और उसके पिछले भाग[a] को नगर के पश्चिम[b] में तैनात किया; और यहोशू उसी रात घाटी के बीच में गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी पिछली रक्षक टुकड़ी।”
    reason: עֲקֵבוֹ छावनी के पिछले भाग अथवा सैन्य अर्थ में पिछली रक्षक टुकड़ी को सूचित कर सकता है।
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “नगर की समुद्र-दिशा से”; यहाँ “समुद्र” दिशासूचक शब्द के रूप में “पश्चिम” को दर्शाता है।
    reason: יָם का शाब्दिक अर्थ ‘समुद्र’ है और भौगोलिक दिशासूचक अर्थ ‘पश्चिम’ भी हो सकता है।
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: तैनात किया … रखा
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है। सैन्य संदर्भ में छावनी के लिए ‘तैनात किया’ स्वाभाविक है, जबकि दूसरे कर्म ‘पिछले भाग’ के साथ ‘रखा’ हिन्दी में स्पष्टता देता है।
- source_word: הָעָם
  choice: लोगों
  rationale: मूल पाठ में व्यापक संज्ञा ‘लोग’ है, न कि स्पष्ट रूप से ‘सेना’ या ‘सैनिक’; इसलिए उसी व्यापकता को रखा गया है।
- source_word: כָּל־הַמַּחֲנֶה
  choice: पूरी छावनी
  rationale: כָּל और מַחֲנֶה का सहज आधुनिक हिन्दी रूप ‘पूरी छावनी’ है।
- source_word: אֲשֶׁר מִצְּפוֹן לָעִיר
  choice: नगर के उत्तर में
  rationale: यह वाक्यांश छावनी की भौगोलिक स्थिति बताता है; हिन्दी में ‘नगर के उत्तर में’ स्पष्ट और स्वाभाविक है।
- source_word: עֲקֵבוֹ
  choice: उसके पिछले भाग
  rationale: עָקֵב का मूल संबंध ‘एड़ी’ से है और यहाँ विस्तार से छावनी के पीछे के भाग को सूचित करता है। ‘पिछली रक्षक टुकड़ी’ संभव है, पर वह अधिक व्याख्यात्मक है।
- source_word: מִיָּם לָעִיר
  choice: नगर के पश्चिम में
  rationale: יָם का शाब्दिक अर्थ ‘समुद्र’ है, पर दिशासूचक प्रयोग में यह ‘पश्चिम’ को दर्शाता है। लक्ष्य पाठ में दिशा देना अधिक स्पष्ट है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: הלך के सामान्य गति-सूचक अर्थ को सरल और स्वाभाविक हिन्दी ‘गया’ से व्यक्त किया गया है।
- source_word: בַּלַּיְלָה הַהוּא
  choice: उसी रात
  rationale: यह वाक्यांश हिन्दी में स्वाभाविक रूप से ‘उसी रात’ कहा जाता है और वर्णित रात से उसका संबंध स्पष्ट रखता है।
- source_word: בְּתוֹךְ הָעֵמֶק
  choice: घाटी के बीच में
  rationale: בְּתוֹךְ स्थान के भीतर/बीच होने को व्यक्त करता है। गति-सूचक क्रिया के साथ हिन्दी वाक्य ‘घाटी के बीच में गया’ स्थान और गति दोनों को सहज रूप से संप्रेषित करता है।
