base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/016.yaml
  text: And all the people who were in the city were called out to pursue them[b][a], and they pursued Joshua and were drawn away from the city.
translation:
  language: hi
  text: तब नगर में जितने लोग थे, उन सबको उनका पीछा करने के लिए बुलाया गया[a], और उन्होंने यहोशू का पीछा किया और वे नगर से खिंचकर अलग हो गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे चिल्ला उठे”; इब्रानी क्रिया चिल्लाने का अर्थ भी दे सकती है, पर यहाँ संभवतः पीछा करने के लिए बुलाए या जुटाए जाने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या “नगर से अलग हो गए” अथवा “नगर से कट गए।” इब्रानी में इस तरह खींचे जाने का भाव है कि वे नगर से अलग हो गए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֲקוּ
  choice: बुलाया गया
  rationale: זעק के निफ़अल रूप का यहाँ सैनिक कार्रवाई के लिए बुलाए या जुटाए जाने का अर्थ संदर्भानुकूल है; केवल चिल्लाने का अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: כָּל הָעָם אֲשֶׁר בָּעִיר
  choice: नगर में जितने लोग थे, उन सबको
  rationale: עָם का सामान्य अर्थ ‘लोग’ है। ‘पुरुष’ कहना मूल पाठ से अधिक विशिष्ट होता; हिन्दी में यह विन्यास स्वाभाविक रूप से समग्रता व्यक्त करता है।
- source_word: לִרְדֹּף אַחֲרֵיהֶם
  choice: उनका पीछा करने के लिए
  rationale: רדף אחרי पीछा करने का सामान्य इब्रानी मुहावरा है; बहुवचन ‘उनका’ को बनाए रखा गया है।
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יְהוֹשֻׁעַ
  choice: वे यहोशू का पीछा करने लगे
  rationale: मूल पाठ में पहले बहुवचन लक्ष्य से फिर यहोशू पर ध्यान जाता है; इस बदलाव को बिना समतल किए सुरक्षित रखा गया है।
- source_word: וַיִּנָּתְקוּ מִן הָעִיר
  choice: नगर से दूर खिंच गए
  rationale: נתק के निफ़अल रूप में खींचकर अलग किए जाने या कट जाने का भाव है। ‘दूर खिंच गए’ सामरिक परिणाम को सहज हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
