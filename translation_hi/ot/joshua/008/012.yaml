  text: And he took about five thousand men and set them in ambush between Bethel and Ai[b][a], west of the city.
translation:
  language: hi
  text: उसने लगभग पाँच हज़ार पुरुषों को लेकर उन्हें बेतेल और ऐ के बीच, नगर के पश्चिम में[a], घात में तैनात कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रानी में शाब्दिक रूप से ‘नगर की ओर समुद्र से’; यहाँ ‘समुद्र’ दिशासूचक अर्थ में ‘पश्चिम’ के लिए प्रयुक्त हुआ है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: उसने ... को लेकर
  rationale: לקח का मूल अर्थ ‘लेना’ है। सैन्य प्रसंग में चयन का भाव संभव है, पर ‘लेकर’ हिब्रानी की सादगी बनाए रखता है।
- source_word: כַּחֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: लगभग पाँच हज़ार पुरुषों
  rationale: संख्या से पहले כְּ सन्निकटन सूचित करता है; इसलिए ‘लगभग’ आवश्यक है। אִישׁ यहाँ सामूहिक रूप से पुरुषों को दर्शाता है।
- source_word: וַיָּשֶׂם אוֹתָם אֹרֵב
  choice: उन्हें ... घात लगाकर बैठा दिया
  rationale: שׂים का अर्थ रखना/स्थापित करना है और אֹרֵב घात में रहने वाली टुकड़ी या घात लगाने की क्रिया को दर्शाता है। प्राकृतिक हिन्दी में यह संयुक्त अभिव्यक्ति सैन्य आशय स्पष्ट रखती है।
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: बेतेल और ऐ के बीच
  rationale: यह सीधा स्थानवाचक पदबंध है; नामों का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: מִיָּם לָעִיר
  choice: नगर के पश्चिम में
  rationale: יָם का शाब्दिक अर्थ ‘समुद्र’ है, पर भौगोलिक दिशा में यह मुहावरे के रूप में ‘पश्चिम’ बताता है।
