  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘घात लगाकर बैठा दिया’ सामान्य हिन्दी में स्वाभाविक है और घात-दल की क्रिया तथा तैनाती दोनों व्यक्त करता है। संख्या की अनिश्चितता मुख्य पाठ में ‘लगभग’ से सुरक्षित रखी गई है।
