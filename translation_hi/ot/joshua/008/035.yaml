id: JOS.8.35
reference: Joshua 8:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא הָיָ֣ה דָבָ֔ר מִ/כֹּ֖ל אֲשֶׁר צִוָּ֣ה מֹשֶׁ֑ה אֲשֶׁ֨ר לֹֽא קָרָ֜א יְהוֹשֻׁ֗עַ נֶ֣גֶד כָּל קְהַ֤ל יִשְׂרָאֵל֙ וְ/הַ/נָּשִׁ֣ים וְ/הַ/טַּ֔ף וְ/הַ/גֵּ֖ר הַ/הֹלֵ֥ךְ בְּ/קִרְבָּֽ/ם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/035.yaml
  text: There was not a word of all that Moses commanded that Joshua did not read before all the assembly of Israel[a], and the women, the little children[e][d][c][b], and the sojourner who walked among them.
translation:
  language: hi
  text: मूसा ने जो कुछ आज्ञा दी थी, उसमें से एक भी बात ऐसी नहीं थी जिसे यहोशू ने इस्राएल की सारी सभा के सामने—स्त्रियों, छोटे बच्चों और उनके बीच रहनेवाले परदेशी[a] समेत—न पढ़ा हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परदेशी’ से आशय उस गैर-इस्राएली व्यक्ति से है जो इस्राएलियों के बीच रह रहा था।
    reason: cultural_note
lexical_decisions:
- source_word: דָבָר
  choice: बात
  rationale: यहाँ ‘बात’ मूसा की आज्ञाओं की विषय-वस्तु को स्वाभाविक हिन्दी में व्यक्त करती है और קָרָא (‘पढ़ा’) के साथ भी सहज बैठती है।
- source_word: צִוָּה
  choice: आज्ञा दी
  rationale: वाचा और व्यवस्था के संदर्भ में मूसा के अधिकारपूर्ण निर्देश के लिए यह सटीक और प्रचलित अभिव्यक्ति है।
- source_word: קָרָא
  choice: पढ़ा
  rationale: निकटवर्ती संदर्भ व्यवस्था के सार्वजनिक पाठ का है; इसलिए ‘पढ़ा’ सबसे सटीक अर्थ देता है।
- source_word: נֶגֶד
  choice: के सामने
  rationale: यह एकत्र समुदाय की उपस्थिति में सार्वजनिक रूप से पढ़े जाने का स्वाभाविक हिन्दी रूप है।
- source_word: קְהַל
  choice: सभा
  rationale: यह इस्राएल के औपचारिक रूप से एकत्र समुदाय को बिना बाद की कलीसियाई शब्दावली आरोपित किए व्यक्त करता है।
- source_word: הַנָּשִׁים
  choice: स्त्रियों
  rationale: मूल पाठ में इस समूह का स्पष्ट उल्लेख है; हिन्दी सूची में परसर्गानुसार यह रूप स्वाभाविक है।
- source_word: הַטַּף
  choice: छोटे बच्चों
  rationale: טַף विशेषतः नन्हे बच्चों या आश्रित बालकों का बोध करा सकता है; ‘छोटे बच्चे’ इस आयु-सूचक अर्थ को बनाए रखता है।
- source_word: הַגֵּר
  choice: परदेशी
  rationale: यह किसी क्षणिक अजनबी के बजाय इस्राएल के बीच रहनेवाले गैर-इस्राएली निवासी की सामाजिक श्रेणी को व्यक्त करता है; इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הַהֹלֵךְ בְּקִרְבָּם
  choice: उनके बीच रहनेवाले
  rationale: शाब्दिक ‘उनके बीच चलनेवाले’ हिन्दी में भ्रामक होगा; इस प्रसंग में कृदंत का मुहावरेदार आशय समुदाय के बीच निवास करना है।
- source_word: לֹא הָיָה ... אֲשֶׁר לֹא
  choice: एक भी बात ऐसी नहीं थी जिसे ... न पढ़ा हो
  rationale: यह हिन्दी में स्वाभाविक रहते हुए इब्रानी दोहरे निषेध और पाठ की संपूर्णता पर उसके जोर को बनाए रखता है।
theological_decisions:
- issue: वाचा की शिक्षा सुननेवाले समुदाय का दायरा
  choice: इस्राएल की सारी सभा के साथ स्त्रियों, छोटे बच्चों और निवासी परदेशी को स्पष्ट रूप से शामिल किया गया है।
  alternative: इन समूहों को केवल ‘सारे इस्राएल’ में निहित मानकर अलग उल्लेख न करना।
  rationale: इब्रानी पाठ इन समूहों को स्पष्ट रूप से गिनाता है; इसलिए अनुवाद भी उनकी प्रत्यक्ष सहभागिता को सुरक्षित रखता है।
- issue: यहोशू द्वारा मूसा की सभी आज्ञाओं का पाठ
  choice: दोहरे निषेध के द्वारा इस बात पर जोर रखा गया है कि एक भी बात पढ़े बिना नहीं छोड़ी गई।
  alternative: सकारात्मक रूप में ‘यहोशू ने सब कुछ पढ़ा’ कहना।
  rationale: सकारात्मक रूप अर्थ की मुख्य दिशा देता, पर मूल की जोरदार निषेधात्मक संरचना को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। मूल के जोरदार दोहरे निषेध को स्वाभाविक हिन्दी संरचना में रखा गया है। सूची को ‘समेत’ के साथ इस प्रकार जोड़ा गया है कि स्त्रियों, छोटे बच्चों और परदेशी का स्पष्ट समावेश बना रहे।
