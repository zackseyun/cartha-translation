  text: וַ/יְהִ֞י כִּ/רְא֣וֹת מֶֽלֶךְ הָ/עַ֗י וַֽ/יְמַהֲר֡וּ וַ/יַּשְׁכִּ֡ימוּ וַ/יֵּצְא֣וּ אַנְשֵֽׁי הָ/עִ֣יר לִ/קְרַֽאת יִ֠שְׂרָאֵל לַֽ/מִּלְחָמָ֞ה ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מּוֹעֵ֖ד לִ/פְנֵ֣י הָֽ/עֲרָבָ֑ה וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּֽי אֹרֵ֥ב ל֖/וֹ מֵ/אַחֲרֵ֥י הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/014.yaml
  text: And it happened[a], when the king of Ai saw it, that they hurried and rose early, and the men of the city went out to meet Israel for battle, he and all his people, at the appointed place before the Arabah. But he did not know that an ambush was against him behind the city.
translation:
  language: hi
  text: और ऐसा हुआ कि जब ऐ के राजा ने यह देखा, तो उन्होंने जल्दी की और भोर में उठे; नगर के पुरुष इस्राएल का सामना करने और युद्ध करने के लिए निकले—वह और उसकी सारी प्रजा—ठहराए हुए स्थान[a] पर, अराबा[b] के सामने। परन्तु वह नहीं जानता था कि नगर के पीछे उसके विरुद्ध घात लगा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ठहराए हुए समय पर।” इब्रानी शब्द का अर्थ नियुक्त समय या नियुक्त स्थान, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैदान के सामने।” इब्रानी शब्द किसी विशेष अराबा क्षेत्र अथवा सामान्य रूप से मरुस्थलीय मैदान/स्तेपी को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह इब्रानी कथा में नए घटनाक्रम का परिचय देता है; हिंदी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: כִּרְאוֹת מֶלֶךְ הָעַי
  choice: जब ऐ के राजा ने यह देखा
  rationale: כִּ के साथ infinitive construct समय का भाव देता है। कर्म मूल में निहित है, इसलिए संदर्भानुसार ‘यह’ रखा गया है।
- source_word: וַיְמַהֲרוּ וַיַּשְׁכִּימוּ
  choice: नगर के पुरुषों ने जल्दी की और सवेरे ही उठे
  rationale: दोनों क्रियाओं का बहुवचन सुरक्षित रखा गया है; अगले स्पष्ट कर्ता ‘नगर के पुरुष’ को हिंदी में पहले रखकर वाक्य सुबोध बनाया गया है।
- source_word: אַנְשֵׁי הָעִיר
  choice: नगर के पुरुष
  rationale: सैन्य प्रसंग में אַנְשֵׁי का लिंग-सटीक और संदर्भानुकूल अनुवाद है।
- source_word: לִקְרַאת יִשְׂרָאֵל לַמִּלְחָמָה
  choice: इस्राएल से युद्ध करने के लिए
  rationale: ‘सामना करने’ और ‘युद्ध के लिए’ के संयुक्त आशय को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: הוּא וְכָל עַמּוֹ
  choice: राजा अपनी सारी प्रजा के साथ
  rationale: עַם को अनावश्यक रूप से ‘सेना’ नहीं बनाया गया; सैन्य प्रसंग के बावजूद मूल का व्यापक ‘प्रजा/लोग’ भाव रखा गया है।
- source_word: לַמּוֹעֵד
  choice: ठहराए हुए स्थान
  rationale: इसके बाद भौगोलिक स्थिति आने के कारण स्थान का अर्थ अधिक संभावित है, किंतु ‘समय’ की वास्तविक lexical संभावना पादटिप्पणी में रखी गई है।
- source_word: לִפְנֵי הָעֲרָבָה
  choice: अराबा के सामने
  rationale: לִפְנֵי का स्थानवाचक अर्थ और הָעֲרָבָה का संभावित भौगोलिक नाम दोनों सुरक्षित हैं।
- source_word: אֹרֵב לוֹ מֵאַחֲרֵי הָעִיר
  choice: नगर के पीछे उसके विरुद्ध घात लगाई गई थी
  rationale: घात की स्थिति और राजा के विरुद्ध उसके उद्देश्य, दोनों को स्पष्ट रखते हुए मूल का निष्क्रिय भाव व्यक्त किया गया है।
