- from: और ऐसा हुआ कि जब ऐ के राजा ने यह देखा, तो नगर के पुरुषों ने जल्दी की और सवेरे ही उठे। राजा अपनी सारी प्रजा के साथ इस्राएल से युद्ध करने के लिए ठहराए हुए स्थान[a] पर, अराबा[b] के सामने, नगर से निकला। परन्तु वह नहीं जानता था कि नगर के पीछे उसके विरुद्ध घात लगाई गई थी।
  to: और ऐसा हुआ कि जब ऐ के राजा ने यह देखा, तो उन्होंने जल्दी की और भोर में उठे; नगर के पुरुष इस्राएल का सामना करने और युद्ध करने के लिए निकले—वह और उसकी सारी प्रजा—ठहराए हुए स्थान[a] पर, अराबा[b] के सामने। परन्तु वह नहीं जानता था कि नगर के पीछे उसके विरुद्ध घात लगा हुआ था।
  rationale: 'Revision restores the Hebrew’s single movement clause: the city’s men go out to meet Israel for battle, with the king and all his people. It retains the source’s ambiguity around the appointed place/time and Arabah/plain through the existing footnotes, and renders the final participial ambush clause without adding a completed passive event.'
