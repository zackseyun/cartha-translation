base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/017.yaml
  text: And not a man was left in Ai or Bethel who did not go out after Israel[b][a], and they left the city open and pursued Israel.
translation:
  language: hi
  text: और ऐ और बेतेल में एक भी पुरुष नहीं बचा जो इस्राएल के पीछे न निकला था।[a] उन्होंने नगर को खुला छोड़ दिया[b] और इस्राएल का पीछा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एक भी पुरुष’ इब्रानी के पुल्लिंग एकवचन शब्द אִישׁ का अनुवाद है, जो यहाँ सामान्य अर्थ में किसी भी पीछे रह जाने वाले व्यक्ति के लिए प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक भावार्थपूर्ण अनुवाद: ‘उन्होंने नगर को असुरक्षित छोड़ दिया।’ इब्रानी में शाब्दिक रूप से ‘नगर को खुला’ है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַר אִישׁ
  choice: एक भी पुरुष ऐसा न बचा
  rationale: नִשְׁאַר के ‘बचा/रह गया’ अर्थ और אִישׁ के पुल्लिंग एकवचन को स्वाभाविक हिन्दी में बनाए रखता है; प्रसंग में यह सामूहिक रूप से नगरों के युद्धयोग्य पुरुषों की ओर संकेत करता है।
- source_word: בָּעַי וּבֵית אֵל
  choice: ऐ और बेतेल में
  rationale: दोनों स्थानों को समान रूप से जोड़ता है। नकारात्मक वाक्य-विन्यास ‘एक भी...न’ स्पष्ट करता है कि किसी भी नगर में कोई पुरुष पीछे नहीं रहा।
- source_word: אֲשֶׁר לֹא יָצְאוּ אַחֲרֵי יִשְׂרָאֵל
  choice: जो इस्राएल के पीछे न निकला हो
  rationale: इब्रानी संबंधवाचक संरचना और אַחֲרֵי की दिशात्मक छवि को सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיַּעַזְבוּ
  choice: उन्होंने...छोड़ दिया
  rationale: עזב का सीधा कथात्मक अर्थ देता है; अधिक व्याख्यात्मक ‘असुरक्षित कर दिया’ को मुख्य पाठ में नहीं लाता।
- source_word: הָעִיר פְּתוּחָה
  choice: नगर को खुला छोड़ दिया
  rationale: פְּתוּחָה के ठोस, शाब्दिक अर्थ ‘खुला’ को बनाए रखता है, यद्यपि प्रसंग में नगर के असुरक्षित होने का भाव निहित है।
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יִשְׂרָאֵל
  choice: इस्राएल का पीछा किया
  rationale: सैन्य कथानक में רדף का स्वाभाविक और सटीक हिन्दी रूप है; ‘पीछे’ का भाव ‘पीछा करना’ में अंतर्निहित है।
