  yaml_path: translation/ot/joshua/008/028.yaml
  text: So Joshua burned Ai and made it a permanent mound[a], a desolation to this day.
translation:
  language: hi
  text: तब यहोशू ने ऐ को जला दिया और उसे एक स्थायी[a] टीला, एक उजाड़ स्थान बना दिया; वह आज तक उजाड़ पड़ा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सदा के लिए’ या ‘सदैव का’। इब्रानी עוֹלָם बहुत लंबी अथवा अनिश्चित अवधि का संकेत कर सकता है और अक्सर ‘सदा’ या ‘सदैव’ अनूदित होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: जला दिया
  rationale: שׂרף आग से जलाने को स्पष्ट रूप से व्यक्त करता है; हिंदी कथात्मक शैली में ‘जला दिया’ स्वाभाविक और परिणामसूचक है।
- source_word: הָעָי
  choice: ऐ
  rationale: स्थान के नाम Ai का प्रचलित हिंदी बाइबलीय लिप्यंतरण ‘ऐ’ है।
- source_word: וַיְשִׂימֶהָ
  choice: उसे ... बना दिया
  rationale: שׂים और स्त्रीलिंग एकवचन प्रत्यय का यहाँ परिणामसूचक अर्थ है; ‘उसे ... बना दिया’ हिंदी में इस रचना को सहजता से व्यक्त करता है।
- source_word: תֵּל
  choice: खंडहर का टीला
  rationale: תֵּל नष्ट नगर के अवशेषों से बने टीले को सूचित कर सकता है; केवल ‘टीला’ अस्पष्ट हो सकता है, इसलिए ‘खंडहर का टीला’ प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: עוֹלָם
  choice: सदा के लिए
  rationale: עוֹלָם दीर्घ अथवा अनिश्चित स्थायित्व व्यक्त करता है। ‘सदा के लिए’ उसका स्वाभाविक हिंदी रूप है; पादटिप्पणी इसके अर्थ-क्षेत्र को सीमित किए बिना स्पष्ट करती है।
- source_word: שְׁמָמָה
  choice: एक उजाड़ स्थान
  rationale: संज्ञा שְׁמָמָה वीरानी अथवा उजाड़ दशा को व्यक्त करती है; ‘एक उजाड़ स्थान’ आधुनिक हिंदी में स्वाभाविक है और दूसरे विधेय की शक्ति बनाए रखता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: जो आज तक वैसा ही है
  rationale: हिब्रू मुहावरा कथाकार के समय तक उस दशा के जारी रहने को बताता है; हिंदी में यह रूप संदर्भ को स्पष्ट और सहज बनाता है।
