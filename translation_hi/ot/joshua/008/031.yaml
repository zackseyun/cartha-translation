source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר צִוָּה֩ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל כַּ/כָּתוּב֙ בְּ/סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה מִזְבַּח֙ אֲבָנִ֣ים שְׁלֵמ֔וֹת אֲשֶׁ֛ר לֹֽא הֵנִ֥יף עֲלֵי/הֶ֖ן בַּרְזֶ֑ל וַ/יַּעֲל֨וּ עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה וַֽ/יִּזְבְּח֖וּ שְׁלָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/031.yaml
  text: just as Moses the servant of Yahweh had commanded the sons of Israel[a], as it is written in the Book of the Law of Moses, an altar of whole stones, on which no iron tool had been wielded[b]; and they offered up burnt offerings on it to Yahweh and sacrificed peace offerings.
translation:
  language: hi
  text: जैसा यहोवा के सेवक मूसा ने इस्राएल के पुत्रों को आज्ञा दी थी, और जैसा मूसा की व्यवस्था की पुस्तक में लिखा है, वैसी ही साबुत[a] पत्थरों की एक वेदी, जिन पर लोहे का कोई औज़ार नहीं चलाया गया था। उस वेदी पर उन्होंने यहोवा के लिए होमबलियाँ चढ़ाईं और मेलबलियाँ[b] अर्पित कीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनगढ़ पत्थरों की।” इब्रानी में “साबुत पत्थर” है, अर्थात ऐसे पत्थर जिन्हें लोहे से तराशा या गढ़ा नहीं गया था।
    reason: lexical_alternative
  - marker: b
    text: या “शान्ति-बलियाँ,” “सहभागिता-बलियाँ,” अथवा “कुशल-बलियाँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר צִוָּה
  choice: जैसा ... आज्ञा दी थी
  rationale: पूर्व में दी गई आज्ञा के अनुरूप कार्य होने का भाव रखता है और हिन्दी कथा-क्रम में पूर्वकालिकता स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֶבֶד יְהוָה
  choice: यहोवा के सेवक
  rationale: मूसा की प्रतिष्ठित उपाधि को सहज और गरिमापूर्ण हिन्दी में रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी के पारिवारिक और सामूहिक पदबंध को यथासंभव बनाए रखता है।
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: मूसा की व्यवस्था की पुस्तक में
  rationale: पुस्तक और तोराह/व्यवस्था दोनों तत्त्वों को स्पष्ट तथा परिचित हिन्दी में सुरक्षित रखता है।
- source_word: מִזְבַּח אֲבָנִים שְׁלֵמוֹת
  choice: साबुत पत्थरों की एक वेदी
  rationale: שְׁלֵמוֹת का मूल भाव पूरे, अक्षत या साबुत पत्थरों का है; अगला वाक्यांश स्पष्ट करता है कि उन पर लोहे का औज़ार नहीं चला था।
- source_word: לֹא הֵנִיף עֲלֵיהֶן בַּרְזֶל
  choice: जिन पर लोहे का कोई औज़ार नहीं चलाया गया था
  rationale: लोहे को उठाने/चलाने के इब्रानी मुहावरे का निर्माण-संदर्भ में स्पष्ट और स्वाभाविक अर्थ देता है।
- source_word: וַיַּעֲלוּ עָלָיו עֹלוֹת
  choice: उस वेदी पर ... होमबलियाँ चढ़ाईं
  rationale: עֹלוֹת के विशिष्ट बलिदान-प्रकार और चढ़ाने के क्रियाभाव दोनों को हिन्दी बाइबलीय शब्दावली में रखता है।
- source_word: וַיִּזְבְּחוּ שְׁלָמִים
  choice: मेलबलियाँ अर्पित कीं
  rationale: שְׁלָמִים के शांति, मेल और सहभागिता से जुड़े बलिदानी अर्थ-क्षेत्र के लिए संक्षिप्त और प्रचलित हिन्दी पद है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में आए व्यक्तिगत वाचा-नाम को उपाधि से प्रतिस्थापित नहीं किया गया; आधुनिक हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले रूप 'यहोवा' का प्रयोग किया गया।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक लिंगयुक्त रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल के लोगों
  rationale: मूल के पुत्र-आधारित पारिवारिक-सामूहिक रूप को बनाए रखा गया, यद्यपि प्रसंग में यह समुदाय का निर्देश करता है।
- issue: שְׁלָמִים की बलिदानी संज्ञा
  choice: मेलबलियाँ
  alternative: शान्ति-बलियाँ / सहभागिता-बलियाँ / कुशल-बलियाँ
  rationale: किसी एक व्याख्यात्मक पक्ष तक अर्थ को सीमित किए बिना पारंपरिक बलिदानी पद चुना गया; अर्थ-क्षेत्र की अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। लम्बे इब्रानी वाक्य को स्पष्ट हिन्दी वाक्यों में बाँटा गया है। मूल में 'उसने ... बनाई' क्रिया पूर्वपद से समझी जाती है और पिछले पद में स्पष्ट है; पूर्ण पद को स्वतंत्र रूप से समझने योग्य बनाने के लिए इसे यहाँ व्यक्त किया गया है।
