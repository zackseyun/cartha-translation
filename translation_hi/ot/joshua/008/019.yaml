  yaml_path: translation/ot/joshua/008/019.yaml
  text: Then the ambush rose quickly from its place and ran as soon as he stretched out his hand; they entered the city[a], captured it, and quickly set the city on fire.
translation:
  language: hi
  text: तब घात लगाए बैठे सैनिक अपने स्थान से झट उठे और ज्योंही उसने अपना हाथ बढ़ाया,[a] वे दौड़ पड़े। उन्होंने नगर में प्रवेश करके उस पर अधिकार कर लिया और शीघ्र ही नगर में आग लगा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उसने अपना हाथ बढ़ाया।” इब्रानी रचना यह बताती है कि यह यहोशू के संकेत का समय था; इसे तत्कालता पर बल देकर “ज्योंही” या सामान्य काल-संबंध के रूप में “जब” अनूदित किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹרֵב
  choice: घात लगाए बैठे सैनिक
  rationale: इब्रानी कृदंत यहाँ सामूहिक रूप से घात में छिपे सैन्यदल को दर्शाता है। हिंदी में यह पदबंध लोगों को स्पष्ट करता है और आगे आने वाली बहुवचन क्रियाओं से स्वाभाविक मेल रखता है।
- source_word: קָם מְהֵרָה מִמְּקוֹמוֹ
  choice: अपने स्थान से झट उठे
  rationale: קום यहाँ छिपे हुए दल के तत्काल सक्रिय होने को और מְהֵרָה उसकी तत्परता को व्यक्त करता है। सामूहिक एकवचन प्रत्यय को हिंदी में अर्थानुसार बहुवचन 'अपने' से व्यक्त किया गया है।
- source_word: וַיָּרֻצוּ
  choice: वे दौड़ पड़े
  rationale: रוץ का सीधा अर्थ दौड़ना है; 'दौड़ पड़े' अचानक और तत्पर सैन्य कार्रवाई को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: כִּנְטוֹת יָדוֹ
  choice: ज्योंही उसने अपना हाथ बढ़ाया
  rationale: כ के साथ infinitive construct संकेत के समय और तत्काल प्रतिक्रिया को दर्शाता है। 'ज्योंही' उस निकट कालिक संबंध को स्पष्ट करता है, जबकि कर्ता को मूल की तरह सर्वनाम ही रखा गया है।
- source_word: וַיָּבֹאוּ הָעִיר
  choice: उन्होंने नगर में प्रवेश किया
  rationale: בוא के साथ गंतव्य यहाँ नगर के भीतर जाने का भाव देता है; 'प्रवेश किया' स्पष्ट और गरिमापूर्ण आधुनिक हिंदी है। मुख्य पाठ में अगली क्रिया से प्रवाह के लिए 'प्रवेश करके' रखा गया है।
- source_word: וַיִּלְכְּדוּהָ
  choice: उस पर अधिकार कर लिया
  rationale: לכד सैन्य प्रसंग में नगर को पकड़ लेने या जीत लेने का अर्थ देता है। 'अधिकार कर लिया' नगर पर नियंत्रण स्थापित होने को सहज हिंदी में व्यक्त करता है।
- source_word: וַיְמַהֲרוּ
  choice: शीघ्र ही
  rationale: यह क्रिया अगली कार्रवाई की तेजी पर बल देती है। हिंदी में क्रियाविशेषण रूप कथा-प्रवाह को स्वाभाविक रखते हुए वही अर्थ देता है।
- source_word: וַיַּצִּיתוּ אֶת הָעִיר בָּאֵשׁ
  choice: नगर में आग लगा दी
  rationale: יצת का हिफ़ील रूप आग लगाने या प्रज्वलित करने का कारणवाचक अर्थ देता है। यह आधुनिक हिंदी का स्वाभाविक और सटीक प्रयोग है।
