- source_word: גִּבּוֹרֵי הַחַיִל
  choice: पराक्रमी योद्धाओं
  rationale: यह सैन्य पदबंध सामर्थ्यवान और वीर लड़ाकों को दर्शाता है; ‘पराक्रमी योद्धा’ वर्तमान, गरिमापूर्ण और गैर-पुरातन हिंदी है।
- source_word: וַיִּשְׁלָחֵם
  choice: उन्हें भेज दिया
  rationale: שלח तथा कर्मवाचक प्रत्यय का सीधा अनुवाद; ‘दिया’ कथात्मक पूर्णता को हिंदी में स्वाभाविक बनाता है।
- source_word: לָיְלָה
  choice: रात में
  rationale: कालसूचक क्रियाविशेषण का स्पष्ट और सामान्य आधुनिक हिंदी रूप।
