  text: אָ֣ז יִבְנֶ֤ה יְהוֹשֻׁ֨עַ֙ מִזְבֵּ֔חַ לַֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר עֵיבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/030.yaml
  text: Then Joshua built an altar to Yahweh[a], the God of Israel, on Mount Ebal.
translation:
  language: hi
  text: तब यहोशू ने एबाल पर्वत पर इस्राएल के परमेश्वर याहवे[a] के लिए एक वेदी बनाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का विशिष्ट नाम ‘याहवे’ है।
    reason: ईश्वरीय नाम के मूल रूप की पहचान स्पष्ट करना।
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण कथा में अगली घटना को सूचित करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: יִבְנֶה
  choice: बनाई
  rationale: रूप की दृष्टि से यह अपूर्ण क्रिया है, पर אָז के बाद कथात्मक संदर्भ में इसका बल भूतकाल की पूर्ण घटना का है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित और पहचाना हुआ रूप।
- source_word: מִזְבֵּחַ
  choice: एक वेदी
  rationale: यह बलिदान चढ़ाने की वेदी को दर्शाता है; प्रसंग में पहली बार उल्लेख होने के कारण ‘एक’ स्वाभाविक है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל समर्पण अथवा उद्देश्य का भाव देता है; ‘के लिए’ हिन्दी में वेदी के याहवे को समर्पित होने का अर्थ स्पष्ट करता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धवाचक पदबंध याहवे की पहचान इस्राएल के परमेश्वर के रूप में करता है।
- source_word: בְּהַר עֵיבָל
  choice: एबाल पर्वत पर
  rationale: בְּ यहाँ स्थान सूचित करता है; पर्वत पर हुई घटना के लिए ‘पर’ सहज हिन्दी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना निकटतम प्रचलित लिप्यंतरण के रूप में रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। वाक्य-विन्यास हिन्दी की स्वाभाविक रीति के अनुसार रखा गया है, जबकि मूल पाठ की घटना, समर्पण का भाव और परमेश्वर के विशिष्ट नाम को सुरक्षित रखा गया है।
