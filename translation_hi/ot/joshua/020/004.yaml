base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/004.yaml
  text: He shall flee to one of these cities and stand at the entrance of the city gate[a], and he shall speak his case in the hearing of the elders of that city. Then they shall take him into the city to themselves, and they shall give him a place[b], and he shall live with them.
translation:
  language: hi
  text: वह इन नगरों में से किसी एक में भाग जाए और नगर के फाटक के प्रवेश-द्वार पर खड़ा हो जाए। वह उस नगर के बुज़ुर्गों को अपना मामला[a] सुनाए। तब वे उसे नगर में अपने बीच ले लें[b], उसे रहने के लिए स्थान दें, और वह उनके साथ रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी बातें” अथवा “अपनी बात”; इब्रानी शब्द उसके बोले हुए शब्दों या उसके द्वारा प्रस्तुत मामले—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “वे उसे अपने बीच नगर में स्वीकार कर लें”; इब्रानी क्रिया का अर्थ “इकट्ठा करना,” “भीतर ले आना” या “स्वीकार करना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָס
  choice: भाग जाए
  rationale: कानूनी निर्देशों के क्रम में यह क्रिया भविष्यसूचक/आदेशात्मक अर्थ रखती है; ‘भाग जाए’ आधुनिक हिन्दी में उस निर्देश को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: नगर के फाटक के प्रवेश पर
  rationale: פֶּתַח के ‘प्रवेश/मुख’ और שַׁעַר के ‘फाटक’—दोनों भावों को बनाए रखता है और सार्वजनिक न्याय-स्थल की छवि सुरक्षित रखता है।
- source_word: בְּאָזְנֵי זִקְנֵי הָעִיר הַהִיא
  choice: उस नगर के बुज़ुर्गों को ... सुनाए
  rationale: ‘कानों में’ के शाब्दिक रूप के बजाय हिन्दी का स्वाभाविक श्रवण-सूचक मुहावरा अपनाया गया है; ‘उस नगर’ की विशिष्टता भी रखी गई है।
- source_word: אֶת דְּבָרָיו
  choice: अपना मामला
  rationale: דְּבָרָיו का अर्थ उसके ‘शब्द,’ ‘बात’ या न्यायिक ‘मामला’ हो सकता है; इस नागरिक-न्यायिक संदर्भ में ‘मामला’ सबसे स्वाभाविक है, जबकि अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: וְאָסְפוּ אֹתוֹ הָעִירָה אֲלֵיהֶם
  choice: उसे अपने बीच नगर के भीतर ले लें
  rationale: यह रूप नगर के भीतर लाने/ग्रहण करने और אֲלֵיהֶם के सामुदायिक ‘अपने बीच’—दोनों तत्वों को व्यक्त करता है।
- source_word: וְנָתְנוּ לוֹ מָקוֹם
  choice: उसे रहने के लिए स्थान दें
  rationale: מָקוֹם का सामान्य अर्थ ‘स्थान’ बनाए रखते हुए प्रसंग से स्पष्ट निवास-प्रयोजन को सहज हिन्दी में व्यक्त किया गया है; इसे किसी विशिष्ट प्रकार के आवास तक सीमित नहीं किया गया।
- source_word: וְיָשַׁב עִמָּם
  choice: वह उनके साथ रहे
  rationale: निवास के संदर्भ में יָשַׁב का अर्थ ‘रहना/बसना’ है; ‘रहे’ आधुनिक और स्वाभाविक है।
