base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/007.yaml
  text: So they set apart Kedesh in Galilee in the hill country of Naphtali[a], and Shechem in the hill country of Ephraim, and Kiriath-arba (that is, Hebron) in the hill country of Judah.
translation:
  language: hi
  text: तब उन्होंने नप्ताली के पहाड़ी प्रदेश में गलील के केदेश को, एप्रैम के पहाड़ी प्रदेश में शकेम को, और यहूदा के पहाड़ी प्रदेश में किर्यत-अर्बा को—जो हेब्रोन है[a]—अलग ठहराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में, “किर्यत-अर्बा, वही हेब्रोन है”; अर्थात किर्यत-अर्बा हेब्रोन का दूसरा नाम है।
    reason: मूल की पहचान-सूचक अभिव्यक्ति और स्थान के वैकल्पिक नाम को स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּקְדִּשׁוּ
  choice: अलग ठहराया
  rationale: शरण-नगरों के कानूनी और नागरिक संदर्भ में क्रिया का अर्थ किसी विशेष उद्देश्य के लिए औपचारिक रूप से अलग निर्धारित करना है; यह चुनाव अनावश्यक अनुष्ठानिक अर्थ से बचता है।
- source_word: בְּהַר נַפְתָּלִי / בְּהַר אֶפְרָיִם / בְּהַר יְהוּדָה
  choice: नप्ताली/एप्रैम/यहूदा के पहाड़ी प्रदेश में
  rationale: यहाँ הַר किसी एक पर्वत-शिखर के बजाय संबंधित गोत्रीय भूभाग के पहाड़ी क्षेत्र को दर्शाता है।
- source_word: קֶדֶשׁ / שְׁכֶם / קִרְיַת אַרְבַּע / חֶבְרוֹן
  choice: केदेश / शकेम / किर्यत-अर्बा / हेब्रोन
  rationale: स्थान-नामों को अर्थानुवाद करने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: הִיא חֶבְרוֹן
  choice: जो हेब्रोन है
  rationale: यह वाक्यांश किर्यत-अर्बा और हेब्रोन को एक ही नगर के दो नामों के रूप में पहचानता है; हिन्दी में उपवाक्य मूल की पहचान-सूचक संरचना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּגָּלִיל
  choice: गलील के
  rationale: गलील भौगोलिक क्षेत्र का नाम है; वाक्य-विन्यास में ‘गलील के केदेश’ स्पष्ट करता है कि यह उसी क्षेत्र में स्थित केदेश है, जबकि अगला पद उसे नप्ताली के पहाड़ी प्रदेश में रखता है।
