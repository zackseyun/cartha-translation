source:
  edition: WLC
  text: וְ/כִ֨י יִרְדֹּ֜ף גֹּאֵ֤ל הַ/דָּם֙ אַֽחֲרָ֔י/ו וְ/לֹֽא יַסְגִּ֥רוּ אֶת הָ/רֹצֵ֖חַ בְּ/יָד֑/וֹ כִּ֤י בִ/בְלִי דַ֨עַת֙ הִכָּ֣ה אֶת רֵעֵ֔/הוּ וְ/לֹֽא שֹׂנֵ֥א ה֛וּא ל֖/וֹ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/005.yaml
  text: And if the avenger of blood pursues him[a], they shall not hand the manslayer over into his hand, because he struck his neighbor without intent and had not hated him before, from yesterday or the day before.
translation:
  language: hi
  text: और यदि खून का बदला लेनेवाला उसका पीछा करे, तो वे उस व्यक्ति को जिसने किसी की जान ली है उसके हाथ में न सौंपें, क्योंकि उसने अपने साथी को अनजाने में मारा था और वह पहले से उससे बैर नहीं रखता था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कल और परसों से”; यह इब्रानी मुहावरा “पहले से” या “पूर्वकाल में” के अर्थ में है।
    reason: मूल इब्रानी काल-सूचक मुहावरे का शाब्दिक रूप और उसका अभिप्रेत अर्थ बताना।
lexical_decisions:
- source_word: וְכִי
  choice: और यदि
  rationale: यह पिछले विधान से संबंध बनाए रखते हुए एक संभावित कानूनी स्थिति प्रस्तुत करता है।
- source_word: גֹּאֵל הַדָּם
  choice: खून का बदला लेनेवाला
  rationale: शरण-नगर के प्रसंग में यह मारे गए व्यक्ति के कुल-प्रतिनिधि के लिए प्रयुक्त कानूनी पद है; यह हिन्दी में अर्थ को स्पष्ट रखता है।
- source_word: וְלֹא יַסְגִּרוּ
  choice: वे ... न सौंपें
  rationale: हिफ़ील रूप यहाँ किसी व्यक्ति को दूसरे के अधिकार में दे देने का अर्थ रखता है; निषेधात्मक कानूनी बल हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: הָרֹצֵחַ
  choice: वध करनेवाला
  rationale: यह उस व्यक्ति को सूचित करता है जिसने किसी की जान ली है, पर इस चरण पर उसे जानबूझकर हत्या करनेवाला नहीं ठहराता।
- source_word: בְּיָדוֹ
  choice: उसके हाथ में
  rationale: मूल इब्रानी का सजीव मुहावरा बनाए रखता है और उसके अधिकार में सौंपने का भाव देता है।
- source_word: בִּבְלִי דַעַת
  choice: अनजाने में
  rationale: इस कानूनी प्रसंग में ज्ञान या इरादे के अभाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הִכָּה
  choice: मारा था
  rationale: मूल क्रिया का अर्थ प्रहार करना या मारना है; मृत्यु का परिणाम व्यापक प्रसंग से स्पष्ट है, इसलिए 'हत्या की' कहना अनावश्यक रूप से दोष निर्धारित करता।
- source_word: רֵעֵהוּ
  choice: अपने पड़ोसी को
  rationale: रֵעַ के पारस्परिक सामाजिक अर्थ का प्रचलित और सुबोध हिन्दी रूप है।
- source_word: וְלֹא שֹׂנֵא הוּא לוֹ
  choice: वह ... उससे बैर नहीं रखता था
  rationale: पूर्व शत्रुता के अभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: पहले से
  rationale: शाब्दिक रूप से 'कल और परसों से' वाला इब्रानी मुहावरा पहले से चली आ रही स्थिति, अर्थात पूर्वकाल, को दर्शाता है।
theological_decisions:
- issue: शरण-नगर के प्रसंग में הָרֹצֵחַ की कानूनी स्थिति
  choice: '''वध करनेवाला''—ऐसा तटस्थ पद जो जान लेने की घटना बताता है, पर जानबूझकर हत्या का दोष पहले से निश्चित नहीं करता'
  alternative: '''हत्यारा'''
  rationale: पद में जान लेने का तथ्य है, जबकि इसी पद में अनजाने कार्य और पूर्व बैर के अभाव से दोष की प्रकृति अलग की गई है; 'हत्यारा' आधुनिक हिन्दी में प्रायः जानबूझकर हत्या का दोष जता सकता है।
- issue: בִּבְלִי דַעַת का न्यायिक भाव
  choice: '''अनजाने में'''
  alternative: '''बिना ज्ञान के'' या ''बिना इरादे के'''
  rationale: यह चयन अनिच्छित या अज्ञानवश किए गए प्रहार का भाव रखता है, फिर भी मूल वाक्यांश की ज्ञान और मंशा के बीच की कुछ व्यापकता को संकीर्ण कानूनी शब्दावली में पूरी तरह बंद नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट कानूनी-आख्यान शैली रखी गई है। 'खून का बदला लेनेवाला' प्रसंगगत पद को सामान्य पाठक के लिए बोधगम्य बनाता है; 'वध करनेवाला' दोष को समय से पहले निर्धारित करने से बचाता है।
