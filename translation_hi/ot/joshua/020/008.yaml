base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/008.yaml
  text: And beyond the Jordan east of Jericho[a], they designated Bezer in the wilderness on the plateau from the tribe of Reuben, and Ramoth in Gilead from the tribe of Gad, and Golan in Bashan from the tribe of Manasseh.
translation:
  language: hi
  text: यरदन के उस पार, यरीहो के पूर्व की ओर, उन्होंने रूबेन के गोत्र में से निर्जन प्रदेश के पठार पर बेसेर, गाद के गोत्र में से गिलाद में रामोत[a], और मनश्शे के गोत्र में से बाशान में गोलान ठहराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत रूप से इस नगर का नाम “रामोत-गिलाद” कहा जाता है। इब्रानी में शाब्दिक रूप से “गिलाद में रामोत” है।
    reason: lexical_alternative
lexical_decisions:
