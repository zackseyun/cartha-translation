- source_word: מִמַּטֵּה רְאוּבֵן / מִמַּטֵּה גָד / מִמַּטֵּה מְנַשֶּׁה
  choice: रूबेन/गाद/मनश्शे गोत्र के क्षेत्र में
  rationale: यह प्रयोग नगरों के संबंधित गोत्रीय भू-भाग को दर्शाता है। केवल ‘गोत्र में से’ की अपेक्षा ‘गोत्र के क्षेत्र में’ हिन्दी में आशय अधिक स्पष्ट करता है।
- source_word: רָאמֹת בַּגִּלְעָד
  choice: गिलाद में स्थित रामोत
  rationale: मूल पाठ नगर और उसके क्षेत्र को अलग-अलग व्यक्त करता है; इसलिए संयुक्त नाम बनाने के बजाय शाब्दिक भौगोलिक संबंध रखा गया है।
- source_word: גלון בַּבָּשָׁן
  choice: बाशान में स्थित गोलान
  rationale: व्यंजनात्मक पाठ प्रसिद्ध स्थान गोलान की ओर संकेत करता है; क्षेत्र-सूचक पद का स्पष्ट अनुवाद किया गया है।
