reference: Joshua 20:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵ֣לֶּה הָיוּ֩ עָרֵ֨י הַ/מּֽוּעָדָ֜ה לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָ֑ה וְ/לֹ֣א יָמ֗וּת בְּ/יַד֙ גֹּאֵ֣ל הַ/דָּ֔ם עַד עָמְד֖/וֹ לִ/פְנֵ֥י הָ/עֵדָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/009.yaml
  text: These were the appointed cities for all the sons of Israel and for the sojourner residing among them[c][b][a], so that anyone who struck down a person unintentionally might flee there and not die by the hand of the avenger of blood until he stood before the congregation.
translation:
  language: hi
  text: ये सभी इस्राएलियों और उनके बीच रहनेवाले परदेशी निवासी के लिए ठहराए गए नगर थे, ताकि जो कोई अनजाने में किसी व्यक्ति को मार डाले, वह वहाँ भाग जाए और मण्डली के सामने उपस्थित होने तक लहू का बदला लेनेवाले के हाथ से न मरे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָרֵי הַמּוּעָדָה
  choice: ठहराए गए नगर
  rationale: यह पदबंध नियुक्त या निर्दिष्ट नगरों को दर्शाता है। यहाँ ‘शरण’ जोड़ना प्रसंगानुकूल तो है, पर इस पदबंध में स्पष्ट रूप से नहीं है।
- source_word: לְכֹל בְּנֵי יִשְׂרָאֵל
  choice: सभी इस्राएलियों
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक राष्ट्रीय सामूहिक अभिव्यक्ति है और आशय को ठीक रखती है।
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: उनके बीच रहनेवाले परदेशी निवासी
  rationale: גֵּר इस्राएली समाज के बीच स्थायी रूप से रहनेवाले गैर-इस्राएली व्यक्ति की कानूनी-सामुदायिक स्थिति बताता है; ‘परदेशी निवासी’ इसे सामान्य ‘अजनबी’ से अधिक स्पष्ट करता है।
- source_word: לָנוּס שָׁמָּה
  choice: वह वहाँ भाग जाए
  rationale: נוּס का मूल अर्थ संकट से भागना है; प्रयोजनवाचक वाक्य में यह हिन्दी में सहज है।
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: जो कोई ... किसी व्यक्ति को मार डाले
  rationale: हिब्रू मुहावरा किसी प्राणधारी व्यक्ति को घातक रूप से मारने का अर्थ देता है; हिन्दी में ‘मार डाले’ कानूनी परिणाम को स्पष्ट और स्वाभाविक बनाता है।
- source_word: בִּשְׁגָגָה
  choice: अनजाने में
  rationale: यह बिना इरादे या भूल से हुए कार्य को दर्शाता है और शरण-नगर संबंधी कानूनी भेद को बनाए रखता है।
- source_word: גֹּאֵל הַדָּם
  choice: लहू का बदला लेनेवाला
  rationale: यह मारे गए संबंधी की ओर से रक्तप्रतिशोध लेनेवाले निकट संबंधी की विशिष्ट कानूनी भूमिका को दर्शाता है।
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה
  choice: मण्डली के सामने उपस्थित होने तक
  rationale: यह उस न्यायिक उपस्थिति तक की समय-सीमा बताता है; ‘उपस्थित होना’ हिन्दी में शाब्दिक ‘खड़ा होना’ से अधिक स्वाभाविक कानूनी अभिव्यक्ति है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का लिंगयुक्त वाचा-संबंधी रूप
  choice: सभी इस्राएलियों
  alternative: इस्राएल के सभी पुत्रों
  rationale: मूल अभिव्यक्ति व्याकरणतः पुल्लिंग बहुवचन है, पर राष्ट्रीय समुदाय के लिए रूढ़ सामूहिक पद है। आधुनिक हिन्दी में ‘इस्राएलियों’ अर्थ और समावेश दोनों को बिना अतिरिक्त व्याख्या के स्वाभाविक रूप से व्यक्त करता है।
- issue: גֵּר की कानूनी-सामुदायिक स्थिति
  choice: परदेशी निवासी
  alternative: परदेशी / प्रवासी
  rationale: पद में संरक्षण इस्राएलियों से आगे उनके बीच रहनेवाले गैर-इस्राएली निवासी तक पहुँचता है। चुना हुआ रूप आधुनिक राजनीतिक श्रेणियाँ थोपे बिना उसके निवासी और परदेशी—दोनों पहलुओं को रखता है।
- issue: גֹּאֵל הַדָּם की भूमिका
  choice: लहू का बदला लेनेवाला
  alternative: खून का बदला लेनेवाला / रक्त का प्रतिशोध लेनेवाला
  rationale: यह निजी हिंसा का सामान्य वर्णन नहीं, बल्कि निकट संबंधी की प्राचीन कानूनी-सामाजिक भूमिका है। पारंपरिक बाइबिलीय अभिव्यक्ति उस विशेषता को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कानूनी-सामुदायिक पदों में मूल की विशिष्टता बचाई गई है, पर अनावश्यक शाब्दिक कठोरता से बचा गया है।
