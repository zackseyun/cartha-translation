  text: לָ/נ֥וּס שָׁ֨מָּ/ה֙ רוֹצֵ֔חַ מַכֵּה נֶ֥פֶשׁ בִּ/שְׁגָגָ֖ה בִּ/בְלִי דָ֑עַת וְ/הָי֤וּ לָ/כֶם֙ לְ/מִקְלָ֔ט מִ/גֹּאֵ֖ל הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/003.yaml
  text: so that a manslayer who strikes down a person unintentionally[a], without knowledge, may flee there[b], and they shall be for you a refuge from the avenger of blood.
translation:
  language: hi
  text: ताकि वह वध करनेवाला, जिसने किसी व्यक्ति का अनजाने में और बिना जानकारी के वध किया हो, वहाँ भाग सके; और वे नगर तुम्हारे लिए खून का बदला लेनेवाले[a] से शरणस्थान हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात इस्राएल की कुल-आधारित न्याय-व्यवस्था में मारे गए व्यक्ति का निकट संबंधी, जो उसके रक्त का बदला लेने की जिम्मेदारी रखता था।
    reason: cultural_note
lexical_decisions:
- source_word: לָנוּס שָׁמָּה
  choice: वहाँ भाग सके
  rationale: ल־युक्त क्रियार्थक संज्ञा पिछले आदेश का उद्देश्य बताती है; आधुनिक हिन्दी में संभावनार्थक रूप उद्देश्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רוֹצֵחַ
  choice: हत्यारा
  rationale: हिन्दी में संक्षिप्त और सहज पद; साथ के विशेषण ‘अनजाने में’ और ‘बिना जानकारी के’ स्पष्ट करते हैं कि यहाँ जानबूझकर हत्या करनेवाला अभिप्रेत नहीं है।
- source_word: מַכֵּה נֶפֶשׁ
  choice: जिसने ... किसी व्यक्ति को मार डाला हो
  rationale: यह इब्रानी विधिक मुहावरा किसी मनुष्य की मृत्यु का कारण बनने को दर्शाता है; ‘प्राण को मारा’ जैसी शब्दशः अभिव्यक्ति हिन्दी में अस्वाभाविक होती।
- source_word: בִּשְׁגָגָה בִּבְלִי דָעַת
  choice: अनजाने में और बिना जानकारी के
  rationale: दोनों अलग अभिव्यक्तियों को बनाए रखा गया है, ताकि भूलवश किए गए कार्य और पूर्वज्ञान/जानकारी के अभाव का संयुक्त विधिक बल सुरक्षित रहे।
- source_word: וְהָיוּ לָכֶם לְמִקְלָט
  choice: और वे नगर तुम्हारे लिए ... शरणस्थान ठहरें
  rationale: बहुवचन क्रिया का संदर्भ पहले बताए गए नगर हैं; स्पष्टता के लिए ‘नगर’ दोहराया गया और ‘शरणस्थान’ ने संस्थागत अर्थ सुरक्षित रखा।
- source_word: מִגֹּאֵל הַדָּם
  choice: खून का बदला लेनेवाले
  rationale: यह कुल-आधारित विधिक भूमिका को दर्शाता है। सहज हिन्दी में ‘खून का बदला लेनेवाला’ अर्थ स्पष्ट करता है, जबकि संबंधी होने की सांस्कृतिक पृष्ठभूमि पादटिप्पणी में दी गई है।
theological_decisions:
- issue: मृत्यु का कारण बननेवाले का विधिक चरित्र
  choice: ऐसा हत्यारा जिसने अनजाने और बिना जानकारी के किसी को मारा हो
  alternative: ‘हत्यारा’ को जानबूझकर हत्या करनेवाला समझना
  rationale: בִּשְׁגָגָה और בִּבְלִי דָעַת स्पष्ट रूप से अनिच्छित अथवा अनजाने वध की स्थिति बताते हैं; इसलिए पाठ में दुर्भावनापूर्ण हत्या का अर्थ नहीं थोपा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। विधिक अर्थ बनाए रखने के लिए ‘शरणस्थान’ और ‘खून का बदला लेनेवाला’ चुने गए हैं; वाक्य में बहुवचन कर्ता स्पष्ट करने हेतु ‘नगर’ जोड़ा गया है।
