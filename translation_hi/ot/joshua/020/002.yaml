source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר תְּנ֤וּ לָ/כֶם֙ אֶת עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁר דִּבַּ֥רְתִּי אֲלֵי/כֶ֖ם בְּ/יַד מֹשֶֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/002.yaml
  text: Speak to the sons of Israel[a], saying, ‘Appoint for yourselves the cities of refuge, about which I spoke to you through Moses,’
translation:
  language: hi
  text: “इस्राएलियों से कह, ‘अपने लिए उन शरण-नगरों को निर्धारित करो, जिनके विषय में मैंने मूसा के द्वारा[a] तुमसे कहा था।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “मूसा के हाथ से”; यह हिब्रू मुहावरा यहाँ “मूसा के द्वारा” के अर्थ में है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: कह
  rationale: पिएल आज्ञार्थक रूप यहोशू को सीधे संबोधित करता है। आधुनिक हिन्दी में “से कह” स्वाभाविक रूप से प्रत्यक्ष आदेश व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ “इस्राएल के पुत्र” है, पर यह हिब्रू का प्रचलित सामुदायिक नाम है। “इस्राएलियों” आधुनिक हिन्दी में पूरे वाचा-समुदाय को स्वाभाविक और सटीक ढंग से व्यक्त करता है।
- source_word: לֵאמֹר
  choice: कह
  rationale: यह प्रत्यक्ष कथन का परिचय देने वाला सामान्य हिब्रू रूप है; हिन्दी संरचना “से कह” में इसका कार्य स्वाभाविक रूप से समाहित है।
- source_word: תְּנוּ לָכֶם
  choice: अपने लिए … निर्धारित करो
  rationale: נתן का मूल अर्थ “देना” है, किंतु यहाँ नगरों को विशेष कानूनी प्रयोजन के लिए नियुक्त करने का प्रशासनिक भाव है। “निर्धारित करो” इस संदर्भ को स्पष्ट रखता है।
- source_word: עָרֵי הַמִּקְלָט
  choice: शरण-नगरों
  rationale: यह अनजाने में हत्या करने वाले व्यक्ति की सुरक्षा के लिए नियत नगरों का कानूनी पद है। “शरण-नगर” संक्षिप्त, प्रचलित और अर्थानुकूल है।
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיכֶם
  choice: जिनके विषय में मैंने … तुमसे कहा था
  rationale: संबंधवाचक उपवाक्य को स्वाभाविक हिन्दी में व्यक्त करते हुए नगरों को पूर्व में दिए गए निर्देश का विषय बनाए रखता है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: शाब्दिक मुहावरा “मूसा के हाथ से” माध्यम अथवा प्रतिनिधि के द्वारा बोलने को दर्शाता है। “मूसा के द्वारा” आधुनिक हिन्दी में यही आशय स्पष्ट करता है; शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक और लिंगसूचक रूप
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यहाँ पदबंध किसी सीमित पुरुष-समूह के बजाय इस्राएल के वाचा-समुदाय का पारंपरिक जातिनाम है। “इस्राएलियों” उसके सामुदायिक संदर्भ को बिना किसी अतिरिक्त धार्मिक व्याख्या के स्वाभाविक हिन्दी में रखता है।
- issue: בְּיַד מֹשֶׁה में माध्यम का भाव
  choice: मूसा के द्वारा
  alternative: मूसा के हाथ से
  rationale: यह वाक्यांश परमेश्वर की आज्ञा के मानवीय माध्यम के रूप में मूसा को दर्शाता है। अर्थानुकूल मुख्य पाठ के साथ शाब्दिक हिब्रू मुहावरे को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष आज्ञा की संरचना बनाए रखते हुए हिब्रू के प्रशासनिक और कानूनी पदों को स्वाभाविक हिन्दी में व्यक्त किया गया है।
