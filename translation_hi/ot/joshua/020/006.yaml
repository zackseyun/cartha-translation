  text: וְ/יָשַׁ֣ב בָּ/עִ֣יר הַ/הִ֗יא עַד עָמְד֞/וֹ לִ/פְנֵ֤י הָֽ/עֵדָה֙ לַ/מִּשְׁפָּ֔ט עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם אָ֣ז יָשׁ֣וּב הָ/רוֹצֵ֗חַ וּ/בָ֤א אֶל עִיר/וֹ֙ וְ/אֶל בֵּית֔/וֹ אֶל הָ/עִ֖יר אֲשֶׁר נָ֥ס מִ/שָּֽׁם׀־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/006.yaml
  text: And he shall live in that city until he stands before the congregation for judgment[a], until the death of the high priest who is in office in those days. Then the manslayer may return and come to his city and to his house[b], to the city from which he fled.
translation:
  language: hi
  text: और वह उस नगर में तब तक रहे, जब तक वह न्याय के लिए सभा[a] के सामने उपस्थित न हो जाए और उन दिनों पद पर रहने वाले महायाजक की मृत्यु न हो जाए। तब वह व्यक्ति जिसने प्राण लिया था[b], अपने नगर में—अर्थात उस नगर में जहाँ से वह भागा था—और अपने घर लौट सकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समुदाय।” हिब्रू शब्द उस एकत्र समुदाय को दर्शाता है जो न्यायिक निर्णय करता था।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में, “मारने वाला” या “वध करने वाला।” शरण-नगर के प्रसंग में यह उस व्यक्ति के लिए प्रयुक्त है जिसने किसी की मृत्यु की है; यह पद स्वयं उसे दोषी हत्यारा ठहराता नहीं है।
    reason: legal_semantic_clarification
lexical_decisions:
- source_word: וְיָשַׁב בָּעִיר הַהִיא
  choice: और वह उस नगर में ... रहे
  rationale: ישׁב यहाँ शरण-नगर में लगातार निवास करने को दर्शाता है। ‘रहे’ आधुनिक हिन्दी में स्वाभाविक है और कानूनी बाध्यता को बनाए रखता है।
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה לַמִּשְׁפָּט
  choice: जब तक वह न्याय के लिए सभा के सामने उपस्थित न हो
  rationale: עמד לפני किसी प्राधिकारी के सामने उपस्थित होने का मुहावरा है। ‘सभा’ एकत्र समुदाय की न्यायिक भूमिका को व्यक्त करता है, और ‘न्याय के लिए’ משפט की व्यापक न्यायिक अर्थवत्ता को सुरक्षित रखता है।
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדוֹל
  choice: जब तक ... महायाजक की मृत्यु न हो जाए
  rationale: हिब्रू रचना का निकट और स्वाभाविक हिन्दी रूप; ‘महायाजक’ הכהן הגדול का प्रचलित पदनाम है।
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: उन दिनों पद पर रहने वाले
  rationale: यह उपवाक्य उस समय सेवा कर रहे महायाजक की पहचान करता है। ‘पद पर रहने वाले’ इस कार्यगत भाव को स्पष्ट करता है, बिना कोई अतिरिक्त धार्मिक अर्थ जोड़े।
- source_word: אָז יָשׁוּב
  choice: तब ... लौट सकेगा
  rationale: कानूनी संदर्भ में यह प्रतिबंध हटने के बाद अधिकृत वापसी है। ‘लौट सकेगा’ हिन्दी में अनुमति/अधिकार को स्वाभाविक रूप से व्यक्त करता है, न कि अनिवार्य भविष्यवाणी को।
- source_word: הָרֹצֵחַ
  choice: वध करने वाला
  rationale: רצח का सामान्य अर्थ हत्या करने वाला व्यक्ति है, पर शरण-नगर के संदर्भ में दोषपूर्वक हत्या अभी सिद्ध नहीं है। ‘वध करने वाला’ ‘हत्यारा’ की अपेक्षा कम निर्णयात्मक है और कानूनी तनाव बनाए रखता है।
- source_word: אֶל עִירוֹ וְאֶל בֵּיתוֹ
  choice: अपने नगर और अपने घर
  rationale: यह नागरिक स्थान और परिवार/गृह—दोनों में बहाली को सुरक्षित रखता है।
- source_word: אֶל הָעִיר אֲשֶׁר נָס מִשָּׁם
  choice: उस नगर में, जहाँ से वह भागा था
  rationale: हिब्रू के पुनरुक्त गंतव्य को पठनीय हिन्दी में बनाए रखते हुए पूर्वकालिक भागने की घटना स्पष्ट की गई है।
theological_decisions:
- issue: शरण-नगर की व्यवस्था में הָרֹצֵחַ की कानूनी स्थिति
  choice: ‘वध करने वाला’
  alternative: ‘हत्यारा’ या ‘खूनी’
  rationale: व्यापक प्रसंग अनजाने में हुए वध और दोषपूर्ण हत्या में भेद करता है। ‘हत्यारा’ दोष का ऐसा निष्कर्ष सुना सकता है जो इस पद में अभी स्थापित नहीं हुआ।
- issue: महायाजक की मृत्यु के बाद वापसी का भाव
  choice: 'अनुमति/अधिकार: ‘लौट सकेगा’'
  alternative: 'अनिवार्य भविष्य: ‘लौटेगा’'
  rationale: व्यवस्था का आशय निवास-संबंधी रोक हटाना है; हिन्दी में ‘सकेगा’ अधिकृत वापसी को व्यक्त करता है, जबकि वास्तविक वापसी को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। कानूनी स्वर बनाए रखने के लिए ‘न्याय’, ‘सभा’, ‘पद पर’ और ‘लौट सकेगा’ चुने गए हैं। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न [a] और [b] सम्मिलित हैं।
