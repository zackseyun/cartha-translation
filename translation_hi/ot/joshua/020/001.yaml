  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/001.yaml
  text: Then Yahweh spoke to Joshua[a], saying,
translation:
  language: hi
  text: तब याहवे ने यहोशू से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ उसके क्रमिक बल को स्वाभाविक हिन्दी में व्यक्त करता है। דּבר का शाब्दिक अर्थ ‘बोला’ है, पर לֵאמֹר के साथ हिन्दी में ‘कहा’ अधिक सहज है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: אֶל
  choice: से
  rationale: हिन्दी में ‘किसी से कहना’ इस संबोधन-संरचना का स्वाभाविक रूप है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित बाइबलीय रूप अपनाया गया है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह क्रियार्थक रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। अलग से ‘यह कहते हुए’ लिखना हिन्दी में अनावश्यक और असहज होगा; इसका कार्य मुख्य क्रिया ‘कहा’ में समाहित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी नाम יְהוָה है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: सरल, वर्तमान और गरिमापूर्ण मानक हिन्दी। ‘तब’ कथात्मक क्रम को स्पष्ट करता है; वाक्य के अंत का अल्पविराम अगले पद में आने वाली प्रत्यक्ष वाणी की भूमिका दर्शाता है।
