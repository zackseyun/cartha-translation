  yaml_path: translation/ot/joshua/006/015.yaml
  text: And it happened on the seventh day that they rose early, at the going up of the dawn, and marched around the city in this manner seven times. Only on that day did they march around the city seven times.
translation:
  language: hi
  text: सातवें दिन ऐसा हुआ कि वे भोर होते ही तड़के उठे और इसी रीति से नगर के चारों ओर सात बार घूमे। केवल उसी दिन वे नगर के चारों ओर सात बार घूमे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: भोर की पहली किरण के समय
  rationale: शाब्दिक अर्थ ‘भोर के चढ़ने पर’ है; यह चयन उषाकाल के आरम्भ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיָּסֹבּוּ / סָבְבוּ
  choice: चारों ओर ... चक्कर लगाया
  rationale: क्रिया का मूल अर्थ नगर की परिक्रमा करना या उसके चारों ओर घूमना है। प्रसंग में सैनिक जुलूस निहित हो सकता है, पर मूल क्रिया स्वयं अनिवार्यतः ‘कूच करना’ नहीं कहती।
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: इसी रीति से
  rationale: यहाँ מִשְׁפָּט स्थापित विधि या ढंग को सूचित करता है; ‘इसी रीति से’ प्रसंगानुकूल और सहज है।
- source_word: רַק
  choice: केवल
  rationale: यह अव्यय उस दिन और अन्य दिनों के बीच विशेष भेद पर बल देता है।
