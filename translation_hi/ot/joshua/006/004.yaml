  yaml_path: translation/ot/joshua/006/004.yaml
  text: And seven priests shall carry seven ram’s-horn trumpets before the ark. On the seventh day you shall march around the city seven times[a], and the priests shall blow the trumpets.
translation:
  language: hi
  text: और सात याजक संदूक के आगे मेढ़े के सींग की सात तुरहियाँ लिए चलें। सातवें दिन तुम नगर के चारों ओर सात बार चक्कर लगाओ, और याजक तुरहियाँ फूँकें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: लेकर चलें
  rationale: נשא का मूल अर्थ ‘उठाना/ढोना/ले जाना’ है। जुलूस के इस प्रसंग में ‘लेकर चलें’ सहज हिन्दी है और याजकों द्वारा वाद्य उठाकर आगे बढ़ने की क्रिया स्पष्ट करता है।
- source_word: שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: मेढ़ों के सींगों से बने सात नरसिंगे
  rationale: שׁוֹפָר सींग से बने फूँक-वाद्य को दर्शाता है और הַיּוֹבְלִים उसके प्रकार को विशेषित करता है। ‘नरसिंगे’ वाद्य का कार्य बताता है, जबकि ‘मेढ़ों के सींगों से बने’ उसके सम्भावित स्वरूप को स्पष्ट करता है; ‘जयन्ती के नरसिंगे’ इस प्रसंग में भ्रामक हो सकता है।
- source_word: לִפְנֵי הָאָרוֹן
  choice: सन्दूक के आगे
  rationale: לִפְנֵי स्थानसूचक रूप से ‘के सामने/आगे’ है। इस पद में ‘वाचा’ शब्द नहीं है, इसलिए उसे जोड़े बिना ‘सन्दूक के आगे’ रखा गया है।
- source_word: תָּסֹבּוּ אֶת הָעִיר
  choice: तुम नगर के चारों ओर ... घूमना
  rationale: סבב का अर्थ ‘चारों ओर जाना/चक्कर लगाना’ है। आज्ञासूचक प्रसंग में ‘घूमना’ स्वाभाविक और स्पष्ट है तथा अनावश्यक रूप से सैन्य अर्थ नहीं जोड़ता।
- source_word: שֶׁבַע פְּעָמִים
  choice: सात बार
  rationale: दोहराई जाने वाली क्रिया के साथ פְּעָמִים का स्वाभाविक हिन्दी रूप ‘बार’ है।
- source_word: יִתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: नरसिंगे फूँकें
  rationale: תקע בְּשׁוֹפָר सींग-वाद्य फूँकने का सामान्य हिब्रू मुहावरा है। ‘फूँकें’ हिन्दी में क्रिया को प्रत्यक्ष और सहज रूप से व्यक्त करता है।
