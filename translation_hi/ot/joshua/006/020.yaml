  text: וַ/יָּ֣רַע הָ/עָ֔ם וַֽ/יִּתְקְע֖וּ בַּ/שֹּֽׁפָר֑וֹת וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הָ/עָ֜ם אֶת ק֣וֹל הַ/שּׁוֹפָ֗ר וַ/יָּרִ֤יעוּ הָ/עָם֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וַ/תִּפֹּ֨ל הַֽ/חוֹמָ֜ה תַּחְתֶּ֗י/הָ וַ/יַּ֨עַל הָ/עָ֤ם הָ/עִ֨ירָ/ה֙ אִ֣ישׁ נֶגְדּ֔/וֹ וַֽ/יִּלְכְּד֖וּ אֶת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/020.yaml
  text: So the people shouted[a], and they blew the trumpets. And when the people heard the sound of the trumpet, the people shouted a great shout, and the wall fell down beneath it, and the people went up into the city, each man straight before him[b], and they captured the city.
translation:
  language: hi
  text: तब लोगों ने पुकार लगाई और उन्होंने नरसिंगे फूँके[a]। जब लोगों ने नरसिंगे की ध्वनि सुनी, तो लोगों ने बड़ी पुकार लगाई, और शहरपनाह अपने ही नीचे गिर पड़ी[b]। तब लोग, हर व्यक्ति सीधे अपने सामने की ओर, नगर में चढ़ गए और उन्होंने नगर पर अधिकार कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नरसिंगा” इब्रानी शब्द शोफ़ार का अनुवाद है, जो संकेत देने के लिए फूँका जाने वाला सींग का वाद्य था। “तुरही” या “मेढ़े का सींग” भी संभावित अनुवाद हैं।
    reason: cultural_note
  - marker: b
    text: या, “शहरपनाह समतल होकर गिर पड़ी।” इब्रानी में शाब्दिक रूप से “शहरपनाह अपने नीचे गिर पड़ी” है। यह असामान्य अभिव्यक्ति संभवतः दीवार के सीधे नीचे ढह जाने का वर्णन करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרַע / וַיָּרִיעוּ / תְּרוּעָה
  choice: जयघोष किया / बड़े ज़ोर से जयघोष किया
  rationale: रूע और תְּרוּעָה ऊँची सामूहिक पुकार को सूचित करते हैं, जो यहाँ युद्ध-संदर्भ में है। ‘जयघोष’ स्वाभाविक हिन्दी है और ‘युद्धघोष’ की अपेक्षा मूल से अधिक विशिष्ट अर्थ नहीं जोड़ता।
- source_word: שׁוֹפָרוֹת / שׁוֹפָר
  choice: नरसिंगे / नरसिंगा
  rationale: שׁוֹפָר संकेत देने के लिए फूँका जाने वाला सींगनुमा वाद्य है। ‘नरसिंगा’ आधुनिक हिन्दी में इस सांस्कृतिक वस्तु का सुबोध निकटतम नाम है; इसे केवल पशु-सींग कहना वाद्य के रूप में इसके प्रयोग को कम स्पष्ट करता।
- source_word: קוֹל הַשּׁוֹפָר
  choice: नरसिंगे की ध्वनि
  rationale: קוֹל का वाद्य के साथ स्वाभाविक अर्थ ‘ध्वनि’ है; यह ‘आवाज़’ से अधिक गरिमापूर्ण और ‘नाद’ से अधिक सामान्यतः बोधगम्य है।
- source_word: וַתִּפֹּל הַחוֹמָה תַּחְתֶּיהָ
  choice: शहरपनाह अपने ही नीचे ढह गई
  rationale: असामान्य इब्रानी पदबंध का शाब्दिक भाव ‘दीवार अपने नीचे गिर गई’ है। हिन्दी में ‘अपने ही नीचे ढह गई’ उस असामान्यता और सीधे नीचे बैठ जाने के बिंब को यथासंभव बनाए रखता है; अधिक प्रचलित अर्थ फुटनोट में दिया गया है।
- source_word: וַיַּעַל ... הָעִירָה
  choice: नगर में चढ़ गए
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है और עִירָה का दिशासूचक रूप नगर की ओर तथा भीतर प्रवेश दर्शाता है।
- source_word: אִישׁ נֶגְדּוֹ
  choice: अपने-अपने सामने से सीधे
  rationale: אִישׁ यहाँ वितरणात्मक है और נֶגְדּוֹ हर व्यक्ति के ठीक सामने की दिशा बताता है। हिन्दी में ‘अपने-अपने सामने से सीधे’ उस व्यक्तिगत, सीधी बढ़त को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּלְכְּדוּ
  choice: नगर पर अधिकार कर लिया
  rationale: לכד सैन्य प्रसंग में किसी नगर को जीतकर अपने अधिकार में लेने के लिए प्रयुक्त होता है; यह हिन्दी में ‘पकड़ लिया’ से अधिक स्वाभाविक है।
theological_decisions:
- issue: אִישׁ נֶגְדּוֹ का पुल्लिंग वितरणात्मक प्रयोग
  choice: लोग अपने-अपने सामने से सीधे
  alternative: हर पुरुष अपने सामने सीधे
  rationale: इब्रानी אִישׁ एकवचन पुल्लिंग होते हुए यहाँ समूह के प्रत्येक सदस्य के लिए वितरणात्मक रूप से प्रयुक्त है। प्रसंग लड़ने वालों का है, पर हिन्दी में ‘लोग अपने-अपने’ मूल के वितरणात्मक बल को सुरक्षित रखते हुए अनावश्यक रूप से लिंग पर जोर नहीं देता; कोई धर्मवैज्ञानिक निष्कर्ष आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शहरपनाह’ से नगर को घेरे हुए रक्षात्मक दीवार स्पष्ट होती है। कथा की क्रमिक गति बनाए रखने के लिए छोटे, सक्रिय वाक्यांश और ‘जैसे ही… तब…’ संरचना अपनाई गई है।
