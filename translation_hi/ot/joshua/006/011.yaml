source:
  edition: WLC
  text: וַ/יַּסֵּ֤ב אֲרוֹן יְהוָה֙ אֶת הָ/עִ֔יר הַקֵּ֖ף פַּ֣עַם אֶחָ֑ת וַ/יָּבֹ֨אוּ֙ הַֽ/מַּחֲנֶ֔ה וַ/יָּלִ֖ינוּ בַּֽ/מַּחֲנֶֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/011.yaml
  text: So the ark of Yahweh went around the city[a], circling it once. Then they came into the camp and spent the night in the camp.
translation:
  language: hi
  text: इस प्रकार उसने यहोवा के सन्दूक को नगर के चारों ओर एक बार घुमवाया। फिर वे छावनी में आए और रात छावनी में बिताई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: चारों ओर ... चक्कर लगा आया
  rationale: हिफ़ील रूप यहाँ नगर की परिक्रमा करने की गति व्यक्त करता है। हिन्दी में यह वाक्यांश स्वाभाविक है और सन्दूक को इब्रानी के अनुसार व्याकरणिक कर्ता बनाए रखता है।
- source_word: אֲרוֹן יְהוָה
  choice: यहोवा का सन्दूक
  rationale: सम्बन्धवाचक रचना को सहज हिन्दी में रखा गया है और वाचा के निजी नाम יְהוָה को 'यहोवा' लिखा गया है।
- source_word: אֶת הָעִיר
  choice: नगर के चारों ओर
  rationale: सन्दर्भ में निश्चित नगर यरीहो है; मूल की तरह नाम दोहराए बिना 'नगर' रखा गया है। परिक्रमा के भाव के कारण हिन्दी में 'के चारों ओर' स्वाभाविक है।
- source_word: הַקֵּף פַּעַם אֶחָת
  choice: एक चक्कर
  rationale: यह अभिव्यक्ति पूर्ववर्ती क्रिया को स्पष्ट करती है कि नगर की परिक्रमा एक बार की गई। 'एक चक्कर' संक्षिप्त और वर्तमान हिन्दी में सहज है।
- source_word: וַיָּבֹאוּ הַמַּחֲנֶה
  choice: वे छावनी में आए
  rationale: בוא का सामान्य अर्थ आना या प्रवेश करना है। 'लौटे' सन्दर्भतः सम्भव है, पर क्रिया में निहित न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: וַיָּלִינוּ בַּמַּחֲנֶה
  choice: रात छावनी में ही बिताई
  rationale: לון का अर्थ रात बिताना है। 'ही' मूल में छावनी की पुनरावृत्ति से मिलने वाले बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के चतुरक्षरी निजी नाम को किसी उपाधि से बदलने के बजाय हिन्दी बाइबल-पाठकों में व्यापक रूप से पहचाने जाने वाले 'यहोवा' रूप में रखा गया है।
- issue: सन्दूक को क्रिया का कर्ता रखना
  choice: सन्दूक ... चक्कर लगा आया
  alternative: सन्दूक को ... घुमाया गया
  rationale: इब्रानी पाठ सन्दूक को व्याकरणिक कर्ता बनाता है। यद्यपि याजक उसे उठा रहे थे, मुख्य पाठ उस कथात्मक व्यक्तिकरण को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। 'सन्दूक', 'नगर' और 'छावनी' जैसे परिचित बाइबिलीय शब्द रखे गए हैं; मूल की संक्षिप्त कथात्मक गति तथा छावनी की पुनरावृत्ति का बल सुरक्षित है।
