  text: On the second day they went around the city once and returned to the camp[b][a]. Thus they did for six days.
translation:
  language: hi
  text: दूसरे दिन उन्होंने नगर का एक बार चक्कर लगाया[a] और छावनी में लौट आए। ऐसा उन्होंने छह दिन तक किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने नगर की एक बार परिक्रमा की।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से, “ऐसा उन्होंने छह दिन किया”; अर्थात यही क्रम छह दिन तक दोहराया गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: उन्होंने…चक्कर लगाया
  rationale: סבב यहाँ नगर के चारों ओर जाने को व्यक्त करता है। ‘चक्कर लगाया’ स्वाभाविक आधुनिक हिन्दी है और मूल में निहित परिक्रामी गति को बिना अतिरिक्त सैन्य भाव जोड़े व्यक्त करता है।
- source_word: הָעִיר
  choice: नगर
  rationale: עִיר का सामान्य अर्थ नगर/शहर है। ‘नगर’ इस ऐतिहासिक वर्णन में स्पष्ट, प्रचलित और गरिमापूर्ण है।
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: दूसरे दिन
  rationale: यह कालवाचक पद का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: פַּעַם אַחַת
  choice: एक बार
  rationale: हिब्रू पद का शाब्दिक और मुहावरेदार अर्थ ‘एक बार’ है।
- source_word: וַיָּשֻׁבוּ
  choice: और…लौट आए
  rationale: שׁוב का अर्थ लौटना है; ‘लौट आए’ कथात्मक क्रम और गन्तव्य की ओर वापसी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמַּחֲנֶה
  choice: छावनी में
  rationale: מַחֲנֶה का अर्थ छावनी/पड़ाव है। यहाँ गन्तव्य होने के कारण हिन्दी में ‘में’ स्वाभाविक है।
- source_word: כֹּה עָשׂוּ
  choice: ऐसा उन्होंने…किया
  rationale: כֹּה रीति या पूर्ववर्णित कार्य की ओर संकेत करता है और עשה सामान्य क्रिया ‘करना’ है। यह रूप हिब्रू के संक्षिप्त सार-वाक्य को बनाए रखता है।
- source_word: שֵׁשֶׁת יָמִים
  choice: छः दिन तक
  rationale: सन्दर्भ में यह अवधि और इसी क्रम की पुनरावृत्ति बताता है; ‘दिन तक’ हिन्दी में अवधि को स्पष्ट करता है।
