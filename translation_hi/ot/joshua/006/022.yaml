source:
  edition: WLC
  text: וְ/לִ/שְׁנַ֨יִם הָ/אֲנָשִׁ֜ים הַֽ/מְרַגְּלִ֤ים אֶת הָ/אָ֨רֶץ֙ אָמַ֣ר יְהוֹשֻׁ֔עַ בֹּ֖אוּ בֵּית הָ/אִשָּׁ֣ה הַ/זּוֹנָ֑ה וְ/הוֹצִ֨יאוּ מִ/שָּׁ֤ם אֶת הָֽ/אִשָּׁה֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ כַּ/אֲשֶׁ֥ר נִשְׁבַּעְתֶּ֖ם לָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/022.yaml
  text: And to the two men who had spied out the land[a], Joshua said, “Go into the house of the prostitute and bring out from there the woman and all that belongs to her, just as you swore to her.”
translation:
  language: hi
  text: तब यहोशू ने उन दो पुरुषों से, जिन्होंने देश की जासूसी की थी, कहा, “उस वेश्या के घर में जाओ और उस स्त्री को तथा जो कुछ उसका है, वह सब वहाँ से बाहर ले आओ, ठीक वैसे ही जैसे तुमने उससे शपथ खाई थी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִשְׁנַיִם הָאֲנָשִׁים
  choice: तब ... उन दो पुरुषों से
  rationale: वाव और लामेद कथानक में अगले संबोधन की ओर संक्रमण तथा संबोधित व्यक्तियों को चिह्नित करते हैं। हिन्दी में “तब ... से” स्वाभाविक रूप से यह संबंध व्यक्त करता है।
- source_word: הַמְרַגְּלִים אֶת הָאָרֶץ
  choice: जिन्होंने देश की जासूसी की थी
  rationale: רגל यहाँ गुप्त टोह या जासूसी करने के अर्थ में है। प्रसंग में कार्य पहले पूरा हो चुका है, इसलिए पूर्णभूत रूप स्वाभाविक है।
- source_word: בֵּית הָאִשָּׁה הַזּוֹנָה
  choice: उस वेश्या के घर
  rationale: זוֹנָה का सीधा आधुनिक हिन्दी समतुल्य “वेश्या” है; “उस स्त्री” जोड़ना हिन्दी में अनावश्यक रूप से बोझिल होता। בֵּית यहाँ निवास-स्थान है।
- source_word: וְהוֹצִיאוּ מִשָּׁם
  choice: वहाँ से बाहर ले आओ
  rationale: हिफ़ील रूप किसी को बाहर निकालने या ले आने का आदेश देता है; “वहाँ से” מִשָּׁם को स्पष्ट रखता है।
- source_word: אֶת הָאִשָּׁה וְאֶת כָּל אֲשֶׁר לָהּ
  choice: उस स्त्री को तथा जो कुछ उसका है, वह सब
  rationale: इब्रानी में “स्त्री” की पुनरावृत्ति सुरक्षित रखी गई है। व्यापक पदबंध को केवल संपत्ति तक सीमित न करके “जो कुछ उसका है” रखा गया है, क्योंकि संदर्भ में उसके संरक्षण में आए लोग भी सम्मिलित हैं।
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ
  choice: ठीक वैसे ही जैसे तुमने उससे शपथ खाई थी
  rationale: यह आदेश को उन पुरुषों द्वारा राहाब से खाई गई शपथ के अनुरूप ठहराता है। “शपथ खाना” वर्तमान मानक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: राहाब के लिए זוֹנָה का अनुवाद
  choice: वेश्या
  alternative: गणिका
  rationale: मूल शब्द यौन-वृत्ति करने वाली स्त्री को सीधे सूचित करता है। “वेश्या” स्पष्ट और आधुनिक है; “गणिका” साहित्यिक तथा संभावित रूप से भिन्न सामाजिक अर्थ वाला है।
- issue: כָּל אֲשֶׁר לָהּ का विस्तार
  choice: जो कुछ उसका है, वह सब
  alternative: उसकी सारी संपत्ति
  rationale: मूल अभिव्यक्ति व्यापक है और तत्काल संदर्भ में केवल भौतिक संपत्ति तक सीमित नहीं की जानी चाहिए। व्यापक हिन्दी पदबंध मूल की अर्थगत खुलावट बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज कथात्मक शैली। “पुरुषों” से वयस्क पुरुष स्पष्ट होते हैं; “आदमियों” की तुलना में यह बाइबिलीय गद्य में अधिक संतुलित है। किसी पादटिप्पणी की आवश्यकता नहीं है।
