  text: और उन्होंने लोगों से कहा, “आगे बढ़ो और नगर के चारों ओर घूमो; और हथियारबंद दल[a] याहवे के संदूक के आगे चले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अग्रिम दस्ता,” अर्थात संदूक के आगे चलनेवाले हथियारबंद लोग।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: और उन्होंने ... कहा
  rationale: बहुवचन क्रिया को बनाए रखते हुए क्रमिक कथानक का स्वाभाविक हिन्दी प्रवाह व्यक्त किया गया है।
- source_word: אֶל־הָעָם
  choice: लोगों से
  rationale: עָם का सामान्य अर्थ ‘लोग’ है; सैन्य प्रसंग के बावजूद इसे अनावश्यक रूप से ‘सेना’ तक सीमित नहीं किया गया।
- source_word: עִבְרוּ
  choice: आगे बढ़ो
  rationale: यहाँ עבר किसी नदी या सीमा को पार करने के बजाय जुलूस में आगे जाने की आज्ञा देता है।
- source_word: וְסֹבּוּ אֶת־הָעִיר
  choice: और नगर के चारों ओर घूमो
  rationale: סבב की स्थानिक क्रिया को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है, बिना अतिरिक्त सैन्य अर्थ जोड़े।
- source_word: וְהֶחָלוּץ
  choice: और हथियारबंद दल[a]
  rationale: חָלוּץ युद्ध के लिए हथियारबंद अथवा तैयार अग्रिम दल को दर्शाता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और उसकी अग्रिम भूमिका को पादटिप्पणी में दिया गया है।
- source_word: יַעֲבֹר
  choice: चले
  rationale: यह अपूर्ण क्रिया यहाँ निर्देशात्मक/आज्ञार्थक बल रखती है; हिन्दी में ‘चले’ उसी बल को सहज रूप से व्यक्त करता है।
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: याहवे के संदूक के आगे
  rationale: לִפְנֵי की सामने/आगे वाली स्थिति और אֲרוֹן का ‘संदूक’ अर्थ सीधे सुरक्षित रखे गए हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी पाठ में व्यक्तिगत दिव्य नाम सीधे आया है; इसलिए नाम को सुरक्षित रखने वाला ‘याहवे’ चुना गया, न कि उसे ‘प्रभु’ उपाधि से बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वाचा’ शब्द नहीं जोड़ा गया, क्योंकि इस पद के इब्रानी पाठ में केवल ‘याहवे का संदूक’ है।
