lexical_decisions:
- source_word: וִירִיחוֹ
  choice: यरीहो
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप रखा गया है। आरम्भिक וַ/וִ कथा को आगे बढ़ाने वाला संयोजक है; इस एक-वचन के स्वाभाविक हिन्दी वर्णन में अलग से ‘और’ जोड़ना आवश्यक नहीं है।
- source_word: סֹגֶרֶת וּמְסֻגֶּרֶת
  choice: पूरी तरह बन्द था
  rationale: एक ही धातु के सक्रिय और कर्मवाच्य रूपों का युग्म नगर के पूर्णतः बन्द और सुरक्षित किए जाने पर बल देता है। ‘पूरी तरह बन्द’ इस बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: यहाँ पूर्वसर्ग इस्राएल की उपस्थिति के कारण यरीहो के बन्द होने को बताता है। ‘डर के मारे’ सम्भव संदर्भगत अर्थ है, पर मूल में भय स्पष्ट रूप से नहीं कहा गया।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल की सन्तान’ है, पर यह पूरे इस्राएली समुदाय के लिए प्रचलित सामूहिक पद है। ‘इस्राएलियों’ साधारण पाठक के लिए स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: אֵין יוֹצֵא וְאֵין בָּא
  choice: न कोई बाहर जाता था और न कोई भीतर आता था
  rationale: दोहराया गया नकार नगर की पूर्ण नाकाबन्दी दर्शाता है। अपूर्ण भूतकालीन क्रियाएँ उस समय की जारी स्थिति को स्वाभाविक हिन्दी में व्यक्त करती हैं।
