base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/025.yaml
  text: But Joshua kept Rahab the prostitute alive[a], along with her father's household and all that belonged to her, and she has lived in the midst of Israel to this day[b], because she hid the messengers whom Joshua sent to spy out Jericho.
translation:
  language: hi
  text: परन्तु यहोशू ने राहाब नाम की वेश्या[a] को, उसके पिता के घराने को, और जो कुछ उसका था, उस सबको जीवित रखा। वह आज के दिन तक इस्राएल के बीच रहती है, क्योंकि उसने उन दूतों[b] को छिपा लिया था जिन्हें यहोशू ने यरीहो की टोह लेने भेजा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गणिका।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात वे पुरुष जिन्हें यहोशू ने यरीहो की टोह लेने भेजा था।
    reason: lexical_clarification
lexical_decisions:
- source_word: הַזּוֹנָה
  choice: वेश्या
  rationale: यह संज्ञा देह-व्यापार में लगी स्त्री को सूचित करती है। ‘वेश्या’ आधुनिक हिन्दी में स्पष्ट और सीधा शब्द है; ‘गणिका’ अधिक साहित्यिक और अर्थ की दृष्टि से कुछ संकीर्ण हो सकता है।
- source_word: בֵּית אָבִיהָ
  choice: उसके पिता का घराना
  rationale: इब्रानी पद का शाब्दिक अर्थ ‘उसके पिता का घर’ है, पर यहाँ आशय भवन से नहीं, पिता के अधीन परिवार अथवा गृहस्थी से है।
- source_word: כָּל אֲשֶׁר לָהּ
  choice: जो कुछ उसका था, वह सब
  rationale: यह व्यापक अभिव्यक्ति है, जिसमें उसकी संपत्ति तथा उससे जुड़े आश्रित सम्मिलित हो सकते हैं; अनुवाद किसी एक वर्ग तक अर्थ को सीमित नहीं करता।
- source_word: הֶחֱיָה
  choice: जीवित रखा
  rationale: חיה के हिफ़ईल रूप का कारणवाचक भाव ‘जीवित रखना’ है। यह ‘छोड़ दिया’ की अपेक्षा मूल क्रिया के अर्थ को अधिक निकटता से व्यक्त करता है।
- source_word: וַתֵּשֶׁב
  choice: रहती है
  rationale: ‘आज के दिन तक’ के साथ यह क्रिया अतीत से कथाकार के वर्तमान तक जारी निवास को बताती है; हिन्दी का वर्तमानकाल इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: इस्राएल के बीच
  rationale: यह मूल इब्रानी मुहावरे को निकटता से बनाए रखता है और राहाब के इस्राएल समुदाय के भीतर निवास को व्यक्त करता है, बिना उससे आगे कोई धर्मवैज्ञानिक निष्कर्ष निकाले।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज के दिन तक
  rationale: यह कथाकार के समय तक स्थिति के बने रहने को दर्शाने वाला स्वाभाविक हिन्दी रूप है।
- source_word: הֶחְבִּיאָה
  choice: छिपा लिया था
  rationale: यहाँ क्रिया का अर्थ किसी व्यक्ति को छिपाना या गुप्त रखना है; पूर्णभूत रूप मुख्य कथन से पहले हुई कार्रवाई को स्पष्ट करता है।
- source_word: הַמַּלְאָכִים
  choice: दूतों
  rationale: מַלְאָכִים का सामान्य अर्थ ‘दूत’ है। अगले वाक्यांश में उनकी टोह लेने की जिम्मेदारी स्पष्ट हो जाती है, इसलिए इसे सीधे ‘भेदिए’ कहना अनावश्यक रूप से विशिष्ट होगा।
- source_word: לְרַגֵּל
  choice: टोह लेने
  rationale: यहाँ רגל का अर्थ गुप्त रूप से स्थान का निरीक्षण या भेद लेना है। ‘टोह लेने’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: राहाब का इस्राएल के भीतर निरंतर निवास
  choice: वह आज के दिन तक इस्राएल के बीच रहती है
  alternative: वह इस्राएलियों के बीच बस गई और आज तक वहीं है
  rationale: चुना हुआ पाठ मूल के स्थानवाचक और कालवाचक कथन को सुरक्षित रखता है, पर राहाब की स्थिति के बारे में इस पद से आगे कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘घराना’, ‘जीवित रखा’ और ‘टोह लेने’ सामान्य पाठक के लिए सहज हैं तथा इब्रानी पदों के अर्थ के निकट भी रहते हैं।
