  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֶ/חָל֣וּץ הֹלֵ֔ךְ לִ/פְנֵי֙ הַ/כֹּ֣הֲנִ֔ים תקעו הַ/שּֽׁוֹפָר֑וֹת וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַחֲרֵ֣י הָ/אָר֔וֹן הָל֖וֹךְ וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/009.yaml
  text: And the armed men were going before the priests who were blowing the trumpets[a], and the rear guard was going behind the ark, while they kept blowing the trumpets.
translation:
  language: hi
  text: और हथियारबंद लोग उन याजकों के आगे-आगे चल रहे थे जो नरसिंगे[a] फूँक रहे थे, और पिछला रक्षक-दल संदूक के पीछे-पीछे चल रहा था; चलते-चलते नरसिंगे लगातार फूँके जा रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: शोफ़ार; पशु के सींग से बना फूँक-वाद्य, जिसे प्रायः “मेढ़े का सींग” भी कहा जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָלוּץ
  choice: हथियारबंद लोग
  rationale: यह पद युद्ध के लिए सुसज्जित उस दल को सूचित करता है जो जुलूस में आगे चल रहा था; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הֹלֵךְ
  choice: चल रहे थे
  rationale: कृदन्त रूप जुलूस के दौरान जारी क्रिया को व्यक्त करता है, जिसे हिन्दी का अपूर्ण भूतकाल स्वाभाविक रूप से दर्शाता है।
- source_word: לִפְנֵי
  choice: आगे-आगे
  rationale: यहाँ स्थान और जुलूस-क्रम का बोध है; दोहराव चलती हुई पंक्ति में आगे की स्थिति को सहज हिन्दी में व्यक्त करता है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: इब्रानी धार्मिक पद के लिए प्रचलित और गरिमापूर्ण हिन्दी शब्द।
- source_word: תקעו הַשּׁוֹפָרוֹת
  choice: नरसिंगे फूँक रहे थे
  rationale: व्यंजनरहित पाठ में תקעו रूप संदिग्ध दिख सकता है, पर वाक्य-संरचना और प्रसंग इसे याजकों की जारी क्रिया के रूप में समझने का समर्थन करते हैं। 'फूँक रहे थे' वाद्य बजाने की भौतिक क्रिया और उसकी निरंतरता दोनों रखता है।
- source_word: הַמְאַסֵּף
  choice: पिछला रक्षक-दल
  rationale: यह मार्च करती सेना के पीछे चलने वाले दल का सैनिक कार्य स्पष्ट करता है; केवल 'पीछे के लोग' की अपेक्षा अधिक सटीक है।
- source_word: אַחֲרֵי
  choice: पीछे-पीछे
  rationale: यहाँ स्थानगत अर्थ प्रमुख है और जुलूस में संदूक के पीछे चलने की जारी गति व्यक्त होती है।
- source_word: הָאָרוֹן
  choice: संदूक
  rationale: मूल में केवल 'संदूक' है; निकटवर्ती प्रसंग उसकी पहचान कराता है, इसलिए इस पद में 'वाचा का संदूक' जोड़ना आवश्यक नहीं।
- source_word: הָלוֹךְ וְתָקוֹעַ
  choice: चलते-चलते ... लगातार फूँके जा रहे थे
  rationale: यह रचना गति के साथ जारी अथवा बार-बार होने वाली फूँकने की क्रिया बताती है। हिन्दी में यह वाक्यांश उस दुहरे, निरंतर पक्ष को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּשּׁוֹפָרוֹת
  choice: नरसिंगे
  rationale: שׁוֹפָר सामान्य धातु की तुरही नहीं, बल्कि सींग से बना फूँक-वाद्य है। 'नरसिंगा' हिन्दी पाठक के लिए इस भेद को अपेक्षाकृत स्पष्ट रखता है; अधिक विशिष्ट जानकारी पादटिप्पणी में दी गई है।
