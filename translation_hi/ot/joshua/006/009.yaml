  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। 'आगे-आगे' और 'पीछे-पीछे' जुलूस की व्यवस्था को सहज रूप में दिखाते हैं। अंतिम उपवाक्य में कर्ता की संभावित अस्पष्टता को अनावश्यक रूप से किसी एक दल तक सीमित न करके निष्क्रिय रचना द्वारा सुरक्षित रखा गया है।
