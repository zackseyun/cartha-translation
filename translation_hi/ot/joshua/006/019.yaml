  yaml_path: translation/ot/joshua/006/019.yaml
  text: But all the silver and gold[a], and the vessels of bronze and iron, are holy to Yahweh[b]; they shall go into the treasury of Yahweh.
translation:
  language: hi
  text: परन्तु सारी चाँदी, सारा सोना, और काँसे और लोहे के पात्र यहोवा के लिए पवित्र हैं; वे यहोवा के भण्डार में जाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “पवित्र है” और “जाएगा” एकवचन हैं, क्योंकि सूचीबद्ध वस्तुओं को सामूहिक रूप से देखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: परन्तु सारी
  rationale: וְ यहाँ पिछले निषेध के विपरीत अपवाद को आगे बढ़ाता है, इसलिए ‘परन्तु’ प्रसंगानुकूल है; כֹּל का अर्थ ‘सारी’ है।
- source_word: כֶּסֶף וְ/זָהָב
  choice: चाँदी और सोना
  rationale: धातुओं की सूची में כֶּסֶף का अर्थ मुद्रा नहीं, चाँदी है; זָהָב सामान्यतः सोना है।
- source_word: וּ/כְלֵי נְחֹשֶׁת וּ/בַרְזֶל
  choice: और काँसे और लोहे के पात्र
  rationale: כְּלִי व्यापक रूप से वस्तु, उपकरण या पात्र हो सकता है; इस भण्डार-सन्दर्भ में ‘पात्र’ स्वाभाविक है। נְחֹשֶׁת के लिए प्राचीन धातु-सन्दर्भ में ‘काँसा’ उपयुक्त है।
- source_word: קֹדֶשׁ הוּא לַ/יהוָה
  choice: यहोवा के लिए पवित्र हैं
  rationale: इब्रानी में विधान एकवचन है और पूरी सूची को सामूहिक इकाई मानता है; हिन्दी में संयुक्त सूची के साथ बहुवचन ‘हैं’ स्वाभाविक है। ‘के लिए पवित्र’ समर्पित होने का भाव बनाए रखता है।
- source_word: אוֹצַר יְהוָה
  choice: यहोवा का भण्डार
  rationale: אוֹצָר का अर्थ भण्डार अथवा खजाना हो सकता है; समर्पित धातुओं और पात्रों के संग्रह-स्थान के लिए ‘भण्डार’ स्पष्ट और स्वाभाविक है।
- source_word: יָבֹוא
  choice: वे ... जाएँगे
  rationale: मूल क्रिया एकवचन है क्योंकि वस्तुओं को सामूहिक रूप में देखा गया है; हिन्दी में सूची के अनुसार बहुवचन स्वाभाविक है। कर्मवाच्य ‘लाए जाएँगे’ जोड़ना आवश्यक नहीं है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में वाचा-सूचक व्यक्तिगत नाम सीधे प्रयुक्त है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को उपाधि ‘प्रभु’ में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण बाइबलीय गद्य। मूल की सामूहिक एकवचन रचना को हिन्दी की स्वाभाविक बहुवचन सहमति में व्यक्त किया गया है; किसी अतिरिक्त कर्ता या कर्मवाच्य को नहीं जोड़ा गया।
