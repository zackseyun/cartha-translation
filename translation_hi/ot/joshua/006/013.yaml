  text: וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֜וֹת הַ/יֹּבְלִ֗ים לִ/פְנֵי֙ אֲר֣וֹן יְהוָ֔ה הֹלְכִ֣ים הָל֔וֹךְ וְ/תָקְע֖וּ בַּ/שּׁוֹפָר֑וֹת וְ/הֶ/חָלוּץ֙ הֹלֵ֣ךְ לִ/פְנֵי/הֶ֔ם וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַֽחֲרֵי֙ אֲר֣וֹן יְהוָ֔ה הולך וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/013.yaml
  text: And the seven priests[a], carrying seven ram’s-horn trumpets before the ark of Yahweh, were walking on and blowing the trumpets, and the armed men were going before them, and the rear guard was going behind the ark of Yahweh, while they went on blowing the trumpets.
translation:
  language: hi
  text: और वे सात याजक याहवे के सन्दूक के आगे मेढ़ों के सींगों की सात तुरहियाँ[a] लिए लगातार चलते और तुरहियाँ फूँकते रहे। हथियारबन्द पुरुष उनके आगे चल रहे थे, और पिछला दस्ता याहवे के सन्दूक के पीछे चल रहा था, जबकि चलते-चलते तुरहियाँ फूँकी जाती रहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सात योबेल-तुरहियाँ” अथवा “मेढ़ों के सात सींग।” इब्रानी अभिव्यक्ति उन शोफ़ारों को सूचित करती है जो मेढ़ों के सींगों से बने थे या उनसे सम्बन्धित थे।
    reason: शब्दार्थ के सम्भव वैकल्पिक रूपों को सुरक्षित रखना।
lexical_decisions:
- source_word: שׁוֹפְרוֹת הַיֹּבְלִים
  choice: मेढ़ों के सींगों की सात तुरहियाँ
  rationale: שׁוֹפָר सींग से बनी अथवा सींग-जैसी फूँककर बजाई जाने वाली तुरही है, और הַיֹּבְלִים यहाँ मेढ़ों से सम्बन्धित सींगों की ओर संकेत करता है। यह रूप सामग्री/सम्बन्ध और वाद्य के कार्य—दोनों को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यन्तरित किया गया है।
- source_word: הֹלְכִים הָלוֹךְ
  choice: लगातार चलते
  rationale: रूप में क्रिया के साथ infinitive absolute चलने की निरन्तरता और प्रगति पर बल देता है; ‘लगातार चलते’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: तुरहियाँ फूँकते रहे
  rationale: תקע के साथ שׁוֹפָר का स्वाभाविक अर्थ तुरही फूँकना है; ‘रहे’ जुलूस के दौरान जारी क्रिया को दर्शाता है।
- source_word: הֶחָלוּץ
  choice: हथियारबन्द पुरुष
  rationale: यह युद्ध के लिए सुसज्जित होकर आगे चलने वाले लोगों को सूचित करता है; यह पद सैन्य भूमिका को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: לִפְנֵיהֶם
  choice: उनके आगे
  rationale: स्थान-सूचक अर्थ को सीधे व्यक्त करता है; निकटतम स्वाभाविक पूर्वपद सात याजक हैं।
- source_word: הַמְאַסֵּף
  choice: पिछला दस्ता
  rationale: सैन्य अथवा जुलूस के सन्दर्भ में यह पीछे से समूचे दल की रक्षा करते हुए चलने वाले समूह को दर्शाता है।
- source_word: אַחֲרֵי אֲרוֹן יְהוָה
  choice: याहवे के सन्दूक के पीछे
  rationale: इस जुलूस में אַחֲרֵי का स्थान-सूचक अर्थ ‘पीछे’ है।
- source_word: הוֹלֵךְ וְתָקוֹעַ
  choice: जबकि तुरहियाँ लगातार फूँकी जा रही थीं
  rationale: इब्रानी रूप जारी गति और तुरही फूँकने की निरन्तर क्रिया को व्यक्त करता है। हिन्दी का कर्मवाच्य अन्तिम कर्ता को अनावश्यक रूप से निश्चित किए बिना दृश्य की निरन्तरता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का स्पष्ट प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि से प्रतिस्थापित किए बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: अन्तिम तुरही फूँकने वालों की पहचान
  choice: कर्मवाच्य—‘तुरहियाँ लगातार फूँकी जा रही थीं’
  alternative: ‘वे लगातार तुरहियाँ फूँकते जा रहे थे’
  rationale: अन्तिम इब्रानी वाक्यांश जुलूस और तुरही-ध्वनि की जारी क्रिया बताता है, पर निकटवर्ती एकवचन ‘पिछला दस्ता’ और प्रसंग में तुरही लिए याजक कर्ता-सन्दर्भ को तनावपूर्ण बनाते हैं। कर्मवाच्य इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याजक’, ‘सन्दूक’, ‘तुरही’, ‘हथियारबन्द पुरुष’ और ‘पिछला दस्ता’ परिचित तथा प्रसंगानुकूल पद हैं। अनावश्यक रूप से ‘वाचा का सन्दूक’ नहीं जोड़ा गया, क्योंकि इस पद में ‘वाचा’ शब्द उपस्थित नहीं है।
