lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: सुबह तड़के उठा
  rationale: हिफ़ील रूप का अर्थ प्रायः बहुत सवेरे उठना या जल्दी आरम्भ करना है। यह प्रयोग समय के बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: בַּבֹּקֶר
  choice: सुबह
  rationale: इसका शाब्दिक अर्थ ‘सुबह में’ है; वַיַּשְׁכֵּם के साथ ‘सुबह तड़के’ स्वाभाविक हिन्दी में आरम्भिक प्रातःकाल का भाव व्यक्त करता है।
- source_word: וַיִּשְׂאוּ
  choice: उठाया
  rationale: נשא का अर्थ उठाना, ढोना या लेकर चलना हो सकता है। यहाँ याजकों द्वारा सन्दूक उठाए जाने के आरम्भिक कार्य को ‘उठाया’ स्पष्ट और प्रसंगानुकूल रूप से व्यक्त करता है, जबकि ‘लेकर चले’ गति का ऐसा तत्व जोड़ सकता है जो इस क्रिया में स्वयं अनिवार्य नहीं है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: निश्चित बहुवचन संज्ञा का स्वाभाविक हिन्दी रूप; परसर्ग के कारण तिर्यक बहुवचन प्रयुक्त है।
- source_word: אֲרוֹן
  choice: सन्दूक
  rationale: पवित्र सन्दूक के लिए स्पष्ट और प्रचलित हिन्दी शब्द। मूल में इस पद पर ‘वाचा’ नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम का हिन्दी लिप्यंतरण, जिससे मूल में प्रयुक्त व्यक्तिगत वाचा-नाम शीर्षक से प्रतिस्थापित नहीं होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में ईश्वर का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका स्रोत-संगत लिप्यंतरण है; पादटिप्पणी पाठकों को हिन्दी में प्रचलित वैकल्पिक रूपों से अवगत कराती है, बिना मुख्य पाठ में नाम को किसी उपाधि से बदलने के।
- issue: אֲרוֹן में ‘वाचा’ शब्द जोड़ना
  choice: सन्दूक
  alternative: वाचा का सन्दूक
  rationale: इस पद में केवल ‘याहवे का सन्दूक’ है। ‘वाचा’ कहना व्यापक बाइबलीय पहचान के अनुरूप हो सकता है, पर वह यहाँ स्पष्टतः लिखे शब्द से अधिक जोड़ देगा।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘सुबह तड़के’ इब्रानी की आरम्भिक प्रातःकाल वाली पुनरुक्ति को स्वाभाविक हिन्दी में व्यक्त करता है। ‘सन्दूक’ के साथ अनावश्यक रूप से ‘वाचा’ नहीं जोड़ा गया।
