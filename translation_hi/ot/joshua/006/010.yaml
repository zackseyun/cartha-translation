  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। आदेश की दृढ़ता तथा ‘जयघोष’ की तीन बार की पुनरावृत्ति सुरक्षित है। वाक्य-विन्यास मूल के क्रम के निकट है, पर हिन्दी में सहज प्रवाह के लिए सर्वनाम और निषेध की रचना स्वाभाविक की गई है।
