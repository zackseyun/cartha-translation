base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/010.yaml
  text: And Joshua commanded the people[a], saying, “Do not shout, and do not let your voice be heard, and do not let a word go out from your mouth until the day I say to you[b], ‘Shout!’ Then you shall shout.”
translation:
  language: hi
  text: और यहोशू ने लोगों को आज्ञा दी, “तुम ऊँची पुकार मत करना, न अपनी आवाज़ सुनाई देने देना, और न अपने मुँह से कोई शब्द निकलने देना, उस दिन तक जब मैं तुमसे कहूँ, ‘ऊँची पुकार करो!’ तब तुम ऊँची पुकार करोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִוָּה
  choice: आज्ञा दी
  rationale: यह क्रिया अधिकारपूर्वक दिए गए आदेश को व्यक्त करती है; ‘आज्ञा दी’ आधुनिक हिन्दी में इसके बल को स्वाभाविक रूप से बनाए रखती है।
- source_word: הָעָם
  choice: लोगों
  rationale: इब्रानी में सामान्य शब्द ‘लोग/प्रजा’ है। सैन्य प्रसंग के बावजूद ‘सेना’ या ‘सैनिक’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: לֹא תָרִיעוּ / הָרִיעוּ / וַהֲרִיעֹתֶם
  choice: जयघोष करना / जयघोष करो / जयघोष करना
  rationale: रוע के हिफ़ील रूप का अर्थ ऊँची सामूहिक पुकार है, जो युद्ध या विजय के प्रसंग में जयघोष अथवा युद्ध-नाद हो सकती है। तीनों स्थानों पर एक ही पद रखकर मूल की पुनरावृत्ति सुरक्षित की गई है।
- source_word: וְלֹא תַשְׁמִיעוּ אֶת קוֹלְכֶם
  choice: न अपनी आवाज़ सुनाई देने देना
  rationale: שׁמע का हिफ़ील यहाँ कारणवाचक है—‘अपनी आवाज़ को सुनाई देना।’ चुना हुआ रूप हिन्दी में स्वाभाविक रहते हुए इस संरचना को व्यक्त करता है।
- source_word: וְלֹא יֵצֵא מִפִּיכֶם דָּבָר
  choice: न अपने मुँह से कोई शब्द निकलने देना
  rationale: मूल के ‘मुँह से शब्द निकलना’ रूपक को रखा गया है; हिन्दी में ‘कोई शब्द’ निषेध के भीतर ‘एक भी शब्द नहीं’ का अर्थ स्वाभाविक रूप से देता है।
- source_word: עַד יוֹם אָמְרִי אֲלֵיכֶם
  choice: उस दिन तक जब मैं तुमसे कहूँ
  rationale: ‘दिन’ की ठोस काल-संज्ञा और प्रथम पुरुष कथन दोनों सुरक्षित रखे गए हैं, बिना इसे केवल ‘समय’ बनाकर सामान्यीकृत किए।
