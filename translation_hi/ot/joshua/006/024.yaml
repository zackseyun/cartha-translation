  text: וְ/הָ/עִ֛יר שָׂרְפ֥וּ בָ/אֵ֖שׁ וְ/כָל אֲשֶׁר בָּ֑/הּ רַ֣ק הַ/כֶּ֣סֶף וְ/הַ/זָּהָ֗ב וּ/כְלֵ֤י הַ/נְּחֹ֨שֶׁת֙ וְ/הַ/בַּרְזֶ֔ל נָתְנ֖וּ אוֹצַ֥ר בֵּית יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/024.yaml
  text: And they burned the city with fire[a], and everything that was in it. Only the silver and the gold, and the articles of bronze and iron, they put into the treasury of the house of Yahweh.
translation:
  language: hi
  text: उन्होंने नगर और उसमें जो कुछ था, सबको आग से जला दिया। केवल चाँदी, सोना और काँसे तथा लोहे की वस्तुएँ[a] उन्होंने याहवे के भवन के भण्डार में रख दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘काँसे तथा लोहे के पात्र।’ इब्रानी शब्द का अर्थ व्यापक है और वह पात्रों, औज़ारों या अन्य वस्तुओं के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: आग से जला दिया
  rationale: שׂרף का क़ाल रूप सक्रिय बहुवचन क्रिया है और בָאֵשׁ यहाँ साधन बताता है; यह हिन्दी में स्वाभाविक रूप से ‘आग से जला दिया’ है।
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: और उसमें जो कुछ था, सबको
  rationale: यह पदबंध नगर के भीतर की सभी वस्तुओं और सामग्री को समग्र रूप से दर्शाता है; हिन्दी वाक्य में ‘जो कुछ...सब’ इस व्यापकता को स्पष्ट और सहज रखता है।
- source_word: רַק
  choice: केवल
  rationale: यह पहले बताए गए पूर्ण विनाश में धातुओं के अपवाद को चिह्नित करता है।
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: चाँदी, सोना
  rationale: निश्चित रूपों का हिन्दी में पृथक निर्देशवाचक शब्द के बिना यह स्वाभाविक और सूची-जैसा अनुवाद है।
- source_word: וּכְלֵי הַנְּחֹשֶׁת וְהַבַּרְזֶל
  choice: काँसे तथा लोहे की वस्तुएँ
  rationale: כְּלֵי व्यापक शब्द है, जो पात्रों, औज़ारों या अन्य निर्मित वस्तुओं को सूचित कर सकता है; ‘वस्तुएँ’ इसकी अर्थ-व्याप्ति को अनावश्यक रूप से सीमित नहीं करता। נְחֹשֶׁת का यहाँ संभावित व्यावहारिक अर्थ ‘काँसा’ है।
- source_word: נָתְנוּ
  choice: रख दीं
  rationale: נתן का मूल अर्थ ‘देना/रखना’ व्यापक है; भण्डार में धातुएँ जमा करने के प्रसंग में ‘रख दीं’ स्वाभाविक है।
- source_word: אוֹצַר בֵּית יְהוָה
  choice: याहवे के भवन के भण्डार
  rationale: यह रचना याहवे के भवन से सम्बद्ध मूल्यवान वस्तुओं के भण्डार को दर्शाती है। ‘भवन’ मूल בֵּית को बनाए रखता है और बाद के स्थायी मन्दिर को अनावश्यक रूप से नहीं मान लेता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यन्तरण है और उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: धातुओं का पवित्र भण्डार में रखा जाना
  choice: याहवे के भवन के भण्डार में रख दीं
  alternative: याहवे के भवन के लिए भण्डार में दे दीं
  rationale: सम्बन्धसूचक रचना भण्डार को याहवे के भवन से जोड़ती है; चुना हुआ रूप समर्पण की पृष्ठभूमि में पाठ से अधिक कोई अनुष्ठानिक विवरण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘भण्डार’ और ‘भवन’ प्रसंग के धार्मिक स्वर को बनाए रखते हैं, जबकि भाषा सामान्य पाठक के लिए सुबोध है।
