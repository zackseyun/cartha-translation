base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/017.yaml
  text: And the city and all that is in it shall be devoted to destruction for Yahweh[a]. Only Rahab the prostitute shall live, she and all who are with her in the house[b], because she hid the messengers whom we sent.
translation:
  language: hi
  text: और वह नगर और जो कुछ उसमें है, वह सब यहोवा के लिए विनाशार्थ समर्पित होगा।[a] केवल राहाब वेश्या जीवित रहेगी—वह और वे सब जो घर में उसके साथ हैं—क्योंकि उसने उन दूतों को छिपाया जिन्हें हमने भेजा था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रतिबंध के अधीन।” इब्रानी शब्द ऐसी वस्तु को दर्शाता है जो अपरिवर्तनीय रूप से यहोवा को समर्पित हो; यहाँ उसका समर्पण विनाश के द्वारा होना है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “दूतों।” प्रसंग में ये वे पुरुष हैं जिन्हें यहोशू ने देश का भेद लेने के लिए भेजा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרֶם
  choice: नाश के लिए समर्पित
  rationale: यह विजय-वर्णन में ऐसी वस्तु या जनसमुदाय को सूचित करता है जो अपरिवर्तनीय रूप से यहोवा को अर्पित है और यहाँ विनाश के द्वारा अर्पित किया जाता है। यह रूप समर्पण और विनाश दोनों पक्षों को बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ल उपसर्ग समर्पण के लक्ष्य को दर्शाता है। परमेश्वर के व्यक्तिगत नाम יהוה को यहाँ ‘यहोवा’ से व्यक्त किया गया है।
- source_word: רַק
  choice: केवल
  rationale: यह नगर के सर्वनाश से एकमात्र अपवाद का परिचय देता है।
- source_word: הַזּוֹנָה
  choice: वेश्या
  rationale: यह आधुनिक, स्पष्ट और अनार्काइक हिन्दी में राहाब की बताई गई स्थिति या पेशे को व्यक्त करता है।
- source_word: תִּחְיֶה
  choice: जीवित रहेगी
  rationale: मूल क्रिया के ‘जीना/जीवित रहना’ अर्थ को सीधे रखता है और विनाश के साथ विरोध स्पष्ट करता है।
- source_word: אִתָּהּ בַּבַּיִת
  choice: उसके साथ घर में
  rationale: यह उन लोगों के घर में राहाब के साथ भौतिक रूप से उपस्थित होने को सीधे व्यक्त करता है, न कि सामान्यतः पूरे घराने को।
- source_word: הֶחְבְּאַתָה
  choice: उसने ... छिपाया था
  rationale: हिफ़ील रूप का सीधा अर्थ छिपाना है; हिन्दी में पूर्वघटित कार्य के लिए पूर्ण भूतकाल स्वाभाविक है।
- source_word: הַמַּלְאָכִים
  choice: दूतों
  rationale: מַלְאָךְ का मूल अर्थ दूत या संदेशवाहक है। प्रसंग में ये यहोशू द्वारा भेजे गए मनुष्य हैं; ‘जासूस’ अधिक प्रसंगात्मक व्याख्या होती।
- source_word: שָׁלָחְנוּ
  choice: जिन्हें हमने भेजा था
  rationale: यह पहले हो चुके भेजने के कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהָיְתָה הָעִיר ... הִיא וְכָל אֲשֶׁר בָּהּ
  choice: और वह नगर और जो कुछ उसमें है, वह सब ... होगा
  rationale: ‘वह सब’ इब्रानी के पुनरुक्त सर्वनाम से मिलने वाले बल को पठनीय हिन्दी में बनाए रखता है।
theological_decisions:
- issue: विजय-संबंधी חֵרֶם का अनुवाद
  choice: नाश के लिए समर्पित
  alternative: प्रतिबंध के अधीन; सर्वनाश के लिए अलग किया हुआ; शापित
  rationale: यह न्याय की कठोरता को कम नहीं करता, फिर भी नगर को केवल ‘शापित’ बताने की भ्रामक धारणा से बचता है। यह यहोवा को समर्पण और विनाश, दोनों अर्थ-तत्त्वों को सुरक्षित रखता है।
- issue: יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में उपस्थित परमेश्वर के व्यक्तिगत नाम को नाम के रूप में स्पष्ट रखता है और לַיהוָה में समर्पण के लक्ष्य को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्पष्ट और गरिमापूर्ण शैली। ‘नाश के लिए समर्पित’ जानबूझकर मूल की धार्मिक और विनाशकारी दोनों धाराओं को रखता है। वाक्य में डैश राहाब और उसके साथ घर में उपस्थित लोगों को एक संयुक्त अपवाद के रूप में सहजता से स्पष्ट करते हैं।
