  text: וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל אֲשֶׁ֣ר בָּ/עִ֔יר מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן וְ/עַ֨ד שׁ֥וֹר וָ/שֶׂ֛ה וַ/חֲמ֖וֹר לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/021.yaml
  text: And they devoted to destruction everything that was in the city[a], from man to woman, from young to old, and even ox and sheep and donkey, by the edge of the sword.
translation:
  language: hi
  text: और उन्होंने नगर में जो कुछ था, उस सबको—पुरुष से लेकर स्त्री तक, बच्चे से लेकर बूढ़े तक, यहाँ तक कि बैल, भेड़ और गधे को भी—तलवार की धार से विनाश के लिए समर्पित कर दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पूरी तरह नष्ट कर दिया” अथवा “हेरम के अधीन कर दिया।” हिब्रू क्रिया का अर्थ किसी व्यक्ति या वस्तु को हेरम के अधीन अपरिवर्तनीय ढंग से विनाश के लिए समर्पित करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִימוּ
  choice: विनाश के लिए अर्पित कर दिया
  rationale: हिफ़इल रूप यहाँ केवल मार डालने का सामान्य अर्थ नहीं, बल्कि किसी व्यक्ति या वस्तु को हेरम के अधीन अपरिवर्तनीय रूप से विनाश के लिए ठहराने का तकनीकी भाव रखता है। यह हिंदी पदबंध उस भाव को स्पष्ट और स्वाभाविक ढंग से बनाए रखता है।
- source_word: כָּל אֲשֶׁר בָּעִיר
  choice: नगर में जो कुछ था, उस सबको
  rationale: यह व्यापक अभिव्यक्ति आगे गिनाए गए सभी मनुष्यों और पशुओं को समेटती है तथा मूल की समग्रता को स्वाभाविक हिंदी में व्यक्त करती है।
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: पुरुष से लेकर स्त्री तक
  rationale: मूल के एकवचन वितरणात्मक और समावेशी छोरों को निकटता से सुरक्षित रखता है।
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: बच्चे से लेकर बूढ़े तक
  rationale: यह आयु-सीमा सूचक युग्म है। यहाँ נַעַר के लिए 'बच्चा' संदर्भ में आयु-विपरीतता को साधारण आधुनिक हिंदी में स्पष्ट करता है, जबकि 'बूढ़ा' दूसरे छोर को बनाए रखता है।
- source_word: וְעַד שׁוֹר וָשֶׂה וַחֲמוֹר
  choice: यहाँ तक कि बैल, भेड़ और गधे को भी
  rationale: וְעַד की विस्तारित समावेशी शक्ति को पशुधन तक पहुँचाते हुए हिंदी में स्वाभाविक बनाया गया है; एकवचन जातिवाचक संज्ञाएँ मूल के अनुरूप रखी गई हैं।
- source_word: לְפִי חָרֶב
  choice: तलवार की धार से
  rationale: यह तलवार से मारने का प्रचलित हिब्रू मुहावरा है। 'धार' मूल के चित्र को बनाए रखती है और हिंदी में सहज है।
theological_decisions:
- issue: युद्ध-संदर्भ में חרם की तकनीकी भाषा
  choice: विनाश के लिए अर्पित कर दिया
  alternative: पूरी तरह नष्ट कर दिया; हेरम के अधीन कर दिया
  rationale: चुना गया रूप केवल विनाश की घटना नहीं, बल्कि विनाश के लिए अपरिवर्तनीय रूप से अलग कर दिए जाने का धार्मिक-वाचा संबंधी आयाम भी सुरक्षित रखता है। 'हेरम' को मुख्य पाठ में रखने से सामान्य पाठक के लिए अस्पष्ट तकनीकी शब्द आ जाता, जबकि 'पूरी तरह नष्ट कर दिया' इस विशिष्ट आयाम को समतल कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रूप। वाक्य की कठोरता को न नरम किया गया है, न व्याख्यात्मक विस्तार से बढ़ाया गया है। विराम-चिह्नों द्वारा लंबी सूची और मुख्य क्रिया का संबंध स्पष्ट किया गया है।
