base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/027.yaml
  text: And Yahweh was with Joshua[a], and his fame was in all the land.
translation:
  language: hi
  text: और याहवे यहोशू के साथ था, और उसकी ख्याति सारे देश में थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: וַיְהִי
  choice: था / फैल गई
  rationale: पहले प्रयोग में यह साधारण भूतकालीन संबंधसूचक क्रिया है। दूसरे प्रयोग में हिन्दी की स्वाभाविक अभिव्यक्ति के लिए अस्तित्व के भाव को ‘फैल गई’ से व्यक्त किया गया है।
- source_word: אֶת יְהוֹשֻׁעַ
  choice: यहोशू के साथ
  rationale: היה के साथ אֶת यहाँ संगति और सहायक उपस्थिति का अर्थ देता है; व्यक्ति के नाम का मानक हिन्दी रूप ‘यहोशू’ रखा गया है।
- source_word: שָׁמְעוֹ
  choice: उसकी ख्याति
  rationale: शब्द का अर्थ समाचार, चर्चा, रिपोर्ट या प्रतिष्ठा हो सकता है। यरीहो-विजय के बाद के प्रसंग में ‘ख्याति’ यहोशू की बढ़ती प्रसिद्धि को स्वाभाविक हिन्दी में व्यक्त करती है, जबकि पादटिप्पणी मूल की व्यापक अर्थ-सीमा सुरक्षित रखती है।
- source_word: בְּכָל הָאָרֶץ
  choice: सारे देश में
  rationale: यहाँ הָאָרֶץ का संकेत कथा में उल्लिखित स्थानीय देश से है, पूरी पृथ्वी से नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से प्रतिस्थापित न करके उसका लिप्यंतरण किया गया है; इससे मूल पाठ का नाम-संबंधी स्वरूप बना रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फैल गई’ मूल के शाब्दिक ‘थी’ की अपेक्षा हिन्दी में व्यापक प्रसिद्धि का भाव अधिक स्वाभाविक ढंग से व्यक्त करता है; अर्थगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
