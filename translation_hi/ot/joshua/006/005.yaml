- from: और जब मेढ़े के सींग को देर तक फूँका जाए[a], तब सींग की ध्वनि सुनते ही सारी प्रजा ज़ोरदार जयघोष करे। तब नगर की दीवार अपने नीचे ही ढह जाएगी[b], और लोग चढ़ जाएँगे—हर एक अपने सामने सीधे आगे[c]।
  to: और जब मेढ़े के सींग को देर तक फूँका जाए[a], तब जब तुम सींग की ध्वनि सुनो, तो सारे लोग एक बड़ी पुकार लगाएँ। तब नगर की दीवार अपने नीचे ही ढह जाएगी[b], और लोग चढ़ जाएँगे—हर एक सीधे अपने सामने की ओर[c]।
