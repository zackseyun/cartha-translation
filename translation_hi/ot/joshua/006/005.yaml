source:
  edition: WLC
  text: וְ/הָיָ֞ה בִּ/מְשֹׁ֣ךְ בְּ/קֶ֣רֶן הַ/יּוֹבֵ֗ל ב/שמע/כם אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר יָרִ֥יעוּ כָל הָ/עָ֖ם תְּרוּעָ֣ה גְדוֹלָ֑ה וְ/נָ֨פְלָ֜ה חוֹמַ֤ת הָ/עִיר֙ תַּחְתֶּ֔י/הָ וְ/עָל֥וּ הָ/עָ֖ם אִ֥ישׁ נֶגְדּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/005.yaml
  text: And when the ram's horn is drawn out[a], when you hear the sound of the trumpet, all the people shall raise a great shout, and the wall of the city will fall beneath itself, and the people shall go up[c][b], each man straight before him.
translation:
  language: hi
  text: और जब मेढ़े के सींग को देर तक फूँका जाए[a], तब जब तुम सींग की ध्वनि सुनो, तो सारे लोग एक बड़ी पुकार लगाएँ। तब नगर की दीवार अपने नीचे ही ढह जाएगी[b], और लोग चढ़ जाएँगे—हर एक सीधे अपने सामने की ओर[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जब मेढ़े के सींग की ध्वनि लंबी खींची जाए।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘नगर की दीवार अपने नीचे ही गिर पड़ेगी’; सम्भवतः आशय है कि वह सीधे नीचे ढह जाएगी।
    reason: lexical_alternative
  - marker: c
    text: या ‘हर एक अपने ठीक सामने की ओर चढ़ जाए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְשֹׁךְ
  choice: देर तक फूँका जाए
  rationale: यहाँ משׁך सींग की ध्वनि को लंबा खींचने का मुहावरा है। यह अनुवाद उस अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קֶרֶן הַיּוֹבֵל
  choice: मेढ़े का सींग
  rationale: इस प्रसंग में יוֹבֵל उत्सव-वर्ष नहीं, फूँककर बजाया जाने वाला मेढ़े का सींग है।
- source_word: ק֣וֹל הַשּׁוֹפָר
  choice: सींग की ध्वनि
  rationale: שׁוֹפָר पशु-सींग से बना वाद्य है। ‘सींग की ध्वनि’ सामान्य पाठक को अर्थ स्पष्ट करता और पहले पदबंध से संबंध बनाए रखता है।
- source_word: יָרִיעוּ ... תְּרוּעָה גְדוֹלָה
  choice: ज़ोरदार जयघोष करे
  rationale: क्रिया और उसी मूल से बने संज्ञापद का संयुक्त भाव ऊँची सामूहिक पुकार है। ‘ज़ोरदार जयघोष’ हिन्दी में संक्षिप्त और स्वाभाविक है, यद्यपि ‘युद्धघोष’ भी प्रसंगानुकूल हो सकता है।
- source_word: תַּחְתֶּיהָ
  choice: अपने नीचे ही
  rationale: शाब्दिक स्थानिक और आत्म-संदर्भित चित्र को बनाए रखा गया है; आशय सम्भवतः दीवार का सीधे नीचे ढहना है।
- source_word: וְעָלוּ
  choice: चढ़ जाएँगे
  rationale: עלה का मूल अर्थ ऊपर जाना या चढ़ना है; घेराबंदी के प्रसंग में यह नगर की ओर बढ़ने को दर्शाता है, पर ‘धावा बोलेंगे’ जैसी अतिरिक्त सैन्य व्याख्या नहीं जोड़ी गई।
- source_word: אִישׁ נֶגְדּוֹ
  choice: हर एक अपने सामने सीधे आगे
  rationale: 'इब्रानी का वितरणात्मक और स्थानिक भाव रखा गया है: प्रत्येक व्यक्ति अपने ठीक सामने की दिशा में आगे बढ़ेगा।'
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। ‘प्रजा’ सामूहिक עָם के लिए और ‘हर एक’ वितरणात्मक אִישׁ के लिए प्रयुक्त है। मूल के असामान्य स्थानिक चित्र को मुख्य पाठ और टिप्पणी दोनों में सुरक्षित रखा गया है।
