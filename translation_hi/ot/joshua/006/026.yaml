base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/026.yaml
  text: At that time Joshua made them swear[a], saying, “Cursed before Yahweh is the man who rises up and rebuilds this city, Jericho. At the cost of his firstborn he will lay its foundation[c][b], and at the cost of his youngest he will set up its gates.”
translation:
  language: hi
  text: 'उस समय यहोशू ने लोगों को शपथ दिलाई और कहा: “जो कोई उठकर इस नगर यरीहो को फिर से बनाए, वह यहोवा के सामने शापित हो![b] अपने पहलौठे की कीमत पर वह इसकी नींव डालेगा और अपने सबसे छोटे की कीमत पर इसके फाटक खड़े करेगा।”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: शाब्दिक रूप से, “वह मनुष्य शापित हो जो उठकर इस नगर को फिर से बनाए।” इब्रानी में “मनुष्य” पुल्लिंग एकवचन है, पर यहाँ किसी भी ऐसे व्यक्ति के लिए सामान्य रूप में प्रयुक्त है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “अपने पहलौठे में/के साथ ... और अपने सबसे छोटे में/के साथ।” यहाँ इसका अर्थ संभवतः उनके खोने या उनकी कीमत चुकाने के साथ है; पद यह नहीं बताता कि यह हानि किस प्रकार होगी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: ने लोगों को यह शपथ दिलाई
  rationale: हिफ़ील रूप का कारक अर्थ है कि यहोशू ने उपस्थित लोगों को शपथ दिलाई; हिन्दी में संदर्भ से ‘लोगों को’ स्पष्ट करना स्वाभाविक है।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह सामान्य कालवाचक अभिव्यक्ति का सहज और गरिमापूर्ण हिन्दी रूप है।
- source_word: אָרוּר הָאִישׁ לִפְנֵי יְהוָה
  choice: जो कोई ... वह यहोवा के सामने शापित हो
  rationale: शाप-वचन की गंभीरता और यहोवा की उपस्थिति का भाव सुरक्षित रहता है। ‘जो कोई’ यहाँ व्याकरणतः पुल्लिंग एकवचन הָאִישׁ के सामान्य, सार्वत्रिक कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָקוּם וּבָנָה
  choice: उठकर ... फिर से बनाए
  rationale: नगर के नष्ट हो चुकने के संदर्भ में क्रियायुग्म पुनर्निर्माण का उपक्रम बताता है; ‘फिर से बनाए’ इसे स्पष्ट करता है।
- source_word: בִּבְכֹרוֹ ... וּבִצְעִירוֹ
  choice: अपने पहलौठे की कीमत पर ... अपने सबसे छोटे पुत्र की कीमत पर
  rationale: पूर्वसर्ग בְּ यहाँ संभावित रूप से हानि या मूल्य का भाव देता है। ‘की कीमत पर’ उस गंभीर परिणाम को व्यक्त करता है, पर मृत्यु या बलिदान की विधि निर्दिष्ट नहीं करता।
- source_word: יְיַסְּדֶנָּה
  choice: वह इसकी नींव डालेगा
  rationale: יסד का ठोस निर्माण-संबंधी अर्थ और स्त्रीलिंग प्रत्यय का नगर की ओर संकेत दोनों सुरक्षित हैं।
- source_word: יַצִּיב דְּלָתֶיהָ
  choice: इसके फाटक खड़े करेगा
  rationale: नगर के संदर्भ में דְּלָתוֹת प्रवेश-द्वारों के पल्लों अथवा फाटक-व्यवस्था को सूचित करता है; यह हिन्दी में स्वाभाविक निर्माण-वाक्यांश है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू व्यक्तिवाचक दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: यहोशू के कथन का स्वरूप
  choice: यहोवा की उपस्थिति में पुनर्निर्माता पर घोषित गंभीर शाप
  alternative: यहोशू की केवल निजी इच्छा अथवा विशुद्ध नागरिक निषेध
  rationale: ‘यहोवा के सामने शापित’ वाचा-संबंधी और धार्मिक गंभीरता रखता है; अनुवाद इससे अधिक कोई तंत्र या अधिकार-सिद्धांत नहीं जोड़ता।
- issue: पहलौठे और सबसे छोटे पुत्र से जुड़ी कीमत
  choice: नगर के पुनर्निर्माण के आरंभ और पूर्णता से जुड़ी पुत्रों की गंभीर हानि
  alternative: स्पष्टतः बाल-बलि, अथवा केवल अनिर्दिष्ट दुर्भाग्य
  rationale: हिब्रू हानि या मूल्य का भाव दे सकता है, लेकिन उसकी सटीक प्रक्रिया नहीं बताता। इसलिए ‘की कीमत पर’ अर्थ को संप्रेषित करते हुए वास्तविक अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘शपथ दिलाई’, ‘फिर से बनाए’ और ‘की कीमत पर’ स्रोत के कारक, प्रसंगगत और मुहावरेदार अर्थों का संतुलन रखते हैं। मुख्य पाठ के सभी पादटिप्पणी-चिह्न [a], [b], [c] उपस्थित हैं।
