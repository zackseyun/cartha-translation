  terminology: ‘युद्ध करनेवाले सभी पुरुष’ appropriately retains both the military and masculine reference of אַנְשֵׁי הַמִּלְחָמָה without using an overly technical or religiously colored term. ‘नगर’ suits the register and preserves the generic noun used in Hebrew.
  issues:
