  text: וְ/סַבֹּתֶ֣ם אֶת הָ/עִ֗יר כֹּ֚ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֔ה הַקֵּ֥יף אֶת הָ/עִ֖יר פַּ֣עַם אֶחָ֑ת כֹּ֥ה תַעֲשֶׂ֖ה שֵׁ֥שֶׁת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/003.yaml
  text: You shall march around the city[a], all the men of war, circling the city once. Thus you shall do for six days.
translation:
  language: hi
  text: तुम सब नगर के चारों ओर चक्कर लगाओ—युद्ध करनेवाले सभी पुरुष नगर का एक चक्कर लगाएँ। ऐसा तुम[a] छह दिन तक करते रहना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में यहाँ संबोधन एकवचन है और यहोशू को संबोधित करता है; पद के आरम्भ में ‘तुम सब’ बहुवचन है।
    reason: मूल इब्रानी में संबोधन की संख्या के महत्त्वपूर्ण परिवर्तन को स्पष्ट करना।
lexical_decisions:
- source_word: וְסַבֹּתֶם
  choice: तुम सब ... चारों ओर चक्कर लगाना
  rationale: क्रिया द्वितीय पुरुष बहुवचन है और नगर के चारों ओर घूमने की आज्ञा देती है। ‘चक्कर लगाना’ आधुनिक हिन्दी में स्वाभाविक है और सैन्य जुलूस की गति के अनुकूल है।
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: सभी युद्ध करनेवाले पुरुष
  rationale: इब्रानी पद का शाब्दिक अर्थ ‘युद्ध के सभी पुरुष’ है। यह अनगढ़ हुए बिना पुरुषवाचक और सैनिक अर्थ दोनों बनाए रखता है।
- source_word: הַקֵּיף אֶת־הָעִיר פַּעַם אֶחָת
  choice: नगर का एक चक्कर लगाएँ
  rationale: यह पहले कथन को फिर से स्पष्ट करता है और एक पूर्ण परिक्रमा का निर्देश देता है; हिन्दी में पुनरुक्ति को स्वाभाविक रूप से रखा गया है।
- source_word: כֹּה תַעֲשֶׂה
  choice: ऐसा तुम ... करना
  rationale: כֹּה निर्दिष्ट रीति की ओर संकेत करता है। תַעֲשֶׂה द्वितीय पुरुष एकवचन है, इसलिए ‘तुम’ से यहोशू को संबोधन सुरक्षित रखा गया है।
- source_word: שֵׁשֶׁת יָמִים
  choice: छः दिन तक
  rationale: यह अवधि और प्रतिदिन दोहराई जानेवाली क्रिया को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: אַנְשֵׁי הַמִּלְחָמָה का लिंग-संबंधी अर्थ
  choice: सभी युद्ध करनेवाले पुरुष
  alternative: सभी योद्धा
  rationale: मूल पद पुरुष युद्धकारियों को स्पष्ट रूप से निर्दिष्ट करता है; मुख्य पाठ में इस अर्थ को सामान्य लिंग वाले शब्द से अस्पष्ट नहीं किया गया।
- issue: संबोधित व्यक्तियों की संख्या में परिवर्तन
  choice: पहले बहुवचन ‘तुम सब’, फिर एकवचन ‘तुम’
  alternative: दोनों क्रियाओं को केवल बहुवचन या केवल एकवचन में करना
  rationale: इब्रानी पहले सैनिकों/समूह को बहुवचन में और फिर उत्तरदायी अगुवे यहोशू को एकवचन में संबोधित करता है। हिन्दी में इस परिवर्तन को स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण आज्ञार्थक रूप अपनाया गया है। ‘परिक्रमा’ की धार्मिक-सांस्कृतिक ध्वनि से बचते हुए ‘चक्कर लगाना’ चुना गया, और बहुवचन से एकवचन में मूल परिवर्तन को पाठ तथा पादटिप्पणी में सुरक्षित रखा गया है।
