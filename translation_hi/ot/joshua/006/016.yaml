  rationale: शोफ़ार जैसे वायु-वाद्य को बजाने की क्रिया के लिए सहज और सटीक हिन्दी।
- source_word: שׁוֹפָרוֹת
  choice: नरसिंगे
  rationale: सींग से बने या सींग-जैसे फूँककर बजाए जाने वाले संकेत-वाद्य के लिए प्रचलित बाइबलीय हिन्दी; ‘तुरहियाँ’ की अपेक्षा मूल वाद्य का स्वरूप अधिक स्पष्ट रखता है।
- source_word: הָרִיעוּ
  choice: जयजयकार करो
  rationale: यह क्रिया ऊँची सामूहिक पुकार, युद्धघोष या विजयघोष को सूचित कर सकती है। प्रसंग में ‘जयजयकार’ स्वाभाविक है, जबकि पादटिप्पणी मूल की व्यापकता सुरक्षित रखती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: आज्ञा का कारण प्रस्तुत करने वाले हिब्रू संयोजक का सीधा हिन्दी समतुल्य।
- source_word: נָתַן
  choice: दे दिया है
  rationale: हिब्रू पूर्ण क्रिया उस विजय को निश्चित और पूर्ण मानकर कहती है जो प्रत्यक्ष रूप से अभी घटित होने वाली है; हिन्दी पूर्ण वर्तमान उस बल को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी पाठकों में स्थापित रूप में परमेश्वर के व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: הָעִיר
  choice: यह नगर
  rationale: निश्चित संज्ञा प्रसंग में यरीहो को सूचित करती है; हिन्दी प्रत्यक्ष कथन में ‘यह नगर’ संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions:
- issue: नगरी के दिए जाने के लिए पूर्ण क्रिया נָתַן
  choice: ने यह नगर तुम्हें दे दिया है
  alternative: यह नगर तुम्हें देगा
  rationale: मूल पाठ भविष्यकाल नहीं, पूर्ण क्रिया प्रयोग करता है। अनुवाद विजय को परमेश्वर की ओर से पहले ही निश्चित और प्रदान की हुई बताने वाला तनाव बनाए रखता है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत नाम को ‘प्रभु’ जैसे पद से नहीं बदला गया। ‘यहोवा’ आधुनिक हिन्दी बाइबल परंपरा में व्यापक और सामान्य पाठक के लिए पहचाना हुआ रूप है; ‘याहवे’ अधिक निकट लिप्यंतरण माना जाता है।
