  text: सातवीं बार, जब याजकों ने नरसिंगे[a] फूँके, तब याहवे ने लोगों से कहा, “ज़ोर से पुकारो, क्योंकि याहवे ने यह नगर तुम्हें दे दिया है।”
  philosophy: optimal-equivalence
  footnotes:
