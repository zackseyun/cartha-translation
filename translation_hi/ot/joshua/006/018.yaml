source:
  edition: WLC
  text: וְ/רַק אַתֶּם֙ שִׁמְר֣וּ מִן הַ/חֵ֔רֶם פֶּֽן תַּחֲרִ֖ימוּ וּ/לְקַחְתֶּ֣ם מִן הַ/חֵ֑רֶם וְ/שַׂמְתֶּ֞ם אֶת מַחֲנֵ֤ה יִשְׂרָאֵל֙ לְ/חֵ֔רֶם וַ/עֲכַרְתֶּ֖ם אוֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/018.yaml
  text: But as for you[a], keep yourselves from what is devoted to destruction, lest you yourselves become devoted to destruction and take some of what is devoted to destruction, and make the camp of Israel devoted to destruction[c][b], and bring trouble on it.
translation:
  language: hi
  text: पर तुम उस सब से जो विनाश के लिए अर्पित है,[a] अपने आप को बचाए रखना। ऐसा न हो कि तुम स्वयं भी विनाश के लिए अर्पित ठहरो, उसमें से कुछ ले लो, और इस्राएल की छावनी को विनाश के लिए अर्पित ठहरा कर उसे संकट में डालो।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी חֵרֶם (खेरेम) उस व्यक्ति, वस्तु, या वस्तुओं के समूह को दर्शाता है जो परमेश्वर के लिए अपरिवर्तनीय रूप से अर्पित किया गया हो; इस प्रसंग में ऐसा अर्पण विनाश के द्वारा पूरा किया जाना था। परंपरागत अनुवादों में इसे कभी-कभी “प्रतिबंधित” या “शापित वस्तु” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने आप को विनाश के लिए अर्पित कर दो।” इब्रानी अभिव्यक्ति चेतावनी देती है कि ऐसी वस्तु लेने से वे स्वयं भी उसी प्रतिबंध और न्याय के अधीन हो जाएँगे।
    reason: alternative_reading
  - marker: c
    text: “उसे संकट में डालो” वाली अभिव्यक्ति आगे आकान के पाप और उसके कारण इस्राएल पर आए संकट की घटना से संबंधित है; देखें यहोशू 7:1, 25।
    reason: cross_reference
lexical_decisions:
- source_word: וְרַק אַתֶּם
  choice: पर तुम
  rationale: וְרַק पिछले निर्देशों के बाद एक प्रबल प्रतिबंधात्मक चेतावनी आरम्भ करता है और स्वतंत्र सर्वनाम אַתֶּם संबोधन पर बल देता है। सरल आधुनिक हिन्दी में ‘पर तुम’ इस विरोध और बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שִׁמְרוּ מִן
  choice: से ... अपने आप को बचाए रखना
  rationale: שׁמר का מִן के साथ प्रयोग किसी वस्तु से स्वयं को दूर रखने या सावधान रखने का भाव देता है। यह अनुवाद आज की हिन्दी में स्पष्ट है और आत्म-सुरक्षा की चेतावनी बनाए रखता है।
- source_word: הַחֵרֶם
  choice: वह वस्तु, जो विनाश के लिए अर्पित है
  rationale: חֵרֶם यहाँ एकवचन सामूहिक/अमूर्त संज्ञा है और उस सबको सूचित करता है जो परमेश्वर को अपरिवर्तनीय रूप से समर्पित होकर विनाश के अधीन है। ‘वस्तु’ मूल के एकवचन को बनाए रखती है, जबकि संबंधवाचक वाक्यांश इसका प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: פֶּן
  choice: ऐसा न हो कि
  rationale: यह चेतावनीसूचक उद्देश्य अथवा आशंकित परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תַּחֲרִימוּ
  choice: स्वयं भी विनाश के लिए अर्पित ठहरो
  rationale: हिफ़ील रूप का प्रसंगगत परिणाम यह है कि निषिद्ध वस्तु लेने वाले उसी חֵרֶם की स्थिति और न्याय के अधीन आ जाएँ। ‘ठहरो’ परिणामी स्थिति को व्यक्त करता है, पर क्रिया की संभावित कारक छाया को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּלְקַחְתֶּם מִן־הַחֵרֶם
  choice: उसमें से कुछ लेकर
  rationale: מִן पूरे में से कुछ लेने का संकेत देता है। ‘कुछ’ हिन्दी में आवश्यक स्वाभाविकता लाता है, बिना अर्थ का अनुचित विस्तार किए।
- source_word: וְשַׂמְתֶּם אֶת מַחֲנֵה יִשְׂרָאֵל לְחֵרֶם
  choice: इस्राएल की छावनी को विनाश के लिए अर्पित करके
  rationale: שׂים यहाँ छावनी को חֵרֶם की दशा में डालने का कारक परिणाम बताता है। कृदन्तीय रचना अगले परिणाम से संबंध को सहज हिन्दी में जोड़ती है।
- source_word: וַעֲכַרְתֶּם אֹתוֹ
  choice: उस पर संकट ले आओ
  rationale: עכר का अर्थ संकट या विपत्ति उत्पन्न करना है। सर्वनाम का निकटतम और प्रसंगगत संदर्भ इस्राएल की छावनी है।
theological_decisions:
- issue: पवित्र युद्ध और न्याय के प्रसंग में חֵרֶם का अनुवाद
  choice: विनाश के लिए अर्पित
  alternative: प्रतिबंधित वस्तु; शापित वस्तु; पूर्णतः अर्पित
  rationale: मूल शब्द परमेश्वर को अपरिवर्तनीय रूप से अर्पित उस वस्तु या समुदाय को सूचित करता है जो इस प्रसंग में विनाश के अधीन है। चुना हुआ पद अर्पण और विनाश दोनों पक्षों को बनाए रखता है और केवल ‘शापित’ कहकर अर्थ को संकुचित नहीं करता।
- issue: תַּחֲרִימוּ में स्वयं पर חֵרֶם की दशा लाने का भाव
  choice: स्वयं भी विनाश के लिए अर्पित ठहरो
  alternative: अपने आप को विनाश के लिए अर्पित कर दो; अपने आप को प्रतिबंध के अधीन कर लो
  rationale: प्रसंग में निषिद्ध वस्तु लेने से लोग उसी न्याय के अधीन हो जाते हैं। चुना हुआ अनुवाद परिणामी दशा को स्पष्ट करता है, जबकि वैकल्पिक कारक-पाठ को पादटिप्पणी में रखा गया है ताकि मूल की तनावपूर्ण अभिव्यक्ति न मिटे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘विनाश के लिए अर्पित’ को पद में तीनों स्थानों पर एकरूप रखा गया है, ताकि חֵרֶם की प्रमुख धार्मिक और न्याय-संबंधी धारणा बनी रहे। लंबे इब्रानी वाक्य को चेतावनी के मुख्य आदेश के बाद दो वाक्यों में बाँटा गया है, पर उसके कारण-परिणाम संबंध को बनाए रखा गया है।
