source:
  edition: WLC
  text: וַ/יִּקְרָ֞א יְהוֹשֻׁ֤עַ בִּן נוּן֙ אֶל הַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם שְׂא֖וּ אֶת אֲר֣וֹן הַ/בְּרִ֑ית וְ/שִׁבְעָ֣ה כֹֽהֲנִ֗ים יִשְׂאוּ֙ שִׁבְעָ֤ה שֽׁוֹפְרוֹת֙ יוֹבְלִ֔ים לִ/פְנֵ֖י אֲר֥וֹן יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/006.yaml
  text: So Joshua son of Nun called the priests and said to them[a], “Carry the ark of the covenant[b], and let seven priests carry seven ram’s-horn trumpets before the ark of Yahweh.”
translation:
  language: hi
  text: तब नून के पुत्र यहोशू ने याजकों को बुलाकर उनसे कहा, “वाचा का संदूक उठाकर ले चलो, और सात याजक याहवे के संदूक के आगे मेढ़ों के सींगों की सात तुरहियाँ[a] लेकर चलें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सात योबेल-तुरहियाँ।” हिब्रू शब्द יוֹבְלִים सामान्यतः यहाँ मेढ़ों के सींगों की ओर संकेत करता समझा जाता है, पर इसका संबंध बाद में ‘योबेल’ वर्ष के लिए प्रयुक्त शब्द से भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाकर
  rationale: यहाँ क्रिया याजकों को संबोधित करने के लिए बुलाने का भाव देती है; ‘बुलाकर उनसे कहा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: שְׂאוּ אֶת אֲרוֹן הַבְּרִית
  choice: वाचा का संदूक उठाकर ले चलो
  rationale: נשׂא का मूल भाव उठाना है, और इस जुलूस के संदर्भ में उसे लेकर चलना अभिप्रेत है; संयुक्त अभिव्यक्ति दोनों पहलुओं को स्पष्ट करती है।
- source_word: וְשִׁבְעָה כֹהֲנִים יִשְׂאוּ
  choice: और सात याजक ... लेकर चलें
  rationale: आज्ञार्थक क्रिया के बाद आया अपूर्ण काल यहाँ भविष्यवाणी नहीं, निर्देश व्यक्त करता है; ‘लेकर चलें’ हिन्दी में यह निर्देशात्मक बल बनाए रखता है।
- source_word: שִׁבְעָה שׁוֹפְרוֹת יוֹבְלִים
  choice: मेढ़ों के सींगों की सात तुरहियाँ
  rationale: שׁוֹפָר सींग से बनी तुरही है और יוֹבְלִים यहाँ संभवतः मेढ़ों के सींगों को निर्दिष्ट करता है। यह रूप सामान्य पाठक के लिए स्पष्ट है, जबकि वैकल्पिक पारिभाषिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: याहवे के संदूक के आगे
  rationale: לִפְנֵי का जुलूस-संबंधी स्थानिक अर्थ ‘आगे’ है। יְהוָה को उपाधि से बदलने के बजाय व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: אֲרוֹן הַבְּרִית और אֲרוֹן יְהוָה के बीच संबंध
  choice: पहले ‘वाचा का संदूक’, फिर ‘याहवे का संदूक’
  alternative: दोनों स्थानों पर एक ही पदबंध का प्रयोग
  rationale: मूल पाठ जानबूझकर दो अलग पदबंध रखता है; अनुवाद उसी भिन्नता को बनाए रखता है और उनकी पहचान को व्याख्यात्मक रूप से समतल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘याजक’, ‘वाचा’ और ‘संदूक’ जैसे स्थापित बाइबिलीय शब्द बनाए गए हैं; निर्देशों को सहज हिन्दी आज्ञार्थक शैली में व्यक्त किया गया है।
