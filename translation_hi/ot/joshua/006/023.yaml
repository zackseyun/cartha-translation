  text: וַ/יָּבֹ֜אוּ הַ/נְּעָרִ֣ים הַֽ/מְרַגְּלִ֗ים וַ/יֹּצִ֡יאוּ אֶת רָ֠חָב וְ/אֶת אָבִ֨י/הָ וְ/אֶת אִמָּ֤/הּ וְ/אֶת אַחֶ֨י/הָ֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ וְ/אֵ֥ת כָּל מִשְׁפְּחוֹתֶ֖י/הָ הוֹצִ֑יאוּ וַ/יַּ֨נִּיח֔וּ/ם מִ/ח֖וּץ לְ/מַחֲנֵ֥ה יִשְׂרָאֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/023.yaml
  text: So the young men[a], the spies, went in and brought out Rahab, her father, her mother, her brothers, and all who belonged to her[b]. They brought out all her families and placed them outside the camp of Israel.
translation:
  language: hi
  text: तब वे जवान जासूस भीतर गए और राहाब, उसके पिता, उसकी माता, उसके भाइयों और जो कुछ उसका था[a], वह सब बाहर ले आए। वे उसके सभी कुटुंबों[b] को बाहर ले आए और उन्हें इस्राएल की छावनी के बाहर ठहरा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे सभी जो उसके थे।” इब्रानी अभिव्यक्ति केवल व्यक्तियों से अधिक व्यापक हो सकती है, यद्यपि इस प्रसंग में मुख्यतः उसके घराने के लोग अभिप्रेत जान पड़ते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके सभी कुल” अथवा “उसके सभी संबंधी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּעָרִים הַמְרַגְּלִים
  choice: वे जवान जासूस
  rationale: נַעַר यहाँ युवा पुरुषों को सूचित करता है और הַמְרַגְּלִים उन्हीं की पहचान जासूसों के रूप में करता है। संक्षिप्त पदबंध स्रोत के निकट और स्वाभाविक हिन्दी है।
- source_word: וַיֹּצִיאוּ / הוֹצִיאוּ
  choice: बाहर ले आए
  rationale: יצא के हिफ़ील रूप का अर्थ किसी को बाहर लाना है। दोनों प्रयोगों में एक ही अनुवाद रखकर मूल की पुनरावृत्ति बनाए रखी गई है।
- source_word: כָּל אֲשֶׁר לָהּ
  choice: जो कुछ उसका था
  rationale: यह व्यापक अभिव्यक्ति व्यक्तियों और संपत्ति दोनों को समेट सकती है। मुख्य पाठ में इसकी वास्तविक व्यापकता सुरक्षित रखी गई है; प्रसंग में मुख्य संकेत उसके घराने के लोगों की ओर है।
- source_word: מִשְׁפְּחוֹתֶיהָ
  choice: उसके सभी कुटुंबियों
  rationale: מִשְׁפָּחָה विस्तृत परिवार, कुल या संबंधियों के समूह को सूचित कर सकता है। 'कुटुंबियों' से निकट परिवार से आगे के संबंधियों का भाव सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: וַיַּנִּיחוּם
  choice: उन्हें ... ठहरा दिया
  rationale: हिफ़ील क्रिया यहाँ किसी स्थान पर रखने या ठहराने को व्यक्त करती है। लोगों के लिए 'ठहरा दिया' स्वाभाविक है और उनके वहाँ रखे जाने का कारण नहीं जोड़ता।
- source_word: מִחוּץ לְמַחֲנֵה יִשְׂרָאֵל
  choice: इस्राएल की छावनी के बाहर
  rationale: यह मूल का सीधा स्थानवाचक कथन है और हिन्दी में स्पष्ट तथा स्वाभाविक है।
theological_decisions:
- issue: राहाब और उसके कुटुंब को इस्राएल की छावनी के बाहर ठहराने का कारण
  choice: केवल स्थानवाचक कथन का अनुवाद, बिना कारण बताए
  alternative: इसे अनुष्ठानिक अलगाव, सुरक्षा के लिए निगरानी, या इस्राएल में सम्मिलित होने से पहले की प्रतीक्षा के रूप में स्पष्ट करना
  rationale: इब्रानी पाठ केवल बताता है कि उन्हें छावनी के बाहर ठहराया गया; वह इसका कारण नहीं बताता। इसलिए अनुवाद किसी एक धार्मिक या कथात्मक व्याख्या को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। 'जवान जासूस', 'कुटुंबियों' और 'छावनी' जैसे शब्द सामान्य पाठक के लिए स्पष्ट हैं। मूल की दोनों बार आई 'बाहर लाने' की क्रिया दोहराई गई है, और अस्पष्ट अभिव्यक्तियों को पादटिप्पणियों में खोला गया है।
