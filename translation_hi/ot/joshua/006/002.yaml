  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ רְאֵה֙ נָתַ֣תִּי בְ/יָֽדְ/ךָ֔ אֶת יְרִיח֖וֹ וְ/אֶת מַלְכָּ֑/הּ גִּבּוֹרֵ֖י הֶ/חָֽיִל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/002.yaml
  text: And Yahweh said to Joshua[a], “See, I have given Jericho into your hand, along with its king and the mighty men of valor.”
translation:
  language: hi
  text: और याहवे ने यहोशू से कहा, “देख, मैंने यरीहो, उसके राजा और उसके पराक्रमी योद्धाओं[a] को तेरे हाथ में दे दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वीर योद्धाओं” अथवा “शूरवीर योद्धाओं।” इब्रानी पदबंध में शक्ति और युद्धगत वीरता—दोनों के भाव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है। आधुनिक हिन्दी में ‘तब’ स्वाभाविक कथा-प्रवाह देता है, बिना समय-संबंध को आवश्यकता से अधिक स्पष्ट किए।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम יהוה को उपाधि ‘प्रभु’ से बदलने के बजाय उसके पारंपरिक उच्चारण का निकट देवनागरी लिप्यंतरण रखा गया है।
- source_word: רְאֵה
  choice: देख
  rationale: आज्ञार्थक रूप ध्यान खींचता है; ‘देख’ सीधा, स्वाभाविक और आधुनिक हिन्दी में बोधगम्य है।
- source_word: נָתַתִּי
  choice: मैंने ... कर दिया है
  rationale: इब्रानी पूर्ण पक्ष वक्ता की दृष्टि से कार्य को संपन्न बताता है। युद्ध से पहले कही गई निश्चित विजय की घोषणा का बल हिन्दी के पूर्णकाल में सुरक्षित रहता है।
- source_word: בְיָדְךָ
  choice: तेरे हाथ में
  rationale: यह किसी को उसके अधिकार या वश में सौंपने का इब्रानी मुहावरा है। हिन्दी में भी ‘हाथ में’ समझ में आता है और मूल बिंब को बनाए रखता है।
- source_word: יְרִיחוֹ
  choice: यरीहो
  rationale: स्थान-नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: מַלְכָּהּ
  choice: उसके राजा
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ यरीहो नगर से है; हिन्दी में ‘उसके’ स्वाभाविक रूप से उसी नगर की ओर संकेत करता है।
- source_word: גִּבּוֹרֵי הֶחָיִל
  choice: वीर योद्धाओं
  rationale: यह पदबंध सामर्थ्य, युद्ध-कौशल और वीरता के संयुक्त भाव को व्यक्त करता है। ‘वीर योद्धा’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक रूप से दोनों पहलुओं को रखता है।
theological_decisions:
- issue: युद्ध से पहले נָתַתִּי के पूर्ण रूप का बल
  choice: ‘मैंने ... कर दिया है’ के रूप में निश्चित विजय की पूर्ण घोषणा
  alternative: ‘मैं ... कर रहा हूँ’ या ‘मैं ... कर दूँगा’
  rationale: मूल का पूर्ण पक्ष ईश्वर के निर्णय और विजय की निश्चितता को संपन्न कार्य की तरह प्रस्तुत करता है। पूर्णकाल बनाए रखने से यह तनाव सुरक्षित रहता है कि नगर अभी प्रत्यक्ष रूप से जीता नहीं गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यहोशू को एकवचन निकट संबोधन ‘तेरे’ दिया गया है, जो दिव्य प्रत्यक्ष वचन में स्वाभाविक है। पाद-टिप्पणी का चिह्न उसी पदबंध के बाद रखा गया है जिससे वह संबंधित है।
