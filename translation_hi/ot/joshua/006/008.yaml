source:
  edition: WLC
  text: וַ/יְהִ֗י כֶּ/אֱמֹ֣ר יְהוֹשֻׁעַ֮ אֶל הָ/עָם֒ וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֤וֹת הַ/יּֽוֹבְלִים֙ לִ/פְנֵ֣י יְהוָ֔ה עָבְר֕וּ וְ/תָקְע֖וּ בַּ/שּֽׁוֹפָר֑וֹת וַֽ/אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה הֹלֵ֖ךְ אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/008.yaml
  text: And it happened[a], when Joshua spoke to the people, that the seven priests carrying the seven ram's-horn trumpets before Yahweh passed on and blew the trumpets[b], and the ark of the covenant of Yahweh went behind them.
translation:
  language: hi
  text: और ऐसा हुआ कि जब यहोशू ने लोगों से कहा, तब मेढ़े के सींग की सात तुरहियाँ[a] लिए हुए सात याजक याहवे के सामने[b] आगे बढ़े और तुरहियाँ फूँकीं; और याहवे की वाचा का संदूक उनके पीछे चला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘योवेल की सात शोफ़ारें’। इस प्रसंग में इसका सम्भावित अर्थ ‘मेढ़े के सींग की सात तुरहियाँ’ है; ‘जुबली-वर्ष की तुरहियाँ’ भी सम्भव, पर कम सम्भावित अनुवाद है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘याहवे की उपस्थिति में’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֶּאֱמֹר
  choice: और ऐसा हुआ कि जब ... ने ... कहा
  rationale: वַיְהִי इब्रानी कथा में अगली घटना आरम्भ करता है, और כֶּאֱמֹר का कालवाचक अर्थ ‘जब/जैसे ... ने कहा’ है। यह रूप मूल की कथात्मक गति रखते हुए स्वाभाविक आधुनिक हिन्दी देता है।
- source_word: הָעָם
  choice: लोगों
  rationale: यहाँ עַם से आशय यहोशू द्वारा सम्बोधित इस्राएली समुदाय है, केवल सैनिक दल नहीं।
- source_word: שִׁבְעָה הַכֹּהֲנִים
  choice: वे सात याजक
  rationale: निश्चित पदबंध और पूर्ववर्ती प्रसंग से पहचाने गए सात याजकों को हिन्दी में स्पष्ट करता है।
- source_word: נֹשְׂאִים
  choice: लिए
  rationale: कृदन्त याजकों को तुरहियाँ उठाए हुए दर्शाता है; ‘लिए’ सहज हिन्दी है और जुलूस की चलती हुई क्रिया के साथ स्वाभाविक बैठता है।
- source_word: שִׁבְעָה שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: मेढ़े के सींग की सात तुरहियाँ
  rationale: שׁוֹפָר सींग से बना फूँकने का वाद्य है और יוֹבֵל यहाँ सम्भवतः मेढ़े या मेढ़े के सींग को सूचित करता है। मुख्य पाठ अर्थ स्पष्ट करता है और पादटिप्पणी मूल पदबंध की वैकल्पिक समझ बचाती है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי स्थान या उपस्थिति—दोनों का भाव दे सकता है। ‘सामने’ जुलूस में उनकी स्थिति को व्यक्त करता है और ‘उपस्थिति में’ का सम्भव अर्थ पादटिप्पणी में रखा गया है।
- source_word: עָבְרוּ
  choice: आगे बढ़े
  rationale: यहाँ क्रिया किसी सीमा को पार करने के बजाय जुलूस में आगे जाने को बताती है।
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: और तुरहियाँ फूँकीं
  rationale: תָּקַע का שׁוֹפָר के साथ सामान्य अर्थ वाद्य को फूँकना या बजाना है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: याहवे की वाचा का संदूक
  rationale: इब्रानी संबंध-श्रृंखला को पारदर्शी रूप से व्यक्त करता है और संदूक के वाचागत महत्त्व को बनाए रखता है।
- source_word: הֹלֵךְ אַחֲרֵיהֶם
  choice: उनके पीछे चला
  rationale: कृदन्त चलती हुई जुलूस-क्रिया और אַחֲרֵי स्थानगत ‘पीछे’ को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम יְהוָה है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: לִפְנֵי יְהוָה में उपस्थिति और स्थान का संबंध
  choice: याहवे के सामने
  alternative: याहवे की उपस्थिति में
  rationale: जुलूस के प्रसंग में इसका स्थानगत अर्थ प्रमुख है, सम्भवतः वाचा के संदूक द्वारा सूचित याहवे की उपस्थिति के संदर्भ में; फिर भी ‘उपस्थिति में’ अर्थ सम्भव है और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘याजक’, ‘वाचा’ और ‘संदूक’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं। मुख्य वाक्य की इब्रानी संरचना पहचानी जा सके इतनी औपचारिक निकटता रखी गई है, पर हिन्दी प्रवाह के लिए उपवाक्यों का स्वाभाविक क्रम अपनाया गया है।
