  edition: WLC
  text: לֹֽא יָמ֡וּשׁ סֵפֶר֩ הַ/תּוֹרָ֨ה הַ/זֶּ֜ה מִ/פִּ֗י/ךָ וְ/הָגִ֤יתָ בּ/וֹ֙ יוֹמָ֣ם וָ/לַ֔יְלָה לְמַ֨עַן֙ תִּשְׁמֹ֣ר לַ/עֲשׂ֔וֹת כְּ/כָל הַ/כָּת֖וּב בּ֑/וֹ כִּי אָ֛ז תַּצְלִ֥יחַ אֶת דְּרָכֶ֖/ךָ וְ/אָ֥ז תַּשְׂכִּֽיל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/008.yaml
  text: This book of the law shall not depart from your mouth[a], but you shall meditate on it day and night, so that you may be careful to do according to all that is written in it. For then you will make your way prosper, and then you will act wisely.
translation:
  language: hi
  text: व्यवस्था की यह पुस्तक तुम्हारे मुँह से न हटे, बल्कि तुम दिन-रात उस पर मनन करो[a], ताकि तुम उसमें लिखी हर बात के अनुसार कार्य करने में सावधानी बरतो। क्योंकि तब तुम अपने मार्ग को सफल बनाओगे, और तब बुद्धिमानी से काम करोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे धीमे स्वर में दोहराओ” अथवा “उसे बुदबुदाओ”; इब्रानी क्रिया में मनन के साथ धीमी मौखिक पुनरावृत्ति का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמוּשׁ
  choice: न हटे
  rationale: क्रिया का अर्थ हटना या दूर होना है। ‘मुँह से न हटे’ मूल बिंब को बनाए रखता है और निरंतर बोलने अथवा दोहराने का संकेत देता है।
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: व्यवस्था की यह पुस्तक
  rationale: סֵפֶר पुस्तक अथवा लिखित ग्रंथ है और इस वाचा-संदर्भ में תּוֹרָה परमेश्वर द्वारा दी गई लिखित व्यवस्था को सूचित करती है। यह पदक्रम स्वाभाविक हिन्दी और मूल संकेत दोनों को बनाए रखता है।
- source_word: מִפִּיךָ
  choice: तुम्हारे मुँह से
  rationale: यह ठोस इब्रानी अभिव्यक्ति को सुरक्षित रखता है, जिसमें बोलने, पाठ करने और वचन को होठों पर बनाए रखने का भाव है।
- source_word: וְהָגִיתָ
  choice: तुम ... उस पर मनन करो
  rationale: הגה धीमे स्वर में बोलने, बुदबुदाने अथवा मनन करने को व्यक्त कर सकता है। मुख्य पाठ में ‘मनन’ सहज है; मौखिक पुनरावृत्ति की छाया पादटिप्पणी और पहले उपवाक्य से सुरक्षित रहती है।
- source_word: יוֹמָם וָלַיְלָה
  choice: दिन-रात
  rationale: यह मूल युग्म का स्वाभाविक हिन्दी रूप है और निरंतरता का भाव देता है।
- source_word: לְמַעַן תִּשְׁמֹר לַעֲשׂוֹת
  choice: ताकि तुम ... करने में सावधानी बरतो
  rationale: यह प्रयोजन तथा ध्यानपूर्वक आज्ञापालन, दोनों को स्पष्ट और वर्तमान हिन्दी में व्यक्त करता है।
- source_word: כְּכָל הַכָּתוּב בּוֹ
  choice: उसमें लिखी हुई हर बात के अनुसार
  rationale: यह כְּכָל की समग्रता और लिखित व्यवस्था को मानक मानने का भाव सुरक्षित रखता है।
- source_word: תַּצְלִיחַ אֶת דְּרָכֶךָ
  choice: तुम अपने मार्ग को सफल बनाओगे
  rationale: हिफ़ील रूप की कारणवाचक शक्ति को बनाए रखता है; यह केवल सफलता पाने के बजाय अपने मार्ग को सफल बनाने की बात कहता है।
- source_word: תַּשְׂכִּיל
  choice: बुद्धिमानी से काम करोगे
  rationale: हिफ़ील שכל यहाँ समझ-बूझ अथवा विवेक से आचरण करने का भाव देता है। इससे पहले आए צלח की ‘सफलता’ से इसका अर्थगत भेद बना रहता है।
theological_decisions:
- issue: वाचा के संदर्भ में תּוֹרָה का अर्थ
  choice: व्यवस्था
  alternative: शिक्षा; तोराह
  rationale: यद्यपि תּוֹרָה का व्यापक अर्थ ‘शिक्षा’ हो सकता है, यहाँ वह उस लिखित वाचा-संबंधी व्यवस्था को सूचित करती है जिसका यहोशू को पालन करना है। ‘व्यवस्था’ इस कार्य और संदर्भ को स्पष्ट रखती है।
- issue: मनन में मौखिक पाठ और आंतरिक चिंतन का संबंध
  choice: मुख्य पाठ में ‘मनन करो’, मौखिक छाया पादटिप्पणी में
  alternative: उसे धीमे स्वर में दोहराओ; उसे बुदबुदाओ
  rationale: पद में वचन के मुँह से न हटने और הגה करने, दोनों का मेल है। ‘मनन’ सहज हिन्दी है, जबकि पादटिप्पणी मूल क्रिया की धीमी मौखिक पुनरावृत्ति की वास्तविक संभावना को सुरक्षित रखती है।
- issue: צלח और שכל के अर्थगत भेद
  choice: पहले को ‘मार्ग को सफल बनाना’ और दूसरे को ‘बुद्धिमानी से काम करना’
  alternative: दोनों को सफलता या समृद्धि के रूप में अनूदित करना
  rationale: दोनों क्रियाओं को एक ही अर्थ में मिला देने से मूल की अर्थगत प्रगति दब जाती है। चुना हुआ रूप सफलता और विवेकपूर्ण आचरण के बीच भेद बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘व्यवस्था’, ‘मनन’ और ‘मार्ग’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, पर वाक्यरचना को वर्तमान हिन्दी के अनुरूप बनाया गया है।
