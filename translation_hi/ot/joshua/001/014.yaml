base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/014.yaml
  text: Your wives[a], your little ones, and your livestock shall remain in the land that Moses gave you beyond the Jordan. But you shall cross over before your brothers, armed, all the mighty men of valor[b], and you shall help them.
translation:
  language: hi
  text: तुम्हारी पत्नियाँ, तुम्हारे बाल-बच्चे और तुम्हारा पशुधन उस देश में रहें, जो मूसा ने तुम्हें यरदन के पार दिया था। परन्तु तुम सब वीर योद्धा युद्ध के लिए सुसज्जित होकर[b] यरदन पार करके अपने भाइयों[a] के आगे बढ़ो और उनकी सहायता करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् अपने साथी इस्राएलियों; हिब्रू में पुल्लिंग संबंधवाची शब्द “भाइयों” का प्रयोग प्रतिनिधिक अर्थ में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: “युद्ध के लिए सुसज्जित होकर” का अनुवाद “हथियारबंद होकर” या “युद्ध-पंक्ति में” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: נְשֵׁיכֶם
  choice: तुम्हारी पत्नियाँ
  rationale: घर-परिवार और युद्ध के इस प्रसंग में यह शब्द योद्धाओं की पत्नियों को सूचित करता है, सामान्य रूप से स्त्रियों को नहीं।
- source_word: טַפְּכֶם
  choice: तुम्हारे बाल-बच्चे
  rationale: טַף छोटे बच्चों अथवा आश्रित बच्चों के लिए प्रयुक्त होता है; ‘बाल-बच्चे’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से ठोस है।
- source_word: וּמִקְנֵיכֶם
  choice: और तुम्हारे पशु
  rationale: यहाँ מִקְנֶה पालतू पशुधन और झुंडों को सूचित करता है; ‘पशु’ सरल और प्रसंगानुकूल है।
- source_word: יֵשְׁבוּ
  choice: रहें
  rationale: परिवारों और पशुओं के पीछे उसी भूभाग में ठहरे रहने का अर्थ संक्षेप और स्वाभाविक रूप से व्यक्त होता है।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: אֶרֶץ यहाँ यरदन के पूर्व में दिए गए भूभाग को सूचित करता है; ‘देश’ बाइबिलीय भू-प्रसंग में सहज है।
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: जो मूसा ने तुम्हें ... दिया है
  rationale: मूसा द्वारा भूभाग दिया जाना पूर्ण घटना है जिसका वर्तमान परिणाम बना हुआ है; हिन्दी का पूर्ण वर्तमान यहाँ स्वाभाविक है।
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार
  rationale: यह मूल के दिशात्मक दृष्टिकोण को अनिर्धारित रखते हुए पार वाले भूभाग को संक्षेप में व्यक्त करता है।
- source_word: וְאַתֶּם תַּעַבְרוּ
  choice: परन्तु तुम ... पार जाओ
  rationale: पीछे रहने वाले परिवारों और आगे जाने वाले योद्धाओं के बीच विरोध स्पष्ट करता है।
- source_word: חֲמֻשִׁים
  choice: युद्ध के लिए सुसज्जित होकर
  rationale: सैन्य प्रसंग में शब्द का सर्वाधिक संभावित अर्थ हथियारबंद अथवा युद्ध के लिए तैयार होना है; इसकी सूक्ष्म अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: לִפְנֵי אֲחֵיכֶם
  choice: अपने भाइयों के आगे
  rationale: आगे बढ़कर जाने का मूल स्थानगत भाव सुरक्षित रहता है।
- source_word: אֲחֵיכֶם
  choice: अपने भाइयों
  rationale: हिब्रू के पुल्लिंग संबंधवाची शब्द को मुख्य पाठ में रखा गया है; यहाँ उसके व्यापक इस्राएली संदर्भ को पादटिप्पणी स्पष्ट करती है।
- source_word: כֹּל גִּבּוֹרֵי הַחַיִל
  choice: तुम सब वीर योद्धा
  rationale: यह पद सक्षम और पराक्रमी लड़ाकों को सूचित करता है; यह हिन्दी में गरिमापूर्ण, स्पष्ट और स्वाभाविक है।
- source_word: וַעֲזַרְתֶּם אוֹתָם
  choice: और उनकी सहायता करो
  rationale: आज्ञात्मक प्रसंग में परिणामी निर्देश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: אֲחֵיכֶם में लिंगसूचक संबंधवाची भाषा
  choice: अपने भाइयों
  alternative: अपने साथी इस्राएलियों
  rationale: मूल पाठ पुल्लिंग बहुवचन संबंधवाची शब्द का प्रयोग करता है, जिसका संदर्भ प्रतिनिधिक रूप से शेष इस्राएली समुदाय है। मुख्य पाठ मूल रूप को रखता और पादटिप्पणी व्यापक संदर्भ बताती है।
- issue: חֲמֻשִׁים का सैन्य अर्थ
  choice: युद्ध के लिए सुसज्जित होकर
  alternative: युद्ध-पंक्ति में / हथियारबंद होकर
  rationale: इस प्रसंग में युद्ध के लिए तैयार और सज्जित होने का अर्थ सबसे संभावित है, पर ठीक-ठीक सूक्ष्म अर्थ निश्चित नहीं है; इसलिए विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, संबोधन में बहुवचन ‘तुम’, और सरल किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। मूल हिब्रू की शब्दावली और क्रम को यथासंभव सुरक्षित रखते हुए हिन्दी में अस्वाभाविक संरचना से बचा गया है।
