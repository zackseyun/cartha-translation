  text: And they answered Joshua[a], saying, “All that you have commanded us we will do, and wherever you send us we will go.”
translation:
  language: hi
  text: उन्होंने यहोशू को उत्तर दिया, “जो कुछ आपने हमें आज्ञा दी है, वह सब हम करेंगे; और जहाँ कहीं[a] आप हमें भेजेंगे, हम वहाँ जाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “और हर उस स्थान पर जहाँ आप हमें भेजेंगे, हम जाएँगे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: तब उन्होंने ... उत्तर दिया
  rationale: क़ाल वय्यिक्तोल कथा में प्रतिक्रिया को आगे बढ़ाता है। ‘उत्तर दिया’ मूल क्रिया का सीधा और स्वाभाविक अर्थ देता है; ‘तब’ हिन्दी में कथात्मक क्रम को सहज बनाता है।
- source_word: אֶת יְהוֹשֻׁעַ
  choice: यहोशू को
  rationale: ענה के साथ कर्म-चिह्न उस व्यक्ति को दर्शाता है जिसे उत्तर दिया गया। हिन्दी में ‘यहोशू को उत्तर दिया’ स्वाभाविक रचना है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष कथन के उद्धरण-चिह्न
  rationale: यह इन्फिनिटिव रचना आगे आने वाले प्रत्यक्ष कथन का परिचय देती है। हिन्दी में ‘यह कहते हुए’ जोड़ना अनावश्यक रूप से भारी होता; उद्धरण-चिह्न वही कार्य स्वाभाविक ढंग से करते हैं।
- source_word: כֹּל אֲשֶׁר
  choice: जो कुछ ... वह सब
  rationale: यह सहसंबंधी हिन्दी रचना आदेशों की संपूर्णता को स्पष्ट और स्वाभाविक रूप से व्यक्त करती है।
- source_word: צִוִּיתָנוּ
  choice: आपने हमें आज्ञा दी है
  rationale: צוה अधिकारपूर्वक आदेश देने को व्यक्त करता है। ‘आज्ञा दी है’ वर्तमान प्रसंग से जुड़े पूर्व आदेश का अर्थ बनाए रखता है और सम्मानजनक सम्बोधन देता है।
- source_word: נַעֲשֶׂה
  choice: हम करेंगे
  rationale: עשה यहाँ दी गई आज्ञा को करने या पूरा करने के अर्थ में है। ‘हम करेंगे’ संक्षिप्त और सीधा है।
- source_word: וְאֶל כָּל אֲשֶׁר
  choice: और जहाँ कहीं
  rationale: שלח और הלך के साथ यह वाक्यांश गंतव्य-सूचक है। ‘जहाँ कहीं’ हर सम्भावित स्थान का भाव स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक रूप पाद-टिप्पणी में रखा गया है।
- source_word: תִּשְׁלָחֵנוּ
  choice: आप हमें भेजेंगे
  rationale: שלח का सामान्य अर्थ ‘भेजना’ है। यह अनुवाद सैन्य या सामान्य नियुक्ति में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: נֵלֵךְ
  choice: हम वहाँ जाएँगे
  rationale: הלך का अर्थ ‘जाना’ है। हिन्दी में पहले आए स्थान-सूचक ‘जहाँ कहीं’ के साथ ‘वहाँ’ जोड़ना स्वाभाविक सहसंबंध बनाता है, बिना अर्थ बदले।
