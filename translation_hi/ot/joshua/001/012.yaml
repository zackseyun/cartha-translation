    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לָ/רֽאוּבֵנִי
  choice: और रूबेनियों से
  rationale: एकवचन जातिवाचक रूप यहाँ सामूहिक अर्थ में है; इसलिए हिंदी बहुवचन ‘रूबेनियों’ स्वाभाविक है। לְ को ‘से’ द्वारा व्यक्त किया गया है क्योंकि यह ‘कहा’ के संबोधित समूह को चिन्हित करता है।
- source_word: וְ/לַ/גָּדִי
  choice: गादियों से
  rationale: जातिवाचक एकवचन सामूहिक समूह को दर्शाता है; हिंदी में ‘गादियों’ स्पष्ट और स्वाभाविक है।
- source_word: וְ/לַ/חֲצִי שֵׁבֶט הַ/מְנַשֶּׁה
  choice: और मनश्शे के आधे गोत्र से
  rationale: रचना का अर्थ ‘मनश्शे के गोत्र के आधे भाग’ से है; प्रचलित बाइबलीय अभिव्यक्ति ‘मनश्शे का आधा गोत्र’ इसे संक्षेप और स्पष्टता से व्यक्त करती है।
- source_word: אָמַר
  choice: कहा
  rationale: אָמַר का सामान्य और सीधा हिंदी समतुल्य ‘कहा’ है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का मानक हिंदी बाइबलीय रूप अपनाया गया है।
- source_word: לֵ/אמֹר
  choice: 'कहा[a]:'
  rationale: यह क्रियारूप आगामी प्रत्यक्ष कथन का परिचय देता है। स्वाभाविक हिंदी में इसके स्वतंत्र अनुवाद ‘कहते हुए’ के स्थान पर विराम-चिह्न से यह कार्य व्यक्त किया गया है, और शाब्दिक रूप पादटिप्पणी में दिया गया है।
