source:
  edition: WLC
  text: זָכוֹר֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֨ר צִוָּ֥ה אֶתְ/כֶ֛ם מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה לֵ/אמֹ֑ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ מֵנִ֣יחַ לָ/כֶ֔ם וְ/נָתַ֥ן לָ/כֶ֖ם אֶת הָ/אָ֥רֶץ הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/013.yaml
  text: Remember the word that Moses the servant of Yahweh commanded you[a], saying, ‘Yahweh your God is giving you rest and will give you this land.’
translation:
  language: hi
  text: 'उस आदेश को याद रखो जो यहोवा के सेवक मूसा ने तुम्हें दिया था: ‘तुम्हारा परमेश्वर यहोवा तुम्हें विश्राम दे रहा है और तुम्हें यह भूमि देगा।’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तुम्हें यह भूमि दे चुका है।” इब्रानी क्रिया को निश्चित भविष्य अथवा पूर्ण हो चुके कार्य के रूप में समझा जा सकता है; यरदन के पूर्व के गोत्रों को उनका भाग पहले ही मिल चुका था।
    reason: alternative_reading
lexical_decisions:
- source_word: זָכוֹר
  choice: याद रखो
  rationale: एकवचन पुल्लिंग काल आज्ञार्थक रूप है, जिसमें यहोशू सीधे संबोधित समूह को मूसा की पूर्व आज्ञा स्मरण रखने के लिए कहता है। हिंदी में सामूहिक संबोधन के लिए ‘याद रखो’ स्वाभाविक है।
- source_word: הַדָּבָר
  choice: उस बात
  rationale: דבר का अर्थ ‘वचन’, ‘बात’ या ‘विषय’ हो सकता है। यहाँ यह मूसा की पहले कही हुई आज्ञा की विषयवस्तु को दर्शाता है; ‘उस बात’ आधुनिक हिंदी में सहज है और अनावश्यक रूप से इसे तकनीकी ‘वचन’ नहीं बनाता।
- source_word: צִוָּה אֶתְכֶם ... לֵאמֹר
  choice: तुम्हें आज्ञा देकर कही थी
  rationale: צוה का अधिकारपूर्ण निर्देश और לאמר का कथन-परिचायक कार्य दोनों हिंदी के स्वाभाविक वाक्य-विन्यास में सुरक्षित हैं।
- source_word: עֶבֶד יְהוָה
  choice: यहोवा के सेवक
  rationale: मूसा के सम्मानसूचक और नियुक्त सेवा-संबंध को ‘सेवक’ ठीक रूप से व्यक्त करता है; ‘दास’ यहाँ अनावश्यक रूप से बंधुआ स्थिति का संकेत दे सकता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से प्रतिस्थापित करने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय सहित संबंध को सीधे और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מֵנִיחַ לָכֶם
  choice: तुम्हें विश्राम दे रहा है
  rationale: हिफ़ील कृदंत बसने, राहत और सुरक्षा पाने के अर्थ-संसार में ‘विश्राम देना’ व्यक्त करता है; प्रगतिशील वर्तमान कृदंत के जारी कार्य को बनाए रखता है।
- source_word: וְנָתַן לָכֶם אֶת הָאָרֶץ הַזֹּאת
  choice: और तुम्हें यह देश देगा
  rationale: सहायक ו के साथ पूर्ण क्रिया पूर्ववर्ती कृदंत के भाव में भविष्य परिणाम व्यक्त कर सकती है। ‘देगा’ इस क्रम को स्वाभाविक हिंदी में रखता है, जबकि पूर्ण हो चुकी देन की सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है। हिंदी पाठकों के लिए स्थापित ‘यहोवा’ उस नाम को एक सामान्य उपाधि से बदले बिना स्पष्ट रूप से प्रस्तुत करता है।
- issue: וְנָתַן का काल-पक्ष
  choice: तुम्हें यह देश देगा
  alternative: तुम्हें यह देश दे चुका है / दिया है
  rationale: व्याकरणिक क्रम इसे पूर्ववर्ती ‘विश्राम दे रहा है’ के बाद सुनिश्चित भविष्य के रूप में पढ़ने देता है। फिर भी यरदन-पार के गोत्रों को भूमि पहले मिल चुकी होने के कथानक-संदर्भ के कारण पूर्ण क्रिया-पाठ भी संभव है; इस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। सामूहिक संबोधन के लिए प्रचलित एकवचन आज्ञार्थक ‘याद रखो’ रखा गया है। उद्धरण को स्वाभाविक हिंदी में प्रस्तुत किया गया और मूल की काल-पक्ष संबंधी वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
