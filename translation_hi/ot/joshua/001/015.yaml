base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/015.yaml
  text: until Yahweh gives your brothers rest[a], as he has given you, and they also take possession of the land that Yahweh your God is giving them. Then you shall return to the land of your possession and take possession of it, which Moses the servant of Yahweh gave you beyond the Jordan[b], toward the sunrise.
translation:
  language: hi
  text: जब तक यहोवा तुम्हारे भाइयों[a] को भी वैसा ही विश्राम न दे जैसा उसने तुम्हें दिया है, और वे भी उस भूमि पर अधिकार न कर लें जो तुम्हारा परमेश्वर यहोवा उन्हें दे रहा है। तब तुम अपनी उस भूमि में लौटना जो तुम्हारी संपत्ति है, और उस पर अधिकार करना। यह वही भूमि है जो यहोवा के सेवक मूसा ने तुम्हें यरदन के पार, सूर्योदय की ओर[b], दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात दूसरे इस्राएली; इब्रानी में शाब्दिक रूप से ‘तुम्हारे भाई’ है, जो यहाँ इस्राएल के अन्य गोत्रों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात पूर्व की ओर; इब्रानी में शाब्दिक रूप से ‘सूर्योदय की ओर’।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: विश्राम दे
  rationale: हिफ़ील रूप यहाँ युद्ध और बसावट के संदर्भ में सुरक्षा तथा चैन प्रदान करने का भाव रखता है; ‘विश्राम दे’ स्रोत की प्रमुख धारणा को बनाए रखता है।
- source_word: לַאֲחֵיכֶם
  choice: तुम्हारे भाइयों
  rationale: इब्रानी में स्पष्ट पुल्लिंग बहुवचन संबंधसूचक शब्द है। मुख्य पाठ में उसका रूप सुरक्षित रखा गया है और व्यापक संदर्भ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כָּכֶם
  choice: तुम्हारी तरह
  rationale: इब्रानी का संक्षिप्त तुलनात्मक प्रयोग शाब्दिक रूप से ‘तुम्हारे समान’ है; हिन्दी में ‘तुम्हारी तरह’ स्वाभाविक है और पहले दिए गए विश्राम को संदर्भ से समझने देता है।
- source_word: וְיָרְשׁוּ / וִירִשְׁתֶּם
  choice: अधिकार कर लें / अधिकार करना
  rationale: ירשׁ यहाँ आवंटित भूभाग को प्राप्त करके अपने कब्ज़े में लेने का अर्थ देता है। ‘अधिकार करना’ सक्रिय अधिग्रहण और वैध प्राप्ति, दोनों भावों को व्यक्त करता है।
- source_word: נֹתֵן
  choice: दे रहा है
  rationale: वर्तमान कृदंत चल रही अथवा निकटस्थ दैवी देन को दर्शाता है; अपूर्ण सैन्य अधिग्रहण के बीच भी भूमि परमेश्वर की ओर से दी जा रही है।
- source_word: אֶרֶץ יְרֻשַּׁתְכֶם
  choice: उस देश में ... जो तुम्हारी संपत्ति है
  rationale: यह पद उनके हिस्से में मिली स्थायी भूमि-संपत्ति को बताता है। हिन्दी वाक्य-विन्यास में संबंधवाचक संरचना अर्थ को स्पष्ट और सहज रखती है।
- source_word: עֶבֶד יְהוָה
  choice: यहोवा के सेवक
  rationale: मूसा के सम्मानसूचक पद में עבד आधिकारिक और निष्ठावान सेवा को सूचित करता है; ‘सेवक’ उपयुक्त है।
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार
  rationale: यह मानक भौगोलिक अभिव्यक्ति है और स्रोत की दृष्टि-सापेक्षता को सुरक्षित रखती है।
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: सूर्योदय की ओर
  rationale: यह मूल की ठोस छवि को सुरक्षित रखता है; इसका सामान्य दिशात्मक अर्थ ‘पूर्व की ओर’ है, जिसे पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है। आधुनिक हिन्दी में परिचित नामरूप ‘यहोवा’ उसे सामान्य उपाधि ‘प्रभु’ से अलग रखते हुए प्रत्यक्ष नाम के रूप में प्रस्तुत करता है।
- issue: अֲחֵיכֶם का लिंगयुक्त संबंधसूचक रूप
  choice: तुम्हारे भाइयों
  alternative: तुम्हारे साथी इस्राएलियों
  rationale: मुख्य पाठ में इब्रानी पुल्लिंग बहुवचन को बनाए रखा गया है; यहाँ इसका संदर्भ इस्राएल के दूसरे गोत्रों से है, जिसे पादटिप्पणी स्पष्ट करती है।
- issue: ‘विश्राम’ का दैवी दान
  choice: विश्राम दे
  alternative: चैन दे / स्थिर बसा दे
  rationale: ‘विश्राम’ केवल निष्क्रिय आराम तक सीमित नहीं, बल्कि शत्रुओं से राहत, सुरक्षा और भूमि में स्थिरता का व्यापक धर्मवैधानिक भाव रखता है; अनुवाद उस बहुअर्थता को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। आज्ञार्थक क्रम में ‘लौटना’ और ‘अधिकार करना’ का प्रयोग पूर्ववर्ती भविष्यकालीन शर्त के बाद मिलने वाले निर्देश को स्वाभाविक ढंग से व्यक्त करता है। ‘देश’ יהושע के भूभाग-संदर्भ में ‘भूमि’ की तुलना में अधिक सहज लगा, जबकि ‘संपत्ति’ आवंटित अधिकार को स्पष्ट करती है।
