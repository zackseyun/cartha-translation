language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵ֛י מ֥וֹת מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֣עַ בִּן נ֔וּן מְשָׁרֵ֥ת מֹשֶׁ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/001.yaml
  text: 'After the death of Moses[a], the servant of Yahweh, Yahweh said to Joshua son of Nun, the attendant of Moses, saying:'
translation:
  language: hi
  text: 'याहवे के सेवक मूसा की मृत्यु के बाद, याहवे ने नून के पुत्र यहोशू से, जो मूसा का सहायक था, कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת
  choice: मृत्यु के बाद
  rationale: यह आरंभिक कथात्मक सूत्र अगले घटनाक्रम की पृष्ठभूमि प्रस्तुत करता है। आधुनिक हिन्दी में ‘मृत्यु के बाद’ स्वाभाविक है; अलग से ‘और ऐसा हुआ’ जोड़ना आवश्यक नहीं।
- source_word: עֶבֶד יְהוָה
  choice: याहवे के सेवक
  rationale: यह मूसा की सम्मानसूचक वाचा-संबंधी उपाधि है; ‘सेवक’ यहाँ दासत्व की अपेक्षा परमेश्वर की आधिकारिक सेवा का भाव ठीक व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: नून के पुत्र यहोशू
  rationale: व्यक्तिनाम और पितृनाम को हिन्दी की स्वाभाविक संरचना में प्रस्तुत किया गया है।
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: जो मूसा का सहायक था
  rationale: מְשָׁרֵת उस व्यक्ति को दर्शाता है जो किसी की निकट सेवा और सहायता करता है। ‘सहायक’ आधुनिक हिन्दी में भूमिका को स्पष्ट रखता है और अनावश्यक धार्मिक पद का आभास नहीं देता।
- source_word: לֵאמֹר
  choice: 'कहा:'
  rationale: यह आगामी प्रत्यक्ष वचन का परिचायक है। हिन्दी में ‘कहा:’ इसका स्वाभाविक और पूर्ण कार्यात्मक समतुल्य है; ‘यह कहते हुए’ जोड़ना बोझिल होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम प्रत्यक्ष रूप से आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: मूसा की उपाधि में עֶבֶד
  choice: सेवक
  alternative: दास
  rationale: यहाँ पदबंध सम्मानसूचक उपाधि है। ‘सेवक’ परमेश्वर के प्रति मूसा की निष्ठावान और आधिकारिक सेवा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘दास’ इस संदर्भ में अनावश्यक रूप से बंधुआ स्थिति पर बल दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। मूल की पुनरुक्ति ‘याहवे ... याहवे’ सुरक्षित रखी गई है। לֵאמֹר को हिन्दी विराम-चिह्न और ‘कहा’ के माध्यम से व्यक्त किया गया है।
