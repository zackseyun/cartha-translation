  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מֹשֶׁ֥ה עַבְדִּ֖/י מֵ֑ת וְ/עַתָּה֩ ק֨וּם עֲבֹ֜ר אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֗ה אַתָּה֙ וְ/כָל הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/002.yaml
  text: Moses my servant is dead. So now[a], arise, cross this Jordan—you and all this people—into the land that I am giving to them, to the sons of Israel.
translation:
  language: hi
  text: “मेरा सेवक मूसा मर गया है। इसलिए अब उठ, तू और ये सब लोग इस यरदन को पार करके उस देश में प्रवेश करो, जिसे मैं उन्हें, इस्राएल के पुत्रों को[a], दे रहा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों को” अथवा “इस्राएल की संतानों को।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों को” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  choice: मेरा सेवक
  rationale: यहाँ עֶבֶד परमेश्वर के साथ मूसा के सम्मानपूर्ण संबंध और उसकी नियुक्त सेवा को व्यक्त करता है; ‘सेवक’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से दासत्व पर बल नहीं देता।
- source_word: מֵת
  choice: मर गया है
  rationale: इब्रानी पूर्ण क्रिया मूसा की मृत्यु को वर्तमान परिस्थिति निर्धारित करने वाले घटित तथ्य के रूप में रखती है; ‘मर गया है’ हिन्दी में सीधा और स्वाभाविक है।
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: 'वाव और ‘अब’ का मेल पिछले कथन से संक्रमण के साथ उसका परिणाम भी दिखाता है: मूसा की मृत्यु के बाद अब यहोशू को कार्य करना है।'
- source_word: קוּם
  choice: उठ
  rationale: आज्ञार्थक क्रिया निर्णायक कार्रवाई का आह्वान करती है; एकवचन ‘उठ’ यहोशू को सीधे संबोधन को बनाए रखता है।
- source_word: עֲבֹר אֶת־הַיַּרְדֵּן הַזֶּה
  choice: इस यरदन को पार कर
  rationale: עָבַר यहाँ नदी को पार करने का स्पष्ट अर्थ रखता है। संकेतवाचक ‘इस’ को सुरक्षित रखा गया है; ‘नदी’ जोड़ना आवश्यक नहीं।
- source_word: אַתָּה וְכָל־הָעָם הַזֶּה
  choice: तू और ये सब लोग
  rationale: ‘तू’ एकवचन प्रत्यक्ष संबोधन को रखता है। हिन्दी में ‘ये सब लोग’ इब्रानी सामूहिक पद और संकेतवाचक का स्वाभाविक रूप है।
- source_word: אֶל־הָאָרֶץ
  choice: उस देश में जा
  rationale: गति और प्रवेश का भाव हिन्दी में ‘देश में जा’ से स्पष्ट होता है। ‘जा’ वाक्य में निहित गति को स्वाभाविक बनाता है, जबकि मूल आदेश ‘पार कर’ ही मुख्य क्रिया है।
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: जिसे मैं उन्हें ... दे रहा हूँ
  rationale: वर्तमान कृदंत נֹתֵן परमेश्वर द्वारा दिए जाने को चल रही अथवा आसन्न क्रिया के रूप में प्रस्तुत करता है; ‘दे रहा हूँ’ इस पक्ष को बनाए रखता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के वंशजों को
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्रों’ है, पर यह सामूहिक जातीय पद पूरे इस्राएली समुदाय को सूचित करता है। ‘वंशज’ मूल वंश-संबंध को रखता है और आधुनिक हिन्दी में पुरुषों तक सीमित अर्थ देने से बचता है।
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל का लिंगयुक्त सामूहिक पद
  choice: इस्राएल के वंशजों को
  alternative: इस्राएल के पुत्रों को / इस्राएलियों को
  rationale: मूल पद का रूप शाब्दिकतः ‘इस्राएल के पुत्र’ है, किंतु इसका सन्दर्भ वाचा-समुदाय के सभी लोगों से है। ‘वंशज’ पितृवंशीय नाम-संबंध को सुरक्षित रखते हुए आधुनिक हिन्दी में आशय को स्वाभाविक और समावेशी ढंग से व्यक्त करता है।
- issue: भूमि देने की क्रिया का पक्ष
  choice: दे रहा हूँ
  alternative: दूँगा / देता हूँ
  rationale: नֹתֵן कृदंत है और दिव्य दान को वर्तमान या आसन्न वास्तविकता के रूप में रखता है। भविष्यकाल मात्र करने से मूल का आरंभिक/प्रगतिशील तनाव कम हो जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और प्रत्यक्ष है। परमेश्वर द्वारा यहोशू को एकवचन संबोधन के लिए ‘तू’ रखा गया है, जो निकट और अधिकारपूर्ण बाइबिलीय संबोधन है। विराम-चिह्नों से ‘तू और ये सब लोग’ को स्पष्ट मध्यस्थ पद के रूप में रखा गया है।
