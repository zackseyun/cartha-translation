  to: “मेरा सेवक मूसा मर गया है। इसलिए अब उठ, तू और ये सब लोग इस यरदन को पार करके उस देश में प्रवेश करो, जिसे मैं उन्हें, इस्राएल के पुत्रों को[a], दे रहा हूँ।”
