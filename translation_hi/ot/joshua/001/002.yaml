  terminology: “सेवक,” “यरदन,” and “देश” are appropriate. “इस्राएल के पुत्रों” more closely reflects לִבְנֵי יִשְׂרָאֵל than “वंशजों”; a note supplies natural alternative renderings without concealing the Hebrew form.
