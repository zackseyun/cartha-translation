    issue: “इस्राएल के वंशजों” neutralizes the explicit lexical form “sons of Israel.”
    rationale: Although the expression denotes the covenant people collectively, the Hebrew construct uses “sons.” The translation should preserve this formal designation, with a footnote for idiomatic alternatives.
