base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/006.yaml
  text: Be strong and courageous[b][a], for you shall cause this people to inherit the land that I swore to their fathers to give to them.
translation:
  language: hi
  text: मज़बूत और साहसी बनो, क्योंकि तुम ही इस प्रजा को उस देश का अधिकारी बनाओगे[a], जिसे मैंने उनके पितरों[b] को देने की शपथ खाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस प्रजा को वह देश विरासत में दोगे।” इब्रानी क्रिया का शाब्दिक भाव है, “अधिकारी बनाना” या “विरासत दिलाना।”
    reason: lexical_alternative
  - marker: b
    text: “पितरों” से विशेष रूप से इस्राएल के पितृपुरुष अभिप्रेत हैं; वैकल्पिक रूप से, “पूर्वजों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמָץ
  choice: मज़बूत और साहसी बनो
  rationale: दोनों पुल्लिंग एकवचन आज्ञार्थक क्रियाओं के संयुक्त प्रोत्साहन को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: आज्ञा के आधार या कारण का परिचय देता है।
- source_word: תַּנְחִיל
  choice: अधिकारी बनाओगे
  rationale: 'נחל के हिफ़ईल रूप की कारकता को बनाए रखता है: यहोशू इस प्रजा को देश का उत्तराधिकार प्राप्त कराएगा।'
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: इब्रानी के सामूहिक एकवचन और राष्ट्रीय समुदाय के भाव को संक्षिप्त, स्वाभाविक हिन्दी में रखता है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: संदर्भ में वाचा के अंतर्गत प्रतिज्ञात भूभाग को सूचित करता है; हिन्दी वाक्य में संबंधवाचक उपवाक्य के साथ ‘उस’ स्वाभाविक है।
- source_word: נִשְׁבַּעְתִּי
  choice: शपथ मैंने ... खाई थी
  rationale: परमेश्वर द्वारा पहले की गई शपथ को सामान्य और स्पष्ट हिन्दी मुहावरे में व्यक्त करता है।
- source_word: לַאֲבוֹתָם
  choice: उनके पूर्वजों से
  rationale: אָבוֹת का संदर्भ इस्राएल के पितृपुरुषों से है; ‘पूर्वज’ आधुनिक हिन्दी में स्पष्ट है और ऐतिहासिक सामूहिक संदर्भ को व्यक्त करता है।
- source_word: לָתֵת לָהֶם
  choice: जिसे देने की
  rationale: शपथ की विषयवस्तु—देश उन्हें देना—को हिन्दी में स्वाभाविक संबंधवाचक रचना द्वारा व्यक्त करता है।
theological_decisions:
- issue: תַּנְחִיל की कारकता
  choice: इस प्रजा को उस देश का अधिकारी बनाओगे
  alternative: इस प्रजा को वह देश विरासत में दोगे
  rationale: मुख्य पाठ यहोशू की भूमिका को देश का अंतिम दाता बताए बिना, प्रजा को उसका उत्तराधिकार दिलाने वाले के रूप में बनाए रखता है।
- issue: לַאֲבוֹתָם का आशय
  choice: उनके पूर्वजों
  alternative: उनके पितरों
  rationale: संदर्भ में इस्राएल के वाचा-संबंधी पितृपुरुष अभिप्रेत हैं। ‘पूर्वज’ आम पाठक के लिए अधिक सहज है; पितृपुरुष-संबंधी विशिष्टता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, प्रोत्साहनपूर्ण और गरिमापूर्ण लहजा रखा गया है। ‘मज़बूत’ सामान्य पाठक के लिए सहज है; ‘अधिकारी बनाओगे’ इब्रानी कारक क्रिया की विशेषता बचाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
