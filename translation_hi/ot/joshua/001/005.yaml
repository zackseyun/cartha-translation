source:
  edition: WLC
  text: לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ לְ/פָנֶ֔י/ךָ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ כַּֽ/אֲשֶׁ֨ר הָיִ֤יתִי עִם מֹשֶׁה֙ אֶהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א אַרְפְּ/ךָ֖ וְ/לֹ֥א אֶעֶזְבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/005.yaml
  text: No man will stand before you all the days of your life[a]. Just as I was with Moses, I will be with you[c][b]. I will not fail you or forsake you.
translation:
  language: hi
  text: तेरे जीवन भर कोई भी तेरे सामने टिक न सकेगा।[a][b] जैसे मैं मूसा के साथ था, वैसे ही तेरे साथ रहूँगा। मैं तुझ पर अपनी पकड़ ढीली न करूँगा[c] और न तुझे त्यागूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कोई भी तेरे सामने खड़ा न रह सकेगा।’ इब्रानी मुहावरा सफलतापूर्वक विरोध कर पाने का भाव रख सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘कोई भी’ के लिए इब्रानी में पुल्लिंग एकवचन शब्द אִישׁ है, जिसका यहाँ सामान्य अर्थ किसी भी मानवीय विरोधी से है।
    reason: lexical_alternative
  - marker: c
    text: या ‘मैं तुझे असहाय न छोड़ूँगा।’ इस क्रिया में पकड़ ढीली न करने, सहारा न हटाने, या विफल न छोड़ने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב
  choice: टिक न सकेगा
  rationale: हित्पएल रूप यहाँ विरोध में खड़े होकर सफलतापूर्वक सामना करने का भाव रखता है। सैन्य प्रसंग में ‘टिक न सकेगा’ इस निहित सामर्थ्य-अभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ
  choice: कोई भी
  rationale: इब्रानी में पुल्लिंग एकवचन संज्ञा का प्रयोग सामान्य मानवीय विरोधी के लिए हुआ है। हिन्दी में ‘कोई भी’ उसके व्यापक आशय को स्वाभाविक रूप से पहुँचाता है; व्याकरणिक रूप की जानकारी पादटिप्पणी में सुरक्षित है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: यह पदबंध शाब्दिक रूप से ‘तेरे मुख के सामने’ है और इस प्रसंग में विरोध या सामना करने का भाव देता है।
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: तेरे जीवन भर
  rationale: यह सम्पूर्ण जीवनकाल बताने वाला इब्रानी मुहावरा है; ‘तेरे जीवन भर’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: जैसे मैं मूसा के साथ था
  rationale: כַּאֲשֶׁר स्पष्ट तुलना स्थापित करता है; हिन्दी की ‘जैसे... वैसे ही’ रचना उसे सहजता से व्यक्त करती है।
- source_word: אֶהְיֶה עִמָּךְ
  choice: वैसे ही तेरे साथ रहूँगा
  rationale: यह यहोवा की प्रतिज्ञात उपस्थिति का सीधा कथन है। अनुवाद उसके वाच्यार्थ और गंभीर आश्वासन दोनों को बनाए रखता है।
- source_word: אַרְפְּךָ
  choice: तेरा साथ न छोड़ूँगा
  rationale: רפה के हिफ़ील रूप में पकड़ ढीली करने, सहारा हटा लेने या विफल छोड़ देने का भाव हो सकता है। ‘तेरा साथ न छोड़ूँगा’ हिन्दी में सहारा न हटाने का अर्थ स्वाभाविक ढंग से देता है, जबकि वैकल्पिक सूक्ष्मता पादटिप्पणी में दी गई है।
- source_word: אֶעֶזְבֶךָּ
  choice: न तुझे त्यागूँगा
  rationale: עזב का अर्थ छोड़ देना या त्याग देना है। ‘त्यागूँगा’ पहले क्रियापद से भेद रखते हुए प्रतिज्ञा की गंभीरता बनाए रखता है।
theological_decisions:
- issue: אִישׁ के सामान्य पुल्लिंग प्रयोग का अनुवाद
  choice: कोई भी
  alternative: कोई पुरुष
  rationale: मूल का पुल्लिंग एकवचन यहाँ केवल पुरुषों तक सीमित नहीं, बल्कि किसी भी मानवीय विरोधी को दर्शाता है। मुख्य पाठ में स्वाभाविक हिन्दी अर्थ दिया गया है और मूल रूप पादटिप्पणी में बताया गया है।
- issue: לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ की दोहरी प्रतिज्ञा
  choice: मैं तेरा साथ न छोड़ूँगा और न तुझे त्यागूँगा
  alternative: मैं तुझे ढीला न छोड़ूँगा और न तुझे त्यागूँगा
  rationale: 'दोनों निषेधों का भेद रखा गया है: पहला सहारा या पकड़ न हटाने का, दूसरा पूर्णतः न त्यागने का आश्वासन देता है। अस्वाभाविक शाब्दिकता से बचते हुए lexical tension पादटिप्पणी में सुरक्षित रखी गई है।'
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। परमेश्वर द्वारा यहोशू को सीधे संबोधन के कारण एकवचन निकट संबोधन ‘तेरे/तुझे’ रखा गया है। सैन्य मुहावरे को ‘सामने टिक न सकेगा’ से स्पष्ट किया गया है और मूल की दोहरी नकारात्मक प्रतिज्ञा सुरक्षित रखी गई है।
