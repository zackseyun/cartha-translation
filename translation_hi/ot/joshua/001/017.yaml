  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּ/כֹ֤ל אֲשֶׁר שָׁמַ֨עְנוּ֙ אֶל מֹשֶׁ֔ה כֵּ֖ן נִשְׁמַ֣ע אֵלֶ֑י/ךָ רַ֠ק יִֽהְיֶ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/017.yaml
  text: Just as we listened to Moses in everything[a], so we will listen to you. Only may Yahweh your God be with you, just as he was with Moses.
translation:
  language: hi
  text: जैसे हमने हर बात में मूसा की सुनी[a], वैसे ही हम आपकी सुनेंगे। केवल इतना हो कि याहवे, आपके परमेश्वर, आपके साथ रहें, जैसे वे मूसा के साथ थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मूसा की आज्ञा मानी ... आपकी आज्ञा मानेंगे।” इब्रानी क्रिया שׁמע का अर्थ प्रसंग के अनुसार “सुनना” और “आज्ञा मानना,” दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ / נִשְׁמַע
  choice: हमने ... की सुनी / हम ... सुनेंगे
  rationale: שׁמע के साथ אֶל किसी की सुनने, उस पर ध्यान देने और उसकी आज्ञा मानने का भाव दे सकता है। हिंदी मुहावरा ‘किसी की सुनना’ इस शब्द-संबंध को बनाए रखते हुए आज्ञापालन का निहित भाव भी व्यक्त करता है।
- source_word: כְּכֹל אֲשֶׁר
  choice: जैसे ... हर बात में
  rationale: 'यह तुलना और व्यापकता—दोनों को व्यक्त करता है: जिस प्रकार उन्होंने हर बात में मूसा की सुनी, उसी प्रकार वे यहोशू की सुनेंगे।'
- source_word: רַק
  choice: केवल
  rationale: यह प्रतिज्ञा के साथ जुड़ी एक योग्यता अथवा प्रबल अभिलाषा को प्रस्तुत करता है।
- source_word: יִהְיֶה
  choice: रहें
  rationale: רַק के बाद यहाँ अपूर्ण क्रिया सामान्य भविष्यवाणी के बजाय अभिलाषा या कामना व्यक्त करती है। हिंदी में आदरसूचक ‘रहें’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: आपके परमेश्वर
  rationale: यह एकवचन पुल्लिंग प्रत्यय सहित सीधा संबंधसूचक रूप है। यहोशू के लिए आधुनिक आदरसूचक संबोधन अपनाया गया है।
- source_word: עִמָּךְ / עִם
  choice: आपके साथ / मूसा के साथ
  rationale: עִם उपस्थिति और संगति को दर्शाता है; ‘साथ’ हिंदी में इसका स्वाभाविक और प्रसंगानुकूल रूप है।
- source_word: כַּאֲשֶׁר
  choice: जैसे
  rationale: यह याहवे की यहोशू के साथ उपस्थिति की तुलना मूसा के साथ उनकी उपस्थिति से करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण देवनागरी लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: יִהְיֶה का भाव
  choice: 'कामना: ‘साथ रहें’'
  alternative: 'सामान्य भविष्य: ‘साथ रहेंगे’'
  rationale: רַק के बाद कथन प्रतिज्ञा की शर्त-जैसी प्रबल कामना व्यक्त करता है; इसे निश्चित भविष्यवाणी बनाना प्रसंग के भाव को अनावश्यक रूप से तय कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यहोशू के लिए एकवचन आदरसूचक ‘आप’ और परमेश्वर के लिए आदरसूचक बहुवचन क्रिया-रूप प्रयुक्त हैं। ‘की सुनी’ हिंदी में सुनने और मानने की मूल इब्रानी अर्थ-व्याप्ति को यथासंभव सुरक्षित रखता है।
