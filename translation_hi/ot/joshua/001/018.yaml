source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר יַמְרֶ֣ה אֶת פִּ֗י/ךָ וְ/לֹֽא יִשְׁמַ֧ע אֶת דְּבָרֶ֛י/ךָ לְ/כֹ֥ל אֲשֶׁר תְּצַוֶּ֖/נּוּ יוּמָ֑ת רַ֖ק חֲזַ֥ק וֶ/אֱמָֽץ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/018.yaml
  text: Every man who rebels against your command and does not listen to your words in all that you command him shall be put to death[a]. Only be strong and courageous.
translation:
  language: hi
  text: हर पुरुष जो आपकी आज्ञा[a] का विरोध करे और जो कुछ आप उसे आज्ञा दें, उस सब में आपकी बातों को न माने, वह मार डाला जाएगा। केवल आप दृढ़ और साहसी रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘आपके मुँह का।’ इब्रानी मुहावरे में ‘मुँह’ का अर्थ किसी का आदेश या अधिकारपूर्ण वचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ
  choice: जो कोई पुरुष
  rationale: इब्रानी का शाब्दिक अर्थ ‘हर पुरुष’ है। ‘जो कोई पुरुष’ आधुनिक हिन्दी में स्वाभाविक रहते हुए पुल्लिंग एकवचन और व्यापक, वितरणात्मक भाव को बनाए रखता है।
- source_word: יַמְרֶה
  choice: के विरुद्ध विद्रोह करे
  rationale: हिफ़ईल रूप अधिकार के विरुद्ध विद्रोह या अवज्ञापूर्ण चुनौती का भाव देता है; ‘विद्रोह करे’ केवल साधारण अनाज्ञाकारिता से अधिक प्रबल है।
- source_word: אֶת פִּיךָ
  choice: आपकी आज्ञा
  rationale: शाब्दिक रूप से ‘आपके मुँह’ है, पर यहाँ ‘मुँह’ अधिकारपूर्ण वचन या आदेश के लिए इब्रानी मुहावरा है। ‘आपकी आज्ञा’ हिन्दी में उसका आशय स्पष्ट करता है।
- source_word: וְלֹא יִשְׁמַע אֶת דְּבָרֶיךָ
  choice: आपकी बात न माने
  rationale: שׁמע में सुनने, ध्यान देने और मानने का अर्थ-क्षेत्र है। इस संदर्भ में ‘बात न माने’ आज्ञापालन का भाव व्यक्त करता है और स्वाभाविक हिन्दी है।
- source_word: לְכֹל אֲשֶׁר תְּצַוֶּנּוּ
  choice: जो कुछ आप उसे आज्ञा दें, उस सब में
  rationale: यह आज्ञाकारिता के पूरे दायरे को बताता है; वाक्य-विन्यास इब्रानी के ‘सब कुछ’ के बल को बनाए रखता है।
- source_word: יוּמָת
  choice: मार डाला जाएगा
  rationale: यह मृत्यु-दंड सूचक कर्मवाच्य रूप है, केवल ‘मर जाएगा’ नहीं। ‘मार डाला जाएगा’ आरोपित दंड और कर्मवाच्य दोनों को स्पष्ट रखता है।
- source_word: רַק
  choice: केवल
  rationale: यह बलयुक्त सीमितकारी और प्रोत्साहनात्मक संक्रमण है; ‘केवल’ अगले आग्रह पर उचित बल देता है।
- source_word: חֲזַק וֶאֱמָץ
  choice: दृढ़ और साहसी रहें
  rationale: यह यहोशू में बार-बार आने वाला प्रोत्साहन है। ‘दृढ़’ सामर्थ्य और स्थिरता को, तथा ‘साहसी’ निर्भीक संकल्प को व्यक्त करता है। सम्मानसूचक संबोधन के अनुरूप ‘रहें’ रखा गया है।
theological_decisions:
- issue: प्रतिनिधिक पुल्लिंग भाषा
  choice: जो कोई पुरुष
  alternative: जो कोई व्यक्ति
  rationale: मूल में אִישׁ पुल्लिंग एकवचन है और वितरणात्मक रूप से प्रयुक्त हुआ है। अनावश्यक लिंग-निरपेक्षीकरण किए बिना उसके रूप और व्यापक आशय दोनों को रखा गया है।
- issue: न्यायिक मृत्यु-दंड की अभिव्यक्ति
  choice: मार डाला जाएगा
  alternative: मर जाएगा
  rationale: इब्रानी रूप किसी के केवल मरने का परिणाम नहीं, बल्कि उस पर लागू किए गए मृत्यु-दंड को दर्शाता है। अनुवाद कानूनी बल बनाए रखता है, पर प्रक्रिया का अतिरिक्त विवरण नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सम्मानसूचक संबोधन और गरिमापूर्ण कथन-शैली में है। ‘जो कोई पुरुष’ मूल के पुल्लिंग एकवचन को स्वाभाविक हिन्दी में रखता है। फुटनोट चिह्न उसी पद ‘आज्ञा’ पर लगाया गया है जिसकी शाब्दिक इब्रानी अभिव्यक्ति वह स्पष्ट करता है।
