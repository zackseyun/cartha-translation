source:
  edition: WLC
  text: הֲ/ל֤וֹא צִוִּיתִ֨י/ךָ֙ חֲזַ֣ק וֶ/אֱמָ֔ץ אַֽל תַּעֲרֹ֖ץ וְ/אַל תֵּחָ֑ת כִּ֤י עִמְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/009.yaml
  text: Have I not commanded you? Be strong and courageous. Do not be terrified[a], and do not be dismayed, for Yahweh your God is with you wherever you go.
translation:
  language: hi
  text: क्या मैंने तुम्हें आज्ञा नहीं दी? मज़बूत और साहसी बनो। भयभीत मत हो और हिम्मत मत हारो, क्योंकि याहवे[a], तुम्हारा परमेश्वर, जहाँ भी तुम जाओ, तुम्हारे साथ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में YHWH, परमेश्वर का व्यक्तिगत नाम; इसका पारंपरिक हिंदी रूप ‘यहोवा’ है, और कई अनुवाद इसे ‘प्रभु’ लिखते हैं।
    reason: दिव्य नाम के रूप और पारंपरिक वैकल्पिक प्रस्तुतियों को स्पष्ट करना।
lexical_decisions:
- source_word: הֲלוֹא צִוִּיתִיךָ
  choice: क्या मैंने तुम्हें आज्ञा नहीं दी है?
  rationale: नकारात्मक आलंकारिक प्रश्न आज्ञा को ज़ोर देकर स्मरण कराता है; यह रूप हिंदी में स्वाभाविक रहते हुए उस बल को बनाए रखता है।
- source_word: חֲזַק וֶאֱמָץ
  choice: मज़बूत और साहसी बनो
  rationale: दोनों आज्ञार्थक शब्द क्रमशः सामर्थ्य/दृढ़ता और साहस व्यक्त करते हैं; हिंदी में यह युग्म स्पष्ट और सहज है।
- source_word: אַל־תַּעֲרֹץ
  choice: भयभीत मत हो
  rationale: ערץ साधारण चिंता से अधिक गहरे भय या आतंक का भाव रखता है; ‘भयभीत’ इस तीव्रता को संक्षेप में व्यक्त करता है।
- source_word: וְאַל־תֵּחָת
  choice: और हिम्मत मत हारो
  rationale: חתת यहाँ भीतर से टूटने, निरुत्साहित या हताश होने का भाव देता है; ‘हिम्मत मत हारो’ आधुनिक हिंदी में स्वाभाविक और अर्थपूर्ण है।
- source_word: כִּי עִמְּךָ
  choice: क्योंकि ... तुम्हारे साथ रहेगा
  rationale: כִּי पिछली आज्ञाओं का आधार बताता है और עִמְּךָ परमेश्वर की साथ रहने वाली उपस्थिति व्यक्त करता है। भविष्यगत यात्रा के संदर्भ में हिंदी का ‘रहेगा’ स्वाभाविक है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर याहवे
  rationale: व्यक्तिगत दिव्य नाम YHWH को शीर्षक से बदलने के बजाय ‘याहवे’ के रूप में दिया गया है; संबंधवाचक प्रत्यय को ‘तुम्हारा परमेश्वर’ व्यक्त करता है।
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: तुम जहाँ कहीं जाओगे
  rationale: शाब्दिक संरचना हर उस स्थान या परिस्थिति को समेटती है जहाँ यहोशू जाएगा; ‘जहाँ कहीं’ उसका व्यापक वितरक भाव बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम YHWH है। ‘याहवे’ संभावित हिब्रू उच्चारण का निकट लिप्यंतरण है और इसे केवल उपाधि ‘प्रभु’ से नहीं बदलता; पाठक-सहायता के लिए पाद-टिप्पणी दी गई है।
- issue: दिव्य उपस्थिति का काल
  choice: तुम्हारे साथ रहेगा
  alternative: तुम्हारे साथ है
  rationale: हिब्रू में स्पष्ट क्रिया नहीं है और ‘तुम्हारे साथ’ वर्तमान वास्तविकता भी व्यक्त कर सकता है। हिंदी में आगामी जाने की हर स्थिति तक जारी उपस्थिति को ‘रहेगा’ स्वाभाविक रूप से व्यक्त करता है, बिना प्रतिज्ञा को केवल भविष्य तक सीमित करने के अभिप्राय के।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सीधा संबोधन रखा गया है। मूल के एकवचन पुल्लिंग संबोधन को संदर्भानुसार ‘तुम’ से व्यक्त किया गया है। ‘मज़बूत’ सामान्य पाठक के लिए सहज है और ‘साहसी’ के साथ मूल युग्म का अंतर बनाए रखता है।
