  text: 'तब यहोशू ने लोगों के अधिकारियों को आज्ञा दी:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: तब ... आज्ञा दी
  rationale: वय्यिक्तोल रूप कथा को अगली घटना की ओर बढ़ाता है; ‘तब’ क्रमिकता को स्वाभाविक हिन्दी में व्यक्त करता है और ‘आज्ञा दी’ क्रिया की निर्देशात्मक शक्ति बनाए रखता है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित और मूल नाम के निकट रूप।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का चिह्न है; हिन्दी में इसका स्वतंत्र शब्दगत समकक्ष आवश्यक नहीं है।
- source_word: שֹׁטְרֵי
  choice: अधिकारियों
  rationale: यह शब्द प्रशासनिक पदाधिकारियों या निरीक्षकों को दर्शाता है, सैन्य सेनापतियों को नहीं; ‘अधिकारी’ आधुनिक हिन्दी में इस औपचारिक प्रशासनिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָעָם
  choice: लोगों के
  rationale: यहाँ עָם सामूहिक प्रजा या समुदाय को सूचित करता है; ‘लोगों’ सबसे सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: לֵאמֹר
  choice: '[अल्पविराम द्वारा व्यक्त]'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में ‘कहा’ जोड़ने पर ‘आज्ञा दी’ के साथ अनावश्यक पुनरुक्ति होती; अंतिम अल्पविराम अगले पद के कथन से संबंध स्पष्ट रखता है।
