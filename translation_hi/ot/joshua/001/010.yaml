translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी है। ‘लोगों के अधिकारियों’ से प्रशासनिक भूमिका सुरक्षित रहती है। לֵאמֹר को यांत्रिक रूप से ‘यह कहते हुए’ न रखकर हिन्दी वाक्य-विन्यास में अल्पविराम से व्यक्त किया गया है।
