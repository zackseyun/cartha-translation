base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/011.yaml
  text: Go through the midst of the camp and command the people[a], saying, ‘Prepare provisions for yourselves, because within three days you are crossing this Jordan to go in to take possession of the land that Yahweh your God is giving you to possess it.’
translation:
  language: hi
  text: 'छावनी के बीच से होकर जाओ और लोगों को यह आज्ञा दो: ‘अपने लिए यात्रा की रसद तैयार कर लो, क्योंकि तीन दिन के भीतर तुम इस यरदन को पार करके उस देश में प्रवेश करने और उस पर अधिकार करनेवाले हो, जिसे तुम्हारा परमेश्वर यहोवा तुम्हें उसे अधिकार में लेने के लिए दे रहा है।’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तीन दिन के भीतर” का अनुवाद “तीन दिन और बीतने पर” या “तीन दिन बाद” भी किया जा सकता है। हिब्रू अभिव्यक्ति पार करने से पहले बची हुई छोटी अवधि पर बल देती है।
    reason: कालगत हिब्रू अभिव्यक्ति के वैकल्पिक अर्थों को दर्ज करना।
lexical_decisions:
- source_word: עִבְרוּ בְּקֶרֶב הַמַּחֲנֶה
  choice: छावनी के बीच से होकर जाओ
  rationale: बहुवचन आज्ञार्थक और קֶרֶב के ‘बीच/मध्य’ भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: וְצַוּוּ אֶת־הָעָם
  choice: लोगों को यह आज्ञा दो
  rationale: צוה की अधिकारपूर्ण शक्ति को ‘आज्ञा दो’ स्पष्ट रूप से व्यक्त करता है।
- source_word: הָכִינוּ לָכֶם צֵידָה
  choice: अपने लिए यात्रा का भोजन तैयार कर लो
  rationale: צֵידָה यात्रा के लिए रखे गए खाद्य-सामान को दर्शाता है; ‘यात्रा का भोजन’ साधारण पाठक के लिए ‘रसद’ से अधिक सहज है और לָכֶם भी सुरक्षित रहता है।
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: तीन दिन के भीतर
  rationale: यह शेष अल्प अवधि और निकट भविष्य को व्यक्त करता है, बिना ‘ठीक तीन दिन बाद’ जैसी अनावश्यक कालगत निश्चितता जोड़े।
- source_word: אַתֶּם עֹבְרִים
  choice: तुम ... पार करनेवाले हो
  rationale: हिब्रू कृदंत के आसन्न और निश्चित कार्य के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶת־הַיַּרְדֵּן הַזֶּה
  choice: इस यरदन को
  rationale: निर्देशक ‘इस’ को सुरक्षित रखता है; हिन्दी बाइबलीय प्रयोग में नदी का नाम ‘यरदन’ पर्याप्त है।
- source_word: לָבוֹא לָרֶשֶׁת אֶת־הָאָרֶץ
  choice: उस देश में प्रवेश करने और उस पर अधिकार करने
  rationale: दोनों उद्देश्यसूचक क्रियाओं को बनाए रखता है और ירשׁ के उत्तराधिकार/विजय-संदर्भित अधिकार-ग्रहण भाव को व्यक्त करता है।
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर यहोवा
  rationale: व्यक्तिगत वाचा-नाम יהוה को ‘यहोवा’ और संबंधसूचक वाक्यांश को स्वाभाविक हिन्दी क्रम में प्रस्तुत करता है।
- source_word: נֹתֵן לָכֶם
  choice: तुम्हें ... दे रहा है
  rationale: कृदंत के वर्तमान, जारी और निश्चित दान के भाव को बनाए रखता है।
- source_word: לְרִשְׁתָּהּ
  choice: अधिकार में लेने के लिए
  rationale: अंतिम उद्देश्यसूचक रूप को छोड़ता नहीं और भूमि पर अधिकार ग्रहण करने की पुनरुक्ति को मूल के अनुसार सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला नामरूप है और इसे सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: भूमि देने और उस पर अधिकार करने का संबंध
  choice: जिसे ... दे रहा है ... अधिकार में लेने के लिए
  alternative: जिसे ... देगा
  rationale: मूल पाठ परमेश्वर के वर्तमान/निश्चित दान और इस्राएल के वास्तविक अधिकार-ग्रहण—दोनों को साथ रखता है; अनुवाद इस तनाव को विलीन नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सहज शैली। ‘रसद’ के स्थान पर ‘यात्रा का भोजन’ सामान्य पाठक के लिए अधिक स्पष्ट है। मुख्य पाठ में फुटनोट चिह्न [a] जोड़ा गया है।
