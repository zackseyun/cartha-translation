source:
  edition: WLC
  text: כָּל מָק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם נְתַתִּ֑י/ו כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/003.yaml
  text: Every place on which the sole of your foot treads[a], I have given to you, just as I spoke to Moses.
translation:
  language: hi
  text: हर वह स्थान जिस पर तुम्हारे पाँव का तलवा पड़ेगा[a], मैंने तुम्हें दे दिया है, ठीक वैसे ही जैसे मैंने मूसा से कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर वह स्थान जहाँ तुम्हारे पाँव का तलवा पड़ेगा।”
    reason: संबन्धवाचक वाक्य की वैकल्पिक, अधिक सीधी हिंदी संरचना।
lexical_decisions:
- source_word: כָּל מָקוֹם
  choice: जिस-जिस स्थान
  rationale: כָּל के साथ מָקוֹם का भाव वितरणात्मक है—हर एक स्थान। हिंदी में ‘जिस-जिस स्थान’ संबन्धवाचक वाक्य के साथ इस व्यापकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר ... בּוֹ
  choice: पर ... पड़ेगा
  rationale: संबन्धवाचक אֲשֶׁר और स्थानसूचक בּוֹ को हिंदी में ‘जिस-जिस स्थान पर’ की संरचना द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: תִּדְרֹךְ
  choice: पड़ेगा
  rationale: דרך का मूल बिंब पाँव रखकर भूमि पर पड़ने या रौंदने का है। ‘पाँव का तलवा पड़ेगा’ आधुनिक हिंदी में ठोस बिंब बनाए रखता है और यहाँ अनावश्यक कठोरता वाले ‘रौंदेगा’ से अधिक स्वाभाविक है।
- source_word: כַּף רַגְלְכֶם
  choice: तुम्हारे पाँव का तलवा
  rationale: כַּף רֶגֶל विशेष रूप से पाँव के तलवे को सूचित करता है। बहुवचन संबोधन को ‘तुम्हारे’ में रखा गया है, जबकि एकवचन ‘पाँव का तलवा’ हिंदी के वितरणात्मक प्रयोग में स्वाभाविक है।
- source_word: לָכֶם נְתַתִּיו
  choice: वह मैंने तुम्हें दे दिया है
  rationale: लाभार्थी לָכֶם को ‘तुम्हें’ और वस्तुसूचक प्रत्यय को ‘वह’ से व्यक्त किया गया है। पूर्ण क्रिया ‘दे दिया है’ दैवी अनुदान को स्थापित और निश्चित बताती है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह वर्तमान कथन और मूसा से पहले कही गई बात के बीच स्पष्ट अनुरूपता व्यक्त करता है।
- source_word: דִּבַּרְתִּי אֶל מֹשֶׁה
  choice: मैंने मूसा से कहा था
  rationale: דבר אל का सामान्य अर्थ किसी से बोलना या कहना है। ‘कहा था’ हिंदी में स्वाभाविक है और ‘वादा किया था’ जैसी व्याख्यात्मक वृद्धि से बचता है।
theological_decisions:
- issue: दैवी भूमि-अनुदान का काल-पक्ष
  choice: ‘मैंने ... दे दिया है’
  alternative: ‘मैं ... देता हूँ’ या ‘मैं ... दूँगा’
  rationale: नְתַתִּיו का पूर्ण रूप अनुदान को दैवी निर्णय में पहले से स्थापित बताता है, यद्यपि भूमि पर वास्तविक अधिकार आगे ऐतिहासिक रूप से प्राप्त होगा। भविष्यकाल करने से मूल की पूर्णता और निश्चितता कम हो जाती।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण रूप। ‘जिस-जिस स्थान’ वितरणात्मक व्यापकता व्यक्त करता है; ‘पाँव का तलवा’ मूल भूमि-स्पर्श के ठोस बिंब को सुरक्षित रखता है। बहुवचन ‘तुम्हारे/तुम्हें’ इस्राएली समुदाय की ओर संकेत करता है।
