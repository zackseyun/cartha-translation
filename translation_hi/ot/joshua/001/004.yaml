translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भौगोलिक सीमा-वर्णन की मूल संरचना और ‘इस लबानोन’ का संकेतवाचक भाव सुरक्षित है। अंग्रेज़ी परामर्श पाठ में भूमध्य सागर वाली टिप्पणी का चिह्न भूल से ‘महानदी’ के बाद था; स्रोत के अर्थ के अनुसार उसे ‘महान समुद्र’ के बाद रखा गया है।
