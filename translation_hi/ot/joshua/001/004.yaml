  text: מֵ/הַ/מִּדְבָּר֩ וְ/הַ/לְּבָנ֨וֹן הַ/זֶּ֜ה וְֽ/עַד הַ/נָּהָ֧ר הַ/גָּד֣וֹל נְהַר פְּרָ֗ת כֹּ֚ל אֶ֣רֶץ הַֽ/חִתִּ֔ים וְ/עַד הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֣וֹא הַ/שָּׁ֑מֶשׁ יִֽהְיֶ֖ה גְּבוּלְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/004.yaml
  text: From the wilderness and this Lebanon as far as the great river[a], the Euphrates River—all the land of the Hittites—and as far as the Great Sea, toward the going down of the sun[b], shall be your border.
translation:
  language: hi
  text: मरुभूमि और इस लबानोन से लेकर महान नदी, अर्थात फरात नदी तक—हित्तियों का सारा देश—और सूर्य के डूबने की ओर[b] महान समुद्र[a] तक तुम्हारी सीमा होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात भूमध्य सागर।
    reason: cross_reference
  - marker: b
    text: या, ‘पश्चिम की ओर’; शाब्दिक रूप से, ‘सूर्य के डूबने की ओर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהַמִּדְבָּר
  choice: मरुभूमि से
  rationale: מִדְבָּר निर्जन अथवा मरुस्थलीय भूभाग को दर्शाता है। ‘मरुभूमि’ आधुनिक हिन्दी में स्वाभाविक भौगोलिक पद है और किसी विशिष्ट मरुस्थल का नाम अनावश्यक रूप से नहीं जोड़ता। वाक्य में ‘से’ संयुक्त आरंभिक सीमा ‘मरुभूमि और इस लबानोन से’ पर लागू होता है।
- source_word: וְהַלְּבָנוֹן הַזֶּה
  choice: और इस लबानोन
  rationale: ‘इस’ स्पष्ट संकेतवाचक הַזֶּה को सुरक्षित रखता है; ‘लबानोन’ भौगोलिक नाम का प्रचलित हिन्दी लिप्यंतरण है।
- source_word: וְעַד הַנָּהָר הַגָּדוֹל נְהַר פְּרָת
  choice: से लेकर महानदी, अर्थात फरात नदी तक
  rationale: 'עַד की सीमावाचक भूमिका ‘तक’ से व्यक्त हुई है। ‘अर्थात’ इब्रानी के समानाधिकरण को स्पष्ट करता है: महानदी की पहचान फरात नदी के रूप में होती है।'
- source_word: כֹּל אֶרֶץ הַחִתִּים
  choice: हित्तियों का सारा देश
  rationale: यह כֹּל तथा जातीय-भौगोलिक संबंध दोनों को सहज और पूर्ण रूप से व्यक्त करता है।
- source_word: וְעַד הַיָּם הַגָּדוֹל
  choice: और महान समुद्र तक
  rationale: मुख्य पाठ में इब्रानी की उपाधि ‘महान समुद्र’ रखी गई है; भूमध्य सागर के रूप में इसकी पहचान टिप्पणी में दी गई है।
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: सूर्य के अस्त होने की दिशा में
  rationale: यह मूल बिंब को बनाए रखते हुए आधुनिक हिन्दी में दिशा-सूचक अर्थ स्पष्ट करता है।
- source_word: יִהְיֶה גְּבוּלְכֶם
  choice: तुम्हारी सीमा होगी
  rationale: गְּבוּל यहाँ उल्लिखित भूभाग की सीमा दर्शाता है; भविष्यसूचक प्रतिज्ञात्मक अपूर्ण क्रिया को ‘होगी’ स्वाभाविक रूप से व्यक्त करता है।
