base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/007.yaml
  text: Only be strong and very courageous[a], being careful to do according to all the law that Moses my servant commanded you. Do not turn from it to the right or to the left, so that you may act wisely wherever you go.
translation:
  language: hi
  text: केवल बहुत दृढ़ और साहसी बनो। जिस सारी व्यवस्था का आदेश मेरे सेवक मूसा ने तुम्हें दिया था, उसके अनुसार चलने में सावधान रहो। उससे न दाईं ओर मुड़ना, न बाईं ओर, ताकि जहाँ कहीं तुम जाओ, वहाँ बुद्धिमानी से काम करो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जहाँ कहीं तुम जाओ, वहाँ सफल हो’ अथवा ‘सफलता पाओ।’
    reason: תַּשְׂכִּיל विवेकपूर्ण आचरण के साथ उसके फलस्वरूप सफलता का भाव भी व्यक्त कर सकता है।
