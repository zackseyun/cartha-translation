theological_decisions:
- issue: वाचा के संदर्भ में תּוֹרָה का अर्थ
  choice: व्यवस्था
  alternative: शिक्षा / निर्देश
  rationale: तत्काल संदर्भ मूसा की दी हुई आज्ञाओं का है, इसलिए कानूनी-वाचागत अर्थ प्रमुख है; व्यापक अर्थ ‘शिक्षा’ संभव है, पर यहाँ कम विशिष्ट है।
- issue: תַּשְׂכִּיל का अर्थ
  choice: बुद्धिमानी से काम करो
  alternative: सफल हो / सफलता पाओ
  rationale: इब्रानी शब्द विवेकपूर्ण आचरण और उससे मिलने वाली सफलता, दोनों की ओर संकेत कर सकता है। मुख्य पाठ में विवेक का मूल भाव रखा गया है और सफलता का भाव पाद-टिप्पणी में, ताकि समृद्धि या सफलता का अर्थ आवश्यकता से अधिक न थोपा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। एक व्यक्ति को संबोधित करने वाले इब्रानी एकवचन के लिए स्वाभाविक ‘तुम’ प्रयोग किया गया है। ‘दाएँ’ और ‘बाएँ’ का मूल मार्ग-रूपक ज्यों का त्यों सुरक्षित है।
