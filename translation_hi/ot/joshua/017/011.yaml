base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/011.yaml
  text: And Manasseh had in Issachar and in Asher Beth-shean and its daughter villages[a], and Ibleam and its daughter villages, and the inhabitants of Dor and its daughter villages, and the inhabitants of En-dor and its daughter villages, and the inhabitants of Taanach and its daughter villages[b], and the inhabitants of Megiddo and its daughter villages—the three regions.
translation:
  language: hi
  text: 'और इस्साकार और आशेर के क्षेत्रों में मनश्शे के हिस्से में ये स्थान थे: बेत-शान और उसके आश्रित गाँव, यिबलाम और उसके आश्रित गाँव, दोर के निवासी और दोर के आश्रित गाँव, एन-दोर के निवासी और एन-दोर के आश्रित गाँव, तानाक के निवासी और तानाक के आश्रित गाँव, और मगिद्दो के निवासी और मगिद्दो के आश्रित गाँव—ये तीन क्षेत्र थे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तीन क्षेत्र’ वाला इब्रानी वाक्यांश कठिन है; इसका अनुवाद ‘तीन जिले’ या सम्भवतः ‘तीन ऊँचे भूभाग’ भी हो सकता है। ‘आश्रित गाँव’ के पीछे शाब्दिक इब्रानी अभिव्यक्ति ‘उसकी बेटियाँ’ है, जो किसी नगर से संबद्ध गाँवों या बस्तियों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: וַיְהִי לִמְנַשֶּׁה
  choice: मनश्शे के हिस्से में ये स्थान थे
  rationale: यह इब्रानी मुहावरा मनश्शे के अधिकार अथवा आवंटन को व्यक्त करता है। यह हिन्दी रूप स्वाभाविक ढंग से उसी भाव को स्पष्ट करता है।
- source_word: בְּיִשָּׂשכָר וּבְאָשֵׁר
  choice: इस्साकार और आशेर के क्षेत्रों में
  rationale: בְ यहाँ दोनों गोत्रों के भूभाग के भीतर स्थित होने का बोध कराता है; ‘के क्षेत्रों में’ इस प्रादेशिक अर्थ को स्पष्ट रखता है।
- source_word: בֵּית שְׁאָן
  choice: बेत-शान
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בְנוֹתֶיהָ
  choice: उसके अधीन गाँव
  rationale: शाब्दिक अर्थ ‘उसकी बेटियाँ’ है, पर यह मुख्य नगर पर निर्भर आसपास की बस्तियों के लिए इब्रानी मुहावरा है। ‘अधीन गाँव’ सम्बन्ध को स्पष्ट और सहज बनाता है।
- source_word: יִבְלְעָם
  choice: यिबलाम
  rationale: इब्रानी नाम का निकट हिन्दी लिप्यंतरण।
- source_word: יֹשְׁבֵי
  choice: निवासी
  rationale: कृदन्त का अर्थ किसी स्थान में बसने वाले लोग है; ‘निवासी’ संक्षिप्त और स्वाभाविक है।
- source_word: עֵין דֹּר
  choice: एन-दोर
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण, संयुक्त नाम की संरचना बनाए रखते हुए।
- source_word: תַעְנַךְ
  choice: तानाक
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מְגִדּוֹ
  choice: मगिद्दो
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: שְׁלֹשֶׁת הַנָּפֶת
  choice: ये तीन क्षेत्र थे
  rationale: नָפֶת यहाँ कठिन और दुर्लभ भौगोलिक अथवा प्रशासनिक पद है। ‘क्षेत्र’ प्रसंगानुकूल व्यापक अर्थ देता है, जबकि अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
