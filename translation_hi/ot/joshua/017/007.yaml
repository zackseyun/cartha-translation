source:
  edition: WLC
  text: וַ/יְהִ֤י גְבוּל מְנַשֶּׁה֙ מֵֽ/אָשֵׁ֔ר הַֽ/מִּכְמְתָ֔ת אֲשֶׁ֖ר עַל פְּנֵ֣י שְׁכֶ֑ם וְ/הָלַ֤ךְ הַ/גְּבוּל֙ אֶל הַ/יָּמִ֔ין אֶל יֹשְׁבֵ֖י עֵ֥ין תַּפּֽוּחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/007.yaml
  text: And the border of Manasseh was from Asher to Michmethath[a], which is opposite Shechem; then the border went southward[c][b], toward the inhabitants of En-tappuah.
translation:
  language: hi
  text: मनश्शे की सीमा आशेर से मिकमतात तक थी, जो शकेम के सामने[a] है। फिर सीमा दाहिनी ओर[b], एन-तप्पूह[c] के निवासियों की ओर बढ़ी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो शकेम के सम्मुख है” अथवा “जिसका मुख शकेम की ओर है।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “दाहिनी ओर” है; सीमा-विवरणों में इसका आशय दक्षिण दिशा की ओर हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “एन-तप्पूह” का अर्थ “तप्पूह का सोता” है।
    reason: cultural_note
lexical_decisions:
- source_word: גְבוּל
  choice: सीमा
  rationale: भूमि-विभाजन के प्रसंग में यह गोत्रीय भूभाग की सीमारेखा को दर्शाता है; आधुनिक हिन्दी में ‘सीमा’ स्वाभाविक और दोनों प्रयोगों के लिए उपयुक्त है।
- source_word: מֵאָשֵׁר
  choice: आशेर से
  rationale: מִן सीमा के आरम्भ-बिंदु को सूचित करता है; ‘आशेर’ गोत्रीय अथवा भौगोलिक संदर्भ को खुला रखता है।
- source_word: הַמִּכְמְתָת
  choice: मिकमतात
  rationale: यह स्थान-नाम है, इसलिए इसका अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
- source_word: אֲשֶׁר עַל־פְּנֵי שְׁכֶם
  choice: जो शकेम के सामने है
  rationale: עַל־פְּנֵי आमने-सामने, सम्मुख अथवा सामने होने का स्थानिक संबंध बताता है; यह अनुवाद किसी निश्चित दिशा को अनावश्यक रूप से नहीं जोड़ता।
- source_word: וְהָלַךְ הַגְּבוּל
  choice: फिर सीमा ... बढ़ी
  rationale: सीमा-विवरणों में הלך सीमारेखा के आगे जाने या फैलने का मुहावरा है; ‘बढ़ी’ हिन्दी में स्वाभाविक है और ‘फिर’ क्रम को व्यक्त करता है।
- source_word: אֶל־הַיָּמִין
  choice: दाहिनी ओर
  rationale: इब्रानी का शाब्दिक अर्थ ‘दाहिनी ओर’ है। भौगोलिक अभिमुखता में इससे दक्षिण दिशा का संकेत हो सकता है, पर मुख्य पाठ मूल अभिव्यक्ति की अस्पष्टता बनाए रखता है।
- source_word: יֹשְׁבֵי
  choice: निवासियों
  rationale: कृदन्त रूप किसी स्थान में रहने वाले लोगों को दर्शाता है; ‘निवासी’ वर्तमान मानक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: עֵין תַּפּוּחַ
  choice: एन-तप्पूह
  rationale: यह עֵין (‘सोता’) से बना स्थान-नाम है; मुख्य पाठ में लिप्यंतरण और अर्थ को पादटिप्पणी में रखना उचित है।
