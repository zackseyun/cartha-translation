translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, स्पष्ट और गरिमापूर्ण सीमा-विवरण। स्थान-नामों का देवनागरी लिप्यंतरण किया गया है। मूल की दिशात्मक अस्पष्टता को मुख्य पाठ में सुरक्षित रखते हुए संभावित दक्षिणार्थ पादटिप्पणी में दिया गया है।
