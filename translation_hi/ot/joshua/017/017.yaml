  text: Joshua said to the house of Joseph—to Ephraim and Manasseh—saying[a], “You are a numerous people, and you have great strength[b]; you shall not have only one allotment.”
translation:
  language: hi
  text: यहोशू ने यूसुफ के घराने—अर्थात् एप्रैम और मनश्शे—से कहा, “तुम लोगों की संख्या बहुत है[a] और तुम्हारे पास बड़ी शक्ति है; तुम्हारा हिस्सा केवल एक ही नहीं होगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम एक महान प्रजा हो।” इब्रानी पद संख्या की अधिकता या महानता—दोनों व्यक्त कर सकता है; यहाँ भूमि के बँटवारे का संदर्भ संख्या की अधिकता के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “गोराल,” अर्थात् चिट्ठी द्वारा निर्धारित भाग। यहोशू की पुस्तक में यह शब्द प्रायः चिट्ठी डालकर दिए गए विरासत के भूभाग के लिए प्रयुक्त होता है; इसलिए यहाँ “हिस्सा” कहा गया है।
    reason: lexical_alternative
