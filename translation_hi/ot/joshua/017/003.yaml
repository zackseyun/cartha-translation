source:
  edition: WLC
  text: וְ/לִ/צְלָפְחָד֩ בֶּן חֵ֨פֶר בֶּן גִּלְעָ֜ד בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֗ה לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה וְ/נֹעָ֔ה חָגְלָ֥ה מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/003.yaml
  text: 'Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, had no sons, but only daughters; and these are the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: hi
  text: 'सलोफाद, हेपेर का पुत्र, गिलाद का पुत्र, माकीर का पुत्र और मनश्शे का पुत्र, के कोई पुत्र नहीं थे, केवल पुत्रियाँ थीं। उसकी पुत्रियों के नाम ये थे: महला, नोआ, होगला, मिल्का और तिरसा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/צְלָפְחָד
  choice: और सलोफाद ... के
  rationale: וְלִצְלָפְחָד का ל संबंध/अधिकार का भाव लिए अगले कथन का विषय प्रस्तुत करता है। हिन्दी में ‘सलोफाद के कोई पुत्र नहीं’ स्वाभाविक है; आरंभिक וְ को ‘और’ से रखा गया है।
- source_word: בֶּן חֵפֶר בֶּן גִּלְעָד בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: हेपेर का पुत्र, गिलाद का पोता, माकीर का परपोता और मनश्शे का वंशज
  rationale: बार-बार आए בֶּן की वंशावलीगत कड़ी को स्पष्ट आधुनिक हिन्दी में पीढ़ियों के संबंध से व्यक्त किया गया है। अंतिम दूरस्थ संबंध के लिए ‘वंशज’ अनावश्यक शाब्दिक कठोरता से बचाता है, जबकि पूरी वंश-रेखा सुरक्षित रहती है।
- source_word: לֹא הָיוּ לוֹ בָּנִים כִּי אִם בָּנוֹת
  choice: उसके कोई पुत्र नहीं, केवल पुत्रियाँ थीं
  rationale: בָּנִים यहाँ पुत्रियों के विपरीत पुरुष संतान को दर्शाता है, इसलिए ‘संतान’ नहीं बल्कि ‘पुत्र’ आवश्यक है। כִּי אִם का अपवादात्मक-विरोधी अर्थ ‘केवल’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: उसकी पुत्रियों के नाम ये थे
  rationale: नामों की सूची प्रस्तुत करने वाले इब्रानी सूत्र का स्वाभाविक हिन्दी रूप; कथात्मक संदर्भ के अनुरूप ‘थे’ रखा गया है।
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: महला, नोआ, होगला, मिल्का और तिरसा
  rationale: व्यक्तिनामों को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
