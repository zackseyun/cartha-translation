source:
  edition: WLC
  text: וְ/לֹ֤א יָכְלוּ֙ בְּנֵ֣י מְנַשֶּׁ֔ה לְ/הוֹרִ֖ישׁ אֶת הֶֽ/עָרִ֣ים הָ/אֵ֑לֶּה וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/012.yaml
  text: But the sons of Manasseh were not able to dispossess these cities[a], and the Canaanites persisted in dwelling in this land.
translation:
  language: hi
  text: परन्तु मनश्शे के वंशज इन नगरों के निवासियों को बेदखल न कर सके, और कनानी लोग इस देश में बसे रहने पर अड़े रहे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कनानी लोगों ने इस देश में बसे रहने की ठान ली।” इब्रानी क्रिया इच्छा, दृढ़ निश्चय या हठपूर्वक बने रहने का भाव व्यक्त कर सकती है; ‘कनानी’ मूल में एकवचन सामूहिक संज्ञा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: न कर सके
  rationale: यह क्रिया सामर्थ्य या क्षमता बताती है; निषेध के साथ ‘न कर सके’ स्वाभाविक हिन्दी में असमर्थता व्यक्त करता है।
- source_word: בְּנֵי מְנַשֶּׁה
  choice: मनश्शे के वंशज
  rationale: शाब्दिक अर्थ ‘मनश्शे के पुत्र’ है, पर यहाँ पूरे गोत्र के लोगों की बात है; ‘वंशज’ आधुनिक हिन्दी में इस सामूहिक पारिवारिक अर्थ को स्पष्ट करता है।
- source_word: לְהוֹרִישׁ
  choice: बेदखल करना
  rationale: हिफ़ील रूप यहाँ पहले से बसे लोगों को उनके क्षेत्र से हटाने या अधिकारच्युत करने का अर्थ देता है। ‘बेदखल करना’ इसके क्षेत्रीय और अधिकार-संबंधी बल को बनाए रखता है।
- source_word: הֶעָרִים הָאֵלֶּה
  choice: इन नगरों के निवासियों को
  rationale: इब्रानी में प्रत्यक्ष कर्म ‘इन नगरों’ है, पर नगरों को बेदखल करना उनके निवासियों को बेदखल करने का लक्षणात्मक प्रयोग है। हिन्दी में आशय स्पष्ट करने के लिए ‘निवासियों’ कहा गया है।
- source_word: וַיּוֹאֶל
  choice: अड़े रहे
  rationale: יָאַל इच्छा, तत्परता या दृढ़ निश्चय व्यक्त कर सकता है। इस प्रसंग में ‘अड़े रहे’ कनानियों के दृढ़तापूर्वक वहीं बसे रहने का स्वाभाविक भाव देता है, बिना मूल की अर्थ-सीमा को केवल इच्छा तक सीमित किए।
- source_word: הַכְּנַעֲנִי
  choice: कनानी लोग
  rationale: मूल में संज्ञा व्याकरणिक रूप से एकवचन है, पर यहाँ वह जाति-समुदाय के लिए सामूहिक रूप में प्रयुक्त हुई है। हिन्दी में ‘कनानी लोग’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לָשֶׁבֶת
  choice: बसे रहने
  rationale: यहाँ क्रिया उस क्षेत्र में निरन्तर निवास करने को दर्शाती है; ‘बसे रहने’ में निवास और बने रहने—दोनों का भाव आता है।
- source_word: בָּאָרֶץ הַזֹּאת
  choice: इस देश में
  rationale: אֶרֶץ यहाँ चर्चा में आए भूभाग को दर्शाता है। आधुनिक हिन्दी में ‘इस देश में’ उस क्षेत्रीय अर्थ को सहज रूप से व्यक्त करता है।
