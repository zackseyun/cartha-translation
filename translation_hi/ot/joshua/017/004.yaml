base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/004.yaml
  text: So they came near before Eleazar the priest[a], and before Joshua son of Nun, and before the leaders, saying, “Yahweh commanded Moses to give us an inheritance among our brothers.” So he gave them, according to the command of Yahweh[c][b], an inheritance among their father's brothers.
translation:
  language: hi
  text: तब वे एलीआज़र याजक, नून के पुत्र यहोशू और प्रधानों के सामने आकर बोलीं, “याहवे ने मूसा को आज्ञा दी थी कि वह हमें हमारे भाइयों के बीच विरासत दे।” तब उसने याहवे की आज्ञा के अनुसार[a] उन्हें उनके पिता के भाइयों के बीच विरासत दी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे के मुख के अनुसार।” यह एक इब्रानी मुहावरा है, जिसका अर्थ है “याहवे की आज्ञा के अनुसार।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके पिता के भाइयों के बीच।” प्रसंग में यह उनके पितृवंश के भूमि-विभाजन में उनके भाग को सूचित करता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: वे ... सामने आकर बोलीं
  rationale: क्रिया स्त्रीलिंग बहुवचन है और संदर्भ सलोफ़हाद की पुत्रियों का है। ‘सामने आकर’ औपचारिक रूप से अधिकारियों के समक्ष उपस्थित होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: तीन अधिकारियों/समूहों के समक्ष सार्वजनिक उपस्थिति को दर्शाता है; हिन्दी में संयुक्त सूची के साथ एक बार प्रयोग स्वाभाविक है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: כֹּהֵן के पदनाम का प्रचलित और सटीक बाइबिलीय हिन्दी रूप।
- source_word: הַנְּשִׂיאִים
  choice: प्रधानों
  rationale: जनजातीय अथवा सामुदायिक मुखियाओं के लिए आधुनिक, गरिमापूर्ण शब्द; ‘राजकुमारों’ जैसा भ्रामक राजवंशीय अर्थ नहीं देता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: לָתֶת לָנוּ נַחֲלָה
  choice: हमें ... विरासत दे
  rationale: नַחֲלָה यहाँ वंशानुगत भूमि-भाग है; ‘विरासत’ अर्थ और प्रसंग दोनों को स्पष्ट रखता है।
- source_word: בְּתוֹךְ אַחֵינוּ
  choice: हमारे भाइयों के बीच
  rationale: मूल का पुल्लिंग संबंध-सूचक पद और भूमि-विभाजन की सामाजिक-कानूनी विशिष्टता सुरक्षित रहती है।
- source_word: וַיִּתֵּן
  choice: यहोशू ने ... दी
  rationale: इब्रानी क्रिया एकवचन पुल्लिंग है। निकटवर्ती एकवचन अधिकारी यहोशू को कर्ता मानना स्वाभाविक है; नाम स्पष्ट करने से हिन्दी में अस्पष्ट सर्वनाम से बचा गया है।
- source_word: אֶל־פִּי יְהוָה
  choice: याहवे की आज्ञा के अनुसार
  rationale: शाब्दिक ‘याहवे के मुख के अनुसार’ का अर्थगत इब्रानी मुहावरा है; हिन्दी में आदेश की प्रामाणिकता स्वाभाविक रूप से व्यक्त होती है।
- source_word: אֲחֵי אֲבִיהֶן
  choice: उनके पिता के भाइयों के बीच
  rationale: मूल की विशिष्ट पितृवंशीय संबंध-रचना को ‘रिश्तेदारों’ जैसे व्यापक शब्द में समतल नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में व्यक्तिगत वाचा-नाम है; उसका लिप्यंतरण नाम और उपाधि के अंतर को बनाए रखता है।
- issue: אַחֵינוּ में लिंग-विशिष्ट संबंध
  choice: हमारे भाइयों
  alternative: हमारे भाई-बहनों / संबंधियों
  rationale: यह कानूनी निवेदन पुरुष कुल-सदस्यों के बीच भूमि-अंश पाने के विषय में है, इसलिए मूल की सामाजिक विशिष्टता बनाए रखी गई है।
- issue: וַיִּתֵּן का निहित कर्ता
  choice: यहोशू ने
  alternative: उसने / उन्होंने
  rationale: एकवचन पुल्लिंग क्रिया यहोशू की ओर सबसे स्वाभाविक संकेत करती है, यद्यपि कार्य सार्वजनिक नेतृत्व की उपस्थिति में हुआ। कर्ता को स्पष्ट करना अर्थगत निष्कर्ष है, कोई अतिरिक्त धर्मसिद्धान्त नहीं।
- issue: अंतिम पितृवंशीय संबंध
  choice: उनके पिता के भाइयों के बीच
  alternative: उनके चाचाओं के बीच / उनके पितृकुल में
  rationale: शाब्दिक संबंध को सुरक्षित रखा गया है; इससे व्यापक कुलगत भूमि-विभाजन का आशय भी खुला रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। स्त्रीलिंग बहुवचन ‘बोलीं’ से वक्ताओं की पहचान स्पष्ट होती है। नामों के रूप ‘एलीआज़र’, ‘यहोशू’ और ‘याहवे’ स्रोत-भाषा के निकट रखे गए हैं।
