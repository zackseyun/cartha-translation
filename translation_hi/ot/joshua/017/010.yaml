  yaml_path: translation/ot/joshua/017/010.yaml
  text: Southward it belonged to Ephraim[a], and northward to Manasseh, and the sea was its border; on the north they reached Asher, and on the east Issachar.
translation:
  language: hi
  text: दक्षिण की ओर का भाग एप्रैम का था, और उत्तर की ओर का भाग मनश्शे का था। समुद्र उसकी सीमा था। उत्तर में वे आशेर से और पूर्व में इस्साकार से मिलते थे[क]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “उत्तर में आशेर से और पूर्व में इस्साकार से उनकी सीमा लगती थी।” इब्रानी क्रिया का अर्थ भू-सीमाओं के वर्णन में ‘मिलना,’ ‘छूना,’ या ‘सीमा साझा करना’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגְבָּה לְאֶפְרַיִם
  choice: दक्षिण की ओर का भाग एप्रैम का था
  rationale: दिशासूचक रूप נֶגְבָּה और स्वामित्व/आवंटन सूचक לְ को स्वाभाविक हिन्दी में व्यक्त करता है; इब्रानी की संक्षिप्तता को समझने योग्य बनाने के लिए ‘भाग’ और ‘था’ जोड़े गए हैं।
- source_word: וְצָפוֹנָה לִמְנַשֶּׁה
  choice: और उत्तर की ओर का मनश्शे का
  rationale: पहले खंड के समानांतर विन्यास को बनाए रखते हुए दूसरे खंड में ‘भाग था’ को अध्याहृत रखा गया है।
- source_word: וַיְהִי הַיָּם גְּבוּלוֹ
  choice: समुद्र उसकी सीमा था
  rationale: सीमा-वर्णन में גְּבוּל का सीधा और स्वाभाविक हिन्दी अर्थ ‘सीमा’ है; प्रत्यय को भूभाग के लिए ‘उसकी’ से व्यक्त किया गया है।
- source_word: יִפְגְּעוּן
  choice: उनकी सीमा ... से मिलती थी
  rationale: भौगोलिक सीमा-वर्णन में פגע का अर्थ किसी क्षेत्र से मिलना, छूना या सटना है। ‘सीमा ... से मिलती थी’ आधुनिक हिन्दी में स्पष्ट है और किसी एक अधिक विशिष्ट भौगोलिक संबंध को अनावश्यक रूप से नहीं थोपता।
- source_word: מִצָּפוֹן ... מִמִּזְרָח
  choice: उत्तर में ... और पूर्व में
  rationale: इन सीमा-सूत्रों में מִן दिशागत संलग्नता का पक्ष बताता है; हिन्दी में ‘उत्तर में’ और ‘पूर्व में’ सर्वाधिक स्वाभाविक हैं।
