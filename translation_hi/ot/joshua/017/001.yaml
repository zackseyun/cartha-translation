  text: וַ/יְהִ֤י הַ/גּוֹרָל֙ לְ/מַטֵּ֣ה מְנַשֶּׁ֔ה כִּי ה֖וּא בְּכ֣וֹר יוֹסֵ֑ף לְ/מָכִיר֩ בְּכ֨וֹר מְנַשֶּׁ֜ה אֲבִ֣י הַ/גִּלְעָ֗ד כִּ֣י ה֤וּא הָיָה֙ אִ֣ישׁ מִלְחָמָ֔ה וַֽ/יְהִי ל֖/וֹ הַ/גִּלְעָ֥ד וְ/הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/001.yaml
  text: 'The lot fell to the tribe of Manasseh[a], for he was the firstborn of Joseph: to Machir the firstborn of Manasseh, the father of Gilead, because he was a man of war, there belonged Gilead and Bashan.'
translation:
  language: hi
  text: मनश्शे के गोत्र के नाम चिट्ठी निकली, क्योंकि मनश्शे यूसुफ का पहलौठा था। मनश्शे के पहलौठे माकीर को—जो गिलाद का पिता[a] था—गिलाद और बाशान मिले, क्योंकि वह योद्धा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गिलाद का पूर्वज/संस्थापक।” इब्रानी में “पिता” शब्द किसी वंश के पूर्वज या किसी समूह अथवा स्थान के संस्थापक के लिए भी प्रयुक्त हो सकता है; इसका अर्थ केवल सगा पिता होना आवश्यक नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: चिट्ठी निकली
  rationale: भूमि-विभाजन के लिए चिट्ठी डालने के परिणाम को व्यक्त करने वाला स्वाभाविक हिन्दी मुहावरा; यह केवल ‘चिट्ठी थी’ की अपेक्षा प्रसंग का प्रक्रियात्मक अर्थ अधिक स्पष्ट करता है।
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: मनश्शे के गोत्र के नाम
  rationale: מַטֶּה यहाँ शाब्दिक ‘लाठी’ नहीं, जनजातीय इकाई अर्थात गोत्र को दर्शाता है; ‘के नाम’ चिट्ठी द्वारा मिले हिस्से का स्वाभाविक सम्बन्ध व्यक्त करता है।
- source_word: כִּי הוּא בְּכוֹר יוֹסֵף
  choice: क्योंकि मनश्शे यूसुफ का पहलौठा था
  rationale: हिब्रू सर्वनाम का संकेत मनश्शे की ओर है। हिन्दी में अस्पष्टता से बचने के लिए नाम दोहराया गया है; ‘पहलौठा’ जन्मक्रम और उत्तराधिकार, दोनों की ध्वनि बनाए रखता है।
- source_word: לְמָכִיר בְּכוֹר מְנַשֶּׁה
  choice: मनश्शे के पहलौठे माकीर को
  rationale: לְ का वितरणात्मक भाव ‘को’ से और वंशावली सम्बन्ध ‘मनश्शे के पहलौठे’ से सीधे व्यक्त होता है।
- source_word: אֲבִי הַגִּלְעָד
  choice: गिलाद का पिता
  rationale: मुख्य पाठ में हिब्रू का पारिवारिक रूपक सुरक्षित रखा गया है; אָב के ‘पूर्वज’ या ‘संस्थापक’ अर्थ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: אִישׁ מִלְחָמָה
  choice: योद्धा
  rationale: यह वर्तमान और सहज हिन्दी में युद्ध-कुशल व्यक्ति का संक्षिप्त, गरिमापूर्ण अर्थ देता है।
- source_word: וַיְהִי לוֹ הַגִּלְעָד וְהַבָּשָׁן
  choice: गिलाद और बाशान मिले
  rationale: उत्तराधिकार में भूभाग प्राप्त होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे सामान्य निजी स्वामित्व तक सीमित किए।
theological_decisions:
- issue: ‘क्योंकि वह योद्धा था’ में सर्वनाम का संकेत
  choice: मुख्य पाठ में हिब्रू का ‘वह’ बनाए रखा गया, जिसका निकटतम पूर्वपद माकीर है।
  alternative: स्पष्ट रूप से ‘क्योंकि माकीर योद्धा था’ कहना।
  rationale: मूल के सर्वनामात्मक रूप को सुरक्षित रखते हुए हिन्दी वाक्य-विन्यास माकीर को स्वाभाविक संकेत बनाता है; अनावश्यक व्याख्यात्मक विस्तार नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण गद्य। पारंपरिक बाइबलीय ‘पहलौठा’ और भूमि-विभाजन का परिचित मुहावरा ‘चिट्ठी निकली’ रखा गया है। पादटिप्पणी-चिह्न उसी पदबंध के बाद रखा गया है जिसे वह स्पष्ट करता है।
