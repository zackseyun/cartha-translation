source:
  edition: WLC
  text: כִּ֚י בְּנ֣וֹת מְנַשֶּׁ֔ה נָחֲל֥וּ נַחֲלָ֖ה בְּ/ת֣וֹךְ בָּנָ֑י/ו וְ/אֶ֨רֶץ֙ הַ/גִּלְעָ֔ד הָיְתָ֥ה לִ/בְנֵֽי מְנַשֶּׁ֖ה הַ/נּֽוֹתָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/006.yaml
  text: For the daughters of Manasseh received an inheritance among his sons[c][b][a], and the land of Gilead belonged to the rest of the sons of Manasseh.
translation:
  language: hi
  text: क्योंकि मनश्शे की बेटियों को उसके बेटों के बीच विरासत मिली[a], और गिलाद का प्रदेश मनश्शे के शेष बेटों का था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनश्शे की बेटियों ने उसके बेटों के बीच विरासत पाई।”
    reason: lexical_alternative
  - marker: b
    text: या, “गिलाद का प्रदेश मनश्शे के बाकी बेटों के लिए था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में वर्णित भू-भाग के बँटवारे का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּנוֹת מְנַשֶּׁה
  choice: मनश्शे की बेटियाँ
  rationale: सम्बन्धवाचक रचना का सीधा अनुवाद है। ‘बेटियाँ’ को स्पष्ट रखा गया है, क्योंकि आगे ‘बेटों’ से उनका जानबूझकर विरोध किया गया है।
- source_word: נָחֲלוּ נַחֲלָה
  choice: विरासत मिली
  rationale: इब्रानी की सजातीय क्रिया-संज्ञा रचना पैतृक भू-भाग पाने का भाव देती है। ‘विरासत मिली’ आधुनिक हिन्दी में स्वाभाविक और कानूनी-वितरण के संदर्भ में स्पष्ट है।
- source_word: בְּתוֹךְ בָּנָיו
  choice: उसके बेटों के बीच
  rationale: בְּתוֹךְ का अर्थ ‘बीच/मध्य में’ और בָּנָיו का विशिष्ट अर्थ ‘उसके बेटे’ है। सर्वनाम मनश्शे की ओर संकेत करता है; लिंगगत विरोध को सुरक्षित रखा गया है।
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: और गिलाद का प्रदेश
  rationale: यहाँ אֶרֶץ विरासत में मिले भौगोलिक भू-भाग को दर्शाता है; ‘प्रदेश’ हिन्दी में इस क्षेत्रीय अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָיְתָה לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: मनश्शे के शेष बेटों का हुआ
  rationale: शाब्दिक ‘के लिए था’ स्वामित्व अथवा आवंटन बताता है। ‘का हुआ’ उस परिणाम को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘शेष’ הַנּוֹתָרִים को सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। बेटियों और बेटों के स्पष्ट विरोध को बनाए रखा गया है, और विरासत को भूमि-वितरण के संदर्भ में समझने योग्य रखा गया है।
