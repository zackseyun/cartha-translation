base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/015.yaml
  text: Joshua said to them[a], “If you are a numerous people, go up to the forest and clear land for yourselves there in the land of the Perizzites and the Rephaim[b], since the hill country of Ephraim is too narrow for you.”
translation:
  language: hi
  text: यहोशू ने उनसे कहा, “यदि तुम बहुत लोग हो, तो वन में चढ़ जाओ और वहाँ परिज्जियों तथा रपाईम के देश में अपने लिए भूमि साफ़ कर लो[a], क्योंकि एप्रैम का पहाड़ी प्रदेश[b] तुम्हारे लिए तंग पड़ता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वन में चढ़ जाओ और वहाँ अपने लिए उसे साफ़ कर लो।” इब्रानी क्रिया वनाच्छादित भूमि को काटकर साफ़ करने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: इसे “एप्रैम का पर्वत” भी कहा जा सकता है; यहाँ आशय एप्रैम को दिए गए ऊँचे पहाड़ी भूभाग से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם רַב
  choice: इतनी बड़ी जाति
  rationale: यह पदबंध यहाँ जनसंख्या की अधिकता बताता है। ‘इतनी बड़ी जाति’ यूसुफ के वंशजों के अपने बहुसंख्यक होने के दावे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲלֵה לְךָ הַיַּעְרָה
  choice: वन-प्रदेश में चढ़ जाओ
  rationale: עלה ऊँचे भूभाग की ओर जाने को और היערה वनाच्छादित क्षेत्र में प्रवेश को दर्शाता है; ‘चढ़ जाओ’ स्थलाकृतिक भाव बनाए रखता है।
- source_word: וּבֵרֵאתָ לְךָ שָׁם
  choice: अपने लिए वहाँ वन काटकर भूमि साफ़ कर लो
  rationale: पिएल रूप में ברא का अर्थ वन काटकर जगह साफ़ करना है। हिन्दी में निहित कर्म को ‘भूमि’ से स्पष्ट किया गया है और לְךָ का हितार्थक भाव ‘अपने लिए’ में सुरक्षित है।
- source_word: בְּאֶרֶץ הַפְּרִזִּי וְהָרְפָאִים
  choice: परिज्जियों तथा रपाइयों के देश में
  rationale: दोनों जनसमूहों के नाम लिप्यंतरित किए गए हैं; विशेषकर ‘रपाइयों’ का कोई व्याख्यात्मक अर्थ थोपने के बजाय उसका जातीय अथवा भौगोलिक संकेत खुला रखा गया है।
- source_word: כִּי אָץ לְךָ
  choice: क्योंकि ... तुम्हारे लिए बहुत तंग है
  rationale: אָץ संकुचित या अपर्याप्त स्थान का भाव देता है। ‘बहुत तंग’ बड़ी जनसंख्या के लिए उपलब्ध भूभाग की कमी को सहज हिन्दी में बताता है।
- source_word: הַר אֶפְרָיִם
  choice: एप्रैम का पहाड़ी प्रदेश
  rationale: यहोशू में क्षेत्रीय प्रसंग में הַר प्रायः किसी एक पर्वत के बजाय ऊँचे पहाड़ी भूभाग को सूचित करता है।
