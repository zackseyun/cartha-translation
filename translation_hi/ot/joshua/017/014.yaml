base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/014.yaml
  text: Then the sons of Joseph spoke to Joshua[a], saying, “Why have you given me one lot and one portion as an inheritance, though I am a numerous people, since Yahweh has blessed me until now?”
translation:
  language: hi
  text: तब यूसुफ के वंशजों ने यहोशू से कहा, “आपने मुझे विरासत के रूप में चिट्ठी से मिला एक ही भाग और एक ही भूमि-भाग[a] क्यों दिया है? मैं तो एक बहुत बड़ी जाति हूँ, क्योंकि यहोवा ने मुझे अब तक आशीष दी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक ही नापा हुआ क्षेत्र।” हिब्रू शब्द का अर्थ मापकर निर्धारित किया गया भूमि-क्षेत्र भी हो सकता है।
    reason: חֶבֶל के ‘नापा हुआ/निर्धारित भूमि-क्षेत्र’ अर्थ को मुख्य पाठ के ‘भूमि-भाग’ के वैकल्पिक रूप में सुरक्षित रखना।
lexical_decisions:
- source_word: וַיְדַבְּרוּ בְּנֵי יוֹסֵף אֶת־יְהוֹשֻׁעַ לֵאמֹר
  choice: तब यूसुफ के वंशजों ने यहोशू से कहा
  rationale: ‘वंशज’ यहाँ मनश्शे और एप्रैम के गोत्रों के सामूहिक संकेत को सामान्य आधुनिक हिन्दी में स्पष्ट करता है; कथन-परिचय को स्वाभाविक हिन्दी में संक्षिप्त किया गया है।
- source_word: נָתַתָּה לִּי נַחֲלָה
  choice: आपने मुझे विरासत में ... दिया है
  rationale: एकवचन ‘मुझे’ को रखा गया है, क्योंकि यूसुफ के वंशज सामूहिक इकाई के रूप में एकवचन में बोलते हैं। נַחֲלָה का भूमि-विरासत संबंधी अर्थ ‘विरासत में’ से व्यक्त होता है।
- source_word: גּוֹרָל אֶחָד
  choice: एक ही चिट्ठी
  rationale: गोराल उस चिट्ठी अथवा चिट्ठी द्वारा ठहराए गए हिस्से को दर्शाता है। ‘एक ही’ शिकायत में निहित सीमितता पर बल देता है।
- source_word: וְחֶבֶל אֶחָד
  choice: और एक ही भू-भाग
  rationale: חֶבֶל यहाँ नापकर बाँटे गए भूमि-क्षेत्र को सूचित कर सकता है। ‘भू-भाग’ आधुनिक हिन्दी में स्वाभाविक है और पिछले ‘चिट्ठी’ से शब्दगत भिन्नता बनाए रखता है।
- source_word: וַאֲנִי עַם רָב
  choice: मैं तो एक बहुसंख्यक जाति हूँ
  rationale: सामूहिक वक्ता का एकवचन ‘मैं’ सुरक्षित रखा गया है और עַם רָב को प्रतिष्ठा के बजाय जनसंख्या की अधिकता के अर्थ में व्यक्त किया गया है।
- source_word: עַד אֲשֶׁר עַד־כֹּה בֵּרְכַנִי יְהוָה
  choice: क्योंकि यहोवा ने मुझे अब तक आशीष दी है
  rationale: संक्षिप्त हिब्रू पदबंध का समय-सूचक भाव ‘अब तक’ से और शिकायत का कारण ‘क्योंकि’ से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ व्यक्तिगत दिव्य नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है।
theological_decisions:
- issue: यूसुफ के वंशजों का सामूहिक एकवचन
  choice: ‘मुझे’ और ‘मैं’ को एकवचन में रखा गया
  alternative: ‘हमें’ और ‘हम’
  rationale: मूल पाठ में समूह अपने को एक सामूहिक व्यक्ति के रूप में एकवचन से संबोधित करता है; इसे बहुवचन बनाना उस साहित्यिक तनाव को मिटा देता।
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है, इसलिए उसे केवल उपाधि ‘प्रभु’ से नहीं बदला गया।
- issue: עַד אֲשֶׁר עַד־כֹּה का संबंध
  choice: ‘क्योंकि ... अब तक’
  alternative: ‘जबकि ... इतनी अधिक आशीष दी है’
  rationale: पदबंध कारण और वर्तमान समय तक आशीष के विस्तार दोनों का संकेत देता है। ‘अब तक’ עַד־כֹּה के स्पष्ट कालगत भाव को बनाए रखता है, यद्यपि परिमाणगत अर्थ भी संभव है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और कथात्मक रखी गई है। यहोशू के लिए आदरसूचक ‘आप’ प्रयोग हुआ है। ‘बहुसंख्यक जाति’ सामूहिक एकवचन को बचाते हुए जनसंख्या की अधिकता स्पष्ट करता है।
