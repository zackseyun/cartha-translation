  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: हिस्से में ... आए
  rationale: नפל का शाब्दिक अर्थ ‘गिरना’ है, पर भूमि के बँटवारे के प्रसंग में यह चिट्ठी द्वारा किसी के हिस्से में आने का मुहावरा है। हिंदी का ‘हिस्से में आए’ अर्थ और मुहावरे दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חַבְלֵי
  choice: भू-भाग
  rationale: חבל नापी हुई भूमि, क्षेत्र या आवंटित भाग को दर्शा सकता है। यहाँ ‘भू-भाग’ भूमि-विभाजन के संदर्भ को स्पष्ट रखता है।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: व्यक्ति और गोत्र के नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: עֲשָׂרָה
  choice: दस
  rationale: भू-भागों की संख्या का सीधा अनुवाद।
- source_word: לְבַד מֵאֶרֶץ
  choice: देश के अतिरिक्त
  rationale: यह वाक्यांश यरदन-पार पहले से प्राप्त क्षेत्र को इन दस भू-भागों से अलग रखता है; ‘के अतिरिक्त’ इस संबंध को स्पष्ट और संक्षिप्त बनाता है।
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: गिलाद और बाशान
  rationale: इन स्थान-नामों के प्रचलित हिंदी लिप्यंतरण।
- source_word: אֲשֶׁר מֵעֵבֶר לַיַּרְדֵּן
  choice: जो यरदन के पार हैं
  rationale: संबंधवाचक उपवाक्य दोनों क्षेत्रों की भौगोलिक स्थिति बताता है। बहुवचन ‘हैं’ हिंदी में गिलाद और बाशान दोनों से स्वाभाविक रूप से मेल खाता है।
