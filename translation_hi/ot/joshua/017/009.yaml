base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/009.yaml
  text: Then the border went down to the Brook of Kanah[a], south of the brook. These cities belonged to Ephraim among the cities of Manasseh, and the border of Manasseh was on the north side of the brook[c][b], and its end was at the sea.
translation:
  language: hi
  text: फिर सीमा काना नाले[a] तक उतर गई। नाले के दक्षिण में स्थित ये नगर मनश्शे के नगरों के बीच एप्रैम के थे[b]। मनश्शे की सीमा नाले के उत्तर में थी और उसका अंतिम छोर समुद्र[c] पर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “काना की वादी।” इब्रानी शब्द נחל जलधारा, बरसाती नाला, या घाटीनुमा जलमार्ग को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात एप्रैम के कुछ नगर मनश्शे को दिए गए क्षेत्र के भीतर स्थित थे।
    reason: cultural_note
  - marker: c
    text: यहाँ “समुद्र” से भूमध्य सागर का आशय है।
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: फिर सीमा ... उतर गई
  rationale: सीमावर्णन में ירד ऊँचाई या दिशा में नीचे जाने को दर्शाता है। ‘उतर गई’ इस भौगोलिक गति को स्वाभाविक हिन्दी में रखता है, और ‘फिर’ क्रमसूचक वाव का भाव देता है।
- source_word: נַחַל קָנָה
  choice: काना नाला
  rationale: נחל जलधारा, बरसाती नाला, या उसकी घाटी को सूचित कर सकता है। ‘नाला’ आधुनिक हिन्दी में संक्षिप्त भौगोलिक पद है; इसकी व्यापक अर्थ-सीमा पादटिप्पणी में स्पष्ट की गई है।
- source_word: נֶגְבָּה לַנַּחַל
  choice: नाले के दक्षिण में थी
  rationale: वाक्यांश सीमा की धारा के सापेक्ष दक्षिणी स्थिति बताता है। यह अनुवाद उसे नाले की ओर गति मानने के बजाय स्थान-संबंध के रूप में रखता है।
- source_word: עָרִים הָאֵלֶּה לְאֶפְרַיִם
  choice: ये नगर एप्रैम के थे
  rationale: क्रियारहित इब्रानी उपवाक्य अधिकार अथवा आवंटन बताता है। हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: בְּתוֹךְ עָרֵי מְנַשֶּׁה
  choice: मनश्शे के नगरों के बीच
  rationale: בְּתוֹךְ यहाँ मनश्शे के क्षेत्र में एप्रैम के नगरों के अंतःस्थित होने का भाव देता है; ‘के बीच’ इस संरचना को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: וּגְבוּל מְנַשֶּׁה מִצְּפוֹן לַנַּחַל
  choice: मनश्शे की सीमा नाले के उत्तर में थी
  rationale: מִצְּפוֹן नाले के उत्तरी ओर सीमा की स्थिति बताता है। हिन्दी वाक्य मूल भौगोलिक संबंध को सीधे व्यक्त करता है।
- source_word: וַיְהִי תֹצְאֹתָיו הַיָּמָּה
  choice: उसका अंतिम छोर समुद्र पर था
  rationale: सीमावर्णन में תֹצְאוֹת सीमा के समाप्ति-बिंदु को दर्शाता है। ‘अंतिम छोर’ सहज हिन्दी है; הַיָּמָּה का समुद्र की ओर/समुद्र पर समाप्त होना यहाँ व्यक्त किया गया है।
