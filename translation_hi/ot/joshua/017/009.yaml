  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्थान और गोत्र के नाम प्रचलित हिन्दी बाइबलीय रूपों—काना, एप्रैम और मनश्शे—में दिए गए हैं। सीमावर्णन की पुनरावृत्ति को मूल के अनुरूप बनाए रखते हुए छोटे वाक्यों से भौगोलिक संबंध स्पष्ट किए गए हैं।
