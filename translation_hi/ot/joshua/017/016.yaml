base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/016.yaml
  text: And the sons of Joseph said[a], “The hill country is not enough for us, and all the Canaanites who live in the valley land have iron chariots[c][b], both those in Beth-shean and its daughter towns and those in the Valley of Jezreel.”
translation:
  language: hi
  text: तब यूसुफ के वंशजों ने कहा, “पहाड़ी प्रदेश हमारे लिए पर्याप्त नहीं है,[a] और घाटी के भूभाग में रहने वाले सभी कनानियों के पास लोहे के रथ[b] हैं—चाहे वे बेत-शान और उसके अधीन नगरों में रहते हों या यिज्रेल की घाटी में।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “पहाड़ी प्रदेश हमारे लिए नहीं पाया जाता”; प्रसंग में भाव है कि वह उनके लिए पर्याप्त नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “लोहे से सुसज्जित रथ।” हिब्रू में शाब्दिक रूप से “लोहे के रथ” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יוֹסֵף
  choice: यूसुफ के वंशज
  rationale: शाब्दिक अर्थ ‘यूसुफ के पुत्र’ है, पर यहाँ मनश्शे और एप्रैम से निकले गोत्रीय समुदाय अभिप्रेत हैं; ‘वंशज’ आधुनिक हिन्दी में सामूहिक अर्थ स्पष्ट करता है।
- source_word: לֹא יִמָּצֵא לָנוּ הָהָר
  choice: पहाड़ी प्रदेश हमारे लिए पर्याप्त नहीं है
  rationale: शाब्दिक रूप ‘पहाड़ी प्रदेश हमारे लिए नहीं पाया जाता’ है। प्रसंग में भूमि की अपर्याप्तता की शिकायत है, इसलिए यह स्वाभाविक और संदर्भानुकूल अर्थ है।
- source_word: רֶכֶב בַּרְזֶל
  choice: लोहे के रथ
  rationale: हिब्रू संबंध-वाक्यांश को निकटता से रखता है और सैन्य रथों की विशेषता बताता है; इससे यह अनावश्यक रूप से निश्चित नहीं किया जाता कि रथ पूर्णतः लोहे के थे या लोहे से सुदृढ़ किए गए थे।
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב
  choice: रहने वाले सभी कनानी
  rationale: हिब्रू में जातिवाचक एकवचन सामूहिक है; हिन्दी बहुवचन उसी सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶרֶץ הָעֵמֶק
  choice: घाटी का प्रदेश
  rationale: यह पहाड़ी प्रदेश के विपरीत निचले भूभाग को दर्शाता है; ‘घाटी का प्रदेश’ भौगोलिक विरोध को स्पष्ट रखता है।
- source_word: וּבְנוֹתֶיהָ
  choice: उसके अधीन नगर
  rationale: शाब्दिक ‘उसकी बेटियाँ’ मुख्य नगर से जुड़े आश्रित छोटे नगरों या बस्तियों के लिए हिब्रू मुहावरा है; मुख्य पाठ में अर्थ स्पष्ट किया गया है और रूपक को पादटिप्पणी में रखा गया है।
- source_word: עֵמֶק יִזְרְעֶאל
  choice: यिज्रेल की घाटी
  rationale: हिब्रू भौगोलिक नाम का सीधा और हिन्दी में स्वाभाविक रूप है।
