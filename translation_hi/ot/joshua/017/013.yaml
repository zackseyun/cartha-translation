id: JOS.17.13
reference: Joshua 17:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יְהִ֗י כִּ֤י חָֽזְקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתְּנ֥וּ אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖שׁ לֹ֥א הוֹרִישֽׁ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/013.yaml
  text: And it happened that when the sons of Israel became strong[a], they put the Canaanites to forced labor[c][b], but they did not completely drive them out.
translation:
  language: hi
  text: और ऐसा हुआ कि जब इस्राएल के पुत्र शक्तिशाली हो गए[a], तब उन्होंने कनानियों से बेगार कराई[b], पर उन्हें पूरी तरह निकाल नहीं दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात “इस्राएली।” इब्रानी में “इस्राएल के पुत्र।”
    reason: lexical_alternative
  - marker: b
    text: या “कनानियों को बेगार के अधीन कर दिया”; संभव अर्थ “उन पर कर लगाया।”
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी में क्रिया को दोहराकर बल दिया गया है: “उन्हें पूरी तरह निकाल नहीं दिया।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: और ऐसा हुआ कि जब
  rationale: यह इब्रानी कथात्मक सूत्र एक नई परिस्थिति का परिचय देता है। यह अनुवाद उसके कथात्मक प्रवाह को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: חָזְקוּ
  choice: शक्तिशाली हो गए
  rationale: यहाँ क्रिया का भाव शक्ति प्राप्त करने या सामर्थ्य में बढ़ने का है; ‘शक्तिशाली हो गए’ इस परिवर्तन को स्पष्ट करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह इब्रानी पारिवारिक पदबंध का औपचारिक रूप से निकट अनुवाद है और साथ ही राष्ट्र के पारंपरिक सामूहिक नाम का संकेत देता है।
- source_word: וַיִּתְּנוּ אֶת־הַכְּנַעֲנִי לָמַס
  choice: उन्होंने कनानियों से बेगार कराई
  rationale: מַס यहाँ अनिवार्य अथवा जबरन श्रम-सेवा को सूचित करता है। ‘बेगार कराई’ आधुनिक हिन्दी में इस बाध्यकारी व्यवस्था को संक्षेप और स्पष्ट रूप से व्यक्त करता है। इब्रानी का एकवचन ‘कनानी’ सामूहिक अर्थ में है, इसलिए हिन्दी में बहुवचन लिया गया है।
- source_word: וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: पर उन्हें पूरी तरह निकाल नहीं दिया
  rationale: एक ही धातु के क्रियार्थक रूप और सीमित क्रिया का संयोजन बलाघात देता है; ‘पूरी तरह’ उस तीव्रता को व्यक्त करता है। एकवचन प्रत्यय सामूहिक कनानी जनसमूह को दर्शाता है, इसलिए हिन्दी में ‘उन्हें’ स्वाभाविक है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: मूल का पारिवारिक पदबंध बनाए रखा गया है; पादटिप्पणी में उसका स्वाभाविक जातीय अर्थ दिया गया है, बिना मूल की व्याकरणिक विशेषता मिटाए।
- issue: מַס का अर्थ
  choice: बेगार
  alternative: कर अथवा अनिवार्य श्रम-सेवा
  rationale: इस प्रसंग में शेष कनानी लोगों को केवल करदाता बनाने से अधिक, बाध्य श्रम के अधीन करने का भाव संभावित है। ‘बेगार’ उस दमनकारी सामाजिक वास्तविकता को स्पष्ट रखता है।
- issue: הוֹרֵשׁ לֹא הוֹרִישׁוֹ में बलाघात
  choice: पूरी तरह निकाल नहीं दिया
  alternative: निश्चय ही नहीं निकाला / अधिकार से वंचित नहीं किया
  rationale: इब्रानी व्याकरणिक पुनरुक्ति क्रिया पर जोर देती है। ‘पूरी तरह’ उस जोर को विजय-वर्णन के प्रसंग में सहज हिन्दी में व्यक्त करता है, जबकि अपूर्ण निष्कासन का आशय बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘बेगार’ बाध्य श्रम को संक्षेप में व्यक्त करता है; संभावित ‘कर’ अर्थ पादटिप्पणी में सुरक्षित है। मूल इब्रानी के सामूहिक एकवचन को स्वाभाविक हिन्दी बहुवचन में प्रस्तुत किया गया है।
