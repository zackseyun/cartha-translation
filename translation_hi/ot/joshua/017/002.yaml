source:
  edition: WLC
  text: וַ֠/יְהִי לִ/בְנֵ֨י מְנַשֶּׁ֥ה הַ/נּוֹתָרִים֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/בְנֵ֨י אֲבִיעֶ֜זֶר וְ/לִ/בְנֵי חֵ֗לֶק וְ/לִ/בְנֵ֤י אַשְׂרִיאֵל֙ וְ/לִ/בְנֵי שֶׁ֔כֶם וְ/לִ/בְנֵי חֵ֖פֶר וְ/לִ/בְנֵ֣י שְׁמִידָ֑ע אֵ֠לֶּה בְּנֵ֨י מְנַשֶּׁ֧ה בֶּן יוֹסֵ֛ף הַ/זְּכָרִ֖ים לְ/מִשְׁפְּחֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/002.yaml
  text: 'And it was for the remaining sons of Manasseh according to their clans: for the sons of Abiezer[a], and for the sons of Helek, and for the sons of Asriel, and for the sons of Shechem, and for the sons of Hepher, and for the sons of Shemida. These were the male sons of Manasseh son of Joseph[c][b], according to their clans.'
translation:
  language: hi
  text: 'और मनश्शे के शेष वंशजों को उनके कुलों के अनुसार भाग मिला: अबीएजेर के वंशजों को, हेलेक के वंशजों को, अस्रीएल के वंशजों को, शेकेम के वंशजों को, हेपेर के वंशजों को और शमीदा के वंशजों को। ये यूसुफ के पुत्र मनश्शे के पुरुष वंशज थे[a], अपने-अपने कुलों के अनुसार।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ‘पुरुष’ पर स्पष्ट बल है; आसपास के प्रसंग में सलोफहाद की बेटियों का भी उल्लेख है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: और मनश्शे के शेष वंशजों को ... भाग मिला
  rationale: हिब्रू अस्तित्ववाचक वाक्यांश यहाँ भूमि-विभाजन के प्रसंग में आवंटन का परिचय देता है। हिंदी में केवल ‘और ऐसा हुआ’ अर्थ को अधूरा छोड़ता; ‘भाग मिला’ प्रसंगगत संबंध को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘शेष’ הַנּוֹתָרִים को बनाए रखता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार / अपने-अपने कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर की मान्य वंश-इकाई है; आधुनिक हिंदी में ‘कुल’ इस सामाजिक संरचना को ‘परिवार’ से अधिक ठीक व्यक्त करता है।
- source_word: לִבְנֵי אֲבִיעֶזֶר ...
  choice: अबीएजेर के वंशजों को ...
  rationale: सूची में בְּנֵי नामधारी पूर्वज से निकली वंश-शाखाओं को सूचित करता है। हिंदी ‘पुत्रों’ की अपेक्षा ‘वंशजों’ से आशय स्पष्ट होता है और प्रत्येक शाखा के प्रति לְ का आवंटन-संबंध बना रहता है।
- source_word: בְּנֵי מְנַשֶּׁה בֶּן יוֹסֵף הַזְּכָרִים
  choice: यूसुफ के पुत्र मनश्शे के पुरुष वंशज
  rationale: वंशावली-संबंध ‘यूसुफ के पुत्र मनश्शे’ के रूप में सुरक्षित है। ‘पुरुष वंशज’ הַזְּכָרִים के स्पष्ट लिंग-बल को रखता है और आसपास के प्रसंग में सलोफहाद की बेटियों से निहित अंतर को बिना विस्तार जोड़े दर्शाता है।
theological_decisions:
- issue: पुरुष वंश-शाखाओं और सलोफहाद की बेटियों के बीच प्रसंगगत अंतर
  choice: हिब्रू הַזְּכָרִים को स्पष्ट रूप से ‘पुरुष वंशज’ अनूदित किया गया।
  alternative: केवल ‘वंशज’ या ‘पुत्र’
  rationale: मूल पाठ का लिंग-संबंधी जोर हटाने से आसपास के उत्तराधिकार-विवरण का तनाव और संरचना धुंधली हो जाती। अनुवाद कोई अतिरिक्त धार्मिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। कानूनी-वंशावली सूची की पुनरावृत्ति को रखा गया है, पर शाब्दिक रूप से अस्वाभाविक ‘और ऐसा हुआ’ के स्थान पर भूमि-विभाजन के प्रसंग से स्पष्ट ‘भाग मिला’ प्रयोग किया गया है। व्यक्तिनामों का देवनागरी लिप्यंतरण हिब्रू उच्चारण के निकट रखा गया है।
