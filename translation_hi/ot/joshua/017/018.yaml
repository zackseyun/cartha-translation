  text: כִּ֣י הַ֤ר יִֽהְיֶה לָּ/ךְ֙ כִּֽי יַ֣עַר ה֔וּא וּ/בֵ֣רֵאת֔/וֹ וְ/הָיָ֥ה לְ/ךָ֖ תֹּֽצְאֹתָ֑י/ו כִּֽי תוֹרִ֣ישׁ אֶת הַֽ/כְּנַעֲנִ֗י כִּ֣י רֶ֤כֶב בַּרְזֶל֙ ל֔/וֹ כִּ֥י חָזָ֖ק הֽוּא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/018.yaml
  text: But the hill country will be yours[a]; for it is a forest, and you shall clear it, and its farthest borders shall be yours. For you shall dispossess the Canaanites[c][b], though they have iron chariots and though they are strong.
translation:
  language: hi
  text: पर पहाड़ी प्रदेश[a] तेरा होगा। क्योंकि वह वन है, तू उसे साफ करेगा, और उसकी दूर की सीमाएँ भी तेरी होंगी[b]। तू कनानियों[c] को बेदखल कर देगा, भले ही उनके पास लोहे के रथ हों और वे शक्तिशाली हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहाड़”; इब्रानी शब्द का अर्थ कोई पहाड़ अथवा पूरा पहाड़ी प्रदेश हो सकता है। यहाँ आशय संभवतः यूसुफ को दिए गए ऊँचे भूभाग से है।
    reason: lexical_alternative
  - marker: b
    text: या “उसके बाहरी भाग” या “उसके छोर”; इब्रानी अभिव्यक्ति उस वनाच्छादित पहाड़ी प्रदेश की सीमाओं या दूर के छोरों को दर्शाती है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “कनानी” और उसके बाद आने वाले सर्वनाम एकवचन में हैं, पर यहाँ वे पूरे कनानी समुदाय के लिए सामूहिक रूप से प्रयुक्त हुए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: पहाड़ी प्रदेश
  rationale: भूमि-विभाजन के इस संदर्भ में यह शब्द किसी एक पर्वत-शिखर के बजाय ऊँचे पहाड़ी भूभाग को दर्शाता है; “पहाड़” को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: יִהְיֶה לָּךְ
  choice: तेरा होगा
  rationale: היה + ל की इब्रानी रचना अधिकार या आवंटन व्यक्त करती है; “तेरा होगा” इसका स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: יַעַר
  choice: वन
  rationale: यह शब्द पेड़ों से ढके भूभाग को दर्शाता है; “वन” सीधा और गरिमापूर्ण आधुनिक हिन्दी विकल्प है।
- source_word: וּבֵרֵאתוֹ
  choice: तू उसे साफ करेगा
  rationale: पिएल रूप यहाँ वन को काटकर भूमि साफ करने की क्रिया बताता है; “साफ करेगा” केवल पेड़ काटने से अधिक व्यापक बसावट-संबंधी अर्थ देता है।
- source_word: תֹּצְאֹתָיו
  choice: उसके अंतिम छोर तक का क्षेत्र
  rationale: यह बहुवचन संज्ञा बाहरी सीमाओं, छोरों या दूर तक फैले भागों को सूचित करती है। चुना हुआ रूप पूरे भूभाग के उसके छोर तक अधिकार में आने का भाव स्पष्ट करता है।
- source_word: תוֹרִישׁ
  choice: बेदखल कर देगा
  rationale: हिफ़ील रूप किसी को उसके अधिकार या भूमि से हटाने का अर्थ देता है; “बेदखल” में सैन्य निष्कासन और भूमि-अधिकार, दोनों का भाव सुरक्षित रहता है।
- source_word: הַכְּנַעֲנִי
  choice: कनानियों
  rationale: इब्रानी में रूप एकवचन है, किंतु जाति के लिए सामूहिक अर्थ में प्रयुक्त है; हिन्दी में बहुवचन संदर्भ को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רֶכֶב בַּרְזֶל
  choice: लोहे के रथ
  rationale: रचना लोहे से सुसज्जित रथों को दर्शाती है; “लोहे के रथ” सीधा और प्रचलित अनुवाद है।
- source_word: חָזָק הוּא
  choice: वे शक्तिशाली हों
  rationale: एकवचन इब्रानी विधान सामूहिक कनानी जनसमुदाय की ओर संकेत करता है; हिन्दी में बहुवचन उसी सामूहिक आशय को स्पष्ट करता है।
theological_decisions:
- issue: कनानी जाति के लिए इब्रानी सामूहिक एकवचन
  choice: “कनानियों … उनके … वे” के रूप में बहुवचन
  alternative: अधिक शब्दशः “कनानी … उसके … वह”
  rationale: यहाँ एकवचन जातिनाम पूरे जनसमुदाय के लिए सामूहिक है। हिन्दी बहुवचन संदर्भ को स्पष्ट करता है और मूल का सामूहिक आशय बनाए रखता है।
- issue: बार-बार आए כִּי का प्रसंगानुसार संबंध
  choice: आरंभ में विरोधसूचक “पर”, वन वाले वाक्य में कारणसूचक “क्योंकि”, और अंतिम दो प्रयोगों में रियायती “भले ही”
  alternative: हर स्थान पर एक ही शब्द, जैसे “क्योंकि”, दोहराना; अथवा वन के संदर्भ में “यद्यपि”
  rationale: כִּי के अलग-अलग प्रयोग प्रसंग में अलग वाक्य-संबंध निभाते हैं। चुने हुए हिन्दी संयोजक तर्क-प्रवाह को स्वाभाविक रखते हैं, जबकि वन वाले कथन की कारणसूचक संभावना को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। “तू/तेरा” एकवचन इब्रानी संबोधन और इस प्रसंग की पारंपरिक गंभीरता को बनाए रखता है। “बेदखल” भूमि-अधिकार और निष्कासन दोनों को व्यक्त करता है।
