  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֗וֹם גַּלּ֛וֹתִי אֶת חֶרְפַּ֥ת מִצְרַ֖יִם מֵ/עֲלֵי/כֶ֑ם וַ/יִּקְרָ֞א שֵׁ֣ם הַ/מָּק֤וֹם הַ/הוּא֙ גִּלְגָּ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/009.yaml
  text: And Yahweh said to Joshua[b][a], “Today I have rolled away the reproach of Egypt from upon you.” So the name of that place was called Gilgal to this day.
translation:
  language: hi
  text: तब यहोवा ने यहोशू से कहा, “आज मैंने मिस्र की निन्दा[a] तुम्हारे ऊपर से लुढ़का दी है।” इसलिए उस स्थान का नाम गिलगाल[b] पड़ा; वह आज तक इसी नाम से जाना जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मिस्र का अपमान” अथवा “मिस्र से जुड़ी लज्जा।” इसका संकेत मिस्र में इस्राएल के अतीत की लज्जा, मिस्रियों की निन्दा, या अब दूर हुए वाचा-संबंधी अपमान की ओर हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “गिलगाल” का उच्चारण उस इब्रानी क्रिया से मिलता-जुलता है जिसका अर्थ “लुढ़का देना” है; इस प्रकार यहाँ “मैंने ... लुढ़का दी है” के साथ शब्द-खेल है।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को प्रचलित और गरिमापूर्ण हिन्दी बाइबलीय रूप में रखा गया है।
- source_word: גַּלּוֹתִי
  choice: मैंने ... लुढ़का दी है
  rationale: क्रिया גלל के ‘लुढ़काने’ के मूल बिंब को बनाए रखता है और गिलगाल के साथ शब्द-खेल को सम्भव सीमा तक व्यक्त करता है।
- source_word: חֶרְפַּת מִצְרַיִם
  choice: मिस्र की बदनामी
  rationale: חֶרְפָּה में निन्दा, अपमान और लज्जा के अर्थ समाहित हैं। ‘मिस्र की बदनामी’ सम्बन्ध की अस्पष्टता को खुला रखता है—यह मिस्र से जुड़ी बदनामी या मिस्र द्वारा की गई निन्दा हो सकती है।
- source_word: מֵעֲלֵיכֶם
  choice: तुम्हारे ऊपर से
  rationale: मूल पूर्वसर्गीय बिंब को सुरक्षित रखता है, मानो बदनामी उन पर पड़ी हुई थी और अब हटा दी गई।
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא גִּלְגָּל
  choice: इसलिए उस स्थान का नाम गिलगाल पड़ा
  rationale: अव्यक्त कर्ता वाली इब्रानी नामकरण-विधि को स्वाभाविक हिन्दी में व्यक्त करता है और पिछले कथन से कारणात्मक सम्बन्ध दिखाता है।
- source_word: גִּלְגָּל
  choice: गिलगाल
  rationale: स्थान-नाम का मानक हिन्दी लिप्यन्तरण; मूल भाषा का शब्द-खेल टिप्पणी में स्पष्ट किया गया है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: और आज तक वही है
  rationale: वर्णनकर्ता के समय तक नाम के बने रहने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘मिस्र की बदनामी’ का आशय
  choice: मुख्य पाठ में व्यापक और अस्पष्ट अभिव्यक्ति बनाए रखी गई है।
  alternative: इसे मिस्र की दासता की लज्जा, मिस्रियों द्वारा की गई निन्दा, अथवा खतनारहित होने से जुड़ा वाचा-संबंधी अपमान मानना।
  rationale: इब्रानी पदबंध स्वयं किसी एक आशय को स्पष्ट रूप से निश्चित नहीं करता; इसलिए अनुवाद किसी एक ऐतिहासिक या धर्मवैज्ञानिक व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किन्तु गरिमापूर्ण कथात्मक शैली। ‘लुढ़का दी’ सामान्य हिन्दी में कुछ असामान्य लग सकती है, पर मूल बिंब और गिलगाल के शब्द-खेल को बचाने के लिए जानबूझकर रखी गई है। सभी टिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
