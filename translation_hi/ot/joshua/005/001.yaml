  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּל מַלְכֵ֣י הָ/אֱמֹרִ֡י אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן יָ֗מָּ/ה וְ/כָל מַלְכֵ֤י הַֽ/כְּנַעֲנִי֙ אֲשֶׁ֣ר עַל הַ/יָּ֔ם אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל עַד עבר/נו וַ/יִּמַּ֣ס לְבָבָ֗/ם וְ/לֹא הָ֨יָה בָ֥/ם עוֹד֙ ר֔וּחַ מִ/פְּנֵ֖י בְּנֵֽי יִשְׂרָאֵֽל־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/001.yaml
  text: And it happened[a], when all the kings of the Amorites who were beyond the Jordan to the west, and all the kings of the Canaanites who were by the sea, heard that Yahweh had dried up the waters of the Jordan before the sons of Israel until we had crossed over, their heart melted[c][b], and there was no longer spirit in them because of the sons of Israel.
translation:
  language: hi
  text: जब यरदन के पश्चिम की ओर रहनेवाले एमोरियों के सभी राजाओं और समुद्र के तट पर रहनेवाले कनानियों के सभी राजाओं ने सुना कि यहोवा ने इस्राएल के पुत्रों के सामने यरदन का जल तब तक सूखा रखा था, जब तक हम पार न हो गए,[a] तो उनका हृदय पिघल गया और इस्राएल के पुत्रों के कारण उनमें फिर कोई साहस न रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ इब्रानी पांडुलिपियों और प्राचीन अनुवादों में “जब तक वे पार न हो गए” है।
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: जब ... ने सुना
  rationale: हिब्रू कथा-सूत्र और कालवाचक रचना को स्वाभाविक हिन्दी में एक ही ‘जब’ उपवाक्य से व्यक्त किया गया; अलग से ‘और ऐसा हुआ’ जोड़ना हिन्दी में बोझिल होता।
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: यरदन के पश्चिम की ओर रहनेवाले
  rationale: יָמָּה पश्चिम/समुद्र की दिशा बताता है; प्रसंग में यरदन के पश्चिमी पार का क्षेत्र अभिप्रेत है।
- source_word: אֲשֶׁר עַל הַיָּם
  choice: समुद्र के तट पर रहनेवाले
  rationale: शाब्दिक ‘समुद्र के पास’ की अपेक्षा तटीय क्षेत्र का अर्थ वर्तमान हिन्दी में स्पष्ट करता है।
- source_word: הוֹבִישׁ ... מֵי הַיַּרְדֵּן
  choice: यरदन का जल ... सुखाए रखा
  rationale: हिफ़ील क्रिया जल को सुखा देने का कारणात्मक अर्थ देती है; ‘तब तक’ के साथ ‘सुखाए रखा’ परिणामी अवस्था को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: मूल के पारिवारिक-राष्ट्रीय, व्याकरणतः पुल्लिंग पदबंध को बनाए रखता है।
- source_word: עַד עברנו
  choice: जब तक हम पार न हो गए
  rationale: डब्ल्यूएलसी के लिखित रूप में प्रथम पुरुष बहुवचन को मुख्य पाठ में रखा गया; तृतीय पुरुष पाठांतर पादटिप्पणी में दिया गया है।
- source_word: וַיִּמַּס לְבָבָם
  choice: उनका हृदय पिघल गया
  rationale: मूल के सामूहिक एकवचन ‘हृदय’ और भय से साहस टूटने की रूपकात्मक छवि दोनों सुरक्षित हैं।
- source_word: וְלֹא הָיָה בָם עוֹד רוּחַ
  choice: उनमें फिर साहस न रहा
  rationale: रूअख़ का यहाँ प्रसंगगत अर्थ मनोबल या साहस है; हिन्दी में शाब्दिक ‘आत्मा न रही’ मृत्यु का भ्रामक संकेत दे सकता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत नाम है। हिन्दी पाठकों के लिए प्रतिष्ठित लिप्यंतरण ‘यहोवा’ नाम को बनाए रखता है, जबकि ‘प्रभु’ उसे उपाधि से बदल देता।
- issue: בְנֵי יִשְׂרָאֵל का राष्ट्रीय-पारिवारिक रूप
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल की सन्तान
  rationale: मूल के पुल्लिंग पारिवारिक पदबंध को अनावश्यक रूप से सामान्यीकृत नहीं किया गया।
- issue: עברנו में क्रिया-पुरुष का पाठांतर
  choice: हम पार न हो गए
  alternative: वे पार न हो गए
  rationale: मसोराई लिखित पाठ का प्रथम पुरुष बहुवचन मुख्य पाठ में रखा गया है; तीसरे पुरुष का सुसंगत पाठ प्राचीन साक्ष्य में होने के कारण पादटिप्पणी में सुरक्षित है।
- issue: רוּחַ का प्रसंगगत अर्थ
  choice: साहस
  alternative: आत्मा; प्राण; मनोबल
  rationale: यहाँ राजाओं की भयजनित हिम्मत टूटना अभिप्रेत है; ‘साहस’ उस मुहावरे को स्पष्ट करता है, बिना किसी मनुष्य-विज्ञान संबंधी सिद्धान्त को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज कथा-शैली। भौगोलिक पदों को स्पष्ट रखा गया है, सामूहिक एकवचन ‘हृदय’ सुरक्षित है, और केवल वास्तविक पाठांतर पर पादटिप्पणी दी गई है।
