base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/013.yaml
  text: And it happened[a], when Joshua was by Jericho, that he lifted up his eyes and looked, and behold, a man was standing opposite him with his sword drawn in his hand. Joshua went to him and said to him, “Are you for us, or for our enemies?”
translation:
  language: hi
  text: जब यहोशू यरीहो के पास था,[a] तब उसने आँखें उठाकर देखा कि एक पुरुष उसके सामने खड़ा था और उसके हाथ में नंगी तलवार थी। यहोशू उसके पास गया और उससे पूछा, “तुम हमारी ओर हो या हमारे शत्रुओं की ओर?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यरीहो में।” हिब्रू संबंधबोधक शब्द स्थान को व्यापक अर्थ में बता सकता है और यह अनिवार्य रूप से नगर के भीतर किसी सटीक स्थान को नहीं दर्शाता।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת
  choice: जब ... था, तब
  rationale: यह संयोजन नए दृश्य की समयगत परिस्थिति प्रस्तुत करता है। हिन्दी में ‘जब ... था, तब’ स्वाभाविक है और अलग से ‘ऐसा हुआ’ जोड़ने की आवश्यकता नहीं रखता।
- source_word: בִּירִיחוֹ
  choice: यरीहो के पास
  rationale: בְּ स्थान का व्यापक बोध करा सकता है। सैन्य प्रसंग में ‘के पास’ शहर के भीतर होने का अनावश्यक दावा किए बिना स्थान बताता है; ‘में’ भी व्याकरणतः संभव है।
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: उसने आँखें उठाकर देखा
  rationale: हिब्रू मुहावरे और अगले दृष्टि-क्रियापद, दोनों को सहज आधुनिक हिन्दी में एक प्रवाहपूर्ण अभिव्यक्ति में रखा गया है।
- source_word: וְהִנֵּה
  choice: कि
  rationale: यहाँ הִנֵּה दृश्य को अचानक और सजीव रूप से सामने लाता है। आधुनिक हिन्दी में ‘देखा कि’ उसी प्रस्तुति को स्वाभाविक ढंग से आगे बढ़ाता है; ‘देखो’ इस वाक्य में अधिक कृत्रिम होता।
- source_word: אִישׁ
  choice: एक पुरुष
  rationale: मूल पाठ इस व्यक्ति का परिचय केवल ‘पुरुष’ के रूप में देता है। ‘योद्धा’ या ‘स्वर्गदूत’ कहना इस पद से अधिक निश्चितता जोड़ देता।
- source_word: עֹמֵד לְנֶגְדּוֹ
  choice: उसके सामने खड़ा है
  rationale: לְנֶגְדּוֹ सामने अथवा आमने-सामने की स्थिति व्यक्त करता है। ‘उसके सामने’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: उसके हाथ में नंगी तलवार है
  rationale: שְׁלוּפָה म्यान से खींची हुई तलवार को दर्शाता है। हिन्दी का प्रचलित पद ‘नंगी तलवार’ इस युद्ध-सज्ज मुद्रा को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: וַיֵּלֶךְ ... אֵלָיו
  choice: उसके पास गया
  rationale: आंदोलन की साधारण क्रिया को बिना अतिरिक्त भाव जोड़े स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֲלָנוּ אַתָּה אִם לְצָרֵינוּ
  choice: तू हमारी ओर है या हमारे शत्रुओं की ओर?
  rationale: לְ यहाँ पक्ष अथवा निष्ठा बताता है। ‘हमारी ओर’ और ‘हमारे शत्रुओं की ओर’ सैन्य प्रसंग में इस विरोध को स्पष्ट रखते हैं।
theological_decisions:
- issue: यहोशू के सामने आए पुरुष की पहचान
  choice: मुख्य पाठ में केवल ‘एक पुरुष’
  alternative: स्वर्गदूत, यहोवा का दूत, ईश्वरीय प्रकटन, या मसीह का पूर्वदेहधारण प्रकटन
  rationale: इस पद में אִישׁ से केवल ‘पुरुष’ कहा गया है। आगे का प्रसंग उसकी पहचान की व्याख्या को प्रभावित कर सकता है, पर इस पद में किसी विशिष्ट धर्मवैज्ञानिक निष्कर्ष को जोड़ना मूल की जानबूझकर रखी गई अनिश्चितता मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथा-शैली गरिमापूर्ण किंतु सहज रखी गई है। संवाद में ‘तू’ मूल के एकवचन संबोधन और प्रत्यक्ष सैन्य मुठभेड़ को दर्शाता है। ‘पुरुष’ पहचान को तटस्थ रखता है।
