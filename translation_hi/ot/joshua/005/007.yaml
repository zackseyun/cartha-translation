source:
  edition: WLC
  text: וְ/אֶת בְּנֵי/הֶם֙ הֵקִ֣ים תַּחְתָּ֔/ם אֹתָ֖/ם מָ֣ל יְהוֹשֻׁ֑עַ כִּי עֲרֵלִ֣ים הָי֔וּ כִּ֛י לֹא מָ֥לוּ אוֹתָ֖/ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/007.yaml
  text: And Joshua circumcised their sons[a], whom he had raised up in their place, because they were uncircumcised, for they had not circumcised them on the way.
translation:
  language: hi
  text: और जिन पुत्रों को उसने उनके स्थान पर खड़ा किया था, उनका यहोशू ने खतना किया; क्योंकि वे खतनारहित थे, क्योंकि मार्ग में उनका खतना नहीं किया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת בְּנֵיהֶם
  choice: और उनके ... पुत्रों को
  rationale: וְ क्रमिक संबंध जोड़ता है और בְּנֵיהֶם इस खतने के प्रसंग में विशेष रूप से पुरुष संतानों को दर्शाता है।
- source_word: הֵקִים תַּחְתָּם
  choice: उनके स्थान पर ... खड़ा किया था
  rationale: हिफ़ील הֵקִים और תַּחְתָּם मिलकर पिछली पीढ़ी के स्थान पर अगली पीढ़ी को खड़ा किए जाने का भाव देते हैं। एकवचन क्रिया का कर्ता प्रसंगानुसार परमेश्वर माना जा सकता है, पर स्रोत उसे नाम से व्यक्त नहीं करता; इसलिए हिंदी में भी 'उसने' रखा गया है।
- source_word: אֹתָם מָל יְהוֹשֻׁעַ
  choice: उनका खतना यहोशू ने किया
  rationale: מוּל खतना करने का मानक क्रियापद है। मूल के बलाघात और स्पष्ट कर्ता को स्वाभाविक हिंदी में बनाए रखा गया है।
- source_word: עֲרֵלִים הָיוּ
  choice: वे खतनारहित थे
  rationale: यह शारीरिक और वाचा-संबंधी अवस्था बताता है; 'खतनारहित' आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: כִּי לֹא מָלוּ אֹתָם
  choice: क्योंकि ... उनका खतना नहीं किया गया था
  rationale: हिब्रू में बहुवचन कर्ता अनिर्दिष्ट है। हिंदी का कर्मवाच्य किसी विशिष्ट कर्ता को जोड़े बिना वही अनिश्चितता स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: בַּדָּרֶךְ
  choice: मार्ग में
  rationale: यह यात्रा के दौरान, विशेषतः जंगल की यात्रा में, होने का संक्षिप्त और स्रोत-संगत संकेत है।
theological_decisions:
- issue: खतने की शारीरिक और वाचा-संबंधी अवस्था
  choice: खतनारहित
  alternative: अखतना
  rationale: पद वास्तविक शारीरिक खतने की बात करता है। 'खतनारहित' अर्थ को स्पष्ट रखता है और किसी रूपकात्मक अर्थ को आरोपित नहीं करता।
- issue: הֵקִים का अनकहा कर्ता
  choice: उसने खड़ा किया था
  alternative: यहोवा ने खड़ा किया था
  rationale: संदर्भ में कर्ता परमेश्वर समझा जा सकता है, किन्तु इस पद के हिब्रू पाठ में उसका नाम नहीं है। सर्वनाम मूल की अंतर्निहित संदर्भ-निर्भरता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; वाक्य गरिमापूर्ण और स्रोत-सन्निकट रखा गया है। कारण बताने वाले दोनों כִּי को 'क्योंकि' से व्यक्त किया गया है, और अनिर्दिष्ट कर्ता को कर्मवाच्य द्वारा सुरक्षित रखा गया है।
