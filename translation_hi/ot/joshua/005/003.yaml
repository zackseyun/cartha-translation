- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह मूल इब्रानी के स्पष्ट पुल्लिंग बहुवचन रूप को बनाए रखता है; अधिक प्रवाहपूर्ण विकल्प 'इस्राएलियों' को पादटिप्पणी में दिया गया है।
