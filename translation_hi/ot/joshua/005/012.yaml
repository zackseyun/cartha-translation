base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/012.yaml
  text: And the manna ceased on the next day[a], after they had eaten from the produce of the land. There was no longer manna for the sons of Israel[b], and they ate from the yield of the land of Canaan that year.
translation:
  language: hi
  text: जिस दिन उन्होंने देश की उपज[a] में से खाई, उसके अगले दिन मन्ना समाप्त हो गया। इसके बाद इस्राएलियों[b] के लिए मन्ना नहीं रहा, और उस वर्ष उन्होंने कनान देश की पैदावार में से खाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देश की पुरानी उपज।” इब्रानी शब्द विशेष रूप से पिछली फसल से बचाकर रखी गई उपज को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी का अधिक शब्दशः अनुवाद “इस्राएल के पुत्रों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבֹּת
  choice: मिलना बंद हो गया
  rationale: यहाँ שׁבת का अर्थ सब्त मनाना नहीं, बल्कि किसी वस्तु की आपूर्ति या उपलब्धता का समाप्त होना है। हिंदी में यह प्रयोग प्रसंग को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: הַמָּן / מָן
  choice: मन्ना
  rationale: जंगल में इस्राएल को मिले भोजन के लिए प्रचलित और पहचाना हुआ बाइबलीय शब्द।
- source_word: מִמָּחֳרָת
  choice: अगले दिन
  rationale: यह कालसूचक पद पहले वर्णित घटना के बाद आने वाले दिन को दर्शाता है।
- source_word: בְּאָכְלָם
  choice: खाने के
  rationale: ב उपसर्गयुक्त क्रियार्थक संज्ञा को यहाँ कालसूचक संबंध में स्वाभाविक हिंदी से व्यक्त किया गया है; पूरे वाक्यांश में यह पहले खाने और अगले दिन मन्ना बंद होने का क्रम बताता है।
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: देश की उपज में से
  rationale: עֲבוּר भूमि से प्राप्त कृषि-उपज को सूचित करता है। शब्द में पिछली फसल से संचित अनाज का संभावित अर्थ भी हो सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: וְלֹא הָיָה עוֹד
  choice: इसके बाद ... नहीं रहा
  rationale: अस्तित्वसूचक इब्रानी वाक्यांश और עוֹד की 'अब और नहीं' वाली निरंतरता को सहज हिंदी में व्यक्त करता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के लिए
  rationale: यह सामूहिक जातिनाम आधुनिक हिंदी में स्वाभाविक है; मूल के अधिक शब्दशः रूप 'इस्राएल के पुत्रों' को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיֹּאכְלוּ
  choice: उन्होंने ... खाया
  rationale: साधारण इब्रानी कथात्मक क्रिया को हिंदी के सामान्य भूतकाल में प्रस्तुत किया गया है।
- source_word: מִתְּבוּאַת
  choice: पैदावार में से
  rationale: תְּבוּאָה कृषि-उत्पादन या उपज को दर्शाता है। 'पैदावार' पहले आए עֲבוּר से हल्का शब्दगत भेद भी बनाए रखता है।
- source_word: אֶרֶץ כְּנַעַן
  choice: कनान देश
  rationale: मूल के पूरे भौगोलिक पद को स्पष्ट और प्रचलित हिंदी रूप में रखा गया है।
- source_word: בַּשָּׁנָה הַהִיא
  choice: उस वर्ष
  rationale: कालसूचक पद का संक्षिप्त और स्वाभाविक हिंदी रूप।
