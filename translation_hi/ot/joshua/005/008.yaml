  text: And when all the nation had finished being circumcised[a], they remained in their places in the camp until they recovered.
translation:
  language: hi
  text: जब पूरे राष्ट्र के लोगों का खतना[a] हो चुका था, तब वे छावनी में अपने-अपने स्थानों पर तब तक रहे, जब तक वे स्वस्थ न हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब तक वे ठीक न हो गए” अथवा “जब तक उनमें फिर से जान न आ गई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: जब
  rationale: इब्रानी कथात्मक सूत्र यहाँ समय-सूचक उपवाक्य आरम्भ करता है; हिंदी में ‘जब’ क्रम को स्वाभाविक और स्पष्ट रखता है।
- source_word: תַּמּוּ
  choice: हो चुका
  rationale: क्रिया कार्य की पूर्णता बताती है; ‘हो चुका’ अगले मुख्य कथन से पहले खतना पूरा हो जाने को सहज हिंदी में व्यक्त करता है।
- source_word: כָל הַגּוֹי
  choice: पूरे राष्ट्र
  rationale: एकवचन सामूहिक संज्ञा यहाँ इस्राएल को एक राष्ट्र के रूप में दर्शाती है; ‘पूरे राष्ट्र’ उस सामूहिक बल को बनाए रखता है।
- source_word: לְהִמּוֹל
  choice: का खतना
  rationale: निफ़अल रूप खतना किए जाने का भाव देता है; ‘पूरे राष्ट्र का खतना हो चुका’ हिंदी में स्वाभाविक रूप से निष्पादित क्रिया को व्यक्त करता है।
- source_word: וַיֵּשְׁבוּ
  choice: वे ... रहे
  rationale: संदर्भ में अर्थ बैठने की मुद्रा नहीं, बल्कि स्वास्थ्य-लाभ तक उसी स्थान पर ठहरे रहने का है।
- source_word: תַחְתָּם
  choice: अपने-अपने स्थान पर
  rationale: यह मुहावरा ‘अपने स्थान पर/जहाँ वे थे’ का अर्थ देता है, न कि शाब्दिक रूप से ‘अपने नीचे’।
- source_word: בַּמַּחֲנֶה
  choice: छावनी में
  rationale: स्थानवाचक पदबंध का मानक और प्रसंगानुकूल हिंदी रूप।
- source_word: עַד חֲיוֹתָם
  choice: जब तक वे स्वस्थ न हो गए
  rationale: חיה यहाँ खतने के बाद स्वास्थ्य या शक्ति लौटने को सूचित करता है; ‘स्वस्थ न हो गए’ प्रसंग में स्वाभाविक है, जबकि मूल के ‘जी उठने/फिर सजीव होने’ के निकटतर विकल्प पादटिप्पणी में सुरक्षित हैं।
