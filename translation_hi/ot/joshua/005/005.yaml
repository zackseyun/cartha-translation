source:
  edition: WLC
  text: כִּֽי מֻלִ֣ים הָי֔וּ כָּל הָ/עָ֖ם הַ/יֹּֽצְאִ֑ים וְ/כָל הָ֠/עָם הַ/יִּלֹּדִ֨ים בַּ/מִּדְבָּ֥ר בַּ/דֶּ֛רֶךְ בְּ/צֵאתָ֥/ם מִ/מִּצְרַ֖יִם לֹא מָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/005.yaml
  text: For all the people who came out had been circumcised[a], but all the people born in the wilderness on the way as they came out from Egypt had not been circumcised.
translation:
  language: hi
  text: क्योंकि मिस्र से निकलने वाले सभी लोगों का खतना हो चुका था, लेकिन जंगल में, मिस्र से निकलने के बाद की यात्रा में जन्मे सभी लोगों का खतना नहीं हुआ था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में क्रिया सक्रिय है: “... जन्मे सभी लोगों का उन्होंने खतना नहीं किया था।” ‘मिस्र से निकलने के बाद की यात्रा में’ इब्रानी के “मिस्र से उनके निकलने पर” का प्रसंगानुकूल अर्थ है।'
    reason: लֹא מָלוּ के अनिर्दिष्ट सक्रिय कर्ता और בְּצֵאתָם מִמִּצְרַיִם के निकटतर, किंतु हिंदी में स्पष्ट समय-संबंध को दर्शाता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले पद में कही गई बात का कारण या स्पष्टीकरण देता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֻלִים הָיוּ
  choice: खतना हो चुका था
  rationale: היה के साथ निष्क्रिय कृदंत पहले से विद्यमान अवस्था बताता है; ‘हो चुका था’ उस पूर्व अवस्था को स्पष्ट करता है।
- source_word: כָּל הָעָם הַיֹּצְאִים
  choice: मिस्र से निकले सभी लोग
  rationale: עם सामूहिक रूप से लोगों को सूचित करता है और substantival participle הַיֹּצְאִים मिस्र से निकलने वाली पीढ़ी को। हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: וְכָל הָעָם הַיִּלֹּדִים
  choice: लेकिन ... जन्मे सभी लोग
  rationale: וְ यहाँ पहली और दूसरी पीढ़ी के बीच विरोध दर्शाता है, इसलिए ‘लेकिन’ प्रसंगगत संबंध को स्पष्ट करता है।
- source_word: בַּמִּדְבָּר
  choice: वीराने में
  rationale: מִדְבָּר निर्जन, अनावाद क्षेत्र को दर्शाता है; ‘वीराना’ आधुनिक हिन्दी में स्वाभाविक है और केवल रेतीले मरुस्थल का अनावश्यक संकेत नहीं देता।
- source_word: בַּדֶּרֶךְ
  choice: रास्ते में
  rationale: यह मिस्र से देश की ओर यात्रा के दौरान की स्थिति को बताता है; ‘रास्ते में’ मूल के निकट और सहज है।
- source_word: בְּצֵאתָם מִמִּצְרַיִם
  choice: मिस्र से निकलने के बाद
  rationale: मूल पदबंध निर्गमन से जुड़ी यात्रा का समय बताता है। प्रसंग के अनुसार ये जन्म निर्गमन के बाद वीराने की यात्रा में हुए; हिन्दी में यह अर्थ स्पष्ट और स्वाभाविक है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לֹא מָלוּ
  choice: खतना नहीं हुआ था
  rationale: इब्रानी क्रिया सक्रिय रूप में ‘उन्होंने खतना नहीं किया’ कहती है, पर कर्ता अनिर्दिष्ट है और बल उस पीढ़ी की अखतनित अवस्था पर है; हिन्दी का यह रूप उसी केंद्र को स्वाभाविक ढंग से रखता है।
