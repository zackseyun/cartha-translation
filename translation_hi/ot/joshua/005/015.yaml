- source_word: וַיַּעַשׂ יְהוֹשֻׁעַ כֵּן
  choice: और यहोशू ने वैसा ही किया
  rationale: आज्ञापालन के कथात्मक सूत्र का सहज आधुनिक हिन्दी रूप।
theological_decisions:
- issue: שַׂר צְבָא יְהוָה कहे गए वक्ता की पहचान और स्थिति
  choice: उपाधि का वर्णनात्मक अनुवाद ‘यहोवा की सेना के प्रधान’ किया गया है।
  alternative: उसे स्पष्टतः स्वर्गदूत, यहोवा का दृश्य प्रकट रूप, अथवा देहधारण-पूर्व मसीह बताना।
  rationale: पद वक्ता को इस उपाधि से पहचानता है, पर उसकी सत्ता का और स्पष्ट निर्धारण नहीं करता; इसलिए अनुवाद मूल की धर्मवैचारिक अनिश्चितता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। दिव्य नाम को ‘यहोवा’ रखा गया है। मूल के एकवचन को स्पष्ट रखने के लिए ‘पाँव की जूती’ कहा गया है; यह बोलचाल में समझने योग्य है, यद्यपि ‘अपनी जूती अपने पाँव से’ अधिक शाब्दिक विकल्प है।
