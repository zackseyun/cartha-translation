  text: Then the commander of Yahweh’s army said to Joshua[a], “Take your sandal off your foot[b], because the place where you are standing is holy.” And Joshua did so.
translation:
  language: hi
  text: तब यहोवा की सेना के प्रधान[a] ने यहोशू से कहा, “अपनी जूती अपने पाँव से उतार दो[b], क्योंकि जिस स्थान पर तुम खड़े हो, वह पवित्र है।” और यहोशू ने वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा की सेना का प्रधान।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में एकवचन है: “अपनी जूती … अपने पाँव।” निर्गमन 3:5 में प्रयुक्त अधिक परिचित बहुवचन शब्दावली से तुलना करें।'
    reason: cross_reference
