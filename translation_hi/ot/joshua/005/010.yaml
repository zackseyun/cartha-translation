  text: And the sons of Israel camped at Gilgal[a], and they kept the Passover on the fourteenth day of the month, in the evening, on the plains of Jericho.
translation:
  language: hi
  text: इस्राएल के पुत्रों[a] ने गिलगाल में पड़ाव डाला और महीने के चौदहवें दिन शाम को यरीहो के मैदानों में फ़सह मनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इस्राएली’ अथवा ‘इस्राएल की संतान।’ इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: पड़ाव डाला
  rationale: חנה का अर्थ शिविर लगाना या पड़ाव डालना है। आधुनिक हिन्दी में ‘पड़ाव डाला’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी के शाब्दिक पारिवारिक और पुल्लिंग बहुवचन रूप को सुरक्षित रखता है; ‘इस्राएलियों’ अधिक मुहावरेदार विकल्प है, पर मूल अभिव्यक्ति को कम प्रत्यक्ष बनाता है।
- source_word: בַּגִּלְגָּל
  choice: गिलगाल में
  rationale: स्थान-सूचक בְ का हिन्दी में इस प्रसंग के लिए स्वाभाविक रूप ‘में’ है।
- source_word: וַיַּעֲשׂוּ אֶת־הַפֶּסַח
  choice: फ़सह मनाया
  rationale: עשה के साथ פֶּסַח एक मुहावरा है जिसका आशय फ़सह का अनुष्ठान अथवा पर्व मनाना है; ‘मनाया’ आधुनिक हिन्दी में सहज है।
- source_word: הַפֶּסַח
  choice: फ़सह
  rationale: यह बाइबली पर्व और उससे जुड़े अनुष्ठान के लिए हिन्दी में प्रचलित लिप्यंतरण है।
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: महीने के चौदहवें दिन
  rationale: यह मूल की कालक्रम-सूचक अभिव्यक्ति का सटीक और स्वाभाविक हिन्दी रूप है।
- source_word: בָּעֶרֶב
  choice: शाम को
  rationale: यहाँ शब्द अनुष्ठान का समय बताता है; ‘शाम को’ वर्तमान मानक हिन्दी में सहज है।
- source_word: בְּעַרְבוֹת יְרִיחוֹ
  choice: यरीहो के मैदानों में
  rationale: עַרְבוֹת समतल अथवा मैदानी भूभाग को दर्शाता है। ‘मैदानों’ भौगोलिक अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली / इस्राएल की संतान
  rationale: मूल पाठ में स्पष्ट पुल्लिंग बहुवचन और पारिवारिक अभिव्यक्ति है। ‘इस्राएल के पुत्रों’ इसे पारदर्शी ढंग से सुरक्षित रखता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। ‘इस्राएल के पुत्रों’ मूल की औपचारिक पारिवारिक अभिव्यक्ति को जानबूझकर बनाए रखता है; शेष वाक्य स्वाभाविक हिन्दी वाक्य-विन्यास में है।
