  text: וַ/יֹּ֣אמֶר לֹ֗א כִּ֛י אֲנִ֥י שַׂר צְבָֽא יְהוָ֖ה עַתָּ֣ה בָ֑אתִי וַ/יִּפֹּל֩ יְהוֹשֻׁ֨עַ אֶל פָּנָ֥י/ו אַ֨רְצָ/ה֙ וַ/יִּשְׁתָּ֔חוּ וַ/יֹּ֣אמֶר ל֔/וֹ מָ֥ה אֲדֹנִ֖/י מְדַבֵּ֥ר אֶל עַבְדּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/014.yaml
  text: He said[a], “No; rather, I have now come as the commander of the army of Yahweh.” Then Joshua fell with his face to the ground and bowed down, and said to him[b], “What is my lord saying to his servant?”
translation:
  language: hi
  text: उसने कहा[a], “नहीं; बल्कि मैं अब यहोवा की सेना के प्रधान के रूप में आया हूँ।” तब यहोशू मुँह के बल भूमि पर गिर पड़ा और दण्डवत् किया[b]। उसने उससे कहा, “मेरे स्वामी, अपने सेवक से क्या कह रहे हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न तो किसी पक्ष में; मैं अब यहोवा की सेना के प्रधान के रूप में आया हूँ।”
    reason: לֹא को यहोशू के पिछले ‘हमारी ओर या हमारे शत्रुओं की ओर’ प्रश्न के उत्तर में ‘न तो किसी पक्ष में’ के अर्थ में समझा जा सकता है।
  - marker: b
    text: इब्रानी क्रिया का अनुवाद “आराधना की” भी हो सकता है। यहाँ “दण्डवत् किया” उस क्रिया को व्यक्त करता है, पर केवल इसी पद के आधार पर उस व्यक्ति की पहचान या इस कार्य का ठीक धार्मिक स्वरूप निर्धारित नहीं करता।
    reason: मूल क्रिया में आदरपूर्वक झुकने और आराधना करने, दोनों की अर्थ-सम्भावना है।
lexical_decisions:
- source_word: לֹא
  choice: नहीं
  rationale: यह यहोशू के पिछले प्रश्न का सीधा निषेध है। प्रसंग में ‘न तो किसी की ओर’ का भाव संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: כִּי
  choice: बल्कि
  rationale: 'निषेध के बाद यह शब्द सुधारात्मक कथन प्रस्तुत करता है: पहले दिए गए विकल्प के स्थान पर वक्ता अपनी पहचान बताता है।'
- source_word: שַׂר צְבָא יְהוָה
  choice: यहोवा की सेना का प्रधान
  rationale: सैन्य प्रसंग में שַׂר नेतृत्व करने वाले अधिकारी को और צְבָא सेना को दर्शाता है। ‘प्रधान’ आधुनिक हिन्दी में पद और अधिकार दोनों व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: עַתָּה בָאתִי
  choice: अब आया हूँ
  rationale: यह आगमन की पूर्ण घटना और उसकी वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל פָּנָיו אַרְצָה
  choice: मुँह के बल भूमि पर
  rationale: इब्रानी मुहावरा भूमि की ओर मुख करके गिरने की शारीरिक मुद्रा बताता है; यह हिन्दी अभिव्यक्ति उसी दृश्य को सहज रूप में रखती है।
- source_word: וַיִּשְׁתָּחוּ
  choice: दण्डवत् किया
  rationale: यह झुककर सम्मान प्रकट करने की क्रिया को व्यक्त करता है, पर अपने आप यह निर्धारित नहीं करता कि यहाँ आराधना अभिप्रेत है।
- source_word: אֲדֹנִי
  choice: मेरा प्रभु
  rationale: प्रथम पुरुष प्रत्यय सहित यह आदरसूचक संबोधन है। प्रसंग इस पद में संबोधित व्यक्ति की अंतिम पहचान स्पष्ट नहीं करता।
- source_word: מְדַבֵּר אֶל עַבְדּוֹ
  choice: अपने सेवक से क्या कह रहा है
  rationale: कृदन्त की जारी क्रिया का भाव ‘कह रहा है’ से और यहोशू की विनम्र आत्म-पहचान ‘अपने सेवक’ से सुरक्षित रहती है।
theological_decisions:
- issue: क्या यहोशू की क्रिया को स्पष्ट रूप से आराधना कहा जाए
  choice: मुख्य पाठ में ‘दण्डवत् किया’
  alternative: ‘आराधना की’
  rationale: שחה आदरपूर्वक झुकने और कुछ संदर्भों में आराधना करने, दोनों के लिए प्रयुक्त हो सकता है। यह पद अकेले क्रिया का धार्मिक स्वरूप निर्णायक रूप से नहीं ठहराता।
- issue: क्या वक्ता को अनुवाद में स्पष्टतः स्वर्गदूत या ईश्वरीय प्रकट रूप कहा जाए
  choice: उसे केवल ‘यहोवा की सेना का प्रधान’ कहा गया है
  alternative: उसे स्वर्गदूत, ईश्वरावतार या ईश्वरीय प्रकट रूप के रूप में स्पष्ट करना
  rationale: इस पद का इब्रानी पाठ वक्ता की उपाधि देता है, पर उसके अस्तित्वगत स्वरूप को स्पष्टतः निर्धारित नहीं करता; इसलिए अनुवाद व्याख्यात्मक पहचान नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सुबोध रूप। ‘दण्डवत्’ बाइबलीय-सांस्कृतिक प्रसंग में परिचित है और ‘आराधना’ की अपेक्षा मूल की अर्थगत खुली स्थिति बनाए रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
