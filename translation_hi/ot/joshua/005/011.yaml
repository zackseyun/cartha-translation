base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/011.yaml
  text: 'And they ate some of the produce of the land on the day after the Passover: unleavened bread and roasted grain[b][a], on this very day.'
translation:
  language: hi
  text: और उन्होंने फसह के अगले दिन उस देश की उपज[b] में से खाया—बिना खमीर की रोटियाँ और भुना हुआ अनाज[a]—ठीक उसी दिन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भुना हुआ दाना।” इब्रानी शब्द भूनकर तैयार किए गए अनाज को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “देश की उपज” का अर्थ “देश की पुरानी उपज” भी समझा गया है, अर्थात पिछली फसल से बचाकर रखा गया अनाज; पर इब्रानी शब्द में “पुरानी” स्पष्ट रूप से नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: और उन्होंने ... खाया
  rationale: अपूर्ण वाव-क्रम कथा की अगली घटना बताता है; ‘और’ इब्रानी कथात्मक प्रवाह को सहज हिन्दी में बनाए रखता है।
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: उस देश की उपज में से
  rationale: עֲבוּר यहाँ देश की उपज या पैदावार को सूचित करता है। ‘पुरानी उपज’ संदर्भगत संभावना है, पर ‘पुरानी’ शब्द में स्पष्ट नहीं है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: फसह के अगले दिन
  rationale: यह कालवाचक पदबंध आधुनिक हिन्दी में स्वाभाविक रूप से अगले दिन का अर्थ देता है। ‘फसह’ बाइबलीय पर्व का प्रचलित हिन्दी नाम है।
- source_word: מַצּוֹת
  choice: बिना खमीर की रोटियाँ
  rationale: फसह के संदर्भ में यह बहुवचन अखमीरी रोटी को दर्शाता है; यह रूप साधारण पाठकों के लिए स्पष्ट और स्वाभाविक है।
- source_word: וְקָלוּי
  choice: और भुना हुआ अनाज
  rationale: קָלוּי भूनकर तैयार किए गए अनाज को दर्शाता है। ‘भुना हुआ अनाज’ आधुनिक हिन्दी में ‘भुना दाना’ की अपेक्षा अधिक स्पष्ट है।
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ठीक उसी दिन
  rationale: मुहावरा उसी निश्चित दिन पर बल देता है। हिन्दी कथा में ‘उसी’ स्वाभाविक है और इब्रानी के बलाघात को सुरक्षित रखता है।
