id: JOS.5.2
reference: Joshua 5:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא אָמַ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ עֲשֵׂ֥ה לְ/ךָ֖ חַֽרְב֣וֹת צֻרִ֑ים וְ/שׁ֛וּב מֹ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל שֵׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/002.yaml
  text: At that time Yahweh said to Joshua[a], “Make for yourself flint knives, and circumcise the sons of Israel again[c][b], a second time.”
translation:
  language: hi
  text: उस समय याहवे ने यहोशू से कहा, “अपने लिए चकमक पत्थर की छुरियाँ[a] बनाओ और इस्राएल के पुत्रों[b] का फिर से—दूसरी बार[c]—खतना करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चकमक पत्थर की धारदार छुरियाँ।” इब्रानी पदबंध चकमक पत्थर से बने काटने के औज़ारों को दर्शाता है, जिनका यहाँ खतने के लिए उपयोग होना था।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र”; कई अनुवाद इसे अधिक सामान्य रूप में “इस्राएली” कहते हैं।
    reason: lexical_alternative
  - marker: c
    text: “दूसरी बार” का आशय इस्राएल समुदाय में खतने की प्रथा फिर से किए जाने से है; इसका यह अर्थ नहीं कि उन्हीं व्यक्तियों का दो बार खतना किया जाए।
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह कथा की समय-स्थिति बताने वाला सामान्य इब्रानी पदबंध है; ‘उस समय’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: עֲשֵׂה לְךָ
  choice: अपने लिए ... बनाओ
  rationale: आज्ञार्थक क्रिया और हितवाचक सर्वनाम, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חַרְבוֹת צֻרִים
  choice: चकमक पत्थर की छुरियाँ
  rationale: इस प्रसंग में חַרְבוֹת तलवारों के बजाय काटने के औज़ारों को और צֻרִים उनकी चकमक-पत्थर सामग्री को सूचित करता है।
- source_word: וְשׁוּב
  choice: और ... फिर से
  rationale: शाब्दिक अर्थ ‘लौटकर’ होने पर भी अगली आज्ञा के साथ यह पुनरावृत्ति का क्रियाविशेषणीय भाव देता है।
- source_word: מֹל
  choice: खतना करो
  rationale: वाचा-संबंधी इस प्रसंग में क्रिया מול का सीधा और प्रचलित हिन्दी अर्थ है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह मूल के पुल्लिंग पदबंध को बनाए रखता है और खतने के तात्कालिक प्रसंग में पुरुषों की ओर विशेष संकेत भी सुरक्षित रखता है।
- source_word: שֵׁנִית
  choice: दूसरी बार
  rationale: मूल पाठ पुनरावृत्ति को अलग से और स्पष्ट रूप से चिह्नित करता है; इसलिए וְשׁוּב के ‘फिर से’ में इसे विलीन नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना लिप्यंतरित करता है।
- issue: בְּנֵי יִשְׂרָאֵל में लिंग-सूचक अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों; इस्राएल की संतान
  rationale: मूल पदबंध व्याकरणतः पुल्लिंग है और यहाँ खतना पाने वाले पुरुष वंशज उसके प्रत्यक्ष कर्म हैं; इसलिए ‘पुत्रों’ से रूप और प्रसंग दोनों सुरक्षित रहते हैं।
- issue: וְשׁוּב और שֵׁנִית की दोहरी पुनरावृत्ति
  choice: फिर से—दूसरी बार—
  alternative: फिर से; दूसरी बार
  rationale: मूल में पुनरावृत्ति के दोनों संकेत उपस्थित हैं। हिन्दी में दोनों को रखना कुछ असामान्य अवश्य है, पर पाठ की वास्तविक कठिनाई और बल को चुपचाप हटाता नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘चकमक पत्थर की छुरियाँ’ प्रसंगानुकूल है। मूल में ‘फिर से’ और ‘दूसरी बार’ दोनों होने के कारण डैश से उनके बल और हल्की पाठगत असामान्यता को बनाए रखा गया है।
