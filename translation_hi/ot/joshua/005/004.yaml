base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/004.yaml
  text: 'And this is the reason why Joshua circumcised them: all the people who came out of Egypt[a], the males, all the men of war[b], had died in the wilderness on the way after they came out of Egypt.'
translation:
  language: hi
  text: 'यहोशू ने उनका खतना क्यों किया, इसका कारण यह था: मिस्र से निकले हुए लोगों में से सभी पुरुष—सभी योद्धा[a]—मिस्र से निकलने के बाद यात्रा के दौरान निर्जन प्रदेश में मर चुके थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘योद्धा’ का अनुवाद ‘युद्ध करनेवाले पुरुष’ या ‘लड़ाकू पुरुष’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה הַדָּבָר
  choice: इसका कारण यह था
  rationale: इब्रानी पदबंध शाब्दिक रूप से ‘और यह वह बात है’ है, पर प्रसंग में यह यहोशू के कार्य का कारण बताने वाली व्याख्या आरम्भ करता है।
- source_word: אֲשֶׁר מָל יְהוֹשֻׁעַ
  choice: यहोशू ने उनका खतना क्यों किया
  rationale: इब्रानी संबंधवाचक रचना हिंदी में शाब्दिक रूप से असहज होगी। ‘क्यों’ पदबंध के व्याख्यात्मक आशय को स्वाभाविक ढंग से व्यक्त करता है; ‘उनका’ संदर्भ से पूरित है।
- source_word: מָל
  choice: खतना किया
  rationale: मूल क्रिया का सटीक और आधुनिक मानक हिंदी में प्रचलित धार्मिक-सांस्कृतिक प्रतिशब्द।
- source_word: כָּל הָעָם הַיֹּצֵא מִמִּצְרַיִם
  choice: मिस्र से निकले हुए लोगों में से
  rationale: सहभागी रूप को स्वाभाविक हिंदी में व्यक्त करता है और आगे आने वाले ‘सभी पुरुष’ को उसी समूह के रूप में स्पष्ट करता है।
- source_word: הַזְּכָרִים
  choice: सभी पुरुष
  rationale: यहाँ मूल पाठ पुरुष लिंग को स्पष्ट करता है। हिंदी में मनुष्यों के लिए ‘पुरुष’ ‘नर’ की अपेक्षा अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: सभी योद्धा
  rationale: सैन्य पहचान को संक्षिप्त, स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है; शाब्दिक ‘युद्ध के पुरुष’ असहज है।
- source_word: מֵתוּ
  choice: मर चुके थे
  rationale: यहोशू के खतना करने से पहले पूरी हो चुकी घटना को हिंदी में पूर्वपूर्ण भाव से व्यक्त करता है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: בַּמִּדְבָּר का बाइबलीय अर्थ निर्जन वनप्रदेश है; हिंदी बाइबल-प्रयोग में ‘जंगल’ स्वाभाविक है और केवल रेतीले ‘रेगिस्तान’ तक अर्थ सीमित नहीं करता।
- source_word: בַּדֶּרֶךְ
  choice: यात्रा के दौरान
  rationale: ‘मार्ग में’ की अपेक्षा यहाँ यात्रा की अवधि और क्रम को अधिक स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: मिस्र से निकलने के बाद
  rationale: मिस्र से निर्गमन और बाद की यात्रा में हुई मृत्यु का कालक्रम स्पष्ट करता है।
theological_decisions:
- issue: הַזְּכָרִים और כֹּל אַנְשֵׁי הַמִּלְחָמָה का आपसी संबंध
  choice: ‘सभी पुरुष—सभी योद्धा—’ को समान समूह की पुनर्व्याख्यात्मक पहचान के रूप में रखा
  alternative: ‘सभी पुरुष और सभी योद्धा’
  rationale: मूल में संयोजक ‘और’ नहीं है; दूसरा पदबंध पहले पुरुष समूह को सैन्य दृष्टि से स्पष्ट करता है। यह प्रस्तुति अतिरिक्त समूह निर्मित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिंदी; कथात्मक, स्पष्ट और गरिमापूर्ण शैली। व्याख्यात्मक इब्रानी मुहावरे को स्वाभाविक हिंदी में रखा गया है, जबकि पुरुषों और योद्धाओं के बीच मूल का पुनर्व्याख्यात्मक संबंध डैश से सुरक्षित रखा गया है।
