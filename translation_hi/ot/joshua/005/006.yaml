  text: כִּ֣י אַרְבָּעִ֣ים שָׁנָ֗ה הָלְכ֣וּ בְנֵֽי יִשְׂרָאֵל֮ בַּ/מִּדְבָּר֒ עַד תֹּ֨ם כָּל הַ/גּ֜וֹי אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים מִ/מִּצְרַ֔יִם אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לָ/הֶ֔ם לְ/בִלְתִּ֞י הַרְאוֹתָ֣/ם אֶת הָ/אָ֗רֶץ אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֤ה לַֽ/אֲבוֹתָ/ם֙ לָ֣/תֶת לָ֔/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/006.yaml
  text: For the sons of Israel had walked in the wilderness forty years[a], until all the nation—the men of war who came out of Egypt—had come to an end, because they had not listened to the voice of Yahweh. Yahweh had sworn to them that he would not let them see the land that Yahweh had sworn to their fathers to give to us, a land flowing with milk and honey.
translation:
  language: hi
  text: क्योंकि इस्राएल के लोग चालीस वर्ष तक वीराने में चलते रहे, जब तक मिस्र से निकले युद्ध करने वाले पुरुषों का सारा समुदाय समाप्त न हो गया; क्योंकि उन्होंने यहोवा की वाणी नहीं मानी थी। यहोवा ने उनसे शपथ खाई थी कि वह उन्हें वह देश देखने नहीं देगा, जिसे यहोवा ने उनके पूर्वजों को हमें देने की शपथ खाकर वचन दिया था[a]—वह देश जिसमें दूध और मधु की धाराएँ बहती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘हमें देने की’ है; कुछ प्राचीन पाठ-साक्ष्य और अनुवादों में ‘उन्हें देने की’ मिलता है।
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है और हिन्दी में वाक्य-संबंध स्वाभाविक रखता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के लोग
  rationale: सामूहिक अर्थ को आधुनिक, सहज हिन्दी में व्यक्त करता है; यहाँ आगे पुरुष योद्धाओं का विशेष उल्लेख अलग से किया गया है।
- source_word: הָלְכוּ ... בַּמִּדְבָּר
  choice: वीराने में चलते रहे
  rationale: הלך की गतिशीलता और चालीस वर्षों की निरंतर अवधि दोनों सुरक्षित हैं; 'वीराना' निर्जन वन-प्रदेश का अर्थ देता है, केवल रेतीले मरुस्थल का नहीं।
- source_word: עַד תֹּם
  choice: जब तक ... समाप्त न हो गया
  rationale: समूह के पूर्णतः चुक जाने या अंत हो जाने का अर्थ रखता है, पर क्रिया में मृत्यु का ढंग अनावश्यक रूप से नहीं जोड़ता।
- source_word: כָּל הַגּוֹי אַנְשֵׁי הַמִּלְחָמָה
  choice: युद्ध के योग्य पुरुषों का वह पूरा समुदाय
  rationale: גוי के सामूहिक भाव और apposition में आए युद्ध-पुरुषों की पहचान को प्राकृतिक हिन्दी में जोड़ता है।
- source_word: לֹא שָׁמְעוּ בְּקוֹל יְהוָה
  choice: यहोवा की वाणी नहीं मानी थी
  rationale: सुनने की मूल छवि और आज्ञापालन के मुहावरेदार आशय दोनों को संक्षेप में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी विशिष्ट ईश्वरीय नाम को हिन्दी में प्रचलित नाम-रूप से व्यक्त करता है, सामान्य उपाधि से नहीं।
- source_word: לְבִלְתִּי הַרְאוֹתָם
  choice: उन्हें ... देखने नहीं देगा
  rationale: ראה के हिफ़ील रूप की कारकता को सहज हिन्दी में सुरक्षित रखता है।
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: वह देश जिसमें दूध और मधु की धाराएँ बहती हैं
  rationale: समृद्धि बताने वाले इब्रानी रूपक को स्पष्ट और प्रतिष्ठित हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम है; इसलिए इसे सामान्य उपाधि 'प्रभु' से प्रतिस्थापित नहीं किया गया।
- issue: לָנוּ में प्रथम पुरुष बहुवचन
  choice: हमें देने की
  alternative: उन्हें देने की
  rationale: मसोरेटिक पाठ के प्रथम पुरुष बहुवचन को मुख्य पाठ में सुरक्षित रखा गया है, यद्यपि प्रसंग में तृतीय पुरुष अपेक्षित लग सकता है; इस वास्तविक पाठगत तनाव को सुधारा नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। लंबे इब्रानी वाक्य को स्पष्ट हिन्दी खंडों में बाँटा गया, जबकि कारण-संबंध, वाचा की शपथ और लָנוּ की पाठगत कठिनाई सुरक्षित रखी गई है।
