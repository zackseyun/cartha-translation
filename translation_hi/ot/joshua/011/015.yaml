source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ כֵּן צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וְ/כֵן֙ עָשָׂ֣ה יְהוֹשֻׁ֔עַ לֹֽא הֵסִ֣יר דָּבָ֔ר מִ/כֹּ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/015.yaml
  text: Just as Yahweh had commanded Moses his servant[a], so Moses commanded Joshua, and so Joshua did. He left nothing undone of all that Yahweh had commanded Moses.
translation:
  language: hi
  text: जैसा याहवे ने अपने सेवक मूसा को आज्ञा दी थी, वैसे ही मूसा ने यहोशू को आज्ञा दी, और यहोशू ने वैसा ही किया। याहवे ने मूसा को जो कुछ आज्ञा दी थी, उसमें से यहोशू ने एक भी बात नहीं छोड़ी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे ने मूसा को जो कुछ आज्ञा दी थी, उस सब में से यहोशू ने एक भी बात नहीं हटाई।”
    reason: इब्रानी मुहावरे का अधिक शाब्दिक रूप दिखाने के लिए; मुख्य पाठ में उसका स्वाभाविक हिन्दी अर्थ दिया गया है।
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: जैसा
  rationale: यह यहोवा की मूसा को दी गई आज्ञा और मूसा की यहोशू को दी गई आज्ञा के बीच अनुरूपता प्रकट करता है; ‘जैसा...वैसे ही’ स्वाभाविक हिन्दी है।
- source_word: צִוָּה
  choice: आज्ञा दी थी / आज्ञा दी
  rationale: क्रिया अधिकारपूर्ण आदेश को व्यक्त करती है। पहले प्रयोग में ‘दी थी’ पूर्वकालिकता दिखाता है, जबकि अगले प्रयोग में सामान्य भूतकाल पर्याप्त है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: עַבְדּוֹ
  choice: अपने सेवक
  rationale: मूसा के लिए यह सम्मानसूचक और वाचा-संबंधी पद है; ‘सेवक’ इस प्रसंग में अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से रखता है।
- source_word: כֵּן
  choice: वैसे ही / वैसा ही
  rationale: दोनों प्रयोग आज्ञा और उसके पालन के बीच ठीक उसी अनुरूपता को बनाए रखते हैं जिसे इब्रानी की पुनरावृत्ति व्यक्त करती है।
- source_word: עָשָׂה
  choice: किया
  rationale: मूल क्रिया व्यापक और संक्षिप्त है; ‘किया’ उसी संक्षिप्तता को बनाए रखता है और अगला वाक्य आज्ञापालन की पूर्णता स्पष्ट करता है।
- source_word: לֹא הֵסִיר דָּבָר
  choice: एक भी बात नहीं छोड़ी
  rationale: शाब्दिक रूप ‘एक बात भी नहीं हटाई’ है, पर प्रसंग में इसका आशय किसी भी आज्ञा को न छोड़ना है। चुना हुआ रूप स्वाभाविक हिन्दी में पूर्ण आज्ञापालन व्यक्त करता है।
- source_word: מִכֹּל אֲשֶׁר
  choice: जो कुछ ... उसमें से
  rationale: यह आदेशों की समग्रता पर बल देता है और हिन्दी वाक्य में स्रोत के ‘सब में से’ वाले संबंध को स्पष्ट रखता है।
- source_word: אֶת
  choice: '[अनूदित नहीं]'
  rationale: यह प्रत्यक्ष कर्म का व्याकरणिक चिह्न है, जिसका हिन्दी में स्वतंत्र शब्दगत समकक्ष आवश्यक नहीं है।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है। हिन्दी पाठक के लिए स्थापित और पहचाना जाने वाला रूप ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: यहोशू के आज्ञापालन की पूर्णता
  choice: एक भी बात नहीं छोड़ी
  alternative: कोई काम अधूरा नहीं छोड़ा
  rationale: דָּבָר का अर्थ यहाँ आज्ञा की कोई ‘बात’ या अंश हो सकता है। ‘एक भी बात नहीं छोड़ी’ मूल की शब्दगत व्यापकता रखता है और उसे केवल अधूरे कामों तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य विन्यास सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। ‘जैसा...वैसे ही’ और ‘एक भी बात नहीं छोड़ी’ सामान्य पाठक के लिए सहज हैं, जबकि मूल पाठ की पुनरावृत्ति और पूर्ण आज्ञापालन पर बल सुरक्षित रहता है।
