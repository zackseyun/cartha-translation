base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/022.yaml
  text: No Anakim were left in the land of the sons of Israel[a]; only in Gaza, Gath[b], and Ashdod did some remain.
translation:
  language: hi
  text: इस्राएलियों के देश में कोई अनाकी शेष नहीं रहा; केवल गाज़ा, गत और अशदोद में कुछ अनाकी रह गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נוֹתַר
  choice: शेष नहीं रहा
  rationale: निफ़अल रूप अभियान के बाद बचे रहने की परिणामी अवस्था व्यक्त करता है; ‘शेष नहीं रहा’ हिन्दी में स्वाभाविक है।
- source_word: עֲנָקִים
  choice: अनाकी
  rationale: यह एक जाति-नाम है; हिन्दी बाइबल परंपरा के अनुरूप इसका लिप्यंतरण किया गया है।
- source_word: בְּאֶרֶץ בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के देश में
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्रों के देश में’ है, पर आधुनिक हिन्दी में ‘इस्राएलियों के देश में’ वही सामुदायिक अर्थ अधिक सहज और स्पष्ट रूप से देता है।
- source_word: רַק
  choice: केवल
  rationale: यह सीमा अथवा अपवाद दर्शाता है और अगले स्थानों की सूची के साथ स्पष्ट विरोध स्थापित करता है।
- source_word: בְּעַזָּה בְּגַת וּבְאַשְׁדּוֹד
  choice: गाज़ा, गत और अशदोद में
  rationale: स्थान-नामों का प्रचलित हिन्दी लिप्यंतरण किया गया है; बार-बार आए संबंधबोधक को हिन्दी में सूची के अंत में एक बार रखना स्वाभाविक है।
- source_word: נִשְׁאָרוּ
  choice: कुछ अनाकी रह गए
  rationale: बहुवचन क्रिया का निहित कर्ता अनाकी हैं; ‘कुछ’ शेष बचे समूह को सहज हिन्दी में स्पष्ट करता है, और जाति-नाम की पुनरावृत्ति संदर्भ को साफ रखती है।
