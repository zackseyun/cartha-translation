base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/023.yaml
  text: So Joshua took all the land[a], according to all that Yahweh had spoken to Moses, and Joshua gave it to Israel as an inheritance according to their divisions by their tribes[b]. And the land had rest from war.
translation:
  language: hi
  text: इस प्रकार यहोशू ने सारे देश[a] पर अधिकार कर लिया, जैसा यहोवा ने मूसा से जो कुछ कहा था, उसके अनुसार। फिर यहोशू ने उसे इस्राएल को उनके गोत्रों के अनुसार बाँटे हुए हिस्सों में विरासत के रूप में दे दिया। तब देश को युद्ध से विश्राम मिला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरा देश।” यह वाक्यांश यहाँ चर्चा में आए देश पर यहोशू के विजय-अभियान का सारांश देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “देश युद्ध से शांत हो गया।” इब्रानी अभिव्यक्ति संघर्ष के बाद विश्राम या शांति को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: अपने अधिकार में ले लिया
  rationale: मूल क्रिया का अर्थ ‘लेना’ है; विजय-सारांश के प्रसंग में यह हिंदी में स्वाभाविक रूप से भूमि पर अधिकार प्राप्त करने को व्यक्त करता है, पर केवल सैन्य ढंग पर अनावश्यक बल नहीं देता।
- source_word: כָּל הָאָרֶץ
  choice: उस पूरे देश
  rationale: यह पद चर्चा में आए प्रतिज्ञात भूभाग का सारांश देता है, समस्त पृथ्वी का नहीं। ‘उस पूरे देश’ संदर्भगत सीमा बनाए रखता है।
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר
  choice: ठीक वैसे ही जैसे ... कहा था
  rationale: यह पहले कही गई बात के अनुरूप कार्य होने का भाव स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: וַיִּתְּנָהּ
  choice: उसे ... दे दिया
  rationale: स्त्रीलिंग प्रत्यय का संबंध भूमि से है; ‘दे दिया’ मूल क्रिया का सीधा और स्वाभाविक अर्थ है।
- source_word: לְנַחֲלָה
  choice: विरासत के रूप में
  rationale: यह वाचा-संबंधी भूमि के उत्तराधिकार और स्थायी हिस्से दोनों का भाव बनाए रखता है।
- source_word: כְּמַחְלְקֹתָם לְשִׁבְטֵיהֶם
  choice: उनके गोत्रों के अनुसार उनके हिस्से बाँट दिए
  rationale: शाब्दिक संरचना को सहज हिंदी में खोलकर यह गोत्रवार विभाजन और हिस्सों के आवंटन का अर्थ स्पष्ट करता है।
- source_word: שָׁקְטָה מִמִּלְחָמָה
  choice: युद्ध से विश्राम मिला
  rationale: यह संघर्ष के बाद की शांति और प्रमुख युद्धों की समाप्ति दर्शाता है, बिना पूर्ण और सार्वकालिक शांति का दावा किए।
theological_decisions:
- issue: ‘पूरे देश’ वाले विजय-सारांश का दायरा
  choice: वर्तमान प्रसंग के देश पर यहोशू की सफल विजय का सारांश, जैसा यहोवा ने मूसा से कहा था
  alternative: हर भूभाग पर उसी समय पूर्ण कब्जे का निरपेक्ष दावा; अथवा केवल अतिशयोक्तिपूर्ण विजय-वर्णन
  rationale: इब्रानी पाठ सारांशात्मक कथन करता है। अनुवाद उसी दावे को बनाए रखता है और शेष भूभाग बताने वाले अन्य पदों के साथ उत्पन्न तनाव को व्याख्या द्वारा समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सहज शैली। ‘यहोवा’ व्यक्तिगत नाम के रूप में रखा गया है। गोत्रवार वितरण को स्वाभाविक हिंदी में व्यक्त किया गया है और विजय की पूर्णता से जुड़ी पाठगत धर्मवैज्ञानिक खींचतान को खुला रखा गया है।
