  text: וַ/יַּ֤עַשׂ לָ/הֶם֙ יְהוֹשֻׁ֔עַ כַּ/אֲשֶׁ֥ר אָֽמַר ל֖/וֹ יְהוָ֑ה אֶת סוּסֵי/הֶ֣ם עִקֵּ֔ר וְ/אֶת מַרְכְּבֹתֵי/הֶ֖ם שָׂרַ֥ף בָּ/אֵֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/009.yaml
  text: 'And Joshua did to them just as Yahweh had told him: he hamstrung their horses and burned their chariots with fire[a].'
translation:
  language: hi
  text: 'यहोशू ने उनके साथ ठीक वैसा ही किया जैसा यहोवा ने उससे कहा था: उसने उनके घोड़ों की टाँगों की नसें काट दीं[a] और उनके रथों को आग लगाकर जला दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनके घोड़ों को पंगु कर दिया’; इब्रानी क्रिया विशेष रूप से टाँगों की नसें काटकर उन्हें अयोग्य बनाने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם
  choice: उनके साथ ... किया
  rationale: עשה + ל का अर्थ यहाँ युद्ध के संदर्भ में उनके प्रति वैसा करना है; स्वाभाविक हिन्दी में ‘उनके साथ ... किया’ इस भाव को स्पष्ट रखता है।
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: ठीक वैसा ही ... जैसा ... ने उससे कहा था
  rationale: כַּאֲשֶׁר की तुलनात्मक शक्ति और पहले दिए गए आदेश की कथात्मक पूर्वता दोनों सुरक्षित रहती हैं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: סוּסֵיהֶם
  choice: उनके घोड़ों
  rationale: बहुवचन संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: עִקֵּר
  choice: पाँवों की नसें काट दीं
  rationale: क्रिया पशुओं को अयोग्य बनाने के लिए उनके पैरों की नसें काटने की विशिष्ट कार्रवाई बताती है; यह हिन्दी में ‘अपंग किया’ से अधिक सटीक और समझने योग्य है।
- source_word: מַרְכְּבֹתֵיהֶם
  choice: उनके रथों
  rationale: युद्ध-रथों के लिए मानक और प्रसंगानुकूल हिन्दी शब्द।
- source_word: שָׂרַף בָּאֵשׁ
  choice: आग में जला दिया
  rationale: मूल में आग का स्पष्ट उल्लेख है; इस अभिव्यक्ति से वह जोर बना रहता है और हिन्दी भी स्वाभाविक रहती है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में उपाधि नहीं बल्कि टेट्राग्रामटन יהוה है। हिन्दी पाठकों के बीच पहचाने जाने वाले नामरूप ‘यहोवा’ को रखते हुए व्यक्तिगत नाम का स्वरूप सुरक्षित किया गया है; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘ठीक वैसा ही’ आज्ञापालन की पूर्ण अनुरूपता को व्यक्त करता है; हिंसक क्रिया को मूल की विशिष्टता के अनुसार स्पष्ट रखा गया है।
