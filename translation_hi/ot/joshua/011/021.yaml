base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/021.yaml
  text: At that time Joshua came and cut off the Anakim from the hill country—from Hebron[a], from Debir, from Anab, and from all the hill country of Judah and from all the hill country of Israel. Joshua devoted them to destruction, together with their cities.
translation:
  language: hi
  text: उसी समय यहोशू ने आकर पहाड़ी प्रदेश से—हेब्रोन से, दबीर से, अनाब से, और यहूदा के सारे पहाड़ी प्रदेश तथा इस्राएल के सारे पहाड़ी प्रदेश से—अनाकियों का सफाया कर दिया। यहोशू ने उन्हें उनके नगरों सहित विनाश के लिए समर्पित कर दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, उन्हें विनाश के लिए निषिद्ध या समर्पित कर दिया। इब्रानी क्रिया का भाव व्यक्तियों या वस्तुओं को विनाश के लिए समर्पित करने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ने आकर
  rationale: בוא यहाँ कथा को आगे बढ़ाता है और यहोशू के उस क्षेत्र में आने के बाद की कार्रवाई बताता है। ‘ने आकर’ आधुनिक हिन्दी में स्वाभाविक है और मूल के दृष्टिकोण को यथासंभव बनाए रखता है।
- source_word: בָּעֵת הַהִיא
  choice: उसी समय
  rationale: यह मानक काल-सूचक पद पिछले वृत्तांत से सीधा संबंध जोड़ता है; ‘उसी समय’ स्वाभाविक और संक्षिप्त है।
- source_word: וַיַּכְרֵת
  choice: का सफाया कर दिया
  rationale: כרת का मूल भाव ‘काट देना/अलग कर देना’ है और यहाँ किसी जनसमूह को उस क्षेत्र से समाप्त करने का अर्थ देता है। ‘सफाया कर दिया’ आधुनिक हिन्दी में इस प्रसंग का अर्थ स्पष्ट करता है, जबकि अगले חרם पद के विशेष अर्पण-विनाश भाव से इसे अलग रखता है।
- source_word: הָעֲנָקִים
  choice: अनाकियों
  rationale: यह अनाक से संबंधित जनसमूह का नाम है; हिन्दी में प्रचलित नाम-रूप ‘अनाकी’ का बहुवचन कारक-रूप प्रयोग किया गया है।
- source_word: מִן הָהָר
  choice: पहाड़ी प्रदेश से
  rationale: यहोशू में הָהָר प्रायः किसी एक पहाड़ के बजाय ऊँचे भूभाग या पर्वतीय अंचल को दर्शाता है।
- source_word: מִן חֶבְרוֹן מִן דְּבִר מִן עֲנָב
  choice: हेब्रोन से, दबीर से, अनाब से
  rationale: स्थान-नामों का लिप्यंतरण किया गया है और मूल की पुनरावृत्त מִן को प्रत्येक नाम के साथ ‘से’ द्वारा बनाए रखा गया है।
- source_word: וּמִכֹּל הַר יְהוּדָה
  choice: और यहूदा के सारे पहाड़ी प्रदेश से
  rationale: यह यहूदा से संबद्ध पूरे ऊँचे भूभाग को सूचित करता है; ‘सारा पहाड़ी प्रदेश’ भौगोलिक अर्थ स्पष्ट रखता है।
- source_word: וּמִכֹּל הַר יִשְׂרָאֵל
  choice: तथा इस्राएल के सारे पहाड़ी प्रदेश से
  rationale: ‘इस्राएल’ को मूल के अनुसार भौगोलिक-राजनीतिक नाम के रूप में रखा गया है, उसे व्याख्यात्मक रूप से ‘इस्राएलियों’ में नहीं बदला गया।
- source_word: עִם עָרֵיהֶם
  choice: उनके नगरों सहित
  rationale: עִם साथ होने का भाव देता है और עָרִים के लिए इस विजय-वृत्तांत में ‘नगर’ उपयुक्त औपचारिक शब्द है।
- source_word: הֶחֱרִימָם
  choice: उन्हें ... विनाश के लिए अर्पित कर दिया
  rationale: חרם के हिफ़ईल रूप में किसी व्यक्ति या वस्तु को ऐसे अर्पण के रूप में अलग करने का विशेष भाव है जिसका परिणाम विनाश है। यह अनुवाद केवल ‘नष्ट किया’ कहने की तुलना में उस तकनीकी भाव को बचाता है।
theological_decisions:
- issue: חרם से जुड़ी युद्ध-विषयक शब्दावली
  choice: विनाश के लिए अर्पित कर दिया
  alternative: पूर्णतः नष्ट कर दिया; प्रतिबंध के अधीन कर दिया
  rationale: पद में כרת और חרם दोनों अलग क्रियाएँ हैं, इसलिए उनके भेद को बनाए रखा गया है। चुना हुआ रूप חרם के अर्पण और विनाश—दोनों पक्षों को व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प की ओर संकेत करती है और किसी अतिरिक्त सांप्रदायिक व्याख्या को मुख्य पाठ में नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भौगोलिक सूची में मूल की पुनरावृत्ति और लय को सुरक्षित रखा गया है। तकनीकी חרם शब्द का अर्थ मुख्य पाठ में स्पष्ट किया गया है और उसका अधिक शाब्दिक, किंतु कम सहज विकल्प पादटिप्पणी में दिया गया है।
