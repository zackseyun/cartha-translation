  yaml_path: translation/ot/joshua/011/013.yaml
  text: But Israel did not burn any of the cities that stood on their mounds[a], except Hazor alone; Joshua burned it.
translation:
  language: hi
  text: परन्तु इस्राएल ने उन नगरों में से किसी को नहीं जलाया जो अपने टीलों पर खड़े थे[a]; केवल हासोर को यहोशू ने जलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अपने टेलों पर खड़े थे”—अर्थात ऐसे बसावट-टीले, जो एक ही स्थान पर लगातार बसने से बनी परतों से बने थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: परन्तु
  rationale: यह शब्द पिछले वृत्तांत के साथ विरोध और एक अपवाद प्रस्तुत करता है; आधुनिक हिन्दी में ‘परन्तु’ उसका स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: כָּל הֶעָרִים ... לֹא
  choice: उन नगरों में से किसी को नहीं
  rationale: निषेध के साथ यह हिन्दी में स्वाभाविक ढंग से समस्त संबंधित नगरों के न जलाए जाने का अर्थ व्यक्त करता है।
- source_word: הָעֹמְדוֹת עַל תִּלָּם
  choice: जो अपने टीलों पर खड़े थे
  rationale: ‘खड़े थे’ मूल कृदन्त की छवि बनाए रखता है, और ‘टीले’ उन पुरानी बस्तियों के बसावट-टीलों का सुलभ हिन्दी रूप है।
- source_word: זוּלָתִי ... לְבַדָּהּ
  choice: केवल
  rationale: दोनों पद मिलकर हासोर के अकेला अपवाद होने पर बल देते हैं; हिन्दी में ‘केवल’ इसे संक्षेप और स्वाभाविकता से व्यक्त करता है।
- source_word: חָצוֹר
  choice: हासोर
  rationale: इब्रानी नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: שָׂרַף יְהוֹשֻׁעַ
  choice: यहोशू ने जलाया
  rationale: मूल क्रिया की पुनरावृत्ति को बनाए रखते हुए हिन्दी की स्वाभाविक कर्ता-कर्म-क्रिया संरचना अपनाई गई है।
