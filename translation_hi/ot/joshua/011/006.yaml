source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֣ה אֶל יְהוֹשֻׁעַ֮ אַל תִּירָ֣א מִ/פְּנֵי/הֶם֒ כִּֽי מָחָ֞ר כָּ/עֵ֣ת הַ/זֹּ֗את אָנֹכִ֞י נֹתֵ֧ן אֶת כֻּלָּ֛/ם חֲלָלִ֖ים לִ/פְנֵ֣י יִשְׂרָאֵ֑ל אֶת סוּסֵי/הֶ֣ם תְּעַקֵּ֔ר וְ/אֶת מַרְכְּבֹתֵי/הֶ֖ם תִּשְׂרֹ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/006.yaml
  text: And Yahweh said to Joshua[a], “Do not fear them, for tomorrow at this time I am giving all of them over before Israel as slain men[b]. You shall hamstring their horses and burn their chariots with fire.”
translation:
  language: hi
  text: और यहोवा ने यहोशू से कहा, “उनसे मत डर, क्योंकि कल लगभग इसी समय[a] मैं उन सबको इस्राएल के सामने मारे हुओं के रूप में सौंप रहा हूँ[b]। तू उनके घोड़ों की पिछली टाँगों की नसें काट देना और उनके रथों को आग में जला देना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कल इसी समय।”
    reason: כָּעֵת הַזֹּאת का अर्थ ‘लगभग इसी समय’ अथवा अधिक निश्चित रूप में ‘इसी समय’ हो सकता है।
  - marker: b
    text: शाब्दिक रूप से, “मैं उन सबको इस्राएल के सामने मारे हुए सौंप रहा हूँ”; अर्थात् उन्हें इस्राएल के सामने मार गिराए जाने के लिए सौंपना।
    reason: इब्रानी की कृदन्तीय और स्थानिक अभिव्यक्ति हिन्दी में असामान्य है; टिप्पणी उसका शाब्दिक रूप और प्रसंगगत आशय बताती है।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के विशिष्ट वाचा-नाम का प्रचलित लिप्यंतरण; इसे सामान्य उपाधि से नहीं बदला गया।
- source_word: אַל תִּירָא מִפְּנֵיהֶם
  choice: उनसे मत डर
  rationale: भय के कारण को व्यक्त करने वाले इब्रानी मुहावरे का सहज और सीधा आधुनिक हिन्दी रूप।
- source_word: מָחָר כָּעֵת הַזֹּאת
  choice: कल लगभग इसी समय
  rationale: כָּעֵת में निहित अनुमानात्मकता को बनाए रखता है; ‘इसी समय’ अगले दिन के तुल्य समय को स्पष्ट करता है।
- source_word: אָנֹכִי נֹתֵן
  choice: मैं ... सौंप दूँगा
  rationale: वर्तमान कृदन्त की आसन्न और निश्चित प्रतिज्ञा को प्रसंगानुकूल हिन्दी भविष्यकाल में व्यक्त किया गया है।
- source_word: אֶת כֻּלָּם חֲלָלִים לִפְנֵי יִשְׂרָאֵל
  choice: उन सबको इस्राएल के सामने मारे हुओं के रूप में सौंप दूँगा
  rationale: חֲלָלִים के युद्ध में मारे जाने के भाव और לִפְנֵי के स्थानिक मुहावरे—दोनों को यथासंभव सुरक्षित रखा गया है।
- source_word: תְּעַקֵּר
  choice: पैर की नसें काट देना
  rationale: घोड़ों को युद्ध के अयोग्य बनाने हेतु उनकी टाँगों की नसें काटने की विशिष्ट क्रिया को सामान्य पाठक के लिए स्पष्ट किया गया है।
- source_word: מַרְכְּבֹתֵיהֶם
  choice: उनके रथों
  rationale: प्राचीन सैन्य वाहनों के लिए मानक हिन्दी शब्द।
- source_word: תִּשְׂרֹף בָּאֵשׁ
  choice: आग में जला देना
  rationale: इब्रानी में व्यक्त ‘आग’ को बनाए रखते हुए स्वाभाविक हिन्दी वाक्यांश अपनाया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में आए विशिष्ट ईश्वरीय नाम को उपाधि में बदलने के बजाय हिन्दी का परिचित नामरूप रखा गया है; यह किसी विशेष सम्प्रदायगत व्याख्या को नहीं जोड़ता।
- issue: परमेश्वर द्वारा शत्रुओं को मारे हुओं के रूप में सौंपना
  choice: मैं उन सबको ... मारे हुओं के रूप में सौंप दूँगा
  alternative: मैं उन सबको इस्राएल के हाथों मरवा दूँगा
  rationale: मूल की तीखी और कुछ असामान्य संरचना को बनाए रखा गया है, पर इस्राएल की क्रिया को मूल से अधिक प्रत्यक्ष रूप से परमेश्वर पर आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। एकवचन संबोधन के अनुरूप ‘मत डर’ और ‘तू’ का प्रयोग हुआ है। युद्ध-संबंधी कठोरता को नरम नहीं किया गया, जबकि तकनीकी क्रिया को समझने योग्य बनाया गया है।
