base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/012.yaml
  text: Joshua captured all the cities of these kings[a], and all their kings, and he struck them down with the edge of the sword. He devoted them to destruction, just as Moses the servant of Yahweh had commanded.
translation:
  language: hi
  text: यहोशू ने इन राजाओं के सभी नगरों पर अधिकार कर लिया और उनके सभी राजाओं को पकड़ लिया। उसने उन राजाओं को तलवार की धार से मार डाला और उन्हें विनाश के लिए समर्पित कर दिया[a], ठीक वैसे ही जैसे याहवे के सेवक मूसा ने आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उन्हें पूरी तरह नष्ट कर दिया।” इब्रानी में यहाँ एक तकनीकी क्रिया है, जिसका अर्थ लोगों या वस्तुओं को हेरम—अर्थात अपरिवर्तनीय रूप से विनाश के लिए समर्पित—करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמְּלָכִים הָאֵלֶּה
  choice: इन राजाओं के सभी नगरों
  rationale: इब्रानी रचना का सीधा संबंध ‘इन राजाओं’ और उनके नगरों के बीच है; यह ‘राजकीय नगर’ जैसा अतिरिक्त अर्थ नहीं जोड़ती।
- source_word: לָכַד
  choice: पकड़ लिया
  rationale: सैन्य विजय के प्रसंग में यह नगरों और राजाओं को अपने अधिकार में लेने का स्वाभाविक और स्पष्ट आधुनिक हिन्दी रूप है।
- source_word: וַיַּכֵּם לְפִי חֶרֶב
  choice: उन्हें तलवार की धार से मार डाला
  rationale: נכה का अर्थ व्यापक हो सकता है, पर ‘तलवार की धार से’ के साथ यहाँ घातक प्रहार स्पष्ट है; यह रूप इब्रानी मुहावरे की ठोस छवि भी बनाए रखता है।
- source_word: הֶחֱרִים
  choice: उसने उन्हें विनाश के लिए अर्पित कर दिया
  rationale: यह חרם का तकनीकी प्रयोग है, जिसमें किसी व्यक्ति या वस्तु को अपरिवर्तनीय रूप से विनाश के लिए समर्पित किया जाता है; केवल ‘नष्ट किया’ कहने से यह विशेष अर्थ खो सकता है।
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ठीक वैसे ही जैसे ... ने आज्ञा दी थी
  rationale: यह पहले दी गई आज्ञा के साथ यहोशू के कार्य की पूर्ण अनुरूपता व्यक्त करता है।
- source_word: עֶבֶד יְהוָה
  choice: यहोवा के सेवक
  rationale: मूसा के सम्मानसूचक और वाचागत पद के लिए ‘सेवक’ प्रसंगानुकूल है और ‘दास’ से उत्पन्न अनावश्यक सामाजिक अर्थों से बचता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है; हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ शीर्षक से उसका भेद बनाए रखता है।
theological_decisions:
- issue: विजय-वर्णन में חרם का अनुवाद
  choice: विनाश के लिए अर्पित कर दिया
  alternative: पूरी तरह नष्ट कर दिया; विनाश के अधीन कर दिया
  rationale: चुना गया रूप धार्मिक-तकनीकी समर्पण और उसके परिणामस्वरूप विनाश, दोनों को व्यक्त करता है; पादटिप्पणी संभावित अधिक सीधा अर्थ स्पष्ट करती है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: यह मूल के व्यक्तिगत नाम को शीर्षक ‘प्रभु’ से प्रतिस्थापित नहीं करता और सामान्य हिन्दी पाठकों के लिए परिचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। हिंसा और חרם की तकनीकी धार्मिक भाषा को नरम किए बिना स्पष्ट रखा गया है।
