base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/003.yaml
  text: the Canaanite in the east and in the west[a], and the Amorite, the Hittite, the Perizzite, and the Jebusite in the hill country, and the Hivite below Hermon in the land of Mizpah.
translation:
  language: hi
  text: पूर्व और पश्चिम[a] में रहने वाले कनानियों को, और पहाड़ी प्रदेश में रहने वाले एमोरियों, हित्तियों, परिज्जियों और यबूसियों को, और हेर्मोन के नीचे मिस्पा प्रदेश में रहने वाले हिव्वियों को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “और समुद्र से” है; यहाँ “समुद्र” संभवतः पश्चिम दिशा का भौगोलिक संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּנַעֲנִי
  choice: कनानियों
  rationale: इब्रानी में निश्चित एकवचन जातिवाचक संज्ञा यहाँ सामूहिक अर्थ में है; स्वाभाविक हिन्दी में बहुवचन पूरे जनसमूह को स्पष्ट करता है।
- source_word: מִמִּזְרָח וּמִיָּם
  choice: पूर्व और पश्चिम में
  rationale: पहला पद दिशा/क्षेत्र बताता है और 'समुद्र' यहाँ भूमध्य सागर की ओर, अर्थात पश्चिम, का भौगोलिक संकेत है।
- source_word: הָאֱמֹרִי וְהַחִתִּי וְהַפְּרִזִּי וְהַיְבוּסִי
  choice: एमोरियों, हित्तियों, परिज्जियों और यबूसियों
  rationale: सभी निश्चित एकवचन जातिवाचक रूप सामूहिक हैं; हिन्दी में बहुवचन अधिक सहज है और सूची का समान रूप बनाए रखता है।
- source_word: בָּהָר
  choice: पहाड़ी प्रदेश में
  rationale: यहोशू में הָר प्रायः मध्यवर्ती ऊँचे पहाड़ी भूभाग को दर्शाता है, केवल किसी एक पर्वत को नहीं।
- source_word: הַחִוִּי
  choice: हिव्वियों
  rationale: एकवचन जातिवाचक संज्ञा का सामूहिक अर्थ स्वाभाविक हिन्दी बहुवचन से व्यक्त किया गया है।
- source_word: תַּחַת חֶרְמוֹן
  choice: हेर्मोन के नीचे
  rationale: תַּחַת यहाँ स्थानगत है और हेर्मोन की निचली ढलानों अथवा उसके नीचे के क्षेत्र को सूचित करता है; मूल की संक्षिप्तता बनाए रखी गई है।
- source_word: בְּאֶרֶץ הַמִּצְפָּה
  choice: मिस्पा प्रदेश में
  rationale: אֶרֶץ यहाँ किसी भूभाग या क्षेत्र को दर्शाता है; 'प्रदेश' आधुनिक हिन्दी में स्वाभाविक है और मिस्पा को स्थान-नाम के रूप में रखता है।
