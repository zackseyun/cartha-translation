- source_word: יָמִים רַבִּים
  choice: बहुत दिनों तक
  rationale: यह इब्रानी पदबंध का निकट और स्वाभाविक हिन्दी रूप है; यह लंबे समय की अवधि को व्यक्त करता है।
- source_word: עָשָׂה ... מִלְחָמָה
  choice: युद्ध करता रहा
  rationale: शाब्दिक अर्थ ‘युद्ध किया’ है, पर अपूर्ण कालिक पहलू और ‘बहुत दिनों तक’ के साथ ‘करता रहा’ दीर्घकाल तक जारी युद्ध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: אֶת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: इन सब राजाओं के विरुद्ध
  rationale: युद्ध के शत्रुतापूर्ण संबंध को स्पष्ट करने के लिए हिन्दी में ‘के विरुद्ध’ स्वाभाविक है।
- source_word: מִלְחָמָה
  choice: युद्ध
  rationale: यहाँ संदर्भ किसी एक लड़ाई के बजाय दीर्घकालीन युद्ध का है, इसलिए ‘युद्ध’ उपयुक्त है।
