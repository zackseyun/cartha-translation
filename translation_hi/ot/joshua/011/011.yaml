  text: וַ֠/יַּכּוּ אֶת כָּל הַ/נֶּ֨פֶשׁ אֲשֶׁר בָּ֤/הּ לְ/פִי חֶ֨רֶב֙ הַֽחֲרֵ֔ם לֹ֥א נוֹתַ֖ר כָּל נְשָׁמָ֑ה וְ/אֶת חָצ֖וֹר שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/011.yaml
  text: They struck down every person who was in it with the edge of the sword[a], devoting them to destruction; not a single breathing thing was left[c][b], and he burned Hazor with fire.
translation:
  language: hi
  text: उन्होंने नगर में रहनेवाले हर व्यक्ति को तलवार की धार से मार डाला और उन्हें विनाश के लिए समर्पित कर दिया[a]। एक भी साँस लेनेवाला प्राणी नहीं बचा[b]। फिर उसने हासोर को आग से जला दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें विनाश के लिए अलग ठहरा दिया।” इब्रानी में חרם की भाषा है, जो विनाश के लिए अलग या समर्पित किए जाने को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “कोई श्वास नहीं बची”; यह मुहावरा बताता है कि कोई जीवित बचनेवाला नहीं रहा।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में पहले बहुवचन है—“उन्होंने मार डाला”—पर यहाँ एकवचन है—“उसने जला दिया”; अंतिम कर्ता संभवतः यहोशू है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: उन्होंने ... मार डाला
  rationale: हिफ़ील क्रिया युद्ध में घात करके मारने का अर्थ देती है; आधुनिक हिन्दी में यह युद्ध-संदर्भ और परिणाम दोनों स्पष्ट करती है।
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: नगर में रहनेवाले हर प्राणी को
  rationale: נֶפֶשׁ यहाँ अमूर्त 'आत्मा' नहीं, बल्कि नगर के जीवित प्राणियों को सूचित करता है। 'हर प्राणी' आगे आनेवाले נְשָׁמָה के व्यापक कथन से भी संगत है।
- source_word: לְפִי חֶרֶב
  choice: तलवार की धार से
  rationale: इब्रानी मुहावरे 'तलवार के मुँह से' का स्वाभाविक और चित्रात्मक हिन्दी समतुल्य।
- source_word: הַחֲרֵם
  choice: विनाश के लिए अर्पित कर दिया
  rationale: חרם का अर्थ केवल सामान्य हत्या नहीं, बल्कि किसी को विनाश हेतु अलग या समर्पित करना है; यह अनुवाद उसी विशिष्ट अर्थ को सुबोध रूप में रखता है।
- source_word: לֹא נוֹתַר כָּל נְשָׁמָה
  choice: कोई भी साँस लेनेवाला जीवित न बचा
  rationale: शाब्दिक 'कोई श्वास न बची' के मुहावरे को जीवित बचे व्यक्ति या प्राणी के अभाव के रूप में व्यक्त करते हुए श्वास-संबंधी बिंब सुरक्षित रखा गया है।
- source_word: חָצוֹר
  choice: हासोर
  rationale: इब्रानी חָצוֹר का देवनागरी लिप्यंतरण।
- source_word: שָׂרַף בָּאֵשׁ
  choice: उसने हासोर को आग से जला दिया
  rationale: एकवचन क्रिया को सुरक्षित रखा गया है और इब्रानी के स्पष्ट 'आग से' पदबंध को भी व्यक्त किया गया है।
theological_decisions:
- issue: विजय-वर्णन में חרם का अनुवाद
  choice: विनाश के लिए अर्पित कर दिया
  alternative: पूरी तरह नष्ट कर दिया; विनाश की आज्ञा के अधीन कर दिया
  rationale: यह चयन वाचा-संबंधी युद्ध की विशिष्ट חרם अवधारणा को सामान्य विनाश में विलीन नहीं करता, पर अत्यधिक तकनीकी भाषा से भी बचता है।
- issue: बहुवचन से एकवचन कर्ता का परिवर्तन
  choice: उन्होंने ... फिर उसने
  alternative: उन्होंने ... फिर उन्होंने
  rationale: मूल पाठ וַיַּכּוּ में बहुवचन और שָׂרַף में एकवचन रखता है। अनुवाद इस परिवर्तन को सुरक्षित रखता है; अंतिम एकवचन का संकेत संभवतः यहोशू की ओर है, पर मुख्य पाठ में इसे स्पष्ट जोड़कर ambiguity को समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। युद्ध की कठोरता को न तो नरम किया गया है, न विस्तार देकर बढ़ाया गया है। 'विनाश के लिए अर्पित' חרם की धार्मिक-न्यायिक छाया रखता है; पद के भीतर कर्ता-परिवर्तन और श्वास का बिंब भी सुरक्षित हैं।
