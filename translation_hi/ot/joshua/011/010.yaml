base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/010.yaml
  text: At that time Joshua turned back and captured Hazor[a], and he struck its king with the sword[c][b], for formerly Hazor was the head of all these kingdoms.
translation:
  language: hi
  text: उस समय यहोशू लौटा[a] और उसने हासोर पर अधिकार कर लिया। उसने उसके राजा को तलवार से मारा[b], क्योंकि पहले हासोर इन सभी राज्यों का प्रधान था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वापस मुड़ा।” इब्रानी क्रिया लौटने या वापस मुड़ने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “तलवार से मारा” इब्रानी का संयत अनुवाद है। प्रसंग में इसका अर्थ संभवतः मार डालना है, पर क्रिया का शाब्दिक अर्थ “मारना” या “प्रहार करना” है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “इन सभी राज्यों का सिर” है; यह प्रधानता का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौटकर ... आया
  rationale: שׁוב यहाँ अभियान के दौरान वापस मुड़ने या लौटने को दर्शाता है। हिंदी में ‘लौटकर आया’ स्वाभाविक है और इस दिशात्मक भाव को बनाए रखता है।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह मानक कालवाचक अभिव्यक्ति है; ‘उस समय’ इसके अर्थ को बिना अनावश्यक रूप से किसी एक क्षण तक सीमित किए स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַיִּלְכֹּד
  choice: उस पर अधिकार कर लिया
  rationale: לכד किसी नगर को सैन्य रूप से लेने या अपने अधिकार में करने के लिए प्रयुक्त होता है। यह प्रयोग आधुनिक हिंदी में स्पष्ट और प्रसंगानुकूल है।
- source_word: חָצוֹר
  choice: हासोर
  rationale: इब्रानी स्थान-नाम חָצוֹר का देवनागरी लिप्यंतरण।
- source_word: מַלְכָּהּ
  choice: उसके राजा
  rationale: स्त्रीलिंग प्रत्यय नगर हासोर की ओर संकेत करता है; हिंदी में ‘उसके राजा’ स्वाभाविक रूप है।
- source_word: הִכָּה בֶחָרֶב
  choice: तलवार से मारा
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ है। ‘तलवार से मारा’ मृत्यु की संभावित प्रसंगगत परिणति को स्पष्ट रूप से जोड़ने के बजाय इब्रानी की संयत अभिव्यक्ति को सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह हासोर के महत्त्व की व्याख्या करने वाला कारणसूचक उपवाक्य आरंभ करता है।
- source_word: לְפָנִים
  choice: पहले
  rationale: यह पूर्वकालीन स्थिति को दर्शाता है; ‘पहले’ सरल, स्वाभाविक और अर्थानुकूल है।
- source_word: רֹאשׁ
  choice: सिर
  rationale: शाब्दिक रूपक ‘सिर’ को बनाए रखा गया है, जो इन राज्यों के बीच हासोर की प्रधानता बताता है।
- source_word: כָּל הַמַּמְלָכוֹת הָאֵלֶּה
  choice: इन सभी राज्यों
  rationale: यह परिमाण और संकेतवाचकता दोनों को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
