source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/ם יְהוָ֥ה בְּ/יַֽד יִשְׂרָאֵל֮ וַ/יַּכּוּ/ם֒ וַֽ/יִּרְדְּפ֞וּ/ם עַד צִיד֣וֹן רַבָּ֗ה וְ/עַד֙ מִשְׂרְפ֣וֹת מַ֔יִם וְ/עַד בִּקְעַ֥ת מִצְפֶּ֖ה מִזְרָ֑חָ/ה וַ/יַּכֻּ֕/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר לָ/הֶ֖ם שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/008.yaml
  text: And Yahweh gave them into the hand of Israel[a], and they struck them down and pursued them as far as Great Sidon and as far as Misrephoth-maim and as far as the Valley of Mizpeh to the east[b]; and they struck them down until they had left them no survivor.
translation:
  language: hi
  text: और याहवे ने उन्हें इस्राएल के हाथ में कर दिया। इस्राएलियों ने उन्हें मार गिराया और उनका पीछा महान सीदोन तक, मिस्रेपोत-मायिम[a] तक, और पूर्व की ओर मिस्पे की घाटी तक किया। उन्होंने उन्हें मार गिराया, यहाँ तक कि इस्राएल ने उनके लिए कोई जीवित व्यक्ति नहीं छोड़ा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मिस्रेपोत-मायिम” एक स्थान-नाम है; हिब्रू नाम का संभावित अर्थ “जल के दहकते स्थान” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में “छोड़ा” वाली क्रिया एकवचन है। इसका कर्ता सामूहिक रूप में इस्राएल, अथवा उसके प्रतिनिधि यहोशू, समझा जा सकता है; कुछ अनुवाद यहाँ “उन्होंने” करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵם ... בְּיַד יִשְׂרָאֵל
  choice: उन्हें इस्राएल के हाथ में कर दिया
  rationale: सैन्य प्रसंग में נתן ביד किसी को दूसरे के अधिकार में सौंपने का मुहावरा है। हिंदी में ‘हाथ में कर दिया’ स्रोत की छवि और अर्थ दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: וַיַּכּוּם / וַיַּכֻּם
  choice: उन्हें मार गिराया / उन्हें मारते रहे
  rationale: युद्ध के प्रसंग में נכה प्रहार करके परास्त करने, प्रायः मार डालने, का बोध देता है। पुनरावृत्ति को हिंदी प्रवाह के अनुसार रखते हुए उसकी घातक सैन्य शक्ति सुरक्षित रखी गई है।
- source_word: וַיִּרְדְּפוּם
  choice: उनका पीछा किया
  rationale: רדף शत्रु का पीछा करने के लिए सामान्य क्रिया है; यह सीधा और स्वाभाविक हिंदी रूप है।
- source_word: צִידוֹן רַבָּה
  choice: महान सीदोन
  rationale: רבה नगर के नाम को विशेषित करता है; ‘महान सीदोन’ स्रोत की संरचना का स्पष्ट हिंदी रूप है।
- source_word: מִשְׂרְפוֹת מַיִם
  choice: मिस्रपोत-मयिम
  rationale: इसे स्थान-नाम मानकर लिप्यंतरित किया गया है; इसके संभावित शाब्दिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: בִּקְעַת מִצְפֶּה
  choice: मिस्पे की घाटी
  rationale: בקעה चौड़ी घाटी या घाटी-मैदान को सूचित करता है; सामान्य हिंदी पाठक के लिए ‘घाटी’ स्पष्ट है।
- source_word: מִזְרָחָה
  choice: पूर्व की ओर
  rationale: दिशासूचक रूप को स्वाभाविक हिंदी क्रियाविशेषण के रूप में व्यक्त किया गया है।
- source_word: עַד בִּלְתִּי הִשְׁאִיר לָהֶם שָׂרִיד
  choice: जब तक उसने उनमें से किसी को भी जीवित न छोड़ा
  rationale: השאיר का रूप एकवचन है, इसलिए मुख्य पाठ में ‘उसने’ रखा गया है; इसका कर्ता सामूहिक ‘इस्राएल’ या प्रतिनिधि रूप में यहोशू हो सकता है। ‘किसी को भी जीवित न छोड़ा’ שריד का सहज हिंदी अर्थ देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। हिंदी बाइबलीय प्रयोग में पहचाने जाने वाले ‘यहोवा’ को रखा गया है, न कि उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित किया गया।
- issue: अंतिम उपवाक्य में एकवचन कर्ता
  choice: उसने
  alternative: उन्होंने
  rationale: हिब्रू השאיר व्याकरणतः एकवचन है, यद्यपि संदर्भ में सामूहिक इस्राएल या उसके प्रतिनिधि सेनानायक का आशय संभव है। मुख्य पाठ रूपगत एकवचन बचाता है और पादटिप्पणी सामूहिक अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘इस्राएलियों’ को दूसरे वाक्य में स्पष्ट किया गया है ताकि हिंदी में बहुवचन क्रियाओं का कर्ता सहज समझ आए। स्थान-नाम देवनागरी में लिप्यंतरित हैं और मूल की कर्ता-संबंधी अस्पष्टता पादटिप्पणी सहित सुरक्षित रखी गई है।
