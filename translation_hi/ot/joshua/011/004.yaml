  text: They came out[a], they and all their camps with them, a great people, as numerous as the sand that is on the seashore[b], with very many horses and chariots.
translation:
  language: hi
  text: वे अपनी सारी छावनियों[a] के साथ निकल पड़े—एक विशाल जनसमूह, जो समुद्र के किनारे की रेत के समान असंख्य था—और उनके साथ बहुत बड़ी संख्या में घोड़े और रथ थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी सारी सेनाओं’; इब्रानी शब्द का अर्थ सैन्य छावनियाँ और, विस्तार से, उनमें एकत्र सेनाएँ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: निकल पड़े
  rationale: क्रिया יצא बाहर की ओर जाने को व्यक्त करती है; प्रसंग में बहुवचन सेना के आगे बढ़ने के लिए ‘निकल पड़े’ स्वाभाविक है, बिना ‘कूच किया’ जैसी अतिरिक्त सैन्य छाया जोड़े।
- source_word: מַחֲנֵיהֶם
  choice: अपनी सारी छावनियों
  rationale: מַחֲנֶה का अर्थ छावनी, पड़ाव या वहाँ एकत्र सैन्य दल हो सकता है। ‘छावनियाँ’ मूल बिंब बनाए रखता है, जबकि संदर्भ सैन्य अर्थ स्पष्ट करता है।
- source_word: עַם רָב
  choice: एक विशाल जनसमूह
  rationale: शाब्दिक रूप से ‘बहुत बड़ा/बहुसंख्यक जन’ है। यहाँ आकार नहीं, संख्या प्रमुख है; ‘विशाल जनसमूह’ आधुनिक हिन्दी में सामूहिक और संख्यात्मक अर्थ दोनों व्यक्त करता है।
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: समुद्र के किनारे की रेत के समान अनगिनत
  rationale: रेत की उपमा और לָרֹב का बहुतायत-सूचक बल दोनों सुरक्षित हैं। ‘अनगिनत’ हिन्दी में तुलना का आशय स्पष्ट करता है।
- source_word: סוּס
  choice: घोड़े
  rationale: इब्रानी एकवचन सामूहिक अर्थ में है; हिन्दी में बहुवचन स्वाभाविक है।
- source_word: רֶכֶב
  choice: रथ
  rationale: רֶכֶב यहाँ रथों अथवा रथ-दल को दर्शाता है। ‘रथ’ स्पष्ट, संक्षिप्त और प्रसंगानुकूल है।
- source_word: רַב מְאֹד
  choice: बहुत ही बड़ी संख्या में
  rationale: यह घोड़ों और रथों की अत्यधिक संख्या पर बल देता है; चुना हुआ वाक्यांश आधुनिक हिन्दी में इस तीव्रता को सहज रूप से व्यक्त करता है।
