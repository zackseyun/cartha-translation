base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/016.yaml
  text: 'So Joshua took all this land: the hill country[a], all the Negev, all the land of Goshen, the lowland, the Arabah, the hill country of Israel[c][b], and its lowland.'
translation:
  language: hi
  text: 'यहोशू ने यह सारा भूभाग ले लिया: पहाड़ी प्रदेश, सारा नेगेव, गोशेन का सारा प्रदेश[a], निचला प्रदेश[b], अराबा[c], इस्राएल का पहाड़ी प्रदेश और उसका निचला प्रदेश।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘गोशेन का प्रदेश’ कनान के एक क्षेत्र को सूचित करता है; इसे मिस्र के गोशेन से आवश्यकतः नहीं पहचानना चाहिए।
    reason: cultural_note
  - marker: b
    text: इब्रानी शब्द ‘शफेला’ उस नीची पहाड़ियों वाले क्षेत्र का नाम है जो केंद्रीय पहाड़ी प्रदेश और तटीय मैदान के बीच स्थित है। इसे ‘शफेला’ भी लिखा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘अराबा’ एक क्षेत्रीय भौगोलिक नाम है; संदर्भ के अनुसार इसे ‘यरदन घाटी’ या ‘मरुस्थलीय मैदान’ भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: अपने अधिकार में कर लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर विजय-सारांश के इस प्रसंग में भूमि पर सैन्य अधिकार प्राप्त करना अभिप्रेत है। यह अभिव्यक्ति संदर्भ को स्वाभाविक हिंदी में स्पष्ट करती है, बिना आगे आने वाली सूची को बदलने के।
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: यह सारा देश
  rationale: אֶרֶץ यहाँ अनेक भौगोलिक क्षेत्रों को समेटने वाला भूभाग है। ‘देश’ आधुनिक हिंदी में स्वाभाविक है और הַזֹּאת के संकेतार्थ को ‘यह’ से बनाए रखता है।
- source_word: הָהָר
  choice: पहाड़ी प्रदेश
  rationale: यहोशू में הָהָר प्रायः अलग-अलग पहाड़ों के बजाय ऊँचे पहाड़ी भूभाग का क्षेत्रीय नाम है।
- source_word: הַנֶּגֶב
  choice: नेगेव
  rationale: यहाँ נֶגֶב भौगोलिक क्षेत्र के नाम के रूप में आया है; इसलिए सामान्य ‘दक्षिण’ के बजाय नाम का लिप्यंतरण उचित है।
- source_word: אֶרֶץ הַגֹּשֶׁן
  choice: गोशेन का प्रदेश
  rationale: यह रचना गोशेन से संबद्ध भूभाग बताती है। ‘प्रदेश’ सूची के क्षेत्रीय संदर्भ में स्वाभाविक है और मिस्र के गोशेन के साथ स्वतः पहचान नहीं कराता।
- source_word: הַשְּׁפֵלָה
  choice: निचला प्रदेश
  rationale: שְׁפֵלָה केंद्रीय पहाड़ी क्षेत्र और तटीय मैदान के बीच के नीची पहाड़ियों वाले विशिष्ट भूभाग को दर्शाता है। मुख्य पाठ में अर्थ-सुलभ अनुवाद रखा गया है और क्षेत्रीय सूक्ष्मता पादटिप्पणी में दी गई है।
- source_word: הָעֲרָבָה
  choice: अराबा
  rationale: עֲרָבָה एक क्षेत्रीय भौगोलिक पद है। लिप्यंतरण उसके स्थान-नाम वाले स्वरूप और संभावित व्यापकता को ‘यरदन घाटी’ जैसे अधिक संकुचित अर्थ की अपेक्षा बेहतर बनाए रखता है।
- source_word: הַר יִשְׂרָאֵל
  choice: इस्राएल का पहाड़ी प्रदेश
  rationale: הַר का यहाँ क्षेत्रीय अर्थ है; संबंधवाचक रचना को सीधे और स्वाभाविक ढंग से प्रस्तुत किया गया है।
- source_word: וּשְׁפֵלָתוֹ
  choice: और उसका निचला प्रदेश
  rationale: पुल्लिंग एकवचन प्रत्यय का सबसे स्वाभाविक पूर्वपद ‘इस्राएल का पहाड़ी प्रदेश’ है। ‘उसका’ मूल पाठ की सर्वनाम-संबंधी कड़ी और ऊँचे-नीचे भूभाग का विरोध बनाए रखता है।
