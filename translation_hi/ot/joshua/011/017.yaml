- source_word: תַּחַת הַר חֶרְמוֹן
  choice: हर्मोन पर्वत के नीचे
  rationale: भौगोलिक संबंध में תַּחַת किसी स्थलचिह्न से नीचे स्थित क्षेत्र बताता है; यह मूल की संक्षिप्तता बनाए रखता है।
- source_word: וְאֵת כָּל מַלְכֵיהֶם לָכַד
  choice: उसने उनके सभी राजाओं को पकड़ लिया
  rationale: हिंदी वाक्यक्रम के अनुसार कर्ता स्पष्ट करते हुए ‘सभी’ की समग्रता और לָכַד का बंदी बनाने का भाव सुरक्षित रखा गया है।
- source_word: וַיַּכֵּם
  choice: उन्हें मार गिराया
  rationale: נכה के हिंसक प्रहार का अर्थ बना रहता है और इसे अगले स्पष्ट मृत्यु-वाचक क्रिया से अलग रखा गया है।
- source_word: וַיְמִיתֵם
  choice: उनका वध कर दिया
  rationale: हिफ़ील रूप मृत्यु का कारण बनने को स्पष्ट करता है; ‘वध कर दिया’ गंभीर और निर्णायक अर्थ देता है, पर पिछली क्रिया में विलीन नहीं होता।
