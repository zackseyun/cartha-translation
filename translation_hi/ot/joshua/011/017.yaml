  text: from Mount Halak[a], which rises toward Seir, as far as Baal-gad in the Valley of Lebanon below Mount Hermon[b]. And he captured all their kings and struck them down and put them to death.
translation:
  language: hi
  text: सेईर की ओर उठने वाले हालाक पर्वत[a] से लेकर हर्मोन पर्वत के नीचे लबानोन की घाटी[b] में स्थित बाल-गाद तक। उसने उनके सभी राजाओं को पकड़ लिया, उन पर प्रहार किया और उन्हें मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चिकना पर्वत।’ इब्रानी पद को वर्णन के रूप में समझा जा सकता है, पर यहाँ संभवतः यह ‘हालाक पर्वत’ नामक स्थान को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘लबानोन के मैदान।’ इब्रानी शब्द चौड़ी घाटी या मैदान को दर्शा सकता है।
    reason: lexical_alternative
