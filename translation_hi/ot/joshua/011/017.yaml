  choice: से लेकर … तक
  rationale: विजित भूभाग की सीमा को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: בַּעַל גָּד
  choice: बाल-गाद
  rationale: यहाँ भौगोलिक नाम होने के कारण इसका अनुवाद न करके लिप्यंतरण किया गया है।
