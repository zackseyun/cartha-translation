id: JOS.11.14
reference: Joshua 11:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ֠/כֹל שְׁלַ֞ל הֶ/עָרִ֤ים הָ/אֵ֨לֶּה֙ וְ/הַ/בְּהֵמָ֔ה בָּזְז֥וּ לָ/הֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֣ק אֶֽת כָּל הָ/אָדָ֞ם הִכּ֣וּ לְ/פִי חֶ֗רֶב עַד הִשְׁמִדָ/ם֙ אוֹתָ֔/ם לֹ֥א הִשְׁאִ֖ירוּ כָּל נְשָׁמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/014.yaml
  text: And all the spoil of these cities[a], along with the livestock, the sons of Israel plundered for themselves; only all the people they struck with the edge of the sword until they had destroyed them[d][c][b]. They left no breathing thing.
translation:
  language: hi
  text: इन नगरों की सारी लूट और पशुधन इस्राएलियों ने अपने लिए लूट के रूप में ले लिया; पर सभी मनुष्यों को उन्होंने तलवार की धार से मार डाला, यहाँ तक कि उनका नाश कर दिया। उन्होंने किसी को भी साँस लेता हुआ न छोड़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלַל
  choice: लूट
  rationale: युद्ध में छीनी गई संपत्ति के लिए स्वाभाविक और स्पष्ट हिन्दी शब्द।
- source_word: הֶעָרִים הָאֵלֶּה
  choice: इन नगरों
  rationale: निर्देशक उन नगरों की ओर संकेत करता है जिनका अभी वर्णन हुआ है।
- source_word: הַבְּהֵמָה
  choice: पशुधन
  rationale: संदर्भ में संपत्ति के रूप में लिए गए पालतू पशु अभिप्रेत हैं।
- source_word: בָּזְזוּ לָהֶם
  choice: अपने लिए लूट लिया
  rationale: क्रिया लूटने और לָהֶם अपने लाभ के लिए लेने—दोनों भावों को व्यक्त करती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप 'इस्राएल के पुत्र' है, पर यहाँ यह पूरे जातीय समुदाय का प्रचलित पदनाम है; आधुनिक हिन्दी में 'इस्राएली' अधिक स्वाभाविक और समावेशी है।
- source_word: כָּל הָאָדָם
  choice: सभी मनुष्यों
  rationale: यहाँ सामूहिक אָדָם पशुधन के विपरीत नगरों की मानव आबादी को सूचित करता है; केवल पुरुषों तक अर्थ सीमित नहीं किया गया।
- source_word: הִכּוּ לְפִי חֶרֶב
  choice: तलवार की धार से ... मारा
  rationale: हिब्रू का शाब्दिक चित्र 'तलवार के मुँह से' है; हिन्दी में 'तलवार की धार से' उसका स्पष्ट मुहावरेदार समतुल्य है।
- source_word: עַד הִשְׁמִדָם אֹתָם
  choice: जब तक उनका नाश न कर दिया
  rationale: שׁמד के हिफ़ील रूप का विनाश करने वाला बल सुरक्षित रहता है, बिना यहाँ अनुपस्थित हेरेम-भाषा जोड़े।
- source_word: לֹא הִשְׁאִירוּ כָּל נְשָׁמָה
  choice: किसी भी प्राणी को साँस लेता न छोड़ा
  rationale: נְשָׁמָה के साँस संबंधी ठोस बिंब को बचाते हुए किसी जीवित बचे व्यक्ति के न रहने का अर्थ व्यक्त करता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यहाँ वाक्यांश वाचा-समुदाय का जातीय पदनाम है। शाब्दिक पारिवारिक रूप सम्भव है, किंतु आधुनिक हिन्दी में अनावश्यक रूप से केवल पुरुषों का संकेत दे सकता है।
- issue: כָּל הָאָדָם में אָדָם का दायरा
  choice: सभी मनुष्यों
  alternative: हर मनुष्य
  rationale: एकवचन सामूहिक संज्ञा यहाँ पशुधन के विपरीत समस्त मानव आबादी के लिए है; इसे 'हर पुरुष' कहना स्त्रियों और बच्चों को अनुचित रूप से बाहर कर सकता है।
- issue: לֹא הִשְׁאִירוּ כָּל נְשָׁמָה का बिंब
  choice: किसी भी प्राणी को साँस लेता न छोड़ा
  alternative: किसी को जीवित न छोड़ा
  rationale: मूल का साँस लेने वाला ठोस बिंब रखा गया है, जबकि हिन्दी वाक्य स्वाभाविक बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर ऐतिहासिक-वर्णनात्मक शैली। 'नगर', 'पशुधन', 'नाश' जैसे व्यापक रूप से समझे जाने वाले शब्द चुने गए हैं। मूल के कठोर हिंसात्मक कथन को न नरम किया गया है, न उससे आगे बढ़ाया गया है।
