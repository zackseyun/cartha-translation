revisions:
- from: इन नगरों की सारी लूट और पशुधन इस्राएलियों ने अपने लिए लूट लिया; पर सभी मनुष्यों को उन्होंने तलवार की धार से तब तक मारा, जब तक उनका नाश न कर दिया। उन्होंने किसी भी प्राणी को साँस लेता न छोड़ा।
  to: इन नगरों की सारी लूट और पशुधन इस्राएलियों ने अपने लिए लूट के रूप में ले लिया; पर सभी मनुष्यों को उन्होंने तलवार की धार से मार डाला, यहाँ तक कि उनका नाश कर दिया। उन्होंने किसी को भी साँस लेता हुआ न छोड़ा।
