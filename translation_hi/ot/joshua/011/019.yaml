language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא הָיְתָ֣ה עִ֗יר אֲשֶׁ֤ר הִשְׁלִ֨ימָה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל בִּלְתִּ֥י הַ/חִוִּ֖י יֹשְׁבֵ֣י גִבְע֑וֹן אֶת הַ/כֹּ֖ל לָקְח֥וּ בַ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/019.yaml
  text: There was not a city that made peace with the sons of Israel[a], except the Hivites living in Gibeon[b]; they took all of them in battle.
translation:
  language: hi
  text: कोई भी नगर ऐसा नहीं था जिसने इस्राएलियों के साथ शांति की हो—सिवाय गिबोन में रहने वाले हिव्वियों के। इस्राएलियों ने उन सबको युद्ध में जीत लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁלִימָה אֶל
  choice: के साथ शान्ति की
  rationale: हिफ़ील रूप यहाँ शान्तिपूर्ण सम्बन्ध या संधि स्थापित करने का अर्थ देता है। यह स्वाभाविक हिन्दी है और ‘आत्मसमर्पण किया’ जैसी अधिक विशिष्ट व्याख्या से बचता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर आधुनिक हिन्दी में यहाँ पूरे जातीय समुदाय के लिए ‘इस्राएली’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: בִּלְתִּי
  choice: सिवाय
  rationale: पूर्ववर्ती निषेध के एकमात्र अपवाद को स्पष्ट रूप से व्यक्त करता है।
- source_word: הַחִוִּי יֹשְׁבֵי גִבְעוֹן
  choice: गिबोन में रहने वाले हिव्वियों
  rationale: प्रतिभागी रूप יֹשְׁבֵי का वर्तमान निवास-सूचक भाव सहज आधुनिक हिन्दी में सुरक्षित रहता है।
- source_word: אֶת הַכֹּל
  choice: बाकी सबको
  rationale: सन्दर्भ में गिबोनियों को छोड़कर सभी नगरों अथवा लोगों की समष्टि अभिप्रेत है। ‘बाकी’ अपवाद के बाद हिन्दी में सम्बन्ध स्पष्ट करता है, यद्यपि यह शब्द हिब्रू में प्रत्यक्ष नहीं है।
- source_word: לָקְחוּ בַמִּלְחָמָה
  choice: युद्ध में जीत लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर नगरों को युद्ध में लेने के प्रसंग में ‘जीत लेना’ स्वाभाविक हिन्दी सैन्य प्रयोग है और ‘नष्ट कर दिया’ जैसा अर्थ नहीं जोड़ता।
theological_decisions:
- issue: इस्राएल के साथ शान्ति करने की प्रकृति
  choice: शान्ति की
  alternative: आत्मसमर्पण किया
  rationale: मूल क्रिया शान्तिपूर्ण सम्बन्ध स्थापित करने को व्यक्त करती है; यह आवश्यक रूप से पूर्ण आत्मसमर्पण का तकनीकी अर्थ नहीं देती।
- issue: अन्तिम उपवाक्य में ‘उन्होंने’ का कर्ता
  choice: इस्राएलियों को कर्ता माना गया
  alternative: यहोशू की सेना को अधिक स्पष्ट रूप से कर्ता बताना
  rationale: हिब्रू में बहुवचन कर्ता निहित है और निकट प्रसंग में इस्राएली अभिप्रेत हैं; अनावश्यक विशिष्टीकरण नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमामय किन्तु सहज कथात्मक शैली। ‘शान्ति की’ संधि-संबन्धी अर्थ को सरल भाषा में रखता है, और ‘युद्ध में जीत लिया’ सैन्य प्रसंग में לָקַח का स्वाभाविक समतुल्य है।
