source:
  edition: WLC
  text: כִּ֣י מֵ/אֵ֣ת יְהוָ֣ה הָיְתָ֡ה לְ/חַזֵּ֣ק אֶת לִבָּ/ם֩ לִ/קְרַ֨את הַ/מִּלְחָמָ֤ה אֶת יִשְׂרָאֵל֙ לְמַ֣עַן הַֽחֲרִימָ֔/ם לְ/בִלְתִּ֥י הֱיוֹת לָ/הֶ֖ם תְּחִנָּ֑ה כִּ֚י לְמַ֣עַן הַשְׁמִידָ֔/ם כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/020.yaml
  text: For it was from Yahweh to harden their hearts to meet Israel in battle[a], so that he might devote them to destruction, so that there would be no mercy for them, but so that he might destroy them[c][b], just as Yahweh had commanded Moses.
translation:
  language: hi
  text: क्योंकि यह यहोवा ही की ओर से हुआ कि उसने उनके हृदय कठोर कर दिए[a], ताकि वे युद्ध में इस्राएल का सामना करें और वह उन्हें विनाश के लिए समर्पित कर दे[b]; उनके लिए दया की कोई विनती न हो[c], बल्कि वह उन्हें नष्ट कर दे—ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उनके हृदय दृढ़ कर दिए।” यहाँ भाव यह है कि यहोवा ने उन्हें विरोध में अटल, अर्थात कठोर कर दिया।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यह न्याय के लिए किसी को प्रतिबंध के अधीन करके विनाश को समर्पित करने का तकनीकी पद है; इसका अनुवाद “पूरी तरह नष्ट कर दे” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “उन्हें कोई दया न मिले।” इब्रानी वाक्यांश संक्षिप्त है और उनके लिए किसी विनती या दया दिए जाने—दोनों की अनुपस्थिति का संकेत दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֵת יְהוָה
  choice: यह यहोवा ही की ओर से हुआ
  rationale: यह स्रोत और प्रत्यक्ष दैवी कर्तृत्व दोनों व्यक्त करता है। परमेश्वर के व्यक्तिगत नाम को 'यहोवा' रखा गया है।
- source_word: לְחַזֵּק אֶת לִבָּם
  choice: उसने उनके हृदय कठोर कर दिए
  rationale: חזק का मूल भाव 'दृढ़ करना' है, पर इस प्रसंग में विरोध में हठी और अटल कर देने का आशय है; 'हृदय कठोर कर दिए' स्वाभाविक हिंदी में इस प्रसंगगत बल को व्यक्त करता है।
- source_word: לִקְרַאת הַמִּלְחָמָה אֶת יִשְׂרָאֵל
  choice: वे युद्ध में इस्राएल का सामना करें
  rationale: यह युद्ध के लिए शत्रुतापूर्वक सामने आने का भाव स्पष्ट और सहज हिंदी में रखता है।
- source_word: לְמַעַן הַחֲרִימָם
  choice: वह उन्हें विनाश के लिए समर्पित कर दे
  rationale: חרם के तकनीकी भाव—न्याय के अधीन पूर्ण विनाश के लिए अलग या समर्पित करना—को केवल सामान्य 'नष्ट करना' में समतल नहीं किया गया।
- source_word: לְבִלְתִּי הֱיוֹת לָהֶם תְּחִנָּה
  choice: उनके लिए दया की कोई विनती न हो
  rationale: תְּחִנָּה में विनती, अनुग्रह की याचना या दया की गुहार का भाव है। यह अनुवाद संक्षिप्त इब्रानी वाक्यांश की अस्पष्टता बनाए रखता है कि विनती कौन करता।
- source_word: לְמַעַן הַשְׁמִידָם
  choice: बल्कि वह उन्हें नष्ट कर दे
  rationale: שמד के प्रबल विनाशार्थ को स्पष्ट आधुनिक हिंदी में व्यक्त करता है और पिछले חרם पद के तकनीकी भाव से भेद भी रखता है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी
  rationale: पूर्व में दी गई आज्ञा के साथ अनुरूपता और कथा का कालक्रम दोनों स्पष्ट होते हैं।
theological_decisions:
- issue: कनानी राजाओं के हृदय कठोर किए जाने में दैवी कर्तृत्व
  choice: यह यहोवा ही की ओर से हुआ कि उसने उनके हृदय कठोर कर दिए
  alternative: यहोवा ने उनके हृदय कठोर होने दिए
  rationale: इब्रानी पाठ कर्तृत्व को सीधे यहोवा से जोड़ता है। इसे केवल अनुमति के रूप में कहना पाठ में उपस्थित दैवी प्रभुता और मानवीय विरोध के तनाव को अनुचित रूप से हल्का कर देता।
- issue: חרם की न्याय-संबंधी तकनीकी भाषा
  choice: विनाश के लिए समर्पित कर दे
  alternative: पूरी तरह नष्ट कर दे
  rationale: मुख्य पाठ में समर्पण और न्यायाधीन विनाश दोनों का भाव बचाया गया है; पादटिप्पणी अन्य संभव अभिव्यक्तियाँ बताती है।
- issue: תְּחִנָּה में दया अथवा विनती की अस्पष्टता
  choice: दया की कोई विनती न हो
  alternative: उन्हें कोई दया न मिले
  rationale: मूल संज्ञा विनती या अनुग्रह की याचना का संकेत देती है, जबकि संक्षिप्त संरचना परिणामस्वरूप दया न मिलने का भाव भी दे सकती है। मुख्य पाठ शाब्दिक अस्पष्टता के अधिक निकट रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सुबोध रूप। 'हृदय कठोर कर दिए' परिचित बाइबलीय मुहावरा है; 'विनाश के लिए समर्पित' तकनीकी חרם भाषा को बचाता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में संबंधित पदों के तुरंत बाद दिए गए हैं।
