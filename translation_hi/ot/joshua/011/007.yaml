  text: So Joshua[a], and all the people of war with him, came against them suddenly at the waters of Merom and fell upon them.
translation:
  language: hi
  text: तब यहोशू और उसके साथ के सभी योद्धा[a] अचानक मेरोम के जल के पास उनके विरुद्ध आ पहुँचे और उन पर टूट पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘युद्ध के लोग’; परंपरागत अनुवाद ‘युद्ध करनेवाले पुरुष’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आ पहुँचे
  rationale: בוא का अर्थ प्रसंगानुसार ‘आना’ या ‘जाना’ हो सकता है। यहाँ शत्रु के विरुद्ध सैन्य गति और गंतव्य तक पहुँचने—दोनों को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘आ पहुँचे’ चुना गया है।
- source_word: עַם הַמִּלְחָמָה
  choice: सभी योद्धा[a]
  rationale: शाब्दिक अर्थ ‘युद्ध के लोग’ है। ‘योद्धा’ आधुनिक हिन्दी में इस सामूहिक सैन्य अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है तथा मूल सामूहिक संज्ञा में निहित न होने वाली पुरुष-विशिष्टता नहीं जोड़ता। शाब्दिक विकल्प फुटनोट में सुरक्षित है।
- source_word: עִמּוֹ
  choice: उसके साथ के
  rationale: यह साथ और सहभागिता का सीधा अर्थ व्यक्त करता है और हिन्दी वाक्य में ‘योद्धा’ के साथ सहज संबंध बनाता है।
- source_word: עֲלֵיהֶם
  choice: उनके विरुद्ध
  rationale: शत्रुतापूर्ण सैन्य गति के प्रसंग में עַל का अर्थ ‘विरुद्ध’ उपयुक्त है।
- source_word: עַל מֵי מֵרוֹם
  choice: मेरोम के जल के पास
  rationale: מֵי מֵרוֹם स्थानसूचक पद है। ‘जल के पास’ मूल के बहुवचन/सामूहिक जल-संदर्भ को बनाए रखता है और उसे निश्चित रूप से झील या जलाशय नहीं ठहराता।
- source_word: פִּתְאֹם
  choice: अचानक
  rationale: यह आक्रमण की आकस्मिकता और अप्रत्याशितता को सीधे व्यक्त करता है।
- source_word: וַיִּפְּלוּ בָּהֶם
  choice: उन पर टूट पड़े
  rationale: נפל ב का यहाँ मुहावरेदार सैन्य अर्थ आक्रमण करना है। ‘टूट पड़े’ मूल की सजीव और तीव्र छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְ
  choice: तब
  rationale: आरंभिक वाव कथा की अगली क्रमिक घटना को जोड़ता है; आधुनिक हिन्दी कथाशैली में ‘तब’ इस अनुक्रम को सहज रूप से व्यक्त करता है।
