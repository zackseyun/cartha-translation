  text: וְֽ/אֶל הַ/מְּלָכִ֞ים אֲשֶׁ֣ר מִ/צְּפ֗וֹן בָּ/הָ֧ר וּ/בָ/עֲרָבָ֛ה נֶ֥גֶב כִּֽנֲר֖וֹת וּ/בַ/שְּׁפֵלָ֑ה וּ/בְ/נָפ֥וֹת דּ֖וֹר מִ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/002.yaml
  text: and to the kings who were in the north[a], in the hill country, in the Arabah south of Kinneroth, in the lowland[b], and in the heights of Dor toward the west.
translation:
  language: hi
  text: और उन राजाओं के पास भी जो उत्तर में—पहाड़ी प्रदेश में, किन्नरोत के दक्षिण की अराबा में, निचले प्रदेश में और पश्चिम की ओर दोर के ऊँचे प्रदेशों[a] में—थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘दोर के जिलों में,’ ‘दोर के क्षेत्र में,’ या ‘दोर की ढलानों पर’ भी हो सकता है। इब्रानी शब्द दुर्लभ है और उसका सटीक स्थलाकृतिक अर्थ विवादित है।
    reason: lexical_alternative
  - marker: b
    text: यह वाक्य पिछले पद से आगे जारी है।
    reason: discourse_clarity
lexical_decisions:
- source_word: וְאֶל הַמְּלָכִים
  choice: और उन राजाओं के पास भी
  rationale: וְאֶל पिछले पद में आरम्भ हुई बुलावे के प्राप्तकर्ताओं की सूची को आगे बढ़ाता है। हिन्दी में ‘भी’ इस निरंतरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר מִצְּפוֹן
  choice: जो उत्तर में … थे
  rationale: यह संबंधवाचक उपवाक्य राजाओं का भौगोलिक स्थान बताता है; ‘उत्तर में’ हिन्दी में स्वाभाविक है और आगे आने वाले स्थानों को भी इसी उपवाक्य में समेटता है।
- source_word: בָּהָר
  choice: पहाड़ी प्रदेश में
  rationale: הָר यहाँ किसी एक पहाड़ के बजाय भौगोलिक पहाड़ी क्षेत्र को सूचित करता है।
- source_word: וּבָעֲרָבָה
  choice: अराबा में
  rationale: עֲרָבָה यहाँ विशिष्ट भौगोलिक क्षेत्र का नाम है; केवल ‘मैदान’ कहने से उसका क्षेत्रीय संकेत खो सकता है।
- source_word: נֶגֶב כִּנֲרוֹת
  choice: किन्नरोत के दक्षिण की
  rationale: נֶגֶב यहाँ उत्तरी स्थान किन्नरोत के संबंध में दिशासूचक है, न कि दक्षिणी नेगेव प्रदेश का नाम।
- source_word: וּבַשְּׁפֵלָה
  choice: निचले प्रदेश में
  rationale: שְׁפֵלָה निचले भूभाग अथवा तलहटी के क्षेत्र को दर्शाता है; यह सामान्य पाठक के लिए पारदर्शी अनुवाद है।
- source_word: וּבְנָפוֹת דּוֹר
  choice: दोर के ऊँचे प्रदेशों में
  rationale: נָפוֹת दुर्लभ और स्थलाकृतिक अर्थ की दृष्टि से विवादित शब्द है। ‘ऊँचे प्रदेश’ एक प्रचलित प्रासंगिक समझ को व्यक्त करता है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: מִיָּם
  choice: पश्चिम की ओर
  rationale: יָם का शाब्दिक अर्थ ‘समुद्र’ है, पर इब्रानी भौगोलिक प्रयोग में भूमध्य सागर की दिशा होने के कारण यह प्रायः ‘पश्चिम’ का संकेत देता है।
