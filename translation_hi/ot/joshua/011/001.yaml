  text: When Jabin king of Hazor heard of it[a], he sent to Jobab king of Madon, and to the king of Shimron[c][b], and to the king of Achshaph.
translation:
  language: hi
  text: जब हासोर के राजा याबीन ने यह समाचार सुना,[a] तो उसने मादोन के राजा योबाब, शिमरोन के राजा[b] और अकशाप के राजा के पास संदेश भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “और ऐसा हुआ, जब हासोर के राजा याबीन ने सुना।” इब्रानी में यह एक कथात्मक सूत्र है; “यह समाचार” पिछले प्रसंग से निहित है।'
    reason: lexical_alternative
  - marker: b
    text: कुछ लोग यहाँ के “शिमरोन” की पहचान यहोशू 12:20 में आए “शिमरोन-मेरोन” से करते हैं।
