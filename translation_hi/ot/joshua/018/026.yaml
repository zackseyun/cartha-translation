- source_word: הַמִּצְפֶּה
  choice: हम्मिस्पे
  rationale: यह स्थान-नाम है, इसलिए इसका अर्थ ‘चौकी’ या ‘पहरे की जगह’ करने के बजाय लिप्यंतरण किया गया है। आरम्भिक निश्चित उपपद הַ को नाम के साथ ‘ह’ के रूप में रखा गया और מ के द्वित्व को दर्शाया गया है।
- source_word: הַכְּפִירָה
  choice: हक्कपीरा
  rationale: स्थान-नाम होने के कारण लिप्यंतरण किया गया है। आरम्भिक הַ को नाम का अंग मानकर रखा गया और כּ के द्वित्व को ‘क्क’ से दर्शाया गया है।
- source_word: הַמֹּצָה
  choice: हम्मोसा
  rationale: स्थान-नाम होने के कारण लिप्यंतरण किया गया है। आरम्भिक הַ को नाम के साथ रखा गया और מ के द्वित्व को दर्शाया गया है; हिब्रू צ को प्रचलित बाइबलीय हिन्दी नाम-रूप के अनुरूप ‘स’ से व्यक्त किया गया है।
