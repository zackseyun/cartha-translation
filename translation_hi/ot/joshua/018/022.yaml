  choice: बेत-अराबा
  rationale: यह नगर-सूची में आया स्थान-नाम है, इसलिए इसके घटकों का अर्थानुवाद करने के बजाय हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
