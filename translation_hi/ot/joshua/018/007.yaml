source:
  edition: WLC
  text: כִּ֠י אֵֽין חֵ֤לֶק לַ/לְוִיִּם֙ בְּ/קִרְבְּ/כֶ֔ם כִּֽי כְהֻנַּ֥ת יְהוָ֖ה נַחֲלָת֑/וֹ וְ/גָ֡ד וּ/רְאוּבֵ֡ן וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה לָקְח֣וּ נַחֲלָתָ֗/ם מֵ/עֵ֤בֶר לַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/007.yaml
  text: For there is no portion for the Levites among you[a], because the priesthood of Yahweh is their inheritance. And Gad, Reuben, and the half-tribe of Manasseh have received their inheritance beyond the Jordan eastward, which Moses the servant of Yahweh gave them.
translation:
  language: hi
  text: क्योंकि तुम्हारे बीच लेवियों के लिए कोई भाग नहीं है; याहवे की याजकाई ही उनकी विरासत[a] है। गाद, रूबेन और मनश्शे के आधे गोत्र ने यरदन के पार पूर्व की ओर अपनी विरासत पा ली है, जिसे याहवे के सेवक मूसा ने उन्हें दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसकी विरासत’ है; एकवचन संभवतः लेवी अथवा लेवियों को सामूहिक रूप से सूचित करता है।
    reason: मूल के व्याकरणिक एकवचन और संदर्भगत सामूहिक अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: חֵלֶק
  choice: भाग
  rationale: भूमि-विभाजन के प्रसंग में यह किसी को मिलने वाले हिस्से को दर्शाता है। ‘भाग’ स्वाभाविक हिन्दी है और आगे आए נַחֲלָה (‘विरासत’) से शब्दगत भेद बनाए रखता है।
- source_word: לַלְוִיִּם
  choice: लेवियों
  rationale: यह लेवी गोत्र के लोगों के लिए प्रचलित और सहज हिन्दी रूप है।
- source_word: בְּקִרְבְּכֶם
  choice: तुम्हारे बीच
  rationale: मूल के ‘तुम्हारे मध्य में’ वाले भाव को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְהֻנַּת יְהוָה
  choice: याहवे की याजकाई
  rationale: כְהֻנָּה याजकीय पद, कार्य और सेवा की संस्था को सूचित करता है; ‘याजकाई’ इस व्यापक अर्थ को संक्षेप में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: נַחֲלָתוֹ
  choice: उनकी विरासत
  rationale: इब्रानी प्रत्यय व्याकरणतः एकवचन पुल्लिंग है, पर निकटवर्ती संदर्भ में लेवी/लेवियों को सामूहिक इकाई के रूप में सूचित करता है। हिन्दी बहुवचन ‘उनकी’ इस सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक एकवचन को पादटिप्पणी में रखा गया है।
- source_word: לָקְחוּ
  choice: पा ली है
  rationale: क्रिया का मूल अर्थ ‘ले लिया’ है, किंतु वैध रूप से बाँटी गई भूमि के संदर्भ में ‘पा ली है’ अधिग्रहण या बलपूर्वक कब्ज़े का अनचाहा भाव टालता है।
- source_word: נַחֲלָתָם
  choice: अपनी विरासत
  rationale: यह वंशानुगत भूमि-अंश को दर्शाता है; हिन्दी में कर्ता की ओर लौटता ‘अपनी’ वाक्य को स्वाभाविक बनाता है।
- source_word: מֵעֵבֶר לַיַּרְדֵּן מִזְרָחָה
  choice: यरदन के पार पूर्व की ओर
  rationale: भौगोलिक अभिव्यक्ति के दोनों घटक—‘यरदन के पार’ और पूर्व दिशा—स्पष्ट रूप से सुरक्षित रखे गए हैं।
- source_word: עֶבֶד יְהוָה
  choice: याहवे के सेवक
  rationale: मूसा के सम्मानसूचक वाचा-संबंधी पद के लिए ‘सेवक’ स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: נַחֲלָתוֹ में सामूहिक एकवचन
  choice: उनकी विरासत
  alternative: उसकी विरासत
  rationale: व्याकरणिक प्रत्यय एकवचन है, किंतु आशय लेवी अथवा लेवियों की सामूहिक विरासत है। मुख्य पाठ में सहज सामूहिक अर्थ दिया गया है और वास्तविक रूपगत तनाव पादटिप्पणी में बताया गया है।
- issue: כְהֻנַּת יְהוָה का आशय
  choice: याहवे की याजकाई
  alternative: याहवे की याजकीय सेवा
  rationale: ‘याजकाई’ पद और सेवा दोनों को समेट सकती है तथा मूल की संक्षिप्त संस्थागत अभिव्यक्ति को बिना किसी विशिष्ट सांप्रदायिक व्याख्या के बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली रखी गई है। भूमि-विभाजन की पारिभाषिक भिन्नता के लिए חֵלֶק को ‘भाग’ और נַחֲלָה को ‘विरासत’ कहा गया है।
