base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/008.yaml
  text: So the men arose and went[a], and Joshua commanded those who were going to write down the land, saying, “Go and walk through the land, and write it down, and return to me; and here I will cast lots for you before Yahweh in Shiloh.”
translation:
  language: hi
  text: तब वे पुरुष उठे और चले गए। यहोशू ने उन पुरुषों को, जो भूमि का विवरण लिखने जा रहे थे[a], आज्ञा दी, “जाओ, भूमि में घूमो-फिरो, उसका विवरण लिखो, और मेरे पास लौट आओ। और यहीं, शीलो में, याहवे के सामने मैं तुम्हारे लिए चिट्ठी डालूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भूमि को लिखने”; आशय बँटवारे के लिए भूमि का लिखित सर्वेक्षण या विवरण तैयार करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ הָאֲנָשִׁים וַיֵּלֵכוּ
  choice: वे पुरुष उठकर चले गए
  rationale: यह क्रम आरंभिक क्रिया और प्रस्थान दोनों को सहज हिन्दी कथा-शैली में व्यक्त करता है; הָאֲנָשִׁים का पुरुषवाचक अर्थ भी सुरक्षित रहता है।
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: צוה अधिकारपूर्वक निर्देश देने को दर्शाता है; यहोशू की नेतृत्वकारी भूमिका के संदर्भ में ‘आज्ञा दी’ उपयुक्त है।
- source_word: לִכְתֹּב אֶת הָאָרֶץ
  choice: भूमि का लिखित विवरण तैयार करने
  rationale: इब्रानी में शाब्दिक रूप से ‘भूमि को लिखना’ है। प्रसंग में आशय बँटवारे के लिए भूमि का लिखित सर्वेक्षण या विवरण तैयार करना है; हिन्दी में यह अनुवाद अर्थ स्पष्ट करता है और पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: וְהִתְהַלְּכוּ בָאָרֶץ
  choice: देश में घूमो
  rationale: हित्पएल रूप देश में इधर-उधर जाकर उसका अवलोकन करने का भाव देता है; ‘घूमो’ सर्वेक्षण-संबंधी भ्रमण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְכִתְבוּ אוֹתָהּ
  choice: उसका विवरण लिखो
  rationale: स्त्रीलिंग सर्वनाम भूमि/देश की ओर लौटता है। केवल ‘उसे लिखो’ हिन्दी में अस्वाभाविक है, इसलिए संदर्भगत कर्म ‘विवरण’ स्पष्ट किया गया है।
- source_word: וּפֹה אַשְׁלִיךְ לָכֶם גּוֹרָל
  choice: फिर मैं यहीं ... तुम्हारे लिए चिट्ठी डालूँगा
  rationale: ‘यहीं’ वक्ता के वर्तमान स्थान पर बल देता है। גורל एकवचन है और भूमि-विभाजन के लिए चिट्ठी डालने की प्रथा को सूचित करता है; हिन्दी का ‘चिट्ठी डालना’ इसका प्रचलित और स्पष्ट समतुल्य है।
- source_word: בְּשִׁלֹה
  choice: शीलो में
  rationale: स्थान-नाम का मानक हिन्दी लिप्यंतरण अपनाया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना हिन्दी में लिप्यंतरित करता है।
- issue: הָאֲנָשִׁים का लिंग-सटीक निरूपण
  choice: पुरुष
  alternative: लोग
  rationale: यहाँ शब्द उन विशिष्ट पुरुष प्रतिनिधियों के लिए प्रयुक्त हुआ है जिन्हें भूमि का विवरण तैयार करने भेजा गया था; इसलिए लिंग-निरपेक्ष ‘लोग’ नहीं चुना गया।
- issue: गोरल डालने की क्रिया और परमेश्वर की उपस्थिति
  choice: याहवे के सामने ... चिट्ठी डालूँगा
  alternative: याहवे की ओर से भाग बाँटूँगा
  rationale: अनुवाद मूल की विधि और ‘सामने’ की भाषा बनाए रखता है तथा यह नहीं समझाता कि चिट्ठी का परिणाम किस प्रकार दैवी इच्छा से संबंधित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। संवाद में सीधे आज्ञार्थक रूप हैं। ‘लिखित विवरण तैयार करना’ प्रसंग को समझने योग्य बनाता है, जबकि पादटिप्पणी मूल इब्रानी की असामान्य शाब्दिक अभिव्यक्ति सुरक्षित रखती है।
