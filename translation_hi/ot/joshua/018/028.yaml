  text: Zela[a], Haeleph, the Jebusite (that is, Jerusalem), Gibeath, Kiriath—fourteen cities with their villages[c][b]. This was the inheritance of the sons of Benjamin according to their clans.
translation:
  language: hi
  text: और सेला[a], हाएलेफ़[b], यबूसी—अर्थात् यरूशलेम—गिबअत[b] और किर्यत[c]; कुल चौदह नगर और उनके गाँव। यह बिन्यामीन के वंशजों की, उनके कुलों के अनुसार, विरासत थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान-नाम का रूप ‘सेला’ या ‘सेलह’ भी लिखा जाता है।
    reason: lexical_alternative
  - marker: b
    text: कुछ अनुवाद ‘हाएलेफ़’ को ‘एलेफ़’ और ‘गिबअत’ को ‘गिबआ’ लिखते हैं।
    reason: alternative_reading
  - marker: c
    text: इस पद के हिब्रू पाठ में ‘किर्यत’ लिखा है, ‘किर्यत-यारीम’ नहीं।
    reason: textual_variant
