translation:
  language: hi
  text: तुम देश का विवरण सात भागों में लिखकर यहाँ मेरे पास ले आओ। तब मैं यहाँ हमारे परमेश्वर यहोवा के सामने तुम्हारे लिए चिट्ठी डालूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּכְתְּבוּ אֶת־הָאָרֶץ
  choice: देश का विवरण ... लिखकर
  rationale: शाब्दिक रूप से ‘देश को लिखना’ भूमि का लिखित सर्वेक्षण या विवरण तैयार करने का संकेत देता है; स्वाभाविक हिन्दी में आशय स्पष्ट रखा गया है।
- source_word: שִׁבְעָה חֲלָקִים
  choice: सात भागों में
  rationale: मूल पाठ के विभाजन की संख्या और संरचना को सीधे व्यक्त करता है।
- source_word: וְיָרִיתִי ... גּוֹרָל
  choice: चिट्ठी डालूँगा
  rationale: भूमि-विभाजन के लिए पवित्र चिट्ठी डालने की प्राचीन प्रथा को प्रचलित हिन्दी बाइबलीय पदबंध से व्यक्त किया गया है; एकवचन ‘चिट्ठी’ मूल גּוֹרָל के अनुरूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से प्रतिस्थापित करने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
theological_decisions:
- issue: चिट्ठी डालने में यहोवा की उपस्थिति
  choice: हमारे परमेश्वर यहोवा के सामने
  alternative: हमारे परमेश्वर यहोवा की उपस्थिति में
  rationale: לִפְנֵי का सीधा और स्वाभाविक अनुवाद रखा गया है; यह निर्णय की धार्मिक गंभीरता दिखाता है, पर परिणाम के तंत्र के बारे में अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
