  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज। बहुवचन संबोधन ‘तुम’ रखा गया है। वाक्य को हिन्दी में स्वाभाविक प्रवाह के लिए दो वाक्यों में बाँटा गया है।
