  text: Then the border went down to the end of the mountain that faces the Valley of Ben-hinnom[a], which is at the northern end of the Valley of Rephaim. Then it went down the Valley of Hinnom to the southern slope of the Jebusite[c][b], and went down to En-rogel.
translation:
  language: hi
  text: तब सीमा उस पहाड़ के छोर तक नीचे उतरी, जो बेन-हिन्नोम की घाटी[a] के सामने है और रपाईम की घाटी के उत्तरी छोर पर है। फिर वह हिन्नोम की घाटी से होती हुई यबूसी की दक्षिणी ढलान[b] तक नीचे उतरी और एन-रोगेल[c] तक नीचे उतरी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘हिन्नोम के पुत्र की घाटी’ है; यहाँ ‘बेन-हिन्नोम’ को स्थान-नाम मानकर लिखा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘यबूसी के दक्षिणी कंधे/बगल तक’; स्थलाकृतिक संदर्भ में इसका अर्थ दक्षिणी ढलान या किनारा है। ‘यबूसी’ संभवतः यबूसी बस्ती, अर्थात यरूशलेम, को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: एन-रोगेल एक स्थान-नाम है; इसका शाब्दिक अर्थ ‘रोगेल का सोता’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: तब सीमा ... नीचे उतरी
  rationale: ירד का स्थलाकृतिक अर्थ ‘नीचे उतरना’ है और גְּבוּל यहाँ प्रादेशिक सीमा-रेखा को दर्शाता है। हिंदी में स्त्रीलिंग ‘सीमा’ के साथ यह स्वाभाविक है।
- source_word: קְצֵה הָהָר
  choice: पहाड़ के छोर
  rationale: קָצֶה किसी वस्तु के अंतिम भाग या छोर को बताता है; הָר के लिए ‘पहाड़’ स्रोत के निकट और सामान्य हिंदी है।
- source_word: אֲשֶׁר עַל־פְּנֵי גֵּי בֶן־הִנֹּם
  choice: जो बेन-हिन्नोम की घाटी के सामने है
  rationale: עַל־פְּנֵי का स्थानवाचक भाव यहाँ ‘के सामने’ है। बेन-हिन्नोम को स्थान-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: אֲשֶׁר בְּעֵמֶק רְפָאִים צָפוֹנָה
  choice: और रपाईम की घाटी के उत्तरी छोर पर है
  rationale: צָפוֹנָה उत्तर की दिशा सूचित करता है। प्रसंग में यह पहाड़ के स्थान को रपाईम की घाटी के उत्तर की ओर बताता है; ‘उत्तरी छोर’ सहज भौगोलिक अभिव्यक्ति है।
- source_word: וְיָרַד גֵּי הִנֹּם
  choice: फिर वह हिन्नोम की घाटी से होती हुई ... नीचे उतरी
  rationale: सीमा ही वाक्य का निरंतर कर्ता है। हिंदी में ‘घाटी से होती हुई’ मार्ग को स्पष्ट करता है और ירד की ढलानगत गति को ‘नीचे उतरी’ सुरक्षित रखता है।
- source_word: אֶל־כֶּתֶף הַיְבוּסִי נֶגְבָּה
  choice: यबूसी की दक्षिणी ढलान तक
  rationale: כֶּתֶף का मूल अर्थ ‘कंधा’ है, पर स्थलाकृति में यह पहाड़ी की बगल या ढलान को दर्शाता है। הַיְבוּסִי में ‘नगर’ नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: עֵין רֹגֵל
  choice: एन-रोगेल
  rationale: यह स्थान-नाम है, इसलिए अर्थानुवाद के बजाय हिंदी लिप्यंतरण किया गया है।
