    reason: lexical_alternative
lexical_decisions:
- source_word: כְפַר העמני
  choice: कफ़र-हाअम्मोनी
  rationale: यह स्थान-नाम है, इसलिए अर्थानुवाद करने के बजाय हिब्रू रूप का देवनागरी लिप्यंतरण किया गया है। नाम के घटकों को स्पष्ट रखने के लिए योजक-चिह्न रखा गया है।
- source_word: הָעָפְנִי
  choice: ओफ़नी
  rationale: नगर-सूची में प्रयुक्त स्थान-नाम का स्वाभाविक हिन्दी लिप्यंतरण; आरंभिक उपपद को अलग शब्द के रूप में नहीं रखा गया।
- source_word: גָבַע
  choice: गेबा
  rationale: संदर्भ में यह स्थान-नाम है, इसलिए इसके सामान्य अर्थ ‘पहाड़ी’ का अनुवाद नहीं किया गया।
- source_word: עָרִים
  choice: नगर
  rationale: भू-भाग के नगरों की औपचारिक सूची में עָרִים के लिए ‘नगर’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: बारह
  rationale: नगरों की संख्या बताने वाली मूल संख्या का सीधा अनुवाद।
- source_word: חַצְרֵיהֶן
  choice: उनके गाँव
  rationale: इससे इन नगरों से जुड़े आश्रित ग्रामीण या छोटे बसे हुए स्थान अभिप्रेत हैं; ‘गाँव’ सहज हिन्दी है और सूची के सूत्र को ठीक से व्यक्त करता है।
