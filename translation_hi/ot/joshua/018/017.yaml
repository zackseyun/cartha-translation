source:
  edition: WLC
  text: וְ/תָאַ֣ר מִ/צָּפ֗וֹן וְ/יָצָא֙ עֵ֣ין שֶׁ֔מֶשׁ וְ/יָצָא֙ אֶל גְּלִיל֔וֹת אֲשֶׁר נֹ֖כַח מַעֲלֵ֣ה אֲדֻמִּ֑ים וְ/יָרַ֕ד אֶ֥בֶן בֹּ֖הַן בֶּן רְאוּבֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/017.yaml
  text: Then it curved northward and went out to En-shemesh[a], and went out to Geliloth, which is opposite the Ascent of Adummim[c][b], and it went down to the stone of Bohan son of Reuben.
translation:
  language: hi
  text: फिर सीमा उत्तर की ओर मुड़ी और एन-शेमेश[a] तक गई। वहाँ से वह गलीलोत[b] तक गई, जो अदुम्मीम की चढ़ाई[c] के सामने है; फिर वह रूबेन के पुत्र बोहन के पत्थर तक नीचे उतरी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एन-शेमेश का अर्थ ‘सूर्य का सोता’ है; मुख्य पाठ में स्थान-नाम का लिप्यंतरण किया गया है।
    reason: lexical_alternative
  - marker: b
    text: गलीलोत का अर्थ ‘घेरे’ या ‘प्रदेश’ भी समझा जा सकता है; यहाँ इसे स्थान-नाम माना गया है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘अदुम्मीम का दर्रा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר מִצָּפוֹן
  choice: फिर सीमा उत्तर की ओर मुड़ी
  rationale: सीमा-वर्णन में תאר रेखा के मुड़ने या उसका मार्ग अंकित होने को व्यक्त करता है। गति-प्रधान संदर्भ में מִצָּפוֹן को दिशासूचक ‘उत्तर की ओर’ समझना स्वाभाविक है। स्पष्टता के लिए निहित कर्ता ‘सीमा’ जोड़ा गया है।
- source_word: וְיָצָא
  choice: तक गई / वहाँ से वह ... तक गई
  rationale: सीमा-वर्णन के इस सूत्र में क्रिया सीमा के आगे बढ़कर किसी स्थान तक पहुँचने को बताती है। हिंदी में ‘तक गई’ मूल गति और गंतव्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֵין שֶׁמֶשׁ
  choice: एन-शेमेश
  rationale: यह स्थान-नाम है, इसलिए अर्थानुवाद करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: גְּלִילוֹת
  choice: गलीलोत
  rationale: यद्यपि शब्द का सामान्य अर्थ ‘घेरे’ या ‘प्रदेश’ हो सकता है, यहाँ यह स्थान-नाम के रूप में प्रयुक्त है।
- source_word: נֹכַח
  choice: के सामने
  rationale: यह स्पष्ट स्थानिक संबंध बताता है और ‘विपरीत दिशा में/सामने’ की मूल अर्थ-सीमा को बनाए रखता है।
- source_word: מַעֲלֵה אֲדֻמִּים
  choice: अदुम्मीम की चढ़ाई
  rationale: מַעֲלֵה ऊँचाई की ओर जाने वाले मार्ग या चढ़ाई को दर्शाता है; अदुम्मीम स्थान-नाम के रूप में लिप्यंतरित है।
- source_word: וְיָרַד
  choice: नीचे उतरी
  rationale: यह भूभाग में नीचे की ओर सीमा की गति को दर्शाता है और हिंदी में सहज सीमा-वर्णन है।
- source_word: אֶבֶן בֹּהַן בֶּן רְאוּבֵן
  choice: रूबेन के पुत्र बोहन के पत्थर
  rationale: समास-श्रृंखला को ऐसे स्थल-चिह्न के रूप में रखा गया है जिसका नाम रूबेन के पुत्र बोहन से जुड़ा है।
