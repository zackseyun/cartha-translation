source:
  edition: WLC
  text: וַ/יַּ֗עַל גּוֹרַ֛ל מַטֵּ֥ה בְנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יֵּצֵא֙ גְּב֣וּל גּֽוֹרָלָ֔/ם בֵּ֚ין בְּנֵ֣י יְהוּדָ֔ה וּ/בֵ֖ין בְּנֵ֥י יוֹסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/011.yaml
  text: And the lot for the tribe of the sons of Benjamin[a], by their clans, came up[b], and the territory of their lot came out between the sons of Judah and the sons of Joseph.
translation:
  language: hi
  text: तब बिन्यामीन के वंशजों के गोत्र के लिए, उनके कुलों के अनुसार, चिट्ठी निकली; और उनके चिट्ठे की सीमा यहूदा के वंशजों और यूसुफ़ के वंशजों[a] के बीच निकली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यूसुफ़ के वंशज” से सामूहिक रूप से यूसुफ़ से निकले गोत्र, विशेषकर एप्रैम और मनश्शे, अभिप्रेत हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל גּוֹרָל
  choice: चिट्ठा ... निकला
  rationale: עלה का मूल बिंब ‘ऊपर आना/निकलना’ है; चिट्ठा डालकर भूमि बाँटने के प्रसंग में ‘चिट्ठा निकला’ स्वाभाविक हिन्दी है और चयन की प्रक्रिया को बनाए रखता है।
- source_word: מַטֵּה בְנֵי בִנְיָמִן
  choice: बिन्यामीन के वंशजों का गोत्र
  rationale: מַטֶּה यहाँ जनजातीय इकाई है। ‘गोत्र’ बाइबलीय इस्राएली संदर्भ में प्रचलित है, जबकि בְנֵי को शाब्दिक ‘पुत्र’ के बजाय व्यापक वंशगत अर्थ में ‘वंशज’ कहा गया है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחוֹת गोत्र के भीतर की वंश-आधारित सामाजिक इकाइयाँ हैं; ‘कुल’ आधुनिक हिन्दी में इस स्तर को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: גְּבוּל גּוֹרָלָם
  choice: चिट्ठे में मिला उनका क्षेत्र
  rationale: גְּבוּל का अर्थ सीमा भी हो सकता है, पर भूमि-विभाजन के इस प्रसंग में यह उस सीमा से निर्धारित भूभाग के लिए प्रयुक्त है। हिन्दी में ‘क्षेत्र ... बीच में था’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֵּין ... וּבֵין
  choice: के बीच में
  rationale: दो पड़ोसी जनजातीय क्षेत्रों के बीच बिन्यामीन के आवंटित क्षेत्र की स्थिति को सीधे व्यक्त करता है।
- source_word: בְנֵי יְהוּדָה / בְנֵי יוֹסֵף
  choice: यहूदा के वंशज / यूसुफ़ के वंशज
  rationale: בְנֵי की वंशगत सामूहिकता सुरक्षित रहती है; ‘वंशज’ आधुनिक पाठक को ‘पुत्रों’ की अपेक्षा अभिप्रेत जनसमूह अधिक स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘चिट्ठा निकलना’ भूमि-विभाजन की प्राचीन प्रक्रिया का ठोस बिंब बनाए रखता है; ‘क्षेत्र’ גְּבוּל के प्रसंगगत भूभाग-सूचक प्रयोग को व्यक्त करता है।
