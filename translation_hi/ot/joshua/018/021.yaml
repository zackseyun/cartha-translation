base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/021.yaml
  text: And the cities belonging to the tribe of the sons of Benjamin[a], according to their clans, were Jericho, Beth-hoglah, and Emek-keziz.
translation:
  language: hi
  text: 'और बिन्यामीनियों के गोत्र के नगर, उनके कुलों के अनुसार, ये थे: यरीहो, बेत-होगला और एमेक-कसीस[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “कसीस की घाटी,” यदि इसे एक संयुक्त स्थान-नाम के बजाय वर्णनात्मक नाम समझा जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ הֶעָרִים
  choice: और ... नगर ... ये थे
  rationale: संयोजक וְ और היה के पूर्ण रूप से नगरों की सूची आरम्भ होती है। हिंदी में ‘और ... ये थे’ क्रम और सूची दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְמַטֵּה בְּנֵי בִנְיָמִן
  choice: बिन्यामीनियों के गोत्र के
  rationale: לְ यहाँ आवंटन अथवा संबंध दिखाता है। ‘बिन्यामीनियों’ से בני בנימין का सामुदायिक अर्थ आधुनिक हिंदी में सहज रहता है, जबकि ‘गोत्र’ מַטֶּה की जनजातीय इकाई को व्यक्त करता है।
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: उनके कुलों के अनुसार
  rationale: भूमि-विभाजन के संदर्भ में מִשְׁפָּחָה गोत्र के भीतर की वंशगत इकाई है; ‘कुल’ सामान्य आधुनिक हिंदी में इस अर्थ को संक्षेप और स्पष्टता से देता है।
- source_word: יְרִיחוֹ
  choice: यरीहो
  rationale: इस प्रसिद्ध स्थान-नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: בֵית חָגְלָה
  choice: बेत-होगला
  rationale: स्थान-नाम को अनूदित करने के बजाय उसके इब्रानी रूप के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: עֵמֶק קְצִיץ
  choice: एमेक-कसीस
  rationale: संदर्भ में पूरा पद एक स्थान-नाम हो सकता है, इसलिए इसे लिप्यंतरित किया गया है; साथ ही עֵמֶק के सामान्य अर्थ पर आधारित वैकल्पिक समझ पाद-टिप्पणी में सुरक्षित है।
