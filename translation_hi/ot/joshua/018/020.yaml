  yaml_path: translation/ot/joshua/018/020.yaml
  text: And the Jordan formed its border on the east side[a]. This was the inheritance of the sons of Benjamin, according to its borders all around[b], by their clans.
translation:
  language: hi
  text: और यरदन उसकी पूर्वी ओर की सीमा था। यह बिन्यामीन के वंशजों का विरासत में मिला भूभाग था, जिसकी चारों ओर की सीमाओं के अनुसार, उनके कुलों के अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיַּרְדֵּן
  choice: और यरदन
  rationale: नदी का प्रचलित व्यक्तिवाचक नाम; संदर्भ में ‘नदी’ जोड़ना आवश्यक नहीं है।
- source_word: יִגְבֹּל אֹתוֹ
  choice: ने ... उसकी सीमा बनाई
  rationale: भौगोलिक संदर्भ में גבל का अर्थ किसी भूभाग की सीमा बनना या निर्धारित करना है; कर्मवाचक प्रत्यय बिन्यामीन के भूभाग की ओर संकेत करता है।
- source_word: לִפְאַת קֵדְמָה
  choice: पूर्वी ओर
  rationale: פאה भूभाग की ओर/किनारे और קֵדְמָה पूर्व दिशा को व्यक्त करता है।
- source_word: נַחֲלַת
  choice: मीरास का भाग
  rationale: नחלה यहाँ गोत्र को मिले पैतृक भूमि-आवंटन को दर्शाता है; ‘मीरास का भाग’ इस कानूनी और वाचा-संबंधी भाव को सहज हिंदी में रखता है।
- source_word: בְּנֵי בִנְיָמִן
  choice: बिन्यामीन के वंशजों
  rationale: शाब्दिक ‘बिन्यामीन के पुत्र’ एक गोत्रीय पदनाम है; आधुनिक हिंदी में ‘वंशज’ अभिप्रेत सामूहिक अर्थ को स्पष्ट करता है।
- source_word: לִגְבוּלֹתֶיהָ סָבִיב
  choice: चारों ओर की अपनी सीमाओं के अनुसार
  rationale: स्त्रीलिंग प्रत्यय मीरास/भूमि की ओर संकेत करता है और סָבִיב उसके पूरे परिमाप को बताता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחוֹת गोत्र के भीतर के कुल-समूहों को दर्शाता है; ‘कुल’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
