  text: From there the border passed to Luz[a], to the southern slope of Luz (that is, Bethel), and the border went down to Atroth-addar[c][b], on the mountain that is south of Lower Beth-horon.
translation:
  language: hi
  text: वहाँ से सीमा लूज़[a] की ओर बढ़ी और लूज़ के दक्षिणी ढलान[b] तक पहुँची—वह बेतेल है। फिर सीमा नीचे उतरकर अत्रोत-अद्दार[c] तक पहुँची, उस पहाड़ पर जो निचले बेत-होरोन के दक्षिण में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ लूज़ की पहचान बेतेल के रूप में की गई है।
    reason: cross_reference
  - marker: b
    text: या, “दक्षिण में लूज़ के पार्श्व तक”; इब्रानी में शरीर के अंग “कंधे” का शब्द पहाड़ी के किनारे या ढलान के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: c
    text: इस स्थान-नाम का लिप्यंतरण “अतारोत-अद्दार” भी किया जाता है।
    reason: lexical_alternative
