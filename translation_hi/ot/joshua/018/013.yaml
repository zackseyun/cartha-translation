- source_word: הִיא בֵּית אֵל
  choice: यह बेतेल है
  rationale: मूल की संक्षिप्त पहचान को सीधे रखा गया है; इससे लूज़ और बेतेल का संबंध स्पष्ट रहता है।
- source_word: וְיָרַד
  choice: नीचे उतरकर
  rationale: सीमा की स्थलाकृतिक नीचे की गति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עַטְרוֹת אַדָּר
  choice: अत्रोत-अद्दार
  rationale: इब्रानी स्थान-नाम का निकट देवनागरी लिप्यंतरण है; यौगिक नाम को योजक-चिह्न से रखा गया है।
- source_word: עַל הָהָר
  choice: पहाड़ पर
  rationale: निश्चित एकवचन स्थलाकृतिक संकेत को ठोस रूप में सुरक्षित रखा गया है।
- source_word: אֲשֶׁר מִנֶּגֶב לְבֵית חֹרוֹן תַּחְתּוֹן
  choice: जो निचले बेत-होरोन के दक्षिण में स्थित
  rationale: מִנֶּגֶב स्थान को दक्षिण में बताता है और תַּחְתּוֹן को बेत-होरोन के विशेषक ‘निचले’ के रूप में प्रस्तुत किया गया है।
