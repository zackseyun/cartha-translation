lexical_decisions:
- source_word: הָעַוִּים
  choice: अव्वीम
  rationale: नगरों की इस सूची में इसे जातिवाचक ‘अव्वी लोग’ के बजाय स्थान-नाम माना गया है। ‘अव्वीम’ इब्रानी नाम का देवनागरी लिप्यंतरण है।
- source_word: הַפָּרָה
  choice: पारा
  rationale: बिन्यामीन के भाग में आए इस स्थान-नाम का इब्रानी उच्चारणानुकूल देवनागरी लिप्यंतरण किया गया है; आरंभिक निश्चित उपपद को अलग से अनूदित नहीं किया गया।
- source_word: עָפְרָה
  choice: ओप्रा
  rationale: यहाँ शब्द स्थान-नाम है; ‘ओप्रा’ इब्रानी व्यंजन ע־פ־ר के उच्चारणानुकूल लिप्यंतरण को दर्शाता है और इसे सामान्य संज्ञा के रूप में नहीं अनूदित करता।
- source_word: וְ
  choice: और
  rationale: दोहराया गया संयोजक नगरों की सूची को जोड़ता है; हिंदी में सूची की शुरुआत और अंतिम नाम से पहले ‘और’ रखकर इसे स्वाभाविक रूप से प्रस्तुत किया गया है।
