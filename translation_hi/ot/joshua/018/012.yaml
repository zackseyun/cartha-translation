  text: וַ/יְהִ֨י לָ/הֶ֧ם הַ/גְּב֛וּל לִ/פְאַ֥ת צָפ֖וֹנָ/ה מִן הַ/יַּרְדֵּ֑ן וְ/עָלָ֣ה הַ/גְּבוּל֩ אֶל כֶּ֨תֶף יְרִיח֜וֹ מִ/צָּפ֗וֹן וְ/עָלָ֤ה בָ/הָר֙ יָ֔מָּ/ה ו/היה תֹּֽצְאֹתָ֔י/ו מִדְבַּ֖רָ/ה בֵּ֥ית אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/012.yaml
  text: Their border on the north side was from the Jordan[a], and the border went up to the northern slope of Jericho, then went up into the hill country westward[b], and its end was at the wilderness of Beth-aven.
translation:
  language: hi
  text: उत्तर की ओर उनकी सीमा यरदन से आरम्भ होती थी। वहाँ से सीमा यरीहो के उत्तरी ढलान[a] तक चढ़ती थी, फिर पश्चिम की ओर पहाड़ी प्रदेश में ऊपर जाती थी, और उसका अंत बेत-आवेन के निर्जन प्रदेश में होता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘यरीहो के कंधे पर, उत्तर की ओर’; यहाँ ‘कंधा’ एक भौगोलिक अभिव्यक्ति है, जिसका अर्थ उस ओर का ढलान या बगल है।
    reason: lexical_alternative
  - marker: b
    text: ‘अंत’ के लिए इब्रानी में बहुवचन वाला एक भौगोलिक शब्द है, जिसका अनुवाद ‘अंतिम छोर’ या ‘निकास-बिंदु’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹנָה
  choice: उत्तर की ओर
  rationale: פאה यहाँ क्षेत्र की उत्तरी ओर या उत्तरी भुजा को दर्शाता है। यह हिंदी में सीमा-वर्णन के लिए सहज है।
- source_word: הַגְּבוּל
  choice: सीमा
  rationale: भूमि-विभाजन के इस प्रसंग में גְּבוּל क्षेत्र की सीमारेखा को सूचित करता है; ‘सीमा’ स्वाभाविक और सटीक है।
- source_word: מִן הַיַּרְדֵּן
  choice: यरदन से
  rationale: यह सीमा के आरम्भ-बिंदु को बताता है। ‘यरदन’ में नदी का भाव नाम से ही स्पष्ट है।
- source_word: וְעָלָה
  choice: चढ़ती थी / ऊपर जाती थी
  rationale: עלה स्थलाकृति के अनुसार ऊँचाई की ओर सीमा के बढ़ने को दर्शाता है। दोनों अभिव्यक्तियाँ गति और भू-आकृति को स्वाभाविक हिंदी में बनाए रखती हैं।
- source_word: אֶל כֶּתֶף יְרִיחוֹ מִצָּפוֹן
  choice: यरीहो के उत्तरी ढलान तक
  rationale: כֶּתֶף का मूल अर्थ ‘कंधा’ है, पर भौगोलिक प्रयोग में यह किसी स्थान की बगल या ढलान को दर्शाता है; מִצָּפוֹן उस भूभाग को उत्तर की ओर स्थित बताता है।
- source_word: בָהָר יָמָּה
  choice: पश्चिम की ओर पहाड़ी प्रदेश में
  rationale: הָר यहाँ संभवतः एक अकेले पहाड़ के बजाय पहाड़ी भूभाग को दर्शाता है, और יָמָּה दिशा-सूचक रूप में ‘पश्चिम की ओर’ है।
- source_word: תֹּצְאֹתָיו
  choice: उसका अंत
  rationale: सीमा-वर्णनों में यह शब्द अंतिम छोर या समाप्ति-बिंदु के लिए प्रयुक्त होता है। हिंदी में एकवचन ‘उसका अंत’ सहज है, जबकि इब्रानी बहुवचन की जानकारी पादटिप्पणी में रखी गई है।
- source_word: מִדְבַּרָה בֵּית אָוֶן
  choice: बेत-आवेन के निर्जन प्रदेश में
  rationale: מִדְבָּר निर्जन या मरुस्थलीय भूभाग है। दिशासूचक ה को समाप्ति-वाक्य में स्वाभाविक हिंदी ‘में होता था’ से व्यक्त किया गया है।
