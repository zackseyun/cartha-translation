  text: וַ/יִּוָּֽתְרוּ֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר לֹֽא חָלְק֖וּ אֶת נַֽחֲלָתָ֑/ם שִׁבְעָ֖ה שְׁבָטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/002.yaml
  text: But among the sons of Israel there remained seven tribes that had not apportioned their inheritance[a][b].
translation:
  language: hi
  text: पर इस्राएलियों में सात गोत्र ऐसे रह गए थे जिन्होंने अपनी विरासत का बँटवारा अभी तक नहीं किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּתְרוּ
  choice: रह गए थे
  rationale: निफ़अल रूप शेष रह जाने का भाव देता है; यह हिंदी में स्वाभाविक ढंग से उस समय तक बचे हुए गोत्रों को व्यक्त करता है।
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों में
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्रों में’ है, पर आधुनिक हिंदी में ‘इस्राएलियों में’ अधिक स्वाभाविक और सामुदायिक अर्थ में सटीक है।
- source_word: אֲשֶׁר לֹא חָלְקוּ
  choice: जिनके ... का अब तक बँटवारा नहीं हुआ था
  rationale: חלק भूमि बाँटने या हिस्से निर्धारित करने को दर्शाता है। हिब्रू में गोत्र व्याकरणिक कर्ता हैं, किंतु प्रसंग में आशय यह है कि उनका भाग अभी बाँटा अथवा उन्हें आवंटित नहीं किया गया था; हिंदी का यह कर्मवाच्य उस अर्थ और अंतर्निहित अस्पष्टता को स्वाभाविक रूप से रखता है।
- source_word: אֶת נַחֲלָתָם
  choice: उनके निज भाग
  rationale: נחלה यहाँ भूमि में वंशानुगत रूप से मिलने वाले हिस्से को दर्शाता है। ‘निज भाग’ इस भूमि-वितरण प्रसंग में साधारण पाठक के लिए स्पष्ट है और केवल अमूर्त ‘विरासत’ समझे जाने से बचाता है।
- source_word: שִׁבְעָה שְׁבָטִים
  choice: सात गोत्र
  rationale: इस्राएल की जनजातीय संरचना के लिए ‘गोत्र’ प्रचलित, संक्षिप्त और सटीक हिंदी शब्द है।
theological_decisions:
- issue: भूमि बाँटने में सात गोत्रों की भूमिका
  choice: 'कर्मवाच्य: ‘जिनके निज भाग का अब तक बँटवारा नहीं हुआ था’'
  alternative: ‘जिन्होंने अपने निज भाग का बँटवारा नहीं किया था’
  rationale: हिब्रू का व्याकरण सक्रिय रूप की अनुमति देता है, पर प्रसंग में भूमि का आवंटन सामुदायिक नेतृत्व और चिट्ठी डालने की प्रक्रिया से होता है। कर्मवाच्य बिना अनावश्यक दोषारोपण के दोनों पहलुओं—उनकी भागीदारी और उनका हिस्सा अब तक आवंटित न होना—के बीच का तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल किंतु गरिमापूर्ण शैली। ‘इस्राएलियों’ और ‘गोत्र’ जैसे परिचित बाइबलीय पद रखे गए हैं। ‘अब तक’ स्रोत में निहित अपूर्ण स्थिति को स्पष्ट करता है; कोई पादटिप्पणी आवश्यक नहीं समझी गई।
