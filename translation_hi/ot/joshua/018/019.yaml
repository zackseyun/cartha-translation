base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/019.yaml
  text: Then the border passed to the northern shoulder of Beth-hoglah[a], and the border ended at the northern tongue of the Salt Sea, at the southern end of the Jordan[b]. This is the southern border.
translation:
  language: hi
  text: फिर सीमा बेत-होग्ला के उत्तरी कंधे तक गई, और उसका अंत नमक सागर[b] की उत्तरी जीभ[a] पर, यरदन के दक्षिणी छोर पर हुआ। यह दक्षिणी सीमा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘नमक सागर की जीभ’ है—जीभ के आकार की खाड़ी या जलांतरिका के लिए प्रयुक्त एक भौगोलिक अभिव्यक्ति।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मृत सागर’; इब्रानी पाठ में ‘नमक सागर’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר הַגְּבוּל
  choice: फिर सीमा ... तक गई
  rationale: सीमा-वर्णन में עָבַר सीमा-रेखा के आगे बढ़ने या किसी स्थान तक जाने को दर्शाता है; यह हिंदी में स्वाभाविक और क्रमसूचक है।
- source_word: כֶּתֶף
  choice: कंधे
  rationale: मूल भौगोलिक रूपक ‘कंधा’ सुरक्षित रखा गया है; यहाँ इससे किसी स्थान का पार्श्व या ढलान अभिप्रेत है।
- source_word: בֵּית חָגְלָה
  choice: बेत-होग्ला
  rationale: स्थान-नाम को देवनागरी में लिप्यंतरित किया गया है।
- source_word: תצאותיו הגבול
  choice: उसका अंत ... हुआ
  rationale: सीमा-वर्णन के इस सूत्र में תּוֹצָאוֹת सीमा के अंतिम बिंदु या समाप्ति को बताता है; ‘अंत हुआ’ स्पष्ट आधुनिक हिंदी है।
- source_word: לְשׁוֹן
  choice: जीभ
  rationale: शाब्दिक भौगोलिक बिंब को सुरक्षित रखा गया है; पाद-टिप्पणी स्पष्ट करती है कि इससे जीभ के आकार की खाड़ी या जलांतरिका अभिप्रेत हो सकती है।
- source_word: יָם הַמֶּלַח
  choice: नमक सागर
  rationale: इब्रानी नाम का अर्थ सीधे रखा गया है, उसे प्रचलित आधुनिक नाम ‘मृत सागर’ से प्रतिस्थापित नहीं किया गया।
- source_word: קְצֵה הַיַּרְדֵּן נֶגְבָּה
  choice: यरदन के दक्षिणी छोर
  rationale: קָצֶה अंतिम छोर को और נֶגְבָּה दक्षिणी दिशा को व्यक्त करता है।
- source_word: זֶה גְּבוּל נֶגֶב
  choice: यह दक्षिणी सीमा थी
  rationale: यहाँ נֶגֶב क्षेत्र-नाम नहीं, दक्षिण दिशा का सूचक है; भूतकाल आसपास के वर्णन के अनुरूप है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल इब्रानी के ठोस भौगोलिक बिंब ‘कंधा’ और ‘जीभ’ सुरक्षित रखे गए हैं, जबकि ‘जीभ’ का आशय पाद-टिप्पणी में स्पष्ट किया गया है। अंग्रेज़ी परामर्श-पाठ में पाद-टिप्पणी संकेतों का स्थान उनकी विषयवस्तु से मेल नहीं खाता था; हिंदी पाठ में [a] को ‘जीभ’ और [b] को ‘नमक सागर’ के साथ रखा गया है।
