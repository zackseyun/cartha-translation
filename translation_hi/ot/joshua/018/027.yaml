lexical_decisions:
- source_word: רֶקֶם
  choice: रेकेम
  rationale: नगर-सूची में आए स्थान-नाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: יִרְפְּאֵל
  choice: यिरपेल
  rationale: आरंभिक योध को हिन्दी में स्वाभाविक और अक्षरानुरूप रूप से ‘यि’ लिखा गया है; मध्य के श्वा को अलग स्वर बनाकर अनावश्यक रूप से नहीं बढ़ाया गया।
- source_word: תַרְאֲלָה
  choice: तरअला
  rationale: स्थान-नाम का अनुवाद करने के बजाय लिप्यंतरण किया गया है और अलेफ़ से सूचित स्वर-विराम को ‘अ’ द्वारा बनाए रखा गया है।
- source_word: וְ
  choice: और
  rationale: नामों की समन्वित सूची में उपसर्गीय संयोजक को हिन्दी में अंतिम नाम से पहले ‘और’ के रूप में व्यक्त किया गया है।
