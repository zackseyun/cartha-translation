- source_word: גִּבְעוֹן
  choice: गिबोन
  rationale: बिन्यामीन के नगरों की सूची में यह स्थानवाचक नाम है; इसलिए अर्थानुवाद के बजाय प्रचलित हिंदी लिप्यंतरण अपनाया गया है।
- source_word: הָרָמָה
  choice: रामा
  rationale: यद्यपि इब्रानी रूप में निश्चित उपपद है और मूल अर्थ ‘ऊँचाई’ से जुड़ा है, यहाँ यह नगर का स्थापित नाम है; इसलिए उपपद या शाब्दिक अर्थ को अलग से व्यक्त किए बिना ‘रामा’ रखा गया है।
- source_word: בְאֵרוֹת
  choice: बेरोत
  rationale: यह नगर का नाम है। इसका संबंध ‘कुओं’ से है, पर नगर-सूची के संदर्भ में अर्थानुवाद के बजाय लिप्यंतरण उचित है।
