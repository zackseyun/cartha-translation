base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/015.yaml
  text: And the southern side was from the edge of Kiriath-jearim[b][a], and the border went out westward and went out to the spring of the waters of Nephtoah.
translation:
  language: hi
  text: और दक्षिणी पार्श्व किर्यत-यारीम के छोर से था; सीमा पश्चिम की ओर[a] निकली और आगे बढ़कर नेप्तोह के जल के सोते[b] तक पहुँची।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘समुद्र की ओर’ है; इस भौगोलिक संदर्भ में इसका अर्थ ‘पश्चिम की ओर’ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रचना ‘नेप्तोह के जल का सोता’ है; सरल रूप में ‘नेप्तोह का सोता’ भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת נֶגְבָּה
  choice: और दक्षिणी भुजा
  rationale: פֵאָה यहाँ भूभाग की एक दिशा वाली भुजा या पार्श्व को दर्शाता है, और נֶגְבָּה उसे दक्षिणी बताता है। ‘दक्षिणी भुजा’ सीमा-वर्णन में संक्षिप्त और स्वाभाविक है।
- source_word: מִקְצֵה
  choice: के छोर से
  rationale: קָצֶה का स्थानगत अर्थ अंत, किनारा या छोर है। नगर-क्षेत्र से सीमा आरम्भ होने के संदर्भ में ‘छोर से’ उपयुक्त है।
- source_word: קִרְיַת יְעָרִים
  choice: किर्यत-यारीम
  rationale: स्थान-नाम का अनुवाद करने के बजाय इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וְיָצָא הַגְּבוּל
  choice: सीमा … निकली
  rationale: יָצָא का मूल अर्थ ‘निकलना’ है और यह यहोशू के सीमा-वर्णनों में सीमा-रेखा के आगे बढ़ने के लिए प्रयुक्त होता है।
- source_word: יָמָּה
  choice: पश्चिम की ओर
  rationale: शाब्दिक रूप से यह ‘समुद्र की ओर’ है, पर इस भौगोलिक संदर्भ में भूमध्य सागर की दिशा अर्थात पश्चिम अभिप्रेत है। शाब्दिक बिंब पादटिप्पणी में रखा गया है।
- source_word: מַעְיַן מֵי
  choice: जल के सोते
  rationale: מַעְיַן ‘सोता’ और מֵי ‘जल’ का संबंधवाची रूप है। ‘जल के सोते’ से मूल की दोहरी संबंधवाची रचना बनी रहती है, यद्यपि सरल हिंदी में केवल ‘सोता’ भी कहा जा सकता है।
- source_word: נֶפְתּוֹחַ
  choice: नेप्तोह
  rationale: स्थान-नाम को इब्रानी व्यंजन-रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
