  register: आधुनिक मानक हिंदी का गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप अपनाया गया है। सीमा-वर्णन की भौगोलिक शैली बनाए रखते हुए इब्रानी मुहावरे को आवश्यकता भर स्वाभाविक किया गया है। पादटिप्पणी-चिह्न संबंधित पदों के ठीक बाद रखे गए हैं।
