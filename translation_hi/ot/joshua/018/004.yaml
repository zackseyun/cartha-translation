base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/004.yaml
  text: Provide for yourselves three men from each tribe[a], and I will send them out; they shall arise and walk through the land and write it down according to their inheritance[b], and they shall come to me.
translation:
  language: hi
  text: हर गोत्र में से अपने लिए तीन पुरुष नियुक्त करो[a], और मैं उन्हें भेजूँगा। वे उठकर उस देश में घूमें, उसकी भूमि का विवरण अपनी-अपनी विरासत के अनुसार लिखें[b], और मेरे पास आएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने लिए हर गोत्र से तीन पुरुष उपलब्ध कराओ।’
    reason: lexical_alternative
  - marker: b
    text: अर्थात भूमि का विवरण गोत्रों के विरासत-भागों के संबंध में तैयार करना था।
    reason: cultural_note
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: अपने लिए ... नियुक्त करो
  rationale: הָבוּ का मूल भाव ‘दो/उपलब्ध कराओ’ है, पर व्यक्तियों के चयन के इस प्रसंग में ‘नियुक्त करो’ स्वाभाविक और संदर्भानुकूल है; לָכֶם का आत्मवाचक-व्यावहारिक बल ‘अपने लिए’ से व्यक्त होता है।
- source_word: שְׁלֹשָׁה אֲנָשִׁים לַשָּׁבֶט
  choice: हर गोत्र में से ... तीन पुरुष
  rationale: एकवचन לַשָּׁבֶט यहाँ वितरणात्मक अर्थ रखता है—प्रत्येक गोत्र से तीन। אֲנָשִׁים स्पष्ट रूप से पुरुष प्रतिनिधियों को दर्शाता है।
- source_word: וְאֶשְׁלָחֵם
  choice: मैं उन्हें भेजूँगा
  rationale: שלח का सीधा अर्थ ‘भेजना’ है; मिशन पर भेजे जाने का भाव प्रसंग से स्पष्ट है, इसलिए अतिरिक्त शब्द आवश्यक नहीं।
- source_word: וְיָקֻמוּ
  choice: वे उठकर
  rationale: קום क्रियाओं की अगली शृंखला आरम्भ करता है। ‘उठकर’ हिब्रू क्रम को बनाए रखते हुए हिन्दी में सहज है।
- source_word: וְיִתְהַלְּכוּ בָאָרֶץ
  choice: देश में घूमें
  rationale: הלך के हित्पएल रूप में चारों ओर चलकर निरीक्षण करने का भाव है; ‘देश में घूमें’ संक्षिप्त और स्वाभाविक है।
- source_word: וְיִכְתְּבוּ אוֹתָהּ
  choice: उसका विवरण लिखें
  rationale: स्त्रीलिंग कर्म-सर्वनाम देश की ओर संकेत करता है। हिन्दी में ‘देश को लिखें’ अस्वाभाविक होगा; सर्वेक्षण के प्रसंग में ‘उसका विवरण लिखें’ निहित अर्थ को स्पष्ट करता है।
- source_word: לְפִי נַחֲלָתָם
  choice: अपनी विरासत के अनुसार
  rationale: לְפִי का अर्थ ‘के अनुसार’ है। נַחֲלָתָם का बहुवचन प्रत्यय प्रतिनिधियों/गोत्रों से जुड़ता है; भूमि-विभाजन के संदर्भ को पादटिप्पणी स्पष्ट करती है।
- source_word: וְיָבֹאוּ אֵלָי
  choice: और फिर मेरे पास आएँ
  rationale: हिब्रू में शाब्दिक रूप से ‘मेरे पास आएँ’ है। ‘फिर’ केवल क्रियाक्रम को स्वाभाविक हिन्दी में जोड़ता है; ‘लौटें’ प्रसंगानुकूल होते हुए भी मूल में स्पष्ट नहीं है।
