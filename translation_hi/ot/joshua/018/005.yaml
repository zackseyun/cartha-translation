  text: וְ/הִֽתְחַלְּק֥וּ אֹתָ֖/הּ לְ/שִׁבְעָ֣ה חֲלָקִ֑ים יְהוּדָ֞ה יַעֲמֹ֤ד עַל גְּבוּל/וֹ֙ מִ/נֶּ֔גֶב וּ/בֵ֥ית יוֹסֵ֛ף יַעַמְד֥וּ עַל גְּבוּלָ֖/ם מִ/צָּפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/005.yaml
  text: And they shall divide it into seven portions. Judah shall remain at its border on the south[a], and the house of Joseph shall remain at their border on the north.
translation:
  language: hi
  text: और वे उसे सात भागों में बाँटेंगे। यहूदा दक्षिण में अपनी सीमा पर बना रहेगा[a], और यूसुफ का घराना उत्तर में अपनी सीमा पर बना रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी सीमा पर खड़ा रहेगा”; इब्रानी क्रिया का शाब्दिक अर्थ “खड़ा रहना” है, पर यहाँ संभवतः पहले से निर्धारित क्षेत्रीय सीमाओं में बने रहने का भाव है। यही बात आगे यूसुफ के घराने के विषय में भी लागू होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְחַלְּקוּ אֹתָהּ
  choice: और वे उसे बाँटेंगे
  rationale: हित्पएल रूप भूमि को आपस में विभाजित करने का भाव देता है। प्रसंग में सर्वेक्षण करनेवाले लोगों की आगे की कार्रवाई बताई गई है, इसलिए भविष्यकाल स्वाभाविक है।
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: सात भागों में
  rationale: חֲלָקִים यहाँ भूमि-विभाजन से बने हिस्सों को दर्शाता है; ‘भाग’ स्पष्ट और सामान्य आधुनिक हिन्दी है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: गोत्र के नाम का प्रचलित हिन्दी रूप।
- source_word: יַעֲמֹד עַל גְּבוּלוֹ
  choice: अपनी सीमा पर बना रहेगा
  rationale: עמד का मूल अर्थ ‘खड़ा रहना’ है, पर यहाँ पहले से निर्धारित क्षेत्रीय स्थिति में स्थिर रहने का भाव है।
- source_word: מִנֶּגֶב
  choice: दक्षिण में
  rationale: यहाँ נֶגֶב दिशासूचक रूप में दक्षिणी ओर को दर्शाता है, किसी विशिष्ट भूभाग के नाम को नहीं।
- source_word: וּבֵית יוֹסֵף
  choice: और यूसुफ का घराना
  rationale: בית יוסף यूसुफ से निकले गोत्रों का सामूहिक पद है; ‘घराना’ उस सामूहिक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יַעַמְדוּ עַל גְּבוּלָם
  choice: अपनी सीमा पर बना रहेगा
  rationale: इब्रानी में क्रिया और प्रत्यय बहुवचन हैं, क्योंकि सामूहिक ‘यूसुफ का घराना’ उसके घटक गोत्रों को समेटता है। हिन्दी में सामूहिक कर्ता के साथ एकवचन क्रिया अधिक स्वाभाविक है, जबकि अर्थ वही रहता है।
- source_word: מִצָּפוֹן
  choice: उत्तर में
  rationale: दिशासूचक प्रयोग उत्तरी ओर की क्षेत्रीय स्थिति बताता है और ‘दक्षिण में’ के समानांतर है।
