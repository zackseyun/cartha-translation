  text: Then it passed on to the shoulder opposite the Arabah on the north[b][a], and went down to the Arabah.
translation:
  language: hi
  text: फिर सीमा अराबा के सामने, उत्तर की ओर स्थित कंधे[a] तक आगे बढ़ी और अराबा[b] की ओर उतर गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘कंधा’ है; भू-आकृति के लिए यह पार्श्व, पहाड़ी धार या ढाल का रूपक हो सकता है।
    reason: cultural_note
  - marker: b
    text: ‘अराबा’ का अनुवाद ‘मैदान’ भी किया जा सकता है; इब्रानी शब्द किसी भौगोलिक क्षेत्र का नाम और एक सामान्य स्थलाकृतिक शब्द—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: फिर सीमा ... आगे बढ़ी
  rationale: सीमा-वर्णन में עבר सीमा-रेखा के अगले स्थान तक जारी रहने को बताता है। हिन्दी में स्पष्टता के लिए निहित कर्ता ‘सीमा’ व्यक्त किया गया है।
- source_word: אֶל
  choice: तक
  rationale: यह अगले भू-चिह्न की दिशा और गंतव्य बताता है; इस सीमा-वर्णन में ‘तक’ स्वाभाविक है।
- source_word: כֶּתֶף
  choice: कंधे
  rationale: शाब्दिक स्थलाकृतिक रूपक ‘कंधा’ सुरक्षित रखा गया है; इसका आशय पहाड़ी भूभाग का पार्श्व, ढाल या उभरा भाग हो सकता है।
- source_word: מוּל
  choice: सामनेवाले
  rationale: यह अराबा के सापेक्ष उस भू-भाग की आमने-सामने की स्थिति व्यक्त करता है।
- source_word: הָעֲרָבָה
  choice: अराबा
  rationale: यहाँ शब्द भौगोलिक क्षेत्र के नाम के रूप में समझा जा सकता है; नाम को लिप्यंतरित करने से अनावश्यक भौगोलिक विशिष्टीकरण नहीं होता।
- source_word: צָפֹנָה
  choice: उत्तर की ओर
  rationale: दिशासूचक रूप उत्तरी स्थिति या अभिमुखता बताता है। शब्द-क्रम की अस्पष्टता के कारण हिन्दी में इसे सीमा की प्रगति से जोड़ा गया है, जबकि वैकल्पिक संबंध टिप्पणी में सुरक्षित है।
- source_word: וְיָרַד
  choice: और ... उतर गई
  rationale: ירד भू-भाग में नीचे जाने का सामान्य क्रियापद है; ‘उतर गई’ आधुनिक हिन्दी में सहज है और सीमा के अवरोह को व्यक्त करता है।
- source_word: הָעֲרָבָתָה
  choice: अराबा में
  rationale: दिशासूचक हे अराबा की ओर गति बताता है। संदर्भ में नीचे उतरकर उस क्षेत्र में पहुँचने के लिए ‘में’ सहज है; ‘की ओर’ भी संभव है।
