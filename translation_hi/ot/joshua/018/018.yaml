translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। सीमा-वर्णन की पुनरावृत्त शैली बनाए रखी गई है। ‘कंधा’ जैसे इब्रानी स्थलाकृतिक रूपक को टिप्पणी सहित सुरक्षित रखा गया है। צָפֹנָה का संबंध वाक्य-विन्यास में कुछ अस्पष्ट है; मुख्य पाठ में इसे सीमा की उत्तरमुखी प्रगति से जोड़ा गया है, न कि निर्णायक रूप से कंधे की स्थिति से।
