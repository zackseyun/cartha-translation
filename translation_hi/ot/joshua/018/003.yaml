id: JOS.18.3
reference: Joshua 18:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל עַד אָ֨נָה֙ אַתֶּ֣ם מִתְרַפִּ֔ים לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵ֥י אֲבֽוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/003.yaml
  text: And Joshua said to the sons of Israel[a], “How long will you be slack about going in to take possession of the land that Yahweh, the God of your fathers, has given you?”
translation:
  language: hi
  text: तब यहोशू ने इस्राएलियों से कहा, “तुम कब तक उस देश में जाकर उस पर अधिकार करने में ढिलाई करते रहोगे, जिसे तुम्हारे पूर्वजों के परमेश्वर यहोवा ने तुम्हें दिया है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: हिब्रू वय्यिक्तोल कथानक को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” प्रसंगगत क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ “इस्राएल के पुत्र” है, पर यहाँ यह पूरे जातीय समुदाय के लिए प्रचलित अभिव्यक्ति है; “इस्राएलियों” आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: עַד־אָנָה
  choice: कब तक
  rationale: यह समय-संबंधी फटकार का स्वाभाविक हिन्दी रूप है।
- source_word: מִתְרַפִּים
  choice: ढिलाई करते रहोगे
  rationale: रפה के हित्पएल रूप में शिथिलता, अनिच्छा या तत्परता की कमी का भाव है; “ढिलाई” फटकार को बनाए रखती है, पर इसे अनावश्यक रूप से “आलस्य” जैसे कठोर नैतिक आरोप में नहीं बदलती।
- source_word: לָבוֹא לָרֶשֶׁת
  choice: में जाकर उस पर अधिकार करने
  rationale: दोनों क्रियाओं को साथ रखते हुए यह देश में प्रवेश करने और उसे अपने अधिकार में लेने की गति को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: संदर्भ में यह प्रतिज्ञात देश है; हिन्दी में संबंधवाचक उपवाक्य से पहले “उस देश” स्वाभाविक है।
- source_word: אֲשֶׁר נָתַן לָכֶם
  choice: जिसे ... ने तुम्हें दिया है
  rationale: हिब्रू पूर्ण क्रिया देश को पहले ही परमेश्वर द्वारा दिए गए उपहार के रूप में प्रस्तुत करती है, यद्यपि उस पर अधिकार करना अभी बाकी है; हिन्दी पूर्ण वर्तमान इस तनाव को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचा-नाम के लिए स्थापित सीधा रूप “यहोवा” है; इसे उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: तुम्हारे पूर्वजों के परमेश्वर
  rationale: “पूर्वजों” से पैतृक और पीढ़ीगत वाचा-संदर्भ स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों के लिए “यहोवा” स्थापित नामरूप है और मूल के व्यक्तिगत वाचा-नाम को किसी उपाधि में नहीं बदलता।
- issue: देश दिए जाने और उस पर अभी अधिकार किए जाने के बीच तनाव
  choice: “दिया है” के साथ “अधिकार करने” को बनाए रखा
  alternative: “देनेवाला है”
  rationale: हिब्रू נָתַן उपहार को पूर्ण तथ्य के रूप में रखता है, जबकि לָרֶשֶׁת इस्राएल की अभी अपेक्षित कार्रवाई बताता है; अनुवाद इस धर्मवैचारिक और कथात्मक तनाव को नहीं मिटाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। “ढिलाई करते रहोगे” सामान्य पाठक के लिए स्पष्ट है और मूल की फटकार को बिना अतिशयोक्ति के व्यक्त करता है। “इस्राएलियों” को शाब्दिक “इस्राएल के पुत्रों” पर प्राथमिकता दी गई, क्योंकि यहाँ सामुदायिक जातिनाम अभिप्रेत है।
