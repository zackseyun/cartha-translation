  text: וַ/יַּשְׁלֵךְ֩ לָ/הֶ֨ם יְהוֹשֻׁ֧עַ גּוֹרָ֛ל בְּ/שִׁלֹ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְחַלֶּק שָׁ֨ם יְהוֹשֻׁ֧עַ אֶת הָ/אָ֛רֶץ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל כְּ/מַחְלְקֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/010.yaml
  text: Then Joshua cast lots for them at Shiloh before Yahweh[a], and there Joshua divided the land to the sons of Israel according to their divisions.
translation:
  language: hi
  text: तब यहोशू ने शीलो में याहवे के सामने उनके लिए चिट्ठियाँ डालीं, और वहीं यहोशू ने इस्राएल के पुत्रों[a] के लिए उनके भागों के अनुसार भूमि बाँट दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “इस्राएल के पुत्र।” यह अभिव्यक्ति सामूहिक रूप से इस्राएल के लोगों को सूचित करती है।
    reason: मूल अभिव्यक्ति के शाब्दिक रूप और उसके सामूहिक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּשְׁלֵךְ ... גּוֹרָל
  choice: चिट्ठियाँ डालीं
  rationale: इब्रानी मुहावरा भूमि के बँटवारे का निर्णय करने के लिए चिट्ठी डालने की क्रिया बताता है। גּוֹרָל व्याकरणतः एकवचन है, पर हिन्दी में इस सामूहिक प्रक्रिया के लिए बहुवचन ‘चिट्ठियाँ’ स्वाभाविक है।
- source_word: בְּשִׁלֹה
  choice: शीलो में
  rationale: नामित स्थान पर हुई सार्वजनिक क्रिया को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: यह याहवे की उपस्थिति में, संभवतः पवित्रस्थान पर, किए गए कार्य को दर्शाता है और इब्रानी संरचना के निकट रहता है।
- source_word: וַיְחַלֶּק
  choice: बाँट दी
  rationale: क्रिया भूमि को अलग-अलग हिस्सों में वितरित करने का सीधा अर्थ देती है; चिट्ठियाँ डालने का संदर्भ आवंटन की प्रक्रिया स्पष्ट करता है।
- source_word: הָאָרֶץ
  choice: भूमि
  rationale: यहाँ आशय इस्राएल को बाँटी जा रही विशिष्ट भूमि से है, न कि सामान्य मिट्टी या पूरी पृथ्वी से।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल इब्रानी अभिव्यक्ति को बनाए रखा गया है; पादटिप्पणी स्पष्ट करती है कि यह पूरे इस्राएली समुदाय के लिए सामूहिक पद है।
- source_word: כְּמַחְלְקֹתָם
  choice: उनके भागों के अनुसार
  rationale: यह बँटवारे से प्राप्त हिस्सों या विभाजनों को व्यक्त करता है और हिन्दी में ‘उनके विभागों के अनुसार’ से अधिक स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका पारदर्शी लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चिट्ठियाँ डालना’ हिन्दी का परिचित बाइबलीय तथा सामान्य मुहावरा है; ‘इस्राएल के पुत्र’ मूल रूप को सुरक्षित रखता है और पादटिप्पणी उसके सामूहिक अर्थ को स्पष्ट करती है।
