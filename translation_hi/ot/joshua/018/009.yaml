  yaml_path: translation/ot/joshua/018/009.yaml
  text: So the men went and passed through the land[a], and they wrote it down by cities in seven portions in a book[b], and they came to Joshua at the camp in Shiloh.
translation:
  language: hi
  text: तब वे पुरुष गए और देश में होकर गुजरे। उन्होंने उसका ब्यौरा नगरों के अनुसार सात भागों में एक पुस्तक में लिखा, और वे शीलो की छावनी में यहोशू के पास आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ הָאֲנָשִׁים
  choice: वे पुरुष चले गए
  rationale: यह पूर्व में नियुक्त पुरुष प्रतिनिधियों की ओर निश्चित संकेत करता है; सामान्य आख्यान-क्रम में הלך का सहज अर्थ ‘चले गए’ है।
- source_word: וַיַּעַבְרוּ בָאָרֶץ
  choice: देश में घूमे
  rationale: यहाँ עבר पूरे भूभाग से होकर सर्वेक्षण करने की गतिविधि बताता है। ‘देश में घूमे’ आधुनिक हिन्दी में स्वाभाविक है और केवल एक स्थान को पार कर जाने का भ्रामक भाव नहीं देता।
- source_word: וַיִּכְתְּבוּהָ
  choice: उसका ब्यौरा ... लिखा
  rationale: स्त्रीलिंग कर्म-प्रत्यय का संदर्भ ‘देश/भूमि’ से है। हिन्दी में ‘उसका ब्यौरा लिखा’ सर्वेक्षण की जानकारी दर्ज करने का आशय स्पष्ट करता है।
- source_word: לֶעָרִים
  choice: नगरों के अनुसार
  rationale: ל यहाँ लिखित सर्वेक्षण के संगठन का आधार बताता है—विवरण नगरों के अनुसार व्यवस्थित किया गया था।
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: सात भागों में
  rationale: חֲלָקִים का सीधा अर्थ विभाजन या भाग है। यह आगामी भूमि-वितरण के संदर्भ के अनुकूल रहते हुए किसी अतिरिक्त व्याख्या को नहीं जोड़ता।
- source_word: עַל סֵפֶר
  choice: एक पुस्तक में
  rationale: סֵפֶר किसी पुस्तक, लेखपत्र या लिखित दस्तावेज़ को दर्शा सकता है। मुख्य पाठ में सहज ‘पुस्तक’ रखा गया है और प्राचीन माध्यम की संभावना पादटिप्पणी में दी गई है।
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ
  choice: वे ... यहोशू के पास आए
  rationale: मूल क्रिया केवल ‘आए’ कहती है; संदर्भ में लौटना निहित होने पर भी उसे मुख्य पाठ में स्पष्ट रूप से नहीं जोड़ा गया।
- source_word: אֶל הַמַּחֲנֶה שִׁלֹה
  choice: शीलो की छावनी में
  rationale: यह पदबंध यहोशू के स्थान को बताता है। ‘शीलो की छावनी में’ संक्षिप्त और स्वाभाविक हिन्दी है।
