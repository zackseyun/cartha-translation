source:
  edition: WLC
  text: וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה וַ/יַּשְׁכִּ֥ינוּ שָׁ֖ם אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/הָ/אָ֥רֶץ נִכְבְּשָׁ֖ה לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/001.yaml
  text: Then the whole congregation of the sons of Israel assembled at Shiloh and set up the tent of meeting there[b][a], and the land was subdued before them.
translation:
  language: hi
  text: तब इस्राएलियों[a] की सारी मण्डली शीलो में इकट्ठी हुई। उन्होंने वहाँ मिलापवाला तम्बू खड़ा किया, और देश उनके सामने वश में हो चुका था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘इस्राएल के पुत्रों’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘देश उनके सामने जीत लिया गया था।’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: इकट्ठी हुई
  rationale: निफ़अल रूप का अर्थ समुदाय के रूप में एकत्र होना है। ‘इकट्ठी हुई’ आधुनिक हिन्दी में स्वाभाविक है और औपचारिक सामुदायिक एकत्रीकरण को व्यक्त करता है।
- source_word: כָּל עֲדַת
  choice: सारी मण्डली
  rationale: כָּל की समग्रता और עֵדָה के संगठित समुदाय—दोनों को संक्षिप्त और परिचित हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह आधुनिक हिन्दी में पूरे इस्राएली समुदाय का स्वाभाविक सामूहिक नाम है। इब्रानी का शाब्दिक रूप ‘इस्राएल के पुत्र’ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שִׁלֹה
  choice: शीलो
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַיַּשְׁכִּינוּ
  choice: खड़ा किया
  rationale: हिफ़ईल का शाब्दिक भाव ‘बसाया’ है, पर तम्बू के संदर्भ में ‘खड़ा किया’ स्वाभाविक हिन्दी है और उसे वहाँ स्थापित करने का अर्थ देता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तम्बू
  rationale: यह हिन्दी बाइबलीय प्रयोग में परिचित है और उस तम्बू को दर्शाता है जहाँ परमेश्वर और समुदाय का नियत मिलन होता था।
- source_word: נִכְבְּשָׁה
  choice: वश में हो चुका था
  rationale: निफ़अल पूर्ण रूप देश के अधीन किए जा चुकने की परिणामी दशा बताता है। यह ‘पूरी तरह जीत लिया गया’ जैसा अनावश्यक रूप से प्रबल दावा नहीं करता।
- source_word: לִפְנֵיהֶם
  choice: उनके सामने
  rationale: इब्रानी स्थान-संबंधी मुहावरे को निकटता से सुरक्षित रखता है, जबकि ‘वश में’ प्रसंगगत आशय स्पष्ट करता है।
theological_decisions:
- issue: इस्राएल के समुदाय का सामूहिक पदनाम
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: मुख्य पाठ में स्वाभाविक आधुनिक हिन्दी रखी गई है; मूल के पुल्लिंग शाब्दिक रूप को पादटिप्पणी में दिया गया है, ताकि स्रोत-रूप भी पाठक के सामने रहे।
- issue: נִכְבְּשָׁה में विजय की सीमा
  choice: देश उनके सामने वश में हो चुका था
  alternative: देश उनके सामने जीत लिया गया था
  rationale: ‘वश में’ देश पर नियंत्रण की परिणामी स्थिति बताता है, पर यहोशू के आगे के वर्णन में बचे हुए क्षेत्रों को देखते हुए सम्पूर्ण विजय का अधिक प्रबल अर्थ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘मण्डली’ और ‘मिलापवाला तम्बू’ जैसे परिचित बाइबलीय पद बनाए गए हैं; वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए पहले इब्रानी वाक्य को दो वाक्यों में बाँटा गया है।
