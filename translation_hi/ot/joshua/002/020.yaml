  yaml_path: translation/ot/joshua/002/020.yaml
  text: But if you tell this matter of ours[b][a], then we will be free from your oath that you made us swear.
translation:
  language: hi
  text: लेकिन यदि तू हमारी इस बात[a] को प्रकट कर देगी, तो हम तेरी उस शपथ से मुक्त[b] होंगे, जो तूने हमसे दिलवाई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारे इस मामले” अथवा “हमारे इस काम।” इब्रानी शब्द का अर्थ बात, मामला, कार्य या वचन हो सकता है; यहाँ संकेत जासूसों के गुप्त अभियान की ओर है।
    reason: lexical_alternative
  - marker: b
    text: या “तेरी शपथ से निर्दोष होंगे।” इब्रानी मुहावरे का अर्थ है कि यदि वह उनका रहस्य खोल दे, तो वे उस शपथ से बँधे नहीं रहेंगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: लेकिन यदि
  rationale: संयोजक और शर्तसूचक अव्यय पिछली प्रतिज्ञा के विपरीत अपवादात्मक शर्त प्रस्तुत करते हैं; ‘लेकिन यदि’ आधुनिक हिन्दी में इस संबंध को स्पष्ट रखता है।
- source_word: תַּגִּידִי
  choice: तू ... प्रकट कर देगी
  rationale: नגד के हिफ़ील रूप का अर्थ बताना, ज्ञात कराना या प्रकट करना है। यहाँ गोपनीय बात खोल देने की चेतावनी है, इसलिए ‘प्रकट कर देना’ प्रसंगानुकूल है।
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: हमारी इस बात
  rationale: דבר का अर्थ ‘वचन’, ‘बात’, ‘मामला’ या ‘कार्य’ हो सकता है। यहाँ यह जासूसों की गुप्त योजना/मामले की ओर संकेत करता है; ‘हमारी इस बात’ मूल की व्यापकता और स्वाभाविक हिन्दी दोनों बनाए रखता है।
- source_word: וְהָיִינוּ נְקִיִּם
  choice: तो हम ... मुक्त होंगे
  rationale: היה + נקי मुहावरा किसी दायित्व या दोष से छूटे होने को व्यक्त करता है। शपथ के संदर्भ में ‘मुक्त होंगे’ अभिप्रेत कानूनी-नैतिक छूट को साफ़ बताता है।
- source_word: מִשְּׁבֻעָתֵךְ
  choice: तेरी उस शपथ से
  rationale: מן अलगाव या मुक्ति दर्शाता है और स्त्रीलिंग एकवचन प्रत्यय राहाब से संबंधित शपथ को सूचित करता है। ‘उस’ अगले संबंधवाचक उपवाक्य से इसे सहजता से जोड़ता है।
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: जो तूने हमसे खिलाई है
  rationale: שׁבע का हिफ़ील रूप शपथ दिलाने का कारक अर्थ देता है। हिन्दी मुहावरे में ‘शपथ खिलाना’ इस कारक भाव को स्वाभाविक और ठीक रूप से व्यक्त करता है।
theological_decisions:
- issue: शपथ से मुक्त होने का अर्थ
  choice: शर्त टूटने पर जासूस शपथ के बंधन से मुक्त होंगे
  alternative: वे शपथ के विषय में निर्दोष ठहरेंगे
  rationale: נקי में ‘निर्दोष’ का भाव संभव है, पर מן के साथ और इस शर्त के संदर्भ में मुख्य अर्थ दायित्व से छूटना है; वैकल्पिक दोषरहितता का भाव पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। प्रसंग में प्रत्यक्ष संबोधन के अनुरूप स्त्रीलिंग एकवचन ‘तू/तेरी’ रखा गया है। ‘बात’ की अर्थगत व्यापकता तथा נקי के मुहावरे में निहित ‘मुक्त/निर्दोष’ तनाव को मुख्य पाठ और पादटिप्पणियों में सुरक्षित रखा गया है।
