lexical_decisions:
- source_word: וַתּוֹרִדֵם
  choice: तब उसने उन्हें नीचे उतार दिया
  rationale: हिफ़ील रूप का कारक अर्थ ‘नीचे उतारना’ है; ‘तब’ कथात्मक क्रम को व्यक्त करता है।
- source_word: בַּחֶבֶל
  choice: रस्सी के सहारे
  rationale: חֶבֶל का सामान्य अर्थ ‘रस्सी’ है और בְּ यहाँ साधन बताता है; यह हिंदी में स्वाभाविक प्रयोग है।
- source_word: בְּעַד הַחַלּוֹן
  choice: खिड़की से
  rationale: यह वाक्यांश किसी खुले स्थान से होकर बाहर जाने का भाव देता है; प्रसंग में ‘खिड़की से’ स्पष्ट और स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आगे दिए गए कथन को उस कार्य के संभव होने का कारण बताने वाले स्पष्टीकरण के रूप में जोड़ता है।
- source_word: בֵיתָהּ בְּקִיר הַחוֹמָה
  choice: उसका घर नगर की दीवार के भीतर बना था
  rationale: शाब्दिक संरचना में उसका घर दीवार की संरचना में स्थित बताया गया है। ‘भीतर बना था’ वास्तुस्थिति को स्वाभाविक हिंदी में व्यक्त करता है, बिना उसे केवल दीवार के ऊपर स्थित मान लेने के।
- source_word: וּבַחוֹמָה הִיא יוֹשָׁבֶת
  choice: और वह उसी दीवार में रहती थी
  rationale: יֹשֶׁבֶת यहाँ निरंतर निवास का भाव देता है। ‘उसी’ पुनरुक्ति का संबंध नगर की दीवार से स्पष्ट करता है।
