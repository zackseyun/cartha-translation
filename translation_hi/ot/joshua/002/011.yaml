  text: וַ/נִּשְׁמַע֙ וַ/יִּמַּ֣ס לְבָבֵ֔/נוּ וְ/לֹא קָ֨מָה ע֥וֹד ר֛וּחַ בְּ/אִ֖ישׁ מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/011.yaml
  text: When we heard it[a], our hearts melted, and no spirit remained in any man because of you, for Yahweh your God[b], he is God in the heavens above and on the earth below.
translation:
  language: hi
  text: जब हमने यह सुना, तो हमारे हृदय पिघल गए और तुम्हारे कारण किसी में फिर साहस न रहा[a], क्योंकि याहवे, तुम्हारा परमेश्वर[b], वही ऊपर आकाश में और नीचे पृथ्वी पर परमेश्वर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “किसी व्यक्ति में फिर कोई आत्मा या हौसला न उठा।” अर्थात किसी में साहस नहीं रहा।
    reason: lexical_alternative
  - marker: b
    text: “याहवे” हिब्रू दिव्य नाम YHWH को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַנִּשְׁמַע
  choice: जब हमने यह सुना
  rationale: संदर्भ में यह क्रिया पहले बताई गई घटनाओं को सुनने और उसके परिणाम के बीच कालगत संबंध दिखाती है; ‘यह’ पूर्ववर्ती समाचार की ओर स्वाभाविक संकेत करता है।
- source_word: וַיִּמַּס לְבָבֵנוּ
  choice: हमारे दिल पिघल गए
  rationale: हिब्रू मुहावरे की सजीव छवि को बनाए रखते हुए भय और हिम्मत टूटने का भाव व्यक्त करता है।
- source_word: וְלֹא קָמָה עוֹד רוּחַ בְּאִישׁ
  choice: किसी भी पुरुष में फिर साहस न रहा
  rationale: רוּחַ यहाँ हवा, सांस या पवित्र आत्मा नहीं, बल्कि भीतरी हिम्मत/साहस को सूचित करता है। अर्थ स्पष्ट रखा गया है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: מִפְּנֵיכֶם
  choice: तुम्हारे कारण
  rationale: शाब्दिक रूप से ‘तुम्हारे सामने/उपस्थित होने के कारण’; प्रसंग में इस्राएलियों के कारण उत्पन्न भय इसका आशय है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले वर्णित भय और साहस टूटने का कारण प्रस्तुत करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित ध्वन्यात्मक रूप द्वारा चतुराक्षरीय दिव्य नाम YHWH को उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में रखा गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: यह इस्राएल के परमेश्वर के लिए प्रयुक्त है और दिव्य नाम के साथ संबंधसूचक पद है।
- source_word: הוּא אֱלֹהִים
  choice: वही ... परमेश्वर है
  rationale: हिब्रू की पहचान और बलाघात को व्यक्त करता है, पर मूल में स्पष्ट रूप से न आए ‘एकमात्र’ या ‘सच्चा’ जैसे शब्द नहीं जोड़ता।
- source_word: בַּשָּׁמַיִם מִמַּעַל
  choice: ऊपर आकाश में
  rationale: स्वाभाविक हिन्दी में स्थानगत विरोध को बनाए रखता है; שָׁמַיִם का हिन्दी सामूहिक एकवचन ‘आकाश’ सहज है।
- source_word: וְעַל הָאָרֶץ מִתָּחַת
  choice: और नीचे पृथ्वी पर
  rationale: ऊपर आकाश और नीचे पृथ्वी की समग्रतासूचक युग्म-रचना को सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ नाम को रखा गया है और पादटिप्पणी में YHWH की जानकारी दी गई है; इसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: राहाब की स्वीकारोक्ति का विस्तार
  choice: वही ऊपर आकाश में और नीचे पृथ्वी पर परमेश्वर है
  alternative: वही एकमात्र सच्चा परमेश्वर है
  rationale: मूल सार्वभौम दावा करता है, पर इस खंड में ‘एकमात्र’ या ‘सच्चा’ के लिए अलग शब्द नहीं हैं। इसलिए कथन की शक्ति और उसकी अंतर्निहित धार्मिक तन्यता बिना अतिरिक्त व्याख्यात्मक शब्दों के रखी गई है।
- issue: רוּחַ का आशय
  choice: साहस
  alternative: आत्मा; सांस
  rationale: प्रसंग सामूहिक भय और हिम्मत टूटने का है; यहाँ इसे पवित्र आत्मा संबंधी कथन समझना अनुचित होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘दिल पिघल गए’ मूल बिंब को स्वाभाविक हिन्दी में सुरक्षित रखता है। ‘पुरुष’ בְּאִישׁ की पुल्लिंग अभिव्यक्ति को दर्शाता है, जबकि प्रसंग में नगर के युद्धयोग्य लोगों की हिम्मत पर विशेष बल है।
