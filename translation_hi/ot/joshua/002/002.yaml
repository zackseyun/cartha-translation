- source_word: לֵאמֹר
  choice: प्रत्यक्ष उद्धरण द्वारा व्यक्त
  rationale: यह infinitive construct आगामी कथन का परिचय देता है; हिंदी में उद्धरण-चिह्न इसका स्वाभाविक समतुल्य हैं।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह अव्यय तत्काल और महत्त्वपूर्ण सूचना की ओर ध्यान खींचता है। राजा को संबोधन के कारण आदरसूचक रूप उपयुक्त है।
- source_word: אֲנָשִׁים
  choice: कुछ पुरुष
  rationale: यहाँ शब्द पुरुष व्यक्तियों के लिए है। हिंदी में बिना संख्या बताए अनिश्चित बहुवचन को स्वाभाविक बनाने के लिए ‘कुछ’ जोड़ा गया है।
- source_word: בָּאוּ הֵנָּה
  choice: यहाँ … आए हैं
  rationale: पूर्ण हुई आमद और उसकी वर्तमान प्रासंगिकता को हिंदी का पूर्णकाल स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַלַּיְלָה
  choice: आज रात
  rationale: संदर्भ वर्तमान रात का है; आधुनिक हिंदी में यही सहज अभिव्यक्ति है।
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों में से
  rationale: यह पदबंध इस्राएल के लोगों में सदस्यता या उनमें से होने का भाव देता है; ‘में से’ उस अंशवाचक अर्थ को स्पष्ट रखता है।
- source_word: לַחְפֹּר
  choice: भेद लेने
  rationale: मूल क्रिया खोजने, जाँचने या टोह लेने का अर्थ रख सकती है। इस सैन्य टोही-संदर्भ में ‘देश का भेद लेना’ स्वाभाविक हिंदी है, जबकि पादटिप्पणी व्यापक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: אֶת הָאָרֶץ
  choice: देश
  rationale: यहाँ הָאָרֶץ उस भूभाग/देश को सूचित करता है जिसकी टोही की जा रही है; ‘देश’ वर्तमान हिंदी में सहज है।
