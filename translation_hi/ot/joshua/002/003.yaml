  yaml_path: translation/ot/joshua/002/003.yaml
  text: So the king of Jericho sent to Rahab[a], saying, “Bring out the men who came to you, who entered your house, for they have come to search out all the land.”
translation:
  language: hi
  text: तब यरीहो के राजा ने राहाब के पास संदेश भेजकर कहा, “जो पुरुष तुम्हारे पास आए हैं और तुम्हारे घर में दाखिल हुए हैं, उन्हें बाहर ले आओ, क्योंकि वे सारे देश की खोज-बीन करने[a] आए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारे देश की जासूसी करने।” इब्रानी क्रिया इस प्रसंग में गुप्त निरीक्षण या टोह लेने का अर्थ भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: यह संदेश भेजा
  rationale: שׁלח का मूल अर्थ ‘भेजना’ है। प्रत्यक्ष कथन के प्रसंग में हिंदी का ‘यह संदेश भेजा’ स्वाभाविक है और संप्रेषित आदेश का आशय स्पष्ट करता है।
- source_word: מֶלֶךְ יְרִיחוֹ
  choice: यरीहो के राजा
  rationale: इब्रानी रचना संबंधसूचक है; हिंदी में ‘यरीहो के राजा’ इसका स्वाभाविक और सटीक रूप है।
- source_word: אֶל רָחָב
  choice: राहाब के पास
  rationale: אֶל यहाँ संदेश के प्राप्तकर्ता को दर्शाता है; ‘राहाब के पास’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: הוֹצִיאִי
  choice: बाहर ले आओ
  rationale: יצא के हिफ़ील आज्ञार्थक रूप का अर्थ किसी को बाहर निकालना या ले आना है; यह पद आदेश की प्रत्यक्षता बनाए रखता है।
- source_word: הָאֲנָשִׁים
  choice: पुरुष
  rationale: संदर्भ में אֲנָשִׁים विशेष रूप से उन पुरुषों को सूचित करता है जो भेद लेने आए थे।
- source_word: הַבָּאִים אֵלַיִךְ
  choice: जो तुम्हारे पास आए
  rationale: सविशेषण कृदंत को बीती हुई घटना बताने वाले संबंधवाचक उपवाक्य के रूप में देना हिंदी में स्पष्ट है।
- source_word: אֲשֶׁר בָּאוּ לְבֵיתֵךְ
  choice: और तुम्हारे घर में घुसे हैं
  rationale: בוא के साथ לְבֵיתֵךְ घर में आने या प्रवेश करने को व्यक्त करता है। ‘घुसे हैं’ आरोपपूर्ण राजकीय कथन के संदर्भ में स्वाभाविक है और पहले ‘आए’ की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आदेश का कारण प्रस्तुत करता है; ‘क्योंकि’ इसका सीधा हिंदी समतुल्य है।
- source_word: לַחְפֹּר
  choice: खोज-बीन करने
  rationale: חפר यहाँ भूमि की छानबीन या गुप्त निरीक्षण के अर्थ में है। ‘खोज-बीन’ मुख्य पाठ में व्यापक अर्थ बनाए रखता है, जबकि सैन्य जासूसी की संभावित छाया पादटिप्पणी में दी गई है।
- source_word: אֶת כָּל הָאָרֶץ
  choice: सारे देश की
  rationale: הָאָרֶץ यहाँ पूरी पृथ्वी नहीं, विचाराधीन देश या भूभाग है; ‘सारा देश’ प्रसंगानुकूल है।
- source_word: בָּאוּ
  choice: आए हैं
  rationale: पूर्ण क्रिया का हिंदी वर्तमान-पूर्ण रूप उनके आगमन की वर्तमान प्रासंगिकता बनाए रखता है।
