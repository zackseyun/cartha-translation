- source_word: עֲלֵיהֶם
  choice: उनके पास
  rationale: गति-सूचक क्रिया के साथ यह संबंध उन व्यक्तियों की ओर या उनके पास जाने का भाव देता है; ‘उनके ऊपर’ हिंदी में भ्रामक होगा।
- source_word: עַל הַגָּג
  choice: छत पर
  rationale: यह उस स्थान को बताता है जहाँ वह पुरुषों के पास गई; समतल मकान की छत के लिए यह स्वाभाविक आधुनिक हिंदी है।
- source_word: וְהֵמָּה ... וְהִיא
  choice: उनके ... वह
