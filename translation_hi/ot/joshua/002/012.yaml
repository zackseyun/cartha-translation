source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּֽׁבְעוּ נָ֥א לִ/י֙ בַּֽ/יהוָ֔ה כִּי עָשִׂ֥יתִי עִמָּ/כֶ֖ם חָ֑סֶד וַ/עֲשִׂיתֶ֨ם גַּם אַתֶּ֜ם עִם בֵּ֤ית אָבִ/י֙ חֶ֔סֶד וּ/נְתַתֶּ֥ם לִ֖/י א֥וֹת אֱמֶֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/012.yaml
  text: And now[a], please swear to me by Yahweh that, just as I have shown kindness to you, you also will show kindness to my father's house and give me a sure sign,
translation:
  language: hi
  text: “अब, कृपया मुझे याहवेह की शपथ खाकर वचन दो कि जैसे मैंने तुम्हारे साथ भलाई की है, वैसे ही तुम भी मेरे पिता के घराने के साथ भलाई करोगे और मुझे एक पक्की निशानी[a] दोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सच्ची निशानी,” “पक्की निशानी,” अथवा “विश्वसनीय प्रमाण।”
    reason: אוֹת אֱמֶת के शाब्दिक और प्रसंगगत अर्थ-क्षेत्र को दिखाने के लिए।
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: וְ discourse को आगे बढ़ाता है और עַתָּה राहाब की तत्काल विनती की ओर संक्रमण दिखाता है; हिंदी में ‘इसलिए अब’ पिछले प्रसंग से संबंध और वर्तमान आग्रह दोनों व्यक्त करता है।
- source_word: הִשָּׁבְעוּ נָא לִי בַּיהוָה
  choice: कृपया मेरे सामने याहवेह की शपथ खाओ
  rationale: बहुवचन निफ़अल आज्ञार्थक शपथ लेने की माँग करता है और נָא विनम्र आग्रह जोड़ता है। ‘मेरे सामने’ לִי को स्वाभाविक हिंदी में व्यक्त करता है, जबकि ‘याहवेह की शपथ’ शपथ में लिए गए दिव्य नाम को सुरक्षित रखता है।
- source_word: עָשִׂיתִי עִמָּכֶם חָסֶד
  choice: मैंने तुम्हारे साथ भलाई की है
  rationale: חֶסֶד में दयालु और निष्ठापूर्ण व्यवहार का भाव है। ‘भलाई की है’ सामान्य आधुनिक हिंदी में स्पष्ट है और अगले खंड में उसी शब्द की पुनरावृत्ति बनाए रखता है।
- source_word: וַעֲשִׂיתֶם גַּם־אַתֶּם
  choice: वैसे ही तुम भी ... भलाई करोगे
  rationale: आज्ञार्थक शपथ-अनुरोध के बाद पूर्ण क्रिया अपेक्षित भावी आचरण को बताती है। ‘वैसे ही ... भी’ पारस्परिक समानता और גַּם־אַתֶּם के बल को व्यक्त करता है।
- source_word: בֵּית אָבִי
  choice: मेरे पिता का घराना
  rationale: यह पारिवारिक-गृहस्थ समूह का इब्रानी मुहावरा है; ‘घराना’ केवल भवन के बजाय विस्तृत परिवार को स्वाभाविक रूप से दर्शाता है।
- source_word: אוֹת אֱמֶת
  choice: भरोसेमंद निशानी
  rationale: אוֹת कोई चिन्ह, निशानी या प्रमाण हो सकता है और אֱמֶת यहाँ उसकी सत्यता तथा विश्वसनीयता बताता है। यह चयन ‘सच्ची निशानी’ की संभावित अस्पष्टता से बचते हुए भरोसे के भाव को रखता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवेह
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में वाचा-संबंधी विशिष्ट नाम יהוה है। उसका लिप्यंतरण नाम को सामान्य उपाधि में बदले बिना सुरक्षित रखता है।
- issue: חֶסֶד के संबंधपरक भाव का स्तर
  choice: भलाई
  alternative: करुणा; निष्ठापूर्ण प्रेम; वाचा की निष्ठा
  rationale: यहाँ राहाब अपने किए व्यवहार के प्रत्युत्तर में अपने परिवार के लिए वैसा ही व्यवहार माँगती है। ‘भलाई’ संबंधपरक और नैतिक भाव रखती है, पर इस प्रसंग में स्पष्ट रूप से उल्लिखित न होने वाली औपचारिक वाचा को आरोपित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और मौखिक निवेदन के अनुकूल रखी गई है। राहाब का विनम्र किंतु अत्यावश्यक आग्रह ‘कृपया’ तथा शपथ की सीधी माँग से प्रकट होता है। חֶסֶד की पुनरावृत्ति दोनों खंडों में ‘भलाई’ से सुरक्षित रखी गई है।
