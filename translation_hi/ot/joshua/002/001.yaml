  text: וַ/יִּשְׁלַ֣ח יְהוֹשֻׁ֣עַ בִּן נ֠וּן מִֽן הַ/שִּׁטִּ֞ים שְׁנַֽיִם אֲנָשִׁ֤ים מְרַגְּלִים֙ חֶ֣רֶשׁ לֵ/אמֹ֔ר לְכ֛וּ רְא֥וּ אֶת הָ/אָ֖רֶץ וְ/אֶת יְרִיח֑וֹ וַ/יֵּ֨לְכ֜וּ וַ֠/יָּבֹאוּ בֵּית אִשָּׁ֥ה זוֹנָ֛ה וּ/שְׁמָ֥/הּ רָחָ֖ב וַ/יִּשְׁכְּבוּ שָֽׁמָּ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/001.yaml
  text: Then Joshua son of Nun sent two men secretly from Shittim as spies[a], saying, “Go, see the land and Jericho.” So they went and came to the house of a prostitute whose name was Rahab[c][b], and they lay down there.
translation:
  language: hi
  text: तब नून के पुत्र यहोशू ने शित्तीम से दो पुरुषों को जासूसों के रूप में गुप्त रूप से भेजा और कहा, “जाओ, देश और यरीहो को देखो।” तब वे गए और राहाब नाम की एक वेश्या[b] के घर में आए और वहीं लेट गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वहीं ठहरे।” इब्रानी में शाब्दिक रूप से “वहीं लेट गए” है।
    reason: lexical_alternative
  - marker: b
    text: या “सराय चलानेवाली।” कुछ लोगों ने संदर्भ या बाद की परंपरा के आधार पर यह अर्थ सुझाया है, पर इब्रानी शब्द का सामान्य अर्थ “वेश्या” है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: कथात्मक संदर्भ में שלח का सीधा और स्वाभाविक हिन्दी अर्थ।
- source_word: מִן הַשִּׁטִּים
  choice: शित्तीम से
  rationale: स्थान-नाम को अनुवाद करने के बजाय लिप्यंतरित किया गया है।
- source_word: שְׁנַיִם אֲנָשִׁים מְרַגְּלִים
  choice: दो पुरुषों को भेदियों के रूप में
  rationale: मूल पाठ पुरुष एजेंटों और उनके गुप्तचर कार्य, दोनों को स्पष्ट करता है; ‘भेदिया’ आधुनिक हिन्दी में समझने योग्य है।
- source_word: חֶרֶשׁ
  choice: चुपचाप
  rationale: यहाँ क्रियाविशेषण रूप में गोपनीय ढंग से किए गए प्रेषण को व्यक्त करता है; ‘चुपचाप’ स्वाभाविक हिन्दी है और गुप्तता का भाव रखता है।
- source_word: לְכוּ רְאוּ
  choice: जाओ, ... देखो
  rationale: दोनों आज्ञार्थक क्रियाओं का सीधा रूप सुरक्षित रखा गया है।
- source_word: אֶת הָאָרֶץ וְאֶת יְרִיחוֹ
  choice: उस देश और यरीहो को
  rationale: संयोजक וְ को ‘और’ के रूप में बनाए रखा गया है; यरीहो को देश का विशेष लक्ष्य मानना संभव है, पर उसे मुख्य पाठ में स्पष्ट करके मूल की संरचना को नहीं बदला गया।
- source_word: בֵּית אִשָּׁה זוֹנָה
  choice: एक वेश्या के घर
  rationale: זוֹנָה का सामान्य शाब्दिक अर्थ ‘वेश्या’ है; ‘सराय चलानेवाली’ संदर्भाधारित वैकल्पिक व्याख्या है।
- source_word: וּשְׁמָהּ רָחָב
  choice: राहाब नाम की
  rationale: हिन्दी में स्त्री और उसके नाम का स्वाभाविक परिचय, अर्थ बदले बिना।
- source_word: וַיִּשְׁכְּבוּ שָׁמָּה
  choice: वहीं लेट गए
  rationale: שכב के प्रत्यक्ष अर्थ ‘लेटना’ को रखा गया है; इससे न तो यौन क्रिया और न औपचारिक आवास का अर्थ अनावश्यक रूप से जोड़ा जाता है।
theological_decisions:
- issue: राहाब के व्यवसाय का अर्थ (זוֹנָה)
  choice: वेश्या
  alternative: सराय चलानेवाली
  rationale: इब्रानी शब्द का सामान्य अर्थ ‘वेश्या’ है। नैतिक या सामाजिक कठिनाई को नरम करने के लिए कम संभावित अर्थ मुख्य पाठ में नहीं लिया गया।
- issue: וַיִּשְׁכְּבוּ שָׁמָּה का आशय
  choice: वहीं लेट गए
  alternative: वहीं ठहरे
  rationale: शाब्दिक क्रिया को सुरक्षित रखने से कथन न तो यौन संबंध का संकेत देता है, न औपचारिक रूप से ठहरने की व्यवस्था को निश्चित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘नून के पुत्र यहोशू’, ‘शित्तीम’, और ‘यरीहो’ पारंपरिक बाइबलीय नाम-रूपों के निकट हैं। ‘देश और यरीहो’ मूल इब्रानी समन्वय को बनाए रखता है; ‘विशेषकर यरीहो’ की व्याख्या आरोपित नहीं की गई।
