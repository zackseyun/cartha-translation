base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/022.yaml
  text: So they went and came to the hill country[a], and stayed there three days, until the pursuers returned. The pursuers searched all along the road, but did not find them.
translation:
  language: hi
  text: तब वे चलकर पहाड़ी प्रदेश[a] में पहुँचे और वहाँ तीन दिन तक रहे, जब तक पीछा करनेवाले लौट नहीं गए। पीछा करनेवालों ने पूरे मार्ग पर उनकी खोज की, पर उन्हें वे नहीं मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पर्वत पर” अथवा “पहाड़ियों में।” हिब्रू में एकवचन रूप है, पर यहाँ संभवतः किसी एक चोटी के बजाय यरीहो के पश्चिम का पहाड़ी प्रदेश अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: चलकर ... पहुँचे
  rationale: दो क्रमिक क्रियाओं को स्वाभाविक हिन्दी में एक संयुक्त गति-वाक्य के रूप में रखा गया है; इससे जाना और गंतव्य तक पहुँचना दोनों व्यक्त होते हैं।
- source_word: הָהָרָה
  choice: पहाड़ी प्रदेश[a] में
  rationale: दिशासूचक रूप गति को पहाड़ी भूभाग की ओर दिखाता है। यरीहो के संदर्भ में यह किसी एक पर्वत की अपेक्षा पश्चिम के पहाड़ी क्षेत्र को अधिक संभावित रूप से सूचित करता है, जबकि पाद-टिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: वहाँ ... रहे
  rationale: यहाँ ישב अस्थायी ठहराव बताता है, स्थायी निवास नहीं।
- source_word: שְׁלֹשֶׁת יָמִים
  choice: तीन दिन तक
  rationale: कालावधि को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: עַד שָׁבוּ הָרֹדְפִים
  choice: जब तक पीछा करनेवाले लौट नहीं गए
  rationale: हिन्दी में 'जब तक ... नहीं' संरचना समाप्ति-बिंदु को स्वाभाविक रूप से व्यक्त करती है; שוב का अर्थ लौटना और רֹדְפִים का संज्ञात्मक अर्थ पीछा करनेवाले है।
- source_word: וַיְבַקְשׁוּ הָרֹדְפִים
  choice: पीछा करनेवालों ने ... खोज की
  rationale: पीछा करने के प्रसंग में בקש सुनियोजित तलाश को दर्शाता है।
- source_word: בְּכָל הַדֶּרֶךְ
  choice: पूरे मार्ग पर
  rationale: यह खोज के पूरे रास्ते या मार्ग में किए जाने का भाव बनाए रखता है और हिन्दी में संक्षिप्त तथा स्वाभाविक है।
- source_word: וְלֹא מָצָאוּ
  choice: पर वे उन्हें नहीं मिले
  rationale: हिब्रू में कर्म प्रसंग से निहित है; हिन्दी में 'उन्हें' जोड़ना आवश्यक है। प्रतिकूल परिणाम को 'पर' स्पष्ट करता है, और हिन्दी की स्वाभाविक संरचना में खोजनेवालों के दृष्टिकोण से 'वे उन्हें नहीं मिले' कहा गया है।
