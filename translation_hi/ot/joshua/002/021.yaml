base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/021.yaml
  text: And she said[a], “According to your words, so be it.” Then she sent them away, and they went; and she tied the scarlet cord in the window.
translation:
  language: hi
  text: उसने कहा, “तुम्हारी बातों के अनुसार वैसा ही हो।” तब उसने उन्हें विदा किया और वे चले गए; और उसने खिड़की में लाल रंग की डोरी[a] बाँध दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लाल रंग की रेखा।” इब्रानी अभिव्यक्ति का अर्थ ऐसी डोरी, रेखा, या रस्सी हो सकता है जो दिखाई देने वाले चिह्न के रूप में इस्तेमाल की गई थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדִבְרֵיכֶם
  choice: तुम्हारी बातों के अनुसार
  rationale: बहुवचन ‘बातों’ और द्वितीय पुरुष बहुवचन संबंधसूचक प्रत्यय को बनाए रखते हुए राहाब द्वारा जासूसों की बताई शर्तों की स्वीकृति व्यक्त करता है।
- source_word: כֵּן הוּא
  choice: ही हो
  rationale: पिछले वाक्यांश के साथ मिलकर सहमति का स्वाभाविक हिन्दी मुहावरा ‘तुम्हारी बातों के अनुसार ही हो’ बनता है और इब्रानी के अनुमोदनात्मक भाव को सुरक्षित रखता है।
- source_word: וַתְּשַׁלְּחֵם
  choice: उसने उन्हें विदा किया
  rationale: שלח का मूल अर्थ ‘भेजना’ है; इस प्रसंग में ‘विदा किया’ घर से जासूसों को जाने देने का स्वाभाविक और अनावश्यक व्याख्या से मुक्त हिन्दी रूप है।
- source_word: וַיֵּלֵכוּ
  choice: वे चले गए
  rationale: הלך की सरल कथात्मक गति को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַתִּקְשֹׁר
  choice: उसने ... बाँध दी
  rationale: קשר के ‘बाँधना’ अर्थ को सीधे व्यक्त करता है; स्त्रीलिंग क्रिया ‘दी’ का संबंध ‘डोरी’ से है।
- source_word: תִּקְוַת הַשָּׁנִי
  choice: लाल रंग की डोरी
  rationale: इस प्रसंग में תִּקְוָה अमूर्त ‘आशा’ नहीं, बल्कि पहचान के चिह्न के रूप में प्रयुक्त डोरी/रस्सी है; הַשָּׁנִי गहरे लाल अथवा किरमिजी रंग को सूचित करता है। साधारण पाठकों के लिए ‘लाल रंग की डोरी’ सबसे सहज है, जबकि वस्तु के आकार की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: בַּחַלּוֹן
  choice: खिड़की में
  rationale: स्थानसूचक ב का निकट और स्वाभाविक हिन्दी प्रतिरूप है।
