  register: भाषा आधुनिक मानक हिन्दी की, सरल किंतु गरिमापूर्ण रखी गई है। इब्रानी कथात्मक क्रम को छोटे, स्पष्ट वाक्यों में व्यक्त किया गया है। पादटिप्पणी का चिह्न संबंधित पद ‘डोरी’ पर रखा गया है।
