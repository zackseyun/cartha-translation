  text: וְ/הָ/אֲנָשִׁ֗ים רָדְפ֤וּ אַֽחֲרֵי/הֶם֙ דֶּ֣רֶךְ הַ/יַּרְדֵּ֔ן עַ֖ל הַֽ/מַּעְבְּר֑וֹת וְ/הַ/שַּׁ֣עַר סָגָ֔רוּ אַחֲרֵ֕י כַּ/אֲשֶׁ֛ר יָצְא֥וּ הָ/רֹדְפִ֖ים אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/007.yaml
  text: And the men pursued after them on the way to the Jordan[a], as far as the fords, and they shut the gate behind them as soon as the pursuers had gone out after them.
translation:
  language: hi
  text: और वे पुरुष यरदन की ओर जानेवाले मार्ग पर उनका पीछा करते हुए घाटों[a] तक गए। पीछा करनेवाले उनके पीछे निकलते ही, फाटक बंद कर दिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात यरदन नदी के वे उथले स्थान जहाँ से उसे पार किया जा सकता था।
    reason: मַעְבָּרוֹת के भौगोलिक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: और वे पुरुष
  rationale: निश्चित बहुवचन संदर्भ में राजा के भेजे हुए लोगों की ओर संकेत करता है; आरंभिक וְ को कथा-संयोजक ‘और’ से रखा गया है।
- source_word: רָדְפוּ אַחֲרֵיהֶם
  choice: उनका पीछा करते हुए ... गए
  rationale: רדף का खोज या सैन्य प्रसंग में स्वाभाविक हिन्दी अर्थ ‘पीछा करना’ है; मार्ग और गंतव्य के साथ हिन्दी वाक्य को सहज बनाने के लिए गमन का भाव स्पष्ट किया गया है।
- source_word: דֶּרֶךְ הַיַּרְדֵּן
  choice: यरदन की ओर जानेवाले मार्ग पर
  rationale: דֶּרֶךְ मार्ग को और संपूर्ण पद यरदन की दिशा में जानेवाले रास्ते को दर्शाता है।
- source_word: עַל הַמַּעְבְּרוֹת
  choice: घाटों तक
  rationale: מַעְבָּרוֹת नदी पार करने के स्थानों को दर्शाता है; यात्रा के इस संदर्भ में עַל सीमा या गंतव्य का भाव देता है।
- source_word: וְהַשַּׁעַר סָגָרוּ
  choice: फाटक बंद कर दिया गया
  rationale: इब्रानी में क्रिया बहुवचन है पर कर्ता व्यक्त नहीं है। हिन्दी का भाववाच्य अनिर्दिष्ट कर्ता को सुरक्षित रखता है और बिना आधार ‘उन्होंने’ को पीछा करनेवालों से जोड़ने से बचाता है।
- source_word: אַחֲרֵי כַּאֲשֶׁר יָצְאוּ
  choice: निकलते ही
  rationale: कालवाचक संरचना पीछा करनेवालों के बाहर जाने के तुरंत बाद फाटक बंद होने का क्रम व्यक्त करती है।
- source_word: הָרֹדְפִים אַחֲרֵיהֶם
  choice: पीछा करनेवालों के उनके पीछे
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत को ‘पीछा करनेवाले’ और दोहराए गए אַחֲרֵיהֶם को ‘उनके पीछे’ से रखा गया है, जिससे मूल की पुनरावृत्ति बनी रहती है।
