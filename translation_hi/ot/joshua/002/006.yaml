translation:
  language: hi
  text: पर वह उन्हें छत पर ले गई थी और उन्हें सन के डंठलों के बीच छिपा दिया था, जो उसके लिए छत पर फैलाकर रखे गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגָּגָה / עַל הַגָּג
  choice: छत पर
  rationale: प्राचीन घर की समतल छत अभिप्रेत है; सामान्य हिंदी में ‘छत’ स्पष्ट और स्वाभाविक है।
- source_word: בְּפִשְׁתֵּי הָעֵץ
  choice: सन के ... डंठलों के बीच
  rationale: यह सन के काटे हुए काष्ठीय तनों या डंठलों को सूचित करता है; ‘डंठल’ आधुनिक पाठक के लिए सहज है।
- source_word: הָעֲרֻכוֹת
  choice: पंक्तियों में बिछा रखा था
  rationale: स्त्रीलिंग बहुवचन रूप उन सन की डंठलों को व्यवस्थित करके फैलाए या सजाए जाने का संकेत देता है; यह अनुवाद उस व्यवस्था को व्यक्त करता है।
- source_word: לָהּ
  choice: अपने लिए
  rationale: हिब्रू का स्त्रीलिंग एकवचन संबंधसूचक सर्वनाम राहाब की ओर संकेत करता है और उसके अपने उपयोग या अधिकार के भाव को बनाए रखता है।
