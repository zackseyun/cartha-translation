  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֡ה כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/דַּלְתֵ֨י בֵיתֵ֧/ךְ הַ/ח֛וּצָ/ה דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ וַ/אֲנַ֣חְנוּ נְקִיִּ֑ם וְ֠/כֹל אֲשֶׁ֨ר יִֽהְיֶ֤ה אִתָּ/ךְ֙ בַּ/בַּ֔יִת דָּמ֣/וֹ בְ/רֹאשֵׁ֔/נוּ אִם יָ֖ד תִּֽהְיֶה בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/019.yaml
  text: Anyone who goes out through the doors of your house, his blood will be on his own head, and we will be guiltless; but anyone who is with you in the house, his blood will be on our heads[a] if a hand is laid on him.
translation:
  language: hi
  text: जो कोई तुम्हारे घर के दरवाज़ों से बाहर निकलेगा, उसका खून उसी के सिर पर होगा, और हम निर्दोष होंगे; पर जो कोई तुम्हारे साथ घर में रहेगा, यदि उस पर हाथ उठाया जाए, तो उसका खून हमारे सिर पर होगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसका खून उसी के सिर पर होगा’ और ‘उसका खून हमारे सिर पर होगा’ वैधानिक मुहावरे हैं, जो रक्तपात या मृत्यु की जिम्मेदारी ठहराते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: अलग से अनूदित नहीं; शर्तात्मक कथन से भाव व्यक्त
  rationale: यह अगली शर्त का परिचय देता है। स्वाभाविक हिन्दी में सीधे शर्त बताने से इसका कार्य स्पष्ट हो जाता है।
- source_word: כֹּל אֲשֶׁר
  choice: जो कोई
  rationale: सन्दर्भ में यह व्यक्तियों के लिए वितरणात्मक प्रयोग है; ‘जो कोई’ उस वैधानिक और व्यक्तिगत बल को बनाए रखता है।
- source_word: יֵצֵא מִדַּלְתֵי בֵיתֵךְ הַחוּצָה
  choice: तुम्हारे घर के दरवाज़ों से बाहर निकलेगा
  rationale: ‘बाहर निकलेगा’ दिशासूचक הַחוּצָה को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अनावश्यक पुनरुक्ति के।
- source_word: דָּמוֹ בְרֹאשׁוֹ
  choice: उसका खून उसी के सिर पर होगा
  rationale: मूल का वैधानिक मुहावरा और उसका गंभीर चित्र सुरक्षित रखा गया है; ‘उसी’ व्यक्ति की अपनी जिम्मेदारी पर बल देता है।
- source_word: וַאֲנַחְנוּ נְקִיִּם
  choice: और हम निर्दोष होंगे
  rationale: यह शपथ के अधीन दोष अथवा उत्तरदायित्व से मुक्त होने का अर्थ व्यक्त करता है।
- source_word: וְכֹל אֲשֶׁר יִהְיֶה אִתָּךְ בַּבַּיִת
  choice: पर जो कोई तुम्हारे साथ घर में रहेगा
  rationale: ‘पर’ पहली और दूसरी शर्त के बीच निहित विरोध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: דָּמוֹ בְרֹאשֵׁנוּ
  choice: उसका खून हमारे सिर पर होगा
  rationale: पहले समानान्तर मुहावरे को बनाए रखते हुए यह गुप्तचरों की जिम्मेदारी व्यक्त करता है।
- source_word: אִם יָד תִּהְיֶה בּוֹ
  choice: यदि उस पर हाथ उठाया जाए
  rationale: यह हिंसक कार्रवाई या हानि के हिब्रू मुहावरे का स्वाभाविक हिन्दी रूप है और कर्ता को अनिर्दिष्ट रखता है।
theological_decisions:
- issue: रक्त-दोष के वैधानिक मुहावरे को बनाए रखना
  choice: मुख्य पाठ में ‘उसका खून उसी के सिर पर होगा / उसका खून हमारे सिर पर होगा’
  alternative: ‘अपनी मृत्यु के लिए वह स्वयं जिम्मेदार होगा / उसकी मृत्यु के लिए हम जिम्मेदार होंगे’
  rationale: मूल मुहावरे को रखने से वाचा-संबंधी, वैधानिक गंभीरता और दोनों वाक्यांशों का समानान्तर रूप सुरक्षित रहता है; पादटिप्पणी उसका आशय स्पष्ट करती है।
- issue: राहाब को एकवचन स्त्री के रूप में सम्बोधन
  choice: ‘तुम्हारे/तुम्हारे साथ’
  alternative: ‘तेरे/तेरे साथ’
  rationale: हिब्रू प्रत्यय स्त्रीलिंग एकवचन हैं, पर आधुनिक मानक हिन्दी में ‘तुम्हारे’ स्त्री और पुरुष दोनों के लिए समान रूप से प्रयुक्त होता है तथा यहाँ स्वाभाविक और सम्मानजनक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गंभीर और वैधानिक स्वर रखा गया है। सम्बोधन में सम्मानजनक किन्तु अत्यधिक औपचारिक न होने वाला ‘तुम्हारे’ चुना गया है। मूल के समानान्तर रक्त-दोष मुहावरों को मुख्य पाठ में सुरक्षित रखा गया है।
