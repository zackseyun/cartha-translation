  text: and keep alive my father and my mother[a], and my brothers and my sisters, and all who belong to them[b]; and deliver our lives from death.
translation:
  language: hi
  text: और मेरे पिता और मेरी माता को, मेरे भाइयों और मेरी बहनों को, और उनसे संबंध रखने वाले सभी लोगों को जीवित रखना; और हमारे प्राणों को मृत्यु से बचाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַחֲיִתֶם
  choice: जीवित रखना
  rationale: חיה के हिफ़ील रूप का अर्थ ‘जीवित रखना’ है। यह क्रिया के कारक भाव को स्पष्ट रखता है और केवल ‘छोड़ देना’ जैसे संकुचित अर्थ से बचता है।
- source_word: אָבִי ... אִמִּי ... אַחַי ... אחותי
  choice: मेरे पिता और मेरी माता को, मेरे भाइयों और मेरी बहनों को
  rationale: इब्रानी में आए प्रत्येक पारिवारिक संबंध और उनकी क्रमिक पुनरावृत्ति को सहज हिन्दी में बनाए रखा गया है।
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: जो कोई उनका है, उन सबको
  rationale: אֲשֶׁר לָהֶם व्याकरणतः व्यक्तियों या संपत्ति के लिए व्यापक हो सकता है, पर यहाँ ‘जीवित रखने’ और मृत्यु से बचाने के प्रसंग में आश्रितों अथवा घराने के अन्य लोगों का संकेत अधिक संभावित है। ‘जो कोई’ व्यक्ति-संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהִצַּלְתֶּם
  choice: बचाना
  rationale: נצל के हिफ़ील का यहाँ अर्थ संकट या मृत्यु से छुड़ाना/बचाना है। ‘बचाना’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: נַפְשֹׁתֵינוּ
  choice: हम सबके प्राणों को
  rationale: נפש यहाँ अमूर्त ‘आत्माओं’ के बजाय संकट में पड़े जीवित व्यक्तियों या जीवन को दर्शाता है। ‘प्राण’ मृत्यु के संदर्भ में ठोस अर्थ और इब्रानी बहुवचन दोनों को बनाए रखता है; ‘सबके’ हिन्दी में संदर्भित समूह को स्पष्ट करता है।
- source_word: מִמָּוֶת
  choice: मृत्यु से
  rationale: यह मूल पूर्वसर्गीय पद का सीधा और गरिमापूर्ण हिन्दी रूप है।
