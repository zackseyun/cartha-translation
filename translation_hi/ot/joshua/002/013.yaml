  register: भाषा आधुनिक मानक हिन्दी में, विनती के गंभीर स्वर के अनुरूप रखी गई है। इब्रानी वाक्य के समन्वयी ढाँचे को बनाए रखते हुए हिन्दी की स्वाभाविकता के लिए कर्मसूचक ‘को’ और अंतिम आज्ञार्थक क्रियाओं का प्रयोग किया गया है।
