  yaml_path: translation/ot/joshua/002/005.yaml
  text: And when the gate was about to be shut at dark[a], the men went out. I do not know where the men went. Pursue them quickly, for you will overtake them.
translation:
  language: hi
  text: और जब अँधेरा होते समय फाटक बंद होने ही वाला था[a], तब वे आदमी बाहर निकल गए। मुझे नहीं मालूम कि वे आदमी कहाँ गए। जल्दी उनका पीछा करो, क्योंकि तुम उन्हें पकड़ लोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब अँधेरा हो गया था”; इब्रानी पद अँधेरा आरम्भ होने के समय फाटक बंद किए जाने का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשַּׁעַר לִסְגֹּר
  choice: और जब ... फाटक बंद होने ही वाला था
  rationale: यह कथात्मक काल-संरचना फाटक के आसन्न बंद होने की परिस्थिति बताती है; ‘बंद होने ही वाला था’ इस भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בַּחֹשֶׁךְ
  choice: अँधेरा होते समय
  rationale: यह पद अँधेरा आरम्भ होने के समय को सूचित करता है, न कि केवल अँधेरे के भीतर होने की अवस्था को।
- source_word: וְהָאֲנָשִׁים יָצָאוּ
  choice: तब वे पुरुष बाहर निकल गए
  rationale: יצא का ठोस गति-बोध ‘बाहर निकल गए’ से बना रहता है; ‘तब’ हिन्दी में काल-संबंध को स्पष्ट और सहज बनाता है।
- source_word: לֹא יָדַעְתִּי
  choice: मुझे नहीं मालूम
  rationale: प्रत्यक्ष कथन में पूर्ण क्रिया वर्तमान अज्ञान की अवस्था व्यक्त करती है; यह हिन्दी में स्वाभाविक अभिव्यक्ति है।
- source_word: אָנָה הָלְכוּ הָאֲנָשִׁים
  choice: वे पुरुष कहाँ गए
  rationale: אָנָה गंतव्य पूछता है; आधुनिक हिन्दी में ‘कहाँ गए’ इसका स्वाभाविक समतुल्य है।
- source_word: רִדְפוּ מַהֵר אַחֲרֵיהֶם
  choice: जल्दी उनका पीछा करो
  rationale: आज्ञार्थकता, शीघ्रता और ‘उनके पीछे’ जाने का भाव संक्षिप्त तथा मुहावरेदार हिन्दी में सुरक्षित है।
- source_word: כִּי תַשִּׂיגוּם
  choice: क्योंकि तुम उन्हें जा पकड़ोगे
  rationale: כִּי कारण देता है और נשׂג का हिफ़ील रूप पीछा करके पहुँचने अथवा पकड़ लेने का अर्थ रखता है; ‘जा पकड़ोगे’ पीछा करने की गति को भी बनाए रखता है।
