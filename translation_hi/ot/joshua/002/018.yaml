source:
  edition: WLC
  text: הִנֵּ֛ה אֲנַ֥חְנוּ בָאִ֖ים בָּ/אָ֑רֶץ אֶת תִּקְוַ֡ת חוּט֩ הַ/שָּׁנִ֨י הַ/זֶּ֜ה תִּקְשְׁרִ֗י בַּֽ/חַלּוֹן֙ אֲשֶׁ֣ר הוֹרַדְתֵּ֣/נוּ ב֔/וֹ וְ/אֶת אָבִ֨י/ךְ וְ/אֶת אִמֵּ֜/ךְ וְ/אֶת אַחַ֗יִ/ךְ וְ/אֵת֙ כָּל בֵּ֣ית אָבִ֔י/ךְ תַּאַסְפִ֥י אֵלַ֖יִ/ךְ הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/018.yaml
  text: Look[a], when we come into the land, you shall tie this scarlet cord in the window through which you let us down, and you shall gather into your house your father, your mother, your brothers, and all your father's household.
translation:
  language: hi
  text: देखो, जब हम देश में आएँ, तब तुम लाल रंग के धागे की यह डोरी[a] उस खिड़की में बाँध देना, जिससे तुमने हमें नीचे उतारा था। और अपने पिता, अपनी माता, अपने भाइयों और अपने पिता के पूरे घराने को अपने घर में अपने पास इकट्ठा कर लेना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “यह लाल डोरी।”'
    reason: תִּקְוַת חוּט הַשָּׁנִי की संयुक्त अभिव्यक्ति का संदर्भानुकूल, अधिक संक्षिप्त वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला अव्यय है; ‘देखो’ आधुनिक और स्वाभाविक हिंदी में उसके संकेतात्मक बल को बनाए रखता है।
- source_word: בָאִים בָּאָרֶץ
  choice: जब हम इस देश में आएँ
  rationale: संदर्भ में कृदंत निकट भविष्य में देश में प्रवेश को दर्शाता है; ‘जब...आएँ’ शर्त का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִּקְוַת חוּט הַשָּׁנִי הַזֶּה
  choice: लाल रंग के धागे की यह डोरी
  rationale: पदबंध में תִּקְוָה ‘डोरी’ और חוּט הַשָּׁנִי ‘लाल रंग का धागा’ है। मुख्य पाठ स्रोत की संयुक्त अभिव्यक्ति को पठनीय हिंदी में रखता है।
- source_word: תִּקְשְׁרִי
  choice: बाँध देना
  rationale: स्त्रीलिंग एकवचन निर्देशात्मक क्रिया है; ‘बाँध देना’ स्पष्ट और स्वाभाविक निर्देश व्यक्त करता है।
- source_word: בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ
  choice: उसी खिड़की में ... जिससे तुमने हमें नीचे उतारा था
  rationale: हिफ़ील क्रिया का कारक अर्थ ‘नीचे उतारा’ से सुरक्षित रहता है और ‘उसी’ पहचान की विशिष्टता स्पष्ट करता है।
- source_word: תַּאַסְפִי אֵלַיִךְ הַבָּיְתָה
  choice: अपने पास घर में इकट्ठा कर लेना
  rationale: यह लोगों को अपने पास एकत्र करने और घर के भीतर लाने, दोनों गतियों को बनाए रखता है।
- source_word: אָבִיךְ ... אִמֵּךְ ... אַחַיִךְ
  choice: अपने पिता, अपनी माता, अपने भाइयों
  rationale: संबंधसूचक रूपों और אַחַיִךְ के पुल्लिंग बहुवचन को सीधे तथा स्वाभाविक हिंदी में प्रस्तुत किया गया है।
- source_word: כָּל בֵּית אָבִיךְ
  choice: अपने पिता के पूरे घराने
  rationale: ‘घराना’ भवन के बजाय विस्तृत पारिवारिक इकाई का अर्थ स्पष्ट करता है।
