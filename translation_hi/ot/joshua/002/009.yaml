id: JOS.2.9
reference: Joshua 2:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל הָ֣/אֲנָשִׁ֔ים יָדַ֕עְתִּי כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ וְ/כִֽי נָפְלָ֤ה אֵֽימַתְ/כֶם֙ עָלֵ֔י/נוּ וְ/כִ֥י נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/009.yaml
  text: And she said to the men[a], “I know that Yahweh has given you the land, and that the fear of you has fallen upon us[b], and that all the inhabitants of the land have melted away before you.”
translation:
  language: hi
  text: तब उसने उन पुरुषों से कहा, “मैं जानती हूँ कि याहवे ने यह देश तुम्हें दे दिया है, और तुम्हारा आतंक हम पर आ पड़ा है,[a] और देश के सभी निवासी तुम्हारे सामने पिघल गए हैं।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा भय हम पर छा गया है।”
    reason: אֵימָה का अर्थ ‘भय’, ‘दहशत’ या ‘आतंक’ हो सकता है; वैकल्पिक वाक्यांश हिन्दी में उसी भाव का कुछ कम शाब्दिक रूप देता है।
  - marker: b
    text: अर्थात् “देश के सभी निवासी तुम्हारे कारण हिम्मत हार गए हैं।” इब्रानी क्रिया का शाब्दिक अर्थ “पिघल गए हैं” है।
    reason: मुख्य पाठ मूल रूपक सुरक्षित रखता है; पादटिप्पणी उसका प्रसंगगत भाव स्पष्ट करती है और מִפְּנֵיכֶם के कारणात्मक अर्थ को भी दर्शाती है।
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־הָאֲנָשִׁים
  choice: तब उसने उन पुरुषों से कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में इस प्रगति को व्यक्त करता है। निश्चित पदबंध का अनुवाद ‘उन पुरुषों’ किया गया है, जिसका संकेत संदर्भ में गुप्तचरों की ओर है।
- source_word: יָדַעְתִּי
  choice: मैं जानती हूँ
  rationale: यह पूर्ण क्रिया वर्तमान में स्थिर और प्रासंगिक ज्ञान व्यक्त करती है; स्त्री वक्ता के अनुसार ‘जानती हूँ’ स्वाभाविक है।
- source_word: נָתַן יְהוָה לָכֶם אֶת־הָאָרֶץ
  choice: याहवे ने यह देश तुम्हें दे दिया है
  rationale: पूर्ण क्रिया दान को राहाब के दृष्टिकोण से सुनिश्चित और प्रभावी रूप से पूरा हुआ बताती है, यद्यपि विजय अभी चल रही है। संदर्भगत निश्चित भूमि के लिए सहज हिन्दी ‘यह देश’ चुना गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में सीधे लिप्यंतरित किया गया है।
- source_word: נָפְלָה אֵימַתְכֶם עָלֵינוּ
  choice: तुम्हारा आतंक हम पर आ पड़ा है
  rationale: אֵימָה तीव्र भय या आतंक दर्शाता है और נפל ... על का चित्र ‘आ पड़ना’ से सुरक्षित रहता है। ‘तुम्हारा आतंक’ यहाँ तुमसे उत्पन्न आतंक के अर्थ में है।
- source_word: נָמֹגוּ כָּל יֹשְׁבֵי הָאָרֶץ
  choice: देश के सभी निवासी ... पिघल गए हैं
  rationale: मुख्य पाठ में इब्रानी क्रिया के सजीव ‘पिघलने’ के रूपक को बनाए रखा गया है; इसका भाव साहस टूट जाना है।
- source_word: מִפְּנֵיכֶם
  choice: तुम्हारे सामने
  rationale: यह इब्रानी मुहावरे की उपस्थिति/सम्मुखता को सुरक्षित रखता है और इस संभावना को खुला रखता है कि भय इस्राएल के आने के कारण है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना और ‘यहोवा’ वाली बाद की मिश्रित स्वर-परंपरा अपनाए बिना प्रस्तुत करता है।
- issue: भूमि दिए जाने का कालगत पक्ष
  choice: दे दिया है
  alternative: दे रहा है; दिया था
  rationale: पूर्ण क्रिया राहाब की दृष्टि में दान की निश्चितता और वर्तमान प्रभाव व्यक्त करती है, जबकि कथा में वास्तविक अधिकार ग्रहण करना अभी पूरा नहीं हुआ; अनुवाद इस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। मुख्य पाठ में ‘आ पड़ा’ और ‘पिघल गए’ जैसे मूल इब्रानी बिंब सुरक्षित हैं; जहाँ वे रूपकात्मक हैं वहाँ पादटिप्पणी अर्थ स्पष्ट करती है। सर्वनाम बहुवचन ‘तुम्हें/तुम्हारा/तुम्हारे’ दोनों गुप्तचरों और उनके समुदाय की ओर संकेत करता है।
