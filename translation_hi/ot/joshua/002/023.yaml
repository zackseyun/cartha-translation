  text: וַ/יָּשֻׁ֜בוּ שְׁנֵ֤י הָֽ/אֲנָשִׁים֙ וַ/יֵּרְד֣וּ מֵֽ/הָ/הָ֔ר וַ/יַּעַבְרוּ֙ וַ/יָּבֹ֔אוּ אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וַ/יְסַ֨פְּרוּ ל֔/וֹ אֵ֥ת כָּל הַ/מֹּצְא֖וֹת אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/023.yaml
  text: Then the two men returned[a], came down from the hill country, crossed over, and came to Joshua son of Nun; and they told him all that had happened to them.
translation:
  language: hi
  text: तब वे दोनों पुरुष लौटे, पहाड़ी प्रदेश से नीचे उतरे, पार गए और नून के पुत्र यहोशू के पास आए। उन्होंने उसे वह सब बताया जो उनके साथ घटा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ उन पर बीता था”; अधिक शाब्दिक रूप से, “वे सब बातें जिन्होंने उन्हें पाया था।”
    reason: מצא-आधारित इब्रानी अभिव्यक्ति के वैकल्पिक और अधिक शाब्दिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: लौटे
  rationale: שׁוב कथा के इस क्रम में अपने अभियान से वापस आने का स्वाभाविक अर्थ देता है; ‘लौटे’ संक्षिप्त और सहज है।
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: वे दोनों पुरुष
  rationale: इब्रानी में भूमिका-सूचक ‘भेदिए’ नहीं, बल्कि सामान्य संज्ञा ‘पुरुष’ है; इसलिए मूल शब्दावली बनाए रखी गई है।
- source_word: וַיֵּרְדוּ מֵהָהָר
  choice: पहाड़ी प्रदेश से नीचे उतरे
  rationale: הָהָר यहाँ किसी एक पहाड़ के बजाय पहाड़ी भूभाग को सूचित कर सकता है; प्रसंग में ‘पहाड़ी प्रदेश’ उपयुक्त है।
- source_word: וַיַּעַבְרוּ
  choice: पार गए
  rationale: עבר का अर्थ ‘पार जाना’ है। मूल पाठ यह नहीं बताता कि वे किसे पार गए, इसलिए हिन्दी में भी कर्म को अनिर्दिष्ट रखा गया है।
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ בִּן נוּן
  choice: नून के पुत्र यहोशू के पास आए
  rationale: בוא אֶל का स्वाभाविक अनुवाद ‘के पास आए’ है, और पितृनाम-संबंधी पहचान को पूर्ण रूप से रखा गया है।
- source_word: וַיְסַפְּרוּ לוֹ
  choice: उन्होंने उसे ... बताया
  rationale: पिएल रूप ספר यहाँ बताने या वृत्तांत सुनाने का अर्थ देता है; ‘बताया’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אֵת כָּל הַמֹּצְאוֹת אוֹתָם
  choice: वह सब ... जो उनके साथ घटा था
  rationale: מצא का यह प्रयोग शाब्दिक रूप से उन बातों का वर्णन करता है जो उन्हें ‘मिलीं’ या जिन्होंने उन्हें ‘पाया’; हिन्दी में ‘जो उनके साथ घटा था’ इस मुहावरे का स्वाभाविक अर्थ देता है और כָּל की समग्रता को ‘वह सब’ से बनाए रखता है।
