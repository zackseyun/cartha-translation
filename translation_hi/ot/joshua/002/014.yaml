base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/014.yaml
  text: The men said to her[a], “Our lives for yours, even to death, if you do not tell this matter of ours. And when Yahweh gives us the land, we will deal with you in covenant faithfulness and truth.”
translation:
  language: hi
  text: उन पुरुषों ने उससे कहा, “तुम्हारे प्राणों के बदले हमारे प्राण भी जाएँ—यदि तुम लोग हमारी यह बात प्रकट न करो। जब याहवे हमें यह भूमि दे देगा, तब हम तुम्हारे प्रति निष्ठावान प्रेम और सच्चाई दिखाएँगे।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दयालुता और विश्वासयोग्यता।” इब्रानी शब्द-युग्म חֶסֶד वֶאֱמֶת निष्ठापूर्ण, भरोसेमंद और वचनबद्ध व्यवहार को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: वे पुरुष
  rationale: इब्रानी में सामान्य शब्द ‘पुरुष’ है। संदर्भ से वे भेदिए हैं, पर मूल पद में यह उपाधि नहीं जोड़ी गई है।
- source_word: נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת
  choice: तुम्हारे प्राणों के बदले हमारे प्राण जाएँ
  rationale: נֶפֶשׁ यहाँ ‘प्राण/जीवन’ और תַּחַת प्रतिस्थापन को व्यक्त करता है। यह शपथ-सदृश प्रतिज्ञा है कि राहाब और उसके लोगों की मृत्यु होने पर वे अपने प्राणों को उत्तरदायी मानते हैं।
- source_word: אִם לֹא תַגִּידוּ
  choice: यदि तुम लोग … प्रकट न करो
  rationale: नकार सहित यह शर्त व्यक्त करता है। क्रिया बहुवचन है; ‘तुम लोग’ उसे बनाए रखता है और सम्भवतः राहाब सहित उसके घराने को संबोधित करता है। ‘प्रकट करना’ गुप्त विषय को दूसरों को बताने के प्रसंग में स्वाभाविक है।
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: हमारी इस बात
  rationale: דָּבָר का अर्थ यहाँ शब्द मात्र नहीं, बल्कि उनका गोपनीय विषय या मामला है। ‘हमारी इस बात’ पर्याप्त रूप से व्यापक और स्वाभाविक है।
- source_word: בְּתֵת יְהוָה לָנוּ אֶת הָאָרֶץ
  choice: जब याहवे हमें यह देश दे देगा
  rationale: בְּ + infinitive construct समयसूचक है। निश्चित भावी घटना के अनुरूप ‘जब … दे देगा’ स्वाभाविक हिन्दी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि में बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण से रखा गया है।
- source_word: וְעָשִׂינוּ עִמָּךְ
  choice: हम तुम्हारे प्रति … व्यवहार करेंगे
  rationale: עשה עם का आशय किसी के साथ/प्रति एक प्रकार का व्यवहार करना है।
- source_word: חֶסֶד וֶאֱמֶת
  choice: निष्ठावान प्रेम और सच्चाई
  rationale: חֶסֶד की संबंधपरक निष्ठा और कृपा को ‘निष्ठावान प्रेम’ व्यक्त करता है; אֱמֶת को ‘सच्चाई’ के रूप में अलग रखा गया है। युग्म विश्वसनीय, वचनबद्ध आचरण का भाव देता है, पर मूल में स्पष्ट रूप से ‘वाचा’ शब्द न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है। ‘याहवे’ उसका निकट आधुनिक लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: חֶסֶד וֶאֱמֶת का संबंधपरक और वाचागत भाव
  choice: निष्ठावान प्रेम और सच्चाई
  alternative: दयालुता और विश्वासयोग्यता
  rationale: चुना हुआ रूप दोनों इब्रानी संज्ञाओं को अलग रखता है और गंभीर, विश्वसनीय प्रतिबद्धता का भाव बनाए रखता है। वैकल्पिक अर्थ को पादटिप्पणी में दिया गया है, जिससे पद में प्रत्यक्ष रूप से अनुपस्थित ‘वाचा’ शब्द को मुख्य पाठ में आरोपित नहीं किया जाता।
- issue: אִם לֹא के साथ शपथ-सदृश कथन
  choice: तुम्हारे प्राणों के बदले हमारे प्राण जाएँ—यदि…
  alternative: यदि…तो हम अपने प्राण देकर तुम्हारे प्राणों की रक्षा करेंगे
  rationale: मुख्य पाठ मूल की संक्षिप्त और कुछ तनावपूर्ण शपथ-रचना को बनाए रखता है; विकल्प उसका अर्थ अधिक स्पष्ट करता, पर सुरक्षा की क्रिया को मूल से अधिक निर्दिष्ट कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज रूप अपनाया गया है। ‘प्राण जाएँ’ शपथ की गंभीरता रखता है; ‘तुम लोग’ इब्रानी बहुवचन को दर्शाता है। पादटिप्पणी-चिह्न [a] संबंधित पदबंध के तुरंत बाद रखा गया है।
