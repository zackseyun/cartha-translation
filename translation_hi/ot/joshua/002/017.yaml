  yaml_path: translation/ot/joshua/002/017.yaml
  text: And the men said to her[a], “We will be free from this oath of yours that you made us swear.”
translation:
  language: hi
  text: तब उन पुरुषों ने उससे कहा, “तुमने हमें जो शपथ खिलाई है, तुम्हारी उस शपथ से हम मुक्त हैं[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम तुम्हारी इस शपथ के लिए उत्तरदायी नहीं हैं।” हिब्रू विशेषण का अर्थ वैधानिक या वाचा-संबंधी संदर्भ में किसी दायित्व अथवा दोष से मुक्त होना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब ... ने कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ प्रसंग की प्रगति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵלֶיהָ
  choice: उससे
  rationale: אֶל और स्त्रीलिंग एकवचन प्रत्यय का स्वाभाविक हिन्दी रूप; संदर्भ में संकेत राहाब की ओर है।
- source_word: הָאֲנָשִׁים
  choice: उन पुरुषों
  rationale: मूल में सामान्य संज्ञा ‘पुरुष’ है; यद्यपि वे भेदिए हैं, इस पद में उनकी भूमिका को जोड़ना उचित नहीं।
- source_word: נְקִיִּם אֲנַחְנוּ
  choice: हम मुक्त होंगे
  rationale: נָקִי शपथ अथवा वैधानिक संदर्भ में दायित्व से छूटे या निर्दोष ठहरने का भाव देता है। हिन्दी में ‘मुक्त होंगे’ अगले पद में आने वाली शर्त से जुड़े भाव को सहजता से व्यक्त करता है, जबकि पाद-टिप्पणी मूल विशेषण की वैधानिक अर्थ-सीमा बनाए रखती है।
- source_word: מִשְּׁבֻעָתֵךְ הַזֶּה
  choice: तुम्हारी उस शपथ से
  rationale: מִן अलगाव अथवा दायित्व से मुक्ति को, स्त्रीलिंग प्रत्यय ‘तुम्हारी’ को, और संकेतवाचक पद उस विशेष शपथ को दर्शाता है। हिन्दी वाक्य-विन्यास में पहले वर्णित शपथ की ओर लौटते हुए ‘उस’ स्वाभाविक है।
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: तुमने हमें जो शपथ खिलाई है
  rationale: שׁבע का हिफ़ील रूप किसी से शपथ करवाने का कारणवाचक अर्थ रखता है; ‘शपथ खिलाई’ आधुनिक हिन्दी में इसी अर्थ का प्रचलित और स्पष्ट रूप है।
theological_decisions:
- issue: נְקִיִּם का काल और वैधानिक अर्थ
  choice: हम मुक्त होंगे
  alternative: हम मुक्त हैं / हम निर्दोष हैं
  rationale: हिब्रू में विशेषण और सर्वनाम से बना नामिक वाक्य स्पष्ट क्रियाकाल नहीं बताता। अगले पद की शर्त के संदर्भ में भाव भावी परिणाम का है, इसलिए ‘होंगे’ चुना गया; ‘निर्दोष’ नैतिक निष्पापता का अनावश्यक अर्थ दे सकता है। पाद-टिप्पणी मूल की ‘दायित्व से बरी’ अर्थ-संभावना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पुरुषों’ मूल की सामान्य संज्ञा को बनाए रखता है और ‘शपथ खिलाई’ कारणवाचक हिब्रू रूप का स्वाभाविक हिन्दी समतुल्य है।
