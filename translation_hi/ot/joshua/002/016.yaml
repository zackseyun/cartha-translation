base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/016.yaml
  text: And she said to them[a], "Go to the hill country, lest the pursuers encounter you, and hide yourselves there three days, until the pursuers return[b]. Afterward you may go on your way."
translation:
  language: hi
  text: तब उसने उनसे कहा, “पहाड़ी इलाके की ओर चले जाओ,[a] कहीं ऐसा न हो कि पीछा करनेवाले तुम्हें मिल जाएँ।[b] वहाँ तीन दिन तक छिपे रहो, जब तक पीछा करनेवाले लौट न आएँ। उसके बाद तुम अपने रास्ते चले जाना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहाड़ की ओर”; इब्रानी शब्द किसी विशेष पहाड़ या आसपास के पहाड़ी क्षेत्र, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “तुमसे सामना हो” अथवा “तुम पर आ पड़ें”; इब्रानी क्रिया किसी से मिल जाने या उसका सामना होने का अर्थ दे सकती है और पीछा किए जाने के प्रसंग में इसका भाव शत्रुतापूर्ण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָרָה
  choice: पहाड़ी इलाके की ओर
  rationale: הַר किसी एक पहाड़ या पहाड़ी क्षेत्र, दोनों का बोध करा सकता है। प्रसंग में छिपने योग्य ऊबड़-खाबड़ क्षेत्र की दिशा अधिक स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לֵּכוּ
  choice: चले जाओ
  rationale: आज्ञार्थक הלך की तात्कालिकता और स्वाभाविक हिन्दी अभिव्यक्ति को बनाए रखता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: नकारात्मक आशंका अथवा सावधानी बताने वाले פֶּן का सहज आधुनिक हिन्दी समतुल्य है।
- source_word: יִפְגְּעוּ בָכֶם
  choice: तुमसे जा मिलें
  rationale: פגע ב का मूल भाव किसी से मिलना या उसका सामना होना है। 'जा मिलें' पीछा करने के इस प्रसंग में अनचाहे और संभावित रूप से शत्रुतापूर्ण सामना होने का संकेत देता है, बिना क्रिया को 'पकड़ लें' जितना प्रबल बनाए।
- source_word: הָרֹדְפִים
  choice: पीछा करनेवाले
  rationale: רדף के कर्तृवाचक कृदंत को व्यक्तिवाचक संज्ञा के रूप में सरल और सक्रिय हिन्दी में प्रस्तुत करता है।
- source_word: וְנַחְבֵּתֶם
  choice: छिपे रहना
  rationale: निफ़अल रूप का आत्मवाचक/मध्य भाव और तीन दिनों की अवधि—दोनों स्वाभाविक हिन्दी में व्यक्त होते हैं।
- source_word: שְׁלֹשֶׁת יָמִים
  choice: तीन दिन तक
  rationale: अवधि के कर्मकारक को हिन्दी में 'तक' के साथ स्पष्ट और सहज रूप दिया गया है।
- source_word: עַד שׁוֹב הָרֹדְפִים
  choice: जब तक पीछा करनेवाले लौट न आएँ
  rationale: עַד के बाद שוב का क्रियार्थक रूप प्रतीक्षा की अंतिम सीमा बताता है; हिन्दी में यह संरचना उसी समय-संबंध को स्वाभाविक रूप से व्यक्त करती है।
- source_word: וְאַחַר תֵּלְכוּ לְדַרְכְּכֶם
  choice: उसके बाद तुम अपने रास्ते चले जाना
  rationale: क्रमसूचक וְאַחַר और आगे यात्रा जारी रखने के निर्देश को सरल, गरिमापूर्ण हिन्दी में रखता है; इसे केवल अनुमति के रूप में अनावश्यक रूप से सीमित नहीं करता।
