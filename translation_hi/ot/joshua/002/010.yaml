  text: כִּ֣י שָׁמַ֗עְנוּ אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֤י יַם סוּף֙ מִ/פְּנֵי/כֶ֔ם בְּ/צֵאתְ/כֶ֖ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁ֣ר עֲשִׂיתֶ֡ם לִ/שְׁנֵי֩ מַלְכֵ֨י הָ/אֱמֹרִ֜י אֲשֶׁ֨ר בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ לְ/סִיחֹ֣ן וּ/לְ/ע֔וֹג אֲשֶׁ֥ר הֶחֱרַמְתֶּ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/010.yaml
  text: For we have heard how Yahweh dried up the water of the Red Sea before you when you came out of Egypt[a], and what you did to the two kings of the Amorites who were beyond the Jordan—to Sihon and Og—whom you devoted to destruction.
translation:
  language: hi
  text: क्योंकि हमने सुना है कि जब तुम मिस्र से निकले, तब याहवे ने तुम्हारे सामने लाल सागर[a] का जल सुखा दिया, और यह भी कि तुमने यरदन के उस पार के एमोरियों के दो राजाओं—सीहोन और ओग—के साथ क्या किया, जिन्हें तुमने विनाश के लिए समर्पित कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: याम सूफ़; परंपरागत अनुवाद ‘लाल सागर’, अधिक शाब्दिक रूप में ‘सरकंडों का सागर’।'
    reason: मूल भौगोलिक पद के परंपरागत और अधिक शाब्दिक अर्थ दोनों सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह राहाब द्वारा आसपास के संदर्भ में बताए गए भय का कारण प्रस्तुत करता है।
- source_word: שָׁמַעְנוּ
  choice: हमने सुना है
  rationale: इब्रानी पूर्ण क्रिया अतीत में सुनी हुई ऐसी बात बताती है जिसका प्रभाव वर्तमान में बना हुआ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचा-नाम का प्रचलित और स्पष्ट लिप्यंतरण।
- source_word: הוֹבִישׁ
  choice: सुखा दिया
  rationale: यבש के हिफ़ईल रूप का अर्थ किसी वस्तु को सूखा कर देना है; यह हिन्दी में स्वाभाविक कारणवाचक अभिव्यक्ति है।
- source_word: מֵי יַם סוּף
  choice: लाल सागर का पानी
  rationale: परंपरागत और व्यापक रूप से समझा जाने वाला भौगोलिक नाम मुख्य पाठ में रखा गया है; अधिक शाब्दिक विकल्प पादटिप्पणी में है।
- source_word: מִפְּנֵיכֶם
  choice: तुम्हारे सामने
  rationale: यह इस्राएलियों के आगे से पानी हटाए जाने का स्थानिक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: जब तुम मिस्र से निकले
  rationale: ב के साथ infinitive construct का समयवाचक अर्थ सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: एमोरियों के दो राजाओं
  rationale: इब्रानी संबंधवाचक संरचना को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के उस पार रहनेवाले
  rationale: वक्ता के दृष्टिकोण से राजाओं की भौगोलिक स्थिति स्पष्ट करता है।
- source_word: לְסִיחֹן וּלְעוֹג
  choice: सीहोन और ओग
  rationale: दोनों राजाओं की समानाधिकरण पहचान हिन्दी में डैश के बाद सीधे दी गई है।
- source_word: הֶחֱרַמְתֶּם
  choice: विनाश के लिए अर्पित कर दिया
  rationale: חרם की विशिष्ट धारणा—विनाश के लिए अलग या अर्पित करना—को केवल ‘नष्ट किया’ कहकर सपाट किए बिना व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम है; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में अधिक पहचाना जाने वाला रूप है और नाम को सामान्य उपाधि से नहीं बदलता।
- issue: חרם संबंधी भाषा
  choice: विनाश के लिए अर्पित कर दिया
  alternative: पूरी तरह नष्ट कर दिया
  rationale: यह युद्ध में केवल पराजित या नष्ट करने से बढ़कर, विनाश के लिए अलग किए जाने की मूल धार्मिक-वाचागत धारणा को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘रहनेवाले’ मानक संयुक्त वर्तनी में है। חרם की धार्मिक अर्थछाया को मुख्य पाठ में संक्षेप में बनाए रखा गया है।
