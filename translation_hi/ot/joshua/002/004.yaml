  yaml_path: translation/ot/joshua/002/004.yaml
  text: But the woman had taken the two men and hidden them[a], and she said, “Yes, the men came to me, but I did not know where they were from.”
translation:
  language: hi
  text: पर उस स्त्री ने उन दोनों पुरुषों को लिया और छिपा दिया था[a]। उसने कहा, “हाँ, वे पुरुष मेरे पास आए थे, लेकिन मैं नहीं जानती थी कि वे कहाँ के थे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “और उसे छिपा दिया” में कर्म-प्रत्यय एकवचन है; पर प्रसंग में दोनों पुरुष सामूहिक रूप से अभिप्रेत हैं।
    reason: textual_variant
lexical_decisions:
- source_word: וַתִּקַּח
  choice: ले जाकर
  rationale: क्रिया का मूल अर्थ ‘लेना’ है; प्रसंग में स्त्री ने दोनों पुरुषों को अपने साथ लेकर छिपाया। हिंदी में ‘ले जाकर’ अगले कार्य से स्वाभाविक रूप से जुड़ता है।
- source_word: הָאִשָּׁה
  choice: उस स्त्री
  rationale: यह राहाब को स्त्री के रूप में संदर्भित करता है, पत्नी के रूप में नहीं। पूर्वप्रसंग के ज्ञात पात्र के लिए ‘उस स्त्री’ स्वाभाविक है।
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: उन दोनों पुरुषों
  rationale: यह निश्चित रूप से उन दो इस्राएली पुरुषों की ओर संकेत करता है; ‘दोनों पुरुष’ लिंग और संख्या को स्पष्ट रखता है।
- source_word: וַתִּצְפְּנוֹ
  choice: छिपा दिया था
  rationale: मसोरेटी रूप में कर्म-प्रत्यय एकवचन है, पर प्रसंग में दोनों पुरुष सामूहिक रूप से अभिप्रेत हैं। हिंदी में बहुवचन कर्म पहले ही व्यक्त है; पूर्वकालिक ‘था’ बताता है कि उसने संदेशवाहकों को उत्तर देने से पहले उन्हें छिपा दिया था।
- source_word: כֵּן
  choice: हाँ
  rationale: यह पूछताछ में निहित बात की सीधी पुष्टि है; आधुनिक हिंदी संवाद में ‘हाँ’ सहज है।
- source_word: בָּאוּ אֵלַי הָאֲנָשִׁים
  choice: वे पुरुष मेरे पास आए थे
  rationale: वाक्य पुरुषों के उसके पास आने की पुष्टि करता है। ‘आए थे’ हिंदी कथन-क्रम में पहले घट चुकी घटना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְלֹא יָדַעְתִּי
  choice: लेकिन मैं नहीं जानती थी
  rationale: वाव यहाँ पुष्टि और उसके बाद किए गए ज्ञान के इनकार के बीच विरोध दिखाता है; ‘लेकिन’ उस संबंध को स्वाभाविक हिंदी में व्यक्त करता है। स्त्री वक्ता के कारण ‘जानती’ प्रयुक्त है।
- source_word: מֵאַיִן הֵמָּה
  choice: वे कहाँ के थे
  rationale: यह उनकी उत्पत्ति या आने के स्थान के विषय में है। ‘कहाँ के थे’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
