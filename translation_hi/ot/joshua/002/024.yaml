  text: וַ/יֹּאמְרוּ֙ אֶל יְהוֹשֻׁ֔עַ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יָדֵ֖/נוּ אֶת כָּל הָ/אָ֑רֶץ וְ/גַם נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פָּנֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/024.yaml
  text: And they said to Joshua, “Surely the LORD has given all the land into our hands, and indeed all the inhabitants of the land have melted away before us.”
translation:
  language: hi
  text: उन्होंने यहोशू से कहा, “निश्चय ही यहोवा ने सारा देश हमारे हाथों में दे दिया है, और उस देश के सभी निवासी हमारे सामने हिम्मत हार गए हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: निश्चय ही
  rationale: यहाँ כִּי गुप्तचरों के निष्कर्ष को दृढ़तापूर्वक प्रस्तुत करता है; इसलिए केवल कारणसूचक ‘क्योंकि’ के बजाय निश्चयवाचक अर्थ चुना गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से व्यक्त किया गया।
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: हमारे हाथ में कर दिया है
  rationale: हिब्रू मुहावरे और पूर्ण क्रिया के विश्वासपूर्ण, परिणामी भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נָמֹגוּ
  choice: साहस खो बैठे हैं
  rationale: मूल का शाब्दिक अर्थ ‘पिघल गए’ है, पर प्रसंग में यह भय से हिम्मत टूट जाने का मुहावरा है; अर्थ को आधुनिक हिन्दी में स्पष्ट किया गया।
- source_word: מִפָּנֵינוּ
  choice: हमारे कारण
  rationale: यह भय की वजह अथवा इस्राएल का सामना करने के प्रभाव को दर्शाता है; सहज हिन्दी में कारणसूचक रूप उपयुक्त है।
theological_decisions:
- issue: देश दिए जाने की पूर्णता
  choice: कर दिया है
  alternative: दे देगा
  rationale: נָתַן पूर्ण रूप में है और वक्ता परमेश्वर की प्रतिज्ञा की निश्चितता को वर्तमान में पूर्ण तथ्य की तरह स्वीकार करते हैं; भविष्यकाल से इसे कमजोर नहीं किया गया।
- issue: निवासियों की दशा का चित्रण
  choice: साहस खो बैठे हैं
  alternative: पिघल गए हैं
  rationale: मूल रूपक भय और मनोबल टूटने को व्यक्त करता है। अर्थ-स्पष्ट रूप चुना गया, बिना इसे विनाश या शारीरिक घटना के रूप में समझाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। प्रत्यक्ष वचन में दृढ़ता रखी गई है और अनावश्यक व्याख्या नहीं जोड़ी गई।
