  text: And the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh crossed over armed before the sons of Israel[c][b], just as Moses had spoken to them.
translation:
  language: hi
  text: रूबेन के पुत्र[a], गाद के पुत्र और मनश्शे का आधा गोत्र हथियारबंद[c] होकर इस्राएल के पुत्रों[b] के आगे पार गए, जैसा मूसा ने उनसे कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रूबेनियों, गादियों और मनश्शे के आधे गोत्र।’ इब्रानी में अधिक शाब्दिक रूप से ‘रूबेन के पुत्र ... गाद के पुत्र ...’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘इस्राएलियों।’ इब्रानी में अधिक शाब्दिक रूप से ‘इस्राएल के पुत्रों’ है।
    reason: lexical_alternative
  - marker: c
    text: ‘हथियारबंद’ के लिए प्रयुक्त इब्रानी शब्द युद्ध के लिए सुसज्जित या युद्ध-क्रम में व्यवस्थित होने का अर्थ दे सकता है; इसका अनुवाद ‘युद्ध-पंक्तियों में व्यवस्थित’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: पार गए
  rationale: इस कथा-संदर्भ में עבר यरदन नदी पार करने को सूचित करता है। ‘पार गए’ स्वाभाविक हिन्दी है और दिशा-संबंधी अर्थ बनाए रखता है।
- source_word: בְּנֵי רְאוּבֵן
  choice: रूबेन के पुत्र
  rationale: इब्रानी का शाब्दिक संबंधसूचक रूप ‘रूबेन के पुत्र’ है। इसे मुख्य पाठ में रखने से मूल की वंशगत अभिव्यक्ति दिखाई देती है।
- source_word: וּבְנֵי גָד
  choice: गाद के पुत्र
  rationale: ‘रूबेन के पुत्र’ के अनुरूप मूल की समान संबंधसूचक रचना को सुरक्षित रखा गया है।
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: मनश्शे का आधा गोत्र
  rationale: यह construct chain का स्पष्ट और प्रचलित हिन्दी रूप है तथा जनजातीय पहचान को ठीक बनाए रखता है।
- source_word: חֲמֻשִׁים
  choice: हथियारबंद
  rationale: संदर्भ में यह युद्ध के लिए सुसज्जित अथवा व्यवस्थित होने का भाव देता है। ‘हथियारबंद’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है; संभावित ‘युद्ध-पंक्तियों में व्यवस्थित’ अर्थ को पादटिप्पणी में रखा गया है।
- source_word: לִפְנֵי
  choice: के आगे
  rationale: यह शेष इस्राएल के सामने या आगे उनकी स्थिति बताता है। ‘के आगे’ स्वाभाविक और स्थानगत अर्थ में स्पष्ट है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल इब्रानी की संबंधसूचक अभिव्यक्ति को पारदर्शी रूप से बनाए रखा गया है; अधिक मुहावरेदार ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: כַּאֲשֶׁר
  choice: ठीक जैसा
  rationale: यह मूसा के पहले दिए निर्देश के अनुरूप कार्य होने को व्यक्त करता है।
- source_word: דִּבֶּר אֲלֵיהֶם מֹשֶׁה
  choice: मूसा ने उनसे कहा था
  rationale: हिन्दी का पूर्ण भूतकाल उस कथन को पार जाने की घटना से पहले का दिखाता है। ‘कहा था’ דבר का स्वाभाविक रूप है और उसे अनावश्यक रूप से किसी अधिक विशिष्ट आदेश-संज्ञा में नहीं बदलता।
