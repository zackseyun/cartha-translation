source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֞ים נֹשְׂאֵ֣י הָ/אָר֗וֹן עֹמְדִים֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ עַ֣ד תֹּ֣ם כָּֽל הַ֠/דָּבָר אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת יְהוֹשֻׁ֨עַ֙ לְ/דַבֵּ֣ר אֶל הָ/עָ֔ם כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְמַהֲר֥וּ הָ/עָ֖ם וַֽ/יַּעֲבֹֽרוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/010.yaml
  text: And the priests carrying the ark stood in the midst of the Jordan until everything was finished that Yahweh had commanded Joshua to speak to the people[a], according to all that Moses had commanded Joshua. And the people hurried and crossed over.
translation:
  language: hi
  text: और सन्दूक को उठाए हुए याजक यरदन के बीच में तब तक खड़े रहे, जब तक वह सब पूरा न हो गया जिसे यहोवा ने यहोशू को लोगों से कहने की आज्ञा दी थी[a], मूसा ने यहोशू को जो कुछ आज्ञा दी थी उसके अनुसार। और लोगों ने जल्दी से नदी पार की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “जब तक सारी बात पूरी न हो गई”; यह वाक्यांश उस सबके पूरा होने का सार प्रस्तुत करता है जिसे यहोवा ने यहोशू को लोगों से कहने की आज्ञा दी थी।'
    reason: मूल इब्रानी मुहावरे और דָּבָר (‘बात, वचन, विषय’) के व्यापक अर्थ को दिखाना।
lexical_decisions:
- source_word: הַכֹּהֲנִים נֹשְׂאֵי הָאָרוֹן
  choice: सन्दूक उठाए हुए याजक
  rationale: इब्रानी सहभागी पदबंध याजकों की जारी क्रिया बताता है। ‘उठाए हुए’ स्वाभाविक हिन्दी है और सन्दूक ढोने का भाव स्पष्ट करता है।
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: यरदन के बीच में
  rationale: בְּתוֹךְ का स्थानगत अर्थ ‘बीच में’ है; प्रसंग से स्पष्ट है कि यरदन नदी अभिप्रेत है।
- source_word: עַד תֹּם כָּל הַדָּבָר
  choice: जब तक वह सब पूरा न हो गया
  rationale: शाब्दिक रूप से ‘जब तक सारी बात/विषय पूरा न हुआ।’ हिन्दी में यह सामूहिक अर्थ स्वाभाविक ढंग से व्यक्त करता है, जबकि पादटिप्पणी मूल अभिव्यक्ति की व्यापकता बताती है।
- source_word: לְדַבֵּר אֶל הָעָם
  choice: लोगों से कहने
  rationale: דבר אל का अर्थ ‘लोगों से बोलना/कहना’ है। यहाँ आज्ञा की विषयवस्तु सुनाने के सन्दर्भ में ‘कहने’ सहज है।
- source_word: כְּכֹל אֲשֶׁר צִוָּה מֹשֶׁה אֶת יְהוֹשֻׁעַ
  choice: ठीक वैसे ही जैसे मूसा ने यहोशू को आज्ञा दी थी
  rationale: כְּכֹל अनुरूपता और सम्पूर्णता व्यक्त करता है; ‘ठीक वैसे ही’ इसे स्पष्ट और प्रवाहपूर्ण हिन्दी में रखता है।
- source_word: וַיְמַהֲרוּ הָעָם וַיַּעֲבֹרוּ
  choice: तब लोगों ने जल्दी से नदी पार की
  rationale: מהר की शीघ्रता और עבר की नदी-पार गति दोनों सुरक्षित हैं। हिन्दी में कर्म ‘नदी’ जोड़ना प्रसंग से निहित अर्थ को स्वाभाविक बनाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय वाचा-नाम सीधे आया है। हिन्दी बाइबल परम्परा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है; ‘याहवे’ अधिक सम्भावित प्राचीन उच्चारण का प्रतिनिधित्व करता है।
- issue: मूसा की आज्ञा और यहोवा की आज्ञा के सम्बन्ध की अभिव्यक्ति
  choice: दोनों उपवाक्यों को मूल क्रम और निकट सम्बन्ध में रखा गया
  alternative: इसे स्पष्ट करना कि यहोवा ने वही सब कहने को कहा था जो मूसा ने पहले आदेश दिया था
  rationale: इब्रानी वाक्य सम्बन्ध को संक्षेप में रखता है और उसके सटीक तार्किक विस्तार को नहीं खोलता। अनुवाद इस सम्भावित तनाव या अस्पष्टता को व्याख्यात्मक विस्तार से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक रूप अपनाया गया है। ‘सन्दूक’ प्रसंग में वाचा के सन्दूक को सूचित करता है; इस पद में मूल पाठ केवल निश्चित ‘सन्दूक’ कहता है, इसलिए मुख्य पाठ में अतिरिक्त धार्मिक विशेषण नहीं जोड़ा गया। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
