  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְהוֹשֻׁ֔עַ עִ֠בְרוּ לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה אֱלֹֽהֵי/כֶ֖ם אֶל תּ֣וֹךְ הַ/יַּרְדֵּ֑ן וְ/הָרִ֨ימוּ לָ/כֶ֜ם אִ֣ישׁ אֶ֤בֶן אַחַת֙ עַל שִׁכְמ֔/וֹ לְ/מִסְפַּ֖ר שִׁבְטֵ֥י בְנֵי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/005.yaml
  text: And Joshua said to them[a], “Cross over before the ark of Yahweh your God into the middle of the Jordan, and let each man lift up one stone on his shoulder, according to the number of the tribes of the sons of Israel.”
translation:
  language: hi
  text: तब यहोशू ने उनसे कहा, “याहवे, अपने परमेश्वर, के सन्दूक के सामने से होकर यरदन के बीच में जाओ। इस्राएल के पुत्रों[a] के गोत्रों की गिनती के अनुसार तुममें से हर पुरुष अपने कंधे पर एक पत्थर उठा ले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “इस्राएल के पुत्र।” यह हिब्रू की औपचारिक वाचाई अभिव्यक्ति है; इसे “इस्राएली” या “इस्राएल के लोग” भी कहा जा सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: हिब्रू कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में आगे बढ़ाता है; ‘तब’ घटनाक्रम बताता है, पर अनावश्यक कारण-संबंध नहीं जोड़ता।
- source_word: עִבְרוּ לִפְנֵי
  choice: के आगे से पार होकर
  rationale: עבר की पार जाने की गति और לִפְנֵי की सन्दूक के सामने/आगे वाली स्थानिक स्थिति—दोनों को बनाए रखता है।
- source_word: אֲרוֹן יְהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर याहवे के सन्दूक
  rationale: सम्बन्धवाचक हिब्रू पदक्रम को स्पष्ट हिन्दी में व्यक्त करता है और वाचा के नाम को लिप्यंतरित करता है।
- source_word: אֶל תּוֹךְ הַיַּרְדֵּן
  choice: यरदन के बीच में
  rationale: תּוֹךְ नदी के केवल भीतर नहीं, उसके मध्य भाग की ओर जाने का संकेत देता है।
- source_word: וְהָרִימוּ לָכֶם
  choice: फिर ... उठा ले
  rationale: हिफ़ील आज्ञार्थक का यहाँ पत्थर उठाने का अर्थ है; हिन्दी का एकवचन distributive आदेश आगामी ‘हर पुरुष’ से मेल खाता है।
- source_word: אִישׁ
  choice: तुममें से हर पुरुष
  rationale: प्रसंग में प्रत्येक गोत्र से चुना गया एक पुरुष प्रतिनिधि अभिप्रेत है; यह पुल्लिंग और वितरणात्मक अर्थ दोनों स्पष्ट करता है।
- source_word: אֶבֶן אַחַת עַל שִׁכְמוֹ
  choice: अपने कंधे पर एक पत्थर
  rationale: एकवचन संज्ञा, संख्या और सर्वनामिक प्रत्यय को सीधे बनाए रखता है।
- source_word: לְמִסְפַּר שִׁבְטֵי
  choice: गोत्रों की गिनती के अनुसार
  rationale: पत्थरों/पुरुषों की संख्या और गोत्रों की संख्या के बीच अनुरूपता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: हिब्रू के औपचारिक वाचाई पद को संक्षिप्त करके केवल ‘इस्राएली’ नहीं बनाया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम प्रत्यक्ष है; ‘याहवे’ उसका व्यापक रूप से स्वीकृत हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: אִישׁ और בְנֵי יִשְׂרָאֵל में लिंग-सूचक भाषा
  choice: हर पुरुष ... इस्राएल के पुत्रों
  alternative: हर व्यक्ति ... इस्राएलियों
  rationale: तात्कालिक प्रसंग में गोत्रों के पुरुष प्रतिनिधि हैं और मूल पाठ पुल्लिंग रूपों का प्रयोग करता है; इसलिए लिंग-निरपेक्ष करके अर्थ को समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘सन्दूक’, ‘गोत्र’ और ‘याहवे’ जैसे बाइबलीय पद प्रसंग की धार्मिक और ऐतिहासिक विशिष्टता बनाए रखते हैं।
