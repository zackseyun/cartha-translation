source:
  edition: WLC
  text: וּ/שְׁתֵּ֧ים עֶשְׂרֵ֣ה אֲבָנִ֗ים הֵקִ֣ים יְהוֹשֻׁעַ֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ תַּ֗חַת מַצַּב֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הַ/בְּרִ֑ית וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/009.yaml
  text: And Joshua set up twelve stones in the midst of the Jordan[a], under the place where the feet of the priests carrying the ark of the covenant stood, and they are there to this day.
translation:
  language: hi
  text: और यहोशू ने यरदन के बीच में बारह पत्थर उस स्थान के नीचे[a] खड़े किए, जहाँ वाचा का संदूक उठाए हुए याजकों के पाँव टिके थे; और वे आज तक वहीं हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वाचा का संदूक उठाने वाले याजकों के पाँवों के खड़े रहने के स्थान के नीचे।” इब्रानी अभिव्यक्ति उस स्थान को बताती है जहाँ याजक संदूक उठाए खड़े थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵקִים
  choice: खड़े किए
  rationale: हिफ़ील रूप यहाँ पत्थरों को स्मारक के रूप में स्थापित करने का अर्थ देता है; ‘खड़े किए’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: यरदन के बीच में
  rationale: תּוֹךְ नदी के मध्य अथवा भीतरी भाग को दर्शाता है; यह अनुवाद स्थान-संबंधी कथन को स्पष्ट रखता है।
- source_word: תַּחַת מַצַּב רַגְלֵי
  choice: ठीक उस स्थान पर जहाँ ... के पाँव टिके थे
  rationale: מַצָּב का आशय खड़े होने की जगह या स्थिति से है। अत्यधिक शाब्दिक हिंदी अस्वाभाविक होती, इसलिए यह रूप स्थानगत अर्थ को सहज ढंग से व्यक्त करता है; ‘ठीक’ תַּחַת की सटीक स्थान-संबंधी शक्ति को उभारता है।
- source_word: נֹשְׂאֵי אֲרוֹן הַבְּרִית
  choice: वाचा का संदूक उठाए हुए
  rationale: कृदंत याजकों को संदूक उठाकर ले जाने वालों के रूप में वर्णित करता है; ‘उठाए हुए’ आधुनिक हिंदी में स्पष्ट है।
- source_word: וַיִּהְיוּ שָׁם
  choice: और वे ... वहीं हैं
  rationale: ‘आज तक’ वाले मुहावरे के साथ यह कथाकार के समय तक जारी स्थिति को व्यक्त करता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह मानक हिंदी मुहावरा कथाकार के वर्तमान समय तक बने रहने का अर्थ देता है।
theological_decisions:
- issue: आसपास के प्रसंग में गिलगाल पर खड़े किए गए बारह पत्थरों और इस पद में यरदन के भीतर के बारह पत्थरों के बीच कथात्मक तनाव
  choice: पद को सीधे इस प्रकार अनूदित किया गया है कि यहोशू ने यरदन के बीच में बारह पत्थर खड़े किए।
  alternative: इसे यरदन से निकाले गए और बाद में किसी अन्य स्थान पर खड़े किए गए पत्थरों का सारांश मानना, या दोनों विवरणों में सामंजस्य बैठाने के लिए पाठ बदलना।
  rationale: इब्रानी पाठ स्पष्ट रूप से יְהוֹשֻׁעַ और בְּתוֹךְ הַיַּרְדֵּן कहता है। अनुवाद को इस कथन को बनाए रखना चाहिए, न कि तनाव को चुपचाप दूर करना चाहिए।
- issue: עַד הַיּוֹם הַזֶּה स्मारक-सूत्र का कालगत बल
  choice: कथाकार के दृष्टिकोण से जारी स्थिति के रूप में ‘वे आज तक वहीं हैं।’
  alternative: ‘वे आज तक वहीं थे।’
  rationale: यह कथाकार के समय तक स्थिति के बने रहने को व्यक्त करता है, बिना आधुनिक पाठक के वर्तमान तक उनके अस्तित्व का दावा किए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। ‘वाचा का संदूक’ और ‘याजक’ जैसे स्थापित बाइबलीय पद रखे गए हैं। मुख्य पाठ में अस्वाभाविक शाब्दिकता से बचते हुए स्थान-संबंधी सूक्ष्मता को पादटिप्पणी में सुरक्षित रखा गया है।
