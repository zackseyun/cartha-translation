  text: צַוֵּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הָ/עֵד֑וּת וְ/יַעֲל֖וּ מִן הַ/יַּרְדֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/016.yaml
  text: Command the priests who carry the ark of the testimony to come up from the Jordan[a].
translation:
  language: hi
  text: “गवाही का सन्दूक[a] उठानेवाले याजकों को आज्ञा दे कि वे यरदन में से निकलकर ऊपर आएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “साक्षी का सन्दूक।” यहाँ इब्रानी पाठ में “वाचा” नहीं, बल्कि “गवाही” या “साक्षी” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוֵּה
  choice: आज्ञा दे
  rationale: द्वितीय पुरुष एकवचन की सीधी आज्ञा है; यह क्रिया के आदेशात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: निश्चित बहुवचन संज्ञा का मानक और सन्दर्भानुकूल हिन्दी रूप।
- source_word: נֹשְׂאֵי
  choice: उठानेवाले
  rationale: वर्तमान कृदन्त याजकों का वर्णन करता है; हिन्दी में सम्बन्धसूचक कृदन्त स्वाभाविक है और सन्दूक को ढोने का भाव व्यक्त करता है।
- source_word: אֲרוֹן הָעֵדוּת
  choice: गवाही का सन्दूक
  rationale: मूल इब्रानी में עֵדוּת का अर्थ ‘गवाही/साक्षी’ है; इसलिए अधिक परिचित ‘वाचा का सन्दूक’ कहकर पाठ का सामंजस्य नहीं किया गया।
- source_word: וְיַעֲלוּ
  choice: कि वे ... निकलकर ऊपर आएँ
  rationale: עלה के ऊपर आने के स्थानिक भाव को नदी से बाहर आने के प्रसंग में स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: מִן הַיַּרְדֵּן
  choice: यरदन में से
  rationale: מן नदी के भीतर से बाहर की ओर गति दिखाता है; ‘में से’ प्रसंग को बिना ‘नदी’ शब्द जोड़े स्पष्ट करता है।
theological_decisions:
- issue: सन्दूक के नाम में ‘गवाही’ और ‘वाचा’ का भेद
  choice: गवाही का सन्दूक
  alternative: वाचा का सन्दूक
  rationale: इस पद के इब्रानी पाठ में עֵדוּת (‘गवाही/साक्षी’) है, בְּרִית (‘वाचा’) नहीं; इसलिए परिचित धार्मिक पदावली के कारण मूल पाठ का विशिष्ट शब्द नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘आज्ञा दे’ आदेश की दृढ़ता बनाए रखता है, जबकि ‘निकलकर ऊपर आएँ’ नदी के तल से बाहर आने की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
