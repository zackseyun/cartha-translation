  text: לְ֠מַעַן דַּ֜עַת כָּל עַמֵּ֤י הָ/אָ֨רֶץ֙ אֶת יַ֣ד יְהוָ֔ה כִּ֥י חֲזָקָ֖ה הִ֑יא לְמַ֧עַן יְרָאתֶ֛ם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם כָּל הַ/יָּמִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/024.yaml
  text: so that all the peoples of the earth may know that the hand of Yahweh is strong[b][a], and so that you may fear Yahweh your God all your days.
translation:
  language: hi
  text: ताकि पृथ्वी के सब लोग जान लें कि यहोवा का हाथ शक्तिशाली है[a], और ताकि तुम जीवन भर यहोवा, अपने परमेश्वर, का भय मानो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देश के सब लोग,” यदि הָאָרֶץ को वैश्विक ‘पृथ्वी’ के बजाय स्थानीय अर्थ में समझा जाए।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भय मानना” केवल आतंकित होना नहीं, बल्कि यहोवा के प्रति श्रद्धा और विस्मय रखना भी समेटे हुए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן דַּעַת
  choice: ताकि ... जान लें
  rationale: לְמַעַן उद्देश्य व्यक्त करता है और उसके बाद आया infinitive construct דַּעַת इच्छित परिणाम को दर्शाता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: पृथ्वी के सब लोग
  rationale: עַמֵּי का अर्थ सामूहिक ‘लोग/जन’ है और इस प्रसंग में הָאָרֶץ का वैश्विक अर्थ अधिक उपयुक्त है; स्थानीय अर्थ ‘देश’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: יַד יְהוָה
  choice: यहोवा का हाथ
  rationale: मूल इब्रानी मानवीय बिंब को ‘सामर्थ्य’ कहकर समतल करने के बजाय सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के विशिष्ट वाचा-नाम को हिन्दी के प्रचलित रूप ‘यहोवा’ में प्रत्यक्ष रखा गया है।
- source_word: כִּי חֲזָקָה הִיא
  choice: शक्तिशाली है
  rationale: स्त्रीलिंग सर्वनाम הִיא पीछे आए ‘हाथ’ की ओर संकेत करता है; ‘शक्तिशाली’ חֲזָקָה का अर्थ और इस मुहावरे में निहित सामर्थ्य स्पष्ट करता है।
- source_word: יְרָאתֶם
  choice: भय मानते रहो
  rationale: ירא के भय, श्रद्धा और विस्मय के तनाव को ‘भय मानना’ सुरक्षित रखता है; रूप यहाँ उद्देश्य के भीतर जारी जीवन-वृत्ति को व्यक्त करता है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: यहोवा इसका संदर्भ है, इसलिए रूप अर्थ की दृष्टि से एकवचन उपाधि ‘परमेश्वर’ है; ‘अपने’ हिन्दी में द्वितीय पुरुष बहुवचन संबंध को स्वाभाविक बनाता है।
- source_word: כָּל הַיָּמִים
  choice: जीवन भर
  rationale: शाब्दिक ‘सब दिनों’ का आशय निरंतर, आजीवन अवधि है; ‘जीवन भर’ आधुनिक हिन्दी में वही अर्थ सहज रूप से देता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पाठ में वाचा-नाम प्रत्यक्ष है; उसे सामान्य उपाधि से बदलने के बजाय हिन्दी में परिचित नामरूप रखा गया है।
- issue: ירא में भय और श्रद्धा का संबंध
  choice: भय मानते रहो
  alternative: श्रद्धा रखते रहो
  rationale: केवल ‘श्रद्धा’ कहना मूल के भय और पवित्र विस्मय को नरम कर सकता है। मुख्य पाठ सीधा शब्द रखता है और पादटिप्पणी उसकी व्यापक अर्थ-सीमा बताती है।
- issue: הָאָרֶץ का वैश्विक या स्थानीय अर्थ
  choice: पृथ्वी
  alternative: देश
  rationale: यहोवा के कार्य के व्यापक सार्वजनिक ज्ञान का प्रसंग वैश्विक अर्थ का समर्थन करता है, पर स्थानीय अर्थ व्याकरणतः संभव होने के कारण पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। इब्रानी का ‘हाथ’ वाला बिंब सुरक्षित है। दोनों उद्देश्य-वाक्यों को ‘ताकि’ से स्पष्ट किया गया है; ‘जीवन भर’ כָּל הַיָּמִים का स्वाभाविक हिन्दी रूप है।
