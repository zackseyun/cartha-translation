    text: या, “जिन्हें उसने तैयार किया था” अथवा “जिन्हें उसने ठहराया था।”
    reason: lexical_alternative
  - marker: b
    text: या, “इस्राएलियों में से।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों में से” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाया
  rationale: קרא के इस प्रयोग में यहोशू चुने हुए पुरुषों को अपने पास बुलाता है। ‘बुलाया’ स्वाभाविक आधुनिक हिन्दी है; ‘आह्वान किया’ प्रसंग की अपेक्षा अधिक औपचारिक और प्रबल होता।
- source_word: שְׁנֵים הֶעָשָׂר אִישׁ
  choice: उन बारह पुरुषों
  rationale: संदर्भ में यह पहले से पहचाना हुआ निश्चित समूह है, इसलिए ‘उन बारह पुरुषों’ से कथन का संकेत स्पष्ट होता है।
- source_word: אֲשֶׁר הֵכִין
  choice: जिन्हें उसने ... नियुक्त किया था
  rationale: הכין का अर्थ तैयार करना, ठहराना या नियुक्त करना हो सकता है। यहाँ गोत्रों के प्रतिनिधियों के पूर्व चयन का संदर्भ होने के कारण ‘नियुक्त किया था’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों में से
  rationale: यह चयन मूल इब्रानी की संरचना ‘इस्राएल के पुत्र’ को बनाए रखता है। यह इस्राएल के वंशजों के लिए सामूहिक जातीय पद है; अधिक मुहावरेदार विकल्प ‘इस्राएलियों में से’ पादटिप्पणी में दिया गया है।
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד מִשָּׁבֶט
  choice: हर गोत्र में से एक पुरुष
  rationale: इब्रानी की वितरणसूचक पुनरुक्ति का स्वाभाविक हिन्दी रूप ‘हर गोत्र में से एक पुरुष’ है; इससे प्रत्येक गोत्र के एक प्रतिनिधि का भाव सुरक्षित रहता है।
