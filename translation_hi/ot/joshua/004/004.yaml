translation:
  language: hi
  text: तब यहोशू ने उन बारह पुरुषों को बुलाया, जिन्हें उसने इस्राएल के पुत्रों[b] में से नियुक्त किया था[a]—हर गोत्र में से एक पुरुष।
  philosophy: optimal-equivalence
  footnotes:
