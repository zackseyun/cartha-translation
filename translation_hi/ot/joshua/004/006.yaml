- issue: पत्थरों के विषय में प्रश्न का आशय
  choice: इन पत्थरों का तुम्हारे लिए क्या अर्थ है?
  alternative: ये पत्थर तुम्हारे लिए क्या हैं?
  rationale: अर्थ/महत्त्व पूछना प्रसंग से निहित है; फिर भी अधिक शाब्दिक संरचना को पादटिप्पणी में सुरक्षित रखा गया है।
