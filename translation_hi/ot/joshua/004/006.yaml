  choice: इन पत्थरों का तुम्हारे लिए क्या अर्थ है?
  rationale: शाब्दिक संरचना ‘ये पत्थर तुम्हारे लिए क्या हैं?’ है; चुना हुआ रूप प्रश्न के आशय—पत्थरों के महत्त्व—को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: בְּנֵיכֶם में लिंग-सूचक भाषा
  choice: तुम्हारे बच्चे
  alternative: तुम्हारे पुत्र
