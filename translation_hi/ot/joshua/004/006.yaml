  text: ताकि यह तुम्हारे बीच एक चिन्ह हो। जब आने वाले समय में[c] तुम्हारे बच्चे[a] पूछें, “इन पत्थरों का तुम्हारे लिए क्या अर्थ है?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “तुम्हारे पुत्र”; यहाँ आशय अगली पीढ़ी, अर्थात् बच्चों से है।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक रूप से: “ये पत्थर तुम्हारे लिए क्या हैं?”'
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक शब्द “कल” है; यहाँ इसका मुहावरेदार अर्थ “आने वाले समय में” या “भविष्य में” है।
    reason: lexical_alternative
