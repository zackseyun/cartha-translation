base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/019.yaml
  text: And the people came up from the Jordan on the tenth day of the first month[b][a], and they camped at Gilgal on the eastern border of Jericho.
translation:
  language: hi
  text: और लोग पहले महीने के दसवें दिन यरदन से ऊपर आए[a] और यरीहो के पूर्वी छोर पर स्थित गिलगाल में उन्होंने डेरा डाला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ऊपर गए’।
    reason: lexical_alternative
  - marker: b
    text: या ‘और उन्होंने यरीहो के पूर्व में गिलगाल में डेरा डाला।’
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלוּ
  choice: ऊपर आए
  rationale: עלה में ऊपर की ओर जाने या आने का भाव है; नदी से बाहर निकलने के संदर्भ में ‘ऊपर आए’ स्वाभाविक और दिशात्मक अर्थ को बनाए रखता है।
- source_word: מִן הַיַּרְדֵּן
  choice: यरदन से
  rationale: यह पदबंध यरदन से बाहर की ओर गति बताता है; संदर्भ में ‘यरदन’ नदी को स्पष्ट रूप से सूचित करता है।
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: पहले महीने के दसवें दिन
  rationale: इब्रानी तिथि-सूत्र को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: וַיַּחֲנוּ
  choice: उन्होंने डेरा डाला
  rationale: חנה का अर्थ पड़ाव डालना है; ‘डेरा डाला’ आधुनिक हिन्दी में सहज और कथात्मक है।
- source_word: בַּגִּלְגָּל
  choice: गिलगाल में
  rationale: स्थान-नाम का लिप्यंतरण किया गया है और पड़ाव के स्थान के लिए ‘में’ स्वाभाविक है।
- source_word: בִּקְצֵה מִזְרַח יְרִיחוֹ
  choice: यरीहो के पूर्वी छोर पर
  rationale: קצה छोर/किनारा और מזרח पूर्व दिशा को सूचित करता है; यह अनुवाद सम्भावित भौगोलिक संबंध को औपचारिक किन्तु सहज हिन्दी में रखता है।
