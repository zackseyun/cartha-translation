- source_word: מִן הָעָם
  choice: लोगों में से
  rationale: यह इस्राएली समुदाय के बीच से व्यक्तियों को लेने का भाव स्वाभाविक और स्पष्ट रूप में देता है।
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: बारह पुरुषों
  rationale: אֲנָשִׁים यहाँ बारह वयस्क पुरुषों को सूचित करता है; इसलिए लिंग-सटीक अनुवाद रखा गया है।
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: हर ... में से एक पुरुष
  rationale: इब्रानी पुनरुक्ति का वितरणात्मक अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מִשָּׁבֶט
  choice: गोत्र
  rationale: यहोशू के प्रसंग में שֵׁבֶט इस्राएल के बारह जनजातीय विभागों में से एक को दर्शाता है; हिन्दी बाइबलीय प्रयोग में ‘गोत्र’ सटीक और परिचित है।
