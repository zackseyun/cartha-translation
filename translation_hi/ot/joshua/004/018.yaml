source:
  edition: WLC
  text: וַ֠/יְהִי ב/עלות הַ/כֹּהֲנִ֜ים נֹשְׂאֵ֨י אֲר֤וֹן בְּרִית יְהוָה֙ מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֔ן נִתְּק֗וּ כַּפּוֹת֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים אֶ֖ל הֶ/חָרָבָ֑ה וַ/יָּשֻׁ֤בוּ מֵֽי הַ/יַּרְדֵּן֙ לִ/מְקוֹמָ֔/ם וַ/יֵּלְכ֥וּ כִ/תְמוֹל שִׁלְשׁ֖וֹם עַל כָּל גְּדוֹתָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/018.yaml
  text: And it happened[a], when the priests carrying the ark of the covenant of Yahweh came up from the midst of the Jordan, and the soles of the priests’ feet were lifted up to the dry ground[b], that the waters of the Jordan returned to their place and went as before over all its banks.
translation:
  language: hi
  text: और ऐसा हुआ कि जब यहोवा की वाचा का संदूक उठाए हुए याजक यरदन के बीच से ऊपर आए और याजकों के पाँवों के तलवे सूखी भूमि पर आ लगे[a], तब यरदन का पानी अपने स्थान पर लौट आया और पहले की तरह[b] अपने सभी किनारों के ऊपर बहने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पदबंध का अधिक शाब्दिक अनुवाद हो सकता है: “याजकों के पाँवों के तलवे सूखी भूमि की ओर खींच लिए गए।”'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “कल और परसों की तरह”; यह एक इब्रानी मुहावरा है, जिसका अर्थ है “पहले की तरह” या “पूर्ववत।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בעלות
  choice: जब ... ऊपर आए
  rationale: ב के साथ infinitive construct यहाँ समय बताता है; नदी के तल से बाहर आने की गति के लिए ‘ऊपर आए’ स्वाभाविक और सटीक है।
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: यहोवा की वाचा का संदूक उठाए हुए
  rationale: नשׂא के कृदन्तीय भाव और इब्रानी construct chain को स्पष्ट, सहज हिन्दी में रखा गया है; יהוה को व्यक्तिगत नाम ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: यरदन के बीच से
  rationale: תוך नदी के भीतर या मध्य भाग को सूचित करता है, केवल किनारे को नहीं।
- source_word: נִתְּקוּ כַּפּוֹת רַגְלֵי הַכֹּהֲנִים אֶל הֶחָרָבָה
  choice: याजकों के पाँवों के तलवे सूखी भूमि पर आ लगे
  rationale: शाब्दिक निष्क्रिय अभिव्यक्ति हिन्दी में असहज होगी। यह चयन नदी के तल से पाँव उठने और सूखी भूमि से लगने की क्रिया को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘तलवे’ मूल के כַּפּוֹת רַגְלֵי को बनाए रखता है।
- source_word: וַיָּשֻׁבוּ מֵי הַיַּרְדֵּן לִמְקוֹמָם
  choice: यरदन का पानी अपने स्थान पर लौट आया
  rationale: पानी की सामूहिक संज्ञा के अनुरूप स्वाभाविक हिन्दी प्रयोग करते हुए मूल में पानी के लौटने की सजीव गति सुरक्षित रखी गई है।
- source_word: כִתְמוֹל שִׁלְשׁוֹם
  choice: पहले की तरह
  rationale: शाब्दिक अर्थ ‘कल और परसों की तरह’ है, पर यह इब्रानी मुहावरा पूर्ववत अवस्था को व्यक्त करता है।
- source_word: וַיֵּלְכוּ ... עַל כָּל גְּדוֹתָיו
  choice: अपने सभी किनारों के ऊपर बहने लगा
  rationale: הלך का सामान्य अर्थ ‘चलना/जाना’ है, पर पानी के प्रसंग में ‘बहना’ वर्तमान हिन्दी में अपेक्षित अर्थ स्पष्ट करता है; बहुवचन גדותיו को ‘सभी किनारों’ से रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी बाइबल-पाठकों में परिचित रूप ‘यहोवा’ नाम होने का भाव सुरक्षित रखता है।
