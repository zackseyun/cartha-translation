  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। ‘वाचा का संदूक’, ‘याजक’ और ‘यरदन’ जैसे स्थापित बाइबलीय पद बनाए रखे गए हैं; अत्यधिक शाब्दिक और अस्वाभाविक वाक्य-विन्यास से बचते हुए घटनाक्रम का क्रम स्पष्ट रखा गया है।
