    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह हिब्रू कथात्मक सूत्र नए घटनाक्रम का परिचय देता है; यह रूप उसके कथात्मक कार्य को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כַּאֲשֶׁר
  choice: जब
  rationale: यह उस समयसूचक उपवाक्य को आरम्भ करता है जो मुख्य कथन से पहले पूरी हुई घटना बताता है।
- source_word: תַּמּוּ ... לַעֲבוֹר
  choice: पार कर चुकी
  rationale: תמם पूर्णता का भाव देता है; स्त्रीलिंग एकवचन क्रिया सामूहिक संज्ञा ‘जाति’ के अनुरूप है और मुख्य क्रिया से पहले कार्य पूरा हो चुका था।
- source_word: כָל הַגּוֹי
  choice: पूरी जाति
  rationale: גּוֹי यहाँ इस्राएल को एक सामूहिक राष्ट्रीय इकाई के रूप में व्यक्त करता है; ‘पूरी जाति’ उसके एकवचन सामूहिक बल को सुरक्षित रखता है।
- source_word: אֶת הַיַּרְדֵּן
  choice: यरदन
  rationale: यह नदी के नाम का हिन्दी बाइबलीय रूप है; प्रसंग में ‘नदी’ जोड़ना आवश्यक नहीं।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम יהוה का शीर्षक से प्रतिस्थापन न करके हिन्दी लिप्यंतरण किया गया है।
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: ने यहोशू से कहा,
  rationale: हिब्रू वचन-परिचय सूत्र का स्वाभाविक हिन्दी रूप; अल्पविराम अगले पद में आने वाली वाणी की निरंतरता दिखाता है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: पद में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे किसी उपाधि से बदले बिना प्रस्तुत करता है; ‘प्रभु’ मूल के नाम और उपाधि का भेद मिटा देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक स्वरूप है।
translation_notes:
