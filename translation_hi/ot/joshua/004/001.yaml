  naturalness: “पूरी जाति” is understandable and suitably retains the singular collective expression. Adding “थी” makes the sentence grammatically complete and gives the intended prior-completion sense before “याहवे ने ... कहा.”
  terminology: “याहवे” consistently represents יהוה without substituting a title, and “यहोशू” is a standard Hindi biblical form. The footnote correctly explains the collective singular and retains the legitimate alternative “सारे लोग.”
