    issue: Incomplete perfect construction in the temporal clause
    rationale: In modern standard Hindi, “जब पूरी जाति यरदन पार कर चुकी” is elliptical and incomplete in this prose register. The source's completed action before the ensuing speech is naturally and accurately expressed by “जब पूरी जाति यरदन पार कर चुकी थी.”
