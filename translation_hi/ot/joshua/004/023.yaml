source:
  edition: WLC
  text: אֲשֶׁר הוֹבִישׁ֩ יְהוָ֨ה אֱלֹהֵי/כֶ֜ם אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵי/כֶ֖ם עַֽד עָבְרְ/כֶ֑ם כַּ/אֲשֶׁ֣ר עָשָׂה֩ יְהוָ֨ה אֱלֹהֵי/כֶ֧ם לְ/יַם ס֛וּף אֲשֶׁר הוֹבִ֥ישׁ מִ/פָּנֵ֖י/נוּ עַד עָבְרֵֽ/נוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/023.yaml
  text: For Yahweh your God dried up the waters of the Jordan before you until you crossed over[a], just as Yahweh your God did to the Sea of Reeds, which he dried up before us until we crossed over.
translation:
  language: hi
  text: क्योंकि तुम्हारे परमेश्वर यहवे ने यरदन का जल तुम्हारे सामने तब तक सूखा रखा, जब तक तुम पार न हो गए, ठीक वैसे ही जैसे तुम्हारे परमेश्वर यहवे ने सरकंडों के सागर[a] के साथ किया था, जिसे उसने हमारे सामने तब तक सूखा रखा, जब तक हम पार न हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत रूप से “लाल सागर” कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹבִישׁ
  choice: सुखाए रखा
  rationale: हिफ़ील रूप जल को सूखा देने की क्रिया बताता है; अवधि-सूचक ‘जब तक’ के साथ ‘सुखाए रखा’ आधुनिक हिन्दी में स्वाभाविक है और पार जाने तक बनी स्थिति को स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से प्रतिस्थापित न करके हिन्दी में सीधा लिप्यंतरण किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर
  rationale: यहवे के साथ इसका अर्थ एकवचन में इस्राएल के परमेश्वर से है।
- source_word: מֵי הַיַּרְדֵּן
  choice: यरदन के जल
  rationale: इब्रानी संबंध-वाक्यांश और नदी के जल की ठोस छवि सुरक्षित रहती है।
- source_word: מִפְּנֵיכֶם / מִפָּנֵינוּ
  choice: तुम्हारे सामने / हमारे सामने
  rationale: स्थान-सूचक इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप, साथ ही दूसरे और पहले पुरुष का अंतर सुरक्षित है।
- source_word: עַד עָבְרְכֶם / עַד עָבְרֵנוּ
  choice: जब तक तुम पार न हो गए / जब तक हम पार न हो गए
  rationale: क्रिया की अवधि और पार जाने की पूर्णता व्यक्त होती है तथा दोनों समानांतर खंडों की पुनरावृत्ति बनी रहती है।
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: ठीक वैसे ही जैसे ... किया था
  rationale: यरदन और पहले समुद्र-पारगमन के बीच स्पष्ट तुलना को सहज हिन्दी में व्यक्त करता है।
- source_word: יַם סוּף
  choice: सरकंडों का सागर
  rationale: סוּף का सीधा अर्थ ‘सरकंडा’ है; इसलिए परंपरागत नाम के बजाय मूल-भाषा-संगत रूप मुख्य पाठ में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; लिप्यंतरण उस नाम को उपाधि से बदले बिना सुरक्षित रखता है।
- issue: יַם סוּף की पहचान
  choice: सरकंडों का सागर
  alternative: लाल सागर
  rationale: मुख्य पाठ इब्रानी पद के अधिक सीधे अर्थ को रखता है, जबकि पाठकों की परिचित परंपरा को पादटिप्पणी में बताया गया है।
- issue: वक्ता का ‘हम’ और निर्गमन पीढ़ी
  choice: हम पार न हो गए
  alternative: वे पार न हो गए
  rationale: मूल पाठ का प्रथम पुरुष बहुवचन सुरक्षित रखा गया है; वक्ता की पीढ़ीगत या प्रतिनिधिक पहचान को व्याख्या द्वारा नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठकों के लिए सहज शैली। ‘जल’ और ‘सागर’ औपचारिकता बनाए रखते हैं, जबकि वाक्य-विन्यास बोलचाल से अत्यधिक दूर नहीं जाता।
