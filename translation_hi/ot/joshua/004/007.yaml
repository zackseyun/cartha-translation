  text: וַ/אֲמַרְתֶּ֣ם לָ/הֶ֗ם אֲשֶׁ֨ר נִכְרְת֜וּ מֵימֵ֤י הַ/יַּרְדֵּן֙ מִ/פְּנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה בְּ/עָבְר/וֹ֙ בַּ/יַּרְדֵּ֔ן נִכְרְת֖וּ מֵ֣י הַ/יַּרְדֵּ֑ן וְ֠/הָיוּ הָ/אֲבָנִ֨ים הָ/אֵ֧לֶּה לְ/זִכָּר֛וֹן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/007.yaml
  text: then you shall say to them[a], ‘The waters of the Jordan were cut off before the ark of the covenant of Yahweh. When it crossed over the Jordan, the waters of the Jordan were cut off.’ And these stones shall be a memorial to the sons of Israel forever.
translation:
  language: hi
  text: तब तुम उनसे कहना, ‘याहवे की वाचा के संदूक के सामने यरदन का जल रुक गया था। जब संदूक यरदन पार कर रहा था, तब यरदन का जल रुक गया था।’ और ये पत्थर इस्राएल के पुत्रों[a] के लिए सदा के लिए स्मारक होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल की संतान के लिए” अथवा “इस्राएलियों के लिए।” हिब्रू में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְרְתוּ
  choice: रुक गया था
  rationale: नदी के पानी के प्रवाह के पूर्णतः थम जाने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; शाब्दिक ‘काट दिया गया’ यहाँ असहज होगा। पद में हुई पुनरावृत्ति भी बनाए रखी गई है।
- source_word: מֵימֵי / מֵי הַיַּרְדֵּן
  choice: यरदन का पानी
  rationale: हिब्रू बहुवचन जलराशि/प्रवाह का बोध देता है, पर आधुनिक हिन्दी में नदी के लिए एकवचन ‘पानी’ अधिक स्वाभाविक है।
- source_word: מִפְּנֵי
  choice: के सामने
  rationale: संदूक की उपस्थिति के आगे पानी रुकने का स्थानिक अर्थ सुरक्षित रखता है।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: याहवे की वाचा का संदूक
  rationale: पूरा वाचागत शीर्षक सुरक्षित है और हिन्दी में संबंधों का क्रम स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: בְּעָבְרוֹ
  choice: जब वह ... पार कर रहा था
  rationale: पुल्लिंग एकवचन प्रत्यय निकटवर्ती ‘संदूक’ को सूचित करता है; ‘वह’ मूल की व्याकरणिक संदर्भ-संभावना बनाए रखता है।
- source_word: לְזִכָּרוֹן
  choice: स्मारक
  rationale: इन पत्थरों के स्थायी स्मरण-चिह्न होने का अर्थ संक्षेप और गरिमा से व्यक्त करता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के लिए
  rationale: בני के औपचारिक ‘पुत्रों’ रूप को सुरक्षित रखा गया है; पाठक-सुगमता के लिए वैकल्पिक सामुदायिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: עַד עוֹלָם
  choice: सदा
  rationale: स्थायी और निरंतर स्मरण के भाव का स्पष्ट, स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम प्रत्यक्ष है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: לִבְנֵי יִשְׂרָאֵל का रूप
  choice: इस्राएल के पुत्रों के लिए
  alternative: इस्राएल की सन्तान के लिए; इस्राएलियों के लिए
  rationale: मूल के पुल्लिंग बहुवचन संज्ञात्मक रूप को मुख्य पाठ में रखा गया है, जबकि उसके व्यापक सामुदायिक प्रयोग को पादटिप्पणी में स्पष्ट किया गया है।
- issue: בְּעָבְרוֹ में कर्ता की पहचान
  choice: जब वह यरदन पार कर रहा था
  alternative: जब संदूक यरदन पार कर रहा था; जब वह यरदन के बीच से पार हुआ
  rationale: प्रत्यय व्याकरणतः संदूक की ओर संकेत करता है, किंतु मूल की सर्वनामात्मक अभिव्यक्ति को बनाए रखने के लिए ‘वह’ रखा गया है; पूर्ववर्ती वाक्यांश संदर्भ स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘उत्तर देना’ प्रश्न के प्रत्युत्तर की पूर्ववर्ती प्रसंगगत स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ मूल की पुनरावृत्ति और ‘संदूक’ के लिए सर्वनामात्मक संदर्भ बनाए रखता है।
