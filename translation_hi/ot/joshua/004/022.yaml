  terminology: ‘इस्राएल’ and ‘यरदन’ are suitable standard Hindi biblical forms. ‘बच्चों’ appropriately reflects the broad contextual sense of בְּנֵיכֶם; the lexical possibility ‘पुत्रों’ is correctly retained in the footnote.
