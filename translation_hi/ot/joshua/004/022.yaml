  text: then you shall let your children know[a], saying, ‘Israel crossed this Jordan on dry ground.’
translation:
  language: hi
  text: 'तब तुम अपने बच्चों को यह बताना: ‘इस्राएल ने इस यरदन को सूखी भूमि पर पार किया था।’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹדַעְתֶּם
  choice: तब तुम ... बताना
  rationale: ידע के हिफ़ईल रूप का अर्थ ‘जानकारी देना/ज्ञात कराना’ है। आज्ञात्मक प्रसंग में ‘बताना’ स्वाभाविक हिंदी है, और וְ को निर्देशों के क्रम के अनुसार ‘तब’ कहा गया है।
- source_word: בְּנֵיכֶם
  choice: अपने बच्चों
  rationale: בנים का अर्थ विशेष रूप से ‘पुत्र’ अथवा व्यापक रूप से ‘बच्चे’ हो सकता है। अगली पीढ़ी को स्मारक का अर्थ सिखाने के इस प्रसंग में ‘बच्चों’ स्वाभाविक है; संकरा अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לֵאמֹר
  choice: यह बताना, ‘…’
  rationale: यह अव्ययी भाव आने वाले कथन का परिचय देता है। हिंदी में अलग से ‘यह कहते हुए’ रखने के बजाय ‘यह बताना’ अधिक सहज है।
- source_word: בַּיַּבָּשָׁה
  choice: सूखी भूमि पर होकर
  rationale: संज्ञा का अर्थ सूखी भूमि/ज़मीन है। ‘पर होकर’ नदी पार करने के मार्ग को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עָבַר
  choice: पार किया था
  rationale: עבר का सामान्य अर्थ ‘पार करना’ है। कथित ऐतिहासिक घटना के लिए हिंदी का पूर्ण भूतकाल स्वाभाविक है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: लोगों/राष्ट्र का व्यक्तिवाचक नाम; मानक हिंदी बाइबलीय रूप रखा गया है।
- source_word: הַיַּרְדֵּן הַזֶּה
  choice: इस यरदन को
  rationale: संकेतवाचक הַזֶּה की निकटता ‘इस’ से बनी रहती है। मूल में नदी के नाम के साथ अलग से ‘नदी’ शब्द नहीं है, इसलिए उसे नहीं जोड़ा गया।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पारिवारिक शिक्षा के प्रसंग के अनुकूल रखी गई है। ‘तुम ... बताना’ निर्देशात्मक हिंदी है; उद्धरण में ‘इस यरदन’ मूल के संकेतवाचक बल को बनाए रखता है।
