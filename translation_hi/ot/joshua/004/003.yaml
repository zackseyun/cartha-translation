  text: וְ/צַוּ֣וּ אוֹתָ/ם֮ לֵ/אמֹר֒ שְׂאֽוּ לָ/כֶ֨ם מִ/זֶּ֜ה מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן מִ/מַּצַּב֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים הָכִ֖ין שְׁתֵּים עֶשְׂרֵ֣ה אֲבָנִ֑ים וְ/הַעֲבַרְתֶּ֤ם אוֹתָ/ם֙ עִמָּ/כֶ֔ם וְ/הִנַּחְתֶּ֣ם אוֹתָ֔/ם בַּ/מָּל֕וֹן אֲשֶׁר תָּלִ֥ינוּ ב֖/וֹ הַ/לָּֽיְלָה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/003.yaml
  text: and command them[a], saying, ‘Take up for yourselves from here, from the midst of the Jordan, from the place where the priests’ feet stood firm, twelve stones[b], and carry them over with you and set them down at the lodging place where you will spend the night.’
translation:
  language: hi
  text: 'और उन्हें यह आज्ञा दो: “अपने लिए यहाँ से, यरदन के बीच में से—जहाँ याजकों के पाँव दृढ़ता से टिके थे—बारह पत्थर उठा लो। उन्हें अपने साथ पार ले जाओ और उस पड़ाव पर रख दो जहाँ तुम आज रात ठहरोगे।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצַוּוּ
  choice: और उन्हें यह आज्ञा दो
  rationale: पिएल आज्ञार्थक का सीधा और अधिकारपूर्ण बल बनाए रखता है; ‘निर्देश दो’ की अपेक्षा ‘आज्ञा दो’ स्रोत के अधिक निकट है।
- source_word: שְׂאוּ לָכֶם
  choice: अपने लिए ... उठा लो
  rationale: पत्थरों को नदी-तल से उठाने की ठोस क्रिया तथा לָכֶם में निहित व्यक्तिगत सहभागिता दोनों व्यक्त होती हैं; इसका अर्थ निजी स्वामित्व नहीं है।
- source_word: מִזֶּה מִתּוֹךְ הַיַּרְדֵּן
  choice: यहाँ से, यरदन के बीच में से
  rationale: दोनों पूर्वसर्गीय पदों को रखकर स्थान की विशिष्टता और इब्रानी की सजीव पुनरुक्ति सुरक्षित की गई है।
- source_word: מִמַּצַּב רַגְלֵי הַכֹּהֲנִים הָכִין
  choice: जहाँ याजकों के पाँव दृढ़ता से टिके थे
  rationale: מַצָּב के स्थान/स्थिति और הָכִין की स्थिरता को स्वाभाविक आधुनिक हिन्दी में संयुक्त रूप से व्यक्त करता है।
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: बारह पत्थर
  rationale: मूल संख्या और संज्ञा का सीधा अनुवाद।
- source_word: וְהַעֲבַרְתֶּם אוֹתָם עִמָּכֶם
  choice: उन्हें अपने साथ पार ले जाओ
  rationale: हिफ़ील रूप में निहित ‘पार कराना/ले जाना’ और עִמָּכֶם का साथ होना, दोनों स्पष्ट रहते हैं।
- source_word: וְהִנַּחְתֶּם אוֹתָם
  choice: और ... रख दो
  rationale: पत्थरों को गंतव्य पर रख देने की ठोस क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: בַּמָּלוֹן
  choice: उस पड़ाव पर
  rationale: מָלוֹן यहाँ रात बिताने के अस्थायी स्थान को दर्शाता है; ‘पड़ाव’ स्वाभाविक है और स्थायी बस्ती या अनिवार्यतः सैनिक छावनी का अर्थ नहीं देता।
- source_word: אֲשֶׁר תָּלִינוּ בוֹ הַלָּיְלָה
  choice: जहाँ तुम आज रात ठहरोगे
  rationale: प्रसंगगत भविष्य और उसी रात के रात्रि-विश्राम को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
