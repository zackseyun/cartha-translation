source:
  edition: WLC
  text: וַ/יְהִ֛י כַּֽ/אֲשֶׁר תַּ֥ם כָּל הָ/עָ֖ם לַֽ/עֲב֑וֹר וַ/יַּעֲבֹ֧ר אֲרוֹן יְהוָ֛ה וְ/הַ/כֹּהֲנִ֖ים לִ/פְנֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/011.yaml
  text: And when all the people had finished crossing over[a], the ark of Yahweh and the priests crossed over before the people.
translation:
  language: hi
  text: जब सब लोग पार हो चुके थे, तब याहवे का संदूक और याजक लोगों के सामने[a] पार हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों के आगे”; इब्रानी पदबंध का अर्थ स्थान की दृष्टि से “आगे/सामने” या “लोगों की उपस्थिति में” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: जब … तब
  rationale: इब्रानी कथात्मक संक्रमण और समयवाचक उपवाक्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; अलग से ‘ऐसा हुआ’ कहना अनावश्यक रूप से बोझिल होता।
- source_word: תַּם כָּל הָעָם לַעֲבוֹר
  choice: सब लोग पार हो चुके
  rationale: תַּם पूर्ण हो चुकी क्रिया को दर्शाता है। ‘पार हो चुके’ मुख्य घटना से पहले लोगों के पार हो जाने को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: וַיַּעֲבֹר
  choice: पार हुए
  rationale: यह לַעֲבוֹר के समान עבר धातु से है; ‘पार’ को दोहराने से मूल की शब्दगत संगति बनी रहती है। संयुक्त कर्ता ‘संदूक और याजक’ के कारण हिन्दी में बहुवचन क्रिया स्वाभाविक है।
- source_word: אֲרוֹן יְהוָה
  choice: याहवे का संदूक
  rationale: रचना-संबंध को सीधे व्यक्त किया गया है और יהוה के व्यक्तिगत नाम को उपाधि में बदले बिना लिप्यंतरित किया गया है। मूल में ‘वाचा’ शब्द नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: וְהַכֹּהֲנִים
  choice: और याजक
  rationale: संयोजक וְ संदूक और याजकों को इस क्रिया के संयुक्त सहभागी बताता है। ‘याजक’ आधुनिक हिन्दी बाइबलीय भाषा में परिचित और गरिमापूर्ण है।
- source_word: לִפְנֵי הָעָם
  choice: लोगों के सामने
  rationale: לִפְנֵי स्थानगत ‘आगे’ और उपस्थितिगत ‘सामने/उपस्थिति में’ दोनों अर्थ दे सकता है। हिन्दी ‘सामने’ इस संदर्भ में स्वाभाविक रहते हुए उस अर्थ-सीमा को काफी हद तक बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम יהוה का प्रयोग करता है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है और उपलब्ध प्राचीन उच्चारण-साक्ष्य के अधिक निकट है।
- issue: לִפְנֵי הָעָם का संबंध और घटनाक्रम
  choice: लोगों के सामने
  alternative: लोगों के आगे; लोगों की उपस्थिति में
  rationale: पद के आरम्भ में सब लोगों का पार होना पूरा बताया गया है, इसलिए केवल ‘आगे’ चुनना घटनाक्रम को अनावश्यक रूप से निश्चित या तनावपूर्ण बना सकता है। ‘सामने’ स्थान और उपस्थिति दोनों की वास्तविक इब्रानी संभावना को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ऐसा हुआ कि’ जैसे अपेक्षाकृत बोझिल कथात्मक सूत्र से बचते हुए ‘जब … तब’ अपनाया गया है। ‘संदूक’ और ‘याजक’ परिचित बाइबलीय शब्द हैं, जबकि मूल में अनुपस्थित ‘वाचा’ नहीं जोड़ा गया।
