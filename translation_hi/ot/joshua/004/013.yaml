base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/013.yaml
  text: About forty thousand armed for war crossed over before Yahweh for battle[a], to the plains of Jericho.
translation:
  language: hi
  text: लगभग चालीस हज़ार हथियारबंद सैनिक युद्ध के लिए यहोवा के सामने पार होकर यरीहो के मैदानों में पहुँचे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/אַרְבָּעִים אֶלֶף
  choice: लगभग चालीस हज़ार
  rationale: संख्या के साथ उपसर्ग כְּ अनुमान का भाव देता है; ‘लगभग’ इस अर्थ को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: חֲלוּצֵי הַצָּבָא
  choice: युद्ध के लिए हथियारबंद पुरुष
  rationale: यह पद युद्ध के लिए सुसज्जित और तैयार लोगों को दर्शाता है; ‘पुरुष’ प्रसंग में निहित सैनिक समूह को स्पष्ट करता है, पर उन्हें अनिवार्यतः अग्रिम दस्ता नहीं ठहराता।
- source_word: עָבְרוּ
  choice: पार होकर ... पहुँचे
  rationale: क्रिया यहाँ यरदन पार करने की कथा से जुड़ी है। गंतव्य के साथ ‘पार होकर ... पहुँचे’ आधुनिक हिंदी में स्वाभाविक है और पारगमन का अर्थ बनाए रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने से
  rationale: לִפְנֵי का मूल स्थानिक/उपस्थिति-संबंधी भाव ‘के सामने’ से व्यक्त होता है; ‘से’ पार होकर आगे बढ़ने की गति के साथ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश-नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध करने के लिए
  rationale: लामेद उद्देश्य बताता है; यह अनुवाद सैन्य कार्रवाई के उद्देश्य को स्पष्ट और सहज हिंदी में व्यक्त करता है।
- source_word: אֶל עַרְבוֹת יְרִיחוֹ
  choice: यरीहो के मैदानों में
  rationale: עַרְבוֹת यरदन घाटी के समतल मैदानी क्षेत्र को सूचित करता है। गति के बाद हिंदी में ‘मैदानों में पहुँचे’ स्वाभाविक है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके हिंदी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप में रखा गया है; स्वरांकन के पुनर्निर्माण पर निर्भर ‘याहवे’ भी संभव है।
translation_notes:
  register: 'भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। इब्रानी वाक्य की सैन्य पुनरुक्ति को अर्थपूर्ण ढंग से बनाए रखा गया है: लोग युद्ध के लिए हथियारबंद थे और युद्ध करने के उद्देश्य से आगे बढ़े।'
