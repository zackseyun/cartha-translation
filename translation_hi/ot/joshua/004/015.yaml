  yaml_path: translation/ot/joshua/004/015.yaml
  text: And Yahweh said to Joshua,[a]
translation:
  language: hi
  text: और यहोवा ने यहोशू से कहा,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘कहते हुए’; यह अगले पद के प्रत्यक्ष कथन का परिचय देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: और ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है। ‘और ... ने कहा’ इब्रानी कथाप्रवाह को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णी दिव्य नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: אֶל
  choice: से
  rationale: कहने की क्रिया के संबोधित व्यक्ति को आधुनिक हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया जाता है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय रूप रखा गया है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: यह रूप अगले पद में आने वाले प्रत्यक्ष कथन का परिचय देता है; हिन्दी में इसे विराम-चिह्न और ‘कहा’ की संरचना से स्वाभाविक रूप से व्यक्त किया गया है। मूल का स्पष्ट ‘कहते हुए’ अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, परमेश्वर का व्यक्तिगत नाम है। हिन्दी पाठकों के लिए परिचित और प्रतिष्ठित लिप्यंतरण ‘यहोवा’ रखा गया है; ‘याहवे’ अधिक प्रत्यक्ष वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। पद को अगले पद से जुड़ने वाला अपूर्ण कथन बनाए रखा गया है और पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित है।
