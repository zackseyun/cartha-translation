source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא גִּדַּ֤ל יְהוָה֙ אֶת יְהוֹשֻׁ֔עַ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּֽרְא֣וּ אֹת֔/וֹ כַּ/אֲשֶׁ֛ר יָרְא֥וּ אֶת מֹשֶׁ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/014.yaml
  text: On that day Yahweh made Joshua great in the eyes of all Israel[a], and they feared him just as they had feared Moses all the days of his life.
translation:
  language: hi
  text: उस दिन याहवे ने सारे इस्राएल की दृष्टि में यहोशू को महान किया। वे उसका भय मानते थे[a], ठीक वैसे ही जैसे वे मूसा के जीवन-भर उसका भय मानते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके प्रति श्रद्धामिश्रित भय रखते थे” अथवा “उसके प्रति गहरा आदर रखते थे”; इब्रानी क्रिया प्रसंग के अनुसार भय, विस्मय या श्रद्धा का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह सीधा कथात्मक काल-सूचक वाक्यांश है; आधुनिक हिन्दी में “उस दिन” स्वाभाविक और सटीक है।
- source_word: גִּדַּל
  choice: महान किया
  rationale: 'पिएल रूप का कारक भाव सुरक्षित रहता है: याहवे ने यहोशू को सब इस्राएल की दृष्टि में महान प्रतिष्ठा दी।'
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल की दृष्टि में
  rationale: इब्रानी मुहावरे की सार्वजनिक धारणा और प्रतिष्ठा का अर्थ रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति दी गई है।
- source_word: וַיִּירְאוּ אֹתוֹ
  choice: वे उसका भय मानने लगे
  rationale: ירא में भय, विस्मय और श्रद्धा का अर्थ-क्षेत्र है। “भय मानना” मूल शब्द की तीव्रता और मूसा के साथ साहित्यिक समानता बनाए रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह निकट और बलयुक्त तुलना को सहज हिन्दी में व्यक्त करता है।
- source_word: כָּל יְמֵי חַיָּיו
  choice: मूसा के जीवन-भर
  rationale: मानक इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है। प्रसंग और निकटतम पूर्वपद के अनुसार सर्वनाम मूसा की ओर संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; “याहवे” उसका अधिक प्रत्यक्ष लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: यहोशू के प्रति ירא का भाव
  choice: उसका भय मानने लगे
  alternative: उसके प्रति श्रद्धामिश्रित भय रखने लगे / उसका गहरा आदर करने लगे
  rationale: मूल क्रिया भय, विस्मय और श्रद्धा के बीच अर्थगत तनाव रखती है। मुख्य पाठ में “भय” रखने से शब्द की शक्ति और मूसा से तुलना सुरक्षित रहती है, जबकि पादटिप्पणी अन्य प्रसंग-संगत अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। “दृष्टि में” इब्रानी बिंब को सहज हिन्दी में बनाए रखता है, और “जीवन-भर” अनावश्यक शाब्दिक कठोरता से बचाता है।
