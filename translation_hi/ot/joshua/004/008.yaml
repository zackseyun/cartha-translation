base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/008.yaml
  text: And the sons of Israel did so[a], just as Joshua had commanded, and they carried twelve stones from the midst of the Jordan, just as Yahweh had spoken to Joshua, according to the number of the tribes of the sons of Israel[c][b]; and they brought them over with them to the lodging place and set them down there.
translation:
  language: hi
  text: इस्राएल के पुत्रों[a] ने वैसा ही किया जैसा यहोशू ने आज्ञा दी थी। उन्होंने यरदन के बीच से[b] बारह पत्थर उठा लिए, जैसा याहवे ने यहोशू से कहा था—इस्राएल के पुत्रों के गोत्रों की संख्या के अनुसार। वे उन्हें अपने साथ रात के पड़ाव तक[c] पार ले गए और वहीं रख दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्र।” इसे “इस्राएलियों” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “यरदन के मध्य से”; आशय नदी के भीतर के भाग से है।
    reason: lexical_alternative
  - marker: c
    text: या “पड़ाव तक।” इब्रानी शब्द विशेष रूप से रात बिताने के स्थान या रात्रि-शिविर को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
