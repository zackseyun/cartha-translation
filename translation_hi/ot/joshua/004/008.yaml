  rationale: इब्रानी पारिवारिक अभिव्यक्ति को स्पष्ट रूप से बनाए रखता है; अधिक सहज विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: וַיַּעֲשׂוּ כֵן
  choice: वैसा ही किया
  rationale: आज्ञापालन का भाव स्वाभाविक हिन्दी में व्यक्त करता है और अगले तुलना-वाक्य से सहजता से जुड़ता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: क्रिया के अधिकारपूर्ण निर्देश के अर्थ और पूर्वकालिक कथानुक्रम, दोनों को व्यक्त करता है।
- source_word: וַיִּשְׂאוּ
  choice: उठा लिए
  rationale: पत्थरों को उठाकर साथ ले जाने के प्रसंग में इब्रानी क्रिया का आरम्भिक उठाने वाला भाव व्यक्त करता है; आगे ले जाने की क्रिया अलग से आती है।
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: यरदन के बीच से
  rationale: תּוֹךְ के स्थानगत अर्थ को बनाए रखता है; इसका आशय नदी के भीतर अथवा मध्य भाग से हो सकता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय नाम के रूप में लिप्यंतरित करता है।
- source_word: לְמִסְפַּר שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के गोत्रों की संख्या के अनुसार
  rationale: बारह पत्थरों और गोत्रों की संख्या के बीच स्पष्ट अनुरूपता तथा पूर्ण इब्रानी अभिव्यक्ति को सुरक्षित रखता है।
- source_word: וַיַּעֲבִרוּם עִמָּם
  choice: वे उन्हें अपने साथ पार ... ले गए
  rationale: हिफ़ील क्रिया में निहित पार पहुँचाने और עִמָּם में निहित साथ ले जाने—दोनों भावों को व्यक्त करता है।
- source_word: הַמָּלוֹן
  choice: रात के पड़ाव
  rationale: सिर्फ सामान्य ‘छावनी’ के बजाय उस स्थान का विशिष्ट अर्थ देता है जहाँ यात्री रात बिताते हैं।
- source_word: וַיַּנִּיחוּם שָׁם
  choice: वहीं रख दिया
  rationale: पत्थरों को उस स्थान पर रख छोड़ने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ यहाँ परमेश्वर का विशिष्ट वाचा-नाम प्रयोग करता है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। मूल की पारिवारिक शब्दावली तथा नदी पार करने की गति को रखा गया है, पर वाक्य को हिन्दी में स्पष्ट बनाने के लिए लम्बी इब्रानी संरचना को तीन वाक्यों में बाँटा गया है।
