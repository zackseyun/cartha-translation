lexical_decisions:
- source_word: וְאֵת
  choice: और ... को
  rationale: וְ कथा को पिछले पद से जोड़ता है; אֵת का स्वतंत्र हिन्दी अर्थ नहीं है, पर निश्चित कर्म को ‘को’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: שְׁתֵּים עֶשְׂרֵה הָאֲבָנִים הָאֵלֶּה
  choice: इन बारह पत्थरों को
  rationale: संख्या, संज्ञा और संकेतवाचक का अर्थ रखते हुए आधुनिक हिन्दी की स्वाभाविक शब्द-व्यवस्था अपनाई गई है।
- source_word: אֲשֶׁר לָקְחוּ
  choice: जिन्हें वे ... ले आए थे
  rationale: सम्बन्धवाचक उपवाक्य पत्थरों की पहचान करता है। पूर्वकालिक क्रिया को ‘ले आए थे’ से व्यक्त किया गया है; गंतव्य की ओर ले जाने का भाव प्रसंग से स्पष्ट है।
- source_word: מִן הַיַּרְדֵּן
  choice: यरदन में से
  rationale: מִן के स्रोत/भीतर से निकाले जाने के भाव को ‘में से’ व्यक्त करता है और नदी के प्रचलित नाम ‘यरदन’ को रखा गया है।
- source_word: הֵקִים
  choice: खड़ा किया
  rationale: स्मारक-पत्थरों को स्थापित करने के प्रसंग में यह सहज और अर्थ-सटीक हिन्दी है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नामरूप अपनाया गया है।
- source_word: בַּגִּלְגָּל
  choice: गिलगाल में
  rationale: स्थानवाचक בְּ को हिन्दी में स्वाभाविक ‘में’ से व्यक्त किया गया है।
