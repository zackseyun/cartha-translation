  yaml_path: translation/ot/joshua/004/017.yaml
  text: So Joshua commanded the priests, saying, “Come up out of the Jordan.”
translation:
  language: hi
  text: तब यहोशू ने याजकों को आज्ञा दी, “यरदन में से निकलकर ऊपर आ जाओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: तब ... आज्ञा दी
  rationale: צוה का अर्थ अधिकारपूर्वक आदेश देना है; ‘आज्ञा दी’ इस बल को बनाए रखता है। आरंभिक וַ को हिन्दी कथा-प्रवाह में स्वाभाविक रूप से ‘तब’ कहा गया है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֶת הַכֹּהֲנִים
  choice: याजकों को
  rationale: निश्चित बहुवचन कर्म का स्वाभाविक हिन्दी रूप।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष कथन द्वारा व्यक्त
  rationale: हिब्रू में यह पद प्रत्यक्ष वचन का परिचय देता है। हिन्दी में अलग से ‘कहते हुए’ जोड़ने के बजाय उद्धरण सीधे रखना अधिक स्वाभाविक है।
- source_word: עֲלוּ
  choice: निकलकर ऊपर आ जाओ
  rationale: עלה ऊपर आने/चढ़ने की गति बताता है। नदी के भीतर से तट पर आने के संदर्भ में ‘ऊपर आ जाओ’ उपयुक्त है; ‘निकलकर’ מן के स्थानिक भाव को स्पष्ट करता है।
- source_word: מִן הַיַּרְדֵּן
  choice: यरदन में से
  rationale: מן यहाँ नदी के भीतर से बाहर की ओर गति दर्शाता है। ‘यरदन’ नाम को अनावश्यक रूप से ‘नदी’ जोड़कर विस्तृत नहीं किया गया।
