  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: का राजा
  rationale: यह संबंधसूचक रचना नगर के शासक को बताती है; हिंदी में स्थान-नाम के बाद ‘का राजा’ स्वाभाविक और सटीक है।
- source_word: תַּפּוּחַ
  choice: तप्पूह
  rationale: यह स्थान-नाम है, इसलिए अर्थानुवाद के बजाय हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: אֶחָד
  choice: एक
  rationale: यह सूची में प्रत्येक पराजित राजा की अलग-अलग गिनती करता है; केवल ‘एक’ रखने से हिब्रू की संक्षिप्त, दोहरावयुक्त शैली बनी रहती है।
- source_word: חֵפֶר
  choice: हेपेर
  rationale: यह स्थान-नाम है; हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
