base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/003.yaml
  text: and the Arabah as far as the Sea of Kinnereth eastward[a], and as far as the Sea of the Arabah, the Salt Sea, eastward, by way of Beth-jeshimoth, and southward[b], below the slopes of Pisgah.
translation:
  language: hi
  text: और अराबा[a], पूर्व की ओर किन्नेरेत सागर तक, और अराबा के सागर—खारे सागर[b]—तक, बेत-यशीमोत की दिशा में पूर्व की ओर, तथा दक्षिण की ओर पिसगा की ढलानों के नीचे तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मैदान’; यहाँ संभवतः किसी सामान्य मैदान के बजाय यरदन भ्रंश-घाटी का विशिष्ट क्षेत्र अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: ‘अराबा का सागर, खारा सागर’ उसी जलाशय को सूचित करता है जिसे बाद में सामान्यतः मृत सागर कहा गया।
    reason: cultural_note
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: अराबा
  rationale: यहाँ यह किसी सामान्य मैदान के बजाय यरदन भ्रंश-घाटी के विशिष्ट भौगोलिक क्षेत्र का नाम है, इसलिए नाम का लिप्यंतरण किया गया है।
- source_word: יָם כִּנְרוֹת
  choice: किन्नेरेत सागर
  rationale: मूल के भौगोलिक नाम और יָם के औपचारिक अर्थ को बनाए रखते हुए स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: מִזְרָחָה
  choice: पूर्व की ओर
  rationale: दिशासूचक रूप को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है; मूल की सीमा-वर्णन शैली भी बनी रहती है।
- source_word: יָם הָעֲרָבָה יָם הַמֶּלַח
  choice: अराबा के सागर, अर्थात् खारे सागर
  rationale: दोनों पदों के समानाधिकरण को स्पष्ट रखते हुए आधुनिक नाम ‘मृत सागर’ को मुख्य पाठ में नहीं लाया गया है।
- source_word: דֶּרֶךְ
  choice: की दिशा में
  rationale: क्षेत्र-सीमा के वर्णन में यह मार्ग अथवा दिशा का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֵּית הַיְשִׁמוֹת
  choice: बेत-यशीमोत
  rationale: स्थान-नाम को हिन्दी ध्वन्यात्मक रूप में लिप्यंतरित किया गया है।
- source_word: וּמִתֵּימָן
  choice: और दक्षिण की ओर
  rationale: दक्षिणी दिशा अथवा विस्तार को दर्शाता है और मूल की दिशासूचक शैली को बनाए रखता है।
- source_word: תַּחַת אַשְׁדּוֹת הַפִּסְגָּה
  choice: पिसगा की ढलानों के नीचे
  rationale: स्थलाकृतिक संबंध को स्पष्ट और वर्तमान हिन्दी में व्यक्त करता है; אַשְׁדּוֹת के लिए ‘ढलानें’ सटीक है।
