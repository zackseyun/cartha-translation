source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֡רֶץ אֲשֶׁר֩ הִכָּ֨ה יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ יָ֔מָּ/ה מִ/בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן וְ/עַד הָ/הָ֥ר הֶ/חָלָ֖ק הָ/עֹלֶ֣ה שֵׂעִ֑ירָ/ה וַ/יִּתְּנָ֨/הּ יְהוֹשֻׁ֜עַ לְ/שִׁבְטֵ֧י יִשְׂרָאֵ֛ל יְרֻשָּׁ֖ה כְּ/מַחְלְקֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/007.yaml
  text: And these are the kings of the land whom Joshua and the sons of Israel struck down beyond the Jordan westward[a], from Baal-gad in the Valley of Lebanon as far as Mount Halak, which rises toward Seir[b]; and Joshua gave it to the tribes of Israel as an inheritance according to their divisions.
translation:
  language: hi
  text: और ये उस देश के राजा हैं जिन्हें यहोशू और इस्राएलियों ने यरदन के पार, पश्चिम की ओर मार गिराया—लबानोन की घाटी में बाल-गाद से लेकर हालाक पर्वत तक, जो सेईर की ओर चढ़ता है। यहोशू ने वह देश इस्राएल के गोत्रों को उनके-उनके हिस्सों के अनुसार विरासत के रूप में दे दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ये ... हैं
  rationale: आरंभिक संयोजक कथा को पिछले भाग से जोड़ता है और आगे आने वाली सूची का परिचय देता है।
- source_word: מַלְכֵי הָאָרֶץ
  choice: उस देश के राजा
  rationale: संदर्भ में निश्चित भूभाग की ओर संकेत है; ‘देश’ आधुनिक हिन्दी में स्वाभाविक है और आधुनिक राष्ट्र-राज्य का अर्थ आवश्यक रूप से आरोपित नहीं करता।
- source_word: אֲשֶׁר הִכָּה
  choice: जिन्हें ... मार गिराया
  rationale: युद्ध-विजय के संदर्भ में נכה की प्रबलता बनाए रखता है; केवल ‘हराया’ की अपेक्षा अधिक निकट है।
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: और इस्राएलियों ने
  rationale: शाब्दिक ‘इस्राएल के पुत्र’ यहाँ समूचे इस्राएली समुदाय का रूढ़ सामूहिक पद है; ‘इस्राएली’ सामान्य आधुनिक हिन्दी में अर्थ को स्वाभाविक और समावेशी ढंग से व्यक्त करता है।
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: यरदन के पश्चिमी पार
  rationale: בְּעֵבֶר और दिशासूचक יָמָּה दोनों को संक्षिप्त, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: מִבַּעַל גָּד בְּבִקְעַת הַלְּבָנוֹן
  choice: लबानोन की घाटी में बाल-गाद से
  rationale: स्थान-नामों का लिप्यंतरण किया गया है और בִּקְעָה के लिए भू-आकृतिक अर्थ वाला स्वाभाविक ‘घाटी’ चुना गया है।
- source_word: וְעַד הָהָר הֶחָלָק
  choice: हालाक पर्वत तक
  rationale: संदर्भ में הֶחָלָק भौगोलिक नाम की तरह कार्य करता है; वर्णनात्मक अनुवाद ‘चिकना पर्वत’ की अपेक्षा लिप्यंतरण उपयुक्त है।
- source_word: הָעֹלֶה שֵׂעִירָה
  choice: जो सेईर की ओर चढ़ता है
  rationale: आरोहण और दिशा—दोनों को सुरक्षित रखता है, बिना यह निश्चित किए कि पर्वत स्वयं ‘उठता’ है या मार्ग वहाँ ‘चढ़ता’ है।
- source_word: וַיִּתְּנָהּ יְהוֹשֻׁעַ
  choice: यहोशू ने वह देश ... दे दिया
  rationale: स्त्रीलिंग एकवचन प्रत्यय का आशय भूमि/देश है; हिन्दी में स्पष्ट संज्ञा दोहराने से संदर्भ अस्पष्ट नहीं रहता।
- source_word: יְרֻשָּׁה כְּמַחְלְקֹתָם
  choice: उनके विभागों के अनुसार विरासत में
  rationale: יְרֻשָּׁה के भूमि-अधिकार और वंशगत आवंटन का भाव ‘विरासत’ से आता है; מַחְלְקוֹת के प्रशासनिक/आवंटनीय भाव के लिए ‘विभाग’ रखा गया है।
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह वाक्यांश यहाँ जातीय-सामुदायिक संज्ञा है, केवल पुरुष वंशजों को सीमित करने वाला कथन नहीं; इसलिए सामान्य हिन्दी का सामूहिक रूप मूल आशय को बेहतर पहुँचाता है।
- issue: יְרֻשָּׁה में भूमि का स्वरूप
  choice: विरासत
  alternative: अधिकार / संपत्ति
  rationale: ‘विरासत’ यहोशू की भूमि-वितरण शब्दावली में प्राप्त स्थायी हिस्से का भाव बनाए रखती है, पर किसी अतिरिक्त सांप्रदायिक व्याख्या को नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। स्थान-नाम परिचित हिन्दी बाइबिलीय रूपों में लिप्यंतरित हैं। लंबे इब्रानी वाक्य को डैश और पूर्णविराम से पठनीय बनाया गया है, जबकि भौगोलिक सीमा और भूमि-वितरण का संबंध सुरक्षित है।
