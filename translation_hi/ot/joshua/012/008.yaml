  yaml_path: translation/ot/joshua/012/008.yaml
  text: in the hill country[a], and in the lowland, and in the Arabah, and on the slopes, and in the wilderness, and in the Negev—the Hittites, the Amorites, and the Canaanites, the Perizzites, the Hivites[c][b], and the Jebusites.
translation:
  language: hi
  text: पहाड़ी प्रदेश में, निम्नभूमि[a] में, अराबा[b] में, ढलानों पर, निर्जन प्रदेश में और नेगेव[c] में—हित्ती, एमोरी, कनानी, परिज्जी, हिव्वी और यबूसी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शफेला में’; यह पश्चिमी निम्नभूमि अथवा तलहटी के क्षेत्र का नाम है।
    reason: lexical_alternative
  - marker: b
    text: ‘अराबा’ दरार-घाटी के शुष्क मैदानी क्षेत्र का नाम है; या ‘मरुस्थलीय मैदान में’।
    reason: lexical_alternative
  - marker: c
    text: या ‘दक्षिणी प्रदेश में’; इब्रानी ‘नेगेव’ दक्षिणी क्षेत्र और ‘दक्षिण’—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּהָר
  choice: पहाड़ी प्रदेश में
  rationale: הַר यहाँ किसी एक पहाड़ के बजाय भौगोलिक क्षेत्र को सूचित करता है; इसलिए ‘पहाड़ी प्रदेश’ सटीक और स्वाभाविक है।
- source_word: וּבַשְּׁפֵלָה
  choice: निचले प्रदेश में
  rationale: שְׁפֵלָה पश्चिमी निचले भूभाग अथवा तलहटी के विशिष्ट क्षेत्र का नाम हो सकता है। मुख्य पाठ में अर्थ स्पष्ट रखा गया है और क्षेत्रीय नाम पादटिप्पणी में दिया गया है।
- source_word: וּבָעֲרָבָה
  choice: अराबा में
  rationale: עֲרָבָה यहाँ दरार-घाटी के पहचाने हुए भौगोलिक क्षेत्र का नाम है; लिप्यंतरण इसके स्थान-नाम वाले बल को सुरक्षित रखता है।
- source_word: וּבָאֲשֵׁדוֹת
  choice: ढलानों पर
  rationale: אֲשֵׁדוֹת पहाड़ी ढलानों या उतरते भूभागों को दर्शाता है; ‘ढलानों पर’ इसका सीधा और सहज रूप है।
- source_word: וּבַמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר केवल रेतीले मरुस्थल तक सीमित नहीं, बल्कि विरल आबादी वाले वन्य अथवा शुष्क भूभाग को भी दर्शाता है; ‘निर्जन प्रदेश’ इस व्यापक अर्थ को व्यक्त करता है।
- source_word: וּבַנֶּגֶב
  choice: नेगेव में
  rationale: נֶגֶב का अर्थ ‘दक्षिण’ भी हो सकता है, पर इस भौगोलिक सूची में यह दक्षिणी क्षेत्र के विशिष्ट नाम के रूप में अधिक उपयुक्त है।
- source_word: הַחִתִּי
  choice: हित्ती
  rationale: इब्रानी का एकवचन रूप यहाँ पूरे जाति-समूह के लिए सामूहिक अर्थ में प्रयुक्त है।
- source_word: הָאֱמֹרִי
  choice: एमोरी
  rationale: जातिवाचक सामूहिक संज्ञा को प्रचलित हिन्दी नाम से व्यक्त किया गया है।
- source_word: וְהַכְּנַעֲנִי
  choice: कनानी
  rationale: यह रूप पूरे कनानी जाति-समूह को सामूहिक रूप से दर्शाता है।
- source_word: הַפְּרִזִּי
  choice: परिज्जी
  rationale: इब्रानी जातिनाम का परिचित हिन्दी लिप्यंतरण रखा गया है और उसका सामूहिक अर्थ प्रसंग से स्पष्ट है।
- source_word: הַחִוִּי
  choice: हिव्वी
  rationale: इब्रानी जातिनाम को हिन्दी में प्रचलित रूप में रखा गया है।
- source_word: וְהַיְבוּסִי
  choice: यबूसी
  rationale: इब्रानी का सामूहिक जातिनाम हिन्दी में प्रचलित रूप से व्यक्त किया गया है।
