    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְבוּל
  choice: और ... का राज्य-क्षेत्र
  rationale: गְּבוּל सीमा, भूभाग या अधिकार-क्षेत्र का अर्थ दे सकता है। यहाँ पराजित राजाओं के क्षेत्रों की सूची में केवल सीमा-रेखा नहीं, बल्कि ओग के अधीन भूभाग अभिप्रेत है; इसलिए ‘राज्य-क्षेत्र’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: ע֚וֹג
  choice: ओग
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מֶ֣לֶךְ הַ/בָּשָׁ֔ן
  choice: बाशान के राजा
  rationale: यह संबंधसूचक पदबंध ओग के राजकीय क्षेत्र की पहचान कराता है; बाशान स्थान-नाम के रूप में लिप्यंतरित है।
- source_word: מִ/יֶּ֖תֶר הָ/רְפָאִ֑ים
  choice: रपाइयों में से बचे हुओं में से था
  rationale: יֶתֶר शेष बचे हुए लोगों को सूचित करता है। दोहराया हुआ ‘में से’ हिन्दी में थोड़ा भारी होते हुए भी यह अर्थ स्पष्ट रखता है कि ओग रपाइयों के बचे हुए सदस्यों में से एक था।
- source_word: הָ/רְפָאִ֑ים
  choice: रपाइयों
  rationale: मुख्य पाठ में जाति-नाम को लिप्यंतरित किया गया है, ताकि उसे व्याख्यात्मक रूप से सीधे ‘दैत्य’ न बना दिया जाए। संभावित अर्थ-संबंध पादटिप्पणी में दिया गया है।
- source_word: הַ/יּוֹשֵׁ֥ב
  choice: रहता था
  rationale: एकवचन कृदंत का संबंध ओग से है। ישב का सामान्य निवास-सूचक अर्थ आधुनिक हिन्दी में ‘रहता था’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶֽעִי
  choice: अश्तारोत तथा एद्रेई में
  rationale: दोनों स्थान-नाम लिप्यंतरित हैं; पूर्वसर्ग ב निवास-स्थान दर्शाता है और संयुक्त स्थानों के लिए हिन्दी में अंत में एक बार ‘में’ रखना स्वाभाविक है।
theological_decisions:
- issue: रपाइयों की पहचान
  choice: मुख्य पाठ में जाति-नाम ‘रपाई’ बनाए रखा गया
  alternative: ‘दैत्य’ या ‘विशालकाय लोग’
  rationale: इब्रानी शब्द प्राचीन जनसमूह का नाम है और उसके असाधारण कद की परंपरा से भी जुड़ सकता है। मुख्य पाठ में जातीय पहचान बनाए रखने से व्याख्या को अनावश्यक रूप से निश्चित नहीं किया जाता; विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। पद पिछले पद की सूची को आगे बढ़ाता है, इसलिए आरम्भ में ‘और’ रखा गया है। स्थानों के नाम प्रचलित बाइबलीय हिन्दी के निकट लिप्यंतरित किए गए हैं।
