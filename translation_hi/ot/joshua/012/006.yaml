  text: מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה וּ/בְנֵ֥י יִשְׂרָאֵ֖ל הִכּ֑וּ/ם וַֽ֠/יִּתְּנָ/הּ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה יְרֻשָּׁ֗ה לָ/רֻֽאוּבֵנִי֙ וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֥בֶט הַֽ/מְנַשֶּֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/006.yaml
  text: Moses the servant of Yahweh[a], and the sons of Israel, struck them down, and Moses the servant of Yahweh gave it as an inheritance to the Reubenites, the Gadites, and the half-tribe of Manasseh.
translation:
  language: hi
  text: याहवे के सेवक मूसा और इस्राएल के पुत्रों[a] ने उन्हें मार गिराया। फिर याहवे के सेवक मूसा ने वह भूमि रूबेनियों, गादियों और मनश्शे के आधे गोत्र को विरासत के रूप में दे दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक स्वाभाविक रूप में, “इस्राएली।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: सेवक
  rationale: मूसा की उपाधि के रूप में यह शब्द समर्पित सेवा और याहवे से मिले दायित्व को व्यक्त करता है; यहाँ ‘दास’ की अपेक्षा ‘सेवक’ अधिक स्वाभाविक और प्रसंगानुकूल है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह अनुवाद मूल पाठ के स्पष्ट रूप से पुरुषवाची सामूहिक पदबंध ‘इस्राएल के पुत्र’ को बनाए रखता है; अधिक मुहावरेदार विकल्प फुटनोट में दिया गया है।
- source_word: הִכּוּם
  choice: उन्हें मार गिराया
  rationale: सैन्य प्रसंग में נכה प्रहार करके परास्त करने अथवा मार गिराने का बोध देता है; यह चयन क्रिया की ठोस शक्ति को बनाए रखता है।
- source_word: וַיִּתְּנָהּ
  choice: वह देश ... दे दिया
  rationale: स्त्रीलिंग प्रत्यय प्रसंग में समझी जाने वाली भूमि की ओर संकेत करता है; हिंदी में स्पष्टता के लिए ‘वह देश’ कहा गया है।
- source_word: יְרֻשָּׁה
  choice: विरासत के रूप में
  rationale: यह भूमि के उत्तराधिकार-स्वरूप स्थायी अधिकार को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לָרֻאוּבֵנִי
  choice: रूबेनियों
  rationale: एकवचन जातिवाचक रूप यहाँ सामूहिक रूप से रूबेन के गोत्र के लोगों को दर्शाता है।
- source_word: לַגָּדִי
  choice: गादियों
  rationale: जातिवाचक एकवचन का आशय सामूहिक है और गाद के गोत्र के लोगों को सूचित करता है।
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र
  rationale: यह पदबंध यरदन के पूर्व में भूमि पाने वाले मनश्शे गोत्र के आधे भाग को ठीक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: पुरुषवाची सामूहिक पदबंध בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मुख्य पाठ में इब्रानी पदबंध का पुरुषवाची रूप बनाए रखा गया है, जबकि सामान्य सामूहिक अर्थ को फुटनोट में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। वाक्य-विन्यास को हिंदी के अनुरूप बनाया गया है, पर मूल पाठ की पुनरावृत्ति ‘याहवे के सेवक मूसा’ और उसके सामूहिक, पुरुषवाची पदबंध को सुरक्षित रखा गया है।
