base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/001.yaml
  text: These are the kings of the land whom the sons of Israel struck down and whose land they took possession of beyond the Jordan[a], toward the sunrise, from the Wadi Arnon as far as Mount Hermon[d][c][b], and all the Arabah eastward.
translation:
  language: hi
  text: ये उस देश के वे राजा हैं जिन्हें इस्राएलियों[a] ने पराजित किया और जिनकी भूमि पर उन्होंने यरदन के पार, सूर्योदय की ओर[b]—अर्नोन की वादी[c] से लेकर हेर्मोन पर्वत तक और पूर्व की ओर पूरी अराबा[d] में—अधिकार कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘इस्राएल के पुत्रों’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘सूर्य के उदय की ओर’, अर्थात पूर्व की ओर।
    reason: lexical_alternative
  - marker: c
    text: ‘वादी’ ऐसी घाटी या जलधारा की तलहटी है जिसमें कभी-कभी या ऋतु के अनुसार पानी बहता है; इसका अनुवाद ‘नाला’ या ‘घाटी’ भी किया जाता है।
    reason: cultural_note
  - marker: d
    text: या ‘मैदान’। ‘अराबा’ उस दरार-घाटी क्षेत्र का विशिष्ट भौगोलिक नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ये ... हैं
  rationale: यह अभिव्यक्ति नई सूची आरम्भ करती है और पिछले प्रसंग से संबंध भी बनाए रखती है। हिन्दी में अलग से ‘अब’ जोड़ना आवश्यक नहीं है।
- source_word: מַלְכֵי הָאָרֶץ
  choice: उस देश के राजा
  rationale: निर्माण-संबंध को स्वाभाविक हिन्दी में रखते हुए ‘देश’ क्षेत्रीय भूमि का व्यापक अर्थ व्यक्त करता है।
- source_word: אֲשֶׁר הִכּוּ
  choice: जिन्हें ... मार गिराया
  rationale: נכה का सैनिक प्रसंग में प्रबल अर्थ ‘प्रहार करके गिराना’ है; ‘मार गिराया’ केवल सामान्य ‘हराया’ से अधिक निकट और सहज है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ की अपेक्षा यह आधुनिक हिन्दी में उसी जनसमुदाय का स्वाभाविक नाम है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וַיִּרְשׁוּ אֶת אַרְצָם
  choice: जिनके देश पर उन्होंने ... अधिकार कर लिया था
  rationale: विजय के प्रसंग में ירשׁ भूमि को अपने अधिकार में लेने का बोध देता है। संबंधवाचक रचना हिन्दी में पुनरुक्ति से बचाती है।
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार
  rationale: यह संक्षिप्त और परंपरागत भौगोलिक अभिव्यक्ति है; आगे का दिशासूचक वाक्यांश बताता है कि पूर्वी ओर अभिप्रेत है।
- source_word: מִזְרְחָה הַשָּׁמֶשׁ
  choice: सूर्योदय की ओर
  rationale: मूल के ‘सूर्य के उदय की ओर’ वाले चित्र को सुरक्षित रखते हुए यह हिन्दी में समझने योग्य है।
- source_word: מִנַּחַל אַרְנוֹן
  choice: अर्नोन की वादी से
  rationale: נחל स्थायी नदी मात्र नहीं, बल्कि जलधारा वाली घाटी या वादी को दर्शा सकता है; ‘वादी’ भौगोलिक विशेषता को सुरक्षित रखता है।
- source_word: עַד הַר חֶרְמוֹן
  choice: हेर्मोन पर्वत तक
  rationale: सीमा के विस्तार को सरल और स्पष्ट रूप में व्यक्त करता है।
- source_word: וְכָל הָעֲרָבָה
  choice: और ... पूरी अराबा
  rationale: עֲרָבָה यहाँ विशिष्ट दरार-घाटी क्षेत्र का नाम हो सकता है; इसलिए इसे सामान्य ‘मैदान’ बनाकर भौगोलिक विशिष्टता नहीं मिटाई गई।
- source_word: מִזְרָחָה
  choice: पूर्व की ओर की
  rationale: अंतिम दिशासूचक शब्द को अराबा क्षेत्र के पूर्वी भाग के साथ स्वाभाविक हिन्दी में जोड़ा गया है।
