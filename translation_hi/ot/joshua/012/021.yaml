  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार रूप में: “तानाक का एक राजा; मगिद्दो का एक राजा।” इब्रानी में इस सूची के गिनती-सूत्र के रूप में केवल “एक” दोहराया गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: का राजा
  rationale: इब्रानी रचना में यह प्रत्येक नगर-राज्य के शासक को प्रस्तुत करने वाला संबंधसूचक पद है; हिन्दी में ‘तानाक का राजा’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: תַּעְנַךְ
  choice: तानाक
  rationale: स्थाननाम का अनुवाद नहीं, देवनागरी में लिप्यंतरण किया गया है; अन्तिम व्यंजन को इब्रानी रूप के निकट ‘क’ रखा गया है।
- source_word: אֶחָד
  choice: एक
  rationale: यह विजय-सूची में गिनती का सूत्र है। मूल की संक्षिप्तता और पुनरावृत्ति बनाए रखने के लिए ‘एक राजा’ जोड़ने के बजाय केवल ‘एक’ रखा गया है।
- source_word: מֶלֶךְ
  choice: का राजा
  rationale: दूसरी सूची-प्रविष्टि में भी वही संबंधसूचक रचना संगति के साथ रखी गई है।
- source_word: מְגִדּוֹ
  choice: मगिद्दो
  rationale: स्थाननाम को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֶחָד
  choice: एक
  rationale: दोहराया गया गणना-पद है; सूची के इब्रानी ढाँचे को सुरक्षित रखने के लिए समान रूप से ‘एक’ रखा गया है।
