  rationale: सूची की शैली के अनुसार इस नगर के लिए एक राजा होने की संख्या सीधे रखी गई है।
- source_word: כָּל
  choice: कुल
  rationale: यह सूची के अंत में सभी गिने गए राजाओं का योग प्रस्तुत करता है; आधुनिक हिंदी में “कुल” संक्षिप्त और स्वाभाविक है।
- source_word: מְלָכִים
  choice: राजा
  rationale: हिंदी में संख्या “इकतीस” के साथ संज्ञा का यही रूप स्वाभाविक है।
- source_word: שְׁלֹשִׁים וְאֶחָד
  choice: इकतीस
  rationale: हिब्रू के संयुक्त अंक का मानक आधुनिक हिंदी रूप।
