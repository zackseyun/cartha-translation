- source_word: תִּרְצָה
  choice: तिर्सा
  rationale: स्थान के व्यक्तिवाचक नाम को उसके हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֶחָד
