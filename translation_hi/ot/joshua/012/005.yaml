base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/005.yaml
  text: and ruling over Mount Hermon[a], and Salecah, and all Bashan, as far as the border of the Geshurites and the Maacathites, and half of Gilead, to the border of Sihon king of Heshbon.
translation:
  language: hi
  text: और वह हेर्मोन पर्वत, सल्का और पूरे बाशान पर, गशूरियों और माकातियों की सीमा तक, और गिलाद के आधे भाग पर, हेशबोन के राजा सीहोन की सीमा तक शासन करता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और हेर्मोन पर्वत, सल्का और पूरे बाशान पर शासन करने वाला।” हिब्रू में कृदंत पिछले पद के वर्णन को जारी रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֵׁל
  choice: और वह ... शासन करता था
  rationale: हिब्रू कृदंत पिछले पद में ओग के विषय में चल रहे वर्णन को आगे बढ़ाता है और उसके निरंतर अधिकार को व्यक्त करता है। हिंदी में सीमित क्रिया वाला यह रूप स्वाभाविक है; पद-संबंध को आरंभिक “और” बनाए रखता है।
- source_word: בְּהַר חֶרְמוֹן
  choice: हेर्मोन पर्वत ... पर
  rationale: משל के साथ ב शासन के क्षेत्र को सूचित करता है; हिंदी में “पर शासन” इसका स्वाभाविक रूप है।
- source_word: וּבְסַלְכָה
  choice: सल्का
  rationale: यह ओग के अधिकार-क्षेत्र में स्थित स्थान का नाम है; स्रोत के व्यंजनात्मक रूप के निकट सरल हिंदी लिप्यंतरण अपनाया गया है।
- source_word: וּבְכָל הַבָּשָׁן
  choice: और पूरे बाशान पर
  rationale: כָל समूचे क्षेत्र को दर्शाता है। “पूरे बाशान” सहज हिंदी है और “पर” शासन के क्षेत्र को स्पष्ट करता है।
- source_word: עַד גְּבוּל
  choice: की सीमा तक
  rationale: עַד और גְּבוּל मिलकर अधिकार-क्षेत्र की अंतिम सीमा बताते हैं।
- source_word: הַגְּשׁוּרִי
  choice: गशूरियों
  rationale: एकवचन जातिवाचक रूप सामूहिक लोगों अथवा उनके क्षेत्र को इंगित करता है; “गशूरियों की सीमा” हिंदी में इस अर्थ को स्वाभाविक ढंग से रखता है।
- source_word: וְהַמַּעֲכָתִי
  choice: और माकातियों
  rationale: जातिवाचक रूप को समुदाय के बहुवचन नाम से व्यक्त किया गया है, क्योंकि सीमा उनके भूभाग के संदर्भ में है।
- source_word: וַחֲצִי הַגִּלְעָד
  choice: और गिलाद के आधे भाग पर
  rationale: यह ओग के अधीन गिलाद के आधे भूभाग को दर्शाता है; “आधे भाग” आधुनिक हिंदी में स्पष्ट है।
- source_word: גְּבוּל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: हेशबोन के राजा सीहोन की सीमा तक
  rationale: यह गिलाद के आधे भाग की सीमा को और स्पष्ट करता है। हिंदी का संबंधसूचक क्रम पदवी और स्थाननाम का संबंध सहजता से बताता है।
