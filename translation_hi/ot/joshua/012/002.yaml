id: JOS.12.2
reference: Joshua 12:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י הַ/יּוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן מֹשֵׁ֡ל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/ת֤וֹךְ הַ/נַּ֨חַל֙ וַ/חֲצִ֣י הַ/גִּלְעָ֔ד וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/002.yaml
  text: Sihon king of the Amorites[a], who lived in Heshbon, ruling from Aroer, which is on the bank of the Arnon Valley, and from the middle of the valley, and half of Gilead, as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: hi
  text: एमोरियों का राजा सीहोन, जो हेशबोन में रहता था, अरोएर से—जो अर्नोन नाले के किनारे है—नाले के मध्य भाग और गिलाद के आधे भाग पर यब्बोक नाले तक, जो अम्मोनियों की सीमा है, शासन करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֱמֹרִי
  choice: एमोरियों का
  rationale: यद्यपि इब्रानी रूप एकवचन है और राजा सीहोन के साथ संबंधसूचक है, आधुनिक हिन्दी में जनसमूह पर राज करने के अर्थ में ‘एमोरियों का राजा’ स्वाभाविक है।
- source_word: הַיּוֹשֵׁב
  choice: जो ... रहता था
  rationale: ישב का कृदन्त यहाँ निवास करने का अर्थ देता है; ‘रहता था’ आधुनिक और सहज हिन्दी है।
- source_word: מֹשֵׁל
  choice: शासन करता था
  rationale: משל का कृदन्त क्षेत्र पर राजनीतिक अधिकार और शासन व्यक्त करता है।
- source_word: מֵעֲרוֹעֵר
  choice: अरोएर से
  rationale: מ territorial extent के आरम्भ-बिंदु को दर्शाता है; ‘से’ इसका सीधा हिन्दी समकक्ष है।
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: अर्नोन नाले के किनारे पर
  rationale: שפה का अर्थ किनारा है, और נחל यहाँ घाटी में बहने वाले जलमार्ग अथवा उसके पाट को सूचित कर सकता है; ‘नाला’ नदी की अनिवार्यतः बारहमासी धारणा से बचाता है।
- source_word: וְתוֹךְ הַנַּחַל
  choice: तथा नाले के बीच से
  rationale: תוך का मूल अर्थ ‘बीच’ है। ‘से’ को भौगोलिक विस्तार की पूर्ववर्ती रचना के अनुसार समझकर रखा गया है, बिना यह तय किए कि आशय जलधारा, पाट या घाटी के ठीक किस भाग से है।
- source_word: וַחֲצִי הַגִּלְעָד
  choice: गिलाद के आधे भाग पर
  rationale: חצי आधे भूभाग को दर्शाता है; ‘पर’ शासन की क्रिया के साथ स्वाभाविक हिन्दी संबंध बनाता है।
- source_word: וְעַד יַבֹּק הַנַּחַל
  choice: यब्बोक नाले तक
  rationale: עד सीमा के अंतिम बिंदु को दर्शाता है; נחל के लिए वही स्थलाकृतिक शब्द रखा गया है जो अर्नोन के लिए प्रयुक्त हुआ है।
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: अम्मोनियों की सीमा
  rationale: בני עמון का शाब्दिक रूप ‘अम्मोन के पुत्र’ है, पर यहाँ यह जातिनाम है; ‘अम्मोनी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
