revisions:
- from: एमोरियों का राजा सीहोन, जो हेशबोन में रहता था और अरोएर से—जो अर्नोन नाले[a] के किनारे पर है—तथा नाले के बीच से लेकर गिलाद के आधे भाग पर, यब्बोक नाले तक शासन करता था; यब्बोक अम्मोनियों की सीमा थी।
  to: एमोरियों का राजा सीहोन, जो हेशबोन में रहता था, अरोएर से—जो अर्नोन नाले के किनारे है—नाले के मध्य भाग और गिलाद के आधे भाग पर यब्बोक नाले तक, जो अम्मोनियों की सीमा है, शासन करता था।
  rationale: The revision retains the Hebrew list of territories under Sihon’s rule while making the Hindi syntax readable. It preserves the topographical ambiguity of נחל through ‘नाला’ and its note, and it retains the source’s appositional description of the Jabbok as the Ammonite border.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:38:12Z'
review_pass:
  verdict: revise
  source_fidelity: Draft correctly identifies Sihon, Heshbon, Aroer, the Arnon, half of Gilead, the Jabbok, and the Ammonite border. However, its territorial syntax obscures the Hebrew coordinate list, and its final independent clause ('यब्बोक अम्मोनियों की सीमा थी') weakens the appositional identification of the Jabbok as the Ammonite border.
  naturalness: The sequence 'नाले के बीच से लेकर गिलाद के आधे भाग पर' is grammatically and idiomatically strained. Recasting the geographical elements as a clear list governed by 'शासन करता था' is more natural modern Hindi.
  terminology: ‘एमोरियों,’ ‘सीहोन,’ ‘हेशबोन,’ ‘अरोएर,’ ‘अर्नोन,’ ‘गिलाद,’ ‘यब्बोक,’ and ‘अम्मोनियों’ are suitable. ‘नाला’ is acceptable if its broader topographical sense is explained in the note. ‘नाले के मध्य भाग’ conveys the deliberately non-specific Hebrew expression without overdefining the terrain.
  issues:
  - severity: medium
    issue: The territorial phrases are syntactically misconnected.
    rationale: ‘तथा नाले के बीच से लेकर गिलाद के आधे भाग पर’ joins ‘से लेकर’ to ‘पर’ without a coherent construction, making the extent of Sihon’s rule unclear.
  - severity: medium
    issue: The Jabbok clause is rendered as a separate assertion rather than as an identifying apposition.
    rationale: גְּבוּל בְּנֵי עַמּוֹן identifies the Jabbok as ‘the border of the Ammonites.’ ‘जो अम्मोनियों की सीमा है’ preserves this connection directly.
  revised_text: एमोरियों का राजा सीहोन, जो हेशबोन में रहता था, अरोएर से—जो अर्नोन नाले के किनारे है—नाले के मध्य भाग और गिलाद के आधे भाग पर यब्बोक नाले तक, जो अम्मोनियों की सीमा है, शासन करता था।
  revised_footnotes:
  - marker: a
    text: ‘नाला’ के लिए प्रयुक्त इब्रानी शब्द ऐसी घाटी, वादी या जलधारा के पाट को भी दर्शा सकता है जिसमें पानी मौसमी रूप से बहता हो। यहाँ अर्नोन और यब्बोक भौगोलिक सीमाएँ हैं।
    reason: cultural_note
  revision_rationale: The revision retains the Hebrew list of territories under Sihon’s rule while making the Hindi syntax readable. It preserves the topographical ambiguity of נחל through ‘नाला’ and its note, and it retains the source’s appositional description of the Jabbok as the Ammonite border.
