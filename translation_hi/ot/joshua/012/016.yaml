    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: का राजा
  rationale: यह रचना-संबंधी रूप प्रत्येक नगर-राज्य के शासक का परिचय देता है; हिंदी में नगर के बाद ‘का राजा’ स्वाभाविक और स्पष्ट है।
- source_word: מַקֵּדָה
  choice: मक्केदा
  rationale: यह स्थान-नाम है, इसलिए इसका अर्थानुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: אֶחָד
  choice: एक
  rationale: विजित राजाओं की इस सूची में यह प्रत्येक राजा की संख्या बताता है; केवल ‘एक’ रखने से मूल की संक्षिप्त, दोहरावयुक्त सूची-शैली बनी रहती है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: यहाँ यह स्पष्ट रूप से स्थान-नाम है; इसलिए ‘परमेश्वर का घर’ जैसा व्युत्पत्तिपरक अनुवाद न करके प्रचलित बाइबलीय रूप ‘बेतेल’ रखा गया है।
