  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: का राजा
  rationale: इब्रानी रचना में यह नगर के नाम के साथ संबंध व्यक्त करता है; हिंदी में स्वाभाविक क्रम ‘मादोन का राजा’ है।
- source_word: מָדוֹן
  choice: मादोन
  rationale: स्थानवाचक व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: אֶחָד
  choice: एक
  rationale: विजित राजाओं की संक्षिप्त गणना में प्रयुक्त संख्या को दोहराव सहित सुरक्षित रखा गया है।
- source_word: חָצוֹר
  choice: हासोर
  rationale: स्थानवाचक व्यक्तिवाचक नाम का ऐसा देवनागरी लिप्यंतरण चुना गया है जो इब्रानी उच्चारण को निकटता से दर्शाता है।
