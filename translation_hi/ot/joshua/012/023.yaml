  text: the king of Dor in Naphath-dor[a], one; the king of Goiim in Gilgal, one[b];
translation:
  language: hi
  text: नाफ़त-दोर में दोर का राजा[a], एक; गिलगाल में गोयीम का राजा[b], एक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नाफ़त-दोर’ का अर्थ ‘दोर का क्षेत्र’ या ‘दोर का इलाका’ भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘गोयीम’ का सामान्य अर्थ ‘जातियाँ’ या ‘राष्ट्र’ है; इसलिए इसका अनुवाद ‘गिलगाल में जातियों का राजा’ भी हो सकता है। यहाँ यह किसी स्थान या जनसमूह का नाम भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: … का राजा
  rationale: इस पराजित राजाओं की सूची में यह पद प्रत्येक प्रविष्टि को आरम्भ करता है। हिंदी में संबंधसूचक ‘का’ के साथ ‘राजा’ स्वाभाविक और संक्षिप्त है।
- source_word: דּוֹר
  choice: दोर
  rationale: यह स्थान का नाम है, इसलिए इसका लिप्यंतरण किया गया है।
- source_word: לְנָפַת דּוֹר
  choice: नाफ़त-दोर में
  rationale: इस भौगोलिक पदबंध को यहाँ क्षेत्रीय नाम के रूप में लिप्यंतरित किया गया है। ‘में’ दोर के राजा का उस क्षेत्र से संबंध स्पष्ट करता है, जबकि ‘नाफ़त’ के सामान्य अर्थ की संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: אֶחָד
  choice: एक
  rationale: अध्याय की सूची में यह हर राजा के बाद गिनती बताने वाला संक्षिप्त पद है; इसलिए इब्रानी की संक्षिप्त शैली बनाए रखी गई है।
- source_word: גּוֹיִם
  choice: गोयीम
  rationale: यद्यपि इस शब्द का सामान्य अर्थ ‘जातियाँ’ या ‘राष्ट्र’ है, यहाँ यह किसी स्थान अथवा जनसमूह के नाम के रूप में प्रयुक्त हो सकता है। मुख्य पाठ में लिप्यंतरण अनिश्चितता को खुला रखता है।
- source_word: לְגִלְגָּל
  choice: गिलगाल में
  rationale: उपसर्ग ל यहाँ स्थान से संबंध दर्शाता है; ‘में’ इस स्थानीय संबंध को सहज हिंदी में व्यक्त करता है।
