- source_word: מֶלֶךְ
  choice: का राजा
  rationale: यह संबंधसूचक रचना प्रत्येक नगर के शासक को दर्शाती है; हिंदी में स्थान-नाम के बाद ‘का राजा’ स्वाभाविक और सटीक है।
- source_word: חָרְמָה
  choice: होर्मा
  rationale: यह स्थान-नाम है, इसलिए इसका अनुवाद करने के बजाय प्रचलित हिंदी रूप में लिप्यंतरण किया गया है।
- source_word: אֶחָד
  choice: एक
  rationale: इस दोहराव वाली सूची में यह संख्या प्रत्येक पराजित राजा की गिनती बताती है; केवल ‘एक’ रखने से इब्रानी की संक्षिप्त संरचना और लय बनी रहती है।
- source_word: עֲרָד
  choice: अराद
  rationale: यह स्थान-नाम है और इसे प्रचलित हिंदी रूप में लिप्यंतरित किया गया है।
