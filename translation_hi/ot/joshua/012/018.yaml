- source_word: מֶלֶךְ
  choice: का राजा
  rationale: विजय-सूची के इस संदर्भ में यह प्रत्येक पराजित शासक का परिचय देता है। हिंदी में स्थान के साथ संबंधसूचक रचना ‘अफेक का राजा’ स्वाभाविक और मूल के निकट है।
- source_word: אֲפֵק
  choice: अफेक
  rationale: यह स्थानवाचक नाम है, इसलिए इसका अनुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: אֶחָד
  choice: एक
  rationale: यहाँ यह प्रत्येक प्रविष्टि की गणना बताता है। केवल ‘एक’ रखने से इब्रानी की संक्षिप्त सूची-शैली बनी रहती है।
- source_word: לַ/שָּׁרוֹן
  choice: शारोन
  rationale: यह क्षेत्र का नाम है। इब्रानी में उपसर्ग के साथ निश्चित उपपद है, पर आधुनिक हिंदी में नाम से पहले अलग निश्चित उपपद नहीं लगाया जाता; ‘शारोन का राजा’ स्वाभाविक रूप से उसी क्षेत्र को दर्शाता है।
