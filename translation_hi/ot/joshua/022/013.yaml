source:
  edition: WLC
  text: וַ/יִּשְׁלְח֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶל בְּנֵי רְאוּבֵ֧ן וְ/אֶל בְּנֵי גָ֛ד וְ/אֶל חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁ֖ה אֶל אֶ֣רֶץ הַ/גִּלְעָ֑ד אֶת פִּינְחָ֖ס בֶּן אֶלְעָזָ֥ר הַ/כֹּהֵֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/013.yaml
  text: Then the sons of Israel sent Phinehas son of Eleazar the priest to the sons of Reuben[a], to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead.
translation:
  language: hi
  text: तब इस्राएलियों ने एलीआज़ार याजक के पुत्र पीनहास को गिलाद देश में रूबेनियों, गादियों और मनश्शे के आधे गोत्र के पास भेजा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: तब ... भेजा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम की स्वाभाविक प्रगति व्यक्त करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर सामुदायिक नाम के रूप में ‘इस्राएली’ आधुनिक हिन्दी में अधिक स्वाभाविक और स्पष्ट है।
- source_word: בְנֵי רְאוּבֵן וְאֶל בְּנֵי גָד
  choice: रूबेनियों, गादियों
  rationale: हिब्रू में शाब्दिक रूप से ‘रूबेन के पुत्र’ और ‘गाद के पुत्र’ है; हिन्दी के जातिवाचक बहुवचन यहाँ सहज रूप से उन्हीं गोत्रीय समुदायों को व्यक्त करते हैं।
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र
  rationale: यह पदबंध गोत्र के उस आधे भाग को निर्दिष्ट करता है जो यरदन के पूर्व में बसा था; अनुवाद हिब्रू संरचना और अर्थ दोनों को स्पष्ट रखता है।
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: जो गिलाद देश में थे
  rationale: אֶל का मूल दिशात्मक भाव है, पर यहाँ ‘गिलाद देश’ प्राप्तकर्ताओं के स्थान को स्पष्ट करता है। सम्बन्धवाचक उपवाक्य हिन्दी में संभावित अस्पष्टता दूर करता है कि भेजा गया व्यक्ति वहाँ स्थित गोत्रों के पास गया।
- source_word: אֶת פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: एलीआज़ार याजक के पुत्र पीनहास को
  rationale: אֶת को कर्मचिह्न ‘को’ से व्यक्त किया गया है। हिब्रू शब्दक्रम में ‘याजक’ निकटतम रूप से एलीआज़ार का पद बताता है; हिन्दी क्रम इसी सम्बन्ध को स्पष्ट रखता है।
theological_decisions:
- issue: הַכֹּהֵן विशेषण किसके लिए है
  choice: एलीआज़ार को याजक के रूप में पहचाना गया है
  alternative: पीनहास को याजक के रूप में पहचाना गया है
  rationale: शब्दक्रम में הַכֹּהֵן ‘एलीआज़ार’ के तुरंत बाद आता है और सामान्यतः उसी के साथ सम्बद्ध समझा जाता है। फिर भी पीनहास भी याजकीय वंश का था; अनुवाद केवल इस वाक्य की व्याकरणिक संरचना के अनुसार सम्बन्ध व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। जातीय/गोत्रीय पदों के लिए ‘इस्राएली’, ‘रूबेनी’ और ‘गादी’ जैसे प्रचलित हिन्दी रूप चुने गए हैं; अनावश्यक रूप से शाब्दिक ‘पुत्र’ संरचना नहीं अपनाई गई।
