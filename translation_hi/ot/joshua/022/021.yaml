base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/021.yaml
  text: 'Then the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh answered and spoke to the heads of the clans of Israel:'
translation:
  language: hi
  text: 'तब रूबेन के वंशजों, गाद के वंशजों और मनश्शे के आधे गोत्र ने उत्तर दिया और इस्राएल के कुलों के प्रधानों[a] से कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “इस्राएल के हज़ारों के प्रधान”; यहाँ “हज़ारों” से संभवतः कुलों या गोत्रीय जन-विभागों के प्रधान अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: उत्तर दिया
  rationale: संवाद के प्रसंग में קַל रूप का ענה पहले कही गई बात के प्रत्युत्तर को सूचित करता है; ‘उत्तर दिया’ इस कथात्मक संबंध को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: रूबेन के वंशजों, गाद के वंशजों
  rationale: शाब्दिक ‘पुत्रों’ की अपेक्षा ‘वंशजों’ से इब्रानी की वंशपरक अभिव्यक्ति बनी रहती है और यह स्पष्ट होता है कि पूरे जनसमूहों की बात हो रही है।
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र
  rationale: यह रचना इब्रानी पदबंध के निकट रहते हुए आधुनिक हिन्दी में स्वाभाविक है और मनश्शे के गोत्र के उस आधे भाग को दर्शाती है जो यहाँ संबोधित है।
- source_word: וַיְדַבְּרוּ
  choice: और … से कहा
  rationale: דבר के बोलने के अर्थ को हिन्दी के स्वाभाविक संवाद-विन्यास में व्यक्त किया गया है; ‘उत्तर दिया और … से कहा’ मूल के दोनों कथात्मक क्रियापदों को बनाए रखता है।
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: इस्राएल के कुलों के प्रधानों
  rationale: רָאשֵׁי का अर्थ ‘प्रधान’ है। אַלְפֵי का शाब्दिक अर्थ ‘हज़ारों’ है, पर इस प्रशासनिक-सामाजिक संदर्भ में यह कुल अथवा जन-विभागों को सूचित करता है; मुख्य पाठ में अर्थ-सुगम अनुवाद और पादटिप्पणी में शाब्दिक रूप दिया गया है।
