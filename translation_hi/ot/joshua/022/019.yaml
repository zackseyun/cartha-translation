source:
  edition: WLC
  text: וְ/אַ֨ךְ אִם טְמֵאָ֜ה אֶ֣רֶץ אֲחֻזַּתְ/כֶ֗ם עִבְר֨וּ לָ/כֶ֜ם אֶל אֶ֨רֶץ אֲחֻזַּ֤ת יְהוָה֙ אֲשֶׁ֤ר שָֽׁכַן שָׁם֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/הֵאָחֲז֖וּ בְּ/תוֹכֵ֑/נוּ וּ/בַֽ/יהוָ֣ה אַל תִּמְרֹ֗דוּ וְ/אֹתָ֨/נוּ֙ אֶל תִּמְרֹ֔דוּ בִּ/בְנֹֽתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ מִֽ/בַּלְעֲדֵ֔י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/019.yaml
  text: But if the land of your possession is unclean[a], cross over for yourselves into the land of Yahweh’s possession, where Yahweh’s tabernacle dwells, and take possession among us. Only do not rebel against Yahweh, or against us[d][c][b], by building for yourselves an altar besides the altar of Yahweh our God.
translation:
  language: hi
  text: पर यदि तुम्हारे स्वामित्व वाली भूमि अशुद्ध है[a], तो पार करके यहोवा के स्वामित्व वाली भूमि में आ जाओ, जहाँ यहोवा का निवास-तंबू स्थित है[b], और हमारे बीच भूमि में हिस्सा ले लो[c]। पर यहोवा के विरुद्ध विद्रोह मत करना, और हमारे विरुद्ध भी विद्रोह मत करना—हमारे परमेश्वर यहोवा की वेदी के अतिरिक्त अपने लिए कोई वेदी बनाकर[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी पैतृक भूमि” या “तुम्हारे हिस्से की भूमि।” इब्रानी शब्द विरासत में मिले भू-भाग या स्थायी भू-अधिकार का भी अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जहाँ यहोवा का निवास-तंबू वहाँ निवास करता है।”
    reason: source_form
  - marker: c
    text: या, “हमारे बीच बस जाओ।” इब्रानी क्रिया किसी स्थान में भू-अधिकार पाने या बसने, दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: d
    text: “के अतिरिक्त” का अर्थ “से पृथक” या “के अलावा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  choice: पर यदि
  rationale: וְאַךְ यहाँ पिछले कथन पर प्रबल शर्त/अपवाद प्रस्तुत करता है; आधुनिक हिन्दी में ‘पर यदि’ स्वाभाविक रूप से यह बल व्यक्त करता है।
- source_word: טְמֵאָה
  choice: अशुद्ध
  rationale: यह शब्द धार्मिक/अनुष्ठानिक अशुद्धता का संकेत दे सकता है, पर उसका सटीक स्वरूप नहीं बताता; ‘अशुद्ध’ इस अस्पष्टता को बनाए रखता है।
- source_word: אֶרֶץ אֲחֻזַּתְכֶם
  choice: तुम्हारी अधिकार की भूमि
  rationale: אֲחֻזָּה स्थायी या पैतृक भू-अधिकार को दर्शाता है। ‘अधिकार की भूमि’ आगे आने वाले ‘यहोवा के अधिकार की भूमि’ के साथ मूल की समानांतरता बनाए रखता है।
- source_word: עִבְרוּ לָכֶם
  choice: अपने लिए पार होकर ... आ जाओ
  rationale: עִבְרוּ पार जाने, सम्भवतः यरदन पार करने, को बताता है; לָכֶם का हितार्थक/आत्मवाचक भाव ‘अपने लिए’ से रखा गया है। लक्ष्य की ओर आने का हिन्दी मुहावरा वाक्य को स्वाभाविक बनाता है।
- source_word: אֶל אֶרֶץ אֲחֻזַּת יְהוָה
  choice: यहोवा के अधिकार की भूमि में
  rationale: पहले אֲחֻזָּה के अनुवाद को दोहराकर मूल का जानबूझकर किया गया विरोध और समानांतरता सुरक्षित रहती है। יהוה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: אֲשֶׁר שָׁכַן שָׁם מִשְׁכַּן יְהוָה
  choice: जहाँ यहोवा का निवास-तंबू निवास करता है
  rationale: मूल में שכן और משכן की ध्वन्यात्मक तथा अर्थगत पुनरुक्ति है। हिन्दी में ‘निवास-तंबू निवास करता है’ कुछ असामान्य होते हुए भी उसी साहित्यिक प्रभाव को सुरक्षित रखता है।
- source_word: וְהֵאָחֲזוּ בְּתוֹכֵנוּ
  choice: हमारे बीच अपना अधिकार ले लो
  rationale: אחז का निफ़ाल रूप यहाँ भू-अधिकार प्राप्त करने या बसने का भाव रखता है। यह अनुवाद भूमि-अधिकार का अर्थ बनाए रखता है; ‘बस जाओ’ पादटिप्पणी में दिया गया है।
- source_word: וּבַיהוָה אַל תִּמְרֹדוּ וְאֹתָנוּ אַל תִּמְרֹדוּ
  choice: पर यहोवा से विद्रोह मत करो, और हमसे भी विद्रोह मत करो
  rationale: दोनों समानांतर निषेधों को स्पष्ट रखा गया है। हिन्दी में ‘से विद्रोह करना’ स्वाभाविक है और दूसरे निषेध में क्रिया दोहराने से मूल का जोर बना रहता है।
- source_word: בִּבְנֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: अपने लिए ... कोई वेदी बनाकर
  rationale: בְּ सहित क्रियारूप साधन या परिस्थिति बताता है; ‘बनाकर’ दिखाता है कि ऐसा निर्माण ही विद्रोह का रूप होगा।
- source_word: מִבַּלְעֲדֵי מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: हमारे परमेश्वर यहोवा की वेदी के अलावा कोई वेदी
  rationale: מִבַּלְעֲדֵי का भाव ‘के अलावा/से पृथक/के अतिरिक्त’ हो सकता है। मुख्य पाठ में ‘के अलावा’ प्रतिद्वंद्वी या अनधिकृत वेदी का संकेत देता है, बिना निषेध का दायरा आवश्यकता से अधिक निर्धारित किए।
theological_decisions:
- issue: यरदन-पार की भूमि की अशुद्धता का स्वरूप
  choice: ‘अशुद्ध’ कहकर शर्त को सीधे प्रस्तुत किया गया है।
  alternative: भूमि को स्पष्टतः अनुष्ठानिक रूप से दूषित या केंद्रीय पवित्रस्थान से बाहर होने के कारण अनुपयुक्त बताना।
  rationale: इब्रानी पाठ अशुद्धता का कारण या प्रकार स्पष्ट नहीं करता; अनुवाद इस धार्मिक और भौगोलिक तनाव को खुला रखता है।
- issue: अतिरिक्त वेदी का दर्जा
  choice: यहोवा की वेदी के अलावा वेदी बनाने को विद्रोह के रूप में प्रस्तुत किया गया है।
  alternative: हर दूसरी वेदी को अपने-आप निषिद्ध घोषित करना, या इसे केवल बलि चढ़ाने वाली प्रतिद्वंद्वी वेदी तक सीमित करना।
  rationale: पद अतिरिक्त वेदी का विरोध करता है, लेकिन इस पद में उसके प्रयोजन या निषेध की पूर्ण सीमा नहीं समझाई गई; इसलिए अनुवाद उससे आगे नहीं जाता।
- issue: भूमि पर अधिकार और बसने का सम्बन्ध
  choice: मुख्य पाठ में भू-अधिकार का भाव रखा गया है।
  alternative: केवल ‘हमारे बीच बस जाओ’ कहना।
  rationale: सन्दर्भ बसने का है, फिर भी אחז और אֲחֻזָּה का निकट सम्बन्ध भूमि पर अधिकार की शब्दावली को महत्त्व देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ स्तर रखा गया है। ‘यहोवा’, ‘निवास-तंबू’, ‘वेदी’ और ‘विद्रोह’ जैसे स्थापित बाइबलीय शब्द प्रयुक्त हैं। अधिकार/अधिकार की भूमि की पुनरावृत्ति मूल की भूमि-संबंधी शब्दावली को बनाए रखने के लिए जानबूझकर रखी गई है।
