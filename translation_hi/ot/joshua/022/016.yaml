base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/016.yaml
  text: 'Thus says the whole congregation of Yahweh: ‘What is this breach of faith that you have committed against the God of Israel[a], turning away today from following Yahweh by building for yourselves an altar, rebelling today against Yahweh?’'
translation:
  language: hi
  text: 'याहवे की पूरी मण्डली यह कहती है: “तुमने इस्राएल के परमेश्वर के विरुद्ध यह कैसा विश्वासघात[a] किया है कि आज तुम याहवे के पीछे चलना छोड़ रहे हो और अपने लिए एक वेदी बनाकर आज याहवे के विरुद्ध विद्रोह कर रहे हो?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निष्ठाभंग” अथवा “बेवफाई।” इब्रानी शब्द विशेष रूप से वाचा या उपासना के क्षेत्र में निष्ठा तोड़ने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמְרוּ
  choice: यह कहती है
  rationale: सन्देशवाहक सूत्र को आधुनिक स्वाभाविक हिन्दी में प्रस्तुत किया गया है; पूर्ण क्रिया का वर्तमानार्थ और सामूहिक एकवचन कर्ता सुरक्षित हैं।
- source_word: כֹּל עֲדַת יְהוָה
  choice: याहवे की पूरी मण्डली
  rationale: עֵדָה वाचा-बद्ध एकत्र समुदाय को दर्शाता है; ‘मण्डली’ औपचारिक सामुदायिक अर्थ बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: מָה הַמַּעַל הַזֶּה ... מְעַלְתֶּם
  choice: यह कैसा विश्वासघात ... किया है
  rationale: संज्ञा और उसी मूल की क्रिया के बल को स्वाभाविक हिन्दी में रखा गया है; ‘विश्वासघात’ वाचा और उपासना-संबंधी निष्ठाभंग को व्यक्त करता है।
- source_word: בֵּאלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर के विरुद्ध
  rationale: מעל के साथ ב अपराध के लक्ष्य को सूचित करता है, इसलिए ‘के विरुद्ध’ प्रसंगानुकूल है।
- source_word: לָשׁוּב ... מֵאַחֲרֵי יְהוָה
  choice: याहवे के पीछे चलना छोड़ दिया
  rationale: शाब्दिक ‘पीछे से फिरना’ के बजाय हिन्दी का स्वाभाविक वाक्यांश चुना गया है, जिसमें अनुकरण और वाचा-निष्ठा का भाव बना रहता है।
- source_word: בִּבְנוֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: अपने लिए एक वेदी बनाकर
  rationale: ב सहित क्रियार्थक संज्ञा आरोपित विमुखता के साधन या परिस्थिति को व्यक्त करती है।
- source_word: לִמְרָדְכֶם ... בַּיהוָה
  choice: याहवे से विद्रोह किया
  rationale: ל वाला रूप परिणाम या उद्देश्य का बल रखता है; हिन्दी में ‘से विद्रोह’ मानक और स्पष्ट है।
- source_word: הַיּוֹם
  choice: आज
  rationale: मूल में दोनों बार आए शब्द को उसकी तात्कालिकता और आलंकारिक पुनरावृत्ति सहित रखा गया है।
theological_decisions:
- issue: מַעַל में वाचा-संबंधी अपराध का अर्थ
  choice: विश्वासघात
  alternative: निष्ठाभंग; छल
  rationale: प्रसंग सामान्य पाप का नहीं, परमेश्वर के प्रति वाचा और उपासना-संबंधी निष्ठा तोड़ने के आरोप का है। ‘विश्वासघात’ इस भार को सामान्य पाठक के लिए स्पष्ट रखता है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; उसका लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: वेदी बनाने के कार्य और विद्रोह के बीच सम्बन्ध
  choice: वक्ता का आरोप सीधे रूप में रखा गया
  alternative: वेदी को वस्तुतः धर्मत्यागी घोषित करने वाली व्याख्या
  rationale: इस पद में इस्राएली मण्डली आरोप लगा रही है; आगे का वृत्तांत आरोप के उत्तर को सामने लाता है। अनुवाद वक्ता की तीव्रता रखता है, पर अतिरिक्त धर्मवैधानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक आरोप का स्वर रखा गया है। ‘मण्डली,’ ‘वेदी’ और ‘विद्रोह’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं; वाक्य को अनावश्यक रूप से संस्कृतनिष्ठ नहीं बनाया गया।
