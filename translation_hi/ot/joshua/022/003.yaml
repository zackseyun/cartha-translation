  text: לֹֽא עֲזַבְתֶּ֣ם אֶת אֲחֵי/כֶ֗ם זֶ֚ה יָמִ֣ים רַבִּ֔ים עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/שְׁמַרְתֶּ֕ם אֶת מִשְׁמֶ֕רֶת מִצְוַ֖ת יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/003.yaml
  text: You have not forsaken your brothers these many days[a], up to this day, and you have kept the charge of the commandment of Yahweh your God.
translation:
  language: hi
  text: इतने लंबे समय से आज तक तुमने अपने भाइयों[a] को नहीं छोड़ा, और तुमने अपने परमेश्वर याहवे की आज्ञा का पालन करने का दायित्व निभाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने साथी इस्राएलियों’। इब्रानी में शाब्दिक रूप से ‘अपने भाइयों’ है; यह पुल्लिंग बहुवचन संबंधवाचक शब्द यहाँ इस्राएल के अन्य सदस्यों को व्यापक रूप से सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַבְתֶּם
  choice: तुमने ... को नहीं छोड़ा
  rationale: עזב का अर्थ छोड़ना, त्याग देना या परित्याग करना हो सकता है। यहाँ ‘नहीं छोड़ा’ सहज आधुनिक हिन्दी में संबंध और निष्ठा—दोनों को व्यक्त करता है।
- source_word: אֲחֵיכֶם
  choice: अपने भाइयों[a]
  rationale: मूल शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन ‘तुम्हारे भाई’ है। मुख्य पाठ उसका रूप बनाए रखता है; इस्राएली समुदाय के व्यापक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: זֶה יָמִים רַבִּים
  choice: इतने लंबे समय से
  rationale: यह इब्रानी कालवाचक मुहावरा बहुत दिनों की लंबी अवधि बताता है। चुना हुआ वाक्यांश आधुनिक हिन्दी में स्वाभाविक रूप से वही बल व्यक्त करता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह बीते समय से वर्तमान दिन तक निरंतरता बताने वाला सामान्य कालवाचक प्रयोग है।
- source_word: וּשְׁמַרְתֶּם
  choice: निभाते रहे हो
  rationale: שׁמר यहाँ सौंपे गए दायित्व को निष्ठापूर्वक बनाए रखने और पूरा करने का भाव देता है; निरंतरता के प्रसंग में ‘निभाते रहे हो’ स्वाभाविक है।
- source_word: מִשְׁמֶרֶת מִצְוַת
  choice: आज्ञा का पालन करने का दायित्व
  rationale: यह पदबंध किसी आज्ञा से प्राप्त सौंपे हुए कर्तव्य या दायित्व को दर्शाता है। हिन्दी में यह रूप मूल के दोनों तत्त्व—आज्ञा और दायित्व—को स्पष्ट तथा सहज रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: 'यह प्रत्यय सहित सीधा वाचक संबंध है: ‘तुम्हारे परमेश्वर’; हिन्दी वाक्य में कर्ता के अनुरूप ‘अपने परमेश्वर’ अधिक स्वाभाविक है।'
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: वाचा-समुदाय के लिए अֲחֵיכֶם का लिंगयुक्त संबंधवाचक प्रयोग
  choice: अपने भाइयों
  alternative: अपने साथी इस्राएलियों
  rationale: मूल रूप पुल्लिंग बहुवचन ‘भाई’ है, इसलिए मुख्य पाठ में उसे बनाए रखा गया है। इस संदर्भ में उसके संभावित व्यापक सामुदायिक संकेत को पादटिप्पणी में दिया गया है।
- issue: מִשְׁמֶרֶת מִצְוַת की औपचारिक संरचना
  choice: आज्ञा का पालन करने का दायित्व
  alternative: आज्ञा की रखवाली; आज्ञा का भार
  rationale: शाब्दिक संरचना हिन्दी में अस्पष्ट या अस्वाभाविक हो सकती है। चुना हुआ रूप सौंपे हुए दायित्व और परमेश्वर की आज्ञा के बीच संबंध को सुरक्षित रखता है, बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े।
translation_notes:
  register: भाषा आधुनिक, सहज और सम्मानपूर्ण रखी गई है। ‘इतने लंबे समय से आज तक’ निरंतर अवधि पर बल देता है, जबकि ‘दायित्व निभाते रहे हो’ मूल के निष्ठापूर्ण पालन को स्वाभाविक हिन्दी में व्यक्त करता है।
