lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह काल-सूचक कथात्मक चिह्न अगले घटनाक्रम का परिचय देता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: יִקְרָא
  choice: बुलाया
  rationale: काल रूप कथानक में भूतकालीन क्रम को व्यक्त करता है। क्रिया का अर्थ यहाँ इन समूहों को अपने पास बुलाना है; ‘बुलाया’ सामान्य आधुनिक हिन्दी में उपयुक्त है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय रूप।
- source_word: לָרֽאוּבֵנִי
  choice: रूबेनियों
  rationale: एकवचन जातिवाचक रूप यहाँ पूरे सामुदायिक समूह के लिए सामूहिक अर्थ में प्रयुक्त है।
- source_word: וְלַגָּדִי
  choice: गादियों
  rationale: जातिवाचक एकवचन का सामूहिक अर्थ हिन्दी बहुवचन ‘गादियों’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: וְלַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र को
  rationale: מַטֶּה यहाँ इस्राएली गोत्र को दर्शाता है; हिन्दी में ‘मनश्शे का आधा गोत्र’ स्पष्ट और प्रचलित अभिव्यक्ति है।
