source:
  edition: WLC
  text: הֲ/ל֣וֹא עָכָ֣ן בֶּן זֶ֗רַח מָ֤עַל מַ֨עַל֙ בַּ/חֵ֔רֶם וְ/עַֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל הָ֣יָה קָ֑צֶף וְ/הוּא֙ אִ֣ישׁ אֶחָ֔ד לֹ֥א גָוַ֖ע בַּ/עֲוֺנֽ/וֹ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/020.yaml
  text: Was it not Achan son of Zerah who acted unfaithfully in the matter of what was devoted to destruction, and wrath came upon all the congregation of Israel? Yet he was not the only man who perished in his iniquity.
translation:
  language: hi
  text: क्या जेरह के पुत्र आकान ने विनाश के लिए अर्पित वस्तु के विषय में विश्वासघात नहीं किया था, जिसके कारण इस्राएल की पूरी सभा पर क्रोध भड़का? फिर भी, वह अपने अधर्म के कारण अकेला नहीं मरा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָעַל מַעַל
  choice: विश्वासघात किया
  rationale: धातु מעל covenantal unfaithfulness अथवा पवित्र वस्तु के संबंध में बेईमानी दर्शाती है; हिन्दी में ‘विश्वासघात किया’ इस नैतिक और धार्मिक गंभीरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַחֵרֶם
  choice: विनाश के लिए अर्पित वस्तु के विषय में
  rationale: חֵרֶם उस वस्तु को सूचित करता है जो परमेश्वर को समर्पित होकर विनाश के लिए ठहराई गई थी; यह रूप केवल ‘वर्जित वस्तु’ कहने से अधिक स्पष्ट है और यहोशू 7 के प्रसंग को सुरक्षित रखता है।
- source_word: קָצֶף
  choice: क्रोध भड़का
  rationale: यहाँ शब्द दैवी रोष को दर्शाता है; ‘क्रोध भड़का’ हिन्दी में उसके समुदाय पर आने की तीव्रता व्यक्त करता है।
- source_word: עֲדַת יִשְׂרָאֵל
  choice: इस्राएल की पूरी सभा
  rationale: עֵדָה के सामुदायिक अर्थ के लिए ‘सभा’ उपयुक्त है और כָּל को ‘पूरी’ से स्पष्ट किया गया है।
- source_word: גָוַע
  choice: मरा
  rationale: גוע प्राण निकलने/मरने का सामान्य किंतु गंभीर क्रियापद है; आधुनिक हिन्दी में ‘मरा’ सीधा और स्वाभाविक है।
- source_word: בַעֲוֺנוֹ
  choice: अपने अधर्म के कारण
  rationale: בְּ का यहाँ कारणात्मक अर्थ प्रसंगानुकूल है; עָוֹן दोष, अपराध और उसके दंडगत परिणाम की अर्थ-छाया रखता है, जिसे ‘अधर्म’ पर्याप्त रूप से वहन करता है।
theological_decisions:
- issue: आकान के अपराध और सामुदायिक दंड का संबंध
  choice: ‘जिसके कारण इस्राएल की पूरी सभा पर क्रोध भड़का’
  alternative: ‘और इस्राएल की पूरी सभा पर क्रोध आया’
  rationale: हिब्रू וְעַל क्रमागत कथन देता है, जबकि प्रसंग स्पष्ट कारणात्मक संबंध दिखाता है। ‘जिसके कारण’ इसे स्वाभाविक हिन्दी में व्यक्त करता है, बिना दैवी न्याय की प्रकृति पर अतिरिक्त सिद्धांत आरोपित किए।
- issue: अंतिम वाक्य में अकेले न मरने का आशय
  choice: ‘वह अकेला व्यक्ति नहीं था जो अपने अधर्म के कारण मरा’
  alternative: ‘वह अपने अधर्म में अकेला नहीं मरा’
  rationale: हिब्रू संरचना לֹא גָוַע ... אִישׁ אֶחָד का आशय यह है कि उसके अपराध के परिणाम में अन्य लोग भी मरे। चुना हुआ रूप इस सामुदायिक परिणाम को स्पष्ट रखता है, पर उन अन्य मृतकों की पहचान या दोष के विषय में अतिरिक्त दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रश्नात्मक और चेतावनीपूर्ण लहजा, तथा सार्वजनिक पाठ के योग्य गरिमामय शैली रखी गई है। ‘आकान’, ‘जेरह’ और ‘इस्राएल’ प्रचलित हिन्दी बाइबलीय नामरूप हैं।
