source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם לֵ/אמֹ֗ר בִּ/נְכָסִ֨ים רַבִּ֜ים שׁ֤וּבוּ אֶל אָֽהֳלֵי/כֶם֙ וּ/בְ/מִקְנֶ֣ה רַב מְאֹ֔ד בְּ/כֶ֨סֶף וּ/בְ/זָהָ֜ב וּ/בִ/נְחֹ֧שֶׁת וּ/בְ/בַרְזֶ֛ל וּ/בִ/שְׂלָמ֖וֹת הַרְבֵּ֣ה מְאֹ֑ד חִלְק֥וּ שְׁלַל אֹיְבֵי/כֶ֖ם עִם אֲחֵי/כֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/008.yaml
  text: And he said to them[a], “Return to your tents with great wealth, with very much livestock, with silver and gold, with bronze and iron, and with very many garments[c][b]. Divide the plunder of your enemies with your brothers.”
translation:
  language: hi
  text: उसने उनसे कहा, “बहुत-सी संपत्ति, बहुत अधिक पशुधन, चाँदी, सोना, काँसा[a], लोहा और बहुत अधिक वस्त्र लेकर अपने तंबुओं में लौट जाओ। अपने शत्रुओं की लूट अपने भाइयों[b] के साथ बाँट लो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ताँबा।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाइयों” से आशय उनके साथी इस्राएलियों से है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר
  choice: उसने उनसे कहा
  rationale: हिब्रू का ‘कहा ... यह कहते हुए’ वाला कथात्मक सूत्र हिन्दी में केवल ‘कहा’ से स्वाभाविक और पूर्ण रूप से व्यक्त होता है।
- source_word: בִּנְכָסִים רַבִּים
  choice: बहुत-सी संपत्ति
  rationale: נְכָסִים संपत्ति, धन-दौलत या माल-असबाब का व्यापक बोध देता है; आगे की सूची से पहले ‘संपत्ति’ उपयुक्त सामूहिक शब्द है।
- source_word: שׁוּבוּ אֶל אָהֳלֵיכֶם
  choice: अपने तंबुओं को लौट जाओ
  rationale: ‘तंबुओं’ से ऐतिहासिक परिवेश सुरक्षित रहता है, जबकि वाक्यांश का आशय अपने निवास-स्थान लौटना है।
- source_word: וּבְמִקְנֶה רַב מְאֹד
  choice: बहुत अधिक पशुधन
  rationale: מִקְנֶה केवल गाय-बैलों तक सीमित नहीं, बल्कि सामूहिक रूप से पालतू पशुओं को दर्शाता है; מְאֹד की तीव्रता ‘बहुत अधिक’ में व्यक्त है।
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: चाँदी, सोना
  rationale: दोनों धातु-संज्ञाओं का सीधा और प्रचलित हिन्दी रूप।
- source_word: וּבִנְחֹשֶׁת וּבְבַרְזֶל
  choice: काँसा, लोहा
  rationale: נְחֹשֶׁת प्राचीन संदर्भ में ताँबे या काँसे को सूचित कर सकता है; धातुओं की ऐसी सूचियों में ‘काँसा’ पारंपरिक और उपयुक्त है, और विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וּבִשְׂלָמוֹת הַרְבֵּה מְאֹד
  choice: बहुत-से वस्त्र
  rationale: שְׂלָמוֹת वस्त्रों या पहनावों का व्यापक शब्द है; ‘बहुत-से’ संख्या की प्रबलता को सहज हिन्दी में व्यक्त करता है।
- source_word: חִלְקוּ שְׁלַל אֹיְבֵיכֶם
  choice: अपने शत्रुओं से मिली लूट को ... बाँट लो
  rationale: שָׁלָל युद्ध में प्राप्त लूट है और חִלְקוּ बहुवचन आज्ञा है; ‘से मिली’ हिन्दी में संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: עִם אֲחֵיכֶם
  choice: अपने भाइयों के साथ
  rationale: אָחִים का पुरुषवाचक संबंध-सूचक रूप सुरक्षित रखा गया है; संदर्भगत व्यापक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: אֲחֵיכֶם का लिंग-सूचक वाचा-सामुदायिक प्रयोग
  choice: अपने भाइयों के साथ
  alternative: अपने साथी इस्राएलियों के साथ
  rationale: मूल पाठ पुरुषवाचक बहुवचन ‘भाइयों’ का प्रयोग करता है। मुख्य पाठ में उसी संबंध-सूचक रूप को बनाए रखा गया है और संदर्भगत अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- issue: לֵאמֹר की हिब्रू कथात्मक पुनरुक्ति
  choice: हिन्दी मुख्य पाठ में अलग से ‘यह कहते हुए’ न जोड़ना
  alternative: उसने उनसे यह कहते हुए कहा
  rationale: यह हिब्रू कथन-परिचायक सूत्र है, कोई अलग धर्मवैज्ञानिक कथन नहीं। शाब्दिक पुनरावृत्ति हिन्दी में अस्वाभाविक होगी और अर्थ में कुछ नहीं जोड़ेगी।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। सामग्री की क्रमिक सूची और आज्ञार्थक बल सुरक्षित हैं; अनावश्यक हिब्रू पुनरुक्ति को हिन्दी मुहावरे के अनुसार सरल किया गया है।
