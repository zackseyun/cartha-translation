base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/007.yaml
  text: To the one half-tribe of Manasseh Moses had given land in Bashan[a], but to the other half Joshua gave land with their brothers beyond the Jordan westward. And when Joshua sent them away to their tents, he blessed them.
translation:
  language: hi
  text: मनश्शे गोत्र के एक आधे भाग को मूसा ने बाशान में भूमि दी थी, पर उसके दूसरे आधे भाग को यहोशू ने उनके भाइयों के साथ यरदन के उस पार, पश्चिम की ओर भूमि दी। और जब यहोशू ने उन्हें उनके तंबुओं में जाने के लिए विदा किया, तब उसने उन्हें आशीर्वाद दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र को
  rationale: यह पद मनश्शे गोत्र के एक आधे भाग को दूसरे आधे भाग से अलग करता है; हिंदी में ‘आधे गोत्र’ स्वाभाविक और स्पष्ट है।
- source_word: נָתַן מֹשֶׁה
  choice: मूसा ने ... दी थी
  rationale: यह कार्य यहोशू द्वारा किए गए बाद के भूमि-वितरण से पहले हुआ था; ‘दी थी’ उस पूर्वकालिक संबंध को स्पष्ट करता है।
- source_word: בַּבָּשָׁן
  choice: बाशान में
  rationale: क्षेत्र के नाम का प्रचलित हिंदी रूप और स्थानवाचक अर्थ सुरक्षित रहता है।
- source_word: וּלְחֶצְיוֹ
  choice: उसके दूसरे आधे को
  rationale: सर्वनाम मनश्शे गोत्र की ओर लौटता है; ‘दूसरे आधे’ से दोनों भागों का विरोध स्पष्ट होता है।
- source_word: נָתַן יְהוֹשֻׁעַ
  choice: यहोशू ने ... भूमि दी थी
  rationale: मूल में कर्म प्रसंग से समझा जाता है; हिंदी में ‘भूमि’ जोड़ना भूमि-वितरण के आशय को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: עִם אֲחֵיהֶם
  choice: उनके भाइयों के साथ
  rationale: ‘भाइयों’ मूल के पुरुषवाची संबंध-संज्ञा को बनाए रखता है और यहाँ अन्य इस्राएली गोत्रों के सदस्यों को सूचित करता है।
- source_word: מֵעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: यरदन के पार पश्चिम की ओर
  rationale: शाब्दिक भौगोलिक दृष्टिकोण—यरदन के पार, समुद्र अर्थात पश्चिम की दिशा में—को अनावश्यक रूप से सामान्य किए बिना सुरक्षित रखता है।
- source_word: וְגַם כִּי
  choice: जब
  rationale: इस प्रसंग में यह अगली कालगत घटना का परिचय देता है; हिंदी में ‘जब ... तब’ संबंध को सहजता से व्यक्त करता है।
- source_word: שִׁלְּחָם
  choice: विदा किया
  rationale: पिएल रूप यहाँ उन्हें प्रस्थान के लिए भेज देने या विदा करने का अर्थ देता है।
- source_word: אֶל אָהֳלֵיהֶם
  choice: उनके तंबुओं में जाने के लिए
  rationale: ‘तंबुओं’ मूल की ठोस छवि को बनाए रखता है; ‘जाने के लिए’ हिंदी में विदा करने की दिशा को स्पष्ट करता है।
- source_word: וַיְבָרֲכֵם
  choice: उसने उन्हें आशीर्वाद दिया
  rationale: ברך का इस संदर्भ में सीधा और प्रचलित हिंदी अनुवाद।
