source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע פִּֽינְחָ֣ס הַ/כֹּהֵ֗ן וּ/נְשִׂיאֵ֨י הָ/עֵדָ֜ה וְ/רָאשֵׁ֨י אַלְפֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר אִתּ֔/וֹ אֶת הַ֨/דְּבָרִ֔ים אֲשֶׁ֧ר דִּבְּר֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד וּ/בְנֵ֣י מְנַשֶּׁ֑ה וַ/יִּיטַ֖ב בְּ/עֵינֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/030.yaml
  text: When Phinehas the priest[a], the leaders of the congregation, and the heads of the thousands of Israel who were with him heard the words that the sons of Reuben, the sons of Gad, and the sons of Manasseh spoke[b], it was good in their eyes.
translation:
  language: hi
  text: जब पीनहास याजक, मंडली के प्रधानों और इस्राएल के कुलों के मुखियाओं[a], जो उसके साथ थे, ने रूबेन के वंशजों, गाद के वंशजों और मनश्शे के वंशजों की कही हुई बातें सुनीं, तो वे बातें उन्हें अच्छी लगीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “इस्राएल के हजारों के मुखिया।” यहाँ “हजारों” से संभवतः निश्चित संख्या नहीं, बल्कि कुलों या जनजातीय उपविभागों का संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: सुन चुके
  rationale: यहाँ שׁמע का अर्थ सुनना है; आश्रित उपवाक्य में पूर्ण हुई क्रिया को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: פִּינְחָס הַכֹּהֵן
  choice: पीनहास याजक
  rationale: नाम का मानक हिन्दी लिप्यंतरण और כֹּהֵן के लिए प्रचलित बाइबलीय पदनाम रखा गया है।
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: मंडली के प्रधान
  rationale: נָשִׂיא मान्य अगुवों या प्रधानों को और עֵדָה इस्राएली समुदाय की मंडली को दर्शाता है।
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: इस्राएल के कुलों के मुखिया
  rationale: शाब्दिक रूप 'इस्राएल के हजारों के मुखिया' है, पर प्रशासनिक-सामाजिक संदर्भ में אֶלֶף कुल या जनजातीय उपविभाग को सूचित कर सकता है; अर्थ को मुख्य पाठ में और शाब्दिक रूप को पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר אִתּוֹ
  choice: जो उसके साथ थे
  rationale: मूल का संबंधवाचक उपवाक्य और पीनहास की ओर संकेत करता सर्वनाम सुरक्षित रखा गया है।
- source_word: הַדְּבָרִים אֲשֶׁר דִּבְּרוּ
  choice: कही हुई बातें
  rationale: דברים यहाँ कथनों या बातों को दर्शाता है; हिन्दी में मूल की पुनरुक्ति को यांत्रिक बनाए बिना वाणी का भाव सुरक्षित है।
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וּבְנֵי מְנַשֶּׁה
  choice: रूबेनियों, गादियों और मनश्शे के वंशजों
  rationale: בני के जनजातीय अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; मनश्शे के लिए अपेक्षाकृत दुर्लभ जातिवाचक रूप के बजाय 'वंशज' स्पष्ट है।
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: तो उन्हें वे अच्छी लगीं
  rationale: हिब्रू मुहावरे 'उनकी आँखों में अच्छा था' का स्वाभाविक हिन्दी अर्थ दिया गया है, जिसका आशय है कि उन्होंने उन बातों को उचित या संतोषजनक माना।
theological_decisions:
- issue: וַיִּיטַב בְּעֵינֵיהֶם में स्वीकृति का स्वरूप
  choice: उन्हें वे अच्छी लगीं
  alternative: उन्होंने उन्हें सही माना
  rationale: मूल केवल अनुकूल प्रतिक्रिया बताता है; 'सही माना' वस्तुनिष्ठ या धर्मवैधानिक अनुमोदन का अतिरिक्त अर्थ जोड़ सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। लंबे हिब्रू वाक्य की संरचना को यथासंभव बनाए रखते हुए हिन्दी के स्वाभाविक क्रम का प्रयोग किया गया है।
