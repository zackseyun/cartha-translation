  text: כִּי֩ עֵ֨ד ה֜וּא בֵּינֵ֣י/נוּ וּ/בֵינֵי/כֶ֗ם וּ/בֵ֣ין דֹּרוֹתֵי/נוּ֮ אַחֲרֵי/נוּ֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת יְהוָה֙ לְ/פָנָ֔י/ו בְּ/עֹלוֹתֵ֥י/נוּ וּ/בִ/זְבָחֵ֖י/נוּ וּ/בִ/שְׁלָמֵ֑י/נוּ וְ/לֹא יֹאמְר֨וּ בְנֵי/כֶ֤ם מָחָר֙ לְ/בָנֵ֔י/נוּ אֵין לָ/כֶ֥ם חֵ֖לֶק בַּ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/027.yaml
  text: Rather, it is a witness between us and you, and between our generations after us, that we may perform the service of the LORD before him with our burnt offerings, our sacrifices, and our peace offerings, so that your children may not say to our children in time to come, ‘You have no share in the LORD.’
translation:
  language: hi
  text: बल्कि वह हमारे और तुम्हारे बीच, और हमारे बाद की पीढ़ियों के बीच, इस बात की गवाह है कि हम अपनी होमबलियों, अपने बलिदानों और अपनी मेलबलियों[a] के द्वारा यहोवा के सामने उसकी सेवा करते रहें, ताकि आने वाले समय में तुम्हारे बेटे हमारे बेटों से यह न कहें, ‘यहोवा में तुम्हारा कोई हिस्सा नहीं है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सहभागिता-बलियों।”
    reason: שְׁלָמִים के लिए ‘मेलबलि’ और ‘सहभागिता-बलि’ दोनों अर्थपूर्ण अनुवाद हैं; फुटनोट स्रोत शब्द की अर्थ-व्याप्ति दिखाता है।
lexical_decisions:
- source_word: כִּי
  choice: बल्कि
  rationale: यहाँ यह पद पिछले पद में नकारे गए उद्देश्य के विपरीत वेदी का वास्तविक उद्देश्य बताता है; इसलिए संदर्भानुसार विरोधसूचक अर्थ स्वाभाविक है।
- source_word: עֵד
  choice: गवाह
  rationale: वेदी को दोनों समुदायों और उनकी भावी पीढ़ियों के बीच साक्षी के रूप में व्यक्त करने वाला सीधा और स्वाभाविक हिंदी शब्द।
- source_word: לַעֲבֹד אֶת־עֲבֹדַת יְהוָה
  choice: यहोवा के सामने उसकी सेवा करते रहें
  rationale: सजातीय हिब्रू अभिव्यक्ति का अर्थ धार्मिक सेवा करना है; हिंदी में अनावश्यक पुनरुक्ति से बचते हुए उसका आशय रखा गया है। निरंतरता/भावी अभ्यास के लिए ‘करते रहें’ चुना गया।
- source_word: עֹלוֹתֵינוּ
  choice: अपने होमबलियों
  rationale: ‘होमबलि’ उस बलि को दर्शाता है जो वेदी पर पूर्णतः जलाई जाती थी और हिंदी बाइबलीय प्रयोग में परिचित है।
- source_word: שְׁלָמֵינוּ
  choice: मेलबलियों
  rationale: שְׁלָמִים के मेल, सहभागिता और कल्याण से जुड़े बलिदानी अर्थ को संक्षिप्त परिचित शब्द में व्यक्त करता है; वैकल्पिक नाम फुटनोट में दिया गया है।
- source_word: חֵלֶק בַּיהוָה
  choice: यहोवा में ... हिस्सा
  rationale: मूल का रूपक और उसकी व्यापक वाचागत/आराधनात्मक अस्पष्टता बनाए रखी गई है; इसे केवल ‘अधिकार’ या ‘विरासत’ तक सीमित नहीं किया गया।
theological_decisions:
- issue: वेदी की भूमिका
  choice: ‘गवाह’ के रूप में रखा गया
  alternative: इसे अपने आप बलिदान चढ़ाने की वैध वेदी बताना
  rationale: पद वेदी को समुदायों के बीच साक्षी बताता है; यह नहीं कहता कि उसी पर बलि चढ़ाई जानी थी।
- issue: ‘यहोवा में हिस्सा’ का अर्थ
  choice: मूल रूपक को यथावत रखा गया
  alternative: ‘यहोवा की उपासना करने का अधिकार’
  rationale: वाक्यांश में उपासना, वाचा और समुदाय से संबंध के अनेक आयाम संभव हैं; विस्तारित अनुवाद उस तनाव को अनावश्यक रूप से सीमित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘तुम्हारे बेटे/हमारे बेटे’ मूल के בנים का निकट अनुवाद है, जबकि संदर्भ में यह भावी वंशजों का प्रतिनिधित्व करता है।
