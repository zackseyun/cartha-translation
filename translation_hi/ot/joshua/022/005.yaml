source:
  edition: WLC
  text: רַ֣ק שִׁמְר֣וּ מְאֹ֗ד לַ/עֲשׂ֨וֹת אֶת הַ/מִּצְוָ֣ה וְ/אֶת הַ/תּוֹרָה֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֮ מֹשֶׁ֣ה עֶֽבֶד יְהוָה֒ לְ֠/אַהֲבָה אֶת יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם וְ/לָ/לֶ֧כֶת בְּ/כָל דְּרָכָ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו וּ/לְ/דָבְקָה ב֑/וֹ וּ/לְ/עָבְד֕/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/005.yaml
  text: 'Only be very careful to do the commandment and the law that Moses the servant of Yahweh commanded you: to love Yahweh your God[a], to walk in all his ways, to keep his commandments, to cling to him, and to serve him with all your heart and with all your soul.'
translation:
  language: hi
  text: 'केवल बहुत सावधान रहना कि तुम उस आज्ञा और व्यवस्था[a] का पालन करो, जो यहोवा के सेवक मूसा ने तुम्हें दी थी: अपने परमेश्वर यहोवा से प्रेम करो, उसके सब मार्गों पर चलो, उसकी आज्ञाओं को मानो, उससे जुड़े रहो, और अपने सारे मन और अपने सारे प्राण से उसकी सेवा करो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘शिक्षा’; इब्रानी: तोराह।'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: परन्तु
  rationale: पिछले विदाई-वचन के बाद यह पद एक महत्त्वपूर्ण शर्त पर बल देता है; हिन्दी में ‘परन्तु’ इस संक्रमण और आग्रह, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שִׁמְרוּ מְאֹד לַעֲשׂוֹת
  choice: पालन करने में पूरी सावधानी बरतना
  rationale: यह पद पिछले आदेश की निरंतरता में है; यह हिन्दी वाक्यांश अत्यधिक सावधानी और वास्तविक आचरण, दोनों को व्यक्त करता है।
- source_word: הַמִּצְוָה וְאֶת הַתּוֹרָה
  choice: इस आज्ञा और व्यवस्था
  rationale: एकवचन ‘आज्ञा’ को बनाए रखा गया है और תּוֹרָה को उसके मूसा-संबंधी वाचा-परिप्रेक्ष्य में ‘व्यवस्था’ कहा गया है; ‘शिक्षा’ का वैध अर्थ पादटिप्पणी में दिया गया है।
- source_word: עֶבֶד יְהוָה
  choice: यहोवा के सेवक
  rationale: ‘सेवक’ यहाँ मूसा की प्रतिष्ठित वाचागत उपाधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ द्वारा इब्रानी व्यक्तिगत दिव्य नाम को किसी उपाधि से प्रतिस्थापित किए बिना रखा गया है।
- source_word: וְלָלֶכֶת בְּכָל דְּרָכָיו
  choice: उसके सभी मार्गों पर चलना
  rationale: इब्रानी नैतिक और वाचागत रूपक ‘चलना’ को सुरक्षित रखते हुए आधुनिक हिन्दी में स्पष्ट अभिव्यक्ति दी गई है।
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: उसकी आज्ञाओं को मानना
  rationale: आज्ञाओं के संदर्भ में שׁמר का आशय उन्हें व्यवहार में मानना है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וּלְדָבְקָה בּוֹ
  choice: उससे लिपटे रहना
  rationale: यह चयन निकट, दृढ़ और निरंतर संबंध की मूल छवि को बनाए रखता है।
- source_word: וּלְעָבְדוֹ
  choice: उसकी सेवा करना
  rationale: ‘सेवा करना’ उपासना सहित समर्पित आज्ञाकारिता के व्यापक अर्थ को खुला रखता है।
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: अपने सारे मन और अपने सारे प्राण से
  rationale: לבב और נפש के अलग-अलग पदों को बनाए रखते हुए समग्र समर्पण का बल सुरक्षित रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को नाम के रूप में बनाए रखता है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: वाचागत नैतिक रूपकों का संरक्षण
  choice: उसके सभी मार्गों पर चलना ... उससे लिपटे रहना
  alternative: उसकी इच्छा के अनुसार जीवन बिताना ... उसके प्रति दृढ़ बने रहना
  rationale: मूल के ठोस रूपक धार्मिक और संबंधपरक अर्थ रखते हैं; उन्हें व्याख्यात्मक भावार्थ से बदलने के बजाय स्पष्ट हिन्दी में सुरक्षित रखा गया है।
- issue: תּוֹרָה का अर्थ
  choice: व्यवस्था
  alternative: शिक्षा
  rationale: मूसा और आज्ञा के वाचागत संदर्भ में ‘व्यवस्था’ उपयुक्त है, पर मूल शब्द का ‘शिक्षा/निर्देश’ अर्थ भी वास्तविक है और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। आज्ञार्थक प्रवाह को पिछले पद से जुड़ी निरंतरता के रूप में रखा गया है। ‘मन’ और ‘प्राण’ जैसे परिचित बाइबलीय पदों तथा ‘मार्गों पर चलना’ और ‘लिपटे रहना’ जैसे मूल रूपकों को सुरक्षित रखा गया है।
