  text: וַ/נֹּ֕אמֶר נַעֲשֶׂה נָּ֣א לָ֔/נוּ לִ/בְנ֖וֹת אֶת הַ/מִּזְבֵּ֑חַ לֹ֥א לְ/עוֹלָ֖ה וְ/לֹ֥א לְ/זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/026.yaml
  text: So we said[b][a], ‘Let us now build for ourselves the altar—not for burnt offering and not for sacrifice.’
translation:
  language: hi
  text: इसलिए हमने कहा, ‘आओ, हम अपने लिए वह वेदी बनाएँ—न होमबलि चढ़ाने के लिए और न बलिदान चढ़ाने के लिए।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: इसलिए हमने कहा
  rationale: वाव-क्रमिक रूप यहाँ पिछले कथन से निकलने वाले समूह के निष्कर्ष या निश्चय को आगे बढ़ाता है; ‘इसलिए’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נַעֲשֶׂה נָּא לָנוּ לִבְנוֹת
  choice: आओ, हम अपने लिए ... बनाएँ
  rationale: सहभावार्थक क्रिया और उसके बाद आए ‘बनाने’ के क्रियार्थक रूप को हिन्दी में प्रस्ताव/निश्चय के स्वाभाविक मुहावरे के रूप में प्रस्तुत किया गया है। נָּא की आग्रहसूचक छाया ‘आओ’ में समाहित है।
- source_word: אֶת הַמִּזְבֵּחַ
  choice: वह वेदी
  rationale: निश्चित उपपद किसी विशिष्ट, चर्चा में उपस्थित वेदी की ओर संकेत करता है; हिन्दी में ‘वह वेदी’ इसकी निश्चितता स्पष्ट करता है।
- source_word: לֹא לְעוֹלָה
  choice: न होमबलि चढ़ाने के लिए
  rationale: עֹלָה के लिए प्रचलित बाइबलीय हिन्दी शब्द ‘होमबलि’ रखा गया है और उद्देश्यसूचक לְ को ‘चढ़ाने के लिए’ से स्पष्ट किया गया है।
- source_word: וְלֹא לְזָבַח
  choice: और न बलिदान चढ़ाने के लिए
  rationale: זֶבַח यहाँ होमबलि से अलग व्यापक बलिदान को सूचित करता है; ‘बलिदान’ बिना अनावश्यक विशिष्टीकरण के इस भेद को बनाए रखता है।
