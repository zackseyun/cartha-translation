  edition: WLC
  text: וַ/יֹּ֣אמֶר פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֡ן אֶל בְּנֵי רְאוּבֵ֨ן וְ/אֶל בְּנֵי גָ֜ד וְ/אֶל בְּנֵ֣י מְנַשֶּׁ֗ה הַ/יּ֤וֹם יָדַ֨עְנוּ֙ כִּֽי בְ/תוֹכֵ֣/נוּ יְהוָ֔ה אֲשֶׁ֛ר לֹֽא מְעַלְתֶּ֥ם בַּֽ/יהוָ֖ה הַ/מַּ֣עַל הַ/זֶּ֑ה אָ֗ז הִצַּלְתֶּ֛ם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/יַּ֥ד יְהוָֽה־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/031.yaml
  text: And Phinehas son of Eleazar the priest said to the sons of Reuben[a], and to the sons of Gad, and to the sons of Manasseh, “Today we know that Yahweh is among us, because you have not acted unfaithfully against Yahweh in this matter[c][b]. Then you have delivered the sons of Israel from the hand of Yahweh.”
translation:
  language: hi
  text: तब याजक एलीआज़र के पुत्र पीनहास ने रूबेन के वंशजों, गाद के वंशजों और मनश्शे के वंशजों से कहा, “आज हम जान गए हैं कि याहवे हमारे बीच में हैं[a], क्योंकि तुमने याहवे के विरुद्ध यह विश्वासघात नहीं किया[b]। इस तरह तुमने इस्राएलियों को याहवे के हाथ से बचा लिया है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारे मध्य हैं।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “तुमने याहवे के विरुद्ध यह निष्ठाभंग नहीं किया”; क्रिया और संज्ञा दोनों एक ही मूल से हैं और वाचा के प्रति द्रोह या निष्ठा-भंग को दर्शाती हैं।
    reason: lexical_alternative
  - marker: c
    text: “याहवे के हाथ से” एक इब्रानी मुहावरा है, जिसका आशय याहवे की शक्ति या उनके न्याय से बच जाना है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप इब्रानी कथा को आगे बढ़ाता है। आधुनिक हिन्दी में “तब” प्रसंग के प्रवाह को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: याजक एलीआज़र के पुत्र पीनहास
  rationale: इब्रानी पदबंध में “याजक” का संबंध एलीआज़र से है; हिन्दी शब्दक्रम इस संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: בְּנֵי רְאוּבֵן ... בְּנֵי גָד ... בְּנֵי מְנַשֶּׁה
  choice: रूबेन के वंशजों ... गाद के वंशजों ... मनश्शे के वंशजों
  rationale: यहाँ “पुत्र” जनजातीय समुदायों को दर्शाता है। “वंशज” मूल रूपक को बनाए रखते हुए आधुनिक हिन्दी में सामूहिक अर्थ स्पष्ट करता है।
- source_word: הַיּוֹם יָדַעְנוּ
  choice: आज हम जान गए हैं
  rationale: पूर्ण क्रिया वर्तमान में प्राप्त हुई निश्चित समझ को व्यक्त करती है; “जान गए हैं” उस नई पहचान को “हम जानते हैं” से अधिक स्पष्टता से बताता है।
- source_word: בְּתוֹכֵנוּ
  choice: हमारे बीच में
  rationale: यह समुदाय के मध्य याहवे की उपस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे व्यक्तियों के भीतर होने के अर्थ में सीमित किए।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल इब्रानी के चार-अक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय उसके प्रचलित विद्वतापूर्ण उच्चारण का हिन्दी लिप्यंतरण किया गया है।
- source_word: לֹא מְעַלְתֶּם בַּיהוָה הַמַּעַל הַזֶּה
  choice: तुमने याहवे के विरुद्ध यह विश्वासघात नहीं किया
  rationale: מעל का क्रिया-संज्ञा युग्म वाचा-संबंधी निष्ठाभंग दर्शाता है। “विश्वासघात” उसका नैतिक और संबंधपरक भार संक्षेप में व्यक्त करता है; मूल की पुनरुक्ति पादटिप्पणी में बताई गई है।
- source_word: אָז
  choice: इस तरह
  rationale: यहाँ אָז केवल कालक्रम नहीं, पिछले कथन से निकलने वाला परिणाम भी दर्शाता है। “इस तरह” उस परिणामी संबंध को स्वाभाविक हिन्दी में रखता है।
- source_word: הִצַּלְתֶּם
  choice: बचा लिया है
  rationale: हिफ़ील रूप किसी को संकट से छुड़ाने या बचाने का अर्थ देता है। “बचा लिया है” आधुनिक हिन्दी में स्पष्ट है और प्रसंग में पूर्ण हुए परिणाम को व्यक्त करता है।
- source_word: מִיַּד יְהוָה
  choice: याहवे के हाथ से
  rationale: मूल का ठोस इब्रानी मुहावरा बनाए रखा गया है; यहाँ “हाथ” अधिकार, शक्ति और संभावित न्याय का संकेत देता है।
theological_decisions:
- issue: समुदाय के बीच याहवे की उपस्थिति
  choice: याहवे हमारे बीच में हैं
  alternative: याहवे हमारे मध्य हैं
  rationale: कथन इस घटना के आधार पर इस्राएल के बीच वाचागत ईश्वरीय उपस्थिति की पहचान करता है। अनुवाद बाद की धर्मवैज्ञानिक श्रेणियाँ जोड़े बिना मूल दावे को बनाए रखता है।
- issue: מעל का वाचागत अर्थ
  choice: याहवे के विरुद्ध ... विश्वासघात
  alternative: याहवे के प्रति ... अविश्वासयोग्यता / याहवे के विरुद्ध अपराध
  rationale: यह शब्द केवल सामान्य गलती नहीं, पवित्र संबंध और निष्ठा के उल्लंघन का संकेत देता है। “विश्वासघात” इस गंभीरता को सहज हिन्दी में व्यक्त करता है।
- issue: याहवे के हाथ से बचाना
  choice: मूल मुहावरा बनाए रखा गया
  alternative: याहवे के न्याय से बचा लिया
  rationale: प्रसंग में ईश्वरीय दंड का खतरा निहित है, पर मूल पाठ सीधे “न्याय” नहीं कहता। इसलिए अनुवाद अस्पष्टता और गंभीरता दोनों को बनाए रखता है तथा पादटिप्पणी मुहावरे को समझाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। जनजातीय पदबंधों के लिए “वंशज” और वाचागत अपराध के लिए “विश्वासघात” चुना गया है। मूल के ईश्वरीय नाम तथा “हाथ” वाले मुहावरे को संरक्षित रखते हुए आवश्यक स्पष्टीकरण पादटिप्पणियों में दिया गया है।
