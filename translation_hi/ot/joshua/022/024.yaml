  edition: WLC
  text: וְ/אִם לֹ֤א מִ/דְּאָגָה֙ מִ/דָּבָ֔ר עָשִׂ֥ינוּ אֶת זֹ֖את לֵ/אמֹ֑ר מָחָ֗ר יֹאמְר֨וּ בְנֵי/כֶ֤ם לְ/בָנֵ֨י/נוּ֙ לֵ/אמֹ֔ר מַה לָּ/כֶ֕ם וְ/לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/024.yaml
  text: No, rather, we did this out of anxious concern, saying, ‘In time to come your children may say to our children, “What have you to do with the LORD, the God of Israel?”’
translation:
  language: hi
  text: नहीं, बल्कि हमने यह किसी बात की चिंता के कारण किया, यह कहते हुए, ‘आने वाले समय में तुम्हारे बेटे हमारे बेटों से कहेंगे, “यहोवा, इस्राएल के परमेश्वर, से तुम्हारा क्या संबंध है?”’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם־לֹא
  choice: नहीं, बल्कि
  rationale: यह शपथ-सदृश प्रतिवाद है, जो पिछले आरोप का दृढ़ निषेध करके वास्तविक कारण प्रस्तुत करता है।
- source_word: מִדְּאָגָה מִדָּבָר
  choice: गहरी चिंता के कारण
  rationale: דאגה चिंता या आशंका व्यक्त करता है; מִדָּבָר के साथ यह किसी संभावित परिस्थिति को लेकर तीव्र चिंता का भाव देता है।
- source_word: מָחָר
  choice: आने वाले समय में
  rationale: यहाँ शब्द का अर्थ केवल अगले दिन नहीं, बल्कि भविष्य का समय है, जैसा कि अगली पीढ़ी के संदर्भ से स्पष्ट है।
- source_word: מַה־לָּכֶם וְלַיהוָה
  choice: यहोवा से तुम्हारा क्या संबंध है?
  rationale: हिब्रू मुहावरा दो पक्षों के बीच संबंध, सरोकार या भागीदारी को प्रश्नांकित करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को सामान्य उपाधि में बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा दर्शाया गया है।
theological_decisions:
- issue: वेदी बनाने की मंशा
  choice: कार्य को भविष्य में संबंध-विच्छेद की आशंका से उपजी चिंता के रूप में रखा गया है
  alternative: इसे पहले से घटित धार्मिक बहिष्कार की प्रतिक्रिया बताना
  rationale: पद संभावित भावी कथन प्रस्तुत करता है; वह बहिष्कार को घटित तथ्य नहीं बताता।
- issue: यहोवा के साथ संबंध का प्रश्न
  choice: ‘क्या संबंध है?’
  alternative: ‘तुम्हारा यहोवा में कोई भाग नहीं’
  rationale: मूल पाठ प्रश्नात्मक और मुहावरेदार है; उसे स्पष्ट निषेध में बदलना तनाव और वाक्य-रूप दोनों को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बेटे’ मूल के בנים का औपचारिक रूप से निकट अनुवाद है और पीढ़ीगत संदर्भ बनाए रखता है। प्रत्यक्ष कथन के भीतर कथन को स्पष्ट हिंदी उद्धरण-चिह्नों में रखा गया है।
