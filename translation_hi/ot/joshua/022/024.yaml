- from: नहीं, बल्कि हमने यह गहरी चिंता के कारण किया। हमने सोचा, ‘आने वाले समय में तुम्हारे बेटे हमारे बेटों से कह सकते हैं, “इस्राएल के परमेश्वर यहोवा से तुम्हारा क्या संबंध है?”’
  to: नहीं, बल्कि हमने यह किसी बात की चिंता के कारण किया, यह कहते हुए, ‘आने वाले समय में तुम्हारे बेटे हमारे बेटों से कहेंगे, “यहोवा, इस्राएल के परमेश्वर, से तुम्हारा क्या संबंध है?”’
