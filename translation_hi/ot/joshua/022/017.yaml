  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/מְעַט לָ֨/נוּ֙ אֶת עֲוֺ֣ן פְּע֔וֹר אֲשֶׁ֤ר לֹֽא הִטַּהַ֨רְנוּ֙ מִמֶּ֔/נּוּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יְהִ֥י הַ/נֶּ֖גֶף בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/017.yaml
  text: Was the iniquity of Peor too little for us[a], from which we have not cleansed ourselves to this day[b], and the plague came upon the congregation of Yahweh?
translation:
  language: hi
  text: क्या पओर[b] का अधर्म हमारे लिए कम था[a], जिससे हम आज तक शुद्ध नहीं हुए हैं, और यहोवा की मंडली पर महामारी आई थी?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पओर का दोष हमारे लिए कम था?” इब्रानी शब्द עָוֹן का अर्थ “अधर्म,” “दोष,” या प्रसंगानुसार दोष का परिणाम भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ केवल “पओर” है; संबंधित वृत्तांतों में अधिक पूरा नाम “बाल-पओर” मिलता है।
    reason: cross_reference
lexical_decisions:
- source_word: הַמְעַט לָנוּ
  choice: क्या ... हमारे लिए कम था
  rationale: यह आलंकारिक प्रश्न इब्रानी की फटकार और ‘क्या इतना पर्याप्त रूप से गंभीर नहीं था?’ का भाव बनाए रखता है।
- source_word: עֲוֺן
  choice: अधर्म
  rationale: यहाँ शब्द पापपूर्ण अपराध को दर्शाता है, पर इसमें दोष या उसके परिणाम का भाव भी हो सकता है; इस अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: פְּעוֹר
  choice: पओर
  rationale: मूल पाठ में केवल ‘पओर’ है, ‘बाल-पओर’ नहीं; इसलिए संक्षिप्त मूल रूप ही रखा गया है।
- source_word: אֲשֶׁר לֹא הִטַּהַרְנוּ מִמֶּנּוּ
  choice: जिससे हम ... अपने आप को शुद्ध नहीं कर पाए हैं
  rationale: हित्पअेल रूप का आत्मवाचक अर्थ और समुदाय की अब तक बनी अशुद्धता दोनों व्यक्त होते हैं।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज के दिन तक
  rationale: यह प्रचलित इब्रानी मुहावरे का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: וַיְהִי הַנֶּגֶף
  choice: और ... महामारी आई थी
  rationale: सरल संयोजक ‘और’ मूल के निकट है; ‘फिर भी’ जैसा व्याख्यात्मक विरोध नहीं जोड़ा गया। भूतपूर्व घटना को हिन्दी में स्पष्ट करने के लिए ‘आई थी’ रखा गया है।
- source_word: בַּעֲדַת יְהוָה
  choice: यहोवा की मंडली पर
  rationale: עֵדָה सामुदायिक सभा को दर्शाता है और בְּ यहाँ विपत्ति के समुदाय पर आने का अर्थ देता है; य्ह्व्ह को व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: עֲוֺן का नैतिक अपराध, दोष और परिणाम के बीच अर्थ-विस्तार
  choice: मुख्य पाठ में ‘अधर्म’
  alternative: ‘दोष’ अथवा ‘अधर्म का दंड’
  rationale: संदर्भ पओर के अपराध और उसके अब तक बने कलंक दोनों को सामने रखता है; ‘अधर्म’ नैतिक केंद्र को बनाए रखता है, जबकि पादटिप्पणी वास्तविक अर्थ-विस्तार बताती है।
- issue: ईश्वरीय नाम יְהוָה
  choice: यहोवा
  alternative: याहवे
  rationale: मूल के व्यक्तिगत वाचा-नाम को उपाधि में बदलने के बजाय हिन्दी में परिचित लिप्यंतरण ‘यहोवा’ रखा गया है।
- issue: וַיְהִי से पहले अंतर्निहित विरोध
  choice: ‘और’
  alternative: ‘फिर भी’
  rationale: इब्रानी में स्पष्ट विरोधसूचक अव्यय नहीं है; इसलिए पाठक पर व्याख्यात्मक विरोध आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। आलंकारिक प्रश्न और सामुदायिक आत्मवाचक स्वीकारोक्ति को सुरक्षित रखा गया है; स्रोत में न होने वाला ‘फिर भी’ नहीं जोड़ा गया।
