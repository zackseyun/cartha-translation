base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/012.yaml
  text: When the sons of Israel heard[b][a], the whole congregation of the sons of Israel assembled at Shiloh to go up against them for war.
translation:
  language: hi
  text: जब इस्राएल के पुत्रों[a] ने यह सुना, तब इस्राएल के पुत्रों की सारी मंडली शीलो में उनके विरुद्ध युद्ध के लिए चढ़ाई करने को इकट्ठी हुई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “उनके विरुद्ध युद्ध के लिए चढ़ने”; यह सैन्य कार्रवाई का एक प्रचलित मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: ने यह सुना
  rationale: क़ाल वय्यिक्तोल का सामान्य कथात्मक अर्थ ‘सुना’ है। हिन्दी में संदर्भित समाचार को सहज बनाने के लिए ‘यह’ जोड़ा गया है, बिना उसका आशय निर्धारित किए।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी पदबंध का शाब्दिक रूप सुरक्षित रखा गया है और दोनों स्थानों पर एकरूपता से अनूदित किया गया है; अधिक सहज विकल्प ‘इस्राएली’ पादटिप्पणी में दिया गया है।
- source_word: וַיִּקָּהֲלוּ
  choice: इकट्ठी हुई
  rationale: קהל सार्वजनिक रूप से एकत्र होने को दर्शाता है। ‘मंडली ... इकट्ठी हुई’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों की सारी मंडली
  rationale: עֵדָה के सामुदायिक और संगठित भाव के लिए ‘मंडली’ तथा כָּל के लिए ‘सारी’ चुना गया है।
- source_word: שִׁלֹה
  choice: शीलो
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לַעֲלוֹת עֲלֵיהֶם
  choice: उन पर चढ़ाई करे
  rationale: עלה + על के सैन्य संदर्भ को हिन्दी के स्वाभाविक मुहावरे ‘पर चढ़ाई करना’ से व्यक्त किया गया है; इससे गति और विरोध, दोनों बने रहते हैं।
- source_word: לַצָּבָא
  choice: युद्ध करने के लिए
  rationale: यहाँ צָבָא सेना के निकाय से अधिक सैन्य संघर्ष को सूचित करता है; ‘युद्ध करने के लिए’ संदर्भ में स्पष्ट और स्वाभाविक है।
