translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। इब्रानी की पुनरावृत्ति और सैन्य मुहावरे को यथासंभव सुरक्षित रखते हुए हिन्दी वाक्य-विन्यास को स्वाभाविक बनाया गया है।
