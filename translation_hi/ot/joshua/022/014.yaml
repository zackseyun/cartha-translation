id: JOS.22.14
reference: Joshua 22:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/עֲשָׂרָ֤ה נְשִׂאִים֙ עִמּ֔/וֹ נָשִׂ֨יא אֶחָ֜ד נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אָ֔ב לְ/כֹ֖ל מַטּ֣וֹת יִשְׂרָאֵ֑ל וְ/אִ֨ישׁ רֹ֧אשׁ בֵּית אֲבוֹתָ֛/ם הֵ֖מָּה לְ/אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/014.yaml
  text: and with him ten leaders[a], one leader for each ancestral house from all the tribes of Israel; and each of them was the head of his ancestral house among the thousands of Israel.
translation:
  language: hi
  text: और उसके साथ दस प्रधान थे—इस्राएल के सभी गोत्रों में से प्रत्येक पितृकुल का एक-एक प्रधान; और उनमें से प्रत्येक इस्राएल के सहस्रों[a] में अपने पितृकुल का मुखिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “इस्राएल के सहस्रों”; यहाँ “सहस्र” इस्राएल के कुलगत या प्रशासनिक दलों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשִׂאִים / נָשִׂיא
  choice: प्रधान
  rationale: जनजातीय-प्रशासनिक संदर्भ में यह पद प्रतिष्ठित अगुए या मुखिया को दर्शाता है; ‘प्रधान’ आधुनिक, संक्षिप्त और गरिमापूर्ण है।
- source_word: עִמּוֹ
  choice: उसके साथ
  rationale: पूर्ववर्ती पद के पीनहास की ओर संकेत करने वाले पूर्वसर्ग और सर्वनाम का सीधा अनुवाद।
- source_word: נָשִׂיא אֶחָד נָשִׂיא אֶחָד
  choice: एक-एक प्रधान
  rationale: इब्रानी पुनरुक्ति वितरण का भाव देती है, जिसे हिंदी में ‘एक-एक’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְבֵית אָב
  choice: प्रत्येक पितृकुल का
  rationale: בֵּית אָב एक वंशगत सामाजिक-प्रशासनिक इकाई है; ‘पितृकुल’ उसके पितृवंशीय स्वरूप को संक्षेप और स्पष्टता से रखता है।
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: इस्राएल के सभी गोत्रों में से
  rationale: यह दस प्रधानों के गोत्रीय प्रतिनिधित्व या स्रोत को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְאִישׁ
  choice: उनमें से प्रत्येक
  rationale: यहाँ אִישׁ का प्रयोग वितरणात्मक है; यह अनुवाद उसी भाव को स्पष्ट रखता है।
- source_word: רֹאשׁ בֵּית אֲבוֹתָם
  choice: अपने पितृकुल का मुखिया
  rationale: ‘मुखिया’ नेतृत्वकारी पद को और ‘पितृकुल’ वंशगत इकाई को स्वाभाविक हिंदी में व्यक्त करते हैं।
- source_word: לְאַלְפֵי יִשְׂרָאֵל
  choice: इस्राएल के सहस्रों में
  rationale: ‘सहस्रों’ मूल אֲלָפִים की संख्यात्मक और सामाजिक-प्रशासनिक अस्पष्टता को मुख्य पाठ में सुरक्षित रखता है; संभावित कुलगत अर्थ पादटिप्पणी में बताया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज शैली अपनाई गई है। ‘प्रधान’, ‘पितृकुल’ और ‘मुखिया’ जनजातीय संगठन को स्पष्ट करते हैं, जबकि ‘सहस्रों’ मूल पाठ की वास्तविक अर्थगत अस्पष्टता बनाए रखता है।
