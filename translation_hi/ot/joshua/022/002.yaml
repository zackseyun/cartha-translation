  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם אַתֶּ֣ם שְׁמַרְתֶּ֔ם אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶ֔ם מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/תִּשְׁמְע֣וּ בְ/קוֹלִ֔/י לְ/כֹ֥ל אֲשֶׁר צִוִּ֖יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/002.yaml
  text: And he said to them[a], “You have kept all that Moses the servant of Yahweh commanded you, and you have listened to my voice in all that I commanded you.”
translation:
  language: hi
  text: उसने उनसे कहा, “तुमने उन सब बातों का पालन किया है जिनकी आज्ञा याहवे के सेवक मूसा ने तुम्हें दी है, और जिस-जिस बात की मैंने तुम्हें आज्ञा दी है, उन सब में तुमने मेरी बात मानी है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने मेरी आवाज़ सुनी।” इब्रानी मुहावरा ‘किसी की आवाज़ सुनना’ प्रायः आज्ञा मानने के अर्थ में आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: उसने उनसे कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; हिंदी में ‘उसने ... कहा’ स्वाभाविक कथात्मक रूप है और सर्वनाम का संदर्भ पिछले पद से स्पष्ट रहता है।
- source_word: שְׁמַרְתֶּם אֵת כָּל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: तुमने वह सब माना है जिसकी आज्ञा ... ने तुम्हें दी थी
  rationale: आज्ञाओं के संदर्भ में שׁמר का अर्थ पालन करना या मानना है। ‘माना है’ आज्ञाकारिता का भाव सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: यहोवा के सेवक मूसा
  rationale: עֶבֶד यहाँ मूसा की सम्मानसूचक, नियुक्त सेवा को दर्शाता है; इसलिए ‘सेवक’ उपयुक्त है, न कि दासत्व पर बल देने वाला शब्द।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַתִּשְׁמְעוּ בְקוֹלִי
  choice: तुमने मेरी बात मानी है
  rationale: שׁמע בְּקוֹל का मुहावरा केवल सुनने नहीं, प्रत्युत्तर में आज्ञा मानने का अर्थ देता है। हिंदी का ‘मेरी बात मानी’ श्रवण और आज्ञापालन दोनों का स्वाभाविक समतुल्य है।
- source_word: לְכֹל אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: जो कुछ मैंने तुम्हें आज्ञा दी, उसमें
  rationale: यह रूप आज्ञाओं के संपूर्ण दायरे को बनाए रखता है और हिंदी वाक्य में पिछले खंड के साथ सहज जुड़ता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिंदी पाठकों में स्थापित देवनागरी रूप ‘यहोवा’ नाम को उपाधि ‘प्रभु’ में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: मूसा के लिए עֶבֶד
  choice: सेवक
  alternative: दास
  rationale: यहाँ यह मूसा का सम्मानसूचक पद है और यहोवा की ओर से उसकी नियुक्त सेवा को सामने रखता है; सामाजिक दासत्व इस संदर्भ का प्रमुख भाव नहीं है।
- issue: שׁמע בְּקוֹל में सुनना और आज्ञापालन
  choice: मेरी बात मानी
  alternative: मेरी आवाज़ सुनी
  rationale: इब्रानी मुहावरे में ध्यानपूर्वक सुनकर पालन करने का भाव है। ‘बात मानी’ उस व्यावहारिक आज्ञाकारिता को स्पष्ट करता है, जबकि केवल ‘आवाज़ सुनी’ हिंदी में अनपेक्षित रूप से मात्र श्रवण का अर्थ दे सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘आज्ञा दी’ और ‘सेवक’ बाइबलीय संदर्भ की औपचारिकता बनाए रखते हैं; ‘बात मानी’ इब्रानी मुहावरे को स्वाभाविक हिंदी में व्यक्त करता है।
