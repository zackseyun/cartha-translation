    issue: The first two divine titles are conflated.
    rationale: “पराक्रमी परमेश्वर” represents the sequence אֵל אֱלֹהִים as one combined title. The source deliberately has two titles before the divine name, repeated in full; “पराक्रमी, परमेश्वर, याहवे” better preserves this structure.
