  terminology: “याहवे” consistently renders the Tetragrammaton. “विश्वासघात” is a suitable modern-Hindi rendering of מַעַל in this covenantal context. Rendering אֵל as “पराक्रमी” and retaining “परमेश्वर” for אֱלֹהִים preserves the two terms rather than collapsing them.
