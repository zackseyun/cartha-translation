id: JOS.22.22
reference: Joshua 22:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵל֩ אֱלֹהִ֨ים יְהוָ֜ה אֵ֣ל אֱלֹהִ֤ים יְהוָה֙ ה֣וּא יֹדֵ֔עַ וְ/יִשְׂרָאֵ֖ל ה֣וּא יֵדָ֑ע אִם בְּ/מֶ֤רֶד וְ/אִם בְּ/מַ֨עַל֙ בַּֽ/יהוָ֔ה אַל תּוֹשִׁיעֵ֖/נוּ הַ/יּ֥וֹם הַ/זֶּֽה׀׀׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/022.yaml
  text: 'The Mighty One[a], God, Yahweh! The Mighty One, God, Yahweh! He knows, and Israel itself will know: if it was in rebellion, or if in unfaithfulness against Yahweh[b], do not save us this day.'
translation:
  language: hi
  text: '“पराक्रमी[a], परमेश्वर, याहवे! पराक्रमी, परमेश्वर, याहवे! वह जानता है, और इस्राएल भी जान जाएगा: यदि यह विद्रोह में या याहवे के प्रति विश्वासघात में किया गया हो, तो आज हमें न बचाना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में यह ईश्वरीय संबोधन दो बार दोहराया गया है: ‘एल, परमेश्वर, याहवे।’ यह एक अत्यंत गंभीर, शपथ-सदृश पुकार है।'
    reason: cultural_note
lexical_decisions:
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: पराक्रमी परमेश्वर, याहवे
  rationale: אֵל और אֱלֹהִים को अलग-अलग अस्वाभाविक नामों की सूची बनाने के बजाय हिन्दी में एक संयुक्त, प्रभावशाली संबोधन के रूप में रखा गया है; पूरी आवृत्ति दो बार सुरक्षित है और יְהוָה को ‘याहवे’ कहा गया है।
- source_word: הוּא יֹדֵעַ
  choice: वह जानता है
  rationale: वर्तमान ज्ञान को व्यक्त करने वाला सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וְיִשְׂרָאֵל הוּא יֵדָע
  choice: और इस्राएल भी जान जाएगा
  rationale: הוּא के बल को ‘भी’ से स्वाभाविक ढंग से व्यक्त किया गया है और अपूर्ण क्रिया का भावी अर्थ बनाए रखा गया है।
- source_word: אִם בְּמֶרֶד
  choice: यदि हमने यह विद्रोह में ... किया है
  rationale: इब्रानी की संक्षिप्त शर्त को हिन्दी में स्पष्ट करने के लिए प्रसंगानुसार कर्ता और क्रिया जोड़े गए हैं; מֶרֶד का अर्थ ‘विद्रोह’ सुरक्षित है।
- source_word: וְאִם בְּמַעַל בַּיהוָה
  choice: या याहवे के प्रति विश्वासघात में
  rationale: מַעַל भरोसा और वाचा तोड़ने वाली निष्ठाहीनता दर्शाता है; ‘विश्वासघात’ इस गंभीर संबंधपरक अर्थ को सहज हिन्दी में रखता है।
- source_word: אַל תּוֹשִׁיעֵנוּ הַיּוֹם הַזֶּה
  choice: तो आज हमें न बचाना
  rationale: नकारात्मक कामनार्थक आग्रह की कठोरता और ‘आज’ का समय-संदर्भ दोनों सुरक्षित हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में आए व्यक्तिगत वाचा-नाम को नाम के रूप में स्पष्ट रखा गया है।
- issue: ईश्वरीय संबोधन की पुनरावृत्ति
  choice: पूरे संबोधन को दो बार रखा गया
  alternative: इसे एक बार कहकर संक्षिप्त करना
  rationale: यह पुनरावृत्ति गंभीर, शपथ-सदृश बल देती है; इसे हटाने से मूल का आलंकारिक और धर्मवैचारिक भार घटता।
- issue: अंतिम निषेध का अभिप्राय
  choice: ‘तो आज हमें न बचाना’—परमेश्वर को संबोधित आत्मदंडात्मक शर्त
  alternative: इस्राएल से कहा गया साधारण आदेश
  rationale: क्रिया का द्वितीय पुरुष रूप उसी परमेश्वर को संबोधित है जिसका तुरंत पहले आह्वान किया गया है; कथन की कठोरता को नरम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सार्वजनिक घोषणात्मक शैली की है। ‘यदि हमने यह ... किया है’ मूल की संक्षिप्त शर्त को हिन्दी में बोधगम्य बनाता है, जबकि दोहरा संबोधन और आत्मदंडात्मक निषेध अक्षुण्ण रहते हैं।
