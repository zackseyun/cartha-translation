source:
  edition: WLC
  text: וַ/יִּיטַ֣ב הַ/דָּבָ֗ר בְּ/עֵינֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְבָרֲכ֥וּ אֱלֹהִ֖ים בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֣א אָמְר֗וּ לַ/עֲל֤וֹת עֲלֵי/הֶם֙ לַ/צָּבָ֔א לְ/שַׁחֵת֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֛ר בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/033.yaml
  text: And the matter was good in the eyes of the sons of Israel[a], and the sons of Israel blessed God[c][b]. And they did not speak of going up against them in war to destroy the land where the sons of Reuben and the sons of Gad were living.
translation:
  language: hi
  text: यह बात इस्राएल के पुत्रों को अच्छी लगी[a], और इस्राएल के पुत्रों ने परमेश्वर को धन्य कहा[b]। फिर उन्होंने उनके विरुद्ध युद्ध के लिए चढ़ाई करने और उस भूमि को नष्ट करने की बात नहीं की[c], जिसमें रूबेन के पुत्र और गाद के पुत्र रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों को।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों को।”
    reason: lexical_alternative
  - marker: b
    text: या “परमेश्वर की स्तुति की।” इब्रानी क्रिया का शाब्दिक अर्थ “धन्य कहना” है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “उन्होंने उनके विरुद्ध युद्ध के लिए चढ़ाई करने को नहीं कहा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי
  choice: यह बात ... को अच्छी लगी
  rationale: यह स्वाभाविक हिन्दी में इब्रानी मूल्यांकन-सूचक मुहावरे का अर्थ रखता है; 'आँखों में अच्छी थी' अत्यधिक शाब्दिक और अस्वाभाविक होता।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: इब्रानी के औपचारिक वंश-सूचक पद को सुरक्षित रखा गया है; अधिक सहज विकल्प 'इस्राएली' पाद-टिप्पणी में दिया गया है।
- source_word: וַיְבָרֲכוּ אֱלֹהִים
  choice: परमेश्वर को धन्य कहा
  rationale: इससे ברך का मूल 'धन्य कहना/आशीष देना' भाव बचता है और हिन्दी में परमेश्वर को संबोधित क्रिया स्पष्ट रहती है; प्रसंगगत 'स्तुति की' विकल्प है।
- source_word: וְלֹא אָמְרוּ
  choice: बात नहीं की
  rationale: शाब्दिक 'नहीं कहा' के बजाय यह हिन्दी में किसी सैन्य कार्रवाई का प्रस्ताव या चर्चा न करने का प्रसंगगत अर्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: उनके विरुद्ध युद्ध के लिए चढ़ाई करने
  rationale: עלה על की सैन्य गति-छवि तथा צבא का युद्ध-संदर्भ दोनों सुरक्षित हैं, बिना इसे केवल 'आक्रमण करना' बनाकर संकुचित किए।
- source_word: לְשַׁחֵת אֶת הָאָרֶץ
  choice: उस देश को नष्ट करने
  rationale: שחת की प्रबल विनाशार्थकता और ארץ का क्षेत्रीय अर्थ स्पष्ट रूप से व्यक्त होते हैं।
- source_word: יֹשְׁבִים בָּהּ
  choice: जिसमें ... रहते थे
  rationale: सहभागी रूप से व्यक्त निरंतर निवास को सहज आधुनिक हिन्दी में प्रस्तुत किया गया है।
