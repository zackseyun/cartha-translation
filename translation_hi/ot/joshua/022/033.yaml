  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। स्रोत की वंश-सूचक भाषा और सैन्य 'चढ़ाई' की छवि को रखा गया है, जबकि मुख्य वाक्य-विन्यास हिन्दी की स्वाभाविकता के अनुरूप है।
