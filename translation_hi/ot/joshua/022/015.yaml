  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। जनजातीय पदबंधों को शाब्दिक ‘पुत्रों’ के बजाय सामान्य पाठक के लिए स्पष्ट समुदायवाचक रूप में प्रस्तुत किया गया है; वास्तविक स्थानवाचक/दिशावाचक अस्पष्टता पादटिप्पणी में रखी गई है।
