  text: וַ/יָּבֹ֜אוּ אֶל בְּנֵי רְאוּבֵ֧ן וְ/אֶל בְּנֵי גָ֛ד וְ/אֶל חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁ֖ה אֶל אֶ֣רֶץ הַ/גִּלְעָ֑ד וַ/יְדַבְּר֥וּ אִתָּ֖/ם לֵ/אמֹֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/015.yaml
  text: And they came to the sons of Reuben[a], and to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead, and they spoke with them, saying[b],
translation:
  language: hi
  text: तब वे गिलाद देश में रूबेनियों, गादियों और मनश्शे के आधे गोत्र के पास आए[a] और उनसे बात की, यह कहते हुए[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गिलाद देश को आए।” इब्रानी संबंधबोधक शब्द दिशा भी बता सकता है, पर यहाँ संभवतः वह उस स्थान को सूचित करता है जहाँ वे पूर्वी गोत्रों के पास आए।
    reason: lexical_alternative
  - marker: b
    text: या, “और उनसे बोले,”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब वे ... आए
  rationale: בוא के कथात्मक रूप को स्वाभाविक हिन्दी कथा-क्रम में ‘आए’ से व्यक्त किया गया है; ‘तब’ וַ के अनुक्रमिक कार्य को सहज रूप देता है।
- source_word: בְּנֵי רְאוּבֵן / בְּנֵי גָד
  choice: रूबेनियों / गादियों
  rationale: जनजातीय सूत्र में בְּנֵי का आशय संबंधित गोत्र के सदस्य हैं। आधुनिक हिन्दी में ‘रूबेन के पुत्रों’ की अपेक्षा ‘रूबेनियों’ और ‘गादियों’ अधिक स्वाभाविक और स्पष्ट हैं।
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र के लोग
  rationale: ‘आधा गोत्र’ मूल संरचना को बनाए रखता है, और ‘लोग’ जोड़ने से तीनों संबोधित समुदायों की हिन्दी सूची स्वाभाविक बनती है।
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: गिलाद देश में
  rationale: यद्यपि אֶל सामान्यतः दिशा (‘को/की ओर’) बताता है, यहाँ यह पूर्वी गोत्रों से भेंट के स्थान को सूचित करता प्रतीत होता है। स्थानवाचक अर्थ मुख्य पाठ में रखा गया और दिशावाचक संभावना पादटिप्पणी में सुरक्षित की गई है।
- source_word: וַיְדַבְּרוּ אִתָּם
  choice: उनसे बात करते हुए
  rationale: דבר के साथ אֵת परस्पर संवाद या सीधे संबोधन दोनों व्यक्त कर सकता है। ‘उनसे बात’ हिन्दी में इस संबंध को स्वाभाविक रूप से रखता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: प्रत्यक्ष कथन आरम्भ कराने वाले इब्रानी सूत्र को हिन्दी में ‘कहा’ से सहज रूप दिया गया है; इससे अगले पद से जुड़ाव स्पष्ट रहता है।
