source:
  edition: WLC
  text: חָלִילָ/ה֩ לָּ֨/נוּ מִמֶּ֜/נּוּ לִ/מְרֹ֣ד בַּֽ/יהוָ֗ה וְ/לָ/שׁ֤וּב הַ/יּוֹם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה לִ/בְנ֣וֹת מִזְבֵּ֔חַ לְ/עֹלָ֖ה לְ/מִנְחָ֣ה וּ/לְ/זָ֑בַח מִ/לְּ/בַ֗ד מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ אֲשֶׁ֖ר לִ/פְנֵ֥י מִשְׁכָּנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/029.yaml
  text: Far be it from us that we should rebel against Yahweh and turn away today from following Yahweh by building an altar for burnt offering[a], grain offering, or sacrifice, besides the altar of Yahweh our God that is before his tabernacle.
translation:
  language: hi
  text: हमसे ऐसा कभी न हो कि हम याहवे के विरुद्ध विद्रोह करें और आज याहवे के पीछे चलना छोड़ दें[a], अर्थात् होमबलि, अन्नबलि या बलिदान के लिए एक वेदी बनाएँ—हमारे परमेश्वर याहवे की उस वेदी के सिवा, जो उसके निवास-स्थान के सामने है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आज याहवे के पीछे से लौट जाएँ।”
    reason: इब्रानी मुहावरे का अधिक शाब्दिक रूप दिखाने और ‘याहवे के पीछे चलना छोड़ दें’ के आधार को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: חָלִילָה לָּנוּ מִמֶּנּוּ
  choice: यह हमसे कोसों दूर रहे
  rationale: यह प्रबल अस्वीकार और घृणा व्यक्त करने वाला इब्रानी मुहावरा है। हिंदी मुहावरा उसके बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִמְרֹד בַּיהוָה
  choice: याहवे से विद्रोह करें
  rationale: מָרַד के साथ בְּ विरोधात्मक संबंध बताता है; 'विद्रोह' वाचा के परमेश्वर के प्रति जानबूझकर की गई अवज्ञा का भाव बनाए रखता है।
- source_word: וְלָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: और आज याहवे के पीछे चलना छोड़ दें
  rationale: शाब्दिक मुहावरे 'याहवे के पीछे से लौटना' का आशय उसका अनुसरण छोड़ना है। यह रूप संबंधपरक और वाचागत भाव को स्पष्ट रखते हुए सहज हिंदी देता है।
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: कोई वेदी बनाएँ
  rationale: अनिश्चित वेदी का उल्लेख है; 'कोई' अधिकृत वेदी से भिन्न दूसरी वेदी बनाने के निषिद्ध आशय को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: לְעֹלָה
  choice: होमबलि
  rationale: עֹלָה के लिए यह प्रचलित तकनीकी हिंदी शब्द है और पूरी तरह जलाई जाने वाली बलि का संकेत देता है।
- source_word: לְמִנְחָה
  choice: अन्नबलि
  rationale: बलिदानी संदर्भ में מִנְחָה अन्न से चढ़ाई जाने वाली भेंट है; 'अन्नबलि' सामान्य 'भेंट' से अधिक सटीक है।
- source_word: וּלְזָבַח
  choice: या बलिदान
  rationale: זֶבַח यहाँ व्यापक बलिदानी शब्द है; किसी विशेष उपप्रकार को आरोपित नहीं किया गया।
- source_word: מִלְּבַד
  choice: के अलावा
  rationale: यह नई वेदी और एकमात्र वैध वेदी के बीच बहिष्कारी विरोध को स्पष्ट करता है।
- source_word: מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: उस वेदी के अलावा जो हमारे परमेश्वर याहवे की है
  rationale: संबंधवाचक रचना हिंदी में स्वाभाविक है और 'हमारे परमेश्वर' की वाचागत स्वीकारोक्ति सुरक्षित रखती है।
- source_word: אֲשֶׁר לִפְנֵי מִשְׁכָּנוֹ
  choice: और उसके निवास-स्थान के सामने है
  rationale: מִשְׁכָּן का मूल भाव परमेश्वर का निवास है। 'निवास-स्थान' प्रत्यय 'उसके' और वैध वेदी की स्थानिक स्थिति दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ वाचा का विशिष्ट नाम יהוה प्रयोग करता है। 'याहवे' उसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: दूसरी वेदी बनाने का धार्मिक आशय
  choice: इसे याहवे से विद्रोह और उसका अनुसरण छोड़ने के रूप में ही रहने दिया गया
  alternative: इसे केवल अनधिकृत उपासना या मूर्तिपूजा कहकर स्पष्ट करना
  rationale: पद स्वयं कड़ा वाचागत आरोप व्यक्त करता है, पर मूर्तिपूजा शब्द नहीं कहता; इसलिए निहितार्थ को किसी अधिक विशिष्ट धार्मिक अपराध में नहीं बदला गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। बलिदानी शब्दावली में प्रचलित ‘होमबलि’, ‘अन्नबलि’ और ‘वेदी’ रखे गए हैं। प्रबल अस्वीकार के लिए स्वाभाविक मुहावरा ‘कोसों दूर रहे’ चुना गया है।
