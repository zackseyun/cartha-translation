source:
  edition: WLC
  text: וַ/יָּ֣שָׁב פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וְ/הַ/נְּשִׂיאִ֡ים מֵ/אֵ֣ת בְּנֵֽי רְאוּבֵן֩ וּ/מֵ/אֵ֨ת בְּנֵי גָ֜ד מֵ/אֶ֧רֶץ הַ/גִּלְעָ֛ד אֶל אֶ֥רֶץ כְּנַ֖עַן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּשִׁ֥בוּ אוֹתָ֖/ם דָּבָֽר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/032.yaml
  text: Then Phinehas son of Eleazar the priest[a], and the leaders, returned from the sons of Reuben and from the sons of Gad, from the land of Gilead to the land of Canaan, to the sons of Israel[b], and brought back word to them.
translation:
  language: hi
  text: तब एलीआज़र याजक का पुत्र पीनहास और अगुवे रूबेन के वंशजों के पास से और गाद के वंशजों के पास से, गिलाद देश से कनान देश में इस्राएलियों[a] के पास लौट आए और उन्हें समाचार दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों।” यहाँ इसका अर्थ इस्राएली लोग है।
    reason: lexical_alternative
  - marker: b
    text: या, “और उन्हें बात बताई।” हिब्रू דָּבָר का अर्थ प्रसंग के अनुसार “वचन,” “बात,” “मामला” या “समाचार” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौट आए
  rationale: שׁוב का यह कथात्मक रूप वापसी बताता है। बहुवचन कर्ता ‘पीनहास और प्रधान’ के अनुसार हिन्दी में बहुवचन प्रयोग किया गया है।
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: एलीआज़र याजक का पुत्र पीनहास
  rationale: हिब्रू पदबंध में ‘याजक’ व्याकरणतः एलीआज़र को विशेषित करता है; हिन्दी शब्दक्रम इसे स्पष्ट और स्वाभाविक रखता है।
- source_word: וְהַנְּשִׂיאִים
  choice: और प्रधान
  rationale: נְשִׂיאִים यहाँ गोत्रीय अगुओं को दर्शाता है। ‘प्रधान’ राजकीय अर्थ थोपे बिना उनकी प्रतिनिधिक नेतृत्व-भूमिका व्यक्त करता है।
- source_word: מֵאֵת בְּנֵי רְאוּבֵן וּמֵאֵת בְּנֵי גָד
  choice: रूबेन के वंशजों और गाद के वंशजों के पास से
  rationale: בְּנֵי + गोत्रनाम का आशय उस गोत्र के लोग हैं। दोहराए गए संबंध को बनाए रखते हुए ‘वंशज’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מֵאֶרֶץ הַגִּלְעָד
  choice: गिलाद देश छोड़कर
  rationale: מִן आरंभ-बिंदु बताता है। हिन्दी में ‘देश छोड़कर’ आगे आने वाले गंतव्य के साथ भौगोलिक गति को सहज रूप से व्यक्त करता है।
- source_word: אֶל אֶרֶץ כְּנַעַן
  choice: कनान देश में
  rationale: אֶרֶץ का भौगोलिक अर्थ ‘देश’ से व्यक्त किया गया है और गिलाद तथा कनान का विरोध बनाए रखा गया है।
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के पास
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ के बजाय प्रचलित सामुदायिक अर्थ ‘इस्राएली’ चुना गया है; पादटिप्पणी स्रोत-रूप बताती है।
- source_word: וַיָּשִׁבוּ אוֹתָם דָּבָר
  choice: और उन्हें समाचार दिया
  rationale: यह मुहावरा उत्तर या संदेश वापस पहुँचाने का भाव देता है। ‘समाचार दिया’ प्रसंग में स्वाभाविक है, जबकि דָּבָר की ‘बात/वृत्तांत’ वाली संभावना पादटिप्पणी में सुरक्षित है।
