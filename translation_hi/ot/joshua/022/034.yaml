source:
  edition: WLC
  text: וַֽ/יִּקְרְא֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד לַ/מִּזְבֵּ֑חַ כִּ֣י עֵ֥ד הוּא֙ בֵּֽינֹתֵ֔י/נוּ כִּ֥י יְהוָ֖ה הָ/אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/034.yaml
  text: And the sons of Reuben and the sons of Gad called the altar Witness[a], for it is a witness between us that Yahweh is God.
translation:
  language: hi
  text: रूबेन के वंशजों और गाद के वंशजों ने उस वेदी का नाम “साक्षी” रखा[a], क्योंकि वह हमारे बीच इस बात की साक्षी है कि यहोवा परमेश्वर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक विस्तार से, “उन्होंने उस वेदी का नाम ‘हमारे बीच साक्षी कि यहोवा परमेश्वर है’ रखा,” यदि व्याख्यात्मक उपवाक्य को नामकरण का कारण न मानकर नाम का ही भाग समझा जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: नाम रखा
  rationale: ל के साथ קרא यहाँ किसी वस्तु को नाम देने का अर्थ रखता है; आधुनिक हिन्दी में “नाम रखा” स्पष्ट और स्वाभाविक है।
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: रूबेन के वंशजों और गाद के वंशजों
  rationale: בְּנֵי का वंशगत भाव सुरक्षित रखते हुए यह हिन्दी में “पुत्रों” से अधिक स्वाभाविक है और दोनों गोत्रीय समुदायों को दर्शाता है।
- source_word: לַמִּזְבֵּחַ
  choice: उस वेदी का
  rationale: מִזְבֵּחַ का मानक हिन्दी रूप “वेदी” है; हिन्दी की नामकरण-रचना के अनुसार संबंधकारक प्रयोग किया गया है।
- source_word: עֵד
  choice: साक्षी
  rationale: शब्द का सीधा अर्थ गवाही देने वाला अथवा साक्ष्य है; वेदी के नाम के रूप में “साक्षी” संक्षिप्त और गरिमापूर्ण है।
- source_word: כִּי עֵד הוּא בֵּינֹתֵינוּ
  choice: क्योंकि वह हमारे बीच ... साक्षी है
  rationale: पहला כִּי नामकरण का कारण बताता है। הוּא का संदर्भ वेदी से है, और בֵּינֹתֵינוּ पक्षों के बीच साझा प्रमाण का संबंध व्यक्त करता है।
- source_word: כִּי יְהוָה הָאֱלֹהִים
  choice: इस बात की ... कि यहोवा ही परमेश्वर है
  rationale: दूसरा כִּי साक्षी की विषय-वस्तु प्रस्तुत करता है। “ही” हिब्रू के विधेयात्मक, स्वीकारोक्तिपरक वाक्य का स्वाभाविक हिन्दी बल व्यक्त करता है; יְהוָה को उसके व्यक्तिगत नाम “यहोवा” से प्रस्तुत किया गया है।
theological_decisions:
- issue: क्या व्याख्यात्मक उपवाक्य को वेदी के पूरे नाम का भाग माना जाए
  choice: मुख्य पाठ में केवल “साक्षी” को नाम मानना और अगले उपवाक्य को नामकरण का कारण समझना
  alternative: 'पूरे वाक्यांश को नाम मानना: “हमारे बीच साक्षी कि यहोवा ही परमेश्वर है”'
  rationale: मसोरेटिक पाठ में עֵד के बाद का כִּי-वाक्य कारण अथवा व्याख्या के रूप में सहजता से पढ़ा जाता है, पर लंबे नाम की संभावना पूरी तरह समाप्त नहीं होती; इसलिए वैकल्पिक समझ पादटिप्पणी में रखी गई है।
- issue: יְהוָה הָאֱלֹהִים का स्वीकारोक्तिपरक अर्थ
  choice: “यहोवा ही परमेश्वर है”
  alternative: “यहोवा परमेश्वर है” अथवा “यहोवा वह परमेश्वर है”
  rationale: हिब्रू में निश्चित पद הָאֱלֹהִים पहचान और विशिष्टता का बल दे सकता है। हिन्दी में “ही” संदर्भानुकूल रूप से यह स्वीकारोक्ति व्यक्त करता है, बिना किसी संप्रदायगत विस्तार के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। “वंशज,” “वेदी,” और “साक्षी” सामान्य पाठकों के लिए बोधगम्य रहते हुए बाइबलीय गरिमा बनाए रखते हैं। वाक्य-विन्यास हिन्दी के अनुरूप किया गया है, जबकि हिब्रू की नामकरण-संबंधी अस्पष्टता पादटिप्पणी में सुरक्षित है।
