source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶל גְּלִיל֣וֹת הַ/יַּרְדֵּ֔ן אֲשֶׁ֖ר בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יִּבְנ֣וּ בְנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִ֣י שֵׁבֶט֩ הַֽ/מְנַשֶּׁ֨ה שָׁ֤ם מִזְבֵּ֨חַ֙ עַל הַ/יַּרְדֵּ֔ן מִזְבֵּ֥חַ גָּד֖וֹל לְ/מַרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/010.yaml
  text: When they came to the region of the Jordan that is in the land of Canaan[b][a], the sons of Reuben and the sons of Gad and the half-tribe of Manasseh built there an altar by the Jordan—an altar great in appearance.
translation:
  language: hi
  text: जब वे कनान देश में यरदन के क्षेत्र[a] में पहुँचे, तब रूबेन के वंशजों, गाद के वंशजों और मनश्शे के आधे गोत्र ने वहाँ यरदन के पास एक वेदी बनाई—एक ऐसी वेदी, जो देखने में बड़ी थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यरदन के जिलों” अथवा “यरदन की सीमाओं” में।
    reason: lexical_alternative
  - marker: b
    text: या “देखने के लिए एक बड़ी वेदी”; अर्थात, रूप में स्पष्ट रूप से दिखाई देने वाली वेदी।
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּלִילוֹת
  choice: क्षेत्र
  rationale: यह शब्द आसपास के भूभाग या जिले का बोध कराता है। आधुनिक हिन्दी में ‘क्षेत्र’ स्वाभाविक है और ‘घेरों’ जैसे अत्यधिक शाब्दिक रूप की अस्पष्टता से बचता है।
- source_word: וַיָּבֹאוּ אֶל
  choice: जब वे ... में पहुँचे
  rationale: वाव-क्रम कथानक को आगे बढ़ाता है; प्रसंग में ‘जब ... पहुँचे’ आगमन और उसके बाद हुई वेदी-निर्माण की घटना का समय-संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: यह पदबंध उस यरदन-क्षेत्र को स्पष्ट करता है जो कनान की ओर है; हिन्दी में इसे मुख्य भौगोलिक पदबंध के भीतर रखना स्पष्ट और स्वाभाविक है।
- source_word: בְנֵי רְאוּבֵן / בְנֵי גָד
  choice: रूबेन के वंशज / गाद के वंशज
  rationale: ‘वंशज’ हिब्रू के पारिवारिक-गोत्रीय मुहावरे को साधारण आधुनिक हिन्दी में स्पष्ट करता है; ‘पुत्र’ यहाँ केवल प्रत्यक्ष बेटों का भ्रम दे सकता है।
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: मनश्शे का आधा गोत्र
  rationale: यह हिब्रू रचना का सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: מִזְבֵּחַ
  choice: वेदी
  rationale: बलि अथवा उपासना से संबंधित संरचना के लिए यह मानक हिन्दी बाइबलीय शब्द है।
- source_word: עַל הַיַּרְדֵּן
  choice: यरदन के पास
  rationale: इस भौगोलिक प्रयोग में עַל निकटता व्यक्त करता है; ‘पास’ हिन्दी में स्वाभाविक है और नदी के ऊपर होने का भ्रम नहीं देता।
- source_word: מִזְבֵּחַ גָּדוֹל לְמַרְאֶה
  choice: एक ऐसी वेदी, जो देखने में बहुत बड़ी थी
  rationale: यह आकार और दृश्य प्रभाव दोनों की संभावित छाया को बनाए रखता है तथा वेदी के उद्देश्य या निर्माणकर्ताओं की मंशा पर कोई निर्णय नहीं जोड़ता।
theological_decisions:
- issue: प्रतिद्वंद्वी उपासना-स्थल होने का संभावित संकेत
  choice: वेदी के निर्माण और उसके दिखाई देने वाले बड़े रूप का केवल वर्णन किया गया है।
  alternative: ‘एक भव्य वेदी’ या ‘प्रतिद्वंद्वी वेदी’
  rationale: यह पद अभी वेदी का प्रयोजन या निर्माणकर्ताओं की मंशा नहीं बताता। इसलिए अनुवाद आगे के कथानक से पहले धार्मिक दोष या प्रतिद्वंद्विता का निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। गोत्रीय अभिव्यक्तियों में ‘वंशज’ का प्रयोग किया गया है। वाक्य कथात्मक प्रवाह बनाए रखता है और वेदी के प्रयोजन को अनिर्णीत छोड़ता है।
