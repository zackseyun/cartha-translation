  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के अनुकूल रखी गई है। प्रत्यक्ष कथन के भीतर उद्धरण को स्पष्ट रखा गया है। ‘होमबलि’ स्थापित बाइबलीय शब्द है, जबकि शेष वाक्य सामान्य आधुनिक हिन्दी में है।
