base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/028.yaml
  text: 'So we said[a], ‘If they should say to us or to our generations in time to come, then we will say: “Look at the pattern of the altar of Yahweh, which our fathers made—not for burnt offering and not for sacrifice, but it is a witness between us and you.”’'
translation:
  language: hi
  text: इसलिए हमने कहा, “यदि भविष्य में वे हमसे या हमारी आनेवाली पीढ़ियों से कहें, तो हम कहेंगे, ‘याहवे की वेदी के प्रतिरूप[a] को देखो, जिसे हमारे पुरखों ने बनाया था—न होमबलि के लिए और न बलिदान के लिए, बल्कि यह हमारे और तुम्हारे बीच एक साक्षी है।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नमूना,” “रूप,” अथवा “प्रतिकृति।” इब्रानी शब्द किसी वस्तु के रूप, नमूने, या प्रतिनिधिक प्रतिरूप को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: इसलिए हमने कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है और प्रसंग में पिछली बात से निष्कर्षात्मक संबंध भी रखता है; ‘इसलिए’ आधुनिक हिन्दी में यह बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהָיָה כִּי
  choice: यदि ... ऐसा कहें
  rationale: यह पदबंध भविष्य की संभावित परिस्थिति प्रस्तुत करता है; हिन्दी में ‘यदि’ उस शर्तात्मक भाव को स्पष्ट रखता है।
- source_word: יֹאמְרוּ אֵלֵינוּ וְאֶל דֹּרֹתֵינוּ מָחָר
  choice: आनेवाले समय में वे हमसे या हमारी आनेवाली पीढ़ियों से ऐसा कहें
  rationale: מָחָר यहाँ शाब्दिक ‘कल’ नहीं, भविष्यकाल का मुहावरा है। ‘आनेवाली पीढ़ियाँ’ דֹּרֹתֵינוּ का स्वाभाविक अर्थ देता है; प्रसंगगत कथन को हिन्दी में पूरा करने के लिए ‘ऐसा’ जोड़ा गया है।
- source_word: וְאָמַרְנוּ
  choice: तो हम उत्तर देंगे
  rationale: शर्त के फलस्वरूप भविष्य में दिए जाने वाले प्रत्युत्तर को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רְאוּ
  choice: देखो
  rationale: बहुवचन आज्ञार्थक ध्यान आकर्षित करता है; आधुनिक हिन्दी में ‘देखो’ सीधा और स्वाभाविक है।
- source_word: תַּבְנִית
  choice: प्रतिकृति
  rationale: यहाँ शब्द किसी रूप, नमूने या प्रतिनिधिक प्रतिरूप को दर्शाता है। ‘प्रतिकृति’ यह स्पष्ट करती है कि यह बलि चढ़ाने की अधिकृत वेदी नहीं, बल्कि उसकी गवाही देने वाला बनाया गया रूप था, बिना पाठ से आगे बढ़े।
- source_word: מִזְבַּח יְהוָה
  choice: याहवे की वेदी
  rationale: सम्बन्धवाचक रचना को स्वाभाविक हिन्दी में रखा गया है और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֲשֶׁר עָשׂוּ אֲבוֹתֵינוּ
  choice: जिसे हमारे पुरखाओं ने बनाया था
  rationale: ‘पुरखा’ אבות के पितृगत और पूर्वज-संबंधी अर्थ को सहज आधुनिक हिन्दी में बनाए रखता है; बहुवचन कर्ता के साथ हिन्दी की स्वाभाविक क्रिया-रचना अपनाई गई है।
- source_word: לֹא לְעוֹלָה וְלֹא לְזֶבַח
  choice: न होमबलि के लिए और न बलिदान के लिए
  rationale: दोहराए गए לֹא ... וְלֹא को ‘न ... और न ...’ द्वारा सुरक्षित रखा गया है। עֹלָה के लिए प्रचलित बाइबलीय ‘होमबलि’ और זֶבַח के लिए व्यापक ‘बलिदान’ चुना गया है।
- source_word: כִּי עֵד הוּא
  choice: बल्कि यह ... एक गवाह है
  rationale: पूर्ववर्ती निषेध के विपरीत वेदी का वास्तविक उद्देश्य बताने के लिए כִּי को ‘बल्कि’ से व्यक्त किया गया है; הוּא की स्पष्ट सर्वनामिक संरचना ‘यह ... है’ में बनी रहती है।
- source_word: בֵּינֵינוּ וּבֵינֵיכֶם
  choice: हमारे और तुम्हारे बीच
  rationale: सम्बन्धसूचक पदबंध का सीधा, स्वाभाविक अनुवाद; ‘तुम्हारे’ संदर्भ में बहुवचन समुदाय को संबोधित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है, जबकि उसके उच्चारण की ऐतिहासिक अनिश्चितता को किसी धार्मिक विशिष्टता से नहीं भरता।
- issue: वेदी का उद्देश्य
  choice: बलि के लिए नहीं, बल्कि गवाह
  alternative: बलि चढ़ाने की दूसरी अधिकृत वेदी
  rationale: दोहरे निषेध और עֵד के स्पष्ट कथन को बनाए रखा गया है; पाठ स्वयं इस निर्माण को बलिदानी उपयोग से अलग करके सामुदायिक गवाही ठहराता है।
- issue: אֲבוֹתֵינוּ का संबंधसूचक अर्थ
  choice: हमारे पुरखा
  alternative: हमारे पिता; हमारे पूर्वज
  rationale: ‘पुरखा’ हिन्दी में पुरुष पितृपूर्वजों का भाव रखते हुए बहुपीढ़ीय संदर्भ में स्वाभाविक है और अनावश्यक रूप से केवल तत्काल पिता तक अर्थ सीमित नहीं करता।
