  text: וַ/יָּשֻׁ֣בוּ וַ/יֵּלְכ֡וּ בְּנֵי רְאוּבֵ֨ן וּ/בְנֵי גָ֜ד וַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/שִּׁלֹ֖ה אֲשֶׁ֣ר בְּ/אֶֽרֶץ כְּנָ֑עַן לָ/לֶ֜כֶת אֶל אֶ֣רֶץ הַ/גִּלְעָ֗ד אֶל אֶ֤רֶץ אֲחֻזָּתָ/ם֙ אֲשֶׁ֣ר נֹֽאחֲזוּ בָ֔/הּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/009.yaml
  text: So the sons of Reuben and the sons of Gad and the half-tribe of Manasseh returned and departed from the sons of Israel[a], from Shiloh, which is in the land of Canaan, to go to the land of Gilead, to the land of their possession, which they had taken possession of by the command of Yahweh through Moses.
translation:
  language: hi
  text: तब रूबेन के वंशज, गाद के वंशज और मनश्शे के आधे गोत्र के लोग इस्राएलियों से विदा होकर लौट चले गए। वे कनान देश में स्थित शीलो से गिलाद देश में अपनी अधिकार-भूमि की ओर गए, जिस पर उन्होंने याहवे की उस आज्ञा के अनुसार अधिकार पाया था जो मूसा के द्वारा दी गई थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उन्हें अधिकार में मिली थी।” इब्रानी क्रिया भूमि को प्राप्त करने अथवा उस पर अधिकार बनाए रखने—दोनों में से किसी भाव पर बल दे सकती है।
    reason: नֹאחֲזוּ की प्राप्त/धारित भू-अधिकार संबंधी अर्थ-व्याप्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ
  choice: लौटकर चल दिए
  rationale: שׁוב की वापसी की दिशा और הלך की प्रस्थान-क्रिया, दोनों को स्वाभाविक हिन्दी में बनाए रखता है; शाब्दिक ‘लौटे और गए’ की असहज पुनरुक्ति से बचता है।
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: रूबेनियों, गादियों और मनश्शे के आधे गोत्र के लोग
  rationale: वंशगत समूहों को आधुनिक हिन्दी में स्पष्ट करता है और ‘आधा गोत्र’ का प्रादेशिक-गोत्रीय अर्थ सुरक्षित रखता है।
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के पास से
  rationale: מֵאֵת के अलग होकर जाने के भाव को व्यक्त करता है; यहाँ ‘इस्राएली’ व्यापक सभा के शेष लोगों को सूचित करता है।
- source_word: מִשִּׁלֹה אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: कनान देश के शीलो से
  rationale: स्थान-संबंध को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है, बिना भौगोलिक सूचना खोए।
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: गिलाद देश में
  rationale: אֶרֶץ का प्रादेशिक बल ‘देश’ से बना रहता है; आगे की दिशा ‘की ओर’ से पूरी होती है।
- source_word: אֶל אֶרֶץ אֲחֻזָּתָם
  choice: अपनी अधिकार-भूमि की ओर
  rationale: אֲחֻזָּה के कानूनी-प्रादेशिक अर्थ, अर्थात स्थायी भू-अधिकार या निज भाग, को संक्षिप्त रूप में व्यक्त करता है।
- source_word: אֲשֶׁר נֹאחֲזוּ בָהּ
  choice: जिस पर उन्होंने ... अधिकार पाया था
  rationale: निफ़अल रूप के परिणामस्वरूप प्राप्त/स्थापित भू-अधिकार को व्यक्त करता है, जबकि पादटिप्पणी उसके ग्रहण और धारण—दोनों संभावित बलों को दर्ज करती है।
- source_word: עַל פִּי יְהוָה בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा दी गई याहवे की आज्ञा के अनुसार
  rationale: עַל־פִּי को ‘आज्ञा के अनुसार’ और בְּיַד को मध्यस्थता/माध्यम के रूप में व्यक्त करता है; वाचा-नाम יְהוָה को ‘याहवे’ रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसका पारदर्शी देवनागरी लिप्यंतरण है और सामान्य उपाधि से उसे नहीं बदलता।
- issue: भूमि पर अधिकार मिलने की कर्तृवाच्यता
  choice: उन्होंने ... अधिकार पाया था
  alternative: उन्हें उस पर अधिकार दिया गया था
  rationale: निफ़अल रूप प्राप्त अवस्था या अधिकार में स्थापित होने का भाव दे सकता है। मुख्य पाठ सक्रिय अनुभवसूचक हिन्दी रखता है, लेकिन ऐसा नहीं कहता कि अधिकार स्वतंत्र मानवीय विजय से मिला; याहवे की आज्ञा का उल्लेख स्रोत को स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लम्बे इब्रानी वाक्य को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है, पर घटनाक्रम, स्थान और आज्ञा-माध्यम का संबंध सुरक्षित है।
