  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/גְב֣וּל נָֽתַן יְ֠הוָה בֵּינֵ֨/נוּ וּ/בֵינֵי/כֶ֜ם בְּנֵי רְאוּבֵ֤ן וּ/בְנֵי גָד֙ אֶת הַ/יַּרְדֵּ֔ן אֵין לָ/כֶ֥ם חֵ֖לֶק בַּֽ/יהוָ֑ה וְ/הִשְׁבִּ֤יתוּ בְנֵי/כֶם֙ אֶת בָּנֵ֔י/נוּ לְ/בִלְתִּ֖י יְרֹ֥א אֶת יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/025.yaml
  text: For Yahweh has made the Jordan a boundary between us and you[a], sons of Reuben and sons of Gad. You have no portion in Yahweh. And so your sons might cause our sons to stop fearing Yahweh.
translation:
  language: hi
  text: क्योंकि याहवे ने हमारे और तुम्हारे बीच—हे रूबेनियों और गादियों—यरदन को सीमा ठहराया है। याहवे में तुम्हारा कोई भाग नहीं है। इस प्रकार तुम्हारे बेटे हमारे बेटों को याहवे का भय मानने से रोक देंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּגְבוּל נָתַן
  choice: सीमा ठहराया है
  rationale: גְבוּל सीमा को दर्शाता है, और נתן के साथ यह वाक्यांश सीमा स्थापित करने का भाव देता है। ‘सीमा ठहराया है’ स्रोत के अर्थ और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֶת הַיַּרְדֵּן
  choice: यरदन
  rationale: नदी का प्रसिद्ध व्यक्तिवाचक नाम अपने आप पर्याप्त है; ‘नदी’ जोड़ना आवश्यक नहीं।
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: रूबेन के वंशजो और गाद के वंशजो
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ वह गोत्रीय समुदायों को संबोधित करता है। ‘वंशजो’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है और संबोधन को बनाए रखता है।
- source_word: אֵין לָכֶם חֵלֶק בַּיהוָה
  choice: याहवे में तुम्हारा कोई भाग नहीं है
  rationale: חֵלֶק का मूल भाव ‘भाग/हिस्सा’ है। ‘भाग’ वाचा और उपासना में सहभागिता के भाव को सुरक्षित रखता है, बिना इसे केवल भूमि या उत्तराधिकार तक सीमित किए।
- source_word: וְהִשְׁבִּיתוּ
  choice: रोक देंगे
  rationale: שבת के हिफ़ील रूप का अर्थ किसी को किसी कार्य से विरत कर देना या उसे रुकवा देना है। यहाँ कल्पित भावी परिणाम को हिन्दी के भविष्यकाल में व्यक्त किया गया है।
- source_word: לְבִלְתִּי יְרֹא אֶת יְהוָה
  choice: याहवे का भय मानने से
  rationale: यह रचना भय मानना बंद कराने या उससे रोकने का भाव देती है। ‘भय मानना’ परमेश्वर के प्रति श्रद्धामिश्रित भय की पारंपरिक और बोधगम्य अभिव्यक्ति है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; ‘याहवे’ उसे उपाधि से बदले बिना प्रस्तुत करता है।
- issue: חֵלֶק בַּיהוָה का आशय
  choice: याहवे में तुम्हारा कोई भाग नहीं है
  alternative: याहवे की प्रजा में तुम्हारा कोई हिस्सा नहीं है
  rationale: विस्तृत विकल्प संभावित वाचागत आशय स्पष्ट करता, पर मूल की संक्षिप्त और अर्थगर्भित अभिव्यक्ति को सीमित कर देता। मुख्य पाठ मूल की वास्तविक व्यापकता बनाए रखता है।
- issue: וְהִשְׁבִּיתוּ की भावी निश्चितता
  choice: रोक देंगे
  alternative: रोक सकते हैं
  rationale: हिब्रू क्रिया संभाव्यता का स्पष्ट चिह्न नहीं देती; यह कल्पित भावी कथन के भीतर परिणाम को सीधे व्यक्त करती है। इसलिए मुख्य पाठ में निश्चित भविष्य रखा गया है, यद्यपि पूरे प्रसंग में यह आशंकित परिस्थिति है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। गोत्रीय संबोधन को साफ करने के लिए डैश लगाए गए हैं। पद में पूर्ववर्ती कथन के भीतर उद्धृत भाव होने के कारण समापन उद्धरण-चिह्न रखा गया है।
