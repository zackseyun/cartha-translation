source:
  edition: WLC
  text: וְ/אַתֶּם֙ תָּשֻׁ֣בוּ הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה וְ/הָיָ֗ה אַתֶּ֞ם תִּמְרְד֤וּ הַ/יּוֹם֙ בַּֽ/יהוָ֔ה וּ/מָחָ֕ר אֶֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יִקְצֹֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/018.yaml
  text: And you are turning away today from following Yahweh[a]; and if you rebel today against Yahweh[c][b], tomorrow he will be angry with the whole congregation of Israel.
translation:
  language: hi
  text: और तुम आज यहोवा का अनुसरण करना छोड़ रहे हो।[a] यदि तुम आज यहोवा के विरुद्ध विद्रोह करोगे, तो कल वह इस्राएल की सारी सभा पर क्रोधित होगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आज यहोवा के पीछे से फिर रहे हो।” यह इब्रानी मुहावरा यहोवा का अनुसरण करना छोड़ देने का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में केवल “वह क्रोधित होगा” है; प्रसंग के अनुसार इसका कर्ता यहोवा है।
    reason: implicit_subject
lexical_decisions:
- source_word: תָּשֻׁבוּ
  choice: फिर रहे हो
  rationale: שוב का मूल अर्थ ‘फिरना/लौटना’ है; מֵאַחֲרֵי के साथ यहाँ निष्ठा छोड़कर दूर फिरने का भाव है। वर्तमान आरोप की तात्कालिकता के लिए ‘फिर रहे हो’ स्वाभाविक है।
- source_word: מֵאַחֲרֵי יְהוָה
  choice: यहोवा के पीछे चलना छोड़कर
  rationale: शाब्दिक ‘यहोवा के पीछे से’ एक इब्रानी मुहावरा है, जिसका अर्थ उसका अनुसरण करना छोड़ना है। यह रूपक और अर्थ दोनों को सहज हिन्दी में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य नाम YHWH का प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: וְהָיָה
  choice: यदि
  rationale: इस प्रसंग में यह आगे आने वाली शर्त और उसके परिणाम को प्रस्तुत करता है; हिन्दी में ‘यदि’ स्वाभाविक है।
- source_word: תִּמְרְדוּ
  choice: विद्रोह करोगे
  rationale: מרד वैध प्रभुता के विरुद्ध जानबूझकर विद्रोह का प्रबल अर्थ देता है।
- source_word: בַּיהוָה
  choice: यहोवा के विरुद्ध
  rationale: מרד के साथ בְּ विरोधात्मक अर्थ रखता है—यहोवा के विरुद्ध विद्रोह।
- source_word: וּמָחָר
  choice: तो कल
  rationale: ‘कल’ निकट और तात्कालिक परिणाम को बनाए रखता है; ‘तो’ हिन्दी में शर्त का परिणाम स्पष्ट करता है।
- source_word: יִקְצֹף
  choice: वह ... क्रोधित होगा
  rationale: קצף प्रबल क्रोध व्यक्त करता है। कर्ता मूल में निहित है और निकट प्रसंग में यहोवा है; फुटनोट इसे स्पष्ट करता है।
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: इस्राएल की पूरी सभा
  rationale: עֵדָה सामूहिक, एकत्रित वाचा-समुदाय को सूचित करता है; ‘पूरी सभा’ आधुनिक हिन्दी में स्वाभाविक और सामूहिक अर्थ के निकट है।
theological_decisions:
- issue: יִקְצֹף का निहित कर्ता
  choice: ‘वह ... क्रोधित होगा,’ जहाँ ‘वह’ से यहोवा अभिप्रेत है
  alternative: 'निर्वैयक्तिक अर्थ: ‘क्रोध भड़क उठेगा’'
  rationale: निकट प्रसंग में उसी यहोवा का नाम है जिसके पीछे चलना वे छोड़ रहे हैं और जिसके विरुद्ध विद्रोह करने की चेतावनी दी गई है; इसलिए यहोवा निहित कर्ता है। फिर भी मूल में नाम दोहराया नहीं गया है, इसलिए इसे फुटनोट में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। आरम्भिक प्रश्नवाचक रूप प्रसंग के आरोपात्मक प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है। ‘सभा’ सामूहिक इस्राएली समुदाय के अर्थ को बनाए रखता है।
