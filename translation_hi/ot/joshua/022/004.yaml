base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/004.yaml
  text: And now Yahweh your God has given rest to your brothers[a], just as he spoke to them. So now turn and go to your tents, to the land of your possession[d][c][b], which Moses the servant of Yahweh gave you beyond the Jordan.
translation:
  language: hi
  text: अब तुम्हारे परमेश्वर याहवे ने तुम्हारे भाइयों[a] को विश्राम दिया है, ठीक जैसा उसने उनसे कहा था[b]। इसलिए अब मुड़ो और अपने तंबुओं[c] को, अपनी उस भूमि में चले जाओ जो तुम्हारे अधिकार में है और जिसे याहवे के सेवक मूसा ने तुम्हें यरदन के उस पार[d] दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयों’ से आशय उनके साथी इस्राएलियों से है।
    reason: lexical_alternative
  - marker: b
    text: या, “ठीक जैसा उसने उनसे प्रतिज्ञा की थी।” इब्रानी में शाब्दिक रूप से “जैसा उसने उनसे कहा था” है।
    reason: lexical_alternative
  - marker: c
    text: या, “अपने घरों को।” मूल में शाब्दिक रूप से “अपने तंबुओं को” है।
    reason: lexical_alternative
  - marker: d
    text: या, “यरदन की दूसरी ओर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵנִיחַ
  choice: विश्राम दिया है
  rationale: हिफ़ील रूप यहाँ युद्ध और संघर्ष से राहत या चैन देने का भाव रखता है। ‘विश्राम दिया है’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर
  rationale: याहवे के साथ यह एकवचन अर्थ में इस्राएल के परमेश्वर को सूचित करता है।
- source_word: לַאֲחֵיכֶם
  choice: तुम्हारे भाइयों
  rationale: मूल में पुल्लिंग बहुवचन ‘भाई’ है और इस प्रसंग में इससे उनके साथी इस्राएली गोत्र अभिप्रेत हैं।
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: ठीक जैसा उसने उनसे कहा था
  rationale: דבר का सीधा अर्थ ‘कहा/बात की’ है। ‘प्रतिज्ञा की’ प्रसंगानुकूल अर्थ है, पर मुख्य पाठ मूल की अभिव्यक्ति को बनाए रखता है।
- source_word: פְּנוּ וּלְכוּ לָכֶם
  choice: मुड़कर ... चले जाओ
  rationale: दोनों आज्ञार्थक क्रियाओं का क्रम रखा गया है; नैतिक संप्रदान לָכֶם को हिन्दी में अलग से व्यक्त करना अस्वाभाविक होता।
- source_word: לְאָהֳלֵיכֶם
  choice: अपने तंबुओं में
  rationale: यह मुहावरे के रूप में घरों का बोध करा सकता है, फिर भी ‘तंबुओं’ से मूल शब्द और ऐतिहासिक चित्र दोनों सुरक्षित रहते हैं।
- source_word: אֶל אֶרֶץ אֲחֻזַּתְכֶם
  choice: अपनी उस भूमि में ... जो तुम्हारी संपत्ति है
  rationale: אֲחֻזָּה स्थायी भू-संपत्ति या अधिकार में मिली भूमि को दर्शाता है। यह रूप हिन्दी में स्पष्ट है और ‘विरासत’ जैसा अतिरिक्त धार्मिक संकेत नहीं जोड़ता।
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: जिसे ... मूसा ने तुम्हें ... दिया था
  rationale: נתן की सामान्य क्रिया ‘देना’ को बनाए रखा गया है; ‘बाँटकर दिया’ या ‘ठहराया’ प्रसंगगत विस्तार होते।
- source_word: עֶבֶד יְהוָה
  choice: याहवे के सेवक
  rationale: मूसा के सम्मानसूचक वाचायी पद में ‘सेवक’ उपयुक्त है; यहाँ दासत्व का भाव प्रमुख नहीं है।
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के उस पार
  rationale: वाक्यांश वक्ता की स्थिति से यरदन की दूसरी ओर के भूभाग को सूचित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचायी नाम का प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: אֲחֻזָּה को ‘विरासत’ मानना
  choice: संपत्ति
  alternative: विरासत
  rationale: यहाँ शब्द का मुख्य अर्थ अधिकार में मिली भू-संपत्ति है। ‘विरासत’ संभव प्रसंगगत व्याख्या है, पर वह मूल शब्द से अधिक विशिष्ट धार्मिक अर्थ ला सकती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘याहवे’, ‘विश्राम’, ‘तंबू’ और ‘संपत्ति’ जैसे शब्द मूल की शब्दावली और ऐतिहासिक परिवेश को बनाए रखते हैं, जबकि वाक्य-विन्यास स्वाभाविक हिन्दी के अनुसार व्यवस्थित है।
