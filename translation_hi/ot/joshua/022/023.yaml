base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/023.yaml
  text: if we built for ourselves an altar to turn away from following Yahweh[a], or if to offer on it burnt offering or grain offering, or if to make on it sacrifices of peace offerings[b], may Yahweh himself require it.
translation:
  language: hi
  text: यदि हमने अपने लिए वेदी याहवे के पीछे चलना छोड़ने के लिए बनाई हो, या उस पर होमबलि और अन्नबलि चढ़ाने के लिए बनाई हो, या उस पर मेलबलियाँ[a] चढ़ाने के लिए बनाई हो, तो याहवे स्वयं हमसे इसका लेखा लें![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेलबलियाँ’ का अनुवाद ‘सहभागिता-बलियाँ’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “याहवे स्वयं हमसे इसका लेखा लेंगे,” अर्थात वे हमें इसके लिए उत्तरदायी ठहराएँगे।
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנוֹת לָנוּ מִזְבֵּחַ
  choice: यदि हमने अपने लिए वेदी ... बनाई हो
  rationale: पिछले पद से जारी शपथ के संदर्भ में לִबְנוֹת को शर्त के रूप में समझा गया है। לָנוּ को ‘अपने लिए’ से और מִזְבֵּחַ को प्रचलित ‘वेदी’ से व्यक्त किया गया है।
- source_word: לָשׁוּב מֵאַחֲרֵי יְהוָה
  choice: याहवे के पीछे चलना छोड़ दें
  rationale: यह वाक्यांश याहवे का अनुसरण करने से फिर जाने का भाव रखता है। चुना हुआ रूप मूल की ‘पीछे चलने’ वाली छवि और धर्मत्याग के आशय, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְהַעֲלוֹת עָלָיו עוֹלָה וּמִנְחָה
  choice: उस पर होमबलि और अन्नबलि चढ़ाएँ
  rationale: הַעֲלוֹת यहाँ बलि चढ़ाने की पारिभाषिक क्रिया है। עוֹלָה के लिए ‘होमबलि’ और बलिदानी संदर्भ में מִנְחָה के लिए ‘अन्नबलि’ चुना गया है। दोनों संज्ञाओं के बीच हिब्रू וּ को ‘और’ के रूप में रखा गया है।
- source_word: זִבְחֵי שְׁלָמִים
  choice: मेलबलियाँ
  rationale: यह उन बलियों का प्रचलित और संक्षिप्त हिन्दी नाम है जिनका संबंध कुशल-क्षेम, मेल और साझा भोज से है। ‘सहभागिता-बलियाँ’ संभव वैकल्पिक अर्थ है और पादटिप्पणी में दिया गया है।
- source_word: יְהוָה הוּא יְבַקֵּשׁ
  choice: याहवे स्वयं हमसे इसका लेखा लें
  rationale: הוּא का बल ‘स्वयं’ से व्यक्त हुआ है। शपथ और आत्म-शाप के प्रसंग में יְבַקֵּשׁ केवल खोजने के बजाय उत्तरदायित्व माँगने या दंड देने का भाव रखता है; आदरसूचक विधिलिंग ‘लें’ इस आत्म-शापात्मक बल को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יְהוָה है; उसका लिप्यंतरण नाम और उपाधि के अंतर को सुरक्षित रखता है।
- issue: अंतिम उपवाक्य का शपथगत बल
  choice: याहवे स्वयं हमसे इसका लेखा लें
  alternative: याहवे स्वयं हमसे इसका लेखा लेंगे
  rationale: संदर्भ आत्म-शापयुक्त शपथ का है, इसलिए विधिलिंग उपयुक्त है; फिर भी हिब्रू क्रियारूप को साधारण भविष्यवाणी की तरह भी समझा जा सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। बलिदानी शब्दावली के लिए प्रचलित ‘होमबलि’, ‘अन्नबलि’ और ‘मेलबलि’ का प्रयोग किया गया है। शर्तसूचक वाक्य-विन्यास पिछले पद से जारी शपथ को स्पष्ट करता है, जबकि अंतिम विधिलिंग मूल की आत्म-शापात्मक गंभीरता बनाए रखता है।
