lexical_decisions:
- source_word: וַיְבָרְכֵם
  choice: उन्हें आशीर्वाद देकर
  rationale: पिएल रूप यहाँ यहोशू द्वारा प्रस्थान करने वालों को आशीर्वाद देने की औपचारिक क्रिया व्यक्त करता है। हिंदी में संयुक्त क्रिया अगली क्रिया के साथ स्वाभाविक प्रवाह देती है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: यह हिंदी बाइबलीय परंपरा में इस व्यक्तिनाम का मानक रूप है।
- source_word: וַיְשַׁלְּחֵם
  choice: विदा किया
  rationale: संदर्भ में क्रिया का अर्थ उन्हें जाने की अनुमति देकर रवाना करना है; ‘विदा किया’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: וַיֵּלְכוּ
  choice: वे ... चले गए
  rationale: הלך की साधारण गतिवाचकता को व्यक्त करता है और गंतव्य के साथ हिंदी में स्वाभाविक है; ‘लौट गए’ अनावश्यक रूप से वापसी का अर्थ जोड़ता।
- source_word: אֶל
  choice: को
  rationale: ‘अपने तंबुओं को चले गए’ में यह गंतव्य की ओर गति को स्वाभाविक हिंदी ढंग से व्यक्त करता है।
- source_word: אָהֳלֵיהֶם
  choice: अपने तंबुओं
  rationale: मूल शब्द का प्रत्यक्ष अर्थ ‘उनके तंबू’ है। कर्ता की ओर संबंध दिखाने के लिए हिंदी में ‘अपने’ स्वाभाविक है; व्यापक अर्थ ‘घर’ संभव होने के कारण पादटिप्पणी दी गई है।
