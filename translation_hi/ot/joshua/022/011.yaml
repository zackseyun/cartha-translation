base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/011.yaml
  text: And the sons of Israel heard it said[a], “Look, the sons of Reuben and the sons of Gad and the half-tribe of Manasseh have built the altar opposite the land of Canaan, in the region of the Jordan[d][c][b], on the side of the sons of Israel.”
translation:
  language: hi
  text: इस्राएलियों ने यह खबर सुनी:[a] “देखो, रूबेन के वंशजों, गाद के वंशजों और मनश्शे के आधे गोत्र ने कनान देश के सामने,[b] यरदन के क्षेत्र में,[c] इस्राएलियों वाले पार[d] वेदी बनाई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों ने यह कहते हुए सुना”; यह इब्रानी में खबर प्रस्तुत करने का एक ढंग है।
    reason: lexical_alternative
  - marker: b
    text: “कनान देश की ओर मुख किए हुए” भी संभव है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “यरदन के क्षेत्रों/इलाकों में”; इस भौगोलिक पदबंध का ठीक आशय अनिश्चित है।
    reason: cultural_note
  - marker: d
    text: इस कठिन भौगोलिक पदबंध का अनुवाद “इस्राएलियों वाले पार” या “इस्राएलियों के सामने वाले पार” भी हो सकता है। यह इस्राएलियों के अधिकार वाले यरदन-पार की ओर संकेत कर सकता है या उनके सामने स्थित स्थान की ओर।
    reason: alternative_reading
