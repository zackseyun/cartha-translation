base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/002.yaml
  text: And Joshua sent men from Jericho to Ai[a], which is near Beth-aven, east of Bethel, and said to them, “Go up and spy out the land.” So the men went up and spied out Ai.
translation:
  language: hi
  text: तब यहोशू ने यरीहो से ऐ नगर में, जो बेत-आवेन के पास और बेतेल के पूर्व में था, पुरुष भेजे। उसने उनसे कहा, “ऊपर जाओ और उस देश की टोह लो।” तब वे पुरुष ऊपर गए और ऐ की टोह ली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजे
  rationale: सरल कथात्मक क्रिया; आधुनिक हिन्दी में स्वाभाविक और मूल क्रिया שׁלח के अर्थ के अनुरूप।
- source_word: אֲנָשִׁים
  choice: कुछ पुरुष
  rationale: इब्रानी में स्पष्ट पुल्लिंग बहुवचन है; हिन्दी में अनिश्चित समूह को स्वाभाविक बनाने के लिए ‘कुछ’ जोड़ा गया है।
- source_word: מִירִיחוֹ
  choice: यरीहो से
  rationale: मानक हिन्दी बाइबलीय स्थान-नाम और स्रोत के מִן संबंध का सीधा रूप।
- source_word: הָעַי
  choice: ऐ नगर
  rationale: ‘ऐ’ स्थान-नाम है; हिन्दी पाठक के लिए इसकी स्थान-संज्ञा स्पष्ट करने हेतु पहली बार ‘नगर’ जोड़ा गया है।
- source_word: אֲשֶׁר עִם בֵּית אָוֶן
  choice: बेत-आवेन के पास
  rationale: עִם का मूल अर्थ ‘साथ’ है, पर भौगोलिक वर्णन में निकटता व्यक्त करता है; वैकल्पिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: बेतेल के पूर्व में
  rationale: भौगोलिक स्थिति को स्पष्ट और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עֲלוּ
  choice: ऊपर जाओ
  rationale: עלה की दिशात्मक अथवा ऊँचाई की ओर गति का संकेत बनाए रखता है।
- source_word: וְרַגְּלוּ אֶת הָאָרֶץ
  choice: उस देश की टोह लो
  rationale: पिएल רגל का सैनिक जासूसी/निरीक्षण अर्थ ‘टोह लेना’ से स्वाभाविक रूप में आता है; ‘उस देश’ निर्दिष्ट क्षेत्र को दर्शाता है।
- source_word: וַיַּעֲלוּ
  choice: ऊपर गए
  rationale: आज्ञा में प्रयुक्त עלה की पुनरावृत्ति और दिशात्मकता दोनों सुरक्षित रखी गई हैं।
- source_word: וַיְרַגְּלוּ אֶת הָעָי
  choice: ऐ की टोह ली
  rationale: पहले आए רגל के साथ शब्दगत संगति रखते हुए लक्ष्य नगर को स्पष्ट करता है।
