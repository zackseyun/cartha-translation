  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ מֶ֣ה עֲכַרְתָּ֔/נוּ יַעְכֳּרְ/ךָ֥ יְהוָ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּרְגְּמ֨וּ אֹת֤/וֹ כָל יִשְׂרָאֵל֙ אֶ֔בֶן וַ/יִּשְׂרְפ֤וּ אֹתָ/ם֙ בָּ/אֵ֔שׁ וַ/יִּסְקְל֥וּ אֹתָ֖/ם בָּ/אֲבָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/025.yaml
  text: And Joshua said[a], “Why have you troubled us? Yahweh will trouble you this day.” And all Israel stoned him with stones[c][b], and they burned them with fire and stoned them with stones.
translation:
  language: hi
  text: तब यहोशू ने कहा[a], “तूने हमें संकट में क्यों डाला? याहवे आज तुझे संकट में डालेगा।” और सारे इस्राएल ने उसे पत्थरों से मार डाला[c]। उन्होंने उन्हें[b] आग में जला दिया और उन्हें पत्थरों से मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “संकट में डाला … संकट में डालेगा”—इब्रानी में दोनों स्थानों पर एक ही क्रिया प्रयुक्त हुई है; यह शब्दालंकार हिंदी में भी बनाए रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ यहाँ एकवचन “उसे” से बहुवचन “उन्हें” पर आ जाता है। इसमें आकान के साथ अन्य लोग अथवा उसका घराना और संपत्ति सम्मिलित हो सकते हैं; अनुवाद इस बदलाव को स्पष्ट किए बिना ज्यों का त्यों रखता है।
    reason: alternative_reading
  - marker: c
    text: इस पद में पत्थरों से मारने के लिए दो अलग-अलग इब्रानी क्रियाएँ आई हैं। हिंदी में दोनों को समान अभिव्यक्ति से प्रस्तुत किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתָּנוּ / יַעְכֳּרְךָ
  choice: हमें संकट में डाला / तुझे संकट में डालेगा
  rationale: एक ही इब्रानी क्रिया के दोनों प्रयोगों को समान हिंदी अभिव्यक्ति से प्रस्तुत किया गया है, ताकि यहोशू के कथन का शब्दालंकार और प्रत्युत्तरात्मक भाव बना रहे।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: בַּיּוֹם הַזֶּה
  choice: आज
  rationale: यह आधुनिक हिंदी में इब्रानी वाक्यांश की तात्कालिकता को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיִּרְגְּמוּ אֹתוֹ ... אֶבֶן
  choice: उस पर पत्थर बरसाए
  rationale: यह अभिव्यक्ति पत्थरों से किए गए सामूहिक दंड को सहज हिंदी में व्यक्त करती है और एकवचन कर्म ‘उस’ को बनाए रखती है।
- source_word: וַיִּשְׂרְפוּ אֹתָם בָּאֵשׁ
  choice: उन्होंने उन्हें आग में जला दिया
  rationale: इब्रानी के बहुवचन कर्म ‘उन्हें’ और आग के स्पष्ट उल्लेख—दोनों को सुरक्षित रखा गया है।
- source_word: וַיִּסְקְלוּ אֹתָם בָּאֲבָנִים
  choice: उन पर पत्थर बरसाए
  rationale: पत्थर मारने के लिए प्रयुक्त दूसरी इब्रानी क्रिया को स्वाभाविक हिंदी में प्रस्तुत किया गया है; बहुवचन कर्म को यथावत रखा गया है और क्रियाओं का अंतर पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: आकान के एकवचन उल्लेख के बाद बहुवचन सर्वनाम
  choice: मुख्य पाठ में ‘उस’ से ‘उन्हें/उन’ की ओर इब्रानी बदलाव को बनाए रखा गया है।
  alternative: सभी सर्वनामों को एकवचन कर देना, अथवा बहुवचन को केवल आकान की संपत्ति के अर्थ में स्पष्ट कर देना।
  rationale: मसोरा-पाठ स्वयं एकवचन से बहुवचन में बदलता है। संदर्भ में आकान के परिवार और संपत्ति दोनों उपस्थित हैं, पर पद यह स्पष्ट नहीं करता कि बहुवचन में ठीक-ठीक कौन सम्मिलित है; इसलिए इस तनाव को सुलझाए बिना सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। ‘संकट में डालना’ पुनरुक्त इब्रानी क्रिया और उसके शब्दालंकार को स्वाभाविक हिंदी में बनाए रखता है। एकवचन से बहुवचन का असामान्य परिवर्तन जानबूझकर नहीं सुधारा गया है।
