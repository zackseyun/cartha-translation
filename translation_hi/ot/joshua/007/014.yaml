base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/014.yaml
  text: In the morning you shall come near by your tribes[a], and it shall be that the tribe that Yahweh selects shall come near by clans, and the clan that Yahweh selects shall come near by households[b], and the household that Yahweh selects shall come near man by man.
translation:
  language: hi
  text: सवेरे तुम अपने-अपने गोत्रों के अनुसार निकट आना। तब जिस गोत्र को याहवे चुनेगा[a], वह अपने कुलों के अनुसार निकट आए; और जिस कुल को याहवे चुनेगा, वह अपने घरानों के अनुसार निकट आए; और जिस घराने को याहवे चुनेगा, उसके पुरुष एक-एक करके निकट आएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पकड़ेगा” अथवा “धर लेगा।” इब्रानी क्रिया का सामान्य अर्थ पकड़ना या अधिकार में लेना है; यहाँ यह उस गोत्र, कुल या घराने की ओर संकेत करती है जिसे याहवे पहचान के लिए चुनता है, संभवतः पवित्र चिट्ठी डालने के द्वारा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְרַבְתֶּם
  choice: तुम ... निकट आना
  rationale: קרב की औपचारिक रूप से सामने आने की भावना और पूरे पद में इसकी पुनरावृत्ति को बनाए रखता है; हिंदी में आज्ञार्थक भविष्य-संदर्भ स्वाभाविक है।
- source_word: לְשִׁבְטֵיכֶם
  choice: अपने-अपने गोत्रों के अनुसार
  rationale: क्रमबद्ध, समूह-दर-समूह प्रस्तुति का वितरणात्मक अर्थ स्पष्ट करता है।
- source_word: יִלְכְּדֶנּוּ / יִלְכְּדֶנָּה
  choice: चुनेगा
  rationale: לכד का मूल अर्थ पकड़ना या धर लेना है, पर इस पहचान-प्रक्रिया में आशय उस इकाई से है जिसे यहोवा संकेतित करता है; मूल रूपक को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिंदी में प्रचलित नामरूप से प्रस्तुत करता है, किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: לַמִּשְׁפָּחוֹת
  choice: अपने कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ गोत्र से छोटी और घराने से बड़ी सामाजिक इकाई है; ‘कुल’ आधुनिक हिंदी में इस स्तर के लिए उपयुक्त है।
- source_word: לַבָּתִּים
  choice: अपने घरानों के अनुसार
  rationale: בַּיִת यहाँ भवन नहीं, वंशगत घरेलू इकाई को सूचित करता है; ‘घराना’ ‘कुल’ से इसका भेद बनाए रखता है।
- source_word: לַגְּבָרִים
  choice: एक-एक पुरुष करके
  rationale: पुल्लिंग बहुवचन और वितरणात्मक संकुचन—घराने से व्यक्तिगत पुरुष तक—दोनों को स्पष्ट रखता है।
- source_word: וְהָיָה
  choice: तब
  rationale: प्रक्रिया के अगले परिणाम को आधुनिक हिंदी में स्वाभाविक ढंग से प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है; ‘यहोवा’ आधुनिक हिंदी बाइबलीय पाठकों में पहचाना जाने वाला नामरूप है और इसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: लכד द्वारा ईश्वरीय पहचान की रीति
  choice: चुनेगा
  alternative: पकड़ेगा
  rationale: संदर्भ चयन अथवा संकेत द्वारा दोषी इकाई की क्रमिक पहचान का है। पद स्वयं साधन को स्पष्ट नहीं करता, इसलिए मुख्य पाठ में ‘चुनेगा’ रखा गया और संभावित चिट्ठी-प्रक्रिया को निश्चित तथ्य नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक वाचन योग्य रखी गई है। ‘गोत्र—कुल—घराना—एक-एक पुरुष’ की क्रमिक संरचना तथा ‘निकट आना’ की पुनरावृत्ति मूल की औपचारिक प्रक्रिया को सुरक्षित रखती है।
