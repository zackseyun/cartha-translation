base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/020.yaml
  text: Achan answered Joshua and said[a], “Truly, I have sinned against Yahweh, the God of Israel, and this is what I did:”
translation:
  language: hi
  text: आकान ने यहोशू को उत्तर देकर कहा, “निश्चय ही, मैंने इस्राएल के परमेश्वर यहवे के विरुद्ध पाप किया है, और मैंने यह किया है:[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने ऐसा और ऐसा किया।” यह इब्रानी मुहावरा उसके किए हुए कामों का विवरण आरम्भ करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: उत्तर दिया
  rationale: इब्रानी कथात्मक युग्म का स्वाभाविक हिन्दी रूप; अलग से ‘और कहा’ जोड़ना आधुनिक हिन्दी में अनावश्यक और बोझिल होता।
- source_word: עָכָן
  choice: आकान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אָמְנָה
  choice: सचमुच
  rationale: यह स्वीकारोक्ति की गंभीर पुष्टि व्यक्त करता है और आधुनिक हिन्दी में सहज है।
- source_word: אָנֹכִי חָטָאתִי
  choice: मैंने ... पाप किया है
  rationale: स्वतंत्र सर्वनाम के बल को ‘मैंने’ से रखा गया है; पूर्ण क्रिया का वर्तमान परिणाम हिन्दी पूर्णकाल में स्वाभाविक रूप से व्यक्त होता है।
- source_word: לַיהוָה
  choice: यहवे के विरुद्ध
  rationale: חטא के साथ ל अपराध से प्रभावित पक्ष को सूचित करता है; हिन्दी में ‘के विरुद्ध पाप करना’ स्पष्ट और स्वाभाविक है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धवाचक पदबंध का सीधा और प्रचलित हिन्दी अनुवाद।
- source_word: וְכָזֹאת וְכָזֹאת עָשִׂיתִי
  choice: मैंने यह किया है
  rationale: यह दोहराया हुआ इब्रानी मुहावरा आगे आने वाले विवरण का परिचय देता है; शाब्दिक ‘ऐसा और ऐसा’ आधुनिक हिन्दी में असहज होगा।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; उसका लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: לַיהוָה में सम्बन्ध
  choice: यहवे के विरुद्ध
  alternative: यहवे के प्रति
  rationale: पाप की स्वीकारोक्ति में यह पूर्वसर्ग उस पक्ष को दर्शाता है जिसके विरुद्ध अपराध हुआ; हिन्दी में ‘के विरुद्ध’ अर्थ को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘यहवे’ से मूल ईश्वरीय नाम सुरक्षित है, और पद के अन्त में द्विबिंदु अगले पद में आने वाले विवरण की ओर संकेत करता है।
