base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/018.yaml
  text: Then he brought his household near man by man[a], and Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, was taken.
translation:
  language: hi
  text: तब उसने अपने घराने को एक-एक पुरुष करके आगे बुलाया[a], और यहूदा के गोत्र का आकान, कर्मी का पुत्र, जब्दी का पुत्र, जेरह का पुत्र, पकड़ा गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पुरुषों के अनुसार’; इब्रानी वाक्यांश संक्षिप्त है और सम्भवतः बताता है कि चिट्ठी डालने की प्रक्रिया के लिए घराने को उसके पुरुष सदस्यों के आधार पर आगे लाया गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: पास बुलाया
  rationale: קרב के हिफ़ील रूप का अर्थ ‘निकट लाना/प्रस्तुत करना’ है। चिट्ठी द्वारा पहचान की प्रक्रिया में ‘पास बुलाया’ स्वाभाविक हिन्दी है और निकट लाने का मूल भाव बनाए रखता है।
- source_word: בֵּיתוֹ
  choice: उसके घराने
  rationale: בַּיִת यहाँ भवन नहीं, सामाजिक पारिवारिक इकाई को सूचित करता है; ‘घराना’ इस व्यापक अर्थ को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: לַגְּבָרִים
  choice: एक-एक पुरुष करके
  rationale: यह संक्षिप्त इब्रानी वाक्यांश सम्भवतः घराने के पुरुषों को व्यक्तिगत रूप से प्रस्तुत किए जाने का संकेत देता है। यह अनुवाद प्रक्रियात्मक अर्थ और पुल्लिंग बहुवचन दोनों को सुरक्षित रखता है।
- source_word: וַיִּלָּכֵד
  choice: पकड़ा गया
  rationale: לכד के निफ़ाल का मूल अर्थ ‘पकड़ा जाना’ है। यहाँ इसका आशय चिट्ठी द्वारा पहचान लिया जाना है, पर ‘पकड़ा गया’ मूल इब्रानी मुहावरे और अनुच्छेद में दोहराए गए सूत्र को बनाए रखता है।
- source_word: עָכָן
  choice: आकान
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबिलीय लिप्यंतरण के अनुसार प्रस्तुत किया गया है।
- source_word: בֶּן כַּרְמִי בֶן זַבְדִּי בֶּן זֶרַח
  choice: कर्मी का पुत्र, जब्दी का पोता और जेरह का परपोता
  rationale: वंशक्रम को पूरा सुरक्षित रखते हुए स्वाभाविक हिन्दी संबंध-संज्ञाओं में व्यक्त किया गया है।
- source_word: לְמַטֵּה יְהוּדָה
  choice: यहूदा के गोत्र का
  rationale: जनजातीय संदर्भ में מַטֶּה का अर्थ ‘गोत्र’ है; यह हिन्दी बाइबिलीय प्रयोग में मानक और स्पष्ट है।
