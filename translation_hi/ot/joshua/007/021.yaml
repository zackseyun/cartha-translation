  text: ו/אראה בַ/שָּׁלָ֡ל אַדֶּ֣רֶת שִׁנְעָר֩ אַחַ֨ת טוֹבָ֜ה וּ/מָאתַ֧יִם שְׁקָלִ֣ים כֶּ֗סֶף וּ/לְשׁ֨וֹן זָהָ֤ב אֶחָד֙ חֲמִשִּׁ֤ים שְׁקָלִים֙ מִשְׁקָל֔/וֹ וָֽ/אֶחְמְדֵ֖/ם וָֽ/אֶקָּחֵ֑/ם וְ/הִנָּ֨/ם טְמוּנִ֥ים בָּ/אָ֛רֶץ בְּ/ת֥וֹךְ הָ/אָֽהֳלִ֖/י וְ/הַ/כֶּ֥סֶף תַּחְתֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/021.yaml
  text: I saw among the spoil one beautiful cloak from Shinar[a], two hundred shekels of silver, and one bar of gold weighing fifty shekels. I coveted them and took them, and look, they are hidden in the ground inside my tent[c][b], with the silver underneath it.
translation:
  language: hi
  text: मैंने लूट के माल में शिनार का एक सुंदर चोगा,[a] दो सौ शेकेल चाँदी और सोने की एक जीभ-जैसी डली[b] देखी, जिसका वज़न पचास शेकेल था। मैंने उनका लोभ किया और उन्हें ले लिया। देखिए, वे मेरे तंबू के भीतर ज़मीन में छिपे हैं, और चाँदी उस चोगे के नीचे है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शिनार का एक बढ़िया बाहरी वस्त्र।” हिब्रू शब्द किसी भव्य चोगे, ओढ़ने के वस्त्र या बाहरी परिधान को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “सोने की एक जीभ।” संभवतः यह जीभ के आकार की सोने की डली थी; कुछ अनुवाद इसे “सोने की छड़” या “सोने की पच्चर” कहते हैं।
    reason: lexical_alternative
  - marker: c
    text: 'हिब्रू में अंतिम सर्वनाम स्त्रीलिंग एकवचन है और संभवतः चोगे की ओर संकेत करता है: “चाँदी उसके नीचे है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַשָּׁלָל
  choice: लूट के माल में
  rationale: युद्ध में प्राप्त माल के अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट करता है और ב की स्थानवाचक भूमिका बनाए रखता है।
- source_word: אַדֶּרֶת שִׁנְעָר אַחַת טוֹבָה
  choice: शिनार का एक सुंदर चोगा
  rationale: אַדֶּרֶת एक भव्य बाहरी वस्त्र या चोगा हो सकता है; 'सुंदर चोगा' गुणवत्ता और आकर्षण दोनों व्यक्त करता है। 'शिनार का' उद्गम या शैली की मूल अस्पष्टता को स्वाभाविक हिन्दी में रहने देता है।
- source_word: וּמָאתַיִם שְׁקָלִים כֶּסֶף
  choice: दो सौ शेकेल चाँदी
  rationale: प्राचीन भार-माप को बिना अनुमानित आधुनिक रूपांतरण के सुरक्षित रखता है।
- source_word: וּלְשׁוֹן זָהָב אֶחָד
  choice: सोने की एक जीभ-जैसी डली
  rationale: לָשׁוֹן की वास्तविक आकृति-संबंधी छवि को बनाए रखते हुए हिन्दी पाठक के लिए वस्तु को समझने योग्य बनाता है; केवल 'छड़' कहना आकृति को अनावश्यक रूप से निश्चित कर देता।
- source_word: חֲמִשִּׁים שְׁקָלִים מִשְׁקָלוֹ
  choice: जिसका वज़न पचास शेकेल था
  rationale: सोने की वस्तु के भार को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וָאֶחְמְדֵם
  choice: मैंने उनका लालच किया
  rationale: חמד के प्रबल और अनुचित इच्छा वाले नैतिक भाव को साधारण 'चाहा' की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: וָאֶקָּחֵם
  choice: और उन्हें ले लिया
  rationale: לקח के सामान्य अर्थ 'लेना' को बिना अतिरिक्त बल जोड़े प्रस्तुत करता है।
- source_word: וְהִנָּם
  choice: देखिए, वे
  rationale: ध्यान आकर्षित करने वाले हिब्रू संकेतक की तत्क्षणता को आधुनिक, आदरपूर्ण हिन्दी में बनाए रखता है।
- source_word: טְמוּנִים בָּאָרֶץ
  choice: ज़मीन में छिपे हैं
  rationale: छिपाए जाने और मिट्टी के भीतर रखे होने, दोनों बातों को व्यक्त करता है, पर 'गाड़े' जैसी अतिरिक्त क्रिया-विधि को निश्चित नहीं करता।
- source_word: בְּתוֹךְ הָאֳהֳלִי
  choice: मेरे तंबू के भीतर
  rationale: तंबू के अंदर का स्थान स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: וְהַכֶּסֶף תַּחְתֶּיהָ
  choice: और चाँदी उस चोगे के नीचे है
  rationale: स्त्रीलिंग एकवचन प्रत्यय का सबसे संभावित संदर्भ चोगा है; हिन्दी में स्पष्ट संज्ञा दोहराने से अस्पष्ट सर्वनाम से बचा गया है।
