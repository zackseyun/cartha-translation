translation:
  language: hi
  text: तब लोगों में से लगभग तीन हज़ार पुरुष वहाँ चढ़ गए, पर वे ऐ के पुरुषों के सामने से भाग गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: चढ़ गए
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है। ऐ की ओर सैन्य गमन के संदर्भ में ‘चढ़ गए’ इब्रानी दिशा-सूचक भाव को बनाए रखता है, बिना क्रिया में ही आक्रमण का अर्थ जोड़ने के।
- source_word: מִן הָעָם
  choice: लोगों में से
  rationale: עם का शाब्दिक अर्थ ‘लोग/प्रजा’ है और यहाँ इस्राएलियों में से चुने गए दल का संकेत है। ‘लोगों में से’ स्रोत के निकट और स्वाभाविक है।
- source_word: שָׁמָּה
  choice: वहाँ
  rationale: यह क्रिया-विशेषण पहले बताए गए गंतव्य की ओर गति को दर्शाता है; हिंदी में ‘वहाँ’ संक्षिप्त और स्वाभाविक है।
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: लगभग तीन हज़ार पुरुष
  rationale: संख्या से पहले כִּ अनुमान का भाव देता है, इसलिए ‘लगभग’। אִישׁ यहाँ व्यक्तियों की गणना करता है; ‘पुरुष’ मूल शब्द को ‘सैनिक’ कहकर अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: וַיָּנֻסוּ
  choice: भाग गए
  rationale: נוס का अर्थ भय या पराजय के कारण ‘भागना’ है। आधुनिक हिंदी कथा में ‘भाग गए’ स्पष्ट, सहज और अर्थ-सटीक है।
- source_word: לִפְנֵי
  choice: के सामने से
  rationale: भागने की क्रिया के साथ לִפְנֵי विरोधियों की उपस्थिति से पीछे हटने का भाव देता है। ‘के सामने से’ इस संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אַנְשֵׁי הָעָי
  choice: ऐ के पुरुषों
  rationale: אַנְשֵׁי, אִישׁ का संबंध-रूप बहुवचन है और यहाँ नगर के पुरुष रक्षकों/योद्धाओं को सूचित करता है। ‘ऐ के पुरुष’ मूल की सटीकता बनाए रखता है; ‘ऐ’ स्थान-नाम का हिंदी लिप्यंतरण है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘चढ़ गए’ और ‘के सामने से भाग गए’ द्वारा इब्रानी मुहावरे का अर्थ स्वाभाविक हिंदी में सुरक्षित रखा गया है।
