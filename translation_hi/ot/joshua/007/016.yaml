  text: וַ/יַּשְׁכֵּ֤ם יְהוֹשֻׁ֨עַ֙ בַּ/בֹּ֔קֶר וַ/יַּקְרֵ֥ב אֶת יִשְׂרָאֵ֖ל לִ/שְׁבָטָ֑י/ו וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/016.yaml
  text: Joshua rose early in the morning and brought Israel near by its tribes[b][a], and the tribe of Judah was taken.
translation:
  language: hi
  text: यहोशू सुबह तड़के उठा और इस्राएल को उसके गोत्रों के अनुसार सामने लाया। तब यहूदा का गोत्र चुना गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “यहूदा का गोत्र पकड़ा गया”; यह चयन की प्रक्रिया में अलग ठहराए जाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: सवेरे जल्दी उठा
  rationale: שׁכם के हिफ़ील रूप का अर्थ जल्दी उठना है, और בַּבֹּקֶר समय को स्पष्ट करता है। यह हिंदी में स्वाभाविक रहते हुए दोनों तत्वों को व्यक्त करता है।
- source_word: וַיַּקְרֵב
  choice: सामने लाया
  rationale: קרב के हिफ़ील का मूल भाव निकट या आगे लाना है। चयन की औपचारिक प्रक्रिया के प्रसंग में ‘सामने लाया’ स्वाभाविक और पर्याप्त रूप से निकट है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल को
  rationale: मूल पाठ में वाचा-समुदाय का सामूहिक नाम है; इसलिए ‘इस्राएल’ को बनाए रखा गया है।
- source_word: לִשְׁבָטָיו
  choice: उसके गोत्रों के अनुसार
  rationale: לְ यहाँ गोत्रों के आधार पर क्रमबद्ध प्रस्तुति का संकेत देता है। यह वाक्यांश वितरणात्मक भाव को स्पष्ट और स्वाभाविक हिंदी में रखता है।
- source_word: וַיִּלָּכֵד
  choice: पकड़ा गया
  rationale: לכד के निफ़ाल का शाब्दिक अर्थ ‘पकड़ा गया’ है। यहाँ यह चयन-प्रक्रिया में किसी को अलग पहचाने जाने का मुहावरा है; शाब्दिक रूप रखने से मूल की असामान्यता और निहित प्रक्रिया दोनों सुरक्षित रहती हैं।
- source_word: שֵׁבֶט יְהוּדָה
  choice: यहूदा का गोत्र
  rationale: यह संबंधसूचक पदबंध का सीधा, मानक हिंदी रूप है।
theological_decisions:
- issue: וַיִּלָּכֵד में निहित चयन-प्रक्रिया का स्वरूप
  choice: मुख्य पाठ में ‘पकड़ा गया’ रखा गया और कर्ता या साधन नहीं जोड़ा गया।
  alternative: चुना गया; चिट्ठी द्वारा पकड़ा गया; पहचाना गया
  rationale: इस उपवाक्य में न तो ‘चिट्ठी’ का और न ही कर्ता का स्पष्ट उल्लेख है। इसलिए अनुवाद उस विवरण को नहीं जोड़ता, जबकि पादटिप्पणी प्रसंगगत मुहावरे को समझाती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण कथात्मक शैली रखी गई है। ‘गोत्र’ बाइबिलीय सामाजिक इकाई के लिए प्रचलित और सटीक शब्द है। ‘पकड़ा गया’ जानबूझकर मूल इब्रानी मुहावरे को सुरक्षित रखता है, और संभावित भ्रम को पादटिप्पणी दूर करती है।
