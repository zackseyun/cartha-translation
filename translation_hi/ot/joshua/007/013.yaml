source:
  edition: WLC
  text: קֻ֚ם קַדֵּ֣שׁ אֶת הָ/עָ֔ם וְ/אָמַרְתָּ֖ הִתְקַדְּשׁ֣וּ לְ/מָחָ֑ר כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל חֵ֤רֶם בְּ/קִרְבְּ/ךָ֙ יִשְׂרָאֵ֔ל לֹ֣א תוּכַ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֶ֔י/ךָ עַד הֲסִירְ/כֶ֥ם הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/013.yaml
  text: 'Get up[a], consecrate the people, and say, ‘Consecrate yourselves for tomorrow, for thus says Yahweh, the God of Israel: There is something devoted to destruction in your midst, Israel. You cannot stand before your enemies until you remove the thing devoted to destruction from your midst.’'
translation:
  language: hi
  text: 'उठो, लोगों को पवित्र करो और उनसे कहो, ‘कल के लिए अपने को पवित्र करो, क्योंकि इस्राएल का परमेश्वर याहवे यों कहता है: इस्राएल, तेरे बीच विनाश के लिए अर्पित वस्तु[a] है। जब तक तुम अपने बीच से उस विनाश के लिए अर्पित वस्तु को हटा नहीं देते, तब तक तुम अपने शत्रुओं के सामने टिक नहीं सकते।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू חֵרֶם (ख़ेरेम) ऐसी वस्तु को दर्शाता है जो अपरिवर्तनीय रूप से अर्पित की गई हो; यहाँ वह विनाश के लिए ठहराई गई वस्तु है। इसका अनुवाद ‘प्रतिबंध के अधीन वस्तु’ या ‘अर्पित वस्तु’ भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קֻם
  choice: उठो
  rationale: एकवचन आज्ञार्थक रूप यहोशू को तत्काल कार्रवाई करने के लिए कहता है; ‘उठो’ स्वाभाविक और तात्कालिक है।
- source_word: קַדֵּשׁ / הִתְקַדְּשׁוּ
  choice: पवित्र करो / अपने आप को पवित्र करो
  rationale: पहला पिएल आज्ञार्थक लोगों को पवित्र तैयारी के लिए अलग करने का निर्देश है, और दूसरा हित्पाएल बहुवचन उसी क्रिया का आत्मवाचक भाव बनाए रखता है।
- source_word: לְמָחָר
  choice: कल के लिए
  rationale: पूर्वसर्ग अगले दिन को ध्यान में रखकर तैयारी करने का भाव देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: חֵרֶם
  choice: विनाश के लिए अर्पित वस्तु
  rationale: यह शब्द ऐसी वस्तु को सूचित करता है जो अपरिवर्तनीय रूप से समर्पित कर दी गई हो और इस प्रसंग में विनाश के अधीन हो; यह अनुवाद दोनों भावों को स्पष्ट रखता है।
- source_word: בְּקִרְבְּךָ יִשְׂרָאֵל
  choice: हे इस्राएल, तेरे बीच
  rationale: इस्राएल को एक सामूहिक व्यक्ति के रूप में किए गए सीधे संबोधन और एकवचन प्रत्यय को सुरक्षित रखा गया है।
- source_word: לֹא תוּכַל לָקוּם לִפְנֵי אֹיְבֶיךָ
  choice: तुम अपने शत्रुओं के सामने टिक नहीं सकोगे
  rationale: यह मुहावरा शत्रुओं का सामना करने या उनके विरुद्ध ठहर पाने को व्यक्त करता है; ‘टिकना’ आधुनिक हिन्दी में इसका स्वाभाविक अर्थ देता है।
- source_word: עַד הֲסִירְכֶם
  choice: जब तक तुम ... हटा नहीं देते, तब तक
  rationale: समय-सीमा और आवश्यक शर्त दोनों को स्वाभाविक हिन्दी संरचना में व्यक्त करता है; बहुवचन प्रत्यय भी ‘तुम’ से बना रहता है।
theological_decisions:
- issue: पवित्र युद्ध और न्याय के प्रसंग में חֵרֶם का अनुवाद
  choice: विनाश के लिए अर्पित वस्तु
  alternative: प्रतिबंधित वस्तु; शापित वस्तु; अर्पित वस्तु
  rationale: मूल शब्द केवल सामान्य शाप नहीं, बल्कि अपरिवर्तनीय समर्पण को बताता है, जो इस प्रसंग में विनाश के लिए है। चुना हुआ रूप समर्पण और न्याय—दोनों को व्यक्त करता है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय उसका पारदर्शी लिप्यंतरण रखा गया है।
- issue: इस्राएल के लिए एकवचन से बहुवचन में व्याकरणिक परिवर्तन
  choice: ‘तेरे’ के बाद ‘तुम’
  alternative: पूरे वाक्य में बहुवचन ‘तुम्हारे/तुम’
  rationale: हिब्रू पहले इस्राएल को सामूहिक एकवचन के रूप में संबोधित करता है, फिर हटाने की जिम्मेदारी बताते समय बहुवचन रूप लेता है; अनुवाद इस तनाव को समतल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। ‘पवित्र करो’ दोनों संबंधित हिब्रू क्रियारूपों का शब्दगत संबंध बनाए रखता है। ‘यों कहता है’ भविष्यद्वक्तात्मक घोषणा की परिचित, किंतु अभी भी सुबोध हिन्दी शैली है।
