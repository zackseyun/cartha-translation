  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל יְהוֹשֻׁ֖עַ קֻ֣ם לָ֑/ךְ לָ֣/מָּה זֶּ֔ה אַתָּ֖ה נֹפֵ֥ל עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/010.yaml
  text: Yahweh said to Joshua[a], “Get up[b]. Why are you falling on your face?”
translation:
  language: hi
  text: तब याहवे ने यहोशू से कहा, “उठो! तुम इस तरह मुँह के बल क्यों पड़े हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब … ने … कहा
  rationale: इब्रानी कथात्मक wayyiqtol को स्वाभाविक हिन्दी कथा-प्रवाह में ‘तब … कहा’ से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय रूप।
- source_word: קֻם לָךְ
  choice: उठो
  rationale: आज्ञार्थक קֻם का सीधा और स्वाभाविक हिन्दी रूप; לָךְ यहाँ बलदायक/मुहावरेदार है और अलग अनुवाद की आवश्यकता नहीं।
- source_word: לָמָּה זֶּה
  choice: क्यों … इस तरह
  rationale: זֶּה के बल को पूरी तरह हटाने के बजाय ‘इस तरह’ में समाहित किया गया है, जिससे प्रश्न स्वाभाविक हिन्दी में रहता है।
- source_word: אַתָּה נֹפֵל
  choice: तुम … पड़े हो
  rationale: संदर्भ में participle गिरने की जारी क्रिया से अधिक यहोशू की वर्तमान औंधी अवस्था बताता है; ‘पड़े हो’ हिन्दी में उसी अवस्था को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל־פָּנֶיךָ
  choice: मुँह के बल
  rationale: साष्टांग/औंधे पड़े होने के इब्रानी मुहावरे का सहज और सटीक हिन्दी समतुल्य।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है; इसलिए उपाधि ‘प्रभु’ के बजाय हिन्दी में पहचाना जाने वाला नाम ‘यहोवा’ रखा गया है।
- issue: यहोशू की मुद्रा का अर्थ
  choice: मुँह के बल पड़े हो
  alternative: मुँह के बल गिर रहे हो
  rationale: נֹפֵל रूपतः participle है, पर प्रसंग वर्तमान दण्डवत अवस्था का है। हिन्दी में ‘गिर रहे हो’ बार-बार या इसी क्षण गिरने का भ्रामक अर्थ दे सकता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। प्रश्न में हल्की फटकार और לָמָּה זֶּה का बल ‘इस तरह’ द्वारा बचाया गया है; अनावश्यक शब्दशः कठोरता से बचा गया है।
