base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/022.yaml
  text: So Joshua sent messengers[a], and they ran to the tent; and behold, it was hidden in his tent, with the silver underneath it.
translation:
  language: hi
  text: तब यहोशू ने दूत भेजे, और वे तंबू तक दौड़े। और देखो, वह उसके तंबू में छिपी हुई थी, और चाँदी उसके नीचे थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और चाँदी उसके नीचे थी।” हिब्रू में “और चाँदी” पूर्ववर्ती खंड के साथ समन्वित है; इसे छिपी हुई वस्तु के साथ एक अतिरिक्त विवरण या अलग वाक्य के रूप में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजे
  rationale: कथात्मक संदर्भ में שׁלח का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: यहाँ मनुष्य संदेशवाहक हैं, स्वर्गदूत नहीं; ‘दूत’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: וַיָּרֻצוּ
  choice: दौड़कर ... गए
  rationale: רץ की वास्तविक दौड़ने की क्रिया और कथा की तत्परता दोनों बनी रहती हैं।
- source_word: הָאֹהֱלָה
  choice: तंबू में गए
  rationale: दिशासूचक ה गति को तंबू की ओर और प्रसंगतः उसके भीतर पहुँचने को दर्शाता है; हिन्दी में यह स्वाभाविक है।
- source_word: וְהִנֵּה
  choice: वहाँ
  rationale: हिन्दी कथा में खोज के क्षण को स्वाभाविक ढंग से सामने लाता है; ‘देखो’ की अपेक्षा यहाँ कम कृत्रिम है।
- source_word: טְמוּנָה
  choice: वह वस्तु ... छिपी हुई थी
  rationale: स्त्रीलिंग एकवचन रूप पहले पद में वर्णित ओढ़ने की वस्तु की ओर संकेत करता है; ‘वस्तु’ जोड़ने से हिन्दी में संदर्भ स्पष्ट रहता है, पर उसका प्रकार फिर से निर्धारित नहीं किया जाता।
- source_word: בְּאָהֳלוֹ
  choice: उसके तंबू में
  rationale: तीसरे पुरुष पुल्लिंग एकवचन प्रत्यय का सीधा रूप; संदर्भ में ‘उसके’ से आकान अभिप्रेत है।
- source_word: וְהַכֶּסֶף
  choice: और चाँदी
  rationale: हिब्रू के साधारण समन्वय को यथासंभव बनाए रखता है, बिना ‘साथ’ जैसे व्याख्यात्मक संबंध जोड़े।
- source_word: תַּחְתֶּיהָ
  choice: उसके नीचे
  rationale: स्त्रीलिंग एकवचन प्रत्यय पहले वर्णित छिपी वस्तु, प्रसंगतः वस्त्र, की ओर लौटता है।
