source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה לָ֠/מָה הֵעֲבַ֨רְתָּ הַעֲבִ֜יר אֶת הָ/עָ֤ם הַ/זֶּה֙ אֶת הַ/יַּרְדֵּ֔ן לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַאֲבִידֵ֑/נוּ וְ/לוּ֙ הוֹאַ֣לְנוּ וַ/נֵּ֔שֶׁב בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/007.yaml
  text: And Joshua said[a], “Ah, Lord GOD, why have you brought this people across the Jordan at all—to give us into the hand of the Amorites, to destroy us? If only we had been willing to dwell beyond the Jordan!”
translation:
  language: hi
  text: तब यहोशू ने कहा, “हाय, हे प्रभु याहवे,[a] आपने इस प्रजा को यरदन पार आखिर क्यों कराया—क्या हमें एमोरियों के हाथ में सौंपकर हमारा नाश करने के लिए? काश, हम यरदन के उस पार ही रहने को राज़ी हो गए होते!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “अदोनाय याहवे,” अर्थात् “प्रभु याहवे।”
    reason: संयुक्त दिव्य संबोधन में उपाधि ‘प्रभु’ और परमेश्वर के विशिष्ट नाम याहवे, दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: אֲהָהּ
  choice: हाय
  rationale: यह शोक और व्याकुलता की आकस्मिक पुकार है; ‘हाय’ आधुनिक हिन्दी में स्वाभाविक और गंभीर है।
- source_word: אֲדֹנָי יְהוִה
  choice: हे प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और परमेश्वर के विशिष्ट नाम יהוה को ‘यहोवा’ के रूप में रखा गया है, जिससे संयुक्त संबोधन और मूल का भेद दोनों बने रहते हैं।
- source_word: הֵעֲבַרְתָּ הַעֲבִיר
  choice: पार क्यों कराया
  rationale: हिफ़ील क्रिया के साथ infinitive absolute क्रिया पर बल देता है। प्रश्न की तीव्रता ‘क्यों कराया’ और अगले प्रयोजनसूचक प्रश्न से स्वाभाविक हिन्दी में प्रकट होती है।
- source_word: אֶת־הָעָם הַזֶּה
  choice: इस प्रजा को
  rationale: עָם यहाँ सामूहिक राष्ट्रीय समुदाय को दर्शाता है; ‘प्रजा’ हिन्दी में एकवचन सामूहिक अर्थ बनाए रखती है।
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: हमें एमोरियों के हाथ में देकर
  rationale: ‘हाथ में देना’ अधिकार और वश में सौंपने की इब्रानी उपमा को स्पष्ट और परिचित हिन्दी में सुरक्षित रखता है; एकवचन जातिनाम को सामूहिक अर्थ में बहुवचन किया गया है।
- source_word: לְהַאֲבִידֵנוּ
  choice: हमारा नाश कर दें
  rationale: क्रिया का सीधा और गंभीर अर्थ ‘नाश करना’ है; कर्ता के रूप में एमोरियों की ओर संकेत के कारण हिन्दी में बहुवचन क्रिया स्वाभाविक है।
- source_word: וְלוּ הוֹאַלְנוּ
  choice: काश, हम ... राज़ी हो गए होते
  rationale: לוּ असंभूत इच्छा व्यक्त करता है और הואל इच्छा/सहमति का भाव रखता है; ‘राज़ी हो गए होते’ संतुष्टि का अतिरिक्त भाव जोड़े बिना दोनों को व्यक्त करता है।
- source_word: וַנֵּשֶׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के उस पार ही रहने को
  rationale: इच्छासूचक रचना के अधीन ישב का अर्थ बसना/रहना है। संदर्भ में ‘उस पार’ यरदन के पूर्वी किनारे की ओर संकेत करता है और ‘ही’ वहीं रह जाने की इच्छा पर बल देता है।
theological_decisions:
- issue: संयुक्त संबोधन אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: हे प्रभु यहोवा
  alternative: हे प्रभु परमेश्वर; हे प्रभु याहवे
  rationale: मूल पाठ में सामान्य उपाधि אֲדֹנָי और विशिष्ट नाम יהוה दोनों हैं। ‘प्रभु यहोवा’ दोनों को अलग रखते हुए हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला रूप देता है; पादटिप्पणी मूल रूप स्पष्ट करती है।
- issue: यहोशू के प्रश्न को तथ्यात्मक आरोप या व्याकुल विलाप के रूप में रखना
  choice: प्रश्न और प्रयोजनसूचक वाक्य को यथावत रखा गया
  alternative: इसे विनम्र प्रार्थना या निश्चित धर्मवैज्ञानिक निष्कर्ष बनाना
  rationale: पाठ पराजय के बाद यहोशू की तीखी व्याकुलता को प्रस्तुत करता है। अनुवाद इस तनाव को शांत या सिद्धांतगत रूप से हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। ‘प्रजा,’ ‘हाथ में देना,’ और ‘नाश’ बाइबलीय गंभीरता बनाए रखते हैं, जबकि ‘राज़ी हो गए होते’ पुरातन या अस्वाभाविक शैली से बचता है।
