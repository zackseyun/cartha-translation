source:
  edition: WLC
  text: וְ/לֹ֨א יֻכְל֜וּ בְּנֵ֣י יִשְׂרָאֵ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֵי/הֶ֔ם עֹ֗רֶף יִפְנוּ֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם כִּ֥י הָי֖וּ לְ/חֵ֑רֶם לֹ֤א אוֹסִיף֙ לִֽ/הְי֣וֹת עִמָּ/כֶ֔ם אִם לֹ֥א תַשְׁמִ֛ידוּ הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/012.yaml
  text: Therefore the sons of Israel cannot stand before their enemies; they turn their backs before their enemies[a], because they have become devoted to destruction. I will no longer be with you unless you destroy the devoted thing from your midst.
translation:
  language: hi
  text: इसलिए इस्राएली अपने शत्रुओं के सामने टिक नहीं सकते; वे अपने शत्रुओं के सामने पीठ फेरते हैं, क्योंकि वे स्वयं विनाश के लिए अर्पित हो गए हैं। जब तक कि तुम अपने बीच से विनाश के लिए अर्पित वस्तु[a] को नष्ट नहीं कर देते, मैं अब से तुम्हारे साथ नहीं रहूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द חֵרֶם (खेरेम) उस वस्तु या व्यक्ति को दर्शाता है जिसे परमेश्वर के लिए अलग करके विनाश के अधीन कर दिया गया हो। कुछ पारंपरिक अनुवाद इसे “शापित वस्तु” कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर आधुनिक हिन्दी में सामूहिक जनसमुदाय के लिए ‘इस्राएली’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: יֻכְלוּ ... לָקוּם לִפְנֵי אֹיְבֵיהֶם
  choice: अपने शत्रुओं के सामने टिक नहीं सकते
  rationale: यह युद्ध-संदर्भ में शत्रुओं का सामना करते हुए डटे रहने की असमर्थता व्यक्त करता है; ‘टिकना’ हिन्दी में इस भाव को स्वाभाविक रूप से रखता है।
- source_word: עֹרֶף יִפְנוּ
  choice: वे अपने शत्रुओं को पीठ दिखाते हैं
  rationale: मूल का ‘गरदन/पीठ फेरना’ पराजय में पीछे हटने का चित्र है। इस रूप में रूपक सुरक्षित रहता है और केवल ‘भागते हैं’ कहकर उसे सपाट नहीं किया जाता।
- source_word: הָיוּ לְחֵרֶם
  choice: वे स्वयं विनाश के लिए अर्पित हो गए हैं
  rationale: חֵרֶם किसी ऐसी वस्तु या व्यक्ति की स्थिति बताता है जो परमेश्वर के लिए अलग करके विनाश के अधीन कर दिया गया हो। ‘विनाश के लिए अर्पित’ न्यायिक और धार्मिक दोनों पहलुओं को बनाए रखता है।
- source_word: לֹא אוֹסִיף לִהְיוֹת עִמָּכֶם
  choice: मैं तुम्हारे साथ आगे नहीं रहूँगा
  rationale: אוֹסִיף के साथ क्रिया का अर्थ साथ बने रहने की निरंतरता समाप्त होना है; ‘आगे नहीं’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: אִם לֹא תַשְׁמִידוּ
  choice: जब तक तुम ... नष्ट नहीं कर देते
  rationale: नकारात्मक शर्त को हिन्दी में ‘जब तक ... नहीं’ के रूप में स्वाभाविक ढंग से व्यक्त किया गया है; תַשְׁמִידוּ की निर्णायक विनाश-क्रिया बनी रहती है।
- source_word: הַחֵרֶם
  choice: विनाश के लिए अर्पित वस्तु
  rationale: सव्याख्यात्मक पद חֵרֶם के ठोस, निश्चित संदर्भ को व्यक्त करता है और पहले प्रयोग के साथ शब्दार्थ-संबंध बनाए रखता है।
- source_word: מִקִּרְבְּכֶם
  choice: अपने बीच से
  rationale: यह समुदाय के भीतर से निषिद्ध वस्तु हटाने की बात है; ‘अपने बीच से’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: חֵרֶם के स्थितिपरक और वस्तुपरक दोनों प्रयोगों का अनुवाद
  choice: पहले प्रयोग में ‘विनाश के लिए अर्पित हो गए’ और दूसरे में ‘विनाश के लिए अर्पित वस्तु’
  alternative: ‘शापित हो गए’ और ‘शापित वस्तु’
  rationale: ‘शापित’ केवल अभिशाप का भाव दे सकता है, जबकि חֵרֶם में परमेश्वर के लिए अलग किए जाने और विनाश के अधीन होने की संयुक्त धारणा है। समान पदावली दोनों प्रयोगों का संबंध बनाए रखती है, जबकि ‘वस्तु’ दूसरा प्रयोग ठोस बनाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। युद्ध-संबंधी मूल चित्र ‘पीठ दिखाते हैं’ के रूप में सुरक्षित है। חֵרֶם के लिए व्याख्यात्मक पद चुना गया है, क्योंकि हिन्दी का कोई एक सामान्य शब्द उसके धार्मिक और न्यायिक दोनों अर्थों को पूर्णतः नहीं समेटता।
