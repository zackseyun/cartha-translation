source:
  edition: WLC
  text: וַ/יִּמְעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מַ֖עַל בַּ/חֵ֑רֶם וַ/יִּקַּ֡ח עָכָ֣ן בֶּן כַּרְמִי֩ בֶן זַבְדִּ֨י בֶן זֶ֜רַח לְ/מַטֵּ֤ה יְהוּדָה֙ מִן הַ/חֵ֔רֶם וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/001.yaml
  text: But the sons of Israel acted unfaithfully regarding the things devoted to destruction[a], for Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the things devoted to destruction; so the anger of Yahweh burned against the sons of Israel.
translation:
  language: hi
  text: परन्तु इस्राएलियों ने विनाश के लिए समर्पित वस्तुओं[a] के मामले में विश्वासघात किया। यहूदा के गोत्र के आकान ने, जो कर्मी का पुत्र, जब्दी का पुत्र और जेरह का पुत्र था, उन समर्पित वस्तुओं में से कुछ ले लिया; इसलिए इस्राएलियों पर यहोवा का क्रोध भड़क उठा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अर्पित वस्तुओं।’ इब्रानी חֵרֶם उन व्यक्तियों या वस्तुओं के लिए प्रयुक्त होता है जिन्हें परमेश्वर के लिए अलग करके विनाश के अधीन किया गया हो या सामान्य मानवीय उपयोग से हटा दिया गया हो। इसे अधिक शाब्दिक रूप में ‘प्रतिबंध’ भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ ... מַעַל
  choice: विश्वासघात किया
  rationale: क्रिया और उसी मूल की संज्ञा का संयुक्त प्रयोग भरोसा अथवा वाचा तोड़ने की गंभीरता व्यक्त करता है। ‘विश्वासघात किया’ इसे स्वाभाविक और सशक्त हिन्दी में पहुँचाता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: आधुनिक हिन्दी में यह सामूहिक पहचान को स्पष्ट और सहज रूप से व्यक्त करता है; बहुवचन कर्ता बनाए रखने से एक व्यक्ति के कार्य और पूरे समुदाय की जवाबदेही के बीच मूल तनाव सुरक्षित रहता है।
- source_word: בַּחֵרֶם / מִן הַחֵרֶם
  choice: विनाश के लिए समर्पित वस्तुओं / उन समर्पित वस्तुओं में से
  rationale: חֵרֶם उन वस्तुओं को सूचित करता है जिन्हें परमेश्वर के लिए अलग करके विनाश अथवा सामान्य मानवीय उपयोग से हटाने के अधीन किया गया था। पहली अभिव्यक्ति प्रसंगगत अर्थ स्पष्ट करती है और दूसरी अनावश्यक पुनरुक्ति से बचती है।
- source_word: וַיִּקַּח ... מִן
  choice: में से कुछ ले लिया
  rationale: מִן का अंशवाचक भाव बताता है कि आकान ने उस समूहीकृत सामग्री में से कुछ लिया; ‘कुछ’ हिन्दी में इस भाव को स्वाभाविक बनाता है।
- source_word: לְמַטֵּה יְהוּדָה
  choice: यहूदा के गोत्र के
  rationale: वंशावली के इस संदर्भ में מַטֶּה का उपयुक्त और प्रचलित हिन्दी रूप ‘गोत्र’ है।
- source_word: וַיִּחַר אַף יְהוָה
  choice: यहोवा का क्रोध भड़क उठा
  rationale: यह मूल इब्रानी के जलते हुए क्रोध के सजीव रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिवाचक ईश्वरीय नाम को उपाधि से प्रतिस्थापित करने के बजाय हिन्दी बाइबलीय परंपरा में परिचित नामरूप ‘यहोवा’ रखा गया है।
theological_decisions:
- issue: एक व्यक्ति आकान के अपराध के साथ पूरे इस्राएली समुदाय का विश्वासघात और उस पर क्रोध
  choice: मुख्य वाक्य में बहुवचन सामूहिक कर्ता ‘इस्राएलियों’ को रखा और फिर आकान को व्यक्तिगत कर्ता के रूप में स्पष्ट किया।
  alternative: दोष को केवल आकान तक सीमित करना, अथवा सामूहिक कथन को अस्पष्ट एकवचन ‘इस्राएल’ में बदलना।
  rationale: इब्रानी पाठ व्यक्तिगत अपराध और सामूहिक उत्तरदायित्व को जानबूझकर साथ रखता है; अनुवाद इस धर्मवैचारिक तनाव को हल किए बिना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वंशावली का क्रम मूल पाठ के अनुसार जेरह से आकान की ओर रखा गया है। ‘परन्तु’ पिछले प्रसंग के विजय-वर्णन के साथ विरोध को प्रकट करता है।
