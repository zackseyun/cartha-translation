source:
  edition: WLC
  text: וַ/יִּקָּחוּ/ם֙ מִ/תּ֣וֹךְ הָ/אֹ֔הֶל וַ/יְבִאוּ/ם֙ אֶל יְהוֹשֻׁ֔עַ וְ/אֶ֖ל כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּצִּקֻ֖/ם לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/023.yaml
  text: They took them from inside the tent and brought them to Joshua and to all the sons of Israel[c][b][a], and they laid them out before Yahweh.
translation:
  language: hi
  text: उन्होंने उन वस्तुओं को तम्बू के भीतर से लिया और उन्हें यहोशू और समस्त इस्राएलियों के पास ले आए। फिर उन्होंने उन्हें याहवे के सामने रख दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उन्हें याहवे के सामने उंडेल दिया।” इब्रानी क्रिया का शाब्दिक अर्थ “उंडेलना” हो सकता है; यहाँ संभवतः बरामद वस्तुओं को याहवे के सामने रख देने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחוּם
  choice: उन्होंने उन वस्तुओं को लिया
  rationale: לקח का सामान्य कथात्मक अर्थ ‘लेना’ है। सर्वनाम का संदर्भ पिछले पद में मिली वस्तुओं से है, इसलिए हिन्दी में स्पष्टता के लिए ‘उन वस्तुओं’ कहा गया है।
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: तम्बू के भीतर से
  rationale: מִתּוֹךְ भीतर या बीच से निकलने का स्पष्ट स्थानिक भाव देता है; ‘तम्बू से’ की अपेक्षा ‘तम्बू के भीतर से’ अधिक सटीक है।
- source_word: וַיְבִאוּם
  choice: उन्हें ... ले आए
  rationale: בוא के हिफ़ील रूप का अर्थ ‘लाना’ है। हिन्दी कथानक में गंतव्य की ओर गति के लिए ‘ले आए’ स्वाभाविक है।
- source_word: אֶל יְהוֹשֻׁעַ וְאֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: यहोशू और इस्राएल के सभी लोगों के पास
  rationale: בני ישראל का शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे समुदाय का प्रचलित जातीय-सामुदायिक नाम है। ‘इस्राएल के सभी लोग’ आधुनिक हिन्दी में स्वाभाविक है और आशय को बिना अनावश्यक लैंगिक संकुचन के व्यक्त करता है।
- source_word: וַיַּצִּקֻם
  choice: उन्होंने उन्हें ... फैला दिया
  rationale: יצק का मूल अर्थ ‘उंडेलना’ हो सकता है, पर यहाँ बरामद वस्तुएँ कर्म हैं। ‘फैला दिया’ वस्तुओं को सबके सामने रखकर प्रदर्शित करने का प्रसंगानुकूल भाव देता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने/उपस्थिति में’ है। יְהוָה को उसके व्यक्तिगत नाम के हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में परिचित नामरूप ‘यहोवा’ नाम की प्रकृति बनाए रखता है; ‘याहवे’ संभावित उच्चारण का अधिक प्रत्यक्ष लिप्यंतरण है और ‘प्रभु’ पारंपरिक प्रतिस्थापन है।
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक अर्थ
  choice: इस्राएल के सभी लोग
  alternative: इस्राएल के सभी पुत्र; सभी इस्राएली
  rationale: इस स्थिर इब्रानी पदबंध में ‘पुत्र’ पूरे इस्राएली समुदाय को सूचित करता है। मुख्य पाठ में सामुदायिक अर्थ स्पष्ट किया गया है, न कि इसे केवल पुरुषों तक सीमित किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वस्तुओं के लिए हिन्दी में स्वाभाविक सर्वनाम-संगति अपनाई गई है। ‘तम्बू के भीतर से’ स्थानिक सूक्ष्मता बचाता है और ‘फैला दिया’ प्रसंग के दृश्य को स्पष्ट करता है।
