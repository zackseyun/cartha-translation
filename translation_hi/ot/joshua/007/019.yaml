base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/019.yaml
  text: Then Joshua said to Achan[a], “My son, please give glory to Yahweh, the God of Israel, and give thanks to him. Please tell me what you have done; do not hide it from me.”
translation:
  language: hi
  text: तब यहोशू ने आकान से कहा, “मेरे बेटे, कृपया इस्राएल के परमेश्वर याहवे को महिमा दे और उसका धन्यवाद कर[a]। कृपया मुझे बता कि तूने क्या किया है; इसे मुझसे मत छिपा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी स्तुति कर”; अथवा इस प्रसंग में संभवतः, “उसके सामने अंगीकार कर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: यह पुल्लिंग एकवचन के शाब्दिक पारिवारिक संबोधन को बनाए रखता है और यहोशू की गंभीर, किंतु आत्मीय अपील को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שִׂים נָא כָבוֹד
  choice: कृपया ... को महिमा दे
  rationale: शाब्दिक रूप से ‘महिमा रख’ वाला यह इब्रानी मुहावरा परमेश्वर की महिमा और सत्य को स्वीकार करने का आग्रह है। ‘महिमा दे’ हिन्दी बाइबलीय प्रयोग में स्पष्ट है, और ‘कृपया’ נָא की विनम्र आग्रहात्मक शक्ति दर्शाता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को लिप्यंतरित किया गया है; ל उपसर्ग यहाँ ‘को’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וְתֶן לוֹ תוֹדָה
  choice: और उसका धन्यवाद कर[a]
  rationale: תּוֹדָה धन्यवाद, स्तुति या स्वीकारोक्ति का भाव दे सकता है। मुख्य पाठ में व्यापक, परमेश्वर-उन्मुख अर्थ ‘धन्यवाद कर’ रखा गया है और न्यायिक-स्वीकारोक्तिपरक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: וְהַגֶּד נָא לִי
  choice: कृपया मुझे बता
  rationale: נגד के हिफ़ील आज्ञार्थक का सीधा अर्थ ‘बताना/घोषित करना’ है। ‘मुझे बता’ आधुनिक हिन्दी में सहज है और ‘कृपया’ נָא को दर्शाता है।
- source_word: מֶה עָשִׂיתָ
  choice: तूने क्या किया है
  rationale: पूर्ण हो चुके, किंतु वर्तमान पूछताछ से सीधे जुड़े कार्य को हिन्दी पूर्णकाल स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַל תְּכַחֵד מִמֶּנִּי
  choice: इसे मुझसे मत छिपा
  rationale: כחד का अर्थ छिपाना या गुप्त रखना है। हिन्दी में आवश्यक स्पष्टता के लिए पहले उल्लिखित कार्य को ‘इसे’ से व्यक्त किया गया है।
theological_decisions:
- issue: स्वीकारोक्ति के प्रसंग में תוֹדָה का अर्थ
  choice: मुख्य पाठ में परमेश्वर को दिया गया धन्यवाद
  alternative: उसकी स्तुति कर; अथवा उसके सामने अंगीकार कर
  rationale: प्रसंग आकान को सत्य स्वीकार करने के लिए कहता है, पर תוֹדָה का अर्थ केवल औपचारिक पाप-स्वीकार तक सीमित नहीं है। इसलिए मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी वास्तविक शब्दार्थगत तथा प्रसंगगत विकल्पों को सुरक्षित करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। ‘मेरे बेटे’ के आत्मीय संबोधन के अनुरूप एकवचन ‘तू’ और उसके आज्ञार्थक रूप रखे गए हैं; इससे अपमान नहीं, बल्कि प्राचीन पितृवत संबोधन और गंभीर व्यक्तिगत अपील व्यक्त होती है।
