base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/017.yaml
  text: Then he brought near the clan of Judah[a], and the clan of the Zerahites was taken. Then he brought near the clan of the Zerahites man by man, and Zabdi was taken.
translation:
  language: hi
  text: तब उसने यहूदा के कुल को आगे बुलाया, और जेरहियों का कुल चुना गया। फिर उसने जेरहियों के कुल के पुरुषों को एक-एक करके आगे बुलाया[a], और जब्दी चुना गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुरुषों के अनुसार।” इब्रानी वाक्यांश का आशय संभवतः यह है कि जेरहियों के कुल को उसके पुरुषों के अनुसार, एक-एक करके, आगे लाया गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: आगे बुलाया
  rationale: हिफ़ील रूप का अर्थ किसी को निकट लाना या प्रस्तुत करना है। चयन की इस सार्वजनिक प्रक्रिया में ‘आगे बुलाया’ स्वाभाविक हिंदी है और क्रिया का प्रक्रियात्मक भाव बनाए रखता है।
- source_word: מִשְׁפַּחַת
  choice: कुल
  rationale: यह शब्द यहाँ गोत्र के भीतर के वंश-समूह को दर्शाता है। ‘कुल’ आधुनिक हिंदी में इस संबंध-आधारित सामाजिक इकाई को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: इस जनजातीय और व्यक्तिगत नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: וַיִּלְכֹּד / וַיִּלָּכֵד
  choice: पकड़ा गया
  rationale: मूल निष्क्रिय क्रिया को बनाए रखता है। इस प्रसंग में इसका अर्थ युद्ध में बंदी बनाया जाना नहीं, बल्कि चयन-प्रक्रिया में पहचान लिया जाना है; फिर भी ‘पकड़ा गया’ मूल मुहावरे की तीक्ष्णता और परिणामात्मक भाव को सुरक्षित रखता है।
- source_word: הַזַּרְחִי
  choice: जेरहियों
  rationale: यह जेरह के वंशजों के लिए प्रयुक्त वंशवाचक रूप है; ‘जेरहियों’ हिंदी में उस समूह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַגְּבָרִים
  choice: पुरुषों को एक-एक करके
  rationale: शाब्दिक संरचना ‘पुरुषों के अनुसार/पुरुषों के लिए’ है, पर इस क्रमिक छँटाई के प्रसंग में इसका संभावित वितरणात्मक अर्थ प्रत्येक पुरुष को अलग-अलग प्रस्तुत करना है।
- source_word: זַבְדִּי
  choice: जब्दी
  rationale: व्यक्तिगत नाम का प्रचलित हिंदी लिप्यंतरण।
