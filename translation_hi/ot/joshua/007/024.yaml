source:
  edition: WLC
  text: וַ/יִּקַּ֣ח יְהוֹשֻׁ֣עַ אֶת עָכָ֣ן בֶּן זֶ֡רַח וְ/אֶת הַ/כֶּ֣סֶף וְ/אֶת הָ/אַדֶּ֣רֶת וְֽ/אֶת לְשׁ֣וֹן הַ/זָּהָ֡ב וְֽ/אֶת בָּנָ֡י/ו וְֽ/אֶת בְּנֹתָ֡י/ו וְ/אֶת שׁוֹר/וֹ֩ וְ/אֶת חֲמֹר֨/וֹ וְ/אֶת צֹאנ֤/וֹ וְ/אֶֽת אָהֳל/וֹ֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/כָל יִשְׂרָאֵ֖ל עִמּ֑/וֹ וַ/יַּעֲל֥וּ אֹתָ֖/ם עֵ֥מֶק עָכֽוֹר־־־־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/024.yaml
  text: Then Joshua took Achan son of Zerah[a], and the silver, the cloak, the bar of gold, his sons, his daughters, his ox, his donkey, his flock, his tent[b], and all that belonged to him—and all Israel with him—and they brought them up to the Valley of Achor.
translation:
  language: hi
  text: तब यहोशू ने जेरह के पुत्र आकान को, चाँदी, चोगा, सोने का जीभ के आकार का टुकड़ा[a], उसके पुत्रों और पुत्रियों, उसके बैल, उसके गधे, उसकी भेड़-बकरियों, उसके तंबू और जो कुछ उसका था, इन सबको लिया; और सारा इस्राएल उसके साथ था। वे उन सबको आकोर की घाटी में ऊपर ले गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “सोने की जीभ,” अर्थात जीभ के आकार का सोने का टुकड़ा; परंपरागत अनुवाद “सोने की कील” या “सोने का पच्चर” है।
    reason: lexical_alternative
  - marker: b
    text: “आकोर” नाम की ध्वनि उस इब्रानी शब्द से मिलती है जिसका अर्थ “संकट” या “विपत्ति” है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: तब यहोशू ने ... लिया
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम को स्वाभाविक हिन्दी में व्यक्त करता है। לקח का सामान्य अर्थ ‘लेना’ है, इसलिए अनावश्यक बलसूचक अर्थ नहीं जोड़ा गया।
- source_word: עָכָן בֶּן זֶרַח
  choice: जेरह के पुत्र आकान
  rationale: पितृनाम-संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है तथा नामों का प्रचलित बाइबिलीय लिप्यंतरण अपनाया गया है।
- source_word: הַכֶּסֶף
  choice: चाँदी
  rationale: כֶּסֶף का यहाँ प्रत्यक्ष अर्थ ‘चाँदी’ है; ‘धन’ या ‘सिक्के’ कहना मूल से अधिक विशिष्ट या व्याख्यात्मक होता।
- source_word: הָאַדֶּרֶת
  choice: चोगा
  rationale: אַדֶּרֶת एक विशिष्ट बाहरी वस्त्र को दर्शाता है। ‘चोगा’ आधुनिक हिन्दी में संक्षिप्त, बोधगम्य और प्रसंगानुकूल है।
- source_word: לְשׁוֹן הַזָּהָב
  choice: सोने की जीभ के आकार की डली
  rationale: לָשׁוֹן का शाब्दिक अर्थ ‘जीभ’ है और यहाँ वह वस्तु के आकार को सूचित करता है। ‘डली’ वस्तु को स्वाभाविक हिन्दी में बताती है, जबकि आकार की मूल छवि भी सुरक्षित रहती है।
- source_word: בָּנָיו ... בְּנֹתָיו
  choice: उसके बेटे-बेटियों
  rationale: मूल पाठ पुत्रों और पुत्रियों दोनों का स्पष्ट उल्लेख करता है; संयुक्त हिन्दी रूप उसी विशिष्टता को संक्षेप में बनाए रखता है।
- source_word: שׁוֹרוֹ ... חֲמֹרוֹ ... צֹאנוֹ
  choice: उसके बैल, गधे, भेड़-बकरियों
  rationale: שור और חמור के एकवचन को रखा गया है। צאן छोटे पालतू पशुओं का सामूहिक शब्द है, इसलिए ‘भेड़-बकरियाँ’ हिन्दी में उसका स्वाभाविक समतुल्य है।
- source_word: אָהֳלוֹ
  choice: उसका तंबू
  rationale: यह शब्द सीधे ‘तंबू’ को दर्शाता है; किसी अतिरिक्त व्याख्या की आवश्यकता नहीं है।
- source_word: כָּל אֲשֶׁר לוֹ
  choice: उसकी सारी संपत्ति
  rationale: यह पदबंध आकान की समस्त वस्तुओं का सार देता है। ‘सारी संपत्ति’ हिन्दी में संक्षिप्त और अर्थ-सटीक है।
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: सारा इस्राएल भी यहोशू के साथ था
  rationale: यहाँ प्रत्यय का स्वाभाविक संदर्भ कर्ता यहोशू है। नाम दोहराने से हिन्दी में यह भ्रम दूर होता है कि इस्राएल आकान के साथ था।
- source_word: וַיַּעֲלוּ אֹתָם עֵמֶק עָכוֹר
  choice: वे उन सबको आकोर की घाटी में ले गए
  rationale: क्रिया में ऊपर ले जाने का भाव हो सकता है, पर गंतव्य के साथ हिन्दी में ‘ले गए’ अधिक स्वाभाविक है और कथा की गति को स्पष्ट रखता है।
theological_decisions:
- issue: आकान के परिवार के दोषी या निर्दोष होने का संकेत
  choice: पुत्रों और पुत्रियों का उल्लेख बिना किसी व्याख्यात्मक टिप्पणी के रखा गया
  alternative: उन्हें सहभागी, दोषी अथवा निर्दोष बताने वाली टिप्पणी जोड़ना
  rationale: यह पद केवल बताता है कि वे साथ ले जाए गए; यह उनके ज्ञान, सहभागिता या दोष की सीमा स्पष्ट नहीं करता। इसलिए अनुवाद उस धार्मिक और नैतिक तनाव को अनिर्णीत रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। लंबी इब्रानी सूची को स्वाभाविक हिन्दी कारक-सामंजस्य के साथ प्रस्तुत किया गया है। ‘जेरह,’ ‘आकान,’ ‘इस्राएल’ और ‘आकोर’ के प्रचलित बाइबिलीय रूप अपनाए गए हैं।
