base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/026.yaml
  text: And they raised over him a large heap of stones to this day[a], and Yahweh turned from the burning of his anger. Therefore the name of that place has been called the Valley of Achor to this day.
translation:
  language: hi
  text: उन्होंने उसके ऊपर पत्थरों का एक बड़ा ढेर खड़ा कर दिया, जो आज तक है। तब याहवे अपने भड़के हुए क्रोध से फिर गया। इसी कारण उस स्थान का नाम आज तक आकोर की घाटी[a] कहलाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आकोर’ नाम इब्रानी शब्द ‘विपत्ति’ या ‘संकट’ से मिलता-जुलता है; यहोशू 7:25 देखें।
    reason: स्थान-नाम ‘आकोर’ और इब्रानी शब्द-क्रीड़ा के अर्थ-संबंध को स्पष्ट करता है, बिना स्थान-नाम का अनुवाद किए।
lexical_decisions:
- source_word: וַיָּקִימוּ עָלָיו גַּל אֲבָנִים גָּדוֹל
  choice: उन्होंने उसके ऊपर पत्थरों का एक बड़ा ढेर खड़ा कर दिया
  rationale: हिफ़िल וַיָּקִימוּ का कारणवाचक भाव ‘खड़ा कर दिया’ से व्यक्त होता है; עָלָיו को ‘उसके ऊपर’ और גַּל אֲבָנִים גָּדוֹל को स्वाभाविक आधुनिक हिन्दी में ‘पत्थरों का एक बड़ा ढेर’ कहा गया है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: जो आज तक है / आज तक
  rationale: पहले प्रयोग में हिन्दी की स्पष्टता के लिए निहित स्थायित्व को ‘जो आज तक है’ से व्यक्त किया गया है; दूसरे में नाम के लगातार प्रचलन के साथ सीधा ‘आज तक’ स्वाभाविक है।
- source_word: וַיָּשָׁב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: तब यहोवा का भड़का हुआ क्रोध शांत हो गया
  rationale: शाब्दिक चित्र ‘अपने क्रोध की जलन से फिरा’ हिन्दी में अस्वाभाविक है। यह वाक्यांश क्रोध के निवृत्त होने का अर्थ स्पष्ट और गरिमापूर्ण ढंग से देता है, जबकि दैवी क्रोध को नरम नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय सुरक्षित रखता है।
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: नामकरण और पूर्ववर्ती घटना के बीच स्पष्ट कारणात्मक संबंध व्यक्त करता है।
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: उस स्थान का नाम ... कहलाता है
  rationale: अनिर्दिष्ट एकवचन कर्ता वाले इब्रानी नामकरण-सूत्र को हिन्दी में स्वाभाविक वर्तमान परिणामसूचक रूप दिया गया है।
- source_word: עֵמֶק עָכוֹר
  choice: आकोर की घाटी
  rationale: स्थान-नाम को लिप्यंतरित रखा गया है; עכר के साथ अर्थ-संबंध और शब्द-क्रीड़ा को पादटिप्पणी में समझाया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत नाम है; इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: מֵחֲרוֹן אַפּוֹ में दैवी क्रोध
  choice: यहोवा का भड़का हुआ क्रोध शांत हो गया
  alternative: यहोवा अपने क्रोध की जलन से फिर गया
  rationale: चुना हुआ पाठ इब्रानी मुहावरे का आशय स्वाभाविक हिन्दी में देता है और क्रोध की वास्तविकता बनाए रखता है; अत्यधिक शाब्दिक विकल्प हिन्दी में अस्पष्ट और असहज होता।
- issue: पत्थरों के ढेर के बने रहने का संकेत
  choice: जो आज तक है
  alternative: आज तक
  rationale: मूल वाक्यरचना संक्षिप्त है और ‘आज तक’ ढेर के निरंतर अस्तित्व को सूचित करती है। हिन्दी में संबंधवाचक उपवाक्य उस संकेत को स्पष्ट करता है, बिना घटना में नया धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘पत्थरों का बड़ा ढेर’, ‘भड़का हुआ क्रोध’ और ‘इसी कारण’ सामान्य पाठक के लिए सहज हैं। स्थान-नाम ‘आकोर’ को अनूदित करने के बजाय सुरक्षित रखा गया है और अर्थ पादटिप्पणी में दिया गया है।
