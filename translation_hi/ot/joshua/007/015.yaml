  text: וְ/הָיָה֙ הַ/נִּלְכָּ֣ד בַּ/חֵ֔רֶם יִשָּׂרֵ֣ף בָּ/אֵ֔שׁ אֹת֖/וֹ וְ/אֶת כָּל אֲשֶׁר ל֑/וֹ כִּ֤י עָבַר֙ אֶת בְּרִ֣ית יְהוָ֔ה וְ/כִֽי עָשָׂ֥ה נְבָלָ֖ה בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/015.yaml
  text: And the one who is taken with the devoted thing shall be burned with fire[a], he and all that belongs to him, because he has transgressed the covenant of Yahweh and because he has done an outrageous thing in Israel.
translation:
  language: hi
  text: और जो व्यक्ति विनाश के लिए अर्पित वस्तु के साथ पकड़ा जाएगा, उसे और जो कुछ उसका है, उन सबको आग से जला दिया जाएगा[a], क्योंकि उसने यहोवा की वाचा का उल्लंघन किया है और इस्राएल में घोर निंदनीय काम किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, परंपरागत रूप से, “श्रापित वस्तु।” हिब्रू ख़ेरेम उस वस्तु को दर्शाता है जिसे सामान्य उपयोग से अलग करके परमेश्वर को अर्पित किया गया और विनाश के लिए ठहराया गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּלְכָּד
  choice: जो व्यक्ति ... पकड़ा जाए
  rationale: לכד के निष्क्रिय कृदंत को न्यायिक पहचान की प्रक्रिया के संदर्भ में रखा गया है; यह युद्ध में बंदी बनाए जाने का अर्थ नहीं देता।
- source_word: בַּחֵרֶם
  choice: अर्पित-विनाश की वस्तु के साथ
  rationale: חֵרֶם ऐसी वस्तु है जो सामान्य उपयोग से अलग करके परमेश्वर को अर्पित और विनाश के लिए निर्धारित थी। संयुक्त पद इस दोहरे भाव को संक्षेप में सुरक्षित रखता है।
- source_word: יִשָּׂרֵף בָּאֵשׁ
  choice: आग में जला दिया जाए
  rationale: हिब्रू के निष्क्रिय विधान और अग्नि द्वारा दंड, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֹתוֹ וְאֶת כָּל אֲשֶׁר לוֹ
  choice: उसे और उसकी सारी संपत्ति को
  rationale: वाक्यांश दोषी व्यक्ति तथा उसकी सभी वस्तुओं को सम्मिलित करता है। 'संपत्ति' अनावश्यक रूप से परिवारजनों को स्पष्टतः शामिल किए बिना अधिकार की वस्तुओं को दर्शाती है।
- source_word: עָבַר אֶת בְּרִית יְהוָה
  choice: यहोवा की वाचा का उल्लंघन किया है
  rationale: עבר यहाँ वाचा की निर्धारित सीमा तोड़ने का कानूनी-वाचागत भाव रखता है; 'उल्लंघन' आधुनिक हिन्दी में स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से रखा गया है।
- source_word: נְבָלָה
  choice: घोर अपमानजनक काम
  rationale: यह शब्द केवल मूर्खता नहीं, बल्कि समुदाय में नैतिक आक्रोश और कलंक उत्पन्न करने वाले कृत्य को व्यक्त करता है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: पूर्वसर्ग को वाचा-समुदाय के भीतर किए गए अपराध के स्थान-सूचक अर्थ में सीधे प्रस्तुत किया गया है।
theological_decisions:
- issue: חֵרֶם का वाचा-संबंधी न्याय के प्रसंग में अनुवाद
  choice: अर्पित-विनाश की वस्तु
  alternative: श्रापित वस्तु; विनाश के लिए अर्पित वस्तु; प्रतिबंधित वस्तु
  rationale: मूल शब्द में परमेश्वर के लिए अलग किए जाने और इस प्रसंग में विनाश के अधीन होने, दोनों का भाव है। मुख्य पाठ दोनों को सुरक्षित रखता है; पारंपरिक विकल्प पादटिप्पणी में दिया गया है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: हिन्दी पाठकों के लिए परिचित व्यक्तिगत नाम रखा गया है और उसे उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: אֹתוֹ וְאֶת כָּל אֲשֶׁר לוֹ की सीमा
  choice: उसे और उसकी सारी संपत्ति को
  alternative: उसे और जो कुछ उसका है, उस सबको
  rationale: मूल की व्यापकता को बनाए रखते हुए हिन्दी में परिवारजनों को निश्चित रूप से शामिल करने की व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। 'अर्पित-विनाश' कुछ असामान्य होते हुए भी חֵרֶם की वास्तविक द्विअर्थी धार्मिक-न्यायिक धारणा को संक्षेप में बचाता है; पादटिप्पणी इसे स्पष्ट करती है।
