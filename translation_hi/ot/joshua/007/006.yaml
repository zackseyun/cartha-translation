id: JOS.7.6
reference: Joshua 7:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְרַ֨ע יְהוֹשֻׁ֜עַ שִׂמְלֹתָ֗י/ו וַ/יִּפֹּל֩ עַל פָּנָ֨י/ו אַ֜רְצָ/ה לִ/פְנֵ֨י אֲר֤וֹן יְהוָה֙ עַד הָ/עֶ֔רֶב ה֖וּא וְ/זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲל֥וּ עָפָ֖ר עַל רֹאשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/006.yaml
  text: Then Joshua tore his clothes and fell facedown to the ground before the ark of Yahweh until evening[a], he and the elders of Israel[b], and they put dust on their heads.
translation:
  language: hi
  text: 'तब यहोशू ने अपने कपड़े फाड़े और भूमि पर मुँह के बल गिर पड़ा। वह और इस्राएल के बुज़ुर्ग शाम तक याहवे के संदूक के सामने पड़े रहे। फिर उन्होंने अपने सिरों पर धूल डाली।[a]


    [a] सिर पर धूल डालना शोक, दीनता या गहरे दुःख का प्रचलित संकेत था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सिर पर धूल डालना शोक, दीनता या गहरे दुःख का प्रचलित संकेत था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרַע ... שִׂמְלֹתָיו
  choice: अपने कपड़े फाड़े
  rationale: शोक और संकट के प्रसंग में קרע के साथ שִׂמְלָה वस्त्र फाड़ने की ठोस क्रिया बताता है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וַיִּפֹּל עַל־פָּנָיו אַרְצָה
  choice: भूमि पर मुँह के बल गिर पड़ा
  rationale: इब्रानी मुहावरा पूर्ण दण्डवत मुद्रा की शारीरिकता व्यक्त करता है; हिन्दी में यह उसी आसन को सहज रूप से बताता है।
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: याहवे के संदूक के सामने
  rationale: לִפְנֵי का अर्थ ‘सामने/उपस्थिति में’ और אֲרוֹן का अर्थ यहाँ पवित्र संदूक है; ‘वाचा’ शब्द मूल पद में न होने के कारण नहीं जोड़ा गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित निकट लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: עַד הָעֶרֶב הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: वह और इस्राएल के बुज़ुर्ग शाम तक ... पड़े रहे
  rationale: हिब्रू में एकवचन क्रिया के बाद ‘वह और इस्राएल के बुज़ुर्ग’ आता है। हिन्दी वाक्य इसे साझा, देर तक बनी रही दण्डवत मुद्रा के रूप में स्पष्ट करता है, बिना यह दावा किए कि आरम्भ की हर एकवचन क्रिया बुज़ुर्गों ने भी की।
- source_word: וַיַּעֲלוּ עָפָר עַל־רֹאשָׁם
  choice: उन्होंने अपने सिरों पर धूल डाली
  rationale: शाब्दिक रूप से धूल को सिर पर चढ़ाने की क्रिया है; ‘धूल डाली’ आधुनिक हिन्दी में इस शोक-संकेत का स्वाभाविक वर्णन है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: एकवचन क्रियाओं और ‘वह तथा इस्राएल के बुज़ुर्ग’ का संबंध
  choice: कपड़े फाड़ना और गिरना यहोशू की एकवचन क्रियाएँ; शाम तक पड़े रहना यहोशू और बुज़ुर्गों की साझा अवस्था
  alternative: सभी आरम्भिक क्रियाओं को यहोशू और बुज़ुर्गों पर समान रूप से लागू करना
  rationale: इब्रानी क्रम और क्रिया-वचन यहोशू को आरम्भिक क्रियाओं का स्पष्ट कर्ता बनाते हैं, जबकि बाद का הוּא וְזִקְנֵי יִשְׂרָאֵל बुज़ुर्गों को उस दण्डवत अवस्था में उसके साथ जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बुज़ुर्ग’ ने זִקְנֵי का सामुदायिक-नेतृत्व वाला अर्थ संदर्भ में बनाए रखा है। अंग्रेज़ी परामर्श-पाठ की पहली वैकल्पिक-पाठ टिप्पणी मूल इब्रानी में किसी वास्तविक पाठांतर या स्पष्ट वैकल्पिक अर्थ से समर्थित नहीं थी, इसलिए उसे हिन्दी पाठ में नहीं दोहराया गया।
