source:
  edition: WLC
  text: חָטָא֙ יִשְׂרָאֵ֔ל וְ/גַם֙ עָבְר֣וּ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי אוֹתָ֑/ם וְ/גַ֤ם לָֽקְחוּ֙ מִן הַ/חֵ֔רֶם וְ/גַ֤ם גָּֽנְבוּ֙ וְ/גַ֣ם כִּֽחֲשׁ֔וּ וְ/גַ֖ם שָׂ֥מוּ בִ/כְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/011.yaml
  text: Israel has sinned[a]. They have also transgressed my covenant that I commanded them, and they have also taken some of what was devoted to destruction, and they have also stolen, and they have also deceived[c][b], and they have also put it among their own belongings.
translation:
  language: hi
  text: इस्राएल ने पाप किया है। उन्होंने मेरी उस वाचा का भी उल्लंघन किया है, जिसे मैंने उन्हें मानने की आज्ञा दी थी। उन्होंने विनाश के लिए समर्पित वस्तुओं[a] में से कुछ ले भी लिया है, चोरी भी की है, झूठ भी बोला है[b], और उन्हें अपने सामान[c] में रख भी लिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “समर्पित वस्तुओं में से” या “प्रतिबंध के अधीन वस्तुओं में से।”
    reason: חֵרֶם के समर्पण, प्रतिबंध और विनाश से जुड़े अर्थ-क्षेत्र को सुरक्षित रखना।
  - marker: b
    text: या “छल भी किया है” अथवा “इससे मुकर भी गए हैं।”
    reason: כִּחֲשׁוּ झूठ बोलने, छल करने या किसी बात से मुकरने का भाव दे सकता है।
  - marker: c
    text: इब्रानी में “अपने पात्रों/वस्तुओं के बीच”; यहाँ आशय उन्हें अपनी निजी चीज़ों में रखने से है।
    reason: כְּלִים व्यापक शब्द है, जिसका अर्थ पात्र, वस्तुएँ, उपकरण या सामान हो सकता है।
lexical_decisions:
- source_word: חָטָא
  choice: पाप किया है
  rationale: यह परमेश्वर के विरुद्ध पाप करने का सीधा और धर्मवैचारिक भार रखने वाला स्वाभाविक हिन्दी अनुवाद है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ सामूहिक रूप से इस्राएल को कर्ता ठहराता है; इसलिए आकान तक कथन को सीमित नहीं किया गया।
- source_word: עָבְרוּ אֶת־בְּרִיתִי
  choice: मेरी उस वाचा का भी उल्लंघन किया है
  rationale: वाचा की सीमा लाँघने अथवा उसे भंग करने का भाव रखते हुए ‘उल्लंघन’ औपचारिकता और सहज बोध के बीच संतुलन बनाता है।
- source_word: אֲשֶׁר צִוִּיתִי אוֹתָם
  choice: जिसकी आज्ञा मैंने उन्हें दी थी
  rationale: मूल में कही गई आज्ञा को स्पष्ट रखा गया है और ‘पालन करने’ जैसे निहित, परंतु अव्यक्त, शब्द नहीं जोड़े गए।
- source_word: לָקְחוּ מִן־הַחֵרֶם
  choice: विनाश के लिए समर्पित वस्तुओं में से कुछ ले भी लिया है
  rationale: इस प्रसंग में חֵרֶם ऐसी वस्तुओं को सूचित करता है जो परमेश्वर के लिए अलग करके विनाश के अधीन थीं। मुख्य पाठ अर्थ स्पष्ट करता है और अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: גָּנְבוּ
  choice: चोरी भी की है
  rationale: क्रिया का सीधा अर्थ सुरक्षित है और ‘भी’ आरोपों की क्रमिक पुनरावृत्ति को दर्शाता है।
- source_word: כִּחֲשׁוּ
  choice: झूठ भी बोला है
  rationale: यह न्यायिक और नैतिक प्रसंग में स्पष्ट, संक्षिप्त हिन्दी है; मूल क्रिया में छल करने या मुकरने की संभावित व्यापकता पादटिप्पणी में दी गई है।
- source_word: שָׂמוּ בִכְלֵיהֶם
  choice: उन्हें अपने सामान में रख भी लिया है
  rationale: כְּלִים का अर्थ बर्तन, वस्तुएँ, उपकरण या सामान हो सकता है। यहाँ निषिद्ध वस्तुओं को निजी सामान में रखने का प्रसंग है, इसलिए ‘सामान’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: וְגַם ... וְגַם ... וְגַם
  choice: भी ... भी ... भी
  rationale: बार-बार आए גַם की आरोपों को एकत्र और तीव्र करने वाली शैली को हिन्दी में ‘भी’ की पुनरावृत्ति से सुरक्षित रखा गया है।
theological_decisions:
- issue: एक व्यक्ति के अपराध के बावजूद दोष का सामूहिक रूप से इस्राएल पर आरोपित होना
  choice: ‘इस्राएल’ को सामूहिक कर्ता और आगे बहुवचन ‘उन्होंने’ के रूप में रखा गया है।
  alternative: कथन को केवल आकान के व्यक्तिगत अपराध के रूप में अनूदित करना।
  rationale: इब्रानी पाठ स्पष्ट रूप से इस्राएल को कर्ता बताकर आगे बहुवचन क्रियाएँ प्रयोग करता है। अनुवाद इस वाचागत सामूहिकता के तनाव को किसी व्यक्तिवादी व्याख्या से समाप्त नहीं करता।
- issue: חֵרֶם का स्वरूप
  choice: विनाश के लिए समर्पित वस्तुएँ
  alternative: अर्पित वस्तुएँ; प्रतिबंध के अधीन वस्तुएँ
  rationale: यहोशू 7 के प्रसंग में वस्तुएँ परमेश्वर के अधिकार में अलग की गई और विनाश के अधीन हैं। अनुवाद समर्पण और विनाश दोनों पक्षों को साथ रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट वाक्य-विन्यास रखा गया है। ‘वाचा’, ‘पाप’ और ‘उल्लंघन’ जैसे परिचित बाइबलीय शब्द मूल के धर्मवैचारिक और वाचागत भार को सुरक्षित रखते हैं। ‘भी’ की पुनरावृत्ति इब्रानी आरोप-सूची की लय और तीव्रता को बनाए रखती है।
