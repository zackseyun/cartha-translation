  naturalness: The revised wording is natural, modern Hindi while retaining a prayerful, respectful register.
  terminology: ‘प्रभु’ is an appropriate rendering of אֲדֹנָי. ‘पीठ फेर ली है’ communicates the Hebrew idiom without overtranslating it; the note supplies the defeat/retreat implication.
  issues:
