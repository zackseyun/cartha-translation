    issue: The temporal expression אַחֲרֵי אֲשֶׁר is rendered ‘जब’.
    rationale: ‘जब’ means ‘when,’ whereas the source specifically frames the question as arising after Israel has turned its back. ‘के ... के बाद’ preserves that relation.
  - severity: medium
    issue: ‘भागा है’ adds an explicit action beyond the source idiom.
    rationale: The Hebrew says literally that Israel ‘turned back/neck’ before its enemies. It idiomatically implies retreat in defeat, but does not explicitly say ‘fled’; this implication belongs in the footnote.
  - severity: low
    issue: The entreating force of בִּי is absent from the text.
    rationale: ‘हे’ marks address but does not convey the particle’s plea. ‘कृपा करके’ safely represents its entreating function.
