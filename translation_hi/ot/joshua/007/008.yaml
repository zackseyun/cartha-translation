id: JOS.7.8
reference: Joshua 7:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בִּ֖י אֲדֹנָ֑/י מָ֣ה אֹמַ֔ר אַ֠חֲרֵי אֲשֶׁ֨ר הָפַ֧ךְ יִשְׂרָאֵ֛ל עֹ֖רֶף לִ/פְנֵ֥י אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/008.yaml
  text: Please[a], Lord[b], what can I say after Israel has turned its back before its enemies?
translation:
  language: hi
  text: कृपा करके[a], प्रभु, इस्राएल के अपने शत्रुओं के सामने पीठ फेर लेने के बाद मैं क्या कहूँ[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में विनती या व्याकुल पुकार व्यक्त करने वाला शब्द है; इसका अनुवाद “हाय” या “ओ” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “इस्राएल के अपने शत्रुओं के सामने गरदन/पीठ फेर लेने के बाद।” यह पराजित होकर पीछे हटने का हिब्रू मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: בִּי
  choice: हे
  rationale: यहाँ यह किसी श्रेष्ठ व्यक्ति के सामने विनती या व्याकुल पुकार का सूचक है। संबोधन के साथ ‘हे’ आधुनिक हिन्दी में स्वाभाविक है; इसकी विनतीपूर्ण छाया को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त आदरसूचक उपाधि है। ‘प्रभु’ हिन्दी बाइबिलीय और सामान्य धार्मिक प्रयोग में स्वाभाविक है तथा यहाँ अनुपस्थित वाचा-नाम को पाठ में नहीं लाता।
- source_word: מָה אֹמַר
  choice: मैं क्या कहूँ
  rationale: हिब्रू अपूर्ण क्रिया संदर्भ में व्याकुलता और असमर्थता से भरा प्रश्न व्यक्त करती है। ‘मैं क्या कहूँ’ उसके अर्थ और अलंकारिक तनाव दोनों को बनाए रखता है।
- source_word: אַחֲרֵי אֲשֶׁר
  choice: जब
  rationale: यह पदबंध उस परिस्थिति को सामने रखता है जिसके कारण यह प्रश्न उठता है। हिन्दी में ‘जब’ संबंध को सहज रूप से व्यक्त करता है, जबकि मूल का आशय ‘इसके बाद कि/अब जबकि’ भी हो सकता है।
- source_word: הָפַךְ עֹרֶף
  choice: पीठ फेरकर भागा है
  rationale: शाब्दिक रूप से यह ‘गरदन/पीठ फेरना’ है और युद्ध के प्रसंग में पराजित होकर पीछे हटने का मुहावरा है। हिन्दी वाक्यांश मुहावरे का आशय स्पष्ट करता है।
- source_word: לִפְנֵי אֹיְבָיו
  choice: अपने शत्रुओं के सामने
  rationale: ‘सामने’ युद्ध में शत्रुओं के सम्मुख होने का संबंध सुरक्षित रखता है। एकवचन पुल्लिंग प्रत्यय सामूहिक संज्ञा ‘इस्राएल’ की ओर संकेत करता है, इसलिए हिन्दी में ‘अपने’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: मेरे प्रभु
  rationale: यह रूप परमेश्वर को सीधे संबोधित करने वाली आदरसूचक उपाधि है। ‘प्रभु’ उसके स्थापित कार्य को व्यक्त करता है; ‘मेरे प्रभु’ रूपात्मक पक्ष को अधिक स्पष्ट करता, पर यहाँ निजी स्वामित्व पर अनावश्यक बल डाल सकता है।
- issue: इस्राएल के पीछे हटने का वर्णन
  choice: पीठ फेरकर भागा है
  alternative: पीठ फेर ली है
  rationale: सैन्य पराजय का आशय संदर्भ और हिब्रू मुहावरे में निहित है। ‘भागा है’ इसे पाठक के लिए स्पष्ट करता है, बिना इस घटना के धार्मिक कारण या दोष को इस पद में जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, सरल और प्रार्थनापूर्ण रखी गई है। ‘हे प्रभु’ गरिमापूर्ण सीधा संबोधन है, और ‘पीठ फेरकर भागा है’ युद्ध-संदर्भ के मुहावरे को सामान्य पाठक के लिए स्पष्ट करता है।
