id: JOS.7.9
reference: Joshua 7:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יִשְׁמְע֣וּ הַֽ/כְּנַעֲנִ֗י וְ/כֹל֙ יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נָסַ֣בּוּ עָלֵ֔י/נוּ וְ/הִכְרִ֥יתוּ אֶת שְׁמֵ֖/נוּ מִן הָ/אָ֑רֶץ וּ/מַֽה תַּעֲשֵׂ֖ה לְ/שִׁמְ/ךָ֥ הַ/גָּדֽוֹל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/009.yaml
  text: For the Canaanites and all the inhabitants of the land will hear[a], and they will surround us and cut off our name from the earth[b]. And what will you do for your great name?
translation:
  language: hi
  text: कनानी और इस देश के सभी निवासी यह सुनेंगे; वे हमें चारों ओर से घेर लेंगे और धरती पर से हमारा नाम मिटा देंगे।[a] तब आप अपने महान नाम के लिए क्या करेंगे?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हमारा नाम मिटा देंगे’ एक इब्रानी मुहावरा है, जिसका अर्थ किसी जाति के अस्तित्व और उसकी स्मृति को पूरी तरह समाप्त कर देना है।
    reason: cultural_note
  - marker: b
    text: या, “तब आप अपने महान नाम की प्रतिष्ठा के लिए क्या करेंगे?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁמְעוּ
  choice: यह सुनेंगे
  rationale: शָׁמַע का अपूर्ण रूप यहाँ यहोशू द्वारा आशंकित भावी परिणाम व्यक्त करता है; ‘यह’ पिछली हार के समाचार की ओर संकेत करता है।
- source_word: הַכְּנַעֲנִי
  choice: कनानी
  rationale: रूप एकवचन है, पर यहाँ जाति के लिए सामूहिक अर्थ में प्रयुक्त हुआ है; हिन्दी में ‘कनानी’ स्वाभाविक सामूहिक पद है।
- source_word: וְכֹל יֹשְׁבֵי הָאָרֶץ
  choice: और इस देश के सभी निवासी
  rationale: יֹשְׁבֵי का अर्थ ‘निवासी’ है और संदर्भ में הָאָרֶץ आसपास के देश/क्षेत्र को दर्शाता है, पूरी पृथ्वी को नहीं।
- source_word: וְנָסַבּוּ עָלֵינוּ
  choice: वे हमें चारों ओर से घेर लेंगे
  rationale: נסב עם עַל सैन्य संदर्भ में घेर लेने का भाव देता है; ‘चारों ओर से’ हिन्दी में इस आशय को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְהִכְרִיתוּ אֶת־שְׁמֵנוּ מִן־הָאָרֶץ
  choice: धरती पर से हमारा नाम मिटा देंगे
  rationale: शाब्दिक ‘हमारा नाम काट डालेंगे’ हिन्दी में अस्वाभाविक है। ‘नाम मिटा देंगे’ लोगों के अस्तित्व और स्मृति को पूरी तरह समाप्त करने वाला इब्रानी मुहावरा सुरक्षित रखता है।
- source_word: וּמַה תַּעֲשֶׂה
  choice: तब आप ... क्या करेंगे?
  rationale: अपूर्ण रूप सीधा प्रश्न है; ‘तब’ आशंकित विनाश और उसके फलस्वरूप परमेश्वर के नाम पर पड़ने वाले प्रभाव के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְשִׁמְךָ הַגָּדוֹל
  choice: अपने महान नाम के लिए
  rationale: לְ का अर्थ यहाँ परमेश्वर के नाम के हित, प्रतिष्ठा और सम्मान के संबंध में है। हिन्दी वाक्यांश मूल की संक्षिप्तता और प्रश्न की खुली तीव्रता बनाए रखता है।
theological_decisions:
- issue: ‘अपने महान नाम के लिए’ में यहोशू की अपील का आशय
  choice: इस्राएल के भविष्य से जुड़ी परमेश्वर की सार्वजनिक प्रतिष्ठा और सम्मान की अपील
  alternative: केवल परमेश्वर के नाम के बारे में एक सामान्य या निजी चिंता
  rationale: आसपास की जातियों द्वारा इस्राएल की हार सुनने और उसे मिटा देने की आशंका के संदर्भ में प्रश्न परमेश्वर के नाम की राष्ट्रों के बीच प्रतिष्ठा से जुड़ा है। अनुवाद इस संबंध को बनाए रखता है, पर वाचा-संबंधी आशय को मुख्य पाठ में विस्तार देकर नहीं जोड़ता।
- issue: प्रश्न में निहित तनाव
  choice: ‘आप ... क्या करेंगे?’ के रूप में सीधी और साहसपूर्ण अपील बनाए रखना
  alternative: ‘आपके महान नाम का क्या होगा?’ जैसे परिणाम-केंद्रित रूप में समझाकर कहना
  rationale: मूल पाठ परमेश्वर की भावी कार्रवाई के विषय में सीधा प्रश्न करता है। उसे प्रतिष्ठा के बारे में अप्रत्यक्ष प्रश्न बना देना मूल की वाक्यात्मक और धर्मवैचारिक तीक्ष्णता घटा देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘कनानी’ को सामूहिक जातिनाम, ‘इस देश’ को स्थानीय भूभाग और ‘धरती पर से हमारा नाम मिटा देंगे’ को अर्थ-स्पष्ट मुहावरे के रूप में चुना गया है। आदरसूचक ‘आप’ परमेश्वर से सीधी प्रार्थनात्मक अपील के लिए स्वाभाविक आधुनिक हिन्दी देता है।
