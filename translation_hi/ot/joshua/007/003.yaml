review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the return to Joshua, the advisory force of the prohibitions, the approximate troop numbers, and the reason that Ai's defenders were few. However, “ऐ को मारें” is not idiomatic Hindi for a military action against a city and may suggest killing the city itself. The source verb נכה is suitably conveyed in this context by “ऐ पर आक्रमण करें.”
  naturalness: '“सभी लोगों को ऊपर न जाने दें” introduces an unnecessary permissive agent (“do not let”) where Hindi naturally expresses the Hebrew jussive directly: “सभी लोग ऊपर न जाएँ.” “वहाँ सभी लोगों को परिश्रम में न डालें” is understandable but unnatural; “वहाँ सभी लोगों को न थकाएँ” is clear, idiomatic, and retains the causative sense.'
  terminology: “यहोशू,” “ऐ,” “लोग,” and “पुरुष” are appropriate. A note is retained at “लोग” to indicate that the contextual referent may be the fighting force without narrowing the main text. The footnote on “न थकाएँ” preserves the lexical alternative of burdening/troubling.
  issues:
  - severity: medium
    issue: “ऐ को मारें” is an unnatural and potentially misleading rendering of the military verb in relation to a city.
    rationale: The Hebrew says to strike Ai, an idiom for attacking the city. Modern Hindi “ऐ पर आक्रमण करें” communicates this action naturally without asserting the outcome (“defeat”).
  - severity: low
    issue: The first prohibition is phrased as “सभी लोगों को ऊपर न जाने दें.”
    rationale: This is possible Hindi, but the direct jussive-style “सभी लोग ऊपर न जाएँ” is more natural and closer to the source's advisory prohibition.
  - severity: low
    issue: The source-contextual note for הָעָם is absent.
    rationale: The main text properly retains the broad term “लोग,” but a lexical-alternative footnote helps readers recognize that in this military context it can refer specifically to the fighting force.
