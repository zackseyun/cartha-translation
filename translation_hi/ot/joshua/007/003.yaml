base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/003.yaml
  text: They returned to Joshua and said to him[a], “Do not have all the people go up. Let about two thousand men, or about three thousand men, go up and strike Ai. Do not weary all the people there[b], for they are few.”
translation:
  language: hi
  text: वे यहोशू के पास लौट आए और उससे कहा, “सभी लोग[a] ऊपर न जाएँ। लगभग दो हज़ार या लगभग तीन हज़ार पुरुष ऊपर जाएँ और ऐ पर आक्रमण करें। वहाँ सभी लोगों को न थकाएँ,[b] क्योंकि वे संख्या में थोड़े हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द “लोग” यहाँ विशेष रूप से युद्ध करने वाले दल के लिए भी हो सकता है; प्रसंगानुसार “सैनिक” या “सेना” अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वहाँ सभी लोगों को कष्ट में न डालें।” इब्रानी क्रिया अनावश्यक प्रयास से थकाने या बोझ डालने का अर्थ दे सकती है।
    reason: lexical_alternative
