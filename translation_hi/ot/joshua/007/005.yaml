base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/005.yaml
  text: And the men of Ai struck down about thirty-six men from among them[a], and pursued them from before the gate as far as Shebarim, and struck them down on the descent. So the heart of the people melted and became like water.
translation:
  language: hi
  text: ऐ के लोगों ने उनमें से लगभग छत्तीस पुरुषों को मार गिराया। उन्होंने फाटक के सामने से शबारीम[a] तक उनका पीछा किया और उतराई पर उन्हें मार गिराया। तब लोगों का हृदय पिघल गया और पानी-सा हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खदानों तक’ अथवा ‘टूटी हुई जगहों तक’; इब्रानी शब्द שְׁבָרִים को स्थान-नाम ‘शबारीम’ या वर्णनात्मक पद के रूप में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ מֵהֶם
  choice: उनमें से ... को मार गिराया
  rationale: युद्ध के प्रसंग में נכה घातक या निर्णायक प्रहार का बोध कराता है, जबकि מֵהֶם बताता है कि हताहत इस्राएली दल में से थे।
- source_word: אַנְשֵׁי הָעַי
  choice: ऐ के लोगों
  rationale: यह ऐ से संबंधित पुरुषों या नगरवासियों को दर्शाता है। आधुनिक हिन्दी में ‘ऐ के लोगों’ स्वाभाविक है और युद्धरत नगरवासियों का आशय स्पष्ट रखता है।
- source_word: כִּשְׁלֹשִׁים וְשִׁשָּׁה אִישׁ
  choice: लगभग छत्तीस पुरुषों
  rationale: संख्या से पहले כִּ अनुमान का भाव देता है; ‘पुरुषों’ मूल के אִישׁ और सैनिक प्रसंग दोनों को बनाए रखता है।
- source_word: וַיִּרְדְּפוּם
  choice: उनका पीछा किया
  rationale: רדף का यह सीधा और स्वाभाविक सैन्य-संदर्भीय अनुवाद है।
- source_word: לִפְנֵי הַשַּׁעַר
  choice: फाटक के सामने से
  rationale: לִפְנֵי के स्थान-संबंधी अर्थ ‘सामने’ को बनाए रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति दी गई है।
- source_word: עַד הַשְּׁבָרִים
  choice: शबारीम तक
  rationale: यह रूप किसी स्थान-नाम अथवा वर्णनात्मक सामान्य संज्ञा के रूप में समझा जा सकता है। मुख्य पाठ में संभावित स्थान-नाम रखा गया है और अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: וַיַּכּוּם בַּמּוֹרָד
  choice: उतराई पर उन्हें मार गिराया
  rationale: נכה की युद्ध-संदर्भीय शक्ति को बनाए रखा गया है और מוֹרָד के ढलान या नीचे उतरने वाले मार्ग के अर्थ के लिए ‘उतराई’ चुना गया है।
- source_word: וַיִּמַּס לְבַב הָעָם
  choice: लोगों का हृदय पिघल गया
  rationale: साहस टूटने की इब्रानी रूपकात्मक अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है; यह हिन्दी में भी सुबोध है।
- source_word: וַיְהִי לְמָיִם
  choice: पानी-सा हो गया
  rationale: लोगों के संकल्प और साहस के पूरी तरह ढह जाने का मूल रूपक सुरक्षित रहता है, और ‘-सा’ हिन्दी में उसके भाव को स्वाभाविक बनाता है।
