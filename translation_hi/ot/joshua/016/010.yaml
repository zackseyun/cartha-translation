source:
  edition: WLC
  text: וְ/לֹ֣א הוֹרִ֔ישׁוּ אֶת הַֽ/כְּנַעֲנִ֖י הַ/יּוֹשֵׁ֣ב בְּ/גָ֑זֶר וַ/יֵּ֨שֶׁב הַֽ/כְּנַעֲנִ֜י בְּ/קֶ֤רֶב אֶפְרַ֨יִם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/010.yaml
  text: But they did not drive out the Canaanites who lived in Gezer, so the Canaanites have lived in the midst of Ephraim to this day and became forced laborers.
translation:
  language: hi
  text: पर उन्होंने गेजेर में रहने वाले कनानियों को नहीं निकाला, और कनानी आज तक एप्रैम के बीच रहते हैं और बेगार करने वाले बन गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרִישׁוּ
  choice: निकाला
  rationale: हिफ़ील क्रिया का अर्थ यहाँ किसी भूभाग से निवासियों को निकाल देना है; सहज आधुनिक हिंदी में इसे स्पष्ट रखा गया है।
- source_word: בְּקֶרֶב אֶפְרַיִם
  choice: एप्रैम के बीच
  rationale: स्थानवाचक अभिव्यक्ति का निकट और स्वाभाविक रूप, जो एप्रैम के लोगों/क्षेत्र के भीतर रहने का भाव बनाए रखता है।
- source_word: לְמַס עֹבֵד
  choice: बेगार करने वाले
  rationale: מַס श्रम-कर अथवा जबरन सेवा को सूचित करता है और עֹבֵד वास्तविक श्रम करने का भाव जोड़ता है; ‘बेगार’ इस संदर्भ में संक्षिप्त और सटीक हिंदी पद है।
theological_decisions:
- issue: कनानियों को न निकालने और उनके बने रहने के बीच संबंध
  choice: इसलिए
  alternative: और
  rationale: वाक्य का וַיֵּשֶׁב परिणामसूचक रूप में स्वाभाविक है और अंग्रेज़ी परामर्श-पाठ से भी मेल खाता है, यद्यपि सामान्य समुच्चय का अर्थ भी व्याकरणतः संभव है।
- issue: अंतिम क्रिया का काल और पहलू
  choice: बन गए
  alternative: बने रहे हैं
  rationale: וַיְהִי कथा में घटित स्थिति को ‘हो गया/बन गया’ के रूप में प्रस्तुत करता है; इसे वर्तमान तक जारी होने की अतिरिक्त व्याख्या दिए बिना रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गेजेर’, ‘कनानी’ और ‘एप्रैम’ प्रचलित बाइबिलीय नाम-रूप हैं; ‘बेगार’ जबरन श्रम की संक्षिप्त और परिचित अभिव्यक्ति है।
