translation:
  language: hi
  text: फिर वह सीमा बेतेल से लूज की ओर निकली और अतारोत में अर्कियों की सीमा तक आगे बढ़ी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָצָא
  choice: फिर वह सीमा ... निकली
  rationale: पिछले पद से चल रही सीमा इसका निहित कर्ता है; हिन्दी में स्पष्टता के लिए ‘सीमा’ जोड़ा गया और वाव के क्रमिक भाव को ‘फिर’ से व्यक्त किया गया।
- source_word: מִבֵּית אֵל
  choice: बेतेल से
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण और מִן का स्वाभाविक अनुवाद।
- source_word: לוּזָה
  choice: लूज की ओर
  rationale: अंत का दिशासूचक ה स्थान की ओर गति बताता है; ‘की ओर’ इस भाव को स्पष्ट रखते हुए यह अनिवार्य रूप से नहीं कहता कि सीमा नगर के भीतर पहुँची।
- source_word: וְעָבַר
  choice: '... तक गई'
  rationale: सीमा-वर्णन में क्रिया आगे बढ़ने अथवा गुजरने को व्यक्त करती है। अगले पदांश के साथ स्वाभाविक हिन्दी वाक्य के लिए इसे ‘तक गई’ कहा गया है।
- source_word: אֶל גְּבוּל
  choice: की सीमा तक
  rationale: גְּבוּל का मूल भौगोलिक अर्थ ‘सीमा’ है और אֶל लक्ष्य की ओर अथवा लक्ष्य तक गति व्यक्त करता है।
- source_word: הָאַרְכִּי
  choice: अर्कियों
  rationale: यह किसी कुल अथवा समुदाय का जातिवाचक नाम है; हिन्दी में समुदाय का बहुवचन रूप प्रसंग के अनुकूल है।
- source_word: עֲטָרוֹת
  choice: अतारोत
  rationale: स्थान-नाम का स्रोत-पाठ के निकट और हिन्दी में सहज लिप्यंतरण।
