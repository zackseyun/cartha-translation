  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रशासनिक-भौगोलिक विवरण के लिए ‘इलाका’ और ‘सीमा’ का संदर्भानुसार प्रयोग किया गया है; स्थान-नाम देवनागरी में लिप्यंतरित हैं।
