base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/005.yaml
  text: 'And the territory of the sons of Ephraim by their clans was as follows: the border of their inheritance on the east was Ataroth-addar[a], as far as Upper Beth-horon.'
translation:
  language: hi
  text: 'एप्रैम के वंशजों का क्षेत्र उनके कुलों के अनुसार यह था: उनकी विरासत की सीमा पूर्व में अतारोत-अद्दार से ऊपरी बेत-होरोन तक थी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּבוּל
  choice: इलाका / सीमा
  rationale: पहले प्रयोग में यह एप्रैम के कुलों को मिले समूचे भूभाग को दर्शाता है, इसलिए ‘इलाका’ स्वाभाविक है; दूसरे में स्थानों से चिह्नित सीमारेखा का वर्णन है, इसलिए ‘सीमा’ अधिक सटीक है।
- source_word: בְּנֵי אֶפְרַיִם
  choice: एप्रैम के वंशज
  rationale: यह जनजातीय-संदर्भ में एप्रैम से निकले लोगों को सूचित करता है। आधुनिक हिन्दी में ‘वंशज’ मूल के वंश-संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: यह गोत्र के भीतर के कुल-आधारित सामाजिक और भूमि-विभाजन को व्यक्त करता है।
- source_word: נַחֲלָתָם
  choice: उनकी विरासत
  rationale: यहोशू में यह शब्द हिस्से में मिली पैतृक/विरासती भूमि का संकेत देता है; ‘विरासत’ उस भूमि-संबंधी अर्थ को बनाए रखता है।
- source_word: מִזְרָחָה
  choice: पूर्व में
  rationale: दिशासूचक रूप सीमा के पूर्वी भाग या आरंभ-बिंदु को बताता है; ‘पूर्व में’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: עַטְרוֹת אַדָּר
  choice: अत्रोत-अद्दार
  rationale: स्थान-नाम का अनुवाद करने के बजाय उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: עַד
  choice: से ... तक
  rationale: सीमा-विवरण में आरंभ और अंतिम बिंदु को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: בֵּית חוֹרֹן עֶלְיוֹן
  choice: ऊपरी बेत-होरोन
  rationale: עֶלְיוֹן इस नगर को निचले बेत-होरोन से अलग करता है; विशेषण को हिन्दी स्थान-नाम के स्वाभाविक क्रम में रखा गया है।
theological_decisions: []
