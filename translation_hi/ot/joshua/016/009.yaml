translation_notes:
  register: आधुनिक मानक हिन्दी; क्षेत्र-विभाजन की प्रशासनिक भाषा को स्पष्ट रखते हुए वाक्य को स्वाभाविक बनाया गया है। ‘पुत्रों’ के स्थान पर गोत्रीय आशय के लिए ‘वंशजों’ और נחלה के भूमि-संबंधी अर्थ के लिए ‘विरासत-भाग’ चुना गया है।
