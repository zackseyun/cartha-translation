  text: And the cities set apart for the sons of Ephraim within the inheritance of the sons of Manasseh—all the cities and their villages[a].
translation:
  language: hi
  text: और मनश्शे के वंशजों को विरासत में मिले भूभाग के भीतर एप्रैम के वंशजों के लिए अलग किए गए सभी नगर और उनके गाँव थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶעָרִים
  choice: नगर
  rationale: यहोशू की क्षेत्र-सूचियों में עִיר के लिए ‘नगर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: הַמִּבְדָּלוֹת
  choice: अलग किए गए
  rationale: בדל का कृदन्त इन नगरों के मनश्शे के भूभाग के भीतर होते हुए भी एप्रैम के लिए पृथक किए जाने का भाव व्यक्त करता है।
- source_word: לִבְנֵי אֶפְרַיִם
  choice: एप्रैम के वंशजों के लिए
  rationale: בני का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ यह पूरे गोत्र का पारंपरिक संकेत है; ‘वंशज’ आधुनिक हिन्दी में आशय अधिक स्वाभाविक ढंग से पहुँचाता है।
- source_word: בְּתוֹךְ
  choice: के भीतर
  rationale: यह दूसरे गोत्र के निर्धारित भूभाग के अंदर स्थित होने का स्थानिक अर्थ स्पष्ट करता है।
- source_word: נַחֲלַת
  choice: विरासत-भाग
  rationale: נחלה यहाँ विरासत के रूप में मिले क्षेत्रीय आवंटन को दर्शाता है; संयुक्त पद भूमि और विरासत दोनों भाव सुरक्षित रखता है।
- source_word: בְּנֵי מְנַשֶּׁה
  choice: मनश्शे के वंशजों
  rationale: यह पूरे मनश्शे गोत्र का संकेत है; ‘वंशज’ हिन्दी में इस सामूहिक गोत्रीय प्रयोग को स्पष्ट करता है।
- source_word: כָּל הֶעָרִים
  choice: वे सभी नगर
  rationale: כָּל निर्दिष्ट नगरों की समग्रता बताता है; ‘वे’ पहले उल्लिखित अलग किए गए नगरों की ओर स्वाभाविक संकेत करता है।
- source_word: וְחַצְרֵיהֶן
  choice: और उनके गाँव
  rationale: חָצֵר क्षेत्रीय सूचियों में नगरों से जुड़े छोटे अथवा प्रायः बिना शहरपनाह वाले बसेरों को दर्शाता है; ‘गाँव’ सामान्य पाठक के लिए स्पष्ट है।
