  yaml_path: translation/ot/joshua/016/001.yaml
  text: And the lot came out for the sons of Joseph from the Jordan at Jericho[a], to the waters of Jericho on the east, through the wilderness[b], going up from Jericho into the hill country of Bethel.
translation:
  language: hi
  text: 'यूसुफ के वंशजों के लिए चिट्ठी निकली[a]: यरीहो के पास यरदन से, यरीहो के जलों तक, पूर्व की ओर, उस वीराने तक जो यरीहो से बेतेल के पहाड़ी प्रदेश में चढ़ता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “चिट्ठी निकली।” भूमि के विभाजन के लिए चिट्ठी डाली जाती थी; इसलिए इसका अर्थ यह भी हो सकता है कि चिट्ठी यूसुफ के वंशजों के पक्ष में निकली।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: चिट्ठी निकली
  rationale: इब्रानी क्रिया का मूल अर्थ ‘निकलना’ है और גּוֹרָל भूमि बाँटने के लिए डाली गई चिट्ठी को दर्शाता है। यह अभिव्यक्ति मूल बिंब को बनाए रखती है; अगले वाक्य में ‘उनका भाग’ भौगोलिक विवरण को स्वाभाविक बनाता है।
- source_word: לִבְנֵי יוֹסֵף
  choice: यूसुफ के वंशजों के लिए
  rationale: शाब्दिक अर्थ ‘यूसुफ के पुत्रों के लिए’ है, पर यहाँ सामूहिक रूप से एप्रैम और मनश्शे के गोत्रीय वंशज अभिप्रेत हैं। ‘वंशज’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: מִיַּרְדֵּן יְרִיחוֹ
  choice: यरीहो के पास यरदन से
  rationale: यह सीमा के आरम्भ-बिंदु को यरीहो के निकट यरदन नदी पर रखता है, बिना सटीक दूरी को अनावश्यक रूप से निर्धारित किए।
- source_word: לְמֵי יְרִיחוֹ
  choice: यरीहो के जलस्रोतों तक
  rationale: מֵי का अर्थ सामूहिक रूप से ‘जल’ है और यहाँ सम्भवतः यरीहो से जुड़े सोते या जलस्रोत अभिप्रेत हैं। ‘जलस्रोतों’ भौगोलिक सन्दर्भ में स्वाभाविक है, जबकि अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: מִזְרָחָה
  choice: पूर्व की ओर
  rationale: दिशासूचक रूप को स्वाभाविक हिन्दी में व्यक्त करता है; इसका सम्बन्ध यरीहो के जल अथवा सीमा की दिशा से हो सकता है।
- source_word: הַמִּדְבָּר
  choice: वीराना
  rationale: מִדְבָּר शुष्क, निर्जन प्रदेश या जंगल को दर्शा सकता है। ‘वीराना’ आधुनिक हिन्दी में ऐसे निर्जन भूभाग को व्यक्त करता है और आधुनिक अर्थ वाले रेतीले ‘रेगिस्तान’ तक अर्थ को सीमित नहीं करता।
- source_word: עֹלֶה מִירִיחוֹ בָּהָר בֵּית אֵל
  choice: उस पहाड़ी प्रदेश में गया, जो यरीहो से बेतेल की ओर चढ़ता है
  rationale: עֹלֶה ऊँचाई की ओर जाने का स्थलाकृतिक भाव देता है। הָר यहाँ एक अकेले पहाड़ के बजाय ऊँचे पहाड़ी भूभाग को सूचित करता है। हिन्दी वाक्य सीमा की गति और भूभाग की चढ़ाई दोनों को सहज रूप देता है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: स्थान-नाम का हिन्दी बाइबिलीय रूप अपनाया गया है।
