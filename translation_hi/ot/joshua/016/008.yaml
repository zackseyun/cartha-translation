reference: Joshua 16:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/תַּפּ֜וּחַ יֵלֵ֨ךְ הַ/גְּב֥וּל יָ֨מָּ/ה֙ נַ֣חַל קָנָ֔ה וְ/הָי֥וּ תֹצְאֹתָ֖י/ו הַ/יָּ֑מָּ/ה זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי אֶפְרַ֖יִם לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/008.yaml
  text: From Tappuah the border goes westward to the Brook of Kanah[a], and its end was at the sea[c][b]. This is the inheritance of the tribe of the sons of Ephraim according to their families.
translation:
  language: hi
  text: तप्पूह से सीमा पश्चिम की ओर काना नामक नाले[a] तक जाती है, और उसके छोर समुद्र तक पहुँचते हैं। यह एप्रैम के पुत्रों के गोत्र की विरासत है, उनके कुलों के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नाले” का अनुवाद “वादी” या “मौसमी जलधारा” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּפּוּחַ
  choice: तप्पूह से
  rationale: מִן आरंभ-बिंदु बताता है; स्थान-नाम תַּפּוּחַ का निकट देवनागरी लिप्यंतरण ‘तप्पूह’ रखा गया है।
- source_word: יֵלֵךְ הַגְּבוּל
  choice: सीमा ... जाती है
  rationale: भू-सीमा के वर्णन में הלך सीमा के मार्ग को दर्शाता है; हिन्दी में ‘सीमा जाती है’ स्वाभाविक और स्रोत के निकट है।
- source_word: יָמָּה
  choice: पश्चिम की ओर
  rationale: दिशासूचक रूप का सामान्य भौगोलिक अर्थ पश्चिम की ओर है, क्योंकि समुद्र पश्चिम में था।
- source_word: נַחַל קָנָה
  choice: काना नामक नाले
  rationale: נַחַל मौसमी जलधारा, नाला या वादी हो सकता है। सामान्य हिन्दी में ‘नाला’ सुलभ है और नाम के साथ स्वाभाविक बैठता है।
- source_word: וְהָיוּ תֹצְאֹתָיו הַיָּמָּה
  choice: और उसका अंत समुद्र पर होता है
  rationale: सीमा-वर्णन में תֹצְאֹתָיו उसके अंतिम छोर को सूचित करता है; बहुवचन हिब्रू सूत्र को हिन्दी में स्वाभाविक एकवचन ‘अंत’ से व्यक्त किया गया है। הַיָּמָּה यहाँ ठोस भौगोलिक गंतव्य, समुद्र, दर्शाता है।
- source_word: זֹאת נַחֲלַת
  choice: यही ... विरासत है
  rationale: यह औपचारिक रूप से आवंटित भूभाग का सार प्रस्तुत करता है; ‘विरासत’ נַחֲלָה के पैतृक अधिकार और प्राप्त भूभाग दोनों को बनाए रखती है।
- source_word: מַטֵּה בְנֵי אֶפְרַיִם
  choice: एप्रैम के वंशजों के गोत्र
  rationale: מַטֵּה का संदर्भगत अर्थ ‘गोत्र’ है। בְנֵי אֶפְרַיִם एक मानक वंशगत-जनजातीय पद है; आधुनिक हिन्दी में ‘एप्रैम के वंशज’ उसका आशय स्पष्ट करता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחוֹת जनजाति के भीतर कुलों अथवा वंश-समूहों को दर्शाता है; इस संदर्भ में ‘कुल’ ‘परिवार’ से अधिक सटीक है।
theological_decisions:
- issue: בְנֵי אֶפְרַיִם का लिंगयुक्त जनजातीय पद
  choice: एप्रैम के वंशजों
  alternative: एप्रैम के पुत्रों
  rationale: शाब्दिक रूप ‘एप्रैम के पुत्र’ है, पर यहाँ यह पुरुष संतानों तक सीमित कथन नहीं बल्कि पूरे वंशगत जनसमुदाय का मानक पद है। ‘वंशजों’ उस सामूहिक अर्थ को बिना किसी सांप्रदायिक व्याख्या के स्पष्ट करता है।
- issue: נַחֲלָה का स्वरूप
  choice: विरासत
  alternative: बाँटा हुआ भाग
  rationale: ‘विरासत’ भूमि-अधिकार और पीढ़ीगत प्राप्ति का स्रोतगत भाव बनाए रखती है; पद में इसके लिए अलग से दैवी या मानवीय कर्ता निर्दिष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण भू-सीमा-वर्णन। ‘गोत्र’, ‘कुल’ और ‘विरासत’ इस्राएली जनजातीय संदर्भ को स्पष्ट रखते हैं; अनावश्यक पुरातन शब्दावली से बचा गया है।
