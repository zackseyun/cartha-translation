base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/003.yaml
  text: Then it went down westward to the border of the Japhletites[a], as far as the border of Lower Beth-horon, and as far as Gezer; and its goings out were at the sea.
translation:
  language: hi
  text: फिर वह पश्चिम की ओर उतरकर यपलेतियों की सीमा तक, निचले बेथ-होरोन की सीमा तक और गेजेर तक गई; और उसके अंतिम छोर समुद्र तक थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָרַד
  choice: फिर वह ... उतरकर ... पहुँची
  rationale: सीमा-वर्णन में ירד भूभाग की ढलान पर आगे बढ़ने को सूचित करता है। स्त्रीलिंग सर्वनाम का संकेत प्रसंग में निहित 'सीमा' की ओर है।
- source_word: יָמָּה
  choice: पश्चिम की ओर
  rationale: दिशासूचक रूप भौगोलिक संदर्भ में प्रायः पश्चिम दिशा बताता है, क्योंकि समुद्र पश्चिम में था।
- source_word: אֶל גְּבוּל הַיַּפְלֵטִי
  choice: यपलेतियों की सीमा तक
  rationale: גְּבוּל को सीमा और gentilic הַיַּפְלֵטִי को लोगों के समूह के रूप में स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: עַד גְּבוּל בֵּית חוֹרֹן תַּחְתּוֹן
  choice: निचले बेथ-होरोन की सीमा ... तक
  rationale: עַד विस्तार की अंतिम हद बताता है और תַּחְתּוֹן इस स्थान को ऊपरी बेथ-होरोन से अलग करता है।
- source_word: וְעַד גָּזֶר
  choice: और गेजेर तक
  rationale: दोहराया गया עַד सीमा के मार्ग की अगली हद बताता है।
- source_word: וְהָיוּ תצאתו
  choice: और उसका अंतिम सिरा ... था
  rationale: पाठ का केतीव रूप सीमा-वर्णन के तकनीकी सूत्र की ओर संकेत करता है; हिंदी में 'अंतिम सिरा' उसके समाप्ति-बिंदु को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָמָּה
  choice: समुद्र पर
  rationale: अंतिम खंड में इसे पश्चिम दिशा मात्र के बजाय सीमा के ठोस समाप्ति-स्थान, समुद्र, के रूप में लिया गया है।
