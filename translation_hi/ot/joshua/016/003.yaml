- from: फिर वह पश्चिम की ओर उतरकर यपलेतियों की सीमा तक पहुँची, और वहाँ से निचले बेथ-होरोन की सीमा और गेजेर तक गई; और उसका अंतिम सिरा समुद्र पर था।
  to: फिर वह पश्चिम की ओर उतरकर यपलेतियों की सीमा तक, निचले बेथ-होरोन की सीमा तक और गेजेर तक गई; और उसके अंतिम छोर समुद्र तक थे।
  rationale: 'The revision removes an unwarranted connective addition and restores the plural sense of the Hebrew boundary-termination formula. No footnote is needed in Hindi: the rendering is clear in context, and the English audit footnote’s marker is attached to ‘Japhletites’ even though its content concerns the final boundary formula, so it should not be replicated with that misplaced anchor.'
