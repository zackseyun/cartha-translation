base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/004.yaml
  text: And the sons of Joseph[a], Manasseh and Ephraim, received their inheritance.
translation:
  language: hi
  text: और यूसुफ के पुत्रों—मनश्शे और एप्रैम—ने अपनी विरासत पाई[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विरासत में अपना भाग पाया” अथवा “अपनी विरासत पर अधिकार पाया।”
    reason: נחל में विरासत मिलने और उस पर अधिकार प्राप्त करने—दोनों से जुड़ा अर्थ हो सकता है।
lexical_decisions:
- source_word: וַיִּנְחֲלוּ
  choice: ने अपनी विरासत पाई
  rationale: נחל का क़ाल रूप यहाँ आवंटित भूभाग को विरासत के रूप में प्राप्त करने का भाव देता है। हिन्दी में ‘अपनी विरासत पाई’ स्वाभाविक है और भूमि-वितरण के संदर्भ को बनाए रखता है; मूल में कर्म व्यक्त नहीं है, पर संदर्भ से निहित है।
- source_word: בְנֵי יוֹסֵף
  choice: यूसुफ के पुत्रों
  rationale: शाब्दिक वंशावली अभिव्यक्ति ‘यूसुफ के पुत्र’ सुरक्षित रखी गई है। संदर्भ में यह मनश्शे और एप्रैम से निकले गोत्रों को भी समेट सकती है, पर मुख्य पाठ में अधिक व्याख्यात्मक ‘वंशजों’ नहीं रखा गया।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: व्यक्तिगत और गोत्रीय नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְאֶפְרָיִם
  choice: और एप्रैम
  rationale: नाम का प्रचलित हिन्दी लिप्यंतरण किया गया और संयोजक וְ को ‘और’ के रूप में रखा गया।
- source_word: וַ
  choice: और
  rationale: वाव-युक्त कथात्मक क्रिया पिछले प्रसंग से क्रम आगे बढ़ाती है; ‘और’ इसके औपचारिक कथात्मक संबंध को सीधे व्यक्त करता है।
