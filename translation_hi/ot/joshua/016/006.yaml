  text: Then the border went out westward to Michmethath on the north[a], and the border turned eastward to Taanath-shiloh, and passed it on the east to Janoah.
translation:
  language: hi
  text: फिर सीमा पश्चिम की ओर[a] उत्तर में स्थित मिकमतात तक गई। वहाँ से सीमा पूर्व की ओर मुड़कर तानत-शिलो तक गई और उसके पूर्व से होती हुई यानोह तक पहुँची।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘समुद्र की ओर’ है; इब्रानी में यह पश्चिम दिशा के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: फिर ... गई
  rationale: सीमा-वर्णन में यह क्रिया सीमा-रेखा के आगे बढ़ने को दर्शाती है। ‘फिर’ संयोजक वाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַגְּבוּל
  choice: सीमा
  rationale: यहाँ शब्द गोत्र के भूभाग की सीमा-रेखा को सूचित करता है; आधुनिक हिन्दी में ‘सीमा’ स्वाभाविक और स्पष्ट है।
- source_word: הַיָּמָּה
  choice: पश्चिम की ओर
  rationale: शाब्दिक अर्थ ‘समुद्र की ओर’ है, जो पश्चिम दिशा के लिए प्रचलित इब्रानी मुहावरा है। भौगोलिक अर्थ मुख्य पाठ में और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: הַמִּכְמְתָת
  choice: मिकमतात
  rationale: स्थान-नाम का इब्रानी उच्चारणानुसार देवनागरी लिप्यंतरण किया गया है।
- source_word: מִצָּפוֹן
  choice: उत्तर में स्थित
  rationale: यह पद मिकमतात की उत्तरी स्थिति बताता प्रतीत होता है। हिन्दी में संबंध स्पष्ट करने के लिए ‘स्थित’ जोड़ा गया है, बिना कोई अतिरिक्त स्थल-संबंध निर्धारित किए।
- source_word: וְנָסַב
  choice: मुड़कर
  rationale: सीमा-वर्णन में यह क्रिया सीमा-रेखा के दिशा बदलने को व्यक्त करती है।
- source_word: מִזְרָחָה
  choice: पूर्व की ओर
  rationale: दिशासूचक प्रत्यय पूर्व दिशा की ओर गति को बताता है।
- source_word: תַּאֲנַת שִׁלֹה
  choice: तानत-शिलो
  rationale: संयुक्त स्थान-नाम का स्रोत के निकट देवनागरी लिप्यंतरण है।
- source_word: וְעָבַר אֹתוֹ מִמִּזְרַח
  choice: उसके पूर्व से होती हुई
  rationale: सीमा तानत-शिलो के पूर्वी ओर से आगे निकलती है। यह हिन्दी रूप स्थल के सापेक्ष सीमा की गति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יָנוֹחָה
  choice: यानोह तक
  rationale: अंतिम हे यहाँ दिशा दर्शाता है—यानोह की ओर। इसलिए स्थान-नाम ‘यानोह’ और गंतव्य-सूचक ‘तक’ रखा गया है।
