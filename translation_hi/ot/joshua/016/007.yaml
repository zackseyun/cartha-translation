  yaml_path: translation/ot/joshua/016/007.yaml
  text: Then it went down from Janoah to Ataroth and Naarah[a], and reached Jericho[c][b], and ended at the Jordan.
translation:
  language: hi
  text: फिर वह यानोह से उतरकर अतारोत और नाराह[a] तक गई, यरीहो तक पहुँची[b], और यरदन तक जा निकली[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में “नाराह”; कुछ विद्वान इस स्थान-नाम को “नारात” नाम से संबंधित मानते हैं।
    reason: alternative_reading
  - marker: b
    text: या “यरीहो को छुआ”; हिब्रू क्रिया किसी सीमा-रेखा के किसी स्थान तक पहुँचने या उसे छूने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: या “यरदन पर समाप्त हुई”; हिब्रू सीमा-वर्णन यहाँ सीमा के मार्ग या उसके अंतिम बिंदु को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: फिर वह ... उतरकर
  rationale: सीमा-वर्णन में ירד ऊँचाई या दिशा में नीचे जाने को दर्शाता है; स्त्रीलिंग ‘वह’ का संकेत समझी गई ‘सीमा’ से है। ‘फिर’ क्रमसूचक वाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִיָּנוֹחָה
  choice: यानोह से
  rationale: מִן को ‘से’ और स्थान-नाम יָנוֹחַ को निकट देवनागरी लिप्यंतरण ‘यानोह’ के रूप में रखा गया है। अंतिम ה दिशासूचक प्रत्यय है, नाम का अंग नहीं।
- source_word: עֲטָרוֹת
  choice: अतारोत
  rationale: स्थान-नाम को अनूदित करने के बजाय उसके हिब्रू उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: וְנַעֲרָתָה
  choice: और नाराह
  rationale: मसोरेटी स्वरांकन נַעֲרָה को ‘नाराह’ के रूप में प्रस्तुत किया गया है; अन्य परंपरा में मिलने वाले ‘नारात’ रूप को पादटिप्पणी में रखा गया है।
- source_word: וּפָגַע בִּירִיחוֹ
  choice: यरीहो तक पहुँची
  rationale: सीमा-वर्णनों में פגע किसी स्थान से मिलने, उसे छूने या वहाँ तक पहुँचने का संकेत देता है। ‘तक पहुँची’ स्वाभाविक हिन्दी है और स्थानिक अर्थ को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: וְיָצָא הַיַּרְדֵּן
  choice: और यरदन पर समाप्त हुई
  rationale: सीमा-सूत्र में יצא सीमा के निकलने या अंतिम बिंदु तक पहुँचने को दर्शा सकता है। ‘समाप्त हुई’ यहाँ सीमा के अंतिम पड़ाव को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: הַיַּרְדֵּן
  choice: यरदन
  rationale: नदी के प्रचलित हिन्दी नाम का प्रयोग किया गया है; प्रसंग से नदी होना स्पष्ट है।
