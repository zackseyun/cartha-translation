  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। सीमा को निहित कर्ता मानकर स्त्रीलिंग क्रियाएँ रखी गई हैं। स्थान-नाम हिब्रू के निकट देवनागरी में लिप्यंतरित हैं; वास्तविक शब्दार्थगत विकल्प पादटिप्पणियों में सुरक्षित हैं।
