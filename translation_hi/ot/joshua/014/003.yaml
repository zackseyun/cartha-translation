id: JOS.14.3
reference: Joshua 14:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי נָתַ֨ן מֹשֶׁ֜ה נַחֲלַ֨ת שְׁנֵ֤י הַ/מַּטּוֹת֙ וַ/חֲצִ֣י הַ/מַּטֶּ֔ה מֵ/עֵ֖בֶר לַ/יַּרְדֵּ֑ן וְ/לַ֨/לְוִיִּ֔ם לֹֽא נָתַ֥ן נַחֲלָ֖ה בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/003.yaml
  text: For Moses had given the inheritance of the two tribes and the half-tribe beyond the Jordan[a], but to the Levites he gave no inheritance among them.
translation:
  language: hi
  text: क्योंकि मूसा ने यरदन के पार[a] दो गोत्रों और आधे गोत्र को विरासत दे दी थी, पर लेवियों को उसने उनके बीच कोई विरासत नहीं दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यरदन के उस पार।’
    reason: इब्रानी भौगोलिक अभिव्यक्ति के वैकल्पिक, समान रूप से संभव अनुवाद को दर्शाता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद संदर्भ में पिछले कथन का कारण या स्पष्टीकरण देता है; ‘क्योंकि’ इस संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: נָתַן
  choice: दे दी थी
  rationale: यह मूसा के पहले ही पूर्ण हो चुके भूमि-वितरण को दर्शाता है; पूर्ण भूतकाल कथा के समय-संबंध को स्पष्ट रखता है।
- source_word: נַחֲלַת / נַחֲלָה
  choice: विरासत
  rationale: यह पैतृक या आवंटित भू-अधिकार का द्योतक है। दोनों प्रयोगों में एक ही शब्द रखने से मूल की शब्दगत संगति बनी रहती है।
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: दो गोत्रों
  rationale: מַטֶּה का शाब्दिक अर्थ ‘लाठी’ भी हो सकता है, किंतु भूमि-वितरण के इस संदर्भ में इसका अर्थ स्पष्टतः ‘गोत्र’ है।
- source_word: וַחֲצִי הַמַּטֶּה
  choice: और आधे गोत्र
  rationale: यह मनश्शे के आधे गोत्र की ओर संकेत करने वाली संक्षिप्त गोत्रीय अभिव्यक्ति है; पद में अनकहा नाम नहीं जोड़ा गया।
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: यरदन के पार
  rationale: यह इब्रानी भौगोलिक मुहावरे का संक्षिप्त और स्वाभाविक हिंदी रूप है तथा दृष्टिकोण को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְלַלְוִיִּם
  choice: पर लेवियों को
  rationale: वाव औपचारिक रूप से ‘और’ है, किंतु यहाँ अन्य गोत्रों को मिली विरासत और लेवियों को न मिली विरासत के बीच स्पष्ट विरोध है; ‘पर’ उसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא נָתַן נַחֲלָה
  choice: कोई विरासत नहीं दी थी
  rationale: नकारात्मक कथन को सीधे रखता है और पहले आए ‘विरासत’ शब्द के साथ मूल की पुनरावृत्ति बनाए रखता है।
- source_word: בְּתוֹכָם
  choice: उनके बीच
  rationale: यह अन्य गोत्रों के बीच लेवियों को अलग भू-विरासत न मिलने का भाव रखता है और सर्वनाम के मूल रूप को अनावश्यक विस्तार के बिना सुरक्षित रखता है।
theological_decisions:
- issue: लेवियों को विरासत न मिलने का स्वरूप
  choice: लेवियों को अन्य गोत्रों के बीच कोई गोत्रीय भू-विरासत न दिए जाने का कथन
  alternative: ऐसा निरपेक्ष कथन कि लेवियों को किसी भी प्रकार की विरासत या व्यवस्था नहीं मिली
  rationale: ‘उनके बीच’ को बनाए रखने से पद का अपना सीमित संदर्भ सुरक्षित रहता है। इससे लेवियों के नगरों या अन्य प्रबंध के विषय में बाहरी व्याख्या मुख्य पाठ में नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गोत्र’ और ‘लेवी’ जैसे प्रचलित बाइबलीय शब्द बनाए गए हैं; वाक्य-रचना साधारण पाठक के लिए स्पष्ट है।
