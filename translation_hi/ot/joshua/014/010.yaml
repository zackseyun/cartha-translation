source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּה֩ הֶחֱיָ֨ה יְהוָ֣ה אוֹתִ/י֮ כַּ/אֲשֶׁ֣ר דִּבֵּר֒ זֶה֩ אַרְבָּעִ֨ים וְ/חָמֵ֜שׁ שָׁנָ֗ה מֵ֠/אָז דִּבֶּ֨ר יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ אֶל מֹשֶׁ֔ה אֲשֶׁר הָלַ֥ךְ יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וְ/עַתָּה֙ הִנֵּ֣ה אָנֹכִ֣י הַ/יּ֔וֹם בֶּן חָמֵ֥שׁ וּ/שְׁמוֹנִ֖ים שָׁנָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/010.yaml
  text: And now[a], behold, Yahweh has kept me alive, just as he said, these forty-five years since Yahweh spoke this word to Moses while Israel walked in the wilderness. And now, behold[c][b], today I am eighty-five years old.
translation:
  language: hi
  text: और अब, देखो, याहवे ने मुझे जीवित रखा है, जैसा उसने कहा था—इन पैंतालीस वर्षों से, जब से याहवे ने मूसा से यह बात कही थी, उस समय जब इस्राएल निर्जन प्रदेश में चल रहा था।[a] और अब, देखो, आज मैं पचासी वर्ष का हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस समय इस्राएल निर्जन प्रदेश में यात्रा कर रहा था।”
    reason: הלך का मूल अर्थ ‘चलना’ है, जबकि संदर्भ में यह इस्राएल की निर्जन प्रदेश की यात्रा को भी सूचित कर सकता है।
lexical_decisions:
- source_word: הֶחֱיָה
  choice: जीवित रखा है
  rationale: हिफ़ील रूप यहाँ जीवन देने की शुरुआत नहीं, बल्कि इतने वर्षों तक कालेब के जीवन को बनाए रखने का अर्थ देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: ठीक जैसा उसने कहा था
  rationale: यह अभिव्यक्ति पूर्व कथन की पूर्ति पर बल देती है, पर इसे स्पष्ट रूप से ‘प्रतिज्ञा’ कहकर अर्थ को संकीर्ण नहीं करती।
- source_word: זֶה אַרְבָּעִים וְחָמֵשׁ שָׁנָה מֵאָז
  choice: कहे हुए पैंतालीस वर्ष हो गए हैं
  rationale: हिब्रू मुहावरे में अतीत के उस समय से वर्तमान तक बीती अवधि बताई गई है; यह हिन्दी में स्वाभाविक समतुल्य है।
- source_word: הַדָּבָר הַזֶּה
  choice: यह बात
  rationale: דבר यहाँ कथन, बात या विषय को सूचित कर सकता है। ‘बात’ इस अर्थ-व्याप्ति को बनाए रखता है और ‘प्रतिज्ञा’ जैसी व्याख्यात्मक संकीर्णता से बचता है।
- source_word: אֲשֶׁר הָלַךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: उस समय इस्राएल निर्जन प्रदेश में चल रहा था
  rationale: הלך की चलने की छवि और उपवाक्य का कालगत संबंध दोनों सुरक्षित हैं; सम्भावित अर्थ ‘यात्रा कर रहा था’ पाद-टिप्पणी में दिया गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने और वर्तमान तथ्य पर बल देने वाले अव्यय का सहज आधुनिक हिन्दी रूप है।
- source_word: בֶּן חָמֵשׁ וּשְׁמוֹנִים שָׁנָה
  choice: पचासी वर्ष का हूँ
  rationale: हिब्रू के ‘इतने वर्षों का पुत्र’ आयु-मुहावरे का स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: शीर्षक से बदलने के बजाय व्यक्तिगत नाम को सुरक्षित रखा गया है; हिन्दी बाइबल-परंपरा में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला रूप है।
- issue: הַדָּבָר הַזֶּה को प्रतिज्ञा के रूप में स्पष्ट करना
  choice: यह बात
  alternative: यह प्रतिज्ञा
  rationale: संदर्भ में कथन प्रतिज्ञात्मक हो सकता है, पर मूल शब्द स्वयं ‘बात/वचन/विषय’ की व्यापकता रखता है; अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘देखो’ से הִנֵּה का आलंकारिक बल रखा गया है; वाक्य-विन्यास को हिन्दी में स्पष्ट करने के लिए लंबे हिब्रू वाक्य को छोटे वाक्यों में बाँटा गया है।
