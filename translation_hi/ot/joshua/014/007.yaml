  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אָנֹכִ֗י בִּ֠/שְׁלֹחַ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֥ה אֹתִ֛/י מִ/קָּדֵ֥שׁ בַּרְנֵ֖עַ לְ/רַגֵּ֣ל אֶת הָ/אָ֑רֶץ וָ/אָשֵׁ֤ב אֹת/וֹ֙ דָּבָ֔ר כַּ/אֲשֶׁ֖ר עִם לְבָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/007.yaml
  text: I was forty years old when Moses the servant of Yahweh sent me from Kadesh-barnea to spy out the land[a], and I brought him back word according to my heart.
translation:
  language: hi
  text: जब यहोवा के सेवक मूसा ने मुझे कादेश-बर्ने से उस देश की टोह लेने भेजा, तब मैं चालीस वर्ष का था; और मैंने लौटकर उसे वही समाचार दिया जो मेरे मन में था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने उसे अपने मन के अनुसार समाचार दिया।”
    reason: ‘जैसा/जो मेरे मन में था’ इब्रानी כַּאֲשֶׁר עִם־לְבָבִי के आंतरिक धारणा या निष्कपट आकलन संबंधी खुले भाव को बनाए रखता है; वैकल्पिक रूप उसके वाक्यगत संबंध को स्पष्ट करता है।
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: मैं चालीस वर्ष का था
  rationale: यह इब्रानी में आयु बताने का मुहावरा है; आधुनिक हिन्दी में स्वाभाविक रूप से ‘चालीस वर्ष का’ कहा जाता है।
- source_word: בִּשְׁלֹחַ
  choice: जब ... भेजा, तब
  rationale: בְּ के साथ infinitive construct समय-संबंधी परिस्थिति बताता है; हिन्दी में ‘जब ... तब’ इसे स्पष्ट और स्वाभाविक बनाता है।
- source_word: עֶבֶד יְהוָה
  choice: यहोवा के सेवक
  rationale: मूसा के लिए यह आदरसूचक पदवी है; ‘सेवक’ दासत्व का अनावश्यक कठोर अर्थ लाए बिना आधिकारिक संबंध को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: कादेश-बर्ने से
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण किया गया है और संयुक्त नाम को योजक-चिह्न के साथ रखा गया है।
- source_word: לְרַגֵּל
  choice: टोह लेने
  rationale: क्रिया का आशय भूमि की जासूसी अथवा सैन्य दृष्टि से छानबीन करना है; ‘टोह लेने’ आधुनिक हिन्दी में इस टोही गतिविधि को सहजता से व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: इस देश की
  rationale: संदर्भ में संकेत प्रतिज्ञात भूभाग की ओर है; हिन्दी में ‘इस देश’ वक्ता के संदर्भित क्षेत्र को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וָאָשֵׁב אֹתוֹ דָּבָר
  choice: वैसा ही समाचार मैंने उन्हें लौटकर दिया
  rationale: शाब्दिक संरचना ‘उसे बात लौटाई’ हिन्दी में अस्वाभाविक है; ‘समाचार ... लौटकर दिया’ जाँच के बाद वापस आकर विवरण देने का भाव रखता है।
- source_word: כַּאֲשֶׁר עִם לְבָבִי
  choice: जैसा मेरे मन में था
  rationale: यह चयन इब्रानी हृदय/अंतरमन के रूपक और उसकी संभावित अस्पष्टता को बनाए रखता है; इसे केवल ‘ईमानदारी से’ या ‘पूरे मन से’ कहकर संकुचित नहीं किया गया।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पद में चतुरक्षरी व्यक्तिगत नाम सीधे उपस्थित है; इसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में परिचित नामरूप से सुरक्षित रखा गया है।
- issue: כַּאֲשֶׁר עִם לְבָבִי में कालेब के अभिप्राय का स्वरूप
  choice: जैसा मेरे मन में था
  alternative: पूरी ईमानदारी से
  rationale: मूल वाक्यांश आंतरिक धारणा, दृढ़ विश्वास अथवा निष्कपट कथन की ओर संकेत कर सकता है। चुना गया रूप इनमें से किसी एक व्याख्या को अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘टोह लेने’ सामान्य पाठक के लिए बोधगम्य रहते हुए टोही-जाँच का भाव देता है। ‘मन’ हिन्दी में לֵבָב के अंतरमन/विचार के रूपक को सहज रूप में बनाए रखता है।
