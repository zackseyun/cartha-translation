  text: तब यहोशू ने उसे आशीर्वाद दिया और यपुन्ने के पुत्र कालेब को हेब्रोन विरासत के रूप में दे दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: उसने उसे आशीर्वाद दिया
  rationale: क्रिया ברך के साथ तृतीय पुरुष एकवचन पुल्लिंग कर्म-प्रत्यय का सीधा अर्थ ‘उसने उसे आशीर्वाद दिया’ है। प्रसंग में ‘उसे’ का स्पष्ट संकेत कालेब की ओर है, इसलिए मूल की सर्वनामात्मक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: हिब्रू व्यक्तिगत नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: וַיִּתֵּן
  choice: दे दिया
  rationale: נתן का मूल अर्थ ‘देना’ है। कथात्मक क्रम और भूमि के विधिवत आवंटन को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘दे दिया’ चुना गया है।
- source_word: אֶת חֶבְרוֹן
  choice: हेब्रोन
  rationale: אֶת कर्म-सूचक चिह्न है और हिन्दी में अलग से अनूदित नहीं होता; חֶבְרוֹן स्थान-नाम है, जिसे ‘हेब्रोन’ रूप में लिप्यंतरित किया गया है।
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: यपुन्ने के पुत्र कालेब को
  rationale: לְ अप्रत्यक्ष कर्म को चिह्नित करता है। हिन्दी के स्वाभाविक पदक्रम में वंश-संबंधी पदबंध को नाम से पहले रखा गया है।
- source_word: לְנַחֲלָה
  choice: विरासत में
  rationale: נַחֲלָה यहाँ इस्राएल में आवंटित पैतृक भूमि को दर्शाता है। ‘विरासत में’ संक्षिप्त, स्वाभाविक और भूमि-अधिकार के भाव के अनुकूल है।
