base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/014.yaml
  text: Therefore Hebron became the inheritance of Caleb son of Jephunneh the Kenizzite to this day[a], because he fully followed Yahweh, the God of Israel.
translation:
  language: hi
  text: इस कारण हेब्रोन यपुन्ने के पुत्र, कनिज्जी कालेब की विरासत बन गया और आज तक बना हुआ है, क्योंकि उसने इस्राएल के परमेश्वर यहोवा का पूरी तरह अनुसरण किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरे मन से यहोवा का अनुसरण किया।” इब्रानी मुहावरे का शाब्दिक रूप है, “यहोवा के पीछे पूरा किया”; यह सम्पूर्ण निष्ठा व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: इस कारण
  rationale: यह पद पिछली घटना के परिणाम को बताता है; यह अभिव्यक्ति कारण और परिणाम का संबंध स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: הָיְתָה ... לְנַחֲלָה
  choice: विरासत बना हुआ है
  rationale: इब्रानी रचना किसी वस्तु के विरासत बन जाने और उस स्थिति के वर्णनकर्ता के समय तक बने रहने को व्यक्त करती है।
- source_word: חֶבְרוֹן
  choice: हेब्रोन
  rationale: स्थान-नाम का हिन्दी बाइबल परंपरा में प्रचलित लिप्यंतरण।
- source_word: לְכָלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: यपुन्ने के पुत्र कालेब कनिज्जी की
  rationale: לְ यहाँ स्वामित्व अथवा लाभार्थी संबंध दिखाता है; हिन्दी में संबंधकारक रचना स्वाभाविक है।
- source_word: לְנַחֲלָה
  choice: विरासत
  rationale: भूमि-वितरण के प्रसंग में נַחֲלָה आवंटित पैतृक अधिकार या विरासत को दर्शाता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: वर्णनकर्ता के वर्तमान समय तक स्थिति जारी रहने का स्वाभाविक हिन्दी मुहावरा।
- source_word: יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: कालेब को विरासत मिलने का कारण स्पष्ट करता है।
- source_word: מִלֵּא אַחֲרֵי
  choice: के पीछे पूरी तरह चला
  rationale: इब्रानी मुहावरे की अनुगमन-छवि को बनाए रखते हुए सम्पूर्ण निष्ठा का अर्थ व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम का हिन्दी में व्यापक और पहचाना हुआ लिप्यंतरण, इसे केवल किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: इब्रानी संबंधसूचक संरचना और वाचाई पहचान को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों में स्थापित ‘यहोवा’ उस नाम को उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में सुरक्षित रखता है; ‘याहवे’ विद्वत्तापरक वैकल्पिक लिप्यंतरण है।
- issue: מִלֵּא אַחֲרֵי में कालेब की निष्ठा
  choice: यहोवा के पीछे पूरी तरह चला
  alternative: पूरे मन से यहोवा का अनुसरण किया
  rationale: मुख्य पाठ मूल मुहावरे की ‘पीछे चलने’ वाली छवि तथा पूर्णता दोनों को सुरक्षित रखता है; वैकल्पिक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। भूमि-वितरण के प्रसंग के लिए ‘विरासत’ चुना गया है, और मूल इब्रानी मुहावरे की छवि मुख्य पाठ में सुरक्षित है।
