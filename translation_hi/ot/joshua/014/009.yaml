  text: וַ/יִּשָּׁבַ֣ע מֹשֶׁ֗ה בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמֹר֒ אִם לֹ֗א הָ/אָ֨רֶץ֙ אֲשֶׁ֨ר דָּרְכָ֤ה רַגְלְ/ךָ֙ בָּ֔/הּ לְ/ךָ֨ תִֽהְיֶ֧ה לְ/נַחֲלָ֛ה וּ/לְ/בָנֶ֖י/ךָ עַד עוֹלָ֑ם כִּ֣י מִלֵּ֔אתָ אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/009.yaml
  text: And Moses swore on that day[a], saying, ‘Surely the land on which your foot has trodden shall be an inheritance for you and for your sons forever[b], because you have fully followed Yahweh my God.’
translation:
  language: hi
  text: और मूसा ने उस दिन शपथ खाकर कहा, “निश्चय ही जिस भूमि पर तुम्हारा पाँव पड़ा है, वह सदा के लिए तुम्हारी और तुम्हारे पुत्रों की विरासत होगी[a], क्योंकि तुम पूरी निष्ठा से मेरे परमेश्वर याहवे के पीछे चले हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे वंशजों की।” इब्रानी में शाब्दिक रूप से “तुम्हारे पुत्रों की” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: शपथ खाकर कहा
  rationale: निफ़अल क्रिया का अर्थ ‘शपथ खाना’ है; अगले לֵאמֹר के साथ यह स्वाभाविक आधुनिक हिन्दी वाक्य बनाता है।
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: यह शाब्दिक शर्त नहीं, बल्कि शपथ में प्रयुक्त बलसूचक इब्रानी मुहावरा है।
- source_word: הָאָרֶץ אֲשֶׁר דָּרְכָה רַגְלְךָ בָּהּ
  choice: जिस भूमि पर तुम्हारा पाँव पड़ा है
  rationale: एकवचन ‘पाँव’ और भूमि पर पाँव पड़ने की ठोस छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תִהְיֶה לְךָ לְנַחֲלָה
  choice: तुम्हारी ... विरासत होगी
  rationale: נַחֲלָה पैतृक अथवा आवंटित स्थायी संपत्ति को दर्शाता है; ‘विरासत’ भविष्यकालीन प्रतिज्ञा सहित इस भाव को व्यक्त करती है।
- source_word: וּלְבָנֶיךָ
  choice: तुम्हारे पुत्रों की
  rationale: मूल पाठ में स्पष्ट रूप से पुल्लिंग बहुवचन ‘पुत्र’ है; व्यापक वंशज-अर्थ की संभावना पादटिप्पणी में दी गई है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: दीर्घस्थायी काल को आधुनिक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: כִּי מִלֵּאתָ אַחֲרֵי
  choice: क्योंकि तुम पूरी निष्ठा से ... के पीछे चले हो
  rationale: इब्रानी मुहावरे में पूर्णतः अथवा पूरे मन से अनुसरण करने का भाव है; यह रूपक और समर्पण दोनों को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबिलीय प्रयोग में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुरक्षरीय दिव्य नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: אֱלֹהָי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है। आधुनिक हिन्दी के व्यापक बाइबिलीय परिचय के कारण ‘यहोवा’ चुना गया, जबकि इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: וּלְבָנֶיךָ में उत्तराधिकारियों का लिंग और विस्तार
  choice: तुम्हारे पुत्रों
  alternative: तुम्हारे वंशजों
  rationale: मुख्य पाठ मूल के स्पष्ट ‘पुत्रों’ को सुरक्षित रखता है; प्रसंग में वंशजों तक व्यापक अर्थ संभव होने के कारण विकल्प पादटिप्पणी में है।
- issue: עַד עוֹלָם की अवधि
  choice: सदा के लिए
  alternative: स्थायी रूप से
  rationale: मूल की व्यापक कालगत अभिव्यक्ति को बिना यह तय किए सुरक्षित रखा गया है कि उसका दार्शनिक अर्थ अनंतता है या वंशानुगत स्थायित्व।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। शपथ-सूत्र אִם לֹא का बल मुख्य पाठ में ‘निश्चय ही’ से व्यक्त किया गया है। प्रत्यक्ष कथन के भीतर प्राकृतिक हिन्दी शब्दक्रम रखा गया है और भूमि, पाँव तथा पीछे चलने की मूल छवियाँ सुरक्षित हैं।
