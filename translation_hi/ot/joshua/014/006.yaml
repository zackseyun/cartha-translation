  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי יְהוּדָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בַּ/גִּלְגָּ֔ל וַ/יֹּ֣אמֶר אֵלָ֔י/ו כָּלֵ֥ב בֶּן יְפֻנֶּ֖ה הַ/קְּנִזִּ֑י אַתָּ֣ה יָדַ֡עְתָּ אֶֽת הַ/דָּבָר֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֜ה אֶל מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֗ים עַ֧ל אֹדוֹתַ֛/י וְ/עַ֥ל אֹדוֹתֶ֖י/ךָ בְּ/קָדֵ֥שׁ בַּרְנֵֽעַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/006.yaml
  text: Then the sons of Judah came near to Joshua at Gilgal[a], and Caleb son of Jephunneh the Kenizzite said to him, “You know the word that Yahweh spoke to Moses the man of God concerning me and concerning you at Kadesh-barnea.”
translation:
  language: hi
  text: तब यहूदा के वंशज गिलगाल में यहोशू के पास आए, और यपुन्ने का पुत्र, कनिज्जी कालेब, ने उससे कहा, “तुम उस वचन[a] को जानते हो जो याहवे ने परमेश्वर के जन मूसा से कादेश-बर्ने में मेरे और तुम्हारे विषय में कहा था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बात” अथवा “मामला।”
    reason: דבר के संभावित शब्दार्थ-विकल्पों को दर्शाता है।
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: पास आए
  rationale: नגשׁ का मूल भाव निकट आने या सामने उपस्थित होने का है; ‘पास आए’ आधुनिक हिन्दी में स्वाभाविक रूप से कथात्मक गति को व्यक्त करता है।
- source_word: בְנֵי יְהוּדָה
  choice: यहूदा के वंशज
  rationale: शाब्दिक ‘यहूदा के पुत्र’ यहाँ गोत्रीय समुदाय का संकेत है। ‘वंशज’ उस पारिवारिक-गोत्रीय अर्थ को बनाए रखते हुए आधुनिक हिन्दी में अधिक स्पष्ट है।
- source_word: בַּגִּלְגָּל
  choice: गिलगाल में
  rationale: स्थानवाचक בְּ को इस प्रसंग में स्वाभाविक हिन्दी ‘में’ से व्यक्त किया गया है।
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: कनिज्जी यपुन्ने के पुत्र कालेब
  rationale: वंश/कुल-सूचक ‘कनिज्जी’ को बनाए रखा गया है और हिन्दी में संबंध स्पष्ट करने के लिए स्वाभाविक पदक्रम अपनाया गया है।
- source_word: אַתָּה יָדַעְתָּ
  choice: तुम ... जानते हो
  rationale: इब्रानी पूर्ण क्रिया यहाँ वर्तमान ज्ञान की अवस्था व्यक्त करती है; हिन्दी वर्तमान काल उसी अर्थ को स्वाभाविक रूप से देता है।
- source_word: הַדָּבָר
  choice: वचन
  rationale: דבר का अर्थ ‘वचन’, ‘बात’ या ‘विषय’ हो सकता है। यहाँ यह याहवे के कहे हुए विशिष्ट कथन को सूचित करता है, इसलिए ‘वचन’ चुना गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: מֹשֶׁה אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन मूसा
  rationale: ‘परमेश्वर का जन’ हिन्दी बाइबलीय भाषा में איש האלהים की स्वाभाविक और प्रतिष्ठित उपाधि है।
- source_word: עַל אֹדוֹתַי וְעַל אֹדוֹתֶיךָ
  choice: मेरे और तुम्हारे विषय में
  rationale: दोहराए गए इब्रानी संबंधसूचक पद का अर्थ दोनों व्यक्तियों के संबंध में है; हिन्दी में संयुक्त संरचना अर्थ को स्पष्ट और सहज रखती है।
- source_word: בְּקָדֵשׁ בַּרְנֵעַ
  choice: कादेश-बर्ने में
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण और प्रसंगानुकूल स्थानवाचक ‘में’ प्रयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: בְנֵי יְהוּדָה का गोत्रीय और लिंग-सूचक अर्थ
  choice: यहूदा के वंशज
  alternative: यहूदा के पुत्र / यहूदा के लोग
  rationale: यहाँ वाक्यांश यहूदा के गोत्रीय समूह को सूचित करता है। ‘वंशज’ पारिवारिक वंश-संबंध बनाए रखता है, पर ‘पुत्र’ की ऐसी शाब्दिकता से बचता है जो हिन्दी पाठक को केवल प्रत्यक्ष बेटों का भ्रम दे सकती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। नामों का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है; वाक्य-विन्यास को अनावश्यक रूप से इब्रानी जैसा कठोर नहीं बनाया गया।
