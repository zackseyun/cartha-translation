source:
  edition: WLC
  text: וְ/שֵׁ֨ם חֶבְר֤וֹן לְ/פָנִים֙ קִרְיַ֣ת אַרְבַּ֔ע הָ/אָדָ֧ם הַ/גָּד֛וֹל בָּ/עֲנָקִ֖ים ה֑וּא וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/015.yaml
  text: The former name of Hebron was Kiriath-arba[a]; Arba was the greatest man among the Anakim[c][b]. And the land had rest from war.
translation:
  language: hi
  text: हेब्रोन का पुराना नाम किर्यत-अरबा[a] था; अरबा अनाकियों में सबसे महान व्यक्ति था[b]। और देश को युद्ध से विश्राम मिला[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘किर्यत-अरबा’ का संभावित अर्थ ‘अरबा का नगर’ है।
    reason: lexical_alternative
  - marker: b
    text: या, “अरबा अनाकियों में महान व्यक्ति था”; इब्रानी वाक्यांश उसे अनाकियों से जुड़ा प्रमुख व्यक्ति भी बता सकता है।
    reason: alternative_reading
  - marker: c
    text: या, “देश युद्ध से शांत था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁם חֶבְרוֹן לְ/פָנִים
  choice: हेब्रोन का पुराना नाम
  rationale: לְפָנִים का अर्थ यहाँ ‘पहले/पुराना’ है। हिंदी में ‘पुराना नाम’ सहज रूप से पूर्व नाम को व्यक्त करता है; आरंभिक וְ को अलग से ‘और’ कहना आवश्यक नहीं है।
- source_word: קִרְיַת אַרְבַּע
  choice: किर्यत-अरबा
  rationale: यह स्थान का नाम है, इसलिए अर्थानुवाद के बजाय उसका लिप्यंतरण किया गया है; संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: הָ/אָדָם הַ/גָּד֛וֹל בָּ/עֲנָקִ֖ים ה֑וּא
  choice: अरबा अनाकियों में सबसे महान व्यक्ति था
  rationale: सर्वनाम הוּא का संदर्भ स्पष्ट करने के लिए हिंदी में ‘अरबा’ दोहराया गया है। הַגָּדוֹל को इस प्रसंग में समूह के भीतर उसकी प्रमुखता बताने वाला माना गया है, पर ‘महान व्यक्ति’ वाला कम तुलनात्मक पाठ पादटिप्पणी में सुरक्षित है।
- source_word: עֲנָקִים
  choice: अनाकियों
  rationale: यह अनाक से जुड़े जनसमूह का इब्रानी नाम है; हिंदी बहुवचन-संबंध रूप ‘अनाकियों’ स्पष्ट और स्वाभाविक है।
- source_word: וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה
  choice: और देश को युद्ध से विश्राम मिला
  rationale: שׁקט युद्ध या अशांति के रुकने से प्राप्त चैन/विश्राम को दर्शाता है। ‘विश्राम मिला’ विजय-वृत्तांत में स्वाभाविक है और מִן द्वारा व्यक्त ‘युद्ध से’ अलगाव को बनाए रखता है।
theological_decisions:
- issue: अरबा की अनाकियों के बीच स्थिति
  choice: सबसे महान व्यक्ति
  alternative: अनाकियों में महान व्यक्ति / अनाकियों का प्रमुख व्यक्ति
  rationale: निश्चित विशेषण הַגָּדוֹל प्रसंग में अरबा की विशिष्ट प्रमुखता बता सकता है, पर इब्रानी रूप स्वयं स्पष्ट रूप से सर्वोच्चावस्था नहीं है; इसलिए विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। व्यक्तिवाचक नामों का देवनागरी लिप्यंतरण किया गया है; इब्रानी की वास्तविक अर्थगत संभावनाएँ पादटिप्पणियों में सुरक्षित हैं।
