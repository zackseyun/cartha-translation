  text: עוֹדֶ֨/נִּי הַ/יּ֜וֹם חָזָ֗ק כַּֽ/אֲשֶׁר֙ בְּ/י֨וֹם שְׁלֹ֤חַ אוֹתִ/י֙ מֹשֶׁ֔ה כְּ/כֹ֥חִ/י אָ֖ז וּ/כְ/כֹ֣חִ/י עָ֑תָּה לַ/מִּלְחָמָ֖ה וְ/לָ/צֵ֥את וְ/לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/011.yaml
  text: I am still as strong today as I was on the day Moses sent me; as my strength was then[a], so my strength is now, for battle and for going out and coming in.
translation:
  language: hi
  text: मैं आज भी उतना ही बलवान हूँ जितना उस दिन था जब मूसा ने मुझे भेजा था। जैसा मेरा बल तब था, वैसा ही मेरा बल अब भी है—युद्ध के लिए और बाहर जाने और भीतर आने के लिए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “बाहर जाने और भीतर आने के लिए।” यह एक हिब्रू मुहावरा है, जो कार्य और नेतृत्व में पूरी सक्रिय सामर्थ्य का संकेत दे सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: עוֹדֶנִּי הַיּוֹם חָזָק
  choice: मैं आज भी ... बलवान हूँ
  rationale: यह हिब्रू के निरंतर वर्तमान भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; חָזָק यहाँ शारीरिक और सैनिक सामर्थ्य बताता है।
- source_word: כַּאֲשֶׁר בְּיוֹם שְׁלֹחַ אוֹתִי מֹשֶׁה
  choice: जितना उस दिन था जब मूसा ने मुझे भेजा था
  rationale: तुलना और निश्चित भूतकालीन अवसर दोनों को स्पष्ट रखते हुए हिन्दी में सहज वाक्य-विन्यास अपनाया गया है।
- source_word: כְּכֹחִי אָז וּכְכֹחִי עָתָּה
  choice: जैसा मेरा बल तब था, वैसा ही मेरा बल अब भी है
  rationale: हिब्रू की संतुलित, क्रियारहित तुलना को हिन्दी में आवश्यक क्रियाओं सहित स्पष्ट और निकट रूप में रखा गया है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध करने के लिए
  rationale: यहाँ शब्द कालेब की व्यक्तिगत युद्ध-क्षमता दर्शाता है; क्रियात्मक हिन्दी इस आशय को स्वाभाविक बनाती है।
- source_word: וְלָצֵאת וְלָבוֹא
  choice: बाहर जाने तथा भीतर आने के लिए
  rationale: हिब्रू की युग्मित अभिव्यक्ति को व्याख्यात्मक अर्थ से बदलने के बजाय प्रत्यक्ष रूप में सुरक्षित रखा गया है।
