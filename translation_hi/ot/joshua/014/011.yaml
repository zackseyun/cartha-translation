translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बाहर जाने तथा भीतर आने’ की हिब्रू अभिव्यक्ति को मूल रूप में रखा गया है, ताकि उसकी सैनिक, सक्रिय या नेतृत्व-संबंधी व्यापकता को अनावश्यक रूप से किसी एक अर्थ तक सीमित न किया जाए।
