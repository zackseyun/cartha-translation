  text: בְּ/גוֹרַ֖ל נַחֲלָתָ֑/ם כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/002.yaml
  text: Their inheritance was by lot[a], as Yahweh had commanded through Moses, for the nine tribes and the half-tribe.
translation:
  language: hi
  text: उनकी विरासत चिट्ठी डालकर बाँटी गई, जैसा याहवे ने मूसा के द्वारा[a] नौ गोत्रों और आधे गोत्र के लिए आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “मूसा के हाथ से”; यह इब्रानी मुहावरा माध्यम या प्रतिनिधित्व को दर्शाता है।'
    reason: मूल इब्रानी मुहावरे के शाब्दिक रूप और उसके आशय को सुरक्षित रखना।
lexical_decisions:
- source_word: בְּגוֹרָל
  choice: चिट्ठी डालकर
  rationale: בְּ के साथ גּוֹרָל यहाँ भूमि-विभाजन का साधन बताता है। ‘चिट्ठी डालकर’ आधुनिक हिन्दी में इस प्रक्रिया को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: נַחֲלָתָם
  choice: उनकी विरासत
  rationale: נַחֲלָה यहाँ वाचा के अंतर्गत दिए और बाँटे गए पैतृक भू-भाग को दर्शाता है; ‘विरासत’ इस अर्थ और धार्मिक संदर्भ दोनों को बनाए रखता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: पूर्ण क्रिया उस आज्ञा की ओर संकेत करती है जो भूमि बाँटे जाने से पहले दी जा चुकी थी; इसलिए हिन्दी में पूर्वकालिक संबंध स्पष्ट किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; इसे उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: शाब्दिक रूप ‘मूसा के हाथ से’ है, पर यह इब्रानी मुहावरा माध्यम या प्रतिनिधित्व बताता है। ‘मूसा के द्वारा’ वर्तमान हिन्दी में वही अर्थ स्पष्ट करता है।
- source_word: לְתִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: नौ गोत्रों और आधे गोत्र के लिए
  rationale: לְ प्राप्तकर्ताओं को चिह्नित करता है और מַטֶּה यहाँ ‘गोत्र’ के अर्थ में है। यह रूप पश्चिमी मनश्शे के आधे गोत्र सहित कुल प्राप्तकर्ताओं को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: בְּיַד מֹשֶׁה में मूसा की मध्यस्थ भूमिका
  choice: मूसा के द्वारा
  alternative: मूसा के हाथ से
  rationale: इब्रानी अभिव्यक्ति आज्ञा पहुँचाने के माध्यम या प्रतिनिधि को दर्शाती है। हिन्दी मुहावरे में ‘के द्वारा’ अर्थ को सुरक्षित रखता है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। इब्रानी वाक्य में निहित ‘बाँटी गई’ को हिन्दी में वाक्य पूर्ण और स्वाभाविक बनाने के लिए स्पष्ट किया गया है।
