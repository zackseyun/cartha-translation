source:
  edition: WLC
  text: כִּֽי הָי֧וּ בְנֵֽי יוֹסֵ֛ף שְׁנֵ֥י מַטּ֖וֹת מְנַשֶּׁ֣ה וְ/אֶפְרָ֑יִם וְ/לֹֽא נָתְנוּ֩ חֵ֨לֶק לַ/לְוִיִּ֜ם בָּ/אָ֗רֶץ כִּ֤י אִם עָרִים֙ לָ/שֶׁ֔בֶת וּ/מִ֨גְרְשֵׁי/הֶ֔ם לְ/מִקְנֵי/הֶ֖ם וּ/לְ/קִנְיָנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/004.yaml
  text: For the sons of Joseph were two tribes[a], Manasseh and Ephraim; and they gave no portion to the Levites in the land, except cities to dwell in[c][b], with their pasturelands for their livestock and for their possessions.
translation:
  language: hi
  text: क्योंकि यूसुफ के वंशजों के दो गोत्र थे—मनश्शे और एप्रैम। लेवियों को देश में कोई भाग नहीं दिया गया था; उन्हें केवल रहने के लिए नगर और उनके पशुओं तथा उनकी संपत्ति के लिए उन नगरों के चारों ओर की खुली भूमि दी गई थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या स्पष्टीकरण देता है; ‘क्योंकि’ इस संबंध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: בְנֵי יוֹסֵף
  choice: यूसुफ के वंशज
  rationale: शाब्दिक अर्थ ‘यूसुफ के पुत्र’ है, पर यहाँ आशय उनसे निकले गोत्रीय वंशजों से है। मुख्य पाठ में ‘वंशज’ संदर्भगत अर्थ स्पष्ट करता है और पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: שְׁנֵי מַטּוֹת
  choice: दो गोत्र
  rationale: इस भूमि-विभाजन के संदर्भ में מַטּוֹת का अर्थ दो गोत्रीय समूह है, न कि शाब्दिक ‘लाठियाँ’।
- source_word: מְנַשֶּׁה וְאֶפְרָיִם
  choice: मनश्शे और एप्रैम
  rationale: इन व्यक्तिगत और गोत्रीय नामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
- source_word: וְלֹא נָתְנוּ חֵלֶק
  choice: कोई भाग नहीं दिया गया था
  rationale: हिब्रू में क्रिया सक्रिय बहुवचन है, पर उसका कर्ता इस पद में व्यक्त नहीं है। हिन्दी का कर्मवाच्य अनिर्दिष्ट कर्ता को बनाए रखते हुए भूमि के आवंटित भाग पर बल देता है।
- source_word: לַלְוִיִּם
  choice: लेवियों को
  rationale: बहुवचन रूप लेवी के वंशजों को एक समूह के रूप में दर्शाता है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: यह उस देश को दर्शाता है जिसका गोत्रों में बँटवारा हो रहा था।
- source_word: כִּי אִם
  choice: केवल
  rationale: 'नकार के बाद यह पदबंध अपवाद बताता है: लेवियों को भूभाग नहीं, केवल नगर और उनसे लगी भूमि मिली।'
- source_word: עָרִים לָשֶׁבֶת
  choice: रहने के लिए नगर
  rationale: यह नगर दिए जाने का उद्देश्य सहज और सीधे रूप में व्यक्त करता है।
- source_word: מִגְרְשֵׁיהֶם
  choice: उन नगरों के चारों ओर की खुली भूमि
  rationale: यह शब्द नगरों से लगी खुली भूमि को दर्शाता है, जिसका उपयोग विशेष रूप से पशुओं को चराने और अन्य व्यावहारिक कामों के लिए होता था। ‘खुली भूमि’ इसके अर्थ को केवल चरागाह तक सीमित नहीं करती।
- source_word: לְמִקְנֵיהֶם
  choice: उनके पशुओं के लिए
  rationale: מִקְנֶה पाले हुए पशुओं या मवेशियों के लिए व्यापक शब्द है; ‘पशु’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וּלְקִנְיָנָם
  choice: तथा उनकी संपत्ति के लिए
  rationale: קִנְיָן अर्जित वस्तुओं या अधिकार में रखी संपत्ति का व्यापक अर्थ रखता है; इसे पशुओं से अलग दूसरी मिल्कियत के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: लेवियों को देश में भाग न मिलने और नगर मिलने का संबंध
  choice: मुख्य पाठ में भूमि के गोत्रीय भाग और निवास-नगरों के बीच स्पष्ट भेद रखा गया है।
  alternative: ‘विरासत’ जोड़कर इसे स्पष्ट करना
  rationale: חֵלֶק का सीधा अर्थ ‘भाग’ है। ‘विरासत’ संदर्भगत रूप से संभव है, पर मूल में इस पद पर वह शब्द नहीं है; इसलिए अतिरिक्त धर्मवैचारिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप रखा गया है। लंबे हिब्रू वाक्य को स्पष्टता के लिए दो वाक्यों में बाँटा गया है। ‘गोत्र’, ‘लेवी’ और ‘मनश्शे’ जैसे स्थापित बाइबलीय शब्द बनाए रखे गए हैं, जबकि अस्पष्ट तकनीकी भाषा से बचा गया है।
