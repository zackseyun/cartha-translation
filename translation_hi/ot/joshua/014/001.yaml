base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/001.yaml
  text: These are the inheritances that the sons of Israel received in the land of Canaan[a], which Eleazar the priest, Joshua son of Nun[c][b], and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned to them.
translation:
  language: hi
  text: और ये वे विरासत के भाग हैं जो इस्राएल के पुत्रों को कनान की भूमि में मिले[a], जिन्हें एलीआज़ार याजक, नून के पुत्र यहोशू और इस्राएल के गोत्रों के पैतृक घरानों के मुखियाओं ने इस्राएल के पुत्रों को बाँटे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘इस्राएल के पुत्रों’ के स्थान पर ‘इस्राएलियों’ भी अनुवाद किया जा सकता है। इब्रानी में शाब्दिक पारिवारिक अभिव्यक्ति ‘इस्राएल के पुत्र’ है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिन्हें एलीआज़ार याजक, नून के पुत्र यहोशू और इस्राएल के गोत्रों के पैतृक घरानों के मुखियाओं ने उन्हें विरासत के रूप में दिया।” इब्रानी दोनों खंडों में ‘विरासत’ से संबंधित एक ही धातु दोहराता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ... ये हैं
  rationale: וְ से पिछले वृत्तांत की निरंतरता और אֵלֶּה से नए खंड का परिचय व्यक्त होता है; हिन्दी में आरम्भिक ‘और’ स्वाभाविक रूप से यह संबंध बनाए रखता है।
- source_word: נָחֲלוּ
  choice: विरासत में मिले
  rationale: यहाँ क़ाल रूप इस्राएल के पुत्रों द्वारा निर्धारित भू-भाग प्राप्त करने को दर्शाता है। ‘विरासत में मिले’ मूल धातु נחל का भाव बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी के पारिवारिक और वाचाई पदबंध को प्रत्यक्ष रखता है; अधिक मुहावरेदार ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: मूल में אֶרֶץ स्पष्ट है और भूमि-विरासत के प्रसंग में महत्त्वपूर्ण है; ‘देश’ क्षेत्रीय बल को बनाए रखता है।
- source_word: אֲשֶׁר נִחֲלוּ אוֹתָם
  choice: इन्हें ... उनके लिए बाँटा
  rationale: निफ़ाल रूप यहाँ नियुक्त अगुओं द्वारा विरासत के औपचारिक वितरण को व्यक्त करता है। हिन्दी में ‘बाँटा’ प्रशासनिक आवंटन को सहजता से बताता है, जबकि पहले वाक्य में विरासत का मूल भाव स्पष्ट है।
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: एलीआज़ार याजक
  rationale: नाम का मानक हिन्दी लिप्यंतरण और כהן के लिए प्रचलित बाइबलीय पद ‘याजक’ प्रयुक्त है।
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: नून के पुत्र यहोशू
  rationale: इब्रानी पितृनाम-संबंध को हिन्दी की स्वाभाविक संबंध-रचना में रखा गया है।
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: गोत्रों के पैतृक घरानों के मुखियाओं
  rationale: ‘मुखिया’ רֹאשׁ का नेतृत्वार्थ, ‘पैतृक घराने’ אָבוֹת की वंशाधारित सामाजिक इकाइयाँ, और ‘गोत्र’ מַטֶּה की जनजातीय संरचना व्यक्त करते हैं।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों
  rationale: यह पदबंध निकटवर्ती ‘गोत्रों’ को विशेषित करता है। हिन्दी में ‘इस्राएल के गोत्र’ उसी संबंध को संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: בני ישראל का लिंगयुक्त वाचाई जातिनाम
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल का पुल्लिंग बहुवचन पारिवारिक पदबंध सुरक्षित रखा गया है, बिना यह दावा जोड़े कि भूमि-विरासत के समुदाय में केवल पुरुष सम्मिलित थे। मुहावरेदार जातिनाम पादटिप्पणी में है।
- issue: אבות में पितृवंशीय सामाजिक शब्दावली
  choice: पैतृक घरानों
  alternative: वंशों / कुलों
  rationale: यह चुनाव मूल संसार की पितृवंशीय संगठन-व्यवस्था को दृश्यमान रखता है, लेकिन हिन्दी में अस्वाभाविक ‘पिताओं के घर’ से बचता है।
- issue: נחל धातु की पुनरावृत्ति
  choice: विरासत में मिले ... बाँटा
  alternative: विरासत में मिले ... विरासत के रूप में दिया
  rationale: इब्रानी एक ही धातु से प्राप्ति और आवंटन दोनों को बाँधता है। हिन्दी में हूबहू पुनरावृत्ति भारी होती; इसलिए पहले खंड में ‘विरासत’ स्पष्ट रखकर दूसरे में संदर्भानुकूल ‘बाँटा’ चुना गया और विकल्प पादटिप्पणी में दर्ज है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ गद्य। पद को दो वाक्यों में विभाजित करके घने इब्रानी संबंधवाचक वाक्य को स्पष्ट किया गया है। ‘पैतृक घराने’ सांस्कृतिक संरचना को बनाए रखते हुए ‘पिताओं के घर’ की कृत्रिम शाब्दिकता से बचाता है।
