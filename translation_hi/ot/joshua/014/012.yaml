source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנָ/ה לִּ/י֙ אֶת הָ/הָ֣ר הַ/זֶּ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֣י אַתָּֽה שָׁמַעְתָּ֩ בַ/יּ֨וֹם הַ/ה֜וּא כִּֽי עֲנָקִ֣ים שָׁ֗ם וְ/עָרִים֙ גְּדֹל֣וֹת בְּצֻר֔וֹת אוּלַ֨י יְהוָ֤ה אוֹתִ/י֙ וְ/ה֣וֹרַשְׁתִּ֔י/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/012.yaml
  text: Now give me this hill country that Yahweh spoke about on that day[a], because you yourself heard on that day that the Anakim are there, with great fortified cities. Perhaps Yahweh will be with me, and I will drive them out[b], just as Yahweh said.
translation:
  language: hi
  text: अब मुझे यह पहाड़ी प्रदेश दे दीजिए[a], जिसके विषय में याहवे ने उस दिन कहा था; क्योंकि आपने स्वयं उस दिन सुना था कि वहाँ अनाकी लोग हैं और बड़े-बड़े किलेबंद नगर हैं। शायद याहवे मेरे साथ हो, और मैं उन्हें निकाल दूँ, जैसा याहवे ने कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह पहाड़।” इब्रानी הָהָר का अर्थ एक पहाड़ या कोई पहाड़ी क्षेत्र, दोनों हो सकता है; यहाँ व्यापक क्षेत्र का अर्थ अधिक सम्भावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह कालेब की वर्तमान विनती आरम्भ करने वाला प्रसंग-सूचक है; हिन्दी में ‘अब’ स्वाभाविक है।
- source_word: תְּנָה לִּי
  choice: मुझे ... दे दीजिए
  rationale: נתן के आज्ञार्थक रूप और परोक्ष कर्म का सीधा अर्थ रखता है; सम्मानसूचक संबोधन के कारण ‘दीजिए’ उपयुक्त है।
- source_word: אֶת־הָהָר הַזֶּה
  choice: यह पहाड़ी प्रदेश
  rationale: הַר एक पहाड़ या पहाड़ी भूभाग दोनों का सूचक हो सकता है; भूमि-विभाजन के संदर्भ में क्षेत्रीय अर्थ अधिक उपयुक्त है।
- source_word: אֲשֶׁר דִּבֶּר יְהוָה
  choice: जिसके विषय में यहोवा ने ... कहा था
  rationale: דבר का मूल अर्थ ‘कहा/बोला’ सुरक्षित रहता है; इसे स्पष्ट रूप से ‘प्रतिज्ञा की’ कहकर अधिक व्याख्यायित नहीं किया गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: כִּי אַתָּה שָׁמַעְתָּ
  choice: क्योंकि आपने स्वयं ... सुना था
  rationale: כִּי कारण बताता है और स्वतंत्र सर्वनाम אַתָּה का बल ‘स्वयं’ से प्रकट होता है।
- source_word: כִּי עֲנָקִים שָׁם
  choice: कि वहाँ अनाकी लोग हैं
  rationale: जनसमूह के नाम को हिन्दी में पहचाने जाने योग्य रूप में रखा गया और वर्तमान स्थिति का संकेत सुरक्षित किया गया।
- source_word: וְעָרִים גְּדֹלוֹת בְּצֻרוֹת
  choice: और बड़े-बड़े किलेबंद नगर हैं
  rationale: दोनों विशेषताओं—विशालता और सुदृढ़ किलेबंदी—को स्वाभाविक हिन्दी में रखा गया है।
- source_word: אוּלַי
  choice: शायद
  rationale: यह विनम्र आशा और अनिश्चितता को बिना मिटाए सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה אוֹתִי
  choice: यहोवा मेरे साथ रहे
  rationale: मूल वाक्य क्रियारहित है; प्रसंग में भावी युद्ध के लिए परमेश्वर की उपस्थिति और सहायता की आशा व्यक्त होती है। ‘रहे’ उस आशापूर्ण भाव को ‘होगा’ से कम निर्णायक ढंग से रखता है।
- source_word: וְהוֹרַשְׁתִּים
  choice: मैं उन्हें निकाल दूँ
  rationale: हिफ़ील रूप यहाँ देश के निवासियों को हटाने या खदेड़ने का अर्थ देता है; ‘निकाल दूँ’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम आया है। हिन्दी पाठक के लिए स्थापित लिप्यंतरण ‘यहोवा’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: אוּלַי יְהוָה אוֹתִי का भाव
  choice: शायद यहोवा मेरे साथ रहे
  alternative: शायद यहोवा मेरे साथ होगा / शायद यहोवा मेरी सहायता करे
  rationale: אוּלַי की वास्तविक अनिश्चितता तथा क्रियारहित वाक्य की अस्पष्टता सुरक्षित रखी गई है; ‘सहायता करे’ निहितार्थ को स्पष्ट तो करता, पर मूल से अधिक कहता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यहोशू के प्रति कालेब के संबोधन में आदरसूचक ‘आप’ और ‘दीजिए’ प्रयुक्त हैं। मूल की पुनरावृत्ति ‘उस दिन’ और ‘जैसा यहोवा ने कहा था’ सुरक्षित रखी गई है।
