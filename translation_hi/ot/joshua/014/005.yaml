base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/005.yaml
  text: Just as Yahweh had commanded Moses[a], so the sons of Israel did, and they divided the land.
translation:
  language: hi
  text: जैसा याहवे ने मूसा को आज्ञा दी थी, वैसा ही इस्राएल की संतानों[a] ने किया, और उन्होंने भूमि को बाँटा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस्राएलियों’। इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है; यह इस्राएल के लोगों के लिए प्रचलित सामूहिक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: जैसा ... वैसा ही
  rationale: यह सहसम्बन्धी हिन्दी रचना आज्ञा और उसके पालन के बीच मूल इब्रानी में व्यक्त सटीक अनुरूपता को स्वाभाविक ढंग से बनाए रखती है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: क्रिया का अर्थ आदेश देना है; ‘दी थी’ यह स्पष्ट करता है कि आज्ञा इस्राएल के कार्य से पहले दी गई थी।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यन्तरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: אֶת מֹשֶׁה
  choice: मूसा को
  rationale: צִוָּה के साथ मूसा वह व्यक्ति है जिसे आज्ञा दी गई; हिन्दी में ‘मूसा को आज्ञा दी’ स्वाभाविक है।
- source_word: עָשׂוּ
  choice: ने किया
  rationale: मूल की सामान्य और संक्षिप्त ‘करना’ क्रिया को बनाए रखता है; उसका आशय पूर्वोक्त आज्ञा के पालन से स्पष्ट होता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल की सन्तानों
  rationale: शाब्दिक वंशगत अभिव्यक्ति को सुरक्षित रखता है और साथ ही इसे पूरे इस्राएली समुदाय के लिए प्रयुक्त सामूहिक पद के रूप में समझने देता है।
- source_word: וַיַּחְלְקוּ
  choice: और उन्होंने ... बाँटा
  rationale: क्रिया भूमि को भागों में बाँटने या आवंटित करने को व्यक्त करती है; ‘बाँटा’ सरल, स्वाभाविक और स्रोत के निकट है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: यहोशू के प्रसंग में यह कनान की भूमि को सूचित करता है, समूची पृथ्वी को नहीं; हिन्दी में ‘देश’ इस संदर्भ के लिए स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम स्वयं उपस्थित है। ‘याहवे’ उसका लिप्यन्तरण करके नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: בְּנֵי יִשְׂרָאֵל की सामूहिक अभिव्यक्ति
  choice: इस्राएल की सन्तानें
  alternative: इस्राएली
  rationale: मूल अभिव्यक्ति वंशगत रूप से ‘इस्राएल के बेटे/सन्तानें’ कहती है, पर पूरे समुदाय को सूचित करती है। ‘सन्तानें’ स्रोत की आकृति और सामूहिक अर्थ दोनों को बनाए रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘जैसा ... वैसा ही’ मूल वाक्य की अनुरूपता को स्पष्ट रखता है; ‘देश को बाँटा’ अनावश्यक व्याख्या जोड़े बिना भूमि-विभाजन का अर्थ देता है।
