  text: परन्तु मेरे साथ जाने वाले मेरे भाइयों ने लोगों के हृदय पिघला दिए, जबकि मैंने अपने परमेश्वर यहोवा का पूरी निष्ठा से अनुसरण किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַי
  choice: मेरे भाइयों
  rationale: इब्रानी में शाब्दिक अर्थ ‘मेरे भाई’ है; प्रसंग में यह कालेब के साथ गए सहचर भेदियों को दर्शाता है।
- source_word: הִמְסִיו אֶת־לֵב הָעָם
  choice: लोगों का हृदय पिघला दिया
  rationale: मूल रूपक को बनाए रखता है और लोगों के साहस टूटने तथा भयभीत होने का भाव व्यक्त करता है।
- source_word: מִלֵּאתִי אַחֲרֵי
  choice: के पीछे पूरी निष्ठा से चला
  rationale: यह मुहावरा किसी का पूर्णतः अनुसरण करने का अर्थ देता है; ‘पूरी निष्ठा से’ पूर्ण समर्पण के भाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
theological_decisions:
- issue: कालेब के अनुसरण की पूर्णता
  choice: पूरी निष्ठा से चला
  alternative: पूरी तरह अनुसरण किया
  rationale: यह कालेब की निष्कपट और पूर्ण प्रतिबद्धता को व्यक्त करता है, पर उसे पापरहित सिद्ध करने जैसा अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: विरोधसूचक वाक्य-संबंध
  choice: जबकि मैं
  alternative: परन्तु मैं
  rationale: पहले खंड में सहचर भेदियों के प्रभाव और दूसरे में कालेब की निष्ठा के बीच मूल विरोध को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
