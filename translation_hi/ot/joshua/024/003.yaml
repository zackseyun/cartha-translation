  text: וָ֠/אֶקַּח אֶת אֲבִי/כֶ֤ם אֶת אַבְרָהָם֙ מֵ/עֵ֣בֶר הַ/נָּהָ֔ר וָ/אוֹלֵ֥ךְ אוֹת֖/וֹ בְּ/כָל אֶ֣רֶץ כְּנָ֑עַן ו/ארב אֶת זַרְע֔/וֹ וָֽ/אֶתֶּן ל֖/וֹ אֶת יִצְחָֽק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/003.yaml
  text: Then I took your father Abraham from beyond the River[a], and I led him through all the land of Canaan[b], and I multiplied his offspring and gave him Isaac.
translation:
  language: hi
  text: तब मैं तुम्हारे पिता अब्राहम को उस नदी के पार से ले आया[a] और उसे कनान के सारे देश में फिराया। मैंने उसके वंश[b] को बहुत बढ़ाया और उसे इसहाक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उस नदी’ से संभवतः फरात नदी का संकेत है।
    reason: cultural_note
  - marker: b
    text: या ‘उसकी संतान’; इब्रानी शब्द का शाब्दिक अर्थ ‘बीज’ है और यहाँ वह सामूहिक अर्थ में वंश अथवा वंशजों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: तब मैं ... ले आया
  rationale: לקח का यह रूप परमेश्वर के बीते हुए कार्य को कथा-क्रम में बताता है। संदर्भ में ‘ले आया’ हिन्दी में स्रोत-स्थान से कनान की ओर लाने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲבִיכֶם
  choice: तुम्हारे पिता
  rationale: ‘पिता’ इब्रानी के पारिवारिक और वाचागत पूर्वज-संबंधी मुहावरे को सुरक्षित रखता है; ‘पूर्वज’ अधिक व्याख्यात्मक होता।
- source_word: מֵעֵבֶר הַנָּהָר
  choice: उस नदी के पार से
  rationale: מֵעֵבֶר स्थान के दूसरी ओर से आने का भाव देता है और निश्चित הַנָּהָר को ‘उस नदी’ से व्यक्त किया गया है। नदी का नाम मुख्य पाठ में जोड़ने के बजाय टिप्पणी में दिया गया है।
- source_word: וָאוֹלֵךְ אוֹתוֹ
  choice: और उसे ... ले गया
  rationale: הלך का हिफ़ील रूप प्रेरणार्थक है। ‘ले गया’ आधुनिक हिन्दी में इस गति और परमेश्वर द्वारा मार्ग दिखाकर पहुँचाने के भाव को सहज रूप से व्यक्त करता है।
- source_word: בְּכָל אֶרֶץ כְּנָעַן
  choice: कनान के सारे देश में
  rationale: בְּ यहाँ यात्रा के क्षेत्र को दर्शाता है; ‘सारे देश में’ पूरे कनान में हुई गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וָאַרְבֶּה
  choice: मैंने ... बहुत बढ़ाया
  rationale: רבה के हिफ़ील का अर्थ बहुत करना या बढ़ाना है। ‘बहुत बढ़ाया’ संख्या-वृद्धि को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: זַרְעוֹ
  choice: उसके वंश
  rationale: זֶרַע सामूहिक एकवचन है और संतान अथवा वंशजों को सूचित कर सकता है। ‘वंश’ हिन्दी में इसके सामूहिक और पीढ़ीगत भाव को संक्षेप में बनाए रखता है।
- source_word: וָאֶתֶּן לוֹ אֶת יִצְחָק
  choice: और उसे इसहाक दिया
  rationale: यह रचना इसहाक को अब्राहम को परमेश्वर द्वारा दिए गए वरदान के रूप में सीधे व्यक्त करती है और इब्रानी वाक्य-क्रम का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: अब्राहम के लिए पूर्वज-संबंधी संबोधन
  choice: तुम्हारे पिता अब्राहम
  alternative: तुम्हारे पूर्वज अब्राहम
  rationale: मूल पाठ स्पष्ट रूप से ‘पिता’ कहता है। यही रूप इस्राएल के साथ अब्राहम के पारिवारिक और वाचागत संबंध को बनाए रखता है।
- issue: ‘उस नदी’ की पहचान
  choice: मुख्य पाठ में ‘उस नदी’; टिप्पणी में संभावित पहचान
  alternative: मुख्य पाठ में ‘फरात नदी’
  rationale: इब्रानी में नदी का निजी नाम नहीं, बल्कि निश्चित सामान्य संज्ञा है। इसलिए मूल की अभिव्यक्ति मुख्य पाठ में रखी गई और संभावित भौगोलिक पहचान टिप्पणी में दी गई।
- issue: זֶרַע का सामूहिक अर्थ
  choice: वंश
  alternative: संतान; वंशज
  rationale: ‘वंश’ सामूहिक एकवचन की व्यापकता को बनाए रखता है और इसे केवल एक संतान या स्पष्ट बहुवचन में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पिता’ और ‘उस नदी’ जैसे स्रोत-सन्निकट पदों को सुरक्षित रखते हुए अस्वाभाविक शब्दशः हिन्दी से बचा गया है।
