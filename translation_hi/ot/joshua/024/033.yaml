  text: וְ/אֶלְעָזָ֥ר בֶּֽן אַהֲרֹ֖ן מֵ֑ת וַ/יִּקְבְּר֣וּ אֹת֗/וֹ בְּ/גִבְעַת֙ פִּֽינְחָ֣ס בְּנ֔/וֹ אֲשֶׁ֥ר נִתַּן ל֖/וֹ בְּ/הַ֥ר אֶפְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/033.yaml
  text: And Eleazar the son of Aaron died, and they buried him at Gibeath-phinehas, his son’s hill country, which had been given to him in the hill country of Ephraim.
translation:
  language: hi
  text: और हारून का पुत्र एलीआज़ार मर गया। उन्होंने उसे उसके पुत्र पीनहास की गिबा में दफना दिया, जो उसे एप्रैम के पहाड़ी प्रदेश में दी गई थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גִבְעַת פִּינְחָס
  choice: पीनहास की गिबा
  rationale: यह स्थान-नाम रचना है—शाब्दिक रूप से ‘पीनहास की पहाड़ी/गिबा’। ‘गिबा’ को नाम के रूप में रखते हुए संबंध स्पष्ट किया गया है।
- source_word: הַר אֶפְרָיִם
  choice: एप्रैम का पहाड़ी प्रदेश
  rationale: הַר यहाँ केवल एक पहाड़ नहीं, एप्रैम के विस्तृत पहाड़ी भूभाग को दर्शाता है।
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: उन्होंने उसे … दफना दिया
  rationale: हिब्रू के अनिर्दिष्ट बहुवचन कर्ता और एलीआज़ार को सूचित करने वाले कर्म-सर्वनाम को स्वाभाविक हिंदी में बनाए रखा गया है।
theological_decisions:
- issue: אֲשֶׁר נִתַּן לוֹ में ‘उसे’ का संदर्भ
  choice: 'निकटतम पुरुषवाचक संदर्भ पीनहास माना गया है: गिबा उसे दी गई थी।'
  alternative: ‘उसे’ को एलीआज़ार का संदर्भ मानना।
  rationale: वाक्य में ‘उसके पुत्र पीनहास’ निकटतम स्पष्ट पुरुषवाचक पूर्वपद है; स्थान का पीनहास के नाम से जुड़ना भी इसी अर्थ का समर्थन करता है। फिर भी मूल सर्वनाम स्वयं नाम दोहराकर संदर्भ स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। ‘एलीआज़ार’, ‘पीनहास’ और ‘गिबा’ के प्रचलित बाइबलीय लिप्यंतरण रखे गए हैं।
