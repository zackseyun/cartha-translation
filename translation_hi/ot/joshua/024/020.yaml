source:
  edition: WLC
  text: כִּ֤י תַֽעַזְבוּ֙ אֶת יְהוָ֔ה וַ/עֲבַדְתֶּ֖ם אֱלֹהֵ֣י נֵכָ֑ר וְ/שָׁ֨ב וְ/הֵרַ֤ע לָ/כֶם֙ וְ/כִלָּ֣ה אֶתְ/כֶ֔ם אַחֲרֵ֖י אֲשֶׁר הֵיטִ֥יב לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/020.yaml
  text: If you forsake Yahweh and serve foreign gods[a], then he will turn and do you harm and consume you[b], after he has done good to you.
translation:
  language: hi
  text: यदि तुम यहोवा को छोड़कर पराए देवताओं की सेवा करोगे, तो वह पलटकर तुम्हें हानि पहुँचाएगा[a] और तुम्हारा सर्वनाश कर देगा[b], तुम्हारा भला करने के बाद।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम पर विपत्ति लाएगा।” यहाँ इब्रानी क्रिया का अर्थ हानि या विपत्ति पहुँचाना है, नैतिक बुराई करना नहीं।
    reason: lexical_alternative
  - marker: b
    text: या “तुम्हें नष्ट कर देगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: इस चेतावनी में यह शब्द शर्त प्रस्तुत करता है; आधुनिक हिन्दी में ‘यदि’ शर्त और उसके परिणाम का संबंध स्पष्ट करता है।
- source_word: תַעַזְבוּ
  choice: छोड़कर
  rationale: यहाँ क्रिया यहोवा के साथ वाचा-संबंधी निष्ठा त्यागने को व्यक्त करती है; ‘छोड़ना’ स्वाभाविक हिन्दी में इस संबंध-विच्छेद को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: וַעֲבַדְתֶּם
  choice: सेवा करोगे
  rationale: देवताओं के संदर्भ में עבד धार्मिक अधीनता और उपासना-सहित सेवा को दर्शाता है; ‘सेवा करना’ मूल क्रिया के व्यापक अर्थ को बनाए रखता है।
- source_word: אֱלֹהֵי נֵכָר
  choice: पराए देवताओं
  rationale: ‘पराए’ उन देवताओं को दर्शाता है जो इस्राएल और यहोवा के प्रति उसकी निष्ठा से बाहर हैं; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְשָׁב
  choice: पलटकर
  rationale: यह यहोवा के व्यवहार में भलाई से दंड की ओर परिवर्तन दर्शाता है; ‘पलटकर’ मूल रूपक को बनाए रखता है।
- source_word: וְהֵרַע לָכֶם
  choice: तुम्हारा बुरा करेगा
  rationale: हिफ़ील रूप यहाँ हानि या विपत्ति पहुँचाने का अर्थ देता है, नैतिक बुराई करने का नहीं; मुख्य पाठ का संक्षिप्त वाक्यांश और पादटिप्पणी मिलकर यह अर्थ स्पष्ट करते हैं।
- source_word: וְכִלָּה אֶתְכֶם
  choice: तुम्हारा अंत कर देगा
  rationale: כלה पूर्णतः समाप्त कर देने या विनाश तक पहुँचाने को दर्शाता है; यह हिन्दी में तीव्रता बनाए रखते हुए ‘भस्म’ जैसी अनावश्यक चित्रात्मकता नहीं जोड़ता।
- source_word: אַחֲרֵי אֲשֶׁר הֵיטִיב לָכֶם
  choice: जबकि वह तुम्हारा भला कर चुका है
  rationale: वाक्यांश पूर्व में की गई भलाई और बाद के न्याय के तीखे विरोध को दर्शाता है; ‘जबकि’ उस विरोध को स्वाभाविक हिन्दी में उभारता है।
theological_decisions:
- issue: पहले की भलाई के बाद परमेश्वर द्वारा न्याय
  choice: यहोवा को सीधे उस हानि और अंत का कर्ता बताया गया है जो धर्मत्याग के उत्तर में आएगा।
  alternative: इसे केवल मूर्तिपूजा के स्वाभाविक परिणामों के रूप में नरम करके कहना।
  rationale: इब्रानी क्रियाएँ न्यायकारी कार्रवाई सीधे यहोवा से जोड़ती हैं। अनुवाद इस धर्मवैचारिक तनाव को न तो कम करता है और न किसी बाद की सिद्धांत-व्यवस्था से समझाकर समाप्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। शर्त, धर्मत्याग, दैवी प्रत्युत्तर और पूर्व भलाई के बाद न्याय—इन सभी को मूल क्रम के निकट रखा गया है।
