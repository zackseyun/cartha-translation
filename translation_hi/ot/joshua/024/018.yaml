source:
  edition: WLC
  text: וַ/יְגָ֨רֶשׁ יְהוָ֜ה אֶת כָּל הָ/עַמִּ֗ים וְ/אֶת הָ/אֱמֹרִ֛י יֹשֵׁ֥ב הָ/אָ֖רֶץ מִ/פָּנֵ֑י/נוּ גַּם אֲנַ֨חְנוּ֙ נַעֲבֹ֣ד אֶת יְהוָ֔ה כִּי ה֖וּא אֱלֹהֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/018.yaml
  text: And Yahweh drove out from before us all the peoples[a], including the Amorites who lived in the land. We also will serve Yahweh, for he is our God.
translation:
  language: hi
  text: और याहवे ने हमारे सामने से सभी जातियों को[a]—जिनमें देश में रहनेवाले एमोरी भी शामिल थे—निकाल दिया। हम भी याहवे की सेवा करेंगे, क्योंकि वही हमारा परमेश्वर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभी जातियों और देश में रहनेवाले एमोरियों को।”
    reason: וְאֶת הָאֱמֹרִי में वाव को समावेशसूचक समझने के बजाय साधारण संयोजक ‘और’ के रूप में भी समझा जा सकता है।
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: निकाल दिया
  rationale: גרש का अर्थ बलपूर्वक बाहर निकालना या खदेड़ना है। ‘निकाल दिया’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और निष्कासन का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כָּל הָעַמִּים
  choice: सभी जातियों
  rationale: बहुवचन עַמִּים यहाँ अनेक जातीय-राष्ट्रीय समुदायों को दर्शाता है; ‘जातियों’ इस बहुवचन अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: וְאֶת הָאֱמֹרִי
  choice: यहाँ तक कि ... एमोरियों को भी
  rationale: इस वाक्य में एमोरियों को पहले कही गई जातियों में विशेष रूप से सम्मिलित मानकर वाव को व्याख्यात्मक बल के साथ प्रस्तुत किया गया है। साधारण संयोजक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: יֹשֵׁב הָאָרֶץ
  choice: देश में रहनेवाले
  rationale: कर्तृवाचक कृदन्त स्थायी निवास का भाव देता और ‘एमोरियों’ का वर्णन करता है।
- source_word: מִפָּנֵינוּ
  choice: हमारे सामने से
  rationale: यह मूल इब्रानी स्थान-संबंधी बिंब को बनाए रखता है और इस प्रसंग में आगे से बाधा हटाने का अर्थ स्पष्ट करता है।
- source_word: גַּם אֲנַחְנוּ
  choice: हम भी
  rationale: यह यहोशू की पहले कही प्रतिज्ञा के उत्तर में लोगों की समान प्रतिबद्धता को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נַעֲבֹד
  choice: सेवा करेंगे
  rationale: עבד यहाँ आराधना, निष्ठा और आज्ञापालन सहित वाचा-संबंधी सेवा का व्यापक अर्थ रखता है; ‘सेवा करेंगे’ इसे केवल उपासना-विधि तक सीमित नहीं करता।
- source_word: כִּי הוּא אֱלֹהֵינוּ
  choice: क्योंकि वही हमारा परमेश्वर है
  rationale: כִּי प्रतिज्ञा का कारण बताता है, और ‘वही’ स्वतंत्र सर्वनाम הוּא के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: वाचा के संदर्भ में עבד का अर्थ-क्षेत्र
  choice: सेवा करेंगे
  alternative: आराधना करेंगे
  rationale: इब्रानी क्रिया में आराधना सम्मिलित है, पर उसका आशय उससे व्यापक—निष्ठा और अधीनता सहित—है।
- issue: एमोरियों और ‘सभी जातियों’ का संबंध
  choice: एमोरियों को जातियों में विशेष रूप से सम्मिलित करना
  alternative: जातियों और एमोरियों को दो समन्वित कर्मों के रूप में रखना
  rationale: וְאֶת को इस संदर्भ में विशदीकरण अथवा समावेश के रूप में समझा जा सकता है, पर साधारण ‘और’ भी व्याकरणतः संभव है; इसलिए वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याहवे’, ‘परमेश्वर’ और ‘सेवा करेंगे’ जैसे पद धार्मिक संदर्भ की गंभीरता बनाए रखते हैं; वाक्य का डैश-युक्त विन्यास एमोरियों के विशदीकरण को स्पष्ट करता है।
