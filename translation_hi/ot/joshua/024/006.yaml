  text: וָֽ/אוֹצִ֤יא אֶת אֲבֽוֹתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/תָּבֹ֖אוּ הַ/יָּ֑מָּ/ה וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵ֧י אֲבוֹתֵי/כֶ֛ם בְּ/רֶ֥כֶב וּ/בְ/פָרָשִׁ֖ים יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/006.yaml
  text: Then I brought your fathers out from Egypt[a], and you came to the sea; and the Egyptians pursued your fathers with chariots and horsemen to the Red Sea.
translation:
  language: hi
  text: तब मैं तुम्हारे पुरखाओं को मिस्र से निकाल लाया, और तुम समुद्र तक आए। मिस्रियों ने रथों और घुड़सवारों के साथ तुम्हारे पुरखाओं का लाल सागर[a] तक पीछा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अथवा, अधिक शाब्दिक रूप से, “सरकंडों का समुद्र।” इब्रानी: याम सूफ़।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹצִיא
  choice: तब मैं ... निकाल लाया
  rationale: יצא के हिफ़ील रूप का अर्थ ‘बाहर निकालना/ले आना’ है; आरंभिक वाव की कथात्मक क्रमबद्धता को स्वाभाविक हिन्दी में ‘तब’ से व्यक्त किया गया है।
- source_word: אֲבוֹתֵיכֶם
  choice: तुम्हारे पुरखाओं
  rationale: शाब्दिक अर्थ ‘तुम्हारे पिताओं’ है, पर सामूहिक पूर्वज-संदर्भ के लिए ‘पुरखाओं’ आधुनिक हिन्दी में स्वाभाविक और स्रोत के पुरुषवाची पारिवारिक भाव के निकट है।
- source_word: וַתָּבֹאוּ הַיָּמָּה
  choice: और तुम समुद्र के पास पहुँचे
  rationale: בוא और दिशासूचक प्रत्यय समुद्र की ओर पहुँचने को बताते हैं। दूसरे पुरुष बहुवचन को बनाए रखा गया है, क्योंकि वक्ता वर्तमान श्रोताओं को निर्गमन-पीढ़ी के साथ वाचा के इतिहास में संबोधित करता है।
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: मिस्रियों ने ... पीछा किया
  rationale: מִצְרַיִם शाब्दिक रूप से ‘मिस्र’ है, पर बहुवचन क्रिया और प्रसंग मिस्री सेना/लोगों को सूचित करते हैं; हिन्दी में ‘मिस्रियों ने’ स्पष्ट और स्वाभाविक है।
- source_word: בְּרֶכֶב וּבְפָרָשִׁים
  choice: रथों और घुड़सवारों के साथ
  rationale: רֶכֶב यहाँ रथ-सेना और פָּרָשִׁים घुड़सवारों को दर्शाता है; यह रूप सैन्य साधनों को साफ़-साफ़ व्यक्त करता है।
- source_word: יַם סוּף
  choice: सरकंडों का समुद्र
  rationale: סוּף का सामान्य अर्थ ‘सरकंडा/नरकट’ है। इसलिए स्रोत-पारदर्शिता के लिए अधिक शाब्दिक नाम मुख्य पाठ में रखा गया है और पारंपरिक ‘लाल सागर’ को पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: बाद की इस्राएली पीढ़ी को प्रतिनिधिक रूप से ‘तुम’ कहना
  choice: दूसरे पुरुष का संबोधन ‘तुम ... पहुँचे’ बनाए रखना
  alternative: ‘वे समुद्र के पास पहुँचे’
  rationale: इब्रानी भाषण वर्तमान श्रोताओं को उनके पुरखाओं के वाचा-इतिहास से जानबूझकर जोड़ता है; तीसरे पुरुष में बदलने से यह अलंकारिक और धर्मवैधानिक बल घट जाता।
- issue: יַם סוּף का अनुवाद
  choice: मुख्य पाठ में ‘सरकंडों का समुद्र’
  alternative: ‘लाल सागर’
  rationale: मूल पदनाम की संभावित शाब्दिकता को बिना ऐतिहासिक भूगोल का अंतिम निर्णय किए सुरक्षित रखा गया है; प्रचलित पारंपरिक नाम पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘पुरखाओं’ और ‘घुड़सवारों’ जैसे प्रचलित शब्द चुने गए हैं। स्रोत की प्रत्यक्ष द्वितीय-पुरुष वाणी और याम सूफ़ की शब्दगत पारदर्शिता बनाए रखी गई है।
