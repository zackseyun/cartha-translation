base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/014.yaml
  text: Now fear Yahweh and serve him with integrity and faithfulness[a], and put away the gods that your fathers served beyond the River and in Egypt[b], and serve Yahweh.
translation:
  language: hi
  text: अब यहोवा का भय मानो और पूरे मन और सच्चाई से उसकी सेवा करो,[a] और उन देवताओं को दूर कर दो जिनकी सेवा तुम्हारे पुरखों ने महानद के उस पार[b] और मिस्र में की थी; और यहोवा की सेवा करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निष्कपटता और निष्ठा से।” इन इब्रानी शब्दों में पूर्णता, निष्कपटता, सत्यता और विश्वसनीयता के भाव हैं।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् फरात महानद के उस पार।
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह पहले सुनाए गए इतिहास के आधार पर यहोशू के निष्कर्षात्मक आह्वान को आरम्भ करता है; हिन्दी में ‘अब’ स्वाभाविक है।
- source_word: יְרָאוּ אֶת־יְהוָה
  choice: यहोवा का भय मानो
  rationale: ‘भय मानना’ परमेश्वर के प्रति श्रद्धायुक्त भय और आज्ञाकारिता का बाइबलीय तनाव बनाए रखता है; केवल ‘आदर करो’ अर्थ को नरम कर देता।
- source_word: וְעִבְדוּ אֹתוֹ
  choice: उसकी सेवा करो
  rationale: עבד में उपासना के साथ निष्ठा और आज्ञापालन भी सम्मिलित हैं; ‘सेवा करो’ इसकी व्यापकता तथा पद के अंत में हुई पुनरावृत्ति बनाए रखता है।
- source_word: בְּתָמִים
  choice: खराई से
  rationale: यह निष्पाप सिद्धता नहीं, बल्कि अखंड, निष्कपट और पूरे मन की निष्ठा बताता है; ‘खराई’ इस भाव को संक्षेप और गरिमा से व्यक्त करती है।
- source_word: וּבֶאֱמֶת
  choice: सच्चाई से
  rationale: אמת सत्य, विश्वसनीयता और निष्ठा का अर्थ दे सकता है। ‘सच्चाई’ मूल शब्द की व्यापकता और निष्कपट सेवा का भाव बनाए रखती है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְהָסִירוּ אֶת־אֱלֹהִים
  choice: उन देवताओं को अपने बीच से दूर कर दो
  rationale: आज्ञा प्रतिद्वंद्वी देवताओं को त्यागने और हटाने की है। हिन्दी मुहावरे में ‘दूर कर दो’ स्पष्ट है; ‘विदेशी’ जैसा विशेषण मूल में नहीं जोड़ा गया।
- source_word: אֲבוֹתֵיכֶם
  choice: तुम्हारे पुरखा
  rationale: यह पूर्वज पितरों को सूचित करता है। ‘पुरखा’ आधुनिक हिन्दी में सहज है और मूल के पुरुषवाची पारिवारिक संकेत को बनाए रखता है।
- source_word: בְּעֵבֶר הַנָּהָר
  choice: महानद के उस पार
  rationale: הַנָּהָר का शाब्दिक अर्थ ‘नदी/महानद’ है और यह प्रचलित भौगोलिक अभिव्यक्ति फरात की ओर संकेत करती है; पहचान पादटिप्पणी में स्पष्ट की गई है।
- source_word: וּבְמִצְרַיִם
  choice: और मिस्र में
  rationale: स्थानवाचक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וְעִבְדוּ אֶת־יְהוָה
  choice: और यहोवा की सेवा करो
  rationale: आरम्भिक आज्ञा की पुनरावृत्ति को बनाए रखा गया है। संयोजक וְ को ‘और’ से व्यक्त किया गया, न कि व्याख्यात्मक ‘परन्तु’ से।
theological_decisions:
- issue: वाचा के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में चतुरक्षरीय निज नाम सीधे प्रयुक्त है। हिन्दी की स्थापित ध्वन्यात्मक परम्परा ‘यहोवा’ नाम को दृश्य रखती है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता।
- issue: יְרָאוּ को नरम करना या उसके भयार्थ को बनाए रखना
  choice: यहोवा का भय मानो
  alternative: यहोवा का आदर करो
  rationale: यह भय श्रद्धा और वाचागत आज्ञाकारिता से जुड़ा है, फिर भी मूल क्रिया का वास्तविक भयार्थ है; उसे केवल ‘आदर’ में सीमित नहीं किया गया।
- issue: בֶאֱמֶת में सत्य और निष्ठा के अर्थ
  choice: सच्चाई से
  alternative: विश्वासयोग्यता से / निष्ठा से
  rationale: शब्द में सत्यता, विश्वसनीयता और निष्ठा की अर्थ-सीमा है। मुख्य पाठ ‘सच्चाई’ से व्यापक मूल अर्थ रखता है और पादटिप्पणी अन्य सम्भव छायाएँ बताती है।
- issue: אֲבוֹתֵיכֶם का लिंग-सटीक निरूपण
  choice: तुम्हारे पुरखा
  alternative: तुम्हारे पूर्वज
  rationale: मूल पुरुषवाची पारिवारिक पद है; ‘पुरखा’ उसे स्वाभाविक हिन्दी में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, श्रव्य और सामान्य पाठक के लिए सहज शैली। ‘खराई’, ‘पुरखा’ और ‘महानद’ बाइबलीय संदर्भ में परिचित किंतु समझने योग्य शब्द हैं। पादटिप्पणी चिह्न सम्बद्ध पदबंधों के तुरंत बाद रखे गए हैं।
