revisions:
- from: तब यहोशू ने लोगों को विदा किया, और हर एक अपने उत्तराधिकार में चला गया।
  to: तब यहोशू ने लोगों को विदा किया, और हर एक अपने उत्तराधिकार की भूमि पर चला गया।
  rationale: The revision retains the concise, dignified register, the dismissal sense of וַיְשַׁלַּח, and the distributive sense of אִישׁ. “अपने उत्तराधिकार की भूमि पर” expresses both the directional force of לְ and the inherited-land sense of נַחֲלָתוֹ without adding a specific tribal or family interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T09:40:42Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders Joshua’s dismissal of the assembled people and the distributive force of אִישׁ. However, “अपने उत्तराधिकार में चला गया” means that each entered or went within an inheritance, rather than returning to the allotted inherited land, which is the destination expressed by לְנַחֲלָתוֹ.
  naturalness: “विदा किया” and “हर एक” are natural modern Hindi. Adding “चला गया” is a permissible idiomatic unpacking of the implied departure, but the destination should be phrased naturally as inherited allotted land.
  terminology: “यहोशू” is the established Hindi biblical form. “उत्तराधिकार” can convey inheritance, but here it needs “की भूमि” to make clear the land-allotment sense of נַחֲלָה in context.
  issues:
  - severity: medium
    issue: Destination and land-allotment sense are obscured in “अपने उत्तराधिकार में चला गया.”
    rationale: The Hebrew preposition לְ indicates destination (“to his inheritance”), and נַחֲלָה in this context denotes the person’s inherited territorial allotment. “में” changes the relation, while “उत्तराधिकार” alone can sound like an abstract legal right.
  revised_text: तब यहोशू ने लोगों को विदा किया, और हर एक अपने उत्तराधिकार की भूमि पर चला गया।
  revised_footnotes: []
  revision_rationale: The revision retains the concise, dignified register, the dismissal sense of וַיְשַׁלַּח, and the distributive sense of אִישׁ. “अपने उत्तराधिकार की भूमि पर” expresses both the directional force of לְ and the inherited-land sense of נַחֲלָתוֹ without adding a specific tribal or family interpretation.
