  text: तब यहोशू ने लोगों को विदा किया, और हर एक अपने उत्तराधिकार की भूमि पर चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: विदा किया
  rationale: पिएल रूप यहाँ सभा को प्रस्थान करने देने या विदा करने का भाव देता है; आधुनिक हिन्दी में ‘विदा किया’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: הָעָם
  choice: लोगों
  rationale: यह सामूहिक रूप से एकत्र इस्राएलियों को दर्शाता है; ‘लोग’ सहज और पर्याप्त है।
- source_word: אִישׁ
  choice: हर एक
  rationale: इब्रानी पुल्लिंग एकवचन का प्रयोग वितरणात्मक है। ‘हर एक’ उस वितरणात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना केवल पुरुषों तक अर्थ सीमित किए।
- source_word: לְנַחֲלָתוֹ
  choice: अपने उत्तराधिकार में
  rationale: यहोशू में נַחֲלָה प्रायः गोत्रीय या पारिवारिक रूप से मिली भूमि को सूचित करता है। ‘उत्तराधिकार’ उस वाचा-संबंधी भूमि के भाव को बनाए रखता है।
