  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם עֵדִ֤ים אַתֶּם֙ בָּ/כֶ֔ם כִּֽי אַתֶּ֞ם בְּחַרְתֶּ֥ם לָ/כֶ֛ם אֶת יְהוָ֖ה לַ/עֲבֹ֣ד אוֹת֑/וֹ וַ/יֹּאמְר֖וּ עֵדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/022.yaml
  text: Then Joshua said to the people[a], “You are witnesses against yourselves that you have chosen Yahweh for yourselves, to serve him.” And they said, “We are witnesses.”
translation:
  language: hi
  text: तब यहोशू ने लोगों से कहा, “तुम अपने ही विरुद्ध गवाह हो[a] कि तुमने अपने लिए याहवे को उसकी सेवा करने के लिए चुना है।” उन्होंने कहा, “हम गवाह हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम स्वयं अपने चुनाव के गवाह हो”; अर्थात तुम्हारे अपने शब्द तुम्हारे चुनाव की गवाही देते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: הָעָם
  choice: लोगों
  rationale: यहाँ עָם एकत्र इस्राएली लोगों को सूचित करता है; ‘लोग’ प्रसंगानुकूल और सहज है।
- source_word: עֵדִים אַתֶּם בָּכֶם
  choice: तुम अपने ही विरुद्ध गवाह हो
  rationale: בָּכֶם का कानूनी-वाचाई बल उनकी अपनी घोषणा को उन्हीं के विरुद्ध साक्ष्य बनाता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: כִּי
  choice: कि
  rationale: यह उनके साक्ष्य की विषय-वस्तु प्रस्तुत करता है।
- source_word: בְּחַרְתֶּם לָכֶם
  choice: तुमने अपने लिए ... को चुना है
  rationale: לָכֶם चुनाव के स्वयं उनका अपना होने पर बल देता है; पूर्ण क्रिया को हिन्दी में वर्तमान परिणाम सहित व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: לַעֲבֹד אֹתוֹ
  choice: ताकि उसकी सेवा करो
  rationale: עבד में निष्ठा, उपासना और सेवा का व्यापक भाव है; ‘सेवा करना’ इस विस्तार को बनाए रखता है।
- source_word: וַיֹּאמְרוּ עֵדִים
  choice: उन्होंने कहा, ‘हाँ, हम गवाह हैं।’
  rationale: इब्रानी उत्तर संक्षिप्ततः केवल ‘गवाह’ कहता है; हिन्दी में निहित कर्ता और विधेय जोड़े गए हैं, तथा ‘हाँ’ उत्तर की पुष्टि को स्वाभाविक बनाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहवे’ उसे उपाधि में बदले बिना और किसी पंथगत पारंपरिक रूप को अनिवार्य किए बिना प्रस्तुत करता है।
- issue: בָּכֶם का न्यायिक संबंध
  choice: अपने ही विरुद्ध
  alternative: अपने विषय में / अपने लिए
  rationale: वाचा के प्रसंग में लोगों के अपने शब्द भविष्य में उन्हीं के चुनाव का साक्ष्य होंगे; फिर भी मूल पूर्वसर्ग की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
