base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/002.yaml
  text: 'And Joshua said to all the people[a], “Thus says Yahweh, the God of Israel: Long ago your fathers lived beyond the River—Terah[b], the father of Abraham and the father of Nahor—and they served other gods.”'
translation:
  language: hi
  text: 'यहोशू ने सभी लोगों से कहा, “इस्राएल का परमेश्वर यहोवा यों कहता है: बहुत पहले तुम्हारे पुरखे[a] उस नदी के पार[b] रहते थे—तेरह, अब्राहम का पिता और नाहोर का पिता—और वे दूसरे देवताओं की सेवा करते थे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में “तुम्हारे पिता”; यहाँ आशय पुरखों या पूर्वजों से है।
    reason: lexical_alternative
  - marker: b
    text: इसे “नदी के उस पार” भी कहा जा सकता है; सम्भवतः फरात नदी का उल्लेख है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने ... कहा
  rationale: इब्रानी कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; अलग से ‘और’ जोड़ना हिन्दी में आवश्यक नहीं है।
- source_word: אֶל כָּל הָעָם
  choice: सारी प्रजा से
  rationale: यहाँ עָם एकत्रित वाचा-समुदाय को दर्शाता है; ‘प्रजा’ सामूहिक अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह मानक दूत-सूत्र है; वर्तमानकालीन ‘कहता है’ प्रत्यक्ष ईश्वरीय वचन की जीवंतता और सूत्रबद्ध रूप बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक इब्रानी पदबंध का स्पष्ट और प्रचलित हिन्दी रूप।
- source_word: בְּעֵבֶר הַנָּהָר
  choice: उस नदी के पार
  rationale: भौगोलिक अभिव्यक्ति को ज्यों का त्यों रखते हुए ‘उस’ से प्रसंग में परिचित प्रमुख नदी का संकेत मिलता है; मुख्य पाठ में ‘फरात’ जोड़कर अति-अनुवाद नहीं किया गया।
- source_word: יָשְׁבוּ
  choice: रहते थे
  rationale: ישׁב का यहाँ अर्थ निवास करना है; ‘रहते थे’ आधुनिक हिन्दी में सहज है।
- source_word: אֲבוֹתֵיכֶם
  choice: तुम्हारे पुरखे
  rationale: बहुवचन ‘पिता’ के वंशगत अर्थ को ‘पुरखे’ स्वाभाविक हिन्दी में व्यक्त करता है और मूल के पुरुषवाची रूप को बनाए रखता है।
- source_word: מֵעוֹלָם
  choice: बहुत पहले
  rationale: इस प्रसंग में עוֹלָם अनन्तता नहीं, प्राचीन समय को सूचित करता है।
- source_word: תֶּרַח אֲבִי אַבְרָהָם וַאֲבִי נָחוֹר
  choice: अर्थात अब्राहम और नाहोर का पिता तेरह
  rationale: ‘अर्थात’ से स्पष्ट होता है कि तेरह उल्लिखित पुरखों का विशिष्ट उदाहरण है; हिन्दी में दो बार ‘पिता’ दोहराए बिना दोनों सम्बन्ध सुरक्षित रहते हैं।
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: और वे दूसरे देवताओं की सेवा करते थे
  rationale: עבד के धार्मिक अर्थ को ‘सेवा करना’ औपचारिक रूप से सुरक्षित रखता है; इससे उपासना का आशय भी प्रसंग में स्पष्ट रहता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का व्यक्तिगत नाम स्पष्ट रूप से रखा गया है। आधुनिक हिन्दी बाइबल पाठकों में ‘यहोवा’ अधिक व्यापक रूप से पहचाना जाता है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: אֲבוֹתֵיכֶם का वंशगत और पुरुषवाची अर्थ
  choice: तुम्हारे पुरखे
  alternative: तुम्हारे पूर्वज / तुम्हारे पिता
  rationale: ‘पुरखे’ मूल के पुरुषवाची बहुवचन और पूर्वजों के व्यापक आशय दोनों को स्वाभाविक हिन्दी में बनाए रखता है; पादटिप्पणी शाब्दिक रूप बताती है।
- issue: पूर्वजों द्वारा अन्य देवताओं की धार्मिक सेवा
  choice: दूसरे देवताओं की सेवा करते थे
  alternative: दूसरे देवताओं की उपासना करते थे
  rationale: ‘सेवा’ עבד के मूल शब्दार्थ को सुरक्षित रखती है और देवताओं के साथ प्रयुक्त होने पर धार्मिक निष्ठा/उपासना का अर्थ ग्रहण करती है, बिना कथन को नरम किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक ढंग अपनाया गया है। ‘यों कहता है’ दूत-सूत्र की औपचारिकता रखता है, जबकि ‘रहते थे’ और ‘बहुत पहले’ सामान्य पाठकों के लिए स्पष्ट हैं। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न अपने विषयों से उलटे जुड़े दिखते हैं; हिन्दी मसौदे में [a] ‘पुरखे’ और [b] ‘उस नदी के पार’ पर सही स्थानों में लगाए गए हैं।
