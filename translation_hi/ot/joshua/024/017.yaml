  text: כִּ֚י יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוּא֩ הַ/מַּעֲלֶ֨ה אֹתָ֧/נוּ וְ/אֶת אֲבוֹתֵ֛י/נוּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֣ית עֲבָדִ֑ים וַ/אֲשֶׁ֧ר עָשָׂ֣ה לְ/עֵינֵ֗י/נוּ אֶת הָ/אֹת֤וֹת הַ/גְּדֹלוֹת֙ הָ/אֵ֔לֶּה וַֽ/יִּשְׁמְרֵ֗/נוּ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הָלַ֣כְנוּ בָ֔/הּ וּ/בְ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֥ר עָבַ֖רְנוּ בְּ/קִרְבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/017.yaml
  text: For Yahweh our God is the one who brought us and our fathers up from the land of Egypt[a], from the house of servants, and who did these great signs before our eyes, and kept us in all the way in which we walked[b], and among all the peoples through whose midst we passed.
translation:
  language: hi
  text: क्योंकि यहोवा, हमारे परमेश्वर, वही हैं जो हमें और हमारे पुरखाओं को मिस्र देश से, दासों के घर से[a], निकाल लाए; जिन्होंने हमारी आँखों के सामने ये बड़े चिन्ह[b] किए और उस पूरे मार्ग में, जिस पर हम चले, तथा उन सभी जातियों के बीच, जिनके बीच से हम होकर निकले, हमारी रक्षा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दासता के घर से।” इब्रानी में शाब्दिक रूप से “दासों के घर से।”
    reason: lexical_alternative
  - marker: b
    text: या, “ये बड़े अद्भुत काम” अथवा “ये बड़े चमत्कार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में लोगों द्वारा व्यक्त प्रतिबद्धता का कारण प्रस्तुत करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के वाचा-नाम का स्थापित और स्पष्ट रूप; इसे उपाधि से नहीं बदला गया।
- source_word: הוּא הַמַּעֲלֶה
  choice: ही हैं, जो ... निकाल लाए
  rationale: स्वतंत्र सर्वनाम הוּא का बल ‘ही’ से प्रकट होता है। निर्गमन के प्रसंग में עלה का स्वाभाविक हिन्दी रूप ‘निकाल लाए’ है, यद्यपि मूल क्रिया में ऊपर ले आने की छवि है।
- source_word: אֲבוֹתֵינוּ
  choice: हमारे पुरखाओं
  rationale: पितृपूर्वजों के लिए स्वाभाविक, गरिमापूर्ण और सामूहिक हिन्दी अभिव्यक्ति।
- source_word: מִבֵּית עֲבָדִים
  choice: दासों के घर से
  rationale: इब्रानी का ठोस और लगभग शाब्दिक अर्थ ‘दासों का घर’ है; अमूर्त ‘दासता के घर’ को मुख्य पाठ में नहीं रखा गया।
- source_word: הָאֹתוֹת הַגְּדֹלוֹת הָאֵלֶּה
  choice: ये बड़े चिन्ह
  rationale: אוֹת का मूल अर्थ ‘चिन्ह’ बनाए रखता है और उसे केवल ‘चमत्कार’ कहकर व्याख्यायित नहीं करता।
- source_word: וַיִּשְׁמְרֵנוּ
  choice: हमारी रक्षा की
  rationale: यात्रा के प्रसंग में שׁמר की सुरक्षात्मक धारणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּכָל הַדֶּרֶךְ
  choice: उस पूरे मार्ग में
  rationale: इब्रानी के ‘पूरे मार्ग में’ को बनाए रखते हुए हिन्दी वाक्य-विन्यास के अनुकूल रूप दिया गया।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा-नाम प्रत्यक्ष रूप से है। हिन्दी पाठकों के बीच स्थापित लिप्यंतरण ‘यहोवा’ नाम को स्पष्ट रखता है; ‘प्रभु’ करने से नाम उपाधि में बदल जाता।
- issue: בֵּית עֲבָדִים में עֲבָדִים का रूप
  choice: दासों के घर
  alternative: दासता के घर
  rationale: मूल में बहुवचन ठोस संज्ञा ‘दास’ है। मुख्य पाठ उस सामाजिक स्थिति को अमूर्त किए बिना सुरक्षित रखता है, जबकि हिन्दी मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
- issue: אוֹת का अर्थ
  choice: चिन्ह
  alternative: चमत्कार; अद्भुत काम
  rationale: ‘चिन्ह’ शब्द घटनाओं के आश्चर्यजनक होने के साथ उनके संकेतात्मक अर्थ को भी खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण सामूहिक वचन रखा गया है। वाक्य की लंबी इब्रानी संरचना को अर्धविराम और स्वाभाविक उपवाक्यों से पठनीय बनाया गया है। ‘जातियों’ यहाँ मार्ग में मिली जनजातीय/राष्ट्रीय प्रजा-समूहों को व्यक्त करता है।
