  text: וַ/יֶּאֶסֹ֧ף יְהוֹשֻׁ֛עַ אֶת כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁכֶ֑מָ/ה וַ/יִּקְרָא֩ לְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל וּ/לְ/רָאשָׁ֗י/ו וּ/לְ/שֹֽׁפְטָי/ו֙ וּ/לְ/שֹׁ֣טְרָ֔י/ו וַ/יִּֽתְיַצְּב֖וּ לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/001.yaml
  text: Then Joshua gathered all the tribes of Israel to Shechem[a], and he called for the elders of Israel, its heads, its judges, and its officers[c][b], and they presented themselves before God.
translation:
  language: hi
  text: तब यहोशू ने इस्राएल के सभी गोत्रों को शकेम में[a] इकट्ठा किया। उसने इस्राएल के बुज़ुर्गों, उसके प्रधानों[b], न्यायियों और अधिकारियों को बुलाया, और वे परमेश्वर के सामने[c] उपस्थित हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी रूप दिशासूचक है, जिसका शाब्दिक अर्थ ‘शकेम की ओर’ है; संदर्भ में सभा शकेम में होती है।
    reason: lexical_alternative
  - marker: b
    text: ‘प्रधानों’ के स्थान पर ‘मुखियाओं’ भी संभव है; इब्रानी में शाब्दिक रूप से ‘उसके सिरों’ का भाव है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में ‘परमेश्वर के सामने’ है; इससे किसी पवित्र स्थान या वाचा से जुड़े पवित्र सभा-स्थल पर उपस्थित होना भी अभिप्रेत हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֶסֹף
  choice: इकट्ठा किया
  rationale: इस कथात्मक प्रसंग में क्रिया लोगों को एक स्थान पर एकत्र करने का भाव देती है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी गोत्रों
  rationale: राष्ट्रीय-सामाजिक इकाइयों के लिए ‘गोत्र’ प्रचलित और सटीक हिन्दी शब्द है।
- source_word: שְׁכֶמָה
  choice: शकेम में
  rationale: स्थान-नाम के साथ दिशासूचक रूप गति को ‘शकेम की ओर’ दर्शाता है, पर सभा के वहाँ एकत्र होने के परिणाम को हिन्दी में ‘शकेम में’ स्वाभाविक रूप से व्यक्त किया गया है; शाब्दिक दिशासूचक रूप पादटिप्पणी में रखा गया है।
- source_word: וַיִּקְרָא לְ
  choice: बुलाया
  rationale: यहाँ निर्दिष्ट अगुओं को सभा में बुलाने का अर्थ है; ‘बुलाया’ सहज हिन्दी है और अनावश्यक औपचारिकता से बचता है।
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनियों
  rationale: ‘पुरनिये’ इस मान्य नेतृत्व-समूह के लिए प्रतिष्ठित बाइबलीय हिन्दी पद है और आयु के साथ सामुदायिक पद का भाव भी रखता है।
- source_word: רָאשָׁיו
  choice: उसके प्रधानों
  rationale: एकवचन प्रत्यय सामूहिक रूप से इस्राएल की ओर संकेत करता है। ‘प्रधान’ मूल के ‘सिर/मुख्य जन’ रूपक और अलग नेतृत्व-पद—दोनों को पर्याप्त रूप से बनाए रखता है।
- source_word: שֹׁפְטָיו
  choice: न्यायियों
  rationale: यह नागरिक और न्यायिक पद का सीधा तथा प्रचलित अनुवाद है।
- source_word: שֹׁטְרָיו
  choice: अधिकारियों
  rationale: यह शब्द प्रशासनिक पदाधिकारियों या कार्यपालकों को दर्शाता है; ‘अधिकारी’ आधुनिक हिन्दी में व्यापक और उपयुक्त समतुल्य है।
- source_word: וַיִּתְיַצְּבוּ
  choice: उपस्थित हुए
  rationale: हित्पएल रूप औपचारिक रूप से सामने आने या अपना स्थान ग्रहण करने का भाव देता है; सभा के प्रसंग में ‘उपस्थित हुए’ स्वाभाविक है।
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: इब्रानी पाठ सीधे ‘परमेश्वर के सामने’ कहता है; इसमें न तो यहोवा नाम है, न स्पष्ट रूप से पवित्रस्थान शब्द।
theological_decisions:
- issue: वाचा-सभा के प्रसंग में לִפְנֵי הָאֱלֹהִים का अर्थ
  choice: परमेश्वर के सामने
  alternative: परमेश्वर के पवित्रस्थान के सामने
  rationale: मूल पाठ में स्पष्ट रूप से ‘परमेश्वर’ है, न कि दिव्य नाम यहोवा और न ‘पवित्रस्थान’। फिर भी यह अभिव्यक्ति किसी पवित्र या वाचागत सभा-स्थल की ओर संकेत कर सकती है, इसलिए उस संभावना को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। नेतृत्व-पदों के बीच मूल पाठ का भेद बनाए रखा गया है। ‘पुरनिये’ बाइबलीय-सामुदायिक पद के रूप में रखा गया है, जबकि वाक्य-रचना वर्तमान मानक हिन्दी के अनुरूप है।
