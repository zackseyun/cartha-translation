- from: परन्तु मैं बिलाम की बात सुनने को तैयार नहीं हुआ, इसलिए उसने तुम्हें शाप देने के बजाय आशीष ही दी; इस प्रकार मैंने तुम्हें उसके हाथ से छुड़ाया।
  to: परन्तु मैं बिलाम की बात सुनने को तैयार नहीं हुआ, और उसने तुम्हें सचमुच आशीष दी[a]; और मैंने तुम्हें उसके हाथ से छुड़ाया।
  rationale: Removed the contextual but untranslated phrase “शाप देने के बजाय” and replaced the explicit causal connector with “और.” The revision retains Balaam as the natural grammatical subject, conveys the emphatic blessing without imposing repetition, and preserves the Hebrew “hand” idiom.
