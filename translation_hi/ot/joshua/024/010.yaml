  yaml_path: translation/ot/joshua/024/010.yaml
  text: But I was not willing to listen to Balaam[a], and he indeed blessed you; so I delivered you from his hand.
translation:
  language: hi
  text: परन्तु मैं बिलाम की बात सुनने को तैयार नहीं हुआ, और उसने तुम्हें सचमुच आशीष दी[a]; और मैंने तुम्हें उसके हाथ से छुड़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक रूप से, “उसने निश्चय ही तुम्हें आशीष दी।” इब्रानी में बल देने वाली रचना है: “आशीष देकर उसने आशीष दी।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיתִי
  choice: मैं ... तैयार नहीं हुआ
  rationale: אבה इच्छा या सहमति व्यक्त करता है। यह अनुवाद केवल न सुन पाने के बजाय परमेश्वर की अनिच्छा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לִשְׁמֹעַ לְבִלְעָם
  choice: बिलाम की बात सुनने
  rationale: שׁמע के साथ ל किसी की बात सुनने या मानने का अर्थ दे सकता है। ‘बात सुनने’ हिन्दी में दोनों भावों को सहज रूप से समेटता है।
- source_word: וַיְבָרֶךְ בָּרוֹךְ
  choice: उसने ... आशीष ही दी
  rationale: क्रिया के साथ उसी धातु का infinitive absolute कार्य की निश्चितता और बल को बढ़ाता है। ‘आशीष ही दी’ इस जोर को व्यक्त करता है, पर अनिवार्य रूप से बार-बार किए जाने का अर्थ नहीं जोड़ता। प्रसंग स्पष्ट करने के लिए ‘शाप देने के बजाय’ जोड़ा गया है।
- source_word: וָאַצִּל
  choice: मैंने ... छुड़ाया
  rationale: נצל का अर्थ किसी के अधिकार या संकट से बचाना अथवा छुड़ाना है। ‘छुड़ाया’ covenant-history प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: מִיָּדוֹ
  choice: उसके हाथ से
  rationale: यह मूल इब्रानी रूपक को सुरक्षित रखता है और हिन्दी में किसी के वश या अधिकार से मुक्ति के अर्थ में समझने योग्य है।
theological_decisions:
- issue: आशीष देने वाले की कर्तृता
  choice: ‘उसने’ का निकटतम और स्वाभाविक कर्ता बिलाम है।
  alternative: इसे परमेश्वर के लिए ‘मैंने तुम्हें आशीष दी’ समझना।
  rationale: इब्रानी क्रिया तृतीय पुरुष पुल्लिंग एकवचन है और ठीक पहले बिलाम का उल्लेख है; इसलिए बिलाम ही स्वाभाविक व्याकरणिक कर्ता है। व्यापक प्रसंग दिखाता है कि परमेश्वर ने उसके शाप देने के उद्देश्य को पलट दिया।
- issue: बलवाचक रचना का अर्थ
  choice: ‘आशीष ही दी’ द्वारा निश्चित और विपरीत परिणाम पर बल।
  alternative: ‘बार-बार आशीष दी,’ जो पुनरावृत्ति पर बल देता है।
  rationale: וַיְבָרֶךְ בָּרוֹךְ की cognate infinitive रचना बलवाचक है, पर अपने आप में पुनरावृत्ति को अनिवार्य नहीं करती। अनुवाद इस अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु साधारण पाठकों के लिए स्पष्ट रखी गई है। ‘परन्तु,’ ‘इसलिए,’ और ‘इस प्रकार’ वाक्य के विरोध, परिणाम और उद्धार के क्रम को सहज बनाते हैं।
