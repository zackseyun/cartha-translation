  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם לֹ֤א תֽוּכְלוּ֙ לַ/עֲבֹ֣ד אֶת יְהוָ֔ה כִּֽי אֱלֹהִ֥ים קְדֹשִׁ֖ים ה֑וּא אֵֽל קַנּ֣וֹא ה֔וּא לֹֽא יִשָּׂ֥א לְ/פִשְׁעֲ/כֶ֖ם וּ/לְ/חַטֹּאותֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/019.yaml
  text: And Joshua said to the people[a], “You are not able to serve Yahweh, for he is a holy God; he is a jealous God[b]. He will not forgive your transgressions and your sins.”
translation:
  language: hi
  text: तब यहोशू ने लोगों से कहा, “तुम याहवे की सेवा नहीं कर सकते, क्योंकि वह पवित्र परमेश्वर है[a]; वह ईर्ष्यालु परमेश्वर है। वह तुम्हारे अपराधों और पापों को क्षमा नहीं करेगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परमेश्वर’ और ‘पवित्र’ के इब्रानी शब्दों के रूप बहुवचन हैं, लेकिन सर्वनाम एकवचन है; शाब्दिक शब्दक्रम लगभग ‘परमेश्वरगण पवित्र—वह’ है। एकवचन सर्वनाम से स्पष्ट है कि बात इस्राएल के एक परमेश्वर की है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह तुम्हारे अपराधों और पापों को उठाएगा/ले जाएगा नहीं।” यह इब्रानी मुहावरा सामान्यतः क्षमा करने के अर्थ में प्रयुक्त होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: תֽוּכְלוּ
  choice: कर सकते
  rationale: יכל सामर्थ्य या क्षमता व्यक्त करता है। निषेध के साथ ‘नहीं कर सकते’ असमर्थता को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: לַעֲבֹד
  choice: सेवा करना
  rationale: עבד का अर्थ ‘सेवा करना’ है और वाचा के प्रसंग में इसमें आराधना तथा आज्ञाकारिता दोनों शामिल हैं; इसलिए केवल ‘आराधना करना’ से इसका अर्थ संकुचित हो जाता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהִים קְדֹשִׁים הוּא
  choice: वह पवित्र परमेश्वर है
  rationale: ‘परमेश्वर’ और ‘पवित्र’ के इब्रानी रूप बहुवचन हैं, पर साथ का सर्वनाम הוּא एकवचन है और संकेत इस्राएल के एक परमेश्वर की ओर है। हिन्दी में एकवचन अर्थ स्वाभाविक रूप से व्यक्त किया गया और रूपगत विशेषता टिप्पणी में रखी गई है।
- source_word: אֵל קַנּוֹא
  choice: ईर्ष्यालु परमेश्वर
  rationale: קַנּוֹא वाचा में याहवे के अनन्य अधिकार और प्रतिद्वंद्वी निष्ठा को सहन न करने का भाव रखता है। ‘ईर्ष्यालु’ मूल रूपक और उसकी तीव्रता को बनाए रखता है।
- source_word: לֹא יִשָּׂא
  choice: क्षमा नहीं करेगा
  rationale: נשא अपराध या पाप के साथ प्रयुक्त होकर ‘उठाना/ले जाना’ और मुहावरे के रूप में ‘क्षमा करना’ व्यक्त कर सकता है। मुख्य पाठ में प्रचलित मुहावरे का स्पष्ट अर्थ दिया गया है और शाब्दिक संभावना टिप्पणी में सुरक्षित रखी गई है।
- source_word: פִשְׁעֲכֶם
  choice: तुम्हारे अपराधों
  rationale: פשע अधिकार के विरुद्ध विद्रोह या उल्लंघन का बोध देता है। ‘अपराध’ हिन्दी में वाचा-भंग की गंभीरता व्यक्त करता है और ‘पाप’ से अलग भी बना रहता है।
- source_word: חַטֹּאותֵיכֶם
  choice: तुम्हारे पापों
  rationale: חטאת पाप के लिए सामान्य शब्द है; ‘पाप’ इसका सीधा और सहज हिन्दी समतुल्य है।
theological_decisions:
- issue: אֱלֹהִים קְדֹשִׁים के बहुवचन रूपों के साथ एकवचन सर्वनाम
  choice: एकवचन अर्थ में ‘वह पवित्र परमेश्वर है’
  alternative: शब्दरूपों को यांत्रिक रूप से बहुवचन में प्रस्तुत करना
  rationale: एकवचन सर्वनाम और पूरे प्रसंग का संदर्भ एक ही परमेश्वर की ओर है। बहुवचन हिन्दी अनुवाद भ्रामक रूप से अनेक देवताओं का संकेत देता; इसलिए रूपगत तनाव को पादटिप्पणी में स्पष्ट किया गया है।
- issue: पापों को ‘उठाने’ से इनकार का अर्थ
  choice: मुख्य पाठ में ‘क्षमा नहीं करेगा’
  alternative: ‘तुम्हारे अपराधों और पापों को नहीं उठाएगा/ले जाएगा’
  rationale: यह इब्रानी मुहावरा पाप क्षमा करने के अर्थ में सामान्य है। फिर भी उसकी शाब्दिक छवि और संभावित अनुवाद को पादटिप्पणी में रखा गया है, ताकि मूल की अर्थ-सीमा न मिटे।
- issue: परमेश्वर के लिए קַנּוֹא का वर्णन
  choice: ‘ईर्ष्यालु परमेश्वर’
  alternative: ‘उत्साही परमेश्वर’ या व्याख्यात्मक रूप से ‘प्रतिद्वंद्वी निष्ठा सहन न करने वाला परमेश्वर’
  rationale: ‘ईर्ष्यालु’ वाचा में अनन्य निष्ठा की मांग को सीधे रखता है; इसे मानवीय दोष के अर्थ में समझने के बजाय प्रसंग परमेश्वर के उचित और अनन्य अधिकार को निर्धारित करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘याहवे’ व्यक्तिगत ईश्वरीय नाम का लिप्यंतरण है। ‘सेवा’ में आराधना, निष्ठा और आज्ञाकारिता का व्यापक वाचागत भाव सुरक्षित है; ‘ईर्ष्यालु’ मूल की तीव्र और संबंधपरक भाषा को बनाए रखता है।
