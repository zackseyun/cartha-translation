  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם הִנֵּ֨ה הָ/אֶ֤בֶן הַ/זֹּאת֙ תִּֽהְיֶה בָּ֣/נוּ לְ/עֵדָ֔ה כִּֽי הִ֣יא שָׁמְעָ֗ה אֵ֚ת כָּל אִמְרֵ֣י יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עִמָּ֑/נוּ וְ/הָיְתָ֤ה בָ/כֶם֙ לְ/עֵדָ֔ה פֶּֽן תְּכַחֲשׁ֖וּ/ן בֵּ/אלֹהֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/027.yaml
  text: And Joshua said to all the people[a], “Look, this stone will be a witness against us, for it has heard all the words of Yahweh that he spoke with us. And it will be a witness against you[c][b], lest you deny your God.”
translation:
  language: hi
  text: और यहोशू ने सारी प्रजा से कहा, “देखो, यह पत्थर हमारे विरुद्ध गवाह होगा[a], क्योंकि इसने यहोवा के वे सभी वचन सुने हैं[b] जो उसने हमसे कहे थे। यह तुम्हारे विरुद्ध गवाह होगा, कहीं ऐसा न हो कि तुम अपने परमेश्वर से मुकर जाओ[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का अनुवाद “हमारे लिए गवाह” या “हमारे संबंध में गवाह” भी हो सकता है; इस प्रसंग में आशय वाचा से विमुख होने पर हमारे विरुद्ध गवाही देने का है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “इसने सुना है” है—पत्थर को वाचा के वचनों का साक्षी मानकर उसका मानवीकरण किया गया है।
    reason: cultural_note
  - marker: c
    text: या “तुम अपने परमेश्वर के साथ विश्वासघात करो” अथवा “अपने परमेश्वर के प्रति झूठे सिद्ध हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह स्वाभाविक आधुनिक हिन्दी में ध्यान आकर्षित करने वाले इब्रानी उद्गार का बल बनाए रखता है, बिना पुरातन शैली अपनाए।
- source_word: הָאֶבֶן הַזֹּאת
  choice: यह पत्थर
  rationale: אֶבֶן का सामान्य अर्थ ‘पत्थर’ है; वाचा के स्मारक के इस प्रसंग में यह ‘चट्टान’ से अधिक सटीक है।
- source_word: תִּהְיֶה ... לְעֵדָה
  choice: गवाह होगा
  rationale: यह עֵדָה के वाचा-संबंधी और न्यायिक साक्ष्य के भाव को स्पष्ट तथा सहज हिन्दी में व्यक्त करता है।
- source_word: בָּנוּ / בָכֶם
  choice: हमारे विरुद्ध / तुम्हारे विरुद्ध
  rationale: ב के संबंधसूचक अर्थ में कुछ अस्पष्टता है, पर वाचा तोड़ने की चेतावनी के प्रसंग में प्रतिकूल साक्ष्य का भाव प्रमुख है; विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שָׁמְעָה
  choice: इसने ... सुने हैं
  rationale: पूर्ण क्रिया की वर्तमान प्रासंगिकता और पत्थर के मानवीकरण—उसका वाचा के वचनों को सुनना—दोनों सुरक्षित रहते हैं।
- source_word: כָּל אִמְרֵי יְהוָה
  choice: यहोवा के वे सभी वचन
  rationale: אִמְרֵי के लिए ‘वचन’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी है तथा वाचा में कही गई बातों के अनुकूल है; יהוה को व्यक्तिगत दिव्य नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: אֲשֶׁר דִּבֶּר עִמָּנוּ
  choice: जो उसने हमसे कहे हैं
  rationale: यह हिन्दी में स्वाभाविक है और עִם द्वारा व्यक्त संबोधन/संवाद को अनावश्यक रूप से भारी शाब्दिकता के बिना संप्रेषित करता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह आधुनिक हिन्दी में चेतावनी और निवारक आशय दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תְּכַחֲשׁוּן בֵּאלֹהֵיכֶם
  choice: तुम अपने परमेश्वर से मुकर जाओ
  rationale: כחש यहाँ परमेश्वर के प्रति वाचा की निष्ठा से फिरने या उसे अस्वीकार करने का भाव देता है; ‘मुकर जाना’ इस संबंधपरक और नैतिक बल को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: पत्थर का सुनने और गवाही देने वाले के रूप में मानवीकरण
  choice: मानवीकृत भाषा को प्रत्यक्ष रूप से बनाए रखना
  alternative: इसे केवल प्रतीकात्मक स्मारक बताकर ‘सुनने’ की भाषा को व्याख्यात्मक रूप से हल्का करना
  rationale: इब्रानी पाठ स्पष्ट रूप से कहता है कि पत्थर ने ‘सुना’ है और वह ‘गवाह होगा’। इस अलंकार को बनाए रखना वाचा-समारोह की न्यायिक गंभीरता और मूल पाठ की काव्यात्मक शक्ति का सम्मान करता है।
- issue: गवाही का पक्ष—‘विरुद्ध’ या अधिक तटस्थ ‘लिए/सामने’
  choice: मुख्य पाठ में ‘विरुद्ध’
  alternative: ‘हमारे लिए गवाह’ अथवा ‘हमारे बीच गवाह’
  rationale: इब्रानी पूर्वसर्ग ב संबंध को अधिक तटस्थ रूप से भी व्यक्त कर सकता है, किंतु आगामी चेतावनी वाचा-भंग की स्थिति में दोष सिद्ध करने वाली गवाही की ओर संकेत करती है। अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’, ‘गवाह’ और ‘मुकर जाओ’ जैसे प्रचलित शब्द चुने गए हैं। इब्रानी की पुनरुक्ति ‘गवाह होगा’ दोनों स्थानों पर सुरक्षित है, और पत्थर के मानवीकरण को स्पष्ट रूप से बनाए रखा गया है।
