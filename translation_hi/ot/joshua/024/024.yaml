id: JOS.24.24
reference: Joshua 24:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ אֶת יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ נַעֲבֹ֔ד וּ/בְ/קוֹל֖/וֹ נִשְׁמָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/024.yaml
  text: And the people said to Joshua[a], “We will serve Yahweh our God[b], and we will obey his voice.”
translation:
  language: hi
  text: लोगों ने यहोशू से कहा, “हम अपने परमेश्वर याहवे की सेवा करेंगे[a] और उसकी बात मानेंगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आराधना करेंगे।” इब्रानी क्रिया परमेश्वर के प्रति आराधनापूर्ण सेवा का अर्थ दे सकती है, पर यहाँ “सेवा करेंगे” वाचा के प्रति व्यापक निष्ठा को भी बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसकी आवाज़ सुनेंगे।” यह इब्रानी मुहावरा उसकी कही बात को आज्ञापूर्वक मानने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָעָם אֶל יְהוֹשֻׁעַ
  choice: लोगों ने यहोशू से कहा
  rationale: यह सामान्य कथात्मक वाक्य है, जिसमें लोगों का यहोशू को संबोधित करके कहना व्यक्त होता है।
- source_word: אֶת יְהוָה אֱלֹהֵינוּ
  choice: अपने परमेश्वर याहवे
  rationale: हिंदी में स्वाभाविक संबंध-विन्यास रखते हुए יְהוָה को व्यक्तिगत वाचा-नाम ‘याहवे’ और אֱלֹהֵינוּ को ‘अपने परमेश्वर’ के रूप में व्यक्त किया गया है।
- source_word: נַעֲבֹד
  choice: सेवा करेंगे
  rationale: עבד यहाँ आराधनापूर्ण सेवा के साथ व्यापक वाचा-निष्ठा और आज्ञाकारिता भी व्यक्त करता है; ‘सेवा करेंगे’ इस व्यापक अर्थ को बनाए रखता है।
- source_word: וּבְקוֹלוֹ נִשְׁמָע
  choice: और उसकी बात मानेंगे
  rationale: शाब्दिक रूप से ‘उसकी आवाज़ सुनेंगे’ है, पर इस इब्रानी मुहावरे का प्रसंगगत अर्थ आज्ञापूर्वक सुनना है। ‘उसकी बात मानेंगे’ आधुनिक हिंदी में वही आशय स्वाभाविक रूप से देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में परमेश्वर का वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: वाचा के संदर्भ में עבד का धार्मिक अर्थ
  choice: सेवा करेंगे
  alternative: आराधना करेंगे
  rationale: यह प्रतिज्ञा केवल उपासना-विधि तक सीमित नहीं, बल्कि परमेश्वर के प्रति समग्र निष्ठा और आज्ञापालन व्यक्त करती है; इसलिए ‘सेवा’ व्यापक अर्थ को बेहतर बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उसकी बात मानेंगे’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पाद-टिप्पणी मूल इब्रानी के ‘आवाज़ सुनने’ वाले मुहावरे को सुरक्षित रखती है।
