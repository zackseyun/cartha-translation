  text: וַ/יִּכְתֹּ֤ב יְהוֹשֻׁ֨עַ֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה בְּ/סֵ֖פֶר תּוֹרַ֣ת אֱלֹהִ֑ים וַ/יִּקַּח֙ אֶ֣בֶן גְּדוֹלָ֔ה וַ/יְקִימֶ֣/הָ שָּׁ֔ם תַּ֚חַת הָֽ/אַלָּ֔ה אֲשֶׁ֖ר בְּ/מִקְדַּ֥שׁ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/026.yaml
  text: And Joshua wrote these words in the Book of the Law of God[b][a], and he took a large stone and set it up there under the oak that was in the sanctuary of Yahweh.
translation:
  language: hi
  text: तब यहोशू ने ये वचन परमेश्वर की व्यवस्था की पुस्तक में लिखे। फिर उसने एक बड़ा पत्थर लेकर उसे वहाँ उस बलूत के वृक्ष[a] के नीचे खड़ा किया, जो याहवे के पवित्रस्थान में[b] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तारपीन वृक्ष।” इब्रानी शब्द से वृक्ष की प्रजाति निश्चित रूप से पहचानना कठिन है।
    reason: lexical_alternative
  - marker: b
    text: या “याहवे के पवित्रस्थान के पास था।” यहाँ इब्रानी संबंधबोधक शब्द का अर्थ संदर्भ में अधिक व्यापक स्थान-संबंध भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: लिखे
  rationale: כתב का सीधा अर्थ ‘लिखना’ है; यहाँ वचनों को पुस्तक में दर्ज करने की क्रिया है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ये वचन
  rationale: דברים का अर्थ ‘वचन,’ ‘बातें’ या ‘विषय’ हो सकता है। लिखित वाचा-संबंधी कथनों के संदर्भ में ‘वचन’ उपयुक्त है।
- source_word: בְּסֵפֶר תּוֹרַת אֱלֹהִים
  choice: परमेश्वर की व्यवस्था की पुस्तक में
  rationale: यह पदबंध ספר और תורת אלהים की संबंध-रचना को स्वाभाविक हिन्दी में सुरक्षित रखता है; תורה के लिए इस वाचा-संदर्भ में ‘व्यवस्था’ चुना गया है।
- source_word: וַיִּקַּח אֶבֶן גְּדוֹלָה
  choice: एक बड़ा पत्थर लेकर
  rationale: גדולה यहाँ पत्थर के भौतिक आकार को बताता है, इसलिए ‘बड़ा’ सहज और सटीक है।
- source_word: וַיְקִימֶהָ
  choice: उसे … खड़ा किया
  rationale: קום के हिफ़ील रूप का अर्थ पत्थर को खड़ा करना या स्थापित करना है; ‘खड़ा किया’ स्मारक-पत्थर की क्रिया को स्पष्ट करता है।
- source_word: תַּחַת הָאַלָּה
  choice: बाँज वृक्ष के नीचे
  rationale: אַלָּה किसी बड़े वृक्ष, प्रायः टेरेबिन्थ के लिए प्रयुक्त हो सकता है। मुख्य पाठ में परिचित वृक्ष-नाम ‘बाँज’ रखा गया और प्रजातिगत अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: בְּמִקְדַּשׁ יְהוָה
  choice: याहवे के पवित्रस्थान में
  rationale: מקדש का अर्थ ‘पवित्रस्थान’ है और ב का सामान्य स्थानवाचक अर्थ ‘में’ है; कम कड़ा स्थानवाचक अर्थ ‘के पास’ पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: वृक्ष और पवित्रस्थान का स्थान-संबंध
  choice: जो याहवे के पवित्रस्थान में था
  alternative: जो याहवे के पवित्रस्थान के पास था
  rationale: ב का सर्वाधिक सीधा अर्थ ‘में’ है और संबंधवाचक उपवाक्य वृक्ष को विशेषित करता है; संदर्भ में ‘के पास’ भी संभव होने से उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण गद्य रखा गया है। वाक्य को दो भागों में बाँटकर घटनाक्रम स्पष्ट किया गया है; ‘तब’ और ‘फिर’ इब्रानी कथात्मक क्रम को स्वाभाविक हिन्दी में व्यक्त करते हैं।
