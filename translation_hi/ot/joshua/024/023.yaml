source:
  edition: WLC
  text: וְ/עַתָּ֕ה הָסִ֛ירוּ אֶת אֱלֹהֵ֥י הַ/נֵּכָ֖ר אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֑ם וְ/הַטּוּ֙ אֶת לְבַבְ/כֶ֔ם אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/023.yaml
  text: So now[a], remove the foreign gods that are among you, and turn your heart to Yahweh[b], the God of Israel.
translation:
  language: hi
  text: तो अब अपने बीच के पराए देवताओं को हटा दो[a], और अपना हृदय इस्राएल के परमेश्वर याहवे की ओर मोड़ो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूर कर दो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: संयोजक וְ और समयसूचक עַתָּה यहाँ पहले कही बात के आधार पर तत्काल आग्रह प्रस्तुत करते हैं; ‘इसलिए अब’ इस प्रवचनात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָסִירוּ
  choice: हटा दो
  rationale: हिफ़ील बहुवचन आज्ञार्थक का अर्थ किसी वस्तु को हटाना या दूर करना है। ‘हटा दो’ स्पष्ट, वर्तमान और प्रत्यक्ष आदेश है।
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: पराए देवताओं
  rationale: यह पद विदेशी लोगों या पराई उपासना से जुड़े देवताओं को दर्शाता है। ‘पराए देवता’ हिन्दी में उनकी इस्राएल के परमेश्वर से भिन्न निष्ठा को संक्षेप में व्यक्त करता है।
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: अपने बीच के
  rationale: בְּקִרְבְּכֶם का स्थानवाचक अर्थ समुदाय के बीच या मध्य में होना है; यह अनावश्यक रूप से आंतरिक या केवल मानसिक अर्थ नहीं देता।
- source_word: וְהַטּוּ
  choice: लगाओ
  rationale: נטה का मूल चित्र ‘झुकाना/मोड़ना’ है। हृदय और אֶל के साथ यह निष्ठा तथा इच्छा को याहवे की ओर लगाने का आदेश देता है; ‘लगाओ’ स्वाभाविक हिन्दी है, जबकि शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: לְבַבְכֶם
  choice: अपना हृदय
  rationale: इब्रानी में द्वितीय पुरुष बहुवचन प्रत्यय के साथ सामूहिक एकवचन ‘हृदय’ है। ‘अपना हृदय’ लोगों की सामूहिक भीतरी निष्ठा को बनाए रखता है।
- source_word: אֶל יְהוָה
  choice: याहवे की ओर
  rationale: אֶל दिशा को और יְהוָה परमेश्वर के व्यक्तिगत वाचा-नाम को व्यक्त करता है। ‘याहवे की ओर’ दोनों तत्वों को स्पष्ट रखता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह संबंधवाचक रचना याहवे की पहचान इस्राएल के परमेश्वर के रूप में करती है; हिन्दी में यह पारदर्शी और गरिमापूर्ण है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में टेट्राग्रामटन सीधे आया है। ‘याहवे’ वाचा-नाम को उपाधि ‘प्रभु’ से अलग रखते हुए प्रचलित विद्वत्तापूर्ण उच्चारण के निकट प्रस्तुत करता है।
- issue: ‘हृदय’ का सामूहिक एकवचन
  choice: अपना हृदय
  alternative: अपने हृदयों
  rationale: मूल का לְבַבְכֶם व्याकरणतः एकवचन संज्ञा के साथ बहुवचन संबोधन है। सामूहिक एकवचन बनाए रखने से पूरे समुदाय की संयुक्त निष्ठा का तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण सामुदायिक संबोधन रखा गया है। ‘हटा दो’ और ‘हृदय … लगाओ’ साधारण पाठक के लिए स्वाभाविक हैं; दूसरे पदबंध का मूल रूपक पादटिप्पणी में दिया गया है।
