  yaml_path: translation/ot/joshua/024/021.yaml
  text: But the people said to Joshua[a], “No, but we will serve Yahweh.”
translation:
  language: hi
  text: पर लोगों ने यहोशू से कहा, “नहीं, हम तो याहवे की सेवा करेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: אמר के सामान्य कथात्मक प्रयोग को स्वाभाविक हिन्दी में ‘कहा’ व्यक्त करता है।
- source_word: הָעָם
  choice: लोगों
  rationale: यह इस्राएल के एकत्रित वाचा-समुदाय को सूचित करता है; सन्दर्भ में ‘लोग’ सहज और स्पष्ट है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परम्परा में प्रचलित रूप।
- source_word: לֹא כִּי
  choice: नहीं! … तो … ही
  rationale: לֹא पहले कही गई बात का दृढ़ निषेध करता है और כִּי उसके बाद सुधारात्मक/विरोधात्मक उत्तर प्रस्तुत करता है। हिन्दी में विस्मयादिबोधक विराम तथा ‘तो…ही’ इस बल को स्वाभाविक ढंग से व्यक्त करते हैं।
- source_word: אֶת יְהוָה
  choice: यहोवा की
  rationale: אֶת कर्म-सूचक है और अलग अनूदित नहीं होता। יהוה को हिन्दी में व्यापक रूप से पहचाने जाने वाले व्यक्तिवाचक रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: נַעֲבֹד
  choice: हम … सेवा करेंगे
  rationale: עבד का यह रूप सामूहिक संकल्प और भावी वाचा-निष्ठा व्यक्त करता है; ‘सेवा करेंगे’ उपासना तक अर्थ को सीमित किए बिना समर्पित अधीनता को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार-अक्षरीय वाचा-नाम है। हिन्दी पाठकों में परिचित व्यक्तिवाचक रूप ‘यहोवा’ नाम की विशिष्टता बनाए रखता है; ‘प्रभु’ करने से मूल का व्यक्तिनाम उपाधि में बदल जाता।
- issue: עבד के वाचागत अर्थ की सीमा
  choice: सेवा करेंगे
  alternative: आराधना करेंगे
  rationale: यहाँ क्रिया में आराधना के साथ निष्ठा और अधीनता का व्यापक भाव भी है; इसलिए केवल ‘आराधना’ कहना अर्थ को अनावश्यक रूप से संकुचित करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज हिन्दी। ‘नहीं!’ उत्तर की दृढ़ता दिखाता है, जबकि ‘तो…ही’ विरोधात्मक सुधार और केवल यहोवा के प्रति निष्ठा पर बल देता है।
