  edition: WLC
  text: ו/אבא/ה אֶתְ/כֶ֗ם אֶל אֶ֤רֶץ הָ/אֱמֹרִי֙ הַ/יּוֹשֵׁב֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּֽלָּחֲמ֖וּ אִתְּ/כֶ֑ם וָ/אֶתֵּ֨ן אוֹתָ֤/ם בְּ/יֶדְ/כֶם֙ וַ/תִּֽירְשׁ֣וּ אֶת אַרְצָ֔/ם וָ/אַשְׁמִידֵ֖/ם מִ/פְּנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/008.yaml
  text: Then I brought you into the land of the Amorites[a], who lived beyond the Jordan, and they fought with you. And I gave them into your hand, and you took possession of their land, and I destroyed them from before you.
translation:
  language: hi
  text: फिर मैं तुम्हें यरदन के उस पार रहने वाले एमोरियों के देश में ले आया। उन्होंने तुमसे युद्ध किया[a]। मैंने उन्हें तुम्हारे हाथ में सौंप दिया; तुमने उनके देश पर अधिकार कर लिया, और मैंने उन्हें तुम्हारे सामने से नष्ट कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्होंने तुम्हारे साथ युद्ध किया”; संदर्भ में इसका अर्थ “तुम्हारे विरुद्ध युद्ध किया” है।
    reason: इब्रानी पूर्वसर्ग की शाब्दिक संरचना और संदर्भगत शत्रुतापूर्ण अर्थ दोनों को दिखाना।
lexical_decisions:
- source_word: וָאֲבִיאָה
  choice: फिर मैं ... ले आया
  rationale: בוא के हिफ़ील रूप का कारणवाचक अर्थ ‘ले आना’ है। आरंभिक वाव कथा के क्रम को आगे बढ़ाता है, इसलिए आधुनिक हिन्दी में ‘फिर’ स्वाभाविक है।
- source_word: אֶל אֶרֶץ הָאֱמֹרִי
  choice: एमोरियों के देश में
  rationale: אֶל यहाँ किसी भूभाग में प्रवेश को सूचित करता है। एकवचन सामूहिक जातिनाम הָאֱמֹרִי को हिन्दी में स्वाभाविक बहुवचन ‘एमोरियों’ से व्यक्त किया गया है।
- source_word: הַיּוֹשֵׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के उस पार रहनेवाले
  rationale: ישב का कृदन्त जाति का विशेषण है। ‘उस पार’ मूल की सापेक्ष स्थान-सूचना बनाए रखता है और अनावश्यक रूप से पूर्व या पश्चिम निर्धारित नहीं करता।
- source_word: וַיִּלָּחֲמוּ אִתְּכֶם
  choice: उन्होंने तुमसे युद्ध किया
  rationale: לחם के साथ אִתְּ hostile engagement को दर्शाता है। ‘तुमसे युद्ध किया’ आधुनिक हिन्दी में विरोधी युद्ध का स्पष्ट और स्वाभाविक रूप है; शाब्दिक संरचना की संभावित अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: मैंने उन्हें तुम्हारे हाथ में कर दिया
  rationale: נתן ביד शत्रुओं को किसी के अधिकार या सामर्थ्य में सौंपने का मुहावरा है। हिन्दी का ‘हाथ में कर दिया’ मूल बिंब और अर्थ दोनों को बनाए रखता है।
- source_word: וַתִּירְשׁוּ אֶת אַרְצָם
  choice: तुमने उनके देश पर अधिकार कर लिया
  rationale: ירש यहाँ विजय के बाद भूमि को अपने अधिकार में लेने का अर्थ देता है। यह अनुवाद संदर्भगत परिणाम स्पष्ट करता है, बिना ‘विरासत’ का अनावश्यक भाव जोड़े।
- source_word: וָאַשְׁמִידֵם
  choice: मैंने उन्हें ... नष्ट कर दिया
  rationale: שׁמד का तीखा विनाशार्थक बल ‘नष्ट कर दिया’ में सुरक्षित है; इसे ‘हरा दिया’ जैसे नरम शब्द से नहीं बदला गया।
- source_word: מִפְּנֵיכֶם
  choice: तुम्हारे सामने से
  rationale: यह मूल अभिव्यक्ति ‘तुम्हारे मुख/उपस्थिति के सामने से’ का स्वाभाविक हिन्दी रूप है और हटाए जाने की धारणा को बनाए रखता है।
theological_decisions:
- issue: विजय और विनाश की भाषा को नरम किए बिना प्रस्तुत करना
  choice: 'ईश्वर के प्रत्यक्ष कथन और कड़े क्रियापद बनाए रखे गए हैं: ‘मैंने उन्हें तुम्हारे हाथ में कर दिया ... तुमने ... अधिकार कर लिया ... मैंने उन्हें ... नष्ट कर दिया।’'
  alternative: ‘पराजित किया’ या ‘हटा दिया’ जैसे अपेक्षाकृत नरम शब्द
  rationale: इब्रानी पाठ युद्ध, भूमि-अधिकार और विनाश को स्पष्ट रूप से कहता है। अनुवाद उस तनाव को न तो कम करता है, न उससे आगे कोई धर्मवैज्ञानिक व्याख्या जोड़ता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘यरदन’, ‘एमोरी’, ‘युद्ध’, ‘अधिकार’ और ‘नष्ट’ जैसे प्रचलित बाइबलीय तथा सामान्य शब्द चुने गए हैं; अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
