  text: וַ/יָּ֨קָם בָּלָ֤ק בֶּן צִפּוֹר֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵ֑ל וַ/יִּשְׁלַ֗ח וַ/יִּקְרָ֛א לְ/בִלְעָ֥ם בֶּן בְּע֖וֹר לְ/קַלֵּ֥ל אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/009.yaml
  text: Then Balak son of Zippor[a], king of Moab, arose and fought against Israel[b]. He sent and called Balaam son of Beor to curse you.
translation:
  language: hi
  text: तब मोआब का राजा, सिप्पोर का पुत्र बालाक, उठा[a] और इस्राएल के विरुद्ध युद्ध किया[b]। उसने भेजा और बओर के पुत्र बिलाम को बुलाया, ताकि वह तुम्हें शाप दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उठ खड़ा हुआ।” इब्रानी क्रिया निर्णायक कार्रवाई आरम्भ करने का संकेत भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “इस्राएल से लड़ा” अथवा “इस्राएल के विरुद्ध युद्ध करने निकला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: कथा में קום केवल शारीरिक रूप से उठने के बजाय निर्णायक कार्रवाई आरम्भ करने का संकेत भी दे सकता है। ‘उठा’ मूल की संक्षिप्तता और संभावित अर्थ-विस्तार बनाए रखता है।
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: इस्राएल के विरुद्ध युद्ध किया
  rationale: לחם के साथ ב यहाँ शत्रुतापूर्ण संघर्ष व्यक्त करता है। यह अनुवाद स्पष्ट है और मूल के सीधे कथन को बनाए रखता है।
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: दूत भेजकर … बुलाया
  rationale: मूल की दोनों क्रमिक क्रियाओं—भेजना और बुलाना—को स्वाभाविक हिन्दी में बनाए रखने के लिए यह रचना चुनी गई है। ‘दूत’ भेजने की क्रिया में निहित माध्यम को स्पष्ट करता है, बिना आशय बदले।
- source_word: לְבִלְעָם בֶּן בְּעוֹר
  choice: बओर के पुत्र बिलाम
  rationale: व्यक्तिनामों का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है और इब्रानी संबंध-संरचना सुरक्षित रखी गई है।
- source_word: לְקַלֵּל אֶתְכֶם
  choice: ताकि वह तुम्हें शाप दे
  rationale: यह उद्देश्यसूचक रचना इब्रानी לְ के कार्य और קלל के सीधे, शत्रुतापूर्ण आशय को स्वाभाविक हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: गिनती की पुस्तक में बिलाम के द्वारा शाप दिलाने पर बल होने के बावजूद यहाँ बालाक का ‘इस्राएल के विरुद्ध युद्ध करना’
  choice: मूल के स्पष्ट कथन के अनुसार ‘इस्राएल के विरुद्ध युद्ध किया’ रखा गया है।
  alternative: ‘इस्राएल से शत्रुता की,’ ‘युद्ध की तैयारी की,’ अथवा प्रत्यक्ष युद्ध का उल्लेख नरम कर दिया जाए।
  rationale: इब्रानी पाठ וַיִּלָּחֶם בְּיִשְׂרָאֵל सीधे युद्ध करने की बात कहता है। दूसरे वृत्तांत से सामंजस्य बैठाने के लिए इस कथन को बदलना अनुवाद का काम नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में कथात्मक गति बनाए रखते हुए इब्रानी की क्रमिक क्रियाओं और प्रत्यक्ष युद्ध-संबंधी कथन को सुरक्षित रखा गया है।
