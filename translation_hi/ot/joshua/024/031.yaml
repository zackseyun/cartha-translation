id: JOS.24.31
reference: Joshua 24:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ד יִשְׂרָאֵל֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/אֲשֶׁ֣ר יָדְע֗וּ אֵ֚ת כָּל מַעֲשֵׂ֣ה יְהוָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/031.yaml
  text: Israel served Yahweh all the days of Joshua[a], and all the days of the elders who outlived Joshua and who had known all the work of Yahweh that he had done for Israel.
translation:
  language: hi
  text: इस्राएल ने यहोशू के जीवन भर, और उन बुज़ुर्गों के जीवन भर भी याहवे की सेवा की जो यहोशू के बाद तक जीवित रहे और याहवे के वे सभी काम[a] जानते थे जो उसने इस्राएल के लिए किए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के वे सभी कार्य।”
    reason: מַעֲשֶׂה के लिए ‘काम’ और ‘कार्य’ दोनों संभव हिन्दी रूप हैं।
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: सेवा करता रहा
  rationale: עבד यहाँ याहवे के प्रति वाचा की निष्ठा और उपासना सहित व्यापक सेवा को दर्शाता है; ‘सेवा’ इस विस्तार को बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: כֹּל יְמֵי
  choice: जीवन भर
  rationale: शाब्दिक ‘सभी दिनों’ का यह स्वाभाविक हिन्दी कालवाचक रूप है।
- source_word: הַזְּקֵנִים
  choice: पुरनियों
  rationale: इस्राएली समुदाय के आयु और मान्य नेतृत्व से जुड़े पद के लिए प्रचलित बाइबलीय हिन्दी शब्द, बिना केवल वृद्ध पुरुष या औपचारिक अधिकारी अर्थ तक सीमित किए।
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשֻׁעַ
  choice: यहोशू के बाद भी जीवित रहे थे
  rationale: इब्रानी मुहावरे का आशय है कि ये पुरनिये यहोशू की मृत्यु के बाद तक जीवित रहे।
- source_word: יָדְעוּ
  choice: जानते थे
  rationale: क्रिया इन पुरनियों के व्यक्तिगत और प्रत्यक्ष ज्ञान को व्यक्त करती है; ‘जानते थे’ मूल की व्यापकता को ‘देखा’ या ‘अनुभव किया’ तक सीमित नहीं करती।
- source_word: כָּל מַעֲשֵׂה יְהוָה
  choice: याहवे के उन सभी कामों
  rationale: מַעֲשֶׂה के लिए ‘काम’ निकट, सहज और व्यापक हिन्दी रूप है; ‘कार्य’ भी संभव है।
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: जिन्हें उसने इस्राएल के लिए किया था
  rationale: לְ को प्रसंगानुसार हितकारी अर्थ में ‘के लिए’ रखा गया है, और भूतपूर्व क्रिया-संबंध स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम יהוה प्रयोग करता है; ‘याहवे’ उसे उपाधि से बदले बिना प्रस्तुत करता है।
- issue: इस्राएल की सेवा का स्वरूप
  choice: सेवा करता रहा
  alternative: उपासना करता रहा
  rationale: עבד में उपासना सम्मिलित हो सकती है, पर यहाँ वाचा-निष्ठा और आज्ञाकारिता का व्यापक भाव भी है; इसलिए इसे केवल धार्मिक उपासना तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। सामूहिक संज्ञा ‘इस्राएल’ के साथ एकवचन क्रिया रखी गई है। ‘पुरनियों’ से सामुदायिक नेतृत्व का पारंपरिक अर्थ सुरक्षित रहता है।
