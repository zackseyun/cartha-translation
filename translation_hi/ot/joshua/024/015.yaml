base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/015.yaml
  text: But if it is evil in your eyes to serve Yahweh[a], choose for yourselves today whom you will serve—whether the gods your fathers served beyond the River, or the gods of the Amorites in whose land you are dwelling. But as for me and my house[d][c][b], we will serve Yahweh.
translation:
  language: hi
  text: लेकिन यदि तुम्हारी दृष्टि में यहोवा की सेवा करना बुरा है,[a] तो आज अपने लिए चुन लो कि तुम किसकी सेवा करोगे—उन देवताओं की, जिनकी सेवा तुम्हारे पितरों ने नदी[b] के उस पार की थी,[c] या एमोरियों के देवताओं की, जिनके देश में तुम रहते हो। परन्तु मैं और मेरा घराना[d] यहोवा की सेवा करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “तुम्हारी आँखों में बुरा है”; अर्थात “तुम्हें गलत या अप्रिय लगता है।”'
    reason: lexical_alternative
  - marker: b
    text: “नदी” से आशय फ़रात नदी है।
    reason: cultural_note
  - marker: c
    text: या “तुम्हारे पूर्वजों ने ... सेवा की थी”; इब्रानी में “तुम्हारे पितरों”।
    reason: lexical_alternative
  - marker: d
    text: या “मेरा परिवार” अथवा “मेरे घर के लोग”।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע בְּעֵינֵיכֶם
  choice: तुम्हारी दृष्टि में ... बुरा है
  rationale: इब्रानी मुहावरे ‘तुम्हारी आँखों में बुरा’ का मूल्यांकनात्मक और तीखा भाव बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: לַעֲבֹד / תַעֲבֹדוּן / נַעֲבֹד
  choice: सेवा करना / सेवा करोगे / सेवा करेंगे
  rationale: एक ही इब्रानी मूल की पुनरावृत्ति सुरक्षित रखी गई है; यहाँ ‘सेवा’ में उपासना और निष्ठा दोनों समाहित हैं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: בַּחֲרוּ לָכֶם הַיּוֹם
  choice: आज अपने लिए चुन लो
  rationale: आज्ञार्थक बल, ‘अपने लिए’ का आत्मसंबंधी भाव और ‘आज’ की तात्कालिकता तीनों सुरक्षित हैं।
- source_word: אֲבוֹתֵיכֶם
  choice: तुम्हारे पितरों
  rationale: शाब्दिक पुरुषवाची रूप बनाए रखते हुए आधुनिक बाइबलीय हिन्दी का स्वाभाविक शब्द चुना गया है।
- source_word: בְּעֵבֶר הַנָּהָר
  choice: महानद के उस पार
  rationale: संदर्भ में निश्चित रूप से फ़रात नदी अभिप्रेत है; ‘महानद’ ज्ञात भौगोलिक पद का संक्षिप्त हिन्दी रूप है और टिप्पणी पहचान स्पष्ट करती है।
- source_word: וְאָנֹכִי וּבֵיתִי
  choice: परन्तु मैं और मेरा घराना
  rationale: जोरदार विरोध सुरक्षित है; ‘घराना’ यहाँ केवल भवन नहीं, परिवार और गृहस्थी के लोगों को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु; याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है; उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। हिन्दी पाठकों के लिए प्रतिष्ठित लिप्यंतरण ‘यहोवा’ चुना गया।
- issue: עבד में धार्मिक निष्ठा का अर्थ
  choice: सेवा करना
  alternative: उपासना करना
  rationale: ‘सेवा’ मूल शब्द की व्यापकता और पद में उसकी आवृत्ति बनाए रखती है; ‘उपासना’ अकेले अर्थ को अनावश्यक रूप से संकुचित कर सकती है।
- issue: וְאָנֹכִי וּבֵיתִי में घर के मुखिया और घराने का कथन
  choice: मैं और मेरा घराना
  alternative: मैं और मेरा परिवार
  rationale: मूल की सामूहिक गृहस्थी की धारणा सुरक्षित रखी गई है, बिना यह विस्तार जोड़े कि प्रत्येक सदस्य की व्यक्तिगत इच्छा किस प्रकार व्यक्त हुई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। ‘चुन लो’ आज्ञा की सीधाई को स्वाभाविक हिन्दी में रखता है। ‘परन्तु’ अंतिम दृढ़ विरोध को उभारता है। सभी टिप्पणियों के चिह्न संबंधित पदांशों पर रखे गए हैं।
