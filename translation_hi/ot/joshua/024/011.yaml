base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/011.yaml
  text: Then you crossed the Jordan and came to Jericho[a], and the men of Jericho fought against you—the Amorites, the Perizzites, the Canaanites, the Hittites, the Girgashites, the Hivites, and the Jebusites—and I gave them into your hand.
translation:
  language: hi
  text: फिर तुम यरदन पार करके यरीहो आए। यरीहो के लोगों[a] ने तुमसे युद्ध किया—अमोरी, परिज्जी, कनानी, हित्ती, गिर्गाशी, हिव्वी और यबूसी लोगों ने—और मैंने उन्हें तुम्हारे हाथ में कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यरीहो के शासक’ अथवा ‘यरीहो के प्रमुख पुरुष।’ इब्रानी अभिव्यक्ति का शाब्दिक अर्थ ‘यरीहो के स्वामी/मालिक’ है और यह नगर के निवासियों, शासकों, या प्रमुख पुरुषों को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: तुम यरदन पार करके
  rationale: क्रिया עבר यहाँ नदी पार करने की ठोस गति बताती है। ‘यरदन पार करना’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: וַתָּבֹאוּ אֶל יְרִיחוֹ
  choice: यरीहो के पास आए
  rationale: בוא + אֶל आगमन को व्यक्त करता है; ‘के पास आए’ नगर में भौतिक प्रवेश को अनावश्यक रूप से निश्चित किए बिना अर्थ देता है।
- source_word: בַּעֲלֵי יְרִיחוֹ
  choice: यरीहो के स्वामियों
  rationale: בעל का मूल अर्थ ‘स्वामी/मालिक’ है। सन्दर्भ में यह नगर के शासकों या प्रमुख पुरुषों को सूचित कर सकता है; मुख्य पाठ मूल की अस्पष्टता को बनाए रखता है और पादटिप्पणी अर्थ-सीमा स्पष्ट करती है।
- source_word: וַיִּלָּחֲמוּ בָכֶם
  choice: तुमसे युद्ध किया
  rationale: לחם के साथ ב यहाँ विरोधी सैन्य मुठभेड़ दर्शाता है। ‘तुमसे युद्ध किया’ स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: הָאֱמֹרִי וְהַפְּרִזִּי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַגִּרְגָּשִׁי הַחִוִּי וְהַיְבוּסִי
  choice: अमोरी, परिज्जी, कनानी, हित्ती, गिर्गाशी, हिव्वी और यबूसी लोगों ने
  rationale: इब्रानी में एकवचन रूप सामूहिक जातिनाम हैं; हिन्दी में ‘लोगों’ जोड़ने से सामूहिक अर्थ सहज और स्पष्ट होता है।
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: मैंने उन्हें तुम्हारे हाथ में कर दिया
  rationale: ‘हाथ में देना’ शत्रु को किसी के अधिकार में सौंपने का इब्रानी मुहावरा है। हिन्दी में यह बाइबलीय चित्र और विजय का भाव दोनों बनाए रखता है।
theological_decisions:
- issue: इस्राएल की विजय में परमेश्वर की भूमिका
  choice: मैंने उन्हें तुम्हारे हाथ में कर दिया
  alternative: मैंने तुम्हें उन पर विजय दी
  rationale: प्रत्यक्ष प्रथम-पुरुष ईश्वरीय कथन और נתן ביד का विजय-संबंधी मुहावरा सुरक्षित रखा गया है; इसे केवल अनुमति या अप्रत्यक्ष सहायता के रूप में नरम नहीं किया गया।
- issue: בַּעֲלֵי יְרִיחוֹ की पहचान
  choice: यरीहो के स्वामी
  alternative: यरीहो के पुरुष / यरीहो के शासक
  rationale: मूल शब्द की ‘स्वामी/मालिक’ संबंधी अर्थ-छाया को मुख्य पाठ में रखा गया है। यह पद केवल सभी निवासियों को कहता है या नगर के शासक-प्रमुखों को, इसे निश्चित नहीं किया गया।
