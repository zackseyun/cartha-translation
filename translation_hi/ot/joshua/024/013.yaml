  to: और मैंने तुम्हें ऐसी भूमि दी, जिसमें तुमने परिश्रम नहीं किया था, और ऐसे नगर दिए, जिन्हें तुमने नहीं बनाया था; और तुम उनमें बसे हुए हो। जिन दाख की बारियों और जैतून के पेड़ों को तुमने नहीं लगाया था, उनका फल तुम खा रहे हो।
  rationale: Removed the unsupported concessive connector and used ‘भूमि’ for the gifted land. The present-result sense of ‘तुम उनमें बसे हुए हो’ and the emphatic present sense of ‘तुम खा रहे हो’ are retained. ‘उनका फल’ is an idiomatic Hindi clarification of eating from vineyards and olive trees and does not alter the agricultural referent.
