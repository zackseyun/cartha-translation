id: JOS.24.13
reference: Joshua 24:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֶתֵּ֨ן לָ/כֶ֜ם אֶ֣רֶץ אֲשֶׁ֧ר לֹֽא יָגַ֣עְתָּ בָּ֗/הּ וְ/עָרִים֙ אֲשֶׁ֣ר לֹא בְנִיתֶ֔ם וַ/תֵּשְׁב֖וּ בָּ/הֶ֑ם כְּרָמִ֤ים וְ/זֵיתִים֙ אֲשֶׁ֣ר לֹֽא נְטַעְתֶּ֔ם אַתֶּ֖ם אֹכְלִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/013.yaml
  text: And I gave you a land on which you had not labored[a], and cities that you had not built, and you live in them. You are eating from vineyards and olive groves that you did not plant.
translation:
  language: hi
  text: और मैंने तुम्हें ऐसी भूमि दी, जिसमें तुमने परिश्रम नहीं किया था, और ऐसे नगर दिए, जिन्हें तुमने नहीं बनाया था; और तुम उनमें बसे हुए हो। जिन दाख की बारियों और जैतून के पेड़ों को तुमने नहीं लगाया था, उनका फल तुम खा रहे हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: और मैंने ... दिया
  rationale: נתן का वय्यिक्तोल रूप परमेश्वर के बीते हुए दान को क्रमिक वर्णन में रखता है; हिन्दी में सामान्य भूतकाल स्वाभाविक है।
- source_word: אֶרֶץ אֲשֶׁר לֹא יָגַעְתָּ בָּהּ
  choice: ऐसा देश ... जिसमें तुमने परिश्रम नहीं किया था
  rationale: יגע श्रम या परिश्रम करने को दर्शाता है। देश के साथ हिन्दी में ‘जिसमें’ स्वाभाविक है; पूर्वकालिक क्रिया को ‘किया था’ स्पष्ट करता है।
- source_word: וְעָרִים אֲשֶׁר לֹא בְנִיתֶם
  choice: और ऐसे नगर ... जिन्हें तुमने नहीं बनाया था
  rationale: עיר का सामान्य अर्थ ‘नगर’ है। ‘बनाया था’ उनके पहले से बने होने को स्पष्ट करता है।
- source_word: וַתֵּשְׁבוּ בָּהֶם
  choice: फिर भी तुम उनमें बसे हुए हो
  rationale: ישב यहाँ बसने और निवास करने का भाव देता है। वर्तमान परिणामी अवस्था को ‘बसे हुए हो’ सहज रूप से व्यक्त करता है; ‘फिर भी’ बिना बनाए हुए नगरों में वर्तमान निवास का विरोधाभास उभारता है।
- source_word: כְּרָמִים
  choice: दाख की बारियाँ
  rationale: כרמים के लिए यह प्रचलित और समझने योग्य हिन्दी कृषि-पद है।
- source_word: וְזֵיתִים
  choice: जैतून के पेड़
  rationale: זיתים का सीधा अर्थ जैतून या जैतून के पेड़ है; ‘पेड़’ रोपने की अगली क्रिया के साथ सटीक बैठता है और अनावश्यक रूप से ‘उपवन’ नहीं जोड़ता।
- source_word: אֲשֶׁר לֹא נְטַעְתֶּם אַתֶּם אֹכְלִים
  choice: जिन्हें तुमने नहीं लगाया था, उनका फल तुम खा रहे हो
  rationale: נטע ‘लगाना/रोपना’ है और सर्वनाम सहित कृदन्त वर्तमान, कुछ बलयुक्त क्रिया दर्शाता है। हिन्दी में दाख की बारी और पेड़ों से ‘खाना’ कहने के लिए ‘उनका फल’ अर्थगत रूप से आवश्यक और स्वाभाविक पूर्ति है।
theological_decisions:
- issue: दूसरे पुरुष के एकवचन और बहुवचन रूपों का मिश्रण
  choice: पूरे पद में ‘तुम’ द्वारा इस्राएल को सामूहिक रूप से संबोधित करना
  alternative: एकवचन स्थान पर ‘तू’ और बहुवचन स्थानों पर ‘तुम’ करना
  rationale: इब्रानी में पहले ‘देश’ वाले उपवाक्य में सामूहिक एकवचन और आगे बहुवचन है। आधुनिक हिन्दी में ‘तू/तुम’ बदलने से सम्मान-स्तर बदलने का भ्रम होगा; ‘तुम’ सामूहिक संबोधन को स्वाभाविक रूप से बनाए रखता है।
- issue: ישב का कालगत बल
  choice: 'वर्तमान परिणामी अवस्था: ‘बसे हुए हो’'
  alternative: 'पूर्ण भूतकाल: ‘बस गए’'
  rationale: भाषण के समय इस्राएली उन नगरों में रह रहे हैं; अनुवाद बीते दान से उत्पन्न वर्तमान स्थिति को सुरक्षित रखता है।
- issue: אַתֶּם אֹכְלִים में बलयुक्त वर्तमान
  choice: ‘तुम खा रहे हो’
  alternative: ‘तुम खाते हो’
  rationale: स्वतंत्र सर्वनाम और कृदन्त वर्तमान सक्रिय अनुभव पर बल देते हैं; प्रगतिशील हिन्दी इस बल को सहजता से व्यक्त करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देश’, ‘नगर’, ‘दाख की बारियाँ’ और ‘जैतून के पेड़’ स्रोत के कृषि और वाचा-संबंधी संदर्भ को स्पष्ट रखते हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
