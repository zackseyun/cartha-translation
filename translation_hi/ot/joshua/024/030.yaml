base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/030.yaml
  text: And they buried him within the territory of his inheritance[a], at Timnath-serah, which is in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: hi
  text: और उन्होंने उसे उसके विरासत में मिले क्षेत्र[a] में, तिम्नत-सेरह में दफ़नाया, जो एप्रैम के पहाड़ी प्रदेश में गाश पर्वत के उत्तर में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी विरासत की सीमा में।” इब्रानी शब्द का अर्थ सीमा भी हो सकता है और उससे घिरा क्षेत्र भी; यहाँ संभवतः यह यहोशू को विरासत में मिले भूभाग को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: और उन्होंने उसे ... दफ़नाया
  rationale: वय्यिक्तोल रूप अगले कथात्मक घटनाक्रम को आगे बढ़ाता है; אֹתוֹ का पुल्लिंग एकवचन कर्मवाचक प्रत्यय पिछले संदर्भ के यहोशू को सूचित करता है।
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: उसकी विरासत के क्षेत्र में
  rationale: גְּבוּל का अर्थ सीमा-रेखा या उससे घिरा क्षेत्र, दोनों हो सकता है। दफ़नाने के स्थान और נַחֲלָה के संदर्भ में यहाँ आवंटित भूभाग का अर्थ अधिक स्वाभाविक है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: בְּתִמְנַת סֶרַח
  choice: तिम्नत-सेरह में
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण किया गया है; בְּ को स्थानसूचक ‘में’ से व्यक्त किया गया है।
- source_word: בְּהַר אֶפְרָיִם
  choice: एप्रैम के पहाड़ी प्रदेश में
  rationale: इस भौगोलिक प्रयोग में הַר किसी एक पर्वत की अपेक्षा पहाड़ी भूभाग को दर्शाता है।
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: गाश पर्वत के उत्तर में
  rationale: מִצְּפוֹן ... לְ सापेक्ष भौगोलिक स्थिति बताता है; הַר גָּעַשׁ को स्वाभाविक हिन्दी में ‘गाश पर्वत’ कहा गया है।
