  terminology: ‘दफ़नाया,’ ‘एप्रैम के पहाड़ी प्रदेश,’ and ‘गाश पर्वत’ are appropriate modern, dignified Hindi renderings. The geographic and inheritance terminology remains consistent with the Hebrew.
