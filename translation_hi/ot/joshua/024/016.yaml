source:
  edition: WLC
  text: וַ/יַּ֤עַן הָ/עָם֙ וַ/יֹּ֔אמֶר חָלִ֣ילָ/ה לָּ֔/נוּ מֵ/עֲזֹ֖ב אֶת יְהוָ֑ה לַ/עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/016.yaml
  text: Then the people answered and said[a], “Far be it from us to forsake Yahweh and serve other gods.”
translation:
  language: hi
  text: तब लोगों ने उत्तर दिया और कहा, “हमसे ऐसा न हो कि हम यहोवा को छोड़कर दूसरे देवताओं की सेवा करें!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן הָעָם וַיֹּאמֶר
  choice: तब लोगों ने उत्तर दिया
  rationale: हिब्रू में ‘उत्तर दिया और कहा’ सामान्य कथात्मक वाक्य-विन्यास है; स्वाभाविक आधुनिक हिंदी में ‘उत्तर दिया’ दोनों क्रियाओं का आशय पर्याप्त रूप से व्यक्त करता है।
- source_word: חָלִילָה לָּנוּ
  choice: यह हमसे दूर रहे
  rationale: यह मुहावरा तीव्र अस्वीकृति व्यक्त करता है। यह हिंदी रूप उसके बल को बनाए रखता है और मूल में अनुपस्थित ‘परमेश्वर न करे’ जैसे स्पष्ट ईश्वरीय उल्लेख को नहीं जोड़ता।
- source_word: מֵעֲזֹב
  choice: छोड़कर
  rationale: संदर्भ में क्रिया का अर्थ यहोवा के प्रति निष्ठा त्यागना है। ‘छोड़ना’ सामान्य पाठक के लिए सहज है और वाचा-संबंधी परित्याग का आशय संदर्भ से स्पष्ट रहता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिंदी में प्रचलित और पहचाने जाने योग्य लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से प्रतिस्थापित किया गया।
- source_word: לַעֲבֹד
  choice: सेवा करें
  rationale: עבד देवताओं के संबंध में उपासना, अधीनता और निष्ठापूर्ण सेवा का व्यापक अर्थ रखता है; ‘सेवा करना’ इस अर्थ-क्षेत्र को सुरक्षित रखता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह सीधा और स्वाभाविक हिंदी अनुवाद है; ‘पराए’ या ‘विदेशी’ मूल पाठ से अधिक अर्थ जोड़ सकते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है; इसलिए उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिंदी के प्रचलित लिप्यंतरण में रखा गया है।
- issue: חָלִילָה की प्रबल अस्वीकृति
  choice: यह हमसे दूर रहे
  alternative: परमेश्वर न करे
  rationale: वैकल्पिक पारंपरिक मुहावरा प्रभावशाली है, पर मूल हिब्रू इस पदबंध में परमेश्वर का स्पष्ट उल्लेख नहीं करता। चुना हुआ रूप उस जोड़ से बचते हुए तीव्र निषेध व्यक्त करता है।
- issue: त्यागने और सेवा करने का संबंध
  choice: यहोवा को छोड़कर दूसरे देवताओं की सेवा करें
  alternative: यहोवा को छोड़ें और दूसरे देवताओं की सेवा करें
  rationale: हिब्रू में לַעֲבֹד उद्देश्य/परिणाम का संबंध व्यक्त कर सकता है। हिंदी का ‘छोड़कर ... सेवा करें’ इस संबंध को स्वाभाविक रूप से रखता है, जबकि समन्वित विकल्प भी अर्थ की दृष्टि से संभव है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। विस्मयादिबोधक चिह्न חָלִילָה की तीव्र अस्वीकृति को व्यक्त करता है।
