  text: וָ/אֶשְׁלַ֞ח אֶת מֹשֶׁ֤ה וְ/אֶֽת אַהֲרֹן֙ וָ/אֶגֹּ֣ף אֶת מִצְרַ֔יִם כַּ/אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּ֑/וֹ וְ/אַחַ֖ר הוֹצֵ֥אתִי אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/005.yaml
  text: Then I sent Moses and Aaron[a], and I struck Egypt as I did in its midst[b], and afterward I brought you out.
translation:
  language: hi
  text: फिर मैंने मूसा और हारून को भेजा, और मैंने मिस्र को आघात पहुँचाया[a], जैसा मैंने उसके बीच में किया था[b]; और उसके बाद मैं तुम्हें बाहर निकाल लाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिस्र को पीड़ित किया।” यहाँ इब्रानी क्रिया का अर्थ प्रहार करना या पीड़ा पहुँचाना हो सकता है; इस प्रसंग में यह मिस्र पर यहोवा के आघातों की ओर संकेत करती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसके बीच में मैंने जो किया उसके अनुसार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: मैंने ... भेजा
  rationale: שׁלח के सामान्य अर्थ ‘भेजना’ को स्वाभाविक और सीधी हिन्दी में व्यक्त करता है।
- source_word: מֹשֶׁה וְאֶת־אַהֲרֹן
  choice: मूसा और हारून
  rationale: इन व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं।
- source_word: וָאֶגֹּף
  choice: प्रहार किया
  rationale: נגף के ‘मारना/आघात पहुँचाना/पीड़ित करना’ अर्थ-क्षेत्र को बनाए रखता है और ‘विपत्तियाँ भेजीं’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: यहाँ नाम देश अथवा उसके लोगों को सामूहिक रूप से सूचित कर सकता है; ‘मिस्र’ इस अस्पष्टता को बनाए रखता है।
- source_word: כַּאֲשֶׁר עָשִׂיתִי בְּקִרְבּוֹ
  choice: जैसा मैंने उसके बीच में किया था
  rationale: मूल के संक्षिप्त और कुछ असामान्य वाक्य-विन्यास को अत्यधिक स्पष्ट किए बिना निकटता से प्रस्तुत करता है; ‘उसके’ का एकवचन संकेत मिस्र की ओर है।
- source_word: וְאַחַר
  choice: और उसके बाद
  rationale: घटनाओं के कालक्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: मैं तुम्हें बाहर निकाल लाया
  rationale: יצא के हिफ़ील रूप का कारणवाचक अर्थ ‘बाहर ले आना/निकाल लाना’ रखता है और दूसरे पुरुष बहुवचन संबोधन को सुरक्षित रखता है।
theological_decisions:
- issue: ‘तुम्हें’ का संदर्भ
  choice: इस्राएल को सामूहिक रूप से संबोधित करते हुए मूल का सीधा ‘तुम्हें’ रखा गया है।
  alternative: इसे स्पष्ट करके ‘तुम्हारे पुरखों को’ कहना।
  rationale: वाचा-संबंधी सामूहिक एकता के कारण तत्कालीन श्रोताओं को निर्गमन की पीढ़ी के साथ जोड़ने वाली मूल वाणी को व्याख्यात्मक रूप से नहीं बदला गया।
- issue: मिस्र पर प्रहार का स्वरूप
  choice: व्यापक अर्थ वाला ‘प्रहार किया’ रखा गया है।
  alternative: ‘मिस्र पर विपत्तियाँ भेजीं’ कहना।
  rationale: संदर्भ विपत्तियों की ओर संकेत करता है, पर मूल क्रिया स्वयं ‘प्रहार/आघात’ का व्यापक अर्थ रखती है; अनुवाद ने संदर्भगत व्याख्या को मुख्य पाठ में अनिवार्य नहीं बनाया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘प्रहार किया’ मूल की तीव्रता बनाए रखता है, जबकि कठिन मध्यवर्ती उपवाक्य को मुख्य पाठ और शाब्दिक पाद-टिप्पणी के संयोजन से प्रस्तुत किया गया है।
