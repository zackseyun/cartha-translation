reference: Joshua 24:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֗י אַֽחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/029.yaml
  text: And it happened after these things that Joshua son of Nun[a], the servant of Yahweh, died[b], being one hundred and ten years old.
translation:
  language: hi
  text: इन बातों[a] के बाद ऐसा हुआ कि याहवे का सेवक[b], नून का पुत्र यहोशू, एक सौ दस वर्ष की आयु में मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इन घटनाओं के बाद।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अनुवाद ‘दास’ भी हो सकता है; यहाँ यह सम्मानित सेवा बताने वाली उपाधि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ
  rationale: यह कथात्मक क्रम में अगली घटना का परिचय देता है। ‘ऐसा हुआ’ इब्रानी कथन-शैली को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: इन बातों के बाद
  rationale: यह मानक काल-सूचक वाक्यांश है। דְּבָרִים का निकट अर्थ ‘बातों’ है, जबकि प्रसंग में ‘घटनाओं’ भी संभव है।
- source_word: וַיָּמָת
  choice: मर गया
  rationale: מות का सीधा अर्थ ‘मरना’ है; इसे अनावश्यक रूप से मृदु नहीं किया गया।
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: नून का पुत्र यहोशू
  rationale: व्यक्तिगत नामों के प्रचलित हिन्दी रूप और इब्रानी पितृनाम-संबंध को सुरक्षित रखा गया है।
- source_word: עֶבֶד יְהוָה
  choice: याहवे का सेवक
  rationale: עֶבֶד का अर्थ ‘सेवक’ या ‘दास’ हो सकता है; यहाँ यह याहवे की सम्मानित सेवा बताने वाली उपाधि है, इसलिए ‘सेवक’ प्रसंगानुकूल है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: एक सौ दस वर्ष की आयु में
  rationale: शाब्दिक रूप से ‘एक सौ दस वर्षों का पुत्र’ इब्रानी में आयु बताने वाला मुहावरा है; हिन्दी में इसका स्वाभाविक अर्थ दिया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त हुआ है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: עֶבֶד की सेवक-दास अर्थ-सीमा
  choice: सेवक
  alternative: दास
  rationale: दोनों अर्थ शब्दगत रूप से संभव हैं, पर यहाँ यह यहोशू की सम्मानसूचक उपाधि है और बंधुआ स्थिति पर बल नहीं देती।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली रखी गई है। वाक्य-विन्यास हिन्दी की स्वाभाविकता के अनुसार है, और मूल की काल-सूचक शुरुआत, वंश-परिचय, सम्मानसूचक उपाधि तथा आयु सुरक्षित हैं।
