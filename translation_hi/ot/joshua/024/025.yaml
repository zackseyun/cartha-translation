reference: Joshua 24:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוֹשֻׁ֧עַ בְּרִ֛ית לָ/עָ֖ם בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יָּ֥שֶׂם ל֛/וֹ חֹ֥ק וּ/מִשְׁפָּ֖ט בִּ/שְׁכֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/025.yaml
  text: So Joshua made a covenant with the people on that day[b][a], and there in Shechem he set for them a statute and an ordinance.
translation:
  language: hi
  text: इस प्रकार यहोशू ने उस दिन लोगों के साथ वाचा बाँधी[a], और वहीं शकेम में उनके लिए एक विधि और नियम ठहराया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का शब्दशः अर्थ है, ‘वाचा काटी।’
    reason: lexical_alternative
  - marker: b
    text: या, “उनके लिए एक विधि और न्याय-विधान ठहराया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: बाँधी
  rationale: כרת ברית का शब्दशः अर्थ ‘वाचा काटना’ है, पर यह इब्रानी मुहावरा वाचा स्थापित करने को व्यक्त करता है। हिन्दी में ‘वाचा बाँधना’ स्वाभाविक, गरिमापूर्ण और बंधनकारी संबंध का भाव बनाए रखता है।
- source_word: בְּרִית
  choice: वाचा
  rationale: ‘वाचा’ धार्मिक और विधिक दोनों आयामों वाले बाध्यकारी संबंध को व्यक्त करती है; ‘समझौता’ इसकी गंभीरता और व्यापकता को घटा सकता है।
- source_word: לָעָם
  choice: लोगों के साथ
  rationale: यद्यपि यहाँ ל उपसर्ग है, כרת ברית के साथ लोग वाचा में सहभागी पक्ष हैं; इसलिए हिन्दी में ‘लोगों के साथ’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह काल-सूचक पद का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וַיָּשֶׂם
  choice: ठहराया
  rationale: שׂים का मूल अर्थ रखना या स्थापित करना है। विधिक वस्तुओं के साथ ‘ठहराया’ नियम को निश्चित और लागू किए जाने का भाव स्पष्ट करता है।
- source_word: לוֹ
  choice: उनके लिए
  rationale: इब्रानी सर्वनाम व्याकरणतः एकवचन है क्योंकि वह सामूहिक एकवचन עָם की ओर संकेत करता है; हिन्दी में उस समुदाय के लिए बहुवचन ‘उनके’ स्वाभाविक है।
- source_word: חֹק
  choice: विधि
  rationale: חֹק किसी निश्चित किए हुए विधान या वैधानिक व्यवस्था को दर्शाता है; ‘विधि’ इसका संक्षिप्त और सुबोध हिन्दी रूप है।
- source_word: וּמִשְׁפָּט
  choice: नियम
  rationale: इस विधिक प्रसंग में מִשְׁפָּט न्यायिक निर्णय, व्यवस्था या लागू नियम का बोध करा सकता है। ‘नियम’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘न्याय’ यहाँ अमूर्त अर्थ का भ्रम दे सकता है। वैकल्पिक ‘न्याय-विधान’ पाद-टिप्पणी में सुरक्षित है।
- source_word: בִּשְׁכֶם
  choice: वहीं शकेम में
  rationale: ‘शकेम में’ स्थान को ठीक-ठीक रखता है; ‘वहीं’ कथानक के उसी सभा-स्थल से इस कार्य को स्वाभाविक रूप से जोड़ता है।
theological_decisions:
- issue: यहोशू की वाचा-संबंधी भूमिका
  choice: यहोशू ने लोगों के साथ वाचा बाँधी
  alternative: यहोशू ने लोगों की ओर से वाचा को नया किया
  rationale: पद में यहोशू कर्ता है और लोग वाचा से संबंधित पक्ष हैं; इस पद में न तो वाचा के नवीनीकरण की बात स्पष्ट रूप से कही गई है, न ही दूसरे पक्ष को विस्तार से परिभाषित किया गया है। इसलिए अनुवाद व्यापक प्रसंग से कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली अपनाई गई है। ‘वाचा बाँधी’ धार्मिक-विधिक गंभीरता को बनाए रखते हुए हिन्दी में स्वाभाविक है। ‘विधि और नियम’ सामान्य पाठकों के लिए बोधगम्य युग्म है; इब्रानी מִשְׁפָּט की न्यायिक छाया पाद-टिप्पणी में दी गई है।
