base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/012.yaml
  text: And I sent the hornet ahead of you[a], and it drove them out before you—the two kings of the Amorites—not by your sword and not by your bow.
translation:
  language: hi
  text: और मैंने तुम्हारे आगे बर्रे को भेजा[a]; उसने तुम्हारे सामने से उन्हें—अमोरियों के उन दोनों राजाओं को—खदेड़ दिया। यह न तुम्हारी तलवार से हुआ, न तुम्हारे धनुष से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, वास्तविक बर्रों के बजाय परमेश्वर द्वारा भेजी गई घबराहट या आतंक के लिए एक आलंकारिक अभिव्यक्ति।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: और मैंने भेजा
  rationale: कालक्रम में आगे बढ़ती हुई यहोवा की पिछली क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִפְנֵיכֶם
  choice: तुम्हारे आगे
  rationale: शाब्दिक अर्थ ‘तुम्हारे सामने’ है; यहाँ पहले से आगे भेजे जाने का भाव है।
- source_word: הַצִּרְעָה
  choice: बर्रों को
  rationale: संज्ञा का मूल अर्थ बर्रा/हॉर्नेट है। हिब्रू का निश्चित एकवचन सामूहिक अर्थ में समझा जा सकता है; स्वाभाविक हिन्दी में बहुवचन इस आशय को स्पष्ट करता है, जबकि रूपक की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: וַתְּגָרֶשׁ
  choice: और उन्होंने ... निकाल दिया
  rationale: גרשׁ का अर्थ बलपूर्वक बाहर निकालना या खदेड़ना है। हिन्दी में सामूहिक ‘बर्रों’ के अनुसार बहुवचन क्रिया स्वाभाविक है।
- source_word: מִפְּנֵיכֶם
  choice: तुम्हारे सामने से
  rationale: मूल मुहावरे को निकटता से रखते हुए इस्राएलियों की उपस्थिति से हटाए जाने का भाव देता है।
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: अमोरियों के दोनों राजाओं को
  rationale: हिब्रू रचनात्मक शृंखला का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: לֹא בְחַרְבְּךָ וְלֹא בְקַשְׁתֶּךָ
  choice: यह न तुम्हारी तलवार से हुआ, न तुम्हारे धनुष से
  rationale: ב के करणवाचक अर्थ और दोनों समानांतर निषेधों को बनाए रखता है; ‘यह ... हुआ’ जोड़ने से हिन्दी वाक्य पूरा और सहज बनता है।
theological_decisions:
- issue: הַצִּרְעָה को वास्तविक बर्रों के रूप में अनूदित किया जाए या परमेश्वर द्वारा भेजे गए भय के रूपक के रूप में
  choice: मुख्य पाठ में ‘बर्रों’ का शाब्दिक अनुवाद
  alternative: ‘घबराहट’ या ‘आतंक’ जैसे व्याख्यात्मक अनुवाद
  rationale: मूल शब्द का सामान्य अर्थ बर्रा है और प्रसंग अनिवार्य रूप से रूपक की माँग नहीं करता। परमेश्वर की निर्णायक भूमिका दोनों अर्थों में बनी रहती है; वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सहज। बहुवचन ‘बर्रों’ और ‘उन्होंने’ हिन्दी में सामूहिक अर्थ को स्वाभाविक बनाते हैं। एकवचन ‘तुम्हारी’ मूल पाठ के सामूहिक इस्राएल को एक इकाई मानकर किए गए सम्बोधन को सुरक्षित रखता है।
