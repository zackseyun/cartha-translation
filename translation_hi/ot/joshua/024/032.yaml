base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/032.yaml
  text: And the bones of Joseph[a], which the sons of Israel had brought up from Egypt, they buried at Shechem, in the portion of the field that Jacob had bought from the sons of Hamor, the father of Shechem, for a hundred qesitahs[c][b]; and it became an inheritance for the sons of Joseph.
translation:
  language: hi
  text: इस्राएल के पुत्रों ने यूसुफ की हड्डियों को, जिन्हें वे मिस्र से ऊपर ले आए थे, शकेम में खेत के उस भूखंड[a] में दफ़नाया, जिसे याकूब ने शकेम के पिता[c] हमोर के पुत्रों से एक सौ कसीता[b] देकर खरीदा था। वह भूखंड यूसुफ के पुत्रों की विरासत हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खेत के हिस्से में।” इब्रानी शब्द भूमि के किसी निश्चित भाग या भूखंड को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “कसीता” मूल्य या मुद्रा की एक प्राचीन इकाई थी; उसका ठीक-ठीक आधुनिक मूल्य अज्ञात है।
    reason: cultural_note
  - marker: c
    text: या संभवतः “शकेम के संस्थापक/प्रमुख पूर्वज”; “पिता” शब्द कभी-कभी व्यापक पूर्वजगत अर्थ में भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹת יוֹסֵף
  choice: यूसुफ की हड्डियों
  rationale: עַצְמוֹת का ठोस अर्थ ‘हड्डियाँ’ है; इससे मूल की स्पष्टता और यूसुफ के दफ़नाए जाने की परंपरा से संबंध बना रहता है।
- source_word: הֶעֱלוּ
  choice: ऊपर ले आए थे
  rationale: हिफ़ील रूप का अर्थ ‘ऊपर लाना’ है। ‘ले आए थे’ दफ़नाने से पहले पूरी हुई क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘ऊपर’ मूल की दिशा-सूचना बचाता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह मूल के पारिवारिक और वाचागत पद को सुरक्षित रखता है तथा आधुनिक हिन्दी में समझने योग्य है।
- source_word: בְּחֶלְקַת הַשָּׂדֶה
  choice: उस खेत के भूखंड
  rationale: חֶלְקָה किसी भूमि के निश्चित भाग या भूखंड को दर्शाता है; ‘भूखंड’ संक्षिप्त, स्वाभाविक और सटीक है।
- source_word: בְּנֵי חֲמוֹר
  choice: हमोर के पुत्रों
  rationale: शाब्दिक पारिवारिक अभिव्यक्ति रखी गई है; ‘वंशजों’ कहना संभव है, पर अधिक व्याख्यात्मक होगा।
- source_word: אֲבִי שְׁכֶם
  choice: शकेम के पिता
  rationale: מूल वाक्यांश का सीधा अर्थ यही है। ‘संस्थापक’ या ‘प्रमुख पूर्वज’ की व्यापक संभावना मुख्य पाठ में थोपने के बजाय अस्पष्टता सुरक्षित रखी गई है।
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: एक सौ कसीता
  rationale: קְשִׂיטָה प्राचीन मूल्य या मुद्रा की अनिश्चित इकाई है। लिप्यंतरण झूठी आधुनिक समानता से बचाता है।
- source_word: וַיִּהְיוּ לִבְנֵי יוֹסֵף לְנַחֲלָה
  choice: वह भूखंड यूसुफ के पुत्रों की विरासत हो गया
  rationale: क्रिया का हिब्रू रूप बहुवचन है, पर संदर्भ में संपत्ति/भूखंड का यूसुफ के पुत्रों की विरासत होना अभिप्रेत है। स्पष्ट हिन्दी के लिए संज्ञा फिर से दी गई है।
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל की वाचागत पारिवारिक अभिव्यक्ति
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: ‘इस्राएल के पुत्र’ मूल की पारिवारिक पहचान को बनाए रखता है और अनावश्यक रूप से उसे केवल जातीय नाम में नहीं बदलता।
- issue: קְשִׂיטָה की अनिश्चित प्राचीन इकाई
  choice: कसीता
  alternative: चाँदी के सिक्के / मुद्रा की इकाइयाँ
  rationale: सटीक आधुनिक मूल्य अज्ञात होने के कारण लिप्यंतरण मूल की ऐतिहासिक और अर्थगत अनिश्चितता सुरक्षित रखता है।
- issue: וַיִּהְיוּ का व्याकरणिक बहुवचन और उसका संदर्भ
  choice: वह भूखंड ... विरासत हो गया
  alternative: वे ... विरासत हो गए
  rationale: हिब्रू बहुवचन को सीधे हड्डियों से जोड़ना अर्थगत कठिनाई पैदा करता है; निकटवर्ती भूमि-संपत्ति को संदर्भ मानना प्रसंगानुकूल है। फिर भी यह व्याकरणिक तनाव निर्णय में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘दफ़नाया’, ‘भूखंड’ और ‘विरासत’ वर्तमान प्रचलित शब्द हैं। मूल की पारिवारिक अभिव्यक्तियाँ और प्राचीन मुद्रा का नाम सुरक्षित रखा गया है।
