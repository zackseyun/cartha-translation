source:
  edition: WLC
  text: וָ/אֶתֵּ֣ן לְ/יִצְחָ֔ק אֶֽת יַעֲקֹ֖ב וְ/אֶת עֵשָׂ֑ו וָ/אֶתֵּ֨ן לְ/עֵשָׂ֜ו אֶת הַ֤ר שֵׂעִיר֙ לָ/רֶ֣שֶׁת אוֹת֔/וֹ וְ/יַעֲקֹ֥ב וּ/בָנָ֖י/ו יָרְד֥וּ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/004.yaml
  text: And I gave Isaac Jacob and Esau[a], and I gave Esau the hill country of Seir to possess[b]; but Jacob and his sons went down to Egypt.
translation:
  language: hi
  text: और मैंने इसहाक को याकूब और एसाव दिए। मैंने एसाव को सेईर का पहाड़ी प्रदेश दिया कि वह उस पर अधिकार करे; पर याकूब और उसके पुत्र मिस्र गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मिस्र को नीचे गए।” ‘नीचे जाना’ मिस्र की ओर यात्रा के लिए प्रयुक्त दिशात्मक अभिव्यक्ति है।
    reason: ירד की दिशात्मक अभिव्यक्ति को स्पष्ट करना।
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: मैंने ... दिए / दिया
  rationale: נתן का सीधा अर्थ ‘देना’ है। इब्रानी में दो बार आए क्रियापद की पुनरावृत्ति रखी गई है और हिन्दी में वचन के अनुसार रूप बदला गया है।
- source_word: לְיִצְחָק
  choice: इसहाक को
  rationale: לְ लाभार्थी को सूचित करता है; नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: אֶת יַעֲקֹב וְאֶת עֵשָׂו
  choice: याकूब और एसाव
  rationale: प्रत्यक्ष कर्म चिह्न אֶת का अलग अनुवाद आवश्यक नहीं; दोनों नाम प्रचलित हिन्दी रूपों में हैं।
- source_word: הַר שֵׂעִיר
  choice: सेईर का पहाड़ी प्रदेश
  rationale: הַר यहाँ एक अकेली चोटी के बजाय एसाव को दिए गए सेईर के पर्वतीय भूभाग को सूचित कर सकता है।
- source_word: לָרֶשֶׁת אֹתוֹ
  choice: अधिकार में लेने के लिए
  rationale: ירש भूमि को अपने अधिकार या कब्जे में लेने का भाव देता है। लक्ष्यभूमि वाक्य में पहले स्पष्ट होने के कारण हिन्दी में सर्वनाम दोहराना आवश्यक नहीं।
- source_word: יָרְדוּ מִצְרָיִם
  choice: मिस्र गए
  rationale: ירד का शाब्दिक अर्थ ‘नीचे जाना’ है, पर आधुनिक सामान्य हिन्दी में भौगोलिक दिशा का यह मुहावरा अस्पष्ट या अस्वाभाविक हो सकता है; ‘गए’ घटना को स्वाभाविक रूप से व्यक्त करता है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: अंतिम וְ का संबंध
  choice: ‘पर’ द्वारा कथात्मक विरोध स्पष्ट करना
  alternative: ‘और याकूब और उसके पुत्र...’
  rationale: וְ मूलतः सामान्य संयोजक है और स्वयं अनिवार्य रूप से विरोधसूचक नहीं, किंतु एसाव को भूमि मिलने और याकूब के परिवार के मिस्र जाने के बीच प्रसंगगत विरोध है। ‘पर’ उसी निहित विरोध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पहाड़ी प्रदेश’ क्षेत्रीय अर्थ को स्पष्ट करता है; ‘अधिकार में लेने’ में भूमि-प्राप्ति का भाव सुरक्षित है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
