source:
  edition: WLC
  text: וַ/יִּצְעֲק֣וּ אֶל יְהוָ֗ה וַ/יָּ֨שֶׂם מַֽאֲפֵ֜ל בֵּינֵי/כֶ֣ם וּ/בֵ֣ין הַ/מִּצְרִ֗ים וַ/יָּבֵ֨א עָלָ֤י/ו אֶת הַ/יָּם֙ וַ/יְכַסֵּ֔/הוּ וַ/תִּרְאֶ֨ינָה֙ עֵינֵי/כֶ֔ם אֵ֥ת אֲשֶׁר עָשִׂ֖יתִי בְּ/מִצְרָ֑יִם וַ/תֵּשְׁב֥וּ בַ/מִּדְבָּ֖ר יָמִ֥ים רַבִּֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/007.yaml
  text: Then they cried out to Yahweh[a], and he put darkness between you and the Egyptians, and brought the sea upon him and covered him, and your eyes saw what I did in Egypt. Then you lived in the wilderness many days.
translation:
  language: hi
  text: तब उन्होंने याहवे को पुकारा, और उसने तुम्हारे और मिस्रियों के बीच अंधकार डाल दिया। वह समुद्र को उस पर ले आया और उसे ढक दिया[a]। तुम्हारी आँखों ने देखा कि मैंने मिस्र में क्या किया। फिर तुम बहुत दिनों तक निर्जन प्रदेश में रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ सर्वनाम एकवचन हैं—“उस पर” और “उसे।” सम्भवतः इनका सामूहिक संकेत मिस्र या मिस्री सेना की ओर है; अनेक अनुवाद यहाँ बहुवचन “उन पर” और “उन्हें” लिखते हैं।
    reason: एकवचन सर्वनामों की स्रोतगत असामान्यता और सम्भावित सामूहिक अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּצְעֲקוּ אֶל־יְהוָה
  choice: उन्होंने याहवे को पुकारा
  rationale: צעק संकट में सहायता के लिए पुकारने को व्यक्त करता है। “पुकारा” स्वाभाविक हिन्दी है और אֶל द्वारा दिखाई गई प्रार्थनापूर्ण दिशा को बनाए रखता है। परमेश्वर के व्यक्तिगत नाम יְהוָה को “याहवे” लिखा गया है।
- source_word: מַאֲפֵל
  choice: अंधकार
  rationale: यह संज्ञा अंधकार या घोर अँधेरे को दर्शाती है। “अंधकार” स्पष्ट, गरिमापूर्ण और प्रसंगानुकूल है, जबकि तीव्रता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בֵּינֵיכֶם וּבֵין הַמִּצְרִים
  choice: तुम्हारे और मिस्रियों के बीच
  rationale: द्वितीय पुरुष बहुवचन को बनाए रखा गया है; यह यहोशू के वर्तमान श्रोताओं को उनके पूर्वजों के साथ वाचा-संबंधी रूप से संबोधित करता है।
- source_word: וַיָּבֵא עָלָיו אֶת־הַיָּם וַיְכַסֵּהוּ
  choice: वह समुद्र को उस पर ले आया और उसे ढक दिया
  rationale: עָלָיו और וַיְכַסֵּהוּ में एकवचन पुंल्लिंग प्रत्यय हैं। “उस पर” और “उसे” इन्हें स्पष्ट रखते हैं; बहुवचन “उन पर/उन्हें” करके पाठ को सहज बनाने का प्रयास नहीं किया गया।
- source_word: וַתִּרְאֶינָה עֵינֵיכֶם
  choice: तुम्हारी आँखों ने देखा
  rationale: मूल पाठ में आँखों का स्पष्ट और बलपूर्ण उल्लेख है। हिन्दी में भी उसे बनाए रखने से प्रत्यक्ष साक्ष्य का भाव बना रहता है।
- source_word: אֵת אֲשֶׁר עָשִׂיתִי בְּמִצְרָיִם
  choice: कि मैंने मिस्र में क्या किया
  rationale: בְּ का सामान्य स्थानीय अर्थ “में” रखा गया है; “मिस्र के विरुद्ध” कहकर उसके अर्थ को अधिक निश्चित नहीं किया गया।
- source_word: וַתֵּשְׁבוּ בַמִּדְבָּר יָמִים רַבִּים
  choice: तुम बहुत दिनों तक निर्जन प्रदेश में रहे
  rationale: יָמִים רַבִּים का “बहुत दिनों तक” स्रोत के निकट और स्वाभाविक है। מִדְבָּר के लिए “निर्जन प्रदेश” चुना गया है, क्योंकि यह केवल रेतीले मरुस्थल नहीं बल्कि निर्जन वन्य भूभाग को भी दर्शा सकता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: यहाँ इब्रानी पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। “याहवे” नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: मिस्री शक्ति के लिए प्रयुक्त एकवचन सर्वनाम
  choice: मुख्य पाठ में “उस पर” और “उसे”
  alternative: “उन पर” और “उन्हें”; अथवा “मिस्रियों पर” और “मिस्रियों को”
  rationale: इब्रानी प्रत्यय व्याकरणतः एकवचन हैं। वे संभवतः मिस्र या उसकी सेना को सामूहिक एकवचन के रूप में दर्शाते हैं। बहुवचन करना अर्थ को सहज बनाता, पर स्रोत की वास्तविक असामान्यता और सम्भावित सामूहिक प्रयोग को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “याहवे” व्यक्तिगत ईश्वरीय नाम को सुरक्षित रखता है। एकवचन सर्वनाम जानबूझकर बनाए गए हैं और उसी स्थान पर [a] लगाया गया है जहाँ स्पष्टीकरण आवश्यक है।
