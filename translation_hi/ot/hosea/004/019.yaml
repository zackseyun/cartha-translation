base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/019.yaml
  text: The wind has wrapped her in its wings[a], and they will be put to shame because of their sacrifices.
translation:
  language: hi
  text: हवा ने उसे अपने पंखों में लपेट लिया है[a], और वे अपने बलिदानों के कारण लज्जित होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक आत्मा ने उसे अपने पंखों में बाँध लिया है।” इब्रानी शब्द רוּחַ का अर्थ “हवा,” “श्वास” या “आत्मा” हो सकता है, और क्रिया का अर्थ “बाँधना,” “घेरना” या “लपेटना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַר
  choice: लपेट लिया है
  rationale: क्रिया बाँधने, घेरने या लपेटने का भाव देती है। हवा और पंखों के काव्यात्मक बिंब में ‘लपेट लिया है’ स्वाभाविक है और पूर्ण हो चुकी क्रिया के वर्तमान परिणाम को भी व्यक्त करता है।
- source_word: רוּחַ
  choice: हवा
  rationale: ‘हवा’, ‘श्वास’ और ‘आत्मा’ संभव अर्थ हैं; पंखों और आने वाले न्याय के बिंब में ‘हवा’ सबसे स्वाभाविक है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: אוֹתָהּ
  choice: उसे
  rationale: स्त्रीलिंग एकवचन कर्मवाचक रूप संदर्भ में स्त्री के रूप में चित्रित सामूहिक इस्राएल/एप्रैम की ओर संकेत करता है। हिन्दी में सर्वनाम का लिंग प्रकट नहीं होता, इसलिए ‘उसे’ स्वाभाविक है।
- source_word: בִּכְנָפֶיהָ
  choice: अपने पंखों में
  rationale: स्त्रीलिंग प्रत्यय व्याकरणतः רוּחַ से मेल खाता है। ‘में’ पकड़े या घिरे होने का बिंब बनाए रखता है और ‘अपने’ स्पष्ट करता है कि पंख हवा के हैं।
- source_word: וְיֵבֹשׁוּ
  choice: और वे ... लज्जित होंगे
  rationale: בוש लज्जा या अपमान को सूचित करता है। ‘लज्जित होंगे’ आधुनिक हिन्दी में स्वाभाविक रहते हुए भावी परिणाम और न्याय-संदर्भ दोनों व्यक्त करता है।
- source_word: מִזִּבְחוֹתָם
  choice: अपने बलिदानों के कारण
  rationale: 'यहाँ מן को कारणसूचक समझना संदर्भानुकूल है: उनके बलिदान उनकी लज्जा का कारण बनेंगे। ‘के कारण’ इस संबंध को स्पष्ट करता है।'
theological_decisions:
- issue: न्याय के बिंब और उसके विशिष्ट आशय
  choice: पद इस्राएल/एप्रैम को विनाशकारी हवा द्वारा जकड़े जाने और अपने बलिदानों के कारण लज्जित होने के रूप में चित्रित करता है।
  alternative: यह बिंब विशेष रूप से निर्वासन का, सामान्य विपत्ति का, या ‘आत्मा’ द्वारा बाँधे जाने का संकेत हो सकता है।
  rationale: तात्कालिक संदर्भ उपासना-संबंधी विश्वासघात और बलिदानों से उत्पन्न लज्जा पर केंद्रित है। अनुवाद हवा के काव्यात्मक बिंब को बनाए रखता है, पर उसे निर्वासन, विपत्ति या किसी अन्य विशिष्ट न्याय के रूप में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘हवा’ तथा ‘पंखों में लपेट लिया’ मूल बिंब को सहज ढंग से रखते हैं; ‘बलिदान’ धार्मिक संदर्भ की औपचारिकता बनाए रखता है।
