  yaml_path: translation/ot/hosea/004/011.yaml
  text: Sexual immorality[a], wine, and new wine take away the heart.
translation:
  language: hi
  text: यौन अनैतिकता, दाखमधु और नया दाखमधु समझ छीन लेते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “विवेक हर लेते हैं”; इब्रानी में शाब्दिक रूप से “हृदय ले लेते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְנוּת
  choice: व्यभिचार
  rationale: यह संज्ञा अनुचित यौन आचरण को दर्शाती है और होशे में वेश्यावृत्ति तथा वाचा के प्रति विश्वासघात की छाया भी रख सकती है। ‘व्यभिचार’ आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और नैतिक बल वाला व्यापक पद है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: यह किण्वित अंगूरी मदिरा का सामान्य शब्द है। ‘दाखमधु’ बाइबलीय संदर्भ में स्पष्ट है और अगले पद ‘नया दाखमधु’ के साथ शब्दगत भेद बनाए रखता है।
- source_word: תִּירוֹשׁ
  choice: नया दाखमधु
  rationale: यह प्रायः नई या ताज़ी अंगूरी मदिरा को दर्शाता है और יַיִן से भिन्न शब्द है; ‘नया दाखमधु’ उस भेद को सुरक्षित रखता है।
- source_word: יִקַּח
  choice: हर लेते हैं
  rationale: क्रिया का मूल अर्थ ‘लेना’ है, पर ‘मन’ के साथ यह उसे छीन लेने या विवेक को वश में कर लेने का भाव देती है। बहुवचन कर्ताओं के अनुरूप हिन्दी में ‘हर लेते हैं’ स्वाभाविक है।
- source_word: לֵב
  choice: मन
  rationale: इब्रानी ‘हृदय’ बुद्धि, इच्छा और निर्णय-शक्ति सहित भीतरी व्यक्ति को व्यक्त कर सकता है। आधुनिक हिन्दी में इस मुहावरे के भीतर ‘मन’ अधिक स्वाभाविक है, जबकि फुटनोट समझ और विवेक के निहित अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: अंतिम मुहावरे को शाब्दिक ‘हृदय’ के रूप में रखा जाए या समझ/विवेक की हानि के रूप में व्याख्यायित किया जाए
  choice: मुख्य पाठ में ‘मन हर लेते हैं’ रखकर इब्रानी की ठोस भीतरी-व्यक्ति वाली छवि को हिन्दी मुहावरे में सुरक्षित किया गया है।
  alternative: ‘समझ छीन लेते हैं’ या ‘विवेक हर लेते हैं।’
  rationale: यहाँ नैतिक और मानवीय प्रभाव व्यक्त है, कोई तकनीकी सिद्धान्त नहीं। ‘मन’ मूल के व्यापक आन्तरिक अर्थ को बनाए रखता है, और समझ/विवेक का अधिक व्याख्यात्मक अर्थ फुटनोट में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और साधारण पाठक के लिए सुबोध। समानान्तर संज्ञाओं की लय तथा יַיִן और תִּירוֹשׁ का शब्दगत भेद बनाए रखा गया है।
