  text: Ephraim is joined to idols[a]; leave him alone.
translation:
  language: hi
  text: एप्रैम मूर्तियों से बँधा हुआ है[a]; उसे छोड़ दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एप्रैम मूर्तियों से जुड़ा हुआ है; उसे वैसा ही रहने दे।” इब्रानी वाक्य बहुत संक्षिप्त है; अंतिम आज्ञा का आशय एप्रैम को उसकी चुनी हुई मूर्तिपूजा के हाल पर छोड़ देना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבוּר
  choice: बँधा हुआ है
  rationale: यह חבר का निष्क्रिय कृदन्त है और जुड़े या बँधे होने का भाव देता है। ‘बँधा हुआ’ संबंध की दृढ़ता व्यक्त करता है, पर उसके ठीक स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עֲצַבִּים
  choice: मूर्तियों
  rationale: यह शब्द प्रतिमाओं के लिए प्रयुक्त हो सकता है, किंतु नबी की मूर्तिपूजा-विरोधी भाषा में ‘मूर्तियाँ’ धार्मिक अर्थ और निंदात्मक संदर्भ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶפְרָיִם
  choice: एप्रैम
  rationale: मूल पाठ के व्यक्तिवाचक नाम को लिप्यंतरित किया गया है। होशे में यह प्रायः उत्तरी राज्य का प्रतिनिधित्व करता है, पर मुख्य पाठ में उस अर्थ को विस्तार देकर नहीं जोड़ा गया।
- source_word: הַנַּח
  choice: छोड़ दे
  rationale: यह आदेश किसी को उसके हाल पर छोड़ देने या उससे अलग रहने का भाव देता है। ‘उसे छोड़ दे’ मूल की संक्षिप्त और तीखी आज्ञा को हिन्दी में बनाए रखता है।
- source_word: לוֹ
  choice: उसे
  rationale: तीसरे पुरुष पुल्लिंग एकवचन सर्वनाम एप्रैम की ओर संकेत करता है; हिन्दी में ‘उसे’ स्वाभाविक कर्मरूप है।
theological_decisions:
- issue: एप्रैम का संदर्भ
  choice: मुख्य पाठ में ‘एप्रैम’ नाम ही रखा गया है।
  alternative: इसे उत्तरी राज्य या इस्राएल के स्पष्ट संदर्भ के रूप में विस्तारित करना।
  rationale: पद एप्रैम को एक व्यक्ति के समान प्रस्तुत करता है, जबकि ऐतिहासिक संदर्भ में इससे उत्तरी राज्य अभिप्रेत हो सकता है। नाम बनाए रखने से नबी की अलंकारिक भाषा और निहित तनाव सुरक्षित रहते हैं।
- issue: अंतिम आज्ञा का बल और संबोधन
  choice: 'किसी अनकहे एकवचन संबोधित व्यक्ति को एप्रैम को उसके हाल पर छोड़ देने की आज्ञा: ‘उसे छोड़ दे।’'
  alternative: ‘उसे वैसा ही रहने दे,’ एप्रैम से अलग हो जाने की आज्ञा, अथवा एप्रैम को संबोधित आज्ञा।
  rationale: मूल इब्रानी अत्यंत संक्षिप्त है और संबोधित व्यक्ति स्पष्ट नहीं है। सर्वाधिक सीधा अर्थ एप्रैम के विषय में हस्तक्षेप छोड़ने की आज्ञा है, पर वैकल्पिक सूक्ष्मता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और नबी-सुलभ तीखापन रखा गया है। ‘बँधा हुआ’ मूल के संबंधात्मक बल को, और ‘उसे छोड़ दे’ अंतिम आदेश की अकस्मातता को सुरक्षित रखता है।
