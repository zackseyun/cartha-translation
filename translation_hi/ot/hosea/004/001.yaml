source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה בְּנֵ֣י יִשְׂרָאֵ֑ל כִּ֣י רִ֤יב לַֽ/יהוָה֙ עִם יוֹשְׁבֵ֣י הָ/אָ֔רֶץ כִּ֠י אֵין אֱמֶ֧ת וְֽ/אֵין חֶ֛סֶד וְ/אֵֽין דַּ֥עַת אֱלֹהִ֖ים בָּ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/001.yaml
  text: Hear the word of Yahweh[a], sons of Israel, for Yahweh has a case against the inhabitants of the land, because there is no truth, no faithfulness[d][c][b], and no knowledge of God in the land.
translation:
  language: hi
  text: हे इस्राएल के पुत्रो, यहोवा का वचन सुनो! क्योंकि देश के निवासियों के विरुद्ध यहोवा का मुक़दमा है; क्योंकि देश में न सच्चाई है, न निष्ठावान प्रेम[a], और न परमेश्वर का ज्ञान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अटल प्रेम,’ ‘निष्ठा,’ ‘करुणा,’ अथवा ‘वाचा की निष्ठा।’ इब्रानी חֶסֶד में प्रेम, दया और संबंधपरक निष्ठा का व्यापक भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप है; ‘सुनो’ भविष्यद्वक्ताई आह्वान की संक्षिप्तता और गंभीरता बनाए रखता है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: मानक भविष्यद्वक्ताई सूत्र; ‘वचन’ औपचारिक संबंध बनाए रखता है और יְהוָה को व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रो
  rationale: इब्रानी पदबंध का औपचारिक रूप सुरक्षित है; संबोधन के कारण हिन्दी में ‘पुत्रो’ स्वाभाविक है।
- source_word: רִיב
  choice: मुक़दमा
  rationale: यह शब्द यहाँ न्यायिक अथवा वाचा-संबंधी अभियोग का बोध कराता है; ‘मुक़दमा’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: עִם יוֹשְׁבֵי הָאָרֶץ
  choice: देश के निवासियों के विरुद्ध
  rationale: विवाद अथवा न्यायिक प्रसंग में עִם का हिन्दी मुहावरेदार अर्थ ‘के विरुद्ध’ है।
- source_word: הָאָרֶץ / בָּאָרֶץ
  choice: देश / देश में
  rationale: होशे के इस्राएली और वाचा-संबंधी संदर्भ में संकेत विशेषतः इस्राएल के देश की ओर है, न कि अनिवार्यतः पूरी पृथ्वी की ओर।
- source_word: אֱמֶת
  choice: सच्चाई
  rationale: यह सत्यता, विश्वसनीयता और ईमानदारी के अर्थ-क्षेत्र को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि חֶסֶד से भेद भी बनाए रखता है।
- source_word: חֶסֶד
  choice: निष्ठावान प्रेम
  rationale: यह पद प्रेम और संबंधपरक निष्ठा दोनों को व्यक्त करता है, बिना ‘वाचा’ शब्द को मूल पाठ में स्पष्ट न होने पर मुख्य पाठ में जोड़ने के।
- source_word: דַּעַת אֱלֹהִים
  choice: परमेश्वर का ज्ञान
  rationale: निर्माण का सीधा अर्थ है; यहाँ ज्ञान केवल सूचना नहीं, बल्कि परमेश्वर को संबंधपरक और नैतिक रूप से जानना भी समेट सकता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। आधुनिक हिन्दी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: חֶסֶד का अर्थ
  choice: निष्ठावान प्रेम
  alternative: करुणा; निष्ठा; अटल प्रेम; वाचा की निष्ठा
  rationale: होशे के प्रसंग में संबंधपरक प्रेम और निष्ठा दोनों महत्त्वपूर्ण हैं। यह चयन उस अर्थ-विस्तार को बनाए रखता है और केवल भावना अथवा केवल विधिक वाचा तक सीमित नहीं करता।
- issue: הָאָרֶץ का क्षेत्र
  choice: देश
  alternative: भूमि; पृथ्वी
  rationale: तात्कालिक संबोधन इस्राएल से है और अभियोग उसके देश के निवासियों पर है; ‘देश’ संभावित स्थानीय-वाचाई संदर्भ को सुरक्षित रखता है।
- issue: רִיב की न्यायिक शक्ति
  choice: मुक़दमा
  alternative: विवाद; अभियोग
  rationale: यह पद यहोवा और देशवासियों के बीच साधारण मतभेद नहीं, न्यायिक आरोप का भाव देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यद्वक्ताई और न्यायिक शैली रखी गई है। ‘मुक़दमा’ सामान्य पाठक के लिए स्पष्ट है; ‘निष्ठावान प्रेम’ חֶסֶד की वास्तविक अर्थ-व्याप्ति को बिना अनावश्यक सिद्धान्तगत विस्तार के व्यक्त करता है।
