base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/012.yaml
  text: My people consult their piece of wood[a], and their staff tells them; for a spirit of whoredom has led them astray, and they have played the whore[c][b], departing from under their God.
translation:
  language: hi
  text: मेरी प्रजा अपनी लकड़ी से पूछती है[a], और उनकी लाठी उन्हें बताती है; क्योंकि वेश्यावृत्ति की आत्मा[b] ने उन्हें भटका दिया है, और उन्होंने अपने परमेश्वर की अधीनता से हटकर वेश्यागमन किया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी काठ की वस्तु से”; अधिक व्याख्यात्मक रूप में, “अपनी लकड़ी की मूर्ति से।” इब्रानी में शाब्दिक रूप से “उसकी लकड़ी” है, जो संभवतः शकुन पूछने में प्रयुक्त लकड़ी की किसी उपासना-वस्तु को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: या “वेश्यागमन की आत्मा” अथवा “बेवफाई की आत्मा।” इब्रानी में वेश्यावृत्ति का रूपक स्पष्ट रखा गया है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “अपने परमेश्वर के नीचे से”; यह अपने परमेश्वर के उचित अधिकार और उसके प्रति निष्ठा से हट जाने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: यह वाचा-संबंधी सामूहिक संबोधन है; ‘प्रजा’ हिन्दी में संबंध और सामूहिकता दोनों व्यक्त करती है।
- source_word: בְּעֵצוֹ יִשְׁאָל
  choice: अपनी लकड़ी से पूछती है
  rationale: शाब्दिक ठोस चित्र और व्यंग्यात्मक प्रभाव को बनाए रखते हुए भविष्य-कथन हेतु किसी लकड़ी की वस्तु से परामर्श का भाव व्यक्त करता है।
- source_word: וּמַקְלוֹ יַגִּיד לוֹ
  choice: और उसकी लाठी उसे बताती है
  rationale: इब्रानी सामूहिक एकवचन को बनाए रखा गया है और נגד के हिफ़ील रूप का सीधा अर्थ ‘बताना’ दिया गया है।
- source_word: רוּחַ זְנוּנִים
  choice: व्यभिचार की आत्मा
  rationale: यौन अनैतिकता और वाचा-विरोधी बेवफाई के जानबूझकर प्रयुक्त रूपक को स्पष्ट रखता है, बिना उसे केवल ‘अविश्वासयोग्यता’ में नरम किए।
- source_word: הִתְעָה
  choice: भटका दिया है
  rationale: हिफ़ील रूप का कारणवाचक भाव—गलत मार्ग पर ले जाना—स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: וַיִּזְנוּ
  choice: वेश्यागमन करने लगे हैं
  rationale: זנה के स्पष्ट वेश्यावृत्ति-संबंधी भविष्यद्वक्ताई रूपक को बनाए रखता है; क्रिया-क्रम को हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: מִתַּחַת אֱלֹהֵיהֶם
  choice: अपने परमेश्वर के अधीन से हटकर
  rationale: ‘नीचे से’ के इब्रानी चित्र को अधिकार और निष्ठा के संबंध के रूप में समझने योग्य बनाते हुए ‘अधीन’ शब्द से संरक्षित किया गया है।
theological_decisions:
- issue: मूर्तिपूजा के लिए यौन/वेश्यावृत्ति का भविष्यद्वक्ताई रूपक
  choice: मुख्य पाठ में ‘व्यभिचार’ और ‘वेश्यागमन’ की स्पष्ट भाषा बनाए रखना
  alternative: इसे केवल ‘बेवफाई’ या ‘मूर्तिपूजा’ कहना
  rationale: होशे जानबूझकर यौन रूपक द्वारा वाचा-भंग की तीव्रता दिखाता है; उसे नरम करना पाठ की वाग्मिता और धार्मिक तनाव को घटा देता।
- issue: सामूहिक संज्ञा के साथ एकवचन सर्वनाम
  choice: ‘प्रजा’ के अनुरूप ‘अपनी… उसकी… उसे’ एकवचन संरचना रखना, फिर अर्थानुसार ‘उन्हें/वे’ प्रयोग करना
  alternative: पूरे पद में केवल बहुवचन सर्वनाम रखना
  rationale: इब्रानी में ‘मेरी प्रजा’ सामूहिक एकवचन है, किंतु आगे समुदाय के सदस्यों का बहुवचन व्यवहार उभरता है; हिन्दी दोनों स्तरों को स्वाभाविक रूप से व्यक्त कर सकती है।
- issue: ‘अपने परमेश्वर के अधीन से’ का संबंध
  choice: परमेश्वर के उचित अधिकार और निष्ठा से हटने का चित्र बनाए रखना
  alternative: केवल ‘अपने परमेश्वर से दूर’ कहना
  rationale: מִתַּחַת का असामान्य ‘नीचे/अधीन से’ चित्र वाचा-संबंधी अधिकार का संकेत देता है; सामान्य ‘दूर’ उस तनाव को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सीधी भविष्यद्वक्ताई भाषा रखी गई है। ‘लकड़ी’ और ‘लाठी’ मूल पाठ के ठोस, व्यंग्यपूर्ण चित्र को बचाते हैं। कठोर यौन रूपक को अश्लील बनाए बिना स्पष्ट रखा गया है।
