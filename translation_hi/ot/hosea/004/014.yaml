id: HOS.4.14
reference: Hosea 4:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא אֶפְק֨וֹד עַל בְּנוֹתֵי/כֶ֜ם כִּ֣י תִזְנֶ֗ינָה וְ/עַל כַּלּֽוֹתֵי/כֶם֙ כִּ֣י תְנָאַ֔פְנָה כִּי הֵם֙ עִם הַ/זֹּנ֣וֹת יְפָרֵ֔דוּ וְ/עִם הַ/קְּדֵשׁ֖וֹת יְזַבֵּ֑חוּ וְ/עָ֥ם לֹֽא יָבִ֖ין יִלָּבֵֽט־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/014.yaml
  text: I will not punish your daughters when they prostitute themselves[a], nor your daughters-in-law when they commit adultery; for the men themselves go apart with prostitutes and sacrifice with cult prostitutes[c][b], and a people without understanding comes to ruin.
translation:
  language: hi
  text: “तुम्हारी बेटियाँ वेश्यावृत्ति करें, तो मैं उन्हें दण्ड नहीं दूँगा, और तुम्हारी बहुएँ व्यभिचार करें, तो मैं उन्हें दण्ड नहीं दूँगा; क्योंकि पुरुष स्वयं वेश्याओं के साथ एकान्त में जाते हैं[a] और उपासना से जुड़ी वेश्याओं[b] के साथ बलि चढ़ाते हैं; समझ से रहित प्रजा विनाश में पड़ जाती है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वेश्याओं के साथ अलग हो जाते हैं।” इब्रानी क्रिया का शाब्दिक अर्थ “अलग होना” या “अलग चले जाना” है।
    reason: lexical_alternative
  - marker: b
    text: या, “मन्दिर की वेश्याओं।” इब्रानी शब्द अवैध उपासना और यौन आचरण से जुड़ी स्त्रियों को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: अन्तिम इब्रानी क्रिया दुर्लभ है। इसका अर्थ “गिरा दिया जाना,” “भ्रमित होना” या अधिक सामान्य रूप में “विनाश में पड़ना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְקוֹד
  choice: दण्ड नहीं दूँगा
  rationale: פקד के साथ עַל न्याय के सन्दर्भ में दण्ड देने या लेखा लेने का भाव रखता है। आधुनिक हिन्दी में ‘दण्ड देना’ इसका स्पष्ट न्यायिक अर्थ व्यक्त करता है।
- source_word: תִזְנֶינָה
  choice: वेश्यावृत्ति करें
  rationale: זנה यहाँ अवैध यौन आचरण को वेश्यावृत्ति के ठोस बिम्ब में प्रस्तुत करता है; सामान्य ‘यौन अनैतिकता’ की अपेक्षा यह मूल की तीक्ष्णता बनाए रखता है।
- source_word: כַלּוֹתֵיכֶם
  choice: तुम्हारी बहुएँ
  rationale: बहुवचन सम्बन्धसूचक रूप यहाँ पुत्रों की पत्नियों को दर्शाता है, केवल विवाह के समय की दुलहनों को नहीं।
- source_word: תְנָאַפְנָה
  choice: व्यभिचार करें
  rationale: נאף विशेष रूप से परस्त्रीगमन अथवा वैवाहिक व्यभिचार को सूचित करता है, इसलिए इसे זנה से अलग रखा गया है।
- source_word: יְפָרֵדוּ
  choice: एकान्त में जाते हैं
  rationale: פרד का मूल भाव अलग होने या अलग जाने का है। प्रसंग में वेश्याओं के साथ अलग हटने का संकेत है; ‘एकान्त में जाते हैं’ मूल बिम्ब और निहितार्थ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: הַזֹּנוֹת
  choice: वेश्याओं
  rationale: स्त्रीलिंग बहुवचन रूप का सीधा, वर्तमान हिन्दी में स्पष्ट अनुवाद।
- source_word: הַקְּדֵשׁוֹת
  choice: उपासना से जुड़ी वेश्याओं
  rationale: यह पद अवैध उपासना से सम्बद्ध स्त्रियों और प्रसंगतः यौन आचरण की ओर संकेत करता है। यह अनुवाद उपासना-संबंधी पहलू बचाता है, पर किसी विशिष्ट मन्दिर-संस्था का अनावश्यक दावा नहीं करता।
- source_word: יְזַבֵּחוּ
  choice: बलि चढ़ाते हैं
  rationale: यह बलिदान चढ़ाने की सामान्य क्रिया है; ‘बलि चढ़ाना’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: וְעַם לֹא יָבִין
  choice: समझ से रहित प्रजा
  rationale: עם सामूहिक जनसमुदाय को दर्शाता है और לא יבין विवेक या समझ के अभाव को। ‘प्रजा’ सामूहिक एकवचन को बनाए रखती है।
- source_word: יִלָּבֵט
  choice: विनाश में पड़ जाती है
  rationale: यह दुर्लभ क्रिया गिराए जाने, भ्रमित होने या नष्ट होने का भाव दे सकती है। व्यापक परिणामसूचक अनुवाद मूल की अनिश्चितता पर अनावश्यक विशिष्टता नहीं थोपता।
theological_decisions:
- issue: क्या परमेश्वर स्त्रियों के यौन पाप को अनदेखा कर रहा है
  choice: पद स्त्रियों को अलग से दण्ड न देने की बात पुरुषों के उसी भ्रष्ट आचरण में सहभागी होने के कारण कहता है।
  alternative: इसे स्त्रियों के आचरण के लिए बिना किसी शर्त दण्ड न देने की घोषणा माना जा सकता है।
  rationale: כִּי से आरम्भ होने वाला कारणवाचक खण्ड पुरुषों की अपनी सहभागिता को सामने रखता है। अनुवाद सभी पक्षों पर नैतिक दोष रहने देता है और यह सिद्धान्त नहीं जोड़ता कि पाप को सामान्यतः अनदेखा किया जाता है।
- issue: קְדֵשׁוֹת की पहचान
  choice: उपासना से जुड़ी वेश्याएँ
  alternative: मन्दिर की वेश्याएँ; समर्पित स्त्रियाँ
  rationale: प्रसंग उपासना और यौन अनैतिकता दोनों से सम्बन्ध दिखाता है। चुना हुआ रूप इस सम्बन्ध को रखता है, लेकिन किसी औपचारिक मन्दिर-व्यवस्था के बारे में मूल से अधिक नहीं कहता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज रखी गई है। समानान्तर वाक्यरचना मूल के आरोपात्मक बल को बनाए रखती है। ‘एकान्त में जाते हैं’ मूल की शिष्टोक्तिपूर्ण अस्पष्टता को बचाता है, और दुर्लभ अन्तिम क्रिया की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
