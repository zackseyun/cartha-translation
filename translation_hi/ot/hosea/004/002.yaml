id: HOS.4.2
reference: Hosea 4:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָלֹ֣ה וְ/כַחֵ֔שׁ וְ/רָצֹ֥חַ וְ/גָנֹ֖ב וְ/נָאֹ֑ף פָּרָ֕צוּ וְ/דָמִ֥ים בְּ/דָמִ֖ים נָגָֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/002.yaml
  text: Cursing[a], lying, murder, theft, and adultery break out[b]; bloodshed follows bloodshed.
translation:
  language: hi
  text: शाप देना[a], झूठ बोलना, हत्या करना, चोरी करना और व्यभिचार करना—ये सब फूट पड़े हैं; रक्तपात पर रक्तपात होता जा रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अर्थ शपथ तोड़ना या झूठी शपथ खाना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָלֹה
  choice: शाप देना
  rationale: यहाँ शब्द शाप अथवा शपथ से जुड़ी वाणी का बोध करा सकता है। मुख्य पाठ में स्वाभाविक और संक्षिप्त ‘शाप देना’ रखा गया है, जबकि शपथ-भंग/झूठी शपथ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: כַחֵשׁ
  choice: झूठ बोलना
  rationale: क्रिया झूठ बोलने या छलपूर्वक असत्य व्यवहार करने को व्यक्त करती है; ‘झूठ बोलना’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: רָצֹחַ
  choice: हत्या करना
  rationale: רצח सामान्यतः अनुचित अथवा आपराधिक ढंग से प्राण लेने को दर्शाता है, इसलिए सामान्य ‘मारना’ के बजाय ‘हत्या करना’ उपयुक्त है।
- source_word: גָנֹב
  choice: चोरी करना
  rationale: यह क्रियात्मक रूप मूल के अपराध-सूची वाले विन्यास को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נָאֹף
  choice: व्यभिचार करना
  rationale: यह शब्द विशेष रूप से वैवाहिक बेवफाई, अर्थात व्यभिचार, को दर्शाता है।
- source_word: פָּרָצוּ
  choice: फूट पड़े हैं
  rationale: क्रिया में बाँध तोड़कर निकल पड़ने या व्यापक रूप से फैल जाने की सजीव छवि है। ‘फूट पड़े हैं’ बिना कोई अप्रकट कर्म जोड़े इसे व्यक्त करता है।
- source_word: דָמִים
  choice: रक्तपात
  rationale: बहुवचन ‘रक्तों’ का प्रयोग यहाँ हिंसक हत्याओं अथवा रक्त बहाने की घटनाओं के लिए है; ‘रक्तपात’ हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: וְדָמִים בְּדָמִים נָגָעוּ
  choice: रक्तपात पर रक्तपात होता जा रहा है
  rationale: शाब्दिक चित्र ‘रक्तपात रक्तपात को छूता है’ लगातार, एक-दूसरे से सटी हिंसक घटनाओं को दर्शाता है। चुना हुआ रूप इस निरंतर क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: אָלֹה का अर्थ
  choice: मुख्य पाठ में ‘शाप देना’
  alternative: शपथ तोड़ना अथवा झूठी शपथ खाना
  rationale: वाचा-संबंधी अभियोग के प्रसंग में यह शब्द शपथ के दुरुपयोग का संकेत दे सकता है, पर केवल उसी अर्थ तक सीमित करना मूल की अर्थ-व्याप्ति को अनावश्यक रूप से संकरा करेगा। इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। अपराधों की सूची को समान क्रियात्मक रूपों में रखा गया है। अंतिम वाक्यांश में इब्रानी की सघन हिंसा और निरंतरता को ‘रक्तपात पर रक्तपात’ द्वारा बनाए रखा गया है।
