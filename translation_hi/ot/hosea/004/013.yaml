  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַל רָאשֵׁ֨י הֶ/הָרִ֜ים יְזַבֵּ֗חוּ וְ/עַל הַ/גְּבָעוֹת֙ יְקַטֵּ֔רוּ תַּ֣חַת אַלּ֧וֹן וְ/לִבְנֶ֛ה וְ/אֵלָ֖ה כִּ֣י ט֣וֹב צִלָּ֑/הּ עַל כֵּ֗ן תִּזְנֶ֨ינָה֙ בְּנ֣וֹתֵי/כֶ֔ם וְ/כַלּוֹתֵי/כֶ֖ם תְּנָאַֽפְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/013.yaml
  text: On the tops of the mountains they sacrifice[a], and on the hills they burn incense, under oak and poplar and terebinth, because their shade is good. Therefore your daughters prostitute themselves[c][b], and your daughters-in-law commit adultery.
translation:
  language: hi
  text: वे पहाड़ों की चोटियों पर बलि चढ़ाते हैं और पहाड़ियों पर धूप जलाते हैं[a]—बलूत, पोपलर और तेरबिन्थ के पेड़ों के नीचे[b]—क्योंकि उनकी छाया सुखद है। इसलिए तुम्हारी बेटियाँ वेश्यावृत्ति करती हैं[c], और तुम्हारी बहुएँ व्यभिचार करती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे अर्पण जलाकर उसका धुआँ चढ़ाते हैं।” इब्रानी क्रिया विशेष रूप से धूप जलाने अथवा अधिक व्यापक रूप से अर्पण को धुएँ में चढ़ाने के लिए प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: इन तीनों वृक्षों की सटीक आधुनिक वनस्पति-पहचान निश्चित नहीं है; इनके नामों का अनुवाद परंपरागत पहचानों के आधार पर किया गया है।
    reason: cultural_note
  - marker: c
    text: होशे प्रायः यौन बेवफाई को वाचा के प्रति बेवफाई के चित्र के रूप में प्रयोग करता है; यहाँ शब्द वास्तविक यौन पाप का भी स्पष्ट वर्णन करते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: רָאשֵׁי הֶהָרִים
  choice: पहाड़ों की चोटियों पर
  rationale: शाब्दिक रूप से ‘पहाड़ों के सिरों’ का स्वाभाविक हिन्दी अर्थ ‘पहाड़ों की चोटियाँ’ है; इससे ऊँचे पूजा-स्थलों का दृश्य बना रहता है।
- source_word: יְזַבֵּחוּ
  choice: बलि चढ़ाते हैं
  rationale: זבח के पिएल रूप का अर्थ बलि देना या बलि-पशु चढ़ाना है; ‘बलि चढ़ाते हैं’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: יְקַטֵּרוּ
  choice: धूप जलाते हैं
  rationale: קטר का पिएल रूप धूप अथवा अन्य अर्पण को धुएँ में चढ़ाने के लिए प्रयुक्त हो सकता है। मुख्य पाठ में प्रचलित धार्मिक अभिव्यक्ति ‘धूप जलाते हैं’ रखी गई है और व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: תַּחַת אַלּוֹן וְלִבְנֶה וְאֵלָה
  choice: बाँज, चिनार और बलूत के पेड़ों के नीचे
  rationale: ये छायादार पूजा-स्थलों से जुड़े तीन वृक्ष-नाम हैं। उनकी सटीक आधुनिक वनस्पति-पहचान अनिश्चित है; इसलिए हिन्दी के परिचित पारंपरिक समतुल्य मुख्य पाठ में और अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: כִּי טוֹב צִלָּהּ
  choice: क्योंकि उनकी छाया सुखद है
  rationale: ‘अच्छी छाया’ का आशय यहाँ मनभावनी या आरामदायक छाया है। स्त्रीलिंग एकवचन प्रत्यय सामूहिक वृक्षावरण अथवा अंतिम वृक्ष की ओर संकेत कर सकता है; हिन्दी बहुवचन ‘उनकी’ सूची को सामूहिक रूप से स्वाभाविक ढंग से ग्रहण करता है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पूर्ववर्ती मूर्तिपूजक आचरण और उसके बाद वर्णित परिणाम के बीच कारण-परिणाम का संबंध बनाए रखता है।
- source_word: תִּזְנֶינָה
  choice: वेश्यावृत्ति करती हैं
  rationale: זנה में वेश्यावृत्ति और यौन बेवफाई दोनों का बल हो सकता है। यह चयन क्रिया की तीक्ष्णता बनाए रखता है, जबकि पादटिप्पणी होशे में उसकी वाचा-संबंधी रूपक-भूमिका भी बताती है।
- source_word: בְּנוֹתֵיכֶם
  choice: तुम्हारी बेटियाँ
  rationale: यह सीधे परिवार की बेटियों को सूचित करता है।
- source_word: וְכַלּוֹתֵיכֶם
  choice: तुम्हारी बहुएँ
  rationale: כַּלָּה का अर्थ दुल्हन या बहू हो सकता है; ‘बेटियों’ के साथ घरेलू समानांतर में ‘बहुएँ’ अधिक स्वाभाविक है।
- source_word: תְּנָאַפְנָה
  choice: व्यभिचार करती हैं
  rationale: נאף विशेष रूप से विवाहेतर यौन संबंध अर्थात व्यभिचार को सूचित करता है और पहले प्रयुक्त व्यापक זנה से भेद बनाए रखता है।
theological_decisions:
- issue: यौन भाषा को केवल आत्मिक बेवफाई का रूपक समझा जाए या वास्तविक यौन पाप का वर्णन भी
  choice: मुख्य पाठ में वास्तविक यौन आचरण को स्पष्ट रखा गया है और पादटिप्पणी में वाचा-विरोधी बेवफाई की रूपकात्मक प्रतिध्वनि बताई गई है।
  alternative: इसे केवल मूर्तिपूजा अथवा आत्मिक वेश्यावृत्ति के रूपक के रूप में अनूदित करना।
  rationale: इस पद में ‘बेटियाँ’ और ‘बहुएँ’ दो ठोस पारिवारिक समूह हैं तथा זנה और נאף समानांतर यौन क्रियाएँ हैं। फिर भी होशे की व्यापक भविष्यवाणी में यही भाषा इस्राएल की वाचा-संबंधी बेवफाई का रूपक भी है; अनुवाद दोनों स्तरों को बिना मिलाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य रूप रखा गया है। ‘बलि चढ़ाना’, ‘धूप जलाना’, ‘वेश्यावृत्ति’ और ‘व्यभिचार’ सामान्य पाठक के लिए स्पष्ट हैं। वृक्षों के नामों की वास्तविक अनिश्चितता को मुख्य पाठ को बोझिल किए बिना पादटिप्पणी में सुरक्षित रखा गया है।
