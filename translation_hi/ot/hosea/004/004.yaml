  yaml_path: translation/ot/hosea/004/004.yaml
  text: Yet let no man contend[a], and let no man reprove[b], for your people are like those who contend with a priest.
translation:
  language: hi
  text: फिर भी कोई विवाद न करे और कोई दोष न दिखाए,[a] क्योंकि तुम्हारे लोग याजक से विवाद करनेवालों के समान हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई डाँटे” अथवा “कोई सुधारे”; इब्रानी क्रिया में दोष दिखाने, सुधारने, डाँटने या वाद करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह तुलना व्यवस्था में याजकीय न्याय का विरोध करने की गंभीरता की ओर संकेत कर सकती है; देखें व्यवस्थाविवरण 17:12।
    reason: cross_reference
lexical_decisions:
- source_word: אַךְ
  choice: फिर भी
  rationale: यह पद पिछले आरोपों से एक तीखा विरोधात्मक मोड़ लेता है; ‘फिर भी’ इस प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִישׁ ... אִישׁ
  choice: कोई ... कोई
  rationale: इब्रानी का एकवचन पुरुषवाचक संज्ञा यहाँ सामान्य अर्थ में है। हिन्दी में निषेध के साथ ‘कोई’ उसके प्रतिनिधिक और सार्वभौमिक भाव को सहज ढंग से व्यक्त करता है।
- source_word: אַל יָרֵב
  choice: मुकदमा न करे
  rationale: ריב में झगड़ने, विवाद करने और कानूनी वाद चलाने—तीनों का भाव हो सकता है। इस संदर्भ में ‘मुकदमा करना’ अर्ध-कानूनी रंग को बनाए रखता है और अंतिम खंड में उसी धातु की पुनरावृत्ति भी सुरक्षित करता है।
- source_word: וְאַל יוֹכַח
  choice: और कोई दोष न लगाए
  rationale: יכח के हिफ़ील रूप में उलाहना देने, दोष दिखाने, सुधारने अथवा वाद करने का भाव हो सकता है। ‘दोष लगाना’ यहाँ आरोपात्मक अर्थ को व्यक्त करता है, जबकि पादटिप्पणी सुधार या डाँट के वैकल्पिक भाव को सुरक्षित रखती है।
- source_word: וְעַמְּךָ
  choice: क्योंकि तुम्हारे लोग
  rationale: संयोजक ו को संदर्भ में व्याख्यात्मक या कारणसूचक समझा गया है; ‘क्योंकि’ निषेध और उसके कारण के संबंध को स्पष्ट करता है।
- source_word: כִּמְרִיבֵי כֹהֵן
  choice: ऐसे हैं जैसे याजक से मुकदमा करनेवाले
  rationale: כ तुलना को और participle מריבי निरंतर या विशेषतापूर्ण विरोध को दर्शाता है। ‘मुकदमा करनेवाले’ पहले प्रयुक्त ריב से शब्दगत संबंध बनाए रखता है; ‘याजक’ सामान्य वर्गवाचक अर्थ में है।
theological_decisions:
- issue: अंतिम खंड में याजक से विवाद करने की तुलना का आशय
  choice: लोगों की सुधार न माननेवाली विद्रोही प्रवृत्ति को याजक से मुकदमा करनेवालों के समान बताने वाली उपमा
  alternative: यह व्यवस्थाविवरण 17:12 में याजकीय न्याय का विरोध करने के निषेध की विशिष्ट ओर संकेत हो सकता है।
  rationale: इब्रानी पाठ तुलना को स्पष्ट करता है, पर यह निश्चित नहीं करता कि सामान्य उद्दंडता अभिप्रेत है या व्यवस्थागत न्याय का कोई खास संकेत। मुख्य पाठ उपमा को खुला रखता है और पादटिप्पणी संभावित कानूनी प्रतिध्वनि बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मुकदमा करना’ दोनों बार ריב की पुनरावृत्ति और उसके कानूनी-विवादात्मक रंग को बनाए रखता है। ‘दोष लगाना’ के साथ पादटिप्पणी देकर יכח की व्यापक अर्थ-सीमा सुरक्षित रखी गई है।
