base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/008.yaml
  text: They feed on the sin of my people[b][a], and they set their appetite on their iniquity.
translation:
  language: hi
  text: वे मेरी प्रजा के पाप पर पलते हैं[a], और उनके अधर्म की लालसा करते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे मेरी प्रजा का पापबलि खाते हैं।” इब्रानी शब्द का अर्थ “पाप” या “पापबलि” दोनों हो सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “वे उनके अधर्म की ओर उसका प्राण उठाते हैं।” यह इब्रानी मुहावरा इच्छा या लालसा व्यक्त करता है; यहाँ बहुवचन क्रिया के साथ “उसका प्राण” एकवचन होना व्याकरण की दृष्टि से कठिन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: पाप
  rationale: यह संज्ञा ‘पाप’ और ‘पापबलि’ दोनों अर्थ दे सकती है। समानांतर पद ‘उनके अधर्म’ नैतिक अर्थ का समर्थन करता है, इसलिए मुख्य पाठ में ‘पाप’ रखा गया है; बलि-संबंधी अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יֹאכֵלוּ
  choice: पर पलते हैं
  rationale: क्रिया का शाब्दिक अर्थ ‘खाते हैं’ है। यहाँ लोगों के पाप से लाभ उठाने का रूपक है; ‘पर पलते हैं’ उपभोग और स्वार्थपूर्ण निर्भरता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित पद का सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: עֲוֺנָם
  choice: उनके अधर्म
  rationale: עָוֹן अधर्म, दोष अथवा दण्ड का बोध करा सकता है। यहाँ חַטַּאת के साथ समानांतरता के कारण नैतिक अर्थ ‘अधर्म’ उपयुक्त है।
- source_word: יִשְׂאוּ נַפְשׁוֹ
  choice: के लिए ललचाते हैं
  rationale: नשׂא और נפשׁ से बना प्रयोग किसी वस्तु की ओर प्रबल इच्छा लगाने का भाव देता है। ‘ललचाते हैं’ उस दूषित लालसा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נַפְשׁוֹ
  choice: निहित रूप से कर्ता की लालसा
  rationale: मसोराई पाठ में शाब्दिक रूप ‘उसका प्राण/मन’ एकवचन है, जबकि क्रिया बहुवचन है। मुख्य पाठ में मुहावरे का बहुवचन-संगत अर्थ दिया गया और व्याकरणिक कठिनाई पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: याजकीय भ्रष्टाचार के प्रसंग में חַטַּאת का अर्थ
  choice: मुख्य पाठ में ‘पाप’
  alternative: ‘पापबलि’
  rationale: इब्रानी दोनों अर्थों की अनुमति देती है। ‘उनके अधर्म’ के साथ समानांतरता व्यापक नैतिक अभियोग के पक्ष में है, जबकि याजकों द्वारा बलि का अंश खाने की पृष्ठभूमि ‘पापबलि’ का अर्थ भी सम्भव बनाती है; अतः तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: נַפְשׁוֹ के एकवचन और יִשְׂאוּ के बहुवचन का मेल
  choice: 'मुख्य पाठ में सामूहिक अर्थ: ‘ललचाते हैं’'
  alternative: 'शाब्दिक: ‘वे उसके प्राण को उनके अधर्म की ओर उठाते हैं’'
  rationale: शाब्दिक रूप प्रसंग में व्याकरणिक रूप से कठिन है। मुहावरे का अर्थ मुख्य पाठ में दिया गया है, पर पाठगत असामान्यता को छिपाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और आरोपात्मक स्वर रखा गया है। ‘पर पलते हैं’ खाने के मूल रूपक और पाप से लाभ उठाने के आशय को साथ रखता है; ‘ललचाते हैं’ इच्छा की तीव्रता व्यक्त करता है।
