id: HOS.4.5
reference: Hosea 4:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כָשַׁלְתָּ֣ הַ/יּ֔וֹם וְ/כָשַׁ֧ל גַּם נָבִ֛יא עִמְּ/ךָ֖ לָ֑יְלָה וְ/דָמִ֖יתִי אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/005.yaml
  text: You will stumble by day[a], and the prophet also will stumble with you by night[c][b]; and I will destroy your mother.
translation:
  language: hi
  text: तुम दिन में[a] ठोकर खाओगे, और भविष्यद्वक्ता भी रात में तुम्हारे साथ ठोकर खाएगा; और मैं तुम्हारी माता[b] का नाश कर दूँगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आज’; पर आगे ‘रात में’ आने के कारण ‘दिन में’ अधिक संभावित है।
    reason: lexical_alternative
  - marker: b
    text: ‘तुम्हारी माता’ संभवतः लोगों, राष्ट्र या वाचा-समुदाय के लिए प्रयुक्त रूपक है।
    reason: cultural_note
  - marker: c
    text: या ‘चुप करा दूँगा’ अथवा ‘काट डालूँगा’; न्याय के प्रसंग में इब्रानी क्रिया ये परस्पर संबंधित अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָשַׁלְתָּ / וְכָשַׁל
  choice: ठोकर खाओगे / ठोकर खाएगा
  rationale: כשל के रूपक को बनाए रखते हुए भविष्यसूचक न्याय की घोषणा के अनुरूप भविष्यकाल रखा गया है। ‘गिरना’ संभव है, पर ‘ठोकर खाना’ पूर्ण विनाश का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: הַיּוֹם
  choice: दिन में
  rationale: आगे आए לָיְלָה (‘रात में’) के साथ समयगत विरोध के कारण यहाँ ‘आज’ की अपेक्षा ‘दिन में’ अधिक उपयुक्त है।
- source_word: גַּם נָבִיא
  choice: भविष्यद्वक्ता भी
  rationale: גם का योगात्मक बल ‘भी’ से व्यक्त होता है। हिन्दी में उपपद न होने के कारण נָבִיא की ‘एक भविष्यद्वक्ता’ और प्रतिनिधि अर्थ में ‘भविष्यद्वक्ता’—दोनों संभावनाएँ स्वाभाविक रूप से खुली रहती हैं।
- source_word: עִמְּךָ
  choice: तुम्हारे साथ
  rationale: עם और एकवचन द्वितीय पुरुष प्रत्यय का सीधा तथा स्वाभाविक अनुवाद।
- source_word: לָיְלָה
  choice: रात में
  rationale: ‘दिन में’ के समानांतर दिन-रात की संरचना को स्पष्ट रखता है।
- source_word: וְדָמִיתִי
  choice: मैं ... का नाश कर दूँगा
  rationale: न्याय के इस प्रसंग में דמה को विनाश या मिटा दिए जाने के अर्थ में लिया गया है। ‘चुप करा दूँगा’ और ‘काट डालूँगा’ जैसे निकटवर्ती अर्थ भी संभव हैं, इसलिए उन्हें पादटिप्पणी में रखा गया है।
- source_word: אִמֶּךָ
  choice: तुम्हारी माता
  rationale: मूल पारिवारिक रूपक को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखा गया है; ‘माता’ आधुनिक, गरिमापूर्ण हिन्दी में इस भविष्यसूचक बिंब के अनुकूल है।
theological_decisions:
- issue: ‘तुम्हारी माता’ का अभिप्राय
  choice: मुख्य पाठ में ‘तुम्हारी माता’ का रूपक बनाए रखना
  alternative: इसे सीधे ‘इस्राएल’, ‘राष्ट्र’, ‘देश’ या ‘वाचा-समुदाय’ कहना
  rationale: होशे की पारिवारिक कल्पना और उसके अभिप्राय की वास्तविक खुली गुंजाइश को बनाए रखने के लिए मुख्य पाठ किसी एक पहचान को निश्चित नहीं करता। संभावित सामुदायिक अर्थ पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘तुम’ मूल के व्याकरणिक एकवचन को हिन्दी में पूरी तरह चिह्नित नहीं करता, पर ‘तू’ की संभावित अवमाननापूर्ण ध्वनि से बचते हुए सामान्य पाठक के लिए अधिक स्वाभाविक है। दिन-रात का समानांतर और ‘माता’ का रूपक सुरक्षित रखा गया है।
