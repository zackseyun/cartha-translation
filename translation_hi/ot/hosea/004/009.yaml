  text: וְ/הָיָ֥ה כָ/עָ֖ם כַּ/כֹּהֵ֑ן וּ/פָקַדְתִּ֤י עָלָי/ו֙ דְּרָכָ֔י/ו וּ/מַעֲלָלָ֖י/ו אָשִׁ֥יב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/009.yaml
  text: 'And it will be: like people[a], like priest. And I will punish him for his ways[b], and repay him for his deeds.'
translation:
  language: hi
  text: 'और ऐसा होगा: जैसे लोग, वैसा याजक।[a] और मैं उसके चालचलन के कारण उसे दण्ड दूँगा,[b] और उसके कामों का प्रतिफल उसे दूँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे लोगों के साथ, वैसे याजक के साथ।” इब्रानी की यह संक्षिप्त तुलना बताती है कि लोग और याजक समान न्याय का सामना करेंगे।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ सर्वनाम एकवचन हैं—“उसे” और “उसके।” ये समूह के प्रत्येक सदस्य के लिए प्रयुक्त हो सकते हैं, या विशेष रूप से याजक की ओर संकेत कर सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा
  rationale: यह आनेवाली परिणति या स्थिति का परिचय देता है और इब्रानी संयोजक का सीधा संबंध बनाए रखता है।
- source_word: כָעָם כַּכֹּהֵן
  choice: जैसे लोग, वैसा याजक
  rationale: संक्षिप्त, कहावत-जैसी तुलना को बनाए रखते हुए यह लोगों और याजक के लिए समान न्याय का भाव व्यक्त करता है।
- source_word: וּפָקַדְתִּי עָלָיו
  choice: मैं ... उसे दण्ड दूँगा
  rationale: न्याय के प्रसंग में פקד על का अर्थ दोष का लेखा लेकर दण्ड देना है; आधुनिक हिन्दी में ‘दण्ड दूँगा’ इसे स्पष्ट करता है।
- source_word: דְּרָכָיו
  choice: उसके चालचलन
  rationale: यहाँ ‘मार्ग’ नैतिक जीवन-पद्धति और आचरण का रूपक है; ‘चालचलन’ सामान्य हिन्दी में वही अर्थ देता है।
- source_word: וּמַעֲלָלָיו אָשִׁיב לוֹ
  choice: उसके कामों का फल उसे दूँगा
  rationale: न्यायिक प्रतिफल के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और व्यक्ति को उसके कर्मों के अनुरूप परिणाम मिलने का आशय रखता है।
theological_decisions:
- issue: न्याय-वाक्य में एकवचन सर्वनामों का संदर्भ
  choice: इब्रानी के अनुसार ‘उसके/उसे’ एकवचन रखा गया है
  alternative: सामूहिक अर्थ स्पष्ट करने के लिए ‘उनके/उन्हें’ करना, अथवा इसे केवल याजक का संदर्भ मानना
  rationale: एकवचन सामूहिक या वितरणात्मक रूप से लोगों और याजक पर लागू हो सकता है, पर निकट प्रसंग में केवल याजक की ओर भी संकेत कर सकता है। एकवचन बनाए रखने से पाठ की यह अनिश्चितता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। आरम्भ की कहावत-जैसी संक्षिप्तता तथा बाद के एकवचन सर्वनाम जानबूझकर सुरक्षित रखे गए हैं।
