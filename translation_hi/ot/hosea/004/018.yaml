  yaml_path: translation/ot/hosea/004/018.yaml
  text: When their drink is gone[a], they give themselves to prostitution[c][b]; her shields dearly love shame.
translation:
  language: hi
  text: जब उनका मदिरापान समाप्त हो जाता है[a], तब वे घोर वेश्यावृत्ति करते हैं; उसकी ढालों[b] को लज्जा अत्यन्त प्रिय है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उनकी मदिरा खट्टी हो जाती है,” अथवा “जब उनका नशा उतर जाता है।” आरम्भिक इब्रानी वाक्यांश कठिन है; उसका संकेत पीने का दौर समाप्त होने या पेय के बिगड़ जाने—दोनों में से किसी ओर हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में अक्षरशः “उसकी ढालें”; सम्भवतः यह उसके शासकों या रक्षकों के लिए रूपक है।
    reason: lexical_alternative
  - marker: c
    text: “अत्यन्त प्रिय है” वाला इब्रानी पदबंध कठिन है। इसे अधिक शाब्दिक रूप से “वे प्रेम करते हैं—‘लज्जा दो!’” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: סָר
  choice: समाप्त हो जाता है
  rationale: सूर क्रिया का मूल अर्थ ‘हट जाना/चला जाना’ है। मदिरापान के साथ यह उसके समाप्त हो जाने का स्वाभाविक हिन्दी अर्थ देता है, पर अन्य सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: סָבְאָם
  choice: उनका मदिरापान
  rationale: यह मदिरा पीने अथवा नशे से सम्बन्धित संज्ञा है जिस पर तृतीय पुरुष बहुवचन प्रत्यय है। ‘मदिरापान’ पीने के दौर को व्यक्त करता है और केवल पेय पदार्थ तक अर्थ को सीमित नहीं करता।
- source_word: הַזְנֵה הִזְנוּ
  choice: वे पूरी तरह वेश्यागमन में लग जाते हैं
  rationale: धातु के infinitive absolute और finite verb का मेल क्रिया को प्रबल करता है। ‘पूरी तरह’ उस बल को व्यक्त करता है और ‘वेश्यागमन’ होशे की जानबूझकर प्रयुक्त यौन-अविश्वास की छवि को बनाए रखता है।
- source_word: אָהֲבוּ הֵבוּ
  choice: अत्यन्त प्रिय है
  rationale: यह इब्रानी पदबंध कठिन है। הֵבוּ को बलवाचक मानते हुए यह अनुवाद लज्जा के प्रति प्रबल लगाव को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
- source_word: קָלוֹן
  choice: लज्जा
  rationale: यह संज्ञा लज्जा, अपमान या कलंक को सूचित करती है। ‘लज्जा’ संक्षिप्त और सीधा आधुनिक हिन्दी समानार्थक है।
- source_word: מָגִנֶּיהָ
  choice: उसकी ढालों
  rationale: मूल पाठ में अक्षरशः ‘उसकी ढालें’ है। काव्यात्मक रूपक को मुख्य पाठ में रखा गया है और सम्भावित आशय ‘शासक/रक्षक’ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: होशे की वेश्यावृत्ति सम्बन्धी भाषा को केवल अमूर्त अविश्वास के रूप में नरम करना
  choice: मुख्य पाठ में ‘वेश्यागमन’ की ठोस छवि बनाए रखना
  alternative: ‘वे पूरी तरह विश्वासघात करते हैं’
  rationale: होशे यौन बेवफाई की छवि द्वारा इस्राएल की वाचा-विषयक बेवफाई को व्यक्त करता है। ठोस रूपक बनाए रखने से नबी के कथन का बल और उसकी धार्मिक तनावपूर्णता सुरक्षित रहती है।
- issue: מָגִנֶּיהָ का अर्थ मुख्य पाठ में ही ‘शासक’ या ‘रक्षक’ कर देना
  choice: ‘उसकी ढालों’ का शाब्दिक रूपक बनाए रखना
  alternative: ‘उसके शासकों’ या ‘उसके रक्षकों’
  rationale: ‘ढाल’ मूल काव्यात्मक बिंब है और उसका सन्दर्भ कुछ हद तक अस्पष्ट है। सम्भावित आशय पादटिप्पणी में देकर मूल की पारदर्शिता और अर्थ-सहायता दोनों रखी गई हैं।
- issue: אָהֲבוּ הֵבוּ की कठिन रचना को एक निश्चित अर्थ में समतल करना
  choice: मुख्य पाठ में बलवाचक अर्थ ‘अत्यन्त प्रिय’ और पादटिप्पणी में शाब्दिक सम्भावना
  alternative: ‘वे प्रेम करते हैं—“लज्जा दो!”’
  rationale: इब्रानी वाक्यांश पाठगत रूप से कठिन है। सहज सम्भावित अर्थ मुख्य पाठ में है, पर वैकल्पिक विश्लेषण दबाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘मदिरापान’ और ‘वेश्यागमन’ औपचारिक किंतु प्रचलित शब्द हैं; वे न तो मूल की कठोर छवि को नरम करते हैं, न अनावश्यक रूप से अशिष्ट बनाते हैं। कठिन इब्रानी आरम्भ, ‘ढालों’ के रूपक और אָהֲבוּ הֵבוּ की अस्पष्टता को पादटिप्पणियों में सुरक्षित रखा गया है।
