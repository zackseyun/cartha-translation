reference: Hosea 4:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נִדְמ֥וּ עַמִּ֖/י מִ/בְּלִ֣י הַ/דָּ֑עַת כִּֽי אַתָּ֞ה הַ/דַּ֣עַת מָאַ֗סְתָּ וְ/אֶמְאָֽסְא/ךָ֙ מִ/כַּהֵ֣ן לִ֔/י וַ/תִּשְׁכַּח֙ תּוֹרַ֣ת אֱלֹהֶ֔י/ךָ אֶשְׁכַּ֥ח בָּנֶ֖י/ךָ גַּם אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/006.yaml
  text: My people are destroyed for lack of knowledge[a]. Because you have rejected knowledge, I also reject you from being priest to me. Since you have forgotten the law of your God[c][b], I also will forget your children.
translation:
  language: hi
  text: ज्ञान के अभाव में मेरी प्रजा नष्ट हो गई है।[a] क्योंकि तूने ज्ञान को ठुकरा दिया है, इसलिए मैं भी तुझे अस्वीकार करूँगा, कि तू मेरे लिए याजक न रहे। तू अपने परमेश्वर की व्यवस्था[b] भूल गया है, इसलिए मैं भी तेरी संतान को भूल जाऊँगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मिट गई है,” “मौन हो गई है,” अथवा “काट दी गई है।”
    reason: इब्रानी क्रिया के अर्थ-क्षेत्र में विनाश, मौन हो जाना, और काट दिया जाना सम्मिलित हो सकते हैं।
  - marker: b
    text: “व्यवस्था” के लिए इब्रानी शब्द ‘तोराह’ है, जिसका अर्थ “शिक्षा” या “निर्देश” भी हो सकता है।
    reason: मूल शब्द केवल विधिक नियमों से व्यापक है।
  - marker: c
    text: या “तेरे पुत्रों को।”
    reason: इब्रानी शब्द व्याकरणतः पुल्लिंग बहुवचन है और प्रसंगानुसार पुत्रों या सामान्यतः संतान को सूचित कर सकता है।
lexical_decisions:
- source_word: נִדְמוּ
  choice: नष्ट हो गई है
  rationale: निफ़ाल रूप यहाँ न्याय के प्रसंग में विनाश या मिट जाने का परिणाम सूचित करता है। हिन्दी में पूर्ण क्रिया वर्तमान परिणति को स्वाभाविक रूप से व्यक्त करती है।
- source_word: מִבְּלִי הַדָּעַת
  choice: ज्ञान के अभाव में
  rationale: यह इब्रानी पद ज्ञान से वंचित होने के कारण को व्यक्त करता है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: הַדָּעַת / הַדַּעַת
  choice: ज्ञान
  rationale: यहाँ ज्ञान केवल सूचना नहीं, बल्कि वाचा-संबंधी और नैतिक-धार्मिक बोध भी समेटता है; फिर भी मूल की व्यापकता बनाए रखने के लिए केवल ‘ज्ञान’ रखा गया है।
- source_word: מָאַסְתָּ
  choice: ठुकरा दिया है
  rationale: यह चुनाव तिरस्कारपूर्ण अस्वीकृति का प्रबल अर्थ देता है और अगले प्रत्युत्तरात्मक न्याय से मेल खाता है।
- source_word: וְאֶמְאָסְאֲךָ
  choice: मैं भी तुझे ... अस्वीकार करता हूँ
  rationale: ‘भी’ पहले किए गए अस्वीकार के प्रत्युत्तर को सुरक्षित रखता है; वर्तमान रूप भविष्यसूचक न्याय की निश्चितता और हिन्दी की स्वाभाविकता व्यक्त करता है।
- source_word: מִכַּהֵן לִי
  choice: अपने याजक के रूप में
  rationale: यह पद परमेश्वर के लिए याजकीय पद या सेवा से निष्कासन बताता है। ‘अपने याजक के रूप में’ मूल के संबंधात्मक भाव को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: וַתִּשְׁכַּח
  choice: तू ... भूल गया है
  rationale: पूर्ण रूप अतीत के उस कृत्य को वर्तमान दोष के साथ जोड़ता है और ‘भूलना’ मूल रूपक को बनाए रखता है।
- source_word: תּוֹרַת אֱלֹהֶיךָ
  choice: अपने परमेश्वर की व्यवस्था
  rationale: ‘व्यवस्था’ तोराह के वाचा-संबंधी भार को स्पष्ट करती है; इसकी व्यापक वैकल्पिक धारणा ‘शिक्षा’ पादटिप्पणी में दी गई है।
- source_word: אֶשְׁכַּח
  choice: मैं भी ... भूल जाऊँगा
  rationale: भविष्यकाल और ‘भी’ आरोपी के भूलने तथा परमेश्वर के प्रत्युत्तरात्मक न्याय के बीच की अलंकारिक समानता बनाए रखते हैं।
- source_word: בָּנֶיךָ
  choice: तेरी सन्तान
  rationale: पुल्लिंग बहुवचन यहाँ वंश या संतान को सामूहिक रूप से सूचित कर सकता है। ‘सन्तान’ इस व्यापक अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: होशे के वाचा-मुकदमे में ‘ज्ञान’ का अर्थ
  choice: मुख्य पाठ में केवल ‘ज्ञान’
  alternative: ‘परमेश्वर का ज्ञान’
  rationale: पुस्तक के व्यापक संदर्भ में परमेश्वर को जानना निहित हो सकता है, पर इस वाक्यांश में मूल पाठ केवल ‘ज्ञान’ कहता है; विस्तार न करने से वास्तविक व्यापकता बनी रहती है।
- issue: द्वितीय पुरुष एकवचन का संदर्भ
  choice: एकवचन ‘तू’, जिसे याजकीय पद से अस्वीकार किया जाता है
  alternative: समूचे इस्राएल के लिए सामूहिक एकवचन
  rationale: याजक होने से अस्वीकार किए जाने का पद याजकीय प्रतिनिधि की ओर संकेत करता है, पर पाठ उसकी पहचान और अधिक निश्चित नहीं करता; अतः एकवचन सुरक्षित रखा गया है।
- issue: בָּנֶיךָ का लिंग और दायरा
  choice: तेरी सन्तान
  alternative: तेरे पुत्र
  rationale: इब्रानी पुल्लिंग बहुवचन संतान या वंश को सामान्य रूप से व्यक्त कर सकता है। मुख्य पाठ में व्यापक सामूहिक अर्थ रखा गया है, जबकि संकीर्ण अर्थ पादटिप्पणी में है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली रखी गई है। परमेश्वर से संबोधित अथवा याजकीय प्रतिनिधि के लिए एकवचन ‘तू/तेरी’ मूल के एकवचन और कठोर अभियोगात्मक स्वर को बनाए रखता है। ‘याजक’, ‘व्यवस्था’ और ‘सन्तान’ सामान्य बाइबलीय हिन्दी में परिचित हैं, पर वाक्यरचना समकालीन और सहज रखी गई है।
