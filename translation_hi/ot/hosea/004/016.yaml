  edition: WLC
  text: כִּ֚י כְּ/פָרָ֣ה סֹֽרֵרָ֔ה סָרַ֖ר יִשְׂרָאֵ֑ל עַתָּה֙ יִרְעֵ֣/ם יְהוָ֔ה כְּ/כֶ֖בֶשׂ בַּ/מֶּרְחָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/016.yaml
  text: For Israel is as stubborn as a stubborn heifer[a]; now Yahweh will pasture them like a lamb in a broad place.
translation:
  language: hi
  text: क्योंकि इस्राएल हठीली बछिया की तरह अड़ियल हो गया है। अब याहवे उन्हें मेमने की तरह खुले स्थान में चराएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे उन्हें भेड़ की तरह एक विस्तृत स्थान में चराएगा।” इब्रानी बिंब खुले चरागाह का संकेत भी दे सकता है और न्याय के अधीन असुरक्षित खुलेपन का भी।
    reason: כֶּבֶשׂ के लिए ‘भेड़’ एक सम्भव व्यापक विकल्प है, और מֶרְחָב के ‘विस्तृत स्थान’ वाले अर्थ तथा बिंब की व्याख्यात्मक अस्पष्टता को स्पष्ट करता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के कारण या आधार को प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ उसके व्याख्यात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּפָרָה סֹרֵרָה סָרַר
  choice: हठीली गाय की तरह हठ किया है
  rationale: ‘गाय’ פָרָה का सीधा अर्थ रखता है और ‘हठीली…हठ’ मूल में סרר धातु की जानबूझकर की गई पुनरावृत्ति को हिन्दी में भी बनाए रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी रूप।
- source_word: עַתָּה
  choice: अब
  rationale: इस्राएल के हठ के बाद आने वाले परिणाम की ओर संकेत करता है।
- source_word: יִרְעֵם
  choice: उन्हें…चराएगा
  rationale: רעה का अर्थ चराना या चरवाही करना है। ‘चराएगा’ पशु-संबंधी बिंब बनाए रखता है और इस वाक्य को अनावश्यक रूप से केवल कोमल देखभाल के अर्थ तक सीमित नहीं करता। बहुवचन कर्म-प्रत्यय को ‘उन्हें’ से सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण, किसी पदवी से उसका स्थानापन्न नहीं।
- source_word: כְּכֶבֶשׂ
  choice: एक मेमने के समान
  rationale: כֶּבֶשׂ सामान्यतः मेमने या कम उम्र की भेड़ को दर्शाता है; एकवचन बिंब और संभावित असुरक्षा दोनों बने रहते हैं।
- source_word: בַּמֶּרְחָב
  choice: खुले स्थान में
  rationale: מֶרְחָב विस्तृत या खुली जगह को दर्शाता है। यह रूप चरागाह की स्वतंत्रता और न्याय के अधीन असुरक्षित खुलेपन—दोनों संभावनाओं को खुला रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य का भाव
  choice: ऐसा अनुवाद जो चराए जाने और खुले में असुरक्षित छोड़े जाने के बीच की अस्पष्टता बनाए रखे
  alternative: याहवे उन्हें खुले चरागाह में कोमलता से संभालेगा; अथवा याहवे उन्हें न्याय में खुले और असुरक्षित स्थान पर छोड़ देगा
  rationale: इब्रानी क्रिया चराने का अर्थ देती है, पर खुले स्थान में अकेले मेमने का बिंब देखभाल के साथ-साथ विडंबनापूर्ण न्याय, बिखराव या असुरक्षा भी सुझा सकता है। मूल पाठ इनमें से किसी एक अर्थ को स्पष्ट रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और ग्रामीण बिंब के अनुरूप भाषा रखी गई है। मूल की धातु-पुनरावृत्ति को ‘हठीली…हठ’ से और इस्राएल के लिए आए बहुवचन कर्म-प्रत्यय को ‘उन्हें’ से बनाए रखा गया है।
