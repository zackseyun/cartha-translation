source:
  edition: WLC
  text: עַל כֵּ֣ן תֶּאֱבַ֣ל הָ/אָ֗רֶץ וְ/אֻמְלַל֙ כָּל יוֹשֵׁ֣ב בָּ֔/הּ בְּ/חַיַּ֥ת הַ/שָּׂדֶ֖ה וּ/בְ/ע֣וֹף הַ/שָּׁמָ֑יִם וְ/גַם דְּגֵ֥י הַ/יָּ֖ם יֵאָסֵֽפוּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/003.yaml
  text: Therefore the land mourns[a], and everyone who dwells in it languishes, along with the beasts of the field and the birds of the heavens[b]; even the fish of the sea are taken away.
translation:
  language: hi
  text: इस कारण देश शोक करता है[a], और उसके सभी निवासी मैदान के पशुओं और आकाश के पक्षियों समेत क्षीण हो जाते हैं; यहाँ तक कि समुद्र की मछलियाँ भी हटा दी जाती हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी शोक करती है।” इब्रानी शब्द אֶרֶץ का अर्थ “देश” या “पृथ्वी” दोनों हो सकता है; यहाँ इस्राएल पर न्याय का निकट संदर्भ “देश” के पक्ष में है।
    reason: alternative_reading
  - marker: b
    text: या, “समेट ली जाती हैं”; अधिक शाब्दिक रूप से, “इकट्ठी की जाती हैं।” इस न्याय के संदर्भ में भाव यह है कि समुद्र की मछलियाँ भी हटा दी जाती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱבַל
  choice: शोक करता है
  rationale: क्रिया का सामान्य अर्थ शोक करना या विलाप करना है। देश को मानवीय रूप में प्रस्तुत करने वाले मूल रूपक को बनाए रखा गया है, न कि उसे केवल सूखने का भौतिक वर्णन बना दिया गया है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: होशे के निकट संदर्भ में इस्राएल का देश अभिप्रेत होना सबसे स्वाभाविक है; फिर भी ‘पृथ्वी’ का अर्थ संभव है और उसे पादटिप्पणी में रखा गया है।
- source_word: וְאֻמְלַל
  choice: निढाल हो जाते हैं
  rationale: यह निर्बल, क्षीण या मुरझा जाने का भाव व्यक्त करता है। ‘निढाल’ मनुष्यों और जीव-जंतुओं पर समान रूप से स्वाभाविक ढंग से लागू होता है।
- source_word: כָּל יוֹשֵׁב בָּהּ
  choice: उसमें रहनेवाले सभी
  rationale: मूल में एकवचन कृदंत כל के साथ सामूहिक अर्थ रखता है। हिन्दी में बहुवचन वाक्यांश उसके सर्वसमावेशी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּחַיַּת הַשָּׂדֶה
  choice: मैदान के पशुओं समेत
  rationale: पूर्वसर्ग निवासियों की दुर्दशा में पशुओं की सहभागिता बताता है। यह अनुवाद मूल की श्रेणी को स्पष्ट और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: וּבְעוֹף הַשָּׁמָיִם
  choice: आकाश के पक्षियों समेत
  rationale: यह मूल अभिव्यक्ति का निकट और सहज हिन्दी रूप है तथा स्थल-पशु, पक्षी और मछलियों की त्रयी बनाए रखता है।
- source_word: וְגַם
  choice: यहाँ तक कि ... भी
  rationale: यह केवल जोड़ नहीं, बल्कि न्याय की बढ़ती हुई व्यापकता पर बल देता है।
- source_word: דְּגֵי הַיָּם
  choice: समुद्र की मछलियाँ
  rationale: यह सीधा शाब्दिक अर्थ है और जीव-जगत की तीन श्रेणियों में अंतिम श्रेणी को स्पष्ट करता है।
- source_word: יֵאָסֵפוּ
  choice: उठा ली जाती हैं
  rationale: אסף के निफ़अल रूप में इकट्ठा किए जाने अथवा हटा दिए जाने का भाव हो सकता है। न्याय के संदर्भ में ‘उठा ली जाती हैं’ हटाए जाने को व्यक्त करता है, पर मृत्यु की रीति को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: הָאָרֶץ का भौगोलिक दायरा
  choice: देश
  alternative: पृथ्वी
  rationale: वचन इस्राएल के विरुद्ध न्याय-वाणी के भीतर है, इसलिए वाचा के देश का अर्थ अधिक संभावित है। फिर भी इब्रानी शब्द की व्यापक अर्थ-संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- issue: सृष्टि पर न्याय का विस्तार
  choice: मनुष्यों के साथ पशु, पक्षी और मछलियाँ भी दुर्दशा में सम्मिलित हैं
  alternative: वर्णन को केवल मनुष्यों के लिए आलंकारिक मानना
  rationale: मूल पाठ जीव-जगत की तीन श्रेणियों को स्पष्ट रूप से गिनाता है; इसलिए उसके पारिस्थितिक विस्तार को कम नहीं किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देश शोक करता है’ मूल के मानवीकरण को सुरक्षित रखता है, जबकि ‘निढाल हो जाते हैं’ मनुष्यों और अन्य जीवों की साझा क्षीणता को सामान्य पाठक के लिए स्पष्ट करता है।
