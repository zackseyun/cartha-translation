id: HOS.4.10
reference: Hosea 4:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָֽכְלוּ֙ וְ/לֹ֣א יִשְׂבָּ֔עוּ הִזְנ֖וּ וְ/לֹ֣א יִפְרֹ֑צוּ כִּֽי אֶת יְהוָ֥ה עָזְב֖וּ לִ/שְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/010.yaml
  text: They will eat[a], but not be satisfied; they will commit sexual immorality, but not increase, because they have abandoned Yahweh[c][b], to cherish prostitution.
translation:
  language: hi
  text: वे खाएँगे, पर तृप्त न होंगे; वे यौन अनैतिकता करेंगे[a], पर उनकी संख्या न बढ़ेगी[b], क्योंकि उन्होंने यहोवा को त्याग दिया है और उसकी बात मानना छोड़ दिया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वेश्याचार करेंगे।” इब्रानी क्रिया विशेष रूप से वेश्यावृत्ति या अधिक व्यापक अनैतिक यौन आचरण को दर्शा सकती है; होशे में इसमें यहोवा के प्रति बेवफाई की प्रतिध्वनि भी प्रायः सुनाई देती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “फूटकर न फैलेंगे”; यहाँ आशय संभवतः संतान या जनसंख्या में वृद्धि न होने से है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी अत्यंत संक्षिप्त है: “उन्होंने यहोवा को त्याग दिया—पालन करने के लिए।” कर्म स्पष्ट नहीं है। इसे यहोवा की बात मानना छोड़ने के अर्थ में लिया जा सकता है; कुछ लोग अगले पद के आरंभ “वेश्याचार” को इसका कर्म मानकर अर्थ करते हैं, “वेश्याचार को सँजोए रखने के लिए उन्होंने यहोवा को त्याग दिया।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  choice: वे खाएँगे
  rationale: न्याय की भविष्यवाणी के संदर्भ में संयोजक के साथ आया पूर्ण क्रियारूप घोषित होने वाले परिणाम को व्यक्त करता है; हिन्दी में भविष्यकाल इसे स्वाभाविक रूप से प्रकट करता है।
- source_word: יִשְׂבָּעוּ
  choice: तृप्त न होंगे
  rationale: שׂבע भोजन के बाद भर जाने या संतुष्ट होने को दर्शाता है; ‘तृप्त’ अभाव और निष्फलता के भाव को बनाए रखता है।
- source_word: הִזְנוּ
  choice: अनैतिक यौन-संबंध बनाएँगे
  rationale: זנה वेश्यावृत्ति या व्यापक अवैध यौन आचरण को सूचित कर सकता है और होशे में वाचा से बेवफाई की प्रतिध्वनि भी रखता है। यह चयन ठोस यौन अर्थ को स्पष्ट रखता है, पर उसे केवल पेशेवर वेश्यावृत्ति तक सीमित नहीं करता।
- source_word: יִפְרֹצוּ
  choice: उनकी संख्या न बढ़ेगी
  rationale: פרץ का मूल अर्थ ‘फूट निकलना/फैलना’ है, पर यहाँ यौन आचरण के समानांतर यह संतान या जनसंख्या में वृद्धि की ओर संकेत करता है। स्पष्ट संज्ञा जोड़ने से हिन्दी में आशय स्वाभाविक बनता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: עָזְבוּ
  choice: त्याग दिया है
  rationale: עזב यहाँ वाचा-संबंधी परित्याग का आरोप लगाता है; ‘त्याग दिया’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: לִשְׁמֹר
  choice: उसकी बात मानना छोड़ दिया है
  rationale: शाब्दिक ‘पालन करने के लिए’ यहाँ संक्षिप्त और वस्तुरहित है। हिन्दी वाक्य को पूर्ण करने के लिए न्यूनतम निहित अर्थ—यहोवा की बात मानना/उस पर ध्यान देना—व्यक्त किया गया है, जबकि पादटिप्पणी मूल की कठिनता बताती है।
theological_decisions:
- issue: הִזְנוּ में शाब्दिक यौन आचरण और वाचा से बेवफाई का संबंध
  choice: मुख्य पाठ में व्यापक शाब्दिक अर्थ ‘अनैतिक यौन-संबंध’ रखा गया है और पादटिप्पणी में ‘वेश्याचार’ का विकल्प दिया गया है।
  alternative: इसे केवल मूर्तिपूजा या आध्यात्मिक वेश्यावृत्ति के रूप में अनूदित करना।
  rationale: अगला वाक्यांश संतान या संख्या न बढ़ने की बात करता है, इसलिए ठोस यौन अर्थ प्रमुख है; फिर भी होशे में उपस्थित वाचा-संबंधी प्रतिध्वनि को नकारा नहीं गया।
- issue: עָזְבוּ ... לִשְׁמֹר की संक्षिप्त रचना
  choice: ‘उन्होंने यहोवा को त्याग दिया है और उसकी बात मानना छोड़ दिया है’
  alternative: ‘उन्होंने यहोवा को त्याग दिया है ताकि वेश्याचार को सँजोए रखें,’ जिसमें अगले पद के आरंभिक शब्द को इसका कर्म माना जाता है।
  rationale: दिए गए पद का इब्रानी पाठ לִשְׁמֹר पर रुकता है और उसका कर्म व्यक्त नहीं करता। मुख्य पाठ न्यूनतम निहित संबंध को स्वाभाविक हिन्दी में देता है; पादटिप्पणी पद-सीमा के पार वाले वैकल्पिक संयोजन को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्पष्ट किंतु गरिमापूर्ण शैली। भविष्यसूचक न्याय का स्वर बनाए रखा गया है। ‘अनैतिक यौन-संबंध’ सामान्य पाठक के लिए स्पष्ट है; पादटिप्पणी अधिक निकट शब्द ‘वेश्याचार’ और वाचा-संबंधी प्रतिध्वनि सुरक्षित रखती है।
