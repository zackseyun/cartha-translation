source:
  edition: WLC
  text: אִם זֹנֶ֤ה אַתָּה֙ יִשְׂרָאֵ֔ל אַל יֶאְשַׁ֖ם יְהוּדָ֑ה וְ/אַל תָּבֹ֣אוּ הַ/גִּלְגָּ֗ל וְ/אַֽל תַּעֲלוּ֙ בֵּ֣ית אָ֔וֶן וְ/אַל תִּשָּׁבְע֖וּ חַי יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/015.yaml
  text: Though you prostitute yourself[a], Israel, let not Judah become guilty. And do not go to Gilgal, and do not go up to Beth-aven, and do not swear, ‘As Yahweh lives.’
translation:
  language: hi
  text: इस्राएल, भले ही तू वेश्यावृत्ति करे, फिर भी यहूदा दोषी न बने। तुम न गिलगाल जाओ, न बेत-आवेन[a] की ओर चढ़ो, और ‘याहवे जीवित है,’ कहकर शपथ न खाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेत-आवेन’ का अर्थ ‘दुष्टता का घर’ या ‘अधर्म का घर’ है। संभवतः यह बेतएल के लिए प्रयुक्त एक निंदात्मक नाम है।
    reason: मूल स्थान-नाम के शब्दार्थ और संभावित व्यंग्यात्मक प्रयोग को स्पष्ट करना।
lexical_decisions:
- source_word: אִם
  choice: भले ही
  rationale: 'संदर्भ में यह केवल शर्त नहीं, बल्कि रियायती भाव व्यक्त करता है: इस्राएल की बेवफाई मान ली गई है, फिर भी यहूदा को उसके दोष में सहभागी नहीं होना चाहिए।'
- source_word: זֹנֶה
  choice: वेश्यावृत्ति करे
  rationale: यह क्रिया होशे की भविष्यवाणी में वाचा के प्रति बेवफाई का जानबूझकर तीखा यौन रूपक है; इसे सामान्य ‘बेवफाई’ कहकर नरम नहीं किया गया।
- source_word: אַל יֶאְשַׁם
  choice: दोषी न बने
  rationale: अर्थ दोष में पड़ने या दोषी बनने का है; निषेधात्मक भाव को स्वाभाविक हिन्दी में रखा गया है।
- source_word: תָּבֹאוּ הַגִּלְגָּל
  choice: गिलगाल जाओ
  rationale: स्थान की ओर जाने के निषेध के लिए ‘जाना’ आधुनिक हिन्दी में सबसे स्वाभाविक है।
- source_word: תַּעֲלוּ
  choice: की ओर चढ़ो
  rationale: עלה के ‘ऊपर चढ़ने/जाने’ के स्थानगत भाव को बनाए रखा गया है, जो उपासना-स्थल की यात्रा से भी जुड़ सकता है।
- source_word: בֵּית אָוֶן
  choice: बेत-आवेन
  rationale: मूल पाठ के निंदात्मक स्थान-नाम को बेतएल में बदलने के बजाय लिप्यंतरित किया गया है; उसका अर्थ पादटिप्पणी में बताया गया है।
- source_word: חַי יְהוָה
  choice: ‘याहवे जीवित है,’ कहकर शपथ
  rationale: मूल शपथ-सूत्र को स्पष्ट और स्वाभाविक हिन्दी वाक्य-रचना में प्रस्तुत किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
theological_decisions:
- issue: वाचा के प्रति बेवफाई के लिए भविष्यद्वक्ता का यौन रूपक
  choice: वेश्यावृत्ति करे
  alternative: बेवफाई करे
  rationale: होशे का रूपक जानबूझकर तीखा है और मूर्तिपूजा को वाचा-विरोधी यौन बेवफाई के रूप में चित्रित करता है; इसे अस्पष्ट या नरम नहीं किया गया।
- issue: אִם का शर्तात्मक या रियायती भाव
  choice: भले ही
  alternative: यदि
  rationale: इस संदर्भ में इस्राएल की बेवफाई को केवल संभावित शर्त के रूप में नहीं, बल्कि स्वीकार की गई वास्तविकता के रूप में लेकर यहूदा को चेतावनी दी जाती है।
- issue: शपथ-सूत्र में परमेश्वर का नाम
  choice: याहवे
  alternative: प्रभु
  rationale: मूल में יהוה व्यक्तिगत नाम के रूप में उपस्थित है, इसलिए उसे उपाधि से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन ‘तू’ से व्यक्तिरूप इस्राएल और उसके बाद बहुवचन निषेध के बीच मूल पाठ का व्याकरणिक बदलाव बनाए रखने के लिए ‘तुम’ प्रयोग किया गया है।
