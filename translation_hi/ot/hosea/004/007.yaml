base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/007.yaml
  text: The more they increased[a], the more they sinned against me[b]; I will change their glory into disgrace.
translation:
  language: hi
  text: जैसे-जैसे वे बढ़ते गए[a], वैसे-वैसे वे मेरे विरुद्ध पाप करते गए; मैं उनकी महिमा को अपमान में बदल दूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जितने अधिक वे हुए, उतना ही अधिक उन्होंने मेरे विरुद्ध पाप किया।”
    reason: lexical_alternative
  - marker: b
    text: या, “मैं उनकी महिमा को अपमान से बदल दूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֻבָּם ... כֵּן
  choice: जितने वे बढ़ते गए ... उतना ही
  rationale: כְּ और כֵּן की सहसंबंधी रचना को स्वाभाविक हिन्दी ‘जितने ... उतना ही’ से व्यक्त किया गया है; इससे उनकी बढ़ती संख्या/बहुलता और बढ़ते पाप का अनुपात बना रहता है।
- source_word: חָטְאוּ לִי
  choice: वे मेरे विरुद्ध पाप करते गए
  rationale: חטא के साथ ל अपराध के परमेश्वर के विरुद्ध निर्देशित होने को दर्शाता है। निरंतर बढ़ोतरी के समानांतर ‘करते गए’ हिन्दी में प्रसंग का प्रगतिशील भाव स्पष्ट करता है।
- source_word: כְּבוֹדָם
  choice: उनकी महिमा
  rationale: כָּבוֹד के ‘महिमा, सम्मान, प्रतिष्ठा’ के अर्थ-क्षेत्र और मूल की अस्पष्टता को बनाए रखा गया है; उसके सटीक आशय की व्याख्या पाठ में नहीं जोड़ी गई।
- source_word: בְּקָלוֹן
  choice: अपमान में
  rationale: קָלוֹן लज्जा, निरादर या अपमान को सूचित करता है। ‘अपमान में’ महिमा से विपरीत दशा में परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָמִיר
  choice: मैं ... बदल दूँगा
  rationale: यह रूप ‘बदलना/विनिमय करना’ का भाव देता है। ‘बदल दूँगा’ स्पष्ट, वर्तमान हिन्दी है और प्रथम पुरुष कर्ता को सुरक्षित रखता है।
theological_decisions:
- issue: ‘उनकी महिमा’ का संदर्भ
  choice: ‘उनकी महिमा’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: उनका याजकीय सम्मान; उनकी समृद्धि या प्रतिष्ठा; स्वयं परमेश्वर जो उनकी महिमा थे
  rationale: इब्रानी पाठ महिमा के सटीक संदर्भ को निर्दिष्ट नहीं करता। अस्पष्टता बनाए रखने से किसी एक धर्मवैज्ञानिक व्याख्या को पाठ पर आरोपित नहीं किया जाता।
- issue: אָמִיר का परिवर्तन अथवा विनिमय भाव
  choice: मुख्य पाठ में ‘बदल दूँगा’
  alternative: ‘के बदले अपमान दूँगा’ अथवा ‘महिमा का अपमान से विनिमय करूँगा’
  rationale: दोनों अर्थ स्रोत-रूप के अनुकूल हैं। मुख्य पाठ में स्वाभाविक परिवर्तन-भाव रखा गया है और विनिमय की संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘जितने ... उतना ही’ मूल सहसंबंधी रचना को स्वाभाविक रूप देता है, और ‘महिमा’ जानबूझकर बिना व्याख्यात्मक विस्तार के छोड़ी गई है।
