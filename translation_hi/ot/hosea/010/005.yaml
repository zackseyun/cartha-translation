source:
  edition: WLC
  text: לְ/עֶגְלוֹת֙ בֵּ֣ית אָ֔וֶן יָג֖וּרוּ שְׁכַ֣ן שֹֽׁמְר֑וֹן כִּי אָבַ֨ל עָלָ֜י/ו עַמּ֗/וֹ וּ/כְמָרָי/ו֙ עָלָ֣י/ו יָגִ֔ילוּ עַל כְּבוֹד֖/וֹ כִּֽי גָלָ֥ה מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/005.yaml
  text: The inhabitants of Samaria tremble for the calves of Beth-aven, because its people mourn over it, and its idolatrous priests wail over it, over its glory, because it has departed from it.
translation:
  language: hi
  text: सामरिया के निवासी बेथ-आवेन की बछड़ों की मूर्तियों के लिए काँपेंगे, क्योंकि उसके लोग उसके लिए शोक मनाएँगे, और उसके मूर्तिपूजक पुजारी उसके कारण आनन्दित होंगे—उसकी महिमा के कारण—क्योंकि वह उससे चली गई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶגְלוֹת
  choice: बछड़ा-मूर्तियाँ
  rationale: शाब्दिक अर्थ ‘बछड़े’ है, पर प्रसंग में ये उपासना की प्रतिमाएँ हैं; ‘बछड़ा-मूर्तियाँ’ अर्थ को स्पष्ट रखते हुए बहुवचन भी सुरक्षित रखता है।
- source_word: יָגוּרוּ
  choice: काँपेंगे
  rationale: यहाँ क्रिया भय और व्याकुलता से काँपने का भाव देती है; ‘डरेंगे’ की तुलना में यह प्रतिमा खोने की आशंका की तीव्रता अधिक स्पष्ट करता है।
- source_word: כְמָרָיו
  choice: मूर्तिपूजक पुजारी
  rationale: כמר सामान्य याजक के बजाय मूर्तिपूजक पंथ के पुरोहितों के लिए प्रयुक्त विशिष्ट शब्द है।
- source_word: יָגִילוּ
  choice: मगन होंगे
  rationale: मसोरेटिक पाठ की क्रिया का सामान्य अर्थ ‘आनन्दित होना/मगन होना’ है। प्रसंग में यह कठिन है, फिर भी मूल पाठ की तनावपूर्ण अभिव्यक्ति को बदलकर निर्विवाद ‘विलाप करेंगे’ नहीं किया गया।
- source_word: כְבוֹדוֹ
  choice: उसकी महिमा
  rationale: ‘महिमा’ प्रतिमा के वैभव, प्रतिष्ठा और धार्मिक गौरव—इन सबके लिए पर्याप्त व्यापक है।
theological_decisions:
- issue: मूर्तिपूजक पुजारियों की प्रतिक्रिया
  choice: मसोरेटिक पाठ के अनुसार ‘मगन होंगे’
  alternative: ‘विलाप करेंगे’
  rationale: कुछ अनुवाद प्रसंग के अनुरूप शोक या विलाप का अर्थ अपनाते हैं, पर उपलब्ध WLC पाठ יָגִילוּ स्पष्टतः आनन्दित होने की क्रिया है। मुख्य पाठ में उसी को रखकर कठिनाई को पादटिप्पणी में बताया गया है।
- issue: एकवचन सर्वनाम और बहुवचन बछड़ा-मूर्तियाँ
  choice: ‘उस पर’ को सामूहिक रूप से मुख्य प्रतिमा/पूजा-वस्तु के लिए रखा
  alternative: हर सर्वनाम को बहुवचन ‘उन पर’ करना
  rationale: हिब्रू बहुवचन עֶגְלוֹת के बाद एकवचन प्रत्ययों का प्रयोग करता है। हिन्दी में ‘उस पर’ इस पाठगत असंगति को पूरी तरह मिटाए बिना सामूहिक पूजा-वस्तु की ओर संकेत करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बेथ-आवेन’ नाम का लिप्यंतरण किया गया है; पद के भीतर उसका व्युत्पत्तिगत अर्थ जोड़कर वाक्य को बोझिल नहीं बनाया गया।
