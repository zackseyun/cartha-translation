base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/010.yaml
  text: When I desire[a], I will discipline them[b], and peoples will be gathered against them when they are bound for their two transgressions.
translation:
  language: hi
  text: जब मेरी इच्छा हो, मैं उन्हें अनुशासित करूँगा[a]। जातियाँ उनके विरुद्ध इकट्ठी की जाएँगी, जब वे अपने दो अपराधों[b] के कारण बाँधे जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं उन्हें ताड़ना दूँगा।” इस क्रिया में सुधार के लिए दिया जाने वाला अनुशासन भी निहित हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “उनके दो अधर्मों”; संभव अर्थ “उनका दुहरा दोष।” व्यंजनात्मक रूप के कारण “उनकी दो आँखों” का वैकल्पिक पाठ भी प्रस्तावित किया गया है, पर वह इस संदर्भ में कम उपयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאַוָּתִי
  choice: जब मेरी इच्छा होगी
  rationale: בְּ के साथ इच्छा-सूचक संज्ञा और प्रथम पुरुष एकवचन प्रत्यय परमेश्वर की इच्छा को आगामी कार्रवाई की परिस्थिति के रूप में व्यक्त करते हैं। यह अनुवाद उसके कालगत और संकल्पगत दोनों पहलुओं को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְאֶסֳּרֵם
  choice: मैं उन्हें अनुशासित करूँगा
  rationale: यह रूप יסר से है, जिसका अर्थ अनुशासन देना या ताड़ना करना है; इसे אסר, ‘बाँधना’, समझना उचित नहीं। ‘अनुशासित करूँगा’ सुधारात्मक दंड और न्याय—दोनों की संभावना खुली रखता है।
- source_word: וְאֻסְּפוּ עֲלֵיהֶם עַמִּים
  choice: जातियाँ उनके विरुद्ध इकट्ठी की जाएँगी
  rationale: निष्क्रिय क्रियारूप और बहुवचन עַמִּים को बनाए रखते हुए यह शत्रुतापूर्ण एकत्रीकरण व्यक्त करता है। ‘जातियाँ’ यहाँ विभिन्न जनों या राष्ट्रों के सामूहिक अर्थ में है।
- source_word: בְּאָסְרָם
  choice: जब वे ... बाँधे जाएँगे
  rationale: אסר का अर्थ ‘बाँधना’ है। בְּ के साथ infinitive construct को कालगत उपवाक्य के रूप में प्रस्तुत किया गया है; निष्क्रिय हिन्दी मूल में कर्ता की अनिर्दिष्टता बनाए रखती है।
- source_word: לִשְׁתֵּי עינתם
  choice: अपने दो अपराधों के कारण
  rationale: संदर्भ न्याय और दोष का है, इसलिए व्यंजनात्मक रूप को עון से संबंधित ‘दो अधर्म/अपराध’ के अर्थ में लिया गया है। संख्या ‘दो’ को बनाए रखा गया है और यह निर्धारित नहीं किया गया कि वे दो अपराध कौन-से हैं।
theological_decisions:
- issue: अंतिम वाक्यांश לִשְׁתֵּי עינתם का अर्थ
  choice: अपने दो अपराधों के कारण
  alternative: अपने दुहरे दोष के कारण; अपनी दो आँखों के लिए
  rationale: न्याय के संदर्भ में दोष या अधर्म से जुड़ा अर्थ अधिक संगत है, फिर भी व्यंजनात्मक पाठ से उत्पन्न ‘दो आँखों’ की संभावना को पादटिप्पणी में सुरक्षित रखा गया है। ‘दो’ को हटाकर किसी विशेष ऐतिहासिक या धर्मसैद्धांतिक पहचान में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अनुशासित’ न्याय और सुधार दोनों के आयामों को खुला रखता है; ‘जातियाँ’ बहुवचन עַמִּים को संक्षेप में दर्शाता है। वाक्य-विन्यास मूल क्रम के निकट है और बाँधने वाले कर्ता को अनिर्दिष्ट रखता है।
