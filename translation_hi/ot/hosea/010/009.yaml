id: HOS.10.9
reference: Hosea 10:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/ימֵי֙ הַ/גִּבְעָ֔ה חָטָ֖אתָ יִשְׂרָאֵ֑ל שָׁ֣ם עָמָ֔דוּ לֹֽא תַשִּׂיגֵ֧/ם בַּ/גִּבְעָ֛ה מִלְחָמָ֖ה עַל בְּנֵ֥י עַֽלְוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/009.yaml
  text: From the days of Gibeah you have sinned[a], O Israel; there they have remained[b]. Will not war against the children of iniquity overtake them in Gibeah?
translation:
  language: hi
  text: इस्राएल, गिबा के दिनों से ही तू पाप करता आया है[a]; वे वहीं बने रहे। क्या गिबा में अन्याय की सन्तानों के विरुद्ध युद्ध उन्हें आ नहीं पकड़ेगा?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: गिबा न्यायियों 19–21 के घोर अपराध और उसके बाद हुए गृहयुद्ध की याद दिलाता है। होशे उस घटना को इस्राएल के गहरे जड़ पकड़े भ्रष्टाचार के उदाहरण के रूप में सामने रखता है।
    reason: cross_reference
  - marker: b
    text: 'इस कठिन इब्रानी उपवाक्य का अनुवाद यह भी हो सकता है: “गिबा में अन्याय की सन्तानों के विरुद्ध युद्ध उन्हें नहीं पकड़ पाया,” अथवा, “उन्हें नहीं पकड़ेगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: מִימֵי הַגִּבְעָה
  choice: गिबा के दिनों से ही
  rationale: מִן आरम्भ-बिन्दु बताता है। ‘से ही’ पुराने समय से चली आ रही स्थिति पर बल देता है और गिबा के ऐतिहासिक संकेत को बनाए रखता है।
- source_word: חָטָאתָ יִשְׂרָאֵל
  choice: इस्राएल, ... तू पाप करता आया है
  rationale: क्रिया द्वितीय पुरुष एकवचन में है और इस्राएल को सामूहिक व्यक्तित्व मानकर सीधे सम्बोधित करती है। ‘करता आया है’ आरम्भ-बिन्दु से वर्तमान तक प्रासंगिक पाप का स्वाभाविक हिन्दी रूप है।
- source_word: שָׁם עָמָדוּ
  choice: वे वहीं बने रहे
  rationale: עָמַד का मूल भाव खड़े रहने का है, पर प्रसंग में किसी दशा या रुख में टिके रहने का आशय सम्भव है। यह अनुवाद एकवचन सम्बोधन से बहुवचन क्रिया में आए मूल पाठ के परिवर्तन को भी सुरक्षित रखता है।
- source_word: לֹא תַשִּׂיגֵם
  choice: क्या ... उन्हें आ नहीं पकड़ेगा?
  rationale: हिफ़ील क्रिया का अर्थ ‘जा पकड़ना/आ पकड़ना’ है। प्रश्नात्मक रूप भविष्यसूचक चेतावनी की अपेक्षित तीव्रता व्यक्त करता है, पर कठिन इब्रानी के अन्य सम्भव पाठ को पादटिप्पणी में रखा गया है।
- source_word: מִלְחָמָה
  choice: युद्ध
  rationale: यह शब्द लड़ाई अथवा व्यापक युद्ध दोनों को सूचित कर सकता है; न्यायियों 19–21 के बड़े संघर्ष की ओर संकेत के कारण ‘युद्ध’ उपयुक्त है।
- source_word: בְּנֵי עַלְוָה
  choice: अधर्म की सन्तानें
  rationale: इब्रानी ‘सन्तान/पुत्र’ मुहावरे को बनाए रखते हुए עַלְוָה के नैतिक टेढ़ेपन, अन्याय और दुष्टता के व्यापक भाव को ‘अधर्म’ से व्यक्त किया गया है।
theological_decisions:
- issue: कठिन उपवाक्य לֹא תַשִּׂיגֵם ... का काल और वाक्य-बल
  choice: 'इसे अलंकारिक प्रश्न के रूप में लिया गया है: युद्ध उन्हें अवश्य आ पकड़ेगा।'
  alternative: ‘गिबा में अधर्म की सन्तानों के विरुद्ध युद्ध उन्हें नहीं पकड़ पाया,’ अथवा ‘उन्हें नहीं पकड़ेगा।’
  rationale: इब्रानी वाक्य-विन्यास असामान्य है और नकार को भूतकालीन कथन, भविष्यकालीन कथन या अलंकारिक प्रश्न समझा जा सकता है। मुख्य पाठ भविष्यसूचक चेतावनी के प्रवाह के अनुकूल है, जबकि पादटिप्पणी वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और भविष्यद्वाणी की सीधी फटकार के अनुरूप रखी गई है। ‘तू’ किसी व्यक्ति के लिए अनौपचारिक सम्बोधन नहीं, बल्कि एक सामूहिक व्यक्तित्व के रूप में इस्राएल के प्रति मूल इब्रानी के एकवचन सम्बोधन को दर्शाता है।
