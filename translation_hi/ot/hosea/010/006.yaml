source:
  edition: WLC
  text: גַּם אוֹת/וֹ֙ לְ/אַשּׁ֣וּר יוּבָ֔ל מִנְחָ֖ה לְ/מֶ֣לֶךְ יָרֵ֑ב בָּשְׁנָה֙ אֶפְרַ֣יִם יִקָּ֔ח וְ/יֵב֥וֹשׁ יִשְׂרָאֵ֖ל מֵ/עֲצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/006.yaml
  text: Even it will be carried to Assyria as tribute for King Yareb[a]; Ephraim will receive shame[b], and Israel will be ashamed of its counsel.
translation:
  language: hi
  text: वह भी अश्शूर ले जाया जाएगा, राजा यारेब[a] के लिए भेंट के रूप में। एप्रैम को लज्जा मिलेगी, और इस्राएल अपनी नीति के कारण लज्जित होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “राजा यारेब।” इसे “प्रतिशोध लेने वाला राजा” या “विवाद करने वाला राजा” जैसी उपाधि भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या “उसकी सम्मति के कारण” अथवा “उसकी योजना के कारण।” इब्रानी प्रत्यय इस्राएल/एप्रैम की अपनी नीति की ओर संकेत कर सकता है, पर उसका संदर्भ पूरी तरह स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אוֹתוֹ
  choice: यहाँ तक कि वह भी
  rationale: גַּם का अग्रस्थान बल देता है कि पिछले संदर्भ में उल्लिखित बछड़ा भी बच नहीं पाएगा। हिन्दी में यह पदबंध उस emphatic अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְאַשּׁוּר יוּבָל
  choice: अश्शूर ले जाया जाएगा
  rationale: יוּבָל, יבל का होफल रूप, कर्मवाच्य है और לְ गंतव्य दर्शाता है। मूर्ति के लिए ‘ले जाया जाएगा’ स्वाभाविक और स्रोत-संगत है।
- source_word: מִנְחָה
  choice: भेंट के रूप में
  rationale: राजनीतिक संदर्भ में यह किसी श्रेष्ठ शासक को दी जाने वाली भेंट या कर हो सकता है। ‘भेंट’ मूल शब्द की व्यापकता बनाए रखता है और अनावश्यक रूप से केवल ‘कर’ तक सीमित नहीं करता।
- source_word: לְמֶלֶךְ יָרֵב
  choice: राजा यारेब के लिए
  rationale: यָרֵב को मुख्य पाठ में नाम-सदृश राजकीय पदनाम मानकर लिप्यंतरित किया गया है; इसके वर्णनात्मक अर्थ की संभावना पादटिप्पणी में रखी गई है।
- source_word: בָּשְׁנָה יִקָּח
  choice: लज्जा मिलेगी
  rationale: शाब्दिक ‘लज्जा लेगा’ आधुनिक हिन्दी में अस्वाभाविक है। ‘लज्जा मिलेगी’ לקח के प्राप्त करने वाले भाव और संज्ञा בָּשְׁנָה दोनों को सहज रूप से व्यक्त करता है।
- source_word: וְיֵבוֹשׁ יִשְׂרָאֵל מֵעֲצָתוֹ
  choice: इस्राएल अपनी ही युक्ति के कारण लज्जित होगा
  rationale: מן यहाँ कारण सूचित कर सकता है। प्रत्यय को इस्राएल/एप्रैम की सामूहिक नीति की ओर संकेत मानते हुए ‘अपनी ही’ कहा गया है; ‘युक्ति’ עֵצָה के परामर्श, योजना या नीति-संबंधी अर्थ को बनाए रखता है।
theological_decisions:
- issue: יָרֵב की पहचान और अर्थ
  choice: मुख्य पाठ में ‘राजा यारेब’
  alternative: ‘प्रतिशोध लेने वाला राजा’ अथवा ‘विवाद करने वाला राजा’
  rationale: इब्रानी रूप नाम-सदृश पदनाम या वर्णनात्मक उपाधि, दोनों समझा जा सकता है। मुख्य पाठ में लिप्यंतरण और पादटिप्पणी में विकल्प रखने से वास्तविक अस्पष्टता सुरक्षित रहती है।
- issue: מֵעֲצָתוֹ में प्रत्यय का संदर्भ
  choice: इस्राएल की अपनी युक्ति/नीति
  alternative: उस बछड़े की युक्ति, या किसी पुरुष की सम्मति
  rationale: निकटवर्ती समानांतरता में एप्रैम और इस्राएल एक सामूहिक इकाई हैं, इसलिए प्रत्यय को उनकी अपनी नीति से जोड़ना सर्वाधिक संदर्भोचित है; फिर भी शब्दार्थ की वैकल्पिक छाया पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज गद्य। ‘अश्शूर,’ ‘एप्रैम,’ ‘इस्राएल’ और ‘यारेब’ पारंपरिक बाइबलीय नाम-रूपों के अनुरूप हैं। वाक्य-विन्यास काव्यात्मक समानांतरता बनाए रखते हुए हिन्दी में स्वाभाविक रखा गया है।
