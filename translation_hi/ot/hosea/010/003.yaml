  text: כִּ֤י עַתָּה֙ יֹֽאמְר֔וּ אֵ֥ין מֶ֖לֶךְ לָ֑/נוּ כִּ֣י לֹ֤א יָרֵ֨אנוּ֙ אֶת יְהֹוָ֔ה וְ/הַ/מֶּ֖לֶךְ מַה יַּֽעֲשֶׂה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/003.yaml
  text: For now they will say[a], “We have no king, because we did not fear Yahweh[b]; and the king—what can he do for us?”
translation:
  language: hi
  text: क्योंकि अब वे कहेंगे, “हमारा कोई राजा नहीं है, क्योंकि हमने याहवे का भय नहीं माना[a]; और राजा—वह हमारे लिए क्या कर सकता है?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि हम याहवे का भय नहीं मानते” अथवा “क्योंकि हमने याहवे का भय नहीं माना है।” इब्रानी पूर्ण क्रिया उनकी स्थायी दशा या अतीत की दोषपूर्ण विफलता—दोनों में से किसी को व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह हमारे लिए क्या करेगा?” इब्रानी क्रिया रूप औपचारिक रूप से भविष्यकालीन है; मुख्य पाठ आलंकारिक प्रश्न में निहित असमर्थता का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: पद के आरम्भ में यह संयोजक पिछली बात का कारण या स्पष्टीकरण प्रस्तुत करता है; दूसरा כִּי कथन के भीतर स्पष्ट कारण बताता है।
- source_word: עַתָּה יֹאמְרוּ
  choice: अब वे कहेंगे
  rationale: עַתָּה वर्तमान या निकट आने वाली स्थिति को दर्शाता है और अपूर्ण क्रिया יֹאמְרוּ यहाँ भविष्यसूचक कथन के रूप में स्वाभाविक है।
- source_word: אֵין מֶלֶךְ לָנוּ
  choice: हमारा कोई राजा नहीं है
  rationale: यह इब्रानी अस्तित्ववाचक वाक्य का सहज आधुनिक हिन्दी रूप है और ‘हमारे लिए/हम पर कोई राजा नहीं’ का आशय सुरक्षित रखता है।
- source_word: לֹא יָרֵאנוּ אֶת יְהוָה
  choice: हमने याहवे का भय नहीं माना
  rationale: पूर्ण क्रिया को मुख्य पाठ में अतीत की दोषपूर्ण विफलता के रूप में लिया गया है। ‘भय मानना’ हिन्दी में श्रद्धामय भय और आज्ञाकारी अधीनता—दोनों का भार वहन करता है; कालगत अन्य सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְהַמֶּלֶךְ
  choice: और राजा—
  rationale: संयोजक और निश्चित पद को बनाए रखते हुए दीर्घ विराम प्रश्न की अचानक आती हुई आलंकारिक दिशा को स्पष्ट करता है।
- source_word: מַה יַּעֲשֶׂה לָּנוּ
  choice: वह हमारे लिए क्या कर सकता है?
  rationale: क्रिया रूप औपचारिक रूप से भविष्य का है, पर प्रसंग में प्रश्न राजा की व्यावहारिक सामर्थ्य पर संदेह प्रकट करता है। औपचारिक भविष्य वाला विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: याहवे का भय मानना
  choice: मुख्य पाठ में ‘याहवे का भय मानना’
  alternative: ‘याहवे का आदर करना’
  rationale: इब्रानी ירא में श्रद्धा, विस्मय और आज्ञाकारी अधीनता सम्मिलित हैं। केवल ‘आदर करना’ कहने से होशे के दोषारोपण की तीव्रता घट सकती है।
- issue: राजा की सामर्थ्य से सम्बन्धित आलंकारिक प्रश्न
  choice: ‘वह हमारे लिए क्या कर सकता है?’
  alternative: ‘वह हमारे लिए क्या करेगा?’
  rationale: मुख्य पाठ प्रसंग में निहित असमर्थता को व्यक्त करता है, जबकि इब्रानी क्रिया की औपचारिक भविष्यकालीन सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘याहवे’ व्यक्तिगत नाम के रूप में लिप्यंतरित है, और ‘भय मानना’ सामान्य हिन्दी में समझ आने के साथ मूल की वाचिक तथा धर्मवैचारिक तीव्रता बनाए रखता है।
