reference: Hosea 10:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גֶּ֤פֶן בּוֹקֵק֙ יִשְׂרָאֵ֔ל פְּרִ֖י יְשַׁוֶּה לּ֑/וֹ כְּ/רֹ֣ב לְ/פִרְי֗/וֹ הִרְבָּה֙ לַֽ/מִּזְבְּח֔וֹת כְּ/ט֣וֹב לְ/אַרְצ֔/וֹ הֵיטִ֖יבוּ מַצֵּבֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/001.yaml
  text: Israel is a luxuriant vine that yields fruit for himself[a]. The more his fruit increased, the more he multiplied altars; the better his land became[c][b], the better they made the sacred pillars.
translation:
  language: hi
  text: इस्राएल एक लहलहाती दाखलता है, जो अपने लिए फल उपजाती है।[a] जितना उसका फल बढ़ा, उतनी ही उसने वेदियाँ बढ़ाईं; जितनी उसकी भूमि समृद्ध हुई, उतना ही उन्होंने पूजा के खम्भों को सँवारा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल एक खाली होती दाखलता है” अथवा “एक फैलती हुई दाखलता है, जो अपना फल उपजाती है।” यहाँ प्रयुक्त इब्रानी विशेषण कठिन है; मुख्य पाठ प्रचुर फल और समृद्ध भूमि के संदर्भ के अनुसार है। “अपने लिए” में आत्मवाची या स्वार्थपरक भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “पूजा के खम्भे” खड़े किए गए पत्थर के स्मारक थे, जिनका उपयोग आराधना में होता था; यहाँ वे निन्दित मूर्तिपूजक उपासना से जुड़े हैं।
    reason: cultural_note
lexical_decisions:
- source_word: גֶּפֶן בּוֹקֵק
  choice: लहलहाती दाखलता
  rationale: בּוֹקֵק का अर्थ विवादित है, पर प्रचुर फल और समृद्ध भूमि का निकट संदर्भ फैलती, भरपूर बढ़ती बेल का भाव समर्थित करता है। ‘लहलहाती’ आधुनिक हिन्दी में इस समृद्धि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פְּרִי יְשַׁוֶּה לּוֹ
  choice: जो अपने लिए फल उपजाती है
  rationale: שׁוה यहाँ फल उत्पन्न करने के अर्थ में लिया गया है और לּוֹ के आत्मवाची अथवा स्वार्थपरक संकेत को ‘अपने लिए’ से सुरक्षित रखा गया है।
- source_word: כְּרֹב לְפִרְיוֹ הִרְבָּה לַמִּזְבְּחוֹת
  choice: जितना उसका फल बढ़ा, उतनी ही उसने वेदियाँ बढ़ाईं
  rationale: ‘जितना… उतनी ही’ आनुपातिक इब्रानी रचना को स्पष्ट रखता है और समृद्धि के साथ वेदियों की वृद्धि का आरोप सामने लाता है।
- source_word: כְּטוֹב לְאַרְצוֹ
  choice: जितनी उसकी भूमि समृद्ध हुई
  rationale: טוֹב यहाँ नैतिक भलाई नहीं, भूमि की अच्छी और उपजाऊ दशा बताता है; ‘समृद्ध हुई’ प्रसंगानुकूल कृषि-समृद्धि व्यक्त करता है।
- source_word: הֵיטִיבוּ מַצֵּבוֹת
  choice: उन्होंने पूजा के खम्भों को सँवारा
  rationale: הֵיטִיבוּ का कारक भाव यहाँ इन पंथीय पत्थर-स्तम्भों को बेहतर, सुन्दर अथवा अधिक भव्य बनाने का है। ‘सँवारा’ स्वाभाविक हिन्दी है, जबकि ‘पूजा के खम्भे’ उनके धार्मिक उपयोग को स्पष्ट करता है।
theological_decisions:
- issue: समृद्धि की छवि और मूर्तिपूजक आराधना का सम्बन्ध
  choice: पद इस्राएल को फलवन्त और समृद्ध दिखाता है, पर उसकी बढ़ती समृद्धि वेदियों और पूजा के खम्भों को बढ़ाने-सँवारने में लगती है।
  alternative: आरम्भिक पदबंध को ‘खाली होती दाखलता’ समझा जा सकता है।
  rationale: फल की वृद्धि, भूमि की उन्नति, वेदियों की बहुलता और खम्भों के सँवारे जाने का क्रम व्यंग्यपूर्ण समृद्धि-पाठ को बल देता है। फिर भी कठिन विशेषण का वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- issue: לּוֹ का आत्मवाची अथवा स्वार्थपरक भाव
  choice: ‘अपने लिए’ को मुख्य पाठ में रखा गया है।
  alternative: इसे केवल स्वामित्वसूचक अर्थ में ‘अपना फल’ कहा जा सकता है।
  rationale: मुख्य पाठ इब्रानी सर्वनाम के सम्भावित आत्मवाची या स्वार्थपरक तनाव को मिटाता नहीं, जबकि पाद-टिप्पणी दूसरी सम्भावना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘दाखलता’, ‘वेदियाँ’ और ‘पूजा के खम्भे’ बाइबलीय-कृषि तथा आराधना-संबंधी चित्रों को स्पष्ट रखते हैं। एकवचन ‘उसने’ सामूहिक इस्राएल के अनुरूप है; अंतिम बहुवचन ‘उन्होंने’ इब्रानी הֵיטִיבוּ के संख्या-परिवर्तन को जानबूझकर सुरक्षित रखता है।
