id: HOS.10.2
reference: Hosea 10:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חָלַ֥ק לִבָּ֖/ם עַתָּ֣ה יֶאְשָׁ֑מוּ ה֚וּא יַעֲרֹ֣ף מִזְבְּחוֹתָ֔/ם יְשֹׁדֵ֖ד מַצֵּבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/002.yaml
  text: Their heart is divided[a]; now they will bear guilt. He himself will tear down their altars[c][b]; he will devastate their sacred pillars.
translation:
  language: hi
  text: उनका मन बँटा हुआ है[a]; अब वे दोषी ठहरेंगे[b]। वही उनकी वेदियों को ढा देगा और उनके पूजा-स्तम्भों[c] को नष्ट कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनका मन कपटी है।” इब्रानी शब्द का अर्थ “चिकना” भी हो सकता है, जिससे निष्कपट न होने या छल का भाव निकलता है।
    reason: lexical_alternative
  - marker: b
    text: या “अब वे अपना दोष भोगेंगे” अथवा “अब उन्हें दोषी पाया जाएगा।”
    reason: lexical_alternative
  - marker: c
    text: “पूजा-स्तम्भ” पूजा के लिए खड़े किए गए पत्थर होते थे।
    reason: cultural_note
lexical_decisions:
- source_word: חָלַק
  choice: बँटा हुआ है
  rationale: हृदय/मन के साथ यह रूपक विभाजित निष्ठा को व्यक्त कर सकता है। साथ ही मूल शब्द में ‘चिकना/कपटी’ होने की सम्भावना है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לִבָּם
  choice: उनका मन
  rationale: इब्रानी ‘हृदय’ यहाँ विचार, इच्छा और निष्ठा सहित भीतरी व्यक्ति को दर्शाता है। आधुनिक हिन्दी में ‘मन बँटा हुआ’ अधिक स्वाभाविक है।
- source_word: יֶאְשָׁמוּ
  choice: वे दोषी ठहरेंगे
  rationale: क्रिया दोषी होने, दोषी ठहराए जाने अथवा दोष का फल भोगने का अर्थ दे सकती है। यह चयन न्याय की घोषणा को स्वाभाविक हिन्दी में रखता है और विकल्प पादटिप्पणी में देता है।
- source_word: הוּא
  choice: वही
  rationale: स्पष्ट सर्वनाम का बल बनाए रखता है, पर मूल में न दिए गए ‘यहोवा’ या ‘परमेश्वर’ को मुख्य पाठ में नहीं जोड़ता।
- source_word: יַעֲרֹף
  choice: ढा देगा
  rationale: मूल क्रिया का तीखा भाव गर्दन तोड़ने या काट गिराने का है; वेदियों के लिए ‘ढा देगा’ स्वाभाविक और बलपूर्ण हिन्दी है।
- source_word: מִזְבְּחוֹתָם
  choice: उनकी वेदियों
  rationale: बलिदान चढ़ाने के स्थलों के लिए मानक और स्पष्ट हिन्दी पद।
- source_word: יְשֹׁדֵד
  choice: नष्ट कर देगा
  rationale: उजाड़ने और विध्वंस करने का भाव व्यक्त करता है तथा समानान्तर पंक्ति में स्वाभाविक बैठता है।
- source_word: מַצֵּבוֹתָם
  choice: उनके पूजा-स्तम्भों
  rationale: מַצֵּבָה पूजा में प्रयुक्त खड़े किए गए पत्थर का स्तम्भ है। ‘पूजा-स्तम्भ’ उसके धार्मिक कार्य को संक्षेप में स्पष्ट करता है।
theological_decisions:
- issue: बलयुक्त सर्वनाम הוּא का संकेत
  choice: मुख्य पाठ में ‘वही’ रखा गया है; प्रसंग में सम्भवतः परमेश्वर न्याय करने वाला है।
  alternative: कोई अनाम शत्रु अथवा परमेश्वर के न्याय का मानवीय साधन कर्ता हो सकता है।
  rationale: होशे के प्रसंग में परमेश्वर सम्भावित कर्ता है, किन्तु इस पद में उसका नाम स्पष्ट रूप से नहीं आया। इसलिए संकेत को सुरक्षित रखते हुए नाम नहीं जोड़ा गया।
- issue: חָלַק के साथ आरोप का स्वरूप
  choice: ‘मन बँटा हुआ’—अर्थात विभाजित निष्ठा।
  alternative: ‘मन कपटी/छलपूर्ण है’—शब्द के ‘चिकना’ होने से निकला अर्थ।
  rationale: मिश्रित उपासना के प्रसंग में विभाजित निष्ठा उपयुक्त है, पर वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मन बँटा हुआ’ हिन्दी में स्वाभाविक रूप से विभाजित निष्ठा बताता है। ‘वही’ मूल के बलयुक्त सर्वनाम को बनाए रखता है और कर्ता का नाम अनावश्यक रूप से नहीं जोड़ता।
