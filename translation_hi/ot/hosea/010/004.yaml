source:
  edition: WLC
  text: דִּבְּר֣וּ דְבָרִ֔ים אָל֥וֹת שָׁ֖וְא כָּרֹ֣ת בְּרִ֑ית וּ/פָרַ֤ח כָּ/רֹאשׁ֙ מִשְׁפָּ֔ט עַ֖ל תַּלְמֵ֥י שָׂדָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/004.yaml
  text: They speak mere words[a], swearing false oaths, making covenants[d][c][b]; so judgment springs up like poison weed on the furrows of the field.
translation:
  language: hi
  text: वे केवल बातें ही करते हैं,[a] झूठी शपथ खाते हैं और वाचाएँ करते हैं;[b] इसलिए न्याय[d] खेत की जुताई की लकीरों पर विषैली घास[c] की तरह उग आता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे बातें बोलते हैं”; मूल इब्रानी में सजातीय क्रिया और संज्ञा हैं, जो केवल कथनों या खोखली बातों पर बल दे सकती हैं।
    reason: lexical_alternative
  - marker: b
    text: मूलतः “वाचा काटते हैं”; यह वाचा करने का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: “विषैली घास” के लिए प्रयुक्त इब्रानी शब्द किसी कड़वी या विषैली वनस्पति को दर्शाता है; उसकी ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
  - marker: d
    text: या, “न्यायिक फैसला”; यहाँ “न्याय” का प्रयोग कटु विडंबना के साथ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְּרוּ דְבָרִים
  choice: वे केवल बातें बनाते हैं
  rationale: सजातीय क्रिया और संज्ञा भाषण पर बल देती हैं। प्रसंग में यह खोखली या अविश्वसनीय बातों का अभियोग है; वर्तमान काल इस विशेषतागत आचरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָלות שָׁוְא
  choice: झूठी शपथ खाते
  rationale: אָלָה शाप-संकेत वाली शपथ को भी व्यक्त कर सकता है और שָׁוְא उसके झूठे या निष्फल होने पर बल देता है। 'झूठी शपथ खाते' आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: כָּרֹת בְּרִית
  choice: वाचाएँ बाँधते हैं
  rationale: शाब्दिक मुहावरा 'वाचा काटना' है। हिन्दी का 'वाचा बाँधना' अर्थ को स्वाभाविक ढंग से रखता है और साधारण 'समझौते' की अपेक्षा बाइबलीय वाचा-संकल्पना को सुरक्षित रखता है।
- source_word: וּפָרַח
  choice: उग आता है
  rationale: क्रिया अंकुरित होने, फूलने या उगने को दर्शाती है। विषैली वनस्पति और खेत के बिंब में 'उग आता है' सबसे स्वाभाविक है।
- source_word: כָּרֹאשׁ
  choice: विषैली घास की तरह
  rationale: רֹאשׁ यहाँ किसी कड़वी या विषैली वनस्पति को सूचित करता है, पर उसकी ठीक प्रजाति अनिश्चित है। यह चयन विषाक्तता का बिंब बचाता है और अनावश्यक वनस्पति-पहचान नहीं थोपता।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: मूल शब्द का सामान्य अर्थ 'न्याय/न्यायिक निर्णय' है। विषैली घास की उपमा प्रसंग में इसे कटु विडंबना बना देती है; 'न्याय' उस तनाव को अनसुलझा रहने देता है।
- source_word: עַל תַּלְמֵי שָׂדָי
  choice: खेत की मेड़ों पर
  rationale: תַּלְמֵי जुताई से बनी लकीरों या उठी हुई मेड़ों को दर्शाता है। 'खेत की मेड़ों' हिन्दी कृषि-चित्र में सहज है; वैकल्पिक 'कूड़ों' को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: निंदा के प्रसंग में מִשְׁפָּט का अर्थ
  choice: न्याय
  alternative: दण्ड / न्यायिक फैसला
  rationale: मूल शब्द सकारात्मक 'न्याय' और न्यायिक निर्णय दोनों को धारण कर सकता है। विषैली घास का बिंब संभवतः दूषित न्याय पर व्यंग्य करता है। मुख्य पाठ में 'न्याय' रखने से मूल की विडंबना और धर्मवैचारिक तनाव बने रहते हैं; नकारात्मक अर्थ को अनिवार्य रूप से नहीं थोपा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए बोधगम्य रखी गई है। 'वाचा' प्रमुख बाइबलीय पद के रूप में रखा गया है; 'वाचा काटना' जैसे अस्वाभाविक शाब्दिक मुहावरे को पादटिप्पणी में दिया गया है। मुख्य पाठ मूल की लयबद्ध अभियोग-श्रृंखला और विषैली कृषि-उपमा को बनाए रखता है।
