  text: וְ/אֶפְרַ֜יִם עֶגְלָ֤ה מְלֻמָּדָה֙ אֹהַ֣בְתִּי לָ/ד֔וּשׁ וַ/אֲנִ֣י עָבַ֔רְתִּי עַל ט֖וּב צַוָּארָ֑/הּ אַרְכִּ֤יב אֶפְרַ֨יִם֙ יַחֲר֣וֹשׁ יְהוּדָ֔ה יְשַׂדֶּד ל֖/וֹ יַעֲקֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/011.yaml
  text: Ephraim was a trained heifer that loved to thresh[a], but I spared her fair neck. I will put Ephraim to the yoke; Judah will plow[c][b]; Jacob will harrow for him.
translation:
  language: hi
  text: एप्रैम काम में सधी हुई बछिया थी, जिसे मड़ाई करना प्रिय था; पर मैंने उसकी सुंदर गर्दन को बचाए रखा[a]। मैं एप्रैम को जुए में लगाऊँगा[b]; यहूदा हल चलाएगा, और याकूब उसके लिए पाटा चलाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसकी सुंदर गर्दन के ऊपर से गुज़रा।” इस इब्रानी उपवाक्य का अर्थ कठिन है। मुख्य पाठ यह भाव देता है कि एप्रैम को पहले भारी बोझ से बचाए रखा गया था।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “मैं एप्रैम को सवार कराऊँगा।” कृषि-संदर्भ में इसका आशय शायद उसे साज या जुए में लगाना है।
    reason: lexical_alternative
  - marker: c
    text: ‘पाटा चलाना’ जुताई के बाद मिट्टी के ढेले तोड़ने और भूमि को समतल करने का काम है; अन्य सम्भव अनुवाद, “ढेले तोड़ेगा।”
    reason: cultural_note
lexical_decisions:
- source_word: עֶגְלָה מְלֻמָּדָה
  choice: काम में सधी हुई बछिया
  rationale: यह पदबंध काम की अभ्यस्त या प्रशिक्षित जवान गाय का चित्र प्रस्तुत करता है। ‘काम में सधी हुई’ स्वाभाविक हिन्दी में प्रशिक्षण और अभ्यास दोनों का भाव रखता है।
- source_word: אֹהַבְתִּי לָדוּשׁ
  choice: जिसे मड़ाई करना प्रिय था
  rationale: यह अभिव्यक्ति मड़ाई के काम में उसकी आदतन रुचि दिखाती है। ‘प्रिय था’ प्रेम या लगाव के अर्थ को बनाए रखता है, और ‘मड़ाई’ अनाज से दाना अलग करने की कृषि-क्रिया को व्यक्त करती है।
- source_word: וַאֲנִי עָבַרְתִּי עַל טוּב צַוָּארָהּ
  choice: पर मैंने उसकी सुडौल गर्दन को बचाए रखा
  rationale: इब्रानी पदबंध कठिन और मुहावरेदार है। प्रसंग में यह अर्थ उपयुक्त है कि एप्रैम की अच्छी गर्दन पर अब तक कठोर जुआ नहीं रखा गया था। ‘पर’ आसान मड़ाई और आने वाले भारी श्रम के बीच निहित विरोध को स्पष्ट करता है, जबकि वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אַרְכִּיב אֶפְרַיִם
  choice: अब मैं एप्रैम को जुए में जोतूँगा
  rationale: हिफ़ील रूप का शाब्दिक अर्थ ‘सवार कराना’ हो सकता है, पर कृषि-संदर्भ में पशु को भारी काम के लिए जुए या साज में लगाने का भाव है। यह हिन्दी रूप उस निहित कृषि-चित्र को सहजता से व्यक्त करता है।
- source_word: יַחֲרֹשׁ
  choice: हल चलाएगा
  rationale: यह क्रिया जुताई के सामान्य कृषि-अर्थ में है और घोषित भावी श्रम को स्पष्ट रूप से व्यक्त करती है।
- source_word: יְשַׂדֵּד
  choice: पाटा चलाएगा
  rationale: यह जुताई के बाद मिट्टी के ढेले तोड़ने और खेत को समतल करने की दूसरी कृषि-क्रिया को सूचित करता है। ‘पाटा चलाना’ हिन्दी में इसका संक्षिप्त कृषि-संगत रूप है; अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לּוֹ יַעֲקֹב
  choice: याकूब उसके लिए
  rationale: ‘उसके लिए’ इब्रानी के पुल्लिंग एकवचन प्रत्यय को बनाए रखता है और यह तय नहीं करता कि संबंध को अधिक विशिष्ट ढंग से कैसे समझा जाए।
theological_decisions:
- issue: एप्रैम, यहूदा और याकूब का कृषि-श्रम के रूपक में चित्रण
  choice: परमेश्वर एप्रैम को अपेक्षाकृत आसान मड़ाई से हटाकर जुए के कठिन श्रम में लगाता है; यहूदा और याकूब को भी खेत का काम सौंपा जाता है।
  alternative: इसे दंडात्मक या अनुशासनात्मक बल के बिना केवल अलग-अलग कृषि-कार्यों का वर्णन माना जा सकता है।
  rationale: होशे 10 का निकटवर्ती प्रसंग न्याय और मन-फिराव की पुकार से जुड़ा है। इसलिए रूपक में आरोपित कठिन श्रम का बल रहने दिया गया है, पर उसमें बाद की कोई विशिष्ट धर्मसैद्धांतिक व्यवस्था नहीं जोड़ी गई।
- issue: गर्दन से संबंधित कठिन इब्रानी उपवाक्य
  choice: मुख्य पाठ में इसे एप्रैम की गर्दन को अब तक भारी बोझ से बचाए रखने के रूप में समझा गया है।
  alternative: इसे अधिक शाब्दिक रूप से ‘मैं उसकी सुंदर गर्दन के ऊपर से गुज़रा’ या ‘मैं उसकी अच्छी गर्दन पर आया’ समझा जा सकता है।
  rationale: इब्रानी अस्पष्ट है। मुख्य पाठ प्रसंगगत अर्थ देता है, जबकि पादटिप्पणी वास्तविक भाषिक अनिश्चितता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कृषि-विषयक शब्द-भंडार अपनाया गया है। ‘मड़ाई’, ‘जुए में जोतना’, ‘हल चलाना’ और ‘पाटा चलाना’ मूल रूपक को बनाए रखते हैं। कठिन इब्रानी को मुख्य पाठ में अत्यधिक शाब्दिक बनाकर अस्वाभाविक नहीं किया गया, पर उसकी अस्पष्टता पादटिप्पणी में स्पष्ट रूप से सुरक्षित है।
