id: HOS.10.14
reference: Hosea 10:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/קָ֣אם שָׁאוֹן֮ בְּ/עַמֶּ/ךָ֒ וְ/כָל מִבְצָרֶ֣י/ךָ יוּשַּׁ֔ד כְּ/שֹׁ֧ד שַֽׁלְמַ֛ן בֵּ֥ית אַֽרְבֵ֖אל בְּ/י֣וֹם מִלְחָמָ֑ה אֵ֥ם עַל בָּנִ֖ים רֻטָּֽשָׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/014.yaml
  text: The tumult will arise among your people[a], and all your fortresses will be devastated, as Shalman devastated Beth-arbel on the day of battle[b]; mothers were dashed to pieces with their children.
translation:
  language: hi
  text: तुम्हारे लोगों के बीच कोलाहल उठेगा, और तुम्हारे सभी गढ़ उजाड़ दिए जाएँगे, जैसे युद्ध के दिन शलमन[a] ने बेत-अरबेल को उजाड़ दिया था; माताओं को उनके बच्चों समेत चूर-चूर कर पटक दिया गया था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शलमन संभवतः शल्मनेसेर को सूचित करता हो, पर उसकी सटीक ऐतिहासिक पहचान अनिश्चित है।
    reason: alternative_reading
  - marker: b
    text: 'अधिक शाब्दिक रूप से: “एक माँ बच्चों पर पटक दी गई।” इब्रानी अभिव्यक्ति संक्षिप्त और अत्यंत भीषण है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָאם שָׁאוֹן
  choice: कोलाहल उठेगा
  rationale: भविष्यसूचक प्रसंग में וְקָאם आने वाली घटना बताता है; שָׁאוֹן युद्ध और विनाश से जुड़ा ऊँचा शोर या हाहाकार है। ‘कोलाहल उठेगा’ इस बिंब और भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּעַמֶּךָ
  choice: तुम्हारे लोगों के बीच
  rationale: यहाँ ב उस समुदाय को दर्शाता है जिसके बीच कोलाहल उठेगा।
- source_word: מִבְצָרֶיךָ
  choice: तुम्हारे सभी गढ़
  rationale: מִבְצָר रक्षात्मक किलेबंद स्थान है; ‘गढ़’ संक्षिप्त, सहज और सैन्य अर्थ वाला शब्द है।
- source_word: יוּשַּׁד
  choice: उजाड़ दिए जाएँगे
  rationale: שׁדד का यह कर्मवाच्य रूप हिंसक लूट और विनाश दोनों का भाव रखता है; ‘उजाड़ दिए जाएँगे’ उस व्यापक परिणाम को व्यक्त करता है।
- source_word: שַׁלְמַן
  choice: शलमन
  rationale: इब्रानी नाम को उसके स्रोत-रूप के अनुसार लिप्यंतरित किया गया है; किसी शल्मनेसेर से उसकी अनिश्चित पहचान मुख्य पाठ में नहीं थोपी गई।
- source_word: בֵּית אַרְבֵאל
  choice: बेत-अरबेल
  rationale: स्थान-नाम का इब्रानी रूप से सीधा देवनागरी लिप्यंतरण है।
- source_word: בְּיוֹם מִלְחָמָה
  choice: युद्ध के दिन
  rationale: यह विशिष्ट सैन्य घटना के समय को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֵם עַל בָּנִים רֻטָּשָׁה
  choice: माताएँ अपने बच्चों समेत पटककर चूर कर दी गई थीं
  rationale: रूप की दृष्टि से אֵם एकवचन है, पर प्रसंग में प्रतिनिधिक या सामूहिक अर्थ संभव है। ‘अपने बच्चों समेत’ עַל की यहाँ संभावित सहविनाश की शक्ति को सहज हिन्दी में व्यक्त करता है, और ‘पटककर चूर कर दी गई थीं’ רטש की क्रूर हिंसा को बनाए रखता है।
theological_decisions:
- issue: שַׁלְמַן की ऐतिहासिक पहचान
  choice: नाम को ‘शलमन’ ही रखा गया है।
  alternative: इसे शल्मनेसेर तृतीय या शल्मनेसेर पंचम के रूप में पहचाना जा सकता है।
  rationale: इब्रानी पाठ केवल שַׁלְמַן देता है और सटीक ऐतिहासिक पहचान अनिश्चित है; इसलिए मुख्य पाठ स्रोत की अनिश्चितता को बनाए रखता है।
- issue: अंतिम अत्याचार-वाक्यांश का अर्थ
  choice: माताओं को उनके बच्चों समेत पटककर चूर किए जाने के रूप में अनुवाद किया गया है।
  alternative: 'अधिक शाब्दिक रूप: ‘एक माँ बच्चों पर पटक दी गई।’'
  rationale: इब्रानी कथन संक्षिप्त और भीषण है। मुख्य पाठ संभावित सामूहिक अर्थ को सहज हिन्दी में देता है, जबकि अधिक शाब्दिक संरचना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। सैन्य विनाश की तीव्रता बनाए रखी गई है, पर अनिश्चित ऐतिहासिक पहचान और अंतिम वाक्यांश की संक्षिप्त इब्रानी संरचना को व्याख्या द्वारा निर्णायक नहीं बनाया गया।
