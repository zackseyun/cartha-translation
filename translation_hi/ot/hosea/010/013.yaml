language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חֲרַשְׁתֶּם רֶ֛שַׁע עַוְלָ֥תָ/ה קְצַרְתֶּ֖ם אֲכַלְתֶּ֣ם פְּרִי כָ֑חַשׁ כִּֽי בָטַ֥חְתָּ בְ/דַרְכְּ/ךָ֖ בְּ/רֹ֥ב גִּבּוֹרֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/013.yaml
  text: You have plowed wickedness[a]; you have reaped injustice; you have eaten the fruit of deceit, because you trusted in your way[c][b], in the multitude of your warriors.
translation:
  language: hi
  text: तुमने दुष्टता का हल चलाया है; तुमने अन्याय की फसल काटी है; तुमने छल का फल खाया है, क्योंकि तुमने अपने मार्ग पर और अपने बहुत-से योद्धाओं पर भरोसा किया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “तुमने हल चलाया... फसल काटी... फल खाया” बहुवचन है, पर “तुमने भरोसा किया... अपने मार्ग... अपने योद्धाओं” एकवचन है; सम्भवतः इस्राएल को एक सामूहिक इकाई मानकर सम्बोधित किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: חֲרַשְׁתֶּם
  choice: तुमने ... हल चलाया है
  rationale: कृषि-संबंधी मूल चित्र को बनाए रखता है और आगे की ‘फसल काटी’ तथा ‘फल खाया’ वाली क्रमिक उपमा से मेल खाता है।
- source_word: רֶשַׁע
  choice: दुष्टता
  rationale: यह नैतिक बुराई का स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी शब्द है।
- source_word: עַוְלָתָה
  choice: अन्याय
  rationale: शब्द के नैतिक और सामाजिक आयाम को व्यक्त करता है तथा पहले आए ‘दुष्टता’ से अर्थगत भेद बनाए रखता है।
- source_word: קְצַרְתֶּם
  choice: तुमने ... फसल काटी है
  rationale: मूल कृषि-रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: אֲכַלְתֶּם פְּרִי כָחַשׁ
  choice: तुमने छल का फल खाया है
  rationale: मूल के ‘फल’ और ‘खाने’ के चित्र को रखते हुए כָחַשׁ को प्रसंगानुकूल ‘छल’ के रूप में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: पिछले आरोप का कारण प्रस्तुत करता है।
- source_word: בָטַחְתָּ
  choice: तुमने ... भरोसा किया है
  rationale: בטח के भरोसा या निर्भरता रखने के मूल भाव को सहज आधुनिक हिन्दी में देता है।
- source_word: בְדַרְכְּךָ
  choice: अपने मार्ग पर
  rationale: ‘मार्ग’ मूल रूपक और उसके आचरण अथवा नीति-संबंधी व्यापक संकेत को बनाए रखता है।
- source_word: בְּרֹב גִּבּוֹרֶיךָ
  choice: अपने बहुत-से योद्धाओं पर
  rationale: सैनिक संदर्भ में גִּבּוֹרִים का अर्थ स्पष्ट करता है और רֹב के संख्यात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सम्बोधन में बहुवचन से एकवचन की ओर परिवर्तन
  choice: मुख्य पाठ में सामान्य हिन्दी ‘तुम’ रखा और संख्या-परिवर्तन को पादटिप्पणी में बताया।
  alternative: ‘तुम लोगों ने ... क्योंकि तूने’ कहकर व्याकरणिक परिवर्तन को सीधे मुख्य पाठ में दिखाना।
  rationale: इब्रानी में आरम्भिक क्रियाएँ बहुवचन हैं, जबकि बाद की क्रिया और प्रत्यय एकवचन हैं। यह सम्भवतः इस्राएल को सामूहिक इकाई के रूप में सम्बोधित करता है; हिन्दी में अचानक ‘तुम’ से ‘तू’ का बदलाव अनावश्यक रूप से शैली और सम्मान-स्तर बदल देता, इसलिए वास्तविक स्रोत-भेद को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण भविष्यद्वक्ताई आरोप। कृषि-रूपक को अक्षुण्ण रखा गया है। पादटिप्पणी का चिह्न मुख्य पाठ में उपस्थित है।
