source:
  edition: WLC
  text: זִרְע֨וּ לָ/כֶ֤ם לִ/צְדָקָה֙ קִצְר֣וּ לְ/פִי חֶ֔סֶד נִ֥ירוּ לָ/כֶ֖ם נִ֑יר וְ/עֵת֙ לִ/דְר֣וֹשׁ אֶת יְהוָ֔ה עַד יָב֕וֹא וְ/יֹרֶ֥ה צֶ֖דֶק לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/012.yaml
  text: Sow for yourselves for righteousness[a]; reap according to steadfast love. Break up for yourselves unplowed ground, for it is time to seek Yahweh[b], until he comes and rains righteousness on you.
translation:
  language: hi
  text: अपने लिए धार्मिकता के लिए बोओ; अटल प्रेम के अनुसार फसल काटो। अपने लिए परती भूमि जोतो, क्योंकि अब याहवे को खोजने का समय है—जब तक वह आकर तुम पर धार्मिकता बरसाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक वह आकर तुम्हें धार्मिकता सिखाए।” इब्रानी क्रिया का अर्थ “सिखाना” भी हो सकता है, पर इस पद का खेती-बाड़ी वाला रूपक “वर्षा करना” अर्थ का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: זִרְעוּ לָכֶם לִצְדָקָה
  choice: अपने लिए धार्मिकता बोओ
  rationale: बहुवचन आज्ञा और कृषि-रूपक दोनों को बनाए रखते हुए לָכֶם के हितवाचक भाव को ‘अपने लिए’ से व्यक्त किया गया है। לִצְדָקָה को लक्ष्य/परिणाम के अर्थ में ‘धार्मिकता’ रखा गया है।
- source_word: קִצְרוּ לְפִי חֶסֶד
  choice: अटल प्रेम के अनुसार फसल काटो
  rationale: קצר के कटनी-संबंधी अर्थ को स्वाभाविक हिन्दी में ‘फसल काटो’ कहा गया है। חֶסֶד के स्थायी, निष्ठावान प्रेम के भाव के लिए ‘अटल प्रेम’ चुना गया है और לְפִי का अनुपात/मानदंड संबंधी अर्थ ‘के अनुसार’ से सुरक्षित है।
- source_word: נִירוּ לָכֶם נִיר
  choice: अपने लिए परती भूमि जोतो
  rationale: न जोती गई अथवा परती पड़ी भूमि को खेती योग्य बनाने की छवि ‘परती भूमि जोतो’ से स्पष्ट और संक्षिप्त रूप में आती है; ‘अपने लिए’ मूल के हितवाचक לָכֶם को रखता है।
- source_word: וְעֵת לִדְרוֹשׁ אֶת יְהוָה
  choice: क्योंकि अब याहवे को खोजने का समय है
  rationale: वाक्य के कारणसूचक संबंध और तात्कालिकता को स्वाभाविक हिन्दी में व्यक्त किया गया है। परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ लिखा गया है।
- source_word: עַד יָבוֹא וְיֹרֶה צֶדֶק לָכֶם
  choice: जब तक वह आकर तुम पर धार्मिकता की वर्षा न करे
  rationale: खेती के पूरे प्रसंग में ירה को वर्षा करने के अर्थ में लेना रूपक को निरंतर रखता है। צֶדֶק को पहले आए צדקה के समान अर्थ-क्षेत्र में ‘धार्मिकता’ अनूदित किया गया है।
theological_decisions:
- issue: וְיֹרֶה צֶדֶק का अर्थ
  choice: वह तुम पर धार्मिकता की वर्षा करे
  alternative: वह तुम्हें धार्मिकता सिखाए
  rationale: बोने, फसल काटने और भूमि जोतने के निकट प्रसंग में वर्षा की छवि अधिक संगत है; फिर भी ירה का अर्थ ‘सिखाना’ भी हो सकता है, इसलिए वास्तविक भाषिक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कृषि-रूपक को पूरे पद में बनाए रखा गया है और अनावश्यक धर्म-सांप्रदायिक शब्दावली से बचा गया है।
