source:
  edition: WLC
  text: כָּ֗כָה עָשָׂ֤ה לָ/כֶם֙ בֵּֽית אֵ֔ל מִ/פְּנֵ֖י רָעַ֣ת רָֽעַתְ/כֶ֑ם בַּ/שַּׁ֕חַר נִדְמֹ֥ה נִדְמָ֖ה מֶ֥לֶךְ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/015.yaml
  text: Thus Bethel has done to you because of your great evil[b][a]. At dawn the king of Israel will be utterly cut off.
translation:
  language: hi
  text: तुम्हारी घोर बुराई के कारण[a] बेतेल ने तुम्हारे साथ ऐसा ही किया है। भोर में इस्राएल का राजा पूरी तरह नष्ट हो जाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘बुराई’ शब्द दोहराया गया है—शाब्दिक रूप से, ‘तुम्हारी बुराई की बुराई’—ताकि उसकी तीव्रता पर बल दिया जाए।
    reason: lexical_alternative
  - marker: b
    text: या ‘निश्चय ही काट दिया जाएगा,’ ‘पूरी तरह मिट जाएगा,’ अथवा ‘पूरी तरह चुप करा दिया जाएगा।’ इब्रानी में क्रिया के साथ उसी धातु का बलसूचक अनन्तरूप प्रयुक्त है, जो कथन पर बल देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כָּכָה
  choice: ऐसा ही
  rationale: यह संकेतवाचक क्रियाविशेषण पिछले प्रसंग में बताए गए न्याय के ढंग या परिणाम की ओर संकेत करता है; ‘ऐसा ही’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָשָׂה לָכֶם
  choice: तुम्हारे साथ ... किया है
  rationale: इब्रानी पूर्ण क्रिया और परोक्ष कर्म को हिन्दी में वर्तमान पूर्ण रूप से व्यक्त किया गया है, जिससे घोषित न्याय की निश्चितता और पिछले कथन से उसका संबंध बना रहता है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: प्रसंग में यह स्थान का नाम है; इसलिए अर्थानुवाद ‘परमेश्वर का घर’ करने के बजाय नाम का लिप्यंतरण किया गया है।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: यहाँ संबंधकारक पद न्याय का कारण बताता है।
- source_word: רָעַת רָעַתְכֶם
  choice: तुम्हारी घोर बुराई
  rationale: ‘बुराई’ की पुनरुक्ति तीव्रता प्रकट करती है। ‘घोर बुराई’ उस बल को सहज आधुनिक हिन्दी में रखती है।
- source_word: בַּשַּׁחַר
  choice: भोर होते ही
  rationale: यह समय को सूचित करता है और आने वाले विनाश की आकस्मिकता को भी उभार सकता है; ‘भोर होते ही’ दोनों प्रभावों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נִדְמֹה נִדְמָה
  choice: पूरी तरह नष्ट हो जाएगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute कथन को प्रबल करता है। इस प्रसंग में विनाश का अर्थ उपयुक्त है, जबकि मूल क्रिया की ‘मिट जाने/काट दिए जाने/चुप करा दिए जाने’ संबंधी अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: यह संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ‘बेतेल’ का अभिप्राय
  choice: मुख्य पाठ में स्थान का नाम ‘बेतेल’ ही रखा गया है, जो प्रसंग में वहाँ की मूर्तिपूजक व्यवस्था का प्रतिनिधित्व भी कर सकता है।
  alternative: इसे बछड़े की मूर्ति का संक्षिप्त संकेत या स्थान-नाम का व्यंग्यात्मक प्रयोग समझना।
  rationale: इब्रानी पाठ सीधे स्थान का नाम लेता है। नाम को बनाए रखने से संभावित लाक्षणिक अर्थ को अनावश्यक रूप से निश्चित नहीं किया जाता।
- issue: רָעַת की पुनरुक्ति
  choice: तीव्रता के अर्थ में ‘घोर बुराई’।
  alternative: अधिक शाब्दिक ‘तुम्हारी बुराई की बुराई’ या अधिक प्रबल ‘तुम्हारी अत्यंत दुष्टता’।
  rationale: पुनरुक्ति को अलग-अलग दो बुराइयों के रूप में नहीं, बल्कि बलाघात के रूप में समझना प्रसंग और इब्रानी शैली के अनुरूप है।
- issue: נִדְמֹה נִדְמָה का अर्थ
  choice: राजा के निर्णायक विनाश को ‘पूरी तरह नष्ट हो जाएगा’ कहा गया है।
  alternative: ‘निश्चय ही काट दिया जाएगा’, ‘पूरी तरह मिट जाएगा’ या ‘पूरी तरह चुप करा दिया जाएगा’।
  rationale: निफ़अल रूप यहाँ विनाश या समाप्ति को सूचित कर सकता है और infinitive absolute उसकी निश्चितता/तीव्रता बढ़ाता है। मुख्य पाठ प्रसंगानुकूल अर्थ देता है, जबकि वास्तविक शब्दार्थगत अस्पष्टता पादटिप्पणी में बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘घोर बुराई’ और ‘पूरी तरह नष्ट’ इब्रानी पुनरुक्ति तथा बलाघात को स्वाभाविक हिन्दी में व्यक्त करते हैं। स्थान और जाति के नाम प्रचलित बाइबिलीय हिन्दी वर्तनी ‘बेतेल’ और ‘इस्राएल’ में दिए गए हैं।
