    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְמֶה
  choice: मिट गया
  rationale: यहाँ निफ़ाल रूप का अर्थ समाप्त कर दिया जाना, नष्ट होना या अस्तित्व से हट जाना हो सकता है। “मिट गया” सामरिया के राजनीतिक विनाश को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अन्य सम्भव अर्थ सुरक्षित रखती है।
- source_word: שֹׁמְרוֹן
  choice: सामरिया
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप; यहाँ राजधानी के साथ उत्तरी राज्य का भी बोध हो सकता है।
- source_word: מַלְכָּהּ
  choice: उसका राजा
  rationale: स्त्रीलिंग एकवचन प्रत्यय सामरिया की ओर संकेत करता है। हिन्दी में “उसका” स्वाभाविक है और अनावश्यक मानवीकरण जोड़े बिना सम्बन्ध स्पष्ट करता है।
- source_word: כְּקֶצֶף
  choice: झाग के समान
  rationale: קֶצֶף का प्रमुख अर्थ झाग या फेन है और यह अस्थिरता तथा शीघ्र बह जाने का चित्र प्रस्तुत करता है। लकड़ी के छोटे टुकड़े या तैरते मलबे का अर्थ पादटिप्पणी में रखा गया है।
- source_word: עַל פְּנֵי מָיִם
  choice: पानी की सतह पर
  rationale: शाब्दिक अर्थ “पानी के मुख पर” है; “पानी की सतह पर” आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल दृश्य को बनाए रखता है।
