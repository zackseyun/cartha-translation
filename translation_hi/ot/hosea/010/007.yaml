  yaml_path: translation/ot/hosea/010/007.yaml
  text: Samaria is cut off[b][a], her king like foam on the surface of the waters.
translation:
  language: hi
  text: सामरिया नाश हो गया[a]; उसका राजा पानी की सतह पर झाग[b] के समान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सामरिया मिट गया”; इब्रानी क्रिया का अर्थ समाप्त हो जाना, नष्ट होना, या चुप करा दिया जाना हो सकता है।
    reason: lexical_alternative
