  text: וְ/נִשְׁמְד֞וּ בָּמ֣וֹת אָ֗וֶן חַטַּאת֙ יִשְׂרָאֵ֔ל ק֣וֹץ וְ/דַרְדַּ֔ר יַעֲלֶ֖ה עַל מִזְבְּחוֹתָ֑/ם וְ/אָמְר֤וּ לֶֽ/הָרִים֙ כַּסּ֔וּ/נוּ וְ/לַ/גְּבָע֖וֹת נִפְל֥וּ עָלֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/008.yaml
  text: The high places of Aven[a], the sin of Israel, will be destroyed. Thorn and thistle will grow up on their altars, and they will say to the mountains, “Cover us!” and to the hills, “Fall on us!”
translation:
  language: hi
  text: आवेन के ऊँचे पूजा-स्थल[a]—इस्राएल का पाप—नष्ट कर दिए जाएँगे। उनकी वेदियों पर काँटे और ऊँटकटारे उग आएँगे। तब वे पहाड़ों से कहेंगे, “हमें ढक लो!” और पहाड़ियों से, “हम पर गिर पड़ो!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दुष्टता के ऊँचे पूजा-स्थल।” इब्रानी शब्द आवेन किसी स्थान के नाम के रूप में भी प्रयुक्त हो सकता है और उसका अर्थ “दुष्टता” या “अधर्म” भी हो सकता है; यहाँ संभवतः जानबूझकर शब्द-क्रीड़ा की गई है।
    reason: alternative_reading
lexical_decisions:
- source_word: בָּמוֹת
  choice: पूजा-स्थल
  rationale: यह शब्द ऊँचे स्थानों पर बने उपासना-केंद्रों के लिए प्रयुक्त धार्मिक पारिभाषिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है; केवल ‘ऊँचे स्थान’ कहने से यह अर्थ अस्पष्ट रह सकता है।
- source_word: אָוֶן
  choice: आवेन
  rationale: रचना में यह स्थान-नाम के रूप में समझा जा सकता है, जबकि इसके ‘दुष्टता/अधर्म’ वाले अर्थ की शब्द-क्रीड़ा पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: חַטַּאת יִשְׂרָאֵל
  choice: इस्राएल का पाप
  rationale: यहाँ חַטַּאת पिछले पदबंध का समानाधिकरण में वर्णन करता है; प्रसंग में ‘पापबलि’ की अपेक्षा ‘पाप’ स्वाभाविक है।
- source_word: וְנִשְׁמְדוּ
  choice: नष्ट कर दिए जाएँगे
  rationale: निफ़अल रूप पूर्ण विनाश या मिटा दिए जाने को व्यक्त करता है; यह चयन भावी भविष्यद्वाणी और कर्मवाच्य दोनों को स्पष्ट रखता है।
- source_word: קוֹץ וְדַרְדַּר
  choice: काँटे और ऊँटकटारे
  rationale: यह जोड़ी उजाड़ और त्याग दिए जाने की छवि देती है; ‘ऊँटकटारा’ दַרְדַּר के काँटेदार वनस्पति-संबंधी भेद को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַעֲלֶה עַל מִזְבְּחוֹתָם
  choice: उनके वेदी-स्थलों पर ... उग आएँगे
  rationale: वनस्पति के साथ עלה का अर्थ ‘उगना’ है। बहुवचन वेदियों को हिन्दी में सहज बनाने के लिए ‘वेदी-स्थलों’ का प्रयोग किया गया है।
- source_word: כַּסּוּנוּ
  choice: हमें ढक लो
  rationale: आज्ञार्थक रूप और संकट से ढक दिए जाने की सजीव छवि सीधे सुरक्षित रहती है।
- source_word: נִפְלוּ עָלֵינוּ
  choice: हम पर गिर पड़ो
  rationale: मूल के सीधे आज्ञार्थक और न्याय से छिपने या दब जाने की हताश पुकार को बनाए रखता है।
theological_decisions:
- issue: אָוֶן को स्थान-नाम माना जाए या ‘दुष्टता/अधर्म’ अर्थ वाला सामान्य संज्ञा-पद
  choice: मुख्य पाठ में स्थान-नाम ‘आवेन’ रखा गया है।
  alternative: ‘दुष्टता के पूजा-स्थल’ अथवा ‘अधर्म के पूजा-स्थल।’
  rationale: इब्रानी वाक्य-विन्यास दोनों संभावनाएँ देता है और होशे में बेथ-आवेन से जुड़ी निंदात्मक शब्द-क्रीड़ा भी मिलती है। स्थान-संदर्भ मुख्य पाठ में रखते हुए अर्थगत तनाव पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। धार्मिक-सांस्कृतिक अर्थ स्पष्ट करने के लिए בָּמוֹת का अनुवाद ‘पूजा-स्थल’ और बहुवचन מִזְבְּחוֹת का ‘वेदी-स्थल’ किया गया है। काव्यात्मक समानांतरता और दोनों तीखे आज्ञार्थक उद्गार बनाए रखे गए हैं।
