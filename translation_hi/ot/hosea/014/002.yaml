id: HOS.14.2
reference: Hosea 14:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שׁ֚וּבָ/ה יִשְׂרָאֵ֔ל עַ֖ד יְהוָ֣ה אֱלֹהֶ֑י/ךָ כִּ֥י כָשַׁ֖לְתָּ בַּ/עֲוֺנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/002.yaml
  text: Return[a], O Israel, to Yahweh your God, for you have stumbled in your iniquity.
translation:
  language: hi
  text: हे इस्राएल, अपने परमेश्वर याहवे के पास लौट आ, क्योंकि तू अपने अधर्म में ठोकर खा चुका है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तू अपने अधर्म के कारण ठोकर खा चुका है।” इब्रानी पूर्वसर्ग कारण भी व्यक्त कर सकता है और वह क्षेत्र भी जिसमें इस्राएल ने ठोकर खाई।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבָה
  choice: लौट आ
  rationale: यह आज्ञार्थक क्रिया मूलतः लौटने या फिरने को व्यक्त करती है। “लौट आ” परमेश्वर की ओर वापसी की दिशात्मक और वाचागत छवि बनाए रखता है; “मन फिरा” की तुलना में कम व्याख्यात्मक है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण; संबोधन को “हे” से स्पष्ट किया गया है।
- source_word: עַד
  choice: के पास
  rationale: लौटने की क्रिया के साथ यह लक्ष्य की ओर गति दर्शाता है। “के पास” आधुनिक हिन्दी में परमेश्वर की ओर संबंधपरक वापसी को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुराक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय नाम के रूप में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय का संबंध “अपने” से स्वाभाविक हिन्दी में व्यक्त होता है और इस्राएल के साथ वाचा-संबंध सुरक्षित रहता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह लौटने के आह्वान का कारण प्रस्तुत करता है।
- source_word: כָשַׁלְתָּ
  choice: ठोकर खा चुका है
  rationale: כשל की ठोकर खाने की रूपकात्मक छवि को बनाए रखता है और “गिर पड़ा” कहकर पूर्ण पतन को अनावश्यक रूप से निश्चित नहीं करता। सामूहिक इस्राएल को एकवचन संबोधन के कारण “तू” रखा गया है।
- source_word: בַּעֲוֺנֶךָ
  choice: अपने अधर्म में
  rationale: בְּ की संक्षिप्त अस्पष्टता को बनाए रखते हुए अधर्म को ठोकर खाने के क्षेत्र या परिस्थिति के रूप में व्यक्त करता है; कारणसूचक अर्थ भी संभव है और पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: יְהוָה दिव्य नाम का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। “यहवे” उसे उपाधि में बदले बिना नाम के रूप में सुरक्षित रखता है।
- issue: שׁוּבָה को लौटने या मन फिराने के रूप में प्रस्तुत करना
  choice: लौट आ
  alternative: मन फिरा; वापस मुड़
  rationale: मूल क्रिया की दिशात्मक छवि और उसकी व्यापक वाचागत पुकार को सुरक्षित रखा गया है। पश्चात्ताप संदर्भ में निहित है, पर उसे मूल क्रिया का एकमात्र अर्थ नहीं बनाया गया।
- issue: בַּעֲוֺנֶךָ में בְּ का संबंध
  choice: अपने अधर्म में
  alternative: अपने अधर्म के कारण
  rationale: इब्रानी पूर्वसर्ग ठोकर खाने के क्षेत्र और कारण, दोनों की ओर संकेत कर सकता है। मुख्य पाठ निकट और संक्षिप्त रूप रखता है; कारणसूचक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधा भविष्यद्वक्तीय संबोधन। इस्राएल को सामूहिक एकवचन मानते हुए “तू/अपने” रखा गया है। “अधर्म” עָוֹן की नैतिक गंभीरता को व्यक्त करता है, जबकि “ठोकर खाना” मूल रूपक को बनाए रखता है।
