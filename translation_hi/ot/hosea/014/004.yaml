source:
  edition: WLC
  text: אַשּׁ֣וּר לֹ֣א יוֹשִׁיעֵ֗/נוּ עַל סוּס֙ לֹ֣א נִרְכָּ֔ב וְ/לֹא נֹ֥אמַר ע֛וֹד אֱלֹהֵ֖י/נוּ לְ/מַעֲשֵׂ֣ה יָדֵ֑י/נוּ אֲשֶׁר בְּ/ךָ֖ יְרֻחַ֥ם יָתֽוֹם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/004.yaml
  text: Assyria will not save us[a]; we will not ride on horses, and we will no longer say, ‘Our God,’ to the work of our hands[b]. In you the fatherless finds mercy.
translation:
  language: hi
  text: अश्शूर हमें नहीं बचाएगा; हम घोड़ों पर सवार नहीं होंगे, और अपने हाथों की बनाई हुई वस्तु को फिर कभी ‘हमारा परमेश्वर’ नहीं कहेंगे। तुझ में अनाथ[a] दया पाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पितृहीन’। इब्रानी शब्द का शाब्दिक अर्थ पिता से वंचित व्यक्ति है और वह व्यापक रूप से असहाय व्यक्ति का भी बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'अन्तिम वाक्य का अनुवाद कारणसूचक रूप में भी हो सकता है: ‘क्योंकि तुझ में अनाथ दया पाता है।’'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: यह राष्ट्र का प्रचलित हिन्दी बाइबलीय नाम है। पद में विदेशी साम्राज्य की शक्ति पर भरोसा त्यागने की बात है।
- source_word: יוֹשִׁיעֵנוּ
  choice: हमें नहीं बचाएगा
  rationale: हिफ़ील रूप का सामान्य अर्थ ‘बचाना/छुड़ाना’ है। ‘बचाएगा’ राजनीतिक उद्धार पर व्यर्थ भरोसे और परमेश्वर से मिलने वाले उद्धार—दोनों की गूँज बनाए रखता है।
- source_word: עַל סוּס לֹא נִרְכָּב
  choice: हम घोड़ों पर सवार नहीं होंगे
  rationale: शाब्दिक चित्र को स्वाभाविक हिन्दी में रखा गया है; यहाँ घोड़े सैनिक सामर्थ्य और आत्मनिर्भरता का संकेत देते हैं।
- source_word: וְלֹא נֹאמַר עוֹד
  choice: फिर कभी … नहीं कहेंगे
  rationale: עוֹד के भाव को स्पष्ट करता है कि वे आगे से ऐसा कहना छोड़ देंगे।
- source_word: אֱלֹהֵינוּ
  choice: हमारा परमेश्वर
  rationale: सन्दर्भ में यह हाथों की बनाई वस्तु को दिया जाने वाला एकवचन सम्बोधन है; ‘हमारे देवता’ करने से अनावश्यक रूप से बहुवचन निश्चित हो जाता।
- source_word: לְמַעֲשֵׂה יָדֵינוּ
  choice: अपने हाथों की बनाई हुई वस्तु को
  rationale: मूल अभिव्यक्ति मूर्ति की ओर संकेत करती है। ‘वस्तु’ सामूहिक एकवचन को बनाए रखते हुए हिन्दी में सहज है।
- source_word: אֲשֶׁר בְּךָ
  choice: तुझमें
  rationale: सम्बन्धवाचक अव्यय के व्याख्यात्मक अथवा कारणसूचक बल को मुख्य पाठ में निश्चित नहीं किया गया; अलग वाक्य मूल की काव्यात्मक संक्षिप्तता और अर्थगत खुलापन बनाए रखता है।
- source_word: יְרֻחַם
  choice: पर दया होती है
  rationale: רחם के पुअल रूप का निष्क्रिय भाव स्वाभाविक हिन्दी में व्यक्त होता है और दया पाने वाले पर ध्यान रखता है।
- source_word: יָתוֹם
  choice: अनाथ
  rationale: आधुनिक हिन्दी में यह उस व्यक्ति के लिए सहज और व्यापक शब्द है जो माता-पिता अथवा विशेषतः पिता के संरक्षण से वंचित है; ‘पितृहीन’ अधिक शाब्दिक विकल्प है।
theological_decisions:
- issue: अन्तिम उपवाक्य को स्पष्ट रूप से कारणसूचक बनाया जाए या नहीं
  choice: 'इसे अलग वाक्य के रूप में रखा गया: ‘तुझमें अनाथ पर दया होती है।’'
  alternative: ‘क्योंकि तुझमें अनाथ पर दया होती है।’
  rationale: אֲשֶׁר यहाँ व्याख्यात्मक या कारणसूचक हो सकता है। अलग वाक्य दया केवल परमेश्वर में मिलने का बल बनाए रखता है, पर सम्बन्ध को आवश्यकता से अधिक निश्चित नहीं करता।
- issue: יָתוֹם का संकेत केवल वास्तविक अनाथ की ओर है या असहाय इस्राएल की ओर भी
  choice: ठोस संज्ञा ‘अनाथ’ को बिना व्याख्यात्मक विस्तार के रखा गया।
  alternative: ‘हम पितृहीनों पर’ अथवा इस्राएल को सीधे अनाथ बताने वाला अनुवाद
  rationale: पाठ वास्तविक असुरक्षित व्यक्ति और इस्राएल की असहाय दशा—दोनों की ओर संकेत कर सकता है। अनुवाद इस सम्भावित दोहरे अर्थ को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अश्शूर’, ‘परमेश्वर’ और ‘दया’ परिचित बाइबलीय शब्दावली हैं; वाक्य-संरचना मूल की स्वीकारोक्तिपूर्ण, काव्यात्मक लय को बनाए रखती है।
