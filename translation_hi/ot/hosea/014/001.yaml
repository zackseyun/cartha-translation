source:
  edition: WLC
  text: תֶּאְשַׁם֙ שֹֽׁמְר֔וֹן כִּ֥י מָרְתָ֖ה בֵּֽ/אלֹהֶ֑י/הָ בַּ/חֶ֣רֶב יִפֹּ֔לוּ עֹלְלֵי/הֶ֣ם יְרֻטָּ֔שׁוּ וְ/הָרִיּוֹתָ֖י/ו יְבֻקָּֽעוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/001.yaml
  text: Samaria shall bear her guilt[a], because she has rebelled against her God. They shall fall by the sword; their little children shall be dashed to pieces[b], and their pregnant women ripped open.
translation:
  language: hi
  text: सामरिया अपने दोष का फल भोगेगी[a], क्योंकि उसने अपने परमेश्वर के विरुद्ध विद्रोह किया है। वे तलवार से मारे जाएँगे; उनके छोटे बच्चे पटककर टुकड़े-टुकड़े कर दिए जाएँगे[b], और उनकी गर्भवती स्त्रियों के पेट चीर दिए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सामरिया दोषी ठहरेगी” अथवा “सामरिया अपने दोष के कारण दुःख भोगेगी।”
    reason: lexical_alternative
  - marker: b
    text: या “उनके शिशु पटककर टुकड़े-टुकड़े कर दिए जाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאְשַׁם
  choice: अपने दोष का फल भोगेगी
  rationale: अर्थ में दोषी होना और उस दोष का परिणाम भुगतना दोनों सम्मिलित हो सकते हैं। यह चयन न्याय-संदर्भ में दोनों पहलुओं को सहज हिन्दी में बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: שֹׁמְרוֹן
  choice: सामरिया
  rationale: स्थान-नाम का हिन्दी बाइबलीय प्रचलित रूप; वाक्य में नगर को स्त्रीलिंग व्यक्तित्व के रूप में रखा गया है।
- source_word: מָרְתָה
  choice: विद्रोह किया है
  rationale: מרה अधिकार के विरुद्ध विद्रोह या अवज्ञा प्रकट करता है; यहाँ परमेश्वर के विरुद्ध स्पष्ट वाचा-संबंधी विद्रोह है।
- source_word: בֵּאלֹהֶיהָ
  choice: अपने परमेश्वर के विरुद्ध
  rationale: पूर्वसर्ग विद्रोह के लक्ष्य को बताता है और स्त्रीलिंग एकवचन प्रत्यय सामरिया से संबंधित है।
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: तलवार से मारे जाएँगे
  rationale: शाब्दिक रूप से 'तलवार से गिरेंगे'; युद्ध-संदर्भ में हिन्दी का यह स्वाभाविक मुहावरा मृत्यु का आशय स्पष्ट करता है।
- source_word: עֹלְלֵיהֶם
  choice: उनके छोटे बच्चे
  rationale: עולל बहुत छोटे बच्चों के लिए प्रयुक्त होता है; 'छोटे बच्चे' सहज है और अर्थ को केवल नवजात शिशुओं तक सीमित नहीं करता।
- source_word: יְרֻטָּשׁוּ
  choice: पटककर टुकड़े-टुकड़े कर दिए जाएँगे
  rationale: निष्क्रिय क्रिया की कठोर हिंसा को बिना नरम किए स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהָרִיּוֹתָיו
  choice: उनकी गर्भवती स्त्रियों
  rationale: मसोराई रूप में प्रत्यय रूपात्मक रूप से एकवचन है, किंतु सामरिया के सामूहिक निवासियों और पहले आए बहुवचन के संदर्भ में हिन्दी में बहुवचन संबंध स्वाभाविक है।
- source_word: יְבֻקָּעוּ
  choice: पेट चीर दिए जाएँगे
  rationale: בקע का निष्क्रिय रूप यहाँ युद्ध में गर्भवती स्त्रियों को चीर डालने की स्पष्ट हिंसा बताता है; हिन्दी में 'पेट चीर दिए जाएँगे' आशय को बिना व्यंजना के रखता है।
theological_decisions:
- issue: सामरिया का स्त्रीलिंग मानवीकरण और आगे बहुवचन
  choice: पहले सामरिया को स्त्रीलिंग एकवचन रूप में प्रस्तुत किया गया, फिर उसके निवासियों के लिए बहुवचन रखा गया।
  alternative: सभी सर्वनामों को एकवचन रखना या मानवीकरण को हटा देना।
  rationale: इब्रानी में सामरिया स्त्रीलिंग इकाई के रूप में दोष वहन करती है, जबकि आगे बहुवचन क्रियाएँ और बच्चों का बहुवचन नगर के लोगों की ओर संकेत करते हैं।
- issue: न्याय-वाणी में भीषण हिंसा
  choice: हिंसक विवरण को मुख्य पाठ में स्पष्ट रूप से बनाए रखा गया।
  alternative: पाठ को कम कठोर बनाने के लिए हिंसा को शिष्टोक्ति में कहना।
  rationale: मूल पाठ जानबूझकर अत्यंत कठोर है; उसे नरम करना भविष्यद्वाणी के नैतिक और भावात्मक भार को बदल देगा।
- issue: תֶּאְשַׁם में दोष और दंड का संबंध
  choice: '''अपने दोष का फल भोगेगी'' द्वारा अपराध और उसके परिणाम दोनों को रखा गया।'
  alternative: '''दोषी ठहरेगी'' या ''अपने अपराध का दंड पाएगी''।'
  rationale: क्रिया दोषी होने, दोषी ठहरने या दोष का परिणाम सहने का भाव दे सकती है। मुख्य पाठ संदर्भानुकूल है, जबकि पादटिप्पणी वास्तविक शब्दार्थगत विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। मूल की कठोरता को बनाए रखा गया है। 'भोगेगी', 'मारे जाएँगे' और 'पेट चीर दिए जाएँगे' स्वाभाविक हिन्दी देते हैं, जबकि पादटिप्पणियाँ प्रमुख शब्दार्थगत अस्पष्टताएँ सुरक्षित रखती हैं।
