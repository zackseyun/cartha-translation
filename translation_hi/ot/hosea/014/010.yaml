reference: Hosea 14:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ֤י חָכָם֙ וְ/יָ֣בֵֽן אֵ֔לֶּה נָב֖וֹן וְ/יֵֽדָעֵ֑/ם כִּֽי יְשָׁרִ֞ים דַּרְכֵ֣י יְהוָ֗ה וְ/צַדִּקִים֙ יֵ֣לְכוּ בָ֔/ם וּ/פֹשְׁעִ֖ים יִכָּ֥שְׁלוּ בָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/010.yaml
  text: Who is wise? Let him understand these things[a]. Who is discerning? Let him know them. For the ways of Yahweh are straight, and the righteous walk in them[b], but transgressors stumble in them.
translation:
  language: hi
  text: कौन बुद्धिमान है? वह इन बातों को समझे। कौन विवेकी है? वह इन्हें जाने। क्योंकि याहवे के मार्ग सीधे[a] हैं; धर्मी उन पर चलते हैं, पर विद्रोही[b] उन्हीं पर ठोकर खाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सच्चे” अथवा “उचित”।
    reason: יְשָׁרִים नैतिक रूप से सही या खरे होने का अर्थ भी दे सकता है, यद्यपि ‘सीधे’ मार्ग-रूपक को अधिक स्पष्ट रखता है।
  - marker: b
    text: या, “अपराधी।”
    reason: פֹשְׁעִים विद्रोह करने वालों या जानबूझकर सीमा लाँघने वाले अपराधियों को सूचित कर सकता है।
lexical_decisions:
- source_word: מִי חָכָם
  choice: कौन बुद्धिमान है?
  rationale: इब्रानी की आलंकारिक प्रश्न-रचना और חָכָם के गुणसूचक अर्थ को सीधे और स्वाभाविक हिंदी में रखा गया है।
- source_word: וְיָבֵן אֵלֶּה
  choice: वह इन बातों को समझे
  rationale: अपूर्ण क्रिया का उपदेशात्मक/कामनार्थक बल ‘समझे’ से व्यक्त होता है; ‘इन बातों’ का संकेत होशे के संदेश की ओर है।
- source_word: נָבוֹן וְיֵדָעֵם
  choice: कौन विवेकी है? वह इन्हें जाने।
  rationale: נָבוֹן को ‘विवेकी’ कहने से חָכָם से उसका निकट संबंध बना रहता है, पर अनावश्यक पुनरुक्ति नहीं होती; ידע का व्यापक अर्थ ‘जानना’ सुरक्षित है।
- source_word: יְשָׁרִים דַּרְכֵי יְהוָה
  choice: याहवे के मार्ग सीधे हैं
  rationale: ‘सीधे’ नैतिक शुद्धता के साथ मार्ग, चलने और ठोकर खाने की पूरी रूपक-श्रृंखला को बनाए रखता है; याहवे व्यक्तिगत ईश्वरीय नाम का लिप्यंतरण है।
- source_word: וְצַדִּקִים יֵלְכוּ בָם
  choice: धर्मी उन पर चलते हैं
  rationale: ‘धर्मी’ substantival adjective का संक्षिप्त और प्रतिष्ठित हिंदी रूप है; ‘उन पर चलते हैं’ मार्ग-रूपक को स्वाभाविक हिंदी में रखता है।
- source_word: וּפֹשְׁעִים יִכָּשְׁלוּ בָם
  choice: पर विद्रोही उन्हीं पर ठोकर खाते हैं
  rationale: פֹשְׁעִים में केवल सामान्य गलती नहीं, बल्कि अधिकार-विरोधी अपराध या विद्रोह का भाव है। ‘उन्हीं पर’ दोहराए गए בָם को स्पष्ट करता है और एक ही मार्ग पर विपरीत परिणाम दिखाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: आरंभिक पुल्लिंग एकवचन रूपों का सामान्य संदर्भ
  choice: कौन बुद्धिमान है? वह…; कौन विवेकी है? वह…
  alternative: जो बुद्धिमान हों, वे…
  rationale: मूल की एकवचन आलंकारिक प्रश्न-शैली को बनाए रखा गया है। हिंदी में यह रचना सामान्य मानवीय संदर्भ में स्वाभाविक रूप से समझी जाती है।
- issue: याहवे के मार्गों का नैतिक और रूपकात्मक वर्णन
  choice: सीधे
  alternative: सच्चे; खरे; उचित
  rationale: יְשָׁרִים नैतिक उचितता बताता है, पर पद में मार्ग, चलना और ठोकर खाना साथ आते हैं। ‘सीधे’ दोनों स्तरों को खुला रखता है।
- issue: एक ही मार्ग पर धर्मियों और विद्रोहियों की विपरीत प्रतिक्रिया
  choice: धर्मी उन पर चलते हैं, पर विद्रोही उन्हीं पर ठोकर खाते हैं
  alternative: धर्मी उनके अनुसार चलते हैं, पर अपराधी उनके कारण गिरते हैं
  rationale: בָם का स्थानीय/रूपकात्मक अर्थ ‘उन पर’ रखा गया है। पाठ यह नहीं बताता कि मार्ग स्वयं गिरने का दोषी है; अतः ‘उनके कारण’ जैसी कारणात्मक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिंदी का संक्षिप्त, गरिमापूर्ण और ज्ञान-साहित्य के अनुरूप प्रश्नात्मक लहजा रखा गया है। ‘मार्ग—चलना—ठोकर खाना’ रूपक को अक्षुण्ण रखते हुए वाक्य सामान्य पाठक के लिए सहज बनाया गया है।
