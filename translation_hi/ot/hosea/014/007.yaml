id: HOS.14.7
reference: Hosea 14:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יֵֽלְכוּ֙ יֹֽנְקוֹתָ֔י/ו וִ/יהִ֥י כַ/זַּ֖יִת הוֹד֑/וֹ וְ/רֵ֥יחַֽ ל֖/וֹ כַּ/לְּבָנֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/007.yaml
  text: Its shoots will spread out[a], and its splendor will be like the olive tree[b], and its fragrance like Lebanon.
translation:
  language: hi
  text: उसकी कोपलें फैलेंगी[a]; उसका वैभव जैतून के वृक्ष के समान होगा[b], और उसकी सुगंध लबानोन के समान होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी टहनियाँ निकलेंगी” अथवा “उसके नए अंकुर फैलेंगे।” इब्रानी क्रिया का शाब्दिक अर्थ “जाना” है, पर यहाँ उसका भाव बाहर की ओर बढ़ना है।
    reason: lexical_alternative
  - marker: b
    text: या “उसकी शोभा” अथवा “उसका प्रताप।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: फैलेंगी
  rationale: क्रिया का मूल अर्थ ‘चलना/जाना’ है, पर पौधे की कोपलों के संदर्भ में यह उनके बाहर की ओर बढ़ने या फैलने को व्यक्त करती है।
- source_word: יֹנְקוֹתָיו
  choice: उसकी कोपलें
  rationale: यह संज्ञा पौधे से निकलने वाली नई, पोषण लेने वाली टहनियों या अंकुरों को सूचित करती है; ‘कोपलें’ आधुनिक हिन्दी में स्वाभाविक और काव्यात्मक है।
- source_word: וִיהִי
  choice: होगा
  rationale: यह रूप पुनर्स्थापना के भावी वर्णन को आगे बढ़ाता है; हिन्दी में सामान्य भविष्यकाल उपयुक्त है।
- source_word: כַזַּיִת
  choice: जैतून के वृक्ष के समान
  rationale: तुलना को स्पष्ट रखते हुए ‘जैतून का वृक्ष’ हिन्दी में स्वाभाविक वनस्पति-संज्ञा है।
- source_word: הוֹדוֹ
  choice: उसका वैभव
  rationale: शब्द में शोभा, प्रताप और महिमा का अर्थ-क्षेत्र है; ‘वैभव’ ऊँची काव्यात्मक शैली और दृश्य शोभा दोनों को बनाए रखता है।
- source_word: וְרֵיחַ לוֹ
  choice: और उसकी सुगंध
  rationale: शाब्दिक रचना ‘और उसके लिए गंध’ है, पर सन्दर्भ में स्वाभाविक हिन्दी संबंधसूचक रूप ‘उसकी सुगंध’ है।
- source_word: כַלְּבָנוֹן
  choice: लबानोन के समान
  rationale: यह स्थान-नाम अपने प्रसिद्ध वनों और उनकी सुगंध का बिंब जगाता है; मूल उपमा को सीधे बनाए रखा गया है।
theological_decisions:
- issue: तीसरे पुरुष एकवचन प्रत्ययों का संदर्भ
  choice: ‘उसकी/उसका’ द्वारा पुनर्स्थापित इस्राएल को पौधे के रूपक में संदर्भित किया गया है।
  alternative: प्रत्ययों को किसी पुरुष व्यक्ति के अधिक प्रत्यक्ष संदर्भ की तरह प्रस्तुत करना।
  rationale: इब्रानी प्रत्यय व्याकरणतः पुल्लिंग एकवचन हैं, पर निकटवर्ती सन्दर्भ में पुनर्स्थापित समुदाय को फलते-फूलते पौधे के रूप में चित्रित किया गया है। हिन्दी के पुल्लिंग ‘उसका/उसकी’ रूप इस वास्तविक अस्पष्टता को अनावश्यक रूप से हल किए बिना स्वाभाविक रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘कोपलें फैलेंगी’ वनस्पति-बिंब को सहज बनाता है; ‘वैभव’ הוֹד की शोभा और प्रताप की अर्थगत व्यापकता को बनाए रखता है। स्थान-नाम को ‘लबानोन’ रूप में लिप्यंतरित किया गया है।
