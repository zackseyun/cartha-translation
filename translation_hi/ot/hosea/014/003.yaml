  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קְח֤וּ עִמָּ/כֶם֙ דְּבָרִ֔ים וְ/שׁ֖וּבוּ אֶל יְהוָ֑ה אִמְר֣וּ אֵלָ֗י/ו כָּל תִּשָּׂ֤א עָוֺן֙ וְ/קַח ט֔וֹב וּֽ/נְשַׁלְּמָ֥ה פָרִ֖ים שְׂפָתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/003.yaml
  text: Take words with you and return to Yahweh[a]. Say to him, “Take away all iniquity and receive what is good[b], and we will repay with the fruit of our lips.”
translation:
  language: hi
  text: अपने साथ वचन लेकर याहवे के पास लौट आओ। उससे कहो, “हमारा सारा अधर्म दूर कर दे[a] और जो अच्छा है उसे स्वीकार कर; और हम अपने होंठों के बैल अर्पित करेंगे।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी मुहावरे का अर्थ “हमारा सारा दोष क्षमा कर दे” भी हो सकता है; शाब्दिक चित्र दोष को उठाकर दूर ले जाने का है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “हमारे होंठों के बैल” है—अर्थात बोले गए स्तुतिगान, अंगीकार या मन्नतें, जो बलिदान के समान चढ़ाई जाती हैं। कुछ प्राचीन साक्ष्य और व्याख्याएँ इसे “अपने होंठों का फल” समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: קְחוּ עִמָּכֶם דְּבָרִים
  choice: अपने साथ वचन लेकर
  rationale: दְּבָרִים का मूल अर्थ ‘शब्द/वचन’ है; यहाँ ये पश्चाताप और प्रार्थना के वचन हैं। ‘अपने साथ ... लेकर’ इब्रानी रचना के साथ स्वाभाविक हिन्दी है।
- source_word: וְשׁוּבוּ אֶל יְהוָה
  choice: याहवे के पास लौट आओ
  rationale: שׁוב में लौटने की गति और वाचा-संबंधी पश्चाताप, दोनों निहित हैं। याहवे व्यक्तिगत ईश्वरीय नाम יהוה को दर्शाता है।
- source_word: כָּל תִּשָּׂא עָוֹן
  choice: हमारा सारा अधर्म दूर कर दे
  rationale: נשא עון दोष या अधर्म को उठा ले जाने और इस प्रकार क्षमा करने का इब्रानी मुहावरा है। ‘दूर कर दे’ चित्र और आशय दोनों को स्पष्ट रखता है; प्रार्थना के वक्ताओं को सूचित करने के लिए ‘हमारा’ प्रसंग से लिया गया है।
- source_word: וְקַח טוֹב
  choice: और जो अच्छा है उसे स्वीकार कर
  rationale: यह संक्षिप्त और कुछ हद तक संदिग्ध पदबंध है। प्रार्थना के संदर्भ में קח को ‘स्वीकार कर’ कहना स्वाभाविक है, जबकि ‘जो अच्छा है’ טוב की अस्पष्टता को बनाए रखता है।
- source_word: וּנְשַׁלְּמָה פָרִים שְׂפָתֵינוּ
  choice: तब हम अपने होंठों के बैल भेंट करेंगे
  rationale: मसोरा-पाठ के ‘हमारे होंठों के बैल’ वाले जीवंत बलिदानी रूपक को मुख्य पाठ में रखा गया है। שלם का यहाँ भाव चढ़ाने या अदा करने का है; हिन्दी में ‘भेंट करेंगे’ उस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; लिप्यंतरण उसे सामान्य उपाधि में नहीं बदलता।
- issue: שׁוב में पश्चाताप का भाव
  choice: लौट आओ
  alternative: फिर जाओ; मन फिराओ
  rationale: ‘लौट आओ’ शारीरिक दिशा के रूपक और परमेश्वर की ओर पश्चातापपूर्ण वापसी, दोनों को सुरक्षित रखता है।
- issue: פָרִים שְׂפָתֵינוּ का बलिदानी रूपक
  choice: अपने होंठों के बैल
  alternative: अपने होंठों का फल
  rationale: मसोरा-पाठ का कठिन किंतु अर्थपूर्ण रूपक मुख्य पाठ में सुरक्षित है; प्राचीन साक्ष्यों से जुड़ा अधिक परिचित पाठांतर पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामूहिक उपदेशात्मक लहजा रखा गया है। कठिन इब्रानी बलिदानी रूपक को सपाट किए बिना पादटिप्पणी से स्पष्ट किया गया है।
