base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/006.yaml
  text: I will be like the dew to Israel[a]; he will blossom like the lily[b], and he will strike his roots like Lebanon.
translation:
  language: hi
  text: मैं इस्राएल[a] के लिए ओस के समान होऊँगा; वह सोसन के समान खिलेगा और लबानोन के समान अपनी जड़ें जमाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘इस्राएल’ को एक सामूहिक एकवचन के रूप में प्रस्तुत किया गया है; इसलिए आगे ‘वह’ और एकवचन क्रियाएँ आई हैं।
    reason: lexical_alternative
  - marker: b
    text: लबानोन दृढ़ता और भव्यता का बिंब प्रस्तुत करता है—संभवतः वहाँ के प्रसिद्ध, गहरी जड़ों वाले वृक्षों के कारण। इब्रानी पाठ में ‘देवदार’ शब्द स्पष्ट रूप से नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: אֶהְיֶה
  choice: मैं ... होऊँगा
  rationale: היה का प्रथम पुरुष एकवचन अपूर्ण रूप इस प्रतिज्ञा के संदर्भ में स्वाभाविक रूप से भविष्यकाल व्यक्त करता है।
- source_word: כַטַּל
  choice: ओस के समान
  rationale: उपसर्ग כ तुलना व्यक्त करता है; ‘ओस’ जीवन देने वाली नमी के कृषि-बिंब को बनाए रखता है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल के लिए
  rationale: ל यहाँ लाभ या संबंध का भाव देता है; हिन्दी में ‘के लिए’ इस प्रतिज्ञा का आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִפְרַח
  choice: वह ... खिलेगा
  rationale: पुल्लिंग एकवचन क्रिया सामूहिक एकवचन ‘इस्राएल’ से संबंधित है; ‘खिलेगा’ अगले पुष्प-बिंब को स्पष्ट रूप से बनाए रखता है।
- source_word: כַשּׁוֹשַׁנָּה
  choice: सोसन के समान
  rationale: שׁוֹשַׁנָּה एक लिली-प्रकार के फूल को सूचित करता है; ‘सोसन’ हिन्दी बाइबलीय और काव्यात्मक प्रयोग में इस पुष्प-बिंब को संक्षेप में बनाए रखता है।
- source_word: וְיַךְ שָׁרָשָׁיו
  choice: अपनी जड़ें जमाएगा
  rationale: נכה का हिफ़ील रूप जड़ों को दृढ़ता से स्थापित करने का कारणात्मक भाव देता है। ‘अपनी जड़ें जमाएगा’ स्वाभाविक हिन्दी है और तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय को भी सुरक्षित रखता है।
- source_word: כַלְּבָנוֹן
  choice: लबानोन के समान
  rationale: मूल पाठ केवल लबानोन का नाम लेता है, देवदारों का नहीं; इसलिए स्थान और उसके दृढ़ता-भव्यता के संकेत को बिना विस्तार जोड़े रखा गया है।
theological_decisions:
- issue: इस्राएल के लिए एकवचन क्रियाओं और सर्वनाम का संदर्भ
  choice: इस्राएल को सामूहिक एकवचन मानते हुए ‘वह ... खिलेगा’ और ‘अपनी जड़ें जमाएगा’ रखा गया है।
  alternative: भाव के अनुसार बहुवचन ‘वे ... खिलेंगे’ अथवा निर्जीव एकवचन रूप अपनाया जा सकता था।
  rationale: इब्रानी पाठ इस्राएल के लिए पुल्लिंग एकवचन क्रिया और प्रत्यय का प्रयोग करता है; हिन्दी में यह व्यक्तिगत-सामूहिक काव्य-बिंब स्वाभाविक रूप से सुरक्षित रह सकता है।
- issue: लबानोन का बिंब
  choice: तुलना को सीधे ‘लबानोन के समान’ रखा गया है।
  alternative: इसे व्याख्यात्मक रूप से ‘लबानोन के देवदारों के समान’ कहा जा सकता था।
  rationale: मूल पाठ देवदारों का स्पष्ट उल्लेख नहीं करता; उन्हें मुख्य पाठ में जोड़ना वास्तविक काव्यात्मक व्यापकता को अनावश्यक रूप से सीमित कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘सोसन’ पुष्प-बिंब को संक्षिप्त रखता है, जबकि ‘अपनी जड़ें जमाएगा’ इब्रानी कारणात्मक रचना का स्वाभाविक हिन्दी रूप है।
