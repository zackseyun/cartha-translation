source:
  edition: WLC
  text: יָשֻׁ֨בוּ֙ יֹשְׁבֵ֣י בְ/צִלּ֔/וֹ יְחַיּ֥וּ דָגָ֖ן וְ/יִפְרְח֣וּ כַ/גָּ֑פֶן זִכְר֖/וֹ כְּ/יֵ֥ין לְבָנֽוֹן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/008.yaml
  text: Those who dwell in his shade will return[a]; they will revive like grain and blossom like the vine[b]; his renown will be like the wine of Lebanon.
translation:
  language: hi
  text: उसकी छाया में रहनेवाले लौट आएँगे; वे अनाज के समान फिर जी उठेंगे[a] और अंगूर की बेल के समान फूलेंगे; उसकी ख्याति[b] लबानोन के दाखरस के समान होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस संक्षिप्त इब्रानी वाक्यांश का अनुवाद ‘वे फिर अनाज उगाएँगे’ या ‘वे अनाज से फिर जीवित होंगे’ भी हो सकता है। इसमें अनाज के फिर अंकुरित होने या भरपूर उपज होने की छवि निहित हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसकी ख्याति’ का अनुवाद ‘उसका स्मरण’ भी हो सकता है; प्रसंग में कम सम्भावित अर्थ ‘उसकी [अर्थात वस्तु की] ख्याति’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֻׁבוּ
  choice: लौट आएँगे
  rationale: שׁוב का सामान्य अर्थ ‘लौटना’ है। अपूर्ण रूप यहाँ आनेवाली बहाली को व्यक्त करता है; ‘लौट आएँगे’ आधुनिक हिन्दी में स्वाभाविक है और पुनर्स्थापन का भाव बनाए रखता है।
- source_word: יֹשְׁבֵי בְצִלּוֹ
  choice: उसकी छाया में रहनेवाले
  rationale: कृदन्त יֹשְׁבֵי संज्ञा के रूप में ‘रहनेवाले’ है। צֵל यहाँ सुरक्षा और आशीष की काव्यात्मक छवि है; एकवचन पुल्लिंग प्रत्यय को ‘उसकी’ से सुरक्षित रखा गया है।
- source_word: יְחַיּוּ דָגָן
  choice: वे अनाज के समान फिर जी उठेंगे
  rationale: חיה के पिएल रूप में ‘जीवित करना/फिर जिलाना’ का भाव है, पर דָגָן के साथ वाक्यांश अत्यंत संक्षिप्त और अर्थगत रूप से खुला है। अगले समानांतर उपवाक्य को देखते हुए ‘के समान’ स्पष्टता के लिए जोड़ा गया है और उगते अनाज जैसी नई सजीवता का चित्र सामने आता है। अन्य सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: וְיִפְרְחוּ כַגָּפֶן
  choice: और दाखलता के समान फूलेंगे
  rationale: פרח का अर्थ ‘फूलना/लहलहाना’ है और כַגָּפֶן स्पष्ट उपमा देता है। ‘दाखलता’ कृषि-चित्र और दाखरस से जुड़ी अगली पंक्ति दोनों को बनाए रखती है।
- source_word: זִכְרוֹ
  choice: उसकी ख्याति
  rationale: זֵכֶר स्मरण, याद या ख्याति का अर्थ दे सकता है। लबानोन के प्रसिद्ध दाखरस से तुलना के प्रसंग में ‘ख्याति’ सबसे स्वाभाविक है, जबकि अर्थ की अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: כְּיֵין לְבָנוֹן
  choice: लबानोन के दाखरस के समान
  rationale: यह सीधी उपमा है। ‘दाखरस’ יַיִן का सहज, गरिमापूर्ण हिन्दी रूप है और ‘लबानोन’ स्थान-संबंधी विशेषता को बनाए रखता है।
theological_decisions:
- issue: ‘उसकी छाया’ और ‘उसकी ख्याति’ में एकवचन पुल्लिंग प्रत्ययों का संकेत
  choice: दोनों स्थानों पर ‘उसकी’ रखकर इब्रानी के एकवचन पुल्लिंग रूप को बनाए रखा गया है, बिना उसके संकेत को निर्णायक रूप से निर्धारित किए।
  alternative: इसे व्यक्तिरूप में इस्राएल, एप्रैम, या सामूहिक रूप से बहाल की गई प्रजा के लिए समझना; अथवा हिन्दी में बहुवचन ‘उनकी’ करना।
  rationale: तात्कालिक काव्य-संदर्भ बहाल किए गए इस्राएल को व्यक्तिरूप में प्रस्तुत करता है, पर ठीक संकेतित पात्र को स्पष्ट नहीं करता। ‘उसकी’ व्याकरणिक रूप और धर्मवैचारिक-काव्यात्मक तनाव दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यवाणी-काव्य की गरिमा बनाए रखती है। ‘छाया’, ‘अनाज’, ‘दाखलता’ और ‘दाखरस’ के कृषि एवं सुरक्षा-संबंधी बिंबों को यथासम्भव प्रत्यक्ष रखा गया है। इब्रानी की संक्षिप्तता जहाँ हिन्दी में भ्रमकारी होती, वहाँ समानांतरता के आधार पर न्यूनतम स्पष्टता जोड़ी गई है।
