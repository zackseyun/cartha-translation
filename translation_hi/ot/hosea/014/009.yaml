  text: אֶפְרַ֕יִם מַה לִּ֥/י ע֖וֹד לָֽ/עֲצַבִּ֑ים אֲנִ֧י עָנִ֣יתִי וַ/אֲשׁוּרֶ֗/נּוּ אֲנִי֙ כִּ/בְר֣וֹשׁ רַֽעֲנָ֔ן מִמֶּ֖/נִּי פֶּרְיְ/ךָ֥ נִמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/009.yaml
  text: Ephraim—what have I to do anymore with idols? I have answered him and will look after him[a]. I am like a flourishing cypress[c][b]; from me your fruit is found.
translation:
  language: hi
  text: हे एप्रैम, अब मूर्तियों से मेरा क्या लेना-देना? मैंने उसे उत्तर दिया है और उसकी देखभाल करूँगा।[a] मैं हरे-भरे सरू के समान हूँ; मुझसे ही तेरा फल मिलता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या आरंभिक वाक्य एप्रैम की स्वीकारोक्ति हो सकता है: “एप्रैम कहता है, ‘अब मूर्तियों से मेरा क्या लेना-देना?’” इब्रानी में वक्ता स्पष्ट नहीं है। “उसकी देखभाल करूँगा” का अनुवाद “उस पर दृष्टि रखूँगा” या “उसकी परवाह करूँगा” भी हो सकता है।'
    reason: alternative_reading_and_lexical_alternative
  - marker: b
    text: “सरू” के लिए प्रयुक्त इब्रानी शब्द किसी सदाबहार वृक्ष को दर्शाता है; उसकी सटीक प्रजाति निश्चित नहीं है। अंतिम वाक्य का अधिक शाब्दिक अनुवाद है, “मुझसे तेरा फल पाया जाता है।”
    reason: botanical_uncertainty_and_lexical_alternative
lexical_decisions:
- source_word: מַה לִּי עוֹד לָעֲצַבִּים
  choice: अब मूर्तियों से मेरा क्या लेना-देना?
  rationale: मुहावरा מַה לִּי अलगाव या संबंध-विच्छेद व्यक्त करता है; עוֹד को ‘अब’ से स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: עָנִיתִי
  choice: मैंने उसकी सुन ली है
  rationale: ענה यहाँ ‘उत्तर देना/प्रत्युत्तर देना’ है। ‘उसकी सुन ली है’ हिंदी में उत्तर और अनुकूल प्रत्युत्तर—दोनों का स्वाभाविक भाव देता है, बिना इसे दुःख देने वाले अर्थ से जोड़ने के।
- source_word: וַאֲשׁוּרֶנּוּ
  choice: और मैं उसकी देखभाल करूँगा
  rationale: क्रिया का अर्थ ध्यान से देखना, परवाह करना या निगरानी रखना हो सकता है। प्रसंग में ‘देखभाल करूँगा’ परमेश्वर के सावधान ध्यान को सहज हिंदी में व्यक्त करता है।
- source_word: כִּבְרוֹשׁ רַעֲנָן
  choice: हरे-भरे सनौवर के समान
  rationale: בְּרוֹשׁ की वनस्पति-पहचान पूरी तरह निश्चित नहीं; ‘सनौवर’ पारंपरिक और समझने योग्य वृक्ष-नाम है। רַעֲנָן की ताजगी और समृद्ध हरियाली ‘हरे-भरे’ से व्यक्त होती है।
- source_word: מִמֶּנִּי פֶּרְיְךָ נִמְצָא
  choice: मुझसे ही तेरा फल मिलता है
  rationale: נמצא का शाब्दिक अर्थ ‘पाया जाता है’ है; ‘मिलता है’ आधुनिक हिंदी में स्वाभाविक रहते हुए इस बात पर बल देता है कि एप्रैम के फल का स्रोत परमेश्वर है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण; यहाँ उत्तरी राज्य के व्यक्तिरूप का संबोधन है।
- source_word: עֲצַבִּים
  choice: मूर्तियाँ
  rationale: भविष्यद्वाणी के प्रसंग में यह शब्द उपासना की मूर्तियों को सूचित करता है; ‘मूर्तियाँ’ सामान्य आधुनिक हिंदी में स्पष्ट है।
theological_decisions:
- issue: आरंभिक वाक्य का वक्ता
  choice: 'मुख्य पाठ में इसे यहोवा के कथन के रूप में रखा गया है: ‘हे एप्रैम, ... मेरा क्या लेना-देना?’'
  alternative: 'इसे एप्रैम की स्वीकारोक्ति समझा जा सकता है: ‘एप्रैम कहता है, “अब मूर्तियों से मेरा क्या लेना-देना?”’'
  rationale: इब्रानी में स्पष्ट कथन-सूचक पद नहीं है। आगे के प्रथम-पुरुष वाक्य दिव्य वाणी का समर्थन करते हैं, पर एप्रैम को वक्ता मानने की वास्तविक व्याकरणिक-संदर्भगत संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- issue: वृक्ष की पहचान
  choice: सनौवर
  alternative: सरू या देवदार जैसे सदाबहार वृक्ष
  rationale: בְּרוֹשׁ की सटीक प्रजाति विवादित है। मुख्य पाठ में पारंपरिक वृक्ष-नाम रखा गया है और अनिश्चितता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में सहज रखी गई है। ‘हे एप्रैम’ संबोधन को स्पष्ट करता है, जबकि वक्ता-संबंधी वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है। सर्वनाम ‘तेरा/उसकी’ एकवचन व्यक्तिरूप एप्रैम के अनुरूप हैं।
