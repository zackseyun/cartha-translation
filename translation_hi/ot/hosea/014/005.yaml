  text: אֶרְפָּא֙ מְשׁ֣וּבָתָ֔/ם אֹהֲבֵ֖/ם נְדָבָ֑ה כִּ֛י שָׁ֥ב אַפִּ֖/י מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/005.yaml
  text: I will heal their apostasy; I will love them freely[a], for my anger has turned away from them.
translation:
  language: hi
  text: मैं उनकी भटकन का उपचार करूँगा; मैं उनसे स्वेच्छा से प्रेम करूँगा, क्योंकि मेरा क्रोध उस पर से[a] हट गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उस पर से’ है; कुछ अनुवाद पहले आए बहुवचन के अनुरूप ‘उन पर से’ करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרְפָּא
  choice: मैं चंगा करूँगा
  rationale: रפא का सामान्य अर्थ ‘चंगा करना’ है। यह नैतिक और आत्मिक पुनर्स्थापना के रूपक को बनाए रखता है।
- source_word: מְשׁוּבָתָם
  choice: उनके विश्वासघात को
  rationale: מְשׁוּבָה यहाँ वाचा से फिर जाने या विद्रोह का भाव रखता है। ‘विश्वासघात’ साधारण पाठक के लिए स्पष्ट है और होशे की वाचागत पृष्ठभूमि के अनुकूल है।
- source_word: אֹהֲבֵם
  choice: मैं उनसे प्रेम करूँगा
  rationale: אהב का सीधा अर्थ ‘प्रेम करना’ है और प्रत्यय बहुवचन कर्म को दर्शाता है। हिंदी में ‘उनसे प्रेम करूँगा’ स्वाभाविक प्रयोग है।
- source_word: נְדָבָה
  choice: स्वेच्छा से
  rationale: यह शब्द स्वेच्छा, तत्परता अथवा मुक्त भाव से दिए जाने का अर्थ रखता है। ‘स्वेच्छा से’ परमेश्वर के प्रेम के अबाध और अनिवार्य न किए गए स्वरूप को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले वचनों का आधार बताने वाला कारणसूचक संयोजक है।
- source_word: שָׁב
  choice: हट गया है
  rationale: שׁוּב यहाँ क्रोध के लौट जाने या दूर हो जाने को व्यक्त करता है; ‘हट गया है’ हिंदी में इस भाव को स्पष्ट और सहज रूप से देता है।
- source_word: אַפִּי
  choice: मेरा क्रोध
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ हो सकता है, पर यहाँ यह स्थापित मुहावरे के अनुसार ‘क्रोध’ है।
- source_word: מִמֶּנּוּ
  choice: उस पर से
  rationale: मसोरेटिक रूप में प्रत्यय तीसरे पुरुष एकवचन पुल्लिंग है। इसलिए पहले आए बहुवचन के बाद भी संख्या-परिवर्तन को मुख्य पाठ में सुरक्षित रखा गया है।
theological_decisions:
- issue: अंतिम सर्वनाम में बहुवचन से एकवचन का परिवर्तन
  choice: मसोरेटिक एकवचन के अनुसार ‘उस पर से’
  alternative: संदर्भगत सामंजस्य के लिए ‘उन पर से’
  rationale: इब्रानी पाठ पहले बहुवचन प्रत्ययों के बाद מִמֶּנּוּ में एकवचन पर आता है। इसे बहुवचन में समतल करने के बजाय मूल पाठ का तनाव मुख्य पाठ में रखा गया और प्रचलित सामंजस्यकारी अनुवाद पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली। ‘विश्वासघात’ वाचा से फिरने का भाव स्पष्ट करता है; अंतिम एकवचन को मूल इब्रानी के अनुसार जानबूझकर सुरक्षित रखा गया है।
