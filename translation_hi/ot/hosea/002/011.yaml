base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/011.yaml
  text: Therefore I will return and take back my grain in its time[a], and my new wine in its season; and I will take away my wool and my flax[b], which were to cover her nakedness.
translation:
  language: hi
  text: इसलिए मैं लौटूँगा और अपना अनाज उसके समय पर, और अपना नया दाखमधु उसके नियत समय पर वापस ले लूँगा; और अपनी ऊन और अपना सन, जो उसकी नग्नता[a] ढकने के लिए थे, उससे छीन लूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘उसकी नग्नता’ है; अनावृत होने से जुड़ी लज्जा का भाव भी इसमें हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उससे हटा लूँगा’; इब्रानी क्रिया अचानक या बलपूर्वक छीन लेने का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले आरोपों के परिणामस्वरूप आने वाले न्याय की ओर स्पष्ट संक्रमण दिखाता है।
- source_word: אָשׁוּב וְלָקַחְתִּי
  choice: मैं लौटकर…वापस ले लूँगा
  rationale: שוב का लौटने का भाव और לקח के संदर्भगत पुनर्ग्रहण—पहले दी हुई उपज को वापस लेने—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: דְגָנִי
  choice: अपना अनाज
  rationale: דגן सामान्य रूप से अन्न अथवा अनाज की उपज को दर्शाता है; ‘अनाज’ आधुनिक हिन्दी में सहज और व्यापक है।
- source_word: בְּעִתּוֹ
  choice: उसके ठीक समय पर
  rationale: पुल्लिंग एकवचन प्रत्यय का संबंध अनाज से रखते हुए उसकी उचित उपज-अवधि का समयगत भाव सुरक्षित रखा गया है।
- source_word: תִירוֹשִׁי
  choice: अपना नया दाखमधु
  rationale: תירוש अंगूर की नई अथवा ताज़ी उपज से बने पेय को दर्शाता है; ‘नया दाखमधु’ कृषि-संदर्भ और ‘नया’ होने की विशेषता दोनों रखता है।
- source_word: בְּמוֹעֲדוֹ
  choice: उसके नियत समय पर
  rationale: מועד में निश्चित अथवा ठहराए हुए समय का भाव है और यह पिछले समय-वाक्यांश के समानांतर है।
- source_word: וְהִצַּלְתִּי
  choice: उससे छीन लूँगा
  rationale: נצל के हिफ़ील रूप में यहाँ छुड़ाने के बजाय अचानक अथवा बलपूर्वक हटा लेने का भाव संदर्भानुकूल है; ‘छीन लूँगा’ उस तीव्रता को व्यक्त करता है।
- source_word: צַמְרִי וּפִשְׁתִּי
  choice: अपनी ऊन और अपना सन
  rationale: दोनों को कच्ची सामग्री के रूप में रखा गया है; विशेषतः פשתה को तैयार ‘मलमल/सन का वस्त्र’ न बनाकर ‘सन’ कहा गया है।
- source_word: לְכַסּוֹת אֶת־עֶרְוָתָהּ
  choice: जो उसकी नग्नता ढकने के लिए थे
  rationale: उद्देश्यवाचक infinitive को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है और ठोस अनावृतता की छवि सुरक्षित रखी गई है।
theological_decisions:
- issue: क्या परमेश्वर द्वारा पहले दिए गए उपहारों को पुनः लेने का भाव स्पष्ट किया जाए
  choice: לקח के लिए ‘वापस ले लूँगा’
  alternative: केवल ‘ले लूँगा’
  rationale: आस-पास के संदर्भ में स्त्री ने इन उपजों का श्रेय दूसरे प्रेमियों को दिया है; ‘वापस’ न्यायपूर्ण पुनर्ग्रहण का निहित भाव स्पष्ट करता है, बिना कोई बाहरी सिद्धान्त जोड़े।
- issue: עֶרְוָתָהּ की अनावृतता और लज्जा की छवि को कैसे रखा जाए
  choice: मुख्य पाठ में ‘उसकी नग्नता’
  alternative: ‘उसकी लज्जा’ अथवा ‘उसका नंगापन’
  rationale: ‘नग्नता’ ठोस और जानबूझकर प्रयुक्त भविष्यद्वाणी की छवि को बनाए रखती है; केवल ‘लज्जा’ कहना उस छवि को अमूर्त और मृदु कर देता।
- issue: נצל की क्रिया में हटाने की तीव्रता
  choice: ‘छीन लूँगा’
  alternative: ‘हटा लूँगा’ अथवा ‘वापस ले लूँगा’
  rationale: इस संदर्भ में क्रिया का अर्थ बचाना नहीं, सामग्री को उसके पास से निकाल लेना है। ‘छीनना’ संभव आकस्मिक और बलपूर्ण भाव को रखता है, जबकि पादटिप्पणी नरम विकल्प भी बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भविष्यद्वाणी के न्याय-संबंधी स्वर के अनुरूप रखी गई है। ‘दाखमधु’ और ‘सन’ कृषि-जगत की वस्तुओं के लिए कुछ साहित्यिक, पर सामान्य बाइबलीय पाठकों के लिए बोधगम्य शब्द हैं। समानांतर समय-वाक्यांशों और प्रथम पुरुष स्वामित्व (‘अपना’) को बनाए रखा गया है।
