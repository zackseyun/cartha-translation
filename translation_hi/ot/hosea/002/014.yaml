  text: וַ/הֲשִׁמֹּתִ֗י גַּפְנָ/הּ֙ וּ/תְאֵ֣נָתָ֔/הּ אֲשֶׁ֣ר אָמְרָ֗ה אֶתְנָ֥ה הֵ֨מָּה֙ לִ֔/י אֲשֶׁ֥ר נָֽתְנוּ לִ֖/י מְאַֽהֲבָ֑/י וְ/שַׂמְתִּ֣י/ם לְ/יַ֔עַר וַ/אֲכָלָ֖תַ/ם חַיַּ֥ת הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/014.yaml
  text: And I will lay waste her vine and her fig tree[a], of which she said, ‘These are my wages that my lovers gave me.’ I will make them a forest, and the wild animals of the field will devour them.
translation:
  language: hi
  text: और मैं उसकी अंगूर की बेल और अंजीर के पेड़ को उजाड़ दूँगा, जिनके बारे में उसने कहा, ‘ये मेरी मजदूरी[a] हैं, जो मेरे प्रेमियों ने मुझे दी हैं।’ मैं उन्हें जंगल बना दूँगा, और मैदान के जंगली पशु उन्हें खा जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पारिश्रमिक’; इब्रानी शब्द होशे के बेवफाई के रूपक में वेश्या को मिलने वाली मजदूरी का भाव भी रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: मैं ... उजाड़ दूँगा
  rationale: हिफ़ील रूप किसी वस्तु को उजाड़ या वीरान कर देने का भाव देता है। यह चयन न्याय की तीव्रता बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी है।
- source_word: גַּפְנָהּ וּתְאֵנָתָהּ
  choice: उसकी दाखलता और अंजीर के पेड़
  rationale: दोनों एकवचन कृषि-बिंबों को बनाए रखा गया है; גֶּפֶן के लिए ‘दाखलता’ और תְּאֵנָה के लिए सहज ‘अंजीर का पेड़’ उपयुक्त हैं।
- source_word: אֶתְנָה
  choice: मजदूरी
  rationale: शब्द भुगतान या कमाई का अर्थ रखता है और इस प्रसंग में वेश्यावृत्ति से मिली मजदूरी का संकेत दे सकता है। मुख्य पाठ में ‘मजदूरी’ लेन-देन का भाव सुरक्षित रखता है; विशेष अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: מְאַהֲבָי
  choice: मेरे प्रेमियों
  rationale: यह होशे के व्यभिचार-बिंब में अवैध प्रेमियों को सूचित करता है। ‘प्रेमियों’ सीधा और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְשַׂמְתִּים לְיַעַר
  choice: मैं उन्हें जंगल बना दूँगा
  rationale: खेती की भूमि के उजड़कर वन बन जाने के बिंब को संक्षेप में और मूल संरचना के निकट रखा गया है।
- source_word: וַאֲכָלָתַם חַיַּת הַשָּׂדֶה
  choice: मैदान के जंगली जानवर उन्हें खा जाएँगे
  rationale: पशु कर्ता होने पर אכל का सहज अर्थ ‘खा जाना’ है। ‘मैदान के जंगली जानवर’ सामान्य बाइबलीय अभिव्यक्ति को स्पष्ट आधुनिक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: אֶתְנָה के यौन और वेश्यावृत्ति-संबंधी संकेत को मुख्य पाठ में कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘मजदूरी’ रखा गया है।
  alternative: ‘वेश्या की मजदूरी’ या ‘भाड़ा’
  rationale: होशे के व्यापक प्रसंग में वैवाहिक बेवफाई और वेश्यावृत्ति का रूपक पहले से उपस्थित है। मूल पद में निहित संकेत को ‘मजदूरी’ सुरक्षित रखता है, जबकि ‘वेश्या की मजदूरी’ मुख्य पाठ में व्याख्यात्मक विस्तार कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण स्तर रखा गया है। ‘दाखलता’ बाइबलीय कृषि-बिंब को सटीक रूप से व्यक्त करती है, जबकि वाक्य-विन्यास को अत्यधिक संस्कृतनिष्ठ या पुरातन नहीं बनाया गया।
