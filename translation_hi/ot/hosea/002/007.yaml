language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י זָֽנְתָה֙ אִמָּ֔/ם הֹבִ֖ישָׁה הֽוֹרָתָ֑/ם כִּ֣י אָמְרָ֗ה אֵלְכָ֞ה אַחֲרֵ֤י מְאַהֲבַ/י֙ נֹתְנֵ֤י לַחְמִ/י֙ וּ/מֵימַ֔/י צַמְרִ֣/י וּ/פִשְׁתִּ֔/י שַׁמְנִ֖/י וְ/שִׁקּוּיָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/007.yaml
  text: For their mother has prostituted herself[a]; she who conceived them has acted shamefully. For she said, ‘I will go after my lovers, those who give me my bread and my water, my wool and my flax[d][c][b], my oil and my drink.’
translation:
  language: hi
  text: क्योंकि उनकी माँ ने वेश्यावृत्ति की है[a]; जिसने उन्हें गर्भ में धारण किया, उसने लज्जाजनक व्यवहार किया है[b]। क्योंकि उसने कहा, “मैं अपने प्रेमियों के पीछे जाऊँगी, जो मुझे मेरी रोटी और मेरा पानी, मेरी ऊन और मेरा सन, मेरा तेल और मेरा पेय[c] देते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “व्यभिचारिणी का काम किया है”; इब्रानी में वाचा के प्रति विश्वासघात के लिए स्पष्ट यौन बिंब प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या, “लज्जित किया है”; इब्रानी क्रिया का अर्थ “लज्जाजनक व्यवहार किया है” भी हो सकता है।
    reason: lexical_ambiguity
  - marker: c
    text: या, “मेरे पेय पदार्थ” अथवा “मेरे पीने की सामग्री।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנְתָה
  choice: वेश्यावृत्ति की है
  rationale: यह स्पष्ट यौन बिंब को बनाए रखता है, जिसे होशे वाचा के प्रति विश्वासघात के रूपक के लिए प्रयोग करता है; केवल ‘विश्वासघात किया’ कहना मूल की तीव्रता घटा देता।
- source_word: אִמָּם
  choice: उनकी माँ
  rationale: यह 3 पुरुष बहुवचन प्रत्यय सहित संज्ञा का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: הֹבִישָׁה
  choice: लज्जाजनक काम किया है
  rationale: हिफ़ील रूप यहाँ स्त्रीलिंग एकवचन कर्ता के आचरण का वर्णन करता जान पड़ता है; हिन्दी में यह अर्थ स्वाभाविक है, जबकि किसी और को लज्जित करने की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: הוֹרָתָם
  choice: जिसने उन्हें गर्भ में धारण किया
  rationale: यह הרה से बने रूप का गर्भधारण-संबंधी अर्थ और ‘उनकी माँ’ के साथ काव्यात्मक समानांतरता दोनों बनाए रखता है।
- source_word: אֵלְכָה אַחֲרֵי
  choice: मैं ... के पीछे जाऊँगी
  rationale: यह पीछा करने अथवा किसी के पीछे चलने की रूपकात्मक गति को सहज हिन्दी में व्यक्त करता है।
- source_word: מְאַהֲבַי
  choice: मेरे प्रेमी
  rationale: वैवाहिक रूपक में यह अवैध प्रेम-संबंध रखने वालों को सूचित करता है; ‘प्रेमी’ उस अर्थ को स्पष्ट रखता है।
- source_word: נֹתְנֵי
  choice: जो मुझे ... देते हैं
  rationale: कर्ता के रूप में प्रयुक्त कृदंत को हिन्दी संबंधवाचक उपवाक्य में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: לַחְמִי וּמֵימַי
  choice: मेरी रोटी और मेरा पानी
  rationale: मूल के ठोस, दैनिक जीवन-निर्वाह वाले बिंब सुरक्षित रखे गए हैं।
- source_word: צַמְרִי וּפִשְׁתִּי
  choice: मेरी ऊन और मेरा सन
  rationale: פשתים वस्त्र के बजाय उसके कच्चे पदार्थ ‘सन’ को दर्शाता है, इसलिए अधिक सटीक शब्द चुना गया है।
- source_word: שַׁמְנִי
  choice: मेरा तेल
  rationale: मूल केवल तेल कहता है; ‘जैतून का’ जोड़ना अनावश्यक स्पष्टीकरण होता।
- source_word: שִׁקּוּיָי
  choice: मेरा पेय
  rationale: यह पेय अथवा पेय-आपूर्ति का सामूहिक अर्थ रख सकता है; एकवचन ‘पेय’ हिन्दी में संक्षिप्त और मूल के निकट है।
theological_decisions:
- issue: भविष्यवाणी में विवाह और वाचा-विच्छेद का रूपक
  choice: ‘वेश्यावृत्ति की है’ और ‘मेरे प्रेमी’ द्वारा यौन रूपक को स्पष्ट रखा गया है।
  alternative: इसे नरम करके ‘विश्वासघात किया है’ और ‘जिन्हें मैं चाहती हूँ’ कहा जा सकता था।
  rationale: होशे जानबूझकर इस्राएल की मूर्तिपूजक वाचा-विहीनता को वैवाहिक और यौन विश्वासघात के रूप में चित्रित करता है; स्पष्ट बिंब को बनाए रखना पाठ की धर्मवैचारिक तीव्रता को सुरक्षित रखता है, बिना अतिरिक्त व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। समानांतर काव्य-विन्यास और मूल की स्पष्ट यौन भाषा को सुरक्षित रखा गया है। ‘सन’ जैसे ठोस कृषि-वस्त्र संबंधी शब्द को ‘मलमल/लिनन’ की व्याख्यात्मक प्रस्तुति पर प्राथमिकता दी गई है।
