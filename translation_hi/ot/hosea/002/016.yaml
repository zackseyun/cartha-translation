base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/016.yaml
  text: Therefore[a], behold, I am going to allure her, and I will lead her into the wilderness and speak to her heart.
translation:
  language: hi
  text: इसलिए देखो, मैं उसे लुभाने जा रहा हूँ। मैं उसे निर्जन प्रदेश में ले जाऊँगा और उसके मन से बातें करूँगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उससे कोमलता से बात करूँगा।” शाब्दिक रूप से, “उसके हृदय पर/से बोलूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले न्याय-वर्णन से आश्चर्यजनक पुनर्स्थापना की ओर परिणामसूचक मोड़ को बनाए रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला भविष्यद्वक्तापरक बल स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אָנֹכִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम का बल स्पष्ट कर्ता ‘मैं’ से बना रहता है; ‘मैं ही’ अनावश्यक रूप से अर्थ को सीमित कर सकता है।
- source_word: מְפַתֶּיהָ
  choice: उसे लुभाने जा रहा हूँ
  rationale: פִּתָּה के आकर्षित करने और मनाने के भाव को विवाह-पुनर्स्थापना के रूपक में बनाए रखता है। कृदन्त की आसन्न क्रिया को ‘जा रहा हूँ’ स्वाभाविक रूप से व्यक्त करता है, जबकि शब्द में निहित हल्का अर्थगत तनाव भी पूरी तरह मिटाता नहीं है।
- source_word: וְהֹלַכְתִּיהָ
  choice: मैं उसे ... ले जाऊँगा
  rationale: हिफ़ील रूप के ‘चलाना/ले जाना’ वाले प्रेरणार्थक अर्थ और उद्देश्यपूर्ण मार्गदर्शन को स्पष्ट करता है।
- source_word: הַמִּדְבָּר
  choice: निर्जन प्रदेश
  rationale: यह आधुनिक पाठक के लिए ऐसे उजाड़, कम आबाद भूभाग का अर्थ देता है और ‘जंगल’ से उत्पन्न वनाच्छादित क्षेत्र की भ्रामक छवि से बचता है।
- source_word: וְדִבַּרְתִּי עַל לִבָּהּ
  choice: उसके हृदय से बात करूँगा
  rationale: मूल रूपक ‘उसके हृदय से/पर बोलना’ को बनाए रखते हुए आत्मीय, सांत्वनापूर्ण और मन जीतने वाली वाणी की संभावना खुली रखता है।
theological_decisions:
- issue: विवाह-पुनर्स्थापना के रूपक में פתה द्वारा व्यक्त परमेश्वर की relational action
  choice: उसे लुभाने जा रहा हूँ
  alternative: उसे मनाऊँगा / उसे रिझाऊँगा
  rationale: ‘लुभाना’ आकर्षित करने और मनाने दोनों का भाव रखता है तथा मूल शब्द के अर्थगत तनाव को मिटाता नहीं। ‘मनाना’ भावात्मक आकर्षण को कम कर देता, जबकि ‘रिझाना’ रूपक को अधिक संकीर्ण और रोमानी बना सकता है।
- issue: עַל לִבָּהּ के मुहावरे का अनुवाद
  choice: उसके हृदय से बात करूँगा
  alternative: उससे कोमलता से बात करूँगा
  rationale: मुख्य पाठ में हृदय का मूल रूपक सुरक्षित रखा गया है; अधिक व्याख्यात्मक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है ताकि आत्मीयता, सांत्वना और अनुनय के बीच की संभावित व्यापकता बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘देखो’ भविष्यद्वक्तापरक ध्यानसूचकता को और ‘निर्जन प्रदेश’ बाइबलीय wilderness की उजाड़ता को स्वाभाविक हिन्दी में व्यक्त करता है।
