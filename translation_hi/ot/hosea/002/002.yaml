base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/002.yaml
  text: Then the sons of Judah and the sons of Israel will be gathered together[a], and they will appoint for themselves one head, and they will go up from the land[c][b], for great will be the day of Jezreel.
translation:
  language: hi
  text: तब यहूदा के लोग और इस्राएल के लोग एक साथ इकट्ठे किए जाएँगे। वे अपने लिए एक प्रधान[a] ठहराएँगे और देश से निकलकर ऊपर चढ़ेंगे[b], क्योंकि यिज्रेल का दिन महान होगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “एक सिर” है; यहाँ इसका अर्थ “एक अगुवा” या “एक प्रधान” है।
    reason: lexical_alternative
  - marker: b
    text: “देश से निकलकर ऊपर चढ़ेंगे” निर्वासन से निकलने, देश में लौटने या पुनर्स्थापना के किसी अन्य आरोहण की ओर संकेत कर सकता है; इब्रानी में सटीक आशय खुला है।
    reason: alternative_reading
  - marker: c
    text: यिज्रेल एक स्थान-नाम है और होशे की पुस्तक में धार्मिक-साहित्यिक महत्त्व रखने वाला नाम भी है; यह बिखेरने और बोने के विषयों की प्रतिध्वनि करता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְנִקְבְּצוּ
  choice: एक साथ इकट्ठे किए जाएँगे
  rationale: निफ़अल रूप में इकट्ठा किए जाने अथवा एकत्र होने का भाव है। निष्क्रिय अभिव्यक्ति मूल की सम्भावित दैवी निष्क्रियता को बिना स्पष्ट किए सुरक्षित रखती है।
- source_word: בְּנֵי יְהוּדָה וּבְנֵי יִשְׂרָאֵל
  choice: यहूदा के लोग और इस्राएल के लोग
  rationale: शाब्दिक अर्थ ‘यहूदा के पुत्र और इस्राएल के पुत्र’ है, पर इस सामूहिक जातीय प्रयोग में आधुनिक हिन्दी का ‘लोग’ अर्थ को स्वाभाविक और समावेशी ढंग से व्यक्त करता है।
- source_word: יַחְדָּו
  choice: एक साथ
  rationale: यह दोनों समुदायों की संयुक्त एकता और कार्य को स्पष्ट रूप से व्यक्त करता है।
- source_word: וְשָׂמוּ לָהֶם רֹאשׁ אֶחָד
  choice: वे अपने लिए एक ही प्रधान ठहराएँगे
  rationale: שׂים का भाव नियुक्त या स्थापित करना है और רֹאשׁ का शाब्दिक अर्थ ‘सिर’ होते हुए यहाँ अगुवे या प्रधान के लिए रूपक है। ‘प्रधान’ हिन्दी में स्वाभाविक है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וְעָלוּ מִן הָאָרֶץ
  choice: देश से ऊपर चढ़ेंगे
  rationale: עלה की दिशात्मक छवि ‘ऊपर चढ़ना’ और אֶרֶץ का ‘देश/भूमि’ अर्थ सुरक्षित रखा गया है। वाक्यांश किस देश या किस प्रकार की चढ़ाई की ओर संकेत करता है, इसे मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: כִּי גָדוֹל יוֹם יִזְרְעֶאל
  choice: क्योंकि यिज्रेल का दिन महान होगा
  rationale: כִּי को कारणसूचक ‘क्योंकि’ और पूर्वस्थापित विशेषण גָדוֹל को अर्थगत बल सहित ‘महान होगा’ से व्यक्त किया गया है। יִזְרְעֶאל को व्यक्तिवाचक नाम ‘यिज्रेल’ रखा गया है।
theological_decisions:
- issue: यहूदा और इस्राएल के लिए ‘एक प्रधान’ की पहचान
  choice: नेता की पहचान बताए बिना ‘एक ही प्रधान’ रखा गया है।
  alternative: एक राजा; मसीही अगुवा; एक राजनीतिक शासक
  rationale: इब्रानी पद संयुक्त नेतृत्व बताता है, पर उस व्यक्ति की पहचान या पदवी को अधिक स्पष्ट नहीं करता। अतः पाठ से आगे बढ़कर मसीही या राजनीतिक पहचान नहीं जोड़ी गई।
- issue: ‘देश से ऊपर चढ़ेंगे’ का आशय
  choice: स्थानगत छवि को यथावत रखते हुए उसका सटीक सन्दर्भ खुला रखा गया है।
  alternative: निर्वासन से लौटना; प्रतिज्ञात देश में चढ़ना; युद्ध के लिए आगे बढ़ना
  rationale: इब्रानी वाक्यांश इन सम्भावनाओं में से किसी एक को निर्विवाद रूप से निश्चित नहीं करता। अनुवाद पुनर्स्थापना की छवि को बनाए रखता है, पर उसकी दिशा या ऐतिहासिक परिस्थिति तय नहीं करता।
- issue: यिज्रेल नाम का धार्मिक-साहित्यिक भार
  choice: मुख्य पाठ में नाम को लिप्यन्तरित किया गया और उसके शब्द-संकेत को पादटिप्पणी में रखा गया।
  alternative: नाम का अर्थ सीधे ‘परमेश्वर बोता है’ करके अनुवाद करना
  rationale: यह स्थान और व्यक्ति से जुड़ा नाम है, साथ ही होशे में बिखेरने और बोने की प्रतिध्वनि रखता है। नाम का अनुवाद कर देने से उसका व्यक्तिवाचक स्वरूप घट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण भविष्यसूचक गद्य अपनाया गया है। ‘लोग’ सामूहिक בְּנֵי का स्वाभाविक हिन्दी रूप है, जबकि ‘प्रधान’ अस्वाभाविक ‘सिर’ की जगह नेतृत्व का रूपक संप्रेषित करता है। मूल की अनिश्चितताओं को पादटिप्पणियों में स्पष्ट किया गया है, किसी विशिष्ट साम्प्रदायिक पहचान को आरोपित किए बिना।
