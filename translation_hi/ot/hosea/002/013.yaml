  yaml_path: translation/ot/hosea/002/013.yaml
  text: And I will put an end to all her rejoicing—her feasts[a], her new moons, her Sabbaths[b], and all her appointed times.
translation:
  language: hi
  text: और मैं उसका सारा आनन्द—उसके पर्व, नए चाँद के उत्सव, सब्त-दिन और उसके सभी नियत अवसर[a]—समाप्त कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सभी नियत समयों’; मूल शब्द धार्मिक सभा या पर्व के लिए निर्धारित समय को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: और मैं … समाप्त कर दूँगा
  rationale: 'שׁבת के हिफ़ईल रूप का कारक भाव है: वक्ता उसके उल्लास को रुकवा देगा। ‘समाप्त कर दूँगा’ आधुनिक हिन्दी में इस निर्णायक भाव को स्वाभाविक रूप से व्यक्त करता है।'
- source_word: כָּל מְשׂוֹשָׂהּ
  choice: उसके सारे उल्लास को
  rationale: מָשׂוֹשׂ आनन्द, हर्ष या उल्लास को दर्शाता है। ‘सारा उल्लास’ व्यापक अर्थ और आगे दी गई उत्सवी सूची, दोनों के अनुकूल है।
- source_word: חַגָּהּ
  choice: उसके पर्वों
  rationale: חַג धार्मिक पर्व, और कभी विशेष रूप से तीर्थ-पर्व, को दर्शाता है। एकवचन रूप यहाँ सामूहिक अर्थ रखता है, जिसे हिन्दी बहुवचन सहजता से व्यक्त करता है।
- source_word: חָדְשָׁהּ
  choice: नए चाँद के उत्सवों
  rationale: इस धार्मिक पंचांग-सन्दर्भ में חֹדֶשׁ केवल ‘महीना’ नहीं, बल्कि अमावस्या/नए चाँद पर मनाया जाने वाला धार्मिक उत्सव है। स्पष्टता के लिए ‘उत्सवों’ जोड़ा गया है।
- source_word: וְשַׁבַּתָּהּ
  choice: सब्त-दिनों
  rationale: שַׁבָּת यहाँ धार्मिक विश्राम-दिवसों का सामूहिक उल्लेख है। ‘सब्त-दिन’ पारिभाषिक अर्थ को बनाए रखते हुए हिन्दी पाठक के लिए स्पष्ट है।
- source_word: וְכֹל מוֹעֲדָהּ
  choice: और सभी नियत अवसरों
  rationale: מוֹעֵד का अर्थ नियत समय, अवसर या धार्मिक सभा/पर्व हो सकता है। ‘नियत अवसर’ मूल की व्यापकता और धार्मिक पंचांग के सन्दर्भ, दोनों को बनाए रखता है।
theological_decisions:
- issue: सूचीबद्ध अवसरों का स्वरूप
  choice: इन्हें इस्राएल के धार्मिक-पंचांग से जुड़े उत्सवों और पवित्र दिनों के रूप में प्रस्तुत किया गया है।
  alternative: आरम्भिक ‘सारा उल्लास’ को सामाजिक आनन्द के प्रत्येक अवसर तक अधिक व्यापक रूप से समझा जा सकता है।
  rationale: पर्व, नए चाँद, सब्त और नियत अवसर की क्रमबद्ध सूची धार्मिक अनुष्ठानों की ओर स्पष्ट संकेत करती है; फिर भी व्यापक शीर्षक ‘सारा उल्लास’ न्याय के सामाजिक प्रभाव को सीमित नहीं करता।
- issue: מוֹעֵד की अर्थ-व्याप्ति
  choice: ‘नियत अवसर’ रखा गया है।
  alternative: ‘नियत पर्व’ या ‘नियत समय’ भी सम्भव हैं।
  rationale: ‘नियत पर्व’ धार्मिक अर्थ को स्पष्ट करता, पर חַג के अनुवाद ‘पर्व’ को दोहराता; ‘नियत समय’ अधिक शाब्दिक है, पर हिन्दी में यहाँ कम स्वाभाविक और कम स्पष्ट है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। डैश के भीतर की सूची ‘सारे उल्लास’ का विस्तार करती है। धार्मिक शब्दावली में ‘सब्त-दिन’ रखा गया है, जबकि ‘नए चाँद के उत्सव’ अर्थ स्पष्ट करता है।
