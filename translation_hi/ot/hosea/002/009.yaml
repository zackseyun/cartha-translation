id: HOS.2.9
reference: Hosea 2:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/רִדְּפָ֤ה אֶת מְאַהֲבֶ֨י/הָ֙ וְ/לֹֽא תַשִּׂ֣יג אֹתָ֔/ם וּ/בִקְשָׁ֖תַ/ם וְ/לֹ֣א תִמְצָ֑א וְ/אָמְרָ֗ה אֵלְכָ֤ה וְ/אָשׁ֨וּבָה֙ אֶל אִישִׁ֣/י הָֽ/רִאשׁ֔וֹן כִּ֣י ט֥וֹב לִ֛/י אָ֖ז מֵ/עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/009.yaml
  text: She will pursue her lovers[a], but she will not overtake them; she will seek them, but she will not find them. Then she will say, ‘I will go and return to my first husband, for it was better for me then than now.’
translation:
  language: hi
  text: वह अपने प्रेमियों के पीछे दौड़ेगी, पर उन्हें पकड़ नहीं पाएगी; वह उन्हें ढूँढ़ेगी, पर वे उसे नहीं मिलेंगे। तब वह कहेगी, “मैं चलूँगी और अपने पहले पति[a] के पास लौट जाऊँगी, क्योंकि अब की अपेक्षा तब मेरी दशा अच्छी थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पूर्व पति।” इब्रानी में शाब्दिक अर्थ “मेरे पहले पति” है।
    reason: ‘पहला’ मूल शब्द का सीधा अर्थ है, जबकि संदर्भ में ‘पूर्व’ भी सम्भव अर्थ है; टिप्पणी दोनों को सामने रखती है।
lexical_decisions:
- source_word: וְרִדְּפָה
  choice: वह ... के पीछे दौड़ेगी
  rationale: भविष्यसूचक कथन में क्रिया भावी कार्य को व्यक्त करती है। ‘पीछे दौड़ेगी’ सक्रिय पीछा करने का चित्र स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מְאַהֲבֶיהָ
  choice: अपने प्रेमियों
  rationale: होशे की वैवाहिक उपमा में यह अनुचित प्रेम-संबंध रखनेवालों की ओर संकेत करता है; ‘प्रेमियों’ मूल रूपक को बिना नरम किए सुरक्षित रखता है।
- source_word: תַשִּׂיג אֹתָם
  choice: उन्हें पकड़ नहीं पाएगी
  rationale: पीछा करने के बाद भी उन तक पहुँचकर पकड़ न पाने का भाव है। यह हिन्दी में ‘पीछे दौड़ेगी’ के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: וּבִקְשָׁתַם
  choice: वह उन्हें ढूँढ़ेगी
  rationale: यह जान-बूझकर खोजने का भाव व्यक्त करता है और अगले खंड ‘नहीं मिलेंगे’ के साथ काव्यात्मक समानांतरता रखता है।
- source_word: וְלֹא תִמְצָא
  choice: वे उसे नहीं मिलेंगे
  rationale: हिन्दी में किसी व्यक्ति को खोजने और उसके न मिलने का यह सहज प्रयोग है; अर्थ मूल के ‘वह उन्हें नहीं पाएगी’ के समान है।
- source_word: וְאָמְרָה
  choice: तब वह कहेगी
  rationale: ‘तब’ असफल खोज के बाद होनेवाले निर्णय का क्रम स्पष्ट करता है।
- source_word: אֵלְכָה וְאָשׁוּבָה
  choice: मैं चलूँगी और ... लौट जाऊँगी
  rationale: दोनों क्रियाओं को बनाए रखते हुए संकल्प का भाव व्यक्त किया गया है; ‘चलूँगी’ हिन्दी में प्रस्थान के निश्चय का स्वाभाविक संकेत है।
- source_word: אֶל אִישִׁי הָרִאשׁוֹן
  choice: अपने पहले पति के पास
  rationale: वैवाहिक संदर्भ में אִישִׁי का अर्थ ‘मेरा पति’ है, और הָרִאשׁוֹן का सीधा अर्थ ‘पहला’ है।
- source_word: כִּי טוֹב לִי אָז מֵעָתָּה
  choice: क्योंकि अब की अपेक्षा तब मेरी दशा अच्छी थी
  rationale: यह पहले की स्थिति और वर्तमान स्थिति के बीच मूल पाठ के स्पष्ट कालगत विरोध को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस्राएल की अविश्वासयोग्यता के लिए वैवाहिक रूपक
  choice: मुख्य पाठ में ‘प्रेमियों’ और ‘पति’ की भाषा सीधे बनाए रखना
  alternative: इन्हें ‘सहयोगी,’ ‘सहायक’ या ‘उपासनागत/राजनीतिक साथी’ जैसे व्याख्यात्मक शब्दों से बदलना
  rationale: यह पद होशे की व्यापक वाचा-विवाह उपमा का भाग है। प्रेमी अन्य देवताओं या राजनीतिक गठबंधनों की ओर संकेत कर सकते हैं, पर मूल पाठ स्वयं वैवाहिक और यौन-अविश्वास की छवि इस्तेमाल करता है; अनुवाद में इस तनाव को बनाए रखना उचित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर वाक्य-रचना तथा पीछा करने, खोजने और लौटने की गतिशीलता को सुरक्षित रखा गया है।
