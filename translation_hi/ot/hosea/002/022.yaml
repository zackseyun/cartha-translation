  yaml_path: translation/ot/hosea/002/022.yaml
  text: And I will betroth you to myself in faithfulness[a], and you shall know Yahweh.
translation:
  language: hi
  text: और मैं तुझसे अपने लिए निष्ठा के साथ सगाई करूँगा,[a] और तू यहोवा को जानेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वासयोग्यता के साथ”; अधिक शाब्दिक रूप में, “विश्वास में।” इब्रानी शब्द में भरोसेमंदी और वाचा के प्रति निष्ठा का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵרַשְׂתִּיךְ
  choice: और मैं ... तुझे ... वाग्दत्त करूँगा
  rationale: ארשׂ विशेष रूप से विवाह से पहले वाग्दान के संबंध में बाँधने को व्यक्त करता है। ‘वाग्दत्त करूँगा’ इस वैवाहिक-वाचा के बिंब को सामान्य ‘विवाह करूँगा’ से अधिक ठीक रूप में सुरक्षित रखता है। स्त्रीलिंग ‘तुझे’ संबोधन के संदर्भ से स्पष्ट है।
- source_word: לִי
  choice: अपने लिए
  rationale: शाब्दिक अर्थ ‘मेरे लिए’ है; हिन्दी में ‘अपने लिए’ वक्ता की ओर लौटते संबंध और व्यक्तिगत वाचागत दावे को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֶּאֱמוּנָה
  choice: विश्वासयोग्यता में
  rationale: אֱמוּנָה यहाँ भरोसेमंदी, निष्ठा और वाचा के प्रति विश्वासयोग्यता का भाव रखता है। ‘विश्वासयोग्यता’ केवल मन के विश्वास की अपेक्षा संबंधगत निष्ठा को अधिक स्पष्ट करता है, जबकि मूल की व्यापकता फुटनोट में सुरक्षित है।
- source_word: וְיָדַעַתְּ
  choice: और तू ... जानेगी
  rationale: ידע का मूल अर्थ ‘जानना’ है और यहाँ इसका रूप स्त्रीलिंग एकवचन है। ‘जानेगी’ भविष्य का अर्थ तथा संबंधगत गहराई दोनों को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित सीधे नाम-रूप ‘यहोवा’ द्वारा चतुरक्षरीय ईश्वरीय नाम को किसी उपाधि से प्रतिस्थापित किए बिना रखा गया है।
theological_decisions:
- issue: वाचा और विवाह के संदर्भ में ‘जानना’ का संबंधगत आशय
  choice: मुख्य पाठ में केवल ‘जानेगी’ रखा गया है
  alternative: ‘घनिष्ठ रूप से जानेगी’ या ‘स्वीकार करेगी’
  rationale: संदर्भ में क्रिया का अर्थ केवल बौद्धिक जानकारी से अधिक संबंधगत हो सकता है, पर उसे मुख्य पाठ में विस्तार देकर निश्चित कर देना मूल की अर्थ-समृद्धि और तनाव को सीमित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण बाइबलीय शैली रखी गई है। परमेश्वर द्वारा स्त्रीरूप में संबोधित समुदाय के लिए ‘तुझे/जानेगी’ मूल के स्त्रीलिंग एकवचन को सुरक्षित रखते हैं। ‘वाग्दत्त’ अपेक्षाकृत औपचारिक है, पर सगाई-वाचा के विशिष्ट अर्थ के कारण उपयुक्त है।
