base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/021.yaml
  text: And I will betroth you to myself forever; yes[a], I will betroth you to myself in righteousness and in justice, and in steadfast love and in compassion.
translation:
  language: hi
  text: और मैं सदा के लिए तुझसे मंगनी करूँगा; मैं धार्मिकता और न्याय के साथ, अटल प्रेम[a] और करुणा के साथ तुझसे मंगनी करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निष्ठावान प्रेम।” हिब्रू शब्द חֶסֶד में प्रेमपूर्ण दया और वाचा के संबंध में दृढ़ निष्ठा—दोनों का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵרַשְׂתִּיךְ
  choice: तुझसे मंगनी करूँगा
  rationale: क्रिया ארשׂ विवाह से पहले की मंगनी या वाग्दान को सूचित करती है। यह सहज आधुनिक हिन्दी में वैवाहिक-वाचा के रूपक को सुरक्षित रखती है।
- source_word: לִי
  choice: तुझसे मंगनी करूँगा
  rationale: शाब्दिक अर्थ ‘अपने लिए/मुझसे’ है। हिन्दी में ‘तुझसे मंगनी करूँगा’ स्वाभाविक रूप से वक्ता के साथ संबंध को व्यक्त करता है; अलग से ‘अपने लिए’ जोड़ना अनावश्यक और असहज होता।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: यह स्थायी और कभी न समाप्त होने वाले संबंध का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: בְּצֶדֶק
  choice: धार्मिकता के साथ
  rationale: צדק यहाँ नैतिक और संबंधपरक सहीपन को दर्शाता है। ‘धार्मिकता’ हिन्दी बाइबलीय प्रयोग में इस व्यापक अर्थ को बनाए रखती है।
- source_word: וּבְמִשְׁפָּט
  choice: और न्याय के साथ
  rationale: מִשְׁפָּט यहाँ दंडादेश नहीं, बल्कि न्यायपूर्ण व्यवस्था और आचरण को सूचित करता है।
- source_word: וּבְחֶסֶד
  choice: अटल प्रेम
  rationale: חֶסֶד प्रेम, निष्ठा और दया से युक्त स्थिर संबंधपरक प्रतिबद्धता को व्यक्त करता है। ‘अटल प्रेम’ मुख्य अर्थ को सहज हिन्दी में देता है, जबकि वाचागत निष्ठा की गहराई पादटिप्पणी में स्पष्ट की गई है।
- source_word: וּבְרַחֲמִים
  choice: और करुणा के साथ
  rationale: बहुवचन रूप רַחֲמִים यहाँ भाववाचक अर्थ में गहरी दया और कोमल करुणा व्यक्त करता है; हिन्दी में एकवचन भाववाचक ‘करुणा’ स्वाभाविक है।
theological_decisions:
- issue: वाचा-संबंधी वैवाहिक रूपक
  choice: ‘तुझसे मंगनी करूँगा’ के रूप में मंगनी की विशिष्ट भाषा बनाए रखना
  alternative: ‘तुझसे विवाह करूँगा’ या ‘तुझे अपना बना लूँगा’
  rationale: नबी का मंगनी वाला रूपक पुनर्स्थापित संबंध की प्रतिज्ञा के लिए केंद्रीय है। इसे सामान्य विवाह या स्वामित्व की भाषा में बदलना मूल क्रिया की विशिष्टता और पाठ के संबंधपरक तनाव को कम कर देता।
- issue: חֶסֶד का अनुवाद
  choice: मुख्य पाठ में ‘अटल प्रेम’, पादटिप्पणी में वाचा-निष्ठा का संकेत
  alternative: ‘वाचा का प्रेम’, ‘निष्ठावान प्रेम’ या ‘करुणा’
  rationale: हिब्रू शब्द प्रेमपूर्ण दया और संबंध के प्रति दृढ़ निष्ठा दोनों समेटता है। ‘अटल प्रेम’ पठनीय रहते हुए स्थायित्व व्यक्त करता है और किसी एक संप्रदायगत व्याख्या को थोपता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सीधा और सामान्य पाठकों के लिए सुबोध रूप। परमेश्वर द्वारा स्त्रीलिंग एकवचन संबोधन के लिए ‘तुझसे’ रखा गया है। समानांतरता बनाए रखने हेतु ‘मंगनी करूँगा’ दोहराया गया है और साधन/गुण सूचक בְּ को स्वाभाविक हिन्दी में ‘के साथ’ कहा गया है।
