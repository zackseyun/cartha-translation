  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֛ה אֲגַלֶּ֥ה אֶת נַבְלֻתָ֖/הּ לְ/עֵינֵ֣י מְאַהֲבֶ֑י/הָ וְ/אִ֖ישׁ לֹֽא יַצִּילֶ֥/נָּה מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/012.yaml
  text: And now I will uncover her nakedness before the eyes of her lovers, and no man will rescue her from my hand.
translation:
  language: hi
  text: और अब मैं उसके प्रेमियों की आँखों के सामने उसकी नग्नता प्रकट करूँगा, और कोई भी उसे मेरे हाथ से नहीं छुड़ाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַבְלֻתָהּ
  choice: उसकी नग्नता
  rationale: यह दुर्लभ शब्द यहाँ उजागर की गई नग्नता अथवा लज्जाजनक अवस्था को सूचित करता है; प्रसंग और प्राचीन अनुवाद-परंपरा के अनुरूप ‘नग्नता’ मूल बिंब को स्पष्ट रूप से बनाए रखता है।
- source_word: מְאַהֲבֶיהָ
  choice: उसके प्रेमियों
  rationale: होशे की वैवाहिक रूपक-भाषा को बनाए रखते हुए यह बहुवचन उन पर लागू होता है जिनके पीछे वह गई।
- source_word: וְאִישׁ לֹא
  choice: और कोई भी नहीं
  rationale: शाब्दिक रूप से ‘और कोई पुरुष नहीं’; यहाँ אִישׁ नकार के साथ सामान्य अर्थ में किसी भी व्यक्ति को दर्शाता है, इसलिए स्वाभाविक और समावेशी हिन्दी में ‘कोई भी’ उपयुक्त है।
- source_word: יַצִּילֶנָּה מִיָּדִי
  choice: उसे मेरे हाथ से नहीं छुड़ाएगा
  rationale: ‘हाथ से छुड़ाना’ सामर्थ्य और अधिकार से बचाने के मूल इब्रानी मुहावरे को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: दिव्य न्याय के रूप में सार्वजनिक अनावरण
  choice: सीधी और कठोर रूपक-भाषा ‘उसकी नग्नता प्रकट करूँगा’ बनाए रखी गई
  alternative: ‘उसकी लज्जा खोल दूँगा’
  rationale: मूल पाठ की असहज न्याय-भाषा को नरम या व्याख्यायित नहीं किया गया; साथ ही यह होशे के वैवाहिक रूपक के भीतर ही प्रस्तुत है।
- issue: उद्धारकर्ता की अनुपस्थिति
  choice: ‘कोई भी उसे मेरे हाथ से नहीं छुड़ाएगा’
  alternative: ‘कोई पुरुष उसे मेरे हाथ से नहीं छुड़ाएगा’
  rationale: इस वाक्य का आशय किसी संभावित मानवीय बचाने वाले का पूर्ण निषेध है, न कि केवल पुरुष लिंग पर धर्मवैज्ञानिक बल।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सीधी शैली। वाक्य-संरचना मूल इब्रानी के दो समन्वित खंडों को बनाए रखती है और वैवाहिक रूपक की तीव्रता को कम नहीं करती।
