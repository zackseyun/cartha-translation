source:
  edition: WLC
  text: לָ/כֵ֛ן הִנְ/נִי שָׂ֥ךְ אֶת דַּרְכֵּ֖/ךְ בַּ/סִּירִ֑ים וְ/גָֽדַרְתִּי֙ אֶת גְּדֵרָ֔/הּ וּ/נְתִיבוֹתֶ֖י/הָ לֹ֥א תִמְצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/008.yaml
  text: Therefore[a], behold, I am hedging up your way with thorns[c][b], and I will wall in her wall so that she will not find her paths.
translation:
  language: hi
  text: इसलिए देख, मैं तेरे मार्ग को काँटों से रोक दूँगा[a], और उसके चारों ओर दीवार खड़ी कर दूँगा[b], ताकि वह अपनी पगडंडियाँ न पा सके[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘काँटेदार झाड़ियों से घेर दूँगा।’
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में ‘दीवार/बाड़’ से सम्बन्धित क्रिया और संज्ञा साथ आती हैं; वाक्यांश संक्षिप्त और कठिन है। इसका अर्थ ‘मैं उसके चारों ओर दीवार खड़ी करूँगा’ या ‘मैं उसे दीवार से घेर दूँगा’ हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में पहले सीधे सम्बोधन ‘तेरे मार्ग’ से यहाँ तृतीय पुरुष ‘वह अपनी पगडंडियाँ’ पर बदलाव होता है; अनुवाद ने इस बदलाव को बनाए रखा है।
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले आरोप और आने वाले दण्ड के बीच परिणामसूचक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: यह ध्यान आकर्षित करने वाली, आसन्न ईश्वरीय कार्रवाई की जोरदार घोषणा है; ‘देख’ आधुनिक हिन्दी में इसकी वाक्प्रेरक शक्ति बनाए रखता है।
- source_word: שָׂךְ
  choice: रोक दूँगा
  rationale: क्रिया काँटेदार अवरोध लगाकर मार्ग बंद करने का बोध देती है। हिन्दी में ‘मार्ग को काँटों से रोकना’ चित्र को स्पष्ट रखता है, जबकि काल-संदर्भ आसन्न कार्रवाई को भविष्य रूप में स्वाभाविक बनाता है।
- source_word: דַּרְכֵּךְ
  choice: तेरे मार्ग
  rationale: एकवचन स्त्रीलिंग द्वितीय पुरुष सम्बोधन को बनाए रखता है; ‘मार्ग’ वास्तविक रास्ते और आचरण, दोनों अर्थों की सम्भावना रखता है।
- source_word: בַּסִּירִים
  choice: काँटों से
  rationale: शब्द काँटेदार वनस्पति को दर्शाता है जो अवरोध का काम करती है। ‘काँटे’ सामान्य, स्पष्ट और सजीव हिन्दी है।
- source_word: וְגָדַרְתִּי אֶת־גְּדֵרָהּ
  choice: और उसके चारों ओर दीवार खड़ी कर दूँगा
  rationale: हिब्रू में एक ही मूल से बनी क्रिया और संज्ञा का संक्षिप्त, कठिन प्रयोग है। शाब्दिक ‘उसकी दीवार को दीवार दूँगा’ हिन्दी में अस्पष्ट और अस्वाभाविक होगा; चयनित रूप चारों ओर मजबूत अवरोध खड़ा करने का सम्भावित अर्थ देता है, और अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וּנְתִיבוֹתֶיהָ
  choice: अपनी पगडंडियाँ
  rationale: बहुवचन स्त्रीलिंग तृतीय पुरुष रूप को रखा गया है। ‘पगडंडियाँ’ खोजे जाने वाले छोटे रास्तों की ठोस छवि देता है।
- source_word: לֹא תִמְצָא
  choice: ताकि वह ... न पा सके
  rationale: अवरोध के उद्देश्य अथवा परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है और तृतीय पुरुष स्त्रीलिंग को बनाए रखता है।
theological_decisions:
- issue: द्वितीय पुरुष से तृतीय पुरुष में सर्वनाम-परिवर्तन
  choice: ‘तेरे मार्ग’ से ‘वह अपनी पगडंडियाँ’ तक हिब्रू का परिवर्तन सुरक्षित रखा गया है।
  alternative: सभी पदों को द्वितीय पुरुष (‘तू अपनी पगडंडियाँ’) या तृतीय पुरुष (‘उसका मार्ग’) में समान कर देना।
  rationale: यह बदलाव स्त्री को सीधे सम्बोधित करने और फिर उसका वर्णन करने के बीच भविष्यवाणी की वाक्पद्धति को दर्शाता है। इसे समतल करना मूल की तनावपूर्ण अभिव्यक्ति को मिटा देता।
- issue: काँटों और दीवार के अवरोध का स्वरूप
  choice: दो क्रमशः प्रबल अवरोधों की ठोस छवि बनाए रखी गई है।
  alternative: इसे केवल अमूर्त रूप में ‘मैं उसे रोकूँगा’ कहना।
  rationale: मूल पाठ कृषि और घेराबंदी की मूर्त भाषा से उसके मार्ग बंद किए जाने को व्यक्त करता है; अनावश्यक धार्मिक व्याख्या जोड़े बिना उस छवि को बनाए रखना उचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तेरे’ भविष्यवाणी के सीधे, एकवचन सम्बोधन को व्यक्त करता है। मूल की कठिन आन्तरिक-समजात रचना को अस्वाभाविक हिन्दी में नकल करने के बजाय मुख्य पाठ में उसका सम्भावित अर्थ दिया गया है और वास्तविक अस्पष्टता पादटिप्पणी में दर्ज की गई है।
