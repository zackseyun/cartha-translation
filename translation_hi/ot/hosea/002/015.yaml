source:
  edition: WLC
  text: וּ/פָקַדְתִּ֣י עָלֶ֗י/הָ אֶת יְמֵ֤י הַ/בְּעָלִים֙ אֲשֶׁ֣ר תַּקְטִ֣יר לָ/הֶ֔ם וַ/תַּ֤עַד נִזְמָ/הּ֙ וְ/חֶלְיָתָ֔/הּ וַ/תֵּ֖לֶךְ אַחֲרֵ֣י מְאַהֲבֶ֑י/הָ וְ/אֹתִ֥/י שָׁכְחָ֖ה נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/015.yaml
  text: And I will punish her for the days of the Baals[a], when she burned incense to them and adorned herself with her ring and her jewelry, and went after her lovers, but forgot me, declares Yahweh.
translation:
  language: hi
  text: और मैं उसे बाल-देवताओं के उन दिनों के कारण दंड दूँगा, जब वह उनके लिए धूप जलाती थी, अपनी नथ[a] और अपने गहनों से सजती थी, और अपने प्रेमियों के पीछे जाती थी, पर मुझे भूल गई थी—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ नथ, बाली, या सामान्य छल्लेदार आभूषण हो सकता है; इस पद में सटीक वस्तु निश्चित नहीं है।
    reason: נֶזֶם की सटीक वस्तु अनिश्चित है; मुख्य पाठ में ‘नथ’ एक सम्भव अर्थ है।
lexical_decisions:
- source_word: וּפָקַדְתִּי עָלֶיהָ
  choice: मैं उसे ... के लिए दण्ड दूँगा
  rationale: न्याय के संदर्भ में פקד על का अर्थ किसी को उसके कार्यों के लिए उत्तरदायी ठहराना या दण्ड देना है; यह हिन्दी में न्यायिक भाव स्पष्ट करता है।
- source_word: יְמֵי הַבְּעָלִים
  choice: बाल देवताओं के दिन
  rationale: बहुवचन הַבְּעָלִים विभिन्न स्थानीय रूपों या प्रतिमाओं में पूजे जाने वाले बाल को सूचित करता है। 'दिन' उनके उपासना-कालों या अवसरों की मूल अभिव्यक्ति बनाए रखता है।
- source_word: אֲשֶׁר תַּקְטִיר לָהֶם
  choice: जब वह उनके लिए धूप जलाती थी
  rationale: हिफ़ील הקטיר बलि या धूप का धुआँ चढ़ाने के लिए प्रयुक्त होता है; इस मूर्तिपूजक उपासना-संदर्भ में 'धूप जलाती थी' स्वाभाविक और उपयुक्त है।
- source_word: וַתַּעַד
  choice: सजती थी
  rationale: עדה यहाँ स्वयं को आभूषणों से सजाने का अर्थ देता है; स्त्रीलिंग अकर्मक हिन्दी रूप प्रसंग के आत्मवाचक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נִזְמָהּ
  choice: अपनी नथ
  rationale: נֶזֶם किसी अंगूठी-जैसे आभूषण, विशेषतः नथ या बाली, को सूचित कर सकता है। स्त्री के श्रृंगार के इस प्रसंग में 'नथ' संभावित विशिष्ट अर्थ को सहज हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अनिश्चितता बचाती है।
- source_word: וְחֶלְיָתָהּ
  choice: अपने गहनों
  rationale: חֶלְיָה आभूषण या सजावटी गहने को सूचित करता है; 'गहनों' का बहुवचन सामूहिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְאַהֲבֶיהָ
  choice: अपने प्रेमियों
  rationale: होशे की वैवाहिक रूपक-भाषा में यह अवैध प्रेम-संबंधों के साथ-साथ मूर्तिपूजक देवताओं और संभवतः राजनीतिक आश्रयों की ओर संकेत करता है; 'प्रेमी' इस तनाव को बनाए रखता है।
- source_word: וְאֹתִי שָׁכְחָה
  choice: पर मुझे भूल गई थी
  rationale: וְ को यहाँ विरोधसूचक 'पर' करना प्रेमियों के पीछे जाने और याहवे की उपेक्षा के बीच निहित विरोध को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की औपचारिक घोषणा-सूक्ति है और יְהוָה को उसके व्यक्तिगत वाचा-नाम 'याहवे' के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। 'याहवे' उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: बहुवचन הַבְּעָלִים की पहचान
  choice: बाल देवताओं
  alternative: बाल की प्रतिमाएँ; बाल के विभिन्न रूप
  rationale: बहुवचन विभिन्न स्थानीय बाल-रूपों, उनके पंथों या प्रतिमाओं को सूचित कर सकता है। 'बाल देवताओं' हिन्दी पाठक को बहुवचन और मूर्तिपूजक संदर्भ दोनों स्पष्ट करता है, पर किसी एक संकीर्ण पहचान को निश्चित नहीं करता।
- issue: प्रेमियों का रूपक
  choice: प्रेमियों
  alternative: दूसरे देवताओं; राजनीतिक सहयोगियों
  rationale: मूल वैवाहिक रूपक को बनाए रखना आवश्यक है, क्योंकि यह शब्द मूर्तिपूजा और राजनीतिक अविश्वास दोनों की प्रतिध्वनि रख सकता है; व्याख्यात्मक विकल्प को मुख्य पाठ में सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वैवाहिक रूपक और भविष्यद्वाणी की न्यायसूचक कठोरता को बनाए रखा गया है।
