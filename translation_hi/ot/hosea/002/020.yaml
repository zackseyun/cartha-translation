source:
  edition: WLC
  text: וְ/כָרַתִּ֨י לָ/הֶ֤ם בְּרִית֙ בַּ/יּ֣וֹם הַ/ה֔וּא עִם חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/עִם ע֣וֹף הַ/שָּׁמַ֔יִם וְ/רֶ֖מֶשׂ הָֽ/אֲדָמָ֑ה וְ/קֶ֨שֶׁת וְ/חֶ֤רֶב וּ/מִלְחָמָה֙ אֶשְׁבּ֣וֹר מִן הָ/אָ֔רֶץ וְ/הִשְׁכַּבְתִּ֖י/ם לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/020.yaml
  text: And on that day I will make for them a covenant with the wild animals of the field[a], with the birds of the heavens, and with the creeping things of the ground; and I will break bow and sword and war from the land[c][b], and I will make them lie down in safety.
translation:
  language: hi
  text: और उस दिन मैं उनके लिए मैदान के जंगली पशुओं, आकाश के पक्षियों और भूमि पर रेंगने वाले जीवों के साथ वाचा बाँधूँगा[a]। मैं देश में से धनुष, तलवार और युद्ध को तोड़ दूँगा[b], और उन्हें निडर होकर विश्राम करने दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वाचा काटूँगा”; इब्रानी में वाचा बाँधने के लिए यह सामान्य मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: “देश” का अनुवाद “पृथ्वी” भी हो सकता है।
    reason: scope_alternative
lexical_decisions:
- source_word: וְכָרַתִּי ... בְּרִית
  choice: वाचा बाँधूँगा
  rationale: यह इब्रानी का मानक वाचा-संबंधी मुहावरा है, जिसका शाब्दिक अर्थ ‘वाचा काटना’ है। हिन्दी में ‘वाचा बाँधना’ स्वाभाविक और गरिमापूर्ण है तथा वाचा का भाव बनाए रखता है।
- source_word: לָהֶם
  choice: उनके लिए
  rationale: ל के लाभार्थी अर्थ को सुरक्षित रखता है और आगे पशु-जगत के लिए प्रयुक्त עִם (‘के साथ’) से उसका भेद स्पष्ट करता है।
- source_word: חַיַּת הַשָּׂדֶה
  choice: मैदान के जंगली पशुओं
  rationale: חַיָּה यहाँ गैर-पालतू पशुओं और שָׂדֶה खुले मैदान/देहात का बोध कराता है। यह आधुनिक हिन्दी में स्पष्ट है।
- source_word: עוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षियों
  rationale: עוֹף को सुलभ रूप में ‘पक्षी’ और שָׁמַיִם को इस सृष्टि-सूची के संदर्भ में स्वाभाविक ‘आकाश’ किया गया है।
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: भूमि पर रेंगनेवाले जीवों
  rationale: רֶמֶשׂ रेंगने या सरकनेवाले जीवों को सूचित करता है; ‘भूमि’ אֲדָמָה को व्यक्त करते हुए बाद के אֶרֶץ (‘देश’) से भेद बनाए रखती है।
- source_word: וְקֶשֶׁת וְחֶרֶב וּמִלְחָמָה
  choice: धनुष, तलवार और युद्ध
  rationale: विशिष्ट हथियारों से सामान्य युद्ध तक की काव्यात्मक क्रम-वृद्धि को बिना संक्षिप्त किए सुरक्षित रखा गया है।
- source_word: אֶשְׁבּוֹר
  choice: मिटा दूँगा
  rationale: मूल अर्थ ‘तोड़ना’ है, पर धनुष, तलवार और युद्ध—तीनों के संयुक्त कर्म होने के कारण हिन्दी में ‘मिटा देना’ युद्ध-साधनों और युद्ध के अंत का स्वाभाविक साझा कथन है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: מִן הָאָרֶץ
  choice: देश में से
  rationale: होशे के पुनर्स्थापना-संदर्भ में אֶרֶץ का क्षेत्रीय अर्थ ‘देश’ उपयुक्त है, यद्यपि ‘पृथ्वी’ भी संभव है।
- source_word: וְהִשְׁכַּבְתִּים לָבֶטַח
  choice: उन्हें निडर होकर विश्राम करने दूँगा
  rationale: हिफ़ील रूप के कारणकारी भाव और לָבֶטַח की सुरक्षित, भयमुक्त दशा को सहज हिन्दी में व्यक्त करता है। ‘लिटाऊँगा’ अधिक शाब्दिक है, पर यहाँ सुरक्षित विश्राम का भाव प्रमुख है।
theological_decisions:
- issue: वाचा के लाभार्थी और उसके साथ उल्लिखित पक्ष
  choice: परमेश्वर ‘उनके लिए’ पशु-जगत ‘के साथ’ वाचा बाँधता है।
  alternative: परमेश्वर लोगों और पशुओं, दोनों के साथ संयुक्त रूप से वाचा बाँधता है।
  rationale: इब्रानी לָהֶם (‘उनके लिए’) और बार-बार आए עִם (‘के साथ’) में स्पष्ट व्याकरणिक भेद रखता है। अनुवाद इस भेद को बनाए रखता है और सृष्टि के साथ पुनर्स्थापित शांति को बिना अधिक व्याख्या के प्रकट करता है।
- issue: אֶרֶץ का भौगोलिक विस्तार
  choice: देश
  alternative: पृथ्वी
  rationale: तात्कालिक संदर्भ लोगों की अपने स्थान में पुनर्स्थापना, शांति और सुरक्षा का है। ‘देश’ इस वाचा-संबंधी क्षेत्रीय भाव को प्राथमिकता देता है, जबकि व्यापक अर्थ की संभावना पादटिप्पणी में सुरक्षित है।
- issue: सुरक्षा की प्रतिज्ञा में कारणकारी क्रिया
  choice: उन्हें निडर होकर विश्राम करने दूँगा
  alternative: मैं उन्हें सुरक्षित लिटाऊँगा
  rationale: कारणकारी क्रिया और सुरक्षा—दोनों को रखा गया है, पर हिन्दी में इसे कठोर बाध्यता के बजाय परमेश्वर द्वारा दी गई भयमुक्त विश्रांति के रूप में स्वाभाविक ढंग से कहा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक-पाठ योग्य शैली रखी गई है। ‘वाचा’ जैसे स्थापित धर्मग्रंथीय शब्द को बनाए रखते हुए वाक्य-विन्यास सरल रखा गया है। ‘निडर होकर विश्राम’ सुरक्षित लेटने की चरवाही-सदृश छवि को आधुनिक पाठक के लिए सहज बनाता है।
