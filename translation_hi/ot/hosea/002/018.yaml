source:
  edition: WLC
  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה תִּקְרְאִ֖י אִישִׁ֑/י וְ/לֹֽא תִקְרְאִי לִ֥/י ע֖וֹד בַּעְלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/018.yaml
  text: And in that day[a], declares Yahweh, you will call me ‘My husband,’ and you will no longer call me ‘My Baal.’
translation:
  language: hi
  text: “उस दिन तुम मुझे ‘मेरे पति’ कहोगी, और मुझे फिर कभी ‘मेरे बाल’[a] नहीं कहोगी,” याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू बाअली का अर्थ ‘मेरे स्वामी’, ‘मेरे मालिक’ या ‘मेरे पति’ भी हो सकता है। यहाँ ‘मेरे बाल’ अनुवाद उस शब्द-खेल और होशे के संदर्भ में बाल-उपासना की ओर संभावित संकेत को सुरक्षित रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: उस दिन ऐसा होगा
  rationale: यह भविष्य की परिस्थिति आरम्भ करने वाला प्रचलित भविष्यसूचक वाक्यांश है। यह अनुवाद हिब्रू के अस्तित्वसूचक क्रिया-रूप और समय-सूचक पदबंध, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह नबूवत में प्रयुक्त गंभीर दैवी वचन-सूत्र है। ‘घोषणा’ उसकी औपचारिकता बनाए रखता है और याहवे को व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
- source_word: תִּקְרְאִי
  choice: तुम ... कहोगी
  rationale: स्त्रीलिंग एकवचन क्रिया यहाँ किसी को एक संबंध-सूचक नाम से पुकारने या संबोधित करने का भाव देती है। हिन्दी में ‘मुझे ... कहोगी’ दोनों occurrences के लिए स्वाभाविक है और स्त्रीलिंग संबोधन भी सुरक्षित रखता है।
- source_word: אִישִׁי
  choice: मेरे पति
  rationale: אִישׁ का सामान्य अर्थ ‘पुरुष’ हो सकता है, पर वैवाहिक रूपक और प्रथम पुरुष संबंधसूचक प्रत्यय के कारण यहाँ ‘मेरे पति’ अपेक्षित अर्थ है।
- source_word: וְלֹא תִקְרְאִי לִי עוֹד
  choice: और फिर मुझे ... नहीं कहोगी
  rationale: निषेध के साथ עוֹד निर्णायक रूप से ‘अब आगे नहीं’ का भाव देता है; ‘फिर ... नहीं’ आधुनिक हिन्दी में इसे सहजता से व्यक्त करता है।
- source_word: בַּעְלִי
  choice: मेरे बाल
  rationale: בעל का अर्थ ‘स्वामी’, ‘मालिक’ या वैवाहिक संदर्भ में ‘पति’ भी हो सकता है, किंतु यहाँ कनानी देवता बाल के नाम के साथ जानबूझकर किया गया शब्द-खेल संभावित है। लिप्यंतरण ‘बाल’ उस धार्मिक संकेत को बनाए रखता है, जबकि पादटिप्पणी अन्य शाब्दिक अर्थ बताती है।
theological_decisions:
- issue: בַּעְלִי को सामान्य संबंधसूचक अर्थ में अनूदित किया जाए या बाल-उपासना की ओर उसके संभावित संकेत को सुरक्षित रखा जाए
  choice: मेरे बाल
  alternative: मेरे स्वामी / मेरे मालिक / मेरे पति
  rationale: होशे के संदर्भ में पद वाचा के वैवाहिक संबंध और बाल से जुड़ी दूषित संबोधन-भाषा के बीच तनाव रखता है। ‘मेरे बाल’ इस धार्मिक संकेत और אִישִׁי के साथ विरोध को सुरक्षित रखता है; पादटिप्पणी हिब्रू शब्द की वास्तविक अर्थ-बहुलता स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग एकवचन ‘कहोगी’ इस्राएल को पत्नी के रूप में संबोधित करने वाले मूल रूपक को बनाए रखता है। उद्धरण-रचना दैवी घोषणा और उसके भीतर के संबोधनों को स्पष्ट करती है।
