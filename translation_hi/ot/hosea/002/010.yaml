id: HOS.2.10
reference: Hosea 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִיא֙ לֹ֣א יָֽדְעָ֔ה כִּ֤י אָֽנֹכִי֙ נָתַ֣תִּי לָ֔/הּ הַ/דָּגָ֖ן וְ/הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֑ר וְ/כֶ֨סֶף הִרְבֵּ֥יתִי לָ֛/הּ וְ/זָהָ֖ב עָשׂ֥וּ לַ/בָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/010.yaml
  text: But she did not know that it was I who gave her the grain[a], the new wine, and the oil, and who multiplied silver for her and gold[b], which they made into Baal.
translation:
  language: hi
  text: परन्तु वह नहीं जानती थी कि अनाज, नया दाखमधु और तेल मैंने ही उसे दिया था, और उसके लिए चाँदी और सोना बहुतायत से दिया था, जिससे उन्होंने बाल की प्रतिमा बनाई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे उन्होंने बाल के लिए बनाया” अथवा “बाल की उपासना में इस्तेमाल किया।” इब्रानी वाक्य संक्षिप्त है; इसका आशय चाँदी और सोने से बाल की प्रतिमा बनाना हो सकता है, पर उन उपहारों को अधिक व्यापक रूप से बाल की उपासना में लगाने का अर्थ भी संभव है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִיא
  choice: परन्तु वह
  rationale: संयोजक और स्त्रीलिंग सर्वनाम पिछले प्रसंग के विपरीत भाव को सामने लाते हैं; यह अनुवाद उस विरोध और स्पष्ट स्त्रीलिंग कर्ता को बनाए रखता है।
- source_word: לֹא יָדְעָה
  choice: नहीं जानती थी
  rationale: ידע का सीधा अर्थ ‘जानना’ है; प्रसंग में पहचानने या स्वीकार करने की विफलता निहित है, जिसे संदर्भ स्वयं व्यक्त करता है।
- source_word: כִּי אָֽנֹכִי
  choice: कि मैं ही था
  rationale: כִּי उस बात का विषय प्रस्तुत करता है जिसे वह नहीं जानती थी, और स्वतंत्र सर्वनाम אָנֹכִי पर बल देता है; ‘मैं ही’ उस बल को स्वाभाविक हिन्दी में रखता है।
- source_word: נָתַתִּי לָהּ
  choice: जिसने उसे ... दिया
  rationale: यह पूर्ण भूतकालीन क्रिया और अप्रत्यक्ष कर्म का सहज हिन्दी रूप है।
- source_word: הַדָּגָן
  choice: अनाज
  rationale: דגן सामान्य रूप से अन्न या अनाज की उपज को दर्शाता है, किसी एक विशेष फसल को नहीं।
- source_word: הַתִּירוֹשׁ
  choice: नया दाखमधु
  rationale: תירוש अंगूर की नई उपज से बने दाखमधु को सूचित करता है; यह भविष्यद्वक्ताओं में मिलने वाली कृषि-उपज की त्रयी को बनाए रखता है।
- source_word: הַיִּצְהָר
  choice: तेल
  rationale: יצהר कृषि-उपज के रूप में प्रायः जैतून के तेल को दर्शाता है; सामान्य हिन्दी में ‘तेल’ स्वाभाविक है और प्रसंग इसके कृषि-संबंधी अर्थ को स्पष्ट करता है।
- source_word: וְכֶסֶף הִרְבֵּיתִי לָהּ וְזָהָב
  choice: और उसके लिए चाँदी और सोना बहुतायत से दिया
  rationale: רבה का हिफ़ील रूप बढ़ाने अथवा प्रचुर करने का भाव देता है। हिन्दी में ‘बहुतायत से दिया’ कारणात्मक परिणाम और प्रचुरता को स्वाभाविक रूप से व्यक्त करता है; सोना भी इसी क्रिया के साथ समझा गया है।
- source_word: עָשׂוּ לַבָּעַל
  choice: जिसे उन्होंने बाल के लिए इस्तेमाल किया
  rationale: इब्रानी पद संक्षिप्त और अर्थ की दृष्टि से खुला है। इसका आशय धातु से बाल की प्रतिमा बनाना या उसे बाल-पूजा में लगाना हो सकता है; मुख्य पाठ में व्यापक अर्थ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: לַבָּעַל का मूर्तिपूजा-संबंधी अर्थ
  choice: बाल
  alternative: स्वामी
  rationale: यहाँ בַּעַל सामान्य ‘स्वामी’ नहीं, कनानी देवता का नाम है; इसलिए व्यक्तिवाचक नाम ‘बाल’ रखा गया है।
- issue: עָשׂוּ לַבָּעַל में चाँदी-सोने के उपयोग का स्वरूप
  choice: बाल के लिए इस्तेमाल किया
  alternative: बाल की प्रतिमा बनाई
  rationale: मूल इब्रानी संक्षिप्त है और यह निश्चित नहीं करता कि धातु से प्रतिमा ही बनाई गई थी या उसे अधिक व्यापक रूप से बाल-पूजा में लगाया गया था। मुख्य पाठ व्यापक अर्थ रखता है, जबकि विशिष्ट संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सामान्य पाठक के लिए बोधगम्य शैली। ‘दाखमधु’ बाइबलीय कृषि-संदर्भ की स्पष्टता रखता है; वाक्य में परमेश्वर के ‘मैं ही’ पर दिए गए बल को सुरक्षित रखा गया है।
