source:
  edition: WLC
  text: רִ֤יבוּ בְ/אִמְּ/כֶם֙ רִ֔יבוּ כִּֽי הִיא֙ לֹ֣א אִשְׁתִּ֔/י וְ/אָנֹכִ֖י לֹ֣א אִישָׁ֑/הּ וְ/תָסֵ֤ר זְנוּנֶ֨י/הָ֙ מִ/פָּנֶ֔י/ה וְ/נַאֲפוּפֶ֖י/הָ מִ/בֵּ֥ין שָׁדֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/004.yaml
  text: Contend with your mother[a], contend, for she is not my wife, and I am not her husband[b]; let her remove her prostitutions from her face and her adulteries from between her breasts.
translation:
  language: hi
  text: अपनी माँ के विरुद्ध मुकदमा करो[a], मुकदमा करो; क्योंकि वह मेरी पत्नी नहीं है और मैं उसका पति नहीं हूँ। वह अपने चेहरे से अपना वेश्याकर्म और अपने स्तनों के बीच से अपना व्यभिचार दूर करे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी माँ से विवाद करो” अथवा “अपनी माँ पर अभियोग लगाओ।” इब्रानी क्रिया ריב में कानूनी विवाद या अभियोग का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “वेश्याकर्म” और “व्यभिचार” यहाँ वास्तविक यौन दुराचार को दर्शा सकते हैं; होशे की पुस्तक में यही भाषा मूर्तिपूजा के द्वारा वाचा से विश्वासघात के रूपक के रूप में भी प्रयुक्त होती है।
    reason: cultural_note
lexical_decisions:
- source_word: רִיבוּ בְאִמְּכֶם
  choice: अपनी माँ से वाद-विवाद करो
  rationale: ריב के बहुवचन आज्ञार्थक रूप में कानूनी विवाद, अभियोग और प्रतिवाद की छाया है। ‘वाद-विवाद करो’ इस कानूनी-विवादात्मक बल और दोहराव की तात्कालिकता को बनाए रखता है; ‘से’ בְ के साथ संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי הִיא לֹא אִשְׁתִּי וְאָנֹכִי לֹא אִישָׁהּ
  choice: क्योंकि वह मेरी पत्नी नहीं है और मैं उसका पति नहीं हूँ
  rationale: אִשָּׁה और אִישׁ यहाँ वैवाहिक संबंध के सामान्य शब्द हैं। ‘पत्नी’ और ‘पति’ भविष्यद्वक्ता के विवाह-रूपक को बिना व्याख्यात्मक विस्तार के स्पष्ट रखते हैं।
- source_word: וְתָסֵר
  choice: वह ... हटा दे
  rationale: यह रूप यहाँ आग्रह अथवा आदेश-सदृश भाव रखता है। ‘हटा दे’ आधुनिक हिन्दी में उस भाव को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: זְנוּנֶיהָ
  choice: अपने वेश्याकर्म
  rationale: זְנוּנִים यौन दुराचार के कार्यों या प्रवृत्ति को दर्शाता है और होशे में मूर्तिपूजा से जुड़ी वाचा-विहीनता का रूपक भी है। ‘वेश्याकर्म’ कठोरता और रूपकात्मक संभावना दोनों को बनाए रखता है।
- source_word: מִפָּנֶיהָ
  choice: अपने चेहरे से
  rationale: शाब्दिक और दृश्य बिंब को सुरक्षित रखा गया है; इसे ‘अपने सामने से’ जैसा अमूर्त रूप नहीं दिया गया।
- source_word: וְנַאֲפוּפֶיהָ
  choice: अपने व्यभिचार
  rationale: נאף से बना बहुवचन व्यभिचारी कृत्यों को सूचित करता है। हिन्दी में ‘व्यभिचार’ प्रायः समूहवाचक रूप में स्वाभाविक है और यौन तथा वाचागत विश्वासघात की गंभीरता बनाए रखता है।
- source_word: מִבֵּין שָׁדֶיהָ
  choice: अपने स्तनों के बीच से
  rationale: यह मूल का प्रत्यक्ष शारीरिक बिंब है। ‘स्तनों’ से שָׁדַיִם का अर्थ बिना शिष्टतावादी नरमी या अतिरिक्त व्याख्या के व्यक्त होता है।
theological_decisions:
- issue: वाचा टूटने के लिए विवाह का रूपक
  choice: मुख्य पाठ में पति-पत्नी की शाब्दिक भाषा बनाए रखी गई है।
  alternative: इसे सीधे परमेश्वर के प्रति इस्राएल की वाचा-विहीनता के रूप में व्याख्यायित करना।
  rationale: इब्रानी पाठ विवाह के रूपक के द्वारा बोलता है। मुख्य पाठ में रूपक खोल देने से अनुवाद में ऐसी व्याख्या जुड़ जाती जो मूल ने स्पष्टतः नहीं कही, और भविष्यद्वाणी का तनाव घट जाता।
- issue: यौन विश्वासघात की कठोर शब्दावली
  choice: ‘वेश्याकर्म’ और ‘व्यभिचार’ जैसे प्रबल शब्द रखे गए हैं।
  alternative: ‘अविश्वासयोग्यता’ या ‘अनैतिकता’ जैसे सामान्य और नरम शब्द।
  rationale: होशे की यौन रूपक-भाषा जानबूझकर तीखी है और मूर्तिपूजक वाचा-भंग की गंभीरता दिखाती है; सामान्य शब्द उस प्रभाव को कम कर देते।
- issue: टूटा हुआ वैवाहिक संबंध और पश्चाताप का आह्वान
  choice: ‘वह मेरी पत्नी नहीं... मैं उसका पति नहीं’ की घोषणा और ‘हटा दे’ के आह्वान को साथ-साथ रखा गया है।
  alternative: घोषणा को अंतिम तलाक या केवल चेतावनी मानकर स्पष्ट करना।
  rationale: पाठ स्वयं संबंध-विच्छेद की घोषणा के बीच परिवर्तन का आग्रह रखता है। अनुवाद इस तनाव को किसी एक व्यवस्थित निष्कर्ष में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष और सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। मूल की पुनरुक्ति, वैवाहिक घोषणा और तीखे शारीरिक-यौन बिंब सुरक्षित रखे गए हैं। ‘वाद-विवाद’ कानूनी छाया को रखता है, जबकि पादटिप्पणी अधिक स्पष्ट न्यायिक विकल्प देती है।
