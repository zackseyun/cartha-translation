reference: Hosea 2:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָ/אָ֣רֶץ תַּעֲנֶ֔ה אֶת הַ/דָּגָ֖ן וְ/אֶת הַ/תִּיר֣וֹשׁ וְ/אֶת הַ/יִּצְהָ֑ר וְ/הֵ֖ם יַעֲנ֥וּ אֶֽת יִזְרְעֶֽאל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/024.yaml
  text: and the earth will answer the grain[a], the new wine, and the oil, and they will answer Jezreel.
translation:
  language: hi
  text: और धरती अनाज, नया दाखरस और तेल को उत्तर देगी, और वे यिज्रेल[a] को उत्तर देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यिज्रेल’ नाम का अर्थ ‘परमेश्वर बोता है’ है; होशे की पुस्तक में यह स्थान/नाम होने के साथ-साथ प्रतीकात्मक रूप से भी प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: और धरती
  rationale: यहाँ आकाश → धरती → उपज की काव्यात्मक शृंखला है; इसलिए ‘धरती’ व्यापक सृष्टिगत चित्र को सुरक्षित रखती है, यद्यपि ‘देश/भूमि’ भी संभव अर्थ है।
- source_word: תַּעֲנֶה / יַעֲנוּ
  choice: उत्तर देगी / उत्तर देंगे
  rationale: दोनों क्रियाओं में एक ही धातु ענה की पुनरावृत्ति है। ‘उत्तर देना’ परस्पर प्रत्युत्तर की मानवीकृत काव्य-छवि और शृंखला को बनाए रखता है।
- source_word: הַדָּגָן
  choice: अनाज
  rationale: דָּגָן सामान्य रूप से अन्न अथवा धान्य-उपज को दर्शाता है; आधुनिक हिन्दी में ‘अनाज’ सहज और व्यापक है।
- source_word: הַתִּירוֹשׁ
  choice: नई दाखमधु
  rationale: תִּירוֹשׁ सामान्यतः नई या ताज़ी दाखमधु का संकेत देता है। ‘नई दाखमधु’ कृषि-उपज की विशिष्टता को बनाए रखती है।
- source_word: הַיִּצְהָר
  choice: तेल
  rationale: יִצְהָר कृषि-उत्पाद के रूप में तेल, सामान्यतः जैतून के तेल, को दर्शाता है। मुख्य पाठ में ‘तेल’ स्वाभाविक है और मूल से अधिक विशिष्टता नहीं जोड़ता।
- source_word: וְהֵם
  choice: और वे
  rationale: बहुवचन सर्वनाम पहले उल्लिखित अनाज, नई दाखमधु और तेल की ओर सामूहिक रूप से संकेत करता है और उनका मानवीकरण बनाए रखता है।
- source_word: יִזְרְעֶאל
  choice: यिज्रेल
  rationale: व्यक्तिवाचक नाम को लिप्यंतरित किया गया है। होशे में इसके ‘परमेश्वर बोता है’ संबंधी शब्दार्थ और प्रतीकात्मक भूमिका को पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ‘उत्तर देना’ की पुनरावृत्त मानवीकृत छवि को रखना या उसे कृषि-आपूर्ति के स्पष्ट कथन में बदलना
  choice: दोनों स्थानों पर ‘उत्तर देना’ बनाए रखा गया
  alternative: धरती अनाज, नई दाखमधु और तेल उपजाएगी, और वे यिज्रेल की आवश्यकताएँ पूरी करेंगे
  rationale: आसपास के पदों में परमेश्वर से आकाश, आकाश से धरती, धरती से उपज और उपज से यिज्रेल तक प्रत्युत्तर की जानबूझकर रची गई शृंखला है। शाब्दिक पुनरावृत्ति पुनर्स्थापित सृष्टि की इसी साहित्यिक और धर्मवैज्ञानिक छवि को सुरक्षित रखती है।
- issue: यिज्रेल नाम के प्रतीकात्मक अर्थ को मुख्य पाठ में अनूदित करना या नाम बनाए रखना
  choice: मुख्य पाठ में ‘यिज्रेल’ नाम रखा गया
  alternative: परमेश्वर बोता है
  rationale: मूल में यह व्यक्तिवाचक नाम है, पर होशे में इसका अर्थ भी प्रतीकात्मक है। नाम को पाठ में और उसके अर्थ को पादटिप्पणी में रखना दोनों पहलुओं को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘उत्तर देगी/देंगे’ की कुछ असामान्य काव्यात्मकता जानबूझकर सुरक्षित है, क्योंकि वही मूल पद की मानवीकृत प्रत्युत्तर-शृंखला का केंद्रीय गुण है।
