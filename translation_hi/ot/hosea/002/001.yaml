source:
  edition: WLC
  text: וְֽ֠/הָיָה מִסְפַּ֤ר בְּנֵֽי יִשְׂרָאֵל֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹֽא יִמַּ֖ד וְ/לֹ֣א יִסָּפֵ֑ר וְֽ֠/הָיָה בִּ/מְק֞וֹם אֲשֶׁר יֵאָמֵ֤ר לָ/הֶם֙ לֹֽא עַמִּ֣/י אַתֶּ֔ם יֵאָמֵ֥ר לָ/הֶ֖ם בְּנֵ֥י אֵֽל חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/001.yaml
  text: Yet the number of the sons of Israel will be like the sand of the sea[a], which cannot be measured or counted; and in the place where it is said to them, “You are not my people,” it will be said to them, “Sons of the living God.”
translation:
  language: hi
  text: फिर भी इस्राएल के पुत्रों[a] की संख्या समुद्र की रेत के समान होगी, जिसे न मापा जा सकता है, न गिना जा सकता है। और जिस स्थान पर उनसे कहा जाता है, “तुम मेरी प्रजा नहीं हो,” उसी स्थान पर उनसे कहा जाएगा, “तुम जीवित परमेश्वर के पुत्र हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इस्राएल की संतान” और आगे “जीवित परमेश्वर की संतान” भी अनुवाद किया जा सकता है। इब्रानी में दोनों जगह पुल्लिंग बहुवचन “पुत्र” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: फिर भी ... होगी
  rationale: आरंभिक वाव पिछले न्याय-वचन से पुनर्स्थापना की प्रतिज्ञा की ओर तीखा मोड़ लाता है। “फिर भी” इस विरोधात्मक प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि भविष्य का भाव “होगी” से बना रहता है।
- source_word: מִסְפַּר בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों की संख्या
  rationale: “संख्या” संज्ञा के सीधे अर्थ को रखता है और आगे के मापने तथा गिनने के निषेध से संबंध बनाए रखता है। “पुत्रों” दोनों समानांतर पदबंधों में इब्रानी בְּנֵי के पुल्लिंग रूप को सुरक्षित रखता है।
- source_word: כְּחוֹל הַיָּם
  choice: समुद्र की रेत के समान
  rationale: यह असंख्यता का प्रचलित बाइबलीय उपमान है; यह अनुवाद औपचारिक समानता और प्रतिज्ञा-संबंधी प्रतिध्वनि दोनों को बनाए रखता है।
- source_word: אֲשֶׁר לֹא יִמַּד וְלֹא יִסָּפֵר
  choice: जिसे न मापा जा सकता है, न गिना जा सकता है
  rationale: निफ़अल अपूर्ण क्रियाएँ संदर्भ में व्यावहारिक असंभवता व्यक्त करती हैं। हिन्दी में यह रचना दोनों अलग क्रियाओं को स्पष्ट और स्वाभाविक रूप से रखती है।
- source_word: בִּמְקוֹם
  choice: जिस स्थान पर ... वहीं
  rationale: ठोस स्थानवाचक अभिव्यक्ति को बनाए रखने के साथ “वहीं” पुनरुक्त स्थान और प्रतिज्ञा के उलटाव को सहज हिन्दी में स्पष्ट करता है।
- source_word: יֵאָמֵר ... יֵאָמֵר
  choice: कहा जाता है ... कहा जाएगा
  rationale: दोनों निष्क्रिय रूप सुरक्षित रखे गए हैं, ताकि किसी अनिर्दिष्ट वक्ता की पहचान न जोड़ी जाए। पहला वर्तमान सामान्य कथन और दूसरा भविष्य की पुनर्स्थापना व्यक्त करता है।
- source_word: לֹא עַמִּי אַתֶּם
  choice: तुम मेरी प्रजा नहीं हो
  rationale: यह वाचा-संबंधी सूत्र को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ עַם के लिए “प्रजा” उपयुक्त सामूहिक और संबंधपरक शब्द है।
- source_word: בְּנֵי אֵל חָי
  choice: जीवित परमेश्वर के पुत्र
  rationale: “पुत्र” इब्रानी के पुल्लिंग बहुवचन को रखता और “इस्राएल के पुत्रों” के साथ साहित्यिक समानांतरता बनाए रखता है। אֵל के लिए “परमेश्वर” और חָי के लिए “जीवित” मानक तथा प्रसंगानुकूल हैं।
theological_decisions:
- issue: वाचा की पुनर्स्थापना में लिंगयुक्त पुत्रता की भाषा
  choice: “इस्राएल के पुत्रों” और “जीवित परमेश्वर के पुत्र”—दोनों में “पुत्र” रखा गया।
  alternative: “इस्राएल की संतान” और “जीवित परमेश्वर की संतान”
  rationale: इब्रानी दोनों स्थानों पर पुल्लिंग बहुवचन בְּנֵי प्रयोग करता है। “पुत्र” स्रोत की रूपगत विशेषता और पद के भीतर की साहित्यिक समानांतरता सुरक्षित रखता है; अधिक समावेशी स्वाभाविक विकल्प पादटिप्पणी में दिया गया है।
- issue: आरंभिक वाव का प्रवचनात्मक बल
  choice: “फिर भी”
  alternative: “और” अथवा “तब”
  rationale: निकट संदर्भ में न्याय के नामकरण से बहुगुणन और संबंध की पुनर्स्थापना की ओर उलटाव है। “फिर भी” बिना अतिरिक्त सिद्धांत जोड़े इस विरोधात्मक बल को व्यक्त करता है।
- issue: दो निष्क्रिय कथनों का वक्ता
  choice: 'निष्क्रिय रचना बनाए रखी गई: “कहा जाता है ... कहा जाएगा।”'
  alternative: “वे कहते हैं ... वे कहेंगे” अथवा परमेश्वर को स्पष्ट कर्ता बनाना
  rationale: इब्रानी में वक्ता अनिर्दिष्ट है। अनुवाद किसी विशेष कर्ता को जोड़कर इस वास्तविक अस्पष्टता को नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। “प्रजा” वाचा-संबंधी सामूहिक अर्थ को सहज रूप से व्यक्त करता है। समानांतरता बचाने के लिए कुछ औपचारिकता के साथ “पुत्रों” रखा गया है और अधिक स्वाभाविक सामूहिक विकल्प पादटिप्पणी में दिया गया है।
