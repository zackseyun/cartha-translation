source:
  edition: WLC
  text: וְ/נָתַ֨תִּי לָ֤/הּ אֶת כְּרָמֶ֨י/הָ֙ מִ/שָּׁ֔ם וְ/אֶת עֵ֥מֶק עָכ֖וֹר לְ/פֶ֣תַח תִּקְוָ֑ה וְ/עָ֤נְתָה שָּׁ֨מָּ/ה֙ כִּ/ימֵ֣י נְעוּרֶ֔י/הָ וִּ/כְ/י֖וֹם עֲלֹתָ֥/הּ מֵ/אֶֽרֶץ מִצְרָֽיִם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/017.yaml
  text: And from there I will give her her vineyards[a], and the Valley of Achor as a door of hope. There she will answer as in the days of her youth[b], as on the day when she came up from the land of Egypt.
translation:
  language: hi
  text: और वहीं से मैं उसे उसके दाख की बारियाँ दूँगा, और आकोर की घाटी[b] को आशा का द्वार बना दूँगा। वहाँ वह उत्तर देगी[a], जैसे अपनी जवानी के दिनों में उत्तर देती थी, जैसे उस दिन जब वह मिस्र देश से निकलकर आई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहाँ वह गाएगी।” इब्रानी क्रिया का अर्थ प्रत्युत्तर देना है और इस प्रसंग में वह गाकर प्रत्युत्तर देने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: आकोर की घाटी आकान के दण्ड से जुड़े स्थान की याद दिलाती है (यहोशू 7:24–26); यहाँ विपत्ति से जुड़ा स्थान आशा का द्वार बन जाता है।
    reason: cross_reference
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: और ... मैं ... दूँगा
  rationale: भविष्यसूचक संदर्भ में संयोजक सहित पूर्ण क्रिया भावी प्रतिज्ञा व्यक्त करती है; ‘दूँगा’ נתן का सीधा और स्वाभाविक अर्थ है।
- source_word: כְּרָמֶיהָ
  choice: उसके दाख की बारियाँ
  rationale: כֶּרֶם का अर्थ अंगूर की अलग-अलग बेलें नहीं, बल्कि दाख की बारी है; बहुवचन और स्त्रीलिंग संबंधसूचक प्रत्यय इस्राएल को स्त्री के रूप में संबोधित करते हैं।
- source_word: מִשָּׁם
  choice: वहीं से
  rationale: यह पिछले पद के जंगल/पुनर्स्थापना के स्थान से स्थानिक संबंध बनाए रखता है।
- source_word: עֵמֶק עָכוֹר
  choice: अकोर की तराई
  rationale: स्थान-नाम को लिप्यंतरित किया गया है और עֵמֶק के लिए स्वाभाविक हिन्दी ‘तराई’ चुना गया है।
- source_word: לְפֶתַח תִּקְוָה
  choice: आशा का द्वार बना दूँगा
  rationale: פֶּתַח का मूल बिंब ‘द्वार/प्रवेश’ है; לְ को कार्य अथवा परिणाम के रूप में व्यक्त करने के लिए हिन्दी में ‘बना दूँगा’ स्वाभाविक है।
- source_word: וְעָנְתָה שָּׁמָּה
  choice: वहाँ वह उत्तर देगी
  rationale: ענה का मूल अर्थ ‘उत्तर देना/प्रत्युत्तर देना’ है। प्रसंग में गाने की छाया संभव है, पर मुख्य पाठ व्यापक मूल अर्थ को सुरक्षित रखता है।
- source_word: כִּימֵי נְעוּרֶיהָ
  choice: जैसे अपनी जवानी के दिनों में देती थी
  rationale: तुलना को हिन्दी में पूर्ण और सहज बनाने के लिए ‘उत्तर’ की क्रिया निहित रूप से दोहराई गई है; वाक्यांश इस्राएल की आरंभिक अवस्था को स्मरण कराता है।
- source_word: וּכְיוֹם עֲלֹתָהּ מֵאֶרֶץ מִצְרָיִם
  choice: जैसे उस दिन जब वह मिस्र देश से निकलकर आई थी
  rationale: עלה מן यहाँ निर्गमन को व्यक्त करता है। शाब्दिक ‘ऊपर आई’ आधुनिक हिन्दी में भ्रामक या अस्वाभाविक होता, इसलिए ‘निकलकर आई’ से ऐतिहासिक गमन का अर्थ स्पष्ट रखा गया है।
theological_decisions:
- issue: पुनर्स्थापना के प्रसंग में וְעָנְתָה का अर्थ
  choice: मुख्य पाठ में ‘वह उत्तर देगी’
  alternative: ‘वह गाएगी’ अथवा ‘वह गीत में प्रत्युत्तर देगी’
  rationale: क्रिया का मूल अर्थ उत्तर देना है। निर्गमन और नए आनंद के संदर्भ में गायन संभव है, किंतु इब्रानी इसे अनिवार्य नहीं करता; इसलिए संकीर्ण अर्थ को मुख्य पाठ में आरोपित न करके पादटिप्पणी में रखा गया है।
- issue: अकोर की तराई का संकेत
  choice: स्थान-नाम और आशा में उसके रूपांतरण को मुख्य पाठ में बनाए रखा
  alternative: नाम का अर्थ खोलकर ‘विपत्ति की तराई’ कहना
  rationale: मूल पाठ वास्तविक स्थान-नाम עָכוֹר का प्रयोग करता है, जो यहोशू 7 की स्मृति जगाता है। नाम का अनुवाद कर देना ऐतिहासिक संकेत को धुँधला कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘दाख की बारियाँ’, ‘अकोर की तराई’ और ‘आशा का द्वार’ मूल के कृषि, स्थानिक और रूपक बिंबों को बनाए रखते हैं। पादटिप्पणी [a] संबंधित क्रिया के बाद रखी गई है; [b] पद के अंत में रखा गया है क्योंकि उसका स्पष्टीकरण अकोर और पूरे रूपांतरण-बिंब से जुड़ा है।
