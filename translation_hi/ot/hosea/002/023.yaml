source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא אֶֽעֱנֶה֙ נְאֻם יְהוָ֔ה אֶעֱנֶ֖ה אֶת הַ/שָּׁמָ֑יִם וְ/הֵ֖ם יַעֲנ֥וּ אֶת הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/023.yaml
  text: And it shall happen in that day[a], declares Yahweh, that I will answer the heavens, and they shall answer the earth.
translation:
  language: hi
  text: “उस दिन ऐसा होगा,” याहवे की यह घोषणा है, “मैं आकाश को उत्तर दूँगा, और वह धरती[a] को उत्तर देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देश।’ इब्रानी אֶרֶץ का अर्थ ‘धरती’ या ‘देश’ दोनों हो सकता है। यहाँ आकाश के साथ काव्यात्मक युग्म बनाए रखने के लिए ‘धरती’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ऐसा होगा
  rationale: यह भविष्य के दृश्य का परिचय देता है। ‘ऐसा होगा’ आधुनिक हिन्दी में स्वाभाविक है और भविष्यसूचक कथन का भाव बनाए रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यवाणी में प्रयुक्त मानक समय-सूचक पद है; ‘उस दिन’ हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: אֶעֱנֶה / יַעֲנוּ
  choice: उत्तर दूँगा / उत्तर देगा
  rationale: मूल में ענה की पुनरावृत्ति परमेश्वर, आकाश और धरती के बीच काव्यात्मक प्रत्युत्तर-शृंखला बनाती है। उसी क्रिया को दोहराकर इस शब्द-क्रीड़ा को सुरक्षित रखा गया है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह भविष्यद्वक्ताओं की प्रामाणिक घोषणा का सूत्र है। यह रूप भारयुक्त होने के साथ आधुनिक हिन्दी में स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यंजनात्मक नाम יהוה को किसी उपाधि से बदलने के बजाय व्यक्तिगत वाचा-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: הַשָּׁמַיִם
  choice: आकाश
  rationale: इब्रानी शब्द रूप की दृष्टि से बहुवचन है, पर आधुनिक हिन्दी में ‘आकाश’ इस समष्टिगत अर्थ और धरती के साथ उसके काव्यात्मक युग्म को अधिक स्वाभाविक ढंग से व्यक्त करता है। अस्पष्ट सर्वनाम से बचने के लिए दूसरी बार भी ‘आकाश’ दोहराया गया है।
- source_word: הָאָרֶץ
  choice: धरती
  rationale: आकाश–धरती का काव्यात्मक युग्म और आगे आने वाली कृषि-संबंधी प्रत्युत्तर-शृंखला यहाँ ‘धरती’ का समर्थन करती है; ‘देश’ भी संदर्भतः संभव है और उसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसका व्यापक रूप से मान्य आधुनिक लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: ענה की बार-बार आने वाली काव्यात्मक छवि
  choice: ‘उत्तर देना’ की भाषा और उसकी पुनरावृत्ति बनाए रखना
  alternative: इसे व्याख्यात्मक रूप से ‘वर्षा देना’ या ‘उपजाऊ बनाना’ कहना
  rationale: इब्रानी पाठ कृषि-संबंधी आशय को रूपकात्मक प्रत्युत्तर-शृंखला के द्वारा व्यक्त करता है। स्पष्ट व्याख्या रूपक और उसके धर्मवैचारिक तनाव को समय से पहले समाप्त कर देती।
- issue: הָאָרֶץ का आशय
  choice: धरती
  alternative: देश
  rationale: ‘आकाश’ के साथ काव्यात्मक समानांतरता ‘धरती’ के पक्ष में है, किंतु होशे के इस्राएल-केंद्रित संदर्भ में ‘देश’ भी वास्तविक संभावना है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। उद्धरण-विन्यास से भविष्यसूचक घोषणा का सूत्र अलग दिखता है। ‘प्रत्युत्तर’ की अपेक्षा अधिक सहज ‘उत्तर’ चुना गया, जबकि मूल की पुनरावृत्ति और सजीवीकरण सुरक्षित हैं।
