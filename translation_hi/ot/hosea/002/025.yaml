id: HOS.2.25
reference: Hosea 2:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/זְרַעְתִּ֤י/הָ לִּ/י֙ בָּ/אָ֔רֶץ וְ/רִֽחַמְתִּ֖י אֶת לֹ֣א רֻחָ֑מָה וְ/אָמַרְתִּ֤י לְ/לֹֽא עַמִּי֙ עַמִּ/י אַ֔תָּה וְ/ה֖וּא יֹאמַ֥ר אֱלֹהָֽ/י־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/025.yaml
  text: And I will sow her for myself in the land[a], and I will have mercy on No Mercy, and I will say to Not My People, ‘You are my people,’ and he will say[c][b], ‘My God.’
translation:
  language: hi
  text: और मैं उसे अपने लिए देश में बोऊँगा[a]। मैं ‘दया न पाई’[b] पर दया करूँगा, और ‘मेरी प्रजा नहीं’[b] से कहूँगा, ‘तू मेरी प्रजा है।’ और वह कहेगा[c], ‘मेरे परमेश्वर!’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पृथ्वी पर।’ इब्रानी शब्द का अर्थ ‘देश/भूमि’ और ‘पृथ्वी’ दोनों हो सकता है; यहाँ वाचा की पुनर्स्थापना के प्रसंग में ‘देश’ लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: ये प्रतीकात्मक नाम परंपरागत रूप से ‘लो-रुहामा’ और ‘लो-अम्मी’ लिखे जाते हैं। यहाँ इनके अर्थ का अनुवाद किया गया है ताकि न्याय के नामों का पुनर्स्थापना में उलट जाना स्पष्ट रहे।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में ‘वह कहेगा’ पुल्लिंग एकवचन है; संभवतः पुनर्स्थापित प्रजा को एक व्यक्ति के रूप में प्रस्तुत किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתִּיהָ
  choice: और मैं उसे बोऊँगा
  rationale: זרע का कृषि-संबंधी अर्थ ‘बोना’ है। यह यिज्रेल से जुड़े शब्द-खेल और न्याय के उलटकर पुनर्स्थापना बनने की छवि को बनाए रखता है। स्त्रीलिंग एकवचन प्रत्यय का संदर्भ अस्पष्ट छोड़ा गया है; ‘उसे’ हिंदी में स्वाभाविक है और अनावश्यक रूप से संदर्भ तय नहीं करता।
- source_word: לִּי
  choice: अपने लिए
  rationale: यह लाभ अथवा अधिकार का भाव देता है और परमेश्वर द्वारा फिर से अपना बनाए जाने को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। होशे के वाचा और पुनर्स्थापना के प्रसंग में ‘देश’ अधिक सुसंगत है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְרִחַמְתִּי
  choice: मैं दया करूँगा
  rationale: רחם करुणा अथवा दया दिखाने को व्यक्त करता है। ‘दया करूँगा’ आधुनिक हिंदी में सहज है और प्रतीकात्मक नाम के उलटाव को स्पष्ट रखता है।
- source_word: לֹא רֻחָמָה
  choice: दया न पाई
  rationale: प्रतीकात्मक नाम का अर्थ अनूदित किया गया है ताकि न्याय से पुनर्स्थापना की ओर होने वाला शब्द-खेल दिखाई दे। स्त्रीलिंग रूप ‘पाई’ मूल नाम के स्त्रीलिंग को भी दर्शाता है।
- source_word: לְלֹא עַמִּי
  choice: ‘मेरी प्रजा नहीं’ से
  rationale: प्रतीकात्मक नाम का अनुवाद उसके वाचागत उलटाव को तुरंत समझने योग्य बनाता है।
- source_word: עַמִּי אַתָּה
  choice: तू मेरी प्रजा है
  rationale: यह प्रत्यक्ष वाचा-सूत्र है। एकवचन संबोधन को ‘तू’ से बनाए रखा गया है; यहाँ यह सामूहिक प्रजा को एक व्यक्ति के रूप में संबोधित करता है।
- source_word: וְהוּא יֹאמַר
  choice: और वह कहेगा
  rationale: मूल में सर्वनाम और क्रिया पुल्लिंग एकवचन हैं। ‘वह कहेगा’ इस रूप को बनाए रखता है और बहुवचन बनाकर अर्थ को समतल नहीं करता।
- source_word: אֱלֹהָי
  choice: मेरे परमेश्वर!
  rationale: यह वाचा-संबंधी प्रत्युत्तर है। विस्मयादिबोधक विराम चिह्न संक्षिप्त स्वीकारोक्ति की पुकार-जैसी शक्ति को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: प्रतीकात्मक वाचा-नामों का अनुवाद या लिप्यंतरण
  choice: मुख्य पाठ में ‘दया न पाई’ और ‘मेरी प्रजा नहीं’
  alternative: ‘लो-रुहामा’ और ‘लो-अम्मी’
  rationale: पद का धार्मिक और आलंकारिक बल इन न्याय-सूचक नामों के उलटकर पुनर्स्थापना-सूचक कथनों में बदलने पर निर्भर है। अर्थानुवाद यह संबंध पाठक के लिए स्पष्ट करता है; पारंपरिक लिप्यंतरण पादटिप्पणी में सुरक्षित हैं।
- issue: पुनर्स्थापित प्रजा का पुल्लिंग एकवचन प्रत्युत्तर
  choice: ‘वह कहेगा’ बनाए रखना
  alternative: ‘वे कहेंगे’
  rationale: इब्रानी पाठ स्पष्ट रूप से पुल्लिंग एकवचन प्रयोग करता है और पुनर्स्थापित प्रजा को एक सामूहिक व्यक्ति के रूप में प्रस्तुत करता है। बहुवचन करना इस साहित्यिक तनाव को मिटा देता।
- issue: אֶרֶץ का स्थानीय या सार्वभौमिक अर्थ
  choice: ‘देश’
  alternative: ‘पृथ्वी’
  rationale: वाचा और पुनर्स्थापना के निकट प्रसंग में ‘देश’ अधिक विशिष्ट है, पर मूल शब्द की व्यापक संभाव्यता पादटिप्पणी में स्वीकार की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। प्रतीकात्मक नामों को उद्धरण-चिह्नों में रखकर नाम और कथन दोनों का प्रभाव बनाए रखा गया है। एकवचन ‘तू’ तथा ‘वह कहेगा’ मूल की व्याकरणिक और सामूहिक-व्यक्तिकरण संबंधी विशेषता को सुरक्षित रखते हैं।
