    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: और
  rationale: संयोजक अगले कथन को जोड़ता है, जबकि אֶת केवल निश्चित कर्म को चिह्नित करता है और हिन्दी में अलग से अनूदित नहीं होता।
- source_word: בָּנֶיהָ
  choice: उसके बच्चों
  rationale: בנים का अर्थ ‘पुत्र’ हो सकता है, पर यह सामान्य रूप से संतान के लिए भी प्रयुक्त होता है; यहाँ ‘बच्चों’ से अनावश्यक रूप से केवल पुरुष संतानों का अर्थ नहीं निकलता।
- source_word: לֹא אֲרַחֵם
  choice: मैं दया नहीं करूँगा
  rationale: רחם का पिएल रूप दया या करुणा दिखाने को व्यक्त करता है। ‘दया नहीं करूँगा’ आधुनिक हिन्दी में स्वाभाविक है और कथन की कठोर वाचा-संबंधी शक्ति बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי दया न करने का कारण बताता है; ‘क्योंकि’ इस कारणात्मक संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְנֵי זְנוּנִים
  choice: व्यभिचार की संतान
  rationale: यह पदबंध यौन अनैतिकता की तीखी भविष्यद्वक्तीय छवि रखता है और होशे की वाचा-विमुखता की उपमा से जुड़ा है। ‘व्यभिचार की संतान’ आधुनिक हिन्दी में समझने योग्य रहते हुए उस नैतिक और यौन बल को सुरक्षित रखता है।
- source_word: הֵמָּה
  choice: वे … हैं
  rationale: स्वतंत्र सर्वनाम कथन को बल देता है। हिन्दी में स्पष्ट ‘वे’ और ‘हैं’ से यह विधेय स्वाभाविक रूप में व्यक्त होता है।
theological_decisions:
- issue: होशे के विवाह-रूपक में בְנֵי זְנוּנִים के आरोप का अनुवाद
  choice: व्यभिचार की संतान
  alternative: वेश्यावृत्ति से जन्मी संतान; वाचा के प्रति बेवफाई की संतान
  rationale: मूल पाठ की कठोर यौन छवि को केवल अमूर्त ‘बेवफाई’ बनाकर नरम नहीं किया गया। साथ ही अनुवाद बच्चों के वास्तविक जैविक पितृत्व के बारे में मूल पाठ से आगे कोई संकीर्ण दावा नहीं करता; यौन और वाचा-संबंधी दोनों संकेतों का तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘दया नहीं करूँगा’ सहज हिन्दी है, जबकि ‘व्यभिचार की संतान’ भविष्यद्वक्तीय कथन की कठोरता और रूपकात्मक तनाव को बनाए रखता है।
