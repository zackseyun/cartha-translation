id: HOS.2.3
reference: Hosea 2:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִמְר֥וּ לַ/אֲחֵי/כֶ֖ם עַמִּ֑/י וְ/לַ/אֲחֽוֹתֵי/כֶ֖ם רֻחָֽמָה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/003.yaml
  text: Say to your brothers[a], “My people,” and to your sisters[b], “Shown mercy.”
translation:
  language: hi
  text: अपने भाइयों से कहो, “मेरी प्रजा”[a], और अपनी बहनों से, “जिस पर दया की गई”[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “अम्मी,” एक प्रतीकात्मक नाम, जिसका अर्थ है “मेरी प्रजा।”'
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: “रुहामा,” एक प्रतीकात्मक नाम, जिसका अर्थ है “जिस पर दया की गई” या “जिस पर करुणा की गई।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: कहो
  rationale: यह אמר का बहुवचन आज्ञार्थक रूप है। ‘कहो’ कथन की सीधी आज्ञा को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: לַאֲחֵיכֶם
  choice: अपने भाइयों से
  rationale: इब्रानी में पुरुषवाचक बहुवचन संज्ञा और द्वितीय पुरुष बहुवचन प्रत्यय स्पष्ट हैं। अगले समानांतर पद में ‘बहनों’ का अलग उल्लेख होने के कारण दोनों समूहों को अलग रखा गया है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: इसका अर्थ ‘मेरी प्रजा’ है और यह होशे की प्रतीकात्मक नामावली में ‘अम्मी’ नाम की गूँज भी है। अर्थ को मुख्य पाठ में और नाम-रूप को पाद-टिप्पणी में रखा गया है।
- source_word: וְלַאֲחוֹתֵיכֶם
  choice: और अपनी बहनों से
  rationale: इब्रानी में स्त्रीवाचक बहुवचन ‘बहनें’ स्पष्ट है; इसलिए इसे किसी सामान्य सामूहिक शब्द में नहीं मिलाया गया।
- source_word: רֻחָמָה
  choice: जिस पर दया की गई
  rationale: רחם से बना यह स्त्रीलिंग निष्क्रिय रूप दया या करुणा पाए होने का भाव देता है। यह हिन्दी अभिव्यक्ति निष्क्रिय अर्थ और स्त्रीलिंग संदर्भ दोनों को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: होशे के प्रतीकात्मक नामों को मुख्य पाठ में लिप्यंतरित किया जाए या उनका अर्थ दिया जाए
  choice: मुख्य पाठ में नामों का अर्थ—‘मेरी प्रजा’ और ‘जिस पर दया की गई’—दिया गया है; लिप्यंतरित नाम पाद-टिप्पणियों में रखे गए हैं।
  alternative: मुख्य पाठ में सीधे ‘अम्मी’ और ‘रुहामा’ लिखा जा सकता था।
  rationale: इन नामों का भविष्यसूचक अर्थ पुनर्स्थापना के उलटाव के लिए केंद्रीय है। अर्थ का अनुवाद सामान्य पाठक तक यह बल सीधे पहुँचाता है, जबकि पाद-टिप्पणियाँ नाम-रूप और अन्य पदों से उसके संबंध को सुरक्षित रखती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष आज्ञार्थक प्रयोग किया गया है। ‘प्रजा’ परमेश्वर और उसके लोगों के वाचा-संबंध को स्वाभाविक बाइबलीय हिन्दी में व्यक्त करता है। निष्क्रिय स्त्रीलिंग वाक्यांश ‘जिस पर दया की गई’ मूल के रूप और अर्थ को बनाए रखता है।
