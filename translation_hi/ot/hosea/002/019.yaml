source:
  edition: WLC
  text: וַ/הֲסִרֹתִ֛י אֶת שְׁמ֥וֹת הַ/בְּעָלִ֖ים מִ/פִּ֑י/הָ וְ/לֹֽא יִזָּכְר֥וּ ע֖וֹד בִּ/שְׁמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/019.yaml
  text: And I will remove the names of the Baals from her mouth[a], and they will no longer be remembered by name.
translation:
  language: hi
  text: और मैं उसके मुँह से बाल देवताओं के नाम हटा दूँगा[a], और फिर कभी उनका नाम लेकर स्मरण नहीं किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और फिर कभी उनका उल्लेख नहीं किया जाएगा।” इब्रानी क्रिया का अर्थ “स्मरण किया जाना” या “उल्लेख किया जाना” दोनों हो सकता है; इस प्रसंग में दोनों अर्थ बाल-उपासना के अन्त की ओर संकेत करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: और मैं…हटा दूँगा
  rationale: הסיר के हिफ़ील रूप में यहाँ किसी वस्तु को दूर कर देने का कारक अर्थ है। ‘हटा दूँगा’ आधुनिक हिन्दी में स्वाभाविक है और ‘नामों’ के साथ ठीक बैठता है।
- source_word: שְׁמוֹת הַבְּעָלִים
  choice: बाल देवताओं के नाम
  rationale: बहुवचन הַבְּעָלִים यहाँ कनानी बाल देवताओं को सूचित करता है, सामान्य ‘स्वामियों’ को नहीं। हिन्दी पाठक के लिए ‘देवताओं’ जोड़ने से सन्दर्भ स्पष्ट होता है, जबकि ‘बाल’ नाम और उसका बहुवचन आशय बने रहते हैं।
- source_word: מִפִּיהָ
  choice: उसके मुँह से
  rationale: यह मूल इब्रानी बिंब को सुरक्षित रखता है और नामों के उच्चारण अथवा आराधनात्मक आह्वान के बन्द होने की ओर संकेत करता है।
- source_word: וְלֹא יִזָּכְרוּ עוֹד
  choice: और फिर वे…याद नहीं किए जाएँगे
  rationale: זכר का निफ़अल रूप ‘याद किया जाना’ और ‘उल्लेख किया जाना’ दोनों अर्थ दे सकता है। मुख्य पाठ में अधिक सीधा ‘याद नहीं किए जाएँगे’ रखा गया है और दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: בִּשְׁמָם
  choice: नाम लेकर
  rationale: शाब्दिक रूप में एकवचन ‘उनके नाम से’ है, पर हिन्दी में ‘नाम लेकर’ स्वाभाविक मुहावरा है और नामपूर्वक स्मरण या उल्लेख का भाव व्यक्त करता है।
theological_decisions:
- issue: ‘बालों’ का अभिप्राय
  choice: कनानी बाल देवता, जिनकी उपासना इस्राएल की वाचा-विमुखता से जुड़ी थी
  alternative: सामान्य अर्थ में ‘स्वामी’ या ‘मालिक’
  rationale: होशे के विवाह-रूपक और मूर्तिपूजा-विरोधी प्रसंग में यह बहुवचन मूर्तिपूजक देवताओं की ओर संकेत करता है। ‘बाल देवताओं’ से यह आशय स्पष्ट होता है, बिना किसी सम्प्रदायगत व्याख्या को जोड़े।
- issue: זכר का अर्थ
  choice: ‘याद किया जाना’ मुख्य पाठ में
  alternative: ‘उल्लेख किया जाना’
  rationale: इब्रानी क्रिया दोनों अर्थों को ग्रहण कर सकती है; प्रसंग में दोनों ही बाल-उपासना और उसके आह्वान के अन्त को व्यक्त करते हैं। इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘बाल देवताओं’ से अपरिचित पाठक के लिए धार्मिक सन्दर्भ स्पष्ट होता है; ‘उसके मुँह से’ मूल रूपक को बनाए रखता है।
