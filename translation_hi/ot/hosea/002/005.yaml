base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/005.yaml
  text: or else I will strip her naked and expose her as on the day she was born[a], and make her like the wilderness, and make her like a parched land[b], and let her die of thirst.
translation:
  language: hi
  text: नहीं तो[a] मैं उसे नंगा कर दूँगा और उसे वैसा ही खड़ा करूँगा जैसी वह अपने जन्म के दिन थी; मैं उसे निर्जन प्रदेश के समान और सूखी भूमि के समान बना दूँगा, और उसे प्यास से मार डालूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कहीं ऐसा न हो कि।” इब्रानी कण को अधिक औपचारिक रूप में इस प्रकार भी अनूदित किया जा सकता है; यहाँ यह चेतावनी में बताए गए परिणाम का परिचय देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: नहीं तो
  rationale: यह कण पिछले आदेश का पालन न होने पर आने वाले परिणाम की चेतावनी देता है। आधुनिक हिन्दी में ‘नहीं तो’ इस चेतावनी-भाव को स्वाभाविक ढंग से व्यक्त करता है; अधिक औपचारिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אַפְשִׁיטֶנָּה עֲרֻמָּה
  choice: मैं उसे नंगा कर दूँगा
  rationale: हिफ़ील क्रिया और परिणामसूचक विशेषण मिलकर वस्त्र उतारकर नग्न कर देने का सीधा और कठोर चित्र प्रस्तुत करते हैं।
- source_word: וְהִצַּגְתִּיהָ כְּיוֹם הִוָּלְדָהּ
  choice: उसे वैसी ही अवस्था में ला खड़ा करूँगा जैसी उसके जन्म के दिन थी
  rationale: הציג का खड़ा करने या किसी अवस्था में प्रस्तुत करने का भाव बनाए रखा गया है, जबकि तुलना को स्वाभाविक हिन्दी में व्यक्त किया गया है। ‘सबके सामने’ नहीं जोड़ा गया, क्योंकि सार्वजनिक प्रदर्शन का भाव संदर्भ में संभव होते हुए भी क्रिया में स्पष्ट नहीं है।
- source_word: וְשַׂמְתִּיהָ כַמִּדְבָּר
  choice: मैं उसे निर्जन प्रदेश के समान बना दूँगा
  rationale: מִדְבָּר निर्जन, उजाड़ और शुष्क क्षेत्र को सूचित कर सकता है। ‘निर्जन प्रदेश’ केवल रेतीले रेगिस्तान तक अर्थ को सीमित नहीं करता।
- source_word: וְשַׁתִּהָ כְּאֶרֶץ צִיָּה
  choice: सूखी भूमि के समान बना दूँगा
  rationale: צִיָּה सूखे और जलहीन भूभाग को दर्शाता है। यह सरल हिन्दी में पिछले निर्जनता के चित्र को और तीव्र करता है।
- source_word: וַהֲמִתִּיהָ בַּצָּמָא
  choice: उसे प्यास से मार डालूँगा
  rationale: हिफ़ील रूप स्पष्ट रूप से मृत्यु का कारण बनने का भाव देता है। ‘मार डालूँगा’ इस कारक बल को ‘मरने दूँगा’ की अपेक्षा अधिक ठीक ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: अविश्वासी स्त्री/इस्राएल के विरुद्ध न्याय का रूपक
  choice: नग्नता, निर्जनता, सूखी भूमि और प्यास से मृत्यु के ठोस चित्रों को यथावत रखना
  alternative: इसे केवल अपमान, अभाव या सामान्य दण्ड के अमूर्त कथन में बदल देना
  rationale: पद की वाचा-संबंधी न्याय की तीव्रता इन्हीं कठोर रूपकों के द्वारा व्यक्त होती है। अनुवाद रूपक की पहचान को किसी एक व्याख्यात्मक निष्कर्ष में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए स्पष्ट रखी गई है। समानान्तर वाक्यरचना और न्याय के कठोर चित्र सुरक्षित हैं। ‘सबके सामने’ जैसी संदर्भगत परन्तु स्रोत में अनिर्दिष्ट बात नहीं जोड़ी गई।
