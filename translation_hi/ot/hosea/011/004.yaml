source:
  edition: WLC
  text: בְּ/חַבְלֵ֨י אָדָ֤ם אֶמְשְׁכֵ/ם֙ בַּ/עֲבֹת֣וֹת אַהֲבָ֔ה וָ/אֶהְיֶ֥ה לָ/הֶ֛ם כִּ/מְרִ֥ימֵי עֹ֖ל עַ֣ל לְחֵי/הֶ֑ם וְ/אַ֥ט אֵלָ֖י/ו אוֹכִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/004.yaml
  text: I drew them with cords of a man[a], with ropes of love; and I was to them like those who lift a yoke from their jaws[b], and I bent down to him and fed him.
translation:
  language: hi
  text: मैंने उन्हें मनुष्य की डोरियों से[a], प्रेम की रस्सियों से खींचा; और मैं उनके लिए उनके जबड़ों पर से जूआ उठानेवालों के समान था, और मैं उसकी ओर झुका और उसे खिलाया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानवीय डोरियों से।” इब्रानी मुहावरा पशुओं के साथ कठोर व्यवहार के विपरीत मानवीय और कोमल ढंग से ले चलने पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में यहाँ एकवचन है: “उसकी ओर ... उसे खिलाया”; निकटवर्ती बहुवचन के अनुसार कुछ अनुवाद इसे “उनकी ओर ... उन्हें खिलाया” करते हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחַבְלֵי אָדָם
  choice: मनुष्य की डोरियों से
  rationale: यह पदबंध मूल इब्रानी मुहावरे और חבל के ‘डोरी’ अर्थ को बनाए रखता है। אָדָם यहाँ मानवीय अथवा कोमल व्यवहार की ओर संकेत कर सकता है; इस अर्थ-संभावना को पादटिप्पणी में रखा गया है।
- source_word: אֶמְשְׁכֵם
  choice: मैंने उन्हें ... खींचा
  rationale: משך का मूल अर्थ ‘खींचना’ है। यह डोरियों के ठोस बिंब और प्रेमपूर्वक अपनी ओर लाने के रूपक, दोनों को सुरक्षित रखता है।
- source_word: בַּעֲבֹתוֹת אַהֲבָה
  choice: प्रेम की रस्सियों से
  rationale: עֲבֹתוֹת मोटी डोरियों या रस्सियों को दर्शाता है। पहले पद के ‘डोरियों’ से शब्दगत भेद रखते हुए ‘रस्सियों’ का प्रयोग किया गया है।
- source_word: וָאֶהְיֶה לָהֶם
  choice: मैं उनके लिए ऐसा था
  rationale: यह आगामी उपमा से स्वाभाविक रूप से जुड़ता है और इब्रानी संबंधसूचक अभिव्यक्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: כִּמְרִימֵי עֹל
  choice: जैसे ... जूआ उठा देनेवाले
  rationale: ‘उठानेवाले’ मूल के बहुवचन कृदंत को बनाए रखता है और असामान्य वचन को एकवचन बनाकर नहीं सुलझाता।
- source_word: עַל לְחֵיהֶם
  choice: उनके जबड़ों पर से
  rationale: לְחִי का अर्थ ‘गाल’ या ‘जबड़ा’ हो सकता है। पशुपालन और जूए के बिंब में ‘जबड़े’ अधिक स्पष्ट है; עַל की उपस्थिति के कारण ‘पर से’ रखा गया है।
- source_word: וְאַט
  choice: मैं ... झुका
  rationale: यह कठिन रूप झुकने अथवा धीरे नीचे करने के भाव से समझा गया है। ‘झुका’ आधुनिक हिन्दी में संक्षिप्त और बिंबात्मक है।
- source_word: אֵלָיו אוֹכִיל
  choice: उसकी ओर ... उसे खिलाया
  rationale: मसोरेटी पाठ में सर्वनाम एकवचन है। उसे बहुवचन बनाकर समतल करने के बजाय हिन्दी में एकवचन सुरक्षित रखा गया है; Hiphil אוֹכִיל का स्वाभाविक अर्थ ‘खिलाया’ है।
theological_decisions:
- issue: परमेश्वर की देखभाल का मानवीय और पशुपालकीय बिंब
  choice: खींचने, जूआ उठाने, झुकने और खिलाने के ठोस बिंबों को बनाए रखा गया है।
  alternative: इसे केवल ‘मैंने प्रेम से उनकी अगुवाई और देखभाल की’ जैसे अमूर्त कथन में व्यक्त करना।
  rationale: मूल पाठ परमेश्वर की कोमलता और अधिकार को एक साथ चित्रित करता है। बिंबों को अमूर्त करने से यह तनाव और काव्यात्मक शक्ति घट जाती।
- issue: बहुवचन संदर्भों के बाद אֵלָיו का एकवचन
  choice: मुख्य पाठ में ‘उसकी ओर’ और ‘उसे’ रखा गया है।
  alternative: संदर्भ के अनुसार ‘उनकी ओर’ और ‘उन्हें’ करना।
  rationale: मूल मसोरेटी पाठ के वचन-परिवर्तन को सुरक्षित रखा गया है। संभव है कि इस्राएल को सामूहिक रूप से एक इकाई या पुत्र माना गया हो, पर मुख्य पाठ में इस संभावना को निश्चित व्याख्या नहीं बनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी अपनाई गई है। ‘डोरियाँ’, ‘रस्सियाँ’, ‘जूआ’, ‘जबड़े’, ‘झुका’ और ‘खिलाया’ मूल के ठोस ग्रामीण-पशुपालकीय बिंब सुरक्षित रखते हैं। ‘उठा देनेवाले’ में मूल बहुवचन तथा अंतिम खंड में मूल एकवचन जानबूझकर बनाए रखे गए हैं।
