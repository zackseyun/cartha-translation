  text: וְ/חָלָ֥ה חֶ֨רֶב֙ בְּ/עָרָ֔י/ו וְ/כִלְּתָ֥ה בַדָּ֖י/ו וְ/אָכָ֑לָה מִֽ/מֹּעֲצ֖וֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/006.yaml
  text: A sword will whirl through his cities[a], and will consume his bars[b], and devour them because of their counsels.
translation:
  language: hi
  text: तलवार उसके नगरों में उग्रता से घूमेगी[a], उसके फाटकों की अर्गलाओं को नष्ट कर देगी[b], और उनकी युक्तियों के कारण भस्म करती जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके नगरों में गिरेगी” अथवा “उसके नगरों में उग्रता से चलेगी।” इब्रानी क्रिया कठिन है और घूमने, गिरने, या तड़पती/उग्र गति करने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “उसकी अर्गलाओं को।” कुछ लोग इब्रानी शब्द का अर्थ “उसके शासक” समझते हैं, पर आक्रमणग्रस्त नगरों का संदर्भ फाटकों की रक्षात्मक अर्गलाओं के पक्ष में है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְחָלָה
  choice: चक्कर काटेगी
  rationale: क्रिया का अर्थ यहाँ कठिन और अनिश्चित है। तलवार के साथ यह हिंसक घूमने या नगरों में विनाशकारी ढंग से फैलने का चित्र देता है; इसलिए मुख्य पाठ में स्वाभाविक काव्यात्मक अभिव्यक्ति रखी गई और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: חֶרֶב
  choice: तलवार
  rationale: इब्रानी में ठोस एकवचन संज्ञा है, जो व्यापक रूप से युद्ध या हिंसक आक्रमण का भी प्रतिनिधित्व कर सकती है।
- source_word: בְּעָרָיו
  choice: उसके नगरों में
  rationale: पूर्वसर्ग ב का सामान्य अर्थ ‘में’ है। यह अनुवाद इब्रानी संरचना और एकवचन प्रत्यय ‘उसके’ को बनाए रखता है।
- source_word: וְכִלְּתָה
  choice: नष्ट कर देगी
  rationale: כלה समाप्त कर देने या पूरी तरह मिटा देने का भाव रखता है। नगर की सुरक्षा के बेड़ों के संदर्भ में ‘नष्ट कर देगी’ स्पष्ट और स्वाभाविक है।
- source_word: בַדָּיו
  choice: उसके बेड़ों को
  rationale: בדים डंडों या बेड़ों को सूचित कर सकता है। आक्रमण के शहरी संदर्भ में फाटकों को सुरक्षित करने वाले बेड़े सबसे उपयुक्त अर्थ हैं, यद्यपि ‘शासक’ भी प्रस्तावित किया गया है।
- source_word: וְאָכָלָה
  choice: निगल जाएगी
  rationale: אכל का मूल अर्थ खाना या निगलना है। तलवार के मानवीकरण और विनाश की सजीव काव्यात्मकता को ‘निगल जाएगी’ बनाए रखता है।
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: उनकी युक्तियों के कारण
  rationale: מן को यहाँ कारणवाचक समझना संदर्भानुकूल है। ‘युक्तियाँ’ עצה के परामर्श, योजना या चाल के अर्थ-क्षेत्र को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: एकवचन और बहुवचन सर्वनाम-प्रत्ययों का बदलाव
  choice: ‘उसके नगरों ... उसके बेड़ों’ के बाद ‘उनकी युक्तियों ... उन्हें’
  alternative: सभी प्रत्ययों को बहुवचन करके ‘उनके नगरों ... उनके बेड़ों’ करना
  rationale: इब्रानी पाठ पहले एकवचन और अंत में बहुवचन प्रत्यय प्रयोग करता है। यह बदलाव संभवतः इस्राएल/एप्रैम को एक सामूहिक व्यक्ति और फिर अनेक लोगों के रूप में प्रस्तुत करता है; इसलिए इसे समतल नहीं किया गया।
- issue: וְאָכָלָה का निहित कर्म
  choice: हिन्दी में स्वाभाविक वाक्य के लिए ‘उन्हें’ जोड़ा गया
  alternative: कर्म व्यक्त किए बिना ‘और निगल जाएगी’
  rationale: इब्रानी में स्पष्ट कर्म नहीं है, पर हिन्दी में ‘निगल जाएगी’ सामान्यतः कर्म की अपेक्षा करता है। ‘उन्हें’ संदर्भ से नगरवासियों या संबंधित सामूहिक सत्ता की ओर संकेत करता है, पर मूल की अस्पष्टता कुछ घटाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘चक्कर काटेगी’ कठिन इब्रानी क्रिया की गतिशीलता व्यक्त करता है; ‘बेड़े’ अपेक्षाकृत कम प्रचलित होने पर भी नगर-द्वार की रक्षा के संदर्भ में सटीक है और पादटिप्पणी से स्पष्ट किया गया है।
