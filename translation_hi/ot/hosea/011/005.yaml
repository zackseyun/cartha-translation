  text: לֹ֤א יָשׁוּב֙ אֶל אֶ֣רֶץ מִצְרַ֔יִם וְ/אַשּׁ֖וּר ה֣וּא מַלְכּ֑/וֹ כִּ֥י מֵאֲנ֖וּ לָ/שֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/005.yaml
  text: He will not return to the land of Egypt[a], but Assyria will be his king[b], because they have refused to return.
translation:
  language: hi
  text: वह मिस्र देश की ओर नहीं लौटेगा[a], बल्कि अश्शूर उसका राजा होगा, क्योंकि उन्होंने लौटने से इनकार कर दिया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे अधिक शब्दशः इस प्रकार भी रखा जा सकता है: “वह मिस्र देश की ओर नहीं लौटेगा, और अश्शूर—वही उसका राजा होगा।” इब्रानी वाक्य-रचना संक्षिप्त है।'
    reason: lexical_alternative
  - marker: b
    text: यहाँ “लौटने” का अर्थ “फिरने” या “मन फिराने” का भी हो सकता है; इब्रानी शब्द में भौगोलिक और वाचागत—दोनों भाव संभव हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָשׁוּב ... לָשׁוּב
  choice: नहीं लौटेगा ... लौटने से
  rationale: दोनों स्थानों पर एक ही धातु שוב है। ‘लौटना’ भौगोलिक वापसी और परमेश्वर की ओर फिरने—दोनों संभावित अर्थों की प्रतिध्वनि बनाए रखता है।
- source_word: אֶל אֶרֶץ מִצְרַיִם
  choice: मिस्र देश को
  rationale: ‘देश’ को बनाए रखने से אֶרֶץ का स्पष्ट अनुवाद होता है और मिस्र की भूमि से जुड़े इस्राएल के इतिहास की ओर संभावित संकेत सुरक्षित रहता है।
- source_word: וְאַשּׁוּר
  choice: बल्कि अश्शूर
  rationale: संदर्भ में वाव दो विपरीत विकल्पों—मिस्र नहीं, अश्शूर—को जोड़ता है; इसलिए स्वाभाविक हिन्दी में इसका विरोधसूचक अनुवाद किया गया है।
- source_word: הוּא מַלְכּוֹ
  choice: उसका राजा होगा
  rationale: सर्वनाम और विधेय वाली संक्षिप्त नामवाचक उपवाक्य-रचना को भावी दंडादेश के संदर्भ में प्रस्तुत किया गया है। ‘राजा’ का रूपक विदेशी प्रभुत्व को स्पष्ट किए बिना सुरक्षित रखता है।
- source_word: כִּי מֵאֲנוּ לָשׁוּב
  choice: क्योंकि उन्होंने लौटने से इनकार कर दिया है
  rationale: כִּי कारण बताता है; बहुवचन क्रिया מֵאֲנוּ के लिए ‘उन्होंने’ रखा गया है और उसके निहित कर्ता को पाठ में जोड़कर स्पष्ट नहीं किया गया। पूर्ण क्रिया को दृढ़, वर्तमान तक प्रभावी इनकार के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: שוב का दोहरा अर्थ
  choice: दोनों उपवाक्यों में ‘लौटना’
  alternative: पहले ‘वापस जाना’ और अंत में ‘मन फिराना’ या ‘पश्चाताप करना’
  rationale: होशे की भाषा में שוב शारीरिक वापसी और वाचा-संबंधी मन-फिराव दोनों को व्यक्त कर सकता है। एक ही हिन्दी शब्द रखने से जानबूझकर उपस्थित अर्थ-संबंध और धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: מֵאֲנוּ की बहुवचन कर्ता-सूचना
  choice: ‘उन्होंने’ कहकर कर्ता को निहित रहने देना
  alternative: ‘मेरी प्रजा ने’ या ‘इस्राएल ने’ जोड़ना
  rationale: इस उपवाक्य में स्पष्ट कर्ता नहीं है। निकटवर्ती संदर्भ से किसी संज्ञा को जोड़ना मूल पद की अपेक्षा अधिक व्याख्यात्मक होता।
- issue: अश्शूर का राजा होना
  choice: ‘अश्शूर उसका राजा होगा’ रूपक को यथावत रखना
  alternative: ‘अश्शूर उस पर शासन करेगा’
  rationale: मूल में ‘राजा’ है; इसे सामान्य शासन-वर्णन में बदलने से विदेशी अधीनता का तीखा राजकीय और वाचागत व्यंग्य मंद पड़ जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और भविष्यवाणी-संगत लहजा अपनाया गया है। ‘अश्शूर’ प्रचलित बाइबलीय स्थान-नाम है। अर्धविराम विरोधी उपवाक्यों को स्पष्ट करता है, जबकि मूल की संक्षिप्तता और सर्वनाम-संबंधी संरचना यथासंभव बनी रहती है।
