source:
  edition: WLC
  text: אֵ֞יךְ אֶתֶּנְ/ךָ֣ אֶפְרַ֗יִם אֲמַגֶּנְ/ךָ֙ יִשְׂרָאֵ֔ל אֵ֚יךְ אֶתֶּנְ/ךָ֣ כְ/אַדְמָ֔ה אֲשִֽׂימְ/ךָ֖ כִּ/צְבֹאיִ֑ם נֶהְפַּ֤ךְ עָלַ/י֙ לִבִּ֔/י יַ֖חַד נִכְמְר֥וּ נִחוּמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/008.yaml
  text: How can I give you up[a], Ephraim? How can I hand you over, Israel? How can I make you like Admah? How can I set you like Zeboiim? My heart is turned over within me[c][b]; all my compassions are stirred.
translation:
  language: hi
  text: हे एप्रैम, मैं तुझे कैसे छोड़ दूँ? हे इस्राएल, मैं तुझे कैसे सौंप दूँ? मैं तुझे अदमा के समान कैसे कर दूँ?[a] मैं तुझे सबोयीम के समान कैसे बना दूँ? मेरा हृदय मेरे भीतर उलट गया है;[b] मेरी सारी करुणा उमड़ उठी है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अदमा और सबोयीम उन नगरों में थे जिनका विनाश सदोम और अमोरा के साथ हुआ था; यह तुलना पूर्ण विनाश की ओर संकेत करती है (देखें व्यवस्थाविवरण 29:23)।
    reason: cross_reference
  - marker: b
    text: या, “मेरा हृदय मेरे भीतर बदल गया है।” इब्रानी में अधिक शाब्दिक चित्र हृदय के “उलट जाने” का है, जो गहरी आंतरिक उथल-पुथल व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: या, “मेरी सारी करुणा प्रज्वलित हो उठी है” अथवा “मेरी करुणा गरम हो उठी है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: कैसे
  rationale: बार-बार आया प्रश्नवाचक शब्द आश्चर्य, वेदना और ऐसा करने की अनिच्छा व्यक्त करता है; हिन्दी में प्रसंग सहित ‘कैसे’ इस भाव को स्वाभाविक रूप से रखता है।
- source_word: אֶתֶּנְךָ
  choice: तुझे छोड़ दूँ
  rationale: न्याय के लिए त्याग देने का भाव है। ‘छोड़ दूँ’ आधुनिक हिन्दी में भावात्मक तीव्रता को बनाए रखता है।
- source_word: אֲמַגֶּנְךָ
  choice: तुझे सौंप दूँ
  rationale: पिएल रूप यहाँ किसी के हाथ कर देने या विनाश के लिए सौंप देने का अर्थ देता है और पहली पंक्ति के समानांतर रहते हुए अलग शब्दावली बनाए रखता है।
- source_word: כְאַדְמָה / כִּצְבֹאיִם
  choice: अदमा के समान / सबोयीम के समान
  rationale: मूल पाठ के स्थान-नाम सुरक्षित रखे गए हैं; उनके विनाश-संबंधी संकेत को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: נֶהְפַּךְ עָלַי לִבִּי
  choice: मेरा हृदय मेरे भीतर उलट गया है
  rationale: הפך के ‘उलटने/पलटने’ के सजीव रूपक को बनाए रखते हुए परमेश्वर की गहरी आंतरिक उथल-पुथल व्यक्त की गई है।
- source_word: יַחַד נִכְמְרוּ נִחוּמָי
  choice: मेरी सारी करुणा उमड़ उठी है
  rationale: יַחַד को समग्रता (‘सारी’) के रूप में और נִכְמְרוּ को तीव्र आंतरिक भाव-जागरण के रूप में व्यक्त किया गया है; हिन्दी में ‘उमड़ उठी’ स्वाभाविक और भावपूर्ण है।
theological_decisions:
- issue: परमेश्वर के हृदय और करुणा का मानवीय भाव-भाषा में वर्णन
  choice: हृदय के उलटने और करुणा के उमड़ने की सजीव भाषा बनाए रखी गई
  alternative: इसे अमूर्त रूप से ‘मैंने अपना मन बदल लिया’ कहना
  rationale: मूल इब्रानी परमेश्वर की करुणा को गहरे, संबंधपरक और आंतरिक आंदोलन के रूप में चित्रित करती है; अनुवाद इस धार्मिक तनाव को समझाकर समाप्त नहीं करता।
- issue: अदमा और सबोयीम का संकेत
  choice: मुख्य पाठ में दोनों स्थान-नाम रखे गए
  alternative: ‘उन नगरों के समान जिन्हें मैंने नष्ट किया’ जैसा व्याख्यात्मक प्रतिस्थापन
  rationale: मूल पाठ सीधे नगरों के नाम लेता है; संकेत का अर्थ पादटिप्पणी में देना अधिक स्रोत-संगत है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और भावपूर्ण शैली अपनाई गई है। ‘तू/तुझे’ का प्रयोग एकवचन राष्ट्र को सीधे संबोधन और भविष्यद्वक्ताई काव्य की निकटता के अनुरूप है। स्थान-नामों के लिए प्रचलित हिन्दी बाइबलीय रूप ‘एप्रैम’, ‘इस्राएल’, ‘अदमा’ और ‘सबोयीम’ रखे गए हैं।
