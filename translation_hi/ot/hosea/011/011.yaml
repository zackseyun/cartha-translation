base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/011.yaml
  text: They will come trembling like a bird from Egypt[a], and like a dove from the land of Assyria; and I will settle them in their homes, declares Yahweh.
translation:
  language: hi
  text: वे मिस्र से पक्षी के समान काँपते हुए आएँगे[a], और अश्शूर देश से कबूतर के समान; मैं उन्हें उनके घरों में बसा दूँगा—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे मिस्र से पक्षी के समान काँपेंगे ... और अश्शूर देश से कबूतर के समान।” इब्रानी क्रिया काँपने पर बल दे सकती है, यद्यपि इस प्रसंग में काँपते हुए आने का भाव संभवतः सम्मिलित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֶרְדוּ
  choice: काँपते हुए आएँगे
  rationale: क्रिया חרד का मूल भाव काँपना या भय से थरथराना है; मिस्र और अश्शूर से गति के प्रसंग में आगमन निहित है। यह अनुवाद गति को स्पष्ट करते हुए काँपने के वास्तविक अर्थ को बनाए रखता है।
- source_word: כְצִפּוֹר
  choice: पक्षी के समान
  rationale: צִפּוֹר सामान्यतः छोटे पक्षी के लिए व्यापक शब्द है; किसी खास प्रजाति को निर्दिष्ट करना उचित नहीं।
- source_word: וּכְיוֹנָה
  choice: और ... कबूतर के समान
  rationale: יוֹנָה का सामान्य अर्थ कबूतर है और यह होशे की पक्षी-संबंधी उपमा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵאֶרֶץ אַשּׁוּר
  choice: अश्शूर देश से
  rationale: मूल का ‘अश्शूर की भूमि से’ भाव संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: וְהוֹשַׁבְתִּים
  choice: मैं उन्हें ... बसा दूँगा
  rationale: ישב के हिफ़ील रूप का कारक अर्थ ‘बसाना/निवास कराना’ है; ‘बसा दूँगा’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: עַל בָּתֵּיהֶם
  choice: उनके घरों में
  rationale: यहाँ עַל को ישב के साथ स्थायी निवास के मुहावरेदार अर्थ में समझना उचित है; ‘घरों के ऊपर’ शब्दशः किन्तु भ्रामक होगा।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: नबी-संबंधी समापन सूत्र की गंभीरता सुरक्षित रहती है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: अंतिम खंड में पुनर्स्थापन का भाव
  choice: मैं उन्हें उनके घरों में बसा दूँगा
  alternative: मैं उन्हें उनके घरों में लौटा लाऊँगा
  rationale: कारक क्रिया सुरक्षित निवास कराए जाने को व्यक्त करती है। निर्वासन से वापसी प्रसंग में निहित है, पर मूल क्रिया में ‘लौटाना’ स्पष्ट रूप से नहीं कहा गया; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- issue: יֶחֶרְדוּ में गति और भय का संबंध
  choice: काँपते हुए आएँगे
  alternative: काँपेंगे
  rationale: क्रिया स्वयं मुख्यतः काँपने को व्यक्त करती है, जबकि देशों ‘से’ पक्षियों की उपमा प्रसंगगत गति का संकेत देती है। मुख्य पाठ दोनों को व्यक्त करता है और पादटिप्पणी अधिक शब्दशः विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण नबी-संबंधी गद्य। ‘के समान’ उपमाओं को स्पष्ट रखता है; अर्धविराम समानांतर पंक्तियों और अंतिम ईश्वरीय प्रतिज्ञा के बीच विभाजन दिखाता है।
