base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/001.yaml
  text: When Israel was a child[a], I loved him, and out of Egypt I called my son.
translation:
  language: hi
  text: जब इस्राएल बालक था,[a] तब मैंने उससे प्रेम किया, और मिस्र से मैंने अपने पुत्र को बुलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि इस्राएल बालक था, और मैंने उससे प्रेम किया।” इब्रानी आरंभ को कारण-सूचक (“क्योंकि”) या समय-सूचक (“जब”) समझा जा सकता है; यहाँ पीछे मुड़कर किए गए वर्णन में समय-सूचक अर्थ अधिक उपयुक्त है। “मिस्र से मैंने अपने पुत्र को बुलाया” को बाद में मत्ती 2:15 में उद्धृत किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ यह शब्द समय-सूचक परिस्थिति प्रस्तुत करता है और बीते हुए इतिहास के वर्णन में स्वाभाविक है; फिर भी कारण-सूचक अर्थ संभव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
- source_word: נַעַר
  choice: बालक
  rationale: यह शब्द लड़के, किशोर या युवक को सूचित कर सकता है। यहाँ इस्राएल के आरंभिक राष्ट्रीय जीवन और पुत्र-संबंध के रूपक में ‘बालक’ अपरिपक्वता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यह व्यक्तिरूप में प्रस्तुत राष्ट्र/प्रजा का नाम है; मानक हिन्दी रूप अपनाया गया है।
- source_word: וָאֹהֲבֵהוּ
  choice: तब मैंने उससे प्रेम किया
  rationale: क्रिया प्रथम पुरुष एकवचन और कर्म पुरुषवाचक एकवचन है। ‘उससे प्रेम किया’ आधुनिक हिन्दी में स्वाभाविक है और व्यक्तिरूप इस्राएल को संदर्भित करता है; ‘तब’ समय-सूचक उपवाक्य के साथ वाक्य-संबंध स्पष्ट करता है।
- source_word: וּמִמִּצְרַיִם
  choice: और मिस्र से
  rationale: מִן स्रोत या प्रस्थान-बिंदु बताता है। हिन्दी में ‘मिस्र से’ निर्गमन की दिशा को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: קָרָאתִי
  choice: मैंने ... बुलाया
  rationale: קרא का सामान्य अर्थ बुलाना या आह्वान करना है। ‘बुलाया’ पर्याप्त व्यापक है और इब्रानी से अधिक विशिष्ट आशय नहीं जोड़ता।
- source_word: לִבְנִי
  choice: अपने पुत्र को
  rationale: קרא के साथ ל बुलाए गए व्यक्ति को चिह्नित कर सकता है। हिन्दी वाक्य-विन्यास में ‘अपने पुत्र को बुलाया’ स्वाभाविक है और इस्राएल के लिए प्रयुक्त पुत्रत्व के रूपक को बनाए रखता है।
theological_decisions:
- issue: ‘मेरे पुत्र’ के रूप में सामूहिक इस्राएल और मत्ती 2:15 में बाद का प्रयोग
  choice: मुख्य पाठ को होशे के तात्कालिक ऐतिहासिक संदर्भ में सामूहिक इस्राएल के विषय में रखा गया है।
  alternative: अनुवाद को इस प्रकार बनाना कि वह केवल प्रत्यक्ष मसीही भविष्यवाणी के रूप में पढ़ा जाए।
  rationale: होशे 11:1 में सीधा साहित्यिक संदर्भ निर्गमन के समय इस्राएल का है। मत्ती 2:15 में बाद का उद्धरण महत्त्वपूर्ण है, पर उसे मुख्य पाठ में मिलाकर होशे के अपने संदर्भ को बदलना उचित नहीं; इसलिए इसका उल्लेख पाद-टिप्पणी में किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बालक’ पुत्रत्व और आरंभिक अवस्था दोनों को व्यक्त करता है। ‘जब ... तब’ संरचना हिन्दी में समय-संबंध स्पष्ट करती है, जबकि वैकल्पिक कारण-सूचक पाठ पाद-टिप्पणी में सुरक्षित है।
