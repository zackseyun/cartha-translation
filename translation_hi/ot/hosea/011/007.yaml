source:
  edition: WLC
  text: וְ/עַמִּ֥/י תְלוּאִ֖ים לִ/מְשֽׁוּבָתִ֑/י וְ/אֶל עַל֙ יִקְרָאֻ֔/הוּ יַ֖חַד לֹ֥א יְרוֹמֵם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/007.yaml
  text: My people are bent on turning away from me[a]; though they call to the Most High[b], together he does not lift them up.
translation:
  language: hi
  text: मेरे लोग मुझसे विमुख होने पर तुले हैं।[a] यद्यपि वे परमप्रधान को पुकारते हैं, फिर भी वह उन्हें नहीं उठाता।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विमुख होने’ के लिए प्रयुक्त इब्रानी शब्द का अनुवाद ‘पीछे हटने,’ ‘फिर जाने,’ या ‘धर्मत्याग करने’ के रूप में भी किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम इब्रानी खंड कठिन है। इसका अनुवाद यह भी हो सकता है: ‘वे सब मिलकर उसका गुणगान नहीं करते,’ या ‘कोई भी उसे ऊँचा नहीं मानता।’'
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: मेरे लोग
  rationale: यहाँ עַם का अर्थ केवल राजनीतिक ‘राष्ट्र’ नहीं, बल्कि परमेश्वर से वाचा के संबंध में बँधे लोग हैं; प्रथम पुरुष एकवचन प्रत्यय के कारण ‘मेरे’ आवश्यक है।
- source_word: תְלוּאִים
  choice: तुले हुए हैं
  rationale: शाब्दिक रूप से यह लटके या जुड़े रहने का भाव दे सकता है, पर לִמְשׁוּבָתִי के साथ प्रसंग में किसी दिशा में दृढ़ और हठी झुकाव व्यक्त करता है। आधुनिक हिन्दी का ‘पर तुले हुए हैं’ इस भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִמְשׁוּבָתִי
  choice: मुझसे फिर जाने
  rationale: מְשׁוּבָה का अर्थ धर्मत्याग, पीछे हटना या विमुख होना हो सकता है। कठिन प्रथम पुरुष प्रत्यय को प्रसंगानुसार परमेश्वर से लोगों के फिर जाने के रूप में व्यक्त किया गया है।
- source_word: וְאֶל־עַל
  choice: यद्यपि वे परमप्रधान को
  rationale: אֶל־עַל को यहाँ परंपरागत रूप से ‘परमप्रधान की ओर/परमप्रधान को’ समझा जाता है। अगले खंड के साथ विरोध दिखाने के लिए וְ को अर्थानुसार ‘यद्यपि ... फिर भी’ से व्यक्त किया गया है।
- source_word: יִקְרָאֻהוּ
  choice: पुकारते हैं
  rationale: क्रिया बहुवचन कर्ता और एकवचन कर्म-सूचक प्रत्यय रखती है। पहले आए אֶל־עַל के साथ हिन्दी में ‘परमप्रधान को पुकारते हैं’ स्वाभाविक है।
- source_word: יַחַד
  choice: (मुख्य पाठ में अलग से व्यक्त नहीं)
  rationale: יַחַד सामान्यतः ‘एक साथ/सब मिलकर’ है, पर कठिन अंतिम खंड में यह सामूहिकता अथवा पूर्ण निषेध को बल दे सकता है। हिन्दी मुख्य पाठ में बहुवचन ‘वे’ और ‘उन्हें’ सामूहिक संदर्भ बनाए रखते हैं; वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: לֹא יְרוֹמֵם
  choice: वह उन्हें नहीं उठाता
  rationale: רוּם का यह रूप उठाने या ऊँचा करने का अर्थ दे सकता है। मुख्य पाठ में परमप्रधान को कर्ता और लोगों को निहित कर्म मानना प्रसंग में सहायता या उद्धार न दिए जाने का सुसंगत अर्थ देता है, यद्यपि इब्रानी वाक्य अत्यंत कठिन है।
theological_decisions:
- issue: कठिन अंतिम खंड יַחַד לֹא יְרוֹמֵם का कर्ता और कर्म
  choice: 'परमप्रधान कर्ता है: वे उसे पुकारते हैं, फिर भी वह उन्हें नहीं उठाता।'
  alternative: ‘वे सब मिलकर उसका गुणगान नहीं करते,’ अथवा ‘कोई भी उसे ऊँचा नहीं मानता।’
  rationale: संक्षिप्त इब्रानी रचना कर्ता और कर्म को स्पष्ट नहीं करती। पिछले खंड में परमप्रधान को पुकारने और फिर सहायता न मिलने का विरोध मुख्य पाठ के लिए प्रसंगानुकूल है, पर इस चयन को निश्चित बनाकर दूसरी प्राचीन-संभव समझ को दबाया नहीं गया; उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पर तुले हुए हैं’ लोगों के जमे हुए हठ को व्यक्त करता है; ‘परमप्रधान’ स्थापित और स्पष्ट ईश्वरीय उपाधि है। स्रोत में दिए अंग्रेज़ी पाठ के पादटिप्पणी-चिह्न विषयवस्तु से उलटे जुड़े दिखाई देते थे, इसलिए हिन्दी में [a] को ‘फिर जाने’ और [b] को कठिन अंतिम खंड के साथ सही स्थान पर लगाया गया है।
