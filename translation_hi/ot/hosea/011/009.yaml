base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/009.yaml
  text: I will not carry out the fierceness of my anger[a]; I will not again destroy Ephraim. For I am God and not a man, the Holy One in your midst[c][b], and I will not come into the city.
translation:
  language: hi
  text: 'मैं अपना प्रचंड क्रोध नहीं बरसाऊँगा;

    मैं एप्रैम को फिर नष्ट नहीं करूँगा।[a]


    क्योंकि मैं परमेश्वर हूँ, मनुष्य नहीं—

    तुम्हारे बीच का पवित्र परमेश्वर;

    और मैं नगर में नहीं आऊँगा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं एप्रैम को नष्ट करने के लिए फिर नहीं लौटूँगा।”
    reason: שׁוּב לְשַׁחֵת की संरचना पुनरावृत्ति अथवा लौटकर कार्य करने—दोनों भाव दे सकती है।
  - marker: b
    text: अंतिम इब्रानी वाक्यांश कठिन है। इसका शाब्दिक अर्थ “मैं नगर में नहीं आऊँगा” है; कुछ इसे “मैं क्रोध में” या “विनाश करने के लिए नहीं आऊँगा” के अर्थ में समझते हैं।
    reason: कठिन पाठ और संदर्भगत वैकल्पिक व्याख्या को सुरक्षित रखना।
lexical_decisions:
- source_word: אֶעֱשֶׂה חֲרוֹן אַפִּי
  choice: मैं अपना प्रचंड क्रोध नहीं बरसाऊँगा
  rationale: शाब्दिक संरचना ‘अपने क्रोध की ज्वाला को करना’ हिन्दी में अस्वाभाविक है। ‘क्रोध बरसाना’ न्यायकारी क्रोध को क्रिया में परिणत करने का भाव स्वाभाविक ढंग से व्यक्त करता है, जबकि חֲרוֹן की तीव्रता ‘प्रचंड’ से बनी रहती है।
- source_word: אָשׁוּב לְשַׁחֵת
  choice: फिर नष्ट नहीं करूँगा
  rationale: שׁוּב के साथ क्रिया का infinitive किसी काम को दोबारा करने का अर्थ दे सकता है। सरल हिन्दी में ‘फिर नष्ट नहीं करूँगा’ यही अर्थ देता है; अधिक संरचनात्मक पाठ ‘नष्ट करने नहीं लौटूँगा’ पादटिप्पणी में रखा गया है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל का सीधा अर्थ ‘परमेश्वर’ है और आगे ‘मनुष्य नहीं’ से स्पष्ट विरोध बनता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: यहाँ आशय परमेश्वर और नश्वर मानव के बीच विरोध का है; आधुनिक हिन्दी में ‘मनुष्य’ इस सामान्य मानवीय अर्थ को ‘पुरुष’ से अधिक ठीक व्यक्त करता है।
- source_word: בְּקִרְבְּךָ קָדוֹשׁ
  choice: तुम्हारे बीच रहनेवाला पवित्र परमेश्वर
  rationale: בְּקִרְבְּךָ लोगों के बीच उपस्थिति बताता है और קָדוֹשׁ यहाँ संज्ञात्मक रूप से परमेश्वर का विशेषण/उपाधि है। हिन्दी में ‘पवित्र जन’ मानवीय भ्रम पैदा कर सकता है, इसलिए निकटवर्ती ‘परमेश्वर’ को स्वाभाविक रूप से दोहराया गया है।
- source_word: וְלֹא אָבוֹא בְּעִיר
  choice: मैं नगर में नहीं आऊँगा
  rationale: मासोरेटिक पाठ में בְּעִיר का सर्वाधिक सीधा अर्थ ‘नगर में’ है। अंतिम उपवाक्य कठिन है, इसलिए मुख्य पाठ में रूपगत अर्थ रखा गया और न्याय करने हेतु आने की वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
theological_decisions:
- issue: परमेश्वर का अपने क्रोध को लागू न करना
  choice: पद को एप्रैम पर पूर्ण विनाशकारी क्रोध न बरसाने की परमेश्वर की घोषणा के रूप में रखा गया है।
  alternative: इसे परमेश्वर के स्वभाव में दार्शनिक परिवर्तन अथवा अपरिवर्तनशीलता की स्पष्ट व्याख्या मानना।
  rationale: इब्रानी पाठ निर्णय से विरत होने को परमेश्वर की दिव्यता और पवित्र उपस्थिति से जोड़ता है, पर यह नहीं बताता कि इसे किसी व्यवस्थित दार्शनिक सिद्धांत में कैसे समझा जाए। अनुवाद उस तनाव को खुला रखता है।
- issue: וְלֹא אָבוֹא בְּעִיר का कठिन अर्थ
  choice: मुख्य पाठ में ‘मैं नगर में नहीं आऊँगा’।
  alternative: ‘मैं क्रोध में/विनाश करने नहीं आऊँगा’।
  rationale: व्यंजन और मासोरेटिक स्वरांकन नगर-संबंधी अर्थ का समर्थन करते हैं, जबकि संदर्भ विनाशकारी आगमन की व्याख्या को संभव बनाता है। मुख्य पाठ और पादटिप्पणी दोनों प्रमाणों को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण काव्यात्मक पंक्ति-विन्यास। ‘एप्रैम’ प्रचलित बाइबलीय नामरूप है। अत्यधिक संस्कृतनिष्ठ ‘कार्यान्वित’ और बोलचाल के ‘गुस्सा उतारना’ से बचते हुए ‘प्रचंड क्रोध बरसाना’ चुना गया है।
