source:
  edition: WLC
  text: אַחֲרֵ֧י יְהוָ֛ה יֵלְכ֖וּ כְּ/אַרְיֵ֣ה יִשְׁאָ֑ג כִּֽי ה֣וּא יִשְׁאַ֔ג וְ/יֶחֶרְד֥וּ בָנִ֖ים מִ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/010.yaml
  text: They will walk after Yahweh[a]; he will roar like a lion. For he himself will roar[b], and sons will come trembling from the west.
translation:
  language: hi
  text: 'वे याहवे के पीछे चलेंगे;

    वह सिंह के समान गरजेगा।

    क्योंकि वह स्वयं गरजेगा,

    और पुत्र[a] समुद्र की ओर से[b] काँपते हुए आएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सन्तान’; इब्रानी में शब्द शाब्दिक रूप से पुल्लिंग बहुवचन है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात सम्भवतः ‘पश्चिम से’; इब्रानी में शाब्दिक रूप से ‘समुद्र की ओर से’ है। इस्राएल की भौगोलिक दृष्टि से समुद्र पश्चिम में था।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי יְהוָה יֵלְכוּ
  choice: वे याहवे के पीछे चलेंगे
  rationale: אַחֲרֵי के स्थानिक बिंब ‘पीछे’ को बनाए रखते हुए यह वाक्यांश किसी के अनुसरण में चलने का स्वाभाविक हिन्दी अर्थ देता है। יְהוָה को उपाधि से बदलने के बजाय व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: כְּאַרְיֵה יִשְׁאָג
  choice: वह सिंह के समान गरजेगा
  rationale: तुलना और सिंह की गर्जना का ठोस बिंब सीधे और गरिमापूर्ण हिन्दी में सुरक्षित रहता है।
- source_word: כִּי הוּא יִשְׁאַג
  choice: क्योंकि वह स्वयं गरजेगा
  rationale: כִּי को व्याख्यात्मक ‘क्योंकि’ और स्पष्ट सर्वनाम הוּא को बलसूचक ‘स्वयं’ से व्यक्त किया गया है; साथ ही मूल की दोहराई गई ‘गरजेगा’ क्रिया सुरक्षित है।
- source_word: וְיֶחֶרְדוּ
  choice: काँपते हुए आएँगे
  rationale: חרד भय अथवा विस्मय से काँपने को व्यक्त करता है। पुनर्स्थापना के प्रसंग में निहित आगमन को ‘आएँगे’ से व्यक्त किया गया है, पर मूल में अनुपस्थित ‘उसके पास’ जैसा लक्ष्य नहीं जोड़ा गया।
- source_word: בָנִים
  choice: पुत्र
  rationale: इब्रानी शब्द व्याकरणतः पुल्लिंग बहुवचन है। मुख्य पाठ में उसका अधिक निकट रूप ‘पुत्र’ रखा गया है और व्यापक सामूहिक अर्थ ‘सन्तान’ टिप्पणी में दिया गया है।
- source_word: מִיָּם
  choice: समुद्र की ओर से
  rationale: मूल का शाब्दिक भौगोलिक बिंब सुरक्षित रखा गया है। इस्राएल के भूगोल में समुद्र से आशय प्रायः पश्चिम होता है, जिसे टिप्पणी में स्पष्ट किया गया है, ताकि मुख्य पाठ वास्तविक अस्पष्टता को समय से पहले न सुलझाए।
theological_decisions:
- issue: ईश्वरीय गर्जना के उत्तर में लोगों का लौटना
  choice: ‘काँपते हुए आएँगे’—गर्जना के उत्तर में भय या विस्मय सहित आगमन का संकेत
  alternative: केवल ‘काँपेंगे’, जिसमें लौटने या आने की गति स्पष्ट न हो
  rationale: होशे 11:8–11 का पुनर्स्थापना-संदर्भ आगमन या वापसी का समर्थन करता है, फिर भी अनुवाद ‘उसके पास’ जैसा अप्रकट कर्म जोड़कर दिशा को निर्णायक नहीं बनाता।
- issue: מִיָּם का भौगोलिक अर्थ
  choice: मुख्य पाठ में ‘समुद्र की ओर से’, टिप्पणी में सम्भावित ‘पश्चिम से’
  alternative: मुख्य पाठ में सीधे ‘पश्चिम से’
  rationale: ‘समुद्र’ मूल शब्दचित्र है और साथ ही दिशा-सूचक मुहावरा हो सकता है। शाब्दिक रूप मुख्य पाठ में रखकर और सम्भावित दिशात्मक अर्थ टिप्पणी में देकर दोनों स्तर सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज काव्यात्मक गद्य अपनाया गया है। समानांतर पंक्तियाँ और ‘गरजेगा’ की पुनरावृत्ति मूल की वाक्पटु शक्ति बनाए रखती हैं। ‘पीछे चलेंगे’ मूल बिंब को बचाते हुए सामान्य पाठक के लिए स्वाभाविक है।
