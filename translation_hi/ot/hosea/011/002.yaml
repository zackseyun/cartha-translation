base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/002.yaml
  text: The more they called to them[a], the more they went away from them[b]; they kept sacrificing to the Baals and burning incense to idols.
translation:
  language: hi
  text: जितना ही उन्हें पुकारा, उतना ही वे उनसे दूर चले गए; वे बाल देवताओं को बलि चढ़ाते रहे और मूर्तियों[b] को धूप जलाते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या “तराशी हुई मूर्तियों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ לָהֶם
  choice: उन्होंने उन्हें पुकारा
  rationale: क़ाल पूर्णकाल बहुवचन और לָהֶם को सक्रिय रूप में रखा गया है। इब्रानी में पुकारने वालों की पहचान स्पष्ट नहीं है, इसलिए हिन्दी में भी उसे निर्दिष्ट नहीं किया गया।
- source_word: כֵּן
  choice: जितना ही … उतना ही
  rationale: यहाँ כֵּן पिछले उपवाक्य के साथ अनुपातसूचक सहसंबंध बनाता है; आधुनिक हिन्दी में यह रचना उस बल को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: הָלְכוּ מִפְּנֵיהֶם
  choice: वे उनसे दूर चले गए
  rationale: הלך के साथ מן־פנים किसी की उपस्थिति से हटने या विमुख होने का भाव देता है; यह हिन्दी प्रयोग संबंध-विच्छेद का आशय बनाए रखता है।
- source_word: לַבְּעָלִים
  choice: बाल देवताओं के लिए
  rationale: बहुवचन בְּעָלִים विभिन्न बाल देवताओं अथवा उनके स्थानीय पंथ-रूपों की ओर संकेत करता है। 'बाल देवताओं' से बहुवचन सामान्य पाठक के लिए स्पष्ट रहता है।
- source_word: יְזַבֵּחוּ
  choice: बलि चढ़ाते रहे
  rationale: इस काव्यात्मक संदर्भ में अपूर्णकाल बार-बार या निरंतर किए गए कर्म को सूचित करता है।
- source_word: לַפְּסִלִים
  choice: मूर्तियों
  rationale: פְּסִילִים तराशी हुई उपासना-मूर्तियाँ हैं। मुख्य पाठ में स्वाभाविक 'मूर्तियों' रखा गया और रूप-संबंधी विशेषता पादटिप्पणी में दी गई।
- source_word: יְקַטֵּרוּן
  choice: धूप जलाते रहे
  rationale: पूजा-संबंधी संदर्भ में קטר का पिएल रूप धूप अथवा सुगंधित धूम अर्पित करने को दर्शाता है; 'धूप जलाना' आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ‘उन्होंने उन्हें पुकारा’ में कर्ता की अनिर्दिष्टता
  choice: पुकारने वालों को स्पष्ट रूप से पहचाने बिना इब्रानी का सक्रिय बहुवचन बनाए रखा गया।
  alternative: ‘परमेश्वर ने उन्हें पुकारा’, ‘भविष्यद्वक्ताओं ने उन्हें पुकारा’, या कर्मवाच्य ‘उन्हें पुकारा गया’।
  rationale: पद स्वयं कर्ता की पहचान नहीं करता और संदर्भ एक से अधिक समझ की अनुमति देता है। किसी एक पहचान को मुख्य पाठ में जोड़ना पाठ की वास्तविक अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। अनुपातसूचक काव्यात्मक समानांतरता को ‘जितना ही … उतना ही’ से व्यक्त किया गया है और कर्ता की मूल अस्पष्टता सुरक्षित रखी गई है।
