id: HOS.11.3
reference: Hosea 11:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָנֹכִ֤י תִרְגַּ֨לְתִּי֙ לְ/אֶפְרַ֔יִם קָחָ֖/ם עַל זְרֽוֹעֹתָ֑י/ו וְ/לֹ֥א יָדְע֖וּ כִּ֥י רְפָאתִֽי/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/003.yaml
  text: Yet it was I who taught Ephraim to walk[a], taking them in my arms, but they did not know that I healed them.
translation:
  language: hi
  text: फिर भी मैंने ही एप्रैम को चलना सिखाया; मैंने उन्हें अपनी बाँहों में उठाया[a], पर उन्होंने नहीं पहचाना कि मैंने ही उन्हें चंगा किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मासोरेटिक इब्रानी पाठ में यहाँ कठिन तृतीय-पुरुष रूप और प्रत्यय हैं; शाब्दिक रूप से भाव है, “उन्हें उसकी बाँहों पर उठाते हुए।” अनेक व्याख्याकार प्रसंग के अनुसार इसे प्रभु के प्रथम-पुरुष कथन की निरन्तरता मानते हैं: “उन्हें अपनी बाँहों में उठाते हुए” या “मैंने उन्हें अपनी बाँहों में उठाया।”'
    reason: textual_variant
lexical_decisions:
- source_word: תִרְגַּלְתִּי
  choice: चलना सिखाया
  rationale: रגל के इस रूप में बच्चे को चलना सिखाने या उसका अभ्यास कराने का भाव है। यह चयन माता-पिता और छोटे बच्चे के सजीव बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְאֶפְרַיִם
  choice: एप्रैम को
  rationale: לְ को हिन्दी के कर्मसूचक ‘को’ में स्वाभाविक रूप से समाहित किया गया है; एप्रैम यहाँ सामूहिक रूप से इस्राएल का द्योतक है।
- source_word: קָחָם עַל זְרוֹעֹתָיו
  choice: मैंने उन्हें अपनी बाँहों में उठाया
  rationale: मासोरेटिक पाठ में क्रिया और प्रत्यय तृतीय पुरुष की ओर संकेत करते हैं, पर आसपास का कथन स्पष्ट रूप से परमेश्वर के प्रथम पुरुष वचन में है। मुख्य पाठ में प्रसंगानुकूल प्रथम पुरुष रखा गया है और वास्तविक पाठगत कठिनाई को पादटिप्पणी में सुरक्षित किया गया है। ‘बाँहों में उठाया’ हिन्दी में बच्चे को गोद/बाँहों में लेने का स्वाभाविक चित्र देता है।
- source_word: וְלֹא יָדְעוּ
  choice: पर उन्होंने नहीं पहचाना
  rationale: ידע का मूल अर्थ ‘जानना’ है, पर यहाँ परमेश्वर की देखभाल को पहचानने का भाव है। विरोधसूचक प्रसंग के कारण וְ का अनुवाद ‘पर’ किया गया है।
- source_word: רְפָאתִים
  choice: मैंने ही उन्हें चंगा किया था
  rationale: רפא का ठोस अर्थ ‘चंगा करना’ सुरक्षित रखा गया है; ‘ही’ परमेश्वर की उस देखभाल पर बल देता है जिसे एप्रैम ने नहीं पहचाना। पूर्ण क्रिया को पूर्वकालिक सम्बन्ध स्पष्ट करने के लिए ‘किया था’ कहा गया है।
theological_decisions:
- issue: परमेश्वर के लिए माता-पिता जैसा मानवीय बिंब
  choice: परमेश्वर द्वारा एप्रैम को चलना सिखाने और बाँहों में उठाने का अंतरंग बिंब ज्यों का त्यों रखा गया है।
  alternative: इसे सामान्य देखभाल या मार्गदर्शन के अमूर्त कथन में बदलना।
  rationale: इब्रानी पाठ परमेश्वर की कोमल, अभिभावकीय देखभाल को मूर्त रूप में प्रस्तुत करता है; इसे नरम या अमूर्त करना पाठ के धार्मिक तनाव और भावनात्मक शक्ति को घटा देता।
- issue: मध्य उपवाक्य में प्रथम पुरुष से कठिन तृतीय-पुरुष रूप की ओर बदलाव
  choice: मुख्य पाठ में वक्ता के अनुरूप प्रथम पुरुष रखा गया और मासोरेटिक पाठ का तृतीय-पुरुष रूप पादटिप्पणी में बताया गया।
  alternative: 'मुख्य पाठ में शाब्दिक व्यक्ति-परिवर्तन रखना: ‘उसने उन्हें अपनी बाँहों में उठाया।’'
  rationale: पूरे प्रसंग में वक्ता परमेश्वर स्वयं हैं, इसलिए प्रथम पुरुष सहज अर्थ देता है; फिर भी मासोरेटिक पाठ की वास्तविक अनियमितता को छिपाया नहीं गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और भावपूर्ण रूप अपनाया गया है। ‘चलना सिखाया’, ‘बाँहों में उठाया’ और ‘चंगा किया’ जैसे ठोस पद मूल के अभिभावकीय तथा उपचारात्मक बिंबों को सामान्य पाठक के लिए स्पष्ट रखते हैं।
