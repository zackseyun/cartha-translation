language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תִּקְע֤וּ שׁוֹפָר֙ בַּ/גִּבְעָ֔ה חֲצֹצְרָ֖ה בָּ/רָמָ֑ה הָרִ֨יעוּ֙ בֵּ֣ית אָ֔וֶן אַחֲרֶ֖י/ךָ בִּנְיָמִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/008.yaml
  text: 'Blow the horn in Gibeah[a], the trumpet in Ramah; raise the battle cry at Beth-aven: “Behind you[b], Benjamin!”'
translation:
  language: hi
  text: 'गिबा में नरसिंगा फूँको, रामा में तुरही; बेत-आवेन[a] में युद्ध की पुकार लगाओ: “हे बिन्यामीन, तेरे पीछे![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेत-आवेन’ संभवतः बेतएल के लिए एक व्यंग्यात्मक नाम है, जिसका भाव ‘अनर्थ का घर’ या ‘व्यर्थता का घर’ हो सकता है।
    reason: स्थान-नाम के संभावित व्यंग्यात्मक और शब्दार्थ-संबंधी संकेत को उसके अपने एंकर पर स्पष्ट करता है।
  - marker: b
    text: 'या, “बेत-आवेन में चेतावनी दो: हे बिन्यामीन, शत्रु तेरे पीछे है!”'
    reason: אַחֲרֶיךָ की आकस्मिक चेतावनी के संभावित आशय को बताता है, बिना मुख्य पाठ की संक्षिप्तता और अस्पष्टता समाप्त किए।
lexical_decisions:
- source_word: תִּקְעוּ
  choice: फूँको
  rationale: यह תקע का बहुवचन आज्ञार्थक रूप है और वाद्य बजाने के संदर्भ में हिन्दी का स्वाभाविक प्रयोग ‘फूँको’ है।
- source_word: שׁוֹפָר
  choice: नरसिंगा
  rationale: यह सींग से बने फूँक-वाद्य को दर्शाता है और अगली पंक्ति के धातु के वाद्य חֲצֹצְרָה से भेद बनाए रखता है।
- source_word: חֲצֹצְרָה
  choice: तुरही
  rationale: यह שׁוֹפָר से अलग प्रकार का तुरही-वाचक वाद्य है; समानांतर, क्रियारहित खंड में ‘फूँको’ क्रिया निहित है।
- source_word: הָרִיעוּ
  choice: युद्ध की पुकार लगाओ
  rationale: सैनिक चेतावनी के प्रसंग में यह बहुवचन आज्ञार्थक रूप ऊँची चेतावनी अथवा युद्धघोष करने का भाव रखता है।
- source_word: בֵּית אָוֶן
  choice: बेत-आवेन
  rationale: मूल पाठ के स्थान-नाम को लिप्यंतरित किया गया है; बेतएल पर संभावित व्यंग्यात्मक संकेत को पादटिप्पणी में रखा गया है।
- source_word: אַחֲרֶיךָ
  choice: तेरे पीछे
  rationale: द्वितीय पुरुष एकवचन प्रत्यय वाला पद आकस्मिक चेतावनी की तरह आता है। शाब्दिक दिशा-सूचक अर्थ रखा गया है, जबकि ‘शत्रु’ को मुख्य पाठ में स्पष्ट रूप से जोड़कर अस्पष्टता समाप्त नहीं की गई।
- source_word: בִּנְיָמִין
  choice: हे बिन्यामीन
  rationale: यहाँ गोत्र अथवा उसके क्षेत्र को सीधे संबोधित किया गया है; सम्बोधन को हिन्दी में ‘हे’ से स्पष्ट किया गया है।
theological_decisions:
- issue: בֵּית אָוֶן का बेतएल के लिए व्यंग्यात्मक नाम होना
  choice: मुख्य पाठ में ‘बेत-आवेन’ रखा और संभावित संकेत को पादटिप्पणी में समझाया।
  alternative: ‘दुष्टता का घर’ अनुवाद करना अथवा सीधे ‘बेतएल’ लिखना।
  rationale: हिब्रू पाठ स्थान-नाम देता है, पर होशे के प्रयोग में बेतएल के विरुद्ध व्यंग्य संभव है। स्थान-नाम और व्यंग्य—दोनों को बिना एक को दूसरे में मिला देने के सुरक्षित रखा गया है।
- issue: אַחֲרֶיךָ की संक्षिप्त चेतावनी का आशय
  choice: “हे बिन्यामीन, तेरे पीछे!”
  alternative: “हे बिन्यामीन, शत्रु तेरे पीछे है!” अथवा “बिन्यामीन, तुम्हारे पीछे चलो!”
  rationale: मूल अभिव्यक्ति में ‘शत्रु’ जैसा कर्ता नहीं है और वाक्य जानबूझकर आकस्मिक है। संक्षिप्तता और वास्तविक अस्पष्टता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, ऊर्जस्वी और चेतावनीपूर्ण काव्यात्मक शैली रखी गई है। ‘नरसिंगा’ और ‘तुरही’ से दोनों हिब्रू वाद्यों का भेद बचाया गया है। सभी स्थान-नाम प्रचलित हिन्दी बाइबलीय लिप्यंतरण के निकट रखे गए हैं।
