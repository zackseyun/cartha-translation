  text: אֵלֵ֤ךְ אָשׁ֨וּבָה֙ אֶל מְקוֹמִ֔/י עַ֥ד אֲשֶֽׁר יֶאְשְׁמ֖וּ וּ/בִקְשׁ֣וּ פָנָ֑/י בַּ/צַּ֥ר לָ/הֶ֖ם יְשַׁחֲרֻֽ/נְנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/015.yaml
  text: I will go[a], I will return to my place until they acknowledge their guilt and seek my face[b]; in their distress they will seek me earnestly.
translation:
  language: hi
  text: मैं चला जाऊँगा और अपने स्थान पर लौट जाऊँगा, जब तक कि वे अपना दोष स्वीकार न करें[a] और मेरा दर्शन न चाहें; अपने संकट में वे बड़े यत्न से मुझे खोजेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक वे अपने दोष का भार न उठाएँ” अथवा “जब तक वे दोषी न ठहरें।” हिब्रू क्रिया दोष लगने, दोष उठाने या दोष स्वीकार करने का भाव दे सकती है; आगे प्रभु के दर्शन चाहने का संदर्भ “अपना दोष स्वीकार करें” के पक्ष में है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे भोर ही से मुझे खोजेंगे।” हिब्रू मुहावरा संभवतः केवल सुबह जल्दी खोजने के बजाय तत्परता और लगन से खोजने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֵךְ
  choice: मैं चला जाऊँगा
  rationale: הלך का काल रूप यहाँ आगामी प्रस्थान को व्यक्त करता है। ‘चला जाऊँगा’ आधुनिक हिन्दी में स्वाभाविक है और अगले क्रियापद ‘लौट जाऊँगा’ के साथ गति का क्रम बनाए रखता है।
- source_word: אָשׁוּבָה
  choice: लौट जाऊँगा
  rationale: שׁוב का सामान्य अर्थ ‘लौटना’ है। यह ‘अपने स्थान’ की ओर लौटने की स्थानिक छवि को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: מְקוֹמִי
  choice: अपने स्थान
  rationale: מקום का सीधा अर्थ ‘स्थान’ है। इससे परमेश्वर के हट जाने की छवि बनी रहती है, पर पाठ से आगे बढ़कर इसे घर, निवास या स्वर्ग नहीं कहा जाता।
- source_word: עַד אֲשֶׁר
  choice: जब तक कि
  rationale: यह पदबंध परमेश्वर के हटने की समय-सीमा बताता है; हिन्दी में ‘जब तक कि ... न’ उसी आशय और वाक्य-संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יֶאְשְׁמוּ
  choice: वे अपना दोष स्वीकार न करें
  rationale: אשם दोषी होने, दोष उठाने या दोष मान लेने का बोध दे सकता है। इसके बाद परमेश्वर के मुख की खोज का उल्लेख होने से यहाँ दोष पहचानने और स्वीकार करने का भाव संदर्भानुकूल है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: וּבִקְשׁוּ פָנַי
  choice: और मेरे मुख की खोज न करें
  rationale: בקשׁ + פנים परमेश्वर की उपस्थिति या कृपा खोजने का मुहावरा है। ‘मेरे मुख की खोज’ मूल बिंब और उसकी धर्मवैचारिक गूँज को बनाए रखती है, बिना उसे केवल ‘कृपा’ के अर्थ में सीमित किए।
- source_word: בַּצַּר לָהֶם
  choice: अपने संकट में
  rationale: यह पदबंध उस परिस्थिति को दर्शाता है जिसमें संकट उन पर आता है। ‘अपने संकट में’ संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
- source_word: יְשַׁחֲרֻנְנִי
  choice: वे बड़े यत्न से मुझे खोजेंगे
  rationale: שׁחר के पिएल रूप में भोर में या शीघ्र खोजने का शाब्दिक संकेत हो सकता है, पर मुहावरे में प्रायः तत्पर और लगनपूर्ण खोज का भाव है। ‘बड़े यत्न से’ उस तीव्रता को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के हट जाने का आशय
  choice: परमेश्वर अपने लोगों से न्याय-संबंधी और संबंधपरक रूप से हटता है, जब तक वे अपने दोष को स्वीकार करके उसकी खोज न करें।
  alternative: इसे पूर्ण और तात्त्विक परित्याग, अथवा केवल मनुष्य की अनुभूति में परिवर्तन के रूप में स्पष्ट करना।
  rationale: ‘मैं चला जाऊँगा’ और ‘अपने स्थान पर लौट जाऊँगा’ वाचा के न्याय के संदर्भ में परमेश्वर के हटने की छवि प्रस्तुत करते हैं। अनुवाद इस तनाव को बनाए रखता है और परमेश्वर की अनुपस्थिति के स्वरूप पर पाठ से बाहर की व्यवस्थित धर्मवैचारिक व्याख्या नहीं जोड़ता।
- issue: יֶאְשְׁמוּ में दोष का भाव
  choice: मुख्य पाठ में ‘अपना दोष स्वीकार करें’, साथ में पादटिप्पणी में दोष उठाने या दोषी ठहरने की संभावना।
  alternative: केवल ‘वे दोषी हों’ या ‘अपने दोष का दंड भोगें’।
  rationale: परमेश्वर के मुख की खोज और संकट में उसे यत्न से खोजने का निकट संदर्भ दोष की चेतना और स्वीकारोक्ति की ओर संकेत करता है, फिर भी हिब्रू क्रिया की वास्तविक व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
