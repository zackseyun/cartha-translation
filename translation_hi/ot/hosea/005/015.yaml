  register: भाषा आधुनिक मानक हिन्दी की है, पर गरिमामय बाइबिलीय शैली के लिए ‘मेरे मुख की खोज’ का मूल मुहावरा रखा गया है। ‘चला जाऊँगा’, ‘अपने संकट में’ और ‘बड़े यत्न से’ जैसे प्रयोग सामान्य पाठक के लिए सहज हैं। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
