source:
  edition: WLC
  text: לֹ֤א יִתְּנוּ֙ מַ֣עַלְלֵי/הֶ֔ם לָ/שׁ֖וּב אֶל אֱלֹֽהֵי/הֶ֑ם כִּ֣י ר֤וּחַ זְנוּנִים֙ בְּ/קִרְבָּ֔/ם וְ/אֶת יְהוָ֖ה לֹ֥א יָדָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/004.yaml
  text: Their deeds do not allow them to return to their God[a], for a spirit of whoredom is within them, and they do not know Yahweh.
translation:
  language: hi
  text: उनके काम उन्हें अपने परमेश्वर के पास लौटने नहीं देते,[a] क्योंकि उनके भीतर वेश्यावृत्ति की आत्मा है, और वे यहोवा को नहीं जानते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वेश्यावृत्ति की आत्मा” का अनुवाद “व्यभिचार की आत्मा” या “वेश्याचार की आत्मा” भी किया जा सकता है। इब्रानी में यौन बेवफाई का यह बिंब वाचा से विश्वासघात और मूर्तिपूजा के लिए प्रयुक्त हुआ है।
    reason: רוּחַ זְנוּנִים के वैकल्पिक अनुवाद और उसके भविष्यद्वक्ताई रूपकात्मक प्रयोग को स्पष्ट करना।
lexical_decisions:
- source_word: יִתְּנוּ
  choice: नहीं देते
  rationale: यहाँ נתן का मुहावरेदार अर्थ अनुमति देना या संभव होने देना है; ‘लौटने नहीं देते’ हिन्दी में स्वाभाविक रहते हुए मूल वाक्य की संरचना बनाए रखता है।
- source_word: מַעַלְלֵיהֶם
  choice: उनके काम
  rationale: यह शब्द उनके आचरण और नैतिक रूप से दोषपूर्ण कर्मों को सूचित करता है; ‘काम’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: לָשׁוּב
  choice: लौटने
  rationale: שׁוב में वापस आने और मन फिराने, दोनों की वाचा-संबंधी प्रतिध्वनि है; ‘लौटना’ इस व्यापकता को सुरक्षित रखता है।
- source_word: אֶל אֱלֹהֵיהֶם
  choice: अपने परमेश्वर के पास
  rationale: सन्दर्भ इस्राएल के वाचा के परमेश्वर की ओर लौटने का है; इसलिए एकवचन उचित है। ‘के पास’ सम्बन्धपरक वापसी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רוּחַ זְנוּנִים
  choice: वेश्यागमन की प्रवृत्ति
  rationale: רוּחַ यहाँ लोगों के भीतर सक्रिय और व्यापक झुकाव को दर्शाता है, जबकि זְנוּנִים यौन बेवफाई के बिंब द्वारा मूर्तिपूजा और वाचा-भंग को प्रकट करता है। यह पदबंध आधुनिक हिन्दी में अर्थगम्य रहते हुए बिंब की कठोरता बचाता है।
- source_word: בְּקִרְבָּם
  choice: उनके भीतर
  rationale: यह लोगों की आन्तरिक नैतिक और आत्मिक दशा को व्यक्त करता है, न कि केवल उनके बीच किसी बाहरी उपस्थिति को।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है; हिन्दी बाइबलीय प्रयोग में प्रचलित रूप ‘यहोवा’ अपनाया गया है।
- source_word: לֹא יָדָעוּ
  choice: नहीं जानते
  rationale: सीधा अनुवाद ज्ञान तथा सम्बन्धपरक-वाचागत पहचान, दोनों अर्थों की गहराई को खुला रखता है।
theological_decisions:
- issue: यौन बेवफाई का भविष्यद्वक्ताई रूपक
  choice: ‘वेश्यागमन की प्रवृत्ति’ द्वारा रूपक की तीव्रता और वाचा से बेवफाई का आशय सुरक्षित रखा गया।
  alternative: ‘व्यभिचार की आत्मा’ या ‘वेश्यावृत्ति की भावना’
  rationale: होशे में यौन बेवफाई का बिंब मूर्तिपूजा और वाचा-भंग के लिए प्रयुक्त है। ‘प्रवृत्ति’ आन्तरिक प्रेरक दशा को स्वाभाविक हिन्दी में बताती है, पर टिप्पणी मूल के वैकल्पिक अधिक शाब्दिक रूपों को दर्ज करती है।
- issue: ‘जानना’ का वाचागत अर्थ
  choice: ‘यहोवा को नहीं जानते’
  alternative: ‘यहोवा को नहीं मानते’ या ‘यहोवा से उनका सम्बन्ध नहीं है’
  rationale: मूल क्रिया में बौद्धिक पहचान से अधिक सम्बन्धपरक अर्थ हो सकता है; ‘जानते’ उस तनाव को किसी एक व्याख्या में सीमित नहीं करता।
- issue: אֱלֹהֵיהֶם का वचन और अभिप्रेत सन्दर्भ
  choice: एकवचन ‘अपने परमेश्वर’
  alternative: ‘अपने देवताओं’
  rationale: वाचा-विवाद के सन्दर्भ में आरोप यह है कि उनका आचरण उन्हें इस्राएल के सच्चे परमेश्वर के पास लौटने से रोकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘परमेश्वर’, ‘यहोवा’ और ‘वेश्यागमन’ बाइबलीय गम्भीरता बनाए रखते हैं; वाक्यरचना अनावश्यक संस्कृतनिष्ठता से बचती है।
