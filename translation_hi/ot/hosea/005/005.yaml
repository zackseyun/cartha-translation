source:
  edition: WLC
  text: וְ/עָנָ֥ה גְאֽוֹן יִשְׂרָאֵ֖ל בְּ/פָנָ֑י/ו וְ/יִשְׂרָאֵ֣ל וְ/אֶפְרַ֗יִם יִכָּֽשְׁלוּ֙ בַּ/עֲוֺנָ֔/ם כָּשַׁ֥ל גַּם יְהוּדָ֖ה עִמָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/005.yaml
  text: The pride of Israel testifies against him[a], and Israel and Ephraim will stumble in their guilt[c][b]; Judah also will stumble with them.
translation:
  language: hi
  text: इस्राएल का घमण्ड उसी के विरुद्ध गवाही देता है[a]; इस्राएल और एप्रैम अपने अधर्म के कारण ठोकर खाएँगे[b], और यहूदा भी उनके साथ ठोकर खा चुका है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “उसके मुँह के सामने गवाही देता है”; इसका अर्थ “उसके सामने” भी हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: 'या: “अपने दोष में” अथवा “अपने अधर्म में।” मूल शब्द नैतिक बुराई, दोष और उसके परिणाम का भाव रख सकता है।'
    reason: lexical_alternative
  - marker: c
    text: 'या: “यहूदा भी उनके साथ ठोकर खाएगा” अथवा “ठोकर खाता है।” यहूदा के लिए मूल इब्रानी क्रिया का रूप पिछली क्रिया से भिन्न है और उसके काल-पक्ष को एक से अधिक प्रकार से समझा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנָה
  choice: गवाही देता है
  rationale: 'यहाँ क्रिया का न्यायिक अर्थ उपयुक्त है: इस्राएल का घमण्ड स्वयं उसके विरुद्ध साक्ष्य बनता है।'
- source_word: גְאוֹן
  choice: घमण्ड
  rationale: शब्द का अर्थ ‘वैभव’ भी हो सकता है, पर आरोप, अधर्म और पतन के प्रसंग में नकारात्मक नैतिक अर्थ स्वाभाविक है।
- source_word: בְּפָנָיו
  choice: उसी के विरुद्ध
  rationale: शाब्दिक स्थानवाची मुहावरा ‘उसके मुँह के सामने’ है; न्यायिक संदर्भ में ‘उसके विरुद्ध’ इसका स्वाभाविक हिन्दी रूप है। एकवचन सर्वनाम सामूहिक इस्राएल को सूचित करता है।
- source_word: יִכָּשְׁלוּ
  choice: ठोकर खाएँगे
  rationale: यह पतन के रूपक को बनाए रखता है और अपूर्ण क्रिया के भावी अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: בַּעֲוֹנָם
  choice: अपने अधर्म के कारण
  rationale: עָוֹן में अधर्म, दोष और उसके दण्ड का संयुक्त भाव हो सकता है। कारणवाची हिन्दी यहाँ अर्थ स्पष्ट करती है, जबकि वैकल्पिक शाब्दिक रूप टिप्पणी में सुरक्षित है।
- source_word: כָּשַׁל
  choice: ठोकर खा चुका है
  rationale: यहूदा के लिए प्रयुक्त पूर्ण क्रिया को पहले के अपूर्ण बहुवचन से अलग रखता है और उसके पहले से उसी पतन में सम्मिलित होने का परिणामात्मक भाव व्यक्त करता है।
- source_word: עִמָּם
  choice: उनके साथ
  rationale: यह इस्राएल और एप्रैम के साथ यहूदा की साझी ठोकर और न्याय को दर्शाता है।
theological_decisions:
- issue: आरम्भिक वाक्य में इस्राएल के גְאוֹן का अर्थ
  choice: नैतिक घमण्ड, जो इस्राएल के विरुद्ध गवाही देता है
  alternative: इस्राएल का वैभव या महिमा उसके सामने गवाही देती है
  rationale: निकटवर्ती प्रसंग आरोप, अधर्म और न्याय के अधीन ठोकर का है; ‘घमण्ड’ भविष्यद्वक्ताई अभियोग को स्पष्ट रखता है।
- issue: यहूदा की क्रिया का काल-पक्ष
  choice: ‘ठोकर खा चुका है’
  alternative: ‘ठोकर खाएगा’ अथवा ‘ठोकर खाता है’
  rationale: मूल पाठ इस्राएल और एप्रैम के लिए अपूर्ण क्रिया, पर यहूदा के लिए पूर्ण क्रिया प्रयोग करता है। परिणामात्मक पूर्ण रूप इस अंतर को बचाता है, यद्यपि भविष्यसूचक क्रम के कारण भावी अर्थ भी सम्भव है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण भविष्यद्वक्ताई स्वर रखा गया है। ‘ठोकर खाना’ मूल रूपक को बचाता है। ‘इस्राएल’ और ‘एप्रैम’ नाम यथावत् रखे गए हैं; सर्वनाम ‘उसी’ सामूहिक इस्राएल की ओर लौटता है।
