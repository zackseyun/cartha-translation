base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/013.yaml
  text: When Ephraim saw his sickness[a], and Judah his wound, then Ephraim went to Assyria and sent to King Jareb; but he cannot heal you, nor can he cure your wound.
translation:
  language: hi
  text: जब एप्रैम ने अपनी बीमारी और यहूदा ने अपना घाव देखा, तब एप्रैम अश्शूर के पास गया और उसने राजा यारेब[a] को संदेश भेजा। पर वह न तो तुम्हें चंगा कर सकता है, न तुम्हारा घाव ठीक कर सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘राजा यारेब’ का अर्थ संभवतः ‘बदला लेने वाला राजा’ या ‘महान राजा’ भी हो सकता है; इब्रानी में ‘यारेब’ किसी व्यक्ति का नाम न होकर उपाधि हो सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: חָלְיוֹ
  choice: अपनी बीमारी
  rationale: यह शब्द बीमारी या रोग को दर्शाता है और यहाँ राष्ट्र की दशा के लिए प्रयुक्त चिकित्सकीय रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מְזֹרוֹ / מָזוֹר
  choice: अपना घाव / तुम्हारे घाव
  rationale: यह शब्द घाव या नासूर का अर्थ दे सकता है। ‘घाव’ सामान्य पाठक के लिए सहज है और मूल शारीरिक रूपक को बिना अनावश्यक चिकित्सकीय विशिष्टता के सुरक्षित रखता है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: यह इस प्रसंग में प्राचीन साम्राज्य का मानक हिन्दी बाइबलीय नाम है।
- source_word: מֶלֶךְ יָרֵב
  choice: यारेब राजा
  rationale: मुख्य पाठ में יָרֵב को नाम अथवा नाम-सदृश उपाधि मानकर लिप्यंतरित किया गया है; इसके वर्णनात्मक अर्थों की वास्तविक अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: וַיִּשְׁלַח אֶל
  choice: उसने ... के पास संदेश भेजा
  rationale: मूल में भेजी गई वस्तु या व्यक्ति व्यक्त नहीं है। हिन्दी में केवल ‘भेजा’ अपूर्ण लगता, इसलिए ‘संदेश’ जोड़कर राजनीतिक निवेदन का आशय स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: לִרְפֹּא לָכֶם
  choice: तुम्हें चंगा कर सकता है
  rationale: ल उपसर्ग यहाँ लाभार्थी अथवा कर्म-सदृश संबंध बताता है। यह हिन्दी अभिव्यक्ति उपचार के रूपक और सामूहिक संबोधन दोनों को स्पष्ट रखती है।
- source_word: יִגְהֶה מִכֶּם מָזוֹר
  choice: तुम्हारे घाव को ठीक कर सकता है
  rationale: दुर्लभ क्रिया का संदर्भगत अर्थ घाव हटाने या उसका उपचार करने से जुड़ा है। ‘घाव को ठीक करना’ स्वाभाविक हिन्दी है और निश्चितता से अधिक सूक्ष्म अर्थ आरोपित नहीं करता।
- source_word: וְהוּא
  choice: पर वह
  rationale: औपचारिक रूप से संयोजक ‘और’ है, किंतु प्रसंग में अश्शूर से सहायता माँगने और उसकी असमर्थता के बीच स्पष्ट विरोध है; इसलिए ‘पर’ उपयुक्त है।
theological_decisions:
- issue: ‘पर वह ... चंगा नहीं कर सकता’ में एकवचन सर्वनाम का संदर्भ
  choice: निकटतम एकवचन पूर्वपद ‘यारेब राजा’
  alternative: व्यापक रूप से अश्शूर राष्ट्र या उसकी राजनीतिक शक्ति
  rationale: व्याकरणतः निकटतम पूर्वपद राजा है, फिर भी कथन विदेशी सामर्थ्य की समग्र असमर्थता पर भी लागू होता है। अनुवाद ‘वह’ रखकर मूल का संदर्भगत तनाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। चिकित्सकीय रूपक तथा एप्रैम और यहूदा से बहुवचन ‘तुम्हें’ की ओर मूल के परिवर्तन को बनाए रखा गया है। पादटिप्पणी चिह्न [a] मुख्य पाठ में उसी विषय से जुड़े पहले रूपक के बाद रखा गया है, जबकि उसका विषय अस्पष्ट ‘यारेब राजा’ है; प्रकाशन में अधिक सटीक संबद्धता हेतु चिह्न को ‘यारेब राजा’ के बाद रखना बेहतर होगा।
