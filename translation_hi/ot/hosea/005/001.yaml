language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁמְעוּ זֹ֨את הַ/כֹּהֲנִ֜ים וְ/הַקְשִׁ֣יבוּ בֵּ֣ית יִשְׂרָאֵ֗ל וּ/בֵ֤ית הַ/מֶּ֨לֶךְ֙ הַאֲזִ֔ינוּ כִּ֥י לָ/כֶ֖ם הַ/מִּשְׁפָּ֑ט כִּֽי פַח֙ הֱיִיתֶ֣ם לְ/מִצְפָּ֔ה וְ/רֶ֖שֶׁת פְּרוּשָׂ֥ה עַל תָּבֽוֹר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/001.yaml
  text: Hear this[a], O priests; pay attention, house of Israel; and give ear, house of the king. For the judgment is for you[b], because you have been a trap at Mizpah and a net spread out upon Tabor.
translation:
  language: hi
  text: 'हे याजको, यह सुनो;

    हे इस्राएल के घराने, ध्यान दो;

    और हे राजा के घराने, कान लगाओ!

    क्योंकि न्याय तुमसे संबंधित है[a];

    क्योंकि तुम मिस्पा में फंदा

    और ताबोर पर बिछाया हुआ जाल बन गए हो।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि न्याय तुम्हारे विरुद्ध है।” इब्रानी वाक्यांश संक्षिप्त है और इसका अर्थ यह हो सकता है कि न्याय उनसे संबंधित है या उनके विरुद्ध निर्देशित है।
    reason: alternative_reading
  - marker: b
    text: मिस्पा और ताबोर स्थानों के नाम हैं। यहाँ संभवतः इस्राएल के जाने-पहचाने स्थलों का उल्लेख फंदे और जाल के बिंबों के साथ किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: सामान्य आज्ञार्थक क्रिया है; यह भविष्यद्वक्ता की गंभीर पुकार को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करती है।
- source_word: הַקְשִׁיבוּ
  choice: ध्यान दो
  rationale: यह पहली श्रवण-क्रिया से अधिक सचेत ध्यान देने का भाव रखती है और तीनों आज्ञाओं की अलंकारिक क्रमवृद्धि को बनाए रखती है।
- source_word: הַאֲזִינוּ
  choice: कान लगाओ
  rationale: तीसरी अलग श्रवण-अभिव्यक्ति के रूप में यह इब्रानी की अलंकारिक विविधता को सहज आधुनिक हिन्दी में सुरक्षित रखती है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: ‘घराना’ सामूहिक और वाचाई अभिव्यक्ति को सुरक्षित रखता है तथा अगले समानांतर पद ‘राजा का घराना’ से मेल खाता है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजा का घराना
  rationale: यह मूल अभिव्यक्ति और ‘इस्राएल का घराना’ के साथ उसके समानांतर ढाँचे को बनाए रखता है; आशय राजवंश या राजकीय मंडल भी हो सकता है, पर उसे मुख्य पाठ में सीमित नहीं किया गया।
- source_word: כִּי לָכֶם הַמִּשְׁפָּט
  choice: क्योंकि न्याय तुम्हारे लिए है
  rationale: इब्रानी वाक्यांश संक्षिप्त और अर्थ की दृष्टि से खुला है। यह रूप उसकी संरचना और ‘तुमसे संबंधित/तुम्हारे विरुद्ध’ दोनों संभावित बलों को सुरक्षित रखता है; प्रतिकूल अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַמִּשְׁפָּט
  choice: न्याय
  rationale: यह न्यायिक निर्णय का व्यापक भाव रखता है और हिन्दी में स्वाभाविक है; प्रसंग इसके दंडात्मक पक्ष को स्पष्ट करता है।
- source_word: פַח
  choice: फंदा
  rationale: शिकार को पकड़ने वाले उपकरण की सजीव छवि देता है और आधुनिक हिन्दी में सहज है।
- source_word: לְמִצְפָּה
  choice: मिस्पा में
  rationale: स्थान-नाम के साथ उपसर्ग को प्रसंगानुसार स्थानीय अर्थ में प्रस्तुत किया गया है।
- source_word: רֶשֶׁת פְּרוּשָׂה
  choice: बिछाया हुआ जाल
  rationale: जाल फैलाकर रखे जाने की दृश्यात्मक छवि और मूल कृदंतीय रचना दोनों को स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: עַל תָּבוֹר
  choice: ताबोर पर
  rationale: पर्वतीय स्थान के ऊपर जाल बिछाने की स्थलाकृतिक छवि को सीधे और स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: संबोधित समूहों और न्याय-वाक्य का संबंध
  choice: याजक, इस्राएल का घराना और राजा का घराना ऐसे समूहों के रूप में संबोधित हैं जिनसे यह न्याय संबंधित है और जिनके विरुद्ध प्रसंग में उसका दंडात्मक बल है।
  alternative: वाक्य को अधिक तटस्थ रूप में ‘न्याय का मामला तुमसे संबंधित है’ समझा जा सकता है।
  rationale: अगली पंक्ति के फंदे और जाल के आरोप दोष और दंड की दिशा दिखाते हैं, फिर भी לָכֶם की संक्षिप्तता के कारण मुख्य पाठ ‘तुम्हारे लिए’ रखता है और स्पष्ट ‘विरुद्ध’ पाठ को पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यद्वक्तापरक स्वर रखा गया है। ‘हे’ संबोधन और पंक्तिबद्ध समानांतरता काव्यात्मक गरिमा देते हैं, जबकि ‘सुनो,’ ‘ध्यान दो,’ और ‘कान लगाओ’ सामान्य पाठक के लिए स्पष्ट हैं। पादटिप्पणी-चिह्न उनके वास्तविक विषयों के पास रखे गए हैं।
