source:
  edition: WLC
  text: אֶפְרַ֨יִם֙ לְ/שַׁמָּ֣ה תִֽהְיֶ֔ה בְּ/י֖וֹם תּֽוֹכֵחָ֑ה בְּ/שִׁבְטֵי֙ יִשְׂרָאֵ֔ל הוֹדַ֖עְתִּי נֶאֱמָנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/009.yaml
  text: Ephraim will become a desolation in the day of rebuke[c][b][a]; among the tribes of Israel I have made known what is sure.
translation:
  language: hi
  text: ताड़ना[b] के दिन एप्रैम उजाड़[a] हो जाएगा; इस्राएल के गोत्रों के बीच मैंने वह बात प्रकट कर दी है जो निश्चित[c] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भयावह विनाश’। इब्रानी शब्द ऐसी उजड़ी हुई दशा का भी बोध करा सकता है जिसे देखकर लोग स्तब्ध रह जाएँ।
    reason: lexical_alternative
  - marker: b
    text: या ‘दंड के दिन’ अथवा ‘न्याय के दिन’। इस संदर्भ में ‘ताड़ना’ का दंडात्मक अर्थ है।
    reason: lexical_alternative
  - marker: c
    text: 'इसका अनुवाद यह भी हो सकता है: ‘मैंने निश्चय ही इसे प्रकट कर दिया है।’ इब्रानी अंतिम शब्द घोषणा की निश्चितता और विश्वसनीयता पर बल देता है।'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: इब्रानी व्यक्तिवाचक नाम को लिप्यंतरित किया गया है। होशे की पुस्तक में यह प्रायः उत्तरी राज्य का प्रतिनिधित्व करता है, पर मुख्य पाठ में उस अर्थ को व्याख्यात्मक रूप से नहीं जोड़ा गया।
- source_word: לְשַׁמָּה
  choice: उजाड़
  rationale: यह शब्द उजड़ जाने और ऐसी तबाही का भाव रखता है जो देखने वालों को स्तब्ध कर दे। ‘उजाड़ हो जाएगा’ आधुनिक हिन्दी में स्वाभाविक है और न्याय की भविष्यवाणी का बल बनाए रखता है।
- source_word: תִהְיֶה
  choice: हो जाएगा
  rationale: היה के साथ לְ यहाँ किसी अवस्था में आ जाने का भाव दे सकता है; इसलिए केवल ‘होगा’ के बजाय ‘हो जाएगा’ चुना गया।
- source_word: בְּיוֹם תּוֹכֵחָה
  choice: ताड़ना के दिन
  rationale: תּוֹכֵחָה का मूल भाव डाँट, सुधारात्मक भर्त्सना या ताड़ना है, यद्यपि इस न्याय-संदर्भ में दंड का भाव भी उपस्थित है। ‘ताड़ना’ इस तनाव को बिना पूरी तरह ‘दंड’ में बदल दिए बनाए रखती है।
- source_word: בְּשִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों के बीच
  rationale: ב को स्थान अथवा दायरे के अर्थ में लेकर ‘के बीच’ किया गया है, जो हिन्दी में स्वाभाविक है।
- source_word: הוֹדַעְתִּי
  choice: मैंने ... प्रकट कर दी है
  rationale: ידע के हिफ़ील रूप का अर्थ बताना, ज्ञात कराना या घोषित करना है। पूर्ण क्रिया को वर्तमान प्रभाव वाली पूर्ण घोषणा के रूप में व्यक्त किया गया है।
- source_word: נֶאֱמָנָה
  choice: वह बात ... जो निश्चित है
  rationale: אמן से निकला यह रूप दृढ़ता, विश्वसनीयता और निश्चितता व्यक्त करता है। यहाँ इसे घोषित बात की विशेषता के रूप में प्रस्तुत किया गया है, जबकि संभावित क्रियाविशेषणीय अर्थ फुटनोट में सुरक्षित है।
theological_decisions:
- issue: क्या एप्रैम को उत्तरी राज्य के रूप में स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘एप्रैम’ ही रखा गया
  alternative: ‘उत्तरी राज्य’ अथवा ‘इस्राएल का उत्तरी राज्य’
  rationale: इब्रानी पाठ सीधे एप्रैम कहता है। उसका प्रतिनिधिक अर्थ संदर्भ से समझा जा सकता है; उसे मुख्य पाठ में खोलना अनावश्यक व्याख्या होती।
- issue: न्याय के संदर्भ में תּוֹכֵחָה को कितना दंडात्मक बनाया जाए
  choice: ताड़ना
  alternative: दंड अथवा न्याय
  rationale: संदर्भ में दंड निश्चित रूप से निहित है, पर शब्द का सीधा अर्थ डाँट, भर्त्सना या ताड़ना है। चुना हुआ रूप शब्दार्थ और न्याय-संदर्भ दोनों के बीच का तनाव बनाए रखता है।
- issue: נֶאֱמָנָה का वाक्यगत संबंध
  choice: घोषित बात को ‘निश्चित’ बताना
  alternative: ‘मैंने निश्चय ही प्रकट कर दिया है’
  rationale: रूप को सार्थक विशेषण के रूप में समझना स्वाभाविक है, पर क्रियाविशेषणीय समझ भी संभव है; उसे फुटनोट में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गोत्र’, ‘ताड़ना’ और ‘प्रकट करना’ बाइबलीय संदर्भ में परिचित हैं, फिर भी सामान्य हिन्दी पाठक के लिए बोधगम्य हैं।
