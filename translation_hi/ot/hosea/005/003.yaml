base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/003.yaml
  text: I know Ephraim[a], and Israel is not hidden from me; for now, Ephraim, you have played the prostitute[b]; Israel is defiled.
translation:
  language: hi
  text: 'मैं एप्रैम को जानता हूँ,

    और इस्राएल मुझसे छिपा नहीं है;

    क्योंकि अब, हे एप्रैम, तूने वेश्यावृत्ति की है[a];

    इस्राएल अशुद्ध हो गया है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ वेश्यावृत्ति का बिंब वाचा के प्रति विश्वासघात को दर्शाता है। वैकल्पिक अनुवाद: “तूने वेश्या-जैसा आचरण किया है।”'
    reason: lexical_alternative
  - marker: b
    text: 'वैकल्पिक अनुवाद: “इस्राएल अशुद्ध है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: मैं ... जानता हूँ
  rationale: इब्रानी पूर्ण रूप यहाँ परमेश्वर के स्थायी और वर्तमान ज्ञान को व्यक्त करता है; हिन्दी का वर्तमान काल प्रसंग में स्वाभाविक है।
- source_word: נִכְחַד מִמֶּנִּי
  choice: मुझसे छिपा नहीं है
  rationale: यह निष्क्रिय अर्थ को बनाए रखता है और बिना अनावश्यक संभाव्यार्थ जोड़े सहज हिन्दी देता है।
- source_word: כִּי עַתָּה
  choice: क्योंकि अब
  rationale: כִּי पिछले कथन का कारण बताता है और עַתָּה वर्तमान स्थिति पर बल देता है।
- source_word: הִזְנֵיתָ
  choice: तूने वेश्यावृत्ति की है
  rationale: यह होशे में वाचा के प्रति विश्वासघात के लिए प्रयुक्त स्पष्ट वेश्यावृत्ति-रूपक को सुरक्षित रखता है; इसे केवल ‘विश्वासघात’ कहना मूल बिंब को नरम कर देता।
- source_word: נִטְמָא
  choice: अशुद्ध हो गया है
  rationale: निफ़अल रूप अशुद्ध होने या अशुद्ध अवस्था में आ जाने का भाव देता है; यह अनुष्ठानिक और नैतिक दोनों अनुगूँजों को खुला रखता है।
- source_word: אֶפְרַיִם / יִשְׂרָאֵל
  choice: एप्रैम / इस्राएल
  rationale: दोनों नामों को अलग रखा गया है, जिससे काव्यात्मक समानांतरता और उत्तरी राज्य के लिए ‘एप्रैम’ के प्रतिनिधिक प्रयोग की सूक्ष्मता बनी रहती है।
theological_decisions:
- issue: वाचा-विहीनता के लिए यौन रूपक
  choice: मुख्य पाठ में स्पष्ट वेश्यावृत्ति का बिंब बनाए रखना
  alternative: ‘तू विश्वासघाती हुआ है’
  rationale: होशे की भविष्यवाणी जानबूझकर वाचा के विश्वासघात को वेश्यावृत्ति के तीखे रूपक में व्यक्त करती है; सामान्यीकृत अनुवाद इसकी शक्ति घटा देता।
- issue: परमेश्वर के ज्ञान का कालगत भाव
  choice: वर्तमान काल ‘मैं ... जानता हूँ’
  alternative: ‘मैंने ... जाना है’
  rationale: संदर्भ परमेश्वर के वर्तमान, अचूक ज्ञान और इस्राएल के उससे न छिप सकने पर बल देता है; हिन्दी वर्तमान काल इस भाव को स्पष्ट रखता है।
- issue: נִטְמָא का परिणामसूचक भाव
  choice: ‘अशुद्ध हो गया है’
  alternative: ‘अशुद्ध है’
  rationale: परिणामी अवस्था को व्यक्त करते हुए यह इब्रानी निफ़अल के ‘अशुद्ध हो जाने’ के भाव को अधिक सीधे रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी शैली रखी गई है। ‘हे एप्रैम’ प्रत्यक्ष संबोधन को स्पष्ट करता है; एकवचन ‘तू’ मूल के एकवचन संबोधन और तीखे न्याय-वचन को बनाए रखता है।
