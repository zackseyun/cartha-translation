  text: עָשׁ֥וּק אֶפְרַ֖יִם רְצ֣וּץ מִשְׁפָּ֑ט כִּ֣י הוֹאִ֔יל הָלַ֖ךְ אַחֲרֵי צָֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/011.yaml
  text: Ephraim is oppressed, crushed in judgment, because he was determined to walk after filth.
translation:
  language: hi
  text: 'एप्रैम सताया गया है,

    न्याय के द्वारा कुचला गया है,

    क्योंकि उसने हठपूर्वक आदेश[a] के पीछे चलना ठान लिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का सामान्य अर्थ “आदेश” है, पर इस स्थान पर उसका आशय अनिश्चित है। कुछ लोग इसे किसी मानवीय आदेश के रूप में समझते हैं; अन्य अनुवाद संदर्भ या प्रस्तावित पाठ-संशोधन के आधार पर “मूर्तियों” अथवा “गंदगी” जैसे अर्थ देते हैं।
    reason: कठिन इब्रानी צָו और उससे जुड़े प्रमुख अनुवाद-विकल्पों को बिना किसी एक व्याख्या को निश्चित ठहराए पारदर्शी बनाना।
lexical_decisions:
- source_word: עָשׁוּק
  choice: सताया गया
  rationale: यह कर्मवाच्य अर्थ एप्रैम पर हुए दमन और उत्पीड़न को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: רְצוּץ מִשְׁפָּט
  choice: न्याय में कुचला गया
  rationale: रְצוּץ की तीव्र छवि ‘कुचला गया’ से बनी रहती है; מִשְׁפָּט को व्यापक और जानबूझकर कुछ खुला ‘न्याय’ रखा गया है, जो न्यायिक निर्णय अथवा दंडात्मक न्याय दोनों की ओर संकेत कर सकता है।
- source_word: הוֹאִיל הָלַךְ אַחֲרֵי
  choice: उसने हठ करके ... के पीछे चलना चुना
  rationale: הוֹאִיל यहाँ स्वेच्छा, दृढ़ निश्चय या हठ की बारीकी रखता है; यह अनुवाद इच्छा और दोषपूर्ण दृढ़ता दोनों को व्यक्त करता है।
- source_word: צָו
  choice: आदेश
  rationale: व्यंजनात्मक पाठ צו का सीधा अर्थ ‘आदेश’ है। शब्द और संदर्भ कठिन हैं, इसलिए वैकल्पिक समझों को मुख्य पाठ में थोपने के बजाय पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: एप्रैम किसके पीछे चला
  choice: ‘आदेश’ को मुख्य पाठ में रखा और पाठगत/अर्थगत कठिनाई को पादटिप्पणी में स्पष्ट किया।
  alternative: ‘गंदगी’, ‘मूर्तियों’ या किसी मानवीय आदेश के पीछे चलना।
  rationale: मसोराई पाठ का निकटतम प्रत्यक्ष अर्थ ‘आदेश’ है, पर यह स्पष्ट नहीं करता कि आदेश किसका है। ‘गंदगी’ जैसा पाठ संदर्भपरक व्याख्या या पाठ-संशोधन पर निर्भर है; अतः मूल की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: काव्यात्मक तीन-पंक्ति विन्यास रखा गया है। भाषा आधुनिक, dignified और सामान्य पाठक के लिए स्पष्ट है; ‘एप्रैम’ प्रचलित हिन्दी बाइबलीय नाम-रूप है।
