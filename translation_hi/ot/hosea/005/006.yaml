id: HOS.5.6
reference: Hosea 5:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/צֹאנָ֣/ם וּ/בִ/בְקָרָ֗/ם יֵֽלְכ֛וּ לְ/בַקֵּ֥שׁ אֶת יְהוָ֖ה וְ/לֹ֣א יִמְצָ֑אוּ חָלַ֖ץ מֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/006.yaml
  text: With their flocks and with their herds they will go to seek Yahweh[a], but they will not find him[b]; he has withdrawn from them.
translation:
  language: hi
  text: 'वे अपनी भेड़-बकरियों और गाय-बैलों को साथ लेकर[a]

    याहवे को खोजने जाएँगे,

    पर वे उसे नहीं पाएँगे;

    वह उनसे दूर हट गया है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: भेड़-बकरियों और गाय-बैलों को साथ लाने का उल्लेख संभवतः बलि के पशुओं के साथ याहवे को खोजने आने का संकेत है।
    reason: cultural_note
  - marker: b
    text: या “वह उनसे चला गया है” अथवा “उसने अपने आपको उनसे अलग कर लिया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֹאנָם וּבִבְקָרָם
  choice: अपनी भेड़-बकरियों और गाय-बैलों को साथ लेकर
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, तथा בָּקָר बड़े मवेशियों को दर्शाता है। साथ लेकर हिंदी में בְּ के संग-साथ के भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יֵלְכוּ לְבַקֵּשׁ
  choice: खोजने जाएँगे
  rationale: भविष्यसूचक प्रसंग में अपूर्ण क्रिया יֵלְכוּ को भविष्यकाल में और धार्मिक संदर्भ वाले בקש को खोजने के रूप में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְלֹא יִמְצָאוּ
  choice: पर वे उसे नहीं पाएँगे
  rationale: विरोधसूचक संबंध के कारण וְ को यहाँ पर कहा गया है; हिंदी में स्पष्टता के लिए निहित कर्म उसे जोड़ा गया है।
- source_word: חָלַץ מֵהֶם
  choice: वह उनसे दूर हट गया है
  rationale: חלץ यहाँ अपने को खींचकर अलग कर लेने या दूर हो जाने का भाव देता है। पूर्ण क्रिया को ऐसी पूरी हो चुकी क्रिया के रूप में रखा गया है जिसका परिणाम वर्तमान में बना हुआ है।
theological_decisions:
- issue: परमेश्वर के नाम का रूप
  choice: याहवे
  alternative: प्रभु या यहोवा
  rationale: मूल पाठ में उपाधि नहीं, व्यक्तिगत नाम יְהוָה है; इसलिए उसे सीधे लिप्यंतरित किया गया है।
- issue: लोगों के खोजने का स्वरूप
  choice: बलि के पशुओं का आशय मुख्य पाठ में न खोलकर टिप्पणी में बताया गया है
  alternative: मुख्य पाठ में ही बलि चढ़ाने के लिए जोड़ना
  rationale: भेड़-बकरियों और गाय-बैलों का उल्लेख बलिदान का प्रबल संकेत देता है, पर मूल पाठ बलि शब्द स्पष्ट रूप से नहीं कहता।
- issue: याहवे का अनुपलब्ध होना
  choice: वह उनसे दूर हट गया है
  alternative: उसने अपने आपको उनसे अलग कर लिया है या वह उनसे चला गया है
  rationale: यह लोगों की हर प्रकार की परमेश्वर-खोज को व्यर्थ नहीं ठहराता, बल्कि इस प्रसंग में उनके अनुष्ठानिक प्रयास की विफलता का कारण याहवे का पहले ही उनसे हट जाना बताता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भेड़-बकरियाँ और गाय-बैल छोटे तथा बड़े पालतू पशुओं के भेद को सामान्य हिंदी में स्पष्ट करते हैं। काव्यात्मक पंक्ति-विन्यास मूल वचन की गति और अंतिम न्यायसूचक कथन पर बल बनाए रखता है।
