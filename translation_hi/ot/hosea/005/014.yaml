base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/014.yaml
  text: For I am like a lion to Ephraim[a], and like a young lion to the house of Judah; I, I myself, will tear and go away; I will carry off[b], and there is no one to rescue.
translation:
  language: hi
  text: क्योंकि मैं एप्रैम के लिए सिंह[a] के समान और यहूदा के घराने के लिए युवा सिंह के समान हूँ। मैं, मैं ही, फाड़ डालूँगा और चला जाऊँगा; मैं उठा ले जाऊँगा, और छुड़ाने वाला कोई न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उग्र सिंह’; यहाँ प्रयुक्त इब्रानी शब्द में बल या उग्रता का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַּׁחַל
  choice: सिंह
  rationale: यह शब्द सिंह को दर्शाता है और इसमें बल या उग्रता का भाव हो सकता है। मुख्य पाठ में स्वाभाविक ‘सिंह’ रखा गया है; संभावित सूक्ष्म अर्थ पादटिप्पणी में दिया गया है।
- source_word: כְּפִיר
  choice: जवान सिंह
  rationale: यह प्रायः युवा सिंह के लिए प्रयुक्त होता है। ‘जवान सिंह’ काव्यात्मक समानांतरता और शिकारी की शक्ति दोनों बनाए रखता है।
- source_word: לְאֶפְרַיִם / לְבֵית יְהוּדָה
  choice: एप्रैम के लिए / यहूदा के घराने के लिए
  rationale: संबंधसूचक ל यहाँ न्याय के लक्ष्य से संबंध व्यक्त करता है। ‘के लिए’ आधुनिक हिन्दी में उपमा को सहज रूप देता है, जबकि ‘यहूदा का घराना’ सामूहिक पहचान का इब्रानी मुहावरा बनाए रखता है।
- source_word: אֲנִי אֲנִי
  choice: मैं, हाँ मैं ही
  rationale: दोहराया हुआ सर्वनाम प्रबल आत्म-बलाघात व्यक्त करता है। यह रूप उस पुनरुक्ति और जोर को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: אֶטְרֹף
  choice: फाड़ डालूँगा
  rationale: शिकारी पशु के बिंब में क्रिया शिकार को फाड़ने का अर्थ देती है। ‘फाड़ डालूँगा’ हिन्दी में इसकी तीव्रता को स्पष्ट रखता है और कर्म को मूल की तरह अनुक्त छोड़ता है।
- source_word: וְאֵלֵךְ
  choice: और चला जाऊँगा
  rationale: आक्रमण के बाद शिकारी के वहाँ से चले जाने का भाव है; यह आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: אֶשָּׂא
  choice: मैं उठा ले जाऊँगा
  rationale: नשא का अर्थ उठाना, ढोना या ले जाना हो सकता है। सिंह के बिंब में ‘उठा ले जाऊँगा’ शिकार को लेकर जाने का अर्थ बनाए रखता है।
- source_word: וְאֵין מַצִּיל
  choice: और छुड़ाने वाला कोई न होगा
  rationale: यह किसी भी बचाने या छुड़ाने वाले के अभाव को बताता है। यह रूप शिकार के बिंब और न्याय-संदर्भ दोनों में स्वाभाविक है।
theological_decisions:
- issue: न्याय में परमेश्वर का शिकारी के रूप में आत्म-वर्णन
  choice: सिंह और जवान सिंह के बिंब तथा फाड़ने और उठा ले जाने वाली क्रियाओं को सीधे बनाए रखा गया है।
  alternative: बिंब को नरम करके केवल सामान्य दण्ड का कथन करना।
  rationale: इब्रानी पाठ जानबूझकर तीखा शिकारी-बिंब प्रस्तुत करता है। इसे नरम करना न्याय-वाणी की शक्ति को घटा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। काव्यात्मक समानांतरता, दोहराए हुए ‘मैं’ का बल और न्याय-वाणी का तीखा शिकारी-बिंब सुरक्षित रखा गया है।
