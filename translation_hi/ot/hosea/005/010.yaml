  text: הָיוּ֙ שָׂרֵ֣י יְהוּדָ֔ה כְּ/מַסִּיגֵ֖י גְּב֑וּל עֲלֵי/הֶ֕ם אֶשְׁפּ֥וֹךְ כַּ/מַּ֖יִם עֶבְרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/010.yaml
  text: The princes of Judah have become like those who move a boundary marker[a]; on them I will pour out my wrath like water.
translation:
  language: hi
  text: यहूदा के शासक सीमा-चिह्न खिसकाने वालों[a] के समान हो गए हैं; मैं उन पर अपना क्रोध पानी की तरह उँडेल दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सीमा-रेखा हटाने वालों।” यह चित्र शाब्दिक रूप से संपत्ति की सीमा के चिह्न खिसकाने का, या रूपक के रूप में परमेश्वर द्वारा ठहराई गई सीमाओं का उल्लंघन करने का, संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיוּ
  choice: हो गए हैं
  rationale: यह रूप परिणामी अवस्था व्यक्त कर सकता है; इसलिए केवल ‘थे’ के बजाय ‘हो गए हैं’ आरोप की वर्तमान परिणति को सामने लाता है।
- source_word: שָׂרֵי יְהוּדָה
  choice: यहूदा के हाकिम
  rationale: שָׂרִים राजनीतिक शासकों, उच्च अधिकारियों या प्रधानों को दर्शाता है। ‘हाकिम’ आधुनिक हिन्दी में गरिमापूर्ण और सहज है तथा पदाधिकारियों का व्यापक अर्थ बनाए रखता है।
- source_word: כְּמַסִּיגֵי גְּבוּל
  choice: सीमा-चिह्न खिसकानेवालों के समान
  rationale: यह वाक्यांश भूमि की सीमा बतानेवाले चिह्न को अनुचित ढंग से हटाने या खिसकाने की ठोस कानूनी छवि जगाता है। यह अनुवाद उस छवि को सुरक्षित रखता है और उसके रूपकात्मक विस्तार को मुख्य पाठ में निर्धारित नहीं करता।
- source_word: גְּבוּל
  choice: सीमा-चिह्न
  rationale: शब्द सामान्यतः सीमा भी हो सकता है, पर इस मुहावरे में संपत्ति की सीमा दर्शानेवाला चिह्न अभिप्रेत हो सकता है। ‘सीमा-चिह्न’ ठोस दृश्य को स्पष्ट करता है।
- source_word: עֲלֵיהֶם
  choice: उन पर
  rationale: आनेवाले न्याय के लक्ष्य को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶשְׁפּוֹךְ
  choice: उण्डेल दूँगा
  rationale: यह क्रिया प्रकोप के प्रचुर और प्रबल रूप से बहाए जाने की सजीव छवि देती है; ‘उण्डेल दूँगा’ हिन्दी में उस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כַּמַּיִם
  choice: जल के समान
  rationale: मूल पाठ केवल ‘जल के समान’ कहता है, स्पष्ट रूप से ‘बाढ़’ नहीं; इसलिए अतिरिक्त चित्र जोड़े बिना उपमा सुरक्षित रखी गई है।
- source_word: עֶבְרָתִי
  choice: अपना प्रकोप
  rationale: עֶבְרָה तीव्र क्रोध या रोष को दर्शाता है। ‘प्रकोप’ भविष्यद्वाणी के न्याय-संबंधी प्रसंग में गंभीर, सुबोध और स्वाभाविक है।
theological_decisions:
- issue: यहूदा के हाकिमों पर लगाए गए आरोप का स्वरूप
  choice: परमेश्वर की ठहराई सीमाओं और सामाजिक न्याय के उल्लंघन की संभावना सहित सीमा-चिह्न खिसकाने की ठोस छवि को सुरक्षित रखा गया है।
  alternative: इसे केवल वास्तविक भूमि-हरण, केवल नैतिक अपराध, या केवल राजनीतिक सीमा-अतिक्रमण के रूप में स्पष्ट करना।
  rationale: इब्रानी पद भूमि की सीमा बदलने के परिचित अपराध को जगाता है, पर होशे संभवतः इसे व्यापक वाचा-भंग के रूपक के रूप में भी प्रयोग करता है। मुख्य पाठ किसी एक अर्थ को अंतिम नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। ‘हाकिम’, ‘सीमा-चिह्न’ और ‘प्रकोप’ सामान्य पाठक के लिए समझने योग्य हैं, जबकि मूल की कानूनी छवि और धार्मिक तनाव सुरक्षित रहते हैं।
