  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/יהוָ֣ה בָּגָ֔דוּ כִּֽי בָנִ֥ים זָרִ֖ים יָלָ֑דוּ עַתָּ֛ה יֹאכְלֵ֥/ם חֹ֖דֶשׁ אֶת חֶלְקֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/007.yaml
  text: They have dealt faithlessly with Yahweh[a], for they have borne foreign children[b]. Now the new moon will devour them with their portions.
translation:
  language: hi
  text: उन्होंने यहोवा से विश्वासघात किया है, क्योंकि उन्होंने पराई संतान[b] उत्पन्न की है। अब नया चाँद[a] उन्हें उनके हिस्सों समेत निगल जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब एक महीना उन्हें उनके हिस्सों समेत निगल जाएगा।” हिब्रू शब्द חֹדֶשׁ का अर्थ “नया चाँद” या “महीना” दोनों हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “पराई संतान” वाचा-विरुद्ध संबंधों से उत्पन्न बच्चों की ओर या, अधिक व्यापक रूप से, यहोवा से विमुख पीढ़ी की ओर संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה בָּגָדוּ
  choice: उन्होंने यहोवा से विश्वासघात किया है
  rationale: ב के साथ בגד उस व्यक्ति को सूचित करता है जिसके प्रति विश्वासघात हुआ। ‘विश्वासघात’ वाचा-संबंधी बेवफाई और गंभीर छल दोनों को स्वाभाविक हिन्दी में व्यक्त करता है। परमेश्वर के विशिष्ट नाम יהוה को ‘यहोवा’ रखा गया है।
- source_word: בָנִים זָרִים
  choice: पराए बच्चे
  rationale: זָרִים का मूल अर्थ ‘पराए/विदेशी’ है। ‘पराए बच्चे’ इस अस्पष्टता को बनाए रखता है कि आशय अनुचित संबंधों से उत्पन्न बच्चों का है या यहोवा से विमुख नई पीढ़ी का; इसे केवल जातीय अर्थ तक सीमित नहीं करता।
- source_word: יָלָדוּ
  choice: जन्म दिया है
  rationale: ילד यहाँ संतान उत्पन्न करने का सामान्य भाव रखता है। बहुवचन कर्ता के साथ यह सहज हिन्दी है और मातृ-पितृ भूमिका को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: עַתָּה יֹאכְלֵם
  choice: अब ... उन्हें ... निगल जाएगा
  rationale: עַתָּה न्याय की आसन्नता व्यक्त करता है और אכל का रूपकात्मक प्रयोग विनाशकारी भक्षण को दर्शाता है; ‘निगल जाएगा’ इस चित्र को स्वाभाविक रूप से बनाए रखता है।
- source_word: חֹדֶשׁ
  choice: नया चाँद
  rationale: חֹדֶשׁ के अर्थ ‘नया चाँद’ और ‘महीना’ दोनों हो सकते हैं। मुख्य पाठ में होशे की पर्व-संबंधी पृष्ठभूमि के अनुरूप ‘नया चाँद’ रखा गया है, जबकि समयावधि वाला अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: חֶלְקֵיהֶם
  choice: उनकी सम्पत्ति
  rationale: חֵלֶק हिस्से, बाँट, भू-भाग या अधिकार में मिली सम्पत्ति को सूचित कर सकता है। यहाँ ‘सम्पत्ति’ सामान्य हिन्दी में लोगों के साथ नष्ट होने वाली उनकी भूमि और अधिकार की वस्तुओं का व्यापक भाव देता है।
theological_decisions:
- issue: ‘पराए बच्चों’ का आशय
  choice: हिब्रू रूपक को ‘पराए बच्चे’ के रूप में बनाए रखा गया है, जिसका संकेत वाचा से विमुख या वाचा-विरुद्ध संबंधों से जुड़ी संतान की ओर हो सकता है।
  alternative: विदेशियों से विवाह द्वारा उत्पन्न बच्चे; अथवा यहोवा से विमुख एक पीढ़ी।
  rationale: संदर्भ में केवल जातीय पहचान निश्चित करना अत्यधिक व्याख्यात्मक होगा। मुख्य पाठ और पादटिप्पणी पारिवारिक तथा आत्मिक दोनों आयामों को खुला रखते हैं।
- issue: न्याय-वाक्य में חֹדֶשׁ का अर्थ
  choice: मुख्य पाठ में ‘नया चाँद’, अर्थात पर्व या धार्मिक पंचांग का अवसर जो न्याय का अवसर बनता है।
  alternative: ‘एक महीना’, अर्थात थोड़े समय में आने वाला न्याय।
  rationale: दोनों अर्थ शब्दकोशीय रूप से संभव हैं। मुख्य पाठ सांस्कृतिक-धार्मिक प्रतिध्वनि रखता है और पादटिप्पणी काल-संबंधी विकल्प को स्पष्ट करती है।
- issue: חֶלְקֵיהֶם की सीमा
  choice: ‘उनकी सम्पत्ति’, जिसमें उनके हिस्से, भूमि या अधिकार की वस्तुएँ सम्मिलित हो सकती हैं।
  alternative: ‘उनके हिस्से’ अथवा ‘उनके भू-भाग’।
  rationale: संज्ञा की व्यापकता बनाए रखते हुए आधुनिक हिन्दी में वाक्य को स्पष्ट और स्वाभाविक रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और भविष्यद्वाणी-संबंधी तीव्रता वाला रूप। ‘यहोवा’, ‘विश्वासघात’, ‘पराए बच्चे’ और ‘निगल जाएगा’ मूल के वाचा-संबंधी तथा न्यायात्मक चित्रों को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
