base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/012.yaml
  text: So I am like a moth to Ephraim[a], and like rot to the house of Judah.
translation:
  language: hi
  text: और मैं एप्रैम के लिए पतंगे के समान, और यहूदा के घराने के लिए सड़न[a] के समान हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गलन’ अथवा ‘क्षय’। इब्रानी शब्द भीतर से सड़ने और धीरे-धीरे नष्ट होते जाने की छवि देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: इसलिए मैं
  rationale: וַ conjunction संदर्भ में पहले कही गई बातों के परिणामस्वरूप आने वाली दिव्य घोषणा को आगे बढ़ाता है, और स्वतंत्र सर्वनाम אֲנִי ‘मैं’ पर बल देता है। ‘इसलिए मैं’ आधुनिक हिन्दी में इस संबंध और बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָעָשׁ
  choice: पतंगे के समान
  rationale: עָשׁ सामान्यतः कपड़े को धीरे-धीरे नष्ट करने वाले पतंगे को दर्शाता है। ‘पतंगे के समान’ मूल उपमा और क्रमिक विनाश की छवि को बनाए रखता है।
- source_word: לְאֶפְרָיִם
  choice: एप्रैम के लिए
  rationale: לְ यहाँ एप्रैम को उस समुदाय के रूप में चिह्नित करता है जिसके संबंध में यहोवा पतंगे के समान है। ‘एप्रैम’ को ‘इस्राएल’ बनाकर सामान्यीकृत नहीं किया गया, क्योंकि इब्रानी पाठ विशिष्ट नाम रखता है।
- source_word: וְכָרָקָב
  choice: और ... सड़न के समान
  rationale: רָקָב का अर्थ सड़न, गलन या क्षय है। ‘सड़न’ भीतर से होने वाले क्रमिक बिगाड़ और विनाश की ठोस छवि को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: לְבֵית יְהוּדָה
  choice: यहूदा के घराने के लिए
  rationale: ‘यहूदा का घराना’ בֵית יְהוּדָה की सामुदायिक और वंशगत अभिव्यक्ति को सुरक्षित रखता है; इसे केवल ‘यहूदा’ कर देना मूल रूप को अनावश्यक रूप से समतल कर देता।
theological_decisions:
- issue: परमेश्वर का विनाशकारी साधनों से अपनी तुलना करना
  choice: पद को इस रूप में रखा गया है कि यहोवा स्वयं को एप्रैम के लिए पतंगे और यहूदा के घराने के लिए सड़न के समान बताता है।
  alternative: ‘मैं एप्रैम को पतंगे की तरह खा जाऊँगा और यहूदा को सड़ा दूँगा।’
  rationale: इब्रानी पाठ क्रियात्मक व्याख्या के बजाय संज्ञात्मक उपमाएँ देता है। मूल उपमाओं को बनाए रखना क्रमिक न्याय की भविष्यद्वक्तापूर्ण छवि और उसका तनाव सुरक्षित रखता है तथा पाठ से अधिक स्पष्ट क्रिया आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पतंगा,’ ‘सड़न’ और ‘घराना’ मूल भविष्यद्वक्तापूर्ण चित्रों को बिना अनावश्यक व्याख्या के बनाए रखते हैं।
