    rationale: The Hebrew noun denotes slaughter or bloodshed and is best represented here by ‘रक्तपात,’ not merely an individual act of murder.
  - severity: medium
    issue: ‘अनुशासन’ weakens and sounds less natural for מוּסָר in this nominal prophetic declaration.
    rationale: In this context מוּסָר has a corrective, chastening force. ‘ताड़ना’ communicates that force more directly, while the footnote can retain ‘अनुशासन’ and ‘शिक्षा’ as alternatives.
