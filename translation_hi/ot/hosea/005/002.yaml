  rationale: The revision sharpens the violent collective sense of שַׁחֲטָה and renders מוּסָר with a more natural Hindi term for corrective chastisement in a judgment context. It retains the Hebrew metaphor, the divine first-person declaration, and the lexical ambiguity through anchored alternatives.
