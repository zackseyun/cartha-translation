base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/002.yaml
  text: The rebels have gone deep into slaughter[b][a], but I am a rebuke to all of them.
translation:
  language: hi
  text: विद्रोही रक्तपात में बहुत गहरे उतर गए हैं,[a] पर मैं उन सबके लिए ताड़ना हूँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मार्ग से भटके लोग रक्तपात में बहुत गहरे धँस गए हैं।”
    reason: lexical_alternative
  - marker: b
    text: या, “अनुशासन”; अथवा “शिक्षा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטָה
  choice: हत्या में
  rationale: שַׁחֲטָה वध या हत्या को सूचित करता है। यहाँ इसे अगले क्रियापद के साथ जोड़कर रक्तपात में गहरे उतरने के रूप में रखना स्वाभाविक है; आरंभिक וְ को अलग से व्यक्त करना आवश्यक नहीं।
- source_word: שֵׂטִים
  choice: विद्रोही
  rationale: यह शब्द मार्ग से हटने या भटकने वालों को दर्शाता है। संदर्भ में ‘विद्रोही’ नैतिक और वाचा-विरोधी भाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘धर्मत्यागी’ अधिक व्याख्यात्मक है।
- source_word: הֶעְמִיקוּ
  choice: बहुत गहरे उतर गए हैं
  rationale: हिफ़ील पूर्ण रूप का शाब्दिक भाव ‘गहरा करना’ है, पर यहाँ बुराई में अत्यधिक आगे बढ़ने का रूपक है। ‘बहुत गहरे उतर गए हैं’ रूपक को बनाए रखता है और हिन्दी में सहज है।
- source_word: וַאֲנִי
  choice: पर मैं
  rationale: 'וְ प्रसंग में विरोधसूचक है: लोगों के रक्तपात के विपरीत यहोवा की अनुशासनकारी प्रतिक्रिया सामने आती है।'
- source_word: מוּסָר
  choice: अनुशासन
  rationale: מוּסָר में अनुशासन, सुधार, ताड़ना या शिक्षा के अर्थ संभव हैं। न्याय के इस प्रसंग में ‘अनुशासन’ दंडात्मक और सुधारात्मक दोनों पक्षों को बनाए रखता है तथा ‘मैं ... अनुशासन हूँ’ नामवाचक वाक्य की संरचना भी सुरक्षित रखता है।
- source_word: לְכֻלָּם
  choice: उन सबके लिए
  rationale: לְ को यहाँ ‘के लिए’ कहना स्वाभाविक है और दिव्य अनुशासन के सार्वभौमिक दायरे को व्यक्त करता है, बिना इसे अधिक प्रबल ‘उन सबके विरुद्ध’ बनाने के।
theological_decisions:
- issue: वक्ता की पहचान और उसकी प्रतिक्रिया का स्वरूप
  choice: वक्ता यहोवा है, जो स्वयं को उन सबके लिए अनुशासन घोषित करता है।
  alternative: इसे अधिक शिक्षापरक अर्थ में ‘मैं उन सबके लिए शिक्षा हूँ’ या अधिक दंडात्मक अर्थ में ‘मैं उन सबके लिए ताड़ना हूँ’ कहा जा सकता है।
  rationale: आसपास का प्रसंग वाचा-भंग के आरोप और न्याय का है, इसलिए מוּסָר में सुधारात्मक दंड का भाव प्रमुख है; फिर भी ‘अनुशासन’ उसके शिक्षापरक आयाम को पूरी तरह समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, गंभीर और भविष्यवाणी-संबंधी आरोप के अनुकूल है। ‘हत्या में बहुत गहरे उतर गए’ मूल रूपक को सहज हिन्दी में बनाए रखता है।
