id: HOS.8.7
reference: Hosea 8:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֛י ר֥וּחַ יִזְרָ֖עוּ וְ/סוּפָ֣תָ/ה יִקְצֹ֑רוּ קָמָ֣ה אֵֽין ל֗/וֹ צֶ֚מַח בְּלִ֣י יַֽעֲשֶׂה קֶּ֔מַח אוּלַ֣י יַֽעֲשֶׂ֔ה זָרִ֖ים יִבְלָעֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/007.yaml
  text: For they sow the wind[a], and they will reap the whirlwind. The standing grain has no head; it will yield no flour. Even if it should yield[c][b], strangers will swallow it up.
translation:
  language: hi
  text: क्योंकि वे हवा बोते हैं और बवंडर[a] काटेंगे। खड़ी फसल की बाल[b] नहीं होगी; उससे आटा नहीं निकलेगा। यदि वह उपज दे भी[c], तो परदेशी उसे निगल जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रचंड आँधी।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “खड़ी फसल में कोई צמח नहीं”; इस संज्ञा का अर्थ “अंकुर” या “बढ़वार” भी हो सकता है, पर यहाँ सम्भवतः अनाज की वह बाल अभिप्रेत है जिससे आटा बनता है।
    reason: lexical_alternative
  - marker: c
    text: या “शायद वह उपज दे, पर परदेशी उसे निगल जाएँगे।”
    reason: alternative_reading
lexical_decisions:
- source_word: ר֥וּחַ
  choice: हवा
  rationale: खेती और बोने-काटने के रूपक में ठोस अर्थ ‘हवा’ स्वाभाविक है; ‘आत्मा’ या ‘साँस’ संदर्भ से समर्थित नहीं हैं।
- source_word: וְ/סוּפָ֣תָ/ה
  choice: और बवंडर
  rationale: סוּפָה प्रचंड आँधी या बवंडर को दर्शाता है। ‘बवंडर’ साधारण हवा से विनाशकारी हवा तक की अलंकारिक तीव्रता बनाए रखता है।
- source_word: יִקְצֹ֑רוּ
  choice: काटेंगे
  rationale: बोने और फसल काटने के कृषि-संबंधी समानांतर को बनाए रखते हुए अपूर्ण क्रिया को भावी परिणाम के रूप में व्यक्त किया गया है।
- source_word: קָמָ֣ה
  choice: खड़ी फसल
  rationale: यह खेत में खड़े अनाज को सूचित करता है; आधुनिक हिन्दी में ‘खड़ी फसल’ स्पष्ट और स्वाभाविक है।
- source_word: צֶ֚מַח
  choice: बाल
  rationale: शब्द सामान्यतः अंकुर या बढ़वार कह सकता है, पर अनाज और आटे के इस संदर्भ में वह दाने वाली बाल को सूचित करता प्रतीत होता है। वास्तविक शाब्दिक व्यापकता पादटिप्पणी में रखी गई है।
- source_word: בְּלִ֣י יַֽעֲשֶׂה קֶּ֔מַח
  choice: उससे आटा नहीं निकलेगा
  rationale: यह असफल फसल की अनुपयोगिता को स्वाभाविक हिन्दी में व्यक्त करता है और आटा उत्पन्न न होने का कृषि-संबंधी अर्थ बनाए रखता है।
- source_word: אוּלַ֣י
  choice: यदि ... भी
  rationale: 'यहाँ सम्भावना रियायती अर्थ लेती है: मान लें कि कुछ उपज हो भी, तब भी इस्राएल को उसका लाभ नहीं मिलेगा। ‘शायद’ वाला अधिक सीधा अर्थ पादटिप्पणी में दिया गया है।'
- source_word: זָרִ֖ים
  choice: परदेशी
  rationale: यह बाहरी या विदेशी लोगों को दर्शाता है। ‘परदेशी’ आधुनिक हिन्दी में संक्षिप्त है और बताता है कि उपज इस्राएल के बजाय दूसरे लोग खाएँगे।
- source_word: יִבְלָעֻֽ/הוּ
  choice: उसे निगल जाएँगे
  rationale: בלע के सजीव ‘निगलना’ रूपक को सुरक्षित रखा गया है, जो पूरी तरह हड़प लिए जाने का भाव देता है।
- source_word: כִּ֛י
  choice: क्योंकि
  rationale: यह पिछले न्याय-वचन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ उस तर्क-संबंध को स्पष्ट रखता है।
theological_decisions:
- issue: कृषि-रूपक की व्याख्या
  choice: न्याय के बोने-काटने वाले रूपक को सीधे बनाए रखा गया है, बिना उसका अर्थ अनुवाद में खोलकर बताने के।
  alternative: ‘हवा’ को व्यर्थता और ‘बवंडर’ को विपत्ति कहकर भावार्थ करना।
  rationale: पद स्वयं इस्राएल के कर्मों और उनके परिणाम का ठोस कृषि-रूपक देता है। सीधा रूपक न्याय के धर्मवैज्ञानिक अर्थ को पाठ से उभरने देता है और किसी विशेष व्याख्या को आरोपित नहीं करता।
- issue: אוּלַי का सम्भावनात्मक अथवा रियायती बल
  choice: मुख्य पाठ में ‘यदि ... भी’ रखकर रियायती सम्भावना व्यक्त की गई है।
  alternative: ‘शायद उससे कुछ निकले; पर परदेशी उसे निगल जाएँगे।’
  rationale: दोनों अर्थ सम्भव हैं। संदर्भ में अंतिम परिणाम की अनिवार्यता के कारण रियायती अर्थ स्वाभाविक है, जबकि सीधी सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हवा बोना—बवंडर काटना’ की तीखी भविष्यद्वाणी-संबंधी छवि और ‘निगल जाना’ का सजीव रूपक सुरक्षित हैं।
