source:
  edition: WLC
  text: כִּֽי הִרְבָּ֥ה אֶפְרַ֛יִם מִזְבְּחֹ֖ת לַ/חֲטֹ֑א הָיוּ ל֥/וֹ מִזְבְּח֖וֹת לַ/חֲטֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/011.yaml
  text: Because Ephraim has multiplied altars for sinning[a], they have become altars for sinning to him.
translation:
  language: hi
  text: क्योंकि एप्रैम ने पाप करने के लिए बहुत-सी वेदियाँ बनाईं[a]; वे उसके लिए पाप करने की वेदियाँ बन गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर ‘पाप करने’ का अनुवाद ‘पापबलि चढ़ाने’ भी हो सकता है। इब्रानी रूप का बलिदानीय अर्थ लिया जा सकता है, पर प्रसंग इस बात का समर्थन करता है कि ये वेदियाँ पाप के अवसर बन गई थीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद न्याय के प्रसंग का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִרְבָּה
  choice: बहुत-सी ... बनाईं
  rationale: रבה के हिफ़ील रूप में बढ़ाने या बहुगुणित करने का भाव है। वेदियों के साथ ‘बहुत-सी ... बनाईं’ सामान्य हिन्दी में उनकी बढ़ती संख्या को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: मूल पाठ के व्यक्तिवाचक नाम को लिप्यंतरित किया गया है। होशे में यह प्रायः उत्तरी राज्य का प्रतिनिधित्व करता है, पर पाठ में आए नाम को ही रखा गया है।
- source_word: מִזְבְּחֹת
  choice: वेदियाँ
  rationale: מזבח का प्रचलित हिन्दी पर्याय है। बहुवचन बनाए रखने से अनुचित उपासना-स्थलों की बढ़ती संख्या पर दिया गया बल सुरक्षित रहता है।
- source_word: לַחֲטֹא
  choice: पाप करने के लिए
  rationale: חטא के क्रियार्थक भाव को प्राथमिकता दी गई है। प्रसंग में ये वेदियाँ अपराध का साधन या अवसर बनती हैं; साथ ही वैकल्पिक बलिदानीय अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הָיוּ לוֹ
  choice: वे उसके लिए ... बन गईं
  rationale: परिणामी अवस्था को ‘बन गईं’ से व्यक्त किया गया है और לוֹ के संबंधसूचक भाव को ‘उसके लिए’ के रूप में बनाए रखा गया है।
- source_word: מִזְבְּחוֹת לַחֲטֹא
  choice: पाप करने की वेदियाँ
  rationale: 'मूल की पुनरावृत्ति और व्यंग्य को सुरक्षित रखा गया है: जिन वेदियों को एप्रैम ने बढ़ाया, वही उसके लिए पाप का साधन बन गईं।'
theological_decisions:
- issue: दोनों स्थानों पर לַחֲטֹא का अर्थ
  choice: क्रियार्थक अर्थ—‘पाप करने के लिए/पाप करने की’
  alternative: बलिदानीय अर्थ—‘पापबलि के लिए’
  rationale: यद्यपि חטא का रूप कुछ प्रसंगों में पापबलि से संबंधित हो सकता है, यहाँ का निकट प्रसंग एप्रैम की बढ़ाई हुई वेदियों को अपराध के अवसर के रूप में दोषी ठहराता है। मुख्य पाठ में क्रियार्थक अर्थ रखा गया है, पर वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, स्पष्ट और गरिमापूर्ण शैली रखी गई है। ‘वेदियाँ’ बाइबिलीय धार्मिक संदर्भ में परिचित शब्द है। मूल की दोहरावपूर्ण भविष्यद्वक्तापरक विडंबना को जानबूझकर बनाए रखा गया है।
