language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֵ֤ם הִמְלִיכוּ֙ וְ/לֹ֣א מִמֶּ֔/נִּי הֵשִׂ֖ירוּ וְ/לֹ֣א יָדָ֑עְתִּי כַּסְפָּ֣/ם וּ/זְהָבָ֗/ם עָשׂ֤וּ לָ/הֶם֙ עֲצַבִּ֔ים לְמַ֖עַן יִכָּרֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/004.yaml
  text: They made kings, but not from me; they appointed princes, but I did not know it. With their silver and their gold they made idols for themselves, so that they might be cut off.
translation:
  language: hi
  text: उन्होंने राजा बनाए, पर मेरी ओर से नहीं; उन्होंने हाकिम ठहराए, पर मुझे इसकी जानकारी नहीं थी। उन्होंने अपनी चाँदी और अपने सोने से अपने लिए मूर्तियाँ बनाईं, ताकि वह नाश हो जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִמְלִיכוּ
  choice: राजा बनाए
  rationale: हिफ़ील रूप का अर्थ किसी को राजा बनाना है; यह स्वाभाविक हिन्दी में मूल क्रिया को सीधे व्यक्त करता है।
- source_word: מִמֶּנִּי
  choice: मेरी ओर से
  rationale: 'यह स्रोत या प्राधिकार की ओर संकेत करता है: उनकी राजनियुक्ति परमेश्वर की ओर से नहीं थी।'
- source_word: הֵשִׂירוּ
  choice: हाकिम ठहराए
  rationale: यहाँ पदाधिकारियों या प्रधानों की नियुक्ति का भाव है; ‘हाकिम’ सामान्य पाठक के लिए शासनाधिकारी का व्यापक अर्थ बनाए रखता है।
- source_word: וְלֹא יָדָעְתִּי
  choice: पर मैं उन्हें नहीं जानता था
  rationale: ‘जानना’ मूल की जानबूझकर तीखी और संभावित रूप से बहुअर्थी अभिव्यक्ति को सुरक्षित रखता है; इसे केवल ‘स्वीकृति नहीं दी’ बनाकर अर्थ सीमित नहीं किया गया।
- source_word: עֲצַבִּים
  choice: मूर्तियाँ
  rationale: संदर्भ में धातु से बनी उपासना-वस्तुएँ अभिप्रेत हैं; आधुनिक हिन्दी में ‘मूर्तियाँ’ स्पष्ट और स्वाभाविक है।
- source_word: לְמַעַן יִכָּרֵת
  choice: ताकि वे नाश कर दिए जाएँ
  rationale: उद्देश्य/परिणाम सूचक לְמַעַן और निष्क्रिय יִכָּרֵת को बनाए रखता है; बहुवचन कर्ता संभवतः लोगों की ओर लौटता है।
theological_decisions:
- issue: ‘मैं नहीं जानता था’ में परमेश्वर के ज्ञान का आशय
  choice: शाब्दिक ‘मैं उन्हें नहीं जानता था’ रखा गया
  alternative: ‘मैंने उन्हें मान्यता नहीं दी’ या ‘मेरी अनुमति के बिना’
  rationale: हिब्रू ידע वास्तविक अज्ञान के बजाय पहचान, संबंध या अनुमोदन का भाव दे सकता है, पर पद स्वयं इसे स्पष्ट नहीं करता; इसलिए तनाव और अस्पष्टता सुरक्षित रखी गई।
- issue: अंतिम वाक्य में नाश किसका है
  choice: ‘वे’ द्वारा लोगों/इस्राएल की ओर संभावित संकेत बनाए रखा गया
  alternative: ‘मूर्तियाँ नष्ट कर दी जाएँ’
  rationale: יִכָּרֵת पुल्लिंग एकवचन है, जबकि עֲצַבִּים बहुवचन है; इसलिए इसे निकटवर्ती ‘मूर्तियों’ से स्पष्ट रूप से जोड़ना व्याकरणतः कठिन है। सामूहिक इस्राएल/जनता की ओर संकेत संभव है।
- issue: लְמַעַן का संबंध उद्देश्य या परिणाम से
  choice: ‘ताकि’
  alternative: ‘जिसके परिणामस्वरूप’
  rationale: मूल उद्देश्य-सूचक भाषा रखी गई है, भले ही संदर्भ में यह विडंबनापूर्ण परिणाम भी व्यक्त कर सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और अपेक्षाकृत औपचारिक शैली। समानांतर वाक्यरचना और आरोपात्मक लय सुरक्षित रखी गई है; किसी सम्प्रदाय-विशेष की व्याख्या नहीं जोड़ी गई।
