source:
  edition: WLC
  text: זָנַח֙ עֶגְלֵ֣/ךְ שֹֽׁמְר֔וֹן חָרָ֥ה אַפִּ֖/י בָּ֑/ם עַד מָתַ֕י לֹ֥א יוּכְל֖וּ נִקָּיֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/005.yaml
  text: He has rejected your calf[a], O Samaria; my anger burns against them[b]. How long will they be incapable of innocence?
translation:
  language: hi
  text: हे सामरिया, उसने तेरे बछड़े को ठुकरा दिया है[a]; उन पर मेरा क्रोध भड़का है। वे कब तक शुद्धता पाने में असमर्थ रहेंगे[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे सामरिया, तेरे बछड़े ने तुझे ठुकरा दिया है।” इब्रानी वाक्य-विन्यास में ‘बछड़ा’ आरंभिक क्रिया का कर्ता हो सकता है; मुख्य पाठ में परमेश्वर को निहित कर्ता माना गया है।
    reason: alternative_reading
  - marker: b
    text: “शुद्धता” का अनुवाद “निर्दोषता” या “स्वच्छता” भी किया जा सकता है। इब्रानी शब्द में नैतिक और उपासना-संबंधी शुद्धता, दोनों के भाव हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנַח
  choice: ठुकरा दिया है
  rationale: यह क्रिया अस्वीकार करने या तिरस्कारपूर्वक त्याग देने का भाव रखती है। ‘ठुकरा दिया है’ आधुनिक हिन्दी में भविष्यद्वाणी की निंदा का बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֶגְלֵךְ
  choice: तेरे बछड़े को
  rationale: मूल शब्द का सीधा अर्थ ‘तेरा बछड़ा’ है। प्रसंग में यह बछड़े की मूर्ति है, पर मुख्य पाठ में व्याख्यात्मक रूप से ‘मूर्ति’ जोड़ने के बजाय मूल बिंब रखा गया है।
- source_word: שֹׁמְרוֹן
  choice: हे सामरिया
  rationale: सामरिया को सीधे संबोधित किया गया है; ‘हे’ संबोधन को स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: חָרָה אַפִּי
  choice: मेरा क्रोध ... भड़क उठा है
  rationale: इब्रानी मुहावरे में क्रोध के जलने का बिंब है। यह हिन्दी अभिव्यक्ति उस रूपक और उसकी तीव्रता को स्वाभाविक ढंग से बनाए रखती है।
- source_word: בָּם
  choice: उन पर
  rationale: क्रोध वाले मुहावरे के साथ यह पूर्वसर्ग विरोध की दिशा बताता है। बहुवचन संभवतः मूर्तिपूजा से जुड़े लोगों की ओर संकेत करता है।
- source_word: עַד מָתַי
  choice: कब तक
  rationale: यह समय-संबंधी प्रश्न का सहज और मानक हिन्दी रूप है।
- source_word: לֹא יוּכְלוּ
  choice: असमर्थ रहेंगे
  rationale: अपूर्ण क्रिया जारी असमर्थता का भाव दे सकती है; ‘रहेंगे’ इस निरंतरता को स्पष्ट करता है।
- source_word: נִקָּיוֹן
  choice: शुद्ध होने
  rationale: यह संज्ञा निर्दोषता, शुद्धता या स्वच्छता का अर्थ दे सकती है। ‘शुद्ध’ नैतिक और उपासना-संबंधी दोनों संभावित अर्थों को खुला रखता है।
theological_decisions:
- issue: आरंभिक क्रिया זָנַח का कर्ता
  choice: 'परमेश्वर निहित कर्ता है: ‘उसने तेरे बछड़े को ठुकरा दिया है’'
  alternative: 'बछड़ा कर्ता है: ‘हे सामरिया, तेरे बछड़े ने तुझे ठुकरा दिया है’'
  rationale: इब्रानी वाक्य-विन्यास दोनों पाठों की अनुमति देता है। अगले कथन ‘मेरा क्रोध’ में परमेश्वर के बोलने और निकटवर्ती प्रसंग को देखते हुए परमेश्वर को निहित कर्ता मानना अधिक संगत है, फिर भी वैकल्पिक पाठ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: נִקָּיוֹן का नैतिक और उपासना-संबंधी अर्थ
  choice: मुख्य पाठ में ‘शुद्ध’
  alternative: ‘निर्दोष’ या ‘स्वच्छ’
  rationale: यहाँ शब्द दोष से मुक्त होने और अशुद्धता से मुक्त होने—दोनों का संकेत दे सकता है। ‘शुद्ध’ इस अर्थ-विस्तार को किसी एक क्षेत्र तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तेरे’ का प्रयोग सामरिया के लिए मूल के एकवचन स्त्रीलिंग संबोधन के अनुरूप है। आरंभिक वाक्य की वास्तविक वाक्य-विन्यासगत अस्पष्टता और अंतिम शब्द के नैतिक/उपासना-संबंधी अर्थ-विस्तार को पाद-टिप्पणियों में सुरक्षित रखा गया है।
