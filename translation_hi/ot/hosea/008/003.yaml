  text: זָנַ֥ח יִשְׂרָאֵ֖ל ט֑וֹב אוֹיֵ֖ב יִרְדְּֽפ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/003.yaml
  text: Israel has rejected the good[a]; an enemy will pursue him.
translation:
  language: hi
  text: इस्राएल ने भलाई को ठुकरा दिया है[a]; शत्रु उसका पीछा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल ने जो अच्छा है, उसे त्याग दिया है।”
    reason: זָנַח और संज्ञा के रूप में प्रयुक्त טוֹב के अधिक शाब्दिक वैकल्पिक अनुवाद को दिखाने के लिए।
lexical_decisions:
- source_word: זָנַח
  choice: ठुकरा दिया है
  rationale: यह क्रिया जानबूझकर अस्वीकार करने या त्याग देने का भाव रखती है; ‘ठुकरा दिया है’ आधुनिक हिन्दी में इसकी प्रबलता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यह राष्ट्र को एकवचन, मानवीकृत रूप में प्रस्तुत करने वाला व्यक्तिवाचक नाम है; हिन्दी बाइबलीय प्रयोग के अनुरूप ‘इस्राएल’ रखा गया है।
- source_word: טוֹב
  choice: भलाई
  rationale: यहाँ विशेषण संज्ञा के रूप में प्रयुक्त है। ‘भलाई’ नैतिक और धार्मिक अर्थ की व्यापकता बनाए रखता है और किसी एक विशेष अच्छी वस्तु तक अर्थ को सीमित नहीं करता।
- source_word: אוֹיֵב
  choice: शत्रु
  rationale: मूल में संज्ञा अनिश्चित और सामान्य अर्थ में है। हिन्दी में बिना निर्धारक का ‘शत्रु’ स्वाभाविक रूप से ऐसे ही सामान्य, अनिर्दिष्ट विरोधी को दर्शाता है।
- source_word: יִרְדְּפוֹ
  choice: उसका पीछा करेगा
  rationale: अपूर्ण क्रिया-रूप इस भविष्यसूचक संदर्भ में आगामी परिणाम व्यक्त करता है। एकवचन पुल्लिंग प्रत्यय को ‘उसका’ द्वारा सुरक्षित रखा गया है।
theological_decisions:
- issue: יִרְדְּפוֹ में सर्वनामिक प्रत्यय का वचन और संदर्भ
  choice: 'एकवचन: ‘उसका पीछा करेगा,’ जिसमें इस्राएल को मानवीकृत एकवचन राष्ट्र माना गया है।'
  alternative: ‘उनका पीछा करेगा,’ जिसमें सामूहिक अर्थ के अनुसार बहुवचन किया जाए।
  rationale: इब्रानी प्रत्यय तीसरे पुरुष पुल्लिंग एकवचन है। एकवचन अनुवाद मूल व्याकरण और इस्राएल के मानवीकरण को सुरक्षित रखता है।
- issue: טוֹב का संज्ञात्मक अर्थ
  choice: ‘भलाई’
  alternative: ‘जो अच्छा है’ या ‘अच्छाई’
  rationale: मूल पाठ जानबूझकर व्यापक है। ‘भलाई’ नैतिक-धार्मिक अर्थ को बनाए रखता है और अनावश्यक रूप से किसी विशिष्ट वस्तु या सिद्धान्त की पहचान नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘ठुकरा दिया है’ मूल क्रिया की दृढ़ता व्यक्त करता है; ‘भलाई’ सामान्य पाठक के लिए स्वाभाविक है और मूल की व्यापकता भी बनाए रखता है।
