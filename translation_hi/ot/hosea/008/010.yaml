id: HOS.8.10
reference: Hosea 8:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּ֛ם כִּֽי יִתְנ֥וּ בַ/גּוֹיִ֖ם עַתָּ֣ה אֲקַבְּצֵ֑/ם וַ/יָּחֵ֣לּוּ מְּעָ֔ט מִ/מַּשָּׂ֖א מֶ֥לֶךְ שָׂרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/010.yaml
  text: Even though they hire among the nations[a], now I will gather them[c][b]; and they will begin to diminish under the burden of the king of princes.
translation:
  language: hi
  text: यद्यपि वे राष्ट्रों में सहयोगियों को मोल लें[a], अब मैं उन्हें इकट्ठा करूँगा; और वे शासकों के राजा के बोझ के कारण घटने लगेंगे[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यद्यपि वे राष्ट्रों में दें।” इब्रानी क्रिया का सामान्य अर्थ “देना” है; यहाँ प्रसंग सम्भवतः विदेशी सहयोग या गठबंधन पाने के लिए भुगतान करने का है।
    reason: lexical_alternative
  - marker: b
    text: '“वे घटने लगेंगे” वाला इब्रानी पदबंध कठिन है। सम्भव अनुवाद हैं: “वे थोड़ा तड़पेंगे” या “वे बोझ/कर के कारण संख्या में कम हो जाएँगे।”'
    reason: alternative_reading
  - marker: c
    text: “शासकों के राजा का बोझ” सम्भवतः किसी साम्राज्यवादी अधिपति द्वारा लादे गए भारी कर या खिराज की ओर संकेत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: גַּם כִּי יִתְנוּ בַגּוֹיִם
  choice: चाहे वे राष्ट्रों के बीच पैसे देकर सहायता मोल लें
  rationale: נתן का सामान्य अर्थ ‘देना’ है, पर होशे 8:9–10 के राजनीतिक संदर्भ में यह विदेशी सहायता या गठबंधन पाने के लिए भुगतान करने का भाव देता है। ‘सहायता मोल लें’ इस आशय को सहज हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी मूल की शाब्दिक सम्भावना सुरक्षित रखती है।
- source_word: עַתָּה
  choice: अब
  rationale: यह निकट आती हुई ईश्वरीय कार्रवाई को सूचित करने वाला सीधा कालवाचक क्रियाविशेषण है।
- source_word: אֲקַבְּצֵם
  choice: मैं उन्हें इकट्ठा करूँगा
  rationale: קבץ का मूल अर्थ इकट्ठा या एकत्र करना है। प्रसंग न्याय की ओर संकेत करता है, फिर भी अनुवाद में उद्देश्य जोड़कर क्रिया की सम्भावित व्यापकता को सीमित नहीं किया गया।
- source_word: וַיָּחֵלּוּ מְּעָט
  choice: वे ... घटने लगेंगे
  rationale: यह कठिन पदबंध है। ‘घटने लगेंगे’ ויחלו को ‘आरम्भ करना’ और מעט को संख्या या दशा में कमी के रूप में समझता है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: מִמַּשָּׂא
  choice: के बोझ तले
  rationale: מַשָּׂא यहाँ बोझ या लादे गए कर का संकेत दे सकता है। मुख्य पाठ में ‘बोझ’ मूल रूपक को बनाए रखता है और पादटिप्पणी राजनीतिक कर की सम्भावना बताती है।
- source_word: מֶלֶךְ שָׂרִים
  choice: हाकिमों के राजा
  rationale: इब्रानी रचना को सम्बन्धसूचक पदबंध के रूप में रखा गया है। ‘हाकिम’ שרים के शासकीय अधिकारियों या अधीनस्थ शासकों के अर्थ को साधारण आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या אֲקַבְּצֵם उद्धार के लिए फिर से इकट्ठा करने या न्याय के लिए एकत्र करने को दर्शाता है
  choice: मुख्य पाठ में केवल ‘मैं उन्हें इकट्ठा करूँगा’, जबकि प्रसंग न्याय का संकेत देता है
  alternative: इसे पुनर्स्थापना के लिए फिर से एकत्र करने की प्रतिज्ञा मानना
  rationale: होशे 8 में विदेशी गठबंधनों, दण्ड और साम्राज्यवादी दबाव का प्रसंग न्याय की ओर झुकता है। फिर भी क्रिया में स्वयं उद्देश्य स्पष्ट नहीं है, इसलिए मुख्य पाठ में ‘न्याय के लिए’ नहीं जोड़ा गया।
- issue: מֶלֶךְ שָׂרִים की पहचान
  choice: हाकिमों के ऊपर स्थित किसी साम्राज्यवादी राजा की सम्भावना रखते हुए ‘हाकिमों के राजा’
  alternative: ‘राजा और हाकिम’ के रूप में दो समानान्तर कर्ता
  rationale: मसोरेटिक पाठ की संक्षिप्त सम्बन्धसूचक संरचना को बनाए रखना ‘राजा और हाकिम’ की व्याख्यात्मक पुनर्रचना से अधिक स्रोत-संगत है; किसी विशिष्ट ऐतिहासिक राजा का नाम नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मोल लें’, ‘इकट्ठा करूँगा’ और ‘बोझ तले’ सहज हिन्दी हैं; ‘हाकिमों के राजा’ मूल की असामान्य सम्बन्धसूचक रचना और उसकी ऐतिहासिक अस्पष्टता को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
