language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֶל חִכְּ/ךָ֣ שֹׁפָ֔ר כַּ/נֶּ֖שֶׁר עַל בֵּ֣ית יְהוָ֑ה יַ֚עַן עָבְר֣וּ בְרִיתִ֔/י וְ/עַל תּוֹרָתִ֖/י פָּשָֽׁעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/001.yaml
  text: Put the trumpet to your mouth! Like an eagle over the house of Yahweh[c][b][a], because they have transgressed my covenant and rebelled against my law.
translation:
  language: hi
  text: तुरही को अपने होंठों से लगाओ! याहवे के घर पर उकाब[a] की तरह—क्योंकि उन्होंने मेरी वाचा का उल्लंघन किया है[b] और मेरी व्यवस्था[c] के विरुद्ध विद्रोह किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गिद्ध।’ इब्रानी נֶשֶׁר किसी बड़े शिकारी पक्षी के लिए अधिक व्यापक रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘मेरी वाचा को पार किया है’; यहाँ अर्थ है कि उन्होंने वाचा तोड़ी या उसका उल्लंघन किया है।
    reason: lexical_alternative
  - marker: c
    text: या ‘मेरी शिक्षा’ अथवा ‘मेरे निर्देश।’ इब्रानी תּוֹרָה में व्यवस्था, शिक्षा और निर्देश—इन सभी का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל חִכְּךָ שֹׁפָר
  choice: तुरही अपने मुँह से लगा
  rationale: इब्रानी वाक्य क्रियारहित और आकस्मिक है—शाब्दिक रूप से, ‘तेरे तालू/मुँह की ओर तुरही।’ हिन्दी में यह रूप चेतावनी बजाने की तात्कालिक आज्ञा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כַּנֶּשֶׁר
  choice: उकाब की तरह
  rationale: נֶשֶׁר किसी बड़े शिकारी पक्षी को सूचित कर सकता है। ‘उकाब’ धमकी भरे, ऊपर से झपटने वाले बिंब को बनाए रखता है; संभावित ‘गिद्ध’ अर्थ पादटिप्पणी में दिया गया है।
- source_word: עַל בֵּית יְהוָה
  choice: याहवे के घर पर
  rationale: עַל में ‘पर/ऊपर’ और प्रसंगानुसार विरोधी आक्रमण का भाव दोनों संभव हैं। ‘पर’ स्थानिक बिंब और उसके धमकीपूर्ण आशय को खुला रखता है।
- source_word: בֵּית יְהוָה
  choice: याहवे का घर
  rationale: शाब्दिक पद को रखा गया है ताकि इसका संकेत मन्दिर, देश या वाचा-समुदाय में से किसकी ओर है, यह अनावश्यक रूप से निश्चित न किया जाए।
- source_word: עָבְרוּ בְרִיתִי
  choice: मेरी वाचा का उल्लंघन किया है
  rationale: עבר का मूल भाव ‘पार करना’ है, पर वाचा के साथ यह मुहावरेदार रूप से वाचा का अतिक्रमण या उल्लंघन करना बताता है। हिन्दी में ‘वाचा का उल्लंघन’ स्पष्ट, स्वाभाविक और प्रसंगानुकूल है।
- source_word: תּוֹרָתִי
  choice: मेरी व्यवस्था
  rationale: תּוֹרָה का अर्थ व्यवस्था, शिक्षा या निर्देश हो सकता है। वाचा के उल्लंघन और विद्रोह के समानांतर यहाँ ‘व्यवस्था’ उपयुक्त है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: פָּשָׁעוּ
  choice: के विरुद्ध विद्रोह किया है
  rationale: פשע जानबूझकर किए गए अपराध या विद्रोह को व्यक्त करता है। यह चयन साधारण भूल की अपेक्षा वाचागत अवज्ञा की तीव्रता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ‘याहवे के घर’ का अभिप्राय
  choice: शाब्दिक पद को बनाए रखा गया
  alternative: याहवे का मन्दिर; याहवे का घराना/वाचा-समुदाय
  rationale: होशे के न्याय-सन्देश में यह पद पवित्रस्थान के साथ-साथ इस्राएल या उसके देश को भी समेट सकता है। अनुवाद इस सम्भावित बहुअर्थता को संकुचित नहीं करता।
- issue: याहवे के घर पर उकाब का खंडित बिंब
  choice: इब्रानी की आकस्मिक, क्रियारहित संरचना को डैश के साथ बनाए रखा गया
  alternative: ‘शत्रु उकाब की तरह याहवे के घर पर आ रहा है’
  rationale: मूल में न ‘शत्रु’ है, न ‘आ रहा है।’ पूर्ति करने से अर्थ सहज होता, पर भविष्यवाणी की तीखी संक्षिप्तता और वास्तविक व्याकरणिक खुलापन घट जाता।
- issue: ईश्वरीय नाम יְהוָה
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत वाचागत नाम को नाम के रूप में रखा गया है, उपाधि में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और चेतावनीपूर्ण भविष्यद्वाणी-रजिस्टर अपनाया गया है। आरम्भिक आज्ञा और उसके बाद का क्रियारहित बिंब मूल की आकस्मिकता बनाए रखते हैं; कठिन शब्दों के वैध विकल्प पादटिप्पणियों में स्पष्ट किए गए हैं।
