  text: इस्राएल निगल लिया गया है; अब वे राष्ट्रों के बीच एक ऐसे पात्र के समान हो गए हैं, जिसे कोई नहीं चाहता[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसमें किसी की कोई रुचि नहीं है।”
    reason: हिब्रू ‘उसमें कोई रुचि/प्रसन्नता नहीं है’ का अधिक शाब्दिक विकल्प; मुख्य पाठ का ‘जिसे कोई नहीं चाहता’ उसी मुहावरे का स्वाभाविक हिन्दी अर्थ है।
lexical_decisions:
- source_word: נִבְלַע
  choice: निगल लिया गया है
  rationale: निफ़अल रूप का निष्क्रिय अर्थ सुरक्षित रहता है और निगले जाने का ठोस रूपक स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यह उत्तरी राज्य अथवा सामूहिक रूप से उसके लोगों का नाम है; प्रचलित हिन्दी बाइबलीय वर्तनी रखी गई है।
- source_word: עַתָּה
  choice: अब
  rationale: यह न्याय के वर्तमान परिणाम को सूचित करने वाला कालवाचक क्रियाविशेषण है।
- source_word: הָיוּ
  choice: हो गए हैं
  rationale: पूर्ण क्रिया और 'अब' का मेल परिणामी अवस्था दर्शाता है; बहुवचन राष्ट्र के लोगों की ओर संकेत करता है।
- source_word: בַגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: यहाँ גּוֹיִם विदेशी जातियों अथवा राष्ट्रों को दर्शाता है; यह अनुवाद बाद की पारिभाषिक धारणाएँ आरोपित नहीं करता।
- source_word: כִּכְלִי
  choice: ऐसे पात्र के समान
  rationale: כְּלִי का अर्थ पात्र, उपकरण या वस्तु हो सकता है; 'पात्र' मूल उपमा और गरिमापूर्ण शैली बनाए रखता है।
- source_word: אֵין חֵפֶץ בּוֹ
  choice: जिसे कोई नहीं चाहता
  rationale: मुहावरे का आशय ऐसे पात्र से है जिसमें किसी की रुचि या चाह नहीं; यह हिन्दी में स्पष्ट और स्वाभाविक है, जबकि मूल का अवांछित होने का भाव सुरक्षित रहता है।
