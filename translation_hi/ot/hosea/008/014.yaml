  text: וַ/יִּשְׁכַּ֨ח יִשְׂרָאֵ֜ל אֶת עֹשֵׂ֗/הוּ וַ/יִּ֨בֶן֙ הֵֽיכָל֔וֹת וִֽ/יהוּדָ֕ה הִרְבָּ֖ה עָרִ֣ים בְּצֻר֑וֹת וְ/שִׁלַּחְתִּי אֵ֣שׁ בְּ/עָרָ֔י/ו וְ/אָכְלָ֖ה אַרְמְנֹתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/014.yaml
  text: For Israel has forgotten his Maker and built palaces[a], and Judah has multiplied fortified cities; so I will send fire into his cities, and it will consume her citadels.
translation:
  language: hi
  text: इस्राएल अपने बनाने वाले को भूल गया है और उसने महल[a] बनाए हैं; और यहूदा ने किलेबंद नगरों की संख्या बढ़ा ली है। इसलिए मैं उसके नगरों में आग भेजूँगा, और वह उनके दुर्गों को भस्म कर देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मंदिर।” इब्रानी शब्द महलों या मंदिर जैसे भवनों, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׂהוּ
  choice: अपने बनानेवाले
  rationale: यह कृदंत तीसरे पुरुष एकवचन प्रत्यय के साथ उस परमेश्वर को दर्शाता है जिसने इस्राएल को बनाया। ‘अपने बनानेवाले’ सहज हिन्दी है और व्यक्तिगत तथा वाचागत संबंध बनाए रखता है।
- source_word: הֵיכָלוֹת
  choice: महल
  rationale: इस शब्द का अर्थ ‘महल’ या ‘मन्दिर’ हो सकता है। गढ़वाले नगरों और दुर्गों के समानांतर होने के कारण मुख्य पाठ में ‘महल’ चुना गया है; ‘मन्दिर’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: הִרְבָּה
  choice: की संख्या बढ़ा ली है
  rationale: हिफ़ील रूप किसी वस्तु को बहुत करने या उसकी संख्या बढ़ाने का भाव देता है। यह हिन्दी में स्वाभाविक ढंग से यहूदा के जानबूझकर सैन्य सुरक्षा बढ़ाने को व्यक्त करता है।
- source_word: עָרִים בְּצֻרוֹת
  choice: गढ़वाले नगर
  rationale: यह पदबंध किलेबन्द अथवा सुरक्षित नगरों को दर्शाता है। ‘गढ़वाले नगर’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: וְשִׁלַּחְתִּי אֵשׁ
  choice: इसलिए मैं ... आग भेजूँगा
  rationale: संयोजक यहाँ आरोप और उसके फलस्वरूप आनेवाले न्याय को जोड़ता है। ‘इसलिए’ उस संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בְּעָרָיו
  choice: उसके नगरों में
  rationale: पूर्वसर्ग आग के नगरों के भीतर पहुँचने और उन्हें उजाड़ने का भाव देता है। पुल्लिंग एकवचन प्रत्यय का निकटतम स्वाभाविक संदर्भ यहूदा है।
- source_word: אַרְמְנֹתֶיהָ
  choice: उनके दुर्गों
  rationale: אַרְמוֹן महल या सुदृढ़ गढ़ हो सकता है। सैन्य संदर्भ में ‘दुर्ग’ उपयुक्त है। हिन्दी में ‘उनके’ का संदर्भ बहुवचन ‘नगरों’ से है और यह हिब्रू के स्त्रीलिंग प्रत्यय के संदर्भगत बदलाव को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: इस्राएल और यहूदा के बीच सर्वनाम-संदर्भ का बदलाव
  choice: 'न्याय की अंतिम घोषणा यहूदा पर लक्षित है: ‘उसके नगर’ यहूदा के हैं और ‘उनके दुर्ग’ उन नगरों के।'
  alternative: अंतिम वाक्य फिर इस्राएल को संदर्भित करता है, अथवा सभी प्रत्ययों को बिना भेद के एक ही संदर्भ में समझा जाए।
  rationale: आरोप पहले इस्राएल और फिर यहूदा पर आता है। ‘उसके नगरों’ के पुल्लिंग एकवचन प्रत्यय का निकटतम संदर्भ यहूदा है, जबकि अंतिम स्त्रीलिंग प्रत्यय नगरों की ओर संकेत कर सकता है। हिन्दी में इस बदलाव को अनावश्यक रूप से समतल नहीं किया गया।
- issue: הֵיכָלוֹת का अर्थ
  choice: मुख्य पाठ में ‘महल’, पादटिप्पणी में ‘मन्दिर’।
  alternative: मुख्य पाठ में ‘मन्दिर’।
  rationale: शब्द राजकीय या उपासना-संबंधी भवन दोनों को सूचित कर सकता है। राजनीतिक और सैन्य सुरक्षा के प्रसंग में ‘महल’ को प्राथमिकता दी गई है, पर उपासना-संबंधी संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
