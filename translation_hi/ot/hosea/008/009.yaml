id: HOS.8.9
reference: Hosea 8:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי הֵ֨מָּה֙ עָל֣וּ אַשּׁ֔וּר פֶּ֖רֶא בּוֹדֵ֣ד ל֑/וֹ אֶפְרַ֖יִם הִתְנ֥וּ אֲהָבִֽים־
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/009.yaml
  text: For they have gone up to Assyria[a], like a wild donkey wandering alone[b]; Ephraim has hired lovers.
translation:
  language: hi
  text: 'क्योंकि वे अश्शूर चले गए हैं—

    अलग-थलग रहने वाला जंगली गधा[a];

    एप्रैम ने प्रेमियों को भाड़े पर रखा है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में ‘अलग-थलग रहने वाला जंगली गधा’ का पिछले कथन से संबंध स्पष्ट नहीं है। इसका अनुवाद यह भी हो सकता है: ‘अकेले रहने वाले जंगली गधे के समान।’'
    reason: मूल इब्रानी की संक्षिप्त वाक्य-संरचना और उपमा/संबंध की अस्पष्टता को सुरक्षित रखना।
  - marker: b
    text: ‘प्रेमी’ होशे की वाचा-विरोधी बेवफाई की रूपक-भाषा है; यहाँ संकेत विदेशी सहयोगियों की ओर है।
    reason: मूल रूपक को बनाए रखते हुए उसके राजनीतिक संदर्भ को संक्षेप में स्पष्ट करना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הֵמָּה
  choice: वे
  rationale: मूल में सर्वनाम स्पष्ट और कुछ बलयुक्त है। हिन्दी में ‘वे’ रखने से कर्ता प्रत्यक्ष रहता है, बिना अनावश्यक रूप से ‘वे स्वयं’ जोड़ने के।
- source_word: עָלוּ אַשּׁוּר
  choice: अश्शूर चले गए हैं
  rationale: עָלוּ का शाब्दिक अर्थ ‘ऊपर गए’ है, पर यहाँ यात्रा का भाव है। हिन्दी में ‘अश्शूर चढ़ गए’ भ्रामक होता; ‘चले गए हैं’ गंतव्य और क्रिया का स्वाभाविक अर्थ देता है।
- source_word: פֶּרֶא
  choice: जंगली गधा
  rationale: यह स्वच्छंद, अपालतू गधे को दर्शाता है; ‘जंगली गधा’ आधुनिक हिन्दी में स्पष्ट है और पशु-चित्र को सुरक्षित रखता है।
- source_word: בּוֹדֵד לוֹ
  choice: जो अकेला भटकता है
  rationale: पदबंध एकांत या अपने में अलग रहने की दशा व्यक्त करता है। ‘अकेला भटकता है’ प्रसंग के पशु-चित्र को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि केवल ‘अकेला रहता है’ भी संभव है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: गोत्र और उत्तरी राज्य के नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: הִתְנוּ אֲהָבִים
  choice: प्रेमियों को भाड़े पर रखा है
  rationale: क्रिया भुगतान करके किसी को प्राप्त करने या नियुक्त करने का भाव देती है और אֲהָבִים का अर्थ ‘प्रेमी’ है। यह अनुवाद होशे की वैवाहिक/यौन रूपक-भाषा को बनाए रखता है; सीधे ‘सहयोगी’ कहना राजनीतिक आशय को मूल रूपक के स्थान पर रख देता।
theological_decisions:
- issue: विदेशी राजनीतिक संधियों के लिए वैवाहिक/यौन रूपक
  choice: ‘प्रेमियों को भाड़े पर रखा है’ कहकर रूपक को स्पष्ट रूप से बनाए रखा गया है।
  alternative: ‘विदेशी सहयोगियों को धन देकर बुलाया है।’
  rationale: होशे वाचा के प्रति इस्राएल की बेवफाई को बार-बार व्यभिचार और वेश्यावृत्ति की भाषा में चित्रित करता है। ‘प्रेमियों’ को बनाए रखने से वह धर्मवैचारिक तनाव और नबी की तीखी वाणी सुरक्षित रहती है, जबकि पादटिप्पणी राजनीतिक संकेत स्पष्ट करती है।
- issue: जंगली गधे की उपमा का वाक्यगत संबंध
  choice: उपमा को अश्शूर जाने वाले ‘वे’ से जोड़ा गया है।
  alternative: ‘एक जंगली गधा अपने में अकेला रहता है’ को स्वतंत्र, विरोधात्मक कथन की तरह पढ़ना।
  rationale: इब्रानी में तुलना-सूचक शब्द नहीं है और वाक्य-संरचना संक्षिप्त है। मुख्य पाठ में प्रसंगानुकूल उपमा दी गई है, पर पादटिप्पणी मूल की संभावित स्वतंत्र/विरोधात्मक संरचना को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता दिखाने के लिए पंक्ति-विभाजन और अर्धविराम का प्रयोग किया गया है। ‘अश्शूर’, ‘एप्रैम’, ‘जंगली गधा’ और ‘प्रेमी’ जैसे ठोस मूल-बिंब सुरक्षित रखे गए हैं; कठिन इब्रानी वाक्य-संबंध को पादटिप्पणी में खुला रखा गया है।
