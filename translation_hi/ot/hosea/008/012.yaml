  text: Though I wrote for him the many things of my law[a], they were regarded as something foreign.
translation:
  language: hi
  text: मैंने उसके लिए अपनी व्यवस्था की बहुत-सी बातें लिखीं,[a] पर वे परायी समझी गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं उसके लिए अपनी शिक्षा/तोरा की असंख्य बातें लिखूँ/लिखता, तो वे परायी समझी जातीं।” आरम्भिक हिब्रू क्रिया को अपूर्णकालिक अर्थ में भी लिया जा सकता है; “व्यवस्था” का अनुवाद “शिक्षा” या “तोरा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אכתוב
  choice: मैंने ... लिखीं
  rationale: कल अपूर्ण रूप यहाँ बीते हुए दैवी निर्देश का उल्लेख करने वाले प्रसंगगत अपूर्ण के रूप में स्वाभाविक है। भविष्यसूचक या शर्तसूचक अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: लामेद सहित एकवचन पुल्लिंग प्रत्यय हितार्थक भाव व्यक्त कर सकता है। ‘उसके’ से इस्राएल/एप्रैम के सामूहिक एकवचन को स्पष्ट किए बिना सुरक्षित रखा गया है।
- source_word: רבו
  choice: बहुत-सी बातें
  rationale: यह रूप बहुलता या असंख्यता का बोध कराता है। ‘बहुत-सी बातें’ सहज आधुनिक हिन्दी है; ‘असंख्य बातें’ संभावित विकल्प है।
- source_word: תּוֹרָתִי
  choice: अपनी व्यवस्था
  rationale: תורה का मूल अर्थ शिक्षा या निर्देश है, पर वाचा-संबंधी भविष्यवाणी के प्रसंग में ‘व्यवस्था’ परिचित और अर्थपूर्ण है। ‘शिक्षा’ और ‘तोरा’ के विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: כְּמוֹ זָר
  choice: परायी बात
  rationale: उपमा का आशय यह है कि परमेश्वर की व्यवस्था को अपने वाचा-संबंधी निर्देश के बजाय किसी परायी वस्तु की तरह माना गया। हिन्दी में ‘परायी बात’ स्वाभाविक रूप से यही भाव देती है।
- source_word: נֶחְשָׁבוּ
  choice: समझी गईं
  rationale: निफ़अल पूर्ण बहुवचन यहाँ निष्क्रिय मूल्यांकन व्यक्त करता है—उन्हें ऐसा माना या समझा गया।
theological_decisions:
- issue: לוֹ में एकवचन सर्वनाम का संकेत
  choice: ‘उसके लिए’, जो प्रसंग में इस्राएल/एप्रैम को सामूहिक एकवचन मानता है
  alternative: व्यक्तिगत ‘उसके’ को बिना सामूहिक संकेत के समझना
  rationale: होशे में राष्ट्र को प्रायः एकवचन में संबोधित किया जाता है। हिन्दी अनुवाद मूल का एकवचन बनाए रखता है और राष्ट्र का नाम जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- issue: אכתוב का काल/पक्ष
  choice: बीते कार्य के रूप में ‘मैंने ... लिखीं’
  alternative: ‘यदि मैं ... लिखता’ या ‘मैं ... लिखूँ’
  rationale: प्रसंग में यहोवा द्वारा पहले से दी गई शिक्षा और इस्राएल द्वारा उसके तिरस्कार का विरोध स्वाभाविक है, किंतु हिब्रू अपूर्ण रूप की शर्तसूचक/भविष्यपरक संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘व्यवस्था’ बाइबलीय वाचा-संदर्भ को बनाए रखती है, जबकि पादटिप्पणी मूल की कालगत और शब्दार्थगत अस्पष्टता सुरक्षित रखती है।
