source:
  edition: WLC
  text: כִּ֤י מִ/יִּשְׂרָאֵל֙ וְ/ה֔וּא חָרָ֣שׁ עָשָׂ֔/הוּ וְ/לֹ֥א אֱלֹהִ֖ים ה֑וּא כִּֽי שְׁבָבִ֣ים יִֽהְיֶ֔ה עֵ֖גֶל שֹׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/006.yaml
  text: For it is from Israel[a]; a craftsman made it, and it is not God. Indeed[b], the calf of Samaria will become splinters.
translation:
  language: hi
  text: क्योंकि वह इस्राएल से है; एक कारीगर ने उसे बनाया है, और वह परमेश्वर नहीं है। निश्चय ही सामरिया का बछड़ा टुकड़े-टुकड़े हो जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: पद के आरम्भ में यह पिछले कथन का कारण बताता है; इसलिए कारणसूचक अर्थ स्वाभाविक है।
- source_word: מִיִּשְׂרָאֵל
  choice: इस्राएल से ही
  rationale: מִן स्रोत या उत्पत्ति को सूचित करता है; ‘ही’ इस बात पर बल देता है कि मूर्ति इस्राएल की अपनी उपज है।
- source_word: חָרָשׁ עָשָׂהוּ
  choice: एक कारीगर ने उसे बनाया है
  rationale: חָרָשׁ किसी कुशल शिल्पी का व्यापक पद है; धातु-कार्य को अनावश्यक रूप से निश्चित किए बिना मानवीय निर्माण का विरोधाभास बनाए रखता है।
- source_word: וְלֹא אֱלֹהִים הוּא
  choice: और वह परमेश्वर नहीं है
  rationale: इब्रानी की सीधी नकारात्मक अभिव्यक्ति को सुरक्षित रखते हुए बछड़े के सच्चे ईश्वरत्व का निषेध किया गया है।
- source_word: כִּי
  choice: निश्चय ही
  rationale: दूसरा כִּי आगामी विनाश पर बल देता है; यहाँ निश्चयात्मक भाव कारणसूचक पुनरावृत्ति से अधिक स्वाभाविक है।
- source_word: שְׁבָבִים יִהְיֶה
  choice: टुकड़े-टुकड़े हो जाएगा
  rationale: यह छोटे टूटे हुए अंशों में परिणत होने का परिणाम स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֵגֶל שֹׁמְרוֹן
  choice: सामरिया का बछड़ा
  rationale: सम्बन्धवाचक रचना उस बछड़े की पहचान सामरिया से जुड़े आराध्य-विग्रह के रूप में करती है।
theological_decisions:
- issue: ‘वह परमेश्वर नहीं है’ में निषेध का स्वरूप
  choice: कारीगर द्वारा बनाए गए बछड़े के सच्चे ईश्वरत्व का सीधा निषेध
  alternative: ‘वह कोई देवता नहीं है’
  rationale: ‘परमेश्वर नहीं है’ मूल के सीधे कथन और उसके धर्मवैचारिक तनाव को बनाए रखता है, जबकि बाद की दार्शनिक श्रेणियाँ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ में स्वाभाविक। ‘कारीगर’ सामान्य पाठक के लिए स्पष्ट है और ‘टुकड़े-टुकड़े’ שְׁבָבִים के विनाशकारी परिणाम को सहज रूप से व्यक्त करता है।
