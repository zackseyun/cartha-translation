source:
  edition: WLC
  text: לִ֖/י יִזְעָ֑קוּ אֱלֹהַ֥/י יְֽדַעֲנ֖וּ/ךָ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/002.yaml
  text: To me they cry[a], ‘My God[b], we—Israel—know you!’
translation:
  language: hi
  text: वे मुझे पुकारते हैं[a], “मेरे परमेश्वर, हम—इस्राएल—तुझे जानते हैं[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे सहायता के लिए चिल्ला उठते हैं।’ इब्रानी क्रिया संकट में की गई व्याकुल पुकार पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘जानते हैं’ का अर्थ केवल बौद्धिक जानकारी नहीं, बल्कि स्वीकार किए हुए संबंध—विशेषकर वाचा के संबंध—का संकेत भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: मुझे
  rationale: לִי यहाँ पुकार की दिशा बताता है—पुकार परमेश्वर को संबोधित है। ‘मुझे पुकारते हैं’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יִזְעָקוּ
  choice: पुकारते हैं
  rationale: זעק प्रायः संकट में सहायता के लिए ऊँची या व्याकुल पुकार को दर्शाता है। मुख्य पाठ में ‘पुकारते हैं’ सहज है और उसकी तीव्रता पादटिप्पणी में स्पष्ट की गई है।
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित यह पद सीधे संबोधन के रूप में ‘मेरे परमेश्वर’ है। हिन्दी में उद्धरण के भीतर बिना अतिरिक्त ‘हे’ के भी संबोधन स्पष्ट है।
- source_word: יְדַעֲנוּךָ
  choice: तुझे जानते हैं
  rationale: ידע का मूल अर्थ ‘जानना’ है और यहाँ संबंधपरक या वाचागत अर्थछाया हो सकती है। ‘जानते हैं’ उस अर्थछाया को संभव रखते हुए उसकी व्याख्या को मुख्य पाठ में नहीं जोड़ता।
- source_word: יִשְׂרָאֵל
  choice: हम—इस्राएल—
  rationale: ‘इस्राएल’ प्रथम पुरुष बहुवचन क्रिया के बाद वक्ताओं की बलयुक्त आत्म-पहचान है। डैश मूल की आकस्मिक और जोरदार पद-स्थिति को बनाए रखते हैं।
theological_decisions:
- issue: ‘जानना’ का वाचागत और संबंधपरक आशय
  choice: मुख्य पाठ में सीधा दावा ‘तुझे जानते हैं’ रखा गया है।
  alternative: ‘तुझे मानते हैं’ अथवा ‘तेरे साथ वाचा के संबंध में हैं’
  rationale: होशे में ‘जानना’ संबंध, निष्ठा और वाचागत उत्तरदायित्व का संकेत दे सकता है, पर यहाँ उसका विस्तार करना इस्राएल के दावे की व्याख्या पहले ही तय कर देगा। सरल अनुवाद दावे और प्रसंग में उजागर होने वाले उसके खोखलेपन के बीच तनाव बनाए रखता है।
- issue: इस्राएल की वाणी का निरूपण
  choice: इसे परमेश्वर को संबोधित प्रत्यक्ष कथन के रूप में उद्धरण-चिह्नों में रखा गया है और ‘इस्राएल’ को वक्ताओं की आत्म-पहचान माना गया है।
  alternative: ‘इस्राएल’ को अलग संबोधन या अलग वाक्य मानना
  rationale: शब्दक्रम में ‘इस्राएल’ प्रथम पुरुष बहुवचन ‘हम जानते हैं’ के वक्ताओं की पहचान करता है; उसे अलग संबोधित व्यक्ति मानना व्याकरण और प्रसंग की दृष्टि से कम संभावित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सीधा और गरिमापूर्ण वाक्य रखा गया है। ‘तुझे’ एकवचन इब्रानी संबोधन और बाइबलीय प्रार्थना-संबोधन की निकटता को बनाए रखता है; डैश मूल की बलयुक्त आत्म-पहचान को दर्शाते हैं।
