id: HOS.8.13
reference: Hosea 8:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זִבְחֵ֣י הַבְהָבַ֗/י יִזְבְּח֤וּ בָשָׂר֙ וַ/יֹּאכֵ֔לוּ יְהוָ֖ה לֹ֣א רָצָ֑/ם עַתָּ֞ה יִזְכֹּ֤ר עֲוֺנָ/ם֙ וְ/יִפְקֹ֣ד חַטֹּאותָ֔/ם הֵ֖מָּה מִצְרַ֥יִם יָשֽׁוּבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/013.yaml
  text: As for the sacrifices of my offerings[a], they sacrifice flesh and eat it, but Yahweh does not accept them. Now he will remember their iniquity and punish their sins[c][b]; they will return to Egypt.
translation:
  language: hi
  text: जहाँ तक मेरी भेंटों के बलिदानों[a] की बात है, वे मांस चढ़ाते और खाते हैं, पर यहोवा उन्हें स्वीकार नहीं करता। अब वह उनके अधर्म को स्मरण करेगा और उनके पापों का दण्ड देगा; वे मिस्र लौट जाएँगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यह एक असामान्य अभिव्यक्ति है, जिसका शाब्दिक अर्थ लगभग ‘मेरी भेंटों के बलिदान’ है। इसका अर्थ ‘मेरी बलि की भेंटें’ या, कम सम्भावना से, ‘मेरे प्रिय बलिदान’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘मिस्र लौटना’ वास्तविक वापसी को सूचित कर सकता है, या अधिक व्यापक रूप से मिस्र की छवि के द्वारा फिर दासता और निर्वासन में जाने को।
    reason: alternative_reading
lexical_decisions:
- source_word: זִבְחֵי הַבְהָבַי
  choice: मेरी भेंटों के बलिदान
  rationale: इब्रानी पदबंध असामान्य है। זִבְחֵי का अर्थ ‘के बलिदान’ है और कठिन रूप הַבְהָבַי को प्रसंगानुसार परमेश्वर को दी गई भेंटों के रूप में समझा गया है। अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: יִזְבְּחוּ בָשָׂר וַיֹּאכֵלוּ
  choice: वे मांस चढ़ाते और खाते हैं
  rationale: זבח बलि चढ़ाने को और בָשָׂר बलि के मांस को सूचित करता है। हिन्दी में ‘मांस चढ़ाते’ बलिदान का प्रसंग स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिवाचक नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: לֹא רָצָם
  choice: उन्हें स्वीकार नहीं करता
  rationale: बलिदान के प्रसंग में רצה अनुकूल स्वीकृति को सूचित करता है; इसलिए ‘स्वीकार नहीं करता’ सामान्य ‘प्रसन्न नहीं है’ से अधिक सटीक है।
- source_word: יִזְכֹּר עֲוֺנָם
  choice: उनके अधर्म को स्मरण करेगा
  rationale: न्याय के प्रसंग में ‘स्मरण’ का अर्थ लेखा लेने की ओर बढ़ता है, फिर भी स्रोत की वाचा-संबंधी और न्यायिक भाषा को बनाए रखा गया है।
- source_word: וְיִפְקֹד חַטֹּאותָם
  choice: उनके पापों का दण्ड देगा
  rationale: פקד यहाँ दण्डात्मक निरीक्षण अथवा लेखा लेने के अर्थ में है। आधुनिक हिन्दी में यह चयन न्यायिक आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הֵמָּה מִצְרַיִם יָשׁוּבוּ
  choice: वे मिस्र लौट जाएँगे
  rationale: मूल पाठ सीधे मिस्र का नाम लेता है। अनुवाद वास्तविक वापसी और दासता या निर्वासन के रूपक के बीच निर्णय नहीं करता।
theological_decisions:
- issue: ‘मिस्र लौटने’ का आशय
  choice: वे मिस्र लौट जाएँगे
  alternative: वे मिस्र जैसी दासता में फिर चले जाएँगे
  rationale: इब्रानी पाठ भौगोलिक नाम ‘मिस्र’ को स्पष्ट रखता है। यह वास्तविक वापसी, फिर से दासता, निर्वासन, अथवा निर्गमन के उलट जाने की छवि हो सकती है; मुख्य पाठ इस तनाव को अनिर्णीत रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘अधर्म’, ‘पाप’, ‘बलिदान’ और ‘यहोवा’ जैसी बाइबलीय शब्दावली रखी गई है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्वाभाविक बनाया गया है।
