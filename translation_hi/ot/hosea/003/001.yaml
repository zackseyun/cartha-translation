source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ע֚וֹד לֵ֣ךְ אֱֽהַב אִשָּׁ֔ה אֲהֻ֥בַת רֵ֖עַ וּ/מְנָאָ֑פֶת כְּ/אַהֲבַ֤ת יְהוָה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הֵ֗ם פֹּנִים֙ אֶל אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/אֹהֲבֵ֖י אֲשִׁישֵׁ֥י עֲנָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/001.yaml
  text: And Yahweh said to me again[a], “Go, love a woman loved by another and committing adultery, just as Yahweh loves the children of Israel[b], though they turn to other gods and love raisin cakes.”
translation:
  language: hi
  text: फिर यहोवा ने मुझसे कहा, “जा, एक ऐसी स्त्री से प्रेम कर, जिससे कोई दूसरा प्रेम करता है और जो व्यभिचार करती है[a]—ठीक वैसे ही जैसे यहोवा इस्राएलियों से प्रेम करता है, यद्यपि वे दूसरे देवताओं की ओर मुड़ते हैं और किशमिश की टिकियों से प्रेम करते हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्त्री’ का अर्थ ‘पत्नी’ भी हो सकता है; और ‘कोई दूसरा’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘साथी’, ‘संगी’ या इस प्रसंग में संभवतः ‘पति’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ये दबाई हुई किशमिश से बनी टिकियाँ थीं; संभव है कि इनका संबंध उत्सवों या मूर्तिपूजक रीति-रिवाजों से रहा हो।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल की परिचित वाचा-संबंधी नाम-परंपरा का अनुसरण करते हुए मूल के विशिष्ट दिव्य नाम को सामान्य उपाधि ‘प्रभु’ में नहीं बदला गया।
- source_word: עוֹד
  choice: फिर
  rationale: इस कथात्मक प्रसंग में यह नए सिरे से दिए गए वचन अथवा आदेश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֵךְ אֱהַב
  choice: जा, ... प्रेम कर
  rationale: दोनों आज्ञार्थक क्रियाओं को अलग और प्रत्यक्ष रखा गया है तथा אהב की पुनरावृत्ति को आगे यहोवा के प्रेम से जोड़ा गया है।
- source_word: אִשָּׁה
  choice: एक ... स्त्री
  rationale: शब्द ‘स्त्री’ या ‘पत्नी’ दोनों अर्थ दे सकता है; मूल यहाँ उसका नाम या होशे के साथ उसका संबंध स्पष्ट नहीं करता, इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया है।
- source_word: אֲהֻבַת רֵעַ
  choice: जिससे कोई दूसरा प्रेम करता है
  rationale: רֵעַ साथी, संगी या निकट संबंधी व्यक्ति हो सकता है। ‘कोई दूसरा’ उस अस्पष्टता को बनाए रखता है और अनावश्यक रूप से ‘पति’ या ‘प्रेमी’ निश्चित नहीं करता।
- source_word: וּמְנָאָפֶת
  choice: और जो व्यभिचार करती है
  rationale: सक्रिय कृदंत को जारी या चरित्रगत आचरण के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: כְּאַהֲבַת יְהוָה אֶת בְּנֵי יִשְׂרָאֵל
  choice: ठीक वैसे ही जैसे यहोवा इस्राएलियों से प्रेम करता है
  rationale: तुलना को स्पष्ट रखा गया और אהב के समान शब्दगत संबंध को ‘प्रेम’ द्वारा सुरक्षित किया गया। ‘इस्राएली’ आधुनिक हिन्दी में בני ישראל का स्वाभाविक राष्ट्रीय-सामुदायिक रूप है।
- source_word: וְהֵם פֹּנִים אֶל אֱלֹהִים אֲחֵרִים
  choice: यद्यपि वे दूसरे देवताओं की ओर फिरते हैं
  rationale: प्रेम और विश्वासघात के बीच निहित विरोध को ‘यद्यपि’ से व्यक्त किया गया; ‘की ओर फिरते हैं’ मूल क्रिया और निरंतर प्रवृत्ति दोनों को दर्शाता है।
- source_word: וְאֹהֲבֵי אֲשִׁישֵׁי עֲנָבִים
  choice: और किशमिश की टिकियाँ पसंद करते हैं
  rationale: वस्तु को स्पष्ट सांस्कृतिक रूप में रखा गया। यहाँ אהב के लिए ‘पसंद करते हैं’ भोजन-वस्तु के प्रति लगाव का सहज हिन्दी रूप है, जबकि उसी धातु की अर्थगत पुनरावृत्ति बनी रहती है।
theological_decisions:
- issue: होशे के प्रतीकात्मक कार्य में स्त्री की पहचान
  choice: मुख्य पाठ में ‘एक ... स्त्री’ रखा गया है और उसे गोमेर या होशे की पत्नी के रूप में स्पष्टतः नहीं पहचाना गया।
  alternative: ‘अपनी पत्नी’ अथवा गोमेर की ओर वापसी का संकेत देना।
  rationale: इब्रानी पाठ न तो स्त्री का नाम लेता है, न ‘तेरी पत्नी’ कहता है। इसलिए अनुवाद व्याख्यात्मक विवाद का निर्णय नहीं करता।
- issue: אֲהֻבַת רֵעַ में संबंध की प्रकृति
  choice: ‘जिससे कोई दूसरा प्रेम करता है’
  alternative: ‘जिससे उसका पति प्रेम करता है’ या ‘जिसका एक प्रेमी है’।
  rationale: רֵעַ संबंध को अधिक विशिष्ट बनाने के लिए पर्याप्त नहीं है; व्यापक अनुवाद वैवाहिक प्रसंग की संभावना को खुला रखता है।
- issue: यहोवा के प्रेम और इस्राएल के धर्मत्याग के बीच संबंध
  choice: ‘यद्यपि’ द्वारा विरोधात्मक भाव व्यक्त किया गया।
  alternative: सरल संयोजक ‘और’ का प्रयोग।
  rationale: मूल का वाक्य-विन्यास यहोवा के प्रेम के सामने इस्राएल के दूसरे देवताओं की ओर फिरने का तीखा विरोध स्थापित करता है; हिन्दी में ‘यद्यपि’ उस निहित संबंध को स्वाभाविक रूप से स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आज्ञा का सीधापन, ‘प्रेम’ की प्रमुख पुनरावृत्ति और स्त्री की पहचान तथा רֵעַ के संबंध की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
