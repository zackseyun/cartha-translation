base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/005.yaml
  text: Afterward the children of Israel will return and seek Yahweh their God and David their king[c][b][a], and they will come in fear to Yahweh and to his goodness in the latter days.
translation:
  language: hi
  text: इसके बाद इस्राएल के लोग लौटेंगे और यहोवा, अपने परमेश्वर, तथा अपने राजा दाऊद को[a] खोजेंगे। अन्त के दिनों में[b] वे काँपते हुए यहोवा और उसकी भलाई की ओर आएँगे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने राजा दाऊद” से स्वयं दाऊद का प्रतिनिधि राजकीय स्वरूप या दाऊद के वंश का कोई भावी राजा अभिप्रेत हो सकता है; इब्रानी पाठ इसे और स्पष्ट नहीं करता।
    reason: alternative_reading
  - marker: b
    text: या “बाद के दिनों में” अथवा “आने वाले दिनों में।” यह एक भविष्यसूचक अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: c
    text: या “वे यहोवा और उसकी भलाई का भय मानेंगे।” इब्रानी क्रिया का अर्थ “डरना/काँपना” हो सकता है और इस रचना में काँपते हुए उसकी ओर आने का भाव भी हो सकता है।
    reason: lexical_alternative
