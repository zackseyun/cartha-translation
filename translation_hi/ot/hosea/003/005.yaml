- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के लोग
  rationale: आधुनिक हिन्दी में यह जातीय-सामुदायिक पद स्वाभाविक और सर्वसमावेशी है; अत्यधिक शाब्दिक ‘इस्राएल के पुत्र’ से बचता है।
- source_word: וּבִקְשׁוּ
  choice: खोजेंगे
  rationale: यह मन लगाकर खोजने की क्रिया को सीधे व्यक्त करता है और दोनों कर्मों—यहोवा तथा दाऊद—पर लागू होता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: हिन्दी में कर्ता-संबंध स्पष्ट और स्वाभाविक करने के लिए ‘अपने’ प्रयुक्त है; वाचा-संबंध का भाव सुरक्षित रहता है।
- source_word: וְאֵת דָּוִד מַלְכָּם
  choice: तथा अपने राजा दाऊद को
  rationale: हिन्दी की स्वाभाविक पद-रचना अपनाते हुए दाऊद को खोजे जाने वाले दूसरे कर्म के रूप में रखा गया है; उसकी पहचान की व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
- source_word: וּפָחֲדוּ אֶל
