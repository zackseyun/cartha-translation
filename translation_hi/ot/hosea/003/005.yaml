theological_decisions:
- issue: ‘अपने राजा दाऊद’ की पहचान
  choice: मुख्य पाठ में ‘अपने राजा दाऊद’ ज्यों का त्यों रखा गया।
  alternative: ऐतिहासिक दाऊद अथवा भावी दाऊदी/मसीही राजा
  rationale: इब्रानी पाठ सीधे दाऊद का नाम लेता है, पर यह स्पष्ट नहीं करता कि संकेत ऐतिहासिक दाऊद की ओर है या उसके वंश के भावी प्रतिनिधि की ओर; इसलिए तनाव को खुला रखा गया है।
- issue: פחדו אל יהוה ואל טובו का आशय
  choice: यहोवा और उसकी भलाई की ओर काँपते हुए आना
  alternative: यहोवा और उसकी भलाई से डरना / उनके प्रति भय मानना
  rationale: פחד भय या काँपना व्यक्त करता है, जबकि אֶל दिशा/गति का संकेत देता है। चुना हुआ रूप दोनों तत्वों को बनाए रखता है और भलाई को केवल भय की धमकी के रूप में प्रस्तुत नहीं करता।
- issue: בְּאַחֲרִית הַיָּמִים का कालगत दायरा
  choice: आने वाले दिनों में
  alternative: अन्तिम दिनों में / बाद के दिनों में
  rationale: भविष्यसूचक भार सुरक्षित रखते हुए अभिव्यक्ति को किसी विशिष्ट अंत-काल सिद्धांत तक सीमित नहीं किया गया।
