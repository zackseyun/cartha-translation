source:
  edition: WLC
  text: וָ/אֹמַ֣ר אֵלֶ֗י/הָ יָמִ֤ים רַבִּים֙ תֵּ֣שְׁבִי לִ֔/י לֹ֣א תִזְנִ֔י וְ/לֹ֥א תִֽהְיִ֖י לְ/אִ֑ישׁ וְ/גַם אֲנִ֖י אֵלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/003.yaml
  text: And I said to her, “You must remain for me many days; you must not prostitute yourself, and you must not belong to a man; and I also will be toward you.”
translation:
  language: hi
  text: और मैंने उससे कहा, “तुम बहुत दिनों तक मेरे लिए रहना। वेश्यावृत्ति न करना और किसी पुरुष की न होना; और मैं भी तुम्हारे लिए रहूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּשְׁבִי לִי
  choice: मेरे लिए रहना
  rationale: ‘बैठना/रहना’ और संबंधसूचक לִי को निकटता से बनाए रखता है; यहाँ अवधि के साथ ‘रहना’ स्वाभाविक हिन्दी है।
- source_word: לֹא תִזְנִי
  choice: वेश्यागमन न करना
  rationale: क्रिया זנה के यौन-अनैतिकता/वेश्यावृत्ति संबंधी स्पष्ट अर्थ को गंभीर और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: וְלֹא תִהְיִי לְאִישׁ
  choice: किसी पुरुष की न होना
  rationale: शाब्दिक संबंधसूचक अभिव्यक्ति को बनाए रखता है और यह अनिर्णीत छोड़ता है कि आशय विवाह, यौन-संबंध, या किसी पुरुष से संबद्ध होने का है।
- source_word: וְגַם אֲנִי אֵלָיִךְ
  choice: और मैं भी तुम्हारे प्रति वैसा ही रहूँगा
  rationale: खंड में स्पष्ट क्रिया नहीं है। ‘तुम्हारे प्रति’ אֵלָיִךְ की दिशा/संबंधगत अस्पष्टता बचाता है; ‘वैसा ही रहूँगा’ हिन्दी में लुप्त समांतर भाव को स्वाभाविक बनाता है।
theological_decisions:
- issue: अंतिम खंड में निहित प्रतिज्ञा या संयम का स्वरूप
  choice: और मैं भी तुम्हारे प्रति वैसा ही रहूँगा
  alternative: और मैं भी तुम्हारा होकर रहूँगा
  rationale: इब्रानी में अंतिम खंड क्रियारहित और संक्षिप्त है। चुना हुआ पाठ पारस्परिकता बताता है, पर इसे विशेष रूप से वैवाहिक अधिकार, यौन-संयम, या पूर्ण निष्ठा में से किसी एक तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन एक स्त्री से है। भाषा dignified और सीधी रखी गई है। आदेशों को ‘रहना/न करना/न होना’ के रूप में दिया गया है, जो हिन्दी में दृढ़ निर्देश का स्वाभाविक स्वर है।
