id: HOS.3.4
reference: Hosea 3:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י יָמִ֣ים רַבִּ֗ים יֵֽשְׁבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֥ין מֶ֨לֶךְ֙ וְ/אֵ֣ין שָׂ֔ר וְ/אֵ֥ין זֶ֖בַח וְ/אֵ֣ין מַצֵּבָ֑ה וְ/אֵ֥ין אֵפ֖וֹד וּ/תְרָפִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/004.yaml
  text: For many days the sons of Israel will dwell without king or prince[a], without sacrifice or pillar[c][b], and without ephod or household idols.
translation:
  language: hi
  text: क्योंकि इस्राएल के लोग बहुत दिनों तक बिना राजा और बिना शासक के, बिना बलिदान और बिना पूजा-स्तम्भ[a] के, और बिना एपोद[b] और बिना घरेलू देवमूर्तियों[c] के रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खड़ा हुआ पवित्र पत्थर’; इब्रानी शब्द धार्मिक प्रयोजन के लिए खड़े किए गए पत्थर के स्मारक को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘एपोद’ एक इब्रानी धार्मिक शब्द है, जो प्रायः याजकीय वस्त्र या उससे जुड़ी किसी अनुष्ठानिक वस्तु को सूचित करता है।
    reason: cultural_note
  - marker: c
    text: या ‘तराफीम’; अर्थात घर में रखी जाने वाली उपासना-वस्तुएँ या मूर्तियाँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले प्रतीकात्मक कार्य का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָמִים רַבִּים
  choice: बहुत दिनों तक
  rationale: इब्रानी मुहावरे की अनिश्चित किंतु लम्बी अवधि को निकटता से बनाए रखता है; ‘बहुत वर्षों तक’ मूल से अधिक निश्चित होता।
- source_word: יֵשְׁבוּ
  choice: रहेंगे
  rationale: यहाँ क्रिया का अर्थ शाब्दिक रूप से बैठना नहीं, बल्कि एक दशा में बने रहना है; ‘रहेंगे’ सहज और सटीक है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के लोग
  rationale: यह सामूहिक अभिव्यक्ति पूरे इस्राएली समुदाय को सूचित करती है; आधुनिक हिन्दी में यह ‘इस्राएल के पुत्र’ से अधिक स्वाभाविक और अभिप्रेत अर्थ में स्पष्ट है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: राजकीय पद के लिए सीधा और प्रचलित समतुल्य।
- source_word: שָׂר
  choice: शासक
  rationale: शब्द किसी उच्च अधिकारी, प्रधान या अधिपति को सूचित कर सकता है; ‘शासक’ अर्थ-क्षेत्र को अनावश्यक रूप से वंशानुगत ‘राजकुमार’ तक सीमित नहीं करता।
- source_word: זֶבַח
  choice: बलिदान
  rationale: वध करके चढ़ाए जाने वाले धार्मिक अर्पण के लिए मानक और सहज हिन्दी शब्द।
- source_word: מַצֵּבָה
  choice: पूजा-स्तम्भ
  rationale: सिर्फ ‘स्तम्भ’ की अपेक्षा धार्मिक उपयोग वाले खड़े पत्थर का आशय अधिक स्पष्ट करता है, जबकि टिप्पणी अन्य सम्भव अभिव्यक्तियाँ देती है।
- source_word: אֵפוֹד
  choice: एपोद
  rationale: यह एक विशिष्ट इब्रानी धार्मिक शब्द है जिसका हर प्रसंग में एक ही स्पष्ट हिन्दी समतुल्य नहीं है; इसलिए लिप्यन्तरण के साथ टिप्पणी दी गई है।
- source_word: תְרָפִים
  choice: घरेलू देवमूर्तियाँ
  rationale: घरेलू उपासना से जुड़ी मूर्तियों या धार्मिक वस्तुओं का अर्थ सामान्य पाठक तक पहुँचाता है; टिप्पणी मूल पारिभाषिक नाम सुरक्षित रखती है।
theological_decisions:
- issue: क्या सूची वैध और अवैध दोनों प्रकार की धार्मिक संस्थाओं या वस्तुओं को सम्मिलित करती है
  choice: राजनीतिक नेतृत्व और धार्मिक साधनों से वंचित होने की सूची को बिना सामंजस्य बैठाए सीधे प्रस्तुत किया गया है।
  alternative: पूरी धार्मिक सूची को केवल वैध उपासना अथवा केवल निषिद्ध उपासना से सम्बन्धित मानना।
  rationale: बलिदान और एपोद उचित उपासना से जुड़े हो सकते हैं, जबकि पूजा-स्तम्भ और घरेलू देवमूर्तियाँ अन्य प्रसंगों में निन्दित हैं। अनुवाद इस तनाव को हल किए बिना बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। बार-बार आने वाले אֵין को ‘बिना’ की समानान्तर रचना से व्यक्त किया गया है। ‘इस्राएल के लोग’ सामूहिक अर्थ को स्वाभाविक हिन्दी में देता है, और तकनीकी धार्मिक शब्दों के लिए संक्षिप्त टिप्पणियाँ जोड़ी गई हैं।
