  text: שִֽׁחֶתְ/ךָ֥ יִשְׂרָאֵ֖ל כִּֽי בִ֥/י בְ/עֶזְרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/009.yaml
  text: You have destroyed yourself[a], Israel, because your help is in me.
translation:
  language: hi
  text: उसने तुझे नाश कर दिया है[a], हे इस्राएल, क्योंकि तेरी सहायता मुझमें है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ कठिन और अत्यन्त संक्षिप्त है। इसका अनुवाद यह भी हो सकता है: “तूने अपने को नाश कर लिया है, हे इस्राएल, क्योंकि तेरी सहायता मुझमें है,” अथवा अधिक शाब्दिक रूप में, “तेरा विनाश, हे इस्राएल…” कुछ इसे पूरे वाक्य के इस अर्थ में भी समझते हैं: “तेरा विनाश इस कारण है कि तू मेरे, अपने सहायक के, विरुद्ध है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁחֶתְךָ
  choice: उसने तुझे नाश कर दिया है
  rationale: मसोरेटिक स्वरांकन में यह रूप सबसे सहज रूप से पिएल पूर्णकाल के तीसरे पुरुष एकवचन क्रिया और दूसरे पुरुष पुल्लिंग एकवचन कर्म-प्रत्यय के रूप में समझ आता है। कर्ता निहित है, इसलिए हिन्दी में ‘उसने’ रखा गया है; पद की वास्तविक कठिनाई और अन्य प्रमुख समझें पादटिप्पणी में दी गई हैं।
- source_word: יִשְׂרָאֵל
  choice: हे इस्राएल
  rationale: सम्बोधन को स्वाभाविक और गरिमापूर्ण हिन्दी में स्पष्ट किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण अथवा आधार प्रस्तुत करता है।
- source_word: בִי
  choice: मुझमें
  rationale: ב का सामान्य स्थानवाचक/सम्बन्धवाचक अर्थ सुरक्षित रखा गया है; ‘मेरे विरुद्ध’ सम्भव समझ है, पर अगले वाक्यांश के साथ ‘मुझमें’ अधिक सीधा है।
- source_word: בְעֶזְרֶךָ
  choice: तेरी सहायता
  rationale: עֵזֶר के संज्ञात्मक अर्थ ‘सहायता’ को रखा गया है और संक्षिप्त इब्रानी रचना को अनावश्यक रूप से विस्तृत नहीं किया गया।
theological_decisions:
- issue: अत्यन्त कठिन और संक्षिप्त इब्रानी वाक्य की व्याख्या
  choice: 'मुख्य पाठ मसोरेटिक स्वरांकन के सर्वाधिक सीधे क्रियात्मक अर्थ को रखता है: ‘उसने तुझे नाश कर दिया है।’'
  alternative: ‘तूने अपने को नाश कर लिया है’ अथवा ‘तेरा विनाश, हे इस्राएल…’; पूरे वाक्य को ‘तेरा विनाश इस कारण है कि तू मेरे, अपने सहायक के, विरुद्ध है’ भी समझा गया है।
  rationale: मूल रूप में आत्मवाचक कर्म स्पष्ट नहीं है और निहित कर्ता की पहचान भी नहीं बताई गई। इसलिए मुख्य पाठ किसी विशिष्ट कर्ता को नाम नहीं देता, जबकि पादटिप्पणी प्रमुख वैकल्पिक पाठों और धर्मवैचारिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर के एकवचन सम्बोधन के लिए ‘तू/तेरी/तुझे’ का पारम्परिक, निकट और गरिमापूर्ण रूप। मूल की संक्षिप्तता तथा अस्पष्टता को मुख्य पाठ और पादटिप्पणी के संयोजन से सुरक्षित रखा गया है।
