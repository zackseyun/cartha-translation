  text: וְ/עַתָּ֣ה יוֹסִ֣פוּ לַ/חֲטֹ֗א וַ/יַּעְשׂ֣וּ לָ/הֶם֩ מַסֵּכָ֨ה מִ/כַּסְפָּ֤/ם כִּ/תְבוּנָ/ם֙ עֲצַבִּ֔ים מַעֲשֵׂ֥ה חָרָשִׁ֖ים כֻּלֹּ֑/ה לָ/הֶם֙ הֵ֣ם אֹמְרִ֔ים זֹבְחֵ֣י אָדָ֔ם עֲגָלִ֖ים יִשָּׁקֽוּ/ן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/002.yaml
  text: 'And now they keep on sinning: they make cast images for themselves from their silver, idols made according to their own skill—all of it the work of craftsmen. Of them they say[a], “Those who sacrifice human beings kiss calves[b][c].”'
translation:
  language: hi
  text: और अब वे पाप पर पाप करते जा रहे हैं। वे अपनी चाँदी से अपने लिए ढली हुई मूर्तियाँ बनाते हैं—अपनी ही कारीगरी के अनुसार बनाई गई प्रतिमाएँ; वे सब की सब कारीगरों का काम हैं। उनके विषय में वे कहते हैं[a], “मनुष्यों की बलि चढ़ाने वाले बछड़ों को चूमते हैं[b][c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “उनसे वे कहते हैं”; अगले शब्दों से इसका व्याकरणिक संबंध कठिन और अनिश्चित है।
    reason: alternative_reading
  - marker: b
    text: या, “बलि चढ़ाने वाले मनुष्य बछड़ों को चूमें।” इस पाठ में “मनुष्य” को सामान्य कर्ता माना जाता है और अंतिम क्रिया को आज्ञासूचक-जैसा अर्थ दिया जाता है; मसोरेटिक रूप अधिक स्वाभाविक रूप से “चूमते हैं” है।
    reason: alternative_reading
  - marker: c
    text: अर्थात् बछड़ों के आकार की मूर्तियाँ।
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: वाव के संयोजक बल और עתה के वर्तमानकालिक संकेत—दोनों को बनाए रखता है।
- source_word: יוֹסִפוּ לַחֲטֹא
  choice: वे पाप पर पाप करते जा रहे हैं
  rationale: यह रचना निरंतर अथवा बार-बार पाप करने का भाव देती है; चुना हुआ हिंदी मुहावरा इस बढ़ती निरंतरता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיַּעְשׂוּ לָהֶם מַסֵּכָה
  choice: वे अपने लिए ढली हुई मूर्तियाँ बनाते हैं
  rationale: एकवचन מַסֵּכָה को निकटवर्ती बहुवचन प्रतिमाओं के संदर्भ में सामूहिक अर्थ में लिया गया है।
- source_word: מִכַּסְפָּם
  choice: अपनी चाँदी से
  rationale: 'מן वस्तु-सामग्री अथवा स्रोत को दर्शाता है: मूर्तियाँ उन्हीं की चाँदी से बनाई जाती हैं।'
- source_word: כִּתְבוּנָם
  choice: अपनी ही कारीगरी के अनुसार
  rationale: मूर्ति-निर्माण और कारीगरों के काम के तत्काल संदर्भ में תְּבוּנָה यहाँ मानवीय कौशल/कारीगरी का भाव रखता है; “अपनी ही” में निहित व्यंग्य भी बना रहता है।
- source_word: עֲצַבִּים
  choice: प्रतिमाएँ
  rationale: उपासना के लिए मनुष्य द्वारा बनाई गई आकृतियों को स्पष्ट और गरिमापूर्ण आधुनिक हिंदी में व्यक्त करता है।
- source_word: מַעֲשֵׂה חָרָשִׁים כֻּלֹּה
  choice: वे सब-की-सब कारीगरों का काम हैं
  rationale: प्रतिमाओं के पूर्णतः मानवीय निर्माण पर दिए गए जोर और חָרָשִׁים के बहुवचन को सुरक्षित रखता है।
- source_word: לָהֶם הֵם אֹמְרִים
  choice: उनके विषय में वे कहते हैं
  rationale: कठिन शाब्दिक वाक्य-विन्यास “उनसे/उनके लिए वे कहते हैं” को संदर्भानुकूल रूप देता है, जबकि मूल की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: זֹבְחֵי אָדָם
  choice: मनुष्यों की बलि चढ़ानेवाले
  rationale: मसोरेटिक वाक्य-विन्यास में אָדָם को कृदंत का कर्म मानना स्वाभाविक है; सामूहिक संज्ञा को लिंग-विशेष के बिना “मनुष्यों” से व्यक्त किया गया है।
- source_word: עֲגָלִים יִשָּׁקוּן
  choice: बछड़ों को चूमते हैं
  rationale: मसोरेटिक क्रियारूप को स्वाभाविक निर्देशार्थक कथन के रूप में रखा गया है; बछड़ों के मूर्ति-संदर्भ को पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: זֹבְחֵי אָדָם עֲגָלִים יִשָּׁקוּן की संक्षिप्त और विवादित रचना
  choice: “मनुष्यों की बलि चढ़ानेवाले बछड़ों को चूमते हैं।”
  alternative: “बलि चढ़ानेवाले मनुष्य बछड़ों को चूमें।”
  rationale: व्यंजनयुक्त मसोरेटिक पाठ में אָדָם को बलि का कर्म और יִשָּׁקוּן को निर्देशार्थक क्रिया मानना अधिक सीधा है। फिर भी אָדָם को सामान्य कर्ता और क्रिया को आज्ञासूचक-जैसे अर्थ में लेना पुराना तथा संभव पाठ है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: לָהֶם का संबंध
  choice: “उनके विषय में” को प्रतिमाओं से संबंधित माना गया
  alternative: “उनसे/उनके लिए वे कहते हैं”
  rationale: हिब्रू संबंध वाक्य-विन्यास की दृष्टि से कठिन है। मुख्य पाठ पठनीय संदर्भगत अर्थ देता है, पर शाब्दिक अनिश्चितता को पादटिप्पणी में दबाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। “ढली हुई मूर्तियाँ,” “कारीगरी,” और “कारीगरों का काम” निर्माण-संबंधी शब्दावली को सुसंगत रखते हैं। कठिन अंतिम कथन की वास्तविक भाषिक और धर्मवैचारिक अनिश्चितता को मुख्य पाठ में जबरन सुलझाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
