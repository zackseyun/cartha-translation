lexical_decisions:
- source_word: יְדַעְתִּיךָ
  choice: तुम्हें जानता था
  rationale: ידע का मूल अर्थ ‘जानना’ है। यहाँ उसका संबंधपरक या वाचागत आशय हो सकता है, पर मुख्य पाठ में ‘जानता था’ उस अर्थ को आरोपित किए बिना मूल शब्द की व्यापकता बनाए रखता है।
- source_word: בַּמִּדְבָּר
  choice: मरुभूमि में
  rationale: מִדְבָּר निर्जन, शुष्क प्रदेश को दर्शाता है। ‘मरुभूमि’ आधुनिक हिन्दी में स्वाभाविक है और निर्गमन-कालीन पृष्ठभूमि की बाइबिलीय अनुगूँज भी बनाए रखता है।
- source_word: בְּאֶרֶץ
  choice: धरती में
  rationale: यहाँ אֶרֶץ किसी विस्तृत भूभाग को सूचित करता है। ‘धरती’ अगले विशेषण के साथ हिन्दी में सहज रूप से उस परिवेश को व्यक्त करती है।
- source_word: תַּלְאֻבוֹת
  choice: अत्यन्त सूखी
  rationale: यह दुर्लभ बहुवचन संज्ञा तीव्र प्यास, तपन या शुष्कता की दशा बता सकती है। ‘अत्यन्त सूखी’ स्पष्ट और स्वाभाविक है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: אֲנִי
  choice: मैं ही
  rationale: स्वतंत्र सर्वनाम कर्ता पर बल देता है; क्रिया में कर्ता पहले से निहित होने के कारण ‘मैं ही’ इस जोर को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस्राएल के प्रति परमेश्वर के ‘जानने’ का आशय
  choice: मुख्य पाठ में ‘तुम्हें जानता था’, जिससे संबंधपरक या वाचागत अर्थ निहित रह सकता है
  alternative: ‘मैंने तुम्हारी सुधि ली’ या ‘मैंने तुम्हें अपना माना’
  rationale: संदर्भ में यह क्रिया परमेश्वर की देखभाल और वाचा के संबंध की ओर संकेत कर सकती है, पर हिब्रू में स्पष्ट क्रिया ‘जानना’ ही है। इसलिए मुख्य पाठ अस्पष्टता और धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मैं ही’ हिब्रू के स्वतंत्र सर्वनाम का बल व्यक्त करता है। ‘जानता था’ जानबूझकर चुना गया है ताकि संबंधपरक आशय उपस्थित रहे, पर मुख्य पाठ उसे ‘देखभाल’ के अर्थ तक सीमित न कर दे।
