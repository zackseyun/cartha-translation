base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/014.yaml
  text: From the hand of Sheol I will ransom them[a]; from death I will redeem them. O Death, where are your plagues? O Sheol[c][b], where is your destruction? Compassion will be hidden from my eyes.
translation:
  language: hi
  text: अधोलोक के हाथ से मैं उन्हें मोल देकर छुड़ाऊँगा[a]; मृत्यु से मैं उन्हें छुड़ाऊँगा। हे मृत्यु, तेरी महामारियाँ कहाँ हैं? हे अधोलोक, तेरा विनाश कहाँ है?[b][c] करुणा मेरी आँखों से छिपी रहेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, इन आरम्भिक पंक्तियों को न्याय के आलंकारिक प्रश्नों के रूप में पढ़ा जा सकता है: “क्या मैं उन्हें अधोलोक के हाथ से मोल देकर छुड़ाऊँ? क्या मैं उन्हें मृत्यु से छुड़ाऊँ?”'
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी אֱהִי का अर्थ “मैं होऊँगा” या “मुझे होने दे” भी हो सकता है: “हे मृत्यु, मैं तेरी महामारियाँ होऊँगा; हे अधोलोक, मैं तेरा विनाश होऊँगा।”'
    reason: alternative_reading
  - marker: c
    text: 'यूनानी परम्परा से प्रभावित पारम्परिक अनुवाद: “हे मृत्यु, तेरा डंक कहाँ है? हे अधोलोक, तेरी विजय/तेरा डंक कहाँ है?” तुलना करें: 1 कुरिन्थियों 15:55।'
    reason: cross_reference
lexical_decisions:
- source_word: מִיַּד
  choice: के हाथ से
  rationale: शाब्दिक रूपक को सुरक्षित रखता है; इब्रानी में ‘हाथ’ अधिकार या पकड़ का भी बोध कराता है।
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: यह केवल कब्र नहीं, मृतकों के लोक को दर्शाता है; ‘अधोलोक’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: אֶפְדֵּם
  choice: मैं उन्हें छुड़ौती देकर छुड़ाऊँगा
  rationale: פדה में मूल्य देकर संकट या बंधन से छुड़ाने का भाव है; इससे अगले גאל से भेद बना रहता है।
- source_word: אֶגְאָלֵם
  choice: मैं उन्हें छुड़ा लूँगा
  rationale: גאל के उद्धार और अपने अधिकार में पुनः लेने के व्यापक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱהִי
  choice: कहाँ हैं / कहाँ है
  rationale: काव्यात्मक संबोधन में प्रश्नवाचक अर्थ मृत्यु और अधोलोक पर विजय की ललकार बनाता है; ‘मैं होऊँगा’ वाला सम्भव अर्थ पादटिप्पणी में रखा गया है।
- source_word: דְבָרֶיךָ
  choice: तेरी महामारियाँ
  rationale: यहाँ शब्द का अर्थ घातक रोग या विपत्तियाँ है; ‘महामारियाँ’ मृत्यु के साथ समानांतरता को स्पष्ट रखता है।
- source_word: קָטָבְךָ
  choice: तेरा विनाश
  rationale: קטב घातक विनाश या नाश करने वाली शक्ति को दर्शाता है; यह मूल इब्रानी के निकट है।
- source_word: נֹחַם
  choice: करुणा
  rationale: नֹחַם दया, पछतावे या निर्णय से फिरने का संकेत दे सकता है; प्रसंग में ऐसी करुणा के हस्तक्षेप न करने का भाव है।
- source_word: יִסָּתֵר מֵעֵינָי
  choice: मेरी आँखों से छिपी रहेगी
  rationale: निफ़अल अपूर्ण क्रिया के भाव को भविष्यपरक घोषणा के रूप में और मूल दृष्टि-रूपक सहित रखता है।
theological_decisions:
- issue: आरम्भिक पंक्तियाँ उद्धार की प्रतिज्ञाएँ हैं या न्यायसूचक आलंकारिक प्रश्न
  choice: उद्धार की घोषणाएँ, जिनके बाद मृत्यु और अधोलोक को ललकारा गया है
  alternative: ‘क्या मैं उन्हें अधोलोक के हाथ से छुड़ौती देकर छुड़ाऊँ? क्या मैं उन्हें मृत्यु से छुड़ाऊँ?’—ऐसे प्रश्न जिनका आशय उद्धार से इनकार हो सकता है।
  rationale: इब्रानी क्रियारूप सीधे प्रथम-पुरुष घोषणाओं के रूप में स्वाभाविक हैं, पर प्रश्नसूचक पठन भी व्याकरण और व्यापक न्याय-प्रसंग के कारण वास्तविक सम्भावना है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: אֱהִי को प्रश्नवाचक माना जाए या ‘मैं होऊँगा/मुझे होने दे’
  choice: 'प्रश्नवाचक: ‘कहाँ हैं/कहाँ है?’'
  alternative: ‘हे मृत्यु, मैं तेरी महामारियाँ होऊँगा; हे अधोलोक, मैं तेरा विनाश होऊँगा।’
  rationale: समानांतर काव्य और प्राचीन ग्रहण-परम्परा प्रश्नवाचक ललकार का समर्थन करते हैं, किंतु इब्रानी रूप दूसरे अर्थ की भी अनुमति देता है; अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘अधोलोक’ शिओल की संकल्पना को ‘कब्र’ तक सीमित नहीं करता। ‘छुड़ौती देकर छुड़ाऊँगा’ और ‘छुड़ा लूँगा’ से פדה तथा גאל का शब्दगत अंतर यथासम्भव सुरक्षित है।
