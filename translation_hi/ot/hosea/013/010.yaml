base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/010.yaml
  text: Where now is your king[a], that he may save you in all your cities, and your judges, of whom you said[b], “Give me a king and princes”?
translation:
  language: hi
  text: अब तुम्हारा राजा कहाँ है[a], जो तुम्हारे सब नगरों में तुम्हें बचाए? और तुम्हारे शासक कहाँ हैं, जिनके विषय में तुमने कहा था, “मुझे एक राजा और अधिकारी दो”[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, कम सम्भावित रूप में: “मैं तुम्हारा राजा होता; फिर कहाँ है कोई जो तुम्हें बचाए...?” इब्रानी का आरम्भ कठिन है।'
    reason: alternative_reading
  - marker: b
    text: “अधिकारी” का अनुवाद “राजकुमार” या “शासक” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱהִי ... אֵפוֹא
  choice: अब ... कहाँ है
  rationale: आरम्भिक इब्रानी रूप कठिन है। प्रसंग और प्राचीन अनुवाद-परंपरा के समर्थन से इसे राजतंत्र पर व्यंग्यपूर्ण प्रश्न के रूप में प्रस्तुत किया गया है; אֵפוֹא का बल ‘अब’ से व्यक्त होता है।
- source_word: מַלְכְּךָ
  choice: तुम्हारा राजा
  rationale: एकवचन अधिकारसूचक संज्ञा को सीधे रखा गया है और यह इस्राएल द्वारा माँगे गए राजतंत्र की ओर संकेत करती है।
- source_word: וְיוֹשִׁיעֲךָ
  choice: कि वह ... तुम्हें बचाए
  rationale: हिफ़ील रूप का अर्थ ‘बचाना/छुड़ाना’ है। प्रश्न के बाद यह रचना व्यंग्यपूर्ण चुनौती को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: בְּכָל עָרֶיךָ
  choice: तुम्हारे सब नगरों में
  rationale: स्थानवाचक अर्थ को निकट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְשֹׁפְטֶיךָ
  choice: तुम्हारे न्यायी
  rationale: שׁפט का मूल अर्थ ‘न्यायी’ है, यद्यपि यहाँ शासन करने वाले अगुओं का व्यापक भाव भी संभव है।
- source_word: אֲשֶׁר אָמַרְתָּ
  choice: जिनके विषय में तुमने कहा था
  rationale: सम्बन्धवाचक उपवाक्य को पहले उल्लिखित राजकीय नेतृत्व से जोड़ा गया है; भूतकालीन प्रसंग के लिए ‘कहा था’ स्वाभाविक है।
- source_word: תְּנָה לִּי
  choice: मुझे ... दो
  rationale: आज्ञार्थक נתן और לִי का सीधा एवं मुहावरेदार अनुवाद है।
- source_word: מֶלֶךְ וְשָׂרִים
  choice: एक राजा और हाकिम
  rationale: מֶלֶךְ को ‘राजा’ और שָׂרִים को व्यापक शासकीय अर्थ वाले ‘हाकिम’ से व्यक्त किया गया है; इससे आधुनिक पाठक के लिए अर्थ स्पष्ट रहता है और शब्द को केवल राजकुमारों तक सीमित नहीं किया जाता।
theological_decisions:
- issue: कठिन आरम्भ אֱהִי की व्याख्या
  choice: 'व्यंग्यपूर्ण प्रश्न: “अब तुम्हारा राजा कहाँ है...?”'
  alternative: “मैं तुम्हारा राजा होता; फिर कहाँ है कोई जो तुम्हें बचाए...?” अथवा “मैं तुम्हारा राजा होऊँगा...”
  rationale: आस-पास का प्रसंग मनुष्य के राजतंत्र पर इस्राएल के भरोसे को चुनौती देता है और राजा दिए तथा हटा लिए जाने की बात करता है। इसलिए प्रश्नवाचक पाठ प्रवाह के अनुकूल है; वैकल्पिक प्रथम-पुरुष पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली रखी गई है। दो लगातार प्रश्नों से मूल की व्यंग्यपूर्ण चुनौती स्पष्ट होती है। ‘न्यायी’ मूल शब्द के निकट है, जबकि ‘हाकिम’ שָׂרִים के व्यापक राजकीय अर्थ को सामान्य पाठक के लिए व्यक्त करता है।
