base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/011.yaml
  text: I gave you a king in my anger[b][a], and I took him away in my wrath.
translation:
  language: hi
  text: मैंने अपने क्रोध में तुम्हें एक राजा दिया[a], और अपने प्रकोप में उसे हटा दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक औपचारिक रूप से: “मैं अपने क्रोध में तुम्हें एक राजा देता हूँ, और अपने प्रकोप में उसे हटा देता हूँ।” इब्रानी क्रियारूप वर्तमान या भविष्य में भी अनूदित किए जा सकते हैं, पर संदर्भ बीते कार्य की ओर संकेत का समर्थन करता है।'
    reason: alternative_reading
  - marker: b
    text: इब्रानी में केवल “और मैंने लिया” है; “उसे” का संकेत “एक राजा” से समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתֶּן
  choice: मैंने ... दिया
  rationale: रूप क़ाल अपूर्ण, प्रथम पुरुष एकवचन है और शाब्दिक रूप से वर्तमान या भविष्य का भाव दे सकता है; पर निकटवर्ती संदर्भ में यह इस्राएल को राजा देने के बीते कार्य की ओर मुड़कर देखता जान पड़ता है।
- source_word: לְךָ
  choice: तुम्हें
  rationale: द्वितीय पुरुष एकवचन इस्राएल को सामूहिक रूप से संबोधित करता है; हिन्दी में ‘तुम्हें ... दिया’ स्वाभाविक अप्रत्यक्ष कर्म है।
- source_word: מֶלֶךְ
  choice: एक राजा
  rationale: अनिश्चित, बिना उपपद की संज्ञा यहाँ किसी नामित राजा की अपेक्षा राजत्व प्रदान किए जाने का संकेत देती है।
- source_word: בְּאַפִּי
  choice: अपने क्रोध में
  rationale: אַף इस मुहावरे में क्रोध को व्यक्त करता है; यह चयन परिस्थिति और कारण, दोनों की छाया बनाए रखता है।
- source_word: וְאֶקַּח
  choice: और ... उसे हटा दिया
  rationale: לקח का मूल अर्थ ‘लेना’ है, किंतु राजा के संदर्भ में ‘हटा देना’ आशय को स्वाभाविक हिन्दी में व्यक्त करता है। ‘उसे’ का संदर्भ पिछले पदबंध ‘एक राजा’ से स्पष्ट है, यद्यपि इब्रानी में कर्म व्यक्त नहीं है।
- source_word: בְּעֶבְרָתִי
  choice: अपने प्रकोप में
  rationale: עֶבְרָה तीव्र, उमड़ते हुए रोष को सूचित करता है। ‘प्रकोप’ पहले खंड के ‘क्रोध’ से अर्थगत तीव्रता का भेद रखते हुए भविष्यद्वक्ताई गरिमा बनाए रखता है।
theological_decisions:
- issue: दोनों प्रथम-पुरुष अपूर्ण क्रियाओं का काल और पक्ष
  choice: 'बीते कार्य की ओर संकेत: ‘मैंने ... दिया ... हटा दिया’'
  alternative: 'वर्तमान/भविष्य: ‘मैं ... देता हूँ ... हटा लेता हूँ’ अथवा ‘मैं ... दूँगा ... हटा लूँगा’'
  rationale: रूपगत अस्पष्टता वास्तविक है, पर अध्याय का प्रसंग इस्राएल के राजाओं के इतिहास पर पीछे मुड़कर विचार करता है। मुख्य पाठ में भूतकाल स्वाभाविक है और वैकल्पिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: וְאֶקַּח का अप्रकट कर्म
  choice: राजा को संदर्भित करने वाला ‘उसे’ स्पष्ट किया गया
  alternative: कर्म को अप्रकट रखते हुए ‘और मैंने ले लिया’
  rationale: इब्रानी में कर्म नहीं लिखा गया, किंतु पूर्ववर्ती ‘राजा’ उसका स्वाभाविक संदर्भ है। हिन्दी में ‘उसे’ स्पष्टता देता है; इसका उल्लेख पादटिप्पणी में किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भविष्यद्वक्ताई लहजा रखा गया है। ‘क्रोध’ और ‘प्रकोप’ द्वारा दो इब्रानी रोष-सूचक शब्दों का अंतर बनाए रखा गया है। मुख्य पाठ में अर्थ-स्पष्टता हेतु ‘हटा दिया’ और अप्रकट कर्म ‘उसे’ रखा गया है; रूपगत तथा वाक्यगत अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
