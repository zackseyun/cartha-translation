  yaml_path: translation/ot/hosea/013/006.yaml
  text: As their pasture[a], they were satisfied; they were satisfied, and their heart was lifted up[b]; therefore they forgot me.
translation:
  language: hi
  text: जब उन्हें चरागाह मिला[a], वे तृप्त हुए; तृप्त हो जाने पर उनका हृदय ऊँचा हो गया[b]; इसलिए वे मुझे भूल गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी चराई के अनुसार,” “उनके चरागाह में,” अथवा “जब वे चराए गए।” इब्रानी पदबंध संक्षिप्त है और संभवतः उनकी भरपूरी की परिस्थिति बताता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनका हृदय ऊँचा हो गया”—अर्थात वे अभिमानी हो गए।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַרְעִיתָם
  choice: जब वे चरते थे
  rationale: כְּ का यहाँ कालगत या परिस्थितिसूचक अर्थ संदर्भ में स्वाभाविक है। מַרְעִית चराई, चरने की दशा या चरागाह का बोध करा सकता है। यह अनुवाद समृद्ध चराई की परिस्थिति बताता है, जबकि संक्षिप्त इब्रानी की अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: וַיִּשְׂבָּעוּ ... שָׂבְעוּ
  choice: वे तृप्त हो गए; वे तृप्त हुए
  rationale: שׂבע की पुनरावृत्ति पद की वाक्पटुता और कारण-क्रम के लिए महत्त्वपूर्ण है। ‘तृप्त’ भोजन से आगे संतोष और भरपूरी, दोनों का भाव दे सकता है।
- source_word: וַיָּרָם לִבָּם
  choice: उनका हृदय ऊँचा हो गया
  rationale: शाब्दिक रूपक को सुरक्षित रखा गया है; संदर्भ में यह अभिमान और आत्म-उत्थान का बोध कराता है, पर अनुवाद उसे सीधे व्याख्यात्मक शब्द से नहीं बदलता।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह कारण से परिणाम की ओर जाने वाला निष्कर्षसूचक पदबंध है।
- source_word: שְׁכֵחוּנִי
  choice: वे मुझे भूल गए
  rationale: שׁכח का सीधा और वाचा-संबंधी बल सुरक्षित रहता है; ‘उपेक्षा की’ जैसे विकल्प अपेक्षाकृत अधिक व्याख्यात्मक हैं।
theological_decisions:
- issue: ‘उनका हृदय ऊँचा हो गया’ में अभिमान का मुहावरा
  choice: इब्रानी रूपक को मुख्य पाठ में सुरक्षित रखा गया।
  alternative: वे घमंडी हो गए
  rationale: समृद्धि से आत्म-उत्थान और फिर परमेश्वर-विस्मरण की धार्मिक-नैतिक गति स्पष्ट रहती है, पर रूपक को किसी एक व्याख्यात्मक अभिव्यक्ति में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। ‘तृप्त’ और ‘हृदय’ बाइबलीय भाव को बनाए रखते हुए सामान्य पाठकों के लिए बोधगम्य हैं। इब्रानी की पुनरावृत्ति और हृदय के ऊँचा होने का रूपक जानबूझकर सुरक्षित रखा गया है।
