id: HOS.13.15
reference: Hosea 13:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י ה֔וּא בֵּ֥ן אַחִ֖ים יַפְרִ֑יא יָב֣וֹא קָדִים֩ ר֨וּחַ יְהוָ֜ה מִ/מִּדְבָּ֣ר עֹלֶ֗ה וְ/יֵב֤וֹשׁ מְקוֹר/וֹ֙ וְ/יֶחֱרַ֣ב מַעְיָנ֔/וֹ ה֣וּא יִשְׁסֶ֔ה אוֹצַ֖ר כָּל כְּלִ֥י חֶמְדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/015.yaml
  text: Though he may flourish among his brothers[a], an east wind will come—the wind of Yahweh, rising from the wilderness—and his spring will dry up, and his fountain will be dried out[c][b]; it will plunder the storehouse of every precious vessel.
translation:
  language: hi
  text: चाहे वह अपने भाइयों के बीच फले-फूले,[a] फिर भी पुरवाई आएगी—याहवे की हवा,[b] जो मरुभूमि से उठेगी। उसका सोता सूख जाएगा और उसका झरना सूख जाएगा; वह हर बहुमूल्य वस्तु का भंडार लूट लेगी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद संभव है: “क्योंकि वह भाइयों के बीच फलवंत है।” इब्रानी वाक्यांश का संबंध एप्रैम के नाम में निहित ‘फलवंतता’ के भाव से भी हो सकता है; संदर्भ यहाँ रियायती अर्थ, अर्थात समृद्धि के बावजूद आने वाले न्याय, का समर्थन करता है।'
    reason: lexical_alternative
  - marker: b
    text: “याहवे की हवा” का अनुवाद “याहवे की श्वास” भी हो सकता है; पर “पुरवाई” और “मरुभूमि से उठेगी” के समानांतर यहाँ “हवा” अधिक उपयुक्त है।
    reason: alternative_reading
  - marker: c
    text: 'इब्रानी क्रिया पुल्लिंग है और उसका सबसे निकट संबंध “पूर्वी पवन” से है; फिर भी कर्ता को आक्रमणकारी या व्यक्तिरूप एप्रैम के रूप में समझने की संभावना भी बताई गई है। हिन्दी में “पुरवाई” स्त्रीलिंग है, इसलिए मुख्य पाठ में स्त्रीलिंग क्रिया आई है। अंतिम पद का अधिक शाब्दिक रूप है: “वह हर बहुमूल्य वस्तु का भंडार लूट लेगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: चाहे … फिर भी
  rationale: 'כִּי का सामान्य अर्थ ‘क्योंकि’ है, पर यहाँ अगले न्याय-वचन के संदर्भ में रियायती अर्थ स्वाभाविक है: एप्रैम की फलवन्तता के बावजूद विनाश आएगा। वैकल्पिक औपचारिक अर्थ पादटिप्पणी में रखा गया है।'
- source_word: בֵּן אַחִים
  choice: अपने भाइयों के बीच
  rationale: शाब्दिक रूप ‘भाइयों का पुत्र’ है। यहाँ कुल/भाईचारे के भीतर एप्रैम की स्थिति का मुहावरेदार संकेत है; हिन्दी में ‘अपने भाइयों के बीच’ पारिवारिक बिंब को स्वाभाविक ढंग से बनाए रखता है।
- source_word: יַפְרִיא
  choice: फले-फूले
  rationale: פרה का हिफ़ील रूप फलवन्त होने या समृद्ध होने का भाव देता है। ‘फले-फूले’ वनस्पति-बिंब और समृद्धि, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: קָדִים
  choice: पुरवाई
  rationale: यह पूर्व से आने वाली गर्म और विनाशकारी हवा है। ‘पुरवाई’ हिन्दी में पूर्वी हवा के लिए संक्षिप्त और परिचित शब्द है; उसके विनाशकारी प्रभाव को आगे की पंक्तियाँ स्पष्ट करती हैं।
- source_word: רוּחַ יְהוָה
  choice: याहवे की हवा
  rationale: רוּחַ के अर्थ हवा, श्वास और आत्मा हो सकते हैं। यहाँ ‘पुरवाई’ और ‘मरुभूमि से उठेगी’ के कारण मौसम-संबंधी अर्थ ‘हवा’ प्रमुख है, जबकि ‘याहवे की’ न्याय में परमेश्वर की सक्रियता बनाए रखता है।
- source_word: מִמִּדְבָּר עֹלֶה
  choice: जो मरुभूमि से उठेगी
  rationale: यह कृदन्त की सजीव गति और उस रेगिस्तानी क्षेत्र, दोनों को व्यक्त करता है जहाँ से विनाशकारी पूर्वी हवा आती है।
- source_word: מְקוֹרוֹ … מַעְיָנוֹ
  choice: उसका सोता … उसका झरना
  rationale: दोनों शब्द जल के स्रोत बताते हैं। ‘सोता’ और ‘झरना’ समानांतर जल-बिंब को बनाए रखते हुए हिन्दी में अनावश्यक यांत्रिक पुनरावृत्ति से बचाते हैं।
- source_word: יִשְׁסֶה
  choice: वह … लूट लेगी
  rationale: क्रिया का अर्थ लूटना या उजाड़कर छीन लेना है। निकटतम कर्ता विनाशकारी हवा है, इसलिए हिन्दी में स्त्रीलिंग ‘वह … लेगी’ रखा गया है; कर्ता की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: אוֹצַר כָּל כְּלִי חֶמְדָּה
  choice: बहुमूल्य वस्तुओं के पूरे भंडार
  rationale: אוֹצַר भंडार/कोष और כְּלִי חֶמְדָּה वांछनीय या बहुमूल्य वस्तुओं को दर्शाता है। यह रूप हिन्दी में स्वाभाविक रहते हुए संपूर्ण लूट का भाव व्यक्त करता है।
theological_decisions:
- issue: विनाशकारी רוּחַ की पहचान और दैवी अभिकरण
  choice: ‘याहवे की हवा’—याहवे के न्याय को कार्यान्वित करने वाली मरुभूमि की पुरवाई
  alternative: ‘याहवे की श्वास’ या ‘याहवे का आत्मा’
  rationale: ठोस समानांतर ‘पुरवाई’ और ‘मरुभूमि से उठेगी’ मौसम-संबंधी अर्थ को प्रमुख बनाते हैं। इससे दैवी न्याय स्पष्ट रहता है, पर पाठ पर अनावश्यक रूप से पवित्र आत्मा संबंधी विशिष्ट अर्थ आरोपित नहीं होता।
- issue: समृद्धि और न्याय के बीच संबंध
  choice: 'आरंभ को रियायती रूप में प्रस्तुत किया गया है: ‘चाहे … फिर भी’'
  alternative: 'कारणवाचक रूप: ‘क्योंकि वह भाइयों के बीच फलवन्त है’'
  rationale: व्यापक संदर्भ में एप्रैम की फलवन्तता आने वाले न्याय को रोक नहीं सकती। फिर भी כִּי की व्याकरणिक बहुअर्थकता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुरवाई’, ‘मरुभूमि’, ‘सोता’ और ‘झरना’ काव्यात्मक भविष्यद्वाणी के स्वर को बनाए रखते हैं, पर अत्यधिक संस्कृतनिष्ठ नहीं हैं। याहवे नाम का लिप्यंतरण मूल इब्रानी व्यक्तिनाम को स्पष्ट रखता है।
