source:
  edition: WLC
  text: וְ/אָנֹכִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם וֵ/אלֹהִ֤ים זֽוּלָתִ/י֙ לֹ֣א תֵדָ֔ע וּ/מוֹשִׁ֥יעַ אַ֖יִן בִּלְתִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/004.yaml
  text: But I am Yahweh your God from the land of Egypt[a]; you know no God besides me[b], and there is no savior except me.
translation:
  language: hi
  text: परन्तु मिस्र देश के समय से मैं याहवे, तुम्हारा परमेश्वर हूँ।[a] मेरे सिवा तुम किसी परमेश्वर को नहीं जानते,[b] और मेरे सिवा कोई उद्धारकर्ता नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मिस्र देश से’ अथवा ‘मिस्र देश से निकालकर।’ इब्रानी वाक्यांश निर्गमन के समय से इस्राएल के साथ याहवे के सम्बन्ध पर या उन्हें वहाँ से निकालने के उनके उद्धार-कार्य पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे सिवा किसी परमेश्वर को मत जानो।’ इब्रानी क्रिया को वाचा से जुड़ा कथन या निषेधात्मक आदेश—दोनों समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: परन्तु ... मैं
  rationale: संदर्भ में संयोजक और बलसूचक प्रथम पुरुष सर्वनाम विरोध और आत्म-बल दोनों व्यक्त करते हैं; आधुनिक हिन्दी में ‘परन्तु ... मैं’ इसे स्वाभाविक रूप से प्रकट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय और याहवे के साथ प्रयोग के कारण अर्थ एकवचन तथा वाचागत है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से ही
  rationale: מִן के मूल ‘से’ अर्थ को बनाए रखते हुए यह वाक्यांश निर्गमन के समय से चले आ रहे सम्बन्ध और मिस्र से छुड़ाने के कार्य—दोनों की ओर संकेत कर सकता है; ‘ही’ इस आरम्भ-बिन्दु पर बल देता है, पर अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וֵאלֹהִים זוּלָתִי
  choice: मेरे सिवा ... किसी परमेश्वर को
  rationale: अस्वीकृत विशिष्टता-वाक्य में אֱלֹהִים अर्थतः एकवचन है और זוּלָתִי पूर्ण अपवर्जन व्यक्त करता है।
- source_word: לֹא תֵדָע
  choice: न जानोगे
  rationale: इब्रानी अपूर्ण क्रिया को हिन्दी भविष्यत् रूप में रखा गया है, जो सन्दर्भ में कथन और वाचागत निषेध दोनों रूपों में सुना जा सकता है।
- source_word: וּמוֹשִׁיעַ אַיִן בִּלְתִּי
  choice: और मेरे अलावा कोई उद्धारकर्ता नहीं है
  rationale: कृदन्त מוֹשִׁיעַ को कर्ता-संज्ञा ‘उद्धारकर्ता’ और אַיִן ... בִּלְתִּי को स्पष्ट अस्तित्वगत निषेध तथा अपवाद के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वर की अनन्य पहचान और उद्धार
  choice: याहवे इस्राएल के एकमात्र परमेश्वर और उद्धारकर्ता होने का दावा करते हैं।
  alternative: पहला खंड विशेष रूप से समयगत (‘मिस्र देश के समय से’) या उद्धारगत (‘मिस्र देश से निकालने वाला’) समझा जा सकता है; मध्य खंड को कथन अथवा आज्ञात्मक निषेध माना जा सकता है।
  rationale: अनुवाद निर्गमन-आधारित वाचा और याहवे की अनन्यता को व्यक्त करता है, किन्तु पद में निहित तनाव को किसी बाद की धर्मसैद्धान्तिक परिभाषा से नहीं भरता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परमेश्वर’ तथा ‘उद्धारकर्ता’ बाइबलीय गरिमा बनाए रखते हैं; एकवचन ‘तुम्हारा/तुम’ मूल पाठ में सामूहिक इस्राएल को सम्बोधित द्वितीय पुरुष एकवचन को सुरक्षित रखता है।
