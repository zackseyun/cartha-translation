  text: וָ/אֱהִ֥י לָ/הֶ֖ם כְּמוֹ שָׁ֑חַל כְּ/נָמֵ֖ר עַל דֶּ֥רֶךְ אָשֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/007.yaml
  text: So I became to them like a lion[a]; like a leopard I lurked by the way.
translation:
  language: hi
  text: इसलिए मैं उनके लिए सिंह के समान बन गया; तेंदुए के समान मैं मार्ग के किनारे घात लगाए रहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम इब्रानी शब्द कठिन है। इसका अनुवाद “मैं मार्ग के किनारे देखता रहा” या “मैं मार्ग के पास घात में पड़ा रहा” भी किया जा सकता है। इसका लिखित रूप स्थान-नाम “अश्शूर” (असीरिया) के समान है; फिर भी यहाँ इसे देखने या घात लगाने के अर्थ वाली प्रथम पुरुष क्रिया समझना संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: इसलिए मैं ... बन गया
  rationale: यह היה का प्रथम पुरुष एकवचन वय्यिक्तोल रूप है। न्याय के इस क्रम में ‘बन गया’ आरंभिक/परिणामी भाव व्यक्त करता है, और ‘इसलिए’ संदर्भ में वाव के परिणामसूचक बल को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: לָהֶם
  choice: उनके लिए
  rationale: לָהֶם इस्राएल के प्रति संबंध बताता है। हिन्दी में ‘उनके लिए ... बन गया’ इस रचना के साथ स्वाभाविक है, यद्यपि इसका भाव ‘उनके प्रति’ भी समझा जा सकता है।
- source_word: כְּמוֹ שָׁחַל
  choice: सिंह के समान
  rationale: שָׁחַל सिंह को सूचित करता है, जिसमें उग्रता का भाव हो सकता है। ‘सिंह’ स्पष्ट और सामान्य हिन्दी है; यहाँ ‘जवान सिंह’ कहना आवश्यक नहीं।
- source_word: כְּנָמֵר
  choice: चीते के समान
  rationale: נָמֵר चित्तीदार हिंस्र बिल्ली को दर्शाता है। आधुनिक सामान्य हिन्दी में ‘चीता’ परिचित पारंपरिक पद है, हालांकि प्राणिवैज्ञानिक दृष्टि से ‘तेंदुआ’ अधिक सटीक विकल्प हो सकता है।
- source_word: עַל דֶּרֶךְ
  choice: मार्ग के किनारे
  rationale: यह वाक्यांश यात्रा-पथ के पास घात की स्थिति का चित्र प्रस्तुत करता है। ‘मार्ग के किनारे’ उस दृश्य को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: אָשׁוּר
  choice: मैं ... घात लगाकर बैठा रहा
  rationale: यद्यपि लिखित रूप अश्शूर नाम के समान दिखता है, शिकारी पशुओं के समानांतर चित्र और वाक्य-संरचना इसे देखने/घात लगाने के अर्थ वाला प्रथम पुरुष क्रियारूप समझने का समर्थन करते हैं। ‘घात लगाकर बैठा रहा’ शिकारी के प्रतीक्षा करने का भाव व्यक्त करता है, जबकि पाठगत कठिनाई पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: न्याय करते हुए परमेश्वर का हिंस्र पशु के रूप में चित्रण
  choice: ‘सिंह के समान’ और ‘चीते के समान ... घात लगाकर’ उपमाओं को सीधे और प्रबल रूप में बनाए रखा गया।
  alternative: चित्र को नरम करके ‘मार्ग पर निगरानी करता रहा’ कहना।
  rationale: इब्रानी पाठ यहोवा के न्याय को कठोर शिकारी-रूपक में प्रस्तुत करता है। अनुवाद में इस धर्मवैचारिक तनाव और चित्र की तीव्रता को कम नहीं किया जाना चाहिए।
- issue: אָשׁוּר की कठिन और संभवतः बहुअर्थी व्याख्या
  choice: मुख्य पाठ में संदर्भानुकूल प्रथम पुरुष क्रिया, ‘घात लगाकर बैठा रहा।’
  alternative: ‘मैं देखता रहा’; अथवा लिखित रूप को स्थान-नाम ‘अश्शूर’ समझना।
  rationale: सिंह और चीते की समानांतर उपमाएँ घात लगाने वाली क्रिया के पक्ष में हैं, पर रूप की कठिनाई वास्तविक है; इसलिए अन्य क्रियात्मक अर्थ और स्थान-नाम की संभावना पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, स्पष्ट और सामान्य पाठकों के लिए सहज शैली रखी गई है। ‘मार्ग’ बाइबलीय गरिमा बनाए रखता है, जबकि ‘घात लगाकर बैठा रहा’ शिकारी बिंब को स्वाभाविक हिन्दी में स्पष्ट करता है।
