  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּ/דַבֵּ֤ר אֶפְרַ֨יִם֙ רְתֵ֔ת נָשָׂ֥א ה֖וּא בְּ/יִשְׂרָאֵ֑ל וַ/יֶּאְשַׁ֥ם בַּ/בַּ֖עַל וַ/יָּמֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/001.yaml
  text: When Ephraim spoke[a], there was trembling; he was exalted in Israel[b]. But he became guilty through Baal and died.
translation:
  language: hi
  text: जब एप्रैम बोलता था, तब थरथराहट होती थी; वह इस्राएल में ऊँचा उठा।[a] पर वह बाल के कारण दोषी हो गया[b] और मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने इस्राएल में अपने आपको ऊँचा किया,” अथवा “वह इस्राएल में प्रतिष्ठित हुआ।” इब्रानी वाक्य बहुत संक्षिप्त है और इसे सक्रिय-आत्मवाचक या निष्क्रिय/परिणामसूचक अर्थ में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “बाल के कारण” का अर्थ “बाल की उपासना के कारण” या “बाल से जुड़कर” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר
  choice: जब ... बोलता था
  rationale: כְּ के साथ infinitive construct यहाँ काल-सूचक है। अपूर्ण भूतकालीन हिन्दी रूप प्रसंग में एप्रैम के प्रभाव की सामान्य स्थिति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है। यहाँ यह उत्तरी राज्य का प्रतिनिधित्व कर सकता है, पर मुख्य पाठ में उसका अर्थ खोलकर नहीं जोड़ा गया।
- source_word: רְתֵת
  choice: कँपकँपी
  rationale: यह शब्द काँपने या थरथराने का भाव देता है। 'कँपकँपी छा जाती थी' प्रतिक्रिया को सजीव रखता है, पर यह निश्चित नहीं करता कि उसका कारण भय, विस्मय या राजनीतिक आतंक था।
- source_word: נָשָׂא הוּא בְּיִשְׂרָאֵל
  choice: वह इस्राएल में ऊँचा उठा था
  rationale: इब्रानी वाक्यांश संक्षिप्त है और प्रतिष्ठा या ऊँचे स्थान को सूचित करता है। हिन्दी अभिव्यक्ति परिणामस्वरूप मिली प्रमुखता को स्वाभाविक रूप से बताती है, जबकि सक्रिय-आत्मवाचक और अधिक स्पष्ट निष्क्रिय पाठों को पाद-टिप्पणी में रखा गया है।
- source_word: וַיֶּאְשַׁם
  choice: वह ... दोषी ठहरा
  rationale: अर्थ दोषी होने या दोष मोल लेने का है। 'दोषी ठहरा' नैतिक और वाचा-संबंधी गंभीरता को संक्षेप में बनाए रखता है।
- source_word: בַּבַּעַל
  choice: बाल के कारण
  rationale: בְּ यहाँ बाल से साधनात्मक या संबंधपरक जुड़ाव बता सकता है। यह चयन सहज हिन्दी में कारण-संबंध व्यक्त करता है; 'बाल की उपासना के कारण' अधिक व्याख्यात्मक विकल्प के रूप में पाद-टिप्पणी में है।
- source_word: וַיָּמֹת
  choice: और मर गया
  rationale: सरल और कठोर परिणाम को ज्यों का त्यों रखा गया है; पाठ यह तय नहीं करता कि मृत्यु को व्यक्तिगत, आत्मिक या सामूहिक-राजनीतिक अर्थ में समझा जाए।
theological_decisions:
- issue: एप्रैम के उत्थान और पतन का आशय
  choice: मुख्य पाठ एप्रैम को इस्राएल में ऊँचे स्थान पर उठा हुआ बताता है, फिर बाल के कारण उसके दोषी होने और मरने का वर्णन करता है।
  alternative: एप्रैम ने अपने आपको ऊँचा किया; अथवा दूसरों ने उसे प्रतिष्ठित किया। 'मर गया' सामूहिक-राजनीतिक मृत्यु का संकेत भी हो सकता है।
  rationale: संक्षिप्त इब्रानी वाक्य सक्रिय-आत्मवाचक और निष्क्रिय/परिणामसूचक अर्थों की गुंजाइश देता है। अनुवाद भविष्यद्वाणी के न्याय को स्पष्ट रखता है, पर मृत्यु का व्यक्तिगत, आत्मिक या राष्ट्रीय अर्थ निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और मौखिक रूप से स्पष्ट रजिस्टर अपनाया गया है। 'कँपकँपी छा जाती थी' अनिर्दिष्ट प्रतिक्रिया को बनाए रखता है; 'ऊँचा उठा था' प्रतिष्ठा का भाव देता है और पाद-टिप्पणी मूल की व्याकरणिक संक्षिप्तता को सुरक्षित रखती है।
