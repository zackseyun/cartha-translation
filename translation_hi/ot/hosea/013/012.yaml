  text: Ephraim’s iniquity is bound up[a]; his sin is stored up.
translation:
  language: hi
  text: एप्रैम का अधर्म बाँधकर रखा गया है; उसका पाप छिपाकर रखा गया है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भविष्य के लिए सँजोकर रखा गया है” या “रख छोड़ा गया है।” इब्रानी शब्द का अर्थ छिपाया हुआ या भविष्य के लिए सुरक्षित रखा हुआ—दोनों हो सकता है; यहाँ सम्भवतः भाव यह है कि एप्रैम का पाप आने वाले हिसाब के लिए रखा हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוּר
  choice: बाँधकर रखा गया है
  rationale: צרר के निष्क्रिय कृदन्त में बाँधने, गठरी में रखने और सुरक्षित रख छोड़ने का रूपक है। यह अभिव्यक्ति उस रूपक को बनाए रखती है और समानांतर दूसरे खंड के साथ स्वाभाविक हिन्दी देती है।
- source_word: עֲוֺן
  choice: अधर्म
  rationale: עָוֹן अपराध, दोष या उसके दण्ड का बोध करा सकता है। यहाँ ‘पाप’ के साथ समानांतर प्रयोग नैतिक बुराई की ओर संकेत करता है; ‘अधर्म’ उसका नैतिक भार बनाए रखता है।
- source_word: אֶפְרָיִם
  choice: एप्रैम का
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यन्तरण रखा गया है और उससे जुड़ा संबंधकारक स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: צְפוּנָה
  choice: जमा करके रखा गया है
  rationale: צפן के निष्क्रिय कृदन्त का अर्थ छिपाया हुआ, सँजोया हुआ या भविष्य के लिए रख छोड़ा हुआ हो सकता है। न्याय के प्रसंग में यह अनुवाद पाप के हिसाब को आगामी लेखे के लिए सुरक्षित रखे जाने की छवि देता है, फिर भी ‘छिपा हुआ’ अर्थ को पादटिप्पणी में सुरक्षित रखता है।
- source_word: חַטָּאתוֹ
  choice: उसका पाप
  rationale: यहाँ חַטָּאת का अर्थ ‘पाप’ है, न कि ‘पापबलि’। एकवचन पुल्लिंग प्रत्यय ‘उसका’ के रूप में रखा गया है और सामूहिक एकवचन एप्रैम की ओर संकेत करता है।
theological_decisions:
- issue: अधर्म को बाँधकर और पाप को जमा करके रखने के रूपक का आशय
  choice: पद एप्रैम के अपराध को आगामी हिसाब या न्याय के लिए सुरक्षित रखे जाने की छवि प्रस्तुत करता है, पर मुख्य पाठ उस न्याय की प्रकृति को और स्पष्ट नहीं करता।
  alternative: इसे केवल पाप के छिपे हुए होने के अर्थ में भी समझा जा सकता है।
  rationale: दोनों निष्क्रिय कृदन्त और होशे के न्याय-संदर्भ से अपराध के मिटाए जाने के बजाय सुरक्षित रखे जाने का भाव मिलता है। अनुवाद भविष्य के न्याय की किसी विशिष्ट धर्मसैद्धान्तिक व्याख्या को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सहज रखी गई है। ‘बाँधकर रखा गया’ और ‘जमा करके रखा गया’ मूल के समानांतर रूपकों को बनाए रखते हैं; ‘एप्रैम’ को सामूहिक एकवचन मानते हुए ‘उसका’ रखा गया है।
