source:
  edition: WLC
  text: חֶבְלֵ֥י יֽוֹלֵדָ֖ה יָבֹ֣אוּ ל֑/וֹ הוּא בֵן֙ לֹ֣א חָכָ֔ם כִּֽי עֵ֥ת לֹֽא יַעֲמֹ֖ד בְּ/מִשְׁבַּ֥ר בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/013.yaml
  text: The labor pains of a woman giving birth come upon him[a]; he is an unwise son[b], for at the proper time he does not present himself at the opening of the womb.
translation:
  language: hi
  text: प्रसव करती स्त्री की प्रसव-पीड़ाएँ[a] उस पर आ पड़ेंगी; वह निर्बुद्धि पुत्र है, क्योंकि समय आने पर वह गर्भ के द्वार पर आगे नहीं आता।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जन्म-वेदनाएँ।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वह पुत्रों के मिशबार पर खड़ा नहीं होता।” “मिशबार” एक कठिन पद है; यह बच्चों के बाहर निकलने के स्थान, अर्थात गर्भ के द्वार, अथवा प्रसव की निर्णायक घड़ी का संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי יֹלֵדָה
  choice: जननेवाली स्त्री की प्रसव-पीड़ाएँ
  rationale: यहाँ חֶבְלֵי का अर्थ रस्सियाँ नहीं, बल्कि प्रसव की पीड़ाएँ है; יֹלֵדָה स्त्री को जन्म देने की अवस्था में दिखाता है।
- source_word: יָבֹאוּ לוֹ
  choice: उस पर आ पड़ेंगी
  rationale: इब्रानी मुहावरे में पीड़ाओं के उस व्यक्ति पर आने का भाव है। भविष्यकालीन रूप इब्रानी अपूर्ण क्रिया की स्वाभाविक भावी शक्ति को रखता है।
- source_word: בֵן לֹא חָכָם
  choice: निर्बुद्धि पुत्र
  rationale: यह संक्षिप्त विशेषणात्मक कथन जन्म और पुत्र के रूपक को बनाए रखता है तथा 'मूर्ख' की अपेक्षा कम नैतिक आरोप जोड़ता है।
- source_word: כִּי עֵת
  choice: क्योंकि समय आने पर
  rationale: यह प्रसव की निर्णायक घड़ी को स्वाभाविक हिन्दी में व्यक्त करता है, बिना 'उचित' जैसा अतिरिक्त विशेषण जोड़े।
- source_word: לֹא יַעֲמֹד
  choice: आगे नहीं आता
  rationale: शाब्दिक अर्थ 'खड़ा नहीं होता' है, पर प्रसव-रूपक में आशय यह है कि पुत्र निर्णायक समय पर जन्म लेने के लिए आगे नहीं आता।
- source_word: בְּמִשְׁבַּר בָּנִים
  choice: जन्म-द्वार पर
  rationale: दुर्बोध पद מִשְׁבַּר बच्चों के बाहर निकलने की जगह या प्रसव की निर्णायक घड़ी का संकेत देता है। मुख्य पाठ में ठोस जन्म-चित्र रखा गया है और शाब्दिक अनिश्चितता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: जन्म-रूपक का संकेतित पात्र
  choice: तीसरे पुरुष के रूपक को बिना नाम जोड़े बनाए रखना
  alternative: मुख्य पाठ में 'एप्रैम' या 'इस्राएल' जोड़ना
  rationale: आस-पास का प्रसंग संकेतित पात्र स्पष्ट करता है, पर इस पद के इब्रानी पाठ में उसका नाम नहीं है; नाम जोड़ने से रूपक की मूल अस्पष्टता घट जाती।
- issue: पुत्र की विफलता का स्वरूप
  choice: निर्णायक समय पर जन्म-द्वार पर आगे न आने की छवि रखना
  alternative: इसे सीधे पश्चात्ताप, राजनीतिक निर्णय या उद्धार के अवसर की विफलता कहना
  rationale: ये अर्थ व्यापक प्रसंग से निकाले जा सकते हैं, पर पद स्वयं प्रसव का रूपक देता है; अनुवाद को किसी एक धर्मवैचारिक व्याख्या में रूपक को सीमित नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास अपनाया गया है। 'प्रसव-पीड़ाएँ', 'निर्बुद्धि पुत्र' और 'जन्म-द्वार' मूल रूपक को स्पष्ट रखते हैं; 'आगे नहीं आता' कठिन इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है, जिसकी शाब्दिक बनावट पादटिप्पणी में सुरक्षित है।
