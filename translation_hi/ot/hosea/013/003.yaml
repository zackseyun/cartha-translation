  choice: इसलिए
  rationale: यह पिछले अभियोग और उसके फलस्वरूप आनेवाले न्याय के बीच परिणाम-संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִהְיוּ
  choice: वे ... होंगे
