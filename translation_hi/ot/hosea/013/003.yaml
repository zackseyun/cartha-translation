  yaml_path: translation/ot/hosea/013/003.yaml
  text: Therefore they will be like the morning cloud[a], and like the dew that goes away early, like chaff whirled from the threshing floor, and like smoke from a window.
translation:
  language: hi
  text: 'इसलिए वे सुबह के बादल के समान होंगे,

    और उस ओस के समान जो भोर होते ही चली जाती है;

    खलिहान से आँधी में उड़ती भूसी के समान,

    और खिड़की[a] से निकलते धुएँ के समान।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झरोखे से।” इब्रानी शब्द खिड़की के खुले भाग या जालीदार झरोखे को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
