- source_word: כַּעֲנַן בֹּקֶר
  choice: सुबह के बादल के समान
  rationale: यह शीघ्र मिट जानेवाली और अस्थिर वस्तु का चित्र प्रस्तुत करता है; हिन्दी में तुलना स्वाभाविक रहती है।
- source_word: וְכַטַּל מַשְׁכִּים הֹלֵךְ
  choice: उस ओस के समान जो भोर होते ही चली जाती है
  rationale: מַשְׁכִּים की प्रातःकालीन शीघ्रता और הֹלֵךְ के चले जाने के भाव, दोनों को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: כְּמֹץ
  choice: भूसी के समान
  rationale: מוֹץ के लिए 'भूसी' साधारण हिन्दी में स्पष्ट है और अनाज पछोरने के कृषि-चित्र को बनाए रखती है।
- source_word: יְסֹעֵר
  choice: आँधी में उड़ती
  rationale: क्रिया के तूफ़ानी ढंग से उड़ा दिए जाने के प्रबल और घूमते हुए गति-भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִגֹּרֶן
  choice: खलिहान से
  rationale: मूल पाठ के अनाज पछोरने के स्थान और מִן के अलगाव या स्रोत के भाव को सुरक्षित रखता है।
- source_word: וּכְעָשָׁן
  choice: और ... धुएँ के समान
  rationale: समानांतर उपमा और शीघ्र विलीन हो जानेवाली वस्तु के चित्र को बनाए रखता है।
- source_word: מֵאֲרֻבָּה
  choice: खिड़की से
  rationale: אֲרֻבָּה किसी खिड़की के खुले भाग या जालीदार झरोखे को सूचित कर सकता है। 'खिड़की' मुख्य पाठ में सबसे सहज है और 'झरोखा' पादटिप्पणी में रखा गया है।
