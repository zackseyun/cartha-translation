  text: אֶפְגְּשֵׁ/ם֙ כְּ/דֹ֣ב שַׁכּ֔וּל וְ/אֶקְרַ֖ע סְג֣וֹר לִבָּ֑/ם וְ/אֹכְלֵ֥/ם שָׁם֙ כְּ/לָבִ֔יא חַיַּ֥ת הַ/שָּׂדֶ֖ה תְּבַקְּעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/008.yaml
  text: I will attack them like a bear robbed of her cubs[a], and I will tear open the enclosure of their heart; there I will devour them like a lioness[b]; a wild beast of the field will rip them apart.
translation:
  language: hi
  text: मैं उन पर ऐसी रीछनी के समान टूट पड़ूँगा, जिसके बच्चे छीन लिए गए हों; और उनके हृदय का आवरण[a] फाड़ डालूँगा। वहीं मैं उन्हें सिंह[b] के समान निगल जाऊँगा; मैदान का जंगली पशु उन्हें चीर डालेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके हृदय का घेरा”; संभवतः आशय “उनकी छाती” या “वक्ष” से है। इब्रानी वाक्यांश दुर्लभ और कठिन है।
    reason: lexical_alternative
  - marker: b
    text: या “सिंहनी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְגְּשֵׁם
  choice: मैं उन पर ... टूट पड़ूँगा
  rationale: פגשׁ का मूल भाव ‘मिलना/सामना करना’ है, पर न्याय और हिंस्र पशु के प्रसंग में यह शत्रुतापूर्ण आक्रमण दर्शाता है। ‘टूट पड़ूँगा’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּדֹב שַׁכּוּל
  choice: ऐसी रीछनी के समान, जिसके बच्चे छीन लिए गए हों
  rationale: שַׁכּוּל संतान से वंचित या शोकाकुल होने को दर्शाता है। यह अनुवाद मातृ-पशु के उग्र बिंब को स्पष्ट रखता है।
- source_word: וְאֶקְרַע
  choice: फाड़ डालूँगा
  rationale: קרע का अर्थ फाड़ना या चीरना है; ‘फाड़ डालूँगा’ आगामी शारीरिक और हिंसक बिंब को बनाए रखता है।
- source_word: סְגוֹר לִבָּם
  choice: उनके हृदय का आवरण
  rationale: यह दुर्लभ और कठिन पदबंध है। סְגוֹר किसी बंद करने वाली वस्तु या घेरे को सूचित करता है; ‘आवरण’ मूल अस्पष्टता को ‘छाती’ कहकर पूरी तरह व्याख्यायित नहीं करता।
- source_word: וְאֹכְלֵם שָׁם
  choice: वहीं मैं उन्हें ... निगल जाऊँगा
  rationale: हिंस्र पशु के प्रसंग में אכל के लिए ‘निगल जाना’ स्वाभाविक है, और שָׁם को ‘वहीं’ के रूप में स्पष्ट रखा गया है।
- source_word: כְּלָבִיא
  choice: सिंहनी के समान
  rationale: לָבִיא वयस्क सिंह अथवा सिंहनी को सूचित कर सकता है। पूर्ववर्ती मातृ-रीछनी के बिंब के साथ ‘सिंहनी’ संभव और सजीव है, पर ‘सिंह’ भी वैध विकल्प है।
- source_word: חַיַּת הַשָּׂדֶה
  choice: मैदान का जंगली पशु
  rationale: एकवचन पद और क्रिया को बनाए रखते हुए यह खुले प्रदेश के हिंस्र, अदम्य पशु का अर्थ देता है।
- source_word: תְּבַקְּעֵם
  choice: उन्हें चीर डालेगा
  rationale: בקע का अर्थ फाड़कर या चीरकर खोल देना है। ‘चीर डालेगा’ हिंस्र पशु द्वारा शरीर को चीरने की तीव्रता को संक्षिप्त, स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: परमेश्वर का हिंस्र पशुओं के बिंबों द्वारा आत्म-वर्णन
  choice: प्रथम पुरुष में प्रत्यक्ष दैवी कर्तृत्व और हिंसक पशु-बिंबों को बिना नरम किए बनाए रखा गया है।
  alternative: इसे केवल सामान्य दण्ड या विनाश की भाषा में व्यक्त करना।
  rationale: इब्रानी पाठ वाचा-संबंधी न्याय में परमेश्वर को सीधे कर्ता के रूप में प्रस्तुत करता है। अनुवाद इस कठिन धर्मवैचारिक तनाव को शिष्टोक्ति से समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सजीव शैली। ‘रीछनी’, ‘सिंहनी’, ‘निगल जाऊँगा’ और ‘चीर डालेगा’ मूल के हिंस्र पशु-बिंबों को बनाए रखते हैं। कठिन סְגוֹר לִבָּם को मुख्य पाठ में अपेक्षाकृत औपचारिक ‘हृदय का आवरण’ रखा गया है और संभावित शारीरिक अर्थ पादटिप्पणी में दिया गया है।
