  yaml_path: translation/ot/hosea/001/006.yaml
  text: Then she conceived again and gave birth to a daughter[a]. And he said to him, “Call her name Lo-ruhamah, for I will no longer again show compassion to the house of Israel[b], that I should surely forgive them.”
translation:
  language: hi
  text: फिर वह गर्भवती हुई और उसने एक बेटी को जन्म दिया। तब उसने उससे कहा, “उसका नाम लो-रुहामा[a] रखना, क्योंकि मैं इस्राएल के घराने पर अब और दया नहीं करूँगा; मैं उन्हें कदापि क्षमा नहीं करूँगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “लो-रुहामा” नाम का अर्थ “जिस पर दया नहीं की गई” या “दया नहीं” के समान है।
    reason: नाम के पीछे רחם धातु का अर्थ और मुख्य कथन से उसका संबंध स्पष्ट करना।
  - marker: b
    text: 'अंतिम इब्रानी उपवाक्य कठिन है। इसका अनुवाद यह भी हो सकता है: “क्योंकि मैं उन्हें निश्चय ही उठा ले जाऊँगा।”'
    reason: मूल में נשׂא के वैकल्पिक अर्थ और वाक्यगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: फिर वह गर्भवती हुई
  rationale: यह कथात्मक क्रम और עוֹד के ‘फिर/दोबारा’ भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַתֵּלֶד בַּת
  choice: उसने एक बेटी को जन्म दिया
  rationale: ילד और בַּת का सीधा अर्थ रखते हुए यह आधुनिक हिन्दी में सहज है।
- source_word: וַיֹּאמֶר לוֹ
  choice: तब उसने उससे कहा
  rationale: इब्रानी में कर्ता और पुरुषवाचक अप्रत्यक्ष कर्म दोनों सर्वनाम रूप में हैं। किसी नाम या स्पष्ट कर्ता को जोड़ने के बजाय मूल की संदर्भगत अस्पष्टता रखी गई है।
- source_word: קְרָא שְׁמָהּ לֹא רֻחָמָה
  choice: उसका नाम लो-रुहामा रख
  rationale: नाम को देवनागरी में लिप्यंतरित किया गया है; नाम रखने का सूत्र हिन्दी में स्वाभाविक रूप से व्यक्त हुआ है और उसके अर्थ को पादटिप्पणी में बताया गया है।
- source_word: לֹא אוֹסִיף עוֹד אֲרַחֵם
  choice: मैं ... अब और दया नहीं करूँगा
  rationale: יסף और עוֹד से निरंतरता की समाप्ति का भाव आता है। ‘दया’ רחם और संकेतात्मक नाम लो-रुहामा के बीच अर्थगत संबंध बनाए रखती है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: ‘घराना’ covenantal-national अभिव्यक्ति ‘इस्राएल का घर’ को केवल ‘इस्राएल’ कहकर सपाट किए बिना सुबोध हिन्दी में रखता है।
- source_word: כִּי נָשֹׂא אֶשָּׂא לָהֶם
  choice: कि मैं उन्हें निश्चय ही क्षमा कर दूँ
  rationale: נשׂא के infinitive absolute और finite verb का मेल क्रिया पर बल देता है। प्रसंग में इसे दोष उठा लेने, अर्थात क्षमा करने, के अर्थ में लिया गया है; कठिन वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: संकेतात्मक बेटी के नाम का अनुवाद
  choice: मुख्य पाठ में ‘लो-रुहामा’ का लिप्यंतरण और पादटिप्पणी में उसका अर्थ
  alternative: नाम का सीधे ‘दया न की गई’ या ‘निर्दया’ के रूप में अनुवाद
  rationale: व्यक्तिनाम को नाम के रूप में रखते हुए उसके भविष्यसूचक अर्थ को छिपाया नहीं गया। ‘दया’ शब्द मूल רחם के साथ नाम का संबंध स्पष्ट करता है।
- issue: कठिन अंतिम उपवाक्य כִּי נָשֹׂא אֶשָּׂא לָהֶם
  choice: 'दया न करने के परिणामस्वरूप निश्चित क्षमा न करने का आशय: ‘कि मैं उन्हें निश्चय ही क्षमा कर दूँ’'
  alternative: न्याय के रूप में ‘क्योंकि मैं उन्हें निश्चय ही उठा ले जाऊँगा’
  rationale: नकार का प्रभाव अंतिम उपवाक्य तक समझने पर ‘क्षमा’ प्रसंग के अनुकूल है, और infinitive absolute का बल ‘निश्चय ही’ से रखा गया है। फिर भी इब्रानी वाक्य कठिन और बहुअर्थी है, इसलिए वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उसने उससे कहा’ जानबूझकर मूल के सर्वनामों को बनाए रखता है; स्पष्ट नाम जोड़कर अस्पष्टता दूर नहीं की गई। ‘अब और’ हिन्दी में cessation को स्वाभाविक रूप से व्यक्त करता है, जबकि नाम और दया के बीच शब्दगत प्रतिध्वनि सुरक्षित है।
