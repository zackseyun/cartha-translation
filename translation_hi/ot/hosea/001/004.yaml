source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלָ֔י/ו קְרָ֥א שְׁמ֖/וֹ יִזְרְעֶ֑אל כִּי ע֣וֹד מְעַ֗ט וּ/פָ֨קַדְתִּ֜י אֶת דְּמֵ֤י יִזְרְעֶאל֙ עַל בֵּ֣ית יֵה֔וּא וְ/הִ֨שְׁבַּתִּ֔י מַמְלְכ֖וּת בֵּ֥ית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/004.yaml
  text: Then Yahweh said to him[a], “Call his name Jezreel, for in a little while I will punish the house of Jehu for the bloodshed of Jezreel[b], and I will put an end to the kingdom of the house of Israel.”
translation:
  language: hi
  text: तब याहवे ने उससे कहा, “उसका नाम यिज्रेल[b] रख, क्योंकि अब थोड़े ही समय में मैं यिज्रेल के रक्तपात[a] के कारण येहू के घराने को दण्ड दूँगा और इस्राएल के घराने के राज्य का अन्त कर दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “यिज्रेल का रक्त” या “यिज्रेल का रक्त-दोष” भी हो सकता है। इब्रानी में शाब्दिक रूप से “यिज्रेल के रक्तों” है।
    reason: lexical_alternative
  - marker: b
    text: यिज्रेल बच्चे का सांकेतिक नाम भी है और उस स्थान का नाम भी, जो येहू के हिंसक कार्यों से जुड़ा था।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: קְרָא שְׁמוֹ
  choice: उसका नाम ... रख
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और नाम रखने की इब्रानी अभिव्यक्ति का अर्थ सुरक्षित रखता है।
- source_word: יִזְרְעֶאל
  choice: यिज्रेल
  rationale: व्यक्तिनाम और स्थाननाम के बीच जानबूझकर रखी गई समानता बनाए रखने के लिए दोनों जगह एक ही लिप्यंतरण किया गया है।
- source_word: כִּי עוֹד מְעַט
  choice: क्योंकि अब थोड़े ही समय में
  rationale: כִּי के कारणसूचक बल और עוֹד מְעַט की निकट भविष्य की समय-सूचना दोनों को व्यक्त करता है।
- source_word: וּפָקַדְתִּי
  choice: मैं ... दण्ड दूँगा
  rationale: न्याय के इस प्रसंग में פקד का अर्थ केवल ध्यान देना या भेंट करना नहीं, बल्कि दण्डात्मक लेखा लेना है।
- source_word: דְּמֵי יִזְרְעֶאל
  choice: यिज्रेल में हुए रक्तपात
  rationale: बहुवचन דְּמֵי का मुहावरेदार अर्थ रक्तपात या रक्त-दोष है। स्थानगत अर्थ प्रसंग में स्वाभाविक है, जबकि पादटिप्पणी वैकल्पिक अर्थ सुरक्षित रखती है।
- source_word: עַל בֵּית יֵהוּא
  choice: येहू के घराने को ... के लिए
  rationale: दण्डसूचक क्रिया के साथ लक्ष्य और कारण को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त किया गया है।
- source_word: וְהִשְׁבַּתִּי
  choice: अन्त कर दूँगा
  rationale: हिफ़ील रूप का कारक अर्थ—किसी वस्तु को समाप्त कर देना—स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त होता है।
- source_word: מַמְלְכוּת בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने का राज्य
  rationale: मूल रचना में उपस्थित ‘घराना’ बनाए रखा गया है, जिससे राष्ट्रीय और वंशगत आयाम अनावश्यक रूप से संकुचित नहीं होते।
theological_decisions:
- issue: येहू के घराने पर न्याय का स्वरूप
  choice: पद को यिज्रेल से जुड़े रक्तपात के कारण येहू के घराने पर आने वाले परमेश्वरीय दण्ड की घोषणा के रूप में रखा गया है।
  alternative: इसे या तो येहू के समस्त हिंसक कार्यों की स्पष्ट निन्दा, या केवल उसके बाद के वंश के पापों का दण्ड मानना।
  rationale: इब्रानी पद दण्ड की घोषणा करता है, पर स्वयं यह स्पष्ट नहीं करता कि इसका 2 राजा 9–10 में येहू को मिले आदेश से ठीक क्या सम्बन्ध है; इसलिए अनुवाद उस धर्मवैचारिक तनाव को हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘घराना’, ‘रक्तपात’ और ‘दण्ड’ न्यायवाणी की गंभीरता बनाए रखते हैं। सांस्कृतिक टिप्पणी को उद्धरण के भीतर वाक्य न बनाकर केवल पादटिप्पणी के रूप में पढ़ा जाना चाहिए; प्रकाशन-विन्यास में [b] को पहले ‘यिज्रेल’ नाम के बाद लगाया जा सकता है।
