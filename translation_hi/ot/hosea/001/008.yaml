  text: लो-रुहामा[a] का दूध छुड़ाने के बाद वह गर्भवती हुई और उसने एक बेटे को जन्म दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: लो-रुहामा का अर्थ है “जिस पर दया नहीं की गई” या “दया नहीं।” आस-पास के प्रसंग में इस नाम का अर्थ महत्त्वपूर्ण है, यद्यपि मुख्य पाठ में नाम का लिप्यंतरण किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְמֹל
  choice: जब उसने ... का दूध छुड़ा दिया
  rationale: यहाँ Qal रूप में גמל का अर्थ बच्चे का दूध छुड़ाना है। हिन्दी में अगले घटनाक्रम से पहले पूर्ण हुई क्रिया और कथा का क्रम दिखाने के लिए यह स्वाभाविक है।
- source_word: אֶת
  choice: '[निश्चित कर्म-सूचक; अलग से अनूदित नहीं]'
  rationale: यह इब्रानी में निश्चित प्रत्यक्ष कर्म को चिह्नित करता है; हिन्दी में इसके लिए अलग शब्द आवश्यक नहीं है।
- source_word: לֹא רֻחָמָה
  choice: लो-रुहामा
  rationale: यह व्यक्तिगत नाम है, इसलिए मुख्य पाठ में अर्थानुवाद के बजाय लिप्यंतरण किया गया है। योजक-चिह्न इब्रानी संयुक्त नाम की रचना बनाए रखता है।
- source_word: וַתַּהַר
  choice: वह गर्भवती हुई
  rationale: הרה के लिए यह स्पष्ट, स्वाभाविक और आधुनिक हिन्दी अभिव्यक्ति है।
- source_word: וַתֵּלֶד
  choice: उसने ... को जन्म दिया
  rationale: ילד के इस कथात्मक रूप का यह स्पष्ट और प्रचलित हिन्दी अनुवाद है।
- source_word: בֵּן
  choice: एक बेटे
  rationale: בֵּן का अर्थ 'बेटा' है; यहाँ नए बच्चे का पहली बार उल्लेख होने के कारण 'एक' स्वाभाविक है।
