  yaml_path: translation/ot/hosea/001/003.yaml
  text: So he went and took Gomer daughter of Diblaim[a], and she conceived and bore him a son.
translation:
  language: hi
  text: फिर वह गया और उसने दिबलैम की बेटी गोमेर को पत्नी के रूप में लिया[a]। वह गर्भवती हुई और उसने उसे एक पुत्र जन्म दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “गोमेर को लिया”; संदर्भ में इसका अर्थ उसे पत्नी के रूप में लेना है। इसे “गोमेर से विवाह किया” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: तब वह गया
  rationale: वय्यिक़्तोल रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रमिकता व्यक्त करता है।
- source_word: וַיִּקַּח
  choice: पत्नी के रूप में ग्रहण किया
  rationale: मूल अर्थ ‘लिया’ है, पर पिछले पद की आज्ञा और विवाह-संदर्भ यहाँ वैवाहिक भाव स्पष्ट करते हैं। हिन्दी में केवल ‘गोमेर को लिया’ अस्वाभाविक और संभावित रूप से भ्रामक होगा; इसलिए संदर्भगत अर्थ मुख्य पाठ में रखा गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: אֶת גֹּמֶר
  choice: गोमेर को
  rationale: אֶת कर्म-चिह्न है; हिन्दी में ‘को’ से चिह्नित किया गया और नाम का लिप्यंतरण ‘गोमेर’ रखा गया।
- source_word: בַּת דִּבְלָיִם
  choice: दिबलैम की बेटी
  rationale: यह सामान्य पितृनामसूचक रचना है; आधुनिक हिन्दी में ‘दिबलैम की बेटी’ सीधा और स्वाभाविक है।
- source_word: וַתַּהַר
  choice: वह गर्भवती हुई
  rationale: הרה का अर्थ गर्भ धारण करना अथवा गर्भवती होना है; यह अभिव्यक्ति आधुनिक पाठकों के लिए सहज है।
- source_word: וַתֵּלֶד
  choice: उसने … जन्म दिया
  rationale: ילד के इस रूप का अर्थ संतान को जन्म देना है; आधुनिक हिन्दी में यही स्वाभाविक प्रयोग है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: לְ उपसर्ग के पुरुषवाचक प्रत्यय को बनाए रखता है। यहाँ इसका सम्बन्धपरक भाव है कि पुत्र होशे का था; हिन्दी में ‘उसके लिए’ मूल संरचना के निकट है, यद्यपि कुछ संदर्भों में इसे केवल ‘उसका’ समझा जा सकता है।
- source_word: בֵּן
  choice: एक पुत्र
  rationale: अनिश्चित, पहली बार उल्लिखित पुरुष संतान के लिए ‘एक पुत्र’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: וַיִּקַּח के वैवाहिक भाव को मुख्य पाठ में स्पष्ट करना
  choice: ‘पत्नी के रूप में ग्रहण किया’
  alternative: ‘गोमेर को लिया’ अथवा ‘गोमेर से विवाह किया’
  rationale: क्रिया अपने आप में ‘लिया’ कहती है, लेकिन निकट संदर्भ इसे विवाह के अर्थ में रखता है। ‘विवाह किया’ अधिक सहज है पर मूल क्रिया की छवि मिटा देता है; ‘पत्नी के रूप में ग्रहण किया’ अर्थ और रूप दोनों को यथासंभव सँभालता है।
- issue: לוֹ के सम्बन्ध को व्यक्त करना
  choice: ‘उसके लिए एक पुत्र’
  alternative: ‘उसका एक पुत्र’ अथवा केवल ‘एक पुत्र’
  rationale: मूल में पुरुषवाचक दत्तिवाचक रूप स्पष्ट रूप से उपस्थित है। उसे बनाए रखने से पाठ का दावा सुरक्षित रहता है, बिना जैविक पितृत्व के प्रश्न पर मूल से अधिक निष्कर्ष निकाले।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘ग्रहण किया’ कुछ औपचारिक है, पर यहाँ ‘लिया’ की हिब्रू अभिव्यक्ति और उसके वैवाहिक अर्थ के बीच उचित संतुलन देता है।
