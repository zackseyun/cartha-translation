source:
  edition: WLC
  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל הוֹשֵׁ֨עַ֙ בֶּן בְּאֵרִ֔י בִּ/ימֵ֨י עֻזִּיָּ֥ה יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖ה מַלְכֵ֣י יְהוּדָ֑ה וּ/בִ/ימֵ֛י יָרָבְעָ֥ם בֶּן יוֹאָ֖שׁ מֶ֥לֶךְ יִשְׂרָאֵֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/001.yaml
  text: The word of Yahweh that came to Hosea son of Beeri in the days of Uzziah[a], Jotham, Ahaz, and Hezekiah, kings of Judah, and in the days of Jeroboam son of Joash, king of Israel.
translation:
  language: hi
  text: याहवे[a] का वह वचन जो यहूदा के राजाओं उज्जियाह, योताम, आहाज और हिजकियाह के दिनों में, और इस्राएल के राजा योआश के पुत्र यारोबाम के दिनों में बेरी के पुत्र होशे के पास आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: “YHWH” (יהוה)। इसे “याहवे” लिखा गया है; परंपरागत अनुवादों में इसे “प्रभु” भी अनूदित किया जाता है।'
    reason: ईश्वरीय नाम के हिब्रू रूप और पारंपरिक वैकल्पिक अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: यहोवा का वह वचन
  rationale: भविष्यवाणी-संबंधी शीर्षक के स्थापित सूत्र को बनाए रखता है; ‘वचन’ दैवी प्रकाशन के अर्थ और औपचारिक गरिमा को ‘संदेश’ से अधिक निकटता से व्यक्त करता है।
- source_word: אֲשֶׁר הָיָה אֶל
  choice: जो ... के पास पहुँचा
  rationale: हिब्रू भविष्यवाणी-सूत्र का स्वाभाविक हिन्दी रूप; यह प्रकाशन के नबी तक आने का भाव व्यक्त करता है, बिना उसे केवल बोले गए संदेश तक सीमित किए।
- source_word: הוֹשֵׁעַ בֶּן בְּאֵרִי
  choice: बेरी के पुत्र होशे
  rationale: हिन्दी की स्वाभाविक संबंध-वाक्यरचना में नाम और पितृनाम को स्पष्ट रूप से प्रस्तुत करता है।
- source_word: בִּימֵי
  choice: के दिनों में
  rationale: दोहराए गए हिब्रू काल-सूचक मुहावरे को औपचारिक और सहज हिन्दी में सुरक्षित रखता है।
- source_word: מַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं
  rationale: पूर्ववर्ती चार नामों की सामूहिक पदवी को स्पष्ट करता है।
- source_word: וּבִימֵי יָרָבְעָם בֶּן יוֹאָשׁ מֶלֶךְ יִשְׂרָאֵל
  choice: और इस्राएल के राजा योआश के पुत्र यारोबाम के दिनों में
  rationale: संयोजक और दूसरी काल-सीमा को बनाए रखते हुए राजा, पितृनाम और राज्य की पहचान स्वाभाविक हिन्दी क्रम में देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; पारंपरिक रूप से ‘प्रभु’
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम YHWH है। हिन्दी में व्यापक रूप से पहचाना जाने वाला नामरूप ‘यहोवा’ रखा गया है और पादटिप्पणी में मूल व्यंजन तथा वैकल्पिक उच्चारण बताया गया है; इसे केवल उपाधि में बदलकर मूल का व्यक्तिगत नाम नहीं छिपाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यवाणी-शीर्षक। हिब्रू की लंबी काल-संरचना और ‘वचन ... पहुँचा’ सूत्र को बनाए रखा गया है, पर हिन्दी में पहचान-संबंधों का क्रम स्वाभाविक बनाया गया है।
