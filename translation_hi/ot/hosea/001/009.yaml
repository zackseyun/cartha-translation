language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר קְרָ֥א שְׁמ֖/וֹ לֹ֣א עַמִּ֑י כִּ֤י אַתֶּם֙ לֹ֣א עַמִּ֔/י וְ/אָנֹכִ֖י לֹֽא אֶהְיֶ֥ה לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/009.yaml
  text: And he said[a], “Call his name Not-My-People, for you are not my people, and I am not yours.”
translation:
  language: hi
  text: तब उसने कहा, “उसका नाम ‘मेरी-प्रजा-नहीं’ रखो, क्योंकि तुम मेरी प्रजा नहीं हो, और मैं तुम्हारे लिए नहीं रहूँगा।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैं तुम्हारा न रहूँगा।” वाचा के संदर्भ में बहुत-से लोग इसका अर्थ, “और मैं तुम्हारा परमेश्वर न रहूँगा,” समझते हैं।
    reason: वैकल्पिक अर्थ; इब्रानी अंतिम उपवाक्य संक्षिप्त है और उसमें ‘परमेश्वर’ स्पष्ट रूप से नहीं आया है।
lexical_decisions:
- source_word: קְרָא שְׁמוֹ
  choice: उसका नाम … रखो
  rationale: हिन्दी में नामकरण का यह स्वाभाविक रूप है और इब्रानी भविष्यसूचक नामकरण-सूत्र का अर्थ स्पष्ट रखता है।
- source_word: לֹא עַמִּי
  choice: मेरी-प्रजा-नहीं
  rationale: बालक के प्रतीकात्मक नाम का अर्थ अनुवादित किया गया है; योजक-चिह्न दिखाते हैं कि पूरा पदबंध एक नाम के रूप में प्रयुक्त है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह प्रतीकात्मक नाम दिए जाने का कारण प्रस्तुत करता है और इब्रानी के कारणवाचक संबंध को सीधे व्यक्त करता है।
- source_word: אַתֶּם לֹא עַמִּי
  choice: तुम मेरी प्रजा नहीं हो
  rationale: यह वाचा-संबंधी कथन का सीधा उलटाव है; ‘मेरी प्रजा’ עַמִּי का स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: וְאָנֹכִי לֹא אֶהְיֶה לָכֶם
  choice: और मैं तुम्हारे लिए नहीं रहूँगा
  rationale: इब्रानी में ‘परमेश्वर’ या ‘तुम्हारा’ स्पष्ट रूप से नहीं है। यह रूप לָכֶם के ‘तुम्हारे लिए’ और אֶהְיֶה के भावी पक्ष को बनाए रखते हुए वाक्य की जानबूझकर रखी गई संक्षिप्तता को सुरक्षित रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य में वाचा-सूत्र का उलटाव
  choice: मुख्य पाठ में ‘परमेश्वर’ या ‘तुम्हारा’ जोड़े बिना ‘मैं तुम्हारे लिए नहीं रहूँगा’
  alternative: ‘मैं तुम्हारा न रहूँगा’ अथवा ‘मैं तुम्हारा परमेश्वर न रहूँगा’
  rationale: इब्रानी कथन संक्षिप्त और अर्थ की दृष्टि से खुला है, यद्यपि वह वाचा के सूत्र की ओर संकेत करता है। मुख्य पाठ अस्पष्टता और धर्मवैज्ञानिक तनाव को बनाए रखता है; अधिक पूर्ण व्याख्याएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रतीकात्मक नाम का अर्थ पाठक तक पहुँचाने के लिए उसका लिप्यंतरण करने के बजाय हिन्दी अनुवाद दिया गया है।
