id: HOS.1.7
reference: Hosea 1:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֶת בֵּ֤ית יְהוּדָה֙ אֲרַחֵ֔ם וְ/הֽוֹשַׁעְתִּ֖י/ם בַּ/יהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וְ/לֹ֣א אֽוֹשִׁיעֵ֗/ם בְּ/קֶ֤שֶׁת וּ/בְ/חֶ֨רֶב֙ וּ/בְ/מִלְחָמָ֔ה בְּ/סוּסִ֖ים וּ/בְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/007.yaml
  text: But I will have compassion on the house of Judah[a], and I will save them by Yahweh their God; I will not save them by bow, or by sword, or by war, by horses, or by horsemen.
translation:
  language: hi
  text: परन्तु मैं यहूदा के घराने पर दया करूँगा और उनके परमेश्वर याहवे के द्वारा[a] उनका उद्धार करूँगा; मैं धनुष, तलवार, युद्ध, घोड़ों या घुड़सवारों के द्वारा उनका उद्धार नहीं करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके परमेश्वर याहवे के माध्यम से”; हिब्रू पूर्वसर्ग साधन अथवा कर्तृत्व व्यक्त कर सकता है। मुख्य पाठ में “के द्वारा” रखा गया है, क्योंकि अगला वाक्य याहवे के उद्धार की तुलना सैन्य साधनों से करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֶת
  choice: परन्तु
  rationale: यह संयोजन पिछले पद में इस्राएल पर घोषित न्याय और अब यहूदा पर दिखाई जाने वाली दया के बीच विरोध प्रकट करता है।
- source_word: בֵּית יְהוּדָה
  choice: यहूदा का घराना
  rationale: यह यहूदा के राज्य और लोगों के लिए प्रयुक्त वाचागत-राष्ट्रीय अभिव्यक्ति है; ‘घराना’ हिब्रू रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲרַחֵם
  choice: दया करूँगा
  rationale: רחם करुणा और दया दिखाने का भाव रखता है; यह आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: וְהוֹשַׁעְתִּים
  choice: उनका उद्धार करूँगा
  rationale: ישׁע का हिफ़ील रूप बचाने या छुड़ाने को दर्शाता है; ‘उद्धार’ व्यापक अर्थ के साथ यहाँ के सैन्य-संकट के संदर्भ में भी उपयुक्त है।
- source_word: בַּיהוָה אֱלֹהֵיהֶם
  choice: उनके परमेश्वर याहवे के द्वारा
  rationale: ב को साधन अथवा कर्तृत्व-सूचक मानना अगले वाक्यांश में सैन्य साधनों के निषेध के साथ सबसे स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत दिव्य नाम יהוה को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: וְלֹא אוֹשִׁיעֵם
  choice: उनका उद्धार नहीं करूँगा
  rationale: पहले आए उसी हिब्रू धातु की पुनरावृत्ति बनाए रखने से ईश्वरीय उद्धार और सैन्य साधनों के बीच विरोध स्पष्ट रहता है।
- source_word: בְּקֶשֶׁת וּבְחֶרֶב וּבְמִלְחָמָה
  choice: धनुष, तलवार, युद्ध ... के द्वारा
  rationale: हथियारों और युद्ध की संक्षिप्त संचयी सूची को सीधे तथा स्वाभाविक हिन्दी में रखा गया है।
- source_word: בְּסוּסִים וּבְפָרָשִׁים
  choice: घोड़ों या घुड़सवारों के द्वारा
  rationale: सैन्य घोड़ों और सवार योद्धाओं की ठोस छवि को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: בַּיהוָה אֱלֹהֵיהֶם का अर्थ
  choice: 'साधन/कर्तृत्व: ‘उनके परमेश्वर याहवे के द्वारा’'
  alternative: ‘उनके परमेश्वर याहवे के माध्यम से’; अथवा संबंधपरक अर्थ में ‘उनके परमेश्वर याहवे में’
  rationale: इसके तुरंत बाद धनुष, तलवार, युद्ध, घोड़ों और घुड़सवारों को उद्धार के साधनों के रूप में नकारा गया है; इसलिए यहाँ याहवे को उद्धार के वास्तविक कर्ता/साधन के रूप में समझना संदर्भानुकूल है, जबकि पादटिप्पणी पूर्वसर्ग की व्यापकता को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘यहूदा का घराना’ भविष्यद्वाणी की राष्ट्रीय-वाचागत शैली को बनाए रखता है, और सैन्य साधनों की सूची को संक्षिप्त रखा गया है।
