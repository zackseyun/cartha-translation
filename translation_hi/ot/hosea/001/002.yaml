  choice: होशे के द्वारा यहोवा के बोलने का आरम्भ
  rationale: यह अभिव्यक्ति आरम्भिक शीर्षक के रूप में पढ़ी जा सकती है। בְּהוֹשֵׁעַ को माध्यमसूचक ‘होशे के द्वारा’ माना गया है, क्योंकि अगली उपवाक्य में होशे को सीधे सम्बोधित करने के लिए אֶל הוֹשֵׁעַ आया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यन्तरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: לֵךְ קַח לְךָ
  choice: जा, अपने लिए ... ले
  rationale: दोनों आज्ञार्थक रूपों तथा לְךָ के आत्महितसूचक भाव को रखा गया है। ‘विवाह कर’ अधिक व्याख्यात्मक होता।
- source_word: אֵשֶׁת זְנוּנִים
  choice: व्यभिचारिणी पत्नी
  rationale: यह चयन मूल की कठोर यौन और वाचा-संबंधी छवि को बनाए रखता है, पर ‘वेश्या’ या ‘वेश्यावृत्ति’ कहकर अर्थ को केवल व्यावसायिक यौन-सम्बन्ध तक सीमित नहीं करता।
- source_word: יַלְדֵי זְנוּנִים
  choice: व्यभिचार की सन्तान
  rationale: पत्नी और सन्तान से जुड़ी समान זְנוּנִים अभिव्यक्ति का समानान्तर रूप रखा गया है और सन्तान की सटीक परिस्थिति को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: כִּי זָנֹה תִזְנֶה
  choice: क्योंकि यह देश ... घोर व्यभिचार करता है
  rationale: क्रिया के साथ आए infinitive absolute की प्रबलता को ‘घोर’ द्वारा व्यक्त किया गया है; वर्तमानकालीन वाक्य देश के लगातार वाचा-भंग को दर्शाता है।
- source_word: הָאָרֶץ
  choice: यह देश
  rationale: ‘देश’ भूमि और उसके निवासियों दोनों को समेटने वाली मूल अलंकारिक व्यापकता बनाए रखता है।
- source_word: מֵאַחֲרֵי יְהוָה
  choice: यहोवा के पीछे चलना छोड़कर
  rationale: शाब्दिक ‘यहोवा के पीछे से’ का स्वाभाविक हिन्दी अर्थ उसके पीछे चलना त्याग देना है; इससे वाचा-विमुखता स्पष्ट होती है।
theological_decisions:
- issue: यौन रूपक की कठोरता को नरम किया जाए या बनाए रखा जाए
  choice: ‘व्यभिचारिणी पत्नी’, ‘व्यभिचार की सन्तान’ और ‘घोर व्यभिचार’ द्वारा कठोरता बनाए रखी गई
  alternative: ‘चरित्रहीन पत्नी’, ‘बेवफाई की सन्तान’ अथवा विशिष्ट रूप से ‘वेश्यावृत्ति’
  rationale: होशे का रूपक जानबूझकर झकझोरने वाला है और इस्राएल की वाचा-विमुखता को यौन बेवफाई से चित्रित करता है। ‘व्यभिचार’ यह बल बनाए रखते हुए अर्थ को केवल वेश्यावृत्ति तक सीमित नहीं करता।
- issue: בְהוֹשֵׁעַ को होशे से, होशे के साथ, या होशे के द्वारा कहा गया समझना
  choice: होशे के द्वारा
  alternative: होशे से / होशे के साथ
  rationale: अगले वाक्य में אֶל द्वारा ‘होशे से’ स्पष्ट रूप से कहा गया है; अतः यहाँ בְּ को माध्यमसूचक मानना भेद को सुरक्षित रखता है।
- issue: ‘देश’ को केवल भूमि समझा जाए या उसके निवासियों के लिए अलंकार माना जाए
  choice: मूल अलंकार को ‘यह देश’ के रूप में बनाए रखा गया
  alternative: इस देश के लोग
  rationale: ‘लोग’ अर्थ को स्पष्ट करता, पर मूल के सजीव मानवीकरण और भूमि से जुड़े वाचा-संबंधी तनाव को समाप्त कर देता।
