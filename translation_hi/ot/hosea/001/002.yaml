  text: תְּחִלַּ֥ת דִּבֶּר יְהוָ֖ה בְּ/הוֹשֵׁ֑עַ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הוֹשֵׁ֗עַ לֵ֣ךְ קַח לְ/ךָ֞ אֵ֤שֶׁת זְנוּנִים֙ וְ/יַלְדֵ֣י זְנוּנִ֔ים כִּֽי זָנֹ֤ה תִזְנֶה֙ הָ/אָ֔רֶץ מֵֽ/אַחֲרֵ֖י יְהוָֽה־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/002.yaml
  text: The beginning of the word of Yahweh through Hosea[a]. And Yahweh said to Hosea, “Go, take for yourself a wife of whoredom and children of whoredom[c][b], for the land utterly commits whoredom by turning away from Yahweh.”
translation:
  language: hi
  text: होशे के द्वारा यहोवा के बोलने का आरम्भ[a]। यहोवा ने होशे से कहा, “जा, अपने लिए यौन-अनैतिकता में लिप्त पत्नी और यौन-अनैतिकता की सन्तान ले[b], क्योंकि यह देश यहोवा के पीछे चलना छोड़कर घोर यौन-अनैतिकता करता है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब यहोवा ने पहली बार होशे के द्वारा बात की।” इब्रानी आरम्भ को शीर्षक अथवा कालसूचक उपवाक्य—दोनों रूपों में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘यौन-अनैतिकता में लिप्त पत्नी’ और ‘यौन-अनैतिकता की सन्तान’ के लिए प्रयुक्त इब्रानी शब्द यौन अनैतिकता को व्यापक रूप से, अथवा अधिक विशिष्ट रूप से वेश्यावृत्ति को, सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “क्योंकि देश, यौन-अनैतिकता करते हुए, यौन-अनैतिकता करता है—यहोवा के पीछे से।” यह इब्रानी की प्रबल अभिव्यक्ति है, जो वाचा के प्रति घोर विश्वासघात को दर्शाती है।
    reason: lexical_alternative
