  register: भाषा आधुनिक मानक हिन्दी में, गम्भीर भविष्यद्वाणी-सुलभ लहजे के साथ रखी गई है। ‘जा’ मूल के एकवचन आज्ञार्थक की सीधाई और तीव्रता बनाए रखता है। ‘व्यभिचार’ साधारण पाठक के लिए बोधगम्य है और प्रसंग के यौन तथा वाचा-संबंधी दोनों स्तरों को वहन करता है।
