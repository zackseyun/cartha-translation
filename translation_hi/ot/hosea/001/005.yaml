language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/שָֽׁבַרְתִּי֙ אֶת קֶ֣שֶׁת יִשְׂרָאֵ֔ל בְּ/עֵ֖מֶק יִזְרְעֶֽאל־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/005.yaml
  text: And on that day I will break the bow of Israel in the Valley of Jezreel[a].
translation:
  language: hi
  text: और उस दिन ऐसा होगा कि मैं यिज्रेल की घाटी में इस्राएल का धनुष तोड़ दूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल का धनुष चकनाचूर कर दूँगा”; यहाँ “धनुष” इस्राएल की सैन्य शक्ति को दर्शाता है।
    reason: शाब्दिक विकल्प और लाक्षणिक अर्थ स्पष्ट करना
lexical_decisions:
- source_word: וְהָיָה
  choice: और ... ऐसा होगा कि
  rationale: यह भविष्य में घटने वाली घटना का परिचय देने वाला सूत्र है। हिन्दी में यह रूप भविष्यसूचक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह मानक भविष्यसूचक काल-सूचक अभिव्यक्ति है; ‘उस दिन’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: וְשָׁבַרְתִּי
  choice: मैं ... तोड़ दूँगा
  rationale: שׁבר का मूल अर्थ ‘तोड़ना’ या ‘चकनाचूर करना’ है। ‘तोड़ दूँगा’ यहाँ धनुष के विनाश को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: קֶשֶׁת יִשְׂרָאֵל
  choice: इस्राएल का धनुष
  rationale: मूल पाठ के ठोस सैन्य बिंब को बनाए रखा गया है; यहाँ धनुष इस्राएल की सैन्य शक्ति का भी प्रतिनिधित्व करता है।
- source_word: בְּעֵמֶק
  choice: की घाटी में
  rationale: עֵמֶק का अर्थ ‘घाटी’ है; स्थान-नाम के साथ हिन्दी में यह स्वाभाविक विन्यास है।
- source_word: יִזְרְעֶאל
  choice: यिज्रेल
  rationale: इब्रानी स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है, उसका अर्थानुवाद नहीं किया गया।
theological_decisions:
- issue: ‘धनुष’ को शाब्दिक रूप में रखा जाए या सैन्य शक्ति के रूप में व्याख्यायित किया जाए
  choice: मुख्य पाठ में ‘इस्राएल का धनुष’
  alternative: इस्राएल की सैन्य शक्ति
  rationale: इब्रानी पाठ ठोस सैन्य बिंब का प्रयोग करता है। उसे मुख्य पाठ में बनाए रखने से भविष्यवाणी की आलंकारिक शक्ति और उसका लाक्षणिक अर्थ—दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण भविष्यसूचक शैली अपनाई गई है। मूल इब्रानी का धनुष-बिंब सुरक्षित रखा गया है और उसके लाक्षणिक अर्थ को पादटिप्पणी में बताया गया है।
