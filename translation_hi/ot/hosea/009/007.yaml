source:
  edition: WLC
  text: בָּ֣אוּ יְמֵ֣י הַ/פְּקֻדָּ֗ה בָּ֚אוּ יְמֵ֣י הַ/שִׁלֻּ֔ם יֵדְע֖וּ יִשְׂרָאֵ֑ל אֱוִ֣יל הַ/נָּבִ֗יא מְשֻׁגָּע֙ אִ֣ישׁ הָ/ר֔וּחַ עַ֚ל רֹ֣ב עֲוֺנְ/ךָ֔ וְ/רַבָּ֖ה מַשְׂטֵמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/007.yaml
  text: The days of punishment have come[a]; the days of repayment have come; Israel will know it. The prophet is a fool; the man of the spirit is mad[c][b], because of the greatness of your iniquity and your great hostility.
translation:
  language: hi
  text: दण्ड के दिन आ पहुँचे हैं; प्रतिफल के दिन आ पहुँचे हैं। इस्राएल यह जान लेगा। नबी मूर्ख है, आत्मिक व्यक्ति पागल है[a]—तुम्हारे अधर्म की बहुतायत और घोर शत्रुता के कारण।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पंक्ति को सच्चे नबी के विषय में लोगों की उपहासपूर्ण बात भी समझा जा सकता है: “नबी मूर्ख है, आत्मिक व्यक्ति पागल है।” इब्रानी पाठ इसे स्पष्ट रूप से उद्धरण नहीं बताता। इब्रानी वाक्यांश का शाब्दिक अर्थ “आत्मा का व्यक्ति” है; इसका अर्थ “प्रेरित व्यक्ति” या आत्मिक प्रेरणा का दावा करने वाला व्यक्ति भी हो सकता है।'
    reason: alternative_reading
  - marker: b
    text: या, “तुम्हारे अपराध की बहुतायत और घोर बैर के कारण।” यहाँ ‘शत्रुता’ या ‘बैर’ किसके प्रति है, यह स्पष्ट नहीं कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדָּה
  choice: दण्ड
  rationale: न्याय-संदर्भ में यह शब्द दण्डात्मक निरीक्षण अथवा हिसाब लिए जाने का भाव रखता है; ‘दण्ड’ आधुनिक हिन्दी में इसका न्यायिक बल स्पष्ट करता है।
- source_word: שִׁלֻּם
  choice: बदला चुकाना
  rationale: यह प्रतिफल या किए का फल लौटाए जाने को व्यक्त करता है और दण्ड के दिनों के समानांतर स्वाभाविक हिन्दी देता है।
- source_word: יֵדְעוּ יִשְׂרָאֵל
  choice: इस्राएल यह जान लेगा
  rationale: 'अपूर्ण क्रिया को भविष्यसूचक माना गया है: आने वाले न्याय की वास्तविकता इस्राएल पर प्रकट होगी।'
- source_word: אֱוִיל
  choice: मूर्ख
  rationale: विधेय रूप में प्रयुक्त यह शब्द नबी के विषय में तीखा निन्दात्मक कथन बनाए रखता है।
- source_word: מְשֻׁגָּע
  choice: पागल
  rationale: यह विक्षिप्त या उन्मत्त समझे जाने का प्रबल भाव व्यक्त करता है और साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: אִישׁ הָרוּחַ
  choice: आत्मा का जन
  rationale: यह इब्रानी अभिव्यक्ति के निकट रहते हुए प्रेरित होने का दावा करने वाले व्यक्ति की ओर संकेत कर सकती है; ‘आत्मा’ को किसी विशिष्ट दैवी संदर्भ तक सीमित नहीं किया गया।
- source_word: רֹב עֲוֺנְךָ
  choice: तुम्हारा बहुत बड़ा अधर्म
  rationale: רֹב की प्रचुरता और עָוֹן के नैतिक-धार्मिक भार, दोनों को सहज हिन्दी में रखा गया है।
- source_word: מַשְׂטֵמָה
  choice: गहरा बैर
  rationale: संज्ञा शत्रुता, द्वेष या वैमनस्य का बोध कराती है; ‘गहरा बैर’ तीव्रता रखता है, जबकि उसके लक्ष्य को अनिर्दिष्ट छोड़ता है।
theological_decisions:
- issue: ‘नबी मूर्ख है, आत्मा का जन पागल है’ कथन का वक्ता और लक्ष्य
  choice: मुख्य पाठ में इसे बिना उद्धरण-चिह्न के सीधा कथन रखा गया है।
  alternative: इसे सच्चे नबी के विरुद्ध लोगों की उपहासपूर्ण उक्ति माना जा सकता है।
  rationale: इब्रानी पाठ इसे स्पष्टतः उद्धरण के रूप में चिह्नित नहीं करता; इसलिए मुख्य पाठ किसी एक व्याख्या को आरोपित नहीं करता और वैकल्पिक समझ पादटिप्पणी में दी गई है।
- issue: אִישׁ הָרוּחַ में ‘आत्मा’ का आशय
  choice: ऐसा व्यक्ति जो आत्मिक प्रेरणा से बोलने का दावा करता है, बिना इसे स्पष्टतः पवित्र आत्मा ठहराए
  alternative: परमेश्वर के आत्मा से प्रेरित व्यक्ति
  rationale: संदर्भ निन्दात्मक है और वाक्यांश ‘नबी’ के समानांतर है; मूल पाठ से अधिक विशिष्ट धर्मवैज्ञानिक अर्थ जोड़ना उचित नहीं।
- issue: अन्तिम कारणवाचक खण्ड का सम्बन्ध
  choice: अधर्म और बैर को पूरे निन्दात्मक अथवा न्याय-संदर्भ का कारण बताते हुए रखा गया है।
  alternative: इसे विशेषतः नबियों के प्रति इस्राएल के बैर का कारण अथवा विवरण माना जा सकता है।
  rationale: इब्रानी में सम्बन्ध और बैर का लक्ष्य पूरी तरह स्पष्ट नहीं हैं; अनुवाद उस खुलेपन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘आ पहुँचे हैं’ आसन्न न्याय की प्रबलता व्यक्त करता है। ‘आत्मा का जन’ कुछ असामान्य होते हुए भी मूल रूपक और उसकी धर्मवैज्ञानिक अस्पष्टता बचाता है; स्पष्टीकरण पादटिप्पणी में है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
