  text: אֶפְרַ֛יִם כַּ/אֲשֶׁר רָאִ֥יתִי לְ/צ֖וֹר שְׁתוּלָ֣ה בְ/נָוֶ֑ה וְ/אֶפְרַ֕יִם לְ/הוֹצִ֥יא אֶל הֹרֵ֖ג בָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/013.yaml
  text: Ephraim[a], as I have seen, is planted in a pleasant pasture like Tyre[c][b]; but Ephraim must bring out his children to the killer.
translation:
  language: hi
  text: जैसा मैंने देखा है, एप्रैम सोर के समान एक सुहावने स्थान में रोपा हुआ है[a]; परन्तु एप्रैम को अपने बच्चों[c] को मारने वाले[b] के पास ले जाना होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसा मैंने देखा, एप्रैम सोर के समान एक सुहावने स्थान में रोपा गया था।” हिब्रू में इस तुलना की वाक्य-रचना संक्षिप्त और कुछ अस्पष्ट है।
    reason: alternative_reading
  - marker: b
    text: या, “वध करने वाले के पास”; अथवा भावार्थ, “वध के लिए।” हिब्रू में शाब्दिक रूप से “मारने वाला” कहा गया है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में शाब्दिक रूप से “अपने पुत्रों”; यहाँ सम्भावित सामूहिक अर्थ के कारण “अपने बच्चों” किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: उत्तरी राज्य और गोत्र के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: כַּאֲשֶׁר רָאִיתִי
  choice: जैसा मैंने देखा है
  rationale: भविष्यद्वक्ता के प्रथम-पुरुष अवलोकन को स्पष्ट रखता है और हिब्रू सिद्ध क्रिया का स्वाभाविक हिन्दी रूप देता है।
- source_word: לְצוֹר
  choice: सोर के समान
  rationale: संदर्भ में उपसर्ग ל को तुलनात्मक अर्थ में लिया गया है; इस प्रकार एप्रैम की तुलना सोर से होती है।
- source_word: שְׁתוּלָה
  choice: रोपा हुआ
  rationale: निष्क्रिय रोपण की बागवानी-संबंधी छवि को बनाए रखता है।
- source_word: בְנָוֶה
  choice: एक रमणीय चरागाह में
  rationale: נָוֶה रमणीय निवास, चरागाह या सुहावने स्थान को सूचित कर सकता है; रोपे जाने की छवि के साथ ‘रमणीय चरागाह’ अनुकूल है।
- source_word: וְאֶפְרַיִם
  choice: परन्तु एप्रैम
  rationale: वाव का मूल अर्थ ‘और’ है, किन्तु यहाँ अनुकूल स्थिति से विनाशकारी परिणाम की ओर तीखा विरोधी मोड़ है।
- source_word: לְהוֹצִיא
  choice: ले जाना होगा
  rationale: ל के साथ क्रियार्थक संज्ञा नियत अथवा आसन्न कार्रवाई व्यक्त करती है; हिन्दी में ‘होगा’ दुखद अनिवार्यता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל הֹרֵג
  choice: हत्यारे के पास
  rationale: सक्रिय कृदन्त का व्यक्तिगत कर्ता—मारने वाला—सुरक्षित रहता है; इसे अमूर्त ‘वध के लिए’ नहीं बनाया गया।
- source_word: בָּנָיו
  choice: अपने बच्चों
  rationale: शाब्दिक रूप ‘उसके पुत्र’ है, पर בנים सामूहिक रूप से संतान का भी बोध करा सकता है; यहाँ ‘बच्चों’ से वह सामूहिक अर्थ स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: रोपण की रूपकात्मक छवि को बनाए रखना या उसे समृद्धि के सामान्य कथन में बदलना
  choice: एप्रैम को सोर के समान रमणीय चरागाह में रोपा हुआ बताना
  alternative: ‘मैंने एप्रैम को सोर के समान फलते-फूलते देखा’
  rationale: सुरक्षित रूप से रोपे जाने और बाद में बच्चों को हत्यारे के पास ले जाने का विरोध इस पद की शक्ति का अंग है; रूपक को बनाए रखना व्याख्यात्मक सार थोपने से बचाता है।
- issue: בָּנָיו का अनुवाद ‘पुत्रों’ या ‘बच्चों’ के रूप में करना
  choice: बच्चों
  alternative: पुत्रों
  rationale: हिब्रू रूप विशेष रूप से पुत्रों को सूचित कर सकता है, पर सामान्यतः संतान के लिए भी प्रयुक्त होता है। इस न्याय-संदर्भ में पूरे वंश की हानि प्रमुख है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- issue: אֶל הֹרֵג में व्यक्तिगत मारने वाले को रखना या इसे अमूर्त वध के रूप में व्यक्त करना
  choice: हत्यारे के पास
  alternative: वध के लिए
  rationale: हिब्रू में सक्रिय कृदन्त है, इसलिए व्यक्तिगत कर्ता को मुख्य पाठ में रखा गया है; अमूर्त अर्थ को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। ‘रोपा हुआ’ और ‘रमणीय चरागाह’ मूल की कृषि-संबंधी छवि बनाए रखते हैं। ‘हत्यारा’ सक्रिय व्यक्तिगत कर्ता को स्पष्ट करता है, जबकि पद की संकुचित हिब्रू वाक्य-रचना और प्रमुख शाब्दिक विकल्प पादटिप्पणियों में सुरक्षित हैं।
