id: HOS.9.16
reference: Hosea 9:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֻכָּ֣ה אֶפְרַ֔יִם שָׁרְשָׁ֥/ם יָבֵ֖שׁ פְּרִ֣י בלי יַעֲשׂ֑וּ/ן גַּ֚ם כִּ֣י יֵֽלֵד֔וּ/ן וְ/הֵמַתִּ֖י מַחֲמַדֵּ֥י בִטְנָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/016.yaml
  text: Ephraim is stricken[a]; their root is dried up; they will bear no fruit. Even if they give birth[b], I will put to death the cherished ones of their womb.
translation:
  language: hi
  text: एप्रैम पर प्रहार हुआ है[a]; उनकी जड़ सूख गई है; वे फल नहीं देंगे। भले ही वे बच्चे जनें, मैं उनकी कोख के प्रिय बच्चों[b] को मार डालूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एप्रैम को मारा गया है।”
    reason: निष्क्रिय इब्रानी क्रिया הֻכָּה के अधिक शब्दशः अनुवाद को दर्शाता है।
  - marker: b
    text: “प्रिय बच्चों” का अनुवाद “बहुमूल्य जनों” या “दुलारे बच्चों” भी हो सकता है।
    reason: מַחֲמַדֵּי में प्रिय, दुलारे और बहुमूल्य होने के परस्पर जुड़े अर्थ हैं।
lexical_decisions:
- source_word: הֻכָּה
  choice: पर मार पड़ी है
  rationale: नכה के निष्क्रिय रूप और न्याय के फलस्वरूप आई वर्तमान दशा को व्यक्त करता है। यह आधुनिक हिन्दी में स्वाभाविक है और प्रहार की गंभीरता बनाए रखता है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है; यहाँ यह उत्तरी राज्य के लोगों का सामूहिक नाम है।
- source_word: שָׁרְשָׁם
  choice: उनकी जड़
  rationale: मूल पाठ में सर्वनाम-प्रत्यय बहुवचन है। ‘उनकी’ एप्रैम को एक समुदाय के रूप में दर्शाता है, जबकि ‘जड़’ का एकवचन रूपक सुरक्षित रहता है।
- source_word: יָבֵשׁ
  choice: सूख गई है
  rationale: जड़ की पूर्ण और परिणामकारी दशा को सहज कृषि-भाषा में व्यक्त करता है।
- source_word: פְּרִי בלי יַעֲשׂוּן
  choice: वे कोई फल नहीं उपजाएँगे
  rationale: फल का कृषि-रूपक बनाए रखता है और निषेध सहित भावी परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גַּם כִּי
  choice: चाहे ... भी
  rationale: 'यह रियायती तीव्रता को व्यक्त करता है: संतान-जन्म की संभावना भी घोषित न्याय को नहीं टालेगी।'
- source_word: יֵלֵדוּן
  choice: वे बच्चे जनें
  rationale: वनस्पति के रूपक से मानव संतान-जन्म की ओर स्पष्ट परिवर्तन करता है और ‘कोख’ के अगले उल्लेख से स्वाभाविक रूप से जुड़ता है।
- source_word: וְהֵמַתִּי
  choice: मैं ... मार डालूँगा
  rationale: मूत के हिफ़ील, प्रथम पुरुष एकवचन रूप में निहित प्रत्यक्ष दैवी कर्तृत्व को स्पष्ट और गंभीर हिन्दी में सुरक्षित रखता है।
- source_word: מַחֲמַדֵּי בִטְנָם
  choice: उनकी कोख के प्यारे बच्चों
  rationale: מַחֲמַדֵּי में प्रिय, बहुमूल्य या दुलारे होने का भाव है; प्रसंग में आशय बच्चों से है। ‘कोख’ בטן के प्रसव-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: न्याय में परमेश्वर का प्रत्यक्ष कर्तृत्व
  choice: 'प्रथम पुरुष का कथन बनाए रखा गया: ‘मैं ... मार डालूँगा’'
  alternative: इसे अप्रत्यक्ष परिणाम बनाना, जैसे ‘वे मर जाएँगे’
  rationale: इब्रानी पाठ में प्रथम पुरुष एकवचन हिफ़ील रूप स्पष्ट रूप से वक्ता को मृत्यु का कर्ता बताता है; अनुवाद में इस कठिन धार्मिक तनाव को नरम नहीं किया गया।
- issue: एप्रैम का व्याकरणिक और सामूहिक स्वरूप
  choice: नाम एकवचन रखा, पर आगे बहुवचन ‘उनकी/वे’ प्रयुक्त किया
  alternative: पूरे वाक्य में एकवचन ‘उसकी/वह’ रखना
  rationale: אֶפְרַיִם रूपतः एक नाम है, पर मूल पाठ का बहुवचन प्रत्यय और क्रियाएँ उसे लोगों के सामूहिक नाम के रूप में प्रस्तुत करती हैं।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यवाणी-संबंधी न्याय के अनुरूप रखी गई है। कृषि-रूपक ‘जड़—फल’ को सुरक्षित रखा गया है और फिर संतान-जन्म तथा कोख की मानवीय छवि की ओर मूल पाठ के तीखे संक्रमण को बनाए रखा गया है।
