  text: Threshing floor and winepress will not feed them[a], and new wine will fail her.
translation:
  language: hi
  text: खलिहान और दाख निचोड़ने का कुंड उन्हें भोजन नहीं देंगे, और नया दाखरस उसे निराश करेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नया दाखरस उसके लिए विफल होगा,” अथवा “नया दाखरस उसके लिए झूठा सिद्ध होगा।” इब्रानी क्रिया का अर्थ यह भी हो सकता है कि जिससे आशा थी, वह अपेक्षा पूरी न करे।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: खलिहान
  rationale: यह शब्द अनाज दाँवने के स्थान को दर्शाता है और यहाँ उपलक्षण के रूप में अनाज की उपज का बोध कराता है। ठोस कृषि-बिंब बनाए रखने के लिए ‘खलिहान’ चुना गया है।
- source_word: יֶקֶב
  choice: दाखरस का कुंड
  rationale: यह अंगूर दबाने अथवा उससे निकला रस इकट्ठा करने के स्थान/कुंड को दर्शाता है। आधुनिक हिन्दी में स्पष्टता और कृषि-बिंब दोनों बनाए रखने के लिए यह अभिव्यक्ति चुनी गई है।
- source_word: יִרְעֵם
  choice: उन्हें भोजन नहीं देंगे
  rationale: רעה का मूल अर्थ चराना या खिलाना है। निर्जीव कर्ताओं के साथ यहाँ आशय जीविका देने का है; ‘भोजन नहीं देंगे’ रूपक को स्वाभाविक हिन्दी में रखता है। बहुवचन क्रिया संयुक्त कर्ताओं ‘खलिहान और ... कुंड’ के अनुरूप है।
- source_word: תִירוֹשׁ
  choice: नया दाखरस
  rationale: यह सामान्यतः नई या ताज़ी दाखमधु-उपज को दर्शाता है। ‘नया दाखरस’ कृषि और वाचा-संबंधी उपज के बिंब को सुरक्षित रखता है।
- source_word: יְכַחֶשׁ
  choice: साथ नहीं देगा
  rationale: כחש यहाँ अपेक्षा के अनुसार फल न देने, विफल कर देने या झूठा सिद्ध होने का भाव रखता है। ‘साथ नहीं देगा’ हिन्दी में उपज द्वारा अपेक्षित सहारा न मिलने का स्वाभाविक भाव देता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: בָּהּ
  choice: उसका
  rationale: प्रत्यय स्त्रीलिंग एकवचन है। संदर्भ में यह स्त्री के रूप में व्यक्त इस्राएल/एप्रैम की ओर संकेत करता है; ‘उसका’ इस व्यक्तिकरण को बनाए रखता है।
theological_decisions:
- issue: בָּהּ के स्त्रीलिंग एकवचन प्रत्यय का संदर्भ
  choice: इसे स्त्री के रूप में व्यक्त इस्राएल/एप्रैम के लिए ‘उसका’ के रूप में रखा गया है।
  alternative: इसे सामूहिक अर्थ में ‘उनका’ किया जाए, या भूमि का संदर्भ माना जाए।
  rationale: होशे में राष्ट्र का स्त्रीलिंग व्यक्तिकरण बार-बार मिलता है। स्त्रीलिंग एकवचन को बनाए रखना व्याकरणिक और साहित्यिक तनाव सुरक्षित रखता है तथा अनावश्यक व्याख्यात्मक समतलीकरण से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। कृषि-संबंधी ठोस बिंब सुरक्षित रखे गए हैं और राष्ट्र के स्त्रीलिंग व्यक्तिकरण को नहीं मिटाया गया है।
