id: HOS.9.9
reference: Hosea 9:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֶעְמִֽיקוּ שִׁחֵ֖תוּ כִּ/ימֵ֣י הַ/גִּבְעָ֑ה יִזְכּ֣וֹר עֲוֺנָ֔/ם יִפְק֖וֹד חַטֹּאותָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/009.yaml
  text: They have gone deep into corruption[a], as in the days of Gibeah; he will remember their iniquity[b]; he will punish their sins.
translation:
  language: hi
  text: वे गहराई तक भ्रष्ट हो गए हैं[a], गिबा के दिनों की तरह[b]; वह उनके अधर्म को स्मरण करेगा और उनके पापों का दण्ड देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शब्दशः, “वे गहराई तक गए हैं; वे भ्रष्ट हो गए हैं।” इब्रानी वाक्यांश संक्षिप्त और मुहावरेदार है।
    reason: lexical_alternative
  - marker: b
    text: “गिबा के दिन” न्यायियों 19–21 में वर्णित गिबा के कुख्यात अत्याचार की ओर संकेत करते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: הֶעְמִיקוּ שִׁחֵתוּ
  choice: भ्रष्टता में बहुत गहरे उतर गए हैं
  rationale: 'इब्रानी में दो क्रियाओं का संक्षिप्त और मुहावरेदार मेल है: הֶעְמִיקוּ गहराई में जाने की छवि रखता है और שִׁחֵתוּ भ्रष्ट करने या भ्रष्ट आचरण का भाव देता है। यह अनुवाद दोनों तत्वों को स्वाभाविक हिन्दी में बनाए रखता है।'
- source_word: כִּימֵי הַגִּבְעָה
  choice: जैसा गिबा के दिनों में हुआ था
  rationale: כִּימֵי ऐतिहासिक तुलना व्यक्त करता है। हिन्दी में ‘जैसा ... दिनों में हुआ था’ उस तुलना को स्पष्ट और सहज बनाता है; הַגִּבְעָה स्थान-नाम ‘गिबा’ है।
- source_word: יִזְכּוֹר עֲוֺנָם
  choice: वह उनके अधर्म को स्मरण करेगा
  rationale: יִזְכּוֹר अपूर्ण क्रिया का भावी न्याय-संदर्भ में ‘स्मरण करेगा’ है। עָוֹן यहाँ नैतिक अपराध अर्थात ‘अधर्म’ है, क्योंकि अगले खंड में दण्ड अलग से व्यक्त है।
- source_word: יִפְקֹד חַטֹּאותָם
  choice: उनके पापों का दण्ड देगा
  rationale: न्याय के संदर्भ में פקד किसी को उसके अपराध के लिए दण्डित करने या लेखा लेने का अर्थ देता है। חַטֹּאותָם समानांतर वाक्यांश में ‘उनके पाप’ है, न कि ‘पापबलि’।
theological_decisions:
- issue: न्याय करने वाली क्रियाओं का अव्यक्त कर्ता
  choice: हिन्दी में ‘वह’ रखा गया है; संदर्भ में यह परमेश्वर की ओर संकेत करता है।
  alternative: कर्ता को स्पष्ट रूप से ‘परमेश्वर’ कहना, या अव्यक्त रखना।
  rationale: इब्रानी पाठ में दोनों क्रियाएँ पुल्लिंग एकवचन हैं, पर कर्ता का नाम नहीं दिया गया। ‘वह’ मूल की अव्यक्तता बनाए रखते हुए होशे के संदर्भानुसार अर्थ समझने देता है।
- issue: עָוֹן का अर्थ
  choice: अधर्म
  alternative: दोष या दोष का दण्ड
  rationale: यहाँ अगली क्रिया दण्ड को अलग से बताती है, इसलिए इस पद में עָוֹן को अपराध के नैतिक अर्थ में लेना समानांतरता और तनाव दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘बहुत गहरे उतर गए’ मूल रूपक को बचाता है; ‘अधर्म’, ‘स्मरण’ और ‘दण्ड’ सामान्य बाइबिलीय हिन्दी में समझ आने वाले शब्द हैं।
