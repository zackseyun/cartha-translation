  to: वे गहराई तक भ्रष्ट हो गए हैं[a], गिबा के दिनों की तरह[b]; वह उनके अधर्म को स्मरण करेगा और उनके पापों का दण्ड देगा।
  rationale: The revision removes an added event verb from the Gibeah comparison, improves the idiomatic Hindi of the opening clause, and rewrites the lexical note so that it explains the Hebrew’s compressed two-verb expression naturally and without implying an object not supplied by the text. The implicit subject and the distinction between wrongdoing and its punishment are retained.
