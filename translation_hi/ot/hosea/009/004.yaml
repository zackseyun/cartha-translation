source:
  edition: WLC
  text: לֹא יִסְּכ֨וּ לַ/יהוָ֥ה יַיִן֮ וְ/לֹ֣א יֶֽעֶרְבוּ ל/וֹ֒ זִבְחֵי/הֶ֗ם כְּ/לֶ֤חֶם אוֹנִים֙ לָ/הֶ֔ם כָּל אֹכְלָ֖י/ו יִטַמָּ֑אוּ כִּֽי לַחְמָ֣/ם לְ/נַפְשָׁ֔/ם לֹ֥א יָב֖וֹא בֵּ֥ית יְהוָֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/004.yaml
  text: They will not pour out wine offerings to Yahweh[a], and their sacrifices will not please him. They will be like mourners’ bread to them; all who eat it will become unclean. For their bread will be for themselves alone[b]; it will not enter the house of Yahweh.
translation:
  language: hi
  text: वे याहवे के लिए दाखरस की पेय-भेंट नहीं उँडेलेंगे, और उनके बलिदान उसे स्वीकार्य नहीं होंगे। वे उनके लिए शोक करनेवालों की रोटी जैसे होंगे[a]; उसे खानेवाला हर व्यक्ति अशुद्ध हो जाएगा। क्योंकि उनकी रोटी केवल उनके अपने उपयोग के लिए होगी[b]; वह याहवे के भवन में नहीं आएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “शोक करनेवालों की रोटी।” यह संभवतः मृत्यु और शोक से जुड़ा भोजन था, जिसे खाने से व्यक्ति अनुष्ठानिक रूप से अशुद्ध हो जाता था।
    reason: lexical_alternative
  - marker: b
    text: या, “उनकी अपनी भूख के लिए” अथवा “स्वयं उनके लिए।” आशय यह है कि यह रोटी उनके निजी उपयोग के लिए होगी, याहवे के भवन में अर्पित करने योग्य नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְּכוּ ... יַיִן
  choice: दाखमधु का अर्घ नहीं उँडेलेंगे
  rationale: נסך और יין का संयुक्त प्रयोग बलि-संबंधी दाखमधु-अर्घ उँडेलने को सूचित करता है। ‘अर्घ’ उपासना का भाव स्पष्ट करता है, जबकि ‘उँडेलेंगे’ मूल क्रिया को बनाए रखता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל अर्पण पानेवाले को दर्शाता है और יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: יֶעֶרְבוּ לוֹ
  choice: उसे स्वीकार्य नहीं होंगे
  rationale: ערב यहाँ परमेश्वर को भाने या उसके द्वारा स्वीकार किए जाने का भाव रखता है। बलिदान के प्रसंग में ‘स्वीकार्य’ सहज और सटीक है।
- source_word: זִבְחֵיהֶם
  choice: उनके बलिदान
  rationale: זבח बलि के रूप में वध किए गए अर्पणों का सामान्य शब्द है; आधुनिक हिन्दी में ‘बलिदान’ स्पष्ट है।
- source_word: כְּלֶחֶם אוֹנִים
  choice: शोक मनानेवालों की रोटी के समान
  rationale: यह पदबंध मृत्यु और शोक से जुड़ी ऐसी रोटी की ओर संकेत करता है जो धार्मिक रीति से अशुद्ध मानी जाती थी। अनुवाद मूल उपमा को बनाए रखता है।
- source_word: יִטַמָּאוּ
  choice: अशुद्ध हो जाएगा
  rationale: טמא यहाँ नैतिक भ्रष्टता के बजाय धार्मिक/अनुष्ठानिक अशुद्धता को व्यक्त करता है।
- source_word: לַחְמָם לְנַפְשָׁם
  choice: उनकी रोटी केवल उनके अपने खाने के लिए होगी
  rationale: נפש का अर्थ यहाँ ‘स्वयं’ या ‘भूख’ हो सकता है। प्रसंग का आशय यह है कि भोजन केवल निजी उपभोग के लिए है, पवित्र अर्पण के लिए नहीं।
- source_word: לֹא יָבוֹא בֵּית יְהוָה
  choice: वह याहवे के भवन में नहीं आएगी
  rationale: एकवचन क्रिया का संबंध ‘रोटी’ से है और यह उसके उपासना-स्थान में प्रवेश या अर्पण के अयोग्य होने को दर्शाती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम सीधे आया है; उसे उपाधि में बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- issue: ‘शोक मनानेवालों की रोटी’ की अशुद्धता
  choice: मृत्यु और शोक से जुड़ी अनुष्ठानिक अशुद्धता
  alternative: सामान्य दुःख या नैतिक रूप से दूषित भोजन
  rationale: बलिदान, अशुद्ध होने और याहवे के भवन में प्रवेश न करने का संदर्भ धार्मिक/अनुष्ठानिक अशुद्धता की ओर संकेत करता है।
- issue: זִבְחֵיהֶם और כְּלֶחֶם אוֹנִים का वाक्य-संबंध
  choice: उनके बलिदान शोक मनानेवालों की रोटी के समान होंगे
  alternative: '‘वे अर्घ नहीं चढ़ाएँगे’; अलग वाक्य: ‘उनके लिए शोक की रोटी जैसी होगी’'
  rationale: निकटतम व्यक्त कर्ता ‘उनके बलिदान’ है; उसे उपमा का कर्ता रखने से हिब्रू वाक्य-संरचना और अर्थ-संबंध सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अर्घ’ उपासना-संबंधी अर्थ को संक्षेप में व्यक्त करता है; ‘अशुद्ध’ पुरोहितीय/अनुष्ठानिक शब्दावली को सुरक्षित रखता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न अपने संबंधित पदबंधों पर लगाए गए हैं।
