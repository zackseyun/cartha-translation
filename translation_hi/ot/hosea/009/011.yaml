  terminology: एप्रैम, महिमा, पक्षी के समान, जन्म, and गर्भधारण are suitable. The note correctly retains the metaphorical breadth of ‘महिमा’ and does not force its referent. The revised note uses ‘कोख’ consistently with the main text.
