id: HOS.9.11
reference: Hosea 9:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֶפְרַ֕יִם כָּ/ע֖וֹף יִתְעוֹפֵ֣ף כְּבוֹדָ֑/ם מִ/לֵּדָ֥ה וּ/מִ/בֶּ֖טֶן וּ/מֵ/הֵרָיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/011.yaml
  text: Ephraim—their glory will fly away like a bird—from birth[a], from the womb[b], and from conception.
translation:
  language: hi
  text: एप्रैम—उनकी महिमा[a] पक्षी के समान उड़ जाएगी—जन्म से, कोख से और गर्भधारण से।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनका सम्मान” अथवा “उनका वैभव।” इस प्रसंग में “महिमा” से विशेष रूप से संतान और जनन-क्षमता का संकेत मिलता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में शाब्दिक रूप से: “जन्म से, कोख से और गर्भधारण से।” यह तीनहरा कथन संतानोत्पत्ति की प्रत्येक अवस्था में होने वाली हानि को व्यक्त करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: उत्तरी राज्य अथवा गोत्र के लिए प्रयुक्त व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: כָּעוֹף
  choice: पक्षी के समान
  rationale: כ उपमा सूचित करता है और עוֹף को इस काव्यात्मक प्रसंग में स्वाभाविक रूप से ‘पक्षी’ कहा गया है।
- source_word: יִתְעוֹפֵף
  choice: उड़ जाएगी
  rationale: क्रिया उड़कर चले जाने और इस प्रकार लुप्त हो जाने, दोनों का भाव व्यक्त करती है। ‘महिमा’ हिन्दी में स्त्रीलिंग होने के कारण क्रिया भी स्त्रीलिंग रखी गई है।
- source_word: כְּבוֹדָם
  choice: उनकी महिमा
  rationale: כָּבוֹד का अर्थ महिमा, सम्मान या वैभव हो सकता है। ‘महिमा’ मूल रूपक को बनाए रखती है; प्रसंग संतान और जनन-क्षमता की ओर संकेत करता है, पर मुख्य पाठ में उसे स्पष्ट रूप से जोड़कर अर्थ सीमित नहीं किया गया।
- source_word: מִלֵּדָה
  choice: जन्म से
  rationale: לֵדָה जन्म अथवा प्रसव को सूचित करता है। संक्षिप्त रूप मूल की काव्यात्मक त्रिपदी और वंचित हो जाने का भाव बनाए रखता है।
- source_word: וּמִבֶּטֶן
  choice: गर्भ से
  rationale: בֶּטֶן का मूल अर्थ पेट भी हो सकता है, पर जनन-क्रम के इस प्रसंग में ‘गर्भ’ उपयुक्त है।
- source_word: וּמֵהֵרָיוֹן
  choice: और गर्भधारण से
  rationale: הֵרָיוֹן गर्भधारण अथवा गर्भावस्था का बोध कराता है। ‘गर्भधारण’ जन्म से पीछे आरम्भ तक लौटते क्रम को अधिक स्पष्ट रखता है।
theological_decisions:
- issue: ‘उनकी महिमा’ का अभिप्राय
  choice: मुख्य पाठ में ‘महिमा’ का रूपक सुरक्षित रखा गया है; प्रसंग में वह विशेष रूप से संतान, जनन-क्षमता और राष्ट्रीय जीवन की ओर संकेत करता है।
  alternative: इसे सीधे ‘उनकी संतान’ अथवा व्यापक रूप से ‘उनका राष्ट्रीय वैभव’ कहना।
  rationale: पद स्वयं रूपक को स्पष्ट नहीं करता, यद्यपि आसपास का प्रसंग संतान और उर्वरता को प्रमुख बनाता है। इसलिए मुख्य पाठ में अर्थ को आवश्यकता से अधिक निश्चित नहीं किया गया।
- issue: तीन ‘से’ पदबंधों का बल
  choice: इनसे गर्भधारण, गर्भ और जन्म—संतानोत्पत्ति की हर अवस्था में हानि या अभाव व्यक्त होता है।
  alternative: इन्हें केवल तीन असंबद्ध स्रोतों की सूची मानना।
  rationale: इब्रानी पाठ जन्म से पीछे गर्भ और गर्भधारण तक लौटता है। उसी क्रम और काव्यात्मक तनाव को हिन्दी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। दीर्घ विराम मूल वाक्य की आकस्मिक भविष्यवाणी-सदृश तीव्रता को उभारते हैं, जबकि ‘पक्षी के समान’ सामान्य पाठक के लिए स्पष्ट उपमा है।
