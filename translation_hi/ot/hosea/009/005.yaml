lexical_decisions:
- source_word: מַה
  choice: क्या
  rationale: यह प्रश्नवाचक सर्वनाम अलंकारिक प्रश्न आरम्भ करता है; हिन्दी में ‘क्या’ इसका सीधा और स्वाभाविक रूप है।
- source_word: תַּעֲשׂוּ
  choice: तुम क्या करोगे
  rationale: यह עשה का काल अपूर्ण, द्वितीय पुरुष बहुवचन रूप है। प्रसंग में निर्वासन अथवा न्याय की भावी स्थिति में लोगों की असमर्थता पर प्रश्न है, इसलिए भविष्यकाल स्वाभाविक है।
- source_word: לְיוֹם
  choice: दिन पर
  rationale: יוֹם के साथ ל यहाँ कालवाचक अर्थ रखता है; हिन्दी में ‘दिन पर’ उस समय-संदर्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מוֹעֵד
  choice: ठहराया हुआ पवित्र दिन
  rationale: מוֹעֵד ठहराए हुए समय, पवित्र अवसर या सभा को सूचित कर सकता है। ‘ठहराया हुआ पवित्र दिन’ समय और उपासना—दोनों भावों को बनाए रखता है तथा अगले חַג से इसे अलग रखता है।
- source_word: וּלְיוֹם
  choice: और ... के दिन
  rationale: संयोजक ו और कालवाचक ל को हिन्दी समानांतर रचना में स्पष्ट तथा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: חַג
  choice: पर्व
  rationale: חַג धार्मिक उत्सव, और कभी विशेष रूप से तीर्थ-पर्व, का बोध कराता है। ‘पर्व’ आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और व्यापक रूप से बोधगम्य है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल-परंपरा में प्रचलित रूप ‘यहोवा’ मूल पाठ के व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे अथवा प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में परिचित लिप्यंतरण ‘यहोवा’ नाम को नाम के रूप में बनाए रखता है; ‘प्रभु’ करने से वह उपाधि बन जाता।
- issue: מוֹעֵד और חַג के बीच संबंध
  choice: दोनों को क्रमशः ‘ठहराया हुआ पवित्र दिन’ और ‘पर्व’ कहकर अलग रखना
  alternative: दोनों के लिए सामान्य ‘पर्व/त्योहार’ भाषा प्रयोग करना
  rationale: ये निकटार्थी किंतु समानार्थी नहीं हैं। भेद बनाए रखने से इब्रानी समानांतरता और पवित्र अवसरों की दोहरी अभिव्यक्ति सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और अलंकारिक प्रश्न की तीक्ष्णता बनाए रखने वाला पाठ। ‘ठहराए हुए पवित्र दिन’ सामान्य पाठक के लिए अर्थ स्पष्ट करता है, जबकि पादटिप्पणी मूल शब्द की वास्तविक अर्थ-व्याप्ति सुरक्षित रखती है।
