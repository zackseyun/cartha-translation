  text: What will you do on the day of appointed assembly[a], and on the day of the feast of Yahweh?
translation:
  language: hi
  text: नियत सभा[a] के दिन और याहवे के पर्व के दिन तुम क्या करोगे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नियत समय” अथवा “उत्सव।” इब्रानी शब्द מוֹעֵד व्यापक अर्थ में किसी नियत समय को, अथवा विशेष अर्थ में किसी पवित्र सभा या उत्सव को सूचित कर सकता है।
