source:
  edition: WLC
  text: תֵּן לָ/הֶ֥ם יְהוָ֖ה מַה תִּתֵּ֑ן תֵּן לָ/הֶם֙ רֶ֣חֶם מַשְׁכִּ֔יל וְ/שָׁדַ֖יִם צֹמְקִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/014.yaml
  text: Give them[a], O Yahweh—what will you give? Give them a miscarrying womb and dry breasts.
translation:
  language: hi
  text: हे याहवे, उन्हें दे—तू क्या देगा? उन्हें गर्भ गिराने वाली कोख[a] और सूखे स्तन दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संतान से वंचित करने वाली कोख।” इब्रानी कृदंत का अर्थ बच्चों की हानि कराने वाली भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן
  choice: दे
  rationale: נתן के आज्ञार्थक रूप को सीधी, प्रबल प्रार्थना के रूप में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: מַה תִּתֵּן
  choice: तू क्या देगा?
  rationale: प्रश्नवाचक מַה और अपूर्ण क्रिया का स्वाभाविक प्रश्नात्मक अर्थ रखा गया है; यह वक्ता की व्याकुल झिझक को भी व्यक्त करता है।
- source_word: רֶחֶם
  choice: कोख
  rationale: ‘कोख’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा प्रजनन-संबंधी बिंब को बनाए रखता है।
- source_word: מַשְׁכִּיל
  choice: गर्भ गिरा देनेवाली
  rationale: שכל के कारक कृदंत का प्रसंगानुकूल अर्थ ऐसी कोख है जो संतान को जन्म तक न पहुँचा सके; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: שָׁדַיִם
  choice: स्तन
  rationale: मूल के ठोस शारीरिक शब्द और न्याय के तीखे बिंब को यथावत रखा गया है।
- source_word: צֹמְקִים
  choice: सूखे हुए
  rationale: यह दूध या पोषण से रहित स्तनों का बिंब संक्षेप में व्यक्त करता है; ‘सिकुड़े हुए’ भी संभव है, पर उससे दृश्य रूप पर अधिक बल पड़ता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: पद में निजी दिव्य नाम सीधे आया है; इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया, बल्कि स्रोत के निकट ‘याहवे’ रूप में लिप्यंतरित किया गया है।
- issue: מַשְׁכִּיל में प्रजनन-संबंधी न्याय का आशय
  choice: गर्भ गिरा देनेवाली कोख
  alternative: संतान-विहीन करनेवाली कोख
  rationale: तात्कालिक संदर्भ में गर्भधारण और स्तनपान दोनों पर न्याय का चित्र है, इसलिए गर्भपात का अर्थ मुख्य पाठ में रखा गया; फिर भी संतान खोने या संतान-विहीन होने का व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सीधी और प्रार्थना-जैसी रखी गई है। ‘हे’ संबोधन की गंभीरता बनाए रखता है, जबकि ‘तू’ मूल के एकवचन सीधे संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
