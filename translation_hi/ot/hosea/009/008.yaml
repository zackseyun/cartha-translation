reference: Hosea 9:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: צֹפֶ֥ה אֶפְרַ֖יִם עִם אֱלֹהָ֑/י נָבִ֞יא פַּ֤ח יָקוֹשׁ֙ עַל כָּל דְּרָכָ֔י/ו מַשְׂטֵמָ֖ה בְּ/בֵ֥ית אֱלֹהָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/008.yaml
  text: Ephraim’s watchman is with my God[a]; the prophet is a fowler’s snare on all his ways[b], and hostility is in the house of his God.
translation:
  language: hi
  text: एप्रैम का पहरेदार मेरे परमेश्वर के साथ है[a]; भविष्यद्वक्ता उसके सभी मार्गों पर चिड़ीमार का फंदा है, और उसके परमेश्वर के भवन में शत्रुता[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एप्रैम मेरे परमेश्वर के साथ एक पहरेदार है; भविष्यद्वक्ता उसके सभी मार्गों पर चिड़ीमार का फंदा है।” इब्रानी वाक्य-विन्यास कठिन है; कुछ लोग पहले खंड को सकारात्मक अर्थ में लेते हैं, जिसके बाद पद दोषारोपण की ओर मुड़ता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी शब्द का अर्थ “घृणा” या “वैर” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹפֶה
  choice: पहरेदार
  rationale: यह कृदन्त ऐसे व्यक्ति को दर्शाता है जो निगरानी रखता है। ‘पहरेदार’ भविष्यद्वक्ता से जुड़ी चौकसी की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: गोत्र और उत्तरी राज्य के नाम का मानक हिन्दी लिप्यंतरण।
- source_word: עִם אֱלֹהָי
  choice: मेरे परमेश्वर के साथ
  rationale: עִם का सामान्य अर्थ ‘साथ’ है और אֱלֹהָי में प्रथम पुरुष एकवचन प्रत्यय को ‘मेरे’ के रूप में सुरक्षित रखा गया है।
- source_word: נָבִיא
  choice: भविष्यद्वक्ता
  rationale: एकवचन संज्ञा को प्रसंग में प्रतिनिधिक और निश्चित व्यक्ति के रूप में रखा गया है; हिन्दी में अलग निश्चित उपपद आवश्यक नहीं है।
- source_word: פַּח יָקוֹשׁ
  choice: चिड़ीमार का फंदा
  rationale: दोनों जाल-संबंधी शब्द मिलकर पक्षी पकड़ने वाले के फंदे की छवि देते हैं; यह हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: עַל כָּל דְּרָכָיו
  choice: उसके सभी मार्गों पर
  rationale: पूर्वसर्ग, बहुवचन ‘मार्ग’ और तृतीय पुरुष एकवचन प्रत्यय को निकटता से सुरक्षित रखा गया है; ‘मार्ग’ आचरण और जीवन-क्रम दोनों का रूपक हो सकता है।
- source_word: מַשְׂטֵמָה
  choice: शत्रुता
  rationale: यह शब्द घृणा, वैर और सक्रिय विरोध के अर्थ-क्षेत्र को समेटता है; ‘शत्रुता’ बिना अनावश्यक संकीर्णता के इसे व्यक्त करता है।
- source_word: בְּבֵית אֱלֹהָיו
  choice: उसके परमेश्वर के भवन में
  rationale: ‘उसके’ प्रत्यय और ‘भवन’ को बनाए रखा गया है; इसे ‘मन्दिर’ कहकर अर्थ को आवश्यकता से अधिक विशिष्ट नहीं किया गया।
theological_decisions:
- issue: ‘मेरे परमेश्वर’ और ‘उसके परमेश्वर’ के बीच वक्ता-दृष्टिकोण का परिवर्तन
  choice: दोनों भिन्न सर्वनामों को ज्यों का त्यों बनाए रखा गया।
  alternative: दोनों को केवल ‘परमेश्वर’ कहकर समतल करना, अथवा एक ही दृष्टिकोण में सामंजस्य बैठाना।
  rationale: मसोरेटिक पाठ में सर्वनामों का उल्लेखनीय परिवर्तन है। इसे सुरक्षित रखना पाठ की सम्भावित दूरी या तनाव को बिना सुलझाए प्रस्तुत करता है।
- issue: ‘भविष्यद्वक्ता’ का संकेत और पहले खंड की वाक्य-संरचना
  choice: मुख्य पाठ में भविष्यद्वक्ता को एप्रैम से जुड़े दोषारोपित पहरेदार के रूप में समझा गया है।
  alternative: 'पहले खंड को सकारात्मक रूप में पढ़ना: ‘एप्रैम मेरे परमेश्वर के साथ एक पहरेदार है,’ और फिर भविष्यद्वक्ता पर अलग आरोप समझना।'
  rationale: निकटवर्ती प्रसंग निन्दात्मक है, पर इब्रानी वाक्य-विन्यास कठिन है; इसलिए वैकल्पिक सकारात्मक आरम्भ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। ‘पहरेदार,’ ‘मार्ग,’ ‘फंदा,’ और ‘भवन’ से मूल रूपकों को बनाए रखा गया है। कठिन इब्रानी वाक्य-संरचना को मुख्य पाठ में पठनीय बनाया गया है, जबकि वास्तविक वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
