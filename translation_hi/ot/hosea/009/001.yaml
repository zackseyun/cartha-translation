  yaml_path: translation/ot/hosea/009/001.yaml
  text: Do not rejoice[a], Israel, with exultation like the peoples, for you have played the prostitute away from your God[b]; you have loved a prostitute’s payment on every threshing floor of grain.
translation:
  language: hi
  text: हे इस्राएल, अन्य जातियों की तरह हर्षोल्लास मत कर[a], क्योंकि तूने अपने परमेश्वर को छोड़कर वेश्यावृत्ति की है; तूने अनाज के हर खलिहान पर वेश्यावृत्ति की कमाई से प्रेम किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूसरी जातियों के समान आनन्द से मत उछल।” इब्रानी पदबंध संक्षिप्त है और उसका एक से अधिक स्वाभाविक ढंग से अनुवाद किया जा सकता है।
    reason: lexical_alternative
