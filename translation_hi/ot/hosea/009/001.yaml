  choice: अन्य जातियों की तरह हर्षोल्लास
  rationale: इब्रानी पदबंध संक्षिप्त और व्याकरण की दृष्टि से कठिन है। इसे निषेध के साथ क्रिया-विशेषणात्मक रूप में जोड़ने से यह भाव आता है कि इस्राएल दूसरे लोगों की तरह उत्सव न मनाए; ‘जातियाँ’ עַמִּים का स्वाभाविक सन्दर्भगत अनुवाद है।
- source_word: זָנִיתָ מֵעַל אֱלֹהֶיךָ
  choice: तू वेश्या बनकर अपने परमेश्वर से फिर गया है
  rationale: זנה होशे में वेश्यावृत्ति के बिम्ब द्वारा वाचा के प्रति विश्वासघात बताता है, और מֵעַל परमेश्वर के प्रति निष्ठा से दूर होने का संकेत देता है। यह अनुवाद बिम्ब और सम्बन्ध-विच्छेद दोनों को बनाए रखता है।
- source_word: אֶתְנָן
  choice: वेश्यावृत्ति की कमाई
  rationale: यह शब्द वेश्या को मिलने वाले भुगतान या मज़दूरी को सूचित करता है। ‘वेश्यावृत्ति की कमाई’ आधुनिक हिन्दी में स्पष्ट है और मूल ठोस बिम्ब को सुरक्षित रखता है।
- source_word: עַל כָּל גָּרְנוֹת דָּגָן
  choice: अनाज के हर खलिहान पर
  rationale: גֹּרֶן अनाज दाँवने का खलिहान है और דָּגָן को ‘अनाज’ के रूप में स्पष्ट रखा गया है। ‘पर’ עַל का सीधा स्थानवाचक बल बनाए रखता है।
