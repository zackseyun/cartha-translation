  choice: मुख्य पाठ में वेश्यावृत्ति का रूपक बनाए रखा गया है
  alternative: ‘तू अपने परमेश्वर के प्रति विश्वासघाती हुआ है’ जैसे अमूर्त शब्दों में अनुवाद करना
  rationale: होशे जानबूझकर इस्राएल के वाचा-त्याग को यौन-अविश्वास और वेश्यावृत्ति के बिम्ब से व्यक्त करता है। रूपक को बनाए रखना भविष्यसूचक आरोप की तीव्रता और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सीधा भविष्यसूचक स्वर रखा गया है। इस्राएल को एक सामूहिक व्यक्तित्व मानकर मूल इब्रानी के पुल्लिंग एकवचन के अनुरूप ‘तू’ का प्रयोग किया गया है। ‘वेश्या’ और ‘वेश्यावृत्ति की कमाई’ मूल के कठोर रूपक को बिना पुरातन या अनावश्यक रूप से व्याख्यात्मक भाषा के बनाए रखते हैं।
