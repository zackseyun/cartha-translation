base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/010.yaml
  text: Like grapes in the wilderness I found Israel[a]; like the first-ripe fruit on the fig tree in its first season I saw your fathers. They came to Baal-peor and consecrated themselves to shame[d][c][b], and they became detestable like the thing they loved.
translation:
  language: hi
  text: “जैसे निर्जन प्रदेश में अंगूर मिलते हैं, वैसे ही मैंने इस्राएल को पाया; जैसे अंजीर के पेड़ पर आरम्भ में लगा पहला पका फल होता है, वैसे ही मैंने तुम्हारे पुरखों को देखा। वे बाल-पोर के पास गए[d] और उन्होंने अपने आप को लज्जा[a] को समर्पित कर दिया; वे उसी के समान घिनौने हो गए जिससे उन्होंने प्रेम किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘लज्जा’ सम्भवतः बाल-पोर से जुड़ी मूर्ति या देवता के लिए तिरस्कारपूर्ण संकेत है।
    reason: alternative_reading
  - marker: d
    text: गिनती 25:1–5 देखें, जहाँ इस्राएल बाल-पोर की उपासना में सम्मिलित हुआ।
    reason: cross_reference
lexical_decisions:
- source_word: כַּעֲנָבִים בַּמִּדְבָּר
  choice: जैसे जंगल में अंगूर मिलते हैं
  rationale: כְּ तुलना व्यक्त करता है। מִדְבָּר निर्जन या बंजर प्रदेश है; ‘जंगल’ हिन्दी बाइबलीय प्रयोग में निर्जन वन-प्रदेश का स्वाभाविक बोध देता है। पूर्ण उपवाक्य हिन्दी में अप्रत्याशित और सुखद प्राप्ति का चित्र स्पष्ट करता है।
- source_word: מָצָאתִי יִשְׂרָאֵל
  choice: वैसे ही मैंने इस्राएल को पाया
  rationale: מצא का सीधा अर्थ ‘पाना’ है। तुलना का संबंध स्पष्ट करने के लिए ‘वैसे ही’ जोड़ा गया है।
- source_word: כְּבִכּוּרָה בִתְאֵנָה בְּרֵאשִׁיתָהּ
  choice: जैसे अंजीर के पेड़ पर आरम्भ में लगा पहला पका फल होता है
  rationale: בִּכּוּרָה सबसे पहले पकने वाले, विशेष रूप से प्रिय फल को दर्शाता है। בְּרֵאשִׁיתָהּ का शाब्दिक ‘उसके आरम्भ में’ बनाए रखा गया है, बिना किसी विशिष्ट कृषि-मौसम को अनिवार्य किए।
- source_word: רָאִיתִי אֲבוֹתֵיכֶם
  choice: मैंने तुम्हारे पुरखों को देखा
  rationale: ראה का सामान्य अर्थ ‘देखना’ है। אבות यहाँ संबोधित लोगों की पूर्वज पीढ़ी को दर्शाता है; आधुनिक हिन्दी में ‘पुरखे’ स्वाभाविक और गरिमापूर्ण है।
- source_word: הֵמָּה בָּאוּ בַעַל פְּעוֹר
  choice: पर वे बाल-पोर के पास गए
  rationale: בוא का रूप मूलतः ‘आए/पहुँचे’ है; गन्तव्य के साथ हिन्दी में ‘के पास गए’ स्वाभाविक है। הֵמָּה का बल और पूर्ववर्ती अनुग्रह से तीखा कथात्मक मोड़ ‘पर वे’ द्वारा व्यक्त किया गया है, यद्यपि अलग विरोधसूचक संयोजक नहीं है।
- source_word: וַיִּנָּזְרוּ לַבֹּשֶׁת
  choice: और उन्होंने अपने आप को लज्जा के लिए समर्पित कर दिया
  rationale: נזר के निफ़ाल में अपने को अलग या धार्मिक रूप से समर्पित करने का भाव है। ‘लज्जा’ בֹּשֶׁת की निन्दात्मक और सम्भवतः मूर्तिसूचक अस्पष्टता को बनाए रखता है।
- source_word: וַיִּהְיוּ שִׁקּוּצִים כְּאָהֳבָם
  choice: वे उसी के समान घिनौने हो गए जिससे उन्होंने प्रेम किया
  rationale: שִׁקּוּצִים धार्मिक और नैतिक घृणा का तीव्र शब्द है। כְּאָהֳבָם संक्षिप्त और कुछ अस्पष्ट है; यह अनुवाद लोगों के अपने प्रिय उपास्य के समान हो जाने की सम्भावित तुलना को व्यक्त करता है, पर वस्तु को स्पष्टतः ‘मूर्ति’ नहीं कहता।
theological_decisions:
- issue: לַבֹּשֶׁת का मूर्तिपूजक संदर्भ
  choice: मुख्य पाठ में ‘लज्जा’
  alternative: ‘लज्जाजनक वस्तु’ अथवा बाल देवता के लिए निन्दात्मक नाम
  rationale: इब्रानी शब्द स्वयं ‘लज्जा’ कहता है और सम्भवतः मूर्ति के लिए तिरस्कारपूर्ण संकेत है। मुख्य पाठ में इस दोहरे अर्थ को सुरक्षित रखा गया है।
- issue: כְּאָהֳבָם में प्रेम की वस्तु
  choice: ‘उसी के समान ... जिससे उन्होंने प्रेम किया’
  alternative: ‘अपनी प्रिय मूर्ति के समान’ अथवा ‘अपने प्रेम के अनुसार’
  rationale: संदर्भ उपास्य वस्तु की ओर संकेत करता है, लेकिन इब्रानी उसे सीधे नाम नहीं देता। अनुवाद तुलना और निहित वस्तु दोनों को बनाए रखता है।
- issue: הֵמָּה से आरम्भ होने वाले कथन का संबंध
  choice: ‘पर वे’
  alternative: ‘वे’
  rationale: इब्रानी में स्पष्ट विरोधसूचक संयोजक नहीं है, पर बलयुक्त सर्वनाम और सकारात्मक आरम्भ के बाद की घटना तीखा विरोध उत्पन्न करती है। हिन्दी में ‘पर’ इस प्रवचनगत मोड़ को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण भविष्यद्वाणी-संबंधी गद्य। ‘पुरखे’, ‘समर्पित’ और ‘घिनौने’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की ऐतिहासिक तथा धार्मिक तीव्रता बनाए रखते हैं। सभी दिए गए पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
