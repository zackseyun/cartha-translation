  text: כִּ֤י אִם יְגַדְּלוּ֙ אֶת בְּנֵי/הֶ֔ם וְ/שִׁכַּלְתִּ֖י/ם מֵֽ/אָדָ֑ם כִּֽי גַם א֥וֹי לָ/הֶ֖ם בְּ/שׂוּרִ֥/י מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/012.yaml
  text: Even if they raise their children[a], I will bereave them so that not a man remains; for indeed[b], woe to them when I depart from them.
translation:
  language: hi
  text: चाहे वे अपने बच्चों[a] को पाल-पोसकर बड़ा करें, फिर भी मैं उन्हें संतान-विहीन कर दूँगा, यहाँ तक कि कोई मनुष्य न बचे। क्योंकि निश्चय ही, जब मैं उनसे दूर हो जाऊँगा[b], तब उन पर हाय होगी!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पुत्रों।” इब्रानी शब्द विशेष रूप से पुत्रों के लिए प्रयुक्त हो सकता है, लेकिन प्रायः व्यापक अर्थ में संतान को भी दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “जब मैं उनसे मुँह फेर लूँगा।” इब्रानी में न्याय के रूप में परमेश्वर की कृपा और उपस्थिति के हटने पर बल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: चाहे … फिर भी
  rationale: यहाँ यह पदबंध रियायती शर्त व्यक्त करता है; आधुनिक हिन्दी में ‘चाहे … फिर भी’ उसका स्वाभाविक और स्पष्ट रूप है।
- source_word: יְגַדְּלוּ
  choice: पाल-पोसकर बड़ा करें
  rationale: पिएल रूप में גדל बच्चों का पालन-पोषण करके उन्हें बड़ा करने के अर्थ में है।
- source_word: בְּנֵיהֶם
  choice: अपने बच्चों
  rationale: בנים का मूल अर्थ ‘पुत्र’ हो सकता है, पर यह संतान के व्यापक अर्थ में भी प्रयुक्त होता है; संदर्भ में ‘बच्चे’ सामूहिक आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְשִׁכַּלְתִּים
  choice: मैं उन्हें संतान-विहीन कर दूँगा
  rationale: שׁכל बच्चों को खो देने और संतान-वियोग का बोध कराता है। हिन्दी में यह रूप परिणाम और त्रासदी दोनों स्पष्ट करता है।
- source_word: מֵאָדָם
  choice: यहाँ तक कि कोई मनुष्य न बचे
  rationale: कठिन इब्रानी पदबंध को संदर्भानुसार पूर्ण मानवीय क्षति की सीमा के रूप में समझा गया है; यह अनुवाद उसके तीव्र बल को स्पष्ट हिन्दी में रखता है।
- source_word: כִּי גַם
  choice: निश्चय ही
  rationale: यह संयोजन आगामी चेतावनी को बल देता है; ‘निश्चय ही’ उसका emphatic force संक्षेप में व्यक्त करता है।
- source_word: אוֹי לָהֶם
  choice: उन पर हाय
  rationale: यह भविष्यद्वक्ताओं में प्रयुक्त शोक और न्याय की मानक उद्घोषणा है।
- source_word: בְּשׂוּרִי מֵהֶם
  choice: जब मैं उनसे दूर हो जाऊँगा
  rationale: סור का प्रथम-पुरुष रूप परमेश्वर के उनसे हटने या दूर होने को दर्शाता है, और בְּ परिस्थिति अथवा समय बताता है।
theological_decisions:
- issue: अंतिम उपवाक्य में परमेश्वर के हटने का अर्थ
  choice: परमेश्वर न्याय में लोगों से दूर हो जाता है
  alternative: परमेश्वर उनसे मुँह फेर लेता है
  rationale: בְּשׂוּרִי में प्रथम-पुरुष प्रत्यय परमेश्वर के अपने हटने को समर्थित करता है। अनुवाद उसकी उपस्थिति और अनुग्रह के हटने से उत्पन्न विपत्ति को व्यक्त करता है, पर उससे आगे कोई व्यवस्थित धर्मसैद्धांतिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु भविष्यद्वाणी की गंभीर और गरिमापूर्ण शैली बनाए रखती है। ‘पाल-पोसकर बड़ा करें’ सामान्य पाठक के लिए स्वाभाविक है; ‘उन पर हाय’ बाइबलीय न्याय-उद्घोषणा की संक्षिप्त गंभीरता सुरक्षित रखता है।
