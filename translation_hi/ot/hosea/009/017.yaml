  yaml_path: translation/ot/hosea/009/017.yaml
  text: My God will reject them because they have not listened to him[a], and they will be wanderers among the nations.
translation:
  language: hi
  text: मेरा परमेश्वर उन्हें अस्वीकार कर देगा, क्योंकि उन्होंने उसकी बात नहीं सुनी[a]; और वे राष्ट्रों के बीच भटकते फिरेंगे।
  philosophy: optimal-equivalence
  footnotes:
