    text: या “उन्होंने उसकी आज्ञा नहीं मानी।” इब्रानी अभिव्यक्ति का शाब्दिक अर्थ उसकी बात न सुनना है, पर इस संदर्भ में आज्ञा न मानना भी निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְאָסֵם
  choice: उन्हें अस्वीकार कर देगा
  rationale: מָאַס का मूल भाव ठुकराना या अस्वीकार करना है। यह चयन न्याय और वाचा-संबंधी अस्वीकृति को स्पष्ट रखता है, पर भावनात्मक घृणा का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: אֱלֹהַי
  choice: मेरा परमेश्वर
  rationale: प्रथम पुरुष एकवचन प्रत्यय को बनाए रखते हुए होशे की व्यक्तिगत भविष्यद्वक्ताई वाणी को सुरक्षित रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי अस्वीकृति का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक और स्पष्ट है।
- source_word: לֹא שָׁמְעוּ לוֹ
  choice: उन्होंने उसकी बात नहीं सुनी
  rationale: שׁמע के श्रवण-संबंधी रूपक को बनाए रखते हुए हिन्दी मुहावरा ‘किसी की बात सुनना’ आज्ञापालन का निहित भाव भी व्यक्त करता है।
- source_word: וְיִהְיוּ נֹדְדִים
  choice: और वे ... भटकते फिरेंगे
  rationale: היה और बहुवचन कृदंत נֹדְדִים मिलकर उनकी भावी निरंतर दशा बताते हैं। ‘भटकते फिरेंगे’ निर्वासन और अस्थिर विचरण का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: גּוֹיִם विदेशी राष्ट्रों को सूचित करता है। ‘राष्ट्रों के बीच’ बिखराव के संदर्भ में स्वाभाविक है और बाद के धार्मिक अर्थों से लदे शब्द से बचता है।
theological_decisions:
- issue: भविष्यद्वक्ता का ‘मेरा परमेश्वर’ कहना
  choice: प्रथम पुरुष संबंधसूचक रूप ‘मेरा परमेश्वर’ बनाए रखा गया।
  alternative: केवल ‘परमेश्वर’
  rationale: इब्रानी में संबंधसूचक प्रत्यय स्पष्ट है; इसे रखना होशे की व्यक्तिगत और वाचा-संबंधी वाणी को सुरक्षित रखता है।
- issue: שׁמע को सुनना या आज्ञा मानना अनूदित करना
  choice: मुख्य पाठ में ‘उसकी बात नहीं सुनी’
  alternative: ‘उसकी आज्ञा नहीं मानी’
  rationale: संदर्भ में आज्ञा न मानना निहित है, फिर भी मुख्य पाठ में सुनने का मूल रूपक रखा गया है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भटकते फिरेंगे’ निरंतर निर्वासित दशा को स्वाभाविक हिन्दी में व्यक्त करता है; अर्धविराम कारणवाचक निर्णय और उसके परिणाम को अलग करता है।
