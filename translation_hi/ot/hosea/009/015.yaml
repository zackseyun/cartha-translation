  text: כָּל רָעָתָ֤/ם בַּ/גִּלְגָּל֙ כִּֽי שָׁ֣ם שְׂנֵאתִ֔י/ם עַ֚ל רֹ֣עַ מַֽעַלְלֵי/הֶ֔ם מִ/בֵּיתִ֖/י אֲגָרְשֵׁ֑/ם לֹ֤א אוֹסֵף֙ אַהֲבָתָ֔/ם כָּל שָׂרֵי/הֶ֖ם סֹרְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/015.yaml
  text: All their evil is at Gilgal[a]; indeed, there I hated them because of the evil of their deeds. I will drive them out of my house; I will no longer love them[c][b]. All their princes are rebels.
translation:
  language: hi
  text: उनकी सारी बुराई गिलगाल में है[a]; निश्चय ही, वहीं मैंने उनके कामों की बुराई के कारण उनसे घृणा की। मैं उन्हें अपने घर से निकाल दूँगा[b]; अब मैं उनसे प्रेम न करूँगा। उनके सभी शासक विद्रोही हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि वहीं मैंने उनसे घृणा की।” इब्रानी संयोजक कारणसूचक (“क्योंकि”) या बलसूचक (“निश्चय ही”) हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मेरा घर” विशेष रूप से यहोवा के देश, पवित्रस्थान या वाचा के घराने की ओर संकेत कर सकता है; इब्रानी में यह छवि संक्षिप्त और अनिर्धारित है।
    reason: cultural_note
  - marker: c
    text: या, “उनके सभी शासक विद्रोही/हठी हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רָעָתָם
  choice: उनकी सारी बुराई
  rationale: एकवचन भाववाचक संज्ञा के साथ כָּל उनकी बुराई की समग्रता व्यक्त करता है; यह हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: בַּגִּלְגָּל
  choice: गिलगाल में
  rationale: בְּ यहाँ स्थानसूचक है; स्थान-नाम के साथ ‘में’ सहज हिन्दी है।
- source_word: כִּי שָׁם
  choice: निश्चय ही, वहीं
  rationale: כִּי कारणसूचक अथवा बलसूचक हो सकता है। मुख्य पाठ में बलसूचक अर्थ रखा गया है, जबकि कारणसूचक विकल्प पादटिप्पणी में दिया गया है।
- source_word: שְׂנֵאתִים
  choice: मैंने उनसे घृणा की
  rationale: שׂנא के कठोर और प्रत्यक्ष अर्थ को बिना नरम किए रखा गया है।
- source_word: עַל רֹעַ מַעַלְלֵיהֶם
  choice: उनके कामों की बुराई के कारण
  rationale: עַל कारण या आधार बताता है; यह रूप मूल की संरचना और नैतिक बल दोनों बनाए रखता है।
- source_word: מִבֵּיתִי אֲגָרְשֵׁם
  choice: मैं उन्हें अपने घर से निकाल दूँगा
  rationale: גָּרַשׁ निष्कासन को व्यक्त करता है और מִן उसके आरम्भ-बिंदु को; ‘घर’ की संक्षिप्त मूल छवि को सुरक्षित रखा गया है।
- source_word: לֹא אוֹסֵף אַהֲבָתָם
  choice: अब मैं उनसे प्रेम न करूँगा
  rationale: אָסַף के इस मुहावरे का अर्थ आगे जारी न रखना है; यह हिन्दी में उस समाप्ति को स्पष्टतः व्यक्त करता है।
- source_word: כָּל שָׂרֵיהֶם סֹרְרִים
  choice: उनके सभी शासक विद्रोही हैं
  rationale: שָׂרִים राजनीतिक अगुओं या शासकों को और סֹרְרִים लगातार विद्रोही स्वभाव को सूचित करता है। ‘शासक’ राजपुत्रों तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: परमेश्वर की घृणा की भाषा
  choice: ‘मैंने उनसे घृणा की’ का सीधा कथन
  alternative: ‘मैंने उन्हें त्याग दिया’ या ‘मैं उनके विरुद्ध हो गया’
  rationale: שׂנא स्पष्ट रूप से घृणा अथवा तीव्र अस्वीकृति व्यक्त करता है। न्याय की इस कठोर भाषा को धर्मवैज्ञानिक रूप से नरम नहीं किया गया।
- issue: ‘मेरे घर’ का आशय
  choice: मुख्य पाठ में ‘अपने घर’ की छवि बनाए रखना
  alternative: ‘अपने देश’, ‘अपने मन्दिर’ या ‘अपने घराने’
  rationale: यह यहोवा के देश, पवित्रस्थान या वाचा-समुदाय की ओर संकेत कर सकता है, पर मूल इब्रानी संदर्भ को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध शैली अपनाई गई है। ‘घृणा’, ‘निकाल दूँगा’ और ‘विद्रोही’ जैसे कठोर शब्द मूल भविष्यद्वाणी के न्याय-स्वर को बनाए रखते हैं।
