source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה הָֽלְכוּ֙ מִ/שֹּׁ֔ד מִצְרַ֥יִם תְּקַבְּצֵ֖/ם מֹ֣ף תְּקַבְּרֵ֑/ם מַחְמַ֣ד לְ/כַסְפָּ֗/ם קִמּוֹשׂ֙ יִֽירָשֵׁ֔/ם ח֖וֹחַ בְּ/אָהֳלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/006.yaml
  text: For behold[a], they have gone away from destruction; Egypt will gather them, Memphis will bury them. Nettles will possess the precious things of their silver; thorns will be in their tents.
translation:
  language: hi
  text: 'क्योंकि देखो, वे विनाश से भाग गए हैं;


    मिस्र उन्हें इकट्ठा करेगा,


    मेम्फिस उन्हें दफ़नाएगा।


    बिच्छू-बूटी[a] उनकी चाँदी की बहुमूल्य वस्तुओं पर अधिकार कर लेगी,


    और उनके तंबुओं में काँटे उगेंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिच्छू-बूटी उनकी चाँदी की बहुमूल्य वस्तुओं पर अधिकार कर लेगी।” यहाँ प्रयुक्त इब्रानी वनस्पति-नाम की ठीक पहचान अनिश्चित है; इसका अर्थ बिच्छू-बूटी या इसी प्रकार अपने-आप फैलने वाली वनस्पति हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשֹּׁד
  choice: विनाश से
  rationale: שֹׁד हिंसक उजाड़, तबाही या विनाश को दर्शाता है। הָלְכוּ के साथ מִן को प्रस्थान के बिंदु के रूप में रखते हुए ‘विनाश से भाग गए हैं’ ऐसी निष्फल उड़ान व्यक्त करता है जिसे आगे मिस्र और मेम्फिस में मृत्यु तक पहुँचना है।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप।
- source_word: תְּקַבְּצֵם
  choice: उन्हें इकट्ठा करेगा
  rationale: Piel रूप में קבץ का सामान्य अर्थ इकट्ठा करना है। यहाँ मिस्र को मानवीय कर्ता के रूप में दिखाया गया है और निर्वासितों के एकत्र होने में विडंबना बनी रहती है।
- source_word: מֹף
  choice: मेम्फिस
  rationale: מֹף प्राचीन मिस्री नगर Memphis का नाम है; उसका पहचाना हुआ आधुनिक रूप ऐतिहासिक संदर्भ स्पष्ट रखता है।
- source_word: תְּקַבְּרֵם
  choice: उन्हें दफ़नाएगा
  rationale: קבר का सीधा अर्थ दफ़नाना है। यह समानांतर पंक्ति निर्वासन के मृत्यु में समाप्त होने को तीखा बनाती है।
- source_word: מַחְמַד לְכַסְפָּם
  choice: उनकी चाँदी की बहुमूल्य वस्तुएँ
  rationale: מַחְמַד किसी मनभावनी या बहुमूल्य वस्तु को बताता है और לְכַסְפָּם उसे उनकी चाँदी अथवा चाँदी की मूल्यवान संपत्ति से जोड़ता है। यह रूप अर्थ को स्पष्ट रखते हुए संबंध की कुछ असामान्यता बनाए रखता है।
- source_word: קִמּוֹשׂ
  choice: बिच्छू-बूटियाँ
  rationale: यह उजाड़ स्थान में फैलने वाली हानिकारक वनस्पति का नाम है और पारंपरिक रूप से nettles समझा जाता है। वनस्पति की सटीक पहचान अनिश्चित होने के कारण टिप्पणी में व्यापक विकल्प दिया गया है।
- source_word: יִירָשֵׁם
  choice: कब्ज़ा कर लेंगी
  rationale: ירשׁ का अर्थ अधिकार करना, विरासत में पाना या अपने अधीन लेना हो सकता है। निर्जन संपत्ति पर वनस्पति के छा जाने के लिए यह स्वाभाविक हिन्दी है और अधिकार-परिवर्तन की विडंबना रखती है।
- source_word: חוֹחַ
  choice: काँटे
  rationale: חוֹחַ सामान्यतः काँटेदार वनस्पति को सूचित करता है। ‘काँटे’ स्पष्ट और व्यापक हिन्दी समतुल्य है।
- source_word: בְּאָהֳלֵיהֶם
  choice: उनके तंबुओं में
  rationale: אֹהֶל का शाब्दिक अर्थ तंबू है। इसे बनाए रखने से परित्यक्त आवासों का मूल काव्यात्मक चित्र सुरक्षित रहता है।
theological_decisions:
- issue: הָלְכוּ מִשֹּׁד के आरंभिक खंड का अर्थ
  choice: वे विनाश से भाग गए हैं
  alternative: वे विनाश के कारण चले गए हैं; वे विनाश से बच निकले हैं
  rationale: संदर्भ न्याय, निर्वासन और मिस्र में मृत्यु का है, इसलिए यह सफल बचाव नहीं बल्कि विनाश से निष्फल पलायन है। ‘भाग गए हैं’ गति और संकट दोनों व्यक्त करता है, पर यह नहीं कहता कि वे अंततः सुरक्षित बच निकले।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में काव्यात्मक पंक्ति-विन्यास के साथ रखी गई है। ‘क्योंकि देखो’ मूल כִּי הִנֵּה की आकस्मिकता और बल को बनाए रखता है। ‘दफ़नाएगा’ वर्तमान हिन्दी में स्वाभाविक है; ‘तंबू’ और ‘काँटे’ मूल बिंबों को सुरक्षित रखते हैं।
