  text: לֹ֥א יֵשְׁב֖וּ בְּ/אֶ֣רֶץ יְהוָ֑ה וְ/שָׁ֤ב אֶפְרַ֨יִם֙ מִצְרַ֔יִם וּ/בְ/אַשּׁ֖וּר טָמֵ֥א יֹאכֵֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/003.yaml
  text: They will not remain in the land of Yahweh[a]; Ephraim will return to Egypt[c][b], and in Assyria they will eat unclean food.
translation:
  language: hi
  text: वे यहोवा की भूमि में नहीं रहेंगे[a]; एप्रैम मिस्र लौट जाएगा[b], और अश्शूर में वे अशुद्ध भोजन खाएँगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा की भूमि में नहीं बसेंगे।”
    reason: lexical_alternative
  - marker: b
    text: “मिस्र” का अर्थ वास्तविक देश भी हो सकता है और फिर से बंधन या निर्वासन में जाने की प्रतीकात्मक छवि भी; इब्रानी पाठ अश्शूर के उल्लेख के साथ इस तनाव को बनाए रखता है।
    reason: alternative_reading
  - marker: c
    text: या, “जो अशुद्ध है, उसे खाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשְׁבוּ
  choice: रहेंगे
  rationale: यָשַׁב का मूल अर्थ ‘रहना/बसना’ है। निषेध और निर्वासन के संदर्भ में ‘नहीं रहेंगे’ देश में उनका निवास जारी न रह पाने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּאֶרֶץ יְהוָה
  choice: यहोवा के देश में
  rationale: यह वाक्यांश देश पर यहोवा के अधिकार और उसके वाचा-संबंधी महत्व—दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के विशिष्ट इब्रानी नाम का प्रचलित और स्पष्ट रूप रखा गया है।
- source_word: וְשָׁב
  choice: लौट जाएगा
  rationale: भविष्यसूचक न्याय-वचन में यह रूप भावी वापसी को बताता है; एकवचन ‘एप्रैम’ के साथ ‘लौट जाएगा’ स्वाभाविक हिन्दी है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: मूल पाठ उत्तरी राज्य के लिए प्रयुक्त विशिष्ट नाम ‘एप्रैम’ देता है; इसे व्याख्यात्मक रूप से ‘इस्राएल’ नहीं बनाया गया।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: स्थान-नाम को ज्यों का त्यों रखा गया है, ताकि उसके शाब्दिक और नए बंधन/निर्वासन के प्रतीकात्मक संकेत के बीच का तनाव बना रहे।
- source_word: וּבְאַשּׁוּר
  choice: और अश्शूर में
  rationale: सरल संयोजक ו को ‘और’ से व्यक्त किया गया है; इससे मिस्र और अश्शूर के उल्लेख को कृत्रिम रूप से विरोधी या समानार्थी नहीं बनाया जाता।
- source_word: טָמֵא
  choice: अशुद्ध भोजन
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘भोजन’ जोड़ने से हिन्दी स्पष्ट रहती है और विधि-विधान संबंधी अशुद्धता का भाव सुरक्षित रहता है।
- source_word: יֹאכֵלוּ
  choice: वे ... खाएँगे
  rationale: क्रिया का सीधा भावी अर्थ रखा गया है और बहुवचन कर्ता को हिन्दी में स्पष्ट किया गया है।
theological_decisions:
- issue: ‘मिस्र’ को शाब्दिक स्थान मानना या नए बंधन/निर्वासन का प्रतीक
  choice: मुख्य पाठ में ‘मिस्र’ स्थान-नाम ही रखा गया है और उसके आशय को अनिर्णीत छोड़ा गया है।
  alternative: इसे सामान्य निर्वासन या नए बंधन का केवल प्रतीक मानना, अथवा अश्शूर को ही एकमात्र वास्तविक गंतव्य समझना।
  rationale: इब्रानी पाठ मिस्र लौटने और अश्शूर में खाने—दोनों को साथ रखता है। अनुवाद इस तनाव को सुलझाने के बजाय सुरक्षित रखता है।
- issue: טָמֵא का विधि-विधान संबंधी आशय
  choice: ‘अशुद्ध भोजन’
  alternative: ‘अशुद्ध वस्तु’ या ‘दूषित भोजन’
  rationale: संदर्भ केवल गंदे या खराब भोजन का नहीं, बल्कि वाचा और पवित्रता के नियमों की दृष्टि से अशुद्धता का है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य-विन्यास अपनाया गया है। ‘रहेंगे’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी में अधिक पारंपरिक ‘बसेंगे’ दिया गया है। ‘अशुद्ध’ से धार्मिक-विधिक अर्थ सुरक्षित रहता है।
