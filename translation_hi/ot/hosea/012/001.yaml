  text: סְבָבֻ֤/נִי בְ/כַ֨חַשׁ֙ אֶפְרַ֔יִם וּ/בְ/מִרְמָ֖ה בֵּ֣ית יִשְׂרָאֵ֑ל וִֽ/יהוּדָ֗ה עֹ֥ד רָד֙ עִם אֵ֔ל וְ/עִם קְדוֹשִׁ֖ים נֶאֱמָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/001.yaml
  text: Ephraim has surrounded me with lies[a], and the house of Israel with deceit[b]; but Judah still roams with God and is faithful with the Holy One.
translation:
  language: hi
  text: एप्रैम ने मुझे झूठ से और इस्राएल के घराने ने छल से घेर रखा है; पर यहूदा अब भी परमेश्वर के साथ विचरता है[a] और पवित्र परमेश्वर के प्रति निष्ठावान है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस कठिन इब्रानी खंड का अनुवाद यह भी हो सकता है: “पर यहूदा अब भी परमेश्वर के विरुद्ध और उस विश्वासयोग्य पवित्र परमेश्वर के विरुद्ध उद्दंड है।” विशेषकर ‘विचरता है’ अनूदित क्रिया का अर्थ अनिश्चित है।'
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “पवित्र जनों के साथ”; इसे परमेश्वर के लिए “पवित्र परमेश्वर के साथ” भी समझा जा सकता है, अथवा यह पवित्र स्वर्गीय प्राणियों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבָבֻנִי
  choice: मुझे … घेर रखा है
  rationale: क्रिया का मूल अर्थ चारों ओर से घेरना है; पूर्ण क्रिया का वर्तमान परिणाम दिखाने के लिए ‘घेर रखा है’ स्वाभाविक हिन्दी है।
- source_word: בְכַחַשׁ
  choice: झूठ से
  rationale: כחש यहाँ असत्य और कपटपूर्ण व्यवहार को व्यक्त करता है; ‘झूठ’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: व्यक्तिवाचक नाम को लिप्यंतरित किया गया है; होशे में यह उत्तरी राज्य का द्योतक भी हो सकता है, पर उस अर्थ को मुख्य पाठ में स्पष्ट करके नहीं जोड़ा गया।
- source_word: וּבְמִרְמָה
  choice: छल से
  rationale: מרמה धोखे या कपट का बोध कराता है; ‘छल’ संक्षिप्त है और ‘झूठ’ से अर्थगत भेद भी बनाए रखता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने
  rationale: इब्रानी रचना और नबूवत की शैली को बनाए रखते हुए ‘घराना’ प्रयोग किया गया है।
- source_word: עֹד
  choice: अब भी
  rationale: यह निरंतरता का भाव व्यक्त करता है।
- source_word: רָד עִם אֵל
  choice: परमेश्वर के साथ विचरता है
  rationale: רָד अत्यंत कठिन और अनिश्चित रूप है। ‘विचरता है’ चलने-फिरने के व्यापक भाव को रखता है और न तो अनावश्यक रूप से ‘शासन करता है’ चुनता है, न ही मुख्य पाठ में विद्रोह का अर्थ निश्चित करता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל परमेश्वर के सामान्य दैवी नाम/उपाधि के रूप में समझा गया है।
- source_word: קְדוֹשִׁים
  choice: पवित्र जन
  rationale: रूप व्याकरणतः बहुवचन है, पर इसे परमेश्वर के लिए महिमासूचक या तीव्रतासूचक प्रयोग मानना संभव है। मुख्य पाठ में एकवचन अर्थ रखा गया और शाब्दिक बहुवचन पादटिप्पणी में दिया गया।
- source_word: נֶאֱמָן
  choice: विश्वासयोग्य है
  rationale: यह रूप भरोसेमंद या निष्ठावान होने का भाव देता है; ‘विश्वासयोग्य’ उसका सीधा और गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: यहूदा-वाले कठिन खंड का सकारात्मक या नकारात्मक अर्थ
  choice: यहूदा अब भी परमेश्वर के साथ विचरता है और पवित्र जन के प्रति विश्वासयोग्य है।
  alternative: यहूदा अब भी परमेश्वर के विरुद्ध और उस विश्वासयोग्य पवित्र जन के विरुद्ध उद्दंड है।
  rationale: रָד और קְדוֹשִׁים दोनों के अर्थ विवादित हैं। נֶאֱמָן को यहूदा का विधेय मानने पर एप्रैम से सकारात्मक विरोध बनता है, पर नकारात्मक पाठ भी भाषिक रूप से संभव है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: קְדוֹשִׁים का वचन और संकेत
  choice: परमेश्वर को सूचित करने वाला एकवचन ‘पवित्र जन’
  alternative: शाब्दिक बहुवचन ‘पवित्र जनों’ अथवा स्वर्गीय प्राणियों का संकेत
  rationale: इब्रानी शब्द रूपतः बहुवचन है, इसलिए एकवचन अर्थ को निर्विवाद नहीं माना गया; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। ‘घराना’, ‘विचरता’ और ‘विश्वासयोग्य’ नबूवत की साहित्यिक गरिमा बनाए रखते हैं; वास्तविक इब्रानी अस्पष्टता को मुख्य पाठ और पादटिप्पणियों के बीच संतुलित किया गया है।
