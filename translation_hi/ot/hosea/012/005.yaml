source:
  edition: WLC
  text: וָ/יָּ֤שַׂר אֶל מַלְאָךְ֙ וַ/יֻּכָ֔ל בָּכָ֖ה וַ/יִּתְחַנֶּן ל֑/וֹ בֵּֽית אֵל֙ יִמְצָאֶ֔/נּוּ וְ/שָׁ֖ם יְדַבֵּ֥ר עִמָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/005.yaml
  text: He strove with the angel and prevailed[a]; he wept and sought his favor. At Bethel he found him[b], and there he spoke with us—
translation:
  language: hi
  text: उसने स्वर्गदूत से संघर्ष किया और उस पर प्रबल हुआ; वह रोया और उससे कृपा की याचना की[a]। बेतेल में उसने उसे पाया, और वहाँ उसने हमसे बात की[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उससे विनती की” अथवा “उससे कृपा माँगी।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में “हमसे” है; कुछ लोग सर्वनाम के अचानक बदलने को सहज बनाने के लिए इसका अर्थ “उससे” समझते हैं। मुख्य पाठ मसोराई पाठ को सुरक्षित रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשַׂר
  choice: संघर्ष किया
  rationale: यहाँ שׂרה याकूब के संघर्ष की घटना (उत्पत्ति 32) की ओर संकेत करता है; इसलिए नैतिक ‘सीधा होना’ नहीं, बल्कि संघर्ष करना अभिप्रेत है।
- source_word: מַלְאָךְ
  choice: दूत
  rationale: מַלְאָךְ का मूल अर्थ ‘दूत’ है और इस प्रसंग में अलौकिक दूत अभिप्रेत है। ‘दूत’ हिन्दी में प्रसंग की गरिमा और मूल शब्द की अर्थ-सीमा दोनों बनाए रखता है।
- source_word: וַיֻּכָל
  choice: उस पर प्रबल हुआ
  rationale: יכל यहाँ संघर्ष के समानांतर प्रयुक्त होकर सफल या प्रबल होने का भाव देता है; ‘उस पर’ जोड़ने से हिन्दी में संबंध स्पष्ट और स्वाभाविक रहता है।
- source_word: בָּכָה
  choice: वह रोया
  rationale: यह क्रिया सीधे रोने को व्यक्त करती है; सरल भूतकाल प्रसंग के कथात्मक स्मरण के अनुकूल है।
- source_word: וַיִּתְחַנֶּן לוֹ
  choice: उससे कृपा की याचना की
  rationale: חנן के हित्पअेल रूप में किसी से कृपा या अनुग्रह पाने के लिए विनती करने का भाव है। यह रूप अर्थ की कृपा-संबंधी छाया को बनाए रखता है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: יִמְצָאֶנּוּ
  choice: उसने उसे पाया
  rationale: रूप को याकूब के स्मरण की निरंतरता में एकवचन कर्ता और एकवचन कर्म के रूप में रखा गया है। ‘उसने उसे’ मूल की संदर्भगत अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: וְשָׁם יְדַבֵּר עִמָּנוּ
  choice: और वहाँ उसने हमसे बात की
  rationale: मसोराई पाठ के प्रथम पुरुष बहुवचन ‘हमसे’ को सुरक्षित रखा गया है। अपूर्ण क्रिया को पूर्ववर्ती कथात्मक स्मरण के क्रम में भूतकाल से व्यक्त किया गया है।
theological_decisions:
- issue: अंतिम उपवाक्य में सर्वनाम का एकवचन से बहुवचन में बदलना
  choice: मुख्य पाठ में ‘हमसे’ रखा गया
  alternative: ‘उससे’
  rationale: मसोराई पाठ עִמָּנוּ स्पष्टतः ‘हमसे’ कहता है। यह कठिन बदलाव याकूब के अनुभव को इस्राएल के सामूहिक अनुभव से जोड़ सकता है; इसलिए इसे एकवचन बनाकर समतल नहीं किया गया।
- issue: बेतेल में पाने वाले और पाए जाने वाले की पहचान
  choice: ‘उसने उसे पाया’ के अस्पष्ट सर्वनाम बनाए रखे गए
  alternative: ‘याकूब ने परमेश्वर को पाया’ या ‘परमेश्वर ने याकूब को पाया’
  rationale: मूल पाठ दोनों पात्रों का नाम दोबारा नहीं बताता। किसी एक व्याख्या को स्पष्ट रूप से जोड़ने से मूल की वास्तविक संदर्भगत अस्पष्टता समाप्त हो जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘संघर्ष किया’, ‘प्रबल हुआ’ और ‘कृपा की याचना की’ कथन की काव्यात्मक गंभीरता बनाए रखते हैं। अंतिम दीर्घ विराम अगले पद से विचार के जारी रहने का संकेत देता है।
