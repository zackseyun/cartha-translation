  yaml_path: translation/ot/hosea/012/006.yaml
  text: And Yahweh[b][a], the God of hosts—Yahweh is his memorial name.
translation:
  language: hi
  text: और याहवे[a], सेनाओं का परमेश्वर—याहवे उसका वह नाम है जिसके द्वारा उसका स्मरण किया जाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का नाम YHWH है। इसे परंपरागत रूप से ‘प्रभु’ और कभी-कभी ‘यहोवा’ कहा जाता है; यहाँ ‘याहवे’ लिखा गया है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, ‘उसका स्मरण’; अर्थात वह नाम जिसके द्वारा उसे स्मरण किया या पुकारा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: और याहवे
  rationale: וַ־ को पिछले कथन से संबंध बनाए रखने के लिए ‘और’ कहा गया है। יהוה को उसके व्यक्तिगत नाम के रूप में ‘याहवे’ लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: सेनाओं का परमेश्वर
  rationale: यह स्थापित ईश्वरीय उपाधि है। ‘सेनाओं’ से केवल मानवीय सेनाएँ ही नहीं, बल्कि स्वर्गीय सैन्य-दल और परमेश्वर के अधीन समस्त शक्तियाँ भी सूचित हो सकती हैं; इसलिए इसकी व्यापकता बनाए रखी गई है।
- source_word: זִכְרוֹ
  choice: उसका स्मरणीय नाम
  rationale: शाब्दिक अर्थ ‘उसका स्मरण’ या ‘उसका स्मारक’ है, पर इस संदर्भ में आशय उस नाम से है जिसके द्वारा परमेश्वर को स्मरण किया और पुकारा जाता है। स्वाभाविक हिन्दी के लिए ‘नाम’ स्पष्ट रूप से जोड़ा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका निकट प्रचलित लिप्यंतरण है; टिप्पणी में पारंपरिक विकल्प बताए गए हैं।
- issue: זִכְרוֹ और ईश्वरीय नाम का संबंध
  choice: याहवे ही उसका स्मरणीय नाम है
  alternative: याहवे उसका स्मरण है
  rationale: मूल की संक्षिप्त अभिव्यक्ति को अर्थ-स्पष्ट हिन्दी में रखा गया है, पर यह दावा नहीं जोड़ा गया कि यही इसका एकमात्र संभव अर्थ है। पाद-टिप्पणी शाब्दिक रूप और ‘स्मरण करने या पुकारने’ की अर्थ-छाया सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। वाक्य की काव्यात्मक संक्षिप्तता और ईश्वरीय उपाधि की गंभीरता बनाए रखने के लिए डैश का प्रयोग किया गया है।
