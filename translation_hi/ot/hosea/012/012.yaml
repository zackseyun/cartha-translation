source:
  edition: WLC
  text: אִם גִּלְעָ֥ד אָ֨וֶן֙ אַךְ שָׁ֣וְא הָי֔וּ בַּ/גִּלְגָּ֖ל שְׁוָרִ֣ים זִבֵּ֑חוּ גַּ֤ם מִזְבְּחוֹתָ/ם֙ כְּ/גַלִּ֔ים עַ֖ל תַּלְמֵ֥י שָׂדָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/012.yaml
  text: If Gilead is iniquity[a], they have surely become nothing; in Gilgal they sacrifice bulls; indeed[c][b], their altars are like stone heaps on the furrows of the field.
translation:
  language: hi
  text: यदि गिलाद अधर्म है[a], तो वे निश्चय ही व्यर्थ हो गए हैं[b]; गिलगाल में वे बैलों की बलि चढ़ाते हैं; उनकी वेदियाँ भी खेत की क्यारियों पर पत्थरों के ढेरों जैसी हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निश्चय ही गिलाद अधर्म है”; इब्रानी अव्यय को शर्तसूचक के बजाय बलसूचक भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “वे निश्चय ही निकम्मे या झूठे हैं”; इब्रानी अभिव्यक्ति संक्षिप्त है और खोखलेपन, व्यर्थता या मिथ्यात्व पर बल दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: यह चित्र उनकी बहुत-सी वेदियों की तुलना जुताई किए हुए खेत की क्यारियों पर दिखाई देने वाले पत्थरों के ढेरों से कर सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह इब्रानी अव्यय शर्तसूचक अथवा बलसूचक हो सकता है। मुख्य पाठ में ‘यदि’ रखने से वाक्य का संक्षिप्त, आलंकारिक तनाव बना रहता है।
- source_word: אָוֶן
  choice: अधर्म
  rationale: यह शब्द नैतिक बुराई, दोष और कभी-कभी मूर्तिपूजक दुष्टता का बोध कराता है। ‘अधर्म’ नैतिक आरोप को बनाए रखता है, पर अर्थ को केवल मूर्तिपूजा तक सीमित नहीं करता।
- source_word: אַךְ שָׁוְא הָיוּ
  choice: तो वे निश्चय ही व्यर्थ हो गए हैं
  rationale: אַךְ के बल और שָׁוְא की व्यर्थता, खोखलेपन या मिथ्यात्व की अर्थ-सीमा को स्वाभाविक हिन्दी में व्यक्त करता है। ‘तो’ आरम्भिक शर्तसूचक संरचना से परिणाम का संबंध स्पष्ट करता है।
- source_word: שְׁוָרִים זִבֵּחוּ
  choice: वे बैलों की बलि चढ़ाते हैं
  rationale: बलिदान-संदर्भ में שְׁוָרִים के लिए ‘बैल’ और क्रिया के लिए अभ्यस्त वर्तमान ‘बलि चढ़ाते हैं’ स्वाभाविक हैं।
- source_word: גַּם
  choice: सचमुच
  rationale: यहाँ अगले चित्र को बल देने वाले योगात्मक अथवा प्रबलकारी अव्यय के रूप में लिया गया है।
- source_word: כְּגַלִּים עַל תַּלְמֵי שָׂדָי
  choice: खेत की क्यारियों पर पड़े पत्थरों के ढेरों जैसी
  rationale: גַּלִּים ढेरों, विशेषतः पत्थरों के ढेरों, का ठोस चित्र देता है; תַּלְמֵי खेत की जुताई से बनी क्यारियों अथवा हल की रेखाओं को सूचित करता है।
theological_decisions:
- issue: आरम्भिक वाक्यांश אִם גִּלְעָד אָוֶן की व्याख्या
  choice: ‘यदि गिलाद अधर्म है’—एक आलंकारिक शर्त के रूप में
  alternative: ‘निश्चय ही गिलाद अधर्म है’—बलसूचक कथन के रूप में
  rationale: אִם भविष्यद्वक्ताओं की काव्यात्मक भाषा में शर्तसूचक और बलसूचक दोनों प्रकार से समझा जा सकता है। मुख्य पाठ शर्तसूचक रूप को सुरक्षित रखता है और पादटिप्पणी दूसरा सम्भव पाठ देती है।
- issue: שָׁוְא का आशय
  choice: ‘व्यर्थ’
  alternative: ‘झूठे’ अथवा ‘निकम्मे’
  rationale: शब्द में खोखलापन, निष्फलता और मिथ्यात्व की परस्पर जुड़ी ध्वनियाँ हैं। ‘व्यर्थ’ इस निन्दात्मक व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सरल शैली रखी गई है। ‘गिलाद’ और ‘गिलगाल’ प्रचलित बाइबलीय स्थान-नाम हैं; ‘वेदियाँ’ धार्मिक संदर्भ में स्पष्ट और सामान्यतः समझ में आने वाला शब्द है।
