base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/015.yaml
  text: Ephraim has provoked bitter anger[a]; his bloodguilt will be left on him[b], and his Lord will repay him for his disgrace.
translation:
  language: hi
  text: एप्रैम ने बहुत कटुता से क्रोध भड़काया है[a]; उसके रक्तपात का दोष उसी पर छोड़ दिया जाएगा[b], और उसका प्रभु[c] उसकी निन्दा उसी पर लौटा देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कड़वाहटों से क्रोधित किया”; इसका अर्थ “बहुत कटु रीति से क्रोध दिलाया” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसका खून उसी पर छोड़ दिया जाएगा” अथवा “उसका रक्तपात उसी पर बना रहेगा।” इब्रानी में बहुवचन “खून” न्यायिक प्रसंगों में प्रायः रक्तपात के दोष को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या “उसका स्वामी।” प्रसंग में यह उपाधि सम्भवतः परमेश्वर के लिए है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִכְעִיס
  choice: क्रोध भड़काया है
  rationale: כעס के हिफ़इल रूप का सामान्य अर्थ किसी को क्रोधित करना या क्रोध भड़काना है। यह हिन्दी में स्वाभाविक है और अगले शब्द से क्रोध की तीव्रता व्यक्त होने देता है।
- source_word: תַּמְרוּרִים
  choice: कड़वा क्रोध
  rationale: מרר से बना बहुवचन संज्ञा-रूप तीखी कड़वाहट या अत्यन्त कटु उत्तेजना व्यक्त करता है। प्रसंग में यह उकसाए गए क्रोध की प्रकृति या तीव्रता बताता है।
- source_word: וְדָמָיו
  choice: उसके रक्तपात का दोष
  rationale: דמים का शाब्दिक अर्थ ‘खून’ या ‘रक्त’ है, पर भविष्यद्वाणी और न्यायिक प्रसंगों में यह रक्तपात तथा उससे उत्पन्न दोष को भी दर्शाता है। ‘रक्तपात का दोष’ इस न्यायिक अर्थ को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: עָלָיו יִטּוֹשׁ
  choice: उसी पर पड़ा रहेगा
  rationale: נטש यहाँ दोष को हटाने के बजाय किसी पर छोड़ दिए जाने का भाव देता है। हिन्दी में यह निष्क्रिय-सदृश रचना अंतर्निहित कर्ता को अनावश्यक रूप से निश्चित किए बिना स्थायी उत्तरदायित्व व्यक्त करती है।
- source_word: וְחֶרְפָּתוֹ
  choice: उसके अपमान
  rationale: חרפה में अपमान, निन्दा और लज्जा के अर्थ हैं। ‘अपमान’ आधुनिक हिन्दी में स्वाभाविक है और यह अस्पष्टता बनाए रखता है कि जोर किए गए अपमान पर है या उससे जुड़ी बदनामी पर।
- source_word: יָשִׁיב לוֹ
  choice: उसी पर लौटा देगा
  rationale: שוב के हिफ़इल रूप के साथ ל किसी बात को किसी के पास या उसी पर वापस लाने का अर्थ देता है। यह शब्दांकन न्यायपूर्ण प्रतिफल का भाव रखता है और मूल की ‘लौटाने’ वाली छवि भी बचाता है।
- source_word: אֲדֹנָיו
  choice: उसका प्रभु
  rationale: यह रूप यहाँ एकवचन उपाधि के रूप में प्रयुक्त है। ‘उसका प्रभु’ परमेश्वर की ओर संभावित संकेत को बनाए रखता है, पर जहाँ मूल में יהוה नहीं है वहाँ ‘यहोवा’ नहीं जोड़ता।
theological_decisions:
- issue: אֲדֹנָיו का अभिप्रेत व्यक्ति
  choice: परमेश्वर की ओर संकेत करने वाली उपाधि, ‘उसका प्रभु’
  alternative: ‘उसका स्वामी’
  rationale: होशे के न्याय-संबंधी प्रसंग में रक्तपात का दोष रहने देना और अपमान लौटा देना परमेश्वर का कार्य प्रतीत होता है। फिर भी मूल में सामान्य प्रभु/स्वामी की उपाधि है, इसलिए अनुवाद उपाधि को ही रखता है और पाद-टिप्पणी शाब्दिक विकल्प बताती है।
- issue: रक्तपात के दोष को छोड़ने वाले कर्ता की पहचान
  choice: मुख्य पाठ में कर्ता को प्रत्यक्ष न करके ‘पड़ा रहेगा’
  alternative: ‘वह उसका रक्तपात का दोष उसी पर छोड़ देगा’
  rationale: יִטּוֹשׁ का कर्ता व्याकरण में निहित है और आगे आने वाला ‘उसका प्रभु’ उसका संभावित कर्ता है, पर वाक्य-रचना इसे पूर्णतः स्पष्ट नहीं करती। निष्क्रिय-सदृश हिन्दी मूल की यह अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी के न्यायपूर्ण और गंभीर स्वर को बनाए रखा गया है। ‘रक्तपात का दोष’ सामान्य पाठक के लिए ‘रक्त-दोष’ से अधिक स्पष्ट है; ‘उसी पर लौटा देगा’ मूल की प्रतिदानात्मक छवि और अर्थगत तनाव दोनों को सुरक्षित रखता है।
