  yaml_path: translation/ot/hosea/012/014.yaml
  text: By a prophet Yahweh brought Israel up from Egypt[b][a], and by a prophet he was guarded.
translation:
  language: hi
  text: एक भविष्यद्वक्ता[a] के द्वारा याहवे ने इस्राएल को मिस्र से निकाल लाया, और एक भविष्यद्वक्ता के द्वारा उसकी रक्षा की गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: निर्गमन के संदर्भ में यह भविष्यद्वक्ता संभवतः मूसा है।
    reason: cross_reference
  - marker: b
    text: या, ‘वह सुरक्षित रखा गया’ अथवा ‘वह बचाया गया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנָבִיא
  choice: एक भविष्यद्वक्ता के द्वारा
  rationale: בְּ यहाँ साधन अथवा माध्यम को दर्शाता है। यह अनुवाद दोनों खंडों में मूल की दोहराई हुई समानांतर रचना बनाए रखता है और भविष्यद्वक्ता का नाम स्पष्ट रूप से जोड़े बिना स्रोत की अनिश्चितता बचाता है।
- source_word: הֶעֱלָה
  choice: ऊपर ले आया
  rationale: עלה के हिफ़ील रूप का सामान्य अर्थ ‘ऊपर ले आना’ है। मिस्र से निर्गमन के संदर्भ में यह मूल इब्रानी मुहावरे को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: מִמִּצְרַיִם
  choice: मिस्र से
  rationale: स्थानवाचक पद का स्वाभाविक और मानक हिन्दी रूप।
- source_word: נִשְׁמָר
  choice: वह सुरक्षित रखा गया
  rationale: שׁמר के निफ़ाल रूप का निष्क्रिय अर्थ ‘सुरक्षित रखा गया/रक्षा की गई’ है। पुल्लिंग एकवचन ‘वह’ का संदर्भ पिछले खंड के ‘इस्राएल’ से है; यह रूप मूल की संक्षिप्तता और निष्क्रिय वाच्य दोनों को बनाए रखता है।
theological_decisions:
- issue: दोनों खंडों में भविष्यद्वक्ता की अंतर्निहित पहचान
  choice: मुख्य पाठ में ‘एक भविष्यद्वक्ता’ रखा गया और मूसा की पहचान केवल टिप्पणी में संभावित रूप से बताई गई।
  alternative: ‘उस भविष्यद्वक्ता’ अथवा सीधे ‘मूसा’ कहना।
  rationale: इब्रानी पाठ भविष्यद्वक्ता का नाम नहीं देता। निर्गमन का संदर्भ मूसा की ओर संकेत करता है, पर मुख्य पाठ में नाम जोड़ना स्रोत की अलक्षितता को अनावश्यक रूप से समाप्त कर देता।
- issue: נִשְׁמָר में इस्राएल की रक्षा या संरक्षण
  choice: ‘वह सुरक्षित रखा गया’
  alternative: ‘उसकी रक्षा की गई’ अथवा ‘वह बचाए रखा गया’।
  rationale: यह निष्क्रिय अर्थ और इस्राएल को अंतर्निहित कर्ता-विषय के रूप में बनाए रखते हुए ‘रक्षा’ और ‘संरक्षण’ के बीच की अर्थ-व्याप्ति को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों खंडों में ‘एक भविष्यद्वक्ता के द्वारा’ की पुनरावृत्ति मूल इब्रानी की काव्यात्मक समानांतरता को जानबूझकर सुरक्षित रखती है।
