  text: So you[a], by your God, return; keep steadfast love and justice[b], and wait continually for your God.
translation:
  language: hi
  text: परन्तु तुम अपने परमेश्वर के सहारे[a] लौट आओ; अटल प्रेम और न्याय बनाए रखो, और सदा अपने परमेश्वर की प्रतीक्षा करते रहो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने परमेश्वर के पास लौट आओ” अथवा “अपने परमेश्वर के साथ लौट आओ।” इब्रानी में शाब्दिक रूप से “अपने परमेश्वर में/के द्वारा लौटो” जैसी असामान्य रचना है, जो साधन, संबंध या दिशा का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
