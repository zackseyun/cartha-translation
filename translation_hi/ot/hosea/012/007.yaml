lexical_decisions:
- source_word: בֵּאלֹהֶיךָ
  choice: अपने परमेश्वर के सहारे
  rationale: उपसर्ग ב साधन, संबंध या क्षेत्र का बोध करा सकता है। ‘के सहारे’ परमेश्वर पर निर्भरता व्यक्त करता है और इब्रानी की असामान्य रचना को पूरी तरह समतल नहीं करता।
- source_word: תָשׁוּב
  choice: लौट आओ
  rationale: שׁוּב का मूल अर्थ लौटना या फिरना है। यह अनुवाद वाचा-संबंधी वापसी का भाव बनाए रखता है, पर मुख्य पाठ में अधिक व्याख्यात्मक ‘पश्चाताप करो’ नहीं जोड़ता।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह पद निष्ठा, दया और संबंध में टिके रहनेवाले प्रेम को समेटता है। ‘अटल प्रेम’ आधुनिक हिन्दी में सहज रहते हुए इस व्यापक अर्थ को व्यक्त करता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: इस नैतिक आज्ञा में शब्द का आशय सही और न्यायपूर्ण आचरण से है; ‘न्याय’ इसे स्वाभाविक और स्पष्ट रूप में व्यक्त करता है।
- source_word: שְׁמֹר
  choice: बनाए रखो
  rationale: अटल प्रेम और न्याय जैसे गुणों के साथ ‘बनाए रखो’ स्वाभाविक हिन्दी है और निरंतर उनका पालन करने की आज्ञा व्यक्त करता है।
- source_word: וְקַוֵּה אֶל
  choice: की बाट जोहो
  rationale: קוה में प्रतीक्षा, आशा और अपेक्षा के मिले-जुले भाव हैं। ‘बाट जोहो’ लक्ष्य की ओर आशाभरी प्रतीक्षा को संक्षेप में सुरक्षित रखता है।
- source_word: תָּמִיד
  choice: सदा
  rationale: यह निरंतरता को स्पष्ट, सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या बुलाहट को स्पष्ट रूप से ‘पश्चाताप’ कहा जाए
  choice: लौट आओ
  alternative: पश्चाताप करो / फिर आओ
  rationale: यहाँ इब्रानी क्रिया का अर्थ ‘लौटना’ व्यापक है। ‘लौट आओ’ वाचा-संबंधी और आत्मिक बुलाहट को बनाए रखता है, पर उसे किसी संकुचित धर्मशास्त्रीय पारिभाषिक अर्थ में नहीं बाँधता।
- issue: בֵּאלֹהֶיךָ में परमेश्वर से संबंध की दिशा
  choice: अपने परमेश्वर के सहारे
  alternative: अपने परमेश्वर के पास / अपने परमेश्वर के साथ
  rationale: इब्रानी उपसर्ग ב यहाँ असामान्य है और साधन, संबंध या क्षेत्र का बोध दे सकता है। मुख्य पाठ में ‘के सहारे’ चुना गया है, जबकि अन्य संभव अर्थ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘के सहारे’ और ‘बाट जोहो’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि पादटिप्पणियाँ इब्रानी की वास्तविक व्याकरणिक और अर्थगत अनिश्चितता को स्पष्ट करती हैं।
