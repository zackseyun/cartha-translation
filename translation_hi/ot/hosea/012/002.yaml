source:
  edition: WLC
  text: אֶפְרַ֜יִם רֹעֶ֥ה ר֨וּחַ֙ וְ/רֹדֵ֣ף קָדִ֔ים כָּל הַ/יּ֕וֹם כָּזָ֥ב וָ/שֹׁ֖ד יַרְבֶּ֑ה וּ/בְרִית֙ עִם אַשּׁ֣וּר יִכְרֹ֔תוּ וְ/שֶׁ֖מֶן לְ/מִצְרַ֥יִם יוּבָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/002.yaml
  text: Ephraim feeds on wind and pursues the east wind all day long[a]; he multiplies lies and destruction. They make a covenant with Assyria[e][d][c][b], and oil is carried to Egypt.
translation:
  language: hi
  text: एप्रैम हवा खाता है[a] और दिन भर पूरब की हवा का पीछा करता है[b]; वह झूठ और विनाश को बढ़ाता है[c]। वे अश्शूर के साथ वाचा बाँधते हैं[d], और तेल मिस्र पहुँचाया जाता है[e]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हवा चराता है”; इब्रानी क्रिया का मूल अर्थ चराना, खिलाना या चरना है।
    reason: lexical_alternative
  - marker: b
    text: पूरब की हवा तपती और विनाशकारी मानी जाती थी; यह छवि व्यर्थता के साथ हानि का भाव भी रखती है।
    reason: cultural_note
  - marker: c
    text: या “मिथ्या और तबाही”; इब्रानी शब्द में हिंसक विनाश या लूट का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी में शाब्दिक मुहावरा “वाचा काटना” है, जिसका अर्थ वाचा या संधि करना है।
    reason: lexical_alternative
  - marker: e
    text: संभवतः जैतून का तेल कर, भेंट या राजनयिक भुगतान के रूप में मिस्र भेजा जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: רֹעֶה רוּחַ
  choice: हवा खाता है
  rationale: רעה का मूल अर्थ चराना या चरना/खाना है। רוּחַ के साथ यह ऐसी चीज़ से पोषण पाने की विडंबनापूर्ण छवि बनाता है जो खाली और निष्फल है; ‘हवा खाता है’ आधुनिक हिन्दी में इस रूपक को स्वाभाविक और सजीव रखता है।
- source_word: וְרֹדֵף קָדִים
  choice: और ... पुरवाई का पीछा करता है
  rationale: רדף का अर्थ पीछा करना है और קדים पूर्व दिशा से आने वाली गर्म, विनाशकारी हवा है। ‘पुरवाई’ ठोस मौसमी छवि को बनाए रखती है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह निरंतरता व्यक्त करने वाला स्वाभाविक हिन्दी रूप है।
- source_word: כָּזָב וָשֹׁד
  choice: झूठ और विनाश
  rationale: כָּזָב झूठ/मिथ्या को और שֹׁד विनाश, तबाही, हिंसक लूट को दर्शाता है। ‘विनाश’ यहाँ परिणाम और भविष्यद्वाणी के अभियोग दोनों को संक्षेप में व्यक्त करता है।
- source_word: יַרְבֶּה
  choice: वह ... बढ़ाता जाता है
  rationale: हिफ़ील रूप किसी वस्तु को बढ़ाने या बहुत करने का भाव देता है। एकवचन क्रिया का संबंध सामूहिक एकवचन ‘एप्रैम’ से रखा गया है।
- source_word: וּבְרִית עִם אַשּׁוּר יִכְרֹתוּ
  choice: वे अश्शूर के साथ वाचा बाँधते हैं
  rationale: כרת ברית का शाब्दिक रूप ‘वाचा काटना’ है, पर हिन्दी का प्रचलित समतुल्य ‘वाचा बाँधना’ है। ‘वे’ मूल पाठ में एकवचन से बहुवचन की वास्तविक संख्या-परिवर्तन को सुरक्षित रखता है।
- source_word: וְשֶׁמֶן לְמִצְרַיִם יוּבָל
  choice: और तेल मिस्र पहुँचाया जाता है
  rationale: שׁמן को बिना अनावश्यक विशिष्टीकरण के ‘तेल’ रखा गया है और יוּבָל की कर्मवाच्य क्रिया को ‘पहुँचाया जाता है’ से व्यक्त किया गया है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: मूल पाठ का विशिष्ट नाम सुरक्षित रखा गया है, यद्यपि होशे में यह प्रायः उत्तरी राज्य का प्रतिनिधित्व करता है।
theological_decisions:
- issue: राजनीतिक अभियोग में हवा का रूपक
  choice: हवा और पुरवाई की छवियों को मुख्य पाठ में बनाए रखना
  alternative: इसे ‘व्यर्थता और विनाश के पीछे चलता है’ कहकर स्पष्ट करना
  rationale: रूपक एप्रैम की निष्फल और हानिकारक विदेश-नीति पर भविष्यद्वक्ता के अभियोग का अभिन्न भाग है; उसे व्याख्यात्मक गद्य में बदलना मूल की काव्यात्मक शक्ति और अर्थ-बहुलता घटा देता।
- issue: एकवचन से बहुवचन का परिवर्तन
  choice: पहले ‘वह’ और फिर ‘वे’
  alternative: पूरे पद को केवल एकवचन या केवल बहुवचन में समतल करना
  rationale: इब्रानी में एप्रैम के लिए एकवचन क्रिया के बाद יִכְרֹתוּ बहुवचन आता है, संभवतः उसके लोगों या अगुवों की ओर संकेत करते हुए। इस तनाव को सुरक्षित रखा गया है।
- issue: שֹׁד का अर्थ-क्षेत्र
  choice: विनाश
  alternative: हिंसा; लूट; तबाही
  rationale: शब्द हिंसक उजाड़, लूट और विनाश के अर्थ-क्षेत्र में है। संदर्भ में ‘विनाश’ उपयुक्त है, जबकि अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज भविष्यद्वाणी-संबंधी गद्य। ‘एप्रैम’, ‘अश्शूर’, ‘वाचा’ और ‘मिस्र’ जैसे बाइबिलीय पद सुरक्षित हैं। काव्यात्मक रूपक और मूल का एकवचन-बहुवचन परिवर्तन जानबूझकर बनाए रखे गए हैं।
