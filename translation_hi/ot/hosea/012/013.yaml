base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/013.yaml
  text: Jacob fled to the field of Aram[a]; Israel served for a wife[b], and for a wife he kept watch.
translation:
  language: hi
  text: याकूब अराम के मैदान[a] की ओर भाग गया; इस्राएल ने पत्नी के लिए सेवा की, और पत्नी के लिए रखवाली की[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अराम देश की ओर।’ इब्रानी में शाब्दिक रूप से ‘अराम का मैदान’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पहरा दिया’ अथवा ‘देखभाल की।’ यह क्रिया भेड़-बकरियों या दूसरे पशुओं की रखवाली करने का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: भाग गया
  rationale: ברח का अर्थ भागना या पलायन करना है। ‘भाग गया’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया की कथात्मक तीव्रता बनाए रखता है।
- source_word: שְׂדֵה אֲרָם
  choice: अराम के मैदान
  rationale: שָׂדֶה का मूल अर्थ ‘मैदान/खुला क्षेत्र’ है और यहाँ यह अराम के प्रदेश या देहात का संकेत देता है। मुख्य पाठ में इब्रानी बिंब रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַיַּעֲבֹד
  choice: सेवा की
  rationale: עבד का अर्थ ‘सेवा करना/काम करना’ है। ‘सेवा की’ लाबान के अधीन याकूब की सेवा से मेल खाता और मूल शब्द का व्यापक अर्थ बनाए रखता है।
- source_word: בְּאִשָּׁה
  choice: पत्नी के लिए
  rationale: 'संदर्भ में בְּ प्रयोजन या प्रतिफल का भाव देता है: याकूब ने पत्नी पाने के लिए सेवा की। ‘पत्नी के लिए’ संक्षिप्त और स्पष्ट है।'
- source_word: שָׁמָר
  choice: रखवाली की
  rationale: שׁמר का अर्थ रखना, पहरा देना या रक्षा करना हो सकता है। याकूब-लाबान प्रसंग में यह संभवतः पशुओं की रखवाली की ओर संकेत करता है, पर मुख्य पाठ इस कर्म का विषय जोड़कर अस्पष्टता को समाप्त नहीं करता।
- source_word: וּבְאִשָּׁה
  choice: और पत्नी के लिए
  rationale: इब्रानी में ‘पत्नी के लिए’ की पुनरावृत्ति अलंकारिक समानांतरता बनाती है; इसलिए हिन्दी में भी इसे बनाए रखा गया है।
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: याकूब / इस्राएल
  rationale: मूल पाठ जानबूझकर कुलपिता के दोनों नामों का प्रयोग करता है। दोनों को बनाए रखने से व्यक्ति याकूब और उससे निकले राष्ट्र इस्राएल के बीच काव्यात्मक-धर्मवैचारिक संबंध सुरक्षित रहता है।
theological_decisions:
- issue: याकूब/इस्राएल नाम-परिवर्तन को बनाए रखना
  choice: मुख्य पाठ में दोनों नाम अलग-अलग रखे गए
  alternative: शैलीगत सहजता के लिए पूरे पद में केवल ‘याकूब’ या केवल ‘इस्राएल’ कहना
  rationale: इब्रानी का नाम-परिवर्तन अर्थपूर्ण है और कुलपिता तथा राष्ट्र—दोनों की पहचान को एक साथ सामने लाता है; इसे समतल करना उचित नहीं।
- issue: שָׁמָר के कर्म को स्पष्ट करना
  choice: मुख्य पाठ में केवल ‘रखवाली की’ कहा गया; ‘भेड़ों/पशुओं’ को नहीं जोड़ा गया
  alternative: ‘उसने भेड़ों की रखवाली की’ अनुवाद करना
  rationale: उत्पत्ति की कथा से पशुओं का आशय संभावित है, पर इस पद के इब्रानी पाठ में कर्म व्यक्त नहीं है। इसलिए निहितार्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। इब्रानी की दो समानांतर पंक्तियाँ, ‘पत्नी के लिए’ की पुनरावृत्ति और याकूब/इस्राएल नाम-परिवर्तन सुरक्षित रखे गए हैं।
