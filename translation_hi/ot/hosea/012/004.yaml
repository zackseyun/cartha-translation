  text: In the womb he grasped his brother’s heel[b][a], and in his strength he contended with God.
translation:
  language: hi
  text: गर्भ में उसने अपने भाई की एड़ी पकड़ ली थी[a], और अपने सामर्थ्य से उसने परमेश्वर से संघर्ष किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अपने भाई को एड़ी से पकड़ लिया था।” इब्रानी क्रिया याकूब के जन्म-वृत्तांत की याद दिलाती है और किसी का स्थान ले लेने का विस्तृत भाव भी रख सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसने एक दिव्य प्राणी से संघर्ष किया।” अगले पद में उस हस्ती को “दूत” कहा गया है; होशे का कथन इन दोनों वर्णनों के बीच के तनाव को बनाए रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בַּבֶּטֶן
  choice: गर्भ में ही
  rationale: בטן का अर्थ पेट या गर्भ हो सकता है; याकूब के जन्म-वृत्तांत के संकेत के कारण यहाँ ‘गर्भ’ स्वाभाविक और संदर्भानुकूल है। ‘ही’ हिन्दी में उस आरंभिक अवस्था पर बल को सहज बनाता है।
- source_word: עָקַב
  choice: एड़ी पकड़ ली थी
  rationale: यह क्रिया याकूब के जन्म के समय अपने भाई की एड़ी पकड़ने की ठोस छवि और उसके नाम से जुड़े शब्द-संकेत को बनाए रखती है; ‘छल किया’ या ‘स्थान ले लिया’ अर्थ को अनावश्यक रूप से निश्चित कर देते।
- source_word: אָחִיו
  choice: अपने भाई की
  rationale: स्वत्ववाचक हिन्दी संरचना मूल के पारिवारिक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करती है।
- source_word: וּבְאוֹנוֹ
  choice: अपनी शक्ति में
  rationale: אוֹן शक्ति, सामर्थ्य या बल का बोध करा सकता है। ‘अपनी शक्ति में’ मूल की पूर्वसर्गीय रचना के निकट रहते हुए आयु या पुरुषत्व का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: שָׂרָה
  choice: संघर्ष किया
  rationale: क्रिया संघर्ष या जूझने का अर्थ देती है और याकूब के वृत्तांत तथा ‘इस्राएल’ नाम की ओर संकेत करती है। यह विजय का परिणाम जोड़े बिना संघर्ष को व्यक्त करती है।
- source_word: אֶת אֱלֹהִים
  choice: परमेश्वर से
  rationale: संघर्ष की क्रिया के साथ यह हिन्दी में स्वाभाविक संबंध-चिह्न है। मुख्य पाठ में אֱלֹהִים को ‘परमेश्वर’ कहना मूल शब्द को बनाए रखता है, जबकि अगले पद के ‘दूत’ संबंधी तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: याकूब के संघर्ष में אֱלֹהִים का संदर्भ
  choice: परमेश्वर
  alternative: एक दिव्य प्राणी; अगले पद के प्रकाश में एक दूत
  rationale: इस पद के इब्रानी पाठ में אֱלֹהִים है, इसलिए मुख्य पाठ में ‘परमेश्वर’ रखा गया है। अगला पद उस हस्ती को ‘दूत’ कहता है; अनुवाद इस तनाव का सामंजस्य करके उसे मिटाने के बजाय वैकल्पिक समझ को पादटिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। वाक्य की समानांतर संरचना रखी गई है और जन्म-वृत्तांत की ठोस छवि को व्याख्यात्मक शब्दों से नहीं बदला गया।
