  yaml_path: translation/ot/hosea/012/008.yaml
  text: A merchant—with deceptive scales in his hand—loves to oppress[a].
translation:
  language: hi
  text: व्यापारी[a] के हाथ में धोखे के तराज़ू हैं; उसे शोषण करना प्रिय है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘कनान’। इसका अर्थ ‘कनानी’ या, विस्तारित अर्थ में, ‘व्यापारी’ भी समझा जा सकता है; धोखे के तराज़ुओं का संदर्भ यहाँ व्यापारिक अर्थ के अनुकूल है।
    reason: वैकल्पिक पाठ/शब्दार्थ की वास्तविक द्विअर्थकता सुरक्षित रखना
lexical_decisions:
- source_word: כְּנַעַן
  choice: व्यापारी
  rationale: मूल रूप से यह शब्द ‘कनान’ है, पर बेईमान तराज़ुओं के निकट संदर्भ में इसका ‘व्यापारी’ अर्थ सबसे स्वाभाविक है। मूल शब्द की वास्तविक द्विअर्थकता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: בְּיָדוֹ
  choice: के हाथ में
  rationale: यह ठोस चित्र को बनाए रखता है कि छलपूर्ण तराज़ू उसके हाथ में हैं।
- source_word: מֹאזְנֵי מִרְמָה
  choice: छल के तराज़ू
  rationale: संबंधवाचक रचना हिब्रू संज्ञा ‘छल’ को बनाए रखते हुए आधुनिक हिन्दी में कपटपूर्ण तौल का स्पष्ट बोध कराती है।
- source_word: לַעֲשֹׁק
  choice: अत्याचार करना
  rationale: क्रिया में दबाने, शोषण करने और ठगने का अर्थ-क्षेत्र है। व्यापारिक संदर्भ में ‘ठगना’ संभव है, पर ‘अत्याचार करना’ व्यापक नैतिक बल और मूल अर्थ की व्यापकता बनाए रखता है।
- source_word: אָהֵב
  choice: पसंद करता है
  rationale: यह गलत काम के प्रति उसकी स्थायी प्रवृत्ति और लगाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; शाब्दिक ‘प्रेम करता है’ यहाँ कम स्वाभाविक लगता।
theological_decisions:
- issue: כְּנַעַן को व्यक्तिवाचक नाम ‘कनान’ माना जाए या जातिवाचक अर्थ ‘व्यापारी’ में समझा जाए
  choice: मुख्य पाठ में ‘व्यापारी’
  alternative: ‘कनान’ अथवा ‘कनानी’
  rationale: छल के तराज़ुओं वाला तत्काल संदर्भ व्यापारिक अर्थ का समर्थन करता है। फिर भी ‘कनान’ शब्द से उत्पन्न भविष्यवाणी-संबंधी संकेत और इस्राएल/एप्रैम की कनान से संभावित आलंकारिक पहचान को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और स्पष्ट शैली। ‘तराज़ू’ सामान्य पाठक के लिए ‘तुला’ से अधिक स्वाभाविक है। अर्धविराम मूल कथन के दो निकट जुड़े खंडों को स्पष्ट करता है।
