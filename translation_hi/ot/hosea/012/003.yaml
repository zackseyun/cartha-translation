id: HOS.12.3
reference: Hosea 12:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/רִ֥יב לַֽ/יהוָ֖ה עִם יְהוּדָ֑ה וְ/לִ/פְקֹ֤ד עַֽל יַעֲקֹב֙ כִּ/דְרָכָ֔י/ו כְּ/מַעֲלָלָ֖י/ו יָשִׁ֥יב לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/003.yaml
  text: Yahweh has a charge against Judah[a], and he will punish Jacob according to his ways[b]; according to his deeds he will repay him.
translation:
  language: hi
  text: याहवे का यहूदा के विरुद्ध एक मुकदमा है[a], और वह याकूब से उसके चालचलन के अनुसार लेखा लेगा[b]; उसके कामों के अनुसार वह उसे प्रतिफल देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे का यहूदा से विवाद है” अथवा “याहवे ने यहूदा पर अभियोग लगाया है।” इब्रानी में कानूनी विवाद की भाषा प्रयुक्त हुई है।
    reason: lexical_alternative
  - marker: b
    text: या “वह याकूब को दंड देगा।” इब्रानी पदबंध का शाब्दिक भाव “किसी पर ध्यान देना/उसका लेखा लेना” है और न्याय के संदर्भ में यह प्रायः दंड देने का अर्थ रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: मुकदमा
  rationale: भविष्यवाणी के इस न्यायिक संदर्भ में यह शब्द कानूनी विवाद या अभियोग का बोध कराता है। ‘मुकदमा’ सहज हिन्दी में उसकी न्यायालय-संबंधी शक्ति बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: עִם יְהוּדָה
  choice: यहूदा के विरुद्ध
  rationale: רִיב के साथ עִם विवाद के विपक्षी पक्ष को सूचित करता है; इसलिए ‘के विरुद्ध’ न्यायिक संबंध को स्पष्ट करता है।
- source_word: לִפְקֹד עַל
  choice: से ... लेखा लेगा
  rationale: यह पदबंध न्याय अथवा दंड के लिए किसी को जवाबदेह ठहराने का अर्थ दे सकता है। ‘लेखा लेगा’ न्यायिक विचार को रखता है और केवल दंड के परिणाम तक अर्थ को सीमित नहीं करता।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: मूल पाठ का नाम ज्यों का त्यों रखा गया है, जिससे कुलपिता और उससे उत्पन्न समुदाय के बीच संभावित आलंकारिक संबंध बना रहता है।
- source_word: כִדְרָכָיו
  choice: उसके चालचलन के अनुसार
  rationale: बहुवचन ‘मार्गों’ का यहाँ नैतिक आचरण से संबंध है। ‘चालचलन’ आधुनिक हिन्दी में इस रूपक का स्वाभाविक अर्थ व्यक्त करता है।
- source_word: כְמַעֲלָלָיו
  choice: उसके कामों के अनुसार
  rationale: यह शब्द नैतिक अर्थ लिए हुए कर्मों या कार्यों को सूचित करता है; ‘कामों’ से अर्थ साधारण पाठक के लिए स्पष्ट रहता है।
- source_word: יָשִׁיב לוֹ
  choice: उसे प्रतिफल देगा
  rationale: हिफ़ील रूप और ל के साथ यह किए हुए कर्मों के अनुरूप प्रत्युत्तर या प्रतिदान को दर्शाता है। ‘प्रतिफल देगा’ उचित न्यायपूर्ण प्रतिदान को व्यक्त करता है।
theological_decisions:
- issue: न्याय में यहूदा और याकूब का संबंध
  choice: 'दोनों नाम मूल पाठ के अनुसार अलग रखे गए हैं: मुकदमे का पक्ष यहूदा है और लेखा तथा प्रतिफल का लक्ष्य याकूब।'
  alternative: ‘याकूब’ को बिना किसी भेद के यहूदा और इस्राएल सहित पूरे राष्ट्र का पर्याय मानना।
  rationale: पद स्वयं दोनों नामों का प्रयोग करता है। अनुवाद उनके बीच के संबंध को निश्चित करके पाठ की संभावित व्यापकता और तनाव को समाप्त नहीं करता।
- issue: לִפְקֹד עַל में दंड अथवा न्यायिक लेखे का बल
  choice: ‘लेखा लेगा’
  alternative: ‘दंड देगा’
  rationale: संदर्भ दंडात्मक न्याय का है, फिर भी इब्रानी पदबंध का मूल भाव किसी पर ध्यान देकर उसे जवाबदेह ठहराना भी समेटता है। मुख्य पाठ में व्यापक न्यायिक अर्थ रखा गया है और दंडात्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। न्यायिक भाषा के लिए ‘मुकदमा’ और ‘लेखा लेना’ चुने गए हैं; ‘याहवे,’ ‘यहूदा’ और ‘याकूब’ नाम मूल पाठ की भिन्नता को सुरक्षित रखते हैं।
