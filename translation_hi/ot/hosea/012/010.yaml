source:
  edition: WLC
  text: וְ/אָנֹכִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם עֹ֛ד אוֹשִֽׁיבְ/ךָ֥ בָ/אֳהָלִ֖ים כִּ/ימֵ֥י מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/010.yaml
  text: Yet I am Yahweh your God from the land of Egypt; I will again make you dwell in tents[a], as in the days of the appointed feast.
translation:
  language: hi
  text: फिर भी मैं याहवे, मिस्र देश के समय से तुम्हारा परमेश्वर हूँ; मैं तुम्हें फिर तंबुओं में बसाऊँगा, जैसे नियत पर्व के दिनों की तरह।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नियत समय के दिनों की तरह” अथवा “पर्व के दिनों की तरह।” यहाँ झोपड़ियों के पर्व की ओर संकेत हो सकता है, जब इस्राएली अस्थायी आश्रयों में रहते थे।
    reason: מוֹעֵד की अर्थगत व्यापकता और तंबुओं के कारण संभावित पर्व-संकेत को सुरक्षित रखना।
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: फिर भी मैं
  rationale: संयोजक וְ को प्रसंग के विरोधात्मक बल के अनुसार ‘फिर भी’ और बलसूचक אָנֹכִי को स्पष्ट ‘मैं’ से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय सहित वाचा-संबंधी संबोधन को सीधे व्यक्त करता है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: מִן के स्थानिक अथवा आरंभ-बिंदु संबंधी अर्थ को खुला रखते हुए निर्गमन की ऐतिहासिक स्मृति सुरक्षित रखी गई है।
- source_word: עֹד
  choice: फिर
  rationale: भावी कारणवाचक क्रिया के साथ यह पुनरावृत्ति का अर्थ देता है—परमेश्वर उन्हें एक बार फिर तंबुओं में बसाएगा।
- source_word: אוֹשִׁיבְךָ
  choice: मैं तुम्हें ... बसाऊँगा
  rationale: ישׁב के हिफ़ील रूप का कारणवाचक अर्थ स्वाभाविक हिन्दी में ‘बसाऊँगा’ से व्यक्त किया गया है।
- source_word: בָאֳהָלִים
  choice: तंबुओं में
  rationale: शब्द का सीधा अर्थ वास्तविक तंबू है; मुख्य पाठ में बाद की पारंपरिक पर्व-संज्ञा आरोपित नहीं की गई।
- source_word: כִּימֵי מוֹעֵד
  choice: जैसे नियत पर्व के दिनों में
  rationale: מוֹעֵד में नियत समय और पर्व दोनों के अर्थ निहित हो सकते हैं। तंबुओं के उल्लेख के कारण पर्व-संदर्भ संभावित है, जबकि ‘नियत’ उसके निर्धारित समय के भाव को बनाए रखता है।
theological_decisions:
- issue: तंबुओं में फिर बसाना प्रतिज्ञा है, दंड की धमकी है, या विडंबनापूर्ण उलटाव
  choice: कथन को बिना सकारात्मक या नकारात्मक मूल्यांकन जोड़े सीधे रखा गया है।
  alternative: इसे नए निर्गमन और संगति की प्रतिज्ञा, निर्वासन और अभाव की धमकी, अथवा जंगल-काल/झोपड़ियों के पर्व के संकेत के रूप में स्पष्ट किया जा सकता था।
  rationale: इब्रानी पाठ क्रिया तो बताता है, पर उसका मूल्यांकन स्पष्ट नहीं करता; इसलिए अनुवाद इस धर्मवैचारिक तनाव को खुला रखता है।
- issue: מוֹעֵד का विशिष्ट संकेत
  choice: मुख्य पाठ में ‘नियत पर्व’ रखा गया है।
  alternative: ‘नियत समय’, ‘पर्व’, या विशेष रूप से ‘झोपड़ियों का पर्व’।
  rationale: तंबुओं का निकट संदर्भ झोपड़ियों के पर्व की ओर संकेत कर सकता है, पर मूल पाठ उस पर्व का नाम स्पष्ट रूप से नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। एकवचन ‘तुम्हारा/तुम्हें’ इब्रानी के द्वितीय पुरुष पुल्लिंग एकवचन को दर्शाता है। ‘याहवे’ व्यक्तिगत ईश्वरीय नाम का लिप्यंतरण है।
