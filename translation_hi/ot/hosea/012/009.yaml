language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶפְרַ֔יִם אַ֣ךְ עָשַׁ֔רְתִּי מָצָ֥אתִי א֖וֹן לִ֑/י כָּל יְגִיעַ֕/י לֹ֥א יִמְצְאוּ לִ֖/י עָוֺ֥ן אֲשֶׁר חֵֽטְא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/009.yaml
  text: And Ephraim said[a], “Surely I have become rich; I have found wealth for myself[c][b]. In all my labor they will not find in me iniquity that is sin.”
translation:
  language: hi
  text: और एप्रैम ने कहा, “निश्चय ही मैं धनी हो गया हूँ; मैंने अपने लिए धन[a] प्राप्त किया है। मेरी सारी मेहनत में वे मुझमें ऐसा कोई अधर्म नहीं पाएँगे जो पाप हो।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैंने अपने लिए सामर्थ्य प्राप्त किया है।” इब्रानी शब्द का अर्थ सामर्थ्य, संपत्ति या धन हो सकता है; यहाँ संभवतः भौतिक धन अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरी सारी कमाई में वे मुझमें ऐसा कोई अधर्म नहीं पाएँगे जो पाप हो।” इस उपवाक्य की इब्रानी भाषा संक्षिप्त है और ‘मेहनत’ का अर्थ उससे हुई ‘कमाई’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यह अव्यय एप्रैम के आत्मविश्वास से भरे दावे पर बल देता है; ‘निश्चय ही’ इस जोर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָשַׁרְתִּי
  choice: मैं धनी हो गया हूँ
  rationale: पूर्ण क्रिया प्राप्त अवस्था को दर्शाती है; यह अनुवाद धनवान बनने के परिणामात्मक भाव को बनाए रखता है।
- source_word: אוֹן
  choice: धन
  rationale: शब्द का अर्थ सामर्थ्य, संपत्ति या धन हो सकता है; व्यापार और अर्जन के इस संदर्भ में ‘धन’ सर्वाधिक उपयुक्त है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: כָּל יְגִיעַי
  choice: मेरी सारी मेहनत
  rationale: संज्ञा परिश्रम अथवा उससे प्राप्त कमाई दोनों का संकेत दे सकती है। मुख्य पाठ में ‘मेहनत’ मूल अर्थ के निकट है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: יִמְצְאוּ לִי
  choice: वे मुझमें ... नहीं पाएँगे
  rationale: अनिर्दिष्ट बहुवचन कर्ता को ‘वे’ से रखा गया है और לִי को यहाँ दोष अथवा अपराध किसी व्यक्ति में पाए जाने के अर्थ में समझा गया है।
- source_word: עָוֺן אֲשֶׁר חֵטְא
  choice: ऐसा कोई अधर्म ... जो पाप हो
  rationale: यह संक्षिप्त और कठिन वाक्यांश अधर्म तथा पाप के संबंध को पूरी तरह स्पष्ट नहीं करता। अपेक्षाकृत शाब्दिक रूप मूल की तनावपूर्ण, आत्म-पक्षसमर्थक अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: एप्रैम के कथन में आत्म-औचित्य और नैतिक विडंबना
  choice: कथन को एप्रैम का सीधा, आत्मविश्वासपूर्ण दावा बनाकर रखा गया है, बिना उसे सत्य ठहराए।
  alternative: मुख्य पाठ में स्पष्ट कर देना कि उसका दावा छलपूर्ण या विडंबनापूर्ण है।
  rationale: इब्रानी पाठ केवल एप्रैम की वाणी प्रस्तुत करता है। व्यापक संदर्भ उसकी आलोचना करता है; इसलिए व्याख्यात्मक निंदा को पद के भीतर नहीं जोड़ा गया।
- issue: עָוֺן और חֵטְא का संबंध
  choice: ‘ऐसा कोई अधर्म ... जो पाप हो’ के द्वारा मूल की संक्षिप्त और कुछ असहज संरचना बनाए रखी गई है।
  alternative: ‘ऐसा कोई अपराध नहीं पाएँगे जिसे पाप ठहराया जा सके’ अथवा ‘कोई ऐसा दोष नहीं पाएँगे जो दंडनीय पाप हो।’
  rationale: वैकल्पिक रूप एप्रैम की कानूनी सफाई को अधिक स्पष्ट करते हैं, पर ‘दंडनीय’ जैसा विचार मूल में प्रत्यक्ष नहीं है। मुख्य पाठ अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण रूप अपनाया गया है। ‘धनी’, ‘धन’, ‘मेहनत’, ‘अधर्म’ और ‘पाप’ सामान्य पाठक के लिए बोधगम्य हैं तथा पद के आर्थिक और नैतिक दोनों आयाम बनाए रखते हैं।
