base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/011.yaml
  text: I spoke through the prophets[a]; I myself multiplied visions[c][b], and through the hand of the prophets I gave parables.
translation:
  language: hi
  text: मैंने भविष्यद्वक्ताओं के द्वारा बात की[a]; मैंने स्वयं बहुत-से दर्शन दिए, और भविष्यद्वक्ताओं के हाथ से[b] दृष्टान्त दिए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने भविष्यद्वक्ताओं से बात की।” यहाँ इब्रानी संबंधबोधक शब्द के एक से अधिक अर्थ हो सकते हैं, यद्यपि समानांतर पंक्तियाँ भविष्यद्वक्ताओं के माध्यम से बोलने के अर्थ का समर्थन करती हैं।
    reason: alternative_reading
  - marker: b
    text: “भविष्यद्वक्ताओं के हाथ से” एक इब्रानी मुहावरा है, जिसका अर्थ है “भविष्यद्वक्ताओं के द्वारा।”
    reason: lexical_alternative
  - marker: c
    text: या, “उपमाओं में कहा” अथवा “समानताओं का प्रयोग किया।” इब्रानी क्रिया कठिन है और रूपकात्मक या दृष्टान्तात्मक कथन की ओर संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתִּי עַל הַנְּבִיאִים
  choice: मैंने भविष्यद्वक्ताओं के द्वारा कहा
  rationale: עַל यहाँ कई अर्थ दे सकता है—‘से/को’, ‘के विषय में’, अथवा माध्यम का भाव। अगली समानांतर पंक्ति में भविष्यद्वक्ताओं के द्वारा कार्य किए जाने के स्पष्ट भाव के कारण मुख्य पाठ में माध्यम का अर्थ रखा गया है, जबकि अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: וְאָנֹכִי
  choice: मैंने स्वयं
  rationale: स्वतंत्र सर्वनाम אָנֹכִי कर्ता पर विशेष बल देता है; ‘स्वयं’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חָזוֹן הִרְבֵּיתִי
  choice: बहुत-से दर्शन दिए
  rationale: רבה के हिफ़ईल रूप का शाब्दिक भाव ‘बहुगुणित करना’ है। आधुनिक हिन्दी में ‘बहुत-से दर्शन दिए’ उसी प्रचुरता और प्रकाशन के माध्यम को स्पष्ट तथा सहज रूप में रखता है।
- source_word: וּבְיַד הַנְּבִיאִים
  choice: भविष्यद्वक्ताओं के हाथों
  rationale: בְיַד का शाब्दिक चित्र ‘हाथ के द्वारा’ है और यह साधन या प्रतिनिधि के माध्यम को सूचित करता है। ‘के हाथों’ हिन्दी में उस चित्र और माध्यम—दोनों को बनाए रखता है।
- source_word: אֲדַמֶּה
  choice: दृष्टान्त दिए
  rationale: דמה का यह रूप कठिन है और समानताओं, उपमाओं या दृष्टान्तात्मक कथन के प्रयोग का संकेत दे सकता है। ‘दृष्टान्त दिए’ संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: भविष्यद्वाणी के प्रकाशन का माध्यम
  choice: परमेश्वर ने भविष्यद्वक्ताओं के द्वारा वचन, दर्शन और दृष्टान्त दिए।
  alternative: पहली पंक्ति का अर्थ यह भी हो सकता है कि परमेश्वर ने भविष्यद्वक्ताओं से कहा, न कि उनके द्वारा लोगों से कहा।
  rationale: पद्य की समानांतर रचना माध्यम के अर्थ का समर्थन करती है, पर עַל की वास्तविक व्याकरणिक अस्पष्टता को पादटिप्पणी में रखा गया है; इस प्रकार किसी विशेष सिद्धान्त को पाठ पर आरोपित नहीं किया गया।
- issue: अंतिम क्रिया אֲדַמֶּה का अर्थ
  choice: दृष्टान्त दिए
  alternative: उपमाओं में कहा / समानताओं का प्रयोग किया
  rationale: क्रिया का ठीक आशय विवादित है। मुख्य पाठ में भविष्यद्वक्ताओं के माध्यम से रूपकात्मक संप्रेषण का स्वाभाविक हिन्दी रूप चुना गया है, जबकि उसके व्यापक अर्थ-क्षेत्र को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘भविष्यद्वक्ता’, ‘दर्शन’ और ‘दृष्टान्त’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। इब्रानी मुहावरे ‘हाथों’ को बनाए रखते हुए उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
