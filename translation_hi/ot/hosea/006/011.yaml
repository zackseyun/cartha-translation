  text: Also for you[a], Judah, a harvest is appointed[b], when I restore the fortunes of my people.
translation:
  language: hi
  text: यहूदा, तेरे लिए भी कटनी ठहराई गई है[a], जब मैं अपनी प्रजा की दशा फिर से बहाल करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे लिए भी कटनी रखी गई है।”
    reason: lexical_alternative
  - marker: b
    text: या, शाब्दिक रूप से, “जब मैं अपनी प्रजा की बन्धुआई को लौटाऊँगा।” इब्रानी अभिव्यक्ति का अर्थ अपनी प्रजा की दशा या भाग्य को बहाल करना भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यहूदा को पिछले प्रसंग में कही गई बात के साथ जोड़ता है और इब्रानी के योगात्मक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: יְהוּדָה
  choice: हे यहूदा
  rationale: प्रत्यक्ष संबोधन को आधुनिक हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: שָׁת
  choice: ठहराई गई है
  rationale: मूल अर्थ ‘रखना/नियुक्त करना’ है; निष्क्रिय हिन्दी रचना उस भाव को व्यक्त करती है कि यहूदा के लिए कटनी निश्चित की गई है।
- source_word: קָצִיר
  choice: कटनी
  rationale: फसल काटने अथवा कटनी का मूल रूपक बनाए रखता है और उसे न्याय या आशीष के रूप में व्याख्यायित नहीं करता।
- source_word: לָךְ
  choice: तेरे लिए
  rationale: यहूदा को संबोधित स्त्रीलिंग एकवचन प्रत्यय का स्वाभाविक हिन्दी रूप है।
- source_word: בְּשׁוּבִי
  choice: जब मैं ... फिर से बहाल करूँगा
  rationale: इब्रानी पुनर्स्थापन-सूत्र में שוב के अर्थ को प्रसंगानुकूल रूप से व्यक्त करता है।
- source_word: שְׁבוּת
  choice: भाग्य
  rationale: यह पदबंध दुर्दशा को पलटने और पूर्व दशा बहाल करने का अर्थ दे सकता है; ‘भाग्य को बहाल करना’ व्यापक पुनर्स्थापन को व्यक्त करता है, जबकि ‘बन्धुआई’ की औपचारिक सम्भावना पादटिप्पणी में रखी गई है।
- source_word: עַמִּי
  choice: अपनी प्रजा
  rationale: वाचा-संबंधी अभिव्यक्ति ‘मेरी प्रजा’ को वक्ता-सापेक्ष स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘कटनी’ का अर्थ न्याय है या आशीष
  choice: मुख्य पाठ में रूपक को बिना किसी विशेषण के ‘कटनी’ ही रखा गया
  alternative: ‘दण्ड की कटनी’ अथवा ‘आशीष की कटनी’
  rationale: निकटवर्ती प्रसंग न्याय की ओर संकेत करता है, पर अगला खंड पुनर्स्थापन की भाषा लाता है; इसलिए मूल पाठ का तनाव बनाए रखा गया है।
- issue: שְׁבוּת का आशय सामान्य पुनर्स्थापन है या बन्धुआई से वापसी
  choice: मुख्य पाठ में ‘भाग्य को फिर से बहाल करना’
  alternative: ‘बन्धुआई को लौटा लाना’
  rationale: यह भविष्यद्वाणी-साहित्य का प्रचलित पुनर्स्थापन-सूत्र है और व्यापक दुर्दशा-पलटाव का अर्थ दे सकता है; फिर भी अधिक शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज संबोधन अपनाया गया है। ‘कटनी’ रूपक को जानबूझकर अस्पष्ट रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
