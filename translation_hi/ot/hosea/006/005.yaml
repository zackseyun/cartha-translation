source:
  edition: WLC
  text: עַל כֵּ֗ן חָצַ֨בְתִּי֙ בַּ/נְּבִיאִ֔ים הֲרַגְתִּ֖י/ם בְּ/אִמְרֵי פִ֑/י וּ/מִשְׁפָּטֶ֖י/ךָ א֥וֹר יֵצֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/005.yaml
  text: Therefore I have hewn them by the prophets; I have slain them by the words of my mouth[a], and my judgments go forth like light.
translation:
  language: hi
  text: इसलिए मैंने नबियों के द्वारा उन्हें काट डाला; अपने मुँह के वचनों से मैंने उन्हें मार डाला; और तुम्हारे न्याय-निर्णय प्रकाश के समान प्रकट होते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मेरा न्याय प्रकाश के समान प्रकट होता है।” स्वरांकित इब्रानी पाठ में “तुम्हारे न्याय-निर्णय” है, पर कुछ व्याख्याकार संदर्भ के आधार पर इसे परमेश्वर का न्याय समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पिछले आरोप के परिणाम को प्रस्तुत करता है और आधुनिक हिन्दी में संक्षिप्त तथा स्वाभाविक है।
- source_word: חָצַבְתִּי
  choice: मैंने…काट डाला
  rationale: मूल क्रिया पत्थर या लकड़ी काटने/तराशने के लिए प्रयुक्त होती है। यहाँ अगले समानांतर खंड ‘मार डाला’ के साथ इसका कठोर, प्रहारात्मक रूपक सुरक्षित रखा गया है।
- source_word: בַּנְּבִיאִים
  choice: नबियों के द्वारा
  rationale: यहाँ ב instrumental है; नबी परमेश्वर की कार्रवाई के माध्यम हैं।
- source_word: הֲרַגְתִּים
  choice: मैंने उन्हें मार डाला
  rationale: यह मूल क्रिया की तीव्रता को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּאִמְרֵי פִי
  choice: अपने मुँह के वचनों से
  rationale: ईश्वरीय वाणी की मूर्त छवि को बनाए रखते हुए हिन्दी में सहज अभिव्यक्ति देता है।
- source_word: וּמִשְׁפָּטֶיךָ
  choice: और तुम्हारे न्याय-निर्णय
  rationale: प्रदत्त मसोराई स्वरांकन में द्वितीय पुरुष एकवचन प्रत्यय ‘तुम्हारे’ है। ‘न्याय-निर्णय’ न्यायिक अर्थ को स्पष्ट करता है और पाठ की कठिनता को बदले बिना सुरक्षित रखता है।
- source_word: אוֹר יֵצֵא
  choice: प्रकाश के समान प्रकट होते हैं
  rationale: यद्यपि स्पष्ट तुलनात्मक अव्यय नहीं है, वाक्य प्रकाश जैसी स्पष्ट अभिव्यक्ति का बोध देता है। ‘प्रकट होते हैं’ יצא के बाहर आने/सामने आने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: וּמִשְׁפָּטֶיךָ में प्रत्यय और न्याय का कर्ता/संबंध
  choice: तुम्हारे न्याय-निर्णय प्रकाश के समान प्रकट होते हैं
  alternative: मेरा न्याय प्रकाश के समान प्रकट होता है
  rationale: प्रदत्त इब्रानी पाठ का स्वरांकन ‘तुम्हारे’ का समर्थन करता है, भले ही प्रथम पुरुष में बोल रहे परमेश्वर के संदर्भ में यह कठिन हो। संदर्भगत रूप से ‘मेरा न्याय’ भी समझा गया है; इसलिए मूल पाठ की कठिनता मुख्य पाठ में रखी गई और वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। ‘काट डाला’ और ‘मार डाला’ भविष्यद्वक्ताओं के संदेश द्वारा होने वाले कठोर न्याय की समानांतर छवि बनाए रखते हैं। पादटिप्पणी-चिह्न [a] मुख्य पाठ में स्पष्ट रूप से दिया गया है।
