id: HOS.6.7
reference: Hosea 6:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֵ֕מָּה כְּ/אָדָ֖ם עָבְר֣וּ בְרִ֑ית שָׁ֖ם בָּ֥גְדוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/007.yaml
  text: But they[a], like Adam, transgressed the covenant; there they dealt faithlessly with me.
translation:
  language: hi
  text: परन्तु उन्होंने आदम[a] के समान वाचा का उल्लंघन किया; वहाँ उन्होंने मुझसे विश्वासघात किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य के समान” अथवा “मानवजाति के समान।” इब्रानी शब्द אָדָם व्यक्तिगत रूप से आदम या सामान्य रूप से मानवता—दोनों को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵמָּה
  choice: परन्तु उन्होंने
  rationale: सर्वनाम पर बल है, और प्रसंग में संयोजक पिछले सकारात्मक कथन के विपरीत आचरण दिखाता है; इसलिए ‘परन्तु उन्होंने’ स्वाभाविक रूप से विरोध और बल दोनों व्यक्त करता है।
- source_word: כְּאָדָם
  choice: आदम के समान
  rationale: אָדָם व्यक्तिगत नाम ‘आदम’ या सामान्यतः ‘मनुष्य/मानवजाति’ को सूचित कर सकता है। वाचा के उल्लंघन के प्रसंग में आदम का व्यक्तिगत अर्थ मुख्य पाठ में सम्भव और सार्थक है, जबकि वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: עָבְרוּ
  choice: उल्लंघन किया
  rationale: בְּרִית के साथ यह क्रिया वाचा की सीमा लाँघने या उसे भंग करने का अर्थ देती है। ‘उल्लंघन किया’ आधुनिक हिन्दी में स्वाभाविक है और नैतिक-वाचागत गम्भीरता बनाए रखता है।
- source_word: בְרִית
  choice: वाचा
  rationale: यहाँ परमेश्वर के साथ विशिष्ट वाचागत सम्बन्ध अभिप्रेत है। हिन्दी बाइबलीय प्रयोग में ‘वाचा’ सटीक, प्रतिष्ठित और व्यापक रूप से बोधगम्य शब्द है।
- source_word: שָׁם
  choice: वहाँ
  rationale: इस क्रियाविशेषण का सीधा स्थानवाचक अर्थ ‘वहाँ’ है। उसका सटीक स्थान-सन्दर्भ पाठ में अनकहा रहने दिया गया है।
- source_word: בָּגְדוּ
  choice: विश्वासघात किया
  rationale: क्रिया विश्वासहीनता, द्रोह या विश्वास तोड़ने को व्यक्त करती है, विशेषकर सम्बन्ध और वाचा के प्रसंग में। ‘विश्वासघात किया’ इसका व्यक्तिगत और वाचागत बल स्पष्ट रखता है।
- source_word: בִי
  choice: मुझसे
  rationale: בגד के साथ पूर्वसर्ग का स्वाभाविक हिन्दी रूप ‘मुझसे विश्वासघात किया’ है; इससे परमेश्वर के विरुद्ध किए गए व्यक्तिगत विश्वासघात का भाव बना रहता है।
theological_decisions:
- issue: वाचा के प्रसंग में כְּאָדָם का अर्थ
  choice: आदम के समान
  alternative: मनुष्य के समान; मानवजाति के समान
  rationale: इब्रानी रूप व्यक्तिगत आदम और सामान्य मानवता—दोनों अर्थों की अनुमति देता है। वाचा के उल्लंघन का उल्लेख आदम के अपराध की ओर संकेत कर सकता है, इसलिए मुख्य पाठ में ‘आदम’ रखा गया है; पर सामान्य अर्थ को पादटिप्पणी में देकर मूल की व्याख्यात्मक अनिश्चितता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘वाचा’ और ‘उल्लंघन’ जैसे परिचित बाइबलीय शब्द मूल के वाचागत भार को सँजोते हैं, जबकि वाक्य-रचना सामान्य पाठक के लिए सहज है।
