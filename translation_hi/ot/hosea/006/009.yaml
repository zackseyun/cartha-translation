reference: Hosea 6:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/כְ/חַכֵּ֨י אִ֜ישׁ גְּדוּדִ֗ים חֶ֚בֶר כֹּֽהֲנִ֔ים דֶּ֖רֶךְ יְרַצְּחוּ שֶׁ֑כְמָ/ה כִּ֥י זִמָּ֖ה עָשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/009.yaml
  text: And like men lying in wait[a], a band of priests murders on the way to Shechem; indeed[b], they have committed wickedness.
translation:
  language: hi
  text: और जैसे लुटेरे किसी मनुष्य की घात लगाए रहते हैं[a], वैसे ही याजकों का दल शकेम जाने वाले मार्ग पर हत्या करता है; सचमुच, उन्होंने घोर दुष्कर्म किया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ कठिन है। इसका अनुवाद यह भी हो सकता है: “और घात लगाए हुए लोगों के समान, याजकों का दल शकेम जाने वाले मार्ग पर हत्या करता है।”'
    reason: alternative_reading
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द किसी जघन्य या अत्यन्त लज्जाजनक कृत्य को सूचित करता है; अनुवाद “घोर अपराध” या “दुष्टता” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְחַכֵּי אִישׁ גְּדוּדִים
  choice: और जैसे लुटेरे किसी मनुष्य की घात में बैठे रहते हैं
  rationale: इब्रानी पदबंध संक्षिप्त और कठिन है। यह चयन घात लगाकर हिंसा करने वाले लुटेरों की मुख्य छवि को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक वाक्य-विन्यास को पादटिप्पणी में सुरक्षित रखता है।
- source_word: חֶבֶר כֹּהֲנִים
  choice: याजकों का दल
  rationale: חֶבֶר यहाँ एक संगठित समूह को सूचित करता है; हिंसक प्रसंग में ‘दल’ स्वाभाविक और उपयुक्त है।
- source_word: דֶּרֶךְ ... שֶׁכְמָה
  choice: शकेम जाने वाले मार्ग पर
  rationale: דֶּרֶךְ मार्ग को और दिशासूचक रूप שֶׁכְמָה शकेम की ओर गति को दर्शाता है।
- source_word: יְרַצְּחוּ
  choice: हत्या करता है
  rationale: רצח सामान्य वध से अधिक आपराधिक हत्या का बोध देता है; एकवचन सामूहिक कर्ता ‘दल’ के साथ एकवचन क्रिया रखी गई है।
- source_word: כִּי
  choice: सचमुच
  rationale: यहाँ כִּי आरोप पर बल देने वाला व्याख्यात्मक अव्यय प्रतीत होता है, न कि केवल कारणसूचक ‘क्योंकि’।
- source_word: זִמָּה עָשׂוּ
  choice: उन्होंने घोर दुष्कर्म किया है
  rationale: זִמָּה किसी जघन्य, लज्जाजनक या घोर बुरे कृत्य को दर्शाता है। ‘घोर दुष्कर्म’ इसकी नैतिक तीव्रता बनाए रखता है, बिना इसे अनावश्यक रूप से यौन पाप तक सीमित किए।
theological_decisions:
- issue: कठिन आरम्भिक उपमा וּכְחַכֵּי אִישׁ גְּדוּדִים की व्याख्या
  choice: लुटेरों के किसी मनुष्य की घात में बैठने की उपमा के बाद याजकों के दल का वर्णन
  alternative: ‘जैसे घात लगाए बैठे मनुष्य, वैसे ही याजकों का दल...’ अथवा ‘जैसे लुटेरे किसी मनुष्य की घात लगाते हैं, वैसे ही...’
  rationale: मूल इब्रानी का वाक्य-विन्यास संदिग्ध और सम्भवतः दीर्घवृत्तीय है। मुख्य पाठ हिंसक घात की छवि स्पष्ट करता है, और पादटिप्पणी वास्तविक पाठगत अस्पष्टता को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘याजक’, ‘घात’, ‘हत्या’ और ‘घोर दुष्कर्म’ पाठ के भविष्यद्वक्तापूर्ण आरोप तथा नैतिक तीव्रता को बनाए रखते हैं।
