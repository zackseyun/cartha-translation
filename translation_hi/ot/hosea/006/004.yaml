base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/004.yaml
  text: What shall I do with you[a], Ephraim? What shall I do with you, Judah? Your loyalty is like a morning cloud, and like dew that goes away early.
translation:
  language: hi
  text: “हे एप्रैम, मैं तुम्हारा क्या करूँ? हे यहूदा, मैं तुम्हारा क्या करूँ? तुम्हारी निष्ठा[a] भोर के बादल के समान है, उस ओस के समान जो सवेरे ही मिट जाती है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अटल प्रेम” अथवा “विश्वासयोग्यता।” इब्रानी शब्द חֶסֶד वाचा के संबंध में दिखाए जाने वाले निष्ठावान प्रेम का भाव भी रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לְךָ
  choice: मैं तुम्हारा क्या करूँ?
  rationale: यह स्वाभाविक हिन्दी प्रश्न परमेश्वर की खिन्न, विचारमग्न पुकार को व्यक्त करता है; यह केवल किसी भावी कार्य के विषय में सूचना माँगना नहीं है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: मूल नाम को लिप्यंतरित किया गया है। यहाँ वह उत्तरी राज्य का प्रतिनिधित्व करता है, फिर भी सीधे संबोधन में मूल नाम बनाए रखा गया है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: मूल नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है; समानांतर संबोधन दक्षिणी राज्य को व्यक्त करता है।
- source_word: חַסְדְּכֶם
  choice: तुम्हारी निष्ठा[a]
  rationale: ‘निष्ठा’ संबंध में स्थिर प्रेम और विश्वासयोग्यता की माँग को सहज हिन्दी में व्यक्त करती है। חֶסֶד की वाचा-संबंधी व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है, ताकि मुख्य पाठ में व्याख्यात्मक विस्तार न जोड़ा जाए।
- source_word: כַּעֲנַן בֹּקֶר
  choice: भोर के बादल के समान
  rationale: עָנָן का मूल अर्थ ‘बादल’ है। यह रूपक सुबह दिखाई देकर शीघ्र लुप्त हो जाने वाली वस्तु की अस्थिरता को बनाए रखता है।
- source_word: וְכַטַּל מַשְׁכִּים הֹלֵךְ
  choice: उस ओस के समान जो सवेरे ही मिट जाती है
  rationale: यह हिन्दी में क्षणभंगुर ओस की छवि स्वाभाविक रूप से व्यक्त करता है। ‘मिट जाती है’ הֹלֵךְ के प्रसंगगत अर्थ—चले जाना या लुप्त होना—को स्पष्ट करता है, और ‘सवेरे ही’ מַשְׁכִּים की शीघ्रता बनाए रखता है।
theological_decisions:
- issue: भविष्यद्वक्ता के वाचा-संबंधी प्रसंग में חֶסֶד का अनुवाद
  choice: निष्ठा
  alternative: अटल प्रेम; विश्वासयोग्यता; वाचा की निष्ठा
  rationale: पद एप्रैम और यहूदा के परमेश्वर के प्रति क्षणिक प्रत्युत्तर को धिक्कारता है। ‘निष्ठा’ प्रेम, स्थिरता और संबंधगत दायित्व की दिशा खुली रखती है, जबकि ‘वाचा की निष्ठा’ मुख्य पाठ में निहित प्रसंग को स्पष्ट व्याख्या के रूप में जोड़ सकती है। अन्य वास्तविक अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोहराया गया प्रश्न मूल की भावात्मक और अलंकारिक शक्ति बनाए रखता है। ‘भोर’ और ‘ओस’ से काव्यात्मक चित्र सुरक्षित रहता है, जबकि वाक्य सामान्य हिन्दी पाठक के लिए स्पष्ट है।
