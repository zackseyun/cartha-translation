  yaml_path: translation/ot/hosea/006/008.yaml
  text: Gilead is a city of evildoers[a], tracked with blood.
translation:
  language: hi
  text: 'गिलाद कुकर्म करनेवालों का नगर है,

    जिस पर खून के निशान हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो खून से सना है,” “जिस पर खून की छाप है,” अथवा अधिक शाब्दिक रूप में, “जो खून से पदचिह्नित है।” इब्रानी अभिव्यक्ति दुर्लभ और कठिन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְעָד
  choice: गिलाद
  rationale: स्थान-नाम को आधुनिक हिन्दी में प्रचलित बाइबलीय लिप्यंतरण के अनुसार रखा गया है।
- source_word: קִרְיַת
  choice: नगर
  rationale: यह रचना-संबंधी रूप अगले पदबंध से जुड़कर ‘...का नगर’ बनाता है; ‘नगर’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: פֹּעֲלֵי אָוֶן
  choice: कुकर्म करनेवालों
  rationale: पदबंध उन लोगों को दर्शाता है जो निरंतर बुरे काम करते हैं; यह चयन नैतिक अर्थ को स्पष्ट रखते हुए सहज आधुनिक हिन्दी देता है।
- source_word: עֲקֻבָּה
  choice: निशान हैं
  rationale: यह दुर्लभ और कठिन रूप पैरों के चिह्नों, लकीरों या दागों का बिंब दे सकता है। मुख्य पाठ में ‘निशान’ इस अस्पष्टता को ‘दाग’ की अपेक्षा अधिक सुरक्षित रखता है।
- source_word: מִדָּם
  choice: खून के
  rationale: पूर्वसर्ग का शाब्दिक अर्थ ‘खून से/खून के कारण’ हो सकता है; ‘खून के निशान’ हिन्दी में स्वाभाविक है और रक्त से चिह्नित होने का संभावित भाव व्यक्त करता है।
