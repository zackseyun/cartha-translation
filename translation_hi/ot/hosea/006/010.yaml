source:
  edition: WLC
  text: בְּ/בֵית֙ יִשְׂרָאֵ֔ל רָאִ֖יתִי שעריריה שָׁ֚ם זְנ֣וּת לְ/אֶפְרַ֔יִם נִטְמָ֖א יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/010.yaml
  text: 'In the house of Israel I have seen a horrible thing: there is prostitution in Ephraim[c][b][a]; Israel has defiled itself.'
translation:
  language: hi
  text: इस्राएल के घराने में मैंने एक घिनौनी बात देखी है:[a] वहाँ एप्रैम का वेश्याचार है;[b] इस्राएल अशुद्ध हो गया है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक भयानक बात।” हिब्रू शब्द किसी स्तब्ध कर देनेवाली अथवा अत्यंत निंदनीय बात का बोध कराता है।
    reason: lexical_alternative
  - marker: b
    text: या “एप्रैम में वेश्याचार है।” हिब्रू वाक्यांश संक्षिप्त है; इसका अर्थ एप्रैम से संबंधित वेश्याचार या एप्रैम में होनेवाला वेश्याचार हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या “इस्राएल अशुद्ध है” अथवा “इस्राएल ने अपने आपको अशुद्ध कर लिया है।”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने में
  rationale: यह अनुवाद בְּ और בֵית की स्थानवाचक तथा वाचा-परिवार संबंधी छवि को बनाए रखता है; केवल ‘इस्राएल में’ कहना उस छवि को समतल कर देता।
- source_word: רָאִיתִי
  choice: मैंने ... देखी है
  rationale: हिब्रू क़ातल रूप को ऐसे पूर्ण कार्य के रूप में व्यक्त किया गया है जिसका प्रभाव वर्तमान भविष्यवाणी-वचन में बना हुआ है।
- source_word: שעריריה
  choice: एक घिनौनी बात
  rationale: यह दुर्लभ संज्ञा किसी स्तब्ध कर देनेवाली, वीभत्स या अत्यंत निंदनीय बात को सूचित करती है; ‘घिनौनी बात’ सहज आधुनिक हिन्दी में नैतिक विकर्षण व्यक्त करती है।
- source_word: שָׁם
  choice: वहाँ
  rationale: स्थानसूचक क्रियाविशेषण को स्पष्ट रखा गया है और इसे पिछले उल्लेखित ‘इस्राएल के घराने’ से जोड़ा गया है।
- source_word: זְנוּת
  choice: वेश्याचार
  rationale: यह शब्द होशे की यौन बेवफ़ाई की सशक्त छवि को बनाए रखता है और शाब्दिक यौन पाप तथा रूपकात्मक वाचा-विश्वासघात—दोनों की संभावना खुली रखता है।
- source_word: לְאֶפְרַיִם
  choice: एप्रैम का
  rationale: לְ की संक्षिप्त और कुछ हद तक अस्पष्ट संबंधवाचक रचना को स्वाभाविक हिन्दी में संबंध/आरोपण के रूप में व्यक्त किया गया है; पादटिप्पणी स्थानवाचक विकल्प भी सुरक्षित रखती है।
- source_word: נִטְמָא
  choice: अशुद्ध हो गया है
  rationale: निफ़अल रूप का परिणामी अथवा अवस्था-प्रवेश भाव व्यक्त होता है, पर ‘अपने आपको अशुद्ध किया’ कहकर प्रत्यक्ष कर्मवाचकता जोड़ने से बचा गया है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: वाचा-समुदाय का नाम यथावत रखा गया है, जिससे ‘इस्राएल का घराना,’ ‘एप्रैम’ और ‘इस्राएल’ का अलंकारिक क्रम दिखाई देता है।
theological_decisions:
- issue: זְנוּת को शाब्दिक यौन पाप, मूर्तिपूजा के रूपक, या दोनों के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में ‘वेश्याचार’ रखा गया है, जिससे होशे की वैवाहिक/वाचा-बेवफ़ाई की छवि सजीव रहती है और अर्थ किसी एक पक्ष तक सीमित नहीं होता।
  alternative: ‘व्यभिचार’ या ‘यौन अनैतिकता’
  rationale: ‘व्यभिचार’ वैवाहिक बेवफ़ाई की ओर अधिक संकुचित हो सकता है और ‘यौन अनैतिकता’ मूल की वेश्यावृत्ति-संबंधी तीखी छवि को सामान्य बना देता है।
- issue: נִטְמָא को स्थायी अवस्था, अवस्था में प्रवेश, या आत्म-अपवित्रीकरण के रूप में अनूदित करना
  choice: ‘अशुद्ध हो गया है’
  alternative: ‘अशुद्ध है’ या ‘उसने अपने आपको अशुद्ध कर लिया है’
  rationale: निफ़अल रूप अवस्था अथवा उस अवस्था में आने, दोनों को सह सकता है। चुना हुआ पाठ परिणामी भाव रखता है, जबकि पादटिप्पणी वास्तविक व्याकरणिक विकल्पों को सुरक्षित रखती है और नैतिक कर्तृत्व को आवश्यकता से अधिक स्पष्ट नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण भविष्यवाणीपरक रजिस्टर अपनाया गया है। ‘घराना,’ ‘वेश्याचार’ और ‘अशुद्ध’ मूल की पारिवारिक, यौन-बेवफ़ाई और धार्मिक/नैतिक अपवित्रता की छवियों को स्पष्ट रखते हैं; अस्पष्ट व्याकरणिक संबंध पादटिप्पणियों में सुरक्षित हैं।
