id: HOS.6.1
reference: Hosea 6:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְכוּ֙ וְ/נָשׁ֣וּבָה אֶל יְהוָ֔ה כִּ֛י ה֥וּא טָרָ֖ף וְ/יִרְפָּאֵ֑/נוּ יַ֖ךְ וְ/יַחְבְּשֵֽׁ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/001.yaml
  text: Come[a], let us return to Yahweh, for he has torn us, but he will heal us; he has struck us[b], but he will bind us up.
translation:
  language: hi
  text: आओ, हम याहवे के पास लौट चलें, क्योंकि उसी ने हमें फाड़ा है, और वही हमें चंगा करेगा; उसी ने हम पर प्रहार किया है, और वही हमारे घावों पर पट्टी बाँधेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ
  choice: आओ
  rationale: बहुवचन आज्ञार्थक रूप यहाँ सामूहिक आह्वान के रूप में प्रयुक्त है; आधुनिक हिन्दी में “आओ” इसका स्वाभाविक समतुल्य है।
- source_word: וְנָשׁוּבָה
  choice: हम ... लौट चलें
  rationale: प्रथम पुरुष बहुवचन cohortative साझा संकल्प व्यक्त करता है। “लौट चलें” दिशा और वाचा-संबंधी वापसी दोनों को बनाए रखता है, बिना सीधे “पश्चाताप करें” जैसी व्याख्या जोड़ने के।
- source_word: אֶל יְהוָה
  choice: यहोवा के पास
  rationale: אֶל की दिशात्मकता को स्वाभाविक हिन्दी में व्यक्त किया गया है और यְהוָה को व्यक्तिगत दिव्य नाम “यहोवा” के रूप में लिप्यंतरित किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह लौटने के आह्वान का कारण प्रस्तुत करता है।
- source_word: טָרָף
  choice: हमें फाड़ा है
  rationale: क्रिया प्रायः किसी हिंसक पशु द्वारा शिकार फाड़ने की सजीव छवि रखती है। निहित कर्म को समानांतर प्रत्ययों के आधार पर “हमें” कहा गया है।
- source_word: וְיִרְפָּאֵנוּ
  choice: और वही हमें चंगा करेगा
  rationale: वाव को उसके मूल समन्वयी अर्थ “और” से रखा गया है; “वही” न्याय करने वाले और चंगा करने वाले की समान पहचान तथा निहित विरोध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יַךְ
  choice: उसी ने हमें मारा है
  rationale: रूप अपूर्ण/युस्सिव-जैसा है, पर काव्यात्मक समानांतरता में इसे पिछले न्याय के रूप में समझना उपयुक्त है। “मारा” आधुनिक और व्यापक है तथा अगले उपचार-बिंब से अलग रहता है।
- source_word: וְיַחְבְּשֵׁנוּ
  choice: और वही हमारे घावों पर पट्टी बाँधेगा
  rationale: क्रिया का अर्थ घाव बाँधना या उसकी पट्टी करना है। हिन्दी में “हम पर पट्टी बाँधेगा” अस्वाभाविक होता, इसलिए निहित घाव को स्पष्ट कर प्राकृतिक रूप दिया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण “यहोवा” रखा गया है।
- issue: दिव्य न्याय और पुनर्स्थापना का कालक्रम
  choice: फाड़ने और मारने को पूर्ण घटना, चंगा करने और पट्टी बाँधने को अपेक्षित भविष्य
  alternative: चारों क्रियाओं को भविष्यकाल में लेना
  rationale: काव्यात्मक समानांतरता लोगों की वर्तमान दशा को पहले से दिए गए दंड के परिणाम के रूप में और लौटने पर उपचार को अपेक्षित भविष्य के रूप में प्रस्तुत करती है; इससे वही परमेश्वर घायल करता और चंगा भी करता है—यह तनाव बना रहता है।
- issue: וְ का संबंधसूचक बल
  choice: “और वही”
  alternative: “लेकिन वही”
  rationale: हिब्रू में साधारण वाव है। हिन्दी में “और वही” मूल समन्वय को सुरक्षित रखते हुए सर्वनामिक बल द्वारा विरोध स्पष्ट करता है, बिना उसे अनिवार्य रूप से adversative बना देने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “फाड़ा” न्याय की तीखी पशु-सदृश छवि को सुरक्षित रखता है, जबकि “घावों पर पट्टी बाँधेगा” उपचार का रूपक साधारण पाठक के लिए स्वाभाविक बनाता है।
