id: HOS.6.3
reference: Hosea 6:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נֵדְעָ֣ה נִרְדְּפָ֗ה לָ/דַ֨עַת֙ אֶת יְהוָ֔ה כְּ/שַׁ֖חַר נָכ֣וֹן מֽוֹצָא֑/וֹ וְ/יָב֤וֹא כַ/גֶּ֨שֶׁם֙ לָ֔/נוּ כְּ/מַלְק֖וֹשׁ י֥וֹרֶה אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/003.yaml
  text: So let us know[a]; let us press on to know Yahweh. His going forth is as sure as the dawn, and he will come to us like the rain[d][c][b], like the spring rain that waters the earth.
translation:
  language: hi
  text: आओ, हम जानें; हम याहवे को जानने के लिए पूरी लगन से आगे बढ़ें[a]। उसका प्रकट होना[b] भोर के समान निश्चित है। वह वर्षा के समान हमारे पास आएगा[c], वसन्त की उस वर्षा[d] के समान, जो धरती को सींचती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से, “हम पीछा करें।” भाव है: याहवे को जानने के लिए दृढ़ता और निरन्तरता से प्रयत्न करना।'
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका निकलना” या “उसका आगे आना”; इसका अर्थ “उसका प्रकट होना” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी क्रिया का अर्थ “वह हमारे पास आए” भी लिया जा सकता है; यहाँ सन्दर्भ के अनुसार इसे विश्वासपूर्ण भविष्य, “वह आएगा,” माना गया है।
    reason: alternative_reading
  - marker: d
    text: “वसन्त की वर्षा” इब्रानी में ऋतु की “पछेती वर्षा” है, जो फसलों के पकने के लिए महत्त्वपूर्ण होती थी।
    reason: cultural_note
lexical_decisions:
- source_word: וְנֵדְעָה
  choice: आओ, हम जानें
  rationale: ידע का प्रथम पुरुष बहुवचन कोहोर्टेटिव मिलकर किए जाने वाले आह्वान को व्यक्त करता है। ‘जानें’ बौद्धिक जानकारी तक सीमित न रहकर वाचा-संबंधी और व्यक्तिगत ज्ञान की व्यापकता बनाए रखता है।
- source_word: נִרְדְּפָה לָדַעַת
  choice: जानने के लिए पूरी लगन से आगे बढ़ें
  rationale: רדף का मूल अर्थ ‘पीछा करना’ है; לדעת के साथ यह याहवे को जानने के लिए निरन्तर और दृढ़ प्रयत्न को दर्शाता है। चुना हुआ वाक्यांश आधुनिक हिन्दी में स्वाभाविक है और प्रयत्नशीलता को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; इसलिए इसे किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यन्तरित किया गया है।
- source_word: כְשַׁחַר נָכוֹן מוֹצָאוֹ
  choice: उसका प्रकट होना भोर के समान निश्चित है
  rationale: נכון दृढ़ता और निश्चितता बताता है, और מוצא का शाब्दिक अर्थ ‘निकलना/आगे आना’ है। भोर की उपमा के सन्दर्भ में ‘प्रकट होना’ अर्थ को स्वाभाविक हिन्दी में संप्रेषित करता है, जबकि शाब्दिक बिम्ब पादटिप्पणी में सुरक्षित है।
- source_word: וְיָבוֹא כַגֶּשֶׁם לָנוּ
  choice: वह वर्षा के समान हमारे पास आएगा
  rationale: अपूर्ण क्रिया को सन्दर्भ में विश्वासपूर्ण भविष्यवाणी के रूप में लिया गया है। वर्षा की उपमा उसके आगमन के जीवनदायी और विश्वसनीय स्वरूप को सामने रखती है।
- source_word: כְמַלְקוֹשׁ יוֹרֶה אָרֶץ
  choice: वसन्त की उस वर्षा के समान, जो धरती को सींचती है
  rationale: מלקוש फसल के लिए महत्त्वपूर्ण ऋतु की बाद की वर्षा है। ‘वसन्त की वर्षा’ आधुनिक पाठक को उसका समय समझाती है; יוֹרֶה אָרֶץ का कार्यात्मक अर्थ ‘धरती को सींचती है’ स्वाभाविक हिन्दी में दिया गया है।
theological_decisions:
- issue: ידע का वाचा-संबंधी अर्थ
  choice: जानें / जानने
  alternative: स्वीकार करें
  rationale: ‘जानना’ मूल शब्द की बौद्धिक, संबंधपरक और वाचा-संबंधी व्यापकता बनाए रखता है; ‘स्वीकार करना’ इसे अनावश्यक रूप से संकीर्ण कर देता।
- issue: וְיָבוֹא की विधा
  choice: विश्वासपूर्ण भविष्यकाल—‘वह ... आएगा’
  alternative: इच्छा या प्रार्थना—‘वह ... आए’
  rationale: भोर की निश्चितता और ऋतु की वर्षा की उपमाएँ विश्वासपूर्ण अपेक्षा का समर्थन करती हैं। फिर भी इब्रानी क्रिया की सम्भावित इच्छार्थक व्याख्या पादटिप्पणी में दी गई है।
- issue: ईश्वरीय नाम יְהוָה
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत नाम को उपाधि से प्रतिस्थापित न करके लिप्यन्तरित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘पूरी लगन से आगे बढ़ें’ मूल की पीछा करने वाली तीव्रता को स्वाभाविक रूप देता है। ‘वसन्त की वर्षा’ के साथ सांस्कृतिक विवरण पादटिप्पणी में रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्बद्ध पदों के तुरन्त बाद दिए गए हैं।
