base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/006.yaml
  text: For I desire steadfast love and not sacrifice[b][a], and the knowledge of God rather than burnt offerings.
translation:
  language: hi
  text: क्योंकि मैं बलिदान नहीं, बल्कि अटल प्रेम[a] चाहता हूँ, और होमबलियों[b] से बढ़कर परमेश्वर का ज्ञान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दया” अथवा “निष्ठावान प्रेम।” इब्रानी חֶסֶד में दया के साथ वाचा के प्रति निष्ठा का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से “होमबलियों से”; यहाँ इब्रानी रचना प्राथमिकता व्यक्त करती है: “होमबलियों से बढ़कर” या “होमबलियों की अपेक्षा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसके व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह शब्द दया के साथ-साथ निष्ठावान, वाचा-संबंधी प्रेम का भाव भी रखता है। ‘अटल प्रेम’ प्रेम और स्थिर निष्ठा—दोनों को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חָפַצְתִּי
  choice: मैं ... चाहता हूँ
  rationale: क्रिया इच्छा रखने, प्रसन्न होने या किसी बात को पसंद करने का अर्थ देती है। बलिदान के साथ विरोध में ‘चाहता हूँ’ सहज और स्पष्ट है।
- source_word: זָבַח
  choice: बलिदान
  rationale: यह सामान्य बलिदान-संबंधी शब्द है, जो अगले खंड के अधिक विशिष्ट ‘होमबलियों’ से अलग रहता है।
- source_word: דַעַת אֱלֹהִים
  choice: परमेश्वर का ज्ञान
  rationale: नामवाची इब्रानी संरचना और पहले खंड के ‘अटल प्रेम’ के साथ काव्यात्मक समानता सुरक्षित रहती है। इसका आशय केवल सूचना नहीं, बल्कि परमेश्वर को संबंधात्मक रूप से जानना भी हो सकता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ इस्राएल के परमेश्वर के लिए सामान्य ईश्वरीय उपाधि है, न कि चतुरक्षरीय निजी नाम।
- source_word: מֵעֹלוֹת
  choice: होमबलियों से बढ़कर
  rationale: पूर्वसर्ग מִן यहाँ तुलना और प्राथमिकता व्यक्त करता है। ‘से बढ़कर’ उपासना-विधि के पूर्ण उन्मूलन का अर्थ आरोपित किए बिना प्राथमिकता स्पष्ट करता है।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: यह वे बलियाँ हैं जो वेदी पर पूरी तरह जलाई जाती थीं; ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में इसका प्रचलित और स्पष्ट नाम है।
theological_decisions:
- issue: क्या पद बलिदान को सर्वथा अस्वीकार करता है या उसकी तुलना में वाचा-निष्ठा को प्राथमिकता देता है
  choice: अटल प्रेम और परमेश्वर के ज्ञान को केवल बाहरी बलिदानों से अधिक महत्त्व देना
  alternative: समूची बलिदान-व्यवस्था का पूर्ण निषेध
  rationale: पहले खंड का तीखा ‘नहीं’ भविष्यद्वक्ताओं की विरोधात्मक शैली को बनाए रखता है, जबकि दूसरे खंड का तुलनात्मक מִן प्राथमिकता प्रकट करता है। अनुवाद इस तनाव को बनाए रखता है और बलिदान के पूर्ण निषेध का निष्कर्ष स्वयं नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक समानता वाला रूप। ‘अटल प्रेम’ सामान्य पाठक के लिए बोधगम्य है, और ‘होमबलि’ पारंपरिक धार्मिक पदावली को बनाए रखता है।
