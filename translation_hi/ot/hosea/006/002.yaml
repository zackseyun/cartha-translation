source:
  edition: WLC
  text: יְחַיֵּ֖/נוּ מִ/יֹּמָ֑יִם בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י יְקִמֵ֖/נוּ וְ/נִחְיֶ֥ה לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/002.yaml
  text: He will revive us after two days[a]; on the third day he will raise us up[d][c][b], that we may live before him.
translation:
  language: hi
  text: वह दो दिनों के बाद हमें फिर से जीवित करेगा[a]; तीसरे दिन वह हमें उठाएगा[b][c], ताकि हम उसके सामने जीएँ[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दो दिनों में’; इब्रानी समयवाचक अभिव्यक्ति तीसरे दिन तक पहुँचने वाले एक छोटे अंतराल को सूचित कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘हमें उठाएगा’ का व्यापक अर्थ ‘हमें फिर खड़ा करेगा’ या ‘हमें बहाल करेगा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: बहुत-से मसीही ‘तीसरे दिन’ की इस भाषा में मसीह के पुनरुत्थान का प्रतिरूपात्मक पूर्वाभास देखते हैं, यद्यपि यह पद सीधे तौर पर लोगों की पुनर्स्थापना की बात करता है।
    reason: cross_reference
  - marker: d
    text: या ‘उसकी उपस्थिति में’।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֵּנוּ
  choice: हमें फिर से जीवित करेगा
  rationale: חיה के पिएल रूप में यहाँ किसी को जीवन देने या पुनर्जीवित करने का कारक भाव है। यह चयन जीवनदान की छवि और सामूहिक पुनर्स्थापना—दोनों को बनाए रखता है।
- source_word: מִיֹּמָיִם
  choice: दो दिनों के बाद
  rationale: समयवाचक पद के साथ מִן यहाँ स्वाभाविक रूप से ‘के बाद’ समझा जा सकता है; फिर भी ‘दो दिनों में’ का अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: यह मानक समयवाचक अभिव्यक्ति है और पहले पदांश के बाद आने वाले चरम पुनर्स्थापन को स्पष्ट करती है।
- source_word: יְקִימֵנוּ
  choice: हमें उठाएगा
  rationale: קום का हिफ़ील रूप ‘उठाना’, ‘खड़ा करना’ या ‘स्थापित करना’ व्यक्त कर सकता है। ‘उठाएगा’ पतन या मृत्यु-जैसी दशा से पुनर्स्थापन की छवि और संभावित पुनरुत्थान-संकेत—दोनों को बिना अधिक व्याख्या के सुरक्षित रखता है।
- source_word: וְנִחְיֶה
  choice: ताकि हम ... जीवित रहें
  rationale: संदर्भ में वाव से जुड़ा यह क्रियारूप परमेश्वर के दोनों कार्यों का परिणाम या उद्देश्य व्यक्त कर सकता है। ‘ताकि’ इस संबंध को सहज हिन्दी में प्रकट करता है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह לְפָנָיו का सीधा और स्वाभाविक हिन्दी रूप है। ‘उसकी उपस्थिति में’ संबंधपरक अर्थछाया को अधिक स्पष्ट करता है और पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: क्या पद को सीधे मसीह के पुनरुत्थान की भविष्यवाणी के रूप में प्रस्तुत किया जाए या समुदाय की पुनर्स्थापना के कथन के रूप में
  choice: मुख्य पाठ में प्रथम पुरुष बहुवचन ‘हमें/हम’ को बनाए रखते हुए परमेश्वर द्वारा लोगों को पुनर्स्थापित करने का सीधा अर्थ रखा गया है।
  alternative: कुछ मसीही पाठक ‘तीसरे दिन’ को मसीह के पुनरुत्थान का प्रतिरूपात्मक या भविष्यसूचक पूर्वाभास मानते हैं।
  rationale: इब्रानी पाठ प्रत्यक्ष रूप से समुदाय के विषय में बोलता है। अनुवाद को उससे अधिक विशिष्ट मसीह-संबंधी दावा मुख्य पाठ में नहीं जोड़ना चाहिए, पर पादटिप्पणी व्यापक धर्मवैधानिक या प्रतिरूपात्मक पठन के लिए स्थान रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और सामूहिक वाणी को स्पष्ट रखने वाली। ‘फिर से जीवित करेगा’ तथा ‘उठाएगा’ मूल की जीवन और उठाए जाने की समानांतर छवियों को सुरक्षित रखते हैं; मुख्य पाठ किसी विशिष्ट सांप्रदायिक व्याख्या को आरोपित नहीं करता।
