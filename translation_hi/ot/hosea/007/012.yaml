source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר יֵלֵ֗כוּ אֶפְר֤וֹשׂ עֲלֵי/הֶם֙ רִשְׁתִּ֔/י כְּ/ע֥וֹף הַ/שָּׁמַ֖יִם אֽוֹרִידֵ֑/ם אַיְסִרֵ֕/ם כְּ/שֵׁ֖מַע לַ/עֲדָתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/012.yaml
  text: As they go[a], I will spread my net over them; like the birds of the heavens I will bring them down[b]. I will chasten them according to the report to their assembly.
translation:
  language: hi
  text: जब वे जाएँगे, मैं उन पर अपना जाल फैलाऊँगा; आकाश के पक्षियों के समान मैं उन्हें नीचे उतार लाऊँगा। उनकी सभा को मिली सूचना के अनुसार मैं उन्हें अनुशासित[a] करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उन्हें ताड़ना दूँगा” अथवा “मैं उन्हें दंड दूँगा।” इब्रानी क्रिया सुधारात्मक अनुशासन और दंडात्मक ताड़ना—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश कठिन है। इसका अर्थ “जैसा उनकी सभा में घोषित किया गया था” या “जैसा उनकी सभा ने सुना है” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר יֵלֵכוּ
  choice: जैसे ही वे जाएँगे
  rationale: כַּאֲשֶׁר यहाँ समयसूचक उपवाक्य आरम्भ करता है और יֵלֵכוּ का सामान्य अर्थ ‘जाना’ है। यह हिन्दी वाक्यांश उनके जाते समय होने वाली तत्क्षण कार्रवाई को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶפְרוֹשׂ עֲלֵיהֶם רִשְׁתִּי
  choice: मैं उन पर अपना जाल फैलाऊँगा
  rationale: פרשׂ और רשת का संयोग शिकार के ऊपर जाल फैलाने का चित्र देता है; ‘उन पर’ על का स्वाभाविक हिन्दी रूप है।
- source_word: כְּעוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षियों के समान
  rationale: עוֹף सामूहिक एकवचन है, जिसे हिन्दी में बहुवचन ‘पक्षियों’ से स्वाभाविक रूप से व्यक्त किया गया है; ‘आकाश’ मूल बिंब को बनाए रखता है।
- source_word: אוֹרִידֵם
  choice: मैं उन्हें नीचे उतार लाऊँगा
  rationale: ירד के हिफ़ील रूप में किसी को नीचे लाने का कारणात्मक भाव है। यह पक्षियों और जाल के रूपक के अनुकूल है।
- source_word: אַיְסִרֵם
  choice: मैं उन्हें अनुशासित करूँगा
  rationale: मसोरेटी स्वरांकन के अनुसार יסר का अर्थ सुधारात्मक अनुशासन या दंडात्मक ताड़ना दोनों हो सकता है। ‘अनुशासित’ सुधार और न्याय—दोनों की संभावना खुली रखता है।
- source_word: כְּשֵׁמַע לַעֲדָתָם
  choice: उनकी सभा को मिली सूचना के अनुसार
  rationale: שֵׁמַע के ‘सुनी हुई बात/सूचना’ और לַעֲדָתָם के ‘उनकी सभा को’ भाव को रखते हुए कठिन वाक्यांश का निकट और पठनीय अनुवाद किया गया है, पर उसकी अन्य संभावित व्याख्याएँ टिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: אַיְסִרֵם में परमेश्वर की कार्रवाई का स्वरूप
  choice: अनुशासित करूँगा
  alternative: दंड दूँगा; ताड़ना दूँगा
  rationale: יסר केवल प्रतिशोधात्मक दंड नहीं, सुधारात्मक अनुशासन भी व्यक्त कर सकता है। चुना हुआ शब्द न्याय और वाचा-संबंधी सुधार के बीच की निहित तनावपूर्ण व्यापकता को बनाए रखता है।
- issue: कठिन अंतिम वाक्यांश כְּשֵׁמַע לַעֲדָתָם की व्याख्या
  choice: उनकी सभा को मिली सूचना के अनुसार
  alternative: जैसा उनकी सभा में घोषित किया गया था; जैसा उनकी सभा ने सुना है
  rationale: इब्रानी वाक्यांश का वाक्य-संबंध अनिश्चित है। मुख्य पाठ अपेक्षाकृत निकट रहता है और टिप्पणी वैकल्पिक संबंधों को प्रस्तुत करती है, ताकि अस्पष्टता चुपचाप समाप्त न हो।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। जाल और आकाश के पक्षियों का मूल काव्यात्मक बिंब बनाए रखा गया है; कठिन अंतिम खंड की अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
