  yaml_path: translation/ot/hosea/007/008.yaml
  text: Ephraim mixes himself among the peoples[b][a]; Ephraim has become a cake not turned.
translation:
  language: hi
  text: 'एप्रैम जातियों के बीच घुल-मिल जाता है;

    एप्रैम ऐसी रोटी बन गया है जिसे पलटा नहीं गया।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: चित्र ऐसी रोटी का है जिसे सेंकते समय पलटा नहीं गया—इसलिए वह एक ओर जल जाती है और दूसरी ओर कच्ची रह जाती है।
    reason: cultural_note
lexical_decisions:
- source_word: יִתְבּוֹלָל
  choice: घुल-मिल जाता है
  rationale: हित्पोलेल रूप एप्रैम की स्वयं दूसरी जातियों में घुलने-मिलने की क्रिया व्यक्त करता है। यह प्रयोग केवल निष्क्रिय रूप से ‘मिला हुआ है’ कहने के बजाय आत्म-सम्मिश्रण के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בָּעַמִּים
  choice: दूसरी जातियों के बीच
  rationale: बहुवचन עַמִּים आसपास के अन्य लोगों या जातियों को सूचित करता है। ‘दूसरी जातियों के बीच’ प्रसंग में विदेशी समुदायों का भाव स्पष्ट करता है, पर आधुनिक राष्ट्र-राज्यों का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: עֻגָה
  choice: रोटी
  rationale: यह शब्द अंगारों या गरम सतह पर सेंकी जाने वाली गोल रोटी को सूचित करता है। आधुनिक हिन्दी में ‘रोटी’ इस बिंब को ‘केक’ की तुलना में अधिक सही और सहज रूप से पहुँचाती है।
- source_word: בְּלִי הֲפוּכָה
  choice: जिसे पलटा नहीं गया
  rationale: यह वाक्यांश सेंकते समय रोटी को न पलटने का प्रत्यक्ष चित्र बनाए रखता है और परिणाम की व्याख्या मुख्य पाठ में जोड़े बिना स्वाभाविक हिन्दी देता है।
- source_word: הָיָה
  choice: बन गया है
  rationale: 'पूर्ण क्रिया यहाँ वर्तमान परिणामी दशा बताती है: एप्रैम अब ऐसी रोटी के समान हो गया है। ‘बन गया है’ इस बल को हिन्दी में स्पष्ट करता है।'
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: मूल पाठ में आए नाम को लिप्यंतरित किया गया है। होशे में यह उत्तरी राज्य इस्राएल का प्रतिनिधित्व करता है, किंतु मुख्य पाठ में मूल नाम ही रखा गया है।
theological_decisions:
- issue: ‘एप्रैम’ का संदर्भ
  choice: मूल नाम ‘एप्रैम’ रखा गया है, जो प्रसंग में उत्तरी राज्य इस्राएल का प्रतिनिधि है।
  alternative: मुख्य पाठ में ‘इस्राएल’ या ‘उत्तरी राज्य’ लिखना।
  rationale: मूल भविष्यवाणी वाचा-ऐतिहासिक नाम ‘एप्रैम’ का प्रयोग करती है। उसे व्याख्यात्मक पद से बदलने पर स्रोत की पारदर्शिता घटेगी।
- issue: जातियों में घुलने-मिलने का स्वरूप
  choice: क्रिया को आत्म-संबंधी और सक्रिय भाव में ‘घुल-मिल जाता है’ कहा गया है।
  alternative: ‘मिला हुआ है’ या ‘मिश्रित हो गया है’।
  rationale: क्रियारूप एप्रैम की अपनी भागीदारी का संकेत देता है; अनुवाद यह नहीं तय करता कि इसमें राजनीतिक गठबंधन, धार्मिक सम्मिश्रण या दोनों मुख्यतः अभिप्रेत हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए दोनों पंक्तियों में ‘एप्रैम’ दोहराया गया है। ‘रोटी’ भारतीय हिन्दी पाठक के लिए प्राचीन चपटी रोटी के बिंब को स्वाभाविक रूप से व्यक्त करती है।
