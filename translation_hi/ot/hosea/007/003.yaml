  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक समानांतरता रखी गई है। दूसरी पंक्ति में इब्रानी की तरह क्रिया लुप्त है, पर हिन्दी में उसका अर्थ पहली पंक्ति से स्पष्ट रूप से पूरा होता है।
