  yaml_path: translation/ot/hosea/007/003.yaml
  text: By their evil they make the king glad[a], and by their lies the princes.
translation:
  language: hi
  text: 'वे अपनी बुराई से राजा को प्रसन्न करते हैं,

    और अपने झूठ[a] से अधिकारियों को प्रसन्न करते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने छल से अधिकारियों को।’
    reason: כַּחֲשִׁים का अर्थ ‘छल’ भी हो सकता है; שָׂרִים के लिए ‘अधिकारी’ एक संदर्भानुकूल विकल्प है।
lexical_decisions:
- source_word: בְּרָעָתָם
  choice: अपनी बुराई से
  rationale: पूर्वसर्ग ב यहाँ साधन का भाव देता है। ‘बुराई’ רָעָה के सामूहिक एकवचन अर्थ को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְשַׂמְּחוּ
  choice: खुश करते हैं
  rationale: שׂמח का पिएल रूप कारणवाचक है—वे केवल आनंदित नहीं होते, बल्कि राजा को आनंदित या प्रसन्न करते हैं। ‘खुश करते हैं’ आधुनिक सामान्य हिन्दी में इस भाव को सहजता से रखता है।
- source_word: מֶלֶךְ
  choice: राजा को
  rationale: यद्यपि इब्रानी में निश्चित उपपद नहीं है, प्रसंग किसी परिचित इस्राएली राजा की ओर संकेत करता है; हिन्दी में ‘राजा को’ स्वाभाविक है।
- source_word: וּבְכַחֲשֵׁיהֶם
  choice: और अपने झूठ से
  rationale: כחשׁ झूठ, असत्य कथन या छल को सूचित कर सकता है। यहाँ ‘झूठ’ सीधा और सुबोध है तथा ‘बुराई’ के समानांतर ठीक बैठता है।
- source_word: שָׂרִים
  choice: हाकिमों को
  rationale: שׂרים उच्च पदस्थ शासकीय व्यक्तियों या अधिकारियों के लिए प्रयुक्त होता है। ‘हाकिम’ दरबारी-राजनीतिक संदर्भ बनाए रखता है और आधुनिक पाठक के लिए ‘राजकुमारों’ से अधिक सटीक है।
