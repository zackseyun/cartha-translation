source:
  edition: WLC
  text: כֻּלָּ/ם֙ מְנָ֣אֲפִ֔ים כְּמ֣וֹ תַנּ֔וּר בֹּעֵ֖רָה מֵֽ/אֹפֶ֑ה יִשְׁבּ֣וֹת מֵעִ֔יר מִ/לּ֥וּשׁ בָּצֵ֖ק עַד חֻמְצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/004.yaml
  text: All of them are adulterers[a], like an oven heated by a baker[c][b], who stops stirring from the kneading of the dough until its leavening.
translation:
  language: hi
  text: वे सब व्यभिचारी हैं, उस तंदूर के समान जिसे रोटी पकानेवाले ने दहका रखा है।[a] रोटी पकानेवाला आटा गूँधने से लेकर आटे के खमीरित होने तक उसकी आग भड़काना छोड़ देता है।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो रोटी पकानेवाले के कारण जल रहा है।” इब्रानी कृदंत तंदूर की सक्रिय गर्मी पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उसकी आग भड़काना” का अनुवाद अनिश्चित है; इब्रानी का अर्थ “उसे कुरेदना,” “उसे जगाए रखना” या व्यापक रूप से “उसकी देखभाल करना” भी हो सकता है।
    reason: textual_or_lexical_difficulty
  - marker: c
    text: शाब्दिक रूप से, “आटा गूँधने से उसके खमीरित होने तक”; अर्थात आटे में खमीर उठने या उसके फूलने तक।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם מְנָאֲפִים
  choice: वे सब व्यभिचारी हैं
  rationale: बहुवचन कृदंत यहाँ संज्ञा के रूप में प्रयुक्त है। यह अनुवाद पूरे समूह पर लगाए गए आरोप की व्यापकता और व्यभिचार के सीधे अर्थ को बनाए रखता है।
- source_word: כְּמוֹ תַנּוּר
  choice: उस तंदूर के समान
  rationale: घरेलू रोटी पकाने के चित्र में ‘तंदूर’ आधुनिक हिन्दी पाठक के लिए मिट्टी के गरम भट्ठीनुमा चूल्हे का स्वाभाविक और सटीक बिंब देता है।
- source_word: בֹּעֵרָה מֵאֹפֶה
  choice: जिसे रोटी पकानेवाले ने दहका रखा है
  rationale: कृदंत तंदूर की सक्रिय, प्रज्वलित गर्मी बताता है और מִן को प्रसंगानुसार कर्ता-सूचक माना गया है। ‘रोटी पकानेवाला’ सामान्य हिन्दी में पेशे/भूमिका को स्पष्ट करता है।
- source_word: יִשְׁבּוֹת מֵעִיר
  choice: आग भड़काना छोड़ देता है
  rationale: יִשְׁבּוֹת का अर्थ ‘रुकना/छोड़ देना’ है; कठिन מֵעִיר को तंदूर के प्रसंग में आग को जगाने या भड़काने के रूप में लिया गया है, पर इसकी अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: מִלּוּשׁ בָּצֵק
  choice: आटा गूँधने के बाद से
  rationale: מִן समयावधि का आरंभ बताता है। हिन्दी में ‘के बाद से’ इस क्रम को ‘गूँधने से’ की अपेक्षा अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַד חֻמְצָתוֹ
  choice: उसमें खमीर उठने तक
  rationale: यह शब्द आटे के खमीरित होने की प्रक्रिया को दर्शाता है। ‘खमीर उठना’ आधुनिक हिन्दी में स्वाभाविक है और केवल आकार बढ़ने की अपेक्षा किण्वन का भाव भी बनाए रखता है।
theological_decisions:
- issue: क्या ‘व्यभिचारी’ को स्पष्ट रूप से वाचा-विमुखता या आत्मिक व्यभिचार के रूप में विस्तारित किया जाए
  choice: मुख्य पाठ में केवल ‘व्यभिचारी’ रखा गया
  alternative: ‘परमेश्वर से विश्वासघात करनेवाले व्यभिचारी’
  rationale: होशे की पुस्तक में व्यभिचार वाचा के प्रति अविश्वास का रूपक हो सकता है, किंतु इस पद का शब्द स्वयं सीधा ‘व्यभिचारी’ कहता है। विस्तार न करने से शाब्दिक और रूपक दोनों अर्थों के बीच का तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तंदूर,’ ‘आटा गूँधना,’ और ‘खमीर उठना’ घरेलू पकाने के बिंब को स्वाभाविक हिन्दी में बनाए रखते हैं। कठिन क्रिया מֵעִיר का प्रसंगानुकूल अर्थ मुख्य पाठ में दिया गया है और उसकी वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
