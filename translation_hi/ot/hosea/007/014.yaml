language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹֽא זָעֲק֤וּ אֵלַ/י֙ בְּ/לִבָּ֔/ם כִּ֥י יְיֵלִ֖ילוּ עַל מִשְׁכְּבוֹתָ֑/ם עַל דָּגָ֧ן וְ/תִיר֛וֹשׁ יִתְגּוֹרָ֖רוּ יָס֥וּרוּ בִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/014.yaml
  text: They do not cry out to me from their heart[a], but they wail on their beds; for grain and new wine they gather themselves; they turn away from me.
translation:
  language: hi
  text: 'वे हृदय से मुझे नहीं पुकारते,

    बल्कि अपने बिछौनों पर विलाप करते हैं;

    अन्न और नए दाखमधु के लिए वे इकट्ठे होते हैं[a];

    वे मुझसे विमुख हो जाते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अन्न और नए दाखमधु के लिए वे अपने शरीर को चीरते हैं।” यहाँ प्रयुक्त इब्रानी क्रिया का अर्थ कठिन है; वह इकट्ठे होने या अनुष्ठानिक विलाप में स्वयं को काटने की ओर संकेत कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: זָעֲקוּ
  choice: पुकारते
  rationale: यह क्रिया संकट में सहायता के लिए ऊँची और व्याकुल पुकार को व्यक्त करती है। ‘पुकारते’ सहज हिन्दी है और प्रसंग में उसकी तीव्रता स्पष्ट रहती है।
- source_word: אֵלַי בְּלִבָּם
  choice: हृदय से मुझे
  rationale: यह शब्द-क्रम भीतर की सच्ची निष्ठा और केवल बाहरी विलाप के बीच का विरोध बनाए रखता है।
- source_word: כִּי
  choice: बल्कि
  rationale: यहाँ כִּי पिछले निषेध के विपरीत उनके वास्तविक व्यवहार को सामने लाता है; इसलिए प्रसंगगत विरोध को ‘बल्कि’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְיֵלִילוּ
  choice: विलाप करते हैं
  rationale: यह ऊँचे स्वर में रोने या शोक मनाने का बोध देता है। ‘विलाप’ गरिमापूर्ण और आधुनिक मानक हिन्दी में स्पष्ट है।
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: अपने बिछौनों पर
  rationale: सीधा स्थानवाचक अनुवाद मूल चित्र को सुरक्षित रखता है।
- source_word: דָּגָן וְתִירוֹשׁ
  choice: अन्न और नई दाखमधु
  rationale: דָּגָן सामान्यतः अनाज/अन्न और תִירוֹשׁ ताज़ी या नई दाखमधु को दर्शाता है; यह कृषि-संदर्भ को बनाए रखता है।
- source_word: יִתְגּוֹרָרוּ
  choice: वे इकट्ठे होते हैं
  rationale: मसोरेटी पाठ के कठिन क्रिया-रूप का यह निकट और समर्थित अर्थ है। अनुष्ठान के रूप में अपने शरीर को चीरने का वैकल्पिक पाठ/अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: יָסוּרוּ בִי
  choice: वे मुझसे फिर जाते हैं
  rationale: यह परमेश्वर से विमुख होने या उसके विरुद्ध मुड़ने का भाव रखता है। ‘मुझसे फिर जाते हैं’ मूल की संबंधपरक और वाचागत अवज्ञा को बिना अनावश्यक रूप से तीखा किए व्यक्त करता है।
theological_decisions:
- issue: יִתְגּוֹרָרוּ का कठिन अर्थ
  choice: अन्न और नई दाखमधु के लिए उनका इकट्ठा होना
  alternative: अन्न और नई दाखमधु के लिए अपने शरीर को चीरना
  rationale: उपलब्ध मसोरेटी रूप को ‘इकट्ठे होते हैं’ समझना भाषिक रूप से संभव और पाठ के निकट है। फिर भी प्राचीन साक्ष्य और विद्वत् परंपरा में अनुष्ठानिक आत्म-विदारण का अर्थ महत्वपूर्ण है; अतः धर्मवैचारिक तनाव को मिटाने के बजाय उसे पाद-टिप्पणी में रखा गया है।
- issue: बाहरी विलाप और सच्ची पुकार का विरोध
  choice: ‘हृदय से’ और ‘बल्कि’ द्वारा विरोध को स्पष्ट रखना
  alternative: כִּי को कारणवाचक ‘क्योंकि’ कहना
  rationale: प्रसंग उनके शोरपूर्ण विलाप को परमेश्वर की ओर सच्चे मन से मुड़ने के विपरीत रखता है। ‘बल्कि’ इस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उनकी अंतःस्थिति को मूल से अधिक विस्तार देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य अपनाया गया है। ‘हृदय’, ‘विलाप’, ‘बिछौना’ और ‘दाखमधु’ बाइबलीय गरिमा रखते हुए सामान्य पाठक के लिए बोधगम्य हैं। पंक्ति-विभाजन इब्रानी समानांतरता और विरोध को उभारता है।
