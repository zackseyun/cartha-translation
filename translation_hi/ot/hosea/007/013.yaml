id: HOS.7.13
reference: Hosea 7:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: א֤וֹי לָ/הֶם֙ כִּֽי נָדְד֣וּ מִמֶּ֔/נִּי שֹׁ֥ד לָ/הֶ֖ם כִּֽי פָ֣שְׁעוּ בִ֑/י וְ/אָנֹכִ֣י אֶפְדֵּ֔/ם וְ/הֵ֕מָּה דִּבְּר֥וּ עָלַ֖/י כְּזָבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/013.yaml
  text: Woe to them[a], for they have wandered away from me! Destruction is theirs, for they have rebelled against me. Though I would redeem them, they speak lies against me.
translation:
  language: hi
  text: हाय उन पर! क्योंकि वे मुझसे भटक गए हैं। उन पर विनाश, क्योंकि उन्होंने मेरे विरुद्ध विद्रोह किया है। यद्यपि मैं उन्हें छुड़ाना चाहता हूँ,[a] फिर भी वे मेरे विरुद्ध झूठ बोलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “फिर भी मैं उन्हें छुड़ाऊँगा”; कुछ लोग क्रिया को भूतकाल में समझते हैं: “पर मैंने उन्हें छुड़ाया।”'
    reason: इब्रानी अपूर्ण क्रिया के इच्छासूचक/अभिप्रायात्मक, भविष्यकालीन और संभावित भूतकालीन अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: א֤וֹי
  choice: हाय
  rationale: यह विस्मयादिबोधक विलाप और न्याय की चेतावनी—दोनों का भाव रखता है; ‘हाय’ हिन्दी की भविष्यद्वाणी-संबंधी गरिमा बनाए रखता है।
- source_word: נָדְדוּ מִמֶּנִּי
  choice: मुझसे भटककर दूर चले गए हैं
  rationale: נדד में भटकने अथवा दूर चले जाने का भाव है; यह चयन दूरी और संबंध-विच्छेद दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שֹׁד לָהֶם
  choice: उनका विनाश हो
  rationale: שֹׁד विनाश या तबाही को दर्शाता है। इब्रानी की संक्षिप्त न्याय-घोषणा को हिन्दी में सहज और प्रबल रूप दिया गया है।
- source_word: פָשְׁעוּ בִי
  choice: उन्होंने मेरे विरुद्ध विद्रोह किया है
  rationale: פשע केवल सामान्य पाप नहीं, बल्कि निष्ठा तोड़ने और विद्रोह करने का प्रबल अर्थ रखता है।
- source_word: וְאָנֹכִי אֶפְדֵּם
  choice: यद्यपि मैं उन्हें छुड़ाना चाहता हूँ
  rationale: अपूर्ण क्रिया אֶפְדֵּם को यहाँ परमेश्वर की इच्छा अथवा तत्परता के रूप में लिया गया है; ‘यद्यपि’ आगे के विरोध को स्पष्ट करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: דִּבְּרוּ עָלַי כְּזָבִים
  choice: वे मेरे विरुद्ध झूठ बोलते हैं
  rationale: यह अभिव्यक्ति परमेश्वर के विरुद्ध निर्देशित झूठे कथनों को सीधे और स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: וְאָנֹכִי אֶפְדֵּם में परमेश्वर के छुटकारे संबंधी कथन का काल और भाव
  choice: यद्यपि मैं उन्हें छुड़ाना चाहता हूँ
  alternative: 'फिर भी मैं उन्हें छुड़ाऊँगा; अथवा: पर मैंने उन्हें छुड़ाया'
  rationale: इब्रानी अपूर्ण क्रिया गैर-भूतकालीन इच्छा या अभिप्राय का समर्थन करती है, पर निश्चयात्मक भविष्य और भूतकालीन अर्थ भी प्रस्तावित किए गए हैं। मुख्य पाठ परमेश्वर की छुड़ाने की इच्छा और लोगों के झूठ के बीच तनाव को रखता है; पादटिप्पणी अन्य संभावनाएँ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट भविष्यद्वाणी-संबंधी शैली। ‘छुड़ाना’ सामान्य पाठक के लिए बोधगम्य है और פדה के उद्धार/मुक्ति के भाव को रखता है।
