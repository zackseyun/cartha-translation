language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֻּלָּ֤/ם יֵחַ֨מּוּ֙ כַּ/תַּנּ֔וּר וְ/אָכְל֖וּ אֶת שֹֽׁפְטֵי/הֶ֑ם כָּל מַלְכֵי/הֶ֣ם נָפָ֔לוּ אֵין קֹרֵ֥א בָ/הֶ֖ם אֵלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/007.yaml
  text: All of them are hot like an oven[a], and they devour their judges; all their kings have fallen. None among them calls to me.
translation:
  language: hi
  text: वे सब तंदूर के समान तप रहे हैं और अपने न्यायियों[a] को निगल जाते हैं; उनके सभी राजा गिर चुके हैं। उनमें से कोई भी मुझे नहीं पुकारता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शासकों।” इब्रानी शब्द केवल न्यायिक अधिकारियों के लिए ही नहीं, बल्कि शासन करने वाले अधिकारियों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: वे सब
  rationale: यह इब्रानी के समग्र और व्यापक आरोप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יֵחַמּוּ
  choice: तप रहे हैं
  rationale: חמם के गरम या दहकते होने के भाव और तंदूर के रूपक को बनाए रखता है, पर उस ताप को कामना, क्रोध या षड्यंत्र में से किसी एक तक सीमित नहीं करता।
- source_word: כַּתַּנּוּר
  choice: तंदूर के समान
  rationale: तनּוּר के आग से तपे भट्ठी-सदृश पात्र का परिचित और सटीक हिन्दी रूप है तथा अनुच्छेद में बार-बार आने वाले रूपक को सुरक्षित रखता है।
- source_word: וְאָכְלוּ
  choice: और ... निगल जाते हैं
  rationale: शाब्दिक 'खा जाते हैं' के हिंसक रूपक को स्वाभाविक हिन्दी में प्रबलता से व्यक्त करता है; इब्रानी सिद्ध क्रिया को प्रसंग में बार-बार घटने वाली सजीव कार्रवाई के रूप में प्रस्तुत किया गया है।
- source_word: אֶת שֹׁפְטֵיהֶם
  choice: अपने न्यायियों
  rationale: שׁפט का सीधा अर्थ न्याय करने वालों से है; राजनीतिक प्रसंग में व्यापक 'शासक' अर्थ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: כָּל מַלְכֵיהֶם נָפָלוּ
  choice: उनके सभी राजा गिर चुके हैं
  rationale: बार-बार आने वाली समग्रता को बनाए रखता है और 'गिरने' को मृत्यु, पदच्युति या दोनों में से किसी एक के रूप में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֵין קֹרֵא בָהֶם אֵלָי
  choice: उनमें से कोई भी मुझे नहीं पुकारता
  rationale: अस्तित्वात्मक निषेध और परमेश्वर की ओर पुकारने के सम्बन्धपरक भाव को स्पष्ट, सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: तंदूर के ताप को किसी खास नैतिक आवेग के रूप में स्पष्ट करना
  choice: 'रूपक को बिना सीमित व्याख्या के रखा गया: ''तंदूर के समान तप रहे हैं'''
  alternative: कामवासना से जल रहे हैं; क्रोध से धधक रहे हैं; षड्यंत्र में तप रहे हैं
  rationale: निकटवर्ती प्रसंग उग्र अभिलाषा और विनाशकारी राजनीतिक षड्यंत्र की ओर संकेत करता है, पर यह पद ताप का कोई एक कारण स्पष्ट नहीं करता।
- issue: שֹׁפְטֵיהֶם का संकीर्ण या व्यापक राजनीतिक अर्थ
  choice: मुख्य पाठ में 'न्यायियों', पादटिप्पणी में 'शासकों'
  alternative: मुख्य पाठ में 'शासकों'
  rationale: प्रत्यक्ष शब्दार्थ को मुख्य पाठ में रखते हुए भविष्यद्वाणी के राजनीतिक प्रसंग में सम्भव व्यापक अर्थ भी सुरक्षित रहता है।
- issue: राजाओं के 'गिरने' का आशय
  choice: '''गिर चुके हैं'' कहकर परिणाम को खुला रखा गया'
  alternative: मारे गए हैं; पद से हटा दिए गए हैं
  rationale: נפל पतन, पराजय, पदच्युति या मृत्यु का संकेत दे सकता है; स्रोत यहाँ किसी एक प्रकार को स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। 'तंदूर' रूपक को ठोस और परिचित बनाए रखता है; 'निगल जाते हैं' राजनीतिक हिंसा की तीव्रता व्यक्त करता है। मुख्य पाठ में [a] चिह्न सम्बद्ध शब्द के तुरंत बाद दिया गया है।
