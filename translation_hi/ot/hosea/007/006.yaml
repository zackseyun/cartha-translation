source:
  edition: WLC
  text: כִּֽי קֵרְב֧וּ כַ/תַּנּ֛וּר לִבָּ֖/ם בְּ/אָרְבָּ֑/ם כָּל הַ/לַּ֨יְלָה֙ יָשֵׁ֣ן אֹֽפֵ/הֶ֔ם בֹּ֕קֶר ה֥וּא בֹעֵ֖ר כְּ/אֵ֥שׁ לֶהָבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/006.yaml
  text: For they draw near with their hearts like an oven in their lying in wait[a]; all night their baker sleeps[b], but in the morning it burns like a flaming fire.
translation:
  language: hi
  text: क्योंकि घात लगाते समय वे तंदूर के समान हृदय लेकर निकट आते हैं[a]। सारी रात उनका रोटियाँ पकानेवाला सोता रहता है[b], पर भोर होते ही वह धधकती आग के समान जल उठता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू पंक्ति का वाक्य-विन्यास संक्षिप्त और कठिन है। इसका अर्थ यह भी समझा जा सकता है: “घात लगाते समय वे अपने हृदय को तंदूर के समान तपाते हैं।”'
    reason: textual_ambiguity
  - marker: b
    text: शाब्दिक अर्थ “उनका पकानेवाला” है। तंदूर के इस विस्तृत रूपक में यह आग को सँभालनेवाले व्यक्ति को दिखाता है और संभवतः उनकी गरम होती साज़िश को उकसानेवाले की ओर संकेत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: קֵרְבוּ
  choice: वे निकट आते हैं
  rationale: क्रिया קרב के निकट आने के मूल बिंब को बनाए रखता है और यह नहीं ठहराता कि वे किसके निकट आते हैं। हिब्रू का पूर्ण रूप संदर्भ में घटती हुई साज़िश का सजीव वर्णन करता है, इसलिए स्वाभाविक हिन्दी वर्तमान काल लिया गया है।
- source_word: כַתַּנּוּר
  choice: तंदूर के समान
  rationale: כ द्वारा व्यक्त स्पष्ट उपमा को बनाए रखता है। ‘तंदूर’ सामान्य हिन्दी में उस प्राचीन भट्ठी-सदृश पकाने के साधन और उसकी तीव्र गरमी को सहज रूप से व्यक्त करता है।
- source_word: לִבָּם
  choice: उनका हृदय
  rationale: हिब्रू में एकवचन संज्ञा के साथ बहुवचन संबंधसूचक प्रत्यय है; सामूहिक एकवचन ‘उनका हृदय’ उसी रूप और साझा षड्यंत्रकारी मनोभाव को बनाए रखता है।
- source_word: בְּאָרְבָּם
  choice: घात लगाते समय
  rationale: ארב में छिपकर अवसर देखने अथवा आक्रमण के लिए घात लगाने का भाव है। यह हिन्दी पदबंध उस क्रियात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יָשֵׁן
  choice: सोता रहता है
  rationale: रात भर जारी अवस्था को सहज हिन्दी में व्यक्त करता है।
- source_word: אֹפֵהֶם
  choice: उनका पकानेवाला
  rationale: शाब्दिक बिंब ‘उनका बेकर/पकानेवाला’ को हिन्दी में समझने योग्य रूप में बनाए रखता है और तंदूर के विस्तारित रूपक को समय से पहले नहीं खोलता।
- source_word: בֹעֵר
  choice: जल उठता है
  rationale: בער के जलने या धधकने के अर्थ को व्यक्त करता है; ‘उठता’ सुबह अचानक प्रकट होनेवाली तीव्रता के साथ स्वाभाविक बैठता है।
- source_word: כְאֵשׁ לֶהָבָה
  choice: धधकती आग के समान
  rationale: आग और लौ की तीव्र छवि को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: तंदूर के रूपक में कर्ता और अभिकर्ता की पहचान
  choice: निकट आनेवालों, उनके सामूहिक हृदय, तंदूर और ‘उनके पकानेवाले’ की छवियों को अलग-अलग बनाए रखा गया है; अंतिम ‘वह’ को जानबूझकर स्पष्ट नहीं किया गया।
  alternative: ‘पकानेवाले’ को षड्यंत्र भड़कानेवाला व्यक्ति बताना, अथवा सुबह जलनेवाले को स्पष्ट रूप से हृदय या तंदूर कहना।
  rationale: हिब्रू वाक्य-विन्यास संक्षिप्त और रूपकात्मक है। किसी विशेष षड्यंत्रकारी या रूपक के अंतिम संकेत की पहचान निश्चित कर देना मूल पाठ की वास्तविक अस्पष्टता को अनावश्यक रूप से मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप रखा गया है। ‘हृदय’, ‘घात लगाना’, ‘तंदूर’ और ‘धधकती आग’ मूल की काव्यात्मक तथा षड्यंत्रकारी छवि को बनाए रखते हैं; कठिन हिब्रू वाक्य-विन्यास की वैकल्पिक समझ फुटनोट में दी गई है।
