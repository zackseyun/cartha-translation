  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और भविष्यवाणी-साहित्य के अनुरूप गरिमापूर्ण शैली रखी गई है। दोनों बार आने वाले ‘वह इसे नहीं जानता’ को दोहराकर इब्रानी का जोर सुरक्षित रखा गया है।
