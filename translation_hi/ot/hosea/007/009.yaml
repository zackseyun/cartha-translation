source:
  edition: WLC
  text: אָכְל֤וּ זָרִים֙ כֹּח֔/וֹ וְ/ה֖וּא לֹ֣א יָדָ֑ע גַּם שֵׂיבָה֙ זָ֣רְקָה בּ֔/וֹ וְ/ה֖וּא לֹ֥א יָדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/009.yaml
  text: Strangers have devoured his strength[a], but he does not know it; even gray hair is sprinkled on him[b], but he does not know it.
translation:
  language: hi
  text: परदेशियों ने उसकी शक्ति निगल ली है[a], पर वह इसे नहीं जानता; यहाँ तक कि उसके बालों में सफेदी बिखर गई है[b], पर वह इसे नहीं जानता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विदेशियों ने उसकी शक्ति खपा दी है।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उस पर सफेदी बिखर गई है”—यह बुढ़ापे और क्षय का चित्र है।
    reason: cultural_note
lexical_decisions:
- source_word: אָכְלוּ
  choice: निगल ली है
  rationale: אכל का मूल अर्थ ‘खाना’ है, पर यहाँ राष्ट्र की शक्ति के क्षय के लिए सजीव रूपक है। ‘निगल ली’ विनाशकारी उपभोग की तीव्रता बनाए रखता है।
- source_word: זָרִים
  choice: परदेशियों
  rationale: संदर्भ में यह अपरिचित व्यक्तियों की अपेक्षा विदेशी लोगों या शक्तियों को सूचित करता है; ‘परदेशी’ इस अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: כֹּחוֹ
  choice: उसकी शक्ति
  rationale: כֹּחַ शक्ति, सामर्थ्य या जीवन-बल को सूचित कर सकता है। ‘शक्ति’ राष्ट्रीय क्षय के व्यापक अर्थ को रखता है और इसे केवल सैन्य बल तक सीमित नहीं करता।
- source_word: וְהוּא לֹא יָדָע
  choice: पर वह इसे नहीं जानता
  rationale: दोहराया गया वाक्यांश उसकी अनभिज्ञता पर जोर देता है। संदर्भ से निहित कर्म को हिंदी में ‘इसे’ द्वारा स्पष्ट किया गया है।
- source_word: גַּם
  choice: यहाँ तक कि
  rationale: 'यह दूसरे चित्र को पहले से आगे बढ़ाता है: शक्ति घटने के साथ वृद्धावस्था के चिह्न भी प्रकट हो चुके हैं।'
- source_word: שֵׂיבָה
  choice: बालों में सफेदी
  rationale: शब्द का ठोस अर्थ सफेद या पके बाल है। हिंदी में यह प्रयोग मूल के वृद्धावस्था और पतन के चित्र को सहज रूप से बनाए रखता है।
- source_word: זָרְקָה בּוֹ
  choice: उसके बालों में … छा गई है
  rationale: शाब्दिक चित्र में सफेदी उस पर बिखेरी गई है। मुख्य पाठ में ‘छा गई’ स्वाभाविक हिंदी देता है, जबकि पादटिप्पणी मूल बिखराव के चित्र को सुरक्षित रखती है।
