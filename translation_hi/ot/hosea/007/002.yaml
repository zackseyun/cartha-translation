  verdict: revise
  source_fidelity: 'The verse is substantially faithful: it preserves the inward refusal to reckon with God''s remembrance, the totality of their evil, the enclosing image of their deeds, and their exposure before God. However, “पर” gives the initial וּבַל an adversative force that is possible but not required; “और” more directly reflects the Hebrew conjunction without adding contrast.'
  naturalness: The Hindi is clear, modern, and suitably grave. “अपने मन में नहीं कहते,” “याद रखता हूँ,” and “उन्हें घेरे हुए हैं” are idiomatic. The parallel final clauses remain concise and intelligible.
  terminology: “बुराई” appropriately renders the collective moral sense of רָעָה, and “कर्म” is an apt, dignified rendering of מַעַלְלֵיהֶם in this prophetic context. “मेरे सामने” naturally conveys the idiom נֶגֶד פָּנַי; a note preserves the more literal facial expression.
  issues:
  - severity: low
    issue: The opening conjunction is rendered adversatively as “पर.”
    rationale: וּבַל is most directly “and they do not.” Although an adversative nuance can be argued from context, it is not demanded by the wording. “और” preserves the source's connective flow and avoids strengthening the contrast.
