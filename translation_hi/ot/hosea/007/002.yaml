id: HOS.7.2
reference: Hosea 7:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בַל יֹֽאמְרוּ֙ לִ/לְבָבָ֔/ם כָּל רָעָתָ֖/ם זָכָ֑רְתִּי עַתָּה֙ סְבָב֣וּ/ם מַֽעַלְלֵי/הֶ֔ם נֶ֥גֶד פָּנַ֖/י הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/002.yaml
  text: And they do not say in their heart that I remember all their evil[a]. Now their deeds surround them[c][b]; they are before my face.
translation:
  language: hi
  text: और वे अपने मन में नहीं कहते कि मैं उनकी सारी बुराई याद रखता हूँ। अब उनके कर्म उन्हें घेरे हुए हैं; वे मेरे सामने हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַל
  choice: पर ... नहीं
  rationale: संयोजक और निषेध यहाँ पिछले संदर्भ के विपरीत एक सतत अभियोग प्रस्तुत करते हैं। हिन्दी में “पर” इस प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יֹאמְרוּ לִלְבָבָם
  choice: अपने मन में नहीं कहते
  rationale: शाब्दिक बिंब “अपने हृदय से कहना” आंतरिक विचार या आत्म-संवाद को दर्शाता है। “अपने मन में कहते” उस बिंब और अर्थ दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: כָּל רָעָתָם
  choice: उनकी सारी बुराई
  rationale: רָעָה सामूहिक रूप से नैतिक बुराई या दुष्टता को सूचित करता है। “सारी बुराई” में स्वभाव और कर्म दोनों समा सकते हैं।
- source_word: זָכָרְתִּי
  choice: मैं ... याद रखता हूँ
  rationale: पूर्ण रूप यहाँ वर्तमान में कायम परमेश्वर की सजग स्मृति को व्यक्त करता है। “याद रखता हूँ” केवल अतीत में स्मरण करने के बजाय निरंतर उत्तरदायित्व का भाव देता है।
- source_word: עַתָּה
  choice: अब
  rationale: यह उनकी उपेक्षा के वर्तमान परिणाम की ओर संकेत करने वाला सीधा काल-सूचक है।
- source_word: סְבָבוּם
  choice: उन्हें घेरे हुए हैं
  rationale: क्रिया चारों ओर घेरने का रूपक रखती है; उनके अपने कर्म उन्हें घेरकर उनके विरुद्ध उपस्थित हैं।
- source_word: מַעַלְלֵיהֶם
  choice: उनके कर्म
  rationale: यह शब्द नैतिक रंग लिए हुए कार्यों या आचरण को दर्शाता है। “कर्म” आधुनिक, संक्षिप्त और गरिमापूर्ण है।
- source_word: נֶגֶד פָּנַי
  choice: मेरे सामने
  rationale: इब्रानी का शाब्दिक अर्थ “मेरे मुख के सामने” है। हिन्दी में “मेरे सामने” परमेश्वर की प्रत्यक्ष दृष्टि और उपस्थिति का मुहावरेदार भाव सुरक्षित रखता है, जबकि कृत्रिम शारीरिकता से बचता है।
- source_word: הָיוּ
  choice: हैं
  rationale: 'यद्यपि रूप पूर्ण है, प्रसंग “अब” से जुड़ी वर्तमान स्थिति बताता है: उनके कर्म परमेश्वर के सामने उपस्थित हैं।'
theological_decisions:
- issue: परमेश्वर की स्मृति और न्याय का मानवरूपी वर्णन
  choice: वे मेरे सामने हैं
  alternative: वे मेरे मुख के सामने हैं
  rationale: मूल पाठ परमेश्वर की सीधी जानकारी और जाँच को ठोस स्थानिक भाषा में व्यक्त करता है। स्वाभाविक हिन्दी “मेरे सामने” इस धार्मिक तनाव को बनाए रखती है, बिना मूल से अधिक शारीरिक अर्थ आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; भविष्यवाणी-संबंधी अभियोग के लिए सरल, गंभीर और गरिमापूर्ण शैली। वाक्य-रचना मूल के दो चरणों—भीतरी विचार का अभाव और कर्मों का वर्तमान घेरा—को स्पष्ट रखती है।
