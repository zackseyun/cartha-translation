language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּ/רָפְאִ֣/י לְ/יִשְׂרָאֵ֗ל וְ/נִגְלָ֞ה עֲוֺ֤ן אֶפְרַ֨יִם֙ וְ/רָע֣וֹת שֹֽׁמְר֔וֹן כִּ֥י פָעֲל֖וּ שָׁ֑קֶר וְ/גַנָּ֣ב יָב֔וֹא פָּשַׁ֥ט גְּד֖וּד בַּ/חֽוּץ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/001.yaml
  text: When I would heal Israel[a], the iniquity of Ephraim is uncovered, and the evil deeds of Samaria; for they practice falsehood. A thief comes in[c][b]; a raiding band strips outside.
translation:
  language: hi
  text: जब मैं इस्राएल को चंगा करना चाहता हूँ[a], तब एप्रैम का अधर्म और सामरिया के बुरे काम प्रकट हो जाते हैं; क्योंकि वे छल करते हैं। चोर भीतर घुसता है, और लुटेरों का दल बाहर लूटपाट करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब मैंने इस्राएल को चंगा किया”; अथवा, “जब मैं इस्राएल को चंगा कर रहा था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָפְאִי
  choice: जब मैं ... चंगा करना चाहता हूँ
  rationale: כְּ temporal circumstance व्यक्त करता है और प्रथम पुरुष प्रत्यय परमेश्वर को वक्ता दिखाता है। यह चयन आरम्भ होने वाली अथवा अभिप्रेत चंगाई को स्वाभाविक हिन्दी में व्यक्त करता है; भूतकाल और जारी क्रिया की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल को
  rationale: चंगाई के कर्म का लक्ष्य; प्रचलित हिन्दी बाइबलीय नामरूप रखा गया है।
- source_word: וְנִגְלָה
  choice: प्रकट हो जाते हैं
  rationale: निफ़अल रूप छिपी बात के खुलने या उजागर होने का भाव देता है। संयुक्त कर्ताओं के कारण हिन्दी में बहुवचन स्वाभाविक है।
- source_word: עֲוֺן
  choice: अधर्म
  rationale: यहाँ नैतिक दोष या कुटिलता अभिप्रेत है; ‘अधर्म’ वाचा-संबंधी अपराध का गंभीर भाव बनाए रखता है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: उत्तरी राज्य के लिए प्रयुक्त व्यक्तिवाचक नाम का प्रचलित हिन्दी रूप।
- source_word: וְרָעוֹת
  choice: बुरे काम
  rationale: רָעוֹת का बहुवचन यहाँ भुगती हुई विपत्तियों के बजाय नैतिक बुराइयों को सूचित करता है; ‘बुरे काम’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: שֹׁמְרוֹן
  choice: सामरिया
  rationale: राजधानी और उसके निवासियों/शासन के लिए प्रयुक्त नाम का प्रचलित हिन्दी रूप।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है।
- source_word: פָעֲלוּ שָׁקֶר
  choice: वे छल करते हैं
  rationale: ‘करना/उत्पन्न करना’ और שֶׁקֶר का संयोजन नियमित कपटपूर्ण आचरण बताता है। ‘छल करते हैं’ संक्षिप्त और स्वाभाविक है।
- source_word: וְגַנָּב יָבֹוא
  choice: चोर भीतर घुसता है
  rationale: יָבֹוא का मूल अर्थ ‘आता/प्रवेश करता है’ है; प्रसंग में चोर के प्रवेश को हिन्दी में ‘भीतर घुसता है’ स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פָּשַׁט גְּדוּד בַּחוּץ
  choice: लुटेरों का दल बाहर लूटपाट करता है
  rationale: פָּשַׁט और גְּדוּד मिलकर छापा मारने और लूटने वाले दल की छवि देते हैं। यह भीतर घुसते चोर और बाहर खुलेआम लूटते दल का विरोध बनाए रखता है।
theological_decisions:
- issue: परमेश्वर की चंगाई और पाप के प्रकट होने का कालगत संबंध
  choice: परमेश्वर जब इस्राएल को चंगा करना चाहता है, उसी अवसर पर एप्रैम का अधर्म प्रकट होता है।
  alternative: जब परमेश्वर ने इस्राएल को चंगा किया, तब उसका अधर्म प्रकट हुआ; अथवा चंगा करते समय वह प्रकट हुआ।
  rationale: इब्रानी पदबंध ‘जब/जैसे मैं चंगा करता हूँ’ के अर्थ की अनुमति देता है। मुख्य पाठ अभिप्रेत या आरम्भिक कार्य का भाव रखता है, पर सम्भव भूतकालीन और जारी-क्रिया पाठ पादटिप्पणी में सुरक्षित हैं; इससे यह तनाव बना रहता है कि पुनर्स्थापना का प्रयास भ्रष्टता को ढकता नहीं, उजागर करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘चंगा करना’, ‘अधर्म’, ‘एप्रैम’ और ‘सामरिया’ जैसे परिचित बाइबलीय पद बनाए गए हैं। अंतिम पंक्ति को शब्दशः अस्वाभाविक ‘बाहर उघाड़ता है’ के बजाय मूल की छापा मारने और लूटने की छवि के अनुरूप व्यक्त किया गया है।
