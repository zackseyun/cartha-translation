base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/005.yaml
  text: On the day of our king[a], the princes made themselves sick with the heat of wine[c][b]; he stretched out his hand with mockers.
translation:
  language: hi
  text: हमारे राजा के दिन[a] अधिकारियों ने दाखमधु की जलन से अपने को बीमार कर लिया[b]; उसने ठट्ठा करनेवालों से हाथ मिलाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे राजा का दिन।” कुछ लोग इसे राजा के सम्मान में मनाया जानेवाला उत्सव-दिन समझते हैं, पर इब्रानी में केवल “हमारे राजा का दिन” है।
    reason: lexical_alternative
  - marker: b
    text: “दाखमधु की जलन” का अर्थ “दाखमधु की तपिश” या, कम संभावना से, “दाखमधु का विष” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: “हाथ मिलाया” इब्रानी के शाब्दिक “अपना हाथ बढ़ाया” का स्वाभाविक हिन्दी रूप है और यहाँ संभवतः ठट्ठा करनेवालों के साथ मेल-जोल या सहभागिता रखने का संकेत देता है।
    reason: cultural_note
lexical_decisions:
- source_word: י֣וֹם מַלְכֵּ֔נוּ
  choice: हमारे राजा के दिन
  rationale: यह रचना का निकट और स्वाभाविक हिन्दी रूप है। राजकीय उत्सव का आशय संभव है, पर इब्रानी में ‘उत्सव’ स्पष्ट नहीं है।
- source_word: הֶחֱל֥וּ
  choice: अपने को बीमार कर बैठे
  rationale: 'חלה के हिफ़ईल रूप को प्रसंग में कारणवाचक/आत्मवाचक समझा गया है: मदिरा के अति सेवन से हाकिमों ने स्वयं को बीमार कर लिया। ‘कर बैठे’ अनपेक्षित या मूर्खतापूर्ण परिणाम को सहज हिन्दी में व्यक्त करता है।'
- source_word: שָׂרִ֖ים
  choice: हाकिम
  rationale: शब्द राजदरबार के शासकों, उच्च अधिकारियों या सरदारों को सूचित करता है। ‘हाकिम’ आधुनिक पाठक के लिए बोधगम्य रहते हुए दरबारी संदर्भ बनाए रखता है।
- source_word: חֲמַ֣ת מִיָּ֑יִן
  choice: दाखमधु की जलन से
  rationale: חמה की ‘गरमी/जलन’ वाली सजीव छवि सुरक्षित रखी गई है; इसे निश्चित रूप से ‘विष’ कहना प्रसंग से अधिक व्याख्यात्मक होगा।
- source_word: מָשַׁ֥ךְ יָד֖וֹ
  choice: अपना हाथ बढ़ाया
  rationale: इब्रानी क्रिया-चित्र को बनाए रखा गया है। प्रसंग में यह संगति या सहभागिता का संकेत देता है, पर मुख्य पाठ में उस अर्थ को पूरी तरह खोलकर नहीं कहा गया।
- source_word: אֶת לֹצְצִֽים
  choice: ठट्ठा करनेवालों की ओर
  rationale: לֹצְצִים उपहास करने या धर्म-विवेक की अवहेलना करनेवालों को दर्शाता है। हाथ बढ़ाने की हिन्दी अभिव्यक्ति के साथ ‘की ओर’ स्वाभाविक है; सहभागिता का निहित अर्थ टिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ‘उसने अपना हाथ बढ़ाया’ में कर्ता की पहचान
  choice: एकवचन ‘उसने’ रखा गया है, जिसका सबसे स्वाभाविक पूर्वपद राजा है।
  alternative: भाव के आधार पर इसे दरबार के हाकिमों के सामूहिक कार्य से जोड़ा जा सकता है।
  rationale: इब्रानी क्रिया एकवचन है, लेकिन कर्ता फिर से स्पष्ट रूप से नहीं कहा गया। इसलिए अनुवाद ‘राजा ने’ जोड़कर संभावित अस्पष्टता को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दाखमधु’ बाइबलीय संदर्भ में अंगूरी मदिरा को स्पष्ट करता है; ‘हाकिम’ राजदरबार के उच्च पदाधिकारियों के लिए प्रयुक्त है। मूल की अस्पष्टता—विशेषकर अंतिम खंड के एकवचन कर्ता—को सुरक्षित रखा गया है।
