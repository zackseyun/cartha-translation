base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/010.yaml
  text: The pride of Israel testifies against him[a], yet they do not return to Yahweh their God[b], nor do they seek him in all this.
translation:
  language: hi
  text: इस्राएल का घमंड उसके विरुद्ध गवाही देता है[a], फिर भी वे याहवे, अपने परमेश्वर, की ओर नहीं लौटते और इस सब में भी उसे नहीं खोजते[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सामने” अथवा “उसके मुँह पर”; इब्रानी में शाब्दिक रूप से “उसके मुख के सामने/पर” है।
    reason: lexical_alternative
  - marker: b
    text: या, “इस सब के बावजूद।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנָה
  choice: गवाही देता है
  rationale: यहाँ ענה, גאון ישראל और בפניו के साथ मिलकर किसी के विरुद्ध साक्ष्य देने का भाव व्यक्त करता है; यह भविष्यद्वाणी के आरोपात्मक संदर्भ में स्वाभाविक है।
- source_word: גְאוֹן יִשְׂרָאֵל
  choice: इस्राएल का घमंड
  rationale: גאון का अर्थ गौरव, ऊँचाई या घमंड हो सकता है; होशे के फटकार-भरे संदर्भ में नकारात्मक अर्थ ‘घमंड’ उपयुक्त है।
- source_word: בְּפָנָיו
  choice: उसके विरुद्ध
  rationale: शाब्दिक रूप से ‘उसके मुख पर/उसके सामने’; गवाही देने के न्यायिक भाव के साथ ‘उसके विरुद्ध’ स्वाभाविक है और एकवचन प्रत्यय को बनाए रखता है।
- source_word: שָׁבוּ אֶל
  choice: के पास लौटते
  rationale: שוב אל परमेश्वर की ओर पश्चातापपूर्वक और संबंध की पुनर्स्थापना के लिए लौटने का भाव रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: स्वत्व-सूचक रूप को स्वाभाविक हिन्दी में सुरक्षित रखता है और इस विडंबना को उभारता है कि वे अपने ही परमेश्वर के पास नहीं लौटते।
- source_word: בִקְשֻׁהוּ
  choice: उसे नहीं खोजते
  rationale: בקש यहाँ परमेश्वर को सहायता, संबंध और आराधना में खोजने का व्यापक भाव रखता है।
- source_word: בְּכָל זֹאת
  choice: इन सब बातों के बीच भी
  rationale: यह निकटवर्ती परिस्थितियों और दंडों की समग्रता की ओर संकेत करता है; ‘बीच भी’ मूल के स्थानिक रूप और संदर्भ के रियायती भाव दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: בפניו के एकवचन प्रत्यय का संदर्भ
  choice: ‘उसके विरुद्ध’ के रूप में एकवचन रखा गया
  alternative: सामूहिक इस्राएल के अनुसार ‘उनके विरुद्ध’ करना, अथवा ‘उसके सामने’ समझना
  rationale: इब्रानी प्रत्यय एकवचन है और ‘इस्राएल’ सामूहिक एकवचन के रूप में उसका संदर्भ हो सकता है। अगले खंड के बहुवचन ‘वे’ के साथ संख्या-परिवर्तन को मिटाया नहीं गया।
- issue: בכל זאת का संबंधसूचक या रियायती भाव
  choice: ‘इन सब बातों के बीच भी’
  alternative: ‘इन सब बातों के बावजूद’
  rationale: चुना हुआ रूप इब्रानी की निकट संरचना को बनाए रखते हुए संदर्भ में निहित ‘फिर भी’ का भाव देता है; अधिक स्पष्ट रियायती अर्थ पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और आरोपात्मक भविष्यद्वाणी के स्वर के अनुकूल भाषा रखी गई है। ‘इस्राएल’ के सामूहिक एकवचन से बहुवचन ‘वे’ की मूल संख्या-परिवर्तन को सुरक्षित रखा गया है।
