source:
  edition: WLC
  text: יָשׁ֣וּבוּ לֹ֣א עָ֗ל הָיוּ֙ כְּ/קֶ֣שֶׁת רְמִיָּ֔ה יִפְּל֥וּ בַ/חֶ֛רֶב שָׂרֵי/הֶ֖ם מִ/זַּ֣עַם לְשׁוֹנָ֑/ם ז֥וֹ לַעְגָּ֖/ם בְּ/אֶ֥רֶץ מִצְרָֽיִם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/016.yaml
  text: They turn[a], but not upward; they are like a deceitful bow. Their princes will fall by the sword because of the insolence of their tongue[b]. This will be their mockery in the land of Egypt.
translation:
  language: hi
  text: वे लौटते हैं[a], पर ऊपर की ओर नहीं; वे धोखा देनेवाले धनुष के समान हैं[b]। उनके हाकिम उनकी जीभ की उग्रता के कारण तलवार से गिरेंगे। मिस्र देश में इसी बात को लेकर उनका उपहास होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर परमप्रधान की ओर नहीं।” यह व्याख्या “ऊपर” को पिछले पद की शब्दावली के प्रभाव से परमेश्वर की ओर संकेत करने वाला लुप्त पदबंध समझती है।
    reason: alternative_reading
  - marker: b
    text: “धोखा देनेवाला धनुष” का अर्थ “ढीला,” “विश्वासघाती” या “दोषपूर्ण धनुष” भी हो सकता है—अर्थात ऐसा धनुष जिस पर सही निशाना लगाने के लिए भरोसा नहीं किया जा सकता।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: वे लौटते हैं
  rationale: שׁוּב का मूल अर्थ ‘लौटना/मुड़ना’ है। ‘लौटते हैं’ नैतिक और राजनीतिक दिशा-बदलाव की संभावना को बनाए रखता है।
- source_word: לֹא עָל
  choice: पर ऊपर की ओर नहीं
  rationale: इब्रानी पदबंध कठिन है और शाब्दिक रूप से ‘ऊपर नहीं’ कहता है। इसी अस्पष्टता को मुख्य पाठ में रखा गया है; ‘परमप्रधान की ओर नहीं’ को पादटिप्पणी में दिया गया है।
- source_word: כְּקֶשֶׁת רְמִיָּה
  choice: धोखा देनेवाले धनुष के समान
  rationale: רְמִיָּה छल, विश्वासघात या अविश्वसनीयता का बोध करा सकता है। धनुष के संदर्भ में यह ऐसे अस्त्र का चित्र है जो ठीक निशाना न लगाए और जिस पर भरोसा न किया जा सके।
- source_word: יִפְּלוּ בַחֶרֶב
  choice: तलवार से गिरेंगे
  rationale: यह युद्ध अथवा न्याय में मारे जाने का प्रचलित इब्रानी मुहावरा है; ‘गिरेंगे’ मूल क्रिया के चित्र को बनाए रखता है।
- source_word: שָׂרֵיהֶם
  choice: उनके हाकिम
  rationale: שַׂר शासक, प्रधान या अधिकारी को दर्शाता है। ‘हाकिम’ आधुनिक हिन्दी में राजनीतिक नेतृत्व का स्वाभाविक और गरिमापूर्ण शब्द है।
- source_word: מִזַּעַם לְשׁוֹנָם
  choice: अपनी जीभ के रोष के कारण
  rationale: זַעַם का अर्थ रोष, क्रोध या आक्रोश है। अभिव्यक्ति को जानबूझकर निकट रखा गया है ताकि उनकी उग्र अथवा उद्दंड वाणी का संकेत बिना किसी एक व्याख्या तक सीमित किए बना रहे।
- source_word: לַעְגָּם
  choice: उनका उपहास होगा
  rationale: לַעַג उपहास या तिरस्कार को दर्शाता है। हिन्दी में यह परिणाम स्पष्ट करता है कि वे मिस्र में हँसी और तिरस्कार का विषय बनेंगे।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: मूल के पूर्ण भौगोलिक पदबंध ‘मिस्र देश में’ को संक्षिप्त किए बिना रखा गया है।
theological_decisions:
- issue: לֹא עָל का आशय
  choice: मुख्य पाठ में ‘पर ऊपर की ओर नहीं’
  alternative: ‘पर परमप्रधान की ओर नहीं’
  rationale: इस पद में ‘परमप्रधान’ स्पष्ट रूप से नहीं लिखा है, यद्यपि पिछले पद का עֶלְיוֹן इस अर्थ को प्रभावित कर सकता है। अतः मुख्य पाठ दिशासूचक अस्पष्टता बनाए रखता है और ईश्वर-संबंधी व्याख्या पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हाकिम,’ ‘रोष’ और ‘उपहास’ सामान्य पाठक के लिए बोधगम्य रहते हुए भविष्यद्वाणी की गंभीरता बनाए रखते हैं। पादटिप्पणी [b] को उसके वास्तविक विषय ‘धनुष’ के बाद रखा गया है।
