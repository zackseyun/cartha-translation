  text: וַ/יְהִ֣י אֶפְרַ֔יִם כְּ/יוֹנָ֥ה פוֹתָ֖ה אֵ֣ין לֵ֑ב מִצְרַ֥יִם קָרָ֖אוּ אַשּׁ֥וּר הָלָֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/011.yaml
  text: Ephraim has become like a silly dove[a], without sense; they call to Egypt, they go to Assyria.
translation:
  language: hi
  text: एप्रैम भोली कबूतरी के समान हो गया है, जिसमें समझ नहीं है[a]; वे मिस्र को पुकारते हैं, अश्शूर को जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “जिसमें हृदय नहीं है।” यहाँ “हृदय” समझ या विवेक के अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: हो गया है
  rationale: यह रूप एक उत्पन्न हुई और वर्तमान में प्रासंगिक दशा को व्यक्त करता है; हिन्दी का पूर्ण वर्तमान इस भाव को स्वाभाविक रूप से पहुँचाता है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: मूल पाठ में उत्तरी राज्य के लिए प्रयुक्त इस गोत्रीय नाम को व्याख्यात्मक रूप से ‘इस्राएल’ करने के बजाय नाम के रूप में रखा गया है।
- source_word: כְּיוֹנָה
  choice: कबूतरी के समान
  rationale: יוֹנָה स्त्रीलिंग है और यहाँ उपमा में प्रयुक्त हुआ है; ‘कबूतरी’ चित्र को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: פוֹתָה
  choice: नासमझ
  rationale: यह शब्द भोलेपन, सरलता और आसानी से बहक जाने का भाव रखता है। ‘नासमझ’ भविष्यद्वक्ता की आलोचनात्मक वाणी को व्यक्त करता है, बिना अनावश्यक अर्थ-विस्तार के।
- source_word: אֵין לֵב
  choice: जिसमें समझ नहीं है
  rationale: शाब्दिक अर्थ ‘जिसमें हृदय नहीं’ है, पर इस इब्रानी मुहावरे में לֵב विवेक या समझ का बोध कराता है।
- source_word: מִצְרַיִם קָרָאוּ
  choice: वे मिस्र को पुकारते हैं
  rationale: קרא यहाँ सहायता या गठबंधन के लिए पुकारने का भाव रखता है। ‘पुकारते हैं’ मूल क्रिया के निकट रहते हुए आश्रय माँगने के संकेत को खुला रखता है।
- source_word: אַשּׁוּר הָלָכוּ
  choice: अश्शूर चले जाते हैं
  rationale: הלך यहाँ राजनयिक सहायता की खोज में अश्शूर की ओर जाने को दर्शाता है। ‘चले जाते हैं’ हिन्दी में गमन को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘एप्रैम’ का संदर्भ
  choice: मुख्य पाठ में ‘एप्रैम’ नाम रखा गया है, जो प्रसंग में उत्तरी राज्य का प्रतिनिधित्व करता है।
  alternative: ‘इस्राएल’ या ‘उत्तरी राज्य’
  rationale: मूल पाठ स्पष्ट रूप से एप्रैम कहता है। नाम को बनाए रखना अनावश्यक व्याख्यात्मक प्रतिस्थापन से बचाता है और होशे की भविष्यद्वाणी की शब्दावली सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नासमझ’ और ‘समझ नहीं’ की निकट पुनरावृत्ति मूल इब्रानी के दोहरे आरोप—פוֹתָה और אֵין לֵב—को सुरक्षित रखती है। दोनों अंतिम खंडों की संक्षिप्त समानांतर रचना भी यथासंभव बनाए रखी गई है।
