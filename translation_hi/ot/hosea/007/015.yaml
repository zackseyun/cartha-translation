source:
  edition: WLC
  text: וַ/אֲנִ֣י יִסַּ֔רְתִּי חִזַּ֖קְתִּי זְרֽוֹעֹתָ֑/ם וְ/אֵלַ֖/י יְחַשְּׁבוּ רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/015.yaml
  text: Though I trained and strengthened their arms[a], yet they devise evil against me.
translation:
  language: hi
  text: यद्यपि मैंने उन्हें प्रशिक्षित किया और उनकी भुजाओं को मजबूत किया, फिर भी वे मेरे विरुद्ध बुरी योजनाएँ बनाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִסַּרְתִּי
  choice: अनुशासित किया
  rationale: יסר में शिक्षा, प्रशिक्षण और सुधारात्मक अनुशासन—इन सभी का भाव हो सकता है। ‘अनुशासित किया’ इस व्यापकता को ‘प्रशिक्षित किया’ की अपेक्षा बेहतर सुरक्षित रखता है और अगले वाक्यांश में सामर्थ्य देने के सकारात्मक भाव से भी असंगत नहीं है।
- source_word: חִזַּקְתִּי
  choice: बल दिया
  rationale: पिएल रूप का अर्थ ‘मज़बूत करना’ है। भुजाओं के साथ ‘बल दिया’ स्वाभाविक आधुनिक हिन्दी है और मूल अर्थ को सीधे व्यक्त करता है।
- source_word: זְרוֹעֹתָם
  choice: उनकी भुजाओं
  rationale: शाब्दिक शारीरिक बिंब ‘भुजाएँ’ को बनाए रखा गया है; इसे केवल अमूर्त ‘शक्ति’ में नहीं बदला गया।
- source_word: וְאֵלַי
  choice: फिर भी ... मेरे विरुद्ध
  rationale: शाब्दिक दिशा-सूचक भाव ‘मेरी ओर’ है, पर ‘बुरी योजनाएँ बनाना’ के साथ सन्दर्भ में इसका आशय परमेश्वर के विरुद्ध शत्रुतापूर्ण अभिप्राय है।
- source_word: יְחַשְּׁבוּ רָע
  choice: बुरी योजनाएँ बनाते हैं
  rationale: חשב के साथ רע केवल बुरा सोचने के बजाय बुरी मंशा गढ़ने या योजना बनाने का भाव देता है। यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וַאֲנִי
  choice: यद्यपि मैंने ही
  rationale: सर्वनाम की स्पष्ट उपस्थिति को ‘ही’ से उभारा गया और प्रसंगगत विरोध को ‘यद्यपि ... फिर भी’ द्वारा स्वाभाविक हिन्दी में व्यक्त किया गया।
theological_decisions:
- issue: יִסַּרְתִּי में परमेश्वर के कार्य का स्वरूप
  choice: अनुशासित किया—जिसमें शिक्षा और सुधार, दोनों की सम्भावना बनी रहती है
  alternative: प्रशिक्षित किया / ताड़ना दी
  rationale: मूल क्रिया रचनात्मक प्रशिक्षण से लेकर सुधारात्मक ताड़ना तक अर्थ दे सकती है। समानांतर पद ‘उनकी भुजाओं को बल दिया’ सकारात्मक, सामर्थ्यदायक कार्य की ओर झुकाता है, पर दण्डात्मक-सुधारात्मक छाया को पूरी तरह मिटाना उचित नहीं; इसलिए व्यापक ‘अनुशासित किया’ चुना गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भुजाओं’ द्वारा मूल का सजीव बिंब सुरक्षित है। किसी पादटिप्पणी की आवश्यकता नहीं रखी गई, क्योंकि ‘अनुशासित किया’ स्वयं मूल क्रिया की प्रमुख अर्थ-व्याप्ति को पर्याप्त रूप से समेटता है।
