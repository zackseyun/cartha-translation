  yaml_path: translation/ot/genesis/007/016.yaml
  text: And those that entered[a], male and female from all flesh, as God had commanded him[c][b]; and Yahweh shut him in.
translation:
  language: hi
  text: और जो भीतर प्रवेश कर रहे थे[a], वे सभी प्राणियों में से नर और मादा थे[b]; वे आए, जैसी आज्ञा परमेश्वर ने उसे दी थी। तब याहवे ने उसे भीतर बंद कर दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो भीतर आए” या “जो प्रवेश करने आए थे।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “सब मांस में से”; यहाँ यह जीवित प्राणियों के लिए सामूहिक अभिव्यक्ति है।
    reason: cultural_note
  - marker: c
    text: या, “उसके पीछे बंद कर दिया।” हिब्रू में ‘द्वार’ का स्पष्ट उल्लेख नहीं है, यद्यपि प्रसंग में उसका संकेत मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּאִים
  choice: और जो आनेवाले थे
  rationale: निश्चित उपपद सहित कृदंत का संज्ञात्मक बल बनाए रखता है और अगले בָּאוּ (‘वे आए’) की पुनरावृत्ति को भी संभव बनाता है।
- source_word: זָכָר וּנְקֵבָה
  choice: नर और मादा
  rationale: पशु-जगत के संदर्भ में लिंग-भेद बताने वाला सहज और सटीक हिन्दी युग्म।
- source_word: מִכָּל בָּשָׂר
  choice: सब देहधारियों में से
  rationale: מִן के ‘में से’ भाव और בָּשָׂר के सामूहिक ‘देहधारी जीव’ अर्थ, दोनों को संक्षेप में व्यक्त करता है।
- source_word: בָּאוּ
  choice: वे अंदर आए
  rationale: अलग मुख्य क्रिया के रूप में हिब्रू की पुनरुक्त संरचना बनाए रखता है; संदर्भ के कारण ‘अंदर’ जहाज़ में प्रवेश स्पष्ट करता है।
- source_word: כַּאֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִים
  choice: जैसा परमेश्वर ने उसे आज्ञा दी थी
  rationale: आज्ञा और उसके अनुसार हुए प्रवेश का संबंध स्वाभाविक हिन्दी में व्यक्त होता है; पूर्ण भूतकाल पूर्ववर्ती आज्ञा को स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत दिव्य नाम का हिन्दी लिप्यंतरण, किसी उपाधि से उसका स्थानापन्न नहीं।
- source_word: וַיִּסְגֹּר ... בַּעֲדוֹ
  choice: उसे भीतर बंद कर दिया
  rationale: मुहावरे का प्रसंगानुकूल अर्थ देता है और हिब्रू में अनुपस्थित ‘द्वार’ को मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: בַּעֲדוֹ में बंद किए जाने का आशय
  choice: उसे भीतर बंद कर दिया
  alternative: उसके पीछे बंद कर दिया
  rationale: सन्दूक में नूह की सुरक्षा का प्रसंगानुकूल अर्थ व्यक्त होता है, पर ‘द्वार’ को स्पष्ट रूप से जोड़ने से बचा गया है; अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। हिब्रू की कृदंत-मुख्य क्रिया पुनरावृत्ति को ‘जो आनेवाले थे … वे अंदर आए’ से रखा गया है। ‘देहधारी’ शाब्दिक ‘मांस’ की तुलना में हिन्दी में अधिक स्वाभाविक है, जबकि उसका शाब्दिक रूप पादटिप्पणी में दिया गया है।
