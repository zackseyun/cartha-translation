source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שֵׁשׁ מֵא֤וֹת שָׁנָה֙ לְ/חַיֵּי נֹ֔חַ בַּ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָֽה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ בַּ/יּ֣וֹם הַ/זֶּ֗ה נִבְקְעוּ֙ כָּֽל מַעְיְנֹת֙ תְּה֣וֹם רַבָּ֔ה וַ/אֲרֻבֹּ֥ת הַ/שָּׁמַ֖יִם נִפְתָּֽחוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/011.yaml
  text: In the six hundredth year of Noah’s life[a], in the second month, on the seventeenth day of the month, on that day all the springs of the great deep burst open[b], and the windows of the heavens were opened.
translation:
  language: hi
  text: नूह के जीवन के छह सौवें वर्ष में, दूसरे महीने के सत्रहवें दिन—उसी दिन—बड़े गहरे जल के सारे सोते[a] फूट पड़े, और आकाश के झरोखे[b] खुल गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारे जल-स्रोत।”
    reason: lexical_alternative
  - marker: b
    text: या “आकाश के जल-द्वार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שֵׁשׁ מֵאוֹת שָׁנָה לְחַיֵּי נֹחַ
  choice: नूह के जीवन के छः सौवें वर्ष में
  rationale: यह काल-सूचक रचना नूह की आयु के आधार पर वर्ष बताती है; हिन्दी में यह अभिव्यक्ति स्वाभाविक रहते हुए मूल की गणना-पद्धति को बनाए रखती है।
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: दूसरे महीने के सत्रहवें दिन
  rationale: इब्रानी में प्रयुक्त संख्या तिथि का बोध कराती है; हिन्दी में क्रमवाचक रूप स्वाभाविक है।
- source_word: בַּיּוֹם הַזֶּה
  choice: उसी दिन
  rationale: यह पद अभी बताई गई ठीक उसी तिथि पर बल देता है; ‘उसी दिन’ उस कथात्मक जोर को संक्षेप में सुरक्षित रखता है।
- source_word: נִבְקְעוּ כָּל מַעְיְנֹת תְּהוֹם רַבָּה
  choice: विशाल अथाह जलराशि के सारे सोते फूट पड़े
  rationale: מַעְיְנֹת के लिए ‘सोते’ जल-स्रोत का सहज हिन्दी शब्द है। תְּהוֹם רַבָּה की आदिम, गहरी जलराशि की छवि को आधुनिक वैज्ञानिक व्याख्या में बदले बिना ‘विशाल अथाह जलराशि’ से व्यक्त किया गया है; נִבְקְעוּ की विनाशकारी तीव्रता ‘फूट पड़े’ में आती है।
- source_word: אֲרֻבֹּת הַשָּׁמַיִם
  choice: आकाश के झरोखे
  rationale: ‘झरोखे’ मूल में निहित खिड़कियों या खुले स्थानों की दृश्यात्मक छवि बनाए रखता है; ‘आकाश’ आधुनिक हिन्दी में שָׁמַיִם का स्वाभाविक सामूहिक रूप है।
- source_word: נִפְתָּחוּ
  choice: खोल दिए गए
  rationale: यह निफ़अल रूप की निष्क्रियता को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: जलप्रलय की ब्रह्मांडीय छवि
  choice: ‘विशाल अथाह जलराशि’ और ‘आकाश के झरोखे’ की प्राचीन दृश्यात्मक भाषा को बनाए रखा गया है।
  alternative: ‘भूमिगत पानी फूट निकला’ और ‘आकाश के बाँध खुल गए’ जैसी आधुनिक या व्याख्यात्मक भाषा।
  rationale: मूल पाठ जल के नीचे और ऊपर से आने की ब्रह्मांडीय छवि प्रस्तुत करता है। अनुवाद उसे किसी आधुनिक वैज्ञानिक विवरण में बदलकर अंतर्निहित तनाव को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। तिथि-सूत्र की पुनरुक्ति और ‘उसी दिन’ का जोर सुरक्षित रखा गया है। ‘जलराशि’ तथा ‘झरोखे’ मूल की ब्रह्मांडीय छवि को सामान्य पाठक के लिए बोधगम्य रखते हैं।
