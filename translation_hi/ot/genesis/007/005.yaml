translation:
  language: hi
  text: और नूह ने वह सब कुछ किया जिसकी आज्ञा याहवे ने उसे दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ने…किया
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ है; आज्ञा के संदर्भ में ‘किया’ स्वाभाविक है और नूह के आज्ञापालन को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: נֹחַ
  choice: नूह
  rationale: हिन्दी बाइबल परंपरा में इस व्यक्तिगत नाम का प्रचलित और पहचाना हुआ रूप।
- source_word: כְּכֹל אֲשֶׁר
  choice: ठीक वैसा ही…जैसा
  rationale: כְּכֹל में निहित पूर्ण अनुरूपता को सहज आधुनिक हिन्दी में व्यक्त करता है; इससे यह स्पष्ट रहता है कि नूह का काम पूरी आज्ञा के अनुरूप था।
- source_word: צִוָּהוּ
  choice: उसे आज्ञा दी थी
  rationale: צוה के लिए ‘आज्ञा देना’ गरिमापूर्ण और प्रचलित समतुल्य है; ‘दी थी’ आज्ञा के नूह के कार्य से पहले दिए जाने को स्वाभाविक हिन्दी में दिखाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णी ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी के सामान्य पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘ठीक वैसा ही…जैसा’ मूल की पूर्ण अनुरूपता को स्वाभाविक ढंग से व्यक्त करता है।
