    issue: “पानी आ गया था” adds an eventive arrival and shifts the clause into a pluperfect-like expression.
    rationale: הָיָה is formally stative (“was”), and the verse does not explicitly say that the water “came.” Hindi can express the source construction naturally as “जलप्रलय का पानी ... था.”
  - severity: low
