    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: नूह
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी रूप लिया गया है। आरम्भिक וְ का संबंध अगले समन्वित वाक्य में ‘और’ से स्वाभाविक रूप से प्रकट होता है; हिन्दी में यहाँ आरम्भ में अलग से ‘और’ आवश्यक नहीं।
- source_word: בֶּן שֵׁשׁ מֵאוֹת שָׁנָה
  choice: छः सौ वर्ष का था
  rationale: इब्रानी का शाब्दिक मुहावरा ‘छः सौ वर्ष का पुत्र’ आयु बताने का सामान्य ढंग है; वर्तमान हिन्दी में इसका स्वाभाविक अर्थ ‘छः सौ वर्ष का था’ है।
- source_word: וְ/הַ/מַּבּוּל
  choice: और … जलप्रलय
  rationale: מַבּוּל उत्पत्ति 6–9 के विशिष्ट महाप्रलय को सूचित करता है। ‘जलप्रलय’ हिन्दी में अर्थ और प्रसंग दोनों को स्पष्ट रखता है।
- source_word: הָיָה מַיִם
  choice: पानी आ गया था
  rationale: शाब्दिक संरचना ‘जलप्रलय पानी था’ हिन्दी में अस्वाभाविक है। היה को प्रसंगानुसार घटनात्मक अर्थ में और מַיִם को ‘पानी’ के रूप में प्रस्तुत करने से मूल कथन का भाव स्पष्ट रहता है, बिना यह जोड़ने के कि पानी कैसे फैला या छाया।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: עַל का स्वाभाविक अनुवाद ‘पर’ है। הָאָרֶץ का व्यापक प्रसंगगत अर्थ ‘पृथ्वी’ मुख्य पाठ में लिया गया है, जबकि ‘देश/भूमि’ की वास्तविक शब्दार्थ-संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: הָאָרֶץ का क्षेत्रगत अर्थ
  choice: पृथ्वी
  alternative: देश या भूमि
  rationale: संज्ञा का अर्थ ‘पृथ्वी’ अथवा ‘देश/भूमि’ दोनों हो सकता है। व्यापक जलप्रलय-वृत्तांत में ‘पृथ्वी’ अधिक स्वाभाविक है, पर वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है ताकि पाठ से अधिक कोई सिद्धान्त न थोपा जाए।
- issue: הָיָה מַיִם की वाक्य-रचना
  choice: पानी आ गया था
  alternative: जलप्रलय पृथ्वी पर पानी था
  rationale: मूल की असामान्य शाब्दिक संरचना को यथावत रखने पर हिन्दी कठिन और अस्पष्ट होती। घटनात्मक अनुवाद अर्थ को सुबोध बनाता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘जलप्रलय’ बाइबिलीय प्रसंग के लिए परिचित है, जबकि ‘पानी’ वाक्य को सामान्य पाठक के लिए सहज बनाता है। समन्वित संरचना मूल के दो कथनों को बनाए रखती है और ‘जब…तब’ जैसा स्पष्ट कालगत संबंध नहीं जोड़ती।
