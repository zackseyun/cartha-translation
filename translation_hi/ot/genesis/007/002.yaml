id: GEN.7.2
reference: Genesis 7:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה תִּֽקַּח לְ/ךָ֛ שִׁבְעָ֥ה שִׁבְעָ֖ה אִ֣ישׁ וְ/אִשְׁתּ֑/וֹ וּ/מִן הַ/בְּהֵמָ֡ה אֲ֠שֶׁר לֹ֣א טְהֹרָ֥ה הִ֛וא שְׁנַ֖יִם אִ֥ישׁ וְ/אִשְׁתּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/002.yaml
  text: From every clean animal you shall take for yourself seven pairs[a], a male and its mate; and from the animals that are not clean, two[b], a male and its mate.
translation:
  language: hi
  text: सब शुद्ध पशुओं में से अपने लिए सात जोड़े[a] लेना—नर और उसकी मादा; और जो पशु शुद्ध नहीं हैं, उनमें से दो[b] लेना—नर और उसकी मादा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “सात-सात, नर और उसकी मादा” है। इसका सम्भावित अर्थ सात जोड़े है, हालाँकि कुछ लोग इसे कुल सात पशु समझते हैं।
    reason: alternative_reading
  - marker: b
    text: अर्थात एक नर और एक मादा। इब्रानी में केवल “दो” कहा गया है।
    reason: clarification
lexical_decisions:
- source_word: מִכֹּל הַבְּהֵמָה
  choice: हर एक ... पशु में से
  rationale: מִן के साथ כֹּל स्रोत-समूह में से वितरण का भाव देता है। आधुनिक हिन्दी में ‘हर एक ... में से’ स्वाभाविक है; בְּהֵמָה के लिए व्यापक और सहज ‘पशु’ उपयुक्त है।
- source_word: הַטְּהוֹרָה
  choice: शुद्ध
  rationale: यहाँ טָהוֹר पशुओं की शुद्ध-अशुद्ध श्रेणी का संकेत करता है। ‘शुद्ध’ संक्षिप्त, पारंपरिक और बोधगम्य है; ‘अनुष्ठानिक रूप से शुद्ध’ मूल से अधिक व्याख्यात्मक होता।
- source_word: תִּקַּח לְךָ
  choice: अपने लिए ... लेना
  rationale: निर्देशात्मक अपूर्ण क्रिया को हिन्दी में आज्ञार्थक infinitive से व्यक्त किया गया है और לְךָ को ‘अपने लिए’ द्वारा सुरक्षित रखा गया है।
- source_word: שִׁבְעָה שִׁבְעָה
  choice: सात-सात जोड़े
  rationale: दोहराया गया अंक वितरण या समूह का भाव देता है और आगे ‘नर और उसकी मादा’ आने से जोड़ों का अर्थ सबसे संभावित है। सम्भव शाब्दिक/वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
- source_word: אִישׁ וְאִשְׁתּוֹ
  choice: नर और उसकी मादा
  rationale: शाब्दिक रूप से मानवीय दम्पति-संज्ञाएँ यहाँ पशुओं के लैंगिक जोड़े के लिए मुहावरेदार हैं। ‘नर और उसकी मादा’ पशु-संदर्भ में स्वाभाविक है और ‘पति-पत्नी’ जैसा अनावश्यक मानवीकरण नहीं करता।
- source_word: אֲשֶׁר לֹא טְהֹרָה הִוא
  choice: जो ... शुद्ध नहीं हैं
  rationale: मूल में एकल विशेषण ‘अशुद्ध’ के बजाय विश्लेषणात्मक नकार ‘शुद्ध नहीं’ है; हिन्दी में उसी रूप को रखा गया है। सामूहिक एकवचन को स्वाभाविक हिन्दी के लिए बहुवचन अर्थ में व्यक्त किया गया है।
- source_word: שְׁנַיִם
  choice: दो
  rationale: मूल शब्द सीधे ‘दो’ कहता है। आगे ‘नर और उसकी मादा’ से स्पष्ट होता है कि ये दो पशु एक जोड़ा बनाते हैं, इसलिए मुख्य पाठ में ‘एक जोड़ा’ कहकर अर्थ को अधिक निश्चित नहीं किया गया।
theological_decisions:
- issue: शुद्ध पशुओं की संख्या-वाचक अभिव्यक्ति का अर्थ
  choice: सात जोड़े
  alternative: सात अलग-अलग पशु; अथवा अधिक शाब्दिक ‘सात-सात’
  rationale: שִׁבְעָה שִׁבְעָה के बाद אִישׁ וְאִשְׁתּוֹ और अशुद्ध पशुओं के ‘दो—नर और उसकी मादा’ से तुलना सात नर-मादा जोड़ों का प्रबल संकेत देती है। फिर भी मूल की अभिव्यक्ति पर दूसरी समझ सम्भव होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य की आज्ञात्मक संरचना को हिन्दी में ‘लेना’ के समानांतर रूपों से रखा गया है। ‘शुद्ध नहीं’ मूल के विश्लेषणात्मक नकार को बचाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
