  text: וַ/יָּ֣בֹא נֹ֗חַ וּ֠/בָנָי/ו וְ/אִשְׁתּ֧/וֹ וּ/נְשֵֽׁי בָנָ֛י/ו אִתּ֖/וֹ אֶל הַ/תֵּבָ֑ה מִ/פְּנֵ֖י מֵ֥י הַ/מַּבּֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/007.yaml
  text: And Noah, with his sons, his wife, and his sons’ wives with him, entered the ark because of the waters of the flood.
translation:
  language: hi
  text: और नूह अपने बेटों, अपनी पत्नी और अपने बेटों की पत्नियों के साथ जलप्रलय के पानी के कारण जहाज़ में गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: गया
  rationale: בוא का अर्थ प्रसंग के अनुसार ‘आना’, ‘जाना’ या ‘प्रवेश करना’ हो सकता है। אֶל הַתֵּבָה के साथ यहाँ ‘जहाज़ में गया’ स्वाभाविक हिन्दी में भीतर जाने की गति व्यक्त करता है।
- source_word: נֹחַ
  choice: नूह
  rationale: हिन्दी बाइबल परंपरा में इस इब्रानी नाम का प्रचलित और सहज रूप ‘नूह’ है।
- source_word: בָנָיו
  choice: अपने बेटों
  rationale: इब्रानी शब्द विशेष रूप से पुत्रों को दर्शाता है; ‘बच्चों’ कहने से मूल की विशिष्टता घट जाती।
- source_word: אִשְׁתּוֹ
  choice: अपनी पत्नी
  rationale: इस पारिवारिक प्रसंग में אִשָּׁה का प्रत्यययुक्त रूप स्पष्टतः ‘उसकी पत्नी’ है; हिन्दी वाक्य में कर्ता नूह होने के कारण ‘अपनी’ स्वाभाविक है।
- source_word: נְשֵׁי בָנָיו
  choice: अपने बेटों की पत्नियों
  rationale: यह मूल के रचनात्मक रूप ‘उसके बेटों की पत्नियाँ’ को सीधे सुरक्षित रखता है; ‘बहुओं’ की अपेक्षा अधिक पारदर्शी है।
- source_word: אִתּוֹ
  choice: के साथ
  rationale: यह संगति को व्यक्त करता है। हिन्दी में परिवार के सदस्यों को नूह से जोड़ते हुए ‘के साथ’ स्पष्ट और स्वाभाविक रूप से ‘उसके साथ’ का भाव देता है।
- source_word: אֶל הַתֵּבָה
  choice: जहाज़ में
  rationale: תֵּבָה नूह के विशाल जलयान को दर्शाता है। आधुनिक सामान्य हिन्दी में ‘जहाज़’ स्पष्ट और सुबोध है, और ‘में गया’ दिशा तथा प्रवेश दोनों को व्यक्त करता है।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: यहाँ पदबंध कारण अथवा अवसर बताता है—जलप्रलय के पानी के कारण परिवार जहाज़ में गया।
- source_word: מֵי הַמַּבּוּל
  choice: जलप्रलय के पानी
  rationale: यह अनुवाद इब्रानी के दोनों पदों, ‘पानी’ और ‘जलप्रलय’, को स्पष्ट रूप से बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमामय और सामान्य पाठक के लिए सहज रखी गई है। वाक्यक्रम मूल इब्रानी के निकट है, पर हिन्दी की स्वाभाविकता के लिए संबंधवाचक सर्वनाम ‘अपने/अपनी’ प्रयुक्त हुए हैं।
