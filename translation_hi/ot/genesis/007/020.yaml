base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/020.yaml
  text: The waters rose fifteen cubits higher, and the mountains were covered.
translation:
  language: hi
  text: जल पंद्रह हाथ ऊपर तक बढ़ गया, और पहाड़ ढक गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: पंद्रह हाथ
  rationale: प्राचीन माप ‘अम्मा’ के लिए हिन्दी बाइबल परंपरा में समझा जाने वाला ‘हाथ’ रखा गया है; इसका अर्थ लगभग कोहनी से उँगलियों के सिरे तक की लंबाई है।
- source_word: מִלְמַעְלָה
  choice: और ऊपर
  rationale: यहाँ जल के पहाड़ों से पंद्रह हाथ ऊपर होने का भाव है; ‘और ऊपर’ पूर्ववर्ती संदर्भ के सापेक्ष ऊँचाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גָּבְרוּ הַמָּיִם
  choice: जल ... चढ़ गया
  rationale: गבר का मूल भाव प्रबल होने का है, पर जल के साथ इस प्रसंग में उसके बढ़ने और ऊँचा उठने को ‘चढ़ गया’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיְכֻסּוּ הֶהָרִים
  choice: और पहाड़ ढक गए
  rationale: हिब्रू के कर्मवाच्य को सीधे और स्वाभाविक हिन्दी कर्मवाच्य में रखा गया है।
theological_decisions:
- issue: पंद्रह हाथ की ऊँचाई का संदर्भ-बिंदु
  choice: ‘और ऊपर’ कहकर संदर्भगत तुलना बनाए रखी गई
  alternative: ‘जल पंद्रह हाथ तक प्रबल हुआ’
  rationale: हिब्रू वाक्य रचना में माप और ‘ऊपर’ पहाड़ों के ढके जाने से जुड़ते हैं, लेकिन ठीक व्याकरणिक संबंध पर कुछ अस्पष्टता है। अनुवाद जल के पहाड़ों से ऊपर चढ़ने का सामान्य अर्थ देता है, बिना आधुनिक भूवैज्ञानिक विवरण जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, कथात्मक और गरिमापूर्ण शैली। ‘जल’ बाढ़-वृत्तांत के लिए सहज और साहित्यिक है; ‘पंद्रह हाथ’ प्राचीन माप को परिचित रूप में सुरक्षित रखता है।
