  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי֩ לְ/יָמִ֨ים ע֜וֹד שִׁבְעָ֗ה אָֽנֹכִי֙ מַמְטִ֣יר עַל הָ/אָ֔רֶץ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וּ/מָחִ֗יתִי אֶֽת כָּל הַ/יְקוּם֙ אֲשֶׁ֣ר עָשִׂ֔יתִי מֵ/עַ֖ל פְּנֵ֥י הָֽ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
translation:
  language: hi
  text: क्योंकि अब से सात दिन बाद मैं पृथ्वी पर चालीस दिन और चालीस रात वर्षा कराऊँगा, और जितने भी जीवित प्राणी मैंने बनाए हैं, उन सबको भूमि की सतह से मिटा दूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में दी गई आज्ञा का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְיָמִים עוֹד שִׁבְעָה
  choice: अब सात दिन बाद
  rationale: इब्रानी मुहावरे का आशय है कि वर्षा आरम्भ होने से पहले सात दिन शेष हैं; यह हिन्दी में स्पष्ट और सहज अभिव्यक्ति है।
- source_word: אָנֹכִי מַמְטִיר
  choice: मैं ... वर्षा कराऊँगा
  rationale: हिफ़ील रूप वर्षा कराने की प्रत्यक्ष दैवी क्रिया व्यक्त करता है; स्पष्ट ‘मैं’ मूल के बलाघात को भी बनाए रखता है।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: जलप्रलय के व्यापक संदर्भ में אֶרֶץ के लिए ‘पृथ्वी’ सीधा और उपयुक्त है, जबकि इसे केवल स्थानीय ‘देश’ तक सीमित नहीं किया गया।
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: चालीस दिन और चालीस रात
  rationale: मूल की कालावधि को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וּמָחִיתִי
  choice: मिटा दूँगा
  rationale: מחה में पोंछकर मिटाने या लुप्त कर देने का सजीव भाव है; ‘मिटा दूँगा’ आधुनिक हिन्दी में इस तीव्रता को सहजता से व्यक्त करता है।
- source_word: כָּל הַיְקוּם
  choice: जितने भी जीवित प्राणी ... उन सबको
  rationale: संदर्भ में यह पद जीवित सृष्टि की ओर संकेत करता है; इस चयन से ‘सारा अस्तित्व’ जैसी अतिशयोक्ति से बचते हुए व्यापकता बनी रहती है।
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: मैंने बनाए हैं
  rationale: पूर्ण भूतकालीन सृजन को वर्तमान न्याय से जोड़ता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: भूमि पर से
  rationale: אֲדָמָה को पहले आए אֶרֶץ से अलग रखते हुए ‘भूमि’ चुना गया है; हिन्दी में ‘भूमि पर से’ मूल मुहावरे ‘भूमि के मुख पर से’ का सहज अर्थ देता है।
theological_decisions:
- issue: אֶרֶץ और היקום में जलप्रलय के न्याय का विस्तार
  choice: ‘पृथ्वी’ और ‘जितने भी जीवित प्राणी ... उन सबको’ जैसी व्यापक भाषा
  alternative: ‘देश’ और अधिक स्थानीय अर्थ देने वाली भाषा
  rationale: पद का स्वर व्यापक दैवी न्याय का है। अनुवाद इस व्यापकता को बनाए रखता है, पर आधुनिक वैज्ञानिक प्रश्न या किसी सम्प्रदायगत निष्कर्ष को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। ‘वर्षा कराऊँगा’ दैवी कर्तृत्व स्पष्ट करता है और ‘मिटा दूँगा’ मूल क्रिया की सजीवता बनाए रखता है।
