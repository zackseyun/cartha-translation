base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/009.yaml
  text: Two by two they came to Noah into the ark[a], male and female[b], just as God had commanded Noah.
translation:
  language: hi
  text: दो-दो करके[a] वे नूह के पास जहाज़ में आए—नर और मादा—ठीक वैसे ही जैसे परमेश्वर ने नूह को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जोड़े-जोड़े में”; अधिक शब्दशः, “दो-दो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנַיִם שְׁנַיִם
  choice: दो-दो करके
  rationale: दोहराई गई संख्या जोड़ों में आने का वितरणात्मक भाव व्यक्त करती है। ‘दो-दो करके’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी बल को बनाए रखती है।
- source_word: בָּאוּ
  choice: आए
  rationale: בוא गति के लिए प्रयुक्त सामान्य क्रिया है। ‘आए’ नूह की ओर गति के कथात्मक दृष्टिकोण को सुरक्षित रखता है; ‘प्रवेश किया’ केवल परिणाम पर अधिक बल देता।
- source_word: אֶל נֹחַ
  choice: नूह के पास
  rationale: אֶל नूह की ओर गति दर्शाता है। ‘नूह के पास’ इसका सहज और स्पष्ट हिन्दी रूप है।
- source_word: אֶל הַתֵּבָה
  choice: जहाज़ में
  rationale: यद्यपि אֶל का मूल भाव ‘की ओर’ है, गति और गंतव्य के इस प्रसंग में जहाज़ के भीतर प्रवेश अभिप्रेत है। हिन्दी में ‘जहाज़ में आए’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: זָכָר וּנְקֵבָה
  choice: नर और मादा
  rationale: यह प्राणियों के जैविक जोड़े का मानक इब्रानी पद है। ‘नर और मादा’ सटीक, संक्षिप्त और प्रसंगानुकूल है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह पद परमेश्वर की आज्ञा के साथ पूर्ण अनुरूपता दिखाता है। ‘ठीक वैसे ही जैसे’ उस बल को स्पष्ट रखता है।
- source_word: צִוָּה אֱלֹהִים
  choice: परमेश्वर ने ... आज्ञा दी थी
  rationale: इब्रानी पूर्ण क्रिया पशुओं के आने से पहले दी गई आज्ञा की ओर संकेत करती है। हिन्दी का पूर्ण भूतकाल घटनाक्रम को सहजता से स्पष्ट करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस कथानक में אֱלֹהִים एकमात्र सच्चे परमेश्वर के लिए प्रयुक्त है; ‘परमेश्वर’ मानक हिन्दी बाइबलीय रूप है।
- source_word: תֵּבָה
  choice: जहाज़
  rationale: यह शब्द जलप्रलय में नूह और जीवों को सुरक्षित रखने वाले बड़े जलयान-सदृश पात्र को दर्शाता है। ‘जहाज़’ साधारण आधुनिक हिन्दी पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: पशुओं के आने में कर्तृत्व
  choice: पाठ केवल यह कहता है कि पशु नूह के पास आए और उनका आना परमेश्वर की पहले दी हुई आज्ञा के ठीक अनुरूप था।
  alternative: यह जोड़ना कि वे केवल सहज प्रवृत्ति से आए या नूह ने अकेले अपने प्रयास से उन्हें इकट्ठा किया।
  rationale: इब्रानी पाठ आने की प्रक्रिया या साधन नहीं बताता। अनुवाद परमेश्वर की आज्ञा से अनुरूपता को बनाए रखता है, पर अनकहा तंत्र नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरम्भ में ‘दो-दो करके’ रखकर इब्रानी शब्दक्रम का बल सुरक्षित किया गया है। ‘नर और मादा’ को डैश के बीच रखकर उसके व्याख्यात्मक संबंध को स्पष्ट किया गया है।
