source:
  edition: WLC
  text: וַ/יִּגְבְּר֥וּ הַ/מַּ֛יִם וַ/יִּרְבּ֥וּ מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/תֵּ֥לֶךְ הַ/תֵּבָ֖ה עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/018.yaml
  text: The waters prevailed and increased greatly over the earth[a], and the ark moved along on the surface of the waters.
translation:
  language: hi
  text: जल प्रबल होता गया और पृथ्वी पर बहुत बढ़ता गया, और जहाज़ जल की सतह पर चलता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: प्रबल होता गया
  rationale: גבר जल की बढ़ती शक्ति और प्रभाव को व्यक्त करता है। हिंदी में एकवचन द्रव्यवाचक ‘जल’ के साथ ‘प्रबल होता गया’ इस क्रमिक तीव्रता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמַּיִם
  choice: जल
  rationale: हिब्रू का बहुवचन रूप संदर्भ में सामूहिक जलराशि को दर्शाता है; आधुनिक मानक हिंदी में ‘जल’ अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: וַיִּרְבּוּ מְאֹד
  choice: बहुत ही बढ़ गया
  rationale: רבה के साथ מְאֹד वृद्धि पर प्रबल जोर देता है; ‘बहुत ही बढ़ गया’ उस बल को स्पष्ट और सहज हिंदी में रखता है।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: אָרֶץ का अर्थ ‘पृथ्वी’ या ‘भूमि’ हो सकता है। यहाँ व्यापक जलप्रलय के संदर्भ में ‘पृथ्वी’ उपयुक्त है, जबकि ‘पर’ हिब्रू संबंध को सीधे व्यक्त करता है।
- source_word: וַתֵּלֶךְ
  choice: चलने लगा
  rationale: הלך का मूल अर्थ ‘जाना/चलना’ है। जहाज़ और जल के संदर्भ में ‘चलने लगा’ गति को बनाए रखता है, पर तैरने या बहने की विशेष प्रक्रिया अनावश्यक रूप से नहीं जोड़ता।
- source_word: הַתֵּבָה
  choice: जहाज़
  rationale: नूह के वृत्तांत में תֵּבָה के लिए ‘जहाज़’ साधारण हिंदी पाठक के लिए स्पष्ट और स्थापित संदर्भगत पद है; ‘सन्दूक’ आकार पर अनावश्यक जोर देता।
- source_word: עַל פְּנֵי הַמָּיִם
  choice: जल की सतह पर
  rationale: शाब्दिक ‘जल के मुख पर’ एक हिब्रू मुहावरा है जिसका आशय जल की ऊपरी सतह है; हिंदी में ‘जल की सतह पर’ अर्थ को स्वाभाविक रूप से देता है।
theological_decisions:
- issue: הָאָרֶץ का दायरा
  choice: पृथ्वी
  alternative: भूमि/देश
  rationale: शब्द दोनों अर्थ रख सकता है, पर इस जलप्रलय-वर्णन के निकट संदर्भ में ‘पृथ्वी’ अधिक स्वाभाविक है। यह चयन पद के कथन का अनुवाद करता है, जलप्रलय के भौगोलिक विस्तार पर अलग से कोई सिद्धान्त स्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली। ‘जल’ और ‘पृथ्वी’ साहित्यिक गरिमा रखते हुए सामान्य पाठक के लिए सुबोध हैं। हिब्रू के क्रमिक वाव-रूपों की प्रगतिशीलता को ‘होता गया’ और ‘लगा’ से स्वाभाविक हिंदी में व्यक्त किया गया है।
