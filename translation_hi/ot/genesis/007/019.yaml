  yaml_path: translation/ot/genesis/007/019.yaml
  text: And the waters prevailed exceedingly over the earth[b][a], and all the high mountains under all the heavens were covered.
translation:
  language: hi
  text: और जल पृथ्वी[a] पर अत्यन्त प्रबल हो गया, और समस्त आकाश[b] के नीचे के सभी ऊँचे पहाड़ जल से ढक गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भूमि’; हिब्रू אֶרֶץ का अर्थ प्रसंग के अनुसार ‘पृथ्वी’ या ‘भूमि’ हो सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से ‘सारे आकाशों के नीचे’; इसका स्वाभाविक हिन्दी रूप ‘समस्त आकाश के नीचे’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְרוּ
  choice: प्रबल हो गया
  rationale: क्रिया जल के शक्तिशाली होने या प्रबल होने का भाव व्यक्त करती है। हिन्दी में ‘जल’ को द्रव्यवाचक एकवचन मानकर यह रूप स्वाभाविक है और केवल ‘बढ़ गया’ की अपेक्षा मूल बिंब को बेहतर बनाए रखता है।
- source_word: מְאֹד מְאֹד
  choice: अत्यन्त
  rationale: दो बार आए מְאֹד की तीव्रता को सहज, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है; कृत्रिम पुनरुक्ति से बचते हुए जोर बनाए रखता है।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: עַל का स्थानगत अर्थ ‘पर’ है और इस प्रसंग की व्यापक भाषा में אֶרֶץ के लिए ‘पृथ्वी’ उपयुक्त है; ‘भूमि’ की वास्तविक lexical संभावना पादटिप्पणी में रखी गई है।
- source_word: וַיְכֻסּוּ
  choice: ढक गए
  rationale: यह हिन्दी में पहाड़ों के ढक जाने का परिणामी भाव स्वाभाविक रूप से व्यक्त करता है और हिब्रू कथन का आशय बनाए रखता है।
- source_word: כָּל הֶהָרִים הַגְּבֹהִים
  choice: सभी ऊँचे पहाड़
  rationale: यह मूल पदबंध की व्यापकता, विशेषण और संज्ञा को सीधे तथा सामान्य आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: समस्त आकाश के नीचे
  rationale: हिब्रू שָׁמַיִם का रूप बहुवचन है, पर हिन्दी में ‘समस्त आकाश’ अधिक स्वाभाविक सामूहिक अभिव्यक्ति है और मूल की सार्वभौमिक व्यापकता को बनाए रखती है; अधिक शब्दशः रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: जलप्रलय के प्रसंग में אֶרֶץ का दायरा
  choice: पृथ्वी
  alternative: भूमि
  rationale: ‘समस्त आकाश के नीचे’ के साथ पद का कथात्मक दायरा व्यापक है, इसलिए मुख्य पाठ में ‘पृथ्वी’ चुना गया है। फिर भी אֶרֶץ का अर्थ ‘भूमि/देश’ भी हो सकता है; पाठ से अधिक कोई आधुनिक वैज्ञानिक निष्कर्ष थोपे बिना यह संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जल’ द्रव्यवाचक एकवचन के रूप में प्रयुक्त हुआ है। ‘अत्यन्त प्रबल हो गया’ मूल क्रिया की शक्ति और दोहरे तीव्रताबोधक का भाव संक्षेप में बनाए रखता है।
