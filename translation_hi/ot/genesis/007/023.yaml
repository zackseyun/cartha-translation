id: GEN.7.23
reference: Genesis 7:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּ֜מַח אֶֽת כָּל הַ/יְק֣וּם אֲשֶׁ֣ר עַל פְּנֵ֣י הָֽ/אֲדָמָ֗ה מֵ/אָדָ֤ם עַד בְּהֵמָה֙ עַד רֶ֨מֶשׂ֙ וְ/עַד ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יִּמָּח֖וּ מִן הָ/אָ֑רֶץ וַ/יִשָּׁ֧אֶר אַךְ נֹ֛חַ וַֽ/אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָֽה־־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/023.yaml
  text: He blotted out every living thing that was on the face of the ground[a], from man to livestock to creeping things and to the birds of the heavens. They were blotted out from the earth, and only Noah was left[c][b], and those who were with him in the ark.
translation:
  language: hi
  text: उसने भूमि की सतह पर रहने वाले हर जीव को मिटा दिया[a]—मनुष्य[b] से लेकर पालतू पशुओं, रेंगने वाले जीवों और आकाश के पक्षियों[c] तक। वे पृथ्वी पर से मिटा दिए गए। केवल नूह और उसके साथ जहाज़ में रहने वाले ही बचे रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पोंछकर समाप्त कर दिया”; इब्रानी क्रिया में पोंछ देने या लिखी हुई बात मिटा देने का बिंब है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मनुष्य” प्रतिनिधि अर्थ में पूरी मानवजाति के लिए है।
    reason: lexical_clarification
  - marker: c
    text: या, “आकाश में उड़ने वाले जीव।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמַח / וַיִּמָּחוּ
  choice: मिटा दिया / मिटा दिए गए
  rationale: मחה में पोंछकर हटा देने या मिटा देने का बिंब है। ‘मिटा दिया’ उस बिंब को बनाए रखता है; दूसरी क्रिया का कर्मवाच्य रूप निफ़ाल को दर्शाता है।
- source_word: כָּל הַיְקוּם
  choice: हर जीव
  rationale: बाढ़ के प्रसंग में यह पद भूमि पर अस्तित्व रखने वाले जीवधारियों को सूचित करता है, न कि अमूर्त ‘समस्त अस्तित्व’ को।
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: भूमि की सतह पर
  rationale: यह इब्रानी मुहावरे के स्थानगत अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और הָאֲדָמָה को आगे के הָאָרֶץ से अलग रखता है।
- source_word: מֵאָדָם
  choice: मनुष्य से
  rationale: एकवचन אָדָם यहाँ प्रतिनिधि अर्थ में मानवजाति को दर्शाता है और जीवों की श्रेणियों की सूची आरम्भ करता है।
- source_word: בְּהֵמָה
  choice: पालतू पशु
  rationale: यह घरेलू या पशुधन वाले बड़े भूचर पशुओं के लिए स्पष्ट आधुनिक हिन्दी है; केवल ‘मवेशी’ से अर्थ अनावश्यक रूप से संकरा हो सकता है।
- source_word: רֶמֶשׂ
  choice: रेंगने वाले जीव
  rationale: यह भूमि के पास या भूमि पर चलने वाले छोटे जीवों का स्वाभाविक और प्रसंगानुकूल वर्णन है।
- source_word: עוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षी
  rationale: यह इब्रानी संबंध-वाक्यांश को सहज हिन्दी में रखता है और שָׁמַיִם के यहाँ दृश्य आकाश वाले अर्थ को व्यक्त करता है।
- source_word: מִן הָאָרֶץ
  choice: पृथ्वी पर से
  rationale: הָאָרֶץ के व्यापक कथात्मक अर्थ को व्यक्त करता है, पर बाढ़ के भौगोलिक विस्तार पर अनुवाद से बाहर कोई वैज्ञानिक निष्कर्ष नहीं जोड़ता।
- source_word: וַיִּשָּׁאֶר אַךְ נֹחַ
  choice: केवल नूह ... ही बचे रहे
  rationale: ‘केवल ... ही’ restrictive particle אַךְ को और ‘बचे रहे’ שׁאר को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: וַאֲשֶׁר אִתּוֹ בַּתֵּבָה
  choice: और उसके साथ जहाज़ में रहने वाले
  rationale: यह संबंधवाचक पद नूह के साथ जहाज़ में मौजूद मनुष्यों और जीवों, दोनों को समेट सकता है; इसलिए इसे केवल व्यक्तियों तक सीमित नहीं किया गया। תֵּבָה के लिए नूह के प्रसंग में सुबोध ‘जहाज़’ चुना गया।
theological_decisions:
- issue: बाढ़ में विनाश का भौगोलिक विस्तार
  choice: पद में उल्लिखित भूमि पर रहने वाले जीवों और ‘पृथ्वी पर से’ की व्यापक कथात्मक भाषा को सीधे बनाए रखा गया है।
  alternative: इसे स्पष्ट रूप से क्षेत्रीय अतिशयोक्ति या स्पष्ट वैज्ञानिक वैश्विक कथन बनाना।
  rationale: इब्रानी पाठ की व्यापक कथात्मक शक्ति को न तो नरम किया गया है, न उसकी शब्दावली से आगे बढ़ाकर किसी आधुनिक विवाद का निर्णय किया गया है।
- issue: जहाज़ में नूह के साथ बचे हुओं की पहचान
  choice: ‘उसके साथ जहाज़ में रहने वाले’ कहा गया है, जो मनुष्यों और अन्य जीवों दोनों को समेट सकता है।
  alternative: ‘वे लोग जो उसके साथ थे’ कहकर केवल मनुष्यों का संकेत देना।
  rationale: אֲשֶׁר का रूप स्वयं केवल व्यक्तियों तक सीमित नहीं है और निकटवर्ती प्रसंग में नूह के परिवार के साथ पशु-पक्षी भी जहाज़ में हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भूमि’ और ‘पृथ्वी’ से क्रमशः הָאֲדָמָה और הָאָרֶץ का हल्का भेद सुरक्षित किया गया है। सूची की पुनरावृत्त संरचना और ‘केवल ... ही’ का बल बनाए रखा गया है।
