base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/003.yaml
  text: Also from the birds of the sky[a], seven and seven, male and female, to keep offspring alive on the face of all the earth.
translation:
  language: hi
  text: और आकाश के पक्षियों में से भी सात-सात[a], नर और मादा, ताकि सारी पृथ्वी पर उनकी संतति जीवित बनी रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सात जोड़े।’ इब्रानी में शाब्दिक रूप से ‘सात, सात’ है। यह वितरणात्मक अभिव्यक्ति प्रत्येक प्रकार के सात या सात जोड़ों के अर्थ में समझी जा सकती है; मुख्य पाठ मूल रूप को अधिक निकटता से बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: और ... भी
  rationale: यह पिछले पद में पशुओं के विषय में दिए गए निर्देश में पक्षियों को भी जोड़ता है; हिन्दी में ‘और ... भी’ इस निरंतरता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵעוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षियों में से
  rationale: עוֹף यहाँ उड़नेवाले जीवों, विशेषकर पक्षियों, को सूचित करता है; ‘आकाश के पक्षी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: שִׁבְעָה שִׁבְעָה
  choice: सात-सात
  rationale: इब्रानी में अंक की पुनरावृत्ति वितरणात्मक भाव रखती है। ‘सात-सात’ मूल रूप और उसकी संभावित अस्पष्टता को बनाए रखता है।
- source_word: זָכָר וּנְקֵבָה
  choice: नर और मादा
  rationale: यह पशु-पक्षियों के लिंग-युग्म के लिए सीधा, सामान्य और संदर्भानुकूल हिन्दी प्रयोग है।
- source_word: לְחַיּוֹת
  choice: जीवित बनी रहे
  rationale: हिफ़ील रूप जीवन को बचाए रखने या कायम रखने का भाव देता है; उद्देश्यवाचक वाक्य में यह हिन्दी अभिव्यक्ति स्वाभाविक है।
- source_word: זֶרַע
  choice: संतति
  rationale: शाब्दिक अर्थ ‘बीज’ है, पर यहाँ बाढ़ के बाद पक्षियों की आगे की पीढ़ी और वंश-निरंतरता अभिप्रेत है; ‘संतति’ इसे स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: यह इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है और समस्त पृथ्वी पर जीवन की निरंतरता का आशय बनाए रखता है।
