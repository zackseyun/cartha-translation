language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לְ/נֹ֔חַ בֹּֽא אַתָּ֥ה וְ/כָל בֵּיתְ/ךָ֖ אֶל הַ/תֵּבָ֑ה כִּֽי אֹתְ/ךָ֥ רָאִ֛יתִי צַדִּ֥יק לְ/פָנַ֖/י בַּ/דּ֥וֹר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/001.yaml
  text: Then Yahweh said to Noah, “Enter the ark, you and all your household, because I have seen that you are righteous before me in this generation.”
translation:
  language: hi
  text: तब यहोवा ने नूह से कहा, “तुम और तुम्हारे घराने के सभी लोग जहाज़ में प्रवेश करो, क्योंकि मैंने इस पीढ़ी में तुम्हें अपने सामने धर्मी देखा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में परमेश्वर के व्यक्तिगत नाम के रूप में प्रचलित रूप; इसे उपाधि ‘प्रभु’ से नहीं बदला गया।
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֹּא
  choice: प्रवेश करो
  rationale: आज्ञार्थक क्रिया का अर्थ ‘आओ/भीतर जाओ’ है; जहाज़ के संदर्भ में ‘प्रवेश करो’ स्पष्ट और गरिमापूर्ण है।
- source_word: בֵּיתְךָ
  choice: तुम्हारा सारा घराना
  rationale: यहाँ ‘घर’ भवन नहीं, नूह से संबंधित पूरे पारिवारिक/घरेलू समुदाय को दर्शाता है।
- source_word: הַתֵּבָה
  choice: जहाज़
  rationale: नूह की תֵּבָה के लिए हिन्दी में स्थापित और सामान्य पाठक को तुरंत समझ आने वाला संदर्भगत शब्द।
- source_word: כִּי
  choice: क्योंकि
  rationale: आज्ञा का कारण प्रस्तुत करने वाले कारणवाचक अर्थ को स्पष्ट रखता है।
- source_word: רָאִיתִי
  choice: मैंने देखा है
  rationale: हिब्रू पूर्ण क्रिया परमेश्वर के किए हुए आकलन और उसकी वर्तमान प्रासंगिकता को व्यक्त करती है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: צַדִּיק का मानक बाइबलीय हिन्दी प्रतिशब्द, जो नैतिक और संबंधपरक अर्थ को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: לְפָנַי
  choice: मेरे सामने
  rationale: हिब्रू मुहावरे को निकटता से रखते हुए परमेश्वर की दृष्टि और मूल्यांकन का भाव व्यक्त करता है।
- source_word: בַּדּוֹר הַזֶּה
  choice: इस पीढ़ी में
  rationale: नूह के समकालीन लोगों और काल-संदर्भ को सीधे व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी में पहचाने जाने वाले नामरूप ‘यहोवा’ द्वारा इसे उपाधि में बदले बिना सुरक्षित रखा गया है।
- issue: नूह की धार्मिकता का आशय
  choice: तुम मेरे सामने धर्मी हो
  alternative: केवल तुम ही मेरे सामने धर्मी हो; मैं तुम्हें धर्मी मानता हूँ
  rationale: मूल पाठ परमेश्वर के मूल्यांकन को कहता है, पर ‘केवल’ नहीं जोड़ता और न ही धार्मिकता के आधार की धर्मसैद्धांतिक व्याख्या करता है; इसलिए कथन का तनाव और सीमाएँ सुरक्षित रखी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘घराना’ सामाजिक इकाई को और ‘जहाज़’ नूह की तֵּבָה को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
