    text: या ‘जीवन की आत्मा’। इब्रानी शब्द רוּחַ का अर्थ ‘साँस’, ‘हवा’ या ‘आत्मा’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: वे आए
  rationale: בוא का वय्यिक्तोल रूप कथा में साधारण भूतकालीन गति व्यक्त करता है; ‘आए’ आगे दिए गए गंतव्य के साथ स्वाभाविक है।
- source_word: אֶל נֹחַ אֶל הַתֵּבָה
  choice: नूह के पास जहाज़ में
  rationale: दोनों אֶל वाक्यांशों को रखते हुए यह व्यक्त करता है कि प्राणी नूह के पास, जहाज़ के भीतर आए। ‘सन्दूक’ की अपेक्षा ‘जहाज़’ आधुनिक पाठक के लिए इस जलपोत के संदर्भ में अधिक सहज है।
- source_word: שְׁנַיִם שְׁנַיִם
  choice: दो-दो
  rationale: दोहराया हुआ अंक वितरणात्मक अर्थ, अर्थात जोड़ों में आना, व्यक्त करता है।
- source_word: מִכָּל הַבָּשָׂר
  choice: हर प्रकार के प्राणियों में से
  rationale: शाब्दिक ‘सब शरीर/सारा मांस’ आधुनिक हिन्दी में यहाँ अस्वाभाविक और भ्रामक हो सकता है; प्रसंग में בשר जीवधारी प्राणियों के व्यापक वर्ग को दर्शाता है।
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: जिनमें जीवन की साँस थी
  rationale: सम्बन्धवाचक रचना और भीतर विद्यमान जीवन-श्वास का भाव सुरक्षित रहता है; बहुवचन समूह के अनुरूप ‘जिनमें’ स्वाभाविक है।
- source_word: רוּחַ חַיִּים
  choice: जीवन की साँस
  rationale: जलप्रलय और जीवधारियों के इस संदर्भ में רוּחַ का ‘साँस’ अर्थ सर्वाधिक उपयुक्त है, जबकि पादटिप्पणी ‘आत्मा’ की वास्तविक सम्भावना सुरक्षित रखती है।
theological_decisions:
- issue: רוּחַ חַיִּים में רוּחַ का अर्थ
  choice: जीवन की साँस
  alternative: जीवन की आत्मा
  rationale: यहाँ वर्णन जहाज़ में आने वाले जीवधारियों की सजीवता पर केंद्रित है, इसलिए ‘साँस’ प्रसंगानुकूल है; फिर भी इब्रानी शब्द की अर्थ-व्याप्ति के कारण ‘आत्मा’ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। ‘दो-दो’ स्रोत की वितरणात्मक पुनरुक्ति को सहज ढंग से रखता है। ‘हर प्रकार के प्राणियों’ में ‘प्रकार’ स्पष्टता के लिए निहित अर्थ को सामने लाता है; अतिशाब्दिक ‘सारे मांस’ से बचा गया है।
