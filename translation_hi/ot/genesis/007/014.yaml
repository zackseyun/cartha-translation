  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद की इब्रानी सूची पिछले पद की क्रिया पर निर्भर है, इसलिए यहाँ स्रोत की तरह वाक्यांशात्मक निरंतरता बनाए रखी गई है। ‘हर’ और ‘अपनी-अपनी जाति के अनुसार’ की पुनरावृत्ति मूल पाठ की लय और वर्गीकरण पर दिए गए बल को सुरक्षित रखती है।
