id: GEN.7.14
reference: Genesis 7:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֵ֜מָּה וְ/כָל הַֽ/חַיָּ֣ה לְ/מִינָ֗/הּ וְ/כָל הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/כָל הָ/רֶ֛מֶשׂ הָ/רֹמֵ֥שׂ עַל הָ/אָ֖רֶץ לְ/מִינֵ֑/הוּ וְ/כָל הָ/ע֣וֹף לְ/מִינֵ֔/הוּ כֹּ֖ל צִפּ֥וֹר כָּל כָּנָֽף־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/014.yaml
  text: they[a], and every wild animal according to its kind, and every livestock animal according to its kind, and every creeping thing that creeps on the earth according to its kind[b], and every bird according to its kind—every winged bird.
translation:
  language: hi
  text: वे, और हर वन-पशु अपनी-अपनी जाति के अनुसार, हर पालतू पशु अपनी-अपनी जाति के अनुसार, भूमि पर रेंगनेवाला हर जीव अपनी-अपनी जाति के अनुसार, और हर पक्षी अपनी-अपनी जाति के अनुसार—हर पंखवाला पक्षी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵמָּה
  choice: वे
  rationale: यह बहुवचन सर्वनाम पिछले पद में नूह और उसके साथ जहाज़ में प्रवेश करनेवालों की ओर संकेत करता है; हिन्दी में ‘वे’ इसका स्वाभाविक रूप है।
- source_word: הַחַיָּה
  choice: वन-पशु
  rationale: उत्पत्ति की प्राणी-वर्गीकरण भाषा में यह בְּהֵמָה से अलग, सामान्यतः जंगली स्थल-पशुओं को दर्शाता है।
- source_word: הַבְּהֵמָה
  choice: पालतू पशु
  rationale: यहाँ शब्द वन-पशुओं के विपरीत मनुष्यों के अधीन रहनेवाले घरेलू या पशुधन वर्ग के पशुओं को दर्शाता है; ‘पालतू पशु’ आधुनिक हिन्दी में व्यापक और स्पष्ट है।
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: अपनी-अपनी जाति के अनुसार
  rationale: यह מִין की वर्गीकरण-संबंधी भावना को बनाए रखता है और अलग-अलग समूहों के भीतर अनेक जातियों का संकेत स्वाभाविक हिन्दी में देता है।
- source_word: הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: भूमि पर रेंगनेवाला हर जीव
  rationale: संज्ञा और उसी मूल के कृदंत की पुनरुक्ति का अर्थ स्पष्ट रखते हुए छोटे, भूमि पर चलने या रेंगनेवाले जीवों का वर्ग व्यक्त किया गया है।
- source_word: הָעוֹף
  choice: पक्षी
  rationale: यद्यपि शब्द व्यापक रूप से उड़नेवाले प्राणियों के लिए आ सकता है, अगली समानाधिकरणीय अभिव्यक्ति यहाँ पक्षियों का आशय स्पष्ट करती है।
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: हर पंखवाला पक्षी
  rationale: शाब्दिक रूप ‘हर पक्षी, हर पंख’ है। हिन्दी में ‘हर पंखवाला पक्षी’ उस समानाधिकरणीय, सर्वसमावेशी बल को बिना अस्वाभाविक पुनरुक्ति के व्यक्त करता है।
