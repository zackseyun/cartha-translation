  terminology: ‘वन-पशु’ and ‘पालतू पशु’ preserve the contextual distinction between חַיָּה and בְּהֵמָה. ‘जाति के अनुसार’ is an established and understandable rendering of the Genesis classification term מִין. No doctrinally loaded terminology has been introduced.
