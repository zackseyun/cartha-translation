  source_fidelity: 'The Hindi follows the Hebrew list accurately: the pronoun refers back to Noah’s party; wild animals, domestic animals, ground-creeping creatures, and birds are each classified ‘according to their kind.’ The final appositional expression, literally ‘every bird, every wing,’ is idiomatically and faithfully conveyed as ‘हर पंखवाला पक्षी.’'
