source:
  edition: WLC
  text: וַ/יִּגְוַ֞ע כָּל בָּשָׂ֣ר הָ/רֹמֵ֣שׂ עַל הָ/אָ֗רֶץ בָּ/ע֤וֹף וּ/בַ/בְּהֵמָה֙ וּ/בַ֣/חַיָּ֔ה וּ/בְ/כָל הַ/שֶּׁ֖רֶץ הַ/שֹּׁרֵ֣ץ עַל הָ/אָ֑רֶץ וְ/כֹ֖ל הָ/אָדָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/021.yaml
  text: 'And all flesh that moved on the earth died: birds[a], livestock, wild animals, every swarming thing that swarms on the earth, and all mankind.'
translation:
  language: hi
  text: और पृथ्वी पर विचरनेवाला हर प्राणी मर गया—पक्षी, पालतू पशु, जंगली जानवर, हर रेंगनेवाला जीव जो पृथ्वी पर रेंगता था, और समस्त मानवजाति।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: मर गया
  rationale: गוע का सामान्य अर्थ मरना या प्राण छोड़ना है; यहाँ सरल और स्वाभाविक हिन्दी में ‘मर गया’ उपयुक्त है।
- source_word: כָּל בָּשָׂר
  choice: हर प्राणी
  rationale: शाब्दिक अर्थ ‘सारा मांस’ है, पर इस प्रसंग में यह देहधारी जीवों का सामूहिक उल्लेख है; ‘हर प्राणी’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: הָרֹמֵשׂ
  choice: चलनेवाला
  rationale: רמש का अर्थ चलना, रेंगना या सरकना हो सकता है। आगे पक्षियों सहित व्यापक सूची होने के कारण यहाँ व्यापक ‘चलनेवाला’ चुना गया है।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: प्रलय-वृत्तांत के व्यापक संदर्भ में ‘पृथ्वी पर’ स्वाभाविक है और ‘भूमि पर’ की अपेक्षा दायरा बेहतर व्यक्त करता है।
- source_word: בָּעוֹף
  choice: पक्षी
  rationale: עוֹף उड़नेवाले जीवों को सूचित कर सकता है; इस वर्ग-सूची में ‘पक्षी’ सहज और पर्याप्त रूप से सटीक है।
- source_word: וּבַבְּהֵמָה
  choice: पालतू पशु
  rationale: यहाँ בְּהֵמָה अगले वर्ग, जंगली पशुओं, के विपरीत घरेलू पशुओं को दर्शाता है।
- source_word: וּבַחַיָּה
  choice: जंगली जानवर
  rationale: पालतू पशुओं के विपरीत חַיָּה यहाँ वन्य या गैर-पालतू स्थल-जीवों का वर्ग है।
- source_word: וּבְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: रेंगनेवाला हर छोटा जीव
  rationale: שֶׁרֶץ छोटे रेंगने, सरकने या झुंड में होनेवाले जीवों की श्रेणी है। हिन्दी में मूल की संज्ञा-क्रिया पुनरुक्ति को अक्षरशः रखना अस्वाभाविक होता; यह रूप अर्थ को स्पष्ट और प्रवाहपूर्ण रखता है।
- source_word: וְכֹל הָאָדָם
  choice: और समस्त मानवजाति
  rationale: הָאָדָם यहाँ किसी एक पुरुष नहीं, बल्कि मनुष्यों की पूरी जाति का सामूहिक बोध कराता है; ‘मानवजाति’ लिंग-समावेशी और अर्थानुकूल है।
theological_decisions:
- issue: הָאָדָם का सामूहिक अर्थ
  choice: समस्त मानवजाति
  alternative: हर मनुष्य
  rationale: निश्चित पदयुक्त एकवचन אָדָם यहाँ मानव जाति को सामूहिक रूप में दर्शाता है। ‘हर मनुष्य’ भी आशय देता है, पर ‘समस्त मानवजाति’ मूल के सामूहिक बल को अधिक स्पष्ट रखता है।
- issue: כָּל בָּשָׂר की अभिव्यक्ति
  choice: हर प्राणी
  alternative: सारा प्राणीमात्र / सारा मांस
  rationale: मूल इब्रानी मुहावरा व्यापक देहधारी जीवन को दर्शाता है। शाब्दिक ‘सारा मांस’ हिन्दी में खाद्य मांस का भ्रम उत्पन्न कर सकता है, इसलिए अर्थ-समान स्वाभाविक रूप चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वर्ग-सूची का क्रम मूल के अनुसार रखा गया है। ‘चलनेवाला’ व्यापक רמש और ‘रेंगनेवाला हर छोटा जीव’ विशिष्ट שֶׁרֶץ के बीच भेद बनाए रखता है।
