  yaml_path: translation/ot/genesis/007/017.yaml
  text: And the flood was on the earth forty days[a], and the waters increased and lifted up the ark, so that it rose above the earth.
translation:
  language: hi
  text: जलप्रलय चालीस दिन तक पृथ्वी पर रहा[a]। पानी बढ़ गया और उसने जहाज़ को ऊपर उठा दिया, और वह पृथ्वी से ऊपर उठ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जलप्रलय पृथ्वी पर चालीस दिन था।” समय-सूचक पद के साथ इब्रानी अभिव्यक्ति अवधि का भाव भी दे सकती है।
    reason: इब्रानी וַיְהִי के अधिक औपचारिक रूप और हिन्दी में स्वाभाविक अवधिसूचक अनुवाद के बीच अंतर बताने के लिए।
lexical_decisions:
- source_word: וַיְהִי
  choice: रहा
  rationale: समय-सूचक पद ‘चालीस दिन’ के साथ यह क्रिया जलप्रलय की अवधि बताती है। ‘रहा’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी के अस्तित्व/अवधि वाले भाव को बनाए रखता है।
- source_word: הַמַּבּוּל
  choice: जलप्रलय
  rationale: नूह के प्रसंग में विशेष महाबाढ़ के लिए यह स्पष्ट, प्रचलित और गरिमापूर्ण हिन्दी शब्द है।
- source_word: אַרְבָּעִים יוֹם
  choice: चालीस दिन तक
  rationale: इब्रानी में पूर्वसर्ग नहीं है, पर हिन्दी में अवधि स्पष्ट और स्वाभाविक करने के लिए ‘तक’ जोड़ा गया है।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: इस व्यापक जलप्रलय के प्रसंग में אֶרֶץ का ‘पृथ्वी’ अर्थ उपयुक्त है; ‘पर’ עַל का सीधा और स्वाभाविक अनुवाद है।
- source_word: וַיִּרְבּוּ הַמַּיִם
  choice: पानी बढ़ता गया
  rationale: रूप बहुवचन है, पर हिन्दी में सामूहिक द्रव्य के लिए एकवचन ‘पानी’ अधिक स्वाभाविक है। ‘बढ़ता गया’ क्रमिक वृद्धि का कथात्मक भाव व्यक्त करता है।
- source_word: וַיִּשְׂאוּ אֶת־הַתֵּבָה
  choice: उसने जहाज़ को ऊपर उठा दिया
  rationale: सामूहिक ‘पानी’ के अनुरूप ‘उसने’ रखा गया है। נשא यहाँ पानी द्वारा जहाज़ को धरती से उठाने की भौतिक क्रिया बताता है।
- source_word: הַתֵּבָה
  choice: जहाज़
  rationale: नूह के बड़े जलयान के लिए आधुनिक हिन्दी में यह सहज और तुरंत समझ आने वाला शब्द है; ‘सन्दूक’ आकार पर बल देता, पर इस प्रसंग में जलयान का आशय कम स्पष्ट करता।
- source_word: וַתָּרָם
  choice: वह ... ऊपर उठ गया
  rationale: स्त्रीलिंग एकवचन इब्रानी क्रिया का कर्ता תֵּבָה है। हिन्दी में पुल्लिंग ‘जहाज़’ के अनुसार व्याकरणिक रूप रखा गया और परिणामस्वरूप ऊपर उठने का भाव सुरक्षित है।
- source_word: מֵעַל הָאָרֶץ
  choice: पृथ्वी की सतह से ऊपर
  rationale: מֵעַל में सतह से अलग होकर ऊपर होने का भाव है। ‘सतह’ स्पष्ट करता है कि जहाज़ पृथ्वी से ऊपर उठ गया, न कि अस्पष्ट रूप से पृथ्वी के ऊपर कहीं स्थित हुआ।
