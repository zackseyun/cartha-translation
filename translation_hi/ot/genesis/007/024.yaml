  yaml_path: translation/ot/genesis/007/024.yaml
  text: And the waters prevailed over the earth for 150 days[a].
translation:
  language: hi
  text: और जल पृथ्वी[a] पर एक सौ पचास दिन तक प्रबल बना रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘पृथ्वी’ के स्थान पर ‘भूमि’ भी हो सकता है; इब्रानी אֶרֶץ का अर्थ प्रसंग के अनुसार इनमें से कोई भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: प्रबल रहा
  rationale: क़ाल वय्यिक्तोल रूप में גבר का अर्थ बलवान होना या प्रभावी रूप से छाया रहना है। बाढ़ के प्रसंग में ‘प्रबल रहा’ जल के निरंतर प्रभुत्व को व्यक्त करता है और केवल ‘बढ़ता रहा’ की अपेक्षा मूल अर्थ के अधिक निकट है।
- source_word: הַמַּיִם
  choice: जल
  rationale: इब्रानी शब्द रूप की दृष्टि से बहुवचन है, पर आधुनिक मानक हिन्दी में इस प्रसंग में ‘जल’ स्वाभाविक सामूहिक संज्ञा है। ‘जलराशियाँ’ अनावश्यक रूप से कृत्रिम लगेगा।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: עַל का स्वाभाविक अर्थ ‘पर’ है। אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘भूमि’ हो सकता है; बाढ़-वृत्तांत की व्यापक भाषा के कारण मुख्य पाठ में ‘पृथ्वी’ चुना गया है, जबकि दूसरी सम्भावना पाद-टिप्पणी में सुरक्षित है।
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: एक सौ पचास दिन तक
  rationale: इब्रानी संख्या-विन्यास का स्वाभाविक हिन्दी रूप ‘एक सौ पचास दिन’ है। अवधि स्पष्ट करने के लिए ‘तक’ प्रयुक्त हुआ है।
theological_decisions:
- issue: बाढ़-वृत्तांत में אֶרֶץ का विस्तार
  choice: पृथ्वी
  alternative: भूमि
  rationale: निकटवर्ती वर्णन बाढ़ को व्यापक, सार्वभौमिक शब्दों में प्रस्तुत करता है, इसलिए मुख्य पाठ में ‘पृथ्वी’ अधिक संगत है। फिर भी אֶרֶץ की वास्तविक शाब्दिक सम्भावना ‘भूमि’ को पाद-टिप्पणी में रखा गया है, ताकि पाठ की भाषिक सम्भावना को दबाया न जाए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘जल’ सामूहिक संज्ञा के रूप में स्वाभाविक है, और ‘प्रबल रहा’ मूल क्रिया के बल तथा बाढ़ के जल के प्रभुत्व—दोनों को बनाए रखता है।
