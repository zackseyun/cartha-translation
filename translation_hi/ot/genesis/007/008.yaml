base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/008.yaml
  text: From the clean animals and from the animals that are not clean[a], and from the birds and everything that creeps on the ground—
translation:
  language: hi
  text: शुद्ध पशुओं में से, और उन पशुओं में से जो शुद्ध नहीं हैं[a], और पक्षियों में से, और भूमि पर रेंगने वाले हर जीव में से—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जो अशुद्ध हैं।’ इब्रानी में अधिक शाब्दिक रूप से ‘जो शुद्ध नहीं हैं’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: में से
  rationale: यह संबंधबोधक सूची की प्रत्येक श्रेणी में से लिए जाने का भाव व्यक्त करता है; इसकी पुनरावृत्ति इब्रानी वाक्य की सूचीबद्ध लय को बनाए रखती है।
- source_word: בְּהֵמָה
  choice: पशु
  rationale: यहाँ यह पक्षियों और रेंगनेवाले जीवों से अलग एक व्यापक पशु-श्रेणी को दर्शाता है, केवल पालतू मवेशियों को नहीं।
- source_word: טְּהוֹרָה
  choice: शुद्ध
  rationale: यह पशुओं की धार्मिक-विधिक श्रेणी का मानक और स्वाभाविक हिन्दी पद है; यहाँ सामान्य स्वच्छता अभिप्रेत नहीं है।
- source_word: אֲשֶׁר אֵינֶנָּה טְהֹרָה
  choice: जो शुद्ध नहीं थे
  rationale: इब्रानी एक स्वतंत्र विलोम शब्द के बजाय शाब्दिक निषेध, अर्थात ‘जो शुद्ध नहीं’, का प्रयोग करता है; हिन्दी में यही संरचना उस भेद को सुरक्षित रखती है।
- source_word: עוֹף
  choice: पक्षी
  rationale: शब्द उड़नेवाले प्राणियों को व्यापक रूप से सूचित कर सकता है, पर इस प्रसंग में ‘पक्षी’ सबसे स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: כֹּל אֲשֶׁר רֹמֵשׂ
  choice: रेंगनेवाला हर जीव
  rationale: यह भूमि की सतह पर रेंगकर या सरककर चलनेवाले छोटे प्राणियों की श्रेणी को व्यक्त करता है; ‘हर जीव’ हिन्दी में संज्ञार्थ को स्पष्ट करता है।
- source_word: עַל הָאֲדָמָה
  choice: भूमि पर
  rationale: यहाँ אֲדָמָה उस धरातल को दर्शाता है जिस पर ये जीव चलते हैं; ‘भूमि पर’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
theological_decisions:
- issue: शुद्धता की पशु-श्रेणियाँ
  choice: ‘शुद्ध’ और ‘शुद्ध नहीं’
  alternative: ‘शुद्ध’ और ‘अशुद्ध’
  rationale: पाठ में प्राचीन धार्मिक-विधिक वर्गीकरण उपस्थित है, पर इब्रानी दूसरी श्रेणी को सीधे ‘अशुद्ध’ कहने के बजाय ‘जो शुद्ध नहीं’ कहता है। अनुवाद उस अर्थ और अभिव्यक्ति दोनों को सुरक्षित रखता है, बिना बाद की व्यवस्था का अतिरिक्त विवरण जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट सूची-विन्यास रखा गया है। पद के अगले वाक्यांश से जुड़ाव दिखाने के लिए अंत में दीर्घ विराम-चिह्न रखा गया है।
