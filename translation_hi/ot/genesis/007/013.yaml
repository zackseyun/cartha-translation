  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
translation:
  language: hi
  text: ठीक उसी दिन नूह, उसके बेटे शेम, हाम और येपेत, नूह की पत्नी, और उसके बेटों की तीनों पत्नियाँ उनके साथ जहाज़ में गए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘आए’; यहाँ प्रसंग जहाज़ के भीतर जाने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: ठीक उसी दिन
  rationale: यह इब्रानी मुहावरा दिन की निश्चितता पर बल देता है। ‘ठीक उसी दिन’ इस ज़ोर को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בָּא
  choice: गए
  rationale: क्रिया का मूल अर्थ ‘आए’ है, पर אֶל הַתֵּבָה के साथ प्रसंग जहाज़ के भीतर जाने का है। हिन्दी में गंतव्य के साथ ‘जहाज़ में गए’ स्वाभाविक है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: נֹחַ
  choice: नूह
  rationale: इस नाम का प्रचलित हिन्दी रूप।
- source_word: וְשֵׁם וְחָם וָיֶפֶת
  choice: और उसके बेटे शेम, हाम और येपेत
  rationale: तीनों नामों को इब्रानी क्रम में रखा गया है और अगले पदबंध ‘नूह के बेटे’ को सहज हिन्दी में उनके परिचय के रूप में जोड़ा गया है।
- source_word: בְּנֵי נֹחַ
  choice: उसके बेटे
  rationale: यह पदबंध शेम, हाम और येपेत की पहचान नूह के बेटों के रूप में करता है; निकट पूर्वपद के कारण ‘उसके बेटे’ स्वाभाविक है।
- source_word: וְאֵשֶׁת נֹחַ
  choice: नूह की पत्नी
  rationale: सम्बन्धवाचक रचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וּשְׁלֹשֶׁת נְשֵׁי בָנָיו
  choice: और उसके बेटों की तीनों पत्नियाँ
  rationale: संख्या और पारिवारिक सम्बन्ध दोनों स्पष्ट रखे गए हैं। ‘तीनों’ हिन्दी में निश्चित तीन व्यक्तियों के लिए स्वाभाविक है।
- source_word: אִתָּם
  choice: उनके साथ
  rationale: मूल पाठ का सर्वनाम पुल्लिंग बहुवचन है और सबसे स्वाभाविक रूप से पहले बताए गए नूह और उसके बेटों की ओर संकेत करता है। बहुवचन को एकवचन में नहीं बदला गया।
- source_word: אֶל הַתֵּבָה
  choice: जहाज़ में
  rationale: אֶל यहाँ गंतव्य और भीतर प्रवेश का भाव देता है। नूह के वृत्तांत में תֵּבָה के लिए ‘जहाज़’ प्रचलित और सामान्य पाठकों के लिए स्पष्ट है।
theological_decisions:
- issue: אִתָּם के बहुवचन सर्वनाम का सम्बन्ध
  choice: ‘उनके साथ’ रखकर बहुवचन और उसका स्वाभाविक संकेत सुरक्षित रखा गया
  alternative: ‘उसके साथ’ या केवल ‘भी’
  rationale: मूल रूप बहुवचन है। उसे एकवचन करना या हटाना पाठ की वास्तविक व्याकरणिक सूचना को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। नामों के प्रचलित हिन्दी रूप अपनाए गए हैं। मूल के बहुवचन ‘उनके साथ’ को कुछ पुनरुक्ति के बावजूद सुरक्षित रखा गया है, ताकि उसके सम्भावित सम्बन्ध को अनावश्यक रूप से निश्चित या लुप्त न किया जाए।
