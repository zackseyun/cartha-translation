  text: וַֽ/יְהִ֖י לְ/שִׁבְעַ֣ת הַ/יָּמִ֑ים וּ/מֵ֣י הַ/מַּבּ֔וּל הָי֖וּ עַל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/010.yaml
  text: And after seven days[b][a], the waters of the flood came upon the earth.
translation:
  language: hi
  text: सात दिन बीतने पर जलप्रलय का पानी धरती[a] पर आ गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भूमि” अथवा “देश।” इब्रानी शब्द אֶרֶץ का अर्थ संदर्भ के अनुसार “धरती,” “भूमि” या “देश” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “और सात दिनों के पूरा होने पर ऐसा हुआ कि जलप्रलय का पानी धरती पर था।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְשִׁבְעַת הַיָּמִים
  choice: सात दिन बीतने पर
  rationale: यह इब्रानी कथात्मक अभिव्यक्ति सात दिनों की अवधि पूरी होने के बाद अगली घटना घटने का संकेत देती है। यह हिंदी में स्वाभाविक है और कालगत अर्थ को स्पष्ट रखती है।
- source_word: וּמֵי הַמַּבּוּל
  choice: जलप्रलय का पानी
  rationale: מַבּוּל नूह के समय के विशिष्ट प्रलय का शब्द है। आधुनिक हिंदी में ‘जलप्रलय का पानी’ स्पष्ट और स्वाभाविक है तथा संबंध-वाचक रचना की निश्चितता बनाए रखता है।
- source_word: הָיוּ עַל
  choice: पर आ गया
  rationale: शाब्दिक अर्थ ‘पर था’ है, पर कथात्मक संदर्भ में पानी के आने या छा जाने की घटना व्यक्त होती है। ‘पर आ गया’ बिना अनावश्यक विस्तार के उस घटनात्मक बल को दर्शाता है।
- source_word: הָאָרֶץ
  choice: धरती
  rationale: אֶרֶץ का अर्थ संदर्भ के अनुसार ‘धरती’ या ‘देश/भूमि’ हो सकता है। जलप्रलय-वृत्तांत के व्यापक संदर्भ में ‘धरती’ मुख्य पाठ के लिए उपयुक्त है, जबकि वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: जलप्रलय-वृत्तांत में אֶרֶץ का विस्तार
  choice: धरती
  alternative: भूमि या देश
  rationale: इब्रानी संज्ञा स्थानीय भूमि अथवा समूची धरती—दोनों अर्थ दे सकती है। इस प्रसंग में व्यापक अर्थ मुख्य पाठ में रखा गया है, लेकिन पद अकेले व्यापक भौगोलिक विवाद को निर्णायक रूप से हल नहीं करता; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। ‘जलप्रलय’ बाइबिलीय संदर्भ को स्पष्ट करता है, जबकि ‘पानी’ सामान्य पाठक के लिए सहज है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
