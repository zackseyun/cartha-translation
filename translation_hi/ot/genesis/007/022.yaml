source:
  edition: WLC
  text: כֹּ֡ל אֲשֶׁר֩ נִשְׁמַת ר֨וּחַ חַיִּ֜ים בְּ/אַפָּ֗י/ו מִ/כֹּ֛ל אֲשֶׁ֥ר בֶּ/חָֽרָבָ֖ה מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/022.yaml
  text: Everything on the dry land in whose nostrils was the breath of the spirit of life died[a][b].
translation:
  language: hi
  text: सूखी भूमि पर जितने भी प्राणी थे, जिनके नथनों में जीवन का श्वास[a] था, वे सब मर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “जीवन की रूह का श्वास”; इब्रानी शब्द ‘रूह’ का अर्थ “आत्मा” या “श्वास” भी हो सकता है।
    reason: मूल इब्रानी पदबंध की अधिक शब्दशः रचना और רוּחַ की अर्थगत व्यापकता को सुरक्षित रखना।
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: जितने भी प्राणी ... वे सब
  rationale: यह रचना सभी पात्र जीवों को समग्र रूप से शामिल करती है। संदर्भ में मनुष्य और पशु दोनों हैं, इसलिए हिन्दी में ‘प्राणी’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: נִשְׁמַת רוּחַ חַיִּים
  choice: जीवन का श्वास
  rationale: संयुक्त इब्रानी अभिव्यक्ति जीवन देने वाली साँस को सूचित करती है। ‘जीवन का श्वास’ सहज हिन्दी है; मूल की अधिक शब्दशः संरचना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: בְּאַפָּיו
  choice: जिनके नथनों में
  rationale: इब्रानी में प्रत्यय एकवचन पुल्लिंग है, पर उसका प्रयोग समूह के प्रत्येक सदस्य के लिए वितरणात्मक रूप से हुआ है। हिन्दी में बहुवचन-सापेक्ष रचना स्वाभाविक है।
- source_word: מִכֹּל אֲשֶׁר בֶּחָרָבָה
  choice: सूखी भूमि पर जितने भी प्राणी थे
  rationale: यह पद जल में रहने वाले जीवों के विपरीत सूखी भूमि पर रहने वाले प्राणियों तक कथन का दायरा सीमित करता है।
- source_word: מֵתוּ
  choice: मर गए
  rationale: क्रिया मृत्यु की घटित घटना को सीधे व्यक्त करती है; ‘मर गए’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: נִשְׁמַת רוּחַ חַיִּים में רוּחַ का अर्थ और संयुक्त पदबंध का स्वरूप
  choice: मुख्य पाठ में ‘जीवन का श्वास’
  alternative: ‘जीवन की आत्मा का श्वास’ अथवा ‘जीवन-श्वास’
  rationale: यहाँ רוּחַ का अर्थ ‘श्वास’, ‘वायु’ या ‘आत्मा’ के अर्थ-क्षेत्र से जुड़ सकता है। शब्दशः जटिल रचना हिन्दी में अनचाहा दार्शनिक अर्थ उत्पन्न कर सकती है, इसलिए मुख्य पाठ अर्थ को स्वाभाविक रूप से देता है और मूल की शब्दरचना पादटिप्पणी में बताता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नथनों’ ने शरीरगत चित्र को सुरक्षित रखा है, जबकि ‘प्राणी’ मनुष्यों और पशुओं दोनों को समेटता है।
