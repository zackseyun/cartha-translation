  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तब’ कथानक की प्रगति दिखाता है; ‘बुलाकर कहा’ हिन्दी में अनावश्यक पुनरुक्ति से बचते हुए दोनों इब्रानी क्रियाओं को व्यक्त करता है।
