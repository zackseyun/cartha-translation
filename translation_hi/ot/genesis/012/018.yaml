  text: וַ/יִּקְרָ֤א פַרְעֹה֙ לְ/אַבְרָ֔ם וַ/יֹּ֕אמֶר מַה זֹּ֖את עָשִׂ֣יתָ לִּ֑/י לָ֚/מָּה לֹא הִגַּ֣דְתָּ לִּ֔/י כִּ֥י אִשְׁתְּ/ךָ֖ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/018.yaml
  text: Then Pharaoh called Abram and said, “What is this you have done to me? Why did you not tell me that she is your wife?”
translation:
  language: hi
  text: तब फ़िरौन ने अब्राम को बुलाकर कहा, “तुमने मेरे साथ यह क्या किया? तुमने मुझे क्यों नहीं बताया कि वह तुम्हारी पत्नी है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाकर
  rationale: קרא के साथ לְ किसी व्यक्ति को बुलाने का अर्थ देता है। संयुक्त क्रिया ‘बुलाकर कहा’ हिन्दी में स्वाभाविक है और इब्रानी कथानक के क्रम को बनाए रखती है।
- source_word: פַרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के राजकीय पदनाम का हिन्दी में प्रचलित और स्पष्ट रूप।
- source_word: לְאַבְרָם
  choice: अब्राम
  rationale: व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
- source_word: מַה זֹּאת עָשִׂיתָ לִּי
  choice: तुमने मेरे साथ यह क्या किया?
  rationale: ‘यह क्या’ प्रदर्शनवाचक बल को बनाए रखता है, जबकि לִי को प्रसंगानुकूल ‘मेरे साथ’ कहना आधुनिक हिन्दी में स्वाभाविक रूप से फ़िरौन की व्यक्तिगत शिकायत व्यक्त करता है।
- source_word: לָמָּה לֹא הִגַּדְתָּ לִּי
  choice: तुमने मुझे क्यों नहीं बताया
  rationale: हिफ़इल रूप הִגִּיד का अर्थ बताना या प्रकट करना है; यह चयन सरल और स्वाभाविक आधुनिक हिन्दी है।
- source_word: כִּי אִשְׁתְּךָ הִוא
  choice: कि वह तुम्हारी पत्नी है
  rationale: כִּי यहाँ कथित सूचना की विषयवस्तु प्रस्तुत करता है, और इब्रानी संज्ञावाचक वाक्य का वर्तमान अर्थ हिन्दी में सीधे सुरक्षित है।
theological_decisions: []
