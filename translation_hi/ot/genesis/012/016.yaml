  text: And he treated Abram well because of her[a], and he came to have sheep and cattle and male donkeys and male servants and female servants and female donkeys and camels.
translation:
  language: hi
  text: उसने सारै के कारण[a] अब्राम के साथ अच्छा व्यवहार किया, और अब्राम के पास भेड़-बकरियाँ, गाय-बैल, गधे, दास, दासियाँ, गधियाँ और ऊँट हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सारै की खातिर।’ इब्रानी अभिव्यक्ति का अनुवाद दोनों प्रकार से किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיב
  choice: अच्छा व्यवहार किया
  rationale: हिफ़िल रूप यहाँ किसी के साथ भलाई या अनुकूल व्यवहार करने का अर्थ देता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּעֲבוּרָהּ
  choice: सारै के कारण
  rationale: इब्रानी अभिव्यक्ति कारण अथवा अवसर बताती है। स्त्रीलिंग सर्वनाम का संदर्भ स्पष्ट करने के लिए नाम रखा गया है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַיְהִי לוֹ
  choice: अब्राम के पास ... हो गए
  rationale: यह मुहावरा परिणामी प्राप्ति या स्वामित्व सूचित करता है; केवल ‘थे’ की अपेक्षा ‘हो गए’ इस कथात्मक प्रगति को बेहतर व्यक्त करता है।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: यह सामूहिक संज्ञा छोटे पालतू पशुओं, विशेषतः भेड़ों और बकरियों, को समेट सकती है; हिन्दी में ‘भेड़-बकरियाँ’ इसकी व्यापकता स्वाभाविक रूप से रखता है।
- source_word: בָקָר
  choice: गाय-बैल
  rationale: यह गोवंश के लिए सामूहिक शब्द है; ‘गाय-बैल’ सामान्य हिन्दी में नर और मादा दोनों को समेटता है।
- source_word: חֲמֹרִים
  choice: गधे
  rationale: पुल्लिंग बहुवचन को ‘गधे’ से व्यक्त किया गया है, जिससे आगे आने वाली मादा गधियों से भेद बना रहता है।
- source_word: עֲבָדִים
  choice: दास
  rationale: संपत्ति-सूची के संदर्भ में यह शब्द आश्रित/दास स्थिति को दर्शाता है; ‘दास’ सामाजिक वास्तविकता को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रूप से रखता है।
- source_word: שְׁפָחֹת
  choice: दासियाँ
  rationale: स्त्रीलिंग बहुवचन को ‘दासियाँ’ से व्यक्त किया गया है, जिससे लिंग और दास स्थिति दोनों सुरक्षित रहते हैं।
- source_word: אֲתֹנֹת
  choice: गधियाँ
  rationale: यह विशेषतः मादा गधियों का बहुवचन है; ‘गधियाँ’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: גְמַלִּים
  choice: ऊँट
  rationale: बहुवचन-संदर्भ में हिन्दी का सामान्य रूप ‘ऊँट’ स्वाभाविक समतुल्य है।
