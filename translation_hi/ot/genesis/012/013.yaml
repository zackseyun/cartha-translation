  verdict: revise
  source_fidelity: The draft correctly understands Sarai's first-person statement and preserves the two related causal expressions. However, “मेरा जीवन बचा रहे” is less idiomatic for the Hebrew idiom meaning that Abram's life be spared, and the quoted demonstrative “इसकी” is needlessly awkward in this direct address.
  naturalness: “कृपया कहना, ‘मैं इसकी बहन हूँ’” is understandable but unnatural in modern Hindi, since “इसकी” has an unclear deictic reference in a conversation between Abram and Sarai. Indirect speech is both natural and fully faithful here. “मेरे लिए भला हो” and “मेरी जान बची रहे” are idiomatic while retaining the breadth of the Hebrew.
  terminology: “बहन,” “भला,” and “जान” are appropriate, nonsectarian modern-Hindi terms. “जान” conveys נֶפֶשׁ in its contextual sense of life/self without importing the later theological sense of “आत्मा.”
  issues:
  - severity: medium
    issue: The direct quotation uses “इसकी” for Abram.
    rationale: Although it can theoretically refer to Abram, it is unnatural and weakly anchored in Hindi dialogue. “कहना कि मैं तुम्हारी बहन हूँ” gives Sarai's required first-person assertion naturally.
  - severity: low
    issue: “मेरा जीवन बचा रहे” is not the most idiomatic Hindi expression for life being spared.
