id: GEN.12.6
reference: Genesis 12:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר אַבְרָם֙ בָּ/אָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְ/הַֽ/כְּנַעֲנִ֖י אָ֥ז בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
translation:
  language: hi
  text: अब्राम उस देश में से होकर शकेम के स्थान तक, मोरे के बड़े पेड़[a] तक गया। उस समय कनानी लोग[b] उस देश में थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मोरे के बांज वृक्ष” अथवा “मोरे के तारपीन वृक्ष।” हिब्रू शब्द किसी बड़े पेड़ को सूचित करता है, पर उसकी सटीक प्रजाति अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “कनानी”; हिब्रू में एकवचन जातिवाचक शब्द यहाँ पूरे कनानी समुदाय के लिए प्रयुक्त हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: में से होकर ... गया
  rationale: क्रिया עבר की यात्रा और देश को पार करते हुए आगे बढ़ने की भावना को स्वाभाविक हिन्दी में व्यक्त करता है, बिना मार्ग या यात्रा के ढंग को अनावश्यक रूप से निश्चित किए।
- source_word: בָּאָרֶץ
  choice: उस देश में से / उस देश में
  rationale: सप्रत्यय संज्ञा प्रसंग में कनान की ओर संकेत करती है। हिन्दी में ‘उस देश’ पूर्वप्रसिद्ध भूभाग को स्वाभाविक रूप से व्यक्त करता है; पद की पुनरावृत्ति भी रखी गई है।
- source_word: עַד
  choice: तक
  rationale: दोनों बार यात्रा की सीमा या गंतव्य को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מְקוֹם שְׁכֶם
  choice: शकेम के स्थान
  rationale: מקום को ‘स्थान’ के रूप में बनाए रखते हुए यह व्यक्त करता है कि पाठ शकेम से संबद्ध स्थल का नाम लेता है; इसे अनिवार्यतः बाद के पूर्ण विकसित नगर के रूप में नहीं मानता।
- source_word: אֵלוֹן מוֹרֶה
  choice: मोरे के बड़े पेड़
  rationale: אֵלוֹן किसी बड़े, प्रमुख वृक्ष को सूचित कर सकता है, पर उसकी सटीक प्रजाति अनिश्चित है। ‘बड़ा पेड़’ मुख्य पाठ में इस अनिश्चितता को सुरक्षित रखता है; पारंपरिक प्रजातिगत विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: מוֹרֶה
  choice: मोरे
  rationale: इसे यहाँ वृक्ष से जुड़ा स्थाननाम मानकर लिप्यंतरित किया गया है; ‘शिक्षक’ या ‘द्रष्टा’ जैसे अनिश्चित अर्थ मुख्य पाठ में नहीं जोड़े गए।
- source_word: וְהַכְּנַעֲנִי
  choice: कनानी लोग
  rationale: हिब्रू में सप्रत्यय एकवचन जातिवाचक शब्द सामूहिक अर्थ में प्रयुक्त है। आधुनिक हिन्दी में ‘कनानी लोग’ वही सामूहिक आशय स्पष्ट और स्वाभाविक रूप से देता है; स्रोत का एकवचन रूप पादटिप्पणी में दर्ज है।
- source_word: אָז
  choice: उस समय
  rationale: कथा में उस काल की ऐतिहासिक परिस्थिति को स्पष्ट करने वाला स्वाभाविक हिन्दी कालवाचक पद है।
theological_decisions:
- issue: וְהַכְּנַעֲנִי में जातिनाम का वचन
  choice: ‘कनानी लोग ... थे’—सामूहिक बहुवचन हिन्दी
  alternative: ‘कनानी ... था’—हिब्रू के व्याकरणिक एकवचन का निकट रूप
  rationale: हिब्रू का एकवचन जातिवाचक पद पूरे समुदाय के लिए सामूहिक रूप से काम कर सकता है। हिन्दी में बहुवचन अर्थ को अधिक स्पष्ट और सहज बनाता है, जबकि पादटिप्पणी मूल रूप की जानकारी सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अब्राम’, ‘शकेम’ और ‘मोरे’ प्रचलित हिन्दी बाइबलीय लिप्यंतरण हैं। वृक्ष की प्रजाति को मुख्य पाठ में निश्चित न करके मूल की वास्तविक शब्दार्थगत अनिश्चितता सुरक्षित रखी गई है।
