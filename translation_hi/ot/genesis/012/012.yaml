  yaml_path: translation/ot/genesis/012/012.yaml
  text: And it will be that when the Egyptians see you[a], they will say, ‘This is his wife,’ and they will kill me[b], but they will let you live.
translation:
  language: hi
  text: और जब मिस्री तुम्हें देखेंगे, तो कहेंगे, ‘यह उसकी पत्नी है।’ तब वे मुझे मार डालेंगे, लेकिन तुम्हें जीवित छोड़ देंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और जब
  rationale: यह इब्रानी भविष्यसूचक प्रसंग-परिचय है। आधुनिक स्वाभाविक हिन्दी में ‘और जब’ आगामी परिस्थिति को स्पष्ट करता है, बिना बोझिल शब्दशः संरचना के।
- source_word: יִרְאוּ אֹתָךְ
  choice: तुम्हें देखेंगे
  rationale: ראה का सामान्य अर्थ ‘देखना’ है; यहाँ सरल और सीधा अनुवाद उपयुक्त है।
- source_word: הַמִּצְרִים
  choice: मिस्री
  rationale: यह मिस्र के लोगों के लिए मानक जातिवाचक पद है।
- source_word: וְאָמְרוּ
  choice: तो कहेंगे
  rationale: ‘तो’ जब-वाक्य के परिणाम को स्वाभाविक हिन्दी में जोड़ता है; क्रिया का भविष्यकाल बना रहता है।
- source_word: אִשְׁתּוֹ זֹאת
  choice: यह उसकी पत्नी है
  rationale: इब्रानी नामवाचक वाक्य में demonstrative זאת का बल सुरक्षित रखते हुए हिन्दी की स्वाभाविक पहचान-सूचक रचना अपनाई गई है।
- source_word: וְהָרְגוּ אֹתִי
  choice: तब वे मुझे मार डालेंगे
  rationale: הרג का सीधा अर्थ ‘मारना/मार डालना’ है। ‘मार डालेंगे’ मृत्यु के आशय को स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
- source_word: וְאֹתָךְ יְחַיּוּ
  choice: लेकिन तुम्हें जीवित छोड़ देंगे
  rationale: חיה के हिफ़ील रूप का अर्थ ‘जीवित रखना/जीने देना’ है। ‘लेकिन’ पूर्ववर्ती हत्या और उसके जीवित छोड़े जाने के निहित विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
