source:
  edition: WLC
  text: וַ/אֲבָֽרֲכָה֙ מְבָ֣רְכֶ֔י/ךָ וּ/מְקַלֶּלְ/ךָ֖ אָאֹ֑ר וְ/נִבְרְכ֣וּ בְ/ךָ֔ כֹּ֖ל מִשְׁפְּחֹ֥ת הָ/אֲדָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/003.yaml
  text: And I will bless those who bless you[a], and the one who curses you I will curse[c][b]; and in you all the families of the earth will be blessed.
translation:
  language: hi
  text: जो तुझे आशीष देते हैं, उन्हें मैं आशीष दूँगा; और जो तेरा अनादर करता है, उसे मैं शाप दूँगा। पृथ्वी के सभी कुल तुझ में आशीष पाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी के सभी कुल तेरे नाम से अपने लिए आशीष की कामना करेंगे”; अथवा, “तेरे द्वारा पृथ्वी के सभी कुल आशीष पाएँगे।” इब्रानी रूप कर्मवाच्य और आत्मवाचक/मध्यवाचक—दोनों अर्थों की सम्भावना रखता है, और “तुझ में” का अर्थ “तेरे द्वारा” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲבָרֲכָה
  choice: मैं आशीष दूँगा
  rationale: बरख का प्रथम पुरुष एकवचन रूप परमेश्वर की प्रतिज्ञा व्यक्त करता है; आधुनिक हिन्दी में भविष्यकाल स्वाभाविक है।
- source_word: מְבָרְכֶיךָ
  choice: जो तुझे आशीष देते हैं
  rationale: बहुवचन कृदन्त को व्यक्तियों के वर्ग के रूप में प्रस्तुत किया गया है और उसका बहुवचन सुरक्षित रखा गया है।
- source_word: וּמְקַלֶּלְךָ
  choice: जो तेरा अनादर करता है
  rationale: קלל यहाँ किसी को हल्का समझने, तुच्छ ठहराने या उसका अनादर करने का भाव दे सकता है और अगले प्रबल क्रियापद ארר से भिन्न है; एकवचन भी सुरक्षित है।
- source_word: אָאֹר
  choice: उसे मैं शाप दूँगा
  rationale: ארר शाप देने के लिए अधिक प्रबल क्रिया है; इस चयन से मानवीय अनादर और परमेश्वर के शाप के बीच का शब्दगत अंतर बना रहता है।
- source_word: וְנִבְרְכוּ
  choice: आशीष पाएँगे
  rationale: निफ़अल बहुवचन को मुख्य पाठ में कर्मवाच्य अर्थ दिया गया है; सहज हिन्दी में ‘आशीष पाएँगे’ स्वाभाविक है।
- source_word: בְּךָ
  choice: तुझ में
  rationale: ב का सीधा अर्थ ‘में’ रखा गया है; करणसूचक ‘तेरे द्वारा’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: כֹּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: पृथ्वी के सभी कुल
  rationale: מִשְׁפָּחוֹת के पारिवारिक अथवा वंश-समूह अर्थ को ‘कुल’ व्यक्त करता है, और הָאֲדָמָה के सार्वभौमिक संदर्भ को ‘पृथ्वी’ स्पष्ट करता है।
theological_decisions:
- issue: וְנִבְרְכוּ בְךָ में अब्राहम-संबंधी आशीष का अर्थ
  choice: 'कर्मवाच्य: ‘तुझ में आशीष पाएँगे’'
  alternative: 'आत्मवाचक/मध्यवाचक: ‘तेरे द्वारा अपने लिए आशीष माँगेंगे’; अथवा करणसूचक: ‘तेरे द्वारा आशीष पाएँगे’'
  rationale: निफ़अल रूप कर्मवाच्य या आत्मवाचक/मध्यवाचक समझा जा सकता है और ב करणसूचक भी हो सकता है। मुख्य पाठ में सीधा कर्मवाच्य पाठ रखा गया है, जबकि वास्तविक अनिश्चितता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अनादर करता है’ द्वारा קלל और प्रबल ארר के बीच का अंतर सुरक्षित है। सर्वनाम ‘तू/तुझे/तेरा’ बाइबिलीय एकवचन सम्बोधन के अनुरूप है।
