source:
  edition: WLC
  text: לָ/מָ֤ה אָמַ֨רְתָּ֙ אֲחֹ֣תִ/י הִ֔וא וָ/אֶקַּ֥ח אֹתָ֛/הּ לִ֖/י לְ/אִשָּׁ֑ה וְ/עַתָּ֕ה הִנֵּ֥ה אִשְׁתְּ/ךָ֖ קַ֥ח וָ/לֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/019.yaml
  text: Why did you say[a], ‘She is my sister,’ and I took her to be my wife? And now, here is your wife[c][b]. Take her and go.”
translation:
  language: hi
  text: तुमने यह क्यों कहा, ‘वह तुम्हारी बहन है,’ जिसके कारण मैंने उसे अपनी पत्नी के रूप में ले लिया?[a] अब देखो, यह तुम्हारी पत्नी है। उसे ले लो और चले जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “और मैंने उसे अपने लिए पत्नी के रूप में ले लिया।”'
    reason: इब्रानी वाक्य में साधारण संयोजक ‘और’ तथा לִי (‘अपने लिए’) का अधिक निकट वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: לָמָה אָמַרְתָּ
  choice: तुमने यह क्यों कहा
  rationale: प्रश्नवाचक לָמָה को स्वाभाविक आधुनिक हिन्दी में ‘क्यों’ और אָמַרְתָּ को कथा के भूतकाल में व्यक्त किया गया है।
- source_word: אֲחֹתִי הִוא
  choice: वह मेरी बहन है
  rationale: इब्रानी की क्रियारहित प्रत्यक्ष उक्ति का वर्तमानकालीन कथन हिन्दी में स्वाभाविक रूप से सुरक्षित है।
- source_word: וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה
  choice: जिसके कारण मैंने उसे अपनी पत्नी बनाने के लिए ले लिया
  rationale: वाव से जुड़े परिणामी कथन को हिन्दी में स्पष्ट और स्वाभाविक बनाया गया है। ‘अपनी पत्नी बनाने के लिए ले लिया’ विवाह हेतु ग्रहण करने का भाव देता है; לִי का व्यक्तिगत संबंध ‘अपनी’ में समाहित है। अधिक शब्दशः रूप पादटिप्पणी में दिया गया है।
- source_word: וְעַתָּה הִנֵּה אִשְׁתְּךָ
  choice: अब देखो, यह रही तुम्हारी पत्नी
  rationale: הִנֵּה का ध्यान आकर्षित करने वाला और संकेतात्मक बल ‘देखो, यह रही’ से व्यक्त होता है; ‘तुम्हारी पत्नी’ सारै की वास्तविक वैवाहिक स्थिति को स्पष्ट रखता है।
- source_word: קַח וָלֵךְ
  choice: उसे लो और चले जाओ
  rationale: दोनों आज्ञार्थक क्रियाओं का क्रम सुरक्षित है। हिन्दी में पहली आज्ञा का निहित कर्म ‘उसे’ स्पष्ट करना स्वाभाविक है; ‘चले जाओ’ आदेश का बल रखता है, पर अतिरिक्त शत्रुता नहीं जोड़ता।
theological_decisions:
- issue: अब्राम के कथन और फ़िरौन द्वारा सारै को पत्नी बनाने के लिए लेने के बीच संबंध
  choice: जिसके कारण
  alternative: और मैंने उसे अपनी पत्नी बनाने के लिए ले लिया
  rationale: इब्रानी וָאֶקַּח औपचारिक रूप से ‘और मैंने लिया’ है, पर प्रसंग में दूसरा कार्य पहले कथन का परिणाम है। हिन्दी में केवल ‘और’ संबंध को अस्वाभाविक या अस्पष्ट बना सकता है; ‘जिसके कारण’ परिणाम स्पष्ट करता है, उद्देश्य नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अब देखो’ הִנֵּה की संकेतात्मक तीव्रता को बिना पुरातन ‘निहार’ या ‘देख’ जैसे रूपों के व्यक्त करता है।
