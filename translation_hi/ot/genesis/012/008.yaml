base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/008.yaml
  text: From there he moved to the hill country east of Bethel and pitched his tent[a], with Bethel on the west and Ai on the east[b]. There he built an altar to Yahweh and called on the name of Yahweh.
translation:
  language: hi
  text: वहाँ से वह बेतेल के पूर्व में पहाड़ी प्रदेश की ओर चला गया और उसने अपना तंबू लगाया। बेतेल पश्चिम में और ऐ पूर्व में था। वहाँ उसने यहोवा के लिए एक वेदी बनाई और यहोवा के नाम से पुकारा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा के नाम की घोषणा की।” इब्रानी अभिव्यक्ति का अर्थ आराधना में यहोवा को पुकारना या उसके नाम की सार्वजनिक घोषणा करना हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְתֵּק
  choice: वह...चला गया
  rationale: क्रिया एक स्थान से दूसरे स्थान की ओर बढ़ने या पड़ाव बदलने को व्यक्त करती है; यह हिन्दी में स्वाभाविक कथात्मक रूप है।
- source_word: הָהָרָה
  choice: पहाड़ी प्रदेश की ओर
  rationale: दिशासूचक रूप गति को पहाड़ी भूभाग की ओर दर्शाता है; प्रसंग में एक अकेले पहाड़ के बजाय क्षेत्र अभिप्रेत है।
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: बेतेल के पूर्व में स्थित
  rationale: यह पदबंध बेतेल के सापेक्ष उस पहाड़ी क्षेत्र की पूर्वी स्थिति बताता है।
- source_word: וַיֵּט אָהֳלֹה
  choice: उसने अपना तंबू लगाया
  rationale: यह तंबू तानने या खड़ा करने का प्रचलित इब्रानी मुहावरा है।
- source_word: מִיָּם
  choice: पश्चिम में
  rationale: יָם का मूल अर्थ समुद्र है, पर दिशात्मक प्रयोग में यह भूमध्य सागर की दिशा अर्थात पश्चिम को सूचित करता है।
- source_word: וְהָעַי מִקֶּדֶם
  choice: और पूर्व में ऐ
  rationale: यह अब्राम के पड़ाव के सापेक्ष ऐ की पूर्वी स्थिति को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: מִזְבֵּחַ
  choice: वेदी
  rationale: बलिदान और आराधना के लिए निर्मित संरचना का मानक हिन्दी बाइबलीय शब्द।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को हिन्दी की स्थापित ध्वन्यात्मक वर्तनी 'यहोवा' से व्यक्त किया गया है।
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: यहोवा का नाम लेकर पुकारा
  rationale: यह आराधना में यहोवा को पुकारने का प्राथमिक भाव रखता है, जबकि सम्भावित सार्वजनिक घोषणा का अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम प्रत्यक्ष है। हिन्दी पाठकों के लिए सुपरिचित 'यहोवा' नामात्मक रूप को बनाए रखता है और इसे केवल उपाधि में नहीं बदलता।
- issue: וַיִּקְרָא בְּשֵׁם יְהוָה का अर्थ
  choice: यहोवा का नाम लेकर पुकारा
  alternative: यहोवा के नाम की घोषणा की
  rationale: पितृकालीन आराधना के प्रसंग में आह्वान प्रमुख अर्थ है, पर इब्रानी पदबंध घोषणा का भाव भी दे सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। स्थान-नाम 'बेतेल' और 'ऐ' प्रचलित हिन्दी बाइबलीय रूपों में हैं। स्रोत और उपलब्ध अंग्रेज़ी पादटिप्पणी-चिह्नों में असंगति थी; अर्थगत वैकल्पिक पठन को सही वाक्यांश के बाद [a] से चिह्नित किया गया है।
