  yaml_path: translation/ot/genesis/012/010.yaml
  text: There was a famine in the land[a], and Abram went down to Egypt to sojourn there, because the famine was severe in the land.
translation:
  language: hi
  text: उस भूमि में अकाल पड़ा, और अब्राम वहाँ परदेशी की तरह कुछ समय रहने के लिए मिस्र की ओर उतर गया[a], क्योंकि उस भूमि में अकाल बहुत भीषण था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहाँ अस्थायी रूप से रहने के लिए।” इब्रानी शब्द में किसी स्थान पर परदेशी की तरह निवास करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: पड़ा
  rationale: अकाल के आरम्भ या उपस्थित होने को स्वाभाविक आधुनिक हिन्दी में ‘अकाल पड़ा’ कहा जाता है; वाक्य का आरम्भ किसी ऐसे ‘अब’ से नहीं किया गया जिसका इब्रानी में अलग शब्द नहीं है।
- source_word: רָעָב
  choice: अकाल
  rationale: यह शब्द केवल व्यक्तिगत भूख नहीं, बल्कि व्यापक खाद्य-संकट को व्यक्त करता है।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: यहाँ אֶרֶץ का संकेत उस स्थानीय भूभाग से है जहाँ अब्राम रह रहा था। ‘उस देश’ कथानक के पहले से पहचाने गए भूभाग को स्वाभाविक हिन्दी में व्यक्त करता है और दोनों बार की पुनरावृत्ति बनाए रखता है।
- source_word: וַיֵּרֶד
  choice: चला गया
  rationale: ירד का शाब्दिक अर्थ ‘नीचे जाना’ है, पर मिस्र की यात्रा के लिए हिन्दी में ‘नीचे गया’ अस्वाभाविक और भ्रामक हो सकता है। ‘चला गया’ गमन को सहज रूप से व्यक्त करता है, जबकि दिशा अगले पद ‘मिस्र’ से स्पष्ट है।
- source_word: מִצְרַיְמָה
  choice: मिस्र
  rationale: दिशासूचक प्रत्यय मिस्र की ओर गति बताता है; हिन्दी में ‘मिस्र चला गया’ यही अर्थ स्वाभाविक रूप से देता है।
- source_word: לָגוּר
  choice: कुछ समय के लिए परदेशी के रूप में रहे
  rationale: גור में अस्थायी निवास और बाहरी/परदेशी के रूप में रहने—दोनों का भाव है। यह रूप आधुनिक पाठक के लिए स्पष्ट रहते हुए दोनों अर्थ-घटकों को बनाए रखता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह मिस्र की ओर संकेत करने वाला सीधा स्थानवाचक क्रियाविशेषण है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अब्राम के मिस्र जाने का कारण प्रस्तुत करता है।
- source_word: כָבֵד
  choice: बहुत भयंकर
  rationale: शाब्दिक अर्थ ‘भारी’ है, किंतु अकाल के साथ यह उसकी अत्यधिक तीव्रता बताता है; ‘बहुत भयंकर’ हिन्दी में उस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָרָעָב
  choice: अकाल
  rationale: यह पहले बताए गए अकाल को ही फिर से निर्दिष्ट करता है; हिन्दी में संदर्भ और पुनरावृत्ति से निश्चितता स्पष्ट है।
