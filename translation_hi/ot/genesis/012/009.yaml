    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: कूच करके
  rationale: क्रिया נסע यहाँ पड़ाव से आगे यात्रा आरम्भ करने या आगे बढ़ने का भाव देती है। ‘कूच करके’ इस गतिशील अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना तंबू समेटने की क्रिया को अनावश्यक रूप से स्पष्ट किए।
- source_word: אַבְרָם
  choice: अब्राम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: הָלוֹךְ וְנָסוֹעַ
  choice: बढ़ता गया
  rationale: यह इन्फिनिटिव ऐब्सोल्यूट पदबंध निरंतर या क्रमशः आगे यात्रा करते रहने का भाव देता है। ‘बढ़ता गया’ उस प्रगतिशीलता को सहज आधुनिक हिन्दी में रखता है; ‘पड़ाव-दर-पड़ाव’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: הַנֶּגְבָּה
  choice: नेगेव की ओर
  rationale: संज्ञा נֶגֶב दक्षिण दिशा या नेगेव नामक दक्षिणी भूभाग, दोनों को सूचित कर सकती है। निश्चित उपपद और दिशासूचक प्रत्यय के कारण यहाँ भूभाग का अर्थ संभावित है; ‘की ओर’ दिशात्मकता को बनाए रखता है।
