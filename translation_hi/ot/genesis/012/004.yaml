id: GEN.12.4
reference: Genesis 12:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ אַבְרָ֗ם כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר אֵלָי/ו֙ יְהוָ֔ה וַ/יֵּ֥לֶךְ אִתּ֖/וֹ ל֑וֹט וְ/אַבְרָ֗ם בֶּן חָמֵ֤שׁ שָׁנִים֙ וְ/שִׁבְעִ֣ים שָׁנָ֔ה בְּ/צֵאת֖/וֹ מֵ/חָרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/004.yaml
  text: So Abram went, just as Yahweh had spoken to him, and Lot went with him. Abram was seventy-five years old when he departed from Haran.
translation:
  language: hi
  text: तब अब्राम चला गया, ठीक वैसे ही जैसे यहोवा ने उससे कहा था, और लूत भी उसके साथ गया। जब अब्राम हारान से निकला, तब वह पचहत्तर वर्ष का था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: चला गया
  rationale: הלך का यह कथात्मक रूप बीती हुई सामान्य गति को व्यक्त करता है। ‘चला गया’ स्वाभाविक हिन्दी है और यात्रा आरम्भ करने पर इब्रानी से अधिक बल नहीं देता।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह अब्राम के कार्य और यहोवा के पहले कहे वचन के बीच अनुरूपता व्यक्त करता है; यह अनुवाद उसकी आज्ञाकारिता को बिना अतिरिक्त व्याख्या जोड़े स्पष्ट करता है।
- source_word: דִּבֶּר אֵלָיו
  choice: उससे कहा था
  rationale: हिन्दी का पूर्ण भूतकाल स्पष्ट करता है कि यहोवा का कथन अब्राम के चलने से पहले हुआ था। इस प्रसंग में ‘कहा’ स्वाभाविक हिन्दी है और דבר का आशय ठीक व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले ईश्वरीय व्यक्तिगत नाम को हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है, किसी पदवी से नहीं।
- source_word: אִתּוֹ
  choice: उसके साथ
  rationale: संबंधवाचक पूर्वसर्ग और सर्वनाम-प्रत्यय का सीधा, संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה
  choice: पचहत्तर वर्ष का था
  rationale: आयु बताने वाली इब्रानी रूढ़ि का आधुनिक हिन्दी में स्वाभाविक अर्थानुवाद।
- source_word: בְּצֵאתוֹ
  choice: जब ... निकला
  rationale: ב के साथ infinitive construct घटना का समय बताता है। ‘जब ... निकला’ हारान छोड़ने की बात को सहज हिन्दी में व्यक्त करता है।
- source_word: מֵחָרָן
  choice: हारान से
  rationale: स्थान-नाम חָרָן का मानक हिन्दी लिप्यंतरण ‘हारान’ है और מֵ का अर्थ ‘से’ है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है, इसलिए उसे ‘प्रभु’ जैसी पदवी से नहीं बदला गया। आधुनिक मानक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ अधिक परिचित और सहज नाम-रूप है; ‘याहवे’ मूल उच्चारण का एक सम्भावित विद्वत्तापूर्ण पुनर्निर्माण है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सहज हिन्दी। वाक्यक्रम मूल कथानक के निकट रखा गया है, जबकि आयु और काल-संबंधी इब्रानी मुहावरों को स्वाभाविक हिन्दी में व्यक्त किया गया है।
