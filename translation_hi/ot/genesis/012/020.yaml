  yaml_path: translation/ot/genesis/012/020.yaml
  text: Then Pharaoh gave men orders concerning him[c][b][a], and they sent him away with his wife and all that belonged to him.
translation:
  language: hi
  text: तब फ़िरौन ने उसके विषय में आदमियों को आदेश दिया, और उन्होंने अब्राम को उसकी पत्नी और उसकी सारी संपत्ति समेत विदा कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: आदेश दिया
  rationale: क्रिया צוה का सामान्य अर्थ ‘आदेश देना’ है; यह फ़िरौन के अधिकार और निर्देश की शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָלָיו
  choice: उसके विषय में
  rationale: צוה के साथ עַל यहाँ अब्राम के संबंध में दिए गए आदेशों को दर्शाता है; ‘उसके विषय में’ स्रोत की व्यापकता बनाए रखता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का प्रचलित मानक हिन्दी रूप।
- source_word: אֲנָשִׁים
  choice: अपने आदमियों को
  rationale: मूल शब्द का शाब्दिक अर्थ ‘पुरुष/आदमी’ है। प्रसंग में ये फ़िरौन के अधीन कार्य करने वाले लोग हैं; ‘अपने आदमियों’ से उनकी अनिर्दिष्ट भूमिका और फ़िरौन से संबंध दोनों स्वाभाविक रूप में व्यक्त होते हैं।
- source_word: וַיְשַׁלְּחוּ
  choice: विदा कर दिया
  rationale: שלח यहाँ किसी को जाने के लिए भेजने अथवा रवाना करने का भाव रखता है। ‘विदा कर दिया’ अनावश्यक रूप से बलपूर्वक निष्कासन या औपचारिक सुरक्षा-दल का अर्थ जोड़े बिना प्रसंग को व्यक्त करता है।
- source_word: אֹתוֹ
  choice: अब्राम को
  rationale: सर्वनाम का संदर्भ अब्राम है; हिन्दी में स्पष्टता के लिए उसका नाम दोहराया गया है।
- source_word: אִשְׁתּוֹ
  choice: उसकी पत्नी
  rationale: वैवाहिक प्रसंग में אשה का स्वाभाविक अर्थ ‘पत्नी’ है।
- source_word: כָּל אֲשֶׁר לוֹ
  choice: उसकी सारी संपत्ति
  rationale: वाक्यांश का अर्थ अब्राम के पास या उसके स्वामित्व में जो कुछ था, वह सब है; ‘सारी संपत्ति’ आधुनिक हिन्दी में संक्षिप्त और व्यापक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘अपने आदमियों’ उनकी ठीक-ठीक पदवी बताए बिना फ़िरौन के अधीन एजेंटों का संकेत देता है; ‘विदा कर दिया’ मूल क्रिया की व्यापकता को बनाए रखता है।
