base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/007.yaml
  text: Then Yahweh appeared to Abram and said[a], “To your offspring I will give this land.” So there he built an altar to Yahweh, who had appeared to him.
translation:
  language: hi
  text: तब याहवे अब्राम को दिखाई दिया और उससे कहा, “मैं यह भूमि तुम्हारी संतान[a] को दूँगा।” तब उसने वहाँ याहवे के लिए—जो उसे दिखाई दिया था—एक वेदी बनाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बीज।” इब्रानी शब्द रूप में एकवचन है और सामूहिक अर्थ में संतानों के समूह को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: וַיֵּרָא
  choice: दिखाई दिया
  rationale: נפעל रूप यहाँ अब्राम के सामने दृश्य रूप से प्रकट होने का भाव देता है; यह चयन सहज आधुनिक हिन्दी में उसी अर्थ को व्यक्त करता है।
- source_word: לְזַרְעֲךָ
  choice: तुम्हारी संतान को
  rationale: זֶרַע रूप में एकवचन है, पर सामूहिक अर्थ में वंशजों को सूचित कर सकता है। ‘संतान’ हिन्दी में इस एकवचन-सामूहिक तनाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: אֶתֵּן
  choice: मैं ... दूँगा
  rationale: अपूर्ण क्रिया यहाँ भविष्य की प्रतिज्ञा व्यक्त करती है।
- source_word: הָאָרֶץ הַזֹּאת
  choice: यह भूमि
  rationale: אֶרֶץ इस प्रतिज्ञा के संदर्भ में किसी राजनीतिक राष्ट्र की अपेक्षा निश्चित भूभाग को दर्शाता है; ‘भूमि’ इस अर्थ को स्पष्ट रखता है।
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: तब उसने वहाँ ... एक वेदी बनाई
  rationale: कथात्मक क्रियारूप घटना को आगे बढ़ाता है; ‘तब’ क्रम को और ‘वहाँ’ मूल स्थान-सूचना को सुरक्षित रखता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל समर्पण अथवा उद्देश्य का संकेत करता है; वेदी याहवे के लिए बनाई गई थी।
- source_word: הַנִּרְאֶה אֵלָיו
  choice: जो उसे दिखाई दिया था
  rationale: संज्ञीकृत कृदंत याहवे की पहचान उस व्यक्ति के रूप में कराता है जो अब्राम को दिखाई दिया था; ‘था’ वेदी बनाने से पहले हुई घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। लिप्यंतरण नाम को सुरक्षित रखता है और उसे उपाधि में नहीं बदलता।
- issue: זֶרַע का एकवचन-सामूहिक अर्थ
  choice: संतान
  alternative: बीज; वंशज
  rationale: ‘संतान’ व्याकरणिक एकवचन और संभावित सामूहिक संदर्भ दोनों को खुला रखता है; इससे प्रतिज्ञा को केवल एक व्यक्ति या केवल अनेक वंशजों तक अनावश्यक रूप से सीमित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथात्मक क्रम के लिए ‘तब’ और प्रतिज्ञा के निश्चित भूभाग के लिए ‘भूमि’ प्रयुक्त हुआ है। ‘दिखाई दिया’ को दोनों स्थानों पर दोहराकर मूल पाठ की पुनरावृत्ति और दृश्य प्रकटन का भाव सुरक्षित रखा गया है।
