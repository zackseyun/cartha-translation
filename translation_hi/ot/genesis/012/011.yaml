translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। आरम्भिक וַיְהִי को अलग से ‘और ऐसा हुआ’ कहकर बोझिल बनाने के बजाय ‘जब... तब’ संरचना में उसके कथात्मक और कालगत कार्य को समाहित किया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
