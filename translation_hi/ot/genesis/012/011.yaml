  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר הִקְרִ֖יב לָ/ב֣וֹא מִצְרָ֑יְמָ/ה וַ/יֹּ֨אמֶר֙ אֶל שָׂרַ֣י אִשְׁתּ֔/וֹ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִשָּׁ֥ה יְפַת מַרְאֶ֖ה אָֽתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/011.yaml
  text: And it happened[a], as he was about to enter Egypt, that he said to Sarai his wife, “Look now[b], I know that you are a woman beautiful in appearance.”
translation:
  language: hi
  text: जब वह मिस्र में प्रवेश करने ही वाला था, तब उसने अपनी पत्नी सारै से कहा, “देखो, मैं जानता हूँ कि तुम देखने में सुंदर स्त्री हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: जब... तब
  rationale: यह इब्रानी कथात्मक संरचना उस समय-परिस्थिति को प्रस्तुत करती है जिसमें अब्राम ने बात कही। हिन्दी में ‘जब... तब’ क्रम और संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִקְרִיב לָבוֹא
  choice: प्रवेश करने के निकट पहुँचा
  rationale: קרב के हिफ़ील रूप और בוא के क्रियार्थक प्रयोग में निकट आने तथा आसन्न प्रवेश—दोनों का भाव है; यह अनुवाद दोनों तत्वों को बनाए रखता है।
- source_word: מִצְרָיְמָה
  choice: मिस्र में
  rationale: स्थाननाम पर दिशासूचक प्रत्यय मिस्र की ओर गति बताता है; ‘प्रवेश करना’ के साथ हिन्दी में ‘मिस्र में’ स्वाभाविक है।
- source_word: שָׂרַי אִשְׁתּוֹ
  choice: अपनी पत्नी सारै
  rationale: इब्रानी में नाम और वैवाहिक संबंध दोनों दिए गए हैं। हिन्दी का यह क्रम स्पष्ट और स्वाभाविक है।
- source_word: הִנֵּה נָא
  choice: देखो
  rationale: הִנֵּה ध्यान आकर्षित करता है और נָא कथन को संवादात्मक आग्रह या बल देता है। यहाँ ‘देखो’ आधुनिक हिन्दी में दोनों का उपयुक्त संक्षिप्त प्रतिनिधित्व करता है।
- source_word: יָדַעְתִּי
  choice: मैं जानता हूँ
  rationale: पूर्ण क्रिया यहाँ वर्तमान ज्ञान-अवस्था व्यक्त करती है; हिन्दी वर्तमान काल इसे स्वाभाविक ढंग से बताता है।
- source_word: אִשָּׁה יְפַת מַרְאֶה אָתְּ
  choice: तुम देखने में सुन्दर स्त्री हो
  rationale: יְפַת מַרְאֶה दृश्य रूप-सौन्दर्य को व्यक्त करता है। यह हिन्दी वाक्य इब्रानी की स्पष्ट संज्ञात्मक विधेय रचना को बनाए रखते हुए सहज है।
