source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל אַבְרָ֔ם לֶךְ לְ/ךָ֛ מֵ/אַרְצְ/ךָ֥ וּ/מִ/מּֽוֹלַדְתְּ/ךָ֖ וּ/מִ/בֵּ֣ית אָבִ֑י/ךָ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר אַרְאֶֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/001.yaml
  text: Yahweh said to Abram, “Go out from your land, from your kindred, and from your father’s house to the land that I will show you.”
translation:
  language: hi
  text: याहवे ने अब्राम से कहा, “अपने देश, अपने कुटुम्ब और अपने पिता के घर से निकलकर उस देश में जा, जिसे मैं तुझे दिखाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का विशिष्ट नाम स्पष्ट रूप से आया है; इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- source_word: לֶךְ־לְךָ
  choice: निकलकर ... जा
  rationale: यह मुहावरा प्रस्थान की स्पष्ट आज्ञा देता है। ‘निकलकर ... जा’ आधुनिक हिन्दी में स्वाभाविक है और स्रोत की आज्ञात्मक शक्ति बनाए रखता है।
- source_word: מִמּוֹלַדְתְּךָ
  choice: अपने कुटुम्ब
  rationale: यहाँ शब्द जन्म-सम्बन्धी समुदाय या रिश्तेदारी को सूचित करता है; ‘कुटुम्ब’ देश और पिता के घर के बीच उस व्यापक पारिवारिक दायरे को व्यक्त करता है।
- source_word: בֵּית אָבִיךָ
  choice: अपने पिता के घर
  rationale: शाब्दिक पारिवारिक-सामाजिक अभिव्यक्ति को सुरक्षित रखा गया है; इसका आशय केवल भवन नहीं, पिता का घराना भी हो सकता है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: इस प्रसंग में किसी निर्दिष्ट भूभाग की ओर संकेत है; ‘देश’ हिन्दी में उपयुक्त और सुसंगत है।
- source_word: אַרְאֶךָּ
  choice: मैं तुझे दिखाऊँगा
  rationale: हिफ़ील रूप का सीधा भाव है कि वक्ता अब्राम को वह देश दिखाएगा; भविष्यकाल स्रोत के आशय को स्पष्ट रखता है।
theological_decisions:
- issue: परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में चतुरक्षरीय विशिष्ट नाम יְהוָה है। ‘याहवे’ नाम को प्रत्यक्ष रखता है और उसे किसी उपाधि में नहीं बदलता।
- issue: לֶךְ־לְךָ में आत्मसंबंधी सर्वनाम का बल
  choice: अलग से ‘अपने लिए’ नहीं जोड़ा
  alternative: ‘अपने लिए चला जा’
  rationale: इस मुहावरे में לְךָ का सटीक बल विवादित है और प्रायः आज्ञा को तीव्र या मुहावरेदार बनाता है। हिन्दी में ‘अपने लिए’ जोड़ने से ऐसा उद्देश्य आ सकता है जो पाठ में निश्चित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अब्राम को एकवचन सम्बोधन के अनुरूप ‘जा/तुझे’ प्रयोग किया गया है। वाक्य में इब्रानी कथात्मक וַיֹּאמֶר के लिए अनावश्यक ‘तब’ या ‘अब’ नहीं जोड़ा गया।
