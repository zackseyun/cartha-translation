lexical_decisions:
- source_word: וַיְהִי כְּבֹא
  choice: जब … पहुँचा, तब
  rationale: कथात्मक क्रम में וַיְהִי और כ־युक्त क्रिया-रूप मिलकर समयसूचक परिस्थिति बताते हैं। हिन्दी का ‘जब … तब’ स्वाभाविक है और घटना का क्रम स्पष्ट रखता है।
- source_word: מִצְרָיְמָה
  choice: मिस्र में
  rationale: दिशासूचक ה मिस्र की ओर/मिस्र में प्रवेश की गति बताता है; ‘पहुँचा’ के साथ ‘मिस्र में’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיִּרְאוּ
  choice: देखा
  rationale: ראה का सीधा अर्थ यहाँ ‘देखना’ है; ‘ध्यान दिया’ जैसी व्याख्यात्मक अभिव्यक्ति की आवश्यकता नहीं है।
- source_word: הַמִּצְרִים
  choice: मिस्रियों
  rationale: यह निश्चित बहुवचन जातिवाचक संज्ञा है; ‘मिस्री’ का बहुवचन परसर्गीय रूप उपयुक्त है।
- source_word: הָאִשָּׁה
  choice: वह स्त्री
  rationale: אִשָּׁה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। इस उपवाक्य की सामान्य शब्दावली बनाए रखने के लिए ‘स्त्री’ रखा गया है, जबकि संकेतवाचक ‘वह’ हिन्दी में निश्चितता और पूर्वोक्त व्यक्ति को स्वाभाविक ढंग से दर्शाता है।
- source_word: כִּי
  choice: कि
  rationale: यह उनके देखने/जानने की विषय-वस्तु प्रस्तुत करता है; हिन्दी में इसका स्वाभाविक पूरक-सूचक ‘कि’ है।
- source_word: יָפָה הִוא מְאֹד
  choice: वह … बहुत सुन्दर थी
  rationale: יָפָה शारीरिक सुन्दरता और מְאֹד तीव्रता व्यक्त करते हैं। स्त्रीलिंग सर्वनाम तथा भूतकालीन सहायक क्रिया हिन्दी वाक्य-विन्यास में स्रोत का भाव स्पष्ट रखते हैं।
