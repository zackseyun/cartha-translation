  edition: WLC
  text: וְ/אֶֽעֶשְׂ/ךָ֙ לְ/ג֣וֹי גָּד֔וֹל וַ/אֲבָ֣רֶכְ/ךָ֔ וַ/אֲגַדְּלָ֖ה שְׁמֶ֑/ךָ וֶ/הְיֵ֖ה בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/002.yaml
  text: And I will make you into a great nation[a], and I will bless you, and I will make your name great[b], and be a blessing.
translation:
  language: hi
  text: मैं तुझसे एक महान राष्ट्र बनाऊँगा, तुझे आशीष दूँगा और तेरा नाम महान करूँगा; और तू आशीष बन[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तू आशीष होगा।” इब्रानी क्रिया आज्ञार्थक है—“बन”—लेकिन प्रतिज्ञाओं के इस क्रम में कुछ लोग इसे उनके परिणाम के रूप में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל
  choice: मैं तुझसे एक महान राष्ट्र बनाऊँगा
  rationale: עשה के साथ प्रत्यय और לְגוֹי का आशय अब्राम से एक बड़े राष्ट्र को अस्तित्व में लाना है। आधुनिक हिन्दी में ‘तुझसे ... राष्ट्र बनाऊँगा’ स्वाभाविक है और एक व्यक्ति को सीधे ‘राष्ट्र’ कहने की असहजता से बचता है। גּוֹי के लिए ‘राष्ट्र’ आज के पाठकों के लिए ‘जाति’ की अपेक्षा अधिक स्पष्ट है।
- source_word: וַאֲבָרֶכְךָ
  choice: तुझे आशीष दूँगा
  rationale: ברך के पिएल रूप का सीधा अर्थ ‘आशीष देना’ है; ‘तुझे’ व्यक्तिगत प्रतिज्ञा को बनाए रखता है।
- source_word: וַאֲגַדְּלָה שְׁמֶךָ
  choice: तेरा नाम महान करूँगा
  rationale: גדל का अर्थ ‘महान करना’ है। שֵׁם को ‘नाम’ रखने से मूल रूपक और उसका बाइबलीय अनुनाद सुरक्षित रहता है; केवल ‘प्रतिष्ठा’ कहना अर्थ को सीमित कर देता।
- source_word: וֶהְיֵה בְּרָכָה
  choice: और तू आशीष बन
  rationale: וֶהְיֵה द्वितीय पुरुष एकवचन की आज्ञार्थक क्रिया है, इसलिए ‘बन’ उसके व्याकरणिक बल को सुरक्षित रखता है। בְּרָכָה अनिश्चित एकवचन संज्ञा है, जिसे हिन्दी में स्वाभाविक रूप से ‘आशीष’ कहा गया है।
theological_decisions:
- issue: וֶהְיֵה בְּרָכָה का बल
  choice: 'आज्ञार्थक: ‘और तू आशीष बन’'
  alternative: 'परिणामसूचक/भविष्यसूचक: ‘और तू आशीष होगा’'
  rationale: इब्रानी रूप स्पष्टतः आज्ञार्थक है, इसलिए मुख्य पाठ में आदेश का बल रखा गया है। फिर भी यह वाक्य ईश्वर की प्रतिज्ञाओं की शृंखला में आता है, अतः परिणामसूचक समझ की वास्तविक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। एकवचन सम्बोधन ‘तू/तुझे/तेरा’ मूल के द्वितीय पुरुष एकवचन को लगातार व्यक्त करता है। ‘राष्ट्र’ चुना गया है क्योंकि आधुनिक हिन्दी में ‘जाति’ प्रायः जाति-व्यवस्था या सामाजिक समुदाय का अर्थ दे सकती है।
