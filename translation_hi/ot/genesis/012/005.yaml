base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/005.yaml
  text: Abram took Sarai his wife[a], and Lot his brother’s son, and all their possessions that they had acquired, and the people whom they had acquired in Haran; and they set out to go to the land of Canaan[b], and they came to the land of Canaan.
translation:
  language: hi
  text: अब्राम ने अपनी पत्नी सारै, अपने भाई के बेटे लूत, और उनकी सारी संपत्ति जो उन्होंने अर्जित की थी, तथा उन लोगों को जिन्हें उन्होंने हारान में इकट्ठा किया था[a], साथ लिया; और वे कनान देश जाने के लिए निकल पड़े और कनान देश पहुँचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे व्यक्ति जिन्हें उन्होंने हारान में प्राप्त किया था।” शाब्दिक रूप से, “वे प्राण/व्यक्ति जिन्हें उन्होंने हारान में बनाया था।” यह इब्रानी मुहावरा सम्भवतः उन लोगों के लिए है जिन्हें उन्होंने वहाँ अपने घराने में जोड़ा, इकट्ठा किया या प्राप्त किया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: को लेकर
  rationale: यहाँ क्रिया कई व्यक्तियों और वस्तुओं को प्रस्थान के समय साथ ले जाने का बोध देती है; हिन्दी में ‘को लेकर’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: אִשְׁתּוֹ
  choice: अपनी पत्नी
  rationale: वैवाहिक प्रसंग में אִשָּׁה का अर्थ स्पष्ट रूप से ‘पत्नी’ है।
- source_word: בֶּן־אָחִיו
  choice: अपने भाई के बेटे
  rationale: यह इब्रानी के संबंधसूचक पदबंध को पारदर्शी रूप से बनाए रखता है; ‘भतीजे’ की अपेक्षा अधिक मूलनिष्ठ है।
- source_word: כָּל־רְכוּשָׁם אֲשֶׁר רָכָשׁוּ
  choice: अपनी सारी अर्जित सम्पत्ति
  rationale: रְכוּשׁ चल-अचल माल या सम्पत्ति का व्यापक बोध देता है और רָכַשׁ उसे प्राप्त अथवा अर्जित करने को दर्शाता है। संक्षिप्त हिन्दी मूल का अर्थ सुरक्षित रखती है।
- source_word: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ בְחָרָן
  choice: हारान में अपने साथ किए हुए लोगों
  rationale: נֶפֶשׁ यहाँ सामूहिक रूप से व्यक्तियों को दर्शाता है। עָשׂוּ का शाब्दिक अर्थ ‘बनाए’ है, पर इस मुहावरे में घराने से जोड़ने, जुटाने या प्राप्त करने का भाव सम्भव है। ‘अपने साथ किए हुए’ हिन्दी में इस अस्पष्टता को कुछ सीमा तक बनाए रखता है और लोगों को मात्र सम्पत्ति कहने से बचता है।
- source_word: וַיֵּצְאוּ לָלֶכֶת אַרְצָה כְּנַעַן
  choice: कनान देश जाने के लिए निकला
  rationale: यह प्रस्थान और उसके उद्देश्य दोनों को स्वाभाविक हिन्दी में व्यक्त करता है। इब्रानी में बहुवचन क्रिया है, पर हिन्दी में संयुक्त कर्ता के साथ ‘लेकर ... निकला’ का केन्द्र अब्राम है; अगला वाक्य समूह के लिए बहुवचन रखता है।
- source_word: וַיָּבֹאוּ אַרְצָה כְּנָעַן
  choice: वे कनान देश पहुँच गए
  rationale: यह गन्तव्य पर वास्तविक आगमन को स्पष्ट करता है और मूल में ‘कनान देश’ की पुनरावृत्ति बनाए रखता है।
theological_decisions:
- issue: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ में लोगों की स्थिति और उन्हें पाने का ढंग
  choice: मुख्य पाठ में ‘अपने साथ किए हुए लोगों’ और पादटिप्पणी में सम्भावित अर्थ
  alternative: ‘जिन प्राणियों को उन्होंने बनाया था’ अथवा ‘जिन व्यक्तियों को उन्होंने प्राप्त किया था’
  rationale: मूल मुहावरा यह निश्चित नहीं करता कि ये दास, सेवक, आश्रित या घराने से जुड़े अन्य लोग थे। अनुवाद किसी विशेष सामाजिक या धार्मिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘सारै’, ‘लूत’, ‘हारान’ और ‘कनान’ प्रचलित हिन्दी बाइबलीय नामरूप हैं। कठिन इब्रानी मुहावरे को मुख्य पाठ में पठनीय रखा गया है और उसकी वास्तविक शाब्दिक तथा अर्थगत अस्पष्टता पादटिप्पणी में दी गई है।
