  text: וַ/יִּרְא֤וּ אֹתָ/הּ֙ שָׂרֵ֣י פַרְעֹ֔ה וַ/יְהַֽלְל֥וּ אֹתָ֖/הּ אֶל פַּרְעֹ֑ה וַ/תֻּקַּ֥ח הָ/אִשָּׁ֖ה בֵּ֥ית פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/015.yaml
  text: When Pharaoh’s officials saw her[a], they praised her to Pharaoh[b], and the woman was taken into Pharaoh’s house.
translation:
  language: hi
  text: जब फ़िरौन के अधिकारियों ने उसे देखा, तो उन्होंने फ़िरौन के सामने उसकी प्रशंसा की[a], और उस स्त्री को फ़िरौन के घर में ले जाया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उन्होंने उसे फ़िरौन के सामने सराहा’ अथवा ‘उन्होंने फ़िरौन को उसके गुण बताए।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘घर’; इसका आशय केवल भौतिक भवन नहीं, बल्कि फ़िरौन का राजकीय घराना भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי פַרְעֹה
  choice: फ़िरौन के अधिकारी
  rationale: שָׂרִים शासकों, उच्च पदाधिकारियों या सरदारों को दर्शाता है; दरबारी प्रसंग में ‘अधिकारी’ स्वाभाविक है और उन्हें राजपुत्र मानने का अनावश्यक संकेत नहीं देता।
- source_word: וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה
  choice: उन्होंने फ़िरौन के सामने उसकी प्रशंसा की
  rationale: पिएल रूप में הלל यहाँ प्रशंसा करने या गुण बताने का भाव देता है। यह अनुवाद अनुकूल उल्लेख का अर्थ रखता है और हिन्दी में स्वाभाविक है।
- source_word: וַתֻּקַּח
  choice: ले जाया गया
  rationale: इब्रानी क्रिया निष्क्रिय रूप में है और कर्ता को व्यक्त नहीं करती; हिन्दी का निष्क्रिय प्रयोग स्त्री की निष्क्रिय भूमिका और अनिर्दिष्ट कर्ता दोनों को बनाए रखता है।
- source_word: הָאִשָּׁה
  choice: उस स्त्री
  rationale: मूल पाठ में स्पष्ट रूप से ‘स्त्री’ है, ‘पत्नी’ नहीं। ‘उस स्त्री’ पूर्वोक्त स्त्री का संकेत करते हुए मूल शब्दावली को सुरक्षित रखता है।
- source_word: בֵּית פַּרְעֹה
  choice: फ़िरौन के भवन में
  rationale: בַּיִת का अर्थ भवन, घर या घराना हो सकता है। ‘भवन’ राजकीय निवास के प्रसंग में स्वाभाविक है, पर ‘महल’ या ‘हरम’ जैसी अधिक व्याख्यात्मक संज्ञा नहीं जोड़ता।
- source_word: וַיִּרְאוּ אֹתָהּ
  choice: उसे देखा
  rationale: ראה का सामान्य अर्थ ‘देखना’ है; प्रसंग में किसी विस्तार की आवश्यकता नहीं है।
