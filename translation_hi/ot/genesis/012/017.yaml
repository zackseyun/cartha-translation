source:
  edition: WLC
  text: וַ/יְנַגַּ֨ע יְהוָ֧ה אֶת פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְ/אֶת בֵּית֑/וֹ עַל דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/017.yaml
  text: But Yahweh afflicted Pharaoh and his household with severe plagues because of Sarai[a], Abram’s wife.
translation:
  language: hi
  text: पर याहवे ने सारै, जो अब्राम की पत्नी थी, के कारण फ़िरौन और उसके घराने को भारी विपत्तियों से पीड़ित किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फ़िरौन और उसके घराने को बड़े आघात पहुँचाए।” इब्रानी में प्रयुक्त क्रिया का अर्थ “मारना,” “आघात पहुँचाना” या “पीड़ित करना” हो सकता है, और उससे जुड़ी संज्ञा का अर्थ “आघात,” “कष्ट” या “विपत्तियाँ” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַגַּע
  choice: विपत्तियों से मारा
  rationale: נגע की हिफ़ील क्रिया यहाँ हानिकारक आघात पहुँचाने का भाव देती है। संज्ञा נְגָעִים के साथ प्रयुक्त होने के कारण ‘विपत्तियों से मारा’ इब्रानी अभिव्यक्ति की तीव्रता और शब्द-संबंध दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वतापूर्ण लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के राजा की उपाधि का मानक और सर्वसुलभ हिन्दी रूप।
- source_word: נְגָעִים גְּדֹלִים
  choice: बड़ी-बड़ी विपत्तियों
  rationale: נְגָעִים का अर्थ प्रहार, कष्ट या विपत्तियाँ हो सकता है; גְּדֹלִים उनकी गंभीरता पर बल देता है। ‘बड़ी-बड़ी विपत्तियाँ’ अर्थ की व्यापकता को बनाए रखते हुए सहज हिन्दी है।
- source_word: וְאֶת־בֵּיתוֹ
  choice: और उसके घराने को
  rationale: בֵּיתוֹ यहाँ केवल भवन नहीं, बल्कि फ़िरौन से संबंधित घरेलू समुदाय को दर्शाता है; ‘घराना’ इस सामूहिक अर्थ को स्पष्ट करता है।
- source_word: עַל־דְּבַר
  choice: के कारण
  rationale: इस प्रसंग में यह पदबंध विपत्तियों का कारण बताता है। ‘के कारण’ आधुनिक हिन्दी में इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: अब्राम की पत्नी सारै
  rationale: इब्रानी समानाधिकरण सारै की पहचान अब्राम की पत्नी के रूप में करता है। हिन्दी में यह क्रम सहज है और कथानक के लिए आवश्यक संबंध स्पष्ट रखता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत दिव्य नाम को किसी उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है। ‘याहवे’ मूल नाम के संभावित उच्चारण का व्यापक रूप से मान्य आधुनिक रूप है; इससे किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
- issue: सारै के कारण विपत्ति आने का कथन
  choice: के कारण
  alternative: सारै के विषय में; सारै के मामले के कारण
  rationale: עַל־דְּבַר का यहाँ कारणवाचक अर्थ स्वाभाविक है। अनुवाद कथन के कारण-संबंध को रखता है, पर सारै पर नैतिक दोष आरोपित करने जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पर’ पिछले कथन के विपरीत परिणाम को जोड़ता है। ‘बड़ी-बड़ी विपत्तियों से मारा’ मूल की संबंधित क्रिया और संज्ञा के बल को यथासंभव बनाए रखता है, जबकि पादटिप्पणी वैकल्पिक शाब्दिक रूप बताती है।
