base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/017.yaml
  text: And Jacob traveled to Succoth[a], and he built a house for himself and made shelters for his livestock. Therefore he called the name of the place Succoth.
translation:
  language: hi
  text: और याकूब सुक्कोत[a] गया। उसने अपने लिए एक घर बनाया और अपने पशुधन के लिए अस्थायी आश्रय बनाए। इसलिए उसने उस स्थान का नाम सुक्कोत रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सुक्कोत” इब्रानी शब्द से जुड़ा है, जिसका अर्थ “अस्थायी आश्रय” या “झोंपड़ियाँ” है।
    reason: स्थान-नाम और पद में प्रयुक्त सामान्य संज्ञा סֻכּוֹת के बीच की शब्द-क्रीड़ा स्पष्ट करना।
lexical_decisions:
- source_word: נָסַע
  choice: गया
  rationale: यह क्रिया एक स्थान से दूसरे स्थान की ओर प्रस्थान या यात्रा को दर्शाती है। संदर्भ में ‘सुक्कोत गया’ आधुनिक हिन्दी में स्वाभाविक रूप से गंतव्य की ओर यात्रा व्यक्त करता है।
- source_word: סֻכֹּתָה
  choice: सुक्कोत
  rationale: दिशासूचक ה स्थान की ओर गति बताता है। स्थान-नाम को अनूदित करने के बजाय लिप्यंतरित किया गया है।
- source_word: וַיִּבֶן לוֹ בָּיִת
  choice: उसने अपने लिए एक घर बनाया
  rationale: यह चयन लाभार्थक לוֹ को स्पष्ट रखता है और आधुनिक हिन्दी में सहज है।
- source_word: מִקְנֵהוּ
  choice: अपने पशुधन
  rationale: यह शब्द अर्जित या पाले हुए पशुओं और झुंडों के लिए है; ‘पशुधन’ गाय-बैलों तक सीमित हुए बिना उसका व्यापक अर्थ व्यक्त करता है।
- source_word: עָשָׂה סֻכֹּת
  choice: छप्पर बनाए
  rationale: सֻכּוֹת अस्थायी, ऊपर से ढके आश्रयों को दर्शाता है। पशुधन के संदर्भ में ‘छप्पर’ साधारण हिन्दी में स्वाभाविक है और स्थान-नाम से जुड़ी शब्द-क्रीड़ा को पादटिप्पणी में समझाने देता है।
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: यह नामकरण का कारण प्रस्तुत करने वाले सूत्र का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: קָרָא שֵׁם הַמָּקוֹם
  choice: उस स्थान का नाम ... रखा
  rationale: हिब्रू मुहावरे का शाब्दिक रूप हिन्दी में अस्वाभाविक होता; यह प्रचलित हिन्दी नामकरण-सूत्र है और मूल अर्थ सुरक्षित रखता है।
- source_word: סֻכּוֹת
  choice: सुक्कोत
  rationale: स्थान-नाम का लिप्यंतरण किया गया है। सामान्य संज्ञा סֻכּוֹת के साथ उसकी ध्वन्यात्मक और व्युत्पत्तिगत कड़ी पादटिप्पणी में दी गई है।
