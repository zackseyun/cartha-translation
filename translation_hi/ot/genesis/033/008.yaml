base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/008.yaml
  text: And he said[a], “What do you mean by all this camp that I met?” And he said[c][b], “To find favor in the eyes of my lord.”
translation:
  language: hi
  text: तब उसने पूछा, “यह सारा दल[a], जो मुझे मिला, किसलिए था?” उसने उत्तर दिया, “मेरे स्वामी की दृष्टि में कृपा पाने के लिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह सारी टोली।” इब्रानी शब्द का सामान्य अर्थ “छावनी” भी हो सकता है, पर यहाँ आशय याकूब द्वारा आगे भेजे गए पशुओं और सेवकों के पूरे समूह से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי לְךָ
  choice: किसलिए था
  rationale: यह इब्रानी मुहावरा यहाँ पहचान नहीं, बल्कि याकूब द्वारा आगे भेजे गए दल के उद्देश्य के बारे में पूछता है। ‘किसलिए था’ आधुनिक हिन्दी में इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל הַמַּחֲנֶה הַזֶּה
  choice: यह सारा दल
  rationale: מַחֲנֶה का सामान्य अर्थ ‘छावनी’ है, पर इस प्रसंग में यह याकूब द्वारा आगे भेजे गए पशुओं और सेवकों के पूरे समूह को सूचित करता है। ‘दल’ उसके सामूहिक अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר פָּגָשְׁתִּי
  choice: जो मुझे मिला
  rationale: פָּגַשׁ का मूल अर्थ ‘मिलना’ या ‘सामना होना’ है। ‘जो मुझे मिला’ स्रोत की संक्षिप्तता और एसाव के रास्ते में उस दल से मिलने का भाव बनाए रखता है।
- source_word: לִמְצֹא חֵן
  choice: कृपा पाने के लिए
  rationale: यह उद्देश्य बताने वाली रचना है। ‘कृपा पाना’ חֵן के अनुकूल है और किसी का अनुकूल रुख प्राप्त करने का सामाजिक भाव व्यक्त करता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: शाब्दिक मुहावरा ‘की आँखों में’ है, जिसका अर्थ किसी के आकलन या विचार में होता है। ‘की दृष्टि में’ स्रोत के रूपक को हिन्दी में समझने योग्य ढंग से बनाए रखता है।
- source_word: אֲדֹנִי
  choice: अपने स्वामी
  rationale: यहाँ אֲדֹנִי परमेश्वर की उपाधि नहीं, बल्कि याकूब द्वारा एसाव के लिए प्रयुक्त आदरसूचक संबोधन है। ‘स्वामी’ उसकी विनम्रता और सामाजिक अधीनता के स्वर को सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वक्ताओं के नाम मूल पद में नहीं हैं, इसलिए अनावश्यक रूप से नाम जोड़ने के बजाय ‘उसने’ रखा गया है। ‘अपने स्वामी’ से स्पष्ट होता है कि यह एसाव के प्रति आदरसूचक संबोधन है, कोई दैवी उपाधि नहीं।
