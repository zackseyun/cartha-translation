  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו אֲדֹנִ֤/י יֹדֵ֨עַ֙ כִּֽי הַ/יְלָדִ֣ים רַכִּ֔ים וְ/הַ/צֹּ֥אן וְ/הַ/בָּקָ֖ר עָל֣וֹת עָלָ֑/י וּ/דְפָקוּ/ם֙ י֣וֹם אֶחָ֔ד וָ/מֵ֖תוּ כָּל הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/013.yaml
  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
translation:
  language: hi
  text: पर उसने उससे कहा, “मेरे स्वामी जानते हैं कि बच्चे नाज़ुक हैं, और मेरे पास दूध पिलानेवाली भेड़-बकरियाँ और गायें हैं, जिनकी जिम्मेदारी मुझ पर है[a]। यदि उन्हें एक ही दिन बहुत हाँका जाए, तो सारी भेड़-बकरियाँ मर जाएँगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भेड़-बकरियों और गायों के साथ दूध पीनेवाले बच्चे हैं, और उनकी देखभाल का भार मुझ पर है।” इब्रानी पदबंध मुहावरेदार है। यह दूध पिलानेवाले पशुओं और याकूब पर उनकी देखभाल की जिम्मेदारी—दोनों भावों को व्यक्त करता है।
    reason: मुहावरेदार और व्याकरण की दृष्टि से कठिन इब्रानी पदबंध का संभावित वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: यह एसाव के लिए प्रयुक्त आदरसूचक मानवीय संबोधन है; ‘मेरे स्वामी’ विनम्रता और सामाजिक संबंध दोनों को बनाए रखता है।
- source_word: הַיְלָדִים רַכִּים
  choice: बच्चे नाज़ुक हैं
  rationale: רַכִּים यहाँ यात्रा की कठिनाई के सामने बच्चों की कोमलता और असुरक्षा बताता है; आधुनिक हिन्दी में ‘नाज़ुक’ स्वाभाविक और स्पष्ट है।
- source_word: הַצֹּאן וְהַבָּקָר
  choice: भेड़-बकरियाँ और गाय-बैल
  rationale: दोनों सामूहिक संज्ञाओं को सामान्य पाठक के लिए छोटे और बड़े पालतू पशुओं के परिचित हिन्दी नामों से व्यक्त किया गया है।
- source_word: עָלוֹת עָלָי
  choice: उनके साथ दूध-पीते बच्चे हैं, और वे मेरी देखभाल में हैं
  rationale: कठिन इब्रानी पदबंध पशुओं के दूध पिलाने या उनके साथ दूध-पीते बच्चों के होने तथा याकूब पर उनकी देखभाल का भार होने—दोनों भावों को जोड़ता है। हिन्दी में अर्थ को स्वाभाविक ढंग से खोलकर कहा गया है।
- source_word: וּדְפָקוּם
  choice: यदि उन्हें ... बहुत तेज़ हाँका जाए
  rationale: דפק यहाँ पशुओं को उनकी क्षमता से अधिक कठोरता या तेजी से हाँकने का अर्थ देता है। कर्मवाच्य अनिर्दिष्ट कर्ता को सुरक्षित रखता है।
- source_word: יוֹם אֶחָד
  choice: एक ही दिन
  rationale: यह एक दिन की अवधि पर जोर देता है; ‘एक ही दिन’ उस अल्प समय में होने वाले घातक परिणाम को सहज रूप से व्यक्त करता है।
- source_word: כָּל הַצֹּאן
  choice: पूरा रेवड़
  rationale: इब्रानी सामूहिक एकवचन को हिन्दी के स्वाभाविक सामूहिक शब्द ‘रेवड़’ से व्यक्त किया गया है।
