- source_word: לְנֶגְדֶּךָ
  choice: तुम्हारे आगे
  rationale: נגד सामने, सम्मुख अथवा किसी के समक्ष होने का भाव दे सकता है। यात्रा के इस संदर्भ में ‘तुम्हारे आगे’ एसाव के मार्गदर्शन या अग्रगमन के प्रस्ताव को सीधे व्यक्त करता है, जबकि ‘तुम्हारे साथ-साथ’ भी संदर्भगत संभावना है।
