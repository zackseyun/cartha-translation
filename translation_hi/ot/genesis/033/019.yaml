source:
  edition: WLC
  text: וַ/יִּ֜קֶן אֶת חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֤ר נָֽטָה שָׁם֙ אָהֳל֔/וֹ מִ/יַּ֥ד בְּנֵֽי חֲמ֖וֹר אֲבִ֣י שְׁכֶ֑ם בְּ/מֵאָ֖ה קְשִׂיטָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/019.yaml
  text: And he bought the portion of the field where he had pitched his tent[a], from the hand of the sons of Hamor, the father of Shechem, for a hundred qesitahs.
translation:
  language: hi
  text: और उसने उस खेत का वह भाग, जहाँ उसने अपना तंबू खड़ा किया था, शकेम के पिता हमोर के पुत्रों से सौ कसीता[a] में मोल लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: कसीता; यह प्राचीन समय की भुगतान-इकाई या भुगतान में दी जाने वाली वस्तु थी, जिसका ठीक मूल्य अज्ञात है। परंपरागत अनुवादों में इसे कभी-कभी “धन के सिक्के” जैसे रूपों में व्यक्त किया गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: मोल लिया
  rationale: यहाँ קנה भूमि के लेन-देन के संदर्भ में ‘खरीदना’ दर्शाता है। ‘मोल लिया’ स्वाभाविक और गरिमापूर्ण हिन्दी है तथा मूल्य के उल्लेख के साथ ठीक बैठता है।
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: उस खेत का वह भाग
  rationale: חֶלְקָה किसी निर्धारित भाग या भूखंड को दर्शाता है। यह अनुवाद मूल संरचना को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: אֲשֶׁר נָטָה שָׁם אָהֳלוֹ
  choice: जहाँ उसने अपना तंबू खड़ा किया था
  rationale: נטה के साथ אֹהֶל तंबू लगाने का प्रचलित इब्रानी मुहावरा है। ‘किया था’ खरीद से पहले हुई क्रिया को स्पष्ट करता है।
- source_word: מִיַּד בְּנֵי חֲמוֹר
  choice: हमोर के पुत्रों से
  rationale: शाब्दिक ‘हाथ से’ हिन्दी में अनावश्यक रूप से अस्वाभाविक होता; यहाँ מִיַּד विक्रेता या स्वामित्व के स्रोत को बताता है, जिसे ‘से’ ठीक प्रकार व्यक्त करता है।
- source_word: אֲבִי שְׁכֶם
  choice: शकेम के पिता
  rationale: यह पदबंध हमोर की पहचान शकेम के पिता के रूप में कराता है और इब्रानी के संबंध को स्पष्ट रखता है।
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: सौ कसीता में
  rationale: קְשִׂיטָה प्राचीन भुगतान-इकाई या भुगतान-वस्तु है, जिसका ठीक मूल्य अज्ञात है। लिप्यंतरण झूठी आधुनिक सटीकता से बचता है; ‘में’ खरीद-मूल्य को स्वाभाविक हिन्दी में व्यक्त करता है।
