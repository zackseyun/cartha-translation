translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘हाथ से’ जैसे इब्रानी मुहावरे का यांत्रिक अनुवाद न करके अर्थानुकूल ‘से’ चुना गया है। पाद-टिप्पणी का संकेत अंग्रेज़ी परामर्श-पाठ में तंबू के बाद था, पर उसका विषय קְשִׂיטָה है; इसलिए हिन्दी मुख्य पाठ में [a] को ‘कसीता’ के बाद रखा गया है।
