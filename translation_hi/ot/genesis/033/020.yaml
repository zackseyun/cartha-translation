  text: וַ/יַּצֶּב שָׁ֖ם מִזְבֵּ֑חַ וַ/יִּ֨קְרָא ל֔/וֹ אֵ֖ל אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/020.yaml
  text: There he set up an altar and called it El-Elohe-Israel[a][b].
translation:
  language: hi
  text: वहाँ उसने एक वेदी स्थापित की और उसका नाम एल-एलोहे-इस्राएल[a][b] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहाँ उसने एक वेदी स्थापित की और परमेश्वर को पुकारा, ‘परमेश्वर, इस्राएल का परमेश्वर,’” अथवा, “उस वेदी के विषय में घोषणा की, ‘परमेश्वर इस्राएल का परमेश्वर है।’” इब्रानी को वेदी का नाम रखने, परमेश्वर का आह्वान करने, अथवा उसके विषय में घोषणा करने के अर्थ में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: एल-एलोहे-इस्राएल का अर्थ है “परमेश्वर, इस्राएल का परमेश्वर” अथवा “एल, इस्राएल का परमेश्वर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֶּב
  choice: बनाई
  rationale: हिफ़िल क्रिया का अर्थ यहाँ वेदी को स्थापित या खड़ा करना है। हिंदी में वेदी के साथ ‘बनाई’ स्वाभाविक है और स्थापना का आशय स्पष्ट करता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: מִזְבֵּחַ
  choice: वेदी
  rationale: बलिदान चढ़ाने की संरचना के लिए मानक और व्यापक रूप से समझा जाने वाला हिंदी शब्द।
- source_word: וַיִּקְרָא לוֹ
  choice: उसका नाम ... रखा
  rationale: संदर्भ में לֹו का संबंध वेदी से मानकर यह वाक्यांश नामकरण को व्यक्त करता है। इब्रानी में आह्वान या घोषणा का अर्थ भी संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֵל אֱלֹהֵי יִשְׂרָאֵל
  choice: एल-एलोहे-इस्राएल
  rationale: मुख्य पाठ में यह पूरा पद वेदी के नाम के रूप में कार्य करता है, इसलिए उसका लिप्यंतरण रखा गया है; उसका अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: क्या अंतिम पद वेदी का नाम है या परमेश्वर का आह्वान/घोषणा
  choice: इसे याकूब द्वारा वेदी को दिया गया नाम माना गया है।
  alternative: उसने परमेश्वर को ‘परमेश्वर, इस्राएल का परमेश्वर’ कहकर पुकारा; अथवा वेदी पर यह घोषणा की।
  rationale: वेदी बनाने के तुरंत बाद प्रयुक्त वाक्य-विन्यास नामकरण के अनुकूल है और उत्पत्ति के समान सूत्रों से मेल खाता है। फिर भी इब्रानी रचना संक्षिप्त और बहुअर्थी है, इसलिए अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वेदी बनाई’ सामान्य हिंदी में स्वाभाविक है। इब्रानी नाम को देवनागरी में लिप्यंतरित करके उसके अर्थ और मूल की वास्तविक अस्पष्टता को पादटिप्पणियों में स्पष्ट किया गया है।
