source:
  edition: WLC
  text: וַ/יָּבֹא֩ יַעֲקֹ֨ב שָׁלֵ֜ם עִ֣יר שְׁכֶ֗ם אֲשֶׁר֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יִּ֖חַן אֶת פְּנֵ֥י הָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/018.yaml
  text: Jacob came safely to the city of Shechem[a], which is in the land of Canaan, when he came from Paddan-aram[b], and he camped before the city.
translation:
  language: hi
  text: याकूब पद्दन-अराम से आते समय कनान देश के शकेम नगर में सकुशल पहुँचा[a], और उसने नगर के सामने डेरा डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याकूब शालेम पहुँचा, जो शकेम का एक नगर था।” इब्रानी शब्द שָׁלֵם (शालेम) का अर्थ “सकुशल” हो सकता है; इसे स्थाननाम “शालेम” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: पहुँचा
  rationale: בוא का कथात्मक रूप यहाँ गंतव्य पर आगमन बताता है; आधुनिक हिन्दी में ‘पहुँचा’ स्वाभाविक और सटीक है।
- source_word: שָׁלֵם
  choice: सकुशल
  rationale: इसे याकूब के पहुँचने की अवस्था बताने वाला क्रियाविशेषण मानकर ‘सुरक्षित/संपूर्ण अवस्था में’ का भाव दिया गया है; स्थाननाम ‘शालेम’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: עִיר שְׁכֶם
  choice: शकेम नगर के पास
  rationale: मुख्य पाठ में שָׁלֵם को क्रियाविशेषण मानने पर עִיר שְׁכֶם गंतव्य ‘शकेम नगर’ है। हिन्दी में ‘नगर के पास पहुँचा’ आगे के ‘नगर के सामने डेरा डाला’ से स्थानिक रूप से अधिक स्वाभाविक मेल रखता है, यद्यपि ‘के पास’ निहित अर्थ को स्पष्ट करता है।
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: कनान देश में
  rationale: सम्बन्धवाचक उपवाक्य की भौगोलिक सूचना को हिन्दी वाक्यक्रम में संक्षेप और स्वाभाविक ढंग से रखा गया है।
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  choice: अराम-नहरैम से लौटते समय
  rationale: ב + infinitive construct का कालवाचक अर्थ ‘आते समय’ है। प्रसंगानुसार हिन्दी में ‘लौटते समय’ पुनरुक्ति से बचाता और कनान वापसी स्पष्ट करता है।
- source_word: פַּדַּן אֲרָם
  choice: अराम-नहरैम
  rationale: हिन्दी बाइबलीय पाठकों के लिए प्रचलित भौगोलिक नाम; यह पद्दन-अराम क्षेत्र का पारंपरिक हिन्दी रूप है, यद्यपि अधिक प्रत्यक्ष लिप्यंतरण ‘पद्दन-अराम’ सम्भव है।
- source_word: וַיִּחַן
  choice: उसने … डेरा डाला
  rationale: חן के काल रूप का अर्थ यहाँ पड़ाव डालना है; ‘डेरा डाला’ सहज आधुनिक हिन्दी है।
- source_word: אֶת־פְּנֵי הָעִיר
  choice: नगर के सामने
  rationale: शाब्दिक ‘नगर के मुख की ओर’ का स्थानिक मुहावरा नगर के सामने स्थित क्षेत्र को दर्शाता है।
