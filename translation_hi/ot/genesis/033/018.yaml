translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। वाक्यक्रम को स्वाभाविक हिन्दी के अनुरूप बदला गया है। मुख्य पाठ में שָׁלֵם का क्रियाविशेषणार्थ चुना गया है, जबकि वास्तविक पाठगत अस्पष्टता पादटिप्पणी में दी गई है।
