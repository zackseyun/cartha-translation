review_pass:
  verdict: revise
  source_fidelity: The draft incorrectly substitutes “अराम-नहरैम” for פַּדַּן אֲרָם (Paddan-aram), a distinct place-name in the Hebrew text. It also adds “के पास” (“near”), whereas the text says Jacob came to the city and only then camped before it. The temporal phrase should not be strengthened to “लौटते” when the Hebrew says simply “on/when he came from.”
  naturalness: The revised wording is natural, modern standard Hindi and retains the narrative register. “नगर के सामने उसने डेरा डाला” clearly renders the final spatial idiom without the unsupported earlier “के पास.”
  terminology: “पद्दन-अराम” is a direct and source-faithful Hindi transliteration of Paddan-aram. “शकेम,” “कनान,” “सकुशल,” and “डेरा डाला” are suitable. The alternative construal of שָׁלֵם as the place name Salem is retained in a footnote.
  issues:
  - severity: high
    issue: “अराम-नहरैम” replaces “पद्दन-अराम.”
    rationale: The Hebrew explicitly reads מִפַּדַּן אֲרָם, “from Paddan-aram.” Aram-naharaim is not an interchangeable rendering of this source place-name.
  - severity: medium
    issue: “शकेम नगर के पास” adds an unsupported spatial qualification.
    rationale: עִיר שְׁכֶם means “the city of Shechem,” not “near the city of Shechem.” The following clause separately states that Jacob camped before the city.
  - severity: low
    issue: “लौटते समय” is more interpretive than the source.
    rationale: בְּבֹאוֹ means “when/on his coming”; “आते समय” preserves this temporal expression without explicitly characterizing the journey as a return.
  revised_text: याकूब पद्दन-अराम से आते समय कनान देश के शकेम नगर में सकुशल पहुँचा[a], और उसने नगर के सामने डेरा डाला।
  revised_footnotes:
  - marker: a
    text: या, “याकूब शालेम पहुँचा, जो शकेम का एक नगर था।” इब्रानी शब्द שָׁלֵם (शालेम) का अर्थ “सकुशल” हो सकता है; इसे स्थाननाम “शालेम” भी समझा जा सकता है।
    reason: alternative_reading
  revision_rationale: The revision restores the source place-name Paddan-aram, removes the added “near,” and renders the temporal infinitive without unnecessary interpretation. It also preserves the genuine ambiguity of שָׁלֵם in the footnote.
