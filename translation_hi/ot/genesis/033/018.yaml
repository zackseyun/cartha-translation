- from: याकूब अराम-नहरैम से लौटते समय कनान देश में शकेम नगर के पास सकुशल पहुँचा[a] और उसने नगर के सामने डेरा डाला।
  to: याकूब पद्दन-अराम से आते समय कनान देश के शकेम नगर में सकुशल पहुँचा[a], और उसने नगर के सामने डेरा डाला।
