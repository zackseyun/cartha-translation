base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/004.yaml
  text: Esau ran to meet him[a], embraced him, fell on his neck, kissed him, and they wept.
translation:
  language: hi
  text: एसाव उससे मिलने को दौड़ा, उसे गले लगाया, उसकी गर्दन से लिपट गया, उसे चूमा[a], और वे दोनों रो पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मसोरेटिक पाठ में “उसे चूमा” के लिए प्रयुक्त इब्रानी शब्द के अक्षरों पर असामान्य बिंदु लगाए गए हैं। कुछ व्याख्याकार इन्हें संदेह या विशेष बल का संकेत मानते हैं, पर यहाँ इब्रानी का सीधा अर्थ “उसे चूमा” ही है।
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרָץ
  choice: दौड़ा
  rationale: रוץ का सीधा अर्थ दौड़ना है; यह कथा में एसाव की आकस्मिक और तीव्र गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: नाम को हिन्दी बाइबलीय प्रयोग में प्रचलित रूप में लिप्यंतरित किया गया है।
- source_word: לִקְרָאתוֹ
  choice: उससे मिलने को
  rationale: לקראת का यहाँ अर्थ किसी की ओर जाकर उससे मिलना है; यह हिन्दी में स्वाभाविक है और संबंधपरक गति को स्पष्ट रखता है।
- source_word: וַיְחַבְּקֵהוּ
  choice: उसे गले लगाया
  rationale: חבק का अर्थ आलिंगन करना है; 'गले लगाया' आधुनिक सामान्य हिन्दी में स्पष्ट, आत्मीय और गरिमापूर्ण है।
- source_word: וַיִּפֹּל עַל צַוָּארוֹ
  choice: उसके गले से लिपट गया
  rationale: शाब्दिक बिंब 'उसकी गर्दन पर गिरा' है, पर यह इब्रानी भावात्मक आलिंगन की रूढ़ अभिव्यक्ति है। 'गले से लिपट गया' दृश्य और भाव दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּשָּׁקֵהוּ
  choice: उसे चूमा
  rationale: נשק का इस रूप में सीधा अर्थ चूमना है। मसोराई पाठ के असामान्य बिंदुओं की जानकारी पादटिप्पणी में दी गई है, मुख्य पाठ में संदेह नहीं जोड़ा गया।
- source_word: וַיִּבְכּוּ
  choice: वे दोनों रो पड़े
  rationale: बहुवचन क्रिया बताती है कि दोनों पुरुष रोए। 'रो पड़े' घटना की भावात्मक तत्क्षणता को सहज हिन्दी में रखता है, और 'दोनों' निहित कर्ताओं को स्पष्ट करता है।
theological_decisions:
- issue: याकूब के प्रति एसाव के कार्यों की व्याख्या
  choice: क्रियाओं के क्रम को मेल-मिलाप और स्नेह के सीधे वर्णन के रूप में अनूदित किया गया है।
  alternative: बाद की व्याख्यात्मक परंपराओं के आधार पर चुंबन को संदेहपूर्ण या व्यंग्यात्मक बताना।
  rationale: इब्रानी कथा स्नेहसूचक क्रियाओं का तीव्र क्रम प्रस्तुत करती है। अनुवाद में बाद की शंकाओं को मुख्य पाठ पर आरोपित नहीं करना चाहिए; मसोराई चिह्न की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। 'आलिंगन किया' की अपेक्षा 'गले लगाया' सामान्य पाठक के लिए अधिक स्वाभाविक है। अगले वाक्यांश में स्रोत के गर्दन/गले वाले सजीव बिंब को 'गले से लिपट गया' के रूप में बनाए रखा गया है।
