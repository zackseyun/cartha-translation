base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/003.yaml
  text: And he himself went on ahead of them and bowed down to the ground seven times[a], until he came near to his brother.
translation:
  language: hi
  text: और वह स्वयं उनके आगे गया और अपने भाई के निकट पहुँचने तक भूमि पर सात बार दण्डवत् हुआ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि तक झुका”; इब्रानी क्रिया पूर्ण दण्डवत् होने या सम्मान में झुकने की मुद्रा को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: और वह स्वयं
  rationale: स्वतंत्र सर्वनाम कर्ता पर बल देता है; ‘वह स्वयं’ याकूब के व्यक्तिगत रूप से आगे बढ़ने को उभारता है।
- source_word: עָבַר לִפְנֵיהֶם
  choice: उन सबके आगे गया
  rationale: संदर्भ में इसका अर्थ परिवार से आगे बढ़कर अगुवाई करते हुए एसाव की ओर जाना है, न कि केवल उनके सामने से पार होना।
- source_word: וַיִּשְׁתַּחוּ אַרְצָה
  choice: भूमि पर दण्डवत् हुआ
  rationale: क्रिया और दिशासूचक אַרְצָה मिलकर भूमि की ओर गहरे झुकने अथवा साष्टांग सम्मान प्रकट करने की शारीरिक मुद्रा बताते हैं; ‘दण्डवत् हुआ’ हिंदी में इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है, बिना इसे उपासना मान लेने के।
- source_word: שֶׁבַע פְּעָמִים
  choice: सात बार
  rationale: मूल की स्पष्ट संख्यात्मक अभिव्यक्ति का सीधा अनुवाद।
- source_word: עַד גִּשְׁתּוֹ עַד אָחִיו
  choice: अपने भाई के निकट पहुँचने तक
  rationale: यह वाक्यांश बार-बार दण्डवत् होने की अंतिम सीमा बताता है; दोहरे עַד को हिंदी में एक स्वाभाविक ‘तक’ संरचना से व्यक्त किया गया है।
theological_decisions:
- issue: याकूब की मुद्रा को उपासना या मानवीय सम्मान समझना
  choice: दण्डवत् हुआ
  alternative: आराधना की / प्रणाम किया
  rationale: मूल क्रिया दण्डवत् होने या सम्मान प्रकट करने को बता सकती है, पर यहाँ उसके धार्मिक उपासना होने का निर्णय नहीं करती। चुना हुआ पद शारीरिक क्रिया को रखता है और धार्मिक अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। ‘दण्डवत् हुआ’ सामान्य पाठक के लिए भूमि तक झुककर सम्मान प्रकट करने की मुद्रा को स्पष्ट करता है; अलग पाद-टिप्पणी आवश्यक नहीं मानी गई क्योंकि चुना हुआ पद मूल की पूर्ण शारीरिक मुद्रा को मुख्य पाठ में ही समेटता है।
