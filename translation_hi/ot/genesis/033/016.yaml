lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौट गया
  rationale: שׁוב का यह कथात्मक रूप पूर्ण भूतकालीन क्रिया बताता है; यात्रा के प्रसंग में ‘लौट गया’ स्वाभाविक और सटीक है।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: इस पदबंध का शाब्दिक अर्थ ‘उस दिन’ है; यहाँ ‘उसी दिन’ पूर्ववर्ती घटनाओं वाले दिन की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: व्यक्तिनाम को हिन्दी बाइबलीय प्रचलन के अनुसार लिप्यंतरित किया गया है।
- source_word: לְדַרְכּוֹ
  choice: अपने रास्ते पर
  rationale: शाब्दिक रूप से ‘अपने मार्ग की ओर/पर’; प्रसंग में यह एसाव के अपनी यात्रा फिर आरम्भ करने को व्यक्त करता है।
- source_word: שֵׂעִירָה
  choice: सेईर की ओर
  rationale: स्थान-नाम से जुड़ा दिशासूचक ה लक्ष्य की ओर गति दिखाता है; हिन्दी में ‘सेईर की ओर’ इसे स्वाभाविक ढंग से व्यक्त करता है।
