base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/001.yaml
  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
translation:
  language: hi
  text: तब याकूब ने आँखें उठाईं और देखा, और देखो, एसाव आ रहा था, और उसके साथ चार सौ आदमी थे। तब उसने बच्चों को लिआ, राहेल और दोनों दासियों[a] के बीच बाँट दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दोनों सेविकाओं’।
    reason: שְׁפָחוֹת घरेलू आश्रित स्त्रियों के लिए प्रयुक्त है। ‘दासियाँ’ उनकी सामाजिक स्थिति को अधिक प्रत्यक्ष रखता है, जबकि ‘सेविकाएँ’ भी सम्भव अनुवाद है।
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו וַיַּרְא
  choice: आँखें उठाकर देखा
  rationale: हिब्रू मुहावरे और उसके बाद आने वाली देखने की क्रिया को स्वाभाविक, किंतु गरिमापूर्ण हिन्दी में संयुक्त रूप से व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: कि
  rationale: हिब्रू का यह प्रस्तुति-सूचक शब्द एसाव को सामने आते हुए दिखाता है। हिन्दी में ‘देखा कि’ उसी दृश्यात्मक संक्रमण को सहज रूप से व्यक्त करता है; अलग से ‘देखो’ रखने पर वर्णन अस्वाभाविक होता।
- source_word: בָּא
  choice: आ रहा था
  rationale: कर्तृवाचक कृदन्त एसाव के उस समय निकट आते रहने की क्रिया दर्शाता है।
- source_word: וְעִמּוֹ אַרְבַּע מֵאוֹת אִישׁ
  choice: और उसके साथ चार सौ पुरुष थे
  rationale: साथ आए बड़े पुरुष-समूह को स्पष्ट और स्रोत के निकट रूप में व्यक्त करता है।
- source_word: וַיַּחַץ
  choice: बाँट दिया
  rationale: बच्चों को अलग-अलग स्त्रियों के साथ समूहित करने की क्रिया के लिए स्वाभाविक हिन्दी।
- source_word: הַיְלָדִים
  choice: बच्चों
  rationale: याकूब के घराने के बालकों के लिए सामान्य और स्पष्ट हिन्दी शब्द।
- source_word: עַל לֵאָה וְעַל רָחֵל וְעַל שְׁתֵּי הַשְּׁפָחוֹת
  choice: लिआ, राहेल और दोनों दासियों के बीच
  rationale: बार-बार आए עַל का आशय बच्चों को इन स्त्रियों के अनुसार समूहों में बाँटना है। ‘के बीच’ हिन्दी में यह वितरण स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘आँखें उठाकर देखा’ मूल हिब्रू की अभिव्यक्ति को बनाए रखता है, जबकि ‘देखा कि’ וְהִנֵּה की भूमिका को स्वाभाविक हिन्दी वाक्य-विन्यास में समाहित करता है।
