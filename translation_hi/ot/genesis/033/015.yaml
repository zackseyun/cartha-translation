base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/015.yaml
  text: Then Esau said, “Please let me leave with you some of the people who are with me.” But he said, “Why is this? Let me find favor in the eyes of my lord.”
translation:
  language: hi
  text: तब एसाव ने कहा, “कृपया मैं अपने साथ के लोगों में से कुछ को तुम्हारे साथ छोड़ जाऊँ।” लेकिन याकूब ने कहा, “इसकी क्या आवश्यकता है? मैं अपने प्रभु की दृष्टि में अनुग्रह पाऊँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַצִּיגָה נָּא
  choice: मुझे ... छोड़ जाने दो
  rationale: हिफ़ील रूप यहाँ एसाव द्वारा अपने लोगों में से कुछ को याकूब के पास ठहराने या छोड़ने का प्रस्ताव व्यक्त करता है; נָא अनुरोध को विनम्र बनाता है।
- source_word: מִן הָעָם אֲשֶׁר אִתִּי
  choice: अपने साथ के कुछ लोगों को
  rationale: מִן का आंशिक अर्थ ‘में से कुछ’ है; सहज हिन्दी में इसे ‘कुछ लोगों’ से स्पष्ट किया गया है।
- source_word: לָמָּה זֶּה
  choice: इसकी क्या आवश्यकता है?
  rationale: शाब्दिक ‘यह क्यों?’ प्रसंग में प्रस्ताव को विनम्रतापूर्वक अस्वीकार करने वाला प्रश्न है; यह हिन्दी अभिव्यक्ति उसी आशय को स्वाभाविक ढंग से रखती है।
- source_word: אֶמְצָא חֵן בְּעֵינֵי אֲדֹנִי
  choice: बस मुझ पर मेरे प्रभु की कृपादृष्टि बनी रहे
  rationale: मुहावरे का अर्थ अनुग्रह या स्वीकृति पाना है। ‘कृपादृष्टि’ עֵינֵי की दृष्टि-छवि को हिन्दी में बनाए रखती है, और प्रसंग में याकूब एसाव को आदरसूचक ‘मेरे प्रभु’ कहता है।
theological_decisions:
- issue: ‘मेरे प्रभु’ का संदर्भ
  choice: मानवीय आदरसूचक संबोधन के रूप में ‘मेरे प्रभु’
  alternative: परमेश्वर के लिए धार्मिक उपाधि
  rationale: निकटवर्ती संवाद और उत्पत्ति 33 का प्रसंग स्पष्ट करता है कि याकूब एसाव को संबोधित कर रहा है; यहाँ אֲדֹנִי मानवीय सम्मानसूचक है।
- issue: अंतिम वाक्य का बल
  choice: एसाव की कृपादृष्टि को पर्याप्त मानने वाला विनम्र अस्वीकार
  alternative: भविष्य में अनुग्रह पाने की स्वतंत्र प्रार्थना
  rationale: ‘इसकी क्या आवश्यकता है?’ के बाद वाक्य प्रस्तावित सुरक्षा-दल को अस्वीकार करते हुए संबंधगत सद्भाव को पर्याप्त बताता है; फिर भी मूल की इच्छा-सूचक अभिव्यक्ति को ‘बनी रहे’ में रखा गया है।
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और बोलचाल में स्वाभाविक हिन्दी। ‘तुम्हारे पास’ दल को याकूब के साथ/उसकी सेवा में छोड़ने का अर्थ देता है; ‘कृपादृष्टि’ मूल मुहावरे की दृष्टि-छवि और गरिमा दोनों बनाए रखता है।
