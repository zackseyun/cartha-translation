source:
  edition: WLC
  text: יַעֲבָר נָ֥א אֲדֹנִ֖/י לִ/פְנֵ֣י עַבְדּ֑/וֹ וַ/אֲנִ֞י אֶֽתְנָהֲלָ֣ה לְ/אִטִּ֗/י לְ/רֶ֨גֶל הַ/מְּלָאכָ֤ה אֲשֶׁר לְ/פָנַ/י֙ וּ/לְ/רֶ֣גֶל הַ/יְלָדִ֔ים עַ֛ד אֲשֶׁר אָבֹ֥א אֶל אֲדֹנִ֖/י שֵׂעִֽירָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/014.yaml
  text: Please let my lord pass on ahead of his servant[a], and I will proceed slowly, at the pace of the livestock that is before me and at the pace of the children[c][b], until I come to my lord at Seir.
translation:
  language: hi
  text: मेरे प्रभु, कृपया अपने सेवक से आगे बढ़ जाएँ, और मैं अपने आगे चल रहे पशुधन और बच्चों की चाल के अनुसार धीरे-धीरे आगे बढ़ता रहूँगा, जब तक कि मैं सेईर में अपने प्रभु के पास न पहुँच जाऊँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעֲבָר נָא
  choice: कृपया ... आगे निकल जाएँ
  rationale: काल जुसिव के साथ נָא विनम्र अनुरोध व्यक्त करता है; यह अनुवाद आदर और आगे जाने की दिशा दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: אֲדֹנִי
  choice: मेरे प्रभु
  rationale: याकूब एसाव को आदरपूर्वक संबोधित करता है। ‘मेरे प्रभु’ बार-बार आने वाले सामाजिक विनयभाव को बनाए रखता है; यहाँ इसका अर्थ ईश्वरीय उपाधि नहीं है।
- source_word: לִפְנֵי עַבְדּוֹ
  choice: अपने सेवक से आगे
  rationale: शाब्दिक अर्थ ‘अपने सेवक के आगे’ है; सन्दर्भ में एसाव के याकूब से आगे जाने की बात है। तृतीय पुरुष में आत्म-संदर्भ भी सुरक्षित है।
- source_word: אֶתְנָהֲלָה לְאִטִּי
  choice: मैं ... धीरे-धीरे चलता रहूँगा
  rationale: हित्वपेल क्रिया सावधानी से आगे बढ़ने या दल को सँभालते हुए चलने का भाव दे सकती है। हिन्दी में यह वाक्य उस अर्थ को स्वाभाविक रूप से व्यक्त करता है, बिना स्पष्ट रूप से ‘हाँकने’ का अर्थ जोड़ने के।
- source_word: לְרֶגֶל
  choice: चाल के अनुसार
  rationale: ‘पैर के अनुसार’ वाला इब्रानी मुहावरा दूसरों की गति के अनुरूप चलने को दर्शाता है; ‘चाल के अनुसार’ पशुओं और बच्चों दोनों के साथ सहज है।
- source_word: הַמְּלָאכָה
  choice: पशुओं
  rationale: इस शब्द का सामान्य अर्थ ‘काम’, ‘सम्पत्ति’ या ‘साज-सामान’ हो सकता है, पर चरवाही के इस सन्दर्भ में यह याकूब के साथ चल रहे पशुधन को सूचित करता है।
- source_word: הַיְלָדִים
  choice: बच्चों
  rationale: यह याकूब के साथ यात्रा कर रहे बच्चों के लिए सामान्य और स्वाभाविक आधुनिक हिन्दी शब्द है।
- source_word: עַד אֲשֶׁר אָבֹא אֶל אֲדֹנִי שֵׂעִירָה
  choice: जब तक कि मैं सेईर में अपने प्रभु के पास न आ पहुँचूँ
  rationale: गन्तव्यसूचक ה और אֶל मिलकर सेईर की ओर आगमन बताते हैं। हिन्दी में ‘सेईर में ... के पास’ गन्तव्य और एसाव तक पहुँचने, दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: אֲדֹנִי का आशय
  choice: सामाजिक आदरसूचक ‘मेरे प्रभु’
  alternative: ‘स्वामी’ या ‘मालिक’
  rationale: यहाँ संबोधन एसाव के लिए है; अनुवाद याकूब की विनम्रता बनाए रखता है, पर इसे परमेश्वर के लिए प्रयुक्त उपाधि के रूप में नहीं समझाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सहज रखी गई है। याकूब का तृतीय पुरुष वाला विनीत आत्म-संदर्भ ‘अपने सेवक’ के रूप में सुरक्षित है। इब्रानी की सम्भावित अस्पष्टता को अत्यधिक व्याख्यात्मक ‘पशुओं को हाँकते हुए’ जैसे शब्दों से नहीं बाँधा गया है।
