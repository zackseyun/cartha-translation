source:
  edition: WLC
  text: קַח נָ֤א אֶת בִּרְכָתִ/י֙ אֲשֶׁ֣ר הֻבָ֣את לָ֔/ךְ כִּֽי חַנַּ֥/נִי אֱלֹהִ֖ים וְ/כִ֣י יֶשׁ לִ/י כֹ֑ל וַ/יִּפְצַר בּ֖/וֹ וַ/יִּקָּֽח־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/011.yaml
  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: hi
  text: कृपया मेरी भेंट स्वीकार कर लीजिए, जो आपके पास लाई गई है, क्योंकि परमेश्वर ने मुझ पर अनुग्रह किया है और मेरे पास सब कुछ है। उसने उससे बहुत आग्रह किया, और उसने उसे स्वीकार कर लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְכָתִי
  choice: मेरी यह भेंट
  rationale: शाब्दिक अर्थ ‘मेरा आशीर्वाद’ है, पर इस प्रसंग में यह एसाव को दी जा रही वस्तुगत भेंट को सूचित करता है; स्वाभाविक हिन्दी में ‘भेंट’ अभिप्रेत अर्थ स्पष्ट करती है।
- source_word: חַנַּנִי אֱלֹהִים
  choice: परमेश्वर ने मुझ पर अनुग्रह किया है
  rationale: חנן के कृपापूर्वक व्यवहार करने के भाव और पूर्ण क्रिया के परिणाम को बनाए रखता है।
- source_word: יֶשׁ לִי כֹל
  choice: मेरे पास सब कुछ है
  rationale: मूल के व्यापक और संभवतः अलंकारिक कथन को बिना ‘पर्याप्त’ बनाकर सीमित किए सुरक्षित रखता है।
- source_word: וַיִּפְצַר בּוֹ
  choice: वह उससे बहुत आग्रह करता रहा
  rationale: क्रिया में प्रबल अथवा लगातार आग्रह का भाव है; सर्वनामों को मूल की तरह नामों से नहीं बदला गया।
- source_word: וַיִּקָּח
  choice: तब उसने उसे स्वीकार कर लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर भेंट के प्रसंग में हिन्दी में ‘स्वीकार कर लिया’ स्वाभाविक है; कर्म संदर्भ से भेंट है।
theological_decisions:
- issue: בִּרְכָתִי का ‘आशीर्वाद’ या ‘भेंट’ अनुवाद
  choice: भेंट
  alternative: आशीर्वाद
  rationale: निकटवर्ती प्रसंग में पशुओं की भेंट सामने है; ‘भेंट’ यहाँ शब्द का संदर्भगत अर्थ देता है, बिना किसी विशेष धार्मिक सिद्धांत को आरोपित किए।
- issue: כֹל की व्यापकता
  choice: सब कुछ
  alternative: बहुत है / पर्याप्त है
  rationale: मूल का ‘सब’ वाला प्रबल कथन और एसाव के पूर्व कथन ‘मेरे पास बहुत है’ से उसका संभावित अंतर सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विनम्र आग्रह के लिए ‘कृपया’ और आदरसूचक ‘स्वीकार कर लीजिए’ प्रयुक्त हैं। शैली सहज, गरिमापूर्ण और कथात्मक है।
