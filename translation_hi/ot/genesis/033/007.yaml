base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/007.yaml
  text: Leah also came near[a], and her children, and they bowed down. Afterward Joseph and Rachel came near[b], and they bowed down.
translation:
  language: hi
  text: फिर लिआ भी अपने बच्चों के साथ पास आई[a], और उन्होंने झुककर प्रणाम किया[b]। उसके बाद यूसुफ और राहेल पास आए, और उन्होंने झुककर प्रणाम किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आगे आई”; दूसरी जगह “आगे आए”।
    reason: lexical_alternative
  - marker: b
    text: या “दंडवत किया”; इब्रानी क्रिया गहरा आदर दिखाने के लिए भूमि तक झुकने का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשׁ / נִגַּשׁ
  choice: पास आई / पास आए
  rationale: नגשׁ निकट आने या आगे बढ़कर पास पहुँचने को दर्शाता है। हिंदी में ‘पास आना’ स्वाभाविक है और एसाव की ओर बढ़ने की गति को बिना अतिरिक्त अर्थ जोड़े बनाए रखता है।
- source_word: גַּם
  choice: भी
  rationale: यह पिछले समूहों के बाद लिआ और उसके बच्चों की प्रस्तुति को क्रम में जोड़ता है।
- source_word: וִילָדֶיהָ
  choice: अपने बच्चों के साथ
  rationale: יְלָדִים व्यापक रूप से बच्चों को दर्शाता है, केवल पुत्रों को नहीं। ‘अपने बच्चों के साथ’ हिंदी में स्वाभाविक रूप से वही सहभागी समूह व्यक्त करता है।
- source_word: וַיִּשְׁתַּחֲוּ
  choice: उन्होंने झुककर प्रणाम किया
  rationale: שׁחה का यह रूप आदरपूर्वक झुकने या दंडवत होने की क्रिया बताता है। ‘झुककर प्रणाम किया’ आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है, पर शरीर की निश्चित मुद्रा को अनावश्यक रूप से तय नहीं करता।
- source_word: וְאַחַר
  choice: उसके बाद
  rationale: यह जुलूस में अगले समूह के आने का कालक्रम स्पष्ट करता है।
- source_word: יוֹסֵף וְרָחֵל
  choice: यूसुफ और राहेल
  rationale: मूल इब्रानी के नाम-क्रम को सुरक्षित रखा गया है।
