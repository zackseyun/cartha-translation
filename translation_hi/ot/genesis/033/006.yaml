  text: Then the female servants and their children came near and bowed down[a][b][c][d].
translation:
  language: hi
  text: तब दासियाँ और उनके बच्चे पास आए और दण्डवत किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּגַּשְׁןָ
  choice: पास आईं
  rationale: נגשׁ का यह क्रमिक कथात्मक रूप निकट आने की क्रिया बताता है। ‘पास आईं’ स्वाभाविक आधुनिक हिन्दी है और एसाव की ओर बढ़ने का भाव बनाए रखता है।
- source_word: הַשְּׁפָחוֹת
  choice: दासियाँ
  rationale: שִׁפְחָה स्त्री दास या सेविका को सूचित करता है। ‘दासियाँ’ संक्षिप्त और स्पष्ट है तथा मूल में निहित स्त्रीलिंग और अधीन सामाजिक स्थिति दोनों को व्यक्त करता है।
- source_word: הֵנָּה וְיַלְדֵיהֶן
  choice: अपने बच्चों के साथ
  rationale: स्वतंत्र सर्वनाम הֵנָּה और ‘उनके बच्चे’ मिलकर दासियों तथा उनके बच्चों को एक साथ क्रिया करते दिखाते हैं। हिन्दी में ‘अपने बच्चों के साथ’ इसी संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: उन्होंने दण्डवत किया
  rationale: यह क्रिया आदर में बहुत नीचे झुकने या भूमि तक झुककर प्रणाम करने को दर्शाती है। ‘दण्डवत किया’ इस शारीरिक सम्मान-भंगिमा को सामान्य ‘झुकीं’ से अधिक स्पष्ट रूप में व्यक्त करता है।
