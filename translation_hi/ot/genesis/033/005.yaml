base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/005.yaml
  text: He lifted up his eyes and saw the women and the children[a], and he said, “Who are these with you?” And he said[b], “The children whom God has graciously given to your servant.”
translation:
  language: hi
  text: उसने आँखें उठाकर स्त्रियों और बच्चों को देखा और पूछा, “ये तुम्हारे साथ कौन हैं?”[a] उसने उत्तर दिया, “ये वे बच्चे हैं जिन्हें परमेश्वर ने आपके सेवक को कृपापूर्वक दिया है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये तुम्हारे कौन लगते हैं?” इब्रानी अभिव्यक्ति शाब्दिक रूप से “ये तुम्हारे लिए/तुम्हारे क्या हैं?” के निकट है और यहाँ साथ आए लोगों की पहचान या संबंध पूछती है।
    reason: lexical_alternative
  - marker: b
    text: या केवल, “ये वे बच्चे हैं जिन्हें परमेश्वर ने आपके सेवक को दिया है।” इब्रानी क्रिया में कृपा या अनुग्रह दिखाने का भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  choice: उसने आँखें उठाकर
  rationale: इब्रानी मुहावरे की कथात्मक छटा बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक और स्पष्ट अभिव्यक्ति।
- source_word: הַנָּשִׁים
  choice: स्त्रियों
  rationale: मूल शब्द का सामान्य अर्थ ‘स्त्रियाँ’ है; संदर्भ के आधार पर ‘पत्नियाँ’ कहकर संबंध को अधिक विशिष्ट नहीं किया गया।
- source_word: הַיְלָדִים
  choice: बच्चों
  rationale: दोनों प्रयोगों में संदर्भानुकूल, सामान्य और सहज हिन्दी रूप।
- source_word: מִי אֵלֶּה לָּךְ
  choice: ये तुम्हारे साथ कौन हैं?
  rationale: शाब्दिक रचना ‘ये तुम्हारे लिए/तुम्हारे क्या हैं?’ है, पर संदर्भ में साथ आए लोगों की पहचान पूछी जा रही है; मुख्य पाठ में स्वाभाविक हिन्दी रखी गई और शाब्दिक संभावना पाद-टिप्पणी में दी गई।
- source_word: חָנַן
  choice: कृपापूर्वक दिया है
  rationale: क्रिया में अनुग्रह या कृपा दिखाने का भाव निहित है; यह चयन उस भाव को केवल ‘दिया’ की अपेक्षा अधिक स्पष्ट रूप से बचाता है।
- source_word: עַבְדֶּךָ
  choice: आपके सेवक
  rationale: यह एसाव के सामने याकूब का आदरसूचक आत्म-संदर्भ है; ‘सेवक’ सामाजिक विनम्रता को ‘दास’ की अपेक्षा अधिक उपयुक्त ढंग से व्यक्त करता है।
theological_decisions:
- issue: संतानों के दिए जाने में परमेश्वर की कृपा का भाव
  choice: परमेश्वर ने कृपापूर्वक दिया है
  alternative: परमेश्वर ने दिया है
  rationale: חָנַן में कृपा या अनुग्रह करने का अर्थ है। अनुवाद इस अर्थ-छाया को सुरक्षित रखता है, पर उससे आगे कोई विशिष्ट धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। एसाव के प्रश्न में ‘तुम्हारे’ और याकूब के विनम्र उत्तर में ‘आपके सेवक’ का प्रयोग संवाद में निहित सामाजिक असमानता और आदर को व्यक्त करता है।
