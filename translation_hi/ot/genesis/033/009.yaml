  yaml_path: translation/ot/genesis/033/009.yaml
  text: But Esau said[a], “I have plenty, my brother; let what is yours be yours.”
translation:
  language: hi
  text: पर एसाव ने कहा[a], “मेरे पास बहुत है, मेरे भाई। जो तेरा है, वह तेरा ही रहे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब एसाव ने कहा, ‘मेरे पास पर्याप्त है, मेरे भाई। जो तेरा है, वह तेरा ही रहे।’”
    reason: शब्दार्थ और संयोजक के सम्भव वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; यहाँ एसाव याकूब की भेंट को विनम्रता से अस्वीकार करता है, इसलिए संदर्भगत हल्के विरोध को व्यक्त करने के लिए ‘पर’ स्वाभाविक है।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: יֶשׁ לִי רָב
  choice: मेरे पास बहुत है
  rationale: इब्रानी स्वामित्व-सूचक मुहावरे और רָב के ‘बहुत/प्रचुर’ अर्थ को सरल, स्वाभाविक हिन्दी में रखता है; ‘पर्याप्त’ भी संदर्भानुसार सम्भव है, पर वह प्रचुरता से अधिक पर्याप्तता पर बल देता है।
- source_word: אָחִי
  choice: मेरे भाई
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित सम्बोधन संबंध की आत्मीयता को बनाए रखता है।
- source_word: יְהִי לְךָ אֲשֶׁר לָךְ
  choice: जो तेरा है, वह तेरा ही रहे
  rationale: जुसिव रूप यहाँ विनम्र अनुमति अथवा आग्रह व्यक्त करता है कि याकूब अपनी वस्तुएँ अपने पास रखे; ‘ही रहे’ वर्तमान स्वामित्व और उसे बनाए रखने के संदर्भगत भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
