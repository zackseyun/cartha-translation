reference: Genesis 33:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב אַל נָא֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וְ/לָקַחְתָּ֥ מִנְחָתִ֖/י מִ/יָּדִ֑/י כִּ֣י עַל כֵּ֞ן רָאִ֣יתִי פָנֶ֗י/ךָ כִּ/רְאֹ֛ת פְּנֵ֥י אֱלֹהִ֖ים וַ/תִּרְצֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/010.yaml
  text: Jacob said[a], “No, please. If I have found favor in your eyes, then take my gift from my hand, because seeing your face is like seeing the face of God[c][b], and you have received me favorably.”
translation:
  language: hi
  text: याकूब ने कहा, “नहीं, कृपा करके। यदि मैंने तेरी दृष्टि में कृपा पाई है, तो मेरे हाथ से मेरी भेंट[a] स्वीकार कर; क्योंकि मैंने तेरा मुख देखा है—मानो परमेश्वर का मुख[c] देखा हो—और तू मुझसे प्रसन्न हुआ है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा उपहार।” इब्रानी शब्द מִנְחָה का अर्थ भेंट, उपहार, कर या अर्पण हो सकता है; यहाँ इसका आशय एसाव को मनाने के लिए याकूब द्वारा दी गई भेंट से है।
    reason: lexical_alternative
  - marker: b
    text: या “तूने मुझे अनुकूलता से स्वीकार किया है” या “तूने मुझे स्वीकार किया है।” इब्रानी क्रिया प्रसन्न होने और अनुकूलतापूर्वक स्वीकार करने का भाव व्यक्त करती है।
    reason: lexical_alternative
  - marker: c
    text: या संभवतः “किसी देवता का मुख”; पर इस संदर्भ में “परमेश्वर” अधिक उपयुक्त है, क्योंकि इससे ठीक पहले पनीएल में याकूब के परमेश्वर से साक्षात्कार का वर्णन है (उत्पत्ति 32:30)।
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן בְּעֵינֶיךָ
  choice: मुझ पर तेरी कृपादृष्टि हुई है
  rationale: यह हिन्दी में स्वाभाविक रूप से ‘तेरी दृष्टि में अनुग्रह पाने’ का भाव व्यक्त करता है और आँख/दृष्टि की मूल उपमा को भी बनाए रखता है।
- source_word: מִנְחָתִי
  choice: मेरी भेंट
  rationale: संदर्भ में यह एसाव को मनाने के लिए दिया गया उपहार है। ‘भेंट’ इस व्यक्तिगत उपहार के लिए उपयुक्त है और अनावश्यक रूप से धार्मिक बलिदान का अर्थ नहीं देता।
- source_word: מִיָּדִי
  choice: मेरे हाथ से
  rationale: मूल पाठ की ठोस अभिव्यक्ति को सुरक्षित रखता है और हिन्दी में सहज है।
- source_word: כִּי עַל־כֵּן
  choice: क्योंकि
  rationale: यहाँ पदबंध याकूब के आग्रह का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: רָאִיתִי פָנֶיךָ כִּרְאֹת פְּנֵי אֱלֹהִים
  choice: मैंने तेरा मुख ऐसे देखा है, जैसे परमेश्वर का मुख देखा जाता है
  rationale: मूल तुलना तथा ‘मुख देखने’ की पुनरावृत्ति को बनाए रखते हुए हिन्दी वाक्य को स्वाभाविक रखा गया है।
- source_word: וַתִּרְצֵנִי
  choice: तूने मुझे प्रसन्न होकर स्वीकार किया है
  rationale: क्रिया में अनुकूलता, प्रसन्नता और स्वीकार किए जाने—तीनों का भाव है; यह अनुवाद उस संबंधपरक स्वागत को व्यक्त करता है।
- source_word: אַל נָא אִם נָא
  choice: नहीं, कृपा करके ऐसा न कर। यदि
  rationale: यह एसाव की पिछली बात का विनम्र किंतु आग्रहपूर्ण निषेध है और उसके बाद याकूब की विनती की शर्त आरम्भ होती है।
theological_decisions:
- issue: אֱלֹהִים का अभिप्राय
  choice: परमेश्वर
  alternative: किसी देवता
  rationale: निकटवर्ती कथा, विशेषकर पनीएल में याकूब द्वारा परमेश्वर का मुख देखने की बात (उत्पत्ति 32:30), एकवचन ‘परमेश्वर’ का प्रबल समर्थन करती है। फिर भी संभावित व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और कथात्मक शैली अपनाई गई है। प्राचीन संबंधपरक संवाद के अनुरूप एकवचन ‘तू/तेरा’ रखा गया है। मूल पाठ की ‘हाथ’ और ‘मुख’ संबंधी ठोस उपमाएँ सुरक्षित हैं।
