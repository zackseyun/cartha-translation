  yaml_path: translation/ot/genesis/033/002.yaml
  text: And he put the female servants and their children first[a], and Leah and her children behind them, and Rachel and Joseph last.
translation:
  language: hi
  text: उसने दासियों[a] और उनके बच्चों को सबसे आगे रखा, उनके पीछे लिआ और उसके बच्चों को, और सबसे पीछे राहेल और यूसुफ को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सेविकाओं’; इब्रानी शब्द निम्न सामाजिक हैसियत वाली घरेलू महिला सेविकाओं को दर्शा सकता है और कुछ प्रसंगों में उसका अर्थ ‘दास स्त्रियाँ’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: उसने … रखा
  rationale: שׂוּם का सामान्य अर्थ ‘रखना/स्थान देना’ है; ‘रखा’ इस क्रमबद्ध व्यवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַשְּׁפָחוֹת
  choice: दासियों
  rationale: שִׁפְחָה निम्न सामाजिक हैसियत वाली घरेलू स्त्री-दास या सेविका को दर्शाता है। ‘दासियों’ स्रोत में निहित अधीन हैसियत को बनाए रखता है; वैकल्पिक शब्द फुटनोट में दिया गया है।
- source_word: יַלְדֵיהֶן
  choice: उनके बच्चों
  rationale: יֶלֶד यहाँ लिंग-विशेष के बिना संतानों के लिए है, इसलिए ‘बच्चों’ उपयुक्त है।
- source_word: רִאשֹׁנָה
  choice: सबसे आगे
  rationale: यह क्रियाविशेषणीय रूप व्यवस्था में पहले स्थान को दिखाता है; दृश्यात्मक प्रसंग में ‘सबसे आगे’ स्वाभाविक और सटीक है।
- source_word: לֵאָה
  choice: लिआ
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וִילָדֶיהָ
  choice: और उसके बच्चों को
  rationale: बहुवचन संज्ञा को व्यापक अर्थ में ‘बच्चों’ कहा गया है और कर्म-चिह्न ‘को’ हिन्दी वाक्य-संरचना के अनुसार जोड़ा गया है।
- source_word: אַחֲרֹנִים (first occurrence)
  choice: उनके पीछे
  rationale: तीन समूहों की व्यवस्था में यह पहले समूह के बाद वाली स्थिति बताता है, न कि अंतिम स्थान; ‘उनके पीछे’ स्थानिक क्रम स्पष्ट करता है।
- source_word: רָחֵל
  choice: राहेल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אַחֲרֹנִים (second occurrence)
  choice: सबसे पीछे
  rationale: अंतिम समूह के लिए यह पूरी व्यवस्था में सबसे पीछे का स्थान दर्शाता है।
