  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֨א פַרְעֹ֤ה אֶת רֹֽאשְׁ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/תָלָ֥ה אוֹתְ/ךָ֖ עַל עֵ֑ץ וְ/אָכַ֥ל הָ/ע֛וֹף אֶת בְּשָׂרְ/ךָ֖ מֵ/עָלֶֽי/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/019.yaml
  text: In three more days Pharaoh will lift up your head from upon you and hang you on a tree[b][a], and the birds will eat your flesh from upon you.
translation:
  language: hi
  text: तीन और दिनों में फ़िरौन तुम्हारा सिर उठा लेगा—तुम्हारे धड़ से अलग करके[a]—और तुम्हें पेड़ पर लटका देगा[b]; और पक्षी तुम्हारे शरीर पर से तुम्हारा मांस खाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक भाव है, “तुम्हारा सिर तुम पर से उठा लेगा।” यह प्याले पिलानेवाले के विषय में प्रयुक्त उसी अनुकूल अभिव्यक्ति पर भयावह शब्द-क्रीड़ा है; यहाँ आशय सिर को धड़ से अलग करने का है।
    reason: lexical_alternative
  - marker: b
    text: या “तुम्हें लकड़ी पर लटका देगा” अथवा “तुम्हें खंभे पर चढ़ा/बेध देगा”; इब्रानी में “पेड़ पर” है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: अब से तीन दिन के भीतर
  rationale: यह शेष समय की अवधि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; घटना तीन दिन बीतने पर होगी।
- source_word: יִשָּׂא ... אֶת רֹאשְׁךָ מֵעָלֶיךָ
  choice: तुम्हारा सिर तुम्हारे धड़ से उठा लेगा
  rationale: ‘उठा लेगा’ पद 13 के अनुकूल कथन की साहित्यिक प्रतिध्वनि बनाए रखता है, जबकि ‘धड़ से’ यहाँ के מֵעָלֶיךָ और मृत्यु-दंड के संदर्भ में सिर अलग किए जाने का भयावह अर्थ स्पष्ट करता है।
- source_word: וְתָלָה אוֹתְךָ עַל עֵץ
  choice: तुम्हें एक पेड़ पर लटका देगा
  rationale: תלה का सामान्य अर्थ ‘लटकाना’ और עֵץ का मूल अर्थ ‘पेड़/लकड़ी’ है। मुख्य पाठ में ‘पेड़’ रखकर मूल बिंब सुरक्षित है; संभावित दंड-विधि पादटिप्पणी में दी गई है।
- source_word: וְאָכַל הָעוֹף
  choice: पक्षी ... खाएँगे
  rationale: עוֹף सामूहिक एकवचन है; हिन्दी में इस प्रसंग में बहुवचन ‘पक्षी’ स्वाभाविक है। אכל के सीधे अर्थ के लिए ‘खाएँगे’ रखा गया है।
- source_word: אֶת בְּשָׂרְךָ מֵעָלֶיךָ
  choice: तुम्हारे शरीर पर से तुम्हारा मांस खाएँगे
  rationale: ‘मांस’ בשר की ठोस और कठोर छवि बनाए रखता है। ‘शरीर पर से’ पुनरुक्त מֵעָלֶיךָ को अर्थपूर्ण हिन्दी में व्यक्त करता है और लटके हुए शव से मांस खाए जाने का दृश्य सुरक्षित रखता है।
theological_decisions:
- issue: मृत्यु-दंड की छवि और पिछले पद के साथ शब्द-क्रीड़ा को बिना नरम किए प्रस्तुत करना
  choice: ‘सिर ... उठा लेगा’ की प्रतिध्वनि बनाए रखते हुए ‘धड़ से’ द्वारा यहाँ का घातक अर्थ स्पष्ट किया गया है।
  alternative: ‘फ़िरौन तुम्हारा सिर काट देगा और तुम्हारे शव को खंभे पर टाँग देगा।’
  rationale: वैकल्पिक रूप घटना को पूरी तरह स्पष्ट करता है, पर इब्रानी की जानबूझकर की गई विडंबनापूर्ण पुनरावृत्ति और עֵץ की व्यापक अर्थ-सीमा को समय से पहले निश्चित कर देता है। चुना हुआ रूप साहित्यिक तनाव तथा दंड की कठोरता दोनों रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘फ़िरौन’, ‘धड़’, ‘पेड़’ और ‘मांस’ सामान्य पाठक के लिए सहज हैं। मूल की कठोर दंड-छवि को नरम नहीं किया गया, और जहाँ अत्यधिक शाब्दिक हिन्दी अस्वाभाविक होती वहाँ पादटिप्पणी से मूल अभिव्यक्ति सुरक्षित की गई है।
