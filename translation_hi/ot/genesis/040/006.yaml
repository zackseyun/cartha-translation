  yaml_path: translation/ot/genesis/040/006.yaml
  text: Joseph came to them in the morning and saw them[a], and behold, they were troubled.
translation:
  language: hi
  text: सुबह यूसुफ उनके पास आया और उसने उन्हें देखा—वे उदास[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्याकुल,” “मुरझाए हुए” अथवा “खिन्न।” इब्रानी शब्द चेहरे पर दिखाई देने वाली अशांत या उदास दशा का वर्णन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: उनके पास आया
  rationale: यह वाक्यांश यूसुफ की उन कैदियों की ओर गति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘भीतर आया’ स्थान के बारे में अनावश्यक विशिष्टता जोड़ता।
- source_word: בַּבֹּקֶר
  choice: सुबह
  rationale: समय-सूचक इब्रानी पदबंध का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: וַיַּרְא אֹתָם
  choice: उसने उन्हें देखा
  rationale: ראה के प्रत्यक्ष कर्म सहित सामान्य दृष्टिगत अर्थ को सीधे बनाए रखता है।
- source_word: וְהִנָּם
  choice: —वे ... थे
  rationale: הִנֵּה का प्रस्तुतिकरण और यूसुफ द्वारा अचानक ध्यान दिए जाने का भाव हिन्दी में डैश के माध्यम से स्वाभाविक रूप से उभरता है; शाब्दिक ‘देखो’ यहाँ असहज होता।
- source_word: זֹעֲפִים
  choice: उदास
  rationale: संदर्भ में यह उनके चेहरे पर दिखाई देने वाली व्याकुल, बुझी हुई दशा बताता है। ‘उदास’ सहज हिन्दी है, जबकि व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
