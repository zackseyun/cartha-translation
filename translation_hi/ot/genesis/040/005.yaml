  choice: सपना देखा
  rationale: हिब्रू में सजातीय क्रिया और संज्ञा का प्रयोग है, पर हिन्दी में ‘सपना देखा’ इसका स्वाभाविक और अर्थपूर्ण रूप है।
- source_word: שְׁנֵיהֶם
  choice: उन दोनों ने
  rationale: द्विवचन का भाव स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: אִישׁ חֲלֹמוֹ
  choice: हर एक ने अपना-अपना सपना
  rationale: दोनों पुरुष अधिकारियों के अलग-अलग सपनों पर दिए गए वितरणात्मक बल को बनाए रखता है।
- source_word: בְּלַיְלָה אֶחָד
  choice: एक ही रात में
  rationale: शाब्दिक ‘एक रात में’ के साथ निहित समान रात का भाव हिन्दी में स्पष्ट करता है।
- source_word: אִישׁ כְּפִתְרוֹן חֲלֹמוֹ
  choice: हर सपने का अपना अर्थ था
  rationale: 'כְּ से व्यक्त अनुरूपता को स्वाभाविक हिन्दी में दर्शाता है: प्रत्येक सपना अपने विशिष्ट अर्थ से मेल खाता था।'
- source_word: הַמַּשְׁקֶה
  choice: पिलानेवाला
  rationale: राजा को पेय परोसने वाले अधिकारी का संक्षिप्त, प्रचलित बाइबिलीय हिन्दी पद है; इस पद में ‘प्रधान’ जोड़ना उचित नहीं क्योंकि वह यहाँ स्पष्ट नहीं है।
- source_word: הָאֹפֶה
  choice: पकानेवाला
  rationale: राजकीय भोजन/पकवान तैयार करने वाले अधिकारी के लिए सहज पद है; यहाँ स्रोत में ‘प्रधान’ नहीं जोड़ा गया।
- source_word: אֲשֶׁר לְמֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा के ... थे
  rationale: לְ द्वारा व्यक्त राजकीय संबंध या सेवा-संबंध को बिना दासत्व का अनावश्यक अर्थ जोड़े दर्शाता है।
- source_word: אֲסוּרִים
  choice: कैद थे
  rationale: אסר के बंदी बनाए जाने के अर्थ को कारागार-संदर्भ में सरल और सटीक रूप से व्यक्त करता है।
- source_word: בֵּית הַסֹּהַר
  choice: बंदीगृह
  rationale: ‘कैद का घर’ की संरचना और औपचारिक गरिमा को संक्षिप्त आधुनिक हिन्दी में रखता है।
theological_decisions:
- issue: क्या सपनों के अर्थ पहले से उनमें निहित होने की बात स्पष्ट की जाए
  choice: हर सपने का अपना अर्थ था
  alternative: हर एक ने ऐसा सपना देखा जिसका अर्थ उसके अनुरूप था
  rationale: हिब्रू वाक्यांश की अनुरूपता बनाए रखी गई है, पर यह नहीं बताया गया कि अर्थ किसने निर्धारित किया या स्वप्नदृष्टाओं को उस समय ज्ञात था।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘एक ही रात’ और ‘अपना-अपना’ स्रोत के वितरणात्मक बल को स्वाभाविक हिन्दी में रखते हैं। ‘पिलानेवाला’ और ‘पकानेवाला’ संदर्भानुकूल राजकीय पद हैं; ‘प्रधान’ स्रोत में न होने के कारण नहीं जोड़ा गया।
