  yaml_path: translation/ot/genesis/040/005.yaml
  text: And the two of them dreamed a dream[a], each man his own dream, in one night, each according to the interpretation of his dream—the cupbearer and the baker who belonged to the king of Egypt[d][c][b], who were confined in the prison house.
translation:
  language: hi
  text: मिस्र के राजा के प्याला परोसने वाले और रोटी पकाने वाले—जो बंदीगृह में कैद थे—उन दोनों ने एक ही रात में सपना देखा; हर एक ने अपना-अपना सपना देखा, और हर एक के सपने का अर्थ उसके अनुरूप था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर एक ने ऐसा सपना देखा जिसका अर्थ उसके अनुरूप था।” शाब्दिक रूप से, “हर एक अपने सपने के अर्थ के अनुसार।” हिब्रू वाक्यांश इस बात पर बल देता है कि प्रत्येक सपने का उससे मेल खाता अपना अलग अर्थ था।
    reason: lexical_alternative
lexical_decisions:
