  yaml_path: translation/ot/genesis/040/023.yaml
  text: But the chief cupbearer did not remember Joseph[a], but forgot him.
translation:
  language: hi
  text: पर मुख्य पिलानेवाले ने यूसुफ़ को याद नहीं रखा[a], बल्कि उसे भूल गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मुख्य पिलानेवाले ने यूसुफ़ को याद नहीं रखा, बल्कि उसे भूल गया।”
    reason: आरंभिक וְ को प्रसंगानुसार ‘पर’ या अधिक शाब्दिक ‘और’ समझा जा सकता है।
lexical_decisions:
- source_word: וְ/לֹא
  choice: पर ... नहीं
  rationale: वाव यहाँ पिछले घटनाक्रम के विपरीत मोड़ को चिह्नित करता है; आधुनिक हिन्दी में ‘पर’ इस विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: זָכַר
  choice: याद रखा
  rationale: मूल क्रिया का सामान्य अर्थ ‘याद रखना’ है। प्रसंग में यूसुफ़ के हित में कदम उठाना निहित हो सकता है, पर उसे स्पष्ट जोड़ना अनावश्यक व्याख्या होगी।
- source_word: שַׂר הַמַּשְׁקִים
  choice: मुख्य पिलानेवाला
  rationale: यह फ़िरौन के पेय-पान की सेवा से जुड़े उच्च दरबारी अधिकारी की उपाधि है। ‘मुख्य पिलानेवाला’ हिन्दी में भूमिका और पद, दोनों को संक्षेप में व्यक्त करता है।
- source_word: אֶת יוֹסֵף
  choice: यूसुफ़ को
  rationale: प्रत्यक्ष कर्मचिह्न אֶת का हिन्दी में ‘को’ से स्वाभाविक निरूपण होता है; नाम को प्रचलित हिन्दी बाइबलीय रूप में रखा गया है।
- source_word: וַיִּשְׁכָּחֵהוּ
  choice: बल्कि उसे भूल गया
  rationale: क्रिया का अर्थ ‘भूल जाना’ है और प्रत्यय यूसुफ़ की ओर संकेत करता है। ‘बल्कि’ पहले निषेध के बाद इस पुनरुक्ति के जोर को स्वाभाविक हिन्दी में बनाए रखता है।
