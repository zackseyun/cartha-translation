translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथा-शैली। ‘पिलानेवालों के प्रधान’ को निकटवर्ती पद-संदर्भ और सामान्य पाठक की समझ के लिए रखा गया है। הִנֵּה का प्रभाव पुरातन ‘देखो’ के बजाय स्वप्न-वर्णन में स्वाभाविक ‘मैंने देखा कि’ से व्यक्त किया गया है।
