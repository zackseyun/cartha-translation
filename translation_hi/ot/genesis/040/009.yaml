  yaml_path: translation/ot/genesis/040/009.yaml
  text: So the chief cupbearer told his dream to Joseph and said to him[a], “In my dream, behold, a vine was before me.”
translation:
  language: hi
  text: तब मुख्य पिलानेवाले ने अपना सपना यूसुफ को सुनाया और उससे कहा, “मेरे सपने में, देखो, मेरे सामने अंगूर की एक बेल थी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: सुनाया
  rationale: पिएल रूप का अर्थ किसी बात या अनुभव को क्रम से बताना है; ‘सपना सुनाया’ स्वाभाविक आधुनिक हिन्दी प्रयोग है।
- source_word: שַׂר הַמַּשְׁקִים
  choice: पिलानेवालों के प्रधान
  rationale: यह फिरौन को पेय परोसने वाले अधिकारियों के मुखिया का पद है। यह अनुवाद पद और कार्य दोनों को स्पष्ट रखता है।
- source_word: אֶת חֲלֹמוֹ
  choice: अपना सपना
  rationale: हिन्दी में कर्ता से संबंधित वस्तु के लिए ‘अपना’ स्वाभाविक है और इब्रानी के तृतीय पुरुष एकवचन प्रत्यय का सही अर्थ देता है।
- source_word: לְיוֹסֵף
  choice: यूसुफ को
  rationale: לְ यहाँ कथन के प्राप्तकर्ता को चिह्नित करता है; नाम का मानक हिन्दी रूप ‘यूसुफ’ है।
- source_word: וַיֹּאמֶר לוֹ
  choice: और उससे कहा
  rationale: इब्रानी में ‘उससे/उसको’ स्पष्ट रूप से उपस्थित है, इसलिए उसे बनाए रखा गया है।
- source_word: בַּחֲלוֹמִי
  choice: अपने सपने में
  rationale: यह स्वाभाविक हिन्दी में स्वप्न-दृश्य का परिचय देता है।
- source_word: וְהִנֵּה
  choice: मैंने देखा कि
  rationale: הִנֵּה ध्यान आकृष्ट करके अचानक सामने आए दृश्य को जीवंत बनाता है; स्वप्न-वर्णन में ‘मैंने देखा कि’ आधुनिक हिन्दी में वही कथात्मक प्रभाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גֶפֶן
  choice: अंगूर की बेल
  rationale: संदर्भ में גֶפֶן अंगूर की लता है; केवल ‘बेल’ हिन्दी में अनिश्चित हो सकती है, इसलिए स्पष्ट प्राकृतिक समतुल्य चुना गया है।
- source_word: לְפָנָי
  choice: मेरे सामने
  rationale: यह इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी समतुल्य है; वाक्य की पूर्णता के लिए ‘थी’ जोड़ा गया है।
