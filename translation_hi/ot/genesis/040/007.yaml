  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी वाक्य के ‘कहते हुए’ (לֵאמֹר) को हिन्दी में अलग से व्यक्त नहीं किया गया, क्योंकि ‘पूछा’ के बाद सीधा कथन अधिक स्वाभाविक है और अर्थ पूर्णतः सुरक्षित रहता है।
