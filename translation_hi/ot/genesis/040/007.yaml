  text: וַ/יִּשְׁאַ֞ל אֶת סְרִיסֵ֣י פַרְעֹ֗ה אֲשֶׁ֨ר אִתּ֧/וֹ בְ/מִשְׁמַ֛ר בֵּ֥ית אֲדֹנָ֖י/ו לֵ/אמֹ֑ר מַדּ֛וּעַ פְּנֵי/כֶ֥ם רָעִ֖ים הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/007.yaml
  text: So he asked Pharaoh’s officials who were with him in custody in his master’s house[a], saying[b], “Why are your faces downcast today?”
translation:
  language: hi
  text: तब उसने फ़िरौन के उन अधिकारियों से, जो उसके साथ उसके स्वामी के घर में हिरासत में थे, पूछा, “आज तुम्हारे चेहरे उदास क्यों हैं?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अधिकारियों” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “नपुंसक” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: तब उसने ... पूछा
  rationale: वाव-क्रमिक क्रिया कथा को आगे बढ़ाती है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक क्रमबोध देता है।
- source_word: סְרִיסֵי פַרְעֹה
  choice: फ़िरौन के अधिकारी
  rationale: सָרִיס का अर्थ वास्तविक नपुंसक अथवा राजकीय अधिकारी हो सकता है; प्रसंग में पद प्रमुख है, इसलिए सामान्य अर्थ मुख्य पाठ में रखा गया और दूसरा अर्थ टिप्पणी में।
- source_word: אֲשֶׁר אִתּוֹ בְמִשְׁמַר
  choice: जो उसके साथ ... हिरासत में थे
  rationale: यह इब्रानी सर्वनाम और बंदी अवस्था दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בֵּית אֲדֹנָיו
  choice: उसके स्वामी के घर में
  rationale: प्रसंग में ‘उसका’ यूसुफ की ओर संकेत करता है; ‘स्वामी’ אָדוֹן का उपयुक्त सामाजिक-संदर्भगत अनुवाद है।
- source_word: פְּנֵיכֶם רָעִים
  choice: तुम्हारे चेहरे उदास
  rationale: शाब्दिक रूप से ‘तुम्हारे चेहरे बुरे’ एक मुहावरा है, जिसका आशय चेहरे पर उदासी या परेशानी दिखाई देना है।
- source_word: הַיּוֹם
  choice: आज
  rationale: समय-सूचक पद का सीधा और स्वाभाविक हिन्दी समतुल्य।
theological_decisions: []
