base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/002.yaml
  text: And Pharaoh was angry with his two officials[b][a], with the chief cupbearer and with the chief baker.
translation:
  language: hi
  text: और फ़िरौन अपने दो अधिकारियों[a] पर—पेय परोसनेवालों के प्रधान पर और सेंकनेवालों के प्रधान पर—क्रोधित हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने दो दरबारी अधिकारियों”; इब्रानी शब्द कुछ संदर्भों में “नपुंसक” अर्थ भी रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: क्रोधित हुआ
  rationale: קצף क्रोध को व्यक्त करता है। कथात्मक रूप के अनुरूप ‘क्रोधित हुआ’ स्वाभाविक है और क्रोध की तीव्रता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि के लिए प्रचलित मानक हिन्दी रूप।
- source_word: שְׁנֵי סָרִיסָיו
  choice: अपने दो अधिकारियों[a]
  rationale: סָרִיס दरबारी अधिकारी को सूचित कर सकता है और कुछ प्रसंगों में नपुंसक को भी। यहाँ आगे बताए गए राजकीय पदों के कारण ‘अधिकारियों’ संदर्भानुकूल है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: שַׂר הַמַּשְׁקִים
  choice: पिलानेवालों के प्रधान
  rationale: שַׂר का अर्थ प्रधान और מַשְׁקִים का अर्थ पेय परोसने या पिलानेवाले लोग है। यह रूप समूहवाचक बहुवचन और उसके प्रधान, दोनों को स्पष्ट रूप से दर्शाता है।
- source_word: שַׂר הָאֹפִים
  choice: रसोइयों के प्रधान
  rationale: אָפָה मूलतः सेंकने या पकाने का काम करनेवाले को दर्शाता है। आधुनिक सामान्य हिन्दी में ‘रसोइयों के प्रधान’ पद का कार्य सहजता से बताता है; ‘नानबाइयों के प्रधान’ अधिक संकीर्ण विकल्प है।
- source_word: עַל ... עַל ... וְעַל
  choice: पर—... पर और ... पर
  rationale: क्रोध के लक्ष्य के साथ עַל को हिन्दी में ‘पर’ कहना स्वाभाविक है। पुनरावृत्ति मूल संरचना को बनाए रखती है और डैश यह स्पष्ट करता है कि बाद के दोनों पद उन्हीं दो अधिकारियों की पहचान हैं।
