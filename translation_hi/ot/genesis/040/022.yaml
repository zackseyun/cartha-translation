    text: या “लटका दिया।” इब्रानी क्रिया का अर्थ लटकाना है; कुछ प्रसंगों में इसे सूली पर चढ़ाने अथवा मृत्यु के बाद शव को सार्वजनिक रूप से लटकाकर प्रदर्शित करने के अर्थ में भी समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: परन्तु उसने
  rationale: 'वाव पिछले पद से विरोध दिखाता है: पिलानेवालों के प्रधान को बहाल किया गया, पर पकानेवालों के प्रधान को मार डाला गया। हिब्रू कर्मचिह्न אֵת का हिंदी में अलग अनुवाद नहीं होता।'
- source_word: שַׂר הָאֹפִים
  choice: प्रधान पकानेवाले
  rationale: שַׂר राजदरबार के अधिकारी या प्रधान को सूचित करता है; आधुनिक हिंदी में यह पदनाम स्वाभाविक और स्पष्ट है।
- source_word: תָּלָה
  choice: फाँसी पर लटका दिया
  rationale: मूल क्रिया का अर्थ लटकाना है और यहाँ दंडात्मक मृत्यु का प्रसंग है। यह अनुवाद विधि को आवश्यकता से अधिक निश्चित किए बिना सामान्य अर्थ देता है; वैकल्पिक ऐतिहासिक समझ पादटिप्पणी में रखी गई है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह घटना और यूसुफ द्वारा पहले बताए गए अर्थ के बीच सटीक अनुरूपता व्यक्त करता है।
- source_word: פָּתַר
  choice: अर्थ बताया था
  rationale: स्वप्न के प्रसंग में פתר का अर्थ व्याख्या करना है। हिंदी का पूर्वपूर्ण भूतकाल बताता है कि यूसुफ की व्याख्या घटना से पहले हुई थी।
- source_word: לָהֶם
  choice: उन दोनों के लिए
  rationale: बहुवचन सर्वनाम दोनों राजकीय अधिकारियों की ओर संकेत करता है; 'उन दोनों' हिंदी पाठक के लिए संदर्भ स्पष्ट करता है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: हिंदी बाइबल परंपरा में יוֹסֵף का प्रचलित और पहचाना जाने वाला रूप।
