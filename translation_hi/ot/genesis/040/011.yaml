  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। कथात्मक क्रम को छोटे, सहज वाक्य में व्यक्त किया गया है; कोई अनावश्यक आरंभिक कालसूचक या व्याख्यात्मक धर्मवैज्ञानिक तत्व नहीं जोड़ा गया।
