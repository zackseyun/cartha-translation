  text: וְ/כ֥וֹס פַּרְעֹ֖ה בְּ/יָדִ֑/י וָ/אֶקַּ֣ח אֶת הָֽ/עֲנָבִ֗ים וָֽ/אֶשְׂחַ֤ט אֹתָ/ם֙ אֶל כּ֣וֹס פַּרְעֹ֔ה וָ/אֶתֵּ֥ן אֶת הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/011.yaml
  text: Pharaoh’s cup was in my hand[a], and I took the grapes and squeezed them into Pharaoh’s cup[c][b], and I placed the cup into Pharaoh’s hand.
translation:
  language: hi
  text: फ़िरौन का प्याला मेरे हाथ में था। मैंने अंगूर लिए, उन्हें निचोड़कर उनका रस फ़िरौन के प्याले में डाला, और प्याला फ़िरौन के हाथ में रख दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כּוֹס
  choice: प्याला
  rationale: पीने के पात्र के लिए यह स्वाभाविक और प्रसंगानुकूल आधुनिक हिन्दी शब्द है।
- source_word: בְּיָדִי
  choice: मेरे हाथ में
  rationale: मूल की सजीव और सीधी अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וָאֶקַּח אֶת הָעֲנָבִים
  choice: मैंने अंगूर लिए
  rationale: कथात्मक क्रम में לקח का सरल और सीधा अर्थ व्यक्त करता है।
- source_word: וָאֶשְׂחַט אֹתָם אֶל כּוֹס פַּרְעֹה
  choice: उन्हें निचोड़कर उनका रस फ़िरौन के प्याले में डाला
  rationale: שׂחט यहाँ अंगूरों को दबाकर उनका तरल निकालने का बोध देता है; हिन्दी में केवल ‘उन्हें प्याले में निचोड़ा’ की अपेक्षा यह क्रिया और परिणति अधिक स्पष्ट तथा स्वाभाविक है।
- source_word: וָאֶתֵּן אֶת הַכּוֹס
  choice: प्याला … रख दिया
  rationale: נתן का मूल अर्थ ‘देना’ हो सकता है, पर अगले पदबंध के साथ यहाँ प्याला हाथ में रखने/सौंपने की ठोस क्रिया अभिप्रेत है।
- source_word: עַל כַּף פַּרְעֹה
  choice: फ़िरौन के हाथ में
  rationale: शाब्दिक रूप से ‘फ़िरौन की हथेली पर’; प्याला सौंपने के प्रसंग में ‘हाथ में’ स्वाभाविक हिन्दी मुहावरा है।
