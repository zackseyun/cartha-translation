  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। प्रत्यक्ष संबोधन में ‘तू/तेरा’ का प्रयोग प्राचीन कथा-संवाद और पदानुक्रम के अनुरूप है। इब्रानी मुहावरे को मुख्य पाठ में सुरक्षित रखकर उसका प्रसंगगत अर्थ पादटिप्पणी में स्पष्ट किया गया है।
