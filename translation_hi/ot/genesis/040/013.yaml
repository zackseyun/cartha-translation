  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֤א פַרְעֹה֙ אֶת רֹאשֶׁ֔/ךָ וַ/הֲשִֽׁיבְ/ךָ֖ עַל כַּנֶּ֑/ךָ וְ/נָתַתָּ֤ כוֹס פַּרְעֹה֙ בְּ/יָד֔/וֹ כַּ/מִּשְׁפָּט֙ הָֽ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיִ֖יתָ מַשְׁקֵֽ/הוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/013.yaml
  text: In three more days Pharaoh will lift up your head and restore you to your position[a], and you will place Pharaoh’s cup into his hand, according to the former custom when you were his cupbearer.
translation:
  language: hi
  text: अब से तीन दिन बाद फ़िरौन तेरा सिर उठाएगा[a] और तुझे तेरे पद पर फिर नियुक्त करेगा। और तू पहले की रीति के अनुसार फ़िरौन का प्याला उसके हाथ में देगा, जैसा तू पहले करता था, जब तू उसका प्याला परोसनेवाला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “तेरा सिर उठाएगा।” यहाँ यह मुहावरा अनुकूल पुनःस्थापना को सूचित करता है; यही शाब्दिक अभिव्यक्ति पद 19 में इसके विपरीत प्रयोग से भी संबंध बनाए रखती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: अब से तीन दिन बाद
  rationale: यह समय-सूचक पद आनेवाले तीन दिनों की शेष अवधि के बाद होनेवाली घटना बताता है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: יִשָּׂא ... אֶת רֹאשֶׁךָ
  choice: तेरा सिर उठाएगा
  rationale: इब्रानी मुहावरे का शाब्दिक रूप बनाए रखा गया है, क्योंकि आगे की पुनर्नियुक्ति इसका अनुकूल अर्थ स्पष्ट करती है और पद 19 के विरोधी प्रयोग से साहित्यिक संबंध भी बचा रहता है।
- source_word: וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  choice: तुझे तेरे पद पर फिर नियुक्त करेगा
  rationale: כֵּן यहाँ राजदरबार में स्थापित पद या स्थान को सूचित करता है। ‘पद पर फिर नियुक्त करेगा’ पुनःस्थापना का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְנָתַתָּ כוֹס פַּרְעֹה בְּיָדוֹ
  choice: फ़िरौन का प्याला उसके हाथ में देगा
  rationale: נתן के सामान्य अर्थ ‘देना/रखना’ में से ‘हाथ में देगा’ सेवक के ठोस कर्म और इब्रानी बिंब दोनों को स्वाभाविक ढंग से रखता है।
- source_word: כַּמִּשְׁפָּט הָרִאשׁוֹן
  choice: पहले की रीति के अनुसार
  rationale: מִשְׁפָּט यहाँ न्यायिक निर्णय नहीं, बल्कि पहले से स्थापित सेवा-रीति या प्रथा को दर्शाता है।
- source_word: אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  choice: जब तू उसका पिलानेहारा था
  rationale: מַשְׁקֶה राजकीय पिलानेहारे के पद को दर्शाता है। ‘पिलानेहारा’ संक्षिप्त, पारंपरिक रूप से बोधगम्य और प्रसंगानुकूल पदनाम है।
