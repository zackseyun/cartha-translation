  text: כִּֽי גֻנֹּ֣ב גֻּנַּ֔בְתִּי מֵ/אֶ֖רֶץ הָ/עִבְרִ֑ים וְ/גַם פֹּה֙ לֹא עָשִׂ֣יתִֽי מְא֔וּמָה כִּֽי שָׂמ֥וּ אֹתִ֖/י בַּ/בּֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/015.yaml
  text: For I was indeed kidnapped from the land of the Hebrews[b][a], and even here I have done nothing that they should put me in the pit.
translation:
  language: hi
  text: क्योंकि मुझे इब्रानियों के देश से सचमुच चुराकर ले जाया गया था[a], और यहाँ भी मैंने ऐसा कुछ नहीं किया कि वे मुझे इस गड्ढे[b] में डालें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मुझे निश्चय ही चुराया गया था।” इब्रानी में बल देने के लिए एक ही क्रिया का विशेष रूप और पूर्ण क्रिया साथ-साथ आए हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “गड्ढा” बंदीगृह या कालकोठरी के अर्थ में हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह यूसुफ द्वारा अपने अनुरोध का कारण बताने वाली व्याख्या आरम्भ करता है।
- source_word: גֻנֹּב גֻּנַּבְתִּי
  choice: मुझे सचमुच चुरा लाया गया था
  rationale: धातु के infinitive absolute और finite passive verb का मेल कथन पर बल देता है। ‘चुरा लाया गया’ मूल के ‘चुराने’ वाले रूपक को रखते हुए व्यक्ति के जबरन ले जाए जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵאֶרֶץ הָעִבְרִים
  choice: इब्रानियों के देश से
  rationale: जातीय पद עִבְרִים को बनाए रखता है और किसी अधिक निश्चित राजनीतिक भूभाग का अर्थ आरोपित नहीं करता।
- source_word: וְגַם פֹּה
  choice: और यहाँ भी
  rationale: मिस्र में भी यूसुफ की निर्दोषता के दावे का योगात्मक बल सुरक्षित रहता है।
- source_word: לֹא עָשִׂיתִי מְאוּמָה
  choice: मैंने ऐसा कुछ नहीं किया
  rationale: पूर्ण निषेध को स्वाभाविक हिन्दी में व्यक्त करता है और अगले परिणामसूचक कथन से सहजता से जुड़ता है।
- source_word: כִּי שָׂמוּ אֹתִי
  choice: कि वे मुझे ... में डालें
  rationale: यह उस कार्य या आधार का संकेत देता है जिसके कारण कारावास उचित होता; हिन्दी में संभावनार्थक ‘डालें’ अन्याय का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּבּוֹר
  choice: इस गड्ढे में
  rationale: בּוֹר का मूल ठोस बिंब ‘गड्ढा/कुण्ड’ बनाए रखता है; प्रसंग में यह बंदीगृह या कालकोठरी को सूचित कर सकता है।
