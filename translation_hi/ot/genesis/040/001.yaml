  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָֽטְא֛וּ מַשְׁקֵ֥ה מֶֽלֶךְ מִצְרַ֖יִם וְ/הָ/אֹפֶ֑ה לַ/אֲדֹנֵי/הֶ֖ם לְ/מֶ֥לֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/001.yaml
  text: After these things[a], the cupbearer of the king of Egypt and the baker sinned against their master, the king of Egypt.
translation:
  language: hi
  text: इन बातों के बाद[a], मिस्र के राजा के पिलानेवाले और रोटी पकानेवाले ने अपने स्वामी, मिस्र के राजा के विरुद्ध पाप किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन घटनाओं के बाद।” इब्रानी कथा-सूत्र का अधिक शब्दशः अनुवाद है, “और इन बातों के बाद ऐसा हुआ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: इन बातों के बाद
  rationale: यह इब्रानी कथा में समय और प्रसंग बदलने का सामान्य सूत्र है। यह अनुवाद मूल की संरचना बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: חָטְאוּ
  choice: पाप किया
  rationale: חטא का मूल अर्थ पाप या अपराध करना है; ל के साथ यह उस व्यक्ति को सूचित करता है जिसके विरुद्ध अपराध हुआ। ‘के विरुद्ध पाप किया’ नैतिक और संबंधपरक बल को सुरक्षित रखता है।
- source_word: מַשְׁקֵה
  choice: पिलानेवाले
  rationale: यह राजकीय पेय परोसने वाले अधिकारी को दर्शाता है। ‘पिलानेवाला’ सामान्य हिन्दी पाठक के लिए सहज है और इस पद में स्पष्ट न किए गए ‘प्रधान’ पद को नहीं जोड़ता।
- source_word: הָאֹפֶה
  choice: रोटी पकानेवाले
  rationale: निश्चित कृदन्त का अर्थ ‘पकानेवाला/नानबाई’ है। ‘रोटी पकानेवाला’ आधुनिक सामान्य हिन्दी में स्पष्ट है तथा अनावश्यक संबंधसूचक ‘उसके’ नहीं जोड़ता।
- source_word: לַאֲדֹנֵיהֶם
  choice: अपने स्वामी के विरुद्ध
  rationale: यहाँ אדון मानवीय अधिकारी अर्थात राजा के लिए है। ‘स्वामी’ दरबारी सेवक-संबंध को व्यक्त करता है और बहुवचन संबंधसूचक प्रत्यय को ‘अपने’ द्वारा दर्शाता है।
- source_word: לְמֶלֶךְ מִצְרָיִם
  choice: मिस्र के राजा
  rationale: यह समानाधिकरण पद ‘अपने स्वामी’ की पहचान स्पष्ट करता है। राजा का दोबारा उल्लेख मूल इब्रानी के जोर को बनाए रखता है।
theological_decisions:
- issue: חָטְאוּ के नैतिक बल का अनुवाद
  choice: पाप किया
  alternative: अपराध किया / दोषी ठहरे
  rationale: मूल क्रिया नैतिक अपराध का अर्थ रखती है। राजकीय संदर्भ के कारण इसे केवल प्रशासनिक ‘अपराध’ तक सीमित करना उचित नहीं; ‘पाप किया’ मूल की व्यापक नैतिक गंभीरता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘पिलानेवाला’ और ‘रोटी पकानेवाला’ सामान्य पाठकों के लिए पारदर्शी पद हैं; वाक्य में मूल इब्रानी की पुनरुक्ति और नैतिक बल सुरक्षित रखा गया है।
