base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/016.yaml
  text: When the chief baker saw that he had interpreted well[a], he said to Yoseph, “I also had a dream, and behold, three baskets of white bread were on my head.”
translation:
  language: hi
  text: जब रोटी बनानेवालों के प्रधान ने देखा कि योसेफ़ ने स्वप्न की अच्छी व्याख्या की थी, तो उसने योसेफ़ से कहा, “मैंने भी एक सपना देखा, और देखो, मेरे सिर पर सफ़ेद रोटी की तीन टोकरियाँ[a] थीं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पकी हुई वस्तुओं की तीन टोकरियाँ।” इब्रानी शब्द חֹרִי का अर्थ अनिश्चित है; यह टोकरियों में रखी सफ़ेद रोटी या केक का वर्णन कर सकता है, अथवा स्वयं टोकरियों को छिद्रदार या बुनी हुई बता सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הָאֹפִים
  choice: रोटी पकानेवालों का प्रधान
  rationale: यह पद अधिकारी और उसके कार्य—रोटी अथवा पकी हुई चीज़ें तैयार करने—दोनों को स्पष्ट करता है; ‘प्रधान’ שַׂר के पदसूचक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: כִּי טוֹב פָּתָר
  choice: कि उसने अच्छी तरह अर्थ बताया था
  rationale: यह अनुवाद योसेफ़ द्वारा सपने की व्याख्या किए जाने को व्यक्त करता है और טוֹב को केवल ‘अनुकूल’ अर्थ तक सीमित नहीं करता।
- source_word: אַף אֲנִי בַּחֲלוֹמִי
  choice: मैंने भी एक सपना देखा
  rationale: इब्रानी की संक्षिप्त, अंडाकार अभिव्यक्ति का स्वाभाविक हिन्दी रूप है; ‘भी’ पिछले स्वप्न-वृत्तांत से जुड़ाव बनाए रखता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह स्वप्न के दृश्य को सजीव ढंग से सामने लानेवाले संकेतक का सरल और वर्तमान हिन्दी रूप है।
- source_word: חֹרִי
  choice: सफ़ेद रोटी
  rationale: मुख्य पाठ में पारंपरिक और प्रसंगानुकूल अर्थ लिया गया है, पर शब्द की वास्तविक अनिश्चितता और टोकरियों से संबंधित वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עַל רֹאשִׁי
  choice: मेरे सिर पर
  rationale: यह स्थानसूचक वाक्यांश का सीधा, स्पष्ट और स्वाभाविक अनुवाद है।
- source_word: יוֹסֵף
  choice: योसेफ़
  rationale: यह इब्रानी नाम יוֹסֵף का देवनागरी में निकट और सहज लिप्यंतरण है।
