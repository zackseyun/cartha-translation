source:
  edition: WLC
  text: וַ֠/יִּפְקֹד שַׂ֣ר הַ/טַּבָּחִ֧ים אֶת יוֹסֵ֛ף אִתָּ֖/ם וַ/יְשָׁ֣רֶת אֹתָ֑/ם וַ/יִּהְי֥וּ יָמִ֖ים בְּ/מִשְׁמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/004.yaml
  text: So the captain of the guard assigned Joseph to them[a], and he attended them[b]; and they were in custody for some time.
translation:
  language: hi
  text: तब अंगरक्षकों के प्रधान ने यूसुफ को उनके लिए नियुक्त किया[a], और उसने उनकी सेवा की। वे कुछ समय तक हिरासत में रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘यूसुफ को उनके साथ नियुक्त किया’ या ‘यूसुफ को उन पर नियुक्त किया’ भी हो सकता है। इब्रानी क्रिया जिम्मेदारी सौंपने का अर्थ दे सकती है; इसलिए यूसुफ की भूमिका सेवा करने वाले अथवा उनकी देखरेख करने वाले के रूप में समझी जा सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘वे हिरासत में दिनों तक रहे’; यह इब्रानी मुहावरा किसी अवधि तक वहाँ रहने का भाव देता है।
    reason: idiom
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: नियुक्त किया
  rationale: यहाँ פקד किसी व्यक्ति को एक जिम्मेदारी सौंपने या किसी के संबंध में नियुक्त करने का भाव देता है। ‘नियुक्त किया’ आधुनिक हिन्दी में इस प्रशासनिक कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שַׂר הַטַּבָּחִים
  choice: अंगरक्षकों के प्रधान
  rationale: पदनाम का शाब्दिक संबंध वध करने वालों से है, पर उत्पत्ति के इस प्रसंग में यह राजकीय सुरक्षा और बंदीगृह से जुड़े उच्च अधिकारी को सूचित करता है। ‘अंगरक्षकों के प्रधान’ संदर्भानुकूल और स्पष्ट है।
- source_word: אֶת יוֹסֵף אִתָּם
  choice: यूसुफ को उनके लिए
  rationale: इब्रानी रचना यूसुफ की नियुक्ति को उन दोनों बंदियों से जोड़ती है। ‘उनके लिए’ उसकी सेवा की भूमिका से सहज रूप से जुड़ता है, जबकि पदबंध की संभावित निरीक्षण-संबंधी छाया को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיְשָׁרֶת אֹתָם
  choice: वह उनकी सेवा करता था
  rationale: שרת का मूल अर्थ सेवा करना या किसी की आवश्यकताओं की देखभाल करना है। यह अनुवाद निरंतर सेवा के प्रसंग को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּהְיוּ יָמִים
  choice: वे कुछ समय तक ... रहे
  rationale: शाब्दिक रूप ‘वे दिनों तक रहे’ एक इब्रानी मुहावरा है, जिसका आशय किसी अनिर्दिष्ट अवधि तक बने रहना है।
- source_word: בְּמִשְׁמָר
  choice: हिरासत में
  rationale: מִשְׁמָר पहरे में रखे जाने, बंदी अवस्था या अभिरक्षा को दर्शाता है। ‘हिरासत में’ केवल स्थान के बजाय उनकी निगरानी में बंद स्थिति पर बल देता है।
