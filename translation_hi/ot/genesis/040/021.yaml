  text: उसने पिलानेवालों के प्रधान को उसके पद पर फिर नियुक्त कर दिया, और उस प्रधान ने प्याला फ़िरौन के हाथ में दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: फिर नियुक्त कर दिया
  rationale: हिफ़ील रूप यहाँ किसी व्यक्ति को उसके पहले पद या दायित्व पर बहाल करने का भाव देता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: שַׂר הַמַּשְׁקִים
  choice: पिलानेवालों के प्रधान
  rationale: שַׂר अधिकारी या प्रधान है और מַשְׁקִים राजदरबार में पेय परोसनेवालों को सूचित करता है; यह पदनाम अर्थ को सहज हिन्दी में रखता है।
- source_word: עַל מַשְׁקֵהוּ
  choice: उसके पद पर
  rationale: शाब्दिक रूप से यह उसके पेय-परोसने के कार्य की ओर संकेत करता है; प्रसंग में 'उसके पद पर' उसी आधिकारिक सेवा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּתֵּן
  choice: उसने ... दिया
  rationale: נתן का मूल अर्थ 'देना' है। कर्ता का सर्वनाम मूल पाठ की व्याकरणिक अस्पष्टता बनाए रखता है; संदर्भ में इसे पिलानेवालों के प्रधान से जोड़ा जा सकता है।
- source_word: הַכּוֹס
  choice: प्याला
  rationale: यह ठोस संज्ञा का सीधा और राजदरबारी प्रसंग के अनुकूल हिन्दी रूप है।
- source_word: עַל כַּף פַּרְעֹה
  choice: फ़िरौन के हाथ में
  rationale: כף शाब्दिक रूप से हथेली है, पर इस क्रिया के साथ हिन्दी का स्वाभाविक प्रयोग 'हाथ में देना' है।
