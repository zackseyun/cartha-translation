  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ יוֹסֵ֔ף זֶ֖ה פִּתְרֹנ֑/וֹ שְׁלֹ֨שֶׁת֙ הַ/שָּׂ֣רִגִ֔ים שְׁלֹ֥שֶׁת יָמִ֖ים הֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/012.yaml
  text: 'Then Joseph said to him[a], “This is its interpretation: the three branches are three days.”'
translation:
  language: hi
  text: 'तब यूसुफ ने उससे कहा, “इसका अर्थ यह है: वे तीन डालियाँ[a] तीन दिन हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाखलता की शाखाएँ” अथवा “लताएँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לוֹ
  choice: उससे
  rationale: इब्रानी में सर्वनाम स्पष्ट है; मुख्य पाठ में उसका संदर्भ ‘पिलानेवाला’ जोड़ने के बजाय सर्वनाम रखा गया है।
- source_word: פִּתְרֹנוֹ
  choice: इसका अर्थ
  rationale: यह स्वप्न के चित्र का अभिप्राय बताता है। ‘अर्थ’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और प्रत्यय को ‘इसका’ द्वारा व्यक्त करता है।
- source_word: שְׁלֹשֶׁת
  choice: तीन ... तीन
  rationale: व्याख्यात्मक समानता की संरचना बनाए रखने के लिए दोहराए गए अंक को सुरक्षित रखा गया है।
- source_word: הַשָּׂרִגִים
  choice: डालियाँ
  rationale: स्वप्न के संदर्भ में यह शब्द दाखलता की शाखाओं या लताओं के लिए है; ‘डालियाँ’ स्पष्ट और सहज है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: יָמִים
  choice: दिन
  rationale: यह सीधा कालवाचक संज्ञा है और स्वप्न-चिह्न को समयावधि से समान ठहराता है।
- source_word: הֵם
  choice: हैं
  rationale: स्वतंत्र सर्वनाम विधेय-समानता पर बल देता है; हिन्दी में ‘वे ... हैं’ इस बल और वाक्य-संरचना को स्वाभाविक रूप से व्यक्त करता है।
