  yaml_path: translation/ot/genesis/040/018.yaml
  text: 'Joseph answered and said, “This is its interpretation: the three baskets are three days.”'
translation:
  language: hi
  text: 'तब यूसुफ ने उत्तर दिया, “इसका अर्थ यह है: वे तीन टोकरियाँ तीन दिन हैं।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ने उत्तर दिया
  rationale: हिब्रू का दोहरा संवाद-सूत्र शाब्दिक रूप से ‘उत्तर दिया और कहा’ है; आधुनिक स्वाभाविक हिन्दी में ‘उत्तर दिया’ दोनों क्रियाओं का आशय संक्षेप में व्यक्त करता है।
- source_word: פִּתְרֹנוֹ
  choice: इसका अर्थ
  rationale: स्वप्न के प्रसंग में यह शब्द उसकी व्याख्या या अर्थ को दर्शाता है; सामान्य पाठक के लिए ‘अर्थ’ सहज और स्पष्ट है।
- source_word: שְׁלֹשֶׁת הַסַּלִּים
  choice: वे तीन टोकरियाँ
  rationale: סַל का सामान्य अर्थ ‘टोकरी’ है। निश्चितता-सूचक उपपद को पूर्वोक्त टोकरियों की ओर संकेत करने वाले ‘वे’ से व्यक्त किया गया है।
- source_word: שְׁלֹשֶׁת יָמִים הֵם
  choice: तीन दिन हैं
  rationale: हिब्रू की क्रियारहित पहचान-वाचक संरचना को सीधे रखा गया है, ताकि प्रतीक और उसके अर्थ की समानता ‘हैं’ द्वारा बनी रहे; ‘का अर्थ तीन दिन है’ अधिक व्याख्यात्मक होता।
