language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו חֲל֣וֹם חָלַ֔מְנוּ וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יוֹסֵ֗ף הֲ/ל֤וֹא לֵֽ/אלֹהִים֙ פִּתְרֹנִ֔ים סַפְּרוּ נָ֖א לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/008.yaml
  text: They said to him[a], “We have dreamed a dream, and there is no one to interpret it.” Joseph said to them[b], “Do not interpretations belong to God? Please tell them to me.”
translation:
  language: hi
  text: उन्होंने उससे कहा, “हमने एक स्वप्न देखा है[a], और उसका अर्थ बतानेवाला कोई नहीं है।” यूसुफ ने उनसे कहा, “क्या अर्थ परमेश्वर ही के नहीं हैं?[b] कृपया मुझे बताइए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एक स्वप्न हमने देखा।”
    reason: मूल हिब्रू की सजातीय कर्म-रचना को दिखाना।
  - marker: b
    text: या, “क्या अर्थ परमेश्वर के नहीं हैं?”
    reason: हिब्रू में आलंकारिक प्रश्न परमेश्वर के साथ अर्थों के सम्बन्ध को व्यक्त करता है; यह विकल्प ‘ही’ के बिना उसी मूल सम्बन्ध को रखता है।
lexical_decisions:
- source_word: חֲלוֹם חָלַמְנוּ
  choice: हमने एक स्वप्न देखा है
  rationale: हिब्रू में सजातीय कर्म ‘स्वप्न हमने देखा’ है। हिन्दी में ‘स्वप्न देखा है’ स्वाभाविक है और हाल में देखे गए स्वप्न की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: और उसका अर्थ बतानेवाला कोई नहीं है
  rationale: सक्रिय कृदन्त פֹתֵר का अर्थ ‘अर्थ बतानेवाला/व्याख्या करनेवाला’ है। यह अनुवाद किसी उपलब्ध व्याख्याकार के न होने का भाव रखता है, बिना यह जोड़ने के कि कोई ऐसा कर ही नहीं सकता।
- source_word: הֲלוֹא
  choice: क्या ... नहीं हैं?
  rationale: यह सहमति की अपेक्षा रखनेवाला आलंकारिक प्रश्न है; हिन्दी की यह रचना उसके प्रश्नात्मक बल को बनाए रखती है।
- source_word: לֵאלֹהִים פִּתְרֹנִים
  choice: अर्थ परमेश्वर ही के हैं
  rationale: ל से व्यक्त सम्बन्ध को ‘के हैं’ द्वारा रखा गया है, जिससे अधिकार, स्रोत और स्वामित्व के निकटवर्ती भावों को अनावश्यक रूप से किसी एक में सीमित नहीं किया जाता। ‘ही’ आलंकारिक प्रश्न में परमेश्वर की विशिष्टता स्पष्ट करता है।
- source_word: פִּתְרֹנִים
  choice: अर्थ
  rationale: हिब्रू संज्ञा बहुवचन है, पर हिन्दी में ‘अर्थ’ का रूप एकवचन और बहुवचन दोनों में समान रहता है; बहुवचन क्रिया ‘हैं’ से व्याकरणिक संख्या प्रकट होती है।
- source_word: סַפְּרוּ נָא לִי
  choice: कृपया मुझे सुनाइए
  rationale: סַפְּרוּ बहुवचन आज्ञार्थक है और נָא विनम्र अनुरोध बनाता है। हिब्रू में कर्म स्पष्ट रूप से नहीं दिया गया; ‘मुझे सुनाइए’ उस निहित सन्दर्भ को खुला रखता है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: व्यक्तिनाम का प्रचलित मानक हिन्दी रूप।
theological_decisions:
- issue: यूसुफ के कथन में אֱלֹהִים का सन्दर्भ
  choice: परमेश्वर
  alternative: ईश्वर / कोई देवता या देवगण
  rationale: यूसुफ-कथा के प्रसंग में यह यूसुफ द्वारा स्वप्नों के अर्थ पर सच्चे परमेश्वर के अधिकार या स्रोत की घोषणा है; यहाँ बहुदेववादी अनिश्चितता प्रसंगानुकूल नहीं है।
- issue: לֵאלֹהִים द्वारा व्यक्त सम्बन्ध
  choice: अर्थ परमेश्वर ही के हैं
  alternative: अर्थ परमेश्वर की ओर से मिलते हैं / अर्थ बताना परमेश्वर का काम है
  rationale: चुना हुआ रूप मूल के स्वामित्व, अधिकार अथवा स्रोत के बीच की वास्तविक अर्थ-व्याप्ति को बनाए रखता है और उसे केवल ‘क्षमता’ या ‘काम’ में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘स्वप्न’ और ‘परमेश्वर’ बाइबलीय प्रसंग के अनुरूप परिचित शब्द हैं। यूसुफ के विनम्र अनुरोध में आदरसूचक बहुवचन ‘सुनाइए’ रखा गया है।
