  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י י֚וֹם הֻלֶּ֣דֶת אֶת פַּרְעֹ֔ה וַ/יַּ֥עַשׂ מִשְׁתֶּ֖ה לְ/כָל עֲבָדָ֑י/ו וַ/יִּשָּׂ֞א אֶת רֹ֣אשׁ שַׂ֣ר הַ/מַּשְׁקִ֗ים וְ/אֶת רֹ֛אשׁ שַׂ֥ר הָ/אֹפִ֖ים בְּ/ת֥וֹךְ עֲבָדָֽי/ו׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
translation:
  language: hi
  text: तीसरे दिन, जो फिरौन का जन्मदिन था, उसने अपने सभी सेवकों के लिए भोज दिया। तब उसने अपने सेवकों के बीच मुख्य पेय-परोसनेवाले का सिर और मुख्य रोटी बनानेवाले का सिर उठाया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “का सिर उठाया” है। यह मुहावरा “ध्यान में लेना” या “विशेष रूप से पेश करना” अर्थ दे सकता है। इसे मूल रूप में रखा गया है, क्योंकि आगे दोनों अधिकारियों के अलग-अलग परिणामों के साथ इसी अभिव्यक्ति पर शब्द-क्रीड़ा की गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: इब्रानी कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में समय-सूचक आरम्भ द्वारा व्यक्त किया गया है; अलग से ‘ऐसा हुआ’ जोड़ना आवश्यक नहीं।
- source_word: יוֹם הֻלֶּדֶת אֶת־פַּרְעֹה
  choice: जो फिरौन का जन्मदिन था
  rationale: यह पदबंध फिरौन के जन्म के दिन, अर्थात उसके जन्मदिन, को बताता है; सम्बन्धवाचक वाक्य हिन्दी में प्रसंग को स्पष्ट और सहज रखता है।
- source_word: וַיַּעַשׂ מִשְׁתֶּה
  choice: उसने ... भोज दिया
  rationale: מִשְׁתֶּה खाने-पीने की दावत या भोज को दर्शाता है। ‘भोज दिया’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
- source_word: לְכָל עֲבָדָיו
  choice: अपने सभी सेवकों के लिए
  rationale: राजदरबार के प्रसंग में עֲבָדִים सेवकों, परिचारकों और अधिकारियों को व्यापक रूप से समेटता है; ‘सेवक’ अनावश्यक रूप से दासत्व निश्चित नहीं करता।
- source_word: וַיִּשָּׂא אֶת־רֹאשׁ
  choice: का सिर उठाया
  rationale: शाब्दिक मुहावरे को बनाए रखा गया है, क्योंकि निकटवर्ती कथा में यही अभिव्यक्ति दोनों अधिकारियों के भिन्न परिणामों पर अर्थपूर्ण शब्द-क्रीड़ा करती है। फुटनोट सम्भावित अर्थ स्पष्ट करता है।
- source_word: שַׂר הַמַּשְׁקִים
  choice: मुख्य पिलानेवाले
  rationale: यह पेय परोसने की राजकीय सेवा के प्रधान का पद है। यह चयन आधुनिक पाठक के लिए समझने योग्य है और पद की प्रकृति बनाए रखता है।
- source_word: שַׂר הָאֹפִים
  choice: मुख्य रोटी पकानेवाले
  rationale: यह पकाई हुई रोटी और अन्य खाद्य तैयार करनेवालों के प्रधान का राजकीय पद है; ‘रोटी पकानेवाला’ सामान्य हिन्दी में ‘बेकर’ से अधिक सुलभ है।
- source_word: בְּתוֹךְ עֲבָדָיו
  choice: अपने सेवकों के बीच
  rationale: यह दर्शाता है कि फिरौन ने यह कार्रवाई अपने दरबारी सेवकों की सभा या उपस्थिति में की।
