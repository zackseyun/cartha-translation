lexical_decisions:
- source_word: וַיִּתֵּן אֹתָם בְּמִשְׁמַר
  choice: उसने उन्हें ... हिरासत में रख दिया
  rationale: נתן यहाँ ‘देना’ नहीं, बल्कि किसी को अभिरक्षा में रखना दर्शाता है; מִשְׁמָר का कानूनी-अभिरक्षात्मक भाव ‘हिरासत’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: अंगरक्षकों के प्रधान का घर
  rationale: शाब्दिक पद का सम्बन्ध वध करने वालों अथवा जल्लादों के प्रधान से हो सकता है, पर उत्पत्ति के मिस्री राजकीय प्रसंग में यह एक पदवी है; ‘अंगरक्षकों का प्रधान’ आधुनिक हिन्दी में स्पष्ट और स्थापित अर्थ देता है।
- source_word: אֶל בֵּית הַסֹּהַר
  choice: उस बन्दीगृह में
  rationale: בֵּית הַסֹּהַר कारावास के स्थान को दर्शाता है। ‘बन्दीगृह’ मूल संयुक्त अभिव्यक्ति को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: מְקוֹם אֲשֶׁר יוֹסֵף אָסוּר שָׁם
  choice: जहाँ यूसुफ बन्दी था
  rationale: אָסוּר का मूल भाव ‘बँधा हुआ’ है, पर यहाँ कारावास के प्रसंग में ‘बन्दी’ स्वाभाविक है; שָׁם का स्थानवाचक अर्थ ‘जहाँ’ में समाहित है।
