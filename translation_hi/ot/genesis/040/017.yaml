  text: וּ/בַ/סַּ֣ל הָֽ/עֶלְי֔וֹן מִ/כֹּ֛ל מַאֲכַ֥ל פַּרְעֹ֖ה מַעֲשֵׂ֣ה אֹפֶ֑ה וְ/הָ/ע֗וֹף אֹכֵ֥ל אֹתָ֛/ם מִן הַ/סַּ֖ל מֵ/עַ֥ל רֹאשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/017.yaml
  text: and in the top basket were all kinds of food for Pharaoh[a], the work of a baker, and the birds were eating them from the basket above my head.
translation:
  language: hi
  text: और सबसे ऊपर की टोकरी में फ़िरौन के लिए हर तरह का भोजन था—बेकर की बनाई हुई चीज़ें—और पक्षी मेरे सिर के ऊपर की टोकरी में से उन्हें खा रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַסַּל הָעֶלְיוֹן
  choice: और सबसे ऊपर की टोकरी में
  rationale: עֶלְיוֹן यहाँ तीन टोकरियों में सबसे ऊपर वाली टोकरी को दर्शाता है; यह हिंदी में स्वाभाविक और स्थान-संबंधी अर्थ के प्रति निष्ठावान है।
- source_word: מִכֹּל מַאֲכַל פַּרְעֹה
  choice: फ़िरौन के लिए हर तरह का भोजन
  rationale: מִכֹּל सामूहिक संज्ञा מַאֲכַל के साथ विविधता का भाव देता है। संबंध को 'के लिए' से व्यक्त किया गया है, जो संदर्भ में तैयार भोजन का आशय देता है।
- source_word: מַעֲשֵׂה אֹפֶה
  choice: बेकर का बनाया हुआ
  rationale: शाब्दिक अर्थ 'बेकर का काम' है, पर संदर्भ में बेकर द्वारा तैयार की गई खाद्य वस्तुएँ अभिप्रेत हैं। चुना गया रूप अर्थ स्पष्ट करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְהָעוֹף
  choice: और पक्षी
  rationale: עוֹף एक सामूहिक संज्ञा के रूप में पक्षियों को दर्शा सकता है; हिंदी बहुवचन संदर्भ में स्वाभाविक है।
- source_word: אֹכֵל
  choice: खा रहे थे
  rationale: कृदंत स्वप्न-दृश्य में जारी क्रिया व्यक्त करता है; हिंदी अपूर्ण भूतकाल इस पहलू को सुरक्षित रखता है।
- source_word: אֹתָם
  choice: उसे
  rationale: हिब्रू प्रत्यय व्याकरणतः बहुवचन है और खाद्य पदार्थों की ओर संकेत करता है; हिंदी में सामूहिक 'भोजन' के अनुरूप एकवचन सर्वनाम अधिक स्वाभाविक है, बिना आशय बदले।
- source_word: מִן הַסַּל
  choice: टोकरी में से
  rationale: מִן स्रोत या भीतर से निकाले जाने का भाव देता है; 'में से' पक्षियों द्वारा टोकरी का भोजन खाने के दृश्य को स्पष्ट और स्वाभाविक बनाता है।
- source_word: מֵעַל רֹאשִׁי
  choice: मेरे सिर के ऊपर रखी
  rationale: מֵעַל सिर से ऊपर की स्थिति बताता है। 'रखी' हिंदी में संबंध स्पष्ट करता है; यह आवश्यक रूप से सिर से सीधे स्पर्श का दावा नहीं करता।
