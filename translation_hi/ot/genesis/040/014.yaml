base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/014.yaml
  text: But if you remember me when it goes well for you[a], please show kindness to me, and mention me to Pharaoh[b], and bring me out of this house.
translation:
  language: hi
  text: लेकिन, जब तुम्हारा भला हो, तब मुझे याद रखना[a]। कृपा करके मुझ पर कृपा करना, फ़िरौन से मेरा ज़िक्र करना और मुझे इस घर से बाहर निकलवा देना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “मुझे अपने साथ याद रखना,” अर्थात मुझे अपने ध्यान में रखना।
    reason: lexical_nuance
  - marker: b
    text: यहाँ “घर” से आशय उस स्थान से है जहाँ यूसुफ को बंदी बनाकर रखा गया था।
    reason: contextual_clarification
lexical_decisions:
- source_word: כִּי אִם
  choice: लेकिन
  rationale: यह पद पिछले कथन के बाद यूसुफ की विनती को विरोधात्मक ढंग से आगे बढ़ाता है; शर्त का भाव अगले ‘जब’ वाले उपवाक्य में स्वाभाविक रूप से व्यक्त है।
- source_word: זְכַרְתַּנִי אִתְּךָ
  choice: मुझे याद रखना
  rationale: शाब्दिक ‘अपने साथ मुझे याद रखना’ हिन्दी में अस्वाभाविक है। ‘मुझे याद रखना’ व्यक्ति को मन में रखने का पूरा मुहावरेदार अर्थ देता है।
- source_word: כַּאֲשֶׁר יִיטַב לָךְ
  choice: जब तुम्हारा भला हो
  rationale: यह प्याले पिलानेवाले की बहाली और अनुकूल दशा की ओर संकेत करता है तथा समयसूचक भाव को बनाए रखता है।
- source_word: וְעָשִׂיתָ נָּא עִמָּדִי חָסֶד
  choice: कृपा करके मुझ पर दया करना
  rationale: נָא को ‘कृपा करके’ और חֶסֶד को इस व्यक्तिगत सहायता की विनती में ‘दया’ से व्यक्त किया गया है; यहाँ औपचारिक वाचा-निष्ठा प्रमुख नहीं है।
- source_word: וְהִזְכַּרְתַּנִי אֶל פַּרְעֹה
  choice: फ़िरौन से मेरा ज़िक्र करना
  rationale: हिफ़ील रूप का आशय यूसुफ की बात फ़िरौन के ध्यान में लाना है; यह हिन्दी में संक्षिप्त और स्वाभाविक अभिव्यक्ति है।
- source_word: וְהוֹצֵאתַנִי
  choice: मुझे ... बाहर निकलवा देना
  rationale: 'हिफ़ील की कारकता को ‘निकलवा देना’ स्पष्ट रूप से व्यक्त करता है: प्याले पिलानेवाला स्वयं सीधे न निकाले, बल्कि रिहाई का कारण बने।'
- source_word: מִן הַבַּיִת הַזֶּה
  choice: इस घर से
  rationale: मूल में ‘घर’ है, जो यहाँ बंदीगृह को सूचित करता है; मुख्य पाठ स्रोत की शब्दावली रखता है और संदर्भगत अर्थ पादटिप्पणी में बताता है।
