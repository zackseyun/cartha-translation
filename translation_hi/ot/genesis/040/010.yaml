- source_word: שָׂרִיגִם
  choice: डालियाँ
  rationale: यह शब्द दाखलता की शाखाओं, लताओं या नई टहनियों को सूचित कर सकता है। ‘डालियाँ’ सामान्य पाठक के लिए सहज है और अनावश्यक रूप से किसी एक सूक्ष्म वनस्पतिक अर्थ को निश्चित नहीं करता।
- source_word: כְפֹרַחַת
  choice: कोंपलें निकलते ही
  rationale: כְ के साथ कृदंत दाखलता के विकसित होने की अवस्था और तत्काल आगे बढ़ती प्रक्रिया दर्शाता है; यह हिन्दी प्रयोग स्वप्न में दिखाई गई तीव्र प्रगति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עָלְתָה נִצָּהּ
  choice: फूल आ गए
  rationale: शाब्दिक भाव ‘उसका फूल ऊपर आया/निकल आया’ है। हिन्दी में पौधे पर फूल प्रकट होने के लिए ‘फूल आ गए’ स्वाभाविक है; एकवचन रूप को सामूहिक अर्थ में बहुवचन से व्यक्त किया गया है।
- source_word: הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים
  choice: उसके गुच्छों में अंगूर पक गए
  rationale: हिब्रू में गुच्छे कर्ता हैं और ‘अंगूर’ परिणाम या पूर्ण अवस्था बताता है। हिन्दी में ‘गुच्छों में अंगूर पक गए’ उसी विकास-क्रम को स्पष्ट और सहज रूप देता है।
