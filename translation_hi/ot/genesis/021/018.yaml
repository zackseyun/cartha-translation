  yaml_path: translation/ot/genesis/021/018.yaml
  text: Get up[a], lift up the boy, and hold him fast with your hand[b], for I will make him into a great nation.
translation:
  language: hi
  text: उठ, लड़के को उठा और अपने हाथ से उसे मज़बूती से थाम ले[a], क्योंकि मैं उसे एक महान राष्ट्र बनाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: “उस पर अपना हाथ मज़बूत कर”; अर्थात उसे दृढ़ता से पकड़कर सहारा दे।'
    reason: हिब्रू मुहावरे में मज़बूत पकड़ और सहारे का भाव स्पष्ट करना।
lexical_decisions:
- source_word: ק֚וּמִי
  choice: उठ
  rationale: यह हाजिरा को संबोधित स्त्रीलिंग एकवचन आज्ञा है। ‘उठ’ आधुनिक हिंदी में स्वाभाविक और सीधा आदेश है।
- source_word: שְׂאִ֣י אֶת־הַנַּ֔עַר
  choice: लड़के को उठा
  rationale: נשׂא यहाँ गिरे या पड़े हुए लड़के को उठाने का भाव देता है; यह अनुवाद लगातार उसे ढोने का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: וְהַחֲזִ֥יקִי אֶת־יָדֵ֖ךְ בּ֑וֹ
  choice: अपने हाथ से उसे मज़बूती से थाम ले
  rationale: हिब्रू अभिव्यक्ति दृढ़ पकड़ और सहारा देने पर बल देती है। यह हिंदी रूप उस बल को स्पष्ट करता है और केवल ‘उसका हाथ पकड़ने’ की संभावित गलत समझ से बचाता है।
- source_word: כִּֽי
  choice: क्योंकि
  rationale: यह पहले दिए गए आदेश का कारण प्रस्तुत करता है और आधुनिक हिंदी में स्वाभाविक है।
- source_word: לְג֥וֹי גָּד֖וֹל
  choice: एक बड़ी जाति
  rationale: यहाँ גּוֹי वंश से विकसित होने वाले बड़े जनसमूह या राष्ट्र को दर्शाता है। ‘बड़ी जाति’ उत्पत्ति की प्रतिज्ञा-संबंधी भाषा को संक्षेप में बनाए रखती है।
- source_word: אֲשִׂימֶֽנּוּ
  choice: मैं उसे … बनाऊँगा
  rationale: שׂים यहाँ परिणाम का भाव देता है; परमेश्वर लड़के को एक बड़ी जाति बनाने की प्रतिज्ञा करता है।
theological_decisions:
- issue: इश्माएल के भविष्य के विषय में परमेश्वर की प्रतिज्ञा
  choice: कथन को सीधे परमेश्वर की प्रतिज्ञा के रूप में रखा गया है कि वह लड़के को एक बड़ी जाति बनाएगा।
  alternative: प्रतिज्ञा की प्रकृति को किसी विशेष वाचागत या मतगत श्रेणी में स्पष्ट करना।
  rationale: मूल पद राष्ट्रीय भविष्य की प्रतिज्ञा करता है, पर उसकी धर्मवैज्ञानिक श्रेणी को यहाँ परिभाषित नहीं करता; इसलिए अनुवाद कोई अतिरिक्त मतगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। हाजिरा को दिए गए एकवचन आदेशों के लिए स्वाभाविक हिंदी रूप ‘उठ’, ‘उठा’ और ‘थाम ले’ प्रयुक्त हुए हैं।
