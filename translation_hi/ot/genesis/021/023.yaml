source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּׁ֨בְעָ/ה לִּ֤/י בֵֽ/אלֹהִים֙ הֵ֔נָּה אִם תִּשְׁקֹ֣ר לִ֔/י וּ/לְ/נִינִ֖/י וּ/לְ/נֶכְדִּ֑/י כַּ/חֶ֜סֶד אֲשֶׁר עָשִׂ֤יתִי עִמְּ/ךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔/י וְ/עִם הָ/אָ֖רֶץ אֲשֶׁר גַּ֥רְתָּה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/023.yaml
  text: Swear to me here by God that you will not deal falsely with me, or with my children, or with my descendants. According to the kindness that I have shown to you, you shall show to me and to the land where you have lived as a foreigner.
translation:
  language: hi
  text: अब यहीं मुझसे परमेश्वर की शपथ खा कि तुम न मेरे साथ, न मेरे बच्चों के साथ, और न मेरे वंशजों के साथ छल करोगे। जिस भलाई का व्यवहार मैंने तुम्हारे साथ किया है, वैसा ही तुम मेरे साथ और उस देश के साथ करना जिसमें तुम परदेशी होकर रहे हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले प्रसंग से निष्कर्षात्मक संक्रमण करता है; दोनों अवयवों को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: परमेश्वर की शपथ खाकर मुझसे कह
  rationale: हिफ़िल आज्ञार्थक का अर्थ शपथ लेने की माँग है; हिन्दी में ‘शपथ खाकर ... कह’ स्वाभाविक और स्पष्ट है।
- source_word: אִם־תִּשְׁקֹר
  choice: छल करेगा
  rationale: शपथ-सूत्र में אִם निषेधात्मक आशय देता है; שקר यहाँ झूठे या विश्वासघाती व्यवहार को सूचित करता है।
- source_word: לְנִינִי וּלְנֶכְדִּי
  choice: मेरे बच्चों ... मेरे वंशजों
  rationale: दोनों संबंधसूचक पदों का सटीक कालगत स्तर अनिश्चित है; पाठ की पीढ़ीगत वृद्धि को सामान्य किन्तु भिन्न हिन्दी शब्दों से रखा गया है।
- source_word: כַּחֶסֶד
  choice: जैसी कृपा
  rationale: חֶסֶד यहाँ किए गए निष्ठापूर्ण उपकार/भलाई को दर्शाता है; ‘कृपा’ संक्षिप्त, प्रतिष्ठित और प्रसंगानुकूल है।
- source_word: גַּרְתָּה בָּהּ
  choice: जिसमें तू परदेशी होकर रहा है
  rationale: גור स्थायी स्वामित्व के बजाय प्रवासी अथवा निवासी-परदेशी के रूप में रहने को व्यक्त करता है।
theological_decisions:
- issue: शपथ में परमेश्वर का उल्लेख
  choice: परमेश्वर की शपथ
  alternative: ईश्वर की शपथ
  rationale: אֱלֹהִים के लिए सामान्य बाइबलीय हिन्दी ‘परमेश्वर’ चुना गया; पाठ किसी विशिष्ट संप्रदायगत व्याख्या की माँग नहीं करता।
- issue: חֶסֶד का अर्थ
  choice: कृपा
  alternative: भलाई / निष्ठापूर्ण प्रेम
  rationale: इस राजनयिक-संबंधपरक प्रसंग में शब्द किए गए उपकार और वफादार व्यवहार दोनों को समेट सकता है; ‘कृपा’ इस व्यापकता को बिना अतिरिक्त सिद्धान्त आरोपित किए बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु साधारण पाठक के लिए सहज। प्रत्यक्ष संबोधन में एकवचन ‘तू’ रखा गया है, क्योंकि इब्रानी क्रियाएँ एकवचन हैं और निकटवर्ती संवाद की शैली इसी के अनुरूप है।
