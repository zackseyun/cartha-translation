source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֣ם אַבְרָהָ֣ם בַּ/בֹּ֡קֶר וַ/יִּֽקַּֽח לֶחֶם֩ וְ/חֵ֨מַת מַ֜יִם וַ/יִּתֵּ֣ן אֶל הָ֠גָר שָׂ֧ם עַל שִׁכְמָ֛/הּ וְ/אֶת הַ/יֶּ֖לֶד וַֽ/יְשַׁלְּחֶ֑/הָ וַ/תֵּ֣לֶךְ וַ/תֵּ֔תַע בְּ/מִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/014.yaml
  text: So Abraham rose early in the morning and took bread and a skin of water and gave them to Hagar[a], putting them on her shoulder, along with the boy, and sent her away. And she went and wandered in the wilderness of Beersheba.
translation:
  language: hi
  text: अब्राहम भोर को उठा। उसने रोटी और पानी की एक मशक ली और उन्हें हाजिरा को दिया, उन्हें उसके कंधे पर रख दिया और लड़के को भी उसके सुपुर्द किया; फिर उसे विदा कर दिया। वह चली गई और बेर्शेबा के निर्जन प्रदेश में भटकती रही।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक क्रम है, “उसके कंधे पर रखकर, और लड़के को।” वाक्यरचना संक्षिप्त है। इसे “उन्हें उसके कंधे पर रखकर, और [लड़के को] उसे देकर” भी समझा जा सकता है; कुछ लोग इसे लड़के को भी उसके साथ भेजने के रूप में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: भोर को उठा
  rationale: यह हिफ़ील क्रिया और कालवाचक पद के संयुक्त अर्थ—सुबह बहुत जल्दी उठना—को स्वाभाविक तथा संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: यह मूल शब्द का सीधा अर्थ है; यहाँ इसे सामान्यतः ‘भोजन’ बनाने की आवश्यकता नहीं है।
- source_word: חֵמַת מַיִם
  choice: पानी की एक मशक
  rationale: חֵמֶת चमड़े के तरल-पात्र को सूचित करता है; ‘मशक’ ऐतिहासिक वस्तु को बिना आधुनिक बोतल का भाव दिए सटीक रूप से व्यक्त करती है।
- source_word: שָׂם עַל שִׁכְמָהּ וְאֶת הַיֶּלֶד
  choice: उसने उन्हें उसके कंधे पर रखा और लड़के को भी उसके साथ भेजकर
  rationale: मूल वाक्यरचना संक्षिप्त और कुछ अस्पष्ट है। यह रूप रसद को कंधे पर रखे जाने से जोड़ता है और लड़के को हाजिरा के साथ भेजे जाने के रूप में समझता है, पर पादटिप्पणी में मूल संक्षिप्तता बताता है।
- source_word: וַיְשַׁלְּחֶהָ
  choice: उसे विदा कर दिया
  rationale: यह भेज देने के अर्थ को गरिमापूर्ण और स्वाभाविक हिन्दी में रखता है; प्रसंग में अलग कर दिए जाने की गंभीरता बनी रहती है।
- source_word: וַתֵּתַע
  choice: भटकती रही
  rationale: क्रिया भटकने या मार्ग से चूकने को व्यक्त करती है। यह चयन जानबूझकर रास्ता खोने की सीमा से अधिक अर्थ आरोपित नहीं करता।
- source_word: בְּמִדְבַּר בְּאֵר שָׁבַע
  choice: बेरशेबा के वीराने में
  rationale: מִדְבָּר निर्जन, कम आबाद वन्य क्षेत्र को सूचित करता है; ‘वीराना’ आधुनिक पाठक के लिए स्वाभाविक है और केवल रेतीले मरुस्थल की छवि तक सीमित नहीं करता।
theological_decisions:
- issue: ‘लड़के’ का ‘कंधे पर रखा’ वाक्यांश से वाक्यरचनात्मक संबंध
  choice: रोटी और मशक हाजिरा के कंधे पर रखी गईं, और लड़का उसके साथ भेजा गया।
  alternative: अब्राहम ने रसद के साथ लड़के को भी हाजिरा के कंधे पर रखा; अथवा उसने रसद देकर लड़के को उसकी देखभाल में सौंपा।
  rationale: 'इब्रानी क्रम संक्षिप्त है: ‘उसके कंधे पर रखा, और लड़के को।’ व्यापक कथा-संदर्भ में लड़के को शारीरिक रूप से कंधे पर रखने का स्पष्ट अनुवाद आधुनिक पाठक को भ्रमित कर सकता है। मुख्य पाठ सर्वाधिक संभावित संबंध देता है, जबकि पादटिप्पणी वास्तविक वाक्यरचनात्मक तनाव सुरक्षित रखती है।'
translation_notes:
  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। ‘मशक’ प्रसंगानुकूल ऐतिहासिक शब्द है; ‘वीराना’ मִדְבָּר की व्यापक भौगोलिक धारणा को सहज हिन्दी में व्यक्त करता है। मुख्य पाठ में अस्पष्ट वाक्यरचना को पठनीय बनाया गया है और उसकी वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित है।
