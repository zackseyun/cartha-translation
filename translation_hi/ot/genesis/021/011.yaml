lexical_decisions:
- source_word: וַיֵּרַע
  choice: बहुत बुरी लगी
  rationale: यहाँ רעע, בְּעֵינֵי के साथ, किसी बात का किसी व्यक्ति को बुरा या अत्यंत अप्रिय लगना व्यक्त करता है। हिंदी में यह प्रयोग स्वाभाविक ढंग से उस मूल्यांकन और भावनात्मक पीड़ा दोनों को व्यक्त करता है।
- source_word: הַדָּבָר
  choice: यह बात
  rationale: דבר का अर्थ प्रसंगानुसार ‘बात’, ‘मामला’ या ‘विषय’ हो सकता है। यहाँ यह पिछले पद में सारा की कही बात की ओर संकेत करता है; इसलिए ‘यह बात’ स्पष्ट और स्वाभाविक है।
- source_word: מְאֹד
  choice: बहुत
  rationale: यह सामान्य तीव्रतासूचक क्रियाविशेषण है और मूल की तीव्रता को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: בְּעֵינֵי אַבְרָהָם
  choice: अब्राहम को
  rationale: शाब्दिक अर्थ ‘अब्राहम की दृष्टि में’ है, किंतु हिंदी में ‘बात ... को बुरी लगी’ वही दृष्टिकोण-सूचक अर्थ अधिक स्वाभाविक रूप में व्यक्त करता है।
- source_word: עַל אֹדוֹת
  choice: के कारण
  rationale: यह पदबंध यहाँ अब्राहम की अप्रसन्नता या व्यथा का कारण बताता है। ‘के कारण’ कारणात्मक संबंध को स्पष्ट रखता है।
- source_word: בְּנוֹ
  choice: अपने बेटे
  rationale: בן का अर्थ विशिष्ट रूप से ‘बेटा/पुत्र’ है। हिंदी में कर्ता अब्राहम की ओर संबंध लौटाने के लिए ‘अपने बेटे’ स्वाभाविक और असंदिग्ध है।
