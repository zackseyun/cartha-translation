  text: And Abraham said[a], “I swear it.”
translation:
  language: hi
  text: और अब्राहम ने कहा[a], “मैं शपथ खाऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं शपथ खाता हूँ,” अथवा “मैं शपथ लूँगा।”
    reason: इब्रानी अपूर्ण क्रिया यहाँ संकल्पपूर्ण भविष्य या प्रत्यक्ष शपथ-स्वीकृति, दोनों रूपों में समझी जा सकती है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: और ... ने कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘और ... ने कहा’ सरल कथा-क्रम को स्वाभाविक रूप से बनाए रखता है।
- source_word: אַבְרָהָם
  choice: अब्राहम
  rationale: नाम का प्रचलित मानक हिन्दी रूप अपनाया गया है।
- source_word: אָנֹכִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम उत्तर में कर्ता को स्पष्ट करता है; हिन्दी में ‘मैं’ पर्याप्त और स्वाभाविक है, जबकि ‘मैं स्वयं’ अनावश्यक रूप से अधिक बल देता।
- source_word: אִשָּׁבֵעַ
  choice: शपथ खाऊँगा
  rationale: שבע का निफ़अल रूप ‘शपथ खाना’ है। यहाँ अपूर्ण रूप अबीमेलेक के अनुरोध के प्रत्युत्तर में संकल्प/भविष्य का भाव रखता है, जिसे ‘शपथ खाऊँगा’ स्वाभाविक रूप से व्यक्त करता है।
