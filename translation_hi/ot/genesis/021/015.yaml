  text: When the water in the skin was gone[b][a], she cast the boy under one of the bushes.
translation:
  language: hi
  text: जब मशक का पानी चुक गया, तब उसने लड़के को एक झाड़ी के नीचे फेंक दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְלוּ
  choice: समाप्त हो गया
  rationale: כלה यहाँ पानी के चुक जाने को व्यक्त करता है। ‘समाप्त हो गया’ आधुनिक हिन्दी में स्वाभाविक है और पूर्ण अभाव का भाव बनाए रखता है।
- source_word: הַמַּיִם
  choice: पानी
  rationale: מַיִם रूप की दृष्टि से बहुवचन है, पर यहाँ द्रव्यवाचक संज्ञा है; इसलिए हिन्दी में एकवचन ‘पानी’ स्वाभाविक है।
- source_word: מִן הַחֵמֶת
  choice: मशक का
  rationale: חֵמֶת पशु-चर्म से बने तरल-पात्र को दर्शाता है। ‘मशक’ हिन्दी में इस वस्तु का सटीक और संक्षिप्त नाम है; स्रोत-सूचक מן को हिन्दी में ‘मशक का पानी’ संरचना द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וַתַּשְׁלֵךְ
  choice: पटक दिया
  rationale: שלך का मूल भाव फेंकने या डाल देने का है और यह साधारण ‘लिटा दिया’ से अधिक प्रबल है। संकट की स्थिति में ‘पटक दिया’ क्रिया की तीव्रता और आकस्मिकता को बनाए रखता है, यद्यपि हिन्दी में यह कठोर सुनाई देता है।
- source_word: אֶת הַיֶּלֶד
  choice: लड़के को
  rationale: יֶלֶד बच्चे अथवा लड़के के लिए प्रयुक्त होता है। पुरुषवाचक संदर्भ में ‘लड़का’ सहज आधुनिक हिन्दी है।
- source_word: תַּחַת
  choice: के नीचे
  rationale: תַּחַת का सीधा स्थानवाचक अर्थ ‘नीचे’ है।
- source_word: אַחַד הַשִּׂיחִם
  choice: झाड़ियों में से एक
  rationale: यह रचना ‘झाड़ियों में से एक’ का अर्थ देती है। שִׂיחַ के लिए ‘झाड़ी’ सामान्य पाठक के लिए स्वाभाविक और स्पष्ट है।
