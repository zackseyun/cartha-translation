reference: Genesis 21:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַבְרָהָ֖ם בֶּן מְאַ֣ת שָׁנָ֑ה בְּ/הִוָּ֣לֶד ל֔/וֹ אֵ֖ת יִצְחָ֥ק בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/005.yaml
  text: And Abraham was a hundred years old when Isaac his son was born to him[a].
translation:
  language: hi
  text: और जब अब्राहम का पुत्र इसहाक उसके यहाँ जन्मा, तब अब्राहम सौ वर्ष का था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: और ... अब्राहम
  rationale: וְ को सरल कथात्मक संयोजक ‘और’ से व्यक्त किया गया है; इससे पूर्ववर्ती प्रसंग से संबंध बना रहता है और कोई अतिरिक्त प्रवचनात्मक बल नहीं जुड़ता।
- source_word: בֶּן מְאַת שָׁנָה
  choice: सौ वर्ष का था
  rationale: शाब्दिक इब्रानी मुहावरा ‘सौ वर्ष का पुत्र’ आयु बताता है; स्वाभाविक आधुनिक हिन्दी में ‘सौ वर्ष का था’ इसका सटीक अर्थ देता है।
- source_word: בְּ/הִוָּלֶד
  choice: जब ... जन्मा
  rationale: בְ के साथ ילד का निफ़ाल infinitive construct समयगत परिस्थिति व्यक्त करता है। हिन्दी का ‘जब ... जन्मा’ निष्क्रिय/अकर्मक जन्म-अर्थ और समय-संबंध दोनों को स्वाभाविक रूप से रखता है।
- source_word: ל֔/וֹ
  choice: उसके यहाँ
  rationale: यह सर्वनामिक पद अब्राहम को उस व्यक्ति के रूप में दिखाता है जिसके लिए अथवा जिसके घर पुत्र जन्मा। ‘उसके यहाँ’ आधुनिक हिन्दी में ‘to him’ का स्वाभाविक जन्म-संदर्भीय समतुल्य है।
- source_word: אֵת יִצְחָק
  choice: इसहाक
  rationale: אֵת कर्म-सूचक चिह्न है और हिन्दी में अलग से अनूदित नहीं होता; יִצְחָק का प्रचलित हिन्दी रूप ‘इसहाक’ रखा गया है।
- source_word: בְּנֽ/וֹ
  choice: उसका पुत्र
  rationale: प्रत्यय अब्राहम के साथ पुत्र-संबंध बताता है। हिन्दी वाक्य-विन्यास में इसे ‘अब्राहम का पुत्र’ के रूप में रखा गया है, बिना ‘अपना ही’ जैसा अनुल्लिखित बल जोड़े।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। मूल इब्रानी की सूचना पूरी रखी गई है, पर ‘सौ वर्ष का पुत्र’ जैसे अस्वाभाविक शाब्दिक मुहावरे के बजाय स्वाभाविक हिन्दी आयु-प्रयोग अपनाया गया है।
