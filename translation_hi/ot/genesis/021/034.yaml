  text: And Abraham stayed in the land of the Philistines for many days[a].
translation:
  language: hi
  text: और अब्राहम पलिश्तियों के देश में बहुत दिनों तक परदेशी के रूप में रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּגָר
  choice: और ... परदेशी होकर रहा
  rationale: क्रिया גּוּר किसी स्थान में परदेशी या अस्थायी निवासी के रूप में रहने का भाव रखती है। ‘परदेशी होकर रहा’ इस अर्थ को सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: בְּאֶרֶץ
  choice: के देश में
  rationale: אֶרֶץ यहाँ किसी जाति के भूभाग या देश को दर्शाता है; ‘देश’ हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्तियों
  rationale: यह इस जनसमूह के नाम का हिन्दी में प्रचलित बाइबलीय रूप है। संबंधसूचक रचना में ‘पलिश्तियों के देश’ स्वाभाविक है।
- source_word: יָמִים רַבִּים
  choice: बहुत दिनों तक
  rationale: यह इब्रानी पदबंध का निकट और स्वाभाविक हिन्दी रूप है तथा लंबी अवधि का भाव बनाए रखता है।
- source_word: וַ
  choice: और
  rationale: उपसर्ग वाव कथात्मक क्रम को आगे बढ़ाता है; ‘और’ उसके सरल संयोजक कार्य को सुरक्षित रखता है।
