base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/017.yaml
  text: And God heard the boy’s voice[a], and the angel of God called to Hagar from heaven and said to her, “What is the matter with you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”
translation:
  language: hi
  text: और परमेश्वर ने लड़के की आवाज़[a] सुनी। तब परमेश्वर के दूत ने स्वर्ग से हाजिरा को पुकारकर उससे कहा, “हाजिरा, तुझे क्या हुआ है? मत डर, क्योंकि परमेश्वर ने लड़के की आवाज़ वहीं सुनी है जहाँ वह है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लड़के की पुकार”; दोनों स्थानों पर प्रयुक्त हिब्रू शब्द क़ोल संकट में निकली सुनाई देने वाली पुकार को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים
  choice: और परमेश्वर ने ... सुनी
  rationale: שׁמע का सामान्य अर्थ ‘सुनना’ है। यह कथानक की क्रमिकता बनाए रखता है और यह अतिरिक्त अर्थ नहीं जोड़ता कि परमेश्वर ने तत्काल उत्तर दे दिया।
- source_word: אֶת קוֹל הַנַּעַר
  choice: लड़के की आवाज़
  rationale: קוֹל का मूल अर्थ ‘आवाज़/ध्वनि’ है। प्रसंग में यह संकट की पुकार हो सकती है, पर ‘आवाज़’ दोनों आवृत्तियों में हिब्रू की शाब्दिक पुनरावृत्ति सुरक्षित रखती है।
- source_word: הַנַּעַר
  choice: लड़का
  rationale: नַעַר यहाँ इश्माएल नामक कम आयु के पुरुष के लिए है; ‘लड़का’ आधुनिक हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: וַיִּקְרָא מַלְאַךְ אֱלֹהִים
  choice: तब परमेश्वर के दूत ने ... पुकारकर
  rationale: מַלְאַךְ אֱלֹהִים को उसके सामान्य संबंधवाचक अर्थ में रखा गया है। हिन्दी कथन-प्रवाह के लिए וַ का अनुवाद ‘तब’ और क्रमिक क्रियाओं का रूप ‘पुकारकर ... कहा’ स्वाभाविक है।
- source_word: מִן הַשָּׁמַיִם
  choice: स्वर्ग से
  rationale: שׁמים रूपतः बहुवचन है, पर इस स्थानवाचक प्रयोग में आधुनिक हिन्दी का प्रचलित समतुल्य ‘स्वर्ग से’ है।
- source_word: מַה לָּךְ
  choice: तुझे क्या हुआ है?
  rationale: यह हिब्रू मुहावरा किसी की परेशानी या दशा पूछता है। ‘तुझे क्या हुआ है?’ आधुनिक हिन्दी में स्वाभाविक है और अनुचित डाँट का भाव नहीं लाता।
- source_word: אַל תִּירְאִי
  choice: मत डर
  rationale: स्त्रीलिंग निषेधात्मक आज्ञा का सीधा, संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: כִּי שָׁמַע אֱלֹהִים
  choice: क्योंकि ... परमेश्वर ने ... सुन ली है
  rationale: כִּי आश्वासन का कारण देता है; पूर्ण क्रिया को परिणामसूचक वर्तमान पूर्ण ‘सुन ली है’ से व्यक्त किया गया है।
- source_word: בַּאֲשֶׁר הוּא שָׁם
  choice: जहाँ लड़का है, वहाँ
  rationale: वाक्यांश स्थानवाचक है। हिन्दी में ‘जहाँ ... वहाँ’ स्वाभाविक ढंग से लड़के की वर्तमान स्थिति/स्थान पर बल सुरक्षित रखता है।
theological_decisions:
- issue: מַלְאַךְ אֱלֹהִים की पहचान और परमेश्वर से उसका निकट संबंध
  choice: परमेश्वर के दूत
  alternative: परमेश्वर का एक दूत
  rationale: यह हिब्रू पदबंध को बिना किसी विशिष्ट मसीही या अन्य धर्मवैज्ञानिक पहचान को आरोपित किए सुरक्षित रखता है। कथानक में निर्दिष्ट दूत होने का भाव ‘के दूत’ से व्यक्त होता है।
