base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/033.yaml
  text: And he planted a tamarisk tree in Beersheba[a], and there he called on the name of Yahweh[b], the Everlasting God.
translation:
  language: hi
  text: और उसने बेर्शेबा में झाऊ का एक पेड़ लगाया, और वहाँ उसने यहोवा, सनातन परमेश्वर[b], के नाम से पुकारा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वहाँ उसने यहोवा के नाम की घोषणा की’ अथवा ‘वहाँ उसने यहोवा का आह्वान किया।’ इब्रानी मुहावरा उपासना के प्रसंग में घोषणा और आह्वान—दोनों का भाव रख सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अनन्त परमेश्वर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: लगाया
  rationale: נטע के क़ाल रूप का सामान्य अर्थ पौधा या पेड़ लगाना है; यहाँ यही स्वाभाविक हिन्दी प्रयोग है।
- source_word: אֶשֶׁל
  choice: झाऊ का एक पेड़
  rationale: אֶשֶׁל से सम्भवतः टैमरिस्क अर्थात झाऊ का विशिष्ट पेड़ अभिप्रेत है; यह अनुवाद एकवचन और वनस्पति-विशेषता दोनों को बनाए रखता है।
- source_word: בִּבְאֵר שָׁבַע
  choice: बेर्शेबा में
  rationale: स्थानवाचक בְּ को हिन्दी में स्वाभाविक रूप से ‘में’ कहा गया है और स्थाननाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: וַיִּקְרָא שָׁם בְּשֵׁם
  choice: वहाँ ... का नाम पुकारा
  rationale: यह इब्रानी उपासना-सूत्र आह्वान और घोषणा—दोनों का भाव रख सकता है। मुख्य पाठ में निकटवर्ती मुहावरेदार रूप रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֵל עוֹלָם
  choice: सनातन परमेश्वर
  rationale: אֵל का अर्थ ‘परमेश्वर’ और עוֹלָם का भाव अनंत काल तक बने रहने वाला है; ‘सनातन परमेश्वर’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक हिन्दी पदवी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: यहाँ मूल पाठ उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम रखता है; इसलिए नाम को प्रत्यक्ष रूप से प्रस्तुत किया गया है।
- issue: उपासना-सूत्र קרא בשם יהוה का आशय
  choice: यहोवा का नाम पुकारा
  alternative: यहोवा के नाम की घोषणा की / यहोवा का आह्वान किया
  rationale: इब्रानी सूत्र उपासना में पुकारने, आह्वान करने या नाम घोषित करने की ओर संकेत कर सकता है। मुख्य पाठ किसी एक अर्थ को अत्यधिक सीमित नहीं करता और पादटिप्पणी वास्तविक विकल्प सुरक्षित रखती है।
- issue: אֵל עוֹלָם में कालगत विशेषण का अर्थ
  choice: सनातन परमेश्वर
  alternative: अनन्त परमेश्वर
  rationale: दोनों रूप चिरस्थायित्व व्यक्त करते हैं; ‘सनातन’ पदवी-सदृश बल और गरिमा को सहज हिन्दी में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। ‘झाऊ’ विशिष्ट वृक्ष का सहज हिन्दी नाम है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में अपने सम्बद्ध पदों के साथ दिए गए हैं।
