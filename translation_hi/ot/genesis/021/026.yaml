source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ לֹ֣א יָדַ֔עְתִּי מִ֥י עָשָׂ֖ה אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/גַם אַתָּ֞ה לֹא הִגַּ֣דְתָּ לִּ֗/י וְ/גַ֧ם אָנֹכִ֛י לֹ֥א שָׁמַ֖עְתִּי בִּלְתִּ֥י הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/026.yaml
  text: And Abimelech said[a], “I did not know who had done this thing. You also did not tell me, and I myself had not heard of it until today.”
translation:
  language: hi
  text: तब अबीमेलेक ने कहा, “मैं नहीं जानता था कि यह बात[a] किसने की। तुमने भी मुझे नहीं बताया, और मैंने स्वयं भी आज से पहले इसके बारे में नहीं सुना था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह मामला” या “यह कार्य।” इब्रानी दावार का अर्थ वस्तु, मामला, घटना या कार्य हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमबोधक कथा को आगे बढ़ाता है; आधुनिक हिन्दी कथाशैली में ‘तब’ स्वाभाविक है।
- source_word: אֲבִימֶלֶךְ
  choice: अबीमेलेक
  rationale: व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
- source_word: לֹא יָדַעְתִּי
  choice: मैं नहीं जानता था
  rationale: क़ातल रूप यहाँ अबीमेलेक की उस समय तक की अज्ञानता व्यक्त करता है; हिन्दी में अपूर्ण भूतकाल स्वाभाविक है।
- source_word: מִי עָשָׂה
  choice: किसने किया
  rationale: यह उपवाक्य कार्य करने वाले अज्ञात व्यक्ति की पहचान पूछता है; हिन्दी में सामान्य भूतकाल पर्याप्त और स्वाभाविक है।
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: यह काम
  rationale: דבר का अर्थ वस्तु, मामला या घटना हो सकता है; प्रसंग में यह विवादित कृत्य को दर्शाता है, इसलिए ‘काम’ सहज है।
- source_word: וְגַם אַתָּה
  choice: तुमने भी
  rationale: גַם अब्राहम की ओर से सूचना न दिए जाने को भी सम्मिलित और उभारा हुआ दिखाता है।
- source_word: לֹא הִגַּדְתָּ לִּי
  choice: मुझे नहीं बताया
  rationale: हिफ़ील הגיד का संवाद में स्वाभाविक हिन्दी समतुल्य ‘बताना’ है।
- source_word: וְגַם אָנֹכִי
  choice: और मैंने स्वयं भी
  rationale: पूर्ण सर्वनाम אָנֹכִי के संभावित बल को ‘स्वयं’ से बनाए रखा गया है, जबकि גם को ‘भी’ दर्शाता है।
- source_word: לֹא שָׁמַעְתִּי
  choice: इसके बारे में नहीं सुना था
  rationale: प्रसंग में ‘सुनना’ का अर्थ घटना की खबर पाना है; निहित विषय को हिन्दी में स्पष्ट किया गया है।
- source_word: בִּלְתִּי הַיּוֹם
  choice: आज से पहले
  rationale: यह अभिव्यक्ति आज के दिन को अपवाद बनाते हुए पूर्वकाल में सूचना न मिलने का भाव देती है; ‘आज से पहले’ हिन्दी में अर्थ को स्पष्ट रखता है।
