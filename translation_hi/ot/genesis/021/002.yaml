  yaml_path: translation/ot/genesis/021/002.yaml
  text: So Sarah conceived and bore a son to Abraham in his old age[b][a], at the appointed time that God had spoken to him.
translation:
  language: hi
  text: तब सारा गर्भवती हुई और उसने अब्राहम के लिए उसके बुढ़ापे में एक पुत्र को जन्म दिया, उस नियत समय पर जिसके विषय में परमेश्वर ने उससे कहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: गर्भवती हुई
  rationale: הרה गर्भ धारण करने को व्यक्त करता है; आधुनिक हिन्दी में ‘गर्भवती हुई’ स्वाभाविक और स्पष्ट है।
- source_word: וַתֵּלֶד
  choice: जन्म दिया
  rationale: Qal क्रिया ילד यहाँ प्रसव की घटना बताती है; ‘जन्म दिया’ सहज आधुनिक हिन्दी है।
- source_word: בֵּן
  choice: एक पुत्र
  rationale: यह संज्ञा जन्मे हुए बच्चे को पुरुष संतान के रूप में पहचानती है; ‘एक’ हिन्दी वाक्य में स्वाभाविक अनिश्चितता व्यक्त करता है।
- source_word: לְאַבְרָהָם
  choice: अब्राहम के लिए
  rationale: लामेद अब्राहम से पुत्र के संबंध को दर्शाता है। ‘उसके लिए’ मूल संबंध को बनाए रखता है, यद्यपि हिन्दी में केवल ‘अब्राहम के पुत्र’ भी संभव है।
- source_word: לִזְקֻנָיו
  choice: उसके बुढ़ापे में
  rationale: बहुवचन रूप का मुहावरेदार अर्थ अब्राहम की वृद्धावस्था में है, न कि उद्देश्य या लाभ।
- source_word: לַמּוֹעֵד
  choice: नियत समय पर
  rationale: מוֹעֵד निर्धारित या ठहराए हुए समय को सूचित करता है; ‘नियत समय’ संक्षिप्त, गरिमापूर्ण और स्पष्ट है।
- source_word: אֲשֶׁר דִּבֶּר אֹתוֹ אֱלֹהִים
  choice: जिसके विषय में परमेश्वर ने उससे कहा था
  rationale: संबंधवाचक उपवाक्य नियत समय की ओर लौटता है। ‘जिसके विषय में’ यह स्पष्ट करता है कि वह समय परमेश्वर के पहले कथन का विषय था।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ सामान्य ईश्वरीय पद אֱלֹהִים है; हिन्दी बाइबलीय गद्य में ‘परमेश्वर’ स्वाभाविक और असांप्रदायिक है।
- source_word: וַ
  choice: इसलिए
  rationale: आरंभिक वाव पिछले पद में कही प्रतिज्ञा और यहाँ उसकी पूर्ति के बीच कथात्मक परिणाम-संबंध दिखाता है।
theological_decisions:
- issue: ईश्वरीय प्रतिज्ञा के समय पर पूर्ण होने की भाषा
  choice: ठीक उसी नियत समय पर, जिसके विषय में परमेश्वर ने उससे कहा था
  alternative: उस नियत समय पर जो परमेश्वर ने उससे कहा था
  rationale: चुना हुआ रूप स्पष्ट करता है कि पहले बताए गए नियत समय पर जन्म हुआ। ‘ठीक उसी’ पूर्ति-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अतिरिक्त सैद्धांतिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक गद्य। ‘गर्भवती हुई’ और ‘जन्म दिया’ सामान्य पाठकों के लिए स्पष्ट हैं; ‘नियत समय’ मूल के निर्धारित समय के भाव को बनाए रखता है।
