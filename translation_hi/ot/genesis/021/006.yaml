base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/006.yaml
  text: And Sarah said[a], “God has made laughter for me; everyone who hears will laugh with me.”
translation:
  language: hi
  text: और सारा ने कहा, “परमेश्वर ने मेरे लिए हँसी की है; जो कोई सुनेगा, वह मेरे साथ हँसेगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझ पर हँसेगा” अथवा “मेरे लिए हँसेगा।” इब्रानी में ये अर्थ भी संभव हैं, पर इस प्रसंग में सारा के साथ आनंद से हँसना सबसे अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: और ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘और’ इब्रानी प्रवाह को सहज हिन्दी में बनाए रखता है।
- source_word: שָׂרָה
  choice: सारा
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: צְחֹק
  choice: हँसी
  rationale: संज्ञा का सीधा और स्वाभाविक अनुवाद; आगे के יִצְחַק तथा इसहाक के नाम से जुड़े शब्द-खेल को बनाए रखता है।
- source_word: עָשָׂה לִי
  choice: मेरे लिए ... उत्पन्न की है
  rationale: शाब्दिक भाव ‘मेरे लिए बनाया/किया’ है; हँसी के साथ ‘उत्पन्न की’ आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर द्वारा हर्ष का कारण देने का भाव रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ एकमात्र परमेश्वर का उल्लेख है; हिन्दी बाइबलीय भाषा में यह स्पष्ट और प्रतिष्ठित रूप है।
- source_word: כָּל הַשֹּׁמֵעַ
  choice: जो कोई यह सुनेगा
  rationale: एकवचन रूप का अर्थ वितरणात्मक है। हिन्दी में कर्म ‘यह’ जोड़ने से आशय स्वाभाविक रूप से स्पष्ट होता है।
- source_word: יִצְחַק
  choice: हँसेगा
  rationale: मूल धातु ‘हँसना’ को बनाए रखकर צְחֹק और इसहाक के नाम से जुड़ा शब्द-खेल सुरक्षित रहता है।
- source_word: לִי
  choice: मेरे साथ
  rationale: पूर्वसर्ग का मूल विस्तार ‘मेरे लिए/मुझ पर/मेरे साथ’ जैसी छटाएँ स्वीकार करता है। जन्मोत्सव के संदर्भ में सहभागी हर्ष सर्वाधिक संभावित है, पर विकल्प पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: अंतिम पदबंध יִצְחַק לִי का अर्थ
  choice: साझे आनन्द की हँसी—‘मेरे साथ हँसेगा’
  alternative: ‘मुझ पर हँसेगा’ अथवा ‘मेरे लिए हँसेगा’
  rationale: इसहाक के जन्म और पहले खंड में परमेश्वर द्वारा हँसी उत्पन्न करने का सकारात्मक संदर्भ सहभागी आनन्द का समर्थन करता है। फिर भी इब्रानी לִי अर्थ की एक से अधिक छटाएँ संभव करता है, इसलिए वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। ‘हँसी/हँसेगा’ की पुनरावृत्ति जानबूझकर रखी गई है ताकि मूल का शब्द-खेल बना रहे।
