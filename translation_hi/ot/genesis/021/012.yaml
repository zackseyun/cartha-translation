id: GEN.21.12
reference: Genesis 21:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֶל אַבְרָהָ֗ם אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ עַל הַ/נַּ֣עַר וְ/עַל אֲמָתֶ֔/ךָ כֹּל֩ אֲשֶׁ֨ר תֹּאמַ֥ר אֵלֶ֛י/ךָ שָׂרָ֖ה שְׁמַ֣ע בְּ/קֹלָ֑/הּ כִּ֣י בְ/יִצְחָ֔ק יִקָּרֵ֥א לְ/ךָ֖ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/012.yaml
  text: But God said to Abraham[a], “Do not let it be grievous in your sight because of the boy and because of your servant woman. Whatever Sarah says to you, listen to her voice[d][c][b], for through Isaac your offspring will be called.”
translation:
  language: hi
  text: परन्तु परमेश्वर ने अब्राहम से कहा, “उस लड़के और अपनी दासी के कारण मन में बुरा न मान। सारा तुझसे जो कुछ कहती है, उसकी बात मान,[a] क्योंकि इसहाक के द्वारा ही तेरी सन्तान कहलाएगी।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी आवाज़ सुन”; अर्थात् सारा जो कहती है, उस पर ध्यान देकर उसे मान।
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि इसहाक में तेरी सन्तान कहलाएगी”; भाव यह है कि अब्राहम की नामित वंश-रेखा इसहाक के द्वारा पहचानी जाएगी।
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרַע בְּעֵינֶיךָ
  choice: मन में बुरा न मान
  rationale: यह आधुनिक हिन्दी में स्वाभाविक मुहावरा है और किसी बात से दुखी या अप्रसन्न होने के इब्रानी भाव को व्यक्त करता है।
- source_word: הַנַּעַר
  choice: उस लड़के
  rationale: सन्दर्भ में यह इश्माएल को सूचित करता है; ‘लड़का’ נַעַר का सहज आधुनिक हिन्दी रूप है।
- source_word: אֲמָתֶךָ
  choice: अपनी दासी
  rationale: ‘दासी’ अधीन और बन्धित सामाजिक स्थिति को ‘सेविका’ की अपेक्षा अधिक स्पष्ट रखता है, यद्यपि हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: שְׁמַע בְּקֹלָהּ
  choice: उसकी बात मान
  rationale: शाब्दिक ‘उसकी आवाज़ सुन’ हिन्दी में केवल सुनने की क्रिया समझी जा सकती है; यहाँ मुहावरे का अर्थ सारा की कही बात पर ध्यान देकर उसे मानना है।
- source_word: בְּיִצְחָק
  choice: इसहाक के द्वारा ही
  rationale: בְּ वंश-रेखा के माध्यम को दर्शाता है; ‘ही’ सन्दर्भगत बल को सामने लाता है कि नामित वंश इसहाक के द्वारा चलेगा।
- source_word: יִקָּרֵא לְךָ זָרַע
  choice: तेरी सन्तान कहलाएगी
  rationale: यह ‘बुलाई/नामित की जाएगी’ की मूल क्रिया को बनाए रखते हुए अब्राहम से सम्बद्ध मानी जाने वाली वंश-रेखा का भाव देता है।
- source_word: זָרַע
  choice: सन्तान
  rationale: ‘सन्तान’ हिन्दी में सामूहिक एकवचन की तरह प्रयुक्त हो सकता है और इब्रानी זֶרַע की सामूहिक अस्पष्टता को ‘वंशजों’ से बेहतर सुरक्षित रखता है।
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: परन्तु परमेश्वर ने ... कहा
  rationale: पूर्ववर्ती पद में अब्राहम के अत्यन्त दुखी होने के विपरीत परमेश्वर का उत्तर आता है; ‘परन्तु’ इस प्रसंगगत विरोध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: हाजिरा की सामाजिक स्थिति
  choice: अपनी दासी
  alternative: अपनी सेविका
  rationale: मूल אָמָה केवल घरेलू सेवा नहीं, अधीन/बन्धित स्थिति भी सूचित करता है। ‘दासी’ उस कठोर सामाजिक वास्तविकता को अनावश्यक रूप से नरम नहीं करता।
- issue: प्रतिज्ञा के वंश का अर्थ
  choice: इसहाक के द्वारा ही तेरी सन्तान कहलाएगी
  alternative: इसहाक में तेरी सन्तान कहलाएगी
  rationale: चुना हुआ रूप यह स्पष्ट करता है कि अब्राहम की नामित प्रतिज्ञात्मक वंश-रेखा इसहाक के माध्यम से पहचानी जाएगी, पर इश्माएल से उसके जैविक सम्बन्ध को नकारने वाली व्याख्या नहीं जोड़ता। ‘कहलाएगी’ मूल के calling/designation भाव और उसकी धार्मिक-विचारगत कसावट को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण बाइबलीय गद्य। सम्बोधन में एकवचन ‘तू’ के रूप (‘तुझसे’, ‘तेरी’) रखे गए हैं, जो इस प्रत्यक्ष ईश्वरीय सम्बोधन में पारम्परिक और स्पष्ट हैं। ‘परन्तु’ तथा ‘सन्तान’ जैसे शब्द सामान्य पाठक के लिए बोधगम्य रहते हुए औपचारिक गरिमा बनाए रखते हैं।
