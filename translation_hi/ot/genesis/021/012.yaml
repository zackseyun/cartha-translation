  source_fidelity: 'The Hindi accurately represents the Hebrew: God''s contrasting reply, the boy, Hagar''s bonded status as Abraham''s dāsī, Sarah''s instruction, and the designation of Abraham''s offspring through Isaac are all retained. “मन में बुरा न मान” is an idiomatic and faithful rendering of the distress/displeasure idiom, while “इसहाक के द्वारा ही” appropriately communicates the lineage-related force of בְּיִצְחָק in context without making an additional doctrinal claim.'
  naturalness: The text is fluent modern standard Hindi with suitably elevated biblical register. The direct singular forms are internally consistent and natural for divine address. “उसकी बात मान” naturally conveys the Hebrew idiom “listen to her voice” in Hindi.
  terminology: “दासी” preserves the subordinate/bonded social status of אָמָה better than a softened service term. “सन्तान” suitably preserves the collective force of זֶרַע, and “कहलाएगी” retains the source’s designation/calling language. Names and theological language are consistent and clear.
