lexical_decisions:
- source_word: וַיַּצֵּב
  choice: अलग खड़ा किया
  rationale: हिफ़ील क्रिया का मूल भाव किसी वस्तु को खड़ा करने या विशिष्ट स्थान पर रखने का है। संदर्भ में मेम्नियों को बाकी झुंड से अलग रखने का भाव भी है; इसलिए यह अभिव्यक्ति ठोस क्रिया और पृथक्करण दोनों को स्वाभाविक हिन्दी में रखती है।
- source_word: אַבְרָהָם
  choice: अब्राहम
  rationale: व्यक्तिनाम का हिन्दी बाइबल परंपरा में प्रचलित लिप्यंतरण।
- source_word: אֶת
  choice: '[सीधे कर्म का चिह्न; अनूदित नहीं]'
  rationale: हिब्रू के सीधे कर्म-सूचक का हिन्दी में स्वतंत्र शब्दगत समकक्ष नहीं है; अर्थ वाक्य-विन्यास से व्यक्त होता है।
- source_word: שֶׁבַע
  choice: सात
  rationale: संज्ञा को विशेषित करने वाली सामान्य गणनावाचक संख्या।
- source_word: כִּבְשֹׂת
  choice: मादा मेम्नियों
  rationale: यह शब्द विशेष रूप से छोटी मादा भेड़ों को दर्शाता है। ‘मादा मेम्नियाँ’ लिंग और कम आयु—दोनों संकेतों को स्पष्ट रखता है।
- source_word: הַצֹּאן
  choice: झुंड की
  rationale: צֹאן छोटे पालतू पशुओं, प्रायः भेड़-बकरियों, के सामूहिक झुंड को दर्शाता है। ‘झुंड’ मूल की व्यापकता को अनावश्यक रूप से केवल भेड़ों तक सीमित नहीं करता।
- source_word: לְבַדְּהֶן
  choice: अलग
  rationale: यह स्त्रीलिंग बहुवचन रूप उन सात मेम्नियों को शेष पशुओं से पृथक रखने का संकेत देता है। हिन्दी में ‘अलग’ संक्षिप्त और स्वाभाविक है।
