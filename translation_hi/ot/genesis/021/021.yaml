  yaml_path: translation/ot/genesis/021/021.yaml
  text: He lived in the wilderness of Paran[b][a], and his mother took a wife for him from the land of Egypt.
translation:
  language: hi
  text: वह पारान के जंगल में रहने लगा[a], और उसकी माँ ने उसके लिए मिस्र देश से एक पत्नी चुनी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह पारान के जंगल में रहता था।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसके लिए मिस्र देश से एक स्त्री ली”; संदर्भ विवाह की व्यवस्था का है, इसलिए मुख्य पाठ में “पत्नी चुनी” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: ישׁב यहाँ निवास करने का अर्थ देता है। संदर्भ में घटनाक्रम आगे बढ़ रहा है, इसलिए ‘रहने लगा’ स्वाभाविक है और स्थायी बसावट का अनावश्यक संकेत नहीं देता।
- source_word: בְּמִדְבַּר פָּארָן
  choice: पारान के निर्जन प्रदेश में
  rationale: מִדְבָּר किसी निर्जन, कम आबाद या चरागाही भूभाग को सूचित कर सकता है; ‘निर्जन प्रदेश’ हिंदी में अर्थ की इस व्यापकता को ‘रेगिस्तान’ से बेहतर सुरक्षित रखता है। פָּארָן को स्थान-नाम के रूप में ‘पारान’ लिखा गया है।
- source_word: וַתִּקַּח
  choice: ली
  rationale: לקח का मूल अर्थ ‘लेना’ है। यहाँ माँ द्वारा विवाह-संबंध कराने का प्रसंग है; मुख्य पाठ स्रोत की अभिव्यक्ति के निकट रहता है, जबकि पादटिप्पणी आशय स्पष्ट करती है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: ל־ के साथ सर्वनाम यहाँ लाभ अथवा संबंध बताता है; हिंदी में ‘उसके लिए’ स्वाभाविक और सटीक है।
- source_word: אִמּוֹ
  choice: उसकी माँ
  rationale: मूल पाठ के स्पष्ट संबंधवाचक पद को यथावत रखा गया है।
- source_word: אִשָּׁה
  choice: एक पत्नी
  rationale: אִשָּׁה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। विवाह की व्यवस्था के इस संदर्भ में ‘पत्नी’ अभिप्रेत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: मूल में אֶרֶץ, ‘देश/भूमि’, स्पष्ट रूप से है। ‘मिस्र देश से’ इसे बनाए रखते हुए सहज आधुनिक हिंदी देता है।
