  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔וא וַ/יֹּ֣אמֶר אֲבִימֶ֗לֶךְ וּ/פִיכֹל֙ שַׂר צְבָא֔/וֹ אֶל אַבְרָהָ֖ם לֵ/אמֹ֑ר אֱלֹהִ֣ים עִמְּ/ךָ֔ בְּ/כֹ֥ל אֲשֶׁר אַתָּ֖ה עֹשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/022.yaml
  text: And it happened at that time that Abimelech and Phicol[a], the commander of his army, said to Abraham[b], “God is with you in all that you do.”
translation:
  language: hi
  text: उस समय ऐसा हुआ कि अबीमेलेक और पीकोल, जो उसकी सेना का सेनापति था, ने अब्राहम से कहा, “तुम जो कुछ करते हो, उसमें परमेश्वर[a] तुम्हारे साथ है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, संदर्भ में कम सम्भव: “कोई देवता तुम्हारे साथ है।” हिब्रू אֱלֹהִים का कुछ प्रसंगों में भिन्न अर्थ हो सकता है, पर यहाँ सबसे स्वाभाविक अर्थ उस परमेश्वर का है जो अब्राहम को आशीष देता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ
  rationale: यह नया कथात्मक दृश्य आरम्भ करने वाला रूप है; ‘ऐसा हुआ’ उसके कार्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בָּעֵת הַהִוא
  choice: उस समय
  rationale: यह मानक कालवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: אֲבִימֶלֶךְ וּפִיכֹל
  choice: अबीमेलेक और ... पीकोल
  rationale: व्यक्तिवाचक नामों का स्रोत उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: שַׂר צְבָאוֹ
  choice: उसकी सेना के प्रधान
  rationale: שַׂר अधिकारी अथवा प्रधान को और צָבָא यहाँ सैन्य बल को दर्शाता है; यह रूप स्पष्ट, गरिमापूर्ण और सहज हिन्दी है।
- source_word: וַיֹּאמֶר ... אֶל־אַבְרָהָם לֵאמֹר
  choice: ने अब्राहम से कहा
  rationale: हिब्रू का एकवचन कथात्मक क्रियारूप पश्चवर्ती संयुक्त कर्ता के साथ आता है। हिन्दी में संयुक्त कर्ता के अनुसार बहुवचन क्रिया स्वाभाविक है; לֵאמֹר को अलग से ‘यह कहते हुए’ करना अनावश्यक पुनरुक्ति होता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में यह अब्राहम के साथ रहने और उसे आशीष देने वाले एकमात्र परमेश्वर का स्वाभाविक संदर्भ है।
- source_word: עִמְּךָ
  choice: तुम्हारे साथ है
  rationale: यह उपस्थिति तथा सहायता का सामान्य और सीधा हिन्दी रूप है।
- source_word: בְּכֹל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: तुम जो कुछ करते हो, उसमें
  rationale: यह व्यापक दायरे को व्यक्त करता है और हिब्रू कृदन्त को सामान्य वर्तमान के रूप में स्वाभाविक ढंग से प्रस्तुत करता है।
theological_decisions:
- issue: अबीमेलेक के कथन में אֱלֹהִים का संदर्भ
  choice: परमेश्वर
  alternative: कोई देवता / देवगण
  rationale: शब्द का रूप कुछ प्रसंगों में बहुवचन अथवा अनिश्चित अर्थ दे सकता है, पर यहाँ कथा-संदर्भ अब्राहम पर परमेश्वर की कृपा और संगति को पहचानने की ओर संकेत करता है। इसलिए ‘परमेश्वर’ सबसे स्वाभाविक पाठ है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। हिब्रू वाक्य-विन्यास की अनावश्यक पुनरुक्ति को लक्ष्य भाषा में नहीं दोहराया गया, पर अर्थ और कथात्मक क्रम सुरक्षित हैं।
