- source_word: בְּאֵר שָׁבַע
  choice: बेर्शेबा
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है; उससे जुड़ी ‘कुआँ’, ‘सात’ और ‘शपथ’ की शब्द-क्रीड़ा पादटिप्पणी में स्पष्ट की गई है।
- source_word: כִּי שָׁם
  choice: क्योंकि वहाँ
  rationale: यह नामकरण का कारण और उसका स्थान सीधे व्यक्त करता है।
- source_word: נִשְׁבְּעוּ
  choice: शपथ खाई थी
  rationale: निफ़अल रूप का अर्थ ‘शपथ खाना’ है; हिन्दी में यह स्वाभाविक मुहावरा है और नाम के साथ जुड़ी शब्द-क्रीड़ा को बनाए रखता है।
- source_word: שְׁנֵיהֶם
  choice: उन दोनों ने
  rationale: यह इब्रानी में दोनों पक्षों पर दिए गए स्पष्ट बल को सहज हिन्दी में सुरक्षित रखता है।
