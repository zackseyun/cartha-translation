lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह कारण और उसके परिणाम को जोड़ने वाली इब्रानी अभिव्यक्ति है; ‘इसलिए’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: קָרָא לַמָּקוֹם הַהוּא
  choice: उस स्थान का नाम ... रखा
