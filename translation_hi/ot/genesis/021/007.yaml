base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/007.yaml
  text: And she said[b][a], “Who would have said to Abraham that Sarah would nurse children? For I have borne a son in his old age.”
translation:
  language: hi
  text: और उसने कहा[b], “किसने अब्राहम से कहा होता कि सारा बच्चों को दूध पिलाएगी?[a] क्योंकि मैंने अब्राहम की वृद्धावस्था में एक पुत्र को जन्म दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘पुत्रों को दूध पिलाएगी’ है। यहाँ बहुवचन कथन को सामान्य रूप देता है, जबकि अगले वाक्यांश में जन्मी संतान को ‘एक पुत्र’ कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘किसने अब्राहम से कहा था कि सारा पुत्रों को स्तनपान कराएगी?’
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: और उसने कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; यह रूप इब्रानी प्रवाह को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: מִי מִלֵּל לְאַבְרָהָם
  choice: किसने अब्राहम से कहा होता
  rationale: यह अलंकारिक प्रश्न अप्रत्याशित घटना पर विस्मय प्रकट करता है; संभावनार्थक भूतकाल उस भाव को सुरक्षित रखता है।
- source_word: הֵינִיקָה
  choice: दूध पिलाएगी
  rationale: ינק के हिफ़ील रूप का अर्थ शिशु को स्तनपान कराना है; सामान्य आधुनिक हिंदी में ‘दूध पिलाना’ स्वाभाविक और स्पष्ट है।
- source_word: בָנִים
  choice: बच्चों
  rationale: शाब्दिक अर्थ ‘पुत्रों’ है, किंतु दूध पिलाने के संदर्भ में बहुवचन कथन को सामान्य बनाता है; अगले वाक्यांश में विशिष्ट संतान को ‘एक पुत्र’ कहा गया है।
- source_word: שָׂרָה
  choice: सारा
  rationale: व्यक्तिनाम का मानक हिंदी लिप्यंतरण।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पिछले विस्मयपूर्ण कथन का कारण अथवा आधार प्रस्तुत करता है, विरोध नहीं।
- source_word: יָלַדְתִּי
  choice: मैंने ... जन्म दिया है
  rationale: पूर्ण क्रिया के वर्तमान-परिणामी भाव को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: בֵן
  choice: एक पुत्र
  rationale: בן का सीधा पारिवारिक अर्थ सुरक्षित रखता है और गरिमापूर्ण हिंदी के अनुरूप है।
- source_word: לִזְקֻנָיו
  choice: उसके बुढ़ापे में
  rationale: यह पद अब्राहम की वृद्धावस्था में जन्म होने का समय बताता है; हिंदी में यही स्वाभाविक अभिव्यक्ति है।
