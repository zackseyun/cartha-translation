  text: The boy grew and was weaned[b][a], and Abraham made a great feast on the day Isaac was weaned.
translation:
  language: hi
  text: बालक बड़ा हुआ और उसका दूध छुड़ाया गया। जिस दिन इसहाक का दूध छुड़ाया गया, उस दिन अब्राहम ने एक बड़ा भोज दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל הַיֶּלֶד
  choice: बालक बड़ा हुआ
  rationale: यहाँ גדל बच्चे की शारीरिक वृद्धि और परिपक्वता को दर्शाता है; הַיֶּלֶד के लिए ‘बालक’ स्वाभाविक, गरिमापूर्ण और आयु के विषय में पर्याप्त रूप से व्यापक है।
- source_word: וַיִּגָּמַל
  choice: उसका दूध छुड़ाया गया
  rationale: גמל के निफ़अल रूप का संदर्भगत अर्थ स्तनपान छुड़ाया जाना है। ‘उसका’ जोड़ने से हिन्दी में वाक्य स्वाभाविक और अर्थ स्पष्ट होता है।
- source_word: וַיַּעַשׂ
  choice: दिया
  rationale: भोज के साथ आधुनिक हिन्दी में ‘भोज दिया’ स्वाभाविक प्रयोग है और यहाँ עשה के आयोजन/करने के भाव को व्यक्त करता है।
- source_word: מִשְׁתֶּה גָדוֹל
  choice: एक बड़ा भोज
  rationale: מִשְׁתֶּה उत्सवपूर्ण भोज को और גָדוֹל उसके बड़े स्वरूप को दर्शाता है; ‘बड़ा भोज’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: בְּיוֹם הִגָּמֵל אֶת יִצְחָק
  choice: जिस दिन इसहाक का दूध छुड़ाया गया, उस दिन
  rationale: यह रूप हिब्रू की समय-सूचक रचना को स्पष्ट हिन्दी में सुरक्षित रखता है। אֶת के बावजूद प्रसंग और पहले आए निफ़अल से घटना इसहाक के दूध छुड़ाए जाने की है।
