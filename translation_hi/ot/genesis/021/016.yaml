base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/016.yaml
  text: Then she went and sat down opposite him[a], at a distance, about a bowshot away, for she said, “Let me not look on the death of the boy.” So she sat opposite him and lifted up her voice and wept.
translation:
  language: hi
  text: तब वह जाकर उससे दूर, लगभग तीर की मार की दूरी पर, उसके सामने बैठ गई; क्योंकि उसने कहा, “मैं लड़के को मरते हुए न देखूँ।” फिर वह उसके सामने बैठी और अपनी आवाज़ उठाकर रोने लगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: उसके सामने
  rationale: यह पद सामने या आमने-सामने, कुछ दूरी पर होने का भाव देता है। निकटवर्ती הַרְחֵק दूरी को स्पष्ट करता है; दोनों बार एक ही हिन्दी अभिव्यक्ति रखकर इब्रानी पुनरावृत्ति बचाई गई है।
- source_word: הַרְחֵק
  choice: कुछ दूरी पर
  rationale: रחק का यह क्रियाविशेषणात्मक रूप दूरी पर होने का भाव प्रबल करता है; आधुनिक हिन्दी में ‘कुछ दूरी पर’ स्वाभाविक है।
- source_word: כִּמְטַחֲוֵי קֶשֶׁת
  choice: लगभग एक तीर की मार जितनी दूर
  rationale: यह धनुष से छोड़े गए तीर की पहुँच के आधार पर अनुमानित दूरी बताने वाला मुहावरा है।
- source_word: הַיָּלֶד
  choice: लड़का
  rationale: יֶלֶד बालक या किशोर लड़के को सूचित कर सकता है; प्रसंग में इश्माएल के लिए ‘लड़का’ सहज और आयु की दृष्टि से उपयुक्त है।
- source_word: אַל אֶרְאֶה בְּמוֹת הַיָּלֶד
  choice: मैं लड़के को मरते हुए न देखूँ
  rationale: नकारात्मक प्रथम-पुरुष इच्छासूचक कथन को स्वाभाविक हिन्दी में रखा गया है। यह ‘लड़के की मृत्यु न देखूँ’ की अपेक्षा घटना को देखने का आशय अधिक स्पष्ट करता है, जबकि मूल का भाव सुरक्षित रहता है।
- source_word: וַתִּשָּׂא אֶת־קֹלָהּ וַתֵּבְךְּ
  choice: फूट-फूटकर रोने लगी
  rationale: शाब्दिक रूप से ‘उसने अपनी आवाज़ उठाई और रोई’; हिन्दी का यह स्वाभाविक विलाप-सूचक मुहावरा ऊँचे स्वर से रोने की संयुक्त क्रिया व्यक्त करता है।
- source_word: לָהּ
  choice: बैठ गई
  rationale: यह नैतिक/हितार्थक सम्प्रदानवाचक सर्वनाम है, जिसे हिन्दी में अलग शब्द देना आवश्यक नहीं; ‘अपने लिए’ या ‘अकेली’ जोड़ने से मूल से अधिक अर्थ निश्चित हो सकता है।
