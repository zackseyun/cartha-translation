base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/019.yaml
  text: Then God opened her eyes[a], and she saw a well of water. She went and filled the skin with water and gave the boy a drink.
translation:
  language: hi
  text: तब परमेश्वर ने उसकी आँखें खोल दीं, और उसने पानी का एक कुआँ देखा। वह गई और मशक[a] में पानी भरकर लड़के को पिलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात तरल पदार्थ ले जाने के लिए पशु-चर्म से बना पात्र।
    reason: ‘मशक’ के सांस्कृतिक रूप से कम परिचित अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּפְקַח
  choice: खोल दीं
  rationale: פקח का सामान्य अर्थ आँखें ‘खोलना’ है। यह चयन इब्रानी मुहावरे और परमेश्वर की प्रत्यक्ष क्रिया—दोनों को बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ एकवचन क्रिया के साथ कथा के एकमात्र परमेश्वर का उल्लेख है; आधुनिक हिन्दी बाइबलीय शैली में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: עֵינֶיהָ
  choice: उसकी आँखें
  rationale: इब्रानी बहुवचन और स्त्रीलिंग संबंधसूचक प्रत्यय का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: וַתֵּרֶא
  choice: उसने ... देखा
  rationale: ראה की सामान्य दृष्टि-संबंधी क्रिया को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: בְּאֵר מָיִם
  choice: पानी का एक कुआँ
  rationale: इब्रानी संबंध-पदबंध ‘पानी का कुआँ’ को बनाए रखता है और प्रसंग में पानी मिलने पर बल देता है।
- source_word: וַתֵּלֶךְ
  choice: वह गई
  rationale: कथा में अगली गति को सरल और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַתְּמַלֵּא
  choice: भरकर
  rationale: מלא का अर्थ ‘भरना’ है; हिन्दी में अगली क्रिया से जोड़ने के लिए ‘भरकर’ स्वाभाविक है और घटनाक्रम सुरक्षित रहता है।
- source_word: הַחֵמֶת
  choice: मशक
  rationale: חֵמֶת तरल पदार्थ ले जाने के लिए पशु-चर्म से बने पात्र को दर्शाता है। ‘मशक’ इसका सटीक और संक्षिप्त हिन्दी शब्द है।
- source_word: מַיִם
  choice: पानी
  rationale: सामान्य आधुनिक हिन्दी में מַיִם का स्पष्ट और स्वाभाविक रूप।
- source_word: וַתַּשְׁקְ
  choice: पिलाया
  rationale: שׁקה के हिफ़ील रूप का अर्थ ‘पीने को देना’ है; ‘पिलाया’ हिन्दी में उसके कारक भाव को संक्षेप और स्वाभाविकता से व्यक्त करता है।
- source_word: הַנַּעַר
  choice: लड़के
  rationale: प्रसंग में यह हाजिरा के पुत्र इश्माएल को दर्शाता है; ‘लड़का’ आधुनिक हिन्दी में आयु-संदर्भ के लिए सहज है।
theological_decisions:
- issue: ‘परमेश्वर ने उसकी आँखें खोल दीं’ को प्रत्यक्ष ईश्वरीय क्रिया के रूप में रखना या पहले से मौजूद कुएँ पर ध्यान जाने के रूप में समझाना
  choice: परमेश्वर ने उसकी आँखें खोल दीं
  alternative: परमेश्वर ने उसे कुआँ देखने योग्य किया / उसका ध्यान कुएँ पर दिलाया
  rationale: इब्रानी पाठ क्रिया को स्पष्ट रूप से परमेश्वर से जोड़ता है और आँखें खोलने का मुहावरा इस्तेमाल करता है। अनुवाद क्रिया की विधि समझाए बिना इसी धर्मवैचारिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। वाक्यरचना स्वाभाविक रखी गई है, जबकि ‘आँखें खोल दीं’ और ‘पानी का एक कुआँ’ जैसे स्रोत-पाठ के प्रमुख रूप सुरक्षित हैं।
