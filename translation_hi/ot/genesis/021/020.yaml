base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/020.yaml
  text: God was with the boy[a], and he grew. He lived in the wilderness and became an archer.
translation:
  language: hi
  text: परमेश्वर उस लड़के के साथ था, और वह बड़ा हुआ। वह निर्जन प्रदेश में रहने लगा और धनुर्धर बन गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אֱלֹהִים אֶת הַנַּעַר
  choice: परमेश्वर उस लड़के के साथ था
  rationale: היה את का मुहावरा यहाँ उपस्थिति और सहारा व्यक्त करता है। “के साथ था” इसे स्वाभाविक रूप से रखता है और परमेश्वर की देखभाल को अनावश्यक रूप से विस्तार नहीं देता।
- source_word: וַיִּגְדָּל
  choice: वह बड़ा हुआ
  rationale: संदर्भ में גדל लड़के के बढ़ने और परिपक्व होने को बताता है; यह संक्षिप्त और सहज हिन्दी है।
- source_word: וַיֵּשֶׁב בַּמִּדְבָּר
  choice: वह निर्जन प्रदेश में रहने लगा
  rationale: ישב निवास करने को और מִדְבָּר कम आबादी वाले वन्य अथवा शुष्क भूभाग को दर्शाता है। “निर्जन प्रदेश” केवल रेतीले रेगिस्तान तक अर्थ को सीमित नहीं करता। कथाक्रम में “रहने लगा” आरम्भ होकर जारी रहने वाले निवास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיְהִי רֹבֶה קַשָּׁת
  choice: धनुर्धर बन गया
  rationale: यह कठिन हिब्रू पदबंध धनुष चलाने वाले व्यक्ति का बोध कराता है। “धनुर्धर” आधुनिक हिन्दी में संक्षिप्त, स्पष्ट और अर्थानुकूल है।
theological_decisions:
- issue: इश्माएल के संदर्भ में परमेश्वर की उपस्थिति
  choice: परमेश्वर उस लड़के के साथ था
  alternative: परमेश्वर उस लड़के की सहायता करता था
  rationale: मूल पाठ परमेश्वर की उपस्थिति अथवा सहारे की पुष्टि करता है, पर उसके व्यापक धर्मवैज्ञानिक अर्थ नहीं खोलता। “साथ था” मूल अभिव्यक्ति और उसके तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। “धनुर्धर” प्रचलित तथा सटीक है; “निर्जन प्रदेश” מִדְבָּר के व्यापक भू-दृश्य को “रेगिस्तान” की अपेक्षा बेहतर सुरक्षित रखता है।
