base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/032.yaml
  text: So they made a covenant at Beer-sheba[a], and Abimelech rose up with Phicol, the commander of his army, and they returned to the land of the Philistines.
translation:
  language: hi
  text: इस प्रकार उन्होंने बेर्शेबा में वाचा बाँधी[a]। तब अबीमेलेक और उसकी सेना का प्रधान पीकोल उठे और पलिश्तियों के देश को लौट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “वाचा काटी”; यह वाचा बाँधने का एक मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ בְרִית
  choice: उन्होंने वाचा बाँधी
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘वाचा काटना’ है। आधुनिक हिन्दी में ‘वाचा बाँधना’ स्वाभाविक, गरिमापूर्ण और अर्थ के निकट है।
- source_word: בִּבְאֵר שָׁבַע
  choice: बेर्शेबा में
  rationale: यहाँ ב स्थान बताता है; हिन्दी में नगर के साथ ‘में’ सहज है। स्थाननाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: וַיָּקָם
  choice: उठे
  rationale: קום का मूल भाव उठना है। संयुक्त कर्ता अबीमेलेक और पीकोल के कारण हिन्दी में आदरसूचक/बहुवचन क्रिया सहज है।
- source_word: שַׂר צְבָאוֹ
  choice: उसकी सेना का प्रधान
  rationale: שַׂר नेता, प्रधान या सेनापति को और צָבָא सैन्यबल को सूचित करता है। ‘सेना का प्रधान’ पद की सैन्य नेतृत्व-भूमिका स्पष्ट रखता है।
- source_word: וַיָּשֻׁבוּ
  choice: लौट गए
  rationale: इस प्रसंग में שׁוּב का अर्थ पहले के स्थान की ओर वापस जाना है; ‘लौट गए’ स्वाभाविक हिन्दी कथात्मक प्रयोग है।
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: पलिश्तियों के देश को
  rationale: यह इब्रानी की जातीय-भौगोलिक अभिव्यक्ति ‘पलिश्तियों का देश’ को बनाए रखता है; אֶל की दिशात्मकता ‘को’ से व्यक्त होती है।
- source_word: וּפִיכֹל
  choice: और ... पीकोल
  rationale: इब्रानी संयोजक ו को सीधे ‘और’ से व्यक्त किया गया है। अगले बहुवचन क्रियापद से स्पष्ट है कि अबीमेलेक और पीकोल दोनों लौटे।
