source:
  edition: WLC
  text: וַֽ/יהוָ֛ה פָּקַ֥ד אֶת שָׂרָ֖ה כַּ/אֲשֶׁ֣ר אָמָ֑ר וַ/יַּ֧עַשׂ יְהוָ֛ה לְ/שָׂרָ֖ה כַּ/אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/001.yaml
  text: Yahweh visited Sarah as he had said[a], and Yahweh did for Sarah as he had spoken.
translation:
  language: hi
  text: याहवे ने सारा की सुधि ली[a], जैसा उसने कहा था; और याहवे ने सारा के लिए वैसा ही किया, जैसा उसने कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारा की ओर ध्यान दिया।” इब्रानी क्रिया का अर्थ हो सकता है कि परमेश्वर किसी व्यक्ति की ओर ध्यान देकर उसके पक्ष में कार्य करे।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: פָּקַד
  choice: सुधि ली
  rationale: इस प्रसंग में क्रिया का अर्थ केवल याद करना या मिलने आना नहीं, बल्कि सारा की ओर ध्यान देकर उसके पक्ष में प्रभावी ढंग से कार्य करना है। प्रचलित और स्वाभाविक हिन्दी मुहावरा इस भाव को संक्षेप में व्यक्त करता है।
- source_word: אֶת שָׂרָה
  choice: सारा
  rationale: प्रत्यक्ष कर्म-सूचक אֶת का हिन्दी में अलग शब्द नहीं रखा गया; नाम का मानक हिन्दी रूप अपनाया गया है।
- source_word: כַּאֲשֶׁר אָמָר
  choice: जैसा उसने कहा था
  rationale: यह वाक्यांश पहले कही गई ईश्वरीय बात की ओर लौटता है; ‘था’ पूर्व कथन और अब उसकी पूर्ति का संबंध स्पष्ट करता है।
- source_word: וַיַּעַשׂ
  choice: किया
  rationale: मूल की व्यापक क्रिया को बिना परिणाम पहले से स्पष्ट किए सरल और व्यापक रखा गया है।
- source_word: לְשָׂרָה
  choice: सारा के लिए
  rationale: यहाँ לְ हितार्थक है और सारा के पक्ष में किए गए कार्य को दर्शाता है।
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: जैसा उसने कहा था
  rationale: हिन्दी में ‘बोला था’ यहाँ अस्वाभाविक लगता है और ‘वचन दिया था’ अर्थ को विशेष रूप से प्रतिज्ञा तक सीमित कर देता है; इसलिए मूल समानांतरता को स्वाभाविक हिन्दी में दोहराया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: פָּקַד में ईश्वरीय हस्तक्षेप का स्वरूप
  choice: सुधि ली
  alternative: भेंट की; ध्यान दिया; कृपादृष्टि की
  rationale: चयन यह दर्शाता है कि याहवे ने सारा की ओर ध्यान देकर उसके लिए कार्य किया, पर अगले पद में बताए गए परिणाम को इस पद में स्पष्ट रूप से जोड़कर मूल से अधिक नहीं कहता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सुधि ली’ सामान्य पाठक के लिए परिचित मुहावरा है, जबकि पादटिप्पणी मूल क्रिया की प्रभावी ईश्वरीय देखरेख का व्यापक अर्थ स्पष्ट करती है। दोनों समानांतर उपवाक्यों में ‘कहा था’ की पुनरावृत्ति हिन्दी में स्वाभाविक है और कृत्रिम पर्याय से बचाती है।
