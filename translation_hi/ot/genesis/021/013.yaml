language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/גַ֥ם אֶת בֶּן הָ/אָמָ֖ה לְ/ג֣וֹי אֲשִׂימֶ֑/נּוּ כִּ֥י זַרְעֲ/ךָ֖ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/013.yaml
  text: And I will also make the son of the servant woman into a nation[a], because he is your offspring.
translation:
  language: hi
  text: और दासी के बेटे को भी मैं एक राष्ट्र बनाऊँगा, क्योंकि वह तेरा वंशज है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: और...भी
  rationale: संयोजक וְ और बलसूचक גַם का योग पिछले कथन की निरंतरता और समावेश दोनों व्यक्त करता है; हिन्दी में विभाजित रचना ‘और...भी’ स्वाभाविक है।
- source_word: אֶת בֶּן הָאָמָה
  choice: दासी के बेटे से
  rationale: בֶּן ‘बेटा’ है और אָמָה ऐसी स्त्री सेविका को दर्शाता है जो पराधीन सामाजिक स्थिति में है। ‘दासी’ आधुनिक हिन्दी में संक्षिप्त और प्रसंगानुकूल है तथा इस स्थिति को ‘सेविका’ की अपेक्षा अधिक स्पष्ट रखता है। ‘से’ आगे के לְגוֹי אֲשִׂימֶנּוּ के साथ परिणामसूचक हिन्दी रचना बनाता है।
- source_word: לְגוֹי
  choice: एक जाति
  rationale: שׂים के साथ לְ परिणाम को दर्शाता है—उससे एक जनसमुदाय/राष्ट्र उत्पन्न करना। बाइबिलीय वंश-समूह के अर्थ में ‘जाति’ प्रचलित और सहज है।
- source_word: אֲשִׂימֶנּוּ
  choice: मैं ... बनाऊँगा
  rationale: שׂים का मूल अर्थ रखना/स्थापित करना है, पर इस संदर्भ में किसी को जाति के रूप में विकसित या स्थापित करने के लिए ‘बनाऊँगा’ सबसे स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह परमेश्वर की प्रतिज्ञा का कारण प्रस्तुत करता है; ‘क्योंकि’ कारण-संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: זַרְעֲךָ
  choice: तेरा वंश
  rationale: זֶרַע यहाँ अब्राहम से उत्पन्न संतान को सामूहिक/वंशगत अर्थ में दर्शाता है। ‘वंश’ हिन्दी बाइबिलीय भाषा में परिचित है और ‘बीज’ की अनावश्यक शब्दशः कठोरता से बचता है।
- source_word: הוּא
  choice: वह ... है
  rationale: स्पष्ट सर्वनाम विषय पर हल्का बल देता है; हिन्दी में ‘वह तेरा वंश है’ इसे बिना अतिशयोक्ति के सुरक्षित रखता है।
theological_decisions:
- issue: אָמָה द्वारा हाजिरा की सामाजिक स्थिति
  choice: दासी
  alternative: सेविका / नौकरानी
  rationale: मूल शब्द अधीन और बंधुआ स्त्री की स्थिति सूचित करता है। ‘दासी’ उस सामाजिक वास्तविकता को नरम किए बिना हिन्दी में गरिमापूर्ण और समझने योग्य है।
- issue: זֶרַע का एकवचन और सामूहिक आयाम
  choice: वंश
  alternative: संतान / वंशज
  rationale: यहाँ इश्माएल अब्राहम से उत्पन्न व्यक्ति है, पर प्रतिज्ञा उसके द्वारा बनने वाली जाति से जुड़ी है। ‘वंश’ मूल की वंशगत व्यापकता बनाए रखता है और अर्थ को केवल एक व्यक्ति तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। संबोधन ‘तेरा’ निकटवर्ती बाइबिलीय संवाद के एकवचन रूप को रखता है। किसी पाद-टिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि ‘दासी’ मूल सामाजिक स्थिति को पर्याप्त स्पष्टता से व्यक्त करता है।
