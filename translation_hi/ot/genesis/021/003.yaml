  text: And Abraham called the name of his son who was born to him[a], whom Sarah bore to him[b], Isaac.
translation:
  language: hi
  text: अब्राहम ने अपने उस पुत्र का नाम इसहाक रखा, जो उसके यहाँ जन्मा था और जिसे सारा ने जन्म दिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת־שֵׁם
  choice: नाम रखा
  rationale: קרא के साथ שֵׁם का अर्थ यहाँ किसी का नाम रखना है। शाब्दिक ‘नाम पुकारा’ की अपेक्षा ‘नाम रखा’ आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: בְּנוֹ
  choice: अपने ... पुत्र
  rationale: प्रत्यय अब्राहम के पुत्र का स्पष्ट बोध कराता है; ‘अपने’ हिन्दी में कर्ता से संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַנּוֹלַד לוֹ
  choice: जो उसके यहाँ जन्मा था
  rationale: यह पद पुत्र का वर्णन करता है। ‘उसके यहाँ जन्मा’ सम्बन्धवाचक לוֹ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲשֶׁר יָלְדָה לּוֹ שָׂרָה
  choice: जिसे सारा ने उसके लिए जन्म दिया था
  rationale: इससे माता के रूप में सारा की पहचान और दोहराया गया सम्बन्धवाचक לוֹ दोनों सुरक्षित रहते हैं, यद्यपि ‘उसके लिए’ हिन्दी में कुछ स्रोत-सन्निकट है।
- source_word: יִצְחָק
  choice: इसहाक
  rationale: यह इस इब्रानी व्यक्तिगत नाम का हिन्दी बाइबल-परंपरा में प्रचलित रूप है।
