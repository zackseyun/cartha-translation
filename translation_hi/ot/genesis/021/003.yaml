revisions:
- from: अब्राहम ने अपने उस पुत्र का नाम इसहाक रखा, जो उसके यहाँ जन्मा था और जिसे सारा ने उसके लिए जन्म दिया था।
  to: अब्राहम ने अपने उस पुत्र का नाम इसहाक रखा, जो उसके यहाँ जन्मा था और जिसे सारा ने जन्म दिया था।
  rationale: The revision retains the Hebrew’s two descriptive clauses and its identification of Sarah as the one who bore the child, while avoiding a misleadingly purposive Hindi rendering of the repeated relational dative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:20:53Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Abraham as the namer, Isaac as the name, and Sarah as the mother. However, “सारा ने उसके लिए जन्म दिया था” makes the Hebrew relational dative sound purpose-oriented (“for his benefit”) in Hindi. The repeated Hebrew לּוֹ need not be reproduced with that misleading idiom.
  naturalness: “नाम रखा” and “जो उसके यहाँ जन्मा था” are natural modern Hindi. Removing “उसके लिए” from the final relative clause produces an idiomatic sentence without sacrificing the verse’s meaning.
  terminology: “अब्राहम,” “सारा,” and “इसहाक” are appropriate established Hindi biblical forms. “पुत्र” suits the dignified register.
  issues:
  - severity: medium
    issue: “जिसे सारा ने उसके लिए जन्म दिया था” is not idiomatic in this context and can imply that Sarah bore the child for Abraham’s benefit.
    rationale: The Hebrew לּוֹ is a relational dative (“bore to him”), not necessarily a purposive expression. Hindi “उसके लिए” commonly conveys purpose or benefit and therefore subtly distorts the nuance.
  revised_text: अब्राहम ने अपने उस पुत्र का नाम इसहाक रखा, जो उसके यहाँ जन्मा था और जिसे सारा ने जन्म दिया था।
  revised_footnotes: []
  revision_rationale: The revision retains the Hebrew’s two descriptive clauses and its identification of Sarah as the one who bore the child, while avoiding a misleadingly purposive Hindi rendering of the repeated relational dative.
