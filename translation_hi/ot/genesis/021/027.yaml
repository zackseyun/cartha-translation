source:
  edition: WLC
  text: וַ/יִּקַּ֤ח אַבְרָהָם֙ צֹ֣אן וּ/בָקָ֔ר וַ/יִּתֵּ֖ן לַ/אֲבִימֶ֑לֶךְ וַ/יִּכְרְת֥וּ שְׁנֵי/הֶ֖ם בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/027.yaml
  text: So Abraham took sheep and cattle and gave them to Abimelech[a], and the two of them made a covenant.
translation:
  language: hi
  text: तब अब्राहम ने भेड़-बकरियाँ और गाय-बैल लेकर अबीमेलेक को दिए, और उन दोनों ने वाचा बाँधी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वाचा काटी”; यह औपचारिक रूप से वाचा बाँधने के लिए प्रयुक्त एक प्रचलित इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लेकर
  rationale: לקח का मूल अर्थ ‘लेना’ है। अगले क्रियापद ‘दिए’ के साथ हिन्दी में ‘लेकर ... दिए’ स्वाभाविक क्रम व्यक्त करता है।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, का सामूहिक शब्द है; ‘भेड़-बकरियाँ’ हिन्दी में इसका स्पष्ट और स्वाभाविक व्यापक रूप है।
- source_word: וּבָקָר
  choice: गाय-बैल
  rationale: בקר बड़े गोवंशीय पालतू पशुओं का सामूहिक शब्द है; ‘गाय-बैल’ आधुनिक हिन्दी में लिंग-समावेशी और सहज अभिव्यक्ति है।
- source_word: וַיִּתֵּן לַאֲבִימֶלֶךְ
  choice: अबीमेलेक को दिए
  rationale: נתן का सामान्य अर्थ ‘देना’ है और ל प्राप्तकर्ता को दर्शाता है। बहुवचन पशुओं के अनुसार ‘दिए’ स्वाभाविक है।
- source_word: שְׁנֵיהֶם
  choice: उन दोनों ने
  rationale: यह इब्रानी में दोनों पक्षों को स्पष्ट करता है; हिन्दी में ‘उन दोनों ने’ संक्षिप्त और स्वाभाविक है।
- source_word: וַיִּכְרְתוּ ... בְּרִית
  choice: वाचा बाँधी
  rationale: शाब्दिक रूप ‘वाचा काटी’ हिन्दी में अर्थ स्पष्ट नहीं करता। ‘वाचा बाँधना’ औपचारिक वाचा स्थापित करने का स्वाभाविक हिन्दी मुहावरा है और प्रमुख बाइबलीय पद ‘वाचा’ को बनाए रखता है।
theological_decisions:
- issue: כרת ברית वाचा-संबंधी मुहावरे का अनुवाद
  choice: वाचा बाँधी
  alternative: वाचा काटी / वाचा की
  rationale: ‘वाचा बाँधी’ आधुनिक हिन्दी में औपचारिक वाचा स्थापित करने का अर्थ स्पष्ट करता है। मूल इब्रानी के शाब्दिक ‘काटना’ को पारदर्शिता के लिए पादटिप्पणी में सुरक्षित रखा गया है, बिना उसके संभावित अनुष्ठानिक संकेत को मुख्य पाठ में अनावश्यक रूप से निश्चित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। पशु-श्रेणियों के लिए ‘भेड़-बकरियाँ’ और ‘गाय-बैल’ चुने गए हैं ताकि इब्रानी के सामूहिक शब्दों का विस्तार सामान्य पाठक को स्पष्ट रहे।
