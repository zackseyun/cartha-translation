  yaml_path: translation/ot/genesis/021/029.yaml
  text: And Abimelech said to Abraham[a], “What are these seven ewe lambs that you have set apart by themselves?”
translation:
  language: hi
  text: तब अबीमेलेक ने अब्राहम से कहा, “ये सात मादा मेमने क्या हैं, जिन्हें तुमने अलग खड़ा किया है[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें तुमने अलग रखा है।” इब्रानी क्रिया का अर्थ केवल “खड़ा करना” या “रखना” भी हो सकता है; प्रसंग से संकेत मिलता है कि इन मेमनों को बाकी पशुओं से अलग किया गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; आधुनिक हिन्दी कथा में ‘तब’ स्वाभाविक क्रम व्यक्त करता है।
- source_word: אֲבִימֶלֶךְ
  choice: अबीमेलेक
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶל־אַבְרָהָם
  choice: अब्राहम से
  rationale: वाणी के संबोधित व्यक्ति को हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया गया है।
- source_word: מָה הֵנָּה
  choice: इनका क्या अर्थ है
  rationale: शाब्दिक भाव ‘ये क्या हैं?’ है, पर संदर्भ में अबीमेलेक इन पशुओं की पहचान नहीं, उनके अलग रखे जाने का अभिप्राय पूछता है; हिन्दी में ‘क्या अर्थ है’ यह आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֶׁבַע כְּבָשֹׂת הָאֵלֶּה
  choice: इन सात मादा मेमनों
  rationale: כְּבָשׂוֹת स्त्रीलिंग बहुवचन है और मादा मेमनों अथवा कम उम्र की भेड़ों को सूचित करता है; ‘मादा मेमने’ लिंग-विशिष्टता बनाए रखता है।
- source_word: אֲשֶׁר
  choice: जिन्हें
  rationale: हिन्दी में कर्मसूचक संबंधवाचक सर्वनाम इस उपवाक्य को स्वाभाविक रूप से जोड़ता है।
- source_word: הִצַּבְתָּ
  choice: तुमने ... रखा है
  rationale: नצב के हिफ़ील रूप का मूल अर्थ किसी वस्तु को खड़ा करना, रखना या स्थापित करना है।
- source_word: לְבַדָּנָה
  choice: अलग
  rationale: यह शब्द शेष पशुओं से पृथक होने का भाव देता है; ‘अलग रखा’ हिन्दी में संक्षिप्त और स्वाभाविक है।
