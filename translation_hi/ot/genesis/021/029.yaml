translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रश्न को शब्दशः ‘ये क्या हैं?’ कहने के बजाय हिन्दी में प्रसंगानुकूल ‘इनका क्या अर्थ है?’ किया गया है, जबकि पादटिप्पणी में क्रिया की शाब्दिक व्यापकता सुरक्षित है।
