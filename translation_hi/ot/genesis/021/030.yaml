  text: וַ/יֹּ֕אמֶר כִּ֚י אֶת שֶׁ֣בַע כְּבָשֹׂ֔ת תִּקַּ֖ח מִ/יָּדִ֑/י בַּ/עֲבוּר֙ תִּֽהְיֶה לִּ֣/י לְ/עֵדָ֔ה כִּ֥י חָפַ֖רְתִּי אֶת הַ/בְּאֵ֥ר הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/030.yaml
  text: And he said[a], “You are to take these seven ewe lambs from my hand, so that it may serve as a witness for me that I dug this well.”
translation:
  language: hi
  text: उसने कहा[a], “तुम इन सात मादा मेमनों को मेरे हाथ से ले लो, ताकि यह मेरे पक्ष में इस बात की गवाही हो कि मैंने यह कुआँ खोदा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि वे मेरे पक्ष में गवाही हों।” हिब्रू क्रिया एकवचन है, जबकि निकटतम संदर्भ सात मादा मेमने हैं; एकवचन उन्हें सामूहिक रूप में ले सकता है या उनके हस्तांतरण की व्यवस्था को गवाही मान सकता है।
    reason: मूल भाषा में एकवचन क्रिया और निकटवर्ती बहुवचन संज्ञा के बीच वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; हिन्दी में ‘उसने कहा’ स्वाभाविक है और अनावश्यक कालगत अर्थ नहीं जोड़ता।
- source_word: כִּי אֶת שֶׁבַע כְּבָשֹׂת תִּקַּח
  choice: तुम इन सात मेम्नियों को ... स्वीकार करना
  rationale: כִּי यहाँ कथन की विषयवस्तु प्रस्तुत करता है और תִּקַּח अपेक्षित/निर्देशात्मक क्रिया है। כְּבָשֹׂת स्त्रीलिंग भेड़ के बच्चों को निर्दिष्ट करता है, इसलिए ‘मेम्नियों’ चुना गया। प्रसंग में उपस्थित पशुओं के लिए ‘इन’ स्वाभाविक है।
- source_word: מִיָּדִי
  choice: मेरे हाथ से
  rationale: हिब्रू की मूर्त हस्तांतरण-छवि को बनाए रखता है; ‘स्वीकार करना’ से लेन-देन का आशय स्पष्ट होता है।
- source_word: בַּעֲבוּר
  choice: ताकि
  rationale: यहाँ प्रयोजन का बोध कराता है।
- source_word: תִּהְיֶה לִּי לְעֵדָה
  choice: यह मेरे लिए ... गवाही ठहरे
  rationale: क्रिया स्त्रीलिंग एकवचन है। ‘यह’ मेम्नियों के सामूहिक हस्तांतरण अथवा व्यवस्था को एक गवाही के रूप में ग्रहण करता है और मूल की व्याकरणिक असंगति को बहुवचन बनाकर मिटाता नहीं।
- source_word: כִּי חָפַרְתִּי אֶת הַבְּאֵר הַזֹּאת
  choice: इस बात की ... कि यह कुआँ मैंने खोदा है
  rationale: दूसरा כִּי गवाही की विषयवस्तु बताता है। हिन्दी का ‘मैंने’ मूल के प्रथम पुरुष दावे को स्वाभाविक ढंग से व्यक्त करता है।
