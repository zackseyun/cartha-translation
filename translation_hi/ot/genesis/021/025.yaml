  yaml_path: translation/ot/genesis/021/025.yaml
  text: Then Abraham reproved Abimelech about the well of water that Abimelech’s servants had seized.
translation:
  language: hi
  text: तब अब्राहम ने पानी के उस कुएँ को लेकर अबीमेलेक को उलाहना दिया, जिसे अबीमेलेक के सेवकों ने हथिया लिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹכִחַ
  choice: तब ... उलाहना दिया
  rationale: हिफ़ील रूप यहाँ अबीमेलेक को उसके सेवकों के अनुचित काम के लिए सामने से टोकने या शिकायत करने का भाव देता है; ‘उलाहना दिया’ प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: עַל אֹדוֹת
  choice: के विषय में
  rationale: यह पदबंध शिकायत के विषय को दर्शाता है; ‘के विषय में’ आधुनिक मानक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: בְּאֵר הַמַּיִם
  choice: पानी के कुएँ
  rationale: इब्रानी संरचना का सीधा और स्वाभाविक हिन्दी रूप, जिसमें विवादित जलस्रोत स्पष्ट रहता है।
- source_word: גָּזְלוּ
  choice: बलपूर्वक छीन लिया था
  rationale: क्रिया में केवल कब्ज़ा करने से अधिक, अनुचित या हिंसक ढंग से हरण करने का भाव है; ‘बलपूर्वक छीन लिया’ उसे व्यक्त करता है।
- source_word: עַבְדֵי אֲבִימֶלֶךְ
  choice: अबीमेलेक के सेवकों
  rationale: עֶבֶד का अर्थ सेवक या दास हो सकता है; राजकीय संदर्भ में ‘सेवकों’ अधिक स्वाभाविक है और पद की सीमा से आगे सामाजिक स्थिति निश्चित नहीं करता।
