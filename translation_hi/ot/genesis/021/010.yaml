source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ לְ/אַבְרָהָ֔ם גָּרֵ֛שׁ הָ/אָמָ֥ה הַ/זֹּ֖את וְ/אֶת בְּנָ֑/הּ כִּ֣י לֹ֤א יִירַשׁ֙ בֶּן הָ/אָמָ֣ה הַ/זֹּ֔את עִם בְּנִ֖/י עִם יִצְחָֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/010.yaml
  text: So she said to Abraham[a], “Drive out this servant woman and her son, for the son of this servant woman will not inherit with my son Isaac.”
translation:
  language: hi
  text: तब उसने अब्राहम से कहा, “इस दासी और उसके बेटे को निकाल दे[a], क्योंकि इस दासी का बेटा मेरे बेटे, इसहाक के साथ विरासत नहीं पाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस गुलाम स्त्री और उसके बेटे को भगा दे।”
    reason: גָּרֵשׁ की कठोर निष्कासन-भावना और אָמָה की बंधुआ स्थिति को अधिक स्पष्ट करने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: निकाल दे
  rationale: आज्ञार्थक क्रिया बलपूर्वक अलग करने या बाहर कर देने का भाव रखती है। ‘निकाल दे’ आधुनिक हिन्दी में स्वाभाविक है और अपेक्षाकृत नरम ‘विदा कर दे’ की तुलना में मूल की कठोरता बनाए रखता है।
- source_word: הָאָמָה
  choice: दासी
  rationale: यह शब्द अधीन और बंधुआ सामाजिक स्थिति वाली स्त्री के लिए है। ‘दासी’ संक्षिप्त, गरिमापूर्ण और सामान्य हिन्दी में बोधगम्य है; वैकल्पिक अधिक स्पष्ट रूप पादटिप्पणी में दिया गया है।
- source_word: בְּנָהּ
  choice: उसके बेटे
  rationale: मूल के सीधे संबंधवाचक रूप को स्वाभाविक हिन्दी में ज्यों का त्यों रखा गया है।
- source_word: כִּי לֹא יִירַשׁ
  choice: क्योंकि ... उत्तराधिकारी नहीं होगा
  rationale: כִּי कारण बताता है और יירשׁ यहाँ विरासत पाने अथवा उत्तराधिकारी होने का भाव रखता है। यह रूप प्रसंग के कानूनी-पारिवारिक अर्थ को स्पष्ट रखता है।
- source_word: בֶּן הָאָמָה הַזֹּאת
  choice: इस दासी का बेटा
  rationale: दोहराए गए संकेतवाचक ‘इस’ और पदबंध को बनाए रखने से वक्ता की दूरी और तिरस्कारपूर्ण बल सुरक्षित रहता है।
- source_word: עִם בְּנִי עִם יִצְחָק
  choice: मेरे बेटे, इसहाक के साथ
  rationale: मूल में עִם की पुनरावृत्ति ‘इसहाक’ को स्पष्टीकरण और विशेष बल देती है। हिन्दी में अल्पविरामयुक्त समानाधिकरण इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַתֹּאמֶר לְאַבְרָהָם
  choice: तब उसने अब्राहम से कहा
  rationale: कथात्मक वाव को क्रम-सूचक ‘तब’ से प्रस्तुत किया गया है; स्त्रीलिंग कर्ता पूर्ववर्ती प्रसंग से समझा जाता है, जैसा मूल में है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक किंतु गरिमापूर्ण कथात्मक स्तर अपनाया गया है। वक्ता की कठोरता और ‘इस दासी’ की तिरस्कारपूर्ण पुनरावृत्ति को नरम नहीं किया गया।
