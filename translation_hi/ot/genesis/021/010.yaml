review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the imperative גָּרֵשׁ, the repeated and pointed reference to “this slave woman,” and the exclusion from inheritance. However, “उत्तराधिकारी नहीं होगा” can mean that he will not be an heir in general; the Hebrew יִירַשׁ more directly states that he will not inherit, specifically with/alongside Isaac. Rendering the verb as “विरासत नहीं पाएगा” better preserves this verbal and legal sense.
  naturalness: The Hindi is generally natural and suitably formal. “इस दासी का बेटा” is clear, though “इस दासी का पुत्र” gives a more elevated narrative register; “बेटा” remains acceptable. The revised wording is fluent modern standard Hindi.
  terminology: “दासी” is an established biblical Hindi term for אָמָה, while the footnote appropriately supplies “गुलाम स्त्री” to make the enslaved status explicit. “निकाल दे” preserves the force of expulsion. “विरासत नहीं पाएगा” is preferable to the nominal “उत्तराधिकारी नहीं होगा.”
  issues:
  - severity: medium
    issue: The phrase “उत्तराधिकारी नहीं होगा” weakens the verbal inheritance claim.
    rationale: יִירַשׁ is a verb, “will inherit.” In context it concerns inheritance alongside Isaac; “विरासत नहीं पाएगा” directly expresses the source wording without suggesting only a general status as heir.
  revised_text: तब उसने अब्राहम से कहा, “इस दासी और उसके बेटे को निकाल दे[a], क्योंकि इस दासी का बेटा मेरे बेटे, इसहाक के साथ विरासत नहीं पाएगा।”
