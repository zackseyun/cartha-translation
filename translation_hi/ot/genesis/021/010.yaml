- from: तब उसने अब्राहम से कहा, “इस दासी और उसके बेटे को निकाल दे[a], क्योंकि इस दासी का बेटा मेरे बेटे, इसहाक के साथ उत्तराधिकारी नहीं होगा।”
  to: तब उसने अब्राहम से कहा, “इस दासी और उसके बेटे को निकाल दे[a], क्योंकि इस दासी का बेटा मेरे बेटे, इसहाक के साथ विरासत नहीं पाएगा।”
  rationale: केवल “उत्तराधिकारी नहीं होगा” को “विरासत नहीं पाएगा” से बदला गया है, ताकि יִירַשׁ के प्रत्यक्ष क्रियात्मक और उत्तराधिकार-संबंधी अर्थ को अधिक ठीक ढंग से व्यक्त किया जाए। शेष पाठ और पादटिप्पणी स्रोत तथा आधुनिक मानक हिन्दी के अनुरूप हैं।
