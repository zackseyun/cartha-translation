base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/009.yaml
  text: And Sarah saw the son of Hagar the Egyptian[a], whom she had borne to Abraham, mocking.
translation:
  language: hi
  text: तब सारा ने मिस्री हाजिरा के पुत्र को, जिसे हाजिरा ने अब्राहम से जन्म दिया था, हँसते हुए[a] देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ठट्ठा करते हुए”; संभवतः “खेलते हुए।” इब्रानी शब्द हँसने, खेलने या उपहासपूर्ण व्यवहार को व्यक्त कर सकता है; यहाँ उसका ठीक आशय स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: तब सारा ने ... देखा
  rationale: वय्यिक्तोल रूप कथा की अगली घटना बताता है। ‘तब’ स्वाभाविक हिन्दी कथा-क्रम को व्यक्त करता है, बिना अनावश्यक विरोध का भाव जोड़े।
- source_word: בֶּן הָגָר הַמִּצְרִית
  choice: मिस्री हाजिरा के पुत्र को
  rationale: यह रचना पुत्र की पहचान उसकी माता हाजिरा और उसकी मिस्री पहचान के द्वारा कराती है। हिन्दी में संबंधकारक रचना सहज और स्पष्ट है।
- source_word: אֲשֶׁר יָלְדָה לְאַבְרָהָם
  choice: जिसे उसने अब्राहम के लिए जन्म दिया था
  rationale: संबंधवाचक उपवाक्य पहले हो चुके जन्म को याद दिलाता है। ‘जन्म दिया था’ पूर्वकालिकता को व्यक्त करता है और לְאַבְרָהָם को अपेक्षाकृत औपचारिक रूप से सुरक्षित रखता है।
- source_word: מְצַחֵק
  choice: हँसते हुए
  rationale: צחק का कृदन्त हँसने, खेलने या उपहासपूर्ण व्यवहार का अर्थ दे सकता है। यहाँ कोई स्पष्ट कर्म नहीं है; इसलिए मुख्य पाठ में व्यापक और तटस्थ अर्थ रखा गया है तथा संदर्भगत विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: मְצַחֵק में इश्माएल के व्यवहार का आशय
  choice: मुख्य पाठ में ‘हँसते हुए’
  alternative: ‘ठट्ठा करते हुए’ या ‘खेलते हुए’
  rationale: इब्रानी पद स्वयं यह निश्चित नहीं करता कि व्यवहार केवल हँसी, खेल या शत्रुतापूर्ण उपहास था। संदर्भ नकारात्मक अर्थ का संकेत दे सकता है, पर उसे मुख्य पाठ में निश्चित कर देना मूल की वास्तविक अस्पष्टता को मिटा देगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। वाक्य-क्रम हिन्दी के अनुकूल है, और मूल इब्रानी की अर्थगत अस्पष्टता पादटिप्पणी सहित सुरक्षित रखी गई है।
