base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/004.yaml
  text: And Abraham circumcised Isaac his son when he was eight days old[a], just as God had commanded him.
translation:
  language: hi
  text: और अब्राहम ने अपने पुत्र इसहाक का खतना तब किया, जब वह आठ दिन का था[a], ठीक वैसे ही जैसे परमेश्वर ने अब्राहम को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आठ दिन का पुत्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָל
  choice: खतना किया
  rationale: यह क्रिया विशेष रूप से खतना करने को व्यक्त करती है; आधुनिक मानक हिन्दी में यह सटीक और स्वाभाविक पद है।
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: अपने पुत्र इसहाक का
  rationale: प्रत्यक्ष कर्म और בְּנוֹ में निहित पारिवारिक बल दोनों सुरक्षित रहते हैं; हिन्दी वाक्य-विन्यास में ‘अपने’ से कर्ता अब्राहम के साथ संबंध स्पष्ट है।
- source_word: בֶּן שְׁמֹנַת יָמִים
  choice: जब वह आठ दिन का था
  rationale: इब्रानी का शाब्दिक मुहावरा ‘आठ दिन का पुत्र’ आयु बताता है; चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह अब्राहम के कार्य और परमेश्वर की आज्ञा के बीच पूर्ण अनुरूपता को स्पष्ट करता है।
- source_word: צִוָּה אֹתוֹ
  choice: उसे आज्ञा दी थी
  rationale: ‘दी थी’ पूर्वकालिक आज्ञा को स्वाभाविक हिन्दी में दर्शाता है, जो इस कार्य से पहले दी गई थी।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ शब्द एकवचन क्रिया के साथ इस्राएल के परमेश्वर को सूचित करता है; ‘परमेश्वर’ प्रतिष्ठित और सहज हिन्दी रूप है।
theological_decisions:
- issue: पहले दी गई ईश्वरीय आज्ञा का कालगत संबंध
  choice: आज्ञा दी थी
  alternative: आज्ञा दी
  rationale: इब्रानी रूप साधारण भूतकाल में भी अनूदित हो सकता है, पर हिन्दी का पूर्ण भूतकाल यह स्वाभाविक रूप से स्पष्ट करता है कि आज्ञा खतना किए जाने से पहले दी गई थी; इससे कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जुड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण है। ‘खतना’ सामान्य पाठक के लिए स्पष्ट तकनीकी शब्द है। ‘अपने पुत्र’ मूल के पारिवारिक बल को बनाए रखता है।
