  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב הִשָּׁ֤בְעָ/ה לִּ/י֙ כַּ/יּ֔וֹם וַ/יִּשָּׁבַ֖ע ל֑/וֹ וַ/יִּמְכֹּ֥ר אֶת בְּכֹרָת֖/וֹ לְ/יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/033.yaml
  text: And Jacob said[b][a], “Swear to me today.” So he swore to him and sold his birthright to Jacob.
translation:
  language: hi
  text: तब याकूब ने कहा, “आज ही मुझे शपथ दे[a]।” तब उसने याकूब को शपथ दी और अपना ज्येष्ठाधिकार[b] याकूब को बेच दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इसी दिन मुझे शपथ दे,” अथवा “आज से मुझे शपथ दे।”
    reason: lexical_alternative
  - marker: b
    text: “ज्येष्ठाधिकार” से आशय परिवार के पहले जन्मे पुत्र की विशेष हैसियत और उससे जुड़े अधिकारों से है।
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁבְעָה לִּי
  choice: मुझसे शपथ खा
  rationale: आज्ञार्थक क्रिया और לִי मिलकर याकूब के प्रति शपथ लेने की सीधी माँग व्यक्त करते हैं; यह स्वाभाविक आधुनिक हिन्दी है।
- source_word: כַּיּוֹם
  choice: आज ही
  rationale: यह पदबंध ‘आज’ अथवा ‘इसी दिन’ का भाव देता है; ‘ही’ तत्कालता पर स्वाभाविक बल रखता है, जबकि वैकल्पिक अर्थ फुटनोट में सुरक्षित है।
- source_word: וַיִּשָּׁבַע ל֑וֹ
  choice: उसने याकूब से शपथ खाई
  rationale: क्रिया शपथ लेने को व्यक्त करती है और ל֑וֹ उस व्यक्ति को सूचित करता है जिसके प्रति शपथ ली गई; अस्पष्ट सर्वनाम के स्थान पर याकूब का नाम हिन्दी में संदर्भ स्पष्ट करता है।
- source_word: וַיִּמְכֹּר
  choice: बेच दिया
  rationale: מכר का सीधा अर्थ बेचना है; ‘बेच दिया’ पूर्ण हुए लेन-देन को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּכֹרָתוֹ
  choice: अपना पहलौठे का अधिकार
  rationale: בכורה पहले जन्मे पुत्र की पारिवारिक हैसियत और उससे जुड़े अधिकारों को दर्शाता है; यह चयन अवधारणा को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: לְיַעֲקֹב
  choice: याकूब को
  rationale: לְ यहाँ बिक्री के प्राप्तकर्ता को चिह्नित करता है; हिन्दी में ‘याकूब को’ स्वाभाविक समतुल्य है।
theological_decisions:
- issue: בְּכֹרָה के हस्तांतरण का स्वरूप
  choice: अपना पहलौठे का अधिकार याकूब को बेच दिया
  alternative: अपने पहलौठे की हैसियत याकूब को बेच दी
  rationale: मूल पाठ एक वास्तविक पारिवारिक-कानूनी अधिकार के बिक्री द्वारा हस्तांतरण का वर्णन करता है। चुना हुआ रूप किसी अतिरिक्त सिद्धान्त को जोड़े बिना अधिकार और लेन-देन दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘शपथ खा’ प्रचलित शपथ-सूत्र है; ‘पहलौठे का अधिकार’ सांस्कृतिक अवधारणा को संक्षेप में स्पष्ट करता है।
