  text: इसहाक एसाव से प्रेम करता था, क्योंकि शिकार इसहाक के मुँह में था[a]; पर रिबका याकूब से प्रेम करती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्योंकि शिकार इसहाक के मुँह में था।” इस अभिव्यक्ति का आशय संभवतः यह है कि इसहाक एसाव के लाए हुए शिकार का मांस खाना पसंद करता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: प्रेम करता था
  rationale: क़ल वय्यिक्तोल भूतकालीन कथा को आगे बढ़ाता है; हिन्दी में ‘प्रेम करता था’ यहाँ स्थायी लगाव और अगले सहभागी रूप के समानांतरता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת עֵשָׂו
  choice: एसाव से
  rationale: אֶת कर्म-सूचक है और अलग से अनूदित नहीं होता; हिन्दी में ‘प्रेम करना’ के साथ व्यक्ति के लिए ‘से’ स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह इसहाक के लगाव का कारण प्रस्तुत करता है।
- source_word: צַיִד
  choice: शिकार
  rationale: צַיִד शिकार किए हुए पशु या उससे प्राप्त भोजन को दर्शा सकता है; ‘शिकार’ इस व्यापकता को बनाए रखता है और इसे केवल हिरन के मांस तक सीमित नहीं करता।
- source_word: בְּפִיו
  choice: उसके मुँह में था
  rationale: इब्रानी की ठोस और कुछ हद तक अस्पष्ट अभिव्यक्ति ‘उसके मुँह में’ को सुरक्षित रखा गया है; इसका आशय संभवतः एसाव के लाए शिकार का स्वाद इसहाक को प्रिय होना है।
- source_word: וְרִבְקָה
  choice: पर रिबका
  rationale: וְ मूलतः ‘और’ है, पर यहाँ माता-पिता के अलग-अलग लगाव का स्पष्ट विरोध है; ‘पर’ हिन्दी में उस संबंध को स्वाभाविक बनाता है।
- source_word: אֹהֶבֶת
  choice: प्रेम करती थी
  rationale: सहभागी रूप निरंतर या चरित्रगत लगाव व्यक्त करता है; हिन्दी का अपूर्ण भूतकाल इसे स्वाभाविक रूप से दर्शाता है।
- source_word: אֶת יַעֲקֹב
  choice: याकूब से
  rationale: אֶת का अलग अनुवाद नहीं किया गया; हिन्दी वाक्य-विन्यास में ‘याकूब से प्रेम करती थी’ स्वाभाविक है।
