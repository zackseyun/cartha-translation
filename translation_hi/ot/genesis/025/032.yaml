source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר עֵשָׂ֔ו הִנֵּ֛ה אָנֹכִ֥י הוֹלֵ֖ךְ לָ/מ֑וּת וְ/לָ/מָּה זֶּ֥ה לִ֖/י בְּכֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/032.yaml
  text: Esau said[a], “Look, I am about to die; so what use is this birthright to me?”
translation:
  language: hi
  text: एसाव ने कहा, “देख, मैं तो मरने ही वाला हूँ; फिर यह पहलौठे का अधिकार मेरे किस काम का?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: कथात्मक wayyiqtol का स्वाभाविक आधुनिक हिन्दी रूप; आरम्भिक संयोजक को अलग से व्यक्त करना आवश्यक नहीं।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: הִנֵּה
  choice: देख
  rationale: वक्ता के कथन की ओर ध्यान खींचने वाले उद्गार का सहज आधुनिक हिन्दी रूप।
- source_word: אָנֹכִי
  choice: मैं तो
  rationale: स्वतंत्र सर्वनाम के बल को हिन्दी के बलसूचक ‘तो’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: הוֹלֵךְ לָמוּת
  choice: मरने पर हूँ
  rationale: הלך + infinitive यहाँ वास्तविक दिशा-गमन नहीं, बल्कि निकट आती मृत्यु का भाव देता है; यह रूप आसन्नता को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְלָמָּה זֶּה לִי
  choice: फिर यह ... मेरे किस काम का?
  rationale: शाब्दिक ‘और क्यों यह मेरे लिए?’ के बजाय प्रसंग में निहित अलंकारिक निष्कर्ष और लाभ/प्रयोजन के दत्तिव को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּכֹרָה
  choice: पहलौठे का अधिकार
  rationale: पहले जन्मे पुत्र से जुड़ी सामाजिक और उत्तराधिकार-संबंधी हैसियत तथा विशेषाधिकारों को स्पष्ट करने वाला प्रचलित और समझने योग्य पद।
theological_decisions:
- issue: एसाव के मरने संबंधी कथन का आशय
  choice: कथन को आसन्न मृत्यु के दावे के रूप में रखा गया, पर यह निर्धारित नहीं किया गया कि वह सचमुच मृत्यु के निकट था या अतिशयोक्ति कर रहा था।
  alternative: इसे या तो वास्तविक आसन्न मृत्यु या अत्यधिक भूख से उपजी अतिशयोक्तिपूर्ण शिकायत के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ केवल एसाव का दावा प्रस्तुत करता है; अनुवाद कथानक और नैतिक तनाव को बिना सुलझाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद सहज किंतु गरिमापूर्ण है। ‘मैं तो’ मूल सर्वनाम के बल को और ‘फिर’ कथन के निष्कर्षात्मक संबंध को व्यक्त करता है।
