  rationale: यह אֲרַמִּי जातिनाम का सटीक रूप है; परंपरागत ‘सीरियाई’ मूल शब्द की ऐतिहासिक पहचान को कम स्पष्ट करता है।
- source_word: מִפַּדַּן אֲרָם
  choice: पद्दन-अराम के
  rationale: स्थान-नाम का अनुवाद करने के बजाय उसका लिप्यंतरण किया गया है; हिन्दी वाक्य में संबंधसूचक ‘के’ स्वाभाविक है।
- source_word: אֲחוֹת לָבָן
