base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/020.yaml
  text: Isaac was forty years old when he took Rebekah[a], the daughter of Bethuel the Aramean from Paddan-aram, the sister of Laban the Aramean[b], to be his wife.
translation:
  language: hi
  text: इसहाक चालीस वर्ष का था जब उसने रिबका[a] को अपनी पत्नी बनाया—वह पद्दन-अराम के अरामी, बतूएल की बेटी और अरामी लाबान की बहन थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “रिबका को अपनी पत्नी होने के लिए लिया।” इसका स्वाभाविक अर्थ है, “रिबका से विवाह किया।”
    reason: lexical_alternative
  - marker: b
    text: “अरामी” मूल इब्रानी जातिनाम का अधिक सटीक रूप है; पुराने अनुवादों में कहीं-कहीं “सीरियाई” मिलता है।
    reason: lexical_alternative
