base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
translation:
  language: hi
  text: और बच्चे उसके भीतर आपस में संघर्ष कर रहे थे। तब उसने कहा, “यदि ऐसा ही है, तो मैं ऐसी क्यों हूँ?[a]” इसलिए वह याहवे से पूछने गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं इस दशा में क्यों हूँ?” हिब्रू अभिव्यक्ति अंडाकार है; इसका अधिक शाब्दिक अर्थ “मैं क्यों हूँ?” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
  choice: आपस में संघर्ष करने लगे
  rationale: हित्पएल रूप पारस्परिक और तीव्र हलचल दर्शाता है। यह चयन गर्भस्थ बच्चों के बीच टकराव का भाव रखता है, बिना ‘एक-दूसरे को कुचलने’ जैसी अतिशयोक्ति के।
- source_word: הַבָּנִים
  choice: बच्चे
  rationale: गर्भावस्था के इस चरण में ‘बच्चे’ स्वाभाविक है; अगली आयत में उनके पुत्र होने की बात स्पष्ट होती है।
- source_word: בְּקִרְבָּהּ
  choice: उसके भीतर
  rationale: हिब्रू का शाब्दिक अर्थ उसके अंदर या मध्य में है। ‘उसके भीतर’ शारीरिक संदर्भ स्पष्ट रखता है, पर मूल में न आए ‘गर्भ’ शब्द को नहीं जोड़ता।
- source_word: אִם כֵּן
  choice: यदि ऐसा है
  rationale: यह रिबका की व्याकुल प्रतिक्रिया का स्वाभाविक और अर्थ-संगत परिचय है।
- source_word: לָמָּה זֶּה אָנֹכִי
  choice: तो मैं ऐसी क्यों हूँ?
  rationale: हिब्रू कथन संक्षिप्त और अर्थ की दृष्टि से अस्पष्ट है। यह अनुवाद प्रसंगानुकूल प्रश्न को व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: यहोवा से पूछने
  rationale: व्यक्ति के साथ דרש यहाँ ईश्वरीय उत्तर या मार्गदर्शन जानने के लिए पूछने का भाव देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुरक्षरीय ईश-नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश-नाम है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ उसे नाम के रूप में बनाए रखता है; ‘प्रभु’ उपाधि से उसे प्रतिस्थापित कर देता, जबकि ‘याहवे’ स्रोत-उच्चारण का अधिक प्रत्यक्ष लिप्यंतरण है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘आपस में संघर्ष’ पारस्परिक तीव्रता व्यक्त करता है। कठिन हिब्रू प्रश्न की अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
