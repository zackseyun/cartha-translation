reference: Genesis 25:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יַעֲקֹ֞ב נָתַ֣ן לְ/עֵשָׂ֗ו לֶ֚חֶם וּ/נְזִ֣יד עֲדָשִׁ֔ים וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖קָם וַ/יֵּלַ֑ךְ וַ/יִּ֥בֶז עֵשָׂ֖ו אֶת הַ/בְּכֹרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/034.yaml
  text: And Jacob gave Esau bread and lentil stew[a], and he ate and drank and rose and went away[b]. Thus Esau despised the birthright.
translation:
  language: hi
  text: और याकूब ने एसाव को रोटी और मसूर का पकवान[a] दिया। उसने खाया और पिया, फिर उठा और चला गया। इस प्रकार एसाव ने पहलौठे के अधिकार को तुच्छ समझा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसूर की दाल का पकवान।”
    reason: मूल पदबंध का अधिक स्पष्ट संरचनात्मक विकल्प।
  - marker: b
    text: या, “पहलौठे के अधिकार का तिरस्कार किया।”
    reason: अवमानना व्यक्त करने वाली मूल क्रिया का वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: נָתַן
  choice: दिया
  rationale: सामान्य क्रिया ‘देना’ इस सीधे-सादे लेन-देन को बिना अतिरिक्त अर्थ जोड़े ठीक व्यक्त करती है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: यद्यपि इस शब्द का अर्थ कभी-कभी सामान्य रूप से ‘भोजन’ भी हो सकता है, यहाँ पकवान के साथ इसका प्रयोग ठोस अर्थ ‘रोटी’ का समर्थन करता है।
- source_word: נְזִיד עֲדָשִׁים
  choice: मसूर का पकवान
  rationale: यह पदबंध मसूर से बने पकाए हुए गाढ़े व्यंजन को दर्शाता है। ‘मसूर का पकवान’ स्वाभाविक हिन्दी है और इसे केवल पतला ‘सूप’ बताने से बचता है।
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ וַיָּקָם וַיֵּלַךְ
  choice: उसने खाया और पिया, फिर उठा और चला गया
  rationale: मूल की तेज़ क्रमिक क्रियाओं को बनाए रखते हुए यह हिन्दी में सहज और संक्षिप्त है। ‘फिर’ घटनाओं का क्रम स्पष्ट करता है, जबकि ‘उठा और चला गया’ एसाव के तत्काल प्रस्थान को व्यक्त करता है।
- source_word: וַיִּבֶז
  choice: तुच्छ समझा
  rationale: यह क्रिया अवमानना और किसी वस्तु को मूल्यहीन मानने का भाव रखती है। ‘तुच्छ समझा’ आधुनिक हिन्दी में स्पष्ट और सशक्त है।
- source_word: הַבְּכֹרָה
  choice: पहलौठे का अधिकार
  rationale: यह अभिव्यक्ति परिवार में पहले जन्मे पुत्र से जुड़े विशेषाधिकार और दर्जे को स्पष्ट करती है तथा केवल जन्मक्रम तक अर्थ को सीमित नहीं करती।
theological_decisions:
- issue: एसाव द्वारा अपने पहलौठे के दर्जे का मूल्यांकन
  choice: इस प्रकार एसाव ने पहलौठे के अधिकार को तुच्छ समझा
  alternative: और एसाव ने अपने पहलौठे के अधिकार का तिरस्कार किया
  rationale: अंतिम खंड पिछले व्यवहार पर कथावाचक का सारात्मक नैतिक मूल्यांकन है। ‘इस प्रकार’ उस निष्कर्षात्मक संबंध को व्यक्त करता है, और ‘तुच्छ समझा’ मूल की अवमानना को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। क्रमिक क्रियाओं की संक्षिप्त गति को हिन्दी की स्वाभाविकता के भीतर सुरक्षित रखा गया है।
