base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/011.yaml
  text: And it happened after Abraham’s death that God blessed Isaac his son[a], and Isaac lived by Beer-lahai-roi.
translation:
  language: hi
  text: अब्राहम की मृत्यु के बाद ऐसा हुआ कि परमेश्वर ने अब्राहम के पुत्र इसहाक को आशीष दी, और इसहाक बेएर-लहै-रोई[a] के पास रहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बेएर-लहै-रोई एक कुएँ का नाम है; यह इब्रानी नाम पहले उत्पत्ति 16:14 में आया है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ
  rationale: यह अभिव्यक्ति इब्रानी कथात्मक क्रम को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक और गैर-पुरातन भाषा देती है।
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: अब्राहम की मृत्यु के बाद
  rationale: यह कालवाचक संबंध को संक्षिप्त और स्वाभाविक हिन्दी में ठीक प्रकार व्यक्त करता है।
- source_word: וַיְבָרֶךְ אֱלֹהִים
  choice: परमेश्वर ने ... आशीष दी
  rationale: ברך का सीधा अर्थ आशीष देना है; इस प्रसंग में אֱלֹהִים एकमात्र परमेश्वर के लिए प्रयुक्त है।
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: उसके पुत्र इसहाक को
  rationale: यह मूल पाठ में इसहाक के बाद आने वाली पुत्र-संबंधी पहचान को हिन्दी में स्वाभाविक क्रम से व्यक्त करता है; संदर्भ में 'उसके' का संकेत अब्राहम की ओर है।
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: ישב यहाँ किसी स्थान के निकट निवास करने को बताता है; कथात्मक क्रम में 'रहने लगा' अगले घटनाक्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עִם
  choice: के पास
  rationale: स्थान-नाम के साथ עִם यहाँ संगति नहीं, निकटता का भाव देता है; इसलिए 'के पास' स्पष्ट और स्वाभाविक है।
- source_word: בְּאֵר לַחַי רֹאִי
  choice: बेएर-लहै-रोई
  rationale: यह पहले से परिचित कुएँ/स्थान का नाम है, इसलिए अर्थानुवाद के बजाय इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
theological_decisions:
- issue: कथात्मक प्रसंग में אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: ईश्वर
  rationale: इस पद में शब्द इस्राएल के एकमात्र परमेश्वर को सूचित करता है; 'परमेश्वर' आधुनिक हिन्दी बाइबलीय भाषा में स्पष्ट, गरिमापूर्ण और सामान्य रूप है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथात्मक सूत्र को 'ऐसा हुआ' से सुरक्षित रखा गया है, और स्थान-नाम का अनुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
