id: GEN.25.23
reference: Genesis 25:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לָ֗/הּ שְׁנֵ֤י גיים בְּ/בִטְנֵ֔/ךְ וּ/שְׁנֵ֣י לְאֻמִּ֔ים מִ/מֵּעַ֖יִ/ךְ יִפָּרֵ֑דוּ וּ/לְאֹם֙ מִ/לְאֹ֣ם יֶֽאֱמָ֔ץ וְ/רַ֖ב יַעֲבֹ֥ד צָעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/023.yaml
  text: And Yahweh said to her[a], “Two nations are in your womb, and two peoples will be separated from within you; and one people will be stronger than the other[b], and the older will serve the younger.”
translation:
  language: hi
  text: 'याहवे ने उससे कहा, “तेरे गर्भ में दो राष्ट्र हैं,

    और तेरे भीतर से दो जनसमुदाय अलग हो जाएँगे;

    एक जनसमुदाय दूसरे से अधिक बलवान होगा,

    और बड़ा छोटे की सेवा करेगा।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बड़ा’ और ‘छोटा’ के लिए आए इब्रानी शब्दों का अर्थ ‘अधिक महान’ और ‘कमतर’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम के रूप में चतुरक्षरीय नाम का लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: שְׁנֵי גיים
  choice: दो राष्ट्र
  rationale: גוי यहाँ आगे आनेवाले राजनीतिक-जातीय समूहों को दर्शाता है; ‘राष्ट्र’ इस भाव को स्पष्ट करता है।
- source_word: בְּבִטְנֵךְ
  choice: तेरे गर्भ में
  rationale: गर्भावस्था के संदर्भ में בטן का स्वाभाविक और सटीक हिन्दी रूप ‘गर्भ’ है।
- source_word: שְׁנֵי לְאֻמִּים
  choice: दो जनसमुदाय
  rationale: לְאֻמִּים लोगों के दो अलग समूहों को सूचित करता है। ‘जनसमुदाय’ पहले पद के ‘राष्ट्र’ से भिन्न शब्द रखकर इब्रानी समानांतरता को बनाए रखता है और ‘जाति’ के संभावित जाति-व्यवस्था संबंधी अर्थ से बचता है।
- source_word: מִמֵּעַיִךְ יִפָּרֵדוּ
  choice: तेरे भीतर से ... अलग हो जाएँगे
  rationale: מֵעַיִם का शाब्दिक अर्थ भीतरी अंग है, पर गर्भावस्था के प्रसंग में ‘तेरे भीतर से’ स्वाभाविक है। יִפָּרֵדוּ के निफ़अल रूप का अलगाव-सूचक भाव ‘अलग हो जाएँगे’ में सुरक्षित है।
- source_word: וּלְאֹם מִלְאֹם יֶאֱמָץ
  choice: एक जनसमुदाय दूसरे से अधिक बलवान होगा
  rationale: यह तुलनात्मक संबंध और יֶאֱמָץ में निहित शक्ति का भाव स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רַב ... צָעִיר
  choice: बड़ा ... छोटे
  rationale: जुड़वाँ बच्चों के संदर्भ में हिन्दी के ‘बड़ा’ और ‘छोटा’ आयु-क्रम को स्वाभाविक रूप से व्यक्त करते हैं, साथ ही इब्रानी शब्दों में निहित पद या महत्ता की व्यापक संभावना को पूरी तरह बंद नहीं करते।
- source_word: יַעֲבֹד
  choice: सेवा करेगा
  rationale: עבד का सामान्य और व्यापक अर्थ ‘सेवा करना’ है; यह अधीनता की संभावना को बिना अनावश्यक व्याख्या जोड़े बनाए रखता है।
theological_decisions:
- issue: וְרַב יַעֲבֹד צָעִיר में जन्मक्रम और पद-महत्ता के बीच अर्थ-संभावना
  choice: बड़ा छोटे की सेवा करेगा
  alternative: अधिक महान कमतर की सेवा करेगा
  rationale: गर्भ में जुड़वाँ बच्चों का निकट संदर्भ ‘बड़े’ और ‘छोटे’ अर्थात जन्मक्रम की ओर संकेत करता है। फिर भी רַב और צָעִיר महत्ता या पद के अंतर को भी सूचित कर सकते हैं, इसलिए उस व्यापक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक पंक्ति-विन्यास रखा गया है। ईश्वरीय नाम का रूप ‘याहवे’ है। सर्वनाम ‘तेरे/उससे’ मूल के एकवचन स्त्री-संबोधन के अनुरूप हैं; हिन्दी में क्रिया से स्त्रीलिंग स्पष्ट नहीं होता, पर प्रसंग इसे निर्धारित करता है।
