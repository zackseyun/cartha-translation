  yaml_path: translation/ot/genesis/025/003.yaml
  text: Jokshan fathered Sheba and Dedan. The sons of Dedan were Asshurim[a], Letushim, and Leummim.
translation:
  language: hi
  text: और योक्षान शेबा और ददान का पिता बना। ददान के पुत्र अश्शूरीम[a], लतूशीम और लउम्मीम थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभव है कि अश्शूरीम, लतूशीम और लउम्मीम व्यक्तियों के नहीं, बल्कि कुलों के नाम हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְשָׁן
  choice: योक्षान
  rationale: व्यक्तिवाचक नाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: יָלַד
  choice: से ... उत्पन्न हुए
  rationale: वंशावली में पुरुष से वंशोत्पत्ति व्यक्त करने वाला स्वाभाविक और गरिमापूर्ण आधुनिक हिंदी प्रयोग; इससे अनिवार्य रूप से निकटतम जैविक पितृत्व से अधिक अर्थ नहीं थोपा जाता।
- source_word: שְׁבָא
  choice: शेबा
  rationale: व्यक्तिवाचक नाम का हिब्रू-सन्निकट लिप्यंतरण।
- source_word: דְּדָן
  choice: ददान
  rationale: व्यक्तिवाचक नाम का हिब्रू-सन्निकट लिप्यंतरण।
- source_word: בְנֵי
  choice: पुत्र
  rationale: हिब्रू के स्पष्ट पुल्लिंग बहुवचन का औपचारिक समतुल्य; संदर्भ में वंशज या कुल भी अभिप्रेत हो सकते हैं, इसलिए टिप्पणी दी गई है।
- source_word: הָיוּ
  choice: थे
  rationale: नामों की सूची प्रस्तुत करने वाली साधारण संयोजक क्रिया का सीधा अनुवाद।
- source_word: אַשּׁוּרִם
  choice: अश्शूरीम
  rationale: संभव जाति अथवा कुलनाम को अर्थानुवाद करने के बजाय हिब्रू रूप के निकट लिप्यंतरित किया गया है।
- source_word: לְטוּשִׁים
  choice: लतूशीम
  rationale: अनिश्चित व्युत्पत्ति वाले संभव कुलनाम का लिप्यंतरण।
- source_word: לְאֻמִּים
  choice: लउम्मीम
  rationale: सामान्य संज्ञा से समानता के बावजूद यहाँ इसे कुलनाम मानकर लिप्यंतरित किया गया है, ताकि अर्थ का अति-निर्धारण न हो।
theological_decisions:
- issue: ददान के बाद दिए नाम व्यक्तिगत पुत्र हैं या वंश/कुलनाम
  choice: मुख्य पाठ में स्रोत-संगत ‘पुत्र’ और टिप्पणी में कुलनाम की संभावना
  alternative: मुख्य पाठ में ‘वंशज’ या ‘कुल’
  rationale: בְנֵי का रूप ‘पुत्र’ है, जबकि बहुवचनात्मक नामरूप जातीय या कुलगत समूहों का संकेत दे सकते हैं; पाठ की यह अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी, संक्षिप्त वंशावली शैली और गरिमापूर्ण सहज वाक्य-विन्यास। नाम हिब्रू के निकट देवनागरी में दिए गए हैं; ‘और’ से आरंभ मूल के संयोजक וְ को बनाए रखता है।
