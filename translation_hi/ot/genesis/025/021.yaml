base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/021.yaml
  text: And Isaac prayed to Yahweh for his wife[a], because she was barren. And Yahweh answered him[b], and Rebekah his wife conceived.
translation:
  language: hi
  text: इसहाक ने अपनी पत्नी के लिए[a] यहोवा से विनती की, क्योंकि वह बाँझ थी। यहोवा ने इसहाक की विनती स्वीकार की[b], और उसकी पत्नी रिबका गर्भवती हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका शाब्दिक अर्थ ‘अपनी पत्नी के सामने’ भी हो सकता है; यहाँ भाव उसकी ओर से या उसके संबंध में विनती करने का है।
    reason: lexical_alternative
  - marker: b
    text: ‘विनती की’ और ‘विनती स्वीकार की’ के लिए इब्रानी में एक ही धातु के दो रूप आए हैं।
    reason: lexical_wordplay
lexical_decisions:
- source_word: וַיֶּעְתַּר / וַיֵּעָתֶר (עתר)
  choice: विनती की / उसकी विनती स्वीकार की
  rationale: दोनों रूप एक ही इब्रानी धातु से हैं। हिन्दी में इन वाक्यांशों द्वारा उस जानबूझकर की गई पुनरावृत्ति और प्रार्थना के प्रति यहोवा की अनुकूल प्रतिक्रिया, दोनों को स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: לַיהוָה / יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम יהוה को प्रचलित हिन्दी बाइबलीय रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לְנֹכַח אִשְׁתּוֹ
  choice: अपनी पत्नी के लिए
  rationale: לְנֹכַח का मूल स्थानवाचक अर्थ ‘सामने/सम्मुख’ है, पर यहाँ प्रार्थना के संदर्भ में पत्नी के संबंध में अथवा उसकी ओर से विनती करना अभिप्रेत हो सकता है। मुख्य पाठ में स्वाभाविक हिन्दी अर्थ रखा गया है और शाब्दिक संभावना पादटिप्पणी में दी गई है।
- source_word: עֲקָרָה
  choice: बाँझ
  rationale: यह शब्द गर्भधारण न कर सकने की अवस्था को सीधे और संदर्भानुकूल ढंग से व्यक्त करता है; ‘निःसंतान’ केवल परिणाम बताता।
- source_word: וַתַּהַר
  choice: गर्भवती हुई
  rationale: यह आधुनिक हिन्दी में गर्भधारण की घटना को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: רִבְקָה
  choice: रिबका
  rationale: यह इब्रानी नाम का हिन्दी बाइबलीय परंपरा में प्रचलित रूप है।
theological_decisions:
- issue: एक ही धातु עתר की पुनरावृत्ति और परमेश्वर की प्रतिक्रिया
  choice: इसहाक ने विनती की; यहोवा ने उसकी विनती स्वीकार की
  alternative: इसहाक ने प्रार्थना की; यहोवा ने उसकी सुनी
  rationale: चुना हुआ पाठ मूल की शब्दगत कड़ी को बनाए रखता है, पर यह संकेत नहीं देता कि प्रार्थना ने परमेश्वर को यांत्रिक रूप से बाध्य किया।
- issue: יהוה का निरूपण
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: विशिष्ट वाचा-नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में उसके परिचित नामरूप को रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विनती’ प्रार्थना की गंभीरता को बिना अतिरिक्त भाव जोड़े व्यक्त करती है; ‘बाँझ’ मूल कथन की स्पष्टता बनाए रखता है।
