  text: अब्राहम ने अपना सब कुछ इसहाक को दे दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: दे दिया
  rationale: נתן का मूल अर्थ ‘देना’ है। कथात्मक wayyiqtol को यहाँ स्वाभाविक हिंदी भूतकाल में व्यक्त किया गया है; ‘दे दिया’ हस्तांतरण की पूर्णता को सहज रूप से बताता है।
- source_word: אַבְרָהָם
  choice: अब्राहम
  rationale: हिंदी बाइबल परंपरा में प्रचलित नाम-रूप।
- source_word: אֵת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का चिह्न है; हिंदी में इसका स्वतंत्र शब्दगत समकक्ष नहीं है, और इसका कार्य वाक्य-विन्यास से प्रकट होता है।
- source_word: כָּל אֲשֶׁר לוֹ
  choice: अपना सब कुछ
  rationale: शाब्दिक भाव ‘जो कुछ उसका था’ है। ‘अपना सब कुछ’ आधुनिक हिंदी में स्वाभाविक है और अब्राहम की समस्त संपत्ति के व्यापक अर्थ को सुरक्षित रखता है।
- source_word: לְיִצְחָק
  choice: इसहाक को
  rationale: לְ यहाँ प्राप्तकर्ता को चिह्नित करता है; हिंदी में ‘को’ इसका स्पष्ट और स्वाभाविक रूप है।
