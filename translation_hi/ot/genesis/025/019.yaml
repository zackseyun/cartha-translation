review_pass:
  verdict: revise
  source_fidelity: The heading is represented, but the draft’s passive clause “अब्राहम से इसहाक उत्पन्न हुआ” does not retain the Hebrew active Hiphil assertion that Abraham fathered/begot Isaac. “वंशावली” can suggest a list of descendants more narrowly than the recurring תּוֹלְדֹת heading; “वंश-वृत्तांत” better leaves its scope open.
  naturalness: The revised wording is clear, idiomatic modern standard Hindi, and retains an appropriately formal biblical register. “उत्पन्न किया” is an active genealogical expression and avoids making Abraham’s role merely an indirect source.
  terminology: The established Hindi forms “अब्राहम” and “इसहाक” are suitable. “वंश-वृत्तांत” preserves the structural and broad literary sense of תּוֹלְדֹת, with alternatives supplied in the footnote.
  issues:
  - severity: medium
    issue: The final clause is passive rather than active.
    rationale: 'אַבְרָהָם הוֹלִיד אֶת־יִצְחָק explicitly has Abraham as the active subject: “Abraham fathered/begot Isaac.” “अब्राहम से इसहाक उत्पन्न हुआ” weakens that grammatical and semantic relation.'
  - severity: low
    issue: “वंशावली” is somewhat narrower than תּוֹלְדֹת in this heading formula.
    rationale: In Genesis, תּוֹלְדֹת can introduce an account or family history, not solely a genealogical list. “वंश-वृत्तांत” retains the broad heading function without deciding its precise scope.
