  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/019.yaml
  text: 'These are the generations of Isaac[a], son of Abraham: Abraham fathered Isaac.'
translation:
  language: hi
  text: 'और यह अब्राहम के पुत्र इसहाक का वंश-वृत्तांत[a] है: अब्राहम ने इसहाक को उत्पन्न किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वंशावली,” “वृत्तांत” अथवा “कुल-विवरण”; इब्रानी शब्द तोलेदोत उत्पत्ति की पुस्तक में बार-बार शीर्षक के रूप में आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ये ... है
  rationale: वाव के संयोजक बल और नए खंड का आरम्भ सुरक्षित रखते हुए स्वाभाविक हिन्दी सूत्र दिया गया है।
- source_word: תּוֹלְדֹת
  choice: वंशावली
  rationale: यह उत्पत्ति में बार-बार आने वाला संरचनात्मक शीर्षक है। ‘वंशावली’ वंश-क्रम का भाव रखता है, जबकि पादटिप्पणी इसके व्यापक अर्थ की ओर संकेत करती है।
- source_word: יִצְחָק בֶּן אַבְרָהָם
  choice: अब्राहम के पुत्र इसहाक
  rationale: मूल के वंश-संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: אַבְרָהָם הוֹלִיד אֶת יִצְחָק
  choice: अब्राहम से इसहाक उत्पन्न हुआ
  rationale: हिफ़ील क्रिया के जनकत्व-संबंध को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘अब्राहम ने इसहाक को जन्म दिया’ से उत्पन्न होने वाली मातृ-जन्म की अस्वाभाविक ध्वनि से बचता है।
theological_decisions:
- issue: उत्पत्ति के תּוֹלְדֹת शीर्षक का अनुवाद
  choice: वंशावली
  alternative: वृत्तांत; कुल-विवरण; पीढ़ियाँ
  rationale: इसे केवल जीवनी या केवल बाद के वंशजों तक सीमित न करके उत्पत्ति की आवर्ती साहित्यिक संरचना और वंश-संबंध दोनों को बनाए रखा गया है। व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। नामों के प्रचलित हिन्दी रूप ‘अब्राहम’ और ‘इसहाक’ रखे गए हैं।
