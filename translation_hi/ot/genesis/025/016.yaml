  yaml_path: translation/ot/genesis/025/016.yaml
  text: 'These are the sons of Ishmael[a], and these are their names[c][b], by their settlements and by their encampments: twelve princes according to their peoples.'
translation:
  language: hi
  text: 'ये इश्माएल के पुत्र हैं, और उनकी बस्तियों और छावनियों के अनुसार उनके नाम ये हैं: अपने-अपने लोगों के बारह प्रधान।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה הֵם בְּנֵי יִשְׁמָעֵאל
  choice: ये इश्माएल के पुत्र हैं
  rationale: यह पद पहले दी गई नामावली का सार प्रस्तुत करता है। בְּנֵי का सीधा अर्थ ‘पुत्र’ है और निकट संदर्भ में इश्माएल के वास्तविक पुत्र अभिप्रेत हैं।
- source_word: וְאֵלֶּה שְׁמֹתָם
  choice: और ... उनके नाम ये हैं
  rationale: हिब्रू की संकेतवाचक संरचना को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: בְּחַצְרֵיהֶם וּבְטִירֹתָם
  choice: उनकी बस्तियों और छावनियों के अनुसार
  rationale: दोनों בְּ उपसर्गों को वर्गीकरणसूचक ‘के अनुसार’ समझना नामों को उनकी आबादियों और डेरों से जोड़ता है। חָצֵר के लिए ‘बस्ती’ और טִירָה के लिए ‘छावनी’ उनके स्थायी तथा शिविर-जैसे निवासों का भेद बनाए रखते हैं।
- source_word: שְׁנֵים עָשָׂר נְשִׂיאִם
  choice: बारह प्रधान
  rationale: נָשִׂיא यहाँ जनसमूह के मुखिया या प्रधान को दर्शाता है। ‘राजकुमार’ वंशानुगत राजपद का अनावश्यक संकेत दे सकता है।
- source_word: לְאֻמֹּתָם
  choice: अपने-अपने लोगों के
  rationale: אֻמָּה यहाँ प्रत्येक पुत्र से जुड़े जनसमूह को दर्शाता है। ‘लोगों’ मूल की व्यापकता बनाए रखता है और ‘गोत्र’ जैसी अधिक विशिष्ट संरचना आरोपित नहीं करता।
