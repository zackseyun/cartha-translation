source:
  edition: WLC
  text: וַ/יִּקְבְּר֨וּ אֹת֜/וֹ יִצְחָ֤ק וְ/יִשְׁמָעֵאל֙ בָּנָ֔י/ו אֶל מְעָרַ֖ת הַ/מַּכְפֵּלָ֑ה אֶל שְׂדֵ֞ה עֶפְרֹ֤ן בֶּן צֹ֨חַר֙ הַֽ/חִתִּ֔י אֲשֶׁ֖ר עַל פְּנֵ֥י מַמְרֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/009.yaml
  text: His sons Isaac and Ishmael buried him in the cave of Machpelah[a], in the field of Ephron son of Zohar the Hittite, which is opposite Mamre.
translation:
  language: hi
  text: उसके पुत्र इसहाक और इश्माएल ने उसे मकपेला की गुफा में, सोहर के पुत्र हित्ती एप्रोन के उस खेत में दफनाया जो मम्रे के सामने था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: ने उसे … दफनाया
  rationale: क्रिया קבר के कथात्मक भूतकाल और पुरुषवाचक कर्म-सर्वनाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִצְחָק וְיִשְׁמָעֵאל בָּנָיו
  choice: उसके पुत्र इसहाक और इश्माएल
  rationale: בָּנָיו को नामों के साथ संबंधसूचक पद के रूप में रखकर अब्राहम के दोनों पुत्रों की पहचान स्पष्ट की गई है।
- source_word: אֶל מְעָרַת הַמַּכְפֵּלָה
  choice: मकपेला की गुफा में
  rationale: दफनाने के प्रसंग में אֶל का लक्ष्य अन्ततः दफन-स्थान है; हिन्दी मुहावरे में ‘गुफा में दफनाया’ स्वाभाविक है। मकपेला को स्थान-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: אֶל שְׂדֵה עֶפְרֹן
  choice: एप्रोन के खेत में
  rationale: दूसरा אֶל गुफा के व्यापक स्थान को और स्पष्ट करता है; हिन्दी में स्थानवाचक ‘में’ उपयुक्त है।
- source_word: בֶּן צֹחַר הַחִתִּי
  choice: हित्ती सोहर के पुत्र
  rationale: वंश-संबंध और जातीय विशेषण दोनों सुरक्षित हैं। वाक्य-विन्यास में ‘हित्ती’ को सोहर के साथ रखा गया है, जैसा इब्रानी में निकटतम संबंध है।
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: जो मम्रे के सामने था
  rationale: भौगोलिक प्रयोग में עַל־פְּנֵי के ‘सामने/आमने-सामने’ अर्थ को रखा गया है और पाठ में निहित न होने वाली निश्चित दिशा नहीं जोड़ी गई।
