source:
  edition: WLC
  text: וְ/אַֽחֲרֵי כֵ֞ן יָצָ֣א אָחִ֗י/ו וְ/יָד֤/וֹ אֹחֶ֨זֶת֙ בַּ/עֲקֵ֣ב עֵשָׂ֔ו וַ/יִּקְרָ֥א שְׁמ֖/וֹ יַעֲקֹ֑ב וְ/יִצְחָ֛ק בֶּן שִׁשִּׁ֥ים שָׁנָ֖ה בְּ/לֶ֥דֶת אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/026.yaml
  text: Afterward his brother came out[a], and his hand was grasping Esau’s heel, so his name was called Jacob. And Isaac was sixty years old when they were born.
translation:
  language: hi
  text: उसके बाद उसका भाई बाहर आया[a], और उसका हाथ एसाव की एड़ी पकड़े हुए था; इसलिए उसका नाम याकूब रखा गया। जब वे जन्मे, तब इसहाक साठ वर्ष का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याकूब’ नाम की ध्वनि इब्रानी में ‘एड़ी’ से जुड़ती है और आगे चलकर ‘स्थान लेने’ या ‘पछाड़ने’ के भाव से भी संबद्ध होती है; यह उस विवरण के अनुकूल है कि उसका हाथ एसाव की एड़ी पकड़े हुए था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: उसके बाद
  rationale: यह पदबंध पिछले जन्म के बाद की क्रमिक घटना बताता है; आधुनिक हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: יָצָא
  choice: बाहर आया
  rationale: मूल क्रिया गर्भ से निकलने का सजीव वर्णन करती है; केवल ‘जन्मा’ कहने की अपेक्षा यह उसकी अभिव्यक्ति को अधिक निकटता से रखता है।
- source_word: אָחִיו
  choice: उसका भाई
  rationale: इब्रानी में केवल ‘उसका भाई’ है; प्रसंग से जुड़वाँ होना ज्ञात है, पर उसे यहाँ जोड़ना आवश्यक नहीं।
- source_word: וְיָדוֹ אֹחֶזֶת
  choice: और उसका हाथ ... पकड़े हुए था
  rationale: सहभागी कृदंत उस समय जारी अवस्था को व्यक्त करता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בַּעֲקֵב עֵשָׂו
  choice: एसाव की एड़ी
  rationale: संबंधसूचक रचना को हिन्दी में सहज अधिकार-संबंध के रूप में व्यक्त किया गया है।
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: इसलिए उसका नाम ... रखा गया
  rationale: मूल में कर्ता अस्पष्ट है; कर्मवाच्य हिन्दी इस अस्पष्टता को बनाए रखता है। ‘इसलिए’ एड़ी पकड़ने और नामकरण के कथात्मक संबंध को दर्शाता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: यह आधुनिक हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप है।
- source_word: בֶּן שִׁשִּׁים שָׁנָה
  choice: साठ वर्ष का था
  rationale: इब्रानी आयु-सूचक मुहावरे का स्वाभाविक हिन्दी रूप।
- source_word: בְּלֶדֶת אֹתָם
  choice: जब वे जन्मे
  rationale: यह उनके जन्म के समय को बताता है और मूल की तरह जन्म देने वाले कर्ता का नाम स्पष्ट रूप से नहीं जोड़ता।
