id: GEN.25.10
reference: Genesis 25:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/שָּׂדֶ֛ה אֲשֶׁר קָנָ֥ה אַבְרָהָ֖ם מֵ/אֵ֣ת בְּנֵי חֵ֑ת שָׁ֛מָּ/ה קֻבַּ֥ר אַבְרָהָ֖ם וְ/שָׂרָ֥ה אִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/010.yaml
  text: the field that Abraham bought from the sons of Heth—there Abraham and Sarah his wife were buried[a][b][c].
translation:
  language: hi
  text: वह खेत, जिसे अब्राहम ने हित्तियों[a] से खरीदा था—वहीं अब्राहम और उसकी पत्नी सारा को दफ़नाया गया था[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “हेत के पुत्रों”; यह अभिव्यक्ति हित्ती जाति के लोगों को सूचित कर सकती है।'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक संरचना के अधिक निकट: “वहीं अब्राहम को, और उसकी पत्नी सारा को, दफ़नाया गया था।” हिब्रू में क्रिया एकवचन है, पर वह दोनों व्यक्तियों पर लागू होती है।'
    reason: previous_rendering
  - marker: c
    text: 'या वाक्य-विभाजन के साथ: “वह खेत, जिसे अब्राहम ने हित्तियों से खरीदा था। वहीं...” हिब्रू में ‘खेत’ को पहले विषय के रूप में रखा गया है।'
    reason: previous_rendering
lexical_decisions:
- source_word: הַשָּׂדֶה
  choice: वह खेत
  rationale: निश्चित संज्ञा पूर्वोक्त कब्रिस्तान की भूमि की ओर संकेत करती है; ‘वह खेत’ प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: אֲשֶׁר
  choice: जिसे
  rationale: यह संबंधवाचक अव्यय ‘खेत’ को आगे के उपवाक्य से जोड़ता है।
- source_word: קָנָה
  choice: खरीदा था
  rationale: भूमि के लेन-देन के प्रसंग में क्रिया का ठोस वाणिज्यिक अर्थ ‘खरीदना’ है; पूर्वकालिकता के कारण ‘था’ स्वाभाविक है।
- source_word: מֵאֵת
  choice: से
  rationale: यह खरीद के स्रोत को व्यक्त करता है; हिन्दी में ‘से’ पर्याप्त और सहज है।
- source_word: בְּנֵי חֵת
  choice: हित्तियों
  rationale: शाब्दिक अर्थ ‘हेत के पुत्र’ है, पर यह जातीय समुदाय का सामान्य पदनाम है; आधुनिक हिन्दी में ‘हित्ती’ अधिक सहज है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: שָׁמָּה
  choice: वहीं
  rationale: यह पहले बताए गए खेत/स्थान पर बल देते हुए लौटता है; ‘वहीं’ हिन्दी में उस स्थानिक संकेत को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קֻבַּר
  choice: दफ़नाया गया था
  rationale: यह ‘दफ़नाना’ की निफ़अल पूर्ण क्रिया है। हिन्दी में संयुक्त कर्ता के साथ पुल्लिंग बहुवचन-सम्मान/सामान्य रूप ‘दफ़नाया गया’ स्वाभाविक है और क्रिया दोनों व्यक्तियों पर लागू होती है।
- source_word: וְשָׂרָה אִשְׁתּוֹ
  choice: और उसकी पत्नी सारा
  rationale: हिब्रू का अर्थ सुरक्षित रखते हुए यह आधुनिक हिन्दी में ‘सारा, उसकी पत्नी’ की अपेक्षा अधिक सहज शब्दक्रम है।
theological_decisions:
- issue: एकवचन हिब्रू क्रिया और संयुक्त कर्ता
  choice: ‘अब्राहम और उसकी पत्नी सारा को दफ़नाया गया था’—क्रिया को दोनों पर लागू किया गया
  alternative: ‘अब्राहम को और उसकी पत्नी सारा को दफ़नाया गया था’
  rationale: पूर्वस्थित एकवचन क्रिया हिब्रू में संयुक्त कर्ता के साथ व्याकरणिक रूप से संभव है; अर्थ यह है कि अब्राहम और सारा दोनों वहीं दफ़नाए गए। हिन्दी रूप इस अर्थ को स्पष्ट करता है, बिना अलग-अलग दफ़न क्रियाएँ मानने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। ‘हित्तियों’ को मुख्य पाठ में पठनीयता के लिए चुना गया है और मूल की पारिवारिक/जातीय अभिव्यक्ति पादटिप्पणी में दी गई है। डैश हिब्रू की विषय-प्रमुख संरचना को वाक्य-खंड बनाए बिना दर्शाता है।
