lexical_decisions:
- source_word: חֲדַד
  choice: हदद
  rationale: वंशावली में आया व्यक्तिनाम; हिब्रू व्यंजनों के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: תֵימָא
  choice: तेमा
  rationale: व्यक्तिनाम/गोत्र-संबंधी नाम; हिब्रू उच्चारण के निकट स्वाभाविक हिन्दी लिप्यंतरण।
- source_word: יְטוּר
  choice: यतूर
  rationale: आरम्भिक योड को हिन्दी में ‘य’ से व्यक्त करते हुए नाम का सीधा लिप्यंतरण किया गया है।
- source_word: נָפִישׁ
  choice: नापीश
  rationale: हिब्रू स्वरांकन और अंतिम שׁ को क्रमशः ‘ना’ और ‘श’ से दर्शाया गया है।
- source_word: קֵדְמָה
  choice: केदमा
  rationale: नाम को हिब्रू रूप के निकट रखा गया है; हिन्दी में अनावश्यक अंतिम ‘ह’ नहीं जोड़ा गया।
- source_word: וְ / וָ
  choice: और
  rationale: सूची में जुड़े नामों के बीच आए संयोजक को स्वाभाविक हिन्दी शैली में अंतिम नाम से पहले ‘और’ के रूप में दिया गया है।
