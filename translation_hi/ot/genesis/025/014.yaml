lexical_decisions:
- source_word: מִשְׁמָע
  choice: मिशमा
  rationale: वंशावली में व्यक्तिवाचक नाम है; अर्थानुवाद के बजाय हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है। अंतिम ע को हिंदी में अलग ध्वनि देकर दिखाना स्वाभाविक नहीं है।
- source_word: דוּמָה
  choice: दूमा
  rationale: व्यक्तिवाचक नाम का हिब्रू दीर्घ ऊ स्वर रखते हुए स्वाभाविक हिंदी लिप्यंतरण। अंतिम ה यहाँ अलग व्यंजन-ध्वनि के रूप में नहीं पढ़ा जाता।
- source_word: מַשָּׂא
  choice: मस्सा
  rationale: संदर्भ में यह व्यक्ति अथवा गोत्र का नाम है, इसलिए समान रूप वाले सामान्य संज्ञा-अर्थ का अनुवाद नहीं किया गया। दोगुने व्यंजन को हिंदी में ‘स्स’ से दर्शाया गया है।
