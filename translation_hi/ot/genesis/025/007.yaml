  choice: कुल
  rationale: यह पद अब्राहम की आयु का सार प्रस्तुत करता है। आरंभिक संयोजक और संकेतवाचक को हिंदी में अलग से रखने के बजाय सारसूचक वाक्य में स्वाभाविक रूप से समाहित किया गया है।
- source_word: יְמֵי שְׁנֵי חַיֵּי אַבְרָהָם
  choice: अब्राहम ने ... वर्ष का जीवन जिया
  rationale: शाब्दिक रचना ‘अब्राहम के जीवन के वर्षों के दिन’ हिंदी में अस्वाभाविक है। चुना हुआ रूप जीवनकाल का वही अर्थ सहज हिंदी में व्यक्त करता है; मूल अभिव्यक्ति को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֲשֶׁר חָי
  choice: जीवन जिया
  rationale: सापेक्ष उपवाक्य ‘जितने वह जीवित रहा’ को हिंदी की स्वाभाविक क्रियात्मक अभिव्यक्ति में समाहित किया गया है, जिससे मूल का जीवित रहने पर दिया गया बल बना रहता है।
- source_word: אַבְרָהָם
  choice: अब्राहम
  rationale: व्यक्तिनाम का प्रचलित मानक हिंदी लिप्यंतरण अपनाया गया है।
- source_word: מְאַת שָׁנָה וְשִׁבְעִים שָׁנָה וְחָמֵשׁ שָׁנִים
  choice: एक सौ पचहत्तर वर्ष
  rationale: इब्रानी में संख्या 100+70+5 के योगात्मक रूप में है। आधुनिक हिंदी में ठीक वही कुल संख्या स्वाभाविक ढंग से दी गई है।
