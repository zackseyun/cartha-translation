review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders Jacob’s speech, the imperative to sell, the recipient ‘to me,’ and the temporal force of כַיּוֹם. However, ‘अपना पहलौठे का अधिकार’ is not idiomatic Hindi and can be syntactically unclear; it should explicitly denote the right/status of being the firstborn.
  naturalness: ‘आज ही अपना जेठे होने का अधिकार मुझे बेच दे’ is direct, modern, and natural while retaining the forceful bargaining context. ‘जेठे होने का अधिकार’ is clearer to contemporary readers than the draft’s phrasing.
  terminology: ‘जेठे होने का अधिकार’ accurately conveys בְּכֹרָה, the rights or status attached to being the firstborn, without importing later doctrinal interpretation. The name ‘याकूब’ is appropriate.
  issues:
  - severity: medium
    issue: Unnatural and potentially ambiguous expression for birthright
    rationale: ‘अपना पहलौठे का अधिकार’ is grammatically awkward. In particular, ‘पहलौठे’ does not naturally function here as the required possessive/status expression, and the phrase may be read less clearly than intended. ‘अपना जेठे होने का अधिकार’ clearly expresses the firstborn right represented by בְּכֹרָה.
  - severity: low
    issue: Temporal idiom’s alternative nuance is omitted
    rationale: Rendering כַיּוֹם as ‘आज ही’ is sound, but the idiom can also be understood as ‘आज से’ or ‘इसी दिन.’ A brief footnote preserves this lexical ambiguity without burdening the main text.
