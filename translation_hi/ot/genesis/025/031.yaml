  rationale: מכר का आज्ञार्थक रूप है। ‘बेच दे’ सीधे आदेश और लेन-देन पूरा करने की अपेक्षा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַיּוֹם
  choice: आज ही
  rationale: यह पद ‘आज/इसी दिन’ के साथ तत्काल और बाध्यकारी लेन-देन पर बल देता है; ‘आज ही’ हिन्दी में यह जोर स्पष्ट करता है।
- source_word: אֶת
  choice: '[प्रत्यक्ष कर्म-चिह्न, अनूदित नहीं]'
  rationale: אֶת निश्चित प्रत्यक्ष कर्म को चिह्नित करता है और हिन्दी में इसका स्वतंत्र अनुवाद आवश्यक नहीं है।
- source_word: בְּכֹרָתְךָ
  choice: अपना पहलौठे का अधिकार
  rationale: בְּכֹרָה पहले जन्मे पुत्र की हैसियत से जुड़े अधिकारों और विशेषाधिकारों को दर्शाता है। ‘पहलौठे का अधिकार’ साधारण पाठक के लिए स्पष्ट और स्रोत के निकट है।
- source_word: לִי
  choice: मुझे
  rationale: ‘बेचना’ के साथ हिन्दी में ‘मुझे बेच दे’ स्वाभाविक अप्रत्यक्ष कर्म-रचना है।
