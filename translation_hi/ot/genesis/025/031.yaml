- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में सामान्य भूतकाल ‘ने कहा’ स्वाभाविक है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: מִכְרָה
