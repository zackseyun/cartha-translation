source:
  edition: WLC
  text: וְ/לִ/בְנֵ֤י הַ/פִּֽילַגְשִׁים֙ אֲשֶׁ֣ר לְ/אַבְרָהָ֔ם נָתַ֥ן אַבְרָהָ֖ם מַתָּנֹ֑ת וַֽ/יְשַׁלְּחֵ֞/ם מֵ/עַ֨ל יִצְחָ֤ק בְּנ/וֹ֙ בְּ/עוֹדֶ֣/נּוּ חַ֔י קֵ֖דְמָ/ה אֶל אֶ֥רֶץ קֶֽדֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/006.yaml
  text: But to the sons of his concubines[a], Abraham gave gifts, and while he was still alive he sent them away from his son Isaac[b], eastward to the land of the east.
translation:
  language: hi
  text: पर अब्राहम ने अपनी उपपत्नियों के बेटों[a] को उपहार दिए और अपने जीते-जी उन्हें अपने पुत्र इसहाक से दूर, पूर्व की ओर, पूर्व के देश में भेज दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उपपत्नियाँ’ से आशय मान्य किंतु मुख्य पत्नी से कम सामाजिक-वैवाहिक दर्जा रखने वाली स्त्रियों से है।
    reason: lexical_clarification
lexical_decisions:
- source_word: וְלִבְנֵי הַפִּילַגְשִׁים אֲשֶׁר לְאַבְרָהָם
  choice: पर अब्राहम ने अपनी उपपत्नियों के बेटों को
  rationale: पिछले पद में इसहाक को उत्तराधिकारी बनाए जाने के विपरीत स्थिति को ‘पर’ व्यक्त करता है। ‘उपपत्नियाँ’ मान्य किंतु निम्न वैवाहिक दर्जे वाली स्त्रियों के लिए गरिमापूर्ण और अपेक्षाकृत सटीक शब्द है।
- source_word: נָתַן ... מַתָּנֹת
  choice: उपहार दिए
  rationale: क्रिया और कर्म का सीधा, स्वाभाविक अनुवाद है और उत्तराधिकार के प्रसंग में भी उपयुक्त है।
- source_word: וַיְשַׁלְּחֵם מֵעַל יִצְחָק בְּנוֹ
  choice: उन्हें अपने पुत्र इसहाक से दूर ... भेज दिया
  rationale: ‘भेज दिया’ प्रस्थान को और ‘से दूर’ מֵעַל में निहित इसहाक से अलग किए जाने के भाव को स्पष्ट रखता है।
- source_word: בְּעוֹדֶנּוּ חַי
  choice: अपने जीते-जी
  rationale: यह सहज आधुनिक हिन्दी में बताता है कि अब्राहम ने यह काम अपनी मृत्यु से पहले किया।
- source_word: קֵדְמָה אֶל אֶרֶץ קֶדֶם
  choice: पूर्व की ओर, पूर्व देश में
  rationale: पहला पद दिशा और दूसरा पूर्वी भू-प्रदेश को सूचित करता है; पुनरुक्ति मूल इब्रानी की संरचना और जोर को सुरक्षित रखती है।
theological_decisions:
- issue: इसहाक और उपपत्नियों के बेटों के बीच उत्तराधिकार-संबंधी भेद
  choice: ‘पर’ और ‘इसहाक से दूर’ के द्वारा पाठ का विरोध और अलगाव बनाए रखा गया
  alternative: सिर्फ ‘और’ तथा ‘इसहाक के पास से’
  rationale: संदर्भ इसहाक को मुख्य उत्तराधिकारी और दूसरे बेटों को उपहार देकर दूर भेजे जाने का भेद दिखाता है, पर अनुवाद उनके अधिकार या वैवाहिक स्थिति पर पाठ से आगे कोई धर्मशास्त्रीय निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘रखैलों’ की अपेक्षा ‘उपपत्नियों’ चुना गया है ताकि प्राचीन सामाजिक-वैवाहिक स्थिति व्यक्त हो और अनावश्यक अपमानजनक स्वर से बचा जा सके।
