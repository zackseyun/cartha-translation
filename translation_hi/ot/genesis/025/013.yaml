  text: 'And these are the names of the sons of Ishmael[a], by their names according to their generations: the firstborn of Ishmael was Nebaioth, and Kedar, and Adbeel, and Mibsam.'
translation:
  language: hi
  text: 'और ये इश्माएल के पुत्रों के नाम हैं, उनके नामों और उनकी वंश-परंपराओं के अनुसार: इश्माएल का ज्येष्ठ पुत्र नबायोत था; फिर केदार, अदबेल और मिबसाम थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: और ... के नाम ... ये हैं
  rationale: इब्रानी संयोजक और सूची आरम्भ करने वाली प्रदर्शक रचना को स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है।
- source_word: בְּנֵי יִשְׁמָעֵאל
  choice: इश्माएल के पुत्रों
  rationale: वंशावली की औपचारिक शैली बनाए रखते हुए construct chain का सीधा अनुवाद।
- source_word: בִּשְׁמֹתָם לְתוֹלְדֹתָם
  choice: नाम उनकी पीढ़ियों के अनुसार
  rationale: ‘उनके नाम’ का भाव ‘पुत्रों के नाम’ में पहले ही स्पष्ट है; לְתוֹלְדֹתָם की वंशगत अर्थ-सीमा को ‘पीढ़ियों’ से रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בְּכֹר יִשְׁמָעֵאל
  choice: इश्माएल का पहलौठा
  rationale: ‘पहलौठा’ ज्येष्ठ पुत्र की स्थिति को संक्षेप और परंपरागत रूप से व्यक्त करता है।
- source_word: נְבָיֹת וְקֵדָר וְאַדְבְּאֵל וּמִבְשָׂם
  choice: नबायोत, फिर केदार, अदबेल और मिबसाम
  rationale: नामों के निकट ध्वन्यात्मक हिन्दी रूप अपनाए गए हैं। बार-बार आए וְ को हिन्दी सूची में स्वाभाविक बनाने के लिए ‘फिर’ और अंतिम ‘और’ से व्यक्त किया गया है।
