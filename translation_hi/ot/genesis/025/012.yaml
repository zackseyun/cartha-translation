- source_word: שִׁפְחַת שָׂרָה
  choice: सारा की दासी
  rationale: ‘दासी’ स्त्री सेवक के साथ उसकी पराधीन सामाजिक स्थिति भी व्यक्त करता है; पादटिप्पणी इस अर्थ को और स्पष्ट करती है।
- source_word: לְאַבְרָהָם
  choice: अब्राहम के लिए
  rationale: ילד के साथ לְ को उसके मूल संबंधसूचक रूप में रखा गया है—हाजिरा ने संतान अब्राहम के लिए जनी—और इसे ‘अब्राहम से’ करके व्याख्यात्मक ढंग से नहीं बदला गया।
