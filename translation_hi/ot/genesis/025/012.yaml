  yaml_path: translation/ot/genesis/025/012.yaml
  text: These are the generations of Ishmael[a], Abraham’s son, whom Hagar the Egyptian, Sarah’s servant woman[b], bore to Abraham.
translation:
  language: hi
  text: 'अब्राहम के पुत्र इश्माएल की वंशावली[a] यह है: जिसे मिस्री हाजिरा ने, जो सारा की दासी[b] थी, अब्राहम के लिए जना था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और यह इश्माएल की वंशावली है।” इब्रानी शब्द תּוֹלְדוֹת (तोलेदोत) उत्पत्ति की पुस्तक में बार-बार आने वाला शीर्षक है; इसका अनुवाद “वंशज” या “कुल-वृत्तांत” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “सारा की स्त्री दासी” या “सारा की सेविका।” इब्रानी שִׁפְחָה (शिफ़्ख़ा) ऐसी स्त्री दासी या सेविका को दर्शाता है जो पराधीन स्थिति में थी।
    reason: lexical_alternative
