  text: When her days to give birth were fulfilled, behold, there were twins in her womb.
translation:
  language: hi
  text: जब उसके प्रसव का समय पूरा हुआ, तब देखो, उसके गर्भ में जुड़वाँ बच्चे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלְאוּ יָמֶיהָ
  choice: उसके ... दिन पूरे हुए
  rationale: מלא के साथ 'दिन' पूरा समय हो जाने का हिब्रानी मुहावरा है। यह रूप मूल की संरचना को पर्याप्त रूप से बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: לָלֶדֶת
  choice: जन्म देने के
  rationale: ילד का यह रूप प्रसव करने को दर्शाता है; 'जन्म देने' आधुनिक मानक हिन्दी में सहज और स्पष्ट है।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: यह ध्यान खींचने वाला कथात्मक संकेत है, जो आगे आने वाली उल्लेखनीय बात पर बल देता है। 'तो देखो' उसके आश्चर्य और उभार को स्वाभाविक हिन्दी में रखता है।
- source_word: תוֹמִם
  choice: जुड़वाँ बच्चे
  rationale: शब्द का अर्थ जुड़वाँ है। हिन्दी में इस प्रसंग में 'जुड़वाँ बच्चे' अधिक स्पष्ट और सहज है।
- source_word: בְּבִטְנָהּ
  choice: उसके गर्भ में
  rationale: בטן पेट अथवा गर्भ का बोध करा सकता है; प्रसव के संदर्भ में 'गर्भ' सटीक और स्वाभाविक है।
