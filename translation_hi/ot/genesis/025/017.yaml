  text: וְ/אֵ֗לֶּה שְׁנֵי֙ חַיֵּ֣י יִשְׁמָעֵ֔אל מְאַ֥ת שָׁנָ֛ה וּ/שְׁלֹשִׁ֥ים שָׁנָ֖ה וְ/שֶׁ֣בַע שָׁנִ֑ים וַ/יִּגְוַ֣ע וַ/יָּ֔מָת וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/017.yaml
  text: 'These were the years of Ishmael’s life: one hundred and thirty-seven years[a]. And he breathed his last and died[b], and was gathered to his people.'
translation:
  language: hi
  text: 'इश्माएल के जीवन के वर्ष ये थे: एक सौ सैंतीस वर्ष। और उसने प्राण छोड़े[a] और मर गया, और वह अपने लोगों में जा मिला[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसने अंतिम साँस ली।’ यहाँ प्रयुक्त इब्रानी क्रिया इसके बाद आने वाले ‘मर गया’ से अलग है; इसलिए अनुवाद में दोनों अभिव्यक्तियाँ रखी गई हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने लोगों में जा मिला’ मृत्यु के प्रसंगों में प्रयुक्त एक इब्रानी मुहावरा है। इसका संकेत अपने पूर्वजों से मिलन, अपने संबंधियों के बीच दफ़न किए जाने, या दोनों की ओर हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה שְׁנֵי חַיֵּי יִשְׁמָעֵאל
  choice: इश्माएल के जीवन के वर्ष ये थे
  rationale: इब्रानी के सारांशात्मक जीवन-विवरण को स्वाभाविक हिंदी में रखते हुए ‘जीवन के वर्ष’ की अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: מְאַת שָׁנָה וּשְׁלֹשִׁים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: एक सौ सैंतीस वर्ष
  rationale: इब्रानी संख्या-क्रम का ठीक योग आधुनिक हिंदी की सामान्य संख्या-अभिव्यक्ति में दिया गया है।
- source_word: וַיִּגְוַע
  choice: उसने प्राण छोड़े
  rationale: यह मृत्यु-सूचक क्रिया अगली क्रिया ‘मर गया’ से अलग रखी गई है; ‘प्राण छोड़े’ हिंदी में अंतिम साँस लेने का स्वाभाविक और गरिमापूर्ण कथन है।
- source_word: וַיָּמָת
  choice: और मर गया
  rationale: इब्रानी में प्रयुक्त दूसरी, सामान्य मृत्यु-सूचक क्रिया को अलग अनूदित किया गया है, ताकि मूल की पुनरुक्ति न मिटे।
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: और वह अपने लोगों में मिला लिया गया
  rationale: निफ़अल के कर्मवाच्य रूप और इब्रानी मृत्यु-सूत्र को यथासंभव सुरक्षित रखते हुए ऐसा हिंदी रूप चुना गया है जो दफ़न, पूर्वजों से मिलन, या दोनों की संभावना को बंद नहीं करता।
theological_decisions:
- issue: ‘अपने लोगों में मिला लिया गया’ मृत्यु-सूत्र का अर्थ
  choice: मुहावरे को कर्मवाच्य रूप में बनाए रखा गया और उसके आशय को स्पष्ट करके सीमित नहीं किया गया।
  alternative: इसे केवल पारिवारिक कब्र में दफ़न होना, या केवल मृत्यु के बाद पूर्वजों से पुनर्मिलन मानना।
  rationale: इब्रानी वाक्यांश दोनों प्रकार के संकेत दे सकता है, पर स्वयं पाठ किसी एक व्याख्या को अनिवार्य नहीं बनाता; इसलिए उसका धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। ‘प्राण छोड़े’ और ‘मर गया’ दोनों रखकर मूल की दो अलग मृत्यु-सूचक क्रियाएँ सुरक्षित की गई हैं; अंतिम मुहावरे को अत्यधिक व्याख्यायित नहीं किया गया।
