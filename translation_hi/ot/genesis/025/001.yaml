  choice: अब्राहम ने एक और पत्नी ली
  alternative: अब्राहम ने फिर एक पत्नी ली
  rationale: ‘एक और’ पत्नी के जुड़ने का भाव स्पष्ट करता है, जबकि पादटिप्पणी ‘फिर’ वाले सम्भव रूप को सुरक्षित रखती है। यह पाठ से आगे बढ़कर विवाह के समय या कतूरा की पूर्व स्थिति के विषय में कोई निष्कर्ष नहीं निकालता।
