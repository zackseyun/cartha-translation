translation:
  language: hi
  text: और उसने उसके लिए जिम्रान, योक्षान, मेदान, मिद्यान, यिश्बाक और शूअह को जन्म दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: उत्पन्न हुए
  rationale: ילד के क़ाल वय्यिक्तोल स्त्रीलिंग एकवचन रूप का अर्थ प्रसव करना है। हिन्दी की वंशावली-शैली में ‘उससे ... उत्पन्न हुए’ स्वाभाविक और गरिमापूर्ण है तथा अनावश्यक रूप से ‘पुत्रों’ शब्द नहीं जोड़ता।
- source_word: לוֹ
  choice: उसके लिए
  rationale: ל उपसर्ग और पुल्लिंग एकवचन प्रत्यय यहाँ पिता के साथ सम्बन्ध दर्शाते हैं। ‘उससे उसके लिए ... उत्पन्न हुए’ मातृ और पितृ दोनों सम्बन्ध बनाए रखता है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: प्रत्येक नाम के पहले आया सीधा कर्म-सूचक चिह्न है; हिन्दी वाक्य-विन्यास में इसका अलग शब्दगत समतुल्य आवश्यक नहीं।
- source_word: זִמְרָן
  choice: जिम्रान
  rationale: इब्रानी व्यंजन और स्वरांकन के निकट देवनागरी लिप्यंतरण।
- source_word: יָקְשָׁן
  choice: योक्षान
  rationale: इब्रानी योध को ‘य’ और קְשׁ समूह को प्रचलित हिन्दी बाइबलीय रूप ‘क्ष’ से दर्शाया गया है।
- source_word: מְדָן
  choice: मदान
  rationale: इब्रानी स्वरांकन के निकट नाम का देवनागरी लिप्यंतरण।
- source_word: מִדְיָן
  choice: मिद्यान
  rationale: नाम में स्पष्ट योध को ‘य’ द्वारा सुरक्षित रखते हुए इब्रानी के निकट लिप्यंतरण।
- source_word: יִשְׁבָּק
  choice: यिशबाक
  rationale: आरम्भिक योध और इब्रानी ध्वनियों को निकटता से दर्शाने वाला देवनागरी लिप्यंतरण।
- source_word: שׁוּחַ
  choice: शूह
  rationale: अन्तिम ח की कण्ठ्य ध्वनि का हिन्दी में पूर्ण स्वाभाविक समतुल्य नहीं; परिचित और पठनीय ‘शूह’ रूप चुना गया है।
