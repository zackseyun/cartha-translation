    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּזֶד
  choice: पका रहा था
  rationale: यहाँ זיד उबालकर भोजन तैयार करने को सूचित करता है। हिंदी में ‘दाल पका रहा था’ स्वाभाविक है और क्रिया की जारी अवस्था को व्यक्त करता है।
- source_word: נָזִיד
  choice: दाल
  rationale: नָזִיד उबालकर बनाया गया गाढ़ा व्यंजन है। अगले पदों में उसका लाल रंग और मसूर की दाल होना स्पष्ट होता है; आधुनिक हिंदी में ‘दाल’ इस भोजन का सहज नाम है।
- source_word: וַיָּבֹא
  choice: लौटकर आया
  rationale: בוא का मूल अर्थ ‘आना’ है। ‘मैदान से’ के साथ हिंदी में ‘लौटकर आया’ स्वाभाविक रूप से बाहर से आने का भाव देता है, यद्यपि लौटने का भाव प्रसंगगत है।
- source_word: מִן הַשָּׂדֶה
  choice: मैदान से
  rationale: שׂדה खेत, मैदान या खुले देहात को सूचित कर सकता है। शिकारी एसाव के प्रसंग में ‘मैदान’ किसी खेती किए हुए खेत तक अर्थ को सीमित नहीं करता।
- source_word: וְהוּא עָיֵף
  choice: और वह बहुत थका हुआ था
  rationale: सर्वनाम सहित सरल विधेय-वाक्य को बनाए रखा गया है। עָיֵף तीव्र थकान को व्यक्त कर सकता है; ‘बहुत थका हुआ’ सहज आधुनिक हिंदी है।
