source:
  edition: WLC
  text: וַ/יִּשְׁכְּנ֨וּ מֵֽ/חֲוִילָ֜ה עַד שׁ֗וּר אֲשֶׁר֙ עַל פְּנֵ֣י מִצְרַ֔יִם בֹּאֲ/כָ֖ה אַשּׁ֑וּרָ/ה עַל פְּנֵ֥י כָל אֶחָ֖י/ו נָפָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/018.yaml
  text: They settled from Havilah to Shur[a], which is opposite Egypt as you go toward Asshur[b]. He settled opposite all his brothers.
translation:
  language: hi
  text: वे हवीला से शूर तक बस गए, जो मिस्र के सामने है और अश्शूर[a] की ओर जाते समय पड़ता है। वह अपने सब भाइयों के सामने जा बसा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अश्शूर” का अनुवाद “असीरिया” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी मुहावरे का अर्थ अनिश्चित है। इसका अर्थ यह भी हो सकता है, “वह अपने सब भाइयों के विरोध में रहने लगा”; अधिक शब्दशः, “वह अपने सब भाइयों के सामने गिर पड़ा।”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכְּנוּ
  choice: वे ... बस गए
  rationale: שׁכן का बहुवचन रूप यहाँ इश्माएल के वंशजों के किसी भूभाग में निवास करने या बसने को दर्शाता है; आधुनिक हिन्दी में “बस गए” स्वाभाविक है।
- source_word: מֵחֲוִילָה עַד שׁוּר
  choice: हवीला से लेकर शूर तक
  rationale: यह निवास-क्षेत्र की सीमा बताने वाली सीधी भौगोलिक अभिव्यक्ति है।
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: शूर मिस्र के सामने
  rationale: עַל־פְּנֵי का मूल स्थानवाचक अर्थ “के सामने/सम्मुख” है; दिशा को अनावश्यक रूप से निश्चित किए बिना इसे सुरक्षित रखा गया है।
- source_word: בֹּאֲכָה אַשּׁוּרָה
  choice: अश्शूर की ओर जाने वाले मार्ग पर
  rationale: दिशासूचक ה के साथ यह पद अश्शूर की ओर गति या मार्ग को व्यक्त करता है। स्थान-नाम “अश्शूर” रखा गया है, न कि व्याख्यात्मक “असीरिया।”
- source_word: עַל־פְּנֵי כָּל־אֶחָיו נָפָל
  choice: वह अपने सब भाइयों के सामने जा बसा
  rationale: नָפַל का सामान्य अर्थ “गिरना” है, पर इस वंशावली-भौगोलिक संदर्भ में पूरा मुहावरा उसके अपने संबंधियों के सम्मुख/सामने बसने को सूचित कर सकता है। “सामने” स्थान और संभावित विरोध—दोनों की अस्पष्टता को खुला रखता है।
theological_decisions:
- issue: עַל־פְּנֵי כָּל־אֶחָיו נָפָל मुहावरे का अर्थ
  choice: वह अपने सब भाइयों के सामने जा बसा
  alternative: वह अपने सब भाइयों के विरोध में रहने लगा; अथवा, वह अपने सब भाइयों के सामने गिर पड़ा
  rationale: इब्रानी पद विवादित है। उत्पत्ति 16:12 के आलोक में विरोध का भाव संभव है, किंतु यहाँ उसे मुख्य पाठ में निश्चित कर देना मूल की स्थानवाचक और मुहावरेदार अस्पष्टता को मिटा देगा। इसलिए अपेक्षाकृत औपचारिक अभिव्यक्ति मुख्य पाठ में और संभावित अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भूगोल के लिए “के सामने” और अंतिम विवादित मुहावरे के लिए “सामने जा बसा” चुना गया है, ताकि पाठ किसी निश्चित दिशा या शत्रुता को मूल से अधिक न थोपे।
