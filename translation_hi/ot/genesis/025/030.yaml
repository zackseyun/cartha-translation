base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/030.yaml
  text: Esau said to Jacob[a], “Please let me gulp down some of that red stuff, that red stuff there[c][b], because I am exhausted.” Therefore his name was called Edom.
translation:
  language: hi
  text: एसाव ने याकूब से कहा, “मुझे ज़रा उस लाल-लाल चीज़ में से कुछ गटागट निगल लेने दे[a], क्योंकि मैं थककर चूर हो गया हूँ।” इसी कारण उसका नाम एदोम पड़ा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में भोजन का नाम स्पष्ट रूप से नहीं दिया गया; शब्दशः भाव है, “उस लाल, उस लाल चीज़ में से।” यह पुनरुक्ति संभवतः एसाव की उतावली वाणी दर्शाती है। कई अनुवाद यहाँ “दाल” या “लाल दाल” कहते हैं।
    reason: lexical_alternative
  - marker: b
    text: “एदोम” नाम की ध्वनि इब्रानी के “लाल” शब्द से मिलती है; यहाँ इसी पर शब्द-क्रीड़ा है।
    reason: wordplay
lexical_decisions:
- source_word: הַלְעִיטֵנִי נָא
  choice: मुझे ज़रा … गटागट निगलने दे
  rationale: हिफ़ील आज्ञार्थक रूप में लालच या उतावलेपन से निगलने का भाव है। ‘गटागट निगलने दे’ एसाव की आवेगपूर्ण वाणी को व्यक्त करता है; ‘ज़रा’ यहाँ נָא को स्वाभाविक आधुनिक हिन्दी अनुरोध के रूप में प्रस्तुत करता है।
- source_word: מִן הָאָדֹם הָאָדֹם הַזֶּה
  choice: उस लाल-लाल चीज़ में से
  rationale: मूल इब्रानी में भोजन का नाम नहीं है, बल्कि ‘लाल’ शब्द दोहराया गया है। ‘लाल-लाल चीज़’ भोजन का नाम जोड़े बिना पुनरुक्ति और एसाव का रंग पर तत्काल ध्यान बनाए रखता है।
- source_word: כִּי עָיֵף אָנֹכִי
  choice: क्योंकि मैं थककर चूर हो गया हूँ
  rationale: עָיֵף अत्यधिक थकान या क्लांति बताता है। यह हिन्दी प्रयोग उसकी दशा और कथन की तात्कालिकता को स्वाभाविक ढंग से व्यक्त करता है, बिना यह अनिवार्य रूप से कहे कि वह बेहोश होने वाला था।
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: यह नामकरण की व्याख्या प्रस्तुत करने वाला स्पष्ट परिणामसूचक वाक्यांश है।
- source_word: קָרָא שְׁמוֹ אֱדוֹם
  choice: उसका नाम एदोम पड़ा
  rationale: यह स्वाभाविक हिन्दी नामकरण-वाक्य है और इब्रानी में कर्ता की अनिर्दिष्टता को बनाए रखता है।
- source_word: אֱדוֹם
  choice: एदोम
  rationale: व्यक्तिवाचक नाम का लिप्यंतरण किया गया है; ‘लाल’ से उसका शब्द-साम्य पादटिप्पणी में स्पष्ट किया गया है।
