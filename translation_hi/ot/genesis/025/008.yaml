  yaml_path: translation/ot/genesis/025/008.yaml
  text: And Abraham breathed his last and died in a good old age[a], old and full[b], and he was gathered to his people.
translation:
  language: hi
  text: अब्राहम ने अंतिम साँस ली और अच्छी वृद्धावस्था में मर गया; वह वृद्ध और तृप्त था[a], और अपने लोगों में इकट्ठा किया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘वृद्ध और तृप्त’ है। इसका अर्थ जीवन से संतुष्ट या भरपूर आयु पा चुका भी हो सकता है; मूल पाठ में यहाँ ‘दिनों से’ नहीं लिखा है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने लोगों में इकट्ठा किया गया’ इब्रानी का पारंपरिक मृत्यु-सूचक वाक्यांश है। इसमें मृत परिजनों से मिलन का संकेत हो सकता है, पर यह वाक्यांश उसके ठीक स्वरूप को स्पष्ट नहीं करता।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: अंतिम साँस ली
  rationale: मृत्यु-वर्णन में यह क्रिया प्राण निकलने को व्यक्त करती है। यह स्वाभाविक हिन्दी है और इसके बाद आने वाले ‘मरा’ से अलग अर्थ-छाया बनाए रखती है।
- source_word: וַיָּמָת
  choice: मरा
  rationale: यह मृत्यु के लिए सामान्य और सीधी इब्रानी क्रिया है; हिन्दी में भी इसे बिना शिष्टोक्ति के स्पष्ट रूप से रखा गया है।
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: अच्छे बुढ़ापे में
  rationale: यह पद मृत्यु के समय की अनुकूल और परिपक्व वृद्धावस्था बताता है। ‘अच्छे बुढ़ापे में’ अर्थ को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: זָקֵן
  choice: वृद्ध
  rationale: इब्रानी में यह स्वतंत्र विशेषण है। इसे अलग रखकर मूल के क्रमिक वर्णन को बनाए रखा गया है।
- source_word: וְשָׂבֵעַ
  choice: और तृप्त
  rationale: शब्द का मूल भाव ‘भरा हुआ/तृप्त’ है। ‘तृप्त’ हिन्दी में स्वाभाविक है और ‘जीवन’ या ‘दिनों’ को मुख्य पाठ में जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: फिर वह अपने लोगों में मिला लिया गया
  rationale: यह पारंपरिक मृत्यु-सूचक सूत्र का निकट और पठनीय हिन्दी रूप है। निष्क्रिय वाक्य-विन्यास तथा ‘अपने लोगों’ को बनाए रखने से इसे केवल दफ़न या परलोक में पुनर्मिलन के अर्थ तक सीमित नहीं किया गया।
- source_word: עַמָּיו
  choice: अपने लोगों
  rationale: शाब्दिक सामुदायिक और पारिवारिक व्यापकता सुरक्षित रखी गई है; इसे केवल ‘पुरखों’ या ‘रिश्तेदारों’ तक सीमित नहीं किया गया।
theological_decisions:
- issue: ‘अपने लोगों में मिला लिया गया’ का अभिप्राय
  choice: मृत्यु-सूचक इब्रानी सूत्र को इस प्रकार बनाए रखना कि उसका सटीक आशय खुला रहे।
  alternative: इसे केवल पारिवारिक कब्र में दफ़न होने या मृत पुरखों से सचेत पुनर्मिलन के स्पष्ट कथन के रूप में प्रस्तुत करना।
  rationale: पद स्वयं दफ़न, मृत संबंधियों से मिलन और मृत्यु के बाद की अवस्था के बीच किसी एक व्याख्या को निर्णायक रूप से नहीं चुनता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण मृत्यु-वर्णन रखा गया है। ‘देहांत हुआ’ जैसी शिष्टोक्ति से बचकर मूल के स्पष्ट ‘मरा’ को सुरक्षित रखा गया है; साथ ही पारंपरिक सूत्र की अस्पष्टता बनाए रखी गई है।
