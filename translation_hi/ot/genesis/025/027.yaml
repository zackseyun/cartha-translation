id: GEN.25.27
reference: Genesis 25:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יִּגְדְּלוּ֙ הַ/נְּעָרִ֔ים וַ/יְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְ/יַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/027.yaml
  text: When the boys grew up[a], Esau became a skillful hunter, a man of the field, but Jacob was a quiet man[b], dwelling in tents.
translation:
  language: hi
  text: जब दोनों लड़के बड़े हुए, तब एसाव एक कुशल शिकारी और खुले मैदानों का आदमी[a] बना; पर याकूब सीधा-सादा आदमी[b] था, जो तंबुओं में रहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मैदान का आदमी’।
    reason: lexical_alternative
  - marker: b
    text: या ‘खरा आदमी,’ ‘निर्दोष आदमी’ अथवा ‘सरल आदमी।’ इब्रानी शब्द में संपूर्णता, खराई, निर्दोषता या सरलता के भाव हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדְּלוּ הַנְּעָרִים
  choice: जब दोनों लड़के बड़े हुए
  rationale: संदर्भ में क्रिया का अर्थ बच्चों का बढ़कर वयस्क होना है। हिंदी में ‘बड़े हुए’ स्वाभाविक है; ‘दोनों’ इब्रानी निश्चित बहुवचन से संदर्भित जुड़वाँ भाइयों को स्पष्ट करता है।
- source_word: אִישׁ יֹדֵעַ צַיִד
  choice: एक कुशल शिकारी
  rationale: शाब्दिक रूप से ‘शिकार जाननेवाला मनुष्य’; यह पदबंध शिकार में अभ्यास और दक्षता व्यक्त करता है।
- source_word: אִישׁ שָׂדֶה
  choice: खुले मैदानों का आदमी
  rationale: שָׂדֶה का मूल अर्थ ‘मैदान/खुला प्रदेश’ है। यह अभिव्यक्ति एसाव के बाहरी, खुले प्रदेश से जुड़े जीवन को तंबुओं में रहनेवाले याकूब के विपरीत रखती है।
- source_word: אִישׁ תָּם
  choice: सीधा-सादा आदमी
  rationale: תָּם में संपूर्णता, खराई, निर्दोषता या सरलता के अर्थ हो सकते हैं। ‘सीधा-सादा’ तत्काल जीवनशैलीगत विरोध को स्वाभाविक हिंदी में रखता है, पर अधिक स्पष्ट नैतिक निर्णय नहीं थोपता।
- source_word: יֹשֵׁב אֹהָלִים
  choice: जो तंबुओं में रहता था
  rationale: कृदंत यहाँ याकूब की सामान्य या विशेषतापूर्ण जीवन-रीति बताता है। यह हिंदी में स्वाभाविक है और बहुवचन ‘तंबुओं’ को बनाए रखता है।
theological_decisions:
- issue: याकूब के लिए תָּם का अर्थ
  choice: सीधा-सादा
  alternative: खरा, निर्दोष, निष्कलंक, सरल
  rationale: तत्काल संदर्भ एसाव के खुले मैदान और याकूब के तंबू-जीवन का विरोध करता है। मुख्य पाठ में ‘सीधा-सादा’ इस विरोध को व्यक्त करता है, जबकि पादटिप्पणी शब्द के संभावित नैतिक अर्थों को सुरक्षित रखती है और याकूब के चरित्र पर अनावश्यक रूप से निर्णायक कथन नहीं करती।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘खुले मैदानों का आदमी’ और ‘तंबुओं में रहता था’ का संतुलन मूल पद्य के जीवनशैलीगत विरोध को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
