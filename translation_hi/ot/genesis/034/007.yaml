revisions:
- from: जब याकूब के बेटों ने यह बात सुनी, तो वे खेत से लौट आए। वे बहुत दुखी हुए और उनका क्रोध भड़क उठा, क्योंकि उसने याकूब की बेटी के साथ यौन-संबंध बनाकर इस्राएल में एक घोर अपमानजनक काम किया था—ऐसा काम जो नहीं किया जाना चाहिए।
  to: जब याकूब के बेटों ने यह बात सुनी, तो वे खेत से आ गए। वे बहुत दुखी हुए और उनका क्रोध बहुत भड़क उठा, क्योंकि उसने याकूब की बेटी के साथ यौन-संबंध करके इस्राएल में एक घोर अपमानजनक काम किया था—ऐसा काम नहीं किया जाता।
  rationale: The revision removes the additional implication of “returning,” renders the sexual idiom clearly without implying a reciprocal or continuing relationship, and makes the final normative prohibition more closely reflect the Hebrew impersonal expression. It preserves the verse’s ambiguity concerning the precise nature of the sexual act.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:24:51Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the sons' grief, intense anger, the disgraceful/outrageous character of the act, and the concluding moral prohibition. However, “खेत से लौट आए” adds the nuance of returning, whereas the Hebrew simply says that they came from the field. “यौन-संबंध बनाकर” can suggest entering into an ongoing or reciprocal relationship more than the Hebrew idiom requires.
  naturalness: The Hindi is generally clear and modern. “खेत से आ गए” is more direct for the narrative movement, and “यौन-संबंध करके” is more idiomatic and less implicative than “यौन-संबंध बनाकर.”
  terminology: “इस्राएल,” “घोर अपमानजनक काम,” and “क्रोध भड़क उठा” suitably render the key terms. The revised wording retains the source's lack of an explicit statement about consent or force in this verse.
  issues:
  - severity: low
    issue: “लौट आए” for “came from the field”
    rationale: “लौट” can imply a return to a previously established destination. The Hebrew only states that Jacob’s sons came from the field.
  - severity: medium
    issue: “यौन-संबंध बनाकर” may over-specify the Hebrew idiom
    rationale: This wording can imply forming a relationship and can sound reciprocal. The Hebrew “to lie with” identifies the sexual act but does not itself specify consent, force, or an ongoing relationship.
  - severity: low
    issue: Final relative clause is less direct than the Hebrew’s normative statement
    rationale: “ऐसा काम नहीं किया जाता” more closely retains the Hebrew’s concise impersonal, customary-normative formulation.
  revised_text: जब याकूब के बेटों ने यह बात सुनी, तो वे खेत से आ गए। वे बहुत दुखी हुए और उनका क्रोध बहुत भड़क उठा, क्योंकि उसने याकूब की बेटी के साथ यौन-संबंध करके इस्राएल में एक घोर अपमानजनक काम किया था—ऐसा काम नहीं किया जाता।
  revised_footnotes: []
  revision_rationale: The revision removes the additional implication of “returning,” renders the sexual idiom clearly without implying a reciprocal or continuing relationship, and makes the final normative prohibition more closely reflect the Hebrew impersonal expression. It preserves the verse’s ambiguity concerning the precise nature of the sexual act.
