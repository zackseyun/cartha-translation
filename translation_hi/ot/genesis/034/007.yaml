id: GEN.34.7
reference: Genesis 34:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְנֵ֨י יַעֲקֹ֜ב בָּ֤אוּ מִן הַ/שָּׂדֶה֙ כְּ/שָׁמְעָ֔/ם וַ/יִּֽתְעַצְּבוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹ֑ד כִּֽי נְבָלָ֞ה עָשָׂ֣ה בְ/יִשְׂרָאֵ֗ל לִ/שְׁכַּב֙ אֶת בַּֽת יַעֲקֹ֔ב וְ/כֵ֖ן לֹ֥א יֵעָשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/007.yaml
  text: And Jacob’s sons came in from the field when they heard it, and the men were grieved and very angry, because he had done an outrageous thing in Israel by lying with Jacob’s daughter, for such a thing must not be done.
translation:
  language: hi
  text: जब याकूब के बेटों ने यह बात सुनी, तो वे खेत से आ गए। वे बहुत दुखी हुए और उनका क्रोध बहुत भड़क उठा, क्योंकि उसने याकूब की बेटी के साथ यौन-संबंध करके इस्राएल में एक घोर अपमानजनक काम किया था—ऐसा काम नहीं किया जाता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְבָלָה
  choice: घोर अपमानजनक काम
  rationale: यह शब्द केवल सामान्य मूर्खता नहीं, बल्कि नैतिक रूप से घृणित और समुदाय का अपमान करने वाले कृत्य को व्यक्त करता है।
- source_word: לִשְׁכַּב אֶת
  choice: के साथ यौन-संबंध बनाकर
  rationale: इब्रानी मुहावरे का अर्थ स्पष्ट और आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त किया गया है; पद अपने आप में बलात्कार के लिए विशिष्ट क्रिया का प्रयोग नहीं करता।
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: उनका क्रोध भड़क उठा
  rationale: शाब्दिक रूप से ‘उन्हें बहुत जलन हुई’; चुना गया मुहावरा तीव्र क्रोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְכֵן לֹא יֵעָשֶׂה
  choice: ऐसा काम जो नहीं किया जाना चाहिए
  rationale: मूल के नैतिक निषेध को उसकी अवैयक्तिक रचना सहित बनाए रखता है।
theological_decisions:
- issue: בְיִשְׂרָאֵל का कालगत/सामुदायिक प्रयोग
  choice: इस्राएल में
  alternative: इस्राएल के परिवार में
  rationale: मूल का संक्षिप्त और संभवतः समुदाय-सूचक प्रयोग सुरक्षित रखा गया है; अनुवाद कथानक में बाद की राष्ट्रीय पहचान को स्पष्ट करके तनाव को समाप्त नहीं करता।
- issue: שׁכב את द्वारा व्यक्त यौन कृत्य की प्रकृति
  choice: यौन-संबंध बनाकर
  alternative: उसके साथ बलात्कार करके
  rationale: इस पद की क्रिया अपने आप में सहमति या बलप्रयोग को स्पष्ट नहीं करती। व्यापक प्रसंग गंभीर यौन अपराध दर्शाता है, पर इस पद में अधिक विशिष्ट शब्द जोड़ना मूल की शब्दगत अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘वे’ का निकटतम संदर्भ याकूब के बेटे हैं, जिन्हें अगले खंड में ‘पुरुष’ कहकर दोहराने के बजाय स्वाभाविक हिन्दी में सर्वनाम से जोड़ा गया है।
