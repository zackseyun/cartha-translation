  yaml_path: translation/ot/genesis/034/011.yaml
  text: Then Shechem said to her father and to her brothers[a], “Let me find favor in your eyes, and whatever you say to me[b], I will give.”
translation:
  language: hi
  text: तब शकेम ने उसके पिता और उसके भाइयों से कहा, “मुझे आपकी दृष्टि में अनुग्रह मिले, और आप मुझसे जो कुछ कहेंगे[a], मैं दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आप मुझसे जो कुछ माँगेंगे, मैं दूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁכֶם
  choice: शकेम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֶל אָבִיהָ וְאֶל אַחֶיהָ
  choice: उसके पिता और उसके भाइयों से
  rationale: दोनों संबोधित पक्षों को स्पष्ट रखता है; हिन्दी में ‘से’ को अंत में रखना स्वाभाविक है।
- source_word: אֶמְצָא חֵן בְּעֵינֵיכֶם
  choice: यदि मुझ पर आपकी कृपादृष्टि हो
  rationale: ‘अनुग्रह पाना/दृष्टि में अनुग्रह पाना’ वाले इब्रानी विनम्र निवेदन को सहज और गरिमापूर्ण हिन्दी मुहावरे में व्यक्त करता है।
- source_word: וַאֲשֶׁר תֹּאמְרוּ אֵלַי
  choice: तो आप मुझसे जो कुछ कहेंगे
  rationale: अनिश्चित संबंधवाचक अर्थ ‘जो कुछ’ से सुरक्षित है; אָמַר אֶל का मूल अर्थ ‘से कहना’ रखा गया है, संदर्भगत ‘माँगना’ मुख्य पाठ में नहीं जोड़ा गया।
- source_word: אֶתֵּן
  choice: मैं दूँगा
  rationale: נָתַן का व्यापक और सीधा अर्थ ‘देना’ है; ‘चुकाऊँगा’ विवाह-सौदे के संदर्भ को अनावश्यक रूप से संकरा कर देता।
