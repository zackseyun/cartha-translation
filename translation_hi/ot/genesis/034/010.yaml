lexical_decisions:
- source_word: וְאִתָּנוּ תֵּשֵׁבוּ
  choice: तुम हमारे साथ रहो
  rationale: יָשַׁב का अर्थ यहाँ साथ रहना या बसना है। आमंत्रण के संदर्भ में हिंदी आज्ञार्थक रूप स्वाभाविक रूप से अनुमति और निमंत्रण दोनों व्यक्त करता है।
- source_word: וְהָאָרֶץ תִּהְיֶה לִפְנֵיכֶם
  choice: और यह देश तुम्हारे सामने रहेगा
  rationale: यह अनुवाद मूल इब्रानी बिंब ‘तुम्हारे सामने’ को बनाए रखता है और उपलब्धता के निहित अर्थ को पाठक के लिए खुला छोड़ता है।
- source_word: שְׁבוּ
  choice: इसमें बसो
  rationale: दूसरा יָשַׁב स्पष्ट आज्ञार्थक है और भूमि में स्थायी निवास के संदर्भ में ‘बसो’ सहज तथा सटीक है।
- source_word: וּסְחָרוּהָ
  choice: इसमें व्यापार करो
  rationale: סחר वाणिज्य अथवा व्यापार करने को सूचित करता है; ‘व्यापार करो’ आधुनिक हिंदी में सीधा और स्पष्ट है।
- source_word: וְהֵאָחֲזוּ בָּהּ
  choice: और इसमें अपनी जायदाद बनाओ
  rationale: אָחַז का निफ़अल रूप यहाँ भूमि में संपत्ति अथवा स्थायी भू-अधिकार प्राप्त करने का भाव देता है। ‘अपनी जायदाद बनाओ’ सामान्य पाठक के लिए स्वाभाविक है और केवल भौतिक रूप से भूमि पकड़ने की गलत धारणा से बचाता है।
