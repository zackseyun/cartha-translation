  text: तुम हमारे साथ रहो, और यह भूमि तुम्हारे सामने होगी[क]। इसमें बसो, इसमें व्यापार करो और इसमें संपत्ति प्राप्त करो[ख]।
  philosophy: optimal-equivalence
  footnotes:
