base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
translation:
  language: hi
  text: तीसरे दिन, जब वे पीड़ा में थे, याकूब के दो पुत्र—शिमोन और लेवी, जो दीना के भाई थे—अपनी-अपनी तलवार लेकर उस नगर पर उस समय चढ़ आए जब वह निश्चिंत था[a], और उन्होंने हर पुरुष को मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे बेखटके नगर पर चढ़ आए।” हिब्रू शब्द בֶּטַח आक्रमणकारियों के आने के ढंग को या नगर की निश्चिंत और असावधान अवस्था को बता सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: हिब्रू कथात्मक सूत्र וַיְהִי के साथ आए समय-वाचक पद को स्वाभाविक आधुनिक हिन्दी में सीधे समय-वाचक आरंभ से व्यक्त किया गया है; घटनाक्रम का भाव बना रहता है।
- source_word: בִּהְיוֹתָם כֹּאֲבִים
  choice: जब वे पीड़ा में थे
  rationale: यह समकालीन परिस्थिति बताता है। संदर्भ खतने के बाद की पीड़ा का है, पर मूल पद कारण को स्पष्ट नहीं करता, इसलिए अनुवाद भी उसे नहीं जोड़ता।
- source_word: שְׁנֵי בְנֵי יַעֲקֹב
  choice: याकूब के दो पुत्र
  rationale: यह याकूब के पुत्रों में से दो को सूचित करता है और हिन्दी में स्वाभाविक है।
- source_word: שִׁמְעוֹן וְלֵוִי
  choice: शिमोन और लेवी
  rationale: व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप।
- source_word: אֲחֵי דִינָה
  choice: जो दीना के भाई थे
  rationale: समासिक पद को स्पष्ट, स्वाभाविक हिन्दी उपवाक्य से व्यक्त किया गया है।
- source_word: אִישׁ חַרְבּוֹ
  choice: अपनी-अपनी तलवार लेकर
  rationale: वितरणात्मक אִישׁ और एकवचन संबंधसूचक प्रत्यय का भाव है कि दोनों ने अपनी-अपनी तलवार ली।
- source_word: וַיָּבֹאוּ עַל הָעִיר
  choice: नगर पर चढ़ आए
  rationale: בוא על यहाँ शत्रुतापूर्ण ढंग से नगर के विरुद्ध आने का बोध देता है। 'चढ़ आए' आधुनिक हिन्दी में आक्रमणकारी गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֶּטַח
  choice: निश्चिंत
  rationale: संदर्भ में इसे नगर की सुरक्षित और असावधान अवस्था बताने वाला माना गया है। इसकी व्याकरणिक संबद्धता में वास्तविक अस्पष्टता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיַּהַרְגוּ כָּל זָכָר
  choice: उन्होंने हर पुरुष को मार डाला
  rationale: הרג का सीधा अर्थ मार डालना है। כָּל זָכָר शाब्दिक रूप से 'हर नर' है; मनुष्यों के लिए स्वाभाविक और गरिमापूर्ण हिन्दी में 'हर पुरुष' चुना गया है।
