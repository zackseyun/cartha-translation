  register: भाषा आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण है। ‘वैवाहिक संबंध जोड़ो’ पारस्परिक विवाह-गठबंधन का भाव देता है; दोनों समानांतर खंडों में ‘विवाह में’ जोड़कर सांस्कृतिक आशय स्पष्ट किया गया है।
