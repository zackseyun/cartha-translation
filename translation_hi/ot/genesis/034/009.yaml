  text: וְ/הִֽתְחַתְּנ֖וּ אֹתָ֑/נוּ בְּנֹֽתֵי/כֶם֙ תִּתְּנוּ לָ֔/נוּ וְ/אֶת בְּנֹתֵ֖י/נוּ תִּקְח֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/009.yaml
  text: 'Intermarry with us: give your daughters to us[b][a], and take our daughters for yourselves.'
translation:
  language: hi
  text: 'हमारे साथ विवाह-संबंध स्थापित करो: अपनी बेटियाँ हमें ब्याह दो, और हमारी बेटियों को अपने लिए ब्याह लो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְחַתְּנוּ אֹתָנוּ
  choice: हमारे साथ वैवाहिक संबंध जोड़ो
  rationale: हित्पएल रूप परस्पर विवाह-संबंध स्थापित करने का भाव देता है। यह अनुवाद उस पारस्परिकता को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּנֹתֵיכֶם
  choice: अपनी बेटियाँ
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय को संबोधित समूह के दृष्टिकोण से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: תִּתְּנוּ לָנוּ
  choice: हमें विवाह में दो
  rationale: נתן का मूल ‘देना’ भाव सुरक्षित रखते हुए प्रसंग से स्पष्ट विवाहार्थ को खुलकर व्यक्त किया गया है, ताकि आधुनिक हिन्दी में स्त्रियों के साधारण हस्तांतरण का भ्रामक अर्थ न निकले।
- source_word: וְאֶת בְּנֹתֵינוּ תִּקְחוּ לָכֶם
  choice: और हमारी बेटियाँ अपने लिए विवाह में लो
  rationale: ‘लो’ और ‘अपने लिए’ से इब्रानी की समानांतर संरचना बनी रहती है; ‘विवाह में’ प्रसंगगत अर्थ स्पष्ट करता है, बिना इसे केवल ‘हमारी बेटियों से विवाह करो’ में समतल किए।
theological_decisions: []
