  yaml_path: translation/ot/genesis/034/008.yaml
  text: And Hamor spoke with them[a], saying, “My son Shechem longs for your daughter. Please give her to him as a wife.”
translation:
  language: hi
  text: हमोर ने उनसे कहा, “मेरे बेटे शकेम का मन तुम्हारी बेटी पर बहुत आसक्त है[a]। कृपया अपनी बेटी को शकेम को उसकी पत्नी बनने के लिए दे दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका प्राण तुम्हारी बेटी से आसक्त है”; या, “वह तुम्हारी बेटी की तीव्र इच्छा करता है।”
    reason: इब्रानी पदबंध प्रबल भावनात्मक लगाव और तीव्र इच्छा—दोनों अर्थ दे सकता है।
lexical_decisions:
- source_word: וַיְדַבֵּר ... אִתָּם לֵאמֹר
  choice: उनसे बात करते हुए कहा
  rationale: यह कथन के परिचय में ‘उनके साथ/उनसे बात की’ और ‘कहा’—दोनों तत्वों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁכֶם בְּנִי
  choice: मेरे बेटे शकेम
  rationale: यह हिन्दी में स्वाभाविक शब्दक्रम रखते हुए पुत्र और उसके नाम के संबंध को स्पष्ट करता है।
- source_word: חָשְׁקָה נַפְשׁוֹ
  choice: का मन ... से लग गया है
  rationale: इब्रानी मुहावरे में प्रबल लगाव या अभिलाषा व्यक्त होती है। यह हिन्दी मुहावरा भावनात्मक लगाव को सहज रूप में रखता है, बिना उसे केवल शारीरिक इच्छा तक सीमित किए।
- source_word: בְּבִתְּכֶם
  choice: तुम्हारी बेटी से
  rationale: संबोधन का प्रत्यय बहुवचन है, पर ‘बेटी’ एकवचन है और दीना की ओर संकेत करता है; हिन्दी में परिवार को संबोधित करते हुए ‘तुम्हारी बेटी’ स्वाभाविक है।
- source_word: תְּנוּ נָא
  choice: कृपया ... दे दो
  rationale: बहुवचन आज्ञार्थक के साथ נָא के विनम्र अनुरोध को स्पष्ट और वर्तमान हिन्दी में व्यक्त करता है।
- source_word: לְאִשָּׁה
  choice: उसकी पत्नी बनने के लिए
  rationale: यह स्त्री को विवाह में देने के आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।
