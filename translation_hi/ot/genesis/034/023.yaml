  text: מִקְנֵ/הֶ֤ם וְ/קִנְיָנָ/ם֙ וְ/כָל בְּהֶמְתָּ֔/ם הֲ/ל֥וֹא לָ֖/נוּ הֵ֑ם אַ֚ךְ נֵא֣וֹתָה לָ/הֶ֔ם וְ/יֵשְׁב֖וּ אִתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/023.yaml
  text: Will not their livestock[a], their property, and all their animals be ours? Only let us agree with them[b], and they will dwell with us.
translation:
  language: hi
  text: क्या उनके पशुधन, उनकी संपत्ति और उनके सभी पशु हमारे नहीं हो जाएँगे? बस, हम उनसे सहमत हो जाएँ[a], तब वे हमारे साथ रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम उनकी बात मान लें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵהֶם
  choice: उनके पशुधन
  rationale: מִקְנֶה यहाँ आर्थिक संपत्ति के रूप में रखे गए पशुओं को दर्शाता है; ‘पशुधन’ व्यापक, स्वाभाविक और प्रसंगानुकूल है।
- source_word: קִנְיָנָם
  choice: उनकी संपत्ति
  rationale: קִנְיָן अर्जित वस्तुओं या मिल्कियत को दर्शाता है; ‘संपत्ति’ इसके भौतिक-आर्थिक अर्थ को बिना अनावश्यक संकीर्णता के रखता है।
- source_word: כָל בְּהֶמְתָּם
  choice: उनके सभी पालतू पशु
  rationale: בְּהֵמָה सामान्यतः बड़े या घरेलू पशुओं का व्यापक शब्द है। ‘पालतू पशु’ पहले आए ‘पशुधन’ से अंतर रखते हुए अर्थ स्पष्ट करता है।
- source_word: הֲלוֹא לָנוּ הֵם
  choice: क्या ... हमारे न हो जाएँगे?
  rationale: הֲלוֹא सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है। प्रसंग में लोग भविष्य में लाभ पाने की बात कर रहे हैं, इसलिए ‘न हो जाएँगे’ उसका प्रेरक भाव व्यक्त करता है।
- source_word: אַךְ
  choice: बस
  rationale: אַךְ यहाँ सीमित शर्त या एकमात्र अपेक्षित कदम प्रस्तुत करता है; आधुनिक हिन्दी में ‘बस’ स्वाभाविक और प्रभावी है।
- source_word: נֵאֹותָה לָהֶם
  choice: हम उनकी बात मान लें
  rationale: निफ़ाल रूप נֵאֹותָה सहमत होने, राज़ी होने या स्वीकार करने का भाव देता है। ‘उनकी बात मान लें’ इस बातचीत के प्रसंग में सहज हिन्दी है।
- source_word: וְיֵשְׁבוּ אִתָּנוּ
  choice: तब वे हमारे साथ रहेंगे
  rationale: יָשַׁב बसने या रहने को दर्शाता है। ‘हमारे साथ रहेंगे’ मूल के सामाजिक-सहवास के भाव को स्वाभाविक हिन्दी में रखता है।
