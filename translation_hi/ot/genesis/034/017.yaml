source:
  edition: WLC
  text: וְ/אִם לֹ֧א תִשְׁמְע֛וּ אֵלֵ֖י/נוּ לְ/הִמּ֑וֹל וְ/לָקַ֥חְנוּ אֶת בִּתֵּ֖/נוּ וְ/הָלָֽכְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/017.yaml
  text: But if you will not listen to us[a], to be circumcised[b], then we will take our daughter and go.
translation:
  language: hi
  text: लेकिन यदि तुम खतना कराने की हमारी बात नहीं मानोगे[a], तो हम अपनी बेटी को लेकर चले जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “यदि तुम हमारी बात नहीं सुनोगे—खतना कराने के लिए।” इब्रानी में “खतना कराना” उस बात की विषयवस्तु या अपेक्षित प्रतिक्रिया बता सकता है जिसे सुनने/मानने को कहा गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: लेकिन यदि
  rationale: संयोजक पिछले प्रस्ताव के विपरीत स्थिति प्रस्तुत करता है; ‘लेकिन यदि’ इस संबंध और शर्त दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִשְׁמְעוּ אֵלֵינוּ
  choice: हमारी बात नहीं मानोगे
  rationale: שׁמע के साथ אֶל का अर्थ यहाँ किसी की बात सुनना या मानना है। प्रसंग में केवल ध्वनि सुनना नहीं, बल्कि प्रस्ताव स्वीकार करना अभिप्रेत है; ‘बात मानना’ इस अर्थ को सहज हिन्दी में व्यक्त करता है, बिना इसे पूर्ण ‘आज्ञापालन’ जितना प्रबल बनाए।
- source_word: לְ/הִמּוֹל
  choice: खतना कराने की
  rationale: यह infinitive construct उस बात की विषयवस्तु बताता है जिसे मानने के लिए कहा गया है। ‘खतना कराने की हमारी बात’ स्रोत के आशय को स्पष्ट और स्वाभाविक रूप से रखता है तथा क्रिया के निष्क्रिय/मध्य भाव को बनाए रखता है।
- source_word: וְ/לָקַחְנוּ אֶת בִּתֵּנוּ
  choice: तो हम अपनी बेटी को लेकर
  rationale: शर्त के परिणाम को हिन्दी में ‘तो’ से स्पष्ट किया गया है। בִּתֵּנוּ का सीधा अर्थ ‘हमारी बेटी’ है; कर्ता के साथ स्वामित्व के लिए हिन्दी में ‘अपनी बेटी’ अधिक स्वाभाविक है।
- source_word: וְ/הָלָכְנוּ
  choice: चले जाएँगे
  rationale: इस प्रसंग में הלך का अर्थ वहाँ से चले जाना है। ‘चले जाएँगे’ भविष्यगत परिणाम और प्रस्थान दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
