base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/019.yaml
  text: And the young man did not delay to do the thing[a], because he delighted in Jacob’s daughter[d][c][b], and he was honored above all his father’s house.
translation:
  language: hi
  text: और उस जवान ने वह काम करने में देर नहीं की[a], क्योंकि वह याकूब की बेटी को चाहता था[b]; और वह अपने पिता के सारे घराने में सबसे अधिक सम्मानित था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस काम को करने में हिचकिचाया नहीं।”
    reason: lexical_alternative
  - marker: b
    text: या, “याकूब की बेटी से प्रसन्न था”; अथवा, “याकूब की बेटी में उसका मन लगा था।”
    reason: lexical_alternative
  - marker: c
    text: या, “वह अपने पिता के घराने के सभी लोगों से अधिक सम्मानित था।”
    reason: grammatical_alternative
lexical_decisions:
- source_word: אֵחַר
  choice: देर नहीं की
  rationale: यह क्रिया समय लगाने या विलंब करने का भाव देती है; प्रसंग में उसकी तत्परता मुख्य है, न कि केवल मानसिक हिचकिचाहट।
- source_word: הַנַּעַר
  choice: उस जवान ने
  rationale: यह शकेम के लिए प्रयुक्त है। हिंदी कथा-शैली में 'जवान' स्वाभाविक है और संदर्भ में निश्चित व्यक्ति होने के कारण 'उस' उपयुक्त है।
- source_word: לַעֲשׂוֹת הַדָּבָר
  choice: वह काम करने में
  rationale: '''वह काम'' पिछली आयतों में रखी गई शर्त के पालन की ओर संकेत करता है और हिब्रू अभिव्यक्ति को सुबोध हिंदी में रखता है।'
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उसकी तत्परता का कारण प्रस्तुत करता है।
- source_word: חָפֵץ בְּבַת יַעֲקֹב
  choice: याकूब की बेटी से प्रसन्न था
  rationale: חָפֵץ प्रबल रुचि, प्रसन्नता या चाह को व्यक्त कर सकता है। 'प्रसन्न था' मूल की भावात्मक व्यापकता बनाए रखता है और इसे केवल यौन इच्छा तक सीमित नहीं करता।
- source_word: נִכְבָּד מִכֹּל בֵּית אָבִיו
  choice: अपने पिता के सारे घराने में सबसे अधिक सम्मानित था
  rationale: निफ़अल कृदंत सम्मानित या प्रतिष्ठित होने का भाव देता है; מִכֹּל के साथ तुलना हिंदी में स्वाभाविक रूप से उत्कृष्टतम रूप में व्यक्त होती है। 'घराना' परिवार और गृहस्थ समूह दोनों को समेटता है।
