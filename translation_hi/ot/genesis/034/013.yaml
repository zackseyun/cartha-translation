  yaml_path: translation/ot/genesis/034/013.yaml
  text: Jacob’s sons answered Shechem and Hamor his father deceitfully and spoke[b][a], because he had defiled Dinah their sister.
translation:
  language: hi
  text: याकूब के पुत्रों ने शकेम और उसके पिता हमोर को छल से उत्तर दिया और बोले, क्योंकि उसने उनकी बहन दीना को अशुद्ध किया था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, “उनकी बहन दीना को यौन रूप से अपमानित किया था।” इब्रानी का शाब्दिक अर्थ “अशुद्ध किया था” है, जो नैतिक और अनुष्ठानिक भाषा को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: उत्तर दिया
  rationale: यह क्रिया पहले रखे गए प्रस्ताव के प्रत्युत्तर को बताती है; आधुनिक मानक हिन्दी में ‘उत्तर दिया’ स्वाभाविक और गरिमापूर्ण है।
- source_word: בְנֵי יַעֲקֹב
  choice: याकूब के पुत्रों
  rationale: सम्बन्धवाचक रचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אֶת שְׁכֶם וְאֶת חֲמוֹר אָבִיו
  choice: शकेम और उसके पिता हमोर को
  rationale: दोनों प्रत्यक्ष कर्मों को स्पष्ट रखता है और ‘उसके पिता’ का सम्बन्ध शकेम से स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּמִרְמָה
  choice: छल से
  rationale: संज्ञात्मक इब्रानी पदबंध ‘छल में/से’ की क्रियाविशेषणीय भूमिका को सहज हिन्दी में व्यक्त करता है; ‘कपटपूर्वक’ की अपेक्षा अधिक सामान्य है।
- source_word: וַיְדַבֵּרוּ
  choice: और उनसे बात की
  rationale: דבר की ‘बोलना/बात करना’ वाली व्यापक अर्थ-सीमा को रखता है और पहले आए ‘उत्तर दिया’ से क्रियात्मक भेद बनाए रखता है। हिन्दी में स्पष्टता के लिए निहित श्रोताओं को ‘उनसे’ कहा गया है।
- source_word: אֲשֶׁר
  choice: क्योंकि
  rationale: यहाँ पद पूर्ववर्ती छलपूर्ण उत्तर का कारण प्रस्तुत करता है; इसलिए कारणवाचक ‘क्योंकि’ प्रसंगानुकूल है।
- source_word: טִמֵּא
  choice: अशुद्ध किया था
  rationale: पिएल रूप के ‘अशुद्ध करना/भ्रष्ट करना’ वाले नैतिक और अनुष्ठानिक शब्द-क्षेत्र को सुरक्षित रखता है; पूर्वघटित कार्य के लिए ‘था’ प्रयुक्त है।
- source_word: אֲחֹתָם
  choice: उनकी बहन
  rationale: भाइयों के साथ पारिवारिक सम्बन्ध को सीधे और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: טִמֵּא में नैतिक-अनुष्ठानिक भाषा और यौन उल्लंघन का तनाव
  choice: अशुद्ध किया था
  alternative: उसका उल्लंघन किया था
  rationale: मुख्य पाठ इब्रानी क्रिया के ‘अशुद्ध करना’ वाले शब्द-क्षेत्र को सुरक्षित रखता है, जबकि पादटिप्पणी प्रसंग में निहित अधिक स्पष्ट वैकल्पिक अर्थ देती है; इस प्रकार पाठ अपराध को नरम किए बिना मूल की रूपकात्मक भाषा बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथा-शैली। ‘पुत्रों’ और ‘अशुद्ध’ से बाइबिलीय औपचारिकता बनी रहती है, जबकि ‘छल से’ और ‘बात की’ सामान्य पाठक के लिए स्वाभाविक हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्बद्ध पदों के बाद दिए गए हैं।
