lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: पर उन्होंने कहा
  rationale: वाव-युक्त कथात्मक क्रिया भाइयों के उत्तर को प्रस्तुत करती है। पिछले पद में याकूब की फटकार के प्रतिवाद को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘पर’ चुना गया है।
- source_word: הַכְזוֹנָה
  choice: वेश्या जैसा
  rationale: प्रश्नवाचक ה और तुलनात्मक כ के साथ זֹנָה का अर्थ ‘वेश्या के समान/जैसा’ है। ‘वेश्या जैसा’ आधुनिक हिन्दी में स्पष्ट है और तुलना को बनाए रखता है।
- source_word: יַעֲשֶׂה
  choice: व्यवहार करे
  rationale: עשה का मूल अर्थ व्यापक रूप से ‘करना/बनाना’ है; यहाँ व्यक्ति को कर्म बनाकर प्रयुक्त होने और अपमान के प्रसंग के कारण ‘व्यवहार करे’ सम्भावित भाव को स्वाभाविक ढंग से व्यक्त करता है। प्रश्नवाचक रचना को आलंकारिक प्रश्न के रूप में रखा गया है।
- source_word: אֲחוֹתֵנוּ
  choice: हमारी बहन
  rationale: यह संबंधवाचक रूप का सीधा अनुवाद है और भाइयों के पारिवारिक सम्मान से जुड़े प्रतिवाद को सुरक्षित रखता है।
