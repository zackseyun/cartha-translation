  text: הַרְבּ֨וּ עָלַ֤/י מְאֹד֙ מֹ֣הַר וּ/מַתָּ֔ן וְ/אֶ֨תְּנָ֔ה כַּ/אֲשֶׁ֥ר תֹּאמְר֖וּ אֵלָ֑/י וּ/תְנוּ לִ֥/י אֶת הַֽ/נַּעֲרָ֖ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/012.yaml
  text: Demand from me a very large bride-price and gift[a], and I will give whatever you say to me; only give me the young woman as a wife.
translation:
  language: hi
  text: “तुम मुझसे दुल्हन-मूल्य[a] और भेंट बहुत अधिक माँगो; तुम मुझसे जो कहोगे, मैं दूँगा। बस उस युवती को मेरी पत्नी के रूप में मुझे दे दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘विवाह-भुगतान’। इब्रानी मॊहर उस भुगतान को दर्शाता है जो वर या उसका परिवार वधू के परिवार को देता था; यह वधू-पक्ष से दिए जाने वाले ‘दहेज’ से भिन्न है।
    reason: मֹהַר के सांस्कृतिक और शब्दार्थगत अर्थ को स्पष्ट करना तथा ‘दहेज’ के संभावित भ्रामक अर्थ से बचना।
lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  choice: मुझसे ... चाहे जितनी अधिक माँगो
  rationale: बहुवचन आज्ञार्थक और तीव्रतासूचक מְאֹד मिलकर बड़ी राशि निर्धारित करने की छूट देते हैं। यह हिंदी में लेन-देन संबंधी आग्रह को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֹהַר
  choice: दुल्हन-मूल्य
  rationale: यह वर या उसके परिवार द्वारा वधू के परिवार को दिया जाने वाला विवाह-संबंधी भुगतान है; ‘दहेज’ आधुनिक हिंदी में प्रायः वधू-पक्ष से दिए जाने वाले धन-सामान का अर्थ देता है और यहाँ भ्रामक होगा।
- source_word: וּמַתָּן
  choice: और भेंट
  rationale: यह विवाह-भुगतान के साथ दी जाने वाली अतिरिक्त भेंट को सूचित करता है; एकवचन रूप को बनाए रखा गया है।
- source_word: וְאֶתְּנָה
  choice: मैं दूँगा
  rationale: सहॉर्टेटिव रूप वक्ता की दृढ़ इच्छा और तत्परता व्यक्त करता है, जिसे आधुनिक हिंदी में भविष्यकाल स्वाभाविक रूप से पहुँचाता है।
- source_word: כַּאֲשֶׁר תֹּאמְרוּ אֵלָי
  choice: तुम मुझसे जो कहोगे
  rationale: यह उनके द्वारा बताई जाने वाली राशि या शर्त के प्रति खुली सहमति व्यक्त करता है और मूल की व्यापकता बनाए रखता है।
- source_word: וּתְנוּ לִי
  choice: बस ... मुझे दे दो
  rationale: संयोजक के बाद आया मुख्य अनुरोध उत्कर्ष पर है; ‘बस’ संदर्भगत आग्रह को स्वाभाविक हिंदी में व्यक्त करता है, बिना कोई नई शर्त जोड़े।
- source_word: הַנַּעֲרָ
  choice: उस युवती
  rationale: संज्ञा विवाह योग्य युवा स्त्री को दर्शाती है; ‘युवती’ आधुनिक, सम्मानजनक और आयु की दृष्टि से ‘लड़की’ से कम अस्पष्ट है।
- source_word: לְאִשָּׁה
  choice: पत्नी के रूप में
  rationale: मानक इब्रानी वैवाहिक अभिव्यक्ति का सीधा और स्वाभाविक हिंदी रूप।
