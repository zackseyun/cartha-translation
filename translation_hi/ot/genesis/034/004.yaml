  text: तब शकेम ने अपने पिता हमोर से कहा, “इस लड़की को मेरे लिए पत्नी बना दीजिए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח לִי
  choice: मेरा विवाह करा दीजिए
  rationale: शाब्दिक अर्थ ‘मेरे लिए ले लीजिए’ है; विवाह-संबंधी संदर्भ में पिता से लड़की को पत्नी के रूप में प्राप्त करने की व्यवस्था करने का अनुरोध है। आधुनिक हिन्दी में चुना गया वाक्यांश यही आशय स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: הַיַּלְדָּה הַזֹּאת
  choice: इस लड़की
  rationale: יַּלְדָּה का सामान्य अर्थ ‘लड़की/युवती’ है; ‘इस लड़की’ मूल के संकेतवाचक रूप को सीधे बनाए रखता है।
- source_word: לְאִשָּׁה
  choice: विवाह
  rationale: इसका शाब्दिक भाव ‘पत्नी के रूप में’ है। ‘विवाह करा दीजिए’ में वैवाहिक उद्देश्य स्वाभाविक हिन्दी में समाहित है।
