source:
  edition: WLC
  text: וַ/תִּדְבַּ֣ק נַפְשׁ֔/וֹ בְּ/דִינָ֖ה בַּֽת יַעֲקֹ֑ב וַ/יֶּֽאֱהַב֙ אֶת הַֽ/נַּעֲרָ֔ וַ/יְדַבֵּ֖ר עַל לֵ֥ב הַֽ/נַּעֲרָֽ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/003.yaml
  text: His soul clung to Dinah[a], the daughter of Jacob[b], and he loved the young woman and spoke to the heart of the young woman.
translation:
  language: hi
  text: उसका मन याकूब की बेटी दीना से गहराई से जुड़ गया[a]। उसने उस युवती से प्रेम किया और उससे कोमलता से बातें कीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका प्राण दीना से चिपक गया।” इसका अर्थ यह भी हो सकता है कि उसका अंतरमन दीना से गहराई से जुड़ गया।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसने उस युवती के हृदय से बातें कीं।” यह हिब्रू मुहावरा कोमलता, दयालुता, अनुनय या आश्वासन के साथ बात करने का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק נַפְשׁוֹ בְּדִינָה
  choice: उसका मन ... दीना से लग गया
  rationale: शाब्दिक रूप से ‘उसका प्राण दीना से चिपक गया।’ आधुनिक हिन्दी में ‘मन लग गया’ निकट भावनात्मक जुड़ाव को स्वाभाविक ढंग से व्यक्त करता है; पादटिप्पणी मूल रूपक को सुरक्षित रखती है।
- source_word: בַּת יַעֲקֹב
  choice: याकूब की बेटी
  rationale: हिब्रू संबंधवाचक पदबंध का सहज और स्पष्ट हिन्दी रूप।
- source_word: וַיֶּאֱהַב
  choice: प्रेम करने लगा
  rationale: אהב का सामान्य अर्थ ‘प्रेम करना’ है। कथानक की क्रमिक क्रियाओं के संदर्भ में ‘करने लगा’ स्वाभाविक हिन्दी है और इसे केवल कामना तक सीमित नहीं करता।
- source_word: הַנַּעֲרָ
  choice: युवती
  rationale: נַעֲרָה के लिए आधुनिक, गरिमापूर्ण और आयु-संकेतक सामान्य हिन्दी शब्द।
- source_word: וַיְדַבֵּר עַל לֵב
  choice: मन को ढाढ़स देने वाली बातें कहीं
  rationale: शाब्दिक मुहावरा ‘हृदय पर/से बोलना’ है, जिसका आशय स्नेह, सांत्वना या आश्वासन से बात करना हो सकता है। यह रूप प्रसंग में आश्वस्त करने के भाव को व्यक्त करता है, जबकि पादटिप्पणी वास्तविक मुहावरे और उसकी अर्थ-सीमा बताती है।
theological_decisions:
- issue: पिछले अत्याचार के बाद शकेम की भावनाओं का वर्णन
  choice: पद में बताए गए उसके लगाव, प्रेम और आश्वासनपूर्ण कथन को उसी रूप में रहने देना
  alternative: अनुवाद में ही निंदात्मक भाषा जोड़ना या प्रसंग को अधिक प्रेमपूर्ण बनाना
  rationale: हिब्रू इस पद में शकेम की भावनाओं और वाणी का वर्णन करता है। अनुवाद न तो पिछले कृत्य को उचित ठहराता है, न इस पद में अनुपस्थित नैतिक टिप्पणी जोड़ता है।
- issue: דבר על־לב मुहावरे की भाव-छाया
  choice: ढाढ़स देने वाली बातें कहीं
  alternative: उस युवती के हृदय से बातें कीं; उससे कोमलता से बातें कीं
  rationale: मुहावरा सांत्वना, दयालुता, कोमलता या आश्वासन का भाव रख सकता है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है और पादटिप्पणी में अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘मन लग गया’ बोलचाल में समझ आने वाला किंतु गरिमापूर्ण प्रयोग है; ‘ढाढ़स देने वाली बातें’ मुहावरे का स्वाभाविक अर्थ देता है। पुनरुक्त ‘उस युवती’ को मूल पाठ के अनुरूप रखा गया है।
