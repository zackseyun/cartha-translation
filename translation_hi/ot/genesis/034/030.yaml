  text: וַ/יֹּ֨אמֶר יַעֲקֹ֜ב אֶל שִׁמְע֣וֹן וְ/אֶל לֵוִי֮ עֲכַרְתֶּ֣ם אֹתִ/י֒ לְ/הַבְאִישֵׁ֨/נִי֙ בְּ/יֹשֵׁ֣ב הָ/אָ֔רֶץ בַּֽ/כְּנַעֲנִ֖י וּ/בַ/פְּרִזִּ֑י וַ/אֲנִי֙ מְתֵ֣י מִסְפָּ֔ר וְ/נֶאֶסְפ֤וּ עָלַ/י֙ וְ/הִכּ֔וּ/נִי וְ/נִשְׁמַדְתִּ֖י אֲנִ֥י וּ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/030.yaml
  text: Then Jacob said to Simeon and Levi[a], “You have brought trouble on me, making me stink among the inhabitants of the land, among the Canaanites and the Perizzites. Since I am few in number, they will gather against me and strike me down[b], and I will be destroyed—I and my household.”
translation:
  language: hi
  text: तब याकूब ने शिमोन और लेवी से कहा, “तुमने मुझ पर विपत्ति ला दी है और देश के निवासियों—कनानियों और परिज्जियों—के बीच मुझे घृणित बना दिया है[a]। मेरे साथ लोग बहुत कम हैं; वे मेरे विरुद्ध इकट्ठे होंगे और मुझ पर प्रहार करेंगे, तब मैं और मेरा घराना नष्ट हो जाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मुझे दुर्गन्धित कर दिया है,” अर्थात लोगों की नज़रों में मुझे अप्रिय या घृणित बना दिया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתֶּם אֹתִי
  choice: तुमने मुझ पर विपत्ति ला दी है
  rationale: עכר किसी पर संकट या विपत्ति लाने का बोध देता है। यह चयन याकूब के आरोप की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְהַבְאִישֵׁנִי
  choice: मुझे घिनौना बना दिया है
  rationale: हिफ़ील रूप का शाब्दिक अर्थ ‘मुझे दुर्गन्धित करना’ है, पर यहाँ सामाजिक रूप से घृणित या अप्रिय बना देने का रूपक है। ‘घिनौना बना दिया’ उस तीखे रूपक का प्रभाव स्वाभाविक हिन्दी में रखता है।
- source_word: בְּיֹשֵׁב הָאָרֶץ
  choice: इस देश के निवासियों के बीच
  rationale: एकवचन कृदन्त यहाँ सामूहिक रूप से देश में रहने वाली जनसंख्या को सूचित करता है।
- source_word: בַּכְּנַעֲנִי וּבַפְּרִזִּי
  choice: कनानियों और परिज्जियों के बीच
  rationale: पूर्वसर्ग उस सामाजिक क्षेत्र को आगे बढ़ाता है जिसमें याकूब की प्रतिष्ठा बिगड़ी है। हिन्दी में जातिनामों के बहुवचन रूप प्रसंगानुकूल हैं।
- source_word: מְתֵי מִסְפָּר
  choice: मैं गिनती में थोड़े ही लोगों के साथ हूँ
  rationale: इब्रानी मुहावरा संख्या में छोटा होने को दर्शाता है। वाक्य का कर्ता एकवचन ‘मैं’ है, पर आशय याकूब के साथ मौजूद जनसमूह की अल्प संख्या से है; इस हिन्दी रूप से दोनों बातें स्पष्ट रहती हैं।
- source_word: וְנֶאֶסְפוּ עָלַי
  choice: यदि वे मेरे विरुद्ध इकट्ठे होकर
  rationale: निफ़अल रूप विरोधी समूहों के एक साथ आ जुटने का संकेत देता है। यहाँ क्रियाओं का क्रम आशंकित परिणाम बताता है, इसलिए हिन्दी में स्वाभाविक शर्तीय रचना अपनाई गई है।
- source_word: וְהִכּוּנִי
  choice: मुझ पर प्रहार करें
  rationale: נכה का अर्थ मारना, प्रहार करना या परास्त करना हो सकता है। ‘प्रहार करें’ हिंसक आक्रमण को व्यक्त करता है, जबकि अगले विनाश-सूचक क्रियापद से अनावश्यक पुनरुक्ति नहीं करता।
- source_word: וְנִשְׁמַדְתִּי
  choice: नाश हो जाएगा
  rationale: שמד पूर्ण विनाश का बोध देता है। ‘नाश हो जाएगा’ गरिमापूर्ण, स्पष्ट और पर्याप्त रूप से प्रबल है।
- source_word: בֵּיתִי
  choice: मेरे घराने
  rationale: यहाँ בית भवन नहीं, बल्कि याकूब के विस्तृत पारिवारिक और घरेलू समुदाय को दर्शाता है; ‘घराना’ इस सामाजिक दायरे को सहज हिन्दी में व्यक्त करता है।
