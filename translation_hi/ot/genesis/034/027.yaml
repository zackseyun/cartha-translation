source:
  edition: WLC
  text: בְּנֵ֣י יַעֲקֹ֗ב בָּ֚אוּ עַל הַ֣/חֲלָלִ֔ים וַ/יָּבֹ֖זּוּ הָ/עִ֑יר אֲשֶׁ֥ר טִמְּא֖וּ אֲחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/027.yaml
  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
translation:
  language: hi
  text: याकूब के बेटे मारे गए लोगों के पास आए[a] और उस नगर को लूट लिया, क्योंकि उनकी बहन को अपवित्र किया गया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मारे गए लोगों पर चढ़ आए।” इब्रानी पदबंध का अर्थ उनके पास पहुँचने या उनके विरुद्ध आने—दोनों में से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में उपवाक्य शाब्दिक रूप से बहुत संक्षिप्त है: “वह नगर जिसे उन्होंने उनकी बहन को अपवित्र किया।” संबंध और कर्ता प्रसंग से समझे जाते हैं। कर्मवाच्य अनुवाद इस भ्रम से बचाता है कि याकूब के बेटों ने अपनी बहन को अपवित्र किया था।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יַעֲקֹב
  choice: याकूब के बेटे
  rationale: इब्रानी संबंधवाचक पदबंध का स्वाभाविक और स्पष्ट हिन्दी रूप; इससे समूह के पारिवारिक संबंध पर बल बना रहता है।
- source_word: בָּאוּ עַל
  choice: के पास आए
  rationale: בוא עם על यहाँ मारे जा चुके लोगों की ओर या उनके पास पहुँचने का भाव देता है। यह अनुवाद अनावश्यक रूप से नया सैन्य आक्रमण नहीं दर्शाता; वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: הַחֲלָלִים
  choice: मारे गए लोग
  rationale: חֲלָלִים हिंसा में मारे गए व्यक्तियों को सूचित करता है; ‘मृतक’ की अपेक्षा यह हिंसक मृत्यु को अधिक स्पष्ट करता है।
- source_word: וַיָּבֹזּוּ
  choice: लूट लिया
  rationale: בזז युद्ध या हिंसा के बाद माल छीन लेने को दर्शाता है। ‘लूट लिया’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: הָעִיר
  choice: उस नगर
  rationale: עִיר के लिए ‘नगर’ मानक है; ‘उस’ पूर्ववर्ती कथा में उल्लिखित नगर से संबंध स्पष्ट करता है।
- source_word: אֲשֶׁר
  choice: क्योंकि वहीं
  rationale: इब्रानी संबंधवाचक उपवाक्य संक्षिप्त है और प्रसंग में नगर की लूट का कारण भी बताता है। ‘वहीं’ उसे नगर से जोड़ता है, जबकि ‘क्योंकि’ निहित कारण-संबंध व्यक्त करता है।
- source_word: טִמְּאוּ
  choice: अपवित्र किया गया था
  rationale: पिएल रूप नैतिक-सामाजिक अशुद्धि या अपमान का अर्थ रखता है। कर्मवाच्य हिन्दी उस गंभीर अर्थ को बनाए रखती है और कर्ता-सर्वनाम को याकूब के बेटों से गलत ढंग से जोड़ने से बचाती है।
- source_word: אֲחוֹתָם
  choice: उनकी बहन
  rationale: मूल के पारिवारिक संबंध को सीधे और स्वाभाविक रूप में रखता है।
theological_decisions:
- issue: अपवित्र करने वाले कर्ता की पहचान
  choice: ‘उनकी बहन को अपवित्र किया गया था’—कर्मवाच्य प्रयोग
  alternative: ‘उन्होंने उनकी बहन को अपवित्र किया था’
  rationale: इब्रानी में बहुवचन कर्ता निहित है, पर हिन्दी में ‘उन्होंने’ का निकटतम संदर्भ याकूब के बेटे समझा जा सकता है, जो कथानक के विपरीत होगा। कर्मवाच्य अपराध को स्पष्ट रखता है, पर अपराधियों की पहचान को मूल से अधिक विस्तार देकर निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपवित्र’ यौन उल्लंघन के साथ जुड़े नैतिक और सामाजिक कलंक की व्यापकता को बनाए रखता है; पद स्वयं घटना का अधिक स्पष्ट वर्णन नहीं करता।
