    text: 'या, “ऐसे पुरुष को जिसका खतना नहीं हुआ है।” शाब्दिक अर्थ: “ऐसे पुरुष को जिसके पास अग्रचर्म है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵיהֶם
  choice: उन्होंने उनसे कहा
  rationale: बहुवचन कर्ता और बहुवचन अप्रत्यक्ष कर्म को स्वाभाविक हिन्दी में सुरक्षित रखता है; אמר के लिए ‘कहा’ सामान्य कथात्मक चयन है।
- source_word: לֹא נוּכַל לַעֲשׂוֹת הַדָּבָר הַזֶּה
  choice: हम ऐसा काम नहीं कर सकते
  rationale: יכולת का भाव ‘नहीं कर सकते’ से स्पष्ट होता है और הדבר הזה का संज्ञात्मक भाव ‘ऐसा काम’ में बना रहता है।
- source_word: לָתֵת אֶת אֲחֹתֵנוּ
  choice: अपनी बहन को दें
  rationale: मूल में केवल ‘देना’ है; विवाह का संदर्भ आसपास के वृत्तांत से स्पष्ट है, इसलिए ‘विवाह में देना’ नहीं जोड़ा गया।
- source_word: לְאִישׁ
  choice: पुरुष को
  rationale: איש का सीधा अर्थ ‘पुरुष’ है; ‘पति’ कहना विवाह-संदर्भ को मूल शब्द से अधिक स्पष्ट कर देता।
- source_word: אֲשֶׁר לוֹ עָרְלָה
  choice: जिसकी खलड़ी है
  rationale: हिब्रू की मूर्त और शाब्दिक अभिव्यक्ति ‘जिसके खलड़ी है’ को स्वाभाविक हिन्दी व्याकरण में रखा गया है; अधिक प्रचलित अर्थ ‘खतनारहित’ पादटिप्पणी में दिया गया है।
- source_word: כִּי חֶרְפָּה הִוא לָנוּ
  choice: क्योंकि यह हमारे लिए अपमान की बात है
  rationale: חרפה के सामाजिक लज्जा और तिरस्कार के भाव को आधुनिक, स्पष्ट हिन्दी में व्यक्त करता है।
