  yaml_path: translation/ot/genesis/034/014.yaml
  text: And they said to them[a], “We cannot do this thing, to give our sister to a man who has a foreskin, for that is a disgrace to us.”
translation:
  language: hi
  text: उन्होंने उनसे कहा, “हम ऐसा काम नहीं कर सकते कि अपनी बहन ऐसे पुरुष को दें जिसके पास अग्रचर्म है,[a] क्योंकि यह हमारे लिए अपमान की बात है।”
  philosophy: optimal-equivalence
  footnotes:
