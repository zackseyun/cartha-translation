  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण गद्य रखा गया है। नगर के फाटक से बाहर जानेवालों वाला इब्रानी मुहावरा और उसकी पुनरावृत्ति मूल पाठ के अनुरूप बनाए रखी गई है; डैश दूसरे खंड को ‘हर पुरुष’ की व्याख्या के रूप में स्पष्ट करता है।
