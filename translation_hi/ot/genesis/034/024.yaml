  text: וַ/יִּשְׁמְע֤וּ אֶל חֲמוֹר֙ וְ/אֶל שְׁכֶ֣ם בְּנ֔/וֹ כָּל יֹצְאֵ֖י שַׁ֣עַר עִיר֑/וֹ וַ/יִּמֹּ֨לוּ֙ כָּל זָכָ֔ר כָּל יֹצְאֵ֖י שַׁ֥עַר עִירֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/024.yaml
  text: And all who went out of the gate of his city listened to Hamor and to Shechem his son[a], and every male, all who went out of the gate of his city[c][b], was circumcised.
translation:
  language: hi
  text: तब उसके नगर के फाटक से बाहर जानेवाले सभी लोगों ने हमोर और उसके पुत्र शकेम की बात मान ली[a], और उसके नगर के फाटक से बाहर जानेवाले हर पुरुष का खतना किया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमोर और उसके पुत्र शकेम की बात पर ध्यान दिया।” इब्रानी अभिव्यक्ति में सुनने के साथ किसी बात को स्वीकार करने और उसके अनुकूल उत्तर देने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֶל
  choice: की बात मान ली
  rationale: इस रचना का अर्थ केवल सुनना नहीं, बल्कि प्रस्ताव को स्वीकार कर उसके अनुसार कार्य करना भी है। संदर्भ में नगरवासी सहमति देकर खतना करवाते हैं; फिर भी ‘आज्ञा मानी’ की अपेक्षा यह कम कठोर और स्वाभाविक है।
- source_word: כָּל יֹצְאֵי שַׁעַר עִירוֹ
  choice: उसके नगर के फाटक से बाहर जानेवाले सभी लोग
  rationale: इब्रानी मुहावरे और पद में उसकी पुनरावृत्ति को सुरक्षित रखा गया है। यह नगर के सार्वजनिक जीवन में भाग लेनेवाले पुरुष नगरवासियों की ओर संकेत करता है।
- source_word: בְּנוֹ
  choice: उसके पुत्र
  rationale: शकेम का हमोर से पुत्र-संबंध स्पष्ट और स्वाभाविक हिन्दी क्रम में व्यक्त किया गया है।
- source_word: וַיִּמֹּלוּ
  choice: खतना किया गया
  rationale: निफ़अल रूप निष्क्रिय अथवा आत्मवाचक अर्थ दे सकता है। हिन्दी में ‘खतना किया गया’ निष्क्रिय भाव को स्वाभाविक रूप से व्यक्त करता है और यह अनावश्यक रूप से नहीं बताता कि उन्होंने स्वयं अपना खतना किया।
- source_word: כָּל זָכָר
  choice: हर पुरुष
  rationale: शाब्दिक अर्थ ‘हर नर’ है, पर मनुष्यों के इस संदर्भ में ‘हर पुरुष’ आधुनिक हिन्दी में अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: שַׁעַר עִירוֹ
  choice: उसके नगर का फाटक
  rationale: नगर-फाटक के ठोस सांस्कृतिक बिंब को ‘नागरिक’ या ‘अगुवे’ जैसे व्याख्यात्मक शब्द से बदलने के बजाय सुरक्षित रखा गया है।
