  text: וַ/יֵּצֵ֛א חֲמ֥וֹר אֲבִֽי שְׁכֶ֖ם אֶֽל יַעֲקֹ֑ב לְ/דַבֵּ֖ר אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/006.yaml
  text: Then Hamor, the father of Shechem, went out to Jacob to speak with him.
translation:
  language: hi
  text: तब शकेम का पिता हमोर याकूब से बात करने के लिए बाहर निकलकर उसके पास गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: गया
  rationale: יצא का मूल अर्थ ‘बाहर जाना/निकलना’ है। इस प्रसंग में लक्ष्य ‘याकूब के पास’ स्पष्ट होने के कारण स्वाभाविक हिन्दी में ‘गया’ दिशा और कथात्मक क्रिया को पर्याप्त रूप से व्यक्त करता है; ‘बाहर निकला’ अनावश्यक रूप से स्थान पर बल देता।
- source_word: חֲמוֹר
  choice: हमोर
  rationale: इब्रानी नाम חֲמוֹר का निकट देवनागरी लिप्यंतरण।
- source_word: אֲבִי שְׁכֶם
  choice: शकेम का पिता
  rationale: इब्रानी संबंधसूचक पदबंध का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: אֶל יַעֲקֹב
  choice: याकूब के पास
  rationale: אֶל यहाँ किसी व्यक्ति की ओर गति दर्शाता है; ‘के पास’ आधुनिक हिन्दी में गंतव्य को सहजता से व्यक्त करता है।
- source_word: לְדַבֵּר אִתּוֹ
  choice: उससे बात करने के लिए
  rationale: לְ के साथ infinitive उद्देश्य बताता है, और אִתּוֹ पारस्परिक बातचीत का भाव देता है। सर्वनाम का स्वाभाविक संदर्भ याकूब है।
- source_word: וַ
  choice: तब
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस अनुक्रम को स्वाभाविक रूप से दर्शाता है।
