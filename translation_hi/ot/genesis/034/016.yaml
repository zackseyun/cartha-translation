  text: וְ/נָתַ֤נּוּ אֶת בְּנֹתֵ֨י/נוּ֙ לָ/כֶ֔ם וְ/אֶת בְּנֹתֵי/כֶ֖ם נִֽקַּֽח לָ֑/נוּ וְ/יָשַׁ֣בְנוּ אִתְּ/כֶ֔ם וְ/הָיִ֖ינוּ לְ/עַ֥ם אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/016.yaml
  text: then we will give our daughters to you[a], and we will take your daughters for ourselves, and we will live with you and become one people.
translation:
  language: hi
  text: तब हम अपनी बेटियाँ तुम्हें देंगे और तुम्हारी बेटियाँ अपने लिए ले लेंगे; हम तुम्हारे साथ रहेंगे और एक ही जनसमुदाय बन जाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और हम एक ही जनसमुदाय होंगे।” हिब्रू का शाब्दिक अर्थ “और हम एक जनसमुदाय के लिए होंगे” है, जिसे परिणामी अवस्था के रूप में “एक ही जनसमुदाय बन जाएँगे” या अधिक शाब्दिक रूप में “एक ही जनसमुदाय होंगे” अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַנּוּ
  choice: तब हम ... देंगे
  rationale: पूर्ववर्ती शर्त के परिणामस्वरूप भविष्य की क्रिया व्यक्त होती है; इसलिए आधुनिक हिन्दी में ‘तब ... देंगे’ स्वाभाविक है।
- source_word: אֶת־בְּנֹתֵינוּ לָכֶם
  choice: अपनी बेटियाँ तुम्हें
  rationale: पारिवारिक पद और देने के अप्रत्यक्ष कर्म, दोनों को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: וְאֶת־בְּנֹתֵיכֶם נִקַּח־לָנוּ
  choice: तुम्हारी बेटियाँ अपने लिए ले लेंगे
  rationale: לקח का मूल अर्थ ‘लेना’ सुरक्षित रखा गया है; विवाह का भाव प्रसंग से स्पष्ट है और לָנוּ को ‘अपने लिए’ से व्यक्त किया गया है।
- source_word: וְיָשַׁבְנוּ אִתְּכֶם
  choice: हम तुम्हारे साथ रहेंगे
  rationale: ישב के निवास-संबंधी अर्थ के लिए आधुनिक हिन्दी में ‘रहेंगे’ सहज और स्पष्ट है।
- source_word: וְהָיִינוּ לְעַם אֶחָד
  choice: एक ही जाति बन जाएँगे
  rationale: עם यहाँ राजनीतिक राष्ट्र-राज्य नहीं, बल्कि एक जन-समुदाय है। ‘जाति’ इस सामाजिक-वंशीय समूह का संक्षिप्त हिन्दी समतुल्य है; ‘बन जाएँगे’ प्रस्तावित मेल के परिणामी भाव को व्यक्त करता है।
theological_decisions:
- issue: וְהָיִינוּ में अवस्था या परिणति
  choice: बन जाएँगे
  alternative: हो जाएँगे / होकर एक ही जाति रहेंगे
  rationale: हिब्रू का शाब्दिक अर्थ ‘हम होंगे’ है, पर विवाह और साथ रहने के बाद उत्पन्न संयुक्त अवस्था को हिन्दी में ‘बन जाएँगे’ स्वाभाविक ढंग से व्यक्त करता है। विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखा गया है। ‘एक ही जाति’ में ‘जाति’ का अर्थ जन-समुदाय/people-group है, आधुनिक जाति-व्यवस्था की श्रेणी नहीं।
