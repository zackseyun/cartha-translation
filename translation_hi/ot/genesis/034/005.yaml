  text: וְ/יַעֲקֹ֣ב שָׁמַ֗ע כִּ֤י טִמֵּא֙ אֶת דִּינָ֣ה בִתּ֔/וֹ וּ/בָנָ֛י/ו הָי֥וּ אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶ֑ה וְ/הֶחֱרִ֥שׁ יַעֲקֹ֖ב עַד בֹּאָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/005.yaml
  text: Jacob heard that he had defiled his daughter Dinah. But his sons were with his livestock in the field[a], so Jacob kept silent until they came.
translation:
  language: hi
  text: याकूब ने सुना कि शकेम ने उसकी बेटी दीना को अशुद्ध किया था।[a] पर उसके बेटे याकूब के पशुधन के साथ खेत में थे, इसलिए याकूब उनके आने तक चुप रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी बेटी दीना का यौन अपमान किया था।” इब्रानी क्रिया का शाब्दिक अर्थ “अशुद्ध करना” है; इस प्रसंग में यह दीना के यौन अपमान को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: सुना
  rationale: यहाँ क्रिया किसी घटना की खबर मिलने को व्यक्त करती है; ‘सुना’ सीधा और स्वाभाविक कथात्मक अनुवाद है।
- source_word: כִּי
  choice: कि
  rationale: यह याकूब ने जो सुना उसकी विषय-वस्तु प्रस्तुत करता है।
- source_word: טִמֵּא
  choice: अशुद्ध कर दिया
  rationale: पिअेल रूप का मूल अर्थ ‘अशुद्ध करना’ है। यह अनुवाद इब्रानी शब्दावली को सुरक्षित रखता है, जबकि प्रसंग में निहित यौन अपमान को पादटिप्पणी स्पष्ट करती है।
- source_word: בִתּוֹ
  choice: उसकी बेटी
  rationale: संबंधसूचक प्रत्यय का सहज हिन्दी रूप।
- source_word: וּבָנָיו
  choice: उस समय याकूब के बेटे
  rationale: वाव से जुड़ी परिस्थितिजन्य सूचना को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है; ‘उस समय’ कोई नया काल-सूचक दावा जोड़े बिना समकालिक परिस्थिति स्पष्ट करता है।
- source_word: הָיוּ אֶת מִקְנֵהוּ בַּשָּׂדֶה
  choice: उसके पशुओं के साथ मैदान में थे
  rationale: मूल पाठ केवल बेटों की पशुओं के साथ स्थिति बताता है, यह स्पष्ट नहीं कहता कि वे उन्हें चरा रहे थे।
- source_word: מִקְנֵהוּ
  choice: उसके पशु
  rationale: מִקְנֶה यहाँ व्यापक रूप से पाले गए पशुधन को दर्शाता है; ‘पशु’ सामान्य पाठक के लिए सहज है और ‘मवेशी’ से अधिक व्यापक।
- source_word: וְהֶחֱרִשׁ
  choice: चुप रहा
  rationale: हिफ़ील रूप यहाँ बोलने या प्रतिक्रिया देने से रुके रहने को दर्शाता है।
- source_word: עַד בֹּאָם
  choice: उनके आने तक
  rationale: यह ‘उनके आने तक’ का सीधा और स्वाभाविक हिन्दी रूप है; ‘लौटने’ का भाव प्रसंग से संभव है, पर इब्रानी में स्पष्ट नहीं।
theological_decisions:
- issue: टִמֵּא में अशुद्धता और यौन उल्लंघन का संबंध
  choice: मुख्य पाठ में ‘अशुद्ध कर दिया’
  alternative: ‘उसका यौन अपमान किया’ अथवा ‘उसके साथ बलात्कार किया’
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘अशुद्ध करना’ है। प्रसंग यौन अपमान/उल्लंघन स्पष्ट करता है, पर यह क्रिया अपने आप में बलात्कार के लिए सामान्य विशिष्ट क्रिया नहीं है; इसलिए मुख्य पाठ मूल रूपक बचाता है और पादटिप्पणी प्रसंगगत अर्थ बताती है।
- issue: טִמֵּא का कर्ता
  choice: ‘शकेम’ को स्पष्ट किया
  alternative: सर्वनाम ‘उसने’
  rationale: इब्रानी में कर्ता पूर्ववर्ती प्रसंग से शकेम है। हिन्दी में पद को अलग पढ़े जाने पर ‘उसने’ अस्पष्ट हो सकता है, इसलिए संदर्भित नाम स्पष्ट करना अर्थगत रूप से उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। मूल पाठ की संक्षिप्तता और टִמֵּא की अर्थगत तीक्ष्णता को बनाए रखा गया है। पादटिप्पणी-चिह्न उस पदांश के तुरंत बाद रखा गया है जिसे वह स्पष्ट करता है।
