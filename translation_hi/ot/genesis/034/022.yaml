- source_word: יֵאֹתוּ לָנוּ
  choice: हमसे सहमत होंगे
  rationale: निफ़अल रूप सहमति, रज़ामंदी या इच्छुक होने का भाव देता है; वार्ता के प्रसंग में ‘सहमत होंगे’ उपयुक्त है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: הָאֲנָשִׁים
  choice: वे पुरुष
  rationale: मूल शब्द पुल्लिंग बहुवचन है और प्रसंग में याकूब के पुत्रों तथा उनके समुदाय के पुरुषों की ओर संकेत करता है।
- source_word: לָשֶׁבֶת אִתָּנוּ
