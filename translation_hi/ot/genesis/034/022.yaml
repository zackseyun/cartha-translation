base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/022.yaml
  text: 'Only on this condition will the men agree with us[a], to dwell with us and to become one people: that every male among us be circumcised, just as they are circumcised.'
translation:
  language: hi
  text: 'केवल इस शर्त पर वे पुरुष हमारे साथ रहने और एक ही समुदाय बनने के लिए हमसे सहमत होंगे[a]: हम में से हर पुरुष का खतना किया जाए, जैसे वे खतना किए हुए हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारी बात मानेंगे” अथवा “हमारे प्रति राज़ी होंगे”; इब्रानी क्रिया सहमति या रज़ामंदी का भाव व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
