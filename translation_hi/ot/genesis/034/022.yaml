- source_word: לִהְיוֹת לְעַם אֶחָד
  choice: एक ही जाति बनने
  rationale: यह सामाजिक रूप से एक समुदाय बनने का परिणामसूचक भाव देता है। ‘जाति’ यहाँ एक जनसमुदाय के अर्थ में है, आधुनिक राष्ट्र-राज्य के अर्थ में नहीं।
- source_word: בְּהִמּוֹל לָנוּ כָּל זָכָר
  choice: हमारे यहाँ के हर पुरुष का खतना किया जाए
  rationale: בְּ के साथ infinitive शर्त को व्यक्त करता है और לָנוּ सामुदायिक संबंध बताता है; हिन्दी में यह निष्क्रिय शर्त-वाक्य स्वाभाविक है।
- source_word: כַּאֲשֶׁר הֵם נִמֹּלִים
  choice: जैसे उनका खतना हुआ है
  rationale: तुलना को बनाए रखते हुए पूर्ण हो चुकी अवस्था को स्वाभाविक हिन्दी में व्यक्त किया गया है।
