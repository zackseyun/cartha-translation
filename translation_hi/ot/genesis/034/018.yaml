lexical_decisions:
- source_word: וַיִּיטְבוּ
  choice: अच्छी लगीं
  rationale: यहाँ יטב बहुवचन कर्ता דִבְרֵיהֶם और בְּעֵינֵי मुहावरे के साथ स्वीकृति या प्रसन्नता व्यक्त करता है। ‘अच्छी लगीं’ आधुनिक हिन्दी में स्वाभाविक रूप से इसी मूल्यांकन को व्यक्त करता है।
- source_word: דִבְרֵיהֶם
  choice: उनकी बातें
  rationale: דָּבָר के बहुवचन और तृतीय पुरुष बहुवचन संबंधसूचक प्रत्यय का सीधा और स्वाभाविक अनुवाद; ‘प्रस्ताव’ प्रसंगानुकूल तो है, पर मूल से अधिक संकीर्ण और व्याख्यात्मक होता।
- source_word: בְּעֵינֵי
  choice: को
  rationale: शाब्दिक अर्थ ‘की दृष्टि में’ है, पर ‘अच्छी लगीं’ के साथ हिन्दी में संप्रदानसूचक ‘को’ इस मूल्यांकन-संबंध को सहज ढंग से व्यक्त करता है।
- source_word: חֲמוֹר
  choice: हमोर
  rationale: व्यक्तिवाचक नाम का हिन्दी लिप्यंतरण।
- source_word: שְׁכֶם
  choice: शकेम
  rationale: व्यक्तिवाचक नाम का हिन्दी लिप्यंतरण; आरंभिक שׁ को ‘श’ और स्वर-रचना को ‘शकेम’ से दर्शाया गया है।
- source_word: בֶּן חֲמוֹר
  choice: हमोर के पुत्र
  rationale: मानक पितृ-संबंधसूचक अभिव्यक्ति; मूल का औपचारिक परिचय और शब्दक्रम पर्याप्त रूप से सुरक्षित रहता है।
