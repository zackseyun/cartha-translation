base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/020.yaml
  text: So Hamor and Shechem his son came to the gate of their city and spoke to the men of their city[a], saying[b],
translation:
  language: hi
  text: 'तब हमोर और उसका पुत्र शकेम अपने नगर के फाटक पर आए और अपने नगर के पुरुषों[a] से यह कहने लगे:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नगर के पुरुषों’ से आशय संभवतः उन पुरुष नगरवासियों से है जो नागरिक विचार-विमर्श के लिए फाटक पर इकट्ठे हुए थे।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आए
  rationale: בוא का कथात्मक रूप प्रसंग में गंतव्य की ओर आने को व्यक्त करता है; संयुक्त कर्ता के कारण हिंदी में बहुवचन आदरसूचक-सदृश रूप स्वाभाविक है।
- source_word: חֲמוֹר
  choice: हमोर
  rationale: व्यक्तिवाचक नाम को उसके हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וּשְׁכֶם בְּנוֹ
  choice: और उसका पुत्र शकेम
  rationale: पिता-पुत्र संबंध स्पष्ट रखते हुए आधुनिक हिंदी की स्वाभाविक शब्द-व्यवस्था अपनाई गई है।
- source_word: אֶל שַׁעַר עִירָם
  choice: अपने नगर के फाटक पर
  rationale: शाब्दिक अर्थ ‘उनके नगर के फाटक की ओर/पर’ है; यहाँ नगर का फाटक सार्वजनिक नागरिक विचार-विमर्श का स्थान है। ‘पर’ गंतव्य और सभा-स्थल दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַיְדַבְּרוּ אֶל
  choice: से ... बोले
  rationale: דבר אֶל का अर्थ किसी से बोलना या उसे संबोधित करना है; ‘बोले’ आगामी प्रत्यक्ष कथन की भूमिका के रूप में स्वाभाविक है।
- source_word: אַנְשֵׁי עִירָם
  choice: अपने नगर के पुरुषों
  rationale: אַנְשֵׁי का मूल अर्थ ‘पुरुष’ है और फाटक पर नागरिक निर्णय में भाग लेने वाले पुरुष नगरवासियों का संकेत बनाए रखता है।
- source_word: לֵאמֹר
  choice: यह कहकर
  rationale: मानक हिब्रू कथन-परिचायक को आधुनिक हिंदी में स्वाभाविक ढंग से प्रस्तुत करता है और अगले पद के कथन की ओर ले जाता है।
