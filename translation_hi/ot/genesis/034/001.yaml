base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/001.yaml
  text: Dinah[a], the daughter of Leah, whom she had borne to Jacob, went out to see the daughters of the land.
translation:
  language: hi
  text: लिआ की बेटी दीना, जिसे उसने याकूब के लिए जन्म दिया था, उस देश की बेटियों को देखने बाहर गई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उस देश की स्त्रियों से मिलने।’ इब्रानी में शाब्दिक रूप से, ‘उस देश की बेटियों को देखने’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: बाहर गई
  rationale: יצא का सामान्य अर्थ ‘बाहर जाना’ है। यह स्वाभाविक हिन्दी में कथानक की गति बनाए रखता है और ऐसा कोई स्थान नहीं जोड़ता जिसका इब्रानी में उल्लेख नहीं है।
- source_word: דִינָה
  choice: दीना
  rationale: व्यक्तिगत नाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: בַּת לֵאָה
  choice: लिआ की बेटी
  rationale: सम्बन्धवाचक रचना दीना की पहचान उसकी माता के आधार पर करती है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: जिसे उसने याकूब से जन्म दिया था
  rationale: सम्बन्धवाचक उपवाक्य लिआ से जुड़ता है और दीना के जन्म की पूर्ववर्ती पृष्ठभूमि बताता है। यहाँ לְיַעֲקֹב पिता के रूप में याकूब से सम्बन्ध सूचित करता है; ‘याकूब से’ हिन्दी में स्वाभाविक है।
- source_word: לִרְאוֹת
  choice: देखने
  rationale: ראה का सीधा अर्थ ‘देखना’ है। सन्दर्भ में मिलने-जुलने का भाव सम्भव है, पर मुख्य पाठ मूल की खुली अभिव्यक्ति बनाए रखता है।
- source_word: בִּבְנוֹת הָאָרֶץ
  choice: उस देश की बेटियों को
  rationale: शाब्दिक इब्रानी मुहावरे ‘देश की बेटियाँ’ को सुरक्षित रखा गया है। इसका आशय वहाँ की स्त्रियाँ या युवतियाँ भी हो सकता है, जिसे पादटिप्पणी में दिया गया है।
