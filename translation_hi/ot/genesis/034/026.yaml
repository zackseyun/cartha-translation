translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण कथात्मक हिंदी में रखी गई है। व्यक्तिनामों के लिए प्रचलित हिंदी बाइबलीय रूप 'हमोर', 'शकेम' और 'दीना' अपनाए गए हैं। दो वाक्यों का विभाजन घटनाक्रम को स्पष्ट करता है, जबकि 'फिर' इब्रानी कथात्मक अनुक्रम को स्वाभाविक हिंदी में व्यक्त करता है।
