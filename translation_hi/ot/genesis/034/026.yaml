  text: וְ/אֶת חֲמוֹר֙ וְ/אֶת שְׁכֶ֣ם בְּנ֔/וֹ הָרְג֖וּ לְ/פִי חָ֑רֶב וַ/יִּקְח֧וּ אֶת דִּינָ֛ה מִ/בֵּ֥ית שְׁכֶ֖ם וַ/יֵּצֵֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/026.yaml
  text: They also killed Hamor and his son Shechem with the sword[a], and they took Dinah from Shechem’s house and went out.
translation:
  language: hi
  text: उन्होंने हमोर और उसके बेटे शकेम को भी तलवार से मार डाला[a]। फिर वे दीना को शकेम के घर से लेकर निकल गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “तलवार के मुँह से”; यह तलवार से मार डालने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת חֲמוֹר וְאֶת שְׁכֶם בְּנוֹ
  choice: हमोर और उसके बेटे शकेम को भी
  rationale: संयोजक וְ पिछले पद की कार्रवाई से संबंध जोड़ता है और हमोर तथा शकेम को अतिरिक्त कर्मों के रूप में प्रस्तुत करता है। हिंदी में 'भी' इस योगात्मक भाव को स्वाभाविक ढंग से व्यक्त करता है; בְּנוֹ से पिता-पुत्र का संबंध स्पष्ट रखा गया है।
- source_word: הָרְגוּ
  choice: मार डाला
  rationale: הרג के पूर्ण घातक अर्थ को आधुनिक कथात्मक हिंदी में स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְפִי חָרֶב
  choice: तलवार से
  rationale: शाब्दिक रूप से 'तलवार के मुँह से' एक इब्रानी मुहावरा है। मुख्य पाठ में उसका स्वाभाविक हिंदी अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וַיִּקְחוּ אֶת דִּינָה
  choice: वे दीना को ... लेकर
  rationale: לקח का व्यापक सामान्य अर्थ 'लेना' है। 'लेकर' मूल की कार्रवाई को बनाए रखता है और 'छुड़ाकर' जैसे अतिरिक्त व्याख्यात्मक भाव से बचता है।
- source_word: מִבֵּית שְׁכֶם
  choice: शकेम के घर से
  rationale: בית को तत्काल कथा-संदर्भ में ठोस निवास-स्थान के रूप में समझना सबसे स्वाभाविक है; हिंदी संबंधसूचक रचना मूल के स्वामित्व-संबंध को स्पष्ट रखती है।
- source_word: וַיֵּצֵאוּ
  choice: निकल गए
  rationale: יצא घर से बाहर जाने की गति बताता है। 'निकल गए' आधुनिक हिंदी में स्वाभाविक है और दिशा से अधिक कोई विवरण नहीं जोड़ता।
