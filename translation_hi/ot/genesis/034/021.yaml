  register: आधुनिक मानक हिन्दी; कथन को सामान्य पाठक के लिए सहज, किंतु गरिमापूर्ण रखा गया है। वक्ताओं के प्रस्ताव को ‘दें/बनाएँ’ से व्यक्त किया गया है। सभी पाठ-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
