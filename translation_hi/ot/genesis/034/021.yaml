  text: הָ/אֲנָשִׁ֨ים הָ/אֵ֜לֶּה שְֽׁלֵמִ֧ים הֵ֣ם אִתָּ֗/נוּ וְ/יֵשְׁב֤וּ בָ/אָ֨רֶץ֙ וְ/יִסְחֲר֣וּ אֹתָ֔/הּ וְ/הָ/אָ֛רֶץ הִנֵּ֥ה רַֽחֲבַת יָדַ֖יִם לִ/פְנֵי/הֶ֑ם אֶת בְּנֹתָ/ם֙ נִקַּֽח לָ֣/נוּ לְ/נָשִׁ֔ים וְ/אֶת בְּנֹתֵ֖י/נוּ נִתֵּ֥ן לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/021.yaml
  text: These men are at peace with us[a]. Let them dwell in the land and trade in it, for, you see, the land is broad enough for them. We will take their daughters for wives for ourselves[d][c][b], and we will give our daughters to them.
translation:
  language: hi
  text: “इन लोगों के हमारे साथ शांति-पूर्ण संबंध हैं[a]। इन्हें इस भूमि में बसने और इसमें व्यापार करने दें[c]; क्योंकि, देखो, भूमि उनके लिए पर्याप्त विस्तृत है[b]। हम उनकी बेटियों को अपने लिए पत्नियों के रूप में लें, और अपनी बेटियाँ उन्हें दें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ये लोग हमारे प्रति मैत्रीपूर्ण हैं” अथवा “इनके और हमारे बीच अच्छे संबंध हैं।”
    reason: שְׁלֵמִים यहाँ हमारे साथ शांतिपूर्ण या मैत्रीपूर्ण संबंध का बोध कराता है।
  - marker: b
    text: शाब्दिक रूप से, “भूमि—देखो—उनके सामने हाथों की चौड़ाई वाली है”; यह मुहावरा भूमि के पर्याप्त विस्तृत होने या उनमें उनके लिए पर्याप्त स्थान होने का संकेत देता है।
    reason: हिब्रू मुहावरे के चित्रात्मक और स्थान-संबंधी अर्थ को दर्ज करना।
  - marker: c
    text: या “इसके आर-पार व्यापार करने दें”; हिब्रू देश के भीतर या उसके क्षेत्र से होकर व्यापार करने का संकेत दे सकता है।
    reason: क्रिया और सर्वनाम से बनने वाली स्थानगत अभिव्यक्ति में वास्तविक अस्पष्टता है।
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: हमारे साथ शान्ति से रहना चाहते हैं
  rationale: इस प्रसंग में विशेषण शांतिपूर्ण अथवा मैत्रीपूर्ण संबंध का संकेत देता है। हिन्दी में यह वाक्य संबंधपरक अर्थ को स्वाभाविक रूप से व्यक्त करता है, यद्यपि ‘चाहते हैं’ निहित भाव को स्पष्ट करता है।
- source_word: וְיֵשְׁבוּ
  choice: इन्हें इस देश में बसने ... दें
  rationale: रूप अपूर्णकाल है, पर भाषण के संदर्भ में यह अनुमति देने के आग्रह के रूप में कार्य करता है। ‘बसने दें’ स्थायी निवास के भाव को सहज हिन्दी में रखता है।
- source_word: וְיִסְחֲרוּ אֹתָהּ
  choice: इसमें व्यापार करने दें
  rationale: סחר व्यावसायिक गतिविधि दर्शाता है और स्त्रीलिंग सर्वनाम ‘देश’ की ओर संकेत करता है। ‘इसमें’ व्यापार को देश के भीतर होने देता है, जबकि ‘इसके आर-पार’ भी संभव है।
- source_word: רַחֲבַת יָדַיִם לִפְנֵיהֶם
  choice: देश में इनके लिए बहुत जगह है
  rationale: ‘हाथों में चौड़ा’ शाब्दिक रूप से अस्वाभाविक मुहावरा है; आशय पर्याप्त विस्तार और उपलब्ध स्थान का है।
- source_word: נִקַּח לָנוּ לְנָשִׁים
  choice: हम उनकी बेटियों को अपनी पत्नियाँ बनाएँ
  rationale: प्रथम पुरुष बहुवचन अपूर्णकाल यहाँ प्रस्ताव या सामूहिक मंशा व्यक्त कर सकता है। ‘अपनी पत्नियाँ बनाएँ’ לָנוּ और विवाह-संबंधी मुहावरे दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִתֵּן לָהֶם
  choice: अपनी बेटियाँ उन्हें दें
  rationale: यह पिछले खंड के समानांतर पारस्परिक वैवाहिक व्यवस्था का प्रस्ताव है और मूल के ‘देने’ वाले मुहावरे को बनाए रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करके आगे दिए कारण पर बल देता है; ‘देखो’ आधुनिक और गरिमापूर्ण हिन्दी में इस संवादात्मक बल को सुरक्षित रखता है।
