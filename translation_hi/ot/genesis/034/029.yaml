translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी वाक्य में धन-संपत्ति, बच्चों और पत्नियों की मिली-जुली कर्म-सूची के बाद “बंदी बनाया” आता है; हिन्दी में धन-संपत्ति के लिए “ले ली” और लोगों के लिए “बंदी बनाकर ले गए” रखकर आशय स्पष्ट किया गया है, जबकि मूल क्रम यथासंभव सुरक्षित है।
