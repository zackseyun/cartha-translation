  text: וְ/אֶת כָּל חֵילָ֤/ם וְ/אֶת כָּל טַפָּ/ם֙ וְ/אֶת נְשֵׁי/הֶ֔ם שָׁב֖וּ וַ/יָּבֹ֑זּוּ וְ/אֵ֖ת כָּל אֲשֶׁ֥ר בַּ/בָּֽיִת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/029.yaml
  text: They took captive all their wealth and all their little ones and their wives[c][b][a], and plundered everything that was in the house.
translation:
  language: hi
  text: उन्होंने उनकी सारी धन-संपत्ति ले ली, उनके सब छोटे बच्चों[a] और उनकी पत्नियों[b] को बंदी बनाकर ले गए, और घर[c] में जो कुछ था, सब लूट लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके सब बाल-बच्चों”; इब्रानी शब्द प्रायः छोटे बच्चों या परिवार के आश्रित बच्चों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनकी स्त्रियों”; इब्रानी शब्द का अर्थ “स्त्रियाँ” या “पत्नियाँ” दोनों हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “घराने”; इब्रानी में “घर” कभी-कभी घराने और उसकी संपत्ति को भी सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: उनकी सारी धन-संपत्ति
  rationale: חַיִל यहाँ सेना या सामर्थ्य के बजाय धन, साधन और संपत्ति को सूचित करता है। “धन-संपत्ति” अर्थ को व्यापक रखता है और इसे केवल पशुधन तक सीमित नहीं करता।
- source_word: טַפָּם
  choice: उनके सब छोटे बच्चे
  rationale: טַף प्रायः परिवार के छोटे बच्चों या आश्रित बालकों के लिए आता है। “छोटे बच्चे” आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: נְשֵׁיהֶם
  choice: उनकी पत्नियाँ
  rationale: אִשָּׁה का अर्थ “स्त्री” या “पत्नी” हो सकता है। यहाँ संबंधसूचक बहुवचन प्रत्यय और परिवार के सदस्यों की सूची के कारण “पत्नियाँ” अधिक स्वाभाविक है; व्यापक विकल्प को पाद-टिप्पणी में रखा गया है।
- source_word: שָׁבוּ
  choice: बंदी बनाकर ले गए
  rationale: שָׁבָה लोगों को बंदी बनाकर ले जाने का अर्थ देता है। यह हिन्दी पदबंध बंदी बनाए जाने और वहाँ से ले जाए जाने—दोनों भाव स्पष्ट करता है।
- source_word: וַיָּבֹזּוּ
  choice: लूट लिया
  rationale: בזז युद्ध या हिंसक आक्रमण में माल लूटने को व्यक्त करता है। “लूट लिया” सहज आधुनिक हिन्दी में वही हिंसक भाव बनाए रखता है।
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: घर में जो कुछ था, सब
  rationale: यह इब्रानी वाक्यांश घर के भीतर की समस्त वस्तुओं को दर्शाता है। हिन्दी में “घर में जो कुछ था, सब” स्वाभाविक रहते हुए मूल की व्यापकता बनाए रखता है।
