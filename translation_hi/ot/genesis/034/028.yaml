base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/028.yaml
  text: They took their flocks[a], their herds, their donkeys, and whatever was in the city and whatever was in the field.
translation:
  language: hi
  text: उन्होंने उनकी भेड़-बकरियाँ, गाय-बैल और गधे, और नगर में जो कुछ था और खेत[a] में जो कुछ था, वह सब ले लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खुले देहात में।”
    reason: שָׂדֶה खेत के साथ-साथ खुले देहात या ग्रामीण क्षेत्र को भी दर्शा सकता है।
lexical_decisions:
- source_word: צֹאנָם
  choice: उनकी भेड़-बकरियाँ
  rationale: צֹאן छोटे पालतू पशुओं का सामूहिक नाम है, विशेषकर भेड़ों और बकरियों का। हिंदी में ‘भेड़-बकरियाँ’ इसका स्पष्ट और स्वाभाविक सामूहिक रूप है।
- source_word: בְּקָרָם
  choice: गाय-बैल
  rationale: בָּקָר गोवंश अथवा बड़े पालतू पशुओं के झुंड को दर्शाता है। ‘गाय-बैल’ आधुनिक हिंदी में स्वाभाविक है और केवल ‘गायें’ कहने की अपेक्षा अधिक समावेशी है।
- source_word: חֲמֹרֵיהֶם
  choice: गधे
  rationale: यह शब्द सीधे गधों को दर्शाता है; ‘गधे’ सामान्य और वर्तमान हिंदी प्रयोग है।
- source_word: אֲשֶׁר בָּעִיר
  choice: नगर में ... जो कुछ था
  rationale: संबंधवाचक रचना लूट की वस्तुओं के व्यापक, अनिश्चित दायरे को व्यक्त करती है। ‘जो कुछ था’ उसी व्यापकता को सहज हिंदी में रखता है।
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: खेत में जो कुछ था
  rationale: שָׂדֶה का अर्थ खेत या खुला देहात हो सकता है। मुख्य पाठ में ‘खेत’ सीधा अर्थ रखता है और वैकल्पिक व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: לָקָחוּ
  choice: सब ले लिया
  rationale: לָקַח का मूल अर्थ ‘लेना’ है। हिंदी में वाक्य के अंत में ‘सब ले लिया’ पूर्ववर्ती विस्तृत कर्म-सूची को स्वाभाविक रूप से समेटता है, बिना ‘लूट लिया’ जैसी व्याख्यात्मक तीव्रता जोड़े।
