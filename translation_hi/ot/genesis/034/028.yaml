  terminology: ‘भेड़-बकरियाँ,’ ‘गाय-बैल,’ and ‘गधे’ are suitable modern Hindi equivalents for the respective livestock terms. ‘खेत’ is a direct rendering of שָׂדֶה; the footnote appropriately records its possible broader sense.
  issues:
