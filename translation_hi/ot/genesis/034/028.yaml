  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल इब्रानी की वस्तु-सूची और व्यापक ‘जो कुछ था’ संरचना सुरक्षित है; हिंदी की स्वाभाविकता के लिए क्रिया के साथ ‘सब’ जोड़ा गया है।
