source:
  edition: WLC
  text: וַ/יַּ֨רְא אֹתָ֜/הּ שְׁכֶ֧ם בֶּן חֲמ֛וֹר הַֽ/חִוִּ֖י נְשִׂ֣יא הָ/אָ֑רֶץ וַ/יִּקַּ֥ח אֹתָ֛/הּ וַ/יִּשְׁכַּ֥ב אֹתָ֖/הּ וַ/יְעַנֶּֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/002.yaml
  text: When Shechem son of Hamor the Hivite[a], the prince of the land, saw her[b], he took her and lay with her and humiliated her.
translation:
  language: hi
  text: जब उस देश के प्रधान, हिव्वी हमोर के पुत्र शकेम ने उसे देखा, तो उसने उसे ले लिया, उसके साथ सोया और उसका यौन अपमान किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका उल्लंघन किया।” इब्रानी क्रिया का अर्थ पीड़ित करना, अपमानित करना या उल्लंघन करना हो सकता है। इस प्रसंग में यह यौन उल्लंघन को सूचित करती है; इसलिए कई अनुवाद यहाँ “उसके साथ बलात्कार किया” अनुवाद करते हैं।
    reason: इब्रानी क्रिया ענה की अर्थ-व्याप्ति तथा इस प्रसंग में उसके यौन हिंसा-सूचक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּרְא אֹתָהּ
  choice: उसने उसे देखा
  rationale: ראה का सामान्य कथात्मक अर्थ ‘देखना’ है; इससे इब्रानी क्रियाक्रम सहज रूप में बना रहता है।
- source_word: שְׁכֶם בֶּן חֲמוֹר הַחִוִּי
  choice: हिव्वी हमोर का पुत्र शकेम
  rationale: व्यक्तिनामों और जातिसूचक नाम का मानक हिन्दी लिप्यंतरण किया गया है तथा संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: נְשִׂיא הָאָרֶץ
  choice: उस देश का प्रधान
  rationale: נָשִׂיא नेता, मुखिया या प्रधान को सूचित कर सकता है। ‘प्रधान’ सामाजिक-राजनीतिक पद बताता है, पर राजपद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיִּקַּח אֹתָהּ
  choice: वह उसे ले गया
  rationale: לקח का मूल अर्थ ‘लेना’ है। हिन्दी में ‘ले गया’ इस प्रसंग का स्वाभाविक कथात्मक रूप है; बलपूर्वक किए गए यौन अपराध का संकेत अंतिम क्रिया स्पष्ट करती है।
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: उसके साथ सोया
  rationale: यह यौन संबंध के लिए इब्रानी मुहावरा है। हिन्दी का ‘उसके साथ सोया’ अर्थ को सामान्य और गंभीर भाषा में संप्रेषित करता है।
- source_word: וַיְעַנֶּהָ
  choice: उसका अपमान किया
  rationale: पिएल रूप में ענה पीड़ित करने, नीचा दिखाने, अपमानित करने या उल्लंघन करने का भाव दे सकता है। ‘अपमान किया’ मूल की व्यापकता और कथन के गंभीर मूल्यांकन को बनाए रखता है; पादटिप्पणी इस संदर्भ में यौन हिंसा का आशय स्पष्ट करती है।
theological_decisions:
- issue: यौन हिंसा को बिना नरम किए और इब्रानी से अधिक विशिष्ट हुए बिना व्यक्त करना
  choice: मुख्य पाठ में इब्रानी क्रम ‘उसे ले गया, उसके साथ सोया और उसका अपमान किया’ रखा गया है, और पादटिप्पणी में स्पष्ट किया गया है कि प्रसंग बलपूर्वक यौन उल्लंघन का है।
  alternative: ‘उसे पकड़ लिया और उसका बलात्कार किया’
  rationale: वैकल्पिक अनुवाद घटना की जबरदस्ती को सीधे व्यक्त करता है, पर לקח और ענה दोनों को अधिक विशिष्ट बना देता है। चुना हुआ पाठ मूल की शाब्दिक और अर्थगत व्यापकता को सुरक्षित रखता है, जबकि पादटिप्पणी घटना की हिंसक प्रकृति को अस्पष्ट नहीं रहने देती।
translation_notes:
  register: आधुनिक मानक हिन्दी की गंभीर, सहज और गरिमापूर्ण शैली। ‘प्रधान’ पद को राजशाही से अधिक निश्चित नहीं करता। मुख्य पाठ मूल इब्रानी के तीन-क्रियात्मक क्रम को बनाए रखता है और पादटिप्पणी यौन हिंसा को स्पष्ट करती है।
