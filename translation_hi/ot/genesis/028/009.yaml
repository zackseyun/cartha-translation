base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/009.yaml
  text: So Esau went to Ishmael and took Mahalath[a], the daughter of Ishmael son of Abraham, the sister of Nebaioth, as a wife for himself in addition to his wives.
translation:
  language: hi
  text: तब एसाव इश्माएल के पास गया और उसने अब्राहम के पुत्र इश्माएल की बेटी, नबायोत की बहन महलत को अपनी पत्नियों के अतिरिक्त[a] अपने लिए पत्नी बना लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी पत्नियों के अलावा।” इब्रानी पदबंध का अर्थ है कि महलत को उसकी पहले से मौजूद पत्नियों के स्थान पर नहीं, बल्कि एक और पत्नी के रूप में लिया गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ עֵשָׂו אֶל יִשְׁמָעֵאל
  choice: तब एसाव इश्माएल के पास गया
  rationale: क्रमिक कथन को स्वाभाविक हिन्दी में व्यक्त करने के लिए וַ־ को ‘तब’ और אֶל को ‘के पास’ किया गया है; इससे इश्माएल की ओर जाने का सीधा अर्थ बना रहता है।
- source_word: וַיִּקַּח
  choice: अपनी पत्नी बना लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर לְאִשָּׁה के साथ यह विवाह-संबंध स्थापित करने का मुहावरा है। शाब्दिक ‘पत्नी के लिए ले लिया’ की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: מָחֲלַת
  choice: महलत
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם
  choice: अब्राहम के पुत्र इश्माएल की बेटी
  rationale: वंश-संबंध की पूरी रचना को स्पष्ट और सहज हिन्दी क्रम में रखा गया है।
- source_word: אֲחוֹת נְבָיוֹת
  choice: नबायोत की बहन
  rationale: महलत की पहचान कराने वाले समानाधिकरण वाक्यांश का सीधा अनुवाद है।
- source_word: עַל נָשָׁיו
  choice: अपनी मौजूदा पत्नियों के अतिरिक्त
  rationale: यहाँ עַל स्थानिक ‘ऊपर’ नहीं, बल्कि पहले से मौजूद पत्नियों के साथ एक और पत्नी जोड़े जाने का भाव देता है। ‘मौजूदा’ इस बात को स्पष्ट करता है कि वे पत्नियाँ पहले से थीं।
- source_word: לוֹ לְאִשָּׁה
  choice: अपनी पत्नी बना लिया
  rationale: לוֹ के आत्म-संबंधी भाव और לְאִשָּׁה के वैवाहिक परिणाम को एक स्वाभाविक हिन्दी मुहावरे में समाहित किया गया है।
