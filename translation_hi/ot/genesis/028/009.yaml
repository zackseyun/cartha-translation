translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वंशावली संबंधी विवरण मूल के अनुसार सुरक्षित हैं, और विवाह के इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त किया गया है।
