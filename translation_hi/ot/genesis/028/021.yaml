base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/021.yaml
  text: and I return in peace to my father's house[a], and Yahweh will be my God.
translation:
  language: hi
  text: और मैं सकुशल अपने पिता के घर लौट आऊँ[a], और याहवे मेरा परमेश्वर होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैं शांति से अपने पिता के घर लौट आऊँ।” यहाँ ‘सकुशल’ के लिए प्रयुक्त इब्रानी पद शांति, सुरक्षित वापसी और सकुशल होने—इन सभी भावों को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: और मैं ... लौट आऊँ
  rationale: שׁוב का अर्थ ‘लौटना’ है। यह वाक्य पिछले पदों से चली आ रही शर्त का भाग है, इसलिए हिंदी में संभावनार्थक ‘लौट आऊँ’ उस भविष्याभिमुख शर्त को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְשָׁלוֹם
  choice: कुशल से
  rationale: שָׁלוֹם में शांति, कुशलता, सलामती और भलाई के भाव समाहित हैं। ‘कुशल से’ आधुनिक हिंदी में लौटने के संदर्भ में स्वाभाविक है और केवल बाहरी सुरक्षा तक अर्थ को सीमित नहीं करता।
- source_word: אֶל בֵּית אָבִי
  choice: अपने पिता के घर
  rationale: यह संबंधवाचक पदबंध पारिवारिक घराने अथवा निवास को दर्शाता है। ‘अपने पिता के घर’ सहज और स्रोत के निकट है।
- source_word: וְהָיָה
  choice: और ... होगा
  rationale: हिब्रू संयोजक וְ को सीधे ‘और’ से रखा गया है। इससे पिछले पदों की शर्तीय क्रमबद्धता बनी रहती है, पर स्रोत में अलग से न होने वाला ‘तब’ नहीं जोड़ा जाता।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम को किसी उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित विद्वत्तापूर्ण लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: לִי לֵאלֹהִים
  choice: मेरा परमेश्वर
  rationale: शाब्दिक रचना ‘मेरे लिए परमेश्वर’ है, पर हिंदी में संबंध और निष्ठा का वही भाव स्वाभाविक रूप से ‘मेरा परमेश्वर’ से व्यक्त होता है।
theological_decisions:
- issue: क्या याकूब का कथन याहवे को सशर्त रूप से अपना परमेश्वर मानने की बात है या केवल उसकी प्रतिज्ञा की पुष्टि?
  choice: पिछले पदों से चली आ रही शर्तीय संरचना को ‘लौट आऊँ ... और ... होगा’ के रूप में बनाए रखा गया है।
  alternative: इसे शर्त से अलग एक निःशर्त घोषणा के रूप में प्रस्तुत करना, अथवा ‘तब’ जोड़कर परिणाम-संबंध को और स्पष्ट करना।
  rationale: हिब्रू क्रम शर्त और उसके परिणाम के रूप में पढ़ा जा सकता है, जबकि इस पद में संयोजक केवल ‘और’ है। अनुवाद इस धर्मवैज्ञानिक तनाव को न तो कम करता है और न स्रोत से अधिक स्पष्ट बनाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कुशल से’ सामान्य हिंदी में स्वाभाविक है; पादटिप्पणी हिब्रानी שָׁלוֹם के व्यापक अर्थ को सुरक्षित रखती है।
