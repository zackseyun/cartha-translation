id: GEN.28.4
reference: Genesis 28:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יִֽתֶּן לְ/ךָ֙ אֶת בִּרְכַּ֣ת אַבְרָהָ֔ם לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֣ אִתָּ֑/ךְ לְ/רִשְׁתְּ/ךָ֙ אֶת אֶ֣רֶץ מְגֻרֶ֔י/ךָ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים לְ/אַבְרָהָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/004.yaml
  text: May he give you the blessing of Abraham[a], to you and to your offspring with you, so that you may possess the land of your sojournings[b], which God gave to Abraham.
translation:
  language: hi
  text: वह तुझे अब्राहम की आशीष दे—तुझे और तेरे साथ तेरे वंश[a] को—ताकि तू उस देश को अपने अधिकार में ले जहाँ तू परदेशी होकर रहता है[b], जिसे परमेश्वर ने अब्राहम को दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी शब्द का शाब्दिक अर्थ “बीज” है; वह रूप में एकवचन, पर यहाँ सामूहिक अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: या “ताकि तू अपने परदेशी निवास के देश को विरासत में पाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: वह ... दे
  rationale: आशीर्वाद के प्रसंग में यह रूप कामना या प्रार्थना व्यक्त करता है। हिंदी में “वह ... दे” इस भाव को स्वाभाविक रूप से व्यक्त करता है; आरंभिक संयोजक को अलग से “और” कहना आवश्यक नहीं है।
- source_word: בִּרְכַּת אַבְרָהָם
  choice: अब्राहम की आशीष
  rationale: सम्बन्धवाचक इब्रानी रचना का सीधा और स्वाभाविक हिंदी रूप है, जो अब्राहम से जुड़ी वाचा की प्रतिध्वनि बनाए रखता है।
- source_word: לְךָ וּלְזַרְעֲךָ אִתָּךְ
  choice: तुझे और तेरे साथ तेरे वंश को
  rationale: “तेरे साथ” को हटाया नहीं गया, क्योंकि वह मूल पाठ में स्पष्ट है। זֶרַע रूप में एकवचन होते हुए यहाँ सामूहिक अर्थ रखता है; “वंश” आधुनिक हिंदी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְרִשְׁתְּךָ
  choice: ताकि तू ... अपने अधिकार में ले
  rationale: לְ सहित infinitive यहाँ उद्देश्य या परिणाम बताता है। भूमि के संदर्भ में “अपने अधिकार में लेना” क्रिया के अधिग्रहण/अधिकार-प्राप्ति के अर्थ को स्पष्ट रखता है, जबकि “विरासत में पाना” भी संभावित अर्थ है।
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: उस देश को ... जहाँ तू परदेशी होकर रहता है
  rationale: מָגוּר स्थायी स्वामित्व के बिना परदेशी या प्रवासी के रूप में निवास को दर्शाता है। शाब्दिक “तेरे प्रवासों का देश” की अपेक्षा यह हिंदी में अधिक स्वाभाविक और स्पष्ट है।
- source_word: אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם
  choice: जिसे परमेश्वर ने अब्राहम को दिया था
  rationale: सम्बन्धवाचक उपवाक्य को सीधे रखा गया है। पूर्ण भूतकाल “दिया था” वर्तमान आशीर्वाद से पहले अब्राहम को किए गए दान को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: अब्राहम से जुड़ी वाचा की भाषा
  choice: “अब्राहम की आशीष” और देश को अधिकार में लेने की भाषा को स्पष्ट रूप से बनाए रखा गया।
  alternative: “अब्राहम से की गई प्रतिज्ञा की आशीष” कहना या “विरासत में पाए” द्वारा उत्तराधिकार के भाव को मुख्य पाठ में प्रमुख करना।
  rationale: मूल पाठ आशीष और भूमि के अधिकार को अब्राहम से सीधे जोड़ता है, पर उसका अर्थ खोलकर किसी विशिष्ट धर्मवैज्ञानिक व्याख्या में नहीं बदलता। “अपने अधिकार में ले” मूल क्रिया का प्राथमिक भाव रखता है; विरासत का संभव भाव पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज और सामान्य पाठकों के लिए स्पष्ट रूप अपनाया गया है। संबोधन में एकवचन “तू/तेरे” रखा गया है, क्योंकि मूल पाठ याकूब को एक व्यक्ति के रूप में संबोधित करता है। मुख्य वाक्य में अर्थ-संबंध स्पष्ट करने के लिए सीमित रूप से दीर्घ विराम-चिह्नों का प्रयोग किया गया है।
