base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/016.yaml
  text: Then Jacob awoke from his sleep and said[a], “Surely Yahweh is in this place, and I did not know it.”
translation:
  language: hi
  text: तब याकूब अपनी नींद से जागा और उसने कहा[a], “निश्चय ही याहवे इस स्थान पर है, और मैं नहीं जानता था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: “निश्चय ही याहवे इस स्थान पर है।” यह कथन याकूब को वहाँ याहवे की उपस्थिति का अचानक बोध होने को व्यक्त करता है।'
    reason: मूल इब्रानी के बल और प्रसंगगत भाव को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּיקַץ
  choice: जागा
  rationale: यह क्रिया नींद से जागने को व्यक्त करती है; ‘जागा’ आधुनिक हिन्दी में स्वाभाविक और कथात्मक शैली के अनुरूप है।
- source_word: מִשְּׁנָתוֹ
  choice: अपनी नींद से
  rationale: यह पद याकूब की नींद से जागने को सीधे और सहज ढंग से व्यक्त करता है।
- source_word: אָכֵן
  choice: निश्चय ही
  rationale: यह अव्यय अचानक हुए दृढ़ बोध या पुष्टि को प्रकट करता है; ‘निश्चय ही’ याकूब के विस्मयपूर्ण एहसास को बनाए रखता है।
- source_word: יֵשׁ
  choice: है
  rationale: अस्तित्व अथवा उपस्थिति बताने वाले इस पद का हिन्दी में ‘याहवे इस स्थान में है’ स्वाभाविक रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम आया है; ‘याहवे’ उसका हिन्दी लिप्यंतरण है, किसी उपाधि का प्रतिस्थापन नहीं।
- source_word: בַּמָּקוֹם הַזֶּה
  choice: इस स्थान में
  rationale: यह उस निश्चित जगह को सूचित करता है जहाँ याकूब सोया और उसने स्वप्न देखा।
- source_word: וְאָנֹכִי
  choice: और मुझे
  rationale: स्वतंत्र सर्वनाम याकूब की पूर्व अनभिज्ञता पर बल देता है; हिन्दी में ‘और मुझे’ इस विरोध को सहज रूप से व्यक्त करता है।
- source_word: לֹא יָדָעְתִּי
  choice: इसका पता नहीं था
  rationale: यह याकूब की अब तक की अनभिज्ञता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘इसका’ याहवे की वहाँ उपस्थिति की ओर संकेत करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल इब्रानी में चार अक्षरों वाला व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है और उसे उपाधि में नहीं बदलता।
- issue: याहवे की उस स्थान में उपस्थिति
  choice: ‘इस स्थान में है’ के सीधे कथन को बनाए रखा गया
  alternative: ‘इस स्थान में उपस्थित है’
  rationale: मूल का अस्तित्व-सूचक कथन याकूब के अचानक बोध को व्यक्त करता है। अनुवाद इसे किसी विशिष्ट सर्वव्यापकता-संबंधी व्याख्या से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘निश्चय ही’ विस्मय और दृढ़ बोध दोनों को व्यक्त करता है; ‘इसका पता नहीं था’ सामान्य पाठक के लिए स्वाभाविक है।
