    text: 'शाब्दिक: ‘कनान की बेटियाँ’; अर्थात् कनानी स्त्रियाँ।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाया
  rationale: קרא אֶל किसी व्यक्ति को बुलाने के अर्थ में है; ‘बुलाया’ स्वाभाविक है और अनावश्यक औपचारिकता नहीं जोड़ता।
- source_word: וַיְבָרֶךְ
  choice: आशीर्वाद दिया
  rationale: ברך का सामान्य और संदर्भानुकूल अर्थ ‘आशीर्वाद देना’ है।
- source_word: וַיְצַוֵּהוּ
  choice: यह आज्ञा दी
  rationale: צוה अधिकारपूर्वक आदेश देने को व्यक्त करता है; ‘आज्ञा दी’ पिता के निर्देश की शक्ति बनाए रखता है।
- source_word: לֹא תִקַּח אִשָּׁה
  choice: किसी को अपनी पत्नी न बनाना
  rationale: विवाह के संदर्भ में לקח אשה का आशय किसी स्त्री से विवाह करना है; यह हिंदी में स्वाभाविक और अर्थ-सटीक अभिव्यक्ति है।
- source_word: מִבְּנוֹת כְּנָעַן
  choice: कनान की बेटियों में से
  rationale: मूल का शाब्दिक मुहावरा बनाए रखा गया है; यहाँ इसका संकेत कनानी स्त्रियों की ओर है।
- source_word: וַ
  choice: तब
  rationale: आरंभिक कथात्मक वाव घटनाक्रम की अगली कड़ी बताता है; आधुनिक हिंदी में ‘तब’ स्वाभाविक है।
