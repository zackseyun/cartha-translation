  yaml_path: translation/ot/genesis/028/001.yaml
  text: Then Isaac called Jacob and blessed him and commanded him[a], saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: hi
  text: 'तब इसहाक ने याकूब को बुलाया, उसे आशीर्वाद दिया और उसे आज्ञा दी: “तू कनान की बेटियों[a] में से किसी को अपनी पत्नी न बनाना।”'
  philosophy: optimal-equivalence
  footnotes:
