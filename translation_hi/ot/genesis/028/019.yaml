base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/019.yaml
  text: And he called the name of that place Bethel[a], but formerly the name of the city was Luz.
translation:
  language: hi
  text: उसने उस स्थान का नाम बेतेल[a] रखा, पर पहले उस नगर का नाम लूज़ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेतेल’ का अर्थ है ‘परमेश्वर का घर।’
    reason: स्थान-नाम בֵּית אֵל का शाब्दिक अर्थ पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם
  choice: उसने ... का नाम ... रखा
  rationale: हिब्रानी मुहावरे ‘नाम पुकारा’ का स्वाभाविक आधुनिक हिन्दी रूप ‘नाम रखा’ है; इससे नामकरण की क्रिया स्पष्ट रहती है।
- source_word: הַמָּקוֹם הַהוּא
  choice: उस स्थान
  rationale: מקום का सीधा अर्थ ‘स्थान’ है और संकेतवाचक הַהוּא को ‘उस’ से व्यक्त किया गया है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: स्थान-नाम को मुख्य पाठ में अर्थानुवाद करने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है; उसका अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְאוּלָם
  choice: पर
  rationale: यह अव्यय पहले कथन के साथ विरोधात्मक/स्पष्टीकरणात्मक संबंध दिखाता है; ‘पर’ संक्षिप्त और स्वाभाविक है।
- source_word: לוּז
  choice: लूज़
  rationale: व्यक्तिवाचक स्थान-नाम का मूल उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: שֵׁם הָעִיר
  choice: उस नगर का नाम
  rationale: हिब्रानी संबंधसूचक रचना को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है; संदर्भगत नगर के लिए ‘उस’ जोड़ा गया है।
- source_word: לָרִאשֹׁנָה
  choice: पहले
  rationale: यहाँ शब्द नगर के पूर्व नाम की ओर संकेत करता है; ‘पहले’ आधुनिक हिन्दी में सहज रूप से वही कालगत अर्थ देता है।
