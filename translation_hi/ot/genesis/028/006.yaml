  text: וַ/יַּ֣רְא עֵשָׂ֗ו כִּֽי בֵרַ֣ךְ יִצְחָק֮ אֶֽת יַעֲקֹב֒ וְ/שִׁלַּ֤ח אֹת/וֹ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם לָ/קַֽחַת ל֥/וֹ מִ/שָּׁ֖ם אִשָּׁ֑ה בְּ/בָרֲכ֣/וֹ אֹת֔/וֹ וַ/יְצַ֤ו עָלָי/ו֙ לֵ/אמֹ֔ר לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/006.yaml
  text: Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to take a wife for himself from there[a], and that when he blessed him, he commanded him, saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: hi
  text: 'एसाव ने देखा कि इसहाक ने याकूब को आशीर्वाद दिया था और उसे अपने लिए वहाँ से पत्नी लेने के लिए पद्दन-अराम भेजा था, और यह भी कि उसे आशीर्वाद देते समय उसने उसे यह आज्ञा दी थी: “तू कनान की बेटियों[a] में से पत्नी न लेना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कनानी स्त्रियों में से।” इब्रानी में शाब्दिक रूप से “कनान की बेटियों में से” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא עֵשָׂו
  choice: एसाव ने देखा
  rationale: ראה का कथात्मक रूप घटनाक्रम को आगे बढ़ाता है। हिन्दी में बिना अतिरिक्त ‘तब’ या ‘अब’ के सरल भूतकाल स्वाभाविक है और स्रोत में न पाया जाने वाला कालसूचक शब्द नहीं जोड़ता।
- source_word: כִּי בֵרַךְ יִצְחָק אֶת־יַעֲקֹב
  choice: कि इसहाक ने याकूब को आशीर्वाद देकर
  rationale: כִּי को बोध-वाचक ‘कि’ से व्यक्त किया गया है। आगे भेजने की क्रिया के साथ पूर्ववर्ती आशीर्वाद को हिन्दी के संयुक्त क्रियारूप ‘आशीर्वाद देकर’ में स्वाभाविक ढंग से रखा गया है।
- source_word: וְשִׁלַּח אֹתוֹ פַּדֶּנָה אֲרָם
  choice: उसे ... पद्दन-अराम भेजा था
  rationale: भेजना एसाव के देखने से पहले हो चुका था, इसलिए ‘भेजा था’ सापेक्ष पूर्वकाल स्पष्ट करता है। स्थाननाम का लिप्यंतरण किया गया है।
- source_word: לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  choice: अपने लिए वहाँ से पत्नी लेने को
  rationale: उद्देश्यवाचक infinitive, לוֹ की आत्मवाचक छाया और מִשָּׁם ‘वहाँ से’—तीनों को बनाए रखा गया है।
- source_word: בְּבָרֲכוֹ אֹתוֹ
  choice: उसे आशीर्वाद देते समय
  rationale: בְּ उपसर्ग यहाँ क्रिया की परिस्थिति अथवा समय बताता है; ‘देते समय’ इस संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיְצַו עָלָיו לֵאמֹר
  choice: यह आज्ञा दी थी
  rationale: צוה की आदेशात्मक शक्ति ‘आज्ञा’ से सुरक्षित है। हिन्दी में आने वाला प्रत्यक्ष कथन ‘कहते हुए’ जैसे अलग उद्धरण-सूचक पद को अनावश्यक बना देता है।
- source_word: לֹא תִקַּח אִשָּׁה
  choice: तू ... किसी को अपनी पत्नी न बनाना
  rationale: द्वितीय पुरुष एकवचन निषेध को पारिवारिक प्रत्यक्ष संबोधन ‘तू’ और निषेधात्मक ‘न बनाना’ से व्यक्त किया गया है; यह आधुनिक हिन्दी में विवाह-संदर्भ को सहजता से बताता है।
- source_word: מִבְּנוֹת כְּנָעַן
  choice: कनान की बेटियों में से
  rationale: इब्रानी मुहावरे का औपचारिक रूप बनाए रखा गया है; आशय कनानी समुदाय की स्त्रियों से है, जिसे पादटिप्पणी स्पष्ट करती है।
