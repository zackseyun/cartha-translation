id: GEN.28.2
reference: Genesis 28:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ק֥וּם לֵךְ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם בֵּ֥יתָ/ה בְתוּאֵ֖ל אֲבִ֣י אִמֶּ֑/ךָ וְ/קַח לְ/ךָ֤ מִ/שָּׁם֙ אִשָּׁ֔ה מִ/בְּנ֥וֹת לָבָ֖ן אֲחִ֥י אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/002.yaml
  text: Arise[a], go to Paddan-aram, to the house of Bethuel, your mother's father, and take for yourself from there a wife from the daughters of Laban, your mother's brother.
translation:
  language: hi
  text: उठ, पद्दन-अराम में अपने नाना बतूएल के घर जा, और वहाँ से अपने लिए अपने मामा लाबान की बेटियों में से एक पत्नी ले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֥וּם
  choice: उठ
  rationale: קום का एकवचन पुल्लिंग आज्ञार्थक रूप है। ‘उठ’ संक्षिप्त, स्वाभाविक और अगले आदेश ‘जा’ के साथ उपयुक्त है।
- source_word: לֵךְ֙
  choice: जा
  rationale: הלך के सामान्य आज्ञार्थक रूप को आधुनिक हिंदी में सीधे ‘जा’ कहना स्वाभाविक है।
- source_word: פַּדֶּ֣נָֽה אֲרָ֔ם
  choice: पद्दन-अराम में
  rationale: दिशासूचक ה स्थान की ओर गति बताता है। हिंदी में ‘में ... जा’ गंतव्य को स्वाभाविक ढंग से व्यक्त करता है; स्थान-नाम का लिप्यंतरण किया गया है।
- source_word: בֵּ֥יתָה בְתוּאֵ֖ל
  choice: बतूएल के घर
  rationale: दिशासूचक रूप बतूएल के घर अथवा घराने की ओर जाने को बताता है। प्रसंग में ‘घर’ स्पष्ट और स्वाभाविक है।
- source_word: אֲבִ֣י אִמֶּ֑ךָ
  choice: अपने नाना
  rationale: शाब्दिक अर्थ ‘तेरी माता का पिता’ है। आधुनिक हिंदी में इसी संबंध का सटीक और सहज शब्द ‘नाना’ है, जिसमें मातृपक्ष स्पष्ट रहता है।
- source_word: וְ/קַח לְ/ךָ֤
  choice: और ... अपने लिए ... ले
  rationale: לקח का अर्थ ‘ले’ है और לְךָ निजी हित या उद्देश्य को ‘अपने लिए’ द्वारा सुरक्षित रखता है।
- source_word: מִ/שָּׁם֙
  choice: वहाँ से
  rationale: מן का स्रोत-बोध स्पष्ट है, इसलिए केवल ‘वहाँ’ के बजाय ‘वहाँ से’ रखा गया है।
- source_word: אִשָּׁ֔ה
  choice: एक पत्नी
  rationale: विवाह के इस प्रसंग में אשה का अभिप्रेत अर्थ सामान्य ‘स्त्री’ नहीं, बल्कि ‘पत्नी’ है।
- source_word: מִ/בְּנ֥וֹת לָבָ֖ן
  choice: लाबान की बेटियों में से
  rationale: מן यहाँ समूह में से चयन का भाव देता है। हिंदी में ‘बेटियों में से’ इस अंशात्मक अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: אֲחִ֥י אִמֶּֽ/ךָ
  choice: अपने मामा
  rationale: शाब्दिक अर्थ ‘तेरी माता का भाई’ है। आधुनिक हिंदी का ‘मामा’ वही विशिष्ट मातृपक्षीय संबंध संक्षेप और स्पष्टता से बताता है।
