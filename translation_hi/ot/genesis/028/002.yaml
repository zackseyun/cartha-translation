translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सीधी किंतु गरिमापूर्ण आज्ञार्थक शैली में रखी गई है। ‘नाना’ और ‘मामा’ हिंदी में मातृपक्षीय संबंध को बिना अस्पष्टता के व्यक्त करते हैं; इसलिए कृत्रिम शाब्दिक पदबंधों की आवश्यकता नहीं पड़ी।
