source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם יַעֲקֹ֜ב בַּ/בֹּ֗קֶר וַ/יִּקַּ֤ח אֶת הָ/אֶ֨בֶן֙ אֲשֶׁר שָׂ֣ם מְרַֽאֲשֹׁתָ֔י/ו וַ/יָּ֥שֶׂם אֹתָ֖/הּ מַצֵּבָ֑ה וַ/יִּצֹ֥ק שֶׁ֖מֶן עַל רֹאשָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/018.yaml
  text: Jacob rose early in the morning[a], took the stone that he had placed at his head, set it up as a pillar[c][b], and poured oil on its top.
translation:
  language: hi
  text: याकूब सुबह तड़के उठा। उसने वह पत्थर लिया जिसे उसने अपने सिरहाने रखा था, उसे एक स्तंभ के रूप में खड़ा किया[a], और उसके ऊपरी सिरे पर तेल उँडेल दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे खड़े किए हुए पत्थर के रूप में स्थापित किया।”
    reason: מַצֵּבָה का अर्थ पत्थर का खड़ा किया हुआ स्तंभ भी हो सकता है।
  - marker: b
    text: शाब्दिक रूप से, “उसके सिर पर।”
    reason: इब्रानी मुहावरे के शाब्दिक रूप को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: सुबह तड़के उठा
  rationale: इब्रानी क्रिया में जल्दी उठने का भाव है और בַּבֹּקֶר समय को स्पष्ट करता है। यह हिंदी में स्वाभाविक रहते हुए दोनों तत्वों को बनाए रखता है।
- source_word: אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו
  choice: जिसे उसने अपने सिरहाने रखा था
  rationale: מְרַאֲשֹׁתָיו सिर के पास की जगह को दर्शाता है। ‘सिरहाने’ स्वाभाविक हिंदी है और ‘सिर के नीचे’ कहकर स्थिति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיָּשֶׂם אֹתָהּ מַצֵּבָה
  choice: उसे एक स्तंभ के रूप में खड़ा किया
  rationale: מַצֵּבָה खड़े किए गए पत्थर या स्तंभ को सूचित करता है। यह अनुवाद वस्तु और उसे खड़ा करने की क्रिया दोनों को स्पष्ट करता है।
- source_word: וַיִּצֹק שֶׁמֶן
  choice: तेल उँडेल दिया
  rationale: मूल पाठ सीधे तेल उँडेलने की क्रिया कहता है। ‘अभिषेक किया’ उसके धार्मिक आशय की व्याख्या होती, इसलिए उसे मुख्य पाठ में नहीं अपनाया गया।
- source_word: עַל רֹאשָׁהּ
  choice: उसके ऊपरी सिरे पर
  rationale: शाब्दिक अर्थ ‘उसके सिर पर’ है, पर पत्थर या स्तंभ के लिए ‘ऊपरी सिरे पर’ स्वाभाविक हिंदी है और स्थान-संबंधी अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: מַצֵּבָה और तेल उँडेलने की संभावित उपासना-संबंधी महत्ता
  choice: याकूब के कार्य को वर्णनात्मक रूप से प्रस्तुत किया गया है
  alternative: ‘स्मारक-पत्थर’ कहना या ‘उसका अभिषेक किया’ लिखना
  rationale: यह पद पत्थर खड़ा करने और उस पर तेल उँडेलने का वर्णन करता है, पर स्वयं इन कार्यों का विस्तृत धार्मिक मूल्यांकन नहीं देता। वर्णनात्मक भाषा बाद के धार्मिक अर्थ या मूल्यांकन को समय से पहले आरोपित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी की क्रमिक क्रियाओं को हिंदी के स्वाभाविक कथात्मक प्रवाह में प्रस्तुत किया गया है; किसी संप्रदायगत या बाद की धार्मिक व्याख्या को मुख्य पाठ में नहीं जोड़ा गया।
