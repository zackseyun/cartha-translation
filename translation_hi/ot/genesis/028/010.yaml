  yaml_path: translation/ot/genesis/028/010.yaml
  text: Jacob departed from Beersheba and went to Haran[a].
translation:
  language: hi
  text: याकूब बेर्शेबा से निकला और हारान की ओर गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘हारान की ओर’; ‘हारान’ के साथ दिशा बताने वाला प्रत्यय लगा है।
    reason: मूल इब्रानी के दिशासूचक रूप को स्पष्ट करना।
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकला
  rationale: יצא का मूल अर्थ किसी स्थान से बाहर निकलना या प्रस्थान करना है। यहाँ ‘बेर्शेबा से निकला’ सहज हिन्दी में स्रोत-स्थान छोड़ने का अर्थ स्पष्ट करता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: इस इब्रानी व्यक्ति-नाम का प्रचलित हिन्दी रूप।
- source_word: מִבְּאֵר שָׁבַע
  choice: बेर्शेबा से
  rationale: מִן स्रोत या आरम्भ-स्थान को दर्शाता है; ‘से’ उसका स्वाभाविक हिन्दी समतुल्य है। בְּאֵר שָׁבַע के लिए प्रचलित हिन्दी नाम ‘बेर्शेबा’ रखा गया है।
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: הלך सामान्यतः जाने या चलने को व्यक्त करता है। प्रसंग में ‘गया’ सीधा और स्वाभाविक अनुवाद है तथा ‘यात्रा की’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: חָרָנָה
  choice: हारान की ओर
  rationale: स्थानवाचक नाम के अंत में लगा दिशासूचक ה गति की दिशा बताता है। ‘हारान की ओर’ इस रूपगत संकेत को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
