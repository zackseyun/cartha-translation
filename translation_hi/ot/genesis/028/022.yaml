language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָ/אֶ֣בֶן הַ/זֹּ֗את אֲשֶׁר שַׂ֨מְתִּי֙ מַצֵּבָ֔ה יִהְיֶ֖ה בֵּ֣ית אֱלֹהִ֑ים וְ/כֹל֙ אֲשֶׁ֣ר תִּתֶּן לִ֔/י עַשֵּׂ֖ר אֲעַשְּׂרֶ֥/נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/022.yaml
  text: And this stone[a], which I have set up as a pillar, will be God’s house[b], and of all that you give me I will surely give a tenth to you.
translation:
  language: hi
  text: और यह पत्थर, जिसे मैंने स्तंभ के रूप में स्थापित किया है, परमेश्वर का घर होगा; और जो कुछ तू मुझे देगा, उसका दसवाँ भाग मैं निश्चय ही तुझे दूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַצֵּבָה
  choice: खंभे के रूप में
  rationale: यह शब्द खड़े किए गए पत्थर या स्मारक-स्तंभ को दर्शाता है। संदर्भ में पत्थर को खड़ा करने की ठोस छवि बनाए रखने के लिए यह सहज और स्पष्ट अभिव्यक्ति है।
- source_word: יִהְיֶה בֵּית אֱלֹהִים
  choice: परमेश्वर का घर होगा
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक अर्थ यही है। इससे पवित्र स्थान का भाव बना रहता है, पर बाद के मंदिर-संबंधी विचार पाठ में नहीं जोड़े जाते।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: निकटवर्ती संदर्भ में यह उसी एक परमेश्वर को सूचित करता है जो याकूब पर प्रकट हुआ था; इसलिए किसी सामान्य देवता का अर्थ उचित नहीं है।
- source_word: תִּתֶּן לִי
  choice: तू मुझे देगा
  rationale: यह प्रतिज्ञा के प्रसंग में सरल और सीधा भावी कथन है। एकवचन संबोधन को भी सुरक्षित रखा गया है।
- source_word: עַשֵּׂר אֲעַשְּׂרֶנּוּ
  choice: उसका दसवाँ भाग मैं निश्चय ही ... दूँगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute की बलात्मकता को ‘निश्चय ही’ से व्यक्त किया गया है। ‘दसवाँ भाग’ आधुनिक पाठक के लिए ‘दशमांश’ से अधिक पारदर्शी है।
- source_word: לָךְ
  choice: तुझे
  rationale: यह प्रतिज्ञा में दिए जाने वाले दसवें भाग के प्राप्तकर्ता को सीधे सूचित करता है।
- source_word: הָאֶבֶן הַזֹּאת אֲשֶׁר שַׂמְתִּי
  choice: यह पत्थर, जिसे मैंने ... खड़ा किया है
  rationale: ‘खड़ा किया है’ से पत्थर को स्तंभ के रूप में स्थापित करने की क्रिया संदर्भानुकूल और स्वाभाविक ढंग से व्यक्त होती है।
theological_decisions:
- issue: पत्थर के विषय में याकूब की प्रतिज्ञा का स्वरूप
  choice: ‘परमेश्वर का घर होगा’—पवित्र स्थान या चिह्न की मूल अभिव्यक्ति को बनाए रखा गया है।
  alternative: पत्थर स्वयं कोई देवालय बन जाता है, अथवा यह सीधे बाद के मंदिर की भविष्यवाणी है।
  rationale: इब्रानी पाठ का कथन सुरक्षित रखा गया है, किंतु तत्कालीन संदर्भ से आगे बढ़कर मंदिर-विज्ञान संबंधी कोई व्याख्या नहीं जोड़ी गई।
- issue: दसवाँ भाग देने की प्रतिज्ञा
  choice: परमेश्वर से प्राप्त सब वस्तुओं का दसवाँ भाग उसे देने की बलयुक्त प्रतिज्ञा।
  alternative: इसे बाद की मूसा-व्यवस्था या कलीसियाई दशमांश-प्रथा की तकनीकी शब्दावली में प्रस्तुत करना।
  rationale: अनुवाद याकूब की व्यक्तिगत मन्नत और मूल पद की बलात्मकता को रखता है, पर बाद की संस्थागत व्यवस्था को उत्पत्ति के इस प्रसंग में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन ‘तू/तुझे’ मूल इब्रानी के एकवचन संबोधन को दर्शाता है और हिंदी बाइबिलीय संदर्भ में अनादर का सूचक नहीं है। परामर्शार्थ दिए गए अंग्रेज़ी पाठ में [a] का स्थान और उसकी टिप्पणी आपस में मेल नहीं खाते थे; इसलिए स्रोत-पाठ से असमर्थित पाद-टिप्पणी नहीं जोड़ी गई।
