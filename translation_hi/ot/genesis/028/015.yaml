source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֜י עִמָּ֗/ךְ וּ/שְׁמַרְתִּ֨י/ךָ֙ בְּ/כֹ֣ל אֲשֶׁר תֵּלֵ֔ךְ וַ/הֲשִׁ֣בֹתִ֔י/ךָ אֶל הָ/אֲדָמָ֖ה הַ/זֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְ/ךָ֔ עַ֚ד אֲשֶׁ֣ר אִם עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר דִּבַּ֖רְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/015.yaml
  text: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
translation:
  language: hi
  text: और देख, मैं तेरे साथ हूँ। तू जहाँ कहीं जाएगा, मैं तेरी रक्षा करूँगा, और तुझे इस भूमि में वापस ले आऊँगा। क्योंकि मैं तुझे तब तक नहीं छोड़ूँगा[a], जब तक वह पूरा न कर दूँ जो मैंने तुझसे कहा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं तुझे त्यागूँगा नहीं।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “जो मैंने तुझसे कहा है”; आशय के अनुसार “जिसकी मैंने तुझसे प्रतिज्ञा की है” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देख
  rationale: यह संवाद-सूचक पद ध्यान आकर्षित करता और दिव्य वाणी की सजीवता बनाए रखता है; आधुनिक हिन्दी में ‘देख’ स्वाभाविक है।
- source_word: אָנֹכִי עִמָּךְ
  choice: मैं तेरे साथ हूँ
  rationale: स्वतंत्र सर्वनाम का बल सहज हिन्दी वाक्य में बना रहता है, और परमेश्वर की उपस्थिति का सीधा आश्वासन सुरक्षित है।
- source_word: וּשְׁמַרְתִּיךָ
  choice: मैं तेरी रक्षा करूँगा
  rationale: שׁמר के रक्षा करने, पहरा देने और देखभाल करने के अर्थ को प्रसंगानुकूल तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: तू जहाँ कहीं जाएगा
  rationale: इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप, जो याकूब के जाने के प्रत्येक स्थान को समेटता है।
- source_word: וַהֲשִׁבֹתִיךָ
  choice: तुझे ... लौटा लाऊँगा
  rationale: שוב के हिफ़ईल रूप की कारकता को स्पष्ट और स्वाभाविक हिन्दी में दर्शाता है।
- source_word: אֶל הָאֲדָמָה הַזֹּאת
  choice: इस भूमि पर
  rationale: אֲדָמָה यहाँ केवल मिट्टी नहीं, उस भौगोलिक भूमि को सूचित करती है जहाँ याकूब उस समय है।
- source_word: לֹא אֶעֱזָבְךָ
  choice: मैं तुझे ... नहीं छोड़ूँगा
  rationale: עזב का व्यापक और आधुनिक हिन्दी अर्थ; ‘त्यागूँगा’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: עַד אֲשֶׁר אִם עָשִׂיתִי
  choice: जब तक ... पूरा न कर दूँ
  rationale: इब्रानी संरचना भावी पूर्णता की सीमा बताती है। हिन्दी की ‘जब तक ... न’ रचना स्वाभाविक है; ‘पूरा’ संदर्भ में कार्य-सिद्धि स्पष्ट करता है।
- source_word: אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  choice: जो मैंने तुझसे कहा है
  rationale: मूल क्रिया ‘कहा/बोला’ है, न कि स्पष्ट रूप से ‘प्रतिज्ञा की’; इसलिए व्याख्यात्मक ‘प्रतिज्ञा’ को मुख्य पाठ में नहीं रखा गया।
theological_decisions:
- issue: ‘जब तक’ के कारण दिव्य उपस्थिति की संभावित समय-सीमा
  choice: मूल की ‘जब तक’ संरचना बनाए रखी गई
  alternative: ‘मैं तुझे कभी नहीं छोड़ूँगा और अपनी कही हर बात पूरी करूँगा’
  rationale: मूल वाक्य प्रतिज्ञा-पूर्ति तक न छोड़ने पर बल देता है; अनंतकालीन अवधि को स्पष्ट रूप से जोड़ना या ‘जब तक’ को हटाना पाठ की वास्तविक अभिव्यक्ति को बदल देता।
- issue: वाचा-संबंधी उपस्थिति और संरक्षण
  choice: उपस्थिति, रक्षा, वापसी और वचन-पूर्ति को सीधे शब्दों में रखा गया
  alternative: बाद के बाइबलीय प्रयोगों से मेल बैठाने के लिए अधिक पारंपरिक या सिद्धान्तपरक शब्दावली
  rationale: अनुवाद याकूब को दिए गए आश्वासन का धर्मवैज्ञानिक भार बनाए रखता है, पर बाद की धर्मवैज्ञानिक व्याख्याएँ इसमें नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। याकूब से एकवचन निकट संबोधन के कारण ‘तू/तेरे/तुझे’ रखा गया है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न उपस्थित हैं।
