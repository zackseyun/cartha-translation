id: GEN.28.14
reference: Genesis 28:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֤ה זַרְעֲ/ךָ֙ כַּ/עֲפַ֣ר הָ/אָ֔רֶץ וּ/פָרַצְתָּ֛ יָ֥מָּ/ה וָ/קֵ֖דְמָ/ה וְ/צָפֹ֣נָ/ה וָ/נֶ֑גְבָּ/ה וְ/נִבְרֲכ֥וּ בְ/ךָ֛ כָּל מִשְׁפְּחֹ֥ת הָ/אֲדָמָ֖ה וּ/בְ/זַרְעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/014.yaml
  text: Your offspring will be like the dust of the earth[a], and you will spread out to the west and to the east and to the north and to the south; and in you and in your offspring all the families of the earth will be blessed.
translation:
  language: hi
  text: तेरा वंश पृथ्वी की धूल के समान होगा, और तू पश्चिम, पूर्व, उत्तर और दक्षिण की ओर फैल जाएगा; और तुझ में और तेरे वंश में पृथ्वी के सारे कुल आशीष पाएँगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी के सारे कुल तुझ में और तेरे वंश में अपने लिए आशीष कहेंगे।” इब्रानी क्रिया का आत्मवाचक या मध्यवाचक अर्थ भी सम्भव है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה זַרְעֲךָ
  choice: तेरा वंश ... होगा
  rationale: זֶרַע एक सामूहिक एकवचन है, जो संतान या वंशजों के पूरे समुदाय को सूचित कर सकता है। ‘वंश’ आधुनिक हिन्दी में स्वाभाविक है और सामूहिक भाव बनाए रखता है।
- source_word: כַּעֲפַר הָאָרֶץ
  choice: पृथ्वी की धूल के समान
  rationale: यह उपमा असंख्य होने का भाव व्यक्त करती है। הָאָרֶץ को इस व्यापक प्रतिज्ञा-संदर्भ में ‘पृथ्वी’ कहना उपयुक्त है।
- source_word: וּפָרַצְתָּ
  choice: तू ... फैल जाएगा
  rationale: פרץ में फूट निकलने या सीमाएँ तोड़कर बढ़ने का चित्र है; दिशाओं के साथ ‘फैल जाएगा’ भौगोलिक विस्तार को सहज और स्पष्ट रूप में व्यक्त करता है।
- source_word: יָמָּה וָקֵדְמָה וְצָפֹנָה וָנֶגְבָּה
  choice: पश्चिम, पूर्व, उत्तर और दक्षिण की ओर
  rationale: दिशासूचक ה प्रत्यय गति या विस्तार की दिशा बताता है। चारों दिशाओं को प्रचलित हिन्दी क्रम और स्पष्ट दिशा-बोध के साथ प्रस्तुत किया गया है।
- source_word: וְנִבְרֲכוּ
  choice: आशीष पाएँगे
  rationale: ברך का निफ़अल रूप यहाँ स्वाभाविक रूप से कर्मवाच्य अर्थ देता है। ‘आशीष पाएँगे’ हिन्दी में ‘आशीषित होंगे’ से अधिक सहज है, जबकि सम्भव आत्मवाचक/मध्यवाचक अर्थ पादटिप्पणी में रखा गया है।
- source_word: בְךָ ... וּבְזַרְעֶךָ
  choice: तुझ में और तेरे वंश में
  rationale: दोनों स्थानों पर בְּ का समान रूप ‘में’ रखकर इब्रानी प्रतिज्ञा-सूत्र की संरचना और उसकी अर्थगत खुली सम्भावना सुरक्षित रखी गई है; ‘तेरे द्वारा’ अधिक व्याख्यात्मक होता।
- source_word: כָּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: पृथ्वी के सारे कुल
  rationale: מִשְׁפָּחוֹת बड़े पारिवारिक समूहों या कुलों को दर्शाता है। ‘कुल’ संक्षिप्त, प्रतिष्ठित और व्यापक पारिवारिक अर्थ वाला शब्द है; הָאֲדָמָה का यहाँ सार्वभौमिक विस्तार ‘पृथ्वी’ से स्पष्ट होता है।
theological_decisions:
- issue: पितृकालीन प्रतिज्ञा में נברכו का अर्थ
  choice: 'कर्मवाच्य: ‘पृथ्वी के सारे कुल आशीष पाएँगे’'
  alternative: 'आत्मवाचक/मध्यवाचक: ‘पृथ्वी के सारे कुल अपने को धन्य मानेंगे’'
  rationale: निफ़अल रूप कर्मवाच्य अर्थ दे सकता है और इस प्रतिज्ञा-सूत्र में वही मुख्य पाठ के लिए सीधा विकल्प है। फिर भी आत्मवाचक या मध्यवाचक अर्थ सम्भव होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर द्वारा याकूब को सीधे सम्बोधन के कारण ‘तेरा/तू’ का प्रयोग किया गया है। वाक्य की समानांतर इब्रानी संरचना और प्रतिज्ञा का सामूहिक भाव यथासम्भव बनाए रखा गया है।
