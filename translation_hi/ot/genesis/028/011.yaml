  yaml_path: translation/ot/genesis/028/011.yaml
  text: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
translation:
  language: hi
  text: वह एक स्थान पर पहुँचा और वहीं रात बिताई[a], क्योंकि सूर्य डूब चुका था। उसने उस स्थान के पत्थरों में से कुछ पत्थर लिए[b], उन्हें अपने सिरहाने रखा[c], और उस स्थान पर लेट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में पहली बार भी शाब्दिक रूप से ‘उस स्थान’ है; स्वाभाविक हिन्दी में ‘एक स्थान’ किया गया है, जबकि आगे की कथा में यह स्थान विशेष महत्त्व रखता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उस स्थान के पत्थरों में से लिया।’ हिब्रू में ‘पत्थर’ बहुवचन है और रचना का अर्थ ‘पत्थरों में से’ या ‘कुछ पत्थर’ हो सकता है। संदर्भ के आधार पर कुछ अनुवाद इसे एक पत्थर समझते हैं।
    reason: alternative_reading
  - marker: c
    text: या, ‘अपने सिर के नीचे रखा।’ हिब्रू शब्द सिर की जगह या सिरहाने को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגַּע בַּמָּקוֹם
  choice: एक स्थान पर पहुँचा
  rationale: यात्रा के इस प्रसंग में פגע עם ב का अर्थ किसी स्थान तक पहुँचना है। हिब्रू में निश्चित पदबंध ‘उस स्थान’ है, किंतु पहली बार उल्लेख होने पर स्वाभाविक हिन्दी में ‘एक स्थान’ उपयुक्त है; आगे की कथा उसका महत्त्व स्पष्ट करती है।
- source_word: וַיָּלֶן שָׁם
  choice: वहीं रात बिताई
  rationale: לון का अर्थ रात भर ठहरना है। ‘रात बिताई’ आधुनिक हिन्दी में स्वाभाविक है, और ‘वहीं’ स्थान-संबंध बनाए रखता है।
- source_word: כִּי בָא הַשֶּׁמֶשׁ
  choice: क्योंकि सूर्य डूब चुका था
  rationale: सूर्य के साथ בוא सूर्यास्त का मुहावरा है। ‘डूब चुका था’ उसके रुकने से पहले पूरी हुई परिस्थिति और कारण दोनों व्यक्त करता है।
- source_word: וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם
  choice: उस स्थान के पत्थरों में से एक पत्थर लिया
  rationale: बहुवचन ‘पत्थरों’ के साथ מִן को अंशवाचक मानकर ‘में से एक’ किया गया है। यह निकट संदर्भ के एक पत्थर वाले सामान्य बोध को स्पष्ट करता है, जबकि वैकल्पिक बहुवचन समझ को पादटिप्पणी में रखा गया है।
- source_word: מְרַאֲשֹׁתָיו
  choice: अपने सिरहाने
  rationale: यह शब्द सिर की जगह अथवा सिरहाने के क्षेत्र को बताता है। ‘सिरहाने रखा’ पत्थर की स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है और ‘सिर के नीचे’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: וַיִּשְׁכַּב
  choice: लेट गया
  rationale: שכב यहाँ लेटने की क्रिया बताता है; ‘सो गया’ मूल से अधिक कहता।
- source_word: בַּמָּקוֹם הַהוּא
  choice: उस स्थान पर
  rationale: स्थान की पुनरावृत्ति कथा में उसके महत्त्व को उभारती है, इसलिए केवल ‘वहीं’ कहकर इसे हटाया नहीं गया।
