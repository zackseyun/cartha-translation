  edition: WLC
  text: וַ/יִּירָא֙ וַ/יֹּאמַ֔ר מַה נּוֹרָ֖א הַ/מָּק֣וֹם הַ/זֶּ֑ה אֵ֣ין זֶ֗ה כִּ֚י אִם בֵּ֣ית אֱלֹהִ֔ים וְ/זֶ֖ה שַׁ֥עַר הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/017.yaml
  text: And he was afraid and said[a], “How awesome this place is! This is none other than the house of God[b], and this is the gate of heaven.”
translation:
  language: hi
  text: और वह डर गया और बोला[a], “यह स्थान कितना विस्मयकारी है[b]! यह परमेश्वर का भवन ही है, और यही स्वर्ग का द्वार है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह भयभीत हुआ और बोला।”
    reason: lexical_alternative
  - marker: b
    text: या, “यह स्थान कितना भयावह है!” इब्रानी शब्द भय, आतंक, या श्रद्धामिश्रित विस्मय का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “आकाशों का द्वार।” इब्रानी शब्द का रूप बहुवचन है, पर यहाँ वह दिव्य लोक को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: वह डर गया
  rationale: यह ירא के कथात्मक रूप को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और याकूब की वास्तविक भय-प्रतिक्रिया को केवल श्रद्धा बनाकर सीमित नहीं करता।
- source_word: מַה נּוֹרָא
  choice: कितना विस्मयकारी
  rationale: נוֹרָא में भय, श्रद्धामिश्रित विस्मय और पवित्र आतंक की अर्थ-छायाएँ हैं। ‘विस्मयकारी’ आधुनिक, गरिमापूर्ण हिन्दी में इस व्यापकता को अपेक्षाकृत सुरक्षित रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַמָּקוֹם הַזֶּה
  choice: यह स्थान
  rationale: इब्रानी संकेतवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אֵין זֶה כִּי אִם
  choice: यह निश्चय ही
  rationale: यह मुहावरा प्रबल निषेधात्मक पहचान व्यक्त करता है। ‘निश्चय ही’ हिन्दी में उसके गंभीर बल को स्वाभाविक ढंग से प्रकट करता है।
- source_word: בֵּית אֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: सम्बन्धवाचक इब्रानी पदबंध का पारदर्शी रूप; ‘भवन’ पवित्र और गरिमापूर्ण है, पर यहाँ पहले से निर्मित मंदिर होने का अनावश्यक संकेत नहीं देता।
- source_word: שַׁעַר הַשָּׁמָיִם
  choice: स्वर्ग का द्वार
  rationale: שָׁמַיִם का रूप व्याकरणतः बहुवचन/द्विवचन-सदृश है, पर इस प्रसंग में हिन्दी का एकवचन ‘स्वर्ग’ दिव्य लोक के लिए स्वाभाविक है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: एकवचन सन्दर्भ में אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: देवताओं
  rationale: रूप की दृष्टि से शब्द बहुवचन है, किन्तु दर्शन और वाचा के निकटवर्ती सन्दर्भ में यह याकूब के एक परमेश्वर को सूचित करता है; इसलिए एकवचन आवश्यक है।
- issue: पवित्र उपस्थिति के प्रसंग में נוֹרָא की अर्थ-छाया
  choice: विस्मयकारी
  alternative: भयावह
  rationale: पद में केवल आतंक या केवल श्रद्धा नहीं, बल्कि भय और श्रद्धामिश्रित विस्मय दोनों की सम्भावना है। मुख्य पाठ में ‘विस्मयकारी’ और पादटिप्पणी में ‘भयावह’ देकर इस तनाव को सुरक्षित रखा गया है।
- issue: אֵין זֶה כִּי אִם की प्रबल पहचान
  choice: यह निश्चय ही परमेश्वर का भवन है
  alternative: यह परमेश्वर के भवन के सिवा और कुछ नहीं
  rationale: चुना हुआ रूप आधुनिक हिन्दी में अधिक सहज है और कथन की दृढ़ पहचान बनाए रखता है; विकल्प मूल की निषेधात्मक संरचना के अधिक निकट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘डर गया’ सामान्य पाठक के लिए स्वाभाविक है; ‘विस्मयकारी’ पवित्र भय और श्रद्धा के तनाव को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
