  text: and that Jacob listened to his father and his mother[a], and went to Paddan-aram.
translation:
  language: hi
  text: और यह कि याकूब ने अपने पिता और अपनी माता की बात मानी[a] और पद्दन-अराम चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पिता और अपनी माता की सुनी।” यहाँ इब्रानी क्रिया का अर्थ संदर्भ में सुनना और बात मानना—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: बात मानी
  rationale: שׁמע के साथ אֶל यहाँ केवल सुनने नहीं, बल्कि माता-पिता की बात पर ध्यान देकर उसके अनुसार चलने का भाव रखता है। ‘बात मानी’ आधुनिक हिन्दी में इस संदर्भ का स्वाभाविक रूप है; पादटिप्पणी ‘सुनी’ की शाब्दिक संभावना सुरक्षित रखती है।
- source_word: אֶל אָבִיו וְאֶל אִמּוֹ
  choice: अपने पिता और अपनी माता की
  rationale: दोनों संबंधसूचक प्रत्ययों और दोहराए गए אֶל को हिन्दी में स्वाभाविक समन्वित पदबंध से व्यक्त किया गया है; ‘अपनी’ की पुनरावृत्ति दोनों माता-पिता को स्पष्ट रखती है।
- source_word: וַיֵּלֶךְ
  choice: चला गया
  rationale: הלך का सरल कथात्मक अर्थ ‘जाना’ है। गंतव्य की ओर प्रस्थान के लिए ‘चला गया’ सहज आधुनिक हिन्दी है।
- source_word: פַּדֶּנָה אֲרָם
  choice: पद्दन-अराम
  rationale: यह स्थान-नाम है, इसलिए इसका अनुवाद न करके देवनागरी में लिप्यंतरण किया गया है। ה־ दिशासूचक प्रत्यय का भाव ‘चला गया’ और स्थान-नाम की वाक्यगत भूमिका से व्यक्त होता है।
- source_word: וַ
  choice: और
  rationale: यह पूर्ववर्ती कथन से जुड़े आश्रित कथात्मक क्रम को आगे बढ़ाता है; ‘और यह कि’ उस वाक्य-संबंध को सुरक्षित रखता है।
