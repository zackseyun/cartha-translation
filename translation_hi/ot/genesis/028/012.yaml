  text: וַֽ/יַּחֲלֹ֗ם וְ/הִנֵּ֤ה סֻלָּם֙ מֻצָּ֣ב אַ֔רְצָ/ה וְ/רֹאשׁ֖/וֹ מַגִּ֣יעַ הַ/שָּׁמָ֑יְמָ/ה וְ/הִנֵּה֙ מַלְאֲכֵ֣י אֱלֹהִ֔ים עֹלִ֥ים וְ/יֹרְדִ֖ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/012.yaml
  text: And he dreamed[a], and behold, a ladder was set up on the earth, and its top reached to heaven; and behold[b], the angels of God were ascending and descending on it.
translation:
  language: hi
  text: 'और उसने स्वप्न देखा: देखो, एक सीढ़ी[a] धरती पर खड़ी थी और उसका सिरा आकाश तक पहुँच रहा था; और देखो, परमेश्वर के दूत उस पर[b] चढ़ते और उतरते जा रहे थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द चढ़ने-उतरने की एक संरचना को दर्शाता है; उसकी ठीक बनावट निश्चित नहीं है। इसे सीढ़ीदार मार्ग भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या संभवतः, “याकूब पर”; फिर भी संदर्भ में इसका सबसे स्वाभाविक संबंध सीढ़ी से है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּחֲלֹם
  choice: और उसने स्वप्न देखा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; यह अनुवाद इब्रानी कथात्मक क्रम को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: यह अव्यय स्वप्न के दृश्य को सजीव और आकस्मिक रूप से सामने लाता है; दोनों occurrences में इसकी आलंकारिक शक्ति रखी गई है।
- source_word: סֻלָּם
  choice: सीढ़ी
  rationale: इब्रानी शब्द चढ़ने-उतरने की किसी संरचना को बताता है और अनिवार्यतः पायदानों वाली संकरी निसैनी तक सीमित नहीं है; हिन्दी ‘सीढ़ी’ अपेक्षाकृत व्यापक और सहज है।
- source_word: מֻצָּב אַרְצָה
  choice: धरती पर खड़ी थी
  rationale: निफ़अल कृदन्त किसी वस्तु के स्थापित या स्थित होने की अवस्था व्यक्त करता है; ‘धरती पर खड़ी थी’ दृश्य को स्वाभाविक हिन्दी में प्रस्तुत करता है और आकाश के साथ ब्रह्मांडीय विरोध बनाए रखता है।
- source_word: וְרֹאשׁוֹ מַגִּיעַ הַשָּׁמָיְמָה
  choice: और उसका सिरा आकाश तक पहुँच रहा था
  rationale: वस्तु के लिए רֹאשׁ का स्वाभाविक अर्थ ‘सिरा’ है; कृदन्त מַגִּיעַ दृश्य में जारी विस्तार को दर्शाता है, जिसे ‘पहुँच रहा था’ व्यक्त करता है।
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: परमेश्वर के दूत
  rationale: מַלְאָךְ का मूल अर्थ ‘दूत’ है; इस स्वप्न-दृश्य में ये अलौकिक दूत हैं। हिन्दी बाइबलीय प्रयोग में ‘परमेश्वर के दूत’ अर्थपूर्ण, परिचित और अनावश्यक व्याख्या से मुक्त है।
- source_word: עֹלִים וְיֹרְדִים
  choice: चढ़ और उतर रहे थे
  rationale: दोनों कृदन्त स्वप्न में चल रही गति दिखाते हैं; हिन्दी का अपूर्ण भूतकाल उस निरंतर दृश्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בּוֹ
  choice: उस पर
  rationale: पुल्लिंग एकवचन प्रत्यय का निकटतम स्वाभाविक पूर्वपद סֻלָּם है। फिर भी हिन्दी ‘उस पर’ इब्रानी की सर्वनामिक अभिव्यक्ति को बनाए रखता है और वैकल्पिक संदर्भ को पादटिप्पणी में दर्ज करने देता है।
theological_decisions:
- issue: סֻלָּם की दृश्य-कल्पना
  choice: सीढ़ी
  alternative: निसैनी; सीढ़ीदार मार्ग
  rationale: यह दुर्लभ इब्रानी शब्द चढ़ने की संरचना बताता है, पर उसकी ठीक बनावट निश्चित नहीं करता। ‘सीढ़ी’ आधुनिक हिन्दी में पर्याप्त व्यापक है; पादटिप्पणी वास्तविक शब्दार्थगत अनिश्चितता को सुरक्षित रखती है।
- issue: בּוֹ का संदर्भ
  choice: उस पर—संदर्भतः सीढ़ी
  alternative: उस पर—अर्थात याकूब पर या उसके ऊपर
  rationale: निकटतम और सर्वाधिक स्वाभाविक पूर्वपद सीढ़ी है, किंतु इब्रानी पुल्लिंग एकवचन सर्वनाम को कुछ लोग याकूब से जोड़ते हैं। मुख्य पाठ सहज अर्थ देता है और पादटिप्पणी वैकल्पिक समझ को बिना किसी बाद की धर्मवैज्ञानिक व्याख्या थोपे सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर अपनाया गया है। ‘देखो’ को दोनों बार रखकर וְהִנֵּה की दृश्यात्मक शक्ति बचाई गई है। ‘स्वप्न’ और ‘परमेश्वर के दूत’ सामान्य पाठकों के लिए परिचित बाइबलीय शब्दावली हैं; वाक्य-संरचना इब्रानी क्रम के निकट रहते हुए हिन्दी में प्रवाहपूर्ण है।
