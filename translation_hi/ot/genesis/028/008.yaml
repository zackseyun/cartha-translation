  text: तब एसाव ने देखा कि कनान की बेटियाँ उसके पिता इसहाक की दृष्टि में अप्रिय थीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुरी थीं” या “अच्छी नहीं थीं।” इब्रानी विशेषण का अर्थ “बुरी” हो सकता है, पर “की दृष्टि में” के साथ यहाँ संभवतः आशय यह है कि इसहाक कनान की इन स्त्रियों को विवाह-संबंध के लिए अनुकूल नहीं मानते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: तब ... ने देखा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है और ראה का सामान्य अर्थ ‘देखना’ है। ‘तब’ हिन्दी में कथानक की प्रगति स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: כִּי
  choice: कि
  rationale: यहाँ यह एसाव द्वारा देखी या समझी गई बात की विषयवस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: רָעוֹת
  choice: बुरी थीं
  rationale: यह मूल विशेषण के ‘बुरा/दुष्ट’ अर्थ को सीधे सुरक्षित रखता है; इस प्रसंग में वाक्यांश बताता है कि इसहाक उन्हें विवाह-संबंध के लिए प्रतिकूल मानते थे।
- source_word: בְּנוֹת כְּנָעַן
  choice: कनान की बेटियाँ
  rationale: इब्रानी अभिव्यक्ति की पारिवारिक और जातीय संरचना को निकटता से बनाए रखता है और हिन्दी में बोधगम्य है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: ‘आँखों में’ की अपेक्षा यह मूल्यांकन दर्शाने वाले इब्रानी मुहावरे का स्वाभाविक, गरिमापूर्ण हिन्दी रूप है।
- source_word: יִצְחָק אָבִיו
  choice: उसके पिता इसहाक
  rationale: सर्वनाम-संबंध को स्पष्ट रखते हुए आधुनिक हिन्दी की स्वाभाविक शब्द-व्यवस्था अपनाई गई है।
