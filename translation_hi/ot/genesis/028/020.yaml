base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/020.yaml
  text: Then Jacob made a vow[a], saying, “If God will be with me and will keep me on this way that I am going[d][c][b], and will give me bread to eat and clothing to wear,”
translation:
  language: hi
  text: तब याकूब ने यह कहते हुए मन्नत मानी, “यदि परमेश्वर मेरे साथ रहेगा, मेरी इस यात्रा में मेरी रक्षा करेगा, और मुझे खाने के लिए रोटी और पहनने के लिए वस्त्र देगा,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּדַּר יַעֲקֹב נֶדֶר
  choice: याकूब ने ... एक मन्नत मानी
  rationale: क्रिया और सजातीय संज्ञा मिलकर मन्नत मानने की औपचारिक क्रिया व्यक्त करती हैं; यह हिंदी में स्वाभाविक और गंभीर अभिव्यक्ति है।
- source_word: לֵאמֹר
  choice: यह कहते हुए
  rationale: मन्नत की विषयवस्तु का परिचय देने वाली हिब्रू अभिव्यक्ति को सहज हिंदी में रखा गया है।
- source_word: אִם
  choice: यदि
  rationale: हिब्रू की वास्तविक शर्त को बनाए रखता है और याकूब के विश्वास या संदेह का निर्णय अनुवाद में नहीं करता।
- source_word: אֱלֹהִים עִמָּדִי
  choice: परमेश्वर मेरे साथ रहेगा
  rationale: संदर्भ में इस्राएल के परमेश्वर का उल्लेख है और संबंधसूचक अर्थ सीधा रखा गया है।
- source_word: וּשְׁמָרַנִי
  choice: मेरी रक्षा करेगा
  rationale: שׁמר यहाँ यात्रा में निगरानी और सुरक्षा का भाव देता है; 'रक्षा करेगा' आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ
  choice: जिस मार्ग पर मैं जा रहा हूँ उसमें
  rationale: मूल के 'इस मार्ग' और चलने की सापेक्ष उपवाक्य संरचना को निकटता से रखते हुए हिंदी वाक्यक्रम के अनुसार व्यक्त किया गया है।
- source_word: וְנָתַן לִי לֶחֶם לֶאֱכֹל
  choice: मुझे खाने के लिए रोटी ... देगा
  rationale: לֶחֶם का प्रत्यक्ष अर्थ 'रोटी' बनाए रखा गया है; संदर्भ में यह भोजन का व्यापक संकेत भी दे सकता है।
- source_word: וּבֶגֶד לִלְבֹּשׁ
  choice: पहनने के लिए वस्त्र
  rationale: मूल के उद्देश्यसूचक वाक्यांश को स्पष्ट और गरिमापूर्ण हिंदी में रखा गया है।
theological_decisions:
- issue: याकूब की शर्तयुक्त मन्नत का स्वरूप
  choice: '''यदि'' के साथ वास्तविक शर्त को यथावत रखना'
  alternative: '''जब'' अथवा ''क्योंकि'' द्वारा इसे निश्चित आश्वासन बनाना'
  rationale: אִם सामान्यतः शर्त व्यक्त करता है। अनुवाद यह तय नहीं करता कि याकूब संदेह, परीक्षा या विश्वासपूर्ण अपेक्षा से बोल रहा था।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण पर सामान्य पाठक के लिए सहज। 'मन्नत मानी' बाइबिलीय प्रतिज्ञा के औपचारिक भाव के लिए प्रचलित है। पद 21 में वाक्य पूरा होने के कारण अंतिम विराम के स्थान पर अल्पविराम रखा गया है।
