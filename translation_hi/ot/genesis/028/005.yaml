base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/005.yaml
  text: So Isaac sent Jacob away[a], and he went to Paddan-aram, to Laban son of Bethuel the Aramean, the brother of Rebekah, the mother of Jacob and Esau.
translation:
  language: hi
  text: तब इसहाक ने याकूब को विदा किया, और वह पद्दन-अराम में अरामी बतूएल के पुत्र लाबान के पास गया। लाबान रिबका का भाई था, और रिबका याकूब और एसाव की माता थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: विदा किया
  rationale: इस प्रसंग में שׁלח किसी को यात्रा पर भेजने का भाव रखता है; ‘विदा किया’ भेजने और प्रस्थान, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֵּלֶךְ
  choice: और वह ... गया
  rationale: הלך का सामान्य अर्थ ‘जाना’ है; संयोजक वाव को रखकर घटनाओं का क्रम स्पष्ट किया गया है।
- source_word: פַּדֶּנָה אֲרָם
  choice: पद्दन-अराम में
  rationale: यह स्थान-नाम लिप्यंतरित किया गया है। दिशासूचक ה को गन्तव्य के रूप में हिन्दी के ‘में ... गया’ से स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: בֶּן בְּתוּאֵל
  choice: बतूएल के पुत्र
  rationale: हिब्रू संबंधवाचक रचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: הָאֲרַמִּי
  choice: अरामी
  rationale: यह जातीय-भौगोलिक पहचान ‘अरामी’ बताती है; ऐतिहासिक दृष्टि से कम सटीक ‘सीरियाई’ नहीं अपनाया गया।
- source_word: אֲחִי רִבְקָה
  choice: रिबका का भाई
  rationale: हिब्रू संबंधवाचक पदबंध का सहज आधुनिक हिन्दी रूप।
- source_word: אֵם יַעֲקֹב וְעֵשָׂו
  choice: रिबका याकूब और एसाव की माता थी
  rationale: मूल का समानाधिकरण हिन्दी में अलग स्पष्ट वाक्य के रूप में दिया गया है, जिससे संबंधों की पूरी सूचना सुरक्षित रहते हुए वाक्य सहज बनता है।
