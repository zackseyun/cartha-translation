source:
  edition: WLC
  text: וְ/הִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָי/ו֮ וַ/יֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔י/ךָ וֵ/אלֹהֵ֖י יִצְחָ֑ק הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔י/הָ לְ/ךָ֥ אֶתְּנֶ֖/נָּה וּ/לְ/זַרְעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/013.yaml
  text: And behold[a], Yahweh was standing above it, and he said, “I am Yahweh, the God of Abraham your father and the God of Isaac[b]. The land on which you are lying I will give to you and to your offspring.”
translation:
  language: hi
  text: और देखो, याहवे सीढ़ी के ऊपर खड़ा था[a] और उसने कहा, “मैं याहवे हूँ, तुम्हारे पिता अब्राहम का परमेश्वर और इसहाक का परमेश्वर। जिस भूमि पर तुम लेटे हो, उसे मैं तुम्हें और तुम्हारे वंश को दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, यदि सर्वनाम याकूब के लिए है, “उसके पास” या “उसके ऊपर।”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: इब्रानी कथन-सूचक की सजीवता और दृश्य के अचानक खुलने का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: נִצָּב
  choice: खड़ा था
  rationale: कृदन्त रूप दर्शन में जारी अवस्था को व्यक्त करता है; इसलिए साधारण पूर्ण क्रिया की अपेक्षा यह रूप उपयुक्त है।
- source_word: עָלָיו
  choice: उसके ऊपर
  rationale: यह स्वाभाविक रूप से पिछली आयत की सीढ़ी की ओर संकेत कर सकता है, पर हिन्दी सर्वनाम मूल की संदर्भगत अस्पष्टता को भी बनाए रखता है।
- source_word: אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: तुम्हारे पिता अब्राहम का परमेश्वर
  rationale: इब्रानी पदक्रम और पूर्वज के लिए प्रयुक्त व्यापक अर्थ वाले ‘पिता’ को निकटता से सुरक्षित रखता है।
- source_word: הָאָרֶץ
  choice: भूमि
  rationale: प्रतिज्ञा के संदर्भ में यह केवल नीचे की मिट्टी नहीं, दी जाने वाली भूमि को दर्शाता है।
- source_word: שֹׁכֵב עָלֶיהָ
  choice: जिस भूमि पर तुम लेटे हो
  rationale: वर्तमान में जारी क्रिया और עַל के स्थान-संबंध, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְךָ אֶתְּנֶנָּה
  choice: उसे मैं तुम्हें ... दूँगा
  rationale: प्रतिज्ञा के प्रसंग में अपूर्ण क्रिया का भावी अर्थ और स्त्रीलिंग कर्म-प्रत्यय का भूमि से संबंध स्पष्ट करता है।
- source_word: וּלְזַרְעֶךָ
  choice: और तुम्हारे वंश को
  rationale: ‘वंश’ זֶרַע के सामूहिक एकवचन भाव को आधुनिक हिन्दी में स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ व्यक्तिगत नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि से बदले बिना प्रस्तुत करता है।
- issue: עָלָיו के सर्वनाम का संदर्भ
  choice: उसके ऊपर
  alternative: याकूब के पास अथवा याकूब के ऊपर
  rationale: निकटतम पूर्वपद सीढ़ी है, इसलिए मुख्य पाठ उस संभावित संबंध के अनुकूल है; फिर भी मूल की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पिता’ को पूर्वज के व्यापक बाइबिलीय अर्थ में रखा गया है, और ‘वंश’ सामूहिक एकवचन को सुरक्षित करता है।
