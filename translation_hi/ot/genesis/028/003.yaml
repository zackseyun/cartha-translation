source:
  edition: WLC
  text: וְ/אֵ֤ל שַׁדַּי֙ יְבָרֵ֣ךְ אֹֽתְ/ךָ֔ וְ/יַפְרְ/ךָ֖ וְ/יַרְבֶּ֑/ךָ וְ/הָיִ֖יתָ לִ/קְהַ֥ל עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/003.yaml
  text: And may God Almighty bless you[a], and make you fruitful, and multiply you[b], so that you may become an assembly of peoples.
translation:
  language: hi
  text: और सर्वशक्तिमान परमेश्वर[a] तुम्हें आशीष दे, तुम्हें फलवन्त करे और तुम्हारी संख्या बढ़ाए, जिससे तुम अनेक जातियों का समुदाय बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “एल शद्दाय”; परम्परागत अनुवाद: “सर्वशक्तिमान परमेश्वर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: सर्वशक्तिमान परमेश्वर
  rationale: यह प्रचलित और अर्थपूर्ण हिन्दी रूप है, जो אֵל (‘परमेश्वर’) और שַׁדַּי की पारम्परिक शक्ति-सूचक व्याख्या दोनों को व्यक्त करता है; मूल इब्रानी पदनाम पादटिप्पणी में रखा गया है।
- source_word: יְבָרֵךְ
  choice: आशीष दे
  rationale: इस आशीर्वाद के प्रसंग में अपूर्ण क्रिया इच्छासूचक है; ‘आशीष दे’ इस कामना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְיַפְרְךָ
  choice: तुम्हें फलवन्त करे
  rationale: हिफ़ील रूप का कारणवाचक अर्थ सुरक्षित रहता है और वंशवृद्धि के पितृकालीन संदर्भ में यह स्वाभाविक है।
- source_word: וְיַרְבֶּךָ
  choice: तुम्हारी संख्या बढ़ाए
  rationale: हिफ़ील रूप बढ़ोतरी, विशेषतः वंशजों की बहुलता, का भाव देता है; यह हिन्दी में ‘तुम्हें बढ़ाए’ की अपेक्षा अधिक स्पष्ट और स्वाभाविक है।
- source_word: וְהָיִיתָ
  choice: जिससे तुम ... बनो
  rationale: आशीर्वाद-श्रृंखला में यह पूर्ववर्ती क्रियाओं के परिणाम को व्यक्त करता है; ‘जिससे’ उस सम्बन्ध को स्पष्ट करते हुए इच्छासूचक भाव बनाए रखता है।
- source_word: לִקְהַל עַמִּים
  choice: अनेक जातियों का समुदाय
  rationale: ‘समुदाय’ קהל के संगठित समूह के भाव को व्यक्त करता है, और ‘अनेक जातियों’ से עַמִּים का बहुवचन सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय पदनाम אֵל שַׁדַּי का अनुवाद
  choice: सर्वशक्तिमान परमेश्वर
  alternative: एल शद्दाय
  rationale: मुख्य पाठ में पदनाम का अर्थानुवाद सामान्य पाठक के लिए स्पष्ट है; लिप्यन्तर पादटिप्पणी में सुरक्षित है। शद्दाय की व्युत्पत्ति अनिश्चित होने के कारण पादटिप्पणी इसे पारम्परिक अनुवाद बताती है, न कि निर्विवाद शाब्दिक अर्थ।
- issue: לִקְהַל עַמִּים में बहुवचन עַמִּים
  choice: अनेक जातियों का समुदाय
  alternative: लोगों का समुदाय
  rationale: ‘जातियों’ से यह सम्भावना सुरक्षित रहती है कि आशीर्वाद केवल बहुत-से व्यक्तियों की नहीं, अनेक जनसमूहों अथवा जातियों की ओर संकेत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज आशीर्वाद-वाक्य। ‘फलवन्त’ बाइबिलीय संदर्भ में परिचित है, जबकि ‘तुम्हारी संख्या बढ़ाए’ वंशवृद्धि का अर्थ साधारण पाठक के लिए स्पष्ट करता है।
