  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। प्रत्यक्ष वचन में ‘तुम’ प्रसंगानुकूल बहुवचन संबोधन है। विरोधसूचक संबंध को ‘तो’ से व्यक्त किया गया है और इब्रानी ‘और’ की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
