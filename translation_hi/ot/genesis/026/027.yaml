  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ יִצְחָ֔ק מַדּ֖וּעַ בָּאתֶ֣ם אֵלָ֑/י וְ/אַתֶּם֙ שְׂנֵאתֶ֣ם אֹתִ֔/י וַ/תְּשַׁלְּח֖וּ/נִי מֵ/אִתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/027.yaml
  text: Isaac said to them[a], “Why have you come to me, since you hated me and sent me away from among you?”
translation:
  language: hi
  text: इसहाक ने उनसे कहा[a], “तुम मेरे पास क्यों आए हो, जबकि तुमने मुझसे घृणा की और मुझे अपने बीच से भेज दिया था?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तुमने मुझसे घृणा की और मुझे अपने बीच से भेज दिया था।” इब्रानी समुच्चयबोधक का अधिक शाब्दिक अनुवाद “और” हो सकता है, पर यहाँ वह विरोध या परिस्थिति का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יִצְחָק
  choice: इसहाक ने उनसे कहा
  rationale: कथात्मक भूमिका में אמר का सामान्य और स्वाभाविक अनुवाद ‘कहा’ है; אֲלֵהֶם संबोधित व्यक्तियों को ‘उनसे’ के रूप में व्यक्त करता है।
- source_word: מַדּוּעַ בָּאתֶם אֵלָי
  choice: तुम मेरे पास क्यों आए हो?
  rationale: מַדּוּעַ का सीधा अर्थ ‘क्यों’ है। हिंदी का पूर्ण वर्तमान ‘आए हो’ उनके अभी उपस्थित होने और उस आगमन के वर्तमान परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאַתֶּם
  choice: तुमने तो
  rationale: वाव यहाँ केवल जोड़ने के बजाय पिछली शत्रुता और वर्तमान आगमन के बीच विरोध या आश्चर्य सूचित कर सकता है। ‘तो’ इस संबंध को सहज हिंदी में व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: שְׂנֵאתֶם אֹתִי
  choice: तुमने मुझसे घृणा की
  rationale: שנא के प्रबल अर्थ ‘घृणा करना’ को नरम करके केवल ‘विरोध करना’ नहीं बनाया गया।
- source_word: וַתְּשַׁלְּחוּנִי
  choice: मुझे विदा कर दिया था
  rationale: इस प्रसंग में שׁלח किसी को अपने पास से भेज देने को दर्शाता है। ‘विदा कर दिया’ स्पष्ट है और ‘खदेड़ दिया’ जैसी अनावश्यक तीव्रता नहीं जोड़ता।
- source_word: מֵאִתְּכֶם
  choice: अपने बीच से
  rationale: यह पद उनकी संगति अथवा उपस्थिति से अलग किए जाने का सामाजिक अर्थ रखता है; ‘अपने बीच से’ उस अर्थ को बनाए रखता है।
