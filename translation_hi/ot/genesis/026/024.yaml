  text: וַ/יֵּרָ֨א אֵלָ֤י/ו יְהוָה֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֕אמֶר אָנֹכִ֕י אֱלֹהֵ֖י אַבְרָהָ֣ם אָבִ֑י/ךָ אַל תִּירָא֙ כִּֽי אִתְּ/ךָ֣ אָנֹ֔כִי וּ/בֵֽרַכְתִּ֨י/ךָ֙ וְ/הִרְבֵּיתִ֣י אֶֽת זַרְעֲ/ךָ֔ בַּ/עֲב֖וּר אַבְרָהָ֥ם עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/024.yaml
  text: And Yahweh appeared to him that night and said[a], “I am the God of Abraham your father. Do not fear, for I am with you[b], and I will bless you and multiply your offspring for the sake of Abraham my servant.”
translation:
  language: hi
  text: उसी रात याहवे उसे दिखाई दिए और कहा, “मैं तुम्हारे पिता अब्राहम का परमेश्वर हूँ। मत डरो,[a] क्योंकि मैं तुम्हारे साथ हूँ। मैं तुम्हें आशीष दूँगा और मेरे सेवक अब्राहम के कारण तुम्हारे वंश[b] को बहुत बढ़ाऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भयभीत मत हो।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बीज”; इब्रानी शब्द यहाँ सामूहिक अर्थ में वंश या सन्तान को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित ध्वन्यात्मक रूप में रखा गया है।
- source_word: וַיֵּרָא אֵלָיו
  choice: उसे दर्शन दिया
  rationale: यह निफ़अल रूप प्रत्यक्ष प्रकट होने को व्यक्त करता है; यह हिन्दी में स्वाभाविक और गरिमापूर्ण ढंग से उस ईश्वरीय दर्शन को बताता है।
- source_word: בַּלַּיְלָה הַהוּא
  choice: उसी रात
  rationale: यह कालवाचक पद और संकेतवाचक बल दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: אָנֹכִי אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: मैं तुम्हारे पिता अब्राहम का परमेश्वर हूँ
  rationale: यह अब्राहम की पहचान इसहाक के पिता के रूप में स्पष्ट रखते हुए इब्रानी रचना का स्वाभाविक हिन्दी रूप देता है।
- source_word: אַל תִּירָא
  choice: मत डरो
  rationale: निषेधात्मक आज्ञा का सीधा, वर्तमान और सहज हिन्दी रूप।
- source_word: כִּי אִתְּךָ אָנֹכִי
  choice: क्योंकि मैं तुम्हारे साथ हूँ
  rationale: כִּי यहाँ न डरने का आधार देता है; ‘क्योंकि’ उस कारणात्मक संबंध को स्पष्ट रखता है।
- source_word: וּבֵרַכְתִּיךָ
  choice: मैं तुम्हें आशीष दूँगा
  rationale: प्रतिज्ञा के प्रसंग में क्रिया का भावी और आश्वासनात्मक बल स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: וְהִרְבֵּיתִי אֶת זַרְעֲךָ
  choice: तुम्हारे वंश को बहुत बढ़ाऊँगा
  rationale: हिफ़ील क्रिया का ‘बहुत बढ़ाना/बहुसंख्यक करना’ अर्थ और זֶרַע का सामूहिक वंशार्थ दोनों सुरक्षित रहते हैं।
- source_word: בַּעֲבוּר
  choice: के कारण
  rationale: यहाँ यह पद अब्राहम के कारण प्रतिज्ञा पूरी करने के आधार को व्यक्त करता है, बिना अतिरिक्त व्याख्या जोड़े।
- source_word: עַבְדִּי
  choice: अपने दास
  rationale: इस वाचा-संबंधी संदर्भ में ‘दास’ समर्पित सेवा और परमेश्वर से संबंध दोनों को उपयुक्त रूप से व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; उसका लिप्यंतरण नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: בַּעֲבוּר אַבְרָהָם עַבְדִּי में प्रतिज्ञा का आधार
  choice: अपने दास अब्राहम के कारण
  alternative: अपने दास अब्राहम के निमित्त; अपने दास अब्राहम की खातिर
  rationale: यह रूप इसहाक को दी गई आशीष और अब्राहम से परमेश्वर की पूर्व प्रतिबद्धता के बीच संबंध बनाए रखता है, पर उस संबंध की प्रकृति को पाठ से आगे नहीं समझाता।
- issue: זֶרַע का सामूहिक अर्थ
  choice: वंश
  alternative: बीज; सन्तान
  rationale: एकवचन इब्रानी संज्ञा यहाँ सामूहिक रूप से भावी वंशजों को दर्शाती है; ‘वंश’ उस सामूहिकता को स्वाभाविक हिन्दी में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बोलचाल-सुलभ शैली रखी गई है। एक व्यक्ति को संबोधित करते हुए ‘तुम’ के रूप प्रयुक्त हैं, जो आधुनिक हिन्दी में आत्मीय और स्वाभाविक हैं। मुख्य पाठ में प्रत्यक्ष ईश्वरीय आश्वासन और वाचा-संबंधी तनाव को बिना विस्तार या सांप्रदायिक व्याख्या के सुरक्षित रखा गया है।
