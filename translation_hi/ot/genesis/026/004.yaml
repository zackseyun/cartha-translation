source:
  edition: WLC
  text: וְ/הִרְבֵּיתִ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/נָתַתִּ֣י לְ/זַרְעֲ/ךָ֔ אֵ֥ת כָּל הָ/אֲרָצֹ֖ת הָ/אֵ֑ל וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/004.yaml
  text: And I will multiply your offspring like the stars of the heavens[a], and I will give to your offspring all these lands, and in your offspring all the nations of the earth will be blessed.
translation:
  language: hi
  text: मैं तुम्हारी संतान को आकाश के तारों के समान बढ़ाऊँगा और तुम्हारी संतान को ये सभी देश दूँगा; और तुम्हारी संतान में पृथ्वी के सभी राष्ट्र आशीष पाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी के सभी राष्ट्र तुम्हारी संतान के द्वारा अपने को आशीषित करेंगे।” इब्रानी क्रिया को आत्मवाचक अर्थ में भी समझा जा सकता है, यद्यपि वाचा की प्रतिज्ञा के प्रसंग में कर्मवाच्य अर्थ अधिक उपयुक्त बैठता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: मैं ... बहुत बढ़ाऊँगा
  rationale: रבה के हिफ़ील रूप में संख्या बढ़ाने की कारणवाचक क्रिया है। ‘बहुत बढ़ाऊँगा’ आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर की प्रत्यक्ष क्रिया को स्पष्ट रखता है।
- source_word: זַרְעֲךָ
  choice: तुम्हारी संतान
  rationale: זֶרַע सामूहिक एकवचन है और वंशजों अथवा किसी एक वंशज—दोनों की सम्भावना को खुला रख सकता है। ‘संतान’ हिन्दी में स्वाभाविक है और ‘वंशजों’ की अनिवार्य बहुवचनता से बचता है।
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: आकाश के तारों के समान
  rationale: כ की स्पष्ट उपमा को ‘के समान’ से रखा गया है। हिन्दी में ‘आकाश’ स्वाभाविक है; इब्रानी के बहुवचन ‘आकाशों’ का शाब्दिक रूप यहाँ अस्वाभाविक होता।
- source_word: וְנָתַתִּי
  choice: और ... दूँगा
  rationale: נתן का सीधा और सामान्य अर्थ ‘देना’ है; यह वाचा की प्रतिज्ञा की सादगी बनाए रखता है।
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: ये सभी देश
  rationale: बहुवचन אֲרָצוֹת यहाँ प्रतिज्ञात भौगोलिक क्षेत्रों को दर्शाता है और הָאֵל संकेतवाचक ‘ये’ है। ‘देश’ साधारण हिन्दी में स्पष्ट तथा प्रसंगानुकूल है।
- source_word: וְהִתְבָּרֲכוּ
  choice: आशीष पाएँगे
  rationale: कुलपिताओं से जुड़ी प्रतिज्ञा के प्रसंग में कर्मवाच्य अर्थ स्वाभाविक है। फिर भी इब्रानी रूप का आत्मवाचक अर्थ सम्भव होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְזַרְעֲךָ
  choice: तुम्हारी संतान में
  rationale: ב का मूल ‘में’ अर्थ रखा गया है, ताकि माध्यमसूचक ‘के द्वारा’ को मुख्य पाठ में आरोपित न किया जाए और मूल की धार्मिक अर्थ-व्याप्ति बनी रहे।
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: पृथ्वी के सभी राष्ट्र
  rationale: גּוֹיִם जातीय-सामूहिक समुदायों अथवा राष्ट्रों को दर्शाता है। ‘राष्ट्र’ आधुनिक हिन्दी में सटीक और गरिमापूर्ण है।
theological_decisions:
- issue: וְהִתְבָּרֲכוּ בְזַרְעֲךָ में आशीष के सूत्र का अर्थ
  choice: तुम्हारी संतान में पृथ्वी के सभी राष्ट्र आशीष पाएँगे
  alternative: पृथ्वी के सभी राष्ट्र तुम्हारी संतान के द्वारा अपने लिए आशीष चाहेंगे
  rationale: वाचा की प्रतिज्ञा के प्रसंग में कर्मवाच्य अर्थ सुसंगत है, पर हित्पएल रूप आत्मवाचक भी समझा जा सकता है। मुख्य पाठ और पादटिप्पणी दोनों सम्भावनाओं को बिना धार्मिक तनाव मिटाए प्रस्तुत करते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘संतान’ को तीनों स्थानों पर समान रूप से रखा गया है, और अर्धविराम से भूमि की प्रतिज्ञा तथा राष्ट्रों की आशीष के बीच वाक्यगत विभाजन स्पष्ट किया गया है।
