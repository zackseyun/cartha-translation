  yaml_path: translation/ot/genesis/026/026.yaml
  text: Then Abimelech went to him from Gerar[a], with Ahuzzath his friend and Phicol the commander of his army.
translation:
  language: hi
  text: तब अबीमेलेक गरार से उसके पास गया। उसके साथ उसका मित्र अहुज्जत[a] और उसकी सेना का प्रधान पीकोल भी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका साथी”; इस इब्रानी शब्द से निजी मित्र के साथ-साथ निकट सहयोगी या दरबारी सलाहकार भी अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲבִימֶלֶךְ
  choice: तब अबीमेलेक
  rationale: कथात्मक वाव को आधुनिक हिन्दी में घटनाक्रम आगे बढ़ाने वाले ‘तब’ से व्यक्त किया गया; नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया।
- source_word: הָלַךְ אֵלָי/ו מִ/גְּרָר
  choice: गरार से उसके पास गया
  rationale: הלך का मूल अर्थ ‘जाना’ और מן का अर्थ ‘से’ रखा गया है; सर्वनाम ‘उसके’ मूल की अस्पष्टता बनाए रखता है, यद्यपि प्रसंग में उसका संकेत इसहाक की ओर है।
- source_word: וַ/אֲחֻזַּת מֵֽרֵעֵ/הוּ
  choice: उसका मित्र अहुज्जत[a]
  rationale: מֵרֵעֵהוּ का सीधा और स्वाभाविक अर्थ ‘उसका मित्र/साथी’ है। दरबारी प्रसंग में ‘सलाहकार’ संभव है, पर वह पद मूल शब्द में स्पष्ट नहीं; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וּ/פִיכֹל שַׂר צְבָא/וֹ
  choice: उसकी सेना का प्रधान पीकोल
  rationale: שַׂר צְבָאוֹ को आधुनिक, सहज हिन्दी में सैन्य नेतृत्व सूचित करने वाले ‘सेना का प्रधान’ से व्यक्त किया गया।
