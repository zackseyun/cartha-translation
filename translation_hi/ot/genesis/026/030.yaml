    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: तैयार किया
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ है, पर מִשְׁתֶּה के साथ ‘भोज तैयार किया’ स्वाभाविक हिन्दी है और आयोजन करने का भाव ठीक से व्यक्त करता है।
- source_word: לָהֶם
  choice: उनके लिए
  rationale: यहाँ ל कार्य के लाभार्थियों को दर्शाता है; आधुनिक हिन्दी में ‘उनके लिए’ स्वाभाविक है।
- source_word: מִשְׁתֶּה
  choice: भोज
  rationale: यह शब्द ऐसे दावत-भोज को दर्शाता है जिसमें मदिरापान उल्लेखनीय हो सकता है। ‘भोज’ सहज और गरिमापूर्ण है; अगले पदांश में पीने का उल्लेख स्पष्ट है।
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: उन्होंने खाया-पिया
  rationale: संयुक्त हिन्दी क्रिया-प्रयोग दोनों समन्वित कार्यों को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
