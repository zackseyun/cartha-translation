base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/032.yaml
  text: And it happened on that day that Isaac’s servants came and told him about the well that they had dug[a], and they said to him[b], “We have found water.”
translation:
  language: hi
  text: उसी दिन इसहाक के सेवक[a] आए और उन्होंने उसे उस कुएँ के विषय में बताया जिसे उन्होंने खोदा था। उन्होंने उससे कहा, “हमें पानी मिल गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सेवक” का अनुवाद “दास” भी किया जा सकता है, क्योंकि इब्रानी शब्द बंधुआ घरेलू कामगारों के लिए भी प्रयुक्त हो सकता है; इस प्रसंग में वह सामाजिक पक्ष प्रमुख नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: हिब्रू कथात्मक सूत्र और समय-सूचक पद को स्वाभाविक आधुनिक हिन्दी में संक्षेप से व्यक्त करता है; संदर्भ में यह पूर्ववर्ती वाचा की घटनाओं वाले दिन की ओर संकेत करता है।
- source_word: עַבְדֵי יִצְחָק
  choice: इसहाक के सेवक
  rationale: עֶבֶד सेवक या दास का अर्थ दे सकता है; यहाँ घरेलू कामगारों की भूमिका प्रमुख है, इसलिए ‘सेवक’ संदर्भानुकूल है।
- source_word: וַיַּגִּדוּ לוֹ עַל אֹדוֹת הַבְּאֵר
  choice: उन्होंने उसे उस कुएँ के विषय में बताया
  rationale: नגד के हिफ़ील रूप का अर्थ ‘बताना/सूचित करना’ और עַל אֹדוֹת का अर्थ ‘के विषय में’ है; ‘उस कुएँ’ निश्चित उपपद को बनाए रखता है।
- source_word: אֲשֶׁר חָפָרוּ
  choice: जिसे उन्होंने खोदा था
  rationale: सम्बन्धवाचक उपवाक्य कुएँ की पहचान करता है; ‘खोदा था’ रिपोर्ट से पहले पूरी हुई खुदाई को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיֹּאמְרוּ לוֹ
  choice: उन्होंने उससे कहा
  rationale: हिब्रू के स्पष्ट वचन-परिचय को बनाए रखता है; हिन्दी में ‘उससे कहा’ स्वाभाविक है।
- source_word: מָצָאנוּ מָיִם
  choice: हमें पानी मिल गया है
  rationale: शाब्दिक ‘हमने पानी पाया है’ की अपेक्षा यह आधुनिक हिन्दी में खोज की सफलता और उसके वर्तमान परिणाम को अधिक स्वाभाविक ढंग से व्यक्त करता है।
