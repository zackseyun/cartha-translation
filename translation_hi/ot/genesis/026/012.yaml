id: GEN.26.12
reference: Genesis 26:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּזְרַ֤ע יִצְחָק֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יִּמְצָ֛א בַּ/שָּׁנָ֥ה הַ/הִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽ/יְבָרֲכֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/012.yaml
  text: Isaac sowed in that land[a], and in that year he found a hundredfold, and Yahweh blessed him.
translation:
  language: hi
  text: इसहाक ने उस देश में बीज बोया और उसी वर्ष उसे सौ गुना उपज मिली[a]। याहवे ने उसे आशीष दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे सौ माप मिले।” हिब्रू में शाब्दिक रूप से “उसने सौ שְׁעָרִים पाए” है; यह असाधारण रूप से भरपूर उपज के लिए प्रयुक्त कृषि-अभिव्यक्ति है।
    reason: शाब्दिक विकल्प और दुर्लभ हिब्रू अभिव्यक्ति की अनिश्चितता सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּזְרַע
  choice: बीज बोया
  rationale: कृषि-संदर्भ में זרע का सीधा अर्थ बीज बोना है; यह स्वाभाविक हिन्दी में खेती का चित्र स्पष्ट रखता है।
- source_word: בָּאָרֶץ הַהִוא
  choice: उस देश में
  rationale: אֶרֶץ यहाँ उस भूभाग या देश को दर्शाता है जहाँ इसहाक रह रहा था; ‘उस देश में’ आधुनिक हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: וַיִּמְצָא
  choice: उसे … उपज मिली
  rationale: מצא का मूल अर्थ ‘पाना/मिलना’ है। फसल के संदर्भ में ‘उपज मिली’ मूल क्रिया के भाव को रखते हुए हिन्दी में स्वाभाविक है और ‘काटा’ जैसी अधिक विशिष्ट क्रिया नहीं जोड़ता।
- source_word: בַּשָּׁנָה הַהִוא
  choice: उसी वर्ष
  rationale: यह निकटवर्ती बुवाई और उसी वर्ष प्राप्त उपज के संबंध को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֵאָה שְׁעָרִים
  choice: सौ गुना उपज
  rationale: यह कठिन हिब्रू कृषि-अभिव्यक्ति असाधारण मात्रा में प्राप्त फसल को सूचित करती है। ‘सौ गुना उपज’ अर्थ को सहज हिन्दी में व्यक्त करती है, जबकि शाब्दिक अनिश्चितता पाद-टिप्पणी में सुरक्षित है।
- source_word: וַיְבָרֲכֵהוּ
  choice: उसे आशीष दी
  rationale: ברך का सामान्य धार्मिक अर्थ ‘आशीष देना’ है; इससे समृद्धि का कारण परमेश्वर की आशीष बताया जाना बना रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय देवनागरी में प्रतिलिपित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ प्रचलित विद्वत्तापूर्ण उच्चारण को हिन्दी में दर्शाता है और नाम को सुरक्षित रखता है।
- issue: इसहाक की कृषि-प्राप्ति को व्यक्त करना
  choice: उसे सौ गुना उपज मिली
  alternative: उसने सौ गुना पाया; उसने सौ गुना फसल काटी
  rationale: यह चयन מצא के ‘पाने’ वाले भाव और कृषि-संदर्भ दोनों को व्यक्त करता है, बिना यह तय किए कि שְׁעָרִים कोई निश्चित प्राचीन माप था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बीज बोया’ और ‘उपज मिली’ कृषि-संदर्भ को स्पष्ट करते हैं; छोटे वाक्यों से कथन की सरलता और ईश्वरीय आशीष पर अंतिम बल बना रहता है।
