  text: וַ/יָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם רֹעֵ֥י יִצְחָ֛ק לֵ/אמֹ֖ר לָ֣/נוּ הַ/מָּ֑יִם וַ/יִּקְרָ֤א שֵֽׁם הַ/בְּאֵר֙ עֵ֔שֶׂק כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/020.yaml
  text: Then the shepherds of Gerar quarreled with Isaac’s shepherds[a], saying, “The water is ours.” So he named the well Esek, because they had quarreled with him.
translation:
  language: hi
  text: तब गरार के चरवाहों ने इसहाक के चरवाहों से झगड़ा किया। उन्होंने कहा, “पानी हमारा है।” इसलिए उसने उस कुएँ का नाम एसेक[a] रखा, क्योंकि उन्होंने उससे झगड़ा किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “एसेक” नाम इब्रानी में “झगड़े” या “विवाद” के शब्द से मिलता-जुलता है।
    reason: नाम और उससे संबंधित इब्रानी क्रिया के बीच का शब्द-संबंध हिन्दी लिप्यंतरण में स्पष्ट नहीं रहता।
lexical_decisions:
- source_word: וַיָּרִיבוּ
  choice: झगड़ने लगे
  rationale: ריב यहाँ पानी के अधिकार को लेकर हुए विवाद को व्यक्त करता है। ‘झगड़ने लगे’ आधुनिक और स्वाभाविक हिन्दी में कथात्मक क्रिया का भाव स्पष्ट करता है।
- source_word: רֹעֵי גְרָר ... רֹעֵי יִצְחָק
  choice: गरार के चरवाहे ... इसहाक के चरवाहों
  rationale: רֹעִים भेड़-बकरियों अथवा पशुओं की देखभाल करने वालों के लिए प्रयुक्त हो सकता है; पितृकालीन प्रसंग में ‘चरवाहे’ सहज और परिचित शब्द है तथा दोनों पक्षों की समानांतर रचना बनाए रखता है।
- source_word: לָנוּ הַמָּיִם
  choice: पानी हमारा है
  rationale: शाब्दिक संरचना ‘हमारे लिए/हमारा पानी’ स्वामित्व का संक्षिप्त दावा है; ‘पानी हमारा है’ उसकी दृढ़ता और सहज हिन्दी दोनों को सुरक्षित रखता है।
- source_word: וַיִּקְרָא שֵׁם הַבְּאֵר
  choice: उसने उस कुएँ का नाम ... रखा
  rationale: ‘नाम पुकारा’ के इब्रानी मुहावरे को स्वाभाविक हिन्दी के ‘नाम रखा’ से व्यक्त किया गया है।
- source_word: עֵשֶׂק
  choice: एसेक
  rationale: कुएँ के नाम को अर्थानुवाद करने के बजाय लिप्यंतरित किया गया है; उससे जुड़ा विवाद का शब्द-संबंध पादटिप्पणी में बताया गया है।
- source_word: כִּי הִתְעַשְּׂקוּ עִמּוֹ
  choice: क्योंकि उन्होंने उससे झगड़ा किया था
  rationale: यह क्रिया עֵשֶׂק से संबंधित है और विरोध या विवाद का भाव रखती है। ‘उससे’ में एकवचन संकेत स्वाभाविक रूप से इसहाक की ओर जाता है, जबकि बहुवचन कर्ता गरार के चरवाहे हैं।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। छोटे वाक्यों से विवाद और स्वामित्व के दावे की स्पष्टता बनी रहती है; किसी सांप्रदायिक या अतिरिक्त व्याख्या को नहीं जोड़ा गया।
