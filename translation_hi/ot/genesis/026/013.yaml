    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: महान हो गया
  rationale: גדל यहाँ आकार मात्र नहीं, बल्कि समृद्धि, प्रतिष्ठा और सामर्थ्य में बढ़ने का व्यापक भाव रखता है। ‘महान हो गया’ इस व्यापकता और पद में होने वाली पुनरावृत्ति को बनाए रखता है; ‘धनी हो गया’ अर्थ को केवल धन तक सीमित कर देता।
- source_word: הָאִישׁ
  choice: वह पुरुष
  rationale: איש इस प्रसंग में इसहाक को सूचित करने वाला पुल्लिंग एकवचन शब्द है। ‘वह पुरुष’ मूल के लिंग और संकेत को स्पष्ट रूप से बनाए रखता है।
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדֵל
  choice: बढ़ता ही चला गया
  rationale: सीमित क्रिया, धात्वर्थक रूप और कृदन्त का यह संयोजन निरन्तर प्रगति को व्यक्त करने वाला इब्रानी मुहावरा है। हिंदी का ‘बढ़ता ही चला गया’ उसी सतत और क्रमिक वृद्धि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַד כִּי
  choice: यहाँ तक कि
  rationale: यह पदबंध निरन्तर वृद्धि की चरम परिणति प्रस्तुत करता है। ‘यहाँ तक कि’ हिंदी में उस परिणामी सीमा को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: גָדַל מְאֹד
  choice: अत्यन्त महान हो गया
  rationale: מאד पहले से दोहराए गए גדל को तीव्र करता है। ‘अत्यन्त महान’ तीव्रता और ‘महान’ की शाब्दिक पुनरावृत्ति दोनों को सुरक्षित रखता है।
