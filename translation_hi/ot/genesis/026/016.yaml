  yaml_path: translation/ot/genesis/026/016.yaml
  text: Then Abimelech said to Isaac[a], “Go away from us, because you have become much stronger than we are.”
translation:
  language: hi
  text: तब अबीमेलेक ने इसहाक से कहा, “हमसे दूर चले जाओ, क्योंकि तुम हमसे कहीं अधिक शक्तिशाली हो गए हो[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम हमारे मुकाबले बहुत सामर्थी हो गए हो।”
    reason: עָצַם शक्ति, सामर्थ्य या प्रबलता में बढ़ने का भाव दे सकता है; यह वैकल्पिक अनुवाद उसी अर्थ-छाया को सुरक्षित रखता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲבִימֶלֶךְ
  choice: अबीमेलेक
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: יִצְחָק
  choice: इसहाक
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: לֵךְ מֵעִמָּנוּ
  choice: हमसे दूर चले जाओ
  rationale: आज्ञार्थक לֵךְ और अलगाव सूचक מֵעִמָּנוּ को सहज आधुनिक हिन्दी में संयुक्त रूप से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: अबीमेलेक की आज्ञा का कारण स्पष्ट और समकालीन हिन्दी में बताता है।
- source_word: עָצַמְתָּ מִמֶּנּוּ מְאֹד
  choice: तुम हमसे कहीं अधिक शक्तिशाली हो गए हो
  rationale: עָצַם के बलवान या सामर्थी हो जाने के अर्थ, מן की तुलना और מְאֹד की तीव्रता—तीनों को स्वाभाविक हिन्दी में बनाए रखता है।
