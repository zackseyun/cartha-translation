  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में स्पष्ट आज्ञा और उसके कारण का सीधा संबंध सुरक्षित है; ‘शक्तिशाली’ सामाजिक, आर्थिक या सामूहिक सामर्थ्य को अनावश्यक रूप से किसी एक प्रकार की शक्ति तक सीमित नहीं करता।
