base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/029.yaml
  text: that you will do us no harm[a], just as we have not touched you and just as we have done to you only good and sent you away in peace[c][b]. You are now blessed by Yahweh.”
translation:
  language: hi
  text: कि तुम हमारी कोई हानि नहीं करोगे[a], जैसे हमने तुम्हें छुआ तक नहीं[b], और तुम्हारे साथ केवल भलाई ही की और तुम्हें शांति से विदा किया[c]। अब तुम याहवे के द्वारा आशीषित हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम हमारी हानि करोगे।” इब्रानी शब्द का शाब्दिक अर्थ “यदि” हो सकता है, पर यहाँ संभवतः वह इस बात को बताता है जिसकी शपथ इसहाक से माँगी जा रही है।
    reason: lexical_alternative
  - marker: b
    text: “छुआ” का अर्थ इस संदर्भ में “हानि पहुँचाई” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “और हमने तुम्हें कुशल से जाने दिया।”
    reason: translation_alternative
lexical_decisions:
- source_word: אִם
  choice: कि … नहीं करोगे
  rationale: पिछले पद में माँगी गई शपथ की विषय-वस्तु यहाँ आगे बढ़ती है। इसलिए इब्रानी אִם का शाब्दिक ‘यदि’ मुख्य पाठ में रखने के बजाय स्वाभाविक हिन्दी में ‘कि’ रखा गया है; शाब्दिक संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: תַּעֲשֵׂה עִמָּנוּ רָעָה
  choice: तुम हमारा कोई बुरा नहीं करोगे
  rationale: यह वाक्यांश किसी के साथ हानि या बुराई करने को व्यक्त करता है। ‘कोई बुरा नहीं करोगे’ आधुनिक हिन्दी में स्वाभाविक है और अनाक्रमण की वाचा के संदर्भ के अनुकूल है।
- source_word: לֹא נְגַעֲנוּךָ
  choice: हमने तुम्हें छुआ तक नहीं
  rationale: נגע का मूल अर्थ ‘छूना’ है, किंतु संदर्भ में हानि पहुँचाने का भाव भी हो सकता है। ‘तक’ जोड़ने से उनके जोरदार दावे का स्वाभाविक हिन्दी रूप मिलता है, जबकि संभावित अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: עָשִׂינוּ עִמְּךָ רַק טוֹב
  choice: तुम्हारे साथ केवल भलाई की
  rationale: רַק का प्रतिबंधात्मक जोर ‘केवल’ से और טוֹב का नैतिक व संबंधपरक भाव ‘भलाई’ से व्यक्त किया गया है।
- source_word: וַנְּשַׁלֵּחֲךָ בְּשָׁלוֹם
  choice: और तुम्हें शांति से विदा किया
  rationale: ‘विदा किया’ भेज दिए जाने के अर्थ को गरिमापूर्ण, सहज हिन्दी में व्यक्त करता है; ‘शांति से’ सुरक्षित प्रस्थान और शांतिपूर्ण संबंध—दोनों की अनुगूँज बनाए रखता है।
- source_word: בְּרוּךְ יְהוָה
  choice: याहवे से आशीषित
  rationale: בְּרוּךְ निष्क्रिय कृदंत है और उसके बाद आया ईश्वरीय नाम आशीष के स्रोत को बताता है। ‘याहवे से आशीषित’ संक्षिप्त और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसे किसी उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: אִם की शपथ-संबंधी भूमिका
  choice: पिछले पद की माँगी गई शपथ की विषय-वस्तु के रूप में ‘कि’
  alternative: शर्तसूचक ‘यदि’
  rationale: वाक्य पिछले पद की शपथ-विनती को जारी रखता है, इसलिए मुख्य पाठ में स्वाभाविक विषय-वाचक रचना अपनाई गई है; फिर भी इब्रानी की वास्तविक शर्तसूचक संभावना पाद-टिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संवाद के अनुरूप सीधी किंतु गरिमापूर्ण रखी गई है। ‘भलाई,’ ‘शांति,’ ‘आशीषित’ और ‘विदा किया’ जैसे शब्द साधारण पाठक के लिए बोधगम्य रहते हुए वाचा-संबंधी औपचारिकता बनाए रखते हैं।
