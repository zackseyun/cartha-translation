  text: And they rose early in the morning and swore an oath, each man to his brother; then Isaac sent them away[a], and they departed from him in peace.
translation:
  language: hi
  text: और वे सुबह तड़के उठे और उन्होंने एक-दूसरे से शपथ खाई। तब इसहाक ने उन्हें विदा किया, और वे उससे शान्ति से विदा हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: वे भोर को जल्दी उठे
  rationale: שׁכם का हिफ़ील रूप जल्दी उठने का भाव देता है, और בַבֹּקֶר समय को स्पष्ट करता है। यह हिन्दी में स्वाभाविक रहते हुए दोनों तत्वों को बनाए रखता है।
- source_word: וַיִּשָּׁבְעוּ
  choice: उन्होंने ... शपथ खाई
  rationale: שׁבע का निफ़अल रूप शपथ खाने या शपथ लेने को दर्शाता है। ‘शपथ खाई’ औपचारिक और पारस्परिक प्रतिज्ञा का भाव स्पष्ट करता है।
- source_word: אִישׁ לְאָחִיו
  choice: एक-दूसरे से
  rationale: शाब्दिक रूप ‘हर पुरुष अपने भाई से’ है, पर यहाँ यह इब्रानी मुहावरा सम्मिलित पक्षों द्वारा परस्पर शपथ खाने को व्यक्त करता है। हिन्दी में ‘एक-दूसरे से’ वही संबंध स्वाभाविक और स्पष्ट रूप से देता है।
- source_word: וַיְשַׁלְּחֵם
  choice: उन्हें विदा किया
  rationale: पिएल रूप का अर्थ उन्हें जाने देना अथवा रवाना करना है। अतिथि-संधि के इस प्रसंग में ‘विदा किया’ सहज और गरिमापूर्ण है।
- source_word: וַיֵּלְכוּ מֵאִתּוֹ
  choice: वे उसके पास से ... चले गए
  rationale: הלך के साथ מֵאֵת किसी व्यक्ति के पास से प्रस्थान को दर्शाता है। यह अनुवाद उस स्थानिक संबंध को बनाए रखता है।
- source_word: בְּשָׁלוֹם
  choice: शान्ति से
  rationale: שָׁלוֹם यहाँ मेलपूर्ण संबंध और सुरक्षित प्रस्थान दोनों का संकेत दे सकता है। ‘शान्ति से’ इस व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
