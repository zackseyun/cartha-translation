lexical_decisions:
- source_word: וַיִּקְרָא אֹתָהּ
  choice: उसने उसका नाम ... रखा
  rationale: नामकरण के प्रसंग में קרא का स्वाभाविक आधुनिक हिन्दी रूप ‘नाम रखा’ है। स्त्रीलिंग प्रत्यय אֹתָהּ निकटवर्ती स्त्रीलिंग संज्ञा ‘कुआँ’ की ओर संकेत करता है, इसलिए हिन्दी में ‘उसका’ उपयुक्त है।
- source_word: שִׁבְעָה
  choice: शिबआ
  rationale: यह कुएँ के नाम के रूप में आया है, इसलिए इसका लिप्यंतरण किया गया है। हिब्रू में इससे जुड़ी ‘सात’ और ‘शपथ’ की शब्द-क्रीड़ा को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह नामकरण और नगर के नाम के बीच निष्कर्षात्मक संबंध को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: שֵׁם הָעִיר
  choice: उस नगर का नाम
  rationale: निश्चित उपपद वाले הָעִיר को प्रसंगानुकूल ‘उस नगर’ कहना हिन्दी में स्वाभाविक है और इब्रानी संबंधवाचक संरचना को स्पष्ट रखता है।
- source_word: בְּאֵר שֶׁבַע
  choice: बेर्शेबा
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण किया गया है; उसके संभावित दोहरे अर्थ को मुख्य पाठ में किसी एक अर्थ तक सीमित नहीं किया गया।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह इब्रानी कालवाचक मुहावरे का स्वाभाविक आधुनिक हिन्दी समतुल्य है।
