  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֖אמֶר אַל תֵּרֵ֣ד מִצְרָ֑יְמָ/ה שְׁכֹ֣ן בָּ/אָ֔רֶץ אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/002.yaml
  text: Then Yahweh appeared to him and said[a], “Do not go down to Egypt. Dwell in the land that I will tell you.”
translation:
  language: hi
  text: तब याहवे उसे दिखाई दिया और कहा, “मिस्र की ओर नीचे मत जाना। उस देश में रहना जिसके बारे में मैं तुझसे कहूँगा।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक रूप से: “उस देश में रहना जो मैं तुझसे कहूँगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: दर्शन दिया
  rationale: निफ़अल रूप यहाँ परमेश्वर के प्रकट होने को व्यक्त करता है। ‘दर्शन दिया’ स्वाभाविक, गरिमापूर्ण हिन्दी है और प्रकट होने की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אַל תֵּרֵד
  choice: मत उतरना
  rationale: אַל और अपूर्ण क्रिया का निषेधात्मक आदेश सुरक्षित है; ‘उतरना’ मिस्र की ओर यात्रा के इब्रानी भौगोलिक मुहावरे को भी बनाए रखता है।
- source_word: מִצְרָיְמָה
  choice: मिस्र को
  rationale: दिशासूचक प्रत्यय मिस्र की ओर गति बताता है; ‘मिस्र को’ इस गति को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׁכֹן
  choice: रहना
  rationale: आज्ञार्थक क्रिया का अर्थ किसी स्थान में निवास करना है। निषेध ‘मत उतरना’ के साथ समानांतर आदेश में हिन्दी का सामान्य आज्ञार्थक रूप ‘रहना’ स्वाभाविक है।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: यहाँ אֶרֶץ किसी भूभाग या देश को सूचित करता है, पूरी पृथ्वी को नहीं; निश्चित उपपद को ‘उस’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: जिसके विषय में मैं तुझे बताऊँगा
  rationale: शाब्दिक ‘जो मैं तुझसे कहूँगा’ हिन्दी में अस्पष्ट हो सकता है। यह रूप आगामी ईश्वरीय निर्देश का अर्थ देता है, जबकि भूमि के विषय में कहे जाने का संबंध सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘यहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना आधुनिक हिन्दी में निकट लिप्यंतरण के रूप में प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली रखी गई है। एकवचन निकट संबोधन ‘तुझे’ मूल के द्वितीय पुरुष एकवचन को स्पष्ट करता है।
