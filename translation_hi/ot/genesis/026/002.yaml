    issue: ‘मिस्र को मत उतरना’ is unnatural Hindi.
    rationale: Hindi does not normally use ‘को’ with ‘उतरना’ for travel to a country. ‘मिस्र की ओर नीचे मत जाना’ communicates the Hebrew directional idiom intelligibly.
