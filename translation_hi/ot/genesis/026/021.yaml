  yaml_path: translation/ot/genesis/026/021.yaml
  text: Then they dug another well[a], and they also quarreled over it, so he called its name Sitnah.
translation:
  language: hi
  text: फिर उन्होंने एक और कुआँ खोदा। उसके लिए भी उन्होंने झगड़ा किया, इसलिए उसने उसका नाम सित्ना[a] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सित्ना’ इब्रानी में शत्रुता या विरोध से संबंधित शब्द है।
    reason: नाम के पीछे निहित इब्रानी शब्द-संगति बताने के लिए।
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: उन्होंने…खोदा
  rationale: חפר का सामान्य अर्थ ‘खोदना’ है; बहुवचन कर्ता और कथात्मक क्रम को स्वाभाविक हिन्दी में रखा गया है।
- source_word: בְּאֵר אַחֶרֶת
  choice: एक और कुआँ
  rationale: בְּאֵר का अर्थ ‘कुआँ’ और אַחֶרֶת का अर्थ ‘एक और/दूसरा’ है; ‘एक और कुआँ’ प्रसंग में सहज है।
- source_word: וַיָּרִיבוּ גַּם עָלֶיהָ
  choice: उस पर भी उन्होंने झगड़ा किया
  rationale: ריב यहाँ विवाद या झगड़े को व्यक्त करता है; גַּם को ‘भी’ और עַל को ‘उस पर’ से स्पष्ट रूप में दर्शाया गया है।
- source_word: וַיִּקְרָא שְׁמָהּ
  choice: उसने उसका नाम…रखा
  rationale: शाब्दिक इब्रानी सूत्र ‘उसने उसका नाम पुकारा’ है, पर आधुनिक हिन्दी में नामकरण के लिए ‘नाम रखा’ स्वाभाविक और अर्थ-सटीक है।
- source_word: שִׂטְנָה
  choice: सित्ना
  rationale: कुएँ के नाम को अर्थानुवाद करने के बजाय देवनागरी में लिप्यंतरित किया गया है; उससे जुड़ी शत्रुता/विरोध की शब्द-संगति पादटिप्पणी में दी गई है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी के क्रमिक कथन को हिन्दी में दो वाक्यों में बाँटा गया है, और ‘इसलिए’ से झगड़े तथा नामकरण का प्रसंगगत संबंध स्पष्ट किया गया है।
