  yaml_path: translation/ot/genesis/026/017.yaml
  text: So Isaac went away from there and camped in the Valley of Gerar[a], and settled there.
translation:
  language: hi
  text: तब इसहाक वहाँ से चला गया और गरार की घाटी[a] में डेरा डालकर वहीं बस गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गरार के नाले में।” इब्रानी शब्द मौसमी जलधारा की सूखी तलहटी, खड्ड या घाटी के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: वहाँ से चला गया
  rationale: यह वाक्यांश पिछले स्थान से प्रस्थान को दर्शाता है। ‘वहाँ से चला गया’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में स्थान छोड़ने का भाव स्पष्ट करता है।
- source_word: וַיִּחַן
  choice: डेरा डालकर
  rationale: חנה का सामान्य अर्थ शिविर लगाना या डेरा डालना है। अगले क्रियापद के साथ ‘डेरा डालकर’ सहज हिन्दी क्रम बनाता है।
- source_word: בְּנַחַל גְּרָר
  choice: गरार की घाटी में
  rationale: נחל मौसमी जलधारा की तलहटी, नाला, खड्ड या घाटी को सूचित कर सकता है। ‘घाटी’ सामान्य पाठक के लिए सुबोध है, जबकि पादटिप्पणी मूल शब्द की व्यापकता बनाए रखती है।
- source_word: וַיֵּשֶׁב שָׁם
  choice: वहीं बस गया
  rationale: ישב यहाँ रहने या बसने का भाव देता है। शिविर लगाने के बाद निवास करने की कथात्मक प्रगति को ‘बस गया’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
