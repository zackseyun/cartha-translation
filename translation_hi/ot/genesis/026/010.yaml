base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/010.yaml
  text: And Abimelech said[a], “What is this you have done to us? One of the people might easily have lain with your wife, and you would have brought guilt upon us.”
translation:
  language: hi
  text: अबीमेलेक ने कहा, “तुमने हमारे साथ यह क्या किया? लोगों में से कोई बड़ी आसानी से तुम्हारी पत्नी के साथ सहवास कर बैठता[a], और तुम हम पर अपराध का दोष ले आते।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लोगों में से कोई तुम्हारी पत्नी के साथ लगभग सहवास कर ही बैठा था।”
    reason: כִּמְעַט को ‘बड़ी आसानी से’ अथवा निकट-घटित अर्थ में ‘लगभग’ समझा जा सकता है; यह पादटिप्पणी उस वैकल्पिक व्याख्या को सुरक्षित रखती है।
lexical_decisions:
- source_word: מַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: तुमने हमारे साथ यह क्या किया?
  rationale: इब्रानी के विस्मय और उलाहने को बनाए रखता है तथा לָּנוּ के सामुदायिक भाव को ‘हमारे साथ’ से व्यक्त करता है।
- source_word: כִּמְעַט
  choice: बड़ी आसानी से ... सकता था
  rationale: संदर्भ में यह ऐसी घटना का संकेत देता है जो होते-होते रह गई या सहज ही घट सकती थी। मुख्य पाठ स्वाभाविक हिन्दी में उस वास्तविक खतरे को व्यक्त करता है; ‘लगभग’ वाला पाठांतर पादटिप्पणी में सुरक्षित है।
- source_word: שָׁכַב ... אֶת אִשְׁתֶּךָ
  choice: तुम्हारी पत्नी के साथ सो सकता था
  rationale: ‘के साथ सोना’ हिन्दी में यौन संबंध का स्पष्ट, प्रचलित और शालीन मुहावरा है तथा इब्रानी मुहावरे के निकट रहता है।
- source_word: אַחַד הָעָם
  choice: लोगों में से कोई
  rationale: शाब्दिक अर्थ ‘लोगों में से एक’ है। ‘कोई’ अनिश्चित व्यक्ति का भाव स्वाभाविक हिन्दी में रखता है और पाठ से अधिक स्पष्ट रूप से ‘पुरुष’ नहीं जोड़ता।
- source_word: וְהֵבֵאתָ עָלֵינוּ אָשָׁם
  choice: और तुम हम पर दोष ले आते
  rationale: यह केवल बदनामी नहीं, बल्कि किए गए अपराध से उत्पन्न वास्तविक नैतिक दोष को व्यक्त करता है और ‘हम पर लाना’ वाली इब्रानी संरचना को भी बनाए रखता है।
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  choice: अबीमेलेक ने कहा
  rationale: इब्रानी कथा-क्रम को अनावश्यक संयोजक जोड़े बिना स्वाभाविक आधुनिक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: इस संदर्भ में אָשָׁם का स्वरूप
  choice: दोष
  alternative: बदनामी; अपराध
  rationale: यहाँ आशय केवल सामाजिक निंदा नहीं, बल्कि अनजाने यौन अपराध के कारण समुदाय पर आने वाली वस्तुगत नैतिक दोषिता है। ‘दोष’ इस धार्मिक-नैतिक अर्थ को रखता है, पर बाद की बलिदान-संबंधी शब्दावली को अनावश्यक रूप से नहीं लाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘साथ सोना’ यौन अर्थ में समझ आने वाला किंतु अशिष्ट न होने वाला मुहावरा है। अबीमेलेक के उलाहने और पूरे समुदाय पर आने वाले दोष—दोनों को स्पष्ट रखा गया है।
