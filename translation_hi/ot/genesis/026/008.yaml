base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/008.yaml
  text: And it happened[a], when he had been there a long time, that Abimelech king of the Philistines looked out through the window and saw, and behold, Isaac was laughing with Rebekah his wife.
translation:
  language: hi
  text: जब वह वहाँ बहुत दिनों से रह रहा था, तब ऐसा हुआ कि पलिश्तियों के राजा अबीमेलेक ने खिड़की से बाहर देखा और वहाँ इसहाक को अपनी पत्नी रिबका से लाड़-प्यार करते देखा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का अनुवाद “उसके साथ खेल रहा था,” “उसके साथ हँस रहा था,” या “उसे दुलार रहा था” भी हो सकता है। यह इसहाक के नाम से सम्बन्धित है और खेलपूर्ण या अंतरंग व्यवहार का संकेत दे सकती है। यहाँ ऐसा व्यवहार अभिप्रेत है जिससे प्रकट हुआ कि रिबका उसकी पत्नी थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: जब ... तब ऐसा हुआ कि
  rationale: इब्रानी कथा में यह पदबंध समय-संबंधी परिस्थिति के साथ एक नई घटना आरम्भ करता है; यह हिन्दी में स्वाभाविक ढंग से दोनों कार्यों को व्यक्त करता है।
- source_word: אָרְכוּ לוֹ שָׁם הַיָּמִים
  choice: उसे वहाँ रहते बहुत दिन हो गए
  rationale: शाब्दिक अर्थ ‘उसके लिए वहाँ दिन लम्बे हो गए’ है; चुना हुआ वाक्यांश लम्बे प्रवास का भाव स्वाभाविक आधुनिक हिन्दी में देता है।
- source_word: וַיַּשְׁקֵף ... בְּעַד הַחַלּוֹן
  choice: खिड़की से बाहर देखा
  rationale: क्रिया किसी स्थान से बाहर की ओर देखने का बोध कराती है और בְּעַד הַחַלּוֹן देखने के माध्यम को बताता है।
- source_word: וַיַּרְא וְהִנֵּה
  choice: उसने देखा कि
  rationale: הִנֵּה दृश्य की आकस्मिक खोज पर बल देता है; आधुनिक हिन्दी में ‘देखा कि’ इसे सहज रूप से व्यक्त करता है, जबकि अलग से ‘देखो’ यहाँ कृत्रिम लगता।
- source_word: מְצַחֵק
  choice: हँसी-ठिठोली कर रहा था
  rationale: צחק से बना यह रूप हँसने, खेलपूर्ण व्यवहार या अंतरंग लाड़-प्यार का संकेत दे सकता है और इसहाक के नाम से शब्द-संबंध रखता है। चुना हुआ रूप मूल की अस्पष्टता को कुछ हद तक बनाए रखता है; पादटिप्पणी प्रसंगगत अंतरंग अर्थ स्पष्ट करती है।
- source_word: אֵת רִבְקָה אִשְׁתּוֹ
  choice: अपनी पत्नी रिबका के साथ
  rationale: यद्यपि אֵת सामान्यतः सीधा कर्म चिह्न है, מְצַחֵק के साथ हिन्दी में पारस्परिक व्यवहार को ‘के साथ’ कहना स्वाभाविक है; אִשְׁתּוֹ की स्पष्ट पहचान सुरक्षित है।
theological_decisions:
- issue: इसहाक और रिबका के व्यवहार की प्रकृति
  choice: मुख्य पाठ में ‘हँसी-ठिठोली’ और पादटिप्पणी में सम्भावित अंतरंग अर्थ
  alternative: ‘दुलार कर रहा था’ अथवा ‘लाड़-प्यार कर रहा था’
  rationale: प्रसंग से व्यवहार वैवाहिक सम्बन्ध प्रकट करता है, पर इब्रानी מְצַחֵק स्वयं किसी एक विशिष्ट शारीरिक क्रिया को अनिवार्य नहीं करता। इसलिए अनिश्चितता को दबाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथा-शैली सहज और गरिमापूर्ण रखी गई है। ‘पलिश्तियों’ और पारंपरिक व्यक्तिनामों का प्रचलित बाइबलीय रूप अपनाया गया है।
