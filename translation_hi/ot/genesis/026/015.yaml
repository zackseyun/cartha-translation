  yaml_path: translation/ot/genesis/026/015.yaml
  text: All the wells that his father's servants had dug in the days of Abraham his father[c][b][a], the Philistines stopped up and filled them with earth.
translation:
  language: hi
  text: और जितने कुएँ उसके पिता के सेवकों ने उसके पिता अब्राहम के दिनों में खोदे थे, उन सबको फ़िलिस्तियों ने बंद कर दिया और मिट्टी से भर दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सेवकों’ का अनुवाद ‘दासों’ भी हो सकता है; और ‘मिट्टी’ के लिए मूल शब्द धूल, मिट्टी या धरती को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַבְּאֵרֹת
  choice: और जितने कुएँ ... उन सबको
  rationale: וְ का कथात्मक संयोजक बल ‘और’ से रखा गया है। כָל को स्वाभाविक हिन्दी सहसंबंधी रचना ‘जितने ... उन सबको’ में व्यक्त किया गया है।
- source_word: אֲשֶׁר חָפְרוּ
  choice: खोदे थे
  rationale: सम्बन्धवाचक उपवाक्य कुओं को विशेषित करता है; ‘खोदे थे’ यह स्पष्ट करता है कि खुदाई फ़िलिस्तियों की बाद की कार्रवाई से पहले हुई थी।
- source_word: עַבְדֵי אָבִיו
  choice: उसके पिता के सेवकों
  rationale: עֶבֶד का अर्थ सेवक या दास हो सकता है। इस प्रसंग में बँधी हुई दासता पर बल नहीं है, इसलिए मुख्य पाठ में व्यापक और स्वाभाविक ‘सेवक’ रखा गया है।
- source_word: בִּימֵי אַבְרָהָם אָבִיו
  choice: उसके पिता अब्राहम के दिनों में
  rationale: यह हिब्रू के कालसूचक मुहावरे और अब्राहम की पितृ-पहचान दोनों को बनाए रखता है। हिन्दी में ‘अब्राहम उसके पिता’ की अपेक्षा यह क्रम अधिक स्वाभाविक है।
- source_word: סִתְּמוּם
  choice: बंद करके
  rationale: कुओं के प्रसंग में क्रिया का अर्थ उनका मुँह रोकना या बंद करना है; ‘बंद करके’ सहज और ठोस है।
- source_word: פְּלִשְׁתִּים
  choice: फ़िलिस्तियों
  rationale: इस प्राचीन जनसमूह के लिए प्रचलित हिन्दी रूप।
- source_word: וַיְמַלְאוּם עָפָר
  choice: मिट्टी से भर दिया
  rationale: दोनों कर्मप्रत्यय कुओं की ओर संकेत करते हैं; हिन्दी में ‘उन सबको’ दोनों संयुक्त क्रियाओं पर स्वाभाविक रूप से लागू होता है। עָפָר के लिए प्रसंगानुकूल ‘मिट्टी’ चुना गया है।
