lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: इसलिए … रहा
  rationale: ישׁב का यह रूप कथा में बीती हुई क्रिया बताता है और यहाँ पिछले पद में परमेश्वर के निर्देश के प्रति इसहाक की प्रतिक्रिया व्यक्त करता है। ‘रहा’ आधुनिक हिन्दी में स्वाभाविक है; यह निवास या वहीं ठहरने का भाव देता है, पर ‘बस गया’ जैसी स्थायित्व की अनावश्यक धारणा नहीं जोड़ता। आरंभिक וַ को ‘इसलिए’ से व्यक्त किया गया है, जिससे पिछले निर्देश के परिणाम का संबंध स्पष्ट रहता है।
- source_word: יִצְחָק
  choice: इसहाक
  rationale: व्यक्तिनाम का हिन्दी बाइबल-परंपरा में प्रचलित और सहज रूप।
- source_word: בִּגְרָר
  choice: गरार में
  rationale: उपसर्ग בִּ स्थान सूचित करता है; ‘में’ उसका सीधा और स्वाभाविक हिन्दी रूप है। स्थाननाम גְרָר को प्रचलित रूप ‘गरार’ में लिप्यंतरित किया गया है।
