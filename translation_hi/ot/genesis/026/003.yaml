source:
  edition: WLC
  text: גּ֚וּר בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/אֶֽהְיֶ֥ה עִמְּ/ךָ֖ וַ/אֲבָרְכֶ֑/ךָּ כִּֽי לְ/ךָ֣ וּֽ/לְ/זַרְעֲ/ךָ֗ אֶתֵּן֙ אֶת כָּל הָֽ/אֲרָצֹ֣ת הָ/אֵ֔ל וַ/הֲקִֽמֹתִי֙ אֶת הַ/שְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְ/אַבְרָהָ֥ם אָבִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/003.yaml
  text: Stay in this land[a], and I will be with you and bless you, for to you and to your offspring I will give all these lands[c][b], and I will establish the oath that I swore to Abraham your father.
translation:
  language: hi
  text: इस देश में परदेशी के रूप में रहो[a]। मैं तुम्हारे साथ रहूँगा और तुम्हें आशीष दूँगा, क्योंकि मैं तुम्हें और तुम्हारे वंश[b] को ये सब देश दूँगा और उस शपथ को दृढ़ करूँगा[c], जो मैंने तुम्हारे पिता अब्राहम से खाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस देश में कुछ समय के लिए रहो।” इब्रानी क्रिया परदेशी अथवा अस्थायी निवासी के रूप में रहने का भाव रख सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “बीज”; यहाँ यह सामूहिक अर्थ में वंश को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या, “कायम करूँगा” अथवा “पूरा करूँगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּר
  choice: परदेशी के रूप में रहो
  rationale: क्रिया अस्थायी निवासी अथवा परदेशी के रूप में रहने का भाव व्यक्त करती है। यह अनुवाद इस भाव को स्पष्ट रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בָּאָרֶץ הַזֹּאת / כָּל הָאֲרָצֹת הָאֵל
  choice: इस देश में / ये सब देश
  rationale: אֶרֶץ यहाँ भौगोलिक क्षेत्र को दर्शाता है। एकवचन और बहुवचन में ‘देश’ रखने से मूल शब्द का संबंध बना रहता है।
- source_word: וְאֶהְיֶה עִמְּךָ
  choice: मैं तुम्हारे साथ रहूँगा
  rationale: यह परमेश्वर की उपस्थिति की प्रतिज्ञा को बिना व्याख्यात्मक विस्तार के सीधे व्यक्त करता है।
- source_word: וַאֲבָרְכֶךָ
  choice: और तुम्हें आशीष दूँगा
  rationale: यह ईश्वरीय प्रतिज्ञा के क्रम को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आज्ञा और साथ रहने तथा आशीष देने की प्रतिज्ञा का आधार प्रस्तुत करता है।
- source_word: לְךָ וּלְזַרְעֲךָ
  choice: तुम्हें और तुम्हारे वंश को
  rationale: זֶרַע का शाब्दिक अर्थ ‘बीज’ है, पर यहाँ वह सामूहिक रूप से इसहाक से उत्पन्न वंश को दर्शाता है। हिन्दी में ‘वंश’ संक्षिप्त, स्वाभाविक और सामूहिक है।
- source_word: אֶתֵּן
  choice: दूँगा
  rationale: यह भविष्य की सीधी ईश्वरीय प्रतिज्ञा है।
- source_word: וַהֲקִמֹתִי
  choice: दृढ़ करूँगा
  rationale: קום के हिफ़ील रूप में पहले खाई गई शपथ को स्थापित, कायम या प्रभावी करने का भाव है। ‘दृढ़ करूँगा’ उसकी गंभीरता बनाए रखते हुए उसे केवल ‘पूरा करने’ तक सीमित नहीं करता।
- source_word: הַשְּׁבֻעָה אֲשֶׁר נִשְׁבַּעְתִּי
  choice: उस शपथ को ... जो मैंने ... खाई थी
  rationale: ‘शपथ’ और ‘खाई थी’ मूल संज्ञा तथा उसी धातु से बनी क्रिया की कानूनी-गंभीर अभिव्यक्ति को हिन्दी में सुरक्षित रखते हैं।
- source_word: לְאַבְרָהָם אָבִיךָ
  choice: तुम्हारे पिता अब्राहम से
  rationale: यह अब्राहम को इसहाक के पिता के रूप में पहचानता और प्रतिज्ञा की निरंतरता को बनाए रखता है।
theological_decisions:
- issue: पहले खाई गई शपथ के संबंध में וַהֲקִמֹתִי का अर्थ
  choice: शपथ को दृढ़ करूँगा
  alternative: शपथ को कायम करूँगा / पूरा करूँगा
  rationale: मूल क्रिया स्थापित करने, पुष्ट करने या कार्यान्वित करने का भाव दे सकती है। ‘दृढ़ करूँगा’ इस व्यापकता को बनाए रखता है और पद में स्पष्ट रूप से न आए किसी तकनीकी वाचा-नवीकरण को नहीं जोड़ता।
- issue: זֶרַע का सामूहिक और शाब्दिक स्वरूप
  choice: वंश
  alternative: बीज / संतान
  rationale: तात्कालिक संदर्भ में प्रतिज्ञा इसहाक से आने वाले सामूहिक वंश के विषय में है। मुख्य पाठ में ‘वंश’ अर्थ स्पष्ट करता है, जबकि पादटिप्पणी में शाब्दिक ‘बीज’ सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परदेशी के रूप में रहो’ मूल क्रिया की विशेष छाया को स्पष्ट करता है; ‘आशीष’, ‘वंश’ और ‘शपथ’ बाइबलीय गंभीरता बनाए रखते हुए प्रचलित हिन्दी शब्द हैं।
