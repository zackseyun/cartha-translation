source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ רָא֣וֹ רָאִינוּ֮ כִּֽי הָיָ֣ה יְהוָ֣ה עִמָּ/ךְ֒ וַ/נֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖י/נוּ בֵּינֵ֣י/נוּ וּ/בֵינֶ֑/ךָ וְ/נִכְרְתָ֥ה בְרִ֖ית עִמָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/028.yaml
  text: And they said[a], “We have clearly seen that Yahweh has been with you. So we said, ‘Please let there be an oath between us, between you and us[b], and let us make a covenant with you.’”
translation:
  language: hi
  text: उन्होंने कहा, “हमने साफ़-साफ़ देखा है कि याहवे तुम्हारे साथ रहा है। इसलिए हमने कहा, ‘कृपया हमारे बीच—हमारे और तुम्हारे बीच—एक शपथ हो[a], और हम तुम्हारे साथ वाचा बाँधें।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “शापयुक्त शपथ”; हिब्रू शब्द ऐसी शपथ को भी दर्शा सकता है जिसमें उसे तोड़ने पर शाप का आह्वान निहित हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: उन्होंने कहा
  rationale: वाव-क्रमिक कथा को स्वाभाविक हिन्दी में आगे बढ़ाता है; अलग से ‘और’ जोड़ना आवश्यक नहीं।
- source_word: רָאוֹ רָאִינוּ
  choice: हमने साफ़-साफ़ देखा है
  rationale: इनफिनिटिव एब्सोल्यूट और सीमित क्रिया के मेल से आए ज़ोर को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כִּי הָיָה יְהוָה עִמָּךְ
  choice: कि यहोवा तुम्हारे साथ रहा है
  rationale: पूर्ण क्रिया भूतकालीन स्थिति और उसकी वर्तमान प्रासंगिकता दोनों को व्यक्त कर सकती है; हिन्दी पूर्ण वर्तमान इस अर्थ को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है, किसी उपाधि से बदला नहीं गया।
- source_word: וַנֹּאמֶר
  choice: इसलिए हमने कहा
  rationale: उनके निरीक्षण से निकले प्रस्ताव का निष्कर्षसूचक संबंध स्पष्ट करता है।
- source_word: תְּהִי נָא
  choice: कृपया ... हो
  rationale: जसिव रूप और נָא में निहित विनम्र आग्रह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָלָה
  choice: एक शपथ
  rationale: संधि के प्रसंग में मुख्य अर्थ को स्पष्ट रखता है; उल्लंघन पर शाप के आह्वान की संभावित छाया पादटिप्पणी में सुरक्षित है।
- source_word: בֵּינוֹתֵינוּ בֵּינֵינוּ וּבֵינֶךָ
  choice: हमारे बीच—हमारे और तुम्हारे बीच
  rationale: हिब्रू की औपचारिक पुनरुक्ति को स्पष्ट और पठनीय हिन्दी में बनाए रखता है।
- source_word: וְנִכְרְתָה בְרִית
  choice: और हम ... वाचा बाँधें
  rationale: ‘वाचा काटना’ मूल मुहावरा है; ‘वाचा बाँधना’ हिन्दी का स्वाभाविक और अर्थ-संगत मुहावरा है।
- source_word: עִמָּךְ
  choice: तुम्हारे साथ
  rationale: इसहाक को संबोधित एकवचन संबंधसूचक पदबंध का सीधा अनुवाद।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- issue: אָלָה में शाप-सहित शपथ की संभावना
  choice: मुख्य पाठ में ‘शपथ’, पादटिप्पणी में संभावित शापात्मक अर्थ
  alternative: मुख्य पाठ में ‘शापयुक्त शपथ’
  rationale: यह शब्द शपथ और उल्लंघन पर आहूत शाप दोनों का संकेत दे सकता है। मुख्य पाठ में संदर्भानुकूल सामान्य अर्थ रखा गया है, जबकि संभावित अधिक प्रबल अर्थ को दबाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘साफ़-साफ़’ मूल की तीव्रता व्यक्त करता है; ‘वाचा बाँधें’ हिन्दी में स्वाभाविक बाइबलीय-संधि भाषा है।
