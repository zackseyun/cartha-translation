  text: וַ/יִּ֧בֶן שָׁ֣ם מִזְבֵּ֗חַ וַ/יִּקְרָא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וַ/יֶּט שָׁ֖ם אָהֳל֑/וֹ וַ/יִּכְרוּ שָׁ֥ם עַבְדֵי יִצְחָ֖ק בְּאֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/025.yaml
  text: So he built an altar there and called on the name of Yahweh[a], and he pitched his tent there[b]. And Isaac’s servants dug a well there.
translation:
  language: hi
  text: तब उसने वहाँ एक वेदी बनाई, याहवे के नाम का आह्वान किया, और वहीं अपना तंबू खड़ा किया। इसहाक के सेवकों ने वहाँ एक कुआँ खोदा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: बनाई
  rationale: בנה का सामान्य आख्यानात्मक अर्थ ‘बनाना’ है; ‘वेदी’ के साथ यह स्वाभाविक हिन्दी है।
- source_word: מִזְבֵּחַ
  choice: वेदी
  rationale: बलिदान और आराधना के ढाँचे के लिए प्रचलित तथा सटीक हिन्दी शब्द।
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: यहोवा का नाम लेकर पुकारा
  rationale: यह इब्रानी मुहावरा आह्वान या घोषणा, दोनों का बोध करा सकता है; वेदी के प्रसंग में आराधनापूर्ण आह्वान अधिक संभावित है। हिन्दी अभिव्यक्ति मुहावरे की दिशा और ‘नाम’ दोनों को बनाए रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल-परंपरा में इस व्यक्तिगत दिव्य नाम का व्यापक रूप से पहचाना जाने वाला लिप्यंतरण; इसे उपाधि ‘प्रभु’ से नहीं बदला गया।
- source_word: וַיֶּט שָׁם אָהֳלוֹ
  choice: उसने वहीं अपना तंबू खड़ा किया
  rationale: तंबू के साथ נטה का मुहावरेदार अर्थ ‘खड़ा करना’ है; שָׁם को ‘वहीं’ से व्यक्त किया गया है।
- source_word: עַבְדֵי יִצְחָק
  choice: इसहाक के सेवकों
  rationale: עבד दास या सेवक हो सकता है; यहाँ घरेलू कामगारों द्वारा कुआँ खोदने के प्रसंग में ‘सेवक’ स्वाभाविक है और अनावश्यक रूप से कानूनी स्थिति निर्धारित नहीं करता।
- source_word: וַיִּכְרוּ ... בְּאֵר
  choice: एक कुआँ खोदा
  rationale: कुएँ के संदर्भ में כרה का सामान्य अर्थ ‘खोदना’ और בְּאֵר का अर्थ ‘कुआँ’ है।
- source_word: שָׁם
  choice: वहाँ / वहीं
  rationale: स्थान पर इब्रानी के दोहराए हुए बल को बनाए रखने के लिए पद में इसकी आवृत्ति सुरक्षित रखी गई है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए स्थापित ‘यहोवा’ रूप नाम को उपाधि से बदलने के बजाय सुरक्षित रखता है।
- issue: וַיִּקְרָא בְּשֵׁם יְהוָה का आशय
  choice: यहोवा का नाम लेकर पुकारा
  alternative: यहोवा के नाम की घोषणा की
  rationale: मुहावरे में आह्वान और घोषणा दोनों की संभावना है। वेदी बनाने का निकट प्रसंग आह्वान के पक्ष में है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण आख्यान-शैली। इब्रानी के क्रमिक कार्य और स्थान-सूचक शब्द की पुनरावृत्ति बनाए रखी गई है।
