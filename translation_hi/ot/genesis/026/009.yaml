base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
translation:
  language: hi
  text: तब अबीमेलेक ने इसहाक को बुलाकर कहा, “यह तो सचमुच तुम्हारी पत्नी है! फिर तुमने कैसे कहा, ‘यह मेरी बहन है’?” इसहाक ने उससे कहा, “क्योंकि मैंने कहा था, ‘कहीं मैं उसके कारण मर न जाऊँ।’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् कहीं लोग उसे पाने के लिए मुझे मार न डालें।
    reason: संदर्भ में ‘मर न जाऊँ’ का आशय उन लोगों द्वारा मारे जाने का भय है जो उसकी पत्नी को लेना चाहते थे; मुख्य पाठ हिब्रू की संक्षिप्त अभिव्यक्ति को बनाए रखता है।
lexical_decisions:
- source_word: וַיִּקְרָא ... לְיִצְחָק
  choice: इसहाक को बुलाकर
  rationale: קרא के साथ לְ किसी व्यक्ति को बुलाने का भाव देता है। ‘बुलाकर’ सरल कथात्मक शैली और अगले क्रिया-क्रम दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַךְ הִנֵּה
  choice: यह तो सचमुच
  rationale: दोनों अव्ययों का संयुक्त बल अबीमेलेक की अचानक हुई, ज़ोरदार पहचान पर है। ‘यह तो सचमुच’ आधुनिक हिन्दी में ध्यानाकर्षण और दृढ़ पुष्टि दोनों व्यक्त करता है, बिना इसे प्रश्न बनाए।
- source_word: אִשְׁתְּךָ הִוא
  choice: यह तुम्हारी पत्नी है
  rationale: वाक्य का सीधा अर्थ यही है; हिन्दी में निकट उपस्थित स्त्री के विषय में ‘यह’ स्वाभाविक है।
- source_word: וְאֵיךְ אָמַרְתָּ
  choice: फिर तुमने कैसे कहा
  rationale: וְאֵיךְ पिछले कथन के आधार पर विस्मय और उलाहने से भरा प्रश्न उठाता है। ‘फिर ... कैसे’ इस संबंध और स्वर को सहज हिन्दी में रखता है।
- source_word: אֲחֹתִי הִוא
  choice: यह मेरी बहन है
  rationale: אחות का सामान्य और संदर्भानुकूल अर्थ ‘बहन’ है; इसे व्यापक रिश्तेदारी-सूचक शब्द से बदलने का आधार नहीं है।
- source_word: כִּי אָמַרְתִּי
  choice: क्योंकि मैंने सोचा था
  rationale: כִּי उत्तर का कारण प्रस्तुत करता है। यहाँ אָמַרְתִּי भीतरी विचार को सूचित करता है; हिन्दी में ‘मैंने सोचा था’ कथन की तुलना में अधिक स्वाभाविक है और आशय को नहीं बदलता।
- source_word: פֶּן אָמוּת
  choice: कहीं ... मर न जाऊँ
  rationale: פֶּן आशंकित परिणाम व्यक्त करता है। ‘कहीं ... न’ आधुनिक हिन्दी में इस भय को स्वाभाविक और सटीक रूप से व्यक्त करता है।
- source_word: עָלֶיהָ
  choice: उसके कारण
  rationale: इस मुहावरे में עַל कारण अथवा अवसर दर्शाता है। ‘उसके कारण’ इसहाक के भय को स्पष्ट रखता है, पर मुख्य पाठ में हत्या को अनावश्यक रूप से स्पष्ट नहीं करता।
