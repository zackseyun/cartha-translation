  text: וַ/יַּעְתֵּ֣ק מִ/שָּׁ֗ם וַ/יַּחְפֹּר֙ בְּאֵ֣ר אַחֶ֔רֶת וְ/לֹ֥א רָב֖וּ עָלֶ֑י/הָ וַ/יִּקְרָ֤א שְׁמָ/הּ֙ רְחֹב֔וֹת וַ/יֹּ֗אמֶר כִּֽי עַתָּ֞ה הִרְחִ֧יב יְהוָ֛ה לָ֖/נוּ וּ/פָרִ֥ינוּ בָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/022.yaml
  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
translation:
  language: hi
  text: फिर वह वहाँ से आगे बढ़ गया और उसने एक और कुआँ खोदा। उस कुएँ को लेकर उन्होंने झगड़ा नहीं किया। इसलिए उसने उसका नाम रहोबोत[a] रखा और कहा, “क्योंकि अब याहवे ने हमारे लिए जगह बनाई है, और हम इस भूमि में फलेंगे-फूलेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “रहोबोत” नाम इब्रानी के उस शब्द जैसा सुनाई देता है जिसका अर्थ “खुली जगहें” या “चौड़े स्थान” है। इसहाक की बात—“याहवे ने हमारे लिए जगह बनाई है”—इसी अर्थ पर आधारित शब्द-खेल है।
    reason: नाम के अर्थ और मूल इब्रानी शब्द-खेल को स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּעְתֵּק מִשָּׁם
  choice: फिर वह वहाँ से हट गया
  rationale: यह क्रिया उस स्थान को छोड़कर दूसरी जगह जाने को दर्शाती है। ‘हट गया’ प्रसंग में स्वाभाविक है और यात्रा के ढंग को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: בְּאֵר אַחֶרֶת
  choice: एक और कुआँ
  rationale: यह साधारण और स्वाभाविक हिन्दी में ‘another well’ का स्पष्ट समतुल्य है।
- source_word: וְלֹא רָבוּ עָלֶיהָ
  choice: उस कुएँ को लेकर उन्होंने झगड़ा नहीं किया
  rationale: ריב विवाद या झगड़े को व्यक्त करता है; स्पष्ट संज्ञा ‘उस कुएँ’ स्त्रीलिंग सर्वनाम के संदर्भ को हिन्दी में सहज बनाती है।
- source_word: וַיִּקְרָא שְׁמָהּ רְחֹבוֹת
  choice: उसने उसका नाम रहोबोत रखा
  rationale: इब्रानी नामकरण सूत्र को पठनीय हिन्दी में रखा गया है और स्थान-नाम का लिप्यंतरण किया गया है।
- source_word: רְחֹבוֹת
  choice: रहोबोत
  rationale: स्थान-नाम को अनूदित करने के बजाय लिप्यंतरित किया गया है; उसके अर्थ और अगले वाक्य के शब्द-खेल को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כִּי עַתָּה הִרְחִיב יְהוָה לָנוּ
  choice: क्योंकि अब याहवे ने हमारे लिए जगह बनाई है
  rationale: ‘जगह बनाई है’ הרחיב के कारक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता और रहोबोत नाम के साथ शब्द-खेल को बनाए रखता है। כִּי को ‘क्योंकि’ से स्पष्ट रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: וּפָרִינוּ בָאָרֶץ
  choice: और हम इस देश में फलेंगे-फूलेंगे
  rationale: פרה का मूल भाव फलवन्त होने और बढ़ने का है। ‘फलेंगे-फूलेंगे’ आधुनिक हिन्दी का स्वाभाविक मुहावरा है जो वृद्धि के भाव को रखता है; ‘इस देश’ से प्रसंगगत भूमि का संकेत मिलता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में चतुरक्षरीय विशिष्ट नाम सीधे प्रयुक्त हुआ है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: וּפָרִינוּ में आशीष और वृद्धि का भाव
  choice: हम इस देश में फलेंगे-फूलेंगे
  alternative: हम इस देश में फलवन्त होंगे / हमारी इस देश में बढ़ती होगी
  rationale: चयन मूल के फलवन्त होने और बढ़ने के अर्थ को सहज हिन्दी में रखता है, बिना इसे केवल आर्थिक समृद्धि तक सीमित किए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। कथा का प्रवाह सरल रखा गया है; ‘याहवे’ और ‘रहोबोत’ जैसे विशिष्ट नाम लिप्यंतरित हैं।
