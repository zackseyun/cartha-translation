base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/018.yaml
  text: Then Isaac dug again the wells of water that had been dug in the days of Abraham his father[a], which the Philistines had stopped up after Abraham's death, and he called them by the names that his father had given them.
translation:
  language: hi
  text: तब इसहाक ने पानी के उन कुओं को फिर से खोदा[a], जो उसके पिता अब्राहम के दिनों में खोदे गए थे और जिन्हें पलिश्तियों ने अब्राहम की मृत्यु के बाद बंद कर दिया था। उसने उन कुओं के वही नाम रखे जो उसके पिता ने रखे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक औपचारिक अनुवाद: “इसहाक लौटा और उसने खोदा।” हिब्रू क्रिया का स्पष्ट अर्थ “लौटना” हो सकता है, पर यहाँ वह सम्भवतः दोबारा वही काम करने का भाव देती है: “फिर से खोदा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב ... וַיַּחְפֹּר
  choice: फिर से खोदा
  rationale: שׁוב के बाद दूसरा क्रियापद यहाँ कार्य की पुनरावृत्ति या बहाली व्यक्त करता है। स्वाभाविक हिन्दी में ‘फिर से खोदा’ इस भाव को स्पष्ट रखता है; औपचारिक ‘लौटा और खोदा’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּאֵרֹת הַמַּיִם
  choice: पानी के ... कुओं
  rationale: यह हिब्रू पदबंध का अर्थ स्पष्ट और आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו
  choice: जो उसके पिता अब्राहम के दिनों में खोदे गए थे
  rationale: हिब्रू बहुवचन क्रिया का कर्ता अनिर्दिष्ट है, इसलिए हिन्दी कर्मवाच्य मूल की अनिश्चितता बनाए रखता है। ‘दिनों में’ काल-सूचक मुहावरे को भी सुरक्षित रखता है।
- source_word: וַיְסַתְּמוּם
  choice: बंद कर दिया था
  rationale: סתם का अर्थ कुओं को रोकना या बंद करना है। ‘बंद कर दिया’ सामान्य हिन्दी में स्पष्ट है और कुएँ किस पदार्थ से भरे गए थे, यह अनावश्यक रूप से नहीं जोड़ता।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्तियों
  rationale: यह हिन्दी बाइबलीय परंपरा में इस जनसमूह का प्रचलित नाम है।
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: अब्राहम की मृत्यु के बाद
  rationale: मूल काल-संबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וַיִּקְרָא לָהֶן שֵׁמוֹת כַּשֵּׁמֹת אֲשֶׁר קָרָא לָהֶן אָבִיו
  choice: उसने उन कुओं के वही नाम रखे जो उसके पिता ने रखे थे
  rationale: קרא ... שמות नाम देने को व्यक्त करता है और כ־ यहाँ पूर्व नामों से अनुरूपता दर्शाता है। ‘वही नाम रखे’ इस समानता को साफ और सहज हिन्दी में व्यक्त करता है।
