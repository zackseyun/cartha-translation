  yaml_path: translation/ot/genesis/026/014.yaml
  text: He had flocks[a], herds, and a large household[b], and the Philistines envied him.
translation:
  language: hi
  text: उसके पास भेड़-बकरियों के झुंड, गाय-बैलों के झुंड और बहुत-से सेवक[a] थे, और पलिश्ती उससे ईर्ष्या करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बहुत सेवा/श्रम”; इसका आशय सेवकों या कामगारों का बड़ा समूह भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: उसके पास ... थे
  rationale: हिब्रू में היה + ל का अस्तित्ववाचक प्रयोग अधिकार या स्वामित्व व्यक्त करता है; आधुनिक हिन्दी में ‘उसके पास ... थे’ इसका स्वाभाविक समतुल्य है।
- source_word: מִקְנֵה צֹאן
  choice: भेड़-बकरियों के झुंड
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, का सामूहिक बोध कराता है; हिन्दी में यह रूप अर्थ को स्पष्ट रखता है।
- source_word: וּמִקְנֵה בָקָר
  choice: गाय-बैलों के झुंड
  rationale: בָקָר गोवंश को सूचित करता है; ‘गाय-बैल’ साधारण आधुनिक हिन्दी में सामूहिक पशुधन का स्पष्ट रूप है।
- source_word: וַעֲבֻדָּה רַבָּה
  choice: बहुत-से सेवक
  rationale: עֲבֻדָּה का अर्थ सेवा, श्रम या सेवा करने वाला बड़ा कार्यबल हो सकता है। पशुधन-संपत्ति के इस प्रसंग में ‘बहुत-से सेवक’ संभावित ठोस सामाजिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी मूल की व्यापकता सुरक्षित रखती है।
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: उससे ईर्ष्या करने लगे
  rationale: קנא यहाँ इसहाक की समृद्धि के कारण उसके प्रति ईर्ष्या व्यक्त करता है। हिन्दी में ‘ईर्ष्या करना’ सीधा और प्रसंगानुकूल है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्ती
  rationale: यह इस जनसमूह के नाम का प्रचलित हिन्दी रूप है।
