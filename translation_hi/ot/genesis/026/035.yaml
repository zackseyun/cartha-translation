- source_word: וַתִּהְיֶיןָ
  choice: और वे ... बनीं
  rationale: यह היה का स्त्रीलिंग बहुवचन कथात्मक रूप है और पिछले पद में उल्लिखित एसाव की पत्नियों की ओर संकेत करता है। प्रसंग में ‘बनीं’ स्थिति के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है; ‘थीं’ भी व्याकरणतः संभव है।
- source_word: מֹרַת רוּחַ
  choice: मन के लिए कड़वाहट का कारण
  rationale: शाब्दिक रूप ‘आत्मा की कड़वाहट’ है, पर यहाँ इब्रानी मुहावरा गहरे मानसिक दुःख या खिन्नता को बताता है। यह हिन्दी अभिव्यक्ति उस अर्थ को स्पष्ट रखते हुए ‘कड़वाहट’ की मूल छवि बचाती है।
- source_word: לְיִצְחָק וּלְרִבְקָה
  choice: इसहाक और रिबका के मन के लिए
  rationale: दोनों ל उपसर्ग प्रभावित व्यक्तियों को चिह्नित करते हैं। हिन्दी में एक ही संबंधसूचक पद से दोनों नामों को जोड़ना स्वाभाविक है।
