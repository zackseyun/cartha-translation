source:
  edition: WLC
  text: עֵ֕קֶב אֲשֶׁר שָׁמַ֥ע אַבְרָהָ֖ם בְּ/קֹלִ֑/י וַ/יִּשְׁמֹר֙ מִשְׁמַרְתִּ֔/י מִצְוֺתַ֖/י חֻקּוֹתַ֥/י וְ/תוֹרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/005.yaml
  text: because Abraham obeyed my voice and kept my charge[a], my commandments, my statutes[b], and my laws.
translation:
  language: hi
  text: क्योंकि अब्राहम ने मेरी बात मानी[a] और मेरे सौंपे हुए दायित्व, मेरी आज्ञाओं, मेरी विधियों और मेरी व्यवस्थाओं[b] का पालन किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरी आवाज़ सुनी।” इब्रानी में यह मुहावरा प्रायः आज्ञाकारी होकर सुनने, अर्थात बात मानने, का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरी शिक्षाओं” अथवा “मेरे निर्देशों।” इब्रानी शब्द तोराह का अर्थ संदर्भ के अनुसार व्यवस्था, शिक्षा या निर्देश हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵקֶב
  choice: क्योंकि
  rationale: यह आसपास के वाक्य में प्रतिज्ञात आशीष का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: שָׁמַע ... בְּקֹלִי
  choice: मेरी बात मानी
  rationale: इब्रानी मुहावरे का अर्थ केवल सुनना नहीं, बल्कि आज्ञाकारी होकर सुनना है। ‘मेरी बात मानी’ हिन्दी में इस भाव को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘आवाज़’ का शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וַיִּשְׁמֹר
  choice: पालन किया
  rationale: कानूनी और वाचागत संज्ञाओं के साथ שׁמר का आशय सँभालकर मानने या पालन करने से है; यहाँ ‘पालन किया’ स्पष्ट और स्वाभाविक है।
- source_word: מִשְׁמַרְתִּי
  choice: मेरे सौंपे हुए दायित्व
  rationale: यह शब्द ऐसी जिम्मेदारी या दायित्व को दर्शाता है जिसे निभाने के लिए सौंपा गया हो। यह अनुवाद इसे आगे आने वाली ‘आज्ञाओं’ से अलग रखता है।
- source_word: מִצְוֺתַי
  choice: मेरी आज्ञाओं
  rationale: वाचागत और विधिक संदर्भ में מִצְוָה का यह मानक, स्पष्ट हिन्दी रूप है।
- source_word: חֻקּוֹתַי
  choice: मेरी विधियों
  rationale: ‘विधियाँ’ स्थापित नियमों का भाव देती हैं और ‘आज्ञाओं’ तथा ‘व्यवस्थाओं’ से इस शब्द का भेद यथासंभव बनाए रखती हैं।
- source_word: וְתוֹרֹתָי
  choice: और मेरी व्यवस्थाओं
  rationale: इस विधिक शब्द-समूह में ‘व्यवस्थाओं’ से תּוֹרָה का कानूनी-वाचागत आशय स्पष्ट होता है; इसके व्यापक अर्थ ‘शिक्षाओं/निर्देशों’ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: सीनै से पहले वाचागत-विधिक शब्दों का समूह
  choice: ‘दायित्व, आज्ञाओं, विधियों और व्यवस्थाओं’—इन अलग-अलग पदों को बनाए रखा गया है।
  alternative: सूची को संक्षिप्त करके ‘मेरी सभी आज्ञाओं और नियमों’ जैसा सामान्य वाक्य बनाया जा सकता था।
  rationale: मूल पाठ निकटार्थी विधिक शब्दों को एकत्र करके अब्राहम की व्यापक आज्ञाकारिता पर बल देता है। उन्हें समेटना या यह समझाना कि वे बाद की मूसा-व्यवस्था से कैसे संबंधित हैं, पाठ में एक धर्मवैज्ञानिक समाधान जोड़ देता; इसलिए मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मेरे सौंपे हुए दायित्व’ अपेक्षाकृत औपचारिक है, पर यह विशिष्ट इब्रानी पद को ‘आज्ञाओं’ में मिला देने से बचाता है।
