  yaml_path: translation/ot/genesis/026/019.yaml
  text: Then Isaac’s servants dug in the wadi and found there a well of living water[a][b].
translation:
  language: hi
  text: तब इसहाक के सेवकों ने उस बरसाती जलधारा के पाट[a] में खोदा और वहाँ उन्हें बहते पानी का एक कुआँ[b] मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घाटी में” अथवा “नदी के पाट में”; इब्रानी शब्द प्रायः ऐसी मौसमी जलधारा को दर्शाता है जिसमें बरसात के समय पानी बहता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “जीवित जल का कुआँ,” अर्थात ठहरे हुए पानी के बजाय किसी सोते से आने वाला ताज़ा या बहता पानी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: खोदा
  rationale: חפר के सामान्य अर्थ ‘खोदना’ को स्वाभाविक और सीधी हिन्दी में व्यक्त करता है।
- source_word: עַבְדֵי יִצְחָק
  choice: इसहाक के सेवकों
  rationale: यह रचना इसहाक की सेवा में लगे लोगों को बताती है; प्रसंग में ‘सेवक’ स्वाभाविक है और उनकी कानूनी हैसियत अनावश्यक रूप से तय नहीं करता।
- source_word: בַּנָּחַל
  choice: उस बरसाती नदी की तलहटी
  rationale: נחל प्रायः ऐसी मौसमी जलधारा या उसके पाट को दर्शाता है जिसमें वर्ष के कुछ समय पानी बहता है; यह हिन्दी पाठक के लिए ‘वादी’ से अधिक सहज है।
- source_word: וַיִּמְצְאוּ שָׁם
  choice: वहाँ उन्हें ... मिला
  rationale: שָׁם का स्थान-सूचक बल बनाए रखते हुए हिन्दी की स्वाभाविक वाक्य-रचना अपनाई गई है।
- source_word: בְּאֵר
  choice: एक कुआँ
  rationale: בְּאֵר का सीधा अर्थ कुआँ है; अगले पदबंध से उसके पानी का प्रकार स्पष्ट होता है।
- source_word: מַיִם חַיִּים
  choice: बहते पानी
  rationale: शाब्दिक अर्थ ‘जीवित पानी’ है, पर यह इब्रानी मुहावरा ठहरे हुए पानी के विपरीत ताजे या स्रोत से बहते पानी को दर्शाता है; मुख्य पाठ में अर्थ-स्पष्ट हिन्दी चुनी गई और शाब्दिक रूप पाद-टिप्पणी में सुरक्षित रखा गया।
