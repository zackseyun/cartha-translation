source:
  edition: WLC
  text: וַ/יְצַ֣ו אֲבִימֶ֔לֶךְ אֶת כָּל הָ/עָ֖ם לֵ/אמֹ֑ר הַ/נֹּגֵ֜עַ בָּ/אִ֥ישׁ הַ/זֶּ֛ה וּ/בְ/אִשְׁתּ֖/וֹ מ֥וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/011.yaml
  text: Then Abimelech commanded all the people[a], saying, “Whoever touches this man or his wife shall surely be put to death.”
translation:
  language: hi
  text: तब अबीमेलेक ने सब लोगों को यह आज्ञा दी, “जो कोई इस पुरुष या उसकी पत्नी को छुएगा, वह निश्चय ही मार डाला जाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: पिएल रूप अधिकारपूर्वक आदेश देने को व्यक्त करता है; ‘आज्ञा दी’ आधुनिक और गरिमापूर्ण हिन्दी में इसका बल बनाए रखता है।
- source_word: כָּל הָעָם
  choice: सब लोगों को
  rationale: यहाँ עם अबीमेलेक के अधिकार के अधीन पूरी प्रजा को सामान्य रूप से सूचित करता है; ‘सब लोगों’ सहज और व्यापक है।
- source_word: לֵאמֹר
  choice: यह आज्ञा दी, “…”
  rationale: हिन्दी में अलग से ‘यह कहते हुए’ रखने के बजाय कथन को सीधे आज्ञा की विषयवस्तु बनाना अधिक स्वाभाविक है और उद्धरणसूचक कार्य सुरक्षित रहता है।
- source_word: הַנֹּגֵעַ
  choice: जो कोई … छुएगा
  rationale: संज्ञीकृत कृदन्त सामान्य नियम व्यक्त करता है। ‘जो कोई’ उसका सार्वत्रिक भाव रखता है और ‘छूना’ मूल क्रिया का सीधा अर्थ है; हिंसक आशय को अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: בָּאִישׁ הַזֶּה
  choice: इस पुरुष को
  rationale: נגע के साथ ב स्पर्श किए जाने वाले व्यक्ति को चिह्नित करता है। ‘इस पुरुष को’ हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: וּבְאִשְׁתּוֹ
  choice: या उसकी पत्नी को
  rationale: ו यहाँ निषेधात्मक आदेश के दायरे में दो संरक्षित व्यक्तियों के बीच विकल्पसूचक ‘या’ के रूप में स्वाभाविक है; אשתו का प्रसंगानुकूल अर्थ ‘उसकी पत्नी’ है।
- source_word: מוֹת יוּמָת
  choice: निश्चय ही मार डाला जाएगा
  rationale: क्रियामूलक निरपेक्ष रूप के साथ होफाल अपूर्ण क्रिया दण्ड की निश्चितता और निष्पादन दोनों दर्शाती है; यह अनुवाद निष्क्रिय, न्यायिक मृत्युदण्ड के भाव को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘छुएगा’ जानबूझकर मूल की व्यापकता बनाए रखता है और उसे ‘हानि पहुँचाएगा’ या ‘हाथ लगाएगा’ कहकर संकीर्ण नहीं करता।
