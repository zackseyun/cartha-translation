  source_fidelity: The Hindi accurately conveys Abimelech's authoritative command to all the people, the generic subject ('whoever'), both protected persons, and the emphatic passive death penalty in מוֹת יוּמָת. The direct quotation appropriately carries the force of לֵאמֹר without a wooden equivalent.
