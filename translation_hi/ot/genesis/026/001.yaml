  text: וַ/יְהִ֤י רָעָב֙ בָּ/אָ֔רֶץ מִ/לְּ/בַד֙ הָ/רָעָ֣ב הָ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיָ֖ה בִּ/ימֵ֣י אַבְרָהָ֑ם וַ/יֵּ֧לֶךְ יִצְחָ֛ק אֶל אֲבִימֶּ֥לֶךְ מֶֽלֶךְ פְּלִשְׁתִּ֖ים גְּרָֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/001.yaml
  text: There was a famine in the land[a], besides the first famine that had been in the days of Abraham. So Isaac went to Abimelech king of the Philistines at Gerar.
translation:
  language: hi
  text: देश में अकाल पड़ा—पहले उस अकाल के अलावा, जो अब्राहम के दिनों में पड़ा था। तब इसहाक गेरार में[a] पलिश्तियों के राजा अबीमेलेक के पास गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गेरार की ओर।” इब्रानी में “गेरार” के साथ लगा दिशासूचक प्रत्यय गेरार की ओर जाने को स्पष्ट रूप से दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב בָּאָרֶץ
  choice: उस देश में अकाल पड़ा
  rationale: इब्रानी अस्तित्वसूचक कथन को स्वाभाविक हिन्दी कथन में व्यक्त किया गया है। בָּאָרֶץ यहाँ पूरी पृथ्वी नहीं, प्रसंग का स्थानीय देश या भूभाग है।
- source_word: מִלְּבַד הָרָעָב הָרִאשׁוֹן
  choice: उस पहले अकाल के अलावा
  rationale: מִלְּבַד तुलना करते हुए इस अकाल को पहले अकाल से अलग बताता है; רִאשׁוֹן का क्रमसूचक अर्थ ‘पहला’ रखा गया है।
- source_word: אֲשֶׁר הָיָה בִּימֵי אַבְרָהָם
  choice: जो अब्राहम के दिनों में पड़ा था
  rationale: सम्बन्धवाचक उपवाक्य पहले अकाल की पहचान अब्राहम के जीवनकाल के आधार पर करता है; अकाल के साथ ‘पड़ा था’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיֵּלֶךְ יִצְחָק אֶל אֲבִימֶּלֶךְ
  choice: इसलिए इसहाक ... अबीमेलेक के पास गया
  rationale: וַיֵּלֶךְ कथा को आगे बढ़ाता है और अकाल के बाद इसहाक की यात्रा बताता है। ‘इसलिए’ प्रसंगगत परिणाम को सहज रूप से व्यक्त करता है, जबकि אֶל व्यक्ति के साथ ‘के पास’ अनुकूल है।
- source_word: מֶלֶךְ פְּלִשְׁתִּים
  choice: पलिश्तियों के राजा
  rationale: सम्बन्धवाची इब्रानी पदबंध का सीधा और प्रचलित हिन्दी रूप; जातीय-राजनीतिक नाम को पारंपरिक हिन्दी वर्तनी में रखा गया है।
- source_word: גְּרָרָה
  choice: गेरार में
  rationale: दिशासूचक प्रत्यय यात्रा की मंज़िल गेरार को बताता है। मुख्य पाठ में ‘गेरार में ... के पास गया’ स्वाभाविक हिन्दी है; अधिक शाब्दिक दिशात्मक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: פְּלִשְׁתִּים का ऐतिहासिक-जातीय पदनाम
  choice: पलिश्ती
  alternative: पलिश्ती लोग
  rationale: यह कथानक में सामान्य जातीय-राजनीतिक पदनाम है, कोई धर्मवैज्ञानिक उपाधि नहीं; संक्षिप्त पारंपरिक रूप पर्याप्त और स्पष्ट है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अकाल पड़ा’ सामान्य हिन्दी मुहावरा है। वाक्य-विन्यास मूल की तुलना और कथा-क्रम को बनाए रखता है; गेरार के रूप में निहित दिशात्मक अर्थ को मुख्य पाठ और पादटिप्पणी दोनों में संतुलित किया गया है।
