source:
  edition: WLC
  text: וַֽ/יִּשְׁאֲל֞וּ אַנְשֵׁ֤י הַ/מָּקוֹם֙ לְ/אִשְׁתּ֔/וֹ וַ/יֹּ֖אמֶר אֲחֹ֣תִ/י הִ֑וא כִּ֤י יָרֵא֙ לֵ/אמֹ֣ר אִשְׁתִּ֔/י פֶּן יַֽהַרְגֻ֜/נִי אַנְשֵׁ֤י הַ/מָּקוֹם֙ עַל רִבְקָ֔ה כִּֽי טוֹבַ֥ת מַרְאֶ֖ה הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/007.yaml
  text: When the men of the place asked about his wife[a], he said, “She is my sister,” because he was afraid to say, “She is my wife,” lest the men of the place kill me because of Rebekah, because she was beautiful in appearance.
translation:
  language: hi
  text: जब उस स्थान के पुरुषों ने उसकी पत्नी के बारे में पूछा, तो उसने कहा, “वह मेरी बहन है,” क्योंकि वह यह कहने से डरता था, “वह मेरी पत्नी है।” उसे भय था कि उस स्थान के पुरुष रिबका के कारण उसे मार डालेंगे, क्योंकि वह देखने में सुंदर थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: पूछा
  rationale: שׁאל का सामान्य अर्थ यहाँ सीधी पूछताछ करना है; ‘पूछा’ सहज और सटीक आधुनिक हिन्दी है।
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: उस स्थान के पुरुषों
  rationale: אַנְשֵׁי विशेष रूप से पुरुषों को सूचित करता है; इसलिए इसे सामान्य ‘लोगों’ से नहीं बदला गया।
- source_word: לְאִשְׁתּוֹ
  choice: उसकी पत्नी के बारे में
  rationale: שׁאל के साथ לְ यहाँ पूछताछ के विषय को दर्शाता है; हिन्दी में ‘के बारे में पूछा’ स्वाभाविक है।
- source_word: אֲחֹתִי הִוא
  choice: वह मेरी बहन है
  rationale: पहचान बताने वाले हिब्रू वाक्य को सहज हिन्दी प्रत्यक्ष कथन में रखा गया है।
- source_word: כִּי יָרֵא
  choice: क्योंकि ... डरता था
  rationale: כִּי कारण बताता है और ירא भय की अवस्था व्यक्त करता है।
- source_word: פֶּן יַהַרְגֻנִי
  choice: उसे भय था कि ... उसे मार डालेंगे
  rationale: פֶּן आशंकित परिणाम प्रस्तुत करता है। हिब्रू में प्रथम पुरुष ‘मुझे’ इसहाक के मन की बात को प्रत्यक्ष रूप से दर्शाता है; प्रवाहपूर्ण हिन्दी में इसे अप्रत्यक्ष कथन बनाकर तृतीय पुरुष में व्यक्त किया गया है।
- source_word: עַל רִבְקָה
  choice: रिबका के कारण
  rationale: עַל यहाँ कारण अथवा अवसर सूचित करता है; ‘के कारण’ इसका स्पष्ट हिन्दी रूप है।
- source_word: טוֹבַת מַרְאֶה
  choice: देखने में सुंदर
  rationale: यह पदबंध मनोहर शारीरिक रूप को दर्शाता है; ‘देखने में सुंदर’ सटीक, सहज और गरिमापूर्ण है।
- source_word: רִבְקָה
  choice: रिबका
  rationale: नाम का रूप हिब्रू רִבְקָה के निकट रहते हुए प्रचलित हिन्दी बाइबलीय वर्तनी के अनुरूप है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, कथात्मक और गरिमापूर्ण रूप अपनाया गया है। हिब्रू में इसहाक के दृष्टिकोण से आए ‘मुझे’ को हिन्दी में अप्रत्यक्ष कथन के अनुरूप ‘उसे’ किया गया है; इससे अर्थ बदले बिना व्यक्ति-संदर्भ स्पष्ट रहता है।
