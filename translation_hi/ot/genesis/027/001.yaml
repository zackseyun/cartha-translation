  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। प्रत्यक्ष संबोधन में आत्मीयता रखी गई है और पुरातन या अत्यधिक संस्कृतनिष्ठ भाषा से बचा गया है।
