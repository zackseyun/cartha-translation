reference: Genesis 27:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִי֙ כִּֽי זָקֵ֣ן יִצְחָ֔ק וַ/תִּכְהֶ֥יןָ עֵינָ֖י/ו מֵ/רְאֹ֑ת וַ/יִּקְרָ֞א אֶת עֵשָׂ֣ו בְּנ֣/וֹ הַ/גָּדֹ֗ל וַ/יֹּ֤אמֶר אֵלָי/ו֙ בְּנִ֔/י וַ/יֹּ֥אמֶר אֵלָ֖י/ו הִנֵּֽנִ/י־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/001.yaml
  text: It happened that when Isaac was old and his eyes were too dim to see[a], he called Esau his older son and said to him, “My son,” and he said to him, “Here I am.”
translation:
  language: hi
  text: ऐसा हुआ कि जब इसहाक बूढ़ा हो गया और उसकी आँखें इतनी धुँधली हो गईं कि वह देख नहीं सकता था, तब उसने अपने बड़े बेटे[a] एसाव को बुलाकर उससे कहा, “मेरे बेटे!” उसने उत्तर दिया, “मैं यहाँ हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने ज्येष्ठ पुत्र एसाव को।”
    reason: הַגָּדֹל का अधिक औपचारिक वैकल्पिक अनुवाद; दो पुत्रों के संदर्भ में यह जन्मक्रम को व्यक्त करता है।
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: ऐसा हुआ कि जब
  rationale: यह पदबंध नए वृत्तांत-प्रसंग का आरम्भ करते हुए उसकी समयगत परिस्थिति प्रस्तुत करता है। यह हिंदी में स्वाभाविक है और किसी ऐसे स्पष्ट ‘अब’ का आयात नहीं करता जो स्रोत में नहीं है।
- source_word: זָקֵן
  choice: बूढ़ा हो गया
  rationale: यह इसहाक की बढ़ी हुई आयु बताता है; संदर्भ में अवस्था तक पहुँचने का भाव हिंदी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת
  choice: उसकी आँखें इतनी धुँधली हो गईं कि वह देख नहीं सकता था
  rationale: כהה आँखों की दृष्टि मंद पड़ने को और מֵרְאֹת देखने में असमर्थता या बाधा को व्यक्त करता है। चुना हुआ रूप परिणाम-संबंध को स्पष्ट और सहज हिंदी में रखता है।
- source_word: וַיִּקְרָא
  choice: बुलाकर
  rationale: यहाँ קרא का अर्थ किसी को अपने पास बुलाना है। संयुक्त क्रिया हिंदी में अगले कथन से स्वाभाविक रूप से जुड़ती है।
- source_word: אֶת־עֵשָׂו בְּנוֹ הַגָּדֹל
  choice: अपने बड़े बेटे एसाव
  rationale: הַגָּדֹל यहाँ याकूब की तुलना में एसाव के बड़े होने को दर्शाता है। ‘बड़ा बेटा’ सामान्य आधुनिक हिंदी है; ‘ज्येष्ठ पुत्र’ एक वैध अधिक औपचारिक विकल्प है।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: प्रथम पुरुष स्वामित्वसूचक प्रत्यय और आत्मीय पारिवारिक संबोधन दोनों सुरक्षित रहते हैं।
- source_word: הִנֵּנִי
  choice: मैं यहाँ हूँ
  rationale: यह उपस्थिति और उत्तर देने की तत्परता बताने वाला प्रचलित हिब्रू प्रत्युत्तर है।
theological_decisions: []
