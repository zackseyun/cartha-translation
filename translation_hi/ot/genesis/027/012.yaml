- source_word: אוּלַי
  choice: हो सकता है कि
  rationale: यह याकूब की आशंकापूर्ण संभावना और मूल की अनिश्चितता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְמֻשֵּׁנִי
  choice: मुझे छूकर पहचान लें
  rationale: משש का मूल अर्थ हाथ से टटोलना या छूकर जाँचना है। प्रसंग में इसहाक स्पर्श द्वारा पहचान की पुष्टि करेंगे; ‘पहचान लें’ निहित प्रयोजन को स्पष्ट करता है।
- source_word: וְהָיִיתִי בְעֵינָיו
  choice: मैं उन्हें ... लगूँ
  rationale: ‘उसकी आँखों में होना’ मूल्यांकन या धारणा का इब्रानी मुहावरा है; हिन्दी में ‘उन्हें लगूँ’ इसका सहज समतुल्य है।
- source_word: כִּמְתַעְתֵּעַ
  choice: छल करनेवाला
  rationale: यह कृदन्त किसी को भ्रमित करने, बहकाने या उसका उपहास करनेवाले व्यक्ति का संकेत दे सकता है। इस प्रसंग में ‘छल करनेवाला’ मुख्य अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהֵבֵאתִי עָלַי
  choice: मैं अपने ऊपर ... ले आऊँगा
  rationale: हिफ़ील रूप और עָלַי मिलकर अपने ऊपर कोई परिणाम लाने का भाव देते हैं।
- source_word: קְלָלָה וְלֹא בְרָכָה
  choice: आशीष नहीं, बल्कि शाप
  rationale: हिन्दी में विपरीत परिणामों का स्पष्ट और प्रभावी विरोध रखते हुए मूल अर्थ सुरक्षित रहता है।
