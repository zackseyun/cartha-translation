base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/012.yaml
  text: Perhaps my father will feel me[a], and I will seem to him like a deceiver[b], and I will bring a curse on myself and not a blessing.
translation:
  language: hi
  text: शायद मेरे पिता मुझे टटोलें[a], और मैं उन्हें छल करनेवाला[b] लगूँ; तब मैं अपने ऊपर शाप ले आऊँगा, आशीष नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे पिता मुझे छूएँ।” इब्रानी क्रिया का अर्थ हाथ से छूकर या टटोलकर जाँचना है, जो इस प्रसंग में इसहाक द्वारा याकूब की पहचान की शारीरिक पुष्टि करने के अनुरूप है।
    reason: lexical_alternative
  - marker: b
    text: या, “उपहास करनेवाला” अथवा “बहकानेवाला।” इब्रानी अभिव्यक्ति ऐसे व्यक्ति को सूचित कर सकती है जो किसी को धोखा देता या मूर्ख बनाता है।
    reason: lexical_alternative
