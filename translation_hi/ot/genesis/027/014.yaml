  text: So he went and took them and brought them to his mother[a], and his mother prepared tasty food, just as his father loved.
translation:
  language: hi
  text: तब वह गया, उन्हें लेकर अपनी माँ के पास आया, और उसकी माँ ने वैसा ही स्वादिष्ट भोजन तैयार किया जैसा उसके पिता को प्रिय था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: तब वह गया
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम व्यक्त करता है।
- source_word: וַיִּקַּח וַיָּבֵא לְאִמּוֹ
  choice: उन्हें लेकर अपनी माँ के पास आया
  rationale: क्रियाओं के निहित कर्म का संकेत पिछले पद के बकरी के बच्चों से मिलता है; हिन्दी में ‘उन्हें’ जोड़ना स्पष्ट और स्वाभाविक है।
- source_word: וַתַּעַשׂ אִמּוֹ
  choice: उसकी माँ ने ... तैयार किया
  rationale: भोजन के संदर्भ में עשה के लिए ‘तैयार किया’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
- source_word: מַטְעַמִּים
  choice: स्वादिष्ट भोजन
  rationale: यह शब्द विशेष रूप से बनाए गए रुचिकर व्यंजन या भोजन को दर्शाता है; ‘स्वादिष्ट भोजन’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: כַּאֲשֶׁר אָהֵב אָבִיו
  choice: वैसा ही ... जैसा उसके पिता को प्रिय था
  rationale: यह भोजन के प्रति इसहाक की जानी-पहचानी पसंद और כַּאֲשֶׁר की तुलनात्मक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
