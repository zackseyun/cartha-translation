base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/038.yaml
  text: Esau said to his father[a], “Do you have only one blessing, my father? Bless me too, my father!” Then Esau raised his voice and wept.
translation:
  language: hi
  text: एसाव ने अपने पिता से कहा[a], “मेरे पिता, क्या आपके पास केवल एक ही आशीष है? मुझे भी आशीष दीजिए, मेरे पिता!” तब एसाव ने अपनी आवाज़ उठाई और रोया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्या आशीष आपके लिए एक ही है, मेरे पिता?” इब्रानी में एसाव की व्यथा प्रकट होती है कि इसहाक के पास देने के लिए केवल एक ही आशीष है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרָכָה אַחַת הִוא לְךָ
  choice: क्या आपके पास केवल एक ही आशीष है?
  rationale: इब्रानी का क्रियारहित वाक्य शाब्दिक रूप से ‘क्या आशीष आपके लिए एक ही है?’ जैसा है। प्रसंग में यह विस्मय और व्यथा से भरा आलंकारिक प्रश्न है; चुना हुआ हिंदी रूप उसी अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אָבִי
  choice: हे मेरे पिता
  rationale: प्रथम पुरुष एकवचन प्रत्यय के कारण ‘मेरे’ स्पष्ट है। दोनों बार इसे बनाए रखने से एसाव की भावपूर्ण विनती और मूल की पुनरावृत्ति सुरक्षित रहती है।
- source_word: בָּרֲכֵנִי גַּם אָֽנִי
  choice: मुझे भी आशीष दीजिए
  rationale: आज्ञार्थक क्रिया और प्रथम पुरुष कर्म-प्रत्यय का सीधा अर्थ रखा गया है; גַּם אָֽנִי एसाव को भी आशीष पाने वालों में सम्मिलित करने की प्रार्थना पर बल देता है।
- source_word: וַיִּשָּׂא ... קֹלוֹ וַיֵּבְךְּ
  choice: फूट-फूटकर रोने लगा
  rationale: ‘अपनी आवाज़ उठाई और रोया’ विलाप के लिए प्रयुक्त इब्रानी अभिव्यक्ति है। हिंदी में ‘फूट-फूटकर रोने लगा’ ऊँची आवाज़ में भावावेशपूर्वक रोने का स्वाभाविक और अर्थसंगत रूप है।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
