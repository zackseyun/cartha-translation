  naturalness: The dialogue is generally natural and suitably dignified. “इन दो बार” is less idiomatic in this context than “दो बार,” while “ज्येष्ठाधिकार” is a precise, established, and concise term for the firstborn’s legal/familial entitlement.
  terminology: “याकूब,” “आशीष,” and “पछाड़ दिया” are suitable. “ज्येष्ठाधिकार” corrects the key familial-legal term without reducing it to merely a personal privilege. The footnote rightly preserves the Hebrew wordplay and the viable alternative senses of the verb.
  issues:
