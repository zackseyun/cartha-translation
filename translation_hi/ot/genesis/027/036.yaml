base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/036.yaml
  text: 'And he said[a], “Is he not rightly named Jacob? For he has supplanted me these two times: he took my birthright, and look, now he has taken my blessing.” And he said, “Have you not reserved a blessing for me?”'
translation:
  language: hi
  text: 'तब उसने कहा[a], “क्या उसका नाम याकूब ठीक ही नहीं रखा गया? क्योंकि उसने मुझे दो बार पछाड़ दिया है: मेरा ज्येष्ठाधिकार उसने ले लिया, और देखो, अब उसने मेरी आशीष भी ले ली।” फिर उसने कहा, “क्या आपने मेरे लिए कोई आशीष बचाकर नहीं रखी?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “याकूब” नाम और “मुझे पछाड़ दिया” के लिए प्रयुक्त क्रिया के बीच शब्द-क्रीड़ा है। उस क्रिया का अनुवाद “मुझे धोखा दिया” या “मुझसे बाज़ी मार ली” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי קָרָא שְׁמוֹ יַעֲקֹב
  choice: क्या उसका नाम याकूब ठीक ही नहीं रखा गया?
  rationale: प्रश्न की कटु व्यंग्यात्मकता और नाम पर आधारित शब्द-क्रीड़ा की भूमिका को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיַּעְקְבֵנִי
  choice: उसने ... मुझे पछाड़ दिया है
  rationale: क्रिया में किसी को पीछे करके उसका स्थान या लाभ ले लेने का भाव है। ‘पछाड़ दिया’ हिन्दी में यह भाव देता है, जबकि याकूब नाम के साथ इब्रानी ध्वनि-साम्य अनुवाद में अक्षुण्ण नहीं रखा जा सकता; इसलिए पाद-टिप्पणी दी गई है।
- source_word: זֶה פַעֲמַיִם
  choice: इन दो बार
  rationale: इब्रानी की बलाघाती अभिव्यक्ति को ‘दो बार’ तक सपाट किए बिना हिन्दी में निकटता से रखता है।
- source_word: בְּכֹרָתִי
  choice: मेरा पहलौठे का अधिकार
  rationale: पहले जन्मे पुत्र से जुड़े पारिवारिक और वैधानिक अधिकार का स्पष्ट, समझने योग्य अनुवाद।
- source_word: וְהִנֵּה עַתָּה
  choice: और देखो, अब
  rationale: עשाव की भावपूर्ण शिकायत में הִנֵּה का ध्यान खींचने वाला बल आधुनिक हिन्दी में बनाए रखता है।
- source_word: בִּרְכָתִי
  choice: मेरी आशीष
  rationale: पितृप्रधान आशीर्वचन के लिए प्रसंगानुकूल और प्रचलित बाइबलीय हिन्दी पद।
- source_word: הֲלֹא אָצַלְתָּ לִּי בְּרָכָה
  choice: क्या आपने मेरे लिए कोई आशीष बचाकर नहीं रखी?
  rationale: אָצַל के बचाकर या अलग रख देने के भाव तथा एसाव की विनती—कि उसके लिए अब भी कुछ आशीष शेष हो—को स्वाभाविक हिन्दी में व्यक्त करता है।
