    issue: “मेरा पहलौठे का अधिकार” is unidiomatic and structurally awkward.
    rationale: It does not naturally express the legal/familial birthright denoted by בְּכֹרָתִי. “मेरा ज्येष्ठाधिकार” is accurate and standard in a formal-modern biblical register.
  - severity: low
    issue: “इन दो बार” is unnecessarily awkward.
    rationale: The Hebrew idiom emphatically means “twice/two times.” “दो बार” is natural Hindi and retains the stated count; the surrounding complaint supplies the emphasis.
