base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/018.yaml
  text: So he went in to his father and said[a], “My father.” And he said, “Here I am. Who are you, my son?”
translation:
  language: hi
  text: तब वह अपने पिता के पास गया और बोला[a], “मेरे पिता!” उन्होंने कहा, “मैं यहाँ हूँ। मेरे बेटे, तुम कौन हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “और वह अपने पिता के पास आया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब वह ... के पास गया
  rationale: בוא का वय्यिक्तोल रूप कथा को आगे बढ़ाता है। प्रसंग में याकूब अपने पिता के पास पहुँचता है; ‘तब ... गया’ आधुनिक हिन्दी में गति और कथात्मक क्रम दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל אָבִיו
  choice: अपने पिता के पास
  rationale: אֶל दिशा या किसी व्यक्ति की ओर जाने को दर्शाता है और אָבִיו का अर्थ ‘उसका पिता’ है। हिन्दी में कर्ता की ओर संकेत के लिए ‘अपने पिता के पास’ स्वाभाविक है; मूल में पिता का नाम नहीं जोड़ा गया।
- source_word: וַיֹּאמֶר
  choice: और बोला / उन्होंने कहा
  rationale: यह सामान्य कथात्मक वचन-परिचय है। याकूब के लिए ‘बोला’ और पिता के सम्मानसूचक उल्लेख के लिए ‘उन्होंने कहा’ स्वाभाविक हिन्दी है।
- source_word: אָבִי
  choice: मेरे पिता
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित यह सीधा सम्बोधन है, जिसका शाब्दिक अर्थ ‘मेरे पिता’ है।
- source_word: הִנֶּנִּי
  choice: मैं यहाँ हूँ
  rationale: यह उपस्थिति और उत्तर देने की तत्परता बताने वाला प्रचलित इब्रानी प्रत्युत्तर है। ‘मैं यहाँ हूँ’ उसके मूल भाव को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: מִי אַתָּה
  choice: तुम कौन हो
  rationale: प्रश्नवाचक מִי और द्वितीय पुरुष एकवचन सर्वनाम सीधे सम्बोधित व्यक्ति की पहचान पूछते हैं।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित यह सम्बोधन ‘मेरे बेटे’ है; इससे मूल का आत्मीय व्यक्तिगत सम्बोधन बना रहता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पिता के लिए सम्मानसूचक बहुवचन ‘उन्होंने’ का प्रयोग किया गया है, जबकि प्रत्यक्ष सम्बोधन में मूल के एकवचन के अनुरूप ‘तुम’ रखा गया है। मुख्य पाठ का [a] चिह्न शब्दगत वैकल्पिक अनुवाद से जुड़ा है।
