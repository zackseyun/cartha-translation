base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/037.yaml
  text: Isaac answered and said to Esau[a], “Look, I have made him master over you, and I have given all his brothers to him as servants. I have sustained him with grain and new wine. What then can I do for you[c][b], my son?”
translation:
  language: hi
  text: इसहाक ने एसाव को उत्तर दिया, “देख, मैंने उसे तेरा स्वामी बनाया है और उसके सभी भाइयों को उसका सेवक[a] बना दिया है। मैंने अन्न और नई दाखमधु से उसका भरण-पोषण किया है[b]। तो अब, मेरे बेटे, मैं तेरे लिए क्या करूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दास”। इब्रानी शब्द संदर्भ के अनुसार सेवक या दास, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अन्न और नई दाखमधु देकर उसे सहारा दिया है” या “उसे आवश्यक वस्तुएँ उपलब्ध कराई हैं।” इब्रानी क्रिया सहारा देने, बनाए रखने या आवश्यक वस्तुएँ उपलब्ध कराने का भाव रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: संवाद में प्रत्युत्तर को सूचित करने वाला मानक कथात्मक प्रयोग; आधुनिक हिन्दी में स्वाभाविक और मूल के औपचारिक विन्यास के निकट है।
- source_word: הֵן
  choice: देख
  rationale: ध्यान आकर्षित करने और कथन पर बल देने वाले विस्मयादिबोधक का सहज आधुनिक हिन्दी रूप।
- source_word: גְּבִיר
  choice: स्वामी
  rationale: यह अधिकार और अधीनता के संबंध को व्यक्त करता है; यहाँ पारिवारिक प्रभुत्व का संदर्भ है, न कि कोई ईश्वरीय उपाधि।
- source_word: שַׂמְתִּיו לָךְ
  choice: मैंने उसे तेरा स्वामी बनाया है
  rationale: שׂים के साथ विधेय-संज्ञा किसी को एक पद या स्थिति देने का भाव रखती है; यह अनुवाद उस नियुक्ति और संबंधगत अधिकार दोनों को सुरक्षित रखता है।
- source_word: כָּל אֶחָיו
  choice: उसके सब भाइयों
  rationale: मूल में स्पष्ट पारिवारिक शब्द है; इसे व्यापक ‘कुटुम्बियों’ में बदलने की आवश्यकता नहीं है।
- source_word: לַעֲבָדִים
  choice: सेवक
  rationale: עבד संदर्भानुसार सेवक या दास दोनों हो सकता है। मुख्य पाठ में ‘सेवक’ अधीनता को स्पष्ट करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: דָגָן
  choice: अन्न
  rationale: धान्य या अनाज की उपज के लिए संक्षिप्त, परिचित और गरिमापूर्ण हिन्दी शब्द।
- source_word: תִּירֹשׁ
  choice: नई दाखमधु
  rationale: यह सामान्यतः नई या ताज़ी अंगूरी मदिरा को सूचित करता है; ‘नई दाखमधु’ कृषि-संबंधी विशेषता को बनाए रखती है।
- source_word: סְמַכְתִּיו
  choice: उसे सहारा दिया है
  rationale: मूल क्रिया थामने, सहारा देने या बनाए रखने का भाव रखती है। अन्न और दाखमधु के संदर्भ में इसमें उपलब्ध कराने और पोषण करने का आशय भी सम्मिलित है।
- source_word: וּלְכָה אֵפוֹא
  choice: तो अब ... तेरे लिए
  rationale: संयोजन परिणाम की ओर मुड़ता है और एसाव के लिए बची संभावना पर ध्यान देता है; हिन्दी विन्यास में इसके घटकों को स्वाभाविक स्थानों पर रखा गया है।
- source_word: מָה אֶעֱשֶׂה
  choice: मैं ... क्या करूँ
  rationale: मूल प्रश्न को संभाव्यता का अर्थ जोड़कर पूरी तरह बंद नहीं किया गया; इससे उसकी वास्तविक प्रश्नवाचकता और प्रसंगगत विवशता दोनों बनी रहती हैं।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: स्नेहपूर्ण प्रत्यक्ष पारिवारिक संबोधन का सरल और सटीक रूप।
theological_decisions:
- issue: इसहाक के प्रश्न में असमर्थता का भाव
  choice: “मैं तेरे लिए क्या करूँ?”
  alternative: “मैं तेरे लिए क्या कर सकता हूँ?”
  rationale: प्रसंग इसहाक की विवशता का संकेत देता है, पर मूल क्रिया में ‘सकना’ स्पष्ट रूप से नहीं है। इसलिए मुख्य पाठ मूल की खुली प्रश्नवाचकता रखता है और असमर्थता को अत्यधिक निश्चित नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संवादात्मक किंतु गरिमापूर्ण रखी गई है। ‘तेरा/तेरे’ प्राचीन पारिवारिक संवाद की निकटता और एकवचन संबोधन को स्वाभाविक ढंग से व्यक्त करते हैं। ‘नई दाखमधु’ स्रोत की कृषि-संबंधी विशिष्टता बनाए रखती है; कठिन शब्दों और अनावश्यक रूप से पुरातन वाक्य-विन्यास से बचा गया है।
