source:
  edition: WLC
  text: עַד שׁ֨וּב אַף אָחִ֜י/ךָ מִמְּ/ךָ֗ וְ/שָׁכַח֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתָ לּ֔/וֹ וְ/שָׁלַחְתִּ֖י וּ/לְקַחְתִּ֣י/ךָ מִ/שָּׁ֑ם לָ/מָ֥ה אֶשְׁכַּ֛ל גַּם שְׁנֵי/כֶ֖ם י֥וֹם אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/045.yaml
  text: until your brother’s anger turns away from you[a], and he forgets what you have done to him. Then I will send and bring you from there[c][b]. Why should I be bereaved of both of you in one day?
translation:
  language: hi
  text: जब तक तेरे भाई का क्रोध तुझ पर से हट न जाए[a] और वह भूल न जाए कि तूने उसके साथ क्या किया है। तब मैं किसी को भेजकर तुझे वहाँ से ले आऊँगी[b]। मैं एक ही दिन में तुम दोनों को क्यों खो दूँ?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “जब तक तेरे भाई का क्रोध तुझ पर से लौट न जाए।” इब्रानी में क्रोध के लिए ‘लौटना/मुड़ना’ क्रिया का मुहावरेदार प्रयोग हुआ है।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में मूलतः “मैं भेजूँगी और तुझे वहाँ से ले लूँगी” है। “किसी को भेजकर … ले आऊँगी” हिन्दी में दोनों क्रियाओं को स्पष्ट करता है।
    reason: lexical_alternative
  - marker: c
    text: “तुम दोनों को…खो दूँ” सम्भवतः इस संघर्ष के परिणामस्वरूप दोनों पुत्रों की हानि के भय को व्यक्त करता है; यह आवश्यक नहीं कि दोनों एक ही प्रकार से खोए जाएँ।
    reason: cultural_note
lexical_decisions:
- source_word: עַד שׁוּב אַף אָחִיךָ מִמְּךָ
  choice: जब तक तेरे भाई का क्रोध तुझ पर से हट न जाए
  rationale: שׁוּב का मूल अर्थ ‘लौटना/मुड़ना’ है, पर क्रोध के साथ यह उसके दूर हो जाने का मुहावरा है। ‘तुझ पर से हट न जाए’ आधुनिक हिन्दी में स्वाभाविक है और מִמְּךָ का सम्बन्ध भी बनाए रखता है।
- source_word: וְשָׁכַח אֵת אֲשֶׁר עָשִׂיתָ לוֹ
  choice: और वह भूल न जाए कि तूने उसके साथ क्या किया है
  rationale: यह पूर्व में किए गए कार्य को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘उसके साथ’ यहाँ לוֹ के प्रतिकूल प्रभाव वाले सम्बन्ध को स्वाभाविक रूप से बताता है।
- source_word: וְשָׁלַחְתִּי וּלְקַחְתִּיךָ מִשָּׁם
  choice: तब मैं किसी को भेजकर तुझे वहाँ से बुलवा लूँगी
  rationale: दोनों क्रियाओं—‘भेजना’ और ‘वहाँ से लेना’—को बनाए रखते हुए हिन्दी में रिबका द्वारा किसी को भेजकर याकूब को अपने पास मँगवाने का आशय स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: אֶשְׁכַּל גַּם שְׁנֵיכֶם
  choice: मैं ... तुम दोनों को क्यों खो दूँ?
  rationale: שׁכל सन्तान-वियोग का बोध कराता है। ‘तुम दोनों को खो दूँ’ साधारण पाठक के लिए ‘सन्तान-विहीन हो जाऊँ’ की तुलना में अधिक स्वाभाविक है और मातृ-वियोग की तीव्रता बनाए रखता है।
- source_word: יוֹם אֶחָד
  choice: एक ही दिन में
  rationale: यह एक दिन के भीतर दोनों पुत्रों को खोने की आशंका को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: रिबका के ‘दोनों’ पुत्रों को खोने का अभिप्राय
  choice: मुख्य पाठ में ‘तुम दोनों को खो दूँ’ रखकर हानि के साधन को अनिर्धारित रखा गया है।
  alternative: दोनों पुत्रों की मृत्यु को एक ही प्रकार से स्पष्ट करना।
  rationale: इब्रानी पाठ यह नहीं बताता कि दोनों की हानि ठीक किस प्रकार होगी; सम्भवतः एसाव द्वारा याकूब की हत्या और उसके परिणामस्वरूप एसाव की हानि—अलग-अलग साधनों से—अभिप्रेत हो सकती है। अनुवाद को यह अस्पष्टता नहीं मिटानी चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और संवादानुकूल रखी गई है। माता द्वारा पुत्र से सीधे संबोधन के कारण ‘तेरे/तुझे’ और दोनों पुत्रों के लिए ‘तुम दोनों’ का स्वाभाविक प्रयोग किया गया है।
