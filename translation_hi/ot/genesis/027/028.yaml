  text: וְ/יִֽתֶּן לְ/ךָ֙ הָ/אֱלֹהִ֔ים מִ/טַּל֙ הַ/שָּׁמַ֔יִם וּ/מִ/שְׁמַנֵּ֖י הָ/אָ֑רֶץ וְ/רֹ֥ב דָּגָ֖ן וְ/תִירֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/028.yaml
  text: May God give you some of the dew of heaven[a], and some of the richness of the earth, and an abundance of grain and new wine.
translation:
  language: hi
  text: परमेश्वर तुम्हें आकाश की ओस[a], धरती की उपजाऊ समृद्धि, और बहुतायत से अनाज और नया दाखमधु दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा जा सकता है: “आकाश की ओस में से कुछ और धरती की उर्वर समृद्धि में से कुछ।” इब्रानी में कृषि की उर्वरता और भरपूरी का चित्र है; “उपजाऊ समृद्धि” का अधिक शाब्दिक भाव “धरती की पुष्टता” है।'
    reason: מִן के संभावित अंशसूचक अर्थ और שְׁמַנֵּי के कृषि-संबंधी मुहावरे को स्पष्ट करना।
lexical_decisions:
- source_word: וְיִתֶּן
  choice: दे
  rationale: आशीर्वाद के प्रसंग में यह क्रियारूप कामना व्यक्त करता है; हिन्दी में वाक्य के अंत का ‘दे’ स्वाभाविक रूप से ‘ऐसा हो कि परमेश्वर दे’ का भाव पहुँचाता है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ निश्चित उपाधि के रूप में इस्राएल के परमेश्वर का उल्लेख है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ गरिमापूर्ण और स्पष्ट है।
- source_word: מִטַּל הַשָּׁמַיִם
  choice: आकाश की ओस
  rationale: यह कृषि-समृद्धि का काव्यात्मक चित्र है। מִן के अंशसूचक अर्थ की संभावना पादटिप्पणी में सुरक्षित रखी गई है, क्योंकि मुख्य पाठ में ‘ओस में से कुछ’ असहज हिन्दी होगी।
- source_word: וּמִשְׁמַנֵּי הָאָרֶץ
  choice: धरती की भरपूर उपज
  rationale: शाब्दिक ‘धरती की चिकनाई/पुष्टता’ यहाँ भूमि की उर्वरता और समृद्ध उपज का मुहावरा है; चुना हुआ रूप कृषि-संदर्भ को सहज हिन्दी में व्यक्त करता है।
- source_word: וְרֹב
  choice: बहुतायत से
  rationale: רֹב प्रचुरता या भरपूरी बताता है; ‘बहुतायत से’ आशीर्वचन की गरिमा और मात्रा दोनों को बनाए रखता है।
- source_word: דָּגָן
  choice: अनाज
  rationale: यह विभिन्न प्रकार के अन्न के लिए सामान्य शब्द है; ‘अनाज’ आधुनिक हिन्दी में स्पष्ट व्यापक समतुल्य है।
- source_word: וְתִירֹשׁ
  choice: नया दाखमधु
  rationale: תִּירוֹשׁ सामान्य मदिरा से भिन्न ताज़े या नए दाखमधु को सूचित करता है; यह रूप उस शब्दगत भेद को सुरक्षित रखता है।
theological_decisions:
- issue: कथन का स्वरूप
  choice: आशीर्वाद की कामना—‘परमेश्वर ... दे’
  alternative: साधारण भविष्यवाणी—‘परमेश्वर ... देगा’
  rationale: क्रियारूप और इसहाक के आशीर्वचन का प्रसंग इसे केवल भविष्यवाणी नहीं, बल्कि प्रभावपूर्ण आशीष-कामना के रूप में प्रस्तुत करते हैं।
- issue: מִן का अर्थ
  choice: मुख्य पाठ में स्वाभाविक हिन्दी; अंशसूचक संभावना पादटिप्पणी में
  alternative: ‘ओस में से कुछ ... उपज में से कुछ’
  rationale: दोनों מִן अंशसूचक हो सकते हैं, पर हिन्दी में उनका पूर्ण शाब्दिक दोहराव असहज है। पादटिप्पणी अर्थगत संभावना को बिना कृत्रिम मुख्य पाठ के सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु आशीर्वचन के अनुरूप गरिमापूर्ण रखी गई है। ‘दाखमधु’ कृषि-उत्पाद और תִּירוֹשׁ की विशिष्टता को ‘शराब’ की अपेक्षा बेहतर सुरक्षित रखता है।
