source:
  edition: WLC
  text: וַ/יִּגַּשׁ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יָּ֛רַח אֶת רֵ֥יחַ בְּגָדָ֖י/ו וַֽ/יְבָרֲכֵ֑/הוּ וַ/יֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔/י כְּ/רֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרֲכ֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
translation:
  language: hi
  text: तब वह पास आया और उसने उसे चूमा। इसहाक ने उसके वस्त्रों की गंध सूँघी, उसे आशीर्वाद दिया और कहा, “देखो, मेरे पुत्र की गंध उस खेत की गंध के समान है, जिस पर याहवे ने आशीष दी है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: तब वह पास आया
  rationale: नैरेटिव वय्यिक्तोल क्रम में निकट आने की क्रिया बताता है; ‘तब’ हिन्दी में घटनाक्रम को स्वाभाविक रूप से आगे बढ़ाता है।
- source_word: וַיִּשַּׁק לוֹ
  choice: और उसने उसे चूमा
  rationale: मूल पाठ केवल चूमने की क्रिया कहता है; स्नेह आदि कोई अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  choice: इसहाक ने उसके वस्त्रों की गंध सूँघी
  rationale: ‘गंध सूँघी’ मूल के क्रिया-संज्ञा संबंध को बनाए रखता है। स्पष्टता हेतु कर्ता का नाम दिया गया, क्योंकि लगातार आए सर्वनाम हिन्दी में भ्रम पैदा कर सकते हैं।
- source_word: בְּגָדָיו
  choice: उसके वस्त्रों
  rationale: ‘वस्त्र’ बहुवचन को सुरक्षित रखता है और आशीर्वाद के प्रसंग के अनुरूप गरिमापूर्ण, प्रचलित हिन्दी है।
- source_word: וַיְבָרֲכֵהוּ
  choice: उसे आशीर्वाद देते हुए
  rationale: आशीर्वाद और उसके कथन के घनिष्ठ संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि मूल क्रिया का अर्थ सुरक्षित है।
- source_word: רְאֵה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाला आज्ञार्थक प्रयोग; आधुनिक हिन्दी में स्वाभाविक और मूल से सीधा है।
- source_word: רֵיחַ בְּנִי ... כְּרֵיחַ שָׂדֶה
  choice: मेरे पुत्र की गंध उस खेत की गंध के समान है
  rationale: רֵיחַ की पुनरावृत्ति को दोनों स्थानों पर ‘गंध’ रखकर सुरक्षित किया गया है और כְּ के उपमार्थ को ‘के समान’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר בֵּרֲכוֹ יְהוָה
  choice: जिसे यहोवा ने आशीष दी है
  rationale: संबंधवाचक उपवाक्य और पूर्ण क्रिया से उत्पन्न वर्तमान दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्रामटन को उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम प्रत्यक्ष रूप से है। हिन्दी बाइबल-परंपरा और सामान्य पाठकीय पहचान में ‘यहोवा’ प्रचलित लिप्यंतरण है; ‘प्रभु’ नाम को उपाधि में बदल देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मूल में ‘गंध’ की आलंकारिक पुनरावृत्ति हिन्दी में भी बनाए रखी गई है। अस्पष्ट सर्वनाम-श्रृंखला से बचने के लिए दूसरे वाक्य में ‘इसहाक’ स्पष्ट किया गया है।
