  text: उसने कहा, “देखो, अब मैं बूढ़ा हो गया हूँ; मुझे अपनी मृत्यु का दिन मालूम नहीं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: देख, अब
  rationale: הִנֵּה श्रोता का ध्यान खींचता है और נָא कथन को प्रसंगानुकूल तात्कालिकता देता है; आधुनिक हिन्दी में यह संयोजन स्वाभाविक है।
- source_word: זָקַנְתִּי
  choice: मैं बूढ़ा हो गया हूँ
  rationale: हिब्रू पूर्ण क्रिया वर्तमान अवस्था तक पहुँचे वृद्ध होने को व्यक्त करती है।
- source_word: יֹום מוֹתִי
  choice: मेरी मृत्यु का दिन कब आएगा
  rationale: शाब्दिक अर्थ ‘मेरी मृत्यु का दिन’ है; ‘कब आएगा’ जोड़कर हिन्दी में לֹא יָדַעְתִּי के आशय को स्वाभाविक ढंग से व्यक्त किया गया है, बिना यह अर्थ बदले कि मृत्यु का समय अज्ञात है।
