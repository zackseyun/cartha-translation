  text: וַ/יֹּ֣אמֶר יַעֲקֹ֔ב אֶל רִבְקָ֖ה אִמּ֑/וֹ הֵ֣ן עֵשָׂ֤ו אָחִ/י֙ אִ֣ישׁ שָׂעִ֔ר וְ/אָנֹכִ֖י אִ֥ישׁ חָלָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/011.yaml
  text: But Jacob said to Rebekah his mother[a], “Look, Esau my brother is a hairy man[b], and I am a smooth man.”
translation:
  language: hi
  text: पर याकूब ने अपनी माँ रिबका से कहा, “देखो[a], मेरा भाई एसाव बालों वाला आदमी है, और मैं चिकनी त्वचा वाला आदमी हूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लो” अथवा “ध्यान दो”; यह शब्द याकूब की आपत्ति की ओर ध्यान खींचता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात याकूब के शरीर पर एसाव की तुलना में बाल नहीं थे।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर याकूब ने ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, पर प्रसंग में याकूब अपनी माँ की योजना पर आपत्ति जता रहा है; इसलिए ‘पर’ संबंध और विरोध—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל רִבְקָה אִמּוֹ
  choice: अपनी माँ रिबका से
  rationale: इब्रानी में नाम और संबंध दोनों दिए गए हैं। हिंदी की स्वाभाविक शब्दावली में दोनों को बनाए रखा गया है।
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान आकर्षित करके आपत्ति प्रस्तुत करने वाला अव्यय है। ‘देखो’ आधुनिक हिंदी में स्वाभाविक है और इसका संवादात्मक बल बनाए रखता है।
- source_word: אִישׁ שָׂעִר
  choice: रोएँदार पुरुष
  rationale: यह एसाव के शरीर पर बहुत बाल होने का संकेत देता है। ‘रोएँदार’ इस शारीरिक विशेषता को स्पष्ट रखता है और सामने वाले ‘चिकनी त्वचा वाला’ से सीधा विरोध बनाता है।
- source_word: וְאָנֹכִי
  choice: और मैं
  rationale: स्वतंत्र सर्वनाम אָנֹכִי याकूब पर बल देता है और एसाव से उसका विरोध उभारता है; ‘और मैं’ सरल संयोजक को बनाए रखते हुए यह प्रभाव देता है।
- source_word: אִישׁ חָלָק
  choice: चिकनी त्वचा वाला पुरुष
  rationale: חָלָק का मूल अर्थ ‘चिकना’ है, पर यहाँ शारीरिक बालों के अभाव का आशय है। केवल ‘चिकना पुरुष’ हिंदी में भ्रामक हो सकता है, इसलिए अर्थ को स्वाभाविक ढंग से स्पष्ट किया गया है।
