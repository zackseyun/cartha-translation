  edition: WLC
  text: וַ/יַּ֛עַן יִצְחָ֥ק אָבִ֖י/ו וַ/יֹּ֣אמֶר אֵלָ֑י/ו הִנֵּ֞ה מִ/שְׁמַנֵּ֤י הָ/אָ֨רֶץ֙ יִהְיֶ֣ה מֽוֹשָׁבֶ֔/ךָ וּ/מִ/טַּ֥ל הַ/שָּׁמַ֖יִם מֵ/עָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/039.yaml
  text: Then his father Isaac answered and said to him[a], “Behold, your dwelling shall be away from the richness of the earth, and away from the dew of heaven above.”
translation:
  language: hi
  text: तब उसके पिता इसहाक ने उसे उत्तर दिया, “देख, तेरा निवास धरती की उपजाऊ समृद्धि से दूर और ऊपर के आकाश की ओस से दूर होगा।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा निवास धरती की उपजाऊ समृद्धि से होगा, और ऊपर के आकाश की ओस से होगा।” इब्रानी पूर्वसर्ग का अर्थ यहाँ ‘से’ या ‘से दूर’—दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: कथात्मक संवाद में ענה का सामान्य अर्थ रखा गया है; यह हिंदी में स्वाभाविक और औपचारिक दोनों है।
- source_word: אָבִיו
  choice: उसके पिता
  rationale: יִצְחָק के साथ संबंधसूचक बल बनाए रखने के लिए ‘उसके पिता इसहाक’ कहा गया है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह गंभीर कथन की ओर ध्यान खींचने वाला सहज आधुनिक हिंदी प्रयोग है।
- source_word: מִשְׁמַנֵּי הָאָרֶץ
  choice: धरती की उपजाऊ समृद्धि से दूर
  rationale: שְׁמַנִּים की उर्वरता और भरपूरी की छवि को ‘उपजाऊ समृद्धि’ से व्यक्त किया गया है; מִן को मुख्य पाठ में वियोगसूचक माना गया है।
- source_word: מוֹשָׁבֶךָ
  choice: तेरा निवास
  rationale: यह स्थान अथवा रहने की दशा, दोनों के लिए संक्षिप्त और गरिमापूर्ण हिंदी है।
- source_word: וּמִטַּל הַשָּׁמַיִם
  choice: और ऊपर के आकाश की ओस से दूर
  rationale: दूसरे מִן को भी समानांतर वियोगसूचक अर्थ में लिया गया है, जबकि ‘ओस’ कृषि-समृद्धि की मूल छवि बचाती है।
- source_word: מֵעָל
  choice: ऊपर के
  rationale: आकाश की स्थानगत विशेषता को हिंदी में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: इसहाक के एसाव से कहे वचन में מִן का अर्थ
  choice: वियोगसूचक—‘से दूर’
  alternative: स्रोत/भागीदारीसूचक—‘से’ अथवा ‘की समृद्धि में’
  rationale: एसाव के लिए इस कथन का प्रसंग और याकूब को पद 28 में दिए गए आशीर्वाद से इसका विरोध वियोगसूचक अर्थ का समर्थन करते हैं। फिर भी इब्रानी पूर्वसर्ग दोनों प्रकार से समझा जा सकता है, इसलिए सकारात्मक पारंपरिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिंदी; ‘देख’ ध्यानाकर्षक הִנֵּה को स्वाभाविक रूप से व्यक्त करता है। मुख्य पाठ वियोगसूचक व्याख्या रखता है और वास्तविक इब्रानी अस्पष्टता पादटिप्पणी में स्पष्ट करता है।
