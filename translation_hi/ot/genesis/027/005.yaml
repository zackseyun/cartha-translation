  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। कृदंत की जारी क्रिया और दो समकालीन घटनाओं को स्पष्ट रखा गया है। दूसरे वाक्य में ‘फिर’ हिब्रू कथानक-क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
