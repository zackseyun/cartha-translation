translation:
  language: hi
  text: रिबका सुन रही थी जब इसहाक अपने पुत्र एसाव से बात कर रहा था। फिर एसाव शिकार करने और उसे लाने के लिए मैदान में चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/רִבְקָה שֹׁמַעַת
  choice: रिबका सुन रही थी
  rationale: स्त्रीलिंग एकवचन कृदंत שֹׁמַעַת यहाँ पृष्ठभूमि में चल रही क्रिया को व्यक्त करता है; ‘सुन रही थी’ उसके जारी रहने के भाव को स्वाभाविक हिन्दी में रखता है। आरंभिक וְ को अलग से ‘और/अब’ कहना आवश्यक नहीं, क्योंकि हिन्दी में दृश्य की प्रगति बिना कृत्रिम संयोजक के स्पष्ट है।
- source_word: בְּ/דַבֵּר יִצְחָק
  choice: जब इसहाक ... बात कर रहा था
  rationale: בְּ के साथ infinitive construct समकालीन क्रिया बताता है। ‘जब ... बात कर रहा था’ रिबका के सुनने और इसहाक के बोलने के समयगत मेल को स्पष्ट करता है।
- source_word: אֶל עֵשָׂו בְּנ/וֹ
  choice: अपने पुत्र एसाव से
  rationale: אֶל यहाँ संबोधित व्यक्ति को सूचित करता है; हिन्दी में ‘से बात करना’ स्वाभाविक है। ‘अपने पुत्र’ प्रत्यय के संबंध को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: וַ/יֵּלֶךְ עֵשָׂו הַ/שָּׂדֶה
  choice: फिर एसाव ... मैदान में चला गया
  rationale: wayyiqtol कथानक को आगे बढ़ाता है, इसलिए ‘फिर’ क्रम को स्वाभाविक हिन्दी में दर्शाता है। שׂדה का सीधा और संदर्भानुकूल रूप ‘मैदान’ है।
- source_word: לָ/צוּד צַיִד לְ/הָבִיא
  choice: शिकार करके लाने के लिए
  rationale: צוד ציד का स्वाभाविक हिन्दी रूप ‘शिकार करना’ है; लְהָבִיא उद्देश्य और शिकार को वापस लाने की अपेक्षा व्यक्त करता है। यह रूप किसी विशेष पशु का अनावश्यक निर्धारण नहीं करता।
