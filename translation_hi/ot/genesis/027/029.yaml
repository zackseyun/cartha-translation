id: GEN.27.29
reference: Genesis 27:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יַֽעַבְד֣וּ/ךָ עַמִּ֗ים ו/ישתחו לְ/ךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְ/אַחֶ֔י/ךָ וְ/יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֣י אִמֶּ֑/ךָ אֹרְרֶ֣י/ךָ אָר֔וּר וּֽ/מְבָרֲכֶ֖י/ךָ בָּרֽוּךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/029.yaml
  text: Let peoples serve you[a], and nations bow down to you. Be master over your brothers, and let your mother's sons bow down to you. Cursed be those who curse you[b], and blessed be those who bless you.
translation:
  language: hi
  text: जातियाँ तेरी सेवा करें, और राष्ट्र तेरे आगे झुकें। तू अपने भाइयों का स्वामी हो, और तेरी माता के पुत्र तेरे आगे झुकें। जो तुझे शाप दें वे शापित हों, और जो तुझे आशीर्वाद दें वे धन्य हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַבְדוּךָ
  choice: तेरी सेवा करें
  rationale: עבד के क़ाल रूप में यहाँ केवल काम करना नहीं, बल्कि अधीन होकर सेवा करना अभिप्रेत है; हिंदी में यह वाक्यांश दोनों आयामों को स्वाभाविक रूप से रखता है।
- source_word: עַמִּים
  choice: देश-देश के लोग
  rationale: बहुवचन सामूहिक ‘लोगों/जनसमुदायों’ का अर्थ व्यक्त करता है और अगले समानांतर पद ‘राष्ट्र’ से हिंदी में स्पष्ट भेद बनाए रखता है।
- source_word: וְיִשְׁתַּחֲווּ לְךָ
  choice: तेरे आगे दण्डवत् करें
  rationale: השתחוה श्रेष्ठ व्यक्ति के सामने भूमि तक झुकने या दण्डवत् करने का संकेत देता है। मानव प्राप्तकर्ता के इस प्रसंग में ‘आराधना’ अर्थ को अनावश्यक रूप से दिव्य बना देता।
- source_word: לְאֻמִּים
  choice: राष्ट्र
  rationale: עמים के काव्यात्मक समानांतर के रूप में बड़े जनसमूहों को दर्शाता है; ‘राष्ट्र’ आधुनिक हिंदी में संक्षिप्त और बोधगम्य है।
- source_word: הֱוֵה גְבִיר
  choice: तू ... स्वामी हो
  rationale: הוה के साथ גביר प्रभुत्व की स्थिति के लिए आशीर्वादात्मक आज्ञार्थ देता है। ‘स्वामी’ पारिवारिक संबंध में अधिकार व्यक्त करता है, यद्यपि हिंदी में इसका अन्य संदर्भों में धार्मिक प्रयोग भी हो सकता है।
- source_word: לְאַחֶיךָ
  choice: अपने भाइयों का
  rationale: גביר के साथ ל संबंध पर अधिकार या प्रभुत्व बताता है; हिंदी का संबंधकारक ‘का’ ‘स्वामी’ के साथ स्वाभाविक है।
- source_word: בְּנֵי אִמֶּךָ
  choice: तेरी माता के पुत्र
  rationale: मूल की विशिष्ट पारिवारिक अभिव्यक्ति को सुरक्षित रखता है और इसे सामान्य ‘भाई-बन्धु’ में नहीं बदलता।
- source_word: אֹרְרֶיךָ אָרוּר
  choice: जो तुझे शाप दें वे शापित हों
  rationale: कृदन्त और विधेय के पारस्परिक शाप-सूत्र को हिंदी में औपचारिक, आशीर्वादात्मक शैली में व्यक्त करता है।
- source_word: וּמְבָרֲכֶיךָ בָּרוּךְ
  choice: और जो तुझे आशीर्वाद दें वे आशीष पाएँ
  rationale: पूर्ववर्ती शाप-सूत्र की समानांतरता बनाए रखते हुए बोधगम्य हिंदी देता है; इब्रानी एकवचन विधेय बहुवचन समूह के लिए सामूहिक रूप से प्रयुक्त है।
theological_decisions:
- issue: मानव व्यक्ति के प्रति השתחוה का अर्थ
  choice: दण्डवत् करें
  alternative: तेरी आराधना करें; तुझे प्रणाम करें
  rationale: क्रिया मनुष्य या परमेश्वर के सामने झुकने के लिए प्रयुक्त हो सकती है। इस पारिवारिक और राजनीतिक प्रभुत्व के प्रसंग में ‘दण्डवत्’ शारीरिक अधीनता/सम्मान को सुरक्षित रखता है, जबकि ‘आराधना’ पाठ से अधिक धार्मिक निष्कर्ष जोड़ सकती है।
- issue: גביר के लिए अधिकार-सूचक पद
  choice: स्वामी
  alternative: प्रभु; शासक
  rationale: यहाँ शब्द भाइयों पर पारिवारिक प्रभुत्व बताता है। ‘स्वामी’ उस संबंध को व्यक्त करता है; ‘प्रभु’ ईश्वरीय उपाधि का अनचाहा आभास दे सकता है और ‘शासक’ अर्थ को राजनीतिक पद तक सीमित कर सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। एकवचन अनौपचारिक-संबंधात्मक ‘तू/तेरी’ पितृ-आशीर्वाद के सीधे संबोधन और मूल के 2ms रूप को दर्शाता है। ‘दण्डवत्’ मूल क्रिया की शारीरिक अधीनता को बनाए रखता है; किसी फुटनोट की आवश्यकता नहीं समझी गई।
