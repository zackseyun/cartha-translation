  text: הָבִ֨יאָ/ה לִּ֥/י צַ֛יִד וַ/עֲשֵׂה לִ֥/י מַטְעַמִּ֖ים וְ/אֹכֵ֑לָה וַ/אֲבָרֶכְ/כָ֛ה לִ/פְנֵ֥י יְהוָ֖ה לִ/פְנֵ֥י מוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/007.yaml
  text: Bring me game and make me tasty food[b][a], so that I may eat and bless you before Yahweh before I die.’
translation:
  language: hi
  text: ‘मेरे लिए शिकार ले आ और मेरे लिए स्वादिष्ट भोजन[a] बना, ताकि मैं खाऊँ और मरने से पहले याहवे[b] के सामने तुझे आशीर्वाद दूँ।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वादिष्ट व्यंजन।” इब्रानी शब्द विशेष रूप से तैयार किए गए स्वादिष्ट पकवानों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में परमेश्वर का विशिष्ट नाम יהוה है। इसे यहाँ “याहवे” लिखा गया है; अनेक हिन्दी अनुवादों में “यहोवा” या “प्रभु” मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הָבִיאָה לִי צַיִד
  choice: मेरे लिए शिकार का मांस ले आ
  rationale: הָבִיאָה एकवचन पुल्लिंग आज्ञार्थक है और צַיִד शिकार में पकड़े गए पशु या उसके मांस को दर्शाता है। प्रसंग भोजन बनाने का है, इसलिए ‘शिकार का मांस’ स्वाभाविक और स्पष्ट है।
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: मेरे लिए स्वादिष्ट भोजन बना
  rationale: מַטְעַמִּים विशेष रूप से तैयार किए गए स्वादिष्ट व्यंजनों को दर्शाता है। ‘स्वादिष्ट भोजन’ सामान्य आधुनिक हिन्दी में सहज है; वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: וְאֹכֵלָה וַאֲבָרֶכְכָה
  choice: ताकि मैं खाऊँ और ... तुझे आशीर्वाद दूँ
  rationale: दोनों क्रियाएँ cohortative रूप में हैं और आज्ञाओं के बाद वक्ता के उद्देश्य को व्यक्त करती हैं। ‘ताकि’ इस प्रयोजनात्मक संबंध को बनाए रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने/उपस्थिति में’ है। יְהוָה को उसके प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, जबकि विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: לִפְנֵי מוֹתִי
  choice: मरने से पहले
  rationale: शाब्दिक भाव ‘मेरी मृत्यु से पहले’ है; हिन्दी में ‘मरने से पहले’ अधिक स्वाभाविक है और अर्थ को ठीक रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला विशिष्ट ईश्वरीय नाम है। मुख्य पाठ में हिन्दी बाइबलीय परंपरा में परिचित ‘यहोवा’ रखा गया है; ‘याहवे’ को संभावित उच्चारण और ‘प्रभु’ को पारंपरिक प्रतिस्थापन के रूप में पाद-टिप्पणी में बताया गया है।
- issue: आशीर्वाद का יְהוָה के सामने दिया जाना
  choice: यहोवा के सामने तुझे आशीर्वाद दूँ
  alternative: यहोवा की उपस्थिति में तुझे आशीर्वाद दूँ
  rationale: यह वाक्य आशीर्वाद को ईश्वरीय उपस्थिति के संदर्भ में रखता है। ‘के सामने’ मूल के निकट रहते हुए किसी अतिरिक्त धार्मिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। पारिवारिक संवाद के अनुरूप एकवचन आत्मीय संबोधन ‘तू/तुझे’ रखा गया है। ‘शिकार का मांस’ भोजन-संदर्भ को स्पष्ट करता है, और उद्देश्यसूचक क्रियारूपों के लिए ‘ताकि’ प्रयोग किया गया है।
