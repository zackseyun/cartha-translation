base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/025.yaml
  text: And he said[a], “Bring it near to me, and I will eat of my son’s game, so that my soul may bless you.” So he brought it near to him, and he ate; and he brought him wine, and he drank.
translation:
  language: hi
  text: इसहाक ने कहा,[क] “उसे मेरे पास ले आ, और मैं अपने बेटे के शिकार में से खाऊँगा, ताकि मेरा प्राण तुझे आशीर्वाद दे।” तब याकूब उसे इसहाक के पास ले आया, और इसहाक ने खाया। फिर याकूब इसहाक के पास दाखमधु ले आया, और इसहाक ने पिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: 'अथवा, मुहावरे के अनुसार: “ताकि मैं तुझे आशीर्वाद दूँ।” हिब्रू: “ताकि मेरा प्राण तुझे आशीर्वाद दे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּשָׁה
  choice: उसे मेरे पास ले आ
  rationale: हिफ़ील आज्ञार्थक का अर्थ किसी वस्तु को पास लाना या प्रस्तुत करना है। संदर्भ से निहित कर्म को ‘उसे’ से व्यक्त किया गया है।
- source_word: וְאֹכְלָה
  choice: और मैं ... खाऊँगा
  rationale: प्रथम पुरुष कोहोर्टेटिव इसहाक की इच्छा या अभिप्राय व्यक्त करता है; यह रूप हिंदी में आज्ञा के बाद स्वाभाविक क्रम बनाए रखता है।
- source_word: מִצֵּיד בְּנִי
  choice: अपने बेटे के शिकार में से
  rationale: צַיִד शिकार करके लाए गए मांस या आखेट को दर्शाता है। ‘शिकार में से’ מִן के अंशवाचक भाव को स्पष्ट रखता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह प्रयोजन सूचक है; आधुनिक हिंदी में ‘ताकि’ उसका सहज और स्पष्ट रूप है।
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: मेरा प्राण तुझे आशीर्वाद दे
  rationale: हिब्रू में נַפְשִׁי स्पष्ट रूप से क्रिया का कर्ता है। ‘मेरा प्राण’ मूल की गंभीर व्यक्तिगत अभिव्यक्ति को बनाए रखता है, उसे केवल ‘मैं’ में नहीं समेटता।
- source_word: וַיַּגֶּשׁ לוֹ
  choice: वह उसे उसके पास ले आया
  rationale: यह पहले प्रयुक्त נגשׁ को दोहराता है; ‘पास ले आया’ आज्ञा और उसके पालन के बीच का शाब्दिक संबंध बनाए रखता है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: יַיִן का मानक, गरिमापूर्ण हिंदी बाइबलीय पर्याय; संदर्भ में इसे नरम करने या विस्तार देने का कारण नहीं है।
- source_word: וַיֵּשְׁתְּ
  choice: और उसने पिया
  rationale: שׁתה का साधारण कथात्मक रूप सीधे और स्वाभाविक ढंग से प्रस्तुत किया गया है।
theological_decisions:
- issue: תְּבָרֶכְךָ נַפְשִׁי में ‘प्राण’ की भूमिका
  choice: मेरा प्राण तुझे आशीर्वाद दे
  alternative: मैं तुझे आशीर्वाद दूँ
  rationale: मूल में ‘मेरा प्राण’ व्याकरणिक कर्ता है। इसे बनाए रखने से हिब्रू की अभिव्यक्ति और आशीर्वाद की गंभीर व्यक्तिगत तीव्रता सुरक्षित रहती है, बिना ‘प्राण’ के बारे में कोई पृथक दार्शनिक या सांप्रदायिक सिद्धांत आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘तू/तुझे’ पारिवारिक एकवचन संबोधन को दर्शाता है। मूल की ‘मेरा प्राण’ अभिव्यक्ति जानबूझकर सुरक्षित रखी गई है; इसलिए किसी पादटिप्पणी की आवश्यकता नहीं मानी गई।
