translation:
  language: hi
  text: 'और रिबका ने अपने बेटे याकूब से कहा, “देख, मैंने तेरे पिता को तेरे भाई एसाव से यह कहते सुना:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרִבְקָה אָמְרָה
  choice: और रिबका ने … कहा
  rationale: संयोजक וְ को ‘और’ रखकर कथानक का प्रवाह बिना अनावश्यक कालक्रम जोड़े सुरक्षित किया गया है; אָמְרָה के लिए सामान्य और स्वाभाविक ‘कहा’ चुना गया है।
- source_word: אֶל־יַעֲקֹב בְּנָהּ
  choice: अपने बेटे याकूब से
  rationale: हिब्रू में ‘याकूब’ और ‘उसका बेटा’ का समानाधिकरण है। हिन्दी में ‘अपने बेटे याकूब’ स्वाभाविक रूप से वही संबंध व्यक्त करता है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह शब्द आगे की बात की ओर ध्यान खींचता है। ‘देख’ आधुनिक, संक्षिप्त और प्रसंगानुकूल है; ‘सुन’ अर्थ को केवल श्रवण तक सीमित कर देता।
- source_word: שָׁמַעְתִּי
  choice: मैंने … सुना
  rationale: पूर्ण क्रिया यहाँ बीती हुई, पूरी घटना बताती है; हिन्दी का सामान्य पूर्ण भूतकाल उपयुक्त है।
- source_word: אֶת־אָבִיךָ
  choice: तेरे पिता को
  rationale: प्रत्यक्ष कर्म-चिह्न אֶת का पृथक अनुवाद नहीं होता। एकवचन निकट संबोधन के अनुरूप ‘तेरे’ चुना गया है।
- source_word: מְדַבֵּר אֶל־עֵשָׂו אָחִיךָ לֵאמֹר
  choice: तेरे भाई एसाव से यह कहते
  rationale: प्रतिभागी रूप מְדַבֵּר और अंतिम לֵאמֹר मिलकर उस कथन का परिचय देते हैं जिसे अगले पद में उद्धृत किया गया है। ‘यह कहते सुना’ हिन्दी में स्वाभाविक है और दोहरे ‘बोलते हुए… कहते हुए’ से बचता है।
- source_word: עֵשָׂו אָחִיךָ
  choice: तेरे भाई एसाव
  rationale: मूल के समानाधिकरण को स्पष्ट और सहज हिन्दी क्रम में रखा गया है।
