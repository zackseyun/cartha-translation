translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। रिबका के याकूब से पारिवारिक, एकवचन संबोधन के लिए ‘तेरे’ का प्रयोग किया गया है। पद अगले पद में आने वाले अंतर्निहित उद्धरण की भूमिका पर समाप्त होता है, इसलिए अंत में द्विबिंदु रखा गया है।
