lexical_decisions:
- source_word: הִכִּירוֹ
  choice: उसे पहचान न सका
  rationale: हिफ़ील रूप यहाँ किसी व्यक्ति की पहचान कर पाने के अर्थ में है; प्रसंग में इसहाक स्पर्श से याकूब को पहचान नहीं पाता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय इसहाक के याकूब को न पहचान पाने का कारण प्रस्तुत करता है।
- source_word: יָדָיו
  choice: उसके हाथ
  rationale: बहुवचन संज्ञा और तृतीय पुरुष एकवचन प्रत्यय का सीधा तथा स्वाभाविक अनुवाद।
- source_word: כִּידֵי
  choice: के हाथों के समान
  rationale: उपसर्ग כ तुलना प्रकट करता है; यह हिंदी में तुलना को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָחִיו
  choice: उसके भाई
  rationale: मूल का सीधा संबंधसूचक अनुवाद, यहाँ याकूब के भाई एसाव के लिए।
- source_word: שְׂעִרֹת
  choice: रोएँदार
  rationale: विशेषण हाथों की स्पर्शगत विशेषता बताता है; 'रोएँदार' वर्तमान हिंदी में स्वाभाविक है और प्रसंग की छल-युक्ति को ठीक व्यक्त करता है।
- source_word: וַיְבָרְכֵהוּ
  choice: इसलिए उसने उसे आशीर्वाद दिया
  rationale: वाव-क्रम कथा को आगे बढ़ाता है और प्रसंग में परिणाम का भाव भी बनता है; 'इसलिए' इस प्रवाह को व्यक्त करता है।
