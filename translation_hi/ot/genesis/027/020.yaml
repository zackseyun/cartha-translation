base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
translation:
  language: hi
  text: तब इसहाक ने अपने बेटे से कहा, “मेरे बेटे, तुम्हें यह इतनी जल्दी कैसे मिल गया?” उसने उत्तर दिया, “क्योंकि याहवे आपके परमेश्वर ने इसे मेरे सामने घटित कराया।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि याहवे आपके परमेश्वर ने मुझे सफलता दी”; मूल वाक्यांश का अधिक शाब्दिक अर्थ है, “इसे मेरे सामने घटित कराया।”
    reason: הִקְרָה ... לְפָנַי के कारणवाचक भाव और उसके सम्भव मुहावरेदार अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: מַה זֶּה מִהַרְתָּ לִמְצֹא
  choice: तुम्हें यह इतनी जल्दी कैसे मिल गया?
  rationale: यह अभिव्यक्ति इसहाक के आश्चर्य और पूछताछ को स्वाभाविक हिन्दी में व्यक्त करती है। מִהַרְתָּ का मूल भाव ‘जल्दी करना’ है, जबकि पूरे वाक्यांश का प्रसंगगत अर्थ इतनी जल्दी पा लेने पर आश्चर्य है।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: प्रथम पुरुष एकवचन स्वामित्वसूचक प्रत्यय और स्नेहपूर्ण प्रत्यक्ष संबोधन, दोनों सुरक्षित रहते हैं।
- source_word: הִקְרָה ... לְפָנַי
  choice: ऐसा किया कि वह मेरे सामने आ गया
  rationale: हिफ़ील क्रिया के कारणवाचक भाव और לְפָנַי के शाब्दिक ‘मेरे सामने’ को जोड़ते हुए स्वाभाविक हिन्दी दी गई है; इससे ‘लाकर देने’ जैसी स्पष्ट क्रिया मूल में जोड़े बिना दैवी व्यवस्था का संकेत बना रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: आपके परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय का महत्त्वपूर्ण ‘आपके’ भाव सुरक्षित रखा गया है; पिता से पुत्र के सम्मानपूर्ण संबोधन के कारण हिन्दी में ‘आपके’ स्वाभाविक है।
theological_decisions:
- issue: הִקְרָה में दैवी कारण और प्रावधान का भाव
  choice: ऐसा किया कि वह मेरे सामने आ गया
  alternative: मुझे सफलता दी / उसे मेरे पास पहुँचा दिया
  rationale: मूल पाठ शीघ्र प्राप्ति को परमेश्वर की कारणकारी व्यवस्था से जोड़ता है, पर यह ठीक-ठीक नहीं बताता कि उसने वस्तु को ‘लाकर दिया’। चुना हुआ अनुवाद इस अस्पष्टता और कथानक के तनाव को बनाए रखता है।
- issue: याकूब का ‘आपके परमेश्वर’ कहना
  choice: याहवे, आपके परमेश्वर
  alternative: याहवे, हमारे परमेश्वर / याहवे परमेश्वर
  rationale: मूल का द्वितीय पुरुष प्रत्यय जानबूझकर सुरक्षित रखा गया है; इसे ‘हमारे’ में बदलने से कथानक और धार्मिक तनाव अनावश्यक रूप से हल हो जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली रखी गई है। इसहाक अपने पुत्र को ‘तुम’ कहता है और पुत्र पिता के लिए सम्मानसूचक ‘आपके’ प्रयोग करता है।
