base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/022.yaml
  text: So Jacob went near to Isaac his father[a], and he felt him and said, “The voice is Jacob’s voice, but the hands are Esau’s hands.”
translation:
  language: hi
  text: तब याकूब अपने पिता इसहाक के पास गया। इसहाक ने उसे टटोलकर कहा, “आवाज़ तो याकूब की आवाज़ है, पर हाथ एसाव के हाथ हैं।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “आवाज़ याकूब की आवाज़ है, और हाथ एसाव के हाथ हैं।”'
    reason: मूल इब्रानी में दोनों उपवाक्य साधारण संयोजक ‘और’ से जुड़े हैं; प्रसंग में उसका विरोधसूचक भाव है, जिसे मुख्य पाठ में ‘पर’ से व्यक्त किया गया है।
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: पास गया
  rationale: नגשׁ के काल रूप में निकट आने का भाव है। ‘पास गया’ कथा की गति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיְמֻשֵּׁהוּ
  choice: उसे टटोलकर
  rationale: מושׁ यहाँ पहचान जाँचने के लिए स्पर्श करने को दर्शाता है। ‘टटोलकर’ साधारण छूने के बजाय जानबूझकर की गई स्पर्श-जाँच को स्पष्ट करता है।
- source_word: הַקֹּל
  choice: आवाज़
  rationale: קוֹל का अर्थ ‘आवाज़’ या ‘ध्वनि’ हो सकता है; यहाँ इसहाक बोलने वाले की पहचान उसकी आवाज़ से कर रहा है, इसलिए ‘आवाज़’ अधिक सटीक है।
- source_word: קוֹל יַעֲקֹב
  choice: याकूब की आवाज़
  rationale: इब्रानी संबंधसूचक संरचना को स्वाभाविक हिन्दी में अधिकारसूचक रूप से प्रस्तुत किया गया है।
- source_word: וְהַיָּדַיִם יְדֵי עֵשָׂו
  choice: पर हाथ एसाव के हाथ हैं
  rationale: मूल में क्रियारहित उपवाक्य और ‘हाथ’ की पुनरावृत्ति है। हिन्दी में ‘पर’ दोनों प्रमाणों का निहित विरोध स्पष्ट करता है, जबकि पुनरावृत्ति मूल के बल को बनाए रखती है।
- source_word: אָבִיו
  choice: अपने पिता
  rationale: संबंधसूचक पद को मूल के अनुसार स्पष्ट रखा गया है; हिन्दी में कर्ता याकूब होने के कारण ‘अपने पिता’ स्वाभाविक है।
