  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘टटोलकर’ इसहाक द्वारा पहचान की स्पर्श-जाँच को व्यक्त करता है। संवाद में ‘तो ... पर’ स्वाभाविक हिन्दी विरोध को उभारता है, जबकि पादटिप्पणी मूल की अधिक शाब्दिक संरचना सुरक्षित रखती है।
