  text: וְ/עַל חַרְבְּ/ךָ֣ תִֽחְיֶ֔ה וְ/אֶת אָחִ֖י/ךָ תַּעֲבֹ֑ד וְ/הָיָה֙ כַּ/אֲשֶׁ֣ר תָּרִ֔יד וּ/פָרַקְתָּ֥ עֻלּ֖/וֹ מֵ/עַ֥ל צַוָּארֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/040.yaml
  text: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
translation:
  language: hi
  text: तू अपनी तलवार के सहारे जीवित रहेगा और अपने भाई की सेवा करेगा; लेकिन जब तू बंधन तोड़कर निकलेगा[a], तब उसका जूआ अपनी गर्दन पर से उतार फेंकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तू बेचैन हो उठेगा।” इब्रानी क्रिया תָּרִיד का अर्थ यहाँ अनिश्चित है। अगले वाक्यांश में जूआ उतार फेंकने का चित्र “बंधन तोड़कर निकलने” के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל חַרְבְּךָ תִחְיֶה
  choice: तू अपनी तलवार के सहारे जीवित रहेगा
  rationale: עַל यहाँ साधन का भाव देता है; ‘तलवार के सहारे’ हिंसा अथवा युद्ध पर निर्भर जीवन के ठोस चित्र को बनाए रखता है।
- source_word: וְאֶת אָחִיךָ תַּעֲבֹד
  choice: और अपने भाई की सेवा करेगा
  rationale: עבד का सीधा अर्थ ‘सेवा करना’ है; यह अधीनता का भाव रखता है, पर उसके राजनीतिक स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: תָּרִיד
  choice: तू बंधन तोड़कर निकलेगा
  rationale: यह कठिन क्रिया अगले वाक्यांश में जूआ उतार फेंकने के संदर्भ में जबरन स्वतंत्र होने का संकेत देती है। ‘बेचैन हो उठेगा’ भी संभव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
- source_word: וּפָרַקְתָּ עֻלּוֹ
  choice: तब उसका जूआ ... उतार फेंकेगा
  rationale: פרק में बलपूर्वक अलग करने या तोड़ डालने का भाव है। ‘जूआ’ עֹל के ठोस रूपक और प्रभुत्व के संकेत दोनों को सुरक्षित रखता है।
- source_word: מֵעַל צַוָּארֶךָ
  choice: अपनी गर्दन पर से
  rationale: यह स्वाभाविक हिन्दी में मֵעַל के ‘ऊपर से हटाने’ के सजीव स्थानिक चित्र को व्यक्त करता है।
theological_decisions:
- issue: एसाव का याकूब के अधीन रहना और बाद में मुक्त होना
  choice: भाई की सेवा और फिर उसके जूए को उतार फेंकने के रूप में अनुवाद
  alternative: इसे स्थायी दासता, केवल पारिवारिक आदर, अथवा बाद के एदोमी इतिहास की स्पष्ट भविष्यवाणी के रूप में व्याख्यायित करना
  rationale: पद स्वयं अधीनता और बाद की मुक्ति के बीच तनाव रखता है। अनुवाद इसी तनाव को बनाए रखता है और इससे आगे कोई साम्प्रदायिक या ऐतिहासिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में एकवचन ‘तू’ मूल के निकट और पितृवचन के प्रसंग में स्वाभाविक है। भाषा गरिमामय पर सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘जूआ’ पारंपरिक किन्तु आज भी समझ में आने वाला ठोस रूपक है।
