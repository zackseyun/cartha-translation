base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/015.yaml
  text: Then Rebekah took the choice garments of Esau her older son[a], which were with her in the house[b], and put them on Jacob her younger son.
translation:
  language: hi
  text: तब रिबका ने अपने बड़े बेटे एसाव के चुने हुए वस्त्र[a] लिए, जो उसके पास घर में थे[b], और उन्हें अपने छोटे बेटे याकूब को पहना दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एसाव के सबसे अच्छे वस्त्र।”
    reason: lexical_alternative
  - marker: b
    text: या, “जो उसके घर में थे”; हिब्रू में अधिक शाब्दिक रूप से, “जो उसके साथ घर में थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: तब ... लिए
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּגְדֵי
  choice: वस्त्र
  rationale: यह बहुवचन में पहनने की वस्तुओं को सूचित करता है; ‘वस्त्र’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: הַחֲמֻדֹת
  choice: मनपसंद
  rationale: मूल शब्द वांछनीय, प्रिय या मूल्यवान होने का भाव रखता है। ‘मनपसंद’ इस भाव को सुरक्षित रखता है और ‘सबसे अच्छे’ जैसी अनावश्यक अतिशयोक्ति से बचता है।
- source_word: בְּנָהּ הַגָּדֹל
  choice: अपने बड़े बेटे
  rationale: पारिवारिक संदर्भ में גָּדוֹל आयु में बड़े पुत्र को दर्शाता है और आगे आए קָטָן के विपरीत है।
- source_word: אֲשֶׁר אִתָּהּ בַּבָּיִת
  choice: जो उसके पास घर में थे
  rationale: यह इब्रानी की स्थान और निकट-अधिकार बताने वाली अभिव्यक्ति का निकट और स्वाभाविक हिन्दी रूप है।
- source_word: וַתַּלְבֵּשׁ
  choice: पहना दिया
  rationale: क्रिया किसी दूसरे को वस्त्र पहनाने को दर्शाती है; हिन्दी में यह कर्मवाचक आशय स्पष्ट और स्वाभाविक है।
- source_word: בְּנָהּ הַקָּטָן
  choice: अपने छोटे बेटे
  rationale: यहाँ קָטָן शारीरिक आकार नहीं, एसाव की तुलना में कम आयु को सूचित करता है।
