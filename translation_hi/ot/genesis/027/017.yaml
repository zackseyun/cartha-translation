  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। इब्रानी ‘हाथ में’ को मुख्य पाठ में स्वाभाविक हिन्दी मुहावरे के रूप में बनाए रखने के कारण फुटनोट आवश्यक नहीं है।
