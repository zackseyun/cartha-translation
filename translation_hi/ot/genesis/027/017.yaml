- from: तब उसने वह स्वादिष्ट भोजन और रोटी, जो उसने बनाई थी, अपने बेटे याकूब के हाथ में दे दी।
  to: तब उसने स्वादिष्ट भोजन और रोटी, जिन्हें उसने तैयार किए थे, अपने बेटे याकूब के हाथ में दे दिया।
  rationale: The revision retains the Hebrew’s concrete “into the hand of” expression and all source elements, while using the plural relative pronoun and verb to show unambiguously that Rebekah had prepared both food items. No footnote is needed, since “हाथ में दे दिया” conveys the Hebrew idiom naturally in Hindi.
