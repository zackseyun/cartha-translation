  yaml_path: translation/ot/genesis/027/017.yaml
  text: Then she put the tasty food and the bread that she had made into the hand of Jacob her son[a].
translation:
  language: hi
  text: तब उसने स्वादिष्ट भोजन और रोटी, जिन्हें उसने तैयार किए थे, अपने बेटे याकूब के हाथ में दे दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: तब उसने...दे दी
  rationale: वाव-क्रमागत कथानक को आगे बढ़ाता है; נתן का स्वाभाविक हिन्दी अर्थ यहाँ ‘देना’ है।
- source_word: הַמַּטְעַמִּים
  choice: वह स्वादिष्ट भोजन
  rationale: इस प्रसंग में यह विशेष रूप से तैयार किए गए स्वादिष्ट व्यंजन को सूचित करता है; ‘स्वादिष्ट भोजन’ सहज है और मांस को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: הַלֶּחֶם
  choice: रोटी
  rationale: לֶחֶם का सीधा और प्रसंगानुकूल हिन्दी रूप।
- source_word: אֲשֶׁר עָשָׂתָה
  choice: जो उसने बनाई थी
  rationale: यह पहले पूरी हो चुकी तैयारी को स्वाभाविक हिन्दी में व्यक्त करता है और עשה के सामान्य अर्थ को बनाए रखता है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: इब्रानी के ठोस मुहावरे और एकवचन ‘हाथ’ को सुरक्षित रखता है; हिन्दी में ‘हाथ में दे दी’ स्वाभाविक अभिव्यक्ति है।
- source_word: יַעֲקֹב בְּנָהּ
  choice: अपने बेटे याकूब
  rationale: हिन्दी की स्वाभाविक शब्दावली में संबंध स्पष्ट करता है; कर्ता रिबका होने के कारण ‘अपने’ उचित है।
