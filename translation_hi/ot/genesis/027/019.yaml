  text: וַ/יֹּ֨אמֶר יַעֲקֹ֜ב אֶל אָבִ֗י/ו אָנֹכִי֙ עֵשָׂ֣ו בְּכֹרֶ֔/ךָ עָשִׂ֕יתִי כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָ֑/י קֽוּם נָ֣א שְׁבָ֗/ה וְ/אָכְלָ/ה֙ מִ/צֵּידִ֔/י בַּ/עֲב֖וּר תְּבָרֲכַ֥/נִּי נַפְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/019.yaml
  text: And Jacob said to his father[a], “I am Esau your firstborn. I have done as you told me. Please rise, sit, and eat from my game[b], so that your soul may bless me.”
translation:
  language: hi
  text: तब याकूब ने अपने पिता से कहा, “मैं एसाव, आपका पहलौठा हूँ। जैसा आपने मुझसे कहा था, मैंने वैसा ही किया है। कृपया उठकर बैठिए और मेरे शिकार का मांस खाइए, ताकि आप मुझे आशीर्वाद दें[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “ताकि आपका प्राण मुझे आशीर्वाद दे।” यहाँ इब्रानी शब्द נֶפֶשׁ (नेफ़ेश, ‘प्राण/स्वयं’) पूरे व्यक्ति के लिए मुहावरेदार ढंग से प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक रूप से घटनाक्रम व्यक्त करता है।
- source_word: אָנֹכִי עֵשָׂו בְּכֹרֶךָ
  choice: मैं आपका पहलौठा एसाव हूँ
  rationale: यह वक्ता की पहचान एसाव और इसहाक के पहलौठे के रूप में प्रस्तुत करता है तथा याकूब के छलपूर्ण दावे को स्पष्ट रखता है।
- source_word: עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלַי
  choice: जैसा आपने मुझसे कहा था, मैंने वैसा ही किया है
  rationale: यह पूर्व निर्देश और उसके पालन के दावे को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: קוּם נָא שְׁבָה
  choice: कृपया उठकर बैठिए
  rationale: נָא की विनम्रता तथा दोनों आज्ञाओं को सुरक्षित रखते हुए हिन्दी में स्वाभाविक क्रम देता है।
- source_word: וְאָכְלָה מִצֵּידִי
  choice: और मेरे लाए हुए शिकार का मांस खाइए
  rationale: צַיִד यहाँ शिकार से प्राप्त भोजन को दर्शाता है; ‘शिकार का मांस’ सामान्य हिन्दी पाठक के लिए ‘मेरा शिकार’ से अधिक स्पष्ट है।
- source_word: בַּעֲבוּר תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: ताकि आप मुझे आशीर्वाद दें
  rationale: בַּעֲבוּר उद्देश्य बताता है और נַפְשֶׁךָ इस पदबंध में व्यक्ति स्वयं के लिए मुहावरेदार प्रयोग है; हिन्दी में सरल कर्ता इसका आशय स्वाभाविक रूप से देता है।
theological_decisions:
- issue: תְּבָרֲכַנִּי נַפְשֶׁךָ में נַפְשֶׁךָ का अनुवाद
  choice: ताकि आप मुझे आशीर्वाद दें
  alternative: ताकि आपका प्राण मुझे आशीर्वाद दे / ताकि आप स्वयं मुझे आशीर्वाद दें
  rationale: यहाँ ‘प्राण/आत्मा’ मनुष्य की संरचना पर कोई सैद्धांतिक कथन नहीं, बल्कि व्यक्ति स्वयं के लिए इब्रानी मुहावरा है। मुख्य पाठ में अर्थ स्वाभाविक रखा गया है और शाब्दिक रूप पादटिप्पणी में दर्ज है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और कथात्मक है। इसहाक को संबोधन में ‘आप’ तथा आदरसूचक क्रियाएँ रखी गई हैं। ‘पहलौठा’ बाइबिलीय रूप से परिचित और प्रसंग में स्पष्ट है।
