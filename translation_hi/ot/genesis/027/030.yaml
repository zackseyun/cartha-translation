base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/030.yaml
  text: And it happened that as soon as Isaac had finished blessing Jacob[a], and Jacob had just gone out from the presence of Isaac his father[b], Esau his brother came in from his hunting.
translation:
  language: hi
  text: जब इसहाक याकूब को आशीर्वाद दे चुका था और याकूब अपने पिता इसहाक के सामने से अभी-अभी निकल गया था, तभी उसका भाई एसाव शिकार से आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: जब ... तभी
  rationale: दोनों कथात्मक रूपों को यांत्रिक ढंग से दोहराने के बजाय हिन्दी की स्वाभाविक काल-संबंधी रचना में रखा गया है; इससे घटनाओं का तीव्र क्रम स्पष्ट रहता है।
- source_word: כַּאֲשֶׁר כִּלָּה ... לְבָרֵךְ
  choice: जब ... आशीर्वाद दे चुका
  rationale: כלה के पूर्णता-बोध और לברך के कार्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אַךְ יָצֹא יָצָא
  choice: निकल ही रहा था
  rationale: אינפिनिटिव एब्सोल्यूट और सीमित क्रिया के बलाघात को ‘ही’ से व्यक्त किया गया है और निकटतम समय-संयोग को दर्शाया गया है; सन्दर्भ में एसाव के आने के समय याकूब का प्रस्थान अभी-अभी हो रहा था।
- source_word: מֵאֵת פְּנֵי יִצְחָק אָבִיו
  choice: अपने पिता इसहाक के सामने से
  rationale: चेहरे/उपस्थिति से जुड़े इब्रानी मुहावरे का स्वाभाविक हिन्दी समतुल्य है और पिता का संबंध बनाए रखता है।
- source_word: וְעֵשָׂו אָחִיו
  choice: तभी उसका भाई एसाव
  rationale: स्पष्ट पारिवारिक संबंध को सुरक्षित रखते हुए हिन्दी में कर्ता को स्वाभाविक क्रम में रखा गया है।
- source_word: בָּא מִצֵּידוֹ
  choice: शिकार से लौट आया
  rationale: ציד यहाँ शिकार की गतिविधि को सूचित कर सकता है; सन्दर्भ से लौटने की गति निहित है। ‘लौट आया’ हिन्दी में स्वाभाविक है, जबकि पकड़े हुए शिकार का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘जब ... तभी’ तीव्र घटनाक्रम को स्पष्ट करता है। ‘निकल ही रहा था’ मूल की बलाघाती अभिव्यक्ति और समय की निकटता को रखता है, जबकि पादटिप्पणी उसकी असामान्य शाब्दिक संरचना बताती है।
