lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: इब्रानी कथात्मक क्रम को स्वाभाविक हिन्दी में रखता है और वक्ता के नाम को वहाँ नहीं जोड़ता जहाँ मूल में केवल सर्वनाम निहित है।
- source_word: בָּא
  choice: आया
  rationale: पूर्ण हो चुकी पिछली घटना के लिए सरल भूतकाल स्वाभाविक है।
- source_word: אָחִיךָ
  choice: तेरा भाई
