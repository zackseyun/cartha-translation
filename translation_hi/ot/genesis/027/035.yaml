- source_word: בְּמִרְמָה
  choice: छल से
  rationale: בְּ उपसर्ग के साथ संज्ञा מִרְמָה यहाँ रीति या साधन व्यक्त करती है। ‘छल से’ सहज हिन्दी है और संज्ञा का नैतिक भार बनाए रखती है।
- source_word: וַיִּקַּח
  choice: और … ले गया
  rationale: कथात्मक क्रम जारी रखते हुए לקח के सामान्य अर्थ को स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है; ‘छीन लिया’ जैसी अधिक बलपूर्ण धारणा नहीं जोड़ता।
- source_word: בִּרְכָתֶךָ
  choice: तेरा आशीर्वाद
  rationale: मूल के एकवचन संज्ञा और द्वितीय पुरुष एकवचन प्रत्यय का सीधा अनुवाद है।
