translation:
  language: hi
  text: फिर तू उसे अपने पिता के पास ले जाना, और वे खाएँगे, ताकि वे अपनी मृत्यु से पहले तुझे आशीर्वाद दें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: फिर तू ... ले जाना
  rationale: संयोजक सहित कालरूप निर्देशों के क्रम में आज्ञा-जैसा भाव देता है। ‘फिर’ क्रम को और ‘ले जाना’ स्वाभाविक हिंदी निर्देश को व्यक्त करता है।
- source_word: לְאָבִיךָ
  choice: अपने पिता के पास
  rationale: ‘पिता’ गरिमापूर्ण कथात्मक शैली के अनुकूल है; हिंदी में किसी व्यक्ति तक वस्तु पहुँचाने के लिए ‘के पास ले जाना’ स्वाभाविक है।
- source_word: וְאָכָל
  choice: और वह खाएँगे
  rationale: यह पिछली क्रिया के बाद अपेक्षित अगली क्रिया को व्यक्त करता है। इसहाक के लिए आदरसूचक बहुवचन आधुनिक मानक हिंदी में स्वाभाविक है।
- source_word: בַּעֲבֻר אֲשֶׁר
  choice: ताकि
  rationale: दोनों पद मिलकर उद्देश्य बताते हैं; ‘ताकि’ संक्षिप्त और स्वाभाविक हिंदी समतुल्य है।
- source_word: יְבָרֶכְךָ
  choice: तुझे आशीर्वाद दें
  rationale: पिएल अपूर्ण 3 पुल्लिंग एकवचन के साथ 2 पुल्लिंग एकवचन प्रत्यय का सीधा अर्थ है। आदरसूचक कर्ता के अनुरूप ‘दें’ रखा गया है।
- source_word: לִפְנֵי מוֹתוֹ
  choice: अपनी मृत्यु से पहले
  rationale: मूल की संज्ञात्मक अभिव्यक्ति और प्रसंग की गंभीरता को बनाए रखता है; ‘अपनी’ स्पष्ट करता है कि मृत्यु पिता की है।
