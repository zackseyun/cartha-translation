  yaml_path: translation/ot/genesis/027/003.yaml
  text: Now then[b][a], please take your equipment—your quiver and your bow—and go out to the field and hunt game for me.
translation:
  language: hi
  text: और अब, कृपया अपने हथियार—अपना तरकश और अपना धनुष—ले, खुले मैदान में जा और मेरे लिए शिकार कर ला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह संयोजक पद पिछले कथन से वर्तमान निर्देश की ओर संक्रमण कराता है; ‘इसलिए अब’ प्रसंगगत संबंध और तात्कालिकता दोनों व्यक्त करता है।
- source_word: שָׂא נָא
  choice: कृपया ... उठा
  rationale: שׂא का मूल भाव उठाना/लेना है, और נָא विनम्र आग्रह दर्शाता है। हिंदी में आज्ञार्थक एकवचन ‘उठा’ के साथ ‘कृपया’ दोनों पक्षों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כֵלֶיךָ
  choice: अपने हथियार
  rationale: כְּלִי का अर्थ सामान, उपकरण या हथियार हो सकता है। तरकश और धनुष द्वारा तुरंत स्पष्ट किए जाने के कारण यहाँ ‘हथियार’ सटीक और सहज है।
- source_word: תֶּלְיְךָ
  choice: अपना तरकश
  rationale: यह दुर्लभ संज्ञा तीर रखने के लटकने वाले पात्र, अर्थात तरकश, को सूचित करती है।
- source_word: וְקַשְׁתֶּךָ
  choice: और अपना धनुष
  rationale: קֶשֶׁת का इस प्रसंग में सीधा अर्थ धनुष है।
- source_word: וְצֵא הַשָּׂדֶה
  choice: और खुले मैदान में जाकर
  rationale: שָׂדֶה खेत के साथ-साथ खुला प्रदेश भी दर्शाता है; शिकार के प्रसंग में ‘खुला मैदान’ अधिक स्वाभाविक है। ‘जाकर’ हिंदी में अगले आदेश से सहजता से जुड़ता है।
- source_word: וְצוּדָה לִּי צידה
  choice: मेरे लिए शिकार कर ला
  rationale: क्रिया צוד शिकार पकड़ने को और संज्ञा צַיִד शिकार से प्राप्त जीव/भोजन को दर्शाती है। ‘शिकार कर ला’ हिंदी में उद्देश्य और इसहाक के लिए उसे वापस लाने के निहित भाव को संक्षेप में व्यक्त करता है।
