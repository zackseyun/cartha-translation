translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज पारिवारिक आदेश-रूप रखा गया है। इसहाक का एसाव से एकवचन निकट संबोधन होने के कारण ‘उठा’ और ‘ला’ प्रयुक्त हैं। अनावश्यक तकनीकी शब्दावली और अंग्रेज़ी पाठ की त्रुटिपूर्ण फुटनोट-स्थिति से बचा गया है।
