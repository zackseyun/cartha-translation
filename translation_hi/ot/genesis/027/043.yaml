lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: वाव को प्रसंगगत निष्कर्ष/अगली तात्कालिक कार्रवाई से जोड़ते हुए ‘इसलिए’ और עַתָּה को ‘अब’ से व्यक्त किया गया है। केवल ‘अब’ भी संभव है।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: माता द्वारा याकूब को किया गया सीधा, स्नेहपूर्ण और लिंग-विशिष्ट संबोधन बनाए रखता है।
- source_word: שְׁמַע בְּקֹלִי
  choice: मेरी बात सुन
  rationale: इब्रानी का शाब्दिक अर्थ ‘मेरी आवाज़ सुन’ है और मुहावरे में आज्ञा मानने का भाव हो सकता है; आधुनिक हिन्दी में ‘मेरी बात सुन’ दोनों को स्वाभाविक रूप से समेटता है, बिना इसे स्पष्टतः ‘मेरी आज्ञा मान’ बना देने के।
- source_word: וְקוּם
  choice: उठ
  rationale: קום के एकवचन पुल्लिंग आदेश का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: בְּרַח לְךָ
  choice: भाग जा
  rationale: ברח पलायन का तात्कालिक आदेश है। नैतिक/हितसूचक לְךָ को अलग से ‘अपने लिए’ कहना हिन्दी में अस्वाभाविक होगा; ‘भाग जा’ उसका व्यावहारिक बल देता है।
- source_word: אֶל לָבָן אָחִי
  choice: मेरे भाई लाबान के पास
  rationale: אֶל के लक्ष्यगत अर्थ और אָחִי के पारिवारिक संबंध दोनों को स्पष्ट और सहज हिन्दी में सुरक्षित रखता है।
- source_word: חָרָנָה
  choice: हारान को
  rationale: स्थाननाम पर दिशासूचक ה गति की दिशा बताता है; ‘हारान को’ इस गंतव्यभाव को बनाए रखता है, यद्यपि ‘हारान में’ अधिक मुहावरेदार विकल्प है।
