base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/041.yaml
  text: And Esau hated Jacob because of the blessing with which his father had blessed him[a], and Esau said in his heart, “The days of mourning for my father are drawing near[c][b]; then I will kill Jacob my brother.”
translation:
  language: hi
  text: और एसाव उस आशीर्वाद के कारण याकूब से बैर रखता था, जिससे उसके पिता ने याकूब को आशीर्वाद दिया था[a]। एसाव ने अपने मन में कहा[b], “मेरे पिता के लिए शोक मनाने के दिन निकट आ रहे हैं[c]; तब मैं याकूब, अपने भाई को मार डालूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी क्रिया केवल क्षणिक घृणा नहीं, बल्कि लगातार बने रहने वाले वैर या शत्रुता को दर्शाती है। इसका अनुवाद “याकूब से घृणा रखता था” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “अपने हृदय में कहा।”'
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद “मेरे पिता के शोक के दिन निकट आ रहे हैं” भी हो सकता है। इब्रानी वाक्यांश इसहाक की मृत्यु के बाद उसके लिए किए जाने वाले शोक या स्वयं इसहाक के शोक—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂטֹם
  choice: बैर रखने लगा
  rationale: שׂטם लगातार बने रहने वाले वैर और शत्रुता को व्यक्त करता है। ‘बैर रखने लगा’ क्षणिक क्रोध के बजाय पाले गए विरोध को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: עַל הַבְּרָכָה
  choice: उस आशीर्वाद के कारण
  rationale: यहाँ עַל कारण बताता है; ‘के कारण’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: אֲשֶׁר בֵּרֲכוֹ אָבִיו
  choice: जो उसके पिता ने उसे दिया था
  rationale: हिन्दी में ‘आशीर्वाद दिया’ स्वाभाविक प्रयोग है और यह स्पष्ट रखता है कि पिता द्वारा याकूब को दिया गया आशीर्वाद एसाव के वैर का कारण था।
- source_word: בְּלִבּוֹ
  choice: अपने मन में
  rationale: यह भीतर कही गई बात या मन के विचार को दर्शाता है। ‘अपने मन में कहा’ हिन्दी का स्वाभाविक मुहावरा है और मूल की भीतरी deliberation को बनाए रखता है।
- source_word: יִקְרְבוּ יְמֵי אֵבֶל אָבִי
  choice: मेरे पिता के लिए शोक मनाने के दिन निकट आ रहे हैं
  rationale: यह प्रमुख प्रसंगगत अर्थ व्यक्त करता है कि इसहाक की मृत्यु के बाद उसके लिए शोक के दिन आने वाले हैं, जबकि रचना की दूसरी सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וְאַהַרְגָה
  choice: तब मैं ... मार डालूँगा
  rationale: रूप एसाव के दृढ़ संकल्प को व्यक्त करता है। ‘तब’ पिछले कथन से निहित कालक्रम को स्पष्ट करता है और ‘मार डालूँगा’ हत्या के आशय को साफ रखता है।
- source_word: אָחִי
  choice: अपने भाई याकूब को
  rationale: मूल का संबंधसूचक ‘मेरा भाई’ सुरक्षित है; हिन्दी वाक्य में ‘अपने भाई’ अधिक स्वाभाविक है और पारिवारिक हिंसा की त्रासदी को उभारता है।
theological_decisions:
- issue: יִקְרְבוּ יְמֵי אֵבֶל אָבִי की अर्थगत अस्पष्टता
  choice: मेरे पिता के लिए शोक मनाने के दिन निकट आ रहे हैं
  alternative: मेरे पिता के शोक के दिन निकट आ रहे हैं
  rationale: संदर्भ में एसाव सम्भवतः इसहाक की आसन्न मृत्यु और उसके बाद के शोक की प्रतीक्षा कर रहा है, पर इब्रानी संबंध-रचना इसहाक के अपने शोक की अवधि के रूप में भी समझी जा सकती है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘बैर रखने लगा’ स्थायी शत्रुता को व्यक्त करता है; ‘अपने मन में कहा’ मूल मुहावरे का स्वाभाविक हिन्दी रूप है। सभी अर्थगत विकल्प पादटिप्पणियों में दिए गए हैं।
