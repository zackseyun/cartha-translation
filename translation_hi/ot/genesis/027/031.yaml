  text: וַ/יַּ֤עַשׂ גַּם הוּא֙ מַטְעַמִּ֔ים וַ/יָּבֵ֖א לְ/אָבִ֑י/ו וַ/יֹּ֣אמֶר לְ/אָבִ֗י/ו יָקֻ֤ם אָבִ/י֙ וְ/יֹאכַל֙ מִ/צֵּ֣יד בְּנ֔/וֹ בַּ/עֲב֖וּר תְּבָרֲכַ֥/נִּי נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/031.yaml
  text: He too prepared tasty food and brought it to his father[a], and he said to his father, “Let my father rise and eat of his son's game[b], so that your soul may bless me.”
translation:
  language: hi
  text: उसने भी स्वादिष्ट भोजन[a] तैयार किया और अपने पिता के पास ले आया। फिर उसने अपने पिता से कहा, “मेरे पिता उठें और अपने पुत्र के शिकार में से खाएँ, ताकि आपका प्राण[b] मुझे आशीर्वाद दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वादिष्ट व्यंजन।” इब्रानी शब्द इस प्रसंग में विशेष रूप से तैयार किए गए स्वादिष्ट पकवानों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “आपका प्राण मुझे आशीर्वाद दे।” यह एक मुहावरा हो सकता है जिसका अर्थ “आप मुझे आशीर्वाद दें” है, पर मुख्य पाठ मूल अभिव्यक्ति को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: उसने भी
  rationale: यह एसाव के कार्य को याकूब के पहले किए गए कार्य के समानांतर रखता है और इब्रानी के योगात्मक बल को सहज हिन्दी में बनाए रखता है।
- source_word: מַטְעַמִּים
  choice: स्वादिष्ट भोजन
  rationale: यह शब्द इस प्रसंग में विशेष रूप से तैयार किए गए स्वादभरे व्यंजन को सूचित करता है; यह चयन आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: יָקֻם אָבִי
  choice: मेरे पिता उठें
  rationale: इब्रानी आज्ञार्थक भाव यहाँ आदरपूर्ण निवेदन व्यक्त करता है; तृतीय पुरुष का संबोधन मूल की शैली को सुरक्षित रखता है।
- source_word: מִצֵּיד בְּנוֹ
  choice: अपने पुत्र के शिकार का मांस
  rationale: צַיִד आखेट से प्राप्त पशु या उसका मांस सूचित करता है। ‘शिकार का मांस’ भोजन के संदर्भ को स्पष्ट करता है, और ‘अपने पुत्र’ मूल के पारिवारिक संबंध को बनाए रखता है।
- source_word: בַּעֲבוּר
  choice: ताकि
  rationale: यह प्रयोजन बताने वाला सहज आधुनिक हिन्दी संयोजक है।
- source_word: נַפְשֶׁךָ
  choice: आपका प्राण
  rationale: मूल में ‘आपका प्राण’ स्पष्ट रूप से उपस्थित है। यद्यपि यह पूरे व्यक्ति के लिए मुहावरा हो सकता है, इसे मुख्य पाठ में रखने से मूल अभिव्यक्ति और आशीर्वाद-दृश्य की गंभीरता बनी रहती है।
theological_decisions:
- issue: נַפְשֶׁךָ को शाब्दिक रूप में रखना या केवल व्यक्ति-सूचक सर्वनाम बनाना
  choice: आपका प्राण मुझे आशीर्वाद दे
  alternative: आप मुझे आशीर्वाद दें
  rationale: शाब्दिक अभिव्यक्ति अर्थबोध में बाधा नहीं डालती और मूल की संभावित मुहावरेदार तथा बलाघाती दोनों छटाओं को सुरक्षित रखती है; पादटिप्पणी उसका सामान्य अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और कथात्मक रखी गई है। पिता के लिए बहुवचन आदरसूचक क्रियाएँ प्रयुक्त हुई हैं, जबकि ‘आपका प्राण’ मूल के एकवचन संबोधन को हिन्दी के स्वाभाविक आदरसूचक रूप में व्यक्त करता है।
