source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר רִבְקָה֙ אֶל יִצְחָ֔ק קַ֣צְתִּי בְ/חַיַּ֔/י מִ/פְּנֵ֖י בְּנ֣וֹת חֵ֑ת אִם לֹקֵ֣חַ יַ֠עֲקֹב אִשָּׁ֨ה מִ/בְּנֽוֹת חֵ֤ת כָּ/אֵ֨לֶּה֙ מִ/בְּנ֣וֹת הָ/אָ֔רֶץ לָ֥/מָּה לִּ֖/י חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/046.yaml
  text: Then Rebekah said to Isaac[a], “I am weary of my life because of the daughters of Heth. If Jacob takes a wife from the daughters of Heth like these, from the daughters of the land, what is life to me?”
translation:
  language: hi
  text: तब रिबका ने इसहाक से कहा, “हेत की बेटियों[a] के कारण मैं अपने जीवन से तंग आ गई हूँ। यदि याकूब हेत की बेटियों में से—इस देश की इन बेटियों जैसी—किसी को पत्नी बना ले, तो मेरे लिए जीवन ही क्या है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् “हित्ती स्त्रियाँ” या “हित्तियों की बेटियाँ”।
    reason: मूल ‘हेत की बेटियाँ’ का प्रचलित जातीय समतुल्य स्पष्ट करना।
lexical_decisions:
- source_word: קַצְתִּי בְחַיַּי
  choice: मैं अपने जीवन से ऊब गई हूँ
  rationale: यह संयुक्त इब्रानी मुहावरा जीवन से गहरी खिन्नता और वितृष्णा व्यक्त करता है। ‘ऊब गई हूँ’ आधुनिक हिन्दी में स्वाभाविक है और भाव की तीव्रता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: यहाँ पूर्वसर्ग स्थान नहीं, कारण बताता है।
- source_word: בְּנוֹת חֵת
  choice: हेत की बेटियाँ
  rationale: शाब्दिक पारिवारिक-जातीय अभिव्यक्ति को बनाए रखते हुए हेत नाम का लिप्यंतरण किया गया है; स्पष्ट जातीय अर्थ पादटिप्पणी में दिया गया है।
- source_word: אִם לֹקֵחַ יַעֲקֹב אִשָּׁה
  choice: यदि याकूब ... को पत्नी बना ले
  rationale: ‘स्त्री लेना’ विवाह का इब्रानी मुहावरा है; हिन्दी में ‘पत्नी बना ले’ उसका स्पष्ट और स्वाभाविक समतुल्य है।
- source_word: כָּאֵלֶּה
  choice: इन्हीं जैसी
  rationale: संकेतवाचक शब्द पहले से सामने मानी गई स्त्रियों—संभवतः एसाव की पत्नियों—जैसी स्त्रियों की ओर संकेत करता है।
- source_word: מִבְּנוֹת הָאָרֶץ
  choice: इस देश की बेटियों में से
  rationale: ‘देश की बेटियाँ’ मूल की समानांतर पारिवारिक-सामाजिक भाषा बनाए रखता है; ‘इस’ हिन्दी में निश्चित पदबंध का संदर्भ स्पष्ट करता है।
- source_word: לָמָּה לִּי חַיִּים
  choice: तो मेरे लिए जीवन का क्या अर्थ रह जाएगा?
  rationale: शाब्दिक रूप से ‘मेरे लिए जीवन क्यों/क्या?’ यह आलंकारिक प्रश्न ऐसी स्थिति में जीवन के निरर्थक हो जाने का भाव देता है। हिन्दी रूप प्रश्न की तीव्रता और आशय को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: חֵת का जातीय पदनाम
  choice: मुख्य पाठ में ‘हेत की बेटियाँ’
  alternative: ‘हित्ती स्त्रियाँ’ अथवा ‘हित्तियों की बेटियाँ’
  rationale: मुख्य पाठ इब्रानी की वंशपरक अभिव्यक्ति और नाम को सुरक्षित रखता है, जबकि पादटिप्पणी पाठक को प्रचलित जातीय पहचान बताती है।
- issue: अंतिम आलंकारिक प्रश्न की व्याख्यात्मक सीमा
  choice: ‘मेरे लिए जीवन का क्या अर्थ रह जाएगा?’
  alternative: 'अधिक शाब्दिक: ‘मेरे लिए जीवन क्या है?’; अधिक व्याख्यात्मक: ‘मेरे जीने का क्या लाभ?’'
  rationale: चुना हुआ रूप जीवन की निरर्थकता के निहित भाव को स्पष्ट करता है, पर इसे सीधे आत्महत्या की इच्छा या किसी विशेष धर्मवैज्ञानिक निष्कर्ष में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद स्वाभाविक किंतु गरिमापूर्ण रखा गया है। ‘रिबका’, ‘इसहाक’, ‘याकूब’ और ‘हेत’ नामों का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
