base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/013.yaml
  text: His mother said to him[a], “Your curse be on me, my son. Only listen to my voice, and go[b], get them for me.”
translation:
  language: hi
  text: उसकी माँ ने उससे कहा, “मेरे बेटे, तेरा शाप मुझ पर हो। बस मेरी बात मान[a]; जा और मेरे लिए उन्हें[b] ले आ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “मेरी आवाज़ सुन” है; यह मुहावरा “मेरी बात मान” या “मेरी आज्ञा मान” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उन्हें” मूल इब्रानी में स्पष्ट रूप से नहीं लिखा है; पिछले पद से आशय बकरी के दोनों बच्चों से है।
    reason: cross_reference
lexical_decisions:
- source_word: וַתֹּאמֶר לֹו אִמּוֹ
  choice: उसकी माँ ने उससे कहा
  rationale: साधारण इब्रानी कथात्मक शैली और संबंधसूचक पदों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עָלַי קִלְלָתְךָ
  choice: तेरा शाप मुझ पर हो
  rationale: इब्रानी की संक्षिप्त, क्रियारहित अभिव्यक्ति को निकटता से सुरक्षित रखता है और यह स्पष्ट नहीं करता कि माँ केवल परिणाम उठाने को तैयार है या शाप को अपने ऊपर बुला रही है।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: संबोधन और मातृस्नेह, दोनों को बनाए रखता है।
- source_word: אַךְ
  choice: बस
  rationale: यहाँ पद प्रतिबंध और आग्रह प्रकट करता है; वर्तमान हिन्दी में ‘बस’ स्वाभाविक और प्रभावी है।
- source_word: שְׁמַע בְּקֹלִי
  choice: मेरी बात मान
  rationale: शाब्दिक अर्थ ‘मेरी आवाज़ सुन’ है, पर यह इब्रानी मुहावरा प्रसंग में आज्ञा मानने का अर्थ देता है; हिन्दी में ‘मेरी बात मान’ वही बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְלֵךְ קַח לִי
  choice: जा और मेरे लिए उन्हें ले आ
  rationale: आज्ञाओं के क्रम को बनाए रखता है। हिन्दी में आवश्यक कर्म पिछले पद की बकरियों से ग्रहण किया गया है, और ‘ले आ’ माँ के लिए उन्हें लाने के प्रसंग को स्वाभाविक रूप देता है।
theological_decisions:
- issue: रिबका द्वारा शाप अपने ऊपर लेने वाले कथन का आशय
  choice: तेरा शाप मुझ पर हो
  alternative: तुझ पर पड़नेवाला शाप मैं अपने ऊपर ले लूँगी
  rationale: मूल इब्रानी संक्षिप्त और कुछ हद तक अस्पष्ट है। चुना हुआ रूप उसके कथन की गंभीरता को बनाए रखता है, बिना यह तय किए कि यह प्रतिज्ञा, इच्छा या परिणाम वहन करने की घोषणा है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संबोधन ‘मेरे बेटे’ भावनात्मक बल बनाए रखता है। अर्धविराम माँ के शाप-विषयक कथन और उसके बाद दिए गए आदेशों के बीच स्पष्ट विराम देता है।
