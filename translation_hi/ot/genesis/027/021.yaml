  text: तब इसहाक ने याकूब से कहा, “ज़रा पास आ, मेरे बेटे, ताकि मैं तुझे टटोलकर देखूँ कि तू सचमुच मेरा बेटा एसाव है या नहीं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּשָׁה נָּא
  choice: ज़रा पास आ
  rationale: आज्ञार्थक क्रिया निकट आने को कहती है और נָא अनुरोध को नरम बनाता है; आधुनिक हिन्दी में ‘ज़रा पास आ’ स्वाभाविक और स्नेहपूर्ण है।
- source_word: וַאֲמֻשְׁךָ
  choice: ताकि मैं तुझे छूकर जानूँ
  rationale: מושׁ यहाँ स्पर्श द्वारा पहचान परखने को दर्शाता है। ‘छूकर जानूँ’ उद्देश्य और प्रसंगगत जाँच—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित संबोधन को सुरक्षित रखता है और दृश्य का पारिवारिक स्वर व्यक्त करता है।
- source_word: הַאַתָּה זֶה
  choice: कि तू सचमुच ... है
  rationale: प्रश्नवाचक रचना पहचान के विषय में इसहाक की अनिश्चितता व्यक्त करती है; ‘सचमुच’ उस जाँचपूर्ण भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּנִי עֵשָׂו
  choice: मेरा बेटा एसाव
  rationale: सम्बन्ध और विशिष्ट पहचान दोनों को स्पष्ट तथा स्वाभाविक क्रम में बनाए रखता है।
- source_word: אִם לֹא
  choice: या नहीं
  rationale: यह अप्रत्यक्ष वैकल्पिक प्रश्न को पूरा करने वाला मानक हिन्दी रूप है।
- source_word: וַיֹּאמֶר
  choice: तब इसहाक ने ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में घटनाक्रम का स्वाभाविक संकेत है।
