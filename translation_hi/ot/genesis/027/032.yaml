base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/032.yaml
  text: His father Isaac said to him[a], “Who are you?” And he said, “I am your son, your firstborn[b], Esau.”
translation:
  language: hi
  text: उसके पिता इसहाक ने उससे कहा, “तुम कौन हो?” उसने कहा, “मैं आपका बेटा, आपका पहलौठा[a] एसाव हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आपका सबसे बड़ा बेटा’; इब्रानी में ‘आपका पहलौठा’ है, जो आसपास के वृत्तांत में महत्त्वपूर्ण जन्म-क्रम और पहलौठेपन पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: אמר बोलने के लिए सामान्य क्रिया है; प्रश्नवाचक कथन होने पर भी ‘कहा’ इब्रानी अभिव्यक्ति को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: לּוֹ
  choice: उससे
  rationale: ל के साथ तृतीय पुरुष एकवचन प्रत्यय वाणी के अप्रत्यक्ष कर्म को दर्शाता है; हिंदी में ‘उससे’ स्वाभाविक है।
- source_word: יִצְחָק אָבִיו
  choice: उसके पिता इसहाक
  rationale: शाब्दिक क्रम ‘इसहाक, उसका पिता’ है; ‘उसके पिता इसहाक’ आधुनिक हिंदी में स्वाभाविक रहते हुए संबंध और वक्ता की पहचान दोनों स्पष्ट करता है।
- source_word: מִי אַתָּה
  choice: तुम कौन हो?
  rationale: प्रश्नवाचक מִי और सर्वनाम אַתָּה का सीधा और स्वाभाविक हिंदी रूप।
- source_word: אֲנִי
  choice: मैं ... हूँ
  rationale: इब्रानी संज्ञावाचक वाक्य में वर्तमानकालीन संयोजक क्रिया व्यक्त नहीं होती; हिंदी में स्वाभाविक वाक्य के लिए ‘हूँ’ आवश्यक है।
- source_word: בִּנְךָ
  choice: आपका बेटा
  rationale: בֵּן पर द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय का सीधा अर्थ ‘आपका बेटा’ है। पुत्र द्वारा पिता को संबोधन में आदरसूचक ‘आपका’ आधुनिक हिंदी के अनुरूप है।
- source_word: בְכֹרְךָ
  choice: आपका पहलौठा
  rationale: בְּכוֹר प्रथम जन्मे पुत्र और उससे जुड़ी जन्मसिद्ध प्राथमिकता को दर्शाता है। ‘पहलौठा’ इस कथानक में महत्त्वपूर्ण जन्म-क्रम और पहिलौठेपन की धारणा को ‘सबसे बड़ा बेटा’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी, सरल और गरिमापूर्ण। पिता के प्रति पुत्र के संबोधन में आदरसूचक ‘आप’ रखा गया है, जबकि पिता का पुत्र से प्रश्न ‘तुम’ में है। इब्रानी के ‘इसहाक उसका पिता’ को स्वाभाविक हिंदी में ‘उसके पिता इसहाक’ किया गया है; इसके लिए अलग पाद-टिप्पणी आवश्यक नहीं समझी गई।
