  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और निर्देशात्मक शैली रखी गई है। पद की अस्थायी अवधि को “कुछ दिन” से सुरक्षित रखा गया है। मूल के “क्रोध लौटने” वाले रूपक को शब्दशः रखने के बजाय हिंदी के स्वाभाविक मुहावरे “क्रोध शांत होना” में व्यक्त किया गया है।
