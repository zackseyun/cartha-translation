  yaml_path: translation/ot/genesis/027/044.yaml
  text: And stay with him for a few days[a], until your brother's fury turns away.
translation:
  language: hi
  text: और कुछ दिन उसके साथ रहना, जब तक तुम्हारे भाई का क्रोध शांत न हो जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: और ... रहना
  rationale: ישׁב का यहाँ अर्थ अस्थायी रूप से किसी के साथ ठहरना या रहना है। रिबका के निर्देश के स्वाभाविक प्रवाह में हिंदी का अनंत क्रियारूप “रहना” उपयुक्त है।
- source_word: עִמּוֹ
  choice: उसके साथ
  rationale: עם के तृतीय पुरुष एकवचन प्रत्यय का सीधा अर्थ “उसके साथ” है; निकट संदर्भ में संकेत लाबान की ओर है।
- source_word: יָמִים אֲחָדִים
  choice: कुछ दिन
  rationale: शाब्दिक संरचना “दिन, कुछ” अस्थायी और छोटी अवधि बताती है; आधुनिक हिंदी में “कुछ दिन” इसका सहज रूप है।
- source_word: עַד אֲשֶׁר
  choice: जब तक
  rationale: यह संयोजन ठहरने की समय-सीमा बताता है और हिंदी में स्वाभाविक रूप से “जब तक” होता है।
- source_word: תָּשׁוּב
  choice: शांत न हो जाए
  rationale: שׁוב का मूल अर्थ लौटना या पलटना है, पर क्रोध को कर्ता बनाकर इसका मुहावरेदार अर्थ क्रोध का उतरना या शांत होना है। नकारात्मक आश्रित वाक्य में “जब तक ... न हो जाए” स्वाभाविक हिंदी है।
- source_word: חֲמַת
  choice: क्रोध
  rationale: חֵמָה तीव्र, तपते हुए क्रोध को व्यक्त करता है। “क्रोध” dignified और सामान्य आधुनिक हिंदी में स्पष्ट है; संदर्भ उसकी तीव्रता बनाए रखता है।
- source_word: אָחִיךָ
  choice: तुम्हारे भाई का
  rationale: रचनात्मक संबंध “तुम्हारे भाई का क्रोध” के रूप में स्वाभाविक हिंदी में व्यक्त होता है।
