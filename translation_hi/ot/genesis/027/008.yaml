  yaml_path: translation/ot/genesis/027/008.yaml
  text: Now[a], my son[b], listen to my voice as to what I command you.
translation:
  language: hi
  text: अब, मेरे बेटे, मेरी बात सुन और जैसा मैं तुझे आज्ञा दे रही हूँ, वैसा कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: संयोजक और काल-सूचक पद यहाँ पिछले कथन से तत्काल निर्देश की ओर बढ़ाते हैं; हिंदी में ‘इसलिए अब’ प्रसंगगत संबंध और तात्कालिकता दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: पुकार के रूप में प्रयुक्त प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय को सहज मातृ-संबोधन में रखा गया है।
- source_word: שְׁמַע בְּקֹלִי
  choice: मेरी बात ध्यान से सुन
  rationale: शाब्दिक ‘मेरी आवाज़ सुन’ के बजाय यह हिंदी में प्रचलित रूप से सुनने और ध्यान देने का भाव रखता है, पर केवल ‘मान’ कहकर आज्ञापालन को जरूरत से अधिक स्पष्ट नहीं करता।
- source_word: לַאֲשֶׁר
  choice: उसके अनुसार
  rationale: यह आगे दिए जा रहे आदेश के साथ सुनने का संबंध जोड़ता है। हिंदी वाक्य में ‘उसके अनुसार कर’ इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אֲנִי מְצַוָּה אֹתָךְ
  choice: जो आज्ञा मैं तुझे दे रही हूँ
  rationale: वर्तमान कृदंत की तत्काल/चल रही क्रिया को ‘दे रही हूँ’ से व्यक्त किया गया है। वक्ता रिबका होने के कारण हिंदी में स्त्रीलिंग आवश्यक है; संबोधित याकूब के लिए एकवचन आत्मीय ‘तुझे’ उपयुक्त है।
theological_decisions:
- issue: שׁמע में सुनने और आज्ञा मानने का संबंध
  choice: ‘ध्यान से सुन’ के साथ ‘उसके अनुसार कर’
  alternative: ‘मेरी आज्ञा मान’
  rationale: मूल मुहावरा ध्यान देकर सुनने और फलतः पालन करने का संकेत देता है। चुना हुआ रूप दोनों पक्षों को रखता है, जबकि केवल ‘आज्ञा मान’ श्रवण-चित्र को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिंदी; रिबका और याकूब के निकट पारिवारिक संबोधन के अनुरूप ‘मेरे बेटे’ और ‘तुझे’। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है।
