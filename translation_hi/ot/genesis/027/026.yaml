  text: Then his father Isaac said to him[a], “Come near, please, and kiss me, my son.”
translation:
  language: hi
  text: तब उसके पिता इसहाक ने उससे कहा, “मेरे बेटे, ज़रा पास आकर मुझे चूम।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम का स्वाभाविक संकेत देता है।
- source_word: אֵלָיו
  choice: उससे
  rationale: यह वाणी के संबोधित व्यक्ति को दर्शाता है; हिन्दी में ‘उससे कहा’ स्वाभाविक है।
- source_word: יִצְחָק אָבִיו
  choice: उसके पिता इसहाक
  rationale: इब्रानी के संबंधसूचक पद और नाम दोनों को रखते हुए हिन्दी में स्वाभाविक पदक्रम अपनाया गया है।
- source_word: גְּשָׁה
  choice: पास आकर
  rationale: क्रिया का आशय शारीरिक रूप से निकट आने का है; अगली आज्ञा के साथ ‘पास आकर’ सहज हिन्दी है।
- source_word: נָא
  choice: ज़रा
  rationale: यह विनम्र आग्रह को व्यक्त करता है; इस संदर्भ में ‘ज़रा’ आज्ञा को सहज रूप से नरम करता है।
- source_word: וּשְׁקָה לִּי
  choice: मुझे चूम
  rationale: क्रिया और प्रथम पुरुष प्रत्यय/पूर्वसर्गीय रूप का स्वाभाविक हिन्दी प्रतिरूप है; अनावश्यक विस्तार नहीं जोड़ा गया।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: संबोधन और पारिवारिक आत्मीयता दोनों सुरक्षित रहते हैं।
theological_decisions: []
