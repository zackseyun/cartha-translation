  text: וַ/עֲשֵׂה לִ֨/י מַטְעַמִּ֜ים כַּ/אֲשֶׁ֥ר אָהַ֛בְתִּי וְ/הָבִ֥יאָ/ה לִּ֖/י וְ/אֹכֵ֑לָה בַּ/עֲב֛וּר תְּבָרֶכְ/ךָ֥ נַפְשִׁ֖/י בְּ/טֶ֥רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/004.yaml
  text: Prepare for me tasty food[a], just as I love, and bring it to me, that I may eat[c][b], so that my soul may bless you before I die.
translation:
  language: hi
  text: और मेरे लिए स्वादिष्ट भोजन बना, जैसा मुझे पसंद है, और उसे मेरे पास ले आ कि मैं खाऊँ, ताकि मेरे मरने से पहले मेरा प्राण[a] तुझे आशीर्वाद दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘मेरा प्राण तुझे आशीर्वाद दे’; यहाँ ‘मेरा प्राण’ से आशय इसहाक स्वयं, अपने पूरे व्यक्तित्व के साथ, है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: मेरे लिए स्वादिष्ट भोजन बना
  rationale: מַטְעַמִּים विशेष रूप से तैयार किए गए स्वादिष्ट भोजन या पकवानों को दर्शाता है। ‘स्वादिष्ट भोजन’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है; क्रिया עשה को भोजन के संदर्भ में ‘बना’ कहना उपयुक्त है।
- source_word: כַּאֲשֶׁר אָהַבְתִּי
  choice: जैसा मुझे पसंद है
  rationale: शाब्दिक ‘जैसा मैंने प्रेम किया है’ हिन्दी में अस्वाभाविक होगा। यहाँ אהב भोजन के प्रति रुचि या पसंद व्यक्त करता है, इसलिए यह अर्थ को सहज रूप में रखता है।
- source_word: וְהָבִיאָה לִּי
  choice: और उसे मेरे पास ले आ
  rationale: यह आज्ञा भोजन को वक्ता के पास लाने को कहती है। स्त्रीलिंग निर्देशात्मक रूप के पीछे מַטְעַמִּים को सामूहिक भोजन के रूप में समझा जा सकता है; हिन्दी में ‘उसे’ इसी संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאֹכֵלָה
  choice: कि मैं खाऊँ
  rationale: कोहोर्टेटिव रूप इच्छित अगली क्रिया को व्यक्त करता है। ‘कि मैं खाऊँ’ आज्ञा और उसके उद्देश्य/परिणाम के संबंध को बनाए रखता है, बिना इसे निश्चित साधारण भविष्य में बदलने के।
- source_word: בַּעֲבוּר
  choice: ताकि
  rationale: यहाँ בַּעֲבוּר उद्देश्य बताता है। ‘ताकि’ आधुनिक हिन्दी में इस प्रयोजन-संबंध को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: मेरा प्राण तुझे आशीर्वाद दे
  rationale: नפשׁ को केवल पृथक अमूर्त ‘आत्मा’ मानने के बजाय ‘प्राण’ से प्रस्तुत किया गया है, जो इस प्रसंग में इसहाक के अपने संपूर्ण जीवित व्यक्तित्व को सूचित करता है और मूल पाठ में संज्ञा को कर्ता बनाए रखने देता है।
- source_word: בְּטֶרֶם אָמוּת
  choice: मेरे मरने से पहले
  rationale: यह कालवाचक उपवाक्य हिन्दी में सीधा, स्पष्ट और मूल के निकट है।
theological_decisions:
- issue: נַפְשִׁי का मानव-स्वरूप संबंधी अर्थ
  choice: मेरा प्राण
  alternative: मैं स्वयं / मेरी आत्मा
  rationale: ‘मैं स्वयं’ मुहावरे का आशय स्पष्ट करता, पर मूल की प्रमुख संज्ञा को हटा देता; ‘मेरी आत्मा’ शरीर से पृथक सत्ता का अनावश्यक संकेत दे सकती है। ‘मेरा प्राण’ मूल की व्यक्तिगत, समग्र आत्म-संदर्भात्मक शक्ति को सुरक्षित रखता है, और पादटिप्पणी संभावित भ्रम दूर करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। पिता द्वारा पुत्र को संबोधन के अनुरूप एकवचन निकट संबोधन ‘तुझे’ तथा आज्ञार्थक ‘बना/ले आ’ रखा गया है। उद्देश्यसूचक क्रम ‘कि मैं खाऊँ, ताकि…’ मूल के वाक्य-संबंधों को यथासंभव सुरक्षित रखता है।
