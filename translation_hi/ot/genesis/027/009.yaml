language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֶךְ נָא֙ אֶל הַ/צֹּ֔אן וְ/קַֽח לִ֣/י מִ/שָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְ/אֶֽעֱשֶׂ֨ה אֹתָ֧/ם מַטְעַמִּ֛ים לְ/אָבִ֖י/ךָ כַּ/אֲשֶׁ֥ר אָהֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/009.yaml
  text: Please go to the flock and get for me from there two good young goats[a], and I will make them into tasty food for your father, just as he loves.
translation:
  language: hi
  text: “ज़रा भेड़-बकरियों के झुंड के पास जा और वहाँ से मेरे लिए बकरी के दो अच्छे बच्चे ले आ। मैं उनसे तेरे पिता के लिए वैसे ही स्वादिष्ट पकवान[a] बनाऊँगी, जैसे उन्हें पसंद हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लज़ीज़ व्यंजन” अथवा “मनभावना भोजन।”
    reason: इब्रानी מַטְעַמִּים स्वादिष्ट या विशेष रूप से रुचिकर बनाए गए व्यंजनों को दर्शाता है; हिन्दी में इसके एक से अधिक स्वाभाविक समतुल्य संभव हैं।
lexical_decisions:
- source_word: לֶךְ נָא
  choice: ज़रा ... जा
  rationale: आज्ञार्थक לֶךְ के साथ נָא अनुरोध अथवा कोमल आग्रह का भाव देता है। माँ द्वारा बेटे से कही गई बात में “ज़रा ... जा” स्वाभाविक आधुनिक हिन्दी में यही भाव व्यक्त करता है।
- source_word: הַצֹּאן
  choice: भेड़-बकरियों के झुंड
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, के सामूहिक झुंड को दर्शाता है। यह अनुवाद अर्थ को स्पष्ट रखता है और अगले पदबंध में बकरी के बच्चों के उल्लेख से मेल खाता है।
- source_word: וְקַח לִי מִשָּׁם
  choice: और वहाँ से मेरे लिए ... ले आ
  rationale: לקח का मूल अर्थ “लेना” है; प्रसंग में पशुओं को वक्ता के पास लाना अपेक्षित है, इसलिए हिन्दी में “ले आ” स्वाभाविक है।
- source_word: שְׁנֵי גְּדָיֵי עִזִּים
  choice: बकरी के दो ... बच्चे
  rationale: यह रचना शाब्दिक रूप से बकरियों के दो बच्चों को दर्शाती है। हिन्दी शब्दक्रम में प्रजाति और आयु दोनों स्पष्ट रहते हैं।
- source_word: טֹבִים
  choice: अच्छे
  rationale: טֹבִים यहाँ पशुओं की गुणवत्ता और पकाने के लिए उनकी उपयुक्तता बताता है; “अच्छे” इसका सीधा और सहज समतुल्य है।
- source_word: וְאֶעֱשֶׂה אֹתָם מַטְעַמִּים
  choice: मैं उनसे ... स्वादिष्ट पकवान बनाऊँगी
  rationale: מַטְעַמִּים स्वादिष्ट, रुचिकर व्यंजनों को दर्शाता है। वक्ता रिबका है, इसलिए हिन्दी में स्त्रीलिंग “बनाऊँगी” आवश्यक है; “उनसे” पशुओं को भोजन के रूप में तैयार करने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְאָבִיךָ
  choice: तेरे पिता के लिए
  rationale: यह 2 पुल्लिंग एकवचन संबंधसूचक रूप है। माँ-बेटे के संवाद में “तेरे” आत्मीय और स्वाभाविक है, जबकि “पिता” गरिमापूर्ण कथात्मक स्तर बनाए रखता है।
- source_word: כַּאֲשֶׁר אָהֵב
  choice: वैसे ही ... जैसे उन्हें पसंद हैं
  rationale: यह इसहाक की जानी-पहचानी भोजन-पसंद को व्यक्त करता है। हिन्दी में “जैसे उन्हें पसंद हैं” स्वाभाविक है और “पिता” के लिए आदरसूचक बहुवचन का प्रयोग करता है।
