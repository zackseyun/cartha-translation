  text: And she put the skins of the young goats on his hands and on the smooth part of his neck.
translation:
  language: hi
  text: और उसने बकरी के बच्चों की खालें उसके हाथों और उसकी गर्दन के चिकने भाग पर लगा दीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹרֹת
  choice: खालें
  rationale: बहुवचन रचनात्मक रूप पशुओं की उतारी हुई खालों को दर्शाता है; इस प्रसंग में ‘खालें’ सहज और सटीक हिन्दी है।
- source_word: גְּדָיֵי הָעִזִּים
  choice: बकरी के बच्चे
  rationale: इब्रानी पदबंध का अर्थ बकरियों के छोटे बच्चे है। ‘बकरी के बच्चे’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הִלְבִּישָׁה
  choice: पहना दीं
  rationale: לבש के हिफ़ील रूप का अर्थ किसी को कुछ पहनाना है। स्त्रीलिंग बहुवचन ‘खालें’ के साथ ‘पहना दीं’ क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל יָדָיו
  choice: उसके हाथों पर
  rationale: यह पूर्वसर्गीय पदबंध का सीधा और स्वाभाविक अनुवाद है।
- source_word: חֶלְקַת צַוָּארָיו
  choice: उसकी गर्दन का चिकना भाग
  rationale: חֶלְקַת यहाँ गर्दन के चिकने अथवा रोएँ-रहित हिस्से को ठोस रूप में बताता है; ‘चिकना भाग’ मूल अर्थ को स्पष्ट रखता है।
