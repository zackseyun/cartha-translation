base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/042.yaml
  text: And the words of Esau, her older son, were told to Rebekah. So she sent and called Jacob, her younger son, and said to him, “Look, Esau your brother is consoling himself about you by planning to kill you.”
translation:
  language: hi
  text: रिबका को उसके बड़े बेटे एसाव की बातें बताई गईं। तब उसने अपने छोटे बेटे याकूब को भेजकर बुलाया और उससे कहा, “देख, तेरा भाई एसाव तुझे मार डालने की सोचकर अपने मन को तसल्ली दे रहा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי עֵשָׂו
  choice: एसाव की बातें
  rationale: बहुवचन construct का सीधा और स्वाभाविक अनुवाद; संदर्भ में एसाव की कही हुई बातों को दर्शाता है।
- source_word: מִתְנַחֵם
  choice: अपने मन को तसल्ली दे रहा है
  rationale: hitpael participle आत्मवाचक अर्थ देता है—एसाव हत्या के विचार से स्वयं को सांत्वना या संतोष दे रहा है। 'तसल्ली' आधुनिक हिंदी में इस विकृत आत्म-सांत्वना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְךָ
  choice: तुझे
  rationale: संदर्भगत रूप से एसाव की शत्रुता याकूब की ओर लक्षित है; हिंदी वाक्य में इसे हत्या के उद्देश्य के साथ स्वाभाविक रूप से रखा गया है।
- source_word: לְהָרְגֶךָ
  choice: मार डालने का विचार करके
  rationale: infinitive construct हत्या को उस आत्म-सांत्वना की विषयवस्तु/साधन के रूप में जोड़ता है; 'विचार करके' तत्काल क्रिया के बजाय मन में ठानी हुई हत्या का भाव स्पष्ट करता है।
theological_decisions:
- issue: מִתְנַחֵם की भावगत अस्पष्टता
  choice: अपने मन को तसल्ली दे रहा है
  alternative: बदला लेने की ठानकर संतोष पा रहा है
  rationale: पाठ में 'बदला' शब्द प्रत्यक्ष नहीं है। चुना हुआ अनुवाद मूल की असहज धार्मिक-मनोवैज्ञानिक विडंबना बनाए रखता है और अतिरिक्त उद्देश्य आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी, आत्मीय पारिवारिक संबोधन में एकवचन 'तू/तेरा' के रूपों सहित। वाक्य गरिमापूर्ण और सामान्य पाठक के लिए सहज रखा गया है; हिब्रू की पुनरुक्त पारिवारिक पहचान—बड़ा बेटा/छोटा बेटा—सुरक्षित है।
