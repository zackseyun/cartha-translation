lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने पूछा
  rationale: אמר का मूल अर्थ ‘कहना’ है, पर प्रश्नवाचक वाक्य के संदर्भ में स्वाभाविक हिन्दी में ‘पूछा’ संवाद का कार्य स्पष्ट करता है।
- source_word: אַתָּה זֶה
  choice: क्या तू सचमुच … ही है
  rationale: स्वतंत्र सर्वनाम और संकेतवाचक זֶה मिलकर पहचान पर बल देते हैं; ‘सचमुच’ और ‘ही’ उस emphatic identification को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: בְּנִי
  choice: मेरा पुत्र
  rationale: प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय को स्पष्ट रूप से रखा गया है; ‘पुत्र’ गरिमापूर्ण और सामान्य बाइबिलीय हिन्दी है।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַיֹּאמֶר
  choice: उसने उत्तर दिया
  rationale: दूसरा אמר प्रश्न के प्रत्युत्तर को प्रस्तुत करता है; हिन्दी में ‘उत्तर दिया’ स्वाभाविक है, यद्यपि शाब्दिक अर्थ ‘कहा’ है।
- source_word: אָֽנִי
  choice: मैं ही हूँ
  rationale: अकेला स्वतंत्र सर्वनाम संक्षिप्त आत्म-पहचान देता है; उत्तर में ‘मैं ही हूँ’ हिन्दी में उसके बल और संक्षिप्तता को व्यक्त करता है।
