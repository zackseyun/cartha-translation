translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, भावपूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। संबोधन में ‘दीजिए’ से स्वाभाविक आदर रखा गया है; मूल की तीव्र पुनरुक्तिपूर्ण अभिव्यक्ति को मुख्य पाठ और पाद-टिप्पणी दोनों में दर्शाया गया है।
