source:
  edition: WLC
  text: כִּ/שְׁמֹ֤עַ עֵשָׂו֙ אֶת דִּבְרֵ֣י אָבִ֔י/ו וַ/יִּצְעַ֣ק צְעָקָ֔ה גְּדֹלָ֥ה וּ/מָרָ֖ה עַד מְאֹ֑ד וַ/יֹּ֣אמֶר לְ/אָבִ֔י/ו בָּרֲכֵ֥/נִי גַם אָ֖נִי אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/034.yaml
  text: When Esau heard his father’s words[a], he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, my father!”
translation:
  language: hi
  text: जब एसाव ने अपने पिता की बातें सुनीं, तो वह अत्यन्त बड़ी और कड़वी चीख के साथ चिल्ला उठा[a] और अपने पिता से बोला, “मेरे पिता, मुझे भी आशीर्वाद दीजिए!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में एक ही शब्द-मूल से बनी क्रिया और संज्ञा साथ प्रयुक्त हैं; अधिक शाब्दिक रूप में, “वह एक अत्यन्त बड़ी और कड़वी चीख चिल्लाया।”
    reason: मूल की बलवर्धक क्रिया-संज्ञा रचना को स्पष्ट करना
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: जब ... सुनीं
  rationale: כִּי के साथ infinitive construct यहाँ समय-सूचक परिस्थिति बताता है। ‘जब’ स्वाभाविक हिन्दी है और तत्कालता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: דִּבְרֵי אָבִיו
  choice: अपने पिता की बातें
  rationale: דָּבָר का मूल अर्थ ‘बात/वचन’ है। प्रसंग में ‘बातें’ आधुनिक हिन्दी में सहज है और पिता द्वारा कही गई बातों को स्पष्ट करता है।
- source_word: וַיִּצְעַק צְעָקָה
  choice: चीख के साथ चिल्ला उठा
  rationale: मूल में एक ही धातु से बने क्रिया और संज्ञा का प्रयोग तीव्रता बढ़ाता है। हिन्दी में दोनों तत्व रखकर उस बल को यथासंभव सुरक्षित रखा गया है।
- source_word: גְּדֹלָה
  choice: बड़ी
  rationale: यह विशेषण मूलतः ‘बड़ी/महान’ का अर्थ देता है। ‘बड़ी’ केवल आवाज़ की ऊँचाई तक अर्थ को सीमित नहीं करती।
- source_word: וּמָרָה
  choice: कड़वी
  rationale: यह एसाव की तीव्र भावनात्मक पीड़ा को सीधे व्यक्त करता है और मूल के ‘कड़वाहट’ वाले बिंब को बनाए रखता है।
- source_word: עַד מְאֹד
  choice: अत्यन्त
  rationale: यह पद वर्णन की तीव्रता को बहुत बढ़ाता है; ‘अत्यन्त’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक हिन्दी है।
- source_word: בָּרֲכֵנִי
  choice: मुझे ... आशीर्वाद दीजिए
  rationale: आज्ञार्थक निवेदन की सीधी और व्याकुल शक्ति को रखते हुए पिता के प्रति हिन्दी का स्वाभाविक आदरसूचक रूप अपनाया गया है।
- source_word: גַם אָנִי
  choice: मुझे भी
  rationale: यह एसाव के आग्रह पर बल देता है कि उसे भी आशीर्वाद मिले; हिन्दी में क्रिया के साथ यह सबसे स्वाभाविक क्रम है।
- source_word: אָבִי
  choice: मेरे पिता
  rationale: मूल का प्रथम पुरुष स्वामित्वसूचक प्रत्यय स्पष्ट रूप से सुरक्षित है और संबोधन की करुणा बनी रहती है।
