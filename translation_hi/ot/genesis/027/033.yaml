source:
  edition: WLC
  text: וַ/יֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד מְאֹד֒ וַ/יֹּ֡אמֶר מִֽי אֵפ֡וֹא ה֣וּא הַ/צָּֽד צַיִד֩ וַ/יָּ֨בֵא לִ֜/י וָ/אֹכַ֥ל מִ/כֹּ֛ל בְּ/טֶ֥רֶם תָּב֖וֹא וָ/אֲבָרֲכֵ֑/הוּ גַּם בָּר֖וּךְ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/033.yaml
  text: Then Isaac trembled with a very great trembling and said[a], “Who then was it who hunted game and brought it to me, and I ate from all of it before you came and blessed him? Yes, and he will be blessed.”
translation:
  language: hi
  text: तब इसहाक अत्यन्त थरथर काँप उठा और बोला, “तो फिर वह कौन था जिसने शिकार किया और उसे मेरे पास लाया, और तेरे आने से पहले मैंने उसमें से सब कुछ खाया और उसे आशीर्वाद दिया? हाँ, वह निश्चय ही धन्य होगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד ... חֲרָדָה גְּדֹלָה עַד מְאֹד
  choice: अत्यन्त थरथर काँप उठा
  rationale: सजातीय क्रिया और संज्ञा के द्वारा व्यक्त तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है; यह सदमे और प्रबल भावनात्मक-शारीरिक प्रतिक्रिया को दिखाता है, पर केवल ‘भयभीत हुआ’ कहकर अर्थ सीमित नहीं करता।
- source_word: מִי אֵפוֹא הוּא
  choice: तो फिर वह कौन था
  rationale: אֵפוֹא के निष्कर्षात्मक और बलात्मक भाव को ‘तो फिर’ व्यक्त करता है; बीती घटना के संदर्भ में ‘था’ स्वाभाविक है।
- source_word: הַצָּד צַיִד
  choice: जो शिकार करके
  rationale: क्रिया और उसके सजातीय कर्म का अर्थ सहज आधुनिक हिन्दी में देता है; किसी विशेष पशु का अनावश्यक अनुमान नहीं लगाता।
- source_word: וַיָּבֵא לִי
  choice: मेरे पास लाया
  rationale: पिछले पदबंध से ‘शिकार’ कर्म समझ में आता है, इसलिए हिन्दी में उसे दोहराए बिना कथन स्पष्ट रहता है।
- source_word: וָאֹכַל מִכֹּל
  choice: मैंने उसमें से सब कुछ खाया
  rationale: מִן की अंशवाचक छाया को ‘उसमें से’ द्वारा और כֹּל की व्यापकता को ‘सब कुछ’ द्वारा सुरक्षित रखा गया है।
- source_word: בְּטֶרֶם תָּבוֹא
  choice: तेरे आने से पहले
  rationale: कालगत उपवाक्य का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וָאֲבָרֲכֵהוּ
  choice: और उसे आशीर्वाद दिया
  rationale: पहले पुरुष का कर्ता पिछले ‘मैंने’ से स्पष्ट है; संयुक्त विधेय में उसे दोहराना आवश्यक नहीं।
- source_word: גַּם בָּרוּךְ יִהְיֶה
  choice: हाँ, वह आशीषित ही रहेगा
  rationale: גַּם की बलात्मक पुष्टि को ‘हाँ’ और ‘ही’ से तथा יִהְיֶה के भविष्य/स्थायी परिणाम को ‘रहेगा’ से व्यक्त किया गया है।
theological_decisions:
- issue: पहले दिए जा चुके आशीर्वाद के विषय में इसहाक की अंतिम घोषणा का बल
  choice: दृढ़ पुष्टि कि दिया गया आशीर्वाद प्रभावी बना रहेगा
  alternative: केवल विवश या निरुत्साहित स्वीकृति
  rationale: גַּם בָּרוּךְ יִהְיֶה बलात्मक पुष्टि है। ‘आशीषित ही रहेगा’ आशीर्वाद के बने रहने का कथात्मक भार सुरक्षित रखता है, पर उसकी कार्यविधि पर कोई बाद की धर्मवैज्ञानिक व्याख्या नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य-पाठक-सुलभ कथात्मक रूप। ‘थरथर काँप उठा’ हिब्रू की तीव्र पुनरुक्ति को मुहावरेदार हिन्दी में व्यक्त करता है। संबोधन में ‘तेरे’ रखा गया है, जो पितृ-पुत्र संवाद और बाइबिलीय कथा-शैली के अनुकूल है।
