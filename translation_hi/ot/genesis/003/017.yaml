source:
  edition: WLC
  text: וּ/לְ/אָדָ֣ם אָמַ֗ר כִּֽי שָׁמַעְתָּ֮ לְ/ק֣וֹל אִשְׁתֶּ/ךָ֒ וַ/תֹּ֨אכַל֙ מִן הָ/עֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ אֲרוּרָ֤ה הָֽ/אֲדָמָה֙ בַּֽ/עֲבוּרֶ֔/ךָ בְּ/עִצָּבוֹן֙ תֹּֽאכֲלֶ֔/נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/017.yaml
  text: And to Adam he said[a], “Because you listened to the voice of your wife and ate from the tree about which I commanded you, saying, ‘You shall not eat from it,’ the ground is cursed because of you[f][e][d][c][b]; in painful toil you shall eat from it all the days of your life.”
translation:
  language: hi
  text: और आदम से उसने कहा,[a] “क्योंकि तुमने अपनी पत्नी की बात मानी और उस वृक्ष में से खाया, जिसके विषय में मैंने तुम्हें यह कहकर आज्ञा दी थी, ‘तुम उसमें से न खाना,’ इसलिए भूमि तुम्हारे कारण शापित है। अपने जीवन भर तुम कष्ट उठाकर उसी से खाओगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मनुष्य से।”
    reason: alternative_reading
lexical_decisions:
- source_word: לְאָדָם
  choice: आदम से
  rationale: संदर्भ में एक विशिष्ट व्यक्ति संबोधित है; इसलिए नाम ‘आदम’ मुख्य पाठ में स्वाभाविक है, जबकि ‘मनुष्य’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  choice: तुमने अपनी पत्नी की बात मानी
  rationale: हिब्रू मुहावरे का अर्थ उसकी कही बात पर ध्यान देकर उसके अनुसार चलना है। ‘बात मानी’ आधुनिक हिन्दी में स्वाभाविक है और केवल सुन लेने की अपेक्षा प्रसंग का आशय अधिक ठीक व्यक्त करता है।
- source_word: וַתֹּאכַל מִן הָעֵץ
  choice: उस वृक्ष में से खाया
  rationale: מִן के स्रोत या भागवाचक भाव को हिन्दी के ‘में से’ द्वारा स्पष्ट रखा गया है।
- source_word: אֲשֶׁר צִוִּיתִיךָ לֵאמֹר
  choice: जिसके विषय में मैंने तुम्हें आज्ञा दी थी
  rationale: सम्बन्धवाचक उपवाक्य और आज्ञा का विषय सुरक्षित है; לֵאמֹר को हिन्दी में आगे दिए गए प्रत्यक्ष उद्धरण से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: לֹא תֹאכַל מִמֶּנּוּ
  choice: तुम उसमें से न खाना
  rationale: निषेधात्मक आज्ञा को गरिमापूर्ण और सहज हिन्दी में रखा गया है तथा מִמֶּנּוּ का ‘उसमें से’ स्पष्ट है।
- source_word: אֲרוּרָה הָאֲדָמָה
  choice: भूमि ... शापित है
  rationale: कृषि और उपज के प्रसंग में אֲדָמָה के लिए ‘भूमि’ उपयुक्त है; विधेय संरचना को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: בַּעֲבוּרֶךָ
  choice: तुम्हारे कारण
  rationale: यह आदम के कार्य के कारण आए परिणाम को व्यक्त करता है; ‘तुम्हारे लिए’ से उत्पन्न लाभार्थक अस्पष्टता से बचा गया है।
- source_word: בְּעִצָּבוֹן
  choice: कष्ट उठाकर
  rationale: शब्द में पीड़ा, कठिनाई और श्रम का संयुक्त भाव है। भोजन प्राप्त करने के प्रसंग में ‘कष्ट उठाकर’ इस व्यापकता को स्वाभाविक हिन्दी में रखता है।
- source_word: תֹּאכֲלֶנָּה
  choice: उसी से खाओगे
  rationale: स्त्रीलिंग प्रत्यय भूमि की ओर संकेत करता है। अर्थ मिट्टी खाने का नहीं, भूमि से भोजन पाने का है; ‘उसी से’ इस संदर्भ को स्पष्ट रखता है।
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: अपने जीवन भर
  rationale: यह हिब्रू मुहावरे का सहज आधुनिक हिन्दी रूप है और न्याय की आजीवन अवधि को स्पष्ट करता है।
theological_decisions:
- issue: אָדָם को नाम या सामान्य संज्ञा मानना
  choice: आदम
  alternative: मनुष्य
  rationale: इस कथा-प्रसंग में संबोधन विशिष्ट पुरुष का है, इसलिए मुख्य पाठ में व्यक्तिगत नाम चुना गया है; मूल रूप की सम्भव सामान्य-संज्ञात्मक समझ पादटिप्पणी में सुरक्षित है।
- issue: שׁמע לקול का अर्थ
  choice: पत्नी की बात मानी
  alternative: पत्नी की आवाज़ सुनी
  rationale: यह मुहावरा केवल श्रवण नहीं, कही बात को मानने का भाव रखता है। फिर भी ‘आज्ञा मानी’ जैसे अधिक प्रबल पद से बचकर मूल की अर्थ-सीमा बनाए रखी गई है।
- issue: בְּעִצָּבוֹן में पीड़ा और श्रम का सम्बन्ध
  choice: कष्ट उठाकर
  alternative: दुःख में / पीड़ादायक परिश्रम से
  rationale: शब्द की अर्थ-व्याप्ति को केवल भावनात्मक दुःख या केवल शारीरिक मेहनत तक सीमित नहीं किया गया; भोजन जुटाने की कठिनाई का संयुक्त भाव रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘भूमि’, ‘शापित’ और ‘आज्ञा’ जैसे परिचित बाइबलीय पद रखे गए हैं, जबकि अनावश्यक संस्कृतनिष्ठ या शब्दशः अस्वाभाविक संरचनाओं से बचा गया है।
