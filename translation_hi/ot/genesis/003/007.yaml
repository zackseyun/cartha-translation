base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/007.yaml
  text: Then the eyes of both of them were opened[a], and they knew that they were naked[b]. So they sewed fig leaves together and made coverings for themselves.
translation:
  language: hi
  text: तब उन दोनों की आँखें खुल गईं और उन्हें मालूम हुआ कि वे नंगे हैं। इसलिए उन्होंने अंजीर के पत्ते सीकर अपने लिए कमर के वस्त्र[a] बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कमरबंद”; इब्रानी शब्द का अर्थ कमर के चारों ओर बाँधी जाने वाली वस्तु है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפָּקַחְנָה
  choice: खुल गईं
  rationale: निफ़अल रूप का स्वाभाविक हिन्दी अनुवाद है और इब्रानी मुहावरे को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: उन दोनों की आँखें
  rationale: दोनों व्यक्तियों पर इब्रानी के बल को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֵּדְעוּ
  choice: उन्हें मालूम हुआ
  rationale: इस प्रसंग में इसका अर्थ किसी तथ्य का बोध होना है; यह हिन्दी में सहज है और 'समझ गए' जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: עֵירֻמִּם
  choice: नंगे
  rationale: विशेषण का सीधा और वर्तमान हिन्दी में सामान्य अर्थ है; यह उत्पत्ति 2:25 से कथात्मक संबंध भी बनाए रखता है।
- source_word: וַיִּתְפְּרוּ
  choice: सीकर
  rationale: पत्तों को सिलने या जोड़ने की क्रिया का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: עֲלֵה תְאֵנָה
  choice: अंजीर के पत्ते
  rationale: इब्रानी समास का प्रचलित और सटीक हिन्दी रूप है।
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: अपने लिए ... बनाए
  rationale: इब्रानी में व्यक्त आत्महितकारी अर्थ को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: חֲגֹרֹת
  choice: कमर के वस्त्र
  rationale: शब्द ऐसी वस्तु को सूचित करता है जो कमर के चारों ओर बाँधी जाती है। यह सामान्य 'ढकाव' से अधिक सटीक है, जबकि उसकी ठीक बनावट को निर्धारित नहीं करता।
theological_decisions:
- issue: नई अनुभूति, लज्जा और नैतिक चेतना का संबंध
  choice: आँखें खुलने और नग्नता का बोध होने की घटना को वर्णनात्मक रूप में रखा गया है।
  alternative: ‘उन्हें लज्जा आई’ या ‘उनका विवेक जाग उठा’ जोड़ना।
  rationale: पद बदली हुई आत्म-जागरूकता का संकेत देता है, पर लज्जा या विवेक को स्पष्ट रूप से नहीं कहता; इसलिए अनुवाद इस धर्मवैचारिक तनाव को अनसुलझा रखता है।
- issue: חֲגֹרֹת का स्वरूप
  choice: कमर के वस्त्र
  alternative: ढकने की चीज़ें; लंगोट; एप्रन
  rationale: इब्रानी शब्द कमर पर बाँधी जाने वाली वस्तु बताता है, पर उसके निश्चित आकार को नहीं। चुना गया रूप इस सीमा को बनाए रखते हुए आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक गद्य। ‘उन्हें मालूम हुआ’ सहज बोध को व्यक्त करता है; ‘कमर के वस्त्र’ सटीकता और सामान्य पाठक की समझ के बीच संतुलन रखता है।
