  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथा-शैली अपनाई गई है। छोटे वाक्यों से घटनाक्रम स्पष्ट रखा गया है। 'पति' संदर्भानुकूल है, जबकि पहले उल्लेख में मूल के अनुसार 'स्त्री' रखा गया है। फुटनोट-चिह्न उन्हीं पदों पर लगाए गए हैं जिनकी lexical alternatives वे समझाते हैं।
