base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/006.yaml
  text: So the woman saw that the tree was good for food[a], and that it was a delight to the eyes, and that the tree was desirable to make one wise. So she took from its fruit and ate, and she also gave some to her husband, who was with her[b], and he ate.
translation:
  language: hi
  text: तब स्त्री ने देखा कि वह वृक्ष खाने के लिए अच्छा, आँखों को लुभावना[a], और बुद्धि प्राप्त करने के लिए वांछनीय[b] है। तब उसने उसके फल में से लिया और खाया; और अपने पति को भी, जो उसके साथ था, उसमें से दिया, और उसने खाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आँखों के लिए वांछनीय” या “आँखों को भाने वाला।” इब्रानी अभिव्यक्ति वृक्ष के दृश्य आकर्षण पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: या, “बुद्धिमान बनाने के लिए।” इब्रानी क्रिया का अर्थ बुद्धि या समझ प्राप्त करना अथवा बुद्धिमान बनाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: देखा
  rationale: मूल क्रिया के सीधे अवलोकनात्मक अर्थ को बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: הָאִשָּׁה
  choice: स्त्री
  rationale: इब्रानी कथन में प्रयुक्त सामान्य पद को बनाए रखता है; यहाँ समय से पहले वैवाहिक भूमिका को प्रमुख नहीं बनाता।
- source_word: טוֹב ... לְמַאֲכָל
  choice: खाने के लिए अच्छा
  rationale: वृक्ष के भोजन के योग्य होने का स्वाभाविक और मूल के निकट हिन्दी रूप है।
- source_word: תַאֲוָה ... לָעֵינַיִם
  choice: आँखों को लुभावना
  rationale: दृश्य आकर्षण को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना इसे पहले से पापपूर्ण वासना का रंग दिए।
- source_word: וְנֶחְמָד
  choice: चाहने योग्य
  rationale: आकर्षक या वांछनीय होने का भाव रखता है और 'लोभनीय' जैसे अधिक नकारात्मक नैतिक रंग से बचता है।
- source_word: לְהַשְׂכִּיל
  choice: बुद्धि पाने के लिए
  rationale: שכל के हिफ़ील रूप में निहित बुद्धि या सूझ प्राप्त करने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; संभावित कारक अर्थ फुटनोट में रखा गया है।
- source_word: מִפִּרְיוֹ
  choice: उसका फल लेकर
  rationale: מן के स्रोत-सूचक भाव और सामूहिक एकवचन 'फल' दोनों को स्वाभाविक हिन्दी कथा-शैली में रखता है।
- source_word: וַתִּתֵּן גַּם לְאִישָׁהּ עִמָּהּ
  choice: अपने पति को भी, जो उसके साथ था, उसमें से दिया
  rationale: גם के अतिरिक्तता-बोध और עִמָּהּ द्वारा पति की उपस्थिति—दोनों को स्पष्ट रखता है; 'उसमें से' हिन्दी में लुप्त कर्म को सहज बनाता है।
theological_decisions:
- issue: स्त्री की दृष्टि का नैतिक रंग
  choice: '''अच्छा,'' ''लुभावना,'' और ''चाहने योग्य'' जैसे अपेक्षाकृत तटस्थ मूल्यांकनात्मक शब्द'
  alternative: '''वासना,'' ''लोभनीय,'' या ''प्रलोभक'' जैसे स्पष्टतः नकारात्मक शब्द'
  rationale: इब्रानी पाठ स्त्री की धारणा को सकारात्मक मूल्यांकनात्मक भाषा में बताता है और उसके बाद अवज्ञा के कार्य का वर्णन करता है; अनुवाद को वर्णन में मूल से अधिक नैतिक निर्णय नहीं जोड़ना चाहिए।
- issue: לְהַשְׂכִּיל का अर्थ
  choice: मुख्य पाठ में 'बुद्धि पाने के लिए' और फुटनोट में 'बुद्धिमान बनाने के लिए'
  alternative: केवल 'बुद्धिमान बनाने के लिए'
  rationale: क्रिया बुद्धि या सूझ प्राप्त करने और किसी को बुद्धिमान बनाने—दोनों की ओर संकेत कर सकती है; मुख्य पाठ स्वाभाविक हिन्दी देता है और फुटनोट वास्तविक अर्थगत संभावना बचाता है।
- issue: पति की उपस्थिति
  choice: '''जो उसके साथ था'' को पति से स्पष्ट रूप से जोड़ना'
  alternative: अधिक शब्दशः किंतु अस्पष्ट 'अपने साथ के पति को'
  rationale: עִמָּהּ पति के उसके साथ होने का कथात्मक विवरण देता है; स्पष्ट हिन्दी वाक्य-विन्यास इस विवरण को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
