source:
  edition: WLC
  text: וּ/מִ/פְּרִ֣י הָ/עֵץ֮ אֲשֶׁ֣ר בְּ/תוֹךְ הַ/גָּן֒ אָמַ֣ר אֱלֹהִ֗ים לֹ֤א תֹֽאכְלוּ֙ מִמֶּ֔/נּוּ וְ/לֹ֥א תִגְּע֖וּ בּ֑/וֹ פֶּן תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/003.yaml
  text: But from the fruit of the tree that is in the middle of the garden[a], God said, ‘You shall not eat from it, and you shall not touch it, lest you die.’
translation:
  language: hi
  text: परन्तु बगीचे के बीच में जो पेड़ है, उसके फल में से परमेश्वर ने कहा, ‘तुम उसमें से मत खाना और उसे मत छूना, कहीं ऐसा न हो कि तुम मर जाओ।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/פְּרִי
  choice: परन्तु ... उसके फल के विषय में
  rationale: וְ संदर्भ में पिछले वचन के साथ विरोध प्रकट करता है, इसलिए ‘परन्तु’ स्वाभाविक है। מן की संबंधसूचक/विषयगत शक्ति को हिन्दी में ‘फल के विषय में’ द्वारा स्पष्ट किया गया है; आगे ‘उसमें से’ खाने के स्रोत को व्यक्त करता है।
- source_word: אֲשֶׁר בְּ/תוֹךְ הַ/גָּן
  choice: जो पेड़ बगीचे के बीच में है
  rationale: בְּתוֹךְ के स्थानगत अर्थ ‘भीतर/बीच’ को सामान्य आधुनिक हिन्दी में ‘बगीचे के बीच में’ व्यक्त किया गया है।
- source_word: אָמַר אֱלֹהִים
  choice: परमेश्वर ने कहा
  rationale: पूर्व में कही गई बात की कथात्मक सूचना के लिए साधारण भूतकाल स्वाभाविक और सटीक है।
- source_word: לֹא תֹאכְלוּ מִמֶּנּוּ
  choice: तुम उसमें से न खाना
  rationale: निषेधात्मक अपूर्ण क्रिया का आज्ञार्थक बल ‘न खाना’ से स्वाभाविक हिन्दी में आता है, और מן को ‘उसमें से’ सुरक्षित रखता है।
- source_word: וְ/לֹא תִגְּעוּ בּ/וֹ
  choice: और न उसे छूना
  rationale: נגע का सीधा अर्थ ‘छूना’ है। संयोजक וְ और अतिरिक्त निषेध दोनों बनाए रखे गए हैं।
- source_word: פֶּן תְּמֻתוּן
  choice: कहीं ऐसा न हो कि तुम मर जाओ
  rationale: פֶּן संभावित अथवा आशंकित नकारात्मक परिणाम प्रस्तुत करता है। यह हिन्दी प्रयोग उस विधिसूचक तनाव को बनाए रखता है और निश्चित भविष्यवाणी नहीं बनाता।
theological_decisions:
- issue: हव्वा के कथन में ‘और न उसे छूना’ जोड़ा गया है, जो उत्पत्ति 2:17 के आदेश में नहीं मिलता।
  choice: हव्वा के कथन को इसी वचन में दिए गए रूप में पूर्णतः अनूदित किया गया है।
  alternative: उत्पत्ति 2:17 से सामंजस्य बैठाने के लिए ‘और न उसे छूना’ को हटाना या हल्का करना।
  rationale: मूल इब्रानी में उपस्थित कथात्मक और धर्मवैचारिक तनाव को बनाए रखना आवश्यक है; अनुवाद को पहले के आदेश के अनुरूप बनाने के लिए वक्ता के शब्द नहीं बदलने चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। ‘परन्तु’ औपचारिक विरोध को और ‘कहीं ऐसा न हो कि’ פֶּן की संभाव्य चेतावनी को स्पष्ट करता है।
