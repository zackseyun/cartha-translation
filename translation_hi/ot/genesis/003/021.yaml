base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/021.yaml
  text: And Yahweh God made garments of skin for the man and for his wife[b][a], and clothed them.
translation:
  language: hi
  text: और यहोवा परमेश्वर ने उस पुरुष[a] और उसकी पत्नी के लिए चमड़े के वस्त्र[b] बनाए और उन्हें पहनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आदम और उसकी पत्नी के लिए।” इब्रानी אָדָם प्रसंग के अनुसार व्यक्तिगत नाम “आदम” अथवा सामान्य संज्ञा “पुरुष” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “चमड़े के अंगरखे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से और אֱלֹהִים को इस प्रसंग में स्वाभाविक ‘परमेश्वर’ से व्यक्त किया गया है।
- source_word: לְאָדָם
  choice: उस पुरुष के लिए
  rationale: पत्नी के साथ विरोध-संबंध में אָדָם यहाँ एक विशिष्ट पुरुष को दर्शाता है। ‘उस पुरुष’ हिन्दी में कथात्मक संदर्भ को स्पष्ट रखता है, जबकि मूल में ‘आदम’ नाम की संभावना बनी रहती है।
- source_word: וּלְאִשְׁתּוֹ
  choice: और उसकी पत्नी के लिए
  rationale: संबंधवाचक प्रत्यय सहित אִשָּׁה का इस वैवाहिक प्रसंग में स्वाभाविक अर्थ ‘उसकी पत्नी’ है।
- source_word: כָּתְנוֹת עוֹר
  choice: चमड़े के वस्त्र
  rationale: כֻּתֹּנֶת शरीर पर पहना जाने वाला परिधान है और עוֹר त्वचा या खाल को दर्शाता है। ‘चमड़े के वस्त्र’ आधुनिक हिन्दी में सहज है; अधिक रूप-विशिष्ट ‘अंगरखे’ की संभावना पादटिप्पणी में दी गई है।
- source_word: וַיַּעַשׂ
  choice: बनाए
  rationale: עשה का सीधा और अलंकरणरहित अर्थ ‘बनाना’ है।
- source_word: וַיַּלְבִּשֵׁם
  choice: और उन्हें पहना दिए
  rationale: לבש का हिफ़ील रूप किसी को वस्त्र पहनाने का अर्थ देता है; ‘उन्हें पहना दिए’ आधुनिक हिन्दी में स्वाभाविक और कर्तृक क्रिया को स्पष्ट करता है।
theological_decisions:
- issue: אָדָם को व्यक्तिगत नाम मानना या जातिवाचक संज्ञा
  choice: 'जातिवाचक अर्थ: ‘उस पुरुष’'
  alternative: 'व्यक्तिगत नाम: ‘आदम’'
  rationale: इस चरण में इब्रानी शब्द पत्नी के सामने रखे गए पुरुष को स्वाभाविक रूप से सूचित करता है, किंतु व्यक्तिगत नाम के रूप में पढ़ा जाना भी संभव है। मुख्य पाठ जातिवाचक अर्थ रखता है और पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी वाक्य की क्रमिक क्रियाएँ—बनाना और पहनाना—सुरक्षित हैं। पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
