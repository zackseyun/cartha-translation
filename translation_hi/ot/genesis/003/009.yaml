reference: Genesis 3:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְרָ֛א יְהוָ֥ה אֱלֹהִ֖ים אֶל הָֽ/אָדָ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ אַיֶּֽ/כָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/009.yaml
  text: Then Yahweh God called to the man and said to him[a], “Where are you?”
translation:
  language: hi
  text: तब याहवे[a] परमेश्वर ने उस मनुष्य को पुकारा और उससे कहा, “तुम कहाँ हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ परमेश्वर का व्यक्तिगत नाम יהוה (याहवे) है; कई अनुवाद इसे “प्रभु” लिखते हैं।
    reason: ईश्वरीय नाम के पारंपरिक वैकल्पिक निरूपण को बताना।
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: पुकारा
  rationale: קרא के क़ाल रूप का यहाँ अर्थ आवाज़ देकर बुलाना है। “पुकारा” स्वाभाविक है और प्रसंग से अधिक अर्थ नहीं जोड़ता।
- source_word: יְהוָה אֱלֹהִים
  choice: याहवे परमेश्वर
  rationale: संयुक्त ईश्वरीय पदवी में יְהוָה व्यक्तिगत नाम है और אֱלֹהִים के लिए प्रचलित, गरिमापूर्ण हिन्दी शब्द “परमेश्वर” उपयुक्त है।
- source_word: אֶל־הָאָדָם
  choice: उस मनुष्य को
  rationale: אֶל यहाँ पुकारने की दिशा अथवा संबोधन को दिखाता है। הָאָדָם इस प्रसंग में किसी सामान्य मानवजाति को नहीं, पहले से उल्लिखित विशिष्ट पुरुष मनुष्य को सूचित करता है; “उस” इब्रानी निश्चितता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֹּאמֶר לוֹ
  choice: और उससे कहा
  rationale: हिन्दी में “उससे कहा” स्पष्ट रूप से इब्रानी לוֹ, अर्थात् “उससे/उसको,” को बनाए रखता है।
- source_word: אַיֶּכָּה
  choice: तुम कहाँ हो?
  rationale: यह द्वितीय पुरुष एकवचन पुल्लिंग को संबोधित स्थानवाचक प्रश्न है। हिन्दी में “तुम कहाँ हो?” इसका सीधा और स्वाभाविक रूप है।
- source_word: וַ
  choice: तब
  rationale: आरंभिक वाव कथा की क्रमिक अगली घटना प्रस्तुत करता है; आधुनिक हिन्दी में “तब” इस अनुक्रम को सहजता से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। “याहवे” नाम को स्पष्ट रखता है; “प्रभु” पारंपरिक प्रतिस्थापन है, जिसे पादटिप्पणी में बताया गया है।
- issue: הָאָדָם का संदर्भ
  choice: उस मनुष्य
  alternative: मानवजाति
  rationale: यहाँ परमेश्वर वाटिका में एक विशिष्ट पुरुष को संबोधित कर रहे हैं, इसलिए सामूहिक अर्थ “मानवजाति” प्रसंगानुकूल नहीं है। फिर भी अनावश्यक रूप से इसे व्यक्तिवाचक नाम “आदम” नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। “उस मनुष्य” मूल के निश्चित संदर्भ को बनाए रखता है, जबकि “तुम कहाँ हो?” प्रत्यक्ष संबोधन की स्वाभाविक हिन्दी है।
