source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מִ֚י הִגִּ֣יד לְ/ךָ֔ כִּ֥י עֵירֹ֖ם אָ֑תָּה הֲ/מִן הָ/עֵ֗ץ אֲשֶׁ֧ר צִוִּיתִ֛י/ךָ לְ/בִלְתִּ֥י אֲכָל מִמֶּ֖/נּוּ אָכָֽלְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/011.yaml
  text: And he said[b][a], “Who told you that you were naked? Have you eaten from the tree from which I commanded you not to eat?”
translation:
  language: hi
  text: और उसने कहा, “तुम्हें किसने बताया कि तुम नंगे हो? क्या तुमने उस पेड़ से खाया है[a], जिसके विषय में मैंने तुम्हें आज्ञा दी थी कि तुम उसमें से न खाना?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुमने उस पेड़ से खाया?” इब्रानी पूर्ण क्रिया का इस प्रसंग में हिन्दी में ‘खाया है’ या ‘खाया’—दोनों प्रकार से अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है। ‘तब उसने कहा’ आधुनिक हिन्दी में स्वाभाविक है और पद में अनकहे कर्ता को ‘उसने’ के रूप में बनाए रखता है।
- source_word: מִי הִגִּיד לְךָ
  choice: तुम्हें किसने बताया
  rationale: हिफ़इल क्रिया הִגִּיד का यहाँ सामान्य अर्थ ‘बताया’ है; प्रश्नवाचक מִי को ‘किसने’ से ठीक प्रकार व्यक्त किया गया है।
- source_word: כִּי עֵירֹם אָתָּה
  choice: कि तुम नंगे हो
  rationale: इब्रानी में यह वर्तमान अवस्था बताने वाला संज्ञारहित वाक्य है। ‘नंगे हो’ अर्थ और प्रसंग दोनों को सीधे व्यक्त करता है।
- source_word: הֲמִן הָעֵץ ... אָכָלְתָּ
  choice: क्या तुमने उस पेड़ में से खाया है
  rationale: प्रश्नसूचक הֲ को ‘क्या’ से और מן को ‘में से’ से व्यक्त किया गया है। हिन्दी का पूर्ण वर्तमान हाल में किए गए और वर्तमान महत्त्व रखने वाले कार्य के लिए स्वाभाविक है।
- source_word: אֲשֶׁר צִוִּיתִיךָ לְבִלְתִּי אֲכָל מִמֶּנּוּ
  choice: जिसके बारे में मैंने तुम्हें आज्ञा दी थी कि उसमें से न खाना
  rationale: यह अनुवाद आज्ञा और निषेध दोनों को स्पष्ट रखता है तथा מִמֶּנּוּ के ‘उसमें से’ संबंध को भी नहीं हटाता।
theological_decisions:
- issue: एकवचन पुल्लिंग कर्ता की पहचान
  choice: ‘उसने’ रखा गया; ‘यहोवा परमेश्वर’ नहीं जोड़ा गया
  alternative: ‘यहोवा परमेश्वर ने कहा’
  rationale: इस पद में कर्ता का नाम दोबारा नहीं आया है; केवल एकवचन पुल्लिंग क्रिया है। पहले के प्रसंग से कर्ता परमेश्वर है, पर इस वाक्य में स्रोत जितना कहता है उससे अधिक जोड़ना उचित नहीं।
- issue: प्रश्न में पूर्ण क्रिया का काल-पक्ष
  choice: ‘खाया है’
  alternative: ‘खाया’
  rationale: इब्रानी पूर्ण रूप हाल में पूरे हुए कार्य और उसके वर्तमान परिणाम दोनों के अनुकूल है। हिन्दी में दोनों अनुवाद संभव हैं; मुख्य पाठ में वर्तमान-संबद्धता को स्वाभाविक रूप से व्यक्त किया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘फल’ शब्द नहीं जोड़ा गया, क्योंकि वह इस पद के इब्रानी पाठ में स्पष्ट रूप से नहीं है। ‘पेड़ में से खाना’ सामान्य बोलचाल की तुलना में कुछ स्रोत-समीप है, पर अर्थ स्पष्ट है और मूल के מן/מִמֶּנּוּ संबंध को सुरक्षित रखता है।
