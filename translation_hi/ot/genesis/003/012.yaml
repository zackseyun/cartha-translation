id: GEN.3.12
reference: Genesis 3:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר הָֽ/אָדָ֑ם הָֽ/אִשָּׁה֙ אֲשֶׁ֣ר נָתַ֣תָּה עִמָּדִ֔/י הִ֛וא נָֽתְנָה לִּ֥/י מִן הָ/עֵ֖ץ וָ/אֹכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/012.yaml
  text: And the man said[a], “The woman whom you gave to be with me—she gave me from the tree, and I ate.”
translation:
  language: hi
  text: तब आदमी ने कहा, “जिस स्त्री को तूने मेरे साथ रहने के लिए दिया था—उसी ने मुझे उस पेड़ का फल[a] दिया, और मैंने खाया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शब्दशः “उस पेड़ में से”; “फल” संदर्भ से निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם
  choice: आदमी
  rationale: यहाँ शब्द सामान्य मानवजाति नहीं, उस पुरुष व्यक्ति को संदर्भित करता है; आधुनिक हिन्दी में ‘आदमी’ स्वाभाविक और सीधा है।
- source_word: הָאִשָּׁה
  choice: स्त्री
  rationale: इब्रानी में ‘स्त्री’ है; ‘पत्नी’ संभव संबंध बताता, पर मूल शब्दावली से अधिक विशिष्ट होता।
- source_word: אֲשֶׁר נָתַתָּה עִמָּדִי
  choice: जिस स्त्री को तूने मेरे साथ रहने के लिए दिया था
  rationale: यह संगति के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है और परमेश्वर की ओर संकेत करने वाले मूल कथन को न नरम करता है, न तीखा।
- source_word: הִוא
  choice: उसी ने
  rationale: स्वतंत्र सर्वनाम का बल हिन्दी में ‘उसी ने’ से स्पष्ट और स्वाभाविक रूप से प्रकट होता है।
- source_word: נָתְנָה לִי
  choice: मुझे ... दिया
  rationale: सरल पूर्ण भूतकाल कथा के क्रम के अनुकूल है।
- source_word: מִן הָעֵץ
  choice: उस पेड़ का फल
  rationale: मूल में शब्दशः ‘पेड़ में से’ है और वस्तु संदर्भ से निहित है; हिन्दी में वाक्य पूरा और सहज बनाने के लिए ‘फल’ जोड़ा गया है तथा इसे पादटिप्पणी में बताया गया है।
- source_word: וָאֹכֵל
  choice: और मैंने खाया
  rationale: यह क्रिया-क्रम को बिना अतिरिक्त कारणात्मक अर्थ जोड़े सीधे बनाए रखता है।
theological_decisions:
- issue: आदमी के उत्तर में परमेश्वर और स्त्री पर दोष डालने का संभावित संकेत
  choice: ‘जिस स्त्री को तूने मेरे साथ रहने के लिए दिया था’ को यथावत तनाव सहित रखना
  alternative: ‘उस स्त्री ने’ अथवा ‘जो स्त्री मेरे साथ थी’
  rationale: मूल कथन परमेश्वर के देने और स्त्री के कार्य दोनों को उभारता है। अनुवाद इस निहित दोषारोपण को न कम करता है, न व्याख्यात्मक रूप से बढ़ाता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। संबोधन में ‘तूने’ का प्रयोग निकटवर्ती बाइबिलीय संवाद और एकवचन इब्रानी रूप के अनुरूप है। डैश के द्वारा הִוא के बल को भी उभारा गया है।
