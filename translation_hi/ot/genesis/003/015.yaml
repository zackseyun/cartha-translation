id: GEN.3.15
reference: Genesis 3:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֵיבָ֣ה אָשִׁ֗ית בֵּֽינְ/ךָ֙ וּ/בֵ֣ין הָֽ/אִשָּׁ֔ה וּ/בֵ֥ין זַרְעֲ/ךָ֖ וּ/בֵ֣ין זַרְעָ֑/הּ ה֚וּא יְשׁוּפְ/ךָ֣ רֹ֔אשׁ וְ/אַתָּ֖ה תְּשׁוּפֶ֥/נּוּ עָקֵֽב׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/015.yaml
  text: And I will put enmity[a] between you and the woman, and between your seed[b] and her seed; he will crush your head[c][d], and you will bruise his heel.
translation:
  language: hi
  text: और मैं तेरे और स्त्री के बीच, और तेरी सन्तान[b] और उसकी सन्तान के बीच बैर[a] उत्पन्न करूँगा। वह[c] तेरे सिर को कुचल देगा[d], और तू उसकी एड़ी को घायल करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शत्रुता’।
    reason: lexical_alternative
  - marker: b
    text: दोनों स्थानों पर इब्रानी में शाब्दिक अर्थ ‘बीज’ है; यह शब्द सामूहिक रूप से वंशजों या किसी प्रतिनिधि व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘यह’; इब्रानी सर्वनाम पुल्लिंग एकवचन है और एक सामूहिक संज्ञा के बाद आया है।
    reason: alternative_reading
  - marker: d
    text: दोनों उपवाक्यों में इब्रानी क्रिया एक ही है। इसका अनुवाद ‘प्रहार करना’ या ‘चोट पहुँचाना’ भी हो सकता है; पहले उपवाक्य में ‘कुचलना’ सिर पर लगी चोट की अधिक गंभीरता को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיבָה
  choice: बैर
  rationale: यह शब्द सक्रिय और स्थायी विरोध को व्यक्त करता है। ‘बैर’ आधुनिक हिन्दी में स्वाभाविक, संक्षिप्त और अर्थ की गंभीरता के अनुरूप है; ‘शत्रुता’ सम्भव विकल्प है।
- source_word: אָשִׁית
  choice: उत्पन्न करूँगा
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है। हिन्दी में ‘बैर उत्पन्न करूँगा’ इस सम्बन्ध में विरोध स्थापित करने का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֵּינְךָ ... וּבֵין הָאִשָּׁה
  choice: तेरे और स्त्री के बीच
  rationale: सम्बन्धसूचक समानान्तर रचना को सीधे बनाए रखा गया है।
- source_word: זַרְעֲךָ ... זַרְעָהּ
  choice: तेरी सन्तान ... उसकी सन्तान
  rationale: זֶרַע का शाब्दिक अर्थ ‘बीज’ है और यह सामूहिक रूप से वंशजों या किसी प्रतिनिधि व्यक्ति को सूचित कर सकता है। ‘सन्तान’ हिन्दी में दोनों स्थानों पर स्वाभाविक है और सामूहिक तथा एकवचन दोनों सम्भावनाएँ खुली रखता है; शाब्दिक बिम्ब पादटिप्पणी में दिया गया है।
- source_word: הוּא
  choice: वह
  rationale: इब्रानी सर्वनाम पुल्लिंग एकवचन है। हिन्दी ‘वह’ स्वयं लिंग-निरपेक्ष रूप रखता है, जबकि ‘कुचल देगा’ पुल्लिंग एकवचन को दर्शाता और प्रतिनिधि व्यक्ति की सम्भावना बनाए रखता है।
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  choice: कुचल देगा ... घायल करेगा
  rationale: दोनों उपवाक्यों में वही दुर्लभ क्रिया שׁוּף है, जिसका अर्थ ‘मारना/प्रहार करना/कुचलना’ हो सकता है। सिर और एड़ी के भिन्न लक्ष्य परिणाम की असमान गंभीरता सुझाते हैं; मुख्य पाठ इसे स्वाभाविक हिन्दी में व्यक्त करता है और पादटिप्पणी मूल क्रिया की पुनरावृत्ति स्पष्ट करती है।
- source_word: רֹאשׁ
  choice: सिर
  rationale: शरीर के अंग का सीधा और स्वाभाविक अनुवाद।
- source_word: עָקֵב
  choice: एड़ी
  rationale: शरीर के अंग का सीधा और स्वाभाविक अनुवाद।
theological_decisions:
- issue: क्या स्त्री की सन्तान को सामूहिक वंशजों के रूप में या किसी प्रतिनिधि व्यक्ति के रूप में प्रस्तुत किया जाए
  choice: दोनों स्थानों पर ‘सन्तान’ और आगे पुल्लिंग एकवचन क्रिया के साथ ‘वह’
  alternative: ‘वंश/वंशज’ जैसे स्पष्टतः सामूहिक शब्द, अथवा सर्वनाम को सामूहिक अर्थ में प्रस्तुत करना
  rationale: इब्रानी में दोनों पक्षों के लिए वही सामूहिक संज्ञा זֶרַע आती है, जिसके बाद पुल्लिंग एकवचन הוּא है। यह अनुवाद किसी विशिष्ट धर्मवैज्ञानिक पहचान को पाठ में आरोपित किए बिना सामूहिक और प्रतिनिधि-व्यक्ति दोनों आयाम बनाए रखता है।
- issue: पहले שׁוּף को कितनी तीव्रता से व्यक्त किया जाए
  choice: सिर के लिए ‘कुचल देगा’ और एड़ी के लिए ‘घायल करेगा’
  alternative: दोनों स्थानों पर ‘प्रहार करेगा’ या ‘चोट पहुँचाएगा’
  rationale: मूल में क्रिया एक ही है, पर सिर और एड़ी का विरोध परिणाम की भिन्न गंभीरता का संकेत देता है। मुख्य पाठ उस असमानता को व्यक्त करता है और पादटिप्पणी समान इब्रानी क्रिया को पारदर्शी बनाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और स्रोत-समीप रूप। परमेश्वर द्वारा सर्प को किए गए प्रत्यक्ष सम्बोधन में ‘तेरे/तू’ रखा गया है। ‘सन्तान’ सामान्य पाठक के लिए ‘बीज’ से अधिक स्वाभाविक है, जबकि मूल का बीज-बिम्ब और उसकी सामूहिक/व्यक्तिगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
