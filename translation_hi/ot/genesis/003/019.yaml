source:
  edition: WLC
  text: בְּ/זֵעַ֤ת אַפֶּ֨י/ךָ֙ תֹּ֣אכַל לֶ֔חֶם עַ֤ד שֽׁוּבְ/ךָ֙ אֶל הָ֣/אֲדָמָ֔ה כִּ֥י מִמֶּ֖/נָּה לֻקָּ֑חְתָּ כִּֽי עָפָ֣ר אַ֔תָּה וְ/אֶל עָפָ֖ר תָּשֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/019.yaml
  text: By the sweat of your face you will eat bread until you return to the ground[a], because from it you were taken; for you are dust, and to dust you will return.
translation:
  language: hi
  text: अपने चेहरे के पसीने से[a] तू रोटी खाएगा, जब तक तू भूमि में लौट न जाए, क्योंकि उसी से तू लिया गया था; क्योंकि तू धूल है और धूल में लौट जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार रूप: “अपने माथे के पसीने से।” इब्रानी में शाब्दिक रूप से “अपने चेहरे के पसीने से” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֵעַת אַפֶּיךָ
  choice: अपने मुँह के पसीने से
  rationale: इब्रानी पदबंध का अर्थ शाब्दिक रूप से ‘तेरे मुख के पसीने से’ है। ‘मुँह के पसीने से’ मूल बिंब को बनाए रखता है; अधिक मुहावरेदार हिन्दी विकल्प पादटिप्पणी में दिया गया है।
- source_word: תֹּאכַל לֶחֶם
  choice: तू रोटी खाएगा
  rationale: לֶחֶם का सीधा अर्थ ‘रोटी’ है, यद्यपि प्रसंग में यह सामान्य भोजन या जीविका का भी संकेत दे सकता है। मुख्य पाठ में ठोस मूल शब्द रखा गया है।
- source_word: עַד שׁוּבְךָ אֶל הָאֲדָמָה
  choice: जब तक तू भूमि में लौट न जाए
  rationale: אֲדָמָה भूमि, मिट्टी या धरती को दर्शाता है। ‘भूमि’ मनुष्य की उत्पत्ति और अंत के बीच मूल संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כִּי מִמֶּנָּה לֻקָּחְתָּ
  choice: क्योंकि उसी से तू लिया गया था
  rationale: स्त्रीलिंग सर्वनाम का संबंध אֲדָמָה से है। कर्मवाच्य ‘लिया गया था’ इब्रानी रूप को सुरक्षित रखता है और कर्ता को पाठ से बाहर स्पष्ट नहीं करता।
- source_word: עָפָר
  choice: धूल
  rationale: עָפָר के लिए ‘धूल’ इस मृत्यु-सूचक कथन में सटीक और परंपरागत अर्थ है तथा मानवीय नश्वरता के बिंब को बनाए रखता है।
- source_word: תָּשׁוּב
  choice: लौट जाएगा
  rationale: अपूर्ण क्रिया यहाँ घोषित और निश्चित भावी परिणाम व्यक्त करती है। ‘लौट जाएगा’ आधुनिक हिन्दी में इसकी गंभीर निश्चितता को स्पष्ट करता है।
theological_decisions:
- issue: मनुष्य की नश्वरता और भौतिक उत्पत्ति
  choice: पद को इस घोषणा के रूप में प्रस्तुत किया गया है कि मनुष्य उस भूमि और धूल में शारीरिक रूप से लौटेगा जिससे वह लिया गया था।
  alternative: इसे मुख्यतः अपमान या दीनता का रूपक मानना।
  rationale: निकटवर्ती प्रसंग तथा אֲדָמָה (‘भूमि’) और עָפָר (‘धूल’) का युग्म शारीरिक मृत्यु और धरती में लौटने की ओर दृढ़ता से संकेत करता है। अनुवाद इसके आगे कोई बाद की सैद्धांतिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। एक पुरुष को सीधे संबोधन के कारण एकवचन ‘तू’ रखा गया है; यह निकट और प्रत्यक्ष संबोधन व्यक्त करता है, अनादर नहीं। वाक्य की गंभीर लय तथा ‘भूमि—धूल—लौटना’ की पुनरावृत्ति सुरक्षित रखी गई है।
