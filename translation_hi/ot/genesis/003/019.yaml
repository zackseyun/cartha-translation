  source_fidelity: 'The draft conveys the verse’s principal sequence and imagery faithfully: labor for bread, return to the ground from which the human was taken, and return to dust. The passive sense in “लिया गया था” is appropriate. However, “मुँह के पसीने” is not a natural or precise Hindi expression for the Hebrew ‘face’; in Hindi, मुँह primarily denotes the mouth. “चेहरे के पसीने” retains the concrete Hebrew image without substituting the idiomatic ‘forehead.’'
  naturalness: The direct singular “तू” appropriately reflects the address and can be retained in a solemn scriptural register. Replacing “मुँह” with “चेहरा” makes the opening natural modern Hindi. “धूल में” is sufficient and avoids the added emphasis of “ही,” which is not explicit in the Hebrew.
  terminology: “रोटी,” “भूमि,” and “धूल” accurately represent the relevant Hebrew terms in this context. The footnote should correspond exactly to the revised main-text wording and identify ‘चेहरा’ rather than ‘मुख.’
  issues:
  - severity: medium
    issue: “अपने मुँह के पसीने से”
    rationale: Although intended as literal, this is unnatural in modern Hindi and can suggest sweat of/from the mouth. The Hebrew אַף here means ‘face’; “अपने चेहरे के पसीने से” is both closer in ordinary Hindi and transparent about the source image.
  - severity: low
    issue: Added emphasis in “धूल ही में”
    rationale: The Hebrew says ‘to dust you will return’ without an explicit restrictive/emphatic particle corresponding to ही. “धूल में लौट जाएगा” preserves the meaning and parallelism more closely.
