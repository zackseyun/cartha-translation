  text: וְ/ק֥וֹץ וְ/דַרְדַּ֖ר תַּצְמִ֣יחַֽ לָ֑/ךְ וְ/אָכַלְתָּ֖ אֶת עֵ֥שֶׂב הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/018.yaml
  text: It will produce thorns and thistles for you[c][b][a], and you will eat the plants of the field.
translation:
  language: hi
  text: वह तेरे लिए काँटे और ऊँटकटारे उगाएगी[a], और तू खेत के पौधे खाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वह’ से आशय पिछले पद की भूमि है। इसका अनुवाद ‘वह तेरे लिए काँटे और ऊँटकटारे उत्पन्न करेगी’ भी हो सकता है।
    reason: व्याकरणिक संदर्भ और शाब्दिक विकल्प
  - marker: b
    text: ‘खेत के पौधे’ का अनुवाद ‘खेत की वनस्पति’ या पारंपरिक रूप से ‘खेत का साग-पात’ भी किया जा सकता है।
    reason: शाब्दिक विकल्प
lexical_decisions:
- source_word: וְקוֹץ
  choice: काँटे
  rationale: קוֹץ कँटीली उपज का बोध कराता है; हिन्दी में बहुवचन सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְדַרְדַּר
  choice: ऊँटकटारे
  rationale: דַּרְדַּר पहले शब्द से अलग किसी कँटीली खरपतवार को सूचित करता है। ‘ऊँटकटारे’ पारंपरिक हिन्दी पद है और किसी निश्चित वनस्पति-प्रजाति का अनावश्यक दावा किए बिना इस भेद को बनाए रखता है।
- source_word: תַּצְמִיחַ לָךְ
  choice: तेरे लिए ... उगाएगी
  rationale: हिफ़ील रूप का कारक भाव ‘उगाएगी’ में स्वाभाविक हिन्दी के साथ बना रहता है। स्त्रीलिंग एकवचन क्रिया पिछले पद की ‘भूमि’ की ओर संकेत करती है, और לָךְ को ‘तेरे लिए’ के रूप में स्पष्ट रखा गया है।
- source_word: וְאָכַלְתָּ
  choice: और तू ... खाएगा
  rationale: यह रूप प्रसंग में आगे होने वाले परिणाम को व्यक्त करता है; ‘खाएगा’ आधुनिक हिन्दी में उसका सहज भविष्यकालीन अनुवाद है।
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: खेत के पौधे
  rationale: עֵשֶׂב खाने योग्य वनस्पति के लिए व्यापक शब्द है, केवल घास के लिए नहीं। ‘खेत के पौधे’ सरल आधुनिक हिन्दी है और הַשָּׂדֶה के संबंध को बनाए रखता है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन क्रिया תַּצְמִיחַ का कर्ता
  choice: ‘वह’ पिछले पद में आई भूमि को सूचित करता है।
  alternative: कर्ताहीन ढंग से ‘तेरे लिए काँटे... उगेंगे’ कहना।
  rationale: इब्रानी स्त्रीलिंग एकवचन क्रिया स्वाभाविक रूप से पिछले पद के स्त्रीलिंग संज्ञा הָאֲדָמָה (‘भूमि’) की ओर लौटती है। ‘वह ... उगाएगी’ इस व्याकरणिक संबंध और भूमि की प्रतिकूल उपज—दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘ऊँटकटारे’ युग्म के दोनों कँटीले शब्दों का भेद बनाए रखता है; अर्थ-सहायता के लिए पादटिप्पणी दी गई है। सर्वनाम और क्रिया का स्त्रीलिंग पिछले पद की ‘भूमि’ से संबंध सुरक्षित रखता है।
