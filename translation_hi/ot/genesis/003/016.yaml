id: GEN.3.16
reference: Genesis 3:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֶֽל הָ/אִשָּׁ֣ה אָמַ֗ר הַרְבָּ֤ה אַרְבֶּה֙ עִצְּבוֹנֵ֣/ךְ וְ/הֵֽרֹנֵ֔/ךְ בְּ/עֶ֖צֶב תֵּֽלְדִ֣י בָנִ֑ים וְ/אֶל אִישֵׁ/ךְ֙ תְּשׁ֣וּקָתֵ֔/ךְ וְ/ה֖וּא יִמְשָׁל בָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/016.yaml
  text: To the woman he said[a], “I will greatly multiply your pain and your conception; in pain you will bear children. Your desire will be for your husband[c][b], and he will rule over you.”
translation:
  language: hi
  text: स्त्री से उसने कहा, “मैं तुम्हारी पीड़ा और तुम्हारे गर्भधारण[a] को बहुत बढ़ा दूँगा; पीड़ा में तुम बच्चों[b] को जन्म दोगी। तुम्हारी अभिलाषा[c] तुम्हारे पति की ओर होगी, और वह तुम पर शासन करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी गर्भावस्था।” इब्रानी शब्द गर्भधारण या गर्भावस्था, दोनों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “पुत्रों”; यहाँ संभवतः सामान्य रूप से बच्चों या संतान का अर्थ है।
    reason: lexical_alternative
  - marker: c
    text: या “लालसा।” यह दुर्लभ इब्रानी शब्द व्यापक अर्थ में इच्छा का बोध करा सकता है। कुछ लोग इसे नियंत्रण करने की इच्छा समझते हैं (उत्पत्ति 4:7 से तुलना करें), जबकि अन्य इसे संबंधपरक या यौन लालसा मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: स्त्री
  rationale: यहाँ संबोधन स्त्री मानव से है; बाद में אִישֵׁךְ वैवाहिक संबंध को स्पष्ट करता है, इसलिए यहाँ ‘पत्नी’ के बजाय ‘स्त्री’ उपयुक्त है।
- source_word: הַרְבָּה אַרְבֶּה
  choice: बहुत बढ़ा दूँगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute तीव्रता प्रकट करता है; यह हिंदी में उस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עִצְּבוֹנֵךְ
  choice: तुम्हारी पीड़ा
  rationale: शब्द पीड़ा, कठिनाई या श्रम को सूचित कर सकता है; प्रसव के संदर्भ में ‘पीड़ा’ सबसे स्पष्ट है।
- source_word: וְהֵרֹנֵךְ
  choice: तुम्हारे गर्भधारण
  rationale: मूल संज्ञा गर्भधारण या गर्भावस्था दोनों का बोध करा सकती है। ‘गर्भधारण’ मूल रूप के निकट रहते हुए बाद के जन्म देने से भेद बनाए रखता है।
- source_word: בְּעֶצֶב
  choice: पीड़ा में
  rationale: यह प्रसव की परिस्थिति या रीति को सीधे और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: תֵּלְדִי בָנִים
  choice: तुम बच्चों को जन्म दोगी
  rationale: בָנִים का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ यह सामान्य रूप से संतान का संकेत देता है; इसलिए ‘बच्चों’ प्रसंगानुकूल है।
- source_word: אִישֵׁךְ
  choice: तुम्हारे पति
  rationale: इस संबंधपरक प्रसंग में אִישׁ का स्वाभाविक अर्थ ‘पति’ है।
- source_word: תְּשׁוּקָתֵךְ
  choice: तुम्हारी अभिलाषा ... की ओर होगी
  rationale: यह दुर्लभ और विवादित शब्द व्यापक इच्छा या लालसा का अर्थ दे सकता है। ‘अभिलाषा’ उसके संबंधपरक, यौन या नियंत्रणकारी आशयों में से किसी एक को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: יִמְשָׁל בָּךְ
  choice: वह तुम पर शासन करेगा
  rationale: क्रिया का सीधा अर्थ शासन करना है। यह वर्णनात्मक भविष्य कथन को रखता है और ‘दमन करेगा’ जैसी अधिक व्याख्यात्मक तीव्रता नहीं जोड़ता।
theological_decisions:
- issue: पति के प्रति स्त्री की ‘अभिलाषा’ का आशय
  choice: תְּשׁוּקָה को ‘अभिलाषा’ रखा गया है, बिना यह तय किए कि वह यौन इच्छा, संबंधपरक लालसा या नियंत्रण की इच्छा है।
  alternative: ‘लालसा’, ‘यौन इच्छा’, ‘संबंधपरक निर्भरता’, अथवा उत्पत्ति 4:7 के आधार पर ‘नियंत्रित करने की इच्छा’।
  rationale: इब्रानी शब्द दुर्लभ है और निकट संदर्भ किसी एक सूक्ष्म अर्थ को निर्णायक नहीं बनाता; इसलिए मुख्य पाठ वास्तविक व्याख्यात्मक तनाव को सुरक्षित रखता है।
- issue: पुरुष के शासन का विधानात्मक या वर्णनात्मक स्वरूप
  choice: ‘वह तुम पर शासन करेगा’—पतन के बाद होने वाली स्थिति का कथन।
  alternative: पुरुष-अधिकार की विधानात्मक आज्ञा या अनुमोदन।
  rationale: इब्रानी क्रियारूप बताता है कि क्या होगा, न कि क्या होना चाहिए; अनुवाद को इससे आगे कोई सांप्रदायिक निष्कर्ष नहीं जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली अपनाई गई है। एकवचन संबोधन के लिए ‘तुम’ प्रयोग किया गया है, जो आधुनिक पाठक के लिए स्वाभाविक है और अत्यधिक पुरातन ‘तू’ से बचता है। वाक्य-संरचना मूल की समानांतरता और कारणात्मक तनाव को यथासंभव बनाए रखती है।
