id: GEN.3.22
reference: Genesis 3:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֣ה אֱלֹהִ֗ים הֵ֤ן הָֽ/אָדָם֙ הָיָה֙ כְּ/אַחַ֣ד מִמֶּ֔/נּוּ לָ/דַ֖עַת ט֣וֹב וָ/רָ֑ע וְ/עַתָּ֣ה פֶּן יִשְׁלַ֣ח יָד֗/וֹ וְ/לָקַח֙ גַּ֚ם מֵ/עֵ֣ץ הַֽ/חַיִּ֔ים וְ/אָכַ֖ל וָ/חַ֥י לְ/עֹלָֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/022.yaml
  text: Then Yahweh God said[a], “Behold, the man has become like one of us, knowing good and evil. And now, lest he reach out his hand and also take from the tree of life and eat, and live forever—”
translation:
  language: hi
  text: तब यहोवा परमेश्वर ने कहा, “देखो, मनुष्य भले और बुरे का ज्ञान पाकर हममें से एक के समान हो गया है। अब ऐसा न हो कि वह अपना हाथ बढ़ाकर जीवन के वृक्ष से भी ले और खाए और सदा जीवित रहे—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: व्यक्तिगत दिव्य नाम को प्रचलित हिन्दी रूप ‘यहोवा’ में सुरक्षित रखा गया है और אֱלֹהִים को स्वाभाविक हिन्दी पद ‘परमेश्वर’ से व्यक्त किया गया है।
- source_word: הֵן
  choice: देखो
  rationale: यह हिब्रू उद्गार का ध्यान आकर्षित करने वाला और गंभीर भाव आधुनिक, सहज हिन्दी में बनाए रखता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: संदर्भ में यह अभी वर्णित व्यक्तिगत मानव को सूचित करता है; ‘मनुष्य’ हिन्दी में स्वाभाविक है और यहाँ मानव-पक्ष को भी सुरक्षित रखता है।
- source_word: הָיָה
  choice: हो गया है
  rationale: पूर्ण क्रिया से उत्पन्न वर्तमान परिणामी अवस्था को हिन्दी पूर्ण वर्तमान द्वारा व्यक्त किया गया है।
- source_word: כְּאַחַד מִמֶּנּוּ
  choice: हममें से एक के समान
  rationale: तुलना और प्रथम पुरुष बहुवचन—दोनों को बिना व्याख्यात्मक समाधान के सीधे सुरक्षित रखा गया है।
- source_word: לָדַעַת טוֹב וָרָע
  choice: भले और बुरे का ज्ञान पाकर
  rationale: जानने की परिणामी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि नैतिक-संज्ञानात्मक द्वय ‘भला और बुरा’ बना रहता है।
- source_word: פֶּן
  choice: ऐसा न हो कि
  rationale: यह निवारक आशंका का हिन्दी में संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: יִשְׁלַח יָדוֹ
  choice: अपना हाथ बढ़ाकर
  rationale: हिब्रू की ठोस शारीरिक छवि को हिन्दी मुहावरे में सुरक्षित रखता है।
- source_word: וְלָקַח גַּם מֵעֵץ הַחַיִּים
  choice: जीवन के वृक्ष से भी फल ले
  rationale: गַּם का योगात्मक बल ‘भी’ से रखा गया है; हिन्दी में वृक्ष से लेने की वस्तु स्पष्ट करने के लिए ‘फल’ निहितार्थ के रूप में जोड़ा गया है।
- source_word: וָחַי לְעֹלָם
  choice: सदा जीवित रहे
  rationale: अनिश्चित काल तक जीवित रहने के हिब्रू अर्थ को सरल और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘हममें से एक’ में बहुवचन
  choice: बहुवचन ‘हम’ को बिना विस्तार के सुरक्षित रखना
  alternative: इसे महिमा का बहुवचन, दिव्य परिषद्, या ईश्वर के भीतर बहुलता के रूप में स्पष्ट करना
  rationale: मूल पाठ प्रथम पुरुष बहुवचन रखता है पर उसका अभिप्राय निश्चित नहीं करता; अनुवाद उसी वास्तविक अस्पष्टता और धर्मवैज्ञानिक तनाव को बनाए रखता है।
- issue: ईश्वरीय वचन का आकस्मिक अंत
  choice: अंत में दीर्घ डैश लगाकर अधूरी रह गई बात को सुरक्षित रखना
  alternative: वाक्य को सहजता से पूरा करना या निहित परिणाम जोड़ना
  rationale: हिब्रू वाक्य निवारक उपवाक्य पर अचानक रुकता है और अगली आयत में कथा की कार्रवाई आती है; कोई अनुपस्थित निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। शब्दावली साधारण पाठक के लिए स्पष्ट रखी गई है; बहुवचन और वाक्य के टूटे हुए अंत जैसी स्रोत-पाठ की विशेषताएँ ज्यों की त्यों सुरक्षित हैं।
