base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/024.yaml
  text: So he drove out the man[a], and to the east of the garden of Eden he stationed the cherubim and the flame of the sword that turns every way[b], to guard the way to the tree of life.
translation:
  language: hi
  text: इस प्रकार उसने उस मनुष्य को निकाल दिया, और अदन के बाग की पूर्वी ओर[a] उसने करूबों को और चारों ओर घूमने वाली तलवार की ज्वाला को[b] जीवन के वृक्ष तक जाने वाले मार्ग की रखवाली करने के लिए तैनात कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अदन के बाग के पूर्व में” अथवा “अदन के बाग की पूर्वी दिशा में।” इब्रानी पद बाग की पूर्वी ओर/सामने की ओर का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: 'परंपरागत अनुवाद: “चारों ओर घूमती हुई ज्वालामय तलवार।” इब्रानी में अधिक शाब्दिक रूप से, “चारों ओर घूमने वाली तलवार की ज्वाला” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: निकाल दिया
  rationale: גרשׁ बलपूर्वक बाहर करने या खदेड़ने का भाव रखता है। यहाँ ‘निकाल दिया’ स्वाभाविक हिन्दी में उस क्रिया की कठोरता को पर्याप्त रूप से व्यक्त करता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ אָדָם कथा के उसी विशिष्ट मनुष्य को सूचित करता है जिसे बाग में रखा गया था; हिन्दी में ‘मनुष्य’ संदर्भानुसार एकवचन और मानवीय पहचान दोनों बनाए रखता है।
- source_word: וַיַּשְׁכֵּן
  choice: तैनात कर दिया
  rationale: שׁכן के हिफ़ील रूप का अर्थ यहाँ किसी को एक स्थान पर ठहराना या स्थापित करना है। पहरे के संदर्भ में ‘तैनात कर दिया’ उपयुक्त और स्वाभाविक है।
- source_word: מִקֶּדֶם לְגַן עֵדֶן
  choice: अदन के बाग के पूर्व की ओर
  rationale: स्थानसूचक प्रयोग बाग की पूर्वी दिशा या पूर्वी ओर को दर्शाता है। यह हिन्दी अभिव्यक्ति उस स्थानिक अर्थ को अनावश्यक रूप से अधिक निश्चित किए बिना व्यक्त करती है।
- source_word: הַכְּרֻבִים
  choice: करूबों
  rationale: विशिष्ट स्वर्गीय प्राणियों के लिए प्रचलित बाइबलीय लिप्यंतरण ‘करूब’ रखा गया है; यहाँ इब्रानी बहुवचन के अनुसार ‘करूबों’ है।
- source_word: לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: उस तलवार की ज्वाला को, जो चारों ओर घूमती रहती थी
  rationale: इब्रानी वाक्यांश शाब्दिक रूप से तलवार की ज्वाला और निरंतर घूमने या पलटने वाली गति का उल्लेख करता है। यह रूप पारंपरिक ‘ज्वालामय तलवार’ में संरचना को समेटने के बजाय मूल की असामान्य छवि बनाए रखता है।
- source_word: לִשְׁמֹר
  choice: रखवाली करें
  rationale: שׁמר यहाँ पहुँच को रोकने वाले पहरे का अर्थ देता है। बहुवचन क्रिया निकटतम सजीव कर्ता ‘करूबों’ के साथ स्वाभाविक हिन्दी बनाती है, जबकि पूरी व्यवस्था के रक्षक प्रयोजन को व्यक्त करती है।
- source_word: דֶּרֶךְ
  choice: तक जाने वाले मार्ग
  rationale: मूल में ‘जीवन के वृक्ष का मार्ग’ है; हिन्दी में गंतव्य-संबंध स्पष्ट करने के लिए ‘तक जाने वाला मार्ग’ स्वाभाविक है।
- source_word: עֵץ הַחַיִּים
  choice: जीवन का वृक्ष
  rationale: यह इब्रानी संबंध-पदबंध का सीधा, स्थापित और स्पष्ट हिन्दी रूप है।
theological_decisions:
- issue: कथा में אָדָם का अर्थ
  choice: मनुष्य
  alternative: आदम
  rationale: यहाँ पद निश्चित लेख के साथ उस विशिष्ट मनुष्य का उल्लेख करता है। ‘मनुष्य’ मूल के सामान्य संज्ञात्मक रूप को बनाए रखता है और इसे अनिवार्यतः व्यक्तिवाचक नाम नहीं बनाता।
- issue: घूमने वाली वस्तु की पहचान
  choice: तलवार की ज्वाला, जो चारों ओर घूमती रहती थी
  alternative: चारों ओर घूमती ज्वालामय तलवार
  rationale: मूल व्याकरण में स्त्रीलिंग कृदंत का संबंध ‘तलवार’ से हो सकता है, जबकि पूरा पदबंध ‘तलवार की ज्वाला’ कहता है। मुख्य पाठ मूल की संरचना और उसकी कुछ अस्पष्टता को बनाए रखता है; पादटिप्पणी पारंपरिक विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘करूब’ जैसे विशिष्ट बाइबलीय पद का लिप्यंतरण सुरक्षित रखा गया है। मूल की असामान्य ‘तलवार की ज्वाला’ वाली छवि को मुख्य पाठ में बनाए रखते हुए पारंपरिक रूप पादटिप्पणी में दिया गया है।
