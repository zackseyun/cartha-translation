base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/013.yaml
  text: Then Yahweh God said to the woman[a], “What is this you have done?” And the woman said, “The serpent deceived me, and I ate.”
translation:
  language: hi
  text: तब याहवे परमेश्वर ने स्त्री से कहा, “तुमने यह क्या किया?” स्त्री ने कहा, “साँप ने मुझे धोखा दिया[a], और मैंने खाया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे बहकाया।” हिब्रू क्रिया का अर्थ किसी को धोखे में डालना या बहकाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: יְהוָה אֱלֹהִים के युग्म में यह स्वाभाविक, गरिमापूर्ण और सर्वबोध्य हिन्दी रूप है।
- source_word: לָאִשָּׁה
  choice: स्त्री से
  rationale: यहाँ कथा में उसी पात्र के लिए प्रयुक्त सामान्य designation को बनाए रखता है; ‘पत्नी’ का अर्थ संभव है, पर इस संवाद में प्रमुख नहीं।
- source_word: מַה זֹּאת עָשִׂית
  choice: यह तूने क्या किया?
  rationale: प्रश्नवाचक और संकेतवाचक दोनों का बल बनाए रखते हुए स्वाभाविक हिन्दी देता है; इसे ‘तूने ऐसा क्यों किया?’ बनाकर कारण का प्रश्न नहीं जोड़ा गया।
- source_word: הַנָּחָשׁ
  choice: साँप
  rationale: मूल शब्द का सीधा, वर्तमान और साधारण हिन्दी पर्याय है; ‘सर्प’ अधिक साहित्यिक विकल्प है, पर अर्थ में अतिरिक्त धार्मिक व्याख्या आवश्यक नहीं।
- source_word: הִשִּׁיאַנִי
  choice: मुझे धोखा दिया
  rationale: क्रिया के भ्रमित करने या छलने के भाव को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: וָאֹכֵל
  choice: और मैंने खाया
  rationale: घटनाक्रम को सीधे जोड़ता है और मूल में स्पष्ट न किए गए कारणात्मक ‘इसलिए’ को नहीं जोड़ता।
theological_decisions:
- issue: स्त्री द्वारा साँप के कार्य का वर्णन
  choice: साँप ने मुझे धोखा दिया
  alternative: साँप ने मुझे बहकाया
  rationale: ‘धोखा दिया’ मूल क्रिया के छल या भ्रम में डालने के अर्थ को स्पष्ट रूप से व्यक्त करता है और दोष, प्रलोभन अथवा मानवीय उत्तरदायित्व के संबंध में मूल से आगे कोई सिद्धान्तगत निष्कर्ष नहीं जोड़ता।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया; हिन्दी पाठकों में पहचाने जाने वाले पारंपरिक लिप्यंतरण को चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। संवाद में ‘तू’ रखा गया है, जो इस प्राचीन प्रत्यक्ष संबोधन में स्वाभाविक है। पद में कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘धोखा दिया’ अर्थ को पर्याप्त स्पष्टता से व्यक्त करता है।
