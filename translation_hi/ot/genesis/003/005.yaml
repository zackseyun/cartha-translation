source:
  edition: WLC
  text: כִּ֚י יֹדֵ֣עַ אֱלֹהִ֔ים כִּ֗י בְּ/יוֹם֙ אֲכָלְ/כֶ֣ם מִמֶּ֔/נּוּ וְ/נִפְקְח֖וּ עֵֽינֵי/כֶ֑ם וִ/הְיִיתֶם֙ כֵּֽ/אלֹהִ֔ים יֹדְעֵ֖י ט֥וֹב וָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/005.yaml
  text: For God knows that on the day you eat from it[a], your eyes will be opened, and you will be like God, knowing good and evil.
translation:
  language: hi
  text: क्योंकि परमेश्वर जानता है कि जिस दिन तुम उसमें से खाओगे, तुम्हारी आँखें खुल जाएँगी, और तुम परमेश्वर के समान[a] हो जाओगे और भले और बुरे को जानोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देवताओं के समान” अथवा “दिव्य प्राणियों के समान।” इब्रानी शब्द אֱלֹהִים कुछ संदर्भों में ये अर्थ भी दे सकता है।
    reason: वैकल्पिक अर्थ को सुरक्षित रखना
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह सर्प के पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: יֹדֵעַ אֱלֹהִים
  choice: परमेश्वर जानता है
  rationale: इब्रानी कृदंत यहाँ वर्तमान अवस्था व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक रूप है।
- source_word: בְּיוֹם אֲכָלְכֶם מִמֶּנּוּ
  choice: जिस दिन तुम उसमें से खाओगे
  rationale: इब्रानी कालवाचक मुहावरे को सहज हिन्दी में रखा गया है; इसका आशय खाने के समय से है, अनिवार्य रूप से चौबीस घंटे के दिन से नहीं।
- source_word: וְנִפְקְחוּ עֵינֵיכֶם
  choice: तुम्हारी आँखें खुल जाएँगी
  rationale: निफ़अल रूप और बोध या जागरूकता के रूपक—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וִהְיִיתֶם
  choice: तुम ... हो जाओगे
  rationale: संदर्भ में किसी नई अवस्था में पहुँचने का भाव प्रमुख है।
- source_word: כֵּאלֹהִים
  choice: परमेश्वर के समान
  rationale: निकट संदर्भ में אֱלֹהִים एक परमेश्वर को सूचित करता है, पर शब्द के अन्य संभव अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
- source_word: יֹדְעֵי טוֹב וָרָע
  choice: भले और बुरे का ज्ञान रखनेवाले
  rationale: कृदंत के अर्थ को स्पष्ट, वर्तमान हिन्दी में व्यक्त करता है और ‘भले और बुरे’ की नैतिक तथा विवेक-संबंधी व्यापकता बनाए रखता है।
theological_decisions:
- issue: כֵּאלֹהִים में אֱלֹהִים का अभिप्रेत अर्थ
  choice: परमेश्वर के समान
  alternative: देवताओं के समान; दिव्य प्राणियों के समान
  rationale: तात्कालिक कथा-संदर्भ में एक परमेश्वर और उसके ज्ञान से तुलना अधिक संभावित है; फिर भी इब्रानी शब्द की वास्तविक अर्थगत अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। बहुवचन संबोधन ‘तुम’ मूल पाठ के बहुवचन रूपों को दर्शाता है। पादटिप्पणी-चिह्न को उसी विवादित पद ‘परमेश्वर के समान’ के बाद रखा गया है जिससे वह संबंधित है।
