base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/002.yaml
  text: And the woman said to the serpent[a], “We may eat from the fruit of the trees of the garden,”
translation:
  language: hi
  text: और स्त्री ने साँप से कहा, “हम बगीचे के पेड़ों के फल खा सकते हैं[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “बगीचे के पेड़ का फल हम खा सकते हैं”; यहाँ “पेड़” का प्रयोग सामूहिक अर्थ में हुआ है, इसलिए मुख्य पाठ में “पेड़ों” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक कथात्मक प्रवाह देता है, बिना संबंध को अधिक विशिष्ट बनाए।
- source_word: הָאִשָּׁה
  choice: स्त्री
  rationale: यहाँ शब्द स्त्री मानव पात्र को सूचित करता है, न कि विशेष रूप से उसकी वैवाहिक भूमिका को।
- source_word: הַנָּחָשׁ
  choice: साँप
  rationale: נָחָשׁ का सामान्य आधुनिक हिन्दी समतुल्य ‘साँप’ है; यह संदर्भित प्राणी को स्पष्ट और सहज भाषा में व्यक्त करता है।
- source_word: מִפְּרִי
  choice: फल
  rationale: हिन्दी में ‘पेड़ों के फल खा सकते हैं’ स्वाभाविक रूप से फल के स्रोत/सम्बन्ध को व्यक्त करता है; अलग से ‘में से’ जोड़ना आवश्यक नहीं।
- source_word: עֵץ הַגָּן
  choice: बगीचे के पेड़ों
  rationale: यद्यपि עֵץ रूप की दृष्टि से एकवचन है, यहाँ उसका अर्थ सामूहिक है; बहुवचन हिन्दी में व्यापक अनुमति को स्पष्ट करता है।
- source_word: נֹאכֵל
  choice: हम ... खा सकते हैं
  rationale: संदर्भ में अपूर्ण क्रिया अनुमति व्यक्त करती है; ‘खा सकते हैं’ आधुनिक हिन्दी में इस अनुमत अर्थ को सहजता से बताता है।
theological_decisions:
- issue: स्त्री के उत्तर में अनुमत पेड़ों/फलों का दायरा
  choice: ‘बगीचे के पेड़ों के फल’—सामान्य अनुमति
  alternative: ‘बगीचे के पेड़ का फल’—शाब्दिक एकवचन
  rationale: इब्रानी में עֵץ एकवचन है, पर इस रचना और उत्पत्ति 2:16 के संदर्भ में उसका सामूहिक अर्थ है। हिन्दी बहुवचन यह भ्रामक संकेत नहीं देता कि अपवाद बताने से पहले केवल एक ही पेड़ की बात हो रही है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘साँप’ सामान्य पाठक के लिए ‘सर्प’ से अधिक स्वाभाविक है। उद्धरण अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
