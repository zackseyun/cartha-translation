source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אֶת קֹלְ/ךָ֥ שָׁמַ֖עְתִּי בַּ/גָּ֑ן וָ/אִירָ֛א כִּֽי עֵירֹ֥ם אָנֹ֖כִי וָ/אֵחָבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/010.yaml
  text: And he said[a], “I heard your voice in the garden, and I was afraid because I was naked, so I hid myself.”
translation:
  language: hi
  text: उसने कहा, “मैंने बगीचे में आपकी आवाज़[a] सुनी। मैं डर गया, क्योंकि मैं नंगा था; इसलिए मैं छिप गया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपकी ध्वनि।” इब्रानी शब्द क़ोल का अर्थ “आवाज़” या “ध्वनि” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: इब्रानी कथात्मक रूप आदम के उत्तर का परिचय देता है; हिंदी में यह स्वाभाविक और निकट अनुवाद है।
- source_word: אֶת קֹלְךָ
  choice: आपकी आवाज़
  rationale: קוֹל का अर्थ ‘आवाज़’ या किसी की ‘आहट/ध्वनि’ हो सकता है। ‘आवाज़’ स्वाभाविक हिंदी है और यहाँ शब्द की पर्याप्त व्यापकता बनाए रखती है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: שָׁמַעְתִּי
  choice: मैंने … सुनी
  rationale: यह שמע के प्रथम पुरुष एकवचन पूर्ण रूप का सीधा और स्वाभाविक हिंदी अनुवाद है।
- source_word: בַּגָּן
  choice: बगीचे में
  rationale: निश्चित लेख और पहले से स्थापित स्थल-संदर्भ को हिंदी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: וָאִירָא
  choice: मैं डर गया
  rationale: संदर्भ में ירא आदम द्वारा अनुभव किए गए भय को व्यक्त करता है; ‘डर गया’ आधुनिक हिंदी में सहज है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי भय का कारण बताता है, इसलिए कारणसूचक ‘क्योंकि’ उपयुक्त है।
- source_word: עֵירֹם אָנֹכִי
  choice: मैं नंगा था
  rationale: इब्रानी नामिक वाक्य स्वयं काल निर्दिष्ट नहीं करता; आसपास के भूतकालीन कथन और आदम की व्याख्या के अनुसार हिंदी में ‘था’ स्वाभाविक है।
- source_word: וָאֵחָבֵא
  choice: इसलिए मैं छिप गया
  rationale: क्रिया का अर्थ स्वयं को छिपाना है। ‘इसलिए’ भय और छिपने के परिणाम-संबंध को स्वाभाविक हिंदी में स्पष्ट करता है, जो प्रसंग में निहित है।
theological_decisions:
- issue: परमेश्वर की उपस्थिति के संबंध में קוֹל का अनुवाद
  choice: आपकी आवाज़
  alternative: आपकी आहट
  rationale: मूल शब्द सुनाई देने वाली ‘आवाज़’ या किसी के आने-जाने की ‘आहट’ दोनों का बोध करा सकता है। मुख्य पाठ में स्वाभाविक ‘आवाज़’ रखा गया है, पर पादटिप्पणी स्रोत की वास्तविक अर्थगत व्यापकता सुरक्षित रखती है और यह नहीं मानती कि यहाँ अनिवार्य रूप से बोले गए शब्द ही अभिप्रेत हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली रखी गई है। परमेश्वर को संबोधित करते समय सम्मानसूचक ‘आपकी’ प्रयुक्त हुआ है; आदम के लिए पुल्लिंग रूप संदर्भ से स्पष्ट है।
