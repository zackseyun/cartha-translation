source:
  edition: WLC
  text: וְ/הַ/נָּחָשׁ֙ הָיָ֣ה עָר֔וּם מִ/כֹּל֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר עָשָׂ֖ה יְהוָ֣ה אֱלֹהִ֑ים וַ/יֹּ֨אמֶר֙ אֶל הָ֣/אִשָּׁ֔ה אַ֚ף כִּֽי אָמַ֣ר אֱלֹהִ֔ים לֹ֣א תֹֽאכְל֔וּ מִ/כֹּ֖ל עֵ֥ץ הַ/גָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/001.yaml
  text: The serpent was more crafty than any beast of the field that Yahweh God had made[a]. And he said to the woman, “Indeed, has God said[c][b], ‘You shall not eat from any tree of the garden’?”
translation:
  language: hi
  text: और सर्प यहोवा परमेश्वर के बनाए हुए मैदान के किसी भी पशु से अधिक चालाक था।[a] उसने स्त्री से कहा, “क्या सचमुच परमेश्वर ने कहा है,[b] ‘तुम बगीचे के किसी भी पेड़ का फल मत खाना’?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “चालाक” का अनुवाद “धूर्त,” “चतुर,” या “सूझबूझ वाला” भी हो सकता है। इब्रानी शब्द कुछ प्रसंगों में विवेकशीलता बताता है, पर यहाँ उसके साथ कपट का भाव जुड़ा है।
    reason: lexical_alternative
  - marker: b
    text: कथावाचक ने “यहोवा परमेश्वर” कहा है, लेकिन सर्प केवल “परमेश्वर” कहता है; यह अंतर मूल इब्रानी में भी है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से इसका अनुवाद “बगीचे के हर पेड़ से” भी हो सकता है। इस प्रश्न में “किसी भी पेड़” सर्प द्वारा परमेश्वर की आज्ञा को बढ़ा-चढ़ाकर प्रस्तुत करने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּחָשׁ
  choice: और सर्प
  rationale: आरंभिक וְ को पूर्ववर्ती कथा से जोड़ने वाले स्वाभाविक हिन्दी संयोजक ‘और’ से व्यक्त किया गया है; הַנָּחָשׁ का सीधा अर्थ ‘सर्प’ है।
- source_word: עָרוּם
  choice: अधिक धूर्त
  rationale: शब्द विवेकशीलता, चतुराई या कपटपूर्ण धूर्तता सूचित कर सकता है। आगामी छलपूर्ण प्रश्न के संदर्भ में ‘धूर्त’ उपयुक्त है, जबकि ‘अधिक’ तुलनात्मक रचना को व्यक्त करता है।
- source_word: מִכֹּל חַיַּת הַשָּׂדֶה
  choice: मैदान के सभी जीवों से
  rationale: מִן के तुलनात्मक प्रयोग और כֹּל की व्यापकता को रखा गया है। חַיַּת הַשָּׂדֶה के लिए ‘मैदान के जीव’ प्राकृतिक और स्रोत-समीप है।
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: यहोवा व्यक्तिगत दिव्य नाम को लिप्यंतरित करता है और परमेश्वर אֱלֹהִים को; इस प्रकार संयुक्त पद तथा बाद में केवल ‘परमेश्वर’ कहे जाने का अंतर सुरक्षित रहता है।
- source_word: וַיֹּאמֶר אֶל־הָאִשָּׁה
  choice: उसने स्त्री से कहा
  rationale: क्रिया का कर्ता निकटवर्ती ‘सर्प’ है। हिन्दी में सर्वनाम के साथ यह सहज है और ‘स्त्री’ पाठ के वर्तमान नामकरण को बनाए रखता है।
- source_word: אַף כִּי אָמַר
  choice: क्या सचमुच ... ने कहा है
  rationale: यह पदबंध विस्मय, संदेह और आक्षेप से भरा प्रश्न आरंभ करता है। ‘क्या सचमुच’ उसके संकेतात्मक बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: सर्प के कथन में केवल אֱלֹהִים है, यְהוָה אֱלֹהִים नहीं; इसलिए कथावाचक और सर्प की शब्दावली का अंतर सुरक्षित है।
- source_word: לֹא תֹאכְלוּ מִכֹּל עֵץ הַגָּן
  choice: तुम बगीचे के किसी भी पेड़ का फल न खाना
  rationale: नकार के क्षेत्र में מִכֹּל को ‘किसी भी’ कहना सर्प द्वारा निषेध को सभी पेड़ों पर लागू बताने का आशय स्पष्ट करता है। हिन्दी में पेड़ ‘खाने’ के बजाय उसका ‘फल खाने’ का अर्थ स्वाभाविक रूप से स्पष्ट किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत नाम को उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है। हिन्दी पाठकों में प्रचलित ‘यहोवा’ चुना गया; ‘याहवे’ निकटतर वैकल्पिक लिप्यंतरण है।
- issue: עָרוּם का नैतिक भाव
  choice: धूर्त
  alternative: चतुर
  rationale: शब्द अपने आप में विवेक या चतुराई भी बता सकता है, पर इस प्रसंग में तुरंत आने वाला भ्रामक प्रश्न नकारात्मक, कपटपूर्ण भाव को प्रमुख करता है; फुटनोट शब्द की व्यापकता बनाए रखता है।
- issue: कथावाचक और सर्प द्वारा प्रयुक्त ईश-नामों का अंतर
  choice: कथावाचक में ‘यहोवा परमेश्वर’, सर्प में ‘परमेश्वर’
  alternative: दोनों स्थानों पर ‘परमेश्वर’
  rationale: मूल पाठ का जानबूझकर किया गया शब्दगत परिवर्तन ज्यों का त्यों रखा गया है, बिना उसके धर्मवैज्ञानिक आशय को पाठ में निर्धारित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘सर्प’, ‘स्त्री’ और ‘यहोवा परमेश्वर’ स्रोत की औपचारिकता बनाए रखते हैं; प्रश्न को स्वाभाविक संवादात्मक हिन्दी में रखा गया है।
