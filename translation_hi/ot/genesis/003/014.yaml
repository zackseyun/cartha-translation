source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים אֶֽל הַ/נָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִ/כָּל הַ/בְּהֵמָ֔ה וּ/מִ/כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה עַל גְּחֹנְ/ךָ֣ תֵלֵ֔ךְ וְ/עָפָ֥ר תֹּאכַ֖ל כָּל יְמֵ֥י חַיֶּֽי/ךָ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/014.yaml
  text: Then Yahweh God said to the serpent[a], “Because you have done this, cursed are you above all livestock and above every beast of the field. On your belly you shall go[b], and dust you shall eat all the days of your life.”
translation:
  language: hi
  text: तब यहोवा परमेश्वर ने साँप[a] से कहा, “क्योंकि तूने यह किया है, तू सब पालतू पशुओं और खुले मैदान में रहने वाले सब जंगली पशुओं से बढ़कर शापित है। तू अपने पेट के बल चलेगा, और अपने जीवन भर धूल खाएगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सर्प।”
    reason: lexical_alternative
  - marker: b
    text: “धूल खाना” अपमान और पराजय का चित्र भी हो सकता है; इसे केवल शाब्दिक आहार का कथन मानना आवश्यक नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: יְהֹוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: संयुक्त पद में परमेश्वर का व्यक्तिगत नाम और उपाधि दोनों सुरक्षित रहते हैं; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: הַנָּחָשׁ
  choice: साँप
  rationale: यह सामान्य आधुनिक हिन्दी में प्राणी का सीधा और सहज नाम है; ‘सर्प’ अधिक साहित्यिक विकल्प है।
- source_word: כִּי עָשִׂיתָ זֹּאת
  choice: चूँकि तूने यह किया है
  rationale: כִּי यहाँ आने वाले दंड का कारण बताता है; ‘चूँकि’ इस कारणात्मक संबंध को स्पष्ट रखता है।
- source_word: אָרוּר אַתָּה
  choice: तू ... शापित है
  rationale: ‘शापित’ विधिक और गंभीर स्वर को बनाए रखता है; हिन्दी वाक्य-विन्यास में तुलना के बाद रखने से कथन स्वाभाविक रहता है।
- source_word: מִכָּל הַבְּהֵמָה וּמִכֹּל חַיַּת הַשָּׂדֶה
  choice: सब पालतू पशुओं और मैदान के सब जंगली पशुओं से बढ़कर
  rationale: מִן को तुलनात्मक रूप में लिया गया है। בְּהֵמָה और חַיַּת הַשָּׂדֶה के बीच पालतू तथा जंगली पशुओं का भेद बनाए रखा गया है।
- source_word: עַל גְּחֹנְךָ תֵלֵךְ
  choice: तू अपने पेट के बल चलेगा
  rationale: मूल क्रिया का अर्थ ‘चलना/जाना’ है, स्पष्ट रूप से ‘रेंगना’ नहीं; इसलिए मूल की अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: וְעָפָר תֹּאכַל
  choice: और ... धूल खाएगा
  rationale: मूल की सजीव छवि को बिना केवल शाब्दिक आहार अथवा केवल रूपक मानने के अनूदित किया गया है।
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: अपने जीवन भर
  rationale: यह आधुनिक हिन्दी में मूल अभिव्यक्ति ‘तेरे जीवन के सब दिन’ का पूर्ण और स्वाभाविक समतुल्य है।
theological_decisions:
- issue: साँप की पहचान और शाप का स्वरूप
  choice: मुख्य पाठ में साँप को कथा के प्रत्यक्ष प्राणी के रूप में संबोधित किया गया है और शाप को ठोस शब्दों में रखा गया है।
  alternative: साँप की पहचान शैतान के रूप में स्पष्ट करते हुए व्याख्यात्मक विस्तार करना।
  rationale: यह पद स्वयं साँप को संबोधित करता है। बाद की धर्मवैज्ञानिक पहचान को मुख्य पाठ में जोड़ना मूल पद से आगे जाना और उसके तात्कालिक कथात्मक तनाव को सुलझा देना होता।
- issue: ‘धूल खाना’ का आशय
  choice: मुख्य पाठ में छवि को यथावत रखा गया है और संभावित अपमान/पराजय का भाव टिप्पणी में बताया गया है।
  alternative: मुख्य पाठ में इसे केवल शाब्दिक भोजन या केवल अपमान के रूप में स्पष्ट करना।
  rationale: इब्रानी अभिव्यक्ति ठोस चित्र और रूपकात्मक संकेत दोनों की संभावना रखती है; अनुवाद इस बहुअर्थकता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर के संबोधन में एकवचन ‘तू’ मूल के सीधे संबोधन और न्यायसूचक गंभीरता को व्यक्त करता है।
