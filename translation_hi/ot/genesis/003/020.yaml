source:
  edition: WLC
  text: וַ/יִּקְרָ֧א הָֽ/אָדָ֛ם שֵׁ֥ם אִשְׁתּ֖/וֹ חַוָּ֑ה כִּ֛י הִ֥וא הָֽיְתָ֖ה אֵ֥ם כָּל חָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/020.yaml
  text: And the man called his wife's name Eve[b][a], because she was the mother of all the living.
translation:
  language: hi
  text: और उस मनुष्य[a] ने अपनी पत्नी का नाम हव्वा रखा, क्योंकि वह सभी जीवितों[b] की माता थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आदम।” इब्रानी में यहाँ निश्चित उपपद के साथ शाब्दिक रूप से “उस मनुष्य” है।
    reason: alternative_reading
  - marker: b
    text: या, “सभी जीवित प्राणियों की माता” अथवा “हर जीवित व्यक्ति की माता।” इब्रानी में शाब्दिक रूप से “सब जीवितों की माता” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: नाम रखा
  rationale: यहाँ קרא नाम देने की क्रिया व्यक्त करता है। हिंदी में ‘नाम रखा’ स्वाभाविक है और इब्रानी नामकरण-सूत्र का अर्थ स्पष्ट रूप से देता है।
- source_word: הָאָדָם
  choice: उस मनुष्य
  rationale: इब्रानी में אָדָם के साथ निश्चित उपपद है, इसलिए इसे यहाँ व्यक्तिवाचक नाम ‘आदम’ के बजाय पहले से उल्लिखित निश्चित व्यक्ति, ‘उस मनुष्य’, के रूप में रखा गया है।
- source_word: אִשְׁתּוֹ
  choice: अपनी पत्नी
  rationale: संदर्भ में אִשָּׁה उस मनुष्य की पत्नी है; हिंदी में कर्ता की ओर लौटने वाला ‘अपनी’ स्वाभाविक और सटीक है।
- source_word: חַוָּה
  choice: हव्वा
  rationale: यह חַוָּה का हिंदी बाइबलीय परंपरा में प्रचलित और स्रोत के निकट नाम-रूप है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह नाम रखने का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिंदी में कारण-संबंध स्पष्ट करता है।
- source_word: הָיְתָה
  choice: थी
  rationale: यहाँ היה स्त्रीलिंग कर्ता की अवस्था बताता है; संक्रमणसूचक ‘बनी’ के बजाय ‘थी’ स्रोत के अधिक निकट है।
- source_word: אֵם
  choice: माता
  rationale: אֵם का सीधा अर्थ ‘माता’ है; यह पद की गरिमा और वंशजननी का भाव बनाए रखता है।
- source_word: כָּל חָי
  choice: सब जीवितों
  rationale: חָי यहाँ संज्ञा की तरह प्रयुक्त है। ‘सब जीवितों’ इब्रानी की संक्षिप्त और अर्थ-सीमा में खुली अभिव्यक्ति को बिना केवल मनुष्यों या सभी प्राणियों तक सीमित किए बनाए रखता है।
theological_decisions:
- issue: הָאָדָם को व्यक्तिवाचक नाम ‘आदम’ माना जाए या वर्णनात्मक ‘उस मनुष्य’
  choice: उस मनुष्य
  alternative: आदम
  rationale: निश्चित उपपद सहित इब्रानी रूप वर्णनात्मक अर्थ का समर्थन करता है। अनुवाद उस व्याकरणिक संकेत को सुरक्षित रखता है, जबकि पाठक के लिए प्रचलित वैकल्पिक समझ पादटिप्पणी में दी गई है।
- issue: ‘सब जीवितों की माता’ का दायरा
  choice: व्यापक और अनिर्धारित वाक्यांश को बनाए रखना
  alternative: सब जीवित मनुष्यों की माता / सभी जीवित प्राणियों की माता
  rationale: इब्रानी अभिव्यक्ति संक्षिप्त है और स्वयं दायरा स्पष्ट नहीं करती। किसी एक व्याख्या को मूल पाठ में आरोपित करने के बजाय उसकी वास्तविक व्यापकता और तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, संक्षिप्त और गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘नाम रखा’ सामान्य पाठक के लिए स्वाभाविक है; ‘सब जीवितों’ स्रोत की जानबूझकर खुली अर्थ-सीमा को सुरक्षित रखता है।
