  text: וַֽ/יִּשְׁמְע֞וּ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהִ֛ים מִתְהַלֵּ֥ךְ בַּ/גָּ֖ן לְ/ר֣וּחַ הַ/יּ֑וֹם וַ/יִּתְחַבֵּ֨א הָֽ/אָדָ֜ם וְ/אִשְׁתּ֗/וֹ מִ/פְּנֵי֙ יְהוָ֣ה אֱלֹהִ֔ים בְּ/ת֖וֹךְ עֵ֥ץ הַ/גָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/008.yaml
  text: And they heard the sound of Yahweh God walking in the garden in the breeze of the day[c][b][a], and the man and his wife hid themselves from the presence of Yahweh God among the trees of the garden.
translation:
  language: hi
  text: तब उन्होंने यहोवा परमेश्वर की आहट सुनी,[a] जो दिन की हवा में बगीचे में चल रहा था। तब वह मनुष्य[c] और उसकी पत्नी यहोवा परमेश्वर की उपस्थिति से बगीचे के पेड़ों के बीच छिप गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आवाज़।” इब्रानी शब्द का अर्थ “आहट/ध्वनि” या “आवाज़” हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “वह मनुष्य”; इसका अनुवाद “आदम” भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: आहट
  rationale: यह शब्द ‘आवाज़’ या व्यापक रूप से ‘ध्वनि’ का अर्थ दे सकता है। इस प्रसंग में परमेश्वर के चलने से जुड़ी सुनाई देने वाली ध्वनि के लिए ‘आहट’ स्वाभाविक है और बोले जाने का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को प्रचलित हिंदी रूप ‘यहोवा’ से और אֱלֹהִים को ‘परमेश्वर’ से व्यक्त किया गया है।
- source_word: מִתְהַלֵּךְ
  choice: चल रहा था
  rationale: हितपएल कृदंत बगीचे में गतिशील होने का ठोस चित्र देता है; मानवरूपी वर्णन को बिना नरम किए बनाए रखा गया है।
- source_word: לְרוּחַ הַיּוֹם
  choice: दिन की हवा के समय
  rationale: रूअख का मूल अर्थ हवा/वायु है। यह अनुवाद पारंपरिक ‘दिन की ठंडक में’ की अपेक्षा स्रोत के अधिक निकट है और दिन के निश्चित समय को अनावश्यक रूप से तय नहीं करता।
- source_word: הָאָדָם
  choice: वह पुरुष
  rationale: पत्नी के उल्लेख के साथ यहाँ एक विशिष्ट पुरुष अभिप्रेत है। ‘वह पुरुष’ पूर्वप्रसंग से उसकी पहचान दिखाता है, जबकि पादटिप्पणी ‘आदम’ की वैकल्पिक समझ बताती है।
- source_word: מִפְּנֵי
  choice: उपस्थिति से
  rationale: शाब्दिक ‘मुख के सामने से’ का स्थानिक और संबंधपरक भाव ‘उपस्थिति से’ में सुरक्षित रहता है।
- source_word: בְּתוֹךְ עֵץ הַגָּן
  choice: बगीचे के पेड़ों के बीच
  rationale: एकवचन עֵץ यहाँ सामूहिक अर्थ में प्रयुक्त है; हिंदी में बहुवचन ‘पेड़ों’ से छिपने का दृश्य स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: बगीचे में परमेश्वर के ‘चलने’ का मानवरूपी चित्रण
  choice: ‘चल रहा था’ के ठोस वर्णन को बनाए रखना
  alternative: ‘उपस्थिति प्रकट हो रही थी’ या केवल ‘विचरण कर रहा था’
  rationale: इब्रानी पाठ परमेश्वर को कथात्मक और मानवरूपी भाषा में प्रस्तुत करता है। अनुवाद इस तनाव को न तो रूपक बनाकर मिटाता है, न किसी व्यवस्थित धर्मवैज्ञानिक व्याख्या से सीमित करता है।
- issue: הָאָדָם की पहचान
  choice: वह पुरुष
  alternative: आदम; वह मनुष्य
  rationale: शब्द में व्यक्ति और मानव-प्रतिनिधि दोनों की प्रतिध्वनि हो सकती है। निकट प्रसंग में ‘उसकी पत्नी’ एक विशिष्ट पुरुष की ओर संकेत करता है; वैकल्पिक नाम-पाठ पादटिप्पणी में सुरक्षित है।
- issue: ‘आहट’ और ‘आवाज़’ की अस्पष्टता
  choice: मुख्य पाठ में ‘आहट’, पादटिप्पणी में ‘आवाज़’
  alternative: यहोवा परमेश्वर की आवाज़
  rationale: पाठ यह स्पष्ट नहीं कहता कि परमेश्वर ने उस क्षण कुछ बोला। ‘आहट’ चलने से संबंधित ध्वनि के अनुकूल है, जबकि मूल शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘आहट’ सामान्य पाठक के लिए स्वाभाविक है; ‘उपस्थिति’ मूल की संबंधपरक और स्थानिक गंभीरता बनाए रखती है। मुख्य वाक्य को हिंदी में सहज प्रवाह के लिए दो वाक्यों में विभाजित किया गया है।
