  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/נָּחָ֖שׁ אֶל הָֽ/אִשָּׁ֑ה לֹֽא מ֖וֹת תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/004.yaml
  text: But the serpent said to the woman[b][a], “You will not surely die.”
translation:
  language: hi
  text: परन्तु साँप ने स्त्री से कहा, “तुम निश्चय ही नहीं मरोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: परन्तु ... ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, पर यहाँ साँप का कथन पिछली चेतावनी का सीधा विरोध करता है; इसलिए ‘परन्तु’ प्रसंग का विरोधात्मक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַנָּחָשׁ
  choice: साँप
  rationale: נָחָשׁ का सामान्य अर्थ साँप/सर्प है। आधुनिक मानक हिन्दी में ‘साँप’ अधिक सहज और सर्वसुलभ है, जबकि मूल अर्थ को पूरा बनाए रखता है।
- source_word: הָאִשָּׁה
  choice: स्त्री
  rationale: यहाँ אִשָּׁה को ‘स्त्री’ कहना उत्पत्ति 2–3 के साहित्यिक ढाँचे को बनाए रखता है और अनावश्यक रूप से ‘पत्नी’ का संकरा संबंधपरक अर्थ नहीं जोड़ता।
- source_word: לֹא מוֹת תְּמֻתוּן
  choice: तुम निश्चय ही नहीं मरोगे
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute मृत्यु-विषयक कथन को बल देता है। हिन्दी में ‘निश्चय ही नहीं मरोगे’ नकार को स्पष्ट, पूर्ण और जोरदार बनाता है तथा ‘निश्चय ही मरोगे’ वाली पूर्व चेतावनी के सीधे खंडन को सुरक्षित रखता है। बहुवचन संबोधन का रूप ‘मरोगे’ प्रसंगानुकूल है।
theological_decisions:
- issue: साँप के खंडन का बल
  choice: “तुम निश्चय ही नहीं मरोगे।”
  alternative: “तुम निश्चय ही मरोगे नहीं” या “तुम नहीं मरोगे।”
  rationale: इब्रानी में לֹא के साथ infinitive absolute और सीमित क्रिया का संयोजन एक प्रबल निषेध व्यक्त करता है। चुना गया हिन्दी क्रम साँप के पूर्ण और सीधे खंडन को स्पष्ट करता है, पर यह नहीं बताता कि मृत्यु तत्काल होगी या बाद में; इस प्रकार मूल का धर्मवैज्ञानिक तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘साँप’ वर्तमान हिन्दी में ‘सर्प’ से अधिक स्वाभाविक है। वाक्य में ‘निश्चय ही नहीं’ रखा गया है ताकि निषेध की निश्चितता अस्पष्ट न हो।
