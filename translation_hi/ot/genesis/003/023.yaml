base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/023.yaml
  text: So Yahweh God sent him out from the garden of Eden to work the ground from which he had been taken[a].
translation:
  language: hi
  text: तब याहवे परमेश्वर ने उसे अदन के बाग से बाहर भेज दिया, ताकि वह उस भूमि की खेती करे[a], जिसमें से वह लिया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस भूमि पर काम करे।” इब्रानी क्रिया का अर्थ “काम करना,” “सेवा करना,” या इस संदर्भ में “खेती करना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחֵהוּ
  choice: उसे ... बाहर भेज दिया
  rationale: पिएल रूप का मूल अर्थ ‘भेज देना’ है और प्रसंग में अदन से बाहर किए जाने का दिशात्मक भाव है। अगले पद के अधिक प्रबल גּרשׁ (‘निकाल देना/खदेड़ना’) का भाव यहाँ नहीं जोड़ा गया।
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: व्यक्तिगत दिव्य नाम יְהוָה को ‘यहोवा’ और אֱלֹהִים को स्वाभाविक मानक हिन्दी में ‘परमेश्वर’ किया गया है।
- source_word: מִגַּן עֵדֶן
  choice: अदन के बाग से
  rationale: מִן स्थान से अलगाव दर्शाता है; ‘अदन के बाग से’ हिन्दी में स्वाभाविक है, जबकि ‘बाहर’ मुख्य क्रिया के साथ निष्कासन की दिशा स्पष्ट करता है।
- source_word: לַעֲבֹד
  choice: काम करे
  rationale: עבד का अर्थ ‘काम करना’, ‘सेवा करना’ या कृषि-संदर्भ में ‘खेती/जुताई करना’ हो सकता है। भूमि के साथ ‘काम करना’ व्यापक अर्थ और मूल की शब्दगत अनिश्चितता बचाता है।
- source_word: אֶת הָאֲדָמָה
  choice: उस भूमि पर
  rationale: אֲדָמָה यहाँ उस मिट्टी/भूमि को बताता है जिससे मनुष्य लिया गया था। हिन्दी में ‘भूमि पर काम करना’ स्वाभाविक है और आगे के संबंधवाचक उपवाक्य से कथा-संबंध बनाए रखता है।
- source_word: אֲשֶׁר לֻקַּח מִשָּׁם
  choice: जिसमें से वह लिया गया था
  rationale: निष्क्रिय क्रिया לֻקַּח को ‘लिया गया था’ से और पहले घट चुकी क्रिया को पूर्ण भूतकाल से व्यक्त किया गया है; מִשָּׁם का ‘जिसमें से’ भूमि के साथ संबंध स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत दिव्य नाम है। हिन्दी बाइबल-पाठकों में परिचित और प्रतिष्ठित रूप ‘यहोवा’ अपनाया गया है; इसे सामान्य पदवी ‘प्रभु’ से नहीं बदला गया।
- issue: मनुष्य के कार्य और उसके मूल दायित्व का संबंध
  choice: भूमि पर काम करे
  alternative: भूमि की खेती करे
  rationale: यह रूप उत्पत्ति 2–3 में मानव के कार्य की शब्दगत निरंतरता बनाए रखता है और पद में न कही गई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
