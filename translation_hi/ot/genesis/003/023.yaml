  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य। ‘इसलिए’ पिछले प्रसंग के परिणाम को जोड़ता है; ‘बाहर भेज दिया’ मूल क्रिया के अपेक्षाकृत संयत बल को रखते हुए अगले पद के अधिक प्रबल निष्कासन-वाचक क्रिया से भेद बनाए रखता है।
