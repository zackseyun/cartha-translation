  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֵּ֥לֶד עָדָ֖ה אֶת יָבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י יֹשֵׁ֥ב אֹ֖הֶל וּ/מִקְנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/020.yaml
  text: Adah bore Jabal[a]; he was the father of those who dwell in tents and have livestock.
translation:
  language: hi
  text: आदा ने याबाल को जन्म दिया। वह तंबुओं में रहने और पशुधन रखनेवालों का पिता[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तंबुओं में रहने और पशुधन पालनेवालों का मूलपुरुष।” यहाँ “पिता” का अर्थ किसी वर्ग का पूर्वज, किसी जीवन-पद्धति का प्रवर्तक या उसका आदिरूप भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: जन्म दिया
  rationale: वंशावली के प्रसंग में ילד के क़ाल रूप का स्वाभाविक और स्पष्ट हिन्दी अनुवाद।
- source_word: עָדָה
  choice: आदा
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी लिप्यंतरण।
- source_word: אֶת
  choice: '[प्रत्यक्ष कर्म-चिह्न; अनूदित नहीं]'
  rationale: यह יָבָל को प्रत्यक्ष कर्म के रूप में चिह्नित करता है; यहाँ इसका अलग हिन्दी समतुल्य नहीं है।
- source_word: יָבָל
  choice: याबाल
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी लिप्यंतरण।
- source_word: הוּא הָיָה
  choice: वह ... था
  rationale: यह याबाल की पहचान और भूमिका बताता है; हिन्दी में सामान्य भूतकालीन विधान स्वाभाविक है।
- source_word: אֲבִי
  choice: का पिता
  rationale: इब्रानी रूपक को सुरक्षित रखता है; इस सांस्कृतिक-वंशावली कथन में इसका अर्थ किसी जीवन-पद्धति का मूलपुरुष या प्रवर्तक भी हो सकता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: יֹשֵׁב אֹהֶל
  choice: तंबुओं में रहनेवालों
  rationale: एकवचन कृदन्त का सामूहिक अर्थ है—ऐसा वर्ग जिसकी पहचान तंबुओं में रहने से होती है।
- source_word: וּמִקְנֶה
  choice: और पशुधन रखनेवालों
  rationale: מִקְנֶה पशुधन या झुंडों को दर्शाता है। हिन्दी में संज्ञा-समुच्चय की अस्पष्टता से बचने के लिए निहित जीवन-पद्धति को ‘रखनेवालों’ से व्यक्त किया गया है; ‘पशुधन’ केवल गाय-बैलों की अपेक्षा अधिक व्यापक है।
theological_decisions:
- issue: ‘पिता’ का सांस्कृतिक-वंशावली अर्थ
  choice: मुख्य पाठ में ‘पिता’ रूपक बनाए रखा गया
  alternative: ‘मूलपुरुष’ या ‘प्रवर्तक’
  rationale: मूल इब्रानी रूपक को बिना संकीर्ण किए सुरक्षित रखा गया है, जबकि पादटिप्पणी उसके व्यापक अर्थ-क्षेत्र को बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘तंबुओं’ और ‘पशुधन’ जैसे सामान्य शब्द पाठ को सहज बनाते हैं; ‘पिता’ मूल रूपक को सुरक्षित रखता है।
