  yaml_path: translation/ot/genesis/004/013.yaml
  text: And Cain said to Yahweh[a], “My iniquity is too great to bear.”
translation:
  language: hi
  text: तब कैन ने यहोवा से कहा, “मेरा अपराध इतना बड़ा है कि मैं उसे सह नहीं सकता।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “मेरा दोष इतना बड़ा है कि मैं उसे सह नहीं सकता”; अथवा, “मेरा दंड इतना बड़ा है कि मैं उसे सह नहीं सकता।” यह अर्थ भी संभव है: “मेरा अपराध क्षमा किए जाने के लिए बहुत बड़ा है।” इब्रानी शब्द ‘अपराध’, ‘दोष’ या उसके ‘दंड’ को सूचित कर सकता है, और क्रिया का अर्थ ‘उठाना/सहना’ या कुछ संदर्भों में ‘क्षमा करना’ हो सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथात्मक रूप अगले प्रसंग को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब ... ने कहा’ स्वाभाविक कथाप्रवाह देता है।
- source_word: קַיִן
  choice: कैन
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: אֶל־יְהוָה
  choice: यहोवा से
  rationale: אֶל संबोधन की दिशा बताता है और हिन्दी में ‘से कहा’ स्वाभाविक है; יהוה को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: גָּדוֹל
  choice: इतना बड़ा
  rationale: מִן के साथ यह सहने की सीमा से अधिक होने का भाव देता है; हिन्दी में ‘इतना बड़ा ... कि’ सहज तुलनात्मक परिणाम-वाक्य है।
- source_word: עֲוֺנִי
  choice: मेरा अधर्म
  rationale: עָוֹן का मूल अर्थ अधर्म/दोष है, यद्यपि यह दोष के दंड या परिणाम को भी सूचित कर सकता है; मुख्य पाठ में मूल अर्थ रखा और संदर्भगत विकल्प पादटिप्पणी में दिया गया है।
- source_word: מִנְּשֹׂא
  choice: कि मैं उसे सह नहीं सकता
  rationale: נָשָׂא यहाँ बोझ उठाने या सहने का अर्थ दे सकता है; מן सीमा से अधिक होने का भाव देता है। कर्ता ‘मैं’ हिन्दी में अर्थ स्पष्ट और स्वाभाविक करता है।
theological_decisions:
- issue: עֲוֺנִי מִנְּשֹׂא की बहुअर्थकता
  choice: “मेरा अधर्म इतना बड़ा है कि मैं उसे सह नहीं सकता।”
  alternative: “मेरा दंड इतना बड़ा है कि मैं उसे सह नहीं सकता”; अथवा “मेरा अधर्म इतना बड़ा है कि क्षमा नहीं किया जा सकता।”
  rationale: עָוֹן अधर्म, दोष या उसके दंड को और נָשָׂא सहना/उठाना अथवा कुछ संदर्भों में क्षमा करना व्यक्त कर सकता है। मुख्य पाठ निकटतम शाब्दिक अर्थ रखता है, जबकि पादटिप्पणी वास्तविक भाषिक और धर्मवैचारिक तनाव सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘अधर्म’ नैतिक-धार्मिक अर्थ को बनाए रखता है; वाक्य-विन्यास हिन्दी में स्वाभाविक बनाया गया है और मूल की बहुअर्थकता पादटिप्पणी में सुरक्षित है।
