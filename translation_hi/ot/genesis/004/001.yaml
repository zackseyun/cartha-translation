source:
  edition: WLC
  text: וְ/הָ֣/אָדָ֔ם יָדַ֖ע אֶת חַוָּ֣ה אִשְׁתּ֑/וֹ וַ/תַּ֨הַר֙ וַ/תֵּ֣לֶד אֶת קַ֔יִן וַ/תֹּ֕אמֶר קָנִ֥יתִי אִ֖ישׁ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/001.yaml
  text: The man knew Eve his wife[a], and she conceived and bore Cain, and said[b], “I have acquired a man with Yahweh.”
translation:
  language: hi
  text: उस मनुष्य ने अपनी पत्नी हव्वा के साथ सहवास किया। वह गर्भवती हुई और उसने कैन[b] को जन्म दिया। उसने कहा, “मैंने याहवे के साथ एक पुरुष को प्राप्त किया है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “मैंने याहवे के साथ एक पुरुष को प्राप्त किया है।” इसका अर्थ “याहवे की सहायता से” या “याहवे से” भी समझा जा सकता है; एक कम सम्भावित व्याख्या यह है, “मैंने एक पुरुष—याहवे—को प्राप्त किया है।”
    reason: alternative_reading
  - marker: b
    text: इब्रानी में कैन नाम की ध्वनि “क़ानीती” (“मैंने प्राप्त किया है”) से मिलती-जुलती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָדָם
  choice: उस मनुष्य ने
  rationale: यहाँ אָדָם समस्त मानवजाति नहीं, पहले परिचित कराए गए पुरुष को सूचित करता है। आरम्भिक וְ को अलग से “और” कहना हिन्दी प्रवाह के लिए आवश्यक नहीं है।
- source_word: יָדַע אֶת־חַוָּה אִשְׁתּוֹ
  choice: अपनी पत्नी हव्वा के साथ सहवास किया
  rationale: יָדַע का मूल अर्थ “जानना” है, पर यहाँ यह यौन सम्बन्ध के लिए प्रचलित इब्रानी शिष्टोक्ति है। शाब्दिक “हव्वा को जाना” आधुनिक हिन्दी में अस्पष्ट और अस्वाभाविक होता, इसलिए अर्थ को गरिमापूर्ण ढंग से स्पष्ट किया गया है।
- source_word: וַתַּהַר
  choice: वह गर्भवती हुई
  rationale: यह הרה का स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: וַתֵּלֶד אֶת־קַיִן
  choice: उसने कैन को जन्म दिया
  rationale: जन्म-वृत्तान्त में यह संक्षिप्त, स्वाभाविक और स्रोत के अर्थ के अनुरूप हिन्दी है।
- source_word: קַיִן
  choice: कैन
  rationale: व्यक्तिवाचक नाम का हिन्दी लिप्यन्तरण किया गया है; קָנִיתִי के साथ ध्वनि-साम्य पाद-टिप्पणी में रखा गया है।
- source_word: קָנִיתִי
  choice: मैंने … प्राप्त किया है
  rationale: קנה का यहाँ अर्थ “प्राप्त करना/पाना” है। “प्राप्त किया” स्रोत की शब्द-क्रीड़ा और पूर्ण क्रिया का भाव सम्भव सीमा तक बनाए रखता है।
- source_word: אִישׁ
  choice: एक पुरुष
  rationale: इब्रानी में सामान्य “पुत्र” या “बालक” नहीं, बल्कि אִישׁ (“पुरुष”) है; स्रोत की असामान्य अभिव्यक्ति को समतल नहीं किया गया।
- source_word: אֶת־יְהוָה
  choice: याहवे के साथ
  rationale: अस्पष्ट אֶת को मुख्य पाठ में संगति/साथ के अर्थ में निकटता से रखा गया है। “की सहायता से” और “से” सम्भव व्याख्याएँ हैं, जिन्हें पाद-टिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम का शीर्षक से प्रतिस्थापन करने के बजाय आधुनिक हिन्दी में उसका लिप्यन्तरण किया गया है।
theological_decisions:
- issue: हव्वा के कथन में אֶת־יְהוָה का अर्थ
  choice: याहवे के साथ
  alternative: याहवे की सहायता से; याहवे से; एक पुरुष—याहवे—को
  rationale: इब्रानी रचना वास्तव में अस्पष्ट है। मुख्य पाठ निकट, अनिर्णायक रूप रखता है; अधिक व्याख्यात्मक तथा कम सम्भावित विकल्प पाद-टिप्पणी में हैं, ताकि कोई विशिष्ट धर्मवैज्ञानिक निष्कर्ष चुपचाप न थोपा जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। यौन सम्बन्ध के लिए अशिष्ट या अत्यधिक चिकित्सकीय भाषा से बचते हुए “सहवास किया” चुना गया। जन्म-वृत्तान्त की संक्षिप्तता बनाए रखी गई है, जबकि אֶת־יְהוָה की कठिनता मुख्य पाठ और पाद-टिप्पणी दोनों में सुरक्षित है।
