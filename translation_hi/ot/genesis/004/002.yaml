base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/002.yaml
  text: And she gave birth again[a], to his brother Abel. Abel became a shepherd of flocks[c][b], but Cain was a worker of the ground.
translation:
  language: hi
  text: फिर उसने उसके भाई हाबिल को जन्म दिया[a]। हाबिल भेड़-बकरियों का चरवाहा[b] था, जबकि कैन भूमि पर खेती करनेवाला[c] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसने आगे उसके भाई हाबिल को जन्म दिया।” इब्रानी मुहावरे में शाब्दिक रूप से “उसने जन्म देना जोड़ा” है, जिसका अर्थ फिर से जन्म देना या जन्म देना जारी रखना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल शब्द छोटे पालतू पशुओं के झुंड के लिए है, विशेषकर भेड़ों और बकरियों के लिए।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से “भूमि पर काम करनेवाला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף לָלֶדֶת
  choice: फिर उसने ... को जन्म दिया
  rationale: יסף के साथ infinitive यहाँ किसी काम को फिर से या आगे जारी रखने का भाव देता है। प्रसंग में दूसरा प्रसव होने के कारण यह स्वाभाविक हिंदी है।
- source_word: אֶת אָחִיו אֶת הָבֶל
  choice: उसके भाई हाबिल को
  rationale: दोहरा object marker नवजात बालक को पहले कैन के भाई और फिर हाबिल नाम से appositionally पहचानता है; हिंदी में यह संबंध स्पष्ट और सहज रहता है।
- source_word: הֶבֶל
  choice: हाबिल
  rationale: यह नाम हिंदी बाइबल-परंपरा में प्रचलित रूप में दिया गया है।
- source_word: וַיְהִי הֶבֶל
  choice: हाबिल ... था
  rationale: यहाँ היה हाबिल के व्यवसाय का वर्णन करता है। हिंदी में ‘था’ सरल वर्णन देता है और अनावश्यक रूप से यह नहीं ठहराता कि वह किसी विशेष समय पर चरवाहा ‘बना’।
- source_word: רֹעֵה צֹאן
  choice: भेड़-बकरियों का चरवाहा
  rationale: רעה पशुओं को चराने और उनकी रखवाली करने को तथा צאן मुख्यतः भेड़-बकरियों जैसे छोटे पालतू पशुओं के झुंड को दर्शाता है।
- source_word: קַיִן
  choice: कैन
  rationale: यह नाम हिंदी बाइबल-परंपरा में प्रचलित रूप में दिया गया है।
- source_word: הָיָה עֹבֵד אֲדָמָה
  choice: भूमि पर खेती करनेवाला था
  rationale: עבד + אֲדָמָה का अर्थ मिट्टी/भूमि पर काम करके उसे उपजाऊ बनाना है। ‘खेती करनेवाला’ सामान्य आधुनिक हिंदी में स्पष्ट है, जबकि ‘भूमि’ आरंभिक उत्पत्ति-वृत्तांत की विषयगत शब्दावली को बनाए रखती है।
- source_word: וְ
  choice: जबकि
  rationale: मूल संयोजक सामान्यतः ‘और’ है, पर यहाँ दोनों भाइयों के अलग-अलग व्यवसायों को आमने-सामने रखा गया है। ‘जबकि’ इस वर्णनात्मक भिन्नता को स्वाभाविक हिंदी में व्यक्त करता है, बिना किसी नैतिक विरोध का संकेत दिए।
theological_decisions:
- issue: दोनों भाइयों के व्यवसायों का कथात्मक चित्रण
  choice: व्यवसायों को केवल अलग-अलग आजीविकाओं के रूप में वर्णित किया गया है।
  alternative: शब्दावली द्वारा एक व्यवसाय को दूसरे से नैतिक या आध्यात्मिक रूप से श्रेष्ठ दिखाना।
  rationale: इस पद में इब्रानी पाठ दोनों व्यवसायों का वर्णन करता है, पर किसी का नैतिक मूल्यांकन नहीं करता। इसलिए अनुवाद इस तटस्थता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भेड़-बकरियों’ से प्राचीन निकट-पूर्वी छोटे पशुधन का आशय स्पष्ट होता है। ‘जबकि’ केवल व्यवसायों की भिन्नता दिखाता है; यह दोनों भाइयों या उनके कामों के बीच नैतिक श्रेणी नहीं बनाता।
