  text: וְ/שֵׁ֥ם אָחִ֖י/ו יוּבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י כָּל תֹּפֵ֥שׂ כִּנּ֖וֹר וְ/עוּגָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/021.yaml
  text: And the name of his brother was Jubal[c][b][a]; he was the father of all who play the lyre and the pipe.
translation:
  language: hi
  text: उसके भाई का नाम यूबाल था। वह उन सबका पिता[a] था जो वीणा और वायु-वाद्य[b] बजाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “पिता” का अर्थ संभवतः ऐसे वादकों का प्रवर्तक, पुरखा या आरंभकर्ता है; यह आवश्यक नहीं कि वह प्रत्येक वादक का प्रत्यक्ष जैविक पिता था।
    reason: cultural_note
  - marker: b
    text: हिब्रू शब्द עוּגָב से किस प्राचीन वायु-वाद्य का संकेत है, यह निश्चित नहीं है। इसका अनुवाद “नली-वाद्य,” “बाँसुरी,” या “बेंत की बाँसुरी” भी किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אָחִיו
  choice: उसके भाई का नाम
  rationale: हिब्रू संबंध और वाक्य के क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘उसके’ का संकेत पिछले पद के याबाल की ओर है।
- source_word: יוּבָל
  choice: यूबाल
  rationale: हिब्रू व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: הוּא הָיָה
  choice: वह ... था
  rationale: हिब्रू के स्पष्ट कर्ता और अस्तित्वसूचक क्रिया को सीधे तथा स्वाभाविक रूप में रखता है।
- source_word: אֲבִי כָּל
  choice: उन सबका पिता
  rationale: हिब्रू मुहावरे ‘सबका पिता’ को बनाए रखता है; यहाँ इसका व्यापक सांस्कृतिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: תֹּפֵשׂ
  choice: बजाते हैं
  rationale: शाब्दिक अर्थ ‘पकड़ना/हाथ में लेना’ है, पर वाद्ययंत्रों के साथ प्रसंगगत अर्थ उन्हें बजाना है।
- source_word: כִּנּוֹר
  choice: वीणा
  rationale: प्राचीन तार वाले वाद्य के लिए सहज और प्रतिष्ठित हिन्दी शब्द; यद्यपि आधुनिक भारतीय वीणा से उसकी ठीक-ठीक समानता अभिप्रेत नहीं है।
- source_word: עוּגָב
  choice: बाँसुरी
  rationale: यह किसी प्राचीन वायु-वाद्य का नाम है; उसकी सटीक पहचान अनिश्चित होने के कारण परिचित व्यापक हिन्दी समतुल्य चुना गया है और पादटिप्पणी दी गई है।
