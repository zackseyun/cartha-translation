source:
  edition: WLC
  text: וַֽ/יְהִ֖י מִ/קֵּ֣ץ יָמִ֑ים וַ/יָּבֵ֨א קַ֜יִן מִ/פְּרִ֧י הָֽ/אֲדָמָ֛ה מִנְחָ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/003.yaml
  text: And in the course of time[c][b][a], Cain brought to Yahweh an offering from the fruit of the ground.
translation:
  language: hi
  text: कुछ समय बीतने पर,[a] कैन भूमि की उपज[b] में से यहोवा[c] के लिए एक भेंट लाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “दिनों के अन्त से”; अर्थात् कुछ समय बीत जाने के बाद।
    reason: lexical_alternative
  - marker: b
    text: या “भूमि के फल में से।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में परमेश्वर का नाम YHWH है; इसका लिप्यंतरण “याहवे” भी किया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ יָמִים
  choice: कुछ समय बीतने पर
  rationale: कथात्मक सूत्र וַיְהִי और कालवाचक मुहावरे מִקֵּץ יָמִים को सहज आधुनिक हिन्दी में व्यक्त करता है। प्रसंग में इसका अर्थ किसी अवधि के बीतने के बाद है, न कि युगान्त संबंधी ‘दिनों का अन्त’.
- source_word: וַיָּבֵא
  choice: लाया
  rationale: בוא के हिफ़ील रूप का सीधा अर्थ यहाँ किसी वस्तु को लाना या प्रस्तुत करना है; भेंट के प्रसंग में ‘लाया’ स्वाभाविक और पर्याप्त है।
- source_word: קַיִן
  choice: कैन
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מִפְּרִי הָאֲדָמָה
  choice: भूमि की उपज में से
  rationale: פְּרִי कृषि-संदर्भ में फल अथवा उपज और אֲדָמָה भूमि/मिट्टी को दर्शाता है। ‘उपज’ हिन्दी में स्वाभाविक है और भूमि से प्राप्त कृषि-फल का अर्थ बनाए रखता है।
- source_word: מִנְחָה
  choice: एक भेंट
  rationale: מִנְחָה का अर्थ उपहार, नजराना या अर्पण हो सकता है। यहाँ परमेश्वर के सामने लाई गई वस्तु के लिए ‘भेंट’ स्पष्ट है, पर उसके अनुष्ठानिक प्रकार को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ का लक्ष्य/प्राप्तकर्ता-संबंध ‘के लिए’ से स्वाभाविक रूप में व्यक्त होता है। यौगिक नाम יהוה को पारंपरिक हिन्दी रूप ‘यहोवा’ में लिप्यंतरित किया गया है और पाठ में सामान्य पदवी से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरी निजी नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित लिप्यंतरण है; पादटिप्पणी ‘याहवे’ विकल्प बताती है और नाम को केवल पदवी ‘प्रभु’ में बदलने से बचाती है।
- issue: מִקֵּץ יָמִים का आशय
  choice: कुछ समय बीतने पर
  alternative: दिनों के अन्त में
  rationale: प्रसंग बीती हुई समयावधि के बाद कैन की कार्रवाई बताता है। इसलिए युगान्त संबंधी अर्थ आरोपित किए बिना सामान्य कालवाचक आशय रखा गया है।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण मानक हिन्दी। वाक्य कथात्मक प्रवाह बनाए रखता है; ‘भेंट’ व्यापक अर्थ वाला शब्द है और ‘उपज’ कृषि-संदर्भ में सहज है।
