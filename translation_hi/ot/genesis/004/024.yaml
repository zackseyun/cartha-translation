  yaml_path: translation/ot/genesis/004/024.yaml
  text: For Cain is avenged sevenfold[b][a], and Lamech seventy-sevenfold.
translation:
  language: hi
  text: 'क्योंकि कैन का बदला सात गुना लिया जाएगा,[a]

    और लेमेक का बदला सतहत्तर गुना लिया जाएगा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लिया जाता है”; इब्रानी क्रिया निश्चित भविष्य अथवा सामान्य, सूक्तिपरक कथन—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “सत्तर और सात”; अर्थात “सतहत्तर गुना।”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय पिछली पंक्ति में लेमेक के कथन का आधार प्रस्तुत करता है; ‘क्योंकि’ उसके संयोजक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שִׁבְעָתַיִם
  choice: सात गुना
  rationale: यह रूप बदले की सात गुनी मात्रा व्यक्त करता है; ‘सात गुना’ आधुनिक हिन्दी में स्पष्ट है और अगली पंक्ति के संख्यात्मक समानांतर को बनाए रखता है।
- source_word: יֻקַּם
  choice: बदला ... लिया जाएगा
  rationale: נקם का होफ़ाल रूप कर्मवाच्य है और यहाँ निश्चित अथवा आश्वस्त भविष्य का भाव दे सकता है। हिन्दी में ‘बदला लिया जाएगा’ इस भाव को स्वाभाविक ढंग से व्यक्त करता है; सामान्य या सूक्तिपरक वर्तमान की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: קָיִן
  choice: कैन
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְלֶמֶךְ
  choice: और लेमेक का
  rationale: संयोजक दोनों तुलनात्मक पंक्तियों को जोड़ता है; दूसरी पंक्ति में क्रिया अध्याहृत है, जैसा इब्रानी काव्य में है।
- source_word: שִׁבְעִים וְשִׁבְעָה
  choice: सतहत्तर गुना
  rationale: शाब्दिक अर्थ ‘सत्तर और सात’ अर्थात सतहत्तर है। ‘सतहत्तर गुना’ पहली पंक्ति के ‘सात गुना’ के साथ काव्यात्मक समानांतर बनाए रखता है।
theological_decisions:
- issue: लेमेक के बदले की संख्या
  choice: सतहत्तर गुना
  alternative: सत्तर गुना सात
  rationale: इब्रानी पदबंध का स्वाभाविक अर्थ ‘सतहत्तर’ है, ‘सत्तर गुना सात’ नहीं। यह अनुवाद बाद के मत्ती 18:22 के पाठ को उत्पत्ति में आरोपित करने से बचता है और यहाँ के काव्यात्मक समानांतर को सुरक्षित रखता है।
- issue: נקם के अपूर्ण क्रियारूप का कालगत बल
  choice: निश्चित भविष्य—‘लिया जाएगा’
  alternative: सूक्तिपरक वर्तमान—‘लिया जाता है’
  rationale: इस काव्यात्मक कथन में अपूर्ण रूप आश्वस्त भविष्य अथवा सामान्य सत्य, दोनों रूपों में समझा जा सकता है। मुख्य पाठ में निश्चित भविष्य रखा गया है और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक संक्षिप्तता बनाए रखने के लिए दूसरी पंक्ति में ‘बदला लिया जाएगा’ दोहराया नहीं गया; उसका अर्थ पहली पंक्ति से स्वाभाविक रूप से पूरा होता है।
