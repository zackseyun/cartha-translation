  text: וְ/אֶל קַ֥יִן וְ/אֶל מִנְחָת֖/וֹ לֹ֣א שָׁעָ֑ה וַ/יִּ֤חַר לְ/קַ֨יִן֙ מְאֹ֔ד וַֽ/יִּפְּל֖וּ פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/005.yaml
  text: But for Cain and for his offering he had no regard[a]. So Cain became very angry[b], and his face fell.
translation:
  language: hi
  text: परन्तु कैन और उसकी भेंट पर उसने कृपादृष्टि नहीं की[a]। तब कैन बहुत क्रोधित हुआ, और उसका मुँह उतर गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने कैन और उसकी भेंट को अनुकूल दृष्टि से नहीं देखा।”
    reason: lexical_alternative
  - marker: b
    text: यह इब्रानी मुहावरा है, जिसका अर्थ है कि वह खिन्न और उदास दिखाई देने लगा।
    reason: idiom_explanation
lexical_decisions:
- source_word: וְאֶל
  choice: पर … पर
  rationale: שָׁעָה के साथ यह उस व्यक्ति और वस्तु को चिह्नित करता है जिनकी ओर अनुकूल दृष्टि की जाती है; दोनों संज्ञाओं के साथ इसकी पुनरावृत्ति को हिन्दी में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: מִנְחָתוֹ
  choice: उसकी भेंट
  rationale: यहाँ परमेश्वर के सामने प्रस्तुत वस्तु का संदर्भ है। ‘भेंट’ धार्मिक संदर्भ में स्वाभाविक है और मूल शब्द के ‘उपहार/चढ़ावे’ के अर्थ-क्षेत्र को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: לֹא שָׁעָה
  choice: उसने कृपादृष्टि नहीं की
  rationale: क्रिया यहाँ केवल देखने के बजाय अनुकूलता से ध्यान देने का भाव रखती है। यह अनुवाद अस्वीकृति को व्यक्त करता है, पर उसका कारण या तरीका नहीं जोड़ता। कर्ता इब्रानी में निहित है और पिछले पद से समझा जाता है, इसलिए हिन्दी में ‘उसने’ रखा गया है।
- source_word: וַיִּחַר ... מְאֹד
  choice: बहुत क्रोधित हुआ
  rationale: इब्रानी मुहावरे में क्रोध के जलने का चित्र है; वर्तमान हिन्दी में यह भाव ‘बहुत क्रोधित हुआ’ से स्पष्ट और स्वाभाविक रूप में व्यक्त होता है।
- source_word: וַיִּפְּלוּ פָּנָיו
  choice: उसका मुँह उतर गया
  rationale: यह निराशा, खिन्नता या उदासी के चेहरे पर दिखाई देने का मुहावरा है। हिन्दी का ‘मुँह उतर गया’ मूल चित्र और मुहावरेदार अर्थ दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: कैन की भेंट के प्रति परमेश्वर की प्रतिक्रिया का स्वरूप
  choice: प्रतिक्रिया को ‘कृपादृष्टि नहीं की’ के रूप में रखा गया, बिना अस्वीकृति का कारण बताए।
  alternative: ‘स्वीकार नहीं किया’ या ‘ध्यान नहीं दिया।’
  rationale: इब्रानी पाठ बताता है कि कैन और उसकी भेंट पर अनुकूल दृष्टि नहीं की गई, पर इस पद में इसका कारण नहीं बताया गया। इसलिए अनुवाद कोई doctrinal कारण नहीं जोड़ता और व्यक्ति तथा उसकी भेंट—दोनों पर मूल का बल बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘कृपादृष्टि’ धार्मिक प्रसंग में परिचित है, जबकि ‘मुँह उतर गया’ सामान्य पाठक के लिए स्वाभाविक मुहावरा है।
