id: GEN.4.7
reference: Genesis 4:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/ל֤וֹא אִם תֵּיטִיב֙ שְׂאֵ֔ת וְ/אִם֙ לֹ֣א תֵיטִ֔יב לַ/פֶּ֖תַח חַטָּ֣את רֹבֵ֑ץ וְ/אֵלֶ֨י/ךָ֙ תְּשׁ֣וּקָת֔/וֹ וְ/אַתָּ֖ה תִּמְשָׁל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/007.yaml
  text: If you do well[a], will there not be acceptance? But if you do not do well, sin is crouching at the door; its desire is for you[d][c][b], but you must rule over it.
translation:
  language: hi
  text: यदि तुम भला करो, तो क्या तुम्हें स्वीकार नहीं किया जाएगा?[a] पर यदि तुम भला न करो, तो पाप द्वार पर घात लगाए बैठा है; उसकी लालसा तुम्हारी ओर है,[b][c] पर तुम्हें उस पर प्रभुता करनी चाहिए।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उठान’ या ‘उठाया जाना’; आशय काइन का मुख उठने या उसे स्वीकार किए जाने से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पापबलि द्वार पर पड़ी है’; फिर भी निकट प्रसंग की छवि पाप को घात लगाए बैठे पशु के रूप में अधिक स्वाभाविक ढंग से प्रस्तुत करती है।
    reason: alternative_reading
  - marker: c
    text: या ‘उसकी अभिलाषा’ अथवा ‘उसका आवेग’। उत्पत्ति 3:16 में मिलती-जुलती शब्दावली की तुलना करें।
    reason: cross_reference
  - marker: d
    text: या ‘तुम उस पर प्रभुता करोगे’ अथवा ‘तुम उस पर प्रभुता कर सकते हो।’ इब्रानी को उपदेश, भविष्यवाणी या संभावना के रूप में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּיטִיב
  choice: भला करो
  rationale: हिफ़ील रूप यहाँ सही या अच्छा आचरण करने का बोध देता है। ‘भला करो’ शर्त की संक्षिप्तता और नैतिक आशय दोनों बनाए रखता है।
- source_word: שְׂאֵת
  choice: तुम्हें स्वीकार नहीं किया जाएगा
  rationale: शब्द का मूल अर्थ ‘उठाना’ है, पर प्रसंग में यह काइन के मुख के उठने या परमेश्वर द्वारा स्वीकार किए जाने की ओर संकेत कर सकता है। मुख्य पाठ में स्वाभाविक अर्थ रखा गया और शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: לַפֶּתַח
  choice: द्वार पर
  rationale: यह सीधा स्थानसूचक पद है और देहरी पर उपस्थित खतरे का सजीव चित्र प्रस्तुत करता है।
- source_word: חַטָּאת
  choice: पाप
  rationale: यद्यपि इसका अर्थ ‘पापबलि’ भी हो सकता है, ‘घात लगाए बैठा है’ वाली पशु-सदृश छवि यहाँ व्यक्तिरूप में पाप को अधिक स्वाभाविक बनाती है।
- source_word: רֹבֵץ
  choice: घात लगाए बैठा है
  rationale: कृदंत किसी पशु के दुबककर बैठे या झपटने की प्रतीक्षा करते रहने का चित्र देता है। यह हिंदी में आसन्न शिकारी खतरे को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תְּשׁוּקָתוֹ
  choice: उसकी लालसा
  rationale: संज्ञा इच्छा या लालसा का अर्थ देती है। ‘लालसा’ उत्पत्ति 3:16 की समान शब्दावली से संबंध बनाए रखती है, बिना उसके ठीक आशय को आवश्यकता से अधिक निश्चित किए।
- source_word: תִּמְשָׁל בּוֹ
  choice: तुम्हें उस पर प्रभुता करनी चाहिए
  rationale: अपूर्ण क्रिया आज्ञार्थक आग्रह, भविष्यवाणी या संभावना का भाव दे सकती है। चेतावनी के इस प्रसंग में यह अनुवाद उपदेशात्मक बल व्यक्त करता है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: क्या अंतिम खंड काइन को पाप पर प्रभुता करने की आज्ञा देता है, उसकी भावी प्रभुता की भविष्यवाणी करता है, या उसकी क्षमता बताता है
  choice: 'मुख्य पाठ में उपदेशात्मक अर्थ: ‘तुम्हें उस पर प्रभुता करनी चाहिए।’'
  alternative: ‘तुम उस पर प्रभुता करोगे’ अथवा ‘तुम उस पर प्रभुता कर सकते हो।’
  rationale: इब्रानी अपूर्ण क्रिया इन सभी भावों की अनुमति देती है। प्रसंग में परमेश्वर काइन को चेतावनी और नसीहत दे रहे हैं, इसलिए मुख्य पाठ में उपदेशात्मक अर्थ स्वाभाविक है; पादटिप्पणी अन्य अर्थों और धार्मिक तनाव को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और मौखिक रूप से स्पष्ट शैली। ‘प्रभुता करनी चाहिए’ धार्मिक शब्दावली से परिचित पाठकों के लिए स्वाभाविक है और आज्ञा को अत्यधिक कठोर बनाए बिना उपदेशात्मक भाव रखता है। पाप की व्यक्तिरूप शिकारी छवि को ‘घात लगाए बैठा है’ से जीवंत रखा गया है।
