  source_fidelity: Hindi text accurately represents the agricultural consequence in לֹא תֹסֵף תֵּת כֹּחָהּ לָךְ as the ground’s no longer giving its productive strength, and preserves the paired, overlapping force of נָע וָנָד. “पृथ्वी पर” appropriately reflects the broad primeval-context sense of בָאָרֶץ while retaining “देश में” as an alternative.
  naturalness: The wording is natural modern standard Hindi with a suitably dignified biblical register. “भूमि पर खेती करोगे,” “उपजाऊ शक्ति,” and “मारे-मारे फिरते रहोगे” are clear and idiomatic. The latter effectively conveys both wandering and being driven from place to place without over-specifying the judgment.
  terminology: “भूमि” and “पृथ्वी” maintain the contextual distinction between cultivated ground and the wider earth. “उपजाऊ शक्ति” responsibly explains the agricultural sense of כֹּחָהּ while keeping the source metaphor. Footnotes preserve the syntactic ambiguity of כִּי and the possible “देश” sense of אָרֶץ.
