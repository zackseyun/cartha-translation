id: GEN.4.12
reference: Genesis 4:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י תַֽעֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה לֹֽא תֹסֵ֥ף תֵּת כֹּחָ֖/הּ לָ֑/ךְ נָ֥ע וָ/נָ֖ד תִּֽהְיֶ֥ה בָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/012.yaml
  text: When you work the ground[a], it will no longer yield its strength to you[d][c][b]. You will be a wanderer and a fugitive on the earth.
translation:
  language: hi
  text: जब तुम भूमि पर खेती करोगे,[a] तब वह फिर तुम्हें अपनी उपजाऊ शक्ति नहीं देगी।[b] तुम पृथ्वी पर भटकते और मारे-मारे फिरते रहोगे।[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्योंकि जब तुम भूमि पर खेती करोगे” अथवा “यदि तुम भूमि पर खेती करोगे।” इब्रानी संयोजक को कारणवाचक, कालवाचक या शर्तवाचक समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वह आगे तुम्हें अपनी शक्ति नहीं देगी।” यहाँ भूमि की उपज देने की सामर्थ्य का भाव है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “तुम भटकनेवाले और फिरनेवाले होगे।” दोनों इब्रानी शब्द अर्थ में निकट हैं और कैन की अस्थिर, ठिकानाविहीन दशा पर बल देते हैं।
    reason: lexical_alternative
  - marker: d
    text: या “देश में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: 'यहाँ संयोजक आने वाली परिस्थिति को प्रस्तुत करता है: जब भी कैन भूमि पर खेती करेगा, यह परिणाम होगा। कारणवाचक ‘क्योंकि’ और शर्तवाचक ‘यदि’ भी व्याकरणतः संभव हैं, इसलिए विकल्प पादटिप्पणी में रखे गए हैं।'
- source_word: תַעֲבֹד אֶת־הָאֲדָמָה
  choice: तुम भूमि पर खेती करोगे
  rationale: क्रिया עבד यहाँ भूमि को जोतने या उसकी खेती करने के अर्थ में है। ‘भूमि पर खेती करना’ आधुनिक हिन्दी में स्वाभाविक है और कृषि-संदर्भ स्पष्ट करता है।
- source_word: לֹא תֹסֵף תֵּת כֹּחָהּ לָךְ
  choice: वह फिर तुम्हें अपनी उपजाऊ शक्ति नहीं देगी
  rationale: יסף के साथ क्रियार्थक रूप का भाव ‘आगे/फिर ऐसा न करना’ है। כֹּחָהּ का शाब्दिक अर्थ ‘उसकी शक्ति’ है; ‘उपजाऊ शक्ति’ भूमि की उत्पादक सामर्थ्य को स्पष्ट करते हुए मूल रूपक को बनाए रखता है।
- source_word: נָע וָנָד
  choice: भटकते और मारे-मारे फिरते
  rationale: दोनों निकटार्थक शब्द कैन की अस्थिर और ठिकानाविहीन दशा को तीव्र करते हैं। हिन्दी का यह युग्म दोनों पदों को अलग रखते हुए उनकी संयुक्त तीव्रता व्यक्त करता है।
- source_word: בָאָרֶץ
  choice: पृथ्वी पर
  rationale: प्रारम्भिक उत्पत्ति-वृत्तांत के व्यापक संदर्भ में אֶרֶץ को ‘पृथ्वी’ लेना उचित है, यद्यपि ‘देश में’ भी संभव है।
theological_decisions:
- issue: कैन के दण्ड का स्वरूप
  choice: कृषि की निष्फलता और ठिकानाविहीन जीवन—दोनों को ठोस दण्ड के रूप में बनाए रखा गया है।
  alternative: इसे केवल मानसिक बेचैनी या केवल किसी सीमित भूभाग से निर्वासन मानना।
  rationale: पद भूमि की उपजाऊ शक्ति न मिलने और נָע וָנָד होने—दोनों को साथ रखता है; अनुवाद इनमें से किसी एक आयाम में दूसरे को विलीन नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘उपजाऊ शक्ति’ मूल के ‘शक्ति’ रूपक और कृषि-संदर्भ दोनों को बनाए रखता है। ‘मारे-मारे फिरते’ सामान्य पाठक के लिए ठिकानाविहीन दशा को स्वाभाविक ढंग से व्यक्त करता है।
