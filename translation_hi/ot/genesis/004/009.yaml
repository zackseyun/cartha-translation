  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל קַ֔יִן אֵ֖י הֶ֣בֶל אָחִ֑י/ךָ וַ/יֹּ֨אמֶר֙ לֹ֣א יָדַ֔עְתִּי הֲ/שֹׁמֵ֥ר אָחִ֖/י אָנֹֽכִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/009.yaml
  text: Then Yahweh said to Cain[a], “Where is Abel your brother?” And he said, “I do not know. Am I my brother’s keeper?”
translation:
  language: hi
  text: तब याहवे ने कैन से कहा, “तेरा भाई हाबिल कहाँ है?” उसने कहा, “मैं नहीं जानता।[a] क्या मैं अपने भाई का रखवाला हूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं नहीं जानता था।” इब्रानी पूर्णकाल को भूतकालीन इनकार के रूप में भी समझा जा सकता है, यद्यपि इस संदर्भ में यह स्वाभाविक रूप से वर्तमान अज्ञान का दावा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम य्ह्व्ह का हिन्दी में निकट और प्रचलित लिप्यंतरण; इसे किसी उपाधि से नहीं बदला गया।
- source_word: וַיֹּאמֶר
  choice: तब ... कहा / उसने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; हिन्दी में पहले खंड में “तब” और उत्तर में सहज “उसने कहा” कथाप्रवाह को स्पष्ट रखते हैं।
- source_word: אֵי
  choice: कहाँ है
  rationale: स्थानवाचक प्रश्न है; हिन्दी में वाक्य के अनुसार “कहाँ है” स्वाभाविक रूप है।
- source_word: הֶבֶל
  choice: हाबिल
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में सुबोध और प्रचलित रूप।
- source_word: אָחִיךָ
  choice: तेरा भाई
  rationale: इब्रानी में पुल्लिंग एकवचन ‘भाई’ और द्वितीय पुरुष एकवचन प्रत्यय स्पष्ट हैं; प्रत्यक्ष संबोधन के अनुरूप “तेरा” रखा गया।
- source_word: לֹא יָדַעְתִּי
  choice: मैं नहीं जानता
  rationale: रूपतः पूर्णकाल भूतकालीन इनकार भी व्यक्त कर सकता है, पर संवाद के संदर्भ में वर्तमान अज्ञान का दावा हिन्दी में स्वाभाविक है।
- source_word: הֲשֹׁמֵר
  choice: रखवाला
  rationale: שמר का अर्थ रखवाली, निगरानी या रक्षा करना है; “रखवाला” उत्तरदायित्व की धारणा को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: אָחִי אָנֹכִי
  choice: मैं अपने भाई का ... हूँ
  rationale: स्वतंत्र सर्वनाम אָנֹכִי का बल हिन्दी के आलंकारिक प्रश्न और “मैं” से पर्याप्त रूप में व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम सीधे आया है; “यहवे” नाम को सुरक्षित रखता है और उसे उपाधि में नहीं बदलता।
- issue: कैन के उत्तर का काल
  choice: मैं नहीं जानता
  alternative: मैं नहीं जानता था
  rationale: इब्रानी पूर्णकाल दोनों रूपों की संभावना देता है; संदर्भ में वर्तमान अज्ञान का दावा अधिक स्वाभाविक है, जबकि वैकल्पिक भूतकालीन अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। प्रत्यक्ष संवाद में “तेरा” मूल के एकवचन संबोधन और निकट कथात्मक शैली को बनाए रखता है। पादटिप्पणी चिह्न उस वाक्य के बाद रखा गया है जिससे काल-संबंधी विकल्प जुड़ा है।
