source:
  edition: WLC
  text: וְ/עַתָּ֖ה אָר֣וּר אָ֑תָּה מִן הָֽ/אֲדָמָה֙ אֲשֶׁ֣ר פָּצְתָ֣ה אֶת פִּ֔י/הָ לָ/קַ֛חַת אֶת דְּמֵ֥י אָחִ֖י/ךָ מִ/יָּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/011.yaml
  text: And now you are cursed from the ground[c][b][a], which has opened its mouth to receive your brother’s blood from your hand.
translation:
  language: hi
  text: अब तू उस भूमि से शापित है[a], जिसने अपना मुँह खोलकर तेरे हाथ से तेरे भाई का लहू[b] ग्रहण किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि से दूर शापित”; इब्रानी वाक्यांश का अर्थ यह भी हो सकता है कि भूमि शाप का स्रोत या क्षेत्र है, अथवा कैन उससे अलग कर दिया गया है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “लहूओं”; यह रक्तपात या बहाए गए लहू के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह कैन के किए हुए काम के तत्काल परिणाम की ओर संकेत करता है। हिन्दी में ‘अब’ संयोजक और काल-सूचक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָרוּר אָתָּה
  choice: तू ... शापित है
  rationale: यह इब्रानी विधेय-विशेषण और सर्वनाम से व्यक्त कैन की शापित दशा को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: מִן הָאֲדָמָה
  choice: भूमि से
  rationale: ‘से’ इब्रानी מִן की स्रोत अथवा अलगाव—दोनों संभावित छायाओं को कुछ हद तक खुला रखता है; ‘भूमि के द्वारा’ या ‘भूमि से दूर’ किसी एक अर्थ को अनावश्यक रूप से निश्चित कर देता।
- source_word: אֲשֶׁר פָּצְתָה אֶת פִּיהָ
  choice: जिसने अपना मुँह खोलकर
  rationale: भूमि के मानवीकरण और उसके मुँह खोलने के सजीव चित्र को सहज हिन्दी में बनाए रखता है।
- source_word: לָקַחַת
  choice: ग्रहण किया है
  rationale: मूल क्रिया का अर्थ ‘लेना’ है; बहाए गए लहू को भूमि द्वारा अपने भीतर लेने के प्रसंग में ‘ग्रहण करना’ स्वाभाविक और गरिमापूर्ण है।
- source_word: דְּמֵי אָחִיךָ
  choice: तेरे भाई का लहू
  rationale: इब्रानी में ‘लहू’ का बहुवचन रक्तपात अथवा बहाए गए रक्त के लिए प्रचलित मुहावरा है; हिन्दी में एकवचन ‘लहू’ अर्थ और चित्र दोनों को स्पष्ट रखता है।
- source_word: מִיָּדֶךָ
  choice: तेरे हाथ से
  rationale: यह मूल का ठोस चित्र बनाए रखकर कैन की सीधी जिम्मेदारी व्यक्त करता है।
theological_decisions:
- issue: शाप और भूमि के बीच संबंध
  choice: ‘भूमि से शापित’ कहकर स्रोत और अलगाव के बीच मूल की अर्थगत गुंजाइश को खुला रखा गया है।
  alternative: ‘भूमि के द्वारा शापित’ या ‘भूमि से दूर शापित’
  rationale: इब्रानी מִן स्रोत, संबंध या अलगाव की छाया दे सकता है। प्रसंग भूमि को सक्रिय रूप में दिखाता है, पर अगली आयत कैन के उससे अलगाव की ओर भी संकेत करती है; इसलिए किसी एक व्याख्या को मुख्य पाठ में निर्णायक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर द्वारा कैन को सीधे संबोधन के कारण ‘तू/तेरे’ रखा गया है। भाषा सरल, सजीव और गरिमापूर्ण है। ‘भूमि से शापित’ कुछ असामान्य होते हुए भी मूल की वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखता है।
