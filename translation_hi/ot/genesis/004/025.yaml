source:
  edition: WLC
  text: וַ/יֵּ֨דַע אָדָ֥ם עוֹד֙ אֶת אִשְׁתּ֔/וֹ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁ֑ת כִּ֣י שָֽׁת לִ֤/י אֱלֹהִים֙ זֶ֣רַע אַחֵ֔ר תַּ֣חַת הֶ֔בֶל כִּ֥י הֲרָג֖/וֹ קָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/025.yaml
  text: And Adam knew his wife again[a], and she bore a son and called his name Seth, for she said, “God has appointed for me another offspring in place of Abel, because Cain killed him.”
translation:
  language: hi
  text: आदम ने फिर अपनी पत्नी के साथ सहवास किया। उसने एक पुत्र को जन्म दिया और उसका नाम शेत[a] रखा, क्योंकि उसने कहा, “परमेश्वर ने हाबिल के स्थान पर मेरे लिए एक और संतान रखी है, क्योंकि कैन ने उसे मार डाला।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “शेत” नाम की ध्वनि “रखी/स्थापित की” अर्थ वाली क्रिया से मिलती है; यहाँ शब्द-क्रीड़ा है।
    reason: मूल इब्रानी में שֵׁת और שָׁת के बीच की शब्द-क्रीड़ा हिंदी में पूरी तरह दिखाई नहीं देती।
lexical_decisions:
- source_word: וַיֵּדַע
  choice: अपनी पत्नी के साथ सहवास किया
  rationale: पत्नी के संदर्भ में יָדַע यौन संबंध के लिए प्रयुक्त इब्रानी शिष्टोक्ति है। हिंदी में शाब्दिक ‘जाना’ अर्थ स्पष्ट नहीं करता; ‘सहवास किया’ अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: עוֹד
  choice: फिर
  rationale: यह पहले के वैवाहिक संबंध और जन्म-वृत्तांत के बाद घटना की पुनरावृत्ति दिखाता है।
- source_word: וַתֵּלֶד בֵּן
  choice: उसने एक पुत्र को जन्म दिया
  rationale: यह ילד + בן का स्पष्ट और स्वाभाविक आधुनिक हिंदी रूप है।
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: उसका नाम … रखा
  rationale: हिंदी में नामकरण की स्वाभाविक अभिव्यक्ति है और इब्रानी नामकरण-सूत्र का आशय सुरक्षित रखती है।
- source_word: שֵׁת
  choice: शेत
  rationale: इब्रानी व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण है।
- source_word: שָׁת
  choice: ठहरा दी है
  rationale: שִׁית का मूल भाव रखना, स्थापित करना या नियुक्त करना है। ‘ठहरा दी है’ दैवी व्यवस्था का भाव देता है और नाम शेत के साथ मूल शब्द-क्रीड़ा की ओर संकेत करने योग्य है।
- source_word: זֶרַע אַחֵר
  choice: एक और संतान
  rationale: זֶרַע यहाँ प्रजनन/वंश के अर्थ में है, पर तत्काल संदर्भ नवजात पुत्र का है; ‘संतान’ आधुनिक हिंदी में सहज है और ‘बीज’ की अस्वाभाविक शाब्दिकता से बचता है।
- source_word: תַּחַת הֶבֶל
  choice: हाबिल के स्थान पर
  rationale: תַּחַת यहाँ प्रतिस्थापन का भाव व्यक्त करता है।
- source_word: הֲרָגוֹ
  choice: उसे मार डाला
  rationale: הרג सामान्यतः मार डालने का सीधा अर्थ देता है; ‘हत्या की’ की अपेक्षा यह मूल क्रिया की व्यापकता को बनाए रखता है।
theological_decisions:
- issue: शेत के नाम की व्याख्या और शब्द-क्रीड़ा
  choice: परमेश्वर ने … मेरे लिए एक और संतान ठहरा दी है
  alternative: परमेश्वर ने … मेरे लिए एक और संतान दे दी है
  rationale: चुना हुआ रूप परमेश्वर को इस संतान की व्यवस्था करने वाला बताता है और שֵׁת/שָׁת की शब्द-क्रीड़ा से जुड़ी ‘रखने/ठहराने’ की धारणा बनाए रखता है। पाद-टिप्पणी मूल शब्द-क्रीड़ा स्पष्ट करती है।
- issue: यौन संबंध की इब्रानी शिष्टोक्ति
  choice: अपनी पत्नी के साथ सहवास किया
  alternative: अपनी पत्नी को जाना
  rationale: मूल में conventional euphemism है, लेकिन हिंदी में ‘पत्नी को जाना’ यौन अर्थ स्पष्ट रूप से व्यक्त नहीं करता और भ्रम पैदा कर सकता है। चुना गया रूप गरिमापूर्ण रहते हुए आशय संप्रेषित करता है।
- issue: हाबिल के स्थान पर दूसरी संतान का भाव
  choice: हाबिल के स्थान पर मेरे लिए एक और संतान
  alternative: हाबिल के बदले मुझे दूसरा वंशज
  rationale: ‘स्थान पर’ प्रतिस्थापन का कथन सुरक्षित रखता है, पर यह अतिरिक्त दावा नहीं करता कि नई संतान का व्यक्तित्व हाबिल के समान या उसका पुनर्जन्म है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। यौन संबंध के लिए अश्लीलता से रहित स्पष्ट शब्द चुना गया है। नाम इब्रानी उच्चारण के निकट देवनागरी में दिए गए हैं, और प्रतिस्थापन तथा दैवी व्यवस्था के बीच मूल पाठ का तनाव बिना अतिरिक्त सिद्धान्त जोड़े बनाए रखा गया है।
