base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/006.yaml
  text: Then Yahweh said to Cain[a], “Why are you angry, and why has your face fallen?”
translation:
  language: hi
  text: तब याहवे ने कैन से कहा, “तू क्यों क्रोधित है, और तेरा चेहरा क्यों उतर गया है[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा मुख उदास क्यों है?” इब्रानी में शाब्दिक रूप से, “तेरा चेहरा क्यों गिर गया है?”
    reason: मूल इब्रानी रूपक का शाब्दिक रूप और उसका सहज अर्थ दोनों बताने के लिए।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: קָיִן
  choice: कैन
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: חָרָה לָךְ
  choice: तू क्यों क्रोधित है
  rationale: इब्रानी मुहावरे में जलने का भाव है, पर यहाँ उसका स्पष्ट अर्थ क्रोध करना है; हिन्दी में यह चयन अर्थ को सहज और गरिमापूर्ण ढंग से देता है।
- source_word: נָפְלוּ פָנֶיךָ
  choice: तेरा चेहरा क्यों उतर गया है
  rationale: यह इब्रानी के ‘तेरा चेहरा गिर गया’ रूपक को स्वाभाविक हिन्दी मुहावरे में सुरक्षित रखता है और उदासी या खिन्नता का भाव व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है; ‘याहवे’ उसे किसी उपाधि से बदले बिना प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में एकवचन ‘तू’ मूल के निकट है और प्रसंग में परमेश्वर द्वारा कैन से सीधे प्रश्न करने को स्वाभाविक रूप से व्यक्त करता है। ‘चेहरा उतर गया’ वर्तमान हिन्दी का सुबोध मुहावरा है।
