source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣ה עָשִׂ֑יתָ ק֚וֹל דְּמֵ֣י אָחִ֔י/ךָ צֹעֲקִ֥ים אֵלַ֖/י מִן הָֽ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/010.yaml
  text: And he said[a], “What have you done? The voice of your brother’s blood is crying out to me from the ground.”
translation:
  language: hi
  text: तब उसने कहा, “तुमने यह क्या किया? तुम्हारे भाई के लहू[a] की आवाज़ भूमि से मेरी ओर पुकार रही है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘लहू’ का बहुवचन है। यह रूप प्रायः रक्तपात के संदर्भ में प्रयुक्त होता है; हिन्दी में सामान्यतः एकवचन ‘लहू’ कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम को दिखाता है, जबकि कर्ता को मूल की तरह सर्वनाम से व्यक्त किया गया है।
- source_word: מֶה עָשִׂיתָ
  choice: तुमने यह क्या किया?
  rationale: यह सीधा आरोपात्मक प्रश्न है। ‘यह क्या किया’ पूर्ण हो चुके कार्य और उसके वर्तमान नैतिक भार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קוֹל
  choice: आवाज़
  rationale: यहाँ लहू का मानवीकरण किया गया है; ‘आवाज़’ उस सजीव चित्र को ‘ध्वनि’ की अपेक्षा बेहतर बनाए रखती है।
- source_word: דְּמֵי
  choice: लहू
  rationale: इब्रानी में बहुवचन रूप है, जो रक्तपात के संदर्भ में प्रयुक्त होता है। हिन्दी में ‘लहू’ स्वाभाविक समूहवाचक रूप है और पद की गंभीरता बनाए रखता है।
- source_word: אָחִיךָ
  choice: तुम्हारे भाई के
  rationale: इब्रानी संबंधवाचक रचना का स्वाभाविक हिन्दी रूप।
- source_word: צֹעֲקִים
  choice: पुकार रही है
  rationale: इब्रानी कृदंत निरंतर पुकार का भाव देता है। हिन्दी में क्रिया का एकवचन ‘आवाज़’ के साथ स्वाभाविक सामंजस्य रखता है।
- source_word: אֵלַי
  choice: मेरी ओर
  rationale: पुकार के परमेश्वर तक पहुँचने की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִן הָאֲדָמָה
  choice: भूमि से
  rationale: कैन के प्रसंग में אֲדָמָה मिट्टी अथवा भूमि को सूचित करता है; ‘भूमि’ प्रसंग की धरती-संबंधी छवि और गरिमामय शैली दोनों बनाए रखती है।
theological_decisions:
- issue: हाबिल के बहाए गए लहू का मानवीकरण
  choice: लहू की आवाज़ को परमेश्वर की ओर पुकारते हुए ही प्रस्तुत किया गया है।
  alternative: इसे अमूर्त रूप में रक्तदोष द्वारा न्याय की माँग के अर्थ में अनूदित करना।
  rationale: मूल इब्रानी सजीव मानवीकरण करता है। उसी चित्र को बनाए रखने से नैतिक और धर्मवैज्ञानिक बल सुरक्षित रहता है और किसी संकुचित व्याख्या को पाठ में नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गंभीर और प्रत्यक्ष शैली रखी गई है। एक व्यक्ति को संबोधित करने के लिए ‘तुम’ चुना गया है, जो आज की हिन्दी में स्पष्ट और स्वाभाविक है तथा अनावश्यक सामाजिक या धार्मिक स्तरभेद नहीं जोड़ता।
