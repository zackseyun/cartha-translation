base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/018.yaml
  text: To Hanok was born Irad[a], and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.
translation:
  language: hi
  text: हनोक के यहाँ ईराद उत्पन्न हुआ, और ईराद महूयाएल[a] का पिता हुआ; महूयाएल मतूशाएल का पिता हुआ, और मतूशाएल लेमेक का पिता हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद के इब्रानी पाठ में एक ही नाम की दो वर्तनियाँ हैं: महूयाएल और महीयाएल।'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּוָּלֵד לַחֲנוֹךְ
  choice: हनोक से ईराद उत्पन्न हुआ
  rationale: निफ़अल रूप की निष्क्रियता को बनाए रखते हुए हिन्दी में स्वाभाविक वंशावली-वाक्य बनाया गया है। ל उपसर्ग उस पिता को सूचित करता है जिससे पुत्र उत्पन्न हुआ।
- source_word: עִירָד
  choice: ईराद
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण।
- source_word: יָלַד
  choice: जन्म दिया
  rationale: वंशावली में क़ाल क्रिया पिता द्वारा संतान उत्पन्न करने का भाव देती है। ‘जन्म दिया’ सरल आधुनिक हिन्दी है; संदर्भ स्पष्ट करता है कि कर्ता पुरुष है।
- source_word: מְחוּיָאֵל / מְחִיּיָאֵל
  choice: महूयाएल
  rationale: पद में एक ही नाम की दो इब्रानी वर्तनियाँ हैं। मुख्य पाठ में पठनीयता हेतु एक रूप रखा गया और अंतर पादटिप्पणी में बताया गया।
- source_word: מְתוּשָׁאֵל
  choice: मतूशाएल
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: לָמֶךְ
  choice: लेमेक
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
theological_decisions: []
