  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। नाम मूल इब्रानी के निकट लिप्यंतरित किए गए हैं और वंशावली की क्रमिक संरचना सुरक्षित रखी गई है। पादटिप्पणी-चिह्न पूरे पद से संबंधित पाठगत सूचना के लिए अंत में रखा गया है।
