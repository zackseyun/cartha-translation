source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל הֶ֣בֶל אָחִ֑י/ו וַֽ/יְהִי֙ בִּ/הְיוֹתָ֣/ם בַּ/שָּׂדֶ֔ה וַ/יָּ֥קָם קַ֛יִן אֶל הֶ֥בֶל אָחִ֖י/ו וַ/יַּהַרְגֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/008.yaml
  text: And Cain said to Abel his brother. Then[a], while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: hi
  text: कैन ने अपने भाई हाबिल से कहा[a]। फिर, जब वे मैदान में थे, कैन अपने भाई हाबिल के विरुद्ध उठ खड़ा हुआ और उसने उसे मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू मसोरेटिक पाठ में केवल इतना है, “कैन ने अपने भाई हाबिल से कहा,” पर यह नहीं बताया गया कि उसने क्या कहा। सेप्टुआजेंट, सामरी पंचग्रंथ और वुल्गेट जैसे प्राचीन पाठ-साक्षियों में इसके बाद ये शब्द मिलते हैं: “चलो, हम मैदान में चलें।”'
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: कैन ने ... कहा
  rationale: אמר का सामान्य अर्थ ‘कहना’ है। मसोराई पाठ में कथन की विषय-वस्तु नहीं दी गई है, इसलिए उसकी अचानक समाप्ति को मुख्य पाठ में बनाए रखा गया है।
- source_word: אֶל
  choice: से
  rationale: हिन्दी में ‘किसी से कहना’ स्वाभाविक प्रयोग है और हिब्रू में कथन के अभिमुख व्यक्ति को सूचित करने वाले אֶל का अर्थ ठीक से देता है।
- source_word: אָחִיו
  choice: अपने भाई
  rationale: संबंधसूचक प्रत्यय का स्पष्ट अनुवाद है। पद में इसकी पुनरावृत्ति भ्रातृहत्या की गंभीरता पर कथाकार के बल को सुरक्षित रखती है।
- source_word: וַיְהִי בִּהְיוֹתָם
  choice: फिर, जब वे ... थे
  rationale: यह कथात्मक काल-सूचक रचना है। यह हिन्दी में सहज है और घटना की अगली अवस्था को व्यक्त करती है।
- source_word: בַּשָּׂדֶה
  choice: मैदान में
  rationale: שָׂדֶה का अर्थ खेत, मैदान या खुला इलाका हो सकता है। यहाँ ‘मैदान’ स्थल को अनावश्यक रूप से खेती के खेत तक सीमित नहीं करता और प्राचीन पाठ-साक्षियों में संरक्षित कथन से भी मेल खाता है।
- source_word: וַיָּקָם ... אֶל
  choice: के विरुद्ध उठ खड़ा हुआ
  rationale: यह हिब्रू मुहावरे की ‘उठने’ वाली छवि और उसके विरोधी भाव दोनों को बचाता है; केवल ‘हमला किया’ कहने की अपेक्षा स्रोत-रूप के अधिक निकट है।
- source_word: וַיַּהַרְגֵהוּ
  choice: उसे मार डाला
  rationale: הרג का सीधा अर्थ मार डालना है। ‘हत्या की’ कहने पर वह कानूनी या नैतिक वर्गीकरण अधिक स्पष्ट हो जाता जो इस क्रिया में स्वयं व्यक्त नहीं है।
theological_decisions:
- issue: क्या कैन के वे कथित शब्द मुख्य पाठ में जोड़े जाएँ जो मसोराई पाठ में नहीं हैं
  choice: मसोराई पाठ का छोटा और अचानक समाप्त होने वाला वाक्य मुख्य पाठ में रखा गया है, और प्राचीन पाठ-साक्षियों के लंबे पाठ को पादटिप्पणी में दिया गया है।
  alternative: मुख्य पाठ में “चलो, हम मैदान में चलें” जोड़ना।
  rationale: प्रदत्त WLC स्रोत में कथन के शब्द अनुपस्थित हैं। सेप्टुआजेंट, सामरी पंचग्रंथ और वुल्गेट जैसे प्राचीन साक्षी लंबे पाठ का समर्थन करते हैं, इसलिए उसे छिपाया नहीं गया; पर मूल-भाषा के निर्दिष्ट पाठ को चुपचाप पूरा भी नहीं किया गया। यह पाठालोचनात्मक प्रश्न है, कोई संप्रदायगत सिद्धांत नहीं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘अपने भाई’ की दोनों आवृत्तियाँ जानबूझकर सुरक्षित हैं। मुख्य पाठ में मसोराई पाठ की असामान्य अपूर्णता बनी रहती है, जबकि पादटिप्पणी प्रमुख प्राचीन वैकल्पिक पाठ को पारदर्शी ढंग से दर्ज करती है।
