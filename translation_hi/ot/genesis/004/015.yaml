source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה לָ/כֵן֙ כָּל הֹרֵ֣ג קַ֔יִן שִׁבְעָתַ֖יִם יֻקָּ֑ם וַ/יָּ֨שֶׂם יְהוָ֤ה לְ/קַ֨יִן֙ א֔וֹת לְ/בִלְתִּ֥י הַכּוֹת אֹת֖/וֹ כָּל מֹצְאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/015.yaml
  text: Then Yahweh said to him[a], “Therefore whoever kills Cain, vengeance will be taken on him sevenfold.” And Yahweh put a mark on Cain[b], lest anyone finding him should strike him.
translation:
  language: hi
  text: तब यहोवा ने उससे कहा, “इसी कारण जो कोई कैन को मार डालेगा, उससे सात गुना बदला लिया जाएगा।” और यहोवा ने कैन के लिए एक चिह्न ठहराया[a], ताकि जो कोई कैन को पाए, वह उस पर प्रहार न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक निशान दिया।” इब्रानी शब्द का अर्थ व्यापक रूप से “चिह्न” या “संकेत” हो सकता है; पाठ यह नहीं बताता कि वह कैसा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप रखते हुए परमेश्वर के व्यक्तिगत नाम को सामान्य उपाधि से अलग रखा गया है।
- source_word: לָכֵן
  choice: इसी कारण
  rationale: यह परमेश्वर के उत्तर का निष्कर्षसूचक बल स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כָּל הֹרֵג קַיִן
  choice: जो कोई कैन को मार डालेगा
  rationale: यह अनिश्चित और सार्वभौमिक अर्थ को व्यक्त करता है; इस प्रसंग में ‘मार डालना’ हत्या के आशय को स्पष्ट करता है।
- source_word: שִׁבְעָתַיִם יֻקָּם
  choice: उससे सात गुना बदला लिया जाएगा
  rationale: निष्क्रिय क्रिया में प्रतिशोध लेने वाला अनकहा रहता है, जबकि हिन्दी वाक्य स्पष्ट करता है कि दण्ड कैन के हत्यारे पर आएगा।
- source_word: אוֹת
  choice: चिह्न
  rationale: यह शब्द किसी संकेत या पहचानसूचक निशान को दर्शा सकता है; ‘चिह्न’ उसके स्वरूप को अनिर्धारित रखता है।
- source_word: לְבִלְתִּי הַכּוֹת אֹתוֹ כָּל מֹצְאוֹ
  choice: ताकि जो कोई उसे पाए, वह उस पर प्रहार न करे
  rationale: यह नकारात्मक उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है और נכה का व्यापक अर्थ ‘प्रहार करना’ बनाए रखता है।
theological_decisions:
- issue: कैन के लिए ठहराए गए चिह्न का स्वरूप
  choice: ‘चिह्न’ कहा गया है, पर उसका भौतिक या प्रतीकात्मक स्वरूप निर्धारित नहीं किया गया।
  alternative: ‘निशान’ या किसी विशिष्ट प्रकार का चिह्न
  rationale: इब्रानी पाठ אוֹת का रूप या प्रकृति नहीं बताता; इसलिए बाद की अटकलें अनुवाद में नहीं जोड़ी गईं।
- issue: सात गुना बदला किससे लिया जाएगा
  choice: कैन को मार डालने वाले से बदला लिया जाएगा।
  alternative: अधिक शाब्दिक किन्तु हिन्दी में संदिग्ध ‘उसका सात गुना बदला लिया जाएगा’
  rationale: सन्दर्भ कैन की हत्या के विरुद्ध चेतावनी है। यह रूप निष्क्रियता को रखते हुए दण्ड पाने वाले की पहचान स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यहोवा’ व्यक्तिगत दिव्य नाम को सुरक्षित रखता है; ‘प्रहार’ मूल क्रिया की व्यापकता बनाए रखता है।
