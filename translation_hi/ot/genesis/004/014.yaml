source:
  edition: WLC
  text: הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜/י הַ/יּ֗וֹם מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה וּ/מִ/פָּנֶ֖י/ךָ אֶסָּתֵ֑ר וְ/הָיִ֜יתִי נָ֤ע וָ/נָד֙ בָּ/אָ֔רֶץ וְ/הָיָ֥ה כָל מֹצְאִ֖/י יַֽהַרְגֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/014.yaml
  text: Look[a], today you have driven me away from the face of the ground, and I will be hidden from your face. I will be a wanderer and a fugitive on the earth[b], and whoever finds me will kill me.
translation:
  language: hi
  text: देख, आज तूने मुझे भूमि की सतह से निकाल दिया है, और मैं तेरी दृष्टि से छिपा रहूँगा[a]। मैं पृथ्वी[b] पर भटकता और दर-दर फिरता रहूँगा, और जो कोई मुझे पाएगा, वह मुझे मार डालेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं तेरी उपस्थिति से छिप जाऊँगा” अथवा “मैं तेरी उपस्थिति से छिपा रहूँगा।” इब्रानी में शाब्दिक रूप से “तेरे मुख/सामने से” है।
    reason: lexical_alternative
  - marker: b
    text: या “देश में” अथवा “भूमि में।” इब्रानी אֶרֶץ का अर्थ संदर्भ के अनुसार “पृथ्वी,” “देश” या “भूमि” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देख
  rationale: यह अव्यय कथन पर बल देता और ध्यान खींचता है। आधुनिक हिन्दी में “देख” इसकी तात्कालिकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גֵּרַשְׁתָּ אֹתִי
  choice: तूने मुझे ... निकाल दिया है
  rationale: גרשׁ बलपूर्वक निकालने या दूर कर देने का भाव रखता है। संदर्भ में “निकाल दिया” स्पष्ट, स्वाभाविक और पर्याप्त रूप से सशक्त है।
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: भूमि की सतह से
  rationale: शाब्दिक बिंब “भूमि के मुख पर से” है। हिन्दी में “भूमि की सतह से” उस स्थानगत अर्थ को स्वाभाविक ढंग से रखता है और उत्पत्ति 4 में खेती की भूमि से कैन के संबंध को बनाए रखता है।
- source_word: וּמִפָּנֶיךָ אֶסָּתֵר
  choice: मैं तेरे मुख से छिपा रहूँगा
  rationale: निफ़अल रूप निष्क्रिय अथवा आत्मवाचक अर्थ दे सकता है। “तेरे मुख से” मूल इब्रानी बिंब को बचाता है, जबकि “छिपा रहूँगा” अलगाव की जारी अवस्था को व्यक्त करता है।
- source_word: נָע וָנָד
  choice: भटकता और मारा-मारा फिरता
  rationale: दोनों निकटार्थी शब्द अस्थिर, विस्थापित और ठिकानारहित जीवन पर संयुक्त बल देते हैं। यह हिन्दी अभिव्यक्ति दोनों पदों की तीव्रता को स्वाभाविक रूप से व्यक्त करती है।
- source_word: בָּאָרֶץ
  choice: पृथ्वी पर
  rationale: אֶרֶץ का अर्थ “पृथ्वी” या “देश/भूमि” हो सकता है। आदिकालीन कथा के व्यापक परिप्रेक्ष्य में “पृथ्वी” उपयुक्त है; क्षेत्रीय अर्थ की संभावना पादटिप्पणी में रखी गई है।
- source_word: כָל מֹצְאִי
  choice: जो कोई मुझे पाएगा
  rationale: כָל के साथ कृदंत अनिश्चित सार्वत्रिक अर्थ देता है। “जो कोई” आधुनिक हिन्दी में उसी खुले और व्यापक आशय को व्यक्त करता है।
- source_word: יַהַרְגֵנִי
  choice: मुझे मार डालेगा
  rationale: הרג सामान्यतः जान से मारने को व्यक्त करता है। “मार डालेगा” आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: וּמִפָּנֶיךָ אֶסָּתֵר में परमेश्वर की उपस्थिति से संबंधित मुहावरे का अनुवाद
  choice: मैं तेरे मुख से छिपा रहूँगा
  alternative: मैं तेरी उपस्थिति से छिप जाऊँगा / मैं तेरी उपस्थिति से छिपा रहूँगा
  rationale: मूल पाठ ठोस अभिव्यक्ति “तेरे मुख से” का उपयोग करता है। इसे बनाए रखने से परमेश्वर से संबंध-विच्छेद का भार बना रहता है और निष्क्रिय तथा आत्मवाचक अर्थों के बीच की वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। परमेश्वर के लिए एकवचन निकट संबोधन “तू/तेरे” मूल इब्रानी के एकवचन संबोधन और बाइबिलीय संवाद की सीधाई को दर्शाता है। “भूमि की सतह” शाब्दिक “भूमि के मुख” की अपेक्षा अधिक स्वाभाविक हिन्दी है, जबकि अगले वाक्य में “तेरे मुख” का धर्मवैचारिक और संबंधपरक बिंब जानबूझकर सुरक्षित रखा गया है।
