source:
  edition: WLC
  text: וְ/הֶ֨בֶל הֵבִ֥יא גַם ה֛וּא מִ/בְּכֹר֥וֹת צֹאנ֖/וֹ וּ/מֵֽ/חֶלְבֵ/הֶ֑ן וַ/יִּ֣שַׁע יְהוָ֔ה אֶל הֶ֖בֶל וְ/אֶל מִנְחָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/004.yaml
  text: And Abel also brought some of the firstborn of his flock[a], and of their fat portions. And Yahweh regarded Abel and his offering[b],
translation:
  language: hi
  text: और हाबिल भी अपने झुंड के पहले जन्मे पशुओं में से कुछ और उनकी चर्बी के भाग[a] लाया। याहवे ने हाबिल और उसकी भेंट पर कृपादृष्टि की[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘उनकी चर्बी में से।’ सम्भवतः आशय बलि के लिए चढ़ाए जाने वाले पशुओं के उत्तम चर्बी वाले भागों से है।
    reason: cultural_note
  - marker: b
    text: या, ‘हाबिल और उसकी भेंट की ओर अनुकूल दृष्टि से देखा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶבֶל
  choice: और हाबिल
  rationale: वְ सामान्य कथात्मक संयोजक है; ‘और’ इब्रानी कथाक्रम को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הֵבִיא גַם הוּא
  choice: भी ... लाया
  rationale: गַם הוּא इस बात पर बल देता है कि कैन की तरह हाबिल भी भेंट लाया; हिन्दी में ‘भी’ इस बल को सहज रूप से व्यक्त करता है।
- source_word: מִבְּכֹרוֹת צֹאנוֹ
  choice: अपनी भेड़-बकरियों के झुंड के पहलौठों में से कुछ
  rationale: מִן अंशवाचक है, इसलिए ‘में से कुछ’ यह संकेत देता है कि हाबिल ने पहलौठे पशुओं में से चढ़ाया, न कि अनिवार्यतः सभी को। צֹאן को छोटे पालतू पशुओं के सामूहिक अर्थ में ‘भेड़-बकरियों का झुंड’ कहा गया है।
- source_word: וּמֵחֶלְבֵהֶן
  choice: और उनकी चर्बी के भाग
  rationale: חֵלֶב का मूल अर्थ चर्बी है और बलिदान के प्रसंग में यह विशेष चर्बी वाले भागों को सूचित कर सकता है। अनुवाद मूर्त अर्थ को बनाए रखता है; सांस्कृतिक आशय पादटिप्पणी में दिया गया है।
- source_word: וַיִּשַׁע
  choice: कृपादृष्टि की
  rationale: क्रिया का अर्थ किसी की ओर ध्यान देना या दृष्टि करना है और इस प्रसंग में अनुकूल स्वीकृति निहित है। ‘कृपादृष्टि की’ सकारात्मक प्रतिक्रिया व्यक्त करती है, पर उसके प्रकट होने का ढंग नहीं बताती।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में उसका लिप्यंतरण किया गया है।
- source_word: מִנְחָתוֹ
  choice: उसकी भेंट
  rationale: מִנְחָה उपहार, अर्पण या भेंट को सूचित कर सकता है; आराधना के इस प्रसंग में ‘भेंट’ स्वाभाविक और पर्याप्त व्यापक है।
theological_decisions:
- issue: וַיִּשַׁע में परमेश्वर की प्रतिक्रिया का स्वरूप
  choice: याहवे ने हाबिल और उसकी भेंट पर कृपादृष्टि की
  alternative: याहवे ने हाबिल और उसकी भेंट की ओर ध्यान दिया
  rationale: इब्रानी क्रिया इस संदर्भ में अनुकूल दृष्टि या स्वीकृति की ओर संकेत करती है, लेकिन यह नहीं बताती कि वह प्रतिक्रिया किस प्रकार प्रकट हुई। अनुवाद सकारात्मक भाव रखता है, पर किसी चिह्न, अग्नि या अन्य तंत्र को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘पहलौठों’ और ‘कृपादृष्टि’ जैसे परिचित बाइबिलीय शब्द अर्थ की सटीकता के लिए रखे गए हैं; कठिन सांस्कृतिक विवरण पादटिप्पणी में स्पष्ट किया गया है।
