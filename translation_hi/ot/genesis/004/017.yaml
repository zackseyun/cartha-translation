  text: וַ/יֵּ֤דַע קַ֨יִן֙ אֶת אִשְׁתּ֔/וֹ וַ/תַּ֖הַר וַ/תֵּ֣לֶד אֶת חֲנ֑וֹךְ וַֽ/יְהִי֙ בֹּ֣נֶה עִ֔יר וַ/יִּקְרָא֙ שֵׁ֣ם הָ/עִ֔יר כְּ/שֵׁ֖ם בְּנ֥/וֹ חֲנֽוֹךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/017.yaml
  text: Cain knew his wife[a], and she conceived and bore Enoch. He was building a city[d][c][b], and he named the city after his son Enoch.
translation:
  language: hi
  text: कैन ने अपनी पत्नी के साथ संबंध बनाए[a]। वह गर्भवती हुई और उसने हनोक को जन्म दिया। कैन एक नगर बना रहा था[b], और उसने उस नगर का नाम अपने पुत्र हनोक के नाम पर रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘कैन ने अपनी पत्नी को जाना’ है; यह यौन संबंध के लिए प्रयुक्त एक सामान्य मुहावरा है।
    reason: cultural_note
  - marker: b
    text: 'इब्रानी रचना जारी क्रिया का संकेत दे सकती है: ‘एक नगर बना रहा था’; इसका अनुवाद ‘उसने एक नगर बनाया’ भी किया जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: से संबंध बनाए
  rationale: यָדַע का शाब्दिक अर्थ ‘जानना’ है, पर यहाँ यह यौन संबंध का प्रचलित इब्रानी मुहावरा है। हिन्दी में ‘पत्नी को जाना’ अर्थ स्पष्ट नहीं करता, इसलिए स्वाभाविक और मर्यादित मुहावरे का प्रयोग किया गया है।
- source_word: אִשְׁתּוֹ
  choice: अपनी पत्नी
  rationale: संज्ञा का अर्थ ‘स्त्री/पत्नी’ हो सकता है; संबंधसूचक प्रत्यय और प्रसंग के कारण ‘अपनी पत्नी’ स्वाभाविक है।
- source_word: וַתַּהַר
  choice: गर्भवती हुई
  rationale: यह गर्भधारण करने के लिए सामान्य इब्रानी क्रिया है; आधुनिक हिन्दी में यह स्पष्ट और सहज है।
- source_word: וַתֵּלֶד אֶת חֲנוֹךְ
  choice: उसने हनोक को जन्म दिया
  rationale: יָלַד का यहाँ अर्थ ‘जन्म देना’ है। नाम חֲנוֹךְ का हिन्दी बाइबलीय रूप ‘हनोक’ रखा गया है।
- source_word: וַיְהִי בֹּנֶה עִיר
  choice: एक नगर बना रहा था
  rationale: היה के साथ कृदन्त בֹּנֶה जारी या प्रगतिशील क्रिया का संकेत देता है; इसलिए पूर्ण क्रिया ‘बनाया’ के बजाय ‘बना रहा था’ रखा गया है।
- source_word: וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ
  choice: उस नगर का नाम अपने पुत्र हनोक के नाम पर रखा
  rationale: इब्रानी में शाब्दिक रूप से ‘नगर का नाम अपने पुत्र के नाम के अनुसार पुकारा’ है। हिन्दी का यह मुहावरा अर्थ को ठीक और स्वाभाविक ढंग से व्यक्त करता है।
