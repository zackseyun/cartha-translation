  register: आधुनिक मानक हिन्दी में सहज, स्पष्ट और गरिमापूर्ण कथा-शैली रखी गई है। इब्रानी यौन मुहावरे को मुख्य पाठ में अर्थानुसार तथा पादटिप्पणी में उसके शाब्दिक रूप सहित दिया गया है। नगर-निर्माण की प्रगतिशील पक्षवाचकता सुरक्षित रखी गई है।
