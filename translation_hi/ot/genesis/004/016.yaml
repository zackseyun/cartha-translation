  choice: यहोवा के सामने से निकल गया
  alternative: यहोवा की उपस्थिति से चला गया
  rationale: ‘के सामने से’ मूल इब्रानी मुहावरे के अधिक निकट है और परमेश्वर से कैन के अलगाव की कथात्मक-धर्मवैज्ञानिक उलझन को किसी व्याख्यात्मक निष्कर्ष द्वारा हल नहीं करता।
