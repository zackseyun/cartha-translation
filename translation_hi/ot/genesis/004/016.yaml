  choice: निकल गया
  rationale: यह क्रिया बाहर जाने का ठोस भाव व्यक्त करती है और प्रसंग में स्वाभाविक हिन्दी है।
- source_word: מִלִּפְנֵי
  choice: के सामने से
  rationale: इब्रानी मुहावरे के शाब्दिक स्थानिक-संबंधपरक भाव को बनाए रखता है और इसे केवल सामान्य अनुपस्थिति के अर्थ में सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम के प्रचलित हिन्दी लिप्यंतरण का प्रयोग किया गया है, न कि उसके स्थान पर कोई उपाधि।
- source_word: וַיֵּשֶׁב
  choice: बस गया
  rationale: यहाँ क्रिया किसी स्थान में निवास स्थापित करने का अर्थ देती है; ‘बस गया’ आधुनिक हिन्दी में सहज है।
- source_word: בְּאֶרֶץ נוֹד
  choice: नोद देश में
  rationale: नोद यहाँ स्थान-नाम है, इसलिए उसका लिप्यंतरण किया गया है; ‘भटकना’ से संभावित शब्द-साम्य पादटिप्पणी में रखा गया है।
- source_word: קִדְמַת עֵדֶן
  choice: अदन के पूर्व में
  rationale: यह अदन के सापेक्ष पूर्व दिशा को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: עֵדֶן
  choice: अदन
  rationale: इस स्थान-नाम के लिए प्रचलित हिन्दी बाइबलीय रूप अपनाया गया है।
theological_decisions:
