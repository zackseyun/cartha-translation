  text: וַ/יִּֽקַּֽח ל֥/וֹ לֶ֖מֶךְ שְׁתֵּ֣י נָשִׁ֑ים שֵׁ֤ם הָֽ/אַחַת֙ עָדָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית צִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/019.yaml
  text: Lamech took for himself two wives[a]. The name of the one was Adah[b], and the name of the other was Zillah.
translation:
  language: hi
  text: लेमेक ने अपने लिए दो पत्नियाँ लीं। एक का नाम आदा था और दूसरी का नाम सिल्ला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लीं
  rationale: לקח का मूल अर्थ ‘लेना’ है; ‘अपने लिए दो पत्नियाँ’ के साथ वैवाहिक आशय स्पष्ट रहता है और इब्रानी अभिव्यक्ति भी सुरक्षित रहती है।
- source_word: לוֹ
  choice: अपने लिए
  rationale: यह रूप व्यक्तिगत हित तथा आत्मवाचक भाव प्रकट करता है।
- source_word: שְׁתֵּי נָשִׁים
  choice: दो पत्नियाँ
  rationale: נָשִׁים का अर्थ ‘स्त्रियाँ’ या ‘पत्नियाँ’ हो सकता है, पर לקח और इस प्रसंग में वैवाहिक अर्थ स्पष्ट है।
- source_word: שֵׁם הָאַחַת
  choice: एक का नाम
  rationale: यह इब्रानी नामकरण-सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עָדָה
  choice: आदा
  rationale: व्यक्तिनाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: और दूसरी का नाम
  rationale: הַשֵּׁנִית का शाब्दिक अर्थ ‘दूसरी’ है; दो व्यक्तियों के संदर्भ में यह हिन्दी में स्वाभाविक भी है।
- source_word: צִלָּה
  choice: सिल्ला
  rationale: आरम्भिक צ को ‘स’ और द्वित्वित לּ को ‘ल्ल’ से दर्शाते हुए व्यक्तिनाम का स्रोत-सन्निकट देवनागरी लिप्यंतरण।
theological_decisions:
- issue: क्या बहुपत्नी वैवाहिक व्यवस्था को स्पष्ट और नैतिक टिप्पणी सहित प्रस्तुत किया जाए
  choice: ‘दो पत्नियाँ’ कहकर वैवाहिक तथ्य स्पष्ट किया गया, पर कोई नैतिक टिप्पणी नहीं जोड़ी गई।
  alternative: ‘दो स्त्रियाँ’ अथवा मूल्यांकनात्मक भाषा जोड़ना
  rationale: पद लेमेक की दो पत्नियों का तथ्य बताता है, पर इसी पद में उस कृत्य का नैतिक मूल्यांकन नहीं करता; अनुवाद को वही तनाव बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और स्रोत के निकट। ‘अपने लिए ... लीं’ इब्रानी संरचना को बनाए रखता है, जबकि ‘एक ... दूसरी’ हिन्दी में सहज समानांतरता देता है।
