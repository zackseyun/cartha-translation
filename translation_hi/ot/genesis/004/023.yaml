base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/023.yaml
  text: 'And Lamech said to his wives[a], “Adah and Zillah, hear my voice; wives of Lamech, listen to my word: for I have killed a man for wounding me[b], even a young man for striking me.”'
translation:
  language: hi
  text: 'और लेमेक ने अपनी पत्नियों से कहा,


    “आदा और सिल्ला, मेरी आवाज़ सुनो;

    लेमेक की पत्नियो, मेरी बात पर कान दो।

    क्योंकि मैंने एक पुरुष को मुझे घायल करने पर मार डाला,

    और एक युवक को मुझे चोट पहुँचाने पर मार डाला।[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “मैंने अपने घाव के लिए एक पुरुष को, और अपनी चोट के लिए एक युवक को मार डाला।” इब्रानी में ‘घाव’ और ‘चोट’ संज्ञाएँ हैं।
    reason: lexical_alternative
  - marker: b
    text: 'कुछ लोग लेमेक के शब्दों को किसी वास्तविक हत्या की सूचना के बजाय धमकी या सामान्य डींग के रूप में समझते हैं: “जो मुझे घायल करे, मैं उस पुरुष को मार डालूँगा ...।”'
    reason: alternative_reading
lexical_decisions:
- source_word: לְנָשָׁיו
  choice: अपनी पत्नियों से
  rationale: संदर्भ में बहुवचन संज्ञा और तृतीय पुरुष एकवचन प्रत्यय स्पष्ट रूप से लेमेक की पत्नियों को सूचित करते हैं; यह आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: שְׁמַעַן קוֹלִי
  choice: मेरी आवाज़ सुनो
  rationale: मूल के प्रत्यक्ष आदेश और ठोस संज्ञा ‘आवाज़’ को बनाए रखता है तथा काव्यात्मक समानांतरता के अनुकूल है।
- source_word: הַאְזֵנָּה אִמְרָתִי
  choice: मेरी बात पर कान लगाओ
  rationale: हिफ़ील क्रिया का ध्यानपूर्वक सुनने का भाव व्यक्त करता है और पहले आदेश की अपेक्षा कुछ अधिक आग्रहपूर्ण है; ‘मेरी बात’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह लेमेक के कथन की विषय-वस्तु या उसके कथन का आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: אִישׁ
  choice: एक पुरुष
  rationale: मूल का सामान्य अर्थ ‘पुरुष’ है; अगले अर्धपद के יֶלֶד के साथ आयु या स्थिति का अंतर भी बना रहता है।
- source_word: הָרַגְתִּי
  choice: मैंने ... मार डाला
  rationale: क़ातल रूप को सबसे सीधे ढंग से घटित कार्य की सूचना के रूप में प्रस्तुत करता है, बिना आत्मरक्षा या नैतिक औचित्य जोड़े।
- source_word: לְפִצְעִי
  choice: मुझे घायल करने पर
  rationale: לְ के साथ ‘मेरा घाव’ का शाब्दिक रूप हिन्दी में असहज हो सकता है; यह कारण या प्रतिशोध के अवसर का संभावित भाव स्वाभाविक रूप से व्यक्त करता है, जबकि संज्ञात्मक रूप पादटिप्पणी में दिया गया है।
- source_word: יֶלֶד
  choice: एक युवक
  rationale: यहाँ शब्द बालक, लड़के या युवा व्यक्ति को सूचित कर सकता है; ‘युवक’ אִישׁ के साथ समानांतरता में कम आयु का संकेत देता है, पर छोटे बच्चे का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לְחַבֻּרָתִי
  choice: मुझे चोट पहुँचाने पर
  rationale: חַבּוּרָה चोट, नील या घाव को सूचित करता है। यह कारण या अवसर का भाव सहज हिन्दी में देता है और पहले अर्धपद से हल्का शब्दगत अंतर बनाए रखता है।
theological_decisions:
- issue: लेमेक का कथन वास्तविक हत्या की सूचना है या धमकी/सामान्य डींग
  choice: मुख्य पाठ में इसे घटित हत्या की सूचना के रूप में रखा गया है।
  alternative: ‘जो मुझे घायल करे, मैं उस पुरुष को मार डालूँगा’ जैसे धमकीसूचक या सामान्य कथन के रूप में पढ़ना।
  rationale: इब्रानी क़ातल रूप का सबसे सीधा अर्थ बीते हुए कार्य की सूचना है, पर प्रसंग में धमकी या डींग की वैकल्पिक समझ संभव है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: प्रतिशोध बनाम आत्मरक्षा
  choice: ‘मुझे घायल करने पर ... मुझे चोट पहुँचाने पर’ कारण या अवसर बताता है, पर आत्मरक्षा का स्पष्ट दावा नहीं जोड़ता।
  alternative: ‘आत्मरक्षा में’ या ‘क्योंकि उसने पहले मुझ पर हमला किया’ जैसा स्पष्टीकरण।
  rationale: मूल पाठ हत्या का नैतिक औचित्य स्पष्ट नहीं करता; अतः उसके धार्मिक और नैतिक तनाव को अनसुलझा रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, मौखिक और काव्यात्मक रूप अपनाया गया है। संबोधन ‘पत्नियो’ में मानक सम्बोधन-बहुवचन रखा गया है। दो समानांतर पंक्तियों में दूसरी बार क्रिया को लोप करके मूल की संक्षिप्त काव्यात्मक संरचना सुरक्षित रखी गई है।
