  text: וְ/צִלָּ֣ה גַם הִ֗וא יָֽלְדָה֙ אֶת תּ֣וּבַל קַ֔יִן לֹטֵ֕שׁ כָּל חֹרֵ֥שׁ נְחֹ֖שֶׁת וּ/בַרְזֶ֑ל וַֽ/אֲח֥וֹת תּֽוּבַל קַ֖יִן נַֽעֲמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/022.yaml
  text: Zillah also bore Tubal-cain[a], a forger of every cutting tool of bronze and iron[b]. And the sister of Tubal-cain was Naamah.
translation:
  language: hi
  text: सिल्ला ने भी तूबल-कैन को जन्म दिया। वह काँसे और लोहे के हर प्रकार के धारदार औज़ार गढ़नेवाला था[a][b]। तूबल-कैन की बहन नामा थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह काँसे और लोहे के हर कारीगर को धार देनेवाला/हथौड़े से गढ़नेवाला था।” ‘तूबल-कैन’ के बाद का इब्रानी पदबंध कठिन है; कुछ लोग इसे धातु के औज़ारों के बजाय धातुकारीगरों से संबंधित समझते हैं।
    reason: alternative_reading
  - marker: b
    text: ‘काँसा’ का अनुवाद ‘ताँबा’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הִוא
  choice: ने भी
  rationale: यह पदबंध सिल्ला को वंशावली में एक और संतान जननेवाली पत्नी के रूप में जोड़ता है; हिन्दी में ‘ने भी’ इसका सहज योगात्मक भाव व्यक्त करता है।
- source_word: יָלְדָה
  choice: जन्म दिया
  rationale: वंशावली के प्रसंग में यह ילד का स्वाभाविक और स्पष्ट आधुनिक हिन्दी रूप है।
- source_word: תּוּבַל קַיִן
  choice: तूबल-कैन
  rationale: व्यक्तिवाचक नाम का अनुवाद न करके देवनागरी में लिप्यंतरण किया गया है और संयुक्त रूप को योजक-चिह्न से रखा गया है।
- source_word: לֹטֵשׁ
  choice: गढ़नेवाला
  rationale: कृदन्त में पीटने, धार देने या धातु गढ़ने का भाव हो सकता है; धातुओं के निकट प्रसंग में ‘गढ़नेवाला’ कारीगरी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל חֹרֵשׁ
  choice: हर प्रकार के धारदार औज़ार
  rationale: इब्रानी रचना कठिन है। यहाँ חֹרֵשׁ को धातु से बनाए या धार दिए जानेवाले उपकरण के अर्थ में लिया गया है; ‘हर प्रकार के’ כָּל की व्यापकता को सहज हिन्दी में बताता है। वैकल्पिक ‘कारीगर’ अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: यह शब्द ताँबे या काँसे को सूचित कर सकता है। प्राचीन धातुओं की सूची में ‘काँसा’ प्रचलित और प्रसंगानुकूल है; ‘ताँबा’ पादटिप्पणी में दिया गया है।
- source_word: בַרְזֶל
  choice: लोहा
  rationale: धातु के लिए मानक हिन्दी शब्द।
- source_word: אֲחוֹת
  choice: बहन
  rationale: संबंध-सूचक शब्द का सीधा और स्वाभाविक अनुवाद।
- source_word: נַעֲמָה
  choice: नामा
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
