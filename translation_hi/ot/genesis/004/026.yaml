source:
  edition: WLC
  text: וּ/לְ/שֵׁ֤ת גַּם הוּא֙ יֻלַּד בֵּ֔ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ אֱנ֑וֹשׁ אָ֣ז הוּחַ֔ל לִ/קְרֹ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/026.yaml
  text: And to Seth also a son was born[a], and he called his name Enosh[b]. At that time people began to call on the name of Yahweh.
translation:
  language: hi
  text: शेत के भी एक पुत्र उत्पन्न हुआ, और उसने उसका नाम एनोश रखा। उस समय लोग याहवे का नाम लेकर पुकारने लगे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “तब याहवे का नाम लेकर पुकारना आरम्भ किया गया।”'
    reason: lexical_alternative
  - marker: b
    text: 'एक अल्पमत व्याख्या में क्रिया का अर्थ “अपवित्र किया गया” समझा जाता है; तब वाक्य का अर्थ होगा: “उस समय लोग याहवे के नाम को अपवित्र करने लगे।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁת גַּם הוּא יֻלַּד בֵּן
  choice: शेत के भी एक पुत्र उत्पन्न हुआ
  rationale: यह अनुवाद शेत को अप्रत्यक्ष संबंध के रूप में रखता है, גַּם का अतिरिक्त भाव ‘भी’ से व्यक्त करता है और יֻלַּד के कर्मवाच्य को बनाए रखता है।
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ אֱנוֹשׁ
  choice: और उसने उसका नाम एनोश रखा
  rationale: हिब्रू मुहावरे ‘उसका नाम पुकारा’ का स्वाभाविक आधुनिक हिन्दी रूप ‘उसका नाम ... रखा’ है। אֱנוֹשׁ को व्यक्तिवाचक नाम के रूप में लिप्यंतरित किया गया है।
- source_word: אָז
  choice: उस समय
  rationale: यह कालसूचक अव्यय है; ‘उस समय’ उसके अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: הוּחַל
  choice: लगे
  rationale: होफ़ाल रूप के आरम्भसूचक अर्थ को हिन्दी में बहुवचन कर्ता ‘लोग’ के साथ स्वाभाविक ‘लगे’ द्वारा व्यक्त किया गया है। हिब्रू की अधिक शाब्दिक कर्मवाच्य रचना और विवादित ‘अपवित्र करना’ अर्थ पादटिप्पणियों में सुरक्षित हैं।
- source_word: לִקְרֹא בְּשֵׁם
  choice: नाम पुकारने
  rationale: यह हिब्रू पदबंध यहाँ सामान्यतः उपासना या विनती में नाम लेकर पुकारने को दर्शाता है। हिन्दी में ‘नाम पुकारना’ मूल बिंब और अर्थगत खुलापन दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: הוּחַל לִקְרֹא בְּשֵׁם יְהוָה का अर्थ
  choice: उस समय लोग याहवे का नाम पुकारने लगे
  alternative: तब याहवे के नाम को पुकारना आरम्भ किया गया; अथवा, तब लोग याहवे के नाम को अपवित्र करने लगे
  rationale: मुख्य पाठ प्रचलित आरम्भसूचक समझ को सहज हिन्दी में व्यक्त करता है, पर हिब्रू के अनिर्दिष्ट कर्ता को ‘लोग’ के रूप में स्पष्ट करने तथा הוּחַל को ‘अपवित्र किया गया’ समझने की अल्पमत व्याख्या—दोनों को पादटिप्पणियों में दर्ज करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वंशावली की संक्षिप्त शैली बनाए रखते हुए अस्वाभाविक शाब्दिकता से बचा गया है; विवादित अंतिम खंड की वास्तविक अर्थगत अनिश्चितता पादटिप्पणियों में सुरक्षित है।
