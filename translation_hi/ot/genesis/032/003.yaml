translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘छावनी’ से מַחֲנֶה का अर्थ तथा स्थान-नाम महनैम के साथ उसका शब्द-संबंध बना रहता है। पाद-टिप्पणी का चिह्न ‘महनैम’ के बाद रखा गया है, क्योंकि टिप्पणी उसी नाम के अर्थ और शब्द-क्रीड़ा को स्पष्ट करती है।
