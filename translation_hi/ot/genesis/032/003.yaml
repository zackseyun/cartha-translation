base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/003.yaml
  text: When Jacob saw them[a], he said, “This is God’s camp.” So he called the name of that place Mahanaim.
translation:
  language: hi
  text: जब याकूब ने उन्हें देखा, तो उसने कहा, “यह परमेश्वर की छावनी है।” इसलिए उसने उस स्थान का नाम महनैम[a] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“महनैम” नाम सुनने में “दो छावनियाँ” या “दोहरी छावनी” जैसा लगता है; यह याकूब के इन शब्दों की प्रतिध्वनि है: “यह परमेश्वर की छावनी है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: यह אָמַר का सामान्य कथात्मक रूप है। मूल पाठ में कथन का कोई श्रोता नहीं बताया गया, इसलिए ‘उसने कहा’ बिना अनावश्यक व्याख्या जोड़े अर्थ को सुरक्षित रखता है।
- source_word: כַּאֲשֶׁר רָאָם
  choice: जब याकूब ने उन्हें देखा
  rationale: כַּאֲשֶׁר यहाँ समयसूचक है और רָאָם का प्रत्यय पुल्लिंग बहुवचन है, जो पिछले पद में आए परमेश्वर के दूतों की ओर संकेत करता है। स्पष्ट और स्वाभाविक हिन्दी के लिए कर्ता ‘याकूब’ दोहराया गया है।
- source_word: מַחֲנֵה אֱלֹהִים
  choice: परमेश्वर की छावनी
  rationale: यह संबंधसूचक पदबंध शाब्दिक रूप से ‘परमेश्वर की छावनी’ है। ‘छावनी’ स्थान और वहाँ ठहरे समूह, दोनों की संगति बनाए रखती है और महनैम नाम के साथ शब्द-संबंध भी सुरक्षित करती है।
- source_word: זֶה
  choice: यह ... है
  rationale: संकेतवाचक शब्द यहाँ विधेयात्मक घोषणा में प्रयुक्त है; स्वाभाविक हिन्दी में सहायक क्रिया ‘है’ आवश्यक है।
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: उसने उस स्थान का नाम ... रखा
  rationale: हिब्रू मुहावरे ‘उसने उस स्थान का नाम पुकारा’ का स्वाभाविक आधुनिक हिन्दी समतुल्य ‘नाम रखा’ है।
- source_word: מַחֲנָיִם
  choice: महनैम
  rationale: स्थान-नाम को प्रचलित हिन्दी लिप्यंतरण में रखा गया है। उसके संभावित द्विवचन अर्थ और ‘छावनी’ से शब्द-संबंध को पाद-टिप्पणी में समझाया गया है।
