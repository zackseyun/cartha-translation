  text: וַ/יִּשְׁלַ֨ח יַעֲקֹ֤ב מַלְאָכִים֙ לְ/פָנָ֔י/ו אֶל עֵשָׂ֖ו אָחִ֑י/ו אַ֥רְצָ/ה שֵׂעִ֖יר שְׂדֵ֥ה אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/004.yaml
  text: Jacob sent messengers ahead of him to Esau his brother[a], to the land of Seir, the country of Edom.
translation:
  language: hi
  text: याकूब ने अपने आगे अपने भाई एसाव के पास, सेईर देश में, एदोम के प्रदेश में दूत भेजे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजे
  rationale: שלח का यह कथात्मक रूप बीते हुए साधारण कार्य को व्यक्त करता है; आधुनिक हिन्दी में ‘भेजे’ सहज और सटीक है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: शब्द का अर्थ स्वर्गदूत या मानवीय संदेशवाहक दोनों हो सकता है, पर यहाँ याकूब द्वारा एसाव के पास भेजे गए मनुष्य अभिप्रेत हैं; ‘दूत’ प्रसंगानुकूल और गरिमापूर्ण है।
- source_word: לְפָנָיו
  choice: अपने आगे
  rationale: शाब्दिक भाव ‘अपने मुख/उपस्थिति के आगे’ है; यहाँ इसका अर्थ याकूब के पहुँचने से पहले भेजना है। ‘अपने आगे’ इस स्थानिक और कालगत भाव को बनाए रखता है।
- source_word: עֵשָׂו אָחִיו
  choice: अपने भाई एसाव
  rationale: हिन्दी में संबंधसूचक पद को नाम से पहले रखना अधिक स्वाभाविक है और मूल के दोनों तत्वों को सुरक्षित रखता है।
- source_word: אַרְצָה שֵׂעִיר
  choice: सेईर देश में
  rationale: दिशासूचक प्रत्यय गति की ओर संकेत करता है। भेजने की क्रिया के साथ हिन्दी में ‘सेईर देश में’ गंतव्य को स्वाभाविक रूप से व्यक्त करता है और ‘देश’ को स्पष्ट रखता है।
- source_word: שְׂדֵה אֱדֹם
  choice: एदोम के प्रदेश
  rationale: शाब्दिक रूप ‘एदोम का मैदान/खेत’ है, किंतु यहाँ यह किसी कृषि-क्षेत्र के बजाय भौगोलिक भूभाग का नाम है; ‘प्रदेश’ उस क्षेत्रीय अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions: []
