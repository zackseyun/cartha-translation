  register: आधुनिक मानक हिन्दी का सहज, कथात्मक और गरिमापूर्ण रूप अपनाया गया है। मूल वाक्य की लंबी गंतव्य-श्रृंखला को हिन्दी में स्पष्टता के लिए दो वाक्यों में बाँटा गया है; ‘अर्थात’ से सेईर देश और एदोम के प्रदेश का संबंध स्पष्ट किया गया है।
