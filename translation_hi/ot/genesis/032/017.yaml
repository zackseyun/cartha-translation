base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/017.yaml
  text: He put each herd by itself into the hand of his servants[a], and said to his servants, “Pass on ahead of me[d][c][b], and put a space between herd and herd.”
translation:
  language: hi
  text: उसने हर झुंड को अलग-अलग अपने सेवकों के हाथों में सौंप दिया[a] और अपने सेवकों से कहा, “मेरे आगे चलो और एक झुंड और दूसरे झुंड के बीच दूरी रखना[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने सेवकों के हाथ में दे दिया”; यह किसी वस्तु को उनके अधिकार और देखरेख में सौंपने का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “हर झुंड और अगले झुंड के बीच एक अंतर रखना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּיַד עֲבָדָיו
  choice: अपने सेवकों के हाथ में सौंप दिया
  rationale: शाब्दिक बिंब ‘हाथ में’ को बनाए रखते हुए हिन्दी की स्वाभाविक क्रिया ‘सौंप दिया’ उस मुहावरे का आशय व्यक्त करती है कि झुंड सेवकों के नियंत्रण और देखरेख में दिए गए।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: इस प्रसंग में घरेलू अधीनस्थों की कानूनी स्थिति पर नहीं, याकूब के निर्देशों का पालन करने वाली उनकी भूमिका पर बल है; इसलिए ‘सेवक’ संदर्भानुकूल है।
- source_word: עֵדֶר עֵדֶר לְבַדּוֹ
  choice: हर झुंड को अलग-अलग
  rationale: इब्रानी पुनरुक्ति वितरणात्मक अर्थ देती है—प्रत्येक पशु-समूह पृथक रखा गया। ‘हर झुंड को अलग-अलग’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עִבְרוּ לְפָנַי
  choice: मेरे आगे-आगे जाओ
  rationale: עבר यहाँ किसी निर्दिष्ट स्थान को पार करने के बजाय आगे बढ़ने का भाव रखता है; ‘आगे-आगे जाओ’ सेवकों को याकूब से पहले चलने की आज्ञा स्पष्ट करता है।
- source_word: וְרֶוַח תָּשִׂימוּ
  choice: कुछ दूरी रखना
  rationale: רֶוַח का अर्थ खाली स्थान या अंतर है। आज्ञार्थक वाक्य में ‘कुछ दूरी रखना’ स्वाभाविक हिन्दी है और झुंडों के बीच अंतराल बनाए रखने का भाव देता है।
- source_word: בֵּין עֵדֶר וּבֵין עֵדֶר
  choice: एक झुंड से दूसरे झुंड के बीच
  rationale: इब्रानी की दोहराई हुई संरचना क्रमिक पशु-समूहों के बीच अलगाव बताती है; हिन्दी में यह रूप उस वितरणात्मक अर्थ को स्पष्ट और स्वाभाविक ढंग से रखता है।
