base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/009.yaml
  text: He said[a], “If Esau comes to the one camp and strikes it, then the camp that remains will escape.”
translation:
  language: hi
  text: उसने कहा, “यदि एसाव एक दल के पास आकर उस पर प्रहार करे, तो शेष दल बच निकलेगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “शेष दल बच निकलने के लिए होगा,” अर्थात वह जीवित रहेगा या विनाश से बच जाएगा।
    reason: इब्रानी संज्ञात्मक अभिव्यक्ति לִפְלֵיטָה का अधिक शाब्दिक विकल्प और उसका आशय स्पष्ट करना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: אמר के सामान्य कथात्मक अर्थ ‘कहना’ को भूतकाल में स्वाभाविक हिन्दी रूप दिया गया है; आरम्भिक वाव को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं है।
- source_word: אִם
  choice: यदि
  rationale: यह याकूब की आशंकापूर्ण शर्त को व्यक्त करता है; ‘जब’ की अपेक्षा ‘यदि’ अनिश्चितता बनाए रखता है।
- source_word: יָבֹא
  choice: पास आकर
  rationale: בוא का मूल अर्थ ‘आना’ है। ‘पास आकर’ हिन्दी में אֶל के साथ स्वाभाविक है और अगले क्रियापद में व्यक्त हिंसक कार्रवाई को इसमें नहीं मिलाता।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶל־הַמַּחֲנֶה הָאַחַת
  choice: एक दल के पास
  rationale: यह पहले बनाए गए दो दलों में से एक को सूचित करता है। यहाँ מַחֲנֶה लोगों और पशुओं के समूह के अर्थ में है, इसलिए ‘दल’ प्रसंगानुकूल और सहज है।
- source_word: וְהִכָּהוּ
  choice: और उस पर प्रहार करे
  rationale: נכה के मूल अर्थ ‘मारना/प्रहार करना’ को बनाए रखा गया है। सर्वनाम का संबंध सामूहिक संज्ञा ‘दल’ से माना गया है।
- source_word: הַמַּחֲנֶה הַנִּשְׁאָר
  choice: शेष दल
  rationale: נשאר उस दल को दर्शाता है जो बचा या बाकी रह गया हो; ‘शेष दल’ संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: לִפְלֵיטָה
  choice: बच निकलेगा
  rationale: פְלֵיטָה बच निकलने या जीवित बचने की अवस्था को दर्शाता है। हिन्दी में संज्ञात्मक इब्रानी मुहावरे को क्रियात्मक रूप देना अधिक स्वाभाविक है।
