  text: וַ/יָּ֣קָם בַּ/לַּ֣יְלָה ה֗וּא וַ/יִּקַּ֞ח אֶת שְׁתֵּ֤י נָשָׁי/ו֙ וְ/אֶת שְׁתֵּ֣י שִׁפְחֹתָ֔י/ו וְ/אֶת אַחַ֥ד עָשָׂ֖ר יְלָדָ֑י/ו וַֽ/יַּעֲבֹ֔ר אֵ֖ת מַעֲבַ֥ר יַבֹּֽק׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/023.yaml
  text: That night he arose and took his two wives[a], his two female servants, and his eleven children, and crossed the ford of the Jabbok.
translation:
  language: hi
  text: उस रात वह उठा और अपनी दोनों पत्नियों, दोनों दासियों[a] और ग्यारह बच्चों को लेकर यब्बोक के घाट से पार गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गुलाम स्त्रियों’। इब्रानी शब्द שִׁפְחֹתָיו घर में अधीनस्थ हैसियत रखने वाली स्त्रियों के लिए है और दासता का अर्थ भी रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: वह उठा
  rationale: קום का क़ाल रूप उठने को व्यक्त करता है; ‘वह उठा’ आधुनिक हिन्दी में स्वाभाविक और कथात्मक है।
- source_word: בַּלַּיְלָה הוּא
  choice: उस रात
  rationale: यह काल-सूचक वाक्यांश उस विशेष रात पर बल देता है; ‘उस रात’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: וַיִּקַּח
  choice: लेकर
  rationale: לקח का मूल अर्थ ‘लेना’ है; यहाँ परिवार को साथ ले जाने का भाव है, जिसे ‘लेकर’ बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: שְׁתֵּי נָשָׁיו
  choice: अपनी दोनों पत्नियों
  rationale: इस प्रसंग में נָשִׁים स्पष्ट रूप से याकूब की पत्नियों के लिए प्रयुक्त है।
- source_word: שְׁתֵּי שִׁפְחֹתָיו
  choice: दोनों दासियों
  rationale: שִׁפְחָה अधीनस्थ घरेलू हैसियत वाली स्त्री सेविका या गुलाम स्त्री को दर्शाता है। ‘दासी’ संक्षिप्त और परिचित है, जबकि सामाजिक स्थिति की कठोरता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אַחַד עָשָׂר יְלָדָיו
  choice: ग्यारह बच्चों
  rationale: יְלָדִים का अर्थ ‘बच्चे/संतान’ है, केवल ‘पुत्र’ नहीं; इसलिए मूल की शब्दार्थगत व्यापकता बनाए रखी गई है।
- source_word: וַיַּעֲבֹר
  choice: पार गया
  rationale: यात्रा के इस संदर्भ में עבר किसी जलधारा या पारगमन-स्थल को पार करने का अर्थ देता है।
- source_word: אֵת מַעֲבַר יַבֹּק
  choice: यब्बोक के घाट से
  rationale: מַעֲבָר नदी के उस उथले स्थान या निर्धारित पारगमन-स्थल को दर्शाता है जहाँ से पार किया जा सकता है; हिन्दी में ‘घाट’ इस प्रसंग में स्वाभाविक है।
- source_word: יַבֹּק
  choice: यब्बोक
  rationale: नदी के इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
