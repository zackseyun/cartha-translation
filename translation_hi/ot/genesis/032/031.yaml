reference: Genesis 32:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א יַעֲקֹ֛ב שֵׁ֥ם הַ/מָּק֖וֹם פְּנִיאֵ֑ל כִּֽי רָאִ֤יתִי אֱלֹהִים֙ פָּנִ֣ים אֶל פָּנִ֔ים וַ/תִּנָּצֵ֖ל נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
translation:
  language: hi
  text: और याकूब ने उस स्थान का नाम पनीएल[a] रखा, क्योंकि “मैंने परमेश्वर को आमने-सामने देखा है, और मेरा जीवन बच गया है।”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पनीएल” नाम सुनने में “परमेश्वर का मुख” जैसा लगता है; यह याकूब की बात, “मैंने परमेश्वर को आमने-सामने देखा है,” से मेल खाता है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, “मेरा प्राण बच गया है”; यहाँ “प्राण” का अर्थ जीवन या स्वयं व्यक्ति है।
    reason: lexical_alternative
  - marker: c
    text: “परमेश्वर” के लिए प्रयुक्त इब्रानी शब्द का अर्थ अधिक व्यापक रूप में “कोई दिव्य प्राणी” भी हो सकता है, पर संदर्भ “परमेश्वर” का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם הַמָּקוֹם
  choice: उस स्थान का नाम ... रखा
  rationale: हिन्दी में नामकरण के लिए यह स्वाभाविक अभिव्यक्ति है और इब्रानी नामकरण-सूत्र का अर्थ स्पष्ट रूप से बनाए रखती है।
- source_word: פְּנִיאֵל
  choice: पनीएल
  rationale: स्थान-नाम का लिप्यंतरण; यह פָּנִים ‘मुख/चेहरा’ और אֵל ‘परमेश्वर’ से जुड़े शब्द-खेल को सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह स्थान के नाम के लिए याकूब द्वारा दिए गए कारण को सीधे व्यक्त करता है।
- source_word: רָאִיתִי אֱלֹהִים
  choice: मैंने परमेश्वर को ... देखा है
  rationale: संदर्भ में אֱלֹהִים का सबसे स्वाभाविक अर्थ परमेश्वर है; पूर्ण क्रिया को वर्तमान परिणाम वाले हिन्दी रूप में व्यक्त किया गया है।
- source_word: פָּנִים אֶל פָּנִים
  choice: आमने-सामने
  rationale: प्रत्यक्ष व्यक्तिगत भेंट का स्वाभाविक आधुनिक हिन्दी मुहावरा है और पनीएल नाम के शब्द-खेल से संबंध बनाए रखता है।
- source_word: וַתִּנָּצֵל נַפְשִׁי
  choice: फिर भी मेरा जीवन बच गया है
  rationale: נֶפֶשׁ यहाँ अमूर्त ‘आत्मा’ की अपेक्षा व्यक्ति के जीवित बचने को दर्शाता है। וַתִּנָּצֵל का आश्चर्यजनक प्रतिकूल परिणाम हिन्दी में ‘फिर भी’ से स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: אֱלֹהִים का अभिप्राय
  choice: परमेश्वर
  alternative: कोई दिव्य प्राणी
  rationale: कथा और याकूब की नाम-व्याख्या एक निश्चित ईश्वरीय संदर्भ का समर्थन करती है, यद्यपि इब्रानी शब्द व्यापक अर्थ भी रख सकता है; वैकल्पिक संभावना पादटिप्पणी में सुरक्षित है।
- issue: परमेश्वर को देखने के बाद जीवित बचना
  choice: फिर भी मेरा जीवन बच गया है
  alternative: और मेरा प्राण छुड़ाया गया है
  rationale: अनुवाद पाठ के तनाव—प्रत्यक्ष दर्शन और जीवित बचने—को बनाए रखता है, बिना उसकी धर्मवैज्ञानिक व्याख्या को और निश्चित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। प्रत्यक्ष कथन को स्रोत के प्रथम पुरुष में रखा गया है और स्रोत में न होने वाले ‘उसने कहा’ जैसे शब्द नहीं जोड़े गए। उद्धरण-चिह्न वक्ता-परिवर्तन को हिन्दी पाठक के लिए स्पष्ट करते हैं।
