source:
  edition: WLC
  text: וַ/יִּשְׁאַ֣ל יַעֲקֹ֗ב וַ/יֹּ֨אמֶר֙ הַגִּֽידָ/ה נָּ֣א שְׁמֶ֔/ךָ וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֖ה תִּשְׁאַ֣ל לִ/שְׁמִ֑/י וַ/יְבָ֥רֶךְ אֹת֖/וֹ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/030.yaml
  text: Then Jacob asked[a], “Please tell me your name.” But he said[c][b], “Why is it that you ask my name?” And he blessed him there.
translation:
  language: hi
  text: तब याकूब ने पूछा, “कृपया मुझे अपना नाम बताइए।” उसने कहा, “तुम मेरा नाम क्यों पूछते हो?” और उसने वहीं उसे आशीष दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל יַעֲקֹב וַיֹּאמֶר
  choice: तब याकूब ने पूछा
  rationale: इब्रानी का शाब्दिक रूप ‘याकूब ने पूछा और कहा’ है, पर आधुनिक हिन्दी में प्रत्यक्ष कथन के पहले ‘पूछा’ ही दोनों क्रियाओं का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַגִּידָה נָּא
  choice: कृपया मुझे ... बताइए
  rationale: नגד के हिफ़ील आज्ञार्थक का अर्थ ‘बताना/प्रकट करना’ है और נָא विनम्र अनुरोध का भाव देता है; सम्मानसूचक ‘बताइए’ प्रसंगानुकूल और सहज है।
- source_word: שְׁמֶךָ
  choice: अपना नाम
  rationale: प्रत्यक्ष संबोधन में हिन्दी का निजवाचक ‘अपना’ स्वाभाविक ढंग से ‘तुम्हारा नाम’ का अर्थ व्यक्त करता है, बिना पहचान के निहितार्थ को विस्तार दिए।
- source_word: לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי
  choice: तुम मेरा नाम क्यों पूछते हो?
  rationale: לָמָּה זֶּה का यहाँ प्रश्नात्मक बल सहज हिन्दी में ‘क्यों’ से व्यक्त होता है; अधिक शब्दशः रूप हिन्दी में अस्वाभाविक होता।
- source_word: וַיְבָרֶךְ אֹתוֹ שָׁם
  choice: और उसने वहीं उसे आशीष दी
  rationale: ברך को ‘आशीष देना’ और שָׁם को बलयुक्त, स्वाभाविक ‘वहीं’ से व्यक्त किया गया है। कर्ता को सर्वनाम में रखकर मूल की अनिर्दिष्टता बचाई गई है।
theological_decisions:
- issue: नाम बताने से इनकार करने वाले वक्ता की पहचान
  choice: ‘उसने’ सर्वनाम द्वारा पहचान अनिर्दिष्ट रखी गई
  alternative: उस पुरुष ने / परमेश्वर ने / स्वर्गदूत ने
  rationale: इस पद में इब्रानी कर्ता का नाम स्पष्ट नहीं करता। व्यापक प्रसंग पहचान के विषय में संकेत देता है, पर मुख्य पाठ में कोई विशिष्ट पहचान जोड़ना मूल की धर्मवैचारिक अस्पष्टता को समय से पहले सुलझा देगा।
- issue: आशीष देने वाले और पाने वाले की पहचान
  choice: ‘उसने ... उसे’
  alternative: उस पुरुष ने याकूब को
  rationale: संदर्भ से आशय समझ आता है, किंतु मूल पाठ दोनों को सर्वनाम से व्यक्त करता है; हिन्दी में भी सर्वनाम रखने से कथात्मक बनावट और पहचान-संबंधी तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमामय और सामान्य पाठक के लिए सहज रखी गई है। ‘बताइए’ सम्मानसूचक संबोधन है; ‘आशीष दी’ प्रचलित बाइबिलीय पदावली है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
