base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/032.yaml
  text: The sun rose upon him as he passed Penuel[c][b][a], and he was limping on his thigh.
translation:
  language: hi
  text: जब वह पनूएल[a] से आगे बढ़ा, तब उसके लिए सूर्य उदय हुआ, और वह अपनी जाँघ के कारण लंगड़ाते हुए चल रहा था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में इब्रानी वर्तनी “पनूएल” है; अन्य स्थानों पर इस नाम का रूप “पनीएल” भी मिलता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपनी जाँघ पर [लंगड़ाता हुआ] था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַח לוֹ הַשֶּׁמֶשׁ
  choice: सूर्य उस पर उदय हुआ
  rationale: यह मूल पाठ के दृष्टिकोण को बनाए रखता है, जिसमें सूर्य का उदय याकूब के संबंध में व्यक्त किया गया है, और हिंदी में भी स्वाभाविक तथा गरिमापूर्ण है।
- source_word: כַּאֲשֶׁר עָבַר
  choice: जब वह ... से होकर निकला
  rationale: עָבַר का अर्थ यहाँ किसी स्थान से होकर आगे निकलना है; यह अनुवाद अनावश्यक रूप से किसी नदी या सीमा को पार करने का भाव नहीं जोड़ता।
- source_word: פְּנוּאֵל
  choice: पनूएल
  rationale: इस पद के हिब्रू रूप פְּנוּאֵל का सीधा देवनागरी लिप्यंतरण किया गया है; दूसरे स्थानों पर मिलने वाले पनीएल रूप से इसका सामंजस्य नहीं बैठाया गया।
- source_word: צֹלֵעַ
  choice: लंगड़ा रहा था
  rationale: हिब्रू कृदंत उस समय जारी अवस्था या क्रिया को दर्शाता है; यह हिंदी अभिव्यक्ति उसी निरंतर भाव को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: עַל יְרֵכוֹ
  choice: अपनी जाँघ के कारण
  rationale: शाब्दिक रूप 'अपनी जाँघ पर' है, पर यहाँ עַל को कारणसूचक समझने से हिंदी में स्पष्ट अर्थ मिलता है। 'जाँघ' मूल शब्द יָרֵךְ को बनाए रखता है और पिछले प्रसंग से 'कूल्हा' स्वतः आयात नहीं करता।
