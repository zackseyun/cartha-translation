lexical_decisions:
- source_word: גְּמַלִּים מֵינִיקוֹת
  choice: दूध पिलाने वाली ऊँटनियाँ
  rationale: מֵינִיקוֹת स्त्रीलिंग बहुवचन कृदंत है और उन ऊँटनियों को दर्शाता है जो अपने बच्चों को दूध पिला रही हैं; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וּבְנֵיהֶם
  choice: और उनके बच्चे
  rationale: शाब्दिक अर्थ ‘और उनके बेटे/बच्चे’ है, पर पशुओं के संदर्भ में ‘उनके बच्चे’ स्वाभाविक हिन्दी है और संतान का भाव बनाए रखता है।
- source_word: פָּרוֹת
  choice: गायें
  rationale: यह मादा गोवंश के लिए प्रयुक्त सामान्य शब्द है; ‘गायें’ सहज और पर्याप्त रूप से सटीक है।
- source_word: וּפָרִים
  choice: और दस साँड़
  rationale: פָּרִים यहाँ नर गोवंश को दर्शाता है; ‘साँड़’ सूची में गायों के साथ लिंग-भेद को स्पष्ट रखता है।
- source_word: אֲתֹנֹת
  choice: गधियाँ
  rationale: इब्रानी शब्द विशेष रूप से मादा गधों को दर्शाता है; ‘गधियाँ’ संक्षिप्त और स्वाभाविक आधुनिक हिन्दी है।
- source_word: וַעְיָרִם
  choice: और गधों के दस बच्चे[a]
  rationale: עַיִר का अर्थ युवा गधा या गधे का बच्चा हो सकता है। ‘गधों के बच्चे’ आयु-संबंधी मूल भाव को स्पष्ट रखता है, जबकि संभावित ‘नर गधे’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
