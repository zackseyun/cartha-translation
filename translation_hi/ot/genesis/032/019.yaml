base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/019.yaml
  text: Then you shall say[a], ‘Your servant Jacob's gift is sent to my lord, to Esau; and look[b], he also is behind us.’
translation:
  language: hi
  text: तब तुम कहना, ‘यह आपके सेवक याकूब की भेंट[a] है, जो मेरे स्वामी, एसाव को भेजी गई है; और देखिए, वह भी हमारे पीछे है[b]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उपहार’ अथवा ‘नज़राना’। इब्रानी शब्द मिन्खाह यहाँ एसाव को शांत करने के लिए भेजी गई भेंट के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हमारे पीछे आ रहा है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: तब तुम कहना
  rationale: वाव के साथ यह क्रिया याकूब के क्रमिक निर्देश को आगे बढ़ाती है। ‘तब तुम कहना’ आधुनिक हिन्दी में उस निर्देशात्मक और क्रमसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְעַבְדְּךָ לְיַעֲקֹב
  choice: आपके सेवक याकूब की
  rationale: यह एसाव के सामने याकूब की विनम्र आत्म-पहचान है। हिन्दी का संबंधवाचक रूप भेंट के साथ सहज जुड़ता है और सम्मानसूचक विनम्रता बनाए रखता है।
- source_word: מִנְחָה
  choice: भेंट
  rationale: यहाँ शब्द किसी उपासना-संबंधी बलि के बजाय एसाव को शांत करने के लिए भेजे गए उपहार को दर्शाता है। ‘भेंट’ इस प्रसंग में स्वाभाविक और गरिमापूर्ण है।
- source_word: שְׁלוּחָה
  choice: भेजी गई है
  rationale: स्त्रीलिंग निष्क्रिय कृदंत भेंट के भेजे जाने की अवस्था बताता है; ‘भेजी गई है’ उस निष्क्रिय अर्थ को स्पष्ट रखता है।
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: मेरे स्वामी—एसाव के पास
  rationale: ‘स्वामी’ सामाजिक आदर और याकूब की विनम्रता व्यक्त करता है। डैश एसाव को ‘मेरे स्वामी’ की व्याख्यात्मक समानाधिकरण पहचान के रूप में बनाए रखता है, और ‘के पास’ भेजने की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देखिए
  rationale: यह ध्यान खींचने वाला कथन-सूचक है। ‘देखिए’ आधुनिक सम्मानसूचक हिन्दी में ‘निहारो’ जैसे पुरातन रूप से अधिक सहज है।
- source_word: גַּם הוּא
  choice: वह स्वयं भी
  rationale: ‘भी’ जोड़ने का बल और ‘स्वयं’ इस तथ्य पर जोर बनाए रखते हैं कि भेंट के अतिरिक्त याकूब भी पीछे है।
- source_word: אַחֲרֵינוּ
  choice: हमारे पीछे है
  rationale: यह याकूब की सेवकों और झुंडों के पीछे की स्थिति को सीधे व्यक्त करता है, जबकि ‘हमारे पीछे आ रहा है’ संभावित गतिशील अर्थ है।
