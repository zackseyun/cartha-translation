  text: הַצִּילֵ֥/נִי נָ֛א מִ/יַּ֥ד אָחִ֖/י מִ/יַּ֣ד עֵשָׂ֑ו כִּֽי יָרֵ֤א אָנֹכִי֙ אֹת֔/וֹ פֶּן יָב֣וֹא וְ/הִכַּ֔/נִי אֵ֖ם עַל בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/012.yaml
  text: Please deliver me from the hand of my brother[a], from the hand of Esau, for I am afraid of him, lest he come and strike me[b], the mother with the children.
translation:
  language: hi
  text: कृपा करके मुझे मेरे भाई के हाथ से, एसाव के हाथ से बचा ले, क्योंकि मैं उससे डरता हूँ। कहीं ऐसा न हो कि वह आकर मुझ पर प्रहार करे—माँ और बच्चों पर एक साथ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप में: ‘माँ बच्चों पर।’ यह इब्रानी मुहावरा माँ और बच्चों पर एक साथ आक्रमण या विनाश को सूचित करता है। अनुवाद यह भी हो सकता है: ‘माँ को बच्चों समेत।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי נָא
  choice: कृपा करके मुझे ... बचा ले
  rationale: हिफ़ील आज्ञार्थक रूप उद्धार या संकट से छुड़ाने की विनती व्यक्त करता है; נָא को ‘कृपा करके’ से व्यक्त करने पर प्रार्थनापूर्ण आग्रह स्वाभाविक आधुनिक हिन्दी में बना रहता है।
- source_word: מִיַּד אָחִי מִיַּד עֵשָׂו
  choice: मेरे भाई के हाथ से, एसाव के हाथ से
  rationale: ‘हाथ से’ किसी की शक्ति या अधिकार से बचाए जाने का ठोस इब्रानी मुहावरा है और हिन्दी में भी समझ में आता है। ‘मेरे भाई’ और ‘एसाव’ दोनों को रखने से संबंध की भावनात्मक विडंबना बनी रहती है।
- source_word: כִּי יָרֵא אָנֹכִי אֹתוֹ
  choice: क्योंकि मैं उससे डरता हूँ
  rationale: कारणसूचक כִּי और याकूब के वर्तमान भय को सीधी, स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: פֶּן יָבוֹא וְהִכַּנִי
  choice: कहीं ऐसा न हो कि वह आकर मुझ पर प्रहार करे
  rationale: פֶּן आशंकित संभावना बताता है। נכה का मूल भाव प्रहार करना है; इसलिए पहले खंड में ‘प्रहार करे’ रखा गया है, न कि अनिवार्य रूप से ‘मार डाले’।
- source_word: אֵם עַל בָּנִים
  choice: माँ को बच्चों समेत मार डाले
  rationale: यह एक मुहावरेदार चित्र है जिसमें माँ और उसके बच्चों का एक साथ विनाश अभिप्रेत है। हिन्दी में ‘माँ को बच्चों समेत’ उस सामूहिक भय को स्पष्ट करता है; हिंसक मुहावरे के परिणाम को ‘मार डाले’ से व्यक्त किया गया है।
theological_decisions:
- issue: אֵם עַל בָּנִים में हिंसक मुहावरे का अर्थ
  choice: माँ को बच्चों समेत मार डाले
  alternative: माँ पर बच्चों सहित प्रहार करे / माँ और बच्चों को मारे
  rationale: वाक्यांश का शाब्दिक रूप हिन्दी में अस्पष्ट होगा। चुना गया पाठ परिवार के सामूहिक विनाश की आशंका स्पष्ट करता है, जबकि पाद-टिप्पणी मूल चित्र और कम निर्णायक विकल्प को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-भाषा अपनाई गई है। ‘बचा ले’ और ‘कृपा करके’ सहज हैं, जबकि ‘हाथ से’ मूल इब्रानी चित्र को बनाए रखता है। अंतिम कठिन मुहावरे को मुख्य पाठ में स्पष्ट किया गया है और उसकी शाब्दिक बनावट पाद-टिप्पणी में दी गई है।
