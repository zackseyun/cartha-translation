  text: וַ/אֲמַרְתֶּ֕ם גַּ֗ם הִנֵּ֛ה עַבְדְּ/ךָ֥ יַעֲקֹ֖ב אַחֲרֵ֑י/נוּ כִּֽי אָמַ֞ר אֲכַפְּרָ֣ה פָנָ֗י/ו בַּ/מִּנְחָה֙ הַ/הֹלֶ֣כֶת לְ/פָנָ֔/י וְ/אַחֲרֵי כֵן֙ אֶרְאֶ֣ה פָנָ֔י/ו אוּלַ֖י יִשָּׂ֥א פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/021.yaml
  text: And you shall also say[a], ‘Look, your servant Jacob is behind us,’ for he said, ‘I will appease him with the gift that is going ahead of me, and afterward I will see his face[b]; perhaps he will accept me.’
translation:
  language: hi
  text: और तुम यह भी कहना, “देखिए, आपका दास याकूब हमारे पीछे है।” क्योंकि उसने कहा, “मैं अपने आगे जा रही इस भेंट से उसे मना लूँगा[a]। फिर मैं उसका चेहरा देखूँगा; शायद वह मुझे स्वीकार कर ले[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मैं भेंट के द्वारा उसके मुख को शांत करूँगा।” प्रयुक्त क्रिया प्रायश्चित की भाषा से संबंधित है, पर इस प्रसंग में इसका अर्थ भेंट देकर एसाव को मनाना है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी मुहावरा है, “वह मेरा मुख उठा ले”; अर्थात वह मुझे स्वीकार करे या मुझ पर कृपा करे।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: आपका दास
  rationale: याकूब एसाव के सामने विनम्र और अधीनतापूर्ण कूटनीतिक भाषा बोलता है। इस प्रसंग में ‘दास’ सामाजिक भाव और आत्म-नम्रता को ‘गुलाम’ से अधिक उपयुक्त ढंग से व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला अव्यय है। एसाव के प्रति आदरसूचक संबोधन बनाए रखने के लिए आधुनिक हिन्दी में ‘देखिए’ स्वाभाविक है।
- source_word: אַחֲרֵינוּ
  choice: हमारे पीछे आ रहा है
  rationale: यह दूतों के पीछे याकूब की स्थिति बताता है। ‘आ रहा है’ यात्रा के जारी प्रसंग को हिन्दी में स्वाभाविक रूप से स्पष्ट करता है।
- source_word: אֲכַפְּרָה
  choice: मैं उसे शांत करूँगा
  rationale: כפר यहाँ किसी उपासना-विधि के प्रायश्चित के लिए नहीं, बल्कि भेंट द्वारा एसाव का क्रोध शांत करने के लिए प्रयुक्त है।
- source_word: מִנְחָה
  choice: भेंट
  rationale: इस कथा में यह एसाव को मनाने के लिए भेजी गई भेंट है। ‘बलि’ या ‘चढ़ावा’ अनावश्यक रूप से उपासना-संबंधी अर्थ ला सकते हैं।
- source_word: הַהֹלֶכֶת לְפָנַי
  choice: जो भेंट मेरे आगे जा रही है
  rationale: कृदन्त भेंट की जारी गति को दिखाता है; यह हिन्दी प्रयोग उस क्रिया और याकूब से उसकी आगे की स्थिति दोनों को बनाए रखता है।
- source_word: אֶרְאֶה פָנָיו
  choice: मैं उसका मुँह देखूँगा
  rationale: मूल में बार-बार आने वाले ‘मुख’ के बिंब को यहाँ सुरक्षित रखा गया है; हिन्दी में यह प्रत्यक्ष भेंट का अर्थ भी स्वाभाविक रूप से देता है।
- source_word: יִשָּׂא פָנַי
  choice: वह मुझे स्वीकार कर ले
  rationale: शाब्दिक इब्रानी मुहावरा ‘मेरा मुख उठा ले’ अनुकूल स्वागत या कृपा दर्शाता है। मुख्य पाठ में स्पष्ट हिन्दी अर्थ दिया गया है और शाब्दिक बिंब पादटिप्पणी में रखा गया है।
- source_word: אוּלַי
  choice: शायद
  rationale: यह याकूब की आशा के साथ उसकी अनिश्चितता भी बनाए रखता है।
theological_decisions:
- issue: मानवीय संबंध के प्रसंग में כפר का अर्थ
  choice: मैं उसे शांत करूँगा
  alternative: मैं उसके सामने प्रायश्चित करूँगा
  rationale: यहाँ कर्म एसाव है और साधन एक भेंट है, इसलिए अभिप्राय क्रुद्ध व्यक्ति को मनाना है, न कि कोई अनुष्ठानिक प्रायश्चित करना। पादटिप्पणी मूल अभिव्यक्ति और उसके प्रायश्चित-संबंधी शब्द-परिवार की जानकारी सुरक्षित रखती है।
- issue: יִשָּׂא פָנַי के मुहावरे का अनुवाद
  choice: वह मुझे स्वीकार कर ले
  alternative: वह मेरा मुख उठा ले
  rationale: शाब्दिक रूप हिन्दी पाठक के लिए अस्पष्ट हो सकता है। अर्थ को मुख्य पाठ में दिया गया है, जबकि मूल ‘मुख’ बिंब पादटिप्पणी में पारदर्शी रूप से बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप रखा गया है। एसाव को संबोधित वाक्य में ‘देखिए’ और ‘आपका’ से आदर तथा याकूब की विनम्रता व्यक्त होती है। मूल के ‘मुख’ बिंब को जहाँ हिन्दी में स्वाभाविक है वहाँ मुख्य पाठ में रखा गया है और अस्पष्ट मुहावरों को पादटिप्पणियों में समझाया गया है।
