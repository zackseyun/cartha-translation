id: GEN.32.27
reference: Genesis 32:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שַׁלְּחֵ֔/נִי כִּ֥י עָלָ֖ה הַ/שָּׁ֑חַר וַ/יֹּ֨אמֶר֙ לֹ֣א אֲשַֽׁלֵּחֲ/ךָ֔ כִּ֖י אִם בֵּרַכְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/027.yaml
  text: And he said[a], “Let me go, for the dawn has risen.” But he said[c][b], “I will not let you go unless you bless me.”
translation:
  language: hi
  text: तब उसने कहा[a], “मुझे जाने दे, क्योंकि भोर हो गई है[b]।” पर उसने कहा[c], “जब तक तू मुझे आशीष न दे, मैं तुझे जाने नहीं दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे छोड़ दे” अथवा “मुझे विदा कर।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “क्योंकि भोर चढ़ आई है”; या, “क्योंकि पौ फट रही है।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी पाठ इस पद में वक्ताओं की पहचान स्पष्ट रूप से नहीं बताता; उनकी पहचान आसपास के वर्णन से समझी जाती है।
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: मुझे जाने दे
  rationale: שׁלח के आज्ञार्थक रूप और प्रथम पुरुष एकवचन प्रत्यय का मूल अर्थ ‘मुझे भेज/छोड़ दे’ है। कुश्ती के प्रसंग में ‘मुझे जाने दे’ सहज हिंदी है और पकड़ से मुक्त करने का भाव व्यक्त करता है।
- source_word: כִּי עָלָה הַשָּׁחַר
  choice: क्योंकि भोर हो गई है
  rationale: כִּי का कारणसूचक अर्थ ‘क्योंकि’ रखा गया है। עָלָה और הַשָּׁחַר की उदय होने वाली छवि को मुख्य पाठ में स्वाभाविक आधुनिक हिंदी में व्यक्त किया गया है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לֹא אֲשַׁלֵּחֲךָ
  choice: मैं तुझे जाने नहीं दूँगा
  rationale: निषेध के साथ अपूर्ण क्रिया दृढ़ इनकार व्यक्त करती है। पहले वाक्य के ‘जाने दे’ को दोहराने से मूल इब्रानी की क्रियात्मक संगति बनी रहती है।
- source_word: כִּי אִם
  choice: जब तक ... न
  rationale: यह पदबंध यहाँ अपवाद अथवा शर्त बताता है। ‘जब तक ... न’ हिंदी में याकूब द्वारा आशीष मिलने तक न छोड़ने की शर्त को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֵּרַכְתָּנִי
  choice: तू मुझे आशीष न दे
  rationale: पूर्ण क्रिया यहाँ शर्त पूरी होने से पहले अपेक्षित कार्य को सूचित करती है। हिंदी की ‘जब तक ... न दे’ रचना इस प्रसंगगत बल को स्पष्ट और स्वाभाविक ढंग से रखती है।
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: तब उसने कहा ... पर उसने कहा
  rationale: दोनों उपवाक्यों में इब्रानी समान रूप से ‘उसने कहा’ कहती है। ‘पर’ उत्तर के विरोधी मोड़ को स्वाभाविक बनाता है, जबकि वक्ताओं के नाम न देकर मूल की अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: वक्ताओं की पहचान
  choice: दोनों बार केवल ‘उसने कहा’ रखा गया है; किसी को याकूब, मनुष्य, दूत या परमेश्वर नहीं कहा गया।
  alternative: प्रसंग के आधार पर पहले वक्ता को ‘उस पुरुष/दूत’ और दूसरे को ‘याकूब’ के रूप में स्पष्ट करना।
  rationale: इस पद में इब्रानी क्रियारूप केवल तीसरे पुरुष पुल्लिंग एकवचन कर्ता का संकेत देते हैं; वक्ताओं के नाम स्पष्ट नहीं हैं। नाम जोड़ना आसपास के वर्णन से की गई व्याख्या को पद के पाठ में ले आता, इसलिए मूल की कथात्मक और धर्मवैज्ञानिक अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष संबोधन में ‘तू/तुझे’ का प्रयोग इब्रानी के एकवचन निकट संबोधन और हिंदी बाइबिलीय संवाद-शैली के अनुरूप है; इसे अनादर सूचित करने के लिए नहीं चुना गया।
