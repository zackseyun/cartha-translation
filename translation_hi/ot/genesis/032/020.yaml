base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/020.yaml
  text: And he commanded the second also[a], and the third also, and all those going behind the droves, saying, “According to this word you shall speak to Esau when you find him.”
translation:
  language: hi
  text: 'उसने दूसरे को भी, तीसरे को भी, और झुंडों के पीछे चलनेवाले सभी लोगों को यह आज्ञा दी: “जब तुम एसाव से मिलो, तब उससे यही बात कहना।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: उसने ... आज्ञा दी
  rationale: पिएल रूप निर्देश की प्रबलता व्यक्त करता है; ‘आज्ञा दी’ इसे स्वाभाविक और स्पष्ट हिंदी में बनाए रखता है।
- source_word: גַּם אֶת הַשֵּׁנִי גַּם אֶת הַשְּׁלִישִׁי
  choice: दूसरे और तीसरे को भी
  rationale: दोनों क्रमवाचक विशेषण संज्ञा के रूप में प्रयुक्त हैं। संदर्भ स्पष्ट होने के कारण ‘सेवक’ जोड़ना आवश्यक नहीं है।
- source_word: כָּל הַהֹלְכִים אַחֲרֵי הָעֲדָרִים
  choice: झुंडों के पीछे चलनेवाले सभी लोगों को
  rationale: कृदंत का अर्थ जारी क्रिया है और עדרים पशुओं के अलग-अलग झुंडों को दर्शाता है।
- source_word: לֵאמֹר
  choice: 'यह ... दी:'
  rationale: हिंदी में प्रत्यक्ष कथन का स्वाभाविक परिचय विरामचिह्न और ‘यह आज्ञा दी’ के द्वारा किया गया है; अलग से ‘कहते हुए’ अनावश्यक होता।
- source_word: כַּדָּבָר הַזֶּה תְּדַבְּרוּן
  choice: इसी प्रकार कहना
  rationale: शाब्दिक अर्थ ‘इस वचन/बात के अनुसार बोलना’ है; यहाँ पहले दिए गए संदेश के अनुरूप वही बात कहने का निर्देश है, जिसे आधुनिक हिंदी में यह वाक्यांश सहज रूप से व्यक्त करता है।
- source_word: בְּמֹצַאֲכֶם אֹתוֹ
  choice: जब तुम एसाव से मिलो
  rationale: מצא का मूल भाव ‘पाना’ है, पर व्यक्ति से सामना होने के इस प्रसंग में ‘मिलो’ स्वाभाविक हिंदी है और अर्थ को सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। मूल के सामूहिक बहुवचन ‘तुम’ और क्रमिक झुंडों के संदर्भ को बनाए रखा गया है।
