  yaml_path: translation/ot/genesis/032/024.yaml
  text: He took them and brought them across the stream[b][a], and he brought across what belonged to him.
translation:
  language: hi
  text: उसने उन्हें अपने साथ लिया और जलधारा[a] के उस पार पहुँचाया; और जो कुछ उसका था, उसे पार पहुँचाया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नाला,’ ‘खड्ड,’ अथवा ‘बरसाती जलमार्ग।’ इब्रानी शब्द נחל जलधारा, खड्ड या मौसमी जलमार्ग के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘जो उसके लिए था,’ अर्थात जो उसका था या उसकी संपत्ति।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵם
  choice: उसने उन्हें लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है। यहाँ कर्म का संकेत पिछले पद में बताए गए लोगों की ओर है; इसलिए सीधा अनुवाद मूल की संक्षिप्तता बनाए रखता है।
- source_word: וַיַּעֲבִרֵם
  choice: पार पहुँचाया
  rationale: עבר का हिफ़ील रूप कारक अर्थ देता है—उसने उन्हें पार कराया। ‘पार पहुँचाया’ स्वाभाविक हिन्दी में इस कारक भाव को स्पष्ट रखता है।
- source_word: הַנָּחַל
  choice: जलधारा
  rationale: נחל बहती धारा, बरसाती जलमार्ग, नाला या उससे जुड़ी घाटी का बोध करा सकता है। ‘जलधारा’ यहाँ पार करने की क्रिया के अनुरूप, सहज और गरिमापूर्ण है; व्यापक भौगोलिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: וַיַּעֲבֵר
  choice: उसे भी पार पहुँचाया
  rationale: दूसरा हिफ़ील रूप भी कारक है। हिन्दी में एकवचन ‘उसे’ पूरे संयुक्त पद ‘जो कुछ उसका था’ की ओर संकेत करता है, और ‘भी’ दोहराई गई क्रिया का स्वाभाविक संबंध दिखाता है।
- source_word: אֲשֶׁר לוֹ
  choice: जो कुछ उसका था
  rationale: इब्रानी पदबंध का शाब्दिक भाव ‘जो उसके लिए/उसका था’ है। यह अनुवाद उसे केवल किसी एक प्रकार की संपत्ति तक सीमित किए बिना स्वाभाविक हिन्दी में अधिकार का अर्थ देता है।
