  yaml_path: translation/ot/genesis/032/014.yaml
  text: 'So he spent that night there[a], and he took from what came to his hand a gift for Esau his brother:'
translation:
  language: hi
  text: 'उसने उस रात वहीं बिताई, और जो कुछ उसके पास था[a], उसमें से उसने अपने भाई एसाव के लिए एक भेंट ली:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक, ‘जो उसके हाथ में आया’; अर्थात्, ‘जो कुछ उसके पास था’ या ‘जो कुछ उपलब्ध था।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלֶן
  choice: उसने…बिताई
  rationale: לון यहाँ रात ठहरने या रात बिताने को व्यक्त करता है। ‘रात बिताई’ आधुनिक हिन्दी में स्वाभाविक है और कालगत अर्थ स्पष्ट रखता है।
- source_word: שָׁם
  choice: वहीं
  rationale: स्थानवाचक שָׁם का सीधा और प्रसंगानुकूल हिन्दी रूप ‘वहीं’ है।
- source_word: בַּלַּיְלָה הַהוּא
  choice: वह रात
  rationale: शाब्दिक अर्थ ‘उस रात में’ है; हिन्दी में ‘वह रात’ स्वाभाविक ढंग से वही कालगत संकेत देता है।
- source_word: וַיִּקַּח
  choice: उसने…ली
  rationale: לקח का सामान्य अर्थ ‘लेना’ है। यहाँ याकूब उपलब्ध पशुओं में से भेंट अलग करता है; ‘ली’ मूल क्रिया की व्यापकता बनाए रखती है।
- source_word: מִן הַבָּא בְיָדוֹ
  choice: जो कुछ उसके हाथ आया, उसमें से
  rationale: यह इब्रानी अभिव्यक्ति के रूपक को बनाए रखता है और हिन्दी में समझने योग्य है। इसका आशय उसके पास उपलब्ध वस्तुओं से है; वह सहज अर्थ पादटिप्पणी में दिया गया है।
- source_word: מִנְחָה
  choice: एक भेंट
  rationale: इस पारस्परिक प्रसंग में מִנְחָה धार्मिक बलि के बजाय किसी को सम्मानित या प्रसन्न करने के लिए दी जाने वाली भेंट है।
- source_word: לְעֵשָׂו אָחִיו
  choice: अपने भाई एसाव के लिए
  rationale: लामेद प्राप्तकर्ता को सूचित करता है। यह रूप संबंध को स्पष्ट रखते हुए हिन्दी की स्वाभाविक शब्द-व्यवस्था अपनाता है।
