source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְ/ךָ֔ כִּ֖י אִם יִשְׂרָאֵ֑ל כִּֽי שָׂרִ֧יתָ עִם אֱלֹהִ֛ים וְ/עִם אֲנָשִׁ֖ים וַ/תּוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/029.yaml
  text: And he said[a], “Your name shall no longer be called Jacob, but Israel, because you have striven with God and with men[b], and have prevailed.”
translation:
  language: hi
  text: उसने कहा, “अब तुम्हारा नाम याकूब नहीं, बल्कि इस्राएल कहलाएगा, क्योंकि तुमने परमेश्वर[a] और मनुष्यों[b] के साथ संघर्ष किया और प्रबल हुए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दैवी प्राणियों”; इब्रानी शब्द אֱלֹהִים कुछ संदर्भों में परमेश्वर, देवताओं या स्वर्गीय प्राणियों के लिए प्रयुक्त हो सकता है। यहाँ कथा-संदर्भ के कारण मुख्य पाठ में “परमेश्वर” रखा गया है।
    reason: alternative_reading
  - marker: b
    text: या “लोगों” अथवा “पुरुषों”।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָמֵר עוֹד שִׁמְךָ
  choice: अब तुम्हारा नाम ... कहलाएगा
  rationale: नामकरण के निष्क्रिय सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; עוֹד के समाप्ति-बोध को ‘अब ... नहीं’ से स्पष्ट किया गया है।
- source_word: כִּי אִם
  choice: नहीं, बल्कि
  rationale: पुराने नाम और नए नाम के बीच स्पष्ट विरोध को हिन्दी के स्वाभाविक प्रतिकूल संयोजन से व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है; नाम से जुड़ा शब्दालंकार अगले उपवाक्य के ‘संघर्ष किया’ में आंशिक रूप से बना रहता है।
- source_word: שָׂרִיתָ
  choice: संघर्ष किया
  rationale: क्रिया में निहित जूझने या भिड़ने का अर्थ सहज और गरिमापूर्ण हिन्दी में देता है तथा इस्राएल नाम से जुड़े शब्दालंकार की ओर संकेत बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: तात्कालिक कथा-संदर्भ में एकवचन परमेश्वर अभिप्रेत है; शब्द की अन्य संभावित अर्थ-छायाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: אֲנָשִׁים
  choice: मनुष्यों
  rationale: परमेश्वर के साथ अलंकारिक विरोध में ‘मनुष्यों’ से मानव जाति का अर्थ स्पष्ट होता है और हिन्दी में ‘पुरुषों’ की अनावश्यक लैंगिक संकीर्णता से बचा जाता है।
- source_word: וַתּוּכָל
  choice: प्रबल हुए
  rationale: संघर्ष में सफल ठहरने का भाव देता है, पर पूर्ण विजय या विनाश का अर्थ अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: नामकरण-वाक्य में אֱלֹהִים का अभिप्राय
  choice: परमेश्वर
  alternative: दैवी प्राणी या स्वर्गीय प्राणी
  rationale: कथा याकूब के रहस्यमय मल्लयुद्ध को परमेश्वर से हुई मुठभेड़ के रूप में प्रस्तुत करती है; मुख्य पाठ में ‘परमेश्वर’ उस धार्मिक तनाव को बनाए रखता है, जबकि आकृति की पहचान से जुड़ी भाषिक अस्पष्टता पादटिप्पणी में दी गई है।
- issue: אֲנָשִׁים का विस्तार
  choice: मनुष्यों
  alternative: लोगों या पुरुषों
  rationale: यहाँ परमेश्वर और मानवों के बीच विरोध प्रमुख है। ‘मनुष्यों’ से स्रोत का बहुवचन और व्यापक मानव-संदर्भ दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नहीं, बल्कि’ नाम-परिवर्तन की औपचारिक घोषणा को स्पष्ट करता है; ‘संघर्ष किया’ और ‘प्रबल हुए’ मूल की संक्षिप्तता तथा धार्मिक तनाव को बनाए रखते हैं।
