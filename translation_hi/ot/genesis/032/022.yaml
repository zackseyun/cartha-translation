base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/022.yaml
  text: So the gift passed on ahead of him[a], but he himself stayed that night in the camp.
translation:
  language: hi
  text: इस तरह वह भेंट उससे आगे चली गई[a], लेकिन वह स्वयं उस रात छावनी में ठहरा रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपहार।” इब्रानी מִנְחָה का अर्थ भेंट, उपहार, कर या अर्पण हो सकता है; यहाँ इसका आशय उस भेंट से है जिसे याकूब ने एसाव के पास आगे भेजा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲבֹר
  choice: चली गई
  rationale: यहाँ עבר का अर्थ कथा के क्रम में आगे बढ़ना है; सीमा या नदी पार करने का भाव इस उपवाक्य में स्पष्ट नहीं है।
- source_word: הַמִּנְחָה
  choice: भेंट
  rationale: संदर्भ में यह याकूब द्वारा एसाव के लिए आगे भेजी गई भेंट है, न कि उपासना-संबंधी अर्पण।
- source_word: עַל־פָּנָיו
  choice: उससे आगे
  rationale: शाब्दिक मुहावरा ‘उसके मुख के आगे’ यहाँ याकूब से पहले आगे जाने का अर्थ देता है।
- source_word: וְהוּא
  choice: लेकिन वह स्वयं
  rationale: व्यक्त सर्वनाम भेंट और याकूब के बीच विरोध को उभारता है।
- source_word: לָן
  choice: ठहरा रहा
  rationale: क्रिया का अर्थ रात बिताना या रात भर ठहरना है; निकट के ‘उस रात’ के साथ यह स्वाभाविक हिंदी है।
- source_word: בַּלַּיְלָה הַהוּא
  choice: उस रात
  rationale: समय-सूचक वाक्यांश का सीधा और स्वाभाविक हिंदी रूप।
- source_word: בַּמַּחֲנֶה
  choice: छावनी में
  rationale: מַחֲנֶה के लिए ‘छावनी’ यहाँ अस्थायी पड़ाव या डेरे के स्थान को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
