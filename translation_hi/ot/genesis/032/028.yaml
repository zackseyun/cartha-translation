  text: And he said to him, “What is your name?” And he said, “Jacob.”
translation:
  language: hi
  text: तब उसने उससे कहा, “तुम्हारा नाम क्या है?” उसने कहा, “याकूब।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने…कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है। ‘तब’ हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘कहा’ सामान्य क्रिया אמר के अर्थ को बनाए रखता है।
- source_word: אֵלָיו
  choice: उससे
  rationale: אֶל के साथ तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय संबोधित पुरुष की ओर वचन की दिशा बताता है; हिन्दी में ‘उससे कहा’ स्वाभाविक प्रयोग है।
- source_word: מַה שְּׁמֶךָ
  choice: तुम्हारा नाम क्या है?
  rationale: इब्रानी में शब्दशः ‘क्या [है] तुम्हारा नाम’; हिन्दी में यही पूर्ण और सहज प्रश्नवाचक रूप है।
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: उत्तर के संदर्भ में भी मूल क्रिया साधारण ‘कहना’ है; ‘उत्तर दिया’ के बजाय ‘कहा’ स्रोत की शब्द-संगति बनाए रखता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: व्यक्तिवाचक नाम को हिन्दी में प्रचलित बाइबलीय रूप ‘याकूब’ के रूप में लिप्यंतरित किया गया है।
