  language: en
  yaml_path: translation/ot/genesis/032/018.yaml
  text: And he commanded the first one, saying, “When Esau my brother meets you and asks you, ‘Whose are you, and where are you going, and whose are these before you?’...”
translation:
  language: hi
  text: उसने पहले सेवक को यह आज्ञा दी, “जब मेरा भाई एसाव तुमसे मिले और तुमसे पूछे, ‘तुम किसके हो? कहाँ जा रहे हो? और ये जो तुम्हारे आगे हैं, किसके हैं?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִאשׁוֹן
  choice: पहले सेवक
  rationale: संदर्भ में यह पशुओं के पहले झुंड के साथ चलने वाला सेवक है; केवल ‘पहले’ कहना हिंदी में अधूरा लगता है।
- source_word: לְמִי אַתָּה
  choice: तुम किसके आदमी हो?
  rationale: शाब्दिक अर्थ ‘तुम किसके हो?’ है; आधुनिक हिंदी में यह स्वामी अथवा संबद्धता पूछने का स्वाभाविक और स्पष्ट ढंग है।
- source_word: וְאָנָה תֵלֵךְ
  choice: कहाँ जा रहे हो?
  rationale: गंतव्य पूछने वाले इब्रानी वाक्यांश का सहज आधुनिक हिंदी रूप।
- source_word: וּלְמִי אֵלֶּה לְפָנֶיךָ
  choice: और तुम्हारे आगे ये पशु किसके हैं?
  rationale: ‘ये’ का संकेत प्रसंगानुसार पशुओं के झुंडों की ओर है; ‘तुम्हारे आगे’ मूल की स्थान-संबंधी अभिव्यक्ति को सुरक्षित रखता है।
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: क्रिया का अर्थ निर्देश अथवा आदेश देना है; यहाँ ‘आज्ञा दी’ गरिमापूर्ण और स्वाभाविक है।
