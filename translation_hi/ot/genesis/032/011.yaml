source:
  edition: WLC
  text: קָטֹ֜נְתִּי מִ/כֹּ֤ל הַ/חֲסָדִים֙ וּ/מִ/כָּל הָ֣/אֱמֶ֔ת אֲשֶׁ֥ר עָשִׂ֖יתָ אֶת עַבְדֶּ֑/ךָ כִּ֣י בְ/מַקְלִ֗/י עָבַ֨רְתִּי֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה וְ/עַתָּ֥ה הָיִ֖יתִי לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/011.yaml
  text: I am unworthy of all the steadfast love and all the faithfulness that you have shown to your servant[a], for with my staff I crossed this Jordan[c][b], and now I have become two camps.
translation:
  language: hi
  text: तूने अपने दास के प्रति जितनी अटल करुणा और जितनी विश्वासयोग्यता दिखाई है, मैं उस सब के योग्य नहीं हूँ[a]; क्योंकि मैं अपनी लाठी के सहारे इस यरदन को पार कर गया था[b], और अब मेरे दो दल हो गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “मैं तेरी सारी अटल करुणा और सारी विश्वासयोग्यता से छोटा हूँ।” यह इब्रानी मुहावरा परमेश्वर की उदारता के सामने विनम्रता प्रकट करता है।'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप: “अपनी लाठी के साथ मैंने इस यरदन को पार किया था।”'
    reason: literal_rendering
lexical_decisions:
- source_word: קָטֹנְתִּי
  choice: मैं उस सब के योग्य नहीं हूँ
  rationale: शाब्दिक अर्थ ‘मैं छोटा हूँ/हो गया हूँ’ है; यहाँ परमेश्वर की उदारता के सामने विनम्र आत्म-स्वीकार व्यक्त होता है। आधुनिक हिन्दी में ‘योग्य नहीं हूँ’ इस मुहावरे का भाव स्वाभाविक रूप से देता है।
- source_word: הַחֲסָדִים
  choice: जितनी अटल करुणा
  rationale: חסד परमेश्वर की स्थिर, निष्ठावान कृपा या करुणा को दर्शाता है। बहुवचन का संकेत ‘जितनी...की’ में उसके अनेक ठोस उपकारों के रूप में व्यक्त होता है।
- source_word: הָאֱמֶת
  choice: जितनी विश्वासयोग्यता
  rationale: חסד के साथ युग्म में אמת का अर्थ अमूर्त ‘सत्य’ से अधिक भरोसेमंदी और निष्ठा है; ‘विश्वासयोग्यता’ दोनों पदों का भेद बनाए रखती है।
- source_word: עָשִׂיתָ אֶת עַבְדֶּךָ
  choice: तूने अपने दास पर ... की / दिखाई है
  rationale: शाब्दिक रूप ‘अपने दास के साथ/लिए किया’ है। हिन्दी में करुणा ‘करना’ और विश्वासयोग्यता ‘दिखाना’ स्वाभाविक सहप्रयोग हैं; ‘दास’ मूल की विनम्र संबोधन-भाषा को बनाए रखता है।
- source_word: בְמַקְלִי
  choice: मेरे पास केवल मेरी लाठी थी
  rationale: शाब्दिक रूप ‘अपनी लाठी के साथ’ है। प्रसंग में लाठी याकूब की उस समय की अल्प संपत्ति दिखाती है; हिन्दी में ‘केवल’ निहित विरोध को स्पष्ट और स्वाभाविक करता है।
- source_word: עָבַרְתִּי אֶת הַיַּרְדֵּן הַזֶּה
  choice: मैंने इस यरदन को पार किया था
  rationale: ‘इस’ निकट-संकेतक הַזֶּה को सुरक्षित रखता है। पूर्वकालिक ‘किया था’ वर्तमान स्थिति के साथ समयगत विरोध स्पष्ट करता है।
- source_word: הָיִיתִי לִשְׁנֵי מַחֲנוֹת
  choice: मैं दो दलों में बँट गया हूँ
  rationale: शाब्दिक रूप ‘मैं दो छावनियाँ/दल हो गया हूँ’ है। आसपास के वर्णन में याकूब ने अपने लोगों और संपत्ति को दो दलों में बाँटा था; हिन्दी में यह अभिव्यक्ति अर्थ को स्पष्ट रखते हुए सामूहिक आत्म-संदर्भ को बनाए रखती है।
theological_decisions:
- issue: חסד और אמת द्वारा परमेश्वर के व्यवहार का वर्णन
  choice: अटल करुणा और विश्वासयोग्यता
  alternative: वाचा की निष्ठा और सत्य
  rationale: चुना हुआ युग्म परमेश्वर की स्थिर कृपा और भरोसेमंद निष्ठा—दोनों अलग किन्तु संबद्ध धारणाओं—को व्यक्त करता है। ‘वाचा’ मूल पद में प्रत्यक्ष नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- issue: קָטֹנְתִּי में याकूब की विनम्रता
  choice: मैं उस सब के योग्य नहीं हूँ
  alternative: मैं उस सब से बहुत छोटा हूँ
  rationale: यह कथन परमेश्वर के अनुग्रह के सामने अपनी अयोग्यता का स्वीकार है, न कि मनुष्य के मूल्य पर कोई व्यवस्थित धर्मशास्त्रीय घोषणा। विकल्प शाब्दिक रूप को अधिक निकटता से दिखाता है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। परमेश्वर के लिए एकवचन आत्मीय ‘तू’ और याकूब के लिए ‘दास’ बाइबिलीय संबोधन को बनाए रखते हैं। ‘अटल करुणा’ तथा ‘विश्वासयोग्यता’ मूल के दो भिन्न शब्दों को बिना सांप्रदायिक विस्तार के स्पष्ट करते हैं।
