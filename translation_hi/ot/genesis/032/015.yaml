- source_word: אֵילִים
  choice: मेढ़े
  rationale: यह नर भेड़ों के लिए प्रचलित, सटीक हिन्दी शब्द है और मूल की प्रजनन-योग्य नर-मादा जोड़ी की संरचना बनाए रखता है।
