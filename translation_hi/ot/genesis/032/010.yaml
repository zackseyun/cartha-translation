id: GEN.32.10
reference: Genesis 32:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ יַעֲקֹב֒ אֱלֹהֵי֙ אָבִ֣/י אַבְרָהָ֔ם וֵ/אלֹהֵ֖י אָבִ֣/י יִצְחָ֑ק יְהוָ֞ה הָ/אֹמֵ֣ר אֵלַ֗/י שׁ֧וּב לְ/אַרְצְ/ךָ֛ וּ/לְ/מוֹלַדְתְּ/ךָ֖ וְ/אֵיטִ֥יבָה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/010.yaml
  text: And Jacob said[a], “O God of my father Abraham and God of my father Isaac, O Yahweh, who said to me, ‘Return to your land and to your kindred[b], and I will do you good,’”
translation:
  language: hi
  text: और याकूब ने कहा, “हे मेरे पिता अब्राहम के परमेश्वर और मेरे पिता इसहाक के परमेश्वर, हे याहवे, तूने मुझसे कहा था, ‘अपने देश और अपने कुटुम्बियों[a] के पास लौट जा, और मैं तेरी भलाई करूँगा[b]।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी जन्मभूमि।” इब्रानी शब्द परिवार या वंश-समुदाय और मूल-स्थान, दोनों का बोध करा सकता है।
    reason: lexical_ambiguity
  - marker: b
    text: 'शाब्दिक रूप के निकट: “मैं तेरे साथ भलाई करूँगा”; इसका अर्थ “मैं तेरा भला करूँगा” या “मैं तेरे साथ अच्छा व्यवहार करूँगा” भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב
  choice: और याकूब ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘और’ इब्रानी कथात्मक प्रवाह को बिना अनावश्यक कालगत व्याख्या के बनाए रखता है।
- source_word: אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק
  choice: हे मेरे पिता अब्राहम के परमेश्वर और मेरे पिता इसहाक के परमेश्वर
  rationale: संबंधवाचक रचना और प्रार्थना में प्रत्यक्ष संबोधन दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: הָאֹמֵר אֵלַי
  choice: तूने मुझसे कहा था
  rationale: संज्ञार्थक कृदंत परमेश्वर को पहले दिए गए आदेश के वक्ता के रूप में बताता है; प्रत्यक्ष प्रार्थना में हिन्दी का द्वितीय पुरुष रूप अधिक स्वाभाविक है।
- source_word: שׁוּב לְאַרְצְךָ
  choice: अपने देश ... लौट जा
  rationale: שׁוּב का आदेशात्मक अर्थ ‘लौटना’ है और אֶרֶץ यहाँ पैतृक भूभाग या देश को सूचित करता है।
- source_word: וּלְמוֹלַדְתְּךָ
  choice: और अपने कुटुम्बियों के पास
  rationale: מוֹלֶדֶת वंशगत समुदाय, नातेदारी अथवा मूल-स्थान को सूचित कर सकता है; प्रसंग में पारिवारिक समुदाय मुख्य है, जबकि अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: וְאֵיטִיבָה עִמָּךְ
  choice: और मैं तेरी भलाई करूँगा
  rationale: יטב का हिफ़ील रूप עִם के साथ हितकारी व्यवहार या किसी का भला करने का भाव देता है; यह हिन्दी में स्वाभाविक रहते हुए मूल अर्थ के निकट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे किसी उपाधि से बदले बिना प्रस्तुत करता है।
- issue: וְאֵיטִיבָה עִמָּךְ में प्रतिज्ञा का स्वरूप
  choice: मैं तेरी भलाई करूँगा
  alternative: मैं तेरे साथ भलाई करूँगा; मैं तेरे साथ अच्छा व्यवहार करूँगा
  rationale: वाक्य को केवल सामान्य शिष्ट व्यवहार तक सीमित न करके परमेश्वर की हितकारी प्रतिज्ञा के व्यापक भाव को रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थना-रजिस्टर अपनाया गया है। परमेश्वर के लिए निकट और पारंपरिक एकवचन संबोधन ‘तू/तेरी’ रखा गया है; वाक्यरचना साधारण पाठक के लिए स्वाभाविक है और मूल की वास्तविक शब्दार्थगत अस्पष्टताओं को पादटिप्पणियों में सुरक्षित रखती है।
