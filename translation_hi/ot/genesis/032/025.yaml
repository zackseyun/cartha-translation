id: GEN.32.25
reference: Genesis 32:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּוָּתֵ֥ר יַעֲקֹ֖ב לְ/בַדּ֑/וֹ וַ/יֵּאָבֵ֥ק אִישׁ֙ עִמּ֔/וֹ עַ֖ד עֲל֥וֹת הַ/שָּֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/025.yaml
  text: And Jacob was left alone[b][a], and a man wrestled with him until the dawn came up.
translation:
  language: hi
  text: और याकूब अकेला रह गया। तब एक पुरुष[a] भोर होने तक[b] उससे कुश्ती लड़ता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ “एक पुरुष” है। आगे का प्रसंग और होशे 12:4 उसकी पहचान पर अधिक प्रकाश डालते हैं।
    reason: cross_reference
  - marker: b
    text: 'शाब्दिक अर्थ: “भोर के उदय होने तक।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּתֵר
  choice: रह गया
  rationale: निफ़अल रूप का प्रसंगानुकूल अर्थ है कि दूसरों के पार चले जाने के बाद याकूब अकेला रह गया; यह स्वाभाविक हिन्दी में परिणाम और उसकी एकाकी अवस्था दोनों व्यक्त करता है।
- source_word: לְבַדּוֹ
  choice: अकेला
  rationale: यह याकूब के अपने आप रह जाने और कथा में उसके एकाकीपन पर दिए गए बल को संक्षेप में व्यक्त करता है।
- source_word: וַיֵּאָבֵק
  choice: कुश्ती लड़ता रहा
  rationale: दुर्लभ क्रिया यहाँ शारीरिक रूप से गुत्थमगुत्था होकर कुश्ती लड़ने को सूचित करती है; अपूर्ण अवधि को ‘रहा’ व्यक्त करता है।
- source_word: אִישׁ
  choice: एक पुरुष
  rationale: इब्रानी पाठ इस रहस्यमय पात्र को इस पद में केवल ‘एक पुरुष’ कहता है; यही अनुवाद उसकी पहचान को समय से पहले निश्चित नहीं करता।
- source_word: עִמּוֹ
  choice: उससे
  rationale: हिन्दी में ‘उससे कुश्ती लड़ना’ स्वाभाविक रूप से पारस्परिक संघर्ष का अर्थ देता है।
- source_word: עַד עֲלוֹת הַשָּׁחַר
  choice: भोर होने तक
  rationale: शाब्दिक बिंब ‘भोर के उदय होने तक’ है; ‘भोर होने तक’ वर्तमान हिन्दी में स्वाभाविक और अर्थ की दृष्टि से निकट है।
theological_decisions:
- issue: कुश्ती लड़ने वाले אִישׁ की पहचान
  choice: मुख्य पाठ में ‘एक पुरुष’
  alternative: एक स्वर्गदूत; मनुष्य के रूप में प्रकट परमेश्वर/यहोवा
  rationale: इस पद में पात्र को केवल אִישׁ कहा गया है। आगे का प्रसंग और होशे 12:4 उसकी पहचान पर अधिक प्रकाश डालते हैं, पर यहाँ अनुवाद को कथा का रहस्य और धार्मिक तनाव बनाए रखना चाहिए।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण मानक हिन्दी। ‘कुश्ती लड़ता रहा’ संघर्ष की लगातार अवधि व्यक्त करता है। वाक्य-विभाजन हिन्दी की सहज कथाशैली के लिए किया गया है; मूल के घटनाक्रम और अर्थ को सुरक्षित रखा गया है।
