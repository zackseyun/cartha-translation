id: GEN.32.26
reference: Genesis 32:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֗רְא כִּ֣י לֹ֤א יָכֹל֙ ל֔/וֹ וַ/יִּגַּ֖ע בְּ/כַף יְרֵכ֑/וֹ וַ/תֵּ֨קַע֙ כַּף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/הֵֽאָבְק֖/וֹ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/026.yaml
  text: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
translation:
  language: hi
  text: जब उसने देखा कि वह उस पर प्रबल नहीं हो सका[a], तब उसने उसकी जाँघ के जोड़[b] को छुआ; और उसके साथ कुश्ती लड़ते समय याकूब की जाँघ का जोड़ उतर गया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह उसे परास्त नहीं कर सका।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “उसकी जाँघ की खोखली जगह”; आशय जाँघ और कूल्हे के जोड़ से है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी सर्वनाम अस्पष्ट बने रहते हैं; यह पद याकूब के प्रतिद्वंद्वी की पहचान को फिर से स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: जब उसने देखा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; प्रसंग में इसका कालगत संबंध स्वाभाविक हिन्दी में ‘जब’ से स्पष्ट होता है।
- source_word: לֹא יָכֹל לוֹ
  choice: वह उस पर प्रबल नहीं हो सका
  rationale: יכל + ל प्रतिद्वंद्वी के संबंध में सफल न हो पाने को व्यक्त करता है। ‘प्रबल नहीं हो सका’ कुश्ती के प्रसंग के अनुकूल है और पूर्ण सामर्थ्यहीनता का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: וַיִּגַּע
  choice: उसने … को छुआ
  rationale: נגע का सामान्य अर्थ ‘छूना’ है। परिणाम गंभीर होने पर भी मूल पाठ के हल्के संपर्क-सूचक क्रिया-पद को सुरक्षित रखा गया है।
- source_word: בְּכַף יְרֵכוֹ
  choice: उसकी जाँघ के जोड़
  rationale: כף־ירך यहाँ जाँघ और कूल्हे के जोड़ की खोखली जगह को सूचित करता है। ‘जाँघ का जोड़’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: וַתֵּקַע
  choice: उतर गया
  rationale: इस प्रसंग में क्रिया जोड़ के अपने स्थान से हट जाने को बताती है। ‘जोड़ उतर गया’ स्वाभाविक और सटीक हिन्दी अभिव्यक्ति है।
- source_word: כַּף יֶרֶךְ יַעֲקֹב
  choice: याकूब की जाँघ का जोड़
  rationale: पहले वाक्यांश के साथ शब्दगत संगति रखता है और मूल पाठ में याकूब का स्पष्ट नाम भी बनाए रखता है।
- source_word: בְּהֵאָבְקוֹ עִמּוֹ
  choice: उसके साथ कुश्ती लड़ते समय
  rationale: पूर्वसर्ग सहित infinitive construct समकालिक क्रिया दर्शाता है। यह हिन्दी अभिव्यक्ति सहज है और सर्वनामों के संदर्भ को अनावश्यक रूप से तय नहीं करती।
theological_decisions:
- issue: कुश्ती के दृश्य में ‘वह’ और ‘उस’ सर्वनामों का संदर्भ
  choice: मूल इब्रानी की सर्वनामगत अस्पष्टता को मुख्य पाठ में बनाए रखा गया है; प्रतिद्वंद्वी की पहचान यहाँ स्पष्ट नहीं की गई।
  alternative: कर्ता को स्पष्ट रूप से उस पुरुष, स्वर्गदूत या परमेश्वर के रूप में पहचानना।
  rationale: इस पद में मूल पाठ फिर से प्रतिद्वंद्वी का नाम या पद नहीं बताता। व्यापक कथा उसकी पहचान और महत्त्व को क्रमशः खोलती है; इसलिए अनुवाद को इस पद की वास्तविक धर्मवैचारिक तनाव और अस्पष्टता को समय से पहले हल नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘छुआ’ मूल क्रिया की संयत शक्ति बनाए रखता है, जबकि ‘जोड़ उतर गया’ परिणाम को साधारण पाठक के लिए स्पष्ट करता है। सर्वनामगत अस्पष्टता जानबूझकर सुरक्षित रखी गई है।
