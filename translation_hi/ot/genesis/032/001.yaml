  text: וַ/יַּשְׁכֵּ֨ם לָבָ֜ן בַּ/בֹּ֗קֶר וַ/יְנַשֵּׁ֧ק לְ/בָנָ֛י/ו וְ/לִ/בְנוֹתָ֖י/ו וַ/יְבָ֣רֶךְ אֶתְ/הֶ֑ם וַ/יֵּ֛לֶךְ וַ/יָּ֥שָׁב לָבָ֖ן לִ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/001.yaml
  text: Laban rose early in the morning[a], kissed his sons and his daughters, and blessed them. Then Laban departed and returned to his place.
translation:
  language: hi
  text: लाबान सुबह तड़के उठा। उसने अपने बेटों और बेटियों[a] को चूमा और उन्हें आशीर्वाद दिया। फिर लाबान चला गया और अपने स्थान पर लौट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “उसके बेटे और उसकी बेटियाँ” है। सन्दर्भ में ये शब्द उसके वंशजों, अर्थात् सम्भवतः उसके पोते-पोतियों, को सूचित करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: सुबह तड़के उठा
  rationale: हिफ़िल क्रिया שׁכם के जल्दी उठने के भाव और בַּבֹּקֶר के समय-सूचक अर्थ, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיְנַשֵּׁק
  choice: चूमा
  rationale: यह पारिवारिक विदाई के चुम्बन को सीधे और सहज रूप में व्यक्त करता है।
- source_word: לְבָנָיו וְלִבְנוֹתָיו
  choice: अपने बेटों और बेटियों
  rationale: मूल इब्रानी के लिंग-विशिष्ट रिश्तों को बनाए रखा गया है; व्यापक वंशज-संबंध की सम्भावना पाद-टिप्पणी में स्पष्ट की गई है।
- source_word: וַיְבָרֶךְ אֶתְהֶם
  choice: उन्हें आशीर्वाद दिया
  rationale: ברך के सामान्य अर्थ ‘आशीर्वाद देना’ को विदाई मात्र में सीमित किए बिना सुरक्षित रखता है।
- source_word: וַיֵּלֶךְ
  choice: चला गया
  rationale: कथानक में लाबान के प्रस्थान को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: अपने स्थान पर लौट गया
  rationale: שׁוב के ‘लौटना’ और מקום के शाब्दिक ‘स्थान’ को सुरक्षित रखता है; ‘घर’ जैसी अतिरिक्त विशिष्टता नहीं जोड़ता।
theological_decisions:
- issue: लिंग-विशिष्ट पारिवारिक सम्बोधन और वंशज-सूचक प्रयोग
  choice: अपने बेटों और बेटियों
  alternative: अपने बच्चों / अपने नाती-पोतों और बेटियों
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘बेटों’ और ‘बेटियों’ कहता है। मुख्य पाठ में इन्हें बनाए रखने से मूल अभिव्यक्ति सुरक्षित रहती है, जबकि सन्दर्भगत व्यापक अर्थ को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे वाक्य इब्रानी कथानक की क्रमिक गति को स्पष्ट करते हैं; ‘अपने स्थान’ मूल पाठ की अपेक्षाकृत खुली अभिव्यक्ति को बनाए रखता है।
