  register: आधुनिक मानक हिन्दी का गरिमापूर्ण बाइबलीय गद्य। परमेश्वर से प्रत्यक्ष एकवचन संबोधन के लिए ‘तू/तेरी’ रखा गया है। वाक्य स्रोत की प्रार्थनात्मक अपील, प्रतिज्ञा पर बल और रेत की सामूहिक उपमा को बनाए रखता है।
