- source_word: הֵיטֵב אֵיטִיב עִמָּךְ
  choice: मैं निश्चय ही तेरी भलाई करूँगा
  rationale: क्रियार्थक संज्ञा और सीमित क्रिया का मेल विशेष बल देता है; ‘निश्चय ही’ उस बल को बनाए रखता है। ‘भलाई करूँगा’ लाभकारी व्यवहार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְשַׂמְתִּי
  choice: और ... कर दूँगा
  rationale: यहाँ שׂים का अर्थ किसी वस्तु को रखना नहीं, बल्कि वंश को समुद्र की रेत के समान असंख्य बनाना है।
- source_word: זַרְעֲךָ
  choice: तेरे वंश
  rationale: זֶרַע सामूहिक एकवचन है और इस प्रसंग में याकूब से उत्पन्न भावी संतति को दर्शाता है। ‘वंश’ आधुनिक हिन्दी में संक्षिप्त और गरिमापूर्ण है; पादटिप्पणी में ‘सन्तान’ विकल्प दिया गया है।
- source_word: כְּחוֹל הַיָּם
  choice: समुद्र की रेत के समान
  rationale: यह इब्रानी उपमा को निकटता से और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: אֲשֶׁר לֹא יִסָּפֵר מֵרֹב
  choice: जो इतनी अधिक है कि गिनी नहीं जा सकती
  rationale: निफ़ाल रूप व्यावहारिक अगणनीयता व्यक्त करता है और מֵרֹב उसका कारण, अर्थात अत्यधिक मात्रा, बताता है। हिन्दी में यह संरचना कारण और परिणाम दोनों को स्पष्ट रखती है।
