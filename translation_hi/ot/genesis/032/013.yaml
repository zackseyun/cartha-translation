base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/013.yaml
  text: But you said[a], ‘I will surely do you good, and I will make your offspring like the sand of the sea[c][b], which cannot be counted because of its abundance.’
translation:
  language: hi
  text: परन्तु तूने कहा था[a], “मैं निश्चय ही तेरी भलाई करूँगा, और तेरी सन्तान[b] को समुद्र की रेत के समान कर दूँगा, जिसे बहुतायत के कारण गिना नहीं जा सकता[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में ‘मैं भलाई करूँगा’ के लिए एक विशेष बल देने वाली क्रिया-रचना है: “मैं निश्चय ही तेरी भलाई करूँगा।”'
    reason: source_emphasis
  - marker: b
    text: या “तेरे वंश को।” इब्रानी शब्द सामूहिक एकवचन है और पूरी भावी संतति को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या “जिसकी संख्या नहीं गिनी जा सकती।”
    reason: lexical_alternative
