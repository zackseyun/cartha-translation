source:
  edition: WLC
  text: וַ/יְצַ֤ו אֹתָ/ם֙ לֵ/אמֹ֔ר כֹּ֣ה תֹאמְר֔וּ/ן לַֽ/אדֹנִ֖/י לְ/עֵשָׂ֑ו כֹּ֤ה אָמַר֙ עַבְדְּ/ךָ֣ יַעֲקֹ֔ב עִם לָבָ֣ן גַּ֔רְתִּי וָ/אֵחַ֖ר עַד עָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/005.yaml
  text: 'And he commanded them[a], saying[c][b], “Thus you shall say to my lord Esau: ‘Thus says your servant Jacob: I have sojourned with Laban and have stayed until now.’”'
translation:
  language: hi
  text: 'उसने उन्हें आज्ञा देकर कहा, “तुम मेरे स्वामी एसाव से ऐसा कहना, ‘तुम्हारा सेवक[b] याकूब यह कहता है: मैं लाबान के साथ परदेशी के रूप में रहा हूँ[a] और अब तक वहीं रुका रहा हूँ।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परदेशी के रूप में रहा हूँ” का अनुवाद “प्रवासी के रूप में रहा हूँ” भी हो सकता है। मूल क्रिया किसी बाहरी व्यक्ति के रूप में निवास करने पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “तुम्हारा सेवक” एसाव के प्रति विनम्र आत्म-संबोधन है; इसका अर्थ यह आवश्यक नहीं कि याकूब सचमुच उसका दास था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: उसने उन्हें यह आज्ञा दी
  rationale: क्रिया צוה निर्देश की अपेक्षा अधिक प्रबल आदेश या आज्ञा देने का भाव रखती है; यह हिन्दी में स्वाभाविक भी है।
- source_word: כֹּה תֹאמְרוּן
  choice: तुम ... यह कहना
  rationale: כֹּה संदेश के ठीक शब्द प्रस्तुत करता है; आधुनिक हिन्दी में ‘यह कहना’ स्वाभाविक रूप से वही कार्य करता है।
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: मेरे स्वामी एसाव से
  rationale: ‘मेरे स्वामी’ एसाव के प्रति आदरसूचक सामाजिक संबोधन है, ईश्वरीय उपाधि नहीं; एसाव को समानाधिकरण में रखा गया है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: संदेशवाहक सूत्र को वर्तमान काल में रखना हिन्दी में उद्धृत संदेश के लिए स्वाभाविक है।
- source_word: עַבְדְּךָ
  choice: तुम्हारा सेवक
  rationale: संदर्भ में यह विनम्र आत्म-संबोधन है; ‘दास’ अनावश्यक रूप से वास्तविक दासत्व का अर्थ उभार सकता है।
- source_word: גַּרְתִּי
  choice: मैं ... परदेशी की तरह रहा हूँ
  rationale: גור किसी बाहरी व्यक्ति या अस्थायी निवासी के रूप में रहने का अर्थ दे सकता है; यह चयन उस सूक्ष्मता को स्पष्ट और आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: וָאֵחַר עַד עָתָּה
  choice: और अब तक वहीं ठहरा हुआ हूँ
  rationale: यहाँ אחר वर्तमान समय तक बने रहने का भाव देता है; ‘ठहरा हुआ हूँ’ उस निरंतर स्थिति को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: עַבְדְּךָ में सामाजिक विनम्रता और वास्तविक दासत्व
  choice: तुम्हारा सेवक
  alternative: तुम्हारा दास
  rationale: याकूब एसाव के सामने विनम्र कूटनीतिक भाषा बोल रहा है; पाठ अनिवार्यतः कानूनी दासत्व नहीं बताता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोहरे वाक्-परिचय को हिन्दी में कोलन और अंतर्निहित उद्धरण द्वारा स्पष्ट किया गया है; ‘स्वामी’ यहाँ मानवीय आदरसूचक पद है।
