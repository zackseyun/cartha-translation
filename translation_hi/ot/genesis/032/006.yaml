source:
  edition: WLC
  text: וַֽ/יְהִי לִ/י֙ שׁ֣וֹר וַ/חֲמ֔וֹר צֹ֖אן וְ/עֶ֣בֶד וְ/שִׁפְחָ֑ה וָֽ/אֶשְׁלְחָ/ה֙ לְ/הַגִּ֣יד לַֽ/אדֹנִ֔/י לִ/מְצֹא חֵ֖ן בְּ/עֵינֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/006.yaml
  text: I have oxen and donkeys[a], flocks, male servants and female servants, and I have sent to tell my lord, so that I may find favor in your eyes.
translation:
  language: hi
  text: “मेरे पास बैल और गधे, भेड़-बकरियों के झुंड, दास और दासियाँ[a] हैं। मैंने अपने स्वामी को यह बताने के लिए दूत भेजे हैं, ताकि आपकी दृष्टि में मुझे कृपा मिले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेवक और सेविकाएँ।” इब्रानी शब्द आश्रित अथवा बँधे हुए घरेलू सेवकों को भी सूचित कर सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִי
  choice: मेरे पास … हैं
  rationale: היה + ל possession व्यक्त करने वाला इब्रानी मुहावरा है। आधुनिक हिन्दी में ‘मेरे पास … हैं’ वर्तमान स्वामित्व को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שׁוֹר וַחֲמוֹר
  choice: बैल और गधे
  rationale: दोनों एकवचन रूप यहाँ संपत्ति की सामूहिक श्रेणियाँ बताते हैं; इसलिए हिन्दी में बहुवचन स्वाभाविक है। שׁוֹר के लिए ‘बैल’ मूल पशु-श्रेणी को ‘मवेशी’ से अधिक स्पष्ट रखता है।
- source_word: צֹאן
  choice: भेड़-बकरियों के झुंड
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ और बकरियों, का सामूहिक पद है। यह अनुवाद अर्थ को सामान्य पाठक के लिए स्पष्ट रखते हुए सामूहिकता भी बनाए रखता है।
- source_word: עֶבֶד וְשִׁפְחָה
  choice: दास और दासियाँ
  rationale: ये पद पुरुष और स्त्री आश्रित घरेलू श्रमिकों को अलग-अलग बताते हैं और इस संपत्ति-सूची में उनकी बँधी हुई सामाजिक स्थिति निहित है। ‘दास और दासियाँ’ लिंग-भेद तथा उस स्थिति को बनाए रखता है; कम स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: וָאֶשְׁלְחָה לְהַגִּיד
  choice: मैंने … यह बताने के लिए दूत भेजे हैं
  rationale: क्रिया ‘भेजा’ का कर्म प्रसंग में संदेश ले जाने वाले दूत हैं। हिन्दी में वाक्य पूरा और स्वाभाविक बनाने के लिए निहित कर्म ‘दूत’ स्पष्ट किया गया है; पूर्ण वर्तमान हाल में किए गए कार्य को दर्शाता है।
- source_word: לַאדֹנִי
  choice: अपने स्वामी को
  rationale: यह एसाव के लिए आदरसूचक और विनम्र सामाजिक संबोधन है, परमेश्वर के लिए उपाधि नहीं। ‘स्वामी’ उस अधीनतापूर्ण शिष्टाचार को सुरक्षित रखता है।
- source_word: לִמְצֹא חֵן בְּעֵינֶיךָ
  choice: ताकि आपकी दृष्टि में मुझे कृपा मिले
  rationale: यह अनुकूल स्वीकृति पाने का इब्रानी मुहावरा है। अनुवाद उद्देश्यसूचक अर्थ और ‘आपकी दृष्टि में’ वाली मूल छवि दोनों बनाए रखता है।
theological_decisions:
- issue: संपत्ति-सूची में עֶבֶד / שִׁפְחָה का अनुवाद
  choice: दास और दासियाँ
  alternative: सेवक और सेविकाएँ
  rationale: मूल पद घरेलू सेवा के साथ आश्रित अथवा बँधी हुई स्थिति भी व्यक्त कर सकते हैं। चूँकि यहाँ वे याकूब की संपत्ति की सूची में हैं, ‘दास और दासियाँ’ उस असुविधाजनक सामाजिक वास्तविकता को धुँधला नहीं करता। फिर भी पदों का सटीक कानूनी दर्जा इस वाक्य में निर्धारित नहीं है, इसलिए व्यापक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। याकूब की विनम्रता दिखाने के लिए ‘अपने स्वामी’ और आदरसूचक ‘आपकी’ प्रयुक्त हैं। मूल की संपत्ति-सूची का संक्षिप्त क्रम बनाए रखा गया है।
