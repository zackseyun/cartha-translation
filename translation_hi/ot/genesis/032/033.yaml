  text: עַל כֵּ֡ן לֹֽא יֹאכְל֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת גִּ֣יד הַ/נָּשֶׁ֗ה אֲשֶׁר֙ עַל כַּ֣ף הַ/יָּרֵ֔ךְ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י נָגַע֙ בְּ/כַף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/גִ֖יד הַ/נָּשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/033.yaml
  text: Therefore[a], to this day the sons of Israel do not eat the sinew of the hip, which is on the socket of the thigh[d][c][b], because he touched the socket of Jacob’s thigh at the sinew of the hip.
translation:
  language: hi
  text: इसी कारण आज तक इस्राएल के वंशज जाँघ के जोड़ पर स्थित उस स्नायु[a] को नहीं खाते, क्योंकि उसने याकूब की जाँघ के जोड़ को उस स्नायु के स्थान पर छुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी पद का सटीक शारीरिक अर्थ अनिश्चित है। इसे किसी विशेष स्नायु, कण्डरा या सायटिक नस से संबंधित माना जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: यह कारण और उससे चली आ रही प्रथा के बीच स्वाभाविक संबंध व्यक्त करता है।
- source_word: לֹא יֹאכְלוּ
  choice: नहीं खाते
  rationale: नकारात्मक अपूर्ण क्रिया यहाँ निरंतर प्रचलित रीति बताती है; हिन्दी का सामान्य वर्तमान काल इसे सहज रूप में व्यक्त करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के वंशज
  rationale: शाब्दिक पारिवारिक अर्थ को बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट करता है कि यहाँ इस्राएली समुदाय अभिप्रेत है।
- source_word: גִּיד הַנָּשֶׁה
  choice: उस नस
  rationale: גיד किसी डोरी-जैसे शारीरिक ऊतक को सूचित करता है, जबकि הנשה का सटीक शारीरिक आशय अनिश्चित है। मुख्य पाठ में सहज 'नस' रखा गया और अधिक विशिष्ट संभावनाएँ टिप्पणी में दी गईं।
- source_word: אֲשֶׁר עַל כַּף הַיָּרֵךְ
  choice: जाँघ के जोड़ पर की
  rationale: כף הירך को जाँघ-कूल्हे के जोड़ या उसके खोखले भाग के रूप में समझते हुए संक्षिप्त और स्वाभाविक हिन्दी दी गई है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: चलती आ रही प्रथा के लिए मानक और स्वाभाविक हिन्दी मुहावरा है।
- source_word: כִּי נָגַע
  choice: क्योंकि उसने ... छुआ था
  rationale: נגע का सामान्य अर्थ 'छूना' है; संदर्भ में स्पर्श प्रभावशाली था, फिर भी क्रिया को 'मारा' कहकर अधिक स्पष्ट नहीं किया गया।
- source_word: בְּכַף יֶרֶךְ יַעֲקֹב
  choice: याकूब की जाँघ के जोड़ पर
  rationale: पहले आए शारीरिक स्थान के अनुवाद से संगति रखी गई है।
theological_decisions:
- issue: उस पुरुष/दिव्य प्रतिद्वंद्वी की पहचान
  choice: सर्वनाम 'उसने' रखा गया
  alternative: परमेश्वर ने / स्वर्गदूत ने
  rationale: इस पद का हिब्रू केवल अंतर्निहित कर्ता देता है; उसकी पहचान को इस पद में अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। 'इस्राएल के पुत्र' की अत्यधिक शाब्दिकता के बजाय 'इस्राएल के वंशज' अपनाया गया। तकनीकी शारीरिक पहचान को मुख्य पाठ में निश्चित न करके स्रोत की अनिश्चितता सुरक्षित रखी गई है।
