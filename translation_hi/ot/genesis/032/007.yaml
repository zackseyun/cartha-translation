  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים אֶֽל יַעֲקֹ֖ב לֵ/אמֹ֑ר בָּ֤אנוּ אֶל אָחִ֨י/ךָ֙ אֶל עֵשָׂ֔ו וְ/גַם֙ הֹלֵ֣ךְ לִ/קְרָֽאתְ/ךָ֔ וְ/אַרְבַּע מֵא֥וֹת אִ֖ישׁ עִמּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/007.yaml
  text: The messengers returned to Jacob[a], saying, “We came to your brother, to Esau, and he is also coming to meet you, and four hundred men are with him.”
translation:
  language: hi
  text: दूत याकूब के पास लौट आए[a] और बोले, “हम आपके भाई, एसाव, के पास पहुँचे। वह भी आपसे मिलने आ रहा है, और उसके साथ चार सौ पुरुष हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, इस संदर्भ में कम संभावित अर्थ, “स्वर्गदूत याकूब के पास लौट आए।” इब्रानी शब्द מַלְאָכִים का अर्थ “दूत” या “स्वर्गदूत” दोनों हो सकता है, पर यहाँ इसका संकेत उन प्रतिनिधियों की ओर है जिन्हें याकूब ने एसाव के पास भेजा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: लौट आए
  rationale: שׁוב का वय्यिक्तोल रूप कथा में पूरी हुई भूतकालीन क्रिया बताता है; ‘लौट आए’ स्वाभाविक हिन्दी है और भेजे गए दूतों के याकूब के पास वापस आने का अर्थ स्पष्ट करता है।
- source_word: הַמַּלְאָכִים
  choice: दूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। निकट संदर्भ में ये वही मानवीय प्रतिनिधि हैं जिन्हें याकूब ने एसाव के पास भेजा था, इसलिए मुख्य पाठ में ‘दूत’ उपयुक्त है।
- source_word: לֵאמֹר
  choice: और बोले
  rationale: यह प्रत्यक्ष कथन का परिचय देता है। हिन्दी कथात्मक शैली में ‘और बोले’ ‘कहते हुए’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: בָּאנוּ
  choice: हम ... गए थे
  rationale: בוא का मूल भाव आना/पहुँचना है, पर लौटकर याकूब को रिपोर्ट देते दूतों के दृष्टिकोण को स्वाभाविक हिन्दी में ‘हम ... गए थे’ कहना अधिक सहज है; इससे उनके एसाव तक पहुँचने का आशय बना रहता है।
- source_word: אָחִיךָ אֶל־עֵשָׂו
  choice: आपके भाई एसाव के पास
  rationale: दूसरा אֶל ‘आपके भाई’ की पहचान एसाव के रूप में करता है। हिन्दी में संयुक्त पदबंध मूल का संबंध और पहचान दोनों स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְגַם הֹלֵךְ לִקְרָאתְךָ
  choice: वह भी आपसे मिलने आ रहा है
  rationale: גַּם की योगात्मक शक्ति ‘भी’ से और participle הֹלֵךְ की जारी क्रिया ‘आ रहा है’ से व्यक्त होती है; לִקְרָאתְךָ को तटस्थ ‘आपसे मिलने’ रखा गया है।
- source_word: וְאַרְבַּע מֵאוֹת אִישׁ עִמּוֹ
  choice: और उसके साथ चार सौ पुरुष हैं
  rationale: संख्या, पुरुषवाचक संज्ञा और साथ होने के संबंध को सीधे रखा गया है। ‘पुरुष’ मूल के אִישׁ को सटीक रूप से दर्शाता है और दल के स्वरूप का अनावश्यक अर्थ-विस्तार नहीं करता।
theological_decisions:
- issue: הַמַּלְאָכִים की मानवीय या स्वर्गिक पहचान
  choice: मुख्य पाठ में ‘दूत’
  alternative: ‘स्वर्गदूत’
  rationale: यद्यपि इब्रानी शब्द दोनों अर्थ रख सकता है, यहाँ ये पिछले संदर्भ में याकूब द्वारा एसाव के पास भेजे गए मानवीय प्रतिनिधि हैं। शब्दगत वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। याकूब को संबोधन में ‘आप’ रखा गया है। इब्रानी की पुनरुक्त ‘आपके भाई, एसाव के पास’ को हिन्दी में स्वाभाविक ‘आपके भाई एसाव के पास’ किया गया है; सूचना का क्रम और एसाव के साथ चार सौ पुरुषों की तनावपूर्ण सूचना सुरक्षित है।
