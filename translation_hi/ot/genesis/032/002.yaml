  yaml_path: translation/ot/genesis/032/002.yaml
  text: And Jacob went on his way[b][a], and the angels of God met him.
translation:
  language: hi
  text: और याकूब अपने मार्ग पर आगे बढ़ा, और परमेश्वर के स्वर्गदूत उससे आ मिले[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे उससे मिले” अथवा “उन्होंने उसका सामना किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַעֲקֹב
  choice: और याकूब
  rationale: וְ को सामान्य कथात्मक संयोजक के रूप में ‘और’ से व्यक्त किया गया है; इससे कथाप्रवाह बना रहता है और कोई अतिरिक्त अर्थ नहीं जोड़ा जाता।
- source_word: הָלַךְ לְ/דַרְכּ/וֹ
  choice: अपने मार्ग पर आगे बढ़ा
  rationale: इब्रानी पदबंध का भाव याकूब की यात्रा जारी रहने का है। ‘अपने मार्ग पर आगे बढ़ा’ आधुनिक हिंदी में स्वाभाविक है और केवल ‘चला’ की अपेक्षा निरंतरता को स्पष्ट करता है।
- source_word: וַ/יִּפְגְּעוּ ב/וֹ
  choice: उससे आ मिले
  rationale: פגע ב का अर्थ ‘मिलना’, ‘सामना होना’ या ‘आ पड़ना’ हो सकता है। ‘आ मिले’ प्रसंग में स्वाभाविक है और न तो शत्रुता न ही आकस्मिकता को अनावश्यक रूप से निश्चित करता है।
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: परमेश्वर के स्वर्गदूत
  rationale: מַלְאָךְ का मूल अर्थ ‘दूत’ है, पर अगले पद में ‘परमेश्वर की छावनी’ का उल्लेख अलौकिक प्राणियों की ओर संकेत करता है। हिंदी में ‘स्वर्गदूत’ इस आशय को स्पष्ट और प्रचलित ढंग से व्यक्त करता है।
theological_decisions:
- issue: מַלְאֲכֵי אֱלֹהִים का अभिप्राय
  choice: परमेश्वर के स्वर्गदूत
  alternative: परमेश्वर के दूत
  rationale: शब्द अपने आप में मानवीय या स्वर्गीय दूत दोनों के लिए प्रयुक्त हो सकता है, किंतु उत्पत्ति 32:3 में स्थान को ‘परमेश्वर की छावनी’ कहे जाने से यहाँ स्वर्गीय दूत अधिक संभावित हैं। फिर भी पद में उनकी प्रकृति या कार्य के विषय में इससे अधिक नहीं जोड़ा गया।
- issue: וַיִּפְגְּעוּ בוֹ में भेंट का स्वरूप
  choice: उससे आ मिले
  alternative: उनका उससे सामना हुआ
  rationale: इब्रानी क्रिया भेंट या सामना होने को व्यक्त करती है, पर यह स्पष्ट नहीं करती कि घटना आकस्मिक थी या जानबूझकर। मुख्य पाठ इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मार्ग पर आगे बढ़ा’ यात्रा की निरंतरता व्यक्त करता है; ‘स्वर्गदूत’ सामान्य हिंदी पाठक के लिए संदर्भानुकूल और स्पष्ट है।
