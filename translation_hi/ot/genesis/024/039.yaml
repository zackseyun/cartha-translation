base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/039.yaml
  text: And I said to my master[a], ‘Perhaps the woman will not follow me.’
translation:
  language: hi
  text: तब मैंने अपने स्वामी से कहा, “हो सकता है कि वह स्त्री मेरे साथ न आए।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे पीछे न चले।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने ... कहा
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रमिक कथन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל אֲדֹנִי
  choice: अपने स्वामी से
  rationale: यहाँ प्रथम पुरुष प्रत्यय सहित אָדוֹן सेवक के मानवीय स्वामी अब्राहम को सूचित करता है; ‘स्वामी’ संबंध को गरिमापूर्ण और स्पष्ट रखता है।
- source_word: אֻלַי
  choice: हो सकता है कि
  rationale: यह संभावना या अनिश्चितता व्यक्त करता है और आधुनिक हिन्दी में सहज है।
- source_word: הָאִשָּׁה
  choice: वह स्त्री
  rationale: मूल संज्ञा का अर्थ ‘स्त्री’ है; संदर्भ भावी वधू का है, फिर भी यहाँ ‘पत्नी’ या ‘युवती’ जोड़ना मूल से अधिक विशिष्ट होगा।
- source_word: לֹא תֵלֵךְ ... אַחֲרָי
  choice: मेरे साथ न आए
  rationale: הלך के साथ אַחֲרַי का शाब्दिक अर्थ ‘मेरे पीछे न चले’ है, पर इस यात्रा-संदर्भ में ‘मेरे साथ न आए’ लक्ष्य भाषा में स्वाभाविक रूप से वही आशय देता है।
