source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם הָ/עֶ֨בֶד֙ אֶת יָד֔/וֹ תַּ֛חַת יֶ֥רֶךְ אַבְרָהָ֖ם אֲדֹנָ֑י/ו וַ/יִּשָּׁ֣בַֽע ל֔/וֹ עַל הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/009.yaml
  text: So the servant put his hand under the thigh of Abraham his master and swore to him concerning this matter[a].
translation:
  language: hi
  text: तब उस सेवक ने अपना हाथ अपने स्वामी अब्राहम की जाँघ के नीचे रखा और इस बात के विषय में उससे शपथ खाई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जाँघ के नीचे” उस इब्रानी अभिव्यक्ति का शाब्दिक अनुवाद है जो गंभीर शपथ लेते समय की एक मुद्रा बताती है। कुछ लोग इसे कटि या वाचा से जुड़ी संतति के साथ प्रतीकात्मक रूप से संबंधित मानते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: הָעֶבֶד
  choice: सेवक
  rationale: עֶבֶד का अर्थ दास या सेवक हो सकता है। इस प्रसंग में अब्राहम के घराने में उसकी अधीनस्थ भूमिका प्रमुख है; इसलिए आधुनिक हिन्दी में ‘सेवक’ स्वाभाविक और उपयुक्त है।
- source_word: וַיָּשֶׂם ... אֶת יָדוֹ
  choice: अपना हाथ ... रखा
  rationale: שׂוּם का सामान्य अर्थ ‘रखना’ है। यह चयन क्रिया को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תַּחַת יֶרֶךְ
  choice: जाँघ के नीचे
  rationale: יָרֵךְ का ठोस अर्थ ‘जाँघ’ है। मुख्य पाठ में संकेत के संभावित प्रतीकात्मक अर्थ को जोड़े बिना मूल अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: אַבְרָהָם אֲדֹנָיו
  choice: अपने स्वामी अब्राहम
  rationale: मानवीय सामाजिक संदर्भ में אֲדוֹן अधिकार रखने वाले स्वामी को दर्शाता है। हिन्दी की स्वाभाविक शब्द-व्यवस्था के अनुसार संबंधवाचक पद नाम से पहले रखा गया है।
- source_word: וַיִּשָּׁבַע לוֹ
  choice: उससे शपथ खाई
  rationale: निफ़अल रूप שׁבע का अर्थ शपथ खाना है, और לוֹ शपथ के व्यक्तिगत संबोधन को व्यक्त करता है; ‘उससे शपथ खाई’ इसे स्पष्ट और सहज रूप में रखता है।
- source_word: עַל הַדָּבָר הַזֶּה
  choice: इस बात के विषय में
  rationale: דָּבָר यहाँ अब्राहम द्वारा दिए गए विशिष्ट निर्देश को सूचित करता है। ‘इस बात के विषय में’ व्यापक अर्थ को बनाए रखते हुए संदर्भ में स्पष्ट है।
theological_decisions:
- issue: शपथ की मुद्रा का शाब्दिक अनुवाद या उसके प्रतीक का अर्थानुवाद
  choice: ‘जाँघ के नीचे’ कहकर मुद्रा का शाब्दिक अनुवाद
  alternative: इसे जननांग, कटि या वाचा की संतान से संबंधित संकेत के रूप में अर्थानुवाद करना
  rationale: इब्रानी पाठ शारीरिक क्रिया बताता है, पर उसका अर्थ स्पष्ट नहीं करता। शाब्दिक रूप वास्तविक अस्पष्टता को सुरक्षित रखता है और किसी एक व्याख्या को मुख्य पाठ में नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘तब’ से घटनाक्रम का संबंध स्पष्ट होता है; ‘शपथ खाई’ प्रचलित और गंभीर अभिव्यक्ति है।
