base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/059.yaml
  text: So they sent away Rebekah their sister[a], and her nurse, and Abraham’s servant, and his men.
translation:
  language: hi
  text: तब उन्होंने अपनी बहन रिबका को, उसकी धाय[a] को, और अब्राहम के सेवक तथा उसके आदमियों को विदा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वह स्त्री जिसने बचपन में रिबका को अपना दूध पिलाया था।
    reason: मूल शब्द מֵנֶקֶת सामान्य परिचारिका नहीं, विशेष रूप से दूध पिलानेवाली धाय को सूचित करता है।
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: विदा किया
  rationale: पिएल रूप यहाँ यात्रा पर प्रस्थान कराने का भाव देता है। ‘विदा किया’ प्रसंग में स्वाभाविक है और केवल ‘भेजा’ की तुलना में औपचारिक विदाई को बेहतर व्यक्त करता है।
- source_word: רִבְקָה
  choice: रिबका
  rationale: हिब्रू नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: אֲחֹתָם
  choice: अपनी बहन
  rationale: אָחוֹת का सीधा अर्थ ‘बहन’ है; कर्ता बहुवचन होने के कारण हिन्दी में ‘अपनी बहन’ स्वाभाविक रूप से ‘उनकी बहन’ का संबंध व्यक्त करता है।
- source_word: מֵנִקְתָּהּ
  choice: उसकी धाय
  rationale: यह ינק से बना रूप उस स्त्री को सूचित करता है जो बच्चे को दूध पिलाती है। ‘धाय’ संक्षिप्त और कथा-संदर्भ में स्वाभाविक है; अधिक विशिष्ट अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: עֶבֶד אַבְרָהָם
  choice: अब्राहम के सेवक
  rationale: संबंध-रचना का स्वाभाविक हिन्दी रूप है। עֶבֶד का अर्थ ‘दास’ भी हो सकता है, पर इस प्रसंग में उसकी सेवा-भूमिका प्रमुख है, इसलिए ‘सेवक’ उपयुक्त है।
- source_word: אֲנָשָׁיו
  choice: उसके आदमियों
  rationale: मूल का शाब्दिक अर्थ ‘उसके आदमी’ है और प्रत्यय अब्राहम के सेवक की ओर संकेत करता है। उनकी विशिष्ट भूमिका को बिना प्रमाण ‘सेवक’ कहकर सीमित नहीं किया गया।
