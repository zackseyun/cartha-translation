  text: אֲנִי֩ טֶ֨רֶם אֲכַלֶּ֜ה לְ/דַבֵּ֣ר אֶל לִבִּ֗/י וְ/הִנֵּ֨ה רִבְקָ֤ה יֹצֵאת֙ וְ/כַדָּ֣/הּ עַל שִׁכְמָ֔/הּ וַ/תֵּ֥רֶד הָ/עַ֖יְנָ/ה וַ/תִּשְׁאָ֑ב וָ/אֹמַ֥ר אֵלֶ֖י/הָ הַשְׁקִ֥י/נִי נָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/045.yaml
  text: Before I had finished speaking in my heart[a], behold, Rebekah came out with her jar on her shoulder, and she went down to the spring and drew water. Then I said to her[b], ‘Please give me a drink.’
translation:
  language: hi
  text: मैं मन ही मन बोलना पूरा भी नहीं कर पाया था कि देखो, रिबका अपने कंधे पर घड़ा रखे हुए बाहर आई। वह सोते[b] तक नीचे गई और उसने पानी भरा। तब मैंने उससे कहा, ‘कृपा करके मुझे पानी पिलाइए।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या “जल-स्रोत”; यहाँ इब्रानी शब्द प्राकृतिक सोते के लिए है, न कि सामान्यतः ‘कुएँ’ के लिए प्रयुक्त शब्द।
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם אֲכַלֶּה
  choice: अभी पूरा भी नहीं कर पाया था कि
  rationale: यह रूप संदर्भ के समय तक क्रिया के पूरा न होने को व्यक्त करता है और हिन्दी कथा-शैली में अगले अचानक घटित कार्य से स्वाभाविक रूप से जोड़ता है।
- source_word: לְדַבֵּר אֶל־לִבִּי
  choice: अपने मन में बोलना
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘अपने हृदय से/को बोलना’ है; यहाँ यह भीतर ही भीतर कही जा रही बात या प्रार्थना को दर्शाता है। ‘मन में बोलना’ अर्थ को स्पष्ट रखते हुए प्रार्थना और आत्म-संवाद के बीच की संभावित अस्पष्टता बचाता है।
- source_word: וְהִנֵּה
  choice: कि देखो
  rationale: यह अचानक और सजीव प्रस्तुति का संकेत देता है; ‘देखो’ आधुनिक हिन्दी में उस कथात्मक बल को बनाए रखता है।
- source_word: רִבְקָה
  choice: रिबका
  rationale: यह नाम का प्रचलित हिन्दी बाइबलीय रूप है और इब्रानी उच्चारण के निकट है।
- source_word: יֹצֵאת
  choice: बाहर आई
  rationale: הִנֵּה के बाद कृदंत तत्काल और सजीव घटना प्रस्तुत करता है; हिन्दी में ‘बाहर आई’ स्वाभाविक कथात्मक रूप है।
- source_word: כַדָּהּ
  choice: घड़ा
  rationale: כד पानी लाने-ले जाने के पात्र को दर्शाता है; ‘घड़ा’ सामान्य, सुबोध और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: עַל־שִׁכְמָהּ
  choice: अपने कंधे पर
  rationale: स्थान-संबंधी वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וַתֵּרֶד הָעַיְנָה
  choice: वह सोते के पास नीचे गई
  rationale: עַיִן यहाँ प्राकृतिक जल-स्रोत अर्थात सोता है, सामान्य ‘कुएँ’ के लिए प्रयुक्त בְּאֵר नहीं। दिशा और नीचे जाने की क्रिया दोनों रखी गई हैं।
- source_word: וַתִּשְׁאָב
  choice: उसने पानी भरा
  rationale: שׁאב का अर्थ पानी निकालना/भरना है। सोते और घड़े के प्रसंग में ‘पानी भरा’ सहज आधुनिक हिन्दी है।
- source_word: הַשְׁקִינִי נָא
  choice: कृपा करके मुझे पानी पिला दे
  rationale: हिफ़ील आज्ञार्थक का अर्थ ‘पीने को देना/पिलाना’ है और נָא विनम्र अनुरोध दर्शाता है; यह अनुवाद दोनों तत्वों को स्पष्ट रखता है।
theological_decisions:
- issue: भीतरी वाणी को स्पष्ट रूप से प्रार्थना कहना या न कहना
  choice: ‘अपने मन में बोलना’ रखा गया
  alternative: ‘मन ही मन प्रार्थना करना’
  rationale: निकटवर्ती प्रसंग इसे परमेश्वर से की गई प्रार्थना समझने का आधार देता है, पर इस पद का इब्रानी वाक्यांश स्वयं व्यापक है। इसलिए अनुवाद में अस्पष्टता रखी गई और टिप्पणी में दोनों संभावनाएँ बताई गईं।
translation_notes:
  register: आधुनिक मानक हिन्दी की सरल किंतु गरिमापूर्ण कथा-शैली अपनाई गई है। ‘देखो’ से मूल की सजीवता, ‘घड़ा’ और ‘सोता’ से ग्रामीण जल-संग्रह का ठोस चित्र, तथा विनम्र अनुरोध के लिए ‘कृपा करके’ रखा गया है।
