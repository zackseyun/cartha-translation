base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/032.yaml
  text: So the man came into the house and unloaded the camels and gave straw and feed to the camels[b][a], and water to wash his feet and the feet of the men who were with him.
translation:
  language: hi
  text: तब वह आदमी घर में आया, और उसने[b] ऊँटों का सामान उतार दिया[a]। उसने ऊँटों को भूसा और चारा दिया, और अपने पैर तथा जो आदमी उसके साथ थे उनके पैर धोने के लिए पानी दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “ऊँटों को खोला।” इसका आशय यात्रा के बाद उनका सामान या बंधन खोलकर उन्हें राहत देना है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में इन क्रियाओं का कर्ता नाम लेकर फिर नहीं बताया गया है। व्याकरण में यह पहले उल्लिखित “वह आदमी” की ओर संकेत करता है; प्रसंग के आधार पर कुछ लोग इसे लाबान के आतिथ्य से जोड़ते हैं।
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּבֹא הָאִישׁ הַבַּיְתָה
  choice: तब वह आदमी घर में आया
  rationale: בוא और दिशासूचक ה मिलकर घर के भीतर आने की गति बताते हैं। הָאִישׁ का सीधा अर्थ ‘वह आदमी’ है; संदर्भ के आधार पर ‘सेवक’ जोड़ना अनावश्यक व्याख्या होती।
- source_word: וַיְפַתַּח הַגְּמַלִּים
  choice: ऊँटों का सामान उतारा गया
  rationale: פתח का मूल अर्थ ‘खोलना’ है, पर ऊँटों के साथ यह यात्रा का सामान या बंधन खोलकर उन्हें राहत देने का मुहावरा है। ‘सामान उतारा गया’ आधुनिक हिन्दी में प्रसंगानुकूल है। कर्मवाच्य से उस कर्ता को निश्चित नहीं किया गया जिसे इब्रानी यहाँ दोबारा नाम नहीं देता।
- source_word: תֶּבֶן וּמִסְפּוֹא
  choice: भूसा और चारा
  rationale: תֶּבֶן पशुओं के लिए प्रयुक्त भूसा/पुआल और מִסְפּוֹא उनका आहार या चारा है। यह जोड़ी सरल और स्वाभाविक हिन्दी है।
- source_word: וּמַיִם לִרְחֹץ רַגְלָיו
  choice: उसके ... पैर धोने के लिए पानी
  rationale: लְ + infinitive उद्देश्य व्यक्त करता है। רַגְלָיו में एकवचन पुल्लिंग संबंधसूचक प्रत्यय है, इसलिए ‘उसके पैर’ रखा गया है।
- source_word: וְרַגְלֵי הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: और उसके साथ आए आदमियों के पैर
  rationale: ‘आदमियों’ से स्पष्ट बहुवचन सुरक्षित रहता है; ‘साथ आए’ हिन्दी में אֲשֶׁר אִתּוֹ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ऊँटों का सामान उतारने और आतिथ्य-सामग्री देने वाला कौन था
  choice: कर्तारहित कर्मवाच्य—‘उतारा गया… दिया गया’
  alternative: ‘उस आदमी ने’ अथवा ‘लाबान ने’
  rationale: इब्रानी क्रियाएँ पुल्लिंग एकवचन हैं, पर इन क्रियाओं से पहले कर्ता का नाम फिर नहीं आता। व्याकरणतः पहले उल्लिखित आदमी कर्ता समझा जा सकता है, जबकि आतिथ्य के प्रसंग में लाबान या उसके घराने के लोग अभिप्रेत हो सकते हैं। किसी एक को स्पष्ट रूप से जोड़ना स्रोत की वास्तविक अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘भूसा और चारा’ सामान्य पाठक के लिए सहज है। कर्ता के संबंध में स्रोत की अस्पष्टता बचाने के लिए स्वाभाविक हिन्दी कर्मवाच्य अपनाया गया है; पादटिप्पणी पाठक को दोनों संभावनाएँ बताती है।
