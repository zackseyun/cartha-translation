  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में बोधगम्य रखी गई है। ‘कुल’ नातेदारी-समूह को संक्षेप और औपचारिकता के साथ व्यक्त करता है; वास्तविक शब्दार्थगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
