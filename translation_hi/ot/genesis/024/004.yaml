  text: but you shall go to my land and to my kindred[b][a], and take a wife for my son Isaac.
translation:
  language: hi
  text: बल्कि तुम मेरे देश में, मेरे रिश्तेदारों के पास जाओ और मेरे बेटे इसहाक के लिए एक पत्नी ले लो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: बल्कि
  rationale: पद 3 में कनानी स्त्रियों में से पत्नी न लेने की मनाही के विपरीत यहाँ सकारात्मक निर्देश दिया गया है; इसलिए विरोधसूचक अर्थ स्वाभाविक है।
- source_word: אֶל אַרְצִי
  choice: मेरे देश
  rationale: אֶרֶץ यहाँ अब्राहम के मूल भौगोलिक क्षेत्र को दर्शाता है; आधुनिक राष्ट्र-राज्य के अर्थ के बिना ‘देश’ सहज हिन्दी है।
- source_word: וְאֶל מוֹלַדְתִּי
  choice: और मेरे कुल के पास
  rationale: מוֹלֶדֶת स्थान-मूल या नातेदारी-समूह, दोनों का बोध करा सकता है। पत्नी लाने के प्रसंग में ‘कुल’ मुख्य आशय को व्यक्त करता है, जबकि पादटिप्पणी स्थान-संबंधी सम्भावना सुरक्षित रखती है।
- source_word: תֵּלֵךְ
  choice: जाना
  rationale: यह अपूर्ण क्रिया शपथ के प्रसंग में निर्देश/दायित्व व्यक्त करती है; ‘तुम ... जाना’ आधुनिक हिन्दी में दृढ़ निर्देश है।
- source_word: וְלָקַחְתָּ
  choice: ले आना
  rationale: לקח का मूल अर्थ ‘लेना’ है; दूर देश जाकर पत्नी को इसहाक के लिए वापस लाने के प्रसंग में ‘ले आना’ हिन्दी में स्वाभाविक रूप से निहित गति को स्पष्ट करता है।
- source_word: אִשָּׁה
  choice: एक पत्नी
  rationale: विवाह के स्पष्ट प्रसंग में אִשָּׁה का अर्थ ‘पत्नी’ है, केवल ‘स्त्री’ नहीं।
- source_word: לִבְנִי לְיִצְחָק
  choice: मेरे बेटे इसहाक के लिए
  rationale: दोहराया हुआ ל लाभार्थी और समानाधिकरण को दर्शाता है; हिन्दी में बिना कृत्रिम पुनरावृत्ति के ‘मेरे बेटे इसहाक के लिए’ वही अर्थ देता है।
