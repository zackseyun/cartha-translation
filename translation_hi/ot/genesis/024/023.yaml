  register: आधुनिक मानक हिन्दी में सहज, सम्मानपूर्ण और कथात्मक शैली। स्त्रीलिंग संबोधन ‘तुम’ मूल के אַתְּ के अनुरूप है। ‘जगह’ चुना गया है ताकि उपलब्ध स्थान का व्यापक अर्थ बना रहे और अनावश्यक रूप से अलग कमरे का संकेत न मिले।
