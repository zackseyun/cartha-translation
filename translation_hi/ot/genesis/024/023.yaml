  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ בַּת מִ֣י אַ֔תְּ הַגִּ֥ידִי נָ֖א לִ֑/י הֲ/יֵ֧שׁ בֵּית אָבִ֛י/ךְ מָק֥וֹם לָ֖/נוּ לָ/לִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/023.yaml
  text: And he said[a], “Whose daughter are you? Please tell me. Is there room in your father’s house for us to spend the night?”
translation:
  language: hi
  text: फिर उसने कहा, “तुम किसकी बेटी हो? कृपया मुझे बताओ। क्या तुम्हारे पिता के घर में हमारे रात भर ठहरने के लिए जगह है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: फिर उसने कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘फिर’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है, बिना उससे अधिक अर्थ जोड़े।
- source_word: בַּת מִי אַתְּ
  choice: तुम किसकी बेटी हो?
  rationale: यह परिवारगत पहचान पूछने वाले इब्रानी वाक्य का स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: הַגִּידִי נָא לִי
  choice: कृपया मुझे बताओ
  rationale: नָא आज्ञा को विनम्र निवेदन बनाता है; ‘कृपया’ उस भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: הֲיֵשׁ
  choice: क्या ... है?
  rationale: अस्तित्वसूचक हाँ/नहीं प्रश्न के लिए यह स्वाभाविक हिन्दी संरचना है।
- source_word: בֵּית אָבִיךְ
  choice: तुम्हारे पिता के घर में
  rationale: यह मूल के संबंधवाचक पदबंध को बनाए रखता है और घराने तथा निवास-स्थान दोनों के संदर्भ को खुला रखता है।
- source_word: מָקוֹם
  choice: जगह
  rationale: आतिथ्य के संदर्भ में उपलब्ध स्थान को दर्शाता है; ‘जगह’ आधुनिक हिन्दी में ‘कमरा’ से अधिक व्यापक और मूल के निकट है।
- source_word: לָנוּ
  choice: हमारे
  rationale: मूल के प्रथम पुरुष बहुवचन को सुरक्षित रखता है; वक्ता अपने और अपने साथियों के लिए पूछता है।
- source_word: לָלִין
  choice: रात बिताने के लिए
  rationale: इस संदर्भ में क्रिया का अर्थ रात भर ठहरना है; यह सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
