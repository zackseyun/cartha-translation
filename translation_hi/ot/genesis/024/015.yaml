  text: וַֽ/יְהִי ה֗וּא טֶרֶם֮ כִּלָּ֣ה לְ/דַבֵּר֒ וְ/הִנֵּ֧ה רִבְקָ֣ה יֹצֵ֗את אֲשֶׁ֤ר יֻלְּדָה֙ לִ/בְתוּאֵ֣ל בֶּן מִלְכָּ֔ה אֵ֥שֶׁת נָח֖וֹר אֲחִ֣י אַבְרָהָ֑ם וְ/כַדָּ֖/הּ עַל שִׁכְמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/015.yaml
  text: And it happened[a], before he had finished speaking, that behold, Rebekah was coming out—she who had been born to Bethuel son of Milcah, the wife of Nahor[b], Abraham’s brother—with her jar on her shoulder.
translation:
  language: hi
  text: तब ऐसा हुआ कि उसने बोलना अभी समाप्त भी नहीं किया था कि देखो, रिबका बाहर आ रही थी। वह बतूएल की बेटी थी—बतूएल मिल्का का पुत्र था, और मिल्का अब्राहम के भाई नाहोर की पत्नी थी। रिबका के कंधे पर उसका घड़ा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ऐसा हुआ
  rationale: यह इब्रानी कथानक में नई घटना आरम्भ करने वाला प्रचलित रूप है; यह अनुवाद उसके कथात्मक कार्य को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: טֶרֶם כִּלָּה לְדַבֵּר
  choice: उसने बोलना अभी समाप्त भी नहीं किया था
  rationale: טֶרֶם पूर्वता को और כִּלָּה क्रिया की समाप्ति को व्यक्त करता है; ‘अभी...भी नहीं’ तत्काल घटित होने का भाव स्वाभाविक रूप से देता है।
- source_word: וְהִנֵּה
  choice: कि देखो
  rationale: הִנֵּה कथानक में अचानक सामने आए दृश्य की ओर ध्यान खींचता है; ‘देखो’ उसकी जीवंतता बनाए रखता है।
- source_word: יֹצֵאת
  choice: बाहर आ रही थी
  rationale: स्त्रीलिंग एकवचन कृदन्त उस समय जारी क्रिया दिखाता है; अपूर्ण भूतकालीन हिन्दी रूप इस दृश्यात्मकता को बनाए रखता है।
- source_word: אֲשֶׁר יֻלְּדָה לִבְתוּאֵל
  choice: वह बतूएल की बेटी थी
  rationale: इब्रानी निष्क्रिय जन्म-सूचक वाक्यांश वंश-परिचय देता है। हिन्दी में ‘की बेटी थी’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֶּן מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם
  choice: बतूएल मिल्का का पुत्र था, और मिल्का अब्राहम के भाई नाहोर की पत्नी थी
  rationale: वंशावली के सभी संबंध सुरक्षित रखे गए हैं और छोटे स्वतंत्र उपवाक्यों में उन्हें सामान्य पाठक के लिए स्पष्ट किया गया है।
- source_word: כַּד
  choice: घड़ा
  rationale: यह जल भरने और ढोने के पात्र का सामान्य शब्द है; ‘घड़ा’ आधुनिक हिन्दी में सहज है और संदर्भ से जल का प्रयोजन स्पष्ट है।
- source_word: עַל שִׁכְמָהּ
  choice: कंधे पर
  rationale: स्थान-सूचक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप।
