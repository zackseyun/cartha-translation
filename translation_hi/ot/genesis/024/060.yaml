base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/060.yaml
  text: And they blessed Rebekah and said to her[a], “Our sister, may you become thousands of ten thousands[b], and may your offspring possess the gate of those who hate them.”
translation:
  language: hi
  text: और उन्होंने रिबका को आशीर्वाद दिया और उससे कहा, “हे हमारी बहन, तू दस-दस हजारों की हजारों हो[a], और तेरा वंश अपने बैरियों के फाटक को अपने अधिकार में करे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “तू हजारों दस-हजारों की हो।” यह बहुत बड़ी संतान-संख्या के लिए एक काव्यात्मक आशीष है।'
    reason: lexical_alternative
  - marker: b
    text: या “अपने बैरियों के फाटक का अधिकारी हो।” नगर का फाटक उसकी सुरक्षा, सामर्थ्य और शासन का प्रतीक था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: उन्होंने ... आशीर्वाद दिया
  rationale: पिएल रूप यहाँ रिबका के लिए आशीर्वचन कहने की क्रिया व्यक्त करता है; यह सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: רִבְקָה
  choice: रिबका
  rationale: यह इब्रानी नाम का हिन्दी बाइबल परंपरा में प्रचलित और स्रोत के निकट लिप्यंतरण है।
- source_word: אֲחֹתֵנוּ
  choice: हे हमारी बहन
  rationale: सम्बोधन का भाव स्पष्ट रखने के लिए ‘हे’ जोड़ा गया है; ‘हमारी बहन’ पारिवारिक सम्बोधन को सुरक्षित रखता है।
- source_word: הֲיִי
  choice: तू ... बने
  rationale: यह आशीर्वाद में व्यक्त कामना है, आज्ञा नहीं; हिन्दी का संभावनार्थक रूप उस भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְאַלְפֵי רְבָבָה
  choice: लाखों-करोड़ों की जननी
  rationale: शाब्दिक संख्यात्मक मुहावरे ‘हजारों दस-हजारों’ का आशय असंख्य संतानों से है। ‘की जननी’ स्त्री सम्बोधन के साथ ‘बनने’ का अभिप्राय स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: וְיִירַשׁ
  choice: अधिकार करे
  rationale: ירש यहाँ विजयपूर्वक अपने अधीन करने या नियंत्रण पाने का अर्थ देता है; फाटक की छवि के साथ ‘अधिकार करे’ स्वाभाविक है।
- source_word: זַרְעֵךְ
  choice: तेरा वंश
  rationale: यह सामूहिक एकवचन संज्ञा है। ‘वंश’ हिन्दी में उसकी सामूहिकता और पितृकुलीय प्रतिज्ञा-भाषा दोनों को सहज रूप से बनाए रखता है।
- source_word: שַׁעַר
  choice: फाटक
  rationale: ठोस नगर-द्वार की छवि बनाए रखी गई है; प्राचीन संदर्भ में यह नगर की शक्ति और नियंत्रण का भी प्रतीक है।
- source_word: שֹׂנְאָיו
  choice: अपने बैरियों
  rationale: इब्रानी का शाब्दिक अर्थ ‘उससे घृणा करनेवाले’ है और प्रत्यय एकवचन है। हिन्दी में ‘वंश’ के साथ ‘अपने बैरियों’ स्वाभाविक है तथा सम्बन्ध को अनावश्यक रूप से बहुवचन सर्वनाम में नहीं बदलता।
theological_decisions:
- issue: सामूहिक एकवचन ‘वंश’ और उससे जुड़ा एकवचन संकेत
  choice: तेरा वंश ... अपने बैरियों
  alternative: तेरे वंशज ... अपने बैरियों
  rationale: זֶרַע सामूहिक एकवचन है और שֹׂנְאָיו में एकवचन पुरुषवाचक प्रत्यय है। ‘वंश’ स्रोत की व्याकरणिक और वाचाई प्रतिध्वनि को सुरक्षित रखता है, जबकि ‘अपने’ हिन्दी में अस्पष्ट या अस्वाभाविक लिंग-सर्वनाम से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आशीर्वचन की काव्यात्मक ऊँचाई के लिए ‘हे हमारी बहन’ और ‘जननी बने’ प्रयुक्त हैं; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
