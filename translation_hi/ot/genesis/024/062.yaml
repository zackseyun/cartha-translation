base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/062.yaml
  text: Isaac had come from Beer-lahai-roi[b][a], and he was dwelling in the land of the Negev.
translation:
  language: hi
  text: इसहाक बेएर-लहै-रोई[b][a] से आया था, और वह नेगेव प्रदेश में रहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसहाक बेएर-लहै-रोई से आया।” इब्रानी वाक्यरचना का अनुवाद पूर्ण भूतकाल के बजाय साधारण भूतकाल में भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: बेएर-लहै-रोई एक स्थान का नाम है, जिसका उल्लेख पहले हाजिरा के प्रसंग में हुआ है (देखें उत्पत्ति 16:14)।
    reason: cross_reference
lexical_decisions:
- source_word: בָּא
  choice: आया था
  rationale: बोअ का कालरूप पूरी हो चुकी गति को व्यक्त करता है। कथा-क्रम में हिंदी का पूर्ण भूतकाल ‘आया था’ स्वाभाविक है, यद्यपि साधारण भूतकाल ‘आया’ भी संभव है।
- source_word: מִבּוֹא
  choice: से
  rationale: मिन के साथ बोअ का क्रियार्थक रूप यहाँ संक्षिप्त मुहावरेदार रचना है और गति के आरंभ-स्थान को सूचित करता है; इसलिए ‘से’ उपयुक्त है।
- source_word: בְּאֵר לַחַי רֹאִי
  choice: बेएर-लहै-रोई
  rationale: यह स्थान-नाम है, इसलिए इसका अर्थानुवाद न करके देवनागरी में लिप्यंतरण किया गया है; योजक-चिह्न इसके संयुक्त नाम को स्पष्ट करते हैं।
- source_word: יוֹשֵׁב
  choice: रहता था
  rationale: कृदंत निरंतर या सामान्य निवास की अवस्था बताता है। ‘रहता था’ आधुनिक हिंदी में इस स्थायी/कालावधि वाले भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: नेगेव प्रदेश में
  rationale: नेगेव दक्षिण के शुष्क भौगोलिक क्षेत्र का नाम है। ‘प्रदेश’ मूल के אֶרֶץ के क्षेत्रगत भाव को सहज आधुनिक हिंदी में रखता है।
- source_word: וְהוּא
  choice: और वह
  rationale: मूल में संयोजक और सर्वनाम दोनों स्पष्ट हैं। ‘और वह’ समन्वय तथा पृष्ठभूमि-वर्णन को बिना अतिरिक्त व्याख्या के बनाए रखता है।
