base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/063.yaml
  text: And Isaac went out to meditate in the field toward evening[a], and he lifted up his eyes and looked, and behold, camels were coming.
translation:
  language: hi
  text: और इसहाक साँझ होते समय खेत में मनन करने[a] निकला। उसने आँखें उठाईं और देखा, और देखो, ऊँट आ रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “टहलने,” “विचार करने,” “बातचीत करने,” अथवा संभवतः “प्रार्थना करने” के लिए। यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और इस स्थान पर उसका ठीक आशय अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकला
  rationale: יצא का अर्थ बाहर की ओर जाना है। हिंदी में ‘निकला’ स्वाभाविक रूप से गति और कथा-क्रम दोनों व्यक्त करता है।
- source_word: יִצְחָק
  choice: इसहाक
  rationale: व्यक्तिनाम का प्रचलित मानक हिंदी लिप्यंतरण।
- source_word: לָשׂוּחַ
  choice: मनन करने
  rationale: यह दुर्लभ क्रिया है और इसका सटीक आशय अनिश्चित है। प्रसंग में ‘मनन करने’ एकांत में चिंतनशील गतिविधि को व्यक्त करता है, पर प्रार्थना जैसे अधिक विशिष्ट अर्थ को आरोपित नहीं करता; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: בַּשָּׂדֶה
  choice: मैदान में
  rationale: שׂדה खुले खेत या मैदानी क्षेत्र को सूचित करता है; ‘मैदान में’ आधुनिक हिंदी में सहज और पर्याप्त व्यापक है।
- source_word: לִפְנוֹת עָרֶב
  choice: साँझ ढलने के समय
  rationale: मुहावरा साँझ की ओर बढ़ते समय को दर्शाता है। यह अनुवाद समय की गतिशील छाया को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: उसने आँखें उठाकर देखा
  rationale: हिब्रू में दृष्टि उठाने और देखने की क्रमिक क्रियाएँ हैं। संयुक्त हिंदी वाक्यांश मूल बिंब और क्रम को बिना अस्वाभाविक पुनरुक्ति के सुरक्षित रखता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह ध्यान आकर्षित करने वाला कथात्मक संकेत है। ‘और देखो’ दृश्य की आकस्मिकता और सजीवता बनाए रखता है।
- source_word: גְמַלִּים בָּאִים
  choice: ऊँट चले आ रहे थे
  rationale: भागवाचक रूप ongoing approach दर्शाता है; ‘चले आ रहे थे’ निकट आते कारवाँ की गतिशीलता को स्वाभाविक हिंदी में व्यक्त करता है।
