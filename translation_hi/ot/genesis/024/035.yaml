  text: וַ/יהוָ֞ה בֵּרַ֧ךְ אֶת אֲדֹנִ֛/י מְאֹ֖ד וַ/יִּגְדָּ֑ל וַ/יִּתֶּן ל֞/וֹ צֹ֤אן וּ/בָקָר֙ וְ/כֶ֣סֶף וְ/זָהָ֔ב וַ/עֲבָדִם֙ וּ/שְׁפָחֹ֔ת וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/035.yaml
  text: And Yahweh has greatly blessed my master[a], and he has become great. He has given him flocks and herds, silver and gold, male servants and female servants, camels and donkeys.
translation:
  language: hi
  text: और यहोवा ने मेरे स्वामी को बहुत आशीष दी है, और वह महान हो गया है। उसने उसे भेड़-बकरियों के झुंड, गाय-बैल, चाँदी और सोना, दास और दासियाँ,[a] ऊँट और गधे दिए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवक और सेविकाएँ।” इब्रानी शब्द संदर्भ के अनुसार घरेलू सेवकों या दासों को दर्शा सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יהוה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय नाम को एक प्रचलित हिन्दी रूप में व्यक्त किया गया है, ताकि यह सामान्य उपाधि न बन जाए और वाचा-संबंधी व्यक्तिगत नाम बना रहे।
- source_word: בֵּרַךְ ... מְאֹד
  choice: बहुत आशीष दी है
  rationale: क्रिया और तीव्रताबोधक क्रियाविशेषण दोनों को स्वाभाविक आधुनिक हिन्दी में रखा गया है; पूर्ण वर्तमान उसके वर्तमान वैभव पर पिछले दैवी कार्य के परिणाम को दर्शाता है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: यहाँ वक्ता अपने मानवीय स्वामी अब्राहम की बात करता है; ‘स्वामी’ सामाजिक संबंध को स्पष्ट करता है और इसे ईश्वरीय संबोधन से अलग रखता है।
- source_word: וַיִּגְדָּל
  choice: वह बहुत बड़ा हो गया है
  rationale: मूल क्रिया प्रतिष्ठा, सामर्थ्य और संपन्नता में ‘बड़ा होने’ का व्यापक भाव रखती है; इसे केवल ‘धनी’ कहकर सीमित नहीं किया गया। हिन्दी में आशय स्पष्ट करने के लिए ‘बहुत’ जोड़ा गया है।
- source_word: צֹאן
  choice: भेड़-बकरियों के झुंड
  rationale: यह सामूहिक संज्ञा छोटे पालतू पशुओं, विशेषतः भेड़ और बकरियों, को दर्शाती है; हिन्दी पाठक के लिए स्पष्ट और स्वाभाविक रूप चुना गया।
- source_word: בָקָר
  choice: गाय-बैल
  rationale: यह गोवंश की सामूहिक संज्ञा है; ‘गाय-बैल’ सामान्य हिन्दी में इसके दायरे को सहजता से व्यक्त करता है।
- source_word: כֶסֶף וְזָהָב
  choice: चाँदी और सोना
  rationale: दोनों बहुमूल्य धातुओं के ठोस मूल अर्थ सुरक्षित रखे गए हैं; ‘धन’ कहकर सामान्यीकरण नहीं किया गया।
- source_word: עֲבָדִם וּשְׁפָחֹת
  choice: दास और दासियाँ
  rationale: संपत्ति-सूची के इस संदर्भ में शब्द आश्रित घरेलू सेवा के साथ स्वामित्व/दासता की स्थिति भी सूचित कर सकते हैं। ‘दास और दासियाँ’ उस सामाजिक कठोरता को छिपाता नहीं, जबकि वैकल्पिक ‘सेवक और सेविकाएँ’ पादटिप्पणी में सुरक्षित है।
- source_word: גְמַלִּים וַחֲמֹרִים
  choice: ऊँट और गधे
  rationale: दोनों पशु-संज्ञाओं का सीधा और स्वाभाविक हिन्दी अनुवाद।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी में परिचित नामरूप ‘यहोवा’ उसे उपाधि ‘प्रभु’ में विलीन किए बिना पहचान योग्य रखता है; ‘याहवे’ निकटतर लिप्यंतरण का विकल्प है।
- issue: עֲבָדִם / שְׁפָחֹת की सामाजिक स्थिति
  choice: दास और दासियाँ
  alternative: सेवक और सेविकाएँ
  rationale: इन शब्दों का अर्थ सेवक से लेकर दास तक हो सकता है। यहाँ मनुष्यों को संपत्ति की सूची में गिनाया गया है, इसलिए मुख्य पाठ में ‘दास’ अधिक संदर्भ-संगत है; फिर भी शब्दगत विस्तार को पादटिप्पणी में बनाए रखा गया है।
- issue: וַיִּגְדָּל का आशय
  choice: बहुत बड़ा हो गया है
  alternative: बहुत धनी हो गया है
  rationale: संदर्भ संपन्नता पर बल देता है, पर मूल क्रिया का आशय केवल धन तक सीमित नहीं; व्यापक ‘बड़ा’ प्रतिष्ठा और सामर्थ्य की संभावित छाया भी सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संपत्ति की सूची में समानांतर संज्ञाओं का प्रवाह बनाए रखा गया है। ‘बहुत बड़ा’ शाब्दिक व्यापकता बचाता है, और दासता-संबंधी शब्दावली की वास्तविक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
