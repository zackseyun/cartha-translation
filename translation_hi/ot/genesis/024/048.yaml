base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/048.yaml
  text: Then I bowed down and worshiped Yahweh[a], and I blessed Yahweh, the God of my master Abraham, who led me on the true way to take the daughter of my master's brother for his son.
translation:
  language: hi
  text: तब मैंने सिर झुकाकर यहोवा की आराधना की और अपने स्वामी अब्राहम के परमेश्वर यहोवा को धन्य कहा, जिन्होंने मेरे स्वामी के भाई की बेटी को उनके पुत्र के लिए लेने हेतु सत्य के मार्ग पर[a] मेरी अगुवाई की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “सत्य के मार्ग पर।” इस पदबंध का अर्थ “विश्वसनीयता या निष्ठा के मार्ग पर” भी हो सकता है; अर्थात यहोवा ने भरोसेमंद ढंग से मेरा मार्गदर्शन किया।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקֹּד
  choice: मैंने सिर झुकाकर
  rationale: यह क्रिया शरीर को आदरपूर्वक झुकाने का संकेत देती है; ‘सिर झुकाकर’ अगले आराधना-वाचक क्रियापद के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: וָאֶשְׁתַּחֲוֶה לַיהוָה
  choice: यहोवा की आराधना की
  rationale: परमेश्वर की ओर निर्देशित यह क्रिया श्रद्धापूर्वक दण्डवत होने और आराधना करने का भाव रखती है; हिन्दी में ‘आराधना की’ अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וָאֲבָרֵךְ אֶת יְהוָה
  choice: यहोवा को धन्य कहा
  rationale: जब ברך का कर्म परमेश्वर हों, तब इसका अर्थ उनकी स्तुति करते हुए उन्हें धन्य कहना है; यह रूप मूल शब्द के आशीष/धन्यता-संबंधी भाव को बनाए रखता है।
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: अपने स्वामी अब्राहम के परमेश्वर
  rationale: अֲדֹנִי यहाँ सेवक के मानवीय स्वामी अब्राहम के लिए है, इसलिए ‘स्वामी’ स्पष्ट और प्रसंगानुकूल है।
- source_word: הִנְחַנִי
  choice: मेरी अगुवाई की
  rationale: नחה के हिफ़ील रूप में मार्ग दिखाने या ले चलने का अर्थ है; ‘अगुवाई की’ इस सक्रिय मार्गदर्शन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּדֶרֶךְ אֱמֶת
  choice: सच्चाई के मार्ग पर
  rationale: यह मूल पदबंध के ‘मार्ग’ और אֱמֶת के सत्य, विश्वसनीयता तथा निष्ठा-संबंधी अर्थ को बनाए रखता है, बिना इसे केवल दिशात्मक ‘सही रास्ता’ तक सीमित किए।
- source_word: לָקַחַת אֶת בַּת אֲחִי אֲדֹנִי לִבְנוֹ
  choice: मेरे स्वामी के भाई की बेटी को उनके पुत्र के लिए लेने हेतु
  rationale: उद्देश्यवाचक infinitive और पारिवारिक संबंध को निकटता से सुरक्षित रखा गया है; विवाह की व्यवस्था प्रसंग से स्पष्ट है, इसलिए मूल से आगे बढ़कर ‘विवाह कराना’ नहीं जोड़ा गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘यहोवा’ नाम को प्रत्यक्ष रखता है, जबकि ‘प्रभु’ उसे उपाधि से प्रतिस्थापित कर देता।
- issue: בְּדֶרֶךְ אֱמֶת में אֱמֶת का अर्थ
  choice: सच्चाई के मार्ग पर
  alternative: सही मार्ग पर / विश्वसनीय मार्ग से
  rationale: אֱמֶת सत्य के साथ विश्वसनीयता और निष्ठा भी व्यक्त कर सकता है। मुख्य पाठ में निकट रूप रखा गया और इस वास्तविक अर्थ-विस्तार को पादटिप्पणी में सुरक्षित किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। मूल की दो क्रमिक क्रियाएँ—झुकना और आराधना करना—एक स्वाभाविक हिन्दी संरचना में रखी गई हैं। पादटिप्पणी-चिह्न उस पदबंध के बाद रखा गया है जिसकी व्याख्या की गई है।
