source:
  edition: WLC
  text: וַ/יֹּאמַ֓ר יְהוָ֗ה אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם הַקְרֵה נָ֥א לְ/פָנַ֖/י הַ/יּ֑וֹם וַ/עֲשֵׂה חֶ֕סֶד עִ֖ם אֲדֹנִ֥/י אַבְרָהָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/012.yaml
  text: And he said[a], “O Yahweh, God of my master Abraham, please grant success before me today[c][b], and show steadfast love to my master Abraham.”
translation:
  language: hi
  text: तब उसने कहा, “हे यहोवा, मेरे स्वामी अब्राहम के परमेश्वर, कृपा करके आज मेरे सामने अनुकूल घटना घटित कर,[a] और मेरे स्वामी अब्राहम पर अपना अटल प्रेम दिखा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कृपा करके आज इसे मेरे सामने घटित कर।” इब्रानी क्रिया में परमेश्वर से इच्छित भेंट या घटना घटित कराने की विनती है।
    reason: lexical_alternative
  - marker: b
    text: “अटल प्रेम” के लिए प्रयुक्त इब्रानी शब्द का अर्थ निष्ठावान प्रेम, कृपालु भलाई, या वाचा के प्रति निष्ठा भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: मेरे स्वामी अब्राहम के परमेश्वर
  rationale: सम्बन्धवाचक रचना और सेवक का अब्राहम से सम्बन्ध स्पष्ट रखता है; ‘स्वामी’ आधुनिक हिन्दी में इस प्रसंग के अनुकूल है।
- source_word: הַקְרֵה נָא לְפָנַי הַיּוֹם
  choice: कृपा करके आज मेरे सामने ऐसा संयोग घटा दे कि मैं सफल होऊँ
  rationale: हिफ़ील आज्ञार्थक रूप परमेश्वर से अनुकूल घटना घटाने की विनती करता है। यह रूप मूल के ‘घटित कराने’ और प्रसंगगत सफलता—दोनों को व्यक्त करता है, जबकि ‘मेरे सामने’ स्रोत की स्थानिक छवि बचाता है।
- source_word: וַעֲשֵׂה חֶסֶד
  choice: अपनी अटल करुणा दिखा
  rationale: חֶסֶד की कृपालु, निष्ठावान और स्थायी भलाई को ‘अटल करुणा’ संक्षेप और स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: עִם אֲדֹנִי אַבְרָהָם
  choice: मेरे स्वामी अब्राहम पर
  rationale: עִם का मूल अर्थ ‘के साथ’ है, पर ‘करुणा दिखाना’ के साथ हिन्दी में ‘पर’ अधिक स्वाभाविक है और आशय अपरिवर्तित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में आए विशिष्ट ईश्वरीय नाम को सामान्य उपाधि ‘प्रभु’ से नहीं बदला गया। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है।
- issue: חֶסֶד की अर्थ-व्याप्ति
  choice: अटल करुणा
  alternative: दयालुता / निष्ठावान प्रेम / वाचा की निष्ठा
  rationale: शब्द में करुणामय भलाई और स्थायी निष्ठा दोनों निहित हो सकते हैं। मुख्य पाठ किसी एक तकनीकी धर्मवैज्ञानिक अर्थ तक इसे सीमित नहीं करता; पादटिप्पणी अर्थ-व्याप्ति बताती है।
- issue: הַקְרֵה में दैवी व्यवस्था और सफलता
  choice: ऐसा संयोग घटा दे कि मैं सफल होऊँ
  alternative: इसे आज मेरे सामने घटित कर / आज मुझे सफलता दे
  rationale: इस प्रसंग में सेवक परमेश्वर से इच्छित भेंट को घटित कराने की प्रार्थना करता है। अनुवाद घटना और उसके अनुकूल परिणाम दोनों रखता है, बिना दैवी व्यवस्था की प्रकृति को अधिक परिभाषित किए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। ‘हे’ सम्बोधन की गंभीरता रखता है; ‘कृपा करके’ נָא की विनम्रता व्यक्त करता है। वाक्य में मूल की घटना-केन्द्रित भाषा और प्रसंगगत सफलता के बीच संतुलन रखा गया है।
