  yaml_path: translation/ot/genesis/024/058.yaml
  text: So they called Rebekah and said to her, “Will you go with this man?” And she said, “I will go.”
translation:
  language: hi
  text: तब उन्होंने रिबका को बुलाकर उससे कहा, “क्या तुम इस आदमी के साथ जाओगी?” उसने कहा, “मैं जाऊँगी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ לְרִבְקָה
  choice: उन्होंने रिबका को बुलाकर
  rationale: קרא यहाँ किसी को बातचीत के लिए बुलाने के अर्थ में है। ‘बुलाकर’ स्वाभाविक हिन्दी है और ‘तलब किया’ जैसी अनावश्यक कठोरता से बचता है। नाम רִבְקָה का प्रचलित हिन्दी रूप ‘रिबका’ रखा गया है।
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: उससे कहा
  rationale: मूल में सामान्य क्रिया אמר, ‘कहना’, है। प्रश्न होने पर भी ‘पूछा’ के बजाय ‘कहा’ स्रोत की अभिव्यक्ति को अधिक सीधे रखता है।
- source_word: הֲתֵלְכִי
  choice: क्या तुम ... जाओगी?
  rationale: הלך की स्त्रीलिंग एकवचन प्रश्नात्मक रूप को सीधे और स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘क्या तुम जाना चाहती हो?’ जैसी अतिरिक्त इच्छासूचक व्याख्या नहीं जोड़ी गई।
- source_word: עִם הָאִישׁ הַזֶּה
  choice: इस पुरुष के साथ
  rationale: אִישׁ का सीधा अर्थ ‘पुरुष’ है। प्रसंग में वह सेवक है, पर मूल पाठ यहाँ ‘सेवक’ नहीं कहता; इसलिए उस पहचान को अनुवाद में नहीं जोड़ा गया।
- source_word: וַתֹּאמֶר אֵלֵךְ
  choice: उसने कहा, “मैं जाऊँगी।”
  rationale: दोनों सामान्य क्रियाओं, אמר और הלך, को क्रमशः ‘कहा’ और ‘जाऊँगी’ से व्यक्त किया गया है। स्त्री वक्ता के अनुसार भविष्यकाल का स्त्रीलिंग रूप रखा गया है।
