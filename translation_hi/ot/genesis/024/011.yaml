translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और कथात्मक शैली। हिब्रू के दोनों समय-सूचक पदों को हिंदी में मुख्य समय-वाक्यांश और व्याख्यात्मक उपवाक्य के रूप में रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं, क्योंकि स्त्रीलिंग बहुवचन का आशय मुख्य पाठ में स्पष्ट है।
