base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/011.yaml
  text: And he made the camels kneel down outside the city by the well of water at evening time[b][a], at the time when the women go out to draw water.
translation:
  language: hi
  text: उसने ऊँटों को नगर के बाहर पानी के कुएँ के पास, साँझ के समय, उस समय जब पानी भरने वाली स्त्रियाँ बाहर निकलती थीं, घुटनों के बल बैठा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְרֵךְ
  choice: बैठा दिया
  rationale: ब्रך का हिफ़ील रूप यहाँ ऊँटों को घुटनों के बल बैठाने की क्रिया बताता है। हिंदी में ऊँटों के लिए ‘बैठा दिया’ स्वाभाविक है और कारक अर्थ बनाए रखता है।
- source_word: הַגְּמַלִּים
  choice: ऊँटों को
  rationale: निश्चित बहुवचन संज्ञा; प्रसंग में पहले उल्लिखित कारवाँ के ऊँट अभिप्रेत हैं।
- source_word: מִחוּץ לָעִיר
  choice: नगर के बाहर
  rationale: स्थानवाचक अर्थ को सीधे और गरिमापूर्ण आधुनिक हिंदी में व्यक्त करता है।
- source_word: אֶל בְּאֵר הַמָּיִם
  choice: पानी के कुएँ के पास
  rationale: אֶל दिशा की ओर संकेत करता है, पर ऊँटों के बैठ जाने के बाद प्राप्त स्थान को हिंदी में ‘के पास’ स्वाभाविक रूप से व्यक्त करता है; ‘पानी का कुआँ’ वाला ठोस हिब्रू वाक्यांश भी सुरक्षित है।
- source_word: לְעֵת עֶרֶב
  choice: साँझ के समय
  rationale: समय-सूचक पद का स्पष्ट, स्वाभाविक और साहित्यिक हिंदी रूप।
- source_word: לְעֵת צֵאת הַשֹּׁאֲבֹת
  choice: जब पानी भरनेवाली स्त्रियाँ बाहर निकलती थीं
  rationale: הַשֹּׁאֲבֹת स्त्रीलिंग बहुवचन कृदंत है, इसलिए स्त्रियों का उल्लेख स्पष्ट रखा गया है। צֵאת के निकलने के अर्थ को भी व्यक्त किया गया है।
