base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/067.yaml
  text: And Isaac brought her into the tent of Sarah his mother[a], and he took Rebekah, and she became his wife, and he loved her[b]. So Isaac was comforted after his mother's death.
translation:
  language: hi
  text: इसहाक उसे अपनी माँ सारा के तंबू में ले आया, और उसने रिबका को ग्रहण किया; वह उसकी पत्नी हो गई, और उसने उससे प्रेम किया। इस प्रकार इसहाक को अपनी माँ के बाद[a] सांत्वना मिली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “अपनी माँ के बाद।” संदर्भ में आशय सारा की मृत्यु के बाद का है, यद्यपि इब्रानी में “मृत्यु” शब्द स्पष्ट रूप से नहीं आया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִאֶהָ
  choice: उसे ... तंबू में ले आया
  rationale: בוא के हिफ़ील रूप और स्त्रीलिंग कर्म-प्रत्यय का अर्थ है कि इसहाक उसे भीतर ले आया; हिंदी में यह स्वाभाविक रूप से प्रवेश की दिशा भी व्यक्त करता है।
- source_word: הָאֹהֱלָה שָׂרָה אִמּוֹ
  choice: अपनी माँ सारा के तंबू में
  rationale: दिशासूचक ה प्रवेश को दर्शाता है और संबंधसूचक पदबंध तंबू को इसहाक की माँ सारा से जोड़ता है। हिंदी में यह क्रम स्पष्ट और स्वाभाविक है।
- source_word: וַיִּקַּח אֶת־רִבְקָה
  choice: उसने रिबका को ग्रहण किया
  rationale: לקח का मूल अर्थ 'लेना' है, पर विवाह के प्रसंग में हिंदी का 'ग्रहण किया' गरिमापूर्ण है और अगले स्पष्ट कथन—वह उसकी पत्नी हो गई—को अनावश्यक रूप से समेटता नहीं।
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: वह उसकी पत्नी हो गई
  rationale: היה + ל + אשה वैवाहिक स्थिति में आने को व्यक्त करता है; यह हिंदी में सहज और क्रमबद्ध अनुवाद है।
- source_word: וַיֶּאֱהָבֶהָ
  choice: वह उससे प्रेम करने लगा
  rationale: אהב का सीधा अर्थ प्रेम करना है। 'करने लगा' कथानक में विवाह के बाद उत्पन्न प्रेम को स्वाभाविक हिंदी में व्यक्त करता है, बिना प्रेम की प्रकृति को अधिक परिभाषित किए।
- source_word: וַיִּנָּחֵם
  choice: सांत्वना मिली
  rationale: נחם का निफ़अल यहाँ शोक में सांत्वना पाने को बताता है, न कि मन फिराने या पश्चात्ताप करने को।
- source_word: אַחֲרֵי אִמּוֹ
  choice: अपनी माँ की मृत्यु के बाद
  rationale: शाब्दिक रूप से पदबंध 'अपनी माँ के बाद' है, किंतु उत्पत्ति 23 के संदर्भ में आशय उसकी माँ की मृत्यु के बाद का है; स्पष्ट हिंदी के लिए निहित अर्थ मुख्य पाठ में व्यक्त किया गया है।
theological_decisions:
- issue: אַחֲרֵי אִמּוֹ में 'मृत्यु' का निहित अर्थ
  choice: अपनी माँ की मृत्यु के बाद
  alternative: अपनी माँ के बाद
  rationale: इब्रानी में 'मृत्यु' शब्द स्पष्ट रूप से नहीं है, पर पूर्ववर्ती संदर्भ में सारा की मृत्यु और यहाँ इसहाक को मिलने वाली सांत्वना आशय स्पष्ट करते हैं। शाब्दिक विकल्प आधुनिक हिंदी में अस्पष्ट और अस्वाभाविक होगा।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। 'ग्रहण किया' विवाह-संदर्भ को संकेत करता है, जबकि अगले स्वतंत्र उपवाक्य की प्रगति बनाए रखता है। किसी संप्रदाय-विशेष की शब्दावली नहीं जोड़ी गई।
