base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/028.yaml
  text: Then the young woman ran and told her mother's household about these things[a].
translation:
  language: hi
  text: तब वह युवती दौड़कर अपनी माँ के घर के लोगों को ये बातें बताईं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी माँ के घर में।” इब्रानी वाक्यांश का अर्थ भौतिक घर या उसकी माँ से जुड़ा घराना/परिवार—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרָץ
  choice: दौड़कर
  rationale: रוץ तेज़ी से दौड़ने को व्यक्त करता है; कथा के क्रम में ‘दौड़कर’ स्वाभाविक और सीधा है।
- source_word: הַנַּעֲרָ
  choice: वह युवती
  rationale: נַעֲרָה एक युवा स्त्री को सूचित करता है। ‘युवती’ आधुनिक, सम्मानजनक और रिबका के संदर्भ के अनुकूल है।
- source_word: וַתַּגֵּד
  choice: बताने लगी
  rationale: נגד के हिफ़ील रूप का अर्थ किसी बात को ज्ञात कराना या बताना है। हिंदी में संयुक्त क्रियाओं की श्रृंखला को स्वाभाविक बनाने हेतु ‘बताने लगी’ चुना गया है।
- source_word: לְבֵית אִמָּהּ
  choice: अपनी माँ के घराने को
  rationale: בַּיִת भौतिक घर अथवा उससे जुड़ा परिवार/घराना दोनों बता सकता है। मुख्य पाठ में ‘घराने’ से संबोधित लोगों का भाव स्पष्ट होता है, जबकि पादटिप्पणी ‘घर’ की वास्तविक संभावना सुरक्षित रखती है।
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: इन बातों के बारे में
  rationale: דְּבָרִים का अर्थ शब्द, बातें या घटनाएँ हो सकता है। प्रसंग में रिबका घटी हुई बातों का समाचार देती है, इसलिए यह अभिव्यक्ति सहज है और अर्थ-सीमा को अनावश्यक रूप से संकुचित नहीं करती।
