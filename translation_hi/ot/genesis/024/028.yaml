review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the narrative sequence, the young woman, her running, her communication, and the likely household sense of לְבֵית אִמָּהּ. However, “बताने लगी” introduces an inceptive/progressive nuance (“began to tell”) not expressed by the Hebrew wayyiqtol וַתַּגֵּד, which simply reports that she told/recounted.
  naturalness: “अपनी माँ के घर के लोगों को” is more idiomatic modern Hindi than “अपनी माँ के घराने को,” while retaining the intended household referent. “ये बातें बताईं” is concise and natural narrative Hindi.
  terminology: “युवती” is an appropriate modern rendering of הַנַּעֲרָ in this context. The footnote appropriately preserves the possible physical-house sense of בַּיִת.
  issues:
  - severity: medium
    issue: The phrase “बताने लगी” adds an unmarked inceptive sense.
    rationale: וַתַּגֵּד is a completed sequential narrative verb, “and she told/made known,” not explicitly “she began to tell.”
  - severity: low
    issue: “अपनी माँ के घराने को” is somewhat stiff as a recipient in Hindi.
    rationale: “अपनी माँ के घर के लोगों को” more naturally identifies the people of the maternal household, which are the likely recipients.
  revised_text: तब वह युवती दौड़कर अपनी माँ के घर के लोगों को ये बातें बताईं।[a]
  revised_footnotes:
