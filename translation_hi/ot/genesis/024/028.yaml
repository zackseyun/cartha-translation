  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘युवती’ पुरातन ‘कुमारी’ से अधिक स्वाभाविक है और ‘घराना’ इब्रानी בַּיִת के पारिवारिक अर्थ को व्यक्त करता है।
