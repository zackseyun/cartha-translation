  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר שָׁמַ֛ע עֶ֥בֶד אַבְרָהָ֖ם אֶת דִּבְרֵי/הֶ֑ם וַ/יִּשְׁתַּ֥חוּ אַ֖רְצָ/ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/052.yaml
  text: And when Abraham’s servant heard their words[c][b][a], he bowed down to the ground before Yahweh.
translation:
  language: hi
  text: जब अब्राहम के सेवक ने उनकी बातें सुनीं, तो उसने भूमि पर झुककर यहोवा को दंडवत किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: जब … तो
  rationale: इब्रानी कथात्मक सूत्र और घटना-क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; शाब्दिक ‘और ऐसा हुआ कि जब’ अनावश्यक रूप से बोझिल होता।
- source_word: שָׁמַע
  choice: सुनीं
  rationale: यहाँ कही गई बातों को सुनने का सीधा अर्थ है।
- source_word: עֶבֶד אַבְרָהָם
  choice: अब्राहम के सेवक
  rationale: सम्बन्धवाचक इब्रानी रचना का सहज हिन्दी रूप है। עֶבֶד का अर्थ ‘दास’ भी हो सकता है, पर इस प्रसंग में उसकी घरेलू प्रतिनिधि की भूमिका प्रमुख है।
- source_word: דִּבְרֵיהֶם
  choice: उनकी बातें
  rationale: ‘उनके शब्द’ की अपेक्षा आधुनिक हिन्दी में अधिक स्वाभाविक है और कही गई बातों का अर्थ सुरक्षित रखता है।
- source_word: וַיִּשְׁתַּחוּ
  choice: दण्डवत् किया
  rationale: यह क्रिया गहराई से झुकने या भूमि पर गिरकर श्रद्धा प्रकट करने को दर्शाती है। ‘दण्डवत् किया’ शारीरिक मुद्रा और भक्तिपूर्ण आदर दोनों को व्यक्त करता है, बिना इसे केवल ‘आराधना की’ बनाकर शारीरिक क्रिया मिटाए।
- source_word: אַרְצָה
  choice: भूमि तक झुककर
  rationale: दिशासूचक रूप नीचे भूमि की ओर गति बताता है; यह हिन्दी वाक्य में क्रिया की दृश्यता बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: לְ का सीधा दातृवाचक/लक्ष्यगत सम्बन्ध सुरक्षित रहता है और השתחוה के साथ स्वाभाविक हिन्दी बनती है। परमेश्वर के व्यक्तिगत नाम को ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम स्पष्ट है। हिन्दी की प्रचलित बाइबलीय परम्परा में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: וַיִּשְׁתַּחוּ को स्पष्ट रूप से ‘आराधना’ कहना या शारीरिक क्रिया बनाए रखना
  choice: भूमि तक झुककर … दण्डवत् किया
  alternative: यहोवा की आराधना की
  rationale: אַרְצָה शारीरिक मुद्रा को स्पष्ट करता है। चुना हुआ रूप श्रद्धा और उपासना का भाव खुला रखता है, पर मूल में वर्णित शारीरिक क्रिया को अमूर्त नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘दण्डवत्’ सामान्य पाठकों के लिए परिचित धार्मिक शब्द है; ‘भूमि तक झुककर’ उसके ठोस शारीरिक अर्थ को स्पष्ट करता है।
