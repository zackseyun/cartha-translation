  yaml_path: translation/ot/genesis/024/024.yaml
  text: She said to him[a], “I am the daughter of Bethuel son of Milcah, whom she bore to Nahor.”
translation:
  language: hi
  text: उसने उससे कहा, “मैं बतूएल की बेटी हूँ, जो मिल्का का बेटा था और जिसे मिल्का ने नाहोर के लिए जन्म दिया था।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे मिल्का ने नाहोर के लिए जना था।” इब्रानी जन्म-सूत्र में “के लिए जन्म दिया” पिता, अर्थात् नाहोर, की पहचान कराता है।
    reason: इब्रानी לְ के जन्म-सूत्रगत प्रयोग का शाब्दिक विकल्प और उसका आवश्यक स्पष्टीकरण।
lexical_decisions:
