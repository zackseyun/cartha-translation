  choice: उसने उससे कहा
  rationale: क्रमिक कथन को स्वाभाविक हिन्दी भूतकाल में रखा गया है; אֵלָיו स्पष्ट करता है कि उसने उस पुरुष से कहा।
- source_word: בַּת בְּתוּאֵל אָנֹכִי
  choice: मैं बतूएल की बेटी हूँ
  rationale: इब्रानी का विधेयात्मक परिचय आधुनिक हिन्दी में इसी क्रम में स्वाभाविक और स्पष्ट है; אָנֹכִי की स्पष्ट प्रथम-पुरुष अभिव्यक्ति सुरक्षित है।
- source_word: בֶּן מִלְכָּה
  choice: बतूएल मिल्का का बेटा है
  rationale: अलग वाक्य बनाकर वंश-संबंध स्पष्ट किया गया है और यह भ्रांति टाली गई है कि वक्ता स्वयं मिल्का का बेटा है।
- source_word: אֲשֶׁר יָלְדָה
  choice: जिसे उसने ... जन्म दिया था
  rationale: सम्बन्धवाचक उपवाक्य का लक्ष्य बतूएल है और स्त्रीलिंग कर्ता मिल्का है; हिन्दी में सामान्य जन्म-संबंधी अभिव्यक्ति अपनाई गई है।
- source_word: לְנָחוֹר
  choice: नाहोर के लिए
  rationale: לְ को जन्म-सूत्र में पिता या पितृ-संबंध सूचित करने वाले रूप में अपेक्षाकृत औपचारिक ढंग से रखा गया है; वैकल्पिक अधिक स्पष्ट अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: בְּתוּאֵל / מִלְכָּה / נָחוֹר
  choice: बतूएल / मिल्का / नाहोर
  rationale: व्यक्तिवाचक नामों का प्रचलित हिन्दी लिप्यंतरण किया गया है।
