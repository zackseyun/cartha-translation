  text: וַ/תֹּ֣אמֶר אֵלָ֔י/ו גַּם תֶּ֥בֶן גַּם מִסְפּ֖וֹא רַ֣ב עִמָּ֑/נוּ גַּם מָק֖וֹם לָ/לֽוּן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/025.yaml
  text: Then she said to him[a], “We have plenty of both straw and fodder, and also a place to spend the night.”
translation:
  language: hi
  text: फिर उसने उससे कहा, “हमारे यहाँ भूसा और चारा बहुत है, और रात बिताने के लिए जगह भी है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: फिर उसने कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘फिर’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: אֵלָיו
  choice: उससे
  rationale: पूर्वसर्ग और पुल्लिंग एकवचन प्रत्यय का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: גַּם ... גַּם ... גַּם
  choice: भूसा और चारा ... और ... भी
  rationale: बार-बार आए גַּם का संचयी भाव हिन्दी की स्वाभाविक समुच्चयात्मक रचना में सुरक्षित रखा गया है।
- source_word: תֶּבֶן
  choice: भूसा
  rationale: पशुओं की देखभाल के इस प्रसंग में यह प्रचलित और स्पष्ट हिन्दी शब्द है।
- source_word: מִסְפּוֹא
  choice: चारा
  rationale: पशुओं के आहार के लिए आधुनिक हिन्दी का सहज और सटीक शब्द।
- source_word: רַב
  choice: बहुत
  rationale: यह उपलब्ध भूसे और चारे की प्रचुरता बताता है और हिन्दी में सहज है।
- source_word: עִמָּנוּ
  choice: हमारे यहाँ
  rationale: शाब्दिक अर्थ ‘हमारे साथ/पास’ है; आतिथ्य के संदर्भ में ‘हमारे यहाँ’ उपलब्धता और घर-परिवार के स्थान, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מָקוֹם
  choice: जगह
  rationale: मूल के सामान्य अर्थ को बनाए रखता है; ‘कमरा’ अनावश्यक रूप से अधिक विशिष्ट होता।
- source_word: לָלוּן
  choice: रात बिताने के लिए
  rationale: रात भर ठहरने के अर्थ को स्पष्ट, आधुनिक और स्वाभाविक हिन्दी में व्यक्त करता है।
