  edition: WLC
  text: וְ/אַבְרָהָ֣ם זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַֽ/יהוָ֛ה בֵּרַ֥ךְ אֶת אַבְרָהָ֖ם בַּ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/001.yaml
  text: Abraham was old[a], advanced in years, and Yahweh had blessed Abraham in all things.
translation:
  language: hi
  text: अब्राहम बूढ़ा था और बहुत वृद्ध हो चुका था[a]; और याहवे ने अब्राहम को हर बात में आशीष दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘दिनों में आ चुका था’; यह बहुत अधिक आयु हो जाने का मुहावरा है।
    reason: मूल इब्रानी मुहावरे के शाब्दिक रूप और उसके आशय को स्पष्ट करना।
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: अब्राहम
  rationale: वाव यहाँ नए कथात्मक खंड को जोड़ता है; हिन्दी में आरम्भिक ‘और’ के बिना वाक्य अधिक स्वाभाविक है, जबकि आगे के संदर्भ से संबंध स्पष्ट रहता है।
- source_word: זָקֵן
  choice: बूढ़ा हो गया था
  rationale: यह अब्राहम की वृद्धावस्था को सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בָּא בַּיָּמִים
  choice: उसकी आयु बहुत हो चुकी थी
  rationale: शाब्दिक अर्थ ‘दिनों में आ चुका था’ है; चुना हुआ वाक्यांश उन्नत आयु का मुहावरेदार भाव स्पष्ट करता है और זָקֵן के साथ मूल की पुनरुक्ति भी बनाए रखता है।
- source_word: וַֽ/יהוָה
  choice: और याहवे
  rationale: वाव दोनों कथनों को जोड़ता है और याहवे चार-अक्षरीय परमेश्वर-नाम को नाम के रूप में प्रस्तुत करता है।
- source_word: בֵּרַךְ
  choice: आशीष दी थी
  rationale: हिब्रू पूर्ण क्रिया यहाँ कथा की पृष्ठभूमि में पहले से विद्यमान आशीष का सार देती है; हिन्दी का पूर्ण भूतकाल इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּ/כֹּל
  choice: हर प्रकार से
  rationale: यह व्यापक और सर्वांगीण आशीष का भाव देता है तथा अर्थ को केवल भौतिक वस्तुओं तक सीमित नहीं करता।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरीय निजी नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसे उपाधि में बदले बिना और किसी सम्प्रदायगत व्याख्या को जोड़े बिना नाम के रूप में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बूढ़ा हो गया था’ और ‘आयु बहुत हो चुकी थी’ की समानार्थी पुनरुक्ति जानबूझकर रखी गई है, क्योंकि मूल इब्रानी वृद्धावस्था को दो अभिव्यक्तियों से बल देता है।
