  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। संबोधन के एकवचन को प्रसंगानुकूल आदरसूचक ‘आप’ से व्यक्त किया गया है। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि अधिक शाब्दिक विकल्प अर्थ में उल्लेखनीय भिन्नता नहीं लाता।
