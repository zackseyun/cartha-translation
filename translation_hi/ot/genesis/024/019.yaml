  yaml_path: translation/ot/genesis/024/019.yaml
  text: When she had finished giving him a drink[a], she said, “I will draw water for your camels also, until they have finished drinking.”
translation:
  language: hi
  text: जब वह उसे पानी पिला चुकी, तो उसने कहा, “मैं आपके ऊँटों के लिए भी पानी भरूँगी, जब तक वे पी न चुकें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּכַל לְהַשְׁקֹתוֹ
  choice: जब वह उसे पानी पिला चुकी
  rationale: כלה के पूर्णता-बोध और שקה के हिफ़ील रूप, ‘किसी को पीने के लिए देना/पिलाना,’ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है और अगली घटना से पहले पहली क्रिया की समाप्ति दिखाता है।
- source_word: וַתֹּאמֶר
  choice: तो उसने कहा
  rationale: हिब्रू कथात्मक क्रम को हिन्दी में सहज काल-संबंध के साथ व्यक्त करता है; प्रत्येक वाव का यांत्रिक अनुवाद ‘और’ करना आवश्यक नहीं है।
- source_word: גַּם לִגְמַלֶּיךָ
  choice: आपके ऊँटों के लिए भी
  rationale: גַּם का योगात्मक अर्थ ‘भी,’ לְ का हितार्थ ‘के लिए,’ और द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय आदरसूचक ‘आपके’ से सुरक्षित रहता है।
- source_word: אֶשְׁאָב
  choice: पानी भरूँगी
  rationale: שאב का अर्थ कुएँ या सोते से पानी निकालना/भरना है। प्रसंग से निहित ‘पानी’ को स्पष्ट करना हिन्दी में स्वाभाविक है।
- source_word: עַד אִם כִּלּוּ לִשְׁתֹּת
  choice: जब तक वे पी न चुकें
  rationale: עַד אִם यहाँ समाप्ति-सीमा बताता है और כלה के साथ שתה का अर्थ ‘पी चुकना’ है; यह हिन्दी रचना पूर्ण endpoint को सहज ढंग से व्यक्त करती है।
