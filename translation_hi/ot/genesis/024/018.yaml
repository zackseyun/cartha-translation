review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the imperative invitation, the respectful human address, Rebekah’s haste, the lowering of the jar, and the causative sense of the final verb. However, “अपने हाथ पर उतारा” is syntactically awkward in modern Hindi and does not clearly convey the downward movement explicit in וַתֹּרֶד. Adding “नीचे” preserves that movement without supplying an unstated shoulder reference.
  naturalness: The register is generally clear and appropriately respectful. “अपने हाथ पर नीचे उतारा” is more comprehensible and natural than “अपने हाथ पर उतारा,” while retaining the deliberately concrete, somewhat unusual physical detail of the Hebrew.
  terminology: “मेरे स्वामी” appropriately preserves the literal deferential address without treating it as a divine title. The footnote’s alternative “महोदय” is suitable. “पानी पिलाया” naturally conveys the causative verb in this well-side context.
  issues:
  - severity: low
    issue: The phrase “अपना घड़ा अपने हाथ पर उतारा” lacks an explicit expression of downward motion and is awkward in Hindi.
    rationale: וַתֹּרֶד explicitly means that she brought/lowered the jar down. “अपने हाथ पर नीचे उतारा” makes this action clear while retaining “अपने हाथ पर” for עַל יָדָהּ and avoiding added contextual detail.
