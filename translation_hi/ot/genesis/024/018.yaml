  yaml_path: translation/ot/genesis/024/018.yaml
  text: She said[a], “Drink, my lord,” and she quickly lowered her jar onto her hand and gave him a drink.
translation:
  language: hi
  text: उसने कहा, “पीजिए, मेरे स्वामी[a]।” फिर उसने फुर्ती से अपना घड़ा अपने हाथ पर नीचे उतारा और उसे पानी पिलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महोदय।” इब्रानी संबोधन का शाब्दिक अर्थ “मेरे स्वामी” है; यहाँ यह किसी पुरुष के लिए आदरसूचक संबोधन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: पीजिए
  rationale: यह שׁתה का पुल्लिंग एकवचन आज्ञार्थक रूप है। आदरसूचक “पीजिए” प्रसंग के सामाजिक शिष्टाचार और सीधे निमंत्रण, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: शाब्दिक अर्थ “मेरे स्वामी/मेरे प्रभु” है और यहाँ यह किसी मनुष्य के लिए आदरसूचक संबोधन है, परमेश्वर की उपाधि नहीं। “मेरे स्वामी” मूल की सामाजिक विनम्रता बनाए रखता है; वैकल्पिक स्वाभाविक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַתְמַהֵר
  choice: फुर्ती से
  rationale: क्रिया शीघ्रता या तत्परता प्रकट करती है। इसे अगली क्रिया के साथ क्रियाविशेषण के रूप में रखना आधुनिक हिन्दी में सहज है और उसके तुरंत किए गए कार्य पर बल बनाए रखता है।
- source_word: וַתֹּרֶד כַּדָּהּ
  choice: अपना घड़ा ... उतारा
  rationale: यह घड़े को उठाए हुए स्थान से नीचे लाने की क्रिया बताता है। “उतारा” संक्षिप्त और प्रसंगानुकूल हिन्दी है।
- source_word: עַל יָדָהּ
  choice: अपने हाथ पर
  rationale: इब्रानी में स्पष्टतः “उसके हाथ पर” है। यह सम्भवतः घड़े को पानी पिलाने की स्थिति में लाने का वर्णन करता है। अनुवाद मूल की ठोस शारीरिक भाषा रखता है और इस पद में न कही गई “कंधे से” जैसी बात नहीं जोड़ता।
- source_word: וַתַּשְׁקֵהוּ
  choice: उसे पानी पिलाया
  rationale: שׁקה का हिफ़ील रूप किसी को पीने देने या पिलाने का अर्थ रखता है। “पानी पिलाया” आधुनिक हिन्दी में स्वाभाविक है और कथा-संदर्भ में निहित पेय को स्पष्ट करता है।
