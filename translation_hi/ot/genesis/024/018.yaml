translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। “पीजिए” और “मेरे स्वामी” रिबका के आदरपूर्ण संबोधन को बनाए रखते हैं; “फुर्ती से” उसकी तत्परता को स्वाभाविक ढंग से व्यक्त करता है।
