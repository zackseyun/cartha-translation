  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֨ר כִּלּ֤וּ הַ/גְּמַלִּים֙ לִ/שְׁתּ֔וֹת וַ/יִּקַּ֤ח הָ/אִישׁ֙ נֶ֣זֶם זָהָ֔ב בֶּ֖קַע מִשְׁקָל֑/וֹ וּ/שְׁנֵ֤י צְמִידִים֙ עַל יָדֶ֔י/הָ עֲשָׂרָ֥ה זָהָ֖ב מִשְׁקָלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/022.yaml
  text: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
translation:
  language: hi
  text: जब ऊँट पानी पी चुके, तब उस व्यक्ति ने एक बेका[b] वज़न का सोने का छल्ला[a] और उसके हाथों के लिए सोने के दो कंगन लिए, जिनका वज़न दस शेकेल था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द नाक या कान में पहने जाने वाले छल्ले के अर्थ में हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: बेका भार की एक इकाई थी, जो आधे शेकेल के बराबर थी।
    reason: cultural_note
lexical_decisions:
- source_word: כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת
  choice: जब ऊँट पानी पी चुके
  rationale: यह रचना ऊँटों के पीना समाप्त करने के बाद अगली क्रिया का समय बताती है; हिन्दी में यह स्वाभाविक और क्रम-संगत है।
- source_word: הָאִישׁ
  choice: उस पुरुष ने
  rationale: इब्रानी में यहाँ सेवक नहीं, केवल 'पुरुष' कहा गया है; प्रसंग से पहचान स्पष्ट होने पर भी स्रोत की शब्दावली सुरक्षित रखी गई है।
- source_word: נֶזֶם זָהָב
  choice: सोने की एक नथ
  rationale: נֶזֶם नाक या कान में पहना जाने वाला छल्ला हो सकता है। उत्पत्ति 24:47 में इसे नाक पर रखने का स्पष्ट उल्लेख इस प्रसंग में 'नथ' का प्रबल समर्थन करता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: בֶּקַע מִשְׁקָלוֹ
  choice: आधा शेकेल वज़न की
  rationale: בֶּקַע आधे शेकेल के बराबर प्राचीन भार था। हिन्दी पाठक के लिए अर्थ सीधे स्पष्ट करने हेतु उसके समतुल्य को मुख्य पाठ में दिया गया है।
- source_word: וּשְׁנֵי צְמִידִים עַל יָדֶיהָ
  choice: उसके हाथों के लिए सोने के दो कंगन
  rationale: दो की स्पष्ट संख्या सुरक्षित है। 'हाथों के लिए' עַל יָדֶיהָ के भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना कलाई या बाँह को अनावश्यक रूप से निश्चित किए।
- source_word: עֲשָׂרָה זָהָב מִשְׁקָלָם
  choice: जिनका कुल वज़न दस शेकेल था
  rationale: इब्रानी में भार की इकाई प्रसंगतः निहित है; हिन्दी में 'शेकेल' जोड़ना अर्थ स्पष्ट करता है। 'कुल' बताता है कि यह दोनों कंगनों का संयुक्त वज़न है।
