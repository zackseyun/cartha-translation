translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘पुरुष’ הָאִישׁ की औपचारिक परंतु सामान्य संगति है। मूल के लंबे वाक्य को ‘जब ... तब’ संरचना में रखा गया है, और הִנֵּה की सजीवता ‘और देखो’ से संरक्षित की गई है।
