- from: जब उसने अपनी बहन के हाथों में नथ और कंगन देखे, और अपनी बहन रिबका को यह कहते सुना, “उस पुरुष ने मुझसे ऐसा-ऐसा कहा,” तब वह उस पुरुष के पास गया। और देखो, वह सोते[a] के पास ऊँटों के निकट[b] खड़ा था।
  to: जब उसने अपनी बहन के हाथों में नथ और कंगन देखे, और अपनी बहन रिबका की ये बातें सुनीं कि, “उस पुरुष ने मुझसे इस प्रकार बात की,” तब वह उस पुरुष के पास गया। और देखो, वह उस सोते[a] के पास ऊँटों के निकट[b] खड़ा था।
  rationale: 'Two small source-fidelity refinements are needed: the report is expressed as Rebekah’s words, and כֹּה is rendered as “इस प्रकार,” not the potentially diffuse “ऐसा-ऐसा.” The revised final clause keeps the distinct Hebrew location phrases for the spring and the camels, with both existing footnote anchors retained.'
