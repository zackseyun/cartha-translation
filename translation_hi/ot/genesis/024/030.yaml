source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/רְאֹ֣ת אֶת הַ/נֶּ֗זֶם וְֽ/אֶת הַ/צְּמִדִים֮ עַל יְדֵ֣י אֲחֹת/וֹ֒ וּ/כְ/שָׁמְע֗/וֹ אֶת דִּבְרֵ֞י רִבְקָ֤ה אֲחֹת/וֹ֙ לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר אֵלַ֖/י הָ/אִ֑ישׁ וַ/יָּבֹא֙ אֶל הָ/אִ֔ישׁ וְ/הִנֵּ֛ה עֹמֵ֥ד עַל הַ/גְּמַלִּ֖ים עַל הָ/עָֽיִן׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/030.yaml
  text: And it happened[a], when he saw the nose ring and the bracelets on his sister’s hands, and when he heard the words of Rebekah his sister, saying, “This is what the man said to me,” that he went to the man. And behold[d][c][b], he was standing by the camels at the spring.
translation:
  language: hi
  text: जब उसने अपनी बहन के हाथों में नथ और कंगन देखे, और अपनी बहन रिबका की ये बातें सुनीं कि, “उस पुरुष ने मुझसे इस प्रकार बात की,” तब वह उस पुरुष के पास गया। और देखो, वह उस सोते[a] के पास ऊँटों के निकट[b] खड़ा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जलस्रोत के पास।” हिब्रू शब्द עַיִן का अर्थ यहाँ प्राकृतिक सोता या पानी का स्रोत है।
    reason: lexical_alternative
  - marker: b
    text: या “ऊँटों के पास।” हिब्रू संबंधबोधक शब्द निकट स्थित होने का भाव देता है, ऊँटों के ऊपर होने का नहीं।
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיְהִי
  choice: जब ... तब
  rationale: यहाँ וַיְהִי घटनाक्रम को आगे बढ़ाता है; लंबे हिब्रू वाक्य को स्वाभाविक आधुनिक हिन्दी में ‘जब ... तब’ रचना से व्यक्त किया गया है।
- source_word: הַנֶּזֶם
  choice: नथ
  rationale: נֶזֶם सामान्यतः छल्ला भी हो सकता है, पर उत्पत्ति 24:47 में इसे रिबका की नाक पर पहनाया गया है; इसलिए प्रसंग में ‘नथ’ सटीक है।
- source_word: הַצְּמִדִים
  choice: कंगन
  rationale: यह जोड़ी में पहने जाने वाले हाथ/बाँह के आभूषणों को सूचित करता है; ‘कंगन’ सहज और प्रसंगानुकूल हिन्दी है।
- source_word: עַל יְדֵי אֲחֹתוֹ
  choice: अपनी बहन के हाथों में
  rationale: יָד का मूल अर्थ ‘हाथ’ है। हिन्दी में आभूषण के लिए ‘हाथों में’ स्वाभाविक है और हिब्रू के निकट भी रहता है।
- source_word: דִּבְרֵי רִבְקָה אֲחֹתוֹ לֵאמֹר
  choice: अपनी बहन रिबका को यह कहते सुना
  rationale: लֵאמֹר प्रत्यक्ष कथन का परिचय देता है; हिन्दी में यह रचना मूल संबंध को स्पष्ट और स्वाभाविक रूप से रखती है।
- source_word: כֹּה דִבֶּר אֵלַי הָאִישׁ
  choice: उस पुरुष ने मुझसे ऐसा-ऐसा कहा
  rationale: כֹּה का अर्थ ‘इस प्रकार/ऐसा’ है; ‘ऐसा-ऐसा कहा’ पहले बताए गए कथन की विषयवस्तु की ओर स्वाभाविक हिन्दी संकेत करता है।
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: वह उस पुरुष के पास गया
  rationale: בוא + אֶל यहाँ लाबान की गति उस पुरुष की ओर बताता है; हिन्दी दृष्टिकोण से ‘पास गया’ स्पष्ट है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה दृश्य को सजीव ढंग से सामने लाता है; ‘देखो’ इस कथात्मक बल को बनाए रखता है।
- source_word: עֹמֵד
  choice: खड़ा था
  rationale: कृदन्त उस समय जारी अवस्था को बताता है; ‘खड़ा था’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: עַל הַגְּמַלִּים
  choice: ऊँटों के निकट
  rationale: עַל यहाँ स्थान-संबंध में ‘के पास/निकट’ अर्थ देता है, न कि ऊँटों के ऊपर खड़े होने का।
- source_word: עַל הָעָיִן
  choice: सोते के पास
  rationale: עַיִן इस प्रसंग में प्राकृतिक जलस्रोत या सोता है; ‘सोता’ ‘कुआँ’ से अधिक शाब्दिक रूप से सटीक है।
