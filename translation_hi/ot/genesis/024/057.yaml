    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब उन्होंने कहा
  rationale: वय्यिक्तोल कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में आगे बढ़ाता है; ‘तब’ प्रसंगगत प्रतिक्रिया को व्यक्त करता है।
- source_word: נִקְרָא
  choice: हम ... बुलाकर
  rationale: समूह के प्रस्ताव या संकल्प को हिन्दी के स्वाभाविक संयुक्त विन्यास ‘बुलाकर ... पूछ लेते हैं’ में व्यक्त किया गया है।
- source_word: לַנַּעֲרָ
  choice: उस युवती को
  rationale: नַעֲרָה विवाह योग्य आयु की युवा स्त्री रिबका को सूचित करता है; ‘युवती’ आधुनिक, सम्मानजनक और प्रसंगानुकूल है।
- source_word: וְנִשְׁאֲלָה
  choice: पूछ लेते हैं
  rationale: दूसरे सहकारी क्रियारूप के प्रस्तावात्मक भाव को सहज हिन्दी में रखता है।
- source_word: אֶת פִּיהָ
  choice: उसी से
  rationale: शाब्दिक रूप ‘उसका मुँह’ एक इब्रानी मुहावरा है, जिसका आशय उसका अपना प्रत्यक्ष उत्तर जानना है; ‘उसी से’ व्यक्ति की स्वयं की सहमति/राय पूछने पर बल देता है, बिना उत्तर की विषयवस्तु जोड़े।
