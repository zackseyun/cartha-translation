  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सहज रूप। ‘स्वामी’, ‘चल पड़ा’ और ‘उसके हाथ में’ जैसे पद मूल कथन की औपचारिकता तथा ठोस बिंब को बनाए रखते हैं।
