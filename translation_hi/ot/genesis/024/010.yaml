id: GEN.24.10
reference: Genesis 24:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח הָ֠/עֶבֶד עֲשָׂרָ֨ה גְמַלִּ֜ים מִ/גְּמַלֵּ֤י אֲדֹנָי/ו֙ וַ/יֵּ֔לֶךְ וְ/כָל ט֥וּב אֲדֹנָ֖י/ו בְּ/יָד֑/וֹ וַ/יָּ֗קָם וַ/יֵּ֛לֶךְ אֶל אֲרַ֥ם נַֽהֲרַ֖יִם אֶל עִ֥יר נָחֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/010.yaml
  text: Then the servant took ten of his master's camels and went[a], with all kinds of good things from his master in his hand. And he arose and went to Aram-naharaim[d][c][b], to the city of Nahor.
translation:
  language: hi
  text: तब सेवक ने अपने स्वामी के ऊँटों में से दस ऊँट लिए और चल पड़ा। उसके स्वामी की सारी बहुमूल्य वस्तुएँ उसके हाथ में थीं[b]। फिर वह उठा और अराम-नहरैम[a] में नाहोर के नगर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘अराम-नहरैम’; परंपरागत अनुवादों में ‘मेसोपोटामिया’ या ‘दो नदियों का अराम’।'
    reason: स्थान-नाम के पारंपरिक अर्थ और पहचान की जानकारी देना, बिना उसे मुख्य पाठ में निश्चित किए।
  - marker: b
    text: या, “और उसके स्वामी का सारा माल उसके अधिकार में था।” इब्रानी का “उसके हाथ में” वस्तुओं को साथ ले जाने के साथ-साथ अधिकार या देखरेख भी व्यक्त कर सकता है।
    reason: इब्रानी मुहावरे की वास्तविक अर्थगत अस्पष्टता और वैकल्पिक पाठ को सुरक्षित रखना।
lexical_decisions:
- source_word: הָעֶבֶד
  choice: सेवक
  rationale: इस घरेलू और दायित्वपूर्ण प्रसंग में ‘सेवक’ स्वाभाविक है; इब्रानी शब्द दास या सेवक दोनों अर्थ दे सकता है, पर यहाँ बंधुआ स्थिति पर बल नहीं है।
- source_word: עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו
  choice: अपने स्वामी के ऊँटों में से दस ऊँट
  rationale: ‘में से’ מן की अंशवाचकता को स्पष्ट रखता है और इब्रानी में ‘ऊँट’ की पुनरावृत्ति को भी सहज हिन्दी में सुरक्षित रखता है।
- source_word: וַיֵּלֶךְ
  choice: चल पड़ा
  rationale: यह यात्रा आरम्भ करने का स्वाभाविक हिन्दी प्रयोग है और आगे आने वाले וַיָּקָם וַיֵּלֶךְ से क्रियात्मक भेद बनाए रखता है।
- source_word: וְכָל טוּב אֲדֹנָיו בְּיָדוֹ
  choice: उसके स्वामी की सारी बहुमूल्य वस्तुएँ उसके हाथ में थीं
  rationale: טוּב को इस प्रसंग में उपहार हेतु ले जाई जा रही मूल्यवान वस्तुओं के सामूहिक अर्थ में लिया गया है। ‘उसके हाथ में’ मूल बिंब को बनाए रखता है और साथ ही अधिकार/देखरेख का संकेत दे सकता है।
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: फिर वह उठा और ... गया
  rationale: दोनों इब्रानी क्रियाओं को मिलाए बिना कथा की क्रमिक और उद्देश्यपूर्ण गति सुरक्षित रखी गई है।
- source_word: אֲרַם נַהֲרַיִם
  choice: अराम-नहरैम
  rationale: स्थान-नाम का लिप्यंतरण किया गया है; ‘मेसोपोटामिया’ जैसी पारंपरिक पहचान को मुख्य पाठ में आरोपित नहीं किया गया।
- source_word: עִיר נָחוֹר
  choice: नाहोर का नगर
  rationale: यह स्वाभाविक रूप से संबंध व्यक्त करता है और यह तय नहीं करता कि नगर नाहोर ने बसाया था या केवल उससे संबद्ध था।
theological_decisions: []
