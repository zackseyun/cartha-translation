base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/013.yaml
  text: Look[a], I am standing by the spring of water[c][b], and the daughters of the men of the city are coming out to draw water.
translation:
  language: hi
  text: देखो, मैं पानी के सोते के पास खड़ा हूँ, और नगर के पुरुषों की बेटियाँ पानी भरने के लिए बाहर आ रही हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नगर के पुरुषों की बेटियाँ” इब्रानी की सामाजिक-पारिवारिक अभिव्यक्ति है; यहाँ इसका आशय नगर की स्त्रियों या युवतियों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह संकेतवाचक अव्यय सामने के दृश्य की ओर ध्यान खींचता है; आधुनिक हिन्दी में ‘देख’ इसकी जीवंतता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָנֹכִי נִצָּב
  choice: मैं ... खड़ा हूँ
  rationale: स्वतंत्र सर्वनाम और निफ़अल कृदंत वर्तमान स्थिति को व्यक्त करते हैं; हिन्दी में यह सहज और सटीक है।
- source_word: עַל עֵין הַמָּיִם
  choice: पानी के सोते के पास
  rationale: עַל यहाँ निकटता बताता है और עֵין הַמָּיִם प्राकृतिक जलस्रोत अर्थात सोते को दर्शाता है, सामान्य अर्थ वाले ‘कुएँ’ को नहीं।
- source_word: וּבְנוֹת אַנְשֵׁי הָעִיר
  choice: और नगर के पुरुषों की बेटियाँ
  rationale: यह इब्रानी की सामाजिक-पारिवारिक अभिव्यक्ति को बनाए रखता है; आशय नगर की युवतियों से है, पर मूल की विशिष्ट रचना को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: יֹצְאֹת
  choice: बाहर आ रही हैं
  rationale: स्त्रीलिंग बहुवचन कृदंत वक्ता की दृष्टि से जारी अथवा निकटवर्ती गति को व्यक्त करता है।
- source_word: לִשְׁאֹב מָיִם
  choice: पानी भरने के लिए
  rationale: जलस्रोत से पानी निकालने के लिए आधुनिक हिन्दी का स्वाभाविक मुहावरा ‘पानी भरना’ है।
