  text: וַ/יֹּ֕אמֶר בּ֖וֹא בְּר֣וּךְ יְהוָ֑ה לָ֤/מָּה תַעֲמֹד֙ בַּ/ח֔וּץ וְ/אָנֹכִי֙ פִּנִּ֣יתִי הַ/בַּ֔יִת וּ/מָק֖וֹם לַ/גְּמַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/031.yaml
  text: And he said[a], “Come in, blessed of Yahweh. Why do you stand outside? I have prepared the house, and a place for the camels.”
translation:
  language: hi
  text: उसने कहा, “अंदर आइए, हे यहोवा के धन्य व्यक्ति![a] आप बाहर क्यों खड़े हैं? मैंने घर खाली कर दिया है और ऊँटों के लिए जगह भी तैयार कर दी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे यहोवा द्वारा आशीषित व्यक्ति!” अथवा “हे यहोवा के आशीषित व्यक्ति!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; हिंदी में प्रसंगानुसार सरल भूतकाल स्वाभाविक है।
- source_word: בּוֹא
  choice: अंदर आइए
  rationale: आतिथ्य के इस प्रसंग में आज्ञार्थक בוא का आशय घर में प्रवेश करना है; आदरसूचक रूप सामाजिक संदर्भ के अनुकूल है।
- source_word: בְּרוּךְ יְהוָה
  choice: हे यहोवा के आशीषित जन
  rationale: निष्क्रिय कृदंत और दिव्य नाम यहाँ संबोधन का काम करते हैं। यह रूप उस संबोधन को स्पष्ट रखते हुए ‘यहोवा द्वारा आशीषित’ और ‘यहोवा का आशीषित’ के बीच की संभावित अर्थ-छाया को पादटिप्पणी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לָמָּה תַעֲמֹד בַּחוּץ
  choice: आप बाहर क्यों खड़े हैं?
  rationale: प्रत्यक्ष प्रश्न तथा עמד और בחוץ के स्थिति-संबंधी अर्थ को सहज आधुनिक हिंदी में रखा गया है।
- source_word: פִּנִּיתִי הַבַּיִת
  choice: मैंने घर तैयार कर दिया है
  rationale: פּנה का मूल भाव जगह खाली करना या व्यवस्थित करना है; आतिथ्य के प्रसंग में परिणामस्वरूप घर तैयार करने का अर्थ स्वाभाविक है।
- source_word: וּמָקוֹם לַגְּמַלִּים
  choice: और ऊँटों के लिए भी जगह बना दी है
  rationale: מָקוֹם का सीधा अर्थ ‘जगह’ है। हिंदी में ‘बना दी है’ पहले खंड के तैयारी-संबंधी भाव को स्वाभाविक रूप से आगे बढ़ाता है, बिना जगह के विशेष उपयोग को तय किए।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: इब्रानी पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। हिंदी पाठ में परिचित नामरूप ‘यहोवा’ व्यक्तिगत नाम को बनाए रखता है; ‘प्रभु’ कहने से वह उपाधि में बदल जाता।
- issue: בְּרוּךְ יְהוָה में आशीष के संबंध का अर्थ
  choice: यहोवा के आशीषित जन
  alternative: यहोवा द्वारा आशीषित जन
  rationale: संक्षिप्त इब्रानी रचना आशीषित व्यक्ति, आशीष के कर्ता और संबोधन के बीच कुछ अर्थगत खुलापन रखती है। मुख्य पाठ संबोधन को स्पष्ट करता है और पादटिप्पणी कर्तृवाचक विकल्प को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी, आदरसूचक संबोधन और सहज आतिथ्य-भाषा का प्रयोग किया गया है। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है।
