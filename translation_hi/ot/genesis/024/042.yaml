language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אָבֹ֥א הַ/יּ֖וֹם אֶל הָ/עָ֑יִן וָ/אֹמַ֗ר יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אִם יֶשְׁ/ךָ נָּא֙ מַצְלִ֣יחַ דַּרְכִּ֔/י אֲשֶׁ֥ר אָנֹכִ֖י הֹלֵ֥ךְ עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/042.yaml
  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
translation:
  language: hi
  text: आज मैं जलस्रोत[a] के पास पहुँचा और कहा, ‘हे यहोवा, मेरे स्वामी अब्राहम के परमेश्वर, यदि तू कृपा करके मेरे उस मार्ग[b] को सफल बनाए जिस पर मैं जा रहा हूँ—’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कुएँ के पास।’ इब्रानी शब्द का अधिक विशिष्ट अर्थ सोता या जलस्रोत है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक, ‘मेरा मार्ग’; यहाँ यह सेवक की यात्रा या सौंपे गए कार्य को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבֹא הַיּוֹם
  choice: आज मैं ... पहुँचा
  rationale: वाव-क्रमिक रूप बीती घटना बताता है और הַיּוֹם उसी दिन के आगमन पर बल देता है। स्थान तक आने के लिए ‘पहुँचा’ स्वाभाविक हिन्दी है।
- source_word: הָעָיִן
  choice: जलस्रोत
  rationale: עַיִן यहाँ कुएँ की अपेक्षा अधिक विशिष्ट रूप से प्राकृतिक सोते अथवा पानी के स्रोत को सूचित करता है; ‘जलस्रोत’ इस व्यापक स्रोतार्थ को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम स्पष्ट रूप से आया है; हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ शीर्षक से बदलने के बजाय नाम को बनाए रखता है।
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: मेरे स्वामी अब्राहम के परमेश्वर
  rationale: אֲדֹנִי यहाँ सेवक के मानवीय स्वामी अब्राहम को दर्शाता है; ‘स्वामी’ उस संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: אִם יֶשְׁךָ נָּא מַצְלִיחַ
  choice: यदि तू सचमुच ... सफल कर रहा है
  rationale: यह रचना शर्तसूचक और कुछ हद तक अपूर्ण प्रार्थनात्मक वाक्य है। נָא की विनय/आग्रह की छाया को ‘सचमुच’ से संदर्भानुकूल ढंग से व्यक्त किया गया है, जबकि कृदंत वर्तमान दैवी क्रिया को बनाए रखता है।
- source_word: דַּרְכִּי
  choice: मेरे उस मार्ग
  rationale: शाब्दिक possessive ‘मेरे मार्ग’ सुरक्षित रखा गया है; संदर्भ में यह सेवक की यात्रा और दायित्व दोनों को समेट सकता है।
- source_word: אֲשֶׁר אָנֹכִי הֹלֵךְ עָלֶיהָ
  choice: जिस पर मैं जा रहा हूँ
  rationale: मार्ग ‘पर जाने’ की इब्रानी अभिव्यक्ति को निकट और सहज हिन्दी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। आधुनिक हिन्दी बाइबल-पाठकों के लिए ‘यहोवा’ अधिक पहचाना हुआ प्रत्यक्ष लिप्यंतरण है; इसे ‘प्रभु’ जैसे शीर्षक से प्रतिस्थापित नहीं किया गया।
- issue: אִם से आरम्भ प्रार्थना की अपूर्णता
  choice: वाक्य को ‘यदि’ के साथ डैश पर खुला छोड़ा
  alternative: 'इसे पूर्ण निवेदन बनाना: ‘तो कृपा करके...’'
  rationale: मूल पद में शर्तसूचक रचना अगले पद की ओर बढ़ती है। उसे इसी पद में पूरा करने से मूल की वाक्यगत अपूर्णता और तनाव मिट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरपूर्ण किंतु सहज कथात्मक शैली। सेवक परमेश्वर को निकट प्रार्थनात्मक संबोधन में एकवचन ‘तू’ कहता है, जो हिन्दी बाइबलीय भाषा में श्रद्धापूर्ण प्रयोग है। अंतिम डैश अगले पद में जारी रहने वाले वाक्य को दर्शाता है।
