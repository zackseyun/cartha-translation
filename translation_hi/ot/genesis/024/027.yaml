id: GEN.24.27
reference: Genesis 24:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲ֠שֶׁר לֹֽא עָזַ֥ב חַסְדּ֛/וֹ וַ/אֲמִתּ֖/וֹ מֵ/עִ֣ם אֲדֹנִ֑/י אָנֹכִ֗י בַּ/דֶּ֨רֶךְ֙ נָחַ֣/נִי יְהוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/027.yaml
  text: And he said[a], “Blessed be Yahweh, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness from my master. As for me[b], Yahweh has led me on the way to the house of my master’s brothers.”
translation:
  language: hi
  text: और उसने कहा, “मेरे स्वामी अब्राहम के परमेश्वर याहवे धन्य हो, जिसने मेरे स्वामी से अपनी अटल करुणा और विश्वासयोग्यता नहीं हटाई। जहाँ तक मेरी बात है, याहवे ने मार्ग में मेरी अगुवाई करके मुझे मेरे स्वामी के भाइयों के घर पहुँचाया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: यहोवा धन्य है
  rationale: यह आशीर्वचनात्मक स्तुति का सूत्र है। हिंदी में ‘धन्य है’ स्वाभाविक और गरिमापूर्ण है। יְהוָה को प्रचलित हिंदी बाइबलीय रूप ‘यहोवा’ में रखा गया है।
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: मेरे स्वामी अब्राहम का परमेश्वर
  rationale: इब्रानी संबंध-श्रृंखला और सेवक द्वारा अब्राहम के लिए प्रयुक्त सम्मानसूचक संबोधन दोनों सुरक्षित हैं।
- source_word: חַסְדּוֹ וַאֲמִתּוֹ
  choice: अपनी अटल करुणा और अपनी सच्चाई
  rationale: חֶסֶד में स्थायी निष्ठापूर्ण प्रेम/करुणा और אֱמֶת में सत्यता, विश्वसनीयता तथा निष्ठा का भाव है। यह जोड़ी अर्थ की व्यापकता बनाए रखती है।
- source_word: לֹא עָזַב ... מֵעִם אֲדֹנִי
  choice: मेरे स्वामी के प्रति ... नहीं छोड़ी
  rationale: עָזַב के साथ מֵעִם का आशय यह है कि परमेश्वर ने स्वामी से अपनी करुणा और सच्चाई हटा नहीं ली; ‘के प्रति’ हिंदी में संबंध की दिशा स्पष्ट करता है।
- source_word: אָנֹכִי בַּדֶּרֶךְ נָחַנִי יְהוָה
  choice: मैं मार्ग ही में था कि यहोवा मुझे ... ले आया
  rationale: मासोरेटिक उच्चारण-विराम אָנֹכִי को आगे के वाक्य से जोड़ता है। यह हिंदी रचना मार्ग में हुई ईश्वरीय अगुवाई और सफल गंतव्य—दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: בֵּית אֲחֵי אֲדֹנִי
  choice: मेरे स्वामी के भाइयों के घर
  rationale: אֲחֵי का शाब्दिक पुल्लिंग ‘भाइयों’ रखा गया है; प्रसंग में इससे अब्राहम के पुरुष संबंधी अथवा कुल का संकेत मिलता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे ‘प्रभु’ उपाधि से नहीं बदला गया। ‘यहोवा’ आधुनिक हिंदी बाइबलीय पाठकों में स्थापित देवनागरी रूप है, यद्यपि ‘याहवे’ ध्वन्यात्मक पुनर्निर्माण के अधिक निकट माना जाता है।
- issue: חֶסֶד וֶאֱמֶת की अर्थ-जोड़ी
  choice: अटल करुणा और सच्चाई
  alternative: करुणामय निष्ठा और विश्वसनीयता
  rationale: चुना हुआ पाठ सामान्य हिंदी में पठनीय रहते हुए स्थिर प्रेम और सत्यनिष्ठ विश्वसनीयता का धार्मिक तनाव बनाए रखता है; इसे केवल तकनीकी ‘वाचा-निष्ठा’ तक सीमित नहीं किया गया।
- issue: אָנֹכִי का वाक्य-संबंध
  choice: मैं मार्ग ही में था कि...
  alternative: जहाँ तक मेरी बात है, यहोवा ने मुझे मार्ग में...
  rationale: इब्रानी पाठ में स्वतंत्र सर्वनाम पर जोर है, पर उसका सटीक वाक्यगत कार्य कुछ खुला है। मासोरेटिक विभाजन के अनुरूप उसे आगे के खंड से जोड़कर स्वाभाविक हिंदी दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण कथात्मक शैली। ‘स्वामी’, ‘धन्य’ और ‘अटल करुणा’ बाइबलीय गंभीरता रखते हैं, पर भाषा साधारण पाठक के लिए स्पष्ट है। कोई पादटिप्पणी नहीं दी गई, इसलिए मुख्य पाठ में पादटिप्पणी-चिह्न भी नहीं हैं।
