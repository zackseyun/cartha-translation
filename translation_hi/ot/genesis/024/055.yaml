  register: आधुनिक मानक हिन्दी का स्वाभाविक और गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘रहने दीजिए’ परिवार की ओर से सेवक से किए गए विनम्र आग्रह को व्यक्त करता है; ‘चली जाए’ अनुमति अथवा प्रस्ताव का भाव बनाए रखता है।
