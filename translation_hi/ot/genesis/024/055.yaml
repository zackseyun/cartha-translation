source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אָחִ֨י/הָ֙ וְ/אִמָּ֔/הּ תֵּשֵׁ֨ב הַ/נַּעֲרָ֥ אִתָּ֛/נוּ יָמִ֖ים א֣וֹ עָשׂ֑וֹר אַחַ֖ר תֵּלֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/055.yaml
  text: But her brother and her mother said[a], “Let the young woman stay with us a few days, or ten; after that she may go.”
translation:
  language: hi
  text: लेकिन उसके भाई और उसकी माँ ने कहा, “युवती को कुछ दिन, या दस दिन, हमारे साथ रहने दीजिए[a]; उसके बाद वह चली जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “दिन, या दस” है। इसका आशय सम्भवतः “कुछ दिन, या दस दिन” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: लेकिन ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, पर पिछले पद में सेवक के शीघ्र प्रस्थान के आग्रह के प्रति यहाँ विरोध भी है; इसलिए आधुनिक हिन्दी में ‘लेकिन’ प्रसंगानुकूल है।
- source_word: אָחִיהָ וְאִמָּהּ
  choice: उसके भाई और उसकी माँ
  rationale: इब्रानी में ‘भाई’ एकवचन है और शब्द-क्रम भी यही है; दोनों को बनाए रखा गया है।
- source_word: תֵּשֵׁב
  choice: रहने दीजिए
  rationale: ישׁב यहाँ प्रस्थान टालकर कुछ समय साथ ठहरने के अर्थ में है। संबोधन सेवक से है, इसलिए विनम्र आग्रह का स्वाभाविक हिन्दी रूप चुना गया है।
- source_word: הַנַּעֲרָ
  choice: युवती
  rationale: נַעֲרָה एक युवा स्त्री को सूचित करता है; ‘युवती’ आधुनिक, संक्षिप्त और गरिमापूर्ण है।
- source_word: אִתָּנוּ
  choice: हमारे साथ
  rationale: साथ अथवा उपस्थिति बताने वाले पूर्वसर्गीय पद का सीधा हिन्दी रूप।
- source_word: יָמִים אוֹ עָשׂוֹר
  choice: कुछ दिन, या दस दिन
  rationale: शाब्दिक रूप ‘दिन, या दस’ है। יָמִים यहाँ अनिश्चित अल्प अवधि का मुहावरेदार संकेत हो सकता है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘कुछ दिन’ और गिनती के साथ ‘दिन’ दोहराया गया है, जबकि मूल की अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
- source_word: אַחַר
  choice: उसके बाद
  rationale: बाद की क्रिया का समय स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: תֵּלֵךְ
  choice: वह चली जाए
  rationale: संदर्भ में कर्ता स्त्रीलिंग युवती है। रूप को साधारण भविष्य के बजाय अनुमति/प्रस्ताव के भाव में रखा गया है।
