source:
  edition: WLC
  text: וַ/יָּ֥רָץ הָ/עֶ֖בֶד לִ/קְרָאתָ֑/הּ וַ/יֹּ֕אמֶר הַגְמִיאִ֥י/נִי נָ֛א מְעַט מַ֖יִם מִ/כַּדֵּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/017.yaml
  text: The servant ran to meet her and said[a], “Please let me drink a little water from your jar.”
translation:
  language: hi
  text: तब सेवक उससे मिलने के लिए दौड़ा और बोला, “कृपया अपने घड़े में से मुझे थोड़ा पानी पिला दीजिए[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने घड़े में से मुझे थोड़ा पानी पीने दीजिए।” इब्रानी आज्ञार्थक क्रिया का भाव ‘मुझे पिलाइए’ या ‘मुझे पीने दीजिए,’ दोनों प्रकार से व्यक्त किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: दौड़ा
  rationale: रוץ का सामान्य कथात्मक अर्थ ‘दौड़ना’ है; यह क्रिया की तत्परता और गति को सीधे व्यक्त करता है।
- source_word: הָעֶבֶד
  choice: सेवक
  rationale: עֶבֶד का अर्थ संदर्भानुसार सेवक या दास हो सकता है। यहाँ अब्राहम के विश्वस्त घरेलू प्रतिनिधि की भूमिका प्रमुख है, इसलिए ‘सेवक’ स्वाभाविक और संदर्भानुकूल है।
- source_word: לִקְרָאתָהּ
  choice: उससे मिलने के लिए
  rationale: यह पदबंध किसी व्यक्ति की ओर जाकर उससे मिलने का भाव व्यक्त करता है; हिंदी में यह अनुवाद उद्देश्यपूर्ण गति को स्पष्ट रखता है।
- source_word: וַיֹּאמֶר
  choice: और बोला
  rationale: यह प्रत्यक्ष कथन का सामान्य कथात्मक परिचय है। वक्ता पुरुष है, इसलिए ‘बोला’ स्वाभाविक है।
- source_word: הַגְמִיאִינִי
  choice: मुझे … पिला दीजिए
  rationale: גמא के हिफ़ील आज्ञार्थक रूप में किसी को पीने देना या पिलाना निहित है। आदरसूचक ‘पिला दीजिए’ आधुनिक हिंदी में विनम्र अनुरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָא
  choice: कृपया
  rationale: נָא अनुरोध को विनम्र बनाता है; ‘कृपया’ इसका सीधा और वर्तमान हिंदी में प्रचलित समतुल्य है।
- source_word: מְעַט מַיִם
  choice: थोड़ा पानी
  rationale: यह माँगी गई पानी की छोटी मात्रा को व्यक्त करता है और अनुरोध की विनम्रता बनाए रखता है।
- source_word: מִכַּדֵּךְ
  choice: अपने घड़े में से
  rationale: כַּד पानी भरने और ढोने का पात्र है, जिसके लिए ‘घड़ा’ स्पष्ट और सांस्कृतिक रूप से स्वाभाविक हिंदी शब्द है। स्त्रीलिंग एकवचन प्रत्यय का भाव ‘अपने’ से सुरक्षित है।
