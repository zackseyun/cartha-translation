  text: וְ/אִם לֹ֨א תֹאבֶ֤ה הָֽ/אִשָּׁה֙ לָ/לֶ֣כֶת אַחֲרֶ֔י/ךָ וְ/נִקִּ֕יתָ מִ/שְּׁבֻעָתִ֖/י זֹ֑את רַ֣ק אֶת בְּנִ֔/י לֹ֥א תָשֵׁ֖ב שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/008.yaml
  text: But if the woman is not willing to go after you[a], then you will be free from this oath of mine[b]; only you must not take my son back there.
translation:
  language: hi
  text: पर यदि वह स्त्री तुम्हारे साथ जाने को तैयार न हो[a], तो तुम मेरी इस शपथ से मुक्त होगे[b]। केवल मेरे पुत्र को वहाँ वापस मत ले जाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे पीछे जाने को”; अर्थ “तुम्हारे साथ जाने को” या “तुम्हारे पीछे-पीछे जाने को” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हें मेरी इस शपथ से छुटकारा मिल जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: पर यदि
  rationale: यह पिछले निर्देश के विपरीत संभावित स्थिति प्रस्तुत करता है; आधुनिक हिन्दी में ‘पर यदि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא תֹאבֶה
  choice: तैयार न हो
  rationale: אבה इच्छा अथवा सहमति का भाव रखता है। ‘तैयार न हो’ स्त्री की स्वैच्छिक सहमति को बनाए रखता है और इसे कठोर अवज्ञा नहीं बनाता।
- source_word: הָאִשָּׁה
  choice: वह स्त्री
  rationale: इस चरण पर वह अभी अज्ञात भावी वधू है; इसलिए ‘स्त्री’ उपयुक्त है, ‘पत्नी’ कहना समयपूर्व होगा। हिन्दी में संदर्भित निश्चितता के लिए ‘वह’ जोड़ा गया है।
- source_word: לָלֶכֶת אַחֲרֶיךָ
  choice: तुम्हारे साथ जाने
  rationale: शाब्दिक अर्थ ‘तुम्हारे पीछे जाने’ है, पर यात्रा के इस प्रसंग में हिन्दी का स्वाभाविक आशय ‘तुम्हारे साथ जाने’ है। शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְנִקִּיתָ
  choice: तुम ... मुक्त होगे
  rationale: निफ़अल रूप यहाँ शपथ के बंधन अथवा दायित्व से छूट जाने का अर्थ देता है; ‘मुक्त होगे’ स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: מִשְּׁבֻעָתִי זֹאת
  choice: मेरी इस शपथ से
  rationale: यह अनुवाद प्रथम पुरुष प्रत्यय और संकेतवाचक זֹאת, दोनों को सुरक्षित रखता है।
- source_word: רַק
  choice: केवल
  rationale: यह सेवक की मुक्ति पर लगे दृढ़ अपवाद या सीमा को व्यक्त करता है।
- source_word: אֶת־בְּנִי לֹא תָשֵׁב שָׁמָּה
  choice: मेरे पुत्र को वहाँ वापस मत ले जाना
  rationale: שוב का हिफ़ईल रूप कारणवाचक है—किसी को लौटाना या वापस ले जाना। ‘मत ले जाना’ निषेध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
