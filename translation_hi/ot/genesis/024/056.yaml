base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/056.yaml
  text: But he said to them[a], “Do not delay me, since Yahweh has made my journey successful. Send me away so that I may go to my master.”
translation:
  language: hi
  text: पर उसने उनसे कहा, “मुझे मत रोको, क्योंकि याहवे ने मेरी यात्रा[a] सफल बनाई है। मुझे विदा कर दो, ताकि मैं अपने स्वामी के पास जाऊँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “मेरा मार्ग” है; यहाँ इससे सेवक की यात्रा या उसे सौंपा गया कार्य अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: पर उसने उनसे कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, जबकि प्रसंग में परिवार द्वारा रुकने के आग्रह के विपरीत उत्तर होने के कारण ‘पर’ स्वाभाविक है।
- source_word: אַל תְּאַחֲרוּ אֹתִי
  choice: मुझे देर न कराओ
  rationale: हिफ़ील रूप और אַל मिलकर निषेध व्यक्त करते हैं; यहाँ अर्थ सेवक के प्रस्थान में विलंब न कराने का है।
- source_word: הִצְלִיחַ דַּרְכִּי
  choice: मेरी यात्रा सफल की है
  rationale: हिफ़ील रूप याहवे द्वारा सफलता दिलाए जाने को व्यक्त करता है। דֶּרֶךְ का मूल अर्थ ‘मार्ग’ है, पर इस यात्रा-वृत्तांत में सेवक की यात्रा अथवा दायित्व अभिप्रेत है।
- source_word: שַׁלְּחוּנִי
  choice: मुझे विदा कर दो
  rationale: पिएल आज्ञार्थक यहाँ जाने की अनुमति देने और औपचारिक रूप से विदा करने का अनुरोध है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: וְאֵלְכָה
  choice: ताकि मैं ... जाऊँ
  rationale: कोहोर्टेटिव रूप वक्ता की इच्छित अगली क्रिया बताता है; ‘ताकि’ उद्देश्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לַאדֹנִי
  choice: अपने स्वामी के पास
  rationale: यहाँ אֲדֹנִי मनुष्य अब्राहम के लिए प्रयुक्त है; ‘स्वामी’ सेवक-स्वामी संबंध को स्पष्ट रखता है और ईश्वरीय उपाधि से भ्रम नहीं होने देता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उस नाम का प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देर न कराओ’ मूल निषेध के निकट है, और ‘विदा कर दो’ हिन्दी में प्रस्थान की अनुमति के अनुरोध को स्वाभाविक रूप से व्यक्त करता है।
