base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/053.yaml
  text: Then the servant brought out articles of silver and articles of gold and garments[a], and gave them to Rebekah; he also gave choice gifts to her brother and to her mother.
translation:
  language: hi
  text: तब सेवक ने चाँदी की वस्तुएँ, सोने की वस्तुएँ और वस्त्र निकालकर रिबका को दिए। उसने रिबका के भाई और उसकी माँ को भी उत्तम भेंटें[a] दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुमूल्य वस्तुएँ”; इब्रानी शब्द विशेष रूप से बढ़िया या मूल्यवान उपहारों को दर्शा सकता है और कुछ संदर्भों में स्वादिष्ट खाद्य पदार्थों के लिए भी प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: निकालकर
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को बाहर निकालना है; यहाँ उपहार सामने निकालने की ठोस क्रिया स्वाभाविक रूप से व्यक्त होती है।
- source_word: הָעֶבֶד
  choice: सेवक
  rationale: עֶבֶד का अर्थ सेवक या दास हो सकता है; इस कथा-संदर्भ में ‘सेवक’ स्वाभाविक है और उसकी भूमिका ठीक से बताता है।
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: चाँदी की वस्तुएँ, सोने की वस्तुएँ
  rationale: כְּלִי व्यापक शब्द है और इसे केवल पात्र मानना आवश्यक नहीं; ‘वस्तुएँ’ मूल्यवान उपहार-सामग्री की व्यापकता बनाए रखता है।
- source_word: וּבְגָדִים
  choice: और वस्त्र
  rationale: בְּגָדִים का सीधा अर्थ पहनने के कपड़े है; ‘वस्त्र’ गरिमापूर्ण कथा-शैली के अनुकूल है।
- source_word: וַיִּתֵּן לְרִבְקָה
  choice: रिबका को दिए
  rationale: हिन्दी में पूर्वोक्त अनेक वस्तुओं के कारण बहुवचन ‘दिए’ स्वाभाविक है और आशय स्पष्ट रखता है।
- source_word: וּמִגְדָּנֹת
  choice: उत्तम भेंटें
  rationale: यह शब्द विशेष, बढ़िया या बहुमूल्य उपहारों को सूचित करता है; ‘उत्तम भेंटें’ गुणवत्ता का भाव रखता है, किंतु अनावश्यक रूप से केवल कीमत या खाद्य पदार्थों का अर्थ नहीं थोपता।
- source_word: לְאָחִיהָ וּלְאִמָּהּ
  choice: उसके भाई और उसकी माँ को
  rationale: दोनों संबंध रिबका से हैं; दोहराया हुआ संबंधसूचक प्रयोग हिन्दी में अर्थ को स्पष्ट और स्वाभाविक बनाता है।
