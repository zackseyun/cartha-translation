  text: וְ/הַֽ/נַּעֲרָ֗ טֹבַ֤ת מַרְאֶה֙ מְאֹ֔ד בְּתוּלָ֕ה וְ/אִ֖ישׁ לֹ֣א יְדָעָ֑/הּ וַ/תֵּ֣רֶד הָ/עַ֔יְנָ/ה וַ/תְּמַלֵּ֥א כַדָּ֖/הּ וַ/תָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/016.yaml
  text: The young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
translation:
  language: hi
  text: वह युवती देखने में बहुत सुंदर थी, कुँवारी थी; किसी पुरुष ने उसके साथ यौन संबंध नहीं बनाए थे[a]। वह सोते[b] तक उतरी, अपना घड़ा भरा और ऊपर आ गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से है, “किसी पुरुष ने उसे नहीं जाना था।” यहाँ ‘जानना’ यौन संबंध के लिए प्रयुक्त व्यंजना है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में प्राकृतिक जलस्रोत या “सोता” है; कुछ अनुवाद यहाँ “कुआँ” लिखते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָ
  choice: युवती
  rationale: यह शब्द विवाह योग्य आयु की युवा स्त्री को सूचित कर सकता है। ‘युवती’ आधुनिक, स्वाभाविक और ‘लड़की’ की अपेक्षा इस प्रसंग के लिए अधिक उपयुक्त है।
- source_word: טֹבַת מַרְאֶה מְאֹד
  choice: देखने में बहुत सुंदर
  rationale: यह अभिव्यक्ति उसके रूप की सुंदरता पर बल देती है; यह हिंदी में स्वाभाविक रहते हुए मूल वाक्यांश का आशय बनाए रखती है।
- source_word: בְּתוּלָה
  choice: कुँवारी
  rationale: कथा के इस संदर्भ में यह शब्द ऐसी स्त्री को सूचित करता है जिसने यौन संबंध नहीं बनाए हैं; ‘कुँवारी’ इसका सीधा और सहज हिंदी रूप है।
- source_word: וְאִישׁ לֹא יְדָעָהּ
  choice: किसी पुरुष ने उसे नहीं जाना था
  rationale: मूल में ‘जानना’ यौन संबंध के लिए प्रयुक्त एक संयत व्यंजना है। शाब्दिक रूप रखने से मूल की साहित्यिक संयमता और अभिव्यक्ति सुरक्षित रहती है; साथ की टिप्पणी अर्थ स्पष्ट करती है।
- source_word: הָעַיְנָה
  choice: सोते तक
  rationale: עַיִן यहाँ प्राकृतिक जलस्रोत को सूचित करता है, न कि आवश्यक रूप से खोदे हुए कुएँ को। ‘सोता’ इसका सटीक और संक्षिप्त हिंदी रूप है।
- source_word: כַדָּהּ
  choice: अपना घड़ा
  rationale: כַּד पानी भरने का पात्र है। ‘घड़ा’ सामान्य पाठक के लिए स्वाभाविक और प्रसंगानुकूल है।
- source_word: וַתָּעַל
  choice: ऊपर आ गई
  rationale: यह पहले ‘नीचे गई’ के स्थानिक विरोध को बनाए रखता है और हिंदी में सहज है।
theological_decisions:
- issue: ‘जानना’ क्रिया का यौन अर्थ
  choice: मुख्य पाठ में मूल व्यंजना ‘उसे नहीं जाना था’ रखी गई और टिप्पणी में अर्थ स्पष्ट किया गया।
  alternative: ‘उसके साथ शारीरिक संबंध नहीं बनाए थे’
  rationale: यह चयन मूल की संयत भाषा और उसका अर्थगत तनाव बनाए रखता है, जबकि पूर्ववर्ती ‘कुँवारी’ और पाद-टिप्पणी आधुनिक पाठक को अभिप्राय समझने में सहायता देते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘युवती’, ‘कुँवारी’, ‘घड़ा’ और ‘सोता’ सामान्य पाठकों के लिए बोधगम्य हैं। मूल इब्रानी की यौन व्यंजना को मुख्य पाठ में सुरक्षित रखते हुए पाद-टिप्पणी से स्पष्ट किया गया है।
