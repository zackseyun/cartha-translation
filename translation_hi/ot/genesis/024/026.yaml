base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/026.yaml
  text: Then the man bowed down and worshiped Yahweh[a][b].
translation:
  language: hi
  text: तब उस पुरुष ने सिर झुकाया और याहवे को दण्डवत किया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के सामने भूमि पर झुक गया।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “उस पुरुष”; प्रसंग में यह अब्राहम का सेवक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: सिर झुकाया
  rationale: קָדַד शरीर या सिर को नीचे झुकाने की क्रिया बताता है। ‘सिर झुकाया’ आधुनिक हिन्दी में स्वाभाविक है और अगले क्रियापद से अलग शारीरिक क्रिया को स्पष्ट रखता है।
- source_word: הָאִישׁ
  choice: उस पुरुष
  rationale: इब्रानी में स्पष्ट रूप से ‘पुरुष’ है। प्रसंग में यह अब्राहम का सेवक है, पर इस पद में आए सामान्य संज्ञा-पद को व्याख्यात्मक रूप से ‘सेवक’ नहीं बनाया गया। हिन्दी में ‘उस पुरुष’ पूर्वोक्त व्यक्ति की ओर स्वाभाविक संकेत करता है।
- source_word: וַיִּשְׁתַּחוּ
  choice: दण्डवत किया
  rationale: यह रूप अपने को झुकाने या भूमि तक दण्डवत करने की श्रद्धापूर्ण क्रिया व्यक्त करता है। परमेश्वर की ओर निर्देशित होने से इसमें आराधना का भाव है; ‘दण्डवत किया’ शारीरिक क्रिया और उपासना—दोनों को खुला रखता है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: לְ संबंध/दिशा को दर्शाता है और יְהוָה परमेश्वर का विशिष्ट नाम है। ‘यहोवा’ हिन्दी में प्रचलित, स्पष्ट लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट ईश्वरीय नाम है। हिन्दी पाठकों के लिए सुस्थापित रूप ‘यहोवा’ नामात्मकता को बनाए रखता है; पादटिप्पणी ‘याहवे’ उच्चारण-विकल्प बताती है।
- issue: וַיִּשְׁתַּחוּ को शारीरिक दण्डवत या आराधना के रूप में प्रस्तुत करना
  choice: दण्डवत किया
  alternative: आराधना की
  rationale: मूल क्रिया शारीरिक रूप से झुकने/दण्डवत होने को व्यक्त करती है और यहोवा के संदर्भ में आराधनापूर्ण है। ‘दण्डवत किया’ दोनों पहलुओं को सुरक्षित रखता है, जबकि ‘आराधना की’ शारीरिक अर्थ को कम स्पष्ट कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप अपनाया गया है। ‘दण्डवत किया’ धार्मिक संदर्भ में परिचित है और मूल की शारीरिक तथा आराधनापूर्ण अर्थ-छटाओं को बनाए रखता है।
