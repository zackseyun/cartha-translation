base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/064.yaml
  text: Rebekah lifted up her eyes and saw Isaac[a], and she got down from the camel.
translation:
  language: hi
  text: रिबका ने आँखें उठाकर इसहाक को देखा और वह ऊँट पर से उतर गई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “वह ऊँट पर से गिर पड़ी।” यहाँ इब्रानी में “गिरना” सम्भवतः ऊँट से उतरने के अर्थ में मुहावरे के रूप में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא ... אֶת־עֵינֶיהָ
  choice: आँखें उठाकर
  rationale: इब्रानी मुहावरे ‘अपनी आँखें उठाईं’ को स्वाभाविक और गरिमापूर्ण हिन्दी में संक्षेपतः बनाए रखता है; केवल ‘ऊपर देखा’ कहने से मूल की कथात्मक अभिव्यक्ति कुछ सपाट हो जाती।
- source_word: וַתֵּרֶא
  choice: देखा
  rationale: यहाँ ראה साधारण दृश्य-बोध व्यक्त करता है; ‘देखा’ सीधा और प्रसंगानुकूल है।
- source_word: יִצְחָק
  choice: इसहाक
  rationale: व्यक्तिनाम का प्रचलित मानक हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: וַתִּפֹּל מֵעַל הַגָּמָל
  choice: वह ऊँट पर से उतर गई
  rationale: נפל का मूल अर्थ ‘गिरना’ है, पर इस प्रसंग में यह सम्भवतः ऊँट से नीचे उतरने के लिए मुहावरे के रूप में प्रयुक्त है। ‘उतर गई’ आधुनिक हिन्दी में सम्भावित आशय स्पष्ट करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, स्वाभाविक और गरिमापूर्ण कथात्मक शैली रखी गई है। ‘आँखें उठाकर’ मूल इब्रानी मुहावरे की छवि बचाता है, और ‘उतर गई’ अनायास दुर्घटना का भ्रामक भाव उत्पन्न किए बिना प्रसंगगत अर्थ देता है।
