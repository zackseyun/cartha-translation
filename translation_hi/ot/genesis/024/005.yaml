source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הָ/עֶ֔בֶד אוּלַי֙ לֹא תֹאבֶ֣ה הָֽ/אִשָּׁ֔ה לָ/לֶ֥כֶת אַחֲרַ֖/י אֶל הָ/אָ֣רֶץ הַ/זֹּ֑את הֶֽ/הָשֵׁ֤ב אָשִׁיב֙ אֶת בִּנְ/ךָ֔ אֶל הָ/אָ֖רֶץ אֲשֶׁר יָצָ֥אתָ מִ/שָּֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/005.yaml
  text: And the servant said to him[a], “Perhaps the woman will not be willing to follow me to this land[b]. Should I then take your son back to the land from which you came?”
translation:
  language: hi
  text: तब सेवक ने उससे कहा, “हो सकता है कि वह स्त्री मेरे पीछे इस देश में आने[a] को तैयार न हो। तो क्या मैं आपके पुत्र को उस देश में वापस ले जाऊँ, जहाँ से आप आए हैं?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे पीछे चलने।”
    reason: lexical_alternative
  - marker: b
    text: “वापस ले जाऊँ” पर इब्रानी में विशेष बल है; इसका अनुवाद “क्या मैं सचमुच आपके पुत्र को वापस ले जाऊँ?” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: सेवक
  rationale: עֶבֶד का अर्थ सेवक या दास हो सकता है। यहाँ अब्राहम के अधीन घराने के प्रतिनिधि के लिए ‘सेवक’ स्वाभाविक है और उसके अधीनस्थ पद को भी बनाए रखता है।
- source_word: אוּלַי
  choice: हो सकता है कि
  rationale: यह संभाव्यता और अनिश्चितता व्यक्त करता है; आधुनिक हिन्दी में यह सहज और स्पष्ट है।
- source_word: לֹא תֹאבֶה
  choice: तैयार न हो
  rationale: אָבָה इच्छा या सहमति को दर्शाता है। ‘तैयार न हो’ भावी स्थिति में स्त्री की इच्छा का स्वाभाविक हिन्दी रूप है।
- source_word: הָאִשָּׁה
  choice: वह स्त्री
  rationale: इब्रानी पाठ केवल ‘स्त्री’ कहता है; भावी पत्नी या युवती जैसा अतिरिक्त विवरण नहीं जोड़ा गया।
- source_word: לָלֶכֶת אַחֲרַי
  choice: मेरे पीछे आने
  rationale: शाब्दिक अर्थ ‘मेरे पीछे चलना’ है। यात्रा के संदर्भ में ‘मेरे पीछे आने’ स्वाभाविक है और मूल बिंब को बचाता है।
- source_word: אֶל הָאָרֶץ הַזֹּאת
  choice: इस देश में
  rationale: אֶרֶץ भूमि या देश हो सकता है। यहाँ एक भौगोलिक गंतव्य के रूप में ‘देश’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: הֶהָשֵׁב אָשִׁיב
  choice: तो क्या मैं ... वापस ले जाऊँ
  rationale: क्रिया के साथ infinitive absolute लौटाने की क्रिया पर बल देता है। प्रश्नवाचक हिन्दी deliberative भाव को रखती है, जबकि बल की जानकारी पादटिप्पणी में दी गई है।
- source_word: אֶת בִּנְךָ
  choice: आपके पुत्र को
  rationale: सीधा अर्थ ‘तुम्हारे पुत्र को’ है; अब्राहम से सम्मानपूर्ण संबोधन के कारण ‘आपके’ उपयुक्त है।
- source_word: אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  choice: उस देश में ... जहाँ से आप आए हैं
  rationale: יָצָא का मूल भाव बाहर निकलना है, पर इस सापेक्ष उपवाक्य में ‘जहाँ से आप आए हैं’ अर्थ को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इसहाक को अब्राहम के मूल देश में ले जाने के प्रश्न का बल
  choice: प्रश्न को ‘तो क्या मैं ... वापस ले जाऊँ?’ रखा गया और मूल का व्याकरणिक बल पादटिप्पणी में बताया गया।
  alternative: ‘क्या मैं सचमुच ... वापस ले जाऊँ?’
  rationale: इससे सेवक का वास्तविक प्रश्न खुला रहता है और मूल के बल को किसी अनिवार्यता या आदेश के रूप में नहीं समझाया जाता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और कथात्मक रखी गई है। ‘आप’ अब्राहम के प्रति सेवक के सम्मान को स्वाभाविक हिन्दी में व्यक्त करता है।
