source:
  edition: WLC
  text: וְ/הָ/אִ֥ישׁ מִשְׁתָּאֵ֖ה לָ֑/הּ מַחֲרִ֕ישׁ לָ/דַ֗עַת הַֽ/הִצְלִ֧יחַ יְהוָ֛ה דַּרְכּ֖/וֹ אִם לֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/021.yaml
  text: The man watched her silently[a], to know whether Yahweh had made his journey successful or not.
translation:
  language: hi
  text: वह पुरुष चुपचाप उसे देखता रहा[a], ताकि जान सके कि याहवे ने उसकी यात्रा को सफल बनाया है या नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह पुरुष मौन रहकर उसे निहारता रहा, ताकि जान सके कि याहवे ने उसकी यात्रा को सफल बनाया है या नहीं।”
    reason: מִשְׁתָּאֵה ध्यान से देखते रहने या निहारने का अर्थ दे सकता है; उसके साथ विस्मय का भाव भी संभव है, पर निश्चित नहीं।
lexical_decisions:
- source_word: הָאִישׁ
  choice: वह पुरुष
  rationale: इब्रानी में सामान्य संज्ञा אִישׁ है। संदर्भ से वह अब्राहम का सेवक है, पर मूल शब्द के अनुरूप उसकी भूमिका जोड़ने के बजाय ‘वह पुरुष’ रखा गया है।
- source_word: מִשְׁתָּאֵה
  choice: देखता रहा
  rationale: हित्पएल कृदंत लगातार ध्यानपूर्वक देखने का भाव देता है और संभवतः विस्मय का संकेत भी रखता है। ‘देखता रहा’ स्वाभाविक हिंदी में जारी क्रिया को व्यक्त करता है, बिना अनिश्चित भावात्मक अर्थ को मुख्य पाठ में निश्चित किए।
- source_word: לָהּ
  choice: उसे
  rationale: पूर्वसर्ग और स्त्रीलिंग प्रत्यय उस स्त्री को पुरुष के ध्यान का लक्ष्य बताते हैं; हिंदी में ‘उसे देखता रहा’ स्वाभाविक है।
- source_word: מַחֲרִישׁ
  choice: चुपचाप
  rationale: חרשׁ का कृदंत मौन रहने का अर्थ देता है। क्रियाविशेषण ‘चुपचाप’ आधुनिक हिंदी में देखने के ढंग को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: לָדַעַת
  choice: ताकि जान सके
  rationale: लामेद सहित infinitive उद्देश्य प्रकट करता है। ‘ताकि जान सके’ इस प्रयोजन को स्वाभाविक हिंदी में स्पष्ट रखता है।
- source_word: הַהִצְלִיחַ
  choice: सफल की है
  rationale: צלח का हिफ़ील रूप कारणवाचक है—सफल बनाना। ‘यात्रा सफल की है’ इस कारणवाचक अर्थ को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी लिपि में उसके प्रचलित विद्वत्तापरक उच्चारण के निकट ‘याहवे’ लिखा गया है।
- source_word: דַּרְכּוֹ
  choice: उसकी यात्रा
  rationale: דֶּרֶךְ का मूल अर्थ ‘मार्ग’ है, पर इस कथा में यह पुरुष की यात्रा अथवा अभियान को दर्शाता है। ‘यात्रा’ संदर्भगत अर्थ को साधारण हिंदी में स्पष्ट करता है।
- source_word: אִם לֹא
  choice: या नहीं
  rationale: अप्रत्यक्ष प्रश्न में यह पदबंध ‘कि...या नहीं’ का अर्थ पूरा करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ नाम को नाम ही बनाए रखता है; ‘प्रभु’ उसे उपाधि से बदल देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक रूप है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वह पुरुष’ मूल की सामान्य संज्ञा को सुरक्षित रखता है; ‘चुपचाप’ और ‘देखता रहा’ जारी दोनों कृदंतों को स्वाभाविक हिंदी में व्यक्त करते हैं।
