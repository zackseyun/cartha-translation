  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और कथात्मक है। ‘भोजन परोसा गया’ में अनिर्दिष्ट कर्ता नहीं जोड़ा गया। ‘अपनी बात कह लूँ’ को शाब्दिक ‘अपने शब्द बोल लूँ’ पर वरीयता दी गई, क्योंकि यह वर्तमान हिन्दी में अधिक स्वाभाविक है और मूल आशय को सुरक्षित रखता है।
