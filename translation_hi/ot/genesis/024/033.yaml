base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/033.yaml
  text: Food was set before him to eat[a], but he said, “I will not eat until I have spoken my words.” And he said, “Speak.”
translation:
  language: hi
  text: तब उसके सामने खाने के लिए भोजन परोसा गया, पर उसने कहा, “जब तक मैं अपनी बात न कह लूँ, तब तक नहीं खाऊँगा।” उसने कहा, “कहो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּשַׂם
  choice: परोसा गया
  rationale: मसोरेटिक पाठ का रूप पु‘अल निष्क्रिय अर्थ देता है—भोजन उसके सामने रखा या परोसा गया। भोजन के प्रसंग में ‘परोसा गया’ स्वाभाविक आधुनिक हिन्दी है और अनिर्दिष्ट कर्ता नहीं जोड़ता।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह पदबंध शाब्दिक रूप से उसकी उपस्थिति या मुख के सामने होने को बताता है; ‘उसके सामने’ इसका सहज हिन्दी समतुल्य है।
- source_word: לֶאֱכֹל
  choice: खाने के लिए
  rationale: לְ के साथ infinitive construct यहाँ प्रयोजन व्यक्त करता है।
- source_word: לֹא אֹכַל
  choice: नहीं खाऊँगा
  rationale: प्रत्यक्ष कथन में imperfect दृढ़ भावी निश्चय व्यक्त करता है; हिन्दी का सामान्य भविष्यकाल वही दृढ़ता रखता है।
- source_word: עַד אִם
  choice: जब तक … न …, तब तक
  rationale: यह संरचना उस सीमा को व्यक्त करती है जिसके पूरा होने से पहले वह नहीं खाएगा। हिन्दी की ‘जब तक…न…, तब तक…’ रचना अर्थ को स्पष्ट और स्वाभाविक ढंग से रखती है।
- source_word: דִּבַּרְתִּי דְּבָרָי
  choice: मैं अपनी बात न कह लूँ
  rationale: शाब्दिक ‘मैं अपने शब्द बोल चुका होऊँ’ हिन्दी में अस्वाभाविक है। ‘अपनी बात कह लूँ’ संदेश या प्रयोजन का अर्थ सुरक्षित रखते हुए पूर्णता का भाव भी व्यक्त करता है।
- source_word: דַּבֵּר
  choice: कहो
  rationale: דבר का एकवचन पुल्लिंग imperative है। इस संवाद में हिन्दी ‘कहो’ संक्षिप्त, स्वाभाविक और अधिकार देने वाला प्रत्युत्तर है।
