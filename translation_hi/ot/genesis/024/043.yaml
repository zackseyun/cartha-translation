source:
  edition: WLC
  text: הִנֵּ֛ה אָנֹכִ֥י נִצָּ֖ב עַל עֵ֣ין הַ/מָּ֑יִם וְ/הָיָ֤ה הָֽ/עַלְמָה֙ הַ/יֹּצֵ֣את לִ/שְׁאֹ֔ב וְ/אָמַרְתִּ֣י אֵלֶ֔י/הָ הַשְׁקִֽי/נִי נָ֥א מְעַט מַ֖יִם מִ/כַּדֵּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/043.yaml
  text: Look[a], I am standing by the spring of water, and let it be that the young woman who comes out to draw, to whom I say[b], ‘Please let me drink a little water from your jar,’
translation:
  language: hi
  text: “देख, मैं पानी के सोते के पास खड़ा हूँ। ऐसा हो कि जो युवती[a] पानी भरने बाहर आए और जिससे मैं कहूँ, ‘कृपया अपने घड़े में से मुझे थोड़ा पानी पिला दे,’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विवाह योग्य युवती”; इब्रानी शब्द עַלְמָה अपने आप में स्पष्ट रूप से “कुमारी” नहीं कहता।
    reason: lexical_alternative
  - marker: b
    text: या “कृपया अपने घड़े में से मुझे थोड़ा पानी पीने दे।”
    reason: alternative_rendering
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह संकेतवाचक अव्यय दृश्य को सजीव और तात्कालिक ढंग से सामने रखता है; ‘देख’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: נִצָּב
  choice: खड़ा हूँ
  rationale: कृदन्त वर्तमान में जारी अवस्था व्यक्त करता है; ‘खड़ा हूँ’ उसका सहज हिन्दी रूप है।
- source_word: עַל עֵין הַמָּיִם
  choice: पानी के सोते के पास
  rationale: עֵין यहाँ कुएँ के बजाय प्राकृतिक जल-स्रोत या सोते को दर्शाता है।
- source_word: וְהָיָה
  choice: ऐसा हो कि
  rationale: प्रार्थना-सदृश प्रसंग में यह इच्छित चिह्न या परिस्थिति का परिचय देता है।
- source_word: הָעַלְמָה
  choice: युवती
  rationale: यह शब्द विवाह योग्य आयु की युवा स्त्री को बताता है, पर अपने आप में उसके कुँवारी होने को स्पष्ट रूप से नहीं कहता।
- source_word: הַיֹּצֵאת לִשְׁאֹב
  choice: पानी भरने बाहर आए
  rationale: भावी स्त्री के बाहर आकर पानी निकालने का स्वाभाविक हिन्दी वर्णन; संदर्भ स्पष्ट करने के लिए ‘पानी’ व्यक्त किया गया है।
- source_word: וְאָמַרְתִּי אֵלֶיהָ
  choice: और जिससे मैं कहूँ
  rationale: सम्बन्धवाचक हिन्दी संरचना घटनाक्रम और आशय दोनों को सहज रूप से सुरक्षित रखती है।
- source_word: הַשְׁקִינִי
  choice: मुझे ... पानी पिला दे
  rationale: שקה का हिफ़ील रूप किसी को पानी पिलाने या पेय देने का कारणवाचक भाव रखता है; ‘पिला दे’ हिन्दी में संक्षिप्त और सटीक है।
- source_word: נָא
  choice: कृपया
  rationale: विनम्र अनुरोध सूचित करने वाले अव्यय का आधुनिक हिन्दी समतुल्य।
- source_word: מְעַט מַיִם מִכַּדֵּךְ
  choice: अपने घड़े में से मुझे थोड़ा पानी
  rationale: मात्रा और स्रोत दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: עַלְמָה का अनुवाद
  choice: युवती
  alternative: कुमारी; विवाह योग्य युवती
  rationale: इब्रानी शब्द युवा, विवाह योग्य स्त्री को सूचित करता है, लेकिन अकेले इसी शब्द से कुँवारापन अनिवार्य रूप से सिद्ध नहीं होता। इसलिए मुख्य पाठ में अधिक तटस्थ और शब्दार्थ-संगत रूप रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद अगले वाक्यांश में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है। फुटनोट [a] को अर्थानुसार ‘युवती’ के साथ लगाया गया है।
