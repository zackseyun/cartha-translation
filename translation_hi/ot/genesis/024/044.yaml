base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/044.yaml
  text: and says to me[a], ‘You also drink, and I will draw water for your camels as well’—let her be the woman whom Yahweh has appointed for my master’s son.
translation:
  language: hi
  text: और जो मुझसे कहे, ‘आप भी पी लीजिए, और मैं आपके ऊँटों के लिए भी पानी भर दूँगी,’ वही स्त्री है जिसे याहवे ने मेरे स्वामी के पुत्र के लिए ठहराया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे याहवे ने मेरे स्वामी के पुत्र के लिए निश्चित किया है” अथवा “निर्दिष्ट किया है।”
    reason: הֹכִיחַ के अर्थ-क्षेत्र में ‘ठहराना’, ‘निश्चित करना’ और ‘निर्दिष्ट करना’ सम्मिलित हैं।
lexical_decisions:
- source_word: וְאָמְרָה
  choice: और जो मुझसे कहे
  rationale: यह स्त्रीलिंग एकवचन क्रिया सेवक द्वारा बताए जा रहे संकेत की शर्त का भाग है। हिंदी में ‘जो ... कहे’ इस संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גַּם אַתָּה שְׁתֵה
  choice: तू भी पी
  rationale: गַּם और स्वतंत्र सर्वनाम का बल ‘भी’ से सुरक्षित रहता है, जबकि ‘पी’ आज्ञार्थक भाव व्यक्त करता है।
- source_word: וְגַם לִגְמַלֶּיךָ אֶשְׁאָב
  choice: और मैं तेरे ऊँटों के लिए भी पानी भर दूँगी
  rationale: שׁאב का अर्थ कुएँ से पानी निकालना/भरना है। संदर्भ के अनुसार ‘पानी’ स्पष्ट करना स्वाभाविक है और स्त्रीलिंग ‘दूँगी’ वक्ता के लिंग को दर्शाता है।
- source_word: הִוא הָאִשָּׁה
  choice: वही वह स्त्री हो
  rationale: शाब्दिक पहचान-वाक्य ‘वही वह स्त्री’ रखा गया है; व्यापक प्रार्थना-संदर्भ में ‘हो’ इच्छार्थक बल को व्यक्त करता है।
- source_word: אֲשֶׁר הֹכִיחַ
  choice: जिसे ... ठहराया है
  rationale: यहाँ יכח के हिफ़ील रूप का आशय चुनना, निर्धारित करना या नियुक्त करना है। ‘ठहराया है’ दैवी चयन को स्वाभाविक हिंदी में व्यक्त करता है, पर वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: לְבֶן אֲדֹנִי
  choice: मेरे स्वामी के पुत्र के लिए
  rationale: לְ का संबंध/उद्देश्यगत अर्थ ‘के लिए’ से और संबंधवाचक संरचना स्वाभाविक हिंदी में सुरक्षित रहती है।
theological_decisions:
- issue: הִוא הָאִשָּׁה का विधानात्मक या इच्छार्थक बल
  choice: वही वह स्त्री हो
  alternative: वही वह स्त्री है
  rationale: व्याकरणतः यह सर्वनामिक पहचान-वाक्य है, किंतु सेवक की प्रार्थना और संकेत के संदर्भ में हिंदी का इच्छार्थक ‘हो’ अभिप्रेत निवेदन को बेहतर दर्शाता है; इसे दैवी आदेश का अतिरिक्त दावा नहीं बनाया गया।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है; ‘याहवे’ उसका निकट हिंदी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
