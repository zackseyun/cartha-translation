  register: आधुनिक, गरिमापूर्ण और सहज हिंदी अपनाई गई है। प्राचीन सामाजिक संबंध को बनाए रखने के लिए ‘स्वामी’ तथा प्रत्यक्ष एकवचन संबोधन के लिए ‘तू/तेरे’ रखा गया है।
