base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/050.yaml
  text: Then Laban and Bethuel answered and said[a], “The matter has come from Yahweh[b]; we cannot speak to you bad or good.”
translation:
  language: hi
  text: तब लाबान और बतूएल ने उत्तर में कहा, “यह बात याहवे की ओर से आई है; हम तुमसे न बुरा कह सकते हैं, न भला।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “न बुरा कह सकते हैं, न भला” इब्रानी की एक ध्रुवीय अभिव्यक्ति है। संदर्भ में इसका भाव है कि वे याहवे से आई इस बात का न विरोध कर सकते थे, न उसमें फेरबदल।
    reason: मुख्य पाठ की मुहावरेदार अभिव्यक्ति और उसकी अस्पष्टता बनाए रखते हुए संदर्भगत आशय स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: ने उत्तर दिया
  rationale: दोनों क्रियाएँ मिलकर इब्रानी संवाद में उत्तर आरम्भ करने का सूत्र बनाती हैं। हिन्दी में ‘ने उत्तर दिया’ स्वाभाविक रूप से वही कार्य करता है और अनावश्यक दोहराव से बचता है।
- source_word: מֵיְהוָה
  choice: याहवे की ओर से
  rationale: מִן स्रोत या उद्गम बताता है; ‘की ओर से’ इस बात को स्वाभाविक हिन्दी में व्यक्त करता है। परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ लिखा गया है।
- source_word: יָצָא הַדָּבָר
  choice: यह बात ... हुई है
  rationale: यहाँ דָּבָר विवाह-प्रस्ताव से जुड़ी परिस्थिति या विषय को दर्शाता है। יָצָא के साथ इसका अर्थ है कि बात का उद्गम याहवे से है; ‘हुई है’ हिन्दी में इस मुहावरे का स्वाभाविक रूप है।
- source_word: לֹא נוּכַל דַּבֵּר אֵלֶיךָ
  choice: हम तुमसे ... नहीं कह सकते
  rationale: יכל असमर्थता व्यक्त करता है और דבר אל किसी से कुछ कहने की दिशा बताता है। हिन्दी वाक्य में विभाजित निषेध ‘न ... न ...’ अधिक स्वाभाविक है।
- source_word: רַע אוֹ טוֹב
  choice: न बुरा ... न भला
  rationale: इब्रानी के क्रम ‘बुरा या भला’ और उसकी ध्रुवीय अभिव्यक्ति को बनाए रखा गया है। मुख्य पाठ इसे खुलकर ‘विरोध नहीं कर सकते’ नहीं बनाता, ताकि स्रोत की मुहावरेदार अस्पष्टता बनी रहे।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: ‘बुरा या भला’ मुहावरे का आशय
  choice: मुख्य पाठ में ध्रुवीय जोड़ी को बनाए रखना
  alternative: हम इसका न विरोध कर सकते हैं, न इसे बदल सकते हैं
  rationale: संदर्भ में कथन याहवे से आई बात का विरोध या उसमें फेरबदल न कर पाने का संकेत देता है, पर मूल शब्दशः ‘बुरा या भला’ कहता है। इसलिए व्याख्या पादटिप्पणी में दी गई है, मुख्य पाठ में नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भला’ ने ‘बुरा’ के साथ स्वाभाविक हिन्दी ध्रुवीय जोड़ी बनाई है; वाक्य की प्राचीन कथात्मक गरिमा भी बनी रहती है।
