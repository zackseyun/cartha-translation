lexical_decisions:
- source_word: וַיֹּאמַר
  choice: तब उसने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ प्रसंग के स्वाभाविक क्रम को व्यक्त करता है, बिना संबंध को अधिक विशिष्ट बनाए।
- source_word: עֶבֶד
  choice: सेवक
  rationale: עֶבֶד का अर्थ ‘सेवक’ या ‘दास’ हो सकता है। यहाँ वक्ता अब्राहम के घराने में अपनी भूमिका बताते हुए आदरपूर्ण परिचय दे रहा है, इसलिए मुख्य पाठ में ‘सेवक’ स्वाभाविक है; ‘दास’ को पादटिप्पणी में रखा गया है।
- source_word: אַבְרָהָם
  choice: अब्राहम
  rationale: व्यक्तिनाम को हिन्दी बाइबलीय परंपरा के प्रचलित रूप में लिप्यंतरित किया गया है।
- source_word: אָנֹכִי
  choice: मैं ... हूँ
  rationale: स्वतंत्र सर्वनाम स्पष्ट आत्म-परिचय देता है। हिन्दी में विधेय-संज्ञा के साथ ‘मैं ... हूँ’ स्वाभाविक और अर्थनिष्ठ रूप है।
