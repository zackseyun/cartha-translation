base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/046.yaml
  text: She quickly lowered her jar from her shoulder and said[a], ‘Drink, and I will also give water to your camels.’ So I drank, and she also gave water to the camels.
translation:
  language: hi
  text: उसने फुर्ती से अपना घड़ा अपने ऊपर से उतार लिया[a] और कहा, “पीजिए, और मैं आपके ऊँटों को भी पानी पिलाऊँगी।” तब मैंने पिया, और उसने ऊँटों को भी पानी पिलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “अपने ऊपर से।” व्यापक प्रसंग से जान पड़ता है कि घड़ा उसके कंधे पर था, पर इस पद में शरीर का अंग स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: फुर्ती से
  rationale: क्रिया מהר शीघ्रता से काम करने का भाव व्यक्त करती है। इसे क्रिया-विशेषण के रूप में रखना स्वाभाविक हिन्दी में रिबका की तत्परता को बनाए रखता है।
- source_word: וַתּוֹרֶד כַּדָּהּ
  choice: अपना घड़ा ... नीचे उतारा
  rationale: हिफ़ील रूप किसी वस्तु को नीचे लाने का अर्थ देता है; ‘नीचे उतारा’ घड़े की गति को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है। כַּד पानी भरने का घड़ा है, पर ‘पानी का’ जोड़ना संदर्भ में आवश्यक नहीं।
- source_word: מֵעָלֶיהָ
  choice: अपने ऊपर से
  rationale: हिब्रू में शरीर का कोई अंग स्पष्ट नहीं है, इसलिए मुख्य पाठ में ‘कंधे’ जोड़ने के बजाय मूल की स्थानगत अनिश्चितता बनाए रखी गई है।
- source_word: שְׁתֵה
  choice: पीजिए
  rationale: यह सीधी आज्ञा है। हिन्दी में अजनबी वयस्क पुरुष से सम्मानपूर्वक कही गई बात के लिए ‘पीजिए’ स्वाभाविक है; पानी संदर्भ से स्पष्ट है।
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: और मैं आपके ऊँटों को भी पानी पिलाऊँगी
  rationale: שקה के हिफ़ील का अर्थ किसी को पीने के लिए पानी देना है। ‘पानी पिलाऊँगी’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: וָאֵשְׁתְּ
  choice: तब मैंने पिया
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; ‘तब’ उसके निमंत्रण के बाद हुई प्रतिक्रिया को स्वाभाविक रूप से दिखाता है।
- source_word: וְגַם הַגְּמַלִּים הִשְׁקָתָה
  choice: और उसने ऊँटों को भी पानी पिलाया
  rationale: पहले कथन के समान शब्दावली रखकर שקה का कारणवाचक अर्थ और ‘भी’ का बल सुरक्षित रखा गया है।
