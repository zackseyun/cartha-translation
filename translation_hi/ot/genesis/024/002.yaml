base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/002.yaml
  text: And Abraham said to his servant[a], the oldest of his household, who ruled over all that belonged to him[b], “Please put your hand under my thigh.”
translation:
  language: hi
  text: तब अब्राहम ने अपने दास से—जो उसके घराने में सबसे वरिष्ठ था और जो कुछ उसका था उस सब पर अधिकार रखता था—कहा, “कृपया अपना हाथ मेरी जाँघ के नीचे रखो।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: जाँघ के नीचे हाथ रखना प्राचीन समय में शपथ लेने की एक रीति थी, जो संभवतः किसी गंभीर प्रतिज्ञा की प्रतिबद्धता को दर्शाती थी।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथानक को स्वाभाविक आधुनिक हिन्दी में आगे बढ़ाता है; इसे अत्यधिक स्पष्ट कारणात्मक अर्थ नहीं देता।
- source_word: עַבְדּוֹ
  choice: अपने दास से
  rationale: עֶבֶד दास अथवा सेवक दोनों अर्थ दे सकता है। यहाँ घरेलू अधिकारी की विश्वस्त भूमिका स्पष्ट है, फिर भी मूल शब्द की सामाजिक स्थिति को मिटाने से बचने के लिए ‘दास’ रखा गया है।
- source_word: זְקַן בֵּיתוֹ
  choice: जो उसके घराने में सबसे वरिष्ठ
  rationale: यह पद आयु और वरिष्ठता दोनों का संकेत दे सकता है। ‘सबसे वरिष्ठ’ प्रसंग में उसकी घराने के भीतर की स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמֹּשֵׁל בְּכָל אֲשֶׁר־לוֹ
  choice: उसकी सारी संपत्ति का प्रबंधक था
  rationale: מֹשֵׁל का मूल भाव अधिकारपूर्वक देखरेख या शासन करना है। घरेलू संदर्भ में ‘प्रबंधक’ स्वाभाविक है और ‘जो कुछ उसका था’ को ‘सारी संपत्ति’ से संक्षेप में व्यक्त करता है।
- source_word: שִׂים נָא
  choice: कृपया ... रखो
  rationale: आज्ञार्थक क्रिया के साथ נָא विनम्र या आग्रहपूर्ण निवेदन दर्शाता है।
- source_word: יָדְךָ
  choice: अपना हाथ
  rationale: हिन्दी में कर्ता-सापेक्ष स्वामित्व के लिए ‘अपना’ अधिक स्वाभाविक है और अर्थतः ‘तुम्हारा हाथ’ के समान है।
- source_word: תַּחַת יְרֵכִי
  choice: मेरी जाँघ के नीचे
  rationale: सांस्कृतिक रूप से विशिष्ट शपथ-भंगिमा को बिना व्याख्यात्मक विस्तार के शाब्दिक रूप में सुरक्षित रखता है।
