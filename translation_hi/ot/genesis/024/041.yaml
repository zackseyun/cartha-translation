  edition: WLC
  text: אָ֤ז תִּנָּקֶה֙ מֵ/אָ֣לָתִ֔/י כִּ֥י תָב֖וֹא אֶל מִשְׁפַּחְתִּ֑/י וְ/אִם לֹ֤א יִתְּנוּ֙ לָ֔/ךְ וְ/הָיִ֥יתָ נָקִ֖י מֵ/אָלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/041.yaml
  text: Then you will be free from my oath when you come to my family; and if they do not give to you[a], you will be free from my oath.
translation:
  language: hi
  text: जब तुम मेरे कुल के यहाँ पहुँचोगे, तब तुम मेरी शपथ[a] से मुक्त हो जाओगे; और यदि वे उसे तुम्हें न दें, तो तुम मेरी शपथ से मुक्त हो जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे शाप से”; इब्रानी शब्द ऐसी शपथ का भी संकेत कर सकता है जिसके साथ शाप या दंड निहित हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנָּקֶה / נָקִי
  choice: मुक्त हो जाओगे
  rationale: दोनों समानार्थी रूप इस प्रसंग में नैतिक निर्दोषता नहीं, बल्कि शपथ से उत्पन्न दायित्व से छूट को व्यक्त करते हैं; समान अनुवाद उनकी समानांतरता बनाए रखता है।
- source_word: מֵאָלָתִי
  choice: मेरी शपथ से
  rationale: אָלָה शाप-संलग्न शपथ को सूचित कर सकता है, पर यहाँ मुख्य आशय सेवक पर रखे गए शपथगत दायित्व से है।
- source_word: כִּי
  choice: जब
  rationale: यहाँ यह उस परिस्थिति को प्रस्तुत करता है जिसमें सेवक दायित्व से मुक्त होगा; ‘जब’ प्रसंग के कालगत-शर्तीय भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשְׁפַּחְתִּי
  choice: मेरे कुल
  rationale: מִשְׁפָּחָה विस्तृत परिवार या कुल को दर्शाता है; ‘कुल’ निकट परिवार से अधिक व्यापक सामाजिक इकाई का बोध कराता है।
- source_word: וְאִם לֹא יִתְּנוּ לָךְ
  choice: और यदि वे तुम्हें न दें
  rationale: इब्रानी में कर्म व्यक्त नहीं है। हिन्दी में भी इसे अनकहा रखकर स्रोत की संक्षिप्तता और वास्तविक अस्पष्टता सुरक्षित रहती है; संदर्भ से अपेक्षित वधू समझी जा सकती है।
theological_decisions:
- issue: शपथ के प्रसंग में אָלָה का अनुवाद
  choice: शपथ
  alternative: शाप
  rationale: शब्द में शपथ से जुड़ा शाप या दंड निहित हो सकता है, किंतु कथा का केंद्र सेवक को सौंपे गए शपथगत दायित्व से उसकी मुक्ति है। पादटिप्पणी वैकल्पिक अर्थ-संकेत को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘कुल’ विस्तृत पारिवारिक समूह को व्यक्त करता है। दूसरे खंड में निहित कर्म को स्पष्ट रूप से नहीं जोड़ा गया, ताकि इब्रानी की संरचना और अस्पष्टता बनी रहे। पादटिप्पणी-चिह्न पूरे पद से जुड़े शब्दार्थ-विकल्प को संकेत करता है।
