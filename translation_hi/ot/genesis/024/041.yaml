- from: तब जब तुम मेरे कुल के पास पहुँचोगे, तो मेरी शपथ से मुक्त हो जाओगे; और यदि वे तुम्हें न दें, तो भी तुम मेरी शपथ से मुक्त हो जाओगे।[a]
  to: जब तुम मेरे कुल के यहाँ पहुँचोगे, तब तुम मेरी शपथ[a] से मुक्त हो जाओगे; और यदि वे उसे तुम्हें न दें, तो तुम मेरी शपथ से मुक्त हो जाओगे।
  rationale: The revision preserves the Hebrew’s release-from-oath parallelism and its family/clan reference, while making the Hindi idiomatic. The implicit object in the second conditional is supplied from the immediate narrative context because Hindi grammar otherwise leaves the clause incomplete. No theological meaning is added. The footnote remains limited to the lexical curse/sanction nuance of אָלָה and is anchored directly to its first rendering.
