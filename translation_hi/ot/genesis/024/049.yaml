reference: Genesis 24:49
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ֠/עַתָּה אִם יֶשְׁ/כֶ֨ם עֹשִׂ֜ים חֶ֧סֶד וֶֽ/אֱמֶ֛ת אֶת אֲדֹנִ֖/י הַגִּ֣ידוּ לִ֑/י וְ/אִם לֹ֕א הַגִּ֣ידוּ לִ֔/י וְ/אֶפְנֶ֥ה עַל יָמִ֖ין א֥וֹ עַל שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/049.yaml
  text: Now if you are going to show kindness and faithfulness to my master[a], tell me; but if not, tell me, so that I may turn to the right or to the left.
translation:
  language: hi
  text: अब यदि आप लोग मेरे स्वामी के प्रति कृपा और निष्ठा दिखाने को तैयार हैं[a], तो मुझे बताइए; और यदि नहीं, तो भी मुझे बताइए, ताकि मैं दाहिनी ओर या बाईं ओर मुड़ जाऊँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अटल प्रेम और निष्ठा।’ इब्रानी का यह शब्द-युग्म प्रायः संबंध या वाचा में दिखाई जाने वाली स्थिर, भरोसेमंद कृपा का भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह सेवक की बात से निकलने वाले तात्कालिक व्यावहारिक निष्कर्ष का परिचय देता है; आधुनिक हिन्दी में ‘अब’ स्वाभाविक है।
- source_word: אִם יֶשְׁכֶם עֹשִׂים
  choice: यदि आप लोग…दिखाने को तैयार हैं
  rationale: ‘तुममें होना’ और कृदन्त से बनी इब्रानी अभिव्यक्ति यहाँ भावी कार्य के लिए परिवार की इच्छा या तत्परता पूछती है। ‘तैयार हैं’ इस भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: חֶסֶד וֶאֱמֶת
  choice: कृपा और निष्ठा
  rationale: यह शब्द-युग्म संबंध में प्रेमपूर्ण भलाई और भरोसेमंद वफादारी को दर्शाता है। ‘कृपा और निष्ठा’ दोनों पहलुओं को स्पष्ट रखते हुए अनावश्यक रूप से तकनीकी वाचा-संबंधी भाषा नहीं जोड़ता।
- source_word: אֶת אֲדֹנִי
  choice: मेरे स्वामी के प्रति
  rationale: यहाँ कृपा और निष्ठा का लक्ष्य अब्राहम है; ‘के प्रति’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַגִּידוּ לִי
  choice: मुझे बताइए
  rationale: आज्ञार्थक क्रिया सीधे उत्तर की माँग करती है। आदरसूचक बहुवचन रूप प्रसंग और हिन्दी संवाद-शैली के अनुकूल है।
- source_word: וְאִם לֹא
  choice: और यदि नहीं
  rationale: यह दूसरे विकल्प को प्रस्तुत करता है और इब्रानी संयोजक को भी बनाए रखता है। अगले खंड में ‘तो भी’ जोड़ने से हिन्दी में यह स्पष्ट होता है कि नकारात्मक उत्तर भी बताया जाए।
- source_word: וְאֶפְנֶה
  choice: ताकि मैं…मुड़ जाऊँ
  rationale: कोहोर्टेटिव रूप सेवक की परिणामी मंशा व्यक्त करता है; ‘ताकि’ उद्देश्य/परिणाम और ‘मुड़ जाऊँ’ उसके अगले कदम का भाव बनाए रखते हैं।
- source_word: עַל יָמִין אוֹ עַל שְׂמֹאל
  choice: दाहिनी ओर या बाईं ओर
  rationale: मूल दिशात्मक बिंब दूसरे मार्ग या विकल्प की ओर जाने का संकेत देता है और हिन्दी में भी सहज समझ आता है, इसलिए उसे अक्षुण्ण रखा गया है।
