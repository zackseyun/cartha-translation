source:
  edition: WLC
  text: וְ/אַשְׁבִּ֣יעֲ/ךָ֔ בַּֽ/יהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וֵֽ/אלֹהֵ֖י הָ/אָ֑רֶץ אֲשֶׁ֨ר לֹֽא תִקַּ֤ח אִשָּׁה֙ לִ/בְנִ֔/י מִ/בְּנוֹת֙ הַֽ/כְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יוֹשֵׁ֥ב בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/003.yaml
  text: and I will make you swear by Yahweh[a], the God of heaven and the God of the earth, that you shall not take a wife for my son from the daughters of the Canaanites, among whom I dwell.
translation:
  language: hi
  text: और मैं तुझे यहोवा, स्वर्ग के परमेश्वर और पृथ्वी के परमेश्वर, की शपथ दिलाऊँगा कि तू मेरे बेटे के लिए कनानियों की बेटियों में से, जिनके बीच मैं रहता हूँ, कोई पत्नी न लेना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַשְׁבִּיעֲךָ
  choice: और मैं तुझे ... शपथ दिलाऊँगा
  rationale: हिफ़ील रूप का कारक अर्थ है—किसी से शपथ करवाना। ‘शपथ दिलाऊँगा’ इसे स्वाभाविक और स्पष्ट हिन्दी में रखता है।
- source_word: בַּיהוָה
  choice: यहोवा की शपथ
  rationale: בְּ शपथ के आधार/साक्षी को चिह्नित करता है। हिन्दी में ‘यहोवा की शपथ’ स्वाभाविक मुहावरा है और יְהוָה को उसके व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
- source_word: אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ
  choice: स्वर्ग के परमेश्वर और पृथ्वी के परमेश्वर
  rationale: इब्रानी में ‘परमेश्वर’ दोनों रचनाओं में दोहराया गया है; अनुवाद उस बलाघात को बनाए रखता है। स्वर्ग-पृथ्वी का युग्म सार्वभौमिक क्षेत्र दर्शाता है।
- source_word: אֲשֶׁר לֹא תִקַּח
  choice: कि तू ... न लेना
  rationale: यह शपथ की विषय-वस्तु है। हिन्दी का निषेधात्मक आज्ञार्थक ‘न लेना’ गंभीर निर्देश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אִשָּׁה לִבְנִי
  choice: मेरे बेटे के लिए ... कोई पत्नी
  rationale: विवाह के प्रसंग में אִשָּׁה का अर्थ ‘पत्नी’ है; ‘के लिए’ לִ का संबंध सुरक्षित रखता है।
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: कनानियों की बेटियों में से
  rationale: ‘बेटियाँ’ मूल इब्रानी जातिगत मुहावरे को बनाए रखता है, जबकि बहुवचन ‘कनानियों’ से आशय आधुनिक हिन्दी में स्पष्ट होता है।
- source_word: אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּוֹ
  choice: जिनके बीच मैं रहता हूँ
  rationale: יוֹשֵׁב और בְּקִרְבּוֹ का आशय किसी समुदाय के बीच निवास करना है। ‘रहता हूँ’ वर्तमान जारी निवास को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ हिन्दी बाइबल-पाठकों में व्यापक रूप से पहचाना जाने वाला नाम-रूप है और इसे सामान्य उपाधि ‘प्रभु’ में नहीं बदलता; उच्चारण की ऐतिहासिक अनिश्चितता को निर्णय में स्वीकार किया गया है।
- issue: स्वर्ग और पृथ्वी के परमेश्वर की पुनरुक्ति
  choice: स्वर्ग के परमेश्वर और पृथ्वी के परमेश्वर
  alternative: स्वर्ग और पृथ्वी के परमेश्वर
  rationale: मूल में אֱלֹהֵי की पुनरावृत्ति दोनों क्षेत्रों पर बल देती है; इसलिए उसे संक्षिप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली। प्रसंग के प्राचीन पारिवारिक संबोधन के अनुरूप एकवचन ‘तू’ रखा गया है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए ‘यहोवा की शपथ’ को परमेश्वर-वर्णन के बाद रखा गया है।
