source:
  edition: WLC
  text: וַ/תָּ֨קָם רִבְקָ֜ה וְ/נַעֲרֹתֶ֗י/הָ וַ/תִּרְכַּ֨בְנָה֙ עַל הַ/גְּמַלִּ֔ים וַ/תֵּלַ֖כְנָה אַחֲרֵ֣י הָ/אִ֑ישׁ וַ/יִּקַּ֥ח הָ/עֶ֛בֶד אֶת רִבְקָ֖ה וַ/יֵּלַֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/061.yaml
  text: Then Rebekah and her young women arose[a], mounted the camels, and went after the man. And the servant took Rebekah and went on his way.
translation:
  language: hi
  text: तब रिबका और उसकी युवतियाँ[a] उठीं, ऊँटों पर सवार हुईं और उस पुरुष के पीछे चल पड़ीं। सेवक रिबका को साथ लेकर चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी युवा परिचारिकाएँ।” इब्रानी शब्द युवा स्त्रियों को दर्शाता है; इस प्रसंग में संभवतः रिबका के साथ सेवा में रहने वाली युवतियाँ अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: उठीं
  rationale: קום का मूल अर्थ उठना है; बहुवचन स्त्रीलिंग कर्ताओं के साथ हिन्दी में ‘उठीं’ स्वाभाविक है और आगे की यात्रा को पहले ही इसमें नहीं मिलाता।
- source_word: נַעֲרֹתֶיהָ
  choice: उसकी युवतियाँ
  rationale: נַעֲרָה का मूल संकेत युवा स्त्रियों की ओर है। प्रसंग में वे रिबका की परिचारिकाएँ प्रतीत होती हैं, पर दास्य-स्थिति को स्पष्ट कहना मूल शब्द से अधिक निर्णायक होगा; इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: וַתִּרְכַּבְנָה עַל הַגְּמַלִּים
  choice: ऊँटों पर सवार हुईं
  rationale: רכב על यहाँ ऊँटों पर चढ़कर सवार होने की क्रिया बताता है; यह आधुनिक हिन्दी में सहज और स्रोत-संगत है।
- source_word: אַחֲרֵי הָאִישׁ
  choice: उस पुरुष के पीछे
  rationale: אַחֲרֵי का अर्थ पीछे या अनुसरण में है। ‘के पीछे’ यात्रा में उसके नेतृत्व का अनुसरण करने का भाव बनाए रखता है।
- source_word: הָאִישׁ
  choice: उस पुरुष
  rationale: यद्यपि प्रसंग में यह अब्राहम का सेवक है, स्रोत यहाँ אִישׁ कहता है; ‘उस पुरुष’ कथात्मक शब्द-परिवर्तन को सुरक्षित रखता है।
- source_word: וַיִּקַּח הָעֶבֶד אֶת רִבְקָה
  choice: सेवक रिबका को साथ लेकर
  rationale: לקח का मूल अर्थ लेना है; यात्रा के प्रसंग में हिन्दी का ‘साथ लेकर’ आशय को स्वाभाविक रूप से व्यक्त करता है, बिना अधिकार या बलपूर्वक ले जाने का अनावश्यक भाव दिए।
- source_word: הָעֶבֶד
  choice: सेवक
  rationale: עֶבֶד सेवक या दास हो सकता है। यहाँ परिवार का विश्वस्त प्रतिनिधि अभिप्रेत है, इसलिए ‘सेवक’ प्रसंगानुकूल है।
- source_word: וַיֵּלַךְ
  choice: चला गया
  rationale: הלך का सामान्य अर्थ जाना या चलना है। यात्रा के जारी रहने को हिन्दी में ‘चला गया’ सहजता से व्यक्त करता है।
