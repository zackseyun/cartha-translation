  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली। ‘सोता’ द्वारा प्राकृतिक जलस्रोत और ‘कुआँ’ के बीच स्रोत-पाठ का शब्दार्थिक भेद सुरक्षित रखा गया है।
