  yaml_path: translation/ot/genesis/024/029.yaml
  text: Rebekah had a brother[a], and his name was Laban; and Laban ran out to the man[b], outside by the spring.
translation:
  language: hi
  text: रिबका का एक भाई था, जिसका नाम लाबान था। लाबान बाहर सोते के पास उस पुरुष की ओर दौड़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/רִבְקָה אָח
  choice: रिबका का एक भाई था
  rationale: हिब्रू में לְ के साथ अस्तित्वसूचक वाक्य-रचना अधिकार या संबंध व्यक्त करती है; आधुनिक हिन्दी में ‘रिबका का एक भाई था’ स्वाभाविक और सटीक है। आरंभिक וּ को अलग से ‘और’ कहना हिन्दी में अनावश्यक रूप से बोझिल होता।
- source_word: וּ/שְׁמ/וֹ לָבָן
  choice: जिसका नाम लाबान था
  rationale: हिब्रू नामकरण-वाक्य का स्वाभाविक हिन्दी रूप; संबंधवाचक रचना पिछले उपवाक्य से सहज जुड़ती है।
- source_word: וַ/יָּרָץ לָבָן
  choice: लाबान ... दौड़ा
  rationale: רוּץ का मूल अर्थ ‘दौड़ना’ है; कर्ता का नाम स्रोत के अनुसार दोहराया गया है।
- source_word: אֶל הָ/אִישׁ
  choice: उस पुरुष की ओर
  rationale: אֶל गति की दिशा बताता है। ‘उस पुरुष’ पूर्वप्रसंग में अब्राहम के सेवक की ओर संकेत करता है, पर स्रोत की सामान्य संज्ञा को ‘सेवक’ बनाकर स्पष्ट नहीं किया गया।
- source_word: הַ/חוּצָ/ה
  choice: बाहर
  rationale: दिशासूचक रूप का अर्थ ‘बाहर की ओर/बाहर’ है; हिन्दी में ‘बाहर ... दौड़ा’ स्वाभाविक है।
- source_word: אֶל הָ/עָיִן
  choice: सोते के पास
  rationale: עַיִן यहाँ प्राकृतिक जलस्रोत, अर्थात ‘सोता’, है, न कि सामान्यतः खोदा हुआ ‘कुआँ’। दूसरा אֶל गंतव्य-क्षेत्र बताता है; हिन्दी में व्यक्ति की ओर गति और उसके स्थान—सोते के पास—का संबंध इस रूप में स्पष्ट रहता है।
theological_decisions: []
