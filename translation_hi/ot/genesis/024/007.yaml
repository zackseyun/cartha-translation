base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/007.yaml
  text: Yahweh[a], the God of heaven, who took me from my father's house and from the land of my birth, and who spoke to me and who swore to me, saying, ‘To your offspring I will give this land’—he will send his angel before you, and you shall take a wife for my son from there.
translation:
  language: hi
  text: स्वर्ग के परमेश्वर याहवे, जो मुझे मेरे पिता के घर से और मेरी जन्मभूमि से ले आए, जिन्होंने मुझसे बात की और मुझसे शपथ खाई कि, ‘मैं यह भूमि तेरे वंश को दूँगा’—वही अपना स्वर्गदूत[a] तेरे आगे भेजेंगे, और तू वहाँ से मेरे पुत्र के लिए पत्नी लेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपना दूत।’ इब्रानी מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है; इस प्रसंग में स्वर्गीय दूत का अर्थ अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: स्वर्ग के परमेश्वर
  rationale: इब्रानी संबंधसूचक पदबंध का स्वाभाविक हिन्दी रूप; बहुवचन ‘आकाशों’ की अपेक्षा यहाँ ‘स्वर्ग’ अधिक सहज है।
- source_word: לְקָחַנִי
  choice: मुझे ... से ले आए
  rationale: לקח के मूल ‘लेना’ भाव को बनाए रखते हुए स्रोत स्थानों से अब्राहम को बाहर लाने की क्रिया स्वाभाविक हिन्दी में व्यक्त होती है।
- source_word: מִבֵּית אָבִי
  choice: मेरे पिता के घर से
  rationale: ‘पिता का घर’ पारिवारिक और गृहस्थ-सामुदायिक अर्थ को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
- source_word: וּמֵאֶרֶץ מוֹלַדְתִּי
  choice: और मेरी जन्मभूमि से
  rationale: מוֹלֶדֶת के जन्मस्थान या मूल देश के अर्थ को संक्षिप्त, वर्तमान और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דִּבֶּר לִי
  choice: मुझसे बात की
  rationale: क्रिया के सामान्य ‘बोलना/बात करना’ अर्थ को रखा गया है; इसे पहले से ‘प्रतिज्ञा की’ बनाकर अगले शपथ-वाक्य में नहीं मिलाया गया।
- source_word: נִשְׁבַּע לִי
  choice: मुझसे शपथ खाकर कहा
  rationale: शपथ की क्रिया और उसके बाद आने वाले उद्धरण के संबंध को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְזַרְעֲךָ
  choice: तेरे वंश को
  rationale: זֶרַע के सामूहिक एकवचन भाव को ‘वंश’ सुरक्षित रखता है और हिन्दी पाठक के लिए ‘बीज’ से अधिक स्पष्ट है।
- source_word: אֶתֵּן אֶת הָאָרֶץ הַזֹּאת
  choice: मैं यह देश ... दूँगा
  rationale: भूमि देने की प्रतिज्ञा का सीधा भविष्यकालीन रूप है; यहाँ ‘देश’ प्रतिज्ञात भूभाग के लिए सहज हिन्दी है।
- source_word: הוּא
  choice: वही
  rationale: स्वतंत्र इब्रानी सर्वनाम के बलाघात को हिन्दी के ‘वही’ द्वारा स्पष्ट किया गया है।
- source_word: יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ
  choice: अपना स्वर्गदूत तेरे आगे भेजेंगे
  rationale: दैवी मार्गदर्शन के प्रसंग में מַלְאָךְ का संभावित अलौकिक अर्थ मुख्य पाठ में है; ‘तेरे आगे’ לְפָנֶיךָ के निकट रहता है।
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: और तू ... मेरे पुत्र के लिए पत्नी ले आएगा
  rationale: सेवक को दिए गए दायित्व और वहाँ से पत्नी लाने के आशय को वर्तमान हिन्दी में स्पष्ट तथा गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: מַלְאָכוֹ का अर्थ
  choice: अपना स्वर्गदूत
  alternative: अपना दूत
  rationale: परमेश्वर द्वारा आगे भेजकर मार्गदर्शन करने के इस संदर्भ में स्वर्गीय दूत अधिक संभावित है, पर इब्रानी शब्द की वास्तविक ‘दूत’ वाली व्यापकता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। अब्राहम और सेवक के संवाद में प्रसंगानुकूल ‘तेरे/तू’ है, जबकि परमेश्वर के लिए आदरसूचक बहुवचन क्रियारूप ‘भेजेंगे’ प्रयुक्त हुआ है। पादटिप्पणी का चिह्न उसी संदिग्ध शब्द ‘स्वर्गदूत’ पर रखा गया है।
