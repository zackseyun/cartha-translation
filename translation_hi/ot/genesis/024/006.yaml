  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। चेतावनी की तीव्रता बनाए रखने के लिए ‘सावधान रहना’ चुना गया है। हिफ़ईल की कारणवाचकता ‘वापस ... ले जाओ’ में स्पष्ट है, इसलिए अलग पाठ-टिप्पणी आवश्यक नहीं मानी गई।
