  language: hi
  text: अब्राहम ने उससे कहा, “सावधान रहना कि तुम मेरे बेटे को वहाँ वापस न ले जाओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: कथात्मक वय्यिक्तोल में אמר का सामान्य अर्थ ‘कहा’ है; आधुनिक हिन्दी कथा-शैली में यही स्वाभाविक है।
- source_word: אֵלָיו
  choice: उससे
  rationale: לְ/אֶל के साथ तृतीय पुरुष एकवचन प्रत्यय कथन के संबोधित व्यक्ति को दर्शाता है; हिन्दी में ‘उससे कहा’ स्वाभाविक प्रयोग है।
- source_word: הִשָּׁמֶר לְךָ
  choice: सावधान रहना
  rationale: שׁמר का निफ़अल आज्ञार्थक और नैतिक दातिव मिलकर गंभीर चेतावनी देते हैं; ‘सावधान रहना’ उसका सहज और गरिमापूर्ण हिन्दी रूप है।
- source_word: פֶּן
  choice: कि ... न
  rationale: यह निषेधात्मक चेतावनी का उपवाक्य आरम्भ करता है; हिन्दी में ‘सावधान रहना कि ... न’ अर्थ को स्पष्ट रखता है।
- source_word: תָּשִׁיב
  choice: वापस ... ले जाओ
  rationale: שׁוב का हिफ़ईल रूप कारणवाचक है—‘लौटाना/वापस पहुँचाना’; यात्रा के इस संदर्भ में व्यक्ति को किसी स्थान पर ले जाने के लिए ‘वापस ले जाओ’ स्वाभाविक है।
- source_word: אֶת־בְּנִי
  choice: मेरे बेटे को
  rationale: प्रत्यक्ष कर्म-चिह्न के बाद प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय वाला בֵּן स्पष्टतः ‘मेरे बेटे को’ है।
- source_word: שָׁמָּה
  choice: वहाँ
  rationale: दिशासूचक क्रियाविशेषण उस पहले उल्लिखित स्थान की ओर संकेत करता है; ‘वापस ले जाओ’ के साथ ‘वहाँ’ पर्याप्त और स्वाभाविक है।
