  yaml_path: translation/ot/genesis/024/020.yaml
  text: She quickly emptied her jar into the trough[a], and ran again to the well to draw water, and drew for all his camels.
translation:
  language: hi
  text: उसने फुर्ती से अपना घड़ा हौद में उँडेल दिया[a], फिर पानी भरने के लिए कुएँ तक दौड़ी और उसके सभी ऊँटों के लिए पानी भरा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपना घड़ा पशुओं के पानी पीने के हौद में खाली कर दिया।”
    reason: शֹׁקֶת के पशुओं को पानी पिलाने वाले हौद होने और וַתְּעַר में घड़े की सामग्री उँडेलने/खाली करने के वैकल्पिक अनुवाद को दर्शाता है।
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: उसने फुर्ती से
  rationale: क्रिया शीघ्रता और तत्परता से काम करने का भाव देती है; ‘फुर्ती से’ आधुनिक हिंदी में दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַתְּעַר
  choice: उँडेल दिया
  rationale: यहाँ क्रिया घड़े की सामग्री को बाहर डालने या खाली करने को बताती है; ‘उँडेल दिया’ पानी और हौद के प्रसंग में सटीक और स्वाभाविक है।
- source_word: כַּדָּהּ
  choice: अपना घड़ा
  rationale: כַּד पानी रखने और भरने का पात्र है; हिंदी कथा-प्रसंग में ‘घड़ा’ सामान्य और स्पष्ट शब्द है।
- source_word: הַשֹּׁקֶת
  choice: हौद
  rationale: यह पशुओं को पानी पिलाने के पात्र या कुंड को दर्शाता है; ऊँटों के प्रसंग में ‘हौद’ संक्षिप्त और स्पष्ट है।
- source_word: וַתָּרָץ עוֹד
  choice: फिर ... दौड़कर ... गई
  rationale: रचना दौड़ने और दोबारा कुएँ की ओर जाने का भाव देती है; हिंदी में ‘फिर ... दौड़कर ... गई’ उस क्रम को स्वाभाविक ढंग से रखता है।
- source_word: הַבְּאֵר
  choice: कुएँ
  rationale: בְּאֵר का सामान्य अर्थ कुआँ है और इस कथा-संदर्भ में यही सर्वाधिक उपयुक्त है।
- source_word: לִשְׁאֹב
  choice: पानी भरने के लिए
  rationale: कुएँ से पानी निकालने की क्रिया हिंदी में सामान्यतः ‘पानी भरना’ कही जाती है; उद्देश्यसूचक रूप मूल infinitive को व्यक्त करता है।
- source_word: וַתִּשְׁאַב
  choice: पानी भरा
  rationale: क्रिया कुएँ से पानी निकालने की अगली क्रिया को दोहराती है; ‘पानी भरा’ हिंदी में सहज है और प्रसंग से बार-बार भरना निहित है।
- source_word: לְכָל גְּמַלָּיו
  choice: उसके सभी ऊँटों के लिए
  rationale: यह लाभार्थी संबंध और כָּל की समग्रता—सभी ऊँट—दोनों को स्पष्ट रूप से सुरक्षित रखता है।
