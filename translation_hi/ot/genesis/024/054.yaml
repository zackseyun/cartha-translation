base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/054.yaml
  text: Then he and the men who were with him ate and drank[a], and they spent the night there. When they arose in the morning, he said, “Send me away to my master.”
translation:
  language: hi
  text: तब उसने और उसके साथ के पुरुषों ने खाया-पिया और वहीं रात बिताई। सुबह जब वे उठे, तो उसने कहा, “मुझे मेरे मालिक[a] के पास विदा कर दीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे स्वामी।” इब्रानी शब्द אֲדֹנִי का अर्थ “मेरे स्वामी” या “मेरे मालिक” हो सकता है; यहाँ इसका संकेत सेवक के मानवीय मालिक अब्राहम की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: खाया-पिया
  rationale: दोनों समन्वित क्रियाओं को संक्षिप्त और स्वाभाविक हिन्दी युग्म में रखा गया है; इससे भोजन और पेय दोनों का अर्थ बना रहता है।
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר עִמּוֹ
  choice: उसने और उसके साथ के पुरुषों ने
  rationale: इब्रानी में सेवक और उसके साथ के पुरुष स्पष्ट रूप से कर्ता हैं; हिन्दी में एर्गेटिव ‘ने’ के साथ यह संरचना स्वाभाविक है।
- source_word: וַיָּלִינוּ
  choice: वहीं रात बिताई
  rationale: לון/לין का आशय रात भर ठहरना है। ‘वहीं’ प्रसंगगत स्थान को व्यक्त करता है, जबकि ‘रात बिताई’ आधुनिक हिन्दी में सहज है।
- source_word: וַיָּק֣וּמוּ בַבֹּקֶר
  choice: सुबह उठने पर
  rationale: यह अगली कथात्मक क्रिया को स्वाभाविक हिन्दी काल-संबंध में व्यक्त करता है और बहुवचन कर्ता को प्रसंग से स्पष्ट रहने देता है।
- source_word: שַׁלְּחֻנִי
  choice: मुझे ... विदा कर दीजिए
  rationale: यह प्रस्थान की अनुमति देकर भेजने का भाव व्यक्त करता है। आदरसूचक/बहुवचन ‘दीजिए’ इब्रानी संबोधन के अनुरूप है और परिवार से कही गई विनती में स्वाभाविक लगता है।
- source_word: לַאדֹנִי
  choice: मेरे मालिक के पास
  rationale: यहाँ אָדוֹן अब्राहम के लिए है, जो सेवक का मानवीय अधिकारी है। ‘मालिक’ उस सामाजिक संबंध को स्पष्ट करता है; व्यापक ‘स्वामी’ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: अब्राहम के लिए אָדוֹן का अनुवाद
  choice: मेरे मालिक
  alternative: मेरे स्वामी
  rationale: संदर्भ में वक्ता अब्राहम का सेवक है, इसलिए ‘मालिक’ मानवीय सेवक-मालिक संबंध को स्पष्ट रूप से व्यक्त करता है और परमेश्वर के लिए प्रयुक्त उपाधि समझे जाने की अनचाही संभावना घटाता है। फिर भी इब्रानी शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘खाया-पिया’ और ‘रात बिताई’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि ‘विदा कर दीजिए’ सेवक की सम्मानपूर्ण विनती और प्रस्थान के भाव दोनों को बनाए रखता है।
