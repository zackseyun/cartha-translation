source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י יְהוָ֞ה אֲשֶׁר הִתְהַלַּ֣כְתִּי לְ/פָנָ֗י/ו יִשְׁלַ֨ח מַלְאָכ֤/וֹ אִתָּ/ךְ֙ וְ/הִצְלִ֣יחַ דַּרְכֶּ֔/ךָ וְ/לָקַחְתָּ֤ אִשָּׁה֙ לִ/בְנִ֔/י מִ/מִּשְׁפַּחְתִּ֖/י וּ/מִ/בֵּ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/040.yaml
  text: And he said to me[a], ‘Yahweh, before whom I have walked, will send his angel with you and make your journey successful[b], and you will take a wife for my son from my clan and from my father’s house.’
translation:
  language: hi
  text: उसने मुझसे कहा, ‘याहवे, जिसके सम्मुख मैं चलता आया हूँ, अपना स्वर्गदूत तेरे साथ भेजेगा और तेरी यात्रा सफल करेगा[a]। तू मेरे बेटे के लिए मेरे कुल और मेरे पिता के घराने में से एक पत्नी लेगा।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तेरा मार्ग सफल करेगा।”
    reason: इब्रानी मुहावरे का अधिक शाब्दिक विकल्प।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: הִתְהַלַּכְתִּי לְפָנָיו
  choice: जिसके सामने मैं चलता रहा हूँ
  rationale: यह जीवन और आचरण से जुड़ी इब्रानी वाचागत अभिव्यक्ति को बनाए रखता है, बिना ‘विश्वासयोग्यता’ जैसी व्याख्या पाठ में जोड़े।
- source_word: מַלְאָכוֹ
  choice: अपना दूत
  rationale: संदर्भ में यह याहवे द्वारा भेजा गया स्वर्गीय दूत है; हिंदी में ‘दूत’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהִצְלִיחַ דַּרְכֶּךָ
  choice: तेरी यात्रा सफल करेगा
  rationale: हिफ़ील रूप के कारणात्मक अर्थ को स्पष्ट करता है और ‘तेरा मार्ग सफल करेगा’ की अपेक्षा आधुनिक हिंदी में अधिक स्वाभाविक है।
- source_word: וְלָקַחְתָּ אִשָּׁה
  choice: एक पत्नी ले आएगा
  rationale: ‘मेरे बेटे के लिए’ के साथ यह विवाह-संबंधी इब्रानी मुहावरे का आशय स्पष्ट करता है और इस भ्रम से बचाता है कि सेवक स्वयं पत्नी लेगा।
- source_word: מִמִּשְׁפַּחְתִּי
  choice: मेरे कुल
  rationale: מִשְׁפָּחָה यहाँ निकट परिवार से व्यापक रिश्तेदारी-समूह का संकेत दे सकता है; ‘कुल’ इस विस्तार को संक्षेप में बनाए रखता है।
- source_word: וּמִבֵּית אָבִי
  choice: मेरे पिता के घराने में से
  rationale: पितृवंशीय परिवार अथवा गृह-समूह का अर्थ रखने वाली ‘पिता के घर’ की अभिव्यक्ति को स्वाभाविक हिंदी में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को सुरक्षित रखा गया है और उसके स्थान पर कोई उपाधि नहीं रखी गई।
- issue: ‘जिसके सामने मैं चलता रहा हूँ’ का आशय
  choice: वाचागत मुहावरे को बनाए रखना
  alternative: जिसके सामने मैं विश्वासयोग्यता से जीता रहा हूँ; जिसकी उपस्थिति में मैं चलता रहा हूँ
  rationale: यह अब्राहम के परमेश्वर के सम्मुख जीवन और आचरण की ओर संकेत करता है; अनुवाद उस आशय को किसी अतिरिक्त नैतिक विशेषण से सीमित नहीं करता।
- issue: भविष्यकालीन कथन की शक्ति
  choice: भविष्यकाल—‘भेजेगा… सफल करेगा… ले आएगा’
  alternative: विधिसूचक—‘भेजे… सफल करे… ले आना’
  rationale: इब्रानी क्रियाएँ यहाँ अब्राहम के आश्वस्त कथन के रूप में हैं; इसलिए उन्हें आज्ञा या केवल संभावना में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। प्रत्यक्ष कथन में ‘तेरे/तू’ का प्रयोग प्रसंगानुकूल पारंपरिक एकवचन संबोधन के रूप में किया गया है। मुख्य पाठ में इब्रानी मुहावरे की धार्मिक बनावट बनाए रखते हुए केवल वहाँ स्वाभाविक हिंदी अपनाई गई है जहाँ अत्यधिक शाब्दिक रूप भ्रम पैदा कर सकता था।
