  edition: WLC
  text: הִנֵּֽה רִבְקָ֥ה לְ/פָנֶ֖י/ךָ קַ֣ח וָ/לֵ֑ךְ וּ/תְהִ֤י אִשָּׁה֙ לְ/בֶן אֲדֹנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/051.yaml
  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
translation:
  language: hi
  text: “देखो, रिबका तुम्हारे सामने है। उसे लेकर जाओ, और वह तुम्हारे स्वामी के पुत्र की पत्नी हो जाए[a], जैसा याहवे ने कहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पत्नी हो।” इब्रानी जुस्सिव का अर्थ यहाँ “हो” अथवा “हो जाए” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह संकेतवाचक अव्यय सामने उपस्थित स्थिति की ओर ध्यान खींचता है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक और सजीव है।
- source_word: רִבְקָה
  choice: रिबका
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לְפָנֶיךָ
  choice: तुम्हारे सामने है
  rationale: मूल अर्थ ‘तुम्हारे सामने’ है और प्रसंग में उसकी उपस्थिति तथा उपलब्धता को व्यक्त करता है।
- source_word: קַח וָלֵךְ
  choice: उसे लेकर जाओ
  rationale: दो क्रमिक आज्ञार्थक क्रियाओं को स्वाभाविक हिन्दी में जोड़ा गया है; स्त्रीलिंग कर्म ‘उसे’ प्रसंग से स्पष्ट है।
- source_word: וּתְהִי אִשָּׁה
  choice: और वह ... की पत्नी हो
  rationale: היה का स्त्रीलिंग जुस्सिव अनुमति अथवा इच्छा व्यक्त करता है; ‘पत्नी हो’ उसके बल को बनाए रखता है, जबकि ‘पत्नी बन जाए’ भी संभव है।
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: तुम्हारे स्वामी के पुत्र की
  rationale: विवाह-संबंध बताने वाली रचना को हिन्दी के स्वाभाविक संबंधकारक रूप में व्यक्त किया गया है।
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: जैसा ... ने कहा है
  rationale: כַּאֲשֶׁר अनुरूपता व्यक्त करता है; पूर्ण क्रिया को वर्तमान प्रासंगिकता सहित ‘ने कहा है’ के रूप में दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण, किसी उपाधि से प्रतिस्थापन नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना निकटतम प्रचलित विद्वत्तापूर्ण उच्चारण के अनुसार प्रस्तुत करता है।
- issue: וּתְהִי के जुस्सिव भाव को व्यक्त करना
  choice: वह ... की पत्नी हो
  alternative: वह ... की पत्नी बन जाए
  rationale: ‘हो’ अनुमति/इच्छा और वैवाहिक स्थिति दोनों को संक्षेप में सुरक्षित रखता है; ‘बन जाए’ संक्रमण पर कुछ अधिक बल देता है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘स्वामी’ सेवक-स्वामी के प्रसंग को स्पष्ट करता है; वाक्य की प्रत्यक्षता और मूल की आज्ञार्थक गति सुरक्षित है।
