  text: וָ/אֶשְׁאַ֣ל אֹתָ֗/הּ וָ/אֹמַר֮ בַּת מִ֣י אַתְּ֒ וַ/תֹּ֗אמֶר בַּת בְּתוּאֵל֙ בֶּן נָח֔וֹר אֲשֶׁ֥ר יָֽלְדָה לּ֖/וֹ מִלְכָּ֑ה וָ/אָשִׂ֤ם הַ/נֶּ֨זֶם֙ עַל אַפָּ֔/הּ וְ/הַ/צְּמִידִ֖ים עַל יָדֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/047.yaml
  text: Then I asked her[a], saying, ‘Whose daughter are you?’ And she said, ‘The daughter of Bethuel son of Nahor[c][b], whom Milcah bore to him.’ Then I put the ring on her nose and the bracelets on her hands.
translation:
  language: hi
  text: तब मैंने उससे पूछा,[a] “तुम किसकी बेटी हो?” उसने कहा, “मैं नाहोर के पुत्र बतूएल की बेटी हूँ, जिसे मिल्का ने नाहोर से जन्म दिया था।” तब मैंने उसकी नाक में नथ[b] और उसकी कलाइयों में कंगन[c] पहना दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैंने उससे पूछा और कहा।”
    reason: इब्रानी की दोहरी क्रिया को दिखाने वाला अधिक शाब्दिक विकल्प।
  - marker: b
    text: इब्रानी शब्द का अर्थ सामान्य रूप से “छल्ला” भी हो सकता है; “नाक में” से यहाँ उसका उपयोग स्पष्ट होता है।
    reason: मूल शब्द की व्यापक अर्थ-सीमा बताना।
  - marker: c
    text: शाब्दिक रूप से, “हाथों”; प्रसंग में इससे विशेष रूप से कलाइयाँ अभिप्रेत हो सकती हैं।
    reason: इब्रानी יָד की व्यापक देह-संबंधी अर्थ-सीमा बनाए रखना।
lexical_decisions:
- source_word: וָאֶשְׁאַל אֹתָהּ וָאֹמַר
  choice: तब मैंने उससे पूछा
  rationale: दो क्रमिक इब्रानी क्रियाओं का शाब्दिक अर्थ ‘मैंने उससे पूछा और कहा’ है, पर यहाँ बोलना पूछने का ही माध्यम है। स्वाभाविक हिन्दी में ‘मैंने उससे पूछा’ पूरा अर्थ व्यक्त करता है।
- source_word: בַּת מִי אַתְּ
  choice: तुम किसकी बेटी हो?
  rationale: इब्रानी के संबंधसूचक प्रश्न का सीधा, स्वाभाविक और अर्थनिष्ठ हिन्दी रूप।
- source_word: בַּת בְּתוּאֵל בֶּן נָחוֹר
  choice: मैं नाहोर के पुत्र बतूएल की बेटी हूँ
  rationale: वंश-संबंध को स्पष्ट रखते हुए हिन्दी संवाद में आवश्यक ‘मैं ... हूँ’ जोड़ा गया है।
- source_word: אֲשֶׁר יָלְדָה לּוֹ מִלְכָּה
  choice: जिसे मिल्का ने उसके लिए जन्म दिया था
  rationale: संबंधवाचक उपवाक्य, माता मिल्का की पहचान और לּוֹ के ‘उसके लिए/उसको’ भाव को बनाए रखता है; संदर्भ में ‘जिसे’ बतूएल और ‘उसके’ नाहोर की ओर संकेत करता है।
- source_word: הַנֶּזֶם עַל אַפָּהּ
  choice: उसकी नाक में नथ
  rationale: נֶזֶם सामान्यतः छल्ला भी हो सकता है, पर עַל אַפָּהּ यहाँ नाक में पहने जाने वाले आभूषण को स्पष्ट करता है। आधुनिक हिन्दी में ‘नाक में नथ’ स्वाभाविक है।
- source_word: וְהַצְּמִידִים עַל יָדֶיהָ
  choice: उसके हाथों में कंगन
  rationale: צְמִידִים के लिए ‘कंगन’ सामान्य आधुनिक हिन्दी है। יָדֶיהָ का मूल रूप ‘हाथों’ है, यद्यपि प्रसंग में कलाई अभिप्रेत हो सकती है।
- source_word: וָאָשִׂם
  choice: पहना दिए
  rationale: शाब्दिक ‘रख दिए’ की अपेक्षा आभूषणों के संदर्भ में ‘पहना दिए’ स्वाभाविक हिन्दी है और क्रिया का प्रसंगगत आशय व्यक्त करता है।
