source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֶל הָ/עֶ֗בֶד מִֽי הָ/אִ֤ישׁ הַלָּזֶה֙ הַ/הֹלֵ֤ךְ בַּ/שָּׂדֶה֙ לִ/קְרָאתֵ֔/נוּ וַ/יֹּ֥אמֶר הָ/עֶ֖בֶד ה֣וּא אֲדֹנִ֑/י וַ/תִּקַּ֥ח הַ/צָּעִ֖יף וַ/תִּתְכָּֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/065.yaml
  text: And she said to the servant[a], “Who is this man walking in the field to meet us?” And the servant said[c][b], “He is my master.” Then she took the veil and covered herself.
translation:
  language: hi
  text: उसने सेवक से पूछा, “वह आदमी कौन है, जो खेत में हमसे मिलने आ रहा है?” सेवक ने कहा, “वह मेरा स्वामी है।” तब उसने घूँघट लिया और अपने आपको ढक लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֶבֶד
  choice: सेवक
  rationale: यहाँ עֶבֶד अब्राहम के घराने के प्रतिनिधि और अधीनस्थ व्यक्ति को दर्शाता है; इस प्रसंग में ‘सेवक’ स्वाभाविक है, जबकि ‘दास’ अनावश्यक रूप से उसकी बंधुआ स्थिति पर बल दे सकता है।
- source_word: הָאִישׁ הַלָּזֶה
  choice: वह कौन पुरुष
  rationale: दृश्य दूरी और हिन्दी की स्वाभाविक संकेत-प्रणाली के अनुसार הַלָּזֶה को ‘वह’ कहा गया है; אִישׁ के लिए ‘पुरुष’ व्यक्ति के पुरुष होने को स्पष्ट रखता है।
- source_word: הַהֹלֵךְ בַּשָּׂדֶה לִקְרָאתֵנוּ
  choice: जो मैदान में हमारी ओर आ रहा है
  rationale: הלך का गतिशील भाव और לִקְרָאתֵנוּ की उनकी दिशा में गति, आधुनिक हिन्दी में ‘हमारी ओर आ रहा है’ से स्वाभाविक और सटीक रूप में व्यक्त होते हैं।
- source_word: הוּא אֲדֹנִי
  choice: वह मेरा स्वामी है
  rationale: אֲדֹנִי यहाँ सेवक के मानवीय स्वामी को सूचित करता है। ‘स्वामी’ संबंध और सम्मान दोनों व्यक्त करता है, बिना इसे परमेश्वर की उपाधि बनाए।
- source_word: הַצָּעִיף
  choice: घूँघट
  rationale: צעיף स्त्री द्वारा ओढ़े जाने वाले आवरण को दर्शाता है। विवाह-संबंधी इस प्रसंग में ‘घूँघट’ सामान्य हिन्दी पाठक के लिए ‘परदा’ या तकनीकी ‘मुखावरण’ से अधिक सहज है।
- source_word: וַתִּתְכָּס
  choice: अपने आपको ढक लिया
  rationale: 'हित्पएल रूप का आत्मवाचक अर्थ स्पष्ट रखा गया है: उसने लिए हुए आवरण से स्वयं को ढका।'
theological_decisions:
- issue: אֲדֹנִי का अर्थ
  choice: मेरा स्वामी
  alternative: मेरे प्रभु
  rationale: वक्ता एक सेवक है और संदर्भ इसहाक के साथ मानवीय स्वामी-सेवक संबंध का है; ‘प्रभु’ धार्मिक अर्थ का अनचाहा संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रजिस्टर रखा गया है। संवाद स्वाभाविक है और वाक्य में मूल की क्रमिक क्रियाएँ सुरक्षित हैं। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई।
