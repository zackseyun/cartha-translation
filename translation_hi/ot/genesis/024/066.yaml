  yaml_path: translation/ot/genesis/024/066.yaml
  text: And the servant told Isaac all the things that he had done[a][b].
translation:
  language: hi
  text: तब सेवक ने इसहाक को वह सब बताया जो उसने किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: बताया
  rationale: पिएल क्रिया यहाँ बीती घटनाओं का विवरण देने को व्यक्त करती है; ‘बताया’ सहज आधुनिक हिन्दी है और प्रसंग में ‘वृत्तांत सुनाया’ का भाव समेटती है।
- source_word: הָעֶבֶד
  choice: सेवक
  rationale: עֶבֶד का अर्थ ‘दास’ या ‘सेवक’ हो सकता है; इस प्रसंग में उसकी भूमिका प्रमुख है, इसलिए ‘सेवक’ स्वाभाविक और संदर्भानुकूल है।
- source_word: לְיִצְחָק
  choice: इसहाक को
  rationale: व्यक्तिनाम को हिन्दी बाइबलीय परंपरा के प्रचलित रूप ‘इसहाक’ में लिप्यंतरित किया गया है; לְ को ‘को’ से व्यक्त किया गया है।
- source_word: אֵת כָּל הַדְּבָרִים
  choice: वह सब
  rationale: דְּבָרִים यहाँ केवल बोले गए शब्द नहीं, बल्कि सेवक के काम और यात्रा से जुड़ी सारी बातें/घटनाएँ दर्शाता है। ‘वह सब’ हिन्दी में व्यापक अर्थ को सहज रूप से बनाए रखता है।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो उसने किया था
  rationale: सम्बन्धवाचक उपवाक्य सेवक के पहले पूरे हो चुके कार्यों की ओर संकेत करता है; ‘किया था’ कथन से पूर्व की क्रिया को स्पष्ट करता है।
