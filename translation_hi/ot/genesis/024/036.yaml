base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/036.yaml
  text: And Sarah[a], my master's wife, bore a son to my master after her old age, and he gave him all that he had.
translation:
  language: hi
  text: और मेरे स्वामी की पत्नी सारा ने बुढ़ापे में मेरे स्वामी के लिए एक पुत्र को जन्म दिया, और मेरे स्वामी ने अपना सब कुछ उसे दे दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: जन्म दिया
  rationale: ילד के क़ाल कथात्मक रूप का स्वाभाविक और स्पष्ट हिन्दी अनुवाद।
- source_word: אֵשֶׁת אֲדֹנִי
  choice: मेरे स्वामी की पत्नी
  rationale: सम्बन्धवाचक रचना को सहज हिन्दी में रखते हुए सेवक की आदरपूर्ण वाणी सुरक्षित रखी गई है।
- source_word: בֵן
  choice: एक पुत्र
  rationale: हिब्रू में यहाँ निश्चित उपपद नहीं है; हिन्दी जन्म-वर्णन में ‘एक पुत्र’ स्वाभाविक है।
- source_word: לַאדֹנִי
  choice: मेरे स्वामी के लिए
  rationale: ל यहाँ सम्बन्ध अथवा हित का बोध कराता है; ‘के लिए’ आधुनिक हिन्दी में स्वाभाविक है और पुत्र का पिता से सम्बन्ध व्यक्त करता है।
- source_word: אַחֲרֵי זִקְנָתָהּ
  choice: बुढ़ापे में
  rationale: शाब्दिक रूप ‘उसके बुढ़ापे के बाद’ हिन्दी में भ्रामक हो सकता है; पद का आशय सारा की बहुत वृद्ध अवस्था में जन्म देने से है।
- source_word: וַיִּתֶּן לוֹ
  choice: मेरे स्वामी ने ... उसे दे दिया
  rationale: सन्दर्भ से कर्ता अब्राहम और परोक्ष कर्म अभी उल्लिखित पुत्र है; स्पष्टता के लिए सर्वनामात्मक कर्ता को ‘मेरे स्वामी’ किया गया है।
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: अपना सब कुछ
  rationale: अब्राहम की समस्त सम्पत्ति का व्यापक और सहज हिन्दी निरूपण।
