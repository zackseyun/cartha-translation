base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/037.yaml
  text: And my master made me swear[a], saying, ‘You shall not take a wife for my son from the daughters of the Canaanites, in whose land I am dwelling.’
translation:
  language: hi
  text: और मेरे स्वामी ने मुझे शपथ दिलाकर कहा, “तू मेरे बेटे के लिए कनानियों की बेटियों में से कोई पत्नी न लेना, जिनके देश में मैं रहता हूँ।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “उस कनानी के देश में मैं रहता हूँ।” इब्रानी में “कनानी” एकवचन सामूहिक अर्थ में है। इसका भाव “जिनके बीच मैं रहता हूँ” भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבִּעֵנִי
  choice: मुझे शपथ दिलाकर
  rationale: हिफ़ील रूप का अर्थ किसी से शपथ करवाना है; यह वाक्य में आगे आने वाले ‘कहा’ के साथ स्वाभाविक और शपथ की बाध्यता को स्पष्ट रखता है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: यहाँ सेवक अपने मानवीय अधिकारी अब्राहम की बात कर रहा है; ‘स्वामी’ सम्मान और सामाजिक संबंध दोनों व्यक्त करता है।
- source_word: לֹא תִקַּח
  choice: तू ... न लेना
  rationale: प्रत्यक्ष कथन में यह निषेधात्मक आज्ञा है; ‘न लेना’ उसकी गंभीरता को बनाए रखता है।
- source_word: אִשָּׁה לִבְנִי
  choice: मेरे बेटे के लिए ... कोई पत्नी
  rationale: विवाह के संदर्भ में אִשָּׁה का अर्थ ‘पत्नी’ है, और לִבְנִי को बिना संदर्भगत नाम जोड़े ‘मेरे बेटे के लिए’ रखा गया है।
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: कनानियों की बेटियों में से
  rationale: यह इब्रानी की पारिवारिक-जातीय अभिव्यक्ति को बनाए रखते हुए हिन्दी में स्वाभाविक है; एकवचन जातिवाचक ‘कनानी’ का आशय सामूहिक है।
- source_word: אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  choice: जिनके देश में मैं रहता हूँ
  rationale: यह भूमि-केंद्रित मूल शब्दावली और जारी निवास के भाव को सुरक्षित रखता है, जबकि सामूहिक एकवचन को स्वाभाविक हिन्दी बहुवचन में व्यक्त करता है।
