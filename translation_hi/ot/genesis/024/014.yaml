source:
  edition: WLC
  text: וְ/הָיָ֣ה הַֽ/נַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֨י/הָ֙ הַטִּי נָ֤א כַדֵּ/ךְ֙ וְ/אֶשְׁתֶּ֔ה וְ/אָמְרָ֣ה שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה אֹתָ֤/הּ הֹכַ֨חְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יִצְחָ֔ק וּ/בָ֣/הּ אֵדַ֔ע כִּי עָשִׂ֥יתָ חֶ֖סֶד עִם אֲדֹנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/014.yaml
  text: And let it be that the young woman to whom I say[a], ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac[c][b]. By her I will know that you have shown steadfast love to my master.
translation:
  language: hi
  text: और ऐसा हो कि जिस युवती से मैं कहूँ, ‘कृपया अपना घड़ा झुका दीजिए, ताकि मैं पानी पी लूँ,’ और वह कहे, ‘पीजिए, और मैं आपके ऊँटों को भी पानी पिलाऊँगी,’ वही हो जिसे आपने अपने सेवक इसहाक के लिए ठहराया है[a]। उसी के द्वारा[b] मैं जान लूँगा कि आपने मेरे स्वामी के प्रति अटल प्रेम दिखाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सेवक के लिए—इसहाक के लिए।” इब्रानी में दोनों वाक्यांश अलग-अलग दत्तिव पदों के रूप में भी समझे जा सकते हैं।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “उसके द्वारा” या “उसमें।” स्त्रीलिंग रूप युवती की ओर संकेत करता है; अर्थ यह भी हो सकता है कि वह और उसका उत्तर पहचान का संकेत होंगे।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा हो कि
  rationale: यह प्रार्थना में व्यक्त इच्छा या विनती का भाव रखता है और आधुनिक हिन्दी में स्वाभाविक भी है।
- source_word: הַנַּעֲרָ
  choice: युवती
  rationale: यहाँ विवाह योग्य आयु की युवा स्त्री अभिप्रेत है; ‘युवती’ आधुनिक, सम्मानजनक और आयु की दृष्टि से उपयुक्त है।
- source_word: הַטִּי נָא כַדֵּךְ
  choice: कृपया अपना घड़ा झुका दे
  rationale: הטה में झुकाने या नीचे करने का भाव है और נָא की विनम्रता ‘कृपया’ से व्यक्त होती है।
- source_word: וְאֶשְׁתֶּה
  choice: कि मैं पानी पी लूँ
  rationale: यह पूर्ववर्ती अनुरोध के उद्देश्य और विनती के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: और मैं आपके ऊँटों को भी पानी पिलाऊँगी
  rationale: हिफ़ील रूप का अर्थ किसी को पानी पिलाना है; हिन्दी में यही सबसे सीधा और स्वाभाविक प्रयोग है।
- source_word: אֹתָהּ הֹכַחְתָּ
  choice: वही हो जिसे आपने ... ठहराया है
  rationale: संदर्भ में क्रिया किसी को संकेत द्वारा निर्धारित या नियुक्त करने का भाव देती है; ‘ठहराया’ दैवी चयन को अनावश्यक रूप से तकनीकी बनाए बिना व्यक्त करता है।
- source_word: לְעַבְדְּךָ לְיִצְחָק
  choice: अपने सेवक इसहाक के लिए
  rationale: दोनों पदों को समान व्यक्ति के सूचक समानाधिकरण के रूप में लेना हिन्दी में स्वाभाविक है और विवाह के लिए इसहाक के चयन के संदर्भ से मेल खाता है; वैकल्पिक द्वि-दत्तिव पठन पाद-टिप्पणी में सुरक्षित है।
- source_word: וּבָהּ אֵדַע
  choice: उसी के द्वारा मैं जान लूँगा
  rationale: स्त्रीलिंग प्रत्यय सीधे युवती की ओर संकेत करता है; ‘उसी के द्वारा’ उसे उस संकेत का माध्यम बनाए रखता है, जबकि घटना की ओर संकेत करने वाला अर्थ भी निकट रहता है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह केवल सामान्य दया नहीं, बल्कि स्थिर, निष्ठापूर्ण और कृपालु संबंधपरक प्रेम का भाव रखता है; ‘अटल प्रेम’ इस गहराई को साधारण पाठक के लिए स्पष्ट रखता है।
- source_word: עִם אֲדֹנִי
  choice: मेरे स्वामी के प्रति
  rationale: यद्यपि עִם का मूल अर्थ ‘साथ’ है, प्रेम दिखाने के साथ हिन्दी में ‘के प्रति’ स्वाभाविक संबंध व्यक्त करता है।
theological_decisions:
- issue: לְעַבְדְּךָ לְיִצְחָק में ‘आपके सेवक’ का संबंध
  choice: ‘आपके सेवक इसहाक के लिए’—‘इसहाक’ को ‘आपके सेवक’ का समानाधिकरण माना गया है।
  alternative: ‘अपने सेवक के लिए—अर्थात् इसहाक के लिए’ या वक्ता को परमेश्वर का सेवक मानते हुए ‘अपने सेवक के लिए, इसहाक के लिए।’
  rationale: विवाह हेतु युवती इसहाक के लिए ठहराई जानी है, इसलिए समानाधिकरण संदर्भगत और हिन्दी में सर्वाधिक स्पष्ट है। फिर भी इब्रानी में दो לְ पदों की रचना वैकल्पिक विश्लेषण की गुंजाइश देती है, जिसे पाद-टिप्पणी में रखा गया है।
- issue: חֶסֶד का अर्थ-क्षेत्र
  choice: अटल प्रेम
  alternative: कृपा; भलाई; निष्ठावान प्रेम
  rationale: ‘अटल प्रेम’ कृपालु भलाई और संबंधपरक निष्ठा दोनों को समेटता है, पर इसे किसी संकीर्ण तकनीकी वाचा-सूत्र तक सीमित नहीं करता।
- issue: וּבָהּ में स्त्रीलिंग प्रत्यय का संकेत
  choice: युवती को उस माध्यम या संकेत के रूप में स्पष्ट रखा गया है जिसके द्वारा सेवक जानेगा।
  alternative: ‘इससे मैं जान लूँगा,’ अर्थात पूरी घटना या परिस्थिति को संकेत मानना।
  rationale: व्याकरणिक स्त्रीलिंग प्रत्यय का निकटतम पूर्वपद युवती है; हिन्दी में ‘उसी के द्वारा’ इस संबंध को बनाए रखता है, जबकि संकेत की भूमिका भी स्पष्ट रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। संबोधन में ‘आप’ का प्रयोग युवती के प्रति विनम्र अनुरोध को स्वाभाविक बनाता है। ‘घड़ा झुका दे’ प्रत्यक्ष उद्धरण में हिन्दी की सामान्य विनती-रचना है; ‘अटल प्रेम’ धार्मिक गहराई रखता है, पर अत्यधिक पारिभाषिक नहीं है।
