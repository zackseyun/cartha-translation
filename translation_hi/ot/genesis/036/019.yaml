base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/019.yaml
  text: These are the sons of Esau[a], and these are their chiefs. He is Edom.
translation:
  language: hi
  text: ये एसाव के पुत्र हैं, और ये उनके सरदार[a] हैं। वही एदोम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके कुल-प्रमुख।” इब्रानी शब्द אַלּוּפִים एदोम में कुलों या गोत्रों के मुखियाओं के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये ... हैं
  rationale: यह बहुवचन संकेतवाचक पद वंशावली के सारांश का परिचय देता है। इब्रानी में क्रिया निहित है; हिन्दी में वर्तमानकालीन ‘हैं’ स्वाभाविक है।
- source_word: בְנֵי
  choice: पुत्र
  rationale: इस वंशावली-संदर्भ में यह शब्द पुरुष संतानों को सूचित करता है, इसलिए व्यापक ‘सन्तान’ की अपेक्षा ‘पुत्र’ अधिक सटीक है।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: וְאֵלֶּה
  choice: और ये
  rationale: संयोजक दूसरे परिचयात्मक वाक्यांश को पहले से जोड़ता है; पुनरावृत्ति इब्रानी की समानांतर रचना बनाए रखती है।
- source_word: אַלּוּפֵיהֶם
  choice: उनके सरदार
  rationale: उत्पत्ति 36 में אַלּוּף एदोम के कुल अथवा गोत्र के अगुवे को सूचित करता है। ‘सरदार’ सामाजिक-राजनीतिक पद का भाव सहज और संक्षिप्त रूप से व्यक्त करता है।
- source_word: הוּא
  choice: वही
  rationale: यह सर्वनाम फिर से एसाव की ओर संकेत करके उसकी पहचान एदोम के रूप में करता है। ‘वही’ इस व्यक्तिगत पहचान को स्पष्ट रखता है।
- source_word: אֱדוֹם
  choice: एदोम
  rationale: नाम और स्थान-संज्ञा का हिन्दी में प्रचलित लिप्यंतरण; यहाँ एसाव की पहचान एदोम से की गई है।
theological_decisions:
- issue: एसाव और एदोम की पहचान
  choice: वही एदोम है
  alternative: अर्थात् एदोम
  rationale: इब्रानी הוּא की व्यक्तिगत और बलयुक्त पहचान को बनाए रखा गया है; व्याख्यात्मक ‘अर्थात्’ मूल की प्रत्यक्ष पहचान को कुछ कमजोर कर देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वंशावली की संक्षिप्त शैली तथा मूल इब्रानी की समानांतर वाक्य-रचना को यथासंभव सुरक्षित रखा गया है। पाद-टिप्पणी का चिह्न संबंधित शब्द ‘सरदार’ के बाद रखा गया है।
