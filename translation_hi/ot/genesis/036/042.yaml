  text: chief Kenaz[a], chief Teman, chief Mibzar.
translation:
  language: hi
  text: प्रधान केनज़, प्रधान तेमान और प्रधान मिव्सार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף
  choice: प्रधान
  rationale: उत्पत्ति 36 की एदोमी सूची में यह शब्द किसी गोत्र या कुल के अगुवे को दर्शाता है। ‘प्रधान’ संक्षिप्त, गरिमापूर्ण और आवृत्तिमूलक सूची के लिए स्वाभाविक है; ‘कुल-प्रधान’ अधिक स्पष्ट विकल्प है, पर मूल में ‘कुल’ अलग से नहीं कहा गया।
- source_word: קְנַז
  choice: कनज
  rationale: यह व्यक्ति अथवा कुल का नाम है; इसका अनुवाद करने के बजाय हिब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: תֵּימָן
  choice: तेमान
  rationale: यहाँ यह एदोमी प्रधान का नाम है। यद्यपि इसकी शब्दमूल-संबंधी धारणा ‘दक्षिण’ से जुड़ सकती है, इस प्रसंग में इसे नाम मानकर लिप्यंतरित किया गया है।
- source_word: מִבְצָר
  choice: मिबसार
  rationale: यह व्यक्ति अथवा कुल का नाम है। हिन्दी में सहज और प्रचलित ध्वन्यात्मक रूप ‘मिबसार’ रखा गया है; इसे इसके सामान्य संज्ञा-संबंधी अर्थ के अनुसार अनूदित नहीं किया गया।
