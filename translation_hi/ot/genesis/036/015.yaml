base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/015.yaml
  text: 'These are the chiefs of the sons of Esau: the sons of Eliphaz[a], Esau’s firstborn: Chief Teman, Chief Omar, Chief Zepho[b], Chief Kenaz.'
translation:
  language: hi
  text: 'एसाव के पुत्रों के प्रधान[a] ये हैं: एसाव के जेठे पुत्र एलीपज के पुत्रों में—प्रधान तेमान, प्रधान ओमार, प्रधान सपो और प्रधान कनज।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रधान” का अर्थ यहाँ कुल या गोत्र का मुखिया भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּפֵי / אַלּוּף
  choice: प्रधान
  rationale: एदोमी वंशावली में यह शब्द किसी कुल या गोत्र के मुखिया की उपाधि है। ‘प्रधान’ आधुनिक, सहज और गरिमापूर्ण है तथा व्यक्तियों के नामों के साथ उपाधि के रूप में स्वाभाविक बैठता है।
- source_word: בְנֵי
  choice: वंशज / वंशजों
  rationale: शाब्दिक अर्थ ‘पुत्र’ है, पर इस वंशावली और प्रधानों की सूची में यह व्यापक वंश-संबंध भी दर्शाता है। ‘वंशज’ सामान्य हिंदी में अभिप्रेत संबंध स्पष्ट करता है।
- source_word: בְּכוֹר
  choice: पहलौठा
  rationale: यह जन्मक्रम और उससे जुड़ी संभावित प्रतिष्ठा दोनों को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: אֵלֶּה
  choice: ये हैं
  rationale: इब्रानी के क्रियारहित परिचयात्मक सूत्र का स्वाभाविक हिंदी रूप।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: हिंदी बाइबल परंपरा में प्रचलित नामरूप।
- source_word: אֱלִיפַז
  choice: एलीपज
  rationale: इब्रानी नाम का हिंदी में पहचान योग्य प्रचलित लिप्यंतरण।
- source_word: תֵּימָן
  choice: तेमान
  rationale: इब्रानी नाम का सीधा और प्रचलित लिप्यंतरण।
- source_word: אוֹמָר
  choice: ओमार
  rationale: इब्रानी नाम का सीधा लिप्यंतरण।
- source_word: צְפוֹ
  choice: सपो
  rationale: मसोरेटी צְפוֹ के व्यंजन और स्वर के निकट हिंदी लिप्यंतरण; नाम की पहचान बनाए रखता है।
- source_word: קְנַז
  choice: कनज
  rationale: इब्रानी नाम का स्रोत-सन्निकट हिंदी लिप्यंतरण।
