source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הַ/מְּלָכִ֔ים אֲשֶׁ֥ר מָלְכ֖וּ בְּ/אֶ֣רֶץ אֱד֑וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/031.yaml
  text: These are the kings who reigned in the land of Edom before a king reigned over the sons of Israel[a].
translation:
  language: hi
  text: ये वे राजा हैं जिन्होंने एदोम देश में इस्राएल के पुत्रों पर किसी राजा के राज्य करने से पहले राज्य किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों पर किसी राजा के राज्य करने से पहले।” इब्रानी में शाब्दिक रूप से, “इस्राएल के पुत्रों के लिए/उन पर किसी राजा के राज्य करने से पहले।”
    reason: मूल जातिनाम और לְ पूर्वसर्ग के सम्भव वैकल्पिक अर्थ को दर्शाना।
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ये वे हैं
  rationale: यह पद एक नई सूची प्रस्तुत करता है। हिन्दी में आरम्भिक וְ को अलग से ‘और’ कहे बिना प्रस्तुतिकरण का भाव स्वाभाविक रूप से व्यक्त हो जाता है।
- source_word: הַמְּלָכִים אֲשֶׁר מָלְכוּ
  choice: वे राजा हैं जिन्होंने ... राज्य किया
  rationale: निश्चित उपपद और सम्बन्धवाचक उपवाक्य दोनों सुरक्षित रहते हैं; ‘राज्य किया’ आधुनिक हिन्दी में राजकीय शासन के लिए स्पष्ट और स्वाभाविक है।
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: एदोम देश में
  rationale: मूल पाठ के ‘एदोम की भूमि/देश’ के प्रादेशिक भाव को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לִפְנֵי
  choice: उस समय से पहले
  rationale: यहाँ कालगत पूर्वता स्पष्ट है; यह रूप अगले उपवाक्य से सहज सम्बन्ध बनाता है।
- source_word: מְלָךְ מֶלֶךְ
  choice: कोई राजा राज्य करता था
  rationale: एकवचन ‘राजा’ का सामान्य/अनिश्चित भाव हिन्दी में ‘कोई राजा’ से स्वाभाविक रूप से व्यक्त होता है और कथन को किसी विशेष राजा तक सीमित नहीं करता।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों पर
  rationale: ‘इस्राएल के पुत्र’ मूल जातिनाम की संरचना को सुरक्षित रखता है; शासन के सम्बन्ध में לְ को मुख्य पाठ में ‘पर’ से व्यक्त किया गया है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का रूप
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: मूल का शाब्दिक जातिनाम सुरक्षित रखा गया है, जबकि अधिक सहज जातिवाचक विकल्प को पादटिप्पणी में बताया गया है।
- issue: לִבְנֵי में לְ का सम्बन्ध
  choice: इस्राएल के पुत्रों पर
  alternative: इस्राएल के पुत्रों के लिए
  rationale: राजा के राज्य करने के सन्दर्भ में ‘पर’ शासन-सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है, पर मूल पूर्वसर्ग ‘के लिए’ की सम्भावना भी रखता है; इसलिए अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वंशावली-सूची की औपचारिक शैली बनी रहती है; ‘राज्य किया/करता था’ की पुनरावृत्ति मूल के מלך ... מלך को प्रतिबिम्बित करती है।
