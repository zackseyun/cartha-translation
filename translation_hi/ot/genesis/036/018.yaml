  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
translation:
  language: hi
  text: 'और एसाव की पत्नी ओहोलीबामा के पुत्र ये थे: प्रधान[a] यऊश, प्रधान यालाम और प्रधान कोरह। ये अना की बेटी और एसाव की पत्नी ओहोलीबामा के प्रधान थे।'
  philosophy: optimal-equivalence
