base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/024.yaml
  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
translation:
  language: hi
  text: 'सिबोन के पुत्र ये हैं: अय्या और अना। यह वही अना है, जिसने निर्जन प्रदेश में अपने पिता सिबोन के गधों को चराते समय यमीम[a] पाए थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द ‘यमीम’ का अर्थ अनिश्चित है। इसे ‘गरम पानी के सोते’ समझा गया है; कुछ प्राचीन और बाद की व्याख्याओं में इसका अर्थ ‘खच्चर’ माना गया है। शब्द-संबंधी प्रमाण निर्णायक न होने के कारण मुख्य पाठ में हिब्रू शब्द का लिप्यंतरण रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי צִבְעוֹן
  choice: सिबोन के पुत्र
  rationale: वंशावली के इस संदर्भ में בְנֵי सीधे पुरुष संतानों को दर्शाता है; इसलिए आधुनिक हिन्दी में ‘पुत्र’ सटीक और स्वाभाविक है। צִבְעוֹן को उसके हिब्रू उच्चारण के निकट ‘सिबोन’ लिप्यंतरित किया गया है।
- source_word: אַיָּה וַעֲנָה
  choice: अय्या और अना
  rationale: दोनों व्यक्तिगत नामों को हिब्रू रूपों के निकट देवनागरी में लिप्यंतरित किया गया है और वंशावली में नामों की संगति रखी गई है।
- source_word: הוּא עֲנָה
  choice: यह वही अना है
  rationale: सर्वनाम और नाम का यह संयोजन इस अना की विशिष्ट पहचान कराता है; ‘यह वही अना है’ हिन्दी में इस पहचानसूचक बल को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מָצָא
  choice: पाए थे
  rationale: מָצָא का सामान्य अर्थ ‘पाना/ढूँढ़ निकालना’ है। बहुवचन-सदृश लिप्यंतरित पद ‘यमीम’ के साथ ‘पाए थे’ सहज है और मूल कथन से अधिक विशिष्ट अर्थ नहीं जोड़ता।
- source_word: הַיֵּמִם
  choice: यमीम
  rationale: यह अत्यंत दुर्लभ और अर्थ की दृष्टि से अनिश्चित हिब्रू शब्द है। मुख्य पाठ में किसी विवादित अर्थ को निश्चित करने के बजाय उसका लिप्यंतरण रखा गया है और प्रमुख व्याख्याएँ पाद-टिप्पणी में दी गई हैं।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר ऐसे निर्जन या कम आबादी वाले चराई-क्षेत्र को भी दर्शा सकता है जो अनिवार्यतः रेतीला रेगिस्तान नहीं होता; ‘निर्जन प्रदेश’ हिन्दी में इस व्यापक अर्थ को सुरक्षित रखता है।
- source_word: בִּרְעֹתוֹ אֶת הַחֲמֹרִים
  choice: गधों को चराते समय
  rationale: पूर्वसर्ग सहित infinitive construct समकालिक क्रिया बताता है। पशुओं के संदर्भ में ‘चराते समय’ आधुनिक हिन्दी का स्वाभाविक रूप है।
- source_word: לְצִבְעוֹן אָבִיו
  choice: अपने पिता सिबोन के
  rationale: इस वाक्यांश से गधों का सिबोन से संबंध और सिबोन का अना का पिता होना प्रकट होता है। हिन्दी में स्वाभाविक संबंध-विन्यास के लिए इसे ‘अपने पिता सिबोन के गधों’ के रूप में रखा गया है।
