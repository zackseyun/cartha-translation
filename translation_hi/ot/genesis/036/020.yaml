  yaml_path: translation/ot/genesis/036/020.yaml
  text: 'These are the sons of Seir the Horite[a], the inhabitants of the land: Lotan, Shobal, Zibeon, and Anah.'
translation:
  language: hi
  text: 'ये उस देश के निवासी[a] होरी सेईर के पुत्र हैं: लोतान, शोबाल, सिबोन और अना।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उस देश में रहते थे।”
    reason: ‘निवासी’ के स्थान पर इब्रानी कृदंत का अधिक शाब्दिक अनुवाद।
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये हैं
  rationale: वंशावली की सूची प्रस्तुत करने वाली इब्रानी अभिव्यक्ति को स्वाभाविक हिन्दी में रखा गया है।
- source_word: בְנֵי
  choice: पुत्र
  rationale: निकट संदर्भ में पुरुष नामों की सूची है; इसलिए औपचारिक वंशावली शब्दावली सुरक्षित रखी गई है।
- source_word: שֵׂעִיר
  choice: सेईर
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: הַחֹרִי
  choice: होरी
  rationale: सेईर की जातीय पहचान बताने वाले पद को पारंपरिक और संक्षिप्त रूप में लिप्यंतरित किया गया है।
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: उस देश के निवासी
  rationale: बहुवचन कृदंत-रचना स्थायी रूप से उस भूभाग में बसे लोगों को दर्शाती है; ‘उस देश’ संदर्भगत निश्चितता को व्यक्त करता है।
- source_word: לוֹטָן
  choice: लोतान
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण।
- source_word: שׁוֹבָל
  choice: शोबाल
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण।
- source_word: צִבְעוֹן
  choice: सिबोन
  rationale: इब्रानी צִבְעוֹן का उच्चारण-सन्निकट देवनागरी लिप्यंतरण।
- source_word: עֲנָה
  choice: अना
  rationale: इब्रानी नाम का उच्चारण-सन्निकट देवनागरी लिप्यंतरण।
