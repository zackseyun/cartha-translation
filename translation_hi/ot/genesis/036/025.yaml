  yaml_path: translation/ot/genesis/036/025.yaml
  text: 'And these were the sons of Anah: Dishon and Oholibamah daughter of Anah.'
translation:
  language: hi
  text: 'और अना के पुत्र ये थे: दीशोन और अना की बेटी ओहोलीबामा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי
  choice: पुत्र
  rationale: वंशावली के सूत्र में शब्द का सामान्य अर्थ ‘पुत्र’ है; यद्यपि इसके बाद एक स्त्री का नाम आता है, पाठ की असंगति को ‘संतान’ कहकर चुपचाप समतल नहीं किया गया।
- source_word: דִּשֹׁן
  choice: दीशोन
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: אָהֳלִיבָמָה
  choice: ओहोलीबामा
  rationale: इब्रानी नाम का सहज और निकट देवनागरी लिप्यंतरण।
- source_word: בַּת עֲנָה
  choice: अना की बेटी
  rationale: इब्रानी संबंध-सूचक पद का सीधा और स्वाभाविक हिन्दी अनुवाद।
theological_decisions:
- issue: ‘अना के पुत्र’ के बाद ओहोलीबामा को ‘अना की बेटी’ कहना
  choice: मूल पाठ की दोनों अभिव्यक्तियाँ यथावत रखी गईं
  alternative: ‘अना की संतान’
  rationale: इब्रानी में בְנֵי स्पष्ट रूप से ‘पुत्र’ है, जबकि ओहोलीबामा को आगे ‘बेटी’ कहा गया है। इस वंशावलीगत तनाव को अनुवाद में मिटाना उचित नहीं।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी; वंशावली की संक्षिप्त शैली तथा मूल इब्रानी की असंगति दोनों सुरक्षित रखी गई हैं।
