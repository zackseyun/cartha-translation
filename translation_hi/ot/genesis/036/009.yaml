  yaml_path: translation/ot/genesis/036/009.yaml
  text: And these are the generations of Esau[a], the father of Edom, in the hill country of Seir.
translation:
  language: hi
  text: और ये एदोम के पिता, सेईर के पहाड़ी प्रदेश में रहनेवाले एसाव की वंशावली हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेईर पर्वत पर” अथवा “सेईर के पहाड़ों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: और ये ... हैं
  rationale: संयोजक וְ को ‘और’ से रखते हुए उत्पत्ति की सूत्रात्मक भूमिका का कथात्मक संबंध सुरक्षित किया गया है।
- source_word: תֹּלְדוֹת
  choice: वंशावली के विवरण
  rationale: यह उत्पत्ति की आवर्ती संरचनात्मक संज्ञा है, जो वंश और उससे जुड़े वृत्तांत—दोनों की ओर संकेत कर सकती है; ‘वंशावली के विवरण’ आधुनिक हिन्दी में इस व्यापकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: אֲבִי אֱדוֹם
  choice: एदोम का मूलपुरुष
  rationale: शाब्दिक अर्थ ‘एदोम का पिता’ है, पर यहाँ एदोम जाति के पूर्वज का भाव है; ‘मूलपुरुष’ इस वंशगत आशय को स्पष्ट और स्वाभाविक बनाता है।
- source_word: בְּ/הַר שֵׂעִיר
  choice: सेईर के पहाड़ी प्रदेश में
  rationale: הַר इस भौगोलिक प्रयोग में किसी एक चोटी के बजाय पर्वतीय या पहाड़ी क्षेत्र को सूचित कर सकता है; ‘पहाड़ी प्रदेश’ हिन्दी में उस क्षेत्रीय अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: אֲבִי אֱדוֹם में ‘पिता’ का वंशगत अर्थ
  choice: एदोम का मूलपुरुष
  alternative: एदोम का पिता
  rationale: संदर्भ में एदोम से अभिप्राय एसाव से निकली जाति/देश है; इसलिए ‘मूलपुरुष’ जैविक पिता की संभावित गलत समझ से बचाते हुए पूर्वजत्व व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल पद में अंतिम स्थानवाचक वाक्यांश संक्षिप्त है; हिन्दी में अर्थ की स्वाभाविकता हेतु ‘रहता था’ जोड़ा गया है, जबकि उसके वैकल्पिक भौगोलिक अर्थ पादटिप्पणी में सुरक्षित हैं।
