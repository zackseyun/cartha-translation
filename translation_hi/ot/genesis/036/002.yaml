source:
  edition: WLC
  text: עֵשָׂ֛ו לָקַ֥ח אֶת נָשָׁ֖י/ו מִ/בְּנ֣וֹת כְּנָ֑עַן אֶת עָדָ֗ה בַּת אֵילוֹן֙ הַֽ/חִתִּ֔י וְ/אֶת אָהֳלִֽיבָמָה֙ בַּת עֲנָ֔ה בַּת צִבְע֖וֹן הַֽ/חִוִּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/002.yaml
  text: 'Esau took his wives from the daughters of Canaan: Adah daughter of Elon the Hittite[a], and Oholibamah daughter of Anah, daughter of Zibeon the Hivite.'
translation:
  language: hi
  text: 'एसाव ने कनान की बेटियों में से अपनी पत्नियाँ लीं: हित्ती एलोन की बेटी आदा, और अना की बेटी, हिव्वी[a] सिबोन की बेटी ओहोलीबामा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ: “हिव्वी।” कुछ व्याख्याकार संबंधित वंशावलियों के साथ सामंजस्य बैठाने के लिए इस वंशीय पहचान को अलग रूप में समझते हैं; इसमें “होरी” पहचान भी शामिल है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח
  choice: लीं
  rationale: मूल क्रिया का अर्थ ‘लेना’ है। यहाँ ‘अपनी पत्नियाँ लीं’ इब्रानी अभिव्यक्ति को बनाए रखता है और प्रसंग में विवाह का अर्थ स्वाभाविक रूप से स्पष्ट करता है।
- source_word: נָשָׁיו
  choice: अपनी पत्नियाँ
  rationale: इस वंशावली-संबंधी प्रसंग में बहुवचन संज्ञा का अर्थ स्पष्ट रूप से ‘पत्नियाँ’ है; संबंधसूचक प्रत्यय को ‘अपनी’ से व्यक्त किया गया है।
- source_word: מִבְּנוֹת כְּנָעַן
  choice: कनान की बेटियों में से
  rationale: यह अनुवाद इब्रानी मुहावरे ‘कनान की बेटियाँ’ को बनाए रखते हुए स्रोत या समुदाय से चुनाव का भाव स्पष्ट करता है।
- source_word: בַּת עֲנָה בַּת צִבְעוֹן
  choice: अना की बेटी तथा ... सिबोन की पोती
  rationale: शाब्दिक रूप से ‘अना की बेटी, सिबोन की बेटी’ है। आधुनिक हिन्दी में वंश-संबंध को स्वाभाविक और स्पष्ट बनाने के लिए दूसरे ‘बेटी’ को ‘पोती’ कहा गया है, बिना वंशावली बदले।
- source_word: הַחִתִּי
  choice: हित्ती
  rationale: यह חִתִּי के लिए हिन्दी में प्रचलित जातिनाम है।
- source_word: אָהֳלִיבָמָה
  choice: ओहोलीबामा
  rationale: नाम के इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: הַחִוִּי
  choice: हिव्वी
  rationale: मसोरेटिक पाठ में यही जातिनाम है; हिन्दी बाइबलीय परंपरा का परिचित रूप अपनाया गया है।
theological_decisions:
- issue: अंतिम वाक्यांश में वंशीय/जातीय पहचान
  choice: मसोरेटिक पाठ के अनुसार ‘हिव्वी’
  alternative: संबंधित वंशावलियों से सामंजस्य बैठाकर ‘होरी’ समझना
  rationale: मुख्य पाठ उपलब्ध इब्रानी पाठ का अनुसरण करता है। संबंधित वंशावलियों से उत्पन्न तनाव को चुपचाप सुलझाने के बजाय पादटिप्पणी में वैकल्पिक समझ दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कनान की बेटियों’ और ‘अपनी पत्नियाँ लीं’ जैसे स्रोत-पाठ के मुहावरों को यथासंभव सुरक्षित रखा गया है; वंश-संबंध में ‘पोती’ हिन्दी की स्वाभाविक स्पष्टता के लिए प्रयुक्त है।
