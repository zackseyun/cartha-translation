    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: बस गया
  rationale: ישׁב का यह कथात्मक रूप यहाँ किसी क्षेत्र में निवास स्थापित करने का भाव देता है। ‘बस गया’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग के अनुरूप स्थायी निवास का संकेत देता है।
- source_word: בְּהַר
  choice: के पहाड़ी प्रदेश में
  rationale: הַר एक पहाड़ के साथ-साथ पर्वतीय या पहाड़ी क्षेत्र को भी सूचित कर सकता है। सेईर यहाँ भौगोलिक क्षेत्र है, इसलिए यह अनुवाद किसी एक पर्वत-शिखर का अनावश्यक संकेत नहीं देता।
- source_word: שֵׂעִיר
  choice: सेईर
  rationale: स्थानवाचक नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: הוּא אֱדוֹם
  choice: एसाव ही एदोम है
  rationale: मूल का क्रियारहित वाक्य एसाव और एदोम की सीधी पहचान कराता है। ‘ही’ पहचान पर स्वाभाविक हिन्दी बल देता है, बिना इसे व्याख्यात्मक ‘अर्थात्’ में बदलने के।
