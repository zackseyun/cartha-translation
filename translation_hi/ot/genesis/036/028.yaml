  rationale: यह बहुवचन संकेतवाचक शब्द वंशावली की सूची प्रस्तुत करता है। इब्रानी में क्रिया नहीं है; स्वाभाविक हिन्दी में भूतकालीन वंशावली के संदर्भ के अनुसार ‘ये थे’ उपयुक्त है।
- source_word: בְנֵי
  choice: के पुत्र
  rationale: वंशावली के इस संदर्भ में इसके बाद दो पुरुष नाम आते हैं, इसलिए ‘पुत्र’ सबसे स्पष्ट और विशिष्ट अनुवाद है।
- source_word: דִישָׁן
  choice: दीशान
  rationale: व्यक्तिवाचक नाम का अर्थानुवाद न करके हिन्दी ध्वन्यात्मक रूप दिया गया है।
- source_word: עוּץ
  choice: ऊस
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा में पहचाना जाने वाला ध्वन्यात्मक रूप चुना गया है।
- source_word: וַאֲרָן
  choice: और अरान
  rationale: उपसर्ग ו को ‘और’ से तथा अֲרָן को व्यक्तिवाचक नाम ‘अरान’ से व्यक्त किया गया है।
