base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/007.yaml
  text: For their possessions were too great for them to dwell together[b][a], and the land of their sojourning could not support them because of their livestock.
translation:
  language: hi
  text: क्योंकि उनकी सम्पत्ति इतनी अधिक थी कि वे एक साथ नहीं रह सकते थे, और उनके परदेशी निवास की भूमि[a] उनके पशुधन के कारण उनका भार नहीं उठा सकती थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ‘वह भूमि जहाँ वे परदेशी होकर रह रहे थे’; इब्रानी में अस्थायी, निवासी-परदेशी के रूप में रहने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वह भूमि उनकी आवश्यकताओं को पूरा करने में सक्षम नहीं थी; इब्रानी में शाब्दिक रूप से ‘उन्हें उठा नहीं सकती थी।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन में एसाव के अलग हो जाने का कारण बताता है; हिन्दी में ‘क्योंकि’ इसका व्याख्यात्मक-कारणात्मक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: רְכוּשָׁם
  choice: उनकी सम्पत्ति
  rationale: यह चल सम्पत्ति और संचित माल का व्यापक बोध देता है; प्रसंग में पशुधन भी इसी समृद्धि का मुख्य भाग है।
- source_word: רָב מִשֶּׁבֶת יַחְדָּו
  choice: इतनी अधिक थी कि वे एक साथ नहीं रह सकते थे
  rationale: מִן के साथ infinitive यहाँ इतनी अधिकता व्यक्त करता है कि साथ रहना व्यावहारिक रूप से असम्भव था; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אֶרֶץ מְגֻרֵיהֶם
  choice: उनके परदेशी निवास की भूमि
  rationale: ‘परदेशी निवास’ अस्थायी रूप से निवासी-परदेशी बनकर रहने के भाव को बनाए रखता है, केवल सामान्य ठहरने तक इसे सीमित नहीं करता।
- source_word: לָשֵׂאת אֹתָם
  choice: उनका भार नहीं उठा सकती थी
  rationale: נשא के मूल रूपक ‘उठाना/वहन करना’ को सुरक्षित रखता है और भूमि की वहन-क्षमता का अर्थ प्रसंग से स्पष्ट रहता है।
- source_word: מִפְּנֵי מִקְנֵיהֶם
  choice: उनके पशुधन के कारण
  rationale: מִפְּנֵי कारण सूचित करता है और מִקְנֶה व्यापक रूप से पाले गए पशुओं को दर्शाता है, केवल गाय-बैलों को नहीं।
