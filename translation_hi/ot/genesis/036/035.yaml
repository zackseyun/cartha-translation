base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/035.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab[b]; and the name of his city was Avith.
translation:
  language: hi
  text: और हूशाम मर गया। उसके स्थान पर बदद का पुत्र हदद राजा बना, जिसने मोआब के मैदान[a] में मिद्यान को मारा[b]। उसके नगर का नाम अवीत था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मोआब का मैदान’ का अर्थ अधिक व्यापक रूप से ‘मोआब का देश’ या ‘मोआब का प्रदेश’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मिद्यान को पराजित किया।’ हिब्रू कृदन्त का शाब्दिक अर्थ है ‘मिद्यान को मारनेवाला।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת חֻשָׁם
  choice: हूशाम मर गया
  rationale: מות का सीधा अर्थ मरना है; यह सहज और स्पष्ट हिन्दी है तथा मूल में न होने वाला कोई शिष्टोक्ति-भाव नहीं जोड़ती।
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: उसके स्थान पर ... राज्य करने लगा
  rationale: מלך राज करने को और תחתיו उत्तराधिकार में उसका स्थान लेने को व्यक्त करता है। यह रूप दोनों बातों को स्वाभाविक हिन्दी में रखता है।
- source_word: הֲדַד בֶּן בְּדַד
  choice: बदद का पुत्र हदद
  rationale: नामों का देवनागरी लिप्यंतरण किया गया है और בן को वंश-सूचक ‘पुत्र’ से व्यक्त किया गया है।
- source_word: הַמַּכֶּה אֶת מִדְיָן
  choice: जिसने ... मिद्यान को मारा था
  rationale: נכה का हिफ़ील कृदन्त हदद को उसके उल्लेखनीय कार्य से पहचानता है। ‘मारा’ मूल की व्यापकता बनाए रखता है; ‘पराजित किया’ सम्भव है, पर अधिक निश्चित व्याख्या होगी।
- source_word: בִּשְׂדֵה מוֹאָב
  choice: मोआब के मैदान में
  rationale: שׂדה का मूल अर्थ ‘मैदान/खेत’ है और भौगोलिक प्रयोग में ‘प्रदेश’ भी हो सकता है। ‘मैदान’ मूल बिंब को बनाए रखते हुए हिन्दी में बोधगम्य है।
- source_word: וְשֵׁם עִירוֹ עֲוִית
  choice: उसके नगर का नाम अवीत था
  rationale: हिब्रू के नामकरण-वाक्य को सहज, गरिमापूर्ण हिन्दी में प्रस्तुत किया गया है; עֲוִית का लिप्यंतरण ‘अवीत’ किया गया है।
