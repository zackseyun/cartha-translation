  text: Adah bore Eliphaz to Esau, and Basemath bore Reuel.
translation:
  language: hi
  text: आदा ने एसाव से एलीपज़ को जन्म दिया, और बासमत ने रऊएल को जन्म दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד / יָלְדָה
  choice: जन्म दिया
  rationale: दोनों रूप ילד धातु से हैं, जिसका अर्थ ‘जन्म देना’ है। यह आधुनिक हिन्दी में स्वाभाविक है और वंशावली के कथन में मातृ-पक्ष को स्पष्ट रखता है।
- source_word: לְעֵשָׂו
  choice: एसाव के लिए
  rationale: ילד के साथ ל वंशावली-संदर्भ में पिता से संबंध दर्शाता है। ‘एसाव के लिए’ मूल संबंध को बनाए रखता है, यद्यपि हिन्दी में यह प्रयोग कुछ औपचारिक है।
- source_word: אֶת
  choice: अलग से अनूदित नहीं
  rationale: यह निश्चित प्रत्यक्ष कर्म का व्याकरणिक चिह्न है; हिन्दी वाक्य-विन्यास में इसका अलग शब्द आवश्यक नहीं है।
- source_word: אֱלִיפָז
  choice: एलीपज़
  rationale: मसोराई स्वरांकन के निकट रहते हुए व्यक्ति-नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: בָשְׂמַת
  choice: बासमत
  rationale: हिब्रू नाम का सरल और पठनीय देवनागरी लिप्यंतरण।
- source_word: רְעוּאֵל
  choice: रऊएल
  rationale: मसोराई पाठ के व्यंजनों और स्वरों को निकटता से दर्शाने वाला देवनागरी लिप्यंतरण।
- source_word: וּ
  choice: और
  rationale: दो जन्म-वृत्तांतों को जोड़ने वाले साधारण समुच्चयबोधक का सीधा हिन्दी रूप।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली रखी गई है। ‘जन्म दिया’ सामान्य पाठक के लिए स्पष्ट है; नाम मूल हिब्रू के निकट लिप्यंतरित हैं।
