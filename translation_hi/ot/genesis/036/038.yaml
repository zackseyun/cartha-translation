  yaml_path: translation/ot/genesis/036/038.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: hi
  text: और शाऊल मर गया, और उसके स्थान पर अकबोर का पुत्र बाल-हानान राजा हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: מות के काल-क्रमसूचक कथात्मक रूप का सीधा और स्वाभाविक हिन्दी समतुल्य; मूल की स्पष्टता बनाए रखता है।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: राजकीय उत्तराधिकार के इस सूत्र में מלך का अर्थ शासन सँभालना है; आधुनिक हिन्दी में ‘राजा हुआ’ संक्षिप्त और स्वाभाविक है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: उत्तराधिकार के प्रसंग में किसी का पद ग्रहण करने का अर्थ ठीक प्रकार व्यक्त करता है।
- source_word: בַּעַל חָנָן
  choice: बाल-हानान
  rationale: दो घटकों वाले इब्रानी व्यक्तिगत नाम का पठनीय देवनागरी लिप्यंतरण।
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंश-संबंध बताने वाली इब्रानी रचना का स्वाभाविक हिन्दी रूप।
- source_word: עַכְבּוֹר
  choice: अकबोर
  rationale: इब्रानी नाम का सरल, स्रोत-निकट देवनागरी लिप्यंतरण; ख ध्वनि जोड़ने से बचता है।
