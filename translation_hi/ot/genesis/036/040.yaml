  text: וְ֠/אֵלֶּה שְׁמ֞וֹת אַלּוּפֵ֤י עֵשָׂו֙ לְ/מִשְׁפְּחֹתָ֔/ם לִ/מְקֹמֹתָ֖/ם בִּ/שְׁמֹתָ֑/ם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עַֽלְוָ֖ה אַלּ֥וּף יְתֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/040.yaml
  text: 'And these are the names of the chiefs of Esau[a], according to their clans, according to their places, by their names: Chief Timna, Chief Alvah[b], Chief Jetheth.'
translation:
  language: hi
  text: 'और एसाव के प्रधानों के नाम, उनके कुलों के अनुसार, उनके स्थानों के अनुसार, और नामवार ये हैं: प्रधान तिम्ना[a], प्रधान अल्वाह[b], प्रधान यतेत।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तिम्ना’ का लिप्यंतरण ‘तिम्नाह’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘अल्वाह’; 1 इतिहास 1:51 में संबंधित रूप ‘अल्याह’ मिलता है।
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: और ... के नाम ... ये हैं
  rationale: संयोजक ו कथा और सूची के बीच संबंध बनाए रखता है; हिन्दी में स्वाभाविक सूची-परिचय के लिए वाक्य-विन्यास समायोजित किया गया है।
- source_word: אַלּוּפֵי / אַלּוּף
  choice: प्रधान / प्रधान
  rationale: उत्पत्ति 36 में यह एदोमी कुलीय या जनजातीय अगुओं की पदवी है। ‘प्रधान’ आधुनिक, गरिमापूर्ण और ‘ड्यूक’ जैसे काल-विसंगत सामंती पद से मुक्त है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ घरेलू परिवार से व्यापक कुलीय समूह को सूचित करता है।
- source_word: לִמְקֹמֹתָם
  choice: उनके स्थानों के अनुसार
  rationale: מָקוֹם का सीधा अर्थ ‘स्थान’ रखा गया है; ‘बस्तियाँ’ या ‘प्रदेश’ कहकर संदर्भ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: בִּשְׁמֹתָם
  choice: उनके नामों के अनुसार
  rationale: नामवार सूचीबद्ध किए जाने का वर्गीकरणात्मक भाव व्यक्त करता है और मूल की पुनरुक्ति को सुरक्षित रखता है।
- source_word: תִּמְנָע
  choice: तिम्ना
  rationale: इब्रानी रूप का सरल हिन्दी लिप्यंतरण।
- source_word: עַלְוָה
  choice: अल्वा
  rationale: इस पद के मसोरेटिक पाठ עַלְוָה का निकट हिन्दी लिप्यंतरण; 1 इतिहास 1:51 के संबंधित रूप से इसका सामंजस्य नहीं किया गया।
- source_word: יְתֵת
  choice: यतेत
  rationale: इब्रानी יְתֵת का निकट हिन्दी लिप्यंतरण; मिलते-जुलते अन्य नामों से सामंजस्य नहीं किया गया।
