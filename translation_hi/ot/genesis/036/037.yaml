  yaml_path: translation/ot/genesis/036/037.yaml
  text: Then Samlah died[c][b][a], and Shaul from Rehoboth on the River reigned in his place.
translation:
  language: hi
  text: फिर समला मर गया, और उसके स्थान पर नदी के पास स्थित रहोबोत से शाऊल राजा बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: फिर ... मर गया
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘फिर’ स्वाभाविक हिन्दी में घटनाक्रम प्रकट करता है।
- source_word: שַׂמְלָה
  choice: समला
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: וַיִּמְלֹךְ
  choice: राजा बना
  rationale: इस राजकीय उत्तराधिकार-सूत्र में क्रिया नए राजा के शासन सँभालने को बताती है; सामान्य हिन्दी में ‘राजा बना’ स्वाभाविक है।
- source_word: תַּחְתָּיו
  choice: उसकी जगह
  rationale: उत्तराधिकार के प्रसंग में इसका अर्थ पिछले शासक का स्थान लेना है।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: इब्रानी שָׁאוּל का प्रचलित और स्रोत-सन्निकट हिन्दी रूप।
- source_word: מֵרְחֹבוֹת
  choice: रहोबोत का
  rationale: उपसर्ग מִן यहाँ उद्गम अथवा संबद्धता बताता है; हिन्दी में किसी नगर से आए व्यक्ति के लिए ‘का’ स्वाभाविक है।
- source_word: הַנָּהָר
  choice: नदी के किनारे के
  rationale: निश्चित पद ‘नदी’ रहोबोत का भौगोलिक विशेषण है; ‘के किनारे’ बस्ती की स्थिति को सहज हिन्दी में व्यक्त करता है।
