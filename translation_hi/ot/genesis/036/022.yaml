base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/022.yaml
  text: The sons of Lotan were Hori and Hemam[b][a], and Lotan’s sister was Timna.
translation:
  language: hi
  text: लोतान के पुत्र होरी और हेमाम[a] थे, और लोतान की बहन तिम्ना थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘हेमाम’; 1 इतिहास 1:39 की समानांतर सूची में ‘होमाम’ है।
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: थे
  rationale: वंशावली के इस प्रसंग में היה का रूप साधारण संबंधसूचक क्रिया के रूप में प्रयुक्त है; इसलिए हिंदी में बहुवचन ‘थे’ स्वाभाविक और सटीक है।
- source_word: בְנֵי
  choice: पुत्र
  rationale: यहाँ इसके बाद दो पुरुषों के नाम आते हैं, इसलिए व्यापक ‘सन्तान’ की अपेक्षा ‘पुत्र’ अधिक सटीक है।
- source_word: לוֹטָן
  choice: लोतान
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: חֹרִי
  choice: होरी
  rationale: यह व्यक्तिवाचक नाम है, इसलिए इसका अनुवाद न करके लिप्यंतरण किया गया है।
- source_word: הֵימָם
  choice: हेमाम
  rationale: इस पद के मसोराई पाठ और स्वरांकन को सीधे दर्शाने के लिए ‘हेमाम’ रखा गया है; समानांतर वंशावली का ‘होमाम’ पादटिप्पणी में दिया गया है।
- source_word: וַאֲחוֹת
  choice: और ... की बहन
  rationale: אֲחוֹת का अर्थ ‘बहन’ है; हिंदी में स्पष्ट और स्वाभाविक वाक्य बनाने के लिए अंत में ‘थी’ लगाया गया है।
- source_word: תִּמְנָע
  choice: तिम्ना
  rationale: यह व्यक्तिवाचक नाम है; ‘तिम्ना’ हिब्रू रूप का निकट और स्वाभाविक देवनागरी लिप्यंतरण है।
theological_decisions: []
