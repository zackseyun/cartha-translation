  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली रखी गई है। नामों को मूल हिब्रू के निकट देवनागरी में लिखा गया है। ‘तिम्ना’ के लिए अलग पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि अंग्रेज़ी वर्तनी ‘Timnah’ का विकल्प हिंदी पाठ में वास्तविक पाठांतर या अर्थगत अस्पष्टता उत्पन्न नहीं करता।
