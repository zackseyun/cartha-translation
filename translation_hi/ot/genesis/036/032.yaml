lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: राजाओं की इस सूची में क्रिया מלך राजपद ग्रहण करने और राजा के रूप में शासन करने को सूचित करती है। आधुनिक हिन्दी में उत्तराधिकार-सूचना के लिए ‘राजा हुआ’ स्वाभाविक और सटीक है।
- source_word: בֶּאֱדוֹם
  choice: एदोम में
  rationale: उपसर्ग בְּ का सीधा स्थानवाचक अर्थ ‘में’ है। सन्दर्भ में ‘एदोम पर’ भी सम्भव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
- source_word: בֶּלַע
  choice: बेला
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी लिप्यंतरण।
- source_word: בֶּן בְּעוֹר
  choice: बओर का पुत्र
  rationale: इब्रानी वंश-सूचक रचना का स्पष्ट और औपचारिक हिन्दी रूप।
- source_word: וְשֵׁם עִירוֹ
  choice: और उसके नगर का नाम
  rationale: तीसरे पुरुष एकवचन सम्बन्धवाचक प्रत्यय को ‘उसके’ से स्पष्ट रूप में सुरक्षित रखा गया है।
- source_word: דִּנְהָבָה
  choice: दिन्हाबा
  rationale: स्थानवाचक नाम का स्रोत-पाठ के अनुरूप हिन्दी लिप्यंतरण।
