lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: मूत क्रिया का वय्यिक्तोल रूप घटनाक्रम की अगली घटना बताता है; राजाओं की उत्तराधिकार-सूची में ‘मर गया’ स्वाभाविक और स्पष्ट है।
- source_word: הֲדָד
  choice: हदद
  rationale: व्यक्तिनाम को उसके इब्रानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיִּמְלֹךְ
  choice: ने राज किया
  rationale: מלך यहाँ राजकीय शासन और उत्तराधिकार को व्यक्त करता है; ‘राज किया’ संक्षिप्त, सहज और सूची की शैली के अनुकूल है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह पद किसी के स्थान पर उत्तराधिकारी बनने का भाव देता है; केवल ‘उसके बाद’ कहने की अपेक्षा प्रतिस्थापन का अर्थ बेहतर सुरक्षित रहता है।
- source_word: שַׂמְלָה
  choice: समला
  rationale: व्यक्तिनाम को अनूदित करने के बजाय इब्रानी उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: מִמַּשְׂרֵקָה
  choice: मसरेका निवासी
  rationale: उपसर्ग מִן यहाँ स्थान से उत्पत्ति या उसके साथ संबंध बता सकता है। ‘मसरेका निवासी’ सामान्य पाठक के लिए स्वाभाविक रूप से स्थान-संबंध व्यक्त करता है, जबकि वैकल्पिक व्यापक संबंध पादटिप्पणी में रखा गया है।
