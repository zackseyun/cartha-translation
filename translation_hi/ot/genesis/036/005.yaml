  yaml_path: translation/ot/genesis/036/005.yaml
  text: And Oholibamah bore Jeush, Jalam, and Korah. These are the sons of Esau who were born to him in the land of Canaan.
translation:
  language: hi
  text: और ओहोलीबामा ने यऊश, यालाम और कोरह को जन्म दिया। ये एसाव के पुत्र हैं, जो कनान देश में उसके यहाँ जन्मे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהֳלִיבָמָה
  choice: ओहोलीबामा
  rationale: इब्रानी व्यक्तिनाम का ध्वन्यात्मक लिप्यंतरण; आरंभिक स्वर और व्यंजन-क्रम को यथासंभव सुरक्षित रखा गया है।
- source_word: יָלְדָה
  choice: जन्म दिया
  rationale: स्त्रीलिंग कर्ता और वंशावली-संदर्भ को स्पष्ट रखते हुए यह आधुनिक हिंदी में स्वाभाविक अभिव्यक्ति है।
- source_word: יעיש
  choice: यऊश
  rationale: इब्रानी व्यक्तिनाम का निकट ध्वन्यात्मक लिप्यंतरण।
- source_word: יַעְלָם
  choice: यालाम
  rationale: इब्रानी व्यक्तिनाम का निकट और हिंदी-पाठक के लिए पठनीय लिप्यंतरण।
- source_word: קֹרַח
  choice: कोरह
  rationale: इब्रानी व्यक्तिनाम का प्रचलित ध्वन्यात्मक लिप्यंतरण।
- source_word: בְּנֵי
  choice: पुत्र
  rationale: यहाँ सूचीबद्ध संतानें पुरुष हैं; इसलिए लिंग-विशिष्ट अर्थ बनाए रखा गया है।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: इब्रानी व्यक्तिनाम का हिंदी में प्रचलित लिप्यंतरण।
- source_word: אֲשֶׁר יֻלְּדוּ לוֹ
  choice: जो उसके यहाँ जन्मे थे
  rationale: इब्रानी निष्क्रिय बहुवचन और לוֹ के संबंधसूचक भाव को स्वाभाविक हिंदी में व्यक्त करता है, बिना माता को इस उपवाक्य में दोबारा स्पष्ट रूप से जोड़ने के।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: אֶרֶץ को 'देश' के रूप में स्पष्ट रखते हुए सहज हिंदी शब्दक्रम अपनाया गया है।
