  terminology: ‘पुत्र’ is appropriate for בְּנֵי in this immediate male genealogical list. ‘दीशान,’ ‘हेमदान,’ ‘यित्रान,’ and ‘करान’ are suitable Hebrew-oriented Hindi transliterations. No theological terminology is involved.
