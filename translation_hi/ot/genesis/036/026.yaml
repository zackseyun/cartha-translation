  text: וְ/אֵ֖לֶּה בְּנֵ֣י דִישָׁ֑ן חֶמְדָּ֥ן וְ/אֶשְׁבָּ֖ן וְ/יִתְרָ֥ן וּ/כְרָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/026.yaml
  text: 'And these were the sons of Dishan: Hemdan[a], Eshban, Ithran, and Keran.'
translation:
  language: hi
  text: 'और ये दीशान के पुत्र थे: हेमदान, एश्बान, यित्रान और करान।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ... ये थे
  rationale: संयोजक और संकेतवाचक शब्द वंशावली की अगली सूची आरम्भ करते हैं। इब्रानी वाक्य में क्रिया नहीं है; हिन्दी में बीते हुए वंश-विवरण के अनुरूप ‘थे’ जोड़ना स्वाभाविक है।
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह रचना-रूप शाब्दिक रूप से ‘के पुत्र’ है और यहाँ तत्काल नामित पुरुष संतानों की सूची दी गई है।
- source_word: דִישָׁן
  choice: दीशान
  rationale: व्यक्तिनाम को इब्रानी स्वरांकन के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: חֶמְדָּן
  choice: हेमदान
  rationale: मसोरेटिक पाठ के व्यंजन और स्वरांकन के आधार पर व्यक्तिनाम का निकट लिप्यंतरण।
- source_word: וְאֶשְׁבָּן
  choice: एशबान
  rationale: व्यक्तिनाम का प्रत्यक्ष देवनागरी लिप्यंतरण; उपसर्गीय संयोजक को हिन्दी सूची की विराम-रचना में व्यक्त किया गया है।
- source_word: וְיִתְרָן
  choice: यित्रान
  rationale: इब्रानी יתרן का निकट देवनागरी लिप्यंतरण, जिसमें आरम्भिक योध को ‘य’ से दर्शाया गया है।
- source_word: וּכְרָן
  choice: और करान
  rationale: अन्तिम नाम से पहले संयोजक को ‘और’ से स्पष्ट किया गया है; כ को यहाँ ‘क’ से लिप्यंतरित करना इब्रानी व्यंजन के निकट है।
theological_decisions: []
translation_notes:
  register: सरल, गरिमापूर्ण आधुनिक हिन्दी; वंशावली की संक्षिप्त सूची-शैली बनाए रखी गई है। व्यक्तिनाम मूल इब्रानी पाठ के निकट देवनागरी में दिए गए हैं। अंग्रेज़ी में Keran/Cheran की वर्तनी से जुड़ी टिप्पणी हिन्दी लिप्यंतरण के लिए प्रासंगिक नहीं है, इसलिए पाद-टिप्पणी नहीं रखी गई।
