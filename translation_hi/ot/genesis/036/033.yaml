  yaml_path: translation/ot/genesis/036/033.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: hi
  text: बेला मर गया, और जेरह का पुत्र योबाब, जो बोस्रा से था[a], उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो बोस्रा का था।” इब्रानी उपसर्ग मूल स्थान अथवा नगर से संबद्धता, दोनों व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: मूּת का वय्यिक्तोल रूप कथा में अगली घटना बताता है; स्पष्टता के लिए कर्ता ‘बेला’ नाम से व्यक्त किया गया है।
- source_word: בָּלַע
  choice: बेला
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित और सहज देवनागरी लिप्यंतरण।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: राजकीय उत्तराधिकार के इस सूत्र में מלך किसी के स्थान पर राजपद ग्रहण करने और शासन करने को व्यक्त करता है; ‘राजा हुआ’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: תחת और सर्वनामिक प्रत्यय पिछले शासक के स्थान पर उत्तराधिकार को सूचित करते हैं।
- source_word: יוֹבָב
  choice: योबाब
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: בֶּן זֶרַח
  choice: जेरह का पुत्र
  rationale: वंशपरिचय देने वाली इब्रानी संबंध-रचना का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: מִבָּצְרָה
  choice: जो बोस्रा से था
  rationale: מִן उपसर्ग सामान्यतः मूल स्थान बताता है; संबंधवाचक उपवाक्य हिन्दी में इसे स्पष्ट रूप से योबाब से जोड़ता है, जबकि पादटिप्पणी नगर से सामान्य संबद्धता का वैकल्पिक अर्थ सुरक्षित रखती है।
