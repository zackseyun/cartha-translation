source:
  edition: WLC
  text: וְ/תִמְנַ֣ע הָיְתָ֣ה פִילֶ֗גֶשׁ לֶֽ/אֱלִיפַז֙ בֶּן עֵשָׂ֔ו וַ/תֵּ֥לֶד לֶ/אֱלִיפַ֖ז אֶת עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/012.yaml
  text: Timna was a concubine of Eliphaz[a], Esau’s son, and she bore Amalek to Eliphaz. These are the sons of Adah[b], Esau’s wife.
translation:
  language: hi
  text: और तिम्ना एसाव के पुत्र एलीपज की उपपत्नी थी। उसने एलीपज से अमालेक को जन्म दिया। ये एसाव की पत्नी आदा के पुत्र[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘पुत्र’। वंशावलियों में यह शब्द व्यापक अर्थ में पौत्रों या अन्य वंशजों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתִמְנַע
  choice: और तिम्ना
  rationale: व्यक्तिनाम को हिन्दी में प्रचलित रूप से लिप्यंतरित किया गया है और आरम्भिक संयोजक וְ को ‘और’ से व्यक्त किया गया है।
- source_word: פִילֶגֶשׁ
  choice: उपपत्नी
  rationale: यह शब्द मान्य किन्तु पत्नी से अधीन वैवाहिक/यौन संबंध में रहने वाली स्त्री को सूचित करता है; ‘उपपत्नी’ सामाजिक भेद को संक्षेप और गरिमा के साथ बनाए रखता है।
- source_word: לֶאֱלִיפַז בֶּן עֵשָׂו
  choice: एसाव के पुत्र एलीपज की
  rationale: सम्बन्धसूचक לְ और रचनात्मक पदबंध को स्वाभाविक हिन्दी सम्बन्धकारक संरचना में व्यक्त किया गया है।
- source_word: וַתֵּלֶד לֶאֱלִיפַז אֶת עֲמָלֵק
  choice: उसने एलीपज के लिए अमालेक को जन्म दिया
  rationale: ילד को ‘जन्म दिया’ और पिता को चिह्नित करने वाले לְ को ‘के लिए’ से व्यक्त किया गया है, जिससे इब्रानी वंशावली-संबंधी संरचना का भाव बना रहता है।
- source_word: אֵלֶּה בְּנֵי עָדָה
  choice: ये आदा के पुत्र थे
  rationale: בְּנֵי का मूल अर्थ ‘पुत्र’ रखा गया है; प्रसंग में इसका व्यापक अर्थ वंशज अथवा पौत्र हो सकता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אֵשֶׁת עֵשָׂו
  choice: एसाव की पत्नी
  rationale: इब्रानी रचनात्मक पदबंध का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: בְּנֵי का वंशावली-संबंधी विस्तार
  choice: मुख्य पाठ में ‘पुत्र’
  alternative: ‘पौत्र’ या ‘वंशज’
  rationale: इब्रानी पाठ सीधे ‘पुत्र’ कहता है, जबकि निकटवर्ती वंशावली के अनुसार ये आदा के पौत्र हैं। मुख्य पाठ स्रोत की शब्दावली बनाए रखता है और पादटिप्पणी उसके व्यापक वंशावलीगत प्रयोग को बताती है, जिससे तनाव को चुपचाप हल नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और वंशावली के अनुरूप संक्षिप्त रखी गई है। ‘उपपत्नी’ सामाजिक-वैधानिक भेद को बनाए रखता है; ‘पुत्र’ के व्यापक इब्रानी प्रयोग को पादटिप्पणी में समझाया गया है।
