base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/001.yaml
  text: These are the generations of Esau (that is[a], Edom).
translation:
  language: hi
  text: और एसाव की वंशावली यह है—वह एदोम है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और ये एसाव की वंशावलियाँ हैं; वह एदोम है।”
    reason: इब्रानी वाक्य-रचना और आरंभिक संयोजक के अधिक निकट वैकल्पिक रूप।
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ... यह है
  rationale: वाव के संयोजक बल को ‘और’ से रखा गया है; ‘यह है’ सूत्रात्मक शीर्षक को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תֹּלְדוֹת
  choice: वंशावली
  rationale: यह उत्पत्ति में बार-बार आने वाला संरचनात्मक शब्द है। ‘वंशावली’ वंश और उससे जुड़े विवरण—दोनों की गुंजाइश रखते हुए इस पद के परिचयात्मक कार्य को संक्षेप में व्यक्त करता है।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: הוּא
  choice: वही ... है
  rationale: इब्रानी सर्वनाम की स्पष्ट पहचानसूचक शक्ति को बनाए रखता है और उसे केवल कोष्ठकीय व्याख्या में नहीं बदलता।
- source_word: אֱדוֹם
  choice: एदोम
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण; यहाँ यह एसाव की एदोम के साथ पहचान बताता है।
theological_decisions:
- issue: उत्पत्ति के सूत्रात्मक शीर्षक תֹּלְדוֹת का अर्थ-क्षेत्र
  choice: वंशावली
  alternative: वृत्तांत; वंशज
  rationale: ‘वृत्तांत’ इसे केवल कथा की ओर और ‘वंशज’ केवल जैविक संतानों की ओर सीमित कर सकता है। ‘वंशावली’ यहाँ साहित्यिक सूत्र और वंश-संबंधी विषय दोनों को बनाए रखती है।
- issue: הוּא אֱדוֹם में पहचान का स्वरूप
  choice: वही एदोम है
  alternative: अर्थात् एदोम
  rationale: शाब्दिक पहचान-वाक्य को मुख्य पाठ में रखा गया है, क्योंकि इब्रानी का ‘वह एदोम है’ केवल संपादकीय कोष्ठकीय स्पष्टीकरण से अधिक प्रत्यक्ष है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वंशावली’ को उत्पत्ति के आवर्ती תֹּלְדוֹת सूत्र के लिए चुना गया है; डैश अगले पहचान-वाक्य को स्पष्ट करता है।
