  to: मुखिया मग्दीएल[क], मुखिया ईराम। ये एदोम के मुखिया हैं, उनकी बस्तियों के अनुसार उस भूमि में जिस पर उनका अधिकार था। यही एसाव है—एदोम का पिता।
