  text: אַלּ֥וּף מַגְדִּיאֵ֖ל אַלּ֣וּף עִירָ֑ם אֵ֣לֶּה אַלּוּפֵ֣י אֱד֗וֹם לְ/מֹֽשְׁבֹתָ/ם֙ בְּ/אֶ֣רֶץ אֲחֻזָּתָ֔/ם ה֥וּא עֵשָׂ֖ו אֲבִ֥י אֱדֽוֹם׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/043.yaml
  text: Chief Magdiel[a], chief Iram. These are the chiefs of Edom according to their settlements in the land of their possession. This is Esau[d][c][b], the father of Edom.
translation:
  language: hi
  text: मुखिया मग्दीएल[क], मुखिया ईराम। ये एदोम के मुखिया हैं, उनकी बस्तियों के अनुसार उस भूमि में जिस पर उनका अधिकार था। यही एसाव है—एदोम का पिता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, कुल या गोत्र के मुखिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: प्रधान
  rationale: उत्पत्ति 36 में यह शब्द एदोमी गोत्रों या कुलों के मुखिया के पद को सूचित करता है। ‘प्रधान’ संक्षिप्त, गरिमापूर्ण और आधुनिक हिन्दी में सहज है।
- source_word: מַגְדִּיאֵל
  choice: मग्दीएल
  rationale: व्यक्तिवाचक नाम का स्रोत-निकट देवनागरी लिप्यंतरण।
- source_word: עִירָם
  choice: ईराम
  rationale: व्यक्तिवाचक नाम का स्रोत-निकट देवनागरी लिप्यंतरण।
- source_word: אֵלֶּה אַלּוּפֵי אֱדֹם
  choice: ये एदोम के प्रधान हैं
  rationale: सूची के समापन पर आए सार-वाक्य को वर्तमानकालीन पहचान के रूप में रखा गया है और אַלּוּף का अनुवाद पूरे पद में एकसमान है।
- source_word: לְמֹשְׁבֹתָם
  choice: उनकी बस्तियों के अनुसार
  rationale: यहाँ לְ व्यवस्था या वर्गीकरण का भाव देता है; ‘के अनुसार’ उस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּאֶרֶץ אֲחֻזָּתָם
  choice: उनके अधिकार की भूमि में
  rationale: אֲחֻזָּה भूमि-स्वामित्व या स्थायी अधिकार को दर्शाता है। यह पदबंध मूल की संज्ञात्मक संरचना और औपचारिक भाव बनाए रखता है।
- source_word: הוּא עֵשָׂו
  choice: यही एसाव है
  rationale: הוּא यहाँ पूरी वंशावली का निष्कर्षात्मक परिचय देता है। ‘यही’ अंतिम नाम ईराम की ओर संभावित गलत संकेत से बचाकर बलयुक्त पहचान प्रकट करता है।
- source_word: אֲבִי אֱדֹם
  choice: एदोम का पिता
  rationale: ‘पिता’ मूल इब्रानी वंशावली-मुहावरे को सुरक्षित रखता है; यहाँ आशय एदोमियों के पूर्वज से है।
theological_decisions:
- issue: एसाव का एदोम के जनक के रूप में वंशावली-संबंधी परिचय
  choice: एदोम का पिता
  alternative: एदोम का पूर्वज
  rationale: ‘पिता’ אָב का सीधा और स्थापित वंशावली अनुवाद है। इससे कोई अतिरिक्त धर्मवैज्ञानिक दावा जोड़े बिना मूल की जातीय-वंशीय पहचान बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण सूची-वृत्तांत। नामों को देवनागरी में स्रोत-निकट रखा गया है और पदवी के लिए पूरे पद में ‘प्रधान’ की संगति बनाए रखी गई है।
