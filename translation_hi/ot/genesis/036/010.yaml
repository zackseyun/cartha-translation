  yaml_path: translation/ot/genesis/036/010.yaml
  text: 'These are the names of Esau’s sons: Eliphaz son of Adah[a], Esau’s wife; Reuel son of Basemath[b], Esau’s wife.'
translation:
  language: hi
  text: 'एसाव के पुत्रों के नाम ये हैं: एलीपज, एसाव की पत्नी आदा का पुत्र; रूएल, एसाव की पत्नी बासमत का पुत्र।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: नाम ये हैं
  rationale: इब्रानी की सूची आरम्भ करने वाली संकेतात्मक अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: בְּנֵי עֵשָׂו
  choice: एसाव के पुत्रों
  rationale: בְּנֵי यहाँ पुरुष बहुवचन है और इस वंशावली में नामित पुत्रों को सूचित करता है।
- source_word: אֱלִיפַז
  choice: एलीपज
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בֶּן עָדָה
  choice: आदा का पुत्र
  rationale: בֶּן प्रत्यक्ष पुत्र-संबंध बताता है; हिन्दी में संबंधकारक रचना स्वाभाविक है।
- source_word: אֵשֶׁת עֵשָׂו
  choice: एसाव की पत्नी
  rationale: इब्रानी संबंधसूचक पद का सीधा अर्थ; मूल में दोनों माताओं के बाद इसकी पुनरावृत्ति है, जिसे अनुवाद में बनाए रखा गया है।
- source_word: רְעוּאֵל
  choice: रूएल
  rationale: इब्रानी רְעוּאֵל का ध्वन्यात्मक हिन्दी लिप्यंतरण।
- source_word: בֶּן בָּשְׂמַת
  choice: बासमत का पुत्र
  rationale: पहले समान पद की तरह पुत्र-संबंध को स्पष्ट और संगत रूप से व्यक्त करता है।
- source_word: בָּשְׂמַת
  choice: बासमत
  rationale: इब्रानी नाम בָּשְׂמַת का निकट हिन्दी लिप्यंतरण।
