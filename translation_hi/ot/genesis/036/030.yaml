  yaml_path: translation/ot/genesis/036/030.yaml
  text: Chief Dishon[a], chief Ezer[b], chief Dishan—these were the chiefs of the Horites according to their chiefs in the land of Seir.
translation:
  language: hi
  text: प्रधान दीशोन, प्रधान एसेर और प्रधान दीशान—ये सेईर देश में होरियों के प्रधान थे, अपने-अपने प्रधानों के अनुसार।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने-अपने कुलों के अनुसार।” इब्रानी पद का आशय प्रधानों के अनुसार वर्गीकरण अथवा उनके अधीन कुलों/विभागों से हो सकता है।
    reason: lexical_alternative
