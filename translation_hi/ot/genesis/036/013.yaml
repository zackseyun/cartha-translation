id: GEN.36.13
reference: Genesis 36:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ בְּנֵ֣י רְעוּאֵ֔ל נַ֥חַת וָ/זֶ֖רַח שַׁמָּ֣ה וּ/מִזָּ֑ה אֵ֣לֶּ֣ה הָי֔וּ בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/013.yaml
  text: 'And these were the sons of Reuel: Nahath[a], Zerah, Shammah, and Mizzah. These were the sons of Basemath, Esau’s wife.'
translation:
  language: hi
  text: 'और रूएल के बेटे ये थे: नहत, जेरह, शम्मा और मिज्जा। ये एसाव की पत्नी बासमत के वंशज[a] थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “बेटे”; यहाँ संदर्भ में बासमत के पोते अभिप्रेत हैं।
    reason: इब्रानी בְּנֵי की शाब्दिक अभिव्यक्ति और संदर्भगत वंशावली-संबंध दोनों स्पष्ट करने के लिए।
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ... ये थे
  rationale: संयोजक और संकेतवाचक पद वंशावली की अगली कड़ी प्रस्तुत करते हैं; यह रूप इब्रानी संबंध को रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: בְּנֵי רְעוּאֵל
  choice: रूएल के बेटे
  rationale: यहाँ गिनाए गए पुरुष रूएल की सीधी संतान हैं, इसलिए 'बेटे' सटीक और सहज है।
- source_word: נַחַת וָזֶרַח שַׁמָּה וּמִזָּה
  choice: नहत, जेरह, शम्मा और मिज्जा
  rationale: व्यक्तिनामों को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है और हिन्दी सूची-शैली में अंतिम संयोजक रखा गया है।
- source_word: אֵלֶּה הָיוּ
  choice: ये ... थे
  rationale: यह वंशावली का सामान्य भूतकालीन परिचयात्मक सूत्र है।
- source_word: בְּנֵי בָשְׂמַת
  choice: बासमत के वंशज
  rationale: בְּנֵי का मूल अर्थ 'बेटे' है, पर वंशावली में इसका व्यापक अर्थ 'वंशज' भी हो सकता है। उत्पत्ति 36:10 के अनुसार रूएल बासमत का बेटा है, इसलिए यहाँ सूचीबद्ध पुरुष उसके पोते हैं; 'वंशज' स्रोत की अर्थ-सीमा बनाए रखते हुए अनावश्यक विरोधाभास से बचाता है। शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: אֵשֶׁת עֵשָׂו
  choice: एसाव की पत्नी
  rationale: संबंधसूचक इब्रानी पदबंध का स्वाभाविक आधुनिक हिन्दी रूप।
theological_decisions:
- issue: बासमत से सूचीबद्ध पुरुषों का वंशावली-संबंध
  choice: मुख्य पाठ में 'वंशज'
  alternative: '''बेटे'' या संदर्भानुसार ''पोते'''
  rationale: '''बेटे'' इब्रानी शब्द का सबसे शाब्दिक रूप है, जबकि निकट संदर्भ उन्हें बासमत के पोते ठहराता है। ''पोते'' संबंध स्पष्ट करता, पर स्रोत से अधिक विशिष्ट होता; ''वंशज'' मूल शब्द की व्यापक वंशावलीगत क्षमता और संदर्भ दोनों को सुरक्षित रखता है।'
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नाम इब्रानी के निकट देवनागरी में दिए गए हैं। वंशावली की पुनरुक्त संरचना को यथासंभव बनाए रखते हुए दूसरे בְּנֵי का संदर्भगत व्यापक अर्थ अपनाया गया है।
