  register: आधुनिक मानक हिंदी; वंशावली-सूत्र की गरिमा और स्पष्टता बनाए रखते हुए लंबे संबंधसूचक खंड को दो वाक्यों में बाँटा गया है। मूल की ‘अना की बेटी, सिबोन की बेटी’ संरचना जानबूझकर सुरक्षित रखी गई है।
