  text: וְ/אֵ֣לֶּה הָי֗וּ בְּנֵ֨י אָהֳלִיבָמָ֧ה בַת עֲנָ֛ה בַּת צִבְע֖וֹן אֵ֣שֶׁת עֵשָׂ֑ו וַ/תֵּ֣לֶד לְ/עֵשָׂ֔ו אֶת יעיש וְ/אֶת יַעְלָ֖ם וְ/אֶת קֹֽרַח־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/014.yaml
  text: 'And these were the sons of Oholibamah daughter of Anah, daughter of Zibeon, Esau''s wife: she bore to Esau Jeush, Jalam, and Korah.'
translation:
  language: hi
  text: और ये ओहोलीबामा के पुत्र थे। ओहोलीबामा एसाव की पत्नी और अना की बेटी, सिबोन की बेटी थी। उसने एसाव के लिए यऊश, यालाम और कोरह को जन्म दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה הָיוּ בְּנֵי
  choice: और ये ... के पुत्र थे
  rationale: वंशावली के परिचय में संयोजक וְ, संकेतवाचक אֵלֶּה और भूतकालीन सूत्र הָיוּ בְּנֵי को सहज हिंदी में बनाए रखता है।
- source_word: אָהֳלִיבָמָה
  choice: ओहोलीबामा
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: בַת עֲנָה בַּת צִבְעוֹן
  choice: अना की बेटी, सिबोन की बेटी
  rationale: मूल में בַת की पुनरावृत्ति को बनाए रखता है और उसे चुपचाप ‘पोती’ में नहीं बदलता; इस प्रकार वंश-संबंध की वास्तविक अभिव्यक्ति सुरक्षित रहती है।
- source_word: אֵשֶׁת עֵשָׂו
  choice: एसाव की पत्नी
  rationale: संबंधसूचक इब्रानी रचना का स्वाभाविक और स्पष्ट हिंदी रूप।
- source_word: וַתֵּלֶד לְעֵשָׂו
  choice: उसने एसाव के लिए ... को जन्म दिया
  rationale: ילד के साथ לְ द्वारा व्यक्त पति-संबंध को ‘के लिए’ से दर्शाया गया है, साथ ही हिंदी वाक्य स्वाभाविक रखा गया है।
- source_word: יעיש וְאֶת יַעְלָם וְאֶת קֹרַח
  choice: यऊश, यालाम और कोरह
  rationale: व्यक्तिगत नामों के मूल इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
