base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/017.yaml
  text: 'And these are the sons of Reuel[a], the son of Esau: chief Nahath, chief Zerah, chief Shammah, chief Mizzah. These are the chiefs of Reuel in the land of Edom. These are the sons of Basemath, Esau’s wife.'
translation:
  language: hi
  text: 'और ये एसाव के पुत्र रऊएल के पुत्र हैं: प्रधान[a] नहत, प्रधान ज़ेरह, प्रधान शम्मा और प्रधान मिज्जा। ये एदोम देश में रऊएल के प्रधान हैं। ये एसाव की पत्नी बासमत के पुत्र हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुल-प्रधान”; यहाँ बार-बार आया हिब्रू शब्द אַלּוּף एदोम के कुल या कबीले के अगुए को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ... ये हैं
  rationale: संयोजक और संकेतवाचक पद को बनाए रखते हुए यह वंशावली की अगली इकाई को पिछली सामग्री से जोड़ता है।
- source_word: בְּנֵי
  choice: पुत्र
  rationale: यहाँ नामित पुरुष संतानों की सूची है, इसलिए ‘पुत्र’ सबसे सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: רְעוּאֵל בֶּן עֵשָׂו
  choice: एसाव के पुत्र रऊएल
  rationale: हिब्रू की वंशसूचक संरचना को स्वाभाविक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: אַלּוּף
  choice: प्रधान
  rationale: एदोमी प्रसंग में यह शब्द कबीले या कुल के अगुए के लिए प्रयुक्त है। ‘प्रधान’ संक्षिप्त, आधुनिक और गरिमापूर्ण है; अधिक स्पष्ट विकल्प ‘कुल-प्रधान’ पादटिप्पणी में दिया गया है।
- source_word: נַחַת
  choice: नहथ
  rationale: हिब्रू व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण।
- source_word: זֶרַח
  choice: जेरह
  rationale: हिब्रू व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: שַׁמָּה
