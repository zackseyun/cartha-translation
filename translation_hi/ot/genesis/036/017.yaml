- source_word: אֵלֶּה אַלּוּפֵי רְעוּאֵל
  choice: रऊएल के प्रधान ये ही हैं
  rationale: पूर्ववर्ती सूची का सार प्रस्तुत करने वाली हिब्रू संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: एदोम देश में
  rationale: मूल में ‘देश’ स्पष्ट रूप से उपस्थित है, इसलिए उसे संक्षिप्त करके केवल ‘एदोम में’ नहीं किया गया।
- source_word: בָשְׂמַת אֵשֶׁת עֵשָׂו
  choice: एसाव की पत्नी बासमत
  rationale: मातृवंश की पहचान कराने वाले संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
