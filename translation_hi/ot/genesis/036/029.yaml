  language: hi
  text: 'ये होरियों के प्रधान हैं: प्रधान लोतान[a], प्रधान शोबाल, प्रधान सिबोन और प्रधान अना।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कुल-प्रमुख” अथवा “गोत्रों के मुखिया”; इब्रानी शब्द किसी कुल या गोत्र के प्रधान को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये ... हैं
  rationale: यह बहुवचन संकेतवाचक शब्द सूची का परिचय देता है; स्वाभाविक हिन्दी में ‘ये ... हैं’ उपयुक्त है।
- source_word: אַלּוּפֵי / אַלּוּף
  choice: प्रधान / प्रधान
  rationale: उत्पत्ति 36 में यह शब्द कुल या गोत्र के मुखिया के अर्थ में आता है। ‘प्रधान’ आधुनिक, गरिमापूर्ण और व्यापक नेतृत्व-अर्थ को बनाए रखता है; प्रत्येक नाम से पहले इसकी इब्रानी पुनरावृत्ति भी सुरक्षित रखी गई है।
- source_word: הַחֹרִי
  choice: होरियों
  rationale: रूप की दृष्टि से यह निश्चित एकवचन जातिवाचक है, पर प्रसंग में सामूहिक जनसमूह को दर्शाता है; हिन्दी में ‘होरियों’ स्वाभाविक है।
- source_word: לוֹטָן
  choice: लोतान
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: שׁוֹבָל
  choice: शोबाल
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: צִבְעוֹן
  choice: सिबोन
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण; आरंभिक צ को ‘स’ से दर्शाया गया है।
- source_word: עֲנָה
  choice: अना
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
