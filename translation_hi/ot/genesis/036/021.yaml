  text: and Dishon[a], and Ezer, and Dishan. These are the chiefs of the Horites, the sons of Seir, in the land of Edom.
translation:
  language: hi
  text: और दीशोन, एसेर और दीशान। ये होरियों के प्रधान थे, जो सेईर के पुत्र थे और एदोम देश में रहते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִשׁוֹן
  choice: दीशोन
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: אֵצֶר
  choice: एसेर
  rationale: हिब्रू नाम का देवनागरी लिप्यंतरण; צ को यहाँ प्रचलित और सुबोध रूप में 'स' से दर्शाया गया है।
- source_word: דִישָׁן
  choice: दीशान
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: אַלּוּפֵי
  choice: प्रधान
  rationale: यह शब्द एदोमी/होरी कुल-समूहों के सामाजिक-राजनीतिक मुखियाओं को सूचित करता है; 'प्रधान' आधुनिक, गरिमापूर्ण और व्यापक रूप से बोधगम्य है।
- source_word: הַחֹרִי
  choice: होरियों
  rationale: रूप की दृष्टि से एकवचन होते हुए भी यहाँ जाति-समूह के सामूहिक अर्थ में प्रयुक्त है; हिंदी में बहुवचन स्वाभाविक है।
- source_word: בְּנֵי שֵׂעִיר
  choice: सेईर के वंशज
  rationale: शाब्दिक अर्थ 'सेईर के पुत्र' है, पर इस वंशावली-संदर्भ में 'वंशज' अभिप्रेत सामूहिक वंश-संबंध को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: एदोम देश में
  rationale: हिब्रू के 'एदोम की भूमि में' का स्वाभाविक हिंदी रूप, जिसमें भौगोलिक स्पष्टता बनी रहती है।
