  yaml_path: translation/ot/genesis/036/023.yaml
  text: 'These are the sons of Shobal: Alvan[a], Manahath, Ebal, Shepho[b], and Onam.'
translation:
  language: hi
  text: 'शोबाल के पुत्र ये थे: अलवान[a], मानहत, एबाल, शपो[b] और ओनाम।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘अलवान’ है; 1 इतिहास 1:40 की समानांतर वंशावली में ‘अलयान’ है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी पाठ में ‘शपो’ है; 1 इतिहास 1:40 की समानांतर वंशावली में ‘शपी’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: ये थे
  rationale: यह पद वंशावली की अगली सूची प्रस्तुत करता है। हिन्दी में ‘ये थे’ स्वाभाविक है; आरम्भिक וְ को अलग से ‘और’ कहना आवश्यक नहीं।
- source_word: בְּנֵי
  choice: पुत्र
  rationale: यहाँ शोबाल की प्रत्यक्ष पुरुष संतानों की सूची है, इसलिए ‘पुत्र’ सबसे सटीक है।
- source_word: שׁוֹבָל
  choice: शोबाल
  rationale: व्यक्तिवाचक नाम को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: עַלְוָן
  choice: अलवान
  rationale: मुख्य पाठ में WLC के इब्रानी रूप का लिप्यंतरण किया गया है; 1 इतिहास 1:40 का भिन्न रूप पादटिप्पणी में रखा गया है।
- source_word: וּ/מָנַחַת
  choice: मानहत
  rationale: व्यक्तिवाचक नाम का इब्रानी से लिप्यंतरण; उपसर्गीय संयोजक को हिन्दी सूची की विराम-व्यवस्था से व्यक्त किया गया है।
- source_word: וְ/עֵיבָל
  choice: एबाल
  rationale: इब्रानी नाम का सीधा देवनागरी लिप्यंतरण।
- source_word: שְׁפוֹ
  choice: शपो
  rationale: उत्पत्ति के मसोरेटी पाठ का रूप मुख्य पाठ में रखा गया है; समानांतर वंशावली का ‘शपी’ रूप पादटिप्पणी में दिया गया है।
- source_word: וְ/אוֹנָם
  choice: और ओनाम
  rationale: नाम का लिप्यंतरण किया गया है और सूची की अंतिम कड़ी का וְ स्वाभाविक हिन्दी ‘और’ से व्यक्त हुआ है।
