  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: מות का वय्यिक्तोल रूप क्रमिक कथा में साधारण भूतकाल की घटना बताता है; राजाओं की इस सूची में ‘मर गया’ स्वाभाविक और स्पष्ट है।
- source_word: יוֹבָב
  choice: योबाब
  rationale: व्यक्तिवाचक नाम का मानक देवनागरी लिप्यंतरण।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: इस राजकीय उत्तराधिकार-सूत्र में מלך सिंहासन ग्रहण करने को व्यक्त करता है; ‘राजा हुआ’ संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह पद किसी के बदले उसी पद पर उत्तराधिकारी होने का भाव देता है।
- source_word: חֻשָׁם
  choice: हूशाम
  rationale: व्यक्तिवाचक नाम का स्रोत-ध्वनि के अनुरूप देवनागरी लिप्यंतरण।
- source_word: מֵאֶרֶץ
  choice: देश का
  rationale: מן के साथ אֶרֶץ भौगोलिक मूल या संबंध बताता है; हिंदी में व्यक्ति के परिचय के साथ ‘देश का’ स्वाभाविक है।
- source_word: הַתֵּימָנִי
  choice: तेमानी लोगों के
  rationale: निश्चित gentilic रूप को सामूहिक अर्थ में लिया गया है; इससे तेमान से जुड़े लोगों अथवा उनके क्षेत्र का संकेत बना रहता है।
