reference: Genesis 36:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּמָת֮ בַּ֣עַל חָנָ֣ן בֶּן עַכְבּוֹר֒ וַ/יִּמְלֹ֤ךְ תַּחְתָּי/ו֙ הֲדַ֔ר וְ/שֵׁ֥ם עִיר֖/וֹ פָּ֑עוּ וְ/שֵׁ֨ם אִשְׁתּ֤/וֹ מְהֵֽיטַבְאֵל֙ בַּת מַטְרֵ֔ד בַּ֖ת מֵ֥י זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/039.yaml
  text: Baal-hanan son of Achbor died[a], and Hadar reigned in his place. The name of his city was Pau, and the name of his wife was Mehetabel daughter of Matred[c][b], daughter of Me-zahab.
translation:
  language: hi
  text: अकबोर का पुत्र बाल-हानान मर गया, और उसके स्थान पर हदर[a] राज्य करने लगा। उसके नगर का नाम पाऊ[b] था, और उसकी पत्नी का नाम महेतबेल था। महेतबेल मत्रेद की बेटी थी, और मत्रेद मेज़ाहाब की बेटी थी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन पाठ-परंपराओं और 1 इतिहास 1:50 में “हदद” पढ़ा जाता है।
    reason: textual_variant
  - marker: b
    text: 1 इतिहास 1:50 में “पाई” है।
    reason: textual_variant
  - marker: c
    text: 'शाब्दिक रूप से: “मत्रेद की बेटी, मेज़ाहाब की बेटी।”'
    reason: source_structure
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: क्रिया מות मृत्यु को सीधे व्यक्त करती है; ‘मर गया’ सरल और स्वाभाविक हिन्दी है तथा अनावश्यक शिष्टोक्ति से बचती है।
- source_word: בַּעַל חָנָן בֶּן עַכְבּוֹר
  choice: अकबोर का पुत्र बाल-हानान
  rationale: हिब्रू संबंध-सूचक रचना को स्वाभाविक हिन्दी क्रम में रखा गया है और व्यक्तिनामों का लिप्यंतरण किया गया है।
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: उसके स्थान पर ... राज्य करने लगा
  rationale: यह מלך के ‘राज्य करना’ और תחתיו के उत्तराधिकार-सूचक अर्थ, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: הֲדַר
  choice: हदर
  rationale: मुख्य पाठ WLC के मासोरेटिक रूप हदर का अनुसरण करता है; वैकल्पिक पाठ ‘हदद’ पादटिप्पणी में दिया गया है।
- source_word: פָּעוּ
  choice: पाऊ
  rationale: WLC में दिए स्थाननाम का देवनागरी लिप्यंतरण; समानांतर वंशावली का ‘पाई’ रूप पादटिप्पणी में सुरक्षित है।
- source_word: מְהֵיטַבְאֵל בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: महेतबेल ... मत्रेद की बेटी, मेज़ाहाब की बेटी
  rationale: दो बार आए בַּת को दो बार ‘बेटी’ कहकर स्रोत की वंशावली-सूचक संक्षिप्तता और संभावित संबंधगत अस्पष्टता बनाए रखी गई है।
theological_decisions:
- issue: בַּת מַטְרֵד בַּת מֵי זָהָב में दूसरे ‘बेटी’ का संबंध
  choice: मुख्य पाठ में हिब्रू की पुनरुक्त वंशावली-रचना को यथासंभव बनाए रखा गया है।
  alternative: ‘मत्रेद की बेटी और मेज़ाहाब की नातिन’ अथवा ‘मत्रेद की बेटी, जो मेज़ाहाब की बेटी थी’
  rationale: हिब्रू में בַּת दो बार है, पर हिन्दी में संबंध स्पष्ट करने पर एक विशिष्ट वंशगत व्याख्या आरोपित हो सकती है। पादटिप्पणी संभावित अर्थ बताती है, जबकि मुख्य पाठ तनाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। राजकीय उत्तराधिकार के लिए ‘राज्य करने लगा’ और वंशावली के लिए ‘का पुत्र/की बेटी’ जैसे सामान्य पद रखे गए हैं।
