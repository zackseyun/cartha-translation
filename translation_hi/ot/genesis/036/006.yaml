source:
  edition: WLC
  text: וַ/יִּקַּ֣ח עֵשָׂ֡ו אֶת נָ֠שָׁי/ו וְ/אֶת בָּנָ֣י/ו וְ/אֶת בְּנֹתָי/ו֮ וְ/אֶת כָּל נַפְשׁ֣וֹת בֵּית/וֹ֒ וְ/אֶת מִקְנֵ֣/הוּ וְ/אֶת כָּל בְּהֶמְתּ֗/וֹ וְ/אֵת֙ כָּל קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יֵּ֣לֶךְ אֶל אֶ֔רֶץ מִ/פְּנֵ֖י יַעֲקֹ֥ב אָחִֽי/ו־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/006.yaml
  text: And Esau took his wives[a], his sons, his daughters, and all the persons of his household, along with his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and went to a land because of his brother Jacob.
translation:
  language: hi
  text: एसाव अपनी पत्नियों, अपने बेटों और बेटियों, अपने घराने के सभी लोगों, अपने पशुधन, अपने सभी पशुओं और अपनी सारी संपत्ति को—जो उसने कनान देश में अर्जित की थी—लेकर अपने भाई याकूब के कारण एक देश में[a] चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘एक देश में’ है। कुछ पांडुलिपियाँ और प्राचीन अनुवाद ‘सेईर देश में’ पाठ का समर्थन करते हैं; अनेक अनुवाद प्रसंग के अनुसार इसे ‘दूसरे देश में’ कहते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लेकर
  rationale: לקח का मूल अर्थ ‘लेना’ है; प्रवास के इस प्रसंग में ‘लेकर ... चला गया’ स्वाभाविक हिंदी में बताता है कि एसाव लोगों और संपत्ति को अपने साथ ले गया।
- source_word: נָשָׁיו
  choice: अपनी पत्नियों
  rationale: यहाँ אִשָּׁה का बहुवचन सामान्यतः स्त्रियों के लिए नहीं, एसाव की पत्नियों के लिए प्रयुक्त है।
- source_word: בָּנָיו / בְּנֹתָיו
  choice: अपने बेटों, अपनी बेटियों
  rationale: इब्रानी पाठ बेटों और बेटियों का अलग-अलग उल्लेख करता है, इसलिए दोनों को बनाए रखा गया है।
- source_word: כָּל נַפְשׁוֹת בֵּיתוֹ
  choice: अपने घराने के सभी लोगों
  rationale: इस मुहावरे में נֶפֶשׁ का आशय घराने से संबंधित व्यक्तियों से है; ‘लोगों’ से अर्थ स्पष्ट रहता है और ‘प्राण/आत्माएँ’ जैसे अनुपयुक्त धार्मिक संकेत नहीं जुड़ते।
- source_word: מִקְנֵהוּ
  choice: अपने पशुधन
  rationale: מִקְנֶה पाले गए पशुओं अथवा पशु-संपदा के लिए व्यापक शब्द है; आधुनिक हिंदी में ‘पशुधन’ इसका सटीक और सहज समतुल्य है।
- source_word: כָּל בְּהֶמְתּוֹ
  choice: अपने सभी पशुओं
  rationale: בְּהֵמָה पशुओं के लिए व्यापक पद है। ‘सभी पशुओं’ से מִקְנֶה के ‘पशुधन’ से शब्दगत भेद भी यथासंभव बना रहता है।
- source_word: כָּל קִנְיָנוֹ
  choice: अपनी सारी संपत्ति
  rationale: קִנְיָן अर्जित माल-असबाब या संपत्ति को दर्शाता है; ‘संपत्ति’ संदर्भानुकूल व्यापक पद है।
- source_word: אֲשֶׁר רָכַשׁ
  choice: जो उसने ... अर्जित की थी
  rationale: רכשׁ अर्जित करने पर बल देता है, और ‘की थी’ मुख्य घटनाक्रम से पहले हुए अर्जन को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: मूल पाठ की भौगोलिक अभिव्यक्ति ‘कनान देश’ को स्पष्ट रूप से बनाए रखा गया है।
- source_word: אֶל אֶרֶץ
  choice: एक देश में
  rationale: मसोराई पाठ अनिश्चित रूप से ‘एक देश को/में’ कहता है। हिंदी में गमन के साथ ‘एक देश में’ स्वाभाविक है और ‘दूसरे’ या ‘सेईर’ को मुख्य पाठ में जोड़े बिना मूल की अनिश्चितता बचाता है।
- source_word: מִפְּנֵי יַעֲקֹב אָחִיו
  choice: अपने भाई याकूब के कारण
  rationale: מִפְּנֵי स्थानगत ‘के सामने से/से दूर’ और कारणगत ‘के कारण’ दोनों अर्थ दे सकता है। अगले पद में साथ न रह सकने का कारण बताया गया है, इसलिए कारणगत अर्थ संदर्भ में उपयुक्त है, जबकि मूल की संभावित स्थानगत छाया को सिद्धांतगत रूप से समाप्त नहीं माना गया।
theological_decisions:
- issue: מִפְּנֵי का कारणगत या स्थानगत अर्थ
  choice: अपने भाई याकूब के कारण
  alternative: अपने भाई याकूब से दूर
  rationale: उत्पत्ति 36:7 अलगाव का कारण दोनों की अत्यधिक संपत्ति बताता है, इसलिए कारणगत अनुवाद प्रसंग के साथ बेहतर जुड़ता है। फिर भी इब्रानी पद में ‘सामने से/से दूर’ का स्थानगत भाव संभव है; चुनाव किसी धर्मसैद्धांतिक निष्कर्ष पर आधारित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लंबी इब्रानी सूची को एक ही वाक्य में रखते हुए हिंदी के स्वाभाविक ‘लेकर ... चला गया’ ढाँचे में व्यवस्थित किया गया है।
