id: GEN.16.10
reference: Genesis 16:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת זַרְעֵ֑/ךְ וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/010.yaml
  text: Then the angel of Yahweh said to her[a], “I will greatly multiply your offspring, so that it cannot be counted because of its multitude.”
translation:
  language: hi
  text: तब यहोवा के दूत[a] ने उससे कहा, “मैं तुम्हारे वंश को इतना अधिक बढ़ाऊँगा कि उसकी बहुतायत के कारण उसे गिना नहीं जा सकेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा के स्वर्गदूत।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक रूप से क्रम व्यक्त करता है।
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा के दूत
  rationale: מַלְאַךְ का अर्थ ‘दूत’ या प्रसंगानुसार ‘स्वर्गदूत’ हो सकता है। ‘दूत’ मूल शब्द की व्यापकता और पद में विद्यमान पहचान-संबंधी तनाव को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הַרְבָּה אַרְבֶּה
  choice: इतना अधिक बढ़ाऊँगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute वृद्धि की तीव्र मात्रा पर बल देता है; यह हिन्दी अभिव्यक्ति उस बल को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: זַרְעֵךְ
  choice: तेरे वंश
  rationale: זֶרַע यहाँ सामूहिक एकवचन है। ‘वंश’ भावी संतति को सामूहिक रूप में व्यक्त करता है और हिन्दी में स्वाभाविक है।
- source_word: וְלֹא יִסָּפֵר
  choice: उसे गिना नहीं जा सकेगा
  rationale: निफ़अल रूप यहाँ इतनी बड़ी संख्या का बोध देता है कि गणना संभव न होगी।
- source_word: מֵרֹב
  choice: उसकी बहुतायत के कारण
  rationale: מִן के साथ רֹב कारण बताता है—अत्यधिक संख्या के कारण; सर्वनाम सामूहिक ‘वंश’ की ओर संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है; उसे उपाधि में बदलने के बजाय हिन्दी में परिचित नाम-रूप रखा गया है।
- issue: מַלְאַךְ יְהוָה की पहचान और अर्थ-सीमा
  choice: यहोवा के दूत
  alternative: यहोवा के स्वर्गदूत
  rationale: ‘दूत’ मूल शब्द का सीधा और व्यापक अर्थ है तथा यह इस पात्र की पहचान को पाठ से अधिक निश्चित नहीं करता; वैकल्पिक पारंपरिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। हाजिरा को संबोधन में एकवचन निकट रूप ‘तेरे’ मूल के स्त्रीलिंग एकवचन प्रत्यय को स्वाभाविक हिन्दी में दर्शाता है।
