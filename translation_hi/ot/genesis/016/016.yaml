- source_word: וְ/אַבְרָם
  choice: अब्राम
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण; आरम्भिक וְ को हिन्दी वाक्य-संरचना में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: בֶּן
  choice: वर्ष का था
  rationale: आयु बताने वाले इब्रानी मुहावरे का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: שְׁמֹנִים שָׁנָה וְ/שֵׁשׁ שָׁנִים
  choice: छियासी
  rationale: ‘अस्सी वर्ष और छह वर्ष’ के संयुक्त अंक का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: בְּ/לֶדֶת
  choice: जब ... ने ... को जन्म दिया
  rationale: בְ के साथ infinitive construct यहाँ समयसूचक उपवाक्य बनाता है; हिन्दी में ‘जब’ इसका स्वाभाविक समतुल्य है।
- source_word: הָגָר
  choice: हाजिरा
  rationale: इस पात्र के नाम का हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण।
- source_word: אֶת יִשְׁמָעֵאל
  choice: इश्माएल को
  rationale: אֶת निश्चित प्रत्यक्ष कर्म का चिह्न है; हिन्दी में कर्मचिह्न ‘को’ के साथ नाम का लिप्यंतरण किया गया है।
- source_word: לְ/אַבְרָם
  choice: अब्राम के लिए
  rationale: לְ यहाँ संतान-जन्म का अब्राम से संबंध व्यक्त करता है। हिन्दी में ‘के लिए’ स्वाभाविक है और मूल के संबंधपरक अर्थ को बनाए रखता है।
