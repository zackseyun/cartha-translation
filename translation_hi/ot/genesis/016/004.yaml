  yaml_path: translation/ot/genesis/016/004.yaml
  text: He went in to Hagar[a], and she conceived. When she saw that she had conceived, her mistress was despised in her eyes.
translation:
  language: hi
  text: वह हाजिरा के पास गया, और वह गर्भवती हो गई। जब हाजिरा ने देखा कि वह गर्भवती हो गई है, तब उसकी स्वामिनी उसकी दृष्टि में तुच्छ हो गई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी स्वामिनी उसकी दृष्टि में तुच्छ समझी गई।” इब्रानी अभिव्यक्ति का आशय यह हो सकता है कि हाजिरा के आकलन में उसकी स्वामिनी तुच्छ हो गई, अथवा हाजिरा ने उसे तुच्छ समझा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל הָגָר
  choice: वह हाजिरा के पास गया
  rationale: यह इब्रानी मुहावरा इस प्रसंग में यौन-संबंध का शिष्ट संकेत है। हिंदी में ‘के पास गया’ मूल की कथात्मक मर्यादा और संकेतात्मकता को बनाए रखता है; प्रसंग अर्थ स्पष्ट करता है।
- source_word: וַתַּהַר / הָרָתָה
  choice: गर्भवती हो गई / गर्भवती हो गई है
  rationale: הרה गर्भधारण करने अथवा गर्भवती होने को व्यक्त करता है। दोनों स्थानों पर समान हिंदी पदावली मूल की निकट पुनरावृत्ति बनाए रखती है।
- source_word: וַתֵּרֶא כִּי
  choice: जब उसने देखा कि
  rationale: यह हाजिरा को अपनी गर्भावस्था का बोध होने को दर्शाता है और ‘जब’ कथानक के समयगत प्रवाह को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַתֵּקַל
  choice: तुच्छ हो गई
  rationale: קלל यहाँ किसी के मूल्य या मान को हल्का अथवा तुच्छ समझे जाने का भाव देता है। यह अनुवाद वास्तविक चरित्र-परिवर्तन के बजाय हाजिरा की दृष्टि में बदले हुए मूल्यांकन को दर्शाता है।
- source_word: גְּבִרְתָּהּ
  choice: उसकी स्वामिनी
  rationale: גברת स्त्री अधिकारी अथवा मालकिन को सूचित करता है। ‘स्वामिनी’ आधुनिक, गरिमापूर्ण हिंदी में सामाजिक संबंध को सीधे व्यक्त करता है।
- source_word: בְּעֵינֶיהָ
  choice: उसकी दृष्टि में
  rationale: यह मूल्यांकन का सामान्य इब्रानी मुहावरा है। ‘उसकी दृष्टि में’ हिंदी में स्वाभाविक है और स्पष्ट करता है कि तुच्छता हाजिरा के आकलन में थी।
