  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/קָרָ֤את שְׁמ/וֹ֙ יִשְׁמָעֵ֔אל כִּֽי שָׁמַ֥ע יְהוָ֖ה אֶל עָנְיֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/011.yaml
  text: Then the angel of Yahweh said to her[a], “Behold, you are pregnant and will bear a son, and you shall call his name Ishmael, because Yahweh has heard your affliction.”
translation:
  language: hi
  text: तब याहवे के दूत[a] ने उससे कहा, “देखो, तुम गर्भवती हो और एक पुत्र को जन्म दोगी। तुम उसका नाम इश्माएल रखना, क्योंकि याहवे ने तुम्हारी दुर्दशा सुनी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के संदेशवाहक।”
    reason: מַלְאָךְ का अर्थ ‘दूत’ या ‘संदेशवाहक’ हो सकता है; प्रसंग में दैवी दूत का अर्थ उपयुक्त है, पर पद स्वयं पहचान को और निश्चित नहीं करता।
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा के दूत
  rationale: מַלְאַךְ का अर्थ ‘दूत’ या ‘संदेशवाहक’ हो सकता है। इस प्रसंग में ‘दूत’ स्वर्गीय संदेशवाहक के पारंपरिक और स्वाभाविक अर्थ को व्यक्त करता है, जबकि पादटिप्पणी दूसरा संभव अर्थ सुरक्षित रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הִנָּךְ הָרָה
  choice: देखो, तुम गर्भवती हो
  rationale: הִנָּךְ ध्यान आकर्षित करने वाला कथन है; ‘देखो’ आधुनिक हिन्दी में उसके बल को स्वाभाविक रूप से रखता है। הָרָה को स्पष्ट और वर्तमान ‘गर्भवती हो’ से व्यक्त किया गया है।
- source_word: וְיֹלַדְתְּ בֵּן
  choice: और एक पुत्र को जन्म दोगी
  rationale: यह आने वाले जन्म की घोषणा है। ‘जन्म दोगी’ आधुनिक हिन्दी में स्पष्ट है और स्त्रीलिंग संबोधन को भी सुरक्षित रखता है।
- source_word: וְקָרָאת שְׁמוֹ
  choice: तुम उसका नाम … रखना
  rationale: हिब्रू की नामकरण-विधि को सहज हिन्दी में निर्देशात्मक ‘नाम … रखना’ से व्यक्त किया गया है।
- source_word: יִשְׁמָעֵאל
  choice: इश्माएल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है; अगले कारणवाचक वाक्य में नाम के ‘सुनने’ संबंधी अर्थ की ओर संकेत बना रहता है।
- source_word: כִּי שָׁמַע יְהוָה אֶל עָנְיֵךְ
  choice: क्योंकि यहोवा ने तुम्हारे दुःख में तुम्हारी सुन ली है
  rationale: כִּי नाम रखने का कारण बताता है। ‘तुम्हारी सुन ली है’ שמע की सुनने-संबंधी शब्दावली और इश्माएल नाम के साथ उसका संबंध बचाता है; ‘तुम्हारे दुःख में’ עֳנִי को पीड़ा और दमन की व्यापक दशा के रूप में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है; इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: यहोवा के दूत
  alternative: यहोवा के संदेशवाहक
  rationale: यह अनुवाद मूल पदबंध को बनाए रखता है और दूत की पहचान के विषय में ऐसी कोई अतिरिक्त धर्मवैज्ञानिक पहचान नहीं जोड़ता जिसे यह पद स्वयं स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम’ का प्रयोग आधुनिक हिन्दी में सम्मानजनक और स्वाभाविक संबोधन के लिए किया गया है; स्त्रीलिंग क्रियाएँ हाजिरा से संबोधन को स्पष्ट करती हैं।
