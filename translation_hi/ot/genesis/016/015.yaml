id: GEN.16.15
reference: Genesis 16:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֵּ֧לֶד הָגָ֛ר לְ/אַבְרָ֖ם בֵּ֑ן וַ/יִּקְרָ֨א אַבְרָ֧ם שֶׁם בְּנ֛/וֹ אֲשֶׁר יָלְדָ֥ה הָגָ֖ר יִשְׁמָעֵֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/015.yaml
  text: Hagar bore a son to Abram[a], and Abram called the name of his son, whom Hagar bore, Ishmael.
translation:
  language: hi
  text: हाजिरा ने अब्राम के लिए एक पुत्र को जन्म दिया, और अब्राम ने अपने उस पुत्र का नाम, जिसे हाजिरा ने जन्म दिया था, इश्माएल रखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: जन्म दिया
  rationale: स्त्री कर्ता के साथ ילד का क़ाल रूप यहाँ संतान को जन्म देने के सामान्य अर्थ में है; आधुनिक हिन्दी में ‘जन्म दिया’ स्वाभाविक और स्पष्ट है।
- source_word: לְאַבְרָם
  choice: अब्राम के लिए
  rationale: לְ यहाँ अब्राम के साथ संबंध और उसके लिए पुत्र उत्पन्न होने का भाव व्यक्त करता है। ‘के लिए’ इस संबंध को बनाए रखता है और केवल जैविक पितृत्व की व्याख्या जोड़ने से बचता है।
- source_word: בֵּן
  choice: एक पुत्र
  rationale: संज्ञा अनिश्चित है; ‘एक पुत्र’ हिन्दी में इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּקְרָא ... שֵׁם
  choice: नाम ... रखा
  rationale: קרא שם नाम देने का इब्रानी मुहावरा है। हिन्दी का स्वाभाविक समतुल्य ‘नाम रखना’ है, जो अर्थ को पूरा रखते हुए कृत्रिम शाब्दिकता से बचता है।
- source_word: בְּנוֹ
  choice: अपने उस पुत्र
  rationale: प्रत्यय पुत्र को अब्राम का बताता है; ‘अपने’ स्वामित्व व्यक्त करता है और ‘उस’ आगे आने वाले संबंधवाचक उपवाक्य से सहज जोड़ बनाता है।
- source_word: אֲשֶׁר יָלְדָה הָגָר
  choice: जिसे हाजिरा ने जन्म दिया था
  rationale: यह संबंधवाचक उपवाक्य पहले उल्लिखित पुत्र की पहचान करता है और हाजिरा का स्पष्ट पुनरुल्लेख सुरक्षित रखता है। हिन्दी में पूर्ण हो चुकी पूर्व घटना के लिए ‘दिया था’ स्वाभाविक है।
- source_word: יִשְׁמָעֵאל
  choice: इश्माएल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। इब्रानी की पुनरुक्ति—हाजिरा का दो बार उल्लेख और पुत्र का अब्राम से संबंध—जानबूझकर बनाए रखे गए हैं, जबकि नामकरण के मुहावरे को स्वाभाविक हिन्दी में व्यक्त किया गया है।
