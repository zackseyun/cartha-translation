source:
  edition: WLC
  text: וַֽ/יִּמְצָאָ֞/הּ מַלְאַ֧ךְ יְהוָ֛ה עַל עֵ֥ין הַ/מַּ֖יִם בַּ/מִּדְבָּ֑ר עַל הָ/עַ֖יִן בְּ/דֶ֥רֶךְ שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/007.yaml
  text: And the angel of Yahweh found her by a spring of water in the wilderness[b][a], by the spring on the way to Shur.
translation:
  language: hi
  text: याहवे[b] के स्वर्गदूत[a] ने उसे निर्जन क्षेत्र में पानी के एक सोते के पास पाया—उस सोते के पास, जो शूर जाने वाले मार्ग पर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दूत।” इब्रानी शब्द का अर्थ “दूत” या “स्वर्गदूत” दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “याहवे” इब्रानी ईश्वरीय नाम YHWH का लिप्यंतरण है; परंपरागत रूप से इसका अनुवाद “प्रभु” किया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְצָאָהּ
  choice: ने उसे ... पाया
  rationale: מצא का सामान्य कथात्मक अर्थ ‘पाना’ है और स्त्रीलिंग एकवचन कर्म-प्रत्यय हाजिरा की ओर संकेत करता है।
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे के दूत
  rationale: מַלְאַךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। ‘दूत’ स्वाभाविक हिन्दी है और मूल शब्द की व्यापकता बनाए रखता है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह इब्रानी व्यक्तिवाचक ईश्वरीय नाम YHWH का प्रचलित लिप्यंतरण है; इसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखा गया है।
- source_word: עַל עֵין הַמַּיִם
  choice: पानी के एक सोते के पास
  rationale: इस प्रसंग में עַיִן जलस्रोत या सोते को दर्शाता है, और עַל स्थान-सूचक अर्थ में ‘के पास’ है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר केवल रेतीले मरुस्थल तक सीमित नहीं, बल्कि निर्जन या कम आबादी वाले वन्य प्रदेश को भी दर्शाता है।
- source_word: עַל הָעַיִן
  choice: उस सोते के पास
  rationale: दोहराया गया עַיִן उसी जलस्रोत को फिर से निर्दिष्ट करता है; ‘उस’ से यह संबंध हिन्दी में स्पष्ट और स्वाभाविक बनता है।
- source_word: בְּדֶרֶךְ שׁוּר
  choice: शूर जाने वाले मार्ग पर
  rationale: דֶּרֶךְ मार्ग को और שׁוּר स्थान-नाम को दर्शाता है; यह अनुवाद वाक्यांश का दिशात्मक-भौगोलिक अर्थ सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: מַלְאַךְ की पहचान
  choice: दूत
  alternative: स्वर्गदूत
  rationale: मूल शब्द मानवीय या अलौकिक संदेशवाहक दोनों के लिए प्रयुक्त हो सकता है। मुख्य पाठ में ‘दूत’ रखकर पहचान को आवश्यकता से अधिक निश्चित नहीं किया गया, जबकि पारंपरिक विकल्प पादटिप्पणी में दिया गया है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल में व्यक्तिवाचक ईश्वरीय नाम है। ‘याहवे’ नाम को सुरक्षित रखता है; पाठकों की परिचित पारंपरिक अभिव्यक्ति ‘प्रभु’ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘निर्जन प्रदेश’ מִדְבָּר की व्यापक भौगोलिक धारणा को ‘रेगिस्तान’ से अधिक ठीक व्यक्त करता है। सोते का दोहराव मूल इब्रानी की स्थानीयकरण-विधि को बनाए रखने के लिए सुरक्षित रखा गया है।
