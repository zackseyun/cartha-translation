id: GEN.16.5
reference: Genesis 16:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר שָׂרַ֣י אֶל אַבְרָם֮ חֲמָסִ֣/י עָלֶי/ךָ֒ אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִ/י֙ בְּ/חֵיקֶ֔/ךָ וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וָ/אֵקַ֖ל בְּ/עֵינֶ֑י/הָ יִשְׁפֹּ֥ט יְהוָ֖ה בֵּינִ֥/י וּ/בֵינֶֽיׄ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/005.yaml
  text: Then Sarai said to Abram[a], “The wrong done to me is on you. I gave my female servant into your embrace, and when she saw that she had conceived, I became contemptible in her eyes[b]. May Yahweh judge between me and you.”
translation:
  language: hi
  text: तब सारै ने अब्राम से कहा, “मेरे साथ हुए अन्याय की जिम्मेदारी तुम पर है[a]। मैंने अपनी दासी को तुम्हारी बाँहों में सौंप दिया[b]; और जब उसने देखा कि वह गर्भवती हो गई थी, तब मैं उसकी दृष्टि में तुच्छ हो गई। यहोवा मेरे और तुम्हारे बीच न्याय करे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरा अन्याय तुम पर [हो]।” यह वाक्यांश सारै के साथ हुए अन्याय के लिए अब्राम पर जिम्मेदारी डालता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “तुम्हारी गोद/छाती में”; यहाँ यह अंतरंग स्वीकार का शिष्ट मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָסִי עָלֶיךָ
  choice: मेरे साथ हुए अन्याय का दोष तुम पर है
  rationale: חָמָס यहाँ हिंसा, अन्याय या गलत व्यवहार को सूचित करता है, जबकि עָלֶיךָ अब्राम पर उत्तरदायित्व डालता है। यह अनुवाद सारै को अपने अपराध की स्वीकारोक्ति करते हुए नहीं, बल्कि अपने साथ हुए अन्याय के लिए अब्राम को दोषी ठहराते हुए दिखाता है।
- source_word: שִׁפְחָתִי
  choice: अपनी दासी
  rationale: שִׁפְחָה अधीनस्थ स्त्री सेविका, प्रायः दासत्व की स्थिति वाली स्त्री, को दर्शाता है। हिंदी में ‘दासी’ उस सामाजिक स्थिति को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּחֵיקֶךָ
  choice: तुम्हारी बाँहों में
  rationale: חֵיק का शाब्दिक अर्थ छाती या गोद है; इस प्रसंग में यह अंतरंग स्वीकार का शिष्ट रूपक है। ‘बाँहों में’ रूपक और आशय दोनों को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: הָרָתָה
  choice: वह गर्भवती हो गई है
  rationale: क्रिया गर्भधारण की पूर्ण घटना और उसके परिणामी गर्भवती होने को दर्शाती है। हिंदी में यह रूप घटनाक्रम को स्पष्ट और सहज रखता है।
- source_word: וָאֵקַל בְּעֵינֶיהָ
  choice: उसकी दृष्टि में मेरा तिरस्कार होने लगा
  rationale: קלל यहाँ किसी को हल्का, तुच्छ या आदर के अयोग्य समझे जाने का भाव देता है। ‘उसकी दृष्टि में’ मूल इब्रानी मूल्यांकन-संबंधी मुहावरे को सुरक्षित रखता है।
- source_word: יִשְׁפֹּט יְהוָה
  choice: यहोवा ... न्याय करे
  rationale: יִשְׁפֹּט यहाँ इच्छार्थक/आह्वानात्मक बल रखता है। ‘न्याय करे’ सारै की परमेश्वर से निर्णायक न्याय की अपील व्यक्त करता है।
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: मेरे और तुम्हारे बीच
  rationale: यह वाक्यांश दोनों पक्षों के बीच यहोवा को न्यायाधीश के रूप में पुकारता है और मूल की सीधी संबोधन-शैली बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में टेट्राग्रामटन स्पष्ट रूप से प्रयुक्त है। हिंदी बाइबलीय पाठकों के लिए ‘यहोवा’ परिचित देवनागरी रूप है और सामान्य उपाधि से अलग व्यक्तिगत वाचा-नाम को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। आरोप की तीव्रता और सारै की न्याय-अपील को नरम नहीं किया गया; अंतरंगता के इब्रानी रूपक को अशिष्ट या अत्यधिक स्पष्ट बनाए बिना प्रस्तुत किया गया है।
