source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵ/ךְ֙ בְּ/יָדֵ֔/ךְ עֲשִׂי לָ֖/הּ הַ/טּ֣וֹב בְּ/עֵינָ֑יִ/ךְ וַ/תְּעַנֶּ֣/הָ שָׂרַ֔י וַ/תִּבְרַ֖ח מִ/פָּנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/006.yaml
  text: Then Abram said to Sarai[a], “Look, your female servant is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
translation:
  language: hi
  text: तब अब्राम ने सारै से कहा, “देख, तेरी दासी तेरे हाथ में है; उसके साथ वही कर जो तुझे अच्छा लगे।” तब सारै ने उसके साथ कठोर व्यवहार किया[a], और वह उसके पास से भाग गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे सताया” अथवा “उसके साथ दुर्व्यवहार किया।” इब्रानी क्रिया दुःख पहुँचाने, अपमानित करने या कठोर व्यवहार करने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह आधुनिक और स्वाभाविक संकेतक है, जो कथन की ओर ध्यान खींचने वाली इब्रानी शक्ति को बनाए रखता है।
- source_word: שִׁפְחָתֵךְ
  choice: तेरी दासी
  rationale: ‘दासी’ स्त्री के अधीनस्थ और बंधुआ घरेलू दर्जे को सामान्य ‘सेविका’ की अपेक्षा अधिक स्पष्ट रखता है, जबकि आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּיָדֵךְ
  choice: तेरे हाथ में
  rationale: इब्रानी मुहावरे को सुरक्षित रखता है और इस प्रसंग में अधिकार तथा नियंत्रण का अर्थ स्पष्ट है।
- source_word: עֲשִׂי לָהּ הַטּוֹב בְּעֵינָיִךְ
  choice: जो तुझे अच्छा लगे, उसके साथ कर
  rationale: ‘तेरी आँखों में अच्छा’ का अर्थ स्वाभाविक हिन्दी में देता है, साथ ही कार्य हाजिरा की ओर निर्देशित होने को स्पष्ट रखता है।
- source_word: וַתְּעַנֶּהָ
  choice: उसके साथ कठोर व्यवहार किया
  rationale: पिएल रूप वास्तविक उत्पीड़न, अपमान या कठोर बर्ताव सूचित करता है; यह चयन गंभीरता बनाए रखता है, पर दुर्व्यवहार के अनिर्दिष्ट रूप को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: וַתִּבְרַח מִפָּנֶיהָ
  choice: वह उसके सामने से भाग गई
  rationale: भाग निकलने की गंभीरता और מִפָּנֶיהָ के ‘उसके सामने/उपस्थिति से’ वाले भाव दोनों को बनाए रखता है।
theological_decisions:
- issue: हाजिरा का सामाजिक दर्जा
  choice: दासी
  alternative: सेविका / दास स्त्री
  rationale: घरेलू सत्ता-संबंध इस पद में महत्त्वपूर्ण है; ‘दासी’ बंधुआ अधीनता को ‘सेविका’ की तरह नरम नहीं करता और ‘दास स्त्री’ से अधिक स्वाभाविक हिन्दी है।
- issue: וַתְּעַנֶּהָ में सारै के व्यवहार की गंभीरता
  choice: उसके साथ कठोर व्यवहार किया
  alternative: उसे सताया / उसके साथ दुर्व्यवहार किया
  rationale: मूल शब्द कठोरता, दुःख देने या अपमानित करने की ओर संकेत करता है, पर उसका ठीक रूप नहीं बताता। मुख्य पाठ गंभीरता बनाए रखते हुए अनावश्यक विशिष्टता से बचता है; विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में एकवचन आत्मीय/पारिवारिक ‘तेरी/तुझे’ मूल के स्त्रीलिंग एकवचन संबोधन को दर्शाता है। ‘तेरे हाथ में’ जैसे स्रोत-मुहावरे को अर्थ-स्पष्टता के कारण सुरक्षित रखा गया है।
