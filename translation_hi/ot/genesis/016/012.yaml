id: GEN.16.12
reference: Genesis 16:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/ה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣/וֹ בַ/כֹּ֔ל וְ/יַ֥ד כֹּ֖ל בּ֑/וֹ וְ/עַל פְּנֵ֥י כָל אֶחָ֖י/ו יִשְׁכֹּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/012.yaml
  text: And he will be a wild donkey of a man[a]; his hand will be against everyone, and everyone's hand against him[c][b], and he will dwell opposite all his brothers.
translation:
  language: hi
  text: और वह वन-गधे के समान मनुष्य होगा[a]। उसका हाथ सबके विरुद्ध होगा, और सबका हाथ उसके विरुद्ध होगा; और वह अपने सब भाइयों[c] के सामने बसेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वन-गधा मनुष्य।” इब्रानी में उसकी तुलना वन-गधे से की गई है—यह केवल उसे “जंगली” कहने के बजाय अदम्य स्वतंत्रता का बिंब है।
    reason: lexical_alternative
  - marker: b
    text: या “आमने-सामने,” “की उपस्थिति में,” अथवा “के विपरीत ओर।” इब्रानी पदबंध सामने या विरोध की स्थिति में रहने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: “भाइयों” में सगे भाइयों से आगे निकट संबंधी अथवा संबंधित जनसमूह भी सम्मिलित हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּרֶא אָדָם
  choice: वन-गधे के समान मनुष्य
  rationale: פֶּרֶא जंगली गधे या ओनागर को दर्शाता है, केवल अमूर्त अर्थ में ‘जंगली’ को नहीं। हिन्दी में ‘वन-गधे के समान मनुष्य’ उपमा को स्पष्ट रखते हुए स्वाभाविक अर्थ देता है और मूल के अदम्य, स्वतंत्र प्राणी-बिंब को सुरक्षित रखता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ यह सामान्य मानवजाति नहीं, बल्कि इश्माएल नामक विशिष्ट पुरुष के लिए प्रयुक्त है। ‘मनुष्य’ हिन्दी में इस भविष्यवाणी के गरिमापूर्ण स्वर के अनुकूल है।
- source_word: יָדוֹ בַכֹּל
  choice: उसका हाथ सबके विरुद्ध
  rationale: ‘हाथ’ विरोधी या शत्रुतापूर्ण कार्रवाई का मुहावरा है। ‘विरुद्ध’ प्रसंगगत अर्थ स्पष्ट करता है और हाथ का मूल बिंब बनाए रखता है।
- source_word: וְיַד כֹּל בּוֹ
  choice: सबका हाथ उसके विरुद्ध
  rationale: यह पिछले खंड के समानांतर पारस्परिक विरोध को व्यक्त करता है। ‘हाथ’ को बनाए रखने से इब्रानी समानांतरता सुरक्षित रहती है।
- source_word: וְעַל־פְּנֵי
  choice: के सामने
  rationale: इस पदबंध का स्थान-संबंधी अर्थ ‘सामने’, ‘आमने-सामने’ या ‘विपरीत ओर’ हो सकता है। ‘के सामने’ मूल अस्पष्टता को किसी निश्चित भौगोलिक दिशा या केवल विद्रोही भाव में सीमित नहीं करता।
- source_word: כָּל־אֶחָיו
  choice: अपने सब भाइयों
  rationale: אָח का प्राथमिक अर्थ ‘भाई’ है, यद्यपि यह निकट संबंधियों अथवा संबंधित जनसमूहों तक विस्तृत हो सकता है। मुख्य पाठ में सीधा अर्थ रखा गया है और व्यापक आशय पादटिप्पणी में बताया गया है।
- source_word: יִשְׁכֹּן
  choice: बसेगा
  rationale: שׁכן का अर्थ बसना, निवास करना या टिकना है। ‘बसेगा’ आधुनिक हिन्दी में स्वाभाविक है और स्थायी निवास का भाव देता है।
theological_decisions:
- issue: פֶּרֶא אָדָם में इश्माएल का चित्रण
  choice: 'पशु-बिंब को स्पष्ट रूप से बनाए रखना: ‘वन-गधे के समान मनुष्य’'
  alternative: ‘जंगली मनुष्य’
  rationale: मूल पाठ वन-गधे का सजीव बिंब प्रस्तुत करता है; उसे केवल ‘जंगली’ कहने से वह बिंब और उसमें निहित अदम्य स्वतंत्रता का भाव मिट जाता तथा अनावश्यक नैतिक निर्णय का आभास हो सकता है।
- issue: וְעַל־פְּנֵי का संबंधपरक आशय
  choice: मुख्य पाठ में ‘के सामने’, साथ में पादटिप्पणी द्वारा संभावित अर्थ
  alternative: ‘के विरोध में’ या ‘से अलग’
  rationale: इब्रानी पदबंध स्थान, निकट उपस्थिति अथवा आमने-सामने रहने का भाव दे सकता है। इसे निश्चित रूप से विद्रोह घोषित करना मूल की अर्थगत गुंजाइश को अनुचित ढंग से संकीर्ण करेगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज भविष्यवाणीपरक स्वर रखा गया है। ‘वन-गधा’ स्रोत के विशिष्ट पशु-बिंब को सुरक्षित करता है; ‘जंगली मनुष्य’ जैसे सपाट और संभावित रूप से अधिक निंदात्मक रूप से बचा गया है। सभी अर्थगत विकल्पों को मुख्य पाठ में जबरन हल करने के बजाय पादटिप्पणियों में सुरक्षित रखा गया है।
