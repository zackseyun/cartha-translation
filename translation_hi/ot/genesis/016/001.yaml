lexical_decisions:
- source_word: וְשָׂרַי
  choice: सारै
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय रूप में रखा गया है। आरम्भिक וְ कथा को जोड़ता है; अलग से ‘और’ लगाना हिन्दी में अनावश्यक और बोझिल होता।
- source_word: אֵשֶׁת אַבְרָם
  choice: अब्राम की पत्नी
  rationale: इब्रानी संबंधवाचक संरचना का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: לֹא יָלְדָה לוֹ
  choice: उसके लिए कोई संतान नहीं जनी थी
  rationale: क्रिया יָלַד यहाँ पति के लिए संतान जनने के अर्थ में है। ‘संतान’ प्रसंग से निहित कर्म को स्पष्ट करता है, और ‘जनी थी’ पृष्ठभूमि में दी गई पूर्व स्थिति को व्यक्त करता है।
- source_word: וְלָהּ
  choice: उसके पास … थी
  rationale: इब्रानी अधिकारसूचक संरचना ‘उसके लिए/पास थी’ को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: שִׁפְחָה
  choice: दासी
  rationale: यह शब्द घराने की अधीन और बँधुआ स्त्री को सूचित करता है। ‘दासी’ संक्षिप्त, स्वाभाविक हिन्दी है; सामाजिक स्थिति को अधिक स्पष्ट करने के लिए पादटिप्पणी दी गई है।
- source_word: מִצְרִית
  choice: मिस्री
  rationale: स्त्री की मिस्री पहचान को प्रचलित हिन्दी विशेषण से व्यक्त किया गया है।
- source_word: וּשְׁמָהּ הָגָר
  choice: हाजिरा नाम की
  rationale: नाम बताने वाली इब्रानी उपवाक्य-रचना को सहज हिन्दी विशेषणात्मक पद में बदला गया है; ‘हाजिरा’ प्रचलित हिन्दी नाम-रूप है।
