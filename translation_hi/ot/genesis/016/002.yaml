id: GEN.16.2
reference: Genesis 16:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר שָׂרַ֜י אֶל אַבְרָ֗ם הִנֵּה נָ֞א עֲצָרַ֤/נִי יְהוָה֙ מִ/לֶּ֔דֶת בֹּא נָא֙ אֶל שִׁפְחָתִ֔/י אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑/נָּה וַ/יִּשְׁמַ֥ע אַבְרָ֖ם לְ/ק֥וֹל שָׂרָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/002.yaml
  text: Then Sarai said to Abram[a], “Look now, Yahweh has kept me from bearing children. Please go in to my female servant; perhaps I will be built up through her.” And Abram listened to the voice of Sarai.
translation:
  language: hi
  text: तब सारै ने अब्राम से कहा, “देखो, यहोवा ने मुझे बच्चे जनने से रोक रखा है। कृपया मेरी दासी के पास जाओ; शायद उसके द्वारा मेरा घराना बस जाए[a]।” और अब्राम ने सारै की बात मान ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक भाव है, “शायद मैं उसके द्वारा बनाई जाऊँ।” इसका अर्थ “शायद उसके द्वारा मुझे संतान मिले” या “शायद उसके द्वारा मेरा परिवार/वंश स्थापित हो” भी समझा जा सकता है।
    reason: निर्माण की मूल इब्रानी उपमा और उसके संभावित संतान/परिवार संबंधी अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम को स्पष्ट करता है।
- source_word: הִנֵּה נָא
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला स्वाभाविक आधुनिक हिन्दी प्रयोग है; यहाँ נָא के विनम्र/आग्रहपूर्ण भाव को प्रसंग और अगले स्पष्ट ‘कृपया’ से पर्याप्त सहारा मिलता है।
- source_word: עֲצָרַנִי יְהוָה מִלֶּדֶת
  choice: यहोवा ने मुझे बच्चे जनने से रोक रखा है
  rationale: यह मूल पाठ में यहोवा की सक्रिय भूमिका और सारै की वर्तमान निःसंतान दशा, दोनों को बिना नरम किए व्यक्त करता है।
- source_word: בֹּא נָא אֶל
  choice: कृपया ... के पास जाओ
  rationale: मूल का शिष्ट व्यंजना-प्रयोग यौन-संबंध की ओर संकेत करता है; हिन्दी में ‘के पास जाओ’ उसी अप्रत्यक्षता को बनाए रखता है।
- source_word: שִׁפְחָתִי
  choice: मेरी दासी
  rationale: ‘दासी’ स्त्री की अधीन और बंधुआ सामाजिक स्थिति को गरिमापूर्ण तथा संक्षिप्त हिन्दी में व्यक्त करता है; ‘नौकरानी’ उस स्थिति को अनावश्यक रूप से नरम कर देता।
- source_word: אוּלַי אִבָּנֶה מִמֶּנָּה
  choice: शायद उसके द्वारा मेरा घर बस जाए
  rationale: यह हिन्दी में स्वाभाविक रहते हुए ‘बनाए जाने/घर बनने’ की इब्रानी उपमा और उसके द्वारा संतान तथा परिवार मिलने की आशा को सुरक्षित रखता है।
- source_word: וַיִּשְׁמַע אַבְרָם לְקוֹל שָׂרָי
  choice: और अब्राम ने सारै की बात मान ली
  rationale: इब्रानी मुहावरे ‘आवाज़ सुनना’ का आशय यहाँ सहमत होकर कहना मानना है; हिन्दी का ‘बात मान ली’ उसी अर्थ को स्वाभाविक रूप से देता है।
theological_decisions:
- issue: सारै के निःसंतान होने में यहोवा की भूमिका
  choice: यहोवा ने मुझे बच्चे जनने से रोक रखा है
  alternative: यहोवा के कारण मेरे बच्चे नहीं हुए
  rationale: मूल पाठ सारै के कथन में रोकने की क्रिया सीधे यहोवा से जोड़ता है; अनुवाद इसे न तो नरम करता है, न इसके लिए कोई अतिरिक्त धर्मवैज्ञानिक स्पष्टीकरण देता है।
- issue: यौन-संबंध के व्यंजना-प्रयोग की स्पष्टता
  choice: मेरी दासी के पास जाओ
  alternative: मेरी दासी के साथ संबंध बनाओ
  rationale: मूल पाठ प्रत्यक्ष शब्दावली के बजाय प्रचलित व्यंजना का उपयोग करता है। चुना हुआ रूप उसी संयमित रजिस्टर और प्रसंगगत अर्थ को बनाए रखता है।
- issue: אִבָּנֶה की परिवार-निर्माण संबंधी उपमा
  choice: मेरा घर बस जाए
  alternative: मुझे उसके द्वारा संतान मिले
  rationale: चुना हुआ पाठ संतान पाने का प्रसंगगत अर्थ देते हुए ‘निर्माण’ की उपमा को पूरी तरह समाप्त नहीं करता; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यहोवा’ से व्यक्तिगत ईश्वरीय नाम को दर्शाया गया है। ‘दासी’ मूल सामाजिक स्थिति को ‘नौकरानी’ जैसे नरम शब्द से नहीं बदलता। यौन-संबंध के लिए मूल की व्यंजना बनाए रखी गई है।
