  text: וַ/תִּקְרָ֤א שֵׁם יְהוָה֙ הַ/דֹּבֵ֣ר אֵלֶ֔י/הָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה הֲ/גַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/013.yaml
  text: So she called the name of Yahweh who spoke to her[a], “You are a God who sees me,” for she said[c][b], “Have I really here seen after the One who sees me?”
translation:
  language: hi
  text: तब उसने उससे बात करने वाले याहवे को यह नाम दिया:[c] “तू मुझे देखने वाला परमेश्वर है।”[a] क्योंकि उसने कहा, “क्या मैंने सचमुच यहाँ भी मुझे देखने वाले के बाद देखा है?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “तू देखने वाला परमेश्वर है” या “तू दर्शन का परमेश्वर है” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम वाक्यांश का इब्रानी पाठ कठिन है। इसका भाव यह भी हो सकता है: “क्या मैंने यहाँ भी उसे देखा और उसके मुझे देखने के बाद जीवित रही?”'
    reason: alternative_reading
  - marker: c
    text: 'अधिक शाब्दिक अनुवाद: “तब उसने उससे बात करने वाले याहवे का नाम पुकारा।”'
    reason: literal_alternative
lexical_decisions:
- source_word: וַתִּקְרָא שֵׁם
  choice: उसने ... को यह नाम दिया
  rationale: इब्रानी मुहावरे का अर्थ किसी के लिए नाम या वर्णनात्मक उपाधि निर्धारित करना है। शाब्दिक ‘नाम पुकारा’ हिन्दी में केवल पहले से विद्यमान नाम का उच्चारण समझा जा सकता है, इसलिए मुख्य पाठ में स्वाभाविक और स्पष्ट रूप चुना गया है; अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: הַדֹּבֵר אֵלֶיהָ
  choice: उससे बात करने वाले
  rationale: कृदन्तीय पद याहवे की पहचान उस व्यक्ति के रूप में कराता है जो हाजिरा से बोल रहा था; हिन्दी में यह संबंधवाचक कृदन्त स्वाभाविक है।
- source_word: אַתָּה אֵל רֳאִי
  choice: तू मुझे देखने वाला परमेश्वर है
  rationale: रֳאִי कठिन रूप है और ‘देखने’, ‘देखने वाला’ अथवा ‘मुझे देखने वाला’ का भाव दे सकता है। प्रसंग के अनुसार ‘मुझे देखने वाला’ उपयुक्त है, जबकि हिन्दी में उपपद न होने से ‘एक’ या ‘वही’ जोड़कर निश्चितता का प्रश्न अनावश्यक रूप से तय नहीं किया गया।
- source_word: כִּי אָֽמְרָה
  choice: क्योंकि उसने कहा
  rationale: यह हाजिरा द्वारा दिए गए नाम का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: הֲגַם הֲלֹם
  choice: क्या मैंने सचमुच यहाँ
  rationale: प्रश्नसूचक और बलसूचक अव्ययों से प्रकट आश्चर्य को ‘क्या’ और ‘सचमुच’ द्वारा व्यक्त किया गया है।
- source_word: רָאִיתִי אַחֲרֵי רֹאִי
  choice: अपने देखने वाले के बाद देखा है
  rationale: यह अत्यंत कठिन और संक्षिप्त इब्रानी वाक्यांश है। अनुवाद में ‘देखा’, ‘बाद’ और ‘मेरे/मुझे देखने वाले’ के मूल घटकों को बनाए रखा गया है, ताकि जीवित बचने या पीठ देखने की किसी एक व्याख्या को मुख्य पाठ में निश्चित न किया जाए।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में निजी नाम है; उसे उपाधि से बदलने के बजाय लिप्यंतरण उसके नामात्मक स्वरूप को सुरक्षित रखता है।
- issue: אֵל רֳאִי में हाजिरा की ईश्वरीय उपाधि
  choice: तू मुझे देखने वाला परमेश्वर है
  alternative: तू देखने वाला परमेश्वर है / तू दर्शन का परमेश्वर है
  rationale: चयन निकटवर्ती प्रसंग में हाजिरा पर परमेश्वर की दृष्टि को व्यक्त करता है, पर हिन्दी में ‘एक’ या ‘वही’ न जोड़कर इब्रानी की निश्चितता-संबंधी खुली संभावना बनाए रखता है।
- issue: रָאִיתִי אַחֲרֵי רֹאִי की व्याख्या
  choice: क्या मैंने सचमुच यहाँ अपने देखने वाले के बाद देखा है?
  alternative: क्या मैंने यहाँ उसे देखने के बाद भी जीवित रहकर देखा है, जिसने मुझे देखा?
  rationale: मूल इब्रानी अस्पष्ट और व्याकरण की दृष्टि से कठिन है। मुख्य पाठ उसके प्रमुख शब्दों और तनाव को सुरक्षित रखता है; जीवित बचने की प्रचलित व्याख्या को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली अपनाई गई है। याहवे के लिए सम्मानसूचक बहुवचन के बजाय प्रत्यक्ष संबोधन ‘तू’ रखा गया है, क्योंकि यह नामरूपी कथन की संक्षिप्तता और इब्रानी एकवचन को स्वाभाविक हिन्दी में व्यक्त करता है। अंतिम प्रश्न को जानबूझकर कुछ असामान्य रखा गया है, क्योंकि मूल इब्रानी स्वयं अत्यंत कठिन है; पादटिप्पणी पाठक को प्रमुख व्याख्यात्मक विकल्प देती है।
