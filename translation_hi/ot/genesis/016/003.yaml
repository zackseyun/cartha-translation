source:
  edition: WLC
  text: וַ/תִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת אַבְרָ֗ם אֶת הָגָ֤ר הַ/מִּצְרִית֙ שִׁפְחָתָ֔/הּ מִ/קֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְ/שֶׁ֥בֶת אַבְרָ֖ם בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/אַבְרָ֥ם אִישָׁ֖/הּ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female servant, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
translation:
  language: hi
  text: तब, अब्राम के कनान देश में रहते हुए दस वर्ष बीत जाने पर, उसकी पत्नी सारै ने अपनी मिस्री दासी[a] हाजिरा को लिया और उसे अपने पति अब्राम को पत्नी के रूप में[b] दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘दासी’ का हिब्रू शब्द ऐसी स्त्री को सूचित करता है जो गुलामी की स्थिति में थी।
    reason: मूल सामाजिक स्थिति को स्पष्ट करना।
  - marker: b
    text: शाब्दिक अर्थ ‘पत्नी के रूप में’ है; इसी पद में हाजिरा को सारै की दासी भी कहा गया है।
    reason: पाठ में साथ-साथ उपस्थित दोनों स्थितियों को बनाए रखना।
lexical_decisions:
- source_word: וַתִּקַּח
  choice: ले लिया
  rationale: कथात्मक प्रयोग में לקח का सामान्य अर्थ ‘लेना’ है; यहाँ इसके बाद हाजिर को अब्राम को दिए जाने का वर्णन है।
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: अब्राम की पत्नी सारै
  rationale: यह संबंधसूचक पद सारै की पहचान अब्राम की पत्नी के रूप में कराता है; हिंदी में यह क्रम स्वाभाविक है।
- source_word: הָגָר הַמִּצְרִית
  choice: अपनी मिस्री ... हाजिर
  rationale: הַמִּצְרִית हाजिर के मिस्री मूल को बताता है; नाम का प्रचलित हिंदी रूप ‘हाजिर’ रखा गया है।
- source_word: שִׁפְחָתָהּ
  choice: अपनी ... दासी
  rationale: שִׁפְחָה आश्रित घरेलू सेविका से अधिक, एक गुलाम स्त्री की सामाजिक स्थिति भी व्यक्त कर सकता है। ‘दासी’ हिंदी में संक्षिप्त और गरिमापूर्ण है, जबकि पादटिप्पणी बंधुआ स्थिति स्पष्ट करती है।
- source_word: מִקֵּץ עֶשֶׂר שָׁנִים
  choice: दस वर्ष बीत जाने पर
  rationale: यह पद दस वर्षों की अवधि पूरी होने का समय बताता है; चुना हुआ रूप आधुनिक हिंदी में स्वाभाविक है।
- source_word: לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן
  choice: अब्राम को कनान देश में रहते हुए
  rationale: इनफ़िनिटिव रचना अब्राम के कनान में निवास को दस वर्षों की अवधि का संदर्भ बनाती है।
- source_word: וַתִּתֵּן אֹתָהּ לְאַבְרָם אִישָׁהּ
  choice: उसे अपने पति अब्राम को ... दे दिया
  rationale: कथात्मक क्रम और ‘उसका पति’ संबंध दोनों को सहज हिंदी में सुरक्षित रखा गया है।
- source_word: לוֹ לְאִשָּׁה
  choice: पत्नी के रूप में
  rationale: אִשָּׁה यहाँ पत्नी का दर्जा व्यक्त करता है। ‘पत्नी के रूप में’ मूल के औपचारिक बल को बनाए रखता है और अनावश्यक रूप से ‘उपपत्नी’ नहीं कहता।
theological_decisions:
- issue: अब्राम के संबंध में हाजिर की स्थिति
  choice: שִׁפְחָתָהּ को ‘दासी’ और לְאִשָּׁה को ‘पत्नी के रूप में’ अनूदित किया गया।
  alternative: ‘सेविका’ और ‘उपपत्नी’
  rationale: हिब्रू पाठ हाजिर को सारै की שִׁפְחָה बताता है, पर अब्राम के संबंध में स्पष्टतः אִשָּׁה शब्द प्रयोग करता है। अनुवाद दोनों सामाजिक वास्तविकताओं को बनाए रखता है और उनके बीच के तनाव को किसी एक पारंपरिक श्रेणी में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, कथात्मक और गरिमापूर्ण रूप अपनाया गया है। समयसूचक वाक्यांश को स्वाभाविक हिंदी क्रम में रखा गया है और हाजिर की दासी तथा पत्नी—दोनों स्थितियों को बिना सामंजस्य बैठाए व्यक्त किया गया है।
