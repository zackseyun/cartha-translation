  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר הָגָ֞ר שִׁפְחַ֥ת שָׂרַ֛י אֵֽי מִ/זֶּ֥ה בָ֖את וְ/אָ֣נָה תֵלֵ֑כִי וַ/תֹּ֕אמֶר מִ/פְּנֵי֙ שָׂרַ֣י גְּבִרְתִּ֔/י אָנֹכִ֖י בֹּרַֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/008.yaml
  text: And he said[a], “Hagar, Sarai’s servant woman, where have you come from, and where are you going?” And she said[b], “I am fleeing from the presence of Sarai my mistress.”
translation:
  language: hi
  text: उसने कहा, “सारै की दासी[a] हाजिरा, तुम कहाँ से आई हो और कहाँ जा रही हो?” उसने कहा, “मैं अपनी स्वामिनी सारै की उपस्थिति से भाग रही हूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गुलाम स्त्री”; इब्रानी शब्द सारै के अधीन एक पराधीन स्त्री की स्थिति दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “सारै, मेरी स्वामिनी, के सामने से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  choice: दासी
  rationale: यह शब्द सारै के अधीन हाजिरा की बँधी हुई सेवकीय स्थिति को दर्शाता है। ‘दासी’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है; पादटिप्पणी स्पष्ट करती है कि यहाँ केवल घरेलू सेविका नहीं, बल्कि पराधीन स्त्री अभिप्रेत है।
- source_word: אֵי מִזֶּה בָאת
  choice: तुम कहाँ से आई हो
  rationale: यह मूल इब्रानी के उद्गम-सम्बन्धी प्रश्न को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְאָנָה תֵלֵכִי
  choice: और कहाँ जा रही हो
  rationale: यह गन्तव्य के प्रश्न तथा चल रही या निकट भविष्य की क्रिया—दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: מִפְּנֵי
  choice: के पास से
  rationale: मूल अर्थ ‘मुख/उपस्थिति के सामने से’ है। प्रसंग में यह किसी व्यक्ति की उपस्थिति छोड़कर भागने को दर्शाता है; ‘के पास से’ हिन्दी में स्वाभाविक रहते हुए उस स्थानिक भाव को सँजोता है।
- source_word: גְּבִרְתִּי
  choice: अपनी स्वामिनी
  rationale: स्त्रीलिंग पद हाजिरा पर अधिकार रखने वाली स्त्री को सूचित करता है। ‘स्वामिनी’ सामाजिक असमानता को ‘मालकिन’ की तुलना में अधिक गरिमापूर्ण, पर स्पष्ट ढंग से व्यक्त करता है।
- source_word: בֹּרַחַת
  choice: भाग रही हूँ
  rationale: स्त्रीलिंग कृदन्त जारी क्रिया बताता है; हिन्दी का प्रगतिशील रूप उसी भाव को सुरक्षित रखता है।
- source_word: וַיֹּאמַר
  choice: उसने कहा
  rationale: मूल पद पिछले पद के वक्ता का उल्लेख दोहराए बिना केवल ‘उसने कहा’ कहता है; हिन्दी अनुवाद भी वक्ता की उपाधि नहीं जोड़ता।
- source_word: שָׂרַי
  choice: सारै
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यन्तरण।
- source_word: הָגָר
  choice: हाजिरा
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यन्तरण।
theological_decisions:
- issue: हाजिरा की सामाजिक स्थिति का अनुवाद
  choice: दासी
  alternative: सेविका / नौकरानी
  rationale: मूल शब्द पराधीन और बँधी हुई सामाजिक स्थिति व्यक्त करता है। ‘दासी’ इस असमान सम्बन्ध को नरम किए बिना स्वाभाविक हिन्दी देता है; पादटिप्पणी अर्थ-सीमा स्पष्ट करती है।
- issue: वक्ता को ‘यहोवा का दूत’ कहकर स्पष्ट करना
  choice: उसने कहा
  alternative: यहोवा के दूत ने कहा
  rationale: पिछले पद से वक्ता स्पष्ट है, पर इस पद में उपाधि दोहराई नहीं गई। इसलिए अनुवाद मूल पद की अभिव्यक्ति को बनाए रखता है।
- issue: מִפְּנֵי के स्थानिक अथवा कारणात्मक भाव का निर्वाह
  choice: के पास से
  alternative: के कारण / से दूर
  rationale: यहाँ उत्तर उस स्थान/व्यक्ति को बताता है जहाँ से हाजिरा भाग रही है। कारणात्मक अर्थ सम्भव संदर्भगत निष्कर्ष है, पर मूल अभिव्यक्ति को स्थानिक रूप में रखना अस्पष्टता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में स्त्रीलिंग क्रियारूप मूल के अनुरूप हैं। ‘दासी’ और ‘स्वामिनी’ सामाजिक असमानता को स्पष्ट रखते हैं, जबकि पादटिप्पणियाँ मूल इब्रानी की अर्थ-सीमा और शाब्दिक रूप बताती हैं।
