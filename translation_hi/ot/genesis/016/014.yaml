source:
  edition: WLC
  text: עַל כֵּן֙ קָרָ֣א לַ/בְּאֵ֔ר בְּאֵ֥ר לַחַ֖י רֹאִ֑י הִנֵּ֥ה בֵין קָדֵ֖שׁ וּ/בֵ֥ין בָּֽרֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/014.yaml
  text: Therefore the well was called Beer-lahai-roi. Look, it is between Kadesh and Bered.
translation:
  language: hi
  text: इसलिए उस कुएँ का नाम बेएर-लहै-रोई[a] पड़ा। देखो, वह कादेश और बेरेद के बीच में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बेएर-लहै-रोई” का अर्थ संभवतः “उस जीवित जन का कुआँ जो मुझे देखता है” है। हिब्रू पदबंध को “जीवित जन के मेरे दर्शन का कुआँ” जैसे भिन्न अर्थ में भी समझा जा सकता है।
    reason: स्थान-नाम का संभावित अर्थ स्पष्ट करते हुए हिब्रू पदबंध की वास्तविक व्याख्यात्मक अस्पष्टता को अधिक सटीक रूप से सुरक्षित रखना।
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पिछले पद में हाजिरा के अनुभव और कुएँ के नामकरण के बीच परिणामसूचक संबंध व्यक्त करता है।
- source_word: קָרָא לַבְּאֵר
  choice: उस कुएँ का नाम ... पड़ा
  rationale: हिब्रू में क्रिया सक्रिय एकवचन है, पर कर्ता व्यक्त नहीं किया गया; हिंदी का यह स्वाभाविक भाववाचक प्रयोग अनिश्चित कर्ता को बिना जोड़े नामकरण का अर्थ देता है।
- source_word: בְּאֵר לַחַי רֹאִי
  choice: बेएर-लहै-रोई
  rationale: स्थान-नाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है; उसके अर्थ की जटिलता फुटनोट में सुरक्षित है।
- source_word: הִנֵּה
  choice: देखो
  rationale: मूल पाठ के ध्यान आकर्षित करने वाले प्रत्यक्ष संकेत को बनाए रखता है और अंग्रेज़ी परामर्श पाठ के संशोधन से भी मेल खाता है।
- source_word: קָדֵשׁ ... בָּרֶד
  choice: कादेश ... बेरेद
  rationale: दोनों भौगोलिक नामों का स्रोत-आधारित देवनागरी लिप्यंतरण है।
theological_decisions:
- issue: कुएँ के नाम में परमेश्वर को देखने या परमेश्वर द्वारा देखे जाने का संबंध
  choice: नाम को मुख्य पाठ में लिप्यंतरित कर उसके संभावित अर्थ फुटनोट में देना
  alternative: मुख्य पाठ में केवल एक निश्चित अर्थ, जैसे ‘मुझे देखनेवाले जीवित परमेश्वर का कुआँ’, रख देना
  rationale: לַחַי רֹאִי की व्याकरणिक और प्रसंगगत व्याख्या में वास्तविक अस्पष्टता है; एक अर्थ को निर्विवाद बनाना उचित नहीं होगा।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। ‘देखो’ द्वारा मूल הִנֵּה का बल बनाए रखा गया है; स्थान-नाम स्रोत-उच्चारण के निकट रखे गए हैं।
