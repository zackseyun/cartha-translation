  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה שׁ֖וּבִי אֶל גְּבִרְתֵּ֑/ךְ וְ/הִתְעַנִּ֖י תַּ֥חַת יָדֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/009.yaml
  text: Then the angel of Yahweh said to her[c][b][a], “Return to your mistress and humble yourself under her hand.”
translation:
  language: hi
  text: तब याहवे के दूत[a] ने उससे कहा, “अपनी स्वामिनी के पास लौट जा और अपने आपको उसके अधीन कर ले[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दूत” का अर्थ “संदेशवाहक” भी हो सकता है; इस प्रसंग में इसे “स्वर्गदूत” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने आपको उसके अधिकार के अधीन कर ले।” इस क्रिया में अधीन होकर दुःख या कठोर व्यवहार सहने की स्थिति स्वीकार करने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे का दूत
  rationale: מַלְאַךְ का मूल अर्थ ‘दूत/संदेशवाहक’ है और इस दिव्य-मुठभेड़ के प्रसंग में यह स्वर्गदूत को सूचित करता है। ‘दूत’ हिंदी में स्वाभाविक है और शब्द की मूल व्यापकता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: שׁוּבִי
  choice: लौट जा
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप की सीधी और स्वाभाविक हिंदी अभिव्यक्ति।
- source_word: גְּבִרְתֵּךְ
  choice: अपनी स्वामिनी
  rationale: यह शब्द हाजिरा पर अधिकार रखने वाली स्त्री वरिष्ठ को सूचित करता है; ‘स्वामिनी’ सामाजिक संबंध को ‘मालकिन’ की अपेक्षा अधिक गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וְהִתְעַנִּי
  choice: अपने आपको दीन कर
  rationale: हित्पाएल आज्ञार्थक रूप दीन या अधीन स्थिति स्वीकार करने का भाव देता है। यह अनुवाद आत्मवाचक बल बनाए रखता है, जबकि कष्ट सहने की संभावित छाया को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תַּחַת יָדֶיהָ
  choice: उसके हाथ के नीचे
  rationale: मूल इब्रानी बिंब को बनाए रखा गया है; इसका आशय उसके अधिकार या अधीनता में होना है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: מַלְאַךְ की पहचान
  choice: दूत
  alternative: संदेशवाहक; स्वर्गदूत
  rationale: प्रसंग अलौकिक दूत की ओर संकेत करता है, पर पद स्वयं उसकी तात्त्विक पहचान को और अधिक परिभाषित नहीं करता। ‘दूत’ इस संयम और मूल शब्द की अर्थ-सीमा दोनों को बनाए रखता है।
- issue: וְהִתְעַנִּי में अधीनता और दुःख सहने का तनाव
  choice: अपने आपको दीन कर
  alternative: उसके अधीन हो जा; उसके अधिकार में कष्ट स्वीकार कर
  rationale: क्रिया दीन होने या अपने को अधीन करने का भाव देती है और इसी धातु का निकटवर्ती प्रसंग में पीड़ित करने से संबंध है। मुख्य पाठ आत्मवाचक आज्ञा को रखता है; पादटिप्पणी संभावित कठोर अर्थ को छिपाती नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। ‘लौट जा’ और ‘अपने आपको दीन कर’ मूल आज्ञाओं की प्रत्यक्षता बनाए रखते हैं। इब्रानी मुहावरे को मुख्य पाठ में सुरक्षित रखकर उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
