  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण गद्य। पिछले पद से जुड़े कर्ताओं की सूची को हिंदी में पूर्ण वाक्य बनाने के लिए ‘भी गया’ जोड़ा गया है; यह पूर्ववर्ती क्रिया का संदर्भगत विस्तार है। ‘यूसुफ़’ प्रचलित हिंदी बाइबलीय वर्तनी के अनुसार लिखा गया है।
