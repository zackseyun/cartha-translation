base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/008.yaml
  text: and all the household of Joseph[a], and his brothers, and his father's household; only their little ones, their flocks[c][b], and their herds they left in the land of Goshen.
translation:
  language: hi
  text: और यूसुफ़ का सारा घराना[a], उसके भाई और उसके पिता का घराना भी उसके साथ गए; वे केवल अपने छोटे बच्चों[b], भेड़-बकरियों और गाय-बैलों को गोशेन देश में छोड़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “यूसुफ़ का घर ... उसके पिता का घर।” यहाँ “घर” का अर्थ परिवार या घराना है, केवल इमारत नहीं।
    reason: lexical_alternative
  - marker: b
    text: “छोटे बच्चों” के लिए प्रयुक्त इब्रानी शब्द नन्हे बच्चों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בֵּית יוֹסֵף
  choice: और यूसुफ़ का सारा घराना
  rationale: כֹל की समग्रता को ‘सारा’ व्यक्त करता है, और בֵּית यहाँ भवन नहीं बल्कि परिवार/घराने के लोगों का बोध कराता है।
- source_word: וְאֶחָיו
  choice: उसके भाई
  rationale: बहुवचन אָח इस संदर्भ में यूसुफ़ के पुरुष सहोदरों को सूचित करता है।
- source_word: וּבֵית אָבִיו
  choice: और उसके पिता का घराना
  rationale: בֵּית אָבִיו का अर्थ पिता से संबद्ध परिवार या घराना है, न कि केवल घर की इमारत।
- source_word: רַק טַפָּם
  choice: केवल अपने छोटे बच्चों
  rationale: רַק अपवाद/सीमा प्रकट करता है; טַף विशेष रूप से छोटे बच्चों को सूचित करता है। हिंदी में कर्ता के अनुरूप ‘अपने’ स्वाभाविक है।
- source_word: וְצֹאנָם
  choice: भेड़-बकरियों
  rationale: צֹאן छोटे पालतू पशुओं, मुख्यतः भेड़ों और बकरियों, के सामूहिक झुंड का द्योतक है; स्पष्ट हिंदी के लिए पशुओं के नाम दिए गए हैं।
- source_word: וּבְקָרָם
  choice: और गाय-बैलों
  rationale: בָּקָר बड़े मवेशियों, विशेषतः गोवंश, का सामूहिक पद है; ‘गाय-बैल’ सामान्य आधुनिक हिंदी में स्पष्ट है।
- source_word: עָזְבוּ
  choice: छोड़ गए
  rationale: क्रिया का अर्थ जानबूझकर पीछे छोड़ना है; ‘त्याग दिया’ अनावश्यक रूप से परित्याग का कठोर भाव देता।
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: गोशेन देश में
  rationale: אֶרֶץ को ‘देश’ से व्यक्त कर मूल का भौगोलिक संकेत सुरक्षित रखा गया है।
