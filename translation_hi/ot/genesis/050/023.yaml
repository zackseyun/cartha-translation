  text: וַ/יַּ֤רְא יוֹסֵף֙ לְ/אֶפְרַ֔יִם בְּנֵ֖י שִׁלֵּשִׁ֑ים גַּ֗ם בְּנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה יֻלְּד֖וּ עַל בִּרְכֵּ֥י יוֹסֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/023.yaml
  text: Joseph saw Ephraim’s children to the third generation[a]. Also[b], the children of Machir son of Manasseh were born on Joseph’s knees.
translation:
  language: hi
  text: यूसुफ ने एप्रैम की तीसरी पीढ़ी तक के वंशजों को देखा[a]। मनश्शे के पुत्र माकीर के बच्चे भी यूसुफ के घुटनों पर जन्मे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यूसुफ इतना जीवित रहा कि उसने एप्रैम की तीसरी पीढ़ी तक के वंशजों को देखा।” इब्रानी में शाब्दिक रूप से “यूसुफ ने देखा” है।
    reason: lexical_alternative
  - marker: b
    text: “यूसुफ के घुटनों पर जन्मे” एक इब्रानी मुहावरा है। इससे बच्चों को परिवार में मान्यता देने, ग्रहण करने या विशेष रूप से स्वीकार करने का भाव प्रकट हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: यह क्रिया का सीधा अर्थ है। इस वंशावली और दीर्घायु के प्रसंग में आशय यह भी हो सकता है कि यूसुफ इतने समय तक जीवित रहा कि उसने इन वंशजों को देखा; मुख्य पाठ में इब्रानी अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: לְאֶפְרַיִם בְּנֵי שִׁלֵּשִׁים
  choice: एप्रैम की तीसरी पीढ़ी तक के वंशजों
  rationale: לְאֶפְרַיִם यहाँ वंश-संबंध बताता है और בְּנֵי שִׁלֵּשִׁים तीसरी पीढ़ी तक फैले वंश को सूचित करता है। ‘वंशज’ आधुनिक हिन्दी में स्वाभाविक है और किसी अधिक विशिष्ट रिश्ते को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: גַּם
  choice: भी
  rationale: यह दूसरी वंशावली-सूचना को पहली के साथ जोड़ता है; हिन्दी में ‘भी’ सरल और स्वाभाविक है।
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: मनश्शे के पुत्र माकीर के बच्चे
  rationale: पदक्रम को स्वाभाविक हिन्दी में रखते हुए माकीर की पहचान मनश्शे के पुत्र के रूप में स्पष्ट की गई है। בְּנֵי को यहाँ व्यापक अर्थ में ‘बच्चे’ कहा गया है, क्योंकि प्रसंग वंश का है और केवल पुरुष संतानों पर बल आवश्यक नहीं।
- source_word: יֻלְּדוּ
  choice: जन्मे
  rationale: यह ילד का निष्क्रिय रूप है और इसका सीधा अर्थ ‘जन्मे’ है।
- source_word: עַל בִּרְכֵּי יוֹסֵף
  choice: यूसुफ के घुटनों पर
  rationale: ठोस इब्रानी सांस्कृतिक बिंब को मुख्य पाठ में बनाए रखा गया है; उसके संभावित पारिवारिक आशय को पाद-टिप्पणी में समझाया गया है।
theological_decisions:
- issue: ‘यूसुफ के घुटनों पर जन्मे’ मुहावरे का आशय
  choice: मुख्य पाठ में ठोस इब्रानी मुहावरा ज्यों का त्यों रखा गया
  alternative: इसे ‘यूसुफ ने उन्हें अपने परिवार के रूप में स्वीकार किया’ जैसे व्याख्यात्मक वाक्य से बदलना
  rationale: मुहावरा पारिवारिक मान्यता, ग्रहण या विशेष स्वीकृति का संकेत दे सकता है, पर उसका सटीक आशय निश्चित नहीं है। इसलिए किसी एक व्याख्या को मुख्य पाठ में निर्णायक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सहज गद्य। ‘मनश्शे’ और ‘माकीर’ जैसे नाम हिन्दी बाइबिल-परंपरा के परिचित रूपों में रखे गए हैं। वंशावली-संबंधी भाषा को स्पष्ट रखा गया है, जबकि इब्रानी मुहावरे की वास्तविक अस्पष्टता सुरक्षित है।
