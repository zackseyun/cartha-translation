  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दल’ चल रहे विशाल जनसमूह के लिए चुना गया है; ‘छावनी’ का शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
