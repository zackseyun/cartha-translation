id: GEN.50.9
reference: Genesis 50:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֣עַל עִמּ֔/וֹ גַּם רֶ֖כֶב גַּם פָּרָשִׁ֑ים וַ/יְהִ֥י הַֽ/מַּחֲנֶ֖ה כָּבֵ֥ד מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/009.yaml
  text: Chariots and horsemen also went up with him[c][b][a], and the company became very large.
translation:
  language: hi
  text: रथ[a] और घुड़सवार भी उसके साथ चढ़ गए,[b] और वह दल बहुत बड़ा था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘रथ’ एकवचन है, पर यहाँ उसका प्रयोग पूरे रथ-दल के लिए सामूहिक अर्थ में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: 'इसे इस प्रकार भी अनूदित किया जा सकता है: ‘रथ भी उसके साथ चढ़ गए, और घुड़सवार भी।’'
    reason: previous_rendering
  - marker: c
    text: शाब्दिक रूप से, ‘वह छावनी बहुत भारी थी’; अर्थात वह दल बहुत विशाल, भारी-भरकम या प्रभावशाली था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: चढ़ गए
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है। यात्रा के इस प्रसंग में ‘चढ़ गए’ दिशा-सूचक भाव को बनाए रखता है और स्वाभाविक हिन्दी भी है।
- source_word: עִמּוֹ
  choice: उसके साथ
  rationale: पूर्वसर्ग और सर्वनाम-प्रत्यय का सीधा अनुवाद; प्रसंग में सर्वनाम यूसुफ़ की ओर संकेत करता है।
- source_word: גַּם ... גַּם
  choice: रथ और घुड़सवार भी
  rationale: दोहराया गया גַּם दोनों समूहों को अतिरिक्त साथियों के रूप में जोड़ता है। हिन्दी में ‘रथ और घुड़सवार भी’ इस युग्म और जोड़ के भाव को सहज रूप से व्यक्त करता है।
- source_word: רֶכֶב
  choice: रथ
  rationale: इब्रानी में शब्द एकवचन है, पर सामूहिक अर्थ में रथ-दल को दर्शाता है। हिन्दी ‘रथ’ संख्या की दृष्टि से भी सामूहिक रूप में स्वाभाविक है।
- source_word: פָּרָשִׁים
  choice: घुड़सवार
  rationale: यह शब्द घोड़े पर सवार लोगों को दर्शाता है। ‘घुड़सवार’ स्पष्ट, प्रचलित और युगानुकूल है।
- source_word: הַמַּחֲנֶה
  choice: दल
  rationale: מַחֲנֶה का सामान्य अर्थ ‘छावनी’ है, पर यहाँ यात्रा कर रहे पूरे समूह का बोध है। ‘दल’ स्थिर पड़ाव का अनुचित संकेत दिए बिना व्यापक साथ चलने वाले समुदाय को व्यक्त करता है।
- source_word: כָּבֵד מְאֹד
  choice: बहुत बड़ा
  rationale: शाब्दिक अर्थ ‘बहुत भारी’ है; किसी दल के विषय में यह उसके आकार, भारी-भरकम स्वरूप या प्रभावशाली संख्या को सूचित करता है। ‘बहुत बड़ा’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
theological_decisions: []
