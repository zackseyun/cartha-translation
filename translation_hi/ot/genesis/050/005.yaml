  text: אָבִ֞/י הִשְׁבִּיעַ֣/נִי לֵ/אמֹ֗ר הִנֵּ֣ה אָנֹכִי֮ מֵת֒ בְּ/קִבְרִ֗/י אֲשֶׁ֨ר כָּרִ֤יתִי לִ/י֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן שָׁ֖מָּ/ה תִּקְבְּרֵ֑/נִי וְ/עַתָּ֗ה אֶֽעֱלֶה נָּ֛א וְ/אֶקְבְּרָ֥ה אֶת אָבִ֖/י וְ/אָשֽׁוּבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/005.yaml
  text: My father made me swear, saying, ‘Look, I am dying. In my grave that I dug for myself in the land of Canaan, there you shall bury me.’ So now, please let me go up and bury my father; then I will return.
translation:
  language: hi
  text: मेरे पिता ने मुझसे शपथ दिलवाई थी। उन्होंने कहा था, ‘देखो, मैं मरनेवाला हूँ। कनान देश में जो कब्र मैंने अपने लिए खोदी है, वहीं मुझे दफनाना।’ इसलिए अब कृपा करके मुझे जाने दीजिए, ताकि मैं जाकर अपने पिता को दफनाऊँ और फिर लौट आऊँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁבִּיעַנִי
  choice: मुझे शपथ दिलाकर
  rationale: हिफ़ील रूप का अर्थ है किसी से शपथ लेना या उसे शपथ दिलाना; यह हिंदी में स्वाभाविक ढंग से उस बाध्यकारी प्रतिज्ञा को व्यक्त करता है।
- source_word: הִנֵּה אָנֹכִי מֵת
  choice: देख, मैं मरने पर हूँ
  rationale: הִנֵּה को संबोधनात्मक ‘देख’ से रखा गया है और सहभागी מֵת निकट आती मृत्यु की अवस्था बताता है।
- source_word: כָּרִיתִי
  choice: मैंने ... खोदी है
  rationale: मूल क्रिया का सामान्य अर्थ ‘खोदना’ है; कब्र के संदर्भ में इसे सीधे बनाए रखा गया है, यद्यपि पितृकथा की व्यापक पृष्ठभूमि में इसका आशय तैयार कराई या अपने अधिकार में ली गई कब्र भी समझा जा सकता है।
- source_word: אֶעֱלֶה נָּא
  choice: कृपा करके मुझे जाने दीजिए कि मैं जाकर
  rationale: ‘ऊपर जाना’ कनान की ओर यात्रा का स्रोत-संगत मुहावरा है, पर फिरौन से अनुमति माँगते हुए स्वाभाविक हिंदी में विनम्र निवेदन और गमन दोनों व्यक्त किए गए हैं।
- source_word: וְאָשׁוּבָה
  choice: फिर मैं लौट आऊँगा
  rationale: वाव के क्रमिक भाव और आश्वासनात्मक प्रथम पुरुष रूप को स्पष्ट, स्वाभाविक हिंदी में रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। संवाद में विनम्र बहुवचन ‘दीजिए’ फिरौन को संबोधन के अनुरूप है। ‘दफनाना’ सामान्य आधुनिक हिंदी में ‘गाड़ना’ की अपेक्षा अधिक सम्मानजनक और प्रसंगोचित है।
