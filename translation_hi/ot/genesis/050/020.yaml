  verdict: revise
  source_fidelity: The draft correctly conveys the adversative intent against Joseph, the moral force of רָעָה (“बुराई”), God's good purpose, and the life-preserving result. However, the second use of “योजना बनाई” is not idiomatic with “उसी बात,” and the wording can be adjusted to express God's good purpose through the evil intended without reducing the Hebrew parallel to a mere later reversal.
  naturalness: The phrase “परमेश्वर ने उसी बात की योजना भलाई के लिए बनाई थी” is awkward in modern Hindi, and “वह वह परिणाम” contains an evident duplicated word. The revision is grammatical, clear, and retains a dignified modern register.
  terminology: “परमेश्वर,” “बुराई,” “भलाई,” and “जीवित रखना” are appropriate. “उसी के द्वारा भलाई करने की योजना बनाई” retains the purposeful parallel in a natural Hindi construction without imposing a doctrinal explanation.
  issues:
  - severity: medium
    issue: 'The second clause uses an unnatural construction: “परमेश्वर ने उसी बात की योजना भलाई के लिए बनाई थी.”'
    rationale: Hindi normally expresses this sense as planning to do good through the matter/event, rather than making a plan “of that matter for good.” The current wording obscures the intended relation of the feminine suffix to the previously mentioned evil.
  - severity: low
    issue: The phrase “ताकि वह वह परिणाम” repeats “वह.”
    rationale: This is a grammatical/editing error and should be corrected.
