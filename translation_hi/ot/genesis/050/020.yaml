- from: तुमने तो मेरे विरुद्ध बुराई की योजना बनाई थी, पर परमेश्वर ने उसी बात की योजना भलाई के लिए बनाई थी, ताकि वह वह परिणाम सामने लाए जो आज दिखाई दे रहा है[a]—बहुत-से लोगों को जीवित रखे।
  to: तुमने तो मेरे विरुद्ध बुराई की योजना बनाई थी, पर परमेश्वर ने उसी के द्वारा भलाई करने की योजना बनाई थी, ताकि वह आज दिखाई देनेवाला यह परिणाम सामने लाए[a]—बहुत-से लोगों को जीवित रखे।
  rationale: 'Revision resolves the awkward second planning expression and the duplicated word while preserving the verse''s deliberate juxtaposition: the brothers intended evil, whereas God purposed good through that same evil. “आज दिखाई देनेवाला यह परिणाम” continues to communicate the deictic, presently evident force of כַּיּוֹם הַזֶּה; the more formal alternative remains in the footnote.'
