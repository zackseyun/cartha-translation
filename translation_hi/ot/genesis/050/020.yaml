source:
  edition: WLC
  text: וְ/אַתֶּ֕ם חֲשַׁבְתֶּ֥ם עָלַ֖/י רָעָ֑ה אֱלֹהִים֙ חֲשָׁבָ֣/הּ לְ/טֹבָ֔ה לְמַ֗עַן עֲשֹׂ֛ה כַּ/יּ֥וֹם הַ/זֶּ֖ה לְ/הַחֲיֹ֥ת עַם רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/020.yaml
  text: As for you[a], you intended evil against me, but God intended it for good, in order to bring about what is happening this day—to keep many people alive.
translation:
  language: hi
  text: तुमने तो मेरे विरुद्ध बुराई की योजना बनाई थी, पर परमेश्वर ने उसी के द्वारा भलाई करने की योजना बनाई थी, ताकि वह आज दिखाई देनेवाला यह परिणाम सामने लाए[a]—बहुत-से लोगों को जीवित रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “जैसा आज के दिन है।” इब्रानी मुहावरा उस वर्तमान परिणाम की ओर संकेत करता है जो अब सबके सामने दिखाई दे रहा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲשַׁבְתֶּם / חֲשָׁבָהּ
  choice: योजना बनाई थी / योजना बनाई थी
  rationale: दोनों स्थानों पर एक ही मूल अभिव्यक्ति रखी गई है, जिससे भाइयों के बुरे उद्देश्य और परमेश्वर के भले उद्देश्य के बीच इब्रानी की जानबूझकर बनाई गई समानांतरता बनी रहती है।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: इस प्रसंग में על शत्रुतापूर्ण दिशा व्यक्त करता है; इसलिए ‘मेरे विरुद्ध’ स्वाभाविक और सटीक है।
- source_word: רָעָה
  choice: बुराई
  rationale: यह केवल हानि नहीं, बल्कि भाइयों के नैतिक रूप से दोषपूर्ण उद्देश्य को भी व्यक्त करता है।
- source_word: לְטֹבָה
  choice: भलाई के लिए
  rationale: यह ‘बुराई’ के साथ स्पष्ट विरोध बनाए रखता है और उद्देश्य अथवा परिणाम की दिशा व्यक्त करता है।
- source_word: לְמַעַן עֲשֹׂה
  choice: ताकि वह ... परिणाम सामने लाए
  rationale: לְמַעַן उद्देश्य बताता है और עשה यहाँ इतिहास में दिखाई देने वाला परिणाम उत्पन्न करने के अर्थ में है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जो आज दिखाई दे रहा है
  rationale: यह मुहावरा वर्तमान में सबके सामने विद्यमान परिणाम की ओर संकेत करता है; अधिक औपचारिक रूप पादटिप्पणी में दिया गया है।
- source_word: לְהַחֲיֹת
  choice: जीवित रखे
  rationale: חיה का हिफ़ील रूप जीवन बचाए या बनाए रखने का अर्थ देता है।
- source_word: עַם רָב
  choice: बहुत-से लोगों
  rationale: यह बड़ी संख्या में लोगों को सूचित करता है; हिंदी में यह स्वाभाविक है और अनावश्यक रूप से किसी एक जातीय समुदाय का संकेत नहीं देता।
theological_decisions:
- issue: मानवीय बुराई और परमेश्वर के विधान के लिए חשב का समानांतर प्रयोग
  choice: दोनों खंडों में ‘योजना बनाई थी’ का प्रयोग
  alternative: मन में बुराई ठानी थी / परमेश्वर ने उसे भलाई में बदल दिया
  rationale: इब्रानी पाठ एक ही क्रिया से भाइयों के वास्तविक बुरे उद्देश्य और परमेश्वर के वास्तविक भले उद्देश्य को साथ रखता है। समान अभिव्यक्ति इस तनाव को बनाए रखती है और यह नहीं कहती कि परमेश्वर ने केवल बाद में बुराई को भलाई में बदल दिया।
- issue: רָעָה का नैतिक अथवा केवल हानिकारक अर्थ
  choice: बुराई
  alternative: हानि
  rationale: प्रसंग में भाइयों का कृत्य नैतिक रूप से दोषपूर्ण है; ‘बुराई’ इस आयाम को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘तो ... पर’ विरोध को स्वाभाविक बनाता है; दीर्घ डैश अंतिम उद्देश्य—बहुत-से लोगों को जीवित रखने—को स्पष्ट करता है।
