  text: Joseph remained in Egypt[a], he and his father's household, and Joseph lived 110 years.
translation:
  language: hi
  text: यूसुफ अपने पिता के घराने के साथ मिस्र में रहा, और यूसुफ एक सौ दस वर्ष तक जीवित रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: ही रहा
  rationale: ישׁב का अर्थ यहाँ याकूब की मृत्यु के बाद मिस्र में निवास जारी रखना है। ‘ही रहा’ इस निरंतरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और आगे आए ויחי से अलग भी रखता है।
- source_word: בְּמִצְרַיִם
  choice: मिस्र में
  rationale: यह यूसुफ और उसके घराने के निवास-स्थान को बताने वाला सीधा स्थानवाचक पद है।
- source_word: הוּא וּבֵית אָבִיו
  choice: अपने पिता के घराने समेत
  rationale: בֵּית אָבִיו केवल भवन नहीं, पिता से जुड़ी व्यापक पारिवारिक इकाई या घराने का बोध कराता है। ‘घराने समेत’ हिन्दी में इस सामूहिक अर्थ को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: यह क्रिया यहाँ यूसुफ की कुल आयु बताती है। ‘जीवित रहा’ पहले खंड के निवास-सूचक ‘रहा’ से अर्थगत भेद बनाए रखता है।
- source_word: מֵאָה וָעֶשֶׂר שָׁנִים
  choice: कुल 110 वर्ष
  rationale: मूल में ठीक 110 वर्षों की आयु है। ‘कुल’ हिन्दी में जीवनकाल के सारांश को स्वाभाविक बनाता है; अंक आधुनिक पाठक के लिए स्पष्ट हैं।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: यह नाम हिन्दी बाइबल परंपरा में प्रचलित रूप में लिप्यंतरित किया गया है।
