  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी रखी गई है। ‘दफ़नाना’ व्यापक रूप से समझा जाने वाला वर्तमान शब्द है। मूल की एक-वाक्यीय संरचना और यूसुफ पर मुख्य बल को डैशयुक्त अनुप्रयोग से बनाए रखा गया है; ‘ऊपर गए’ के सांस्कृतिक मुहावरे को पादटिप्पणी से स्पष्ट किया गया है।
