  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֨שָׁב יוֹסֵ֤ף מִצְרַ֨יְמָ/ה֙ ה֣וּא וְ/אֶחָ֔י/ו וְ/כָל הָ/עֹלִ֥ים אִתּ֖/וֹ לִ/קְבֹּ֣ר אֶת אָבִ֑י/ו אַחֲרֵ֖י קָבְר֥/וֹ אֶת אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/014.yaml
  text: Then Joseph returned to Egypt[a], he and his brothers and all who had gone up with him to bury his father[b], after he had buried his father.
translation:
  language: hi
  text: अपने पिता को दफ़नाने के बाद[b] यूसुफ मिस्र लौट आया; उसके भाई और वे सभी लोग भी उसके साथ लौट आए, जो उसके पिता को दफ़नाने के लिए उसके साथ ऊपर गए थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसके साथ ऊपर जानेवाले सभी लोग’ है। मिस्र से कनान की यात्रा के लिए बाइबल में ‘ऊपर जाना’ एक सामान्य अभिव्यक्ति है।
    reason: cultural_note
  - marker: b
    text: इब्रानी में ‘उसके पिता’ उद्देश्य बताने वाले वाक्यांश में और इस समय-वाक्यांश में, दोनों बार आता है। दोनों संदर्भ यूसुफ के पिता की ओर हैं।
    reason: translation_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौट गया
  rationale: שוב का यह कथात्मक रूप पूरी हो चुकी वापसी को व्यक्त करता है; प्रसंग में ‘लौट गया’ स्वाभाविक और सटीक है।
- source_word: מִצְרַיְמָה
  choice: मिस्र
  rationale: दिशासूचक ה मिस्र की ओर गति बताता है; ‘लौट गया’ के साथ हिन्दी में ‘मिस्र’ ही स्वाभाविक रूप से गंतव्य व्यक्त करता है।
- source_word: הוּא וְאֶחָיו
  choice: वह, उसके भाई
  rationale: הוּא यूसुफ को फिर से बलपूर्वक सामने लाता है और उसके भाइयों को उसके साथ जोड़ता है; डैश के बाद यह सूची हिन्दी में उस अनुप्रयोग को स्पष्ट रखती है।
- source_word: וְכָל הָעֹלִים אִתּוֹ
  choice: और वे सभी लोग, जो ... उसके साथ ऊपर गए थे
  rationale: עֹלִים के ‘ऊपर जाने’ वाले बाइबलीय यात्रा-मुहावरे को पाठ में सुरक्षित रखा गया है; भूतपूर्व समय-संबंध ‘गए थे’ से स्पष्ट होता है।
- source_word: לִקְבֹּר אֶת אָבִיו
  choice: उसके पिता को दफ़नाने के लिए
  rationale: ל के साथ infinitive construct यात्रा का उद्देश्य व्यक्त करता है। यहाँ ‘उसके’ का संदर्भ यूसुफ से है।
- source_word: אַחֲרֵי קָבְרוֹ אֶת אָבִיו
  choice: अपने पिता को दफ़नाने के बाद
  rationale: אַחֲרֵי बाद का समय बताता है और प्रत्यययुक्त infinitive का कर्ता प्रसंगतः यूसुफ है। वाक्य के आरम्भ में रखने से हिन्दी स्वाभाविक रहती है, जबकि घटनाक्रम अक्षुण्ण रहता है।
