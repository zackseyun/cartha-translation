  to: अपने पिता को दफ़नाने के बाद[b] यूसुफ मिस्र लौट आया; उसके भाई और वे सभी लोग भी उसके साथ लौट आए, जो उसके पिता को दफ़नाने के लिए उसके साथ ऊपर गए थे[a]।
