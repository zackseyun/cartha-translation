base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/024.yaml
  text: And Joseph said to his brothers[a], “I am dying, but God will surely visit you and bring you up from this land to the land that he swore to Abraham, to Isaac, and to Jacob.”
translation:
  language: hi
  text: तब यूसुफ ने अपने भाइयों से कहा, “मैं मरनेवाला हूँ, पर परमेश्वर निश्चय ही तुम्हारी सुधि लेगा[a] और तुम्हें इस देश से ऊपर ले जाकर उस देश में ले जाएगा, जिसके विषय में उसने अब्राहम, इसहाक और याकूब से शपथ खाई थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निश्चय ही तुम्हारी खोज-खबर लेगा।” हिब्रू मुहावरा बताता है कि परमेश्वर अपने लोगों पर निर्णायक रूप से ध्यान देगा और उनके पक्ष में कार्रवाई करेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: अपने भाइयों
  rationale: पुल्लिंग बहुवचन रूप और उत्पत्ति के संदर्भ में यह यूसुफ के पुरुष भाइयों को ही सूचित करता है।
- source_word: אָנֹכִי מֵת
  choice: मैं मरनेवाला हूँ
  rationale: हिब्रू कृदन्त-रचना निकट आती मृत्यु बताती है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: פָּקֹד יִפְקֹד
  choice: निश्चय ही तुम्हारी सुधि लेगा
  rationale: धातु की पुनरुक्त emphatic रचना कार्य की निश्चितता व्यक्त करती है। ‘सुधि लेना’ केवल देखने आने के बजाय परमेश्वर के ध्यान देने और पक्ष में हस्तक्षेप करने की व्यापकता बनाए रखता है।
- source_word: וֵאלֹהִים
  choice: पर परमेश्वर
  rationale: संयोजक यहाँ यूसुफ की मृत्यु और परमेश्वर की भावी कार्रवाई के बीच स्वाभाविक विरोध दर्शाता है।
- source_word: וְהֶעֱלָה אֶתְכֶם
  choice: और तुम्हें इस देश से निकालकर उस देश में ले जाएगा
  rationale: हिफ़ील रूप किसी को ऊपर ले जाने या पहुँचा देने का भाव रखता है। हिन्दी में ‘निकालकर ... ले जाएगा’ मिस्र से प्रतिज्ञात देश की ओर स्थानांतरण को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि ‘ऊपर’ की दिशात्मक छवि को शब्दशः नहीं दोहराता।
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּע
  choice: उस देश में, जिसके विषय में उसने ... से शपथ खाई थी
  rationale: मूल में ‘देने’ का कर्म निहित है, व्यक्त नहीं। ‘जिसके विषय में’ हिन्दी को सुबोध रखते हुए उस निहित तत्व को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: अब्राहम, इसहाक और याकूब से
  rationale: तीनों पूर्वजों के नाम और शपथ के संबंध को स्पष्ट, गंभीर और स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: פָּקֹד יִפְקֹד में परमेश्वर की प्रतिज्ञात कार्रवाई का स्वरूप
  choice: परमेश्वर निश्चय ही उनकी सुधि लेगा और उनके पक्ष में कार्रवाई करेगा
  alternative: परमेश्वर निश्चय ही उनसे भेंट करेगा / उनकी खोज-खबर लेगा
  rationale: हिब्रू रचना प्रबल निश्चितता व्यक्त करती है और פקד इस वाचा-संदर्भ में निर्णायक ध्यान तथा हस्तक्षेप को समेट सकता है। अनुवाद इसे केवल शारीरिक भेंट तक सीमित नहीं करता।
- issue: प्रतिज्ञात देश के विषय में शपथ का निहित कर्म
  choice: ‘देने’ को मुख्य पाठ में न जोड़कर ‘जिसके विषय में ... शपथ खाई थी’ कहना
  alternative: ‘जिसे देने की ... शपथ खाई थी’
  rationale: देश देने का आशय प्रसंग में स्पष्ट है, पर इस पद के हिब्रू पाठ में ‘देना’ प्रत्यक्ष रूप से नहीं है; इसलिए मूल की संक्षिप्तता और निहितता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। ‘सुधि लेना’ सम्मानपूर्ण और व्यापक है; ‘मरनेवाला हूँ’ आसन्न मृत्यु को स्वाभाविक ढंग से व्यक्त करता है।
