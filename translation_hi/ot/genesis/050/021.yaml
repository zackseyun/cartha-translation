  text: וְ/עַתָּה֙ אַל תִּירָ֔אוּ אָנֹכִ֛י אֲכַלְכֵּ֥ל אֶתְ/כֶ֖ם וְ/אֶֽת טַפְּ/כֶ֑ם וַ/יְנַחֵ֣ם אוֹתָ֔/ם וַ/יְדַבֵּ֖ר עַל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/021.yaml
  text: So now[a], do not be afraid. I myself will provide for you and your little ones.” Thus he comforted them and spoke to their hearts.
translation:
  language: hi
  text: इसलिए अब[a] मत डरो। मैं स्वयं तुम्हारा और तुम्हारे बाल-बच्चों का पालन-पोषण करूँगा।” इस प्रकार उसने उन्हें सांत्वना दी और उनके मन को ढाढ़स बँधाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अब।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: संयोजक וְ और कालवाचक עַתָּה दोनों को स्वाभाविक हिन्दी में व्यक्त करता है और यूसुफ के निष्कर्षात्मक आश्वासन से जोड़ता है।
- source_word: אַל תִּירָאוּ
  choice: मत डरो
  rationale: निषेधात्मक आदेश को सहज, सीधी और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: אָנֹכִי
  choice: मैं स्वयं
  rationale: स्वतंत्र सर्वनाम के बलाघात को सुरक्षित रखता है और यूसुफ की व्यक्तिगत प्रतिबद्धता स्पष्ट करता है।
- source_word: אֲכַלְכֵּל
  choice: पालन-पोषण करूँगा
  rationale: भोजन और अन्य आवश्यकताओं द्वारा लगातार संभालने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: טַפְּכֶם
  choice: तुम्हारे बाल-बच्चों
  rationale: छोटे बच्चों और परिवार के आश्रित नन्हों के अर्थ को आत्मीय तथा सामान्य हिन्दी में रखता है।
- source_word: וַיְנַחֵם אֹתָם
  choice: उसने उन्हें सांत्वना दी
  rationale: पिएल रूप में נחם के यहाँ आश्वस्त और सांत्वना देने के भाव को सीधे व्यक्त करता है।
- source_word: וַיְדַבֵּר עַל לִבָּם
  choice: उनके मन को ढाढ़स बँधाया
  rationale: शाब्दिक रूप से ‘उनके हृदय से/पर बात की’ इस इब्रानी मुहावरे का आश्वस्त करने वाला भाव स्वाभाविक हिन्दी में देता है।
