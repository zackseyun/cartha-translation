  text: וַ/יֵּלְכוּ֙ גַּם אֶחָ֔י/ו וַֽ/יִּפְּל֖וּ לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ הִנֶּ֥/נּֽוּ לְ/ךָ֖ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/018.yaml
  text: Then his brothers also came and fell down before him and said[a], “Here we are, your servants.”
translation:
  language: hi
  text: फिर उसके भाई भी आए और उसके सामने गिर पड़े। उन्होंने कहा, “देखिए, हम आपके दास[a] हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ग़ुलाम।” यहाँ प्रयुक्त इब्रानी शब्द का अर्थ “सेवक” या “ग़ुलाम,” दोनों हो सकता है। इस प्रसंग में भाई अपनी पूर्ण अधीनता व्यक्त कर रहे हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: आए
  rationale: मूल क्रिया का सामान्य अर्थ ‘जाना/चलना’ है, पर यहाँ भाई यूसुफ के पास पहुँचते हैं; दृश्य के स्वाभाविक हिन्दी दृष्टिकोण से ‘आए’ उपयुक्त है।
- source_word: גַּם אֶחָיו
  choice: उसके भाई भी
  rationale: גַּם पहले भेजे गए संदेश के बाद भाइयों के स्वयं आने को जोड़ता और उभारता है।
- source_word: וַיִּפְּלוּ לְפָנָיו
  choice: उसके सामने गिर पड़े
  rationale: यह शारीरिक रूप से गिरने और अधीनता प्रकट करने, दोनों भावों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הִנֶּנּוּ
  choice: देखिए, हम
  rationale: हिब्रू की प्रत्यक्ष आत्म-प्रस्तुति को आधुनिक हिन्दी में व्यक्त करता है; केवल ‘हम’ कहने की अपेक्षा मूल का संकेतात्मक बल बनाए रखता है।
- source_word: לְךָ לַעֲבָדִים
  choice: हम आपके दास हैं
  rationale: समर्पण और अधीनता की प्रबल पेशकश को व्यक्त करता है। ‘दास’ हिन्दी में सेवक से लेकर पराधीन व्यक्ति तक का अर्थ दे सकता है और हिब्रू की अर्थ-सीमा को अनावश्यक रूप से संकुचित नहीं करता।
theological_decisions:
- issue: 'עֲבָדִים का अर्थ: सेवक या ग़ुलाम'
  choice: दास
  alternative: ग़ुलाम; सेवक
  rationale: प्रसंग में भाई यूसुफ के सामने गहरी अधीनता स्वीकार कर रहे हैं। ‘दास’ इस बल को रखता है, जबकि ‘सेवक’ इसे नरम कर सकता है और ‘ग़ुलाम’ मूल शब्द की संभावित अर्थ-व्याप्ति को केवल कानूनी दासत्व तक सीमित कर सकता है। पादटिप्पणी वास्तविक शाब्दिक विकल्प स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गिर पड़े’ दृश्य की शारीरिकता और विनय दोनों व्यक्त करता है; ‘दास’ अधीनता का प्रबल भाव रखते हुए मूल की शब्दार्थगत व्यापकता भी बचाता है।
