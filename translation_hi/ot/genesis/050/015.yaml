base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/015.yaml
  text: When Joseph’s brothers saw that their father was dead, they said, “What if Joseph hates us and fully repays us for all the evil that we did to him?”
translation:
  language: hi
  text: जब यूसुफ के भाइयों ने देखा कि उनके पिता मर गए हैं, तो उन्होंने कहा, “कहीं ऐसा न हो कि यूसुफ हमसे बैर रखे और जो सारी बुराई हमने उसके साथ की थी, उसका पूरा बदला हमसे ले।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לוּ יִשְׂטְמֵנוּ
  choice: कहीं ऐसा न हो कि ... हमसे बैर रखे
  rationale: לוּ यहाँ आशंका व्यक्त करता है, और שׂטם का अर्थ गहरी शत्रुता या बैर रखना है। यह हिंदी में भाइयों के भय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהָשֵׁב יָשִׁיב לָנוּ
  choice: उसका पूरा बदला हमसे ले
  rationale: क्रिया की infinitive absolute रचना प्रतिफल देने की निश्चितता या पूर्णता पर बल देती है; नकारात्मक प्रसंग में ‘पूरा बदला लेना’ अर्थ और बल दोनों को स्पष्ट रखता है।
- source_word: כָּל־הָרָעָה אֲשֶׁר גָּמַלְנוּ אֹתוֹ
  choice: जो सारी बुराई हमने उसके साथ की थी
  rationale: גמל का प्रसंगगत अर्थ किसी के साथ व्यवहार करना/उसे कुछ देना है; यहाँ भाइयों द्वारा यूसुफ के साथ की गई बुराई अभिप्रेत है।
theological_decisions:
- issue: यूसुफ की भावी मनोवृत्ति की अनिश्चितता
  choice: 'भाइयों के भय के रूप में कथन रखा गया: ‘कहीं ऐसा न हो’'
  alternative: ‘यूसुफ हमसे अवश्य बैर रखेगा’
  rationale: मूल पाठ भाइयों की आशंका व्यक्त करता है, यूसुफ के वास्तविक इरादे या भाव को तथ्य के रूप में घोषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; सहज, गरिमापूर्ण कथात्मक शैली। ‘बैर रखना’ और ‘पूरा बदला लेना’ सामान्य पाठक के लिए स्पष्ट हैं तथा मूल की भावनात्मक तीव्रता बनाए रखते हैं।
