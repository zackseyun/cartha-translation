source:
  edition: WLC
  text: וַ/יַּ֥עַל יוֹסֵ֖ף לִ/קְבֹּ֣ר אֶת אָבִ֑י/ו וַ/יַּֽעֲל֨וּ אִתּ֜/וֹ כָּל עַבְדֵ֤י פַרְעֹה֙ זִקְנֵ֣י בֵית֔/וֹ וְ/כֹ֖ל זִקְנֵ֥י אֶֽרֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/007.yaml
  text: So Joseph went up to bury his father[a], and with him went up all Pharaoh’s servants, the elders of his household, and all the elders of the land of Egypt.
translation:
  language: hi
  text: तब यूसुफ अपने पिता को दफ़नाने के लिए ऊपर गया[a]। उसके साथ फ़िरौन के सभी सेवक, फ़िरौन के घराने के बुज़ुर्ग और मिस्र देश के सभी बुज़ुर्ग ऊपर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “ऊपर गया” कहा गया है; मिस्र से कनान की यात्रा का वर्णन सामान्यतः इसी प्रकार किया जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: ऊपर गया
  rationale: עָלָה का मूल अर्थ ‘ऊपर जाना’ है। मिस्र से कनान की यात्रा के लिए प्रयुक्त इब्रानी भौगोलिक मुहावरे को सुरक्षित रखा गया है।
- source_word: לִקְבֹּר
  choice: दफ़नाने के लिए
  rationale: קָבַר का सीधा और आधुनिक हिन्दी में स्वाभाविक अर्थ ‘दफ़नाना’ है।
- source_word: אָבִיו
  choice: अपने पिता को
  rationale: हिन्दी में कर्ता की ओर लौटने वाले संबंध को स्वाभाविक रूप से व्यक्त करने के लिए ‘अपने’ चुना गया है; इससे मूल पाठ से अतिरिक्त बल नहीं जुड़ता।
- source_word: וַיַּעֲלוּ אִתּוֹ
  choice: उसके साथ ... भी ऊपर गए
  rationale: मूल में עָלָה की पुनरावृत्ति को बनाए रखते हुए हिन्दी वाक्य-विन्यास को स्वाभाविक रखा गया है। ‘भी’ साथ जाने वाले समूहों के जुड़ने का भाव स्पष्ट करता है।
- source_word: כָּל עַבְדֵי פַרְעֹה
  choice: फ़िरौन के सभी सेवक
  rationale: עֶבֶד का व्यापक अर्थ ‘सेवक’ है। राजकीय संदर्भ में इसे केवल ‘अधिकारी’ कहना पद को आवश्यकता से अधिक निश्चित कर देता।
- source_word: זִקְנֵי בֵיתוֹ
  choice: उसके राजपरिवार के पुरनिये
  rationale: בַּיִת यहाँ फ़िरौन के राजकीय घराने अथवा दरबार से संबंधित है। ‘राजपरिवार’ सामान्य पाठक के लिए इस संस्थागत अर्थ को स्पष्ट करता है, और ‘पुरनिये’ זָקֵן की नेतृत्वकारी गरिमा को बनाए रखता है।
- source_word: וְכֹל זִקְנֵי אֶרֶץ מִצְרָיִם
  choice: और मिस्र देश के सभी पुरनिये
  rationale: ‘मिस्र देश’ אֶרֶץ מִצְרַיִם को पूर्ण रूप से दर्शाता है, जबकि ‘पुरनिये’ व्यापक राष्ट्रीय नेतृत्व का संकेत देता है।
