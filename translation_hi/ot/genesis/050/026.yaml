  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। तकनीकी ‘शवलेपन’ या अंग्रेज़ी-प्रभावित ‘एम्बामिंग’ के बजाय अर्थ-स्पष्ट वाक्यांश चुना गया है। यूसुफ के लिए एकवचन अनौपचारिक क्रियारूप ‘मर गया’ सामान्य हिन्दी बाइबलीय कथन के अनुरूप है और अनादर नहीं दर्शाता।
