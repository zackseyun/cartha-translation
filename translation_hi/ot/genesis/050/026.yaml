base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/026.yaml
  text: So Joseph died at the age of a hundred and ten years[c][b][a], and they embalmed him and placed him in a coffin in Egypt.
translation:
  language: hi
  text: इस प्रकार यूसुफ एक सौ दस वर्ष की आयु में मर गया[a]। उन्होंने उसके शव का संलेपन किया[b] और उसे मिस्र में एक ताबूत[c] में रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और यूसुफ एक सौ दस वर्ष की आयु में मर गया।” आरंभिक इब्रानी संयोजक का अनुवाद केवल “और” भी किया जा सकता है; “इस प्रकार” कथा के समापन-प्रवाह को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन्होंने उसे ममी बनाया।” इब्रानी क्रिया शव को सुरक्षित रखने के लिए किए जाने वाले संलेपन को दर्शाती है, विशेषकर मिस्री संदर्भ में।
    reason: cultural_note
  - marker: c
    text: यहाँ प्रयुक्त इब्रानी शब्द वही संज्ञा है जिसका अर्थ दूसरे प्रसंगों में “संदूक” या “मंजूषा” भी हो सकता है; शव-संस्कार के इस संदर्भ में इसका अर्थ “ताबूत” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: मूल क्रिया מות सीधे मृत्यु को व्यक्त करती है। ‘मर गया’ सहज और स्पष्ट है तथा अनावश्यक शिष्टोक्ति से बचता है।
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: एक सौ दस वर्ष की आयु में
  rationale: इब्रानी में आयु बताने के लिए शाब्दिक रूप से ‘एक सौ दस वर्ष का पुत्र’ मुहावरा है; आधुनिक हिन्दी में इसका स्वाभाविक समतुल्य ‘एक सौ दस वर्ष की आयु में’ है।
- source_word: וַיַּחַנְטוּ
  choice: उन्होंने उसके शव को लेप लगाकर सुरक्षित किया
  rationale: חנט शव को सड़ने से बचाने के लिए किए जाने वाले संलेपन/एम्बामिंग को दर्शाता है, विशेषकर मिस्री संदर्भ में। चुना हुआ वाक्यांश सामान्य पाठक के लिए प्रक्रिया और उद्देश्य दोनों को स्पष्ट करता है, बिना ममीकरण की पूरी सांस्कृतिक प्रक्रिया को क्रिया में अनिवार्य रूप से जोड़ने के।
- source_word: וַיִּישֶׂם
  choice: रख दिया
  rationale: שׂים का सामान्य अर्थ ‘रखना/स्थापित करना’ है। ‘रख दिया’ हिन्दी कथात्मक शैली में स्वाभाविक है और क्रिया के पूर्ण होने को व्यक्त करता है।
- source_word: בָּאָרוֹן
  choice: एक ताबूत में
  rationale: אָרוֹן का अर्थ संदर्भ के अनुसार संदूक, मंजूषा या ताबूत हो सकता है। शव-संरक्षण और मृत्यु के इस प्रसंग में ‘ताबूत’ सर्वाधिक उपयुक्त है; हिन्दी में पहली बार उल्लिखित पात्र के लिए ‘एक’ स्वाभाविक है।
- source_word: בְּמִצְרָיִם
  choice: मिस्र में
  rationale: स्थान-नाम का प्रचलित मानक हिन्दी रूप।
- source_word: וַ
  choice: इस प्रकार
  rationale: आरंभिक वाव पूर्ववर्ती कथा को आगे बढ़ाता है और उत्पत्ति की समापन घटना प्रस्तुत करता है। ‘इस प्रकार’ इस निष्कर्षात्मक प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है; ‘और’ अधिक शाब्दिक विकल्प है।
