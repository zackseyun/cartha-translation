source:
  edition: WLC
  text: וַ/יְצַ֨ו יוֹסֵ֤ף אֶת עֲבָדָי/ו֙ אֶת הָ/רֹ֣פְאִ֔ים לַ/חֲנֹ֖ט אֶת אָבִ֑י/ו וַ/יַּחַנְט֥וּ הָ/רֹפְאִ֖ים אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/002.yaml
  text: Then Joseph commanded his servants[a], the physicians, to embalm his father[b], and the physicians embalmed Israel.
translation:
  language: hi
  text: तब यूसुफ ने अपने सेवकों[a], अर्थात वैद्यों, को अपने पिता का शव-संरक्षण करने की आज्ञा दी; और वैद्यों ने इस्राएल[b] का शव-संरक्षण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दासों”; इब्रानी शब्द प्रसंग के अनुसार सेवकों या दासों, दोनों को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस्राएल अर्थात याकूब।
    reason: identity_clarification
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: צוה अधिकारपूर्वक निर्देश देने को व्यक्त करता है; ‘आज्ञा दी’ इसके बल और कथात्मक शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: עבד का अर्थ प्रसंगानुसार सेवक या दास हो सकता है। यहाँ यूसुफ के अधीन राजकीय/घरेलू कर्मचारी, विशेषतः वैद्य, अभिप्रेत हैं; उनकी दास-स्थिति मुख्य विषय नहीं है।
- source_word: הָרֹפְאִים
  choice: वैद्यों
  rationale: רפא से बना यह रूप उपचार करने वालों को दर्शाता है। प्राचीन मिस्री दरबार के संदर्भ में ‘वैद्य’ गरिमापूर्ण और सुबोध है।
- source_word: לַחֲנֹט / וַיַּחַנְטוּ
  choice: शव पर सुगंध-द्रव्य लगाकर उसे सुरक्षित रखने / इसी प्रकार सुरक्षित रखा
  rationale: חנט यहाँ मिस्री शव-संरक्षण की प्रक्रिया को दर्शाता है। आधुनिक हिन्दी में ‘शव पर सुगंध-द्रव्य लगाकर सुरक्षित रखना’ केवल ध्वन्यात्मक तकनीकी शब्द की अपेक्षा अर्थ को अधिक स्पष्ट करता है; दूसरी occurrence में ‘इसी प्रकार’ पुनरुक्ति घटाते हुए उसी क्रिया को संदर्भित करता है।
- source_word: אָבִיו
  choice: अपने पिता के शव
  rationale: मूल में ‘अपने पिता’ है; हिन्दी में शव-संरक्षण की क्रिया को स्वाभाविक और स्पष्ट बनाने के लिए ‘शव’ निहित अर्थ को व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ स्पष्टतः ‘इस्राएल’ नाम रखता है, इसलिए इसे ‘याकूब’ से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: עבד का सामाजिक अर्थ
  choice: सेवक
  alternative: दास
  rationale: इस प्रसंग का केंद्र यूसुफ के अधीन वैद्यों को दिया गया आदेश है, उनकी बंधुआ सामाजिक स्थिति नहीं। फिर भी मूल शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
- issue: יִשְׂרָאֵל नाम का संरक्षण
  choice: इस्राएल
  alternative: याकूब
  rationale: लेखक के नाम-चयन और उसकी संभावित साहित्यिक/धर्मवैचारिक महत्ता को बनाए रखने के लिए मूल नाम का अनुवाद किया गया है; पहचान पादटिप्पणी में स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। ‘शवलेपन’ या ‘ममी बनाना’ जैसे कम स्वाभाविक अथवा अत्यधिक संकीर्ण पदों के बजाय मिस्री embalming की प्रक्रिया को अर्थ-स्पष्ट वाक्यांश से व्यक्त किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
