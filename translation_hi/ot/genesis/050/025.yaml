  text: וַ/יַּשְׁבַּ֣ע יוֹסֵ֔ף אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְ/כֶ֔ם וְ/הַעֲלִתֶ֥ם אֶת עַצְמֹתַ֖/י מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/025.yaml
  text: Then Joseph made the sons of Israel swear, saying, “God will surely attend to you, and you must bring up my bones from here.”
translation:
  language: hi
  text: तब यूसुफ ने यह कहकर इस्राएल के पुत्रों को शपथ दिलाई, “परमेश्वर निश्चय ही तुम्हारी सुधि लेगा, और तुम मेरी हड्डियाँ यहाँ से ऊपर ले जाना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבַּע ... אֶת
  choice: शपथ दिलाकर
  rationale: हिफ़ील रूप का अर्थ स्वयं शपथ खाना नहीं, बल्कि दूसरों को शपथ दिलाना है।
- source_word: פָּקֹד יִפְקֹד
  choice: निश्चय ही ... सुधि लेगा
  rationale: क्रिया की पुनरुक्ति दृढ़ निश्चितता व्यक्त करती है; ‘सुधि लेना’ यहाँ परमेश्वर के कृपापूर्ण हस्तक्षेप और देखभाल का स्वाभाविक हिंदी रूप है।
- source_word: וְהַעֲלִתֶם
  choice: ऊपर ले जाना
  rationale: हिफ़ील क्रिया और मिस्र से प्रतिज्ञात देश की ओर ‘ऊपर’ जाने की भौगोलिक-कथात्मक दिशा दोनों सुरक्षित रहती हैं।
- source_word: עַצְמֹתַי
  choice: मेरी हड्डियाँ
  rationale: मूल का सीधा और प्रसंगानुकूल अनुवाद।
theological_decisions:
- issue: פָּקֹד יִפְקֹד में दैवी कार्य का स्वरूप
  choice: परमेश्वर निश्चय ही तुम्हारी सुधि लेगा
  alternative: परमेश्वर निश्चय ही तुम्हारे पास आएगा
  rationale: ‘सुधि लेना’ केवल भौतिक आगमन तक अर्थ सीमित नहीं करता, बल्कि इस प्रसंग में परमेश्वर के ध्यान देने और उद्धारकारी हस्तक्षेप को व्यक्त करता है।
- issue: וְהַעֲלִתֶם की बाध्यता
  choice: तुम ... ले जाना
  alternative: तुम ... ले जाओगे
  rationale: शपथ दिलाने के प्रसंग में हिंदी का यह आज्ञार्थक प्रयोग दायित्व को स्पष्ट करता है, जबकि मूल रूप व्याकरणतः पूर्ण क्रिया है जिसकी संदर्भगत शक्ति आदेश/प्रतिबद्धता की है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘इस्राएल के पुत्रों’ से मूल की वंशगत अभिव्यक्ति सुरक्षित रखी गई है।
