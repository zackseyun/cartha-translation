review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Joseph's causing the sons of Israel to swear, the emphatic certainty in פָּקֹד יִפְקֹד, and the instruction to bring his bones up from there. The proposed adjustment makes the syntactic relationship of לֵאמֹר (“saying”) more explicit in Hindi.
  naturalness: The wording is generally natural and appropriately dignified. Recasting “शपथ दिलाकर कहा” as “यह कहकर ... शपथ दिलाई” avoids a possible sequential reading (“after making them swear, he said”) and directly introduces the oath's stated content.
  terminology: “परमेश्वर,” “सुधि लेगा,” “इस्राएल के पुत्र,” and “मेरी हड्डियाँ” are suitable, source-responsive modern Hindi choices. “सुधि लेगा” preserves the contextual breadth of the Hebrew visitation idiom without over-specifying its manner.
  issues:
  - severity: low
    issue: The connection of “saying” to the act of administering the oath is slightly indirect.
    rationale: “शपथ दिलाकर कहा” can be read as two successive actions. Hebrew לֵאמֹר introduces what Joseph said in making them swear. “यह कहकर ... शपथ दिलाई” represents this relation more directly.
  revised_text: तब यूसुफ ने यह कहकर इस्राएल के पुत्रों को शपथ दिलाई, “परमेश्वर निश्चय ही तुम्हारी सुधि लेगा, और तुम मेरी हड्डियाँ यहाँ से ऊपर ले जाना।”
