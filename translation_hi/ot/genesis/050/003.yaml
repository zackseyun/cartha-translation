  text: Forty days were completed for him[a], for that is how the days of embalming are completed[b]; and Egypt wept for him seventy days.
translation:
  language: hi
  text: उसके लिए चालीस दिन पूरे हुए, क्योंकि शव-संरक्षण के दिन इसी प्रकार पूरे होते हैं। मिस्रवासियों ने उसके लिए सत्तर दिन तक रोया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלְאוּ לוֹ אַרְבָּעִים יוֹם
  choice: उसके लिए चालीस दिन पूरे हुए
  rationale: מלא समयावधि के पूरा होने को व्यक्त करता है। ‘उसके लिए’ לֹו को बनाए रखता है और ध्यान कार्य करने वालों के बजाय बीते हुए समय पर रखता है।
- source_word: כִּי כֵּן
  choice: क्योंकि ... इसी प्रकार
  rationale: यह पदबंध चालीस दिनों की अवधि का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि ... इसी प्रकार’ उसका व्याख्यात्मक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְמֵי הַחֲנֻטִים
  choice: शव-संरक्षण के दिन
  rationale: संदर्भ में חנט याकूब के शव को सुरक्षित रखने की प्रक्रिया है। ‘शव-संरक्षण’ आधुनिक पाठक के लिए स्पष्ट है और ‘ममीकरण’ की अपेक्षा कम सांस्कृतिक अर्थ आरोपित करता है।
- source_word: וַיִּבְכּוּ אֹתוֹ
  choice: उसके लिए ... रोता रहा
  rationale: בכה का मूल अर्थ ‘रोना’ है। यह अनुवाद औपचारिक शोक-विधि का अतिरिक्त अर्थ जोड़े बिना भावनात्मक बल बनाए रखता है।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: हिब्रू में देश का नाम सामूहिक रूप से वहाँ के लोगों के लिए आया है। मुख्य पाठ में ‘मिस्र’ रखकर स्रोत की अभिव्यक्ति सुरक्षित की गई है और पादटिप्पणी अर्थ स्पष्ट करती है।
- source_word: שִׁבְעִים יוֹם
  choice: सत्तर दिन तक
  rationale: संख्या को सीधे रखा गया है; ‘तक’ हिन्दी में रोने की अवधि को स्वाभाविक ढंग से व्यक्त करता है।
