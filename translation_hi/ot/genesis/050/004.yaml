translation_notes:
  register: आधुनिक मानक हिन्दी का विनम्र और गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘फ़िरौन’ और ‘यूसुफ’ प्रचलित बाइबलीय नाम-रूप हैं। पद अगले पद में जारी रहने वाले कथन पर समाप्त होता है, इसलिए अंत में विसर्ग रखा गया है।
