  edition: WLC
  text: וַ/יַּֽעַבְרוּ֙ יְמֵ֣י בְכִית֔/וֹ וַ/יְדַבֵּ֣ר יוֹסֵ֔ף אֶל בֵּ֥ית פַּרְעֹ֖ה לֵ/אמֹ֑ר אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵ֣ינֵי/כֶ֔ם דַּבְּרוּ נָ֕א בְּ/אָזְנֵ֥י פַרְעֹ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/004.yaml
  text: When the days of his mourning had passed[a], Joseph spoke to Pharaoh’s household, saying, “If I have now found favor in your eyes, please speak in Pharaoh’s hearing[b], saying,”
translation:
  language: hi
  text: 'जब उसके लिए रोने के दिन बीत गए[a], तब यूसुफ ने फ़िरौन के घराने के लोगों से कहा, “यदि मैं आपकी कृपादृष्टि में आया हूँ, तो कृपया फ़िरौन के कानों में यह कहें[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके शोक के दिन बीत गए।”
    reason: इब्रानी בכי का मूल अर्थ ‘रोना’ है, पर इस अंत्येष्टि-संदर्भ में यह शोक मनाने को भी सूचित करता है।
  - marker: b
    text: अर्थात्, “ऐसे कहें कि फ़िरौन सुने।”
    reason: ‘फ़िरौन के कानों में’ इब्रानी मुहावरे का निकट रूप है; इसका आशय फ़िरौन के सुनने में कहना है।
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: बीत गए
  rationale: समय के गुजर जाने के अर्थ में עבר का स्वाभाविक हिन्दी रूप; इसके बाद की घटना के लिए ‘तब’ से कथाक्रम स्पष्ट होता है।
- source_word: יְמֵי בְכִיתוֹ
  choice: उसके लिए रोने के दिन
  rationale: בכי के मूल अर्थ ‘रोना’ और प्रत्यय के संभावित वस्तुगत अर्थ को सुरक्षित रखता है; प्रसंग में यह शोक-अवधि को सूचित करता है।
- source_word: אֶל בֵּית פַּרְעֹה
  choice: फ़िरौन के घराने के लोगों से
  rationale: בית यहाँ भवन नहीं, राजघराने अथवा दरबार से जुड़े व्यक्तियों को दर्शाता है; ‘लोगों’ से हिन्दी में संबोधित समूह स्पष्ट होता है।
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֵיכֶם
  choice: यदि मुझ पर आपकी कृपादृष्टि हुई हो
  rationale: ‘तुम्हारी आँखों में अनुग्रह पाना’ मुहावरे का स्वाभाविक, विनम्र हिन्दी समतुल्य है और निवेदन का भाव बनाए रखता है।
- source_word: דַּבְּרוּ נָא
  choice: कृपया ... कहें
  rationale: बहुवचन आज्ञार्थ और נָא की विनम्र प्रार्थना को आधुनिक सम्मानसूचक हिन्दी में व्यक्त करता है।
- source_word: בְּאָזְנֵי פַרְעֹה
  choice: फ़िरौन से
  rationale: शाब्दिक ‘फ़िरौन के कानों में’ का आशय फ़िरौन को इस प्रकार कहना है कि वह सुने; मुख्य पाठ में स्वाभाविक हिन्दी और पादटिप्पणी में मूल बिंब रखा गया है।
- source_word: לֵאמֹר
  choice: 'यह कहें:'
  rationale: दूसरा לֵאמֹר उस संदेश का परिचय देता है जो अगले पद में जारी रहता है; विसर्ग आगे आने वाले प्रत्यक्ष कथन को दर्शाता है।
