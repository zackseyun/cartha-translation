  text: וַ/יַּעֲשׂ֥וּ בָנָ֖י/ו ל֑/וֹ כֵּ֖ן כַּ/אֲשֶׁ֥ר צִוָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/012.yaml
  text: So his sons did for him as he had commanded them.
translation:
  language: hi
  text: उसके पुत्रों ने उसके लिए वैसा ही किया, जैसा उसने उन्हें आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: किया
  rationale: עשה का सामान्य अर्थ ‘करना/बनाना’ है; यहाँ याकूब के निर्देशों को पूरा करने के संदर्भ में ‘किया’ स्वाभाविक और सटीक है।
- source_word: בָנָיו
  choice: उसके पुत्रों
  rationale: इब्रानी में विशेष रूप से ‘उसके पुत्र’ कहा गया है; ‘पुत्रों’ मूल पाठ की लिंग-संबंधी विशिष्टता बनाए रखता है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: यहाँ ל उस व्यक्ति के हित या उसकी ओर से किए गए कार्य को दर्शाता है; इसलिए ‘उसके लिए’ प्रसंगानुकूल है।
- source_word: כֵּן כַּאֲשֶׁר
  choice: वैसा ही ... जैसा
  rationale: यह संयुक्त हिंदी संरचना कार्य और पूर्व आज्ञा के बीच पूर्ण अनुरूपता को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: צִוָּם
  choice: उसने उन्हें आज्ञा दी थी
  rationale: צוה का अर्थ ‘आज्ञा देना’ है। ‘दी थी’ से स्पष्ट होता है कि आज्ञा पुत्रों के कार्य से पहले दी गई थी, जैसा कथानक में निहित है।
