source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר פַּרְעֹ֑ה עֲלֵ֛ה וּ/קְבֹ֥ר אֶת אָבִ֖י/ךָ כַּ/אֲשֶׁ֥ר הִשְׁבִּיעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/006.yaml
  text: And Pharaoh said[a], “Go up and bury your father, as he made you swear.”
translation:
  language: hi
  text: तब फ़िरौन ने कहा, “ऊपर जाओ और अपने पिता को दफ़नाओ, जैसा उन्होंने तुम्हें शपथ दिलाई थी[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसा उन्होंने तुम्हें शपथ के अधीन किया था।”
    reason: प्रेरणार्थक इब्रानी क्रिया को ‘शपथ दिलाना’ या अधिक औपचारिक रूप में ‘शपथ के अधीन करना’ कहा जा सकता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक के लिए हिन्दी में प्रचलित उपाधि और लिप्यंतरण।
- source_word: עֲלֵה
  choice: ऊपर जाओ
  rationale: עלה के दिशासूचक अर्थ को बनाए रखता है; प्रसंग में यात्रा मिस्र से कनान की ओर है। केवल ‘जाओ’ कहने से यह अर्थ मिट जाता।
- source_word: וּקְבֹר
  choice: और ... को दफ़नाओ
  rationale: קבר का सीधा और आधुनिक हिन्दी में सहज अर्थ ‘दफ़नाना’ है।
- source_word: אֶת אָבִיךָ
  choice: अपने पिता को
  rationale: सम्बोधित व्यक्ति के पिता को दर्शाने के लिए हिन्दी में ‘अपने पिता’ अधिक स्वाभाविक है और इब्रानी द्वितीय पुरुष एकवचन सम्बन्धसूचक प्रत्यय का आशय स्पष्ट रखता है।
- source_word: כַּאֲשֶׁר
  choice: जैसा
  rationale: तुलना और रीति—दोनों का सम्बन्ध संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הִשְׁבִּיעֶךָ
  choice: उन्होंने तुम्हें शपथ दिलाई थी
  rationale: 'हिफ़ील रूप का प्रेरणार्थक भाव सुरक्षित है: पिता ने केवल स्वयं शपथ नहीं खाई, बल्कि यूसुफ से शपथ कराई। पिता के लिए आदरसूचक बहुवचन आधुनिक हिन्दी में स्वाभाविक है।'
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। फ़िरौन का यूसुफ से सम्बोधन ‘तुम’ के रूप में है; यह आधुनिक हिन्दी में स्वाभाविक है और इब्रानी के व्याकरणिक एकवचन को सामाजिक स्तर के बारे में अनावश्यक निष्कर्ष में नहीं बदलता। ‘ऊपर जाओ’ कुछ चिह्नित होते हुए भी मूल के भौगोलिक-दिशासूचक भाव को सुरक्षित रखता है।
