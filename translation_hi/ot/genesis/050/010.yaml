id: GEN.50.10
reference: Genesis 50:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַד גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּ֨סְפְּדוּ שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְ/כָבֵ֖ד מְאֹ֑ד וַ/יַּ֧עַשׂ לְ/אָבִ֛י/ו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/010.yaml
  text: When they came to the threshing floor of Atad[a], which is beyond the Jordan, they lamented there with a very great and grievous lamentation[e][d][c][b], and he observed seven days of mourning for his father.
translation:
  language: hi
  text: जब वे अटाद के खलिहान[a] तक पहुँचे, जो यरदन के पार[b] है, तब उन्होंने वहाँ बहुत बड़ा और अत्यंत गंभीर विलाप किया[c]। और उसने अपने पिता के लिए सात दिन तक शोक मनाया[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अटाद’ का अर्थ ‘कँटीली झाड़ी’ हो सकता है, पर यहाँ यह स्थान-नाम का भाग है।
    reason: lexical_alternative
  - marker: b
    text: या ‘यरदन की दूसरी ओर’। मूल अभिव्यक्ति भौगोलिक दृष्टिकोण को खुला छोड़ती है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से, ‘बड़ा और अत्यंत भारी विलाप’; यह गहरे और तीव्र शोक को व्यक्त करने वाला मुहावरा है।
    reason: cultural_note
  - marker: d
    text: इब्रानी क्रिया एकवचन है—‘उसने शोक मनाया’—और संभवतः विशेष रूप से यूसुफ की ओर संकेत करती है। कुछ अनुवाद प्रसंग के अनुसार इसे बहुवचन, ‘उन्होंने’, करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּרֶן הָאָטָד
  choice: अटाद का खलिहान
  rationale: גֹּרֶן कृषि में अनाज दाँवने का स्थान है, जिसके लिए ‘खलिहान’ स्वाभाविक हिन्दी शब्द है। הָאָטָד यहाँ स्थान-नाम के रूप में लिया गया है और ‘अटाद’ लिप्यंतरित किया गया है।
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार
  rationale: यह वाक्यांश यरदन की दूसरी ओर के क्षेत्र को बताता है। ‘के पार’ स्वाभाविक हिन्दी है और मूल की भौगोलिक दृष्टि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיִּסְפְּדוּ ... מִסְפֵּד
  choice: उन्होंने ... विलाप किया
  rationale: सפד और उससे बना संज्ञा-रूप मृतक के लिए सार्वजनिक या औपचारिक विलाप को सूचित करते हैं; हिन्दी में ‘विलाप किया’ इस प्रसंग को स्पष्ट रखता है।
- source_word: גָּדוֹל וְכָבֵד מְאֹד
  choice: बहुत बड़ा और अत्यंत भारी
  rationale: यह रूप मूल की ‘बड़ा’, ‘भारी’ और तीव्रतासूचक מְאֹד को बनाए रखता है। ‘भारी विलाप’ हिन्दी में गहन और दुःखपूर्ण शोक का बोध देता है।
- source_word: וַיַּעַשׂ ... אֵבֶל שִׁבְעַת יָמִים
  choice: उसने ... सात दिन तक शोक मनाया
  rationale: עשה के साथ אֵבֶל शोक की अवधि मनाने का मुहावरा है। ‘सात दिन तक शोक मनाया’ आधुनिक हिन्दी में स्वाभाविक है और अवधि को स्पष्ट करता है।
- source_word: לְאָבִיו
  choice: अपने पिता के लिए
  rationale: एकवचन पुल्लिंग प्रत्यय को बनाए रखते हुए ‘अपने पिता के लिए’ हिन्दी में कर्ता और पिता का संबंध स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: बहुवचन क्रियाओं के बाद וַיַּעַשׂ का एकवचन कर्ता
  choice: ‘उसने ... शोक मनाया’—एकवचन को बनाए रखा गया, जो प्रसंग में यूसुफ की ओर संकेत करता है।
  alternative: सामूहिक अर्थ मानकर ‘उन्होंने ... शोक मनाया’।
  rationale: मसोरेटिक पाठ बहुवचन ‘वे पहुँचे/उन्होंने विलाप किया’ से स्पष्टतः एकवचन ‘उसने किया’ पर आता है। एकवचन बनाए रखना पाठ की व्याकरणिक भिन्नता और यूसुफ पर संभावित बल—दोनों को सुरक्षित रखता है, पर मुख्य पाठ में नाम जोड़कर निहित कर्ता को आवश्यकता से अधिक निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘खलिहान’, ‘विलाप’ और ‘शोक मनाया’ पारंपरिक बाइबलीय गरिमा के साथ स्पष्ट आधुनिक हिन्दी देते हैं। मूल के एकवचन-बहुवचन परिवर्तन और ‘भारी’ की रूपकात्मक तीव्रता को फुटनोटों सहित संरक्षित किया गया है।
