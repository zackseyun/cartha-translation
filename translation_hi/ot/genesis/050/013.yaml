  to: उसके पुत्र उसे कनान देश ले गए और उसे मकपेला के खेत की गुफा में दफ़नाया। यह वही खेत था जिसे अब्राहम ने मम्रे के सामने हित्ती एप्रोन से दफ़नाने के लिए एक भू-संपत्ति के रूप में खरीदा था।
