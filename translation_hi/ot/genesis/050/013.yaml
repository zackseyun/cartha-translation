  register: आधुनिक मानक हिंदी की गरिमापूर्ण कथात्मक शैली अपनाई गई है। लंबे इब्रानी वाक्य को दो वाक्यों में बाँटकर संबंध स्पष्ट किया गया है, पर कोई स्रोत-तत्व छोड़ा नहीं गया। ‘दफ़नाया’ और ‘क़ब्रिस्तान’ सामान्य आधुनिक शब्द हैं; नुक़्तों का प्रयोग मानक वर्तनी के अनुसार किया गया है।
