reference: Genesis 50:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׂא֨וּ אֹת֤/וֹ בָנָי/ו֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יִּקְבְּר֣וּ אֹת֔/וֹ בִּ/מְעָרַ֖ת שְׂדֵ֣ה הַ/מַּכְפֵּלָ֑ה אֲשֶׁ֣ר קָנָה֩ אַבְרָהָ֨ם אֶת הַ/שָּׂדֶ֜ה לַ/אֲחֻזַּת קֶ֗בֶר מֵ/אֵ֛ת עֶפְרֹ֥ן הַ/חִתִּ֖י עַל פְּנֵ֥י מַמְרֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/013.yaml
  text: His sons carried him to the land of Canaan and buried him in the cave of the field of Machpelah[a], which Abraham had bought with the field as a burial property from Ephron the Hittite[c][b], opposite Mamre.
translation:
  language: hi
  text: उसके पुत्र उसे कनान देश ले गए और उसे मकपेला के खेत की गुफा में दफ़नाया। यह वही खेत था जिसे अब्राहम ने मम्रे के सामने हित्ती एप्रोन से दफ़नाने के लिए एक भू-संपत्ति के रूप में खरीदा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: उसे ... ले गए
  rationale: यहाँ נשׂא का आशय याकूब के शव को उठाकर कनान तक पहुँचाना है। हिंदी में ‘ले गए’ इस परिवहन को सहज रूप से व्यक्त करता है।
- source_word: בָנָיו
  choice: उसके पुत्र
  rationale: इब्रानी में स्पष्ट रूप से पुल्लिंग बहुवचन ‘उसके पुत्र’ है।
- source_word: אַרְצָה כְּנַעַן
  choice: कनान देश
  rationale: दिशासूचक रूप का अर्थ ‘कनान देश को/तक’ है; ‘ले गए’ के साथ ‘कनान देश’ स्वाभाविक हिंदी है।
- source_word: בִּמְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: मकपेला के खेत की गुफा में
  rationale: गुफा, खेत और मकपेला की इब्रानी संबंध-शृंखला को स्पष्ट और स्वाभाविक हिंदी में बनाए रखा गया है।
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: यह वही खेत था जिसे अब्राहम ने ... खरीदा था
  rationale: इब्रानी की पुनरुक्त कर्म-संरचना को स्वाभाविक हिंदी में खोलकर बताया गया है, जिससे स्पष्ट होता है कि अब्राहम ने खेत खरीदा था और गुफा उसी खेत में थी।
- source_word: לַאֲחֻזַּת קֶבֶר
  choice: क़ब्रिस्तान की स्थायी संपत्ति के रूप में
  rationale: אֲחֻזָּה केवल उपयोग-स्थल नहीं, अधिकार में ली हुई स्थायी मिल्कियत का बोध कराता है; यह अभिव्यक्ति दफ़नाने के प्रयोजन और संपत्ति दोनों को व्यक्त करती है।
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: हित्ती एप्रोन से
  rationale: व्यक्ति और जातीय पहचान को सीधे रखा गया है; Ephron का हिंदी रूप ‘एप्रोन’ नाम के इब्रानी उच्चारण के निकट है।
- source_word: עַל פְּנֵי מַמְרֵא
  choice: मम्रे के सामने
  rationale: यह स्थान-संबंध ‘सामने/सम्मुख’ व्यक्त करता है; केवल ‘पास’ कहना अर्थ को अनावश्यक रूप से सीमित करता।
