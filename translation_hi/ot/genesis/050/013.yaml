  verdict: revise
  source_fidelity: The draft preserves the principal actions, locations, and participants. However, “क़ब्रिस्तान” means a cemetery, whereas לַאֲחֻזַּת קֶבֶר denotes a property/holding acquired for burial, not necessarily a cemetery. “स्थायी” is also more explicit than the Hebrew wording itself.
  naturalness: The two-sentence structure is natural modern Hindi. The revised wording retains that clarity while using “भू-संपत्ति” to convey the legal/property sense without implying a developed cemetery.
  terminology: “मकपेला,” “अब्राहम,” “मम्रे,” “हित्ती,” and “एप्रोन” are acceptable Hindi renderings. “दफ़नाने के लिए एक भू-संपत्ति” more accurately renders the burial-property terminology than “क़ब्रिस्तान की स्थायी संपत्ति.”
  issues:
  - severity: medium
    issue: “क़ब्रिस्तान की स्थायी संपत्ति” for לַאֲחֻזַּת קֶבֶר
    rationale: The Hebrew refers to a possession or landed holding designated for burial. “क़ब्रिस्तान” specifically denotes a cemetery and can introduce an unsupported institutional or developed-site sense; “स्थायी” likewise overstates a nuance not explicitly expressed in the verse.
