  text: Then Joseph fell on his father's face and wept over him and kissed him[a].
translation:
  language: hi
  text: तब यूसुफ अपने पिता के चेहरे पर गिर पड़ा, उन पर रोया और उन्हें चूमा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: गिर पड़ा
  rationale: नפל के कथात्मक भूतकालीन रूप का सीधा और स्वाभाविक अनुवाद; यह यूसुफ की शारीरिक गति को व्यक्त करता है, बिना अतिरिक्त भावात्मक तीव्रता जोड़े।
- source_word: עַל פְּנֵי אָבִיו
  choice: अपने पिता के मुख पर
  rationale: इब्रानी की ठोस और मार्मिक छवि—‘अपने पिता के मुख पर’—को सुरक्षित रखता है; ‘मुख’ प्रसंग के गरिमापूर्ण वर्णन के अनुकूल है।
- source_word: וַיֵּבְךְּ עָלָיו
  choice: उन पर रोया
  rationale: בכה का अर्थ ‘रोना/विलाप करना’ है। עַל के साथ ‘उन पर रोया’ मृत पिता के शरीर पर झुककर रोने की इब्रानी छवि और शोक, दोनों को बनाए रखता है।
- source_word: וַיִּשַּׁק לוֹ
  choice: उन्हें चूमा
  rationale: נשק के सामान्य काल अर्थ ‘चूमना’ का सरल अनुवाद; हिन्दी में आदरसूचक बहुवचन सर्वनाम पिता के लिए स्वाभाविक है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: इस बाइबिलीय नाम का प्रचलित मानक हिन्दी रूप।
