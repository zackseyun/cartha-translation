base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/019.yaml
  text: But Joseph said to them[a], “Do not fear, for am I in the place of God?”
translation:
  language: hi
  text: परन्तु यूसुफ ने उनसे कहा, “मत डरो। क्या मैं परमेश्वर के स्थान पर हूँ?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्या मैं परमेश्वर के अधीन हूँ?” हिब्रू पदबंध मुहावरेदार है; यहाँ उसका सबसे सम्भावित अर्थ “क्या मैं परमेश्वर के स्थान पर हूँ?” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: हिब्रू कथात्मक शैली में אמר का यह रूप सामान्यतः ‘कहा’ के रूप में स्वाभाविक है।
- source_word: אֲלֵהֶם
  choice: उनसे
  rationale: אל के साथ बहुवचन सर्वनाम-प्रत्यय वचन के सम्बोधित व्यक्तियों को दर्शाता है; हिन्दी में ‘उनसे कहा’ स्वाभाविक है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: אַל תִּירָאוּ
  choice: मत डरो
  rationale: निषेधात्मक आदेश को आधुनिक, सीधी और बहुवचन-सम्बोधन वाली हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: अलग संयोजक के बिना स्वतंत्र अगला वाक्य
  rationale: यहाँ כִּי अगले अलंकारिक प्रश्न को आश्वासन के आधार के रूप में प्रस्तुत करता है। हिन्दी में ‘क्योंकि क्या मैं...?’ अस्वाभाविक है; दो वाक्यों का क्रम वही व्याख्यात्मक सम्बन्ध स्पष्ट रखता है।
- source_word: הֲתַחַת
  choice: क्या ... के स्थान पर
  rationale: 'प्रश्नवाचक הֲ और תַחַת को मिलाकर प्रसंगानुकूल मुहावरेदार अर्थ दिया गया है: परमेश्वर की भूमिका या अधिकार अपने हाथ में लेना।'
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ शब्द एकवचन अर्थ में इस्राएल के परमेश्वर को सूचित करता है; ‘परमेश्वर’ आधुनिक हिन्दी बाइबल-शैली में स्पष्ट और प्रतिष्ठित पद है।
- source_word: אָנִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम अलंकारिक प्रश्न में कर्ता पर बल बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के अधिकार के विषय में यूसुफ के अलंकारिक प्रश्न का आशय
  choice: यूसुफ पूछता है कि क्या वह परमेश्वर के स्थान पर है, और इस प्रकार न्याय या प्रतिशोध के परमाधिकार पर अपना दावा नकारता है।
  alternative: यूसुफ पूछता है कि क्या वह परमेश्वर के अधीन है।
  rationale: भाइयों के प्रतिशोध-भय और अगले पद में परमेश्वर के उद्देश्य के उल्लेख के संदर्भ में תַחַת אֱלֹהִים का सबसे स्वाभाविक अर्थ ‘परमेश्वर के स्थान पर’ है। फिर भी कम सम्भावित अधिक शाब्दिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली। ‘मत डरो’ प्रत्यक्ष और स्वाभाविक है। ‘परन्तु’ प्रसंगगत विरोध को बनाए रखता है। प्रश्न को अलग वाक्य बनाकर हिन्दी की स्वाभाविकता और हिब्रू के अलंकारिक बल दोनों सुरक्षित रखे गए हैं।
