  text: जब उस देश के निवासियों, अर्थात् कनानियों ने आताद के खलिहान में हो रहे मातम को देखा, तो उन्होंने कहा, “यह मिस्रियों का बहुत भारी मातम है।” इसीलिए उस स्थान का नाम आबेल-मिस्रैम[a] रखा गया। यह यरदन के पार[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आबेल-मिस्रैम’ सुनने में ‘मिस्र का मातम’ जैसा लगता है; यह कनानियों द्वारा इस घटना के वर्णन को प्रतिबिंबित करता है।
    reason: lexical_alternative
  - marker: b
    text: या “यरदन की दूसरी ओर”; यह अभिव्यक्ति भौगोलिक दृष्टिकोण पर निर्भर है।
    reason: lexical_alternative
