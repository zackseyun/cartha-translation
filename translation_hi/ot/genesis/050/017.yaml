source:
  edition: WLC
  text: כֹּֽה תֹאמְר֣וּ לְ/יוֹסֵ֗ף אָ֣נָּ֡א שָׂ֣א נָ֠א פֶּ֣שַׁע אַחֶ֤י/ךָ וְ/חַטָּאתָ/ם֙ כִּי רָעָ֣ה גְמָל֔וּ/ךָ וְ/עַתָּה֙ שָׂ֣א נָ֔א לְ/פֶ֥שַׁע עַבְדֵ֖י אֱלֹהֵ֣י אָבִ֑י/ךָ וַ/יֵּ֥בְךְּ יוֹסֵ֖ף בְּ/דַבְּרָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/017.yaml
  text: 'This is what you shall say to Yosef: ‘Please forgive the transgression of your brothers and their sin, because they repaid you with evil. And now, please forgive the transgression of the servants of the God of your father.’ And Yosef wept when they spoke to him.'
translation:
  language: hi
  text: “तुम यूसुफ से यह कहना, ‘कृपा करके अपने भाइयों का अपराध और उनका पाप क्षमा कर दे, क्योंकि उन्होंने तुझे बुराई का बदला दिया। अब कृपा करके तेरे पिता के परमेश्वर के सेवकों का अपराध क्षमा कर दे।’ जब उन्होंने यूसुफ से ये बातें कहीं, तो वह रो पड़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא נָא
  choice: कृपा करके ... क्षमा कर दे
  rationale: शाब्दिक अर्थ ‘उठा ले/वहन कर’ है, पर अपराध के साथ यह क्षमा करने का प्रचलित इब्रानी मुहावरा है; נָא की विनती ‘कृपा करके’ से व्यक्त हुई है।
- source_word: פֶּשַׁע ... וְחַטָּאתָם
  choice: अपराध और उनका पाप
  rationale: 'दोनों अलग नैतिक शब्दों को बनाए रखा गया है: פֶּשַׁע विद्रोह/अपराध और חַטָּאת पाप को सूचित करता है।'
- source_word: כִּי רָעָה גְמָלוּךָ
  choice: क्योंकि उन्होंने तेरे साथ बुराई की
  rationale: כִּי का कारणसूचक अर्थ ‘क्योंकि’ रखा गया; גמל के प्रतिफल देने वाले भाव को स्वाभाविक हिंदी में ‘साथ बुराई की’ कहा गया है।
- source_word: עַבְדֵי אֱלֹהֵי אָבִיךָ
  choice: अपने पिता के परमेश्वर के सेवकों
  rationale: संबंधसूचक संरचना को बिना अतिरिक्त धर्मवैचारिक व्याख्या के निकटता से रखा गया है।
- source_word: בְּדַבְּרָם אֵלָיו
  choice: जब उन्होंने यूसुफ से ये बातें कहीं
  rationale: इब्रानी क्रियार्थक संरचना का स्वाभाविक कालवाचक हिंदी रूप; बहुवचन कर्ता को यथावत रखा गया है।
theological_decisions:
- issue: भाइयों की विनती में अपराध और पाप का संबंध
  choice: दोनों संज्ञाएँ अलग रखी गईं
  alternative: ‘अपने भाइयों के पापरूपी अपराध’ जैसे एकीकृत रूप में प्रस्तुत करना
  rationale: मूल पाठ समन्वयबोधक וְ से दोनों शब्द रखता है; उन्हें मिलाने से नैतिक भाषा की मूल विविधता घटती।
- issue: ‘अपने पिता के परमेश्वर’ की अभिव्यक्ति
  choice: मूल संबंधसूचक पद को यथावत रखा
  alternative: ‘हम सबके परमेश्वर’ या ‘इस्राएल के परमेश्वर’
  rationale: वक्ता पहचान या वाचा-संबंध के बारे में पाठ से आगे कोई निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। पारिवारिक प्रत्यक्ष संबोधन में ‘तेरे/कर दे’ मूल के एकवचन रूप को स्पष्ट और स्वाभाविक ढंग से रखता है। उद्धरण-स्तरों को हिंदी विरामचिह्नों से स्पष्ट किया गया है।
