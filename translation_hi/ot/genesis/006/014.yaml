base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/014.yaml
  text: Make yourself an ark of gopher wood[a]; make rooms in the ark[c][b], and cover it inside and outside with pitch.
translation:
  language: hi
  text: अपने लिए गोफेर की लकड़ी[a] का एक जहाज़ बना। जहाज़ में खाने[b] बना, और उसे भीतर और बाहर डामर से पोत दे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सरू की लकड़ी’; ‘गोफेर’ का इब्रानी शब्द केवल यहीं मिलता है, इसलिए लकड़ी की ठीक किस्म अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अलग-अलग कक्ष’; शाब्दिक अर्थ ‘घोंसले’ है।
    reason: lexical_alternative
  - marker: c
    text: या ‘लेप कर’ अथवा ‘सील कर’; लेप के पदार्थ को ‘बिटूमेन’ या ‘तारकोल’ भी कहा जा सकता है। इब्रानी में पोतने की क्रिया और पोतने के पदार्थ के लिए आपस में संबंधित शब्द आए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: अपने लिए ... बना
  rationale: आज्ञार्थक עֲשֵׂה और लाभार्थक לְךָ का सीधा, स्वाभाविक हिन्दी रूप; कर्ता संदर्भ से स्पष्ट है।
- source_word: תֵּבַת
  choice: जहाज़
  rationale: תֵּבָה सामान्य समुद्री जहाज़ के लिए प्रयुक्त शब्द नहीं है और सन्दूक-जैसे पात्र को सूचित कर सकता है; फिर भी उत्पत्ति 6–9 के विशाल जलयान के लिए ‘जहाज़’ आधुनिक हिन्दी में सबसे स्पष्ट और प्रचलित संदर्भगत विकल्प है।
- source_word: עֲצֵי גֹפֶר
  choice: गोफेर की लकड़ी
  rationale: גֹפֶר केवल इसी स्थान पर मिलता है और वृक्ष की ठीक पहचान अनिश्चित है; इसलिए किसी अनुमानित प्रजाति को निश्चित करने के बजाय मूल शब्द का लिप्यंतरण रखा गया है।
- source_word: קִנִּים
  choice: खाने
  rationale: शब्द का शाब्दिक संबंध ‘घोंसलों’ से है, पर यहाँ जहाज़ के भीतर बने अलग-अलग विभाग अभिप्रेत हैं; ‘खाने’ सहज हिन्दी में उस संरचना को व्यक्त करता है।
- source_word: וְכָפַרְתָּ
  choice: पोत दे
  rationale: इस गैर-अनुष्ठानिक संदर्भ में क्रिया का अर्थ किसी पदार्थ की परत चढ़ाना या ढकना है; ‘पोत दे’ सतह पर जलरोधी पदार्थ लगाने की क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּכֹּפֶר
  choice: डामर से
  rationale: כֹּפֶר यहाँ जहाज़ को जलरोधी बनाने के लिए लगाए जाने वाले पदार्थ को सूचित करता है। ‘डामर’ सामान्य पाठक के लिए स्पष्ट है, जबकि पदार्थ की सटीक पहचान को पादटिप्पणी में खुला रखा गया है।
- source_word: מִבַּיִת וּמִחוּץ
  choice: भीतर और बाहर
  rationale: यह युग्म जहाज़ की भीतरी और बाहरी दोनों सतहों को स्पष्ट, मुहावरेदार हिन्दी में व्यक्त करता है।
