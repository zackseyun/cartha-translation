  text: הַ/נְּפִלִ֞ים הָי֣וּ בָ/אָרֶץ֮ בַּ/יָּמִ֣ים הָ/הֵם֒ וְ/גַ֣ם אַֽחֲרֵי כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽ/אֱלֹהִים֙ אֶל בְּנ֣וֹת הָֽ/אָדָ֔ם וְ/יָלְד֖וּ לָ/הֶ֑ם הֵ֧מָּה הַ/גִּבֹּרִ֛ים אֲשֶׁ֥ר מֵ/עוֹלָ֖ם אַנְשֵׁ֥י הַ/שֵּֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/004.yaml
  text: The Nephilim were on the earth in those days—and also afterward—when the sons of God came in to the daughters of man[a], and they bore children to them. Those were the mighty men who were of old[c][b], men of renown.
translation:
  language: hi
  text: उन दिनों पृथ्वी पर नफीलीम[a] थे—और उसके बाद भी—जब परमेश्वर के पुत्र[b] मनुष्य की पुत्रियों[c] के पास गए और उन्होंने उनसे संतानें जनीं। वे ही प्राचीन काल के वे वीर पुरुष थे, जो नामी लोग थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत रूप से इसका अनुवाद “दैत्य” भी किया गया है। इब्रानी शब्द “नफीलीम” दुर्लभ है और इसका सटीक अर्थ अनिश्चित है।
    reason: alternative_reading
  - marker: b
    text: “परमेश्वर के पुत्र” का अर्थ “दिव्य प्राणी” भी समझा जा सकता है; कुछ व्याख्याओं में इन्हें मानवीय शासक या शेत के भक्त वंश के लोग माना गया है।
    reason: alternative_reading
  - marker: c
    text: “मनुष्य” यहाँ सामूहिक अर्थ में है; अभिप्राय मानव स्त्रियों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִלִים
  choice: नपीली
  rationale: यह दुर्लभ और अनिश्चित अर्थ वाला इब्रानी पद है; लिप्यंतरण ‘दैत्य’ या ‘गिरे हुए’ जैसी विवादित व्याख्याओं को मुख्य पाठ पर नहीं थोपता।
- source_word: בָאָרֶץ
  choice: पृथ्वी पर
  rationale: आदिकालीन इतिहास के व्यापक संदर्भ में ‘पृथ्वी’ स्वाभाविक है, यद्यपि ‘देश’ भी शब्दार्थ की दृष्टि से संभव है।
- source_word: בַּיָּמִים הָהֵם וְגַם אַחֲרֵי כֵן
  choice: उन दिनों—और उसके बाद भी—
  rationale: यह कालसूचक वाक्यांश और וְגַם की योगात्मक शक्ति दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲשֶׁר יָבֹאוּ ... אֶל
  choice: जब ... के पास गए
  rationale: אֲשֶׁר यहाँ परिस्थितिक अथवा कालसूचक संबंध व्यक्त करता है। ‘के पास गए’ यौन-संबंध के इब्रानी शिष्टोक्ति-सूचक प्रयोग को बिना अशिष्ट विस्तार के सुरक्षित रखता है।
- source_word: בְּנֵי הָאֱלֹהִים
  choice: परमेश्वर के पुत्र
  rationale: यह निकट औपचारिक अनुवाद है, जो इनकी पहचान को अलौकिक प्राणी, शासक या शेत की भक्त वंशावली मानने के बीच निर्णय नहीं करता।
- source_word: בְּנוֹת הָאָדָם
  choice: मनुष्य की पुत्रियाँ
  rationale: אָדָם के एकवचन सामूहिक अर्थ को सुरक्षित रखते हुए हिन्दी में स्पष्ट करता है कि अभिप्राय मानव स्त्रियों से है।
- source_word: וְיָלְדוּ לָהֶם
  choice: उन्होंने उनके लिए संतानें जनीं
  rationale: अंतर्निहित कर्म ‘संतानें’ को हिन्दी में स्पष्ट किया गया है और לָהֶם के अप्रत्यक्ष संबंध को ‘उनके लिए’ से बनाए रखा गया है।
- source_word: הֵמָּה הַגִּבֹּרִים
  choice: वे ही ... वीर पुरुष
  rationale: הֵמָּה का पुनरारंभिक और पहचानसूचक बल ‘वे ही’ से आता है; ‘वीर पुरुष’ גִּבֹּרִים की पुरुषवाचकता और व्यापक सामर्थ्य-सूचक अर्थ को रखता है।
- source_word: אֲשֶׁר מֵעוֹלָם
  choice: प्राचीन काल के
  rationale: यह इस संदर्भ में पुरातनता को संक्षिप्त और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אַנְשֵׁי הַשֵּׁם
  choice: नामी लोग
  rationale: शाब्दिक ‘नाम के पुरुष’ प्रतिष्ठा अथवा प्रसिद्धि का मुहावरा है; ‘नामी लोग’ आधुनिक हिन्दी में उसी भाव का स्वाभाविक रूप है।
theological_decisions:
- issue: ‘परमेश्वर के पुत्रों’ की पहचान
  choice: मुख्य पाठ में ‘परमेश्वर के पुत्र’ रखा गया है।
  alternative: ‘दिव्य प्राणी’, मानवीय राजा/शासक, अथवा शेत का भक्त वंश।
  rationale: इब्रानी अभिव्यक्ति इस संदर्भ में विवादित है; औपचारिक पदावली वास्तविक धर्मवैज्ञानिक तनाव को सुरक्षित रखती है।
- issue: הַנְּפִלִים का अर्थ
  choice: मुख्य पाठ में ‘नपीली’ लिप्यंतरित किया गया है।
  alternative: ‘दैत्य’ अथवा ‘गिरे हुए’।
  rationale: शब्द दुर्लभ है और इसका सटीक अर्थ निश्चित नहीं; लिप्यंतरण किसी एक परंपरागत या व्युत्पत्तिमूलक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- issue: בְּנוֹת הָאָדָם में אָדָם का अर्थ
  choice: ‘मनुष्य की पुत्रियाँ’
  alternative: ‘मानवजाति की स्त्रियाँ’ अथवा ‘मनुष्यों की पुत्रियाँ’।
  rationale: यह इब्रानी के एकवचन सामूहिक रूप को बनाए रखता है; पादटिप्पणी समावेशी सामूहिक अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। दुर्लभ ‘नपीली’ और विवादित ‘परमेश्वर के पुत्र’ को व्याख्यात्मक रूप से हल करने के बजाय पादटिप्पणियों सहित सुरक्षित रखा गया है।
