lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ कि
  rationale: यह कथात्मक सूत्र कहानी में एक नया घटनाक्रम आरम्भ करता है; यह रूप उसके कार्य को स्वाभाविक, गैर-पुरातन हिन्दी में बनाए रखता है।
- source_word: כִּי
  choice: जब
  rationale: וַיְהִי के बाद यह शब्द समयसूचक उपवाक्य आरम्भ करता है।
- source_word: הֵחֵל ... לָרֹב
  choice: बढ़ने लगे
  rationale: यह आरम्भ और संख्यात्मक वृद्धि, दोनों भावों को सहज हिन्दी में व्यक्त करता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ एकवचन शब्द सामूहिक अर्थ में पूरी मानवजाति को दर्शाता है, किसी एक पुरुष या केवल आदम को नहीं।
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: धरती की सतह पर
  rationale: यह עַל־פְּנֵי की सतह-संबंधी छवि और אֲדָמָה के भूमि/धरती अर्थ को बनाए रखता है।
- source_word: וּבָנוֹת
  choice: और ... बेटियाँ
  rationale: सरल और स्वाभाविक हिन्दी समतुल्य, जो अगले पद के विषय की भूमिका बाँधता है।
- source_word: יֻלְּדוּ לָהֶם
  choice: उनके यहाँ ... पैदा हुईं
  rationale: इब्रानी कर्मवाच्य और संबंधसूचक לָהֶם का स्वाभाविक हिन्दी रूप; इसका आशय उस मानव-समुदाय में बेटियों के जन्म से है।
theological_decisions:
- issue: הָאָדָם का सामूहिक अर्थ
  choice: मनुष्य
  alternative: मानवजाति
  rationale: इब्रानी में शब्द व्याकरणतः एकवचन है, पर यहाँ उसका अर्थ सामूहिक है। ‘मनुष्य’ स्रोत की प्रतिनिधिक एकवचनता बचाता है; पादटिप्पणी स्पष्ट करती है कि आशय समस्त मानवजाति है।
translation_notes:
