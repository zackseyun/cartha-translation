source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה אֶמְחֶ֨ה אֶת הָ/אָדָ֤ם אֲשֶׁר בָּרָ֨אתִי֙ מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה מֵֽ/אָדָם֙ עַד בְּהֵמָ֔ה עַד רֶ֖מֶשׂ וְ/עַד ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/007.yaml
  text: So Yahweh said[a], “I will blot out man, whom I have created[c], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I regret that I have made them[b].”
translation:
  language: hi
  text: तब यहोवा ने कहा, “मैं मनुष्यजाति[a] को, जिसे मैंने रचा है, धरती के ऊपर से मिटा दूँगा—मनुष्य से लेकर पशुओं तक, रेंगनेवाले जीवों तक और आकाश के पक्षियों तक—क्योंकि मुझे खेद है कि मैंने उन्हें बनाया है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मनुष्य।” यहाँ हिब्रू आदाम पूरी मानवता को सामूहिक रूप से सूचित कर सकता है; इसी शब्द का अगला प्रयोग “मनुष्य से लेकर” वाक्यांश में है।
    reason: lexical_alternative
  - marker: b
    text: या “मुझे दुःख है कि मैंने उन्हें बनाया है।” हिब्रू क्रिया खेद या शोक व्यक्त कर सकती है; वह अपने आप में यह नहीं कहती कि परमेश्वर चकित हुआ, उसे पहले से ज्ञान नहीं था, या उसने कोई नैतिक भूल की।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के विशिष्ट नाम YHWH का प्रचलित और पहचाना जानेवाला लिप्यंतरण।
- source_word: אֶמְחֶה
  choice: मिटा दूँगा
  rationale: क्रिया מחה के पोंछकर मिटा देने के ठोस बिंब को स्वाभाविक हिन्दी में व्यक्त करता है और ‘धरती के ऊपर से’ के साथ सहज बैठता है।
- source_word: הָאָדָם
  choice: मनुष्यजाति
  rationale: यहाँ אָדָם सामूहिक रूप से समस्त मानवता को सूचित करता है; हिन्दी में ‘मनुष्यजाति’ इस सामूहिक अर्थ को स्पष्ट रखता है।
- source_word: אֲשֶׁר בָּרָאתִי
  choice: जिसे मैंने रचा है
  rationale: सृष्टि के पूर्ण हो चुके कार्य और उसके वर्तमान संबंध को स्वाभाविक हिन्दी में रखता है।
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: धरती के ऊपर से
  rationale: हिब्रू मुहावरे का अर्थ स्पष्ट करता है; אֲדָמָה यहाँ भूमि/धरती को सूचित करता है।
- source_word: מֵאָדָם עַד בְּהֵמָה עַד רֶמֶשׂ וְעַד עוֹף הַשָּׁמַיִם
  choice: मनुष्य से लेकर पशुओं तक, रेंगनेवाले जीवों तक और आकाश के पक्षियों तक
  rationale: हिब्रू की क्रमिक गणना और सभी प्राणी-वर्गों के विस्तार को सहज, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: נִחַמְתִּי
  choice: मुझे खेद है
  rationale: पूर्व कार्य के प्रति व्यक्त पछतावे या गहरे दुःख की वास्तविक भाषिक कठिनाई को बिना धर्मवैज्ञानिक तनाव मिटाए व्यक्त करता है।
- source_word: כִּי עֲשִׂיתִם
  choice: कि मैंने उन्हें बनाया है
  rationale: बहुवचन प्रत्यय को पहले उल्लिखित मनुष्यों और जीवों की ओर लौटाता है तथा पूर्ण कार्य के वर्तमान परिणाम को व्यक्त करता है।
theological_decisions:
- issue: नִחַמְתִּי में परमेश्वर के खेद का वर्णन
  choice: क्योंकि मुझे खेद है कि मैंने उन्हें बनाया है
  alternative: क्योंकि मुझे दुःख है कि मैंने उन्हें बनाया है
  rationale: निफ़अल रूप पूर्व कार्य के विषय में खेद या शोक व्यक्त करता है। ‘खेद’ उसके पश्चाद्दृष्टि वाले भाव को स्पष्ट रखता है, पर अपने आप में यह नहीं कहता कि परमेश्वर चकित हुआ, उसे पूर्वज्ञान न था, या उसने नैतिक भूल की।
- issue: הָאָדָם का सामूहिक अर्थ
  choice: मनुष्यजाति
  alternative: मनुष्य
  rationale: पहला प्रयोग पूरी मानवता के लिए सामूहिक है। ‘मनुष्यजाति’ हिन्दी पाठक के लिए यह अर्थ स्पष्ट करता है, जबकि अगली गणना में ‘मनुष्य’ रखकर उसी मूल शब्द की पुनरावृत्ति का यथासंभव संकेत दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘मिटा दूँगा’ मूल के ठोस बिंब को रखता है; ‘रेंगनेवाले जीव’ वर्तमान हिन्दी में स्पष्ट है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
