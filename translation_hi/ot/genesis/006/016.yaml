  text: צֹ֣הַר תַּֽעֲשֶׂ֣ה לַ/תֵּבָ֗ה וְ/אֶל אַמָּה֙ תְּכַלֶ֣/נָּה מִ/לְ/מַ֔עְלָ/ה וּ/פֶ֥תַח הַ/תֵּבָ֖ה בְּ/צִדָּ֣/הּ תָּשִׂ֑ים תַּחְתִּיִּ֛ם שְׁנִיִּ֥ם וּ/שְׁלִשִׁ֖ים תַּֽעֲשֶֽׂ/הָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/016.yaml
  text: You shall make a roof for the ark[a], and finish it to within a cubit from above. And you shall set the ark’s door in its side. You shall make it with lower, second[d][c][b], and third levels.
translation:
  language: hi
  text: तुम जहाज़ के लिए एक छत[a] बनाओ और उसे ऊपर से एक हाथ तक पूरा करो[b]। जहाज़ का द्वार उसके पार्श्व में रखो। उसमें निचला, दूसरा और तीसरा तल बनाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खिड़की’ अथवा ‘रोशनदान’; यहाँ प्रयुक्त हिब्रू शब्द दुर्लभ है और संभव है कि वह पूरी छत के बजाय प्रकाश आने के लिए बने किसी खुले स्थान को दर्शाता हो।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में ‘ऊपर से एक हाथ तक पूरा करो’ वाक्यांश कठिन है। संभवतः यह जहाज़ के ऊपरी भाग को एक हाथ के माप तक पूरा करने, अथवा ऊपर के निकट एक हाथ के माप पर समाप्त करने का संकेत देता है।
    reason: cultural_note
lexical_decisions:
- source_word: צֹהַר
  choice: छत
  rationale: यह दुर्लभ शब्द है और इसका सटीक अर्थ अनिश्चित है। प्रसंग में जहाज़ के ऊपरी संरचनात्मक भाग का संकेत संभव है; इसलिए मुख्य पाठ में ‘छत’ रखा गया है, जबकि ‘खिड़की’ और ‘रोशनदान’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תַּעֲשֶׂה לַתֵּבָה
  choice: जहाज़ के लिए ... बनाना
  rationale: עשה के साथ ל उस वस्तु को दिखाता है जिसके लिए निर्माण होना है। आधुनिक हिन्दी में यह स्वाभाविक आज्ञार्थक रूप है।
- source_word: וְאֶל אַמָּה תְּכַלֶנָּה מִלְמַעְלָה
  choice: उसे ऊपर एक हाथ तक पूरा करना
  rationale: כלה के पिएल रूप का अर्थ ‘पूरा करना’ है। कठिन और स्थापत्य की दृष्टि से अस्पष्ट वाक्यांश को बिना यह निश्चित किए निकटता से प्रस्तुत किया गया है कि ऊपरी भाग किस प्रकार एक हाथ का था।
- source_word: פֶּתַח
  choice: द्वार
  rationale: जहाज़ में प्रवेश के लिए बने खुले स्थान के संदर्भ में ‘द्वार’ सबसे स्वाभाविक हिन्दी शब्द है।
- source_word: בְּצִדָּהּ
  choice: उसकी बगल में
  rationale: ב और צד का मेल जहाज़ की पार्श्व दिशा में स्थान बताता है; ‘बगल में’ सरल और स्पष्ट आधुनिक हिन्दी है।
- source_word: תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים
  choice: निचला, दूसरा और तीसरा तल
  rationale: ये रूप जहाज़ के तीन स्तरों को बताते हैं। ‘तल’ हिन्दी में तटस्थ है और जलयान के ‘डेक’ तथा इमारत की ‘मंज़िल’—दोनों में से किसी एक कल्पना को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: תַּעֲשֶׂהָ
  choice: उसमें ... बनाना
  rationale: स्त्रीलिंग प्रत्यय जहाज़ की ओर लौटता है। हिन्दी में तीन तलों के संबंध को स्पष्ट और स्वाभाविक बनाने के लिए ‘उसमें’ प्रयोग किया गया है।
theological_decisions:
- issue: ऊपरी संरचना का स्वरूप
  choice: मुख्य पाठ में ‘छत’, साथ में वैकल्पिक अर्थों की पादटिप्पणी
  alternative: खिड़की या रोशनदान
  rationale: दुर्लभ हिब्रू शब्द का अर्थ धर्मवैचारिक आधार पर निश्चित नहीं किया गया; वास्तविक शाब्दिक अनिश्चितता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण निर्देशात्मक शैली रखी गई है। ‘हाथ’ प्राचीन माप ‘क्यूबिट’ का पारंपरिक और सहज हिन्दी समतुल्य है। कठिन ऊपरी-विन्यास संबंधी वाक्यांश की अस्पष्टता को मुख्य पाठ में बनाए रखा गया है।
