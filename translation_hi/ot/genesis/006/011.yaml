  text: וַ/תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֑ים וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/011.yaml
  text: The earth was corrupt before God[a], and the earth was filled with violence.
translation:
  language: hi
  text: पृथ्वी परमेश्वर के सामने[a] भ्रष्ट हो गई, और पृथ्वी हिंसा से भर गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर की दृष्टि में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׁחֵת
  choice: भ्रष्ट हो गई थी
  rationale: निफ़अल रूप पृथ्वी के बिगड़ जाने या भ्रष्ट अवस्था में पहुँचने को व्यक्त करता है। आधुनिक हिन्दी में यह नैतिक संदर्भ और परिणामसूचक भाव दोनों स्वाभाविक रूप से रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है। जलप्रलय के व्यापक कथात्मक संदर्भ में ‘पृथ्वी’ उपयुक्त है; मूल की पुनरावृत्ति भी बनाए रखी गई है।
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: यह לִפְנֵי के ‘सामने/उपस्थिति में’ भाव को निकटता से रखता है और परमेश्वर की दृष्टि में होने का आशय भी समेटता है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: संदर्भ और व्याकरण में यह एकमात्र परमेश्वर को सूचित करता है; आधुनिक हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ स्पष्ट और प्रतिष्ठित रूप है।
- source_word: וַתִּמָּלֵא
  choice: भर गई थी
  rationale: निफ़अल रूप पृथ्वी के हिंसा से पूर्ण हो जाने की परिणामी अवस्था बताता है। ‘भर गई थी’ हिन्दी में कथानक की प्रगति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חָמָס
  choice: हिंसा
  rationale: यह शब्द हिंसा, क्रूरता और हिंसक अन्याय को सूचित कर सकता है। ‘हिंसा’ सबसे सीधा और संदर्भानुकूल हिन्दी प्रतिशब्द है।
- source_word: וַ
  choice: और
  rationale: दूसरे खंड का वाव समन्वयात्मक रूप से ‘और’ द्वारा व्यक्त किया गया है; आरंभिक वाव को अलग कालसूचक शब्द जोड़े बिना हिन्दी वाक्य-प्रवाह में समाहित किया गया है।
theological_decisions:
- issue: भ्रष्टता का स्वरूप
  choice: पृथ्वी/मानव समाज की नैतिक भ्रष्टता
  alternative: पृथ्वी का भौतिक रूप से बिगड़ना या नष्ट होना
  rationale: निकटवर्ती संदर्भ मनुष्य की दुष्टता और हिंसा पर बल देता है। फिर भी अनुवाद केवल ‘भ्रष्ट’ कहता है और पाठ से अधिक विशिष्ट धार्मिक निष्कर्ष नहीं जोड़ता।
- issue: לִפְנֵי में दैवी मूल्यांकन का भाव
  choice: परमेश्वर के सामने
  alternative: परमेश्वर की दृष्टि में
  rationale: ‘सामने’ मूल अभिव्यक्ति की स्थानिक/उपस्थितिपरक अस्पष्टता बनाए रखता है, जबकि संदर्भ में दैवी अवलोकन और मूल्यांकन का भाव संभव रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पृथ्वी’ की पुनरावृत्ति मूल इब्रानी के बलाघात के अनुरूप जानबूझकर बनाए रखी गई है; आरंभ में कोई अस्रोतित ‘अब’ नहीं जोड़ा गया।
