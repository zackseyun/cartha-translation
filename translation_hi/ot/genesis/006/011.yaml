  to: पृथ्वी परमेश्वर के सामने[a] भ्रष्ट हो गई, और पृथ्वी हिंसा से भर गई।
  rationale: The revision changes only verbal aspect, replacing Hindi pluperfects with simple narrative perfects to reflect the Hebrew wayyiqtol sequence more naturally. The source’s repetition of “पृथ्वी,” the ambiguity of “परमेश्वर के सामने,” and the concise rendering of חמס as “हिंसा” are retained.
