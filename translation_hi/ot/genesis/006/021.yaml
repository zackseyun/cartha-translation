base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/021.yaml
  text: And you[a], take for yourself some of every kind of food that is edible, and gather it to yourself[b]; and it shall be food for you and for them.
translation:
  language: hi
  text: और तुम हर प्रकार के खाने योग्य भोजन[a] में से कुछ अपने लिए ले लेना और उसे अपने पास इकट्ठा कर लेना। वह तुम्हारे और उनके खाने के लिए होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो खाया जाता है”; इसका अर्थ “जो खाया जा सकता है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: अपने लिए ले लेना
  rationale: आज्ञार्थक क्रिया की सीधाई और לְךָ के हितार्थक/आत्मवाचक भाव—नूह को अपने लिए सामग्री लेने की जिम्मेदारी—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִכָּל מַאֲכָל
  choice: हर प्रकार के ... भोजन में से कुछ
  rationale: מִן के चयनात्मक भाव और כָּל की व्यापकता को व्यक्त करता है; इसका अर्थ यह नहीं लगाया गया कि नूह संसार का सारा भोजन ले ले।
- source_word: אֲשֶׁר יֵאָכֵל
  choice: खाने योग्य
  rationale: אכל का निफ़अल रूप शाब्दिक रूप से ‘जो खाया जाता है’ हो सकता है, पर यहाँ भोजन की वह श्रेणी बताता है जिसे खाया जा सकता है। ‘खाने योग्य’ आधुनिक हिन्दी में स्वाभाविक है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וְאָסַפְתָּ אֵלֶיךָ
  choice: उसे अपने पास इकट्ठा कर लेना
  rationale: אָסַף के ‘इकट्ठा करना’ और אֵלֶיךָ के ‘अपने पास’ दोनों अर्थों को बनाए रखता है, बिना ‘भंडार करना’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: וְהָיָה לְךָ וְלָהֶם לְאָכְלָה
  choice: वह तुम्हारे और उनके खाने के लिए होगा
  rationale: परिणामसूचक भविष्य भाव, नूह और पशुओं के बीच स्पष्ट भेद, तथा לְאָכְלָה के प्रयोजनार्थक अर्थ को सहज हिन्दी में बनाए रखता है।
