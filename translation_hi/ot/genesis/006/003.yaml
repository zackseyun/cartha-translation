source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה לֹֽא יָד֨וֹן רוּחִ֤/י בָֽ/אָדָם֙ לְ/עֹלָ֔ם בְּ/שַׁ/גַּ֖ם ה֣וּא בָשָׂ֑ר וְ/הָי֣וּ יָמָ֔י/ו מֵאָ֥ה וְ/עֶשְׂרִ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/003.yaml
  text: Then Yahweh said[a], “My Spirit will not contend with man forever, for he is flesh[c][b]; therefore his days will be one hundred and twenty years.”
translation:
  language: hi
  text: तब याहवे ने कहा, “मेरी आत्मा मनुष्य के साथ सदा संघर्ष नहीं करती रहेगी[a], क्योंकि वह देह मात्र है[b]। इसलिए उसके दिन एक सौ बीस वर्ष होंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी आत्मा मनुष्य में सदा बनी नहीं रहेगी” या “निवास नहीं करेगी”; यहाँ प्रयुक्त इब्रानी क्रिया का अर्थ कठिन और विवादित है।
    reason: alternative_reading
  - marker: b
    text: या, “क्योंकि वह भी देह है।” ‘मनुष्य’ यहाँ इब्रानी आदाम का एकवचन रूप है, जो सामान्य रूप से मानवजाति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: יָדוֹן
  choice: संघर्ष नहीं करता रहेगा
  rationale: दुर्लभ और विवादित क्रिया का अर्थ यहाँ मनुष्य के प्रति परमेश्वर के आत्मा के विरोध या प्रतिरोध के रूप में लिया गया है; ‘बना नहीं रहेगा’ सम्भव विकल्प है और पादटिप्पणी में रखा गया है।
- source_word: רוּחִי
  choice: मेरा आत्मा
  rationale: ईश्वरीय वक्ता के प्रथम पुरुष संबंधसूचक रूप के कारण इसे परमेश्वर के आत्मा के रूप में प्रस्तुत किया गया है, जबकि बाद की धर्मवैज्ञानिक विशिष्टता आरोपित नहीं की गई।
- source_word: בָאָדָם
  choice: मनुष्य के साथ
  rationale: יָדוֹן को ‘संघर्ष करना’ समझने पर ב का स्वाभाविक हिन्दी संबंध ‘के साथ’ है; ‘मनुष्य’ यहाँ समस्त मानवजाति का प्रतिनिधित्व करने वाला एकवचन है।
- source_word: לְעֹלָם
  choice: सदा
  rationale: इस प्रसंग में अनिश्चित अथवा निरन्तर काल का सहज और गरिमापूर्ण हिन्दी रूप।
- source_word: בְּשַׁגַּם הוּא בָשָׂר
  choice: क्योंकि वह देहधारी ही है
  rationale: दुर्लभ בְּשַׁגַּם को कारणसूचक माना गया है। ‘ही’ גַּם के बलात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘देहधारी’ בָשָׂר की नश्वर मानवीय दशा का संकेत देता है।
- source_word: וְהָיוּ יָמָיו
  choice: इसलिए उसके दिन ... होंगे
  rationale: वाव से जुड़े अगले वाक्य को पूर्व कथन के परिणाम के रूप में समझते हुए संबंध स्पष्ट किया गया है, यद्यपि निष्कर्षसूचकता मूल में अलग शब्द से व्यक्त नहीं है।
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: एक सौ बीस वर्ष
  rationale: मूल संख्या का स्पष्ट, साहित्यिक हिन्दी रूप।
theological_decisions:
- issue: मनुष्य के संबंध में परमेश्वर के आत्मा की क्रिया
  choice: ‘मेरा आत्मा ... संघर्ष नहीं करता रहेगा’
  alternative: ‘मेरा आत्मा मनुष्य में सदा बना नहीं रहेगा’
  rationale: יָדוֹן का अर्थ अनिश्चित है। मुख्य पाठ में संघर्ष/प्रतिरोध का अर्थ रखा गया है, पर निवास अथवा बने रहने के अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: רוּחִי का आशय
  choice: ‘मेरा आत्मा’—पुराने नियम के सामान्य अर्थ में परमेश्वर का आत्मा
  alternative: ‘मेरी श्वास’ अथवा ‘मेरा जीवन-श्वास’
  rationale: ईश्वरीय वक्ता का संबंधसूचक रूप ‘आत्मा’ के पक्ष में है; अनुवाद बाद की त्रिएकतावादी परिभाषा को इस पद पर आरोपित नहीं करता।
- issue: אָדָם का दायरा
  choice: प्रतिनिधिक एकवचन ‘मनुष्य’
  alternative: ‘मानवजाति’
  rationale: इब्रानी एकवचन शब्द यहाँ सामान्य रूप से मानवजाति को दर्शाता है; हिन्दी ‘मनुष्य’ उस एकवचन और सामूहिक आशय दोनों को स्वाभाविक रूप से बनाए रखता है।
- issue: एक सौ बीस वर्षों का आशय
  choice: अर्थ को अनिर्णीत रखते हुए केवल ‘उसके दिन ... होंगे’
  alternative: व्यक्ति की अधिकतम आयु अथवा जलप्रलय तक शेष अवधि
  rationale: पद स्वयं स्पष्ट नहीं करता कि संख्या मानव जीवन-सीमा है या न्याय आने तक का समय; अनुवाद किसी एक व्याख्या को मुख्य पाठ में नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण बाइबिलीय गद्य अपनाया गया है। ‘यहवे’ में ईश्वरीय नाम सुरक्षित है। विवादित इब्रानी क्रिया की अस्पष्टता पादटिप्पणी में रखी गई है, और 120 वर्षों की व्याख्यात्मक पहचान जानबूझकर खुली छोड़ी गई है।
