lexical_decisions:
- source_word: וּמִכָּל הַחַי מִכָּל בָּשָׂר
  choice: और सब प्रकार के जीवित प्राणियों में से—अर्थात् सब देहधारी जीवों में से
  rationale: हिब्रू की व्यापक अभिव्यक्ति को रखते हुए आधुनिक हिन्दी में स्वाभाविक बनाया गया है। ‘देहधारी जीव’ מִכָּל בָּשָׂר (‘सब देह/मांस’) का प्रसंगानुकूल अर्थ स्पष्ट करता है, बिना इसे केवल किसी एक पशु-वर्ग तक सीमित किए।
- source_word: שְׁנַיִם מִכֹּל
  choice: दो-दो को
  rationale: यह प्रत्येक प्रकार में से दो लेने के वितरणात्मक भाव को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תָּבִיא אֶל הַתֵּבָה
  choice: जहाज़ में ... ले आना
  rationale: निर्देशात्मक हिफ़ील रूप को हिन्दी के स्वाभाविक आज्ञार्थक अनन्त रूप में दिया गया है। इस प्रसंग में תֵּבָה के लिए ‘जहाज़’ सामान्य पाठक को स्पष्ट है।
- source_word: לְהַחֲיֹת אִתָּךְ
  choice: अपने पास ... ताकि वे जीवित रहें
  rationale: ‘अपने पास’ साथ रहने का भाव देता है और उद्देश्यवाचक उपवाक्य हिफ़ील के जीवन बचाए रखने वाले आशय को स्पष्ट करता है।
- source_word: זָכָר וּנְקֵבָה יִהְיוּ
  choice: वे नर और मादा हों
  rationale: जैविक लिंग की जोड़ी को सीधे व्यक्त करते हुए निर्देशात्मक भाव सुरक्षित रखा गया है।
