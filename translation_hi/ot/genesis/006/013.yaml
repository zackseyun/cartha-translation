source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים לְ/נֹ֗חַ קֵ֤ץ כָּל בָּשָׂר֙ בָּ֣א לְ/פָנַ֔/י כִּֽי מָלְאָ֥ה הָ/אָ֛רֶץ חָמָ֖ס מִ/פְּנֵי/הֶ֑ם וְ/הִנְ/נִ֥י מַשְׁחִיתָ֖/ם אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/013.yaml
  text: Then God said to Noah[a], “The end of all flesh has come before me, for the earth is filled with violence because of them. And behold[d][c][b], I am about to destroy them with the earth.”
translation:
  language: hi
  text: तब परमेश्वर ने नूह से कहा, “सब प्राणियों का अंत मेरे सामने आ पहुँचा है, क्योंकि उनके कारण पृथ्वी हिंसा से भर गई है। देखो, मैं उन्हें पृथ्वी समेत[a] नष्ट करने जा रहा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का वाक्य-विन्यास कठिन है; शाब्दिक रूप से, ‘मैं उन्हें ... पृथ्वी को नष्ट कर रहा हूँ।’ इसका अर्थ ‘उन्हें पृथ्वी के साथ/समेत’ या ‘उन्हें और पृथ्वी को’ समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: קֵץ כָּל־בָּשָׂר
  choice: सब प्राणियों का अन्त
  rationale: קֵץ का अर्थ अन्त या समाप्ति है। כָּל־בָּשָׂר का शाब्दिक रूप ‘सारा शरीर’ होता, पर जलप्रलय के प्रसंग में यह मनुष्यों से व्यापक जीवधारी वर्ग को सूचित करता है; ‘सब प्राणी’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उस व्यापकता को बनाए रखता है।
- source_word: בָּא לְפָנַי
  choice: मेरे सामने आ पहुँचा है
  rationale: यह न्यायिक भाव वाली इब्रानी छवि को सुरक्षित रखता है कि उनका अन्त परमेश्वर के सामने निर्णय के लिए आ पहुँचा है।
- source_word: מָלְאָה הָאָרֶץ חָמָס
  choice: पृथ्वी हिंसा से भर गई है
  rationale: חָמָס यहाँ हिंसा, अत्याचार और घोर अन्याय का बोध कराता है; ‘हिंसा’ सीधा और प्रसंगानुकूल है। הָאָרֶץ को जलप्रलय के व्यापक कथानक के कारण ‘पृथ्वी’ किया गया है।
- source_word: מִפְּנֵיהֶם
  choice: उनके कारण
  rationale: इस प्रसंग में מִפְּנֵי कारणवाचक है और हिंसा के लिए उन प्राणियों, विशेषतः भ्रष्ट मानव समाज, को उत्तरदायी ठहराता है।
- source_word: וְהִנְנִי
  choice: देख, मैं
  rationale: ‘देख’ वक्ता की गंभीर, ध्यान आकर्षित करने वाली आत्म-प्रस्तुति को सहज हिन्दी में व्यक्त करता है।
- source_word: מַשְׁחִיתָם
  choice: उन्हें ... नष्ट करने पर हूँ
  rationale: שׁחת का हिफ़ील रूप यहाँ न्याय के द्वारा विनाश बताता है। कृदन्त के साथ הִנְנִי आसन्न कार्य का भाव देता है, जिसे ‘नष्ट करने पर हूँ’ व्यक्त करता है।
- source_word: אֶת־הָאָרֶץ
  choice: पृथ्वी समेत
  rationale: 'इब्रानी वाक्य-विन्यास कठिन है: इसे पृथ्वी को दूसरा कर्म मानकर ‘और पृथ्वी को’ अथवा सहगामी अर्थ में ‘पृथ्वी समेत’ समझा जा सकता है। ‘पृथ्वी समेत’ साधनवाचक भ्रम से बचते हुए दोनों के न्यायाधीन होने का अर्थ देता है।'
theological_decisions:
- issue: ‘सब प्राणियों’ का दायरा
  choice: मनुष्यों तक सीमित न करके जीवधारियों की व्यापक श्रेणी
  alternative: केवल समस्त मानवजाति
  rationale: जलप्रलय-वृत्तान्त में כָּל־בָּשָׂר प्रायः मनुष्यों से अधिक व्यापक है। अनुवाद इसे समय से पहले केवल मानवजाति तक सीमित नहीं करता।
- issue: הָאָרֶץ का अर्थ
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: कथा के व्यापक जलप्रलय-सन्दर्भ में ‘पृथ्वी’ उपयुक्त है, यद्यपि इब्रानी शब्द कुछ प्रसंगों में ‘भूमि’ या ‘देश’ भी हो सकता है।
- issue: אֶת־הָאָרֶץ का वाक्यगत सम्बन्ध
  choice: पृथ्वी समेत
  alternative: और पृथ्वी को / पृथ्वी के साथ
  rationale: मूल भाषा का निर्माण असामान्य और वास्तविक रूप से अस्पष्ट है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है, बिना यह संकेत दिए कि पृथ्वी विनाश का साधन है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सब प्राणी’ शाब्दिक ‘सारा शरीर’ की अपेक्षा स्वाभाविक हिन्दी है और प्रसंग की व्यापकता बनाए रखता है। कोई पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि मुख्य पाठ स्रोतगत अर्थ और प्रमुख वाक्यगत तनाव को पर्याप्त रूप से व्यक्त करता है।
