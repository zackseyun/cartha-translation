id: GEN.6.17
reference: Genesis 6:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנְ/נִי֩ מֵבִ֨יא אֶת הַ/מַּבּ֥וּל מַ֨יִם֙ עַל הָ/אָ֔רֶץ לְ/שַׁחֵ֣ת כָּל בָּשָׂ֗ר אֲשֶׁר בּ/וֹ֙ ר֣וּחַ חַיִּ֔ים מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם כֹּ֥ל אֲשֶׁר בָּ/אָ֖רֶץ יִגְוָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/017.yaml
  text: And I—behold[a], I am bringing the flood of waters upon the earth to destroy all flesh in which is the breath of life from under heaven. Everything that is on the earth will perish.
translation:
  language: hi
  text: और देखो, मैं स्वयं पृथ्वी पर जलप्रलय ला रहा हूँ, ताकि आकाश के नीचे के सभी देहधारी प्राणियों को नष्ट कर दूँ, जिनमें जीवन की साँस[a] है। पृथ्वी पर जो कुछ है, वह मर जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जीवन की आत्मा।” हिब्रू शब्द רוּחַ का अर्थ “साँस,” “हवा” या “आत्मा” हो सकता है।
    reason: मूल हिब्रू शब्द की वास्तविक अर्थ-व्याप्ति और वैकल्पिक धार्मिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וַאֲנִי הִנְנִי
  choice: और देख, मैं स्वयं
  rationale: स्वतंत्र सर्वनाम के जोर और הִנְנִי की गंभीर, आसन्न घोषणा—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מֵבִיא
  choice: ला रहा हूँ
  rationale: हिब्रू कृदंत आसन्न अथवा आरम्भ होने वाली क्रिया को प्रस्तुत करता है; यह रूप उसे बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: הַמַּבּוּל מַיִם
  choice: जलप्रलय
  rationale: यह शब्द विनाशकारी जल-बाढ़ को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है; हिन्दी में ‘जल’ पानी के साधन को भी बनाए रखता है।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: कथा के व्यापक संदर्भ में הָאָרֶץ के लिए ‘पृथ्वी’ उपयुक्त है और केवल किसी स्थानीय भूभाग तक अर्थ को सीमित नहीं करता।
- source_word: לְשַׁחֵת
  choice: नष्ट कर दूँ
  rationale: लְ उपसर्ग वाला infinitive उद्देश्य बताता है; हिन्दी का यह रूप उस उद्देश्य और पूर्ण विनाश दोनों को स्पष्ट करता है।
- source_word: כָּל בָּשָׂר
  choice: हर ... देहधारी प्राणी
  rationale: ‘देहधारी’ בָּשָׂר अर्थात ‘मांस/देह’ की छवि को बचाता है, जबकि ‘प्राणी’ आधुनिक हिन्दी में इसके सामूहिक जीवधारी संदर्भ को स्पष्ट करता है।
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: जिसमें जीवन की साँस है
  rationale: रूआख का यहाँ प्राथमिक अर्थ जीवित रखने वाली साँस है; ‘जिसमें’ सामूहिक ‘हर ... प्राणी’ के साथ स्वाभाविक है।
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: आकाश के नीचे के
  rationale: यह वाक्यांश उस समूचे जीव-जगत के क्षेत्र को बताता है और हिब्रू के व्यापक दायरे को बनाए रखता है।
- source_word: כֹּל אֲשֶׁר בָּאָרֶץ
  choice: पृथ्वी पर जो कुछ है
  rationale: हिब्रू के समग्र और सर्वसमावेशी कथन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִגְוָע
  choice: मर जाएगा
  rationale: क्रिया का अर्थ प्राण छोड़ना या मरना है; ‘मर जाएगा’ स्पष्ट है और विनाश को केवल क्षति समझे जाने से रोकता है।
theological_decisions:
- issue: רוּחַ חַיִּים में רוּחַ का अर्थ
  choice: जीवन की साँस
  alternative: जीवन की आत्मा
  rationale: जलप्रलय के प्रसंग में यह जीवधारियों को जीवित रखने वाली प्राणवायु को सबसे स्वाभाविक रूप से दर्शाता है। फिर भी רוּחַ में ‘आत्मा’ का वास्तविक अर्थ-संभावना होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जलप्रलय’ और ‘देहधारी प्राणी’ बाइबलीय गरिमा तथा मूल की ठोस शब्दावली को बनाए रखते हैं, जबकि वाक्य-विन्यास स्वाभाविक हिन्दी का अनुसरण करता है।
