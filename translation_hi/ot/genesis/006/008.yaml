reference: Genesis 6:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נֹ֕חַ מָ֥צָא חֵ֖ן בְּ/עֵינֵ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/008.yaml
  text: But Noah found favor in the eyes of Yahweh[a].
translation:
  language: hi
  text: परन्तु नूह ने याहवे की दृष्टि में कृपा पाई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और नूह ने याहवे की दृष्टि में अनुग्रह पाया।”
    reason: संयोजक וְ को अधिक शाब्दिक रूप से ‘और’ और חֵן को ‘अनुग्रह’ भी कहा जा सकता है।
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: परन्तु नूह
  rationale: वाव सामान्यतः ‘और’ है, पर यहाँ पिछली आयतों में वर्णित व्यापक बुराई और दण्ड के विपरीत नूह की स्थिति सामने आती है; इसलिए ‘परन्तु’ प्रसंगगत विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מָצָא
  choice: पाई
  rationale: मָצָא का मूल अर्थ ‘पाना/खोजना’ है। ‘कृपा पाई’ हिन्दी में स्वाभाविक है और इब्रानी मुहावरे की संरचना को निकटता से बनाए रखता है।
- source_word: חֵן
  choice: कृपा
  rationale: חֵן का अर्थ कृपा, अनुग्रह या पक्षपातपूर्ण सद्भाव नहीं बल्कि प्रसन्न स्वीकृति हो सकता है। ‘कृपा’ यहाँ परमेश्वर के अनुकूल भाव को सहज हिन्दी में व्यक्त करती है, बिना किसी बाद की व्यवस्थित धर्मशास्त्रीय परिभाषा को अनिवार्य किए।
- source_word: בְּ/עֵינֵי
  choice: की दृष्टि में
  rationale: शाब्दिक रूप ‘की आँखों में’ है, पर यह निर्णय या सम्मति बताने वाला इब्रानी मुहावरा है। ‘की दृष्टि में’ उसी रूपक को गरिमापूर्ण और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह चार अक्षरों वाला परमेश्वर का व्यक्तिगत नाम है। आधुनिक हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ नाम को किसी उपाधि से बदलने के बजाय स्पष्ट रूप से प्रस्तुत करता है।
theological_decisions:
- issue: नूह के प्रति परमेश्वर के भाव के लिए חֵן का अनुवाद
  choice: कृपा
  alternative: अनुग्रह
  rationale: ‘कृपा’ इब्रानी पद के अनुकूल भाव और स्वीकार्यता के अर्थ को खुला रखती है तथा इस छोटी उक्ति पर बाद की किसी विशिष्ट धर्मशास्त्रीय परिभाषा को आरोपित नहीं करती।
- issue: संयोजक וְ का प्रसंगगत सम्बन्ध
  choice: परन्तु
  alternative: और
  rationale: मूल संयोजक अपने आप में ‘और’ हो सकता है, पर कथानक में नूह को मानवजाति की व्यापक भ्रष्टता और आने वाले न्याय के विपरीत रखा गया है। ‘परन्तु’ इस वास्तविक प्रसंगगत तनाव को व्यक्त करता है; वैकल्पिक अधिक औपचारिक पाठ पादटिप्पणी में दिया गया है।
- issue: परमेश्वर के नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। ‘यहोवा’ सामान्य हिन्दी पाठकों के लिए परिचित प्रतिलेखन है; ‘याहवे’ अधिक पुनर्निर्मित उच्चारण को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘दृष्टि में कृपा पाई’ मूल इब्रानी मुहावरे के निकट रहते हुए साधारण हिन्दी पाठक के लिए स्पष्ट है।
