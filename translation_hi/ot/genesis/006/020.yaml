translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। परमेश्वर द्वारा नूह को एकवचन सम्बोधन के अनुरूप ‘तेरे/तू’ का प्रयोग किया गया है। पशु-श्रेणियों के दोहराव और मूल वाक्य की सूची-संरचना को यथासम्भव सुरक्षित रखा गया है।
