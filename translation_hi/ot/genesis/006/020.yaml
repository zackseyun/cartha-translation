source:
  edition: WLC
  text: מֵ/הָ/ע֣וֹף לְ/מִינֵ֗/הוּ וּ/מִן הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ מִ/כֹּ֛ל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ שְׁנַ֧יִם מִ/כֹּ֛ל יָבֹ֥אוּ אֵלֶ֖י/ךָ לְ/הַֽחֲיֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/020.yaml
  text: From the birds according to their kinds[a], and from the livestock according to their kinds, from every creeping thing of the ground according to its kind, two of each will come to you to keep them alive.
translation:
  language: hi
  text: पक्षियों में से, उनकी-अपनी जातियों के अनुसार[a]; पालतू पशुओं में से, उनकी जाति के अनुसार; और भूमि पर रेंगने वाले हर जीव में से, उसकी जाति के अनुसार—हर प्रकार के दो-दो तेरे पास आएँगे, उन्हें जीवित रखने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपनी-अपनी जाति के अनुसार।’
    reason: हिब्रू לְמִין के वितरणात्मक वर्गीकरणात्मक भाव का स्वाभाविक वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: הָעוֹף
  choice: पक्षियों
  rationale: यहाँ עוֹף उड़ने वाले जीवों की श्रेणी को दर्शाता है; प्रसंग में आधुनिक हिन्दी का स्वाभाविक और स्पष्ट शब्द ‘पक्षी’ है।
- source_word: לְמִינֵהוּ / לְמִינָהּ
  choice: उनकी/उसकी जाति के अनुसार
  rationale: מִין जीवों की प्रकारगत श्रेणी बताता है। ‘जाति के अनुसार’ वर्गीकरण का भाव बनाए रखता है, पर आधुनिक जैविक वर्गीकरण को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: הַבְּהֵמָה
  choice: पालतू पशुओं
  rationale: בְּהֵמָה यहाँ पक्षियों और रेंगने वाले जीवों से अलग स्थलीय, विशेषकर घरेलू पशुओं की श्रेणी है; ‘पालतू पशु’ सामान्य हिन्दी में स्पष्ट है।
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: भूमि पर रेंगने वाले हर जीव
  rationale: רֶמֶשׂ छोटे चलने या रेंगने वाले जीवों को और הָאֲדָמָה भूमि को सूचित करता है। ‘भूमि पर’ हिन्दी में संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׁנַיִם מִכֹּל
  choice: हर एक में से दो
  rationale: यह पदबंध पहले बताई गई प्रत्येक श्रेणी में से दो जीवों का वितरणात्मक अर्थ देता है; हिन्दी में ‘हर एक में से दो’ स्पष्ट और निकट है।
- source_word: יָבֹאוּ אֵלֶיךָ
  choice: तेरे पास आएँगे
  rationale: בוא के साथ אֶל नूह की ओर आने की गति व्यक्त करता है। सन्दूक में प्रवेश प्रसंग से निहित है, पर इस उपवाक्य में सीधे नहीं कहा गया।
- source_word: לְהַחֲיוֹת
  choice: ताकि तू उन्हें जीवित रखे
  rationale: חיה का हिफ़ील रूप जीवन बचाए रखने का प्रयोजन व्यक्त करता है; उद्देश्यवाचक ‘ताकि’ हिन्दी में इस बल को स्पष्ट करता है।
