id: GEN.6.5
reference: Genesis 6:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֣רְא יְהוָ֔ה כִּ֥י רַבָּ֛ה רָעַ֥ת הָ/אָדָ֖ם בָּ/אָ֑רֶץ וְ/כָל יֵ֨צֶר֙ מַחְשְׁבֹ֣ת לִבּ֔/וֹ רַ֥ק רַ֖ע כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/005.yaml
  text: And Yahweh saw that the wickedness of man was great on the earth[b][a], and that every inclination of the thoughts of his heart was only evil all the day.
translation:
  language: hi
  text: और यहोवा ने देखा कि पृथ्वी पर मनुष्य[a] की बुराई बहुत अधिक थी, और उसके मन के विचारों की हर प्रवृत्ति केवल बुरी ही थी—दिन भर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मनुष्य’ से सामूहिक रूप से पूरी मानवजाति अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘निरंतर।’ इब्रानी का शाब्दिक अर्थ है ‘दिन भर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: और ... ने देखा
  rationale: वय्यिक्तोल कथात्मक क्रम को आगे बढ़ाता है; ‘और ... ने देखा’ इब्रानी कथन-प्रवाह को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय ईश्वरीय नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: רַבָּה רָעַת הָאָדָם
  choice: मनुष्य की बुराई बहुत अधिक थी
  rationale: רַבָּה यहाँ नैतिक बुराई की विशाल मात्रा या तीव्रता बताता है। ‘बहुत अधिक थी’ आधुनिक हिन्दी में स्वाभाविक है और मूल के अर्थ को सुरक्षित रखता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ אָדָם किसी एक पुरुष को नहीं, सामूहिक रूप से मानवजाति को सूचित करता है। मुख्य पाठ में पारंपरिक सामूहिक ‘मनुष्य’ रखा गया है और अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בָּאָרֶץ
  choice: पृथ्वी पर
  rationale: उत्पत्ति के आदिकालीन विश्वव्यापी संदर्भ में אֶרֶץ किसी विशेष भूभाग के बजाय पृथ्वी को सूचित करता है।
- source_word: יֵצֶר
  choice: प्रवृत्ति
  rationale: יֵצֶר मन के विचारों को आकार देने वाले झुकाव, अभिप्राय या रुझान को व्यक्त करता है; ‘प्रवृत्ति’ इस व्यापक भीतरी झुकाव को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: מַחְשְׁבֹת לִבּוֹ
  choice: उसके मन के विचारों
  rationale: इब्रानी לֵב विचार, इच्छा और अभिलाषा सहित भीतरी व्यक्ति को दर्शाता है। हिन्दी में ‘मन’ इस संदर्भ में ‘हृदय’ की अपेक्षा अधिक स्वाभाविक रूप से विचार और भीतरी झुकाव दोनों व्यक्त करता है।
- source_word: רַק רַע
  choice: केवल बुरी ही
  rationale: रַק का पूर्ण सीमाबोध ‘केवल ... ही’ से स्पष्ट होता है, और רַע यहाँ नैतिक बुराई का द्योतक है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह मूल पदबंध का सीधा और स्वाभाविक हिन्दी रूप है; प्रसंग में इसका भाव निरंतरता का भी हो सकता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय नामरूप में रखा गया है।
- issue: सामूहिक אָדָם का अनुवाद
  choice: मनुष्य
  alternative: मानवजाति
  rationale: ‘मनुष्य’ मूल के सामूहिक एकवचन को बनाए रखता है; पादटिप्पणी स्पष्ट करती है कि यहाँ पूरी मानवजाति अभिप्रेत है, न कि केवल पुरुष।
- issue: כָּל הַיּוֹם की कालगत शक्ति
  choice: दिन भर
  alternative: निरंतर
  rationale: मुख्य पाठ मूल की शाब्दिक कालगत अभिव्यक्ति को सुरक्षित रखता है, जबकि पादटिप्पणी उसके सम्भावित निरंतरताबोध को बताती है; इस प्रकार वास्तविक अर्थ-व्याप्ति को एक ही व्याख्या में सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और पाठयोग्य रखी गई है। वाक्य में मूल इब्रानी की व्यापकता और तीव्रता बनाए रखते हुए अस्वाभाविक शब्दशः संरचना से बचा गया है।
