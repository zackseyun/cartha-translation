  text: 'और नूह के तीन पुत्र हुए: शेम, हाम और यापेत।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: के ... पुत्र हुए
  rationale: हिफ़ील रूप पिता के रूप में संतान उत्पन्न करने का भाव देता है। आधुनिक हिन्दी में ‘नूह के तीन पुत्र हुए’ स्वाभाविक है और पितृत्व का संबंध बनाए रखता है; ‘जन्म दिया’ हिन्दी में सामान्यतः माता के लिए प्रयुक्त होता है, जबकि ‘उत्पन्न किया’ यहाँ अनावश्यक रूप से औपचारिक है।
- source_word: שְׁלֹשָׁה בָנִים
  choice: तीन पुत्र
  rationale: בָנִים का अर्थ यहाँ स्पष्टतः पुरुष संतान, अर्थात ‘पुत्र’, है; आगे तीन पुरुष नाम भी दिए गए हैं।
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: शेम, हाम और येपेत
  rationale: אֶת प्रत्यक्ष कर्म-चिह्न है, जिसे हिन्दी में अलग से व्यक्त करना आवश्यक नहीं। नामों को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: נֹחַ
  choice: नूह
  rationale: हिब्रू व्यक्तिगत नाम נֹחַ का हिन्दी में प्रचलित और पहचाना जाने वाला रूप ‘नूह’ है।
