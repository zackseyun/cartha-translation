translation:
  language: hi
  text: और नूह ने वैसा ही किया; परमेश्वर ने उसे जो कुछ आज्ञा दी थी, उसने उसके अनुसार ही किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ने ... किया
  rationale: עשה का अर्थ यहाँ पिछले निर्देशों के प्रत्युत्तर में कार्य करना है। आरंभिक क्रिया को रखा गया है और सहज हिन्दी के लिए ‘वैसा ही’ जोड़ा गया है, जिसका आधार आगे आने वाला כֵּן और अनुरूपता का वाक्यांश है।
- source_word: נֹחַ
  choice: नूह
  rationale: हिन्दी बाइबल परंपरा में इस इब्रानी नाम का मानक रूप।
- source_word: כְּכֹל אֲשֶׁר
  choice: जो कुछ ... उसके ठीक अनुसार
  rationale: यह रचना आज्ञा की संपूर्णता और उसके अनुरूप किए गए कार्य—दोनों को व्यक्त करती है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: צוה अधिकारपूर्वक आदेश देने को दर्शाता है; परमेश्वर के निर्देश के संदर्भ में ‘आज्ञा दी’ स्वाभाविक और सटीक है। पूर्णभूत ‘दी थी’ आज्ञा के पहले दिए जाने को स्पष्ट करता है।
- source_word: אֹתוֹ
  choice: उसे
  rationale: पुल्लिंग एकवचन कर्म-सर्वनाम नूह को संदर्भित करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ संज्ञा एकवचन क्रिया के साथ इस्राएल के एक परमेश्वर के लिए प्रयुक्त है; आधुनिक हिन्दी बाइबल शैली में ‘परमेश्वर’ उपयुक्त है।
- source_word: כֵּן
  choice: ठीक ... किया
  rationale: כֵּן पूर्ववर्ती अनुरूपता को फिर पुष्ट करता है। ‘ठीक अनुसार’ नूह के कार्य और आज्ञा के मेल पर बल देता है।
- source_word: עָשָׂה
  choice: उसने किया
  rationale: अंतिम עשה को दोहराकर इब्रानी पाठ में आज्ञापालन पर दिए गए बल को हिन्दी में भी बनाए रखा गया है।
theological_decisions:
- issue: आज्ञापालन-सूत्र में עשה की पुनरावृत्ति
  choice: 'दोनों क्रियाएँ रखी गईं: ‘नूह ने ... किया ... उसने किया।’'
  alternative: ‘नूह ने वह सब किया जिसकी परमेश्वर ने उसे आज्ञा दी थी।’
  rationale: संक्षिप्त विकल्प अर्थ बताता है, पर इब्रानी की जानबूझकर की गई पुनरावृत्ति मिटा देता है। वर्तमान रूप बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े नूह के पूर्ण अनुरूप कार्य पर मूल पाठ का बल बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। अर्धविराम मूल के दोहराए हुए कथन को अलग रखते हुए उनके घनिष्ठ संबंध को दिखाता है।
