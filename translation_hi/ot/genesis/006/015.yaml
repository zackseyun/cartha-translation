  text: וְ/זֶ֕ה אֲשֶׁ֥ר תַּֽעֲשֶׂ֖ה אֹתָ֑/הּ שְׁלֹ֧שׁ מֵא֣וֹת אַמָּ֗ה אֹ֚רֶךְ הַ/תֵּבָ֔ה חֲמִשִּׁ֤ים אַמָּה֙ רָחְבָּ֔/הּ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/015.yaml
  text: 'And this is how you shall make it: the length of the ark shall be three hundred cubits[a], its width fifty cubits, and its height thirty cubits.'
translation:
  language: hi
  text: 'और उसे इस प्रकार बनाना: जहाज़ की लंबाई तीन सौ हाथ[a], उसकी चौड़ाई पचास हाथ और उसकी ऊँचाई तीस हाथ हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हाथ’ लंबाई की एक प्राचीन इकाई थी—लगभग कोहनी से उँगलियों के सिरों तक की दूरी।
    reason: cultural_note
lexical_decisions:
- source_word: וְזֶה אֲשֶׁר תַּעֲשֶׂה אֹתָהּ
  choice: और उसे इस प्रकार बनाना
  rationale: इब्रानी वाक्यांश निर्माण-विधि का निर्देश प्रस्तुत करता है। आधुनिक हिंदी में यह रूप निर्देशात्मक बल को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: הַתֵּבָה
  choice: जहाज़
  rationale: תֵּבָה यहाँ नूह द्वारा बनाए जाने वाले जलयान को सूचित करता है। सामान्य आधुनिक हिंदी पाठक के लिए ‘जहाज़’ स्पष्ट और स्वाभाविक है; ‘सन्दूक’ आकार पर अनावश्यक बल दे सकता है।
- source_word: שְׁלֹשׁ מֵאוֹת אַמָּה
  choice: तीन सौ हाथ
  rationale: אַמָּה प्राचीन लंबाई की इकाई है, जो लगभग कोहनी से उँगलियों के सिरे तक की दूरी थी। हिंदी बाइबल-परंपरा में ‘हाथ’ इसका सुबोध समतुल्य है; आधुनिक इकाइयों में बदलने के बजाय मूल माप सुरक्षित रखा गया है।
- source_word: אֹרֶךְ
  choice: लंबाई
  rationale: निर्माण के आयाम के संदर्भ में यह सीधा और आधुनिक हिंदी समतुल्य है।
- source_word: רָחְבָּהּ
  choice: उसकी चौड़ाई
  rationale: प्रत्यय से व्यक्त स्त्रीलिंग एकवचन संबंध को ‘उसकी’ द्वारा सुरक्षित रखा गया है और רֹחַב का स्वाभाविक वास्तु-संदर्भीय अर्थ ‘चौड़ाई’ लिया गया है।
- source_word: קוֹמָתָהּ
  choice: उसकी ऊँचाई
  rationale: קוֹמָה व्यक्ति के लिए कद और संरचना के लिए ऊँचाई बता सकता है; यहाँ वास्तु-संदर्भ में ‘ऊँचाई’ उपयुक्त है।
