  yaml_path: translation/ot/genesis/006/018.yaml
  text: But I will establish my covenant with you[a], and you shall enter the ark—you, your sons, your wife, and your sons’ wives with you.
translation:
  language: hi
  text: परन्तु मैं तेरे साथ अपनी वाचा स्थापित करूँगा[a]; और तू जहाज़ में प्रवेश करेगा—तू, तेरे बेटे, तेरी पत्नी और तेरे साथ तेरे बेटों की पत्नियाँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तेरे साथ अपनी वाचा को पुष्ट करूँगा।” वाचा के संदर्भ में इब्रानी क्रिया दोनों अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: परन्तु मैं ... स्थापित करूँगा
  rationale: हिफ़ील रूप में קום वाचा के संदर्भ में ‘स्थापित करना’ या ‘दृढ़ करना’ व्यक्त कर सकता है। यहाँ भावी प्रतिज्ञा और पिछले विनाश-वचन के साथ विरोध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בְּרִיתִי
  choice: अपनी वाचा
  rationale: בְּרִית के लिए ‘वाचा’ मानक, संक्षिप्त और धर्मग्रंथीय महत्त्व को सुरक्षित रखने वाला हिन्दी पर्याय है।
- source_word: אִתָּךְ
  choice: तेरे साथ
  rationale: यह वाचा-संबंध तथा पद के अंत में साथ होने का सामान्य अर्थ देता है; अतिरिक्त बल जोड़ना आवश्यक नहीं।
- source_word: וּבָאתָ אֶל הַתֵּבָה
  choice: और तू जहाज़ में प्रवेश करना
  rationale: בוא गमन अथवा प्रवेश को दर्शाता है। תֵּבָה नूह के जलयान के लिए प्रयुक्त है; आधुनिक सामान्य हिन्दी में ‘जहाज़’ तत्काल बोधगम्य है। आज्ञार्थक ‘प्रवेश करना’ भावी निर्देश की दृढ़ता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַתָּה
  choice: तू
  rationale: स्वतंत्र सर्वनाम का बल सूची में पुनरुक्त ‘तू’ द्वारा सुरक्षित रखा गया है।
- source_word: וּבָנֶיךָ
  choice: तेरे बेटे
  rationale: मूल शब्द विशेष रूप से पुत्रों को सूचित करता है, इसलिए लिंग-निरपेक्ष ‘बच्चे’ नहीं लिया गया।
- source_word: וְאִשְׁתְּךָ
  choice: तेरी पत्नी
  rationale: पारिवारिक संदर्भ में אִשָּׁה का सीधा और स्वाभाविक अनुवाद।
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: तेरे बेटों की पत्नियाँ
  rationale: यह इब्रानी संबंधसूचक पदबंध का निकट और सहज अनुवाद है; ‘बहुएँ’ की अपेक्षा मूल संरचना को अधिक स्पष्टता से रखता है।
theological_decisions:
- issue: वाचा-संबंधी क्रिया का आशय
  choice: मैं तेरे साथ अपनी वाचा स्थापित करूँगा
  alternative: मैं तेरे साथ अपनी वाचा को दृढ़ करूँगा
  rationale: इब्रानी क्रिया नई वाचा स्थापित करने या किसी वाचा को दृढ़ करने—दोनों अर्थों की अनुमति दे सकती है। मुख्य पाठ मानक वाचा-भाषा रखता है और वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित करता है, ताकि पद से अधिक कोई धर्मवैज्ञानिक निष्कर्ष न थोपा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण बाइबलीय शैली रखी गई है। परमेश्वर द्वारा नूह को सीधे संबोधित किए जाने के कारण एकवचन ‘तू/तेरे’ का सुसंगत प्रयोग है। वाक्य-सूची मूल के बल और पारिवारिक क्रम को बनाए रखती है।
