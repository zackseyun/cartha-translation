  text: וַ/יִּרְא֤וּ בְנֵי הָֽ/אֱלֹהִים֙ אֶת בְּנ֣וֹת הָֽ/אָדָ֔ם כִּ֥י טֹבֹ֖ת הֵ֑נָּה וַ/יִּקְח֤וּ לָ/הֶם֙ נָשִׁ֔ים מִ/כֹּ֖ל אֲשֶׁ֥ר בָּחָֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/002.yaml
  text: the sons of God saw that the daughters of man were beautiful[b][a], and they took wives for themselves from any they chose.
translation:
  language: hi
  text: परमेश्वर के पुत्रों[a] ने देखा कि मनुष्य की बेटियाँ सुन्दर[b] थीं, और उन्होंने जिन-जिन को चाहा, उनमें से अपने लिए पत्नियाँ ले लीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ईश्वरीय प्राणी।” “परमेश्वर के पुत्रों” की पहचान विवादित है; प्रमुख व्याख्याओं में स्वर्गीय प्राणी, मानवीय शासक, और शेत का वंश शामिल हैं।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “अच्छी”; यहाँ अर्थ रूप-सौन्दर्य का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הָאֱלֹהִים
  choice: परमेश्वर के पुत्र
  rationale: यह इब्रानी पदबंध का निकट और पारदर्शी अनुवाद है तथा उनकी विवादित पहचान को मुख्य पाठ में निर्धारित नहीं करता।
- source_word: בְּנוֹת הָאָדָם
  choice: मनुष्य की बेटियाँ
  rationale: यह सामूहिक एकवचन אָדָם को बनाए रखते हुए ‘परमेश्वर के पुत्रों’ के साथ मूल साहित्यिक विरोध को सुरक्षित रखता है।
- source_word: כִּי טֹבֹת הֵנָּה
  choice: सुन्दर हैं
  rationale: इस प्रसंग में טוֹב स्त्रियों के आकर्षक रूप को व्यक्त करता है; ‘सुन्दर’ सहज हिन्दी है और नैतिक ‘अच्छी’ का भ्रामक अर्थ नहीं देता।
- source_word: וַיִּקְחוּ לָהֶם נָשִׁים
  choice: उन्होंने ... अपनी पत्नी बना लिया
  rationale: לקח के साथ נָשִׁים यहाँ विवाह के लिए स्त्रियों को ग्रहण करने का भाव देता है; यह हिन्दी में स्वाभाविक ढंग से पत्नी बनाने के रूप में व्यक्त हुआ है।
- source_word: מִכֹּל אֲשֶׁר בָּחָרוּ
  choice: उनमें से जिसे भी चाहा
  rationale: यह चयन की व्यापक और अनिर्बंध प्रकृति को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘परमेश्वर के पुत्रों’ की पहचान
  choice: मुख्य पाठ में शाब्दिक पदबंध ‘परमेश्वर के पुत्र’ बनाए रखना
  alternative: स्वर्गीय प्राणी, मानवीय शासक, अथवा शेत का वंश
  rationale: इब्रानी पाठ स्वयं उनकी पहचान स्पष्ट नहीं करता। इसलिए किसी एक व्याख्या को अनुवाद में आरोपित करने के बजाय अस्पष्टता को बनाए रखा गया है और प्रमुख मत पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। विवादित पदबंध को औपचारिक निकटता के साथ रखा गया है, जबकि वाक्य के उत्तरार्ध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
