source:
  edition: WLC
  text: וַ/יִּנָּ֣חֶם יְהוָ֔ה כִּֽי עָשָׂ֥ה אֶת הָֽ/אָדָ֖ם בָּ/אָ֑רֶץ וַ/יִּתְעַצֵּ֖ב אֶל לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/006.yaml
  text: And Yahweh regretted having made man on the earth[c][b][a], and he was pained in his heart.
translation:
  language: hi
  text: और यहोवा को इस बात का पछतावा हुआ[a] कि उसने पृथ्वी पर मनुष्य[b] को बनाया था, और उसके हृदय में पीड़ा हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे इस बात का खेद हुआ कि उसने…।” इब्रानी क्रिया पहले किए गए कार्य के विषय में पछतावा या गहरा खेद व्यक्त करती है। अपने आप में यह नहीं कहती कि यहोवा को नई जानकारी मिली, वह पहले से नहीं जानता था, या उसने कोई नैतिक भूल की थी।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मनुष्य” से सामूहिक रूप से पूरी मनुष्यजाति का बोध होता है।
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: पछतावा हुआ
  rationale: निफ़अल रूप यहाँ पहले किए गए कार्य के विषय में पीछे मुड़कर होने वाले खेद या संताप को व्यक्त करता है। ‘पछतावा हुआ’ इस मूल्यांकनात्मक बल को बनाए रखता है; इसके बाद आने वाली अलग क्रिया וַיִּתְעַצֵּב भावनात्मक पीड़ा को व्यक्त करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के विशिष्ट नाम YHWH का परिचित और स्पष्ट लिप्यंतरण।
- source_word: כִּי
  choice: कि
  rationale: यह पछतावे की विषय-वस्तु बताने वाला उपवाक्य आरम्भ करता है।
- source_word: עָשָׂה
  choice: बनाया था
  rationale: यह मनुष्यजाति की सृष्टि के पहले हो चुके कार्य को बताता है; हिन्दी का पूर्ण भूतकाल इस पूर्वता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ אָדָם किसी एक पुरुष या केवल आदम नामक व्यक्ति के बजाय सामूहिक रूप से मनुष्यजाति को सूचित करता है। ‘मनुष्य’ हिन्दी में इस प्रतिनिधिक और सामूहिक अर्थ को बनाए रखता है।
- source_word: בָּאָרֶץ
  choice: पृथ्वी पर
  rationale: सन्दर्भ में אֶרֶץ पूरी पृथ्वी या संसार को सूचित करता है, किसी विशेष देश को नहीं।
- source_word: וַיִּתְעַצֵּב
  choice: पीड़ा हुई
  rationale: हित्पअेल रूप भीतर तक पहुँचने वाले दुख या चोट का भाव रखता है। ‘पीड़ा हुई’ इसे पहले प्रयुक्त ‘पछतावा’ से अलग रखते हुए इब्रानी की दो-क्रियात्मक संरचना बचाता है।
- source_word: אֶל־לִבּוֹ
  choice: उसके हृदय में
  rationale: शाब्दिक पूर्वसर्ग ‘की ओर/तक’ है, पर इस मुहावरे का आशय भीतर, हृदय में अनुभव की गई पीड़ा है; यह हिन्दी में स्वाभाविक अभिव्यक्ति है।
theological_decisions:
- issue: परमेश्वर के विषय में पछतावे और पीड़ा की मानव-सदृश भाषा
  choice: यहोवा को ‘पछतावा हुआ’ और उसके हृदय में ‘पीड़ा हुई’—पाठ के दोनों सीधे कथनों को बनाए रखा गया है।
  alternative: ‘यहोवा दुखी हुआ’ या ‘यहोवा ने अपना विचार बदल दिया’
  rationale: इब्रानी पाठ पूर्व कार्य के विषय में वास्तविक पश्चात्ताप-सदृश खेद और फिर आन्तरिक पीड़ा को दो अलग क्रियाओं से व्यक्त करता है। अनुवाद यह निर्णय नहीं जोड़ता कि यह भाषा परमेश्वर के पूर्वज्ञान से कैसे सम्बन्धित है, और न ही पाठ के तनाव को नरम करता है।
- issue: הָאָדָם का सामूहिक अर्थ
  choice: ‘मनुष्य’ को पूरी मनुष्यजाति के प्रतिनिधिक अर्थ में रखा गया है।
  alternative: ‘मानवजाति’ या ‘लोगों’
  rationale: सन्दर्भ पूरी मानव जाति से सम्बन्धित है। ‘मनुष्य’ मूल शब्द की प्रतिनिधिक शक्ति और उत्पत्ति-वृत्तान्त की शैली दोनों को बनाए रखता है; टिप्पणी उसका सामूहिक अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इस बात का पछतावा हुआ कि’ हिन्दी में स्वाभाविक है और मूल की विषय-वस्तु वाली रचना को स्पष्ट करता है। ‘हृदय में पीड़ा हुई’ दूसरे इब्रानी क्रियापद की आन्तरिक वेदना को अलग बनाए रखता है।
