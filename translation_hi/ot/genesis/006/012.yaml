  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/אָ֖רֶץ וְ/הִנֵּ֣ה נִשְׁחָ֑תָה כִּֽי הִשְׁחִ֧ית כָּל בָּשָׂ֛ר אֶת דַּרְכּ֖/וֹ עַל הָ/אָֽרֶץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/012.yaml
  text: And God saw the earth[a], and behold, it was corrupted[b], because all flesh had corrupted its way on the earth.
translation:
  language: hi
  text: परमेश्वर ने पृथ्वी को देखा, और देखो, वह बिगड़ चुकी थी[a], क्योंकि पृथ्वी पर हर देहधारी ने अपने मार्ग को बिगाड़ दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भ्रष्ट हो चुकी थी’ अथवा ‘बरबाद हो चुकी थी’; इब्रानी शब्द नैतिक भ्रष्टता और विनाश या बरबादी—दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: सामान्य आख्यानात्मक अर्थ ‘देखा’ है; इससे इब्रानी क्रिया में कोई अतिरिक्त मूल्यांकन नहीं जोड़ा जाता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में यह एकमात्र सच्चे परमेश्वर के लिए प्रयुक्त है; आधुनिक हिन्दी बाइबलीय गद्य में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: जलप्रलय के व्यापक प्रसंग में ‘पृथ्वी’ उपयुक्त है; ‘देश’ या ‘भूमि’ यहाँ अनावश्यक रूप से दायरा सीमित कर सकता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह दृश्य की ओर सजीव और गंभीर ढंग से ध्यान खींचने वाले इब्रानी संकेत को बनाए रखता है।
- source_word: נִשְׁחָתָה
  choice: बिगड़ चुकी थी
  rationale: ‘बिगड़’ नैतिक भ्रष्टता और बरबाद दशा—दोनों की ओर संकेत कर सकता है और पूर्ण हो चुकी परिणामी अवस्था को व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पृथ्वी की बिगड़ी हुई दशा का कारण प्रस्तुत करता है।
- source_word: הִשְׁחִית
  choice: बिगाड़ लिया था
  rationale: यह नִשְׁחָתָה के समान मूल שׁחת की पुनरावृत्ति को हिन्दी में भी बनाए रखता है और कर्ताओं द्वारा अपने मार्ग को बिगाड़ने का कारणात्मक भाव व्यक्त करता है।
- source_word: כָּל־בָּשָׂר
  choice: हर देहधारी
  rationale: यह ‘समस्त मांस’ की इब्रानी अभिव्यक्ति का स्वाभाविक हिन्दी रूप है और इसे केवल मानवजाति या सभी जीवों में से किसी एक तक सीमित नहीं करता।
- source_word: דַּרְכּוֹ
  choice: अपना मार्ग
  rationale: ‘मार्ग’ जीवन-व्यवहार के रूपक को सुरक्षित रखता है; ‘अपना’ सामूहिक एकवचन प्रत्यय को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל־הָאָרֶץ
  choice: पृथ्वी पर
  rationale: यह मूल स्थानवाचक वाक्यांश का सीधा और स्वाभाविक हिन्दी अनुवाद है।
theological_decisions:
- issue: दोनों उपवाक्यों में שׁחת का अर्थ
  choice: ‘बिगड़ चुकी थी’ और ‘बिगाड़ लिया था’ द्वारा एक ही हिन्दी मूल की पुनरावृत्ति
  alternative: ‘भ्रष्ट हो चुकी थी ... भ्रष्ट कर लिया था’ अथवा ‘नष्ट हो चुकी थी ... नष्ट कर दिया था’
  rationale: इब्रानी मूल नैतिक भ्रष्टता और उससे उत्पन्न बरबादी दोनों को समेट सकता है। ‘बिगड़ना/बिगाड़ना’ इस तनाव को बनाए रखता है और प्राणियों के बिगड़े मार्ग तथा पृथ्वी की बिगड़ी दशा के बीच शब्दगत संबंध स्पष्ट करता है।
- issue: כָּל־בָּשָׂר का दायरा
  choice: हर देहधारी
  alternative: सारी मानवजाति अथवा हर जीवित प्राणी
  rationale: मूल अभिव्यक्ति का दायरा प्रसंग में व्यापक है और उसे केवल मनुष्यों या सभी जीवों तक निश्चित रूप से सीमित करना व्याख्यात्मक होगा; ‘हर देहधारी’ उसकी वास्तविक व्यापकता और अस्पष्टता दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘और देखो’ मूल की सजीव आख्यानात्मक शैली को बनाए रखता है; ‘हर देहधारी’ कुछ बाइबलीय गरिमा रखते हुए भी बोधगम्य है।
