  text: וַ/יִּסֹּ֥ב מֵֽ/עֲלֵי/הֶ֖ם וַ/יֵּ֑בְךְּ וַ/יָּ֤שָׁב אֲלֵ/הֶם֙ וַ/יְדַבֵּ֣ר אֲלֵ/הֶ֔ם וַ/יִּקַּ֤ח מֵֽ/אִתָּ/ם֙ אֶת שִׁמְע֔וֹן וַ/יֶּאֱסֹ֥ר אֹת֖/וֹ לְ/עֵינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/024.yaml
  text: He turned away from them and wept[a]. Then he returned to them and spoke to them[b], and he took Simeon from among them and bound him before their eyes.
translation:
  language: hi
  text: वह उनसे हट गया और रोया। फिर वह उनके पास लौट आया और उनसे बात की। उसने उनमें से शिमोन को ले लिया और उनकी आँखों के सामने उसे बाँध दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסֹּב מֵעֲלֵיהֶם
  choice: वह उनसे मुँह फेरकर
  rationale: सन्दर्भ में यह पदबंध उनके सामने से हटने या उनकी ओर से मुँह फेरने को व्यक्त करता है; हिंदी में यह स्वाभाविक रूप से उस निजी रोने की भूमिका भी स्पष्ट करता है।
- source_word: וַיֵּבְךְּ
  choice: रोया
  rationale: בכה का सीधा और स्वाभाविक कथात्मक अर्थ ‘रोना’ है।
- source_word: וַיָּשָׁב אֲלֵהֶם
  choice: वह उनके पास लौटा
  rationale: שוב वापसी को और אֲלֵהֶם उन्हीं भाइयों की ओर लौटने को व्यक्त करता है।
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: उनसे बात की
  rationale: यह सरल आधुनिक हिंदी में प्रत्यक्ष संबोधन/वार्ता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּקַּח מֵאִתָּם אֶת שִׁמְעוֹן
  choice: उसने उनमें से शिमोन को पकड़ लिया
  rationale: מֵאִתָּם समूह में से शिमोन को अलग किए जाने का भाव देता है; संदर्भ में לקח केवल साथ लेने से अधिक, हिरासत में लेने की क्रिया है, जिसे ‘पकड़ लिया’ सहजता से व्यक्त करता है।
- source_word: וַיֶּאֱסֹר אֹתוֹ
  choice: उसे बँधवा दिया
  rationale: אסר का मूल अर्थ बाँधना है। हिंदी का प्रेरणार्थक रूप राजकीय अधिकारी यूसुफ द्वारा कार्य कराए जाने की स्वाभाविक संभावना को व्यक्त करता है, जबकि क्रिया के ठोस अर्थ को बनाए रखता है।
- source_word: לְעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: यह इब्रानी मुहावरे का सजीव और स्वाभाविक हिंदी समतुल्य है तथा कार्य की सार्वजनिक दृश्यता बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी, सरल और गरिमापूर्ण कथात्मक शैली। इब्रानी की क्रमिक क्रियाओं को हिंदी में छोटे, स्पष्ट वाक्यों में रखा गया है। अंग्रेज़ी परत की फुटनोट [a] मूलतः לְעֵינֵיהֶם से संबंधित प्रतीत होती है, न कि ‘रोया’ से; दोनों प्रस्तावित अंग्रेज़ी विकल्प हिंदी अर्थ में कोई वास्तविक भिन्नता नहीं लाते, इसलिए अनावश्यक फुटनोट नहीं रखे गए।
