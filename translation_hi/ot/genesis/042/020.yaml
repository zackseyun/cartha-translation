  text: Then bring your youngest brother to me[a], so that your words may be verified and you will not die.” And they did so.
translation:
  language: hi
  text: और अपने सबसे छोटे भाई को मेरे पास ले आओ; तब तुम्हारी बातें सत्य सिद्ध होंगी और तुम नहीं मरोगे।” फिर उन्होंने वैसा ही किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: अपने सबसे छोटे भाई
  rationale: भाई-बहनों के संदर्भ में הַקָּטֹן उस भाई को दर्शाता है जो आयु या जन्मक्रम में सबसे छोटा है; कथा में यह बिन्यामीन है।
- source_word: תָּבִיאוּ אֵלַי
  choice: मेरे पास ले आओ
  rationale: בוא के हिफ़ील रूप का अर्थ ‘ले आना’ है; אֵלַי को स्वाभाविक हिन्दी में ‘मेरे पास’ कहा गया है।
- source_word: וְיֵאָמְנוּ דִבְרֵיכֶם
  choice: ताकि तुम्हारी बातें सच प्रमाणित हों
  rationale: אמן का निफ़ाल यहाँ बातों के सत्य ठहरने या विश्वसनीय सिद्ध होने का भाव देता है। ‘सच प्रमाणित हों’ जाँच के प्रसंग के अनुकूल है, जबकि पादटिप्पणी ‘विश्वसनीय मानी जाएँ’ की वास्तविक सम्भावना सुरक्षित रखती है।
- source_word: וְלֹא תָמֻתוּ
  choice: और तुम न मरो
  rationale: हिब्रू समन्वय को बनाए रखते हुए आज्ञापालन के परिणामस्वरूप मृत्यु से बचने का अर्थ व्यक्त किया गया है।
- source_word: וַיַּעֲשׂוּ כֵן
  choice: तब उन्होंने वैसा ही किया
  rationale: यह कथात्मक सूत्र का स्वाभाविक आधुनिक हिन्दी रूप है और उनके अनुपालन को व्यक्त करता है।
