review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jacob's report, Egypt, the grain-purchasing instruction, and the purpose of survival. However, 'अनाज मिल रहा है' adds an ongoing/available-for-obtaining nuance where the Hebrew simply states that grain exists in Egypt, and 'मोल ले आओ' is less natural in modern standard Hindi.
  naturalness: The wording is generally clear, but 'वहाँ उतर जाओ' and especially 'अनाज मोल ले आओ' are somewhat awkward or dated in this register. 'मिस्र की ओर नीचे जाओ' preserves the directional force of רדוּ while reading more naturally, and 'खरीद लाओ' is standard contemporary Hindi.
  terminology: '''अनाज'' appropriately renders שבר in this famine and commercial context. ''जीवित रहें और मर न जाएँ'' preserves the Hebrew''s paired life-and-death purpose without theological overinterpretation.'
  issues:
  - severity: low
    issue: '''अनाज मिल रहा है'' is more specific than the Hebrew existential statement.'
    rationale: יׁשׁ שׁבר means that there is grain in Egypt; 'मिस्र में अनाज है' is direct and avoids introducing an imperfective sense.
  - severity: medium
    issue: '''मोल ले आओ'' is not the most natural modern standard Hindi expression for purchasing grain.'
    rationale: Although understandable, 'खरीद लाओ' is idiomatic contemporary Hindi and accurately renders the contextual commercial sense of וְשִׁבְרוּ.
  - severity: low
    issue: '''वहाँ उतर जाओ'' is slightly unnatural without a directional complement.'
    rationale: Adding 'मिस्र की ओर' makes the downward travel sense explicit and coherent in Hindi.
  revised_text: उसने कहा, “देखो, मैंने सुना है कि मिस्र में अनाज है। मिस्र की ओर नीचे जाओ और वहाँ से हमारे लिए अनाज खरीद लाओ, ताकि हम जीवित रहें और मर न जाएँ।”
