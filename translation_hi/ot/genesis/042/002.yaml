source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר הִנֵּ֣ה שָׁמַ֔עְתִּי כִּ֥י יֶשׁ שֶׁ֖בֶר בְּ/מִצְרָ֑יִם רְדוּ שָׁ֨מָּ/ה֙ וְ/שִׁבְרוּ לָ֣/נוּ מִ/שָּׁ֔ם וְ/נִחְיֶ֖ה וְ/לֹ֥א נָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/002.yaml
  text: He said[a], “Look, I have heard that there is grain in Egypt. Go down there and buy some for us from there[b], so that we may live and not die.”
translation:
  language: hi
  text: उसने कहा, “देखो, मैंने सुना है कि मिस्र में अनाज है। मिस्र की ओर नीचे जाओ और वहाँ से हमारे लिए अनाज खरीद लाओ, ताकि हम जीवित रहें और मर न जाएँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला संवाद-कण है; ‘देखो’ आधुनिक हिन्दी में उसकी तत्क्षणता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁמַעְתִּי
  choice: मैंने सुना है
  rationale: पूर्ण क्रिया से मिली हुई ऐसी सूचना व्यक्त होती है जो वर्तमान स्थिति में प्रासंगिक है; हिन्दी का पूर्ण वर्तमान रूप इसके अनुकूल है।
- source_word: שֶׁבֶר
  choice: अनाज मिल रहा है
  rationale: अकाल के प्रसंग में संज्ञा का आशय बिक्री के लिए उपलब्ध अनाज से है। केवल ‘अनाज है’ की अपेक्षा ‘अनाज मिल रहा है’ उसकी उपलब्धता को अधिक स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רְדוּ
  choice: उतर जाओ
  rationale: क्रिया कनान से मिस्र की ओर नीचे जाने की दिशात्मक बारीकी को व्यक्त करती है; हिन्दी में इसे बनाए रखा गया है।
- source_word: וְשִׁבְרוּ
  choice: अनाज मोल ले आओ
  rationale: इस प्रसंग में क्रिया का विशिष्ट अर्थ अनाज खरीदना है। ‘मोल ले आओ’ यात्रा के व्यावहारिक उद्देश्य को सहज हिन्दी में व्यक्त करता है, जबकि ‘अनाज’ को स्पष्ट करने से निहित कर्म सामने आता है।
- source_word: לָנוּ
  choice: हमारे लिए
  rationale: यह लाभार्थी कारक है और हिन्दी में ‘हमारे लिए’ इसका स्वाभाविक रूप है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: मूल में ‘से’ का भाव स्पष्ट है, इसलिए उसे अनुवाद में सुरक्षित रखा गया है।
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: ताकि हम जीवित रहें और मर न जाएँ
  rationale: यह उद्देश्य अथवा इच्छित परिणाम व्यक्त करता है और जीवन-मृत्यु के मूल विरोध तथा तात्कालिकता को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उतर जाओ’ मूल की भौगोलिक दिशा को सुरक्षित रखता है, और ‘मोल ले आओ’ सामान्य पाठक के लिए स्पष्ट रहते हुए अनाज खरीदने के प्रसंगविशेष अर्थ को व्यक्त करता है।
