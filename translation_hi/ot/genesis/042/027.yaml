translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘बोरा’ और ‘थैली’ के द्वारा मूल के दो अलग पात्र-संज्ञाओं का भेद रखा गया है। अंग्रेज़ी परामर्श-पाठ की पहली पादटिप्पणी मूल वाक्य के दो अलग पदों को अनुचित रूप से जोड़ती प्रतीत होती है, इसलिए उसे शामिल नहीं किया गया; केवल चाँदी के प्रासंगिक अर्थ की टिप्पणी रखी गई है।
