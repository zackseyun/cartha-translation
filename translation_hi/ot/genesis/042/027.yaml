base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/027.yaml
  text: Then one of them opened his sack to give fodder to his donkey at the lodging place[a], and he saw his silver—and behold[b], it was in the mouth of his bag.
translation:
  language: hi
  text: फिर उनमें से एक ने पड़ाव पर अपने गधे को चारा देने के लिए अपना बोरा खोला। उसने अपनी चाँदी[a] देखी—और देखो, वह उसकी थैली के मुँह में थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “चाँदी” से आशय उस धनराशि से है जो उसने अनाज के लिए चुकाई थी।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: खोला
  rationale: פתח का सामान्य कथात्मक अर्थ ‘खोलना’ है; यहाँ बोरा खोलने की सीधी क्रिया है।
- source_word: הָאֶחָד
  choice: उनमें से एक
  rationale: शाब्दिक रूप से ‘एक’; प्रसंग में यूसुफ के भाइयों में से एक का संकेत है, इसलिए आधुनिक हिन्दी में संबंध स्पष्ट किया गया।
- source_word: שַׂקּוֹ
  choice: अपना बोरा
  rationale: שַׂק अनाज ढोने के बड़े बोरे को दर्शाता है; आगे आए אַמְתַּחַת से भेद बनाए रखने के लिए ‘बोरा’ चुना गया।
- source_word: לָתֵת מִסְפּוֹא
  choice: चारा देने के लिए
  rationale: מִסְפּוֹא पशुओं के आहार या चारे को दर्शाता है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: לַחֲמֹרוֹ
  choice: अपने गधे को
  rationale: लामेद यहाँ प्राप्तकर्ता को दर्शाता है; ‘चारा देने’ के साथ यह स्वाभाविक हिन्दी रचना है।
- source_word: בַּמָּלוֹן
  choice: पड़ाव पर
  rationale: מָלוֹן यात्रा में रात ठहरने की जगह है। ‘पड़ाव’ किसी व्यावसायिक सराय का अनावश्यक संकेत दिए बिना आशय व्यक्त करता है।
- source_word: וַיַּרְא אֶת־כַּסְפּוֹ
  choice: उसने अपनी चाँदी देखी
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ और प्रासंगिक अर्थ भुगतान की धनराशि है; ‘चाँदी’ मूल की ठोस अभिव्यक्ति बनाए रखती है, जबकि पादटिप्पणी अर्थ स्पष्ट करती है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה अचानक हुई खोज और आश्चर्य पर ध्यान खींचता है; ‘और देखो’ आधुनिक, गरिमापूर्ण हिन्दी में इसका कथात्मक बल रखता है।
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: उसकी थैली के मुँह पर
  rationale: פִּי का शाब्दिक अर्थ ‘मुँह’ है और पात्र के खुले सिरे के लिए मुहावरे के रूप में प्रयुक्त है। ‘मुँह पर’ हिन्दी में बोधगम्य है और मूल बिंब रखता है; אַמְתַּחַת के लिए ‘थैली’ बोरे से शब्दगत भेद बनाए रखती है।
