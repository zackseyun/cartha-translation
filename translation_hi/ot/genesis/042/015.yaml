id: GEN.42.15
reference: Genesis 42:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/זֹ֖את תִּבָּחֵ֑נוּ חֵ֤י פַרְעֹה֙ אִם תֵּצְא֣וּ מִ/זֶּ֔ה כִּ֧י אִם בְּ/ב֛וֹא אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/015.yaml
  text: 'By this you will be tested: as Pharaoh lives[a], you shall not leave this place unless your youngest brother comes here.'
translation:
  language: hi
  text: 'इसी बात से तुम्हारी परख होगी: फिरौन के जीवन की शपथ, तुम यहाँ से तब तक नहीं निकलोगे, जब तक तुम्हारा सबसे छोटा भाई यहाँ न आ जाए।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּזֹאת
  choice: इसी से
  rationale: करणवाचक בְּ के साथ संकेतवाचक זֹאת उस साधन या कसौटी को बताता है जिससे भाइयों के कथन की जाँच होगी।
- source_word: תִּבָּחֵנוּ
  choice: तुम्हारी परख होगी
  rationale: בחן के निफ़अल रूप का अर्थ जाँचा या परखा जाना है; प्रसंग में उनके दावे की सत्यता परखी जा रही है।
- source_word: חֵי פַרְעֹה
  choice: फ़िरऔन के जीवन की शपथ
  rationale: यह फ़िरऔन के जीवन को साक्षी बनाकर कही गई शपथ की रीति है। हिंदी में यह रूप उसके शपथात्मक बल को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: אִם תֵּצְאוּ מִזֶּה
  choice: तुम यहाँ से ... नहीं निकलोगे
  rationale: शपथ के बाद אִם प्रबल निषेध व्यक्त करता है; इसलिए इसे साधारण शर्त न बनाकर दृढ़ नकार के रूप में अनूदित किया गया है।
- source_word: כִּי אִם
  choice: जब तक ... न
  rationale: यह पिछले निषेध के एकमात्र अपवाद को व्यक्त करता है। हिंदी में ‘तब तक नहीं ... जब तक ... न’ स्वाभाविक रूप से ‘unless’ का भाव देता है।
- source_word: בְּבוֹא
  choice: आ जाए
  rationale: בְּ के साथ क्रियार्थक संज्ञा उस परिस्थिति को दर्शाती है जिसमें निकलना संभव होगा; हिंदी में संयुक्त शर्तीय वाक्य के भीतर सीमित क्रिया अधिक स्वाभाविक है।
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: तुम्हारा सबसे छोटा भाई
  rationale: भाइयों के प्रसंग में קָטֹן उम्र या क्रम में सबसे छोटे भाई, अर्थात बिन्यामीन, को सूचित करता है।
- source_word: הֵנָּה
  choice: यहाँ
  rationale: दिशासूचक क्रियाविशेषण का अर्थ ‘यहाँ/यहाँ तक’ है; ‘यहाँ’ आधुनिक हिंदी में सहज है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘फ़िरऔन के जीवन की शपथ’ मूल शपथ-विधि को स्पष्ट रखता है, और ‘तब तक नहीं ... जब तक ... न’ हिब्रू के प्रबल निषेध तथा एकमात्र अपवाद दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
