  text: וְ/יוֹסֵ֗ף ה֚וּא הַ/שַּׁלִּ֣יט עַל הָ/אָ֔רֶץ ה֥וּא הַ/מַּשְׁבִּ֖יר לְ/כָל עַ֣ם הָ/אָ֑רֶץ וַ/יָּבֹ֨אוּ֙ אֲחֵ֣י יוֹסֵ֔ף וַ/יִּשְׁתַּֽחֲווּ ל֥/וֹ אַפַּ֖יִם אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/006.yaml
  text: Joseph was the ruler over the land; he was the one who sold grain to all the people of the land[a]. And Joseph’s brothers came and bowed down to him with their faces to the ground.
translation:
  language: hi
  text: यूसुफ ही उस देश का शासक था; वही देश के सभी लोगों को अनाज बेचता था। यूसुफ के भाई आए और उसके सामने मुँह के बल भूमि पर गिर पड़े[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सामने झुककर उसे प्रणाम किया” या “उसके सामने मुँह के बल दण्डवत् हुए।” इब्रानी क्रिया गहराई से झुकने या सम्मान प्रकट करने के लिए दण्डवत् होने, दोनों का बोध करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׁלִּיט
  choice: शासक
  rationale: यह शब्द अधिकार और शासन करने वाले व्यक्ति को दर्शाता है। “शासक” आधुनिक हिन्दी में स्वाभाविक है और किसी अधिक विशिष्ट पदनाम को अनावश्यक रूप से नहीं जोड़ता।
- source_word: עַל הָאָרֶץ
  choice: उस देश का
  rationale: इस प्रसंग में אֶרֶץ का संकेत मिस्र देश की ओर है, पूरी पृथ्वी की ओर नहीं। सम्बन्धसूचक “का” हिन्दी में शासनाधिकार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַמַּשְׁבִּיר
  choice: अनाज बेचता था
  rationale: अकाल के इस प्रसंग में שׁבר का हिफ़ील कृदन्त अनाज बेचने को सूचित करता है; प्रसंग से निहित वस्तु “अनाज” को स्पष्ट करना हिन्दी में आवश्यक और स्वाभाविक है।
- source_word: לְכָל עַם הָאָרֶץ
  choice: देश के सभी लोगों को
  rationale: עַם यहाँ सामूहिक अर्थ में देश के लोगों को दर्शाता है और הָאָרֶץ स्थानीय रूप से उसी देश को।
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: उसे प्रणाम किया
  rationale: क्रिया गहरे झुकने या दण्डवत् होकर सम्मान प्रकट करने को दर्शाती है। “प्रणाम किया” सामाजिक अधीनता और सम्मान को व्यक्त करता है, बिना इसे ईश्वरीय आराधना ठहराए।
- source_word: אַפַּיִם אָרְצָה
  choice: भूमि तक मुँह झुकाकर
  rationale: यह मुहावरा अत्यन्त गहराई से झुकने की मुद्रा बताता है। चुना हुआ वाक्यांश शारीरिक भाव को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: הוּא … הוּא
  choice: ही … वही
  rationale: दोहराया गया सर्वनाम यूसुफ की विशिष्ट भूमिका पर बल देता है; “ही … वही” उस बल को हिन्दी में बनाए रखता है।
theological_decisions:
- issue: यूसुफ के भाइयों द्वारा उसके सामने झुकने का स्वरूप
  choice: उसके सामने भूमि तक मुँह झुकाकर उसे प्रणाम किया
  alternative: उसके सामने मुँह के बल दण्डवत् हुए
  rationale: यह घटना यूसुफ के स्वप्नों की पूर्ति और उसके अधिकार के सामने सामाजिक अधीनता दर्शाती है। अनुवाद गहरे झुकने की मुद्रा और सम्मान को रखता है, पर इसे परमेश्वर की आराधना के अर्थ में निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। “शासक,” “अनाज बेचता था,” और “प्रणाम किया” जैसे परिचित शब्द चुने गए हैं। आरम्भ में कोई अतिरिक्त कालसूचक “अब” नहीं जोड़ा गया।
