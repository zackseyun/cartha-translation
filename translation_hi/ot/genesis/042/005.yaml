  yaml_path: translation/ot/genesis/042/005.yaml
  text: So the sons of Israel came to buy grain among those who were coming[b][a], because the famine was in the land of Canaan.
translation:
  language: hi
  text: तब इस्राएल के पुत्र अनाज खरीदने[a] के लिए आने वाले लोगों के बीच आए, क्योंकि कनान देश में अकाल था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खरीदने”; इब्रानी क्रिया बिना किसी स्पष्ट कर्म के भी प्रयुक्त हो सकती है, पर अकाल के इस संदर्भ में इसका आशय अनाज या भोजन खरीदना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: आए
  rationale: בוא का क्रमिक कथात्मक रूप यहाँ मिस्र पहुँचने के दृष्टिकोण से ‘आए’ के रूप में स्वाभाविक है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: इस निकट संदर्भ में यह पदबंध विशेष रूप से याकूब के पुत्रों को सूचित करता है; इसलिए शाब्दिक और संदर्भ-सटीक रूप रखा गया है।
- source_word: לִשְׁבֹּר
  choice: अनाज मोल लेने
  rationale: क्रिया का मूल अर्थ ‘खरीदना’ है, पर अकाल और यूसुफ-वृत्तांत के संदर्भ में खरीदी जानेवाली वस्तु अनाज है; ‘मोल लेना’ वर्तमान पद के ऐतिहासिक-कथात्मक भाव के अनुरूप है।
- source_word: בְּתוֹךְ הַבָּאִים
  choice: आनेवालों के बीच
  rationale: בְּתוֹךְ समूह के बीच होने को और participle הַבָּאִים ‘आनेवालों’ को व्यक्त करता है; यह इस बात को बनाए रखता है कि वे आनेवाले बड़े समूह में सम्मिलित थे।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनके आने का कारण प्रस्तुत करता है।
- source_word: הָיָה הָרָעָב
  choice: अकाल पड़ा था
  rationale: हिंदी में अकाल की विद्यमान अवस्था व्यक्त करने का यह स्वाभाविक कथात्मक रूप है।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: इब्रानी की ठोस भौगोलिक अभिव्यक्ति ‘कनान देश’ सुरक्षित रखी गई है।
