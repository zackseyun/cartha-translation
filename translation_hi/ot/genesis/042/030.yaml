  text: The man, the lord of the land, spoke harshly with us and treated us as spies of the land.
translation:
  language: hi
  text: उस पुरुष ने, जो उस देश का स्वामी है, हमसे कठोरता से बात की और हमें उस देश की टोह लेनेवाले समझा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: उस पुरुष ने, जो उस देश का स्वामी है
  rationale: संज्ञा-समूह का संबंध स्पष्ट करते हुए ‘पुरुष’ और ‘देश का स्वामी’ दोनों पद सुरक्षित रखे गए हैं।
- source_word: אִתָּנוּ קָשׁוֹת
  choice: हमसे कठोरता से बात की
  rationale: קָשׁוֹת यहाँ कठोर या कड़ी बातों/ढंग को व्यक्त करता है; सहज आधुनिक हिन्दी में क्रिया-विशेषणात्मक रूप उपयुक्त है।
- source_word: וַיִּתֵּן אֹתָנוּ כִּמְרַגְּלִים
  choice: हमें ... टोह लेनेवाले समझा
  rationale: נָתַן के इस प्रयोग का आशय किसी को एक श्रेणी में रखना या मानना है; ‘समझा’ स्वाभाविक हिन्दी में वही भाव देता है।
- source_word: מְרַגְּלִים אֶת־הָאָרֶץ
  choice: उस देश की टोह लेनेवाले
  rationale: מְרַגְּלִים का संदर्भ गुप्त रूप से देश की जानकारी लेनेवालों से है; यह पद अर्थ को स्पष्ट रखता है और अनावश्यक आधुनिक सैन्य रंग से बचता है।
