- source_word: אֲחִיכֶם הַקָּטֹן
  choice: अपने सबसे छोटे भाई
  rationale: भाइयों के प्रसंग में הַקָּטֹן का आशय आयु में सबसे छोटे भाई से है।
- source_word: וְאֵדְעָה
  choice: ताकि मैं जान लूँ
  rationale: कोहोर्टेटिव यहाँ पहले दिए आदेश का उद्देश्य अथवा अपेक्षित परिणाम व्यक्त करता है।
- source_word: כִּי לֹא מְרַגְּלִים אַתֶּם כִּי כֵנִים אַתֶּם
  choice: कि तुम जासूस नहीं, बल्कि सच्चे लोग हो
  rationale: מְרַגְּלִים के लिए ‘जासूस’ और כֵנִים के लिए विश्वसनीयता तथा सत्यनिष्ठा सूचित करने वाला ‘सच्चे लोग’ स्वाभाविक विरोध प्रस्तुत करते हैं।
- source_word: אֶת אֲחִיכֶם אֶתֵּן לָכֶם
  choice: मैं तुम्हारे भाई को तुम्हें लौटा दूँगा
  rationale: मूल में ‘दूँगा’ है; बंदी बनाए गए भाई के प्रसंग में हिन्दी का ‘लौटा दूँगा’ निहित पुनःप्राप्ति को स्पष्ट करता है।
- source_word: וְאֶת הָאָרֶץ תִּסְחָרוּ
  choice: तुम इस देश में व्यापार कर सकोगे
  rationale: סחר का प्रमुख प्रसंगानुकूल अर्थ व्यापार करना है; अपूर्ण क्रिया यहाँ अनुमति अथवा स्वतंत्रता व्यक्त करती है।
