base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/034.yaml
  text: Bring your youngest brother to me[a], so that I may know that you are not spies, but honest men. Then I will give your brother back to you, and you may trade in the land.”
translation:
  language: hi
  text: अपने सबसे छोटे भाई को मेरे पास ले आओ, ताकि मैं जान लूँ कि तुम जासूस नहीं, बल्कि ईमानदार लोग हो। तब मैं तुम्हारे भाई को तुम्हें लौटा दूँगा और तुम इस देश में व्यापार कर सकोगे[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तुम इस देश में आ-जा सकोगे।” इब्रानी क्रिया का अर्थ व्यापक रूप से इधर-उधर आना-जाना भी हो सकता है, यद्यपि इस प्रसंग में “व्यापार करना” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
