  yaml_path: translation/ot/genesis/042/026.yaml
  text: Then they loaded their grain onto their donkeys and went from there[a].
translation:
  language: hi
  text: तब उन्होंने अपना अनाज[a] अपने गधों पर लादा और वहाँ से चल दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी खाद्य-सामग्री’ अथवा ‘अपना खरीदा हुआ अनाज।’ इब्रानी शब्द भोजन-सामग्री को भी सूचित कर सकता है, पर इस संदर्भ में उसका सबसे स्वाभाविक अर्थ मिस्र से प्राप्त अनाज है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: लादा
  rationale: נשׂא का मूल अर्थ उठाना या ले जाना है; पर सामान को पशुओं पर रखने के इस यात्रा-संदर्भ में ‘लादा’ स्वाभाविक और सटीक है।
- source_word: שִׁבְרָם
  choice: अपना अनाज
  rationale: यूसुफ की कथा और अकाल के संदर्भ में שֶׁבֶר विशेष रूप से मिस्र से प्राप्त या खरीदे गए अनाज को सूचित करता है।
- source_word: עַל חֲמֹרֵיהֶם
  choice: अपने गधों पर
  rationale: עַל यहाँ लादने की क्रिया के साथ वस्तु को पशुओं पर रखे जाने का भाव व्यक्त करता है; आधुनिक हिन्दी में ‘पर’ पर्याप्त और स्वाभाविक है।
- source_word: וַיֵּלְכוּ
  choice: चल दिए
  rationale: הלך सामान्यतः जाने या चलने का अर्थ देता है; ‘चल दिए’ यहाँ उस स्थान से प्रस्थान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: यह स्थान-सूचक पद सीधे रूप में ‘वहाँ से’ है।
