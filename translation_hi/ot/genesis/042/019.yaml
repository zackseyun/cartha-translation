translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सच्चे’ पूछताछ के संदर्भ में सत्य बोलने का भाव देता है। हिरासत के पदबंध को हिन्दी में स्पष्ट किया गया है, जबकि ‘घरों की भुखमरी’ की मूल असामान्यता को मुख्य पाठ में कुछ सीमा तक सुरक्षित रखकर पादटिप्पणी में स्वाभाविक विकल्प दिया गया है।
