source:
  edition: WLC
  text: אִם כֵּנִ֣ים אַתֶּ֔ם אֲחִי/כֶ֣ם אֶחָ֔ד יֵאָסֵ֖ר בְּ/בֵ֣ית מִשְׁמַרְ/כֶ֑ם וְ/אַתֶּם֙ לְכ֣וּ הָבִ֔יאוּ שֶׁ֖בֶר רַעֲב֥וֹן בָּתֵּי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/019.yaml
  text: If you are honest[a], let one of your brothers be confined in your place of custody, and you[c][b], go and bring grain for the famine of your households.
translation:
  language: hi
  text: यदि तुम ईमानदार हो,[a] तो तुम्हारे भाइयों में से एक उस हिरासत-स्थान में बंद रहे जहाँ तुम रखे गए हो; और तुम जाकर अपने अकाल-पीड़ित घरानों के लिए अनाज ले जाओ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम सत्यवादी हो।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक, “तुम्हारे घरों/घरानों के अकाल के लिए [अनाज]।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּנִים
  choice: सच्चे
  rationale: पूछताछ के इस प्रसंग में विशेषण का आशय उनकी बात की सत्यता से है। ‘सच्चे’ मूल के ‘सत्य/सत्यवादी’ भाव को सहज हिन्दी में बनाए रखता है।
- source_word: אֲחִיכֶם אֶחָד
  choice: तुम्हारे भाइयों में से एक
  rationale: यह स्वाभाविक हिन्दी में समूह में से एक भाई चुने जाने का भाव स्पष्ट करता है।
- source_word: יֵאָסֵר
  choice: बंद रहे
  rationale: निफ़अल रूप यहाँ हिरासत में रखे जाने को सूचित करता है; ‘बंद रहे’ शारीरिक रूप से बाँधे जाने का अनावश्यक अर्थ जोड़े बिना यह भाव देता है।
- source_word: בְּבֵית מִשְׁמַרְכֶם
  choice: उसी पहरे की जगह में ... जहाँ तुम रखे गए थे
  rationale: शाब्दिक अर्थ ‘तुम्हारी हिरासत/पहरे का घर’ है। प्रसंगानुसार प्रत्यय उस हिरासत को सूचित करता है जिसमें भाई रखे गए थे; हिन्दी वाक्य इसे स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: וְאַתֶּם לְכוּ
  choice: और तुम जाओ
  rationale: स्वतंत्र सर्वनाम और आज्ञार्थक क्रिया एक बंद रहने वाले भाई और जाने वाले शेष भाइयों के बीच बलयुक्त अंतर बनाए रखते हैं, जबकि וְ का साधारण संयोजक भाव भी सुरक्षित रहता है।
- source_word: הָבִיאוּ
  choice: ले जाओ
  rationale: भाइयों की गति मिस्र से अपने घरों की ओर है, इसलिए हिन्दी में गंतव्य-सापेक्ष ‘ले जाओ’ स्वाभाविक है; मूल हिफ़इल का वस्तु को पहुँचाने का भाव बना रहता है।
- source_word: שֶׁבֶר
  choice: अनाज
  rationale: यूसुफ़-वृत्तांत में यह शब्द अकाल के समय खरीदे जाने वाले अनाज के लिए प्रयुक्त है।
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: अपने घरों की भुखमरी के लिए
  rationale: यह चयन असामान्य किन्तु अर्थपूर्ण इब्रानी संबंध को अत्यधिक व्याख्यायित किए बिना रखता है; ‘घरों’ से घराने के लोग अभिप्रेत हो सकते हैं।
