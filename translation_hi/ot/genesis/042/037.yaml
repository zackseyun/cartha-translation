language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר רְאוּבֵן֙ אֶל אָבִ֣י/ו לֵ/אמֹ֔ר אֶת שְׁנֵ֤י בָנַ/י֙ תָּמִ֔ית אִם לֹ֥א אֲבִיאֶ֖/נּוּ אֵלֶ֑י/ךָ תְּנָ֤/ה אֹת/וֹ֙ עַל יָדִ֔/י וַ/אֲנִ֖י אֲשִׁיבֶ֥/נּוּ אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/037.yaml
  text: Then Reuben said to his father[a], “You may put my two sons to death if I do not bring him back to you. Put him in my hand, and I myself will bring him back to you.”
translation:
  language: hi
  text: तब रूबेन ने अपने पिता से कहा, “यदि मैं उसे आपके पास वापस न लाऊँ, तो आप मेरे दोनों पुत्रों को मार डालिएगा। उसे मेरे हाथ में दे दीजिए[a], और मैं स्वयं उसे आपके पास वापस ले आऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, “उसे मुझे सौंप दीजिए।”
    reason: हिब्रू मुहावरे ‘मेरे हाथ में दे दीजिए’ का आशय स्पष्ट करने वाला अर्थगत विकल्प।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רְאוּבֵן אֶל־אָבִיו
  choice: रूबेन ने अपने पिता से
  rationale: नाम का मानक हिन्दी लिप्यंतरण किया गया है और सम्बन्धसूचक वाक्यांश को सहज हिन्दी में रखा गया है।
- source_word: אֶת־שְׁנֵי בָנַי תָּמִית
  choice: आप मेरे दोनों पुत्रों को मार डालिएगा
  rationale: מות का हिफ़ील रूप मृत्यु का कारण बनने, अर्थात मार डालने, का भाव देता है। आदरसूचक क्रिया पिता से संबोधन के अनुरूप है और कथन को रूबेन की कठोर प्रतिज्ञा के रूप में बनाए रखती है।
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: यदि मैं उसे आपके पास वापस न लाऊँ
  rationale: नकारात्मक शर्त को सीधे व्यक्त किया गया है; प्रसंग के कारण בוא के ‘लाने’ में ‘वापस’ का भाव स्पष्ट है।
- source_word: תְּנָה אֹתוֹ עַל־יָדִי
  choice: उसे मेरे हाथ में दे दीजिए
  rationale: हिब्रू के ठोस ‘हाथ’ वाले मुहावरे को मुख्य पाठ में सुरक्षित रखा गया है; इसका आशय किसी को अपनी जिम्मेदारी में सौंपना है।
- source_word: וַאֲנִי אֲשִׁיבֶנּוּ אֵלֶיךָ
  choice: और मैं स्वयं उसे आपके पास वापस ले आऊँगा
  rationale: स्पष्ट सर्वनाम אֲנִי के जोर को ‘मैं स्वयं’ से और שוב के हिफ़ील, ‘वापस पहुँचाना’, को ‘वापस ले आऊँगा’ से व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। रूबेन द्वारा पिता को संबोधित करने के कारण आदरसूचक ‘आप’ और ‘दीजिए’ प्रयुक्त हैं। मुख्य पाठ में हिब्रू का ‘हाथ’ वाला बिंब रखा गया है, जबकि पादटिप्पणी उसका मुहावरेदार अर्थ बताती है।
