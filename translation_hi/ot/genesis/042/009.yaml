  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘स्वप्न’ बाइबिलीय प्रसंग के अनुरूप परिचित औपचारिक शब्द है; संवाद में ‘जासूस’ और ‘आए हो’ सामान्य पाठक के लिए सीधे और स्वाभाविक हैं।
