  text: וַ/יִּזְכֹּ֣ר יוֹסֵ֔ף אֵ֚ת הַ/חֲלֹמ֔וֹת אֲשֶׁ֥ר חָלַ֖ם לָ/הֶ֑ם וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ מְרַגְּלִ֣ים אַתֶּ֔ם לִ/רְא֛וֹת אֶת עֶרְוַ֥ת הָ/אָ֖רֶץ בָּאתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/009.yaml
  text: Then Joseph remembered the dreams that he had dreamed about them[a], and he said to them, “You are spies; you have come to see the nakedness of the land.”
translation:
  language: hi
  text: तब यूसुफ को वे स्वप्न याद आए जो उसने उनके विषय में देखे थे। उसने उनसे कहा, “तुम जासूस हो; तुम देश की नग्नता[a] देखने आए हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात देश के खुले या असुरक्षित भाग, जहाँ से उस पर आक्रमण किया जा सकता हो। हिब्रू में शाब्दिक रूप से “देश की नग्नता” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: याद आए
  rationale: यह रूप कथा में उसी समय यूसुफ के स्मरण को व्यक्त करता है; हिंदी में ‘यूसुफ को ... याद आए’ स्वाभाविक और स्पष्ट है।
- source_word: הַחֲלֹמוֹת אֲשֶׁר חָלַם
  choice: वे स्वप्न ... जो उसने ... देखे थे
  rationale: हिब्रू में एक ही धातु से ‘स्वप्न’ और ‘स्वप्न देखना’ का प्रयोग है। हिंदी का स्वाभाविक मुहावरा ‘स्वप्न देखना’ है और पूर्वकालिकता के लिए ‘देखे थे’ उपयुक्त है।
- source_word: לָהֶם
  choice: उनके विषय में
  rationale: संदर्भ में स्वप्न यूसुफ के भाइयों से संबंधित थे। ‘उनके विषय में’ इस संबंध को स्पष्ट रखते हुए मूल की संभावित अर्थ-सीमा को संकुचित नहीं करता।
- source_word: מְרַגְּלִים
  choice: जासूस
  rationale: इस संदर्भ में यह शब्द गुप्त रूप से देश की जानकारी लेने वालों को दर्शाता है; आधुनिक हिंदी में ‘जासूस’ सबसे स्पष्ट और प्रचलित समतुल्य है।
- source_word: לִרְאוֹת
  choice: देखने
  rationale: मूल क्रिया का सीधा अर्थ ‘देखना’ है। टोही करने का आशय आरोप और अगले वाक्यांश से उभरता है, इसलिए अधिक व्याख्यात्मक अनुवाद नहीं अपनाया गया।
- source_word: עֶרְוַת הָאָרֶץ
  choice: देश की नग्नता
  rationale: मुख्य पाठ में हिब्रू की सजीव उपमा सुरक्षित रखी गई है; पादटिप्पणी बताती है कि इसका आशय देश के खुले, असुरक्षित या आक्रमण-संवेदनशील भागों से है।
- source_word: בָּאתֶם
  choice: आए हो
  rationale: सीधे आरोप में यह हिंदी रूप उनके आने के वर्तमान उद्देश्य और परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
