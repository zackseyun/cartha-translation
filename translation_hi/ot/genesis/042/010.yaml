lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: पर उन्होंने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, पर यहाँ यूसुफ के आरोप के प्रत्युत्तर में स्पष्ट विरोध भी है; इसलिए आधुनिक हिन्दी में “पर” स्वाभाविक है।
- source_word: אֵלָיו
  choice: उससे
  rationale: אֶל के सर्वनामिक रूप का सामान्य दिशात्मक अर्थ है; भाइयों ने यूसुफ को संबोधित करके उत्तर दिया।
- source_word: לֹא
  choice: नहीं
  rationale: प्रत्यक्ष कथन में यह यूसुफ के आरोप का बलपूर्ण खंडन है।
- source_word: אֲדֹנִי
  choice: मेरे प्रभु
  rationale: यह उच्च अधिकारी के प्रति सम्मान और सामाजिक अधीनता व्यक्त करने वाला संबोधन है; “मेरे प्रभु” उस विनम्रता को बनाए रखता है।
- source_word: וַעֲבָדֶיךָ
  choice: आपके सेवक
  rationale: עֶבֶד का अर्थ दास भी हो सकता है, पर यहाँ यह दरबारी विनम्र आत्म-संदर्भ है, बंधुआ स्थिति का दावा नहीं।
- source_word: בָּאוּ
  choice: आए हैं
  rationale: पूर्ण क्रिया उनके आगमन और संवाद के समय उनकी वर्तमान उपस्थिति दोनों को व्यक्त करती है; हिन्दी पूर्ण वर्तमान स्वाभाविक है।
- source_word: לִשְׁבָּר
  choice: मोल लेने
  rationale: अकाल और मिस्री वितरण के संदर्भ में क्रिया का अर्थ खरीदना है; “मोल लेने” उद्देश्य को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֹכֶל
  choice: भोजन
  rationale: शब्द का मूल अर्थ व्यापक रूप से खाद्य पदार्थ या भोजन है। संदर्भ में अनाज अभिप्रेत हो सकता है, पर मुख्य पाठ में व्यापक अर्थ सुरक्षित रखा गया है।
