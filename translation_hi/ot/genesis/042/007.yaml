- source_word: מֵאַיִן בָּאתֶם
  choice: तुम कहाँ से आए हो?
  rationale: यह आगमन के स्थान के विषय में सीधा प्रश्न है और हिन्दी में स्वाभाविक है।
- source_word: מֵאֶרֶץ כְּנַעַן
  choice: कनान देश से
  rationale: यह हिन्दी में אֶרֶץ כְּנַעַן के भौगोलिक पदबंध को संक्षिप्त और औपचारिक रूप से व्यक्त करता है।
- source_word: לִשְׁבָּר אֹכֶל
  choice: भोजन मोल लेने
  rationale: שבר का अर्थ इस अकाल-संदर्भ में रसद, विशेषतः अनाज, खरीदना है; पर אֹכֶל व्यापक रूप से ‘भोजन’ है, इसलिए मुख्य पाठ में अर्थ को अनावश्यक रूप से संकुचित नहीं किया गया।
