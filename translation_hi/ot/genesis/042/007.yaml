  rationale: हित्पाएल रूप उनके प्रति स्वयं को पराया या अपरिचित प्रस्तुत करने का भाव देता है; यह अनिवार्य रूप से शारीरिक वेश बदलने की बात नहीं कहता।
- source_word: וַיְדַבֵּר אִתָּם קָשׁוֹת
  choice: उनसे कठोरता से बात की
