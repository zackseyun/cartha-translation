base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/007.yaml
  text: When Joseph saw his brothers[a], he recognized them, but he acted like a stranger toward them and spoke harshly with them. He said to them, “Where have you come from?” And they said, “From the land of Canaan[b], to buy food.”
translation:
  language: hi
  text: जब यूसुफ ने अपने भाइयों को देखा, तो उसने उन्हें पहचान लिया; पर उसने उनके सामने अपने को अजनबी दिखाया[a] और उनसे कठोरता से बात की। उसने उनसे पूछा, “तुम कहाँ से आए हो?” उन्होंने कहा, “कनान देश से, भोजन खरीदने।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अपने को उनके लिए अपरिचित बना लिया।” इब्रानी पद का अर्थ उनके सामने अपने को पराया या अनजान दिखाना हो सकता है; यह आवश्यक नहीं कि उसने अपना शारीरिक वेश बदला हो।
    reason: lexical_alternative
  - marker: b
    text: या, “अनाज खरीदने।” अकाल के इस प्रसंग में इब्रानी क्रिया प्रायः अनाज खरीदने के लिए प्रयुक्त होती है, यद्यपि यहाँ संज्ञा का व्यापक अर्थ “भोजन” है।
    reason: lexical_alternative
