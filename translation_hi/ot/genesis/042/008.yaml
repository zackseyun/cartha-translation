  yaml_path: translation/ot/genesis/042/008.yaml
  text: Joseph recognized his brothers[a], but they did not recognize him.
translation:
  language: hi
  text: यूसुफ ने अपने भाइयों को पहचान लिया[a], पर उन्होंने उसे नहीं पहचाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में दोनों खंडों में एक ही क्रिया दोहराई गई है: “यूसुफ ने अपने भाइयों को पहचान लिया, पर उन्होंने उसे नहीं पहचाना।”'
    reason: मूल भाषा की शब्द-पुनरावृत्ति और कथात्मक विरोध को स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: पहचान लिया
  rationale: हिफ़ील रूप נכר यहाँ पहले से परिचित व्यक्तियों को पहचानने का अर्थ देता है। ‘पहचान लिया’ स्वाभाविक हिन्दी है और पहचान की पूर्ण घटना को स्पष्ट करता है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: हिन्दी बाइबल-परंपरा में प्रचलित और मूल नाम के निकट रूप।
- source_word: אֶת־אֶחָיו
  choice: अपने भाइयों को
  rationale: אָח का पुल्लिंग बहुवचन और तृतीय पुरुष एकवचन प्रत्यय इस प्रसंग में यूसुफ के पुरुष सहोदरों को सूचित करता है। हिन्दी में कर्ता की ओर लौटते संबंध के लिए ‘अपने’ स्वाभाविक है।
- source_word: וְהֵם
  choice: पर उन्होंने
  rationale: 'וְ का यहाँ विरोधसूचक संबंध है: यूसुफ ने उन्हें पहचाना, जबकि वे उसे नहीं पहचान सके। ‘पर’ इस कथात्मक विरोध को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।'
- source_word: לֹא
  choice: नहीं
  rationale: हिन्दी में क्रिया के निषेध का सामान्य और स्पष्ट रूप।
- source_word: הִכִּרֻהוּ
  choice: उसे नहीं पहचाना
  rationale: यह पहले खंड वाले נכר का ही रूप है; ‘पहचाना’ उसी शब्द की पुनरावृत्ति और कथा की विडंबना को बनाए रखता है। प्रत्यय הוּ को ‘उसे’ से व्यक्त किया गया है।
