  text: שִׁלְח֨וּ מִ/כֶּ֣ם אֶחָד֮ וְ/יִקַּ֣ח אֶת אֲחִי/כֶם֒ וְ/אַתֶּם֙ הֵאָ֣סְר֔וּ וְ/יִבָּֽחֲנוּ֙ דִּבְרֵי/כֶ֔ם הַֽ/אֱמֶ֖ת אִתְּ/כֶ֑ם וְ/אִם לֹ֕א חֵ֣י פַרְעֹ֔ה כִּ֥י מְרַגְּלִ֖ים אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/016.yaml
  text: Send one of you[a], and let him bring your brother, while you remain confined, so that your words may be tested, whether the truth is with you. But if not, as Pharaoh lives[d][c][b], surely you are spies.
translation:
  language: hi
  text: तुममें से एक को भेजो, और वह तुम्हारे भाई को ले आए; और तुम हिरासत में रहो, ताकि तुम्हारी बातों की जाँच की जाए कि तुम सच बोल रहे हो या नहीं। यदि नहीं, तो फ़िरौन के जीवन की शपथ, तुम निश्चय ही जासूस हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁלְחוּ מִכֶּם אֶחָד
  choice: तुममें से एक को भेजो
  rationale: बहुवचन आज्ञा और समूह में से एक व्यक्ति चुनने का भाव स्वाभाविक तथा सटीक हिंदी में व्यक्त होता है।
- source_word: וְיִקַּח אֶת אֲחִיכֶם
  choice: और वह तुम्हारे भाई को ले आए
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर यहाँ भाई को वहाँ से यूसुफ के पास लाने का संदर्भ है; ‘ले आए’ मूल क्रिया और दिशात्मक आशय दोनों को रखता है।
- source_word: וְאַתֶּם הֵאָסְרוּ
  choice: तब तक तुम हिरासत में रहो
  rationale: निफ़अल रूप बँधे या अभिरक्षा में रखे जाने को सूचित करता है। ‘हिरासत में रहो’ आधुनिक हिंदी में कारावास-सदृश अभिरक्षा का स्पष्ट अर्थ देता है; ‘तब तक’ समकालिक परिस्थिति को स्वाभाविक बनाता है।
- source_word: וְיִבָּחֲנוּ דִּבְרֵיכֶם
  choice: इस प्रकार तुम्हारी बातों की जाँच हो जाएगी
  rationale: בחן के निफ़अल का परीक्षण या जाँच किए जाने का भाव सुरक्षित है। ‘बातों’ से कथन का अर्थ आता है, बिना इसे अत्यधिक व्याख्यात्मक ‘कहानी’ बनाने के।
- source_word: הַאֱמֶת אִתְּכֶם
  choice: कि सत्य तुम्हारे साथ है या नहीं
  rationale: हिब्रू के शाब्दिक और अर्थपूर्ण मुहावरे ‘सत्य तुम्हारे साथ’ को सुरक्षित रखा गया है; हिंदी में इसका आशय समझ में आता है।
- source_word: חֵי פַרְעֹה
  choice: फ़िरौन के जीवन की शपथ
  rationale: यह फ़िरौन के जीवन को साक्षी बनाकर कही गई शपथ-विधि है। हिंदी में ‘के जीवन की शपथ’ सांस्कृतिक कार्य और गंभीरता दोनों स्पष्ट करता है।
- source_word: כִּי מְרַגְּלִים אַתֶּם
  choice: तुम निश्चय ही जासूस हो
  rationale: כִּי का यहाँ दृढ़, निष्कर्षात्मक बल ‘निश्चय ही’ से व्यक्त होता है; מְרַגְּלִים का सीधा अर्थ ‘जासूस’ है।
