  text: On the third day Joseph said to them[a], “Do this and live, for I fear God.
translation:
  language: hi
  text: तीसरे दिन यूसुफ ने उनसे कहा, “ऐसा करो और जीवित रहो,[a] क्योंकि मैं परमेश्वर का भय मानता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऐसा करो, ताकि तुम जीवित रहो”; इब्रानी में यह पहले सीधी आज्ञा और फिर उसका परिणाम, अथवा निहित उद्देश्य—दोनों व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: उनसे कहा
  rationale: אמר का यह रूप प्रत्यक्ष कथन आरम्भ करता है, और אֲלֵהֶם कथन के अप्रत्यक्ष कर्म को दिखाता है; आधुनिक हिन्दी में ‘उनसे कहा’ स्वाभाविक है।
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: इब्रानी कालवाचक पद का सहज और सटीक हिन्दी रूप।
- source_word: זֹאת עֲשׂוּ
  choice: ऐसा करो
  rationale: संकेतवाचक सर्वनाम और बहुवचन आज्ञार्थक क्रिया को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וִחְיוּ
  choice: और जीवित रहो
  rationale: आज्ञार्थक रूप की संक्षिप्तता बनाए रखता है और पहले आदेश के परिणाम अथवा उद्देश्य—दोनों सम्भव अर्थों के लिए स्थान छोड़ता है।
- source_word: אֶת הָאֱלֹהִים
  choice: परमेश्वर का
  rationale: यहाँ निश्चित रूप הָאֱלֹהִים कथा-संदर्भ में एकमात्र परमेश्वर को सूचित करता है; हिन्दी में ‘परमेश्वर का भय मानना’ स्वाभाविक पदबंध है।
- source_word: אֲנִי יָרֵא
  choice: मैं ... भय मानता हूँ
  rationale: सर्वनाम सहित विधेय कृदन्त यूसुफ के स्थायी चरित्रगत श्रद्धाभय को व्यक्त करता है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: नाम का प्रचलित मानक हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: अֶת הָאֱלֹהִים אֲנִי יָרֵא में यूसुफ की स्वीकारोक्ति का आशय
  choice: यूसुफ अपने न्यायपूर्ण और जीवनरक्षक व्यवहार के आधार के रूप में परमेश्वर के प्रति अपने श्रद्धाभय का उल्लेख करता है।
  alternative: मिस्री राजदरबार के संदर्भ में वह केवल सामान्य देव-भय का दावा करता है।
  rationale: उत्पत्ति की व्यापक कथा यूसुफ को अपने पूर्वजों के परमेश्वर के प्रति निष्ठावान दिखाती है। फिर भी मुख्य पाठ केवल ‘मैं परमेश्वर का भय मानता हूँ’ कहता है और इससे अधिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘जीवित रहो’ मूल की संक्षिप्त आज्ञार्थक संरचना और उसकी अर्थगत अस्पष्टता को बनाए रखता है।
