  yaml_path: translation/ot/genesis/042/011.yaml
  text: We are all sons of one man[a]. We are honest[b]; your servants have not been spies.
translation:
  language: hi
  text: हम सब एक ही आदमी के बेटे हैं। हम ईमानदार[a] हैं; आपके सेवक जासूस नहीं हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सच्चे,” “निष्कपट” अथवा “विश्वसनीय।” हिब्रू शब्द जासूसी के आरोप के विपरीत उन्हें सच्चा और भरोसेमंद बताता है।
    reason: lexical_alternative
  - marker: b
    text: या “आपके सेवक जासूस नहीं थे” अथवा “आपके सेवक जासूस नहीं रहे हैं।” हिब्रू रचना का अनुवाद स्थिति अथवा अतीत की गतिविधि के निषेध के रूप में किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: हम सब
  rationale: यह वक्ताओं के पूरे समूह को सम्मिलित करता है और हिब्रू के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: एक ही पुरुष के बेटे
  rationale: मूल में स्पष्ट रूप से एक पुरुष के पुत्रों की बात है; ‘एक ही’ उनके एक पिता से होने पर बल देता है।
- source_word: נָחְנוּ / אֲנַחְנוּ
  choice: हम ... हैं
  rationale: दोनों स्वतंत्र सर्वनाम बलसूचक हैं; हिन्दी में ‘हम’ को दोनों कथनों में बनाए रखने से यह बल और पुनरुक्ति स्वाभाविक रूप से प्रकट होती है।
- source_word: כֵּנִים
  choice: सच्चे
  rationale: यह आरोप के उत्तर में अपने को विश्वसनीय, निष्कपट और ईमानदार बताने वाला शब्द है; ‘सच्चे’ सरल और प्रसंगानुकूल है।
- source_word: עֲבָדֶיךָ
  choice: आपके दास
  rationale: यह शासक के सामने विनम्र आत्म-संबोधन है। ‘दास’ बाइबिलीय गरिमा और अधीनता दोनों को व्यक्त करता है, बिना यहाँ बंधुआ स्थिति को मुख्य अर्थ बनाए।
- source_word: מְרַגְּלִים
  choice: जासूस
  rationale: प्रसंग में यह गुप्त रूप से देश की टोह लेने वालों के आरोप को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא הָיוּ ... מְרַגְּלִים
  choice: जासूस नहीं रहे हैं
  rationale: היה के साथ कृदन्त उनकी स्थिति या गतिविधि का निषेध करता है; यह रूप वर्तमान आरोप के उत्तर में उनके अब तक जासूस न होने का भाव व्यक्त करता है, जबकि कालगत अस्पष्टता को पादटिप्पणी में रखा गया है।
