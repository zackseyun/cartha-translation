base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/035.yaml
  text: And as they were emptying their sacks[a], behold, each man’s bundle of silver was in his sack; and they saw their bundles of silver, they and their father[b], and they were afraid.
translation:
  language: hi
  text: जब वे अपने बोरे खाली कर रहे थे, तब उन्होंने देखा कि हर एक की चाँदी की पोटली[a] उसके बोरे में थी। तब उन्होंने और उनके पिता ने अपनी चाँदी की पोटलियाँ देखीं, और वे डर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चाँदी की थैली।” हिब्रू शब्द किसी बाँधी या लपेटी हुई वस्तु को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵם מְרִיקִים
  choice: जब वे ... खाली कर रहे थे
  rationale: हिब्रू की कथात्मक भूमिका और साथ-साथ चल रही क्रिया को स्वाभाविक आधुनिक हिन्दी के कालवाचक उपवाक्य से व्यक्त किया गया है।
- source_word: שַׂקֵּיהֶם
  choice: अपने बोरे
  rationale: שַׂק अनाज अथवा सामान रखने के बोरे को दर्शाता है; ‘बोरे’ प्राचीन वस्तु और प्रसंग दोनों के अनुकूल है।
- source_word: וְהִנֵּה
  choice: तो क्या देखते हैं कि
  rationale: यह हिन्दी कथन अचानक हुई खोज और आश्चर्य का भाव स्वाभाविक रूप से प्रकट करता है, जो הִנֵּה का कार्य है।
- source_word: אִישׁ צְרוֹר כַּסְפּוֹ
  choice: हर एक की चाँदी की पोटली
  rationale: אִישׁ का वितरणात्मक अर्थ ‘हर एक’ से और צְרוֹר का बँधी या लपेटी हुई वस्तु का अर्थ ‘पोटली’ से व्यक्त होता है; כֶּסֶף को ठोस रूप में ‘चाँदी’ रखा गया है।
- source_word: וַיִּרְאוּ אֶת צְרֹרוֹת כַּסְפֵּיהֶם הֵמָּה וַאֲבִיהֶם
  choice: उन चाँदी की पोटलियों को देखकर वे और उनके पिता
  rationale: देखने वालों में भाइयों और उनके पिता दोनों को स्पष्ट रखा गया है, साथ ही हिन्दी में भारी और अस्वाभाविक सर्वनाम-रचना से बचा गया है।
- source_word: וַיִּירָאוּ
  choice: डर गए
  rationale: कथा में खोज के फलस्वरूप उत्पन्न भय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
