    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: नीचे गए
  rationale: क्रिया ירד का मूल अर्थ ‘नीचे जाना’ है। मिस्र की ओर यात्रा के लिए प्रयुक्त भौगोलिक मुहावरे को यह सहज हिन्दी में बनाए रखता है।
- source_word: אֲחֵי יוֹסֵף
  choice: यूसुफ के ... भाई
  rationale: इब्रानी संबंधवाचक रचना का स्वाभाविक हिन्दी रूप है; संख्या के कारण ‘दस’ को ‘भाई’ से पहले रखा गया है।
- source_word: עֲשָׂרָה
  choice: दस
  rationale: यह जाने वाले भाइयों की निश्चित संख्या बताता है।
- source_word: לִשְׁבֹּר
  choice: खरीदने के लिए
  rationale: अकाल की इस कथा में שׁבר का अर्थ अनाज मोल लेना या प्राप्त करना है; ‘खरीदने’ से आशय स्पष्ट और स्वाभाविक रहता है।
- source_word: בָּר
  choice: अनाज
  rationale: यहाँ בָּר खाने योग्य अन्न को दर्शाता है; आधुनिक हिन्दी में ‘अनाज’ इसका स्पष्ट सामान्य पर्याय है।
- source_word: מִמִּצְרָיִם
  choice: मिस्र से
  rationale: पूर्वसर्ग מִן सामान्यतः स्रोत का अर्थ देता है। ‘मिस्र से’ अनाज के स्रोत को व्यक्त करते हुए इब्रानी संरचना को निकटता से सुरक्षित रखता है।
