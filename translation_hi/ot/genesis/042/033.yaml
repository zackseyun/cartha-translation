translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘घर-परिवार’ से בָּתִּים का केवल भवन नहीं, बल्कि उनमें रहने वाले परिवारों का आशय स्पष्ट होता है। प्रत्यक्ष कथन की संक्षिप्त आज्ञात्मक शैली सुरक्षित रखी गई है।
