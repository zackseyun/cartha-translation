  text: וַ/יֹּ֣אמֶר אֵלֵ֗י/נוּ הָ/אִישׁ֙ אֲדֹנֵ֣י הָ/אָ֔רֶץ בְּ/זֹ֣את אֵדַ֔ע כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֲחִי/כֶ֤ם הָֽ/אֶחָד֙ הַנִּ֣יחוּ אִתִּ֔/י וְ/אֶת רַעֲב֥וֹן בָּתֵּי/כֶ֖ם קְח֥וּ וָ/לֵֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/033.yaml
  text: 'Then the man[a], the lord of the land, said to us, ‘By this I will know that you are honest: leave one of your brothers with me, take grain for the famine of your households, and go.’'
translation:
  language: hi
  text: 'तब उस पुरुष ने, जो उस देश का स्वामी था, हमसे कहा, ‘इससे मैं जान लूँगा कि तुम ईमानदार हो: अपने भाइयों में से एक को मेरे पास छोड़ दो, अपने घर-परिवारों के अकाल के लिए अनाज[a] ले लो और चले जाओ।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “अपने घरों का अकाल ले लो।” आशय है कि वे अपने घर-परिवारों पर पड़े अकाल के लिए अनाज या भोजन-सामग्री ले जाएँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: उस पुरुष ने, जो उस देश का स्वामी है
  rationale: मूल में ‘पुरुष’ और ‘देश का स्वामी’ समानाधिकरण में हैं। हिन्दी में संबंध स्पष्ट और स्वाभाविक बनाने के लिए संबंधवाचक उपवाक्य रखा गया है।
- source_word: בְּזֹאת אֵדַע
  choice: इससे मैं जान लूँगा
  rationale: यह आगे बताए गए प्रमाण या कसौटी के आधार पर होने वाले निष्कर्ष को व्यक्त करता है; ‘जान लूँगा’ इसकी भावी और परिणामसूचक शक्ति को सहज हिन्दी में रखता है।
- source_word: כֵנִים
  choice: ईमानदार
  rationale: इस प्रसंग में शब्द ऐसे लोगों को बताता है जो छल नहीं कर रहे और जासूस नहीं हैं। ‘ईमानदार’ आधुनिक हिन्दी में इस सामाजिक और न्यायिक आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲחִיכֶם הָאֶחָד
  choice: अपने भाइयों में से एक
  rationale: इब्रानी पद समूह में से किसी एक भाई को अलग करता है; यह हिन्दी में उसका स्पष्ट और स्वाभाविक रूप है।
- source_word: הַנִּיחוּ אִתִּי
  choice: मेरे पास छोड़ दो
  rationale: हिफ़ील क्रिया यहाँ किसी को अपने साथ रहने के लिए छोड़ने का अर्थ देती है।
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: अपने घर-परिवारों के अकाल के लिए अनाज
  rationale: मूल अभिव्यक्ति संक्षिप्त और असामान्य है। निकटवर्ती प्रसंग में मिस्र से अनाज ले जाने की बात होने के कारण ‘अनाज’ स्पष्ट किया गया है, जबकि मूल शब्दावली की जानकारी पादटिप्पणी में सुरक्षित है।
- source_word: קְחוּ וָלֵכוּ
  choice: ले लो और चले जाओ
  rationale: दोनों आज्ञार्थक क्रियाओं का सरल क्रम और सीधा बल बनाए रखा गया है।
