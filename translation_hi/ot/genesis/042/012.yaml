  text: पर उसने उनसे कहा, “नहीं, बल्कि तुम देश की नग्नता[a] देखने[b] आए हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात देश के खुले या असुरक्षित हिस्से। इब्रानी में शाब्दिक रूप से “देश की नग्नता” है—ऐसे कमज़ोर क्षेत्र जिनका शत्रु या जासूस लाभ उठा सकता था।
    reason: lexical_alternative
  - marker: b
    text: या “की टोह लेने।” इब्रानी क्रिया का शाब्दिक अर्थ “देखना” है, पर प्रसंग में यूसुफ उन पर जासूसी के लिए जानकारी जुटाने का आरोप लगा रहा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: पर उसने उनसे कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, पर पिछले पद में भाइयों के इनकार के उत्तर में यहाँ विरोध का भाव है; इसलिए स्वाभाविक हिन्दी में ‘पर’ उपयुक्त है।
- source_word: לֹא כִּי
  choice: नहीं, बल्कि
  rationale: यह भाइयों के दावे का स्पष्ट खंडन करके उसके स्थान पर आरोप रखता है। ‘नहीं, बल्कि’ इस सुधारात्मक-विरोधी बल को सहज हिन्दी में व्यक्त करता है।
- source_word: עֶרְוַת הָאָרֶץ
  choice: देश की नग्नता
  rationale: इब्रानी में शाब्दिक रूप से ‘देश की नग्नता’ है, जो उसके खुले या असुरक्षित क्षेत्रों का रूपक है। मुख्य पाठ में मूल बिंब सुरक्षित रखा गया है और अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בָּאתֶם
  choice: तुम ... आए हो
  rationale: पूर्ण क्रिया उनके आने के वर्तमान उद्देश्य पर आरोप लगाती है; हिन्दी का पूर्ण वर्तमान ‘आए हो’ इस प्रासंगिकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִרְאוֹת
  choice: देखने
  rationale: मूल क्रिया का सामान्य अर्थ ‘देखना’ है। प्रसंग में टोह लेने या जासूसी का भाव है, पर मूल ने यहाँ विशिष्ट ‘जासूसी करना’ वाली क्रिया का प्रयोग नहीं किया; इसलिए मूल शब्दावली रखकर वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
