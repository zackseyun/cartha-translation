lexical_decisions:
- source_word: וְהֵם
  choice: पर वे
  rationale: संयोजक और सर्वनाम पिछले प्रसंग से विरोध दिखाते हैं; आधुनिक हिन्दी में ‘पर वे’ इस कथात्मक विरोध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֹא יָדְעוּ
  choice: नहीं जानते थे
  rationale: यहाँ ידע का पूर्ण रूप उनकी उस समय की अनभिज्ञता बताता है; ‘नहीं जानते थे’ सीधा और सहज अनुवाद है।
- source_word: כִּי
  choice: कि
  rationale: पहला כִּי उस बात को प्रस्तुत करता है जिससे वे अनजान थे।
- source_word: שֹׁמֵעַ
  choice: उनकी बातें समझ रहा है
  rationale: שׁמע का मूल अर्थ सुनना है, पर दुभाषिए वाले प्रसंग में आशय यह है कि यूसुफ उनकी भाषा में कही बातें समझ सकता था। ‘उनकी बातें समझ रहा है’ उस प्रसंगगत अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: כִּי
  choice: क्योंकि
  rationale: दूसरा כִּי उनकी अनभिज्ञता का कारण प्रस्तुत करता है।
- source_word: הַמֵּלִיץ
  choice: एक दुभाषिया
  rationale: इस प्रसंग में यह शब्द दो अलग भाषाएँ बोलने वाले पक्षों के बीच वाणी का अर्थ पहुँचाने वाले व्यक्ति को सूचित करता है। हिन्दी में ‘दुभाषिया’ सटीक और स्वाभाविक है।
- source_word: בֵּינֹתָם
  choice: उनके बीच
  rationale: यह यूसुफ और उसके भाइयों के बीच दुभाषिए की मध्यस्थ भूमिका को व्यक्त करता है।
