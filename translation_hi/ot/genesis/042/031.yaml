lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: और हमने कहा
  rationale: वय्यिक्तोल रूप कथा में अगली घटना को आगे बढ़ाता है; ‘और हमने कहा’ सरल कथात्मक क्रम को बनाए रखता है।
- source_word: אֵלָיו
  choice: उससे
  rationale: אֶל के तृतीय पुरुष एकवचन प्रत्यय का स्वाभाविक हिन्दी रूप ‘उससे’ है।
- source_word: כֵּנִים
  choice: ईमानदार लोग
  rationale: यहाँ शब्द भाइयों को जासूसी के आरोप के विपरीत सच्चा और भरोसेमंद बताता है; ‘ईमानदार लोग’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֲנָחְנוּ
  choice: हम
  rationale: स्वतंत्र सर्वनाम कर्ता पर बल देता है; हिन्दी वाक्य में ‘हम’ इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא הָיִינוּ מְרַגְּלִים
  choice: हम जासूस नहीं थे
  rationale: नकारयुक्त היה और कृदंत अतीत की स्थिति या गतिविधि को व्यक्त करते हैं। ‘हम जासूस नहीं थे’ व्यक्ति-संज्ञा वाले अर्थ को सहज हिन्दी में रखते हुए अतीत काल भी सुरक्षित रखता है।
