    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब वे ... आए
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ क्रमिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: अपने पिता याकूब के पास
  rationale: אֶל दिशा को और אֲבִיהֶם संबंध को व्यक्त करता है; हिन्दी में यह पदक्रम स्वाभाविक है।
- source_word: אַרְצָה כְּנָעַן
  choice: कनान देश में
  rationale: दिशासूचक रूप का शाब्दिक अर्थ ‘कनान देश को/की ओर’ है, पर याकूब के पास आने के साथ हिन्दी में ‘कनान देश में’ गंतव्य का स्थान स्वाभाविक ढंग से बताता है। शाब्दिक रचना पादटिप्पणी में दी गई है।
- source_word: וַיַּגִּידוּ לוֹ
  choice: और उन्हें ... बताया
  rationale: हिफ़िल נגד का अर्थ यहाँ सूचना देना या वृत्तांत सुनाना है; आदरसूचक ‘उन्हें’ पिता के लिए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֵת כָּל הַקֹּרֹת אֹתָם
  choice: वह सब ... जो उनके साथ हुआ था
  rationale: קרה का स्त्रीलिंग बहुवचन कृदंत उन घटनाओं को दर्शाता है जो उन पर घटीं; यह हिन्दी अभिव्यक्ति अर्थ और पूर्वकालिकता दोनों स्पष्ट करती है।
- source_word: לֵאמֹר
  choice: उन्होंने कहा,
  rationale: यह अगले पद में आने वाले प्रत्यक्ष कथन का परिचय देता है; हिन्दी में अलग वाक्य के रूप में ‘उन्होंने कहा,’ अधिक सहज है।
