  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֶת בִּנְיָמִין֙ אֲחִ֣י יוֹסֵ֔ף לֹא שָׁלַ֥ח יַעֲקֹ֖ב אֶת אֶחָ֑י/ו כִּ֣י אָמַ֔ר פֶּן יִקְרָאֶ֖/נּוּ אָסֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/004.yaml
  text: But Jacob did not send Benjamin[a], Joseph’s brother, with his brothers, for he said, “Lest harm happen to him.”
translation:
  language: hi
  text: परन्तु याकूब ने यूसुफ के भाई बिन्यामीन को उसके भाइयों के साथ नहीं भेजा, क्योंकि उसने कहा, “कहीं ऐसा न हो कि उस पर कोई विपत्ति आ पड़े।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: परन्तु
  rationale: संयोजक पिछले पद से जोड़ता है और दूसरे भाइयों के जाने के विपरीत बिन्यामीन के न भेजे जाने का भाव प्रकट करता है; कर्मसूचक אֶת का अलग अनुवाद नहीं किया गया।
- source_word: בִּנְיָמִין
  choice: बिन्यामीन
  rationale: हिन्दी बाइबलीय परम्परा में प्रचलित और इब्रानी नाम के निकट रूप।
- source_word: אֲחִי יוֹסֵף
  choice: यूसुफ के भाई
  rationale: सम्बन्धवाचक पदबंध बिन्यामीन की पहचान यूसुफ के साथ उसके पारिवारिक सम्बन्ध से कराता है।
- source_word: לֹא שָׁלַח
  choice: नहीं भेजा
  rationale: שׁלח का सामान्य कथात्मक अर्थ ‘भेजना’ है।
- source_word: אֶת אֶחָיו
  choice: उसके भाइयों के साथ
  rationale: सन्दर्भ स्पष्ट करता है कि बिन्यामीन को अन्य भाइयों के साथ नहीं भेजा गया; हिन्दी में ‘के साथ’ इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי אָמַר
  choice: क्योंकि उसने कहा
  rationale: כִּי कारण बताता है और אָמַר का स्पष्ट अर्थ ‘कहा’ है; इसे ‘सोचा’ बनाना अनावश्यक व्याख्या होती।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह आशंकित सम्भावना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִקְרָאֶנּוּ
  choice: उस पर ... आ पड़े
  rationale: אָסוֹן के साथ यह मुहावरा किसी अनिष्ट के घटने या व्यक्ति पर आ पड़ने का अर्थ देता है।
- source_word: אָסוֹן
  choice: कोई विपत्ति
  rationale: शब्द गम्भीर अनिष्ट, दुर्घटना या विपत्ति को सूचित करता है; ‘विपत्ति’ किसी एक प्रकार की हानि को अनावश्यक रूप से निश्चित नहीं करती।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परन्तु’ कथात्मक विरोध को और ‘कहीं ऐसा न हो कि’ याकूब की आशंका को स्पष्ट करता है। किसी पादटिप्पणी की आवश्यकता नहीं है।
