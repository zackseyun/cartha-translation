base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/014.yaml
  text: Joseph said to them[a], “It is as I said to you, saying[b], ‘You are spies.’”
translation:
  language: hi
  text: 'यूसुफ ने उनसे कहा, “बात वही है जो मैंने तुमसे कही थी: ‘तुम जासूस हो।’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने…कहा
  rationale: हिब्रू कथात्मक क्रिया का स्वाभाविक हिन्दी भूतकालीन रूप; आरम्भिक संयोजक को हिन्दी कथा-प्रवाह में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: אֲלֵהֶם
  choice: उनसे
  rationale: यूसुफ के सम्बोधन को आधुनिक और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: इस इब्रानी नाम का हिन्दी बाइबल परम्परा में प्रचलित रूप।
- source_word: הוּא אֲשֶׁר
  choice: बात वही है जो
  rationale: इस बलाघाती सम्बन्धवाचक संरचना का जोर बनाए रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति देता है।
- source_word: דִּבַּרְתִּי אֲלֵכֶם
  choice: मैंने तुमसे कही थी
  rationale: पूर्व में कही गई बात का संकेत है; स्त्रीलिंग क्रिया ‘कही’ का सम्बन्ध हिन्दी वाक्य में ‘बात’ से है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे उद्धृत कथन का परिचय देता है; हिन्दी में द्विबिन्दु उसी कार्य को बिना अनावश्यक ‘यह कहते हुए’ दोहराव के स्वाभाविक रूप से निभाता है।
- source_word: מְרַגְּלִים
  choice: जासूस
  rationale: भूमि या परिस्थिति की गुप्त जाँच करने वालों के लिए स्पष्ट, वर्तमान और व्यापक रूप से समझा जाने वाला हिन्दी शब्द।
- source_word: אַתֶּם
  choice: तुम…हो
  rationale: स्वतन्त्र बहुवचन सर्वनाम और विधेय कृदन्त की संरचना को स्वाभाविक हिन्दी वाक्य में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बात वही है’ मूल के बल को सुरक्षित रखता है, जबकि द्विबिन्दु לֵאמֹר के उद्धरण-परिचायक कार्य को स्वाभाविक हिन्दी विराम-चिह्न से व्यक्त करता है।
