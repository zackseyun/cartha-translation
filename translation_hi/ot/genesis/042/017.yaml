translation:
  language: hi
  text: और उसने उन्हें तीन दिन तक हिरासत में रखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: रखा
  rationale: אָסַף का मूल अर्थ ‘इकट्ठा करना’ है, पर אֶל מִשְׁמָר के साथ यह किसी को पहरे या हिरासत में रखने का मुहावरेदार अर्थ देता है। हिंदी में ‘हिरासत में रखा’ स्वाभाविक और सटीक है।
- source_word: אֹתָם
  choice: उन सबको
  rationale: यह पुल्लिंग बहुवचन कर्मवाचक सर्वनाम यूसुफ के भाइयों की ओर संकेत करता है। ‘उन सबको’ समूह के प्रत्येक व्यक्ति के सम्मिलित होने को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: אֶל מִשְׁמָר
  choice: हिरासत में
  rationale: מִשְׁמָר पहरे में रखे जाने की जगह या अवस्था को दर्शाता है। ‘हिरासत’ पर्याप्त व्यापक है और इसे अनावश्यक रूप से औपचारिक कारागार नहीं बनाता; אֶל से निहित उस अवस्था में प्रवेश हिंदी के ‘में रखा’ में व्यक्त होता है।
- source_word: שְׁלֹשֶׁת יָמִים
  choice: तीन दिन तक
  rationale: यह अवधि बताने वाला पद है। आधुनिक हिंदी में ‘तीन दिन तक’ समय की पूरी अवधि को सहज ढंग से व्यक्त करता है।
