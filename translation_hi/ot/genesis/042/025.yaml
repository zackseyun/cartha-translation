  text: וַ/יְצַ֣ו יוֹסֵ֗ף וַ/יְמַלְא֣וּ אֶת כְּלֵי/הֶם֮ בָּר֒ וּ/לְ/הָשִׁ֤יב כַּסְפֵּי/הֶם֙ אִ֣ישׁ אֶל שַׂקּ֔/וֹ וְ/לָ/תֵ֥ת לָ/הֶ֛ם צֵדָ֖ה לַ/דָּ֑רֶךְ וַ/יַּ֥עַשׂ לָ/הֶ֖ם כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/025.yaml
  text: Then Joseph gave orders to fill their containers with grain[a], to return each man's silver to his sack, and to give them provisions for the journey[d][c][b]. And so it was done for them.
translation:
  language: hi
  text: तब यूसुफ ने आज्ञा दी कि उनके पात्रों को अनाज से भर दिया जाए,[a] हर एक की चाँदी उसके बोरे में लौटा दी जाए,[b] और उन्हें यात्रा के लिए भोजन-सामग्री दी जाए। उनके लिए वैसा ही किया गया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके बरतनों को”; यहाँ प्रयुक्त इब्रानी शब्द व्यापक है और आगे ‘बोरे’ के लिए आए शब्द से अलग है।
    reason: lexical_alternative
  - marker: b
    text: “चाँदी” से यहाँ धन या भुगतान की रकम अभिप्रेत है।
    reason: lexical_alternative
  - marker: c
    text: या, “और उसने उनके लिए वैसा ही किया।” इब्रानी में कर्ता स्पष्ट रूप से बताया नहीं गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: यह क्रिया किसी काम को करने का आदेश देने को व्यक्त करती है; इसके बाद आए अप्रत्यक्ष आदेशों के साथ ‘आज्ञा दी कि’ स्वाभाविक और गरिमापूर्ण है।
- source_word: כְּלֵיהֶם
  choice: उनके पात्रों
  rationale: כְּלִי व्यापक अर्थ वाला शब्द है, इसलिए ‘पात्र’ चुना गया है; आगे प्रयुक्त שַׂק के लिए ‘बोरा’ रखकर दोनों इब्रानी शब्दों का भेद बचाया गया है।
- source_word: בָּר
  choice: अनाज
  rationale: अकाल और मिस्र के प्रसंग में यह सामान्य रूप से अन्न-धान्य को दर्शाता है; किसी एक विशेष फ़सल का अर्थ लगाना अनावश्यक होगा।
- source_word: כַּסְפֵּיהֶם
  choice: उनकी चाँदी
  rationale: כֶּסֶף का शाब्दिक अर्थ ‘चाँदी’ है और प्रसंग में वह धन के रूप में प्रयुक्त है; ‘चाँदी’ कथा की ठोस शब्दावली को बनाए रखती है।
- source_word: אִישׁ אֶל שַׂקּוֹ
  choice: हर एक की चाँदी उसके बोरे में
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ में ‘हर एक’ है और שַׂק विशेष रूप से बोरे को दर्शाता है। वाक्य में ‘चाँदी’ दोहराकर हिन्दी अर्थ स्पष्ट किया गया है।
- source_word: צֵדָה לַדָּרֶךְ
  choice: यात्रा के लिए भोजन-सामग्री
  rationale: צֵדָה मार्ग के लिए साथ दी जाने वाली खाद्य-सामग्री या रसद है; ‘भोजन-सामग्री’ सामान्य पाठक के लिए स्पष्ट है और प्रसंगानुकूल अर्थ व्यक्त करती है।
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: उनके लिए वैसा ही किया गया
  rationale: इब्रानी में क्रिया एकवचन है, पर कर्ता स्पष्ट नहीं है। हिन्दी का कर्मवाच्य आदेश के पालन पर ध्यान रखता है और किसी अनुल्लिखित व्यक्ति को कर्ता नहीं बनाता।
