source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו אֲבָל֮ אֲשֵׁמִ֣ים אֲנַחְנוּ֮ עַל אָחִי/נוּ֒ אֲשֶׁ֨ר רָאִ֜ינוּ צָרַ֥ת נַפְשׁ֛/וֹ בְּ/הִתְחַֽנְנ֥/וֹ אֵלֵ֖י/נוּ וְ/לֹ֣א שָׁמָ֑עְנוּ עַל כֵּן֙ בָּ֣אָה אֵלֵ֔י/נוּ הַ/צָּרָ֖ה הַ/זֹּֽאת־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/021.yaml
  text: Then they said to one another[a], “Indeed, we are guilty concerning our brother, because we saw the distress of his soul when he pleaded with us, and we did not listen[b]. Therefore this distress has come upon us.”
translation:
  language: hi
  text: तब वे आपस में कहने लगे, “निश्चय ही हम अपने भाई के विषय में दोषी हैं, क्योंकि जब वह हमसे विनती कर रहा था, तब हमने उसकी पीड़ा देखी, पर उसकी बात नहीं सुनी। इसलिए यह पीड़ा[a] हम पर आ पड़ी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यूसुफ की ‘पीड़ा’ और भाइयों पर आई इस ‘पीड़ा’ के लिए एक ही शब्द के अलग रूप प्रयुक्त हैं; इससे उसकी पिछली पीड़ा और उनकी वर्तमान पीड़ा के बीच संबंध उभरता है।
    reason: lexical_wordplay
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: तब वे आपस में कहने लगे
  rationale: इब्रानी पारस्परिक मुहावरे का स्वाभाविक हिन्दी रूप; कथात्मक וַ को प्रसंगानुसार ‘तब’ से व्यक्त किया गया है।
- source_word: אֲבָל אֲשֵׁמִים אֲנַחְנוּ עַל־אָחִינוּ
  choice: निश्चय ही हम अपने भाई के विषय में दोषी हैं
  rationale: אֲבָל यहाँ विरोध नहीं, बल्कि गंभीर और जोरदार स्वीकारोक्ति दर्शाता है; ‘दोषी’ नैतिक उत्तरदायित्व को स्पष्ट रखता है।
- source_word: צָרַת נַפְשׁוֹ
  choice: उसके मन की व्यथा
  rationale: शाब्दिक अर्थ ‘उसके प्राण/जीवन की व्यथा’ है। हिन्दी में ‘मन की व्यथा’ गहरी व्यक्तिगत पीड़ा को स्वाभाविक ढंग से व्यक्त करता है, बिना ‘आत्मा’ के अनपेक्षित दार्शनिक अर्थ जोड़े।
- source_word: בְּהִתְחַנְנוֹ אֵלֵינוּ
  choice: जब उसने हमसे विनती की
  rationale: हित्पाएल रूप आग्रहपूर्ण याचना बताता है; ‘दया की’ जैसे अव्यक्त कर्म को पाठ में जोड़े बिना ‘विनती की’ इसे संप्रेषित करता है।
- source_word: וְלֹא שָׁמָעְנוּ
  choice: फिर भी उसकी बात नहीं सुनी
  rationale: שׁמע यहाँ केवल ध्वनि सुनना नहीं, बल्कि ध्यान देना या मानना है; हिन्दी मुहावरा ‘बात नहीं सुनी’ इसी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּאָה אֵלֵינוּ הַצָּרָה הַזֹּאת
  choice: यह विपत्ति हम पर आ पड़ी है
  rationale: हिन्दी में वर्तमान संकट के लिए स्वाभाविक कथन। ‘आ पड़ी’ इब्रानी ‘हम तक आई’ की आपदात्मक शक्ति को बनाए रखता है।
theological_decisions:
- issue: भाइयों द्वारा वर्तमान विपत्ति को अपने पुराने अपराध का परिणाम मानना
  choice: इसे पात्रों की प्रत्यक्ष स्वीकारोक्ति और निष्कर्ष के रूप में यथावत रखा गया
  alternative: इसे कथावाचक की ओर से दैवी दंड की स्पष्ट घोषणा बनाना
  rationale: इब्रानी पाठ में यह भाइयों का अपना कथन है; पद स्वयं स्पष्ट रूप से परमेश्वर को कर्ता नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘मन की व्यथा’ सामान्य पाठक के लिए स्वाभाविक है; शब्द-संबंध मुख्य पाठ में कृत्रिम पुनरावृत्ति से बचाते हुए पाद-टिप्पणी में सुरक्षित रखा गया है।
