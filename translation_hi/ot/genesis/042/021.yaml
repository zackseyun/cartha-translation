  naturalness: The revised wording is idiomatic modern standard Hindi and keeps the solemn narrative register. ‘उसकी बात नहीं सुनी’ naturally communicates refusal to heed, not merely failure to hear.
  terminology: ‘दोषी’ appropriately renders אשמים. ‘पीड़ा’ is used for both Joseph’s distress and the brothers’ present distress, with a footnote identifying the Hebrew wordplay without imposing a theological interpretation.
