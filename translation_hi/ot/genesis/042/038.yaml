source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹֽא יֵרֵ֥ד בְּנִ֖/י עִמָּ/כֶ֑ם כִּֽי אָחִ֨י/ו מֵ֜ת וְ/ה֧וּא לְ/בַדּ֣/וֹ נִשְׁאָ֗ר וּ/קְרָאָ֤/הוּ אָסוֹן֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וְ/הוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/יָג֖וֹן שְׁאֽוֹלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/038.yaml
  text: But he said[a], “My son will not go down with you, because his brother is dead, and he alone is left. If harm should happen to him on the journey on which you go[b], then you would bring my gray hair down to Sheol in sorrow.”
translation:
  language: hi
  text: पर उसने कहा, “मेरा बेटा तुम्हारे साथ नीचे नहीं जाएगा, क्योंकि उसका भाई मर चुका है और वही अकेला बचा है। यदि उसके साथ उस रास्ते पर कोई अनहोनी हो जाए जिस पर तुम जाओगे, तो तुम मेरे पके बालों को शोक में शेओल[a] में उतार दोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “शेओल” इब्रानी शब्द है, जो मृतकों के लोक का संकेत कर सकता है; प्रसंग में इसका अनुवाद “कब्र” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: नीचे नहीं जाएगा
  rationale: कनान से मिस्र की यात्रा के लिए प्रयुक्त ‘नीचे जाना’ की भौगोलिक और कथात्मक अभिव्यक्ति को बनाए रखता है।
- source_word: בְּנִי
  choice: मेरा बेटा
  rationale: पुत्रवाचक इब्रानी पद और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय का सीधा, स्वाभाविक अनुवाद।
- source_word: אָחִיו מֵת
  choice: उसका भाई मर चुका है
  rationale: याकूब की दृष्टि में यूसुफ की मृत्यु की वर्तमान परिणामी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְבַדּוֹ נִשְׁאָר
  choice: अब वही अकेला बचा है
  rationale: לְבַדּוֹ के बलाघात और बिन्यामीन के अकेले शेष रहने का भाव सुरक्षित रहता है; ‘अब’ प्रसंगगत स्थिति को सहज बनाता है।
- source_word: וּקְרָאָהוּ אָסוֹן
  choice: यदि ... उसके साथ कोई अनहोनी हो गई
  rationale: इब्रानी समन्वयी रचना के प्रसंगगत शर्तार्थ और אָסוֹן के गंभीर दुर्भाग्य/हानि के व्यापक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: जिस रास्ते से तुम जाओगे ... उस पर
  rationale: ‘रास्ता’ की ठोस छवि और संबंधवाचक इब्रानी रचना दोनों को आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: וְהוֹרַדְתֶּם
  choice: तुम ... पहुँचा दोगे
  rationale: हिफ़ील का कारणवाचक परिणाम व्यक्त करता है; हिन्दी में ‘अधोलोक पहुँचा देना’ अधिक स्वाभाविक है, जबकि नीचे जाने का भाव ‘अधोलोक’ में निहित है।
- source_word: שֵׂיבָתִי
  choice: मेरे पके बालों को
  rationale: बुढ़ापे के लिए प्रयुक्त मूल की मूर्त और भावपूर्ण छवि को बनाए रखता है।
- source_word: בְּיָגוֹן
  choice: शोक में
  rationale: गहरे दुःख की अवस्था को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: שְׁאֹלָה
  choice: अधोलोक
  rationale: शेओल को केवल भौतिक कब्र तक सीमित किए बिना मृतकों के लोक की धारणा व्यक्त करता है; पाठक-सहायता हेतु पादटिप्पणी दी गई है।
theological_decisions:
- issue: שְׁאֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक; शेओल
  rationale: मूल पद का अर्थ हर प्रसंग में केवल भौतिक कब्र नहीं है। ‘अधोलोक’ उसकी व्यापकता और जानबूझकर बनी हुई अवधारणात्मक अस्पष्टता को काफी हद तक सुरक्षित रखता है, जबकि पादटिप्पणी मूल इब्रानी नाम बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण पर सामान्य पाठक के लिए सहज है। ‘नीचे नहीं जाएगा’ मूल की भौगोलिक भाषा को और ‘पके बाल’ उसकी मूर्त भावात्मक छवि को सुरक्षित रखते हैं। स्रोत में दिए अंग्रेज़ी पादटिप्पणी-चिह्नों और उनकी सामग्री में असंगति थी, इसलिए हिन्दी मसौदे में केवल שְׁאֹל की वास्तविक व्याख्यात्मक आवश्यकता पर [a] रखा गया है।
