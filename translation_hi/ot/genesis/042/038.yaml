    rationale: The Hebrew deliberately repeats the downward-motion imagery used earlier in the verse. 'उतार दोगे' preserves this image and is idiomatic in Hindi with the concrete expression 'मेरे पके बालों को.'
  - severity: low
    issue: The placement and syntax of the conditional road clause are awkward in Hindi.
    rationale: Reordering it as 'यदि उसके साथ उस रास्ते पर कोई अनहोनी हो जाए जिस पर तुम जाओगे' reads naturally while retaining the source relationship between the harm and the route.
