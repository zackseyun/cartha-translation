source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ שְׁנֵ֣ים עָשָׂר֩ עֲבָדֶ֨י/ךָ אַחִ֧ים אֲנַ֛חְנוּ בְּנֵ֥י אִישׁ אֶחָ֖ד בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנֵּ֨ה הַ/קָּטֹ֤ן אֶת אָבִ֨י/נוּ֙ הַ/יּ֔וֹם וְ/הָ/אֶחָ֖ד אֵינֶֽ/נּוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/013.yaml
  text: And they said[a], “We, your servants, are twelve brothers, sons of one man in the land of Canaan. And behold, the youngest is with our father today, and one is no more.”
translation:
  language: hi
  text: तब उन्होंने कहा, “हम, आपके सेवक, बारह भाई हैं—कनान देश में रहने वाले एक ही पुरुष के पुत्र। और देखिए, सबसे छोटा आज हमारे पिता के साथ है, और एक नहीं है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “और एक नहीं है।” यह एक शिष्टोक्ति है, जिसका अर्थ “वह चला गया है” हो सकता है या जो उसकी मृत्यु की ओर संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब उन्होंने कहा
  rationale: वय्यिक्तोल कथानक की अगली क्रिया को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक कथात्मक क्रम व्यक्त करता है।
- source_word: עֲבָדֶיךָ
  choice: आपके दास
  rationale: यहाँ वक्ता मिस्री शासक के सामने आदरसूचक आत्म-विनय प्रकट करते हैं; शब्द को वास्तविक दासत्व का कथन बनाए बिना मूल पदावली बनाए रखी गई है।
- source_word: שְׁנֵים עָשָׂר ... אַחִים אֲנַחְנוּ
  choice: हम ... बारह भाई हैं
  rationale: भाइयों की पहचान और संख्या दोनों को स्पष्ट, स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: एक ही पुरुष के पुत्र
  rationale: ‘पुत्र’ मूल के पुल्लिंग संबंध को बनाए रखता है और ‘एक ही’ साझा पिता पर दिए गए बल को व्यक्त करता है।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश में रहनेवाले
  rationale: ‘देश’ मूल के אֶרֶץ को दर्शाता है; ‘रहनेवाले’ हिन्दी में इस संबंध को स्पष्ट और सहज बनाता है कि पिता कनान देश में है।
- source_word: וְהִנֵּה
  choice: और देखिए
  rationale: הִנֵּה के प्रस्तुतिकरण और ध्यान आकर्षित करने वाले बल को आधुनिक सम्मानसूचक हिन्दी में व्यक्त करता है।
- source_word: הַקָּטֹן
  choice: सबसे छोटा
  rationale: पारिवारिक संदर्भ में यह सबसे छोटे भाई को सूचित करता है; हिन्दी में यही स्वाभाविक अभिव्यक्ति है।
- source_word: אֶת אָבִינוּ
  choice: हमारे पिता के साथ है
  rationale: אֶת यहाँ संगति दर्शाता है, कर्म-चिह्न नहीं; ‘के साथ’ उसी अर्थ को स्पष्ट करता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: प्रत्यक्ष कालवाचक अर्थ को यथावत रखा गया है।
- source_word: וְהָאֶחָד אֵינֶנּוּ
  choice: और एक अब नहीं रहा
  rationale: मूलतः ‘एक नहीं है’ अनुपस्थिति या अनुमानित मृत्यु का शिष्टोक्तिपूर्ण संकेत है; ‘अब नहीं रहा’ उस तनाव को कुछ हद तक बनाए रखता है और मृत्यु को अत्यधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: लिंग-विशिष्ट पारिवारिक भाषा
  choice: एक ही पुरुष के पुत्र
  alternative: एक ही व्यक्ति की संतानें
  rationale: मूल पाठ पुल्लिंग रूपों में याकूब के पुरुष वंशजों की बात करता है; इसलिए लिंग-निरपेक्ष रूप से इसे सामान्यीकृत नहीं किया गया।
- issue: यूसुफ की स्थिति संबंधी अस्पष्टता
  choice: एक अब नहीं रहा
  alternative: एक मर चुका है
  rationale: भाई सीधे मृत्यु घोषित नहीं करते; वे ‘नहीं है’ जैसी शिष्टोक्ति बोलते हैं। अनुवाद अनुपस्थिति और अनुमानित मृत्यु के बीच मूल तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। यूसुफ की स्थिति को मृत्यु का स्पष्ट कथन बनाकर मूल अस्पष्टता समाप्त नहीं की गई।
