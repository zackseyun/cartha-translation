source:
  edition: WLC
  text: וַ/יַּ֣רְא יַעֲקֹ֔ב כִּ֥י יֶשׁ שֶׁ֖בֶר בְּ/מִצְרָ֑יִם וַ/יֹּ֤אמֶר יַעֲקֹב֙ לְ/בָנָ֔י/ו לָ֖/מָּה תִּתְרָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/001.yaml
  text: When Jacob saw that there was grain in Egypt[a], Jacob said to his sons, “Why do you keep looking at one another?”
translation:
  language: hi
  text: जब याकूब ने देखा कि मिस्र में अनाज उपलब्ध है, तो उसने अपने बेटों से कहा, “तुम एक-दूसरे का मुँह क्यों ताक रहे हो?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम अपने आपको क्यों दिखा रहे हो?” इब्रानी क्रिया के अर्थ को अलग तरह से भी समझा जा सकता है, पर इस प्रसंग में सम्भवतः भाई हिचकिचाते हुए एक-दूसरे का मुँह ताक रहे थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: जब ... ने देखा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘जब’ अगले कथन के साथ कालगत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי יֶשׁ
  choice: कि ... उपलब्ध है
  rationale: כִּי याकूब के जानने की विषय-वस्तु प्रस्तुत करता है और יֵשׁ उपलब्धता बताता है; अकाल और खरीद के प्रसंग में ‘उपलब्ध है’ केवल अस्तित्व से अधिक स्पष्ट है।
- source_word: שֶׁבֶר
  choice: अनाज
  rationale: यूसुफ-वृत्तांत में यह अकाल के समय बिक्री के लिए उपलब्ध अन्न को सूचित करता है।
- source_word: בְּמִצְרָיִם
  choice: मिस्र में
  rationale: स्थानसूचक בְּ का मानक हिन्दी रूप।
- source_word: לְבָנָיו
  choice: अपने बेटों से
  rationale: यहाँ בָּנִים याकूब के पुरुष वंशजों को सूचित करता है; हिन्दी में कथन के साथ ‘से’ स्वाभाविक है।
- source_word: לָמָּה
  choice: क्यों
  rationale: प्रत्यक्ष प्रश्नवाचक अर्थ को सरल रूप में सुरक्षित रखता है।
- source_word: תִּתְרָאוּ
  choice: एक-दूसरे का मुँह ... ताक रहे हो
  rationale: हित्पएल रूप को प्रसंगानुसार पारस्परिक और हिचकिचाहट-भरी निष्क्रियता के रूप में व्यक्त करने वाला स्वाभाविक हिन्दी मुहावरा है।
theological_decisions: []
