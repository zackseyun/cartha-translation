  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मुँह ताकना’ स्वाभाविक हिन्दी मुहावरा है और भाइयों की निष्क्रिय हिचकिचाहट व्यक्त करता है; पाद-टिप्पणी मूल क्रिया की वास्तविक शाब्दिक अस्पष्टता सुरक्षित रखती है।
