  yaml_path: translation/ot/genesis/042/036.yaml
  text: 'And Jacob their father said to them[a], “You have bereaved me: Joseph is no more, and Simeon is no more, and you would take Benjamin[b]. All these things have come against me.”'
translation:
  language: hi
  text: तब उनके पिता याकूब ने उनसे कहा, “तुमने मुझे पुत्र-वियोगी कर दिया है[a]। यूसुफ नहीं रहा, शिमोन भी नहीं रहा, और अब तुम बिन्यामीन को भी ले जाना चाहते हो। ये सब मेरे ही विरुद्ध आ पड़े हैं[b]।”
  philosophy: optimal-equivalence
