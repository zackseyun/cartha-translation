  rationale: यह चयन घटनाओं के संचयी बोझ और עָלַי के प्रतिकूल भाव दोनों को बनाए रखता है।
- source_word: אֹתִי
  choice: मुझे
  rationale: हिब्रू में कर्म का अग्रस्थान याकूब पर पड़े आघात को उभारता है; हिंदी में ‘मुझे’ इसे स्पष्ट रखता है।
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: उनके पिता याकूब
  rationale: यह आधुनिक हिंदी में स्वाभाविक है और याकूब का पुत्रों से संबंध स्पष्ट रखता है।
