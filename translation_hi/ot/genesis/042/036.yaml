- source_word: תִּקָּחוּ
  choice: ले जाना चाहते हो
  rationale: अपूर्ण रूप संदर्भ में प्रस्तावित या अभिप्रेत आगामी कार्य पर याकूब की आपत्ति व्यक्त करता है; यह हिंदी में सामान्य भविष्यकाल की अपेक्षा प्रसंग को अधिक स्वाभाविक ढंग से दर्शाता है।
- source_word: עָלַי הָיוּ כֻלָּנָה
