base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/022.yaml
  text: Then Reuben answered them, saying, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now, look, his blood is being required.”
translation:
  language: hi
  text: तब रूबेन ने उन्हें उत्तर दिया, “क्या मैंने तुमसे नहीं कहा था, ‘उस लड़के के विरुद्ध पाप मत करो’? पर तुमने नहीं सुना। और अब देखो, उसके खून का हिसाब माँगा जा रहा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּחֶטְאוּ בַיֶּלֶד
  choice: उस लड़के के विरुद्ध पाप मत करो
  rationale: בְּ यहाँ लक्ष्य/विरुद्ध किए गए अपराध को व्यक्त करता है; ‘पाप मत करो’ मूल की नैतिक भाषा बनाए रखता है।
- source_word: דָּמוֹ
  choice: उसके खून
  rationale: ‘खून’ सामान्य आधुनिक हिन्दी है और यहाँ हिंसक मृत्यु तथा रक्त-दोष, दोनों की प्रतिध्वनि बनाए रखता है।
- source_word: נִדְרָשׁ
  choice: हिसाब माँगा जा रहा है
  rationale: निफ़अल रूप की कर्मवाच्य अभिव्यक्ति बनाए रखते हुए यह उस खून के लिए जवाबदेही माँगे जाने का भाव स्वाभाविक हिन्दी में देता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले मूल संकेत को सीधी और स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: ‘उसके खून का हिसाब’ माँगने वाला कौन है
  choice: कर्ता को अव्यक्त रखते हुए कर्मवाच्य रखा गया
  alternative: परमेश्वर उसके खून का हिसाब माँग रहा है
  rationale: इब्रानी पाठ में कर्ता स्पष्ट नहीं है; परमेश्वर निहित हो सकता है, पर अनुवाद में उसे स्पष्ट जोड़ना मूल की अर्थगत खुलावट को समाप्त कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। प्रत्यक्ष कथन में अनावश्यक रूप से दोहराए गए לֵאמֹר का अलग शब्दशः अनुवाद नहीं किया गया, क्योंकि हिन्दी उद्धरण-रचना में वह अस्वाभाविक होता।
