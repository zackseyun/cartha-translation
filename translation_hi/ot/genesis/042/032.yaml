  text: שְׁנֵים עָשָׂ֥ר אֲנַ֛חְנוּ אַחִ֖ים בְּנֵ֣י אָבִ֑י/נוּ הָ/אֶחָ֣ד אֵינֶ֔/נּוּ וְ/הַ/קָּטֹ֥ן הַ/יּ֛וֹם אֶת אָבִ֖י/נוּ בְּ/אֶ֥רֶץ כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
translation:
  language: hi
  text: हम बारह भाई हैं; हम सब हमारे पिता के बेटे हैं। एक अब नहीं है[a], और सबसे छोटा आज कनान देश में हमारे पिता के साथ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एक नहीं है।” यह इब्रानी मुहावरा किसी के लापता होने, चले जाने, या मृत समझे जाने का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר אֲנַחְנוּ אַחִים
  choice: हम बारह भाई हैं
  rationale: इब्रानी के क्रियारहित वाक्य को स्वाभाविक हिन्दी में ‘हैं’ जोड़कर व्यक्त किया गया है; אַחִים यहाँ सगे पुरुष भाई हैं।
- source_word: בְּנֵי אָבִינוּ
  choice: हमारे पिता के बेटे
  rationale: मूल के पुनरुक्तिपूर्ण समानाधिकरण को बनाए रखता है और वक्ताओं के एक ही परिवार से होने पर बल देता है।
- source_word: הָאֶחָד אֵינֶנּוּ
  choice: एक अब नहीं रहा
  rationale: ‘नहीं रहा’ हिन्दी में अनुपस्थित, खोए हुए या मृत समझे जाने का संकेत दे सकता है; ‘अब’ मुहावरे को स्वाभाविक बनाता है, जबकि अर्थ की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וְהַקָּטֹן
  choice: और सबसे छोटा
  rationale: भाइयों के संदर्भ में קָטֹן आयु में सबसे छोटे भाई को दर्शाता है, न कि शारीरिक आकार को।
- source_word: הַיּוֹם אֶת אָבִינוּ
  choice: आज हमारे पिता के साथ है
  rationale: הַיּוֹם को सीधे ‘आज’ और साथ-संगति सूचक אֶת को ‘के साथ’ अनूदित किया गया है।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: אֶרֶץ को ‘देश’ के रूप में स्पष्ट रखते हुए आधुनिक हिन्दी की स्वाभाविक पदावली अपनाई गई है।
theological_decisions:
- issue: אֵינֶנּוּ से यूसुफ की स्थिति का अभिप्राय
  choice: एक अब नहीं रहा
  alternative: एक मर गया है
  rationale: भाई यूसुफ को मृत समझ सकते हैं, पर इब्रानी कथन स्पष्ट रूप से मृत्यु नहीं कहता। अनुवाद उस कथात्मक विडंबना और वास्तविक अनिश्चितता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल की पारिवारिक पुनरुक्ति को संक्षिप्त किए बिना रखा गया है, और אֵינֶנּוּ की अर्थगत अस्पष्टता को मुख्य पाठ तथा पादटिप्पणी में सुरक्षित किया गया है।
