id: GEN.42.28
reference: Genesis 42:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֶל אֶחָי/ו֙ הוּשַׁ֣ב כַּסְפִּ֔/י וְ/גַ֖ם הִנֵּ֣ה בְ/אַמְתַּחְתִּ֑/י וַ/יֵּצֵ֣א לִבָּ֗/ם וַ/יֶּֽחֶרְד֞וּ אִ֤ישׁ אֶל אָחִי/ו֙ לֵ/אמֹ֔ר מַה זֹּ֛את עָשָׂ֥ה אֱלֹהִ֖ים לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/028.yaml
  text: He said to his brothers[a], “My silver has been returned, and look, it is even in my sack!” Then their hearts failed them, and they trembled, each man to his brother, saying[b], “What is this that God has done to us?”
translation:
  language: hi
  text: उसने अपने भाइयों से कहा, “मेरी चाँदी लौटा दी गई है; देखो, वह मेरी बोरी में ही है!” यह सुनकर उनका दिल बैठ गया[a] और वे काँपते हुए एक-दूसरे से[b] कहने लगे, “परमेश्वर ने हमारे साथ यह क्या किया है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनका हृदय निकल गया”; अर्थात उनका साहस जाता रहा।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर एक अपने भाई से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּשַׁב כַּסְפִּי
  choice: मेरी चाँदी लौटा दी गई है
  rationale: होफ़अल रूप निष्क्रिय अर्थ देता है—चाँदी वापस कर दी गई। ‘चाँदी’ मूल के ठोस और ऐतिहासिक शब्द को बनाए रखता है।
- source_word: וְגַם הִנֵּה בְאַמְתַּחְתִּי
  choice: देखो, वह मेरी बोरी में ही है
  rationale: ‘देखो’ הִנֵּה की आकस्मिक खोज और ध्यानाकर्षण को व्यक्त करता है, जबकि ‘ही’ גַם के आश्चर्यपूर्ण बल को स्वाभाविक हिन्दी में संप्रेषित करता है।
- source_word: וַיֵּצֵא לִבָּם
  choice: उनका दिल बैठ गया
  rationale: शाब्दिक अर्थ ‘उनका हृदय निकल गया’ है। हिन्दी मुहावरा ‘दिल बैठ गया’ भय से साहस टूटने और भीतर से घबरा जाने का स्वाभाविक समतुल्य है।
- source_word: וַיֶּחֶרְדוּ
  choice: वे काँपते हुए
  rationale: חרד भय अथवा व्याकुलता से काँपने को दर्शाता है; यह चयन उसकी शारीरिक और भावनात्मक दोनों तीव्रता बनाए रखता है।
- source_word: אִישׁ אֶל אָחִיו
  choice: एक-दूसरे से
  rationale: वितरणात्मक इब्रानी वाक्यांश का स्वाभाविक हिन्दी अर्थ ‘एक-दूसरे से’ है; भाई होने की पहचान पिछले ही खंड में स्पष्ट है।
- source_word: מַה זֹּאת עָשָׂה אֱלֹהִים לָנוּ
  choice: परमेश्वर ने हमारे साथ यह क्या किया है?
  rationale: सीधा विस्मयपूर्ण प्रश्न सुरक्षित रखा गया है और ‘क्यों’ जोड़कर कारण संबंधी व्याख्या नहीं की गई। לָנוּ को प्रसंगानुकूल ‘हमारे साथ’ कहा गया है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया और कथा-प्रसंग सच्चे परमेश्वर की ओर संकेत करते हैं; आधुनिक हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ स्पष्ट और प्रतिष्ठित रूप है।
theological_decisions:
- issue: भाइयों के भयपूर्ण प्रश्न में אֱלֹהִים का अर्थ
  choice: परमेश्वर
  alternative: ईश्वर / देवता
  rationale: यद्यपि संज्ञा का रूप बहुवचन-सदृश है, एकवचन क्रिया עָשָׂה और कथा का संदर्भ एक परमेश्वर को सूचित करते हैं। अनुवाद केवल उनके द्वारा मानी गई दैवी कर्तृता व्यक्त करता है, उसके उद्देश्य की व्याख्या नहीं करता।
- issue: אִישׁ אֶל אָחִיו में पुरुष-संबंधी भाषा
  choice: मुख्य पाठ में पहले ‘अपने भाइयों’, फिर ‘एक-दूसरे से’
  alternative: हर एक अपने भाई से
  rationale: पात्रों की पुरुष और भाई वाली पहचान स्पष्ट रूप से सुरक्षित है। बाद का स्वाभाविक वितरणात्मक पद अनावश्यक पुनरुक्ति से बचता है; शाब्दिक संरचना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज किंतु गरिमापूर्ण कथा-शैली। ‘चाँदी’ ऐतिहासिक ठोसता बनाए रखता है, ‘बोरी’ सामान्य पाठक के लिए स्पष्ट है, और ‘दिल बैठ गया’ मूल इब्रानी मुहावरे की भावात्मक शक्ति को स्वाभाविक हिन्दी में देता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
