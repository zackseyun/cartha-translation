  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। दो इब्रानी बलात्मक रचनाओं को क्रमशः ‘ही’ और ‘बहुत’ से व्यक्त किया गया है।
