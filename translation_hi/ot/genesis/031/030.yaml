source:
  edition: WLC
  text: וְ/עַתָּה֙ הָלֹ֣ךְ הָלַ֔כְתָּ כִּֽי נִכְסֹ֥ף נִכְסַ֖פְתָּה לְ/בֵ֣ית אָבִ֑י/ךָ לָ֥/מָּה גָנַ֖בְתָּ אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/030.yaml
  text: And now[a], you have indeed gone away, because you longed greatly for your father's house. Why did you steal my gods?
translation:
  language: hi
  text: '“और अब, तुम तो चले ही गए, क्योंकि तुम्हें अपने पिता के घर की बहुत लालसा थी। तुमने मेरे देवताओं[a] को क्यों चुरा लिया?”


    [a] अथवा, “मेरे गृह-देवताओं।” इब्रानी में केवल “मेरे देवताओं” है, पर प्रसंग में यह लाबान की घरेलू मूर्तियों को दर्शाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “मेरे गृह-देवताओं।” इब्रानी में केवल “मेरे देवताओं” है, पर प्रसंग में यह लाबान की घरेलू मूर्तियों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक वाव और कालवाचक क्रिया-विशेषण—दोनों को रखते हुए लाबान के आरोप के अगले बिंदु का स्वाभाविक आरंभ करता है।
- source_word: הָלֹךְ הָלַכְתָּ
  choice: तुम चले ही गए
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute की बलात्मकता को हिंदी के ‘ही’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह याकूब के चले जाने का वह कारण प्रस्तुत करता है जिसे लाबान स्वीकार करता है।
- source_word: נִכְסֹף נִכְסַפְתָּה
  choice: तुम ... बहुत तरस रहे थे
  rationale: दोहराई गई बलात्मक इब्रानी रचना तीव्र लालसा बताती है; ‘बहुत तरस रहे थे’ अर्थ और जोर दोनों को सहज हिंदी में रखता है।
- source_word: לְבֵית אָבִיךָ
  choice: अपने पिता के घर के लिए
  rationale: मूल के पारिवारिक और घराने-संबंधी भाव को बिना ‘पैतृक निवास’ जैसा अतिरिक्त अर्थ जोड़े सीधे व्यक्त करता है।
- source_word: לָמָּה גָנַבְתָּ
  choice: तुमने ... क्यों चुरा लिया
  rationale: प्रत्यक्ष प्रश्न और पूर्ण हो चुकी चोरी के आरोप को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: אֶת אֱלֹהָי
  choice: मेरे देवताओं
  rationale: इब्रानी में स्पष्ट रूप से बहुवचन ‘मेरे देवता’ है। घरेलू मूर्तियों का प्रसंगगत संकेत मुख्य पाठ में जोड़ने के बजाय पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: लाबान के कथन में אֱלֹהָי का अनुवाद
  choice: मेरे देवताओं
  alternative: मेरे गृह-देवताओं
  rationale: मूल इब्रानी केवल ‘मेरे देवताओं’ कहती है। आसपास के प्रसंग में ये लाबान की घरेलू मूर्तियाँ हैं, पर उस स्पष्टीकरण को मुख्य पाठ में मिला देने के बजाय पादटिप्पणी में रखा गया है।
