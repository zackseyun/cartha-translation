  yaml_path: translation/ot/genesis/031/005.yaml
  text: And he said to them[a], “I see that your father's face is not toward me as before, but the God of my father has been with me.”
translation:
  language: hi
  text: उसने उनसे कहा, “मैं देख रहा हूँ कि तुम्हारे पिता का चेहरा मेरे प्रति पहले जैसा नहीं है[a]; पर मेरे पिता का परमेश्वर मेरे साथ रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कल और उसके पहले के दिन जैसा”; यह इब्रानी मुहावरा “पहले जैसा” अर्थ देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  choice: उसने उनसे कहा
  rationale: कथात्मक वय्यिक्तोल को स्वाभाविक हिन्दी भूतकाल में रखा गया है। ‘उनसे’ राहेल और लिआ—दोनों स्त्री सम्बोधितों—को संदर्भानुसार व्यक्त करता है।
- source_word: רֹאֶה אָנֹכִי
  choice: मैं देख रहा हूँ
  rationale: कृदन्त और स्वतंत्र सर्वनाम याकूब की वर्तमान अनुभूति पर बल देते हैं; हिन्दी का वर्तमान अपूर्ण रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶת פְּנֵי אֲבִיכֶן
  choice: तुम्हारे पिता का चेहरा
  rationale: ‘चेहरा’ मूल इब्रानी बिंब को बनाए रखता है और यहाँ भाव या रवैये का संकेत देता है।
- source_word: כִּי אֵינֶנּוּ אֵלַי
  choice: अब मेरे प्रति ... नहीं रहा
  rationale: ‘मेरे प्रति’ मूल के दिशात्मक भाव को सुरक्षित रखता है, जबकि ‘नहीं रहा’ बदले हुए रवैये को सहज हिन्दी में बताता है। स्पष्टता के लिए ‘अब’ निहित परिवर्तन को व्यक्त करता है।
- source_word: כִּתְמֹל שִׁלְשֹׁם
  choice: पहले जैसा
  rationale: यह इब्रानी मुहावरा बीते समय की पूर्व स्थिति को दर्शाता है। स्वाभाविक हिन्दी अर्थ मुख्य पाठ में है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וֵאלֹהֵי אָבִי
  choice: पर मेरे पिता का परमेश्वर
  rationale: वाव को प्रसंगानुसार विरोधसूचक ‘पर’ किया गया है, क्योंकि लाबान के बदले रवैये के विपरीत परमेश्वर की संगति बताई गई है।
- source_word: הָיָה עִמָּדִי
  choice: मेरे साथ रहा है
  rationale: पूर्ण क्रिया अतीत से वर्तमान तक प्रासंगिक बनी परमेश्वर की संगति को समेटती है; हिन्दी पूर्ण वर्तमान इसका उपयुक्त रूप है।
theological_decisions:
- issue: אֱלֹהֵי אָבִי में परमेश्वर के पारिवारिक-संबंधसूचक उल्लेख का अनुवाद
  choice: मेरे पिता का परमेश्वर
  alternative: मेरे पिता के परमेश्वर
  rationale: चुना हुआ रूप इब्रानी संबंध-रचना और वाचा-संबंधी पारिवारिक संकेत को बिना अतिरिक्त सिद्धान्त जोड़े स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘चेहरा’ जैसे मूल इब्रानी बिंब को रखा गया है, पर मुहावरे का अर्थ मुख्य पाठ में स्वाभाविक हिन्दी में दिया गया है।
