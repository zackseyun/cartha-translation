  text: וַ/יַּ֥עַן יַעֲקֹ֖ב וַ/יֹּ֣אמֶר לְ/לָבָ֑ן כִּ֣י יָרֵ֔אתִי כִּ֣י אָמַ֔רְתִּי פֶּן תִּגְזֹ֥ל אֶת בְּנוֹתֶ֖י/ךָ מֵ/עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/031.yaml
  text: Then Jacob answered and said to Laban[a], “Because I was afraid, for I said[b], ‘Lest you take your daughters from me by force.’”
translation:
  language: hi
  text: तब याकूब ने लाबान को उत्तर दिया और कहा, “मुझे डर था, क्योंकि मैंने सोचा था[a], ‘कहीं आप अपनी बेटियों को मुझसे बलपूर्वक न छीन लें।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैंने कहा था”; यहाँ इसका आशय मन में कहने या सोचने से हो सकता है।
    reason: मूल क्रिया के शाब्दिक अर्थ और प्रसंगगत अर्थ, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: उत्तर दिया
  rationale: हिब्रू का युग्म शाब्दिक रूप से ‘उत्तर दिया और कहा’ है; आधुनिक हिन्दी में संवाद के भीतर ‘उत्तर दिया’ दोनों क्रियाओं का स्वाभाविक और पर्याप्त प्रतिनिधित्व करता है।
- source_word: יָרֵאתִי
  choice: मैं डर गया था
  rationale: यह याकूब के भय को सहज आधुनिक हिन्दी में व्यक्त करता है और प्रसंग में उसके गुप्त रूप से चले जाने का कारण बताता है।
- source_word: אָמַרְתִּי
  choice: मैंने सोचा था
  rationale: मूल क्रिया का सामान्य अर्थ ‘मैंने कहा’ है, पर यहाँ वह याकूब के मन में उठी आशंका को व्यक्त करती है; ‘मैंने सोचा था’ हिन्दी में स्वाभाविक है। शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: פֶּן
  choice: कहीं ... न
  rationale: यह हिन्दी संरचना आशंका से जुड़ी संभावित अनिष्टकारी घटना को स्वाभाविक रूप से व्यक्त करती है।
- source_word: תִּגְזֹל
  choice: बलपूर्वक ... छीन लें
  rationale: גזל में अन्यायपूर्वक या बल से छीन लेने का प्रबल भाव है; केवल ‘ले जाएँ’ उस अर्थ को कमजोर कर देता।
- source_word: בְּנוֹתֶיךָ מֵעִמִּי
  choice: अपनी बेटियों को मुझसे
  rationale: ‘अपनी बेटियों’ लाबान से उनके संबंध को और ‘मुझसे’ याकूब से जबरन अलग किए जाने को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
