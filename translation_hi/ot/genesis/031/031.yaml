  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘बलपूर्वक ... छीन लें’ मूल क्रिया की तीव्रता को बनाए रखता है, जबकि ‘कहीं ... न’ आशंका की स्वाभाविक हिन्दी अभिव्यक्ति है।
