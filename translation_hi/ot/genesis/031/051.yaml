    reason: lexical_alternative
  - marker: b
    text: या “स्तम्भ।” इब्रानी शब्द का अर्थ खड़ा किया हुआ स्मारक-पत्थर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इसके अनुक्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह अव्यय सामने उपस्थित वस्तु की ओर ध्यान खींचता है। एकवचन संबोधन के अनुरूप ‘देख’ स्वाभाविक और स्पष्ट है; इसकी पुनरावृत्ति मूल के समानांतर बल को बनाए रखती है।
- source_word: הַגַּל
  choice: पत्थरों का ढेर
  rationale: संदर्भ में גַּל साधारण मिट्टी का टीला नहीं, साक्षी के रूप में बनाया गया पत्थरों का ढेर है; स्पष्ट हिन्दी के लिए इसे प्रत्यक्ष किया गया है।
- source_word: הַמַּצֵּבָה
  choice: खड़ा किया हुआ पत्थर
  rationale: מַצֵּבָה यहाँ खड़ा किया गया स्मारक पत्थर दर्शाता है। यह ‘खम्भा’ की तुलना में वस्तु का स्वरूप अधिक ठीक बताता है और अनावश्यक स्थापत्य अर्थ से बचता है।
- source_word: יָרִיתִי
  choice: मैंने ... खड़ा किया है
  rationale: इस प्रसंग और מַצֵּבָה के साथ क्रिया का आशय स्थापित या खड़ा करना है। हिन्दी में यह स्वाभाविक है और भूतकालीन कार्य की वर्तमान प्रासंगिकता भी रखता है।
- source_word: בֵּינִי וּבֵינֶךָ
  choice: अपने और तेरे बीच
  rationale: मूल की संबंधसूचक अभिव्यक्ति को निकटता से रखते हुए लाबान के एकवचन संबोधन को ‘तेरे’ द्वारा सुरक्षित किया गया है।
