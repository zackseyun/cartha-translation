  text: तब लाबान ने याकूब से कहा, “देखो, यह पत्थरों का ढेर है[a], और देखो, यह खड़ा पत्थर है[b], जिसे मैंने अपने और तुम्हारे बीच स्थापित किया है।”
  philosophy: optimal-equivalence
