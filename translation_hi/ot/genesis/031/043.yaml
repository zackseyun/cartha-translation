base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/043.yaml
  text: Then Laban answered and said to Jacob[a], “The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that you see is mine. But what can I do this day for these my daughters, or for their children whom they have borne?”
translation:
  language: hi
  text: तब लाबान ने याकूब को उत्तर देकर कहा, “ये बेटियाँ मेरी बेटियाँ हैं, ये बेटे मेरे बेटे हैं, और यह झुंड मेरा झुंड है। जो कुछ तुम देख रहे हो, वह सब मेरा है। पर आज मैं अपनी इन बेटियों या उनके उन बच्चों के लिए, जिन्हें उन्होंने जन्म दिया है, क्या कर सकता हूँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן לָבָן וַיֹּאמֶר אֶל יַעֲקֹב
  choice: तब लाबान ने याकूब को उत्तर दिया
  rationale: हिब्रू के उत्तर देने और कहने वाले युग्म को स्वाभाविक हिन्दी में एक ही कथन-क्रिया से व्यक्त किया गया है; ‘उत्तर दिया’ संवादात्मक प्रत्युत्तर को स्पष्ट रखता है।
- source_word: הַבָּנוֹת בְּנֹתַי
  choice: ये बेटियाँ मेरी बेटियाँ हैं
  rationale: संज्ञा की पुनरावृत्ति लाबान के जोरदार पारिवारिक और स्वामित्व-सदृश दावे को सुरक्षित रखती है; ‘ये’ प्रसंग में संकेतार्थ को स्वाभाविक बनाता है।
- source_word: וְהַבָּנִים בָּנַי
  choice: ये बेटे मेरे बेटे हैं
  rationale: यहाँ בנים को समानांतर पद ‘बेटियाँ’ के साथ संकीर्ण अर्थ ‘बेटे’ में रखा गया है और मूल की पुनरावृत्ति सुरक्षित है।
- source_word: וְהַצֹּאן צֹאנִי
  choice: और यह झुंड मेरा झुंड है
  rationale: צאן छोटे पालतू पशुओं का सामूहिक शब्द है; ‘झुंड’ उसके सामूहिक भाव और दोहराव दोनों को बनाए रखता है।
- source_word: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא
  choice: जो कुछ तुम देख रहे हो, वह सब मेरा है
  rationale: यह लाबान के व्यापक अधिकार-दावे को स्पष्ट, संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מָה אֶעֱשֶׂה ... הַיּוֹם
  choice: पर आज ... क्या कर सकता हूँ?
  rationale: प्रसंग में अपूर्ण क्रिया व्यावहारिक सामर्थ्य की आलंकारिक पूछताछ व्यक्त करती है; ‘आज’ आधुनिक हिन्दी में הַיּוֹם का सहज रूप है।
- source_word: וְלִבְנֹתַי ... אוֹ לִבְנֵיהֶן
  choice: अपनी इन बेटियों के साथ, या ... बच्चों के साथ
  rationale: यहाँ לְ को केवल हितार्थक ‘के लिए’ मानने के बजाय संभावित लक्ष्य/व्यवहार के अर्थ में ‘के साथ’ रखा गया है, क्योंकि प्रश्न का आशय है कि लाबान उन्हें क्या हानि पहुँचा या उनके विरुद्ध क्या कर सकता है।
- source_word: לִבְנֵיהֶן אֲשֶׁר יָלָדוּ
  choice: उनके जन्माए बच्चों
  rationale: בנים व्यापक रूप से संतान को सूचित कर सकता है; ‘बच्चों’ को मुख्य पाठ में रखकर ‘बेटों’ की शाब्दिक संभावना पादटिप्पणी में सुरक्षित की गई है। ‘जन्माए’ मातृ-संबंधी उपवाक्य का संक्षिप्त और स्पष्ट रूप है।
