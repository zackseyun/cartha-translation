  text: וַ/יִּקַּ֤ח אֶת אֶחָי/ו֙ עִמּ֔/וֹ וַ/יִּרְדֹּ֣ף אַחֲרָ֔י/ו דֶּ֖רֶךְ שִׁבְעַ֣ת יָמִ֑ים וַ/יַּדְבֵּ֥ק אֹת֖/וֹ בְּ/הַ֥ר הַ/גִּלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/023.yaml
  text: And he took his kinsmen with him[a], and pursued him for a journey of seven days[d][c][b], and caught up with him in the hill country of Gilead.
translation:
  language: hi
  text: उसने अपने संबंधियों[a] को साथ लिया और सात दिन की यात्रा जितनी दूरी तक उसका पीछा किया[b]। फिर गिलाद के पहाड़ी प्रदेश[c] में वह उस तक पहुँच गया[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने भाइयों”; इब्रानी शब्द का अर्थ सगे भाई या व्यापक रूप से संबंधी, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “सात दिन तक उसका पीछा किया”; इब्रानी में शाब्दिक भाव “सात दिन के मार्ग” का है।
    reason: source_ambiguity
  - marker: c
    text: या “गिलाद पर्वत पर”; इब्रानी पद किसी एक पर्वत अथवा गिलाद के पहाड़ी प्रदेश को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: d
    text: या “उसके पास जा पहुँचा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: अपने संबंधियों
  rationale: אָח का मूल अर्थ ‘भाई’ है, पर बहुवचन रूप व्यापक कुल या रिश्तेदारी के पुरुषों को भी सूचित कर सकता है। प्रसंग में लाबान के साथ उसके कुल के लोग हैं, इसलिए ‘संबंधियों’ स्वाभाविक है और अर्थ को केवल सगे भाइयों तक सीमित नहीं करता।
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: उसका पीछा किया
  rationale: हिंदी में ‘पीछा किया’ क्रिया और אַחֲרָיו (‘उसके पीछे’) दोनों का आशय सहज रूप से व्यक्त करती है; ‘उसके पीछे पीछा किया’ अनावश्यक पुनरुक्ति होती।
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: सात दिन की यात्रा जितनी दूरी तक
  rationale: דֶּרֶךְ यहाँ मार्ग/यात्रा की सीमा या विस्तार बताता है। यह रूप केवल अवधि बताने वाले ‘सात दिन तक’ की तुलना में यात्रा की दूरी का भाव अधिक स्पष्ट रखता है।
- source_word: וַיַּדְבֵּק אֹתוֹ
  choice: वह उसके पास जा पहुँचा
  rationale: पीछा करने के प्रसंग में דבק का अर्थ किसी को पकड़ लेने के बजाय उसके बराबर या उसके पास पहुँच जाना है। यह हिंदी रूप गिरफ्तारी का अनावश्यक भाव जोड़े बिना उस अर्थ को व्यक्त करता है।
- source_word: בְּהַר הַגִּלְעָד
  choice: गिलाद के पहाड़ी प्रदेश में
  rationale: הַר किसी एक पर्वत के साथ-साथ पहाड़ी भूभाग या पर्वतीय क्षेत्र भी बता सकता है। यहाँ क्षेत्रवाचक अर्थ प्रसंगानुकूल है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
