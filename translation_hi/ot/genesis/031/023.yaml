  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी की क्रमिक क्रियाओं को हिंदी में दो वाक्यों में बाँटा गया है ताकि कर्ता-सर्वनाम स्पष्ट रहें। ‘जा पहुँचा’ चुना गया है ताकि पाठ में पकड़ लेने या बंदी बनाने का अतिरिक्त अर्थ न आए।
