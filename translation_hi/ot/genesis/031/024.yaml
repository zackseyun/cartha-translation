base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/024.yaml
  text: But God came to Laban the Aramean in a dream at night and said to him[c][b][a], “Be careful not to speak to Jacob either good or bad.”
translation:
  language: hi
  text: परन्तु परमेश्वर रात को स्वप्न में अरामी लाबान के पास आया और उससे कहा, “सावधान रहना कि याकूब से भली या बुरी कोई बात न कहना।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भले से बुरे तक।” यह मुहावरा किसी भी प्रकार की बात—चाहे अनुकूल हो या प्रतिकूल—के लिए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का सामान्य आख्यानात्मक अर्थ ‘आना’ है; ‘दिखाई दिया’ मूल में स्पष्ट रूप से नहीं है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया और प्रसंग इसे एक परमेश्वर के लिए प्रयुक्त संज्ञा ठहराते हैं।
- source_word: לָבָן הָאֲרַמִּי
  choice: अरामी लाबान
  rationale: אֲרַמִּי जातीय पहचान ‘अरामी’ बताता है; पारंपरिक ‘सीरियाई’ बाद की भौगोलिक शब्दावली है।
- source_word: בַּחֲלֹם הַלָּיְלָה
  choice: रात को स्वप्न में
  rationale: यह स्वप्न और रात्रि दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הִשָּׁמֶר לְךָ
  choice: सावधान रहना
  rationale: यह हिब्रू चेतावनी-सूत्र का स्वाभाविक हिन्दी रूप है।
- source_word: פֶּן תְּדַבֵּר עִם יַעֲקֹב
  choice: कि याकूब से ... कोई बात न कहना
  rationale: פֶּן निषेधात्मक चेतावनी देता है और דבר עם का अर्थ यहाँ किसी से बात कहना/बोलना है।
- source_word: מִטּוֹב עַד רָע
  choice: भली या बुरी कोई बात
  rationale: शाब्दिक ‘भले से बुरे तक’ एक ध्रुवीय मुहावरा है, जिसका आशय पूरे दायरे—किसी भी प्रकार की बात—से है; अनुवाद ध्रुवों और आशय दोनों को रखता है।
theological_decisions:
- issue: אֱלֹהִים की पहचान
  choice: परमेश्वर
  alternative: देवता/ईश्वर
  rationale: एकवचन क्रिया और निकटवर्ती आख्यान के अनुसार यहाँ इस्राएल के एक परमेश्वर का उल्लेख है; अनुवाद इससे आगे कोई doctrinal विस्तार नहीं जोड़ता।
- issue: מִטּוֹב עַד רָע की निषेध-सीमा
  choice: भली या बुरी कोई बात न कहना
  alternative: भले से बुरे तक न बोलना
  rationale: यह मेरिज़्म किसी भी प्रकार की बात कहने के विरुद्ध चेतावनी देता है; ‘कोई बात’ अर्थ स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘अरामी’ मूल जातिनाम को सुरक्षित रखता है। ‘परन्तु’ पूर्ववर्ती प्रसंग से विरोधात्मक संबंध दिखाता है।
