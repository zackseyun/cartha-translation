  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/רָחֵ֞ל לָקְחָ֣ה אֶת הַ/תְּרָפִ֗ים וַ/תְּשִׂמֵ֛/ם בְּ/כַ֥ר הַ/גָּמָ֖ל וַ/תֵּ֣שֶׁב עֲלֵי/הֶ֑ם וַ/יְמַשֵּׁ֥שׁ לָבָ֛ן אֶת כָּל הָ/אֹ֖הֶל וְ/לֹ֥א מָצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/034.yaml
  text: Rachel had taken the household idols[a], put them in the camel’s saddle cushion, and sat on them. Laban felt through the whole tent[c][b], but did not find them.
translation:
  language: hi
  text: राहेल ने घर के देवताओं[a] को लेकर ऊँट की काठी की गद्दी[b] में रख दिया था और उन पर बैठ गई थी। लाबान ने पूरे तंबू में टटोलकर देखा, पर वे उसे नहीं मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तिराफीम” अथवा “घर की देव-मूर्तियाँ।” इब्रानी शब्द घरेलू उपासना में प्रयुक्त धार्मिक वस्तुओं को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “ऊँट की काठी में।” इब्रानी शब्द संभवतः ऊँट की सवारी के गद्देदार सामान के किसी भाग को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: घर के देवताओं
  rationale: यह इब्रानी शब्द घरेलू उपासना में प्रयुक्त देव-प्रतिमाओं या धार्मिक वस्तुओं को दर्शाता है। ‘घर के देवता’ आधुनिक हिन्दी में स्वाभाविक है और वस्तुओं को केवल सामान्य मूर्तियाँ कहने के बजाय उनके घरेलू धार्मिक स्वरूप को बनाए रखता है।
- source_word: בְּכַר הַגָּמָל
  choice: ऊँट की काठी की गद्दी में
  rationale: כַּר का अर्थ गद्दी या गद्देदार वस्तु है; इस प्रसंग में यह ऊँट की सवारी के गद्देदार सामान को दर्शाता है।
- source_word: וַתֵּשֶׁב עֲלֵיהֶם
  choice: और उन पर बैठ गई थी
  rationale: राहेल के पिछले कार्यों की पृष्ठभूमि बताने वाली शृंखला को हिन्दी में पूर्ण भूतकाल से स्वाभाविक रूप में व्यक्त किया गया है और भौतिक छिपाव का चित्र सुरक्षित है।
- source_word: וַיְמַשֵּׁשׁ
  choice: टटोलकर देखा
  rationale: क्रिया हाथ से छू-छूकर खोजने का भाव देती है; ‘टटोलकर देखा’ केवल सामान्य खोज की अपेक्षा इस स्पर्श-संबंधी अर्थ को अधिक स्पष्ट रखता है।
- source_word: כָּל הָאֹהֶל
  choice: पूरे तंबू में
  rationale: यह निश्चित संज्ञा के साथ כָּל का स्वाभाविक हिन्दी रूप है और खोज के पूरे स्थान में होने का भाव देता है।
- source_word: וְלֹא מָצָא
  choice: पर वे उसे नहीं मिले
  rationale: मूल में कर्म निहित है; हिन्दी में बहुवचन ‘वे’ का संबंध घर के देवताओं से स्पष्ट किया गया है। ‘पर’ असफल खोज के विरोधात्मक परिणाम को व्यक्त करता है।
- source_word: וְרָחֵל
  choice: राहेल
  rationale: आरंभिक waw को अलग से ‘अब’ कहकर नहीं बढ़ाया गया; हिन्दी कथानक में नाम से आरंभ करना सहज है।
theological_decisions:
- issue: תְּרָפִים को देवताओं या मूर्तियों के रूप में प्रस्तुत करना
  choice: घर के देवता
  alternative: कुलदेवताओं की मूर्तियाँ; तिराफीम
  rationale: मूल शब्द घरेलू धार्मिक वस्तुओं/देव-प्रतिमाओं के लिए है। ‘घर के देवता’ उसकी धार्मिक भूमिका और बहुवचन को रखता है, जबकि ‘कुलदेवता’ वंश-विशेष की ऐसी धारणा जोड़ सकता है जो मूल में स्पष्ट नहीं; लिप्यंतरण सामान्य पाठक के लिए अस्पष्ट होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। पहले वाक्य का पूर्ण भूतकाल इन घटनाओं को लाबान की तलाशी से पहले की पृष्ठभूमि के रूप में प्रस्तुत करता है।
