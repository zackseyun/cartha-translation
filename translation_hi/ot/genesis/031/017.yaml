  text: Then Jacob arose and put his sons and his wives on the camels[a].
translation:
  language: hi
  text: तब याकूब उठा और उसने अपने बेटों और अपनी पत्नियों को ऊँटों पर बैठाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: קום का यह कथात्मक रूप अगली कार्रवाई के लिए उठने को दर्शाता है; ‘उठा’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: וַיִּשָּׂא
  choice: बैठाया
  rationale: נשׂא का मूल अर्थ ‘उठाना/ले जाना’ है, पर ऊँटों के साथ इस प्रसंग में इसका आशय उन्हें सवारी के लिए ऊँटों पर चढ़ाने या बैठाने से है; ‘बैठाया’ हिन्दी में स्वाभाविक रूप से यह कारक क्रिया व्यक्त करता है।
- source_word: בָּנָיו
  choice: अपने बेटों
  rationale: בנים पुल्लिंग बहुवचन है और यहाँ याकूब के बेटों को सूचित करता है; ‘अपने’ हिन्दी में कर्ता से स्वामित्व स्पष्ट करता है।
- source_word: נָשָׁיו
  choice: अपनी पत्नियों
  rationale: אשה का बहुवचन और याकूब के साथ संबंध इस संदर्भ में उसकी पत्नियों को स्पष्टतः सूचित करता है।
- source_word: עַל הַגְּמַלִּים
  choice: ऊँटों पर
  rationale: עַל यहाँ गति के लक्ष्य अथवा परिणामी स्थिति को व्यक्त कर सकता है; ‘बैठाया’ के साथ ‘ऊँटों पर’ स्वाभाविक हिन्दी है और गति भी निहित रहती है।
