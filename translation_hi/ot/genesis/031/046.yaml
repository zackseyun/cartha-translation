language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יַעֲקֹ֤ב לְ/אֶחָי/ו֙ לִקְט֣וּ אֲבָנִ֔ים וַ/יִּקְח֥וּ אֲבָנִ֖ים וַ/יַּֽעֲשׂוּ גָ֑ל וַ/יֹּ֥אכְלוּ שָׁ֖ם עַל הַ/גָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/046.yaml
  text: Then Jacob said to his brothers[a], “Gather stones.” So they took stones and made a heap[b], and they ate there by the heap.
translation:
  language: hi
  text: तब याकूब ने अपने भाइयों[a] से कहा, “पत्थर इकट्ठे करो।” उन्होंने पत्थर लेकर एक ढेर बनाया और वहीं उस ढेर के पास[b] भोजन किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भाइयों” से यहाँ याकूब के पुरुष संबंधी या साथी भी अभिप्रेत हो सकते हैं, केवल सगे भाई नहीं।
    reason: cultural_note
  - marker: b
    text: या “वहीं उस ढेर पर भोजन किया।” इब्रानी संबंधबोधक शब्द का अधिक शाब्दिक अर्थ “पर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֶחָיו
  choice: अपने भाइयों
  rationale: אָח का सामान्य अर्थ ‘भाई’ है, पर यहाँ यह याकूब के साथ के पुरुष संबंधियों या साथियों के लिए अधिक व्यापक रूप में प्रयुक्त हो सकता है; मुख्य पाठ में स्रोत-समीप शब्द रखा गया है और व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: לִקְטוּ אֲבָנִים
  choice: पत्थर इकट्ठे करो
  rationale: לקט चीज़ों को चुनकर या उठाकर जमा करने का भाव देता है; आधुनिक हिन्दी में ‘इकट्ठे करो’ स्वाभाविक और स्पष्ट है।
- source_word: וַיַּעֲשׂוּ גָל
  choice: एक ढेर बनाया
  rationale: גַּל यहाँ पत्थरों के ढेर को सूचित करता है; ‘ढेर’ सामान्य पाठक के लिए सीधा और सुबोध है।
- source_word: וַיֹּאכְלוּ שָׁם עַל הַגָּל
  choice: वहीं उस ढेर के पास भोजन किया
  rationale: עַל का मूल अर्थ ‘पर’ है, किंतु प्रसंग में ‘के पास’ या ‘के निकट’ भी संभव है। मुख्य पाठ में स्वाभाविक दृश्यार्थ रखा गया है और अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
