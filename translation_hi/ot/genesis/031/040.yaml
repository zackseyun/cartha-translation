base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/040.yaml
  text: By day the heat consumed me[a], and the frost by night, and my sleep fled from my eyes.
translation:
  language: hi
  text: 'मेरी दशा यह थी: दिन में तपती गरमी और रात में पाला मुझे खा जाते थे; मेरी आँखों से नींद उड़ जाती थी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִיתִי
  choice: मेरी दशा यह थी
  rationale: हिब्रू का आरम्भिक ‘मैं था’ याकूब की अवस्था का परिचय देता है। आधुनिक हिन्दी में ‘मेरी दशा यह थी’ उस भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַיּוֹם
  choice: दिन में
  rationale: यह दिन के समय की परिस्थिति बताता है और ‘रात में’ के साथ स्वाभाविक समानांतर बनाता है।
- source_word: אֲכָלַנִי
  choice: मुझे खा जाते थे
  rationale: मूल क्रिया का शाब्दिक चित्र ‘खा जाना’ है। हिन्दी में भी कठोर गरमी और पाले से बुरी तरह त्रस्त होने के लिए यह सजीव और समझ में आने वाला रूपक है।
- source_word: חֹרֶב
  choice: तपती गरमी
  rationale: यह शब्द सूखे या झुलसाने वाली गरमी को सूचित कर सकता है; यहाँ रात के पाले के विपरीत दिन की कठोर गरमी अभिप्रेत है। ‘तपती गरमी’ संदर्भ और तीव्रता दोनों व्यक्त करती है।
- source_word: וְקֶרַח
  choice: और रात में पाला
  rationale: קֶרַח बर्फ या पाले जैसी जमा देने वाली ठंड को दर्शाता है। पशुओं की रखवाली करते हुए रात के खुले वातावरण में ‘पाला’ सटीक और स्वाभाविक है।
- source_word: וַתִּדַּד
  choice: उड़ जाती थी
  rationale: दुर्लभ हिब्रू क्रिया दूर चले जाने या भाग जाने का भाव देती है। नींद के विषय में हिन्दी मुहावरा ‘नींद उड़ जाना’ उसी सजीव भाव को सहजता से रखता है।
- source_word: שְׁנָתִי
  choice: नींद
  rationale: यह नींद की अवस्था को दर्शाता है; सामान्य आधुनिक हिन्दी में ‘नींद’ सबसे सीधा रूप है।
- source_word: מֵעֵינָי
  choice: मेरी आँखों से
  rationale: मूल की देहात्मक छवि को बनाए रखता है और हिन्दी के प्रचलित मुहावरे ‘आँखों से नींद उड़ना’ में स्वाभाविक बैठता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दिन और रात की समानांतर संरचना को एक संयुक्त हिन्दी वाक्यांश में रखा गया है, जबकि ‘खा जाते थे’ और ‘आँखों से नींद उड़ जाती थी’ मूल की सजीव रूपकात्मकता बनाए रखते हैं।
