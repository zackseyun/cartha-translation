  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा जा सकता है: “मैदान में, अपने झुंड के पास।” अंतिम पदबंध संभवतः मिलने के स्थान को अधिक ठीक-ठीक बताता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא
  choice: बुलवा भेजा
  rationale: दोनों क्रियाओं—‘भेजना’ और ‘बुलाना’—को स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है, बिना किसी संदेशवाहक या संदेश का स्पष्ट उल्लेख जोड़े।
- source_word: לְרָחֵל וּלְלֵאָה
  choice: राहेल और लिआ
  rationale: व्यक्तिनामों के प्रचलित हिन्दी लिप्यंतरण।
- source_word: הַשָּׂדֶה
  choice: मैदान में
  rationale: שׂדה यहाँ खुले खेत या मैदान को दर्शाता है; प्रसंग में यह बुलाए जाने का स्थान है।
- source_word: אֶל צֹאנוֹ
  choice: अपने झुंड के पास
  rationale: אֶל की स्थानसूचक दिशा और צֹאן के पशु-झुंड के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। ‘अपने’ से स्पष्ट होता है कि झुंड याकूब का था।
