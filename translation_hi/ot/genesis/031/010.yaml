translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। पशु-प्रजनन का वर्णन मूल के अनुरूप सीधा है, पर अनावश्यक रूप से चिकित्सकीय नहीं। तीनों रंग-रूप शब्दों के संभावित भेद को पाठ और पादटिप्पणियों में बनाए रखा गया है।
