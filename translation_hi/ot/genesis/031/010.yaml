  text: וַ/יְהִ֗י בְּ/עֵת֙ יַחֵ֣ם הַ/צֹּ֔אן וָ/אֶשָּׂ֥א עֵינַ֛/י וָ/אֵ֖רֶא בַּ/חֲל֑וֹם וְ/הִנֵּ֤ה הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/010.yaml
  text: And it happened at the time when the flock was mating that I lifted up my eyes and saw in a dream[a], and behold, the male goats that were mounting the flock were striped, speckled[b], and mottled.
translation:
  language: hi
  text: जब रेवड़ के पशु संयोग कर रहे थे, तब मैंने आँखें उठाईं और स्वप्न में देखा। और देखो, जो बकरे रेवड़ की मादाओं पर चढ़ रहे थे, वे धारीदार[a], चित्तीदार और चितकबरे[b] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पट्टीदार’। इब्रानी शब्द पशुओं के शरीर पर पट्टियों या धारियों जैसे निशानों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘धब्बेदार’। रंग-रूप बताने वाले ये तीनों इब्रानी शब्द संभवतः अलग-अलग प्रकार के निशानों का वर्णन करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: जब ... तब
  rationale: हिब्रू की घटना-सूचक और काल-सूचक भूमिका को स्वाभाविक आधुनिक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
- source_word: יַחֵם הַצֹּאן
  choice: रेवड़ के पशु मैथुन कर रहे थे
  rationale: प्रजनन-संदर्भ में יחם पशुओं के कामोत्तेजित होकर संयोग करने को सूचित करता है; यह अनुवाद अर्थ को स्पष्ट रखता है और ‘गर्भ धारण’ जैसा परिणाम मूल में नहीं जोड़ता।
- source_word: וָאֶשָּׂא עֵינַי וָאֵרֶא בַּחֲלוֹם
  choice: मैंने स्वप्न में आँखें उठाकर देखा
  rationale: ‘आँखें उठाना’ मूल हिब्रू मुहावरे की दृश्यात्मकता बनाए रखता है और ‘स्वप्न में’ दर्शन के माध्यम को स्पष्ट करता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: अचानक सामने आए दृश्य पर ध्यान खींचने वाली הִנֵּה की जीवंतता को सहज हिन्दी में बनाए रखता है।
- source_word: הָעַתֻּדִים
  choice: बकरे
  rationale: शब्द प्रजनन करने वाले नर बकरों को दर्शाता है; ‘बकरे’ संक्षिप्त और सामान्य आधुनिक हिन्दी है।
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: रेवड़ की मादाओं पर चढ़ रहे थे
  rationale: मूल की ठोस प्रजनन-छवि को बनाए रखता है। ‘मादाओं’ से हिन्दी में आशय स्पष्ट होता है, जबकि ‘रेवड़ पर चढ़ना’ अस्वाभाविक और संदिग्ध होता।
- source_word: עֲקֻדִּים
  choice: धारीदार
  rationale: पट्टियों या धारियों वाले रंग-चिह्नों का स्पष्ट और सुबोध हिन्दी वर्णन।
- source_word: נְקֻדִּים
  choice: चित्तीदार
  rationale: छोटी चित्तियों या बिंदुनुमा निशानों को व्यक्त करता है और पास के अन्य रंग-रूप शब्दों से यथासंभव अलग रहता है।
- source_word: וּבְרֻדִּים
  choice: चितकबरे
  rationale: मिश्रित या अनियमित रंग-धब्बों वाले रूप को व्यक्त करता है और ‘चित्तीदार’ से आंशिक भेद बनाए रखता है।
