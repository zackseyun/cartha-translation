source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָבָ֔ן הַ/גַּ֨ל הַ/זֶּ֥ה עֵ֛ד בֵּינִ֥/י וּ/בֵינְ/ךָ֖ הַ/יּ֑וֹם עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ גַּלְעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/048.yaml
  text: And Laban said[a], “This heap is a witness between me and you today.” Therefore he called its name Galeed.
translation:
  language: hi
  text: और लाबान ने कहा, “यह पत्थरों का ढेर आज मेरे और तुम्हारे बीच गवाह है।” इसलिए उसने उसका नाम गलेद[a] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “गलेद” इब्रानी शब्दों से बना नाम है, जिसका अर्थ “गवाह का ढेर” है।
    reason: नाम में निहित इब्रानी शब्द-खेल हिन्दी लिप्यंतरण में स्पष्ट नहीं होती।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: और ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘और ... ने कहा’ क्रम को बिना अतिरिक्त समय-सूक्ष्मता जोड़े स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָבָן
  choice: लाबान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: הַגַּל הַזֶּה
  choice: यह पत्थरों का ढेर
  rationale: גַּל का अर्थ ढेर है और प्रसंग में यह पत्थरों का ढेर है; हिन्दी में केवल ‘ढेर’ की अपेक्षा यह अधिक स्पष्ट और स्वाभाविक है।
- source_word: עֵד
  choice: गवाह
  rationale: यह ढेर दोनों पक्षों के बीच प्रमाण-सूचक चिह्न का काम करता है; ‘गवाह’ सामान्य आधुनिक हिन्दी में कानूनी और वाचागत भाव बनाए रखता है।
- source_word: בֵּינִי וּבֵינְךָ
  choice: मेरे और तुम्हारे बीच
  rationale: इब्रानी दोनों एकवचन पक्षों को स्पष्ट रूप से अलग-अलग कहती है; अनुवाद उसी प्रत्यक्षता को सुरक्षित रखता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: आधुनिक हिन्दी में समय-सूचक पद का सीधा और स्वाभाविक समतुल्य।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: नामकरण के कारण को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קָרָא שְׁמוֹ
  choice: उसने उसका नाम ... रखा
  rationale: इब्रानी में कर्ता पुल्लिंग एकवचन है; हिन्दी की स्वाभाविक नामकरण-अभिव्यक्ति ‘नाम रखा’ सक्रिय रूप और संदर्भगत कर्ता को बनाए रखती है।
- source_word: גַּלְעֵד
  choice: गलेद
  rationale: स्थान/स्मारक-नाम को अनूदित करने के बजाय लिप्यंतरित किया गया है; उसका शब्दार्थ पादटिप्पणी में स्पष्ट है।
