source:
  edition: WLC
  text: כִּֽי מִשַּׁ֣שְׁתָּ אֶת כָּל כֵּלַ֗/י מַה מָּצָ֨אתָ֙ מִ/כֹּ֣ל כְּלֵי בֵיתֶ֔/ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖/י וְ/אַחֶ֑י/ךָ וְ/יוֹכִ֖יחוּ בֵּ֥ין שְׁנֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/037.yaml
  text: Since you have searched through all my goods[a], what have you found of all the goods of your house? Set it here before my brothers and your brothers[b], and let them judge between the two of us.
translation:
  language: hi
  text: क्योंकि तुमने मेरा सारा सामान टटोलकर देख लिया है, तो तुम्हें अपने घर के सारे सामान में से क्या मिला? उसे यहाँ मेरे भाइयों और तुम्हारे भाइयों के सामने रखो, और वे हम दोनों के बीच फैसला करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשַּׁשְׁתָּ
  choice: टटोलकर देख लिया
  rationale: क्रिया का मूल भाव हाथ लगाकर या टटोलकर खोजने का है। यह पदबंध गहन तलाशी के संदर्भ को स्वाभाविक हिन्दी में व्यक्त करते हुए उस ठोस भाव को भी बनाए रखता है।
- source_word: כָּל כֵּלַי / מִכֹּל כְּלֵי בֵיתֶךָ
  choice: मेरा सारा सामान / अपने घर के सारे सामान में से
  rationale: כְּלִי यहाँ बर्तन या औज़ार तक सीमित नहीं, बल्कि चल संपत्ति और घरेलू वस्तुओं के व्यापक अर्थ में है। दोनों खंडों में ‘सामान’ की पुनरावृत्ति इब्रानी पुनरावृत्ति को बनाए रखती है; ‘में से’ מִן के अंशवाची भाव को व्यक्त करता है।
- source_word: שִׂים כֹּה
  choice: उसे यहाँ ... रखो
  rationale: कथित रूप से मिली वस्तु को गवाहों के सामने प्रस्तुत करने की सीधी आज्ञा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נֶגֶד
  choice: के सामने
  rationale: यहाँ अर्थ उपस्थित साक्षियों की दृष्टि में सार्वजनिक रूप से वस्तु रखने का है।
- source_word: אַחַי וְאַחֶיךָ
  choice: मेरे भाइयों और तुम्हारे भाइयों
  rationale: ‘भाइयों’ से इब्रानी पारिवारिक शब्द का सीधा रूप सुरक्षित रहता है; संदर्भ में इसमें व्यापक कुटुंबी भी सम्मिलित हो सकते हैं।
- source_word: וְיוֹכִיחוּ
  choice: वे ... फैसला करें
  rationale: इस प्रसंग में हिफ़ील क्रिया का न्यायिक या मध्यस्थतापूर्ण अर्थ है। ‘फैसला करें’ आधुनिक पाठक के लिए स्पष्ट है और विवाद का निर्णय करने की बात व्यक्त करता है।
- source_word: בֵּין שְׁנֵינוּ
  choice: हम दोनों के बीच
  rationale: ‘दोनों’ मूल पाठ में स्पष्ट द्विपक्षीय बल को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण और बोलचाल में समझ आने वाला रूप। एकवचन संबोधन के लिए ‘तुम’ चुना गया है, क्योंकि इब्रानी व्याकरणिक रूप सम्मान-स्तर निर्धारित नहीं करता और ‘तू’ आधुनिक हिन्दी में अनावश्यक रूप से अपमानसूचक लग सकता है।
