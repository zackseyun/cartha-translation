base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/025.yaml
  text: And Laban caught up with Jacob[a]. Now Jacob had pitched his tent in the hill country[c][b], and Laban pitched with his kinsmen in the hill country of Gilead.
translation:
  language: hi
  text: तब लाबान याकूब तक पहुँच गया[a]। याकूब पहाड़ी प्रदेश[c] में अपना तंबू गाड़ चुका था, और लाबान ने अपने कुटुंबियों[b] के साथ गिलाद के पहाड़ी प्रदेश में डेरा डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याकूब को जा पकड़ा” या “याकूब के पास जा पहुँचा।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “अपने भाइयों”; यहाँ सम्भवतः उसके कुटुंबी या कुल के सदस्य।
    reason: lexical_alternative
  - marker: c
    text: या, “पहाड़ पर”; संदर्भ में सम्भवतः “गिलाद पर्वत पर” या “गिलाद के पहाड़ों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשֵּׂג
  choice: जा पकड़ा
  rationale: पीछा करके किसी तक पहुँच जाने के भाव को व्यक्त करता है; यहाँ इसका अर्थ बंदी बना लेना नहीं है। वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: תָּקַע ... אָהֳלוֹ
  choice: अपना तंबू गाड़ चुका था
  rationale: तंबू के साथ प्रयुक्त क्रिया का स्वाभाविक हिन्दी मुहावरा ‘तंबू गाड़ना’ है। पूर्वपूर्ण रूप से स्पष्ट होता है कि लाबान के पहुँचने से पहले याकूब वहाँ पड़ाव डाल चुका था।
- source_word: בָּהָר
  choice: पहाड़ी प्रदेश
  rationale: הַר एक पहाड़ अथवा व्यापक पर्वतीय/पहाड़ी क्षेत्र, दोनों को सूचित कर सकता है। प्रसंग में क्षेत्रवाचक अनुवाद स्वाभाविक है, जबकि वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
- source_word: תָּקַע אֶת אֶחָיו
  choice: अपने कुटुंबियों के साथ ... डेरा डाला
  rationale: वाक्यांश संक्षिप्त है और समानांतर पहले खंड से पड़ाव डालने का भाव ग्रहण करता है। ‘डेरा डाला’ हिन्दी में स्वाभाविक है और मूल में स्पष्ट न किए गए अनेक तंबुओं को नहीं जोड़ता।
- source_word: אֶחָיו
  choice: अपने कुटुंबियों
  rationale: शाब्दिक अर्थ ‘अपने भाइयों’ है, परन्तु इस प्रसंग में शब्द व्यापक रिश्तेदारी या कुल के साथियों को सूचित करता है।
- source_word: בְּהַר הַגִּלְעָד
  choice: गिलाद के पहाड़ी प्रदेश में
  rationale: संरचना का शाब्दिक रूप ‘गिलाद के पहाड़ पर’ हो सकता है, लेकिन प्रसंग में गिलाद का ऊँचा पर्वतीय क्षेत्र अभिप्रेत हो सकता है; हिन्दी में क्षेत्रवाचक रूप सहज है।
