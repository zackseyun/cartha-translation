source:
  edition: WLC
  text: וְ/הַ/מִּצְפָּה֙ אֲשֶׁ֣ר אָמַ֔ר יִ֥צֶף יְהוָ֖ה בֵּינִ֣/י וּ/בֵינֶ֑/ךָ כִּ֥י נִסָּתֵ֖ר אִ֥ישׁ מֵ/רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/049.yaml
  text: And Mizpah[a], because he said[b], “May Yahweh watch between me and you when we are hidden from each other.”
translation:
  language: hi
  text: और मिस्पा[a], क्योंकि उसने कहा, “याहवे मेरे और तुम्हारे बीच नज़र रखे, जब हम एक-दूसरे की दृष्टि से ओझल हों[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मिस्पा’ नाम इब्रानी शब्द से जुड़ा है, जिसका अर्थ ‘पहरे की मीनार’ या ‘निगरानी की जगह’ है; इस प्रकार यह नाम आगे आने वाले ‘नज़र रखे’ से जुड़ता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, ‘जब हम एक-दूसरे से छिपे हों’; अर्थात जब हम एक-दूसरे की दृष्टि से दूर हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמִּצְפָּה
  choice: और मिस्पा भी
  rationale: यहाँ מִצְפָּה स्थान-नाम के रूप में प्रयुक्त है और पिछले पद के नामकरण को आगे बढ़ाता है। ‘मिस्पा’ रखने से नाम और צפה (‘निगरानी रखना/देखना’) के बीच का शब्द-संबंध बचा रहता है।
- source_word: אֲשֶׁר אָמַר
  choice: क्योंकि उसने कहा
  rationale: यह पद नाम रखे जाने का कारण बताता है। ‘उसने इसका नाम रखा’ मूल पाठ में स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: יִצֶף
  choice: निगरानी रखे
  rationale: צפה का अर्थ ‘देखते रहना, निगरानी रखना’ है। इच्छासूचक क्रिया-रूप को ‘रखे’ से व्यक्त किया गया है और मिस्पा नाम से जुड़ा शब्दालंकार भी बना रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: בֵּינִי וּבֵינֶךָ
  choice: मेरे और तेरे बीच
  rationale: मूल शब्दक्रम और दोनों वाचा-पक्षों के बीच के संबंध को सीधे रूप में रखा गया है।
- source_word: כִּי נִסָּתֵר אִישׁ מֵרֵעֵהוּ
  choice: जब हम एक-दूसरे की दृष्टि से ओझल हों
  rationale: כִּי यहाँ परिस्थिति सूचित करता है; निफ़अल נִסָּתֵר का मूल भाव ‘छिपा/दृष्टि से ओझल होना’ है। אִישׁ מֵרֵעֵהוּ के पारस्परिक अर्थ को स्वाभाविक हिन्दी ‘एक-दूसरे’ से व्यक्त किया गया है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम יְהוָה है। ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: याहवे की ‘निगरानी’ का आशय
  choice: निगरानी रखे
  alternative: हमारी रक्षा करे
  rationale: संदर्भ में यह कथन केवल सुरक्षा या आशीष की प्रार्थना नहीं, बल्कि अलग रहने पर दोनों पक्षों पर परमेश्वर की निगाह और साक्षी होने का गंभीर भाव भी रखता है। इसलिए अस्पष्टता और तनाव को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में एकवचन ‘तेरे’ मूल इब्रानी के एकवचन संबोधन को दर्शाता है। नामकरण का प्रसंग पिछले पद से चलता है, इसलिए आरंभिक संयोजक ‘और’ तथा ‘भी’ बनाए गए हैं।
