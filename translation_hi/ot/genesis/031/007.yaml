  text: וַ/אֲבִי/כֶן֙ הֵ֣תֶל בִּ֔/י וְ/הֶחֱלִ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֣רֶת מֹנִ֑ים וְ/לֹֽא נְתָנ֣/וֹ אֱלֹהִ֔ים לְ/הָרַ֖ע עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/007.yaml
  text: Yet your father has deceived me and changed my wages ten times[c][b][a], but God did not allow him to harm me.
translation:
  language: hi
  text: फिर भी तुम्हारे पिता ने मुझे धोखा दिया और मेरी मज़दूरी दस बार[a] बदल दी; पर परमेश्वर ने उसे मुझे हानि पहुँचाने नहीं दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘दस बार’; यह बार-बार किए गए बदलावों के लिए एक रूढ़िपरक अभिव्यक्ति भी हो सकती है, इसलिए संख्या आवश्यक नहीं कि ठीक-ठीक गिनती हो।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, ‘परमेश्वर ने उसे मेरे विरुद्ध बुरा करने के लिए नहीं दिया,’ अर्थात परमेश्वर ने उसे ऐसा करने की अनुमति या अवसर नहीं दिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתֶל
  choice: धोखा दिया
  rationale: हिफ़ील रूप यहाँ छलपूर्ण या उपहासपूर्ण व्यवहार सूचित कर सकता है। मज़दूरी बार-बार बदलने के संदर्भ में ‘धोखा दिया’ स्वाभाविक और सटीक है, जबकि क्रिया की व्यापक अर्थ-छाया को टिप्पणी में बताया गया है।
- source_word: וְהֶחֱלִף
  choice: बदल दी
  rationale: यह सहमत पारिश्रमिक में परिवर्तन करने को व्यक्त करता है; ‘बदल दी’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: מַשְׂכֻּרְתִּי
  choice: मेरी मज़दूरी
  rationale: संज्ञा श्रम के बदले मिलने वाले वेतन या पारिश्रमिक को दर्शाती है। ‘मज़दूरी’ इस कामकाजी संदर्भ में साधारण पाठक के लिए स्पष्ट है।
- source_word: עֲשֶׂרֶת מֹנִים
  choice: दस बार
  rationale: इब्रानी पदबंध का सीधा अर्थ ‘दस बार’ है और यह बार-बार किए गए परिवर्तन का रूढ़िपरक संकेत भी हो सकता है; मूल संख्या को पाठ में बनाए रखा गया है।
- source_word: וְלֹא נְתָנוֹ אֱלֹהִים
  choice: पर परमेश्वर ने उसे ... नहीं दिया
  rationale: शाब्दिक संरचना ‘परमेश्वर ने उसे नहीं दिया’ अनुमति या अवसर न देने का भाव रखती है। हिन्दी में ‘करने नहीं दिया’ इस मुहावरे का स्वाभाविक अर्थ व्यक्त करता है।
- source_word: לְהָרַע עִמָּדִי
  choice: मेरा अहित करने
  rationale: यह पद किसी के साथ बुरा करने या उसे हानि पहुँचाने को दर्शाता है। ‘मेरा अहित करने’ संक्षिप्त, गरिमापूर्ण और अर्थानुकूल है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: याकूब के कथन में यह इस्राएल के परमेश्वर के लिए प्रयुक्त है; मानक हिन्दी बाइबलीय शैली में ‘परमेश्वर’ उपयुक्त है।
theological_decisions:
- issue: ‘परमेश्वर ने उसे नहीं दिया’ में ईश्वरीय रोक
  choice: परमेश्वर ने लाबान को याकूब का अहित करने नहीं दिया
  alternative: परमेश्वर ने याकूब को उसके हाथ में नहीं सौंपा / उसे अहित में सफल नहीं होने दिया
  rationale: इब्रानी मुहावरा परमेश्वर द्वारा अवसर या अनुमति रोके जाने को व्यक्त करता है। अनुवाद इस सक्रिय संरक्षण को बनाए रखता है, पर यह निर्धारित नहीं करता कि रोक किस साधन से हुई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। ‘धोखा दिया’ मज़दूरी बदलने के संदर्भ में הֵתֶל का प्रमुख भाव देता है; ‘मज़दूरी’ श्रम-संबंधी परिस्थिति को स्पष्ट रखता है। सभी टिप्पणियों के चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
