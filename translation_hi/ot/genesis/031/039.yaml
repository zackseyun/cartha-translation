source:
  edition: WLC
  text: טְרֵפָה֙ לֹא הֵבֵ֣אתִי אֵלֶ֔י/ךָ אָנֹכִ֣י אֲחַטֶּ֔/נָּה מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נָּה גְּנֻֽבְתִ֣י י֔וֹם וּ/גְנֻֽבְתִ֖י לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/039.yaml
  text: I did not bring to you an animal torn by beasts[a]; I myself bore the loss of it. You required it from my hand[b], whether stolen by day or stolen by night.
translation:
  language: hi
  text: जिस पशु को जंगली जानवरों ने फाड़ डाला था, उसे मैं आपके पास नहीं लाया; मैं स्वयं उसकी भरपाई करता था।[a] दिन में चोरी हुए पशु का भी और रात में चोरी हुए पशु का भी हिसाब आप मुझसे लेते थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं स्वयं उसकी हानि उठाता था।” इब्रानी क्रिया यहाँ उस पशु की हानि का दायित्व उठाने या उसकी भरपाई करने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “आप उसे मेरे हाथ से माँगते थे।” यह व्यक्तिगत जवाबदेही का इब्रानी मुहावरा है।
    reason: idiom
lexical_decisions:
- source_word: טְרֵפָה
  choice: जिस पशु को जंगली जानवरों ने फाड़ डाला था
  rationale: चरवाही के इस प्रसंग में यह शब्द हिंसक पशु द्वारा फाड़े गए मवेशी को सूचित करता है। हिंदी में कर्ता को स्पष्ट करने से अर्थ स्वाभाविक और ठोस रहता है।
- source_word: הֵבֵאתִי אֵלֶיךָ
  choice: उसे मैं आपके पास नहीं लाया
  rationale: ביא के साथ אֶל किसी व्यक्ति के पास वस्तु लाने का भाव देता है। हिंदी में निहित कर्म को ‘उसे’ से स्पष्ट किया गया है।
- source_word: אָנֹכִי אֲחַטֶּנָּה
  choice: मैं स्वयं उसकी भरपाई करता था
  rationale: स्वतंत्र सर्वनाम אָנֹכִי का बल ‘मैं स्वयं’ से सुरक्षित है। यहाँ חטא का पिएल रूप हानि का दायित्व उठाने या उसकी भरपाई करने के अर्थ में प्रयुक्त है।
- source_word: מִיָּדִי תְּבַקְשֶׁנָּה
  choice: हिसाब आप मुझसे लेते थे
  rationale: शाब्दिक ‘मेरे हाथ से माँगते थे’ हिंदी में अस्वाभाविक है; इस इब्रानी मुहावरे का आशय व्यक्तिगत जवाबदेही ठहराना है, जिसे ‘हिसाब लेना’ सहज रूप में व्यक्त करता है।
- source_word: גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה
  choice: दिन में चोरी हुए पशु का भी और रात में चोरी हुए पशु का भी
  rationale: दोनों समन्वित श्रेणियों और וּ के योगात्मक बल को ‘का भी...का भी’ से सुरक्षित रखा गया है, ताकि इन्हें फाड़े गए पशु की वैकल्पिक परिस्थितियाँ न समझा जाए।
