  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बोलचाल-सुलभ शैली रखी गई है। राहेल और लिआ को किए गए स्त्रीलिंग द्विवचन-सदृश संबोधन को हिन्दी के ‘तुम दोनों स्वयं जानती हो’ से स्पष्ट किया गया है।
