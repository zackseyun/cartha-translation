source:
  edition: WLC
  text: וְ/אַתֵּ֖נָה יְדַעְתֶּ֑ן כִּ֚י בְּ/כָל כֹּחִ֔/י עָבַ֖דְתִּי אֶת אֲבִי/כֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/006.yaml
  text: And you yourselves know that I have served your father with all my strength[a].
translation:
  language: hi
  text: और तुम दोनों स्वयं जानती हो कि मैंने अपनी पूरी शक्ति से तुम्हारे पिता की सेवा की है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे पिता के लिए काम किया है।” इब्रानी क्रिया का अर्थ “सेवा करना” या “काम करना” हो सकता है; लाबान के अधीन याकूब के वर्षों के श्रम के प्रसंग में दोनों अर्थ उपयुक्त हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֵּנָה
  choice: और तुम दोनों स्वयं
  rationale: וְ को सामान्य संयोजक ‘और’ के रूप में रखा गया है। स्वतंत्र स्त्रीलिंग बहुवचन सर्वनाम बल देता है और राहेल तथा लिआ—दोनों—को संबोधित करता है; इसलिए ‘दोनों स्वयं’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְדַעְתֶּן
  choice: जानती हो
  rationale: ידע का कालगत पूर्ण रूप यहाँ पहले से प्राप्त और वर्तमान में बनी हुई जानकारी की अवस्था बताता है; आधुनिक हिन्दी में ‘जानती हो’ स्वाभाविक है। स्त्रीलिंग बहुवचन रूप को भी सुरक्षित रखा गया है।
- source_word: כִּי
  choice: कि
  rationale: यह उनके जानने की विषय-वस्तु प्रस्तुत करता है, इसलिए ‘कि’ उपयुक्त है।
- source_word: בְּ/כָל כֹּחִי
  choice: अपनी पूरी शक्ति से
  rationale: כֹּחַ शक्ति, सामर्थ्य या बल को सूचित करता है। श्रम के इस प्रसंग में ‘अपनी पूरी शक्ति से’ सम्पूर्ण प्रयास को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עָבַדְתִּי
  choice: सेवा की है
  rationale: עבד का अर्थ ‘सेवा करना’ या ‘काम करना’ दोनों हो सकता है। व्यक्ति को प्रत्यक्ष कर्म के रूप में लेने वाली इब्रानी रचना के निकट रहते हुए मुख्य पाठ में ‘सेवा की है’ रखा गया है; श्रम का वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֶת אֲבִיכֶן
  choice: तुम्हारे पिता की
  rationale: हिन्दी में ‘सेवा करना’ के साथ व्यक्ति संबंधकारक में आता है, इसलिए इब्रानी के प्रत्यक्ष कर्म को स्वाभाविक रूप से ‘तुम्हारे पिता की सेवा’ कहा गया है। प्रत्यय स्त्रीलिंग बहुवचन संबोधन को दर्शाता है, जिसे ‘तुम दोनों’ स्पष्ट करता है।
