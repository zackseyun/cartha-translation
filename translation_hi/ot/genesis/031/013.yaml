base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/013.yaml
  text: I am the God of Bethel[a], where you anointed a pillar and where you vowed a vow to me. Now arise, go out from this land[b], and return to the land of your birth.
translation:
  language: hi
  text: “मैं बेतेल का परमेश्वर हूँ[a], जहाँ तुमने एक स्तम्भ का अभिषेक किया था और मुझसे मन्नत मानी थी[b]। अब उठो, इस देश से निकल जाओ और अपनी जन्मभूमि को लौट जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेतेल’ का अर्थ ‘परमेश्वर का घर’ है; यहाँ यह एक स्थान का नाम है।
    reason: cultural_note
  - marker: b
    text: 'मूल इब्रानी में ‘मन्नत मानने’ वाली क्रिया और ‘मन्नत’ संज्ञा साथ आती हैं: शाब्दिक रूप से, ‘तुमने मुझसे एक मन्नत मानी।’ यह बात पर बल देता है।'
    reason: lexical_note
lexical_decisions:
- source_word: הָאֵל
  choice: परमेश्वर
  rationale: निश्चित उपपद सहित यह पद वक्ता की पहचान इस्राएल के परमेश्वर के रूप में कराता है; ‘परमेश्वर’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: यह स्थान का नाम है, इसलिए इसके घटकों का अनुवाद ‘परमेश्वर का घर’ करके मुख्य पाठ में नहीं रखा गया।
- source_word: מָשַׁחְתָּ ... מַצֵּבָה
  choice: पत्थर के एक स्तम्भ का अभिषेक किया था
  rationale: ‘अभिषेक’ मूल क्रिया की धार्मिक-सांकेतिक क्रिया को बनाए रखता है, और ‘पत्थर का स्तम्भ’ याकूब द्वारा खड़े किए गए स्मारक-पत्थर को स्पष्ट करता है।
- source_word: נָדַרְתָּ לִּי ... נֶדֶר
  choice: मेरे लिए मन्नत मानी थी
  rationale: यह स्वाभाविक हिन्दी में दत्तिव ‘मेरे लिए’ तथा मूल के क्रिया-संज्ञा संयोजन का प्रभाव बनाए रखता है।
- source_word: קוּם צֵא
  choice: उठो, ... निकल जाओ
  rationale: क्रमिक आज्ञाओं को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है; ‘निकल जाओ’ किसी क्षेत्र को छोड़ने के प्रसंग के अनुकूल है।
- source_word: הָאָרֶץ הַזֹּאת
  choice: इस देश
  rationale: यहाँ אֶרֶץ पूरी पृथ्वी नहीं, बल्कि उस भूभाग या देश को सूचित करता है जहाँ याकूब रह रहा था।
- source_word: אֶרֶץ מוֹלַדְתֶּךָ
  choice: अपनी जन्मभूमि
  rationale: यह संक्षिप्त और स्वाभाविक हिन्दी अभिव्यक्ति जन्म, मूल स्थान और अपने देश की संयुक्त धारणा को व्यक्त करती है, बिना अर्थ को केवल रिश्तेदारों तक सीमित किए।
theological_decisions:
- issue: वक्ता की पहचान ‘बेतेल के परमेश्वर’ के रूप में
  choice: मैं बेतेल का परमेश्वर हूँ
  alternative: मैं वह परमेश्वर हूँ जो बेतेल में प्रकट हुआ था
  rationale: मूल की संक्षिप्त पहचान को बनाए रखा गया है। विस्तृत विकल्प प्रसंगानुसार सही हो सकता है, पर वह ‘प्रकट हुआ था’ जैसी बात जोड़ता है जो इस पद में स्पष्ट रूप से नहीं कही गई।
- issue: क्या ‘बेतेल का परमेश्वर’ किसी स्थानीय देवता को सूचित करता है
  choice: परमेश्वर
  alternative: बेतेल का देवता
  rationale: प्रत्यक्ष ईश्वरीय वाणी और निश्चित पदरचना वक्ता को याकूब से पहले मिलने वाले परमेश्वर के रूप में पहचानती है; ‘देवता’ बहुदेववादी या स्थानीय देवता का अनचाहा संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘पत्थर का स्तम्भ,’ ‘मन्नत मानी’ और ‘जन्मभूमि’ प्रसंग को स्वाभाविक रखते हुए मूल की ठोस छवियों और अर्थगत तनाव को सुरक्षित रखते हैं।
