  text: זֶה לִּ֞/י עֶשְׂרִ֣ים שָׁנָה֮ בְּ/בֵיתֶ/ךָ֒ עֲבַדְתִּ֜י/ךָ אַרְבַּֽע עֶשְׂרֵ֤ה שָׁנָה֙ בִּ/שְׁתֵּ֣י בְנֹתֶ֔י/ךָ וְ/שֵׁ֥שׁ שָׁנִ֖ים בְּ/צֹאנֶ֑/ךָ וַ/תַּחֲלֵ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֥רֶת מֹנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/041.yaml
  text: 'These twenty years I have been in your house: I served you fourteen years for your two daughters[a], and six years for your flock, and you changed my wages ten times.'
translation:
  language: hi
  text: ये बीस वर्ष मैं तेरे घर में रहा हूँ[a]। मैंने तेरी दोनों बेटियों के लिए चौदह वर्ष और तेरे झुंड के लिए छह वर्ष तेरी सेवा की, और तूने मेरी मजदूरी दस बार बदल दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे तेरे घर में रहते हुए ये बीस वर्ष हो गए।”
    reason: हिब्रू का आरम्भिक, क्रियारहित वाक्यांश זֶה לִּי עֶשְׂרִים שָׁנָה अवधि और वक्ता से उसके संबंध को एक साथ व्यक्त करता है; हिन्दी में इसे एक से अधिक स्वाभाविक ढंग से समझाया जा सकता है।
lexical_decisions:
- source_word: זֶה לִּי עֶשְׂרִים שָׁנָה
  choice: ये बीस वर्ष
  rationale: यह स्वाभाविक हिन्दी में अवधि को प्रमुखता से सामने रखता है और זֶה के संकेतात्मक बल तथा לִּי के वक्ता-संबंध को यथासंभव बनाए रखता है।
- source_word: בְּבֵיתֶךָ
  choice: तेरे घर में
  rationale: בַּיִת का ठोस अर्थ ‘घर’ है; प्रसंग में इसमें लाबान का गृहस्थ प्रतिष्ठान भी समाहित है, इसलिए अधिक व्याख्यात्मक ‘तेरे साथ’ नहीं चुना गया।
- source_word: עֲבַדְתִּיךָ
  choice: तेरी सेवा की
  rationale: עבד यहाँ श्रम और व्यक्तिगत सेवा दोनों का बोध कराता है; ‘सेवा की’ इन दोनों पहलुओं को बनाए रखता है।
- source_word: בִּשְׁתֵּי בְנֹתֶיךָ
  choice: तेरी दोनों बेटियों के लिए
  rationale: यहाँ בְּ सेवा के प्रतिफल अथवा उद्देश्य को सूचित करता है। ‘के लिए’ विवाह-संबंधी सेवा की व्यवस्था को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: בְּצֹאנֶךָ
  choice: तेरी भेड़-बकरियों के झुंड के लिए
  rationale: צֹאן छोटे पालतू पशुओं, विशेषतः भेड़ों और बकरियों, का सामूहिक बोध कराता है। यह चयन केवल ‘भेड़ों’ की अपेक्षा अधिक सटीक और आधुनिक हिन्दी में स्पष्ट है।
- source_word: וַתַּחֲלֵף אֶת מַשְׂכֻּרְתִּי
  choice: फिर भी तूने मेरी मजदूरी ... बदल दी
  rationale: חלף के हिफ़ील रूप का अर्थ बदलना अथवा दूसरे से प्रतिस्थापित करना है। ‘फिर भी’ प्रसंग में शिकायत का विरोधात्मक संबंध स्वाभाविक रूप से प्रकट करता है; ‘मजदूरी’ श्रम के प्रतिफल के लिए स्पष्ट शब्द है।
- source_word: עֲשֶׂרֶת מֹנִים
  choice: दस बार
  rationale: यह बार-बार परिवर्तन बताने वाला हिब्रू मुहावरा है; शाब्दिक ‘दस गणनाएँ’ हिन्दी में अस्पष्ट होगा।
