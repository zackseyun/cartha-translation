  text: אֱלֹהֵ֨י אַבְרָהָ֜ם וֵֽ/אלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔י/נוּ אֱלֹהֵ֖י אֲבִי/הֶ֑ם וַ/יִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּ/פַ֖חַד אָבִ֥י/ו יִצְחָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/053.yaml
  text: May the God of Abraham and the god of Nahor[a], the god of their father, judge between us[c][b]. And Jacob swore by the Fear of his father Isaac.
translation:
  language: hi
  text: “अब्राहम का परमेश्वर और नाहोर का देवता[a]—उनके पिता का देवता[c]—हम दोनों के बीच न्याय करें।” तब याकूब ने अपने पिता इसहाक के ‘भय’[b] की शपथ खाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब्राहम का परमेश्वर और नाहोर का परमेश्वर।” इब्रानी को पूरे वाक्य में एक ही परमेश्वर का उल्लेख मानकर भी पढ़ा जा सकता है। मुख्य पाठ मूल की अस्पष्टता बनाए रखता है।
    reason: alternative_reading
  - marker: b
    text: “अपने पिता इसहाक का भय” परमेश्वर के लिए एक असामान्य पदवी है; मूल में शाब्दिक रूप से “भय” या “दहशत” अर्थ वाली संज्ञा प्रयुक्त है।
    reason: lexical_alternative
  - marker: c
    text: 'या, अल्पविरामों के साथ: “नाहोर का देवता, उनके पिता का देवता,” अर्थात यह वाक्यांश पिछले उल्लेख की व्याख्या हो सकता है।'
    reason: previous_rendering
lexical_decisions:
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: अब्राहम का परमेश्वर
  rationale: यहाँ אֱלֹהֵי रूप की दृष्टि से बहुवचन-संबंध रूप है, पर अब्राहम के एक परमेश्वर के लिए प्रचलित एकवचन अर्थ रखता है।
- source_word: וֵאלֹהֵי נָחוֹר
  choice: और नाहोर का देवता
  rationale: ‘देवता’ नाहोर से संबद्ध ईश्वर-संदर्भ को अब्राहम के परमेश्वर के साथ बिना समयपूर्व एकरूप किए प्रस्तुत करता है और मूल की धार्मिक अस्पष्टता बनाए रखता है।
- source_word: אֱלֹהֵי אֲבִיהֶם
  choice: उनके पिता का देवता
  rationale: इसे पिछले आह्वान की समानाधिकरणीय व्याख्या के रूप में रखा गया है; हिंदी में एकवचन ‘देवता’ मूल के संभावित साझा पैतृक देव-संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִשְׁפְּטוּ
  choice: न्याय करें
  rationale: आह्वान के बाद अपूर्ण क्रिया यहाँ कामनार्थक/विधिलिंग भाव रखती है। हिंदी आदरसूचक/विधिलिंग ‘करें’ मूल के बहुवचन रूप को भी सहजता से समेटता है।
- source_word: בֵינֵינוּ
  choice: हम दोनों के बीच
  rationale: वाचा के दो पक्षों के प्रसंग में यह पारस्परिक अर्थ को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַיִּשָּׁבַע
  choice: तब ... ने ... शपथ खाई
  rationale: कथात्मक क्रम को स्वाभाविक हिंदी में व्यक्त करने के लिए ‘तब’ और सामान्य मुहावरा ‘शपथ खाई’ प्रयुक्त है।
- source_word: בְּפַחַד
  choice: भय की
  rationale: פַחַד का शाब्दिक अर्थ ‘भय/दहशत’ है और यहाँ यह परमेश्वर के लिए असामान्य पदवी के रूप में आता है; ‘भय’ उस विशिष्टता को बिना व्याख्यात्मक सरलीकरण के बनाए रखता है।
- source_word: אָבִיו יִצְחָק
  choice: अपने पिता इसहाक के
  rationale: ‘अपने’ स्पष्ट करता है कि पिता याकूब का है; ‘पिता इसहाक’ हिंदी में समानाधिकरण का सहज रूप है।
theological_decisions:
- issue: क्या लाबान द्वारा पुकारे गए सभी ईश्वर-संदर्भों को एक ही परमेश्वर के रूप में स्पष्ट कर दिया जाए
  choice: ‘अब्राहम का परमेश्वर’ लेकिन ‘नाहोर का देवता—उनके पिता का देवता’
  alternative: ‘अब्राहाम का परमेश्वर और नाहोर का परमेश्वर, उनके पिता का परमेश्वर’
  rationale: मूल में אֱלֹהֵי की पुनरावृत्ति, बहुवचन क्रिया और लाबान का व्यापक पारिवारिक आह्वान है, जबकि याकूब की शपथ अलग ढंग से ‘अपने पिता इसहाक के भय’ के नाम पर है। अलग हिंदी शब्दावली इस तनाव को मिटाती नहीं है।
- issue: בְּפַחַד אָבִיו יִצְחָק में याकूब की शपथ का स्वरूप
  choice: ‘अपने पिता इसहाक के भय की शपथ खाई’
  alternative: ‘उस परमेश्वर की शपथ खाई जिससे उसके पिता इसहाक डरते थे’
  rationale: मूल ‘भय’ संज्ञा को एक असामान्य ईश्वरीय पदवी की तरह रखता है। शाब्दिक पदवी को बनाए रखने से विशिष्ट धर्मवैचारिक अभिव्यक्ति सुरक्षित रहती है और अर्थ का अनावश्यक विस्तार नहीं होता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज कथात्मक शैली। ‘परमेश्वर/देवता’ का अंतर मूल की धार्मिक अस्पष्टता और वक्ताओं के भिन्न दृष्टिकोण को बचाने के लिए जानबूझकर रखा गया है। ‘भय’ को असामान्य ईश्वरीय पदवी के रूप में संरक्षित किया गया है; सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
