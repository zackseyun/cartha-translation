  yaml_path: translation/ot/genesis/031/022.yaml
  text: On the third day[a], Laban was told that Jacob had fled.
translation:
  language: hi
  text: तीसरे दिन लाबान को बताया गया कि याकूब भाग गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: बताया गया
  rationale: हिफ़अल का कर्मवाच्य रूप सूचना पहुँचाए जाने को व्यक्त करता है। हिंदी में ‘लाबान को बताया गया’ स्वाभाविक है और अज्ञात सूचना-दाता को जोड़े बिना कर्मवाच्य अर्थ बनाए रखता है।
- source_word: לְלָבָן
  choice: लाबान को
  rationale: לְ यहाँ सूचना पाने वाले अप्रत्यक्ष कर्म को चिह्नित करता है; हिंदी में इसे ‘को’ से व्यक्त करना स्वाभाविक है।
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: यह कालवाचक पदबंध सीधे ‘तीसरे दिन’ है। मूल पाठ में ‘उसके बाद’ स्पष्ट रूप से नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי बताई गई सूचना की विषय-वस्तु आरंभ करता है, इसलिए हिंदी का ‘कि’ उपयुक्त है।
- source_word: בָרַח
  choice: भाग गया था
  rationale: ברח का अर्थ भाग जाना या पलायन करना है। ‘भाग गया था’ सामान्य आधुनिक हिंदी में स्वाभाविक है और सूचना दिए जाने से पहले घट चुकी क्रिया को पूर्ण भूतकाल से दर्शाता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: व्यक्तिनाम का प्रचलित मानक हिंदी बाइबलीय रूप अपनाया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, सहज और गरिमापूर्ण कथात्मक शैली। मूल इब्रानी के कर्मवाच्य कथन और घटनाक्रम को बनाए रखा गया है। अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी को नहीं अपनाया गया, क्योंकि उसका विकल्प इसी इब्रानी पद के सामान्य कर्मवाच्य अर्थ का अंग्रेज़ी शैलीगत रूपांतर है और हिंदी में अलग पाठगत अर्थ नहीं देता।
