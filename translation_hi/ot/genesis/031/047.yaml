  text: וַ/יִּקְרָא ל֣/וֹ לָבָ֔ן יְגַ֖ר שָׂהֲדוּתָ֑א וְ/יַֽעֲקֹ֔ב קָ֥רָא ל֖/וֹ גַּלְעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/047.yaml
  text: Laban called it Jegar-sahadutha[b][a], but Jacob called it Galeed.
translation:
  language: hi
  text: लाबान ने उसे यगर-सहदूता[a] कहा, पर याकूब ने उसे गलेद[b] कहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यगर-सहदूता” अरामी में “गवाही का ढेर” या “साक्षी का टीला” है।
    reason: lexical_alternative
  - marker: b
    text: “गलेद” इब्रानी में “गवाही का ढेर” या “साक्षी का टीला” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לּוֹ
  choice: ने उसे ... कहा
  rationale: नाम रखने के प्रसंग में קרא का अर्थ ‘कहना/नाम देना’ है। ‘उसे ... कहा’ इब्रानी वाक्य-विन्यास के निकट रहते हुए स्वाभाविक हिन्दी है और पुल्लिंग प्रत्यय को प्रसंगानुसार पत्थरों के ढेर के लिए व्यक्त करता है।
- source_word: לָבָן
  choice: लाबान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: יְגַר שָׂהֲדוּתָא
  choice: यगर-सहदूता
  rationale: लाबान द्वारा दिया गया अरामी नाम मुख्य पाठ में लिप्यंतरित किया गया है, ताकि नामकरण और भाषा-भेद सुरक्षित रहें; उसका अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְיַעֲקֹב
  choice: पर याकूब
  rationale: ו सामान्यतः ‘और’ है, किंतु यहाँ एक ही ढेर के लिए लाबान के अरामी और याकूब के इब्रानी नामों का स्पष्ट विरोध है; इसलिए ‘पर’ प्रसंगानुकूल है।
- source_word: גַּלְעֵד
  choice: गलेद
  rationale: याकूब द्वारा दिए गए इब्रानी नाम का लिप्यंतरण किया गया है। यह अरामी नाम के समानार्थी है, और अर्थ पादटिप्पणी में रखा गया है।
