base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/054.yaml
  text: Then Jacob offered a sacrifice on the mountain and called his brothers to eat bread[a]. They ate bread and spent the night on the mountain.
translation:
  language: hi
  text: तब याकूब ने उस पहाड़ पर एक बलिदान चढ़ाया और अपने भाइयों को रोटी खाने के लिए बुलाया।[a] उन्होंने रोटी खाई और उस पहाड़ पर रात बिताई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने कुटुंबियों” अथवा “अपने संबंधियों”; यहाँ “भाई” का इब्रानी शब्द व्यापक अर्थ में पुरुष संबंधियों या साथियों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח יַעֲקֹב זֶבַח
  choice: याकूब ने...एक बलिदान चढ़ाया
  rationale: इब्रानी में क्रिया और उसी मूल की संज्ञा का प्रयोग है। हिंदी में ‘बलिदान चढ़ाया’ बलिदान-संबंधी अर्थ को स्वाभाविक ढंग से व्यक्त करता है, जबकि मूल की संज्ञा भी स्पष्ट रखता है।
- source_word: בָּהָר
  choice: उस पहाड़ पर
  rationale: הַר का अर्थ पहाड़ अथवा पहाड़ी क्षेत्र हो सकता है; निश्चित उपपद और इसी प्रसंग में पहले उल्लिखित स्थान के कारण ‘उस पहाड़ पर’ उपयुक्त है।
- source_word: וַיִּקְרָא
  choice: बुलाया
  rationale: קרא का सीधा अर्थ ‘बुलाना’ है। प्रसंग में निमंत्रण का भाव है, पर मुख्य पाठ स्रोत के निकट रहता है।
- source_word: לְאֶחָיו
  choice: अपने भाइयों को
  rationale: אָח का सामान्य अर्थ ‘भाई’ है, यद्यपि प्रसंगानुसार यह व्यापक पुरुष संबंधियों या साथियों को भी सूचित कर सकता है। मुख्य पाठ में पारिवारिक शब्द को बनाए रखा गया है और व्यापक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: לֶאֱכָל לָחֶם / וַיֹּאכְלוּ לֶחֶם
  choice: रोटी खाने के लिए / उन्होंने रोटी खाई
  rationale: ‘रोटी खाना’ भोजन करने का इब्रानी मुहावरा है। हिंदी में भी यह समझने योग्य है और मूल की पुनरावृत्ति तथा साझे भोजन के भाव को बनाए रखता है।
- source_word: וַיָּלִינוּ
  choice: रात बिताई
  rationale: לון का अर्थ रात भर ठहरना है; ‘रात बिताई’ आधुनिक हिंदी में स्वाभाविक और सटीक है।
theological_decisions:
- issue: वाचा के प्रसंग में ‘उसके भाई’ का अर्थ
  choice: मुख्य पाठ में ‘अपने भाइयों’
  alternative: अपने कुटुंबियों / अपने संबंधियों
  rationale: इब्रानी शब्द व्यापक पुरुष संबंधियों या सहयोगियों के लिए प्रयुक्त हो सकता है, किंतु पाठ स्वयं ‘भाई’ वाला पारिवारिक शब्द रखता है। इसे मुख्य पाठ में बनाए रखने से वास्तविक अर्थ-व्याप्ति को किसी एक व्याख्या तक सीमित नहीं किया जाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘बलिदान चढ़ाया’ तथा ‘रात बिताई’ स्वाभाविक हिंदी हैं; ‘रोटी खाने’ की स्रोत-समीप अभिव्यक्ति और उसकी पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
