source:
  edition: WLC
  text: לוּלֵ֡י אֱלֹהֵ֣י אָבִ/י֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּ/פַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔/י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑/נִי אֶת עָנְיִ֞/י וְ/אֶת יְגִ֧יעַ כַּפַּ֛/י רָאָ֥ה אֱלֹהִ֖ים וַ/יּ֥וֹכַח אָֽמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/042.yaml
  text: If the God of my father[a], the God of Abraham, and the Fear of Isaac, had not been with me, surely by now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and he judged last night.
translation:
  language: hi
  text: यदि मेरे पिता का परमेश्वर, अब्राहम का परमेश्वर और इसहाक का भय[a] मेरे साथ न होता, तो निश्चय ही तू अब तक मुझे खाली हाथ विदा कर चुका होता। परमेश्वर ने मेरा दुःख और मेरे हाथों का परिश्रम देखा, और पिछली रात न्याय किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “इसहाक का भय।” यह परमेश्वर के लिए प्रयुक्त एक विशिष्ट उपाधि है; इसका अर्थ “जिसका इसहाक भय मानता था” भी समझा जा सकता है।
    reason: असामान्य इब्रानी ईश्वरीय उपाधि और उसकी संभावित व्याख्या स्पष्ट करना।
lexical_decisions:
- source_word: לוּלֵי ... הָיָה לִי
  choice: यदि ... ने मेरा साथ न दिया होता
  rationale: यह संरचना एक अवास्तविक भूतकालीन शर्त व्यक्त करती है; हिंदी में यह रूप स्वाभाविक है और הָיָה לִי में निहित सहायता/समर्थन का भाव रखता है।
- source_word: אֱלֹהֵי אָבִי
  choice: मेरे पिता के परमेश्वर
  rationale: संबंधसूचक इब्रानी रचना का स्पष्ट और स्वाभाविक हिंदी रूप।
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: अब्राहम के परमेश्वर
  rationale: मूल संबंधसूचक पदबंध का सीधा अनुवाद।
- source_word: וּפַחַד יִצְחָק
  choice: और इसहाक के भय
  rationale: असामान्य ईश्वरीय उपाधि को व्याख्यात्मक रूप से सपाट किए बिना सुरक्षित रखता है; संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: כִּי עַתָּה
  choice: तो निश्चय ही ... अब तक
  rationale: परिणाम की निश्चितता और उसके अब तक घट चुकने के कालगत भाव, दोनों को व्यक्त करता है।
- source_word: רֵיקָם שִׁלַּחְתָּנִי
  choice: तू अब तक मुझे खाली हाथ विदा कर चुका होता
  rationale: विपरीत-तथ्य शर्त के अनुरूप क्रियारूप और संपत्ति या मजदूरी के बिना भेजने के लिए स्वाभाविक हिंदी मुहावरा।
- source_word: עָנְיִי
  choice: मेरा दुःख
  rationale: याकूब की दीन दशा, कष्ट और उत्पीड़न को व्यापक रूप से व्यक्त करता है।
- source_word: יְגִיעַ כַּפַּי
  choice: मेरे हाथों का परिश्रम
  rationale: कठिन शारीरिक मेहनत के इब्रानी मुहावरे का स्पष्ट, गरिमापूर्ण हिंदी रूप।
- source_word: וַיּוֹכַח
  choice: उसने न्याय किया
  rationale: क्रिया के न्याय करने, विवाद का निर्णय करने और दोष प्रकट करने के व्यापक अर्थ को बनाए रखता है तथा मूल में प्रत्यक्ष कर्म न होने का सम्मान करता है।
- source_word: אָמֶשׁ
  choice: पिछली रात
  rationale: कथा के संदर्भ में बीती हुई रात का स्वाभाविक हिंदी संकेत।
theological_decisions:
- issue: ईश्वरीय उपाधि וּפַחַד יִצְחָק का अनुवाद
  choice: इसहाक के भय
  alternative: जिससे इसहाक डरता था / इसहाक के भययोग्य परमेश्वर
  rationale: मूल का विशिष्ट और जानबूझकर असामान्य पदबंध सुरक्षित रखा गया है। अधिक स्पष्ट व्याख्या संभव है, पर उसे मुख्य पाठ में रख देने से मूल की अर्थगत और धर्मवैचारिक जटिलता समय से पहले सुलझ जाती।
- issue: וַיּוֹכַח का अर्थ और कर्म
  choice: उसने न्याय किया
  alternative: उसने तुझे डाँटा / उसने निर्णय किया
  rationale: संदर्भ में परमेश्वर ने लाबान को स्वप्न में चेतावनी दी, इसलिए डाँटने का भाव संभव है; फिर भी मूल में कोई स्पष्ट कर्म नहीं है और क्रिया न्यायिक निर्णय का अर्थ भी रखती है। चुना हुआ रूप इस अस्पष्टता को अधिक सावधानी से बचाता है।
- issue: הָיָה לִי में परमेश्वर की भूमिका
  choice: ने मेरा साथ न दिया होता
  alternative: मेरे पक्ष में न होता / मेरा न होता
  rationale: संदर्भ में यह परमेश्वर की रक्षक सहायता को व्यक्त करता है। हिंदी का चुना हुआ रूप अर्थ स्पष्ट करता है, पर किसी अतिरिक्त सिद्धान्तगत दावे को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण पर सामान्य पाठकों के लिए सुबोध। लाबान को संबोधन में एकवचन निकटवर्ती शैली “तू” रखी गई है, जो कथात्मक प्रत्यक्ष वचन और तीखे आरोप के अनुरूप है। मुख्य पाठ में असामान्य ईश्वरीय उपाधि तथा अंतिम क्रिया की न्यायिक अस्पष्टता सुरक्षित रखी गई है।
