base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/045.yaml
  text: Then Jacob took a stone and set it up as a pillar[a].
translation:
  language: hi
  text: तब याकूब ने एक पत्थर लिया और उसे एक स्तंभ[a] के रूप में खड़ा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खड़ा पत्थर” या “स्मारक-पत्थर।” इब्रानी शब्द מַצֵּבָה खड़ा किए गए पत्थर के चिह्न या स्तंभ को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लिया
  rationale: לקח के सामान्य अर्थ ‘लेना’ को स्वाभाविक हिन्दी कथा-शैली में व्यक्त करता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और पहचाना जाने वाला नाम-रूप।
- source_word: אָבֶן
  choice: एक पत्थर
  rationale: एकवचन संज्ञा को हिन्दी में स्वाभाविक अनिश्चितता के साथ व्यक्त करता है।
- source_word: וַיְרִימֶהָ
  choice: उसे ... खड़ा किया
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ पत्थर से है; प्रसंग में क्रिया का अर्थ पत्थर को उठाकर स्थापित करना है। ‘खड़ा किया’ आधुनिक हिन्दी में इस क्रिया को सहज रूप से व्यक्त करता है।
- source_word: מַצֵּבָה
  choice: एक स्तंभ के रूप में
  rationale: यह शब्द खड़े किए गए पत्थर के चिह्न या स्तंभ को दर्शाता है। यह चयन उसके भौतिक रूप को व्यक्त करता है, पर उसके स्मारकीय या उपासना-संबंधी प्रयोजन को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: מַצֵּבָה का ऐसा अनुवाद, जिसके स्मारकीय या उपासना-संबंधी अर्थ हो सकते हैं
  choice: स्तंभ
  alternative: खड़ा पत्थर; स्मारक-पत्थर
  rationale: पद केवल पत्थर को खड़ा करने की क्रिया बताता है और यहाँ उसका धार्मिक या स्मारकीय प्रयोजन स्पष्ट नहीं करता। ‘स्तंभ’ मूल अर्थ को रखते हुए किसी एक प्रयोजन को पाठ पर आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कथा-शैली। ‘के रूप में खड़ा किया’ मूल के विधेयात्मक מַצֵּבָה को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
