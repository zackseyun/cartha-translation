  yaml_path: translation/ot/genesis/031/026.yaml
  text: Then Laban said to Jacob[a], “What have you done[c][b], that you have stolen my heart and driven my daughters away like captives of the sword?”
translation:
  language: hi
  text: तब लाबान ने याकूब से कहा, “तुमने यह क्या किया? तुमने मुझे धोखा दिया[a] और मेरी बेटियों को ऐसे हाँक ले गए, मानो वे तलवार के बल पर बंदी बनाई गई स्त्रियाँ हों।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “मेरा हृदय चुरा लिया।” यहाँ इसका आशय चुपके से काम करके धोखा देना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: तुमने यह क्या किया?
  rationale: यह आरोप और विस्मय से भरा प्रश्न है; आधुनिक हिन्दी में यह स्वाभाविक और प्रभावशाली है।
- source_word: וַתִּגְנֹב אֶת לְבָבִי
  choice: तुमने मुझे धोखा दिया
  rationale: इब्रानी में शाब्दिक रूप से ‘मेरा हृदय चुरा लिया’ है, पर इस प्रसंग में मुहावरे का अर्थ चुपके से काम करके धोखा देना है। हिन्दी में शाब्दिक अनुवाद प्रेम-संबंधी गलत अर्थ दे सकता है, इसलिए अर्थ मुख्य पाठ में और मूल बिंब पादटिप्पणी में रखा गया है।
- source_word: וַתְּנַהֵג
  choice: हाँक ले गए
  rationale: क्रिया में किसी को आगे चलाने या हाँकने का बलपूर्ण भाव है; युद्धबंदियों की अगली उपमा के साथ ‘हाँक ले गए’ उपयुक्त है।
- source_word: בְּנֹתַי
  choice: मेरी बेटियों
  rationale: लाबान के पारिवारिक दावे को सीधे और स्वाभाविक रूप में बनाए रखता है।
- source_word: כִּשְׁבֻיוֹת חָרֶב
  choice: मानो वे तलवार के बल पर बंदी बनाई गई स्त्रियाँ हों
  rationale: שְׁבֻיוֹת स्त्रीलिंग बहुवचन है और ‘तलवार’ युद्ध तथा बलपूर्वक बंदी बनाए जाने का संकेत देती है। यह हिन्दी रूप मूल युद्ध-बंदी बिंब को स्पष्ट रखता है।
