source:
  edition: WLC
  text: עִ֠ם אֲשֶׁ֨ר תִּמְצָ֣א אֶת אֱלֹהֶי/ךָ֮ לֹ֣א יִֽחְיֶה֒ נֶ֣גֶד אַחֵ֧י/נוּ הַֽכֶּר לְ/ךָ֛ מָ֥ה עִמָּדִ֖/י וְ/קַֽח לָ֑/ךְ וְ/לֹֽא יָדַ֣ע יַעֲקֹ֔ב כִּ֥י רָחֵ֖ל גְּנָבָֽתַ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/032.yaml
  text: Whoever is found with your gods shall not live[a]. In the presence of our brothers, identify what of yours is with me[c][b], and take it for yourself.” Jacob did not know that Rachel had stolen them.
translation:
  language: hi
  text: जिस किसी के पास तेरे देवता मिलें, वह जीवित न रहे।[a] हमारे भाइयों[b] के सामने पहचान ले कि मेरे पास तेरा क्या है, और उसे अपने लिए ले ले।” याकूब नहीं जानता था कि राहेल ने उन्हें चुरा लिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “जिसके पास तू अपने देवताओं को पाए।”'
    reason: lexical_alternative
  - marker: b
    text: “भाइयों” से आशय वहाँ उपस्थित पुरुष संबंधियों या कुल के लोगों के व्यापक समूह से भी हो सकता है, केवल सगे भाइयों से नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: עִם אֲשֶׁר תִּמְצָא
  choice: जिस किसी के पास ... मिलें
  rationale: यह अनिश्चित संबंधवाचक प्रयोग किसी भी ऐसे व्यक्ति को सूचित करता है जिसके पास वस्तुएँ पाई जाएँ; साथ ही इब्रानी के सक्रिय 'तू पाए' का भाव स्वाभाविक हिन्दी में बना रहता है।
- source_word: אֱלֹהֶיךָ
  choice: तेरे देवता
  rationale: शब्द का सीधा अर्थ बहुवचन में 'तेरे देवता' है। संदर्भ में ये गृह-देवता हैं, पर इस उपवाक्य में प्रयुक्त मूल शब्द को अधिक विशिष्ट बनाना उचित नहीं।
- source_word: לֹא יִחְיֶה
  choice: वह जीवित न रहे
  rationale: यह मृत्यु-दण्ड अथवा शाप जैसे कथन की कठोर शक्ति को सुरक्षित रखता है, बिना इसे केवल भविष्यवाणी या विधिक आदेश मानकर तय किए।
- source_word: נֶגֶד אַחֵינוּ
  choice: हमारे भाइयों के सामने
  rationale: नֶגֶד का अर्थ 'के सामने/की उपस्थिति में' और אַחֵינוּ का सीधा अर्थ 'हमारे भाई' है; व्यापक संबंधियों की सम्भावना पाद-टिप्पणी में दी गई है।
- source_word: הַכֶּר לְךָ מָה עִמָּדִי
  choice: पहचान ले कि मेरे पास तेरी कोई वस्तु है या नहीं
  rationale: इब्रानी वाक्य संक्षिप्त है और लाबान को अपनी वस्तु जाँचकर पहचानने की चुनौती देता है। हिन्दी में 'है या नहीं' निहित जाँच के भाव को स्वाभाविक बनाता है।
- source_word: וְקַח לָךְ
  choice: और जो तेरी हो, उसे ले ले
  rationale: לָךְ के निजी हित के भाव और पहचानी हुई वस्तु को अपने लिए ले लेने का आशय सहज हिन्दी में व्यक्त होता है।
- source_word: וְלֹא יָדַע יַעֲקֹב
  choice: याकूब नहीं जानता था
  rationale: यह कथावाचक की व्याख्यात्मक टिप्पणी है; आरम्भिक संयोजक हिन्दी में आवश्यक नहीं।
- source_word: גְּנָבָתַם
  choice: उन्हें चुरा लिया था
  rationale: बहुवचन प्रत्यय देवताओं की ओर लौटता है और पूर्ण भूतकाल राहेल के पहले ही उन्हें चुरा लेने को स्पष्ट करता है।
theological_decisions:
- issue: לֹא יִחְיֶה की विधा
  choice: जीवित न रहे
  alternative: जीवित नहीं रहेगा / उसे मार डाला जाए
  rationale: मूल कथन शाप, दण्डादेश या दृढ़ घोषणा के बीच कुछ तनाव रखता है; चयन इस अनिश्चितता को अनावश्यक रूप से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। संवाद में एकवचन निकट/प्राचीन संबोधन के अनुरूप 'तेरे/तू' का प्रयोग है। मुख्य पाठ में केवल वे पाद-टिप्पणियाँ रखी गई हैं जो मूल इब्रानी की भाषिक या सांस्कृतिक जानकारी देती हैं; अंग्रेज़ी परत की वह टिप्पणी नहीं अपनाई गई जो इस पद के प्रत्यक्ष शब्दार्थ के बजाय पूर्ववर्ती संदर्भ बताती है।
