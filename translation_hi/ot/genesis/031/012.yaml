  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। याकूब को संबोधित एकवचन रूप के लिए ‘तेरे’ मूल के एकवचन संबोधन को स्पष्ट रखता है। रंग-रूप के तीन अलग इब्रानी विशेषणों का भेद ‘धारीदार, चितकबरे और धब्बेदार’ से यथासंभव सुरक्षित रखा गया है।
