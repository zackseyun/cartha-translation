source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר שָׂא נָ֨א עֵינֶ֤י/ךָ וּ/רְאֵה֙ כָּל הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּ֑ים כִּ֣י רָאִ֔יתִי אֵ֛ת כָּל אֲשֶׁ֥ר לָבָ֖ן עֹ֥שֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/012.yaml
  text: 'And he said[a], “Please lift up your eyes and see: all the male goats that are mating with the flock are striped, speckled, and spotted[b], for I have seen all that Laban is doing to you.”'
translation:
  language: hi
  text: 'उसने कहा, “ज़रा अपनी आँखें उठाकर देख: झुंड के साथ संयोग कर रहे सभी बकरे[a] धारीदार, चित्तीदार और धब्बेदार हैं[b], क्योंकि लाबान तेरे साथ जो कुछ कर रहा है, वह सब मैंने देखा है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “झुंड पर चढ़ रहे सभी बकरे।” यह इब्रानी में पशु-प्रजनन का मुहावरा है।'
    reason: lexical_alternative
  - marker: b
    text: “धारीदार” के लिए प्रयुक्त इब्रानी शब्द का पारंपरिक अनुवाद “छल्लेदार धारियों वाले” भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא עֵינֶיךָ
  choice: ज़रा अपनी आँखें उठाकर देख
  rationale: यह आँखें उठाकर देखने का इब्रानी मुहावरा है। ‘ज़रा’ נָא की विनम्र आग्रहसूचक छाया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָעַתֻּדִים
  choice: बकरे
  rationale: עתודים यहाँ नर बकरों को सूचित करता है; ‘मेढ़े’ कहने से नर भेड़ों का अर्थ निकल सकता है।
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: झुंड के साथ संयोग कर रहे
  rationale: पशु-प्रजनन के संदर्भ में עלה על चढ़ने और मैथुन करने का मुहावरा है। यह अनुवाद अर्थ स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
- source_word: עֲקֻדִּים
  choice: धारीदार
  rationale: शब्द पट्टियों या धारियों से चिह्नित पशुओं का बोध कराता है। ‘धारीदार’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: נְקֻדִּים
  choice: चितकबरे
  rationale: यह छोटे-छोटे चिह्नों या चित्तियों वाले रंग-रूप को बताता है और अगले विशेषण से यथासंभव भेद बनाए रखता है।
- source_word: וּבְרֻדִּים
  choice: धब्बेदार
  rationale: यह विविध रंगों अथवा अपेक्षाकृत बड़े धब्बों वाले रूप को व्यक्त करता है; ‘धब्बेदार’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: כִּי רָאִיתִי
  choice: क्योंकि … मैंने देखा है
  rationale: ‘क्योंकि’ כִּי का कारणसूचक बल और ‘मैंने देखा है’ पूर्ण क्रिया की वर्तमान-प्रासंगिकता बनाए रखते हैं।
- source_word: אֵת כָּל אֲשֶׁר לָבָן עֹשֶׂה לָּךְ
  choice: लाबान तेरे साथ जो कुछ कर रहा है, वह सब
  rationale: कृदंत עֹשֶׂה जारी व्यवहार को दर्शाता है। प्रसंग में לָּךְ हितार्थक नहीं, बल्कि याकूब के प्रति लाबान के व्यवहार को बताता है; हिन्दी में ‘तेरे साथ’ स्वाभाविक है।
