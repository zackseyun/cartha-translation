language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל יַעֲקֹ֔ב שׁ֛וּב אֶל אֶ֥רֶץ אֲבוֹתֶ֖י/ךָ וּ/לְ/מוֹלַדְתֶּ֑/ךָ וְ/אֶֽהְיֶ֖ה עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/003.yaml
  text: Then Yahweh said to Jacob[a], “Return to the land of your fathers and to your kindred, and I will be with you.”
translation:
  language: hi
  text: तब याहवे ने याकूब से कहा, “अपने पूर्वजों के देश और अपने संबंधियों के पास लौट जाओ, और मैं तुम्हारे साथ रहूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम का स्वाभाविक संकेत देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: שׁוּב
  choice: लौट जा
  rationale: आज्ञार्थक क्रिया का मूल भाव पहले के स्थान की ओर वापस जाने का है; ‘लौट जा’ हिन्दी में सीधा और स्वाभाविक है।
- source_word: אֶל אֶרֶץ אֲבוֹתֶיךָ
  choice: अपने पूर्वजों के देश ... के पास
  rationale: ‘पूर्वजों का देश’ अर्थ को स्पष्ट और वर्तमान हिन्दी में सहज रखता है; संयुक्त वाक्य में ‘के पास’ अगले संबंधपरक पद के साथ आता है।
- source_word: מוֹלַדְתֶּךָ
  choice: अपने कुटुम्ब
  rationale: यह शब्द जन्म-संबंधी समुदाय, रिश्तेदारों या मूल स्थान को सूचित कर सकता है। इस संदर्भ में ‘कुटुम्ब’ संबंधपरक अर्थ को व्यक्त करता है, जबकि भौगोलिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: וְאֶהְיֶה עִמָּךְ
  choice: मैं तेरे साथ रहूँगा
  rationale: यह याकूब को परमेश्वर की उपस्थिति का सीधा आश्वासन है; हिन्दी में भविष्यकाल स्वाभाविक रूप से इसे व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: וְאֶהְיֶה עִמָּךְ का आशय
  choice: मैं तेरे साथ रहूँगा
  alternative: और मैं तेरे साथ रहूँगा
  rationale: इसे ईश्वरीय उपस्थिति के भविष्यकालीन आश्वासन के रूप में रखा गया है; अर्धविराम संबंध को स्पष्ट करता है, बिना शर्त या परिणाम का अतिरिक्त अर्थ जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। याकूब को संबोधन में ‘तेरे’ का प्रयोग बाइबिलीय प्रत्यक्ष संबोधन की निकटता और एकवचनता बनाए रखता है; अनावश्यक रूप से पुरातन शब्दावली से बचा गया है।
