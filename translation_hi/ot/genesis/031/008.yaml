  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִם כֹּ֣ה יֹאמַ֗ר נְקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן נְקֻדִּ֑ים וְ/אִם כֹּ֣ה יֹאמַ֗ר עֲקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔/ךָ וְ/יָלְד֥וּ כָל הַ/צֹּ֖אן עֲקֻדִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/008.yaml
  text: If he said this, ‘The speckled will be your wages,’ then all the flock bore speckled young; and if he said this, ‘The streaked will be your wages,’ then all the flock bore streaked young.
translation:
  language: hi
  text: यदि वह कहता, ‘चितकबरे पशु तुम्हारी मज़दूरी होंगे,’ तो झुंड के सब पशुओं ने चितकबरे बच्चे जने; और यदि वह कहता, ‘धारीदार पशु तुम्हारी मज़दूरी होंगे,’ तो झुंड के सब पशुओं ने धारीदार बच्चे जने।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֻדִּים
  choice: चितकबरे
  rationale: यह शब्द बिंदुओं या चित्तियों वाले पशुओं को दर्शाता है; आधुनिक हिंदी में ‘चितकबरे’ सहज और स्पष्ट है।
- source_word: עֲקֻדִּים
  choice: धारीदार
  rationale: यह पशुओं पर पट्टियों या धारियों वाले रंग-रूप को दर्शाता है; ‘धारीदार’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: שְׂכָרֶךָ
  choice: तुम्हारी मज़दूरी
  rationale: संदर्भ में यह याकूब को उसके श्रम के बदले मिलने वाले पशुओं का पारिश्रमिक है; ‘मज़दूरी’ मूल अर्थ को सीधे व्यक्त करती है।
- source_word: וְיָלְדוּ כָל־הַצֹּאן
  choice: तो पूरे झुंड ने ... बच्चे जने
  rationale: हिब्रू में झुंड को सामूहिक कर्ता बनाकर जन्म देने की बात है; हिंदी में इसे स्वाभाविक रखते हुए संतानों का उल्लेख स्पष्ट किया गया है।
theological_decisions:
- issue: पशुओं के रंग-रूप के अनुसार मज़दूरी बदलने और परिणाम का संबंध
  choice: दोनों शर्तों और उनके अनुरूप जन्मे बच्चों को समानांतर रूप में रखा गया
  alternative: परिणाम को प्रत्यक्ष ईश्वरीय हस्तक्षेप के रूप में स्पष्ट करना
  rationale: इस पद में ईश्वर का नाम लेकर कारण नहीं बताया गया; इसलिए केवल कथित शर्त और घटित परिणाम को प्रस्तुत करना मूल की कथात्मक संयमता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और मौखिक कथन के अनुकूल है। ‘वह कहता’ हिब्रू की आवर्ती/शर्तात्मक अभिव्यक्ति को स्वाभाविक हिंदी में रखता है।
