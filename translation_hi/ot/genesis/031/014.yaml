base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/014.yaml
  text: Then Rachel and Leah answered and said to him[b][a], “Do we still have any share or inheritance in our father’s house?”
translation:
  language: hi
  text: तब राहेल और लिआ ने उसे उत्तर दिया, “क्या हमारे पिता के घराने में अब भी हमारा कोई भाग[a] या विरासत है?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हिस्सा।”
    reason: lexical_alternative
  - marker: b
    text: “हमारे पिता का घराना” परिवार के साथ-साथ उसकी पैतृक संपत्ति और विरासत-व्यवस्था को भी दर्शा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעַן ... וַתֹּאמַרְנָה
  choice: उत्तर दिया
  rationale: इब्रानी में ‘उत्तर दिया और कहा’ संयुक्त वाक्य-प्रयोग है। आधुनिक स्वाभाविक हिन्दी में ‘उत्तर दिया’ प्रत्युत्तर और आगामी कथन—दोनों को स्पष्ट करता है।
- source_word: רָחֵל וְלֵאָה
  choice: राहेल और लिआ
  rationale: नामों का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: לוֹ
  choice: उसे
  rationale: इब्रानी में कथन का अप्रत्यक्ष कर्म स्पष्ट है; इसलिए इसे हिन्दी में बनाए रखा गया है।
- source_word: הַעוֹד לָנוּ
  choice: क्या ... अब भी हमारा कोई ... है?
  rationale: यह प्रश्न इस बात पर है कि उनका अधिकार या हिस्सा अभी शेष है या नहीं। ‘अब भी’ समयगत भाव सुरक्षित रखता है।
- source_word: חֵלֶק
  choice: भाग
  rationale: संपत्ति और उत्तराधिकार के प्रसंग में ‘भाग’ सहज हिन्दी है और आवंटित हिस्से का अर्थ देता है।
- source_word: נַחֲלָה
  choice: विरासत
  rationale: यह पैतृक रूप से मिलने वाली संपत्ति या अधिकार को दर्शाता है; ‘विरासत’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: בְּבֵית אָבִינוּ
  choice: हमारे पिता के घराने में
  rationale: ‘घराना’ केवल भवन नहीं, बल्कि परिवार, गृह-संपत्ति और पैतृक व्यवस्था के व्यापक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
