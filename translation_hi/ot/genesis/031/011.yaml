base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/011.yaml
  text: Then the angel of God said to me in the dream[a], ‘Jacob,’ and I said, ‘Here I am.’
translation:
  language: hi
  text: तब परमेश्वर के दूत ने उस स्वप्न में मुझसे कहा[a], “याकूब!” और मैंने कहा, “मैं यहाँ हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक स्वप्न में।” इब्रानी में “उस स्वप्न में” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֵלַי
  choice: मुझसे
  rationale: पूर्वसर्ग और प्रथम पुरुष एकवचन प्रत्यय का स्वाभाविक हिन्दी रूप।
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: परमेश्वर के दूत
  rationale: מַלְאָךְ का अर्थ ‘दूत/संदेशवाहक’ है और इस प्रसंग में स्वर्गीय दूत अभिप्रेत है। यह पद की पहचान को इससे आगे निर्धारित नहीं करता।
- source_word: בַּחֲלוֹם
  choice: उस स्वप्न में
  rationale: इब्रानी में निश्चित उपपद है; ‘उस स्वप्न में’ हिन्दी में उसकी निश्चितता को स्पष्ट और स्वाभाविक रूप से दर्शाता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: וָאֹמַר
  choice: और मैंने कहा
  rationale: प्रथम पुरुष वय्यिक्तोल का सरल कथात्मक अनुवाद।
- source_word: הִנֵּנִי
  choice: मैं यहाँ हूँ
  rationale: उपस्थिति और तत्परता बताने वाले इब्रानी उत्तर-सूत्र का स्वाभाविक आधुनिक हिन्दी समतुल्य।
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִים की पहचान
  choice: परमेश्वर के दूत
  alternative: परमेश्वर के संदेशवाहक
  rationale: पद स्वयं इस व्यक्ति को परमेश्वर का दूत कहता है, पर उसकी व्यापक दैवी पहचान का प्रश्न हल नहीं करता; अनुवाद उसी तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद के लिए हिन्दी विराम-चिह्नों का प्रयोग किया गया है और निश्चित इब्रानी रूप को मुख्य पाठ में सुरक्षित रखा गया है।
