source:
  edition: WLC
  text: כִּ֣י כָל הָ/עֹ֗שֶׁר אֲשֶׁ֨ר הִצִּ֤יל אֱלֹהִים֙ מֵֽ/אָבִ֔י/נוּ לָ֥/נוּ ה֖וּא וּ/לְ/בָנֵ֑י/נוּ וְ/עַתָּ֗ה כֹּל֩ אֲשֶׁ֨ר אָמַ֧ר אֱלֹהִ֛ים אֵלֶ֖י/ךָ עֲשֵֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/016.yaml
  text: For all the wealth that God has taken from our father belongs to us and to our children. So now[a], whatever God has said to you, do.
translation:
  language: hi
  text: क्योंकि वह सारी सम्पत्ति, जिसे परमेश्वर ने हमारे पिता से ले ली है[a], हमारी और हमारे बच्चों की है। इसलिए अब परमेश्वर ने तुमसे जो कुछ कहा है, वही करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छुड़ा लिया” या “बचाया।” इस हिब्रू क्रिया में अक्सर बचाने या छुड़ाने का भाव होता है; यहाँ प्रसंग में वह हमारे पिता से सम्पत्ति हटाए जाने को सूचित करती है।
    reason: मूल क्रिया के सामान्य उद्धारात्मक अर्थ को दर्शाते हुए, इस प्रसंग में उसके हस्तांतरण/हटाए जाने के अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह राहेल और लिआ द्वारा अपने निर्णय का कारण बताने वाली व्याख्यात्मक कड़ी है; हिन्दी में ‘क्योंकि’ स्वाभाविक और स्पष्ट है।
- source_word: כָל הָעֹשֶׁר
  choice: वह सारी सम्पत्ति
  rationale: עֹשֶׁר धन-सम्पदा या वैभव को दर्शाता है; कथा के पशुधन और अन्य भौतिक साधनों को समेटने के लिए ‘सम्पत्ति’ सहज और व्यापक है।
- source_word: הִצִּיל
  choice: छुड़ा लिया
  rationale: נצל के हिफ़ील रूप का मूल भाव बचाने या छुड़ाने का है। यहाँ वस्तु सम्पत्ति है, जिसे परमेश्वर ने लाबान के अधिकार से निकालकर याकूब के घराने को दिलाया; ‘छुड़ा लिया’ इस मूल अर्थ और प्रसंगगत हस्तांतरण दोनों को बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस कथा में सच्चे परमेश्वर के लिए आधुनिक मानक हिन्दी का प्रतिष्ठित और सामान्य बाइबलीय पद।
- source_word: מֵאָבִינוּ
  choice: हमारे पिता से
  rationale: מן स्रोत या उस व्यक्ति को सूचित करता है जिससे सम्पत्ति ली गई; सीधा हिन्दी रूप पर्याप्त है।
- source_word: לָנוּ הוּא וּלְבָנֵינוּ
  choice: हमारी और हमारे बच्चों की है
  rationale: हिब्रू में अधिकार/स्वामित्व का भाव है; यह हिन्दी में स्वाभाविक रूप से उसी को व्यक्त करता है।
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह कारण-विवेचन से निष्कर्षात्मक आग्रह की ओर संक्रमण करता है; ‘इसलिए अब’ उस प्रवाह को स्पष्ट रखता है।
- source_word: כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ
  choice: परमेश्वर ने तुमसे जो कुछ कहा है
  rationale: ‘जो कुछ’ כֹּל אֲשֶׁר की समग्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲשֵׂה
  choice: वही करो
  rationale: हिब्रू आज्ञा संक्षिप्त है; हिन्दी में ‘वही’ पूर्ववर्ती कथन को स्पष्ट रूप से ग्रहण करते हुए आदेश की संक्षिप्तता बनाए रखता है।
theological_decisions:
- issue: लाबान की सम्पत्ति के सम्बन्ध में परमेश्वर की कार्रवाई
  choice: ‘छुड़ा लिया’
  alternative: ‘निकाल लिया’ या ‘ले लिया’
  rationale: मूल क्रिया सामान्यतः बचाने/छुड़ाने का भाव रखती है, जबकि इस प्रसंग में सम्पत्ति लाबान से हटाकर याकूब के घराने को मिलती है। ‘छुड़ा लिया’ मूल क्रिया का उद्धारात्मक रंग सुरक्षित रखता है, पर यह दावा नहीं करता कि सम्पत्ति स्वयं संकट में थी; पादटिप्पणी प्रसंगगत विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सहज रखी गई है। ‘सम्पत्ति’, ‘छुड़ा लिया’ और ‘जो कुछ…वही करो’ सामान्य पाठक के लिए स्पष्ट हैं तथा हिब्रू की संक्षिप्त, निष्कर्षात्मक शैली को बनाए रखते हैं।
