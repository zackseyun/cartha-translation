  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
translation:
  language: hi
  text: इस प्रकार वह और जो कुछ उसका था, भाग गए। फिर वह उठा, नदी[a] को पार किया और गिलाद के पहाड़ी प्रदेश की ओर अपना रुख किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘वह नदी’ है; इससे सम्भवतः फ़रात नदी का संकेत है।
    reason: मूल पाठ नदी को नाम से नहीं पहचानता, पर संदर्भ में फ़रात की पहचान संभावित है।
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: भाग निकला
  rationale: यह ברח के ‘भागना/पलायन करना’ अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और गुप्त प्रस्थान का कथात्मक भाव बनाए रखता है।
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: अपनी सारी सम्पत्ति के साथ
  rationale: वाक्यांश याकूब से संबंधित सब कुछ समेटता है। ‘सम्पत्ति’ हिन्दी में व्यापक है, यद्यपि संदर्भ से उसके घराने और पशुधन का भी समावेश समझा जाता है।
- source_word: וַיָּקָם
  choice: फिर वह उठा
  rationale: קום के क्रमिक कथात्मक प्रयोग को सीधे रखते हुए नए कार्य की शुरुआत दर्शाता है।
- source_word: וַיַּעֲבֹר אֶת־הַנָּהָר
  choice: महानद को पार किया
  rationale: עבר का सामान्य अर्थ ‘पार करना’ है। साभिप्राय הַנָּהָר को उस प्रसिद्ध बड़ी नदी के रूप में ‘महानद’ कहा गया है, जबकि स्पष्ट पहचान पादटिप्पणी में दी गई है।
- source_word: וַיָּשֶׂם אֶת־פָּנָיו
  choice: की ओर चल पड़ा
  rationale: हिब्रू मुहावरे का आशय जानबूझकर किसी दिशा में प्रस्थान करना है; शाब्दिक ‘अपना मुख लगाया’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הַר הַגִּלְעָד
  choice: गिलाद के पहाड़ी प्रदेश
  rationale: यहाँ הַר संभवतः किसी एक पर्वत-शिखर के बजाय गिलाद के पर्वतीय भूभाग को सूचित करता है।
