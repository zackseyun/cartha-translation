- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले अलंकारिक प्रश्न का कारण प्रस्तुत करता है।
- source_word: מְכָרָנוּ
  choice: उसने हमें बेच दिया
  rationale: पूर्ण हो चुके कार्य और उसके वर्तमान परिणाम, दोनों को स्पष्ट करता है।
- source_word: וַיֹּאכַל גַּם אָכוֹל
  choice: पूरी तरह खा गया
  rationale: क्रिया के साथ infinitive absolute की तीव्रता को ‘पूरी तरह’ व्यक्त करता है और मूल के ‘खाने’ वाले सजीव मुहावरे को बनाए रखता है।
- source_word: אֶת כַּסְפֵּנוּ
  choice: हमारे धन को
  rationale: כֶּסֶף का अर्थ ‘चाँदी’ या ‘धन’ हो सकता है; आर्थिक संदर्भ में ‘धन’ सहज है और अनावश्यक विशिष्टता से बचता है।
