base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/044.yaml
  text: So now[a], come, let us make a covenant, you and I, and let it be a witness between me and you.
translation:
  language: hi
  text: तो अब आओ, मैं और तुम एक वाचा बाँधें[a], और वह मेरे और तुम्हारे बीच साक्षी ठहरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एक वाचा काटें।” इब्रानी में यह मुहावरा वाचा बाँधने या स्थापित करने के अर्थ में प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: संवाद में पिछले कथन से अगले प्रस्ताव की ओर बढ़ने का संबंध व्यक्त करता है; ‘इसलिए अब’ संयोजक और काल-सूचक दोनों तत्वों को स्वाभाविक हिन्दी में रखता है।
- source_word: לְכָה
  choice: आओ
  rationale: הלך से बना यह रूप यहाँ जाने की आज्ञा नहीं, बल्कि प्रस्ताव स्वीकार करने का निमंत्रण है; हिन्दी में ‘आओ’ यही प्रयोजन स्वाभाविक रूप से व्यक्त करता है।
- source_word: נִכְרְתָה בְרִית
  choice: एक वाचा बाँधें
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘वाचा काटें’ है, पर उसका आशय वाचा स्थापित करना है। हिन्दी का ‘वाचा बाँधना’ औपचारिक और संबंधपरक बल को रखते हुए अर्थ स्पष्ट करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: בְרִית
  choice: वाचा
  rationale: यह औपचारिक, बाध्यकारी संबंध या समझौते को दर्शाने वाला मानक बाइबलीय शब्द है; केवल ‘समझौता’ कहने से उसका संबंधपरक और गंभीर बल घट सकता है।
- source_word: אֲנִי וָאָתָּה
  choice: मैं और तुम
  rationale: दोनों पक्षों को अलग-अलग और स्पष्ट रूप से नाम देने वाली इब्रानी संरचना तथा उसका क्रम सुरक्षित रखा गया है।
- source_word: וְהָיָה לְעֵד
  choice: और वह … साक्षी ठहरे
  rationale: संदर्भ में यह साधारण भविष्यवाणी से अधिक इच्छासूचक प्रस्ताव है। ‘साक्षी ठहरे’ वाचा की निर्धारित भूमिका और इच्छासूचक भाव दोनों व्यक्त करता है।
- source_word: בֵּינִי וּבֵינֶךָ
  choice: मेरे और तुम्हारे बीच
  rationale: इब्रानी के स्पष्ट व्यक्तिगत उल्लेख और उसके क्रम को बनाए रखता है, बजाय इसे सामान्यीकृत करके केवल ‘हमारे बीच’ कहने के।
