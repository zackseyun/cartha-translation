  text: וַ/תֹּ֣אמֶר אֶל אָבִ֗י/הָ אַל יִ֨חַר֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י כִּ֣י ל֤וֹא אוּכַל֙ לָ/ק֣וּם מִ/פָּנֶ֔י/ךָ כִּי דֶ֥רֶךְ נָשִׁ֖ים לִ֑/י וַ/יְחַפֵּ֕שׂ וְ/לֹ֥א מָצָ֖א אֶת הַ/תְּרָפִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/035.yaml
  text: And she said to her father[a], “Let not my lord be angry in my sight that I cannot rise before you, for the way of women is upon me.” So he searched[b], but did not find the household idols.
translation:
  language: hi
  text: उसने अपने पिता से कहा, “मेरे स्वामी इस बात से मुझ पर क्रोधित न हों कि मैं आपके सामने उठ नहीं सकती, क्योंकि मुझे स्त्रियों की रीति लगी हुई है।” तब लाबान ने खोजबीन की, पर उसे घर की देवमूर्तियाँ[a] नहीं मिलीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “तराफीम”; घर में उपासना के लिए रखी जाने वाली देवमूर्तियों या धार्मिक प्रतिमाओं के लिए एक शब्द।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִחַר בְּעֵינֵי אֲדֹנִי
  choice: मेरे स्वामी ... मुझ पर क्रोधित न हों
  rationale: यह इब्रानी मुहावरा अप्रसन्नता या क्रोध व्यक्त करता है। स्वाभाविक हिन्दी में भाव स्पष्ट किया गया है; ‘मेरे स्वामी’ पिता के प्रति आदरसूचक संबोधन है, परमेश्वर के लिए उपाधि नहीं।
- source_word: לֹא אוּכַל לָקוּם מִפָּנֶיךָ
  choice: मैं आपके सामने उठ नहीं सकती
  rationale: उठने की शारीरिक क्रिया और पिता की उपस्थिति में आदरपूर्वक उठ खड़े होने का भाव, दोनों सुरक्षित रहते हैं।
- source_word: דֶרֶךְ נָשִׁים לִי
  choice: मुझे स्त्रियों का मासिक धर्म हो रहा है
  rationale: यह मासिक धर्म के लिए इब्रानी शिष्टोक्ति है। हिन्दी में अर्थ स्पष्ट रखते हुए संयत और गरिमापूर्ण अभिव्यक्ति चुनी गई है।
- source_word: וַיְחַפֵּשׂ
  choice: तब उसने खोजबीन की
  rationale: कथा के क्रम को स्वाभाविक हिन्दी में आगे बढ़ाता है और संदर्भ से कर्ता लाबान है।
- source_word: הַתְּרָפִים
  choice: कुल-देवताओं की मूर्तियाँ
  rationale: तराफीम घर या कुल से जुड़ी उपासना-वस्तुएँ थीं। यह पद घरेलू/कुलगत धार्मिक संबंध और मूर्त रूप दोनों बताता है, जबकि मूल शब्द की सटीक प्रकृति पर अनावश्यक निश्चितता नहीं थोपता।
theological_decisions:
- issue: תְּרָפִים का अनुवाद
  choice: कुल-देवताओं की मूर्तियाँ
  alternative: तराफीम; गृह-देवताओं की मूर्तियाँ; घरेलू देवमूर्तियाँ
  rationale: मूल शब्द घरेलू या कुलगत उपासना से जुड़ी प्रतिमाओं को सूचित करता है। पठनीय हिन्दी के लिए इसका अनुवाद किया गया है और मूल पदनाम पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; पिता के प्रति राहेल का आदरसूचक संबोधन बनाए रखा गया है। मासिक धर्म का उल्लेख स्पष्ट, संयत और गैर-तकनीकी भाषा में है।
