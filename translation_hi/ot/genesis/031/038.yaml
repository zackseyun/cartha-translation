  register: आधुनिक, गरिमापूर्ण और सहज हिंदी अपनाई गई है। संबोधन में एकवचन ‘तेरे’ रखा गया है, क्योंकि याकूब सीधे लाबान से बात कर रहा है। पशुओं के लिए प्रचलित ग्रामीण-पशुपालन शब्दावली का प्रयोग किया गया है।
