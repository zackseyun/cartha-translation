base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/038.yaml
  text: These twenty years I have been with you; your ewes and your female goats have not miscarried[a], and I have not eaten the rams of your flock.
translation:
  language: hi
  text: इन बीस वर्षों तक मैं तेरे साथ रहा हूँ। तेरी भेड़ों और बकरियों ने गर्भ नहीं गिराया[a], और मैंने तेरे झुंड का कोई मेढ़ा नहीं खाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने बच्चे नहीं खोए।” इब्रानी क्रिया संतान से वंचित होने का अर्थ भी दे सकती है; पशुपालन के इस प्रसंग में इसका आशय गर्भ गिरने या बच्चे खोने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשְׂרִים שָׁנָה
  choice: इन बीस वर्षों से
  rationale: इब्रानी मुहावरा बीस वर्ष की उस पूरी अवधि पर बल देता है जो बोलने के समय तक चली; यह हिंदी में स्वाभाविक रूप से उसी भाव को व्यक्त करता है।
- source_word: אָנֹכִי עִמָּךְ
  choice: मैं तेरे साथ रहा हूँ
  rationale: मूल में स्पष्ट क्रिया नहीं है, पर प्रसंग बीस वर्ष तक साथ रहने और सेवा करने की अवधि का सार प्रस्तुत करता है; पूर्ण वर्तमान उस निरंतर अवधि को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: רְחֵלֶיךָ וְעִזֶּיךָ
  choice: तेरी भेड़ों और बकरियों
  rationale: दोनों शब्द मादा पशुओं को सूचित करते हैं। हिंदी में ‘भेड़’ और ‘बकरी’ सामान्यतः इन मादा पशुओं के लिए स्वाभाविक हैं, और गर्भ गिरने का उल्लेख अर्थ को स्पष्ट रखता है।
- source_word: לֹא שִׁכֵּלוּ
  choice: का गर्भ नहीं गिरा
  rationale: पशुपालन के इस प्रसंग में क्रिया गर्भपात होने अथवा संतान खोने का संकेत दे सकती है; मुख्य पाठ में संक्षिप्त और स्वाभाविक अर्थ रखा गया है तथा व्यापक विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְאֵילֵי צֹאנְךָ
  choice: तेरे झुंड के मेढ़ों को
  rationale: אֵילֵי विशेष रूप से नर भेड़ों, अर्थात मेढ़ों, को दर्शाता है; झुंड के साथ संबंध भी बनाए रखा गया है।
- source_word: לֹא אָכָלְתִּי
  choice: मैंने ... नहीं खाया
  rationale: याकूब अपनी पूरी सेवा-अवधि के आचरण का बचाव कर रहा है; हिंदी का सामान्य पूर्ण भूत रूप इस कथन को स्पष्ट और स्वाभाविक बनाता है।
