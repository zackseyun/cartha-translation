  text: וַ/יִּשְׁמַ֗ע אֶת דִּבְרֵ֤י בְנֵֽי לָבָן֙ לֵ/אמֹ֔ר לָקַ֣ח יַעֲקֹ֔ב אֵ֖ת כָּל אֲשֶׁ֣ר לְ/אָבִ֑י/נוּ וּ/מֵ/אֲשֶׁ֣ר לְ/אָבִ֔י/נוּ עָשָׂ֕ה אֵ֥ת כָּל הַ/כָּבֹ֖ד הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/001.yaml
  text: He heard the words of Laban’s sons[a], saying, “Jacob has taken all that belonged to our father, and from what belonged to our father he has gained all this wealth.”
translation:
  language: hi
  text: याकूब ने लाबान के बेटों की बातें सुनीं। वे कह रहे थे, “याकूब ने हमारे पिता का सब कुछ ले लिया है, और हमारे पिता की संपत्ति से उसने यह सारी धन-दौलत[a] कमाई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह सारी महिमा।” इब्रानी शब्द का अर्थ सम्मान, वैभव या भौतिक संपत्ति हो सकता है; यहाँ यह याकूब की दिखाई देने वाली समृद्धि को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: याकूब ने ... सुनीं
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है। हिन्दी में स्वाभाविक क्रम रखा गया है और संदर्भ से स्पष्ट कर्ता ‘याकूब’ व्यक्त किया गया है।
- source_word: דִּבְרֵי בְנֵי לָבָן
  choice: लाबान के बेटों की बातें
  rationale: דְּבָרִים यहाँ सुनी गई बातचीत या कथनों को दर्शाता है; ‘बातें’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לֵאמֹר
  choice: वे कह रहे थे
  rationale: इब्रानी उद्धरण-सूचक रूप को हिन्दी में स्वाभाविक रीति से प्रत्यक्ष कथन की भूमिका बनाया गया है। बहुवचन कर्ता लाबान के बेटे हैं।
- source_word: לָקַח
  choice: ले लिया है
  rationale: सामान्य क्रिया ‘लेना’ आरोप की तीव्रता को बढ़ाए बिना पूर्ण हो चुकी कार्रवाई और वर्तमान शिकायत दोनों व्यक्त करती है।
- source_word: כָּל אֲשֶׁר לְאָבִינוּ
  choice: हमारे पिता का सब कुछ
  rationale: लामेद द्वारा व्यक्त अधिकार को संक्षिप्त और स्वाभाविक हिन्दी संबंध-वाक्यांश में रखा गया है।
- source_word: וּמֵאֲשֶׁר לְאָבִינוּ
  choice: और हमारे पिता की संपत्ति से ही
  rationale: מִן का स्रोत-संबंध ‘से’ द्वारा व्यक्त है। ‘ही’ वक्ताओं के इस आरोप पर बल देता है कि याकूब की समृद्धि उनके पिता की संपत्ति से आई।
- source_word: עָשָׂה
  choice: कमाई है
  rationale: शाब्दिक अर्थ ‘बनाया/किया’ है, पर धन-संपत्ति के संदर्भ में ‘कमाई है’ अर्जित समृद्धि का स्वाभाविक हिन्दी प्रयोग है।
- source_word: כָּל הַכָּבֹד הַזֶּה
  choice: यह सारी धन-दौलत
  rationale: כָּבוֹד प्रायः महिमा या सम्मान है, पर यहाँ याकूब की दिखाई देने वाली भौतिक समृद्धि अभिप्रेत है। ‘धन-दौलत’ सामान्य पाठक के लिए स्पष्ट है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
