  text: וַ/יָּבֹ֨א לָבָ֜ן בְּ/אֹ֥הֶל יַעֲקֹ֣ב וּ/בְ/אֹ֣הֶל לֵאָ֗ה וּ/בְ/אֹ֛הֶל שְׁתֵּ֥י הָ/אֲמָהֹ֖ת וְ/לֹ֣א מָצָ֑א וַ/יֵּצֵא֙ מֵ/אֹ֣הֶל לֵאָ֔ה וַ/יָּבֹ֖א בְּ/אֹ֥הֶל רָחֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/033.yaml
  text: So Laban went into Jacob’s tent[a], and into Leah’s tent, and into the tent of the two female servants, but he did not find them. Then he came out of Leah’s tent and went into Rachel’s tent.
translation:
  language: hi
  text: तब लाबान याकूब के तंबू में, फिर लिआ के तंबू में और दोनों दासियों के तंबू में गया, पर उसे वे नहीं मिले[a]। तब वह लिआ के तंबू से निकलकर राहेल के तंबू में गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उसे वे नहीं मिले’ का कर्म नहीं दिया गया है; प्रसंग से इसका संकेत उन गृह-देवताओं की ओर है जिन्हें लाबान खोज रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... בְּאֹהֶל
  choice: तंबू में गया
  rationale: בוא के साथ בְּ किसी स्थान के भीतर जाने को व्यक्त करता है। ‘तंबू में गया’ आधुनिक हिन्दी में स्वाभाविक है और खोज की क्रमिक गति बनाए रखता है।
- source_word: אֹהֶל
  choice: तंबू
  rationale: यहाँ इसका सामान्य और ठोस अर्थ ‘तंबू’ है; पितृकालीन परिवेश में इसे व्यापक ‘निवास’ से बदलना आवश्यक नहीं।
- source_word: שְׁתֵּי הָאֲמָהֹת
  choice: दोनों दासियों
  rationale: אָמָה घराने से जुड़ी स्त्री दासी/सेविका को दर्शाता है। ‘दासियों’ संक्षिप्त, वर्तमान हिन्दी में स्पष्ट और सामाजिक स्थिति को अनावश्यक रूप से नरम नहीं करता।
- source_word: וְלֹא מָצָא
  choice: पर उसे वे नहीं मिले
  rationale: इब्रानी में कर्म व्यक्त नहीं किया गया है, पर संदर्भ में लाबान जिन गृह-देवताओं को खोज रहा था वही अभिप्रेत हैं। हिन्दी में ‘वे’ जोड़ने से वाक्य स्वाभाविक बनता है; पाद-टिप्पणी मूल की अनुक्तता बताती है।
- source_word: וַיֵּצֵא מֵאֹהֶל לֵאָה
  choice: तब वह लिआ के तंबू से निकलकर
  rationale: יצא का गति-सूचक अर्थ ‘निकलना’ है। ‘तब’ कथात्मक क्रम को सहज रूप में व्यक्त करता है।
- source_word: וַיָּבֹא בְּאֹהֶל רָחֵל
  choice: राहेल के तंबू में गया
  rationale: पहले प्रयुक्त गति-क्रिया के अनुरूप अनुवाद खोज के अगले चरण को स्पष्ट रखता है।
