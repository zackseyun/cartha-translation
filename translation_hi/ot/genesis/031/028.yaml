  text: And you did not let me kiss my sons and my daughters[a]. Now you have acted foolishly.
translation:
  language: hi
  text: और तुमने मुझे मेरे बेटों और मेरी बेटियों को चूमने भी नहीं दिया। अब तुमने मूर्खता की है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְטַשְׁתַּנִי
  choice: तुमने मुझे ... नहीं दिया
  rationale: נטשׁ का मूल अर्थ ‘छोड़ना’ है, पर यहाँ चूमने के अर्थ वाले उद्देश्यवाचक क्रियारूप के साथ इसका भाव अवसर या अनुमति न देने का है। यह हिंदी में शिकायत को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְנַשֵּׁק
  choice: चूमने
  rationale: मूल क्रिया का सीधा अर्थ ‘चूमना’ है। प्रसंग में विदाई का चुम्बन निहित है, पर वह मूल पाठ में स्पष्ट रूप से जोड़ा नहीं गया।
- source_word: לְבָנַי וְלִבְנֹתָי
  choice: अपने बेटों और अपनी बेटियों को
  rationale: इब्रानी पाठ दोनों संबंध-संज्ञाओं को अलग-अलग रखता है; इसलिए उन्हें सामान्य शब्द ‘बच्चों’ में नहीं समेटा गया।
- source_word: עַתָּה
  choice: अब
  rationale: यह लाबान के अगले मूल्यांकन को प्रस्तुत करने वाला सीधा कालवाचक/विमर्श-सूचक शब्द है।
- source_word: הִסְכַּלְתָּ עֲשׂוֹ
  choice: तुमने मूर्खता का काम किया है
  rationale: यह मुहावरेदार आधुनिक हिंदी में मूर्खतापूर्ण आचरण को व्यक्त करता है और इब्रानी के ‘करने’ वाले पूरक भाव को भी बनाए रखता है।
