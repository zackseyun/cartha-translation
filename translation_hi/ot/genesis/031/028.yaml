  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भी नहीं दिया’ लाबान की शिकायत के जोर को स्वाभाविक हिंदी में सामने लाता है। औपचारिक विकल्प ‘मुझे ... चूमने के लिए नहीं छोड़ा’ हिंदी में भ्रामक और अस्वाभाविक होता, इसलिए पाद-टिप्पणी आवश्यक नहीं मानी गई।
