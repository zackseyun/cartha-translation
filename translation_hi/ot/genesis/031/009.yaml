  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּצֵּ֧ל אֱלֹהִ֛ים אֶת מִקְנֵ֥ה אֲבִי/כֶ֖ם וַ/יִּתֶּן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/009.yaml
  text: So God took away your father's livestock and gave it to me[a].
translation:
  language: hi
  text: इस प्रकार परमेश्वर ने तुम्हारे पिता का पशुधन उनसे लेकर मुझे दे दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छीनकर” अथवा “छुड़ाकर।” इब्रानी क्रिया में किसी एक पक्ष से ले लेने और दूसरे को सौंप देने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל
  choice: लेकर
  rationale: हिफ़ील रूप यहाँ एक पक्ष से पशुधन हटाकर दूसरे को देने का भाव व्यक्त करता है। ‘लेकर’ स्वाभाविक हिन्दी में इस हस्तांतरण को स्पष्ट करता है, जबकि अधिक तीखा ‘छीन लिया’ या बचाव-सूचक ‘छुड़ाया’ मुख्य पाठ में अनावश्यक अर्थ जोड़ सकता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ सामान्य इब्रानी पद उस परमेश्वर के लिए है जो याकूब के पक्ष में कार्य करता है; आधुनिक हिन्दी बाइबलीय गद्य में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: מִקְנֵה
  choice: पशुधन
  rationale: इस चरवाही प्रसंग में यह पद मुख्यतः पाले हुए पशुओं की सामूहिक संपत्ति को दर्शाता है; ‘पशुधन’ व्यापक और सटीक है।
- source_word: אֲבִיכֶם
  choice: तुम्हारे पिता का
  rationale: एकवचन ‘पिता’ के साथ बहुवचन संबोधन-सूचक प्रत्यय है, क्योंकि याकूब राहेल और लिआ से उनके एक ही पिता लाबान के विषय में बोल रहा है।
- source_word: וַיִּתֶּן לִי
  choice: मुझे दे दिया
  rationale: क्रिया प्रत्यक्ष हस्तांतरण बताती है। हिन्दी में पूर्ववर्ती ‘पशुधन’ इसका सहज कर्म है, इसलिए अलग सर्वनाम की आवश्यकता नहीं है।
theological_decisions:
- issue: याकूब की समृद्धि में परमेश्वर की सक्रिय भूमिका
  choice: पशुधन को पिता से लेकर याकूब को देने का कार्य सीधे परमेश्वर को सौंपा गया है।
  alternative: इसे केवल परमेश्वर की सामान्य आशीष या प्रबंध के रूप में नरम करना।
  rationale: इब्रानी की दोनों क्रियाएँ परमेश्वर की प्रत्यक्ष सक्रियता और एक पक्ष से दूसरे पक्ष को हुए हस्तांतरण को स्पष्ट रूप से व्यक्त करती हैं; अनुवाद इस तनाव को कम नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘इस प्रकार’ पूर्ववर्ती विवरण से निष्कर्ष का संबंध दिखाता है। ‘उनसे’ हिन्दी में पिता के प्रति सम्मानसूचक एकवचन है, बहुवचन पिताओं का संकेत नहीं।
