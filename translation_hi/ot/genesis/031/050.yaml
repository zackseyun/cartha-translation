source:
  edition: WLC
  text: אִם תְּעַנֶּ֣ה אֶת בְּנֹתַ֗/י וְ/אִם תִּקַּ֤ח נָשִׁים֙ עַל בְּנֹתַ֔/י אֵ֥ין אִ֖ישׁ עִמָּ֑/נוּ רְאֵ֕ה אֱלֹהִ֥ים עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/050.yaml
  text: If you mistreat my daughters[a], or if you take wives besides my daughters—though no man is with us—see, God is witness between me and you.
translation:
  language: hi
  text: यदि तुम मेरी बेटियों के साथ दुर्व्यवहार करोगे, या मेरी बेटियों के अतिरिक्त अन्य स्त्रियों को अपनी पत्नी बनाओगे—हमारे साथ कोई मनुष्य नहीं है[a]—तो देखो, परमेश्वर मेरे और तुम्हारे बीच साक्षी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, कोई मानवीय साक्षी उपस्थित नहीं है।
    reason: प्रसंगगत आशय स्पष्ट करने के लिए।
lexical_decisions:
- source_word: תְּעַנֶּה
  choice: दुर्व्यवहार करो
  rationale: पिएल रूप यहाँ वैवाहिक संबंध में लाबान की बेटियों को कष्ट देने या उनके साथ बुरा व्यवहार करने की ओर संकेत करता है। ‘दुर्व्यवहार’ आधुनिक हिन्दी में स्वाभाविक और अर्थानुकूल है।
- source_word: בְּנֹתַי
  choice: मेरी बेटियों
  rationale: संबंधवाचक बहुवचन का सीधा अनुवाद; मूल की पुनरावृत्ति को बल और स्पष्टता के लिए दोनों स्थानों पर रखा गया है।
- source_word: תִּקַּח נָשִׁים עַל בְּנֹתַי
  choice: मेरी बेटियों के अतिरिक्त और स्त्रियों को पत्नी बनाओ
  rationale: मुहावरे का अर्थ लाबान की बेटियों के साथ-साथ अतिरिक्त पत्नियाँ ग्रहण करना है, उन्हें छोड़कर दूसरी पत्नियाँ करना नहीं।
- source_word: אֵין אִישׁ עִמָּנוּ
  choice: हमारे साथ कोई आदमी नहीं है
  rationale: इब्रानी वाक्य को सीधे रखा गया है। प्रसंग में इसका आशय किसी मानवीय साक्षी की अनुपस्थिति है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: רְאֵה
  choice: देखो
  rationale: एकवचन आज्ञार्थक रूप की सीधी और स्वाभाविक अभिव्यक्ति, जो गंभीर चेतावनी की ओर ध्यान खींचती है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: वाचा के प्रसंग में यह एकवचन परमेश्वर को साक्षी के रूप में प्रस्तुत करता है।
- source_word: עֵד
  choice: साक्षी
  rationale: वाचा-संबंधी गंभीर कथन के लिए स्वाभाविक और गरिमापूर्ण हिन्दी शब्द।
- source_word: בֵּינִי וּבֵינֶךָ
  choice: मेरे और तुम्हारे बीच
  rationale: दोनों पक्षों के बीच उत्तरदायित्व व्यक्त करने वाले संबंधवाचक वाक्यांश का सीधा अनुवाद।
theological_decisions:
- issue: אִישׁ का सामान्य मानवीय अर्थ
  choice: कोई आदमी नहीं है
  alternative: कोई मनुष्य नहीं है / कोई मानवीय साक्षी उपस्थित नहीं है
  rationale: मुख्य पाठ में אִישׁ के सामान्य और स्वाभाविक हिन्दी समकक्ष ‘आदमी’ को रखा गया है; प्रसंगगत आशय यह है कि कोई मानव साक्षी उपस्थित नहीं है।
- issue: אֵין אִישׁ עִמָּנוּ का वाक्यगत संबंध
  choice: 'स्वतंत्र कथन के रूप में: ‘हमारे साथ कोई आदमी नहीं है’'
  alternative: 'रियायती अर्थ: ‘भले ही हमारे साथ कोई आदमी नहीं है’'
  rationale: मूल इब्रानी में रियायती संयोजक स्पष्ट नहीं है। इसलिए मुख्य पाठ में संबंध को अनावश्यक रूप से निश्चित किए बिना कथन को सीधे रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दुर्व्यवहार’ relational harm को स्पष्ट करता है, जबकि ‘पत्नी बनाओ’ प्राचीन ‘स्त्रियाँ लेना’ मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है। मूल की गंभीर वाचा-संबंधी ध्वनि और वाक्यगत अस्पष्टता सुरक्षित रखी गई है।
