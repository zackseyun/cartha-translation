base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/036.yaml
  text: Then Jacob became angry and contended with Laban. Jacob answered and said to Laban[a], “What is my transgression? What is my sin, that you have pursued me?”
translation:
  language: hi
  text: तब याकूब क्रोधित हो गया और लाबान से विवाद करने लगा। याकूब ने लाबान को उत्तर देकर कहा, “मेरा अपराध क्या है? मेरा पाप क्या है कि तुमने इतनी हठ से मेरा पीछा किया[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया में जलने का चित्र निहित है और उससे उत्कटता या हठ के साथ पीछा करने का भाव व्यक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְיַעֲקֹב
  choice: तब याकूब क्रोधित हो गया
  rationale: חרה का मुहावरा क्रोध भड़कने को व्यक्त करता है। ‘क्रोधित हो गया’ आधुनिक हिन्दी में स्वाभाविक है और कथानक में अवस्था-परिवर्तन को बनाए रखता है।
- source_word: וַיָּרֶב בְּלָבָן
  choice: और लाबान से झगड़ने लगा
  rationale: ריב यहाँ विरोध करते हुए विवाद या झगड़ा करने का भाव देता है। ‘झगड़ने लगा’ क्रिया की प्रतिकूल और सक्रिय शक्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: याकूब ने लाबान से कहा
  rationale: इब्रानी का सामान्य युग्म ‘उत्तर दिया और कहा’ हिन्दी में अक्षरशः रखने पर बोझिल लगता है; प्रसंग में ‘कहा’ उत्तर देने का भाव पर्याप्त रूप से संप्रेषित करता है।
- source_word: מַה פִּשְׁעִי
  choice: मेरा अपराध क्या है?
  rationale: פֶּשַׁע जानबूझकर किए गए उल्लंघन या अपराध का नैतिक-विधिक भाव रखता है; ‘अपराध’ सामान्य पाठक के लिए स्पष्ट रहते हुए यह बल बनाए रखता है।
- source_word: מַה חַטָּאתִי
  choice: मेरा पाप क्या है?
  rationale: חַטָּאת पाप या दोष को दर्शाता है। ‘पाप’ सीधा अनुवाद है और ‘अपराध’ के साथ मूल की समानांतर प्रश्न-रचना को बचाता है।
- source_word: כִּי
  choice: जो
  rationale: यहाँ כִּי पिछले प्रश्नों और पीछा किए जाने के बीच आधार या परिणाम का संबंध जोड़ता है। हिन्दी की प्रश्नात्मक रचना में ‘जो’ स्वाभाविक है।
- source_word: דָלַקְתָּ אַחֲרָי
  choice: तुमने मेरा इतनी तेज़ी से पीछा किया
  rationale: דלק का मूल चित्र जलने का है और इससे उत्सुकता या तीव्रता से पीछा करने का अर्थ निकलता है। ‘इतनी तेज़ी से पीछा किया’ हिन्दी में इस तीव्रता को स्पष्ट और स्वाभाविक रूप से रखता है।
