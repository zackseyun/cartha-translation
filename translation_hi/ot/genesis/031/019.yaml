base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/019.yaml
  text: Laban had gone to shear his flock[a], and Rachel stole the household idols that belonged to her father.
translation:
  language: hi
  text: लाबान अपनी भेड़-बकरियों का ऊन कतरने गया हुआ था, और राहेल ने अपने पिता की घर की देव-मूर्तियाँ[a] चुरा लीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: तराफीम; इसका अनुवाद “गृह-देवता” भी किया जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלַךְ
  choice: गया हुआ था
  rationale: 'कथानक में यह क्रिया मुख्य घटना की पृष्ठभूमि बताती है: राहेल के कार्य के समय लाबान वहाँ से जा चुका था। हिंदी में ‘गया हुआ था’ यह पूर्वस्थिति स्वाभाविक रूप से व्यक्त करता है।'
- source_word: לִגְזֹז
  choice: ऊन कतरने
  rationale: यह क्रिया भेड़ों अथवा झुंड के पशुओं का ऊन कतरने के लिए प्रयुक्त होती है; हिंदी में केवल ‘कतरने’ की अपेक्षा ‘ऊन कतरने’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: צֹאנוֹ
  choice: अपनी भेड़-बकरियों
  rationale: צֹאן छोटे पालतू पशुओं के झुंड, विशेषकर भेड़ और बकरियों, को सामूहिक रूप से दर्शा सकता है। ‘भेड़-बकरियाँ’ आधुनिक हिंदी में अर्थ को स्पष्ट रखता है।
- source_word: וַתִּגְנֹב
  choice: चुरा लीं
  rationale: גנב का सीधा अर्थ ‘चुराना’ है; इसे ‘चुपके से ले लिया’ कहकर नैतिक अर्थ को हल्का नहीं किया गया। स्त्रीलिंग बहुवचन ‘मूर्तियाँ’ के साथ ‘लीं’ का मेल है।
- source_word: הַתְּרָפִים
  choice: गृह-मूर्तियाँ
  rationale: תְּרָפִים घर से संबद्ध उपासना-वस्तुओं या देव-प्रतिमाओं को सूचित करता है। ‘गृह-मूर्तियाँ’ उनका घरेलू संदर्भ और मूर्तिरूप दोनों साधारण पाठक के लिए संक्षेप में व्यक्त करता है; मूल पद और अन्य प्रचलित अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: אֲשֶׁר לְאָבִיהָ
  choice: अपने पिता की
  rationale: यह पद स्वामित्व व्यक्त करता है। ‘अपने पिता की’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है तथा राहेल के पिता से संबंध स्पष्ट करता है।
- source_word: וְ
  choice: और
  rationale: आरंभिक संयोजक को हिंदी कथावाचन में स्वाभाविक ‘और’ से व्यक्त किया गया है; स्रोत में अलग से ‘अब’ अर्थ वाला कोई शब्द नहीं है।
theological_decisions:
- issue: अवैध उपासना-वस्तुओं के संदर्भ में תְּרָפִים का अनुवाद
  choice: गृह-मूर्तियाँ
  alternative: तराफीम; गृह-देवता
  rationale: इब्रानी शब्द घरेलू धार्मिक प्रतिमाओं को दर्शाता है। ‘गृह-मूर्तियाँ’ उनकी धार्मिक और घरेलू प्रकृति समझने योग्य ढंग से बताता है, पर शब्द की सटीक सांस्कृतिक पहचान पूरी तरह निश्चित मानकर नहीं चलता; इसलिए विकल्प पाद-टिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भेड़-बकरियों का ऊन कतरने’ ग्रामीण क्रिया को स्पष्ट करता है। ‘गृह-मूर्तियाँ’ सामान्य पाठक के लिए सुबोध है, जबकि पाद-टिप्पणी मूल सांस्कृतिक पद की अस्पष्टता बनाए रखती है।
