  text: וַ/יַּ֥רְא יַעֲקֹ֖ב אֶת פְּנֵ֣י לָבָ֑ן וְ/הִנֵּ֥ה אֵינֶ֛/נּוּ עִמּ֖/וֹ כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/002.yaml
  text: And Jacob saw Laban’s face[a], and behold[b], it was not toward him as before.
translation:
  language: hi
  text: याकूब ने लाबान का चेहरा देखा[a], और देखो, याकूब के प्रति लाबान का रुख पहले जैसा नहीं था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “लाबान का मुख”; यहाँ मुख से उसके दिखाई देने वाले भाव या रुख का भी संकेत मिलता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और देखो, वह उसके साथ कल और परसों जैसा नहीं था”; यह एक इब्रानी मुहावरा है, जिसका अर्थ है कि याकूब के प्रति लाबान का रुख पहले जैसा नहीं रहा था।
    reason: literal_idiom
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: ראה का सामान्य कथात्मक अर्थ “देखना” है; इससे याकूब के प्रत्यक्ष अवलोकन का सरल भाव बना रहता है।
- source_word: פְּנֵי לָבָן
  choice: लाबान का चेहरा
  rationale: मूल पाठ की ठोस “चेहरे” वाली छवि सुरक्षित रखी गई है; प्रसंग में यह लाबान के दिखाई देने वाले भाव और रुख को भी प्रकट करती है।
- source_word: וְהִנֵּה
  choice: और पाया कि
  rationale: הִנֵּה आगे की बात पर ध्यान खींचकर अचानक अनुभूति या अवलोकन को उभारता है। आधुनिक हिन्दी में “पाया कि” यही कथात्मक कार्य स्वाभाविक ढंग से करता है।
- source_word: אֵינֶנּוּ עִמּוֹ
  choice: लाबान का व्यवहार याकूब के प्रति ... नहीं था
  rationale: शाब्दिक “वह उसके साथ नहीं था” हिन्दी में अस्पष्ट और भ्रामक हो सकता है। प्रसंग में यह संबंध-सूचक मुहावरा लाबान के बदले हुए रुख को बताता है; दोनों नाम दोहराने से सर्वनामों की अस्पष्टता दूर होती है।
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: पहले जैसा
  rationale: “कल और परसों जैसा” एक इब्रानी मुहावरा है जिसका अर्थ पूर्व समय या पहले की स्थिति है। “पहले जैसा” आधुनिक हिन्दी में स्वाभाविक समतुल्य है।
