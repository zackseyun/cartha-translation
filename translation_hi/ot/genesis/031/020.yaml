lexical_decisions:
- source_word: וַיִּגְנֹב ... אֶת־לֵב
  choice: धोखे में रखा
  rationale: शाब्दिक रूप से यह ‘हृदय चुरा लिया’ है, पर यहाँ इब्रानी मुहावरा छिपकर काम करने और सामने वाले को अनजान रखने का भाव देता है। ‘धोखे में रखा’ प्रसंग में उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है और प्रेम-संबंधी गलत अर्थ से बचाता है।
- source_word: הָאֲרַמִּי
  choice: अरामी
  rationale: यह इब्रानी जातीय-भौगोलिक पद का सीधा और ऐतिहासिक रूप से सटीक हिन्दी रूप है।
- source_word: עַל בְּלִי הִגִּיד לוֹ
  choice: यह न बताकर
  rationale: यह रचना उस साधन या रीति को बताती है जिसके द्वारा लाबान को अनजान रखा गया; ‘यह न बताकर’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: כִּי בֹרֵחַ הוּא
  choice: कि वह भाग रहा है
  rationale: वर्तमान कृदंत जारी या तत्काल घट रही क्रिया का बोध कराता है; ‘भाग रहा है’ उसी पक्ष को बनाए रखता है।
