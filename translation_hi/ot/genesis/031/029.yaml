  text: יֶשׁ לְ/אֵ֣ל יָדִ֔/י לַ/עֲשׂ֥וֹת עִמָּ/כֶ֖ם רָ֑ע וֵֽ/אלֹהֵ֨י אֲבִי/כֶ֜ם אֶ֣מֶשׁ אָמַ֧ר אֵלַ֣/י לֵ/אמֹ֗ר הִשָּׁ֧מֶר לְ/ךָ֛ מִ/דַּבֵּ֥ר עִֽם יַעֲקֹ֖ב מִ/טּ֥וֹב עַד רָֽע־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/029.yaml
  text: It is in my power to do you harm[a], but the God of your father spoke to me last night, saying, ‘Be careful not to speak to Jacob either good or bad.’
translation:
  language: hi
  text: तुम लोगों की हानि करना मेरे वश में है; परन्तु तुम्हारे पिता के परमेश्वर ने पिछली रात मुझसे कहा, ‘सावधान रहना, याकूब से भली या बुरी कोई बात न कहना।’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘भले से बुरे तक’; यह पूरे दायरे को समेटनेवाला मुहावरा है, जिसका अर्थ प्रसंग में किसी भी प्रकार की बात कहना हो सकता है।
    reason: मूल इब्रानी मुहावरे की शाब्दिक बनावट और व्यापक अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  choice: मेरे वश में है
  rationale: यह इब्रानी मुहावरा सामर्थ्य या अधिकार होने को व्यक्त करता है। ‘मेरे वश में है’ आधुनिक हिन्दी में स्वाभाविक रूप से वही अर्थ देता है।
- source_word: לַעֲשׂוֹת עִמָּכֶם רָע
  choice: तुम लोगों की हानि करना
  rationale: यहाँ רָע का आशय सुननेवालों के विरुद्ध हानिकारक कार्रवाई करना है। עִמָּכֶם बहुवचन है, इसलिए ‘तुम लोगों’ रखा गया है।
- source_word: וֵאלֹהֵי אֲבִיכֶם
  choice: परन्तु तुम्हारे पिता के परमेश्वर
  rationale: वाव प्रसंग में लाबान की सामर्थ्य और परमेश्वर की रोक के बीच विरोध दिखाता है, इसलिए ‘परन्तु’ उपयुक्त है। ‘तुम्हारे पिता’ इब्रानी के एकवचन ‘पिता’ और बहुवचन संबोधन—दोनों को बनाए रखता है।
- source_word: אֶמֶשׁ
  choice: पिछली रात
  rationale: प्रसंग में यह बीती हुई रात को दर्शाता है; ‘पिछली रात’ स्पष्ट और सहज आधुनिक हिन्दी है।
- source_word: הִשָּׁמֶר לְךָ
  choice: सावधान रहना
  rationale: यह कड़ी चेतावनी और निषेध की भूमिका व्यक्त करता है, बिना अनावश्यक रूप से उसे धमकी के रूप में तीखा किए।
- source_word: מִדַּבֵּר עִם יַעֲקֹב מִטּוֹב עַד רָע
  choice: याकूब से भली या बुरी कोई बात न कहना
  rationale: निषेधात्मक रचना को स्वाभाविक हिन्दी में व्यक्त किया गया है और ‘भली या बुरी’ की इब्रानी ध्रुवीय अभिव्यक्ति भी सुरक्षित रखी गई है।
theological_decisions:
- issue: लाबान से बोलनेवाले אֱלֹהִים का उल्लेख
  choice: तुम्हारे पिता के परमेश्वर
  alternative: तुम्हारे पूर्वजों के परमेश्वर
  rationale: मूल पाठ में ‘पिता’ एकवचन है। अनुवाद उसी व्यक्तिगत और वाचागत संदर्भ को बनाए रखता है तथा बाद की कोई धर्मसैद्धान्तिक व्याख्या इसमें नहीं जोड़ता।
- issue: מִטּוֹב עַד רָע निषेध का विस्तार
  choice: भली या बुरी कोई बात न कहना
  alternative: याकूब से कुछ भी न कहना
  rationale: मुख्य पाठ में मूल की अर्थपूर्ण ध्रुवीय अभिव्यक्ति को सुरक्षित रखा गया है; उसके व्यापक मुहावरेदार आशय को पाद-टिप्पणी में स्पष्ट किया गया है, ताकि संभावित तनाव को चुपचाप समाप्त न किया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परमेश्वर’, ‘मेरे वश में’ और ‘सावधान रहना’ मानक हिन्दी प्रयोग हैं। बहुवचन עִמָּכֶם/אֲבִיכֶם को ‘तुम लोगों’ और ‘तुम्हारे’ से दर्शाया गया है, जबकि ‘पिता’ का एकवचन सुरक्षित है।
