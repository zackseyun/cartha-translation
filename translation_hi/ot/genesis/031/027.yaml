- source_word: לָמָּה
  choice: क्यों
  rationale: कारण पूछने वाले सामान्य प्रश्नवाचक शब्द का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: נַחְבֵּאתָ לִבְרֹחַ
  choice: भागने के लिए छिपे
  rationale: निफ़अल रूप की आत्मवाचक छाया और ברח के ‘भागना’ अर्थ, दोनों को स्पष्ट रखता है।
- source_word: וַתִּגְנֹב אֹתִי
  choice: मुझसे चुपके से निकल गए
  rationale: शाब्दिक रूप ‘मुझे चुरा लिया’ है, पर यहाँ इब्रानी मुहावरे का आशय किसी की जानकारी के बिना चुपचाप निकल जाना है।
- source_word: וְלֹא הִגַּדְתָּ לִּי
  choice: तुमने मुझे बताया क्यों नहीं
  rationale: हिफ़ील क्रिया का सीधा और स्वाभाविक हिन्दी रूप; प्रश्न की आरोपात्मक शैली बनाए रखता है।
- source_word: וָאֲשַׁלֵּחֲךָ
  choice: ताकि मैं तुम्हें ... विदा करता
  rationale: वाव को प्रसंगानुसार परिणामसूचक मानते हुए उस अवास्तविक संभावना को व्यक्त करता है कि बताने पर लाबान विधिवत विदा करता।
- source_word: בְּשִׂמְחָה
  choice: आनन्द के साथ
  rationale: विदाई के उत्सवी भाव को सरल, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּבְשִׁרִים
  choice: और गीतों के साथ
  rationale: बहुवचन संज्ञा का सीधा अनुवाद; ‘गायन’ भी संभव है।
- source_word: בְּתֹף
  choice: डफ
  rationale: हाथ से बजाए जाने वाले प्राचीन तालवाद्य के लिए आधुनिक हिन्दी में परिचित और संक्षिप्त शब्द।
- source_word: וּבְכִנּוֹר
  choice: वीणा
  rationale: भारतीय पाठक के लिए बोधगम्य तारवाद्य-संज्ञा; मूल शब्द अधिक विशेष रूप से लायर-जैसे वाद्य को दर्शाता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
