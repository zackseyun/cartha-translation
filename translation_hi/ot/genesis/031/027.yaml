base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/027.yaml
  text: Why did you hide yourself to flee and steal away from me[a], and not tell me, so that I might have sent you away with joy and with songs[d][c][b], with tambourine and lyre?
translation:
  language: hi
  text: तुम भागने के लिए क्यों छिपे और मुझसे चुपके से क्यों निकल गए[a]? तुमने मुझे क्यों नहीं बताया, जिससे मैं तुम्हें आनन्द और गीतों[b], डफली[c] और लायर[d] के साथ विदा करता?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुमने मुझे चुरा लिया।” यहाँ इब्रानी मुहावरे का अर्थ किसी की जानकारी के बिना चुपचाप निकल जाना है।
    reason: lexical_alternative
  - marker: b
    text: या “गायन के साथ।”
    reason: lexical_alternative
  - marker: c
    text: परम्परागत रूप से “डफ” या “तम्बूरा”; यह हाथ से बजाया जाने वाला तालवाद्य था।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी शब्द लायर-जैसे प्राचीन तारवाद्य को दर्शाता है। इसका अनुवाद परम्परागत रूप से “हार्प” भी किया गया है।
    reason: lexical_alternative
