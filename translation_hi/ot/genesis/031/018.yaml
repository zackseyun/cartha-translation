base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/018.yaml
  text: And he drove all his livestock and all his possessions that he had acquired—the livestock he had acquired in Paddan-aram—to go to Isaac his father in the land of Canaan[a].
translation:
  language: hi
  text: और वह अपने सारे पशुधन और अपनी सारी सम्पत्ति, जो उसने अर्जित की थी—वह पशुधन जो उसने पद्दन-अराम में अर्जित किया था—हाँककर अपने पिता इसहाक के पास, कनान देश की ओर, चल पड़ा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कनान देश को।” इब्रानी में यहाँ दिशासूचक रूप है, जिसका शाब्दिक भाव “कनान देश की ओर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְהַג
  choice: हाँककर ... चल पड़ा
  rationale: נהג पशुओं को आगे बढ़ाते हुए ले जाने को दर्शाता है। हिंदी में ‘हाँककर’ पशुपालकीय संदर्भ को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘चल पड़ा’ यात्रा के उद्देश्य को सहज वाक्य में समाहित करता है।
- source_word: מִקְנֵהוּ
  choice: अपने सारे पशुधन
  rationale: מִקְנֶה सभी पाले हुए पशुओं का सामूहिक बोध देता है; ‘पशुधन’ व्यापक, आधुनिक और संदर्भानुकूल है।
- source_word: רְכֻשׁוֹ אֲשֶׁר רָכָשׁ
  choice: अपनी सारी अर्जित सम्पत्ति
  rationale: רְכוּשׁ चल-अचल संदर्भ में संचित माल या सम्पत्ति को दर्शाता है और רכש अर्जन को। संक्षिप्त हिंदी में ‘अर्जित सम्पत्ति’ दोनों का अर्थ सुरक्षित रखता है।
- source_word: מִקְנֵה קִנְיָנוֹ אֲשֶׁר רָכַשׁ
  choice: अर्थात् ... अर्जित किए हुए अपने पशुधन को
  rationale: इब्रानी की व्याख्यात्मक तथा पुनरुक्त अभिव्यक्ति को डैश और ‘अर्थात्’ द्वारा स्पष्ट रखा गया है; इसे पूरी तरह हटाया नहीं गया।
- source_word: בְּפַדַּן אֲרָם
  choice: पद्दन-अराम में
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण किया गया है और संयुक्त नाम को हाइफ़न सहित रखा गया है।
- source_word: לָבוֹא אֶל יִצְחָק אָבִיו
  choice: अपने पिता इसहाक के पास ... चल पड़ा
  rationale: उद्देश्यसूचक infinitive को हिंदी की स्वाभाविक यात्रा-अभिव्यक्ति में प्रस्तुत किया गया है; गंतव्य इसहाक के पास पहुँचना है।
- source_word: אַרְצָה כְּנָעַן
  choice: कनान देश की ओर
  rationale: दिशासूचक ה को ‘की ओर’ से व्यक्त किया गया है, जिससे कनान की दिशा में गति का मूल अर्थ स्पष्ट रहता है।
