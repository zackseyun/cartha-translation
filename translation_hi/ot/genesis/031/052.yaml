source:
  edition: WLC
  text: עֵ֚ד הַ/גַּ֣ל הַ/זֶּ֔ה וְ/עֵדָ֖ה הַ/מַּצֵּבָ֑ה אִם אָ֗נִי לֹֽא אֶֽעֱבֹ֤ר אֵלֶ֨י/ךָ֙ אֶת הַ/גַּ֣ל הַ/זֶּ֔ה וְ/אִם אַ֠תָּה לֹא תַעֲבֹ֨ר אֵלַ֜/י אֶת הַ/גַּ֥ל הַ/זֶּ֛ה וְ/אֶת הַ/מַּצֵּבָ֥ה הַ/זֹּ֖את לְ/רָעָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/052.yaml
  text: This heap is a witness[a], and the pillar is a witness, that I will not pass over this heap toward you[c][b], and that you will not pass over this heap and this pillar toward me for harm.
translation:
  language: hi
  text: यह ढेर साक्षी है, और यह खम्भा भी साक्षी है कि मैं तुम्हारी ओर इस ढेर के पार हानि पहुँचाने के लिए नहीं जाऊँगा, और तुम मेरी ओर इस ढेर और इस खम्भे के पार हानि पहुँचाने के लिए नहीं आओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵד / וְעֵדָה
  choice: साक्षी है / भी साक्षी है
  rationale: दोनों सीमा-चिह्नों के साक्षी होने का समानान्तर कथन स्पष्ट रखा गया है; 'साक्षी' आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: גַּל
  choice: ढेर
  rationale: प्रसंग में यह पत्थरों का बनाया हुआ ढेर है। 'ढेर' मूल भौतिक बिंब को संक्षेप में बनाए रखता है।
- source_word: מַצֵּבָה
  choice: खम्भा
  rationale: यह खड़ा किया गया स्मारक पत्थर है; 'खम्भा' सरल और प्रचलित बाइबलीय हिन्दी है।
- source_word: אִם ... לֹא
  choice: कि ... नहीं
  rationale: शपथ-संबंधी इस कथन में אִם निषेधात्मक प्रतिज्ञा की विषयवस्तु प्रस्तुत करता है; हिन्दी में शाब्दिक 'यदि नहीं' अस्वाभाविक और भ्रामक होता।
- source_word: אֶעֱבֹר / תַעֲבֹר
  choice: पार ... जाऊँगा / आओगे
  rationale: क्रिया सीमा-चिह्न को पार करने की गति बताती है। वक्ता और श्रोता की दिशाओं के अनुसार 'जाऊँगा' और 'आओगे' स्वाभाविक हिन्दी देते हैं।
- source_word: אֵלֶיךָ / אֵלַי
  choice: तुम्हारी ओर / मेरी ओर
  rationale: दिशात्मक अर्थ सुरक्षित रखा गया है और अपने आप 'विरुद्ध' का भाव नहीं जोड़ा गया।
- source_word: לְרָעָה
  choice: हानि पहुँचाने के लिए
  rationale: यह केवल सीमा पार करने का निषेध नहीं, बल्कि हानिकारक या शत्रुतापूर्ण उद्देश्य से पार करने का निषेध है। उद्देश्य को दोनों समानान्तर खण्डों में स्पष्ट करना हिन्दी में अर्थ-संबंध को साफ रखता है।
