  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मूल की समानान्तर संरचना सुरक्षित है। 'हानि पहुँचाने के लिए' को अर्थ की दृष्टि से दोनों क्रियाओं के साथ व्यक्त किया गया है, यद्यपि इब्रानी में यह अंत में एक बार आता है और पूरे संयुक्त निषेध पर लागू होता है।
