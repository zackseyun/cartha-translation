  yaml_path: translation/ot/genesis/002/013.yaml
  text: And the name of the second river was Gihon[b][a]; it is the one that goes around all the land of Cush.
translation:
  language: hi
  text: और दूसरी नदी का नाम गीहोन था; यह वही है जो कूश[b] के पूरे देश के चारों ओर बहती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कूश के पूरे देश को घेरे हुए है।”
    reason: lexical_alternative
  - marker: b
    text: कूश एक स्थान-नाम है, जिसे परंपरागत रूप से मिस्र के दक्षिण के क्षेत्रों से जोड़ा जाता है; इब्रानी पाठ प्राचीन नाम को ही सुरक्षित रखता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: और ... का नाम
  rationale: וְ नदी-वर्णन की निरंतरता दिखाता है, और שֵׁם का सीधा अर्थ ‘नाम’ है।
- source_word: הַ/נָּהָר הַ/שֵּׁנִי
  choice: दूसरी नदी
  rationale: נָהָר के लिए ‘नदी’ और क्रमसूचक הַשֵּׁנִי के लिए ‘दूसरी’ स्वाभाविक तथा सटीक हैं।
- source_word: גִּיחוֹן
  choice: गीहोन
  rationale: प्राचीन व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: הוּא
  choice: यह वही है
  rationale: सर्वनाम का पहचानसूचक और कुछ बलयुक्त भाव आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: הַ/סּוֹבֵב
  choice: के चारों ओर बहती है
  rationale: סבב का अर्थ ‘चारों ओर जाना/घेरना’ हो सकता है; नदी के संदर्भ में ‘चारों ओर बहती है’ सहज है, पर भूगोल की सटीक प्रकृति को निर्णायक रूप से नहीं बताता।
- source_word: אֵת כָּל אֶרֶץ
  choice: के पूरे देश
  rationale: प्रत्यक्ष कर्मचिह्न אֵת का अलग अनुवाद आवश्यक नहीं; כָּל אֶרֶץ को स्वाभाविक हिन्दी में ‘पूरे देश’ कहा गया है।
- source_word: כּוּשׁ
  choice: कूश
  rationale: स्थान-नाम को लिप्यंतरित किया गया है; ‘इथियोपिया’ कहना इस प्राचीन संदर्भ में व्याख्यात्मक और संभावित रूप से कालभ्रमकारी होगा।
