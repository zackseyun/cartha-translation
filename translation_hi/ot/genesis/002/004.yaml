base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/004.yaml
  text: These are the generations of the heavens and the earth when they were created[c][b][a], in the day that Yahweh God made the earth and the heavens.
translation:
  language: hi
  text: 'आकाश और पृथ्वी की उत्पत्ति का वृत्तांत यह है[a]: जब वे सृजे गए, उस समय[b] याहवे[c] परमेश्वर ने पृथ्वी और आकाश को बनाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी तोलेदोत का अर्थ प्रसंग के अनुसार ‘वंशावली’, ‘उत्पत्ति’, ‘वृत्तांत’ या ‘इतिहास’ हो सकता है। यहाँ यह उत्पत्ति की पुस्तक के एक नए खंड का सूत्र है।
    reason: lexical_alternative
  - marker: b
    text: ‘जिस समय’ का शाब्दिक इब्रानी रूप ‘जिस दिन’ है। यह यहाँ कालवाचक मुहावरा है और इसका अर्थ ‘जब’ या ‘उस समय’ हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी नाम YHWH है। इसे ‘यहोवा’ भी लिखा जाता है और परंपरागत रूप से ‘प्रभु’ कहा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה תוֹלְדוֹת
  choice: उत्पत्ति का वृत्तांत यह है
  rationale: यह सूत्र उत्पत्ति की पुस्तक में खंड-शीर्षक का काम करता है। ‘वंशावलियाँ’ यहाँ स्वाभाविक नहीं, क्योंकि विषय आकाश और पृथ्वी हैं; ‘उत्पत्ति का वृत्तांत’ मूल शब्द के उद्गम और विवरण—दोनों आयामों को संप्रेषित करता है।
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: यह समस्त सृष्टि को सूचित करने वाला युग्म है। हिन्दी में ‘आकाश और पृथ्वी’ स्वाभाविक और परिचित है; इब्रानी שָׁמַיִם का रूप व्याकरणतः बहुवचन/द्विवचन-सदृश होने पर भी हिन्दी में ‘आकाश’ अधिक सहज है।
- source_word: בְּהִבָּרְאָם
  choice: जब वे सृजे गए
  rationale: ב उपसर्ग सहित निफ़अल infinitive construct का कालवाचक और कर्मवाच्य बल सुरक्षित रखा गया है। बहुवचन ‘वे’ आकाश और पृथ्वी की ओर संकेत करता है।
- source_word: בְּיוֹם עֲשׂוֹת
  choice: जिस समय ... बनाया
  rationale: शाब्दिक ‘जिस दिन’ यहाँ कालवाचक मुहावरा है, जिसका अर्थ ‘जब/जिस समय’ है; इसलिए इसे किसी एक चौबीस घंटे के दिन तक सीमित किए बिना स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: व्यक्तिगत नाम YHWH को हिन्दी में प्रचलित रूप ‘यहोवा’ से लिप्यंतरित किया गया है और אֱלֹהִים को ‘परमेश्वर’ कहा गया है।
- source_word: אֶרֶץ וְשָׁמָיִם
  choice: पृथ्वी और आकाश
  rationale: दूसरे अर्धांश में मूल पाठ द्वारा किए गए क्रम-विपर्यय को सुरक्षित रखा गया है।
theological_decisions:
- issue: पवित्र नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। ‘यहोवा’ साधारण हिन्दी बाइबलीय प्रयोग में पहचानने योग्य है; ‘याहवे’ सम्भावित उच्चारण को अधिक निकटता से दर्शाता है, जबकि ‘प्रभु’ नाम को उपाधि में बदल देता है। वैकल्पिक रूप फुटनोट में दिया गया है।
- issue: בְּיוֹם को सृष्टि के किसी विशिष्ट दिन के रूप में समझना
  choice: जिस समय
  alternative: जिस दिन
  rationale: यह इब्रानी प्रयोग यहाँ व्यापक कालवाचक मुहावरा हो सकता है। अनुवाद कालगत संबंध बताता है, पर किसी विशिष्ट व्याख्यात्मक कालावधि का निर्णय नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य को शीर्षक-सदृश सूत्र के रूप में प्रस्तुत किया गया है; विराम-चिह्न दोनों कालवाचक उपवाक्यों का संबंध स्पष्ट करते हैं।
