source:
  edition: WLC
  text: וַ/יַּפֵּל֩ יְהוָ֨ה אֱלֹהִ֧ים תַּרְדֵּמָ֛ה עַל הָ/אָדָ֖ם וַ/יִּישָׁ֑ן וַ/יִּקַּ֗ח אַחַת֙ מִ/צַּלְעֹתָ֔י/ו וַ/יִּסְגֹּ֥ר בָּשָׂ֖ר תַּחְתֶּֽ/נָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
translation:
  language: hi
  text: तब यहोवा परमेश्वर ने उस मनुष्य को गहरी नींद में डाल दिया, और वह सो गया। फिर परमेश्वर ने उसकी पसलियों में से एक पसली ली[a] और उस स्थान को मांस से बंद कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके पार्श्व का एक भाग।” इब्रानी शब्द का अर्थ “पसली” के साथ-साथ “पार्श्व” या “पार्श्व-भाग” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל ... תַּרְדֵּמָה
  choice: गहरी नींद में डाल दिया
  rationale: हिफ़ील रूप कारणवाचक है। यह हिंदी प्रयोग इब्रानी के आशय—परमेश्वर द्वारा गहरी नींद लाए जाने—को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: व्यक्तिगत नाम יהוה को 'यहोवा' और אֱלֹהִים को प्रचलित, गरिमापूर्ण हिंदी 'परमेश्वर' से व्यक्त किया गया है।
- source_word: תַּרְדֵּמָה
  choice: गहरी नींद
  rationale: यह संज्ञा भारी अथवा असाधारण रूप से गहरी नींद का बोध कराती है; 'गहरी नींद' स्पष्ट और सहज हिंदी है।
- source_word: הָאָדָם
  choice: उस मनुष्य
  rationale: निकटवर्ती प्रसंग में यह सामान्य मानवजाति नहीं, एक विशिष्ट पुरुष व्यक्ति को सूचित करता है; 'उस मनुष्य' पूर्वोल्लिखित पात्र को स्वाभाविक रूप से दर्शाता है।
- source_word: וַיִּישָׁן
  choice: और वह सो गया
  rationale: सरल कथात्मक क्रिया को स्वाभाविक आधुनिक हिंदी में व्यक्त किया गया है।
- source_word: אַחַת מִצַּלְעֹתָיו
  choice: उसकी पसलियों में से एक पसली
  rationale: צֵלָע का अर्थ 'पसली' या 'बगल/पार्श्व' हो सकता है। शारीरिक क्रिया और मांस से स्थान बंद करने के प्रसंग में 'पसली' सहज है, जबकि दूसरा संभव अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיִּסְגֹּר בָּשָׂר
  choice: मांस भरकर उसे बंद कर दिया
  rationale: סגר का मूल अर्थ बंद करना है। हिंदी वाक्यांश उस स्थान को मांस से बंद करने की क्रिया स्पष्ट करता है, बिना उपचार जैसी अतिरिक्त धारणा जोड़े।
- source_word: תַּחְתֶּנָּה
  choice: उसकी जगह
  rationale: शाब्दिक रूप से 'उसके नीचे' संभव है, पर यहाँ मुहावरे का संदर्भ निकाली गई पसली के स्थान से है; 'उसकी जगह' हिंदी में अर्थ को स्पष्ट और स्वाभाविक रखता है।
theological_decisions:
- issue: प्रसंग में אָדָם का अर्थ
  choice: उस मनुष्य
  alternative: मानव / मानव-प्राणी
  rationale: अगले पद में इसी विशिष्ट व्यक्ति से स्त्री के बनाए जाने का वर्णन है, इसलिए यहाँ व्यक्तिगत एकवचन अर्थ प्रमुख है।
- issue: צֵלָע का अर्थ
  choice: पसली
  alternative: बगल / पार्श्व
  rationale: निकालने और उस स्थान को मांस से बंद करने की शारीरिक छवि 'पसली' के अनुकूल है। फिर भी 'बगल/पार्श्व' वास्तविक शब्दार्थ-संभावना है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज कथात्मक प्रवाह और गरिमापूर्ण बाइबलीय शैली। 'उस मनुष्य' संदर्भ की विशिष्टता बनाए रखता है; वास्तविक शब्दार्थ-अस्पष्टता पाद-टिप्पणी में संरक्षित है।
