    reason: lexical_alternative
lexical_decisions:
- source_word: וּזֲהַב
  choice: और ... सोना
  rationale: वाव पिछले वाक्य से वर्णन को जोड़ता है, और זָהָב का सीधा अर्थ ‘सोना’ है।
- source_word: הָאָרֶץ הַהִוא
  choice: उस देश का
  rationale: אֶרֶץ यहाँ पिछले पद में उल्लिखित हवीला के भूभाग को दर्शाता है; आधुनिक हिन्दी में ‘उस देश का’ स्वाभाविक है।
- source_word: טוֹב
  choice: उत्तम है
  rationale: यहाँ शब्द सोने की गुणवत्ता बताता है। ‘उत्तम’ सरल मूल्यांकन को बनाए रखते हुए ‘अच्छा सोना’ की अपेक्षा अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: שָׁם
  choice: वहाँ ... पाए जाते हैं
  rationale: שָׁם का अर्थ ‘वहाँ’ है। दो पदार्थों के मिलने या उपस्थित होने को हिन्दी में ‘पाए जाते हैं’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַבְּדֹלַח
  choice: बदोलह
  rationale: इस पदार्थ की ठीक पहचान अनिश्चित है। इब्रानी नाम का लिप्यंतरण झूठी निश्चितता से बचता है; संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְאֶבֶן הַשֹּׁהַם
  choice: और सुलेमानी पत्थर
  rationale: אֶבֶן को ‘पत्थर’ के रूप में स्पष्ट रखा गया है। שֹׁהַם के लिए पारंपरिक हिन्दी पहचान ‘सुलेमानी’ अपनाई गई है, पर खनिज की अनिश्चित पहचान पादटिप्पणी में सुरक्षित है।
