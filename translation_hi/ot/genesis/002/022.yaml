  text: וַ/יִּבֶן֩ יְהוָ֨ה אֱלֹהִ֧ים אֶֽת הַ/צֵּלָ֛ע אֲשֶׁר לָקַ֥ח מִן הָֽ/אָדָ֖ם לְ/אִשָּׁ֑ה וַ/יְבִאֶ֖/הָ אֶל הָֽ/אָדָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/022.yaml
  text: And the rib that the LORD God had taken from the man, he built into a woman, and he brought her to the man.
translation:
  language: hi
  text: तब यहोवा परमेश्वर ने उस पसली से, जिसे उसने मनुष्य में से लिया था, एक स्त्री को बनाया और उसे मनुष्य के पास ले आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: रूप दिया
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘बनाना/निर्माण करना’ है। स्त्री की सृष्टि के संदर्भ में ‘रूप दिया’ स्वाभाविक हिन्दी है और निर्माण की छवि को बनाए रखता है।
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: व्यक्तिगत दिव्य नाम और उपाधि—दोनों को अलग-अलग बनाए रखा गया है।
- source_word: הַצֵּלָע
  choice: पसली
  rationale: इस प्रसंग में पारंपरिक और व्यापक रूप से समझा जाने वाला अर्थ; यद्यपि शब्द का अर्थ ‘बगल/पार्श्व’ भी हो सकता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ शब्द सामान्य मानव/उस मनुष्य को सूचित करता है; इसे अभी व्यक्तिवाचक नाम ‘आदम’ बनाना आवश्यक नहीं।
- source_word: לְאִשָּׁה
  choice: एक स्त्री
  rationale: 'परिणामसूचक प्रयोग को सहज हिन्दी में व्यक्त करता है: पसली को स्त्री का रूप दिया गया।'
- source_word: וַיְבִאֶהָ
  choice: उसे ... ले आया
  rationale: स्त्रीलिंग कर्म-प्रत्यय को स्पष्ट करते हुए सामान्य हिन्दी कथन-शैली अपनाई गई है।
theological_decisions:
- issue: צֵלָע का अर्थ
  choice: पसली
  alternative: पार्श्व/बगल
  rationale: ‘पसली’ प्राचीन अनुवाद-परंपरा और तत्काल प्रसंग के अनुरूप है, पर मूल शब्द की व्यापक अर्थ-सीमा को नकारा नहीं जाता।
- issue: וַיִּבֶן की स्थापत्यात्मक छवि
  choice: रूप दिया
  alternative: बनाया/निर्मित किया
  rationale: मूल की जानबूझकर रचना की धारणा सुरक्षित रखते हुए असहज हिन्दी ‘स्त्री में बनाया’ से बचा गया है; इससे किसी अतिरिक्त शारीरिक या सिद्धान्तगत व्याख्या को आरोपित नहीं किया जाता।
- issue: הָאָדָם को नाम या सामान्य संज्ञा मानना
  choice: मनुष्य
  alternative: आदम
  rationale: इस चरण में हिब्रू निश्चित पदबंध सामान्य अर्थ ‘मनुष्य’ को बनाए रखता है; व्यक्तिवाचक नाम चुनने से मूल की अर्थगत लचक समय से पहले समाप्त हो सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। वाक्य-क्रम मूल के निकट रखा गया है, पर हिन्दी की स्वाभाविकता के लिए ‘एक स्त्री का रूप दिया’ प्रयोग किया गया है।
