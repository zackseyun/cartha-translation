reference: Genesis 2:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְבָ֤רֶךְ אֱלֹהִים֙ אֶת י֣וֹם הַ/שְּׁבִיעִ֔י וַ/יְקַדֵּ֖שׁ אֹת֑/וֹ כִּ֣י ב֤/וֹ שָׁבַת֙ מִ/כָּל מְלַאכְתּ֔/וֹ אֲשֶׁר בָּרָ֥א אֱלֹהִ֖ים לַ/עֲשֽׂוֹת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/003.yaml
  text: So God blessed the seventh day and made it holy[d][c][b][a], because on it he rested from all his work that God had created to make.
translation:
  language: hi
  text: इसलिए परमेश्वर ने सातवें दिन को आशीष दी और उसे पवित्र ठहराया,[a] क्योंकि उस दिन उसने अपने उस सारे काम से विश्राम लिया[b] जिसे परमेश्वर ने रचकर बनाया था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसे पवित्र किया’ अथवा ‘उसे पवित्र करके अलग रखा।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का अर्थ ‘रुक गया’ या ‘काम करना छोड़ दिया’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक रूप के निकट: ‘जिसे परमेश्वर ने करने के लिए रचा था।’ यह अंतिम वाक्यांश कठिन है; इसे ‘जिसे परमेश्वर ने रचा और बनाया था’ भी समझा जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: आशीष दी
  rationale: पिएल रूप यहाँ दिन पर आशीष प्रदान करने को व्यक्त करता है; ‘आशीष दी’ स्वाभाविक और प्रचलित हिन्दी है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया के साथ यह इस प्रसंग में एक परमेश्वर को सूचित करता है; ‘परमेश्वर’ गरिमापूर्ण और सामान्य हिन्दी बाइबलीय पद है।
- source_word: יוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: संज्ञा और क्रमवाचक संख्या का सीधा तथा स्वाभाविक अनुवाद।
- source_word: וַיְקַדֵּשׁ אֹתוֹ
  choice: उसे पवित्र ठहराया
  rationale: קדש का पिएल रूप पवित्र करने अथवा पवित्र उपयोग के लिए अलग करने का भाव रखता है; ‘पवित्र ठहराया’ इस अर्थ को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह सातवें दिन को आशीष देने और पवित्र ठहराने का कारण प्रस्तुत करता है।
- source_word: בּוֹ
  choice: उस दिन
  rationale: दिन के संदर्भ में शाब्दिक ‘उसमें’ की अपेक्षा ‘उस दिन’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: שָׁבַת
  choice: विश्राम लिया
  rationale: क्रिया का अर्थ काम से रुकना या विरत होना भी है; सृष्टि और सब्त के प्रसंग में ‘विश्राम लिया’ स्वाभाविक है और मूल संबंध को बनाए रखता है।
- source_word: מִכָּל מְלַאכְתּוֹ
  choice: अपने उस सारे काम से
  rationale: מלאכה यहाँ परमेश्वर के समस्त सृजन-कार्य को सूचित करता है; ‘काम’ व्यापक और सरल हिन्दी है।
- source_word: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: जिसे परमेश्वर ने रचकर बनाया था
  rationale: अंतिम इब्रानी वाक्यांश व्याकरण की दृष्टि से कठिन है। ‘रचकर बनाया था’ ברא और עשה दोनों को उपस्थित रखता है और हिन्दी में अपेक्षाकृत स्वाभाविक है; अन्य संभव समझों को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: שָׁבַת और सब्त के बीच संबंध
  choice: विश्राम लिया
  alternative: काम करना छोड़ दिया / विरत हुआ
  rationale: ‘विश्राम लिया’ सब्त से जुड़े शब्द-संबंध को बनाए रखता है, पर इसका आशय परमेश्वर की थकान ठहराना आवश्यक नहीं है; ‘विरत हुआ’ शाब्दिक रूप से संभव है।
- issue: וַיְקַדֵּשׁ אֹתוֹ में पवित्रता का भाव
  choice: उसे पवित्र ठहराया
  alternative: उसे पवित्र किया / पवित्र करके अलग रखा
  rationale: मुख्य पाठ में पवित्रता की धार्मिक महत्ता बनी रहती है, जबकि पादटिप्पणी ‘अलग रखने’ के संभव अर्थ को बताती है।
- issue: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת की कठिन रचना
  choice: जिसे परमेश्वर ने रचकर बनाया था
  alternative: जिसे परमेश्वर ने करने के लिए रचा था / जिसे परमेश्वर ने रचा और बनाया था
  rationale: मुख्य पाठ को समझने योग्य रखते हुए दोनों इब्रानी क्रियाओं की प्रतिध्वनि बचाई गई है। कठिन उद्देश्यवाचक अथवा संयुक्त अर्थ को निर्णायक रूप से थोपने के बजाय पादटिप्पणी में वास्तविक अस्पष्टता बताई गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘आशीष’, ‘पवित्र’ और ‘विश्राम’ जैसे परिचित धर्मग्रंथीय शब्द बनाए गए हैं। अंतिम कठिन इब्रानी पदबंध को मुख्य पाठ में पठनीय रूप दिया गया है और उसकी अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
