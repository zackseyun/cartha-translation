source:
  edition: WLC
  text: וַ/יְכַ֤ל אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מְלַאכְתּ֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּשְׁבֹּת֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מִ/כָּל מְלַאכְתּ֖/וֹ אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/002.yaml
  text: By the seventh day God had finished his work that he had done[a], and he rested on the seventh day from all his work that he had done.
translation:
  language: hi
  text: सातवाँ दिन आने तक परमेश्वर अपना वह काम पूरा कर चुका था जो उसने किया था।[a] और सातवें दिन उसने अपने उस सारे काम से विश्राम किया जो उसने किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सातवें दिन परमेश्वर ने अपना काम पूरा किया।” इब्रानी शब्दों का अनुवाद प्रायः इस प्रकार किया जाता है; मुख्य पाठ में “सातवाँ दिन आने तक” संदर्भ में संभावित अर्थ को व्यक्त करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַל
  choice: पूरा कर चुका था
  rationale: כלה का अर्थ पूरा करना या समाप्त करना है। पूर्णताबोधक रूप संदर्भ में यह स्पष्ट करता है कि सातवाँ दिन आने तक काम पूरा हो चुका था।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ बहुवचन रूप के साथ क्रिया एकवचन में है और सृष्टि-वृत्तांत में यह एक परमेश्वर को सूचित करता है।
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवाँ दिन आने तक
  rationale: शाब्दिक रूप से इसका अर्थ ‘सातवें दिन’ है; मुख्य पाठ में संदर्भगत काल-बोध व्यक्त किया गया है, जबकि शाब्दिक विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: מְלַאכְתּוֹ
  choice: अपना ... काम
  rationale: מְלָאכָה के लिए ‘काम’ सहज, व्यापक और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो उसने किया था
  rationale: עשה का अर्थ ‘करना/बनाना’ दोनों हो सकता है। ‘किया था’ मूल की व्यापकता बनाए रखता है और केवल भौतिक निर्माण तक अर्थ को सीमित नहीं करता।
- source_word: וַיִּשְׁבֹּת
  choice: उसने ... विश्राम किया
  rationale: שבת का मूल भाव काम से रुकना है। ‘विश्राम किया’ प्रतिष्ठित और स्वाभाविक अनुवाद है; ‘अपने सारे काम से’ यह स्पष्ट करता है कि आशय थकान मिटाना नहीं, कार्य से निवृत्त होना है।
- source_word: מִכָּל
  choice: अपने ... सारे काम से
  rationale: מן और כָּל का संयुक्त अर्थ समस्त काम से निवृत्त होना है; हिन्दी में ‘सारे ... से’ स्वाभाविक है।
theological_decisions:
- issue: क्या पाठ यह संकेत देता है कि परमेश्वर ने सातवें दिन भी काम किया
  choice: मुख्य पाठ में ‘सातवाँ दिन आने तक ... पूरा कर चुका था’ रखा गया है, जिससे संदर्भगत अर्थ प्रकट होता है कि काम उस दिन तक पूरा हो चुका था।
  alternative: 'इब्रानी का अधिक शाब्दिक अनुवाद: ‘सातवें दिन परमेश्वर ने अपना काम पूरा किया।’'
  rationale: इब्रानी पदबंध शाब्दिक रूप से ‘सातवें दिन’ है, पर अगला वाक्य उसी दिन विश्राम बताता है। मुख्य पाठ संभावित संदर्भगत अर्थ देता है और अधिक शाब्दिक रूप को पाद-टिप्पणी में रखकर वास्तविक भाषिक तनाव सुरक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। ‘परमेश्वर’, ‘काम’ और ‘विश्राम किया’ सामान्य पाठक के लिए परिचित हैं। मूल की पुनरावृत्ति ‘जो उसने किया था’ दोनों स्थानों पर बनाए रखी गई है।
