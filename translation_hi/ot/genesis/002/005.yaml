  text: וְ/כֹ֣ל שִׂ֣יחַ הַ/שָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָ/אָ֔רֶץ וְ/כָל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהוָ֤ה אֱלֹהִים֙ עַל הָ/אָ֔רֶץ וְ/אָדָ֣ם אַ֔יִן לַֽ/עֲבֹ֖ד אֶת הָֽ/אֲדָמָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/005.yaml
  text: No shrub of the field was yet on the earth[a], and no plant of the field had yet sprung up, because Yahweh God had not caused it to rain on the earth[c][b], and there was no man to work the ground.
translation:
  language: hi
  text: खेत की कोई झाड़ी अभी तक धरती पर नहीं थी[a], और खेत का कोई पौधा अभी तक उगा नहीं था, क्योंकि यहोवा परमेश्वर ने धरती पर वर्षा नहीं कराई थी[b], और भूमि की खेती करने के लिए कोई मनुष्य नहीं था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खेत का कोई झाड़’।
    reason: lexical_alternative
  - marker: b
    text: ‘यहोवा’ को ‘याहवे’ भी लिखा जाता है; कई अनुवादों में ‘प्रभु परमेश्वर’।
    reason: alternative_reading
  - marker: c
    text: या ‘मिट्टी को जोतने के लिए कोई मानव नहीं था’।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂיחַ הַשָּׂדֶה
  choice: मैदान की झाड़ी
  rationale: שִׂיחַ झाड़ी या झाड़ को सूचित करता है। ‘झाड़ी’ अगले खंड के עֵשֶׂב (‘पौधा’) से इसका शब्दगत भेद बनाए रखता है।
- source_word: טֶרֶם יִהְיֶה בָאָרֶץ
  choice: अभी धरती पर नहीं थी
  rationale: טֶרֶם का ‘अभी तक नहीं’ वाला भाव और בָאָרֶץ का व्यापक सृष्टि-संदर्भ स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: मैदान का पौधा
  rationale: עֵשֶׂב को व्यापक शाकीय वनस्पति के अर्थ में ‘पौधा’ कहना आधुनिक हिन्दी में सहज है और ‘झाड़ी’ से भेद रखता है।
- source_word: טֶרֶם יִצְמָח
  choice: अभी उगा नहीं था
  rationale: צמח का अर्थ अंकुरित होना या उगना है; ‘उगा नहीं था’ सरल और प्रसंगानुकूल है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי वनस्पति के न उगने का कारण प्रस्तुत करता है।
- source_word: הִמְטִיר
  choice: वर्षा नहीं कराई थी
  rationale: מטר के हिफ़ील रूप की कारणवाचक शक्ति को ‘वर्षा कराई’ स्पष्ट रूप से व्यक्त करता है।
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: यहोवा नाम को लिप्यंतरित किया गया है और אֱלֹהִים के लिए प्रतिष्ठित हिन्दी पद ‘परमेश्वर’ रखा गया है।
- source_word: וְאָדָם אַיִן
  choice: कोई मनुष्य नहीं था
  rationale: אָדָם यहाँ खेती करने वाले मानव के अभाव को सूचित करता है। ‘मनुष्य’ प्रतिनिधि एकवचन और मानव-संदर्भ दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: भूमि पर काम करने के लिए
  rationale: עבד यहाँ भूमि को जोतने या खेती योग्य बनाने के व्यापक अर्थ में है। ‘काम करना’ किसी एक कृषि-विधि को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: धरती / भूमि
  rationale: אֶרֶץ की व्यापक ‘धरती’ और אֲדָמָה की काम की जाने वाली ‘भूमि’ के बीच मूल पाठ का भेद बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे उपस्थित है। ‘यहोवा’ हिन्दी बाइबल-पाठकों में पहचाना जाने वाला रूप है और नाम को उपाधि ‘प्रभु’ में बदलने के बजाय सुरक्षित रखता है; ‘याहवे’ वैकल्पिक विद्वत्तापूर्ण लिप्यंतरण है।
- issue: אָדָם का प्रसंगगत आशय
  choice: मनुष्य
  alternative: मानव; आदमी
  rationale: यह पद किसी नामित पुरुष की अपेक्षा भूमि पर काम करने वाले मानव के अभाव पर बल देता है। ‘मनुष्य’ एकवचन और सामूहिक मानवीय आशय के बीच की मूल लचक बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। ‘झाड़ी/पौधा’ और ‘धरती/भूमि’ के जोड़े मूल इब्रानी के शब्दगत भेदों को बनाए रखते हैं। वाक्य की कारणसूचक संरचना को एक ही प्रवाह में रखा गया है और मूल में न होने के कारण आरंभ में कोई अतिरिक्त वार्तालाप-सूचक शब्द नहीं जोड़ा गया।
