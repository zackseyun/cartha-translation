  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מֵ/עֵ֗ץ הַ/דַּ֨עַת֙ ט֣וֹב וָ/רָ֔ע לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ כִּ֗י בְּ/י֛וֹם אֲכָלְ/ךָ֥ מִמֶּ֖/נּוּ מ֥וֹת תָּמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/017.yaml
  text: but from the tree of the knowledge of good and evil you shall not eat[a], for in the day you eat from it[b], you shall surely die.
translation:
  language: hi
  text: पर भले और बुरे के ज्ञान के वृक्ष में से तुम मत खाना,[a] क्योंकि जिस दिन तुम उसमें से खाओगे,[b] तुम निश्चय ही मर जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्य-विन्यास अधिक शाब्दिक रूप से है: “पर भले और बुरे के ज्ञान के वृक्ष में से—तुम उसमें से न खाना।”'
    reason: मूल में आगे रखे गए पद और उसे फिर से ग्रहण करने वाले सर्वनाम की संरचना बताने के लिए; मुख्य पाठ में अस्वाभाविक पुनरावृत्ति से बचा गया है।
  - marker: b
    text: 'इब्रानी: “जिस दिन तुम उसमें से खाओगे।” यह मुहावरा “जब तुम उसमें से खाओगे” भी अर्थ दे सकता है।'
    reason: मूल की कालगत अभिव्यक्ति का वैकल्पिक मुहावरेदार अर्थ बताते हुए उसकी वास्तविक अस्पष्टता सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וּמֵעֵץ
  choice: पर ... वृक्ष में से
  rationale: וּ־ यहाँ पिछले पद में दी गई व्यापक अनुमति के विपरीत एक अपवाद प्रस्तुत करता है, इसलिए प्रसंगानुसार “पर” स्वाभाविक है। מִן का भाव “में से” द्वारा स्पष्ट रखा गया है।
- source_word: הַדַּעַת
  choice: ज्ञान
  rationale: דַּעַת का अर्थ ज्ञान या जानना है; संबंध-विन्यास में “ज्ञान के वृक्ष” आधुनिक हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: טוֹב וָרָע
  choice: भले और बुरे
  rationale: दोनों ध्रुवों को जोड़ने वाली इब्रानी अभिव्यक्ति को यथावत रखा गया है। “बुरे” नैतिक भार बनाए रखता है और “भले और बुरे” हिन्दी में व्यक्तियों के बजाय गुण या श्रेणियाँ भी सूचित कर सकता है।
- source_word: לֹא תֹאכַל
  choice: तुम न खाना
  rationale: निषेध को सीधी, गंभीर और सामान्य आधुनिक हिन्दी में व्यक्त करता है; “मत खाना” भी संभव है, पर “न खाना” आदेश की विधिक गरिमा बनाए रखता है।
- source_word: מִמֶּנּוּ
  choice: उसमें से
  rationale: पूर्वसर्ग מִן को स्पष्ट रखा गया है और वृक्ष के लिए हिन्दी में स्वाभाविक सर्वनाम-रूप “उसमें से” चुना गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है; “क्योंकि” आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּיוֹם אֲכָלְךָ
  choice: जिस दिन तुम ... खाओगे
  rationale: शाब्दिक काल-संबंध को बनाए रखते हुए हिन्दी की स्वाभाविक रचना अपनाई गई है। इससे वाक्य को केवल सामान्य “जब” में बदलकर उसकी संभावित कालगत तीक्ष्णता समाप्त नहीं होती।
- source_word: מוֹת תָּמוּת
  choice: तुम निश्चय ही मर जाओगे
  rationale: क्रिया-मूल के दोहराव से व्यक्त निश्चितता और बल को “निश्चय ही” द्वारा स्वाभाविक हिन्दी में दर्शाया गया है।
theological_decisions:
- issue: फल खाने के दिन और मृत्यु की पूर्ति के बीच कालगत संबंध
  choice: मुख्य पाठ में “जिस दिन” रखकर इब्रानी अभिव्यक्ति और उससे उत्पन्न तनाव सुरक्षित रखा गया है।
  alternative: इसे केवल “जब” कहना, अथवा तत्काल शारीरिक मृत्यु, मरणशीलता के आरंभ, या उसी दिन सुनाए गए मृत्युदंड के रूप में स्पष्ट कर देना।
  rationale: मूल पद स्वयं यह निर्धारित नहीं करता कि यहाँ तत्काल शारीरिक मृत्यु, मृत्यु की निश्चितता, या मरणशील अवस्था में प्रवेश में से कौन-सा आशय प्रमुख है। अनुवाद को इस धार्मिक-व्याख्यात्मक प्रश्न का निर्णय नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज पर गरिमापूर्ण है। “पर,” “न खाना,” और “निश्चय ही मर जाओगे” आदेश की गंभीरता बनाए रखते हैं। मुख्य पाठ में इब्रानी की अग्रस्थापित संरचना को स्वाभाविक हिन्दी बनाया गया है, जबकि पादटिप्पणी में उसका अधिक शाब्दिक रूप दिया गया है।
