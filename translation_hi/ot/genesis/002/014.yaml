    text: हिद्देकेल की पारंपरिक पहचान दजला (टिगरिस) नदी से की जाती है।
    reason: alternative_reading
  - marker: b
    text: या “असीरिया के पूर्व में”; इब्रानी में “अश्शूर के पूर्व में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם
  choice: नाम
  rationale: सूत्रात्मक वाक्यांश में इसका सीधा और स्वाभाविक अर्थ ‘नाम’ है।
- source_word: נָּהָר
  choice: नदी
  rationale: संदर्भ में जलधारा के लिए सामान्य और उपयुक्त हिन्दी शब्द।
- source_word: שְּׁלִישִׁי / רְבִיעִי
  choice: तीसरी / चौथी
