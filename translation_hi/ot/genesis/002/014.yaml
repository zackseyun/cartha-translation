- source_word: חִדֶּקֶל
  choice: हिद्देकेल
  rationale: इब्रानी नाम का लिप्यंतरण किया गया है; पारंपरिक पहचान पादटिप्पणी में रखी गई है।
- source_word: הֹלֵךְ
  choice: बहती है
  rationale: शाब्दिक अर्थ ‘जाती है’ है, पर नदी के लिए आधुनिक हिन्दी में ‘बहती है’ स्वाभाविक है और गतिशील अर्थ को ठीक व्यक्त करता है।
- source_word: קִדְמַת
  choice: के पूर्व की ओर
  rationale: भौगोलिक संदर्भ में पूर्व दिशा का अर्थ उपयुक्त है; ‘की ओर’ मूल पद की संभावित स्थानिक-दिशात्मक व्यापकता को बनाए रखता है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: इब्रानी व्यक्तिवाचक/भौगोलिक नाम का लिप्यंतरण; ‘असीरिया’ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: פְרָת
  choice: फरात
  rationale: हिन्दी में यूफ्रेटीस नदी के लिए प्रचलित पारंपरिक नाम ‘फरात’ स्पष्ट और स्वाभाविक है।
