  yaml_path: translation/ot/genesis/002/006.yaml
  text: But a mist would rise from the earth and water the whole surface of the ground[a].
translation:
  language: hi
  text: पर पृथ्वी से धुंध[a] उठती थी और भूमि की सारी सतह को सींचती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जलधारा” अथवा “जल-प्रवाह”; यह इब्रानी शब्द दुर्लभ है और संभव है कि इसका संकेत हवा में छाई धुंध के बजाय पृथ्वी से फूट निकलते पानी की ओर हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵד
  choice: पर ... धुंध
  rationale: אֵד एक दुर्लभ और विवादित शब्द है। ऊपर उठने की क्रिया के साथ ‘धुंध’ स्वाभाविक है; וְ को पिछले पद में वर्षा न होने के विपरीत स्थिति दिखाने के लिए ‘पर’ किया गया है। अन्य जल-संबंधी अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: יַעֲלֶה
  choice: उठा करती थी
  rationale: भूतकालीन वर्णन में अपूर्ण क्रिया नियमित या विशिष्ट रूप से घटने वाली क्रिया सूचित कर सकती है; यह हिंदी प्रयोग उस पक्ष को सहज रूप से व्यक्त करता है।
- source_word: מִן הָ/אָרֶץ
  choice: पृथ्वी से
  rationale: सृष्टि-वर्णन के व्यापक संदर्भ में אֶרֶץ के लिए ‘पृथ्वी’ उपयुक्त है और आगे आने वाले אֲדָמָה से भेद बनाए रखता है।
- source_word: וְ/הִשְׁקָה
  choice: और ... सींचती थी
  rationale: שקה के हिफ़ील रूप का अर्थ पानी देना या सींचना है। ‘सींचती थी’ तकनीकी भाषा से बचते हुए वर्णनात्मक और निरंतर क्रिया व्यक्त करता है।
- source_word: אֶת כָּל פְּנֵי
  choice: सारी ... की सतह को
  rationale: शाब्दिक ‘सारे मुख’ के स्थान पर यह स्वाभाविक आधुनिक हिंदी में दृश्य विस्तार या पूरी सतह का अर्थ देता है।
- source_word: הָ/אֲדָמָה
  choice: भूमि
  rationale: אֲדָמָה मिट्टी या धरातल को दर्शाता है। ‘भूमि’ सहज और गरिमापूर्ण है तथा इसी पद के אֶרֶץ के लिए प्रयुक्त ‘पृथ्वी’ से आवश्यक भेद बनाए रखता है।
theological_decisions:
- issue: אֵד का अर्थ
  choice: धुंध
  alternative: जलधारा या भूमिगत जल का उफान
  rationale: ऊपर उठने वाली क्रिया के साथ ‘धुंध’ सीधा अर्थ देता है, पर दुर्लभ इब्रानी शब्द की जलधारा या धरती से उमड़ते पानी वाली व्याख्या भी संभव है; इसलिए अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण शैली। ‘उठा करती थी’ और ‘सींचती थी’ भूतकाल में नियमित/वर्णनात्मक क्रिया को व्यक्त करते हैं। ‘पृथ्वी’ और ‘भूमि’ से אֶרֶץ तथा אֲדָמָה का भेद बनाए रखा गया है।
