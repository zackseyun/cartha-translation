  text: וַ/יִּקְרָ֨א הָֽ/אָדָ֜ם שֵׁמ֗וֹת לְ/כָל הַ/בְּהֵמָה֙ וּ/לְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/לְ/כֹ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/לְ/אָדָ֕ם לֹֽא מָצָ֥א עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/020.yaml
  text: And the man gave names to all the livestock[a], to the birds of the sky, and to every wild animal[c][b], but for the man no helper corresponding to him was found.
translation:
  language: hi
  text: और मनुष्य ने सब पालतू पशुओं, आकाश के पक्षियों और सब जंगली पशुओं के नाम रखे; पर मनुष्य को अपने अनुरूप कोई सहायक नहीं मिला।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आदम ने ... नाम रखे; पर आदम को अपने अनुरूप कोई सहायक नहीं मिला।”
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “पर मनुष्य ने अपने अनुरूप कोई सहायक नहीं पाया।” या “अपने योग्य कोई सहायक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם / לְאָדָם
  choice: मनुष्य / मनुष्य को
  rationale: सप्रत्यय הָאָדָם कथा के उस एक मानव को दर्शाता है। हिंदी में ‘मनुष्य’ सामान्य संज्ञा का भाव बनाए रखता है और इस चरण पर इसे अनिवार्यतः व्यक्तिनाम ‘आदम’ नहीं बनाता।
- source_word: וַיִּקְרָא ... שֵׁמוֹת
  choice: नाम रखे
  rationale: यह नाम देने की क्रिया का स्वाभाविक और स्रोत-संगत हिंदी मुहावरा है।
- source_word: הַבְּהֵמָה
  choice: पालतू पशुओं
  rationale: यहाँ शब्द पशुधन अथवा मनुष्य के अधीन पाले जाने वाले पशुओं के वर्ग को जंगली पशुओं से अलग करता है।
- source_word: עוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षियों
  rationale: यह मूल बिंब को स्पष्ट, आधुनिक हिंदी में बनाए रखता है।
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: मैदान के सब जंगली पशुओं
  rationale: ‘जंगली पशु’ घरेलू पशुओं से विरोध स्पष्ट करता है, जबकि ‘मैदान के’ हिब्रू संबंध-पदबंध को भी सुरक्षित रखता है।
- source_word: עֵזֶר
  choice: सहायक
  rationale: संदर्भ में यह सहायता देने वाले व्यक्ति को दर्शाता है; शब्द अपने आप में हीनता या अधीनता नहीं बताता।
- source_word: כְּנֶגְדּוֹ
  choice: अपने अनुरूप
  rationale: यह उसके सामने/उसके समकक्ष होने की correspondence की धारणा को सहज हिंदी में व्यक्त करता है, बिना संबंध की प्रकृति को अधिक व्याख्यायित किए।
- source_word: לֹא מָצָא
  choice: नहीं मिला
  rationale: हिब्रू का शाब्दिक कर्तृवाच्य ‘उसने नहीं पाया’ है, पर हिंदी में ‘उसे ... नहीं मिला’ परिणाम को स्वाभाविक ढंग से व्यक्त करता है; कर्तृवाच्य विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: उत्पत्ति 2:20 में אָדָם का अनुवाद
  choice: मनुष्य
  alternative: आदम
  rationale: यहाँ शब्द उस एक मानव को सूचित करता है, किंतु सामान्य संज्ञा का अर्थ अभी प्रमुख है। ‘मनुष्य’ इस साहित्यिक अस्पष्टता को ‘आदम’ की अपेक्षा बेहतर बनाए रखता है; नाम-सदृश पाठ संभव है और पादटिप्पणी में दिया गया है।
- issue: כְּנֶגְדּוֹ में संबंध की प्रकृति
  choice: अपने अनुरूप
  alternative: अपने योग्य / अपने उपयुक्त
  rationale: ‘अनुरूप’ समानता, आमने-सामने की संगति और correspondence को व्यक्त करता है, पर ऐसी विशेष धार्मिक भूमिका आरोपित नहीं करता जो मूल पद स्वयं स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक रूप। ‘नाम रखे’, ‘पालतू पशु’ और ‘जंगली पशु’ सामान्य पाठक के लिए सहज हैं। मुख्य पाठ में ‘मनुष्य’ सामान्य-संज्ञात्मक भाव और कथा के एक पुरुष पात्र—दोनों को संभालता है।
