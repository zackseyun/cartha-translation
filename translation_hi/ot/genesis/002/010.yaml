base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/010.yaml
  text: A river flowed out of Eden to water the garden[a], and from there it divided and became four headwaters.
translation:
  language: hi
  text: अदन से एक नदी बाग़ को सींचने के लिए निकलती थी। वहाँ से वह बँटकर चार मुख्य धाराएँ[a] बन गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “चार सिर।” यहाँ इब्रानी शब्द नदी की चार प्रमुख विभाजित धाराओं के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהָר
  choice: एक नदी
  rationale: נָהָר का अर्थ ‘नदी’ है। आरंभिक וְ कथा को आगे बढ़ाता है; आधुनिक हिन्दी में अलग वाक्य के आरंभ पर इसे ‘और’ से व्यक्त करना आवश्यक नहीं है।
- source_word: יֹצֵא מֵעֵדֶן
  choice: अदन से … निकलती थी
  rationale: יצא का कृदन्त नदी के निरंतर निकलने या बहने का भाव देता है, और מִן स्रोत को दर्शाता है। ‘निकलती थी’ हिन्दी कथा में इस जारी क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְהַשְׁקוֹת אֶת־הַגָּן
  choice: बाग़ को सींचने के लिए
  rationale: לְ के साथ causative infinitive यहाँ उद्देश्य बताता है। ‘सींचना’ सामान्य और संदर्भानुकूल है; ‘सिंचाई करना’ अपेक्षाकृत तकनीकी होता।
- source_word: וּמִשָּׁם
  choice: वहाँ से
  rationale: यह नदी के मार्ग में अगले स्थान या चरण को सूचित करता है।
- source_word: יִפָּרֵד
  choice: बँटकर
  rationale: פרד का निफ़अल रूप अलग होने या विभाजित होने का अर्थ दे सकता है। नदी के संदर्भ में ‘बँटना’ सहज है और कर्ता को अस्पष्ट नहीं बनाता।
- source_word: וְהָיָה לְאַרְבָּעָה רָאשִׁים
  choice: चार मुख्य धाराएँ बन गई
  rationale: היה और לְ परिणाम की अवस्था दर्शाते हैं। רָאשִׁים का शाब्दिक अर्थ ‘सिर’ है, पर यहाँ नदी की प्रमुख विभाजित धाराएँ अभिप्रेत हैं; ‘मुख्य धाराएँ’ अर्थ स्पष्ट रखते हुए रूपक की भूमिका व्यक्त करता है।
