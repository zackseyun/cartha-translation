base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/008.yaml
  text: And Yahweh God planted a garden in Eden[a], in the east, and there he put the man whom he had formed.
translation:
  language: hi
  text: और याहवे परमेश्वर ने अदन में, पूर्व में, एक बाग लगाया[a], और वहाँ उस मनुष्य को रखा जिसे उसने रचा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूर्व की ओर।” इब्रानी वाक्यांश स्थान (“पूर्व में”) अथवा दिशा (“पूर्व की ओर”) सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: लगाया
  rationale: נטע का मूल अर्थ वनस्पति लगाना है; बाग के संदर्भ में ‘बाग लगाया’ स्वाभाविक और चित्रात्मक है।
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को प्रचलित हिंदी रूप ‘यहोवा’ से और אֱלֹהִים को गरिमापूर्ण सामान्य पद ‘परमेश्वर’ से व्यक्त किया गया है।
- source_word: גַּן
  choice: बाग
  rationale: גן यहाँ खेती और वृक्षों से युक्त उद्यान को दर्शाता है; ‘बाग’ सामान्य आधुनिक हिंदी में स्पष्ट है।
- source_word: בְעֵדֶן
  choice: अदन में
  rationale: עֵדֶן यहाँ स्थान-नाम है; हिंदी बाइबलीय परंपरा में प्रचलित लिप्यंतरण ‘अदन’ रखा गया है।
- source_word: מִקֶּדֶם
  choice: पूर्व में
  rationale: מקדם को मुख्य पाठ में स्थानसूचक अर्थ में लिया गया है; इसकी दिशासूचक वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיָּשֶׂם שָׁם
  choice: वहाँ ... रखा
  rationale: שׂים और שָׁם के सीधे स्थानसूचक अर्थ को स्वाभाविक हिंदी वाक्यक्रम में व्यक्त किया गया है।
- source_word: הָאָדָם
  choice: उस मनुष्य को
  rationale: निश्चित एकवचन उस विशिष्ट मनुष्य की ओर संकेत करता है जिसे पहले रचा गया था; ‘मनुष्य’ हिंदी में स्वाभाविक है और אָדָם के मानवीय अर्थ को बनाए रखता है।
- source_word: אֲשֶׁר יָצָר
  choice: जिसे उसने रचा था
  rationale: יצר का अर्थ आकार देना या रचना है; ‘रचा था’ पूर्ववर्ती क्रिया और घटनाक्रम को स्पष्ट तथा संक्षिप्त रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में निजी ईश्वरीय नाम स्पष्ट रूप से उपस्थित है; उसे उपाधि से बदलने के बजाय हिंदी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप में रखा गया है।
- issue: הָאָדָם का संदर्भगत अर्थ
  choice: उस मनुष्य
  alternative: आदम
  rationale: यहाँ शब्द के साथ निश्चित उपपद है और वह पहले रचे गए विशिष्ट मानव को सूचित करता है; इस चरण पर इसे अनिवार्य रूप से व्यक्तिगत नाम मानकर अनुवाद करना मूल की अर्थगत गुंजाइश को संकरा कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बाग लगाया’ सामान्य हिंदी मुहावरा है। मूल के घटनाक्रम तथा מִקֶּדֶם की वास्तविक अस्पष्टता को बनाए रखा गया है।
