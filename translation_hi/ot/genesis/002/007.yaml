reference: Genesis 2:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּיצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים אֶת הָֽ/אָדָ֗ם עָפָר֙ מִן הָ֣/אֲדָמָ֔ה וַ/יִּפַּ֥ח בְּ/אַפָּ֖י/ו נִשְׁמַ֣ת חַיִּ֑ים וַֽ/יְהִ֥י הָֽ/אָדָ֖ם לְ/נֶ֥פֶשׁ חַיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/007.yaml
  text: Then Yahweh God formed the man from the dust of the ground[a], and breathed into his nostrils the breath of life[b], and the man became a living creature.
translation:
  language: hi
  text: तब याहवे परमेश्वर ने भूमि की धूल से मनुष्य को गढ़ा और उसके नथनों में जीवन का श्वास फूँका, और मनुष्य एक जीवित प्राणी बन गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक सजीव प्राणी”; परंपरागत अनुवाद, “एक जीवित आत्मा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट नाम को उसके हिब्रू उच्चारण के निकट लिप्यंतरित किया गया है; इसे किसी सामान्य उपाधि में नहीं बदला गया।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: יְהוָה के साथ समानाधिकरण में यह सामान्य ईश्वरीय उपाधि है; ‘याहवे परमेश्वर’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: וַיִּיצֶר
  choice: रचा
  rationale: क्रिया का अर्थ आकार देना या गढ़ना है। ‘रचा’ सृजनात्मक, साकार क्रिया को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ एक विशिष्ट मानव का उल्लेख है, फिर भी इस चरण पर नाम ‘आदम’ स्पष्ट रूप से प्रयुक्त नहीं हुआ है। ‘मनुष्य’ व्यक्ति और उसकी मानवीय पहचान दोनों को बनाए रखता है।
- source_word: עָפָר מִן־הָאֲדָמָה
  choice: भूमि की धूल से
  rationale: עָפָר की ठोस छवि ‘धूल’ से और אֲדָמָה का अर्थ ‘भूमि’ से सुरक्षित रहता है। हिन्दी में אדם/אדמה का शब्द-साम्य पूरी तरह पुनरुत्पादित नहीं किया जा सकता।
- source_word: בְּאַפָּיו
  choice: उसके नथनों में
  rationale: यह देहगत और ठोस वर्णन है; ‘नथनों में’ हिब्रू अभिव्यक्ति का स्वाभाविक हिन्दी रूप है।
- source_word: נִשְׁמַת חַיִּים
  choice: जीवन का श्वास
  rationale: हिब्रू पदबंध जीवन प्रदान करने वाले श्वास को दर्शाता है। ‘जीवन का श्वास’ उसकी संरचना और धार्मिक प्रतिध्वनि दोनों बनाए रखता है।
- source_word: לְנֶפֶשׁ חַיָּה
  choice: एक जीवित प्राणी
  rationale: נֶפֶשׁ यहाँ संपूर्ण सजीव प्राणी को दर्शाता है, शरीर से अलग किसी अमूर्त आत्मा को आवश्यकतः नहीं। यही पद अन्य जीवधारियों के लिए भी प्रयुक्त हो सकता है।
theological_decisions:
- issue: הָאָדָם को व्यक्ति अथवा समष्टिगत मानवता के रूप में प्रस्तुत करना
  choice: मनुष्य
  alternative: आदम; मानवजाति
  rationale: कथा में यहाँ एक व्यक्तिगत मानव रचा जा रहा है, पर हिब्रू में अभी सामान्य संज्ञा के साथ निश्चित उपपद है। ‘मनुष्य’ व्यक्ति को बनाए रखते हुए समय से पहले इसे निजी नाम नहीं बनाता।
- issue: לְנֶפֶשׁ חַיָּה का मानव-स्वरूप संबंधी अर्थ
  choice: एक जीवित प्राणी
  alternative: एक जीवित आत्मा; एक जीवित अस्तित्व
  rationale: यह वाक्य मनुष्य के किसी अलग अवयव के प्राप्त होने के बजाय स्वयं मनुष्य के जीवित प्राणी बन जाने की बात कहता है। ‘जीवित आत्मा’ ऐसी देह–आत्मा द्वैतवादी व्याख्या सुझा सकता है जिसकी माँग हिब्रू पाठ नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘याहवे परमेश्वर’, ‘नथनों’ और ‘श्वास’ मूल की ठोस छवि को बनाए रखते हैं। दो लंबे हिब्रू समन्वित खंडों को हिन्दी में दो वाक्यों में बाँटा गया है; ‘इस प्रकार’ परिणाम-संबंध को स्पष्ट करता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के।
