source:
  edition: WLC
  text: וַ/יִּצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים מִן הָֽ/אֲדָמָ֗ה כָּל חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/אֵת֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יָּבֵא֙ אֶל הָ֣/אָדָ֔ם לִ/רְא֖וֹת מַה יִּקְרָא ל֑/וֹ וְ/כֹל֩ אֲשֶׁ֨ר יִקְרָא ל֧/וֹ הָֽ/אָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/019.yaml
  text: Yahweh God formed from the ground every wild animal and every bird of the sky[a], and he brought them to the man to see what he would call them. Whatever the man called each living creature[b], that was its name.
translation:
  language: hi
  text: यहोवा परमेश्वर ने भूमि से हर जंगली पशु और आकाश के हर पक्षी को बनाया[a] और उन्हें मनुष्य के पास ले आया, यह देखने के लिए कि वह उनका क्या नाम रखेगा। मनुष्य ने हर जीवित प्राणी को जो नाम दिया[b], वही उसका नाम था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहले ही बना चुका था।” हिब्रू क्रिया का सीधा अनुवाद साधारण भूतकाल में किया जा सकता है, पर संदर्भ में इसे मनुष्य के पास लाने से पहले पूर्ण हुई क्रिया भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “आदम।” हिब्रू में हा-आदाम है, जिसका शाब्दिक अर्थ “वह मनुष्य” है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצֶר
  choice: बनाया
  rationale: हिब्रू वय्यिक्तोल सामान्यतः कथा को साधारण भूतकाल में आगे बढ़ाता है। हिंदी में ‘बनाया’ इसका सीधा और स्वाभाविक रूप है; पूर्वकालिक अर्थ संदर्भ में संभव है और पादटिप्पणी में दिया गया है।
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को ‘यहोवा’ और אֱלֹהִים को इस संयुक्त पद में प्रचलित, गरिमापूर्ण ‘परमेश्वर’ से व्यक्त किया गया है।
- source_word: מִן הָאֲדָמָה
  choice: भूमि से
  rationale: אֲדָמָה मिट्टी या भूमि को दर्शाता है। ‘भूमि से’ संक्षिप्त और स्वाभाविक है तथा निकटवर्ती मनुष्य–भूमि संबंध को बनाए रखता है।
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: मैदान के हर पशु
  rationale: यह पद खुले भूभाग से जुड़े पशुओं का संकेत देता है। ‘मैदान के हर पशु’ हिब्रू संरचना के निकट है और अनावश्यक रूप से केवल जंगली पशुओं तक अर्थ सीमित नहीं करता।
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: आकाश के हर पक्षी
  rationale: עוֹף का यहाँ स्वाभाविक अर्थ ‘पक्षी’ है और הַשָּׁמַיִם को ‘आकाश’ कहना आधुनिक हिंदी में स्पष्ट है।
- source_word: וַיָּבֵא אֶל הָאָדָם
  choice: उन्हें मनुष्य के पास ले आया
  rationale: पूर्ववर्ती सामूहिक संज्ञाओं के लिए हिंदी में बहुवचन कर्म ‘उन्हें’ स्पष्ट किया गया है। הָאָדָם को इस प्रसंग में व्यक्तिवाचक नाम के बजाय सामान्य संज्ञा ‘मनुष्य’ माना गया है।
- source_word: לִרְאוֹת מַה יִּקְרָא לוֹ
  choice: ताकि देखे कि वह उनका क्या नाम रखता है
  rationale: לִרְאוֹת उद्देश्य व्यक्त करता है। קרא ל का भाव नाम रखना है; वर्तमानकालीन आश्रित रूप ‘रखता है’ हिंदी में अप्रत्यक्ष अपेक्षा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נֶפֶשׁ חַיָּה
  choice: जीवित प्राणी
  rationale: इस उत्पत्ति-संदर्भ में पद का अर्थ सजीव प्राणी है। ‘जीवित आत्मा’ बाद की धर्मवैज्ञानिक धारणाएँ अनावश्यक रूप से ला सकता है।
- source_word: הוּא שְׁמוֹ
  choice: वही उसका नाम हो गया
  rationale: हिब्रू का क्रियारहित वाक्य नाम की स्थायी परिणति बताता है। हिंदी में ‘वही उसका नाम हो गया’ स्वाभाविक है, यद्यपि ‘वही उसका नाम था’ भी संभव है।
theological_decisions:
- issue: वַיִּצֶר का काल और उत्पत्ति 1 के सृष्टि-क्रम से उसका संबंध
  choice: मुख्य पाठ में साधारण भूतकाल ‘बनाया’
  alternative: ‘पहले ही बना चुका था’ अथवा ‘बना रखा था’
  rationale: हिब्रू क्रियारूप स्वयं पूर्वपूर्ण काल को चिह्नित नहीं करता, इसलिए साधारण भूतकाल अधिक सीधा है। फिर भी प्रसंग पूर्वकालिक अर्थ की अनुमति देता है; उस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है, न कि किसी कथित विरोध को चुपचाप सुलझाया गया है।
- issue: הָאָדָם सामान्य संज्ञा है या व्यक्तिवाचक नाम
  choice: मनुष्य
  alternative: आदम
  rationale: निश्चित उपपद सहित हिब्रू रूप का स्वाभाविक अर्थ ‘वह मनुष्य’ है और निकट संदर्भ में אֲדָמָה के साथ शब्द-संबंध भी बना रहता है। परंपरागत व्यक्तिवाचक पठन संभव होने के कारण उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘मनुष्य’, ‘भूमि’, ‘पशु’, ‘पक्षी’ और ‘जीवित प्राणी’ सामान्य पाठकों के लिए स्पष्ट हैं। मुख्य पाठ स्रोत के साधारण भूतकाल को रखता है, जबकि कालगत और नाम-संबंधी वास्तविक विकल्प पादटिप्पणियों में सुरक्षित हैं।
