  text: तब याहवे परमेश्वर ने उस मनुष्य को लेकर अदन की वाटिका में रखा[b], ताकि वह उसमें काम करे और उसकी देखभाल करे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी खेती करे और उसकी रक्षा करे।” इब्रानी क्रियाओं के अर्थ “काम करना/खेती करना” और “देखभाल करना/रक्षा करना/निगरानी रखना” हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: “रखा” के लिए प्रयुक्त इब्रानी क्रिया का अर्थ “विश्राम कराया” या “बसाया” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: यहवे परमेश्वर
  rationale: व्यक्तिगत ईश्वरीय नाम और सामान्य ईश्वरीय उपाधि, दोनों को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: הָאָדָם
  choice: उस मनुष्य
  rationale: सन्दर्भ पहले रचे गए विशिष्ट मनुष्य का है; ‘उस’ पूर्वोक्त व्यक्ति की ओर संकेत करता है।
- source_word: וַיִּקַּח
  choice: लेकर
  rationale: לקח का सीधा अर्थ ‘लेना’ सुरक्षित रहता है और अगले क्रमिक क्रियापद के साथ हिन्दी में स्वाभाविक वाक्य बनता है।
- source_word: וַיַּנִּחֵהוּ
  choice: रखा
  rationale: निफ़ाल/हिफ़ील रूप यहाँ किसी स्थान में रखे या बसाए जाने का भाव देता है; ‘रखा’ संक्षिप्त और प्रसंगानुकूल है, जबकि विश्राम या बसाने की सम्भावित छाया पादटिप्पणी में दी गई है।
- source_word: בְּגַן עֵדֶן
  choice: अदन की वाटिका में
  rationale: स्थापित हिन्दी बाइबलीय नामावली रखते हुए construct phrase को स्वाभाविक रूप में व्यक्त करता है।
- source_word: לְעָבְדָהּ
  choice: उसमें काम करे
  rationale: עבד के व्यापक ‘काम करना/सेवा करना/खेती करना’ अर्थ को अनावश्यक रूप से केवल कृषि तक सीमित नहीं करता। हिन्दी में वाटिका के सम्बन्ध में ‘उसमें काम करना’ स्वाभाविक है।
- source_word: וּלְשָׁמְרָהּ
  choice: उसकी देखभाल करे
  rationale: שמר के रखवाली, रक्षा और ध्यान रखने के अर्थ-क्षेत्र को इस प्रसंग में सहज हिन्दी देता है; ‘रक्षा करे’ की अधिक संकीर्ण सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अदन में मनुष्य के कार्य का स्वरूप
  choice: सामान्य रूप से वाटिका में काम करना और उसकी देखभाल करना
  alternative: विशेषतः कृषि करना और रक्षा करना; अथवा याजकीय सेवा और पहरेदारी का संकेत
  rationale: עבד और שמר कृषि तथा सम्भावित पवित्रस्थान-संबंधी अर्थछायाएँ रख सकते हैं, पर यह पद किसी एक विशिष्ट धर्मवैज्ञानिक व्याख्या को अनिवार्य नहीं करता। मुख्य पाठ सामान्य अर्थ रखता है और पादटिप्पणी प्रमुख शाब्दिक विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘वाटिका’ स्थापित बाइबलीय शब्दावली को बनाए रखता है। मूल के क्रम और अर्थ को निकट रखते हुए हिन्दी की स्वाभाविक ‘लेकर…रखा’ संरचना अपनाई गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
