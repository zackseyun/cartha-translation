  text: וַ/יֹּ֨אמֶר֙ יְהוָ֣ה אֱלֹהִ֔ים לֹא ט֛וֹב הֱי֥וֹת הָֽ/אָדָ֖ם לְ/בַדּ֑/וֹ אֶֽעֱשֶׂהּ לּ֥/וֹ עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/018.yaml
  text: Then Yahweh God said[a], “It is not good for the man to be alone. I will make a helper corresponding to him.”
translation:
  language: hi
  text: तब यहोवा परमेश्वर ने कहा, “मनुष्य का अकेला रहना अच्छा नहीं है। मैं उसके लिए एक ऐसा सहायक बनाऊँगा जो उसके अनुरूप हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके योग्य सहायक,” “उसके लिए उपयुक्त सहायक,” अथवा “उससे मेल खाने वाला सहायक।” हिब्रू वाक्यांश ऐसे व्यक्ति का संकेत देता है जो उसके अनुरूप हो, न कि केवल उससे निम्न दर्जे के सहायक का।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: व्यक्तिगत दिव्य नाम और सामान्य ईश्वरीय पदवी—दोनों को बनाए रखता है; आधुनिक हिन्दी बाइबल-पाठकों के लिए स्वाभाविक और गरिमापूर्ण है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: क्रिया के मूल अर्थ ‘कहा’ के साथ वाव-क्रमवाचक की कथात्मक प्रगति को ‘तब’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: לֹא טוֹב הֱיוֹת הָאָדָם לְבַדּוֹ
  choice: मनुष्य का अकेला रहना अच्छा नहीं है
  rationale: हिब्रू विधेयात्मक मूल्यांकन और infinitive construction को स्पष्ट, सहज हिन्दी में सुरक्षित रखता है। यहाँ ‘मनुष्य’ बगीचे में उपस्थित विशिष्ट मानव पुरुष को सूचित करता है।
- source_word: אֶעֱשֶׂה־לּוֹ
  choice: मैं उसके लिए ... बनाऊँगा
  rationale: प्रथम पुरुष अपूर्ण क्रिया में व्यक्त दिव्य अभिप्राय और לּוֹ के हितार्थ भाव को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: עֵזֶר
  choice: सहायक
  rationale: ऐसे व्यक्ति को सूचित करता है जो सहायता देता है; शब्द अपने आप में निम्नतर दर्जा व्यक्त नहीं करता।
- source_word: כְּנֶגְדּוֹ
  choice: जो उसके अनुरूप हो
  rationale: उसके सामने, उसके समकक्ष अथवा उससे मेल खाने वाले संबंध का भाव सुरक्षित रखता है और केवल ‘मददगार’ होने से आगे पारस्परिक अनुरूपता को प्रकट करता है।
theological_decisions:
- issue: הָאָדָם का संदर्भगत अर्थ
  choice: मनुष्य
  alternative: आदम; मानवजाति
  rationale: यहाँ कथा एक विशिष्ट, अकेले मानव पुरुष की बात करती है, पर इस पद में नामरूप ‘आदम’ अनिवार्य नहीं है। ‘मनुष्य’ व्यक्तिगत और प्रतिनिधिक दोनों संभावनाओं को खुला रखता है।
- issue: עֵזֶר כְּנֶגְדּוֹ में पदानुक्रम का संभावित आरोपण
  choice: एक ऐसा सहायक ... जो उसके अनुरूप हो
  alternative: उसके योग्य सहायक; उसके लिए उपयुक्त सहायक; उसके समान सहायक
  rationale: हिब्रू वाक्यांश सहायता और अनुरूपता बताता है, पर अपने आप में न हीनता बताता है, न श्रेष्ठता। चुना हुआ रूप इसी तनाव को बिना किसी सामाजिक या सांप्रदायिक निष्कर्ष के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘यहोवा परमेश्वर’ दिव्य नाम तथा पदवी दोनों को सुरक्षित रखता है। ‘ऐसा ... जो’ की रचना כְּנֶגְדּוֹ के संबंधपरक अर्थ को सामान्य पाठक के लिए स्पष्ट करती है।
