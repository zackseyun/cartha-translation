id: GEN.2.24
reference: Genesis 2:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַל כֵּן֙ יַֽעֲזָב אִ֔ישׁ אֶת אָבִ֖י/ו וְ/אֶת אִמּ֑/וֹ וְ/דָבַ֣ק בְּ/אִשְׁתּ֔/וֹ וְ/הָי֖וּ לְ/בָשָׂ֥ר אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/024.yaml
  text: Therefore a man shall leave his father and his mother and cling to his wife[b][a], and they shall become one flesh.
translation:
  language: hi
  text: इसी कारण एक पुरुष अपने पिता और अपनी माता को छोड़ेगा और अपनी पत्नी से जुड़ा रहेगा[a], और वे एक देह हो जाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी पत्नी से दृढ़ता से जुड़ा रहेगा’ अथवा ‘अपनी पत्नी से बँधा रहेगा।’ इब्रानी क्रिया प्रबल और स्थायी लगाव का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: ‘एक देह’ एक इब्रानी अभिव्यक्ति है, जिसमें शारीरिक मिलन और एक नए नातेदारी-बंधन का बनना, दोनों शामिल हैं।
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: यह पद पिछली कथा से निष्कर्ष निकालता है; ‘इसी कारण’ उस व्याख्यात्मक और परिणामसूचक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יַעֲזָב
  choice: छोड़कर
  rationale: यहाँ क्रिया सामान्य और मानक सिद्धांत व्यक्त करती है। ‘छोड़कर’ नए वैवाहिक संबंध की स्थापना बताता है; ‘त्यागकर’ अनावश्यक रूप से परित्याग का कठोर भाव देता।
- source_word: אִישׁ
  choice: पुरुष
  rationale: इब्रानी में स्पष्ट रूप से पुल्लिंग एकवचन है, जो विवाह में पुरुष पक्ष का प्रतिनिधित्व करता है।
- source_word: אָבִיו ... אִמּוֹ
  choice: अपने पिता और अपनी माता
  rationale: मूल पाठ दोनों माता-पिता का अलग-अलग उल्लेख करता है; हिन्दी में भी उसी रूप और बल को सुरक्षित रखा गया है।
- source_word: וְדָבַק
  choice: अपनी पत्नी से जुड़ा रहेगा
  rationale: דבק दृढ़ लगाव, निकट जुड़ाव या चिपके रहने का भाव देता है। ‘जुड़ा रहेगा’ वर्तमान हिन्दी में स्वाभाविक है और स्थायी संबंध का बल बनाए रखता है।
- source_word: בְּאִשְׁתּוֹ
  choice: अपनी पत्नी से
  rationale: इस वैवाहिक संदर्भ में אִשָּׁה का अर्थ ‘पत्नी’ है; בְ־ के संबंधसूचक प्रयोग को हिन्दी में ‘से’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וְהָיוּ לְבָשָׂר אֶחָד
  choice: और वे एक देह हो जाएँगे
  rationale: बहुवचन क्रिया दोनों जनों को सम्मिलित करती है। ‘हो जाएँगे’ परिणामी भाव व्यक्त करता है, और ‘एक देह’ शारीरिक एकता तथा नए नातेदारी-संबंध, दोनों की गुंजाइश बनाए रखता है।
theological_decisions:
- issue: विवाह-सूत्र में लिंग-विशिष्ट प्रतिनिधि भाषा
  choice: पुरुष
  alternative: व्यक्ति / मनुष्य
  rationale: मूल इब्रानी אִישׁ पुल्लिंग एकवचन है। इसे लिंग-निरपेक्ष बनाने के बजाय स्रोत की स्पष्टता बनाए रखी गई है।
- issue: कथन का स्वरूप
  choice: सामान्य मानक सिद्धांत के रूप में भविष्यकालीन कथन
  alternative: प्रत्यक्ष आज्ञा या केवल किसी अतीत की प्रथा का वर्णन
  rationale: इब्रानी क्रियारूप सृष्टि-वृत्तांत पर आधारित सामान्य सिद्धांत प्रस्तुत करते हैं; अनुवाद उन्हें ऐसी आज्ञा में नहीं बदलता जो मूल में व्याकरणतः प्रत्यक्ष नहीं है।
- issue: ‘एक देह’ का आशय
  choice: मुहावरे को बिना विस्तार दिए मुख्य पाठ में सुरक्षित रखना
  alternative: केवल यौन-संबंध या केवल सामाजिक/वैधानिक एकता के रूप में स्पष्ट कर देना
  rationale: इब्रानी अभिव्यक्ति में शारीरिक मिलन और नए नातेदारी-बंधन दोनों की गूँज है; मुख्य पाठ किसी एक आयाम तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। ‘त्यागना’ और अत्यधिक संस्कृतनिष्ठ विकल्पों से बचते हुए मूल की संक्षिप्तता, लिंग-विशिष्टता और अर्थगत व्यापकता सुरक्षित रखी गई है।
