  text: पुरुष और उसकी पत्नी, दोनों नंगे थे[a], और वे लज्जित नहीं थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “वे दोनों … नंगे थे”; यह शब्द-विन्यास इस बात पर बल देता है कि उस जोड़े के दोनों सदस्य वस्त्रहीन थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: थे
  rationale: यहाँ היה का रूप कथानक को आगे बढ़ाते हुए अवस्था व्यक्त करता है; हिन्दी में ‘थे’ स्वाभाविक भूतकालीन रूप है।
- source_word: שְׁנֵיהֶם
  choice: दोनों
  rationale: यह द्विवचन-संबंधी अभिव्यक्ति इस बात पर बल देती है कि कथन जोड़े के दोनों सदस्यों पर लागू होता है।
- source_word: עֲרוּמִּים
  choice: नंगे
  rationale: इस विशेषण का सीधा अर्थ वस्त्रहीन या नंगा है। ‘नंगे’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הָאָדָם
  choice: उस पुरुष
  rationale: तात्कालिक संदर्भ में यह अपनी पत्नी के साथ उल्लिखित पुरुष को दर्शाता है; ‘उस’ निश्चित उपपद और पूर्ववर्ती संदर्भ को व्यक्त करता है।
- source_word: וְאִשְׁתּוֹ
  choice: और उसकी पत्नी
  rationale: संज्ञा पर लगे तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय के कारण इसका स्वाभाविक अर्थ ‘उसकी पत्नी’ है।
- source_word: לֹא
  choice: नहीं
  rationale: यह सामान्य निषेध को व्यक्त करता है।
- source_word: יִתְבֹּשָׁשׁוּ
  choice: उन्हें लज्जा नहीं आती थी
  rationale: यह रूप लज्जा का अनुभव करने को व्यक्त करता है। यह हिन्दी में स्वाभाविक है और केवल हल्की झेंप के बजाय गहरी लज्जा का भाव बनाए रखता है।
theological_decisions:
- issue: संदर्भ में אָדָם का अनुवाद
  choice: उस पुरुष
  alternative: मनुष्य / मानव
  rationale: पद में उसका उल्लेख विशेष रूप से ‘उसकी पत्नी’ के साथ है, इसलिए यहाँ सामान्य मानवजाति के बजाय उस पुरुष व्यक्ति का संदर्भ प्रमुख है। इससे कथानक की विशिष्टता बनी रहती है और कोई अतिरिक्त मानवशास्त्रीय निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लज्जा नहीं आती थी’ साधारण पाठक के लिए स्वाभाविक है, जबकि मूल के लज्जा-अनुभव को सुरक्षित रखता है। डैश ‘दोनों’ पर मूल के बल को स्पष्ट करता है।
