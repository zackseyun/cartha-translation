source:
  edition: WLC
  text: וַ/יְצַו֙ יְהוָ֣ה אֱלֹהִ֔ים עַל הָֽ/אָדָ֖ם לֵ/אמֹ֑ר מִ/כֹּ֥ל עֵֽץ הַ/גָּ֖ן אָכֹ֥ל תֹּאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/016.yaml
  text: And Yahweh God commanded the man[a], saying[b], “From every tree of the garden you may surely eat.”
translation:
  language: hi
  text: 'याहवे परमेश्वर ने मनुष्य को यह आज्ञा दी: “तुम बगीचे के हर पेड़ से निश्चय ही खा सकते हो[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “तुम बेहिचक खा सकते हो” भी अनुवाद किया जा सकता है। हिब्रू में एक ही क्रिया के दो रूप साथ रखकर खाने की अनुमति पर बल दिया गया है।
    reason: हिब्रू की बलात्मक रचना के स्वाभाविक हिन्दी विकल्प को दर्ज करना।
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: क्रिया צוה अधिकारपूर्वक आदेश देने को व्यक्त करती है; ‘आज्ञा दी’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: יְהוָה אֱלֹהִים
  choice: याहवे परमेश्वर
  rationale: व्यक्तिगत ईश्वरीय नाम יְהוָה को ‘याहवे’ और אֱלֹהִים को स्वाभाविक हिन्दी में ‘परमेश्वर’ किया गया है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: संदर्भ में यह अभी-अभी रचा और बगीचे में रखा गया विशिष्ट मानव है। ‘मनुष्य’ हिन्दी में स्वाभाविक है और हिब्रू אָדָם से संबंध बनाए रखता है।
- source_word: לֵאמֹר
  choice: 'यह … दी:'
  rationale: हिब्रू का कथन-सूचक रूप हिन्दी में प्रत्यक्ष वचन से पहले ‘यह’ और द्विबिंदु द्वारा स्वाभाविक रूप से व्यक्त हुआ है; अलग से ‘कहते हुए’ लिखना बोझिल होता।
- source_word: מִכֹּל עֵץ הַגָּן
  choice: बगीचे के हर पेड़ से
  rationale: מן स्रोत को और כֹּל अनुमति की व्यापकता को दर्शाता है। ‘हर पेड़ से’ मूल संरचना के निकट रहते हुए स्वाभाविक हिन्दी है।
- source_word: אָכֹל תֹּאכֵל
  choice: निश्चय ही खा सकते हो
  rationale: अनन्त धातुरूप और सीमित क्रिया का मेल खाने की क्रिया पर बल देता है। संदर्भ में यह बाध्यता नहीं, अनुमति है; इसलिए ‘खा सकते हो’ के साथ ‘निश्चय ही’ बल को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरी व्यक्तिगत नाम है। उसका लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: הָאָדָם की पहचान
  choice: मनुष्य
  alternative: पुरुष; आदम
  rationale: यहाँ पदबंध कथानक के विशिष्ट मानव को संबोधित करता है, पर इस चरण पर रूप में निश्चित नाम ‘आदम’ करना मूल की अर्थ-तनाव को समय से पहले सुलझा सकता है। ‘मनुष्य’ उस संबंध को बनाए रखता है।
- issue: אָכֹל תֹּאכֵל की विधा
  choice: निश्चय ही खा सकते हो
  alternative: अवश्य खाओगे; बेहिचक खा सकते हो
  rationale: वाक्य का संदर्भ व्यापक अनुमति देता है, खाने की आज्ञा या भविष्यवाणी नहीं। फिर भी हिब्रू का बल ‘निश्चय ही’ से व्यक्त किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल और गरिमापूर्ण रखी गई है। ‘आज्ञा दी’ ईश्वरीय अधिकार को और ‘खा सकते हो’ अनुमति को स्पष्ट करता है। ‘फल’ मूल में प्रत्यक्षतः नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
