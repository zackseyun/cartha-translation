  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּצְמַ֞ח יְהוָ֤ה אֱלֹהִים֙ מִן הָ֣/אֲדָמָ֔ה כָּל עֵ֛ץ נֶחְמָ֥ד לְ/מַרְאֶ֖ה וְ/ט֣וֹב לְ/מַאֲכָ֑ל וְ/עֵ֤ץ הַֽ/חַיִּים֙ בְּ/ת֣וֹךְ הַ/גָּ֔ן וְ/עֵ֕ץ הַ/דַּ֖עַת ט֥וֹב וָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/009.yaml
  text: And Yahweh God caused to grow from the ground every tree that is pleasant to the sight and good for food[a], and the tree of life in the midst of the garden[b], and the tree of the knowledge of good and evil.
translation:
  language: hi
  text: और यहोवा परमेश्वर ने भूमि से हर एक ऐसा वृक्ष उगाया जो देखने में मनोहर और भोजन के लिए अच्छा था, और वाटिका के बीच में जीवन का वृक्ष तथा भले और बुरे के ज्ञान का वृक्ष भी उगाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भले और बुरे का ज्ञान’ का आशय विवादित है; इसे नैतिक विवेक, परिपक्वता या व्यापक ज्ञान के अर्थ में समझा गया है। यहाँ मूल अभिव्यक्ति को यथावत रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּצְמַח
  choice: उगाए
  rationale: हिफ़ील रूप का कारणवाचक अर्थ है; हिन्दी में ‘ने ... उगाए’ स्वाभाविक रूप से ‘उगने का कारण बनाया’ व्यक्त करता है।
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: व्यक्तिगत नाम יהוה को ‘यहोवा’ और אֱלֹהִים को प्रचलित, गरिमापूर्ण ‘परमेश्वर’ से व्यक्त किया गया है।
- source_word: מִן הָאֲדָמָה
  choice: भूमि से
  rationale: אֲדָמָה यहाँ उस भूमि या मिट्टी को बताता है जिससे वृक्ष उगते हैं; ‘भूमि’ प्रसंगानुकूल और सहज है।
- source_word: כָּל עֵץ
  choice: हर प्रकार के ... वृक्ष
  rationale: एकवचन सामूहिक पद का हिन्दी में स्वाभाविक वितरणात्मक अर्थ व्यक्त करता है और अनेक वृक्षों के संदर्भ में आगे आने वाले विशेषणों से सहज मेल रखता है।
- source_word: נֶחְמָד לְמַרְאֶה
  choice: देखने में मनोहर
  rationale: यह दृश्य आकर्षण और प्रसन्नता का भाव बनाए रखता है तथा आधुनिक हिन्दी में सहज है।
- source_word: וְטוֹב לְמַאֲכָל
  choice: खाने के लिए अच्छे
  rationale: इब्रानी संरचना और भोजन के योग्य होने के भाव को सीधे व्यक्त करता है।
- source_word: וְעֵץ הַחַיִּים
  choice: जीवन का वृक्ष
  rationale: रचना का पारदर्शी और परंपरागत हिन्दी रूप।
- source_word: בְּתוֹךְ הַגָּן
  choice: वाटिका के बीच में
  rationale: केंद्रीय अथवा मध्य स्थान का अर्थ सुरक्षित है; ‘वाटिका’ गरिमापूर्ण किन्तु सामान्यतः बोधगम्य है।
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  choice: भले और बुरे के ज्ञान का वृक्ष
  rationale: शाब्दिक, धर्मवैज्ञानिक रूप से महत्त्वपूर्ण अभिव्यक्ति को बिना व्याख्यात्मक संकुचन के सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम स्पष्ट रूप से है; उसे सामान्य उपाधि में बदलने के बजाय हिन्दी में परिचित लिप्यंतरण से रखा गया है।
- issue: ‘भले और बुरे के ज्ञान’ का आशय
  choice: वाक्यांश को शाब्दिक रूप में सुरक्षित रखना
  alternative: नैतिक विवेक; परिपक्वता; समग्र ज्ञान
  rationale: इब्रानी पद के अर्थ पर मतभेद है, इसलिए मुख्य पाठ किसी एक व्याख्या को निर्णायक नहीं बनाता।
- issue: वाटिका के बीच में वृक्षों की वाक्यगत स्थिति
  choice: दोनों विशेष वृक्षों को ‘बीच में’ से जोड़ने की सम्भावना खुली रखना
  alternative: केवल जीवन के वृक्ष को वाटिका के बीच में मानना
  rationale: इब्रानी शब्दक्रम में בְּתוֹךְ הַגָּן ‘जीवन के वृक्ष’ के तुरंत बाद है, पर समन्वित संरचना के कारण दूसरे वृक्ष से संबंध पूर्णतः असम्भव नहीं; हिन्दी विरामांकन इसे कठोरता से नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली। ‘उगाए’ कारणवाचक क्रिया को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है। ‘मनोहर’ और ‘वाटिका’ सामान्य बोलचाल से कुछ ऊँचे हैं, पर बाइबलीय गद्य के लिए स्पष्ट और उपयुक्त हैं।
