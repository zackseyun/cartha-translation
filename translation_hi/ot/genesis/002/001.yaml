  yaml_path: translation/ot/genesis/002/001.yaml
  text: Thus the heavens and the earth were finished[b][a], and all their hosts.
translation:
  language: hi
  text: इस प्रकार आकाश, पृथ्वी और उनकी सारी सेना पूरे हुए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूर्ण हुए।” यहाँ “सेना” से आशय आकाश और पृथ्वी में विद्यमान अथवा उनसे संबंधित समस्त सृष्टि से है।
    reason: शाब्दिक विकल्प और सांस्कृतिक-शाब्दिक स्पष्टीकरण
lexical_decisions:
- source_word: וַיְכֻלּוּ
  choice: रचना पूरी हुई
  rationale: כלה के पुअल रूप में पूर्ण हो जाने का निष्क्रिय और परिणामसूचक भाव है। हिन्दी में केवल ‘पूरे हुए’ कहना ‘सेना’ के साथ अस्वाभाविक लगता है; ‘रचना पूरी हुई’ उसी भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַשָּׁמַיִם
  choice: आकाश
  rationale: सृष्टि-वर्णन में यह ऊपर के समूचे सृजित क्षेत्र को दर्शाता है। आधुनिक हिन्दी में ‘आकाश’ स्वाभाविक और व्यापक है; हिब्रू का रूप व्याकरणतः बहुवचन होने पर भी हिन्दी में बहुवचन आवश्यक नहीं।
- source_word: וְהָאָרֶץ
  choice: और पृथ्वी
  rationale: इस सार्वभौमिक सृष्टि-संदर्भ में אֶרֶץ किसी स्थानीय भूभाग के बजाय पृथ्वी को दर्शाता है।
- source_word: וְכָל
  choice: तथा सारी
  rationale: וְ के समन्वय और כָל की समग्रता दोनों को व्यक्त करता है; ‘सेना’ स्त्रीलिंग होने के कारण ‘सारी’ प्रयुक्त है।
- source_word: צְבָאָם
  choice: उनकी सारी सेना
  rationale: צָבָא एक व्यवस्थित समूह, सैन्य-दल या विशाल समुदाय का बिंब रखता है। ‘सेना’ उस मूल बिंब को सुरक्षित रखती है; यहाँ आशय आकाश और पृथ्वी में विद्यमान समस्त सृजित वस्तुओं से है।
theological_decisions:
- issue: ‘उनकी सारी सेना’ का दायरा
  choice: आकाश और पृथ्वी में विद्यमान अथवा उनसे संबंधित समस्त सृष्टि का व्यापक संदर्भ
  alternative: मुख्यतः तारागण या स्वर्गीय पिंड; अथवा क्रमबद्ध सैन्य दल का संकीर्ण रूपक
  rationale: आकाश और पृथ्वी के संयुक्त उल्लेख के बाद यह वाक्यांश संपूर्ण सृजित व्यवस्था का सार प्रस्तुत करता है। अनुवाद मूल सैन्य/व्यवस्थित-समूह का बिंब बनाए रखता है, जबकि टिप्पणी उसके व्यापक संदर्भ को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सेना’ मूल हिब्रू बिंब को बनाए रखती है, जबकि ‘रचना पूरी हुई’ हिन्दी में वाक्य को स्वाभाविक बनाता है।
