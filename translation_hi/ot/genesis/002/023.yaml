source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ הָֽ/אָדָם֒ זֹ֣את הַ/פַּ֗עַם עֶ֚צֶם מֵֽ/עֲצָמַ֔/י וּ/בָשָׂ֖ר מִ/בְּשָׂרִ֑/י לְ/זֹאת֙ יִקָּרֵ֣א אִשָּׁ֔ה כִּ֥י מֵ/אִ֖ישׁ לֻֽקֳחָה זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/023.yaml
  text: Then the man said[a], “This at last is bone of my bones and flesh of my flesh; this one will be called woman[b], because from man she was taken.”
translation:
  language: hi
  text: तब मनुष्य ने कहा, “अब जाकर यह मेरी हड्डियों में से हड्डी और मेरे मांस में से मांस है; यह नारी[a] कहलाएगी, क्योंकि यह नर में से ली गई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में “स्त्री” (इश्शाह) और “पुरुष” (ईश) शब्दों में शब्द-खेल है। हिन्दी में “नारी” और “नर” उस संबंध का आंशिक संकेत देते हैं।
    reason: मूल भाषा के शब्द-खेल की व्याख्या
lexical_decisions:
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: संदर्भ में यह पहले मानव, जो यहाँ पुरुष है, को सूचित करता है; ‘मनुष्य’ मूल के निश्चित पद और मानव-संज्ञा को बनाए रखता है, जबकि आगे नर/नारी का भेद स्पष्ट हो जाता है।
- source_word: זֹאת הַפַּעַם
  choice: अब जाकर यह
  rationale: शाब्दिक ‘इस बार’ के साथ-साथ प्राप्ति और पहचान की भावनात्मक पूर्णता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עֶצֶם מֵעֲצָמַי וּבָשָׂר מִבְּשָׂרִי
  choice: मेरी हड्डियों में की हड्डी और मेरे मांस में का मांस
  rationale: हिब्रू की समानांतर संबंधसूचक अभिव्यक्ति को पारंपरिक, बोधगम्य हिन्दी मुहावरे में रखता है; यहाँ מִן उद्गम/अंग होने का भाव देता है।
- source_word: אִשָּׁה / אִישׁ
  choice: नारी / नर
  rationale: मूल का ध्वन्यात्मक शब्द-खेल हिन्दी में पूर्णतः स्थानांतरित नहीं हो सकता; ‘नारी/नर’ निकट ध्वन्यात्मक और अर्थगत संबंध से उसे आंशिक रूप से दर्शाते हैं।
- source_word: לֻקֳחָה זֹאת
  choice: यह ... निकाली गई है
  rationale: स्त्रीलिंग कर्मवाच्य और अंतिम संकेतवाचक ‘यह’ दोनों को स्पष्ट रखता है; पिछले प्रसंग में देह से लिए जाने के कारण ‘निकाली गई’ स्वाभाविक है।
theological_decisions:
- issue: הָאָדָם का संदर्भगत अर्थ
  choice: मनुष्य
  alternative: पुरुष
  rationale: यह पात्र यहाँ पुरुष है, पर हिब्रू אָדָם की मानव-संज्ञा को ‘मनुष्य’ बेहतर सुरक्षित रखता है; आगे אִישׁ के लिए ‘नर’ लिंगगत विरोध स्पष्ट करता है।
- issue: אִישׁ / אִשָּׁה शब्द-खेल
  choice: नारी ... नर
  alternative: स्त्री ... पुरुष
  rationale: ‘स्त्री/पुरुष’ अधिक सामान्य है, किंतु मूल में नामकरण का तर्क ध्वन्यात्मक निकटता पर भी टिका है। ‘नारी/नर’ अर्थ को संकीर्ण किए बिना उस साहित्यिक संबंध को अधिक स्पष्ट रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘अब जाकर’ खोज और पूर्णता की पुकार व्यक्त करता है; ‘हड्डियों में की हड्डी’ और ‘मांस में का मांस’ जानबूझकर काव्यात्मक समानांतरता बनाए रखते हैं।
