base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/011.yaml
  text: The name of the first is Pishon; it is the one that goes around all the land of Havilah[a], where there is gold.
translation:
  language: hi
  text: पहली नदी का नाम पीशोन है; यह हवीला के पूरे प्रदेश के चारों ओर जाती है[a], जहाँ सोना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह हवीला के पूरे प्रदेश के चारों ओर बहती है।” इब्रानी क्रिया का अर्थ “चारों ओर जाना,” “घूमना,” या “घेरना” हो सकता है; नदी के संदर्भ में “बहती है” स्वाभाविक व्याख्या है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם הָאֶחָד
  choice: पहली नदी का नाम
  rationale: चार नदियों की क्रमिक सूची में הָאֶחָד का अर्थ ‘पहली’ है। संदर्भ से स्पष्ट ‘नदी’ को हिन्दी में जोड़ने से वाक्य स्वाभाविक और स्पष्ट बनता है।
- source_word: פִּישׁוֹן
  choice: पीशोन
  rationale: नदी के नाम का देवनागरी लिप्यंतरण।
- source_word: הַסֹּבֵב
  choice: चारों ओर बहती है
  rationale: סבב का मूल भाव ‘चारों ओर जाना/घेरना’ है; नदी के संदर्भ में ‘बहती है’ स्वाभाविक हिन्दी है, जबकि स्थानिक संबंध को ‘चारों ओर’ बनाए रखता है।
- source_word: אֵת כָּל אֶרֶץ הַחֲוִילָה
  choice: हवीला के सारे देश के
  rationale: כָּל को ‘सारे’ और אֶרֶץ को यहाँ नामित भूभाग के अर्थ में ‘देश’ से व्यक्त किया गया है; हवीला नाम का लिप्यंतरण किया गया है।
- source_word: אֲשֶׁר שָׁם הַזָּהָב
  choice: जहाँ सोना है
  rationale: यह निकटवर्ती देश की ओर संकेत करने वाला स्थानवाचक संबंधवाक्य है। ‘सोना है’ इब्रानी अस्तित्वसूचक अभिव्यक्ति को बिना अतिरिक्त अर्थ जोड़े सीधे रखता है।
