  text: וַ/יִּֽקַּֽח ל֣/וֹ יַעֲקֹ֗ב מַקַּ֥ל לִבְנֶ֛ה לַ֖ח וְ/ל֣וּז וְ/עֶרְמ֑וֹן וַ/יְפַצֵּ֤ל בָּ/הֵן֙ פְּצָל֣וֹת לְבָנ֔וֹת מַחְשֹׂף֙ הַ/לָּבָ֔ן אֲשֶׁ֖ר עַל הַ/מַּקְלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/037.yaml
  text: Then Jacob took for himself fresh rods of poplar[a], almond, and plane tree, and peeled white stripes in them[c][b], exposing the white that was on the rods.
translation:
  language: hi
  text: तब याकूब ने अपने लिए ताज़ी पॉपलर[a], बादाम[b] और चनार[c] की छड़ियाँ लीं, और उनमें सफेद धारियाँ छील दीं, जिससे छड़ियों का सफेद भाग प्रकट हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ताज़ी स्टोरेक्स’; इब्रानी לִבְנֶה से अभिप्रेत वृक्ष की ठीक-ठीक पहचान अनिश्चित है, यद्यपि ‘पॉपलर’ एक सामान्य अनुवाद है।
    reason: lexical_alternative
  - marker: b
    text: कुछ पुराने अनुवादों में ‘हेज़ल’ है, पर ‘बादाम’ अधिक सम्भावित है।
    reason: lexical_alternative
  - marker: c
    text: कुछ पुराने अनुवादों में ‘शाहबलूत’ है, पर ‘चनार’ अधिक सम्भावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקַּל
  choice: छड़ियाँ
  rationale: यहाँ काटी हुई पतली शाखाएँ अभिप्रेत हैं जिन्हें याकूब ने अपने प्रयोग में रखा। ‘छड़ियाँ’ ठोस वस्तु और बहुवचन दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: לִבְנֶה לַח
  choice: ताज़ी पॉपलर
  rationale: לַח यहाँ हाल में काटी हुई, अभी हरी या नम लकड़ी का बोध देता है। לִבְנֶה की पहचान अनिश्चित है, पर ‘पॉपलर’ सामान्य और सम्भावित पहचान है; अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: לוּז
  choice: बादाम
  rationale: इस इब्रानी वृक्षनाम की ‘बादाम’ के रूप में पहचान पुराने ‘हेज़ल’ विकल्प से अधिक सम्भावित है।
- source_word: עֶרְמוֹן
  choice: चनार
  rationale: यह शब्द सम्भवतः प्लेन वृक्ष को सूचित करता है, जिसके लिए आधुनिक हिन्दी में ‘चनार’ स्वाभाविक नाम है; पुराना ‘शाहबलूत’ विकल्प कम सम्भावित है।
- source_word: וַיְפַצֵּל
  choice: छाल ... छीली
  rationale: सन्दर्भ में शाखाओं की छाल कुछ भागों से हटाई जाती है। ‘छाल छीली’ क्रिया को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: פְּצָלוֹת לְבָנוֹת
  choice: सफेद धारियाँ
  rationale: छाल उतारे गए हिस्सों से बने दिखाई देने वाले सफेद चिह्न अभिप्रेत हैं; ‘सफेद धारियाँ’ परिणाम को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מַחְשֹׂף הַלָּבָן אֲשֶׁר עַל הַמַּקְלוֹת
  choice: छड़ियों का सफेद भीतरी भाग दिखाई देने लगा
  rationale: शाब्दिक ‘सफेद को उघाड़ते हुए’ का आशय छाल के नीचे की सफेद लकड़ी को प्रकट करना है। हिन्दी वाक्य इस क्रिया-परिणाम को स्पष्ट रखता है।
