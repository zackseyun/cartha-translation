  text: She conceived and bore a son[a], and said, “God has taken away my reproach.”
translation:
  language: hi
  text: वह गर्भवती हुई और उसने एक पुत्र को जन्म दिया। तब उसने कहा, “परमेश्वर ने मेरा अपमान दूर कर दिया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: वह गर्भवती हुई
  rationale: हरा क्रिया गर्भ धारण करने को व्यक्त करती है। आधुनिक हिन्दी में ‘गर्भवती हुई’ स्वाभाविक और स्पष्ट है।
- source_word: וַתֵּלֶד בֵּן
  choice: उसने एक पुत्र को जन्म दिया
  rationale: ילד और בֵּן का सीधा अर्थ पुत्र को जन्म देना है; यह रूप आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: וַתֹּאמֶר
  choice: तब उसने कहा
  rationale: हिब्रू कथात्मक क्रम को हिन्दी में स्वाभाविक ढंग से आगे बढ़ाने के लिए ‘तब’ प्रयुक्त है।
- source_word: אָסַף
  choice: दूर कर दिया है
  rationale: इस प्रसंग में אסף का अर्थ अपमान या कलंक को हटा देना है; पूर्ण परिणाम को ‘कर दिया है’ व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: शब्द के साथ क्रिया एकवचन है और प्रसंग इस्राएल के एक परमेश्वर की ओर संकेत करता है; हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ स्वाभाविक है।
- source_word: חֶרְפָּתִי
  choice: मेरा अपमान
  rationale: חֶרְפָּה सामाजिक तिरस्कार, बदनामी या लज्जा का भाव रखता है। ‘अपमान’ साधारण आधुनिक पाठक के लिए स्पष्ट रहते हुए सामाजिक आयाम बनाए रखता है।
theological_decisions:
- issue: אֱלֹהִים का वचन और अभिप्राय
  choice: परमेश्वर
  alternative: देवताओं
  rationale: אָסַף क्रिया एकवचन है और प्रसंग में कर्ता एकवचन है; इसलिए बहुवचन अनुवाद व्याकरण और संदर्भ के विपरीत होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज कथात्मक प्रवाह और गरिमापूर्ण बाइबलीय शैली। ‘अपमान’ को मुख्य पाठ में रखकर חֶרְפָּה के सामाजिक तिरस्कार के भाव को स्पष्ट किया गया है।
