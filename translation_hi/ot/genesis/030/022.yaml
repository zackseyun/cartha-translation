base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/022.yaml
  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
translation:
  language: hi
  text: तब परमेश्वर ने राहेल को स्मरण किया[a]; परमेश्वर ने उसकी सुनी[b] और उसकी कोख खोल दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राहेल पर ध्यान दिया” अथवा “राहेल की सुधि ली।” यहाँ “स्मरण किया” का अर्थ यह नहीं कि परमेश्वर उसे भूल गया था; यह उसकी ओर कृपापूर्वक ध्यान देकर कार्य करने का बाइबिलीय मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसकी बात सुनी” अथवा “उसकी बात मानी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: स्मरण किया
  rationale: यह इब्रानी बाइबिल का महत्त्वपूर्ण मुहावरा है, जो केवल मानसिक याद नहीं बल्कि कृपापूर्वक ध्यान देकर कार्य करने को सूचित करता है; अगली क्रियाएँ इसका आशय स्पष्ट करती हैं।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रियाओं के साथ यह एकमात्र परमेश्वर का उल्लेख करता है; आधुनिक हिन्दी बाइबिलीय शैली में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אֶת רָחֵל
  choice: राहेल को
  rationale: אֶת प्रत्यक्ष कर्म को चिह्नित करता है; רָחֵל का प्रचलित हिन्दी लिप्यंतरण ‘राहेल’ है।
- source_word: וַיִּשְׁמַע אֵלֶיהָ
  choice: उसकी सुनी
  rationale: שׁמע אֶל ध्यान से सुनने और प्रत्युत्तर देने की ओर संकेत कर सकता है। ‘उसकी सुनी’ हिन्दी में इस प्रत्युत्तरकारी भाव को स्वाभाविक ढंग से रखता है, पर ‘उसकी प्रार्थना का उत्तर दिया’ जैसी अतिरिक्त स्पष्टता नहीं जोड़ता।
- source_word: וַיִּפְתַּח
  choice: खोल दी
  rationale: פתח का ठोस अर्थ ‘खोलना’ है; स्त्रीलिंग ‘कोख’ के साथ ‘खोल दी’ स्वाभाविक हिन्दी रूप है।
- source_word: רַחְמָהּ
  choice: उसकी कोख
  rationale: רֶחֶם का अर्थ गर्भाशय/कोख है। ‘कोख खोल दी’ मूल इब्रानी मुहावरे को बनाए रखते हुए साधारण आधुनिक हिन्दी में समझने योग्य है।
- source_word: וַ
  choice: तब; और वाक्य-क्रम
  rationale: आरंभिक वाव-क्रमिक कथा को आगे बढ़ाता है, इसलिए ‘तब’ उपयुक्त है; बाद की समन्वित क्रियाएँ अर्धविराम और ‘और’ द्वारा स्वाभाविक हिन्दी क्रम में व्यक्त हुई हैं।
theological_decisions:
- issue: परमेश्वर द्वारा राहेल को ‘स्मरण करने’ का मानव-सदृश कथन
  choice: मुख्य पाठ में ‘स्मरण किया’ रखकर बाइबिलीय मुहावरे को सुरक्षित रखा गया है।
  alternative: ‘राहेल पर ध्यान दिया’ अथवा ‘राहेल की सुधि ली।’
  rationale: इब्रानी कथन यह आवश्यक रूप से नहीं बताता कि परमेश्वर पहले भूल गया था; यह उसके अनुकूल ध्यान और उसके बाद के कार्य को सूचित करता है। फिर भी इसे केवल व्याख्यात्मक पदबंध से बदलना मूल बाइबिलीय प्रतिरूप को कमजोर कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘स्मरण किया’ और ‘कोख खोल दी’ जैसे मूल इब्रानी मुहावरे सुरक्षित हैं, जबकि ‘उसकी सुनी’ प्रत्युत्तरकारी श्रवण का स्वाभाविक हिन्दी भाव देता है।
