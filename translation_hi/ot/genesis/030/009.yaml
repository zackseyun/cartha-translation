base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/009.yaml
  text: When Leah saw that she had stopped bearing children[b][a], she took Zilpah her female servant and gave her to Jacob as a wife.
translation:
  language: hi
  text: जब लिआ ने देखा कि वह बच्चे जनना बंद कर चुकी थी[a], तब उसने अपनी दासी[b] जिल्पा को लेकर उसे याकूब को पत्नी के रूप में दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बच्चे जनना छोड़ दिया था”; इब्रानी में शाब्दिक रूप से “जनने से रुक गई थी।”
    reason: lexical_alternative
  - marker: b
    text: या “स्त्री सेविका।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: जब ... ने देखा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘जब’ अगली क्रिया के साथ समय-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי कारण नहीं, बल्कि लिआ ने जो देखा उसकी विषय-वस्तु प्रस्तुत करता है।
- source_word: עָמְדָה מִלֶּדֶת
  choice: उसने बच्चे जनना बंद कर दिया है
  rationale: עמד + מן + धात्वर्थक रूप का मुहावरा किसी काम को रोक देने या उससे विरत हो जाने का अर्थ देता है; ‘बच्चे जनना’ प्रसंग को स्पष्ट और स्वाभाविक रखता है।
- source_word: שִׁפְחָתָהּ
  choice: अपनी दासी
  rationale: שִׁפְחָה अधीनस्थ स्त्री सेविका अथवा दासी को दर्शाता है। ‘दासी’ संक्षिप्त, प्रचलित और सामाजिक अधीनता को सुरक्षित रखने वाला हिन्दी शब्द है।
- source_word: זִלְפָּה
  choice: जिल्पा
  rationale: व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
- source_word: לְיַעֲקֹב
  choice: याकूब को
  rationale: इस रचना में לְ अप्रत्यक्ष कर्म को दर्शाता है।
- source_word: לְאִשָּׁה
  choice: पत्नी के रूप में
  rationale: נתן ל... לאשה विवाह में देने की अभिव्यक्ति है; यह अनुवाद औपचारिक वैवाहिक भाषा को बनाए रखता है और ‘रखैल’ जैसी अनुपस्थित तकनीकी श्रेणी नहीं जोड़ता।
theological_decisions:
- issue: घराने में जिल्पा की स्थिति और विवाह-संबंधी भाषा
  choice: שִׁפְחָה को ‘दासी’ और לְאִשָּׁה को ‘पत्नी के रूप में’ अनूदित किया गया है।
  alternative: ‘सेविका’ अथवा ‘रखैल’ कहना।
  rationale: इब्रानी पाठ एक ओर जिल्पा की अधीनस्थ घरेलू स्थिति बताता है और दूसरी ओर स्पष्ट वैवाहिक शब्दावली प्रयोग करता है। दोनों तनावों को बनाए रखना चाहिए; ‘रखैल’ इस पद में प्रयुक्त न हुई बाद की श्रेणी आरोपित कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘दासी’ सामाजिक अधीनता को स्पष्ट रखता है, जबकि ‘पत्नी के रूप में’ मूल की वैवाहिक अभिव्यक्ति को सुरक्षित रखता है।
