id: GEN.30.42
reference: Genesis 30:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְ/הַעֲטִ֥יף הַ/צֹּ֖אן לֹ֣א יָשִׂ֑ים וְ/הָיָ֤ה הָ/עֲטֻפִים֙ לְ/לָבָ֔ן וְ/הַ/קְּשֻׁרִ֖ים לְ/יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/042.yaml
  text: But when the flock were feeble[a], he would not put them in; so the feeble ones became Laban’s[c][b], and the strong ones Jacob’s.
translation:
  language: hi
  text: परन्तु जब झुंड के पशु दुर्बल होते थे[a], तब वह छड़ियाँ उनके सामने नहीं रखता था[b]। इस प्रकार दुर्बल पशु लाबान के और बलवान पशु[c] याकूब के हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कमज़ोर होते थे।” इब्रानी शब्द दुर्बल पशुओं को सूचित कर सकता है; कुछ लोग इसे विशेष रूप से देर से प्रजनन करनेवाले या कम उत्तम पशुओं के अर्थ में समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् वह छड़ियाँ उनके सामने नहीं रखता था, जैसा पिछले पदों में वर्णित है।
    reason: cross_reference
  - marker: c
    text: या “हृष्ट-पुष्ट पशु” अथवा “तगड़े पशु।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲטִיף
  choice: जब ... दुर्बल होते थे
  rationale: בְּ के साथ यह रूप समय-सूचक उपवाक्य बनाता है। עטף यहाँ प्रजनन के संदर्भ में दुर्बल पशुओं को दर्शाता है; ‘दुर्बल’ सटीक शारीरिक अर्थ को आवश्यकता से अधिक निश्चित किए बिना विरोध बनाए रखता है।
- source_word: הַצֹּאן
  choice: झुंड के पशु
  rationale: צֹאן भेड़-बकरियों जैसे छोटे पालतू पशुओं का सामूहिक पद है। ‘झुंड के पशु’ हिन्दी में स्वाभाविक है और पशुओं को वाक्य का स्पष्ट कर्ता बनाता है।
- source_word: לֹא יָשִׂים
  choice: वह छड़ियाँ उनके सामने नहीं रखता था
  rationale: שׂים का अर्थ ‘रखना/स्थापित करना’ है। मूल में कर्म निहित है, पर पिछले पदों से छड़ियाँ स्पष्ट हैं; उन्हें मुख्य पाठ में व्यक्त करने से हिन्दी वाक्य सहज और संदर्भ स्पष्ट रहता है।
- source_word: וְהָיָה
  choice: इस प्रकार ... हो गए
  rationale: 'यहाँ रूप परिणामी स्थिति बताता है: दुर्बल पशु लाबान के और बलवान पशु याकूब के हिस्से में आए।'
- source_word: הָעֲטֻפִים
  choice: दुर्बल पशु
  rationale: עטף से बना यह रूप पहले खंड की शब्दावली दोहराता है और अगले पद के बलवान पशुओं से विरोध प्रकट करता है।
- source_word: לְלָבָן
  choice: लाबान के
  rationale: לְ यहाँ स्वामित्व अथवा हिस्से में आने का भाव देता है; हिन्दी संबंधकारक इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהַקְּשֻׁרִים
  choice: बलवान पशु
  rationale: इस संदर्भ में असामान्य रूप קְשֻׁרִים, הָעֲטֻפִים के विपरीत, हृष्ट-पुष्ट या शक्तिशाली पशुओं को सूचित करता है। ‘बलवान’ स्पष्ट है, जबकि पादटिप्पणी अन्य संभावित सूक्ष्मताओं को सुरक्षित रखती है।
- source_word: לְיַעֲקֹב
  choice: याकूब के
  rationale: לְ यहाँ स्वामित्व या आवंटन दर्शाता है; हिन्दी में ‘याकूब के’ स्वाभाविक समानांतर अभिव्यक्ति है।
