translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘परन्तु’, ‘दुर्बल’ और ‘बलवान’ सामान्य पाठक के लिए बोधगम्य हैं। मूल पाठ में निहित छड़ियों को संदर्भ-स्पष्टता के लिए व्यक्त किया गया है और [b] में इसकी पुष्टि दी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
