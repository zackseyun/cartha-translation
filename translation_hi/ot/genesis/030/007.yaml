  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथा-शैली अपनाई गई है। ‘दासी’ सामाजिक अधीनता का संकेत देता है; पद को सहज रखने के लिए अलग व्याख्यात्मक पादटिप्पणी नहीं जोड़ी गई।
