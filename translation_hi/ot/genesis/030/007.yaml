  yaml_path: translation/ot/genesis/030/007.yaml
  text: Bilhah[a], Rachel’s female servant, conceived again and bore Jacob a second son.
translation:
  language: hi
  text: राहेल की दासी बिल्हा फिर गर्भवती हुई और उसने याकूब के लिए एक दूसरे पुत्र को जन्म दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: गर्भवती हुई
  rationale: हरा का अर्थ गर्भ धारण करना या गर्भवती होना है; आधुनिक हिंदी कथा-शैली में ‘गर्भवती हुई’ स्वाभाविक और स्पष्ट है।
- source_word: עוֹד
  choice: फिर
  rationale: इस जन्म-वृत्तांत में यह घटना की पुनरावृत्ति दर्शाता है।
- source_word: וַתֵּלֶד
  choice: जन्म दिया
  rationale: काल रूप में ילד यहाँ पुत्र को जन्म देने का अर्थ रखता है; ‘जन्म दिया’ आधुनिक हिंदी में सहज है।
- source_word: שִׁפְחַת
  choice: दासी
  rationale: שִׁפְחָה निम्न सामाजिक हैसियत वाली बंधुआ स्त्री-दासी को दर्शाता है; ‘दासी’ हिंदी बाइबलीय संदर्भ में स्वाभाविक है, यद्यपि अकेले यह शब्द बंधुआ स्थिति को पूरी तरह स्पष्ट नहीं करता।
- source_word: בֵּן שֵׁנִי
  choice: दूसरे पुत्र को
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘दूसरा पुत्र’ है; विभक्ति सहित यह हिंदी में स्वाभाविक रूप है।
- source_word: לְיַעֲקֹב
  choice: याकूब के लिए
  rationale: लामेद यहाँ संबंध अथवा जिसके लिए संतान उत्पन्न हुई उसे सूचित करता है; ‘के लिए’ मूल की अभिव्यक्ति को बनाए रखता है।
- source_word: בִּלְהָה שִׁפְחַת רָחֵל
  choice: राहेल की दासी बिल्हा
  rationale: यह क्रम बिल्हा की पहचान राहेल से संबंधित दासी के रूप में स्पष्ट और स्वाभाविक आधुनिक हिंदी में प्रस्तुत करता है।
