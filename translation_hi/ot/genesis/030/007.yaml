    issue: The social-status sense of שִׁפְחָה is not made explicit.
    rationale: While “दासी” is a legitimate translation, it may not consistently communicate the female slave/bonded-servant sense of the Hebrew. A brief lexical footnote preserves readable narrative style while documenting this salient meaning.
  - severity: low
    issue: The object phrase lacks an explicit indefinite determiner.
    rationale: “एक दूसरे पुत्र को” is smoother modern Hindi for “a second son” and does not change the source’s meaning.
  revised_text: राहेल की दासी बिल्हा फिर गर्भवती हुई और उसने याकूब के लिए एक दूसरे पुत्र को जन्म दिया।
