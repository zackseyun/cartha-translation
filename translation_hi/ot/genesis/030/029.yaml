  text: He said to him[a], “You know how I have served you, and how your livestock has been with me.”
translation:
  language: hi
  text: उसने उससे कहा, “तुम जानते हो कि मैंने तुम्हारी किस प्रकार सेवा की है और तुम्हारा पशुधन मेरे साथ कैसा रहा है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “और तुम्हारा पशुधन मेरे साथ कैसा था।” सम्भवतः इस हिब्रू मुहावरे का आशय केवल पशुओं के याकूब के पास रहने से नहीं, बल्कि उसकी देखरेख में उनकी दशा और बढ़ोतरी से है।
    reason: मूल वाक्यांश की शाब्दिक बनावट और उसके सम्भावित मुहावरेदार अर्थ—दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: उसने उससे कहा
  rationale: हिब्रू कथा-क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; आरम्भिक संयोजक का अलग अनुवाद आवश्यक नहीं है।
- source_word: אַתָּה יָדַעְתָּ
  choice: तुम जानते हो
  rationale: स्वतंत्र सर्वनाम कर्ता को स्पष्ट करता है, पर हिन्दी में अतिरिक्त ‘तुम स्वयं’ प्रसंग में अनावश्यक रूप से प्रबल लगता है। पूर्ण क्रिया यहाँ वर्तमान स्थिति ‘जानते हो’ का भाव देती है।
- source_word: אֵת אֲשֶׁר עֲבַדְתִּיךָ
  choice: मैंने तुम्हारी कैसी सेवा की है
  rationale: עבד में किसी के लिए काम करने और उसके अधीन सेवा करने—दोनों का भाव है। ‘सेवा की’ इस व्यापकता को बनाए रखता है।
- source_word: מִקְנְךָ
  choice: तुम्हारा पशुधन
  rationale: מִקְנֶה पालतू झुंडों और पशुओं का सामूहिक शब्द है; ‘पशुधन’ आधुनिक हिन्दी में व्यापक और सटीक है।
- source_word: הָיָה מִקְנְךָ אִתִּי
  choice: तुम्हारा पशुधन मेरे साथ कैसा रहा है
  rationale: रचना की वास्तविक अस्पष्टता को बनाए रखते हुए हिन्दी में स्वाभाविक ढंग से पशुधन की दशा या उन्नति की ओर संकेत करता है; इसे स्पष्टतः ‘फला-फूला’ कहना मूल से अधिक व्याख्यात्मक होता।
