base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/026.yaml
  text: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
translation:
  language: hi
  text: मुझे मेरी पत्नियाँ और मेरे बच्चे दे, जिनके लिए[a] मैंने तेरी सेवा की है, और मुझे जाने दे; क्योंकि तू उस सेवा को जानता है जो मैंने तेरी की है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “उनके लिए” स्त्रीलिंग बहुवचन है; इसलिए इसका संकेत अधिक विशेष रूप से पत्नियों की ओर हो सकता है, न कि पूरे परिवार की ओर।
    reason: lexical_alternative
  - marker: b
    text: “सेवा” का अनुवाद “काम” या “मेहनत” भी किया जा सकता है। यहाँ इब्रानी के एक ही मूल से बने “सेवा करना/काम करना” और “सेवा/काम” के दोहराव को बनाए रखने के लिए “सेवा” रखा गया है।
    reason: lexical_alternative
