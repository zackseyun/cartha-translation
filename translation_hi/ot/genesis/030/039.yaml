  yaml_path: translation/ot/genesis/030/039.yaml
  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
translation:
  language: hi
  text: तब झुंड ने छड़ियों के सामने संगम किया और धारीदार[a], चितकबरे[b] और धब्बेदार बच्चे जने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पट्टीदार”; עֲקֻדִּים उन पशुओं को दर्शाता है जिन पर पट्टियाँ या धारियाँ हों।
    reason: lexical_alternative
  - marker: b
    text: “चितकबरे” (נְקֻדִּים) और “धब्बेदार” (טְלֻאִים) के बीच का भेद अनुमानित है; दूसरा शब्द “बड़े-बड़े धब्बों वाले,” “पैबंद-जैसे चिह्नों वाले” या “मिश्रित रंग वाले” भी अनूदित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱמוּ
  choice: संगम किया
  rationale: יחם पशु-प्रजनन के प्रसंग में गर्मी में आने और संयोग करने को दर्शाता है। यहाँ “संगम किया” प्रजनन की क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना इसे केवल गर्भधारण तक सीमित किए।
- source_word: הַצֹּאן
  choice: झुंड
  rationale: צאן भेड़-बकरियों जैसे छोटे पालतू पशुओं का सामूहिक संज्ञा-पद है। “झुंड” उसके सामूहिक अर्थ को सहज हिन्दी में बनाए रखता है। दूसरे उपवाक्य में पुनरुक्ति से बचना हिन्दी में अधिक स्वाभाविक है, जबकि कर्ता स्पष्ट बना रहता है।
- source_word: אֶל הַמַּקְלוֹת
  choice: छड़ियों के सामने
  rationale: אֶל का मूल बोध ‘की ओर’ है, पर आस-पास के दृश्य-प्रजनन प्रसंग में “छड़ियों के सामने” स्थिति को स्पष्ट करता है और कारण-संबंध का अतिरिक्त दावा नहीं करता।
- source_word: וַתֵּלַדְןָ
  choice: बच्चे जने
  rationale: ילד का अर्थ जन्म देना है। इब्रानी में संतान के लिए संज्ञा व्यक्त नहीं है, पर हिन्दी में वर्णनात्मक विशेषणों के साथ “बच्चे” जोड़ना स्पष्ट और स्वाभाविक है।
- source_word: עֲקֻדִּים
  choice: धारीदार
  rationale: यह शब्द पट्टियों या धारियों वाले चिह्नों को दर्शाता है। “धारीदार” आधुनिक हिन्दी में स्पष्ट है; ‘पट्टीदार’ भी सम्भव है।
- source_word: נְקֻדִּים
  choice: चितकबरे
  rationale: यह छोटे बिंदुओं या चित्तियों वाले रंग-रूप को दर्शाता है। “चितकबरे” सहज हिन्दी है, यद्यपि अगले शब्द से इसका भेद अनुमानित है।
- source_word: וּטְלֻאִים
  choice: धब्बेदार
  rationale: यह बड़े, पैबंद-जैसे या मिले-जुले धब्बों का संकेत कर सकता है। “धब्बेदार” נְקֻדִּים के छोटे चित्तियों वाले भाव से उपयोगी, पर अनुमानित, भेद बनाता है।
