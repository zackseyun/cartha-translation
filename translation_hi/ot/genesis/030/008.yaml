source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר רָחֵ֗ל נַפְתּוּלֵ֨י אֱלֹהִ֧ים נִפְתַּ֛לְתִּי עִם אֲחֹתִ֖/י גַּם יָכֹ֑לְתִּי וַ/תִּקְרָ֥א שְׁמ֖/וֹ נַפְתָּלִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/008.yaml
  text: Then Rachel said[a], “With wrestlings of God I have wrestled with my sister, and I have also prevailed.” So she called his name Naphtali.
translation:
  language: hi
  text: तब राहेल ने कहा, “परमेश्वर के संघर्षों में मैंने अपनी बहन के साथ संघर्ष किया है, और मैं प्रबल भी हुई हूँ।” इसलिए उसने उसका नाम नप्ताली रखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְתּוּלֵי אֱלֹהִים
  choice: परमेश्वर की कुश्तियाँ
  rationale: इब्रानी संबंधवाचक पदबंध को औपचारिक रूप से रखा गया है। यह ‘ईश्वरीय कुश्तियाँ’ अथवा तीव्रता-सूचक अर्थ में ‘बहुत बड़ी कुश्तियाँ’ भी व्यक्त कर सकता है; मूल की कठिनता और धार्मिक तनाव को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: נִפְתַּלְתִּי
  choice: मैं ... लड़ी हूँ
  rationale: ‘कुश्तियाँ’ के साथ स्वाभाविक हिन्दी क्रिया प्रयोग किया गया है और नप्ताली नाम से जुड़ा शब्द-खेल यथासंभव बनाए रखा गया है।
- source_word: עִם אֲחֹתִי
  choice: अपनी बहन के साथ
  rationale: עִם का सीधा अर्थ ‘के साथ’ है; प्रसंग और ‘कुश्तियाँ’ प्रतिद्वंद्विता का भाव स्वयं प्रकट करते हैं।
- source_word: גַּם יָכֹלְתִּי
  choice: और मैं प्रबल भी हुई हूँ
  rationale: यहाँ יכל सफलता पाने अथवा प्रतिद्वंद्वी पर भारी पड़ने का भाव देता है; ‘प्रबल हुई’ उसी प्रतिस्पर्धात्मक अर्थ को गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וַתִּקְרָא שְׁמוֹ נַפְתָּלִי
  choice: इसलिए उसने उसका नाम नप्ताली रखा
  rationale: नामकरण सूत्र को स्वाभाविक आधुनिक हिन्दी में प्रस्तुत करते हुए कथन और नाम के बीच कारणात्मक संबंध बनाए रखा गया है।
- source_word: נַפְתָּלִי
  choice: नप्ताली
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है; यह נפתל/נפתולים से जुड़े इब्रानी शब्द-खेल की ध्वनि को कुछ सीमा तक बचाता है।
theological_decisions:
- issue: נַפְתּוּלֵי אֱלֹהִים में אֱלֹהִים का आशय
  choice: परमेश्वर की कुश्तियाँ
  alternative: बहुत बड़ी कुश्तियाँ / ईश्वरीय कुश्तियाँ
  rationale: אֱלֹהִים को सीधे परमेश्वर का उल्लेख अथवा उत्कृष्टता/तीव्रता-सूचक माना जा सकता है। मुख्य पाठ में अधिक औपचारिक अर्थ रखा गया है, ताकि वास्तविक अस्पष्टता को किसी एक व्याख्या से समाप्त न किया जाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परमेश्वर की कुश्तियाँ’ जानबूझकर कुछ असामान्य है, क्योंकि मूल इब्रानी पदबंध भी कठिन और बहुअर्थी है; ‘प्रबल हुई’ प्रतिस्पर्धा और विजय दोनों का भाव देता है।
