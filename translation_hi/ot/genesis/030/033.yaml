id: GEN.30.33
reference: Genesis 30:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עָֽנְתָה בִּ֤/י צִדְקָתִ/י֙ בְּ/י֣וֹם מָחָ֔ר כִּֽי תָב֥וֹא עַל שְׂכָרִ֖/י לְ/פָנֶ֑י/ךָ כֹּ֣ל אֲשֶׁר אֵינֶ/נּוּ֩ נָקֹ֨ד וְ/טָל֜וּא בָּֽ/עִזִּ֗ים וְ/חוּם֙ בַּ/כְּשָׂבִ֔ים גָּנ֥וּב ה֖וּא אִתִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/033.yaml
  text: 'So my honesty will answer for me later[a], when you come to inspect my wages: every goat that is not speckled and spotted, and every lamb that is not dark-colored[e][d][c][b], will be considered stolen if it is found with me.'
translation:
  language: hi
  text: “इस तरह आगे चलकर[b] मेरी ईमानदारी[a] मेरे पक्ष में गवाही देगी, जब तू मेरी मजदूरी जाँचने आएगा[c]। यदि मेरे पास कोई ऐसी बकरी मिले जो न चितकबरी हो, न धब्बेदार, या कोई ऐसी भेड़ मिले जो गहरे रंग की न हो[d], तो वह चोरी की मानी जाएगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी धार्मिकता” अथवा “मेरी खराई।” यहाँ इब्रानी शब्द मजदूरी के इस समझौते में याकूब के सही और निष्कपट व्यवहार को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “कल के दिन” है; इसका आशय “कल” या अधिक सामान्य रूप से “बाद में” हो सकता है, जब लाबान झुंड की जाँच करे।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक रूप के अधिक निकट: “जब तू अपनी उपस्थिति में मेरी मजदूरी के विषय में आएगा।” प्रसंग में आशय मजदूरी के रूप में मिले पशुओं की जाँच से है।'
    reason: translation_clarity
  - marker: d
    text: या “भूरे रंग की न हो।” यहाँ प्रयुक्त इब्रानी शब्द गहरे या भूरे रंग को सूचित करता है। “भेड़” का अनुवाद “मेमना” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְתָה בִּי
  choice: मेरे पक्ष में गवाही देगी
  rationale: इब्रानी मुहावरे का शाब्दिक भाव ‘मेरे लिए उत्तर देगी’ है; प्रसंग में याकूब की ईमानदारी उसके पक्ष में प्रमाण देगी। हिंदी में ‘गवाही देगी’ यह न्यायिक-प्रमाणात्मक भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: צִדְקָתִי
  choice: मेरी ईमानदारी
  rationale: यहाँ शब्द मजदूरी के समझौते में याकूब के सही और निष्कपट व्यवहार को बताता है। ‘धार्मिकता’ और ‘खराई’ संभव हैं, पर इस व्यावहारिक प्रसंग में ‘ईमानदारी’ अधिक स्पष्ट है।
- source_word: בְּיוֹם מָחָר
  choice: आगे चलकर
  rationale: शाब्दिक रूप से ‘कल के दिन’ है, लेकिन यहाँ आशय आवश्यक रूप से अगले कैलेंडर-दिन से नहीं, बल्कि भविष्य में होने वाली जाँच से हो सकता है।
- source_word: כִּי תָבוֹא עַל שְׂכָרִי לְפָנֶיךָ
  choice: जब तू मेरी मजदूरी जाँचने आएगा
  rationale: पदबंध याकूब को मजदूरी में मिले पशुओं की लाबान द्वारा भविष्य में की जाने वाली जाँच को सूचित करता है। ‘तेरे सामने’ का भाव हिंदी वाक्य में कर्ता ‘तू’ और स्वयं आकर जाँचने की क्रिया में निहित है।
- source_word: נָקֹד וְטָלוּא
  choice: चितकबरी … धब्बेदार
  rationale: 'दोनों शब्द अलग प्रकार के चिह्नों को बताते हैं: पहला छोटे चितों और दूसरा बड़े धब्बों या पैबंद-जैसे निशानों की ओर संकेत करता है।'
- source_word: חוּם
  choice: गहरे रंग की
  rationale: शब्द भेड़ों के भूरे अथवा सामान्यतः गहरे रंग को सूचित कर सकता है; ‘गहरे रंग की’ अनिश्चित रंग-छाया को बनाए रखता है।
- source_word: בַּכְּשָׂבִים
  choice: भेड़
  rationale: यह शब्द भेड़ अथवा मेमने के लिए प्रयुक्त हो सकता है। झुंड की श्रेणी के इस प्रसंग में व्यापक हिंदी शब्द ‘भेड़’ स्वाभाविक है।
- source_word: גָּנוּב הוּא אִתִּי
  choice: तो वह चोरी की मानी जाएगी
  rationale: इब्रानी कथन संक्षिप्त है—‘वह मेरे पास चोरी की है।’ हिंदी रूप उस निहित न्यायिक निष्कर्ष को स्पष्ट करता है कि ऐसा पशु याकूब के पास मिलने पर चोरी का माना जाए।
theological_decisions:
- issue: צִדְקָתִי का नैतिक-धार्मिक विस्तार
  choice: ईमानदारी
  alternative: धार्मिकता / खराई
  rationale: अनुवाद मजदूरी के समझौते में प्रत्यक्ष रूप से सिद्ध होने वाली सत्यनिष्ठा पर केंद्रित है, फिर भी पादटिप्पणी मूल शब्द के व्यापक नैतिक अर्थ को सुरक्षित रखती है।
- issue: बकरियों के दो प्रकार के चिह्नों के बीच संबंध
  choice: न चितकबरी हो, न धब्बेदार
  alternative: चितकबरी और धब्बेदार न हो
  rationale: प्रसंग में दोनों प्रकार के चिह्न याकूब की मजदूरी में आने वाली बकरियों की श्रेणियाँ हैं। हिंदी में दोहरी ‘न’ यह स्पष्ट करती है कि दोनों में से कोई भी चिह्न न होने वाला पशु चोरी का माना जाएगा; इब्रानी में संयोजक का शाब्दिक रूप ‘और’ है।
translation_notes:
  register: आधुनिक मानक हिंदी में संबोधन ‘तू’ रखा गया है, क्योंकि याकूब सीधे लाबान से बात कर रहा है और उत्पत्ति की कथात्मक शैली में यह निकट, स्पष्ट तथा स्रोत के एकवचन संबोधन के अनुरूप है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है।
