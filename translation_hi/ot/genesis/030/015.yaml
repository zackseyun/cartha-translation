base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/015.yaml
  text: But she said to her, “Was it a small thing that you took my husband, and would you also take my son’s mandrakes?” Rachel said, “Then he may lie with you tonight in exchange for your son’s mandrakes.”
translation:
  language: hi
  text: पर उसने उससे कहा, “क्या यह छोटी बात है कि तूने मेरे पति को ले लिया, और क्या तू मेरे बेटे के दूदाफल भी लेना चाहती है?” राहेल ने कहा, “तो तेरे बेटे के दूदाफलों के बदले वह आज रात तेरे साथ सोएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דּוּדָאֵי
  choice: दूदाफल
  rationale: यह मैनड्रेक नामक पौधे के फल का पारंपरिक और प्रसंगानुकूल हिंदी रूप है; केवल पौधा कहने के बजाय फल रखना कथा में दिए गए विनिमय को स्वाभाविक बनाता है।
- source_word: אִישִׁי
  choice: मेरे पति
  rationale: यहाँ אִישׁ संबंधसूचक प्रत्यय के साथ स्पष्ट रूप से ‘मेरा पति’ है।
- source_word: יִשְׁכַּב עִמָּךְ
  choice: वह तेरे साथ सोएगा
  rationale: इब्रानी अभिव्यक्ति को जानबूझकर उसी मर्यादित किंतु स्पष्ट रूप में रखा गया है; प्रसंग में इसका दांपत्य-संबंधी आशय विद्यमान है।
- source_word: תַּחַת
  choice: के बदले
  rationale: विनिमय अथवा प्रतिफल का अर्थ सीधे और स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: लिआ द्वारा ‘मेरे पति को ले लिया’ कहने का आरोप
  choice: आरोप को वक्ता के दृष्टिकोण के रूप में यथावत रखा गया
  alternative: राहेल ने पति पर अधिकार कर लिया
  rationale: मूल पाठ बहनों के दावे का न्यायिक या नैतिक निर्णय नहीं देता; अनुवाद को उस तनाव का समाधान नहीं करना चाहिए।
- issue: राहेल के कथन में अनुमति या व्यवस्था का भाव
  choice: ‘वह ... सोएगा’
  alternative: ‘तू उसे ... अपने साथ सुला सकती है’
  rationale: इब्रानी में पुरुष कर्ता के साथ सीधा भविष्यत्/अनुमतिसूचक कथन है; हिंदी में इसे बिना अतिरिक्त नैतिक व्याख्या के रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, संवाद में निकट संबंध और तनाव दर्शाने के लिए ‘तू/तेरे’ का प्रयोग; भाषा सरल, गरिमापूर्ण और मूल की तीक्ष्णता के अनुरूप है।
