  text: וַ/תֹּ֤אמֶר רָחֵל֙ דָּנַ֣/נִּי אֱלֹהִ֔ים וְ/גַם֙ שָׁמַ֣ע בְּ/קֹלִ֔/י וַ/יִּתֶּן לִ֖/י בֵּ֑ן עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/006.yaml
  text: Then Rachel said[a], “God has judged me, and has also heard my voice and given me a son.” Therefore she called his name Dan.
translation:
  language: hi
  text: तब राहेल ने कहा, “परमेश्वर ने मेरे मामले में न्याय किया है; उसने मेरी आवाज़ भी सुनी और मुझे एक पुत्र दिया है।” इसलिए उसने उसका नाम दान[a] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दान” नाम इब्रानी भाषा में “न्याय करना” या “उसने न्याय किया” से मिलता-जुलता है।
    reason: नाम और דָּנַנִּי के बीच की इब्रानी शब्द-क्रीड़ा हिन्दी में स्वतः स्पष्ट नहीं होती।
lexical_decisions:
- source_word: דָּנַנִּי
  choice: मेरा न्याय किया है
  rationale: यह रूप דין धातु से है और इसके साथ प्रथम पुरुष एकवचन प्रत्यय जुड़ा है। ‘मेरा न्याय किया है’ न्यायिक अर्थ और राहेल के पक्ष में हुए निर्णय की संभावना—दोनों को खुला रखता है; ‘मुझे निर्दोष ठहराया’ उससे अधिक निश्चित अर्थ जोड़ देता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया और कथा-संदर्भ से यहाँ इस्राएल के परमेश्वर का उल्लेख है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: שָׁמַע בְּקֹלִי
  choice: मेरी आवाज़ भी सुनी
  rationale: इब्रानी मुहावरे में ‘मेरी आवाज़’ स्पष्ट रूप से उपस्थित है। इसे बनाए रखने से राहेल की व्यक्तिगत पुकार का भाव सुरक्षित रहता है।
- source_word: וַיִּתֶּן לִי בֵּן
  choice: मुझे एक पुत्र दिया है
  rationale: בן का विशिष्ट अर्थ ‘पुत्र’ है, इसलिए इसे सामान्य ‘संतान’ नहीं किया गया। पूर्णतासूचक हिन्दी रूप पूर्ववर्ती कथन के साथ स्वाभाविक है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह नामकरण का कारण बताने वाला सामान्य निष्कर्षसूचक पद है; ‘इसलिए’ संक्षिप्त और स्वाभाविक है।
- source_word: קָרְאָה שְׁמוֹ דָּן
  choice: उसने उसका नाम दान रखा
  rationale: हिन्दी में नाम रखने का यह स्वाभाविक मुहावरा है और ‘दान’ नाम को स्पष्ट रखता है।
- source_word: דָּן
  choice: दान
  rationale: यह इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण है। नाम और דין (‘न्याय करना’) के बीच की शब्द-क्रीड़ा पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: राहेल के कथन में परमेश्वर की न्यायिक कार्रवाई
  choice: परमेश्वर ने मेरा न्याय किया है
  alternative: परमेश्वर ने मेरे पक्ष में न्याय किया है / परमेश्वर ने मुझे निर्दोष ठहराया है
  rationale: मूल पाठ सीधे ‘मेरा/मुझे न्याय किया’ कहता है। चुना हुआ रूप न्यायिक रूपक बनाए रखता है, पर यह निश्चित नहीं करता कि आशय केवल दोषमुक्ति या किसी विशिष्ट धर्मवैज्ञानिक अर्थ में धर्मी ठहराया जाना है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘मेरी आवाज़ सुनी’ मूल इब्रानी अभिव्यक्ति को बनाए रखता है, जबकि ‘नाम रखा’ हिन्दी में अधिक स्वाभाविक है।
