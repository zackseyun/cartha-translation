  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। संवाद में लिआ का दृढ़ दावा सुरक्षित रखा गया है। यौन आशय को स्रोत की तरह शिष्ट मुहावरे में व्यक्त किया गया है; किसी सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
