source:
  edition: WLC
  text: וַ/יָּבֹ֨א יַעֲקֹ֣ב מִן הַ/שָּׂדֶה֮ בָּ/עֶרֶב֒ וַ/תֵּצֵ֨א לֵאָ֜ה לִ/קְרָאת֗/וֹ וַ/תֹּ֨אמֶר֙ אֵלַ֣/י תָּב֔וֹא כִּ֚י שָׂכֹ֣ר שְׂכַרְתִּ֔י/ךָ בְּ/דוּדָאֵ֖י בְּנִ֑/י וַ/יִּשְׁכַּ֥ב עִמָּ֖/הּ בַּ/לַּ֥יְלָה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/016.yaml
  text: When Jacob came in from the field in the evening[a], Leah went out to meet him and said, “You must come in to me, for I have hired you with my son’s mandrakes.” So he lay with her that night.
translation:
  language: hi
  text: जब याकूब शाम को खेत से आया, तब लिआ उससे मिलने बाहर गई और बोली, “तुम्हें मेरे पास आना ही होगा, क्योंकि मैंने अपने बेटे के दूदाफलों[a] के बदले तुम्हें भाड़े पर लिया है।” तब उसने उस रात उसके साथ शयन किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने अपने बेटे के दूदाफलों के लिए तुम्हें भाड़े पर लिया है।” इब्रानी में प्रयुक्त संबंधसूचक पद दूदाफलों को इस व्यवस्था के मूल्य या साधन के रूप में जोड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... מִן הַשָּׂדֶה
  choice: खेत से लौटा
  rationale: בוא का मूल अर्थ ‘आना/प्रवेश करना’ है; खेत से घर की ओर गति के इस प्रसंग में आधुनिक हिन्दी में ‘लौटा’ स्वाभाविक है और स्थानगत भाव बनाए रखता है।
- source_word: בָּעֶרֶב
  choice: शाम को
  rationale: समय-सूचक इब्रानी पद का सहज आधुनिक हिन्दी रूप।
- source_word: וַתֵּצֵא ... לִקְרָאתוֹ
  choice: उससे मिलने बाहर गई
  rationale: 'יצא और לקראת दोनों को व्यक्त करता है: वह बाहर गई और उसकी ओर मिलने पहुँची।'
- source_word: אֵלַי תָּבוֹא
  choice: तुम्हें मेरे पास आना ही होगा
  rationale: प्रसंग में यह दाम्पत्य/यौन संबंध का शिष्ट संकेत है; ‘ही होगा’ लिआ के आग्रहपूर्ण दावे को व्यक्त करता है, बिना अभिव्यक्ति को अशिष्ट बनाए।
- source_word: שָׂכֹר שְׂכַרְתִּיךָ
  choice: मैंने ... तुम्हें भाड़े पर लिया है
  rationale: सजातीय infinitive absolute और finite verb की शब्द-क्रीड़ा हिन्दी में पूरी तरह दोहराना अस्वाभाविक होता; ‘भाड़े पर लिया’ שׂכר के लेन-देन संबंधी अर्थ को स्पष्ट रखता है।
- source_word: בְּדוּדָאֵי בְּנִי
  choice: अपने बेटे के दूदाफलों के बदले
  rationale: ב यहाँ व्यवस्था की कीमत या विनिमय का साधन बताता है। דודאים के लिए पारंपरिक हिन्दी बाइबलीय पद ‘दूदाफल’ रखा गया है, क्योंकि पौधे की सटीक आधुनिक पहचान पर कुछ अनिश्चितता है।
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: वह उसके साथ सोया
  rationale: इब्रानी का शिष्ट यौन मुहावरा आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होता है और प्रसंगगत अर्थ बनाए रखता है।
- source_word: בַּלַּיְלָה הוּא
  choice: उस रात
  rationale: הוּא का संकेतवाचक बल हिन्दी के ‘उस’ में स्वाभाविक रूप से समाहित है।
