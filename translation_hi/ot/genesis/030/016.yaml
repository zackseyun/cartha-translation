  verdict: revise
  source_fidelity: The draft accurately reflects the sequence, Leah's forceful summons, the transactional language involving her son's dudaim, and the final sexual euphemism. However, ‘खेत से लौटा’ adds a return-home nuance not stated by the Hebrew, and ‘सोया’ can be read as ordinary sleeping rather than the source's contextual euphemism for intercourse.
  naturalness: The Hindi is generally fluent. ‘भाड़े पर लिया’ is understandable and appropriately preserves the deliberately transactional, objectifying wording, though ‘किराए पर लिया’ would be less apt here. ‘उसके साथ शयन किया’ is a more dignified and contextually clear Hindi equivalent of the biblical euphemism.
  terminology: ‘दूदाफल’ suitably retains the traditional biblical term without claiming a botanically certain identification. ‘लिआ’ is retained. A note is warranted for the Hebrew preposition, which can frame the mandrakes as the price/means of the arrangement.
  issues:
  - severity: low
    issue: ‘लौटा’ adds a nuance of returning.
    rationale: וַיָּבֹא means ‘came/came in’; it does not explicitly state that Jacob returned.
  - severity: medium
    issue: ‘वह उसके साथ सोया’ is insufficiently clear in Hindi.
    rationale: Although the Hebrew uses a euphemism, ordinary Hindi ‘सोया’ readily denotes nonsexual sleep. ‘उसके साथ शयन किया’ preserves a restrained register while conveying the contextual meaning.
