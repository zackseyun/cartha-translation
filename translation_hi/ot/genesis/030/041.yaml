base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/041.yaml
  text: And whenever the stronger of the flock were breeding[a], Jacob would place the rods before the eyes of the flock in the watering troughs[b], so that they might breed among the rods.
translation:
  language: hi
  text: और जब-जब झुंड के बलवान पशु प्रजनन के समय होते थे[a], तब याकूब उन छड़ियों को नांदों में[b] झुंड की आँखों के सामने रख देता था, ताकि वे छड़ियों के पास प्रजनन करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब हृष्ट-पुष्ट पशु गर्मी में आते थे”; इब्रानी शब्द पशुओं के गर्मी में आने या प्रजनन करने को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “जल-नालियों में”; इब्रानी शब्द उन नांदों या नालियों को दर्शाता है जहाँ पशु पानी पीने आते थे।
    reason: lexical_alternative
