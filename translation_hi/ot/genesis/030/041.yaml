  choice: और जब-जब
  rationale: यह रचना कथा में बार-बार होने वाली परिस्थिति बताती है; ‘जब-जब’ उस पुनरावृत्त भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַחֵם / לְיַחְמֶנָּה
  choice: गर्भधारण के लिए मिलते थे / मिलें
  rationale: मूल क्रिया पशुओं के गर्मी में आने और प्रजनन के लिए मिलने से जुड़ी है। यह चयन प्रसंग में प्रजनन का अर्थ स्पष्ट करता है, पर वास्तविक गर्भधारण हो जाने का दावा नहीं करता।
- source_word: הַצֹּאן
  choice: झुंड
  rationale: यह शब्द भेड़ों और बकरियों जैसे छोटे पालतू पशुओं के सामूहिक झुंड को दर्शा सकता है; ‘झुंड’ प्रजाति को अनावश्यक रूप से सीमित नहीं करता।
- source_word: הַמְקֻשָּׁרוֹת
  choice: बलवान पशु
  rationale: अगले पद के निर्बल पशुओं के साथ विरोध को देखते हुए यह मजबूत और हृष्ट-पुष्ट पशुओं का बोध कराता है।
- source_word: וְשָׂם
  choice: रख देता था
  rationale: पुनरावृत्त प्रसंग में यह याकूब की नियमित क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמַּקְלוֹת
  choice: छड़ियाँ
  rationale: यह पहले वर्णित छीली हुई लकड़ियों या डंडियों को सूचित करता है; ‘छड़ियाँ’ स्पष्ट और प्रसंगानुकूल है।
- source_word: לְעֵינֵי הַצֹּאן
  choice: झुंड की आँखों के सामने
  rationale: मूल के दृश्य बल को निकटता से बनाए रखता है और हिन्दी में बोधगम्य है।
- source_word: בָּרֳהָטִים
  choice: नांदों में
  rationale: यह पशुओं के पीने के स्थान पर बनी नांदों अथवा जल-नालियों को दर्शाता है; मुख्य पाठ में संक्षिप्त और स्वाभाविक पद चुना गया है।
- source_word: בַּמַּקְלוֹת
  choice: उन छड़ियों के बीच
  rationale: 'पूर्वसर्ग का स्थानगत या परिस्थितिगत भाव बनाए रखता है: छड़ियाँ उनके सामने रखी रहती थीं जब पशु मिलते थे।'
