    reason: शִׁפְחָה के वैकल्पिक अनुवाद और उसके सामाजिक अर्थ को स्पष्ट करने के लिए, अंग्रेज़ी audit trail के lexical note के अनुरूप।
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: तब उसने दे दिया
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּלְהָה
  choice: बिल्हा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: שִׁפְחָתָהּ
  choice: अपनी दासी
  rationale: שִׁפְחָה अधीन सामाजिक स्थिति वाली स्त्री सेविका/दासी को सूचित करता है; ‘दासी’ संक्षिप्त, स्वाभाविक और ऐतिहासिक पदानुक्रम को बनाए रखता है।
- source_word: לְאִשָּׁה
  choice: पत्नी के रूप में
  rationale: यह पदबंध वैवाहिक अथवा पत्नी-सदृश संबंध के लिए दिए जाने को व्यक्त करता है; अनावश्यक व्याख्या किए बिना मूल की संबंधपरक भाषा रखी गई है।
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: उसके पास गया
  rationale: मूल इब्रानी यौन-संबंध के लिए शिष्टोक्ति का प्रयोग करता है। हिन्दी में ‘उसके पास गया’ उसी संयम और प्रसंगगत अर्थ को बनाए रखता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: बिल्हा के संबंध की कानूनी-सामाजिक प्रकृति
  choice: पत्नी के रूप में
  alternative: उपपत्नी के रूप में
  rationale: मूल में לְאִשָּׁה स्पष्टतः ‘स्त्री/पत्नी के रूप में’ कहता है; ‘उपपत्नी’ जोड़ना इस पद में निहित अस्पष्टता को आवश्यकता से अधिक निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘दासी’ सामाजिक अधीनता को दर्शाता है, जबकि अंतिम वाक्यांश मूल की शिष्टोक्ति को प्रत्यक्ष यौन भाषा में बदले बिना सुरक्षित रखता है।
