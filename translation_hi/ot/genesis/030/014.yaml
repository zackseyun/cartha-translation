base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/014.yaml
  text: In the days of the wheat harvest[a], Reuben went and found mandrakes in the field, and he brought them to Leah his mother. Then Rachel said to Leah, “Please give me some of your son’s mandrakes.”
translation:
  language: hi
  text: गेहूँ की कटनी के दिनों में रूबेन गया और उसे खेत में मैंड्रेक[a] मिले। वह उन्हें अपनी माँ लिआ के पास ले आया। तब राहेल ने लिआ से कहा, “कृपया अपने बेटे के मैंड्रेकों में से कुछ मुझे दे दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “प्रेमफल”; इब्रानी शब्द דּוּדָאִים एक ऐसे पौधे के लिए है जिसकी पारंपरिक पहचान मैंड्रेक के रूप में की जाती है और जिसे आसपास के प्रसंग में प्रजनन-क्षमता से जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: गेहूँ की कटनी के दिनों में
  rationale: यह पदबंध गेहूँ की कटनी के समय को सूचित करता है। हिंदी अभिव्यक्ति मूल के कालसूचक मुहावरे को स्वाभाविक और स्पष्ट रूप में बनाए रखती है।
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: कथात्मक रूप में הלך का सीधा अर्थ ‘गया’ है; मूल में ‘बाहर’ जैसा कोई आवश्यक अर्थ नहीं जोड़ा गया है।
- source_word: דּוּדָאִים
  choice: मैंड्रेक
  rationale: यह इस पौधे की पारंपरिक और व्यापक पहचान है। वनस्पति की पहचान पूर्णतः निश्चित न होने के कारण वैकल्पिक नाम और प्रसंगगत संबंध पाद-टिप्पणी में दिए गए हैं।
- source_word: בַּשָּׂדֶה
  choice: खेत में
  rationale: שׂדה का इस कृषि-संदर्भ में सहज और सीधा हिंदी अर्थ ‘खेत’ है।
- source_word: וַיָּבֵא אֹתָם
  choice: वह उन्हें ... ले आया
  rationale: हिफ़ील क्रिया का अर्थ ‘ले आना’ है और बहुवचन कर्म-प्रत्यय मैंड्रेकों की ओर संकेत करता है।
- source_word: אֶל לֵאָה אִמּוֹ
  choice: अपनी माँ लिआ के पास
  rationale: यह संबंध और गंतव्य दोनों को आधुनिक हिंदी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תְּנִי נָא לִי
  choice: कृपया ... मुझे दे दे
  rationale: נָא विनती या नम्र आग्रह व्यक्त करता है; ‘कृपया’ उस भाव को स्पष्ट करता है, जबकि स्त्रीलिंग एकवचन आज्ञार्थक संबोधन भी बना रहता है।
- source_word: מִדּוּדָאֵי בְּנֵךְ
  choice: अपने बेटे के मैंड्रेकों में से कुछ
  rationale: מִן यहाँ अंशवाचक है, इसलिए ‘में से कुछ’ मूल अर्थ को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: मैंड्रेकों और प्रजनन-क्षमता का संबंध
  choice: मुख्य पाठ में केवल पौधे का नाम रखा गया और प्रसंगगत संबंध पाद-टिप्पणी में बताया गया।
  alternative: मुख्य पाठ में इन्हें सीधे प्रजनन बढ़ाने वाले फल कहना।
  rationale: इब्रानी पद स्वयं इस पौधे के प्रभाव का दावा नहीं करता। ऐसा विवरण मुख्य पाठ में जोड़ना मूल की अस्पष्टता और आगे के कथानक के तनाव को अनुचित रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कटनी’ कृषि-संदर्भ के लिए परिचित शब्द है। अंग्रेज़ी परामर्श-पाठ में पाद-टिप्पणी का चिह्न कटनी के बाद था, पर टिप्पणी वास्तव में דּוּדָאִים से संबंधित है; इसलिए हिंदी मुख्य पाठ में [a] को ‘मैंड्रेक’ के बाद रखा गया है।
