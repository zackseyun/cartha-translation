  language: hi
  text: उसने अपने और याकूब के बीच तीन दिन की यात्रा जितनी दूरी रखी, और याकूब लाबान की बची हुई भेड़-बकरियों को चराता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: तीन दिन की यात्रा जितनी दूरी
  rationale: शाब्दिक अर्थ ‘तीन दिन का मार्ग’ है; हिंदी में यह अभिव्यक्ति समय नहीं, यात्रा द्वारा मापी गई दूरी को स्वाभाविक रूप से स्पष्ट करती है।
- source_word: רֹעֶה
  choice: चराता रहा
  rationale: हिब्रू कृदंत यहाँ जारी चरवाही का भाव देता है; हिंदी में ‘चराता रहा’ उस निरंतर क्रिया को सहज रूप से व्यक्त करता है।
- source_word: צֹאן
  choice: भेड़-बकरियों
  rationale: हिब्रू सामूहिक संज्ञा छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, दोनों को समेट सकती है।
- source_word: הַנּוֹתָרֹת
  choice: बची हुई
  rationale: उन झुंडों को सूचित करता है जो लाबान द्वारा अलग किए गए पशुओं के बाद शेष रहे।
