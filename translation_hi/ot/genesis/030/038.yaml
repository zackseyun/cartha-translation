translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। पशुपालन-संबंधी शब्दावली को सामान्य पाठक के लिए स्पष्ट रखा गया है। मूल की पुनरुक्त स्थान-अभिव्यक्ति को डैश द्वारा संबंधसूचक रूप में प्रस्तुत किया गया है, और וַיֵּחַמְנָה की वास्तविक शाब्दिक अस्पष्टता मुख्य पाठ तथा पादटिप्पणी में सुरक्षित रखी गई है।
