  text: וַ/יַּצֵּ֗ג אֶת הַ/מַּקְלוֹת֙ אֲשֶׁ֣ר פִּצֵּ֔ל בָּ/רֳהָטִ֖ים בְּ/שִֽׁקֲת֣וֹת הַ/מָּ֑יִם אֲשֶׁר֩ תָּבֹ֨אןָ הַ/צֹּ֤אן לִ/שְׁתּוֹת֙ לְ/נֹ֣כַח הַ/צֹּ֔אן וַ/יֵּחַ֖מְנָה בְּ/בֹאָ֥/ן לִ/שְׁתּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/038.yaml
  text: He set the rods that he had peeled in the troughs[a], in the watering channels where the flock came to drink, in front of the flock[c][b]; and they mated when they came to drink.
translation:
  language: hi
  text: उसने उन छड़ियों को, जिनका छिलका उसने उतारा था, पशुओं के सामने हौदों में—पानी पिलाने की उन नालियों में जहाँ झुंड पानी पीने आता था—रख दिया; और जब वे पानी पीने आती थीं, तब वे गरमी में आती थीं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तब वे मैथुन करती थीं।” हिब्रू क्रिया अधिक शाब्दिक रूप से पशुओं के गरमी में आने को व्यक्त कर सकती है, जबकि संदर्भ में मैथुन निहित है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में स्थान के लिए दो निकटार्थक अभिव्यक्तियाँ हैं—“हौद” और “पानी पिलाने की नालियाँ।” सम्भवतः ये दो अलग स्थानों के बजाय पानी पिलाने की उसी जगह का अधिक पूरा वर्णन करती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּג
  choice: रख दिया
  rationale: हिब्रू क्रिया किसी वस्तु को एक निश्चित स्थान पर रखने या खड़ा करने का बोध देती है; यहाँ छड़ियों के लिए ‘रख दिया’ सहज और ठोस है।
- source_word: הַמַּקְלוֹת
  choice: छड़ियों
  rationale: संदर्भ में ये वे टहनियाँ या लकड़ी की छड़ियाँ हैं जिन्हें याकूब ने छीलकर तैयार किया था; ‘छड़ियाँ’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: אֲשֶׁר פִּצֵּל
  choice: जिनका छिलका उसने उतारा था
  rationale: संदर्भानुसार क्रिया छाल छीलकर भीतर की सफेद लकड़ी प्रकट करने को दर्शाती है; यह अनुवाद क्रिया को स्पष्ट रखता है।
- source_word: בָּרֳהָטִים
  choice: हौदों में
  rationale: शब्द पशुओं को पानी पिलाने के लिए प्रयुक्त हौद या नाली जैसे पात्रों को सूचित करता है; ‘हौद’ पशुपालन के संदर्भ में स्वाभाविक है।
- source_word: בְּשִׁקֲתוֹת הַמָּיִם
  choice: पानी पिलाने की उन नालियों में
  rationale: यह वाक्यांश पिछले स्थान-सूचक शब्द को अधिक विस्तार से बताता हुआ प्रतीत होता है; ‘नालियाँ’ मूल की ठोस जल-व्यवस्था की छवि बनाए रखता है।
- source_word: אֲשֶׁר תָּבֹאןָ הַצֹּאן לִשְׁתּוֹת
  choice: जहाँ झुंड पानी पीने आता था
  rationale: צֹאן छोटे पालतू पशुओं, प्रायः भेड़-बकरियों, का सामूहिक शब्द है; ‘झुंड’ हिन्दी में उपयुक्त सामूहिक अभिव्यक्ति है।
- source_word: לְנֹכַח הַצֹּאן
  choice: पशुओं के सामने
  rationale: पूर्वसर्ग सीधे सामने या सम्मुख रखे जाने का अर्थ देता है। ‘पशुओं’ से ‘झुंड’ की अनावश्यक कठोर पुनरावृत्ति बचती है, पर आशय स्पष्ट रहता है।
- source_word: וַיֵּחַמְנָה
  choice: वे गरमी में आती थीं
  rationale: क्रिया का अधिक शाब्दिक अर्थ मादा पशुओं का गरमी में आना है। इससे मूल की जैविक अवस्था सुरक्षित रहती है और संसर्ग को निहित अर्थ के रूप में छोड़ा जाता है।
- source_word: בְּבֹאָן לִשְׁתּוֹת
  choice: जब वे पानी पीने आती थीं
  rationale: पूर्वसर्गयुक्त infinitive समयगत परिस्थिति बताता है; यह हिन्दी में स्पष्ट और स्वाभाविक रूप है।
