translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नर बकरों और बकरियों का भेद तथा चित्तीदार, चितकबरे और धारीदार निशानों के बीच मूल पाठ का शब्दगत अंतर यथासंभव सुरक्षित रखा गया है। लंबे इब्रानी वाक्य को हिंदी की पठनीयता के लिए दो वाक्यों में बाँटा गया है।
