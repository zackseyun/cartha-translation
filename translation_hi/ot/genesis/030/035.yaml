id: GEN.30.35
reference: Genesis 30:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֣סַר בַּ/יּוֹם֩ הַ/ה֨וּא אֶת הַ/תְּיָשִׁ֜ים הָֽ/עֲקֻדִּ֣ים וְ/הַ/טְּלֻאִ֗ים וְ/אֵ֤ת כָּל הָֽ/עִזִּים֙ הַ/נְּקֻדּ֣וֹת וְ/הַ/טְּלֻאֹ֔ת כֹּ֤ל אֲשֶׁר לָבָן֙ בּ֔/וֹ וְ/כָל ח֖וּם בַּ/כְּשָׂבִ֑ים וַ/יִּתֵּ֖ן בְּ/יַד בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/035.yaml
  text: That day he removed the male goats that were streaked and spotted[a], and all the female goats that were speckled and spotted—every one that had white on it—and every dark-colored one among the lambs[c][b], and he put them into the care of his sons.
translation:
  language: hi
  text: उसी दिन उसने धारीदार[a] और चितकबरे बकरों को, और चित्तीदार और चितकबरी सभी बकरियों को—अर्थात हर उस बकरी को जिस पर सफेद रंग था—और मेमनों में से हर गहरे रंग वाले को[b] अलग कर दिया। फिर उसने उन्हें अपने बेटों की देखरेख में सौंप दिया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धारीदार’ का अनुवाद ‘पट्टीदार’ भी हो सकता है; इब्रानी शब्द पशुओं पर पट्टियों या धारियों जैसे निशानों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘गहरे रंग वाले’ के स्थान पर ‘भूरे रंग वाले’ भी संभव है; इब्रानी शब्द गहरे भूरे रंग को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “अपने बेटों के हाथ में दे दिया”; यह किसी की देखरेख या अधिकार में सौंपने का इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: अलग कर दिया
  rationale: हिफ़ईल रूप यहाँ झुंड में से पशुओं को अलग करने या हटा देने की क्रिया व्यक्त करता है; ‘अलग कर दिया’ प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: הַתְּיָשִׁים
  choice: बकरों
  rationale: תיש विशेष रूप से नर बकरे को दर्शाता है; हिंदी में ‘बकरों’ से लिंग-भेद सहज रूप में स्पष्ट होता है।
- source_word: הָעֲקֻדִּים
  choice: धारीदार
  rationale: यह शब्द पशुओं के शरीर पर पट्टियों या धारियों जैसे निशानों को दर्शाता है; ‘धारीदार’ आधुनिक हिंदी में स्पष्ट है।
- source_word: הַטְּלֻאִים / הַטְּלֻאֹת
  choice: चितकबरे / चितकबरी
  rationale: यह शब्द बड़े धब्बों या मिले-जुले रंग के चिह्नों को दर्शाता है; ‘चितकबरा’ पशुओं के रंग के लिए स्वाभाविक हिंदी शब्द है।
- source_word: הַנְּקֻדּוֹת
  choice: चित्तीदार
  rationale: यह छोटे बिंदुओं या चित्तियों वाले रंग को व्यक्त करता है और ‘चितकबरी’ से मूल के दो अलग प्रकार के निशानों का भेद बनाए रखता है।
- source_word: כֹּל אֲשֶׁר לָבָן בּוֹ
  choice: हर उस बकरी को जिस पर सफेद रंग था
  rationale: यह अनुवाद כֹּל की प्रत्येक पशु पर लागू होने वाली शक्ति और उसके शरीर पर सफेद रंग उपस्थित होने का भाव बनाए रखता है।
- source_word: וְכָל חוּם בַּכְּשָׂבִים
  choice: मेमनों में से हर गहरे रंग वाले को
  rationale: חוּם गहरे, संभवतः भूरे रंग को सूचित करता है; ‘गहरे रंग’ अनिश्चित रंग-सीमा को अनावश्यक रूप से संकीर्ण नहीं करता। כְּשָׂבִים के लिए ‘मेमने’ युवा भेड़ों का सहज नाम है।
- source_word: וַיִּתֵּן בְּיַד בָּנָיו
  choice: उन्हें अपने बेटों की देखरेख में सौंप दिया
  rationale: ‘हाथ में देना’ अधिकार, नियंत्रण या देखभाल में सौंपने का इब्रानी मुहावरा है; हिंदी में इसका अर्थ स्वाभाविक ढंग से व्यक्त किया गया है।
