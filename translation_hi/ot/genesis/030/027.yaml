source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לָבָ֔ן אִם נָ֛א מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ נִחַ֕שְׁתִּי וַ/יְבָרֲכֵ֥/נִי יְהוָ֖ה בִּ/גְלָלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/027.yaml
  text: Then Laban said to him[a], “If I have found favor in your eyes, please stay[b]. I have learned by divination that Yahweh has blessed me because of you.”
translation:
  language: hi
  text: तब लाबान ने उससे कहा, “यदि मैंने तेरी दृष्टि में कृपा पाई है, तो कृपया रुक जा। मैंने शकुन-विचार से[a] जाना है कि याहवे ने तेरे कारण मुझे आशीष दी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “शकुन-विचार से जाना है” का अनुवाद “मैंने शकुन-विचार किया है” या “मैंने अनुभव से जाना है” भी हो सकता है। हिब्रू क्रिया शकुन या लक्षण-विचार का अर्थ दे सकती है; मुख्य पाठ में उसका अधिक प्रबल अर्थ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: यदि मुझ पर तेरी कृपादृष्टि हो, तो कृपया यहीं रह
  rationale: हिब्रू मुहावरे का अर्थ सामने वाले की कृपा पाना है। ‘कृपादृष्टि’ हिंदी में उस भाव को स्वाभाविक रूप से व्यक्त करता है; נָא की विनम्रता ‘कृपया’ से प्रकट होती है। ‘यहीं रह’ संदर्भ से आवश्यक पूर्ति है, क्योंकि हिब्रू वाक्य में अनुरोध का मुख्य क्रियापद लुप्त है।
- source_word: נִחַשְׁתִּי
  choice: मैंने शकुन-विचार से जाना है
  rationale: पिएल रूप सामान्यतः शकुन अथवा लक्षण देखकर भविष्य या अदृश्य बात जानने की क्रिया बताता है। यह अनुवाद ‘अनुभव से जाना’ की तुलना में मूल के प्रबल अर्थ को सुरक्षित रखता है और हिंदी पाठक को माध्यम भी स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह परमेश्वर का व्यक्तिगत नाम है; हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ शीर्षक से प्रतिस्थापन किए बिना नाम को स्पष्ट रखता है।
- source_word: וַיְבָרֲכֵנִי
  choice: ने मुझे आशीष दी है
  rationale: ברך का सीधा अर्थ ‘आशीष देना’ है। पूर्ण वर्तमान परिणाम को ‘दी है’ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בִּגְלָלֶךָ
  choice: तेरे कारण
  rationale: यह पद कारण या अवसर बताता है; ‘तेरे कारण’ संक्षिप्त और स्वाभाविक हिंदी समतुल्य है।
- source_word: לָבָן
  choice: लाबान
  rationale: व्यक्तिगत नाम का मानक हिंदी बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिंदी के सामान्य पाठकों के लिए स्थापित रूप ‘यहोवा’ रखा गया है; इसे ‘प्रभु’ जैसे पद से बदला नहीं गया।
- issue: लाबान के ज्ञान के साधन का स्वरूप
  choice: शकुन-विचार से जाना
  alternative: अनुभव से जाना
  rationale: נחשׁ का पिएल रूप शकुन अथवा लक्षण-विचार का प्रबल अर्थ रखता है। पाठ केवल लाबान का दावा प्रस्तुत करता है; अनुवाद न उसकी विधि का अनुमोदन करता है, न उसे सामान्य अनुभव में बदलकर धार्मिक तनाव मिटाता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल शैली रखी गई है। याकूब से एकवचन निकट संबोधन के अनुरूप ‘तेरी/तेरे’ प्रयुक्त है। हिब्रू की अपूर्ण शर्त में संदर्भानुसार ‘तो कृपया यहीं रह’ जोड़ा गया है। फुटनोट चिह्न मुख्य पाठ में उपस्थित है।
