  text: बिल्हा गर्भवती हुई और उसने याकूब के लिए एक पुत्र को जन्म दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: गर्भवती हुई
  rationale: हिब्रू क्रिया הרה गर्भ धारण करने अथवा गर्भवती होने को व्यक्त करती है; आधुनिक हिन्दी में ‘गर्भवती हुई’ स्वाभाविक और स्पष्ट है।
- source_word: בִּלְהָה
  choice: बिल्हा
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी लिप्यंतरण।
- source_word: וַתֵּלֶד
  choice: जन्म दिया
  rationale: हिब्रू ילד का अर्थ संतान को जन्म देना है; ‘जन्म दिया’ वर्तमान हिन्दी में स्वाभाविक कथात्मक अभिव्यक्ति है।
- source_word: לְיַעֲקֹב
  choice: याकूब के लिए
  rationale: ल उपसर्ग के संबंधात्मक/लाभार्थक भाव को स्पष्ट रखते हुए यह अनुवाद मूल की संरचना और अर्थगत तनाव को सुरक्षित रखता है।
- source_word: בֵּן
  choice: एक पुत्र
  rationale: בֵּן का अर्थ ‘पुत्र’ है; हिन्दी वाक्य में ‘एक’ अनिश्चित संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
