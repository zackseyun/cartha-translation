base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/003.yaml
  text: Then she said[a], “Here is my female servant Bilhah. Go in to her, so that she may bear on my knees[c][b], and I too may be built up through her.”
translation:
  language: hi
  text: तब उसने कहा, “देखो, मेरी दासी बिल्हा है। उसके पास जाओ, ताकि वह मेरे घुटनों पर बच्चे को जन्म दे[a] और मुझे भी उसके द्वारा संतान मिल सके[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “मेरे घुटनों पर जन्म दे।” सम्भवतः यह उस सांस्कृतिक प्रथा की ओर संकेत करता है जिसमें दासी के गर्भ से जन्मे बच्चे को पत्नी प्रतीकात्मक रूप से अपना बच्चा मानकर ग्रहण करती थी।
    reason: cultural_note
  - marker: b
    text: या, “और मैं भी उसके द्वारा बसाई/स्थापित की जाऊँ।” इब्रानी में क्रिया का शाब्दिक अर्थ “मैं बनाई जाऊँ” है; यहाँ यह संतान के द्वारा परिवार या वंश स्थापित होने का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתִי
  choice: मेरी दासी
  rationale: אמה स्त्री दास/सेविका को सूचित करता है। ‘दासी’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है तथा उसकी अधीन सामाजिक स्थिति को बनाए रखता है।
- source_word: בֹּא אֵלֶיהָ
  choice: उसके पास जाओ
  rationale: यह इब्रानी का शिष्टोक्ति-प्रयोग है जिसका आशय यौन-संबंध बनाना है। हिन्दी में ‘उसके पास जाओ’ स्रोत की शिष्टोक्ति और गरिमा दोनों बनाए रखता है।
- source_word: וְתֵלֵד עַל בִּרְכַּי
  choice: ताकि वह मेरे घुटनों पर बच्चे को जन्म दे
  rationale: ‘मेरे घुटनों पर’ सांस्कृतिक रूप से चिह्नित मूल बिंब है; सम्भवतः पत्नी द्वारा दासी के बच्चे को प्रतीकात्मक रूप से अपना मानकर ग्रहण करने की प्रथा से संबंधित है। स्पष्टता के लिए ‘बच्चे को’ जोड़ा गया है।
- source_word: וְאִבָּנֶה
  choice: मैं भी ... घर बसा सकूँ
  rationale: בנה का निफ़अल शाब्दिक रूप से ‘निर्मित/बसाई जाऊँ’ है, पर यहाँ संतान के द्वारा परिवार स्थापित होने का रूपक है। ‘घर बसा सकूँ’ हिन्दी में निर्माण और परिवार—दोनों भावों को स्वाभाविक रूप से जोड़ता है।
- source_word: מִמֶּנָּה
  choice: उसके द्वारा
  rationale: यहाँ संबंधवाचक उपसर्ग बिल्हा को उस माध्यम के रूप में प्रस्तुत करता है जिसके द्वारा राहेल संतान और परिवार पाने की आशा करती है।
- source_word: גַם אָנֹכִי
  choice: मैं भी
  rationale: यह राहेल की संतानहीनता के विपरीत उसके भी परिवार में स्थापित होने की आशा पर बल देता है।
theological_decisions:
- issue: וְאִבָּנֶה में निर्माण-रूपक और संतान पाने का आशय
  choice: मुख्य पाठ में ‘घर बसा सकूँ’ और पादटिप्पणी में शाब्दिक रूपक
  alternative: ‘मैं भी उसके द्वारा बनाई जाऊँ’ अथवा ‘मुझे भी उसके द्वारा संतान मिले’
  rationale: चुना हुआ अनुवाद साधारण हिन्दी में अर्थपूर्ण है, फिर भी पादटिप्पणी मूल के ‘निर्मित होने’ वाले रूपक को सुरक्षित रखती है और किसी विशिष्ट धर्मवैचारिक व्याख्या को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। यौन-संबंध के लिए स्रोत की शिष्टोक्ति बनाए रखी गई है। सांस्कृतिक रूप से अपरिचित ‘मेरे घुटनों पर’ को मुख्य पाठ में सुरक्षित रखकर पादटिप्पणी में समझाया गया है।
