source:
  edition: WLC
  text: כִּ֡י מְעַט֩ אֲשֶׁר הָיָ֨ה לְ/ךָ֤ לְ/פָנַ/י֙ וַ/יִּפְרֹ֣ץ לָ/רֹ֔ב וַ/יְבָ֧רֶךְ יְהוָ֛ה אֹתְ/ךָ֖ לְ/רַגְלִ֑/י וְ/עַתָּ֗ה מָתַ֛י אֶֽעֱשֶׂ֥ה גַם אָנֹכִ֖י לְ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/030.yaml
  text: For the little that you had before me has increased into abundance[a], and Yahweh has blessed you at my coming. And now[b], when shall I also provide for my own household?
translation:
  language: hi
  text: क्योंकि मेरे आने से पहले तुम्हारे पास जो थोड़ा-सा था, वह बढ़कर बहुत हो गया है; और मेरे आने पर[a] याहवे ने तुम्हें आशीष दी है। अब मैं अपने घर-परिवार का भी प्रबंध कब करूँगा?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “मेरे पाँव पर”; इसका अर्थ “मेरे आने पर” या “मेरे कारण” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अब मैं भी अपने घर-परिवार के लिए कब कुछ करूँगा?”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט אֲשֶׁר הָיָה לְךָ לְפָנַי
  choice: मेरे आने से पहले तुम्हारे पास जो थोड़ा-सा था
  rationale: लְפָנַי का रूपगत अर्थ ‘मेरे सामने/मुझसे पहले’ है, पर यहाँ याकूब के आने से पहले लाबान की थोड़ी संपत्ति का संकेत है; हिंदी में समय-संबंधी आशय स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: וַיִּפְרֹץ לָרֹב
  choice: वह बढ़कर बहुत हो गया है
  rationale: פרץ तीव्र या असाधारण बढ़ोतरी और לָרֹב बहुतायत को व्यक्त करता है। यह हिंदी प्रयोग दोनों भावों को सहज रूप में रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: לְרַגְלִי
  choice: मेरे आने पर
  rationale: शाब्दिक रूप ‘मेरे पाँव पर’ है, किंतु यह मुहावरा यहाँ याकूब के आगमन के साथ या उसके कारण मिली समृद्धि को सूचित करता है। मुख्य पाठ में प्रसंगानुकूल कालगत अर्थ रखा गया है और कारणगत संभावना पादटिप्पणी में सुरक्षित है।
- source_word: אֶעֱשֶׂה ... לְבֵיתִי
  choice: अपने घर-परिवार का ... प्रबंध करूँगा
  rationale: ‘घर के लिए करना’ का आशय अपने परिवार की आवश्यकताओं और आर्थिक हितों का प्रबंध करना है। ‘घर-परिवार’ आधुनिक हिंदी में household का स्पष्ट और स्वाभाविक रूप है।
- source_word: גַּם אָנֹכִי
  choice: मैं ... भी
  rationale: यह बलाघात लाबान के लिए किए गए काम और अब याकूब के अपने परिवार के लिए काम करने के बीच विरोध को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में प्रयुक्त व्यक्तिगत नाम को स्पष्ट रखते हुए उसका प्रचलित शैक्षिक उच्चारण हिंदी लिपि में दिया गया है; उसे सामान्य उपाधि में नहीं बदला गया।
- issue: लְרַגְלִי में आशीष का याकूब से संबंध
  choice: मेरे आने पर
  alternative: मेरे कारण
  rationale: वाक्यांश कालगत और कारणगत दोनों संबंध जता सकता है। मुख्य पाठ आगमन का अर्थ देता है, जबकि पादटिप्पणी कारणगत संभावना को खुला रखती है, ताकि याकूब की भूमिका को आवश्यकता से अधिक निश्चित न किया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘थोड़ा-सा’ और ‘बढ़कर बहुत’ संपत्ति की मात्रा और तीव्र वृद्धि को स्पष्ट करते हैं। ‘घर-परिवार’ केवल भवन नहीं, याकूब के पूरे household को दर्शाता है।
