  text: And Leah said[a], “Good fortune!” So she called his name Gad.
translation:
  language: hi
  text: तब लिआ ने कहा, “सौभाग्य!”[a] और उसने उसका नाम गाद रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी בגד का अर्थ निश्चित नहीं है। इसे “सौभाग्य!” जैसा विस्मयादिबोधक समझा जा सकता है; परंपरागत रूप से कुछ लोग इसका अनुवाद “एक दल!” करते हैं। ‘गाद’ नाम की ध्वनि यहाँ प्रयुक्त इब्रानी शब्द से मिलती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब ... ने कहा
  rationale: वय्यिक्तोल कथानक की अगली क्रिया प्रस्तुत करता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֵאָה
  choice: लिआ
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: בגד
  choice: सौभाग्य!
  rationale: कठिन इब्रानी रूप को גד (‘भाग्य/सौभाग्य’) से संबंधित विस्मयादिबोधक मानते हुए अनूदित किया गया है; इससे बच्चे के नाम गाद के साथ शब्द-क्रीड़ा भी यथासंभव बनी रहती है।
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: इसलिए उसने उसका नाम ... रखा
  rationale: नामकरण-सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और कथन से नामकरण तक परिणामसूचक प्रवाह दिखाता है।
- source_word: גָּד
  choice: गाद
  rationale: नाम का इब्रानी-आधारित लिप्यंतरण; यह पूर्ववर्ती ‘सौभाग्य’ के साथ मूल शब्द-क्रीड़ा की ओर संकेत बनाए रखता है।
