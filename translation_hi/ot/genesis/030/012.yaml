    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: जन्म दिया
  rationale: यलद का यह कथात्मक रूप अगली घटना बताता है। ‘जन्म दिया’ आधुनिक हिन्दी में स्वाभाविक है और प्रसव के अर्थ को स्पष्ट रखता है।
- source_word: זִלְפָּה
  choice: जिल्पा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: שִׁפְחַת לֵאָה
  choice: लिआ की दासी
  rationale: यह संबंधवाचक पद जिल्पा की लिआ के अधीन स्त्री सेवक/दासी की सामाजिक स्थिति बताता है। ‘दासी’ संक्षिप्त, स्वाभाविक और स्रोत के आश्रित अथवा दासत्व-संबंधी भाव के लिए पर्याप्त व्यापक है।
- source_word: בֵּן שֵׁנִי
  choice: दूसरे पुत्र को
  rationale: शाब्दिक अर्थ ‘दूसरा पुत्र’ है; प्रसंग में यह जिल्पा से याकूब का दूसरा पुत्र है। हिन्दी वाक्य-विन्यास के अनुसार कर्मचिह्न ‘को’ लगाया गया है।
- source_word: לְיַעֲקֹב
  choice: याकूब के लिए
  rationale: लְ जन्म-सूत्र में पिता अथवा हितग्राही संबंध दर्शाता है। ‘याकूब के लिए’ उस संबंध को प्रत्यक्ष रूप से बनाए रखता है और हिन्दी में स्वाभाविक है।
