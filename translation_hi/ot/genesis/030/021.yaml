  text: इसके बाद उसने एक बेटी को जन्म दिया और उसका नाम दीना रखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַחַר
  choice: इसके बाद
  rationale: यह पद पिछले जन्मों के बाद की अगली घटना बताता है; ‘इसके बाद’ आधुनिक हिन्दी में स्वाभाविक है और कथात्मक क्रम बनाए रखता है।
- source_word: יָלְדָה
  choice: उसने … को जन्म दिया
  rationale: हिब्रू ילד के स्त्रीलिंग रूप और उसके स्पष्ट कर्म ‘बेटी’ को हिन्दी के स्वाभाविक मुहावरे में व्यक्त करता है।
- source_word: בַּת
  choice: एक बेटी
  rationale: अनिश्चित एकवचन संज्ञा को आधुनिक हिन्दी में स्वाभाविक रूप से ‘एक बेटी’ कहा गया है।
- source_word: וַ/תִּקְרָא אֶת שְׁמָהּ
  choice: और उसका नाम … रखा
  rationale: शाब्दिक भाव ‘उसका नाम पुकारा’ है, पर नामकरण के प्रसंग में ‘उसका नाम … रखा’ स्वाभाविक और अर्थ-सटीक हिन्दी है।
- source_word: דִּינָה
  choice: दीना
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
