  text: וַ/תֹּ֣אמֶר לֵאָ֗ה זְבָדַ֨/נִי אֱלֹהִ֥ים אֹתִ/י֮ זֵ֣בֶד טוֹב֒ הַ/פַּ֨עַם֙ יִזְבְּלֵ֣/נִי אִישִׁ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שִׁשָּׁ֣ה בָנִ֑ים וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ זְבֻלֽוּן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/020.yaml
  text: And Leah said[a], “God has endowed me with a good endowment. This time my husband will honor me, because I have borne him six sons.” So she called his name Zebulun.
translation:
  language: hi
  text: और लिआ ने कहा, “परमेश्वर ने मुझे एक अच्छा उपहार दिया है। अबकी बार मेरा पति मेरा आदर करेगा[a], क्योंकि मैंने उसके लिए छह पुत्रों को जन्म दिया है।” इसलिए उसने उसका नाम जबूलून रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे साथ रहेगा।” इब्रानी क्रिया दुर्लभ है और ‘जबूलून’ नाम के साथ शब्द-क्रीड़ा करती है; इसमें लिआ का आदर करने और उसके साथ रहने—दोनों भाव संभव हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבָדַנִי ... זֵבֶד טוֹב
  choice: मुझे एक अच्छा उपहार दिया है
  rationale: इब्रानी क्रिया और संज्ञा एक ही मूल से हैं। हिंदी में उनकी पूर्ण शब्द-क्रीड़ा बनाए रखना कठिन है; ‘उपहार दिया’ अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: הַפַּעַם
  choice: अबकी बार
  rationale: यह वर्तमान जन्म के बाद लिआ की नई आशा को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: יִזְבְּלֵנִי
  choice: मेरा आदर करेगा
  rationale: दुर्लभ क्रिया का प्रसंगानुकूल अर्थ ‘आदर करना’ हो सकता है; ‘मेरे साथ रहेगा’ भी संभव है और नाम जबूलून से जुड़ी शब्द-क्रीड़ा को अधिक स्पष्ट करता है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: אִישִׁי
  choice: मेरा पति
  rationale: वैवाहिक प्रसंग में यही स्पष्ट और स्वाभाविक हिंदी समतुल्य है।
- source_word: יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים
  choice: मैंने उसके लिए छह पुत्रों को जन्म दिया है
  rationale: לוֹ के संबंध को बनाए रखते हुए मातृत्व और पुत्रों की संख्या को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַתִּקְרָא אֶת שְׁמוֹ זְבֻלוּן
  choice: इसलिए उसने उसका नाम जबूलून रखा
  rationale: इब्रानी नामकरण सूत्र का स्वाभाविक हिंदी रूप है।
- source_word: זְבֻלוּן
  choice: जबूलून
  rationale: नाम का मानक हिंदी लिप्यंतरण, जो मूल ध्वनि और निकटवर्ती क्रिया की शब्द-क्रीड़ा को यथासंभव बनाए रखता है।
theological_decisions:
- issue: लिआ की आशा में पति की प्रतिक्रिया
  choice: आदर करेगा
  alternative: मेरे साथ रहेगा
  rationale: मूल दुर्लभ और अर्थगत रूप से अनिश्चित है। मुख्य पाठ प्रसंग में सम्मान पाने की आशा को रखता है, जबकि वैकल्पिक निवास/साथ रहने के अर्थ को पादटिप्पणी में सुरक्षित रखा गया है; इस प्रकार वैवाहिक या धार्मिक निष्कर्ष को आवश्यकता से अधिक निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक रूप। ‘अबकी बार’ सामान्य पाठक के लिए स्वाभाविक है। मूल की दो अलग शब्द-क्रीड़ाएँ हिंदी में पूरी तरह पुनरुत्पादित नहीं हो सकतीं, इसलिए अर्थ की स्पष्टता को प्राथमिकता देकर मुख्य अनिश्चितता पादटिप्पणी में रखी गई है।
