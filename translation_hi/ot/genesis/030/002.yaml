id: GEN.30.2
reference: Genesis 30:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יַעֲקֹ֖ב בְּ/רָחֵ֑ל וַ/יֹּ֗אמֶר הֲ/תַ֤חַת אֱלֹהִים֙ אָנֹ֔כִי אֲשֶׁר מָנַ֥ע מִמֵּ֖/ךְ פְּרִי בָֽטֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/002.yaml
  text: Then Jacob became angry with Rachel and said[a], “Am I in the place of God[b], who has withheld the fruit of the womb from you?”
translation:
  language: hi
  text: तब याकूब राहेल पर क्रोधित हो उठा[a] और उसने कहा, “क्या मैं परमेश्वर के स्थान पर हूँ, जिसने तुमसे गर्भ का फल[b] रोक रखा है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “याकूब का क्रोध राहेल पर भड़क उठा।”
    reason: lexical_alternative
  - marker: b
    text: “गर्भ का फल” सन्तान के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: क्रोधित हो उठा
  rationale: इब्रानी मुहावरे में क्रोध के ‘भड़कने’ का भाव है। ‘क्रोधित हो उठा’ आधुनिक हिन्दी में स्वाभाविक है और क्रोध की तीव्रता तथा आरम्भ—दोनों को व्यक्त करता है।
- source_word: בְּרָחֵל
  choice: राहेल पर
  rationale: क्रोधवाचक क्रिया के साथ בְ उस व्यक्ति को दर्शाता है जिसकी ओर क्रोध निर्देशित है; हिन्दी में ‘राहेल पर’ इसका स्वाभाविक रूप है।
- source_word: הֲתַחַת אֱלֹהִים אָנֹכִי
  choice: क्या मैं परमेश्वर के स्थान पर हूँ
  rationale: यहाँ תַּחַת स्थानापन्न होने अथवा किसी की भूमिका में खड़े होने का भाव देता है। याकूब परमेश्वर के अधिकार या सामर्थ्य का स्थान लेने से इनकार करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: सन्दर्भ में यह एकमात्र परमेश्वर को सूचित करता है, और इसके बाद आने वाली क्रिया भी एकवचन है।
- source_word: אֲשֶׁר מָנַע מִמֵּךְ
  choice: जिसने तुमसे ... रोक रखा है
  rationale: מנע से वंचित रखने या रोकने का भाव आता है। ‘रोक रखा है’ उस वर्तमान परिणामी अवस्था को स्पष्ट करता है जिसमें राहेल अब भी सन्तानहीन है।
- source_word: פְּרִי בָטֶן
  choice: गर्भ का फल
  rationale: यह सन्तान के लिए प्रयुक्त ठोस इब्रानी मुहावरा है। हिन्दी में ‘गर्भ का फल’ बोधगम्य है और मूल रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: सन्तानहीनता में परमेश्वर की भूमिका
  choice: याकूब राहेल को सन्तान न मिलने का कारण परमेश्वर द्वारा गर्भ का फल रोके रखना बताता है।
  alternative: इसे केवल आलंकारिक प्रश्न मानकर परमेश्वर की सक्रिय भूमिका को अस्पष्ट करना।
  rationale: सम्बन्धवाचक उपवाक्य אֲשֶׁר מָנַע स्पष्ट रूप से परमेश्वर को गर्भ का फल रोकने वाला बताता है। अनुवाद इस कथन को न तो नरम करता है, न उससे आगे कोई धर्मवैज्ञानिक व्याख्या जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परमेश्वर के स्थान पर’ मूल प्रश्न की धर्मवैज्ञानिक तीक्ष्णता बनाए रखता है, जबकि ‘गर्भ का फल’ मूल इब्रानी रूपक को सुरक्षित रखता है।
