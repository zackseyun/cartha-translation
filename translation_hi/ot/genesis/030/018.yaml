source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר לֵאָ֗ה נָתַ֤ן אֱלֹהִים֙ שְׂכָרִ֔/י אֲשֶׁר נָתַ֥תִּי שִׁפְחָתִ֖/י לְ/אִישִׁ֑/י וַ/תִּקְרָ֥א שְׁמ֖/וֹ יִשָּׂשכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/018.yaml
  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
translation:
  language: hi
  text: तब लिआ ने कहा[a], “परमेश्वर ने मुझे मेरी मजदूरी दी है, क्योंकि मैंने अपनी दासी अपने पति को दी थी।” इसलिए उसने उसका नाम इस्साकार रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इस्साकार” नाम की ध्वनि उस इब्रानी शब्द से मिलती-जुलती है जिसका अर्थ “मजदूरी” या “प्रतिफल” है; यह लिआ की व्याख्या को दर्शाता है।
    reason: नाम और שָׂכָר के बीच इब्रानी शब्द-संबंध हिन्दी मुख्य पाठ में स्वतः स्पष्ट नहीं होता।
lexical_decisions:
- source_word: נָתַן אֱלֹהִים
  choice: परमेश्वर ने मुझे ... दी है
  rationale: हिब्रू में परमेश्वर कर्ता है और पूर्ण हुई क्रिया का वर्तमान परिणाम लिआ की व्याख्या में प्रमुख है; हिन्दी पूर्ण वर्तमान इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׂכָרִי
  choice: मेरी मजदूरी
  rationale: שָׂכָר का ठोस अर्थ मजदूरी या प्रतिफल है। ‘मजदूरी’ इस्साकार नाम के साथ ध्वनि और अर्थ के संबंध तथा कथन की लेन-देन संबंधी धार को ‘इनाम’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: אֲשֶׁר
  choice: क्योंकि
  rationale: यहाँ संबंधवाचक अव्यय लिआ के अनुसार परमेश्वर से मजदूरी मिलने का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ उसका अर्थ स्पष्ट करता है।
- source_word: נָתַתִּי
  choice: मैंने ... दी थी
  rationale: दासी को पति को देना इस कथन और जन्म से पहले की घटना है; हिन्दी का पूर्वपूर्ण रूप घटनाक्रम को स्पष्ट और स्वाभाविक रखता है।
- source_word: שִׁפְחָתִי
  choice: अपनी दासी
  rationale: ‘दासी’ स्त्री सेविका की आश्रित और अस्वतंत्र सामाजिक स्थिति को संक्षेप में व्यक्त करता है और आधुनिक बाइबलीय हिन्दी में समझने योग्य है।
- source_word: לְאִישִׁי
  choice: अपने पति को
  rationale: संदर्भ में אִישׁ का अर्थ वैवाहिक संबंध में ‘पति’ है; हिन्दी में आत्मवाचक ‘अपने’ कर्ता लिआ से संबंध स्पष्ट करता है।
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: इसलिए उसने उसका नाम ... रखा
  rationale: हिब्रू मुहावरे का स्वाभाविक हिन्दी रूप ‘नाम रखना’ है। ‘इसलिए’ नामकरण को लिआ की कही हुई व्याख्या से जोड़ता है।
- source_word: יִשָּׂשכָר
  choice: इस्साकार
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है; उससे जुड़ा शब्द-संबंध पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: जन्म को परमेश्वर की ओर से मिली मजदूरी मानने की लिआ की व्याख्या
  choice: लिआ के कथन को बिना समर्थन या आलोचना जोड़े सीधे प्रस्तुत किया गया है।
  alternative: ‘मजदूरी’ के स्थान पर अधिक अमूर्त ‘प्रतिफल’ या ‘इनाम’ रखकर लेन-देन की धार को नरम करना।
  rationale: पद घटनाओं के विषय में लिआ की अपनी धार्मिक व्याख्या देता है। अनुवाद को उसकी भाषा और उसमें निहित तनाव सुरक्षित रखना चाहिए, न कि उसका धर्मवैज्ञानिक मूल्यांकन करना चाहिए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘दासी’ सामाजिक स्थिति को बनाए रखता है; ‘मजदूरी’ नामकरण के शब्द-संबंध को यथासंभव स्पष्ट करता है। मुख्य पाठ का [a] पादटिप्पणी से मेल खाता है।
