source:
  edition: WLC
  text: אֶֽעֱבֹ֨ר בְּ/כָל צֹֽאנְ/ךָ֜ הַ/יּ֗וֹם הָסֵ֨ר מִ/שָּׁ֜ם כָּל שֶׂ֣ה נָקֹ֣ד וְ/טָל֗וּא וְ/כָל שֶׂה חוּם֙ בַּ/כְּשָׂבִ֔ים וְ/טָל֥וּא וְ/נָקֹ֖ד בָּ/עִזִּ֑ים וְ/הָיָ֖ה שְׂכָרִֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/032.yaml
  text: Let me pass through all your flock today[a], removing from there every speckled and spotted sheep, every dark-colored lamb among the sheep, and every spotted and speckled one among the goats[b]; and that will be my wages.
translation:
  language: hi
  text: आज मुझे तेरे सारे झुंड में से होकर जाने दे; मैं उसमें से हर चितकबरी और धब्बेदार भेड़, भेड़ों में हर गहरे रंग की भेड़[a], और बकरियों में हर धब्बेदार और चितकबरी बकरी[b] अलग कर लूँगा; वही मेरी मज़दूरी होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भूरे रंग की।” हिब्रू חוּם भेड़ों के गहरे या भूरे रंग को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “चितकबरी” (נָקֹד) और “धब्बेदार” (טָלוּא), दोनों रंग की बनावट बताने वाले शब्द हैं। इनके बीच का ठीक-ठीक भेद स्पष्ट नहीं है; इन्हें “बिंदीदार और चकत्तेदार” जैसे शब्दों से भी व्यक्त किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱבֹר
  choice: मुझे ... होकर जाने दे
  rationale: प्रसंग में याकूब लाबान के सामने प्रस्ताव रख रहा है; इसलिए अपूर्ण क्रिया का अनुमतिसूचक/इच्छासूचक भाव स्वाभाविक है।
- source_word: בְּכָל צֹאנְךָ
  choice: अपने पूरे झुंड में से
  rationale: צֹאן भेड़-बकरियों के सामूहिक झुंड को दर्शाता है; हिन्दी में ‘झुंड’ सहज है और आगे आने वाले प्रजातिगत भेद को बनाए रखता है।
- source_word: הָסֵר מִשָּׁם
  choice: उसमें से ... अलग कर दे
  rationale: सन्दर्भ में पशुओं को झुंड से छाँटकर अलग करने की ठोस क्रिया अभिप्रेत है। आज्ञार्थक रूप हिब्रू वाक्य की संरचना और लाबान द्वारा अलग किए जाने की सम्भावना को सुरक्षित रखता है।
- source_word: נָקֹד
  choice: चितकबरी
  rationale: यह छोटे-छोटे रंगीन चिह्नों वाले पशु का संकेत करता है; ‘चितकबरी’ सामान्य हिन्दी में स्वाभाविक है।
- source_word: טָלוּא
  choice: धब्बेदार
  rationale: यह धब्बों या रंग के बड़े चकत्तों वाली बनावट दर्शाता है और נָקֹד से उपयोगी, यद्यपि पूर्णतः निश्चित नहीं, भेद रखता है।
- source_word: חוּם
  choice: गहरे रंग की
  rationale: शब्द गहरे अथवा भूरे रंग को दर्शाता है; ‘गहरे रंग की’ अनिश्चित रंग-सीमा को अतिनिश्चित किए बिना व्यक्त करता है।
- source_word: בַּכְּשָׂבִים
  choice: भेड़ों में से
  rationale: यहाँ भेड़-वर्ग का बकरियों से विरोध है; सामान्य प्रजातिगत पद हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בָּעִזִּים
  choice: बकरियों में से
  rationale: सामूहिक अर्थ में ‘बकरियाँ’ सहज है और अनावश्यक रूप से मादा होने का अर्थ नहीं जोड़ता।
- source_word: וְהָיָה שְׂכָרִי
  choice: वही मेरी मज़दूरी होगी
  rationale: שָׂכָר काम के बदले मिलने वाली मज़दूरी/वेतन है; ‘मज़दूरी’ इस पशुपालन-सेवा के प्रसंग में उपयुक्त है।
