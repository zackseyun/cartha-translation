  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּפְרֹ֥ץ הָ/אִ֖ישׁ מְאֹ֣ד מְאֹ֑ד וַֽ/יְהִי ל/וֹ֙ צֹ֣אן רַבּ֔וֹת וּ/שְׁפָחוֹת֙ וַ/עֲבָדִ֔ים וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/043.yaml
  text: And the man became exceedingly prosperous[b][a], and he came to have many flocks and female servants and male servants and camels and donkeys.
translation:
  language: hi
  text: और वह पुरुष बहुत अधिक समृद्ध हो गया; उसके पास भेड़-बकरियों के बहुत-से झुंड, दासियाँ, दास, ऊँट और गधे हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹץ ... מְאֹד מְאֹד
  choice: बहुत ही अधिक समृद्ध हो गया
  rationale: פרץ का मूल भाव फूट निकलने या असाधारण रूप से बढ़ने का है; संपत्ति के इस संदर्भ में यह अत्यधिक उन्नति और समृद्धि बताता है। दोहरे מְאֹד की तीव्रता को ‘बहुत ही अधिक’ से व्यक्त किया गया है।
- source_word: הָאִישׁ
  choice: वह पुरुष
  rationale: इब्रानी में सामान्य संज्ञा ‘वह पुरुष’ है, जो प्रसंग में याकूब को सूचित करती है; नाम जोड़कर निहित संदर्भ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: וַיְהִי לוֹ
  choice: उसके पास ... हो गए
  rationale: यह रचना परिणामी स्वामित्व बताती है—पहले की तुलना में ये सब उसके पास आ गए। हिंदी में यह कथात्मक विकास स्वाभाविक रूप से व्यक्त होता है।
- source_word: צֹאן רַבּוֹת
  choice: बहुत-से भेड़-बकरियों के झुंड
  rationale: צֹאן सामूहिक रूप से मुख्यतः भेड़ों और बकरियों को दर्शाता है; ‘झुंड’ और רַבּוֹת के लिए ‘बहुत-से’ संख्या तथा प्रचुरता दोनों को स्पष्ट करते हैं।
- source_word: שְׁפָחוֹת וַעֲבָדִים
  choice: दासियाँ, दास
  rationale: दोनों शब्द क्रमशः स्त्री और पुरुष बंधुआ घरेलू श्रमिकों को दर्शाते हैं। संपत्ति की सूची में होने के कारण ‘सेविकाएँ, सेवक’ की अपेक्षा ‘दासियाँ, दास’ उस प्राचीन सामाजिक वास्तविकता को अधिक स्पष्टता से रखता है।
- source_word: גְמַלִּים וַחֲמֹרִים
  choice: ऊँट और गधे
  rationale: दोनों पशु-संज्ञाओं के मानक आधुनिक हिंदी रूप।
theological_decisions:
- issue: שְׁפָחוֹת और עֲבָדִים को सेवक-संबंधी या दास-संबंधी भाषा में प्रस्तुत करना
  choice: दासियाँ, दास
  alternative: सेविकाएँ, सेवक
  rationale: इन शब्दों में सेवाकार्य का अर्थ हो सकता है, पर यहाँ व्यक्तियों को पशुधन के साथ अर्जित संपत्ति में गिना गया है। इसलिए ‘दासियाँ, दास’ बंधुआ स्थिति को नरम किए बिना स्रोत के सामाजिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण कथात्मक रूप। इब्रानी की संचयी सूची को हिंदी में अल्पविरामों और अंतिम ‘और’ के साथ स्वाभाविक बनाया गया है; किसी पंथ-विशेष की शब्दावली नहीं जोड़ी गई।
