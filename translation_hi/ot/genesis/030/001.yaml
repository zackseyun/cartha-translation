  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। मूल के तीखे भाव और सीधे संवाद को बनाए रखा गया है; अनावश्यक रूप से संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
