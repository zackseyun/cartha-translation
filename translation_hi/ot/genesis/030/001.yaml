  text: וַ/תֵּ֣רֶא רָחֵ֗ל כִּ֣י לֹ֤א יָֽלְדָה֙ לְ/יַעֲקֹ֔ב וַ/תְּקַנֵּ֥א רָחֵ֖ל בַּ/אֲחֹתָ֑/הּ וַ/תֹּ֤אמֶר אֶֽל יַעֲקֹב֙ הָֽבָ/ה לִּ֣/י בָנִ֔ים וְ/אִם אַ֖יִן מֵתָ֥ה אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/001.yaml
  text: When Rachel saw that she had borne no children to Jacob[a], she became jealous of her sister, and she said to Jacob, “Give me children[b], or I will die!”
translation:
  language: hi
  text: जब राहेल ने देखा कि उसने याकूब के लिए कोई संतान नहीं जनी थी, तो वह अपनी बहन से ईर्ष्या करने लगी। उसने याकूब से कहा, “मुझे संतान दो, नहीं तो मैं मर जाऊँगी!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא רָחֵל
  choice: जब राहेल ने देखा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘जब’ राहेल के देखने और उसकी अगली प्रतिक्रिया के बीच स्वाभाविक कालगत संबंध व्यक्त करता है।
- source_word: כִּי לֹא יָלְדָה לְיַעֲקֹב
  choice: कि उसने याकूब के लिए कोई संतान नहीं जनी है
  rationale: स्त्री के विषय में יָלַד का अर्थ ‘जन्म देना/जनना’ है। निहित कर्म को ‘संतान’ से स्पष्ट किया गया है, और לְ का संबंध स्वाभाविक हिन्दी में ‘याकूब के लिए’ रखा गया है।
- source_word: וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ
  choice: तो वह अपनी बहन से ईर्ष्या करने लगी
  rationale: קנא यहाँ बहन की प्रजनन-समर्थता के कारण उत्पन्न ईर्ष्या दर्शाता है। ‘करने लगी’ भाव के आरम्भ और कथात्मक गति को व्यक्त करता है; हिन्दी की सहजता के लिए दूसरी बार ‘राहेल’ के स्थान पर ‘वह’ है।
- source_word: הָבָה לִּי בָנִים
  choice: मुझे संतान दो
  rationale: בָנִים का शाब्दिक अर्थ ‘पुत्र’ है, पर इस प्रसंग में राहेल की इच्छा संतान उत्पन्न करने की है; हिन्दी में एकवचन सामूहिक ‘संतान’ लिंग को अनावश्यक रूप से सीमित किए बिना आशय व्यक्त करता है।
- source_word: וְאִם אַיִן
  choice: नहीं तो
  rationale: यह वाक्यांश माँग पूरी न होने की गंभीर परिणति प्रस्तुत करता है; ‘नहीं तो’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: מֵתָה אָנֹכִי
  choice: मैं मर जाऊँगी
  rationale: यह रूप तीव्र और आसन्न परिणाम व्यक्त करता है। ‘मैं मर जाऊँगी’ कथन की सीधी, निराशापूर्ण तीव्रता बनाए रखता है, बिना उसे मनोवैज्ञानिक व्याख्या में बदलने के।
