base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/017.yaml
  text: And God listened to Leah[a], and she conceived and bore Jacob a fifth son.
translation:
  language: hi
  text: और परमेश्वर ने लिआ की सुनी[a]; वह गर्भवती हुई और उसने याकूब के लिए पाँचवें पुत्र को जन्म दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर ने लिआ को सुना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים אֶל לֵאָה
  choice: परमेश्वर ने लिआ की सुनी
  rationale: שׁמע के साथ אֶל यहाँ केवल ध्वनि सुनने से बढ़कर ध्यान देने और अनुकूल उत्तर देने का भाव रखता है। हिंदी मुहावरा ‘किसी की सुनना’ इस संबंधात्मक और प्रत्युत्तरकारी अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַתַּהַר
  choice: वह गर्भवती हुई
  rationale: यह आधुनिक हिंदी में स्पष्ट और स्वाभाविक है तथा गर्भधारण के आरंभ को व्यक्त करता है।
- source_word: וַתֵּלֶד לְיַעֲקֹב
  choice: उसने याकूब के लिए ... को जन्म दिया
  rationale: לְ का हित/संबंधसूचक भाव बनाए रखते हुए यह हिंदी में जन्म-वृत्तांत के लिए सहज अभिव्यक्ति है।
- source_word: בֵּן חֲמִישִׁי
  choice: पाँचवें पुत्र
  rationale: क्रमवाचक विशेषण का संबंध ‘पुत्र’ से है; प्रसंग में यह याकूब के लिए लिआ से उत्पन्न पाँचवाँ पुत्र है।
- source_word: לֵאָה / יַעֲקֹב
  choice: लिआ / याकूब
  rationale: बाइबलीय नामों के प्रचलित आधुनिक हिंदी रूप अपनाए गए हैं।
theological_decisions:
- issue: שׁמע אֶל में परमेश्वर की प्रतिक्रिया का निहितार्थ
  choice: ‘परमेश्वर ने लिआ की सुनी’—ध्यान देने और अनुकूल प्रत्युत्तर देने के अर्थ में
  alternative: ‘परमेश्वर ने लिआ को सुना’
  rationale: इब्रानी वाक्यांश को केवल श्रवण तक सीमित न करके उसका प्रत्युत्तरकारी भाव बनाए रखा गया है, पर पाठ से परे किसी विशिष्ट धार्मिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘की सुनी’ स्वाभाविक हिंदी मुहावरा है; पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
