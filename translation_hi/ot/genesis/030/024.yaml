source:
  edition: WLC
  text: וַ/תִּקְרָ֧א אֶת שְׁמ֛/וֹ יוֹסֵ֖ף לֵ/אמֹ֑ר יֹסֵ֧ף יְהוָ֛ה לִ֖/י בֵּ֥ן אַחֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/024.yaml
  text: And she called his name Joseph[a], saying, “May Yahweh add to me another son.”
translation:
  language: hi
  text: और उसने उसका नाम यूसुफ़[a] रखा और कहा, “याहवे मुझे एक और पुत्र दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यूसुफ़” नाम उस हिब्रू क्रिया से मिलता-जुलता सुनाई देता है जिसका अर्थ “वह और जोड़े” या “वह जोड़ता है” है।
    reason: नाम और יֹסֵף के बीच हिब्रू शब्द-खेल हिन्दी में सीधे सुरक्षित नहीं रहता।
lexical_decisions:
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: और उसने उसका नाम ... रखा
  rationale: हिब्रू नामकरण-सूत्र का स्वाभाविक आधुनिक हिन्दी रूप; ‘उसका नाम’ मूल संरचना को भी बनाए रखता है।
- source_word: יוֹסֵף
  choice: यूसुफ़
  rationale: हिन्दी में इस बाइबिलीय व्यक्ति के लिए प्रचलित और सहज नाम-रूप।
- source_word: לֵאמֹר
  choice: और कहा
  rationale: उद्धरण आरम्भ कराने वाले हिब्रू क्रियारूप का स्वाभाविक कथात्मक अनुवाद।
- source_word: יֹסֵף
  choice: दे
  rationale: मूल क्रिया का अर्थ ‘और जोड़ना’ है; पुत्र माँगने की प्रार्थना में हिन्दी का ‘एक और पुत्र दे’ अर्थ और इच्छासूचक भाव को स्वाभाविक रूप से व्यक्त करता है। शब्द-खेल पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: לִי בֵּן אַחֵר
  choice: मुझे एक और पुत्र
  rationale: בן का विशिष्ट अर्थ ‘पुत्र’ और אַחֵר का अर्थ ‘एक और’ स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है; इसलिए किसी उपाधि को प्रतिस्थापित किए बिना उसका लिप्यंतरण किया गया है।
- issue: יֹסֵף का भाव
  choice: 'इच्छा/प्रार्थना: ‘दे’'
  alternative: ‘देगा’ या ‘दिया है’
  rationale: नामकरण के प्रसंग और आगे ‘एक और पुत्र’ की माँग के कारण यह रूप भविष्यवाणी या पूर्ण घटना की अपेक्षा इच्छा/प्रार्थना को अधिक उचित ढंग से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नामकरण-सूत्र को शाब्दिक कठोरता के बजाय स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि शब्द-खेल पादटिप्पणी में सुरक्षित है।
