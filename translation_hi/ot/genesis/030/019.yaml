  text: लिआ फिर गर्भवती हुई और उसने याकूब के छठे पुत्र को जन्म दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: गर्भवती हुई
  rationale: हिब्रू הרה का यहाँ अर्थ गर्भधारण करना है। आधुनिक सामान्य हिन्दी में ‘गर्भवती हुई’ स्वाभाविक और स्पष्ट है।
- source_word: עוֹד
  choice: फिर
  rationale: कथा-क्रम में עוֹד पुनरावृत्ति दर्शाता है; ‘फिर’ संक्षिप्त और सहज हिन्दी समतुल्य है।
- source_word: וַתֵּלֶד
  choice: जन्म दिया
  rationale: ילד के इस रूप का अर्थ संतान को जन्म देना है; हिन्दी में ‘जन्म दिया’ इसका स्वाभाविक प्रयोग है।
- source_word: בֵּן
  choice: पुत्र
  rationale: בֵּן का सीधा अर्थ ‘पुत्र’ है; यह गरिमापूर्ण और सामान्य बाइबलीय हिन्दी में सुबोध है।
- source_word: שִׁשִּׁי
  choice: छठे
  rationale: क्रमवाचक विशेषण पुत्र के जन्म-क्रम को दर्शाता है। ‘छठे पुत्र’ हिन्दी में स्वाभाविक है।
- source_word: לְיַעֲקֹב
  choice: याकूब के लिए
  rationale: לְ उपसर्ग यहाँ संबंध अथवा हित का भाव रखता है। ‘याकूब के लिए’ मूल की अभिव्यक्ति को स्पष्ट रखते हुए स्वाभाविक हिन्दी देता है।
