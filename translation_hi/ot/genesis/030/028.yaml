lexical_decisions:
- source_word: וַיֹּאמַר
  choice: तब उसने कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נָקְבָה
  choice: बता
  rationale: यहाँ נקב का अर्थ किसी राशि को स्पष्ट रूप से बताना या निर्धारित करना है। मज़दूरी के प्रसंग में ‘बता’ सहज और स्पष्ट है।
- source_word: שְׂכָרְךָ
  choice: अपनी मज़दूरी
  rationale: שָׂכָר श्रम के बदले मिलने वाली मज़दूरी या वेतन को दर्शाता है; याकूब और लाबान के कामकाजी संबंध में ‘मज़दूरी’ सर्वाधिक उपयुक्त है।
- source_word: עָלַי
  choice: अपनी मज़दूरी बता
  rationale: इस मुहावरे में शाब्दिक ‘मुझ पर’ वक्ता के सामने शर्त या राशि निर्धारित करने का भाव देता है। हिन्दी में ‘अपनी मज़दूरी बता’ उसी आशय को बिना अस्वाभाविक शब्दावली के व्यक्त करता है।
- source_word: וְאֶתֵּנָה
  choice: और मैं वह दे दूँगा
  rationale: נתן का मूल अर्थ ‘देना’ सुरक्षित रखा गया है। ‘वह’ एकवचन भाव वाली ‘मज़दूरी’ की ओर संकेत करता है, और ‘दे दूँगा’ वक्ता की प्रतिबद्धता को स्वाभाविक हिन्दी में व्यक्त करता है।
