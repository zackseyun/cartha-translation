  text: וְ/הַ/כְּשָׂבִים֮ הִפְרִ֣יד יַעֲקֹב֒ וַ֠/יִּתֵּן פְּנֵ֨י הַ/צֹּ֧אן אֶל עָקֹ֛ד וְ/כָל ח֖וּם בְּ/צֹ֣אן לָבָ֑ן וַ/יָּֽשֶׁת ל֤/וֹ עֲדָרִים֙ לְ/בַדּ֔/וֹ וְ/לֹ֥א שָׁתָ֖/ם עַל צֹ֥אן לָבָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/040.yaml
  text: And Jacob separated the lambs[a], and he set the faces of the flock toward the striped and all the dark-colored among Laban's flock. Then he set apart flocks for himself[c][b], and did not put them with Laban’s flock.
translation:
  language: hi
  text: याकूब ने मेमनों को अलग कर दिया। उसने झुंड का रुख लाबान के झुंड में धारीदार[a] और सभी गहरे रंग के[b] पशुओं की ओर कर दिया।[c] फिर उसने अपने लिए अलग-अलग झुंड रखे और उन्हें लाबान के झुंड के साथ नहीं रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लकीरदार’; इब्रानी शब्द पट्टियों या धारियों से चिह्नित पशुओं के लिए है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सभी भूरे रंग के पशुओं’।
    reason: lexical_alternative
  - marker: c
    text: ‘लाबान के झुंड में’ का अनुवाद ‘लाबान के झुंड से’ भी हो सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: הַכְּשָׂבִים
  choice: मेमनों
  rationale: כְּשָׂבִים सामान्यतः मेमनों या कम उम्र की भेड़ों को दर्शाता है; ‘मेमनों’ से व्यापक ‘भेड़ों’ की अपेक्षा इसकी विशिष्टता बनी रहती है।
- source_word: הִפְרִיד
  choice: अलग कर दिया
  rationale: פרד के हिफ़ील रूप का सीधा अर्थ अलग करना या पृथक करना है।
- source_word: פְּנֵי הַצֹּאן
  choice: झुंड का मुँह
  rationale: इब्रानी में शाब्दिक चित्र ‘झुंड के चेहरे’ का है और आशय पशुओं को एक दिशा की ओर करना है; हिन्दी में ‘झुंड का मुँह’ इस ठोस चित्र को स्वाभाविक रूप से बनाए रखता है।
- source_word: עָקֹד
  choice: धारीदार
  rationale: यह शब्द पट्टियों या धारियों के निशान वाले पशुओं को दर्शाता है; ‘धारीदार’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: כָל חוּם
  choice: सभी गहरे रंग के पशुओं
  rationale: חוּם भूरे अथवा गहरे रंग का बोध करा सकता है। ‘गहरे रंग के’ अनावश्यक रंग-विशिष्टता से बचता है, जबकि ‘भूरे’ को पादटिप्पणी में रखा गया है।
- source_word: בְּצֹאן לָבָן
  choice: लाबान के झुंड में
  rationale: ב का सामान्य स्थानवाचक अर्थ ‘में/के बीच’ है। प्रसंग के कारण ‘से उत्पन्न’ की सम्भावना पादटिप्पणी में दी गई है, ताकि मूल की अस्पष्टता दबाई न जाए।
- source_word: וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ
  choice: फिर उसने अपने लिए अलग झुंड बनाए
  rationale: यह वाक्यांश झुंडों को अपने लिए अलग समूहों के रूप में व्यवस्थित करने का भाव देता है; हिन्दी में यह अर्थ स्पष्ट और सहज है।
- source_word: וְלֹא שָׁתָם עַל צֹאן לָבָן
  choice: और उन्हें लाबान के झुंड के साथ नहीं रखा
  rationale: सर्वनाम अलग किए गए झुंडों की ओर संकेत करता है और עַל यहाँ साथ रखे जाने या संबद्धता का भाव देता है।
theological_decisions:
- issue: בְּצֹאן לָבָן में स्थान अथवा उद्गम का भाव
  choice: मुख्य पाठ में ‘लाबान के झुंड में’
  alternative: ‘लाबान के झुंड से उत्पन्न’
  rationale: स्थानवाचक अर्थ इब्रानी पूर्वसर्ग का सामान्य और निकटतम अर्थ है। फिर भी पिछले प्रसंग के कारण कुछ लोग इसे उद्गमसूचक मानते हैं; इसलिए इस वास्तविक व्याख्यात्मक तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘झुंड का मुँह’ मूल इब्रानी की ठोस छवि को बनाए रखता है, जबकि छोटे वाक्यों से जटिल पशुपालन-वर्णन समझने में सहज होता है।
