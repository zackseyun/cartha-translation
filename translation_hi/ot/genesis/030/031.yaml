base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/031.yaml
  text: And he said[a], “What shall I give you?” And Jacob said, “You shall not give me anything. If you will do this thing for me, I will again pasture your flock and keep it.”
translation:
  language: hi
  text: उसने कहा, “मैं तुझे क्या दूँ?” याकूब ने कहा, “तू मुझे कुछ भी न दे। यदि तू मेरे लिए यह काम कर दे, तो मैं फिर[a] तेरे झुंड को चराऊँगा और उसकी रखवाली करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं लौटकर तेरे झुंड को चराऊँगा और उसकी रखवाली करूँगा।” इब्रानी क्रिया का अर्थ लौटना अथवा काम फिर से आरम्भ करना—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶתֶּן לָךְ
  choice: मैं तुझे क्या दूँ?
  rationale: प्रश्न में दिए जाने वाले प्रतिफल के विषय में पूछा गया है; यह आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: לֹא תִתֶּן לִי מְאוּמָה
  choice: तू मुझे कुछ भी न दे
  rationale: नकार के साथ מְאוּמָה का अर्थ ‘कुछ भी’ है; निषेधात्मक रूप याकूब द्वारा प्रतिफल ठुकराने की स्पष्टता बनाए रखता है।
- source_word: אִם תַּעֲשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: यदि तू मेरे लिए यह काम कर दे
  rationale: यह प्रस्ताव की शर्त को व्यक्त करता है और ‘यह काम’ मूल के הַדָּבָר הַזֶּה को सहज हिन्दी में दर्शाता है।
- source_word: אָשׁוּבָה
  choice: मैं फिर
  rationale: सन्दर्भ में क्रिया सेवा को दोबारा आरम्भ करने का भाव दे सकती है; ‘फिर’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘लौटकर’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: אֶרְעֶה צֹאנְךָ
  choice: तेरे झुंड को चराऊँगा
  rationale: רעה पशुओं को चराने और उनकी चरवाही करने को दर्शाता है; צֹאן भेड़-बकरियों के सामूहिक झुंड के लिए प्रयुक्त है।
- source_word: אֶשְׁמֹר
  choice: उसकी रखवाली करूँगा
  rationale: שׁמר यहाँ झुंड की सुरक्षा और निगरानी का भाव रखता है; ‘रखवाली’ इस पूरक अर्थ को स्पष्ट करता है।
