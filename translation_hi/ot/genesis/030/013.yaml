    text: “आशेर” नाम हिब्रू में “सुखी” और “सुखी कहना” वाले शब्दों के साथ शब्द-क्रीड़ा करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “बेटियाँ”; हिब्रू में “बेटियाँ” शब्द स्त्रियों के लिए सामान्य अर्थ में भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָשְׁרִי
  choice: मैं कितनी सुखी हूँ!
  rationale: यह पदबंध लिआ के सुख या सौभाग्य का विस्मयपूर्ण कथन है। यह स्वाभाविक आधुनिक हिन्दी है और आगे के क्रियापद तथा ‘आशेर’ नाम के साथ शब्द-संबंध बनाए रखता है।
- source_word: אִשְּׁרוּנִי
  choice: मुझे सुखी कहेंगी
  rationale: पिएल रूप का अर्थ किसी को सुखी या धन्य घोषित करना है। ‘सुखी कहेंगी’ בְּאָשְׁרִי के साथ शब्द-संबंध को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בָּנוֹת
  choice: स्त्रियाँ
  rationale: शाब्दिक अर्थ ‘बेटियाँ’ है, पर यहाँ बहुवचन का प्रयोग व्यापक रूप से स्त्रियों के लिए मुहावरेदार है; इसलिए प्रसंगानुकूल स्वाभाविक हिन्दी में ‘स्त्रियाँ’ चुना गया है।
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  choice: इसलिए उसने उसका नाम आशेर रखा
  rationale: हिब्रू नामकरण सूत्र का हिन्दी में स्वाभाविक और अर्थनिष्ठ रूप; ‘इसलिए’ कथन और नामकरण का परिणाम-संबंध दिखाता है।
- source_word: אָשֵׁר
  choice: आशेर
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है; उसका अर्थ और शब्द-क्रीड़ा पादटिप्पणी में स्पष्ट की गई है।
