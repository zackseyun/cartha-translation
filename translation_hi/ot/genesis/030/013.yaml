  text: तब लिआ ने कहा, “मैं कितनी सुखी हूँ![a] क्योंकि स्त्रियाँ[b] मुझे सुखी कहेंगी।” तब उसने उसका नाम आशेर रखा।
  philosophy: optimal-equivalence
  footnotes:
