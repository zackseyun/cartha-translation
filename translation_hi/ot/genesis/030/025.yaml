  text: जब राहेल यूसुफ को जन्म दे चुकी थी, तब याकूब ने लाबान से कहा, “मुझे विदा कर, ताकि मैं अपने स्थान और अपने देश लौट जाऊँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: मुझे विदा कर
  rationale: हिब्रू क्रिया का अर्थ यहाँ किसी के अधिकार या सेवा से जाने की अनुमति देकर विदा करना है; यह स्वाभाविक हिन्दी में उस भाव को स्पष्ट रखता है।
- source_word: מְקוֹמִי
  choice: अपने स्थान
  rationale: शाब्दिक अर्थ ‘मेरा स्थान’ है। प्रसंग में अपना घर या निवास-क्षेत्र निहित हो सकता है, पर मूल की व्यापकता बनाए रखने के लिए ‘अपने स्थान’ रखा गया है।
- source_word: אַרְצִי
  choice: अपने देश
  rationale: אֶרֶץ यहाँ याकूब की अपनी भूमि/देश को सूचित करता है; ‘देश’ आधुनिक हिन्दी में सहज और प्रसंगानुकूल है।
