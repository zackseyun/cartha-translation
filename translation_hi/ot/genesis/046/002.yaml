base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/002.yaml
  text: And God spoke to Israel in visions of the night and said[a], “Jacob, Jacob.” And he said[b], “Here I am.”
translation:
  language: hi
  text: रात के दर्शनों में परमेश्वर ने इस्राएल से कहा, “याकूब, याकूब।” उसने कहा, “मैं यहाँ हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: बात की और कहा / कहा
  rationale: पहले दो प्रयोग मिलकर दिव्य वाणी और उसके सीधे संबोधन का परिचय देते हैं। हिंदी में ‘बात की और कहा’ मूल की पुनरावृत्ति को स्वाभाविक ढंग से बनाए रखता है; अंतिम प्रयोग के लिए साधारण ‘कहा’ पर्याप्त है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में यह शब्द एकवचन अर्थ में इस्राएल के परमेश्वर के लिए प्रयुक्त है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल से
  rationale: वर्णन में मूल पाठ स्पष्ट रूप से ‘इस्राएल’ नाम रखता है; इसे आगे के ‘याकूब’ के साथ समरूप नहीं किया गया।
- source_word: בְּמַרְאֹת הַלַּיְלָה
  choice: रात के दर्शनों में
  rationale: यह अनुवाद बहुवचन ‘दर्शनों’ और रात के समय—दोनों को सुरक्षित रखते हुए आधुनिक हिंदी में सहज है।
- source_word: יַעֲקֹב יַעֲקֹב
  choice: याकूब! याकूब!
  rationale: नाम की पुनरावृत्ति ज्यों की त्यों रखी गई है; विस्मयादिबोधक चिह्न संबोधन की प्रबलता दिखाते हैं।
- source_word: הִנֵּנִי
  choice: मैं यहाँ हूँ
  rationale: यह उपस्थित होने और प्रत्युत्तर देने की तत्परता व्यक्त करने वाला स्वाभाविक हिंदी रूप है।
theological_decisions:
- issue: इस्राएल और याकूब नामों का क्रमिक प्रयोग
  choice: वर्णन में ‘इस्राएल’ और सीधे संबोधन में ‘याकूब’ रखा गया
  alternative: पूरे पद में केवल ‘याकूब’ या केवल ‘इस्राएल’ करना
  rationale: मूल इब्रानी जानबूझकर दोनों नामों का प्रयोग करता है। इस अंतर को बनाए रखने से उसका साहित्यिक और धर्मवैचारिक तनाव बिना अतिरिक्त व्याख्या के सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल के दोहरे वाणी-सूचक ढाँचे को यथासंभव स्वाभाविक हिंदी में सुरक्षित रखा गया है।
