  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah; and Serah their sister[b]. And the sons of Beriah: Heber and Malchiel.'
translation:
  language: hi
  text: 'आशेर के पुत्र: यिम्ना, यिश्वा, यिश्वी और बरीआ; और उनकी बहन सेरह[a]। बरीआ के पुत्र: हेबेर और मल्कीएल।'
  philosophy: optimal-equivalence
  footnotes:
