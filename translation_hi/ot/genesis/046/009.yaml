  text: 'And the sons of Reuben: Hanoch[a], Pallu, Hezron, and Carmi.'
translation:
  language: hi
  text: 'और रूबेन के पुत्र: हनोक, पल्लू, हेस्रोन और कर्मी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: और ... के पुत्र ये थे
  rationale: ו को वंशावली की पिछली सूची से जोड़ने के लिए ‘और’ से व्यक्त किया गया है। בְנֵי का अर्थ ‘के पुत्र’ है; नामों की सूची आरम्भ करने के लिए हिन्दी में ‘ये थे’ स्वाभाविक और स्पष्ट है।
- source_word: רְאוּבֵן
  choice: रूबेन
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी बाइबल-परंपरा में प्रचलित लिप्यंतरण।
- source_word: חֲנוֹךְ
  choice: हनोक
  rationale: इब्रानी नाम का निकट और हिन्दी में प्रचलित लिप्यंतरण; इसी नाम को कुछ परंपराओं में ‘हनोक’ से भिन्न रूप में भी प्रस्तुत किया जाता है, इसलिए स्रोत-रूप को प्राथमिकता दी गई है।
- source_word: וּ/פַלּוּא
  choice: पल्लू
  rationale: इब्रानी פַלּוּא का निकट देवनागरी लिप्यंतरण; आरम्भिक संयोजक को हिन्दी सूची की संरचना में समाहित किया गया है।
- source_word: וְ/חֶצְרוֹן
  choice: हेस्रोन
  rationale: इब्रानी חֶצְרוֹן का ऐसा लिप्यंतरण जो आरम्भिक ח को ‘ह’ और צ को ‘स’ के निकट हिन्दी रूप में प्रस्तुत करता है; संयोजक सूची-विन्यास में समाहित है।
- source_word: וְ/כַרְמִי
  choice: कर्मी
  rationale: इब्रानी व्यक्तिगत नाम का निकट हिन्दी लिप्यंतरण; इसके पहले का וְ अंतिम ‘और’ से व्यक्त किया गया है।
