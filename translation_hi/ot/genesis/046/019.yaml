  text: 'याकूब की पत्नी राहेल के बेटे: यूसुफ और बिन्यामीन।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: बेटे
  rationale: यह construct plural सीधे राहेल के दो पुत्रों को सूचित करता है; वंशावली के इस प्रसंग में ‘बेटे’ स्वाभाविक और सटीक है।
- source_word: רָחֵל
  choice: राहेल
  rationale: हिब्रू व्यक्तिनाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: אֵשֶׁת
  choice: पत्नी
  rationale: याकूब के साथ construct संबंध में इसका अर्थ स्पष्ट रूप से ‘पत्नी’ है, केवल ‘स्त्री’ नहीं।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: हिब्रू व्यक्तिनाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: हिब्रू व्यक्तिनाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: וּ/בִנְיָמִן
  choice: और बिन्यामीन
  rationale: संयोजक וּ को ‘और’ तथा व्यक्तिनाम को हिन्दी में प्रचलित बाइबलीय रूप ‘बिन्यामीन’ से व्यक्त किया गया है।
