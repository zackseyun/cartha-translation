translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पशुधन की दोनों इब्रानी श्रेणियों—צֹאן और בָּקָר—को क्रमशः ‘भेड़-बकरियाँ’ और ‘गाय-बैल’ कहकर सामान्य पाठक के लिए स्पष्ट किया गया है। इब्रानी पूर्ण क्रियाओं की वर्तमान-संबद्धता को ‘रहे हैं’ और ‘लाए हैं’ से व्यक्त किया गया है; यहाँ काल-संबंधी विकल्प अर्थ में इतना बड़ा अंतर नहीं लाता कि पाद-टिप्पणी आवश्यक हो।
