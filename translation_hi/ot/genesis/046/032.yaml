id: GEN.46.32
reference: Genesis 46:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָ/אֲנָשִׁים֙ רֹ֣עֵי צֹ֔אן כִּֽי אַנְשֵׁ֥י מִקְנֶ֖ה הָי֑וּ וְ/צֹאנָ֧/ם וּ/בְקָרָ֛/ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֖ם הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/032.yaml
  text: The men are shepherds[a], for they have been keepers of livestock, and they have brought their flocks and their herds and all that they have.
translation:
  language: hi
  text: वे लोग भेड़-बकरियों के चरवाहे हैं, क्योंकि वे पशुपालक रहे हैं; और वे अपनी भेड़-बकरियाँ, गाय-बैल और अपना सब कुछ साथ लाए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: वे लोग
  rationale: संदर्भ में पहले से उल्लिखित यूसुफ के भाइयों और पिता के घराने के पुरुषों की ओर संकेत है। हिन्दी में वाक्य के आरम्भ में संयोजक को न दोहराना स्वाभाविक है।
- source_word: רֹעֵי צֹאן
  choice: भेड़-बकरियों के चरवाहे
  rationale: צֹאן छोटे पालतू पशुओं, विशेषतः भेड़ों और बकरियों, का सामूहिक बोध कराता है; यह हिन्दी पाठक के लिए केवल ‘भेड़’ से अधिक स्पष्ट है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनके चरवाहे होने का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: אַנְשֵׁי מִקְנֶה
  choice: पशुपालक
  rationale: शाब्दिक ‘पशुधन के पुरुष’ के बजाय यह उनके स्थापित व्यवसाय को सहज और सटीक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָיוּ
  choice: रहे हैं
  rationale: इब्रानी पूर्ण क्रिया उनके अब तक चले आ रहे स्थापित व्यवसाय को व्यक्त कर सकती है; हिन्दी का पूर्ण वर्तमान इस वर्तमान-संबद्धता को स्वाभाविक रूप से दर्शाता है।
- source_word: וְצֹאנָם
  choice: अपनी भेड़-बकरियाँ
  rationale: צֹאן का सामूहिक अर्थ छोटे पशुधन से है, जिसमें सामान्यतः भेड़ें और बकरियाँ दोनों सम्मिलित हैं।
- source_word: וּבְקָרָם
  choice: गाय-बैल
  rationale: בָּקָר गोवंश का सामूहिक शब्द है; ‘गाय-बैल’ आधुनिक हिन्दी में इस वर्ग को स्पष्टतः व्यक्त करता है।
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: अपना सब कुछ
  rationale: यह उनकी समस्त संपत्ति को समावेशी और सहज हिन्दी में व्यक्त करता है।
- source_word: הֵבִיאוּ
  choice: साथ लाए हैं
  rationale: पूर्ण क्रिया मिस्र में उनके आगमन से पूर्ण हुई ऐसी क्रिया बताती है जिसका परिणाम वर्तमान स्थिति में बना हुआ है; ‘साथ’ हिन्दी में वस्तुओं को अपने साथ लाने का निहित अर्थ स्वाभाविक करता है।
