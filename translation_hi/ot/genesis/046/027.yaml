reference: Genesis 46:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְנֵ֥י יוֹסֵ֛ף אֲשֶׁר יֻלַּד ל֥/וֹ בְ/מִצְרַ֖יִם נֶ֣פֶשׁ שְׁנָ֑יִם כָּל הַ/נֶּ֧פֶשׁ לְ/בֵֽית יַעֲקֹ֛ב הַ/בָּ֥אָה מִצְרַ֖יְמָ/ה שִׁבְעִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/027.yaml
  text: And the sons of Joseph who were born to him in Egypt were two persons[b][a]. All the persons of the house of Jacob who came to Egypt were seventy.
translation:
  language: hi
  text: और यूसुफ के जो पुत्र मिस्र में उसके यहाँ जन्मे थे, वे दो जन थे। याकूब के घराने के जितने जन मिस्र आए, वे कुल सत्तर थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יוֹסֵף
  choice: और यूसुफ के ... पुत्र
  rationale: בְּנֵי यहाँ यूसुफ की पहले उल्लिखित पुरुष संतान को दर्शाता है; इसलिए ‘पुत्र’ सटीक है। וּ को ‘और’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: जो ... उसके यहाँ जन्मे थे
  rationale: יֻלַּד का निष्क्रिय भाव और לוֹ का संबंध स्वाभाविक आधुनिक हिन्दी में ‘उसके यहाँ जन्मे थे’ से व्यक्त होता है।
- source_word: בְמִצְרַיִם
  choice: मिस्र में
  rationale: स्थानसूचक בְּ का सीधा और स्वाभाविक अनुवाद।
- source_word: נֶפֶשׁ שְׁנָיִם
  choice: वे दो जन थे
  rationale: वंशावली की गणना में נֶפֶשׁ का अर्थ व्यक्ति है; ‘जन’ गणना का भाव रखता है और ‘प्राण/आत्मा’ से उत्पन्न अनावश्यक धर्मवैज्ञानिक अर्थ से बचाता है।
- source_word: כָּל הַנֶּפֶשׁ
  choice: जितने जन ... वे कुल
  rationale: एकवचन נֶפֶשׁ यहाँ सामूहिक गणना-सूचक है। हिन्दी में ‘जितने जन ... वे कुल’ अर्थ और वाक्य-प्रवाह दोनों को स्वाभाविक बनाता है।
- source_word: לְבֵית יַעֲקֹב
  choice: याकूब के घराने के
  rationale: בֵּית יַעֲקֹב पारिवारिक-सामूहिक इकाई को दर्शाता है; ‘घराना’ आधुनिक हिन्दी में इस अर्थ को स्पष्ट रखता है।
- source_word: הַבָּאָה מִצְרַיְמָה
  choice: मिस्र आए
  rationale: הַבָּאָה का सामूहिक कृदन्त-संबंध और दिशासूचक ה को स्वाभाविक हिन्दी में ‘मिस्र आए’ से व्यक्त किया गया है।
- source_word: שִׁבְעִים
  choice: सत्तर थे
  rationale: इब्रानी की क्रियारहित गणना-वाक्य रचना का संक्षिप्त हिन्दी समतुल्य।
theological_decisions:
- issue: वंशावली की गणना में נֶפֶשׁ का अनुवाद
  choice: जन
  alternative: प्राण / व्यक्ति
  rationale: यहाँ शब्द परिवार के सदस्यों की संख्या बताता है, मनुष्य की आत्मिक संरचना पर कोई कथन नहीं करता। ‘जन’ गणना-संदर्भ में स्वाभाविक और धर्मवैज्ञानिक रूप से तटस्थ है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘घराना’ पारिवारिक-सामूहिक अर्थ रखता है और ‘दो जन’ मूल के गणना-सूचक נֶפֶשׁ को स्पष्ट रूप से दर्शाता है।
