base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/029.yaml
  text: Then Joseph harnessed his chariot and went up to meet Israel his father in Goshen[a]. He appeared before him, fell on his neck[b], and wept on his neck for a long time.
translation:
  language: hi
  text: तब यूसुफ ने अपना रथ जोता और अपने पिता इस्राएल से मिलने गोशेन गया। वह उनके सामने उपस्थित हुआ,[a] उनके गले से लिपट गया और बहुत देर तक उनके गले लगकर रोता रहा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “वह उनके सामने दिखाई दिया” या “उसने अपने आपको उन्हें दिखाया” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके गले पर रोया, और भी।” यहाँ अंतिम शब्द निरंतर या लंबे समय तक रोते रहने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר
  choice: जुतवाया
  rationale: क्रिया का मूल अर्थ ‘बाँधना’ है; रथ के साथ यह उसे यात्रा के लिए घोड़ों से जुतवाने का बोध देती है। हिंदी में ‘रथ जुतवाया’ स्वाभाविक और ठोस है।
- source_word: מֶרְכַּבְתּוֹ
  choice: अपना रथ
  rationale: संदर्भ में संज्ञा का सीधा अर्थ यूसुफ का रथ है।
- source_word: וַיַּעַל
  choice: गया
  rationale: मूलतः ‘ऊपर गया’ है, पर आधुनिक हिंदी में गोशेन की ओर यात्रा के लिए केवल ‘गया’ अधिक स्वाभाविक है और अनावश्यक भौगोलिक संकेत नहीं जोड़ता।
- source_word: לִקְרַאת יִשְׂרָאֵל אָבִיו
  choice: अपने पिता इस्राएल से मिलने
  rationale: प्रयोजन ‘मिलने’ से स्पष्ट होता है और मूल पाठ का नाम ‘इस्राएल’ बनाए रखा गया है।
- source_word: גֹּשְׁנָה
  choice: गोशेन
  rationale: दिशासूचक प्रत्यय गोशेन की ओर गति बताता है; हिंदी वाक्य में ‘मिलने गोशेन गया’ यह दिशा स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיֵּרָא אֵלָיו
  choice: उसने अपने पिता के सामने अपने आपको प्रकट किया
  rationale: निफ़अल रूप का शाब्दिक भाव ‘उसके सामने दिखाई दिया/अपने को प्रकट किया’ है। यह अनुवाद व्यक्तिगत पुनर्मिलन को व्यक्त करते हुए क्रिया की वास्तविक अस्पष्टता को फुटनोट में सुरक्षित रखता है।
- source_word: וַיִּפֹּל עַל צַוָּארָיו
  choice: उनके गले से लिपट गया
  rationale: शाब्दिक ‘उनकी गर्दन पर गिर पड़ा’ एक इब्रानी भावप्रयोग है। हिंदी में ‘गले से लिपट गया’ उसी भावुक आलिंगन को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיֵּבְךְּ עַל צַוָּארָיו עוֹד
  choice: बहुत देर तक उनके गले लगकर रोता रहा
  rationale: दोहराया गया शारीरिक चित्र और עוֹד का निरंतरता/अवधि का भाव आधुनिक हिंदी में स्वाभाविक ढंग से व्यक्त होता है।
