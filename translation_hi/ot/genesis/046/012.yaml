source:
  edition: WLC
  text: וּ/בְנֵ֣י יְהוּדָ֗ה עֵ֧ר וְ/אוֹנָ֛ן וְ/שֵׁלָ֖ה וָ/פֶ֣רֶץ וָ/זָ֑רַח וַ/יָּ֨מָת עֵ֤ר וְ/אוֹנָן֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יִּהְי֥וּ בְנֵי פֶ֖רֶץ חֶצְר֥וֹן וְ/חָמֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/012.yaml
  text: And the sons of Judah were Er[a], Onan, Shelah, Perez, and Zerah. But Er and Onan died in the land of Canaan. And the sons of Perez were Hezron and Hamul.
translation:
  language: hi
  text: 'और यहूदा के पुत्र थे: एर, ओनान, शेला, पेरेस और जेरह। पर एर और ओनान कनान देश में मर गए। और पेरेस के पुत्र हेस्रोन और हामूल थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה
  choice: और यहूदा के पुत्र
  rationale: संयोजक וּ genealogical सूची को पिछले संदर्भ से जोड़ता है; construct phrase को स्वाभाविक और निकट अर्थ में रखा गया है।
- source_word: עֵר וְאוֹנָן וְשֵׁלָה וָפֶרֶץ וָזָרַח
  choice: एर, ओनान, शेला, पेरेस और जेरह
  rationale: व्यक्तिनामों को प्रचलित आधुनिक हिन्दी बाइबलीय रूपों में लिप्यंतरित किया गया है।
- source_word: וַיָּמָת
  choice: मर गए
  rationale: क्रिया रूपतः एकवचन है, पर वह संयुक्त कर्ता ‘एर और ओनान’ से पहले आया है; यह सामान्य इब्रानी रचना है। हिन्दी में बहुवचन ‘मर गए’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: कनान देश में
  rationale: इब्रानी में व्यक्त ‘देश/भूमि’ को बनाए रखते हुए हिन्दी का स्वाभाविक पदक्रम अपनाया गया है।
- source_word: וַיִּהְיוּ בְנֵי פֶרֶץ
  choice: और पेरेस के पुत्र ... थे
  rationale: वंशावली के संदर्भ में היה पहचान बताता है; ‘थे’ हिन्दी में इसका सीधा और स्वाभाविक समतुल्य है।
- source_word: חֶצְרוֹן וְחָמוּל
  choice: हेस्रोन और हामूल
  rationale: दोनों व्यक्तिनामों का इब्रानी उच्चारण के निकट, हिन्दी-पठनीय लिप्यंतरण किया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। वंशावली की पुनरावृत्तिमूलक संरचना और इब्रानी के स्पष्ट संबंधसूचक पदों को बनाए रखा गया है; संयुक्त कर्ता के साथ इब्रानी एकवचन क्रिया को हिन्दी में स्वाभाविक बहुवचन बनाया गया है।
