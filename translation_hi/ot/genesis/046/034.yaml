id: GEN.46.34
reference: Genesis 46:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֗ם אַנְשֵׁ֨י מִקְנֶ֜ה הָי֤וּ עֲבָדֶ֨י/ךָ֙ מִ/נְּעוּרֵ֣י/נוּ וְ/עַד עַ֔תָּה גַּם אֲנַ֖חְנוּ גַּם אֲבֹתֵ֑י/נוּ בַּ/עֲב֗וּר תֵּשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן כִּֽי תוֹעֲבַ֥ת מִצְרַ֖יִם כָּל רֹ֥עֵה צֹֽאן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/034.yaml
  text: then you shall say[a], ‘Your servants have been men of livestock from our youth until now, both we and our fathers,’ so that you may live in the land of Goshen[b], for every shepherd is detestable to the Egyptians.
translation:
  language: hi
  text: तब तुम कहना, ‘आपके सेवक बचपन से लेकर आज तक पशुपालक रहे हैं—हम भी और हमारे पिता भी,’ ताकि तुम गोशेन प्रदेश में रह सको, क्योंकि मिस्रियों को हर भेड़-बकरी का चरवाहा घृणित लगता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: तब तुम कहना
  rationale: पूर्ववर्ती निर्देश के क्रम और निर्देशात्मक बल, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אַנְשֵׁי מִקְנֶה
  choice: पशुपालक
  rationale: यह पशुधन पालने के व्यवसाय को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे केवल गाय-बैल या केवल भेड़ों तक सीमित किए।
- source_word: עֲבָדֶיךָ
  choice: आपके सेवक
  rationale: फ़िरौन के सामने विनम्र आत्म-संबोधन है; यहाँ बंधुआ दास होने पर बल नहीं है।
- source_word: מִנְּעוּרֵינוּ וְעַד עַתָּה
  choice: बचपन से लेकर आज तक
  rationale: आरंभिक जीवन से वर्तमान समय तक निरंतरता का सहज हिन्दी रूप।
- source_word: גַּם אֲנַחְנוּ גַּם אֲבֹתֵינוּ
  choice: हम भी और हमारे पूर्वज भी
  rationale: दोहराए गए גַּם का पीढ़ियों के बीच निरंतरता पर दिया गया बल बनाए रखता है; ‘पूर्वज’ आधुनिक हिन्दी में यहाँ व्यापक वंशगत अर्थ स्पष्ट करता है।
- source_word: בַּעֲבוּר
  choice: ऐसा कहना ताकि
  rationale: वाक्य में निहित प्रयोजन को स्पष्ट करता है और हिन्दी में संबंध को अस्पष्ट नहीं रहने देता।
- source_word: תֵּשְׁבוּ
  choice: रह सको
  rationale: गोशेन में निवास करने/बसने की अनुमति या परिणति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: गोशेन प्रदेश में
  rationale: אֶרֶץ को केवल छोड़ने के बजाय ‘प्रदेश’ से व्यक्त किया गया है, जो इस भौगोलिक संदर्भ में स्वाभाविक है।
- source_word: תוֹעֲבַת מִצְרַיִם
  choice: मिस्रियों की दृष्टि में घृणित
  rationale: हिब्रू की प्रबल नकारात्मक धारणा को स्पष्ट रखता है और construct संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל רֹעֵה צֹאן
  choice: हर भेड़-बकरी चरानेवाला
  rationale: צֹאן छोटे पालतू पशुओं के झुंड, विशेषतः भेड़-बकरियों, को सूचित कर सकता है; यह केवल सामान्य ‘चरवाहा’ से अधिक स्रोत-स्पष्ट है।
theological_decisions:
- issue: תוֹעֵבָה की तीव्रता और प्रकृति
  choice: घृणित
  alternative: अशुद्ध / घृणा की वस्तु
  rationale: पाठ मिस्रियों की सामाजिक-सांस्कृतिक घृणा बताता है; ‘अशुद्ध’ कहने से अनावश्यक रूप से विशिष्ट धार्मिक या अनुष्ठानिक अर्थ आयात हो सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। फ़िरौन के लिए आदरसूचक ‘आपके’ और यूसुफ के भाइयों के लिए बहुवचन ‘तुम’ रखा गया है। स्रोत की स्पष्टता के लिए צֹאן को ‘भेड़-बकरी’ से व्यक्त किया गया है।
