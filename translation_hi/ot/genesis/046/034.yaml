review_pass:
  verdict: revise
  source_fidelity: The draft conveys the directive, the livestock occupation, the purpose of settlement in Goshen, and the Egyptians’ strong aversion accurately. However, אֲבֹתֵינוּ specifically means “our fathers,” not the broader “our ancestors/forebears”; this should be retained. The purpose clause can also be attached directly to the instruction without the redundant “ऐसा कहना.”
  naturalness: The register is generally modern and dignified. “तब तुम कहना” is idiomatic in direct instruction. Revising the final clause to “मिस्रियों को ... घृणित लगता है” gives a more natural Hindi predicative expression while retaining the Hebrew sense.
  terminology: “पशुपालक” suitably renders אַנְשֵׁי מִקְנֶה, “सेवक” appropriately retains deferential court language, and “गोशेन प्रदेश” preserves “land of Goshen.” “भेड़-बकरी का चरवाहा” naturally represents רֹעֵה צֹאן without reducing the flock term to sheep alone.
  issues:
  - severity: medium
    issue: “हमारे पूर्वज” broadens the Hebrew term אֲבֹתֵינוּ.
    rationale: The Hebrew explicitly says “our fathers.” Although “पूर्वज” is natural Hindi, it can include more distant ancestors and loses the source’s immediate paternal/generational wording.
  - severity: low
    issue: The phrase “ऐसा कहना ताकि” is redundant after the quoted instruction.
    rationale: The purpose relation introduced by בַּעֲבוּר is clear and more direct in Hindi as “ताकि तुम ... रह सको.”
  - severity: low
    issue: “हर भेड़-बकरी चरानेवाला मिस्रियों की दृष्टि में घृणित है” is somewhat stiff.
    rationale: “मिस्रियों को हर भेड़-बकरी का चरवाहा घृणित लगता है” is more idiomatic while preserving the same predicative force and intensity.
  revised_text: तब तुम कहना, ‘आपके सेवक बचपन से लेकर आज तक पशुपालक रहे हैं—हम भी और हमारे पिता भी,’ ताकि तुम गोशेन प्रदेश में रह सको, क्योंकि मिस्रियों को हर भेड़-बकरी का चरवाहा घृणित लगता है।
