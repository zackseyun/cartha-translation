base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/001.yaml
  text: So Israel set out with all that belonged to him and came to Beersheba[a], and he offered sacrifices to the God of his father Isaac.
translation:
  language: hi
  text: इस्राएल अपने साथ वह सब लेकर चल पड़ा जो उसका था, और बेर्शेबा पहुँचा। फिर उसने अपने पिता इसहाक के परमेश्वर को बलिदान चढ़ाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע
  choice: चल पड़ा
  rationale: यह क्रिया पड़ाव उठाकर यात्रा आरम्भ करने का भाव देती है; ‘चल पड़ा’ आधुनिक हिन्दी में स्वाभाविक रूप से वही अर्थ व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ में ‘याकूब’ के बजाय वाचा का नाम ‘इस्राएल’ है, इसलिए उसी कथात्मक चुनाव को रखा गया है।
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: जो कुछ उसका था, वह सब
  rationale: यह व्यापक अभिव्यक्ति उसके घराने के लोगों और संपत्ति दोनों को समेट सकती है; अनुवाद इसे केवल भौतिक वस्तुओं तक सीमित नहीं करता।
- source_word: וַיָּבֹא בְּאֵרָה שָּׁבַע
  choice: बेर्शेबा पहुँचा
  rationale: दिशासूचक रूप को गंतव्य तक पहुँचने के स्वाभाविक हिन्दी कथन से व्यक्त किया गया है।
- source_word: וַיִּזְבַּח זְבָחִים
  choice: बलिदान चढ़ाए
  rationale: इब्रानी की सजातीय क्रिया-संज्ञा रचना का शब्दशः दोहराव हिन्दी में अस्वाभाविक होता; ‘बलिदान चढ़ाए’ उपासना के प्रसंग में प्रचलित और अर्थसंगत है।
- source_word: לֵאלֹהֵי אָבִיו יִצְחָק
  choice: अपने पिता इसहाक के परमेश्वर को
  rationale: ‘को’ बलिदान पाने वाले को स्पष्ट करता है, और मूल पाठ के विशिष्ट पितृवंशीय उल्लेख—इसहाक—को यथावत रखता है।
theological_decisions:
- issue: परमेश्वर की पहचान केवल ‘उसके पिता इसहाक के परमेश्वर’ के रूप में
  choice: अपने पिता इसहाक के परमेश्वर
  alternative: उसके पूर्वजों के परमेश्वर
  rationale: मूल इब्रानी विशेष रूप से इसहाक का नाम लेता है। इसे बहुवचन ‘पूर्वजों’ में सामान्य बनाना या अन्य कुलपिताओं को जोड़ना पाठ की विशिष्टता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चल पड़ा’ यात्रा आरम्भ करने का भाव देता है, जबकि दो वाक्यों का विन्यास इब्रानी कथानक की क्रमिक क्रियाओं को साफ और स्वाभाविक हिन्दी में प्रस्तुत करता है।
