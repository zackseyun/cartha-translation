revisions:
- from: ये ज़िल्पा के बेटे हैं, जिसे लाबान ने अपनी बेटी लिआ को दिया था। ज़िल्पा से याकूब के लिए ये सोलह जन उत्पन्न हुए।[a]
  to: ये ज़िल्पा के बेटे हैं, जिसे लाबान ने अपनी बेटी लिआ को दिया था; और उसने याकूब के लिए इन सोलह जनों को जन्म दिया।[a]
  rationale: The revision preserves the Hebrew clause structure by retaining Zilpah as the subject of 'gave birth' and keeps the total as sixteen persons. It also removes the awkward passive-like expression 'ज़िल्पा से ... उत्पन्न हुए.' The conventional Hindi genealogical phrasing 'याकूब के लिए ... जन्म दिया' represents the Hebrew paternal dative, though it necessarily uses an idiomatic construction.
  reviewer_model: gpt-5.6-terra
