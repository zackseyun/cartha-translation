- source_word: אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  choice: जिसे लाबान ने अपनी बेटी लिआ को दिया था
  rationale: संबंधवाचक उपवाक्य ज़िल्पा को विशेषित करता है; ‘अपनी बेटी’ हिंदी में संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: ज़िल्पा से याकूब के लिए ये ... उत्पन्न हुए
  rationale: हिब्रू जन्म-सूत्र का आशय स्वाभाविक हिंदी में व्यक्त किया गया है। स्त्रीलिंग कर्ता की अस्पष्टता से बचने के लिए नाम दोहराया गया है, और לְיַעֲקֹב को ‘याकूब के लिए’ रखा गया है।
- source_word: שֵׁשׁ עֶשְׂרֵה נָפֶשׁ
