lexical_decisions:
- source_word: וּ/בְנֵי
  choice: और ... के पुत्र
  rationale: וּ को सूची की निरंतरता दिखाने के लिए ‘और’ तथा בְּנֵי को वंशावली के स्वाभाविक और सीधे अर्थ में ‘के पुत्र’ किया गया है।
- source_word: יִשָׂשכָר
  choice: इस्साकार
  rationale: व्यक्तिवाचक नाम का आधुनिक हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: תּוֹלָע
  choice: तोला
  rationale: वंशावली में आए व्यक्तिवाचक नाम का निकट देवनागरी लिप्यंतरण।
- source_word: וּ/פֻוָּה
  choice: पुव्वा
  rationale: मसोरेटिक स्वरांकन פֻוָּה में सुनाई देने वाले द्वित्वयुक्त व् को सुरक्षित रखते हुए देवनागरी लिप्यंतरण किया गया है; ‘पूआ’ एक प्रचलित वैकल्पिक रूप है।
- source_word: וְ/יוֹב
  choice: योब
  rationale: वर्तमान पद के मसोरेटिक पाठ יוֹב को सीधे लिप्यंतरित किया गया है; इसे अय्यूब की पुस्तक के नाम ‘अय्यूब’ से नहीं मिलाया गया।
- source_word: וְ/שִׁמְרוֹן
  choice: और शिम्रोन
  rationale: संयोजक וְ को ‘और’ के रूप में रखा गया और नाम का निकट देवनागरी लिप्यंतरण किया गया है।
