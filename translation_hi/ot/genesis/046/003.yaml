  edition: WLC
  text: וַ/יֹּ֕אמֶר אָנֹכִ֥י הָ/אֵ֖ל אֱלֹהֵ֣י אָבִ֑י/ךָ אַל תִּירָא֙ מֵ/רְדָ֣ה מִצְרַ֔יְמָ/ה כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִֽׂימְ/ךָ֥ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/003.yaml
  text: And he said[a], “I am God, the God of your father. Do not be afraid to go down to Egypt, for there I will make you into a great nation.”
translation:
  language: hi
  text: और उसने कहा, “मैं परमेश्वर हूँ, तेरे पिता का परमेश्वर। मिस्र की ओर नीचे उतरने से मत डर, क्योंकि वहाँ मैं तुझसे एक बड़ी जाति बनाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: परमेश्वर
  rationale: सप्रत्यय पद वक्ता की पहचान पर बल देता है। हिन्दी में “मैं परमेश्वर हूँ” स्वाभाविक और स्पष्ट है; लिप्यंतरण “एल” अर्थ को अनूदित नहीं करता।
- source_word: אֱלֹהֵי אָבִיךָ
  choice: तेरे पिता का परमेश्वर
  rationale: एकवचन “पिता” और संबंधवाचक संरचना दोनों को बनाए रखता है तथा परमेश्वर की पैतृक पहचान को स्पष्ट करता है।
- source_word: אַל תִּירָא מֵרְדָה
  choice: जाने से मत डर
  rationale: निषेध के साथ ירא और पूर्वसर्गयुक्त क्रियार्थक संज्ञा का स्वाभाविक हिन्दी अर्थ “करने से मत डर” है। “नीचे उतरना” शब्दशः संभव है, पर आधुनिक हिन्दी में मिस्र की यात्रा के लिए अनावश्यक रूप से भौगोलिक लग सकता है।
- source_word: מִצְרַיְמָה
  choice: मिस्र
  rationale: दिशासूचक प्रत्यय गति का लक्ष्य बताता है; “मिस्र जाने” में गंतव्य स्वाभाविक रूप से व्यक्त है।
- source_word: לְגוֹי גָּדוֹל אֲשִׂימְךָ
  choice: तुझसे एक बड़ी जाति बनाऊँगा
  rationale: שׂים के साथ לְ परिणामसूचक है। हिन्दी में “तुझसे ... बनाऊँगा” याकूब से बड़ी जाति उत्पन्न और गठित करने का भाव सहजता से व्यक्त करता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह मिस्र को उस स्थान के रूप में इंगित करता है जहाँ प्रतिज्ञा पूरी होगी।
theological_decisions:
- issue: ईश्वरीय आत्म-परिचय में पैतृक संबोधन
  choice: तेरे पिता का परमेश्वर
  alternative: तेरे पूर्वजों का परमेश्वर
  rationale: इब्रानी पाठ में “पिता” एकवचन है। इसे बहुवचन या व्यापक “पूर्वजों” में बदलना पाठ की तत्काल वाचा-संबंधी पहचान को व्याख्यात्मक रूप से विस्तृत कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। परमेश्वर का याकूब से सीधा संबोधन होने के कारण एकवचन निकट संबोधन “तेरे/तुझसे” रखा गया है। पद में कोई पादटिप्पणी आवश्यक नहीं मानी गई; अंग्रेज़ी परत की पादटिप्पणी वास्तव में वैकल्पिक अनुवाद न देकर उसी इब्रानी रचना की व्याख्या करती है।
