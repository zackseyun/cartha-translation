  text: וַ/יֹּ֨אמֶר יוֹסֵ֤ף אֶל אֶחָי/ו֙ וְ/אֶל בֵּ֣ית אָבִ֔י/ו אֶעֱלֶ֖ה וְ/אַגִּ֣ידָה לְ/פַרְעֹ֑ה וְ/אֹֽמְרָ֣ה אֵלָ֔י/ו אַחַ֧/י וּ/בֵית אָבִ֛/י אֲשֶׁ֥ר בְּ/אֶֽרֶץ כְּנַ֖עַן בָּ֥אוּ אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/031.yaml
  text: Then Joseph said to his brothers and to his father’s household[a], “I will go up and report to Pharaoh, and I will say to him, ‘My brothers and my father’s household, who were in the land of Canaan, have come to me.’”
translation:
  language: hi
  text: तब यूसुफ ने अपने भाइयों और अपने पिता के घराने के लोगों[a] से कहा, “मैं ऊपर जाकर फ़िरौन को सूचना दूँगा और उससे कहूँगा, ‘मेरे भाई और मेरे पिता का घराना, जो कनान देश में थे, मेरे पास आ गए हैं।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पिता के घर के लोगों से”; इब्रानी में शाब्दिक रूप से “अपने पिता का घर।” यहाँ इसका अर्थ केवल निवास-स्थान नहीं, बल्कि परिवार की इकाई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम व्यक्त करता है।
- source_word: אֶל אֶחָיו
  choice: अपने भाइयों ... से
  rationale: संदर्भ में אַחָיו यूसुफ के पुरुष भाइयों को सूचित करता है।
- source_word: וְאֶל בֵּית אָבִיו
  choice: और अपने पिता के घराने से
  rationale: यहाँ בֵּית सामाजिक-पारिवारिक इकाई को दर्शाता है, केवल भौतिक मकान को नहीं।
- source_word: אֶעֱלֶה
  choice: मैं ऊपर जाकर
  rationale: עלה का दिशासूचक अर्थ ‘ऊपर जाना’ सुरक्षित रखा गया है और हिन्दी में इसे संयुक्त क्रिया के रूप में स्वाभाविक बनाया गया है।
- source_word: וְאַגִּידָה לְפַרְעֹה
  choice: फ़िरौन को सूचना दूँगा
  rationale: हिफ़िल נגד किसी बात को ज्ञात कराने या सूचित करने का भाव रखता है; राजदरबार के संदर्भ में यह सहज है।
- source_word: וְאֹמְרָה אֵלָיו
  choice: और उससे कहूँगा
  rationale: यूसुफ की भावी मंशा को प्रथम पुरुष में स्पष्ट रखा गया है।
- source_word: אַחַי
  choice: मेरे भाई
  rationale: यह यूसुफ के वास्तविक भाइयों का संदर्भ है।
- source_word: וּבֵית אָבִי
  choice: और मेरे पिता का घराना
  rationale: בֵּית אָבִי यहाँ पिता से संबंधित विस्तृत परिवार अथवा घराने को दर्शाता है।
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: जो कनान देश में थे
  rationale: इब्रानी में स्पष्ट सीमित क्रिया नहीं है; अगले पूर्ण कार्य ‘आ गए हैं’ से पहले की स्थिति के लिए हिन्दी में भूतकाल स्वाभाविक है।
- source_word: בָּאוּ אֵלַי
  choice: मेरे पास आ गए हैं
  rationale: पूर्ण हो चुके आगमन की वर्तमान प्रासंगिकता को हिन्दी का पूर्ण वर्तमान रूप स्वाभाविक ढंग से व्यक्त करता है।
