  terminology: ‘यूसुफ,’ ‘फ़िरौन,’ ‘कनान देश,’ and ‘घराना’ are appropriate. ‘घराना’ suitably conveys a family/household unit; the footnote preserves the more literal ‘घर’ alternative.
