    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये ... थे
  rationale: यह वंशावली के इस भाग का सार प्रस्तुत करता है; हिंदी कथा-प्रसंग में भूतकाल स्वाभाविक है।
- source_word: בְּנֵי רָחֵל
  choice: राहेल के पुत्र
  rationale: इब्रानी का सीधा अर्थ ‘राहेल के पुत्र’ है; यह मूल की लिंग-सूचक अभिव्यक्ति को बनाए रखता है।
- source_word: אֲשֶׁר יֻלַּד לְיַעֲקֹב
  choice: जो याकूब से उत्पन्न हुए थे
  rationale: יֻלַּד का निष्क्रिय भाव और לְיַעֲקֹב का पितृत्व-संबंध स्वाभाविक आधुनिक हिंदी में व्यक्त किया गया है।
- source_word: כָּל נֶפֶשׁ
  choice: कुल ... व्यक्ति
  rationale: वंशावली और गणना के प्रसंग में נֶפֶשׁ व्यक्तियों की संख्या बताता है; ‘प्राण’ या ‘आत्माएँ’ यहाँ भ्रामक हो सकता है।
- source_word: אַרְבָּעָה עָשָׂר
  choice: चौदह
  rationale: मूल संख्या का सीधा और स्पष्ट अनुवाद।
