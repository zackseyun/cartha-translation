  rationale: संयोजक וּ वंशावली की क्रमिक सूची को आगे बढ़ाता है, इसलिए उसे ‘और’ से व्यक्त किया गया है। בְנֵי पुल्लिंग बहुवचन रचना है और यहाँ वंशावली के संदर्भ में ‘पुत्र’ उपयुक्त है।
