- source_word: חֻשִׁים
  choice: हूशीम
  rationale: यहाँ यह शब्द रूप में बहुवचन-जैसा दिखने पर भी व्यक्तिवाचक नाम है। इब्रानी की संक्षिप्त, क्रियारहित शैली को बनाए रखते हुए ‘हूशीम उसका पुत्र था’ जैसा विस्तार नहीं किया गया।
