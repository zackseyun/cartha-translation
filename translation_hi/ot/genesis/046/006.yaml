base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/006.yaml
  text: They took their livestock and their possessions that they had acquired in the land of Canaan[a], and they came to Egypt—Jacob and all his offspring with him.
translation:
  language: hi
  text: उन्होंने अपने पशुधन और अपनी संपत्ति, जो उन्होंने कनान देश में अर्जित की थी, साथ ली और मिस्र आए—याकूब और उसकी सारी सन्तान[a] उसके साथ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सारे वंशज’। इब्रानी शब्द सन्तान, वंशज, या बीज का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: उन्होंने ... साथ ली
  rationale: לקח का मूल अर्थ ‘लेना’ है; यात्रा के प्रसंग में ‘साथ ली’ स्वाभाविक हिन्दी है और कथात्मक क्रम को स्पष्ट करती है।
- source_word: מִקְנֵיהֶם
  choice: अपने पशुधन
  rationale: מִקְנֶה पाले हुए पशुओं के व्यापक समूह को दर्शाता है; ‘पशुधन’ आधुनिक और समावेशी हिन्दी समतुल्य है।
- source_word: רְכוּשָׁם
  choice: अपनी सारी सम्पत्ति
  rationale: רְכוּשׁ चल सम्पत्ति और संचित माल को दर्शाता है। ‘सम्पत्ति’ व्यापक है; ‘सारी’ स्वामित्व-सूचक बहुवचन प्रत्यय के सामूहिक आशय को सहज हिन्दी में व्यक्त करती है।
- source_word: אֲשֶׁר רָכְשׁוּ
  choice: जो उन्होंने ... अर्जित की थी
  rationale: רכש प्राप्त या संचित करने को दर्शाता है; ‘अर्जित की थी’ मिस्र-यात्रा से पहले कनान में हुए संग्रह को स्पष्ट करता है।
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: कनान देश में
  rationale: यह रूप אֶרֶץ की भौगोलिक ठोसता बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: וַיָּבֹאוּ מִצְרָיְמָה
  choice: और मिस्र आए
  rationale: בוא तथा दिशासूचक रूप मिस्र की ओर पहुँचने की गति बताते हैं; ‘आए’ हिब्रू के दृष्टिकोण को बिना ‘प्रवेश किया’ जैसी अतिरिक्त विशिष्टता के बनाए रखता है।
- source_word: יַעֲקֹב וְכָל זַרְעוֹ אִתּוֹ
  choice: याकूब और उसके साथ उसका सारा वंश
  rationale: זֶרַע यहाँ याकूब की संतान/वंशजों के सामूहिक समूह को दर्शाता है। ‘वंश’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है, जबकि इसकी शाब्दिक व्यापकता पादटिप्पणी में सुरक्षित है।
