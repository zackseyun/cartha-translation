base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/010.yaml
  text: 'And the sons of Simeon: Jemuel[a], Jamin, Ohad, Jachin, Zohar, and Shaul, the son of the Canaanite woman.'
translation:
  language: hi
  text: 'और शिमोन के पुत्र ये थे: यमूएल, यामीन, ओहद, याकीन, सोहर और शाऊल, जो कनानी स्त्री का पुत्र था।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: और शिमोन के पुत्र ये थे
  rationale: संयोजक ו और ‘पुत्रों’ की रचनात्मक बहुवचन अवस्था वंशावली की पिछली सूची को आगे बढ़ाती है। ‘ये थे’ हिंदी में सूची का स्वाभाविक परिचय देता है।
- source_word: יְמוּאֵל
  choice: यमूएल
  rationale: हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: וְיָמִין
  choice: यामीन
  rationale: हिब्रू नाम का स्वर और प्रारंभिक व्यंजन स्पष्ट रखने वाला लिप्यंतरण।
- source_word: וְאֹהַד
  choice: ओहद
  rationale: हिब्रू नाम का सीधा देवनागरी लिप्यंतरण।
- source_word: וְיָכִין
  choice: याकीन
  rationale: हिब्रू के प्रारंभिक य व्यंजन और दीर्घ स्वर को दर्शाने वाला लिप्यंतरण।
- source_word: וְצֹחַר
  choice: सोहर
  rationale: नाम का प्रचलित, सरल हिंदी बाइबलीय रूप चुना गया; यह देवनागरी पाठक के लिए सहज है।
- source_word: וְשָׁאוּל
  choice: और शाऊल
  rationale: हिब्रू שָׁאוּל का निकट और हिंदी में परिचित लिप्यंतरण।
- source_word: בֶּן הַכְּנַעֲנִית
  choice: जो कनानी स्त्री का पुत्र था
  rationale: स्त्रीलिंग एकवचन जातिवाचक रूप को स्पष्ट रूप से ‘कनानी स्त्री’ कहा गया है; संबंधवाचक उपवाक्य आधुनिक हिंदी में स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और वंशावली की सूची के अनुरूप संक्षिप्त रखी गई है। व्यक्तिनाम मूल हिब्रू के आधार पर देवनागरी में लिप्यंतरित किए गए हैं; कोई संप्रदायगत व्याख्या नहीं जोड़ी गई।
