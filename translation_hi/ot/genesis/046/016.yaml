  text: וּ/בְנֵ֣י גָ֔ד צִפְי֥וֹן וְ/חַגִּ֖י שׁוּנִ֣י וְ/אֶצְבֹּ֑ן עֵרִ֥י וַֽ/אֲרוֹדִ֖י וְ/אַרְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/016.yaml
  text: 'And the sons of Gad: Ziphion[a], Haggi, Shuni, Ezbon, Eri, Arodi, and Areli.'
translation:
  language: hi
  text: 'और गाद के पुत्र थे: सिफ्योन[a], हाग्गी, शूनी, एसबोन, एरी, अरोदी और अरेली।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ नाम צִפְיוֹן (सिफ्योन) है; कई अनुवादों में ‘सफोन’ मिलता है, जो गिनती 26:15 में पाए जाने वाले एक अन्य पारंपरिक रूप को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי גָד
  choice: और गाद के पुत्र थे
  rationale: निर्माण-बहुवचन בְנֵי का सीधा अर्थ ‘पुत्र’ है; आरंभिक וּ को ‘और’ से व्यक्त किया गया है। हिंदी में वंशावली-सूची का स्वाभाविक परिचय देने के लिए निहित संबंधसूचक क्रिया ‘थे’ जोड़ी गई है।
- source_word: צִפְיוֹן
  choice: सिफ़योन
  rationale: इस पद के मसोराई रूप צִפְיוֹן का निकट देवनागरी लिप्यंतरण; गिनती 26:15 में पाया जाने वाला संक्षिप्त रूप अलग पाठ-परंपरागत रूप को दर्शाता है।
- source_word: וְחַגִּי
  choice: हाग्गी
  rationale: संयुक्ताक्षरित गिमेल को ‘ग्ग’ से और नाम के स्वरों को प्रचलित बाइबलीय हिंदी शैली में दर्शाया गया है; उपसर्ग וְ सूची-संरचना में विरामचिह्नों से समाहित है।
- source_word: שׁוּנִי
  choice: शूनी
  rationale: हिब्रू नाम का सीधा देवनागरी लिप्यंतरण।
- source_word: וְאֶצְבֹּן
  choice: एसबोन
  rationale: हिब्रू אֶצְבֹּן का पठनीय हिंदी लिप्यंतरण; צ को यहाँ ‘स’ से दर्शाया गया है, जैसा अनेक प्रचलित हिंदी बाइबल नामों में होता है।
- source_word: עֵרִי
  choice: एरी
  rationale: हिब्रू नाम का सीधा और स्वाभाविक देवनागरी लिप्यंतरण।
- source_word: וַאֲרוֹדִי
  choice: अरोदी
  rationale: हिब्रू नाम का सीधा देवनागरी लिप्यंतरण; आरंभिक संयोजक सूची के विन्यास में समाहित है।
- source_word: וְאַרְאֵלִי
  choice: अरेली
  rationale: हिब्रू नाम का सीधा देवनागरी लिप्यंतरण; अंतिम सदस्य से पहले וְ को ‘और’ के रूप में व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली रखी गई है। व्यक्तिनामों को मूल इब्रानी रूप के आधार पर देवनागरी में लिप्यंतरित किया गया है; सूची को हिंदी में स्वाभाविक बनाने के लिए ‘थे’ जोड़ा गया है।
