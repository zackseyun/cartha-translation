- source_word: וְ/יַחְלְאֵל
  choice: यहलेएल
  rationale: आरंभिक योड और नाम के घटकों को यथासंभव स्पष्ट रखते हुए हिब्रू के निकट देवनागरी लिप्यंतरण किया गया है।
