  edition: WLC
  text: וַ/יֹּ֧אמֶר יִשְׂרָאֵ֛ל אֶל יוֹסֵ֖ף אָמ֣וּתָה הַ/פָּ֑עַם אַחֲרֵי֙ רְאוֹתִ֣/י אֶת פָּנֶ֔י/ךָ כִּ֥י עוֹדְ/ךָ֖ חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/030.yaml
  text: Then Israel said to Joseph[a], “Now I can die, since I have seen your face and know that you are still alive.”
translation:
  language: hi
  text: तब इस्राएल ने यूसुफ से कहा, “अब मैं मर सकता हूँ[a], क्योंकि मैंने तेरा मुख देख लिया है और तू अब भी जीवित है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक औपचारिक रूप से: “अब मैं मरूँ, तेरे मुख को देखने के बाद, क्योंकि तू अब भी जीवित है।” इब्रानी वाक्य संक्षिप्त और मुहावरेदार है।'
    reason: कोहोर्टेटिव क्रिया और संक्षिप्त इब्रानी वाक्य-संरचना के अधिक औपचारिक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ में स्पष्ट रूप से ‘इस्राएल’ है; इसलिए इसे ‘याकूब’ से समरूप नहीं किया गया।
- source_word: אָמ֣וּתָה הַפָּעַם
  choice: अब मैं मर सकता हूँ
  rationale: कोहोर्टेटिव रूप भावात्मक तत्परता या संकल्प व्यक्त करता है। प्रसंग में इस्राएल मृत्यु की अनुमति नहीं माँग रहा, बल्कि कह रहा है कि यूसुफ को जीवित देखकर अब वह संतोष से मर सकता है।
- source_word: אַחֲרֵי רְאוֹתִי
  choice: क्योंकि मैंने ... देख लिया है
  rationale: शाब्दिक अर्थ ‘मेरे देखने के बाद’ है, पर यहाँ समय और कारण दोनों का भाव है; हिन्दी में यह पूर्ण हुई घटना और उसके परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶת פָּנֶיךָ
  choice: तेरा मुख
  rationale: ‘मुख’ मूल के ‘चेहरे’ वाले सजीव बिंब को बनाए रखता है; पिता द्वारा पुत्र को संबोधन होने के कारण ‘तेरा’ प्रसंगानुकूल है।
- source_word: כִּי עוֹדְךָ חָי
  choice: और तू अब भी जीवित है
  rationale: כִּי यहाँ इस्राएल के कथन का आधार या परिस्थिति बताता है और עוֹד निरंतरता व्यक्त करता है। ‘अब भी जीवित’ आधुनिक हिन्दी में स्पष्ट है; ‘और’ दोनों निकट संबंधी बातों को सहजता से जोड़ता है।
theological_decisions:
- issue: אָמ֣וּתָה में कोहोर्टेटिव भाव
  choice: अब मैं मर सकता हूँ
  alternative: अब मुझे मरने दे / अब मैं मरूँगा
  rationale: ‘मुझे मरने दे’ अनुमति माँगने का भाव ला सकता है, जबकि ‘मैं मरूँगा’ अनिवार्य भविष्य को आवश्यकता से अधिक निश्चित करता है। चुना हुआ रूप प्रसंगगत संतोष और तत्परता को व्यक्त करता है; अधिक औपचारिक संरचना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इस्राएल’ मूल पाठ के नाम को बनाए रखता है; ‘तेरा मुख’ पिता-पुत्र के संबंध और इब्रानी बिंब दोनों के अनुरूप है।
