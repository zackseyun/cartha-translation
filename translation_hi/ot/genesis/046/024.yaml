- source_word: וּבְנֵי
  choice: और ... के पुत्र
  rationale: בְּנֵי का अर्थ वंशावली-सूची में स्वाभाविक रूप से ‘पुत्र’ है; आरम्भिक ו को ‘और’ के रूप में रखा गया है ताकि पूर्ववर्ती सूची से संबंध बना रहे।
- source_word: נַפְתָּלִי
  choice: नप्ताली
  rationale: इब्रानी व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: יַחְצְאֵל
  choice: यहसेएल
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण, जिसमें आरम्भिक योड तथा नाम के अक्षर-क्रम को यथासंभव स्पष्ट रखा गया है।
- source_word: וְגוּנִי
  choice: गूनी
  rationale: व्यक्तिवाचक नाम का ध्वन्यात्मक देवनागरी लिप्यंतरण; उपसर्ग ו सूची की हिन्दी संरचना में व्यक्त है।
- source_word: וְיֵצֶר
  choice: येसेर
  rationale: इब्रानी व्यक्तिवाचक नाम का लिप्यंतरण; आरम्भिक י को ‘ये’ और צ को हिन्दी पाठक के लिए सुबोध ‘स’ से दर्शाया गया है।
- source_word: וְשִׁלֵּם
  choice: शिल्लेम
  rationale: नाम का लिप्यंतरण; इब्रानी दागेश से सूचित व्यंजन-द्वित्व को ‘ल्ल’ द्वारा सुरक्षित रखा गया है।
