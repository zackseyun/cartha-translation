  naturalness: The current Hindi is clear and modern. The revision uses ‘समेत’ to retain the first accompaniment phrase without an awkward repetition of ‘अपने साथ.’
  terminology: ‘पोते/पोतियाँ’ correctly preserves the specifically patrilineal relationships expressed by ‘sons of his sons’ and ‘daughters of his sons.’ ‘वंशज’ is a suitable collective rendering of זַרְעוֹ in this context. ‘मिस्र’ and ‘ले आया’ are appropriate.
