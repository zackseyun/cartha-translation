  yaml_path: translation/ot/genesis/046/007.yaml
  text: His sons and his grandsons with him[a], his daughters and his granddaughters[b], and all his offspring he brought with him to Egypt.
translation:
  language: hi
  text: वह अपने बेटों और पोतों[a] समेत, अपनी बेटियों और पोतियों[b] तथा अपने सभी वंशजों[c] को अपने साथ मिस्र ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके बेटों के बेटे।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसके बेटों की बेटियाँ।”
    reason: lexical_alternative
  - marker: c
    text: या “उसकी सारी संतान”; शाब्दिक रूप से, “उसका सारा बीज।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: अपने बेटों
  rationale: यहाँ पुरुष संतान का उल्लेख है और आगे बेटियों को अलग गिनाया गया है, इसलिए ‘बेटों’ उपयुक्त है।
- source_word: וּבְנֵי בָנָיו
  choice: पोतों
  rationale: शाब्दिक अर्थ ‘उसके बेटों के बेटे’ है। आधुनिक हिन्दी में ‘पोते’ स्वाभाविक है और पुरुष-पक्षीय वंश-संबंध को ठीक प्रकार व्यक्त करता है।
- source_word: אִתּוֹ
  choice: अपने साथ
  rationale: यह साथ होने या साथ ले जाने का सामान्य अर्थ व्यक्त करता है। हिन्दी वाक्य में इसे क्रिया के पास रखना अधिक स्वाभाविक है।
- source_word: בְּנֹתָיו
  choice: बेटियों
  rationale: यह उसकी स्त्री संतान के लिए सीधा और स्पष्ट शब्द है।
- source_word: וּבְנוֹת בָּנָיו
  choice: पोतियों
  rationale: शाब्दिक अर्थ ‘उसके बेटों की बेटियाँ’ है। आधुनिक हिन्दी में इसका स्वाभाविक समतुल्य ‘पोतियाँ’ है।
- source_word: וְכָל זַרְעוֹ
  choice: और अपने सभी वंशजों
  rationale: זֶרַע का मूल अर्थ ‘बीज’ है, पर इस पारिवारिक संदर्भ में सामूहिक अर्थ ‘वंशज’ है। यह हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: הֵבִיא
  choice: ले आया
  rationale: בוא का हिफ़ील रूप ‘लाना/ले आना’ दर्शाता है; ‘ले आया’ परिवार को अपने साथ गंतव्य तक लाने का भाव रखता है।
- source_word: מִצְרָיְמָה
  choice: मिस्र
  rationale: दिशासूचक प्रत्यय मिस्र की ओर गति बताता है; ‘मिस्र ले आया’ आधुनिक हिन्दी में इस गंतव्य को स्वाभाविक रूप से व्यक्त करता है।
