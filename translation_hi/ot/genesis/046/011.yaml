  text: 'And the sons of Levi: Gershon, Kohath, and Merari.'
translation:
  language: hi
  text: 'और लेवी के पुत्र: गेर्शोन, कहात और मरारी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: और ... के पुत्र
  rationale: आरम्भिक ו को वंशावली की क्रमिक निरन्तरता दिखाने के लिए “और” से व्यक्त किया गया है। בְנֵי पुल्लिंग बहुवचन संबंधसूचक रूप है, इसलिए “पुत्र” उपयुक्त है।
- source_word: לֵוִי
  choice: लेवी
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबल परम्परा में प्रचलित और स्रोत-रूप के निकट लिप्यन्तरण।
- source_word: גֵּרְשׁוֹן
  choice: गेर्शोन
  rationale: यहाँ हिब्रू रूप גֵּרְשׁוֹן है; इसे समान किन्तु भिन्न नाम गेर्शोम से अलग रखते हुए लिप्यन्तरित किया गया है।
- source_word: קְהָת
  choice: कहात
  rationale: हिब्रू नाम קְהָת का हिन्दी में स्वाभाविक और प्रचलित लिप्यन्तरण।
- source_word: וּ/מְרָרִי
  choice: और मरारी
  rationale: अन्तिम नाम से पहले लगे ו को “और” से व्यक्त किया गया है; מְרָרִי का लिप्यन्तरण “मरारी” किया गया है।
