  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה שְׁמ֧וֹת בְּנֵֽי יִשְׂרָאֵ֛ל הַ/בָּאִ֥ים מִצְרַ֖יְמָ/ה יַעֲקֹ֣ב וּ/בָנָ֑י/ו בְּכֹ֥ר יַעֲקֹ֖ב רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/008.yaml
  text: 'These are the names of the sons of Israel who came to Egypt: Jacob and his sons[b][a]. Jacob’s firstborn was Reuben.'
translation:
  language: hi
  text: 'मिस्र आए इस्राएल के पुत्रों के नाम ये हैं: याकूब और उसके पुत्र[a]। याकूब का पहलौठा रूबेन था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल में “याकूब और उसके पुत्र” पूर्ववर्ती कथन के साथ समानाधिकरण में है; इसे इस प्रकार भी विराम दिया जा सकता है: “मिस्र आए इस्राएल के पुत्रों के नाम ये हैं—याकूब और उसके पुत्र।”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ये हैं
  rationale: वाक्यांश वंशावली की नई सूची का परिचय देता है। आरंभिक וְ का कथात्मक संयोजक बल हिन्दी में प्रसंग और वाक्य-विन्यास से स्पष्ट है; अलग से “और” जोड़ना यहाँ आवश्यक नहीं।
- source_word: שְׁמוֹת
  choice: नाम
  rationale: बहुवचन संज्ञा यहाँ आगे दी जाने वाली नामावली का परिचय देती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: निकटवर्ती संदर्भ में पुरुष वंशजों के नाम दिए जा रहे हैं, इसलिए व्यापक “संतानों” के बजाय लिंग-सटीक “पुत्रों” रखा गया है। इस्राएल नाम को याकूब के व्यक्तिगत/वाचागत नाम के रूप में बनाए रखा गया है।
- source_word: הַבָּאִים
  choice: आए
  rationale: निश्चित लेखयुक्त कृदंत उन लोगों का वर्णन करता है जो मिस्र आए; हिन्दी में पूर्ण भूतकालीन “आए” सूची के पश्चदृष्टिपरक परिचय के लिए स्वाभाविक है।
- source_word: מִצְרַיְמָה
  choice: मिस्र
  rationale: दिशासूचक प्रत्यय मिस्र की ओर गति बताता है; हिन्दी क्रिया “मिस्र आए” में यह दिशा स्वाभाविक रूप से व्यक्त होती है।
- source_word: יַעֲקֹב וּבָנָיו
  choice: याकूब और उसके पुत्र
  rationale: इसे पूर्ववर्ती प्रवास-वर्णन के बाद आने वाले समानाधिकरणात्मक स्पष्टीकरण के रूप में रखा गया है। मूल की संक्षिप्त और कुछ तनावपूर्ण रचना को किसी अतिरिक्त व्याख्यात्मक शब्द से नहीं सुलझाया गया।
- source_word: בְּכֹר יַעֲקֹב
  choice: याकूब का पहलौठा
  rationale: सम्बन्धसूचक रचना जन्मक्रम पर बल देती है। “पहलौठा” dignified biblical Hindi में परिचित और अर्थ-सटीक है।
- source_word: רְאוּבֵן
  choice: रूबेन
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
theological_decisions:
- issue: “इस्राएल के पुत्रों” के साथ “याकूब और उसके पुत्र” का संबंध
  choice: 'मुख्य पाठ में मूल का समानाधिकरणात्मक विन्यास बनाए रखा गया: “इस्राएल के पुत्रों के नाम...: याकूब और उसके पुत्र।”'
  alternative: “इस्राएल के पुत्रों, अर्थात् याकूब के पुत्रों” जैसा स्पष्टकारी पुनर्लेखन
  rationale: מִצְרַיְמָה के बाद יַעֲקֹב וּבָנָיו मूल में संक्षिप्त समानाधिकरण है और उसमें याकूब स्वयं भी सम्मिलित दिखाई देता है। “अर्थात्” या केवल “याकूब के पुत्र” कहने से मूल की व्याकरणिक/अर्थगत जटिलता अनावश्यक रूप से सुलझ जाएगी।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वंशावली-शैली अपनाई गई है। “पहलौठा” जन्मक्रम की पारंपरिक बाइबलीय संज्ञा के रूप में रखा गया है; बाकी वाक्य-विन्यास वर्तमान पाठक के लिए सहज है।
