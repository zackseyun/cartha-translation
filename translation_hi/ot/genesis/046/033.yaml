lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और जब
  rationale: यह इब्रानी मुहावरा भविष्य में होने वाली परिस्थिति का परिचय देता है; ‘और जब’ आधुनिक हिन्दी में स्वाभाविक रूप से उसका कालगत अर्थ व्यक्त करता है।
- source_word: יִקְרָא לָכֶם
  choice: तुम्हें बुलाकर
  rationale: קרא के साथ ל यहाँ बुलाने या अपने सामने आने के लिए कहने का अर्थ देता है। ‘बुलाकर’ अगले कथन के साथ स्वाभाविक हिन्दी वाक्य बनाता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का प्रचलित आधुनिक हिन्दी रूप।
- source_word: וְאָמַר
  choice: पूछे
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘कहे’ है, पर उसके बाद सीधा प्रश्न आता है; हिन्दी में ‘पूछे’ संवाद का कार्य स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: तुम्हारा काम-धंधा क्या है?
  rationale: מַעֲשֵׂיכֶם यहाँ उनके पेशे या जीविका के काम को दर्शाता है। ‘काम-धंधा’ आम आधुनिक हिन्दी में सहज है और प्रश्न के व्यावसायिक संदर्भ को स्पष्ट रखता है।
