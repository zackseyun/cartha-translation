  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
translation:
  language: hi
  text: तब याकूब बेर्शेबा से चल पड़ा, और इस्राएल के पुत्र अपने पिता याकूब, अपने बाल-बच्चों और अपनी पत्नियों को उन गाड़ियों में ले गए जिन्हें फ़िरौन ने उसे ले जाने के लिए भेजा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: चल पड़ा
  rationale: क्रिया का मूल अर्थ ‘उठा’ है, पर किसी स्थान से यात्रा आरम्भ करने के प्रसंग में ‘चल पड़ा’ आधुनिक हिन्दी में स्वाभाविक रूप से उसका भाव व्यक्त करता है।
- source_word: מִבְּאֵר שָׁבַע
  choice: बेर्शेबा से
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण और उपसर्ग מִן का सीधा अनुवाद।
- source_word: וַיִּשְׂאוּ
  choice: ले गए
  rationale: נשׂא का अर्थ ‘उठाना/ढोना/ले जाना’ हो सकता है; गाड़ियों में व्यक्तियों को पहुँचाने के संदर्भ में ‘ले गए’ सहज और सटीक है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यहाँ पदबंध सामान्य राष्ट्र नहीं, याकूब के पुरुष वंशजों को निर्दिष्ट करता है; इसलिए ‘पुत्र’ लिंग और संदर्भ दोनों को स्पष्ट रखता है।
- source_word: אֲבִיהֶם
  choice: अपने पिता
  rationale: सम्बन्धवाचक सर्वनाम पुत्रों की ओर संकेत करता है; हिन्दी में कर्ता-सापेक्ष ‘अपने पिता’ स्वाभाविक है।
- source_word: טַפָּם
  choice: अपने बाल-बच्चों
  rationale: טַף मुख्यतः छोटे बच्चों अथवा परिवार के आश्रित नन्हों को दर्शाता है; ‘बाल-बच्चे’ साधारण आधुनिक हिन्दी में इस सामूहिक भाव को व्यक्त करता है।
- source_word: נְשֵׁיהֶם
  choice: अपनी पत्नियों
  rationale: पारिवारिक यात्रा के इस संदर्भ में נָשִׁים का अभिप्राय पत्नियाँ है।
- source_word: בָּעֲגָלוֹת
  choice: उन गाड़ियों में
  rationale: עֲגָלוֹת माल या यात्रियों को ढोने वाली गाड़ियों को दर्शाता है; ‘गाड़ियों में’ हिन्दी में स्वाभाविक है।
- source_word: אֲשֶׁר שָׁלַח פַּרְעֹה
  choice: जिन्हें फ़िरौन ने ... भेजा था
  rationale: ‘भेजा था’ मुख्य क्रिया से पहले पूरी हुई कार्रवाई को स्पष्ट करता है, बिना नया अर्थ जोड़े।
- source_word: לָשֵׂאת אֹתוֹ
  choice: उसे ले आने के लिए
  rationale: उद्देश्यवाचक infinitive और एकवचन प्रत्यय याकूब की ओर संकेत करते हैं; फ़िरौन के दृष्टिकोण से हिन्दी में ‘ले आने’ अधिक स्वाभाविक है।
