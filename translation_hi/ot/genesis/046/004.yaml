  text: אָנֹכִ֗י אֵרֵ֤ד עִמְּ/ךָ֙ מִצְרַ֔יְמָ/ה וְ/אָנֹכִ֖י אַֽעַלְ/ךָ֣ גַם עָלֹ֑ה וְ/יוֹסֵ֕ף יָשִׁ֥ית יָד֖/וֹ עַל עֵינֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/004.yaml
  text: I myself will go down with you to Egypt[a], and I myself will also surely bring you up; and Joseph will place his hand on your eyes.
translation:
  language: hi
  text: मैं स्वयं तुम्हारे साथ मिस्र की ओर उतरूँगा, और मैं स्वयं तुम्हें भी निश्चय ही ऊपर ले आऊँगा; और यूसुफ तुम्हारी आँखों पर अपना हाथ रखेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, मुहावरे के अनुसार: “यूसुफ तुम्हारी आँखें बंद करेगा,” अर्थात वह तुम्हारी मृत्यु के समय उपस्थित होगा।'
    reason: मुख्य पाठ के ठोस इब्रानी मुहावरे का स्वाभाविक आशय स्पष्ट करना।
lexical_decisions:
- source_word: אָנֹכִי
  choice: मैं स्वयं
  rationale: स्वतंत्र सर्वनाम दोनों बार स्पष्ट रूप से आया है और बल देता है; ‘मैं स्वयं’ इस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֵרֵד עִמְּךָ מִצְרַיְמָה
  choice: तुम्हारे साथ मिस्र को उतरूँगा
  rationale: ‘उतरना’ मिस्र की ओर यात्रा के इब्रानी दिशात्मक मुहावरे को बनाए रखता है, जबकि ‘तुम्हारे साथ’ सहचर्य को सीधे व्यक्त करता है।
- source_word: אַעַלְךָ גַם עָלֹה
  choice: तुम्हें निश्चय ही फिर ऊपर ले आऊँगा
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘ऊपर ले आऊँगा’ से व्यक्त होता है; क्रियार्थक संज्ञा के बल को ‘निश्चय ही’ और लौटाकर ऊपर लाने की दिशा को ‘फिर’ से स्वाभाविक हिन्दी में दर्शाया गया है।
- source_word: וְיוֹסֵף
  choice: और यूसुफ
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: יָשִׁית יָדוֹ עַל עֵינֶיךָ
  choice: तुम्हारी आँखों पर अपना हाथ रखेगा
  rationale: मुख्य पाठ में इब्रानी का ठोस चित्र सुरक्षित रखा गया है; मृत्यु के समय आँखें बंद करने का मुहावरेदार आशय पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘ऊपर ले आऊँगा’ की प्रतिज्ञा का आशय
  choice: वाक्य को व्यापक और अनिर्धारित रखा गया है, ताकि वह याकूब से की गई व्यक्तिगत प्रतिज्ञा बना रहे।
  alternative: इसे केवल याकूब के शव को कनान में दफ़नाने के लिए ले जाने, केवल निर्गमन में उसके वंशजों के लौटने, अथवा याकूब के जीवित लौटने के रूप में स्पष्ट करना।
  rationale: इब्रानी कथन संक्षिप्त है और पूर्ति के एक से अधिक स्तरों की संभावना रखता है; अनुवाद किसी एक व्याख्या को पाठ में नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक बहुवचन के बजाय एक व्यक्ति को संबोधित करने वाला सामान्य ‘तुम’ रूप चुना गया है; भाषा सरल, गरिमापूर्ण और स्रोत के दिशात्मक चित्रों के निकट रखी गई है।
