  yaml_path: translation/ot/genesis/046/020.yaml
  text: To Joseph were born in the land of Egypt Manasseh and Ephraim[a], whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: hi
  text: मिस्र देश में यूसुफ़ के लिए मनश्शे और एप्रैम जन्मे, जिन्हें ओन[a] के याजक पोतीपेरा की बेटी आसनत ने यूसुफ़ के लिए जन्म दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ओन मिस्र का वह नगर है जो बाद में यूनानी भाषा में हेलियोपोलिस कहलाया।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּוָּלֵד לְיוֹסֵף
  choice: यूसुफ़ के ... उत्पन्न हुए
  rationale: निफ़अल क्रिया जन्म लेने का निष्क्रिय भाव व्यक्त करती है। इब्रानी क्रिया रूप एकवचन है, पर आगे दो पुत्रों के नाम हैं; इसलिए स्वाभाविक हिन्दी में बहुवचन रखा गया है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में
  rationale: אֶרֶץ का स्पष्ट अर्थ ‘देश’ रखते हुए हिन्दी में सहज पदक्रम अपनाया गया है।
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: उन्हें ... ने उसके लिए जन्म दिया था
  rationale: सम्बन्धवाचक उपवाक्य दोनों पुत्रों को संदर्भित करता है और माता द्वारा जन्म देने की सक्रिय अभिव्यक्ति को सुरक्षित रखता है।
- source_word: אָסְנַת
  choice: आसनत
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בַּת פּוֹטִי פֶרַע
  choice: पोतीपेरा की बेटी
  rationale: सम्बन्धसूचक रचना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: כֹּהֵן אֹן
  choice: ओन के याजक
  rationale: כֹּהֵן के लिए ‘याजक’ और स्थाननाम אֹן के लिए लिप्यंतरण ‘ओन’ रखा गया है।
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: मनश्शे और एप्रैम
  rationale: दोनों व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं; कर्मचिह्न אֶת का अलग अनुवाद नहीं किया गया।
