base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/028.yaml
  text: He sent Judah ahead of him to Joseph[a], to show the way before him to Goshen[c][b]; and they came into the land of Goshen.
translation:
  language: hi
  text: उसने यहूदा को अपने आगे यूसुफ के पास भेजा, ताकि वह उसके आगे गोशेन की ओर मार्ग दिखाए[a]; और वे गोशेन प्रदेश में आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्यांश संक्षिप्त और कुछ अस्पष्ट है। शाब्दिक रूप से: “ताकि वह उसके आगे गोशेन की ओर निर्देश दे/मार्ग दिखाए।” संदर्भ में इसका अर्थ यह भी हो सकता है कि यहूदा यूसुफ से गोशेन जाने के लिए निर्देश या व्यवस्था प्राप्त करे, अथवा याकूब के आगे मार्ग तैयार करे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: भेजा
  rationale: क़ाल क्रिया का सामान्य और स्वाभाविक हिन्दी अनुवाद; कथा में किसी को एक काम के लिए आगे भेजने का भाव स्पष्ट करता है।
- source_word: לְפָנָיו
  choice: अपने आगे
  rationale: यह मुहावरा स्थान और समय—दोनों की दृष्टि से पहले भेजे जाने का संकेत देता है; ‘अपने आगे’ मूल की निकटता और स्वाभाविक हिन्दी दोनों बनाए रखता है।
- source_word: לְהוֹרֹת
  choice: रास्ता बताए
  rationale: हिफ़ील रूप में क्रिया का अर्थ ‘निर्देश देना,’ ‘दिशा बताना’ या ‘मार्ग दिखाना’ हो सकता है। यात्रा के प्रसंग में ‘रास्ता बताए’ ठोस और सहज है, पर संकुचित इब्रानी वाक्यांश की अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: גֹּשְׁנָה
  choice: गोशेन जाने
  rationale: स्थान-नाम के साथ लगा दिशासूचक प्रत्यय गोशेन की ओर गति दर्शाता है; हिन्दी में ‘गोशेन जाने’ यही लक्ष्य स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיָּבֹאוּ
  choice: फिर वे … आए
  rationale: इब्रानी कथात्मक क्रम को सहज आधुनिक हिन्दी में आगे बढ़ाता है।
- source_word: אַרְצָה גֹּשֶׁן
  choice: गोशेन प्रदेश में
  rationale: אֶרֶץ यहाँ गोशेन के भू-भाग या क्षेत्र को सूचित करता है। ‘प्रदेश’ territorial अर्थ रखता है और हिन्दी में ‘गोशेन की भूमि में’ से अधिक स्वाभाविक है।
- source_word: יְהוּדָה / יוֹסֵף / גֹּשֶׁן
  choice: यहूदा / यूसुफ / गोशेन
  rationale: व्यक्तियों और स्थान के नामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
theological_decisions:
- issue: לְהוֹרֹת לְפָנָיו גֹּשְׁנָה में निर्देश देने वाले और पाने वाले की पहचान
  choice: 'मुख्य पाठ में यहूदा को रास्ता बताने वाला समझा गया है: ‘ताकि वह गोशेन जाने का रास्ता बताए।’'
  alternative: यह भी सम्भव है कि यहूदा यूसुफ से गोशेन की दिशा या वहाँ पहुँचने की व्यवस्था लेने गया हो, अथवा आगे जाकर मार्ग तैयार करने का भाव हो।
  rationale: इब्रानी वाक्यांश संक्षिप्त है और לְהוֹרֹת के अर्थ-क्षेत्र में निर्देश देना तथा दिशा बताना दोनों आते हैं। मुख्य अनुवाद निकटतम व्याकरणिक कर्ता और यात्रा-संदर्भ का अनुसरण करता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता को बनाए रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘अपने आगे’ मूल के दोहराए गए अग्रता-भाव को रखता है; अनावश्यक व्याख्यात्मक विस्तार मुख्य पाठ के बजाय पादटिप्पणी में दिया गया है।
