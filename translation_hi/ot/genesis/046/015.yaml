  text: אֵ֣לֶּה בְּנֵ֣י לֵאָ֗ה אֲשֶׁ֨ר יָֽלְדָ֤ה לְ/יַעֲקֹב֙ בְּ/פַדַּ֣ן אֲרָ֔ם וְ/אֵ֖ת דִּינָ֣ה בִתּ֑/וֹ כָּל נֶ֧פֶשׁ בָּנָ֛י/ו וּ/בְנוֹתָ֖י/ו שְׁלֹשִׁ֥ים וְ/שָׁלֹֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/015.yaml
  text: These are the sons of Leah[a], whom she bore to Jacob in Paddan-aram, along with Dinah his daughter[b]. The total number of his sons and his daughters was thirty-three.
translation:
  language: hi
  text: ये लिआ के बेटे हैं, जिन्हें उसने पद्दन-अराम में याकूब के लिए जन्म दिया था; इनके साथ याकूब की बेटी दीना भी है। याकूब के बेटों और बेटियों की कुल संख्या[a] तैंतीस थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘उसके बेटों और बेटियों के सब प्राण/व्यक्ति’; यहाँ आशय व्यक्तियों की कुल संख्या से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: लिआ के बेटे
  rationale: בְּנֵי का स्पष्ट अर्थ ‘बेटे’ है। वंशावली की इस सूची में आगे के वंशज भी सम्मिलित हैं, फिर भी इब्रानी शीर्षक के पुरुषवाचक रूप को व्यापक ‘संतान’ बनाकर नहीं बदला गया।
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: जिन्हें उसने ... याकूब के लिए जना था
  rationale: स्त्रीलिंग कर्ता के साथ יָלַד का अर्थ ‘जन्म देना/जनना’ है। ‘याकूब के लिए’ לְ का संबंध सुरक्षित रखता है और हिंदी में मातृ-पक्ष को स्पष्ट करता है।
- source_word: בְּפַדַּן אֲרָם
  choice: पद्दन-अराम में
  rationale: यह स्थान-नाम है, इसलिए इसका अर्थानुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: וְאֵת דִּינָה בִתּוֹ
  choice: और उसकी बेटी दीना भी
  rationale: ‘भी’ दीना को पहले बताए गए समूह के साथ जोड़ने वाली इब्रानी संरचना की योगात्मक शक्ति को स्वाभाविक हिंदी में व्यक्त करता है। पुल्लिंग ‘उसकी’ का संदर्भ याकूब से है।
- source_word: כָּל נֶפֶשׁ
  choice: कुल संख्या
  rationale: वंशावली और गणना के प्रसंग में נֶפֶשׁ का आशय अलग-अलग व्यक्तियों की संख्या से है, न कि ‘आत्माओं’ की धर्मवैज्ञानिक धारणा से।
- source_word: בָּנָיו וּבְנוֹתָיו
  choice: उसके बेटों और बेटियों
  rationale: इब्रानी में दोनों वर्ग अलग-अलग कहे गए हैं; इसलिए उन्हें सामान्य ‘संतान’ में नहीं समेटा गया।
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ
  choice: तैंतीस
  rationale: यह सीधी संख्या है।
theological_decisions:
- issue: נֶפֶשׁ को ‘प्राण/आत्मा’ या ‘व्यक्ति-संख्या’ के रूप में समझना
  choice: कुल संख्या
  alternative: कुल प्राण अथवा कुल व्यक्ति
  rationale: यहाँ शब्द जनगणना-सदृश वंशावली गणना में आया है। ‘कुल संख्या’ आशय को स्पष्ट करता है और मनुष्य की आत्मा के विषय में कोई अनावश्यक धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जना था’ मातृ-कर्म को स्पष्ट रखने वाला सामान्य हिंदी रूप है; स्थान-नाम ‘पद्दन-अराम’ के रूप में लिप्यंतरित किया गया है।
