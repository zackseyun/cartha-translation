translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘बहाल’ आधिकारिक पद पर पुनः स्थापित किए जाने का प्रचलित और सटीक हिन्दी शब्द है। इब्रानी में कर्ता प्रसंग से फ़िरौन है; हिन्दी में ‘उसने’ रखकर मूल की अंतर्निहित संदर्भ-निर्भरता बनाए रखी गई है।
