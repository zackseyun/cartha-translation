  yaml_path: translation/ot/genesis/041/013.yaml
  text: 'And it happened just as he interpreted for us[a], so it was: me he restored to my office[b], but him he hanged.'
translation:
  language: hi
  text: 'और जिस प्रकार उसने हमारे लिए व्याख्या की थी, वैसा ही हुआ: मुझे उसने मेरे पद पर फिर बहाल किया, लेकिन उसे फाँसी पर लटका दिया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי ... כֵּן הָיָה
  choice: और ... वैसा ही हुआ
  rationale: इब्रानी की परिणाम-सूचक कथात्मक रचना और व्याख्या के ठीक उसी प्रकार पूरा होने पर दिए गए बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּאֲשֶׁר
  choice: जैसा
  rationale: व्याख्या और बाद में घटी घटना के बीच सटीक अनुरूपता दिखाता है।
- source_word: פָּתַר לָנוּ
  choice: उसने हमारे लिए अर्थ बताया था
  rationale: פתר स्वप्न के प्रसंग में उसका अर्थ बताने या व्याख्या करने को दर्शाता है। हिन्दी में प्रसंग से स्वप्न स्पष्ट है, इसलिए अनावश्यक विस्तार किए बिना अर्थ रखा गया है।
- source_word: אֹתִי הֵשִׁיב עַל כַּנִּי
  choice: मुझे उसने मेरे पद पर फिर बहाल कर दिया
  rationale: वाक्य के आरम्भ में आए कर्म ‘मुझे’ को आगे रखकर अगले खंड के ‘उसे’ के साथ विरोध बनाए रखा गया है। כַּנִּי यहाँ पहले के आधिकारिक पद को सूचित करता है।
- source_word: וְאֹתוֹ תָלָה
  choice: लेकिन उसे लटका दिया
  rationale: ‘लेकिन’ दोनों व्यक्तियों के विपरीत परिणामों को स्वाभाविक हिन्दी में स्पष्ट करता है। ‘लटका दिया’ תלה के मूल अर्थ को बनाए रखता है और मृत्यु की विधि के बारे में मूल से अधिक विशिष्ट नहीं होता।
