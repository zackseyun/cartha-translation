  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘फ़िरौन’ प्रचलित बाइबलीय रूप है। आरम्भिक וְ को अलग ‘अब’ से नहीं दर्शाया गया; वाक्य-संबंध हिन्दी की संरचना से स्पष्ट है।
