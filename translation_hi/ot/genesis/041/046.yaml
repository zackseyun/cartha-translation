base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/046.yaml
  text: Joseph was thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from before Pharaoh and traveled through all the land of Egypt.
translation:
  language: hi
  text: यूसुफ तीस वर्ष का था जब वह मिस्र के राजा फ़िरौन के सामने खड़ा हुआ। फिर यूसुफ फ़िरौन के सामने से निकलकर मिस्र के सारे देश से होकर गुज़रा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: तीस वर्ष का था
  rationale: हिब्रू में आयु बताने वाले मुहावरे का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: בְּעָמְדוֹ לִפְנֵי פַּרְעֹה
  choice: जब ... फ़िरौन के सामने उपस्थित हुआ
  rationale: यह रचना उस समय को सूचित करती है जब यूसुफ राजकीय सेवा के लिए फ़िरौन की उपस्थिति में खड़ा हुआ; ‘उपस्थित हुआ’ आधुनिक हिन्दी में प्रसंगानुकूल है।
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: मिस्र के राजा फ़िरौन
  rationale: सम्बन्धवाची पदबंध को हिन्दी की स्वाभाविक शब्द-व्यवस्था में रखा गया है और फ़िरौन की राजकीय उपाधि स्पष्ट रहती है।
- source_word: וַיֵּצֵא ... מִלִּפְנֵי פַרְעֹה
  choice: फिर ... फ़िरौन के सामने से निकलकर
  rationale: कथात्मक क्रम और फ़िरौन की उपस्थिति से प्रस्थान—दोनों को बनाए रखता है।
- source_word: וַיַּעְבֹר בְּכָל אֶרֶץ מִצְרָיִם
  choice: मिस्र के सारे देश में घूमता रहा
  rationale: क्रिया व्यापक क्षेत्र में भ्रमण को दर्शाती है; हिन्दी में यह मिस्र भर में यूसुफ की गतिविधि को सहज रूप से व्यक्त करता है, बिना उसके उद्देश्य को पाठ से अधिक निश्चित किए।
