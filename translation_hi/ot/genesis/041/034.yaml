  text: יַעֲשֶׂ֣ה פַרְעֹ֔ה וְ/יַפְקֵ֥ד פְּקִדִ֖ים עַל הָ/אָ֑רֶץ וְ/חִמֵּשׁ֙ אֶת אֶ֣רֶץ מִצְרַ֔יִם בְּ/שֶׁ֖בַע שְׁנֵ֥י הַ/שָּׂבָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/034.yaml
  text: 'Let Pharaoh do this: let him appoint overseers over the land and take a fifth of the produce of the land of Egypt during the seven years of abundance[a].'
translation:
  language: hi
  text: 'फ़िरौन यह करे: वह पूरे देश पर अधिकारियों को नियुक्त करे और भरपूरी के सात वर्षों के दौरान मिस्र देश की उपज का पाँचवाँ भाग ले[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मिस्र देश से पाँचवाँ भाग वसूल करे।’ इब्रानी क्रिया का अर्थ भरपूरी के वर्षों में पाँचवाँ हिस्सा लगाना या लेना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲשֶׂה
  choice: फ़िरौन यह करे
  rationale: עָשָׂה का सामान्य अर्थ ‘करना’ है। प्रसंग में यूसुफ परामर्श दे रहा है; इसलिए हिन्दी में आज्ञार्थक-परामर्शात्मक ‘यह करे’ स्वाभाविक है और निहित कर्म को स्पष्ट करता है।
- source_word: וְיַפְקֵד
  choice: वह ... नियुक्त करे
  rationale: הפקיד यहाँ उत्तरदायित्व के पद पर व्यक्तियों को ठहराने के अर्थ में है; ‘नियुक्त करे’ प्रशासनिक प्रसंग को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: פְּקִדִים
  choice: अधिकारियों
  rationale: यह संज्ञा नियुक्त प्रशासनिक पदाधिकारियों को सूचित करती है। ‘अधिकारियों’ आधुनिक हिन्दी में सहज है और ‘निरीक्षकों’ की अपेक्षा भूमिका को अनावश्यक रूप से संकीर्ण नहीं करती।
- source_word: עַל הָאָרֶץ
  choice: पूरे देश पर
  rationale: यहाँ אֶרֶץ फ़िरौन के अधीन भूभाग/देश है और עַל प्रशासनिक अधिकार-क्षेत्र दर्शाता है। ‘पूरे’ निहित व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְחִמֵּשׁ
  choice: पाँचवाँ भाग ले
  rationale: חמשׁ का पिएल रूप इस प्रसंग में पाँचवाँ हिस्सा लेने अथवा वसूल करने के अर्थ में समझा जाता है। मुख्य पाठ में ‘ले’ संक्षिप्त है; सम्भव कर-संग्रहात्मक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: אֶת אֶרֶץ מִצְרַיִם
  choice: मिस्र देश की उपज का
  rationale: शाब्दिक कर्म ‘मिस्र देश’ है, पर प्रसंग में देश स्वयं नहीं बल्कि उसकी पैदावार का पाँचवाँ भाग लिया जाना है। ‘उपज’ जोड़ने से हिन्दी में अभिप्राय स्पष्ट होता है।
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: भरपूरी के सात वर्षों के दौरान
  rationale: שָׂבָע तृप्ति, परिपूर्णता अथवा प्रचुरता को दर्शाता है और कथा में भरपूर फसल वाले वर्षों के लिए प्रयुक्त है। ‘भरपूरी’ सरल, वर्तमान और कथात्मक हिन्दी है।
