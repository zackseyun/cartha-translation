  yaml_path: translation/ot/genesis/041/041.yaml
  text: And Pharaoh said to Joseph, “See, I have set you over all the land of Egypt.”
translation:
  language: hi
  text: तब फ़िरौन ने यूसुफ से कहा, “देख, मैंने तुझे मिस्र के पूरे देश पर अधिकारी ठहराया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का हिन्दी में प्रचलित रूप।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में व्यापक रूप से प्रचलित रूप।
- source_word: רְאֵה
  choice: देख
  rationale: आज्ञार्थक रूप घोषणा की ओर ध्यान खींचता है; ‘देख’ इसका सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: נָתַתִּי אֹתְךָ עַל
  choice: मैंने तुझे ... पर अधिकार दिया है
  rationale: נתן का मूल अर्थ ‘देना’ है, पर עַל के साथ इस प्रशासनिक संदर्भ में किसी को शासनाधिकार सौंपने का भाव है। यह हिन्दी प्रयोग उस भाव को स्पष्ट और स्वाभाविक रखता है।
- source_word: כָּל אֶרֶץ מִצְרָיִם
  choice: मिस्र के पूरे देश
  rationale: כָּל की व्यापकता और אֶרֶץ के क्षेत्र/देश संबंधी अर्थ दोनों सुरक्षित रहते हैं।
