source:
  edition: WLC
  text: וְ/שָׁ֨ם אִתָּ֜/נוּ נַ֣עַר עִבְרִ֗י עֶ֚בֶד לְ/שַׂ֣ר הַ/טַּבָּחִ֔ים וַ/נְּ֨סַפֶּר ל֔/וֹ וַ/יִּפְתָּר לָ֖/נוּ אֶת חֲלֹמֹתֵ֑י/נוּ אִ֥ישׁ כַּ/חֲלֹמ֖/וֹ פָּתָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/012.yaml
  text: And there with us was a young Hebrew man[a], a servant of the captain of the guard, and we told him, and he interpreted our dreams for us[c][b]; he interpreted each man's dream according to his dream.
translation:
  language: hi
  text: वहाँ हमारे साथ एक इब्री युवक था, जो अंगरक्षकों के प्रधान[a] का दास था। हमने उसे अपने सपने सुनाए और उसने हमारे लिए उनका अर्थ बताया; उसने हर एक के सपने के अनुसार उसका अर्थ बताया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वध करने वालों का प्रधान”; यह राजकीय अंगरक्षकों अथवा जल्लादों के अधिकारी का पदनाम था।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר עִבְרִי
  choice: एक इब्री युवक
  rationale: नַעַר यहाँ बालक के बजाय युवक को सूचित करता है; עִבְרִי का प्रचलित और स्पष्ट हिन्दी रूप ‘इब्री’ है।
- source_word: עֶבֶד
  choice: दास
  rationale: यह शब्द यूसुफ की बंधुआ और अधीनस्थ स्थिति बताता है; ‘दास’ इस सामाजिक स्थिति को ‘सेवक’ से अधिक स्पष्ट रूप में व्यक्त करता है।
- source_word: שַׂר הַטַּבָּחִים
  choice: अंगरक्षकों का प्रधान
  rationale: मिस्री राजदरबार के इस पदनाम के लिए यह संदर्भानुकूल और हिन्दी पाठकों के लिए स्वाभाविक अभिव्यक्ति है; शब्द का शाब्दिक संबंध वध करने वालों अथवा जल्लादों से है।
- source_word: וַנְּסַפֶּר לוֹ
  choice: हमने उसे अपने सपने सुनाए
  rationale: संदर्भ में ספּר का अर्थ सपनों का वृत्तांत सुनाना है; हिन्दी में ‘सपने सुनाए’ स्वाभाविक है।
- source_word: וַיִּפְתָּר לָנוּ אֶת חֲלֹמֹתֵינוּ
  choice: उसने हमारे लिए उनका अर्थ बताया
  rationale: सपनों के संदर्भ में פתר उनका अर्थ खोलने या व्याख्या करने को दर्शाता है; साधारण आधुनिक हिन्दी में ‘अर्थ बताया’ स्पष्ट और सहज है।
- source_word: אִישׁ כַּחֲלֹמוֹ פָּתָר
  choice: उसने हर एक के सपने के अनुसार उसका अर्थ बताया
  rationale: यह रचना व्याख्या के व्यक्तिगत और प्रत्येक सपने के अनुरूप होने पर बल देती है; हिन्दी वाक्य उस वितरणात्मक भाव को बनाए रखता है।
