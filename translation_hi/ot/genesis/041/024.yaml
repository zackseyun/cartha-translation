  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘बालियाँ’ भारतीय पाठकों के लिए ‘अनाज के सिरे’ की तुलना में अधिक स्वाभाविक है। मूल के अर्थ-संदर्भ के कारण अंतिम खंड में ‘इसका अर्थ’ स्पष्ट किया गया है, जबकि ‘से कहा’ में कोई अनकहा कर्म नहीं जोड़ा गया।
