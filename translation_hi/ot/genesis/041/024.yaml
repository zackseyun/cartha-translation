  text: וַ/תִּבְלַ֨עְןָ֙ הָ/שִׁבֳּלִ֣ים הַ/דַּקֹּ֔ת אֵ֛ת שֶׁ֥בַע הַֽ/שִׁבֳּלִ֖ים הַ/טֹּב֑וֹת וָֽ/אֹמַר֙ אֶל הַֽ/חַרְטֻמִּ֔ים וְ/אֵ֥ין מַגִּ֖יד לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/024.yaml
  text: And the thin ears swallowed up the seven good ears[a]. Then I told the magicians[c][b], but there was no one who could explain it to me.
translation:
  language: hi
  text: और पतली बालियाँ उन सात अच्छी बालियों को निगल गईं। तब मैंने यह बात जादूगरों[a] को बताई, पर कोई भी मुझे इसका अर्थ न बता सका[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘जादूगर’ के लिए प्रयुक्त इब्रानी शब्द मिस्र के अनुष्ठान-विशेषज्ञों और स्वप्नों का अर्थ बताने वालों को भी सूचित करता है।
    reason: cultural_note
  - marker: b
    text: या, “पर कोई भी मेरे लिए इसका अर्थ न बता सका।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְןָ
  choice: निगल गईं
  rationale: בלע के सजीव स्वप्न-चित्र को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שִׁבֳּלִים
  choice: बालियाँ
  rationale: कृषि-संदर्भ में अनाज की बालियों के लिए प्रचलित, संक्षिप्त और स्वाभाविक हिन्दी शब्द है।
- source_word: הַדַּקֹּת
  choice: पतली
  rationale: मूल विशेषण के सामान्य अर्थ को बिना अतिरिक्त व्याख्यात्मक रंग के सुरक्षित रखता है।
- source_word: הַטֹּבוֹת
  choice: अच्छी
  rationale: טוב का निकटतम सामान्य अर्थ है और स्वप्न में बालियों की अनुकूल दशा का संकेत देता है।
- source_word: וָאֹמַר אֶל
  choice: तब मैंने ... से कहा
  rationale: मूल में स्पष्ट कर्म नहीं है; इसलिए हिन्दी में भी ‘स्वप्न’ या ‘यह बात’ जोड़ने के बजाय कथन की स्वाभाविक संरचना रखी गई है।
- source_word: הַחַרְטֻמִּים
  choice: जादूगरों
  rationale: उत्पत्ति और निर्गमन के मिस्री संदर्भ में यह मानक संक्षिप्त अनुवाद है; सांस्कृतिक अर्थ-पृष्ठभूमि पाद-टिप्पणी में स्पष्ट की गई है।
- source_word: וְאֵין מַגִּיד לִי
  choice: पर कोई भी मुझे इसका अर्थ न बता सका
  rationale: संदर्भ में נגד केवल कथन नहीं, स्वप्न का अर्थ प्रकट करने को सूचित करता है; यह हिन्दी में उस आशय को स्वाभाविक रूप से व्यक्त करता है।
