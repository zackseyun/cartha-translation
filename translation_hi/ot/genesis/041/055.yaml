review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the sequence, Egypt-wide scope, plea for bread, and Pharaoh’s directive. However, “फ़िरौन के सामने” changes the Hebrew addressee relation (“to Pharaoh”) into a spatial/postural expression. “भूख से व्याकुल” adds an emotional intensity not explicitly expressed by the verb, whose direct sense is that Egypt became hungry.
  naturalness: The proposed revision uses natural modern Hindi while retaining the Hebrew’s collective phrasing. “फ़िरौन से ... पुकार उठे” is an idiomatic rendering of a distress-cry directed to Pharaoh.
  terminology: “फ़िरौन,” “यूसुफ़,” and “रोटी” are appropriate established Hindi biblical terms. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: “फ़िरौन के सामने पुकार उठे”
    rationale: The Hebrew says that the people cried out to Pharaoh (אֶל־פַּרְעֹה). “के सामने” means ‘before/in the presence of’ and weakens or shifts the directed appeal. Use “फ़िरौन से ... पुकार उठे.”
  - severity: low
    issue: “भूख से व्याकुल हो गया”
    rationale: This is understandable, but “व्याकुल” adds a degree of emotional distress beyond וַתִּרְעַב (‘became hungry’). A more direct Hindi expression better preserves the source wording.
  revised_text: और मिस्र का सारा देश भूखा हो गया, और लोग रोटी के लिए फ़िरौन से पुकार उठे। तब फ़िरौन ने सारे मिस्र से कहा, “यूसुफ़ के पास जाओ; वह तुमसे जो कहे, वही करो।”
  revised_footnotes: []
  revision_rationale: The revision corrects the addressee of the people’s cry and renders the onset of hunger more directly, without converting it into the more interpretive ‘famine’ or adding emotional force. The final command remains natural and faithfully conveys ‘what he says to you, do.’ No footnote is necessary in Hindi because the wording is both direct and idiomatic.
