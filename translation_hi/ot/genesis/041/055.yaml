- from: और मिस्र का सारा देश भूख से व्याकुल हो गया, और लोग रोटी के लिए फ़िरौन के सामने पुकार उठे। तब फ़िरौन ने समस्त मिस्र से कहा, “यूसुफ़ के पास जाओ; वह तुमसे जो कहे, वही करो।”
  to: और मिस्र का सारा देश भूखा हो गया, और लोग रोटी के लिए फ़िरौन से पुकार उठे। तब फ़िरौन ने सारे मिस्र से कहा, “यूसुफ़ के पास जाओ; वह तुमसे जो कहे, वही करो।”
  rationale: The revision corrects the addressee of the people’s cry and renders the onset of hunger more directly, without converting it into the more interpretive ‘famine’ or adding emotional force. The final command remains natural and faithfully conveys ‘what he says to you, do.’ No footnote is necessary in Hindi because the wording is both direct and idiomatic.
