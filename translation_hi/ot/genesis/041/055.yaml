source:
  edition: WLC
  text: וַ/תִּרְעַב֙ כָּל אֶ֣רֶץ מִצְרַ֔יִם וַ/יִּצְעַ֥ק הָ/עָ֛ם אֶל פַּרְעֹ֖ה לַ/לָּ֑חֶם וַ/יֹּ֨אמֶר פַּרְעֹ֤ה לְ/כָל מִצְרַ֨יִם֙ לְכ֣וּ אֶל יוֹסֵ֔ף אֲשֶׁר יֹאמַ֥ר לָ/כֶ֖ם תַּעֲשֽׂוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/055.yaml
  text: And all the land of Egypt became hungry[a], and the people cried out to Pharaoh for bread. Pharaoh said to all Egypt, “Go to Joseph. What he says to you, do.”
translation:
  language: hi
  text: और मिस्र का सारा देश भूखा हो गया, और लोग रोटी के लिए फ़िरौन से पुकार उठे। तब फ़िरौन ने सारे मिस्र से कहा, “यूसुफ़ के पास जाओ; वह तुमसे जो कहे, वही करो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַב
  choice: भूख से व्याकुल हो गया
  rationale: क्रिया רעב देश में भूख पड़ने अथवा उसके अनुभव को व्यक्त करती है। हिंदी में किसी देश को सीधे ‘भूखा हो गया’ कहना संभव है, पर ‘भूख से व्याकुल हो गया’ व्यापक जन-संकट और कथानक की प्रगति को अधिक स्वाभाविक रूप से व्यक्त करता है, बिना इसे केवल तकनीकी ‘अकाल’ तक सीमित किए।
- source_word: כָּל אֶרֶץ מִצְרַיִם
  choice: मिस्र का सारा देश
  rationale: यह इब्रानी पदबंध में उपस्थित ‘देश/भूमि’ को बनाए रखते हुए आधुनिक हिंदी में स्वाभाविक है।
- source_word: וַיִּצְעַק הָעָם
  choice: लोग ... पुकार उठे
  rationale: צעק संकट में सहायता के लिए की गई तीव्र पुकार को दर्शाता है; ‘पुकार उठे’ उसकी तात्कालिकता और व्याकुलता व्यक्त करता है।
- source_word: לַלָּחֶם
  choice: रोटी के लिए
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, यद्यपि प्रसंग में यह व्यापक रूप से अन्न या भोजन का द्योतक हो सकता है। पाठ की मूर्त अभिव्यक्ति बनाए रखने के लिए ‘रोटी’ चुना गया।
- source_word: לְכָל מִצְרַיִם
  choice: समस्त मिस्र से
  rationale: मूल पाठ स्थान-नाम ‘मिस्र’ को सामूहिक अर्थ में प्रयोग करता है। ‘समस्त मिस्र से’ इस सामूहिक संबोधन को बनाए रखता है और हिंदी में बोधगम्य है।
- source_word: לְכוּ אֶל יוֹסֵף
  choice: यूसुफ़ के पास जाओ
  rationale: आज्ञार्थक क्रिया और पूर्वसर्ग का सीधा, स्वाभाविक हिंदी अनुवाद; नाम का प्रचलित हिंदी रूप ‘यूसुफ़’ रखा गया।
- source_word: אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ
  choice: वह तुमसे जो कहे, वही करो
  rationale: यह मूल वाक्य के अग्रस्थ संबंधवाचक भाव और ‘कहने’ तथा ‘करने’ के संबंध को सुरक्षित रखता है। ‘वही’ हिंदी में बल को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फ़िरौन’ और ‘यूसुफ़’ के प्रचलित हिंदी बाइबलीय नाम-रूप अपनाए गए हैं। अंग्रेज़ी परत में दिया गया फुटनोट वस्तुतः अंतिम आदेश के अधिक मुहावरेदार रूप से संबंधित प्रतीत होता है, न कि ‘became hungry’ से; हिंदी मुख्य पाठ स्वयं स्वाभाविक होने के कारण कोई फुटनोट आवश्यक नहीं समझा गया।
