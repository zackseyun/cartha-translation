lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक है। यहाँ דּבר प्रत्यक्ष वचन का परिचय देता है, इसलिए ‘कहा’ सहज है।
- source_word: שַׂר הַמַּשְׁקִים
  choice: पिलानेवालों के प्रधान
  rationale: यह फ़िरौन के पेय परोसनेवाले अधिकारियों के मुखिया का दरबारी पद है। यह पदनाम आधुनिक हिन्दी में अर्थ स्पष्ट रखता है।
- source_word: אֶת־פַּרְעֹה
  choice: फ़िरौन से
  rationale: हिब्रू में फ़िरौन क्रिया का कर्म है, पर हिन्दी में ‘कहा’ के साथ ‘से’ स्वाभाविक प्रयोग है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: हिब्रू का मानक वचन-परिचायक हिन्दी में अलग से ‘यह कहते हुए’ जोड़ने के बजाय मुख्य क्रिया के साथ स्वाभाविक रूप से समाहित किया गया है।
- source_word: אֶת חֲטָאַי
  choice: अपने अपराधों
  rationale: חטא पाप, अपराध या दोष का व्यापक अर्थ रख सकता है। दरबारी प्रसंग में ‘अपराध’ नैतिक तथा राजकीय दोष—दोनों की संभावना बनाए रखता है।
- source_word: אֲנִי מַזְכִּיר
  choice: मैं ... याद करता हूँ
  rationale: हिफ़ील रूप का अर्थ स्मरण कराना, उल्लेख करना या स्मरण में लाना हो सकता है। इस संदर्भ में वक्ता अपने पुराने अपराधों को फ़िरौन के सामने स्मरण कर रहा है; ‘याद करता हूँ’ स्वाभाविक हिन्दी है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह आधुनिक हिन्दी का स्वाभाविक शब्द है और हिब्रू के कालगत बल को बनाए रखता है।
