  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים צְנֻמ֥וֹת דַּקּ֖וֹת שְׁדֻפ֣וֹת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/023.yaml
  text: And behold[a], seven ears, thin and scorched by the east wind[b], were sprouting after them.
translation:
  language: hi
  text: और देखो, उनके बाद अनाज की सात बालें उग रही थीं, जो सिकुड़ी हुई, पतली और पूरब की हवा से झुलसी हुई थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: स्वप्न-वर्णन में नए दृश्य को सजीव ढंग से सामने लाने वाली विस्मयात्मक-निर्देशक शक्ति को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: अनाज की सात बालें
  rationale: कृषि-संदर्भ में שִׁבֳּלִים अनाज के दाने वाले ऊपरी भाग को दर्शाता है; 'अनाज की बालें' स्पष्ट और स्वाभाविक है।
- source_word: צְנֻמוֹת
  choice: सिकुड़ी हुई
  rationale: यह दुर्लभ विशेषण दुबलेपन के साथ सिकुड़े या मुरझाए रूप का बोध देता है और अगले विशेषण דַּקּוֹת से उसका भेद बचाता है।
- source_word: דַּקּוֹת
  choice: पतली
  rationale: मूल विशेषण का सीधा अर्थ पतला या महीन है; यहाँ बालों की क्षीण दशा के लिए 'पतली' उपयुक्त है।
- source_word: שְׁדֻפוֹת קָדִים
  choice: पुरवाई से झुलसी हुई
  rationale: קָדִים पूर्व दिशा से आने वाली गर्म, फसल को हानि पहुँचाने वाली हवा है; 'पुरवाई' हिन्दी में पूर्वी हवा का स्वाभाविक नाम है और 'झुलसी हुई' उसके प्रभाव को व्यक्त करता है।
- source_word: צֹמְחוֹת
  choice: उग रही थीं
  rationale: हिब्रू कृदंत दृश्य के भीतर जारी क्रिया को दिखाता है, जिसे अपूर्ण भूतकाल स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַחֲרֵיהֶם
  choice: उनके बाद
  rationale: पहले वर्णित सात अच्छी बालों के बाद इन बालों के निकलने की क्रमिकता को स्पष्ट करता है।
