  register: भाषा आधुनिक, गरिमापूर्ण और ग्रामीण-कृषि बिंब के अनुरूप रखी गई है। हिब्रू में एक के बाद एक आए तीनों नकारात्मक वर्णनों—सिकुड़ी, पतली और पुरवाई से झुलसी—को अलग-अलग सुरक्षित रखा गया है।
