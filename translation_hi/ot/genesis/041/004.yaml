  yaml_path: translation/ot/genesis/041/004.yaml
  text: Then the cows ugly in appearance and thin in flesh ate the seven cows beautiful in appearance and fat[a], and Pharaoh awoke.
translation:
  language: hi
  text: तब वे कुरूप और दुबली गायें उन सात सुन्दर और मोटी गायों को खा गईं[a], और फ़िरौन जाग उठा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दिखने में बुरी और दुबली गायें ... दिखने में सुन्दर और हृष्ट-पुष्ट गायों को”; इब्रानी शब्दों के अर्थ क्रमशः “बुरी” और “स्वस्थ/हृष्ट-पुष्ट” भी हो सकते हैं, पर यहाँ दुबली और मोटी गायों का शारीरिक विरोध अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: तब ... खा गईं
  rationale: स्त्रीलिंग बहुवचन वय्यिक्तोल स्वप्न की अगली घटना बताता है। ‘खा गईं’ क्रिया का सीधा अर्थ है; ‘तब’ कथा की क्रमिक गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַפָּרוֹת
  choice: गायें
  rationale: यह ‘गाय’ का स्त्रीलिंग बहुवचन है; व्यापक ‘पशु’ की अपेक्षा ‘गायें’ अधिक सटीक है।
- source_word: רָעוֹת הַמַּרְאֶה
  choice: कुरूप
  rationale: शाब्दिक अर्थ ‘दिखने में बुरी’ है; इस प्रसंग में ‘कुरूप’ उसी बाहरी रूप को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְדַקֹּת הַבָּשָׂר
  choice: और दुबली
  rationale: शाब्दिक भाव ‘मांस में पतली’ है। आधुनिक हिन्दी में ‘दुबली’ गायों की शारीरिक दशा को सहजता से व्यक्त करता है।
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: उन सात ... गायों को
  rationale: निश्चित कर्मवाचक पद को हिन्दी में ‘उन सात गायों को’ से स्पष्ट और स्वाभाविक रूप मिला है।
- source_word: יְפֹת הַמַּרְאֶה
  choice: सुन्दर
  rationale: यह ‘दिखने में सुन्दर’ का भाव देता और ‘कुरूप’ के साथ मूल का स्पष्ट विरोध बनाए रखता है।
- source_word: וְהַבְּרִיאֹת
  choice: और मोटी
  rationale: בָּרִיא का अर्थ स्वस्थ, हृष्ट-पुष्ट या मोटा हो सकता है। दुबली गायों के प्रत्यक्ष शारीरिक विरोध के कारण ‘मोटी’ उपयुक्त है।
- source_word: וַיִּיקַץ פַּרְעֹה
  choice: और फ़िरौन जाग उठा
  rationale: यह मूल क्रिया और वाक्यक्रम को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
