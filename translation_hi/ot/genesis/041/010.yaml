  yaml_path: translation/ot/genesis/041/010.yaml
  text: Pharaoh was angry with his servants[a], and he put me in custody in the house of the captain of the guard[b], me and the chief baker.
translation:
  language: hi
  text: फ़िरौन अपने सेवकों पर क्रोधित हुआ, और उसने मुझे अंगरक्षक-दल के प्रधान[b] के घर में हिरासत में रखा[a]—मुझे और प्रधान रसोइए को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पहरे में रख दिया’; इब्रानी शब्द निगरानी में बंद रखे जाने को दर्शाता है और आवश्यक नहीं कि किसी औपचारिक कारागार भवन का संकेत दे।
    reason: lexical_alternative
  - marker: b
    text: ‘अंगरक्षक-दल का प्रधान’ एक दरबारी पदनाम है; इसका अधिक शाब्दिक अर्थ ‘वध करने वालों’ या ‘जल्लादों का प्रधान’ भी हो सकता है।
