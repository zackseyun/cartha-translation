lexical_decisions:
- source_word: קָצַף
  choice: क्रोधित हुआ
  rationale: यह क्रोध व्यक्त करने वाला सामान्य क्रियापद है। ‘क्रोधित हुआ’ गरिमापूर्ण और स्वाभाविक है तथा तीव्रता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: राजदरबार के इस प्रसंग में प्यालावाहक और रसोइया फ़िरौन की सेवा में नियुक्त अधिकारी हैं। ‘सेवक’ मूल शब्द का संबंधपरक भाव बनाए रखता है।
- source_word: בְּמִשְׁמַר
  choice: हिरासत में
  rationale: यह शब्द पहरे में रखे जाने या बंदी अवस्था को दर्शाता है; ‘हिरासत’ किसी औपचारिक कारागार भवन का अनावश्यक संकेत नहीं देती।
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: पहरेदारों के प्रधान के घर
  rationale: मिस्री दरबार के पदनाम को प्रसंगानुकूल ढंग से व्यक्त करता है। मूल पद का अधिक शाब्दिक अर्थ वध करने वालों अथवा जल्लादों का प्रधान हो सकता है।
- source_word: שַׂר הָאֹפִים
  choice: प्रधान रसोइए
  rationale: यह पद रोटी अथवा पकी वस्तुएँ तैयार करने वालों के मुखिया को दर्शाता है। प्रचलित हिंदी बाइबलीय संदर्भ में ‘प्रधान रसोइया’ सहज और संक्षिप्त है।
