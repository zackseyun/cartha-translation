source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף חֲל֣וֹם חָלַ֔מְתִּי וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/אֲנִ֗י שָׁמַ֤עְתִּי עָלֶ֨י/ךָ֙ לֵ/אמֹ֔ר תִּשְׁמַ֥ע חֲל֖וֹם לִ/פְתֹּ֥ר אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/015.yaml
  text: And Pharaoh said to Joseph, “I have dreamed a dream, and there is no one to interpret it. But I have heard it said about you that when you hear a dream, you can interpret it.”
translation:
  language: hi
  text: तब फ़िरौन ने यूसुफ से कहा, “मैंने एक सपना देखा है, पर उसका अर्थ बताने वाला कोई नहीं है। मैंने तुम्हारे बारे में यह सुना है कि तुम सपना सुनकर उसका अर्थ बता सकते हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְתִּי
  choice: मैंने एक सपना देखा है
  rationale: हिब्रू की धातु-पुनरुक्ति का शब्दशः रूप हिंदी में अस्वाभाविक होता; यह स्वाभाविक हिंदी में उसी कथन का पूरा अर्थ देता है।
- source_word: פֹתֵר
  choice: अर्थ बताने वाला
  rationale: सपने के संदर्भ में פטר का आशय उसकी व्याख्या अथवा अर्थ बताना है; यह सामान्य पाठक के लिए स्पष्ट और सहज है।
- source_word: תִּשְׁמַע חֲלוֹם
  choice: सपना सुनकर
  rationale: मूल में ‘सपना सुनना’ है; इसे सुरक्षित रखते हुए हिंदी में स्वाभाविक क्रियाविशेषणीय रूप दिया गया है।
- source_word: לִפְתֹּר אֹתוֹ
  choice: उसका अर्थ बता सकते हो
  rationale: मूल की उद्देश्य/क्षमता-सूचक अभिव्यक्ति को संदर्भानुसार स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: यूसुफ की स्वाभाविक क्षमता बनाम परमेश्वर से मिली व्याख्या
  choice: 'फ़िरौन के कथन को उसकी अपनी समझ के अनुसार रखा गया: ‘तुम ... अर्थ बता सकते हो।’'
  alternative: ‘परमेश्वर की सहायता से अर्थ बता सकते हो’
  rationale: इस पद में फ़िरौन परमेश्वर का उल्लेख नहीं करता; ऐसा जोड़ना अगले पद में यूसुफ के उत्तर को पहले ही समाहित कर देता और कथात्मक तनाव घटाता।
translation_notes:
  register: आधुनिक मानक हिंदी; कथन गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। ‘फ़िरौन’ और ‘यूसुफ’ प्रचलित बाइबलीय नामरूप हैं।
