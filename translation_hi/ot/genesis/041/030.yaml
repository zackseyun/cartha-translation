base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/030.yaml
  text: Then seven years of famine will arise after them[a], and all the abundance in the land of Egypt will be forgotten[b], and the famine will consume the land.
translation:
  language: hi
  text: फिर उनके बाद अकाल के सात वर्ष आएँगे। मिस्र देश की सारी भरपूरी[a] भुला दी जाएगी, और अकाल देश को निगल जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारी बहुतायत।” इब्रानी शब्द तृप्ति या भरपूरी को दर्शाता है, विशेषकर अकाल के विपरीत।
    reason: lexical_alternative
  - marker: b
    text: या, “अकाल देश को नष्ट कर देगा।” इब्रानी क्रिया पूरी तरह खपा देने या विनाश तक पहुँचा देने का अर्थ भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמוּ
  choice: फिर ... आएँगे
  rationale: भविष्यसूचक प्रसंग में वाव-संयुक्त पूर्ण क्रिया आगामी क्रम को व्यक्त करती है। ‘फिर’ क्रम को और ‘आएँगे’ अकाल के वर्षों के आरम्भ को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: שֶׁבַע שְׁנֵי רָעָב
  choice: अकाल के सात वर्ष
  rationale: यह रचनात्मक संबंध को सहज हिन्दी में व्यक्त करता है; רָעָב के लिए इस संदर्भ में ‘अकाल’ सटीक और प्रचलित है।
- source_word: אַחֲרֵיהֶן
  choice: उनके बाद
  rationale: स्त्रीलिंग बहुवचन प्रत्यय पिछले पद में बताए गए भरपूरी के सात वर्षों की ओर संकेत करता है।
- source_word: וְנִשְׁכַּח
  choice: भुला दी जाएगी
  rationale: निफ़अल रूप का कर्मवाच्य अर्थ बनाए रखता है और बताता है कि भीषण अकाल के कारण पिछली भरपूरी स्मृति से मिट जाएगी।
- source_word: כָּל הַשָּׂבָע
  choice: सारी भरपूरी
  rationale: שָׂבָע तृप्ति, भराव या बहुतायत को दर्शाता है। ‘भरपूरी’ अकाल के विपरीत व्यापक समृद्ध उपज और उपलब्धता का भाव रखती है, बिना इसे केवल भंडारित अन्न तक सीमित किए।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश की
  rationale: हिन्दी में भूल जाने वाली भरपूरी को ‘मिस्र देश की’ कहना मूल के स्थान-संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְכִלָּה
  choice: निगल जाएगा
  rationale: क्रिया यहाँ अकाल द्वारा पूरी तरह खपा देने या उजाड़ देने का तीव्र भाव रखती है। ‘निगल जाएगा’ हिन्दी में इस विनाशकारी उपभोग की सजीव छवि बनाए रखता है।
- source_word: הָרָעָב
  choice: अकाल
  rationale: निश्चित संज्ञा पहले बताए गए उसी अकाल को संदर्भित करती है।
- source_word: אֶת הָאָרֶץ
  choice: देश को
  rationale: यहाँ אָרֶץ से मिस्र का पूरा देश अभिप्रेत है; ‘देश’ हिन्दी में स्पष्ट है और प्रभाव के व्यापक क्षेत्र को बनाए रखता है।
