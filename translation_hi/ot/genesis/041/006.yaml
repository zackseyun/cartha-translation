  yaml_path: translation/ot/genesis/041/006.yaml
  text: And behold[a], seven thin ears of grain, scorched by the east wind, were sprouting up after them.
translation:
  language: hi
  text: और देखो, उनके बाद अनाज की सात पतली बालें उग रही थीं, जो पूर्वी हवा से झुलसी हुई थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह स्वप्न में अचानक उभरते नए दृश्य की जीवंतता बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: שֶׁבַע
  choice: सात
  rationale: मूल संख्या का सीधा और स्पष्ट अनुवाद।
- source_word: שִׁבֳּלִים
  choice: अनाज की बालें
  rationale: यह शब्द पौधे के पूरे डंठल के बजाय दाने वाली बाली को सूचित करता है।
- source_word: דַּקּוֹת
  choice: पतली
  rationale: बालियों की दुर्बल और अपरिपुष्ट दशा को सीधे व्यक्त करता है।
- source_word: וּשְׁדוּפֹת קָדִים
  choice: जो पुरवाई से झुलसी हुई थीं
  rationale: שְׁדוּפֹת के विनाशकारी ताप से झुलसने के भाव और קָדִים की पूर्वी हवा, अर्थात पुरवाई, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צֹמְחוֹת
  choice: उग रही थीं
  rationale: स्त्रीलिंग बहुवचन कृदंत दृश्य में जारी क्रिया को दिखाता है; हिन्दी का अपूर्ण भूतकाल इसे सहज रूप से सुरक्षित रखता है।
- source_word: אַחֲרֵיהֶן
  choice: उनके बाद
  rationale: पिछले पद की सात बालियों के बाद प्रकट होने का क्रम बताता है और संभावित स्थानिक अनुक्रम को भी पूरी तरह नकारता नहीं।
