id: GEN.41.20
reference: Genesis 41:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֹּאכַ֨לְנָה֙ הַ/פָּר֔וֹת הָ/רַקּ֖וֹת וְ/הָ/רָע֑וֹת אֵ֣ת שֶׁ֧בַע הַ/פָּר֛וֹת הָ/רִאשֹׁנ֖וֹת הַ/בְּרִיאֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/020.yaml
  text: And the thin and ugly cows ate up the first seven healthy cows[a].
translation:
  language: hi
  text: और दुबली और बदसूरत गायें पहली सात हृष्ट-पुष्ट गायों को खा गईं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुबली और भद्दी दिखने वाली गायें ... पहली सात मोटी गायों को।”
    reason: ‘रעות’ खराब रूप-रंग और ‘בריאות’ स्वस्थ, भरी-पूरी या मोटी दशा व्यक्त कर सकते हैं; यह वैकल्पिक अनुवाद उस शारीरिक-वर्णनात्मक अर्थ को अधिक प्रत्यक्ष करता है।
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: खा गईं
  rationale: אכל का सामान्य अर्थ ‘खाना’ है। स्त्रीलिंग बहुवचन ‘गायें’ के साथ ‘खा गईं’ स्वाभाविक हिन्दी है और पूरे निगल जाने का भाव भी व्यक्त करता है।
- source_word: הַפָּרוֹת
  choice: गायें
  rationale: इब्रानी संज्ञा स्त्रीलिंग बहुवचन है और यहाँ मादा गोवंश को सूचित करती है; इसलिए व्यापक ‘पशु’ की अपेक्षा ‘गायें’ अधिक सटीक है।
- source_word: הָרַקּוֹת
  choice: दुबली
  rationale: यह शब्द गायों की कृश शारीरिक दशा बताता है। ‘दुबली’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: וְהָרָעוֹת
  choice: और बदसूरत
  rationale: यहाँ רעות नैतिक बुराई नहीं, बल्कि गायों के खराब रूप-रंग को बताता है; ‘बदसूरत’ इस प्रसंगगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: सात ... गायों को
  rationale: प्रत्यक्ष कर्म-सूचक אֵת को हिन्दी में ‘को’ से और संख्या-संज्ञा पदबंध को सहज हिन्दी क्रम में व्यक्त किया गया है।
- source_word: הָרִאשֹׁנוֹת
  choice: पहली
  rationale: यह स्वप्न में पहले प्रकट हुई सात गायों को सूचित करता है; ‘पहली’ कालक्रम को स्पष्ट रखता है।
- source_word: הַבְּרִיאֹת
  choice: हृष्ट-पुष्ट
  rationale: यह विशेषण स्वस्थ, मजबूत और भरी-पूरी शारीरिक दशा का बोध देता है। ‘हृष्ट-पुष्ट’ इस अर्थ-परास को केवल ‘स्वस्थ’ या केवल ‘मोटी’ से अधिक पूर्ण रूप में व्यक्त करता है।
