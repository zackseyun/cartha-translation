  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में इब्रानी का आरंभिक संयोजक ‘और’ सुरक्षित है, ताकि पूर्ववर्ती कथन से कथा-संबंध बना रहे।
