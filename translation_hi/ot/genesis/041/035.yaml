  text: וְ/יִקְבְּצ֗וּ אֶת כָּל אֹ֨כֶל֙ הַ/שָּׁנִ֣ים הַ/טֹּבֹ֔ת הַ/בָּאֹ֖ת הָ/אֵ֑לֶּה וְ/יִצְבְּרוּ בָ֞ר תַּ֧חַת יַד פַּרְעֹ֛ה אֹ֥כֶל בֶּ/עָרִ֖ים וְ/שָׁמָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/035.yaml
  text: Let them gather all the food of these coming good years[a], and let them store up grain under Pharaoh’s authority as food in the cities[b], and let them keep it.
translation:
  language: hi
  text: इन आने वाले अच्छे वर्षों की सारी खाद्य उपज इकट्ठी की जाए, और फ़िरौन के अधिकार के अधीन[a] नगरों में भोजन के लिए अनाज जमा किया जाए और उसे सुरक्षित रखा जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “फ़िरौन के हाथ के नीचे”; यह अधिकार या नियंत्रण के लिए प्रयुक्त हिब्रू मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या “उसकी रखवाली की जाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִקְבְּצוּ
  choice: इकट्ठी की जाए
  rationale: प्रस्ताव के संदर्भ में अपूर्ण क्रिया का आदेशात्मक/परामर्शात्मक भाव है; हिंदी में कर्मवाच्य रूप प्रशासनिक निर्देश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל אֹכֶל
  choice: सारी उपज
  rationale: यहाँ संदर्भ भरपूरी के वर्षों में एकत्र किए जाने वाले खाद्य उत्पादन का है; ‘उपज’ हिंदी में व्यापक और स्वाभाविक है, यद्यपि शाब्दिक अर्थ ‘सारा भोजन’ है।
- source_word: הַשָּׁנִים הַטֹּבוֹת הַבָּאֹת הָאֵלֶּה
  choice: इन आनेवाले अच्छे वर्षों
  rationale: यह रूप हिब्रू के संकेतवाचक ‘इन’, वर्तमान कृदंत ‘आनेवाले’ और विशेषण ‘अच्छे’—तीनों को बनाए रखता है।
- source_word: וְיִצְבְּרוּ
  choice: जमा किया जाए
  rationale: क्रिया बड़ी मात्रा में ढेर लगाने या संचित करने को दर्शाती है; प्रशासनिक भंडारण के संदर्भ में ‘जमा करना’ सहज है।
- source_word: בָר
  choice: अनाज
  rationale: शब्द मुख्यतः झाड़ा हुआ धान्य बताता है; ‘अनाज’ पर्याप्त व्यापक है और किसी एक फसल तक अर्थ को सीमित नहीं करता।
- source_word: תַּחַת יַד פַּרְעֹה
  choice: फ़िरौन के अधिकार में
  rationale: शाब्दिक ‘फ़िरौन के हाथ के नीचे’ अधिकार या नियंत्रण का हिब्रू मुहावरा है; अर्थगत हिंदी रूप अधिक स्पष्ट और स्वाभाविक है।
- source_word: אֹכֶל בֶּעָרִים
  choice: नगरों में भोजन के लिए
  rationale: वाक्यांश संचित अनाज के स्थान और प्रयोजन—नगरों में खाद्य-सामग्री—दोनों को सूचित करता है।
- source_word: וְשָׁמָרוּ
  choice: उसकी रखवाली की जाए
  rationale: שׁמר में रखने, सुरक्षित करने और पहरा देने की अर्थ-सीमा है; यहाँ संचित अनाज की सुरक्षा प्रमुख है।
