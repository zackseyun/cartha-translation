source:
  edition: WLC
  text: וַ/יִּקְבֹּ֞ץ אֶת כָּל אֹ֣כֶל שֶׁ֣בַע שָׁנִ֗ים אֲשֶׁ֤ר הָיוּ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יִּתֶּן אֹ֖כֶל בֶּ/עָרִ֑ים אֹ֧כֶל שְׂדֵה הָ/עִ֛יר אֲשֶׁ֥ר סְבִיבֹתֶ֖י/הָ נָתַ֥ן בְּ/תוֹכָֽ/הּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/048.yaml
  text: And he gathered all the food of the seven years that were in the land of Egypt[a], and he put the food in the cities. In each city he put the food from the fields around it.
translation:
  language: hi
  text: उसने मिस्र देश में आए सात वर्षों की सारी उपज इकट्ठी की और उसे नगरों में रख दिया। हर नगर में उसने उसके आस-पास के खेतों की उपज रखी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: उसने ... इकट्ठी की
  rationale: קבץ का अर्थ एकत्र या इकट्ठा करना है; कथात्मक हिंदी में ‘इकट्ठी की’ सहज और सटीक है।
- source_word: כָּל אֹכֶל
  choice: सारी उपज
  rationale: אֹכֶל का मूल अर्थ ‘भोजन’ है, पर यहाँ खेतों से प्राप्त और नगरों में संचित सामग्री का संदर्भ है; ‘उपज’ अनाज तक अर्थ को सीमित किए बिना कृषि-संदर्भ स्पष्ट करती है।
- source_word: שֶׁבַע שָׁנִים אֲשֶׁר הָיוּ בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में आए सात वर्षों
  rationale: हिब्रू में शाब्दिक रूप से वर्ष ‘मिस्र देश में थे’; हिंदी में वर्षों के घटित होने के लिए ‘आए’ स्वाभाविक है और पूर्वोक्त बहुतायत के सात वर्षों की ओर संकेत बनाए रखता है।
- source_word: וַיִּתֶּן אֹכֶל בֶּעָרִים
  choice: उसे नगरों में रख दिया
  rationale: נתן का सामान्य अर्थ देना या रखना है। ‘रख दिया’ मूल क्रिया के निकट है; ‘भंडार किया’ की अतिरिक्त व्याख्या आवश्यक नहीं।
- source_word: אֹכֶל שְׂדֵה הָעִיר אֲשֶׁר סְבִיבֹתֶיהָ
  choice: हर नगर में ... उसके आस-पास के खेतों की उपज
  rationale: 'हिब्रू संबंधवाचक और पुनरारंभिक रचना को स्वाभाविक हिंदी में वितरक अर्थ के साथ व्यक्त किया गया है: प्रत्येक नगर में उसी के आसपास के खेतों की उपज रखी गई।'
- source_word: נָתַן בְּתוֹכָהּ
  choice: हर नगर में ... रखी
  rationale: בְּתוֹכָהּ का आशय उस नगर के भीतर है। हिंदी में ‘हर नगर में’ स्त्रीलिंग सर्वनाम की संभावित अस्पष्टता हटाते हुए वितरक अर्थ स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक रूप। ‘उपज’ कृषि-संदर्भ को स्पष्ट करती है, पर उसे केवल ‘अनाज’ तक सीमित नहीं करती। हिब्रू की पुनरारंभिक संरचना को अर्थ की पुनरावृत्ति बनाए रखते हुए स्वाभाविक हिंदी वाक्य-विन्यास में ढाला गया है।
