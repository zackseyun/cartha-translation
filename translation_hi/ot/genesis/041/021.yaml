  yaml_path: translation/ot/genesis/041/021.yaml
  text: And they went into their bellies[a], but it was not known that they had gone into their bellies, and their appearance was bad, just as at the beginning[b]. Then I awoke.
translation:
  language: hi
  text: वे मोटी गायें दुबली गायों के पेटों में चली गईं[a], लेकिन यह मालूम नहीं हुआ कि वे उनके पेटों में चली गई थीं; दुबली गायों का रूप पहले जैसा ही बुरा था। तब मैं जाग गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘उनके भीतरी भाग में’ है। इस स्वप्न के प्रसंग में ‘पेटों में’ उस चित्र को स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה אֶל־קִרְבֶּנָה
  choice: वे मोटी गायें दुबली गायों के पेट में चली गईं
  rationale: בוא के स्त्रीलिंग बहुवचन रूप का कर्ता पिछले पद में खाई गई मोटी गायें हैं। קֶרֶב का मूल अर्थ ‘भीतरी भाग’ है; स्वप्न के शारीरिक चित्र में ‘पेट’ स्वाभाविक है। हिन्दी में दोनों समूहों को स्पष्ट नाम देने से सर्वनाम का भ्रामक अर्थ टलता है।
- source_word: וְלֹא נוֹדַע
  choice: पर यह पता ही नहीं चलता था
  rationale: ידע का निफ़अल रूप यहाँ उस बात के दिखाई या समझ में न आने को व्यक्त करता है। ‘पता ही नहीं चलता था’ स्वाभाविक हिन्दी में इस अप्रत्यक्ष भाव और स्वप्न के दृश्य पक्ष को रखता है।
- source_word: כִּי בָאוּ אֶל־קִרְבֶּנָה
  choice: कि वे उनके पेट में गई हैं
  rationale: כִּי उस बात की विषय-वस्तु प्रस्तुत करता है जिसका पता नहीं चलता था। मूल की पुनरावृत्ति को बनाए रखा गया है, जबकि पहले उल्लेख में गायों को स्पष्ट कर देने से यहाँ सर्वनाम समझ में आते हैं।
- source_word: וּמַרְאֵיהֶן רַע כַּאֲשֶׁר בַּתְּחִלָּה
  choice: दुबली गायों का रूप आरम्भ की तरह ही बुरा था
  rationale: מַרְאֶה दृश्य रूप है और רַע को व्यापक ‘बुरा’ रखा गया है, ताकि इसे केवल ‘कुरूप’ या ‘दुबला’ मानकर सीमित न किया जाए। कर्ता को स्पष्ट करने के लिए ‘दुबली गायों’ कहा गया है।
- source_word: וָאִיקָץ
  choice: तब मैं जाग गया
  rationale: יקץ का प्रथम पुरुष एकवचन रूप स्वप्न-वर्णन की अगली और अंतिम घटना बताता है; ‘तब’ हिन्दी कथा-क्रम में स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पिछले पद के आधार पर ‘मोटी गायें’ और ‘दुबली गायें’ स्पष्ट किए गए हैं, क्योंकि केवल ‘वे’ और ‘उनके’ कहने पर हिन्दी में ऐसा भ्रम हो सकता है मानो गायें अपने ही पेट में चली गईं।
