  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'घराने के अधिकारी' प्रशासनिक अधिकार को स्पष्ट करता है; 'प्रजा' राजकीय संदर्भ के अनुकूल है। शाब्दिक रूप की असामान्यता और संभावित सम्मान/अधीनता का भाव पादटिप्पणी में संरक्षित है।
