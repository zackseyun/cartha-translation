  text: אַתָּה֙ תִּהְיֶ֣ה עַל בֵּיתִ֔/י וְ/עַל פִּ֖י/ךָ יִשַּׁ֣ק כָּל עַמִּ֑/י רַ֥ק הַ/כִּסֵּ֖א אֶגְדַּ֥ל מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/040.yaml
  text: You shall be over my house[a], and all my people shall obey your command. Only with respect to the throne will I be greater than you.
translation:
  language: hi
  text: तुम मेरे घराने के प्रभारी होगे, और मेरी सारी प्रजा तुम्हारे आदेश का पालन करेगी। केवल सिंहासन के मामले में ही मैं तुमसे बड़ा रहूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “और मेरी सारी प्रजा तुम्हारे मुँह के अनुसार चूमेगी।” यहाँ इस अभिव्यक्ति को सामान्यतः यूसुफ की आज्ञा मानने या उसके आदेश पर अधीनता प्रकट करने के अर्थ में समझा जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל בֵּיתִי
  choice: मेरे घराने के अधिकारी
  rationale: עַל यहाँ अधिकार और देखरेख का भाव देता है। 'घराना' फिरौन के निजी गृह के साथ उसके राजकीय घरेलू प्रबंध को भी समेट सकता है; 'अधिकारी' संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וְעַל פִּיךָ יִשַּׁק
  choice: तुम्हारे आदेश पर ... चलेगी
  rationale: शाब्दिक रूप से इसमें 'तुम्हारे मुँह पर/अनुसार ... चूमेगी' है। प्रसंग में यह यूसुफ के मुख से निकले निर्देश के अनुसार आज्ञापालन या अधीनता व्यक्त करता है। सहज हिन्दी में 'आदेश पर चलेगी' उस प्रशासनिक अर्थ को पहुँचाता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: כָּל עַמִּי
  choice: मेरी सारी प्रजा
  rationale: फिरौन के मुख से עַם यहाँ उसके शासनाधीन लोगों को दर्शाता है। राजकीय प्रसंग में 'प्रजा' आधुनिक हिन्दी में 'मेरे लोग' से अधिक सटीक है।
- source_word: רַק הַכִּסֵּא
  choice: केवल सिंहासन के कारण ही
  rationale: רַק सीमा या अपवाद बताता है और כִּסֵּא फिरौन के राजकीय पद का संकेत है। यह पदगत श्रेष्ठता स्पष्ट करता है, व्यक्तिगत या नैतिक श्रेष्ठता नहीं।
- source_word: אֶגְדַּל מִמֶּךָּ
  choice: मैं तुमसे बड़ा रहूँगा
  rationale: גדל के साथ מן श्रेष्ठता दर्शाता है। 'बड़ा रहूँगा' मूल अभिव्यक्ति के निकट, स्वाभाविक और संदर्भ में पदानुक्रमसूचक है।
