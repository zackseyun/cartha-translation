  yaml_path: translation/ot/genesis/041/014.yaml
  text: Then Pharaoh sent and called for Joseph[a], and they quickly brought him out of the pit. He shaved, changed his clothes[c][b], and came to Pharaoh.
translation:
  language: hi
  text: तब फ़िरौन ने लोगों को भेजकर यूसुफ को बुलवाया, और वे उसे गड्ढे[a] से जल्दी बाहर ले आए। उसने दाढ़ी मुँडाई, अपने कपड़े बदले और फ़िरौन के सामने आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कारागार से।” इब्रानी शब्द का शाब्दिक अर्थ “गड्ढा” है और यह कारागार के गड्ढे या हौद-जैसे बंदीस्थान को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא אֶת יוֹסֵף
  choice: यूसुफ को बुलवाने के लिए लोग भेजे
  rationale: दोनों इब्रानी क्रियाओं—‘भेजना’ और ‘बुलाना’—को स्वाभाविक आधुनिक हिन्दी में एक ही बुलावे की संयुक्त कार्रवाई के रूप में व्यक्त करता है।
- source_word: וַיְרִיצֻהוּ
  choice: वे उसे ... जल्दी बाहर ले आए
  rationale: हिफ़ील रूप की कारकता और तत्परता दोनों को व्यक्त करता है; बहुवचन कर्ता संदर्भ से समझे जाने वाले सेवक हैं।
- source_word: מִן הַבּוֹר
  choice: गड्ढे से
  rationale: בּוֹר का मूल अर्थ ‘गड्ढा’ है और यह पहले की कथा से शब्दगत संबंध बनाए रखता है; संदर्भ में यह कारागार-जैसी बंदीगाह है।
- source_word: וַיְגַלַּח
  choice: उसने दाढ़ी बनाई
  rationale: मिस्री राजदरबार में उपस्थित होने से पहले पुरुष के संवारने के संदर्भ में स्वाभाविक हिन्दी; सक्रिय इब्रानी क्रिया को बनाए रखता है।
- source_word: וַיְחַלֵּף שִׂמְלֹתָיו
  choice: अपने कपड़े बदले
  rationale: स्वाभाविक आधुनिक हिन्दी में वस्त्र बदलने की क्रिया और स्वामित्व दोनों स्पष्ट करता है।
- source_word: וַיָּבֹא אֶל פַּרְעֹה
  choice: फ़िरौन के सामने आया
  rationale: शाब्दिक ‘फ़िरौन के पास आया’ के दरबारी आशय को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है, बिना अतिरिक्त घटना जोड़े।
