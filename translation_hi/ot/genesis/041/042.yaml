  text: וַ/יָּ֨סַר פַּרְעֹ֤ה אֶת טַבַּעְתּ/וֹ֙ מֵ/עַ֣ל יָד֔/וֹ וַ/יִּתֵּ֥ן אֹתָ֖/הּ עַל יַ֣ד יוֹסֵ֑ף וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ בִּגְדֵי שֵׁ֔שׁ וַ/יָּ֛שֶׂם רְבִ֥ד הַ/זָּהָ֖ב עַל צַוָּארֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/042.yaml
  text: Then Pharaoh removed his signet ring from his hand and put it on Joseph’s hand[c][b][a], and he clothed him in garments of fine linen and put a gold chain around his neck.
translation:
  language: hi
  text: तब फ़िरौन ने अपनी मुहर की अंगूठी[a] अपने हाथ से उतारकर यूसुफ़ के हाथ में पहना दी। उसने उसे महीन लिनन[b] के वस्त्र पहनाए और उसके गले में सोने की माला[c] डाल दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अंगूठी’; हिब्रू शब्द सामान्य अंगूठी को भी दर्शा सकता है, पर इस राजकीय प्रसंग में सम्भवतः यह फ़िरौन की मुहर की अंगूठी थी, जो सौंपे गए अधिकार का चिह्न थी।
    reason: lexical_alternative
  - marker: b
    text: ‘महीन लिनन’ उस हिब्रू शब्द का अनुवाद है जो धन और सम्मान से जुड़े उच्च कोटि के लिनन को दर्शाता है।
    reason: cultural_note
  - marker: c
    text: या ‘सोने का हार’ अथवा ‘सोने का कंठहार’। हिब्रू शब्द जिस प्रकार के गले के आभूषण को दर्शाता है, उसकी ठीक बनावट निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: उतारकर
  rationale: क्रिया का अर्थ हटाना या उतारना है; हाथ की अंगूठी के प्रसंग में ‘उतारना’ स्वाभाविक और सटीक है।
- source_word: טַבַּעְתּוֹ
  choice: अपनी मुहर की अंगूठी
  rationale: संज्ञा सामान्य अंगूठी भी बता सकती है, पर राजकीय संदर्भ में यह अधिकार सौंपने वाली मुहर की अंगूठी है।
- source_word: מֵעַל יָדוֹ
  choice: अपने हाथ से
  rationale: हिब्रू स्थानवाचक पदबंध का हिन्दी में सहज रूप।
- source_word: וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  choice: यूसुफ़ के हाथ में पहना दी
  rationale: यद्यपि נתן का सामान्य अर्थ ‘देना’ है, ‘हाथ पर’ के साथ यहाँ अंगूठी को हाथ में पहनाने की क्रिया अभिप्रेत है।
- source_word: וַיַּלְבֵּשׁ אֹתוֹ
  choice: उसे ... वस्त्र पहनाए
  rationale: यह राजकीय सम्मान और पद-स्थापन की औपचारिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּגְדֵי שֵׁשׁ
  choice: बढ़िया मलमल के वस्त्र
  rationale: שֵׁשׁ उच्च कोटि के महीन लिनन को दर्शाता है; ‘बढ़िया मलमल’ आधुनिक हिन्दी पाठक के लिए उसकी महीनता और प्रतिष्ठा स्पष्ट करता है।
- source_word: רְבִד הַזָּהָב
  choice: सोने की माला
  rationale: यह गले में पहने जाने वाले स्वर्ण आभूषण का द्योतक है, जिसकी ठीक बनावट अनिश्चित है; ‘माला’ सहज हिन्दी है और अनावश्यक विशिष्टता से बचती है।
- source_word: עַל צַוָּארוֹ
  choice: उसके गले में
  rationale: गले के आभूषण के लिए यह स्वाभाविक हिन्दी प्रयोग है।
