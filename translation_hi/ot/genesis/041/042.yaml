  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। राजकीय पद-स्थापन का भाव सुरक्षित है। ‘माला’ के साथ पादटिप्पणी मूल शब्द की अनिश्चितता बनाए रखती है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
