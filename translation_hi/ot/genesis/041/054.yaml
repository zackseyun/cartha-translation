reference: Genesis 41:54
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תְּחִלֶּ֜ינָה שֶׁ֣בַע שְׁנֵ֤י הָ/רָעָב֙ לָ/ב֔וֹא כַּ/אֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַ/יְהִ֤י רָעָב֙ בְּ/כָל הָ֣/אֲרָצ֔וֹת וּ/בְ/כָל אֶ֥רֶץ מִצְרַ֖יִם הָ֥יָה לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/054.yaml
  text: And the seven years of famine began to come[a], just as Joseph had said. And there was famine in all the lands, but in all the land of Egypt there was bread.
translation:
  language: hi
  text: तब अकाल के वे सात वर्ष आने लगे, जैसा यूसुफ ने कहा था। सब देशों में अकाल पड़ा, पर पूरे मिस्र देश में रोटी[a] थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भोजन था’; यहाँ ‘रोटी’ के लिए प्रयुक्त हिब्रू शब्द का व्यापक अर्थ भोजन या खाद्य-सामग्री भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחִלֶּינָה ... לָבוֹא
  choice: आने लगे
  rationale: यह आरंभसूचक रचना अकाल के वर्षों के आने की शुरुआत बताती है। ‘आने लगे’ हिब्रू मुहावरे के निकट और स्वाभाविक हिन्दी है।
- source_word: שֶׁבַע שְׁנֵי הָרָעָב
  choice: अकाल के वे सात वर्ष
  rationale: सम्बन्धसूचक हिब्रू पदबंध को स्पष्ट हिन्दी में रखा गया है; ‘वे’ पहले से बताए गए सात वर्षों की ओर संकेत करता है।
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: जैसा यूसुफ ने कहा था
  rationale: ‘जैसा’ घटनाक्रम और यूसुफ की पूर्ववाणी के बीच अनुरूपता बनाए रखता है; ‘कहा था’ पूर्वकालिक क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיְהִי רָעָב
  choice: अकाल पड़ा
  rationale: हिन्दी में अकाल के घटित होने के लिए ‘अकाल पड़ा’ स्वाभाविक और अर्थनिष्ठ अभिव्यक्ति है।
- source_word: בְּכָל הָאֲרָצוֹת
  choice: सब देशों में
  rationale: बहुवचन אֲרָצוֹת को सामान्य पाठक के लिए सहज ‘देशों’ से व्यक्त किया गया है, बिना इसे किसी एक भूभाग तक सीमित किए।
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: पर पूरे मिस्र देश में
  rationale: हिब्रू संयोजक सामान्यतः ‘और’ है, पर यहाँ अकाल और मिस्र में उपलब्ध रोटी के स्पष्ट विरोध को हिन्दी में ‘पर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָיָה לָחֶם
  choice: रोटी थी
  rationale: לֶחֶם का ठोस मूल अर्थ ‘रोटी’ मुख्य पाठ में सुरक्षित रखा गया है; प्रसंग में इसका व्यापक अर्थ भोजन या खाद्य-सामग्री भी हो सकता है।
