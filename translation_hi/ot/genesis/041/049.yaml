  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। मूल के उपमान और मात्रा की दोहरी तीव्रता दोनों सुरक्षित रखी गई हैं; अनावश्यक व्याख्यात्मक विस्तार नहीं जोड़ा गया।
