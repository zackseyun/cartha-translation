base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/049.yaml
  text: And Yoseph stored up grain[a], like the sand of the sea, in very great abundance, until he stopped counting[c][b], because there was no number.
translation:
  language: hi
  text: और यूसुफ़ ने समुद्र की रेत के समान बहुत ही अधिक अनाज जमा किया, यहाँ तक कि उसने गिनना छोड़ दिया, क्योंकि उसकी कोई गिनती नहीं थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְבֹּר
  choice: जमा किया
  rationale: צבר का अर्थ ढेर लगाकर संचित करना है; अकाल की तैयारी के प्रशासनिक संदर्भ में ‘जमा किया’ स्वाभाविक और सटीक है।
- source_word: יוֹסֵף
  choice: यूसुफ़
  rationale: यह आधुनिक मानक हिन्दी में इस बाइबिलीय नाम का प्रचलित रूप है और मूल יוֹסֵף को निकटता से दर्शाता है।
- source_word: בָּר
  choice: अनाज
  rationale: यहाँ בָּר सामान्य रूप से खाद्यान्न को सूचित करता है, किसी एक विशेष अन्न को नहीं।
- source_word: כְּחוֹל הַיָּם
  choice: समुद्र की रेत के समान
  rationale: यह विशाल मात्रा बताने वाले मूल इब्रानी उपमान को स्पष्ट और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: הַרְבֵּה מְאֹד
  choice: बहुत ही अधिक
  rationale: दोहरी तीव्रता को सहज हिन्दी में व्यक्त करता है और उपमान के अतिरिक्त मूल की मात्रा-सूचक अभिव्यक्ति भी बनाए रखता है।
- source_word: עַד כִּי
  choice: यहाँ तक कि
  rationale: संचय के उस परिणाम या चरम सीमा को व्यक्त करता है जहाँ गिनना बंद कर दिया गया।
- source_word: חָדַל לִסְפֹּר
  choice: उसने गिनना छोड़ दिया
  rationale: एकवचन क्रिया का सबसे स्वाभाविक कर्ता यूसुफ़ है; यह आधुनिक हिन्दी में सीधा और मुहावरेदार है।
- source_word: כִּי אֵין מִסְפָּר
  choice: क्योंकि वह गिनती से परे था
  rationale: शाब्दिक ‘क्योंकि कोई संख्या नहीं थी’ हिन्दी में अस्वाभाविक है; यह मूल मुहावरे का आशय—अगणनीय मात्रा—स्पष्ट रूप से देता है।
theological_decisions: []
