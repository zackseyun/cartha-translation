translation:
  language: hi
  text: और देखो, नील नदी से सात गायें ऊपर आ रही थीं। वे हृष्ट-पुष्ट और सुडौल थीं, और दलदली घास में चर रही थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और क्या देखा कि
  rationale: स्वप्न-दृश्य की अकस्मात् और सजीव प्रस्तुति को आधुनिक, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִן הַיְאֹר
  choice: नील नदी से
  rationale: मिस्री प्रसंग में יְאֹר विशेष रूप से नील नदी को सूचित करता है।
- source_word: עֹלֹת
  choice: ऊपर आ रही थीं
  rationale: इब्रानी कृदन्त की जारी क्रिया और नदी से निकलकर ऊपर आने का दृश्य सुरक्षित रहता है।
- source_word: שֶׁבַע פָּרוֹת
  choice: सात गायें
  rationale: פָּרוֹת स्त्रीलिंग गोपशुओं को स्पष्ट रूप से दर्शाता है।
- source_word: בְּרִיאוֹת בָּשָׂר
  choice: हृष्ट-पुष्ट
  rationale: देह से स्वस्थ, भरी-पूरी गायों का भाव स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त होता है।
- source_word: וִיפֹת תֹּאַר
  choice: सुडौल
  rationale: आकृति की सुंदरता को पशुओं के संदर्भ में सहज हिन्दी द्वारा व्यक्त करता है।
- source_word: וַתִּרְעֶינָה
  choice: चरने लगीं
  rationale: רעה का पशुओं के घास चरने वाला अर्थ स्पष्ट करता है; कथानक में अगली क्रिया का स्वाभाविक प्रवाह भी देता है।
- source_word: בָּאָחוּ
  choice: दलदली घास में
  rationale: नील-तट की आर्द्रभूमि की वनस्पति का अर्थ सुरक्षित रखता है और केवल सामान्य मैदान का आभास नहीं देता।
