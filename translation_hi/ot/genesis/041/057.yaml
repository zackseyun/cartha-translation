  yaml_path: translation/ot/genesis/041/057.yaml
  text: And all the earth came to Egypt to Joseph to buy grain[a], because the famine was severe in all the earth.
translation:
  language: hi
  text: और सारी धरती के लोग अनाज खरीदने के लिए मिस्र में यूसुफ के पास आए,[a] क्योंकि सारी धरती पर अकाल बहुत भयंकर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारी भूमि के लोग” अथवा “सारे संसार के लोग।” इब्रानी אֶרֶץ का अर्थ “धरती,” “भूमि” या “देश” हो सकता है; यहाँ संभवतः अकाल से प्रभावित व्यापक भूभागों के लोग अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: सारी धरती के लोग
  rationale: इब्रानी में शाब्दिक रूप से ‘सारी धरती’ है, पर क्रिया ‘आए’ के साथ आशय उन देशों या क्षेत्रों के लोगों से है जो अकाल से प्रभावित थे। हिन्दी में ‘के लोग’ जोड़ने से अर्थ स्वाभाविक और स्पष्ट होता है, जबकि ‘सारी धरती’ की व्यापकता बनी रहती है।
- source_word: בָּאוּ מִצְרַיְמָה
  choice: मिस्र में ... आए
  rationale: दिशासूचक प्रत्यय मिस्र की ओर गति बताता है। गंतव्य के रूप में ‘मिस्र में आए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לִשְׁבֹּר
  choice: अनाज खरीदने के लिए
  rationale: अकाल के प्रसंग में שׁבר अनाज मोल लेने या प्राप्त करने का विशेष मुहावरा है; इसलिए निहित वस्तु ‘अनाज’ स्पष्ट की गई है।
- source_word: אֶל יוֹסֵף
  choice: यूसुफ के पास
  rationale: אֶל का मूल अर्थ ‘की ओर/के पास’ है। यूसुफ अनाज-वितरण का अधिकारी था; ‘के पास’ संबंध को बनाए रखता है और ‘उससे’ जैसा अतिरिक्त अर्थ नहीं थोपता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ अव्यय लोगों के मिस्र आने का कारण प्रस्तुत करता है।
- source_word: חָזַק הָרָעָב
  choice: अकाल बहुत भयंकर था
  rationale: חזק का शाब्दिक भाव ‘बलवान/प्रबल होना’ है। अकाल के साथ ‘बहुत भयंकर’ सहज हिन्दी में उसकी तीव्रता व्यक्त करता है।
- source_word: בְּכָל הָאָרֶץ
  choice: सारी धरती पर
  rationale: पद की दूसरी आवृत्ति को ‘सारी धरती’ के रूप में रखकर इब्रानी की पुनरुक्ति और व्यापक कथात्मक दृष्टि सुरक्षित रखी गई है।
