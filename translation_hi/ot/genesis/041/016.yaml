id: GEN.41.16
reference: Genesis 41:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֨עַן יוֹסֵ֧ף אֶת פַּרְעֹ֛ה לֵ/אמֹ֖ר בִּלְעָדָ֑/י אֱלֹהִ֕ים יַעֲנֶ֖ה אֶת שְׁל֥וֹם פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/016.yaml
  text: Joseph answered Pharaoh[a], saying, “It is not in me[b]; God will answer for Pharaoh’s well-being.”
translation:
  language: hi
  text: यूसुफ ने फ़िरौन को उत्तर दिया, “यह मेरे वश की बात नहीं है[a]; परमेश्वर ही फ़िरौन के कल्याण के विषय में उत्तर देगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के अधिक निकट: “मैं नहीं” या “मुझसे अलग।” आशय है कि उत्तर देने की सामर्थ्य यूसुफ में अपने आप नहीं है।'
    reason: lexical_alternative
  - marker: b
    text: 'इसका अनुवाद यह भी हो सकता है: “परमेश्वर फ़िरौन को शुभ उत्तर देगा।” यहाँ “कल्याण” के लिए प्रयुक्त शब्द का अर्थ शान्ति, कुशलता, भलाई या अनुकूल परिणाम भी हो सकता है।'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: यह कथात्मक प्रसंग में प्रत्यक्ष उत्तर देने की सामान्य क्रिया है और हिन्दी में स्वाभाविक है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: हिन्दी में इस इब्रानी नाम का प्रचलित बाइबलीय रूप।
- source_word: אֶת־פַּרְעֹה
  choice: फ़िरौन को
  rationale: אֶת प्रत्यक्ष कर्म को चिह्नित करता है; हिन्दी में ‘को’ से वही संबंध स्पष्ट होता है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष उद्धरण द्वारा व्यक्त
  rationale: हिन्दी में ‘यह कहते हुए’ जोड़ना अनावश्यक और भारी होता; उद्धरण-चिह्न वाक्-परिचय का कार्य स्वाभाविक ढंग से करते हैं।
- source_word: בִּלְעָדָי
  choice: यह मेरे वश की बात नहीं है
  rationale: यह पद यूसुफ को उत्तर या व्याख्या का स्रोत मानने से इनकार करता है। यह रूप हिन्दी में सहज है और निहित अर्थ को बिना अत्यधिक विस्तार के व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया और प्रसंग के अनुसार यहाँ एकमात्र परमेश्वर अभिप्रेत है।
- source_word: יַעֲנֶה
  choice: उत्तर देगा
  rationale: मूल की ‘उत्तर देने’ वाली क्रिया को बनाए रखता है और וַיַּעַן के साथ उसका शब्दगत संबंध भी सुरक्षित रखता है।
- source_word: שְׁלוֹם פַּרְעֹה
  choice: फ़िरौन के कल्याण के विषय में
  rationale: שָׁלוֹם यहाँ केवल मानसिक शान्ति नहीं, बल्कि कुशलता, कल्याण या अनुकूल परिणाम का बोध करा सकता है। ‘के विषय में’ कठिन इब्रानी कर्म-संरचना को स्वाभाविक हिन्दी में व्यक्त करता है और अनुकूल उत्तर के अर्थ को निर्णायक रूप से आरोपित नहीं करता।
theological_decisions:
- issue: स्वप्न का अर्थ बताने की सामर्थ्य का स्रोत
  choice: यूसुफ अपनी सामर्थ्य को स्रोत नहीं मानता और उत्तर परमेश्वर से आने की बात कहता है।
  alternative: ‘मैं नहीं; परमेश्वर फ़िरौन को शुभ उत्तर देगा।’
  rationale: בִּלְעָדָי और אֱלֹהִים יַעֲנֶה के बीच स्पष्ट विरोध है। अनुवाद इस तनाव को रखता है, पर यूसुफ की विनम्रता या प्रकाशन-सिद्धान्त पर पाठ से अधिक व्याख्या नहीं जोड़ता।
- issue: परमेश्वर के उत्तर और फ़िरौन के שָׁלוֹם का संबंध
  choice: उत्तर फ़िरौन के कल्याण के विषय में होगा।
  alternative: परमेश्वर फ़िरौन को अनुकूल अथवा शुभ उत्तर देगा।
  rationale: 'इब्रानी संरचना दोनों सूक्ष्मताओं की अनुमति देती है: उत्तर फ़िरौन के कल्याण से संबंधित हो सकता है, या उत्तर को अनुकूल बताया जा सकता है। मुख्य पाठ पहली संभावना रखता है और पादटिप्पणी दूसरी को सुरक्षित करती है।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘यह मेरे वश की बात नहीं है’ बोलचाल की स्पष्टता देता है, जबकि ‘कल्याण के विषय में उत्तर देगा’ मूल की असामान्य और अर्थगर्भित संरचना को पर्याप्त रूप से सुरक्षित रखता है।
