translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘भंडार’ सामान्य पाठक के लिए स्पष्ट है और ‘भंडारगृह’ की अपेक्षा अधिक सहज है; मूल पाठ की असामान्य दीर्घवृत्ति पादटिप्पणी में दी गई है।
