source:
  edition: WLC
  text: וְ/הָ/רָעָ֣ב הָיָ֔ה עַ֖ל כָּל פְּנֵ֣י הָ/אָ֑רֶץ וַ/יִּפְתַּ֨ח יוֹסֵ֜ף אֶֽת כָּל אֲשֶׁ֤ר בָּ/הֶם֙ וַ/יִּשְׁבֹּ֣ר לְ/מִצְרַ֔יִם וַ/יֶּחֱזַ֥ק הָֽ/רָעָ֖ב בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/056.yaml
  text: And the famine was over all the face of the earth[a], and Joseph opened all that was in them and sold grain to Egypt[b], and the famine grew severe in the land of Egypt.
translation:
  language: hi
  text: अकाल सारी धरती पर फैला हुआ था, और यूसुफ़ ने सारे भंडार खोल दिए[a] और मिस्रवासियों को अनाज बेचा। मिस्र देश में अकाल और भी भयंकर हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उनमें जो कुछ था, वह सब खोल दिया।” जिन वस्तुओं या स्थानों को खोला गया, उनका नाम मूल पाठ में स्पष्ट नहीं है; संदर्भ में अनाज के भंडार अभिप्रेत हैं।
    reason: मूल इब्रानी की दीर्घवृत्तीय और कुछ अस्पष्ट अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: הָרָעָב
  choice: अकाल
  rationale: यहाँ רָעָב व्यापक और गंभीर खाद्य-संकट को दर्शाता है; कथा के संदर्भ में ‘अकाल’ स्वाभाविक और सटीक है।
- source_word: עַל כָּל פְּנֵי הָאָרֶץ
  choice: सारी धरती पर
  rationale: यह अभिव्यक्ति इब्रानी के ‘धरती/भूमि के समूचे विस्तार पर’ अर्थ को संक्षेप और स्वाभाविक ढंग से रखती है तथा אָרֶץ के व्यापक भौगोलिक संकेत को बनाए रखती है।
- source_word: וַיִּפְתַּח ... אֶת כָּל אֲשֶׁר בָּהֶם
  choice: सारे भंडार खोल दिए
  rationale: मूल पाठ में वाक्यांश दीर्घवृत्तीय है—शाब्दिक रूप से ‘उनमें जो कुछ था, वह सब’; संदर्भ भंडारण-स्थानों का है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक असामान्यता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וַיִּשְׁבֹּר לְמִצְרַיִם
  choice: मिस्रवासियों को अनाज बेचने लगा
  rationale: इस संदर्भ में שׁבר का मुहावरेदार अर्थ अनाज या रसद बेचना है। לְמִצְרַיִם मिस्र के लोगों को सामूहिक रूप से दर्शाता है; अपूर्णतासूचक कथात्मक क्रिया के प्रवाही अर्थ को ‘बेचने लगा’ व्यक्त करता है।
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: अकाल और भी भयंकर हो गया
  rationale: חזק का मूल अर्थ ‘बलवान होना’ है, पर अकाल के साथ इसका अर्थ तीव्र या विकराल होना है। यह हिंदी में बढ़ती गंभीरता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: यह אֶרֶץ को व्यक्त करते हुए उत्पत्ति की कथात्मक शैली के अनुरूप है।
