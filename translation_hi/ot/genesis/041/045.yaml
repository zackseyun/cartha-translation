base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/045.yaml
  text: And Pharaoh called Joseph’s name Zaphenath-paneah[a], and he gave him Asenath, the daughter of Potiphera, the priest of On, as a wife[d][c][b]. And Joseph went out over the land of Egypt.
translation:
  language: hi
  text: फ़िरौन ने यूसुफ का नाम साफ़नत-पानेअख[a] रखा और ओन के पुरोहित, पोती-पेरा, की बेटी आसनत को यूसुफ को पत्नी के रूप में दिया। फिर यूसुफ मिस्र देश में निकल पड़ा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस मिस्री नाम का अर्थ निश्चित नहीं है; इसके लिप्यंतरण और प्रस्तावित अर्थ अलग-अलग हैं। इसे “साफ़नत-पानेह” भी लिखा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “यूसुफ मिस्र देश भर में निकल पड़ा।” यहाँ प्रयुक्त पदबंध यात्रा के साथ उसके अधिकार-क्षेत्र की ओर भी संकेत कर सकता है।
