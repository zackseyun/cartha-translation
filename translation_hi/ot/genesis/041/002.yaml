  choice: और देखो
  rationale: यह स्वप्न के दृश्य की ओर तुरंत ध्यान खींचने वाले इब्रानी कथन-सूचक का स्वाभाविक और सजीव हिन्दी रूप है।
- source_word: הַיְאֹר
