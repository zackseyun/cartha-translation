- source_word: עֹלֹת
  choice: निकल रही थीं
  rationale: स्त्रीलिंग बहुवचन कृदन्त दृश्य में जारी क्रिया दिखाता है; नदी में से गायों के ऊपर आने के लिए यह सहज हिन्दी है।
- source_word: פָּרוֹת
  choice: गायें
  rationale: शब्द स्त्रीलिंग गोवंश को सूचित करता है; ‘गायें’ सीधा और सामान्य हिन्दी रूप है।
- source_word: יְפוֹת מַרְאֶה
  choice: देखने में सुन्दर
  rationale: यह बाहरी रूप की सुन्दरता व्यक्त करता है और मूल पदबंध के अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּבְרִיאֹת בָּשָׂר
  choice: हृष्ट-पुष्ट
  rationale: इब्रानी पदबंध देह की भरपूर मोटाई और पुष्टता पर बल देता है। ‘हृष्ट-पुष्ट’ हिन्दी में वही दृश्यात्मक भाव सम्मानजनक और सहज ढंग से देता है।
- source_word: וַתִּרְעֶינָה
  choice: चर रही थीं
  rationale: क्रिया पशुओं के चरने को दर्शाती है; अपूर्ण प्रगतिशील हिन्दी रूप स्वप्न के चलते हुए दृश्य के अनुकूल है।
- source_word: בָּאָחוּ
  choice: दलदली घास में
  rationale: यह नील के किनारे उगने वाली दलदली वनस्पति या सरकंडों वाली घास का द्योतक है; सामान्य ‘मैदान’ की अपेक्षा यह भौगोलिक दृश्य को बेहतर सुरक्षित रखता है।
