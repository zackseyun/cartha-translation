  text: तब मिस्र देश में भरपूरी के जो सात वर्ष थे, वे समाप्त हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכְלֶינָה
  choice: समाप्त हो गए
  rationale: כלה के स्त्रीलिंग बहुवचन रूप का कर्ता ‘वर्ष’ है; यह पद समयावधि के पूरा होकर अंत तक पहुँचने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: भरपूरी के सात वर्ष
  rationale: इब्रानी समास-संबंध को हिन्दी के ‘के’ से व्यक्त किया गया है। שָׂבָע यहाँ प्रचुर उपज और भोजन की भरमार का समय दर्शाता है; ‘भरपूरी’ प्रसंगानुकूल और सामान्य पाठक के लिए सहज है।
- source_word: אֲשֶׁר הָיָה
  choice: आए
  rationale: शाब्दिक अर्थ ‘जो था/हुए थे’ है, पर वर्ष किसी देश में घटित होने की हिन्दी अभिव्यक्ति ‘आए ... वर्ष’ स्वाभाविक है और उसी पूर्ववर्ती अवधि को संकेत करती है।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: אֶרֶץ को ‘देश’ के रूप में स्पष्ट रखा गया है और हिन्दी में स्वाभाविक शब्दक्रम अपनाया गया है।
