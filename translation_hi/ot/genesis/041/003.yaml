base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/003.yaml
  text: And behold[a], seven other cows came up after them from the Nile, ugly in appearance and thin in flesh[b], and they stood beside the cows on the bank of the Nile.
translation:
  language: hi
  text: और देखो, उनके बाद सात और गायें नील नदी[a] से निकलीं। वे देखने में कुरूप और शरीर से दुबली[b] थीं, और नील नदी के किनारे उन गायों के पास खड़ी हो गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में, ‘नदी’ (יְאֹר); मिस्र के इस संदर्भ में इसका संकेत विशेष रूप से नील नदी की ओर है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘दिखने में बुरी और दुबले शरीर वाली।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: स्वप्न-दृश्य में अचानक दिखाई देने वाली बात पर ध्यान खींचने वाले इब्रानी कथात्मक संकेत को स्वाभाविक और स्पष्ट हिन्दी में बनाए रखता है।
- source_word: פָּרוֹת
  choice: गायें
  rationale: स्त्रीलिंग बहुवचन विशेष रूप से मादा गोवंश को दर्शाता है; इसलिए सामान्य ‘पशु’ की अपेक्षा ‘गायें’ अधिक सटीक है।
- source_word: אֲחֵרוֹת
  choice: और
  rationale: यह पहले समूह से अलग दूसरे सात के समूह को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עֹלוֹת ... מִן הַיְאֹר
  choice: नील नदी से निकलीं
  rationale: नदी से ऊपर आने के दृश्य को हिन्दी में ‘निकलीं’ स्वाभाविक रूप से व्यक्त करता है, जबकि गति का आशय सुरक्षित रहता है।
- source_word: אַחֲרֵיהֶן
  choice: उनके बाद
  rationale: 'यहाँ क्रमिक अर्थ उपयुक्त है: दूसरा समूह पहले समूह के बाद प्रकट होता है।'
- source_word: הַיְאֹר
  choice: नील नदी
  rationale: मिस्री परिवेश में יְאֹר का संदर्भ नील नदी से है; स्पष्ट नाम पाठक को सही भौगोलिक संदर्भ देता है।
- source_word: רָעוֹת מַרְאֶה
  choice: देखने में कुरूप
  rationale: वाक्यांश नैतिक बुराई नहीं, अप्रिय रूप का वर्णन करता है; यह चयन उसी दृश्य अर्थ को स्वाभाविक हिन्दी में देता है।
- source_word: דַקּוֹת בָּשָׂר
  choice: शरीर से दुबली
  rationale: इब्रानी के शारीरिक दुबलेपन के बिंब को सहज हिन्दी में बनाए रखता है।
- source_word: וַתַּעֲמֹדְנָה
  choice: आकर खड़ी हो गईं
  rationale: सरल कथात्मक क्रिया को दृश्य के प्रवाह के अनुरूप स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: אֵצֶל
  choice: पास
  rationale: निकटता का अर्थ स्पष्ट और सामान्य हिन्दी में व्यक्त होता है।
- source_word: שְׂפַת הַיְאֹר
  choice: नील नदी के किनारे
  rationale: नदी के संदर्भ में ‘किनारा’ שׂפה का सबसे स्वाभाविक हिन्दी रूप है।
