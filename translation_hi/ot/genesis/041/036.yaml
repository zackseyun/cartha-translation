source:
  edition: WLC
  text: וְ/הָיָ֨ה הָ/אֹ֤כֶל לְ/פִקָּדוֹן֙ לָ/אָ֔רֶץ לְ/שֶׁ֨בַע֙ שְׁנֵ֣י הָ/רָעָ֔ב אֲשֶׁ֥ר תִּהְיֶ֖יןָ בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִכָּרֵ֥ת הָ/אָ֖רֶץ בָּ/רָעָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/036.yaml
  text: That food shall be a reserve for the land for the seven years of famine that will be in the land of Egypt[c][b][a], so that the land may not be cut off by the famine.
translation:
  language: hi
  text: वह भोजन देश के लिए भंडार होगा—मिस्र देश में पड़ने वाले अकाल के सात वर्षों के लिए—ताकि अकाल के कारण देश नाश न हो जाए।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश के लिए सुरक्षित भंडार बना रहेगा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “देश काट न दिया जाए”; आशय है कि अकाल के कारण देश नष्ट या उजड़ न जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הָאֹכֶל
  choice: वह भोजन ... रहेगा
  rationale: भविष्यसूचक-सलाहकारी संदर्भ में क्रिया का भाव भविष्यकालीन है। 'भोजन' אֹכֶל का व्यापक अर्थ बनाए रखता है और 'वह' पिछले पद में इकट्ठी उपज की ओर संकेत करता है।
- source_word: לְפִקָּדוֹן
  choice: भंडार में सुरक्षित
  rationale: यह शब्द सुरक्षित रखी हुई सामग्री या आपातकालीन संचय को दर्शाता है। हिंदी में यह प्रयोग प्रशासनिक भंडारण और भविष्य की आवश्यकता, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָאָרֶץ
  choice: देश के लिए
  rationale: यहाँ אֶרֶץ पूरे मिस्र देश को सूचित करता है; 'देश' आधुनिक हिंदी में इस राजनीतिक-भौगोलिक अर्थ को स्पष्ट करता है।
- source_word: לְשֶׁבַע שְׁנֵי הָרָעָב
  choice: अकाल के सात वर्षों के लिए
  rationale: निश्चित सात वर्ष पहले से बताए जा चुके हैं। यह हिंदी क्रम मूल संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: אֲשֶׁר תִּהְיֶיןָ בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में पड़नेवाले
  rationale: अकाल के लिए हिंदी में 'पड़ना' स्वाभाविक है; यह संबंधवाचक उपवाक्य के भविष्यकालीन आशय को संक्षेप में व्यक्त करता है।
- source_word: וְלֹא תִכָּרֵת הָאָרֶץ בָּרָעָב
  choice: ताकि अकाल के कारण देश नाश न हो जाए
  rationale: निफ़अल תִכָּרֵת का शाब्दिक बिंब 'काट दिया जाना' है, पर देश के संदर्भ में आशय अकाल से उजड़ना या नष्ट होना है। 'नाश न हो जाए' हिंदी में परिणाम को स्पष्ट करता है; शाब्दिक बिंब पादटिप्पणी में रखा गया है।
