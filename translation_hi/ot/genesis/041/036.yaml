translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। दोहरे 'देश' को मूल पाठ की पुनरावृत्ति के अनुरूप रखा गया है। मुख्य पाठ में अर्थ-स्पष्ट रूप चुना गया है और כרת का मूल रूपक पादटिप्पणी में संरक्षित है।
