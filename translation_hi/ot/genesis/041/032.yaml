source:
  edition: WLC
  text: וְ/עַ֨ל הִשָּׁנ֧וֹת הַ/חֲל֛וֹם אֶל פַּרְעֹ֖ה פַּעֲמָ֑יִם כִּֽי נָכ֤וֹן הַ/דָּבָר֙ מֵ/עִ֣ם הָ/אֱלֹהִ֔ים וּ/מְמַהֵ֥ר הָ/אֱלֹהִ֖ים לַ/עֲשֹׂתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/032.yaml
  text: And as for the dream being repeated to Pharaoh twice[a], it is because the matter is fixed by God[b], and God is hastening to do it.
translation:
  language: hi
  text: और फ़िरौन को स्वप्न दो बार दिखाए जाने का कारण यह है कि यह बात परमेश्वर की ओर से निश्चित है[a], और परमेश्वर इसे शीघ्र पूरा करने वाला है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह बात परमेश्वर की ओर से ठहराई गई है।”
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर इसे शीघ्र करेगा” अथवा “परमेश्वर इसे करने जा रहा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: और ... का अर्थ यह है
  rationale: यह पद पिछले कथन की व्याख्या करता है। यह प्रयोग इब्रानी के विषय-सूचक और व्याख्यात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִשָּׁנוֹת הַחֲלוֹם
  choice: स्वप्न दो बार दिखाए जाने
  rationale: निष्क्रिय भाव में आए क्रियात्मक रूप को बनाए रखता है और प्रसंग में स्पष्ट करता है कि फ़िरौन ने वही स्वप्न पुनः देखा।
- source_word: אֶל־פַּרְעֹה
  choice: फ़िरौन को
  rationale: दिशा अथवा संबद्धता बताने वाले संबंधबोधक का सहज हिन्दी रूप।
- source_word: פַּעֲמָיִם
  choice: दो बार
  rationale: द्विवचन का सीधा और प्रचलित हिन्दी अनुवाद।
- source_word: כִּי
  choice: यह है कि
  rationale: स्वप्न की पुनरावृत्ति का कारण प्रस्तुत करने वाले व्याख्यात्मक संबंध को स्पष्ट करता है।
- source_word: נָכוֹן הַדָּבָר
  choice: यह बात ... निश्चित है
  rationale: नָכוֹן यहाँ बात के दृढ़, स्थापित और अटल होने का भाव देता है; ‘निश्चित’ आधुनिक हिन्दी में इसे संक्षेप में व्यक्त करता है।
- source_word: מֵעִם הָאֱלֹהִים
  choice: परमेश्वर की ओर से
  rationale: मूल पदबंध में निहित स्रोत और दैवी निर्धारण दोनों को बनाए रखता है, बिना उसे केवल कर्मवाच्य कर्ता में बदलने के।
- source_word: וּמְמַהֵר הָאֱלֹהִים
  choice: और परमेश्वर ... शीघ्र ... करने वाला है
  rationale: कृदंत के वर्तमान और आसन्न भाव के साथ कार्य की शीघ्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַעֲשֹׂתוֹ
  choice: इसे ... पूरा करने
  rationale: सर्वनाम घोषित बात की ओर संकेत करता है। ‘पूरा करना’ इस संदर्भ में घटना को कार्यान्वित करने का अर्थ सहज रूप से देता है।
theological_decisions:
- issue: הָאֱלֹהִים का वचन
  choice: परमेश्वर
  alternative: देवता
  rationale: शब्द रूप की दृष्टि से बहुवचन-जैसा है, पर एकवचन क्रियात्मक संरचना और यूसुफ के कथन का संदर्भ स्पष्टतः एक परमेश्वर की ओर संकेत करता है।
- issue: स्वप्न की पुनरावृत्ति और दैवी निर्धारण
  choice: यह बात परमेश्वर की ओर से निश्चित है
  alternative: यह बात परमेश्वर के द्वारा ठहराई गई है
  rationale: चुना हुआ रूप מֵעִם के स्रोत-सूचक भाव और נָכוֹן की दृढ़ता को बनाए रखता है, साथ ही किसी विशिष्ट धर्मसैद्धांतिक प्रणाली की भाषा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘फ़िरौन’, ‘स्वप्न’ और ‘परमेश्वर’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; वाक्य-संरचना को सामान्य पाठक के लिए स्पष्ट बनाया गया है।
