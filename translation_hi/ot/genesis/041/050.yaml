  text: וּ/לְ/יוֹסֵ֤ף יֻלַּד֙ שְׁנֵ֣י בָנִ֔ים בְּ/טֶ֥רֶם תָּב֖וֹא שְׁנַ֣ת הָ/רָעָ֑ב אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֥ן אֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/050.yaml
  text: Before the year of famine came[a], two sons were born to Joseph, whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: hi
  text: अकाल का वर्ष आने से पहले[a], यूसुफ को दो पुत्र हुए, जिन्हें ओन[b] के याजक पोतीफेरा की बेटी आसनत ने जन्म दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अकाल का वर्ष आ गया।” यहाँ हिब्रानी में “वर्ष” एकवचन है, जो अकाल के समय के आरम्भ की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: ओन मिस्र का एक नगर था, जिसे बाद में यूनानी भाषा में हेलियोपोलिस कहा गया।
    reason: cultural_note
lexical_decisions:
- source_word: יֻלַּד ... שְׁנֵי בָנִים
  choice: दो पुत्र उत्पन्न हुए
  rationale: बहुवचन कर्ता के साथ हिब्रानी निष्क्रिय जन्म-अभिव्यक्ति को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וּלְיוֹסֵף
  choice: यूसुफ के
  rationale: जन्म के निष्क्रिय प्रयोग में ל संबंध को दर्शाता है; हिन्दी में ‘यूसुफ के दो पुत्र’ सहज समतुल्य है।
- source_word: בְּטֶרֶם
  choice: आने से पहले
  rationale: यह अकाल-वर्ष के आरम्भ से पहले का समय स्पष्ट करता है।
- source_word: תָּבוֹא שְׁנַת הָרָעָב
  choice: अकाल का वर्ष आने
  rationale: हिब्रानी के एकवचन ‘वर्ष’ और ‘आना’ की क्रियात्मक छवि दोनों सुरक्षित रखी गई हैं।
- source_word: יָלְדָה לּוֹ
  choice: उसके लिए जन्म दिया था
  rationale: जन्म देने की क्रिया और לּוֹ का संबंध दोनों व्यक्त होते हैं; पूर्वघटित घटना के लिए ‘था’ हिन्दी में स्वाभाविक है।
- source_word: אָסְנַת בַּת פּוֹטִי פֶרַע
  choice: पोती-पेरा की बेटी आसनत
  rationale: नामों का देवनागरी लिप्यंतरण करते हुए हिब्रानी वंश-संबंध को सुरक्षित रखा गया है।
- source_word: כֹּהֵן אֹון
  choice: ओन के याजक
  rationale: כֹּהֵן का सामान्य धार्मिक अर्थ ‘याजक’ है और ओन स्थान-नाम के रूप में लिप्यंतरित है।
