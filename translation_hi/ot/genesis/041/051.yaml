  text: וַ/יִּקְרָ֥א יוֹסֵ֛ף אֶת שֵׁ֥ם הַ/בְּכ֖וֹר מְנַשֶּׁ֑ה כִּֽי נַשַּׁ֤/נִי אֱלֹהִים֙ אֶת כָּל עֲמָלִ֔/י וְ/אֵ֖ת כָּל בֵּ֥ית אָבִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/051.yaml
  text: Joseph called the name of the firstborn Manasseh[a], for he said[c][b], “God has made me forget all my hardship and all my father’s house.”
translation:
  language: hi
  text: यूसुफ़ ने अपने पहलौठे पुत्र का नाम मनश्शे[a] रखा, क्योंकि उसने कहा, “परमेश्वर ने मुझसे मेरे सारे कष्ट और मेरे पिता का सारा घराना[b] भुला दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मनश्शे” नाम की ध्वनि उस हिब्रू क्रिया से मिलती है जिसका अर्थ “भुला देना” है।
    reason: lexical_alternative
  - marker: b
    text: “पिता का घराना” हिब्रू में किसी व्यक्ति के पैतृक परिवार या कुटुंब के लिए प्रयुक्त अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: नाम ... रखा
  rationale: हिब्रू में शाब्दिक रूप से ‘नाम पुकारा’ है; आधुनिक मानक हिन्दी में नामकरण के लिए ‘नाम रखा’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: הַבְּכוֹר
  choice: पहलौठे
  rationale: ‘पहलौठा’ स्रोत के स्पष्ट जन्मक्रम और उसके संभावित कथात्मक महत्त्व को बनाए रखता है।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है; इसके साथ נַשַּׁנִי की शब्द-क्रीड़ा पादटिप्पणी में स्पष्ट की गई है।
- source_word: כִּי
  choice: क्योंकि उसने कहा
  rationale: यह संयोजक नाम रखने का कारण प्रस्तुत करता है; हिन्दी में निहित कथन को स्पष्ट करने के लिए ‘उसने कहा’ जोड़ा गया है।
- source_word: נַשַּׁנִי
  choice: मुझे ... भुला दिया है
  rationale: क्रिया का कारक अर्थ ‘भुला देना’ से स्वाभाविक हिन्दी में व्यक्त होता है और मनश्शे नाम से उसका संबंध भी बना रहता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: संदर्भ और एकवचन क्रिया के अनुसार यहाँ इस्राएल के परमेश्वर के लिए मानक हिन्दी पद उपयुक्त है।
- source_word: כָּל עֲמָלִי
  choice: मेरे सारे कष्ट
  rationale: עָמָל में कठिन परिश्रम, दुःख और परेशानी की अर्थ-सीमा है; यूसुफ़ के व्यापक दुःखों के संदर्भ में ‘कष्ट’ संक्षिप्त और स्वाभाविक है।
- source_word: כָּל בֵּית אָבִי
  choice: मेरे पिता के पूरे घराने
  rationale: ‘घराना’ हिब्रू के पैतृक परिवार/कुटुंब के मुहावरे को आधुनिक हिन्दी में स्पष्ट करता है, बिना उसे केवल भवन या केवल कुछ व्यक्तियों तक सीमित किए।
theological_decisions:
- issue: यूसुफ़ द्वारा अपने पिता के घराने को ‘भूलने’ का आशय
  choice: कथन को सीधे रूप में रखा गया है कि परमेश्वर ने उसे उसके पिता का पूरा घराना भुला दिया।
  alternative: इसे केवल पिता के घराने से जुड़ी पीड़ा के मिटने या अतिशयोक्तिपूर्ण राहत के रूप में स्पष्ट करना।
  rationale: हिब्रू कथन स्वयं इस तनाव को स्पष्ट नहीं करता। इसलिए अनुवाद न तो उसे नरम करता है, न किसी सामंजस्यकारी व्याख्या को पाठ में जोड़ता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘यूसुफ़’, ‘मनश्शे’, ‘पहलौठा’ और ‘परमेश्वर’ बाइबलीय हिन्दी से परिचित पाठकों के लिए पहचाने जाने योग्य हैं; वाक्यरचना सामान्य पाठक के लिए स्वाभाविक रखी गई है।
