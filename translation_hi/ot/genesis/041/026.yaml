base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/026.yaml
  text: The seven good cows are seven years[a], and the seven good ears of grain are seven years; it is one dream.
translation:
  language: hi
  text: सात अच्छी गायें सात वर्ष हैं, और अनाज की सात अच्छी बालियाँ[a] सात वर्ष हैं; यह एक ही स्वप्न है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अनाज के सिरे’। इब्रानी शब्द डंठल के उस ऊपरी भाग को सूचित करता है जिसमें दाने लगते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹת
  choice: गायें
  rationale: यह शब्द फ़िरौन के स्वप्न में मादा गोवंश को दर्शाता है; इसलिए सामान्य ‘पशु’ की अपेक्षा ‘गायें’ अधिक सटीक है।
- source_word: הַטֹּבֹת
  choice: अच्छी
  rationale: मूल विशेषण का व्यापक अर्थ ‘अच्छा’ है। यहाँ ‘अच्छी’ स्वप्न के वर्णन से सीधा संबंध बनाए रखता है और इसे केवल मोटी या स्वस्थ होने तक सीमित नहीं करता।
- source_word: שָׁנִים
  choice: वर्ष
  rationale: स्वप्न के प्रतीकों की स्पष्ट व्याख्या वर्षों के रूप में की गई है; ‘वर्ष’ सटीक और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: שִׁבֳּלִים
  choice: अनाज की बालियाँ
  rationale: इब्रानी शब्द पौधे के उस ऊपरी भाग को दर्शाता है जिसमें दाने लगते हैं। ‘अनाज की बालियाँ’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: חֲלוֹם אֶחָד הוּא
  choice: यह एक ही स्वप्न है
  rationale: इब्रानी का एकवचन कथन दोनों प्रतीक-समूहों की एकता पर बल देता है। ‘एक ही’ इस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הֵנָּה
  choice: हैं
  rationale: इब्रानी स्त्रीलिंग बहुवचन सर्वनाम यहाँ योजक क्रिया का कार्य करता है; हिन्दी में इसे स्वाभाविक रूप से ‘हैं’ से व्यक्त किया गया है।
