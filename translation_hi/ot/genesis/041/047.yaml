  yaml_path: translation/ot/genesis/041/047.yaml
  text: During the seven years of abundance[a], the land produced by handfuls.
translation:
  language: hi
  text: भरपूरी के सात वर्षों में भूमि ने मुट्ठी भर-भरकर उपज दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַשׂ
  choice: उपज दी
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ है, पर भूमि को कर्ता मानने वाले इस कृषि-संदर्भ में ‘उपज दी’ स्वाभाविक और अर्थानुकूल है।
- source_word: הָאָרֶץ
  choice: भूमि
  rationale: यहाँ संदर्भ मिस्र की खेती योग्य भूमि का है; ‘भूमि’ पूरे पृथ्वी-जगत का अनावश्यक बोध कराए बिना मूल शब्द को संक्षेप में व्यक्त करता है।
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: भरपूरी के सात वर्षों में
  rationale: שׂבע से सूचित प्रचुरता को ‘भरपूरी’ साधारण आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करती है और पहले से घोषित सात वर्षों की अवधि बनाए रखती है।
- source_word: לִקְמָצִים
  choice: मुट्ठी भर-भरकर
  rationale: קְמָץ का ठोस बिंब ‘मुट्ठी भर’ है। हिन्दी का पुनरुक्त रूप ‘भर-भरकर’ क्रियाविशेषण की तरह असाधारण मात्रा में उपजने का भाव स्वाभाविक ढंग से देता है, बिना इसे ‘ढेरों’ के रूप में समझाए।
