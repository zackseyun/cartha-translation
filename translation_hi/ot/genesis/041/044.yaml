base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/044.yaml
  text: Then Pharaoh said to Joseph[a], “I am Pharaoh[b], and without you no man will lift up his hand or his foot in all the land of Egypt.”
translation:
  language: hi
  text: तब फ़िरौन ने यूसुफ से कहा, “मैं फ़िरौन हूँ, और तुम्हारे बिना[a] मिस्र के सारे देश में कोई अपना हाथ या पैर नहीं उठाएगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमसे अलग”; यहाँ भाव यह भी हो सकता है कि मिस्र में कोई यूसुफ के अधिकार या अनुमति से स्वतंत्र होकर कार्य नहीं करेगा।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपना हाथ और अपना पैर उठाएगा”; यह कोई कार्य करने या कोई कदम उठाने का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: यूसुफ-वृत्तांत में मिस्र के शासक की उपाधि का प्रचलित हिन्दी रूप।
- source_word: אֲנִי פַרְעֹה
  choice: मैं फ़िरौन हूँ
  rationale: यह क्रियारहित इब्रानी वाक्य फ़िरौन की अधिकारपूर्ण आत्म-पहचान है; सीधा अनुवाद उसके बल को बनाए रखता है, बिना अतिरिक्त अर्थ जोड़े।
- source_word: וּבִלְעָדֶיךָ
  choice: और तुम्हारे बिना
  rationale: यह पद यूसुफ को छोड़कर अथवा उसकी अनुमति के बिना कार्य करने के निषेध को व्यक्त कर सकता है। ‘तुम्हारे बिना’ मूल की संक्षिप्तता और अर्थगत खुलापन बनाए रखता है।
- source_word: לֹא יָרִים אִישׁ
  choice: कोई ... नहीं उठाएगा
  rationale: निषेधात्मक राजकीय घोषणा के संदर्भ में यह स्वाभाविक हिन्दी है; אִישׁ का यहाँ सामान्य अर्थ ‘कोई व्यक्ति’ है।
- source_word: אֶת יָדוֹ וְאֶת רַגְלוֹ
  choice: अपना हाथ या पैर
  rationale: मूल का ठोस मुहावरा सुरक्षित रखा गया है। नकारात्मक हिन्दी वाक्य में ‘या’ किसी भी प्रकार की गतिविधि न करने का भाव स्वाभाविक रूप से देता है।
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: मिस्र के सारे देश में
  rationale: यह पूरे मिस्री भूभाग को सूचित करने वाली मानक क्षेत्रीय अभिव्यक्ति का स्पष्ट और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: यूसुफ के अधिकार की सीमा
  choice: ‘तुम्हारे बिना’ रखकर मूल की संभावित द्विअर्थता बनाए रखी गई है।
  alternative: ‘तुम्हारी अनुमति के बिना’
  rationale: संदर्भ अनुमति और प्रत्यायोजित शासनाधिकार का संकेत देता है, पर इब्रानी पद स्वयं अधिक संक्षिप्त है; इसलिए व्याख्यात्मक विस्तार मुख्य पाठ के बजाय पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। ‘फ़िरौन’ और ‘यूसुफ’ के प्रचलित बाइबिलीय रूप रखे गए हैं। मूल मुहावरे को मुख्य पाठ में सुरक्षित रखकर उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
