  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘पुरवाई’ पूर्व दिशा से आने वाली गर्म हवा के लिए संक्षिप्त और सामान्य बाइबिलीय-कृषि संदर्भ में सुबोध है। मूल पाठ में कोई ऐसी वास्तविक अस्पष्टता नहीं मिली जिसके लिए पादटिप्पणी आवश्यक हो।
