review_pass:
  verdict: revise
  source_fidelity: The symbolic identifications, sequence, empty grain heads, east wind, and seven years of famine are retained. However, “बुरी गायें” is misleading in Hindi, where it can suggest moral badness; in this dream description רָעוֹת concerns their undesirable/ugly appearance and condition.
  naturalness: The draft is generally readable, but “दुबली और बुरी गायें” is not idiomatic descriptive Hindi. “पुरवाई” can suggest a pleasant breeze and does not clearly convey the damaging east wind; “पूर्वी हवा” is clearer and more neutral.
  terminology: “बालें” and “अकाल” are appropriate. “कुरूप” accurately conveys the cows’ unattractive appearance in context without moralizing the adjective.
  issues:
  - severity: medium
    issue: “बुरी गायें” is semantically and stylistically unsuitable.
    rationale: The Hebrew adjective describes the cows’ poor/ugly appearance in the dream context, not their moral character. “कुरूप” gives the intended visual sense naturally in Hindi.
  - severity: low
    issue: “पुरवाई” is potentially imprecise for the harmful east wind.
    rationale: It often evokes an ordinary or pleasant easterly breeze in modern Hindi. “पूर्वी हवा से झुलसी हुई” directly preserves the source expression and its agricultural damage.
  revised_text: और उनके बाद आनेवाली वे सात दुबली और कुरूप गायें सात वर्ष हैं; और पूर्वी हवा से झुलसी हुई वे सात खाली बालें अकाल के सात वर्ष होंगी।
  revised_footnotes: []
  revision_rationale: The revision replaces an unnatural and potentially moralizing description of the cows with a contextual visual description, and renders the east wind more directly. All symbolic correspondences and the predictive force of the final clause are preserved.
