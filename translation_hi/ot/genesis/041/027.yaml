source:
  edition: WLC
  text: וְ/שֶׁ֣בַע הַ֠/פָּרוֹת הָֽ/רַקּ֨וֹת וְ/הָ/רָעֹ֜ת הָ/עֹלֹ֣ת אַחֲרֵי/הֶ֗ן שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְ/שֶׁ֤בַע הַֽ/שִׁבֳּלִים֙ הָ/רֵק֔וֹת שְׁדֻפ֖וֹת הַ/קָּדִ֑ים יִהְי֕וּ שֶׁ֖בַע שְׁנֵ֥י רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/027.yaml
  text: And the seven thin and bad cows that came up after them are seven years[a], and the seven empty heads of grain, scorched by the east wind[b], will be seven years of famine.
translation:
  language: hi
  text: और उनके बाद आनेवाली वे सात दुबली और कुरूप गायें सात वर्ष हैं; और पूर्वी हवा से झुलसी हुई वे सात खाली बालें अकाल के सात वर्ष होंगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרַקּוֹת
  choice: दुबली
  rationale: गायों के क्षीण शरीर का स्वाभाविक और स्पष्ट वर्णन; ‘पतली’ की तुलना में पशुओं के संदर्भ में अधिक सहज।
- source_word: וְהָרָעֹת
  choice: और बुरी
  rationale: यहाँ नैतिक बुराई नहीं, गायों की खराब और अनाकर्षक दशा अभिप्रेत है; ‘बुरी’ मूल के व्यापक अर्थ को बनाए रखता है।
- source_word: הָעֹלֹת אַחֲרֵיהֶן
  choice: जो उनके बाद निकली थीं
  rationale: स्वप्न में गायों के बाद में नदी से निकलने और क्रम को सहज हिन्दी में व्यक्त करता है।
- source_word: שֶׁבַע שָׁנִים הֵנָּה
  choice: सात वर्ष हैं
  rationale: स्वप्न के प्रतीकों की वर्षों से सीधी पहचान को सुरक्षित रखता है।
- source_word: הַשִׁבֳּלִים
  choice: बालें
  rationale: अनाज के दानों वाले ऊपरी भाग के लिए प्रचलित, संक्षिप्त और स्वाभाविक हिन्दी शब्द।
- source_word: הָרֵקוֹת
  choice: खाली
  rationale: बालियों में दाने न होने या उनका न भरने का चित्र सीधे व्यक्त करता है।
- source_word: שְׁדֻפוֹת הַקָּדִים
  choice: पुरवाई से झुलस गई थीं
  rationale: कדים से आने वाली गर्म पूर्वी हवा और उससे हुई क्षति को प्राकृतिक हिन्दी में व्यक्त करता है।
- source_word: יִהְיוּ
  choice: होंगी
  rationale: हिब्रू अपूर्ण क्रिया के भविष्यसूचक बल को बनाए रखता है और स्त्रीलिंग ‘बालें’ के साथ स्वाभाविक है।
- source_word: שְׁנֵי רָעָב
  choice: अकाल के सात वर्ष
  rationale: रָעָב के लिए इस कथा-संदर्भ में ‘अकाल’ सटीक और मानक हिन्दी पद है।
theological_decisions: []
