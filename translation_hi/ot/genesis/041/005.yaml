  text: וַ/יִּישָׁ֕ן וַֽ/יַּחֲלֹ֖ם שֵׁנִ֑ית וְ/הִנֵּ֣ה שֶׁ֣בַע שִׁבֳּלִ֗ים עֹל֛וֹת בְּ/קָנֶ֥ה אֶחָ֖ד בְּרִיא֥וֹת וְ/טֹבֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/005.yaml
  text: Then he slept and dreamed a second time[a], and behold, seven ears of grain were coming up on one stalk[b], plump and good.
translation:
  language: hi
  text: फिर वह सो गया और उसने दूसरी बार सपना देखा, और देखो, अनाज की सात बालें एक ही डंठल पर निकल रही थीं, भरी हुई और अच्छी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּישָׁן
  choice: फिर वह सो गया
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘फिर’ स्वाभाविक हिन्दी में घटनाक्रम व्यक्त करता है और सोने के सामान्य अर्थ को बनाए रखता है।
- source_word: וַיַּחֲלֹם שֵׁנִית
  choice: उसने दूसरी बार सपना देखा
  rationale: שֵׁנִית का क्रियाविशेषणात्मक अर्थ ‘दूसरी बार’ है; यह अनुवाद मूल क्रम और पुनरावृत्ति को स्पष्ट रखता है।
- source_word: וְהִנֵּה
  choice: क्या देखता है कि
  rationale: हिन्दी कथाशैली में यह स्वप्न के भीतर अचानक और सजीव दृश्य-प्रस्तुति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: अनाज की सात बालें
  rationale: שִׁבֳּלִים अनाज के दाना-धारी ऊपरी भाग को दर्शाता है; ‘अनाज की बालें’ आधुनिक हिन्दी में स्पष्ट और कृषि-संदर्भ के अनुकूल है।
- source_word: עֹלֹת
  choice: निकल रही थीं
  rationale: कृदन्त स्वप्न-दृश्य में जारी और सजीव क्रिया दर्शाता है; अपूर्ण भूतकालीन रूप उस प्रगतिशीलता को बनाए रखता है।
- source_word: בְּקָנֶה אֶחָד
  choice: एक ही डंठल पर
  rationale: קָנֶה यहाँ पौधे का डंठल है; ‘पर’ हिन्दी मुहावरे में एक डंठल पर अनेक बालों के उगने का संबंध स्पष्ट करता है, और ‘ही’ एकता पर बल बनाए रखता है।
- source_word: בְּרִיאוֹת
  choice: भरी हुई
  rationale: अनाज की बालों के लिए विशेषण उनके पुष्ट, दानों से भरे होने को दर्शाता है; ‘भरी हुई’ ‘मोटी’ की संभावित अस्पष्टता से बचते हुए अर्थ को स्वाभाविक ढंग से देता है।
- source_word: וְטֹבוֹת
  choice: और अच्छी
  rationale: טוֹב के व्यापक गुणवाचक अर्थ को सीधे और बिना अनावश्यक व्याख्या के व्यक्त करता है।
