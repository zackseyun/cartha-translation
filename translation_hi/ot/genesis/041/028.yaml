source:
  edition: WLC
  text: ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל פַּרְעֹ֑ה אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הֶרְאָ֥ה אֶת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/028.yaml
  text: 'This is the matter that I spoke to Pharaoh: what God is doing he has shown to Pharaoh[a].'
translation:
  language: hi
  text: 'यह वही बात है जो मैंने फ़िरौन से कही थी: परमेश्वर जो करने वाला है, वह उसने फ़िरौन को दिखा दिया है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर जो कर रहा है।” इब्रानी कृदन्त वर्तमान या निकट भविष्य की क्रिया बता सकता है; यहाँ स्वप्न में आने वाली घटनाओं के कारण “करने वाला है” सन्दर्भ के अधिक अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא הַדָּבָר
  choice: यह वही बात है
  rationale: पहचान बताने वाली इब्रानी रचना को स्वाभाविक हिन्दी में व्यक्त करता है; ‘वही’ पिछले कथन की ओर संकेत को स्पष्ट करता है।
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל פַּרְעֹה
  choice: जो मैंने फ़िरौन से कही थी
  rationale: सम्बन्धवाचक उपवाक्य और पूर्ण हो चुके कथन को सहज आधुनिक हिन्दी में रखता है। हिन्दी में किसी व्यक्ति से बात कहना स्वाभाविक प्रयोग है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ एकवचन अर्थ में इस्राएल के परमेश्वर का निर्देश है; ‘परमेश्वर’ मानक, गरिमापूर्ण और सामान्य हिन्दी रूप है।
- source_word: עֹשֶׂה
  choice: जो करने वाला है
  rationale: इब्रानी कृदन्त वर्तमान या निकट भविष्य की क्रिया व्यक्त कर सकता है। स्वप्न में आने वाली घटनाओं के सन्दर्भ में निकट भविष्य मुख्य पाठ में स्वाभाविक है, जबकि वर्तमानवाची सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: הֶרְאָה אֶת פַּרְעֹה
  choice: उसे उसने फ़िरौन को दिखा दिया है
  rationale: हिफ़ील रूप का अर्थ ‘दिखाना’ है। ‘उसे’ उस कार्य-विषय को स्पष्ट करता है जिसे परमेश्वर ने फ़िरौन पर प्रकट किया, और ‘दिखा दिया है’ पूर्ण क्रिया के वर्तमान परिणाम को व्यक्त करता है।
theological_decisions:
- issue: यूसुफ के कथन में הָאֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: ईश्वर / वह परमेश्वर
  rationale: संज्ञा यहाँ एकवचन में विशिष्ट परमेश्वर को सूचित करती है। ‘परमेश्वर’ मूल के आशय को बिना अतिरिक्त सम्प्रदायगत व्याख्या के व्यक्त करता है।
- issue: עֹשֶׂה के कालगत आशय को व्यक्त करना
  choice: करने वाला है
  alternative: कर रहा है
  rationale: आगामी अकाल और समृद्धि के स्वप्न-सन्दर्भ में निकट भविष्य प्रमुख आशय है, पर कृदन्त की वास्तविक वर्तमान/आसन्न अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। वाक्य की इब्रानी पहचानसूचक संरचना तथा क्रिया के कालगत तनाव को यथासम्भव सुरक्षित रखा गया है।
