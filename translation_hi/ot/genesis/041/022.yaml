base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/022.yaml
  text: And I saw in my dream[a], and behold, seven ears of grain were coming up on one stalk, full and good.
translation:
  language: hi
  text: और मैंने अपने स्वप्न में देखा—और देखो, एक ही डंठल पर अनाज की सात भरी-पूरी और अच्छी बालें[a] उग रही थीं।
  philosophy: optimal-equivalence
  footnotes:
