translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सरल कथात्मक रूप अपनाया गया है। अनिश्चित उद्घोष ‘अब्रेक’ का अनुवाद न करके उसकी अस्पष्टता सुरक्षित रखी गई है और संभावित अर्थ पादटिप्पणी में दिया गया है।
