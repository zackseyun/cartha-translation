  text: וַ/יַּרְכֵּ֣ב אֹת֗/וֹ בְּ/מִרְכֶּ֤בֶת הַ/מִּשְׁנֶה֙ אֲשֶׁר ל֔/וֹ וַ/יִּקְרְא֥וּ לְ/פָנָ֖י/ו אַבְרֵ֑ךְ וְ/נָת֣וֹן אֹת֔/וֹ עַ֖ל כָּל אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/043.yaml
  text: He had him ride in the second chariot that he had[a], and they cried out before him, “Abrek!” And he set him over all the land of Egypt.
translation:
  language: hi
  text: उसने यूसुफ को उस दूसरे रथ में सवार कराया जो उसके पास था, और वे उसके आगे पुकारते थे, “अब्रेक!”[a] और उसने उसे मिस्र के सारे देश पर अधिकारी ठहराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अब्रेक” एक कठिन और अनिश्चित अर्थ वाला शब्द है। संभव है कि यह मिस्री या इब्रानी सम्मान-सूचक उद्घोष हो। बहुत से लोग इसका अर्थ “घुटने टेको!” जैसा समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכֵּב אֹתוֹ
  choice: उसने यूसुफ को ... सवार कराया
  rationale: हिफ़इल रूप का कारणवाचक अर्थ ‘सवार कराया’ से स्वाभाविक हिंदी में स्पष्ट होता है। संदर्भ के कारण सर्वनाम के स्थान पर ‘यूसुफ’ रखने से सामान्य पाठक के लिए कर्ता-कर्म का संबंध साफ़ रहता है।
- source_word: בְּמִרְכֶּבֶת הַמִּשְׁנֶה אֲשֶׁר־לוֹ
  choice: अपने दूसरे रथ पर
  rationale: מִשְׁנֶה दूसरे स्थान या पद का संकेत देता है; वाक्यांश सबसे स्वाभाविक रूप से फ़िरौन के अपने रथ के बाद वाले रथ को दर्शाता है। ‘अपने’ इब्रानी संबंधवाचक उपवाक्य को संक्षिप्त, सहज हिंदी में व्यक्त करता है।
- source_word: וַיִּקְרְאוּ לְפָנָיו
  choice: और लोग उसके आगे पुकारते गए
  rationale: बहुवचन कर्ता अनिर्दिष्ट है, इसलिए ‘लोग’ उपयुक्त है। ‘आगे पुकारते गए’ जुलूस में यूसुफ के आगे लगातार की जा रही सार्वजनिक घोषणा का भाव देता है।
- source_word: אַבְרֵךְ
  choice: अब्रेक
  rationale: इस कठिन पद का अर्थ अनिश्चित है और संभवतः यह मिस्री या इब्रानी सम्मान-सूचक उद्घोष है। अर्थ को निर्णायक बनाए बिना लिप्यंतरण मुख्य पाठ में रखा गया है।
- source_word: וְנָתוֹן אֹתוֹ
  choice: इस प्रकार उसने उसे ... अधिकारी ठहराया
  rationale: इन्फिनिटिव एब्सोल्यूट यहाँ परिणामी या सारात्मक कथन करता है। ‘अधिकारी ठहराया’ शासनाधिकार के प्रसंग को सहज हिंदी में व्यक्त करता है, जबकि ‘इस प्रकार’ कथन के परिणामात्मक संबंध को दर्शाता है।
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: मिस्र के सारे देश पर
  rationale: עַל अधिकार का और אֶרֶץ भौगोलिक क्षेत्र का बोध कराता है; ‘सारे देश पर’ दोनों अर्थों को सुरक्षित रखता है।
