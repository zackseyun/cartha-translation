  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द श्रोता का ध्यान आगे कही जाने वाली बात की ओर खींचता है; ‘देखो’ आधुनिक हिंदी में इसकी जीवंतता बनाए रखता है।
- source_word: שֶׁבַע שָׁנִים
  choice: सात वर्ष
  rationale: मूल का सीधा और स्वाभाविक संख्यात्मक काल-वाचक अनुवाद।
- source_word: בָּאוֹת
  choice: आ रहे हैं
  rationale: स्त्रीलिंग बहुवचन कृदंत ‘वर्षों’ के आने को वर्तमान-जैसी जीवंत भावी घटना के रूप में प्रस्तुत करता है; ‘आ रहे हैं’ इस पक्ष को बनाए रखता है।
- source_word: שָׂבָע גָּדוֹל
  choice: बड़ी भरपूरी
  rationale: यहाँ שָׂבָע भोजन और उपज की प्रचुर उपलब्धता को सूचित करता है। ‘बड़ी भरपूरी’ सामान्य पाठक के लिए सहज है और גָּדוֹל की तीव्रता भी व्यक्त करता है।
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: मिस्र के पूरे देश में
  rationale: यह वाक्यांश समूचे मिस्री भूभाग में फैले विस्तार को स्वाभाविक हिंदी में व्यक्त करता है।
