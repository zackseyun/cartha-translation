  yaml_path: translation/ot/genesis/041/037.yaml
  text: The matter seemed good in the eyes of Pharaoh and in the eyes of all his servants[a][b].
translation:
  language: hi
  text: यह बात फ़िरौन और उसके सभी सेवकों को अच्छी लगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यह बात फ़िरौन की दृष्टि में और उसके सभी सेवकों की दृष्टि में अच्छी थी।”
    reason: इब्रानी मुहावरे और उसकी दोहराई हुई समानांतर रचना को दर्शाने के लिए।
lexical_decisions:
- source_word: וַיִּיטַב
  choice: अच्छी लगी
  rationale: यָטַב का בְּעֵינֵי के साथ प्रयोग किसी बात के स्वीकार्य या मनभावन लगने को व्यक्त करता है। ‘अच्छी लगी’ इस मूल्यांकन को स्वाभाविक हिन्दी में रखता है और वाक्य के कर्ता ‘यह बात’ को बनाए रखता है।
- source_word: הַדָּבָר
  choice: यह बात
  rationale: דָּבָר का अर्थ यहाँ पिछले पदों में यूसुफ द्वारा कही गई योजना अथवा सलाह है। ‘यह बात’ स्रोत की व्यापकता को बनाए रखता है; ‘प्रस्ताव’ अधिक संदर्भ-विशिष्ट, पर कुछ अधिक व्याख्यात्मक होता।
- source_word: בְּעֵינֵי
  choice: को
  rationale: इब्रानी मुहावरे ‘की दृष्टि में’ का अर्थ यहाँ ‘को अच्छी लगी’ है। मुख्य पाठ में स्वाभाविक आधुनिक हिन्दी चुनी गई है, जबकि स्रोत की दृष्टि-संबंधी छवि पाद-टिप्पणी में दी गई है।
- source_word: פַרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के राजा की उपाधि का प्रचलित मानक हिन्दी रूप।
- source_word: כָּל עֲבָדָיו
  choice: उसके सभी सेवक
  rationale: עֲבָדִים का अर्थ सेवक, दास या राजकीय अधिकारी हो सकता है। दरबारी संदर्भ में ‘सेवक’ स्रोत की व्यापकता को ‘अधिकारी’ की अपेक्षा बेहतर बनाए रखता है।
