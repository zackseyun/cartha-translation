translation:
  language: hi
  text: उसी रात हम दोनों ने—मैंने और उसने—एक-एक सपना देखा; हममें से हर एक ने अपने सपने की व्याख्या के अनुरूप सपना देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנַּחַלְמָה חֲלוֹם
  choice: हम दोनों ने एक-एक सपना देखा
  rationale: इब्रानी में क्रिया और उसी मूल की संज्ञा का प्रयोग है। हिंदी में ‘सपना देखा’ स्वाभाविक है; ‘हम दोनों’ और ‘एक-एक’ आगे के वितरणात्मक भाव को स्पष्ट करते हैं।
- source_word: בְּלַיְלָה אֶחָד
  choice: उसी रात
  rationale: शाब्दिक रूप ‘एक रात में’ है, पर प्रसंग में दोनों सपनों के एक ही रात में आने का भाव है; ‘उसी रात’ इसे सहज हिंदी में व्यक्त करता है।
- source_word: אֲנִי וָהוּא
  choice: मैंने और उसने
  rationale: दोनों सहभागियों का स्पष्ट उल्लेख सुरक्षित रखते हुए हिंदी कारक-रचना के अनुसार स्वाभाविक रूप अपनाया गया है।
- source_word: אִישׁ
  choice: हममें से हरेक
  rationale: यहाँ אִישׁ वितरणात्मक है और हर व्यक्ति के अपने अलग सपने की ओर संकेत करता है।
- source_word: כְּפִתְרוֹן חֲלֹמוֹ
  choice: अपने अर्थ के अनुसार
  rationale: כְּ अनुरूपता या संगति बताता है। ‘अर्थ’ यहाँ सपने के व्याख्यायित आशय को सामान्य हिंदी में व्यक्त करता है, जबकि ‘के अनुसार’ मूल संबंध को बनाए रखता है।
- source_word: חָלָמְנוּ
  choice: सपना ... था
  rationale: अंतिम बहुवचन क्रिया पहले कथन को वितरणात्मक ढंग से पूरा करती है। हिंदी में अनावश्यक पुनरावृत्ति से बचते हुए दूसरे उपवाक्य में प्रत्येक सपने और उसके अर्थ की संगति व्यक्त की गई है।
