  text: וַ/יְהִ֕י מִ/קֵּ֖ץ שְׁנָתַ֣יִם יָמִ֑ים וּ/פַרְעֹ֣ה חֹלֵ֔ם וְ/הִנֵּ֖ה עֹמֵ֥ד עַל הַ/יְאֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/001.yaml
  text: At the end of two full years[a], Pharaoh dreamed, and behold[b], he was standing by the Nile.
translation:
  language: hi
  text: पूरे दो वर्ष बीतने पर[a], फ़िरौन ने एक स्वप्न देखा। और देखो, वह नील नदी के किनारे खड़ा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘दो वर्ष दिनों के’; यह इब्रानी मुहावरा पूरे दो वर्ष की अवधि को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: बीतने पर
  rationale: कथा-सूचक וַיְהִי को मִקֵּץ के कालगत अर्थ के साथ स्वाभाविक हिन्दी में समाहित किया गया है; यह निर्दिष्ट अवधि की समाप्ति पर अगली घटना आरम्भ होने को व्यक्त करता है।
- source_word: שְׁנָתַיִם יָמִים
  choice: पूरे दो वर्ष
  rationale: शाब्दिक रूप से ‘दो वर्ष दिनों के’ यह इब्रानी मुहावरा पूर्ण दो-वर्षीय अवधि पर बल देता है।
- source_word: פַרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का हिन्दी में प्रचलित रूप रखा गया है।
- source_word: חֹלֵם
  choice: ने एक स्वप्न देखा
  rationale: सहभागी रूप स्वप्न के दृश्य की भूमिका बनाता है; हिन्दी कथा-शैली में पूर्ण घटना के लिए ‘स्वप्न देखा’ अधिक स्वाभाविक है, जबकि अगला सहभागी दृश्य की प्रगतिशील अवस्था व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह ध्यान आकर्षित करने वाला कथन-सूचक है, जो स्वप्न में सामने आए दृश्य को सजीव बनाता है।
- source_word: עֹמֵד
  choice: खड़ा था
  rationale: सहभागी रूप स्वप्न के भीतर जारी अवस्था को व्यक्त करता है; हिन्दी में ‘खड़ा था’ इसका स्वाभाविक रूप है।
- source_word: עַל הַיְאֹר
  choice: नील नदी के किनारे
  rationale: मिस्री संदर्भ में יְאֹר नील को दर्शाता है और עַל यहाँ नदी के पास अथवा तट पर खड़े होने का संबंध व्यक्त करता है।
