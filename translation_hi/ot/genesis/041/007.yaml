base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/007.yaml
  text: And the thin ears swallowed up the seven healthy and full ears[a]. Then Pharaoh awoke, and behold[b], it was a dream.
translation:
  language: hi
  text: पतली बालियों ने सात पुष्ट और भरी हुई बालियों को निगल लिया। फिर फ़िरौन जाग उठा, और देखो, यह एक सपना था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּבְלַעְנָה
  choice: निगल लिया
  rationale: בלע का सीधा अर्थ ‘निगलना’ है। यह स्वप्न के अस्वाभाविक और सजीव चित्र को बनाए रखता है; ‘खा गईं’ मूल से कुछ कम विशिष्ट होता।
- source_word: הַשִּׁבֳּלִים הַדַּקּוֹת
  choice: पतली बालियों
  rationale: שִׁבֹּלֶת यहाँ अनाज के दाने वाले ऊपरी भाग को दर्शाता है, जिसके लिए हिंदी में ‘बाली’ स्वाभाविक और सटीक है; דַּקּוֹת का सीधा अर्थ ‘पतली’ है।
- source_word: שֶׁבַע הַשִּׁבֳּלִים הַבְּרִיאוֹת וְהַמְּלֵאוֹת
  choice: उन सात हरी-भरी और दानों से भरी बालियों
  rationale: בְּרִיאוֹת पुष्ट, स्वस्थ या अच्छी दशा का भाव देता है; बालियों के लिए ‘हरी-भरी’ सहज हिंदी है। מְלֵאוֹת का अर्थ ‘भरी हुई’ है, और ‘दानों से’ जोड़ने से हिंदी में अभिप्राय स्पष्ट होता है।
- source_word: וַיִּיקַץ פַּרְעֹה
  choice: फिर फ़िरौन जाग उठा
  rationale: וַיִּיקַץ का स्वाभाविक कथात्मक अर्थ ‘जाग उठा’ है। ‘फिर’ हिंदी में घटनाक्रम को सहज रूप से आगे बढ़ाता है।
- source_word: וְהִנֵּה חֲלוֹם
  choice: और देखा कि यह एक सपना था
  rationale: इब्रानी वाक्य अत्यंत संक्षिप्त है—शाब्दिक रूप से ‘और देखो, एक सपना।’ हिंदी में ‘देखा कि’ הִנֵּה की आकस्मिक अनुभूति को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘यह एक सपना था’ आवश्यक क्रिया जोड़कर अर्थ स्पष्ट करता है।
