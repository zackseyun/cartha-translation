  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֤י בַ/בֹּ֨קֶר֙ וַ/תִּפָּ֣עֶם רוּח֔/וֹ וַ/יִּשְׁלַ֗ח וַ/יִּקְרָ֛א אֶת כָּל חַרְטֻמֵּ֥י מִצְרַ֖יִם וְ/אֶת כָּל חֲכָמֶ֑י/הָ וַ/יְסַפֵּ֨ר פַּרְעֹ֤ה לָ/הֶם֙ אֶת חֲלֹמ֔/וֹ וְ/אֵין פּוֹתֵ֥ר אוֹתָ֖/ם לְ/פַרְעֹֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/008.yaml
  text: In the morning[a], his spirit was troubled, so he sent and called all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but there was no one who could interpret them for Pharaoh.
translation:
  language: hi
  text: सुबह फिरौन का मन व्याकुल हो उठा। तब उसने मिस्र के सभी जादूगरों और सभी बुद्धिमानों को बुलवा भेजा। फिरौन ने उन्हें अपना स्वप्न[a] सुनाया, पर कोई भी फिरौन को उनका अर्थ न बता सका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ पहले ‘स्वप्न’ एकवचन है, लेकिन आगे उसके लिए बहुवचन सर्वनाम ‘उनका’ आया है। यह स्वप्न के अलग-अलग अंशों की ओर संकेत कर सकता है। कुछ अनुवाद इसे सहज बनाकर ‘उसका अर्थ’ कहते हैं।
    reason: स्रोत-पाठ में एकवचन संज्ञा और बहुवचन सर्वनाम के बीच वास्तविक व्याकरणिक तनाव को स्पष्ट करना।
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: सुबह
  rationale: यह इब्रानी समय-सूचक वाक्यांश को सहज और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַתִּפָּעֶם רוּחוֹ
  choice: फिरौन का मन व्याकुल हो उठा
  rationale: रूअख़ यहाँ फिरौन की भीतरी अवस्था को सूचित करता है; ‘मन’ और ‘व्याकुल हो उठा’ हिन्दी में उसके आंतरिक उद्वेग को स्वाभाविक रूप से व्यक्त करते हैं। स्पष्टता के लिए सर्वनाम के स्थान पर ‘फिरौन’ रखा गया है।
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: उसने ... बुलवा भेजा
  rationale: यह हिन्दी मुहावरा संदेशवाहक भेजकर दरबार में बुलाने की दोनों क्रमिक क्रियाओं को संक्षेप में और स्वाभाविक ढंग से समेटता है।
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: मिस्र के सभी जादूगरों
  rationale: संदर्भ में ये मिस्री गुप्त कलाओं और स्वप्न-व्याख्या से जुड़े धार्मिक-राजकीय विशेषज्ञ हैं; ‘जादूगर’ सामान्य पाठक के लिए स्पष्ट प्रचलित पद है।
- source_word: כָּל חֲכָמֶיהָ
  choice: सभी बुद्धिमानों
  rationale: यह मिस्र के व्यापक ज्ञानी अथवा दरबारी विद्वान वर्ग को दर्शाता है और जादूगरों से उसका भेद बनाए रखता है।
- source_word: וַיְסַפֵּר פַּרְעֹה לָהֶם אֶת חֲלֹמוֹ
  choice: फिरौन ने उन्हें अपना स्वप्न सुनाया
  rationale: मसोरा-पाठ में संज्ञा एकवचन है; ‘सुनाया’ किसी स्वप्न का विवरण देने के लिए सहज हिन्दी है।
- source_word: וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה
  choice: पर कोई भी फिरौन को उनका अर्थ न बता सका
  rationale: ‘अर्थ बताना’ स्वप्न की व्याख्या के लिए सहज हिन्दी है। ‘उनका’ स्रोत के बहुवचन कर्म-सर्वनाम को बनाए रखता है और स्वप्न के विभिन्न अंशों की ओर संकेत कर सकता है।
