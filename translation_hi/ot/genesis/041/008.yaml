  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘फिरौन’ को स्पष्टता के लिए आरंभ में दोहराया गया है; विशेष धार्मिक या सांप्रदायिक शब्दावली से बचा गया है।
