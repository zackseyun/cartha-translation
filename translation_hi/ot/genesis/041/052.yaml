source:
  edition: WLC
  text: וְ/אֵ֛ת שֵׁ֥ם הַ/שֵּׁנִ֖י קָרָ֣א אֶפְרָ֑יִם כִּֽי הִפְרַ֥/נִי אֱלֹהִ֖ים בְּ/אֶ֥רֶץ עָנְיִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/052.yaml
  text: And he named the second Ephraim[a], for God has made me fruitful in the land of my affliction.
translation:
  language: hi
  text: और उसने दूसरे का नाम एप्रैम[a] रखा, क्योंकि परमेश्वर ने मेरे दुःख की भूमि में मुझे फलवन्त किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “एप्रैम” नाम की ध्वनि उस इब्रानी अभिव्यक्ति से मिलती-जुलती है जिसका अर्थ है “मुझे फलवन्त किया है।”
    reason: नाम और הִפְרַנִי के बीच का इब्रानी शब्द-खेल हिन्दी में सीधे दिखाई नहीं देता।
lexical_decisions:
- source_word: וְאֵת שֵׁם הַשֵּׁנִי קָרָא
  choice: और उसने दूसरे का नाम ... रखा
  rationale: इब्रानी नामकरण-वाक्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और आरम्भिक संयोजक וְ को ‘और’ के रूप में बनाए रखता है।
- source_word: אֶפְרָיִם
  choice: एप्रैम
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण; इसकी ध्वनि और הִפְרַנִי के बीच का शब्द-खेल पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כִּי
  choice: क्योंकि उसने कहा
  rationale: כִּי नाम रखने का कारण बताता है। ‘उसने कहा’ हिन्दी में उद्धृत नाम-व्याख्या को सहज बनाता है, यद्यपि यह क्रिया मूल में निहित है, प्रत्यक्ष रूप से लिखी नहीं है।
- source_word: הִפְרַנִי
  choice: मुझे फलवन्त किया है
  rationale: פרה के हिफ़ील रूप का कारणवाचक अर्थ सुरक्षित रहता है और ‘एप्रैम’ के साथ शब्द-खेल भी बना रहता है; पूर्ण क्रिया के वर्तमान परिणाम को ‘किया है’ व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया और प्रसंग इस्राएल के परमेश्वर की ओर संकेत करते हैं; आधुनिक हिन्दी बाइबल-शैली में यह स्वाभाविक और स्पष्ट है।
- source_word: בְּאֶרֶץ עָנְיִי
  choice: मेरे दुःख के देश में
  rationale: इब्रानी संबंध-वाक्यांश का निकट और स्वाभाविक अनुवाद है; ‘दुःख’ पीड़ा/क्लेश का अर्थ देता है, बिना उसके समय या सीमा को निर्धारित किए।
theological_decisions:
- issue: यूसुफ की नाम-व्याख्या में फलवन्तता और दुःख का संबंध
  choice: यूसुफ परमेश्वर को अपनी फलवन्तता का कर्ता मानता है, फिर भी मिस्र को ‘मेरे दुःख का देश’ कहता है।
  alternative: ‘दुःख’ को केवल मिस्र आने से पहले की घटनाओं या केवल परिवार से निर्वासन तक सीमित समझना।
  rationale: मूल पद फलवन्तता और दुःख दोनों को साथ रखता है तथा दुःख की सीमा स्पष्ट नहीं करता; अनुवाद इस तनाव और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘फलवन्त’ कुछ साहित्यिक है, पर मूल रूपक और नाम-संबंध को सुरक्षित रखने के लिए उपयुक्त है।
