  text: וְ/הִנֵּ֞ה שֶֽׁבַע פָּר֤וֹת אֲחֵרוֹת֙ עֹל֣וֹת אַחֲרֵי/הֶ֔ן דַּלּ֨וֹת וְ/רָע֥וֹת תֹּ֛אַר מְאֹ֖ד וְ/רַקּ֣וֹת בָּשָׂ֑ר לֹֽא רָאִ֧יתִי כָ/הֵ֛נָּה בְּ/כָל אֶ֥רֶץ מִצְרַ֖יִם לָ/רֹֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/019.yaml
  text: And behold[a], seven other cows came up after them, poor and very ugly in appearance and thin in flesh[b]. I had not seen any like them in all the land of Egypt for ugliness.
translation:
  language: hi
  text: और देखो, उनके पीछे सात और गायें ऊपर आईं। वे कमज़ोर, देखने में बहुत कुरूप और शरीर से दुबली थीं। उनके जैसी इतनी बुरी दशा की गायें मैंने मिस्र के पूरे देश में कहीं नहीं देखी थीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुरूपता में।” इब्रानी अभिव्यक्ति उनके अत्यंत खराब रूप और दयनीय दशा का व्यापक मूल्यांकन भी कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: स्वप्न-वर्णन में नए और चौंकाने वाले दृश्य की ओर ध्यान खींचने वाले जीवंत कथात्मक संकेत को बनाए रखता है।
- source_word: שֶׁבַע פָּרוֹת אֲחֵרוֹת
  choice: सात और गायें
  rationale: פָּרוֹת स्त्रीलिंग गोवंश को सूचित करता है; आधुनिक हिन्दी में ‘गायें’ सटीक और स्वाभाविक है।
- source_word: עֹלוֹת אַחֲרֵיהֶן
  choice: उनके पीछे ... ऊपर आईं
  rationale: सहभागी रूप को स्वप्न के क्रमिक वर्णन में स्वाभाविक सीमित क्रिया के रूप में प्रस्तुत किया गया है और नदी से ऊपर आने की गति सुरक्षित रखी गई है।
- source_word: דַּלּוֹת
  choice: कमज़ोर
  rationale: यह शब्द गायों की दयनीय, क्षीण दशा बताता है; ‘कमज़ोर’ सामान्य पाठक के लिए स्पष्ट है और आगे के ‘शरीर से दुबली’ से पूरी तरह एकार्थी नहीं है।
- source_word: וְרָעוֹת תֹּאַר מְאֹד
  choice: देखने में बहुत कुरूप
  rationale: यहाँ רָעוֹת नैतिक बुराई नहीं, बल्कि अत्यंत खराब रूप-रंग को सूचित करता है; हिन्दी वाक्यांश दृश्य अर्थ स्पष्ट करता है।
- source_word: וְרַקּוֹת בָּשָׂר
  choice: शरीर से दुबली
  rationale: गायों के मांस या देह की क्षीणता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא רָאִיתִי כָהֵנָּה בְּכָל אֶרֶץ מִצְרַיִם
  choice: उनके जैसी गायें मैंने मिस्र के पूरे देश में कहीं नहीं देखी थीं
  rationale: तुलना, पूरे मिस्र का विस्तार और फ़िरौन के पूर्व अनुभव की दृष्टि—तीनों को स्पष्ट तथा सहज हिन्दी में रखता है।
- source_word: לָרֹעַ
  choice: बदहाली में
  rationale: अंतिम व्यापक मूल्यांकन को केवल रूप-सौंदर्य तक सीमित नहीं करता; इसमें गायों की कुरूपता और दयनीय शारीरिक दशा दोनों समा सकती हैं।
