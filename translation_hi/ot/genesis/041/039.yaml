  terminology: ‘फ़िरौन,’ ‘यूसुफ़,’ and ‘परमेश्वर’ are suitable standard Hindi biblical forms. ‘समझदार और बुद्धिमान’ naturally preserves the two related Hebrew descriptors without artificially over-distinguishing them.
  issues:
