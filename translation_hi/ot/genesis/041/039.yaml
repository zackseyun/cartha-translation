source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אַחֲרֵ֨י הוֹדִ֧יעַ אֱלֹהִ֛ים אוֹתְ/ךָ֖ אֶת כָּל זֹ֑את אֵין נָב֥וֹן וְ/חָכָ֖ם כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
translation:
  language: hi
  text: तब फ़िरौन ने यूसुफ़ से कहा, “चूँकि परमेश्वर ने तुम्हें यह सब बता दिया है,[a] तो तुम्हारे समान समझदार और बुद्धिमान कोई नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: औपचारिक रूप से, “परमेश्वर द्वारा तुम्हें यह सब बताए जाने के बाद।” इब्रानी शब्द का अर्थ “के बाद” भी हो सकता है, लेकिन यहाँ यह फ़िरौन के निष्कर्ष का आधार व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम को स्पष्ट करता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का मानक हिन्दी बाइबलीय रूप।
- source_word: אַחֲרֵי
  choice: जब
  rationale: मूल अर्थ ‘के बाद’ है, पर यहाँ यह फ़िरौन के निष्कर्ष की परिस्थिति और आधार दोनों व्यक्त करता है; ‘जब ... तो’ हिन्दी में इस संबंध को स्वाभाविक रखते हुए मूल की हल्की अर्थगत खुलावट बचाता है।
- source_word: הוֹדִיעַ
  choice: बता दिया है
  rationale: ידע के हिफ़ील रूप का अर्थ ‘जानने देना/विदित कराना’ है; यह चयन वर्तमान हिन्दी में सहज है और ईश्वरीय प्रकाशन का भाव रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: क्रिया और संदर्भ यहाँ एकवचन दैवी संदर्भ दर्शाते हैं; ‘परमेश्वर’ मानक, गरिमापूर्ण हिन्दी है।
- source_word: אֶת כָּל זֹאת
  choice: यह सब
  rationale: पूरे प्रकट किए गए विषय के लिए संक्षिप्त और स्वाभाविक हिन्दी।
- source_word: אֵין
  choice: कोई नहीं है
  rationale: अस्तित्वसूचक निषेध का स्वाभाविक हिन्दी रूप।
- source_word: נָבוֹן
  choice: समझदार
  rationale: विवेकपूर्ण समझ और परख की क्षमता व्यक्त करता है, जो यूसुफ़ की व्याख्यात्मक अंतर्दृष्टि के अनुकूल है।
- source_word: וְחָכָם
  choice: और बुद्धिमान
  rationale: חכם का मानक अर्थ रखते हुए נבון के साथ जुड़े दोहरे गुण को सुरक्षित करता है।
- source_word: כָּמוֹךָ
  choice: तुम्हारे समान
  rationale: नकारात्मक तुलना में मूल के अर्थ को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: फ़िरौन के कथन में אֱלֹהִים का संदर्भ
  choice: परमेश्वर
  alternative: देवता
  rationale: यद्यपि אֱלֹהִים का रूप बहुवचन हो सकता है, निकट संदर्भ और एकवचन क्रियात्मक प्रयोग उस परमेश्वर की ओर संकेत करते हैं जिसने यूसुफ़ को अर्थ बताया; इसलिए एकवचन उचित है।
- issue: אַחֲרֵי का कारणात्मक या कालिक बल
  choice: जब ... तो
  alternative: चूँकि / परमेश्वर के यह सब बताने के बाद
  rationale: इब्रानी का औपचारिक अर्थ ‘के बाद’ है, जबकि प्रसंग में वही तथ्य फ़िरौन के निष्कर्ष का आधार भी बनता है। मुख्य पाठ का ‘जब ... तो’ दोनों पहलुओं को खुला रखता है और पादटिप्पणी विकल्प स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण कथात्मक शैली। ‘समझदार और बुद्धिमान’ मूल के दो निकटवर्ती किंतु अलग गुणों को बनाए रखता है।
