    rationale: This is possible but foregrounds temporal sequence. In this context Pharaoh is drawing an inference from God's disclosure, so ‘चूँकि’ more faithfully communicates the causal/inferential force.
  - severity: low
    issue: The footnote's literal alternative is awkwardly framed and repeats the main-text causal option.
    rationale: A concise note should identify ‘के बाद’ as the formal lexical alternative and explain that the context supports the causal rendering in the text.
