source:
  edition: WLC
  text: וְ/לֹֽא יִוָּדַ֤ע הַ/שָּׂבָע֙ בָּ/אָ֔רֶץ מִ/פְּנֵ֛י הָ/רָעָ֥ב הַ/ה֖וּא אַחֲרֵי כֵ֑ן כִּֽי כָבֵ֥ד ה֖וּא מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/031.yaml
  text: And the abundance in the land will not be known because of that famine afterward[b][a], for it will be very severe.
translation:
  language: hi
  text: और देश में उस बहुतायत का पता नहीं चलेगा, क्योंकि उसके बाद पड़ने वाला वह अकाल बहुत ही भयंकर होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִוָּדַע
  choice: पता नहीं चलेगा
  rationale: निफ़अल रूप यहाँ ‘जाना/पहचाना/महसूस किया जाना’ का भाव देता है। प्रसंग में आशय है कि बाद का अकाल पहले की बहुतायत का कोई बोध या चिह्न शेष नहीं रहने देगा।
- source_word: הַשָּׂבָע
  choice: बहुतायत
  rationale: यह शब्द भरपूरी या प्रचुर उपज को दर्शाता है; यूसुफ की कथा के कृषि-संदर्भ में ‘बहुतायत’ स्वाभाविक और व्यापक है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: यहाँ क्षेत्र मिस्र है, इसलिए ‘देश’ उपयुक्त है; सार्वभौमिक ‘पृथ्वी’ अभिप्रेत नहीं है।
- source_word: מִפְּנֵי
  choice: क्योंकि
  rationale: 'पूर्वसर्ग कारण बताता है: बाद के अकाल के कारण पहले की बहुतायत का पता नहीं चलेगा।'
- source_word: הָרָעָב הַהוּא אַחֲרֵי כֵן
  choice: उसके बाद वह अकाल पड़ेगा
  rationale: यह प्रस्तुति इब्रानी के संकेतवाचक ‘वह’ और कालक्रम ‘उसके बाद’ दोनों को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: כִּי כָבֵד הוּא מְאֹד
  choice: वह अकाल बहुत ही भयंकर होगा
  rationale: כָבֵד का मूल भाव ‘भारी’ है, पर अकाल के साथ इसका अर्थ अत्यंत कठोर या प्रचंड होना है; ‘बहुत ही भयंकर’ तीव्रता को सहज हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पता नहीं चलेगा’ मूल क्रिया की ज्ञात, पहचाने या अनुभव किए जाने की अर्थ-सीमा को प्रसंगानुकूल रूप से व्यक्त करता है।
