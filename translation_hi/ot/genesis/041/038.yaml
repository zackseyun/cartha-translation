source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל עֲבָדָ֑י/ו הֲ/נִמְצָ֣א כָ/זֶ֔ה אִ֕ישׁ אֲשֶׁ֛ר ר֥וּחַ אֱלֹהִ֖ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/038.yaml
  text: Then Pharaoh said to his servants[a], “Can we find a man like this[b], in whom is the spirit of God?”
translation:
  language: hi
  text: तब फ़िरौन ने अपने सेवकों से कहा, “क्या हमें ऐसा कोई मनुष्य मिल सकता है, जिसमें परमेश्वर की आत्मा[a] हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर की कोई आत्मा,” “परमेश्वर की आत्मा,” अथवा “दैवी आत्मा।” इब्रानी पदबंध רוּחַ אֱלֹהִים को एक से अधिक प्रकार से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: עֶבֶד राजदरबार में सेवक या अधिकारी दोनों को सूचित कर सकता है; ‘सेवकों’ सीधा अर्थ रखते हुए पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הֲנִמְצָא
  choice: क्या हमें ... मिल सकता है
  rationale: प्रश्नवाचक कण और प्रथम पुरुष बहुवचन क्रिया एक आलंकारिक-विचारात्मक प्रश्न बनाते हैं; हिन्दी में यह प्रयोग स्वाभाविक है।
- source_word: כָזֶה אִישׁ
  choice: इसके जैसा कोई मनुष्य
  rationale: यह संकेतवाचक बल और पुरुषवाचक एकवचन संज्ञा, दोनों को बनाए रखता है और प्रसंग में यूसुफ की ओर संकेत करता है।
- source_word: אֲשֶׁר ... בּוֹ
  choice: जिसमें ... हो
  rationale: यह इब्रानी के ‘जिसमें/उसमें’ वाले संबंधवाचक और स्थानवाचक ढाँचे को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: רוּחַ אֱלֹהִים
  choice: परमेश्वर का आत्मा
  rationale: यह इब्रानी रचना का सीधा रूप है और उसे किसी एक व्याख्या तक सीमित नहीं करता; वाक्यांश की संभावित अनिश्चित या गुणसूचक समझ पादटिप्पणी में दी गई है।
theological_decisions:
- issue: क्या רוּחַ אֱלֹהִים विशिष्ट रूप से परमेश्वर के आत्मा को दर्शाता है या सामान्य अर्थ में दैवी आत्मा को
  choice: परमेश्वर का आत्मा
  alternative: परमेश्वर की ओर से कोई आत्मा; दैवी आत्मा
  rationale: इब्रानी पदबंध में निश्चित उपपद नहीं है और फ़िरौन की दृष्टि से इसका अर्थ कम निश्चित भी समझा जा सकता है। मुख्य पाठ सीधा संबंधसूचक अनुवाद रखता है, जबकि वास्तविक अर्थगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रजिस्टर रखा गया है। ‘अधिकारी’ के बजाय ‘सेवक’ मूल शब्द के व्यापक अर्थ को बनाए रखता है। ‘जिसमें ... हो’ शाब्दिक संरचना और स्वाभाविक हिन्दी के बीच संतुलन रखता है।
