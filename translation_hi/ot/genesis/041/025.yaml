  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। स्रोत की एकवचन संरचना और कृदंत की कालगत अस्पष्टता को मुख्य पाठ तथा पादटिप्पणियों में सुरक्षित रखा गया है।
