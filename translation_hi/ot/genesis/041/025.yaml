  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל פַּרְעֹ֔ה חֲל֥וֹם פַּרְעֹ֖ה אֶחָ֣ד ה֑וּא אֵ֣ת אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הִגִּ֥יד לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/025.yaml
  text: Then Joseph said to Pharaoh[a], “Pharaoh’s dreams are one[b]; what God is doing he has declared to Pharaoh.”
translation:
  language: hi
  text: तब यूसुफ ने फ़िरौन से कहा, “फ़िरौन का स्वप्न एक ही है[a]; परमेश्वर जो कर रहा है, वह उसने फ़िरौन को बता दिया है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फ़िरौन के स्वप्न एक ही हैं।” इब्रानी में “स्वप्न” एकवचन है, पर प्रसंग में फ़िरौन के दोनों स्वप्नों को एक ही संदेश माना गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर जो करने वाला है, वह उसने फ़िरौन को बता दिया है।” इब्रानी कृदंत का अर्थ “कर रहा है,” “करता है,” या इस प्रसंग में “करने वाला है” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: חֲלוֹם פַּרְעֹה אֶחָד הוּא
  choice: फ़िरौन का स्वप्न एक ही है
  rationale: इब्रानी में ‘स्वप्न’ एकवचन है और विधेय ‘एक’ है। प्रसंग में दो स्वप्न-वृत्तांतों को एक संदेश के रूप में देखा गया है; मुख्य पाठ स्रोत की व्याकरणिक एकवचनता बनाए रखता है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ निश्चित रूप से परमेश्वर का उल्लेख है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: עֹשֶׂה
  choice: जो कर रहा है
  rationale: इब्रानी कृदंत को सीधे वर्तमान/गतिशील रूप में रखा गया है; आसन्न भविष्य का भाव संदर्भ से समझा जा सकता है, पर उसे मुख्य पाठ में अनिवार्य नहीं किया गया।
- source_word: הִגִּיד לְפַרְעֹה
  choice: उसे उसने फ़िरौन पर प्रकट कर दिया है
  rationale: हिफ़ील क्रिया का अर्थ बताना या ज्ञात कराना है। स्वप्न द्वारा दिव्य प्रकटीकरण के प्रसंग में ‘प्रकट कर दिया’ अर्थ और गरिमा दोनों को रखता है; ‘पर’ हिन्दी में किसी पर बात प्रकट करने का स्वाभाविक प्रयोग है।
theological_decisions:
- issue: הָאֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: ईश्वर / वह परमेश्वर
  rationale: निश्चित संदर्भ सुरक्षित रहता है और इब्रानी लेख के कारण हिन्दी में अनावश्यक ‘वह’ नहीं जोड़ा जाता।
- issue: עֹשֶׂה का कालगत भाव
  choice: जो कर रहा है
  alternative: जो करने वाला है
  rationale: कृदंत स्वयं वर्तमान, सामान्य या आसन्न कार्य का भाव दे सकता है। मुख्य पाठ अधिक प्रत्यक्ष रूप रखता है और पादटिप्पणी संदर्भगत भाव बताती है।
