  text: अब फ़िरौन एक समझदार और बुद्धिमान पुरुष को ढूँढ़े[a] और उसे मिस्र देश का अधिकारी नियुक्त करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फ़िरौन एक समझदार और बुद्धिमान पुरुष को देखे या चुने।” इस प्रसंग में इब्रानी क्रिया का अर्थ देखना, खोज निकालना, या चुनना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यूसुफ़ के स्वप्न का अर्थ बताने से व्यावहारिक परामर्श की ओर बढ़ने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יֵרֶא
  choice: ढूँढ़े
  rationale: यहाँ ראה का आज्ञार्थक भाव केवल देखने का नहीं, बल्कि उपयुक्त व्यक्ति को खोजने या चुनने का है; संदर्भ में ‘ढूँढ़े’ सहज है और मूल की अर्थ-सीमा के लिए पाद-टिप्पणी दी गई है।
- source_word: פַרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: אִישׁ
  choice: पुरुष
  rationale: मूल शब्द पुल्लिंग एकवचन है और संदर्भ में एक पुरुष अधिकारी की बात है।
- source_word: נָבוֹן
  choice: समझदार
  rationale: व्यावहारिक सूझ-बूझ और सही निर्णय की क्षमता को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: וְחָכָם
  choice: और बुद्धिमान
  rationale: חכם की बुद्धि और कुशल निर्णय की धारणा को व्यक्त करता है तथा ‘समझदार’ से संबंधित, किंतु अलग गुण बनाए रखता है।
- source_word: וִישִׁיתֵהוּ
  choice: और उसे ... नियुक्त करे
  rationale: शाब्दिक ‘रखे/स्थापित करे’ का प्रशासनिक संदर्भ में स्वाभाविक अर्थ ‘नियुक्त करे’ है।
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: मिस्र देश पर
  rationale: עַל से अधिकार का भाव और אֶרֶץ מִצְרָיִם की ‘मिस्र देश’ अभिव्यक्ति दोनों सुरक्षित रहते हैं।
