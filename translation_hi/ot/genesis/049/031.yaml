translation:
  language: hi
  text: वहीं उन्होंने अब्राहम और उसकी पत्नी सारा को दफ़नाया; वहीं उन्होंने इसहाक और उसकी पत्नी रिबका को दफ़नाया; और वहीं मैंने लिआ को दफ़नाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: वहीं
  rationale: यह स्थानवाचक क्रियाविशेषण पहले वर्णित कब्र की गुफा की ओर संकेत करता है। ‘वहीं’ इस संकेत और तीनों खंडों में उसकी पुनरावृत्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: קָבְרוּ
  choice: उन्होंने ... दफ़नाया
  rationale: काल पूर्ण, तृतीय पुरुष बहुवचन रूप अनिर्दिष्ट मानवीय कर्ताओं को व्यक्त करता है; इसलिए इब्रानी की सक्रिय रचना को रखा गया है।
- source_word: אִשְׁתּוֹ
  choice: उसकी पत्नी
  rationale: एकवचन पुल्लिंग संबंधसूचक प्रत्यय को स्वाभाविक हिन्दी में ‘उसकी पत्नी’ कहा गया है और सारा तथा रिबका दोनों के साथ इसकी पुनरावृत्ति रखी गई है।
- source_word: קָבַרְתִּי
  choice: मैंने ... दफ़नाया
  rationale: काल पूर्ण, प्रथम पुरुष एकवचन याकूब द्वारा लिआ को दफ़नाने की बीती हुई क्रिया बताता है।
- source_word: קָבְרוּ ... קָבְרוּ ... קָבַרְתִּי
  choice: दफ़नाया ... दफ़नाया ... दफ़नाया
  rationale: मूल में קבר की तीन बार हुई पुनरावृत्ति को समान हिन्दी क्रिया द्वारा सुरक्षित रखा गया है।
- source_word: לֵאָה
  choice: लिआ
  rationale: नाम को आधुनिक मानक हिन्दी में प्रचलित बाइबलीय लिप्यंतरण के अनुसार दिया गया है।
