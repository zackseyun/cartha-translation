source:
  edition: WLC
  text: לֹֽא יָס֥וּר שֵׁ֨בֶט֙ מִֽ/יהוּדָ֔ה וּ/מְחֹקֵ֖ק מִ/בֵּ֣ין רַגְלָ֑י/ו עַ֚ד כִּֽי יָבֹ֣א שילה וְ/ל֖/וֹ יִקְּהַ֥ת עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/010.yaml
  text: The scepter will not depart from Judah[a], nor the ruler’s staff from between his feet, until Shiloh comes[b]; and to him will be the obedience of the peoples.
translation:
  language: hi
  text: 'राजदंड यहूदा से दूर न होगा,

    न शासक की छड़ी उसके पाँवों के बीच से हटेगी,

    जब तक शीलो आए[a];

    और जाति-जाति के लोग उसी की आज्ञा मानेंगे[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब तक वह आए जिसका अधिकार है।” इब्रानी शब्द शीलो कठिन है; इसे एक उपाधि, स्थान के नाम, या भेंट/कर के संकेत के रूप में भी समझा गया है।
    reason: alternative_reading
  - marker: b
    text: या “जाति-जाति के लोग उसके पास इकट्ठे होंगे,” अथवा “जाति-जाति के लोग उसके अधीन होंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: राजदंड
  rationale: राजकीय काव्य-संदर्भ और מְחֹקֵק के साथ समानांतर प्रयोग में यह शासन के चिह्न को दर्शाता है; इसलिए सामान्य ‘छड़ी’ या ‘गोत्र’ के बजाय ‘राजदंड’ उपयुक्त है।
- source_word: מִיהוּדָה
  choice: यहूदा से
  rationale: पूर्वसर्ग अलग होने या दूर जाने के स्रोत को व्यक्त करता है; ‘यहूदा’ हिन्दी बाइबल परंपरा में प्रचलित नाम है।
- source_word: מְחֹקֵק
  choice: शासक की छड़ी
  rationale: यह शब्द आदेश देने वाले शासक अथवा उसके अधिकार के प्रतीक दंड को सूचित कर सकता है। राजदंड के समानांतर और ‘पाँवों के बीच से’ के साथ यहाँ शासन का प्रतीक स्वाभाविक है।
- source_word: מִבֵּין רַגְלָיו
  choice: उसके पाँवों के बीच से
  rationale: ठोस इब्रानी बिंब को ज्यों का त्यों रखा गया है। यह सिंहासन पर बैठे शासक या वंशजों की ओर संकेत कर सकता है, पर मुख्य पाठ में उस व्याख्या को थोपा नहीं गया।
- source_word: עַד כִּי
  choice: जब तक
  rationale: यह पहले कथन की समय-सीमा प्रस्तुत करता है और हिन्दी में ‘जब तक’ इसका सहज, संक्षिप्त रूप है।
- source_word: שילה
  choice: शीलो
  rationale: इब्रानी रूप अत्यंत कठिन और विवादित है। पारंपरिक स्वरांकन के अनुसार इसे व्यक्तिवाचक नाम मानकर लिप्यंतरित किया गया है; प्रमुख वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: וְלוֹ
  choice: उसी की
  rationale: मुख्य पाठ में ‘शीलो’ को व्यक्ति-संदर्भ मानने पर सर्वनाम को व्यक्तिगत रूप में प्रस्तुत करना वाक्य को स्वाभाविक रखता है, बिना उसकी पहचान को और स्पष्ट किए।
- source_word: יִקְּהַת
  choice: आज्ञा मानेंगे
  rationale: यह दुर्लभ और विवादित शब्द है। राजकीय संदर्भ में लोगों की आज्ञाकारिता का भाव उपयुक्त है; ‘इकट्ठे होना’ और ‘अधीन होना’ पादटिप्पणी में सुरक्षित हैं।
- source_word: עַמִּים
  choice: देश-देश के लोग
  rationale: बहुवचन का व्यापक जातीय दायरा व्यक्त करने के लिए यह सहज हिन्दी रूप चुना गया है; यह किसी एक राजनीतिक ‘राष्ट्र’ तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: दीर्घकाल से मसीही अर्थ में पढ़े गए कठिन शब्द שילה की पहचान और अनुवाद
  choice: मुख्य पाठ में ‘शीलो’ को लिप्यंतरित नाम के रूप में रखा गया है और उसे स्पष्ट रूप से मसीहा नहीं कहा गया।
  alternative: ‘वह जिसका यह अधिकार है’, ‘जब तक भेंट उसके पास न आए’, अथवा ‘जब तक वह शीलो न आए’।
  rationale: यह कठिन इब्रानी पाठ की वास्तविक अनिश्चितता और धर्मवैज्ञानिक तनाव को बनाए रखता है। इससे राजकीय या मसीही पाठ की संभावना खुली रहती है, पर अनुवाद मूल कथन से आगे बढ़कर पहचान निर्धारित नहीं करता।
- issue: पद का राजकीय और संभावित मसीही बल
  choice: ‘राजदंड’, ‘शासक की छड़ी’ और लोगों की आज्ञाकारिता जैसी राजकीय भाषा रखी गई है।
  alternative: केवल वंशगत-राजनीतिक व्याख्या करना, या मुख्य पाठ में स्पष्ट मसीही पहचान जोड़ना।
  rationale: पद में यहूदा से जुड़ी राजकीय छवियाँ स्पष्ट हैं। अनुवाद उन्हें बनाए रखता है, लेकिन मूल पाठ से अधिक स्पष्ट कोई साम्प्रदायिक या धर्मसैद्धांतिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक पंक्ति-विन्यास और गरिमापूर्ण, सहज शब्दावली रखी गई है। ठोस इब्रानी बिंब ‘पाँवों के बीच’ को व्याख्यात्मक विस्तार के बिना सुरक्षित रखा गया है; कठिन शब्दों की प्रमुख संभावनाएँ पादटिप्पणियों में दी गई हैं।
