  text: בִּנְיָמִין֙ זְאֵ֣ב יִטְרָ֔ף בַּ/בֹּ֖קֶר יֹ֣אכַל עַ֑ד וְ/לָ/עֶ֖רֶב יְחַלֵּ֥ק שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/027.yaml
  text: Benjamin is a ravenous wolf[a]; in the morning he devours the prey[d][c][b], and in the evening he divides the spoil.
translation:
  language: hi
  text: बिन्यामीन फाड़नेवाला भेड़िया है; सुबह वह शिकार खाता है, और शाम को लूट बाँटता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְיָמִין
  choice: बिन्यामीन
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: זְאֵב יִטְרָף
  choice: फाड़ खानेवाला भेड़िया
  rationale: זְאֵב का अर्थ ‘भेड़िया’ है और טרף उसके शिकार को फाड़ने की हिंस्र क्रिया व्यक्त करता है; संयुक्त हिन्दी पद मूल बिंब को स्वाभाविक ढंग से रखता है।
- source_word: בַּבֹּקֶר
  choice: सुबह
  rationale: कालवाचक पद का सहज और संक्षिप्त आधुनिक हिन्दी रूप।
- source_word: יֹאכַל עַד
  choice: वह शिकार खाता है
  rationale: יֹאכַל सामान्यतः ‘खाता है’ और यहाँ दुर्लभ עַד संदर्भ में खाए जानेवाले शिकार को सूचित करता है; भेड़िये का बिंब बनाए रखने के लिए ‘शिकार’ चुना गया।
- source_word: וְלָעֶרֶב
  choice: और शाम को
  rationale: सुबह और शाम की समानांतर काव्यात्मक संरचना सुरक्षित रखता है।
- source_word: יְחַלֵּק שָׁלָל
  choice: लूट का माल बाँटता है
  rationale: חלק का पिएल रूप बाँटने/हिस्सा करने और שָׁלָל युद्ध में प्राप्त लूट को दर्शाता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: बिन्यामीन के विषय में रूपक का आशय
  choice: हिंस्र शक्ति और विजय से मिली लूट बाँटने का काव्यात्मक चित्र किसी विशिष्ट भावी घटना से जोड़े बिना रखा गया।
  alternative: इसे बिन्यामीन गोत्र के बाद के युद्धशील इतिहास की स्पष्ट भविष्यवाणी मानना।
  rationale: इब्रानी पाठ स्वयं कोई ऐतिहासिक पूर्ति या पात्र निर्दिष्ट नहीं करता; इसलिए अनुवाद व्याख्यात्मक निष्कर्ष जोड़े बिना रूपक को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘फाड़ खानेवाला’ प्रबल काव्यात्मक बिंब को व्यक्त करता है, जबकि ‘लूट का माल’ शिकार के पशु-बिंब से युद्ध-विजय के बिंब की ओर मूल पंक्ति के परिवर्तन को स्पष्ट रखता है।
