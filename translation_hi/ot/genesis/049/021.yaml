  yaml_path: translation/ot/genesis/049/021.yaml
  text: Naphtali is a doe let loose[b][a], giving beautiful words.
translation:
  language: hi
  text: नप्ताली एक मुक्त छोड़ी हुई हिरनी है[a]; वह सुंदर वचन बोलता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘स्वतंत्र छोड़ दी गई हिरनी’; इब्रानी में ऐसी मादा हिरन का बिंब है जिसे मुक्त दौड़ने के लिए छोड़ दिया गया हो।
    reason: lexical_alternative
  - marker: b
    text: अंतिम खंड को अलग-अलग ढंग से भी समझा गया है, जैसे ‘जो सुंदर उक्तियाँ देता है’; कुछ व्याख्याओं में अंतिम शब्दों के लिए भिन्न अर्थ मानकर ‘जो सुंदर बच्चे जनती है’ भी समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: נַפְתָּלִי
  choice: नप्ताली
  rationale: व्यक्ति और गोत्र का नाम; हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: אַיָּלָה
  choice: हिरनी
  rationale: यह शब्द मादा हिरन को दर्शाता है; ‘हिरनी’ आधुनिक हिन्दी में स्वाभाविक है और स्त्रीलिंग बिंब को बनाए रखता है।
- source_word: שְׁלֻחָה
  choice: खुली छोड़ी गई
  rationale: שלח का निष्क्रिय रूप यहाँ उस हिरनी का बिंब देता है जिसे स्वतंत्र दौड़ने के लिए छोड़ दिया गया हो; यह अनुवाद ‘भेजी गई’ की अपेक्षा प्रसंगानुकूल है।
- source_word: הַנֹּתֵן
  choice: जो ... कहता है
  rationale: सवर्णित कृदंत पुल्लिंग एकवचन है और सम्भवतः रूपक के पीछे नप्ताली को विषय बनाता है; हिन्दी में पुल्लिंग क्रिया इस व्याकरणिक तनाव को दिखाती है।
- source_word: אִמְרֵי
  choice: वचन
  rationale: אמר का बहुवचन रचनात्मक रूप कथनों या बोले हुए शब्दों को दर्शाता है; ‘वचन’ काव्यात्मक और गरिमापूर्ण है।
- source_word: שָׁפֶר
  choice: सुंदर
  rationale: शब्द सौंदर्य, मनोहरता या रमणीयता का भाव देता है; ‘सुंदर’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: अंतिम कृदंतीय उपवाक्य का कर्ता और अर्थ
  choice: ‘जो सुंदर वचन कहता है’ को रूपक के पीछे नप्ताली से संबद्ध रखा गया है।
  alternative: इसे हिरनी से संबद्ध मानना, अथवा अंतिम शब्दों को ‘जो सुंदर बच्चे जनती है’ जैसे अर्थ में समझना।
  rationale: मसोरेटिक पाठ का स्वाभाविक अर्थ ‘सुंदर वचन देने/कहने वाला’ है, और הַנֹּתֵן का पुल्लिंग रूप नप्ताली की ओर संकेत कर सकता है। फिर भी काव्य-पंक्ति संक्षिप्त तथा व्याख्यात्मक रूप से अनिश्चित है, इसलिए वैकल्पिक समझ पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; पद की काव्यात्मक संक्षिप्तता तथा कर्ता-संबंधी अस्पष्टता को यथासंभव बनाए रखा गया है।
