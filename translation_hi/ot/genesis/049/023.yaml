lexical_decisions:
- source_word: וַיְמָרֲרֻהוּ
  choice: उसे कटुता से सताया
  rationale: पिएल रूप में मूल מרר किसी को कड़वाहट देना, कटु बनाना या कटु व्यवहार से पीड़ित करना व्यक्त करता है। प्रसंग के शत्रुतापूर्ण काव्यात्मक समानांतर को देखते हुए यह अनुवाद कड़वाहट और उत्पीड़न दोनों भाव रखता है।
- source_word: וָרֹבּוּ
  choice: उस पर तीर चलाए
  rationale: यह क्रिया कठिन और अर्थ की दृष्टि से अनिश्चित है। सामान्यतः רבה का अर्थ ‘बहुत होना’ हो सकता है, पर ‘तीरों के स्वामी’ अर्थात तीरंदाज़ों के निकट संदर्भ में परंपरागत ‘तीर चलाना’ अर्थ चित्र को स्वाभाविक रूप से पूरा करता है; वैकल्पिक व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וַיִּשְׂטְמֻהוּ
  choice: उससे बैर रखा
  rationale: שטם गहरी शत्रुता, द्वेष या घृणा को दर्शाता है। ‘बैर रखा’ आधुनिक हिन्दी में स्थायी शत्रुता का स्पष्ट और काव्यात्मक रूप से उपयुक्त अनुवाद है।
- source_word: בַּעֲלֵי חִצִּים
  choice: तीरंदाज़ों
  rationale: शाब्दिक रूप से ‘तीरों के स्वामी/धारक’; यह तीर चलाने वालों के लिए मुहावरा है। हिन्दी में ‘तीरंदाज़’ इसका स्वाभाविक समतुल्य है।
