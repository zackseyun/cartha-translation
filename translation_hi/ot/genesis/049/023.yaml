    text: या, “उन्होंने उसे कड़वाहट पहुँचाई, उससे संघर्ष किया और उससे बैर रखा—वे तीरंदाज़।” बीच की इब्रानी क्रिया कठिन है; इसका अधिक सामान्य अर्थ “उससे संघर्ष किया” या “उस पर धावा बोला” भी हो सकता है।
