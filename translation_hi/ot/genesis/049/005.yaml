  choice: शिमोन
  rationale: इब्रानी व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְלֵוִי
  choice: और लेवी
  rationale: संयोजक וְ को ‘और’ तथा नाम לֵוִי को प्रचलित हिन्दी रूप ‘लेवी’ से व्यक्त किया गया।
- source_word: אַחִים
  choice: भाई हैं
  rationale: यहाँ शाब्दिक भ्रातृत्व अभिप्रेत है; इब्रानी के क्रियारहित वाक्य को स्वाभाविक हिन्दी बनाने के लिए ‘हैं’ जोड़ा गया।
- source_word: כְּלֵי חָמָס
  choice: हिंसा के हथियार
  rationale: כְּלֵי का अर्थ व्यापक रूप से औज़ार या उपकरण हो सकता है, पर חָמָס के साथ इस प्रसंग में ‘हथियार’ हिंसक आशय को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: מְכֵרֹתֵיהֶם
  choice: उनकी तलवारें
  rationale: यह अत्यंत दुर्लभ और अनिश्चित शब्द है। प्रसंग के आधार पर इसे ठोस हिंसक साधन, ‘तलवारें’, के रूप में लिया गया है; अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
