  text: יְהִי דָן֙ נָחָ֣שׁ עֲלֵי דֶ֔רֶךְ שְׁפִיפֹ֖ן עֲלֵי אֹ֑רַח הַ/נֹּשֵׁךְ֙ עִקְּבֵי ס֔וּס וַ/יִּפֹּ֥ל רֹכְב֖/וֹ אָחֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/017.yaml
  text: Let Dan be a serpent by the road[a], a viper by the path, that bites the horse’s heels so that its rider falls backward.
translation:
  language: hi
  text: 'दान मार्ग के किनारे एक साँप हो,

    पगडंडी के किनारे एक विषधर[a],

    जो घोड़े की एड़ियों पर डसे,

    जिससे उसका सवार पीछे की ओर गिर पड़े।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐडर”। इब्रानी शब्द שְׁפִיפֹן दुर्लभ है; यह किसी प्रकार के खतरनाक, संभवतः विषैले साँप को सूचित करता है, पर इसकी ठीक प्रजाति निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: हो
  rationale: היה का जुसिव रूप यहाँ याकूब के आशीर्वचन में इच्छा और घोषणात्मक भाव के बीच का स्वर रखता है; हिंदी काव्य में “हो” इस सूक्ष्मता को स्वाभाविक रूप से बनाए रखता है।
- source_word: דָן
  choice: दान
  rationale: याकूब के पुत्र और उससे निकले गोत्र का व्यक्तिवाचक नाम; प्रचलित हिंदी बाइबलीय रूप रखा गया है।
- source_word: נָחָשׁ
  choice: साँप
  rationale: यह साँप के लिए सामान्य शब्द है। आधुनिक हिंदी में “साँप” स्पष्ट और सहज है, जबकि अगली पंक्ति में अधिक विशिष्ट और खतरनाक प्रकार के लिए “विषधर” है।
- source_word: עֲלֵי דֶרֶךְ
  choice: मार्ग के किनारे
  rationale: पूर्वसर्ग और संज्ञा का मेल मार्ग के पास घात लगाकर रहने की स्थिति दर्शाता है; “के किनारे” इस दृश्य को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שְׁפִיפֹן
  choice: विषधर
  rationale: यह किसी खतरनाक साँप के लिए प्रयुक्त दुर्लभ शब्द है, जिसकी सटीक प्रजाति अनिश्चित है। “विषधर” खतरे का भाव देता है, पर किसी निश्चित प्रजाति का दावा नहीं करता।
- source_word: עֲלֵי אֹרַח
  choice: पगडंडी के किनारे
  rationale: यह पहले पदबंध के समानांतर है। “पगडंडी” דֶרֶךְ और אֹרַח के काव्यात्मक पर्याय-भेद को हिंदी में बनाए रखती है।
- source_word: הַנֹּשֵׁךְ
  choice: जो ... डसे
  rationale: कृदंत साँप को उसके कार्य से वर्णित करता है। साँप के काटने के लिए “डसना” सटीक और स्वाभाविक हिंदी है।
- source_word: עִקְּבֵי סוּס
  choice: घोड़े की एड़ियों
  rationale: रचना घोड़े के पिछले पाँवों या एड़ी के भाग को दर्शाती है; एकवचन “घोड़ा” यहाँ जातिवाचक है।
- source_word: וַיִּפֹּל
  choice: जिससे ... गिर पड़े
  rationale: वाव-क्रम bite के परिणाम को आगे बढ़ाता है। “जिससे” कारण-परिणाम का संबंध स्पष्ट करता है, और “गिर पड़े” अचानक गिरने का भाव देता है।
- source_word: רֹכְבוֹ
  choice: उसका सवार
  rationale: सर्वनामिक प्रत्यय का निकटतम और स्वाभाविक संदर्भ घोड़ा है; “उसका सवार” हिंदी में सहज है।
- source_word: אָחוֹר
  choice: पीछे की ओर
  rationale: यह गिरने की दिशा बताता है; “पीछे की ओर” आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
