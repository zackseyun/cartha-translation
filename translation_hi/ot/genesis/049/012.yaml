  text: חַכְלִילִ֥י עֵינַ֖יִם מִ/יָּ֑יִן וּ/לְבֶן שִׁנַּ֖יִם מֵ/חָלָֽב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/012.yaml
  text: His eyes are darker than wine[b][a], and his teeth whiter than milk.
translation:
  language: hi
  text: 'उसकी आँखें दाखमधु से लाल[a] हैं,

    और उसके दाँत दूध से सफेद[b] हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी आँखें दाखमधु से भी अधिक गहरी (या चमकीली) हैं।” दुर्लभ हिब्रू शब्द और “से” के लिए प्रयुक्त संबंधबोधक शब्द कारण तथा तुलना—दोनों अर्थों की अनुमति देते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “और उसके दाँत दूध से भी अधिक सफेद हैं।” इस पंक्ति को भी तुलना के रूप में समझा जा सकता है।
    reason: grammatical_alternative
lexical_decisions:
- source_word: חַכְלִילִי
  choice: लाल
  rationale: यह दुर्लभ विशेषण आँखों के गहरे लाल या चमकीले रूप का संकेत देता है। नीतिवचन 23:29 में संबंधित शब्द-प्रयोग और यहाँ दाखमधु की प्रचुरता का निकट संदर्भ ‘लाल’ का समर्थन करते हैं, जबकि शब्द की अनिश्चितता को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: עֵינַיִם
  choice: आँखें
  rationale: द्विवचन संज्ञा का स्वाभाविक और सीधा हिन्दी अनुवाद।
- source_word: מִיָּיִן
  choice: दाखमधु से
  rationale: 'מִן को यहाँ कारण या स्रोत के अर्थ में लिया गया है: दाखमधु के कारण आँखें लाल हैं। यह पद 11 में दाखमधु की प्रचुरता से मेल खाता है; तुलनात्मक अर्थ भी व्याकरणतः संभव है और पाद-टिप्पणी में दिया गया है।'
- source_word: וּלְבֶן
  choice: और ... सफेद
  rationale: विशेषण को समानांतर काव्य-पंक्ति में स्वाभाविक हिन्दी विधेय के रूप में प्रस्तुत किया गया है।
- source_word: שִׁנַּיִם
  choice: दाँत
  rationale: द्विवचन संज्ञा का सीधा हिन्दी अनुवाद।
- source_word: מֵחָלָב
  choice: दूध से
  rationale: पहली पंक्ति के समान מִן को कारण या स्रोत के अर्थ में रखा गया है, जिससे दाखमधु और दूध की प्रचुरता का समानांतर चित्र बनता है। तुलनात्मक अर्थ पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: מִן का कारणवाचक या तुलनात्मक अर्थ
  choice: 'कारण/स्रोत: ‘दाखमधु से ... दूध से’'
  alternative: 'तुलना: ‘दाखमधु से अधिक गहरी ... दूध से अधिक सफेद’'
  rationale: निकट संदर्भ में दाखमधु और दूध की प्रचुरता तथा दोनों अर्ध-पंक्तियों की समरूपता कारणवाचक अर्थ का समर्थन करती है। फिर भी हिब्रू מִן दोनों अर्थ दे सकता है, इसलिए वास्तविक अस्पष्टता पाद-टिप्पणी में बनी रहती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। ‘दाखमधु’ काव्यात्मक-बाइबिलीय संदर्भ में स्पष्ट है; पद की दो समानांतर पंक्तियाँ दृश्यात्मक ढंग से सुरक्षित रखी गई हैं।
