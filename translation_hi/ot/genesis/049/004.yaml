source:
  edition: WLC
  text: פַּ֤חַז כַּ/מַּ֨יִם֙ אַל תּוֹתַ֔ר כִּ֥י עָלִ֖יתָ מִשְׁכְּבֵ֣י אָבִ֑י/ךָ אָ֥ז חִלַּ֖לְתָּ יְצוּעִ֥/י עָלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/004.yaml
  text: Unstable as water[a], you shall not excel, because you went up to your father’s bed; then you defiled it—he went up to my couch.
translation:
  language: hi
  text: 'जल के समान अस्थिर, तू श्रेष्ठ न रहेगा,

    क्योंकि तू अपने पिता की शय्या पर चढ़ गया;

    तब तूने मेरे बिछौने को अपवित्र किया—

    वह चढ़ गया![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे अधिक सहज रूप में इस प्रकार भी समझा जा सकता है: “तब तूने मेरे बिछौने को अपवित्र किया—तू उस पर चढ़ गया।” इब्रानी के अंतिम वाक्यांश में अचानक तीसरा पुरुष, “वह चढ़ गया,” आता है; संभवतः यह रूबेन की ओर संकेत करने वाली विस्मयपूर्ण पुनरुक्ति है।'
    reason: अंतिम उपवाक्य में इब्रानी के अचानक पुरुष-परिवर्तन और उसके अधिक सहज वैकल्पिक पाठ को सुरक्षित रखना।
lexical_decisions:
- source_word: פַּחַז
  choice: बेलगाम
  rationale: यह शब्द अस्थिरता, उतावलेपन और अनियंत्रित आवेग का भाव रखता है। जल की उपमा के साथ ‘बेलगाम’ स्वाभाविक है और रूबेन के अनियंत्रित आचरण का नैतिक भाव भी बनाए रखता है।
- source_word: כַּמַּיִם
  choice: जल के समान
  rationale: यह सीधी उपमा है; आधुनिक, गरिमापूर्ण हिन्दी में तुलना को स्पष्ट रखती है।
- source_word: אַל תּוֹתַר
  choice: तू श्रेष्ठ न रहेगा
  rationale: यहाँ יתר का संबंध पहलौठे की प्रधानता अथवा श्रेष्ठ स्थान खोने से है। यह अनुवाद आज्ञार्थक-जैसी निषेधात्मक भविष्यवाणी और प्रसंगगत श्रेष्ठता दोनों व्यक्त करता है।
- source_word: כִּי עָלִיתָ
  choice: क्योंकि तू ... चढ़ गया
  rationale: כִּי का कारणवाचक अर्थ और עלה की शाब्दिक, किंतु यौन-संदर्भ में व्यंजक भाषा दोनों सुरक्षित हैं।
- source_word: מִשְׁכְּבֵי אָבִיךָ
  choice: अपने पिता की शय्या
  rationale: मूल में बहुवचन रूप है, पर यहाँ वह पिता की वैवाहिक शय्या का संकेत करता है; हिन्दी में एकवचन अधिक स्वाभाविक है।
- source_word: חִלַּלְתָּ
  choice: अशुद्ध किया
  rationale: क्रिया अपवित्र या दूषित करने का अर्थ देती है। पारिवारिक और यौन प्रसंग में ‘अशुद्ध किया’ स्पष्ट है और आरोप की गंभीरता बनाए रखता है।
- source_word: יְצוּעִי
  choice: मेरे बिछौने
  rationale: यह बिस्तर अथवा शय्या को दर्शाता है। ‘मेरे’ को स्पष्ट रखते हुए ‘बिछौना’ पहले प्रयुक्त ‘शय्या’ की यांत्रिक पुनरावृत्ति से बचाता है।
- source_word: עָלָה
  choice: वह चढ़ गया
  rationale: मूल रूप तीसरे पुरुष एकवचन में है और पिछले दूसरे पुरुष से अचानक बदलता है। इसी असामान्य बदलाव को मुख्य पाठ में सुरक्षित रखा गया है।
theological_decisions:
- issue: रूबेन के यौन अपराध के लिए प्रयुक्त व्यंजक भाषा और नैतिक मूल्यांकन
  choice: ‘अपने पिता की शय्या पर चढ़ गया’ और ‘अशुद्ध किया’ के रूप में मूल की स्पष्ट किंतु व्यंजक भाषा बनाए रखी गई है।
  alternative: ‘अपने पिता की उपपत्नी के साथ सोया’ जैसा अधिक स्पष्ट विस्तार, अथवा ‘अपवित्र किया’ जैसा अधिक धार्मिक-संस्कार संबंधी शब्द।
  rationale: मूल पाठ अपराध को समझने योग्य व्यंजना में व्यक्त करता है, पर इस पंक्ति में उत्पत्ति 35:22 का पूरा विवरण नहीं दोहराता। अनुवाद न तो आरोप को नरम करता है, न मूल से अधिक विवरण जोड़ता है।
- issue: अंतिम उपवाक्य עָלָה में पुरुष-परिवर्तन
  choice: मसोरेटिक पाठ के तीसरे पुरुष को ‘वह चढ़ गया’ के रूप में मुख्य पाठ में रखा गया है।
  alternative: ‘तू मेरे बिछौने पर चढ़ गया’ अथवा ‘तब तूने मेरे बिछौने को अशुद्ध किया—तू उस पर चढ़ गया था।’
  rationale: अंतिम उपवाक्य अचानक दूसरे पुरुष से तीसरे पुरुष में चला जाता है। इसे चुपचाप समतल करने के बजाय मुख्य पाठ में उसकी भाषिक तीक्ष्णता और वास्तविक अस्पष्टता रखी गई है; सहज वैकल्पिक समझ पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक रूप अपनाया गया है। ‘तू’ पितृसत्तात्मक संबोधन और मूल के एकवचन दूसरे पुरुष के अनुरूप है। पंक्ति-विभाजन याकूब के कथन की लय और अंतिम विस्मयपूर्ण झटके को उभारता है।
