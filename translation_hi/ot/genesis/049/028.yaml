source:
  edition: WLC
  text: כָּל אֵ֛לֶּה שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁנֵ֣ים עָשָׂ֑ר וְ֠/זֹאת אֲשֶׁר דִּבֶּ֨ר לָ/הֶ֤ם אֲבִי/הֶם֙ וַ/יְבָ֣רֶךְ אוֹתָ֔/ם אִ֛ישׁ אֲשֶׁ֥ר כְּ/בִרְכָת֖/וֹ בֵּרַ֥ךְ אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/028.yaml
  text: 'All these are the twelve tribes of Israel[a], and this is what their father spoke to them when he blessed them: he blessed each one with the blessing appropriate to him.'
translation:
  language: hi
  text: ये सभी इस्राएल के बारह गोत्र हैं। उनके पिता ने उनसे यही कहा और उन्हें आशीर्वाद दिया; हर एक को उसके आशीर्वाद के अनुसार उसने आशीर्वाद दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: ये सभी
  rationale: यह स्वाभाविक आधुनिक हिन्दी में पूरे समूह को समेटता है और इब्रानी संकेतवाचक पद का सामूहिक बल बनाए रखता है।
- source_word: שִׁבְטֵי יִשְׂרָאֵל שְׁנֵים עָשָׂר
  choice: इस्राएल के बारह गोत्र
  rationale: सम्बन्धसूचक पद-रचना और संख्या को स्पष्ट, प्रचलित बाइबलीय हिन्दी में सीधे व्यक्त किया गया है।
- source_word: וְזֹאת אֲשֶׁר דִּבֶּר לָהֶם אֲבִיהֶם
  choice: उनके पिता ने उनसे यही कहा
  rationale: दִּבֶּר का प्रसंगानुकूल अर्थ सरल और स्वाभाविक हिन्दी में व्यक्त होता है; ‘यही’ पूर्ववर्ती कथनों की ओर संकेत करता है।
- source_word: וַיְבָרֶךְ אֹתָם
  choice: और उन्हें आशीर्वाद दिया
  rationale: इब्रानी समन्वय को बिना कालगत ‘जब’ जोड़े बनाए रखा गया है।
- source_word: אִישׁ אֲשֶׁר כְּבִרְכָתוֹ
  choice: हर एक को उसके आशीर्वाद के अनुसार
  rationale: אִישׁ का वितरणात्मक अर्थ ‘हर एक’ से और כְּבִרְכָתוֹ की वास्तविक अस्पष्टता ‘उसके आशीर्वाद के अनुसार’ से सुरक्षित रहती है; ‘उसके योग्य’ जैसी व्याख्या नहीं जोड़ी गई।
- source_word: בֵּרַךְ אֹתָם
  choice: उसने आशीर्वाद दिया
  rationale: ברך धातु की पुनरावृत्ति को हिन्दी में भी रखा गया है, जिससे मूल का सारांशात्मक और बलाघाती ढंग बना रहता है।
theological_decisions:
- issue: ‘उसके आशीर्वाद के अनुसार’ का आशय
  choice: मूल की संक्षिप्त और कुछ हद तक अस्पष्ट अभिव्यक्ति बनाए रखी गई।
  alternative: ‘हर एक को उसके लिए उपयुक्त आशीर्वाद दिया’
  rationale: वैकल्पिक रूप प्रसंग का सम्भावित अर्थ स्पष्ट करता है, पर मूल से अधिक निश्चित व्याख्या जोड़ देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पहले वाक्य में सारांश स्पष्ट है और दूसरे में मूल इब्रानी की समन्वित रचना तथा ‘आशीर्वाद’ की पुनरावृत्ति यथासम्भव सुरक्षित है।
