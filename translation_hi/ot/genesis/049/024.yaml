base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/024.yaml
  text: Yet his bow remained steady, and his arms were made agile by the hands of the Mighty One of Jacob; from there is the Shepherd, the Stone of Israel.
translation:
  language: hi
  text: 'फिर भी उसका धनुष दृढ़ बना रहा,

    और उसकी भुजाएँ फुर्तीली हो गईं

    याकूब के सामर्थी के हाथों से—

    वहीं से—इस्राएल का चरवाहा, इस्राएल का पत्थर।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी अंतिम खंड अत्यंत संक्षिप्त और वाक्य-विन्यास की दृष्टि से कठिन है। “वहीं से” का संबंध पूर्ववर्ती सहायता से अथवा बाद की उपाधियों से समझा जा सकता है; कुछ अनुवाद इसमें निहित क्रिया जोड़ते हैं: “वहीं से इस्राएल का चरवाहा, इस्राएल का पत्थर निकलता है/आता है।”'
    reason: मूल की वास्तविक वाक्यगत अनिश्चितता को सुरक्षित रखता है, बिना स्रोत में न होने वाले “याकूब के चरवाहे” या “के कारण” को जोड़ने के।
lexical_decisions:
- source_word: בְּאֵיתָן
  choice: दृढ़ बना रहा
  rationale: यह पद धनुष के स्थिर, अडिग और प्रभावी बने रहने का भाव देता है; सहज हिन्दी में क्रिया के साथ इसका अनुवाद किया गया है।
- source_word: וַיָּפֹזּוּ
  choice: फुर्तीली रहीं
  rationale: दुर्लभ क्रिया यहाँ भुजाओं के चुस्त या लचीले होकर कार्य करने का संकेत देती है; 'फुर्तीली' प्रसंगानुकूल और स्वाभाविक है।
- source_word: אֲבִיר יַעֲקֹב
  choice: याकूब का सामर्थी
  rationale: ईश्वर के लिए प्रयुक्त उपाधि का निकट और गरिमापूर्ण रूप, जिसमें सामर्थ्य का मूल भाव बना रहता है।
- source_word: רֹעֶה
  choice: चरवाहा
  rationale: शाब्दिक उपाधि को बनाए रखा गया है; यह रक्षा और अगुवाई की छवि व्यक्त करती है।
- source_word: אֶבֶן יִשְׂרָאֵל
  choice: इस्राएल की चट्टान
  rationale: אֶבֶן का मूल अर्थ 'पत्थर' है, पर ईश्वरीय उपाधि के रूप में हिन्दी में 'चट्टान' आश्रय और स्थिरता की रूपकात्मक शक्ति को अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: מִשָּׁם का संबंध और अंतिम उपाधियों की वाक्य-रचना
  choice: वहीं से इस्राएल का चरवाहा, उसकी चट्टान, आता है
  alternative: वहाँ से, याकूब के चरवाहे, इस्राएल की चट्टान के कारण
  rationale: मसोराई पाठ का अंतिम खंड व्याकरण और संबंध की दृष्टि से कठिन है। मुख्य पाठ संभावित कर्तृवाचक समझ को अपनाता है, पर अस्पष्टता और प्रमुख वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: चरवाहा और चट्टान की पहचान
  choice: दोनों को एक ही ईश्वरीय व्यक्तित्व की समानांतर उपाधियाँ माना गया
  alternative: चरवाहा यूसुफ अथवा कोई अलग मानवीय शासक हो सकता है
  rationale: निकटतम संदर्भ 'याकूब के सामर्थी' के हाथों से सहायता का है और दोनों उपाधियाँ समानांतर रूप में आती हैं; फिर भी पाठ की संक्षिप्तता के कारण अनावश्यक सिद्धान्तगत विस्तार नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। समानांतर पंक्तियों और ईश्वरीय उपाधियों को बनाए रखा गया है; कठिन इब्रानी वाक्य-विन्यास की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
