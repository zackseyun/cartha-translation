source:
  edition: WLC
  text: יְהוּדָ֗ה אַתָּה֙ יוֹד֣וּ/ךָ אַחֶ֔י/ךָ יָדְ/ךָ֖ בְּ/עֹ֣רֶף אֹיְבֶ֑י/ךָ יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֥י אָבִֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/008.yaml
  text: Judah[a], your brothers will praise you; your hand will be on the neck of your enemies[b]; the sons of your father will bow down to you.
translation:
  language: hi
  text: यहूदा, तेरे भाई तेरी स्तुति करेंगे[a]; तेरा हाथ तेरे शत्रुओं की गर्दन पर होगा; तेरे पिता के पुत्र तेरे सामने झुकेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरा धन्यवाद करेंगे।” इब्रानी क्रिया धन्यवाद देने, अंगीकार करने या स्तुति करने का अर्थ दे सकती है; यहाँ आशीर्वाद के प्रसंग और यहूदा के नाम के साथ शब्द-क्रीड़ा के कारण “स्तुति” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: व्यक्तिवाचक नाम को हिन्दी की प्रचलित बाइबलीय वर्तनी में लिप्यंतरित किया गया है।
- source_word: יוֹדוּךָ
  choice: तेरी स्तुति करेंगे
  rationale: यहाँ हिफ़ील रूप सम्मानपूर्वक प्रशंसा या स्वीकार करने का भाव देता है। ‘स्तुति करेंगे’ आशीर्वाद के प्रसंग और यहूदा के नाम के साथ निहित शब्द-क्रीड़ा को उपयुक्त रूप से व्यक्त करता है।
- source_word: אַחֶיךָ
  choice: तेरे भाई
  rationale: पुल्लिंग बहुवचन और निकट प्रसंग में याकूब के पुत्रों का उल्लेख होने के कारण मूल रूप को बनाए रखा गया है।
- source_word: יָדְךָ בְּעֹרֶף אֹיְבֶיךָ
  choice: तेरा हाथ तेरे शत्रुओं की गर्दन पर होगा
  rationale: विजय और प्रभुत्व के ठोस बिंब को व्याख्यात्मक रूप से नरम किए बिना सुरक्षित रखा गया है।
- source_word: יִשְׁתַּחֲווּ לְךָ
  choice: तेरे सामने झुकेंगे
  rationale: क्रिया दंडवत होने या अधीनता में झुकने को दर्शाती है। पारिवारिक और राजकीय सम्मान के इस प्रसंग में यह धार्मिक आराधना को अनावश्यक रूप से नहीं जोड़ती।
- source_word: בְּנֵי אָבִיךָ
  choice: तेरे पिता के पुत्र
  rationale: मूल का शाब्दिक और अर्थपूर्ण पदबंध रखा गया है; यहाँ संकेत यहूदा के भाइयों की ओर है।
theological_decisions:
- issue: יִשְׁתַּחֲווּ לְךָ में सम्मान या आराधना का भाव
  choice: मानवीय अधीनता और सम्मान में झुकना
  alternative: आराधना करना
  rationale: संबोधन यहूदा से है और प्रसंग याकूब के आशीर्वाद का है; इसलिए ‘झुकेंगे’ राजकीय या पारिवारिक अधीनता का भाव सुरक्षित रखता है, पर दिव्य आराधना का दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सहज शैली। पितृसत्तात्मक आशीर्वचन के सीधे संबोधन को बनाए रखने के लिए ‘तेरा/तेरे’ का प्रयोग किया गया है।
