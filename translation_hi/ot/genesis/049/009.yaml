source:
  edition: WLC
  text: גּ֤וּר אַרְיֵה֙ יְהוּדָ֔ה מִ/טֶּ֖רֶף בְּנִ֣/י עָלִ֑יתָ כָּרַ֨ע רָבַ֧ץ כְּ/אַרְיֵ֛ה וּ/כְ/לָבִ֖יא מִ֥י יְקִימֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/009.yaml
  text: Judah is a lion’s cub[a]; from the prey, my son, you have gone up. He crouched, he lay down like a lion[b], and like a lioness—who will rouse him?
translation:
  language: hi
  text: 'यहूदा[b] सिंह का शावक है;


    शिकार से, मेरे बेटे, तू ऊपर आया है।


    वह झुका, सिंह के समान लेट गया,


    और सिंहनी[a] के समान—


    कौन उसे जगाएगा?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पराक्रमी (या वयस्क) सिंह’। यहाँ का इब्रानी शब्द पहले आए ‘सिंह’ के शब्द से भिन्न है; इसे ‘सिंहनी’ भी समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: यहूदा के सिंह-बिंब को बाद की राजकीय और मसीहाई आशा से भी जोड़ा जाता है; पर इस पद में यह सीधे याकूब के आशीर्वचन में यहूदा के विषय में कहा गया है।
    reason: cross_reference
lexical_decisions:
- source_word: גּוּר אַרְיֵה
  choice: सिंह का शावक
  rationale: यह समास एक छोटे या युवा सिंह को दर्शाता है। ‘सिंह का शावक’ आधुनिक हिन्दी में स्वाभाविक है और रूपक को स्पष्ट रखता है।
- source_word: מִטֶּרֶף
  choice: शिकार से
  rationale: טֶרֶף शिकारी पशु द्वारा पकड़े या फाड़े गए शिकार को दर्शाता है। संक्षिप्त ‘शिकार से’ मूल बिंब और संबंधसूचक अस्पष्टता को बनाए रखता है।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: इसे याकूब द्वारा यहूदा को किए गए सीधे संबोधन के रूप में रखा गया है; मूल में न होने वाला विस्मयादिबोधक नहीं जोड़ा गया।
- source_word: עָלִיתָ
  choice: तू ऊपर आया है
  rationale: क्रिया की ऊपर की ओर गति को बनाए रखा गया है और यह नहीं बताया गया कि सिंह कहाँ या क्यों ऊपर आया, क्योंकि मूल पाठ यह स्पष्ट नहीं करता।
- source_word: כָּרַע רָבַץ
  choice: दुबककर लेट गया
  rationale: सिंह के बिंब में दोनों क्रियाएँ झुककर नीचे होने और फिर पड़े रहने की संयुक्त गति दर्शाती हैं। यह हिन्दी पदबंध दोनों को सहज ढंग से व्यक्त करता है।
- source_word: כְּאַרְיֵה
  choice: सिंह के समान
  rationale: यह אַרְיֵה के साथ सीधे तुलनात्मक प्रयोग का स्वाभाविक हिन्दी रूप है।
- source_word: וּכְלָבִיא
  choice: और बब्बर सिंह के समान
  rationale: לָבִיא प्रायः परिपक्व और शक्तिशाली सिंह को सूचित करता है। ‘बब्बर सिंह’ पहले प्रयुक्त אַרְיֵה से शब्दगत भेद बनाए रखता है; ‘सिंहनी’ एक मान्य वैकल्पिक समझ है और पादटिप्पणी में दी गई है।
- source_word: מִי יְקִימֶנּוּ
  choice: कौन उसे उठा खड़ा करेगा?
  rationale: קום के हिफ़ईल रूप का मूल अर्थ ‘उठाना/खड़ा करना’ है। यह अनुवाद सिंह को उसके विश्राम से उठाने का बिंब रखता है और ‘कौन उसे छेड़ने का साहस करेगा’ जैसी व्याख्यात्मक वृद्धि से बचता है।
theological_decisions:
- issue: यहूदा के सिंह-बिंब का मसीहाई या गोत्रीय संदर्भ
  choice: मुख्य पाठ में इसे याकूब द्वारा यहूदा को दिए गए आशीर्वचन के रूप में रखा गया है।
  alternative: इस बिंब को बाद की राजकीय और मसीहाई आशा से प्रतिरूपात्मक रूप में जोड़ना।
  rationale: पद सीधे यहूदा की सिंह-समान शक्ति और निडर विश्राम का वर्णन करता है। बाद का बाइबलीय धर्मविज्ञान इस बिंब को आगे विकसित कर सकता है, पर अनुवाद में ऐसी घोषणा जोड़ना उचित नहीं जिसे यह पद स्वयं स्पष्ट रूप से नहीं करता।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। एकवचन ‘तू’ पिता के अपने बेटे से सीधे, निकट संबोधन के कारण चुना गया है। पंक्ति-विन्यास इब्रानी कविता की गति और अंतिम अलंकारिक प्रश्न को उभारता है।
