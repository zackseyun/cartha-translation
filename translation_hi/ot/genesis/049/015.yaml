  text: וַ/יַּ֤רְא מְנֻחָה֙ כִּ֣י ט֔וֹב וְ/אֶת הָ/אָ֖רֶץ כִּ֣י נָעֵ֑מָה וַ/יֵּ֤ט שִׁכְמ/וֹ֙ לִ/סְבֹּ֔ל וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/015.yaml
  text: He saw that the resting place was good[a], and that the land was pleasant, so he bent his shoulder to bear[c][b], and became a servant for forced labor.
translation:
  language: hi
  text: उसने देखा कि विश्राम-स्थान अच्छा है[a] और भूमि मनभावनी है; तब उसने बोझ उठाने के लिए अपना कंधा झुका दिया और बेगार करने वाला बन गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्राम अच्छा है।” हिब्रू शब्द מְנֻחָה का अर्थ “विश्राम” अथवा “विश्राम-स्थान” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “कर देने वाला सेवक बन गया” अथवा “दास-मज़दूर बन गया।” हिब्रू पदबंध לְמַס עֹבֵד का ठीक सामाजिक अर्थ विवादित है; מַס प्रायः बेगार या अनिवार्य राजकीय श्रम को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מְנֻחָה
  choice: विश्राम-स्थान
  rationale: यह संज्ञा ‘विश्राम’ या ‘विश्राम-स्थान’ दोनों अर्थ दे सकती है। समानांतर पद ‘भूमि’ के कारण यहाँ स्थानवाचक अर्थ अधिक स्वाभाविक है, जबकि दूसरा अर्थ पादटिप्पणी में रखा गया है।
- source_word: טוֹב
  choice: अच्छा
  rationale: सरल और व्यापक सकारात्मक विशेषण; हिब्रू की सादगी बनाए रखता है।
- source_word: הָאָרֶץ
  choice: भूमि
  rationale: गोत्रीय आशीर्वाद के प्रसंग में इससे इस्साकार का भूभाग अभिप्रेत है।
- source_word: נָעֵמָה
  choice: मनभावनी
  rationale: भूमि के आकर्षक और सुखद होने को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וַיֵּט שִׁכְמוֹ
  choice: उसने अपना कंधा झुका दिया
  rationale: बोझ के अधीन होने की शारीरिक छवि और मुहावरे का भाव दोनों सुरक्षित रहते हैं।
- source_word: לִסְבֹּל
  choice: बोझ उठाने के लिए
  rationale: क्रिया का अर्थ भार सहना या उठाना है; हिन्दी में कंधे के साथ स्पष्ट और स्वाभाविक अभिव्यक्ति।
- source_word: לְמַס עֹבֵד
  choice: बेगार करनेवाला सेवक
  rationale: מַס प्रायः अनिवार्य श्रम या बेगार को और עֹבֵד सेवा करनेवाले को सूचित करता है। यह रूप दासत्व को आवश्यकता से अधिक निश्चित किए बिना बाध्य श्रम का भाव देता है।
theological_decisions:
- issue: अंतिम वाक्यांश में इस्साकार की अधीनता का स्वरूप
  choice: बेगार करनेवाला सेवक बन गया
  alternative: कर देनेवाला सेवक बन गया; दास-मज़दूर बन गया
  rationale: हिब्रू מַס प्रायः राजकीय बेगार या अनिवार्य श्रम को सूचित करता है, पर कराधीन सेवा का अर्थ भी प्रस्तावित किया गया है। मुख्य पाठ में अधिक संभावित श्रम-संबंधी अर्थ रखा गया और वास्तविक सामाजिक अस्पष्टता पादटिप्पणी में सुरक्षित की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक देह-चित्र ‘कंधा झुका दिया’ बनाए रखा गया है। ‘बेगार’ बाध्य श्रम के लिए संक्षिप्त और प्रचलित शब्द है; पादटिप्पणियाँ अर्थगत विकल्पों को बिना सांप्रदायिक निष्कर्ष के सुरक्षित रखती हैं।
