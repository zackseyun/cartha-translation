source:
  edition: WLC
  text: אָר֤וּר אַפָּ/ם֙ כִּ֣י עָ֔ז וְ/עֶבְרָתָ֖/ם כִּ֣י קָשָׁ֑תָה אֲחַלְּקֵ֣/ם בְּ/יַעֲקֹ֔ב וַ/אֲפִיצֵ֖/ם בְּ/יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/007.yaml
  text: Cursed be their anger[a], for it is fierce, and their wrath, for it is harsh. I will divide them in Jacob and scatter them in Israel.
translation:
  language: hi
  text: उनका क्रोध शापित हो, क्योंकि वह उग्र है; उनका कोप भी शापित हो, क्योंकि वह क्रूर है। मैं उन्हें याकूब में बाँट दूँगा और इस्राएल में तितर-बितर कर दूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: शापित हो
  rationale: निष्क्रिय कृदन्त यहाँ शाप की घोषणा के रूप में प्रयुक्त है। ‘शापित हो’ उसके घोषणात्मक और काव्यात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אַפָּם
  choice: उनका क्रोध
  rationale: शाब्दिक रूप से यह ‘नाक/नथुने’ से जुड़ा है, पर यहाँ स्थापित मुहावरेदार अर्थ ‘क्रोध’ है।
- source_word: עָז
  choice: उग्र
  rationale: क्रोध के संदर्भ में यह उसकी तीव्र और हिंसक प्रबलता व्यक्त करता है; केवल ‘बलवान’ कहना हिन्दी में अस्वाभाविक होगा।
- source_word: וְעֶבְרָתָם
  choice: और उनका कोप भी
  rationale: עֶבְרָה उमड़ते हुए प्रचंड रोष को दर्शाता है। ‘कोप’ काव्यात्मक गरिमा और ‘क्रोध’ के साथ समानांतरता दोनों बनाए रखता है।
- source_word: קָשָׁתָה
  choice: वह कठोर है
  rationale: मूल शब्द कठोरता और तीव्रता का बोध देता है। ‘कठोर’ स्रोत के निकट रहते हुए उसके रोष की निर्मम प्रकृति का संकेत देता है।
- source_word: אֲחַלְּקֵם
  choice: मैं उन्हें याकूब में बाँट दूँगा
  rationale: पिएल रूप विभाजित कर देने की क्रिया व्यक्त करता है। ‘बाँट दूँगा’ अगले पद के ‘तितर-बितर’ से शाब्दिक भेद बनाए रखता है।
- source_word: וַאֲפִיצֵם
  choice: और इस्राएल में तितर-बितर कर दूँगा
  rationale: हिफ़ील रूप किसी को बिखेर देने का भाव देता है। ‘तितर-बितर कर दूँगा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: याकूब में / इस्राएल में
  rationale: दोनों नाम सामूहिक रूप से राष्ट्र को सूचित करते हैं। मूल काव्यात्मक समानांतरता बचाने के लिए दोनों को अलग-अलग बनाए रखा गया है।
theological_decisions:
- issue: शाप का लक्ष्य
  choice: शाप उनके क्रोध और कोप पर घोषित किया गया है, सीधे शिमोन और लेवी के व्यक्तियों पर नहीं।
  alternative: भाइयों को स्वयं शापित मानना।
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘उनका क्रोध’ और ‘उनका कोप’ को शापित कहता है। अनुवाद इस भेद को बनाए रखता है और निर्णय को व्यक्तियों पर अधिक तीव्र नहीं करता।
- issue: भावी बिखराव का वक्ता और स्वर
  choice: पहले पुरुष के भावी कथन ‘मैं ... दूँगा’ को बनाए रखा गया है।
  alternative: इसे सामान्य भविष्यवाणी के रूप में ‘वे बँट जाएँगे’ कहना।
  rationale: दोनों इब्रानी क्रियाएँ प्रथम पुरुष एकवचन में हैं; इसलिए वक्ता के प्रत्यक्ष कथन को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘क्रोध/कोप’ तथा ‘बाँटना/तितर-बितर करना’ की जोड़ियाँ इब्रानी समानांतरता और शब्दगत भेद को बनाए रखती हैं।
