  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यह पद पिछले पद से जुड़ा वाक्यांश है, इसलिए आरंभ में ‘गुफा में’ रखा गया है। लंबी इब्रानी संबंधवाचक शृंखला को दो हिंदी वाक्यों में बाँटकर खेत को ‘खरीदा’ का स्पष्ट कर्म बनाया गया है।
