base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/030.yaml
  text: in the cave that is in the field of Machpelah[a], which is opposite Mamre, in the land of Canaan[d][c][b], which Abraham bought with the field from Ephron the Hittite as a burial property.
translation:
  language: hi
  text: मकपेला के खेत की उस गुफा में, जो कनान देश में मम्रे के सामने[a] है। उस खेत को अब्राहम ने हित्ती एप्रोन से दफ़नाने के लिए संपत्ति के रूप में खरीदा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मम्रे के सामने” का अनुवाद “मम्रे की ओर मुख किए हुए” या “मम्रे के सम्मुख” भी हो सकता है; इब्रानी पदबंध मम्रे के सापेक्ष स्थान बताता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जिसे अब्राहम ने हित्ती एप्रोन से उस खेत को कब्र के लिए स्वामित्व-संपत्ति के रूप में खरीदा।” इब्रानी में “उस खेत को” क्रिया “खरीदा” का प्रत्यक्ष कर्म है, और “कब्र के लिए स्वामित्व-संपत्ति” कानूनी रूप से धारित, दफ़नाने के लिए निर्धारित संपत्ति का भाव देता है।
    reason: source_syntax_and_lexical_nuance
lexical_decisions:
- source_word: בַּמְּעָרָה אֲשֶׁר בִּשְׂדֵה הַמַּכְפֵּלָה
  choice: मकपेला के खेत की उस गुफा में
  rationale: इब्रानी संबंधवाचक वाक्यांश गुफा को मकपेला के खेत में स्थित बताता है। हिंदी में ‘खेत की उस गुफा’ वही स्थान-संबंध स्वाभाविक ढंग से व्यक्त करता है और पूर्ववर्ती वाक्य से जुड़ने वाला ‘में’ बनाए रखता है।
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: मम्रे के सामने
  rationale: עַל פְּנֵי यहाँ मम्रे के सापेक्ष स्थान बताता है। ‘के सामने’ ‘opposite/facing/before’ की स्थानगत व्यापकता को बिना केवल निकटता मान लेने के सुरक्षित रखता है।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: यह सीधा भौगोलिक पदबंध है; आधुनिक हिंदी में ‘कनान देश’ स्पष्ट और प्रचलित है।
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: उस खेत को अब्राहम ने ... खरीदा था
  rationale: אֶת स्पष्ट रूप से ‘खेत’ को क्रिया ‘खरीदा’ का सीधा कर्म बनाता है। इब्रानी की संबंधवाचक और पुनरुक्त संरचना को हिंदी में अलग वाक्य बनाकर मूल व्याकरणिक अर्थ स्पष्ट रखा गया है; ‘गुफा को खेत के साथ’ जैसी व्याख्यात्मक पुनर्रचना से बचा गया है।
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: हित्ती एप्रोन से
  rationale: מֵאֵת खरीद के स्रोत या विक्रेता को सूचित करता है। ‘हित्ती’ जातिनाम है और ‘एप्रोन’ व्यक्तिनाम का लिप्यंतरण।
- source_word: לַאֲחֻזַּת קָבֶר
  choice: कब्रिस्तान की संपत्ति के रूप में
  rationale: אֲחֻזָּה कानूनी रूप से धारित संपत्ति का भाव रखता है और קֶבֶר दफनाने/कब्र से संबंधित है। यह अनुवाद केवल दफन-स्थान नहीं, खरीदी हुई संपत्ति का भाव भी बनाए रखता है।
