  text: רְאוּבֵן֙ בְּכֹ֣רִ/י אַ֔תָּה כֹּחִ֖/י וְ/רֵאשִׁ֣ית אוֹנִ֑/י יֶ֥תֶר שְׂאֵ֖ת וְ/יֶ֥תֶר עָֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/003.yaml
  text: Reuben[a], you are my firstborn, my strength and the firstfruits of my vigor[b], excelling in honor and excelling in power.
translation:
  language: hi
  text: रूबेन, तू मेरा पहलौठा है—मेरा बल और मेरे पौरुष का पहला फल[a]; सम्मान में सबसे बढ़कर और सामर्थ्य में सबसे बढ़कर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी सामर्थ्य का आरम्भ”; इब्रानी पदबंध पिता की जनन-सामर्थ्य की पहली अभिव्यक्ति की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या “गरिमा में सर्वोपरि और शक्ति में सर्वोपरि।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרִי
  choice: मेरा पहलौठा
  rationale: यह जन्मक्रम के साथ पहलौठे की पारिवारिक हैसियत और अधिकारों का संकेत भी बनाए रखता है।
- source_word: כֹּחִי
  choice: मेरा बल
  rationale: काव्यात्मक समानांतरता में स्वाभाविक है और पिता की सामर्थ्य के भाव को सीधे व्यक्त करता है।
- source_word: רֵאשִׁית אוֹנִי
  choice: मेरे पौरुष का पहला फल
  rationale: यह पिता की जनन-सामर्थ्य की पहली अभिव्यक्ति का संकेत देता है, पर भाषा को अनावश्यक रूप से चिकित्सकीय या भद्दा नहीं बनाता।
- source_word: יֶתֶר שְׂאֵת
  choice: सम्मान में सबसे बढ़कर
  rationale: יֶתֶר की श्रेष्ठता और שְׂאֵת की ऊँची प्रतिष्ठा अथवा सम्मान—दोनों भावों को सहज हिंदी में रखता है।
- source_word: יֶתֶר עָז
  choice: सामर्थ्य में सबसे बढ़कर
  rationale: पहले पदबंध के समानांतर श्रेष्ठता का भाव बनाए रखता है और עָז की शक्ति अथवा पराक्रम की अर्थ-सीमा को व्यक्त करता है।
- source_word: אַתָּה
  choice: तू ... है
  rationale: स्पष्ट सर्वनाम के जोर और पिता द्वारा पुत्र को किए गए सीधे, एकवचन संबोधन को सुरक्षित रखता है।
