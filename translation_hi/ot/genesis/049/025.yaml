  edition: WLC
  text: מֵ/אֵ֨ל אָבִ֜י/ךָ וְ/יַעְזְרֶ֗/ךָּ וְ/אֵ֤ת שַׁדַּי֙ וִ/יבָ֣רְכֶ֔/ךָּ בִּרְכֹ֤ת שָׁמַ֨יִם֙ מֵ/עָ֔ל בִּרְכֹ֥ת תְּה֖וֹם רֹבֶ֣צֶת תָּ֑חַת בִּרְכֹ֥ת שָׁדַ֖יִם וָ/רָֽחַם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/025.yaml
  text: by the God of your father[a], who will help you, and by the Almighty, who will bless you with blessings of heaven above, blessings of the deep lying beneath[b], blessings of breasts and womb.
translation:
  language: hi
  text: तुम्हारे पिता के परमेश्वर से[a]—वह तुम्हारी सहायता करेगा—और सर्वशक्तिमान से, जो तुम्हें ऊपर आकाश की आशीषें, नीचे स्थित गहरे जल की आशीषें[b], और स्तनों तथा गर्भाशय की आशीषें देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे पिता के परमेश्वर के द्वारा ... और सर्वशक्तिमान के साथ।” इब्रानी में ‘तुम्हारे पिता के परमेश्वर’ से पहले का पूर्वसर्ग और ‘सर्वशक्तिमान’ से पहले आया कण वाक्य-रचना को बहुत संक्षिप्त बनाते हैं; इसका अर्थ स्रोत, माध्यम, या निकट समानाधिकरण के रूप में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या “नीचे दुबके हुए गहरे जल की।” इब्रानी क्रिया का अर्थ “पड़ा/स्थित होना” या “दुबकना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵל אָבִיךָ
  choice: तुम्हारे पिता के परमेश्वर की ओर से
  rationale: מִן यहाँ स्रोत अथवा कर्तृत्व का संकेत दे सकता है। ‘की ओर से’ स्वाभाविक हिन्दी में स्रोत/माध्यम दोनों की निकटता बनाए रखता है, जबकि ‘तुम्हारे पिता’ सीधे यूसुफ के पिता को दर्शाता है।
- source_word: וְיַעְזְרֶךָ
  choice: वह तुम्हारी सहायता करेगा
  rationale: इब्रानी क्रिया तृतीय पुरुष एकवचन है और द्वितीय पुरुष कर्म को व्यक्त करती है। स्वतंत्र उपवाक्य काव्यात्मक संक्षिप्तता और परमेश्वर को कर्ता बनाए रखता है।
- source_word: וְאֵת שַׁדַּי
  choice: और सर्वशक्तिमान की ओर से
  rationale: שַׁדַּי को उपाधि के रूप में अनूदित किया गया है। असामान्य אֵת को निकट समानांतर/समन्वय मानते हुए पहले पदबंध की संरचना दोहराई गई है।
- source_word: וִיבָרְכֶךָ
  choice: जो तुम्हें ... आशीष देगा
  rationale: सम्बन्धवाचक उपवाक्य स्पष्ट करता है कि सर्वशक्तिमान आशीष देने वाला है और भविष्यपरक आशीर्वचन का बल बनाए रखता है।
- source_word: בִּרְכֹת שָׁמַיִם מֵעָל
  choice: ऊपर आकाश की आशीषों से
  rationale: ऊपर/नीचे के काव्यात्मक स्थानिक समानांतर को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: תְּהוֹם רֹבֶצֶת תָּחַת
  choice: नीचे पड़े हुए गहरे जल
  rationale: תְּהוֹם भूमिगत अथवा आदिम गहरे जल को दर्शाता है। רֹבֶצֶת के ‘पड़ा होना’ और ‘दुबकना’ दोनों अर्थ संभव हैं; मुख्य पाठ में अधिक स्वाभाविक ‘पड़े हुए’ चुना गया है।
- source_word: שָׁדַיִם וָרָחַם
  choice: स्तनों तथा गर्भ
  rationale: दोनों शारीरिक बिंब पोषण और प्रजनन-फलवन्तता को सीधे व्यक्त करते हैं; बहुवचन שָׁדַיִם को ‘स्तनों’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: שַׁדַּי दिव्य उपाधि का रूप
  choice: सर्वशक्तिमान
  alternative: शद्दै
  rationale: उपाधि का अर्थ अनूदित करने से सामान्य हिन्दी पाठक उसके अभिप्राय को समझ सकता है और कोई अतिरिक्त सांप्रदायिक अर्थ आरोपित नहीं होता।
- issue: מֵאֵל और וְאֵת की संक्षिप्त वाक्य-रचना
  choice: दोनों पदबंधों को ‘की ओर से’ द्वारा स्रोत/कर्तृत्व के समानांतर रूप में प्रस्तुत करना
  alternative: ‘तुम्हारे पिता के परमेश्वर के द्वारा ... और सर्वशक्तिमान के साथ’ अथवा निकट समानाधिकरण
  rationale: इब्रानी वाक्य-विन्यास अस्पष्ट और संकुचित है। मुख्य पाठ एक पठनीय संभावना देता है, जबकि टिप्पणी स्रोत, माध्यम और निकट समानाधिकरण की वास्तविक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक किन्तु सहज रूप अपनाया गया है। ‘आशीष’ जैसे परिचित बाइबलीय शब्द को रखा गया है; ऊपर/नीचे की समानांतर छवि और स्तन तथा गर्भ के ठोस फलवन्तता-बिंबों को नरम किए बिना सुरक्षित रखा गया है।
