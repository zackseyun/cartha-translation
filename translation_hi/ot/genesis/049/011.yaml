base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/011.yaml
  text: Binding his donkey to the vine[a], and his donkey’s colt to the choice vine, he washes his garments in wine[c][b], and his robe in the blood of grapes.
translation:
  language: hi
  text: 'वह अपने गधे के बच्चे को अंगूर की बेल से बाँधता है[a]

    और अपनी गधी के बच्चे को उत्तम अंगूर की बेल[b] से;

    वह अपना वस्त्र दाखमधु में धोता है

    और अपना चोगा अंगूरों के लहू[c] में।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने गधे के बछेड़े को’; इब्रानी शब्द עִיר युवा गधे या गधे के बच्चे को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘चुनी हुई अंगूर की बेल’; इब्रानी שֹׂרֵקָה श्रेष्ठ या विशेष रूप से चुनी हुई अंगूर की बेल को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: ‘अंगूरों का लहू’ अंगूर के रस या दाखमधु के लिए इब्रानी काव्यात्मक अभिव्यक्ति है; मूल बिंब यहाँ सुरक्षित रखा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: אֹסְרִי
  choice: वह ... बाँधता है
  rationale: यह क़ाल कृदंत काव्यात्मक दृश्य में चरित्रगत और सजीव क्रिया व्यक्त करता है। हिन्दी में वर्तमानकालीन क्रिया इस अर्थ को स्वाभाविक रूप से प्रकट करती है।
- source_word: לַגֶּפֶן
  choice: दाखलता से
  rationale: גֶּפֶן सामान्यतः अंगूर की बेल है। बाँधने की क्रिया के साथ हिन्दी में ‘से’ स्वाभाविक है और एक ही बेल से बाँधने का ठोस बिंब बनाए रखता है।
- source_word: עִירֹה
  choice: अपने गधे को
  rationale: עַיִר युवा गधे या गधे के बच्चे को सूचित कर सकता है। अगली पंक्ति में बच्चे का संबंध स्पष्ट होने के कारण यहाँ सहज हिन्दी ‘अपने गधे’ रखी गई है; आयु-संबंधी अर्थ फुटनोट में दिया गया है।
- source_word: וְלַשֹּׂרֵקָה
  choice: और ... उत्तम दाखलता से
  rationale: שֹׂרֵקָה चुनी हुई, श्रेष्ठ किस्म की अंगूर की बेल को सूचित करता है। ‘उत्तम दाखलता’ अर्थपूर्ण, संक्षिप्त और काव्यात्मक है।
- source_word: בְּנִי אֲתֹנוֹ
  choice: अपनी गधी के बच्चे को
  rationale: इसका शाब्दिक अर्थ ‘अपनी गधी का पुत्र’ है। ‘गधी का बच्चा’ आधुनिक हिन्दी में पशु-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּבֵּס
  choice: वह ... धोता है
  rationale: पूर्ण क्रियारूप आशीर्वाद की काव्यात्मक भविष्य-दृष्टि में सजीव या चरित्रगत घटना दिखा सकता है। वर्तमानकाल असाधारण समृद्धि के दृश्य को बिना समयार्थ को आवश्यकता से अधिक निश्चित किए प्रस्तुत करता है।
- source_word: בַּיַּיִן
  choice: दाखमधु में
  rationale: בְּ का स्थानवाची अर्थ ‘में’ ठोस चित्र को सुरक्षित रखता है। ‘दाखमधु’ יַיִן अर्थात अंगूर से बनी मदिरा को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: לְבֻשׁוֹ
  choice: अपना वस्त्र
  rationale: לְבוּשׁ पहनावे या वस्त्र का शब्द है और एकवचन सामूहिक अर्थ भी रख सकता है। ‘वस्त्र’ समानांतर काव्य-पंक्ति के लिए स्वाभाविक है।
- source_word: וּבְדַם עֲנָבִים
  choice: और ... अंगूरों के लहू में
  rationale: मूल का सजीव रूपक अक्षुण्ण रखा गया है। इसे केवल ‘अंगूर के रस’ में बदलने से काव्यात्मक तीव्रता घट जाती।
- source_word: סוּתוֹ
  choice: अपना चोगा
  rationale: यह לְבֻשׁוֹ के समानांतर एक ओढ़ने या पहनने के वस्त्र का शब्द है। ‘चोगा’ वस्त्र की अलग पहचान रखते हुए अनावश्यक तकनीकी विशिष्टता से बचता है।
theological_decisions:
- issue: यहूदा के आशीर्वाद में मसीही या गोत्रीय संकेत
  choice: पद को असाधारण समृद्धि और राजसी वैभव के काव्यात्मक चित्र के रूप में रखा गया है, बिना मुख्य पाठ में स्पष्ट मसीही व्याख्या जोड़े।
  alternative: इसे सीधे मसीही भविष्यवाणी या केवल यहूदा गोत्र की ऐतिहासिक समृद्धि के वर्णन के रूप में स्पष्ट करना।
  rationale: इब्रानी पद स्वयं दाखलताओं, दाखमधु और वस्त्रों के माध्यम से प्रचुरता का चित्र खींचता है। व्यापक प्रसंग की विभिन्न धर्मवैचारिक व्याख्याओं को अनुवाद में निर्णायक रूप से आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक समानांतरता रखी गई है। ‘दाखलता’, ‘दाखमधु’, ‘वस्त्र’ और ‘चोगा’ साधारण पाठक के लिए समझने योग्य रहते हुए प्राचीन आशीर्वाद की ऊँची शैली बनाए रखते हैं।
