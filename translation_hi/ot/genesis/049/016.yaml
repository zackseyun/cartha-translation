source:
  edition: WLC
  text: דָּ֖ן יָדִ֣ין עַמּ֑/וֹ כְּ/אַחַ֖ד שִׁבְטֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/016.yaml
  text: Dan will judge his people as one of the tribes of Israel[a].
translation:
  language: hi
  text: 'दान अपने लोगों का न्याय करेगा,

    इस्राएल के गोत्रों में से एक के समान।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दान अपने लोगों को न्याय दिलाएगा।” इब्रानी क्रिया का अर्थ केवल निर्णय सुनाना नहीं, बल्कि किसी का पक्ष लेकर उसे न्याय दिलाना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן
  choice: दान
  rationale: याकूब के पुत्र और उससे निकले गोत्र का नाम; मानक हिन्दी बाइबलीय रूप रखा गया है। इसके बाद आने वाली क्रिया ‘न्याय करेगा’ के साथ मूल का शब्द-संबंध अनुवाद में आंशिक रूप से बना रहता है।
- source_word: יָדִין
  choice: न्याय करेगा
  rationale: דין का Qal अपूर्ण रूप यहाँ याकूब के कथन में भविष्यसूचक अर्थ देता है। ‘न्याय करेगा’ न्याय करने अथवा शासन-संबंधी अधिकार प्रयोग करने का सामान्य अर्थ सुरक्षित रखता है; ‘न्याय दिलाएगा’ भी संदर्भानुसार संभव है।
- source_word: עַמּוֹ
  choice: अपने लोगों का
  rationale: עם पर तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का सीधा अर्थ ‘उसके/अपने लोग’ है। कर्ता दान होने के कारण स्वाभाविक हिन्दी में ‘अपने लोगों’ कहा गया है।
- source_word: כְּאַחַד
  choice: में से एक की तरह
  rationale: तुलनात्मक כ और אחד का अर्थ ‘एक के समान/एक की तरह’ है। हिन्दी में यह वाक्यांश दान की इस्राएल के अन्य गोत्रों के समान स्थिति व्यक्त करता है।
- source_word: שִׁבְטֵי
  choice: गोत्रों
  rationale: שֵׁבֶט का बहुवचन संबंध रूप यहाँ इस्राएल की जनजातीय इकाइयों को सूचित करता है; हिन्दी बाइबलीय प्रयोग में ‘गोत्र’ स्वाभाविक और सटीक है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्ति और वाचा-समुदाय का उचित नाम; मानक हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
theological_decisions:
- issue: दान की भूमिका में דין का अर्थ
  choice: दान अपने लोगों का न्याय करेगा और इस प्रकार इस्राएल के गोत्रों में एक के समान अधिकार रखेगा।
  alternative: दान अपने लोगों को न्याय दिलाएगा अथवा उनका पक्ष लेकर उन्हें न्याय दिलाएगा।
  rationale: דין में न्याय करना, शासन करना, या किसी को न्याय दिलाना जैसे अर्थ हो सकते हैं। ‘इस्राएल के गोत्रों में से एक की तरह’ वाला तुलनात्मक वाक्यांश अधिकार और पूर्ण गोत्रीय हैसियत की ओर संकेत करता है; फिर भी न्याय दिलाने की सकारात्मक छाया को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। काव्यात्मक आशीर्वचन की दो-पंक्तीय रचना रखी गई है। ‘न्याय करेगा’ मूल नाम दान और क्रिया דין के शब्द-संबंध को यथासंभव बनाए रखता है।
