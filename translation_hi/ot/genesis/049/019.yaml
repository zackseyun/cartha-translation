- source_word: וְהוּא
  choice: पर वह
  rationale: संयोजक וְ को यहाँ भावगत उलटाव के कारण विरोधसूचक ‘पर’ से व्यक्त किया गया है।
- source_word: יָגֻד
  choice: धावा बोलेगा
  rationale: पहले क्रियापद के समान अनुवाद रखकर पारस्परिक आक्रमण और मूल की पुनरावृत्ति को यथासंभव सुरक्षित रखा गया है।
- source_word: עָקֵב
  choice: उनके पीछे से
  rationale: शाब्दिक अर्थ ‘एड़ी’ है, पर यहाँ पीछे से प्रहार करने या पीछे लगे रहने का भाव संभव है। मुख्य पाठ में सहज हिन्दी दी गई और अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
