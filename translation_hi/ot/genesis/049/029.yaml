  text: וַ/יְצַ֣ו אוֹתָ֗/ם וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אֲנִי֙ נֶאֱסָ֣ף אֶל עַמִּ֔/י קִבְר֥וּ אֹתִ֖/י אֶל אֲבֹתָ֑/י אֶל הַ֨/מְּעָרָ֔ה אֲשֶׁ֥ר בִּ/שְׂדֵ֖ה עֶפְר֥וֹן הַֽ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/029.yaml
  text: Then he commanded them and said to them[a], “I am about to be gathered to my people. Bury me with my fathers in the cave that is in the field of Ephron the Hittite,”
translation:
  language: hi
  text: फिर उसने उन्हें आज्ञा दी और उनसे कहा, “मैं अपने लोगों से जा मिलने वाला हूँ।[a] मुझे मेरे पूर्वजों के साथ उस गुफा में दफनाना, जो हित्ती एप्रोन के खेत में है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपने लोगों से जा मिल रहा हूँ।” यह इब्रानी मुहावरा निकट आती मृत्यु और मृत्यु में अपने लोगों अथवा पूर्वजों से मिलने की ओर संकेत करता है।
    reason: इब्रानी कृदंत के आसन्न अथवा प्रगतिशील भाव और मुहावरे की अर्थच्छाया बताने के लिए।
lexical_decisions:
- source_word: וַיְצַו
  choice: उसने उन्हें आज्ञा दी
  rationale: क्रिया צוה यहाँ याकूब द्वारा अपने पुत्रों को दिया गया गंभीर निर्देश व्यक्त करती है; ‘आज्ञा दी’ उसके बल को बनाए रखता है।
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: और उनसे कहा
  rationale: सामान्य इब्रानी कथन-सूत्र को स्वाभाविक हिंदी कथात्मक शैली में रखा गया है।
- source_word: נֶאֱסָף אֶל־עַמִּי
  choice: मैं अपने लोगों में मिलाया जानेवाला हूँ
  rationale: यह निकट आती मृत्यु से संबंधित इब्रानी मुहावरा है। अनुवाद मृत्यु का सीधा पर्याय रखने के बजाय मूल रूपक और उसकी पूर्वजों से मिलन-संबंधी अर्थच्छाया को सुरक्षित रखता है।
- source_word: עַמִּי
  choice: अपने लोगों
  rationale: ‘मेरे लोग’ की मूल अभिव्यक्ति को हिंदी में स्वाभाविक आत्मवाचक रूप ‘अपने लोगों’ से प्रस्तुत किया गया है; इसे केवल ‘पूर्वजों’ तक सीमित नहीं किया गया।
- source_word: קִבְרוּ אֹתִי
  choice: मुझे ... दफनाना
  rationale: बहुवचन आज्ञार्थक का सीधा और आधुनिक हिंदी रूप है, जो संबोधित पुत्रों के लिए दिए गए निर्देश को स्पष्ट रखता है।
- source_word: אֶל־אֲבֹתָי
  choice: मेरे पूर्वजों के साथ
  rationale: शाब्दिक ‘मेरे पितरों के पास’ की अपेक्षा दफनाने के प्रसंग में ‘पूर्वजों के साथ’ स्वाभाविक है और पैतृक कब्र में साथ दफन किए जाने का अर्थ देता है।
- source_word: הַמְּעָרָה
  choice: उस गुफा
  rationale: संज्ञा का अर्थ केवल ‘गुफा’ है; प्रसंग से दफनाने का उद्देश्य स्पष्ट होने के कारण ‘कब्र की गुफा’ जैसा विस्तार नहीं जोड़ा गया।
- source_word: אֲשֶׁר בִּשְׂדֵה עֶפְרוֹן
  choice: जो ... एप्रोन के खेत में है
  rationale: मूल संबंधवाचक उपवाक्य और खेत से एप्रोन का संबंध दोनों सुरक्षित रखे गए हैं।
- source_word: הַחִתִּי
  choice: हित्ती
  rationale: एप्रोन की जातीय पहचान का प्रचलित हिंदी रूप है।
theological_decisions:
- issue: ‘अपने लोगों में मिलाया जाना’ का अर्थ
  choice: मृत्यु को सीधे कहने के बजाय मूल मुहावरे और रूपक को बनाए रखा गया
  alternative: मैं मरनेवाला हूँ
  rationale: यह अभिव्यक्ति केवल जैविक मृत्यु से अधिक, मृत्यु में अपने लोगों अथवा पूर्वजों से जुड़ने की अर्थच्छाया रखती है। रूपक को बनाए रखने से पाठ की धर्मवैचारिक व्यापकता और अस्पष्टता सुरक्षित रहती है, जबकि किसी विस्तृत परलोक-सिद्धांत को आरोपित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। ‘पूर्वजों’ साधारण पाठक के लिए स्पष्ट है, जबकि ‘अपने लोगों में मिलाया जाना’ मूल मुहावरे की काव्यात्मक और धर्मवैचारिक अर्थच्छाया को बनाए रखता है।
