base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/020.yaml
  text: Asher's food will be rich[a], and he will provide royal delicacies.
translation:
  language: hi
  text: आशेर का भोजन समृद्ध होगा[a], और वह राजा के योग्य स्वादिष्ट व्यंजन देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आशेर की रोटी चिकनी या समृद्ध होगी।”
    reason: ‘भोजन’ के लिए मूल शब्द का शाब्दिक अर्थ ‘रोटी’ है; ‘समृद्ध’ के लिए प्रयुक्त विशेषण में चिकनाई/समृद्धि का भाव है।
lexical_decisions:
- source_word: מֵאָשֵׁר
  choice: आशेर का
  rationale: मִן स्रोत या उद्गम को सूचित करता है; हिन्दी में पूरे वाक्य के साथ संबंधसूचक रचना ‘आशेर का भोजन’ स्वाभाविक है और आशेर के क्षेत्र/गोत्र से मिलने वाली उपज का भाव देती है।
- source_word: שְׁמֵנָה
  choice: भरपूर
  rationale: शाब्दिक अर्थ ‘मोटा/चिकना’ है, पर भोजन के संदर्भ में यह समृद्ध, उत्तम और प्रचुर होने का भाव देता है; ‘भरपूर’ सामान्य आधुनिक हिन्दी में इसे सहजता से व्यक्त करता है।
- source_word: לַחְמוֹ
  choice: भोजन
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, किंतु इसका व्यापक अर्थ भोजन या खाद्य-सामग्री भी हो सकता है; समानांतर पंक्ति के स्वादिष्ट व्यंजनों को देखते हुए यहाँ व्यापक अर्थ उपयुक्त है।
- source_word: וְהוּא
  choice: और वह
  rationale: स्वतंत्र सर्वनाम विषय आशेर पर बल देता है; ‘और वह’ इस बल और विषय की निरंतरता को बनाए रखता है।
- source_word: יִתֵּן
  choice: देगा
  rationale: נָתַן का सीधा अर्थ ‘देना’ है; भविष्यसूचक आशीर्वचन में ‘देगा’ सटीक और स्वाभाविक है।
- source_word: מַעֲדַנֵּי
  choice: स्वादिष्ट व्यंजन
  rationale: यह शब्द मनभावन, उत्तम या विलासपूर्ण खाद्य पदार्थों को दर्शाता है; ‘स्वादिष्ट व्यंजन’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: מֶלֶךְ
  choice: राजाओं के योग्य
  rationale: शाब्दिक रचना ‘राजा के व्यंजन’ है; ‘राजाओं के योग्य’ उस शाही गुणवत्ता का स्वाभाविक हिन्दी रूप है, बिना यह संकेत दिए कि केवल किसी एक निश्चित राजा की बात है।
