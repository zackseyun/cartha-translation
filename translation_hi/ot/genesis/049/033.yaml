  yaml_path: translation/ot/genesis/049/033.yaml
  text: When Jacob finished commanding his sons[a], he drew his feet up into the bed, breathed his last[b], and was gathered to his people.
translation:
  language: hi
  text: याकूब ने अपने पुत्रों को आज्ञाएँ देना समाप्त किया, तो उसने अपने पैर पलंग पर समेट लिए[a], अंतिम साँस ली, और अपने लोगों में जा मिला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उसने अपने पैर पलंग की ओर इकट्ठे किए।’ इब्रानी में ‘इकट्ठा करना’ क्रिया वाला मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने लोगों में जा मिला’ मृत्यु और अपने लोगों या पूर्वजों से मिलन से जुड़ी इब्रानी अभिव्यक्ति है; यह केवल दफनाए जाने की सूचना नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכַל
  choice: समाप्त कर चुका
  rationale: यह रूप याकूब द्वारा अपने पुत्रों को आज्ञाएँ देने की क्रिया पूरी होने और फिर अगली घटना घटने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְצַוֹּת
  choice: आज्ञाएँ देना
  rationale: צוה का मूल भाव आज्ञा या गंभीर निर्देश देना है। ‘आज्ञाएँ देना’ इब्रानी अर्थ के निकट रहते हुए प्रसंग की गंभीरता बनाए रखता है।
- source_word: בָּנָיו
  choice: अपने पुत्रों
  rationale: इब्रानी पाठ स्पष्ट रूप से याकूब के पुत्रों का उल्लेख करता है; इसलिए लिंग-विशिष्ट अर्थ बनाए रखा गया है।
- source_word: וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה
  choice: अपने पैर पलंग पर समेट लिए
  rationale: אָסַף का शाब्दिक अर्थ ‘इकट्ठा करना’ है, पर यहाँ शरीर की मुद्रा के लिए स्वाभाविक हिन्दी ‘पैर ... समेट लिए’ है। ‘पलंग पर’ मृत्युशय्या के दृश्य को स्पष्ट और सहज रखता है।
- source_word: הַמִּטָּה
  choice: पलंग
  rationale: מִטָּה पलंग या शय्या को सूचित कर सकता है। ‘पलंग’ सामान्य आधुनिक हिन्दी में सहज और इस दृश्य के अनुकूल है।
- source_word: וַיִּגְוַע
  choice: अंतिम साँस ली
  rationale: גוע केवल सामान्य ‘मरना’ कहने के बजाय प्राण निकलने या अंतिम साँस लेने का भाव देता है; यह अनुवाद अगली उपवाक्य की विशिष्टता भी बनाए रखता है।
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: अपने लोगों में मिला लिया गया
  rationale: निष्क्रिय रूप और ‘अपने लोगों’ की इब्रानी अभिव्यक्ति को बनाए रखने से इसे केवल दफनाए जाने के अर्थ तक सीमित नहीं किया जाता।
theological_decisions:
- issue: ‘अपने लोगों में मिला लिया गया’ का अर्थ
  choice: इब्रानी मुहावरे को निष्क्रिय रूप में बनाए रखा गया और उसे केवल दफनाए जाने के रूप में नहीं समझाया गया।
  alternative: अपने पूर्वजों के साथ दफनाया गया; अपने पुरखों के पास चला गया
  rationale: अगले अध्याय में याकूब का दफनाया जाना बाद में होता है। इसलिए यहाँ वाक्यांश को मात्र दफनाने की सूचना बना देना उचित नहीं; वर्तमान रूप मृत्यु, अपने लोगों और मृत्यु के बाद मिलाए जाने के संबंध में मूल पाठ की अर्थगत खुली जगह को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आज्ञाएँ देना’ मूल क्रिया की गंभीरता बनाए रखता है; ‘पैर ... समेट लिए’ शाब्दिकता और स्वाभाविक हिन्दी के बीच संतुलन रखता है; अंतिम वाक्यांश जानबूझकर कुछ असामान्य किन्तु अर्थ-संरक्षक निष्क्रिय रूप में है।
