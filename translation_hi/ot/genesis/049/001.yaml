  text: וַ/יִּקְרָ֥א יַעֲקֹ֖ב אֶל בָּנָ֑י/ו וַ/יֹּ֗אמֶר הֵאָֽסְפוּ֙ וְ/אַגִּ֣ידָה לָ/כֶ֔ם אֵ֛ת אֲשֶׁר יִקְרָ֥א אֶתְ/כֶ֖ם בְּ/אַחֲרִ֥ית הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/001.yaml
  text: Then Jacob called his sons and said[a], “Gather yourselves, and I will tell you what will happen to you in the latter days.”
translation:
  language: hi
  text: तब याकूब ने अपने बेटों को बुलाकर कहा, “इकट्ठे हो जाओ, और मैं तुम्हें बताऊँगा कि आने वाले दिनों में[a] तुम्हारे साथ क्या होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अन्त के दिनों में।” इब्रानी पदबंध कुछ प्रसंगों में अन्तकाल-संबंधी अर्थ भी रख सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא יַעֲקֹב אֶל־בָּנָיו
  choice: याकूब ने अपने बेटों को बुलाकर कहा
  rationale: קרא यहाँ बुलाने के अर्थ में है। अगले क्रियापद ‘कहा’ के साथ ‘बुलाकर कहा’ स्वाभाविक हिन्दी में दोनों घटनाओं का क्रम स्पष्ट करता है। בָּנָיו इस प्रसंग में याकूब के बेटों को ही सूचित करता है।
- source_word: הֵאָסְפוּ
  choice: इकट्ठे हो जाओ
  rationale: निफ़अल आज्ञार्थक रूप स्वयं एकत्र होने की आज्ञा देता है। यह अभिव्यक्ति आधुनिक हिन्दी में सहज है और सामूहिक बुलाहट का भाव बनाए रखती है।
- source_word: וְאַגִּידָה לָכֶם
  choice: और मैं तुम्हें बताऊँगा
  rationale: कोहोर्टेटिव रूप याकूब की मंशा व्यक्त करता है; हिन्दी भविष्यकाल आज्ञा के बाद आने वाले उद्देश्य और कथन-क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵת אֲשֶׁר יִקְרָא אֶתְכֶם
  choice: तुम्हारे साथ क्या होगा
  rationale: यहाँ קרה का अर्थ किसी घटना का घटित होना या किसी पर आ पड़ना है। चुना हुआ रूप स्पष्ट, वर्तमान हिन्दी के अनुकूल और अनावश्यक रूप से पुरातन नहीं है।
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: आने वाले दिनों में
  rationale: इस पदबंध का मूल भाव आगे आने वाला समय है, जबकि कुछ प्रसंगों में इसमें अन्तकाल-संबंधी अर्थ भी हो सकता है। मुख्य पाठ व्यापक भविष्य-संदर्भ को रखता है और सम्भावित अधिक शाब्दिक अर्थ को पाद-टिप्पणी में सुरक्षित करता है।
theological_decisions:
- issue: क्या בְּאַחֲרִית הַיָּמִים को स्पष्ट रूप से अन्तकाल-संबंधी पदबंध के रूप में अनूदित किया जाए
  choice: आने वाले दिनों में
  alternative: अन्त के दिनों में
  rationale: उत्पत्ति 49 का निकट प्रसंग याकूब के बेटों और उनसे निकलने वाले गोत्रों के भविष्य से जुड़ा है। इब्रानी पदबंध सामान्य भविष्य और अधिक विशिष्ट अन्तकालीन आशय—दोनों की सम्भावना रख सकता है; इसलिए मुख्य पाठ किसी एक धर्मवैज्ञानिक अर्थ को अनावश्यक रूप से निश्चित नहीं करता, और विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इकट्ठे हो जाओ’ सामान्य पाठक के लिए स्वाभाविक है, जबकि वाक्य की भविष्यसूचक गंभीरता बनी रहती है।
