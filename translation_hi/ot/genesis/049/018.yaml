base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/018.yaml
  text: For your salvation I wait[a], O Yahweh.
translation:
  language: hi
  text: तेरे उद्धार की मैं बाट जोहता हूँ[a], हे याहवे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे याहवे, मैंने तेरे छुटकारे की आशा लगाई है।”
    reason: इब्रानी में ‘उद्धार’ के लिए ‘छुटकारा’ और क्रिया के सिद्ध रूप के लिए ‘मैंने…आशा लगाई है’ भी संभव हैं।
lexical_decisions:
- source_word: לִישׁוּעָתְךָ
  choice: तेरे उद्धार की
  rationale: יְשׁוּעָה का अर्थ उद्धार या छुटकारा हो सकता है। ‘उद्धार’ इस संक्षिप्त काव्यात्मक पुकार में इसके व्यापक अर्थ को बनाए रखता है; संबंधकारक ‘की’ हिंदी मुहावरे ‘बाट जोहना’ के अनुरूप है।
- source_word: קִוִּיתִי
  choice: मैं बाट जोहता हूँ
  rationale: קוה आशा और अपेक्षा के साथ प्रतीक्षा करने का भाव व्यक्त करता है। हिंदी में ‘बाट जोहता हूँ’ इस सतत, आशापूर्ण प्रतीक्षा को स्वाभाविक और काव्यात्मक ढंग से व्यक्त करता है; सिद्ध रूप के कारण ‘मैंने बाट जोही है’ भी संभव है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम יהוה को किसी उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित विद्वत्तापूर्ण उच्चारण ‘याहवे’ से लिप्यंतरित किया गया है।
theological_decisions:
- issue: יהוה परमेश्वर-नाम का अनुवाद
  choice: हे याहवे
  alternative: हे यहोवा
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम सीधे आया है। ‘याहवे’ उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है; ‘यहोवा’ हिंदी की पारंपरिक वैकल्पिक वर्तनी/उच्चारण है।
- issue: ישועה का अर्थ-क्षेत्र
  choice: उद्धार
  alternative: छुटकारा
  rationale: ‘उद्धार’ आत्मिक अर्थ तक सीमित किए बिना संकट से बचाए जाने के व्यापक भाव को व्यक्त कर सकता है। ‘छुटकारा’ संभव है, पर अर्थ को तत्काल बचाव की ओर कुछ अधिक झुका सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। आरंभ में ‘तेरे उद्धार की’ रखकर मूल इब्रानी का बल यथासंभव सुरक्षित रखा गया है। ‘बाट जोहता हूँ’ सामान्य पाठक के लिए बोधगम्य रहते हुए आशापूर्ण प्रतीक्षा का भाव देता है।
