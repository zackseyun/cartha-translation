source:
  edition: WLC
  text: בְּ/סֹדָ/ם֙ אַל תָּבֹ֣א נַפְשִׁ֔/י בִּ/קְהָלָ֖/ם אַל תֵּחַ֣ד כְּבֹדִ֑/י כִּ֤י בְ/אַפָּ/ם֙ הָ֣רְגוּ אִ֔ישׁ וּ/בִ/רְצֹנָ֖/ם עִקְּרוּ שֽׁוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/006.yaml
  text: Let my soul not enter their council[a]; let my honor not be joined to their assembly. For in their anger they killed a man[c][b], and in their self-will they hamstrung an ox.
translation:
  language: hi
  text: मेरी आत्मा उनकी सभा में प्रवेश न करे; मेरा सम्मान उनकी मंडली से न जुड़े। क्योंकि अपने क्रोध में उन्होंने एक मनुष्य को मार डाला, और अपनी मनमानी में बैल की पिछली टाँगों की नसें काट दीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: मसोरेटिक पाठ में שׁוֹר का अर्थ “बैल” है। कुछ विद्वान व्यंजनों को अलग तरह से समझकर अंतिम पंक्ति का अनुवाद “उन्होंने एक दीवार ढा दी” करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּסֹדָם
  choice: उनकी गुप्त सभा
  rationale: סוֹד किसी घनिष्ठ या गोपनीय परामर्श-मंडल को सूचित कर सकता है। समानांतर קָהָל से भेद बनाए रखने और उसके गोपनीय विचार-विमर्श के भाव को व्यक्त करने के लिए यह स्वाभाविक हिन्दी है।
- source_word: תָּבֹא נַפְשִׁי
  choice: मेरी आत्मा ... प्रवेश न करे
  rationale: אַל के साथ क्रिया इच्छा अथवा निषेध व्यक्त करती है। 'मेरी आत्मा' हिब्रू की काव्यात्मक आत्म-संदर्भात्मक अभिव्यक्ति को बनाए रखता है।
- source_word: בִּקְהָלָם
  choice: उनकी मंडली
  rationale: קָהָל एकत्र समुदाय या सभा है। 'मंडली' यहाँ गुप्त परामर्श-सभा के समानांतर एक व्यापक एकत्र समूह का स्वाभाविक अर्थ देती है।
- source_word: תֵּחַד כְּבֹדִי
  choice: मेरा सम्मान ... सम्मिलित न हो
  rationale: יחד यहाँ जुड़ने या एक होने के अर्थ में है और כָּבוֹד व्यक्ति के सम्मान, प्रतिष्ठा अथवा महिमा को व्यक्त कर सकता है। प्रसंग में 'सम्मान' हिंसक कार्य से याकूब के नैतिक अलगाव को स्पष्ट करता है।
- source_word: בְאַפָּם
  choice: अपने क्रोध में
  rationale: אַף का मुहावरेदार अर्थ क्रोध है; यह हिन्दी में सीधा और स्वाभाविक है।
- source_word: הָרְגוּ אִישׁ
  choice: उन्होंने मनुष्य की हत्या की
  rationale: אִישׁ के एकवचन को बनाए रखा गया है। 'हत्या की' जान-बूझकर हिंसक रूप से मारने के भाव को वर्तमान हिन्दी में स्पष्ट करता है।
- source_word: וּבִרְצֹנָם
  choice: अपनी मनमानी से
  rationale: רָצוֹן इच्छा या प्रसन्नता का बोध करा सकता है; नकारात्मक प्रसंग में 'मनमानी' स्वेच्छाचारी और अनियंत्रित इच्छा का भाव सहज रूप से व्यक्त करती है।
- source_word: עִקְּרוּ
  choice: कूंचें काट दीं
  rationale: עקר पशु के पिछले पैरों की नसें काटकर उसे अपंग करने के अर्थ में समझा जाता है। 'कूंचें काटना' हिन्दी में इस ठोस क्रिया का संक्षिप्त पारंपरिक वर्णन है।
- source_word: שׁוֹר
  choice: बैल
  rationale: मसोरेटिक स्वरांकन में שׁוֹר बैल है और עקר के साथ पशु को अपंग करने का अर्थ संगत है।
theological_decisions:
- issue: כְּבֹדִי का आत्म-संदर्भात्मक काव्यात्मक अर्थ
  choice: मेरा सम्मान
  alternative: मेरी महिमा
  rationale: '''सम्मान'' यहाँ याकूब की प्रतिष्ठा और हिंसा से उसके नैतिक अलगाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है, जबकि ''महिमा'' भी शाब्दिक रूप से संभव है और इसलिए पादटिप्पणी में रखी गई है।'
- issue: अंतिम पंक्ति में שׁוֹר का पाठ
  choice: बैल
  alternative: दीवार
  rationale: मसोरेटिक स्वरांकन 'बैल' पढ़ता है और עקר के साथ यह अर्थ सहज है। व्यंजनों की दूसरी व्याख्या से 'दीवार' वाला पाठ प्रस्तावित हुआ है; वास्तविक पाठगत-व्याख्यात्मक तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। दोनों निषेधात्मक पंक्तियों का समानांतर विन्यास सुरक्षित है। 'आत्मा' को सरल 'मैं' में नहीं बदला गया, और अंतिम पंक्ति के कठिन वैकल्पिक पाठ को मुख्य पाठ में निर्णीत करने के बजाय पादटिप्पणी में रखा गया है।
