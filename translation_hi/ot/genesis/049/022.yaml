  yaml_path: translation/ot/genesis/049/022.yaml
  text: Joseph is a fruitful son[a], a fruitful son by a spring[b]; daughters step over the wall.
translation:
  language: hi
  text: यूसुफ फलवंत पुत्र है[a], सोते के पास फलवंत पुत्र; बेटियाँ[b] दीवार के ऊपर कदम बढ़ाती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यूसुफ फलवंत शाखा है, सोते के पास फलवंत शाखा।” इब्रानी पद काव्यात्मक और संक्षिप्त है; ‘शाखा’ वाला पारम्परिक अनुवाद आसपास की वनस्पति-संबंधी छवि को अधिक स्पष्ट करके प्रस्तुत करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “बेटियाँ” है। यहाँ यह दीवार के ऊपर फैलती शाखाओं या अंकुरों का रूपक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן
  choice: पुत्र
  rationale: इस शब्द का सामान्य अर्थ ‘पुत्र’ है। ‘डाली’ कहना आसपास के रूपक को स्पष्ट करता, पर मूल की काव्यात्मक संक्षिप्तता को घटा देता।
- source_word: פֹּרָת
  choice: फलवन्त
  rationale: यह פרה (‘फलना-फूलना’) से जुड़ा रूप है; ‘फलवन्त’ उसके गुणसूचक भाव को स्वाभाविक और संक्षिप्त रूप में व्यक्त करता है।
- source_word: בֵּן פֹּרָת
  choice: फलवन्त पुत्र
  rationale: यह काव्यात्मक और कुछ संक्षिप्त पदबंध है। ‘फलवन्त पुत्र’ दोनों शब्दों का सीधा अर्थ बनाए रखता है, जबकि ‘फलवन्त डाली’ अधिक व्याख्यात्मक है।
- source_word: עֲלֵי עָיִן
  choice: सोते के पास
  rationale: עַיִן का अर्थ ‘आँख’ के साथ ‘सोता/जलस्रोत’ भी होता है। फलवन्तता के संदर्भ में ‘सोते के पास’ सर्वाधिक स्वाभाविक है।
- source_word: בָּנוֹת
  choice: बेटियाँ
  rationale: शाब्दिक अर्थ ‘बेटियाँ’ है। इसे ‘डालियाँ’ या ‘कोंपलें’ मानना सम्भव रूपकात्मक व्याख्या है; मुख्य पाठ मूल की असामान्य काव्यात्मक छवि को सुरक्षित रखता है।
- source_word: צָעֲדָה
  choice: कदम बढ़ाती हैं
  rationale: क्रिया कदम रखने या आगे बढ़ने का भाव देती है। हिन्दी में बहुवचन कर्ता ‘बेटियाँ’ के साथ ‘कदम बढ़ाती हैं’ स्वाभाविक है, यद्यपि इब्रानी क्रिया का रूप एकवचन है।
- source_word: עֲלֵי שׁוּר
  choice: दीवार के ऊपर
  rationale: שׁוּר यहाँ ‘दीवार’ है; यह पद सीमा के ऊपर या पार बढ़ने की काव्यात्मक छवि प्रस्तुत करता है।
