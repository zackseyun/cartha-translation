base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/002.yaml
  text: Gather yourselves and listen[a], sons of Jacob; listen to Israel your father.
translation:
  language: hi
  text: हे याकूब के पुत्रों, इकट्ठे हो जाओ और सुनो; अपने पिता इस्राएल की सुनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקָּבְצוּ
  choice: इकट्ठे हो जाओ
  rationale: निफ़अल बहुवचन आज्ञार्थक का आत्मवाचक भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שִׁמְעוּ
  choice: सुनो / की सुनो
  rationale: पहली आज्ञा attentive hearing के लिए स्वाभाविक 'सुनो' है; שִׁמְעוּ אֶל के साथ दूसरी बार 'की सुनो' व्यक्ति की बात ध्यान से मानने-सुनने का हिन्दी मुहावरा है और पुनरावृत्ति भी बची रहती है।
- source_word: בְּנֵי יַעֲקֹב
  choice: हे याकूब के पुत्रो
  rationale: स्पष्ट पुल्लिंग बहुवचन सम्बोधन को बनाए रखता है और यहाँ एकत्र याकूब के पुत्रों को सूचित करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण; याकूब के समानांतर प्रयुक्त अलग नाम को सुरक्षित रखता है।
- source_word: אֲבִיכֶם
  choice: अपने पिता
  rationale: द्वितीय पुरुष बहुवचन संबंध को स्वाभाविक हिन्दी में व्यक्त करता है और 'इस्राएल' के साथ समानाधिकरण स्पष्ट करता है।
theological_decisions:
- issue: याकूब और इस्राएल—दोनों समानांतर नामों का अनुवाद
  choice: 'दोनों नाम अलग-अलग बनाए रखे गए: ''याकूब के पुत्रो ... अपने पिता इस्राएल''।'
  alternative: प्रवाह के लिए दोनों स्थानों पर केवल एक ही नाम रखना।
  rationale: इब्रानी काव्यात्मक समानांतरता जानबूझकर दोनों नामों का प्रयोग करती है; उन्हें एक कर देना पाठ की साहित्यिक और वाचा-संबंधी प्रतिध्वनि को मिटा देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज है। सम्बोधन में 'हे ... पुत्रो' पद्य की गंभीरता रखता है; आज्ञा की इब्रानी पुनरावृत्ति हिन्दी में भी सुरक्षित है।
