  rationale: संज्ञा מִקְנֵה यहाँ खरीदकर प्राप्त की गई संपत्ति अथवा खरीद के तथ्य को व्यक्त करती है। हिंदी में कर्मवाच्य क्रिया इस संक्षिप्त इब्रानी नामवाचक वाक्य का अर्थ स्वाभाविक और स्पष्ट रूप से देती है।
- source_word: הַשָּׂדֶה
