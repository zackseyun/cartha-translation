- source_word: וְהַמְּעָרָה
  choice: और ... गुफा
  rationale: וְ दोनों खरीदी गई वस्तुओं को जोड़ता है और מְעָרָה का सीधा अर्थ ‘गुफा’ है।
- source_word: אֲשֶׁר בּוֹ
  choice: उसमें की
  rationale: यह संबंधवाचक पदबंध गुफा का खेत के भीतर होना बताता है। ‘उसमें की गुफा’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: מֵאֵת
  choice: से
  rationale: यह खरीद के स्रोत अथवा विक्रेता को सूचित करता है; हिंदी में ‘से’ इसका सहज समतुल्य है।
- source_word: בְּנֵי חֵת
  choice: हेत के पुत्रों
  rationale: यह रूप इब्रानी जातिनाम और पारिवारिक अभिव्यक्ति दोनों को पारदर्शी ढंग से सुरक्षित रखता है; संदर्भगत विकल्प ‘हित्ती लोगों’ को पादटिप्पणी में दिया गया है।
