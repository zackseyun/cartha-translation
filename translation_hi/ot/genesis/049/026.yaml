source:
  edition: WLC
  text: בִּרְכֹ֣ת אָבִ֗י/ךָ גָּֽבְרוּ֙ עַל בִּרְכֹ֣ת הוֹרַ֔/י עַֽד תַּאֲוַ֖ת גִּבְעֹ֣ת עוֹלָ֑ם תִּֽהְיֶ֨ין֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/026.yaml
  text: The blessings of your father have prevailed beyond the blessings of my parents[a], to the utmost bounds of the ancient hills. May they be on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: hi
  text: 'तेरे पिता की आशीषें

    मेरे माता-पिता की आशीषों से भी बढ़कर हैं,

    प्राचीन पहाड़ियों की अंतिम सीमाओं तक।[a]


    वे यूसुफ के सिर पर,

    और उसके सिर की चोटी पर हों,

    जो अपने भाइयों से अलग ठहराया गया है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह इब्रानी काव्यांश कठिन है। अधिक शाब्दिक रूप में, “सनातन पहाड़ियों की अभिलाषा तक”; “प्राचीन पहाड़ियों” का अनुवाद “सनातन पहाड़ियाँ” भी हो सकता है। “मेरे माता-पिता” का अर्थ “मेरे पूर्वज” भी लिया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके सिर की चोटी पर जो अपने भाइयों में प्रधान है।” इब्रानी शब्द का मूल भाव किसी अलग किए गए या समर्पित व्यक्ति का भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכֹת אָבִיךָ
  choice: तेरे पिता की आशीषें
  rationale: बहुवचन ‘आशीषें’ काव्य में दिए गए अनेक वरदानों को व्यक्त करता है; दूसरे पुरुष का प्रत्यय यूसुफ को किए गए सीधे संबोधन को बनाए रखता है।
- source_word: גָּבְרוּ עַל
  choice: से बढ़कर हैं
  rationale: क्रिया और संबंधबोधक पद मिलकर तुलना में अधिक सामर्थ्य या श्रेष्ठता व्यक्त करते हैं; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: הוֹרַי
  choice: मेरे माता-पिता
  rationale: यह शब्द मूलतः ‘मुझे जन्म देने वाले’ लोगों को सूचित करता है। ‘माता-पिता’ इसका सीधा आधुनिक अर्थ है, यद्यपि ‘पूर्वज’ भी संभव है।
- source_word: תַּאֲוַת גִּבְעֹת עוֹלָם
  choice: प्राचीन पहाड़ियों की अंतिम सीमाओं तक
  rationale: यह कठिन काव्यांश आशीषों के दूर तक फैलने की सीमा के रूप में समझा गया है। मुख्य पाठ अर्थ को सुबोध रखता है, जबकि अधिक शाब्दिक और वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: תִּהְיֶיןָ
  choice: बनी रहें
  rationale: आशीर्वचन के प्रसंग में अपूर्ण क्रिया इच्छा अथवा प्रभावी आशीष का भाव रखती है; ‘बनी रहें’ इस भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: קָדְקֹד
  choice: सिर का मुकुट
  rationale: यह सिर के सबसे ऊपरी भाग को सूचित करता है और ‘सिर’ के साथ इब्रानी समानांतरता बनाए रखता है।
- source_word: נְזִיר אֶחָיו
  choice: अपने भाइयों से अलग ठहराया गया जन
  rationale: נְזִיר का मूल भाव अलग किए जाने या विशिष्ट ठहराए जाने का है। यह अनुवाद बाद की औपचारिक नाज़ीर संस्था को अनावश्यक रूप से यहाँ आरोपित नहीं करता और वैकल्पिक ‘प्रधान’ अर्थ को पाद-टिप्पणी में रखता है।
theological_decisions:
- issue: नְזִיר אֶחָיו में यूसुफ की उपाधि का अर्थ
  choice: अपने भाइयों से अलग ठहराया गया जन
  alternative: अपने भाइयों में प्रधान; अपने भाइयों के बीच अभिषिक्त/समर्पित जन
  rationale: यह चयन अलग किए जाने और विशिष्ट स्थान पाने के मूल अर्थ को बनाए रखता है, पर इसे केवल राजनीतिक पद या बाद की नाज़ीर प्रतिज्ञा तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। समानांतर पंक्तियाँ इब्रानी आशीर्वचन की संरचना को दर्शाती हैं। कठिन काव्यांश को मुख्य पाठ में सुबोध रूप दिया गया है, पर उसकी वास्तविक शाब्दिक और अर्थगत अनिश्चितता पाद-टिप्पणियों में स्पष्ट रूप से सुरक्षित है।
