  yaml_path: translation/ot/genesis/049/013.yaml
  text: Zebulun will dwell by the shore of the seas[a]; he will be by the shore of ships[c][b], and his flank will be toward Sidon.
translation:
  language: hi
  text: 'जबूलून समुद्रों के तट पर बसेगा[a];

    वह जहाज़ों के तट पर होगा[b],

    और उसका छोर सीदोन की ओर होगा[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘समुद्र’ बहुवचन में है; मुहावरे के अनुसार इसका अनुवाद ‘समुद्र के तट पर’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘जहाज़ों के तट पर’; इसका अर्थ ‘जहाज़ों के बंदरगाह पर’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘छोर’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ भौगोलिक संदर्भ में ‘पार्श्व’, ‘बगल’, ‘सीमा’ या ‘दूरस्थ भाग’ भी हो सकता है।
    reason: lexical_alternative
