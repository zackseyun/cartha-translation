  text: Issachar is a strong-boned donkey[a], lying down between the sheepfolds.
translation:
  language: hi
  text: 'इस्साकार मजबूत हड्डियों वाला गधा है,

    जो दो भेड़-बाड़ों के बीच लेटा हुआ है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दो काठी के थैलों के बीच।” यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और उसके अर्थ पर मतभेद है; इस पशुपालकीय आशीष के संदर्भ में “भेड़-बाड़े” पारंपरिक और संभवतः उपयुक्त अर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂשכָר
  choice: इस्साकार
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित और स्पष्ट हिन्दी लिप्यंतरण।
- source_word: חֲמֹר
  choice: गधा
  rationale: मूल शब्द का सहज आधुनिक हिन्दी अर्थ; यहाँ नर होने को अलग से स्पष्ट करना आवश्यक नहीं।
- source_word: גָּרֶם
  choice: मजबूत हड्डियों वाला
  rationale: शाब्दिक अस्थि-बिंब को बनाए रखते हुए गधे की सुदृढ़ शारीरिक बनावट व्यक्त करता है; केवल ‘हड्डीदार’ दुर्बलता का संकेत दे सकता था।
- source_word: רֹבֵץ
  choice: लेटा रहता है
  rationale: कृदन्त पशु के लेटे या दुबके रहने की अवस्था दर्शाता है; हिन्दी में यह स्वाभाविक और चित्रात्मक है।
- source_word: בֵּין
  choice: के बीच
  rationale: स्थान-संबंधी मूल अर्थ को सीधे व्यक्त करता है।
- source_word: הַמִּשְׁפְּתָיִם
  choice: दो भेड़शालाओं
  rationale: दुर्लभ द्विवचन रूप को ‘दो’ से व्यक्त किया गया है और पारंपरिक पशुपालकीय अर्थ मुख्य पाठ में रखा गया है; शब्द का अर्थ विवादित होने के कारण वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
