  text: וַ/נֹּ֕אמֶר לֹ֥א נוּכַ֖ל לָ/רֶ֑דֶת אִם יֵשׁ֩ אָחִ֨י/נוּ הַ/קָּטֹ֤ן אִתָּ֨/נוּ֙ וְ/יָרַ֔דְנוּ כִּי לֹ֣א נוּכַ֗ל לִ/רְאוֹת֙ פְּנֵ֣י הָ/אִ֔ישׁ וְ/אָחִ֥י/נוּ הַ/קָּטֹ֖ן אֵינֶ֥/נּוּ אִתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/026.yaml
  text: But we said[a], ‘We cannot go down. If our youngest brother is with us, then we will go down[c][b], for we cannot see the man's face unless our youngest brother is with us.’
translation:
  language: hi
  text: पर हमने कहा, “हम नीचे नहीं जा सकते। यदि हमारा सबसे छोटा भाई हमारे साथ हो, तो हम नीचे जाएँगे, क्योंकि यदि हमारा सबसे छोटा भाई हमारे साथ न हो, तो हम उस आदमी का चेहरा नहीं देख सकते[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“उस आदमी का चेहरा देखना” एक इब्रानी मुहावरा है, जिसका अर्थ है उसके सामने उपस्थित होना। अंतिम वाक्यांश का अधिक शाब्दिक अनुवाद है: “और हमारा सबसे छोटा भाई हमारे साथ नहीं है।”'
    reason: इब्रानी मुहावरे का अर्थ और अंतिम समन्वयी खंड का अधिक शाब्दिक विकल्प स्पष्ट करना।
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: पर हमने कहा
  rationale: वाव कथानक को आगे बढ़ाता है; यहाँ पिछले आग्रह के उत्तर में हल्का विरोध दिखाने के लिए ‘पर’ स्वाभाविक है।
- source_word: לֹא נוּכַל לָרֶדֶת
  choice: हम नीचे नहीं जा सकते
  rationale: יכל सामर्थ्य को व्यक्त करता है और ירד का भौगोलिक अर्थ मिस्र की ओर ‘नीचे जाना’ है; इसलिए ठोस दिशा-सूचक भाषा रखी गई है।
- source_word: אָחִינוּ הַקָּטֹן
  choice: हमारा सबसे छोटा भाई
  rationale: इस पारिवारिक संदर्भ में הַקָּטֹן आकार में छोटा नहीं, भाइयों में सबसे कम आयु वाला भाई है।
- source_word: אִם יֵשׁ ... אִתָּנוּ וְיָרַדְנוּ
  choice: यदि ... हमारे साथ हो, तो हम नीचे जाएँगे
  rationale: शर्त और उसके परिणाम को आधुनिक हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है, जबकि इब्रानी की दो-चरणीय संरचना बनी रहती है।
- source_word: לִרְאוֹת פְּנֵי הָאִישׁ
  choice: उस पुरुष का मुँह देख सकते
  rationale: इब्रानी के ठोस मुहावरे ‘पुरुष का मुँह देखना’ को रखा गया है; इसका आशय उसके सामने उपस्थित होना है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: הָאִישׁ
  choice: उस पुरुष
  rationale: मूल पाठ में सामान्य संज्ञा ‘पुरुष/मनुष्य’ है, कोई पदवी नहीं; ‘उस’ संदर्भित अधिकारी, अर्थात यूसुफ, की पहचान कराता है।
- source_word: וְאָחִינוּ הַקָּטֹן אֵינֶנּוּ אִתָּנוּ
  choice: यदि हमारा सबसे छोटा भाई हमारे साथ न हो
  rationale: इब्रानी में खंड ‘और’ से जुड़ा है, पर प्रसंग में यह उस परिस्थिति को बताता है जिसमें वे उस पुरुष के सामने नहीं जा सकते; हिन्दी में शर्त के रूप में कहना अर्थ को स्वाभाविक बनाता है।
theological_decisions:
- issue: अंतिम खंड का व्याकरणिक संबंध
  choice: 'उसे शर्त के रूप में प्रस्तुत किया गया: ‘यदि ... साथ न हो’'
  alternative: 'अधिक शाब्दिक: ‘और हमारा सबसे छोटा भाई हमारे साथ नहीं है’'
  rationale: संदर्भ में अनुपस्थिति ही उस पुरुष के सामने न जा सकने की शर्त है। फिर भी इब्रानी का समन्वयी रूप वास्तविक है, इसलिए वैकल्पिक शाब्दिक पाठ पादटिप्पणी में दिया गया है; इसमें कोई धर्मसैद्धांतिक निष्कर्ष आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नीचे जाना’ और ‘मुँह देखना’ मूल की ठोस छवियों को बनाए रखते हैं; दूसरे मुहावरे को पादटिप्पणी में समझाया गया है।
