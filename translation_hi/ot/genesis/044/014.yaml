source:
  edition: WLC
  text: וַ/יָּבֹ֨א יְהוּדָ֤ה וְ/אֶחָי/ו֙ בֵּ֣יתָ/ה יוֹסֵ֔ף וְ/ה֖וּא עוֹדֶ֣/נּוּ שָׁ֑ם וַ/יִּפְּל֥וּ לְ/פָנָ֖י/ו אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/014.yaml
  text: Then Judah and his brothers came into Joseph’s house[a]. He was still there[b], and they fell to the ground before him.
translation:
  language: hi
  text: तब यहूदा और उसके भाई यूसुफ के घर में आए। यूसुफ अब भी वहीं था, और वे उसके सामने भूमि पर गिर पड़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आए
  rationale: בוא का वय्यिक्तोल रूप कथा को साधारण भूतकाल में आगे बढ़ाता है। बहुवचन कर्ता ‘यहूदा और उसके भाई’ के अनुसार हिन्दी में ‘आए’ स्वाभाविक है।
- source_word: יְהוּדָה וְאֶחָיו
  choice: यहूदा और उसके भाई
  rationale: इससे अगुआ और प्रवक्ता के रूप में यहूदा का स्पष्ट उल्लेख तथा पारिवारिक संबंध, दोनों सुरक्षित रहते हैं।
- source_word: בֵּיתָה יוֹסֵף
  choice: यूसुफ के घर में
  rationale: בֵּיתָה का दिशासूचक प्रत्यय घर की ओर और प्रसंग में उसके भीतर जाने की गति बताता है; ‘घर में आए’ आधुनिक हिन्दी में स्वाभाविक रूप से इसे व्यक्त करता है।
- source_word: וְהוּא עוֹדֶנּוּ שָׁם
  choice: यूसुफ अब भी वहीं था
  rationale: עוֹדֶנּוּ निरंतरता, अर्थात ‘अब भी’, व्यक्त करता है। अस्पष्ट सर्वनाम को हिन्दी की स्पष्टता के लिए उसके संदर्भ ‘यूसुफ’ से प्रस्तुत किया गया है।
- source_word: וַיִּפְּלוּ
  choice: गिर पड़े
  rationale: मूल क्रिया का सामान्य अर्थ ‘गिरना’ है; ‘पड़े’ आकस्मिकता नहीं, बल्कि पूर्ण और जानबूझकर किए गए भूमि तक झुकने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: शाब्दिक ‘उसके मुख के आगे’ का स्वाभाविक हिन्दी समतुल्य ‘उसके सामने’ है।
- source_word: אָרְצָה
  choice: भूमि पर
  rationale: दिशासूचक रूप नीचे भूमि की ओर गति बताता है; ‘भूमि पर गिर पड़े’ उस शारीरिक मुद्रा को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
theological_decisions:
- issue: भूमि पर गिरने की क्रिया का अभिप्राय
  choice: गिर पड़े
  alternative: दण्डवत् किया / साष्टांग प्रणाम किया
  rationale: प्रसंग में यह आदर और विनय की मुद्रा है, पर मूल पाठ सामान्य क्रिया נפל (‘गिरना’) का प्रयोग करता है। अधिक धार्मिक या संस्कारगत शब्दावली जोड़ने के बजाय मूल की अभिव्यक्ति और संभावित अर्थ-व्याप्ति सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। ‘भूमि’ औपचारिक गरिमा बनाए रखता है, जबकि वाक्यरचना साधारण पाठक के लिए सहज है।
