  text: One left me, and I said, ‘Surely he has been torn to pieces,’ and I have not seen him until now.
translation:
  language: hi
  text: मेरा एक पुत्र मुझसे चला गया, और मैंने कहा, ‘निश्चय ही उसे फाड़ डाला गया है।’ तब से आज तक मैंने उसे नहीं देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הָאֶחָד מֵאִתִּי
  choice: एक मुझसे बिछुड़ गया
  rationale: शाब्दिक अर्थ ‘वह एक मेरे पास से निकल गया’ है; संदर्भ में पिता से पुत्र के खो जाने को स्वाभाविक हिंदी में ‘मुझसे बिछुड़ गया’ व्यक्त करता है, बिना मृत्यु को क्रिया में पहले से मान लिए।
- source_word: אַךְ טָרֹף טֹרָף
  choice: निश्चय ही उसे फाड़ डाला गया है
  rationale: אַךְ दृढ़ निश्चय व्यक्त करता है और धातु की पुनरुक्ति तीव्रता/निश्चितता देती है; कर्मवाच्य रूप यह खुला रखता है कि किसने या किस वस्तु ने फाड़ा।
- source_word: עַד הֵנָּה
  choice: तब से आज तक
  rationale: शाब्दिक ‘अब तक’ को हिंदी वाक्य-प्रवाह में पूर्व घटना से वर्तमान तक की अवधि के रूप में स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।
