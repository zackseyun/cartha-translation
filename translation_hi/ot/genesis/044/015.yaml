  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יוֹסֵ֔ף מָֽה הַ/מַּעֲשֶׂ֥ה הַ/זֶּ֖ה אֲשֶׁ֣ר עֲשִׂיתֶ֑ם הֲ/ל֣וֹא יְדַעְתֶּ֔ם כִּֽי נַחֵ֧שׁ יְנַחֵ֛שׁ אִ֖ישׁ אֲשֶׁ֥ר כָּמֹֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/015.yaml
  text: And Joseph said to them[a], “What is this deed that you have done? Did you not know that a man like me indeed practices divination?”
translation:
  language: hi
  text: तब यूसुफ़ ने उनसे कहा, “यह कैसा काम है जो तुमने किया है? क्या तुम नहीं जानते थे कि मुझ जैसा आदमी शकुन-विचार अवश्य करता है?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “शकुन-विचार करके अवश्य पता लगा लेता है” या “ऐसी बातें अवश्य जान लेता है” भी हो सकता है। इब्रानी में शकुन-विचार की क्रिया को बल देकर कहा गया है।
    reason: नַחֵשׁ יְנַחֵשׁ की बलवाचक रचना और संदर्भगत अर्थ-विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: מָה הַמַּעֲשֶׂה הַזֶּה
  choice: यह कैसा काम है
  rationale: शाब्दिक ‘यह क्या काम है’ की अपेक्षा यह हिन्दी में स्वाभाविक आरोपात्मक प्रश्न है और מַעֲשֶׂה के ‘काम/कृत्य’ अर्थ को बनाए रखता है।
- source_word: עֲשִׂיתֶם
  choice: तुमने किया है
  rationale: पूर्ण क्रिया उस किए हुए काम की वर्तमान प्रासंगिकता को व्यक्त करती है।
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: क्या तुम नहीं जानते थे
  rationale: नकारात्मक प्रश्न अपेक्षित सकारात्मक उत्तर और यूसुफ़ की फटकार—दोनों को सुरक्षित रखता है।
- source_word: נַחֵשׁ יְנַחֵשׁ
  choice: शकुन-विचार अवश्य करता है
  rationale: क्रिया के infinitive absolute और finite verb का संयोजन क्रिया पर बल देता है। ‘अवश्य करता है’ उस तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है; ‘शकुन-विचार’ यहाँ शकुन देखकर गुप्त बात जानने की क्रिया को दर्शाता है।
- source_word: אִישׁ אֲשֶׁר כָּמֹנִי
  choice: मुझ जैसा आदमी
  rationale: मूल के एकवचन पुल्लिंग और तुलना को सीधी, सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: יוֹסֵף
  choice: यूसुफ़
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नामरूप।
theological_decisions:
- issue: क्या यूसुफ़ के शकुन-विचार संबंधी कथन को सीधा दावा माना जाए या केवल भेद खोल लेने की क्षमता के रूप में नरम किया जाए
  choice: 'कथन को यूसुफ़ के सीधे दावे के रूप में रखना: ‘मुझ जैसा आदमी शकुन-विचार अवश्य करता है’'
  alternative: ‘मुझ जैसा आदमी ऐसी बात अवश्य पता लगा लेता है’ अथवा ‘शकुन-विचार से अवश्य पता लगा लेता है’
  rationale: इब्रानी में נחש धातु स्पष्ट रूप से शकुन-विचार/भविष्य-कथन का संकेत देती है और उसकी पुनरुक्त संरचना बलवाचक है। अनुवाद यह निर्णय नहीं करता कि यूसुफ़ वास्तव में ऐसा करता था या अपनी मिस्री भूमिका के अनुसार बोल रहा था।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने वाली हिन्दी। ‘शकुन-विचार’ को ‘जादू’ या केवल ‘पता लगाना’ कहने के बजाय चुना गया है, ताकि मूल की विशिष्ट divination/augury धारणा बनी रहे।
