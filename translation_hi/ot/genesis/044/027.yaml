    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम का क्रम बनाए रखता है।
- source_word: עַבְדְּךָ אָבִי
  choice: आपके दास, मेरे पिता
  rationale: यह पदबंध यूसुफ के प्रति यहूदा की विनम्रता और वक्ता के साथ पिता का संबंध—दोनों सुरक्षित रखता है।
- source_word: אֵלֵינוּ
  choice: हमसे
  rationale: हिन्दी में ‘किसी से कहना’ स्वाभाविक रूप से इब्रानी ‘हमको/हमारी ओर’ का अर्थ व्यक्त करता है।
- source_word: אַתֶּם יְדַעְתֶּם
  choice: तुम जानते हो
  rationale: स्पष्ट बहुवचन सर्वनाम से बल मिलता है; पूर्ण क्रिया यहाँ वर्तमान में प्रासंगिक ज्ञान व्यक्त करती है।
- source_word: כִּי
  choice: कि
  rationale: यह ज्ञात बात की विषय-वस्तु प्रस्तुत करता है।
- source_word: שְׁנַיִם
  choice: दो पुत्रों
  rationale: इब्रानी में केवल ‘दो’ है; प्रसंग से पुत्र अभिप्रेत हैं और स्वाभाविक हिन्दी में इसे स्पष्ट किया गया है।
- source_word: יָלְדָה לִּי
  choice: मेरे लिए ... को जन्म दिया
  rationale: यह मूल क्रिया और हित/संबंध सूचक לִּי को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִשְׁתִּי
  choice: मेरी पत्नी
  rationale: इस प्रसंग में אִשָּׁה का संबंधसूचक रूप स्पष्टतः ‘मेरी पत्नी’ है।
