language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר גַּם עַתָּ֥ה כְ/דִבְרֵי/כֶ֖ם כֶּן ה֑וּא אֲשֶׁ֨ר יִמָּצֵ֤א אִתּ/וֹ֙ יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֖ם תִּהְי֥וּ נְקִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/010.yaml
  text: And he said[a], “Even now, let it be according to your words. The one with whom it is found will be my servant[b], and you will be innocent.”
translation:
  language: hi
  text: उसने कहा, “अब भी तुम्हारी बात के अनुसार ही हो। जिसके पास वह पाया जाए, वह मेरा दास होगा, पर तुम निर्दोष ठहरोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: अब भी
  rationale: यह पदबंध वर्तमान परिस्थिति में तत्काल प्रतिक्रिया और बल को व्यक्त करता है; ‘अब भी’ उसके कालगत और बलात्मक दोनों पहलुओं को संक्षेप में रखता है।
- source_word: כְדִבְרֵיכֶם כֶּן הוּא
  choice: तुम्हारी बात के अनुसार ही हो
  rationale: यह भाइयों की कही बात का संदर्भ लेते हुए स्वीकृति का सूत्र प्रस्तुत करता है। ‘ही हो’ हिब्रू की संक्षिप्त विध्यर्थक छाया को स्वाभाविक हिन्दी में व्यक्त करता है। इसके बाद पूर्ण विराम रखा गया है, क्योंकि अथनाह एक प्रमुख विराम दर्शाता है और अगला वाक्य उनकी कठोर पेशकश का यथावत पुनरुल्लेख नहीं, बल्कि भंडारी का संशोधित निर्णय है।
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ
  choice: जिसके पास वह पाया जाए
  rationale: यह प्याले को अपने पास रखने वाले व्यक्ति की पहचान करता है और हिब्रू की अप्रत्यक्ष रचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יִהְיֶה לִּי עָבֶד
  choice: वह मेरा दास होगा
  rationale: עֶבֶד यहाँ दंडस्वरूप बंधी हुई और अधीन स्थिति बताता है, केवल घरेलू या वेतनभोगी सेवा नहीं; इसलिए ‘दास’ उपयुक्त है। ‘होगा’ हिब्रू יִהְיֶה के निकट है।
- source_word: וְאַתֶּם תִּהְיוּ נְקִיִּם
  choice: पर तुम निर्दोष ठहरोगे
  rationale: נְקִיִּם दोष और दायित्व से मुक्त होने को दर्शाता है। प्रसंग में विरोध स्पष्ट करने के लिए וְ को स्वाभाविक हिन्दी ‘पर’ से व्यक्त किया गया है।
theological_decisions:
- issue: भाइयों के प्रस्ताव और भंडारी के निर्णय का संबंध
  choice: पहले कथन के बाद पूर्ण विराम देकर अगले वाक्य को संशोधित दंडादेश के रूप में प्रस्तुत किया गया
  alternative: दोनों खंडों को द्विबिंदु से जोड़कर अगले कथन को ‘तुम्हारी बात’ का सीधा विवरण मानना
  rationale: पद 9 में भाइयों ने दोषी के लिए मृत्यु और शेष लोगों के लिए दासता प्रस्तावित की थी, जबकि यहाँ केवल दोषी को दास बनाने और दूसरों को निर्दोष मानने की बात है। हिब्रू में הוּא पर अथनाह भी प्रमुख विराम का समर्थन करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘दास’ दंडात्मक बंधन को ‘सेवक’ से अधिक स्पष्ट करता है। कोई पादटिप्पणी आवश्यक नहीं समझी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
