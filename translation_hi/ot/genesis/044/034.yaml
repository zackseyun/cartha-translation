source:
  edition: WLC
  text: כִּי אֵיךְ֙ אֶֽעֱלֶ֣ה אֶל אָבִ֔/י וְ/הַ/נַּ֖עַר אֵינֶ֣/נּוּ אִתִּ֑/י פֶּ֚ן אֶרְאֶ֣ה בָ/רָ֔ע אֲשֶׁ֥ר יִמְצָ֖א אֶת אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/034.yaml
  text: For how can I go up to my father if the boy is not with me? Otherwise, I would have to see the disaster that would come upon my father.
translation:
  language: hi
  text: क्योंकि यदि वह लड़का मेरे साथ न हो, तो मैं अपने पिता के पास कैसे लौट सकता हूँ? कहीं ऐसा न हो कि मुझे वह विपत्ति देखनी पड़े जो मेरे पिता पर आ पड़ेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: लौट सकता हूँ
  rationale: मूल अर्थ ‘ऊपर जाना’ है, पर इस प्रसंग में यह कनान में पिता के पास वापस जाने को व्यक्त करता है; स्वाभाविक हिन्दी में ‘लौटना’ आशय स्पष्ट करता है।
- source_word: הַנַּעַר
  choice: वह लड़का
  rationale: נַעַר आयु और आश्रित स्थिति के अनुसार ‘लड़का/युवक’ हो सकता है; यहाँ यह बिन्यामीन के लिए प्रयुक्त प्रसंगगत संबोधन है।
- source_word: בָרָע
  choice: वह विपत्ति
  rationale: רָע का अर्थ ‘बुराई, अनिष्ट, विपत्ति’ हो सकता है; पिता पर आने वाले दुःखद परिणाम के संदर्भ में ‘विपत्ति’ उपयुक्त है।
- source_word: יִמְצָא אֶת־אָבִי
  choice: मेरे पिता पर आ पड़ेगी
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘मेरे पिता को पा लेगी’ है; हिन्दी में विपत्ति के घटित होने के लिए ‘पर आ पड़ना’ स्वाभाविक समतुल्य है।
theological_decisions:
- issue: פֶּן के साथ आशंकित परिणाम
  choice: कहीं ऐसा न हो कि मुझे ... देखनी पड़े
  alternative: अन्यथा मुझे ... देखना पड़ेगा
  rationale: פֶּן सामान्यतः भय या आशंका से युक्त ‘कहीं ऐसा न हो’ व्यक्त करता है। यह यहूदा की अपने पिता पर आने वाली विपत्ति देखने की असहनीय आशंका को बनाए रखता है, बिना परिणाम को अनिवार्य बनाकर मूल तनाव मिटाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। यहूदा की भावनात्मक विनती को प्रश्न और आशंकासूचक वाक्य में सुरक्षित रखा गया है।
