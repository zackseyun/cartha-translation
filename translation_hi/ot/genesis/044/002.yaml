  text: וְ/אֶת גְּבִיעִ֞/י גְּבִ֣יעַ הַ/כֶּ֗סֶף תָּשִׂים֙ בְּ/פִי֙ אַמְתַּ֣חַת הַ/קָּטֹ֔ן וְ/אֵ֖ת כֶּ֣סֶף שִׁבְר֑/וֹ וַ/יַּ֕עַשׂ כִּ/דְבַ֥ר יוֹסֵ֖ף אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/002.yaml
  text: And put my cup[a], the silver cup, in the mouth of the youngest one's sack, along with the silver for his grain purchase." And he did according to Joseph's word[b], which he had spoken.
translation:
  language: hi
  text: और मेरा प्याला[a], चाँदी का प्याला, सबसे छोटे की बोरी के मुँह में रख देना, और उसके अनाज के लिए दी गई चाँदी भी।” उसने यूसुफ की कही हुई बात के अनुसार ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘बोरी का मुँह’ बोरी के खुले भाग को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: גְּבִיעִי גְּבִיעַ הַכֶּסֶף
  choice: मेरा प्याला, चाँदी का प्याला
  rationale: גְּבִיעַ पीने के प्याले या कटोरे को दर्शाता है। हिंदी में ‘प्याला’ स्वाभाविक है, और इब्रानी की समानाधिकरणात्मक पुनरुक्ति को बनाए रखा गया है।
- source_word: תָּשִׂים
  choice: रख देना
  rationale: שׂים का सामान्य अर्थ ‘रखना’ है; आज्ञार्थक प्रसंग में ‘रख देना’ स्वाभाविक और सीधा है।
- source_word: בְּפִי אַמְתַּחַת
  choice: बोरी के मुँह में
  rationale: शाब्दिक ‘बोरी के मुँह में’ बोरी के खुले भाग के लिए समझ में आने वाला हिंदी मुहावरा है और इब्रानी बिंब को सुरक्षित रखता है।
- source_word: הַקָּטֹן
  choice: सबसे छोटे की
  rationale: शाब्दिक अर्थ ‘छोटे/कम उम्र वाले’ का है; प्रसंग में भाइयों में सबसे छोटा व्यक्ति अभिप्रेत है। संज्ञा जोड़े बिना हिंदी में इसे स्वाभाविक रखा गया है।
- source_word: כֶּסֶף שִׁבְרוֹ
  choice: उसके अनाज का पैसा
  rationale: כֶּסֶף का अर्थ चाँदी और विनिमय में पैसा दोनों हो सकता है; שִׁבְרוֹ यहाँ खरीदे गए अनाज को दर्शाता है। ‘अनाज का पैसा’ लेन-देन का आशय संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיַּעַשׂ כִּדְבַר יוֹסֵף אֲשֶׁר דִּבֵּר
  choice: उसने वैसा ही किया जैसा यूसुफ ने कहा था
  rationale: यह हिंदी में स्वाभाविक ढंग से ‘यूसुफ के वचन के अनुसार’ और अनुवर्ती संबंधवाचक उपवाक्य—दोनों का आशय व्यक्त करता है, बिना इसे अधिक व्याख्यात्मक ‘आज्ञा’ बनाने के।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘प्याला’ तथा ‘बोरी के मुँह’ जैसे ठोस शब्द मूल इब्रानी की छवि बनाए रखते हैं, जबकि अंतिम वाक्य को स्वाभाविक हिंदी वाक्य-विन्यास में दिया गया है।
