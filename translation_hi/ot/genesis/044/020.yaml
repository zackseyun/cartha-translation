  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י יֶשׁ לָ֨/נוּ֙ אָ֣ב זָקֵ֔ן וְ/יֶ֥לֶד זְקֻנִ֖ים קָטָ֑ן וְ/אָחִ֨י/ו מֵ֜ת וַ/יִּוָּתֵ֨ר ה֧וּא לְ/בַדּ֛/וֹ לְ/אִמּ֖/וֹ וְ/אָבִ֥י/ו אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/020.yaml
  text: And we said to my lord[a], ‘We have an elderly father, and a young son born in his old age. His brother is dead, so he alone is left of his mother[c][b], and his father loves him.’
translation:
  language: hi
  text: और हमने अपने प्रभु से कहा, ‘हमारा एक वृद्ध पिता है, और उसका एक कम उम्र का बेटा है, जो उसकी वृद्धावस्था में जन्मा था। उसका भाई मर चुका है; इसलिए अपनी माँ के बेटों में केवल वही बचा है, और उसका पिता उससे प्रेम करता है।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: अपने प्रभु
  rationale: यहाँ अधीन व्यक्ति द्वारा उच्च अधिकारी को किया गया आदरपूर्ण संबोधन है; ‘प्रभु’ सामाजिक पदानुक्रम और कथा में बार-बार आने वाली संबोधन-शैली को बनाए रखता है।
- source_word: זָקֵן
  choice: बूढ़ा
  rationale: यह पिता की अधिक आयु बताता है। आधुनिक सामान्य हिन्दी में ‘बूढ़ा पिता’ सीधा और स्वाभाविक है।
- source_word: יֶלֶד זְקֻנִים קָטָן
  choice: उसकी वृद्धावस्था में जन्मा एक छोटा बेटा
  rationale: ‘वृद्धावस्था की संतान’ वाले इब्रानी मुहावरे का आशय पिता की अधिक आयु में जन्मा पुत्र है; ‘छोटा’ קָטָן को भी व्यक्त करता है, जो यहाँ कम आयु या परिवार में छोटे होने का संकेत देता है।
- source_word: וְאָחִיו מֵת
  choice: उसका भाई मर चुका है
  rationale: यह वर्तमान स्थिति को परिणाम सहित व्यक्त करता है और हिन्दी में स्वाभाविक ढंग से बताता है कि भाई अब जीवित नहीं है।
- source_word: וַיִּוָּתֵר הוּא לְבַדּוֹ לְאִמּוֹ
  choice: अपनी माँ के बेटों में केवल वही बचा है
  rationale: शाब्दिक ‘अपनी माँ के लिए/संबंध में अकेला बचा’ का आशय यह है कि वह अपनी माँ का एकमात्र जीवित बचा पुत्र है; यह रूप हिन्दी में उस संबंध को स्पष्ट रखता है।
- source_word: וְאָבִיו אֲהֵבוֹ
  choice: उसका पिता उससे प्रेम करता है
  rationale: אהב का सीधा अर्थ ‘प्रेम करना’ है; वर्तमान काल पिता के विशेष स्नेह को स्पष्ट करता है।
