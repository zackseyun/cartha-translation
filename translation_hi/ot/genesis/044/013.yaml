lexical_decisions:
- source_word: וַיִּקְרְעוּ
  choice: उन्होंने ... फाड़े
  rationale: קרע यहाँ शोक, सदमे या गहरे संकट को प्रकट करने के लिए कपड़े फाड़ने की ठोस क्रिया बताता है; हिंदी में ‘फाड़े’ स्वाभाविक और सटीक है।
- source_word: שִׂמְלֹתָם
  choice: अपने कपड़े
  rationale: שִׂמְלָה सामान्यतः वस्त्र या बाहरी पहनावे को दर्शाता है। आधुनिक हिंदी में ‘कपड़े’ सहज है और अर्थ की व्यापकता बनाए रखता है।
- source_word: וַיַּעֲמֹס אִישׁ עַל חֲמֹרוֹ
  choice: हर एक ने अपने गधे पर सामान लादा
  rationale: עמס का अर्थ बोझ या सामान लादना है, और אִישׁ यहाँ वितरणात्मक है। ‘सामान’ संदर्भ से निहित कर्म को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: אִישׁ
  choice: हर एक
  rationale: एकवचन אִישׁ बहुवचन समूह के प्रत्येक पुरुष के लिए वितरणात्मक रूप से प्रयुक्त है; ‘हर एक’ हिंदी में इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חֲמֹרוֹ
  choice: अपने गधे पर
  rationale: חֲמוֹר का सामान्य अर्थ ‘गधा’ है; संबंधवाचक रूप को हिंदी की कर्ता-सापेक्ष अभिव्यक्ति ‘अपने’ से प्रस्तुत किया गया है।
- source_word: וַיָּשֻׁבוּ
  choice: वे ... लौट गए
  rationale: שׁוּב का अर्थ लौटना है। ‘लौट गए’ कथात्मक हिंदी में स्वाभाविक है और वापसी की पूर्ण क्रिया व्यक्त करता है।
- source_word: הָעִירָה
  choice: नगर
  rationale: दिशासूचक ה motion toward the city बताता है; हिंदी में ‘नगर लौट गए’ बिना अलग परसर्ग के वही दिशा स्वाभाविक रूप से व्यक्त करता है।
