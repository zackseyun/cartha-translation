source:
  edition: WLC
  text: הֵ֣ן כֶּ֗סֶף אֲשֶׁ֤ר מָצָ֨אנוּ֙ בְּ/פִ֣י אַמְתְּחֹתֵ֔י/נוּ הֱשִׁיבֹ֥נוּ אֵלֶ֖י/ךָ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/אֵ֗יךְ נִגְנֹב֙ מִ/בֵּ֣ית אֲדֹנֶ֔י/ךָ כֶּ֖סֶף א֥וֹ זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/008.yaml
  text: Look[a], the silver that we found in the mouths of our sacks we brought back to you from the land of Canaan. So how could we steal silver or gold from your master's house?
translation:
  language: hi
  text: देखिए[a], जो चाँदी हमें अपनी बोरियों के खुले मुँह में मिली थी, उसे हम कनान देश से आपके पास वापस ले आए। फिर हम आपके स्वामी के घर से चाँदी या सोना कैसे चुरा सकते हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘बोरियों के खुले मुँह में’: इब्रानी में ‘बोरियों के मुँह में’ है; ‘मुँह’ से बोरी का खुला ऊपरी भाग अभिप्रेत है।'
    reason: cultural_note
lexical_decisions:
- source_word: הֵן
  choice: देखिए
  rationale: यह अव्यय श्रोताओं का ध्यान उनके तर्क की ओर खींचता है; ‘देखिए’ आधुनिक, स्वाभाविक और आदरयुक्त हिन्दी है।
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: मूल अर्थ ‘चाँदी’ है। प्रसंग में यह मुद्रा भी है, पर आगे ‘सोना’ के साथ जोड़ी और पहले उल्लेख की पुनरावृत्ति बनाए रखने के लिए ठोस शब्द रखा गया है।
- source_word: בְּפִי אַמְתְּחֹתֵינוּ
  choice: अपनी बोरियों के मुँह पर
  rationale: इब्रानी में पात्र के खुले ऊपरी भाग को उसका ‘मुँह’ कहा गया है। ‘बोरियों के मुँह पर’ हिन्दी में यह चित्र स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֱשִׁיבֹנוּ אֵלֶיךָ
  choice: आपके पास वापस ले आए
  rationale: हिफ़ील रूप किसी वस्तु को लौटाने का भाव देता है; यह हिन्दी वाक्यांश उस सक्रिय अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: מֵאֶרֶץ כְּנָעַן
  choice: कनान देश से
  rationale: भौगोलिक पद का सहज और मानक हिन्दी रूप।
- source_word: וְאֵיךְ נִגְנֹב
  choice: फिर ... कैसे चुरा सकते हैं
  rationale: यह पिछले तथ्य पर आधारित असंभाव्यता का आलंकारिक प्रश्न है; ‘फिर’ निष्कर्षात्मक संबंध और ‘कैसे ... सकते हैं’ प्रसंगगत भाव को व्यक्त करता है।
- source_word: מִבֵּית אֲדֹנֶיךָ
  choice: आपके स्वामी के घर से
  rationale: यहाँ אֲדֹנֶיךָ मनुष्य, अर्थात अधिकारी के स्वामी, के लिए है। ‘स्वामी’ सामाजिक संबोधन को गरिमापूर्वक रखता है और ‘घर’ मूल रूपक को बनाए रखता है।
- source_word: כֶּסֶף אוֹ זָהָב
  choice: चाँदी या सोना
  rationale: मूल की ठोस धातु-जोड़ी को और आरंभिक ‘चाँदी’ के साथ पुनरावृत्ति को सुरक्षित रखा गया है।
