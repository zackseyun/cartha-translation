  text: כִּ֤י עַבְדְּ/ךָ֙ עָרַ֣ב אֶת הַ/נַּ֔עַר מֵ/עִ֥ם אָבִ֖/י לֵ/אמֹ֑ר אִם לֹ֤א אֲבִיאֶ֨/נּוּ֙ אֵלֶ֔י/ךָ וְ/חָטָ֥אתִי לְ/אָבִ֖/י כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/032.yaml
  text: For your servant became surety for the boy to my father[a], saying, ‘If I do not bring him to you[b], then I will bear the blame before my father all my days.’
translation:
  language: hi
  text: क्योंकि आपके दास ने मेरे पिता से इस लड़के की ज़िम्मेदारी लेने का वचन दिया था[a] और कहा था, ‘यदि मैं इसे आपके पास न लाऊँ, तो जीवन भर अपने पिता के सामने दोषी ठहरूँगा।’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे पिता के पास इस लड़के का जामिन बना था” अथवा “मेरे पिता से इस लड़के के लिए ज़मानत दी थी।” इब्रानी क्रिया जामिन बनकर उत्तरदायित्व लेने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मैं जीवन भर अपने पिता के प्रति/विरुद्ध पाप करूँगा।” यहाँ भाव है कि वह अपने पिता के सामने सदा दोषी और उत्तरदायी रहेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह यहूदा की विनती का कारण प्रस्तुत करता है और पूर्ववर्ती कथन से स्वाभाविक रूप से जुड़ता है।
- source_word: עַבְדְּךָ
  choice: आपके दास
  rationale: श्रेष्ठ अधिकारी के सामने विनम्र आत्म-संबोधन है; प्रसंग में यह दरबारी आदर का भाव रखता है।
- source_word: עָרַב אֶת הַנַּעַר
  choice: इस लड़के की ज़िम्मेदारी ली थी
  rationale: क्रिया किसी के लिए जामिन बनकर उत्तरदायित्व लेने का भाव देती है; यह हिंदी में स्वाभाविक और अर्थ-सटीक है।
- source_word: הַנַּעַר
  choice: इस लड़के
  rationale: यह बिन्यामीन को संदर्भित करता है; निकट प्रसंग के कारण ‘इस’ और पारिवारिक संबोधन के लिए ‘लड़के’ उपयुक्त हैं।
- source_word: מֵעִם אָבִי
  choice: अपने पिता के सामने
  rationale: यह उस व्यक्ति को सूचित करता है जिसके प्रति यहूदा ने ज़िम्मेदारी स्वीकार की; ‘के सामने’ व्यक्तिगत जवाबदेही को व्यक्त करता है।
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: यदि मैं इसे आपके पास वापस न लाऊँ
  rationale: शर्त को स्पष्ट रखता है; कथानक में बिन्यामीन को लौटाने की बात होने से ‘वापस’ निहित दिशा को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: וְחָטָאתִי לְאָבִי
  choice: अपने पिता के सामने दोषी ठहरूँगा
  rationale: शाब्दिक ‘पाप करूँगा/पापी होऊँगा’ यहाँ स्थायी अपराध-दोष और जवाबदेही का भाव रखता है; अनुवाद उस अर्थ को बिना धार्मिक तनाव मिटाए व्यक्त करता है।
- source_word: כָּל הַיָּמִים
  choice: जीवन भर
  rationale: यह आजीवन अवधि का स्वाभाविक आधुनिक हिंदी रूप है।
theological_decisions:
- issue: וְחָטָאתִי में ‘पाप’ और ‘दोष’ का संबंध
  choice: दोषी ठहरूँगा
  alternative: पिता के विरुद्ध पापी ठहरूँगा
  rationale: प्रतिज्ञा के इस प्रसंग में शब्द उत्तरदायित्व भंग करने से उत्पन्न स्थायी दोष को दर्शाता है। मुख्य पाठ में स्वाभाविक हिंदी दी गई है और शाब्दिक धार्मिक भाषा पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और कथात्मक हिंदी। यहूदा के दरबारी विनम्र संबोधन के लिए ‘आपके दास’ रखा गया है। कानूनी-प्रतिज्ञात्मक भाव को सामान्य पाठक के लिए ‘ज़िम्मेदारी ली’ से व्यक्त किया गया है, जबकि ‘जामिन’ पादटिप्पणी में दिया गया है।
