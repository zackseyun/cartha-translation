source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֧ם גַּם אֶת זֶ֛ה מֵ/עִ֥ם פָּנַ֖/י וְ/קָרָ֣/הוּ אָס֑וֹן וְ/הֽוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/רָעָ֖ה שְׁאֹֽלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/029.yaml
  text: If you also take this one from me[a], and harm happens to him, then you will bring my gray hair down to Sheol in misery.
translation:
  language: hi
  text: यदि तुम इसे भी मुझसे दूर ले जाओ और उसे कोई विपत्ति आ पड़े, तो तुम मेरे पके बालों को दुःख के साथ शिओल में उतार दोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְקַחְתֶּם גַּם אֶת־זֶה
  choice: यदि तुम इसे भी … ले जाओ
  rationale: वाव सहित पूर्ण क्रिया यहाँ पूर्ववर्ती शर्त की अगली कड़ी है; ‘यदि’ हिन्दी में उस शर्त को स्वाभाविक रूप से स्पष्ट करता है और גַּם का अर्थ ‘भी’ बनाए रखता है।
- source_word: מֵעִם פָּנַי
  choice: मुझसे दूर
  rationale: शाब्दिक भाव ‘मेरी उपस्थिति के पास से’ है। ‘मुझसे दूर’ अलग किए जाने का आशय सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְקָרָהוּ אָסוֹן
  choice: इस पर कोई विपत्ति आ पड़े
  rationale: קרה का अर्थ घटित होना या आ पड़ना और אָסוֹן का अर्थ गंभीर अनिष्ट या विपत्ति है; यह संयोजन हिन्दी में स्वाभाविक और मूल के अनुरूप है।
- source_word: וְהוֹרַדְתֶּם
  choice: तुम … उतार दोगे
  rationale: हिफ़ील रूप का कारक अर्थ सुरक्षित है और नीचे शिओल में जाने की मूल रूपक-छवि बनी रहती है।
- source_word: שֵׂיבָתִי
  choice: मेरे पके बालों को
  rationale: मूल में ‘सफेद/पके बाल’ वृद्धावस्था के लिए लक्षणा है। इसे केवल ‘बुढ़ापा’ कहने के बजाय मूल दृश्य-छवि रखी गई है।
- source_word: בְּרָעָה
  choice: दुःख के साथ
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, बल्कि दुःख, विपदा या क्लेश की अवस्था बताता है।
- source_word: שְׁאֹלָה
  choice: शिओल में
  rationale: दिशासूचक ה के कारण ‘में’ प्रयुक्त है। ‘शिओल’ मूल इब्रानी धारणा को केवल कब्र तक सीमित किए बिना सुरक्षित रखता है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: शिओल
  alternative: कब्र; मृतकों का लोक
  rationale: लिप्यंतरण पुराने नियम की अवधारणात्मक व्यापकता और अस्पष्टता को बनाए रखता है; व्याख्यात्मक विकल्प पादटिप्पणी में दिए गए हैं ताकि बाद की सिद्धान्तगत सूक्ष्मता मूल पाठ पर न थोपी जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पके बाल’ मूल की ठोस छवि को सुरक्षित रखता है, जबकि ‘विपत्ति आ पड़े’ और ‘मुझसे दूर’ स्वाभाविक हिन्दी मुहावरे हैं।
