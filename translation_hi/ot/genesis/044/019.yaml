  yaml_path: translation/ot/genesis/044/019.yaml
  text: My lord asked his servants, saying, ‘Do you have a father or a brother?’
translation:
  language: hi
  text: “मेरे प्रभु ने अपने सेवकों से पूछा था, ‘क्या तुम्हारे पिता या कोई भाई है?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: मेरे प्रभु
  rationale: यह मिस्र के शासक के लिए आदरपूर्ण संबोधन है। ‘मेरे प्रभु’ दरबारी विनम्रता और एकवचन संबोधन, दोनों को बनाए रखता है।
- source_word: שָׁאַל
  choice: पूछा था
  rationale: क्रिया का सामान्य अर्थ ‘पूछना’ है। भूतपूर्व प्रसंग में हिन्दी का ‘पूछा था’ यहूदा द्वारा पहले हुई बातचीत का उल्लेख स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲבָדָיו
  choice: अपने सेवकों से
  rationale: भाई शासक के सामने विनम्रता से स्वयं को उसके ‘सेवक’ कहते हैं; यहाँ ‘दास’ कहने से अनावश्यक रूप से स्वामित्व या बंधुआ स्थिति का अर्थ उभर सकता है। प्रत्यय का संबंध संबोधित प्रभु से है, इसलिए ‘अपने’ स्वाभाविक है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष प्रश्न द्वारा व्यक्त
  rationale: यह रूप आगे आने वाली वाणी का परिचय देता है। हिन्दी में ‘यह कहते हुए’ जोड़ना संभव है, पर सीधे ‘पूछा था’ के बाद उद्धृत प्रश्न देना अधिक स्वाभाविक है और अर्थ सुरक्षित रखता है।
- source_word: הֲיֵשׁ לָכֶם
  choice: क्या तुम्हारे ... है
  rationale: प्रश्नवाचक रूप और יֵשׁ + ל का भाव किसी व्यक्ति के होने/उपस्थित होने का है। परिवार-संबंध के संदर्भ में हिन्दी की यह रचना स्वाभाविक है।
- source_word: אָב
  choice: पिता
  rationale: हिन्दी में संबंधवाचक संज्ञा के साथ अनिश्चिततावाचक ‘एक’ आवश्यक नहीं है; ‘तुम्हारे पिता’ प्रश्न का आशय स्पष्ट करता है।
- source_word: אָח
  choice: कोई भाई
  rationale: एकवचन को बनाए रखते हुए ‘कोई’ भाई के अस्तित्व के बारे में पूछे जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; यहूदा की विनम्र दरबारी भाषा को ‘मेरे प्रभु’ और ‘सेवकों’ से बनाए रखा गया है। मूल के ‘कहते हुए’ को अलग शब्दशः न दोहराकर उद्धृत प्रश्न में समाहित किया गया है।
