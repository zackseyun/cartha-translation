source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה מַה נֹּאמַר֙ לַֽ/אדֹנִ֔/י מַה נְּדַבֵּ֖ר וּ/מַה נִּצְטַדָּ֑ק הָ/אֱלֹהִ֗ים מָצָא֙ אֶת עֲוֺ֣ן עֲבָדֶ֔י/ךָ הִנֶּ/נּ֤וּ עֲבָדִים֙ לַֽ/אדֹנִ֔/י גַּם אֲנַ֕חְנוּ גַּ֛ם אֲשֶׁר נִמְצָ֥א הַ/גָּבִ֖יעַ בְּ/יָדֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/016.yaml
  text: And Judah said[a], “What shall we say to my lord? What shall we speak? Or how shall we justify ourselves? God has found out the guilt of your servants. Here we are, my lord’s servants[c][b], both we and the one in whose hand the cup was found.”
translation:
  language: hi
  text: तब यहूदा ने कहा, “हम अपने स्वामी से क्या कहें? क्या बोलें? और अपने आपको कैसे सही ठहराएँ?[a] परमेश्वर ने आपके सेवकों का दोष उजागर कर दिया है।[b] देखिए, हम अपने स्वामी के दास हैं[c]—हम भी और वह भी, जिसके हाथ में वह प्याला मिला है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम अपने आपको निर्दोष कैसे सिद्ध करें?” इब्रानी क्रिया का अर्थ अपने आपको सही अथवा निर्दोष ठहराना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “परमेश्वर ने आपके सेवकों का दोष ढूँढ़ निकाला है।” इसका भाव छिपे दोष को उजागर करना भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: पहले “सेवक” अधिकारी के सामने आदर और विनम्रता से अपने लिए कहा गया है; यहाँ “दास” भाइयों द्वारा स्वीकार की गई बंधुआ अधीनता को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנִי
  choice: अपने प्रभु से / अपने प्रभु के
  rationale: यह यूसुफ के अधिकार के प्रति आदरसूचक संबोधन है, परमेश्वर के लिए उपाधि नहीं। ‘प्रभु’ संवाद की गरिमा और अधीनता दोनों बनाए रखता है।
- source_word: מַה נֹּאמַר / מַה נְּדַבֵּר
  choice: क्या कहें? क्या बोलें?
  rationale: दोनों निकटार्थी क्रियाओं को अलग रखकर इब्रानी की असहायता भरी आलंकारिक पुनरुक्ति सुरक्षित की गई है।
- source_word: וּמַה נִּצְטַדָּק
  choice: और अपने आपको निर्दोष कैसे ठहराएँ?
  rationale: हित्पएल रूप का आशय अपने पक्ष को सही या निर्दोष सिद्ध करना है। यह स्वाभाविक हिन्दी में न्यायिक भाव बनाए रखता है।
- source_word: מָצָא אֶת עֲוֺן
  choice: अपराध प्रकट कर दिया है
  rationale: यहाँ ‘पाना’ का आशय छिपे दोष को सामने लाना है; शाब्दिक ‘अपराध पा लिया’ हिन्दी में अस्वाभाविक होता।
- source_word: עֲוֺן
  choice: अपराध
  rationale: शब्द अपराध, दोष या दंडयोग्यता का बोध करा सकता है। प्रसंग में भाइयों का नैतिक अपराध सामने आने का भाव प्रमुख है।
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: आपके सेवकों / दास
  rationale: पहला प्रयोग अधिकारी के सामने विनम्र आत्म-संबोधन है; दूसरा वास्तविक बंधुआ अधीनता स्वीकार करने का प्रस्ताव है। हिन्दी में यह भेद ‘सेवक’ और ‘दास’ से स्पष्ट होता है।
- source_word: הִנֶּנּוּ
  choice: देखिए, अब हम
  rationale: प्रस्तुतिकरण और आत्मसमर्पण का भाव आधुनिक स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: גַּם אֲנַחְנוּ גַּם אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: हम भी और वह भी, जिसके हाथ में वह प्याला मिला है
  rationale: दोनों גַּם का समावेशी बल और ‘हाथ में’ की मूल कानूनी/खोज-संबंधी भाषा सुरक्षित रखी गई है।
- source_word: הַגָּבִיעַ
  choice: वह प्याला
  rationale: ‘प्याला’ आधुनिक हिन्दी में स्वाभाविक है; निश्चित पद का संकेत ‘वह’ से मिलता है।
theological_decisions:
- issue: यहूदा के कथन में הָאֱלֹהִים का संदर्भ
  choice: परमेश्वर ने भाइयों का छिपा अपराध प्रकट किया है
  alternative: किसी सामान्य दैवी शक्ति ने उनका अपराध प्रकट किया
  rationale: उत्पत्ति के कथानक में यहूदा एक परमेश्वर को उनके छिपे दोष के उद्घाटन का कर्ता मानता है; अतः अनिश्चित या बहुवचन अर्थ प्रसंगानुकूल नहीं।
- issue: עֲוֺן किस अपराध की ओर संकेत करता है
  choice: कथन को व्यापक ‘अपराध’ के रूप में खुला रखा गया
  alternative: इसे केवल प्याला चुराने या केवल यूसुफ के विरुद्ध पुराने पाप के रूप में स्पष्ट करना
  rationale: इब्रानी पाठ अपराध की पहचान स्पष्ट नहीं करता। कथानक पुराने दोष की ओर संकेत कर सकता है, जबकि तत्काल आरोप प्याले का है; अनुवाद इस तनाव को नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रजिस्टर अपनाया गया है। यूसुफ को संबोधित करते समय आदरसूचक ‘आप’ और ‘प्रभु’ रखा गया है। ‘सेवक’ तथा ‘दास’ का प्रसंगगत भेद मूल पाठ की सामाजिक और कानूनी बारीकी सुरक्षित करता है।
