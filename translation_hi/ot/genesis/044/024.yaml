  text: And when we went up to your servant my father[a], we told him the words of my lord.
translation:
  language: hi
  text: जब हम तेरे सेवक, मेरे पिता[a] के पास ऊपर गए, तब हमने उन्हें मेरे स्वामी की बातें बताईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, ‘मेरे पिता, तेरे सेवक।’ इब्रानी में शब्दक्रम है: ‘तेरे सेवक, मेरे पिता।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: जब ... तब
  rationale: इब्रानी कथात्मक सूत्र यहाँ अगली घटना का समय और क्रम बताता है। हिन्दी में ‘जब ... तब’ स्वाभाविक रूप से यही संबंध व्यक्त करता है।
- source_word: עָלִינוּ
  choice: ऊपर गए
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है; मिस्र से कनान की ओर यात्रा के भौगोलिक दृष्टिकोण को यह अभिव्यक्ति बनाए रखती है।
- source_word: עַבְדְּךָ אָבִי
  choice: तेरे सेवक, अपने पिता
  rationale: यहूदा यूसुफ के सामने आदरपूर्वक याकूब को ‘तेरा सेवक’ कहता है। अनुवाद इब्रानी पदक्रम को निकटता से रखता है और अल्पविराम संबंध स्पष्ट करता है।
- source_word: וַנַּגֶּד לוֹ
  choice: हमने उन्हें ... बताईं
  rationale: हिफ़िल रूप का अर्थ ‘बताना/जताना’ है। हिन्दी में सजीव आदरसूचक कर्म के लिए ‘उन्हें’ और ‘बताईं’ स्वाभाविक हैं।
- source_word: אֵת דִּבְרֵי אֲדֹנִי
  choice: अपने स्वामी की बातें
  rationale: דִּבְרֵי को ‘बातें’ कहना आधुनिक हिन्दी में स्वाभाविक रहते हुए स्रोत के ‘वचनों/शब्दों’ के भाव को रखता है। אֲדֹנִי यहाँ मनुष्य के लिए आदरसूचक संबोधन है, इसलिए ‘अपने स्वामी’ चुना गया है।
