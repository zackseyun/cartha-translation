  yaml_path: translation/ot/genesis/044/011.yaml
  text: So each man hurried and lowered his sack to the ground[b][a], and each man opened his sack.
translation:
  language: hi
  text: तब उन्होंने जल्दी की, और हर एक ने अपनी बोरी ज़मीन पर उतारकर खोल दी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘हर एक’ बोरी उतारने और खोलने, दोनों कामों के साथ दोहराया गया है; इससे बल मिलता है कि प्रत्येक भाई ने अपनी ही बोरी उतारी और खोली।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: उन्होंने फुर्ती की
  rationale: מהר शीघ्र और तत्पर होकर काम करने को दर्शाता है। यह प्रयोग बहुवचन क्रिया को बनाए रखता है और आधुनिक, गरिमापूर्ण हिन्दी में स्वाभाविक है।
- source_word: וַיּוֹרִדוּ
  choice: उतारी
  rationale: ירד के हिफ़ील रूप का अर्थ यहाँ ‘नीचे उतारना’ है; सम्भवतः बोरियाँ पशुओं पर से भूमि पर उतारी गईं।
- source_word: אִישׁ ... אַמְתַּחְתּוֹ
  choice: हर एक ने अपनी बोरी ... अपनी-अपनी बोरी
  rationale: אִישׁ का वितरणात्मक अर्थ प्रत्येक व्यक्ति की अलग-अलग क्रिया पर बल देता है। दूसरी बार ‘अपनी-अपनी’ इस दोहराव और व्यक्तिगत संबंध को सहज हिन्दी में स्पष्ट करता है।
- source_word: אַמְתַּחַת
  choice: बोरी
  rationale: यह अनाज या सामान रखने-ढोने की थैली है; यूसुफ की कथा के संदर्भ में ‘बोरी’ सामान्य और उपयुक्त हिन्दी शब्द है।
- source_word: אָרְצָה
  choice: भूमि पर
  rationale: दिशासूचक रूप नीचे भूमि की ओर गति बताता है; ‘भूमि पर उतारी’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: וַיִּפְתְּחוּ
  choice: खोली
  rationale: פתח का सीधा अर्थ ‘खोलना’ है; यहाँ अतिरिक्त व्याख्या आवश्यक नहीं।
