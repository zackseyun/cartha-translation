base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/003.yaml
  text: As soon as the morning was light[a], the men were sent away, they and their donkeys.
translation:
  language: hi
  text: जैसे ही सुबह उजाला हुआ[a], वे पुरुष और उनके गधे रवाना कर दिए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब सुबह उजाला हुआ” या “भोर होते ही।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּקֶר אוֹר
  choice: जैसे ही सुबह उजाला हुआ
  rationale: समयवाचक खंड में אוֹר के प्रकाश होने के क्रियात्मक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘भोर हुई’ भी संभव है, पर वह कुछ अधिक मुहावरेदार व्याख्या है।
- source_word: וְהָאֲנָשִׁים
  choice: उन पुरुषों को
  rationale: निश्चित बहुवचन אִישׁ का संदर्भगत अनुवाद है। हिन्दी के कर्मवाच्य वाक्य में ‘को’ आवश्यक और स्वाभाविक है।
- source_word: שֻׁלְּחוּ
  choice: विदा कर दिया गया
  rationale: पुअल कर्मवाच्य का भाव सुरक्षित रखते हुए प्रस्थान के संदर्भ में सहज हिन्दी देता है; केवल ‘भेजा गया’ की अपेक्षा विदाई और रवाना किए जाने का अर्थ अधिक स्पष्ट है।
- source_word: הֵמָּה וַחֲמֹרֵיהֶם
  choice: उनके गधों समेत
  rationale: मूल में पुरुषों और उनके गधों का समन्वय है। हिन्दी में ‘समेत’ उसी संयुक्त प्रस्थान को स्वाभाविक रूप से व्यक्त करता है, जबकि शाब्दिक ‘वे और उनके गधे’ इस कर्मवाच्य रचना में असहज होगा।
