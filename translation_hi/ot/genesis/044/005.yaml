source:
  edition: WLC
  text: הֲ/ל֣וֹא זֶ֗ה אֲשֶׁ֨ר יִשְׁתֶּ֤ה אֲדֹנִ/י֙ בּ֔/וֹ וְ/ה֕וּא נַחֵ֥שׁ יְנַחֵ֖שׁ בּ֑/וֹ הֲרֵעֹתֶ֖ם אֲשֶׁ֥ר עֲשִׂיתֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/005.yaml
  text: Is this not the one from which my master drinks and by which he indeed practices divination? You have done evil in doing this[a][b].
translation:
  language: hi
  text: क्या यह वही प्याला नहीं है जिससे मेरा स्वामी पीता है और जिसके द्वारा वह निश्चय ही शकुन-विचार करता है?[a] तुमने यह करके बुरा किया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह निश्चय ही इससे शकुन-विचार कर सकता है।” इब्रानी में ज़ोर देने के लिए अनन्त क्रिया-रूप के साथ उसी धातु की क्रिया का प्रयोग हुआ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तुमने जो किया है, उसमें बुरा किया है।”
    reason: previous_rendering
lexical_decisions:
- source_word: הֲלֹא זֶה
  choice: क्या यह वही प्याला नहीं है
  rationale: प्रश्न सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है। संदर्भ से संकेतित वस्तु प्याला है; हिन्दी में उसे स्पष्ट करने से वाक्य स्वाभाविक और अर्थ निर्विवाद रहता है।
- source_word: אֲשֶׁר יִשְׁתֶּה אֲדֹנִי בּוֹ
  choice: जिससे मेरा स्वामी पीता है
  rationale: בּוֹ का यहाँ स्वाभाविक हिन्दी रूप ‘जिससे’ है। אֲדֹנִי सामाजिक संबोधन है, इसलिए ‘मेरा स्वामी’ उपयुक्त है।
- source_word: נַחֵשׁ יְנַחֵשׁ
  choice: निश्चय ही शकुन-विचार करता है
  rationale: नחש के पिएल रूप का अर्थ शकुन अथवा संकेतों के आधार पर भविष्य/गुप्त बात जानने का प्रयत्न करना है। क्रिया के साथ infinitive absolute की जोरदार अभिव्यक्ति को ‘निश्चय ही’ से दिखाया गया है।
- source_word: בּוֹ
  choice: जिसके द्वारा
  rationale: दूसरा בּוֹ साधनसूचक है और प्याले को शकुन-विचार के माध्यम के रूप में प्रस्तुत करता है।
- source_word: הֲרֵעֹתֶם אֲשֶׁר עֲשִׂיתֶם
  choice: तुमने यह करके बुरा किया है
  rationale: רעע के नैतिक अर्थ को ‘बुरा किया’ बनाए रखता है और सापेक्ष उपवाक्य को स्वाभाविक आधुनिक हिन्दी में ‘यह करके’ व्यक्त करता है।
theological_decisions:
- issue: क्या कथन यूसुफ को वास्तव में शकुन-विचार करने वाला बताता है या केवल उसके छद्म/परीक्षण का अंग है
  choice: 'सेवक के कथन को सीधी कथनात्मक भाषा में प्रस्तुत किया गया है: ‘वह निश्चय ही शकुन-विचार करता है।’'
  alternative: इसे नरम करके केवल ऐसी प्रतिष्ठा या क्षमता का संकेत देना, जैसे ‘वह इससे शकुन जान सकता है।’
  rationale: इब्रानी में सेवक का कथन स्पष्ट रूप से शकुन-विचार का दावा करता है। अनुवाद को कथा से बाहर का सामंजस्यकारी निर्णय जोड़ने के बजाय वक्ता के कथन को उसी रूप में रहने देना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शकुन-विचार’ प्राचीन निकट-पूर्वी पात्र-भाषा को स्पष्ट करता है, पर कथाकार की ओर से उसके सत्य या नैतिक मूल्य पर अतिरिक्त निर्णय नहीं जोड़ता।
