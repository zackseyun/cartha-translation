id: GEN.44.22
reference: Genesis 44:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י לֹא יוּכַ֥ל הַ/נַּ֖עַר לַ/עֲזֹ֣ב אֶת אָבִ֑י/ו וְ/עָזַ֥ב אֶת אָבִ֖י/ו וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/022.yaml
  text: And we said to my lord[a], ‘The boy cannot leave his father, for if he should leave his father, he would die.’
translation:
  language: hi
  text: तब हमने अपने प्रभु से कहा, ‘वह लड़का अपने पिता को नहीं छोड़ सकता, क्योंकि यदि वह अपने पिता को छोड़ दे, तो उसके पिता मर जाएँगे[a]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और वह अपने पिता को छोड़ता है, और वह मर जाता है।” इब्रानी में “मर जाता है” का कर्ता स्पष्ट नहीं है; प्रसंग संकेत करता है कि यहाँ पिता की मृत्यु की बात है।'
    reason: मूल पाठ की व्याकरणिक अस्पष्टता और अधिक शाब्दिक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: तब हमने कहा
  rationale: वय्यिक्तोल रूप कथा के क्रम को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस अनुक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל אֲדֹנִי
  choice: अपने प्रभु से
  rationale: यह यूसुफ के लिए आदरसूचक दरबारी संबोधन है। ‘प्रभु’ सम्मान और अधीनता का भाव रखता है, जबकि ‘मालिक’ यहाँ अपेक्षाकृत अधिक सेवकीय सुनाई दे सकता है।
- source_word: לֹא יוּכַל
  choice: नहीं आ सकता
  rationale: יכל असमर्थता व्यक्त करता है। गंतव्य की ओर से बोले जा रहे इस प्रसंग में ‘छोड़कर नहीं आ सकता’ केवल ‘नहीं छोड़ सकता’ की अपेक्षा हिन्दी में अभिप्रेत यात्रा को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַנַּעַר
  choice: वह लड़का
  rationale: נער किशोर या युवा पुरुष के लिए प्रयुक्त हो सकता है। यहाँ पिता पर उसकी निर्भरता और यहूदा की पारिवारिक दृष्टि के कारण ‘लड़का’ उपयुक्त है।
- source_word: לַעֲזֹב אֶת אָבִיו
  choice: अपने पिता को छोड़कर
  rationale: עזב यहाँ किसी को पीछे छोड़कर चले आने का अर्थ देता है, न कि आवश्यक रूप से नैतिक अर्थ में त्याग देने का।
- source_word: וְעָזַב
  choice: यदि वह ... छोड़कर आया
  rationale: संयोजक सहित पूर्ण क्रिया इस प्रसंग में शर्तसूचक परिणाम की भूमिका निभाती है; हिन्दी में ‘यदि’ इसे स्वाभाविक बनाता है।
- source_word: וָמֵת
  choice: तो उसके पिता मर जाएँगे
  rationale: क्रिया का कर्ता इब्रानी में व्यक्त नहीं है। निकटवर्ती व्यापक प्रसंग पिता के मरने की ओर संकेत करता है, इसलिए मुख्य पाठ में उसे स्पष्ट किया गया है और मूल की अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: וָמֵת का अनुल्लिखित कर्ता
  choice: उसके पिता मर जाएँगे
  alternative: वह मर जाएगा
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है और कर्ता स्पष्ट नहीं करती। उत्पत्ति 44:20, 29–31 में पिता के दुःख से मरने का प्रसंग इस अर्थ का समर्थन करता है; फिर भी व्याकरणिक अस्पष्टता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और मौखिक निवेदन के अनुरूप रखी गई है। पिता के लिए बहुवचन क्रिया ‘मर जाएँगे’ हिन्दी के आदरसूचक प्रयोग के अनुसार है; इससे इब्रानी के व्याकरणिक वचन में कोई अर्थगत परिवर्तन नहीं होता।
