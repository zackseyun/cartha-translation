id: GEN.44.30
reference: Genesis 44:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֗ה כְּ/בֹאִ/י֙ אֶל עַבְדְּ/ךָ֣ אָבִ֔/י וְ/הַ/נַּ֖עַר אֵינֶ֣/נּוּ אִתָּ֑/נוּ וְ/נַפְשׁ֖/וֹ קְשׁוּרָ֥ה בְ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/030.yaml
  text: Now[a], when I come to your servant my father[b], and the boy is not with us—his life being bound up with the boy’s life—
translation:
  language: hi
  text: अब, जब मैं आपके दास—मेरे पिता—के पास पहुँचूँगा और वह लड़का हमारे साथ नहीं होगा—और मेरे पिता का जीवन उस लड़के के जीवन से बँधा हुआ है—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यहूदा की विनती में अगले संभावित घटनाक्रम को सामने लाता है; हिन्दी में ‘अब’ स्वाभाविक रूप से प्रवाह को आगे बढ़ाता है।
- source_word: כְּבֹאִי
  choice: जब मैं ... पहुँचूँगा
  rationale: כְּ के साथ प्रथम पुरुष प्रत्यययुक्त infinitive construct यहाँ भावी समय की परिस्थिति व्यक्त करता है; ‘पहुँचूँगा’ गंतव्य तक आने का स्वाभाविक हिन्दी रूप है।
- source_word: אֶל עַבְדְּךָ אָבִי
  choice: आपके दास, अपने पिता, के पास
  rationale: ‘आपके दास’ यूसुफ के प्रति आदरसूचक संबोधन में याकूब का उल्लेख है और ‘अपने पिता’ उसी की समानाधिकरण पहचान; अल्पविराम यह संबंध स्पष्ट करते हैं।
- source_word: הַנַּעַר
  choice: वह लड़का
  rationale: नַעַר युवक को भी सूचित कर सकता है, पर पारिवारिक और भावनात्मक संदर्भ में ‘वह लड़का’ स्वाभाविक है और पहले से उल्लिखित बिन्यामीन की ओर संकेत करता है।
- source_word: אֵינֶנּוּ אִתָּנוּ
  choice: हमारे साथ नहीं होगा
  rationale: हिब्रू का सीधा अभाव-वाचक भाव सुरक्षित है; भावी परिस्थिति के कारण हिन्दी में ‘होगा’ अपेक्षित है।
- source_word: וְנַפְשׁוֹ
  choice: और मेरे पिता का जीवन
  rationale: נֶפֶשׁ यहाँ तकनीकी ‘आत्मा’ के बजाय व्यक्ति का जीवन और गहरा भावनात्मक लगाव दर्शाता है। अस्पष्ट सर्वनाम को संदर्भानुसार पिता के रूप में स्पष्ट किया गया है।
- source_word: קְשׁוּרָה בְנַפְשׁוֹ
  choice: उस लड़के के जीवन से बँधा हुआ है
  rationale: स्त्रीलिंग निष्क्रिय कृदंत קְשׁוּרָה נֶפֶשׁ के अनुरूप स्थायी गहरे बंधन को बताता है; अंतिम प्रत्यय संदर्भ में लड़के, बिन्यामीन, की ओर संकेत करता है।
theological_decisions:
- issue: दोनों स्थानों पर נֶפֶשׁ का अर्थ
  choice: जीवन
  alternative: प्राण / आत्मा
  rationale: इस संदर्भ में कथन पिता के अस्तित्व और भावनात्मक जीवन के लड़के से गहरे जुड़े होने का है; ‘आत्मा’ अनावश्यक रूप से तकनीकी धार्मिक अर्थ ला सकती है, जबकि ‘जीवन’ मूल की व्यापकता को बेहतर रखता है।
- issue: וְנַפְשׁוֹ से आरम्भ होने वाले खंड का संबंध
  choice: ‘और’ के साथ परिस्थितिजन्य कथन
  alternative: ‘क्योंकि’ के साथ स्पष्ट कारणवाचक कथन
  rationale: हिब्रू waw और participial construction कारण का संकेत दे सकते हैं, पर उसे व्याकरण में स्पष्ट रूप से निर्धारित नहीं करते। ‘और’ मूल की अर्थगत खुली जगह और तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का आदरपूर्ण और भावनात्मक गद्य। यूसुफ के लिए ‘आप’ और संबोधनात्मक ‘आपके दास’ रखा गया है। वाक्य जानबूझकर अपूर्ण है, क्योंकि यह पद 31 में पूरा होता है; दीर्घ विरामचिह्न इस निरंतरता को दर्शाता है।
