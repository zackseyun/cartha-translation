  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। यहूदा द्वारा उच्चाधिकारी को संबोधित करने के कारण ‘आपने’ रखा गया है, जबकि उद्धृत आदेश में भाइयों के लिए बहुवचन ‘तुम’ प्रयुक्त है।
