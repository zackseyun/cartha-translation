base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/023.yaml
  text: And you said to your servants[a], ‘If your youngest brother does not come down with you, you shall not continue to see my face.’
translation:
  language: hi
  text: और आपने अपने सेवकों से कहा था, ‘यदि तुम्हारा सबसे छोटा भाई तुम्हारे साथ नीचे न आए, तो तुम फिर मेरा मुख न देखोगे[a]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक मुहावरेदार रूप में, “तुम फिर मेरे सामने उपस्थित न होगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: और आपने ... कहा था
  rationale: कथात्मक क्रम में אמר के wayyiqtol रूप को भूतकाल में रखा गया है; प्रसंग में यहूदा पहले कही गई बात दोहरा रहा है, इसलिए हिंदी में ‘कहा था’ स्वाभाविक है।
- source_word: עֲבָדֶיךָ
  choice: अपने सेवकों
  rationale: दरबारी और विनम्र संबोधन में यहूदा अपने और अपने भाइयों के लिए ‘सेवक’ कहता है; यहाँ दासत्व पर विशेष बल नहीं है।
- source_word: אִם לֹא
  choice: यदि ... न
  rationale: नकारात्मक शर्त की इब्रानी संरचना को स्पष्ट और स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: יֵרֵד
  choice: नीचे न आए
  rationale: ירד की दिशात्मक धारणा ‘नीचे’ से बनी रहती है, जबकि मिस्र में उपस्थित वक्ता की ओर गति के लिए ‘आए’ हिंदी में स्वाभाविक है।
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: तुम्हारा सबसे छोटा भाई
  rationale: यह पद भाइयों में सबसे छोटे को सूचित करता है, केवल किसी छोटे भाई को नहीं।
- source_word: אִתְּכֶם
  choice: तुम्हारे साथ
  rationale: साथ होने के अर्थ को सीधी और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לֹא תֹסִפוּן
  choice: तुम फिर ... न देखोगे
  rationale: יסף के इस प्रयोग का अर्थ किसी काम को दोबारा या आगे न करना है; ‘फिर ... न’ आधुनिक हिंदी में निषेध को सहजता से व्यक्त करता है।
- source_word: לִרְאוֹת פָּנָי
  choice: मेरा मुख न देखोगे
  rationale: इब्रानी के सजीव शाब्दिक मुहावरे ‘मेरा मुख देखना’ को मुख्य पाठ में रखा गया है; उसका अधिक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
