  text: וַ/יְחַפֵּ֕שׂ בַּ/גָּד֣וֹל הֵחֵ֔ל וּ/בַ/קָּטֹ֖ן כִּלָּ֑ה וַ/יִּמָּצֵא֙ הַ/גָּבִ֔יעַ בְּ/אַמְתַּ֖חַת בִּנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/012.yaml
  text: And he searched[a], beginning with the oldest and finishing with the youngest, and the cup was found in Benjamin’s sack.
translation:
  language: hi
  text: उसने सबसे बड़े से आरम्भ करके सबसे छोटे तक तलाशी ली, और प्याला[a] बिन्यामीन के बोरे में मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कटोरा।” हिब्रू शब्द प्याले या कटोरे जैसे पात्र के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַפֵּשׂ
  choice: उसने ... तलाशी ली
  rationale: क्रिया חפשׂ यहाँ भाइयों के सामान की व्यवस्थित तलाशी लेने को दर्शाती है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: בַּגָּדוֹל
  choice: सबसे बड़े से
  rationale: पारिवारिक प्रसंग में यह आयु में सबसे बड़े भाई को दर्शाता है, न कि आकार या पद में बड़े को।
- source_word: הֵחֵל
  choice: आरम्भ करके
  rationale: यह तलाशी के क्रम का आरम्भ-बिंदु बताता है और अगले खंड के साथ स्वाभाविक हिन्दी वाक्य बनाता है।
- source_word: וּבַקָּטֹן
  choice: सबसे छोटे तक
  rationale: यहाँ קָטֹן का अर्थ परिवार में आयु के अनुसार सबसे छोटा भाई है; 'तक' क्रम के अंतिम बिंदु को स्पष्ट करता है।
- source_word: כִּלָּה
  choice: तक
  rationale: हिब्रू क्रिया तलाशी के सबसे छोटे पर समाप्त होने को व्यक्त करती है; हिन्दी में 'से ... तक' का संक्षिप्त ढाँचा आरम्भ और समाप्ति दोनों को स्वाभाविक रूप से संप्रेषित करता है।
- source_word: וַיִּמָּצֵא
  choice: मिला
  rationale: हिब्रू निफ़अल का निष्क्रिय भाव बनाए रखा गया है; हिन्दी में 'मिला' कर्ता को अनिर्दिष्ट रखते हुए स्वाभाविक है।
- source_word: הַגָּבִיעַ
  choice: प्याला
  rationale: גביע पीने के पात्र के लिए प्रयुक्त होता है। 'प्याला' इस प्राचीन कथात्मक प्रसंग में सहज और गरिमापूर्ण है; 'कटोरा' भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: בְּאַמְתַּחַת
  choice: बोरे में
  rationale: אַמְתַּחַת अनाज या यात्रा-सामान रखने के बोरे/थैले को दर्शाता है; इस प्रसंग में 'बोरा' अधिक विशिष्ट है।
- source_word: בִּנְיָמִן
  choice: बिन्यामीन
  rationale: हिब्रू नाम בִּנְיָמִן का निकट देवनागरी लिप्यंतरण अपनाया गया है।
