  yaml_path: translation/ot/genesis/044/007.yaml
  text: And they said to him[b][a], “Why does my lord speak words like these? Far be it from your servants to do such a thing.”
translation:
  language: hi
  text: उन्होंने उससे कहा, “मेरे स्वामी[a] ऐसी बातें[b] क्यों कहते हैं? आपके दासों से ऐसा काम करना कदापि नहीं हो सकता!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे मालिक।”
    reason: lexical_alternative
  - marker: b
    text: या “ऐसे वचन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: उन्होंने उससे कहा
  rationale: बहुवचन कर्ता और एकवचन संदर्भित व्यक्ति को बनाए रखते हुए हिब्रू कथात्मक क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָמָּה יְדַבֵּר אֲדֹנִי
  choice: मेरे स्वामी ऐसी बातें क्यों कहते हैं?
  rationale: ‘मेरे स्वामी’ मानवीय सम्मानसूचक संबोधन है; हिन्दी में आदर के कारण इसके साथ बहुवचन क्रिया ‘कहते हैं’ स्वाभाविक है।
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ऐसी बातें
  rationale: शाब्दिक अर्थ ‘ऐसे/इन जैसे शब्द’ है। प्रसंग में ‘ऐसी बातें’ आधुनिक हिन्दी में स्वाभाविक है और कथन की ओर संकेत बनाए रखता है।
- source_word: חָלִילָה לַעֲבָדֶיךָ
  choice: आपके दासों से ... कदापि न हो
  rationale: חָלִילָה तीव्र अस्वीकार व्यक्त करता है। यह हिन्दी प्रयोग बिना किसी अतिरिक्त धार्मिक संकेत के उस जोरदार निषेध को बनाए रखता है।
- source_word: מֵעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: ऐसा काम
  rationale: आरोपित कृत्य की ओर संकेत करते हुए हिन्दी में संक्षिप्त और स्वाभाविक अभिव्यक्ति देता है।
