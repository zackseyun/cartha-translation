- source_word: וַיַּשִּׂגֵם
  choice: उसने उन्हें जा पकड़ा
  rationale: हिफ़ील रूप यहाँ रास्ते में पीछे से पहुँचने और पकड़ लेने का भाव देता है। ‘जा पकड़ा’ आधुनिक हिन्दी में स्वाभाविक है और पीछा करके उन तक पहुँचने की घटना को व्यक्त करता है।
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: और उनसे ... कहीं
  rationale: דבר का मूल अर्थ ‘बोलना’ है और אֶל संबोधन की दिशा बताता है। ‘उनसे ... कहीं’ हिन्दी में अगले प्रत्यक्ष कथन की स्वाभाविक भूमिका बनाता है।
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें
  rationale: शाब्दिक अर्थ ‘ये शब्द’ है, पर इस कथन-परिचय में ‘ये बातें’ अधिक स्वाभाविक हिन्दी है और आगे आने वाली बातों को स्पष्ट रूप से इंगित करता है।
