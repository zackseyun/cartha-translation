  yaml_path: translation/ot/genesis/044/017.yaml
  text: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my servant[b], but you may go up in peace to your father."
translation:
  language: hi
  text: पर उसने कहा, “मैं ऐसा कभी नहीं करूँगा! जिस आदमी के हाथ में वह प्याला मिला है, वही मेरा दास[a] होगा; पर तुम कुशल से अपने पिता के पास चले जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवक।” हिब्रू शब्द עָבֶד का अर्थ “सेवक” या “दास,” दोनों हो सकता है; यहाँ प्रसंग दंड के रूप में अधीनता का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: मैं ऐसा करने की सोच भी नहीं सकता
  rationale: यह मुहावरा तीव्र अस्वीकार और घृणा व्यक्त करता है। आधुनिक हिन्दी में यह चयन उसी बल को स्वाभाविक रूप से प्रकट करता है।
- source_word: מֵעֲשׂוֹת זֹאת
  choice: ऐसा करने
  rationale: पूर्वसर्ग सहित क्रियार्थक रूप उस काम को बताता है जिसे वक्ता दृढ़ता से अस्वीकार करता है।
- source_word: הָאִישׁ אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: जिस आदमी के हाथ में वह प्याला मिला है
  rationale: हिब्रू के ठोस बिंब ‘उसके हाथ में’ को सुरक्षित रखते हुए हिन्दी में स्वाभाविक वाक्य दिया गया है; प्रसंग में גָּבִיעַ का अर्थ ‘प्याला’ है।
- source_word: הוּא יִהְיֶה לִּי עָבֶד
  choice: वही मेरा दास होगा
  rationale: הוּא पर बल को ‘वही’ से व्यक्त किया गया है। עָבֶד सेवक या दास दोनों हो सकता है; यहाँ दंडस्वरूप बंधुआ अधीनता के कारण ‘दास’ अधिक उपयुक्त है।
- source_word: וְאַתֶּם עֲלוּ
  choice: पर तुम ... लौट जाओ
  rationale: बहुवचन आज्ञार्थक रूप भाइयों को जाने की अनुमति देता है और दोषी ठहराए गए व्यक्ति से उनका विरोध दर्शाता है। गंतव्य पिता के पास होने के कारण आधुनिक हिन्दी में ‘लौट जाओ’ स्वाभाविक है।
- source_word: לְשָׁלוֹם
  choice: कुशल से
  rationale: यह सुरक्षित और शांतिपूर्वक प्रस्थान करने का सामान्य मुहावरा है; ‘कुशल से’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: אֶל אֲבִיכֶם
  choice: अपने पिता के पास
  rationale: बहुवचन संबोधन के संबंध को हिन्दी में स्पष्ट और सहज रूप से व्यक्त करता है।
