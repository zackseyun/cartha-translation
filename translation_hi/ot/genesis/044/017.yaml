  verdict: revise
  source_fidelity: The draft accurately conveys the cup being found in the man's hand, the exclusive emphasis on that man, his becoming the speaker's slave, and the brothers' peaceful departure to their father. However, “मैं ऐसा करने की सोच भी नहीं सकता” changes the refused action from doing to merely thinking about doing it. “लौट जाओ” is contextually understandable but adds ‘return’ where the Hebrew simply commands them to go up/go to their father.
  naturalness: The Hindi is fluent, modern, and appropriately dignified. The proposed wording retains this register while more directly representing the Hebrew action.
  terminology: “दास” suitably represents עָבֶד in this punitive context. The note appropriately records the lexical range; its explanation is refined to avoid over-specifying the precise legal form of bondage.
  issues:
  - severity: medium
    issue: The opening says that the speaker cannot even think of doing this.
    rationale: חָלִילָה לִּי מֵעֲשׂוֹת זֹאת is a forceful rejection of performing the act, not specifically of thinking about it. Hindi should keep ‘doing’ as the rejected action.
  - severity: low
    issue: “लौट जाओ” adds the notion of returning.
    rationale: The Hebrew imperative is literally ‘go up’ to their father. Since the directional ascent is idiomatic in the narrative, ‘चले जाओ’ is a natural Hindi rendering without adding ‘return.’
  revised_text: पर उसने कहा, “मैं ऐसा कभी नहीं करूँगा! जिस आदमी के हाथ में वह प्याला मिला है, वही मेरा दास[a] होगा; पर तुम कुशल से अपने पिता के पास चले जाओ।”
