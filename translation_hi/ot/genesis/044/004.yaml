base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/004.yaml
  text: They had gone out of the city; they had not gone far[a], when Joseph said to the one over his house, “Get up, pursue the men, and when you overtake them, say to them, ‘Why have you repaid evil for good?’”
translation:
  language: hi
  text: वे नगर से निकल चुके थे और अभी दूर नहीं गए थे कि यूसुफ ने उस व्यक्ति से, जो उसके घर का अधिकारी था,[a] कहा, “उठ, उन आदमियों का पीछा कर; और जब तू उन तक पहुँच जाए, तो उनसे कहना, ‘तुमने भलाई के बदले बुराई क्यों की?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके घर के ऊपर [नियुक्त] व्यक्ति।” इसे “उसका भण्डारी” या “उसके घर का प्रबंधक” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם יָצְאוּ אֶת הָעִיר לֹא הִרְחִיקוּ
  choice: वे नगर से निकल चुके थे, पर अभी दूर नहीं गए थे
  rationale: हिब्रू की क्रमिक कथा और दूरी के अभाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘निकल चुके थे’ यूसुफ के अगले आदेश से पहले की क्रिया स्पष्ट करता है।
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  choice: अपने घर के अधिकारी
  rationale: शाब्दिक अर्थ ‘उसके घर के ऊपर नियुक्त व्यक्ति’ है; यह घर-बार के प्रबंधक या भण्डारी को दर्शाता है। ‘अधिकारी’ सम्बन्ध को संक्षेप में और स्वाभाविक रूप से व्यक्त करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: קוּם רְדֹף אַחֲרֵי הָאֲנָשִׁים
  choice: उठ, उन पुरुषों का पीछा कर
  rationale: एकवचन आज्ञार्थक रूप और आदेश की तत्परता बनाए रखी गई है। הָאֲנָשִׁים के पुरुष-सूचक अर्थ को ‘पुरुषों’ से स्पष्ट किया गया है।
- source_word: וְהִשַּׂגְתָּם
  choice: जब तू उन्हें जा पकड़े
  rationale: हिफ़ील रूप का अर्थ उन तक पहुँच जाना या उन्हें पकड़ लेना है; ‘जब’ अगली आज्ञा से पहले अपेक्षित क्रम को स्वाभाविक हिन्दी में दिखाता है।
- source_word: שִׁלַּמְתֶּם רָעָה תַּחַת טוֹבָה
  choice: तुमने भलाई का बदला बुराई से क्यों दिया?
  rationale: שִׁלַּמְתֶּם के प्रतिदान या बदला चुकाने के भाव तथा רָעָה और טוֹבָה के नैतिक विरोध को प्रचलित हिन्दी मुहावरे में सुरक्षित रखता है।
