  text: וַ/יִּגַּ֨שׁ אֵלָ֜י/ו יְהוּדָ֗ה וַ/יֹּאמֶר֮ בִּ֣י אֲדֹנִ/י֒ יְדַבֶּר נָ֨א עַבְדְּ/ךָ֤ דָבָר֙ בְּ/אָזְנֵ֣י אֲדֹנִ֔/י וְ/אַל יִ֥חַר אַפְּ/ךָ֖ בְּ/עַבְדֶּ֑/ךָ כִּ֥י כָמ֖וֹ/ךָ כְּ/פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/018.yaml
  text: Then Judah came near to him and said[a], “Please, my lord, let your servant speak a word in my lord’s hearing, and do not let your anger burn against your servant[c][b], for you are like Pharaoh.”
translation:
  language: hi
  text: तब यहूदा उसके पास आया और बोला, “कृपा करके[a], मेरे प्रभु, अनुमति दें कि आपका दास आपके सामने एक बात कहे[b], और अपने दास पर आपका क्रोध न भड़के[c], क्योंकि आप फ़िरौन के समान हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे क्षमा करें, मेरे प्रभु।” इब्रानी आरंभिक शब्द विनम्र निवेदन व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मेरे प्रभु के कानों में।” यह इब्रानी मुहावरा है, जिसका अर्थ है कि प्रभु उसकी बात सुनें।
    reason: cultural_note
  - marker: c
    text: या, “अपने दास पर क्रोधित न हों।” शाब्दिक भाव है, “अपने दास पर आपका क्रोध न भड़के।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ אֵלָיו
  choice: उसके पास आया
  rationale: यह अभिव्यक्ति यहूदा के यूसुफ़ के निकट आगे बढ़ने की वास्तविक क्रिया को सहज हिन्दी में व्यक्त करती है।
- source_word: בִּי אֲדֹנִי
  choice: हे मेरे प्रभु, कृपया
  rationale: בִּי विनम्र निवेदन का सूचक है; ‘कृपया’ उसका स्वाभाविक अर्थ देता है, जबकि ‘हे मेरे प्रभु’ दरबारी आदर बनाए रखता है।
- source_word: יְדַבֶּר נָא עַבְדְּךָ דָבָר
  choice: अपने दास को ... एक बात कहने दीजिए
  rationale: निवेदनात्मक क्रिया, נא की विनम्रता, आत्म-संदर्भ ‘आपका दास’ और דָבָר के एकवचन को वर्तमान, सम्मानपूर्ण हिन्दी में सुरक्षित रखा गया है।
- source_word: בְּאָזְנֵי אֲדֹנִי
  choice: अपने प्रभु के सुनते हुए
  rationale: शाब्दिक ‘मेरे प्रभु के कानों में’ एक इब्रानी मुहावरा है; चुना हुआ रूप सुनने की धारणा को बनाए रखते हुए हिन्दी में अर्थ स्पष्ट करता है।
- source_word: וְאַל יִחַר אַפְּךָ בְּעַבְדֶּךָ
  choice: अपने दास पर आपका क्रोध न भड़के
  rationale: यह हिन्दी में स्वाभाविक होने के साथ मूल के ‘जलने/भड़कने’ वाले क्रोध-रूपक और दास की ओर निर्देशित क्रोध को बनाए रखता है।
- source_word: כִּי כָמוֹךָ כְּפַרְעֹה
  choice: क्योंकि आप फ़िरौन के समान हैं
  rationale: तुलना को सीधे रूप में रखा गया है और यूसुफ़ के अधिकार व पद की समानता व्यक्त होती है, बिना उसे पूर्ण समानता के रूप में बढ़ा-चढ़ाकर कहे।
theological_decisions:
- issue: यूसुफ़ की फ़िरौन से तुलना
  choice: फ़िरौन के समान
  alternative: फ़िरौन के बराबर
  rationale: मूल पाठ तुलना करता है, पर समानता की सटीक सीमा नहीं बताता। ‘के समान’ उस अस्पष्टता को सुरक्षित रखता है और इसे पूर्ण पद-समानता नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर दरबारी प्रसंग के अनुरूप सम्मानपूर्ण और गरिमापूर्ण रखी गई है। ‘मेरे प्रभु,’ ‘अपने दास’ और ‘दीजिए’ यहूदा की विनम्रता व्यक्त करते हैं; क्रोध का मूल रूपक भी सुरक्षित है।
