lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब आपने कहा
  rationale: कथात्मक क्रम में आए क्रिया-रूप का स्वाभाविक हिन्दी निरूपण ‘तब’ से होता है; आदरसूचक ‘आपने’ यहूदा द्वारा यूसुफ को किए गए सीधे संबोधन के अनुकूल है।
- source_word: עֲבָדֶיךָ
  choice: अपने सेवकों
  rationale: दरबारी प्रसंग में ‘सेवक’ संबंधगत और राजकीय अर्थ को ठीक व्यक्त करता है; यहाँ ‘दास’ कहना अनावश्यक रूप से बंधुआ स्थिति पर बल देगा।
- source_word: הוֹרִדֻהוּ
  choice: उसे ... नीचे ले आओ
  rationale: हिफ़ील बहुवचन आज्ञार्थक का प्रेरणार्थक अर्थ और मिस्र की ओर उतरने की दिशात्मक छवि दोनों सुरक्षित रहते हैं।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: यह यूसुफ की ओर व्यक्तिगत रूप से लाने का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וְאָשִׂימָה עֵינִי עָלָיו
  choice: ताकि मैं उसे अपनी आँखों से देखूँ
  rationale: हिब्रू मुहावरे ‘उस पर अपनी आँख रखूँ’ की देखने वाली मूल छवि को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे निश्चित रूप से ‘उसकी देखभाल करूँ’ मान लेने के।
