base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/031.yaml
  text: then[a], when he sees that the boy is not there, he will die, and your servants will bring down the gray hair of your servant our father to Sheol in sorrow.
translation:
  language: hi
  text: जब वह देखेगा कि वह लड़का वहाँ नहीं है, तो वह मर जाएगा; और आपके दास हमारे पिता, जो आपके दास हैं, के पके बालों को शोक के साथ शिओल[a] में उतार देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “कब्र” अथवा “मृतकों का लोक।” इब्रानी: “शिओल।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: तब
  rationale: यह पिछले कथन की शर्त के परिणाम को प्रस्तुत करता है; हिंदी में ‘तब’ इस कथात्मक कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּרְאוֹתוֹ
  choice: जब वह देखेगा
  rationale: כ के साथ infinitive construct और 3ms प्रत्यय समयगत परिस्थिति व्यक्त करता है—‘जब वह देखेगा।’
- source_word: כִּי אֵין הַנַּעַר
  choice: कि वह लड़का वहाँ नहीं है
  rationale: אֵין यहाँ अपेक्षित उपस्थिति के अभाव को बताता है; ‘वहाँ नहीं है’ मृत्यु का अनावश्यक संकेत दिए बिना अर्थ स्पष्ट करता है।
- source_word: הַנַּעַר
  choice: वह लड़का
  rationale: נַעַר युवक या लड़के के लिए आ सकता है; इस पारिवारिक और भावनात्मक संदर्भ में ‘लड़का’ उपयुक्त है।
- source_word: וָמֵת
  choice: तो वह मर जाएगा
  rationale: यह परिणाम-क्रम को आगे बढ़ाता है और संदर्भ में भविष्यकालीन परिणाम बताता है।
- source_word: וְהוֹרִידוּ
  choice: उतार देंगे
  rationale: ירד का हिफ़ील रूप किसी को नीचे ले जाने का भाव देता है; ‘अधोलोक उतार देंगे’ मूल रूपक को बनाए रखता है।
- source_word: עֲבָדֶיךָ
  choice: आपके दास
  rationale: शासक के सामने यह विनम्र आत्म-संबोधन है; ‘दास’ दरबारी अधीनता को बनाए रखता है।
- source_word: שֵׂיבַת
  choice: पके बालों
  rationale: शब्द का शाब्दिक अर्थ सफेद या पके बाल है और लाक्षणिक अर्थ वृद्धावस्था; ठोस इब्रानी बिंब को सुरक्षित रखा गया है।
- source_word: עַבְדְּךָ אָבִינוּ
  choice: अपने पिता, आपके दास के
  rationale: ‘हमारे पिता’ और ‘आपके दास’ दोनों संबंधों को स्वाभाविक हिंदी में सुरक्षित रखता है; कर्ता ‘आपके दास’ होने के कारण ‘अपने पिता’ संबंध स्पष्ट करता है।
- source_word: בְּיָגוֹן
  choice: शोक में
  rationale: יָגוֹן गहरे दुःख या शोक को दर्शाता है; ‘शोक में’ मूल पूर्वसर्गीय अभिव्यक्ति के निकट और स्वाभाविक है।
- source_word: שְׁאֹלָה
  choice: अधोलोक
  rationale: ‘अधोलोक’ मृतकों के लोक की दिशा का भाव देता है और इसे केवल कब्र तक सीमित नहीं करता; पादटिप्पणी मूल ‘शिओल’ और वैकल्पिक अर्थ बताती है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक; शिओल
  rationale: यह शब्द केवल दफनाने की जगह से व्यापक अर्थ रख सकता है। ‘अधोलोक’ प्राचीन ‘नीचे उतरने’ के बिंब को बनाए रखता है, जबकि पादटिप्पणी मूल शब्द और अर्थ-सीमा को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। यूसुफ के प्रति आदरसूचक ‘आप’ और दरबारी आत्म-संबोधन ‘आपके दास’ प्रयुक्त हैं। ‘पके बालों को ... उतार देंगे’ मूल इब्रानी के ठोस रूपक को जानबूझकर सुरक्षित रखता है।
