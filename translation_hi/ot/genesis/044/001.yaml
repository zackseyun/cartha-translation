id: GEN.44.1
reference: Genesis 44:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְצַ֞ו אֶת אֲשֶׁ֣ר עַל בֵּית/וֹ֮ לֵ/אמֹר֒ מַלֵּ֞א אֶת אַמְתְּחֹ֤ת הָֽ/אֲנָשִׁים֙ אֹ֔כֶל כַּ/אֲשֶׁ֥ר יוּכְל֖וּ/ן שְׂאֵ֑ת וְ/שִׂ֥ים כֶּֽסֶף אִ֖ישׁ בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/001.yaml
  text: Then he commanded the one over his house[a], saying, “Fill the men's sacks with food, as much as they can carry, and put each man's silver in the mouth of his sack.”
translation:
  language: hi
  text: तब उसने अपने घर के प्रबंधक को आज्ञा दी, “इन आदमियों की बोरियों में उतना भोजन भर दो जितना वे उठा सकें, और हर एक की चाँदी उसकी बोरी के मुँह[a] में रख दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् उसकी बोरी के खुले सिरे में।
    reason: मूल इब्रानी में शाब्दिक रूप से ‘बोरी के मुँह में’ है।
lexical_decisions:
- source_word: וַיְצַו
  choice: तब उसने…आज्ञा दी
  rationale: वय्यिक्तोल कथा को क्रम में आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में इस क्रम को व्यक्त करता है और צוה का आदेशात्मक अर्थ ‘आज्ञा दी’ से सुरक्षित रहता है।
- source_word: אֲשֶׁר עַל־בֵּיתוֹ
  choice: अपने घर के प्रबंधक
  rationale: शाब्दिक अर्थ ‘जो उसके घर पर था’ है और यह घर-गृहस्थी का दायित्व सँभालने वाले अधिकारी को दर्शाता है। ‘प्रबंधक’ आधुनिक हिन्दी में पद और कार्य दोनों को स्पष्ट करता है।
- source_word: אַמְתְּחֹת
  choice: बोरियों
  rationale: यह यात्रा में अनाज या खाद्य-सामग्री ढोने के बड़े थैलों को दर्शाता है; इस प्रसंग में ‘बोरियाँ’ सामान्य ‘थैलों’ से अधिक उपयुक्त है।
- source_word: אֹכֶל
  choice: भोजन
  rationale: मूल शब्द व्यापक रूप से खाद्य-सामग्री को सूचित करता है। प्रसंग में अनाज होने पर भी मूल पद को संकीर्ण न करते हुए ‘भोजन’ चुना गया है।
- source_word: כַּאֲשֶׁר יוּכְלוּן שְׂאֵת
  choice: जितना वे उठा सकें
  rationale: यह क्षमता और भार उठाने के संयुक्त भाव को स्वाभाविक, संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: כֶּסֶף אִישׁ
  choice: हर एक की चाँदी
  rationale: אישׁ का वितरणात्मक भाव ‘हर एक’ से और כסף का मूल अर्थ ‘चाँदी’ से बना रहता है; प्रसंग से यह भुगतान की चाँदी समझी जाती है।
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: उसकी बोरी के मुँह में
  rationale: मूल इब्रानी रूपक ‘बोरी का मुँह’ हिन्दी में भी सहज और बोधगम्य है; इसका आशय बोरी का खुला सिरा है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। आदेश की सीधी शैली और कथा का क्रम सुरक्षित है; ‘प्रबंधक’ शाब्दिक पदबंध के प्रशासनिक आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
