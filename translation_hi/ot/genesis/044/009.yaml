source:
  edition: WLC
  text: אֲשֶׁ֨ר יִמָּצֵ֥א אִתּ֛/וֹ מֵ/עֲבָדֶ֖י/ךָ וָ/מֵ֑ת וְ/גַם אֲנַ֕חְנוּ נִֽהְיֶ֥ה לַֽ/אדֹנִ֖/י לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/009.yaml
  text: Whichever of your servants it is found with[a], let him die[b], and we also will become servants to my lord.
translation:
  language: hi
  text: आपके सेवकों में से जिसके पास वह[a] मिले, वह मर जाए; और हम भी मेरे स्वामी के दास[b] बन जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वह’ से आशय पिछले प्रसंग में बताए गए प्याले से है।
    reason: implicit_referent
  - marker: b
    text: यहाँ ‘सेवकों’ और ‘दास’ के पीछे एक ही इब्रानी शब्द-मूल है। पहले स्थान पर यह आदरपूर्ण आत्म-संबोधन है, जबकि यहाँ वास्तविक दासता का दंड सामने है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ מֵעֲבָדֶיךָ
  choice: आपके सेवकों में से जिसके पास वह मिले
  rationale: यह अनिश्चित संबंधवाचक वाक्यांश है। ‘जिसके पास’ אִתּוֹ के अधिकार/साथ होने के भाव को और ‘में से’ מִן के अंशवाचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। क्रिया का निहित कर्ता पिछले प्रसंग का प्याला है, जिसे ‘वह’ से बनाए रखा गया है।
- source_word: וָמֵת
  choice: वह मर जाए
  rationale: संयोजक सहित पूर्ण क्रिया यहाँ प्रस्तावित दंड के परिणाम को इच्छार्थक ढंग से व्यक्त करती है। ‘मर जाए’ उस बल को बनाए रखता है, बिना यह जोड़े कि उसे किस रीति से मारा जाएगा।
- source_word: וְגַם אֲנַחְנוּ
  choice: और हम भी
  rationale: ‘भी’ दोषी व्यक्ति के दंड के अतिरिक्त शेष भाइयों पर आने वाले परिणाम का योगात्मक बल सुरक्षित रखता है।
- source_word: נִהְיֶה
  choice: बन जाएँगे
  rationale: यह किसी नई अवस्था में प्रवेश करने का भाव देता है; इसलिए केवल ‘होंगे’ की अपेक्षा ‘बन जाएँगे’ अधिक स्पष्ट है।
- source_word: לַאדֹנִי
  choice: मेरे स्वामी के
  rationale: एकवचन प्रथम-पुरुष प्रत्यय को ‘मेरे’ से सुरक्षित रखा गया है। यहाँ आदरपूर्वक संबोधित मानवीय अधिकारी अभिप्रेत है, परमेश्वर का शीर्षक नहीं।
- source_word: לַעֲבָדִים
  choice: दास
  rationale: यहाँ दंडस्वरूप वास्तविक पराधीनता प्रस्तावित है, इसलिए ‘दास’ केवल शिष्टाचारसूचक ‘सेवक’ से अधिक सटीक है।
theological_decisions:
- issue: एक ही मूल עבד के दो प्रसंगगत अनुवाद
  choice: पहली बार ‘सेवक’, दूसरी बार ‘दास’
  alternative: दोनों स्थानों पर ‘सेवक’ या दोनों स्थानों पर ‘दास’
  rationale: पहले प्रयोग में भाई अधिकारी के सामने अपने लिए विनम्र दरबारी संबोधन करते हैं; दूसरे में वे दंडस्वरूप बंधुआ अधीनता स्वीकार करने की बात कहते हैं। अलग हिन्दी शब्द प्रसंगगत अंतर स्पष्ट करते हैं, जबकि पादटिप्पणी मूल की शब्दगत समानता बताती है।
- issue: וָמֵת में दंड का स्वरूप
  choice: ‘वह मर जाए’
  alternative: ‘उसे मार डाला जाए’
  rationale: मूल पाठ मृत्यु का परिणाम कहता है, पर मारने की प्रक्रिया या कर्ता स्पष्ट नहीं करता। चुना हुआ रूप इस अनिर्दिष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मेरे स्वामी’ का एकवचन मूल इब्रानी के वक्ता-दृष्टिकोण को बनाए रखता है, भले ही आगे सामूहिक ‘हम’ आया है।
