source:
  edition: WLC
  text: וְ/עַתָּ֗ה יֵֽשֶׁב נָ֤א עַבְדְּ/ךָ֙ תַּ֣חַת הַ/נַּ֔עַר עֶ֖בֶד לַֽ/אדֹנִ֑/י וְ/הַ/נַּ֖עַר יַ֥עַל עִם אֶחָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/033.yaml
  text: So now[a], please let your servant remain instead of the boy as a servant to my lord[b], and let the boy go up with his brothers.
translation:
  language: hi
  text: इसलिए अब, कृपा करके, अपने सेवक को उस लड़के के बदले मेरे स्वामी का दास बनकर रहने दीजिए, और उस लड़के को उसके भाइयों के साथ ऊपर जाने दीजिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ऊपर जाने” से आशय मिस्र से कनान की ओर यात्रा करना है; ऐसी यात्रा का वर्णन इब्रानी में सामान्यतः इसी प्रकार किया जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यहूदा की चरम विनती की ओर बढ़ने वाला संयोजक और प्रसंगगत निष्कर्ष—दोनों स्वाभाविक हिन्दी में व्यक्त होते हैं।
- source_word: יֵשֶׁב נָא
  choice: कृपा करके ... यहीं रहने दीजिए
  rationale: יִשֵׁב के विनयात्मक भाव और נָא की नम्र प्रार्थना को आदरसूचक आधुनिक हिन्दी में व्यक्त करता है; 'यहीं' पीछे रह जाने का प्रसंग स्पष्ट करता है।
- source_word: עַבְדְּךָ
  choice: अपने दास को
  rationale: यहूदा अपने लिए सम्मानसूचक दरबारी आत्म-संबोधन करता है; 'दास' इस विनम्रता और सामाजिक अधीनता दोनों को बनाए रखता है।
- source_word: תַּחַת הַנַּעַר
  choice: इस लड़के के बदले
  rationale: תחת का यहाँ स्थानापन्न होने का अर्थ है, न कि स्थानगत 'नीचे'।
- source_word: הַנַּעַר
  choice: इस लड़के
  rationale: यह बिन्यामीन के लिए यहूदा की रक्षक और भावनात्मक भाषा को बनाए रखता है; 'युवक' उस प्रभाव को कुछ कम कर देता।
- source_word: עֶבֶד לַאדֹנִי
  choice: मेरे स्वामी का दास बनकर
  rationale: यहाँ עבד वास्तविक बंधुआ अधीनता का प्रस्ताव है, जबकि אדני यूसुफ के लिए मानवीय सम्मानसूचक संबोधन है।
- source_word: וְהַנַּעַר יַעַל
  choice: और इस लड़के को ... ऊपर जाने दीजिए
  rationale: विनती का भाव जारी रहता है और עלה का शाब्दिक 'ऊपर जाना' सुरक्षित रहता है, जो मिस्र से कनान की यात्रा के लिए प्रचलित था।
- source_word: עִם אֶחָיו
  choice: अपने भाइयों के साथ
  rationale: पारिवारिक संबंध का सीधा और प्रसंगानुकूल अनुवाद।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; यहूदा की अत्यंत विनम्र दरबारी विनती के लिए आदरसूचक क्रियाएँ रखी गई हैं। 'दास' की पुनरावृत्ति स्रोत में एक ही शब्द के दो प्रसंगगत प्रयोग—विनम्र आत्म-संबोधन और वास्तविक बंधुआ सेवा—को हिन्दी में भी सुनाई देती है।
