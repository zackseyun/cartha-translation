  yaml_path: translation/ot/genesis/013/004.yaml
  text: to the place of the altar that he had made there at first[b][a]. And there Abram called on the name of Yahweh.
translation:
  language: hi
  text: उस वेदी के स्थान पर, जिसे उसने वहाँ पहले बनाया था। वहीं अब्राम ने याहवे के नाम से पुकारा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के नाम की घोषणा की” अथवा “याहवे को नाम लेकर पुकारा।” इस इब्रानी मुहावरे में आह्वान और घोषणा, दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם הַמִּזְבֵּחַ
  choice: वेदी के स्थान
  rationale: मूल के स्थान-सूचक पद और निश्चित 'वेदी' को स्वाभाविक हिंदी में निकटता से व्यक्त करता है; संदर्भ पहले बनाई गई वेदी का है।
- source_word: אֲשֶׁר עָשָׂה
  choice: जिसे उसने ... बनाया था
  rationale: עשה का मूल अर्थ 'बनाना' है; 'बनाया था' पूर्ववर्ती घटना को हिंदी कथा-क्रम में स्पष्ट करता है।
- source_word: שָׁם
  choice: वहाँ / वहीं
  rationale: मूल में दो बार आए स्थान-सूचक शब्द की पुनरावृत्ति बनाए रखी गई है; दूसरी बार 'वहीं' हिंदी में स्थान पर बल देता है।
- source_word: בָּרִאשֹׁנָה
  choice: पहले
  rationale: अब्राम की उस स्थान की पिछली यात्रा और वेदी-निर्माण की ओर संकेत करने वाला सहज आधुनिक हिंदी रूप।
- source_word: וַיִּקְרָא ... בְּשֵׁם
  choice: नाम को पुकारा
  rationale: यह अभिव्यक्ति प्रार्थनापूर्ण आह्वान और नाम की घोषणा—दोनों संभावित अर्थों को पूरी तरह किसी एक तक सीमित नहीं करती; अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाने वाला दैवी नाम; इसे केवल उपाधि 'प्रभु' से प्रतिस्थापित नहीं किया गया।
- source_word: אַבְרָם
  choice: अब्राम
  rationale: व्यक्तिवाचक नाम का प्रचलित हिंदी लिप्यंतरण।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत दैवी नाम YHWH है। मुख्य पाठ में हिंदी पाठकों के लिए परिचित नामरूप 'यहोवा' रखा गया है, न कि उसे केवल 'प्रभु' उपाधि से बदला गया।
- issue: קרא בשם יהוה मुहावरे का आशय
  choice: यहोवा के नाम को पुकारा
  alternative: यहोवा के नाम की घोषणा की; यहोवा को नाम लेकर पुकारा
  rationale: इब्रानी मुहावरा आह्वान, उपासना अथवा घोषणा का भाव रख सकता है। मुख्य पाठ अपेक्षाकृत खुला है और पादटिप्पणी वैकल्पिक अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। मूल में 'वहाँ' की पुनरावृत्ति को 'वहाँ/वहीं' से सुरक्षित रखा गया है। दैवी नाम के लिए हिंदी में परिचित 'यहोवा' अपनाया गया है।
