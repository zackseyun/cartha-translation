id: GEN.13.16
reference: Genesis 13:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י אֶֽת זַרְעֲ/ךָ֖ כַּ/עֲפַ֣ר הָ/אָ֑רֶץ אֲשֶׁ֣ר אִם יוּכַ֣ל אִ֗ישׁ לִ/מְנוֹת֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ גַּֽם זַרְעֲ/ךָ֖ יִמָּנֶֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/016.yaml
  text: And I will make your offspring like the dust of the earth[a], so that if a man can count the dust of the earth[b], then your offspring also can be counted.
translation:
  language: hi
  text: और मैं तुम्हारी सन्तान[a] को धरती की धूल के समान कर दूँगा। यदि कोई मनुष्य[b] धरती की धूल को गिन सके, तो तुम्हारी सन्तान भी गिनी जा सकेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘तुम्हारा बीज’; इब्रानी शब्द זֶרַע यहाँ सामूहिक अर्थ में सन्तान या वंशजों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘एक मनुष्य’; यहाँ पुल्लिंग एकवचन रूप का सामान्य अर्थ ‘कोई भी मनुष्य’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: और मैं ... कर दूँगा
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है, पर तुलना के साथ यहाँ इसका स्वाभाविक अर्थ किसी को वैसा ‘कर देना’ है। आरम्भिक וְ को ‘और’ से रखा गया है।
- source_word: זַרְעֲךָ
  choice: तुम्हारी सन्तान
  rationale: זֶרַע यहाँ अब्राम की भावी सन्तति के लिए प्रयुक्त सामूहिक संज्ञा है। ‘सन्तान’ आधुनिक हिन्दी में स्वाभाविक है और सामूहिक अर्थ बनाए रखती है।
- source_word: כַּעֲפַר הָאָרֶץ
  choice: धरती की धूल के समान
  rationale: यह मूल उपमा को सीधे सुरक्षित रखता है; ‘धरती’ सामान्य आधुनिक हिन्दी में הָאָרֶץ का स्वाभाविक रूप है।
- source_word: אֲשֶׁר אִם
  choice: यदि
  rationale: इस पदबंध से असम्भवता दर्शाने वाली शर्त आरम्भ होती है। हिन्दी में ‘यदि ... तो’ उसी संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אִישׁ
  choice: कोई मनुष्य
  rationale: אִישׁ पुल्लिंग एकवचन है, पर यहाँ उसका बल सामान्य मानवीय कर्ता पर है। ‘कोई मनुष्य’ मूल के एकवचन और सामान्य अर्थ दोनों को रखता है।
- source_word: לִמְנוֹת / יִמָּנֶה
  choice: गिन सके / गिनी जा सकेगी
  rationale: पहला रूप गिनने की सम्भावना और दूसरा कर्मवाच्य में गिने जा सकने की सम्भावना व्यक्त करता है; हिन्दी की संभावनार्थक रचना इस काल्पनिक शर्त को ठीक रखती है।
- source_word: גַּם
  choice: भी
  rationale: ‘भी’ धूल और सन्तान की गिनती के बीच मूल समानता को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अब्राहीमी प्रतिज्ञा में सामूहिक संज्ञा זֶרַע का अनुवाद
  choice: तुम्हारी सन्तान
  alternative: तुम्हारा बीज; तुम्हारे वंशज
  rationale: यहाँ शब्द असंख्य भावी सन्तति को एक सामूहिक इकाई के रूप में बताता है। ‘सन्तान’ उस सामूहिकता को सुरक्षित रखती है और इस पद में अनावश्यक रूप से केवल एक व्यक्ति या किसी विशेष मसीही अर्थ को आरोपित नहीं करती।
- issue: אִישׁ की सामान्य पुल्लिंग अभिव्यक्ति
  choice: कोई मनुष्य
  alternative: कोई पुरुष; कोई व्यक्ति
  rationale: मूल में पुल्लिंग एकवचन रूप सामान्य मानवीय अर्थ में आया है। ‘मनुष्य’ उसके व्याकरणिक एकवचन और सामान्य बल को रखता है, जबकि पादटिप्पणी उसका स्वरूप स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धरती की धूल’ मूल बिम्ब को बनाए रखता है, और ‘गिनी जा सकेगी’ शर्त की काल्पनिक सम्भावना को भविष्यवाणी की तरह कठोर बनाए बिना व्यक्त करता है।
