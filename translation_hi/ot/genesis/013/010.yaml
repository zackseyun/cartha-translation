id: GEN.13.10
reference: Genesis 13:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשָּׂא ל֣וֹט אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן כִּ֥י כֻלָּ֖/הּ מַשְׁקֶ֑ה לִ/פְנֵ֣י שַׁחֵ֣ת יְהוָ֗ה אֶת סְדֹם֙ וְ/אֶת עֲמֹרָ֔ה כְּ/גַן יְהוָה֙ כְּ/אֶ֣רֶץ מִצְרַ֔יִם בֹּאֲ/כָ֖ה צֹֽעַר־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/010.yaml
  text: Lot lifted up his eyes and saw all the plain of the Jordan[a], that all of it was well watered before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt[d][c][b], as you go toward Zoar.
translation:
  language: hi
  text: लूत ने आँखें उठाकर यरदन का सारा मैदान देखा[a]। याहवे के सदोम और अमोरा को नष्ट करने से पहले वह पूरा इलाका पानी से भरपूर था—याहवे की वाटिका[b] के समान और मिस्र देश के समान—सोअर की दिशा में[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यरदन की सारी घाटी’; अधिक शाब्दिक रूप में, ‘यरदन का सारा घेरा’।
    reason: כִּכָּר के भौगोलिक अर्थ की वास्तविक वैकल्पिक सम्भावनाएँ।
  - marker: b
    text: ‘याहवे की वाटिका’ सम्भवतः अदन की वाटिका की हरी-भरी समृद्धि की ओर संकेत करती है।
    reason: सम्भावित अंतर्पाठीय संकेत को मुख्य पाठ में निश्चित किए बिना समझाना।
  - marker: c
    text: अधिक शाब्दिक रूप में, ‘सोअर को आते हुए’ अथवा ‘सोअर की ओर जाते हुए’; इब्रानी अभिव्यक्ति सोअर की दिशा बताती है।
    reason: दिशासूचक इब्रानी मुहावरे का रूप और वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  choice: आँखें उठाकर
  rationale: यह दृष्टि किसी ओर लगाने का इब्रानी मुहावरा है। हिन्दी में ‘आँखें उठाकर’ मूल कथन की छवि और स्वाभाविकता दोनों बनाए रखता है।
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: यरदन का सारा मैदान
  rationale: כִּכָּר यहाँ यरदन से जुड़ा गोलाकार मैदानी क्षेत्र अथवा घाटी सूचित करता है। ‘मैदान’ सुबोध भौगोलिक अर्थ देता है, जबकि अन्य सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: כִּי כֻלָּהּ מַשְׁקֶה
  choice: वह पूरा इलाका पानी से भरपूर था
  rationale: מַשְׁקֶה क्षेत्र के भली-भाँति जलयुक्त होने का वर्णन करता है। ‘पानी से भरपूर’ प्राकृतिक हिन्दी है और कृत्रिम सिंचाई का अनावश्यक संकेत नहीं देता।
- source_word: לִפְנֵי שַׁחֵת יְהוָה
  choice: याहवे के ... नष्ट करने से पहले
  rationale: לִפְנֵי कालगत ‘पहले’ और שׁחת नगरों के विनाश को व्यक्त करता है। हिन्दी रचना कर्ता याहवे को स्पष्ट रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिवाचक नाम יהוה है; उसे उपाधि से बदलने के बजाय हिन्दी लिपि में ‘याहवे’ लिखा गया है।
- source_word: כְּגַן יְהוָה
  choice: याहवे की वाटिका के समान
  rationale: ‘वाटिका’ גַּן की हरी-भरी, लगाई गई बारी की छवि और अदन से सम्भावित अंतर्पाठीय सम्बन्ध को बनाए रखती है।
- source_word: כְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश के समान
  rationale: ‘देश’ אֶרֶץ को व्यक्त करता है और भौगोलिक तुलना को स्पष्ट रखता है।
- source_word: בֹּאֲכָה צֹעַר
  choice: सोअर की दिशा में
  rationale: यह इब्रानी अभिव्यक्ति सोअर की ओर दिशा अथवा पहुँच को चिह्नित करती है। मुख्य पाठ में स्वाभाविक हिन्दी दी गई है और शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार अक्षरों वाला व्यक्तिवाचक ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: ‘याहवे की वाटिका’ का संकेत
  choice: वाक्यांश को ज्यों का त्यों रखते हुए अदन की सम्भावित प्रतिध्वनि पादटिप्पणी में बताना
  alternative: मुख्य पाठ में ‘अदन की वाटिका’ कहना
  rationale: मूल में ‘अदन’ नाम नहीं है, यद्यपि उत्पत्ति के पहले के वर्णन के कारण उसका संकेत सम्भावित है। इसलिए संकेत को स्पष्ट पाठ में बदलना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। ‘आँखें उठाकर’ जैसी मूल कथात्मक छवि रखी गई है, पर वाक्य को हिन्दी में स्पष्ट करने के लिए दो वाक्यों में बाँटा गया है। तुलना और दिशासूचक अंतिम पदबंध की कुछ संरचनात्मक अस्पष्टता डैशों तथा पादटिप्पणी के सहारे सुरक्षित रखी गई है।
