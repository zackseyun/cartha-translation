lexical_decisions:
- source_word: וְגַם
  choice: और ... भी
  rationale: संयोजक और योगवाचक बल दोनों को रखते हुए यह पिछले पद से संबंध और लूत की संपत्ति का अतिरिक्त उल्लेख स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְלוֹט ... הָיָה
  choice: लूत के पास ... थे
  rationale: हिब्रू का अस्तित्ववाचक स्वामित्व-विन्यास शाब्दिक रूप से ‘लूत के लिए थे’ है; आधुनिक हिंदी में ‘लूत के पास ... थे’ उसका स्वाभाविक समतुल्य है।
- source_word: הַהֹלֵךְ אֶת־אַבְרָם
  choice: जो अब्राम के साथ गया था
  rationale: कृदंत लूत को अब्राम के साथ चलनेवाले व्यक्ति के रूप में पहचानता है; यह रूप कथात्मक प्रसंग में साथ जाने के अर्थ को सहजता से व्यक्त करता है।
- source_word: צֹאן
  choice: भेड़-बकरियों के झुंड
  rationale: यह शब्द छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, का सामूहिक बोध कराता है; स्पष्ट आधुनिक हिंदी के लिए दोनों का उल्लेख उपयुक्त है।
- source_word: וּבָקָר
  choice: गाय-बैल
  rationale: यह गोवंशीय पशुओं का सामूहिक शब्द है; ‘गाय-बैल’ सामान्य हिंदी में इसके व्यापक पशुधन-संबंधी अर्थ को स्पष्ट करता है।
- source_word: וְאֹהָלִים
  choice: और तंबू
  rationale: बहुवचन संज्ञा का सीधा और स्वाभाविक हिंदी रूप है।
