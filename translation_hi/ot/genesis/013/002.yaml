lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: अब्राम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है। आरंभिक ו पिछले वृत्तांत से संबंध जोड़ता है, पर आधुनिक हिन्दी में यहाँ ‘और’ को व्यक्त न करना अधिक स्वाभाविक है; वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- source_word: כָּבֵד
  choice: धनी
  rationale: इसका मूल अर्थ ‘भारी’ है, किंतु पशुधन, चाँदी और सोने के संदर्भ में यह मुहावरे के रूप में बहुत संपत्ति होने का बोध कराता है। इसलिए ‘धनी’ स्पष्ट और स्वाभाविक है।
- source_word: מְאֹד
  choice: बहुत
  rationale: यह अब्राम की समृद्धि की मात्रा को तीव्र करता है; ‘बहुत’ आधुनिक हिन्दी का सहज समतुल्य है।
- source_word: בַּ/מִּקְנֶה
  choice: पशुधन से
  rationale: מִקְנֶה यहाँ मुख्यतः पाले हुए पशुओं—झुंडों और रेवड़ों—के रूप में संपत्ति को दर्शाता है। ‘पशुधन’ इस अर्थ को व्यापक और सटीक रूप से व्यक्त करता है।
- source_word: בַּ/כֶּסֶף
  choice: चाँदी से
  rationale: כֶּסֶף का ठोस अर्थ यहाँ ‘चाँदी’ है। हिन्दी में संयुक्त संरचना ‘पशुधन, चाँदी और सोने से धनी’ संपन्नता की श्रेणियों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: וּ/בַ/זָּהָב
  choice: और सोने से
  rationale: यह संपत्ति की अंतिम श्रेणी को समन्वित करता है। हिन्दी वाक्य में ‘से’ साझा रूप से तीनों संज्ञाओं पर लागू होता है।
