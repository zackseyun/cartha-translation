  text: अब्राम[a] पशुधन, चाँदी और सोने से बहुत धनी था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अब्राम पशुधन, चाँदी और सोने से बहुत धनी था।”
