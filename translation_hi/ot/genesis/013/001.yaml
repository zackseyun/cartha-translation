    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ऊपर गया
  rationale: עלה का मूल अर्थ ‘ऊपर जाना’ है। मिस्र से प्रतिज्ञात देश की ओर यात्रा के बाइबलीय भौगोलिक मुहावरे को बनाए रखने के लिए ‘ऊपर गया’ रखा गया है।
- source_word: מִמִּצְרַיִם
  choice: मिस्र से
  rationale: पूर्वसर्ग מן और स्थाननाम का सीधा तथा स्वाभाविक हिन्दी अनुवाद।
- source_word: הוּא וְאִשְׁתּוֹ
  choice: वह, उसकी पत्नी
  rationale: स्वतंत्र सर्वनाम के स्पष्टकारी बल को सूची की स्वाभाविक हिन्दी संरचना में सुरक्षित रखा गया है।
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: उसका सब कुछ
  rationale: यह व्यापक अभिव्यक्ति केवल भौतिक सम्पत्ति तक सीमित नहीं है; ‘उसका सब कुछ’ मूल की व्यापकता बनाए रखता है।
- source_word: וְלוֹט עִמּוֹ
  choice: और उसके साथ लूत भी
  rationale: लूत के सहयात्री होने की बाद में जोड़ी गई सूचना को सहज हिन्दी में व्यक्त करता है।
- source_word: הַנֶּגְבָּה
  choice: नेगेव की ओर
  rationale: נֶגֶב यहाँ दक्षिणी भूभाग के स्थाननाम के रूप में समझा जा सकता है, जबकि दिशासूचक ה को ‘की ओर’ व्यक्त करता है। सामान्य अर्थ ‘दक्षिण की ओर’ पादटिप्पणी में सुरक्षित है।
