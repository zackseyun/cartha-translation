  text: וַֽ/יְהִי רִ֗יב בֵּ֚ין רֹעֵ֣י מִקְנֵֽה אַבְרָ֔ם וּ/בֵ֖ין רֹעֵ֣י מִקְנֵה ל֑וֹט וְ/הַֽ/כְּנַעֲנִי֙ וְ/הַ/פְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
translation:
  language: hi
  text: और अब्राम के पशुधन के चरवाहों और लूत के पशुधन के चरवाहों के बीच झगड़ा हो गया। उस समय कनानी और परिज्जी[a] उस देश में बसे हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कनानी और परिज्जी लोग’। इब्रानी में दोनों जातिनाम एकवचन रूप में हैं, पर उनका अर्थ सामूहिक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: हो गया
  rationale: यहाँ वय्यिक्तोल कथानक में एक नई घटना सामने लाता है। ‘हो गया’ स्वाभाविक हिन्दी में झगड़े के उत्पन्न होने को व्यक्त करता है।
- source_word: רִיב
  choice: झगड़ा
  rationale: यह संज्ञा विवाद या आपसी संघर्ष को दर्शाती है। ‘झगड़ा’ साधारण आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: רֹעֵי
  choice: चरवाहों
  rationale: शब्द पशुओं की देखभाल करने वालों के लिए है। हिन्दी में ‘चरवाहे’ भेड़ों तक सीमित न होकर पशुधन की रखवाली करने वालों के लिए स्वाभाविक रूप से प्रयुक्त हो सकता है।
- source_word: מִקְנֵה
  choice: पशुधन
  rationale: यह पालतू पशुओं के झुंडों का व्यापक बोध देता है; ‘पशुधन’ गाय-बैल तक सीमित नहीं है और आधुनिक हिन्दी में सटीक है।
- source_word: בֵּין ... וּבֵין
  choice: के ... और ... के बीच
  rationale: यह दोनों अलग पक्षों के बीच हुए संघर्ष की द्विपक्षीय रचना को बनाए रखता है।
- source_word: וְהַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: कनानी और परिज्जी
  rationale: इब्रानी में दोनों जातिनाम व्याकरणतः एकवचन हैं, पर सामूहिक अर्थ रखते हैं। हिन्दी में जातिनामों को इसी रूप में रखकर सामूहिक अर्थ स्वाभाविक रूप से व्यक्त किया जा सकता है।
- source_word: אָז
  choice: उस समय
  rationale: यह कथानक के उसी काल की ओर संकेत करता है और हिन्दी में वाक्य के आरम्भ में स्वाभाविक है।
- source_word: יֹשֵׁב
  choice: बसे हुए थे
  rationale: कृदन्त उस समय जारी निवास की स्थिति बताता है। सामूहिक संयुक्त कर्ता के कारण बहुवचन ‘थे’ अर्थानुकूल और स्वाभाविक है।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: निश्चित उपपद वाले ‘देश/भूमि’ को प्रसंगगत निश्चितता सहित व्यक्त करता है। ‘उस देश’ आधुनिक हिन्दी में स्वाभाविक है और पहले से उल्लिखित कनान-प्रदेश की ओर संकेत करता है।
theological_decisions:
- issue: הָאָרֶץ में संभावित वाचा-संबंधी अर्थछाया
  choice: उस देश में
  alternative: उस भूमि में
  rationale: यह पद मुख्यतः भौगोलिक वर्णन है, फिर भी निश्चितता बनाए रखने के लिए ‘उस’ रखा गया है। ‘देश’ सामान्य पाठक के लिए स्वाभाविक है और मूल में निहित से अधिक धर्मवैज्ञानिक अर्थ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘पशुधन’ व्यापक पशु-संपत्ति को और ‘बसे हुए थे’ उस समय जारी निवास को व्यक्त करता है। जातिनामों का लिप्यंतरण प्रचलित हिन्दी बाइबलीय रूपों के अनुसार है।
