id: GEN.13.9
reference: Genesis 13:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/לֹ֤א כָל הָ/אָ֨רֶץ֙ לְ/פָנֶ֔י/ךָ הִפָּ֥רֶד נָ֖א מֵ/עָלָ֑/י אִם הַ/שְּׂמֹ֣אל וְ/אֵימִ֔נָה וְ/אִם הַ/יָּמִ֖ין וְ/אַשְׂמְאִֽילָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/009.yaml
  text: Is not the whole land before you? Please separate from me. If you go to the left[a], then I will go to the right; and if you go to the right, then I will go to the left.
translation:
  language: hi
  text: क्या सारा देश तेरे सामने नहीं है? कृपया मुझसे अलग हो जा। यदि तू बाईं ओर जाए[a], तो मैं दाईं ओर जाऊँगा; और यदि तू दाईं ओर जाए, तो मैं बाईं ओर जाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में दोनों शर्तवाले वाक्य संक्षिप्त हैं; शब्दशः, “यदि बाईं ओर, तो मैं दाईं ओर जाऊँगा; और यदि दाईं ओर, तो मैं बाईं ओर जाऊँगा।” स्पष्ट हिंदी के लिए “तू ... जाए” जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं है?
  rationale: यह सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है; हिंदी में ‘क्या ... नहीं’ उसका स्वाभाविक और स्पष्ट रूप है।
- source_word: כָל הָאָרֶץ
  choice: सारा देश
  rationale: संदर्भ में אָרֶץ बसने के लिए उपलब्ध भूभाग को दर्शाता है, पूरी पृथ्वी को नहीं। ‘सारा देश’ वर्तमान हिंदी में सहज और संदर्भानुकूल है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: यह उस भूभाग के लूत के सामने उपलब्ध होने का स्थान-संबंधी चित्र बनाए रखता है।
- source_word: הִפָּרֶד נָא מֵעָלַי
  choice: कृपया मुझसे अलग हो जा
  rationale: निफ़अल आज्ञार्थक הִפָּרֶד अलग होने का निर्देश देता है और נָא अनुरोध को विनम्र बनाता है; ‘कृपया’ इसी भाव को व्यक्त करता है।
- source_word: אִם הַשְּׂמֹאל
  choice: यदि तू बाईं ओर जाए
  rationale: इब्रानी वाक्यांश संक्षिप्त और क्रियारहित है। स्पष्ट, स्वाभाविक हिंदी के लिए संदर्भ से न्यूनतम गति-क्रिया ‘जाए’ जोड़ी गई है।
- source_word: וְאֵימִנָה
  choice: तो मैं दाईं ओर जाऊँगा
  rationale: दिशासूचक रूप दाईं ओर गति को दर्शाता है; यह चयन शर्त और उत्तर की समानांतर संरचना सुरक्षित रखता है।
- source_word: וְאִם הַיָּמִין
  choice: और यदि तू दाईं ओर जाए
  rationale: पहली शर्त की तरह मूल में क्रिया निहित है; हिंदी में स्पष्टता के लिए ‘जाए’ जोड़ा गया है।
- source_word: וְאַשְׂמְאִילָה
  choice: तो मैं बाईं ओर जाऊँगा
  rationale: दिशासूचक रूप अब्राम की विपरीत दिशा में गति को व्यक्त करता है और प्रस्ताव का संतुलन बनाए रखता है।
