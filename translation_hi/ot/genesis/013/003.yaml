  yaml_path: translation/ot/genesis/013/003.yaml
  text: And he journeyed by stages from the Negev as far as Bethel[a], to the place where his tent had been at the beginning, between Bethel and Ai.
translation:
  language: hi
  text: वह नेगेव से पड़ाव-दर-पड़ाव[a] बेतेल तक, उस स्थान तक गया जहाँ पहले उसका तम्बू था—बेतेल और ऐ के बीच।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने यात्रा-चरणों के अनुसार,” अर्थात् वह एक पड़ाव से दूसरे पड़ाव की ओर बढ़ता गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: वह ... चलते हुए ... पहुँचा
  rationale: הלך सामान्यतः ‘जाना/चलना’ है; यात्रा-वृत्तांत में हिन्दी का यह वाक्य-विन्यास दूरी तय करने और गन्तव्य पर पहुँचने—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְמַסָּעָיו
  choice: पड़ाव-दर-पड़ाव
  rationale: מַסָּע शिविर उठाकर आगे बढ़ने अथवा यात्रा के एक चरण को सूचित करता है। बहुवचन और לְ यहाँ क्रमिक चरणों में यात्रा का भाव देते हैं; ‘पड़ाव-दर-पड़ाव’ इसे सामान्य हिन्दी में स्पष्ट रखता है।
- source_word: מִנֶּגֶב
  choice: नेगेव से
  rationale: पितृकालीन भौगोलिक सन्दर्भ में נֶגֶב को केवल ‘दक्षिण’ की अपेक्षा क्षेत्रनाम ‘नेगेव’ समझना अधिक उपयुक्त है।
- source_word: וְעַד בֵּית אֵל
  choice: बेतेल तक
  rationale: עַד यात्रा की सीमा या गन्तव्य बताता है; ‘तक’ इसका संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: עַד הַמָּקוֹם
  choice: उस स्थान पर पहुँचा
  rationale: दूसरा עַד गन्तव्य को और निश्चित करता है। हिन्दी में पहले ‘तक’ को दुहराने की अपेक्षा ‘उस स्थान पर पहुँचा’ प्रवाहपूर्ण है।
- source_word: אֲשֶׁר הָיָה שָׁם אהלֹה
  choice: जहाँ ... उसका तम्बू था
  rationale: שָׁם को ‘जहाँ’ में स्वाभाविक रूप से समाहित किया गया है। पूर्वकालिकता आगे के בַּתְּחִלָּה से स्पष्ट है, इसलिए हिन्दी में साधारण भूतकाल पर्याप्त है।
- source_word: בַּתְּחִלָּה
  choice: आरम्भ में
  rationale: यह अब्राम के पहले वाले पड़ाव की ओर संकेत करता है; ‘आरम्भ में’ मूल के कालगत संकेत को सीधे बनाए रखता है।
- source_word: בֵּין בֵּית אֵל וּבֵין הָעָי
  choice: बेतेल और ऐ के बीच
  rationale: בֵּין ... וּבֵין दो स्थानों के मध्य की स्थिति बताता है। הָעָי स्थाननाम है; हिन्दी में उसका रूप ‘ऐ’ रखा गया है।
