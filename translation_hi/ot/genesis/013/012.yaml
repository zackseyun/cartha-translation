  yaml_path: translation/ot/genesis/013/012.yaml
  text: Abram lived in the land of Canaan[a], and Lot lived in the cities of the plain and pitched his tents as far as Sodom.
translation:
  language: hi
  text: अब्राम कनान देश में रहता था, और लूत मैदान के नगरों में रहता था; उसने सदोम तक अपना डेरा डाला[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सदोम तक अपना डेरा बढ़ाता गया।” इब्रानी क्रिया का अर्थ डेरा डालना या तंबू में निवास करना हो सकता है। यहाँ भाव यह है कि लूत का पड़ाव सदोम तक फैला था; यह आवश्यक नहीं कि वह इस समय नगर के भीतर रहता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: रहने लगा
  rationale: यह क्रिया निवास करने या बसने का भाव देती है। प्रसंग में दोनों पुरुषों के अलग-अलग क्षेत्रों में निवास स्थापित करने को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: אֶרֶץ को ‘देश’ के रूप में स्पष्ट रखते हुए हिन्दी की स्वाभाविक शब्द-व्यवस्था अपनाई गई है।
- source_word: בְּעָרֵי הַכִּכָּר
  choice: तराई के नगरों में
  rationale: כִּכָּר यहाँ यरदन क्षेत्र की समतल, नीची भूमि को सूचित करता है। ‘तराई’ प्रचलित, संक्षिप्त और प्रसंगानुकूल हिन्दी है।
- source_word: וַיֶּאֱהַל
  choice: अपने डेरे फैलाता गया
  rationale: אהל की क्रिया तंबू गाड़ने अथवा तंबुओं में पड़ाव डालने को दर्शाती है। क्रमिक गमन के प्रसंग में यह पदबंध लूत के पड़ाव का सदोम की दिशा में बढ़ना स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַד סְדֹם
  choice: सदोम तक
  rationale: עַד स्थानगत सीमा या विस्तार बताता है। ‘सदोम तक’ इस सीमा को बनाए रखता है, पर अपने आप यह दावा नहीं करता कि लूत इसी चरण में नगर के भीतर बस गया था।
- source_word: אַבְרָם
  choice: अब्राम
  rationale: व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
- source_word: לוֹט
  choice: लूत
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: סְדֹם
  choice: सदोम
  rationale: स्थाननाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
