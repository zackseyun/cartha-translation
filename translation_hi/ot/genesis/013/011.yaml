source:
  edition: WLC
  text: וַ/יִּבְחַר ל֣/וֹ ל֗וֹט אֵ֚ת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן וַ/יִּסַּ֥ע ל֖וֹט מִ/קֶּ֑דֶם וַ/יִּפָּ֣רְד֔וּ אִ֖ישׁ מֵ/עַ֥ל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/011.yaml
  text: So Lot chose for himself all the plain of the Jordan[a], and Lot journeyed eastward; and they separated from each other.
translation:
  language: hi
  text: तब लूत ने अपने लिए यरदन का सारा मैदान चुन लिया, और लूत पूर्व की ओर चल पड़ा[a]। वे एक-दूसरे से अलग हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूर्व से।” इब्रानी वाक्यांश यात्रा की दिशा अथवा प्रस्थान का स्थान—दोनों बता सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ לוֹט
  choice: लूत ने अपने लिए ... चुन लिया
  rationale: בחר का अर्थ ‘चुनना’ है, और לוֹ को ‘अपने लिए’ के रूप में स्पष्ट रखा गया है। ‘चुन लिया’ हिन्दी की स्वाभाविक कथात्मक अभिव्यक्ति है।
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: यरदन का सारा मैदान
  rationale: כִּכָּר यहाँ यरदन के आसपास के समतल भूभाग को सूचित करता है। ‘मैदान’ सामान्य पाठक के लिए स्वाभाविक है और भौगोलिक अर्थ को बनाए रखता है।
- source_word: וַיִּסַּע
  choice: चल पड़ा
  rationale: נסע में पड़ाव उठाकर आगे यात्रा आरम्भ करने का भाव है; ‘चल पड़ा’ आधुनिक हिन्दी में इस कथात्मक गति को सहज रूप से व्यक्त करता है।
- source_word: מִקֶּדֶם
  choice: पूर्व की ओर
  rationale: संदर्भ में इसे यात्रा की दिशा बताने वाला माना गया है; फिर भी ‘पूर्व से’ का व्याकरणतः सम्भव अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיִּפָּרְדוּ אִישׁ מֵעַל אָחִיו
  choice: वे एक-दूसरे से अलग हो गए
  rationale: निफ़अल क्रिया पारस्परिक अलगाव व्यक्त करती है। इब्रानी का वितरणात्मक मुहावरा शाब्दिक रूप से ‘एक जन अपने भाई से’ है, जिसका स्वाभाविक हिन्दी समतुल्य ‘एक-दूसरे से’ है; प्रसंग में दोनों रिश्तेदार हैं।
theological_decisions:
- issue: מִקֶּדֶם की दिशासूचक अस्पष्टता
  choice: पूर्व की ओर
  alternative: पूर्व से
  rationale: अब्राम और लूत के भूगोल के संदर्भ में पूर्व की ओर जाना अधिक सुसंगत है, पर मूल वाक्यांश उद्गम-बिंदु भी बता सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: बंधुत्व-सूचक भाषा אִישׁ מֵעַל אָחִיו
  choice: एक-दूसरे से
  alternative: हर एक अपने भाई से
  rationale: यह इब्रानी वितरणात्मक मुहावरा यहाँ पारस्परिक अलगाव बताता है। स्वाभाविक हिन्दी में ‘एक-दूसरे से’ वही अर्थ देता है, जबकि ‘भाई’ को शाब्दिक रूप से रखने पर चाचा-भतीजे के इस प्रसंग में अनावश्यक भ्रम हो सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इस प्रकार’ दूसरे खंड को पहले निर्णय के परिणाम से जोड़ता है। पादटिप्पणी का चिह्न उसी अस्पष्ट पद के तुरंत बाद रखा गया है।
