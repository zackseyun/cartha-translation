reference: Genesis 13:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יהוָ֞ה אָמַ֣ר אֶל אַבְרָ֗ם אַחֲרֵי֙ הִפָּֽרֶד ל֣וֹט מֵֽ/עִמּ֔/וֹ שָׂ֣א נָ֤א עֵינֶ֨י/ךָ֙ וּ/רְאֵ֔ה מִן הַ/מָּק֖וֹם אֲשֶׁר אַתָּ֣ה שָׁ֑ם צָפֹ֥נָ/ה וָ/נֶ֖גְבָּ/ה וָ/קֵ֥דְמָ/ה וָ/יָֽמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/014.yaml
  text: 'And Yahweh said to Abram[a], after Lot had separated from him, “Please lift up your eyes and look from the place where you are: northward and southward and eastward and westward.”'
translation:
  language: hi
  text: लूत के अब्राम से अलग हो जाने के बाद, याहवे[a] ने अब्राम से कहा, “ज़रा अपनी आँखें उठाओ और जिस स्थान पर तुम हो, वहाँ से उत्तर, दक्षिण, पूर्व और पश्चिम की ओर देखो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का विशिष्ट नाम יְהוָה (YHWH) है, जिसे यहाँ “याहवे” लिखा गया है।
    reason: ईश्वरीय नाम के मूल रूप को स्पष्ट करना।
lexical_decisions:
- source_word: וַיהוָה
  choice: याहवे ने
  rationale: वाचा के विशेष ईश्वरीय नाम יְהוָה को ‘याहवे’ के रूप में लिप्यंतरित किया गया है। आरंभिक וַ को हिंदी की स्वाभाविक कथात्मक रचना में अलग से ‘और’ कहना आवश्यक नहीं है।
- source_word: אַחֲרֵי הִפָּרֶד לוֹט מֵעִמּוֹ
  choice: लूत के उससे अलग हो जाने के बाद
  rationale: यह रचना बाद के समय को सूचित करती है; निफ़ाल रूप यहाँ लूत के अब्राम से अलग होने का अकर्मक भाव देता है।
- source_word: שָׂא נָא עֵינֶיךָ
  choice: ज़रा अपनी आँखें उठाओ
  rationale: ‘आँखें उठाना’ मूल मुहावरे को बनाए रखता है और נָא की विनम्र, नरम आग्रहसूचक छाया को ‘ज़रा’ व्यक्त करता है।
- source_word: וּרְאֵה
  choice: और ... देखो
  rationale: आज्ञार्थक क्रिया उस भूमि की ओर दृष्टि करने के निमंत्रण को सीधे व्यक्त करती है।
- source_word: מִן הַמָּקוֹם אֲשֶׁר אַתָּה שָׁם
  choice: जिस स्थान पर तुम हो, वहाँ से
  rationale: यह अब्राम के देखने के स्थान को स्वाभाविक हिंदी में व्यक्त करता है और שָׁם के स्थानवाचक अर्थ को ‘वहाँ’ से स्पष्ट रखता है।
- source_word: צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה
  choice: उत्तर, दक्षिण, पूर्व और पश्चिम की ओर
  rationale: दिशासूचक -ה का भाव ‘की ओर’ से व्यक्त होता है; दिशाओं का क्रम मूल पाठ के अनुरूप रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला विशिष्ट ईश्वरीय नाम है। ‘याहवे’ उसका निकट लिप्यंतरण है और नाम तथा उपाधि के भेद को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ज़रा’ נָא के विनम्र आग्रह को बोलचाल की अत्यधिक अनौपचारिकता के बिना व्यक्त करता है; दिशाओं का क्रम और ‘आँखें उठाओ’ का मूल मुहावरा सुरक्षित रखा गया है।
