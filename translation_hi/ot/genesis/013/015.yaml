  yaml_path: translation/ot/genesis/013/015.yaml
  text: For all the land that you see[a], I will give to you and to your offspring forever.
translation:
  language: hi
  text: क्योंकि जो सारी भूमि तुम देख रहे हो, उसे मैं तुम्हें और तुम्हारी संतान[a] को सदा के लिए दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बीज।” इब्रानी शब्द זֶרַע एक समूहवाचक संज्ञा है, जिसका अर्थ “बीज,” “संतान,” या “वंशज” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आदेश के बाद आने वाली प्रतिज्ञा का आधार अथवा स्पष्टीकरण प्रस्तुत करता है। आधुनिक हिन्दी में ‘क्योंकि’ इस संयोजक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל הָאָרֶץ אֲשֶׁר אַתָּה רֹאֶה
  choice: तुम जितनी भी भूमि देख रहे हो, वह सब
  rationale: यह अभिव्यक्ति दृष्टिगोचर सम्पूर्ण भूमि पर बल देती है। हिन्दी में यह संरचना मूल के व्यापक अर्थ को स्पष्ट और स्वाभाविक ढंग से रखती है।
- source_word: לְךָ אֶתְּנֶנָּה
  choice: मैं तुम्हें ... दूँगा
  rationale: נתן का अपूर्ण रूप यहाँ भविष्य की ईश्वरीय प्रतिज्ञा व्यक्त करता है और לְךָ पाने वाले को सूचित करता है।
- source_word: וּלְזַרְעֲךָ
  choice: और तुम्हारी सन्तान को
  rationale: זֶרַע एक समूहवाचक संज्ञा है, जिसका अर्थ सन्तान अथवा वंशज हो सकता है। ‘सन्तान’ आधुनिक हिन्दी में स्वाभाविक है और इसकी समूहवाचक खुलावट को बनाए रखता है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: यह दीर्घस्थायी अथवा निरन्तर अवधि व्यक्त करता है। ‘सदा के लिए’ प्रतिज्ञा के प्रबल कालगत अर्थ को बिना किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था को आरोपित किए सुरक्षित रखता है।
theological_decisions:
- issue: भूमि की प्रतिज्ञा में עַד עוֹלָם की अवधि
  choice: सदा के लिए
  alternative: युगों तक; निरन्तर
  rationale: मूल वाक्यांश स्थायी, अनिश्चित रूप से दीर्घ अथवा चिरस्थायी अवधि का संकेत दे सकता है। ‘सदा के लिए’ यहाँ उसके सामान्य और प्रबल अर्थ को रखता है, जबकि उसके व्यापक वाचागत या अन्तकाल-सम्बन्धी अर्थ का निर्णय पाठक और प्रसंग पर छोड़ता है।
- issue: זֶרַע की संख्या और सामूहिकता
  choice: सन्तान
  alternative: बीज; वंशज
  rationale: ‘सन्तान’ एक व्यक्ति या सामूहिक वंश दोनों की सम्भावना खुली रख सकता है। इससे पाठ को केवल बहुवचन ‘वंशजों’ तक सीमित नहीं किया जाता और न ही उससे कोई विशिष्ट मसीही या वाचागत निष्कर्ष अनुवाद में आरोपित होता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम जितनी भी भूमि देख रहे हो, वह सब’ हिन्दी की स्वाभाविक वाक्यरचना में मूल के ‘सारी भूमि जिसे तुम देखते हो’ का व्यापक बल व्यक्त करता है।
