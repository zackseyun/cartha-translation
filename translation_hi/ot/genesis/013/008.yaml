source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל ל֗וֹט אַל נָ֨א תְהִ֤י מְרִיבָה֙ בֵּינִ֣/י וּ/בֵינֶ֔י/ךָ וּ/בֵ֥ין רֹעַ֖/י וּ/בֵ֣ין רֹעֶ֑י/ךָ כִּֽי אֲנָשִׁ֥ים אַחִ֖ים אֲנָֽחְנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/008.yaml
  text: So Abram said to Lot[a], “Please, let there be no strife between me and you, and between my herdsmen and your herdsmen[b], for we are kinsmen.”
translation:
  language: hi
  text: तब अब्राम ने लूत से कहा, “कृपया मेरे और तुम्हारे बीच, और मेरे चरवाहों और तुम्हारे चरवाहों के बीच कोई झगड़ा न हो, क्योंकि हम भाई-बन्धु हैं[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “हम पुरुष, भाई हैं।” यहाँ “भाई” का अर्थ निकट सम्बन्धी या एक ही कुल के लोग भी हो सकता है।
    reason: इब्रानी אֲנָשִׁים אַחִים के दोनों शब्दों तथा ‘भाई’ के व्यापक नातेदारी-सूचक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब अब्राम ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אַל נָא תְהִי מְרִיבָה
  choice: कृपया ... कोई झगड़ा न हो
  rationale: אַל के साथ इच्छार्थक क्रिया निषेधात्मक विनती व्यक्त करती है और נָא उसे नम्र बनाता है। ‘झगड़ा’ מְרִיבָה के विवाद और आपसी टकराव के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: בֵּינִי וּבֵינֶיךָ ... וּבֵין רֹעַי וּבֵין רֹעֶיךָ
  choice: मेरे और तुम्हारे बीच, और मेरे चरवाहों और तुम्हारे चरवाहों के बीच
  rationale: दोनों पक्षों के बीच संबंध बताने वाली दोहराई गई संरचना को स्पष्ट रूप से बनाए रखा गया है।
- source_word: רֹעַי ... רֹעֶיךָ
  choice: मेरे चरवाहों ... तुम्हारे चरवाहों
  rationale: רעה से बने ये रूप पशुओं को चराने और उनकी देखभाल करने वालों के लिए हैं; ‘चरवाहे’ हिन्दी में व्यापक और स्वाभाविक पद है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अब्राम की विनती का कारण प्रस्तुत करता है।
- source_word: אֲנָשִׁים אַחִים אֲנָחְנוּ
  choice: हम भाई-बन्धु हैं
  rationale: यह स्वाभाविक हिन्दी में उनकी निकट पारिवारिक नातेदारी व्यक्त करता है और ‘भाई’ की मूल छवि भी बनाए रखता है; אֲנָשִׁים को अलग से ‘पुरुष’ कहने पर हिन्दी वाक्य अस्वाभाविक और अर्थ से अधिक विश्लेषणात्मक हो जाता।
theological_decisions:
- issue: अब्राम और लूत के लिए אַחִים का अर्थ
  choice: भाई-बन्धु
  alternative: भाई; निकट सम्बन्धी; एक ही परिवार के लोग
  rationale: लूत अब्राम का सगा भाई नहीं, उसका भतीजा था; फिर भी इब्रानी ‘भाई’ व्यापक पारिवारिक नातेदारी को भी व्यक्त कर सकता है। ‘भाई-बन्धु’ मूल रूपक और प्रसंगगत अर्थ दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और मौखिक पठन में सहज रखी गई है। अब्राम की नम्र अपील को ‘कृपया’ से व्यक्त किया गया है और मूल की दोहराई हुई ‘बीच’ संरचना को स्पष्टता के लिए बनाए रखा गया है।
