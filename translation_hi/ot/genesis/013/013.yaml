source:
  edition: WLC
  text: וְ/אַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים וְ/חַטָּאִ֑ים לַ/יהוָ֖ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/013.yaml
  text: The men of Sodom were exceedingly wicked and sinful against Yahweh[a].
translation:
  language: hi
  text: सदोम के पुरुष अत्यन्त दुष्ट और याहवे[a] के विरुद्ध पापी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के सामने।”
    reason: לַיהוָה का अर्थ यहाँ अपराध के लक्ष्य के रूप में “याहवे के विरुद्ध” या उनकी दृष्टि में “याहवे के सामने” हो सकता है।
lexical_decisions:
- source_word: וְאַנְשֵׁי סְדֹם
  choice: सदोम के पुरुष
  rationale: אַנְשֵׁי, אִישׁ का संबंधकारक बहुवचन रूप है और यहाँ सदोम के पुरुष निवासियों को सूचित करता है। आरम्भिक וְ प्रसंग को जोड़ता है, पर आधुनिक हिन्दी में अलग से “और” जोड़ना आवश्यक नहीं है।
- source_word: רָעִים
  choice: दुष्ट
  rationale: यहाँ शब्द नैतिक बुराई का बोध कराता है; “दुष्ट” उसका स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: וְחַטָּאִים
  choice: और … पापी
  rationale: यह बहुवचन विधेय सदोम के पुरुषों को पाप से चिह्नित बताता है; “पापी” समानांतर विशेषणात्मक बल बनाए रखता है।
- source_word: לַיהוָה
  choice: याहवे के विरुद्ध
  rationale: חטא के साथ לְ उस व्यक्ति को सूचित कर सकता है जिसके विरुद्ध अपराध किया गया है। “के विरुद्ध” यहाँ संबंधात्मक और नैतिक बल व्यक्त करता है।
- source_word: מְאֹד
  choice: अत्यन्त
  rationale: यह पूरे नकारात्मक वर्णन को तीव्र करता है; “अत्यन्त” प्रबलता और गरिमा दोनों बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। “याहवे” उस वाचा-संबंधी नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: חַטָּאִים לַיהוָה में לְ का अर्थ
  choice: याहवे के विरुद्ध पापी
  alternative: याहवे के सामने पापी
  rationale: לְ पाप का लक्ष्य अथवा जिसके विरुद्ध अपराध हुआ उसे दर्शा सकता है, इसलिए मुख्य पाठ में “के विरुद्ध” रखा गया है। “के सामने” भी व्याकरणतः संभव है और परमेश्वर की दृष्टि में उनकी दशा पर बल देता है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सहज और गरिमापूर्ण कथन। “पुरुष” स्रोत के लिंग-विशिष्ट बहुवचन को सुरक्षित रखता है; “अत्यन्त” मूल की तीव्रता व्यक्त करता है।
