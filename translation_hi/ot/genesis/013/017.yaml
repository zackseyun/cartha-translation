base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/017.yaml
  text: Get up[a], walk through the land, through its length and its width[b], for I will give it to you.
translation:
  language: hi
  text: उठ, इस भूमि में इसकी लंबाई और चौड़ाई भर चल-फिर[a], क्योंकि मैं इसे तुझे दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घूम-फिर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּם
  choice: उठ
  rationale: आज्ञार्थक क्रिया का सीधा, स्वाभाविक और वर्तमान मानक हिन्दी रूप।
- source_word: הִתְהַלֵּ֣ךְ
  choice: चल-फिर
  rationale: हित्पएल आज्ञार्थक रूप भूमि में इधर-उधर चलने या उसका विस्तार पार करने का भाव देता है; ‘चल-फिर’ इस व्यापक गतिशीलता को सहज हिन्दी में रखता है।
- source_word: בָּאָרֶץ
  choice: इस देश में
  rationale: संदर्भ में אֶרֶץ सामान्य पृथ्वी नहीं, अब्राम के सामने दिखाई गई भूमि अथवा देश है; ‘इस’ प्रसंगगत संकेत को स्पष्ट करता है।
- source_word: לְאָרְכָּהּ וּלְרָחְבָּהּ
  choice: उसकी लंबाई और चौड़ाई तक
  rationale: युग्म देश के पूरे विस्तार में चलने का भाव व्यक्त करता है; ‘तक’ दिशागत विस्तार को स्वाभाविक हिन्दी में संप्रेषित करता है, जबकि लंबाई–चौड़ाई का मूल बिंब बनाए रखता है।
- source_word: כִּ֥י
  choice: क्योंकि
  rationale: आज्ञा का कारण प्रस्तुत करने वाले संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: לְךָ֖ אֶתְּנֶֽנָּה
  choice: मैं इसे तुझे दूँगा
  rationale: भविष्यसूचक प्रतिज्ञा और अब्राम को प्राप्तकर्ता के रूप में सीधे बनाए रखता है; ‘इसे’ स्त्रीलिंग प्रत्यय के पूर्वपद देश/भूमि की ओर संकेत करता है।
theological_decisions:
- issue: אֶתְּנֶנָּה में स्त्रीलिंग प्रत्यय का संदर्भ
  choice: ‘इसे’ का संदर्भ इसी देश/भूमि से है
  alternative: संज्ञा दोहराकर ‘यह देश तुझे दूँगा’
  rationale: स्त्रीलिंग एकवचन प्रत्यय स्वाभाविक रूप से אֶרֶץ की ओर लौटता है; सर्वनाम रखना मूल की संरचना और प्रतिज्ञात्मक तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘चल-फिर’ सामान्य पाठक के लिए सहज है और इधर-उधर चलकर देश का विस्तार देखने के मूल भाव को बनाए रखता है।
