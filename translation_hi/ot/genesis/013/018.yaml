base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/018.yaml
  text: So Abram moved his tent and came and settled by the oaks of Mamre[a], which are at Hebron[b], and there he built an altar to Yahweh.
translation:
  language: hi
  text: तब अब्राम ने अपना तम्बू उठाया और आकर मम्रे के बड़े वृक्षों के पास, जो हेब्रोन में हैं, बस गया। वहाँ उसने याहवे के लिए एक वेदी बनाई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱהַל
  choice: अपना तम्बू समेटकर आगे बढ़ा
  rationale: क्रिया אהל यहाँ तम्बू के साथ स्थान बदलने का भाव देती है। यह हिन्दी में स्वाभाविक है और केवल तम्बू गाड़ने का अर्थ लगाने से बचती है।
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: आकर बस गया
  rationale: दोनों क्रमिक क्रियाओं—आने और निवास करने—को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: मम्रे के बड़े पेड़ों के पास
  rationale: אֵלֹנֵי की वृक्ष-प्रजाति निश्चित नहीं है; व्यापक अर्थ वाला ‘बड़े पेड़’ मुख्य पाठ में अनावश्यक निश्चितता से बचाता है, जबकि सम्भावित प्रजातियाँ पाद-टिप्पणी में दी गई हैं।
- source_word: אֲשֶׁר בְּחֶבְרוֹן
  choice: जो हेब्रोन में हैं
  rationale: सापेक्ष उपवाक्य को बनाए रखते हुए मम्रे के पेड़ों की भौगोलिक स्थिति स्पष्ट करता है।
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: वहाँ उसने ... एक वेदी बनाई
  rationale: שָׁם के स्थान-सूचक बल और מִזְבֵּחַ के सामान्य अर्थ ‘वेदी’ दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से सीधे प्रस्तुत किया गया है; לְ का लाभार्थी/समर्पण भाव ‘के लिए’ से व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को उपाधि में बदलने से बचाता है।
- issue: אֵלֹנֵי में वृक्ष-प्रजाति
  choice: बड़े पेड़
  alternative: बलूत के पेड़; बांज के पेड़; तारपीन के पेड़
  rationale: इब्रानी शब्द की सटीक वनस्पति पहचान अनिश्चित है। मुख्य पाठ में व्यापक पद और पाद-टिप्पणी में सम्भावित प्रजातियाँ वास्तविक अस्पष्टता बनाए रखती हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कथात्मक क्रियाओं का क्रम सुरक्षित है। ईश्वरीय नाम को ‘यहोवा’ रूप में दिया गया है और वृक्ष-प्रजाति की वास्तविक अनिश्चितता पाद-टिप्पणी में स्पष्ट की गई है।
