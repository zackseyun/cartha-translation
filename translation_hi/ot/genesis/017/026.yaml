  yaml_path: translation/ot/genesis/017/026.yaml
  text: On that very day Abraham and his son Ishmael were circumcised.
translation:
  language: hi
  text: उसी दिन अब्राहम और उसके पुत्र इश्माएल का खतना हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: उसी दिन
  rationale: यह इब्रानी कालवाचक मुहावरा ठीक उसी दिन होने पर बल देता है। ‘उसी दिन’ आधुनिक हिंदी में स्वाभाविक और प्रभावपूर्ण है।
- source_word: נִמּוֹל
  choice: का खतना हुआ
  rationale: निफ़अल रूप का निष्क्रिय भाव सुरक्षित रखते हुए यह हिंदी में खतना किए जाने की बात स्वाभाविक ढंग से व्यक्त करता है। इब्रानी में क्रिया एकवचन है, यद्यपि उसके बाद संयुक्त कर्ता आता है; हिंदी में दोनों व्यक्तियों के साथ यह साझा विधेय सहज है।
- source_word: אַבְרָהָם
  choice: अब्राहम
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय रूप।
- source_word: וְיִשְׁמָעֵאל
  choice: और ... इश्माएल
  rationale: संयोजक को सीधे ‘और’ से व्यक्त किया गया है और नाम का प्रचलित हिंदी रूप रखा गया है।
- source_word: בְּנוֹ
  choice: उसके पुत्र
  rationale: तीसरे पुरुष एकवचन प्रत्यय इश्माएल को अब्राहम के पुत्र के रूप में पहचानता है। ‘पुत्र’ गरिमापूर्ण और सामान्यतः बोधगम्य है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मूल की कालगत emphaticता को ‘उसी दिन’ से और निष्क्रिय क्रिया को ‘खतना हुआ’ से सुरक्षित रखा गया है।
