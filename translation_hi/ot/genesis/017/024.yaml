  language: hi
  text: और अब्राहम निन्यानबे वर्ष का था, जब उसके अग्रचर्म के मांस का खतना किया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַבְרָהָם
  choice: और अब्राहम
  rationale: वाव कथानक की निरंतरता दिखाता है, इसलिए इसे स्वाभाविक रूप से “और” कहा गया है; नाम का प्रचलित हिन्दी रूप “अब्राहम” रखा गया है।
- source_word: בֶּן תִּשְׁעִים וָתֵשַׁע שָׁנָה
  choice: निन्यानबे वर्ष का था
  rationale: शाब्दिक इब्रानी मुहावरा “निन्यानबे वर्ष का पुत्र” है; आधुनिक हिन्दी में आयु बताने का स्वाभाविक और अर्थसंगत रूप चुना गया है।
- source_word: בְּהִמֹּלוֹ
  choice: जब ... खतना किया गया
  rationale: बेथ के साथ infinitive construct यहाँ समयसूचक परिस्थिति व्यक्त करता है। कर्मवाच्य हिन्दी मूल की संरचना और प्रसंग दोनों को बनाए रखती है।
- source_word: בְּשַׂר
  choice: मांस
  rationale: शरीर के ठोस अंग की ओर संकेत करने वाले इब्रानी शब्द का सीधा और गरिमापूर्ण हिन्दी रूप है।
- source_word: עָרְלָתוֹ
  choice: उसकी खलड़ी का
  rationale: यह पुरुष जननांग की अग्रत्वचा के लिए हिन्दी बाइबलीय शब्दावली में समझा जाने वाला रूप है और בשר ערלתו की संबंधात्मक संरचना को सुरक्षित रखता है।
