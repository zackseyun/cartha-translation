language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּֽ/לְ/יִשְׁמָעֵ֘אל שְׁמַעְתִּי/ךָ֒ הִנֵּ֣ה בֵּרַ֣כְתִּי אֹת֗/וֹ וְ/הִפְרֵיתִ֥י אֹת֛/וֹ וְ/הִרְבֵּיתִ֥י אֹת֖/וֹ בִּ/מְאֹ֣ד מְאֹ֑ד שְׁנֵים עָשָׂ֤ר נְשִׂיאִם֙ יוֹלִ֔יד וּ/נְתַתִּ֖י/ו לְ/ג֥וֹי גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/020.yaml
  text: And as for Ishmael, I have heard you. Look, I have blessed him, and will make him fruitful, and will multiply him exceedingly. He will father twelve princes, and I will make him into a great nation.
translation:
  language: hi
  text: और इश्माएल के विषय में भी मैंने तेरी सुन ली है। देख, मैंने उसे आशीष दी है; मैं उसे फलवंत करूँगा और उसकी संख्या अत्यन्त बढ़ाऊँगा। वह बारह प्रधानों का पिता होगा, और मैं उससे एक बड़ी जाति बनाऊँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְיִשְׁמָעֵאל
  choice: और इश्माएल के विषय में भी
  rationale: לְ यहाँ विषय-सूचक है; 'भी' अब्राहम द्वारा इश्माएल के लिए की गई विनती के उत्तर का स्वाभाविक संबंध स्पष्ट करता है।
- source_word: שְׁמַעְתִּיךָ
  choice: मैंने तेरी सुन ली है
  rationale: शाब्दिक अर्थ 'मैंने तुझे सुना है'; हिंदी में यह मुहावरा विनती स्वीकार किए जाने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִנֵּה
  choice: देख
  rationale: ध्यान आकर्षित करने वाले हिब्रू अव्यय का सीधा और वर्तमान हिंदी समतुल्य।
- source_word: הִפְרֵיתִי אֹתוֹ
  choice: मैं उसे फलवन्त करूँगा
  rationale: פרה वंश-वृद्धि और फलने-फूलने का बिंब रखता है; 'फलवन्त' उस बिंब को बनाए रखता है।
- source_word: וְהִרְבֵּיתִי אֹתוֹ בִּמְאֹד מְאֹד
  choice: और उसकी संख्या अत्यन्त बढ़ाऊँगा
  rationale: רבה की संख्यात्मक वृद्धि और מְאֹד מְאֹד की तीव्रता को सहज हिंदी में व्यक्त करता है।
- source_word: נְשִׂיאִם
  choice: प्रधान
  rationale: נשיא का अर्थ समुदाय या कुल का प्रमुख है; 'प्रधान' राजसी अर्थ को अनावश्यक रूप से निश्चित किए बिना पद और नेतृत्व दर्शाता है।
- source_word: יוֹלִיד
  choice: उससे ... उत्पन्न होंगे
  rationale: हिफ़ील रूप का मूल भाव 'जन्म देना/उत्पन्न करना' है; हिंदी में पुरुष पूर्वज के संदर्भ में यह सहज है और बारह प्रधानों के वंशज होने का अर्थ रखता है।
- source_word: וּנְתַתִּיו לְגוֹי גָּדוֹל
  choice: मैं उससे एक बड़ी जाति बनाऊँगा
  rationale: मुहावरे का आशय इश्माएल को महान जनसमुदाय/राष्ट्र का पूर्वज बनाना है; 'जाति' बाइबिलीय עם/גוי संदर्भ में व्यापक जनसमुदाय को दर्शाती है।
theological_decisions:
- issue: इश्माएल के विषय में परमेश्वर का उत्तर
  choice: '''मैंने तेरी सुन ली है'' द्वारा अनुग्रहपूर्ण उत्तर और आगामी आशीष दोनों बनाए रखे गए'
  alternative: '''मैंने तेरी प्रार्थना स्वीकार की है'''
  rationale: वैकल्पिक रूप निहितार्थ को स्पष्ट करता, पर स्रोत के 'सुना' क्रियापद को व्याख्यात्मक ढंग से विस्तृत कर देता।
- issue: नְשִׂיאִים की पदवी
  choice: प्रधान
  alternative: राजकुमार
  rationale: स्रोत शब्द आवश्यक रूप से राजाओं के पुत्रों को नहीं दर्शाता; 'प्रधान' अस्पष्टता को अधिक ठीक रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, आदरसूचक परंतु सहज बाइबिलीय शैली। परमेश्वर द्वारा अब्राहम को संबोधन में पारंपरिक एकवचन 'तेरी' रखा गया है। 'फलवन्त' मूल बिंब को बचाता है, जबकि 'उसकी संख्या बढ़ाऊँगा' आधुनिक पाठक के लिए आशय स्पष्ट करता है।
