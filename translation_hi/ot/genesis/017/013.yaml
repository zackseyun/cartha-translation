  text: הִמּ֧וֹל יִמּ֛וֹל יְלִ֥יד בֵּֽיתְ/ךָ֖ וּ/מִקְנַ֣ת כַּסְפֶּ֑/ךָ וְ/הָיְתָ֧ה בְרִיתִ֛/י בִּ/בְשַׂרְ/כֶ֖ם לִ/בְרִ֥ית עוֹלָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/013.yaml
  text: The one born in your house and the one bought with your money must surely be circumcised[c][b][a], and my covenant shall be in your flesh as an everlasting covenant.
translation:
  language: hi
  text: तुम्हारे घर में जन्मे हुए हर पुरुष और तुम्हारे धन से खरीदे हुए हर पुरुष का अवश्य खतना किया जाए[a][b]। और मेरी वाचा तुम्हारे शरीर में सदा की वाचा के रूप में होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निश्चय ही खतना किया जाएगा।” इब्रानी में जोर देने के लिए क्रिया के साथ उसी धातु का इन्फिनिटिव एब्सोल्यूट प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: “घर में जन्मा हुआ” और “धन से खरीदा हुआ” अब्राहम के घराने के उन पुरुष सदस्यों को सूचित करते हैं जो वहीं जन्मे थे या खरीदकर लाए गए थे।
    reason: cultural_note
lexical_decisions:
- source_word: הִמּוֹל יִמּוֹל
  choice: अवश्य खतना किया जाए
  rationale: धातु מול के infinitive absolute और finite verb का मेल जोर देता है। ‘अवश्य’ इस बल और प्रसंगगत अनिवार्यता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְלִיד בֵּיתְךָ
  choice: तुम्हारे घर में जन्मा हुआ हर पुरुष
  rationale: शाब्दिक अर्थ ‘तुम्हारे घर का जन्मा हुआ’ है। प्रसंग पुरुषों के खतने का है; ‘हर पुरुष’ हिन्दी में अभिप्रेत व्यक्ति-संदर्भ स्पष्ट करता है, बिना मुख्य पाठ में दास की स्थिति को जरूरत से अधिक निर्दिष्ट किए।
- source_word: וּמִקְנַת כַּסְפֶּךָ
  choice: तुम्हारे धन से खरीदा हुआ हर पुरुष
  rationale: यह अभिव्यक्ति खरीदकर घराने में लाए गए व्यक्ति को सूचित करती है। ‘धन’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ כֶּסֶף के भुगतान-साधन वाले अर्थ को व्यक्त करता है।
- source_word: בְרִיתִי
  choice: मेरी वाचा
  rationale: בְּרִית का मानक और धर्मवैचारिक रूप से खुला हिन्दी अनुवाद ‘वाचा’ है।
- source_word: בִּבְשַׂרְכֶם
  choice: तुम्हारे शरीर में
  rationale: पूर्वसर्ग בְּ को ‘में’ द्वारा सीधे रखा गया है, जिससे शारीरिक चिह्न और वाचा का निकट संबंध बना रहता है।
- source_word: לִבְרִית עוֹלָם
  choice: सदा की वाचा के रूप में
  rationale: לְ यहाँ अवस्था/भूमिका का भाव देता है। ‘सदा की वाचा’ עוֹלָם की दीर्घस्थायी, अनिश्चित भविष्य तक रहने वाली धारणा को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: शारीरिक चिह्न और वाचा का संबंध
  choice: ‘मेरी वाचा तुम्हारे शरीर में ... बनी रहेगी’
  alternative: खतना केवल वाचा का प्रतीक है / शारीरिक चिह्न स्वयं वाचा की सदस्यता को सिद्ध करता है
  rationale: इब्रानी पाठ वाचा को शरीर ‘में’ बताता है। अनुवाद इस सीधी भाषा और उसके धर्मवैचारिक तनाव को बनाए रखता है, पर प्रतीकात्मक या संस्कारवादी व्याख्या को आरोपित नहीं करता।
- issue: וְהָיְתָה का वचन और आशय
  choice: इस प्रकार मेरी वाचा ... बनी रहेगी
  alternative: और मेरी वाचा ... होगी
  rationale: स्त्रीलिंग एकवचन क्रिया का व्याकरणिक कर्ता निकटवर्ती ‘मेरी वाचा’ है। प्रसंग में खतने के फलस्वरूप वाचा का शरीर में स्थायी रूप से विद्यमान रहना अभिप्रेत है; ‘बनी रहेगी’ इसे प्राकृतिक हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘खतना’ सामान्य आधुनिक हिन्दी शब्द है और ‘वाचा’ बाइबलीय covenant की विशिष्टता बनाए रखता है। ‘शरीर में’ इब्रानी की प्रत्यक्ष और धर्मवैचारिक रूप से तनावपूर्ण अभिव्यक्ति को सुरक्षित रखता है।
