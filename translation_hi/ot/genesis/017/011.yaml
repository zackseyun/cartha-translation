source:
  edition: WLC
  text: וּ/נְמַלְתֶּ֕ם אֵ֖ת בְּשַׂ֣ר עָרְלַתְ/כֶ֑ם וְ/הָיָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/011.yaml
  text: You shall circumcise the flesh of your foreskin[a], and it shall be a sign of the covenant between me and you.
translation:
  language: hi
  text: तुम अपनी खलड़ी का खतना करो, और यह मेरे और तुम्हारे बीच की वाचा का चिह्न[a] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वाचा की निशानी।”
    reason: אוֹת के लिए एक स्वाभाविक वैकल्पिक हिंदी अभिव्यक्ति। टिप्पणी को उसी शब्द ‘चिह्न’ पर रखा गया है जिससे यह संबंधित है।
lexical_decisions:
- source_word: וּנְמַלְתֶּם
  choice: तुम ... खतना करना
  rationale: संयोजक वाव के साथ काल रूप यहाँ वाचा-संबंधी आदेश व्यक्त करता है। आधुनिक हिंदी में यह रचना निर्देश की शक्ति को स्वाभाविक ढंग से रखती है।
- source_word: בְּשַׂר עָרְלַתְכֶם
  choice: अपनी खलड़ी
  rationale: यह पदबंध शाब्दिक रूप से ‘तुम्हारी खलड़ी का मांस’ है, पर ठोस शारीरिक संदर्भ में עָרְלָה खलड़ी को दर्शाता है। हिंदी में ‘खलड़ी का खतना करना’ मूल आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है; ‘मांस’ जोड़ना अनावश्यक और अस्वाभाविक होगा।
- source_word: וְהָיָה
  choice: और यह ... होगा
  rationale: ‘यह’ अभी बताए गए खतने की ओर संकेत करता है और भविष्य/परिणामी अर्थ को स्पष्ट रखता है।
- source_word: לְאוֹת
  choice: का चिह्न
  rationale: אוֹת का सामान्य अर्थ ‘चिह्न’ या ‘निशानी’ है। वाचा के संदर्भ में ‘चिह्न’ गरिमापूर्ण और पारदर्शी है।
- source_word: בְּרִית
  choice: वाचा
  rationale: यह परमेश्वर द्वारा अब्राहम के साथ स्थापित विशिष्ट वाचा को दर्शाता है। हिंदी में संबंधकारक रचना ‘वाचा का चिह्न’ स्वाभाविक रूप से निश्चित संदर्भ प्रकट करती है।
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: मेरे और तुम्हारे बीच
  rationale: द्वितीय पुरुष बहुवचन को हिंदी का ‘तुम्हारे’ स्वाभाविक रूप से व्यक्त करता है; आसपास के पदों से अतिरिक्त अर्थ यहाँ नहीं जोड़ा गया।
theological_decisions:
- issue: वाचा में खतने की प्रकृति
  choice: वाचा का चिह्न
  alternative: वाचा की निशानी
  rationale: अनुवाद खतने को वाचा का चिह्न कहता है, पर उसके संस्कारात्मक या केवल प्रतीकात्मक स्वरूप पर ऐसा कोई अतिरिक्त निष्कर्ष नहीं जोड़ता जो इस पद में व्यक्त नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘खलड़ी’ ठोस शारीरिक अर्थ को सीधे व्यक्त करती है, जबकि वाक्य की आदेशात्मक और वाचा-संबंधी गंभीरता बनाए रखी गई है।
