source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים אֲבָל֙ שָׂרָ֣ה אִשְׁתְּ/ךָ֗ יֹלֶ֤דֶת לְ/ךָ֙ בֵּ֔ן וְ/קָרָ֥אתָ אֶת שְׁמ֖/וֹ יִצְחָ֑ק וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֥/י אִתּ֛/וֹ לִ/בְרִ֥ית עוֹלָ֖ם לְ/זַרְע֥/וֹ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/019.yaml
  text: And God said[a], “No, but Sarah your wife shall bear you a son, and you shall call his name Isaac. And I will establish my covenant with him as an everlasting covenant for his offspring after him.”
translation:
  language: hi
  text: और परमेश्वर ने कहा, “नहीं, बल्कि तुम्हारी पत्नी सारा तुम्हारे लिए एक पुत्र को जन्म देगी, और तुम उसका नाम इसहाक[a] रखना। मैं उसके साथ अपनी वाचा स्थापित करूँगा, जो उसके बाद उसके वंश के लिए सदा की वाचा होगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इसहाक” नाम की ध्वनि उस इब्रानी क्रिया से मिलती है जिसका अर्थ “वह हँसता है” या “वह हँसेगा” है।
    reason: नाम में निहित इब्रानी शब्द-संबंध को सुरक्षित करना।
lexical_decisions:
- source_word: אֲבָל
  choice: नहीं, बल्कि
  rationale: पिछले पद में इश्माएल के विषय में अब्राहम की विनती के उत्तर में यह सुधारात्मक विरोध व्यक्त करता है; केवल ‘परन्तु’ अपेक्षाकृत कमजोर होता।
- source_word: יֹלֶדֶת לְךָ בֵּן
  choice: तुम्हारे लिए एक पुत्र को जन्म देगी
  rationale: कृदन्त यहाँ भविष्यसूचक अर्थ में है। ‘तुम्हारे लिए’ לְךָ को बनाए रखता है और ‘एक पुत्र’ नए रूप में प्रस्तुत संतान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְקָרָאתָ אֶת־שְׁמוֹ
  choice: तुम उसका नाम ... रखना
  rationale: हिब्रू के नामकरण-वाक्यांश को सहज आधुनिक हिन्दी में व्यक्त करता है और आदेशात्मक भाव बनाए रखता है।
- source_word: יִצְחָק
  choice: इसहाक
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नामरूप अपनाया गया है; शब्द-संबंध को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וַהֲקִמֹתִי אֶת־בְּרִיתִי
  choice: मैं ... अपनी वाचा स्थापित करूँगा
  rationale: הקים के कारण वाचा को प्रभावी और दृढ़ करने का भाव है; ‘स्थापित करना’ वाचागत प्रसंग में सटीक और स्वाभाविक है।
- source_word: אִתּוֹ
  choice: उसके साथ
  rationale: पूर्वसर्ग इसहाक के साथ वाचागत संबंध बताता है, केवल उसके लाभ के लिए होने का भाव नहीं।
- source_word: לִבְרִית עוֹלָם
  choice: एक सदा की वाचा
  rationale: यह वाचा के स्थायी स्वरूप अथवा designation को व्यक्त करता है; ‘सदा की’ עוֹלָם की कालगत व्यापकता को बिना दार्शनिक विस्तार के रखता है।
- source_word: לְזַרְעוֹ אַחֲרָיו
  choice: उसके बाद उसके वंश के लिए
  rationale: ‘वंश’ זרע के सामूहिक एकवचन भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है; ‘उसके बाद’ पीढ़ीगत उत्तराधिकार को स्पष्ट करता है।
theological_decisions:
- issue: वाचा की परिधि और निरंतरता
  choice: वाचा को इसहाक के साथ स्थापित और उसके बाद उसके वंश तक विस्तृत बताया गया है।
  alternative: इसे केवल जातीय-राष्ट्रीय प्रतिज्ञा मानना, या इसमें बाद की किसी विशिष्ट वाचा-व्यवस्था को सीधे पढ़ना।
  rationale: हिब्रू पाठ जितना कहता है उतना ही रखा गया है; बाद की धर्मवैज्ञानिक प्रणालियों के अनुसार इसके दायरे को न संकुचित किया गया है, न विस्तृत।
- issue: עוֹלָם की कालगत शक्ति
  choice: सदा की
  alternative: अनन्त अथवा चिरस्थायी
  rationale: ‘सदा की’ वाचा की स्थायी निरंतरता व्यक्त करती है, पर ‘अनन्त’ से जुड़ सकने वाले अतिरिक्त दार्शनिक अर्थ आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘वाचा’ और ‘इसहाक’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं। सुधारात्मक ‘नहीं, बल्कि’ प्रसंग का बल व्यक्त करता है; डैश अंतिम वाक्यांश को वाचा के स्वरूप और उसके वंशगत विस्तार से स्वाभाविक रूप से जोड़ता है।
