base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/023.yaml
  text: So Abraham took Ishmael his son[a], and all those born in his house, and all those bought with his money, every male among the men of Abraham’s household, and circumcised the flesh of their foreskin on that very day[d][c][b], just as God had spoken to him.
translation:
  language: hi
  text: तब अब्राहम ने अपने पुत्र इश्माएल को, अपने घर में जन्मे सभी लोगों को, और अपने धन से खरीदे गए सभी लोगों को—अर्थात् अब्राहम के घराने के हर पुरुष को—लिया और उसी दिन[a] उनकी खलड़ी का खतना किया, ठीक वैसे ही जैसे परमेश्वर ने उससे कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आज के इसी दिन”; यह पद बल देता है कि अब्राहम ने उसी दिन तुरन्त आज्ञा मानी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लिया
  rationale: कथात्मक प्रयोग में לקח का सामान्य अर्थ ‘लेना’ है; यहाँ यह उन सबको आज्ञा के पालन के लिए साथ लेने/इकट्ठा करने की क्रिया आरम्भ करता है।
- source_word: יְלִידֵי בֵיתוֹ
  choice: अपने घर में जन्मे सभी लोगों को
  rationale: हिब्रू के ‘उसके घर में जन्मे’ बिंब को बनाए रखता है और मुख्य पाठ में उनकी सामाजिक स्थिति को आवश्यकता से अधिक विशिष्ट नहीं करता।
- source_word: מִקְנַת כַּסְפּוֹ
  choice: अपने धन से खरीदे गए सभी लोगों को
  rationale: वाक्यांश खरीदकर घराने में लाए गए व्यक्तियों को सूचित करता है; ‘धन’ आधुनिक हिन्दी में स्वाभाविक है, जबकि मूल में शाब्दिक रूप से ‘चाँदी’ है।
- source_word: כָּל זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם
  choice: अब्राहम के घराने के हर पुरुष को
  rationale: ‘हर पुरुष’ से זָכָר का लिंग-विशिष्ट अर्थ सुरक्षित रहता है और हिन्दी में ‘पुरुषों में हर पुरुष’ जैसी अनावश्यक पुनरुक्ति से बचा जाता है।
- source_word: וַיָּמָל
  choice: खतना किया
  rationale: यह खतना करने की मानक क्रिया है और आधुनिक हिन्दी में सटीक तथा परिचित है।
- source_word: בְּשַׂר עָרְלָתָם
  choice: उनकी खलड़ी का मांस
  rationale: मूल के ठोस शारीरिक शब्दों को बनाए रखता है; ‘खलड़ी’ हिन्दी बाइबलीय प्रयोग में foreskin का समझने योग्य पद है।
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: उसी दिन
  rationale: हिब्रू मुहावरा ठीक उसी दिन तत्काल आज्ञापालन पर बल देता है; इस बल को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים
  choice: ठीक वैसे ही जैसे परमेश्वर ने उससे कहा था
  rationale: דבר אִתּוֹ में ‘उससे/उसके साथ बोलना’ सम्भव है; इस प्रसंग में ‘उससे कहा था’ स्वाभाविक हिन्दी है और पूर्व में दी गई आज्ञा का संकेत देता है।
theological_decisions:
- issue: אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: ईश्वर
  rationale: उत्पत्ति 17 में संदर्भ एकमात्र परमेश्वर का है; ‘परमेश्वर’ आधुनिक हिन्दी बाइबल में स्पष्ट और प्रतिष्ठित पद है।
- issue: घराने के पुरुषों का लिंग-विशिष्ट वर्णन
  choice: अब्राहम के घराने के हर पुरुष को
  alternative: अब्राहम के घराने के हर सदस्य को
  rationale: मूल में זָכָר स्पष्ट रूप से ‘पुरुष/नर’ कहता है; लिंग-तटस्थ ‘सदस्य’ मूल की सीमा को अस्पष्ट कर सकता है।
- issue: परमेश्वर के बोलने का संबंधसूचक रूप
  choice: परमेश्वर ने उससे कहा था
  alternative: परमेश्वर ने उसके साथ बात की थी
  rationale: אִתּוֹ संवादात्मक अर्थ की अनुमति देता है, पर यहाँ कथन आज्ञा की विषयवस्तु और उसके पालन पर केंद्रित है; चुना हुआ रूप तनाव को सिद्धान्तगत रूप से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘घराना’, ‘खतना’ और ‘खलड़ी’ प्रसंग के वाचा-संबंधी तथा शारीरिक अर्थ को स्पष्ट रखते हैं। मुख्य वाक्य में सूचीयुक्त हिब्रू संरचना को डैश के माध्यम से पठनीय बनाया गया है।
