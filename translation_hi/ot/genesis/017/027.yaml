    text: हिब्रू में शाब्दिक रूप से, ‘परदेशी का पुत्र’; यह ‘परदेशी’ या ‘बाहरी व्यक्ति’ के अर्थ का एक मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אַנְשֵׁי בֵיתוֹ
  choice: और उसके घराने के सभी पुरुष
  rationale: संयोजक וְ पिछले वर्णन से संबंध जोड़ता है, כָּל समग्रता व्यक्त करता है, और אַנְשֵׁי בֵיתוֹ का स्वाभाविक अर्थ घराने के पुरुष सदस्य है।
- source_word: יְלִיד בָּיִת
  choice: जो घर में जन्मे थे
  rationale: यह घराने के भीतर जन्मे व्यक्तियों को सूचित करता है; यह रूप आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: וּמִקְנַת כֶּסֶף
  choice: और जो ... धन देकर खरीदे गए थे
  rationale: मूल पद धन से क्रय किए गए व्यक्तियों को दर्शाता है; यह अनुवाद लेन-देन के भाव को स्पष्ट रखता है।
- source_word: מֵאֵת בֶּן נֵכָר
  choice: किसी परदेशी से
  rationale: בֶּן־נֵכָר शाब्दिक रूप से ‘परदेशी का पुत्र’ है, पर यहाँ मुहावरे के रूप में परदेशी अथवा बाहरी व्यक्ति का बोध कराता है।
- source_word: נִמֹּלוּ
  choice: खतना किए गए
  rationale: निफ़अल रूप को यहाँ कर्मवाच्य समझना प्रसंगानुकूल है और अनावश्यक आत्मवाचक अर्थ से बचाता है।
- source_word: אִתּוֹ
  choice: उसके साथ
  rationale: यह अब्राहम के साथ सहभागिता अथवा उसी अवसर पर किए जाने का भाव बनाए रखता है।
