- source_word: אִתּוֹ
  choice: अब्राहम से
  rationale: אתּוֹ यहाँ पारस्परिक संवाद को सूचित करता है। संदर्भ में सर्वनाम का लक्ष्य अब्राहम है; हिंदी में ‘अब्राहम से बात’ स्वाभाविक है और अस्पष्टता से बचाता है।
- source_word: וַיַּעַל
  choice: ऊपर उठ गया
  rationale: עלה की ठोस ऊर्ध्वगामी छवि को बनाए रखता है; केवल ‘चला गया’ कहने से मूल की स्थानिक भाषा मिट जाती।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: क्रिया एकवचन है और संदर्भ इस्राएल के एक परमेश्वर का है। ‘परमेश्वर’ आधुनिक हिंदी बाइबिलीय शैली में स्वाभाविक और प्रतिष्ठित पद है।
- source_word: מֵעַל אַבְרָהָם
  choice: उसके पास से
  rationale: מֵעַל का मूल भाव ‘ऊपर/पास से हटकर’ है। ‘उसके पास से’ हिंदी में प्रस्थान का संबंध स्वाभाविक रूप से बताता है, जबकि ‘ऊपर उठ गया’ ऊर्ध्व दिशा को सुरक्षित रखता है।
- source_word: אַבְרָהָם
  choice: अब्राहम
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण।
theological_decisions:
- issue: परमेश्वर के प्रस्थान का मानवरूपी और स्थानिक वर्णन
  choice: ‘वह उसके पास से ऊपर उठ गया’ के द्वारा आरोहण की छवि बनाए रखी गई
  alternative: ‘परमेश्वर अब्राहम के पास से चला गया’
  rationale: इब्रानी पाठ प्रकट उपस्थिति के अंत को स्थानिक आरोहण के रूप में चित्रित करता है। इसे अमूर्त ‘चला गया’ में बदलना पाठ की वास्तविक छवि और धर्मवैचारिक तनाव को समतल कर देगा।
- issue: וַיְכַל का कर्ता
  choice: मुख्य पाठ में ‘परमेश्वर’ को स्पष्ट कर्ता बनाया गया
  alternative: ‘जब वह उससे बात कर चुका’
  rationale: इब्रानी में व्याकरणिक कर्ता सर्वनामरूप में निहित है, पर निकट संदर्भ और अगली उपवाक्य की स्पष्ट संज्ञा אֱלֹהִים उसे परमेश्वर से जोड़ते हैं। हिंदी में स्पष्ट नाम अधिक सहज है।
