  text: וְ/עָרֵ֣ל זָכָ֗ר אֲשֶׁ֤ר לֹֽא יִמּוֹל֙ אֶת בְּשַׂ֣ר עָרְלָת֔/וֹ וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּ֑י/הָ אֶת בְּרִיתִ֖/י הֵפַֽר׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/014.yaml
  text: And an uncircumcised male who is not circumcised in the flesh of his foreskin—that person shall be cut off from his people[b][a]; he has broken my covenant.
translation:
  language: hi
  text: और जो खतनारहित पुरुष हो, जिसकी खलड़ी के मांस का खतना न हुआ हो, उस व्यक्ति को अपने लोगों में से काट डाला जाएगा[a][b]; उसने मेरी वाचा तोड़ी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह प्राणी अपने लोगों में से काट डाला जाएगा।” इब्रानी में “प्राणी/व्यक्ति” और वाचा-दंड का मुहावरा “काट डाला जाना” प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: “काट डाला जाएगा” कठोर वाचा-दंड को सूचित कर सकता है—जिसमें समुदाय से बहिष्कार या मृत्यु सम्मिलित हो सकती है; यह पद स्वयं इसका स्वरूप और अधिक स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָרֵל זָכָר
  choice: जो खतनारहित पुरुष
  rationale: עָרֵל זָכָר किसी ऐसे पुरुष को निर्दिष्ट करता है जिसका खतना नहीं हुआ है। ‘खतनारहित पुरुष’ आधुनिक हिन्दी में स्पष्ट है और वाचा के चिह्न को यथावत रखता है।
- source_word: אֲשֶׁר לֹא יִמּוֹל
  choice: खतना न कराया हो
  rationale: मूल क्रिया का निफ़अल रूप निष्क्रिय अथवा आत्मवाचक भाव रखता है। हिन्दी में ‘न कराया हो’ उस दशा को स्वाभाविक ढंग से व्यक्त करता है, बिना यह तय किए कि उत्तरदायित्व केवल उसी व्यक्ति का था।
- source_word: אֶת בְּשַׂר עָרְלָתוֹ
  choice: अपनी खलड़ी के मांस में
  rationale: मूल पाठ की शारीरिक विशिष्टता बनाए रखने के लिए בְּשַׂר עָרְלָתוֹ को सामान्यीकृत नहीं किया गया। ‘खलड़ी’ वर्तमान मानक हिन्दी में foreskin का सहज और सटीक शब्द है।
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: वह व्यक्ति ... काट डाला जाएगा
  rationale: נֶפֶשׁ यहाँ दंड के अधीन पूरे व्यक्ति को सूचित करता है, इसलिए ‘व्यक्ति’ ‘प्राण’ या ‘आत्मा’ से अधिक स्पष्ट है। ‘काट डाला जाएगा’ כרת की वाचा-संबंधी दंडोक्ति को सुरक्षित रखता है।
- source_word: מֵעַמֶּיהָ
  choice: अपने लोगों में से
  rationale: स्त्रीलिंग प्रत्यय व्याकरणतः נֶפֶשׁ से मेल खाता है, पर आशय उसी पुरुष से है। ‘अपने लोगों में से’ हिन्दी में स्वाभाविक है और עַם के सामुदायिक अर्थ को बनाए रखता है।
- source_word: אֶת בְּרִיתִי
  choice: मेरी वाचा
  rationale: בְּרִית उत्पत्ति 17 का प्रमुख धार्मिक और संबंधपरक शब्द है। ‘वाचा’ हिन्दी बाइबलीय प्रयोग में स्थापित तथा गरिमापूर्ण है।
- source_word: הֵפַר
  choice: उसने ... तोड़ी है
  rationale: הפר वाचा को तोड़ने, भंग करने या निष्फल करने का अर्थ दे सकता है। ‘वाचा तोड़ी है’ स्पष्ट, स्वाभाविक और मूल के पूर्ण क्रियारूप के अनुकूल है।
theological_decisions:
- issue: वाचा-दंड כרת का आशय
  choice: ‘काट डाला जाएगा’ मुहावरे को बनाए रखा गया
  alternative: ‘समुदाय से निकाल दिया जाएगा’ अथवा ‘मार डाला जाएगा’
  rationale: इस पद में दंड का सटीक स्वरूप स्पष्ट नहीं किया गया है। बहिष्कार या मृत्यु में से किसी एक को मुख्य पाठ में चुनना मूल की धार्मिक और न्यायिक तनावपूर्ण अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
- issue: נֶפֶשׁ का अनुवाद
  choice: व्यक्ति
  alternative: प्राण अथवा आत्मा
  rationale: इस कानूनी-वाचा संबंधी प्रसंग में נֶפֶשׁ उस संपूर्ण व्यक्ति को दर्शाता है जिस पर दंड लागू होता है; ‘आत्मा’ कहने से बाद की विशिष्ट मानवशास्त्रीय धारणा आयात हो सकती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘वाचा’ जैसे स्थापित बाइबलीय पद को बनाए रखते हुए शारीरिक पदावली को अनावश्यक रूप से शिष्टोक्तिपूर्ण या अस्पष्ट नहीं बनाया गया।
