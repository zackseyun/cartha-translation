id: GEN.17.9
reference: Genesis 17:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל אַבְרָהָ֔ם וְ/אַתָּ֖ה אֶת בְּרִיתִ֣/י תִשְׁמֹ֑ר אַתָּ֛ה וְ/זַרְעֲ/ךָ֥ אַֽחֲרֶ֖י/ךָ לְ/דֹרֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/009.yaml
  text: And God said to Abraham[a], “As for you, you shall keep my covenant, you and your offspring after you throughout their generations.”
translation:
  language: hi
  text: और परमेश्वर ने अब्राहम से कहा, “जहाँ तक तुम्हारी बात है, तुम मेरी वाचा का पालन करना—तुम और तुम्हारे बाद तुम्हारा वंश, पीढ़ी-दर-पीढ़ी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: और ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; हिन्दी बाइबलीय गद्य में ‘और ... ने कहा’ स्वाभाविक तथा स्रोत के निकट है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में यह अब्राहम से वाचा बाँधने वाले परमेश्वर के लिए प्रयुक्त मानक हिन्दी पद है।
- source_word: וְאַתָּה
  choice: जहाँ तक तुम्हारी बात है
  rationale: 'आरम्भ में रखा गया सर्वनाम बल और विषय-परिवर्तन दिखाता है: अब परमेश्वर की प्रतिज्ञाओं के प्रत्युत्तर में अब्राहम के दायित्व की बात आती है।'
- source_word: אֶת־בְּרִיתִי
  choice: मेरी वाचा
  rationale: संज्ञा पर प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ है और ‘वाचा’ प्रसंग की प्रमुख शब्दावली को बनाए रखती है।
- source_word: תִשְׁמֹר
  choice: पालन करना
  rationale: שׁמר का अर्थ रखना, रक्षा करना या पालन करना हो सकता है; वाचा के प्रसंग में ‘पालन करना’ आधुनिक हिन्दी में दायित्व को सबसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אַתָּה וְזַרְעֲךָ
  choice: तुम और ... तुम्हारा वंश
  rationale: זֶרַע शाब्दिक रूप से ‘बीज’ और यहाँ सामूहिक अर्थ में वंश है। ‘वंश’ हिन्दी में इसकी एकवचन-सामूहिक प्रकृति तथा वंशगत निरंतरता दोनों को स्वाभाविक रूप से रखता है।
- source_word: אַחֲרֶיךָ
  choice: तुम्हारे बाद
  rationale: यह वंशगत उत्तराधिकार को दर्शाता है; सीधा और स्वाभाविक अनुवाद है।
- source_word: לְדֹרֹתָם
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह मुहावरा लगातार आने वाली पीढ़ियों में निरंतरता व्यक्त करता है; हिन्दी में ‘पीढ़ी-दर-पीढ़ी’ स्पष्ट और सहज है।
theological_decisions:
- issue: वाचा के दायित्व को अतिरिक्त विधिक या संस्कार-संबंधी अर्थ दिए बिना व्यक्त करना
  choice: तुम मेरी वाचा का पालन करना
  alternative: तुम मेरी वाचा को मानना / तुम मेरी वाचा की रक्षा करना
  rationale: ‘पालन करना’ आज्ञात्मक दायित्व और वाचा-संबंधी भाषा दोनों को स्पष्ट रखता है, पर मूल पाठ से आगे कोई सम्प्रदाय-विशिष्ट अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘करना’ वाला आज्ञार्थ कठोर कानूनी भाषा से बचते हुए स्पष्ट निर्देश देता है। ‘वंश’ मूल के सामूहिक एकवचन זֶרַע को पर्याप्त रूप से व्यक्त करता है, इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।
