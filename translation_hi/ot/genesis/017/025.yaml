  yaml_path: translation/ot/genesis/017/025.yaml
  text: And Ishmael his son was thirteen years old when the flesh of his foreskin was circumcised[a].
translation:
  language: hi
  text: और उसका पुत्र इश्माएल तेरह वर्ष का था, जब उसके लिंग की खलड़ी का खतना किया गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “जब उसकी खलड़ी के मांस का खतना किया गया।”'
    reason: मूल इब्रानी में ‘खलड़ी का मांस’ स्पष्ट रूप से कहा गया है; मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए उस ठोस शब्दावली को यहाँ सुरक्षित किया गया है।
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  choice: और इश्माएल
  rationale: वाव को सरल कथात्मक संयोजक ‘और’ से व्यक्त किया गया है; नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: בְּנ֔/וֹ
  choice: उसका पुत्र
  rationale: संबंधवाचक प्रत्यय सहित संज्ञा सीधे इश्माएल को अब्राहम का पुत्र बताती है।
- source_word: בֶּן שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: तेरह वर्ष का था
  rationale: इब्रानी में आयु बताने के प्रचलित मुहावरे को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בְּ/הִמֹּל/וֹ
  choice: जब ... का खतना किया गया
  rationale: בְּ के साथ निफ़अल infinitive construct और पुरुषवाचक प्रत्यय का यहाँ कालवाचक और कर्मवाच्य अर्थ है।
- source_word: אֵת
  choice: '[अलग से अनूदित नहीं]'
  rationale: निश्चित कर्म-सूचक चिह्न का हिन्दी में स्वतंत्र शब्दगत समतुल्य नहीं है।
- source_word: בְּשַׂר עָרְלָת/וֹ
  choice: उसके लिंग की खलड़ी
  rationale: ‘खलड़ी’ मूल के ערלה को स्पष्ट करता है; ‘लिंग की’ जोड़ने से आधुनिक हिन्दी पाठक के लिए आशय अस्पष्ट नहीं रहता। בשר की अधिक शाब्दिक अभिव्यक्ति पाद-टिप्पणी में सुरक्षित रखी गई है, क्योंकि मुख्य पाठ में ‘खलड़ी के मांस का खतना’ अस्वाभाविक लगेगा।
