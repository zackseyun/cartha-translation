source:
  edition: WLC
  text: וּ/בֶן שְׁמֹנַ֣ת יָמִ֗ים יִמּ֥וֹל לָ/כֶ֛ם כָּל זָכָ֖ר לְ/דֹרֹתֵי/כֶ֑ם יְלִ֣יד בָּ֔יִת וּ/מִקְנַת כֶּ֨סֶף֙ מִ/כֹּ֣ל בֶּן נֵכָ֔ר אֲשֶׁ֛ר לֹ֥א מִֽ/זַּרְעֲ/ךָ֖ הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/012.yaml
  text: And at eight days old, every male among you throughout your generations shall be circumcised—whether born in the house or bought with silver from any foreigner who is not from your offspring.
translation:
  language: hi
  text: तुम्हारी पीढ़ियों तक, तुम्हारे बीच हर पुरुष का खतना आठ दिन की आयु में[a] किया जाए—चाहे वह घर में जन्मा हो या किसी ऐसे परदेशी से चाँदी देकर[b] खरीदा गया हो, जो तुम्हारे वंश का नहीं है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आठ दिन का पुत्र।”
    reason: lexical_alternative
  - marker: b
    text: या, “पैसे देकर।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “हर परदेशी के पुत्र से, जो तुम्हारी संतान में से नहीं है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן שְׁמֹנַת יָמִים
  choice: आठ दिन का होने पर
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘आठ दिन का पुत्र’ है। ‘आठ दिन का होने पर’ आधुनिक हिन्दी में स्वाभाविक है और समय-संबंधी निर्देश को स्पष्ट रखता है।
- source_word: יִמּוֹל
  choice: खतना किया जाए
  rationale: निफ़अल रूप यहाँ निष्क्रिय भाव में आज्ञात्मक निर्देश व्यक्त करता है। यह चयन कर्ता को अनावश्यक रूप से निर्दिष्ट किए बिना कानूनी निर्देश का स्वर बनाए रखता है।
- source_word: לָכֶם כָּל זָכָר
  choice: तुम्हारे यहाँ हर लड़के का
  rationale: כָּל זָכָר का अर्थ ‘हर नर/पुरुष-जाति’ है; आठ दिन की आयु के संदर्भ में ‘हर लड़के’ स्वाभाविक मानवीय हिन्दी है। לָכֶם को ‘तुम्हारे यहाँ’ से वाचा-समुदाय के दायरे के रूप में व्यक्त किया गया है।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-पीढ़ी में
  rationale: यह पद आनेवाली क्रमिक पीढ़ियों में निर्देश की निरंतरता बताता है। ‘पीढ़ी-पीढ़ी में’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: יְלִיד בָּיִת
  choice: घर में जन्मा
  rationale: यह घराने के भीतर जन्मे व्यक्ति को सूचित करता है; अनुवाद मूल की घरेलू-सामुदायिक धारणा को निकटता से रखता है।
- source_word: וּמִקְנַת כֶּסֶף
  choice: चाँदी देकर खरीदा गया
  rationale: כֶּסֶף का ठोस अर्थ ‘चाँदी’ सुरक्षित रखा गया है और מִקְנַת का क्रय-संबंधी अर्थ स्पष्ट किया गया है।
- source_word: מִכֹּל בֶּן נֵכָר
  choice: किसी ऐसे परदेशी से
  rationale: शाब्दिक ‘हर परदेशी के पुत्र से’ इब्रानी वंश-सूचक मुहावरा है। ‘किसी ... परदेशी से’ आधुनिक हिन्दी में उसके आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: जो तुम्हारे वंश का नहीं है
  rationale: זֶרַע का मूल अर्थ ‘बीज’ है, पर यहाँ जैविक वंश का बोध है। ‘वंश’ अर्थ को स्पष्ट रखता है और हिन्दी में कृत्रिम शाब्दिकता से बचता है।
theological_decisions:
- issue: अब्राहम के वाचा-घराने में खतने की आज्ञा का दायरा
  choice: आज्ञा को जैविक वंश तक सीमित न रखकर घर में जन्मे और परदेशी से खरीदे गए पुरुषों को भी सम्मिलित किया गया है।
  alternative: आज्ञा को मुख्यतः अब्राहम की शारीरिक संतान तक सीमित समझना।
  rationale: इब्रानी पाठ घर में जन्मे और धन देकर खरीदे गए लोगों का स्पष्ट उल्लेख करता है तथा ‘तुम्हारे वंश का नहीं’ कहकर जैविक वंश से बाहर के व्यक्ति को भी दायरे में रखता है। अनुवाद इससे आगे कोई बाद की धर्मवैज्ञानिक परिणति नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘खतना’ प्रचलित और सटीक धार्मिक-सांस्कृतिक शब्द है। ‘लड़का’ आठ दिन की आयु के संदर्भ में ‘नर’ की अपेक्षा अधिक स्वाभाविक है; पादटिप्पणियाँ मूल इब्रानी की ठोस और मुहावरेदार अभिव्यक्तियों को उपलब्ध कराती हैं।
