  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל אַבְרָהָ֔ם שָׂרַ֣י אִשְׁתְּ/ךָ֔ לֹא תִקְרָ֥א אֶת שְׁמָ֖/הּ שָׂרָ֑י כִּ֥י שָׂרָ֖ה שְׁמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/015.yaml
  text: Then God said to Abraham[a], “As for Sarai your wife, you shall not call her name Sarai, for Sarah is her name.”
translation:
  language: hi
  text: तब परमेश्वर ने अब्राहम से कहा, “तुम अपनी पत्नी सारै को सारै नाम से न पुकारना, क्योंकि उसका नाम सारा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में इस्राएल के एकमात्र परमेश्वर के लिए मानक और गरिमापूर्ण हिन्दी रूप।
- source_word: שָׂרַי / שָׂרָה
  choice: सारै / सारा
  rationale: नाम-परिवर्तन का भेद बनाए रखने के लिए दोनों इब्रानी नामों के अलग-अलग लिप्यंतरण आवश्यक हैं।
- source_word: אִשְׁתְּךָ
  choice: तुम्हारी पत्नी
  rationale: अब्राहम के साथ सारै के संबंध को व्यक्त करने वाला सीधा स्वत्वसूचक पदबंध।
- source_word: לֹא תִקְרָא אֶת־שְׁמָהּ
  choice: उसका नाम अब ... न पुकारा जाए
  rationale: इब्रानी निषेध का निर्देशात्मक बल रखा गया है; ‘अब’ हिन्दी में नाम बदलने का आशय स्वाभाविक करता है, और कर्मवाच्य प्रयोग नामकरण की औपचारिकता बनाए रखता है।
- source_word: כִּי
  choice: ;
  rationale: यहाँ कण निषेध के बाद नए नाम की आधारभूत घोषणा प्रस्तुत करता है; हिन्दी में अर्धविराम दोनों खंडों का स्पष्ट और स्वाभाविक संबंध दिखाता है।
- source_word: שָׂרָה שְׁמָהּ
  choice: उसका नाम सारा होगा
  rationale: क्रियारहित इब्रानी घोषणा को हिन्दी की स्वाभाविक नामकरण-शैली में व्यक्त किया गया है; भावी रूप संदर्भ में नया नाम लागू होने का संकेत देता है।
theological_decisions:
- issue: नाम बदलने की घोषणा का रूप
  choice: “उसका नाम सारा होगा”
  alternative: “सारा उसका नाम है”
  rationale: इब्रानी क्रियारहित वाक्य औपचारिक घोषणा है। शाब्दिक वर्तमान-रूप सम्भव है, पर आधुनिक हिन्दी में भावी रूप नाम-परिवर्तन को अधिक स्पष्ट और स्वाभाविक बनाता है; इसमें कोई अतिरिक्त सांप्रदायिक अर्थ नहीं जोड़ा गया।
- issue: निषेध में कालगत आशय
  choice: “अब सारै न पुकारा जाए”
  alternative: “सारै नाम न पुकारना”
  rationale: प्रसंग पुराने नाम के प्रयोग को समाप्त करता है। ‘अब’ मूल में अलग शब्द के रूप में नहीं है, पर नाम-परिवर्तन के निहित कालगत आशय को सहज हिन्दी में स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और औपचारिक नामकरण-प्रसंग के अनुकूल। ‘तू’ या अत्यधिक संस्कृतनिष्ठ आदेश-रूप से बचते हुए सामान्य आदरसूचक ‘तुम’ अपनाया गया है।
