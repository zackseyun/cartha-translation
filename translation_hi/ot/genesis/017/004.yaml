id: GEN.17.4
reference: Genesis 17:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲנִ֕י הִנֵּ֥ה בְרִיתִ֖/י אִתָּ֑/ךְ וְ/הָיִ֕יתָ לְ/אַ֖ב הֲמ֥וֹן גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/004.yaml
  text: As for me[a], behold, my covenant is with you[b], and you will become the father of a multitude of nations.
translation:
  language: hi
  text: जहाँ तक मेरी बात है[a], देख, मेरी वाचा तेरे साथ है, और तू बहुत-सी जातियों का पिता बनेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं—देख, मेरी वाचा तेरे साथ है।” इब्रानी में आरम्भिक सर्वनाम और उसके बाद का अव्यय दोनों बलयुक्त हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “और तू बहुत-सी जातियों का पिता होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: जहाँ तक मेरी बात है
  rationale: स्वतंत्र सर्वनाम आरम्भ में विशेष बल देता है। यह रूप उस कथन-बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान खींचने वाला संकेतक अव्यय है। ‘देख’ आधुनिक हिन्दी में इसकी प्रत्यक्षता और गम्भीरता बनाए रखता है।
- source_word: בְרִיתִי
  choice: मेरी वाचा
  rationale: ‘वाचा’ उत्पत्ति में בְּרִית का सुसंगत और धर्मवैचारिक भार रखने वाला हिन्दी प्रतिशब्द है।
- source_word: אִתָּךְ
  choice: तेरे साथ
  rationale: इब्रानी पद का सीधा अर्थ ‘तेरे साथ’ है; ‘मेरे और तेरे बीच’ कहना मूल से अधिक विस्तार होता।
- source_word: וְהָיִיתָ
  choice: और तू ... बनेगा
  rationale: इस वाचा-संबंधी घोषणा में क्रिया का भावी और परिणामसूचक बल है; ‘बनेगा’ भूमिका में परिवर्तन को स्पष्ट करता है।
- source_word: לְאָב
  choice: पिता
  rationale: לְ उपसर्ग सहित यह किसी भूमिका या परिणति को बताता है; हिन्दी में ‘पिता बनेगा’ स्वाभाविक है।
- source_word: הֲמוֹן
  choice: बहुत-सी
  rationale: यह बड़ी संख्या या बहुलता व्यक्त करता है। ‘बहुत-सी जातियाँ’ साधारण आधुनिक हिन्दी में स्वाभाविक रहते हुए मात्रात्मक बल बनाए रखता है।
- source_word: גּוֹיִם
  choice: जातियों
  rationale: यहाँ अर्थ अनेक राष्ट्रों अथवा जनसमुदायों का है, न कि बाद का तकनीकी अर्थ ‘गैर-यहूदी’; ‘जातियाँ’ बाइबलीय हिन्दी में व्यापक जन-राष्ट्र समूहों के लिए समझा जाता है।
theological_decisions:
- issue: वाचा की घोषणा और अब्राम की भूमिका
  choice: ‘मेरी वाचा तेरे साथ है, और तू बहुत-सी जातियों का पिता बनेगा’
  alternative: ‘मैं तेरे साथ अपनी वाचा बाँध रहा हूँ’ अथवा ‘तू बहुत-से राष्ट्रों का पूर्वज होगा’
  rationale: मूल पाठ वाचा के संबंध और प्रतिज्ञात परिणाम को सीधे कहता है। चुना हुआ रूप वाचा और प्रतिज्ञा के बल को सुरक्षित रखता है, पर वाचा बाँधने की क्रिया या ‘पूर्वज’ जैसी व्याख्या को मूल में जोड़े बिना।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर द्वारा अब्राम को सीधे संबोधन के कारण एकवचन ‘तू/तेरे’ रखा गया है। ‘देख’ ने अत्यधिक पुरातन ‘देखो’ या ‘निहार’ के बजाय הִנֵּה की ध्यानाकर्षक शक्ति को स्वाभाविक रूप में रखा है।
