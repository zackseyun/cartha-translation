  edition: WLC
  text: וַ/יִּפֹּ֧ל אַבְרָהָ֛ם עַל פָּנָ֖י/ו וַ/יִּצְחָ֑ק וַ/יֹּ֣אמֶר בְּ/לִבּ֗/וֹ הַ/לְּ/בֶ֤ן מֵאָֽה שָׁנָה֙ יִוָּלֵ֔ד וְ/אִ֨ם שָׂרָ֔ה הֲ/בַת תִּשְׁעִ֥ים שָׁנָ֖ה תֵּלֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/017.yaml
  text: Then Abraham fell on his face and laughed[a], and said in his heart, “Will a child be born to a man a hundred years old? And will Sarah, who is ninety years old, give birth?”
translation:
  language: hi
  text: तब अब्राहम मुँह के बल गिर पड़ा और हँसा, और अपने मन में कहा, “क्या सौ वर्ष के पुरुष के यहाँ पुत्र जन्म लेगा? और क्या सारा नब्बे वर्ष की आयु में जन्म देगी?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: मुँह के बल गिर पड़ा
  rationale: यह इब्रानी मुहावरा साष्टांग या औंधे मुँह गिरने की मुद्रा बताता है; यह हिन्दी में स्वाभाविक रहते हुए शारीरिक मुद्रा को स्पष्ट रखता है।
- source_word: וַיִּצְחָק
  choice: हँसा
  rationale: צחק का सीधा अर्थ ‘हँसना’ है। तटस्थ अनुवाद इस हँसी को न अविश्वास और न आनन्द के रूप में पहले से निर्धारित करता है तथा इसहाक के नाम से शब्दगत संबंध बनाए रखता है।
- source_word: וַיֹּאמֶר בְּלִבּוֹ
  choice: अपने मन में कहा
  rationale: शाब्दिक इब्रानी ‘अपने हृदय में कहा’ है; आधुनिक हिन्दी में ‘अपने मन में कहा’ उसी आन्तरिक, अनकहे कथन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַלְּבֶן
  choice: क्या ... के पुत्र
  rationale: בֵּן का सामान्य अर्थ ‘पुत्र’ है। यहाँ आगामी प्रतिज्ञात पुत्र का संदर्भ होने के कारण लिंग-विशिष्ट स्रोत शब्द को बनाए रखा गया है।
- source_word: יִוָּלֵד
  choice: उत्पन्न होगा
  rationale: ילד का निफ़अल रूप ‘जन्म लेना/उत्पन्न होना’ बताता है। इस वाक्य-विन्यास में ‘उत्पन्न होगा’ संक्षिप्त और गरिमापूर्ण हिन्दी है।
- source_word: מֵאָה שָׁנָה
  choice: सौ वर्ष के
  rationale: आयु बताने वाले इब्रानी प्रयोग का स्वाभाविक हिन्दी समतुल्य है।
- source_word: וְאִם
  choice: और क्या
  rationale: यहाँ אם दो जुड़े हुए आलंकारिक प्रश्नों के दूसरे भाग को आरम्भ करता है; ‘और क्या’ उस संबंध को स्पष्ट रखता है।
- source_word: הֲבַת תִּשְׁעִים שָׁנָה
  choice: नब्बे वर्ष की आयु में
  rationale: शाब्दिक ‘नब्बे वर्ष की पुत्री’ इब्रानी आयु-मुहावरा है। हिन्दी में यह रूप अर्थ को बिना अनावश्यक संज्ञा जोड़े स्वाभाविक ढंग से देता है।
- source_word: תֵּלֵד
  choice: जन्म देगी
  rationale: स्त्री कर्ता के साथ Qal ילד का अर्थ बच्चे को जन्म देना है; आधुनिक हिन्दी में यही स्पष्ट और सहज अभिव्यक्ति है।
theological_decisions:
- issue: अब्राहम की हँसी का भाव
  choice: केवल ‘हँसा’ कहा गया है, बिना उसके भाव या नैतिक गुण को निर्धारित किए।
  alternative: ‘अविश्वास में हँसा’ अथवा ‘आनन्द से हँसा’
  rationale: मूल पद हँसी और मन के प्रश्न को दर्ज करता है, पर हँसी को स्पष्ट रूप से न अविश्वास और न आनन्द कहता है। इसलिए कथात्मक और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
- issue: בן की लिंग-विशिष्टता
  choice: ‘पुत्र’
  alternative: ‘सन्तान’ या ‘बच्चा’
  rationale: इब्रानी में स्पष्ट रूप से בֵּן है और निकट प्रसंग प्रतिज्ञात पुत्र की ओर संकेत करता है; इसलिए ‘पुत्र’ मूल शब्द को अधिक निकटता से प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किन्तु गरिमापूर्ण कथात्मक शैली। ‘अपने मन में कहा’ आन्तरिक वचन को स्वाभाविक बनाता है; प्रश्नों की असम्भाव्यता-सूचक शक्ति को व्याख्यात्मक शब्द जोड़े बिना सुरक्षित रखा गया है।
