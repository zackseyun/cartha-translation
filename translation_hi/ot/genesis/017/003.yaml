  text: וַ/יִּפֹּ֥ל אַבְרָ֖ם עַל פָּנָ֑י/ו וַ/יְדַבֵּ֥ר אִתּ֛/וֹ אֱלֹהִ֖ים לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/003.yaml
  text: Then Abram fell on his face, and God spoke with him, saying,
translation:
  language: hi
  text: तब अब्राम मुँह के बल गिर पड़ा, और परमेश्वर ने उससे कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: गिर पड़ा
  rationale: नפל के काल-क्रमसूचक रूप का सामान्य भूतकालीन अर्थ; अगले पदबंध के साथ यह श्रद्धापूर्वक दण्डवत होने का दृश्य स्पष्ट करता है, बिना क्रिया में अतिरिक्त व्याख्या जोड़े।
- source_word: עַל־פָּנָיו
  choice: मुँह के बल
  rationale: यह आधुनिक हिन्दी का स्वाभाविक मुहावरा है और भूमि की ओर मुँह करके गिरने की मूल इब्रानी छवि को बनाए रखता है।
- source_word: אַבְרָם
  choice: अब्राम
  rationale: इस प्रसंग में नाम अभी अब्राहम नहीं किया गया है; इसलिए स्रोत-पाठ के वर्तमान नाम का मानक लिप्यंतरण रखा गया है।
- source_word: וַיְדַבֵּר אִתּוֹ
  choice: उससे कहा
  rationale: शाब्दिक रूप से संरचना ‘उसके साथ बोला’ है, पर हिन्दी में वाणी के प्राप्तकर्ता के लिए ‘उससे कहा’ स्वाभाविक और अर्थ-सटीक है; अगले पद में प्रत्यक्ष कथन आता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: रूप आकारतः बहुवचन है, पर यहाँ क्रिया एकवचन है और सन्दर्भ एक परमेश्वर का है; हिन्दी बाइबलीय प्रयोग में ‘परमेश्वर’ स्वाभाविक तथा प्रतिष्ठित पद है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह प्रत्यक्ष वाणी का परिचायक है। हिन्दी में ‘बोला, यह कहते हुए’ जैसी पुनरुक्ति के बजाय संयुक्त रूप से ‘कहा’ आगामी उद्धरण को स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: וַ
  choice: तब
  rationale: आरम्भिक वाव कथा के अगले क्रम को चिह्नित करता है; आधुनिक हिन्दी में ‘तब’ इस अनुक्रम को स्पष्ट और सहज बनाता है।
theological_decisions:
- issue: אֱלֹהִים का वचन और संख्या
  choice: एकवचन ‘परमेश्वर’
  alternative: आकृतिमूलक बहुवचन ‘देवता’
  rationale: एकवचन क्रिया और वाचा के प्रसंग में इसका संकेत एक ही परमेश्वर की ओर है; बहुवचन अनुवाद व्याकरण और सन्दर्भ दोनों के विपरीत होगा।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘मुँह के बल गिर पड़ा’ मूल दृश्य को स्वाभाविक हिन्दी में व्यक्त करता है। इब्रानी के ‘बोला…कहते हुए’ सूत्र को हिन्दी की अनावश्यक पुनरुक्ति से बचाने के लिए ‘उससे कहा’ में समेटा गया है।
