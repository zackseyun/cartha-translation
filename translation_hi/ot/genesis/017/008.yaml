source:
  edition: WLC
  text: וְ/נָתַתִּ֣י לְ֠/ךָ וּ/לְ/זַרְעֲ/ךָ֨ אַחֲרֶ֜י/ךָ אֵ֣ת אֶ֣רֶץ מְגֻרֶ֗י/ךָ אֵ֚ת כָּל אֶ֣רֶץ כְּנַ֔עַן לַ/אֲחֻזַּ֖ת עוֹלָ֑ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/008.yaml
  text: And I will give to you and to your offspring after you the land of your sojournings—all the land of Canaan—as an everlasting possession[b][a], and I will be their God.
translation:
  language: hi
  text: और मैं तुझे और तेरे बाद तेरे वंश को वह भूमि जिसमें तू परदेशी होकर रहता है[a]—कनान का सारा देश—सदा की संपत्ति के रूप में दूँगा; और मैं उनका परमेश्वर होऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे परदेश-निवासों की भूमि।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: और मैं ... दूँगा
  rationale: वाचा-संबंधी कथन में संयोजक सहित पूर्ण क्रिया भविष्य की प्रतिज्ञा व्यक्त करती है; हिन्दी भविष्यकाल इसी आशय को स्वाभाविक रूप से प्रकट करता है।
- source_word: לְךָ
  choice: तुझे
  rationale: यह अब्राहम को व्यक्तिगत रूप से प्राप्तकर्ता बताने वाला सरल संप्रदान कारक है।
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: और तेरे बाद तेरे वंश को
  rationale: זֶרַע एक सामूहिक संज्ञा है; ‘वंश’ आधुनिक हिन्दी में इसके सामूहिक और उत्तराधिकार-संबंधी अर्थ को बनाए रखता है। ‘तेरे बाद’ कालगत उत्तराधिकार को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: तेरे परदेशी निवास की भूमि
  rationale: מְגוּרִים ऐसे अस्थायी निवासों को सूचित करता है जहाँ व्यक्ति परदेशी के रूप में रहता है। यह चयन केवल भटकने के बजाय निवासी-परदेशी की स्थिति को व्यक्त करता है।
- source_word: אֵת כָּל אֶרֶץ כְּנַעַן
  choice: कनान का सारा देश
  rationale: यह पूर्ववर्ती ‘भूमि’ का समानाधिकरण द्वारा स्पष्टीकरण है और כָּל की समग्रता को बनाए रखता है।
- source_word: לַאֲחֻזַּת עוֹלָם
  choice: सदा की संपत्ति के रूप में
  rationale: אֲחֻזָּה विशेषतः अधिकार में रखी भूमि या संपत्ति को दर्शाता है, और עוֹלָם यहाँ स्थायी वाचा-संबंधी अवधि व्यक्त करता है।
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: और मैं उनका परमेश्वर होऊँगा
  rationale: यह मानक वाचा-सूत्र का स्वाभाविक हिन्दी रूप है और परमेश्वर में किसी अस्तित्वगत परिवर्तन का संकेत दिए बिना संबंध को व्यक्त करता है।
theological_decisions:
- issue: वाचा-सूत्र का अनुवाद करते समय बाद की धर्मवैज्ञानिक व्याख्याएँ न जोड़ना
  choice: और मैं उनका परमेश्वर होऊँगा
  alternative: और मैं उनके लिए परमेश्वर होऊँगा
  rationale: इब्रानी कथन वाचा के संबंध को व्यक्त करता है, परमेश्वर के स्वरूप में परिवर्तन को नहीं। चुना गया रूप स्रोत के अर्थ और बाइबिलीय सूत्र—दोनों को सहज हिन्दी में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। ‘तुझे/तेरे’ एकवचन संबोधन मूल इब्रानी को दर्शाता है; ‘वंश’ सामूहिक अर्थ रखता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न संबंधित पदबंधों के तुरंत बाद रखे गए हैं।
