source:
  edition: WLC
  text: וְ/אֶתְּנָ֥ה בְרִיתִ֖/י בֵּינִ֣/י וּ/בֵינֶ֑/ךָ וְ/אַרְבֶּ֥ה אוֹתְ/ךָ֖ בִּ/מְאֹ֥ד מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/002.yaml
  text: And I will make my covenant between me and you[a], and I will multiply you exceedingly.
translation:
  language: hi
  text: और मैं अपने और तुम्हारे बीच अपनी वाचा स्थापित करूँगा[a], और तुम्हें अत्यन्त बढ़ाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “मैं अपने और तुम्हारे बीच अपनी वाचा दूँगा/रखूँगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנָה
  choice: और मैं ... बाँधूँगा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है, पर בְּרִית के साथ यह वाचा को स्थापित करने का मुहावरा है। हिन्दी में ‘वाचा बाँधना’ स्वाभाविक, गरिमापूर्ण और प्रसंगानुकूल है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: בְרִיתִי
  choice: अपनी वाचा
  rationale: ‘वाचा’ בְּרִית का औपचारिक और धर्मवैचारिक भार बनाए रखती है; ‘अपनी’ प्रथम पुरुष एकवचन प्रत्यय को व्यक्त करता है।
- source_word: בֵּינִי וּבֵינֶךָ
  choice: अपने और तुम्हारे बीच
  rationale: यह सम्बन्धसूचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है। ‘तुम्हारे’ एकवचन पुरुष सम्बोधन को बनाए रखता है।
- source_word: וְאַרְבֶּה
  choice: और ... बढ़ाऊँगा
  rationale: רבה का हिफ़ील रूप कारणात्मक वृद्धि बताता है। ‘बढ़ाऊँगा’ आधुनिक हिन्दी में स्वाभाविक है और संख्या में अत्यधिक वृद्धि के आशय को व्यक्त करता है।
- source_word: אֹתְךָ
  choice: तुम्हें
  rationale: मूल पाठ सीधे अब्राम को द्वितीय पुरुष एकवचन में सम्बोधित करता है। सन्तान का आशय निहित हो सकता है, पर उसे मुख्य पाठ में स्पष्ट जोड़ना उचित नहीं।
- source_word: בִּמְאֹד מְאֹד
  choice: अत्यन्त
  rationale: दोहराया हुआ מְאֹד तीव्र बल देता है। ‘अत्यन्त’ उसी जोर को संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: נתן + ברית का वाचागत मुहावरा
  choice: अपनी वाचा बाँधूँगा
  alternative: अपनी वाचा दूँगा/रखूँगा
  rationale: शाब्दिक क्रिया ‘देना/रखना’ है, किन्तु इस प्रसंग में वाचा स्थापित करने का भाव है। ‘वाचा बाँधना’ हिन्दी का स्वाभाविक वाचागत मुहावरा है और किसी वस्तु के हस्तांतरण का भ्रामक संकेत नहीं देता; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: ‘तुम्हें’ का विस्तार
  choice: तुम्हें
  alternative: तुम्हारे वंश को
  rationale: प्रतिज्ञा सन्तान की वृद्धि को समाहित करती है, फिर भी इब्रानी में सीधा कर्म अब्राम के लिए एकवचन ‘तुम्हें’ है। अनुवाद उस अर्थगत तनाव को बिना विस्तार के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण बाइबलीय गद्य। ‘वाचा’ पारिभाषिक गंभीरता बनाए रखती है, जबकि ‘बाँधूँगा’ हिन्दी में स्वाभाविक मुहावरा है।
