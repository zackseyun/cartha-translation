base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/005.yaml
  text: Your name shall no longer be called Abram[a], but your name shall be Abraham, for I have made you the father of a multitude of nations.
translation:
  language: hi
  text: अब से तुम्हारा नाम अब्राम नहीं कहलाएगा, बल्कि तुम्हारा नाम अब्राहम होगा, क्योंकि मैंने तुम्हें अनेक राष्ट्रों का पिता बनाया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “मैंने तुम्हें राष्ट्रों की बहुतायत का पिता ठहराया है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקָּרֵא
  choice: कहलाएगा
  rationale: קרא का निफ़ाल रूप नाम रखे या पुकारे जाने का निष्क्रिय भाव व्यक्त करता है; हिंदी में ‘कहलाएगा’ स्वाभाविक है।
- source_word: לֹא ... עוֹד
  choice: अब से ... नहीं
  rationale: यह प्रयोग वर्तमान बिंदु से पुराने नाम का प्रयोग समाप्त होने का भाव देता है।
- source_word: אַבְרָם
  choice: अब्राम
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: וְהָיָה
  choice: बल्कि ... होगा
  rationale: मूल का संयोजक यहाँ पुराने और नए नाम के बीच स्पष्ट विरोध स्थापित करता है; ‘बल्कि’ हिंदी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַבְרָהָם
  choice: अब्राहम
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: כִּי
  choice: क्योंकि
  rationale: नया नाम दिए जाने का कारण प्रस्तुत करता है।
- source_word: אַב
  choice: पिता
  rationale: साधारण अर्थ ‘पिता’ नामकरण की व्याख्या और वाचा के प्रसंग, दोनों में उपयुक्त है।
- source_word: הֲמוֹן
  choice: बहुत-सी
  rationale: हिंदी में ‘बहुत-सी जातियाँ’ הֲמוֹן גּוֹיִם के बहुलता-भाव को सहज रूप से व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: גּוֹיִם
  choice: जातियों
  rationale: यहाँ शब्द अनेक व्यापक जातीय-राजनीतिक समुदायों को दर्शाता है; ‘जातियाँ’ हिंदी बाइबलीय संदर्भ में स्वाभाविक है और ‘गैर-यहूदी’ जैसे कालविपर्ययी अर्थ से बचता है।
- source_word: נְתַתִּיךָ
  choice: मैंने तुम्हें ... बनाया है
  rationale: क्रिया का शाब्दिक अर्थ ‘दिया है’ है, पर इस विधेयात्मक रचना में ‘बनाया है’ सहज हिंदी है और हिब्रू पूर्ण पक्ष की घोषणात्मक, संपन्न शक्ति को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर की नाम-परिवर्तन घोषणा में पूर्ण पक्ष
  choice: मैंने तुम्हें बहुत-सी जातियों का पिता बनाया है
  alternative: मैं तुम्हें बहुत-सी जातियों का पिता बनाऊँगा
  rationale: हिब्रू में पूर्ण रूप נְתַתִּיךָ है। भूत/पूर्ण घोषणात्मक रूप बनाए रखने से प्रतिज्ञा को भविष्य मात्र में बदलने के बजाय परमेश्वर के वचन में संपन्न वास्तविकता के रूप में व्यक्त करने वाला तनाव सुरक्षित रहता है।
- issue: נְתַתִּיךָ की विधेयात्मक रचना
  choice: तुम्हें ... पिता बनाया है
  alternative: तुम्हें ... पिता के रूप में दिया है
  rationale: ‘बनाया है’ वर्तमान हिंदी में अधिक स्वाभाविक है, जबकि पादटिप्पणी मूल के अधिक शाब्दिक ‘दिया है’ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिंदी। ‘अब से ... नहीं’ नाम के परिवर्तन की समयगत शक्ति व्यक्त करता है। मुख्य पाठ में सहज ‘बनाया है’ रखा गया है और अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
