source:
  edition: WLC
  text: וְ/אֶת בְּרִיתִ֖/י אָקִ֣ים אֶת יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְ/ךָ֤ שָׂרָה֙ לַ/מּוֹעֵ֣ד הַ/זֶּ֔ה בַּ/שָּׁנָ֖ה הָ/אַחֶֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/021.yaml
  text: But I will establish my covenant with Isaac[a], whom Sarah will bear to you at this time next year.
translation:
  language: hi
  text: परन्तु मैं अपनी वाचा इसहाक के साथ स्थापित करूँगा[a], जिसे सारा अगले वर्ष इसी नियत समय पर तुम्हारे लिए जन्म देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैं अपनी वाचा इसहाक के साथ स्थापित करूँगा।” इब्रानी संयोजक का सामान्य अनुवाद “और” हो सकता है, पर पिछले पद में इश्माएल के विषय में कही गई बात के बाद यहाँ प्रसंग विरोध का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: परन्तु
  rationale: वाव सामान्यतः ‘और’ है, किन्तु पिछले पद में इश्माएल के विषय में कही गई बात के बाद यहाँ इसहाक के साथ वाचा का विरोधात्मक बल है।
- source_word: בְּרִיתִי
  choice: अपनी वाचा
  rationale: בְּרִיתִי का अर्थ ‘मेरी वाचा’ है; हिंदी में कर्ता के अनुरूप ‘अपनी वाचा’ अधिक स्वाभाविक है।
- source_word: אָקִים
  choice: स्थापित करूँगा
  rationale: קום के हिफ़ील रूप का वाचा-संदर्भ में अर्थ दृढ़तापूर्वक स्थापित करना है।
- source_word: אֶת יִצְחָק
  choice: इसहाक के साथ
  rationale: אֶת प्रत्यक्ष कर्म-चिह्न है, पर हिंदी में वाचा स्थापित करने के संबंध को ‘के साथ’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר תֵּלֵד לְךָ שָׂרָה
  choice: जिसे सारा तुम्हारे लिए जन्म देगी
  rationale: सापेक्ष उपवाक्य इसहाक की पहचान कराता है और לְךָ को ‘तुम्हारे लिए’ द्वारा बनाए रखता है।
- source_word: לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת
  choice: अगले वर्ष इसी नियत समय पर
  rationale: מוֹעֵד निश्चित अथवा नियत समय दर्शाता है और בַּשָּׁנָה הָאַחֶרֶת का स्वाभाविक अर्थ ‘अगले वर्ष’ है।
theological_decisions:
- issue: वाचा का इसहाक के साथ स्थापित होना
  choice: पद स्पष्ट रूप से इसहाक को उस व्यक्ति के रूप में प्रस्तुत करता है जिसके साथ परमेश्वर अपनी वाचा स्थापित करेगा।
  alternative: इश्माएल को मिली आशीष को उसी वाचा की स्थापना मानना।
  rationale: पिछले पद में इश्माएल के लिए आशीष है, जबकि इस पद में वाचा की स्थापना विशेष रूप से इसहाक के साथ कही गई है; इससे आगे के धर्मवैज्ञानिक निष्कर्ष पाठ में नहीं जोड़े गए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली रखी गई है। ‘वाचा’ बाइबलीय संदर्भ का प्रचलित औपचारिक शब्द है; ‘नियत समय’ מוֹעֵד की निश्चितता को स्पष्ट करता है।
