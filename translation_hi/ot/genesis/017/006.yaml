  text: וְ/הִפְרֵתִ֤י אֹֽתְ/ךָ֙ בִּ/מְאֹ֣ד מְאֹ֔ד וּ/נְתַתִּ֖י/ךָ לְ/גוֹיִ֑ם וּ/מְלָכִ֖ים מִמְּ/ךָ֥ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/006.yaml
  text: And I will make you exceedingly fruitful[a], and I will make nations from you[b], and kings will come from you.
translation:
  language: hi
  text: और मैं तुम्हें अत्यन्त फलवंत करूँगा[a], और मैं तुमसे राष्ट्र उत्पन्न करूँगा, और तुमसे राजा निकलेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “बहुत, बहुत अधिक।”
    reason: lexical_alternative
  - marker: b
    text: या, “राजा तुम में से निकलेंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְרֵתִי
  choice: और मैं तुम्हें ... फलवन्त करूँगा
  rationale: פרה के हिफ़ील रूप का अर्थ किसी को फलवन्त करना या उसकी फलवृद्धि कराना है। यह अनुवाद कारणवाचक भाव और वंशवृद्धि के सन्दर्भ, दोनों को बनाए रखता है।
- source_word: בִּמְאֹד מְאֹד
  choice: अत्यन्त
  rationale: מְאֹד की पुनरुक्ति प्रतिज्ञा की तीव्रता पर प्रबल बल देती है। आधुनिक हिन्दी में ‘अत्यन्त’ इस बल को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וּנְתַתִּיךָ לְגוֹיִם
  choice: मैं तुमसे राष्ट्र उत्पन्न करूँगा
  rationale: 'נתן के साथ ל यहाँ परिणामसूचक है: अब्राहम अनेक राष्ट्रों का पूर्वज बनेगा। ‘तुमसे राष्ट्र उत्पन्न करूँगा’ वंशगत आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।'
- source_word: לְגוֹיִם
  choice: राष्ट्र
  rationale: גּוֹיִם यहाँ अब्राहम से उत्पन्न होने वाले अनेक राष्ट्रीय समुदायों को सूचित करता है; ‘राष्ट्र’ सटीक है और अनावश्यक रूप से ‘अन्यजातियों’ का धार्मिक अर्थ नहीं जोड़ता।
- source_word: וּמְלָכִים
  choice: और ... राजा
  rationale: מְלָכִים का सीधा अर्थ ‘राजा’ है; ‘शासक’ इससे अधिक व्यापक और कम सटीक होता।
- source_word: מִמְּךָ יֵצֵאוּ
  choice: तुमसे ... निकलेंगे
  rationale: יצא का मूल अर्थ ‘निकलना’ है। वंशगत सन्दर्भ में यह हिन्दी में भी समझने योग्य है और स्रोत की अभिव्यक्ति को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: अब्राहम से प्रतिज्ञात वंश का विस्तार
  choice: यह पद अब्राहम से अनेक राष्ट्रों और राजाओं के उत्पन्न होने की प्रतिज्ञा करता है।
  alternative: इसे राष्ट्रों के बीच अब्राहम को कोई प्रतिष्ठा या पद दिए जाने के अधिक अमूर्त अर्थ में समझा जा सकता है।
  rationale: निकटवर्ती वाचा-सन्दर्भ सन्तान और वंश पर केन्द्रित है। अतः वंशगत भाषा इब्रानी वाक्यरचना और व्यापक प्रतिज्ञा के अनुकूल है, जबकि किसी बाद की धर्मवैज्ञानिक व्यवस्था को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रतिज्ञात्मक लहजा रखा गया है। ‘फलवन्त’ बाइबिलीय सन्दर्भ में परिचित होने के साथ सहज बोधगम्य है; ‘राष्ट्र’ और ‘राजा’ मूल शब्दों की स्पष्टता बनाए रखते हैं।
