source:
  edition: WLC
  text: וּ/בֵרַכְתִּ֣י אֹתָ֔/הּ וְ/גַ֨ם נָתַ֧תִּי מִמֶּ֛/נָּה לְ/ךָ֖ בֵּ֑ן וּ/בֵֽרַכְתִּ֨י/הָ֙ וְ/הָֽיְתָ֣ה לְ/גוֹיִ֔ם מַלְכֵ֥י עַמִּ֖ים מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/016.yaml
  text: I will bless her[a], and moreover I will give you a son by her. I will bless her, and she will become nations[b]; kings of peoples will come from her.
translation:
  language: hi
  text: मैं उसे आशीष दूँगा और उससे तुझे एक पुत्र भी दूँगा। मैं उसे आशीष दूँगा, और वह राष्ट्रों की माता बनेगी[a]; जनसमूहों के राजा उसी से उत्पन्न होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह राष्ट्र होगी/बनेगी।” इब्रानी में अधिक शाब्दिक रूप से, “वह राष्ट्रों के लिए होगी/बनेगी।”
    reason: मूल इब्रानी की असाधारण अभिव्यक्ति तथा मुख्य पाठ के स्वाभाविक, वंशगत अर्थ को दिखाने के लिए।
lexical_decisions:
- source_word: וּבֵרַכְתִּי / וּבֵרַכְתִּיהָ
  choice: मैं उसे आशीष दूँगा / मैं उसे आशीष दूँगा
  rationale: ברך के वाचाई और धर्मवैचारिक भार को सुरक्षित रखने के लिए ‘आशीष देना’ चुना गया है। इब्रानी की पुनरुक्ति भी बल देने के लिए बनाए रखी गई है।
- source_word: וְגַם
  choice: और ... भी
  rationale: यह संयोजन सामान्य आधुनिक हिन्दी में योगात्मक और बलात्मक अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָתַתִּי מִמֶּנָּה לְךָ בֵּן
  choice: उससे तुझे एक पुत्र भी दूँगा
  rationale: प्रतिज्ञा के प्रसंग में पूर्ण क्रिया-रूप भविष्य-निश्चितता व्यक्त करता है; हिन्दी में भविष्यकाल इसे स्पष्ट करता है। ‘उससे’ पुत्र के सारा से जन्म लेने का अर्थ बनाए रखता है।
- source_word: וְהָיְתָה לְגוֹיִם
  choice: वह राष्ट्रों में परिणत होगी
  rationale: यह अभिव्यक्ति इब्रानी के असाधारण ‘वह राष्ट्र होगी/बनेगी’ रूप को यथासंभव सुरक्षित रखते हुए हिन्दी में बोधगम्य है और मूल में अनुपस्थित ‘जननी’ को मुख्य पाठ में नहीं जोड़ती।
- source_word: גוֹיִם
  choice: राष्ट्रों
  rationale: पितृकालीन प्रतिज्ञा के प्रसंग में גוים के लिए ‘राष्ट्र’ सीधा और प्रचलित विकल्प है।
- source_word: מַלְכֵי עַמִּים
  choice: जनसमूहों के राजा
  rationale: ‘जनसमूह’ עמים को व्यक्त करता है और पिछले גוים के ‘राष्ट्रों’ से शब्दगत भेद बनाए रखता है; ‘जातियों’ से संभव आधुनिक जाति-व्यवस्था संबंधी भ्रम भी टलता है।
- source_word: מִמֶּנָּה יִהְיוּ
  choice: उसी से उत्पन्न होंगे
  rationale: शाब्दिक ‘उसी से होंगे’ के वंशगत आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: सारा के वंश से राष्ट्रों और राजाओं की प्रतिज्ञा
  choice: वह राष्ट्रों में परिणत होगी; जनसमूहों के राजा उसी से उत्पन्न होंगे
  alternative: वह राष्ट्रों की जननी बनेगी; जनसमूहों के राजा उसी से उत्पन्न होंगे
  rationale: मुख्य पाठ सारा से अनेक राष्ट्रों और राजवंशों के निकलने की सामूहिक वाचाई प्रतिज्ञा को व्यक्त करता है, पर मूल में स्पष्ट रूप से न आए ‘जननी’ को जोड़कर अर्थ को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘तुझे’ का प्रयोग उत्पत्ति के परमेश्वर-अब्राहम संवाद की एकवचन निकटता और पारंपरिक बाइबलीय गरिमा बनाए रखता है।
