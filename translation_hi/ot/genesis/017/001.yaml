source:
  edition: WLC
  text: וַ/יְהִ֣י אַבְרָ֔ם בֶּן תִּשְׁעִ֥ים שָׁנָ֖ה וְ/תֵ֣שַׁע שָׁנִ֑ים וַ/יֵּרָ֨א יְהוָ֜ה אֶל אַבְרָ֗ם וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲנִי אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְ/פָנַ֖/י וֶ/הְיֵ֥ה תָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/001.yaml
  text: When Abram was ninety-nine years old[a], Yahweh appeared to Abram and said to him, “I am God Almighty. Walk before me, and be blameless.”
translation:
  language: hi
  text: जब अब्राम निन्यानवे वर्ष का था, तब याहवे अब्राम को दिखाई दिया और उससे कहा, “मैं सर्वशक्तिमान परमेश्वर[a] हूँ। मेरे सामने चल और निष्कलंक हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: एल शद्दाय; ‘शद्दाय’ के सटीक अर्थ पर मतभेद है।'
    reason: मूल दिव्य उपाधि को सुरक्षित रखने और शद्दाय के अर्थ की विवादित स्थिति बताने के लिए।
lexical_decisions:
- source_word: וַיְהִי אַבְרָם בֶּן תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים
  choice: जब अब्राम निन्यानवे वर्ष का था
  rationale: इब्रानी आयु-सूचक मुहावरे को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; וַיְהִי यहाँ कथा की समयगत पृष्ठभूमि प्रस्तुत करता है।
- source_word: וַיֵּרָא יְהוָה אֶל־אַבְרָם
  choice: याहवे ने उसे दर्शन दिया
  rationale: निफ़अल रूप וַיֵּרָא इस प्रसंग में प्रकट होने अथवा दर्शन देने का अर्थ रखता है। हिन्दी में ‘दर्शन दिया’ ईश्वरीय प्रकटन के लिए स्वाभाविक और गरिमापूर्ण है; ‘उसे’ का संदर्भ निकटवर्ती अब्राम से स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: אֵל שַׁדַּי
  choice: सर्वशक्तिमान परमेश्वर
  rationale: यह प्रचलित और अर्थपूर्ण हिन्दी अनुवाद है। שַׁדַּי की सटीक व्युत्पत्ति और अर्थ विवादित होने के कारण ‘एल शद्दाय’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הִתְהַלֵּךְ לְפָנַי
  choice: मेरे सामने चलता रह
  rationale: ‘चलने’ का मूल रूपक बनाए रखते हुए हित्पअेल आज्ञार्थक की जीवन-आचरण और निरंतरता की भावना को ‘चलता रह’ से व्यक्त किया गया है।
- source_word: וֶהְיֵה תָמִים
  choice: और निर्दोष बना रह
  rationale: תָמִים यहाँ संपूर्ण निष्ठा, खराई और दोषरहित आचरण की मांग करता है; ‘निर्दोष’ नैतिक बल को बनाए रखता है और निरपेक्ष पापहीन सिद्धता का अनावश्यक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: אֵל שַׁדַּי का अर्थ
  choice: सर्वशक्तिमान परमेश्वर
  alternative: एल शद्दाय
  rationale: मुख्य पाठ में अर्थ-संचार को प्राथमिकता दी गई है, जबकि मूल उपाधि और उसके अनिश्चित अर्थ को पादटिप्पणी में रखा गया है।
- issue: תָמִים की नैतिक मांग
  choice: निर्दोष
  alternative: खरा; संपूर्ण; सिद्ध
  rationale: यह चयन वाचा-संबंधी खराई और दोषरहित आचरण को व्यक्त करता है, पर इसे निरपेक्ष निष्पाप सिद्धता के रूप में नहीं तय करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘चलता रह’ बाइबलीय रूपक को बनाए रखता है, और पादटिप्पणी का चिह्न उसी पदबंध के बाद रखा गया है जिससे वह संबंधित है।
