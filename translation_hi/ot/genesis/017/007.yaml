source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֜/י בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֨ין זַרְעֲ/ךָ֧ אַחֲרֶ֛י/ךָ לְ/דֹרֹתָ֖/ם לִ/בְרִ֣ית עוֹלָ֑ם לִ/הְי֤וֹת לְ/ךָ֙ לֵֽ/אלֹהִ֔ים וּֽ/לְ/זַרְעֲ/ךָ֖ אַחֲרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/007.yaml
  text: And I will establish my covenant between me and you and your offspring after you throughout their generations as an everlasting covenant[b][a], to be God to you and to your offspring after you.
translation:
  language: hi
  text: मैं अपनी वाचा को मेरे और तुम्हारे बीच, तथा मेरे और तुम्हारे बाद तुम्हारी संतान[a] के बीच, उनकी पीढ़ी-दर-पीढ़ी, सदा की वाचा के रूप में स्थापित करूँगा, ताकि मैं तुम्हारा परमेश्वर होऊँ[b] और तुम्हारे बाद तुम्हारी संतान का भी परमेश्वर होऊँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘संतान’ के लिए इब्रानी शब्द सामूहिक एकवचन है; इसका अनुवाद ‘वंश’, ‘वंशज’ या अधिक शब्दशः ‘बीज’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शब्दशः: ‘तुम्हारे लिए परमेश्वर होऊँ।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: मैं ... स्थापित करूँगा
  rationale: הקים के साथ בְּרִית वाचा को स्थापित या दृढ़ करने का भाव देता है। ‘स्थापित करूँगा’ आरंभ मात्र या केवल निर्वाह का अर्थ थोपे बिना मूल क्रिया के आशय को स्पष्ट रखता है।
- source_word: בְּרִיתִי
  choice: अपनी वाचा
  rationale: בְּרִית का मानक और प्रसंगानुकूल हिन्दी रूप ‘वाचा’ है; प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय ‘अपनी’ में सुरक्षित है।
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין
  choice: अपने और तुम्हारे बीच, और ... के बीच
  rationale: दोहराए गए בֵּין को हिन्दी में पर्याप्त रूप से बनाए रखा गया है, जिससे वाचा के पक्ष स्पष्ट रहते हैं और वाक्य अस्वाभाविक नहीं बनता।
- source_word: זַרְעֲךָ
  choice: तुम्हारे वंश
  rationale: זֶרַע सामूहिक एकवचन है। हिन्दी ‘वंश’ उसकी सामूहिकता और आगे की संतति—दोनों को स्वाभाविक रूप से व्यक्त करता है; टिप्पणी में ‘संतान’ और ‘बीज’ की वैकल्पिक संभावनाएँ दी गई हैं।
- source_word: אַחֲרֶיךָ
  choice: तुम्हारे बाद
  rationale: यह मूल के कालगत और वंशगत संबंध को सीधा व्यक्त करता है।
- source_word: לְדֹרֹתָם
  choice: उनकी सभी पीढ़ियों के लिए
  rationale: यह आने वाली पीढ़ियों में वाचा की निरंतरता को सुबोध आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לִבְרִית עוֹלָם
  choice: सदा की वाचा के रूप में
  rationale: עוֹלָם यहाँ दीर्घस्थायी निरंतरता को दर्शाता है। ‘सदा की वाचा’ परिचित, गरिमापूर्ण और अर्थ की अवधि को खुला रखने वाला रूप है।
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: ताकि मैं तुम्हारा परमेश्वर ठहरूँ
  rationale: ‘ठहरूँ’ होने/बने रहने के वाचागत भाव को गरिमापूर्वक व्यक्त करता है। हिन्दी में ‘तुम्हारा परमेश्वर’ मूल के संबंधात्मक सूत्र का स्वाभाविक रूप है; अधिक शब्दशः विकल्प टिप्पणी में सुरक्षित है।
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: और तुम्हारे बाद तुम्हारे वंश का भी परमेश्वर ठहरूँ
  rationale: अंतिम पद में परमेश्वर होने का संबंध वंश पर भी स्पष्ट रूप से लागू किया गया है; ‘वंश’ का अनुवाद पूरे पद में एकसमान रखा गया है।
theological_decisions:
- issue: अब्राहम के זֶרַע की सामूहिक एकवचनता
  choice: तुम्हारे वंश
  alternative: तुम्हारी संतान / तुम्हारे वंशज / तुम्हारे बीज
  rationale: ‘वंश’ सामूहिक भाव को बनाए रखता है और पाठ को न तो केवल अनेक व्यक्तियों तक सीमित करता है, न किसी एक प्रतिनिधि की व्याख्या को अनुवाद में आरोपित करता है।
- issue: वाचा-सूत्र לִהְיוֹת לְךָ לֵאלֹהִים
  choice: ताकि मैं तुम्हारा परमेश्वर ठहरूँ
  alternative: ताकि मैं तुम्हारे लिए परमेश्वर ठहरूँ
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है, जबकि मूल की असामान्य संबंधात्मक रचना को टिप्पणी में बताया गया है; इससे कोई अतिरिक्त सांप्रदायिक अर्थ नहीं जोड़ा जाता।
- issue: בְּרִית עוֹלָם की अवधि
  choice: सदा की वाचा
  alternative: चिरस्थायी वाचा / युगों तक रहने वाली वाचा
  rationale: ‘सदा की’ עוֹלָם की दीर्घस्थायी, अनिश्चित-अंत वाली शक्ति को व्यक्त करती है, बिना इस पद में उसकी धर्मवैज्ञानिक सीमाओं का अलग से निर्णय किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में ‘तुम’ का प्रयोग किया गया है, जो एकवचन संबोधन को स्पष्ट और सहज रखता है। भाषा गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध है। ‘वाचा’, ‘सदा’ और ‘परमेश्वर ठहरूँ’ मूल के गंभीर वाचागत स्वर को बनाए रखते हैं।
