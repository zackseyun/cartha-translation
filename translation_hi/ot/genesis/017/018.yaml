  text: וַ/יֹּ֥אמֶר אַבְרָהָ֖ם אֶל הָֽ/אֱלֹהִ֑ים ל֥וּ יִשְׁמָעֵ֖אל יִחְיֶ֥ה לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/018.yaml
  text: And Abraham said to God[a], “Oh, that Ishmael might live before you!”
translation:
  language: hi
  text: और अब्राहम ने परमेश्वर से कहा, “काश, इश्माएल तेरे सामने जीवित रहे![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “काश, इश्माएल तेरी उपस्थिति में जीवित रहे!” अथवा “तेरी कृपा में जीवित रहे!”
    reason: לְפָנֶיךָ के शाब्दिक और संभावित संबंधपरक अर्थों को दिखाने वाले वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: और ... ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; हिंदी कथात्मक शैली में ‘और ... ने कहा’ स्वाभाविक रहते हुए मूल संरचना को बनाए रखता है।
- source_word: אַבְרָהָם
  choice: अब्राहम
  rationale: व्यक्तिवाचक नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: אֶל הָאֱלֹהִים
  choice: परमेश्वर से
  rationale: वाणी के क्रिया-पद के साथ אֶל संबोधन की दिशा बताता है; हिंदी में ‘से कहा’ स्वाभाविक है। सप्रत्यय אֱלֹהִים यहाँ संदर्भ के विशिष्ट परमेश्वर को दर्शाता है।
- source_word: לוּ
  choice: काश
  rationale: यहाँ यह शर्त नहीं, बल्कि तीव्र इच्छा प्रकट करता है; ‘काश’ आधुनिक हिंदी में इसके कामना-सूचक भाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִשְׁמָעֵאל
  choice: इश्माएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: יִחְיֶה
  choice: जीवित रहे
  rationale: לוּ के अधीन अपूर्ण क्रिया अब्राहम की इच्छा व्यक्त करती है; ‘जीवित रहे’ जीवन के बने रहने की कामना को स्वाभाविक हिंदी में दर्शाता है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: शाब्दिक अर्थ ‘तेरे मुख/उपस्थिति के सामने’ है। यह सीधा अनुवाद स्थानिक, संबंधपरक और अनुग्रह-संबंधी संभावित अर्थों को किसी एक अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: इश्माएल के लिए अब्राहम की कामना में לְפָנֶיךָ का आशय
  choice: तेरे सामने
  alternative: तेरी उपस्थिति में; तेरी कृपा में
  rationale: मूल पद परमेश्वर की उपस्थिति और संभवतः उसकी कृपा में जीवन का संकेत दे सकता है, पर यहाँ वाचा, आशीष या कृपा को स्पष्ट रूप से परिभाषित नहीं करता। संक्षिप्त अभिव्यक्ति मूल की धर्मवैचारिक अस्पष्टता और तनाव को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘काश’ भावपूर्ण है, पर पुरातन नहीं; ‘तेरे सामने’ मूल के निकट और सामान्य पाठक के लिए स्पष्ट है। परमेश्वर के लिए एकवचन आत्मीय संबोधन मूल हिब्रू के द्वितीय पुरुष एकवचन से मेल खाता है।
