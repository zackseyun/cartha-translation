base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/010.yaml
  text: 'This is my covenant[a], which you shall keep, between me and you and your offspring after you: every male among you shall be circumcised.'
translation:
  language: hi
  text: 'यह मेरी वाचा है, जिसका तुम पालन करोगे, जो मेरे और तुम्हारे तथा तुम्हारे बाद तुम्हारे वंश[a] के बीच है: तुममें से हर पुरुष का खतना किया जाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वंशज।” इब्रानी शब्द זֶרַע एक सामूहिक शब्द है, जिसका अर्थ सन्तान या वंशज हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת בְּרִיתִי
  choice: यह मेरी वाचा है
  rationale: इब्रानी में निहित योजक क्रिया को हिन्दी में स्वाभाविक रूप से ‘है’ द्वारा व्यक्त किया गया है। ‘वाचा’ उत्पत्ति में בְּרִית की औपचारिक और धर्मवैचारिक निरन्तरता बनाए रखती है।
- source_word: אֲשֶׁר תִּשְׁמְרוּ
  choice: जिसका तुम पालन करोगे
  rationale: שׁמר का अर्थ यहाँ वाचा की बाध्यता को मानना और निभाना है। ‘पालन करोगे’ भविष्यत् रूप के साथ आदेशात्मक दायित्व को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ
  choice: मेरे और तुम्हारे बीच, और तुम्हारे बाद तुम्हारे वंश के बीच
  rationale: दोहराए गए ‘बीच’ को बनाए रखने से इब्रानी की सम्बन्धात्मक संरचना स्पष्ट रहती है। זֶרַע सामूहिक संज्ञा है; ‘वंश’ भावी पीढ़ियों के सामूहिक अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הִמּוֹל
  choice: खतना किया जाए
  rationale: निफ़अल infinitive absolute यहाँ वाचा की अपेक्षा व्यक्त करता है। निष्क्रिय रूप इब्रानी के ‘circumcised होना’ वाले रूप को दर्शाता है और हिन्दी में विधिसूचक आदेश के रूप में स्वाभाविक है।
- source_word: לָכֶם כָּל זָכָר
  choice: तुममें से हर पुरुष
  rationale: לָכֶם को प्रसंगानुसार समूहगत ‘तुममें से’ और כָּל זָכָר को लिंग-विशिष्ट ‘हर पुरुष’ के रूप में दिया गया है; इससे आज्ञा का मूल दायरा सामान्यीकृत नहीं होता।
theological_decisions:
- issue: खतने की आज्ञा का लिंग-विशिष्ट दायरा
  choice: तुममें से हर पुरुष का खतना किया जाए
  alternative: तुम सबका खतना किया जाए
  rationale: इब्रानी כָּל זָכָר स्पष्ट रूप से प्रत्येक पुरुष को निर्दिष्ट करता है। इसलिए अनुवाद मूल पाठ की लिंग-विशिष्ट सीमा को बनाए रखता है और उसे सभी व्यक्तियों तक सामान्यीकृत नहीं करता।
- issue: זֶרַע का सामूहिक अर्थ
  choice: वंश
  alternative: वंशज / सन्तान
  rationale: ‘वंश’ सामूहिक और पीढ़ीगत अर्थ बनाए रखता है, जबकि पादटिप्पणी पाठक को सम्भव वैकल्पिक अभिव्यक्ति बताती है; इससे एकवचन रूप को केवल एक व्यक्ति तक सीमित नहीं किया जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी अपनाई गई है। वाचाई औपचारिकता के लिए ‘वाचा’ और आदेशात्मक दायित्व के लिए ‘पालन करोगे’ तथा ‘किया जाए’ रखा गया है। पादटिप्पणी-चिह्न को ‘वंश’ पर रखा गया है, क्योंकि वही उसके lexical स्पष्टीकरण से सम्बन्धित है।
