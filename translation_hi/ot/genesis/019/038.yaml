  text: וְ/הַ/צְּעִירָ֤ה גַם הִוא֙ יָ֣לְדָה בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן עַמִּ֑י ה֛וּא אֲבִ֥י בְנֵֽי עַמּ֖וֹן עַד הַ/יּֽוֹם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/038.yaml
  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
translation:
  language: hi
  text: छोटी बेटी ने भी एक पुत्र को जन्म दिया और उसका नाम बेन-अम्मी[a] रखा। वही आज तक अम्मोनियों[b] का पूर्वज है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेन-अम्मी’ का अर्थ सम्भवतः ‘मेरे लोगों का पुत्र’ या ‘मेरे कुटुम्बी का पुत्र’ है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘अम्मोन के पुत्र।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצְּעִירָה
  choice: छोटी बेटी
  rationale: संदर्भ में यह विशेषण संज्ञा के रूप में लूत की छोटी बेटी को सूचित करता है; हिन्दी में संदर्भ स्पष्ट रखने के लिए ‘बेटी’ जोड़ा गया है।
- source_word: גַם הִוא
  choice: भी
  rationale: यह बताता है कि छोटी बेटी ने भी बड़ी बेटी के समान पुत्र को जन्म दिया।
- source_word: יָלְדָה בֵּן
  choice: एक पुत्र को जन्म दिया
  rationale: हिब्रू जन्म-सूत्र का स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी रूप।
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: उसका नाम ... रखा
  rationale: हिब्रू के ‘उसका नाम पुकारा’ नामकरण-सूत्र का स्वाभाविक हिन्दी समतुल्य।
- source_word: בֶּן עַמִּי
  choice: बेन-अम्मी
  rationale: व्यक्तिनाम का लिप्यंतरण किया गया है; उसके अर्थ की कथात्मक महत्ता पादटिप्पणी में दी गई है।
- source_word: הוּא אֲבִי
  choice: वही ... पूर्वज है
  rationale: यहाँ ‘पिता’ किसी जाति के मूल पुरुष के अर्थ में है; ‘पूर्वज’ आधुनिक हिन्दी में आशय को स्पष्ट करता है।
- source_word: בְנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: जाति-नाम का स्वाभाविक हिन्दी बहुवचन; शाब्दिक ‘अम्मोन के पुत्र’ पादटिप्पणी में सुरक्षित है।
- source_word: עַד הַיּוֹם
  choice: आज तक
  rationale: हिब्रू कथात्मक काल-वाक्यांश का प्रचलित हिन्दी रूप, जो कथाकार के समय तक निरंतरता बताता है।
