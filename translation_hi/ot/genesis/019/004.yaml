  choice: नगर के पुरुषों—सदोम के पुरुषों—
  rationale: दोनों पदों की पुरुषवाचक भाषा और दूसरे पद की समानाधिकरणात्मक पहचान सुरक्षित रखी गई है।
- source_word: נָסַבּוּ עַל הַבַּיִת
  choice: उस घर को घेर लिया
  rationale: נסב עם על यहाँ घर के चारों ओर एकत्र होकर उसे घेरने का भाव देता है; प्रसंग में ‘घेर लिया’ स्वाभाविक और सशक्त है।
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: जवान से लेकर बूढ़े तक
  rationale: यह आयु-सीमा के दोनों सिरों द्वारा व्यापकता व्यक्त करने वाला युग्म है; हिन्दी में यही स्वाभाविक समतुल्य है।
- source_word: כָּל הָעָם
  choice: सब लोग
  rationale: עָם सामूहिक रूप से लोगों को दर्शाता है; आरम्भ के पुरुषवाचक אַנְשֵׁי को इसमें अनावश्यक रूप से नहीं दोहराया गया।
- source_word: מִקָּצֶה
  choice: नगर के हर भाग से
  rationale: शाब्दिक अर्थ ‘छोर से’ है, पर यहाँ नगर के सभी भागों या दिशाओं से आने का मुहावरेदार भाव है; निहित नगर को हिन्दी में स्पष्ट किया गया है।
theological_decisions:
- issue: भीड़ के वर्णन में लिंगसूचक और सामूहिक भाषा
  choice: आरम्भ में ‘नगर के पुरुषों—सदोम के पुरुषों—’ और बाद में ‘सब लोग’
  alternative: सभी पदों को सामान्य रूप से ‘नगर के लोग’ कहना
  rationale: इब्रानी आरम्भ में אַנְשֵׁי द्वारा स्पष्ट पुरुषवाचक भाषा और बाद में עָם द्वारा सामूहिक संज्ञा का प्रयोग करता है। दोनों को अलग बनाए रखने से मूल की शब्दावली समतल नहीं होती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘पुरुषों’ मूल की लिंगसूचक भाषा को सुरक्षित रखता है; ‘सब लोग’ עָם की व्यापक सामूहिक अभिव्यक्ति को दर्शाता है। वाक्य-विभाजन हिन्दी में स्पष्टता के लिए किया गया है, बिना कथ्य बदले।
