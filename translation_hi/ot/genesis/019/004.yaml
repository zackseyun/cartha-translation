  yaml_path: translation/ot/genesis/019/004.yaml
  text: Before they lay down[a], the men of the city, the men of Sodom, surrounded the house—from young to old[c][b], all the people from every quarter.
translation:
  language: hi
  text: उनके लेटने से पहले, नगर के पुरुषों—सदोम के पुरुषों—ने उस घर को घेर लिया[a]। वे जवान से लेकर बूढ़े तक[b], नगर के कोने-कोने से आए हुए सब लोग थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस घर के चारों ओर इकट्ठे हो गए।” इब्रानी क्रिया किसी वस्तु को घेरने या उसके चारों ओर जमा होने, दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “जवान से बूढ़े तक”; अर्थात हर आयु-वर्ग के लोग।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “छोर से”; यहाँ आशय नगर के हर भाग या हर दिशा से है।
    reason: lexical_alternative
