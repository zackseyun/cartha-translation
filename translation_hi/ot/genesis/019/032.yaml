source:
  edition: WLC
  text: לְכָ֨/ה נַשְׁקֶ֧ה אֶת אָבִ֛י/נוּ יַ֖יִן וְ/נִשְׁכְּבָ֣ה עִמּ֑/וֹ וּ/נְחַיֶּ֥ה מֵ/אָבִ֖י/נוּ זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/032.yaml
  text: Come[a], let us make our father drink wine, and let us lie with him[b], so that we may preserve offspring through our father.
translation:
  language: hi
  text: “आओ, हम अपने पिता को दाखरस पिलाएँ और उसके साथ सोएँ, जिससे हमारे पिता से वंश बना रहे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “ताकि हम अपने पिता से बीज को जीवित रखें।” यहाँ “बीज” इब्रानी में संतान या वंश के अर्थ में है।
    reason: זָרַע के शाब्दिक “बीज” तथा प्रसंगानुसार “संतान/वंश” अर्थ को स्पष्ट करता है, और נְחַיֶּה के “जीवित रखना/बनाए रखना” भाव को सुरक्षित रखता है।
lexical_decisions:
- source_word: לְכָה
  choice: आओ
  rationale: यह הלך से बना कार्य के लिए उकसाने वाला मुहावरेदार उद्गार है; ‘आओ’ आधुनिक हिन्दी में इसके आग्रहपूर्ण भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נַשְׁקֶה אֶת־אָבִינוּ יַיִן
  choice: हम अपने पिता को दाखमधु पिलाएँ
  rationale: שקה का हिफ़ील रूप कारणवाचक है—पिता को दाखमधु पीने देना या पिलाना। ‘पिलाएँ’ इस कारणवाचक अर्थ को संक्षेप में बनाए रखता है।
- source_word: וְנִשְׁכְּבָה עִמּוֹ
  choice: और उसके साथ सोएँ
  rationale: שכב עם यहाँ यौन-संबंध का शिष्ट संकेत है। ‘उसके साथ सोएँ’ आधुनिक हिन्दी में स्वाभाविक है और मूल की संकेतात्मक भाषा को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: וּנְחַיֶּה מֵאָבִינוּ זָרַע
  choice: ताकि हम अपने पिता से संतान पाकर अपना वंश चलाएँ
  rationale: חיה का पिअल रूप जीवित रखने या बनाए रखने का भाव देता है, מן स्रोत को दर्शाता है, और זרע यहाँ संतान अथवा वंश के अर्थ में है। हिन्दी मुहावरे ‘संतान पाकर अपना वंश चलाएँ’ से वंश-परंपरा बनाए रखने का संयुक्त आशय स्पष्ट और स्वाभाविक रहता है।
theological_decisions:
- issue: अनाचारपूर्ण योजना का वर्णन
  choice: मूल पाठ की शिष्ट, संकेतात्मक अभिव्यक्ति को बनाए रखा गया
  alternative: यौन-संबंध को अधिक प्रत्यक्ष शब्दों में व्यक्त करना
  rationale: पाठ पात्रों की योजना का वर्णन करता है, उसका समर्थन नहीं करता; अनुवाद को न तो नैतिक टिप्पणी जोड़नी चाहिए, न मूल संकेत को अधिक स्पष्ट बनाना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दाखमधु’ बाइबलीय प्रसंग में प्रचलित और स्पष्ट है; ‘उसके साथ सोएँ’ मूल के यौन-संकेत को शिष्ट रूप में बनाए रखता है।
