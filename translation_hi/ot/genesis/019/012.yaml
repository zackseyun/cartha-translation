  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ הָ/אֲנָשִׁ֜ים אֶל ל֗וֹט עֹ֚ד מִֽי לְ/ךָ֣ פֹ֔ה חָתָן֙ וּ/בָנֶ֣י/ךָ וּ/בְנֹתֶ֔י/ךָ וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ בָּ/עִ֑יר הוֹצֵ֖א מִן הַ/מָּקֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/012.yaml
  text: Then the men said to Lot[a], “Who else do you have here? A son-in-law, your sons, your daughters[c][b], and everyone who belongs to you in the city—bring them out of the place.”
translation:
  language: hi
  text: तब उन पुरुषों ने लूत से कहा, “यहाँ तुम्हारा और कौन है? दामाद[a], तुम्हारे बेटे, तुम्हारी बेटियाँ और नगर में तुम्हारा जो कोई भी है[b]—उन सबको इस स्थान से बाहर ले आओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वर”; यहाँ आशय संभवतः लूत की बेटियों के होने वाले या वास्तविक पतियों से है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “नगर में जो कुछ तुम्हारा है”; इस प्रसंग में आशय लूत के परिवार या घराने से जुड़े लोगों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: उन पुरुषों
  rationale: इब्रानी में सामान्य शब्द ‘पुरुष’ है। यद्यपि व्यापक प्रसंग उनकी स्वर्गदूतीय पहचान बताता है, इस पद में वही पहचान मुख्य पाठ में जोड़ना उचित नहीं।
- source_word: עֹד מִי לְךָ פֹה
  choice: यहाँ तुम्हारा और कौन है?
  rationale: यह वाक्य लूत से जुड़े अन्य व्यक्तियों के विषय में पूछता है। यह रूप इब्रानी के संबंधसूचक भाव को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: חָתָן
  choice: दामाद
  rationale: इस प्रसंग में यह शब्द लूत की बेटियों के होने वाले या वास्तविक पतियों को सूचित करता है। इब्रानी एकवचन यहाँ संबंध की श्रेणी भी व्यक्त कर सकता है; हिन्दी ‘दामाद’ संख्या को अनावश्यक रूप से निर्णायक बनाए बिना स्वाभाविक है।
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: तुम्हारे बेटे, तुम्हारी बेटियाँ
  rationale: दोनों संबंधसूचक बहुवचन पदों का सीधा, आधुनिक हिन्दी अनुवाद।
- source_word: וְכֹל אֲשֶׁר לְךָ בָּעִיר
  choice: नगर में तुम्हारा जो कोई भी है
  rationale: शाब्दिक अर्थ व्यापक रूप से ‘नगर में जो कुछ तुम्हारा है’ हो सकता है, पर निकासी किए जाने वाले लोगों की सूची के संदर्भ में व्यक्तिवाचक अर्थ अधिक उपयुक्त है।
- source_word: הוֹצֵא מִן הַמָּקוֹם
  choice: उन सबको इस स्थान से बाहर ले आओ
  rationale: आज्ञा एकवचन पुल्लिंग में लूत को संबोधित है। हिन्दी में कर्म पूर्ववर्ती सूची से स्पष्ट करके जोड़ा गया है; ‘इस स्थान’ प्रसंग में संकेतित निकट स्थान को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: क्या הָאֲנָשִׁים की पहचान मुख्य पाठ में स्वर्गदूतों के रूप में की जाए
  choice: ‘पुरुषों’ को बनाए रखा गया
  alternative: ‘स्वर्गदूतों’ या ‘दूतों’
  rationale: कथा का व्यापक संदर्भ उनकी स्वर्गदूतीय पहचान स्पष्ट करता है, पर इस पद का इब्रानी पाठ सामान्य संज्ञा ‘पुरुष’ प्रयोग करता है। इसलिए मुख्य पाठ स्रोत की शब्दावली और कथात्मक तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली रखी गई है। ‘नगर’ और ‘स्थान’ बाइबिलीय कथन की औपचारिकता बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए स्पष्ट है।
