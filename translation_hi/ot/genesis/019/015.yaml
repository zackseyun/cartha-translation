base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/015.yaml
  text: And as dawn was rising[a], the angels urged Lot, saying, “Get up, take your wife and your two daughters who are here, lest you be swept away in the punishment of the city.”
translation:
  language: hi
  text: जब पौ फटने लगी, तब स्वर्गदूतों ने लूत से जल्दी करने को कहा, “उठो, अपनी पत्नी और अपनी दोनों बेटियों को, जो यहाँ हैं, साथ ले लो, कहीं ऐसा न हो कि तुम भी नगर के दण्ड में नाश हो जाओ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नगर के अधर्म में” अथवा “नगर के दोष के कारण।” इब्रानी शब्द का अर्थ अधर्म, दोष, या दोष के फलस्वरूप मिलने वाला दण्ड हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמוֹ הַשַּׁחַר עָלָה
  choice: जब पौ फटने लगी
  rationale: इब्रानी काल-सूचक वाक्यांश और उगती भोर के बिंब को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיָּאִיצוּ
  choice: जल्दी करने को कहा
  rationale: क्रिया किसी को शीघ्र कार्य करने के लिए जोर देने का भाव रखती है; यह हिन्दी में प्रसंग की तात्कालिकता स्पष्ट करती है।
- source_word: הַמַּלְאָכִים
  choice: स्वर्गदूतों
  rationale: यद्यपि मूल संज्ञा का सामान्य अर्थ ‘दूत’ भी हो सकता है, उत्पत्ति 19 में सन्दर्भ अलौकिक दूतों का है।
- source_word: קוּם קַח
  choice: उठो ... साथ ले लो
  rationale: दोनों आज्ञार्थक क्रियाओं को अलग रखते हुए आधुनिक और स्वाभाविक हिन्दी दी गई है।
- source_word: אֶת אִשְׁתְּךָ וְאֶת שְׁתֵּי בְנֹתֶיךָ
  choice: अपनी पत्नी और अपनी दोनों बेटियों को
  rationale: निर्दिष्ट संख्या और सम्बन्ध को सीधे रूप में सुरक्षित रखता है।
- source_word: הַנִּמְצָאֹת
  choice: जो यहाँ हैं
  rationale: शाब्दिक ‘जो पाई गई हैं/उपस्थित हैं’ का प्रसंगानुकूल स्वाभाविक अर्थ है और लूत के साथ मौजूद बेटियों को चिह्नित करता है।
- source_word: פֶּן תִּסָּפֶה
  choice: कहीं ऐसा न हो कि तुम भी ... मिट जाओ
  rationale: निफ़अल रूप दूसरों के साथ विनाश में आ पड़ने का भाव देता है; ‘भी’ इस सम्मिलित परिणाम को हिन्दी में स्पष्ट करता है।
- source_word: בַּעֲוֺן הָעִיר
  choice: नगर के अधर्म के दण्ड में
  rationale: עָוֹן में अधर्म, दोष और उसके फलस्वरूप दण्ड की अर्थ-सीमा है। मुख्य पाठ में दण्डात्मक परिणाम स्पष्ट किया गया है, जबकि मूल की व्यापकता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: न्याय के प्रसंग में עָוֹן का अर्थ
  choice: नगर के अधर्म के दण्ड में
  alternative: नगर के अधर्म में; नगर के दोष के कारण
  rationale: सन्दर्भ निकट आते विनाश की चेतावनी है, पर मूल शब्द पाप, दोष और उसके दण्ड—तीनों को सूचित कर सकता है। चुना हुआ रूप कारण और परिणाम का सम्बन्ध बनाए रखता है और विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पौ फटना’ प्रचलित हिन्दी मुहावरा है; ‘स्वर्गदूत’ सन्दर्भगत पहचान स्पष्ट करता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में सम्बन्धित विवादित पद के बाद दिया गया है।
