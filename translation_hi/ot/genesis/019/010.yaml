  yaml_path: translation/ot/genesis/019/010.yaml
  text: But the men reached out their hands and brought Lot into the house with them[c][b][a], and shut the door.
translation:
  language: hi
  text: पर उन पुरुषों ने अपने हाथ बढ़ाकर लूत को अपने साथ घर के भीतर ले आए और द्वार बंद कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: उन पुरुषों
  rationale: इब्रानी में सामान्य संज्ञा ‘पुरुष’ है। प्रसंग उन्हें स्वर्गदूत के रूप में पहचानता है, पर मुख्य पाठ इसी पद की शब्दावली बनाए रखता है।
- source_word: וַיִּשְׁלְחוּ אֶת יָדָם
  choice: अपने हाथ बढ़ाकर
  rationale: यह हाथ आगे करने की इब्रानी क्रिया-रचना का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप है।
- source_word: וַיָּבִיאוּ אֶת לוֹט אֲלֵיהֶם הַבָּיְתָה
  choice: लूत को अपने पास घर के भीतर खींच लिया
  rationale: בוא के हिफ़ईल का मूल अर्थ ‘ले आना’ है; हिंसक भीड़ के बीच लूत को तत्काल भीतर ले जाने की क्रिया के लिए ‘खींच लिया’ स्वाभाविक हिन्दी है, जबकि ‘अपने पास’ אֲלֵיהֶם को और ‘घर के भीतर’ दिशासूचक הַבָּיְתָה को व्यक्त करता है।
- source_word: הַדֶּלֶת
  choice: द्वार
  rationale: ‘द्वार’ dignified modern Hindi में सामान्य और प्रसंगानुकूल है।
- source_word: סָגָרוּ
  choice: बन्द कर दिया
  rationale: यह पूर्ण की गई तात्कालिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַ
  choice: पर
  rationale: पूर्ववर्ती भीड़ की कार्रवाई के विपरीत प्रत्युत्तर को हिन्दी में सहज रूप से दिखाता है।
theological_decisions:
- issue: क्या הָאֲנָשִׁים को मुख्य पाठ में स्पष्ट रूप से ‘स्वर्गदूत’ कहा जाए
  choice: मुख्य पाठ में ‘पुरुषों’ रखा गया
  alternative: स्वर्गदूतों; आगन्तुकों
  rationale: व्यापक प्रसंग उनकी पहचान स्वर्गदूतों के रूप में करता है, लेकिन इस पद में इब्रानी पाठ ‘पुरुषों’ कहता है; अतः व्याख्यात्मक पहचान को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। तेज़ घटनाक्रम बनाए रखने के लिए क्रियाओं को एक संयुक्त वाक्य में रखा गया है; ‘पुरुषों’ द्वारा मूल पाठ की शब्दावली और प्रसंगगत धार्मिक तनाव सुरक्षित रखा गया है।
