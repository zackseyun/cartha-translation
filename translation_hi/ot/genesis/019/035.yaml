language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תַּשְׁקֶ֜יןָ גַּ֣ם בַּ/לַּ֧יְלָה הַ/ה֛וּא אֶת אֲבִי/הֶ֖ן יָ֑יִן וַ/תָּ֤קָם הַ/צְּעִירָה֙ וַ/תִּשְׁכַּ֣ב עִמּ֔/וֹ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קֻמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/035.yaml
  text: So they also gave their father wine to drink that night[a], and the younger arose and lay with him, and he did not know when she lay down or when she arose.
translation:
  language: hi
  text: उस रात भी उन्होंने अपने पिता को दाखमधु पिलाया। तब छोटी बेटी उठी और उसके साथ लेट गई; और उसे पता न चला कि वह कब लेटी और कब उठी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: उन्होंने ... पिलाया
  rationale: שׁקה के हिफ़ील रूप का अर्थ किसी को पीने के लिए देना या पिलाना है। ‘पिलाया’ प्रेरणार्थक बल को स्वाभाविक हिन्दी में रखता है, पर क्रिया में ही ‘मतवाला कर दिया’ का अधिक प्रबल अर्थ नहीं जोड़ता।
- source_word: גַּם
  choice: भी
  rationale: यह पिछली रात की घटना के साथ निरंतरता दिखाता है; हिन्दी में ‘उस रात भी’ स्वाभाविक है।
- source_word: בַּלַּיְלָה הַהוּא
  choice: उस रात
  rationale: यह समयसूचक पदबंध आधुनिक हिन्दी में संक्षेप और स्वाभाविक रूप से ऐसे व्यक्त होता है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: यह יין अर्थात अंगूर से बनी मदिरा का स्पष्ट और गरिमापूर्ण हिन्दी पर्याय है।
- source_word: וַתָּקָם הַצְּעִירָה
  choice: तब छोटी बेटी उठी
  rationale: स्त्रीलिंग विशेषण הַצְּעִירָה प्रसंग में छोटी बेटी को दर्शाता है; ‘बेटी’ जोड़ने से हिन्दी पाठक के लिए संदर्भ स्पष्ट रहता है।
- source_word: וַתִּשְׁכַּב עִמּוֹ
  choice: उसके साथ लेट गई
  rationale: यह इब्रानी यौन-संबंधसूचक मुहावरे की औपचारिक निकटता और प्रसंगगत अर्थ दोनों बनाए रखता है।
- source_word: וְלֹא יָדַע
  choice: और उसे पता न चला
  rationale: ידע यहाँ जागरूकता या भान को व्यक्त करता है। यह हिन्दी में स्वाभाविक है और आगे आने वाले समयसूचक वाक्यांशों से उसकी अनभिज्ञता स्पष्ट होती है।
- source_word: בְּשִׁכְבָהּ וּבְקֻמָהּ
  choice: कि वह कब लेटी और कब उठी
  rationale: בְּ के साथ दोनों क्रियात्मक संज्ञाएँ यहाँ समयसूचक हैं। समानांतर ‘कब ... और कब ...’ रचना इब्रानी संतुलन को स्वाभाविक हिन्दी में बनाए रखती है।
theological_decisions:
- issue: लूत की अनभिज्ञता की सीमा
  choice: उसे पता न चला कि वह कब लेटी और कब उठी
  alternative: उसे उसके लेटने या उठने का ज्ञान न हुआ
  rationale: मूल पाठ केवल बेटी के लेटने और उठने के समय उसकी अनभिज्ञता कहता है; अनभिज्ञता के कारण या सीमा को इससे आगे निर्धारित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘दाखमधु’ बाइबिलीय संदर्भ में सटीक है, जबकि वाक्य-विन्यास आधुनिक और सहज रखा गया है।
