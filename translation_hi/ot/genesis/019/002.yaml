  text: וַ/יֹּ֜אמֶר הִנֶּ֣ה נָּא אֲדֹנַ֗/י ס֣וּרוּ נָ֠א אֶל בֵּ֨ית עַבְדְּ/כֶ֤ם וְ/לִ֨ינוּ֙ וְ/רַחֲצ֣וּ רַגְלֵי/כֶ֔ם וְ/הִשְׁכַּמְתֶּ֖ם וַ/הֲלַכְתֶּ֣ם לְ/דַרְכְּ/כֶ֑ם וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י בָ/רְח֖וֹב נָלִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/002.yaml
  text: And he said[a], “Please, my lords, turn aside to your servant’s house, and spend the night, and wash your feet. Then you may rise early and go on your way.” But they said, “No[d][c][b], but we will spend the night in the square.”
translation:
  language: hi
  text: उसने कहा, “कृपया, हे मेरे स्वामियो[a], अपने दास के घर पधारिए, रात बिताइए और अपने पाँव धोइए। फिर सुबह जल्दी उठकर अपने मार्ग पर चले जाइए।” पर उन्होंने कहा, “नहीं, बल्कि हम चौक में रात बिताएँगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे मेरे स्वामी”; इब्रानी रूप को एकवचन आदरसूचक संबोधन भी समझा जा सकता है, पर यहाँ दो आगंतुकों से कही गई बहुवचन क्रियाएँ “हे मेरे स्वामियो” का समर्थन करती हैं।
    reason: alternative_reading
  - marker: b
    text: “चौक” से आशय नगर के खुले सार्वजनिक स्थान से है, जहाँ लोग इकट्ठे होते थे; यह केवल सड़क नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: הִנֶּה נָּא ... סוּרוּ נָא
  choice: कृपया ... चलिए
  rationale: दोनों विनय-सूचक नָּא का संयुक्त बल स्वाभाविक हिन्दी में एक आदरपूर्ण आग्रह से व्यक्त किया गया है; אֶל के साथ गति का लक्ष्य होने के कारण ‘घर चलिए’ सहज है।
- source_word: אֲדֹנַי
  choice: हे मेरे प्रभुओ
  rationale: बहुवचन क्रियाओं और सर्वनामों के संदर्भ में यह दो आगंतुकों के लिए आदरसूचक मानवीय संबोधन है। ‘प्रभुओ’ बहुवचन और सम्मान दोनों को बनाए रखता है।
- source_word: בֵּית עַבְדְּכֶם
  choice: अपने दास के घर
  rationale: लूत स्वयं को विनम्रतापूर्वक उनका ‘दास’ कहता है; हिन्दी में यह आतिथ्यपूर्ण आत्म-नम्रता स्वाभाविक रूप से व्यक्त होती है।
- source_word: וְלִינוּ / נָלִין
  choice: रात बिताइए / रात बिताएँगे
  rationale: दोनों रूप एक ही मूल לין से हैं; समान हिन्दी अभिव्यक्ति शब्दगत संबंध बनाए रखती है।
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: अपने पाँव धोइए
  rationale: शाब्दिक और स्पष्ट अनुवाद प्राचीन आतिथ्य की प्रथा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: וְהִשְׁכַּמְתֶּם
  choice: भोर को उठकर
  rationale: क्रिया का अर्थ सुबह बहुत जल्दी उठना है; ‘भोर को’ समय की इस सूक्ष्मता को संक्षेप में व्यक्त करता है।
- source_word: וַהֲלַכְתֶּם לְדַרְכְּכֶם
  choice: अपने मार्ग पर चले जाइए
  rationale: यह आगे अपनी यात्रा जारी रखने का स्वाभाविक हिन्दी रूप है और ‘मार्ग’ की स्रोत-छवि भी बनाए रखता है।
- source_word: בָרְחוֹב
  choice: चौक में
  rationale: רְחוֹב यहाँ नगर का खुला सार्वजनिक स्थान है, केवल सड़क नहीं; ‘चौक’ आधुनिक हिन्दी में इसका उपयुक्त संक्षिप्त समतुल्य है।
- source_word: לֹא כִּי
  choice: नहीं, हम ... ही
  rationale: उत्तर का विरोधात्मक बल हिन्दी में ‘नहीं’ और ‘ही’ से स्वाभाविक रूप से व्यक्त होता है; यांत्रिक ‘नहीं, बल्कि’ यहाँ असहज होता।
theological_decisions:
- issue: אֲדֹנַי को ईश्वरीय उपाधि मानें या मनुष्यों के लिए आदरसूचक संबोधन
  choice: 'मानवीय बहुवचन संबोधन: ‘हे मेरे प्रभुओ’'
  alternative: एकवचन आदरसूचक ‘हे मेरे प्रभु’, जिसे कोई दिव्य व्यक्ति की ओर संबोधित मान सकता है
  rationale: तत्काल संदर्भ में लूत दो आगंतुकों से बोल रहा है, और पूरे पद की बहुवचन क्रियाएँ तथा प्रत्यय बहुवचन मानवीय संबोधन का समर्थन करते हैं। पादटिप्पणी रूपगत एकवचन व्याख्या की संभावना को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और कथात्मक रखी गई है। अतिथियों के लिए ‘आप/चलिए/धोइए’ तथा लूत की विनम्र आत्म-पहचान ‘अपने दास’ स्रोत के सामाजिक भाव को बनाए रखते हैं।
