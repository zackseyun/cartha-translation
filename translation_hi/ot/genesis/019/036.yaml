  yaml_path: translation/ot/genesis/019/036.yaml
  text: So both of Lot’s daughters became pregnant by their father[a][b].
translation:
  language: hi
  text: इस प्रकार लूत की दोनों बेटियाँ अपने पिता से गर्भवती हो गईं[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गर्भ धारण किया”; इब्रानी क्रिया उनके गर्भवती हो जाने का संकेत देती है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “अपने पिता से।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהֲרֶיןָ
  choice: गर्भवती हो गईं
  rationale: हरा धातु का यह रूप बताता है कि दोनों स्त्रियाँ गर्भवती हुईं। यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है; ‘गर्भ धारण किया’ भी संभव है।
- source_word: שְׁתֵּי
  choice: दोनों
  rationale: यह संख्या लूत की दोनों बेटियों को सम्मिलित रूप से संकेत करती है; हिन्दी में ‘दोनों’ स्वाभाविक ढंग से इस अर्थ को व्यक्त करता है।
- source_word: בְנוֹת לוֹט
  choice: लूत की दोनों बेटियाँ
  rationale: इब्रानी संबंधसूचक पदबंध को हिन्दी में ‘की’ के साथ स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: מֵאֲבִיהֶן
  choice: अपने पिता से
  rationale: מִן यहाँ स्रोत अथवा पितृत्व को दर्शाता है। ‘अपने पिता से’ इब्रानी के शाब्दिक संबंध को बनाए रखते हुए हिन्दी में स्पष्ट है।
