base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/034.yaml
  text: And it happened on the next day that the firstborn said to the younger[a], “Look, I lay with my father last night. Let us make him drink wine tonight also. Then come, lie with him, so that we may preserve offspring from our father.”
translation:
  language: hi
  text: अगले दिन ऐसा हुआ कि बड़ी बेटी ने छोटी बेटी से कहा, “देख, पिछली रात मैं अपने पिता के साथ सोई थी। आज रात भी हम उसे दाखमधु पिलाएँ। फिर तू जाकर उसके साथ सो, ताकि हमारे पिता से संतान उत्पन्न हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हम अपने पिता से बीज जीवित रखें।” यहाँ “बीज” का अर्थ संतान या वंश है।
    reason: मूल इब्रानी मुहावरे और ‘संतान उत्पन्न हो’ के अर्थपरक हिन्दी अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: अगले दिन ऐसा हुआ
  rationale: इब्रानी कथात्मक आरंभ को बनाए रखते हुए आधुनिक और स्वाभाविक हिन्दी प्रयोग किया गया है।
- source_word: הַבְּכִירָה ... הַצְּעִירָה
  choice: जेठी ... छोटी
  rationale: ये स्त्रीलिंग संज्ञावाचक विशेषण दोनों बेटियों के जन्म-क्रम का संक्षिप्त और स्वाभाविक हिन्दी संकेत देते हैं।
- source_word: הֵן
  choice: देख
  rationale: ध्यान आकर्षित करने वाले अव्यय का सीधा, आधुनिक समतुल्य।
- source_word: שָׁכַבְתִּי אֶת־אָבִי / שִׁכְבִי עִמּוֹ
  choice: अपने पिता के साथ सोई थी / उसके साथ सो
  rationale: मूल के यौनार्थक शिष्टोक्ति को स्पष्ट किंतु अश्लील या चिकित्सकीय हुए बिना सुरक्षित रखता है।
- source_word: נַשְׁקֶנּוּ יַיִן
  choice: हम उसे दाखमधु पिलाएँ
  rationale: हिफ़ील रूप का कारक अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: גַּם הַלַּיְלָה
  choice: आज रात भी
  rationale: समय-संदर्भ और पुनरावृत्ति सूचक גַּם दोनों सुरक्षित हैं।
- source_word: וּנְחַיֶּה מֵאָבִינוּ זָרַע
  choice: ताकि हम अपने पिता से वंश चलाएँ
  rationale: शाब्दिक ‘बीज जीवित रखें’ के प्रजनन-संबंधी मुहावरे को सामान्य आधुनिक हिन्दी में अर्थपूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: मूल के अनैतिक कृत्य का वर्णन
  choice: वर्णन को बिना अतिरिक्त नैतिक टिप्पणी के प्रस्तुत किया गया
  alternative: पाठ में ही निंदा या औचित्य जोड़ना
  rationale: यह पद पात्रों की योजना बताता है; अनुवाद को मूल से बाहर जाकर उसका नैतिक या धर्मवैज्ञानिक निर्णय नहीं जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘दाखमधु’ बाइबिलीय संदर्भ में परिचित है, जबकि ‘जेठी/छोटी’ स्त्रीलिंग और जन्म-क्रम को संक्षेप में व्यक्त करते हैं।
