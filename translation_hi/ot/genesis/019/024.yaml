base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/024.yaml
  text: Then Yahweh rained sulfur and fire on Sodom and Gomorrah from Yahweh out of the heavens[a][b].
translation:
  language: hi
  text: तब याहवे ने सदोम और अमोरा पर गंधक[a] और आग बरसाई—याहवे से, आकाशों से।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परम्परागत अनुवादों में कभी-कभी ‘गन्धक और आग’ के लिए पुराना पर्याय मिलता है; इब्रानी शब्द גָּפְרִית का अर्थ गंधक (सल्फ़र) है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “याहवे से, आकाशों से।” मूल इब्रानी में याहवे-नाम दो बार आया है; उसे सरल बनाकर हटाया नहीं गया है। ‘आकाशों’ के लिए प्रयुक्त इब्रानी शब्द बहुवचन रूप में है।'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले इब्रानी परमेश्वर-नाम YHWH को आधुनिक हिन्दी में निकट और प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है; पद में इसकी दोनों आवृत्तियाँ सुरक्षित रखी गई हैं।
- source_word: הִמְטִיר
  choice: बरसाई
  rationale: हिफ़ील क्रिया का अर्थ ‘बरसाना’ या ‘वर्षा के समान गिराना’ है। ‘बरसाई’ हिन्दी में स्वाभाविक है और ऊपर से गिरने के मूल बिंब को बनाए रखती है।
- source_word: גָּפְרִית
  choice: गंधक
  rationale: यह संज्ञा सल्फ़र को दर्शाती है; ‘गंधक’ इसका स्पष्ट, मानक और सामान्य हिन्दी पर्याय है।
- source_word: אֵשׁ
  choice: आग
  rationale: सरल और प्रत्यक्ष हिन्दी पर्याय; यह ‘गंधक’ के साथ बरसाई गई दूसरी वस्तु है।
- source_word: עַל
  choice: पर
  rationale: यहाँ यह पूर्वसर्ग उस स्थान को बताता है जिस पर दण्ड बरसाया गया।
- source_word: סְדֹם וְעֲמֹרָה
  choice: सदोम और अमोरा
  rationale: इन स्थान-नामों के हिन्दी में परिचित बाइबलीय रूप चुने गए हैं।
- source_word: מֵאֵת יְהוָה
  choice: याहवे की ओर से
  rationale: यह वाक्यांश स्रोत अथवा उद्गम बताता है। असामान्य लगने पर भी परमेश्वर-नाम की पुनरावृत्ति हटाई या व्याख्यात्मक रूप से सरल नहीं की गई।
- source_word: מִן הַשָּׁמַיִם
  choice: आकाश से
  rationale: सन्दर्भ में इसका अर्थ ऊपर स्थित आकाश से है। इब्रानी शब्द का रूप बहुवचन है, पर हिन्दी में ‘आकाशों से’ अस्वाभाविक होता; इसलिए अर्थ और सहजता के लिए मानक एकवचन सामूहिक रूप रखा गया है।
- source_word: וַ
  choice: तब
  rationale: आरम्भिक वाव कथा को अगले क्रमिक कार्य की ओर बढ़ाता है; ‘तब’ आधुनिक हिन्दी में यह क्रम स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘याहवे ने … याहवे की ओर से’ में परमेश्वर-नाम की पुनरावृत्ति
  choice: मुख्य पाठ में दोनों बार ‘याहवे’ रखकर पुनरावृत्ति को सुरक्षित रखना।
  alternative: दूसरी आवृत्ति हटाकर केवल ‘याहवे ने … आकाश से बरसाई’ कहना, अथवा उसे ‘अपने पास से’ के रूप में समझाकर लिखना।
  rationale: इब्रानी पाठ YHWH को स्पष्ट रूप से दोहराता है। इसे हटाना या किसी विशिष्ट धर्मवैज्ञानिक व्याख्या में बदलना मूल पाठ की असामान्यता और सम्भावित अर्थगत तनाव को मिटा देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य के अन्त में डैश असामान्य किन्तु स्रोत-संगत ‘याहवे की ओर से’ वाक्यांश को स्पष्ट रूप से जोड़ता है, जबकि अल्पविराम ‘आकाश से’ को उसी उद्गम-वर्णन के साथ रखता है।
