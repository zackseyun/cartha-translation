  text: וַ/תַּבֵּ֥ט אִשְׁתּ֖/וֹ מֵ/אַחֲרָ֑י/ו וַ/תְּהִ֖י נְצִ֥יב מֶֽלַח׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/026.yaml
  text: But his wife looked back from behind him[b][a], and she became a pillar of salt.
translation:
  language: hi
  text: लेकिन उसकी पत्नी ने उसके पीछे से मुड़कर देखा[a], और वह नमक का एक खंभा बन गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके पीछे से देखा।” इब्रानी वाक्यांश उसकी स्थिति—उसके पीछे—पर बल दे सकता है, जबकि प्रसंग में पीछे की ओर देखने का भाव भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: मुड़कर देखा
  rationale: נבט का मूल अर्थ ‘देखना/निहारना’ है। इस प्रसंग में מֵאַחֲרָיו के साथ ‘मुड़कर देखा’ स्वाभाविक हिन्दी में पीछे की ओर देखने की क्रिया व्यक्त करता है, पर उसकी मंशा नहीं बताता।
- source_word: אִשְׁתּוֹ
  choice: उसकी पत्नी
  rationale: पुल्लिंग एकवचन संबंधवाचक प्रत्यय सहित यह पद सीधे ‘उसकी पत्नी’ का अर्थ देता है; प्रसंग में ‘उसकी’ का संकेत लूत की ओर है।
- source_word: מֵאַחֲרָיו
  choice: उसके पीछे से
  rationale: מִן + אַחַר और प्रत्यय का निकट अर्थ ‘उसके पीछे से’ है। यह लूत के सापेक्ष पत्नी की स्थिति को बनाए रखता है और पीछे देखने के प्रसंगगत अर्थ के साथ भी संगत है।
- source_word: וַתְּהִי
  choice: बन गई
  rationale: कथात्मक क्रम में היה यहाँ किसी परिणामी अवस्था या परिवर्तन को व्यक्त करता है; इसलिए केवल ‘थी’ की अपेक्षा ‘बन गई’ अधिक उपयुक्त है।
- source_word: נְצִיב מֶלַח
  choice: नमक का एक खंभा
  rationale: נְצִיב किसी खड़ी या स्थापित वस्तु के लिए प्रयुक्त हो सकता है, और מֶלַח के साथ ‘नमक का खंभा’ हिन्दी में स्पष्ट तथा पारंपरिक रूप से स्वाभाविक है। अनिश्चित संज्ञा को हिन्दी में सहज बनाने के लिए ‘एक’ रखा गया है।
theological_decisions:
- issue: लूत की पत्नी के परिवर्तन का स्वरूप
  choice: ‘वह नमक का एक खंभा बन गई’—वास्तविक बनने की कथात्मक अभिव्यक्ति को सीधे रखा गया है।
  alternative: ‘वह नमक के खंभे जैसी हो गई’ या ‘वह नमक के खंभे के रूप में वहीं रह गई’
  rationale: इब्रानी में तुलना सूचक कोई चिह्न नहीं है। उपमा जोड़ने या घटना को केवल दृश्य अवस्था मानने से पाठ से परे व्याख्या आ जाएगी।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘उसके पीछे से’ मूल वाक्यांश की वास्तविक अस्पष्टता बनाए रखता है; ‘मुड़कर देखा’ हिन्दी में प्रसंगगत क्रिया को स्वाभाविक बनाता है।
