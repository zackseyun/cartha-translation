source:
  edition: WLC
  text: וַֽ/יַּהֲפֹךְ֙ אֶת הֶ/עָרִ֣ים הָ/אֵ֔ל וְ/אֵ֖ת כָּל הַ/כִּכָּ֑ר וְ/אֵת֙ כָּל יֹשְׁבֵ֣י הֶ/עָרִ֔ים וְ/צֶ֖מַח הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/025.yaml
  text: And he overthrew those cities[a], and all the plain, and all the inhabitants of the cities[b], and the vegetation of the ground.
translation:
  language: hi
  text: और उसने उन नगरों, उस पूरे मैदानी क्षेत्र[b], उन नगरों के सभी निवासियों और भूमि की सारी वनस्पति को उलट दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उलट-पलट कर दिया।’ इब्रानी क्रिया विनाशकारी रूप से उलट देने पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘मैदानी क्षेत्र’ से इस संदर्भ में यरदन के मैदान के इलाके का आशय है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: उलट दिया
  rationale: הפך का मूल चित्र विनाशकारी रूप से उलट देने का है। ‘उलट दिया’ इस ठोस बिंब को बचाता है; केवल ‘नष्ट कर दिया’ अधिक सामान्य होता।
- source_word: הֶעָרִים הָאֵל
  choice: उन नगरों
  rationale: אֵל पहले से चर्चित विशिष्ट नगरों की ओर संकेत करता है; हिंदी कथा-प्रवाह में ‘उन नगरों’ स्वाभाविक है।
- source_word: כָּל הַכִּכָּר
  choice: उस पूरे मैदानी क्षेत्र
  rationale: כִּכָּר यहाँ यरदन के मैदानी भूभाग अथवा जिले को सूचित करता है। ‘मैदानी क्षेत्र’ भौगोलिक आशय को स्पष्ट रखते हुए ‘वृत्त’ जैसे भ्रामक शब्दशः अनुवाद से बचता है।
- source_word: כָּל יֹשְׁבֵי הֶעָרִים
  choice: उन नगरों के सभी निवासियों
  rationale: ישב का कृदंत रूप नगरों में रहने वाले लोगों को दर्शाता है; ‘निवासियों’ संक्षिप्त, सहज और सटीक है।
- source_word: צֶמַח הָאֲדָמָה
  choice: भूमि पर उगी सारी वनस्पति
  rationale: צֶמַח उगी हुई वनस्पति और אֲדָמָה मिट्टी या भूमि को दर्शाता है। यह अभिव्यक्ति हिंदी में स्वाभाविक रहते हुए मूल के भौतिक-अग्रिकultural अर्थ को सुरक्षित रखती है।
theological_decisions:
- issue: एकवचन क्रिया का निहित कर्ता
  choice: ‘उसने’ रखा गया और कर्ता का नाम इस पद में नहीं जोड़ा गया।
  alternative: ‘यहोवा ने’ या ‘परमेश्वर ने’ स्पष्ट करना।
  rationale: इब्रानी पद में क्रिया एकवचन है, पर इसी उपवाक्य में कर्ता व्यक्त नहीं है; पूर्ववर्ती संदर्भ कर्ता की पहचान कराता है। सर्वनाम मूल की अभिव्यक्ति और संदर्भगत स्पष्टता दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। मुख्य क्रिया में मूल का ठोस ‘उलटने’ वाला बिंब रखा गया है। सूची को हिंदी में स्वाभाविक बनाने के लिए डैश और ‘को भी’ का प्रयोग किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
