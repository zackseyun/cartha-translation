source:
  edition: WLC
  text: וַ/יַּשְׁקֵ֗ף עַל פְּנֵ֤י סְדֹם֙ וַ/עֲמֹרָ֔ה וְ/עַֽל כָּל פְּנֵ֖י אֶ֣רֶץ הַ/כִּכָּ֑ר וַ/יַּ֗רְא וְ/הִנֵּ֤ה עָלָה֙ קִיטֹ֣ר הָ/אָ֔רֶץ כְּ/קִיטֹ֖ר הַ/כִּבְשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/028.yaml
  text: And he looked out over Sodom and Gomorrah and over all the land of the plain[a], and he saw, and behold, smoke was rising from the land like the smoke of a furnace.
translation:
  language: hi
  text: उसने सदोम और अमोरा तथा पूरे मैदानी प्रदेश पर दृष्टि डाली। उसने देखा—और देखो, उस देश से धुआँ भट्ठी[a] के धुएँ के समान उठ रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भट्ठे’।
    reason: כִּבְשָׁן का अर्थ धातु गलाने वाली भट्ठी अथवा ईंट आदि पकाने वाला भट्ठा हो सकता है।
lexical_decisions:
- source_word: וַיַּשְׁקֵף עַל־פְּנֵי
  choice: पर दृष्टि डाली
  rationale: यह क्रिया किसी ऊँचे स्थान से सामने या नीचे फैले क्षेत्र को देखने का भाव रखती है। ‘पर दृष्टि डाली’ स्वाभाविक हिंदी में व्यापक क्षेत्र का अवलोकन व्यक्त करता है, बिना दिशा को अनावश्यक रूप से अधिक निश्चित किए।
- source_word: סְדֹם וַעֲמֹרָה
  choice: सदोम और अमोरा
  rationale: ये स्थान-नाम हिंदी बाइबल परंपरा में प्रचलित और मूल उच्चारण के निकट रूपों में दिए गए हैं।
- source_word: כָּל־פְּנֵי אֶרֶץ הַכִּכָּר
  choice: पूरा मैदानी प्रदेश
  rationale: כִּכָּר यहाँ यरदन के विस्तृत समतल क्षेत्र को सूचित करता है। ‘मैदानी प्रदेश’ भौगोलिक अर्थ को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: וַיַּרְא וְהִנֵּה
  choice: उसने देखा—और देखो
  rationale: यह रूप कथानक की क्रमिकता और הִנֵּה से आने वाली अचानक, सजीव अनुभूति—दोनों को बनाए रखता है।
- source_word: עָלָה קִיטֹר הָאָרֶץ
  choice: उस देश से धुआँ … उठ रहा था
  rationale: ‘उठ रहा था’ अब्राहम के सामने दिखाई दे रहे निरंतर दृश्य को स्वाभाविक हिंदी में व्यक्त करता है; הָאָרֶץ को स्थानीय संदर्भ के कारण ‘उस देश’ कहा गया है।
- source_word: כְּקִיטֹר הַכִּבְשָׁן
  choice: भट्ठी के धुएँ के समान
  rationale: כִּבְשָׁן ऐसी संरचना को सूचित कर सकता है जिसमें तीव्र ताप पर सामग्री पकाई या गलायी जाती है। ‘भट्ठी’ हिंदी में परिचित और पर्याप्त व्यापक शब्द है; अधिक विशिष्ट विकल्प पादटिप्पणी में रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘और देखो’ मूल के सजीव संकेतक को बनाए रखता है। पादटिप्पणी का चिह्न उसी शब्द के बाद रखा गया है जिससे उसका संबंध है।
