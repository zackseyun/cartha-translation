  text: וַ/תַּשְׁקֶ֧יןָ אֶת אֲבִי/הֶ֛ן יַ֖יִן בַּ/לַּ֣יְלָה ה֑וּא וַ/תָּבֹ֤א הַ/בְּכִירָה֙ וַ/תִּשְׁכַּ֣ב אֶת אָבִ֔י/הָ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קׄוּמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/033.yaml
  text: So they gave their father wine to drink that night[a], and the firstborn went in and lay with her father. He did not know when she lay down or when she arose.
translation:
  language: hi
  text: तब उस रात उन्होंने अपने पिता को दाख की मदिरा पिलाई, और पहली बेटी भीतर गई और अपने पिता के साथ लेट गई। उसे न तो उसके लेटने का पता चला, न उसके उठने का।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: उन्होंने ... पिलाया
  rationale: हिफ़ील रूप का कारक अर्थ है ‘पीने को देना/पिलाना’; हिन्दी में ‘दाखमधु पिलाया’ स्वाभाविक और सटीक है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: יין का मानक अर्थ मदिरायुक्त दाखरस है; गरिमापूर्ण आधुनिक हिन्दी में ‘दाखमधु’ इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: בַּלַּיְלָה הוּא
  choice: उस रात
  rationale: यह निश्चित समयसूचक पद है; ‘उस रात’ सहज हिन्दी है।
- source_word: הַבְּכִירָה
  choice: जेठी बेटी
  rationale: स्त्रीलिंग विशेषण का शाब्दिक अर्थ ‘पहिलौठी’ है; संदर्भ में ‘जेठी बेटी’ जन्मक्रम और पात्र की पहचान दोनों को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: וַתָּבֹא
  choice: भीतर गई
  rationale: क्रिया का मूल अर्थ ‘आई/प्रवेश किया’ है; इस कथा-दृष्टि और हिन्दी प्रयोग में ‘भीतर गई’ प्रवेश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַתִּשְׁכַּב אֶת
  choice: के साथ लेट गई
  rationale: यह यौन संबंध के लिए प्रयुक्त संयत इब्रानी अभिव्यक्ति है; ‘के साथ लेट गई’ उसी शिष्ट संकेतात्मक शैली को बनाए रखता है।
- source_word: וְלֹא יָדַע
  choice: उसे ... पता नहीं चला
  rationale: ידע यहाँ चेतना या जानकारी होने का अर्थ देता है; हिन्दी में यह प्रयोग मूल आशय को सहजता से व्यक्त करता है।
- source_word: בְּשִׁכְבָהּ וּבְקוּמָהּ
  choice: न तो उसके लेटने का ... न उसके उठने का
  rationale: दोनों पूर्वसर्गयुक्त क्रियार्थक पद घटना के समय/उसकी अनुभूति को बताते हैं; समानांतर हिन्दी संरचना मूल का संतुलन बनाए रखती है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। यौन क्रिया के लिए मूल की संकेतात्मक भाषा को स्पष्ट किए बिना उसी संयत रूप में रखा गया है।
