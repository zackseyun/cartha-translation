  yaml_path: translation/ot/genesis/019/018.yaml
  text: But Lot said to them[a], “No, please, my lords.”
translation:
  language: hi
  text: पर लूत ने उनसे कहा, “नहीं, कृपा करके, मेरे प्रभुओ![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नहीं, कृपा करके, मेरे प्रभु!” हिब्रू रूप אֲדֹנָי को कुछ व्याख्याओं में एकवचन आदरसूचक संबोधन समझा जा सकता है, पर यहाँ “उनसे” और दो आगंतुकों का संदर्भ “मेरे प्रभुओ” के पक्ष में है।
    reason: वैकल्पिक पाठ-समझ
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: लेकिन ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; यहाँ लूत पिछले निर्देश पर आपत्ति जता रहा है, इसलिए संदर्भ में विरोधसूचक ‘लेकिन’ स्वाभाविक है।
- source_word: לוֹט
  choice: लूत
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबल-परंपरा के अनुरूप लिप्यंतरण।
- source_word: אֲלֵהֶם
  choice: उनसे
  rationale: पूर्वसर्ग אֶל के साथ तृतीय पुरुष पुल्लिंग बहुवचन प्रत्यय का सीधा अर्थ ‘उनसे’ है; मूल की सर्वनामात्मक अभिव्यक्ति बनाए रखी गई है।
- source_word: אַל
  choice: नहीं
  rationale: यद्यपि यह सामान्यतः निषेधात्मक अव्यय है, यहाँ क्रियारहित विनती में पिछले प्रस्ताव को अस्वीकार करने वाला स्वाभाविक हिन्दी उत्तर ‘नहीं’ है।
- source_word: נָא
  choice: कृपा करके
  rationale: यह विनती और नम्र आग्रह का भाव व्यक्त करता है; ‘कृपा करके’ आधुनिक, गरिमापूर्ण हिन्दी में उस भाव को स्पष्ट रखता है।
- source_word: אֲדֹנָי
  choice: मेरे प्रभुओ
  rationale: ‘उनसे’ और दो आगंतुकों के निकट संदर्भ के कारण इसे बहुवचन संबोधन माना गया है। ‘मेरे प्रभुओ’ אֲדוֹן की शाब्दिक गरिमा और बहुवचन दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: क्या אֲדֹנָי यहाँ दो आगंतुकों के लिए बहुवचन संबोधन है या परमेश्वर के लिए एकवचन उपाधि
  choice: 'दो आगंतुकों के लिए बहुवचन संबोधन: ‘मेरे प्रभुओ’'
  alternative: ‘मेरे प्रभु’—एकवचन सम्मानसूचक अथवा ईश्वरीय संबोधन
  rationale: अभीष्ट व्यक्ति बहुवचन हैं, जैसा אֲלֵהֶם (‘उनसे’) और निकट प्रसंग दिखाते हैं; इसलिए मुख्य पाठ में बहुवचन अधिक संभावित है। फिर भी हिब्रू रूप की वैकल्पिक एकवचन समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य संक्षिप्त, विनम्र और गरिमापूर्ण रखा गया है। ‘प्रभुओ’ अपेक्षाकृत औपचारिक है, पर मूल के संबोधन और बहुवचन को ‘सज्जनो’ की तुलना में अधिक निकटता से व्यक्त करता है।
