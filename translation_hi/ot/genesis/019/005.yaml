base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/005.yaml
  text: And they called to Lot and said to him[a], “Where are the men who came to you tonight? Bring them out to us so that we may know them.”
translation:
  language: hi
  text: उन्होंने लूत को पुकारा और उससे कहा, “वे पुरुष कहाँ हैं जो आज रात तुम्हारे पास आए थे? उन्हें बाहर हमारे पास ले आओ, ताकि हम उन्हें जानें।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, इस प्रसंग में अधिक स्पष्ट रूप से, “ताकि हम उनके साथ यौन-संबंध बनाएँ।” इब्रानी में शाब्दिक रूप से “उन्हें जानें” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־לוֹט
  choice: उन्होंने लूत को पुकारकर कहा
  rationale: קרא אל का अर्थ किसी को पुकारना है। संयुक्त हिन्दी वाक्य कथात्मक प्रवाह को स्वाभाविक रखते हुए पुकारने और कहने, दोनों क्रियाओं को सुरक्षित रखता है।
- source_word: הָאֲנָשִׁים
  choice: वे पुरुष
  rationale: यह पुल्लिंग बहुवचन संज्ञा यहाँ पुरुष आगंतुकों को निर्दिष्ट करती है; इसलिए अस्पष्ट ‘लोग’ के बजाय ‘पुरुष’ सटीक है।
- source_word: בָּאוּ אֵלֶיךָ הַלָּיְלָה
  choice: जो आज रात तुम्हारे पास आए थे
  rationale: हिन्दी में ‘आज रात’ הַלָּיְלָה का स्वाभाविक समतुल्य है; ‘आए थे’ वर्तमान प्रश्न से पहले घटित आगमन को स्पष्ट करता है।
- source_word: הוֹצִיאֵם אֵלֵינוּ
  choice: उन्हें बाहर हमारे पास ले आओ
  rationale: יצא के हिफ़ील रूप में बाहर निकालने या ले आने का कारक भाव है। यह अनुवाद बाहर लाने और भीड़ तक पहुँचाने, दोनों दिशात्मक तत्वों को बनाए रखता है।
- source_word: וְנֵדְעָה אֹתָם
  choice: ताकि हम उन्हें जानें
  rationale: ידע का मूल अर्थ ‘जानना’ है। स्रोत की शब्दावली और उसकी तनावपूर्ण अर्थ-परत को मुख्य पाठ में रखा गया है; प्रसंगगत यौन आशय पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: וְנֵדְעָה אֹתָם के यौन आशय को मुख्य पाठ में स्पष्ट करना या नहीं
  choice: मुख्य पाठ में शाब्दिक ‘ताकि हम उन्हें जानें’ रखना और प्रसंगगत यौन अर्थ को पादटिप्पणी में बताना
  alternative: ‘ताकि हम उनके साथ यौन-संबंध बनाएँ’ या ‘ताकि हम उनका यौन उत्पीड़न करें’
  rationale: प्रसंग शत्रुतापूर्ण यौन मंशा की ओर प्रबल संकेत करता है, पर इब्रानी में सामान्य क्रिया ידע ही प्रयुक्त है। मुख्य पाठ में उसका रूप बनाए रखने से साहित्यिक अस्पष्टता और स्रोत-पारदर्शिता सुरक्षित रहती है; पादटिप्पणी सम्भावित आशय को पाठक के लिए खोलती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुरुष’ संदर्भ की लैंगिक विशिष्टता बताता है। ‘जानें’ जानबूझकर स्रोत के निकट रखा गया है और उसका प्रसंगगत अर्थ पादटिप्पणी में दिया गया है।
