base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/009.yaml
  text: And they said[a], “Get back!” Then they said, “This one came to live as a foreigner, and now he keeps acting as judge! Now we will treat you worse than them.” And they pressed very hard against the man, against Lot[d][c][b], and came near to break down the door.
translation:
  language: hi
  text: तब उन्होंने कहा[a], “पीछे हट!” फिर वे बोले, “यह तो परदेशी बनकर यहाँ रहने आया था, और अब न्याय करने चला है![b] अब हम तेरे साथ उनसे भी बुरा व्यवहार करेंगे।” तब उन्होंने उस पुरुष, लूत, को बहुत धकेला[c] और द्वार तोड़ने के लिए आगे बढ़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक ओर हट!”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और वह न्याय करता है—न्याय करने को।” क्रिया और उसके infinitive absolute का मेल उसके न्याय करने के दावे पर तिरस्कारपूर्ण बल देता है।
    reason: lexical_alternative
  - marker: c
    text: या “उस पुरुष, लूत, पर बहुत ज़ोर से दबाव डाला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּשׁ הָלְאָה
  choice: पीछे हट!
  rationale: यह मुहावरेदार और शत्रुतापूर्ण आज्ञा है। ‘पीछे हट’ आधुनिक हिन्दी में उसका बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָאֶחָד
  choice: यह एक
  rationale: इब्रानी अभिव्यक्ति का तिरस्कारपूर्ण संकेत बनाए रखता है; हिन्दी में प्रसंग और स्वर से अवमानना स्पष्ट होती है।
- source_word: בָּא לָגוּר
  choice: परदेशी बनकर यहाँ रहने आया था
  rationale: גור किसी स्थान पर गैर-स्थानीय निवासी के रूप में रहने को दर्शाता है। यह अनुवाद आधुनिक पाठक के लिए उस सामाजिक स्थिति को स्पष्ट करता है।
- source_word: וַיִּשְׁפֹּט שָׁפוֹט
  choice: अब न्यायाधीश बन बैठा है
  rationale: सीमित क्रिया के साथ infinitive absolute न्याय करने के आरोप को तीखा करता है। ‘बन बैठा है’ बोलने वालों के रोष और तिरस्कार को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे औपचारिक पद नियुक्ति बताने के।
- source_word: נָרַע לְךָ מֵהֶם
  choice: हम तेरे साथ उन लोगों से भी बुरा करेंगे
  rationale: Hiphil रूप यहाँ हानि या बुराई करने की धमकी देता है। तुलना और धमकी दोनों सुरक्षित रहती हैं।
- source_word: וַיִּפְצְרוּ ... מְאֹד
  choice: बहुत ज़ोर डाला
  rationale: פצר का मूल अर्थ ज़ोर देना या दबाव डालना हो सकता है; מְאֹד उसे तीव्र करता है। यह हिन्दी शारीरिक दबाव के अनुकूल है, पर क्रिया की सम्भव अर्थ-व्याप्ति को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: בָאִישׁ בְּלוֹט
  choice: उस पुरुष पर—लूत पर—
  rationale: दोहराए गए בְ और apposition को डैश के साथ रखा गया है, जिससे लूत पर केंद्रित इब्रानी बल बना रहता है।
- source_word: וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת
  choice: द्वार तोड़ने के लिए आगे बढ़े
  rationale: नגשׁ और infinitive उद्देश्यपूर्ण ढंग से पास आने को दर्शाते हैं; ‘आगे बढ़े’ उस गति और मंशा को स्वाभाविक हिन्दी में व्यक्त करता है।
