  edition: WLC
  text: וַֽ/יִּתְמַהְמָ֓הּ וַ/יַּחֲזִ֨קוּ הָ/אֲנָשִׁ֜ים בְּ/יָד֣/וֹ וּ/בְ/יַד אִשְׁתּ֗/וֹ וּ/בְ/יַד֙ שְׁתֵּ֣י בְנֹתָ֔י/ו בְּ/חֶמְלַ֥ת יְהוָ֖ה עָלָ֑י/ו וַ/יֹּצִאֻ֥/הוּ וַ/יַּנִּחֻ֖/הוּ מִ/ח֥וּץ לָ/עִֽיר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/016.yaml
  text: But he lingered[a], so the men seized his hand, his wife’s hand, and the hands of his two daughters, because of Yahweh’s compassion for him[b]; and they brought him out and set him outside the city.
translation:
  language: hi
  text: पर वह देर करता रहा। तब उन पुरुषों ने उसका हाथ, उसकी पत्नी का हाथ और उसकी दोनों बेटियों के हाथ पकड़ लिए, क्योंकि यहोवा को उस पर दया आई थी; और वे उसे बाहर निकालकर नगर के बाहर रख दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְמַהְמָהּ
  choice: वह देर करता रहा
  rationale: क्रिया का अर्थ केवल मन में हिचकिचाना नहीं, बल्कि तत्काल निकलने में विलंब करना है; यह वाक्यांश कथा की तात्कालिकता और उसके ठहराव दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָאֲנָשִׁים
  choice: उन पुरुषों
  rationale: इस पद में इब्रानी पाठ साधारण कथात्मक पद ‘पुरुषों’ का उपयोग करता है। व्यापक संदर्भ में वे स्वर्गदूत हैं, पर मुख्य पाठ में स्रोत की अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: וַיַּחֲזִקוּ
  choice: पकड़ लिए
  rationale: इस रचना में חזק दृढ़ता से थामने का भाव देता है। ‘पकड़ लिए’ आधुनिक हिन्दी में स्वाभाविक है और बचाव की तात्कालिक कार्रवाई व्यक्त करता है।
- source_word: בְּיָדוֹ ... וּבְיַד אִשְׁתּוֹ ... וּבְיַד שְׁתֵּי בְנֹתָיו
  choice: उसका हाथ, उसकी पत्नी का हाथ और उसकी दोनों बेटियों के हाथ
  rationale: इब्रानी में ‘हाथ’ की पुनरावृत्ति को यथासंभव रखा गया है; बेटियों के लिए बहुवचन हिन्दी में यह स्पष्ट करता है कि दोनों को हाथ पकड़कर निकाला गया।
- source_word: בְּחֶמְלַת יְהוָה עָלָיו
  choice: क्योंकि यहोवा को उस पर दया आई थी
  rationale: חמלה दया, करुणा अथवा तरस का भाव रखता है और ב यहाँ कारण बताता है। यह रूप परमेश्वर की दया को बचाव का कारण स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וַיֹּצִאֻהוּ
  choice: उसे निकालकर
  rationale: יצא के हिफ़ील रूप का अर्थ किसी को बाहर ले जाना अथवा निकालना है; संयुक्त क्रिया हिन्दी में क्रियाओं के क्रम को सहज बनाती है।
- source_word: וַיַּנִּחֻהוּ
  choice: वहाँ छोड़ दिया
  rationale: נוח के हिफ़ील का यहाँ अर्थ किसी स्थान पर रख देना या ठहरा देना है। ‘वहाँ छोड़ दिया’ नगर के बाहर पहुँचाकर सुरक्षित स्थान पर छोड़ने का परिणाम स्वाभाविक हिन्दी में बताता है, बिना परित्याग को आवश्यक अर्थ बनाए।
- source_word: מִחוּץ לָעִיר
  choice: नगर के बाहर
  rationale: यह पदबंध नगर की सीमा के बाहर का स्थान सूचित करता है।
theological_decisions:
- issue: बचाने वालों की कथात्मक पहचान
  choice: उन पुरुषों
  alternative: उन स्वर्गदूतों
  rationale: यद्यपि व्यापक प्रसंग इन व्यक्तियों को स्वर्गदूत के रूप में पहचानता है, इस पद का इब्रानी पाठ ‘पुरुषों’ कहता है। अनुवाद स्रोत-पाठ की कथात्मक शब्दावली और उसकी अंतर्निहित तनावपूर्ण पहचान को बनाए रखता है।
- issue: यहोवा की करुणा का कारणात्मक संबंध
  choice: क्योंकि यहोवा को उस पर दया आई थी
  alternative: उस पर यहोवा की दया के कारण
  rationale: दोनों रूप בְּחֶמְלַת का कारणात्मक भाव व्यक्त करते हैं; चुना हुआ रूप सामान्य पाठक के लिए अधिक सहज है और दैवी दया को कार्रवाई का स्पष्ट कारण बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक गद्य। ‘पुरुषों’ स्रोत की शब्दावली को सुरक्षित रखता है; वाक्य में हाथ की पुनरावृत्ति अर्थ की स्पष्टता और इब्रानी संरचना के बीच संतुलन बनाती है।
