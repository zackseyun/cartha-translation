  yaml_path: translation/ot/genesis/019/027.yaml
  text: Abraham rose early in the morning to the place where he had stood before Yahweh[a].
translation:
  language: hi
  text: अब्राहम सुबह तड़के उस स्थान पर गया जहाँ वह याहवे[a] के सामने खड़ा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, ‘याहवे के चेहरे के सामने’; यह मुहावरा ‘याहवे के सामने’ या ‘याहवे की उपस्थिति में’ अर्थ देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: भोर को जल्दी उठा
  rationale: हिफ़िल रूप का अर्थ प्रायः तड़के या जल्दी उठना है। निकटवर्ती בַּבֹּקֶר के साथ यह वाक्यांश सुबह बहुत जल्दी उठने का भाव देता है।
- source_word: בַּבֹּקֶר
  choice: भोर को
  rationale: यह शब्द सुबह को दर्शाता है; וַיַּשְׁכֵּם के साथ ‘भोर को जल्दी’ स्वाभाविक हिन्दी में आरम्भिक समय पर बल बनाए रखता है।
- source_word: אֶל הַמָּקוֹם
  choice: उस स्थान पर गया
  rationale: אֶל दिशा या गंतव्य बताता है और מָקוֹם सामान्यतः ‘स्थान’ है। हिन्दी में गति को स्पष्ट करने के लिए ‘गया’ स्वाभाविक रूप से निहित दिशा को व्यक्त करता है।
- source_word: אֲשֶׁר עָמַד שָׁם
  choice: जहाँ वह ... खड़ा हुआ था
  rationale: सम्बन्धवाचक उपवाक्य पिछली घटना की ओर संकेत करता है; ‘हुआ था’ उस पूर्वकालिकता को स्पष्ट करता है, और שָׁם का भाव ‘जहाँ’ में समाहित है।
- source_word: אֶת־פְּנֵי
  choice: के सामने
  rationale: עמד את־פני किसी के सम्मुख या उपस्थिति में खड़े होने का मुहावरा है। ‘के सामने’ संक्षिप्त, स्वाभाविक और अर्थनिष्ठ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम चार अक्षरों वाले नाम के रूप में है। आधुनिक हिन्दी बाइबल-परम्परा में पहचाना जाने वाला रूप ‘यहोवा’ शीर्षक से इसे बदलने के बजाय नाम को प्रत्यक्ष रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, ईश्वरीय व्यक्तिगत नाम है। हिन्दी पाठकों में अधिक परिचित और प्रतिष्ठित लिप्यंतरण ‘यहोवा’ चुना गया है; ‘याहवे’ सम्भावित वैकल्पिक उच्चारण है।
- issue: עמד את־פני में उपस्थिति का भाव
  choice: यहोवा के सामने खड़ा हुआ था
  alternative: यहोवा की उपस्थिति में खड़ा हुआ था
  rationale: ‘के सामने’ हिब्रू मुहावरे की प्रत्यक्षता और सम्बन्धपरक भाव को बनाए रखता है, बिना यह निर्धारित किए कि उपस्थिति किस दृश्य या अदृश्य रीति से थी।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भोर को जल्दी उठा’ आरम्भिक समय के दोहरे हिब्रू संकेत को व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘के सामने’ हिन्दी में मुहावरे का अर्थ स्वाभाविक रूप से देता है।
