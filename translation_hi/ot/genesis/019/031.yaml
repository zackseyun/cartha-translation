translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पहिलौठी’ मूल के जन्मक्रम पर बल को सुरक्षित रखता है, जबकि ‘छोटी’ बहनों के संदर्भ में स्वाभाविक हिन्दी है। यौन आशय को मुख्य पाठ में मूल की तरह शिष्टोक्तिपूर्ण रखा गया है और पादटिप्पणी में स्पष्ट किया गया है।
