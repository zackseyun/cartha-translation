  text: וַ/תֹּ֧אמֶר הַ/בְּכִירָ֛ה אֶל הַ/צְּעִירָ֖ה אָבִ֣י/נוּ זָקֵ֑ן וְ/אִ֨ישׁ אֵ֤ין בָּ/אָ֨רֶץ֙ לָ/ב֣וֹא עָלֵ֔י/נוּ כְּ/דֶ֖רֶךְ כָּל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/031.yaml
  text: And the firstborn said to the younger[a], “Our father is old[b], and there is not a man in the land to come in to us according to the way of all the earth.”
translation:
  language: hi
  text: तब पहली बेटी ने छोटी बेटी से कहा, “हमारा पिता वृद्ध है, और इस देश में कोई पुरुष नहीं है जो सारी पृथ्वी की रीति के अनुसार हमारे पास आए[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “हमारे पास आए” यौन-संबंध के लिए प्रयुक्त इब्रानी शिष्टोक्ति है। “सारी पृथ्वी की रीति” से आशय सामान्य मानवीय प्रथा से है, विशेषकर स्त्री-पुरुष के संबंध और वंश को आगे बढ़ाने के संदर्भ में।
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: הַבְּכִירָה
  choice: पहिलौठी
  rationale: यह स्त्रीलिंग रूप जन्मक्रम में पहली संतान को दर्शाता है। ‘पहिलौठी’ लूत की बेटियों के पारिवारिक संदर्भ और इब्रानी के जन्मक्रम-संबंधी बल को बनाए रखता है।
- source_word: הַצְּעִירָה
  choice: छोटी
  rationale: यह स्त्रीलिंग विशेषण अपेक्षाकृत छोटी या कम आयु वाली को दर्शाता है। ‘छोटी’ आधुनिक हिन्दी में बहनों के संदर्भ में स्वाभाविक है।
- source_word: אָבִינוּ זָקֵן
  choice: हमारा पिता बूढ़ा हो गया है
  rationale: यह इब्रानी विधेयात्मक वाक्य पिता की वृद्ध अवस्था बताता है। ‘बूढ़ा हो गया है’ वर्तमान स्थिति के साथ वृद्ध होने की परिणति को भी स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאִישׁ אֵין בָּאָרֶץ
  choice: और इस देश में कोई पुरुष नहीं है
  rationale: אִישׁ का पुरुष-संदर्भ प्रजनन के प्रसंग में महत्त्वपूर्ण है। בָאָרֶץ को ‘इस देश में’ कहना वक्ताओं के दृष्टिकोण से स्वाभाविक है और ‘पूरी पृथ्वी पर कोई पुरुष नहीं’ जैसी अनावश्यक सार्वभौमिक व्याख्या से बचाता है।
- source_word: לָבוֹא עָלֵינוּ
  choice: हमारे पास आए
  rationale: मूल में यौन-संबंध के लिए प्रयुक्त शिष्टोक्ति है। हिन्दी में ‘हमारे पास आए’ शिष्टोक्ति को बनाए रखती है; उसका प्रसंगगत अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כְּדֶרֶךְ כָּל הָאָרֶץ
  choice: सारी पृथ्वी की रीति के अनुसार
  rationale: यह निकट-औपचारिक रूप सामान्य मानवीय रीति या प्रचलन को व्यक्त करता है और मूल की व्यापक अभिव्यक्ति को सुरक्षित रखता है।
