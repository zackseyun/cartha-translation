  text: וַ/יֵּצֵ֨א ל֜וֹט וַ/יְדַבֵּ֣ר אֶל חֲתָנָ֣י/ו לֹקְחֵ֣י בְנֹתָ֗י/ו וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִן הַ/מָּק֣וֹם הַ/זֶּ֔ה כִּֽי מַשְׁחִ֥ית יְהוָ֖ה אֶת הָ/עִ֑יר וַ/יְהִ֥י כִ/מְצַחֵ֖ק בְּ/עֵינֵ֥י חֲתָנָֽי/ו׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/014.yaml
  text: So Lot went out and spoke to his sons-in-law[a], who were to marry his daughters, and said, “Get up, get out of this place[b], because Yahweh is about to destroy the city.” But he seemed to his sons-in-law to be joking.
translation:
  language: hi
  text: तब लूत बाहर गया और अपने दामादों[a] से, जिनका उसकी बेटियों से विवाह होने वाला था, कहा, “उठो, इस जगह से निकल जाओ, क्योंकि याहवे इस नगर को नष्ट करने वाला है।” लेकिन उसके दामादों को लगा कि वह मज़ाक कर रहा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने दामादों से, जो उसकी बेटियों से विवाह कर चुके थे।” इब्रानी वाक्यांश उन पुरुषों के लिए प्रयुक्त हो सकता है जिनका विवाह हो चुका था या जिनसे विवाह होने वाला था।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “अपने दामादों की दृष्टि में वह मज़ाक करने वाले के समान था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲתָנָיו / לֹקְחֵי בְנֹתָיו
  choice: अपने दामादों से, जिन्हें उसकी बेटियों से विवाह करना था
  rationale: חָתָן का अर्थ दामाद या वर हो सकता है, और सहभागी रूप לֹקְחֵי विवाह-संबंध लेने की प्रक्रिया या नियत विवाह को सूचित कर सकता है। मुख्य पाठ आगामी विवाह की स्वाभाविक हिन्दी अभिव्यक्ति देता है, जबकि दूसरी सम्भावना पादटिप्पणी में रखी गई है।
- source_word: קוּמוּ צְאוּ
  choice: उठो, इस जगह से निकल जाओ
  rationale: दोनों आज्ञार्थक क्रियाओं की तात्कालिकता और संक्षिप्त बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: מַשְׁחִית
  choice: नष्ट करनेवाला है
  rationale: हिफ़ील सहभागी रूप निकट भविष्य में होनेवाली विनाशकारी कार्रवाई को व्यक्त करता है; यह अनुवाद उस आसन्नता को प्रसंगानुकूल रूप से दर्शाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיְהִי כִמְצַחֵק בְּעֵינֵי חֲתָנָיו
  choice: उसके दामादों को लगा कि वह मज़ाक कर रहा है
  rationale: ‘उनकी दृष्टि में वह मज़ाक करनेवाले के समान था’ मुहावरे का स्वाभाविक हिन्दी रूप, जो उनकी धारणा बताता है और उपहास का अतिरिक्त अर्थ नहीं जोड़ता।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; इसलिए उसे उपाधि से प्रतिस्थापित किए बिना निकट हिन्दी लिप्यंतरण में रखा गया है।
- issue: लूत की बेटियों और इन पुरुषों के वैवाहिक संबंध की अवस्था
  choice: जिन्हें उसकी बेटियों से विवाह करना था
  alternative: जो उसकी बेटियों से विवाह कर चुके थे
  rationale: इब्रानी सहभागी वाक्यांश दोनों अर्थों की सम्भावना रखता है। अगले पद में बेटियों के लूत के घर में होने के कारण आगामी विवाह मुख्य पाठ में अधिक प्रसंगानुकूल है, पर वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लूत की चेतावनी में छोटे आज्ञार्थक वाक्यों द्वारा तात्कालिकता बनी रहती है; वैवाहिक स्थिति की वास्तविक इब्रानी अस्पष्टता पादटिप्पणी में सुरक्षित है।
