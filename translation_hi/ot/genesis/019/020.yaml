  yaml_path: translation/ot/genesis/019/020.yaml
  text: Look[a], please, this city is near enough to flee there, and it is small[b]. Please let me escape there—is it not small? Then my life will live.
translation:
  language: hi
  text: देखिए, कृपया, यह नगर वहाँ भाग जाने के लिए पर्याप्त पास है, और यह छोटा-सा है। कृपया मुझे वहाँ भाग जाने दीजिए—क्या यह छोटा-सा नहीं है?—ताकि मैं जीवित रहूँ।
  philosophy: optimal-equivalence
