- source_word: מִצְעָר
  choice: छोटा-सा
  rationale: लघुता का अर्थ और लूत की विनती में उसका न्यूनत्व दिखाता है; दोनों occurrences में पुनरावृत्ति रखी गई है।
- source_word: אִמָּלְטָה נָּא שָׁמָּה
  choice: कृपया मुझे वहाँ भाग जाने दीजिए
  rationale: कोहोर्टेटिव रूप को अनुमति और उत्कट विनती के रूप में स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: וּתְחִי נַפְשִׁי
  choice: ताकि मैं जीवित रहूँ
  rationale: נפש यहाँ व्यक्ति के लिए परोक्ष सर्वनामवत प्रयुक्त है, और waw पूर्ववर्ती विनती का उद्देश्य अथवा परिणाम बताता है; अतः अर्थगत मुहावरा अक्षरशः अस्वाभाविक ‘मेरा प्राण जीवित रहे’ से अधिक स्पष्ट है।
