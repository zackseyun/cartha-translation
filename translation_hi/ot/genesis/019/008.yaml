source:
  edition: WLC
  text: הִנֵּה נָ֨א לִ֜/י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה נָּ֤א אֶתְ/הֶן֙ אֲלֵי/כֶ֔ם וַ/עֲשׂ֣וּ לָ/הֶ֔ן כַּ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם רַ֠ק לָֽ/אֲנָשִׁ֤ים הָ/אֵל֙ אַל תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי עַל כֵּ֥ן בָּ֖אוּ בְּ/צֵ֥ל קֹרָתִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/008.yaml
  text: Look[a], please, I have two daughters who have not known a man. Please let me bring them out to you, and do to them as is good in your eyes. Only to these men do nothing[c][b], for they have come under the shadow of my roof.
translation:
  language: hi
  text: देखो, कृपा करके, मेरी दो बेटियाँ हैं, जिन्होंने किसी पुरुष को नहीं जाना[a]। कृपा करके, मुझे उन्हें तुम्हारे पास बाहर ले आने दो; और जो तुम्हारी दृष्टि में अच्छा हो, उनके साथ करो। केवल इन पुरुषों के साथ कुछ भी मत करना, क्योंकि वे मेरी छत की छाया में आए हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “किसी पुरुष को नहीं जाना” यौन संबंध न रखने का मुहावरा है; परंपरागत रूप से, “कुँवारी हैं।”
    reason: lexical_alternative
  - marker: b
    text: “मेरी छत की छाया में” अतिथि के मेज़बान के घर और संरक्षण में आने का बिंब है।
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: देखो
  rationale: הִנֵּה तत्काल ध्यान खींचता है; साथ का נָא विनती का भाव देता है, जो आगे के ‘कृपा करके’ और पूरे आग्रहपूर्ण स्वर में स्वाभाविक रूप से व्यक्त होता है।
- source_word: אֲשֶׁר לֹא יָדְעוּ אִישׁ
  choice: जिन्होंने किसी पुरुष को नहीं जाना है
  rationale: मूल इब्रानी के ‘जानना’ वाले यौन-संबंधसूचक मुहावरे को बनाए रखता है और उसे ‘कुँवारी’ कहकर अधिक स्पष्ट या व्याख्यात्मक नहीं बनाता।
- source_word: אוֹצִיאָה נָּא אֶתְהֶן אֲלֵיכֶם
  choice: कृपा करके मैं उन्हें तुम्हारे पास बाहर ले आऊँ
  rationale: सहोर्टेटिव रूप वक्ता की पेशकश/इच्छा और נָא उसकी विनती व्यक्त करता है।
- source_word: וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם
  choice: जो तुम्हारी दृष्टि में अच्छा हो, उनके साथ करो
  rationale: ‘तुम्हारी आँखों में अच्छा’ के इब्रानी मुहावरे का निकट और स्वाभाविक हिन्दी रूप है; कथन की विचलित करने वाली कठोरता को नरम नहीं करता।
- source_word: רַק לָאֲנָשִׁים הָאֵל אַל תַּעֲשׂוּ דָבָר
  choice: केवल इन पुरुषों के साथ कुछ मत करना
  rationale: רַק के अपवादात्मक/सीमित करने वाले बल और पूर्ण निषेध दोनों को स्पष्ट रखता है।
- source_word: כִּי עַל כֵּן בָּאוּ
  choice: क्योंकि वे ... आए हैं
  rationale: 'प्रसंग में कारणसूचक संबंध व्यक्त करता है: उनका उसके आतिथ्य और संरक्षण में आना निषेध का आधार है।'
- source_word: בְּצֵל קֹרָתִי
  choice: मेरी छत की छाया में
  rationale: मूल के ‘छाया’ के बिंब को सुरक्षित रखता है; यह घर आए अतिथियों को मिलने वाले आश्रय और संरक्षण का संकेत है।
theological_decisions:
- issue: लूत की चौंकाने वाली पेशकश को नैतिक पठनीयता के लिए नरम करना या नहीं
  choice: इब्रानी कथन की स्पष्ट और कठोर शक्ति को बनाए रखा गया
  alternative: ‘उनके साथ जैसा चाहो व्यवहार करो’ जैसे अपेक्षाकृत नरम शब्दों में कहना
  rationale: पाठ लूत की पेशकश का वर्णन करता है, उसका नैतिक अनुमोदन नहीं। अनुवाद को न तो उसमें अनुमोदन जोड़ना चाहिए, न उसकी भयावहता घटानी चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। मूल के ‘जानना,’ ‘तुम्हारी दृष्टि में अच्छा,’ और ‘छत की छाया’ जैसे प्रमुख बिंब यथासंभव सुरक्षित हैं।
