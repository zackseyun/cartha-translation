source:
  edition: WLC
  text: וְֽ/אֶת הָ/אֲנָשִׁ֞ים אֲשֶׁר פֶּ֣תַח הַ/בַּ֗יִת הִכּוּ֙ בַּ/סַּנְוֵרִ֔ים מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּלְא֖וּ לִ/מְצֹ֥א הַ/פָּֽתַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/011.yaml
  text: And they struck the men who were at the entrance of the house with blindness[a], from the least to the greatest, so that they wore themselves out trying to find the doorway.
translation:
  language: hi
  text: और उन्होंने घर के प्रवेश-द्वार पर मौजूद पुरुषों को अंधता[a] से ग्रस्त कर दिया, छोटे से बड़े तक; और वे द्वार खोजते-खोजते थक गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चकाचौंध” अथवा “दृष्टि-भ्रम”; यहाँ प्रयुक्त दुर्लभ हिब्रू शब्द साधारण अंधेपन से बढ़कर किसी ऐसी स्थिति का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּ
  choice: मारा
  rationale: हिफ़ील रूप का सामान्य अर्थ ‘मारना/प्रहार करना’ है। यहाँ ‘अंधता से मारा’ अलौकिक दंड पहुँचाने की क्रिया को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: הָאֲנָשִׁים
  choice: पुरुष
  rationale: यह אִישׁ का पुल्लिंग बहुवचन है और प्रसंग में लूत के घर के बाहर खड़े पुरुषों को सूचित करता है।
- source_word: אֲשֶׁר פֶּתַח הַבַּיִת
  choice: जो पुरुष घर के प्रवेश-द्वार पर थे
  rationale: यह वाक्यांश पुरुषों का स्थान बताता है। ‘प्रवेश-द्वार’ פֶּתַח के प्रवेश अथवा द्वार-मुख के अर्थ को स्पष्ट रखता है।
- source_word: בַּסַּנְוֵרִים
  choice: अंधता
  rationale: दुर्लभ शब्द סַנְוֵרִים दृष्टि को अलौकिक रूप से बाधित किए जाने का संकेत देता है। मुख्य पाठ में ‘अंधता’ सबसे स्पष्ट विकल्प है; संभावित चकाचौंध या दृष्टि-भ्रम की बारीकी पादटिप्पणी में रखी गई है।
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: छोटे से लेकर बड़े तक
  rationale: हिब्रू समावेशी युग्म को यथासंभव औपचारिक रूप से सुरक्षित रखा गया है। यह पूरी भीड़ को समेट सकता है; इसे अनिवार्य रूप से केवल आयु या केवल पद में सीमित नहीं किया गया।
- source_word: וַיִּלְאוּ
  choice: थक गए
  rationale: לָאָה थक जाने अथवा श्रांत हो जाने को व्यक्त करता है। ‘खोजते-खोजते थक गए’ निरर्थक प्रयास से उत्पन्न थकावट को सहज हिन्दी में बताता है।
- source_word: לִמְצֹא הַפָּתַח
  choice: द्वार खोजते-खोजते
  rationale: यह उनके लगातार किंतु निष्फल प्रयत्न को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि הַפָּתַח के लिए ‘द्वार’ रखा गया है।
theological_decisions:
- issue: סַנְוֵרִים से सूचित पीड़ा का स्वरूप
  choice: अलौकिक रूप से उत्पन्न अंधता
  alternative: चकाचौंध या दृष्टि-भ्रम
  rationale: कथा में यह पीड़ा उन्हें द्वार खोजने से रोकती है, पर दुर्लभ हिब्रू शब्द का सटीक चिकित्सकीय या अनुभवगत स्वरूप निश्चित नहीं है। इसलिए स्पष्ट अर्थ मुख्य पाठ में और वास्तविक शाब्दिक अनिश्चितता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सरल कथात्मक रूप। ‘प्रवेश-द्वार’ और बाद में ‘द्वार’ मूल में פֶּתַח की पुनरावृत्ति को अर्थगत रूप से बनाए रखते हैं।
