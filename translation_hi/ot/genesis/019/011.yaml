  terminology: ‘पुरुष,’ ‘प्रवेश-द्वार,’ ‘द्वार,’ and ‘अंधता’ appropriately reflect the Hebrew and the audit trail. The footnote suitably preserves the rare term’s possible nuance of dazzling or visual confusion.
