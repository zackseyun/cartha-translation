id: GEN.19.13
reference: Genesis 19:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי מַשְׁחִתִ֣ים אֲנַ֔חְנוּ אֶת הַ/מָּק֖וֹם הַ/זֶּ֑ה כִּֽי גָֽדְלָ֤ה צַעֲקָתָ/ם֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יְשַׁלְּחֵ֥/נוּ יְהוָ֖ה לְ/שַׁחֲתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/013.yaml
  text: For we are about to destroy this place[a], because their outcry has become great before Yahweh, and Yahweh has sent us to destroy it.
translation:
  language: hi
  text: क्योंकि हम इस स्थान को नष्ट करने वाले हैं; उनकी दुहाई[a] याहवे के सामने बहुत बढ़ गई है, और याहवे ने हमें इसे नष्ट करने के लिए भेजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके विरुद्ध उठी दुहाई याहवे के सामने बहुत बढ़ गई है।” हिब्रू रूप का सीधा अर्थ “उनकी दुहाई” है, लेकिन संदर्भ में कई लोग इसे इस स्थान के लोगों के विरुद्ध उठी पुकार समझते हैं।
    reason: सर्वनाम-संबंध की वास्तविक हिब्रू अस्पष्टता और संदर्भगत वैकल्पिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: מַשְׁחִתִים
  choice: नष्ट करने वाले हैं
  rationale: हिफ़ील कृदंत बहुवचन यहाँ निकट भविष्य में होने वाली निश्चित कार्रवाई बताता है; यह स्वाभाविक हिंदी में उसकी आसन्नता बनाए रखता है।
- source_word: הַמָּקוֹם הַזֶּה
  choice: इस स्थान
  rationale: यह מָקוֹם के सामान्य अर्थ और संकेतवाचक הַזֶּה, दोनों को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גָדְלָה
  choice: बहुत बढ़ गई है
  rationale: काल रूप किसी बढ़ोतरी के वर्तमान परिणाम को दर्शाता है; हिंदी पूर्ण वर्तमान उस परिणामात्मक भाव को स्पष्ट करता है।
- source_word: צַעֲקָתָם
  choice: उनकी दुहाई
  rationale: संज्ञा संकट, अन्याय या शिकायत के कारण उठी पुकार का बोध कराती है, और तृतीय पुरुष बहुवचन प्रत्यय का औपचारिक अर्थ ‘उनकी’ है। ‘दुहाई’ न्याय की माँग वाली पुकार के संदर्भ में उपयुक्त है।
- source_word: אֶת־פְּנֵי יְהוָה
  choice: याहवे के सामने
  rationale: यह हिब्रू मुहावरे का स्वाभाविक हिंदी रूप है और परमेश्वर की उपस्थिति में पहुँची शिकायत का न्यायिक भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में उसका निकट लिप्यंतरण दिया गया है।
- source_word: וַיְשַׁלְּחֵנוּ
  choice: ने हमें ... भेजा है
  rationale: यह पूरा हो चुका भेजना वर्तमान मिशन से जुड़ा है; हिंदी पूर्ण वर्तमान उस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְשַׁחֲתָהּ
  choice: इसे नष्ट करने के लिए
  rationale: उद्देश्यसूचक रूप और स्त्रीलिंग प्रत्यय संदर्भ में नगर/स्थान की ओर संकेत करते हैं; निर्जीव संदर्भ में ‘इसे’ स्वाभाविक हिंदी है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: यहाँ मूल पाठ में चार-अक्षरी व्यक्तिगत नाम है। ‘याहवे’ उसे उपाधि में बदले बिना और प्रचलित विद्वत्तापूर्ण उच्चारण के निकट रखते हुए प्रस्तुत करता है।
- issue: צַעֲקָתָם में सर्वनाम-संबंध
  choice: उनकी दुहाई
  alternative: उनके विरुद्ध उठी दुहाई
  rationale: हिब्रू प्रत्यय का सबसे सीधा रूप ‘उनकी’ है, पर संदर्भ में इसे नगरवासियों के विरुद्ध पीड़ितों की पुकार भी समझा जा सकता है। मुख्य पाठ औपचारिक अस्पष्टता रखता है और संदर्भगत अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली रखी गई है। ‘नष्ट करने वाले हैं’ आसन्न कार्रवाई को व्यक्त करता है; ‘दुहाई’ अन्याय के कारण न्याय की माँग करने वाली पुकार का भाव देता है।
