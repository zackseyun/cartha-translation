  edition: WLC
  text: וַ/יְהִי֩ כְ/הוֹצִיאָ֨/ם אֹתָ֜/ם הַ/ח֗וּצָ/ה וַ/יֹּ֨אמֶר֙ הִמָּלֵ֣ט עַל נַפְשֶׁ֔/ךָ אַל תַּבִּ֣יט אַחֲרֶ֔י/ךָ וְ/אַֽל תַּעֲמֹ֖ד בְּ/כָל הַ/כִּכָּ֑ר הָ/הָ֥רָ/ה הִמָּלֵ֖ט פֶּן תִּסָּפֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/017.yaml
  text: And as they brought them outside[a], he said, “Escape for your life. Do not look behind you, and do not stop anywhere in the plain. Escape to the hills[c][b], lest you be swept away.”
translation:
  language: hi
  text: जब वे उन्हें बाहर निकाल लाए, तो उसने कहा, “अपनी जान बचाकर भाग! पीछे मुड़कर मत देखना[a] और इस पूरे मैदानी इलाके में कहीं मत रुकना। पहाड़ की ओर भाग[b], कहीं तू नष्ट न हो जाए[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पीछे मत देखना।”
    reason: मूल पदबंध का अधिक शाब्दिक विकल्प।
  - marker: b
    text: या, “पहाड़ी प्रदेश की ओर भाग।”
    reason: הָהָרָה एक पहाड़ अथवा सामूहिक रूप से पहाड़ी भूभाग को सूचित कर सकता है।
  - marker: c
    text: या, “कहीं तू बह न जाए।”
    reason: נספה आने वाली विपत्ति में बह जाने, मिट जाने, या दूसरों के साथ विनष्ट होने का भाव दे सकता है।
lexical_decisions:
- source_word: הַחוּצָה
  choice: बाहर
  rationale: दिशासूचक रूप नगर या भीतर के स्थान से बाहर ले जाने की गति बताता है; ‘बाहर’ सहज और सटीक हिन्दी है।
- source_word: הִמָּלֵט
  choice: भाग
  rationale: निफ़अल आज्ञार्थक रूप तत्काल बच निकलने का आदेश देता है। दोनों स्थानों पर ‘भाग’ की पुनरावृत्ति मूल की तात्कालिकता और दोहराव को बनाए रखती है।
- source_word: עַל נַפְשֶׁךָ
  choice: अपनी जान बचाकर
  rationale: यह प्राणरक्षा का मुहावरा है; हिन्दी में यह अर्थ और तात्कालिकता दोनों स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַל תַּבִּיט אַחֲרֶיךָ
  choice: पीछे मुड़कर मत देखना
  rationale: शाब्दिक भाव अपने पीछे देखने का है; हिन्दी का सामान्य मुहावरा ‘पीछे मुड़कर देखना’ प्रसंग में स्वाभाविक है।
- source_word: וְאַל תַּעֲמֹד
  choice: कहीं मत रुकना
  rationale: इस चेतावनी में עמד का आशय ठहरने या रुक जाने से है, केवल खड़े होने से नहीं।
- source_word: בְּכָל הַכִּכָּר
  choice: इस पूरे मैदानी इलाके में कहीं
  rationale: כִּכָּר यहाँ यरदन के समतल क्षेत्र को सूचित करता है और בְּכָל का वितरणात्मक बल ‘कहीं’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: הָהָרָה
  choice: पहाड़ की ओर
  rationale: दिशासूचक रूप ऊँचे भूभाग की ओर जाने को बताता है। एकवचन ‘पहाड़’ मूल के व्याकरणिक रूप को रखता है, जबकि पादटिप्पणी सामूहिक भौगोलिक अर्थ बताती है।
- source_word: פֶּן תִּסָּפֶה
  choice: कहीं तू भी नष्ट न हो जाए
  rationale: נספה का निफ़अल रूप आने वाले सामूहिक विनाश में मिट जाने या बहा दिए जाने का भाव रख सकता है। मुख्य पाठ में स्वाभाविक हिन्दी का व्यापक अर्थ रखा गया है।
theological_decisions:
- issue: वक्ता की पहचान
  choice: ‘उसने कहा’
  alternative: ‘उन्होंने कहा’ अथवा स्पष्ट रूप से ‘स्वर्गदूत ने कहा’
  rationale: इब्रानी क्रिया एकवचन है, इसलिए एकवचन वक्ता रखा गया है; पाठ जिस व्यक्ति की ओर संकेत करता है, उसकी पहचान को अनावश्यक रूप से स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। संबोधन मूल के एकवचन के अनुसार ‘तू’ रूप में है; छोटे, आदेशात्मक वाक्य संकट की तात्कालिकता बनाए रखते हैं।
