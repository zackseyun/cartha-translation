  text: וַ/יַּעַל֩ ל֨וֹט מִ/צּ֜וֹעַר וַ/יֵּ֣שֶׁב בָּ/הָ֗ר וּ/שְׁתֵּ֤י בְנֹתָי/ו֙ עִמּ֔/וֹ כִּ֥י יָרֵ֖א לָ/שֶׁ֣בֶת בְּ/צ֑וֹעַר וַ/יֵּ֨שֶׁב֙ בַּ/מְּעָרָ֔ה ה֖וּא וּ/שְׁתֵּ֥י בְנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/030.yaml
  text: Then Lot went up from Zoar and lived in the mountains[a], and his two daughters were with him, because he was afraid to live in Zoar. So he lived in a cave, he and his two daughters.
translation:
  language: hi
  text: तब लूत सोअर से निकलकर पहाड़ी इलाके में ऊपर गया और वहीं रहने लगा। उसकी दोनों बेटियाँ भी उसके साथ थीं, क्योंकि वह सोअर में रहने से डरता था। इसलिए वह अपनी दोनों बेटियों के साथ एक गुफा[a] में रहने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘उस गुफा में’ है। निश्चित उपपद उस खास गुफा को सूचित कर सकता है जिसमें वे रहने लगे थे, हालाँकि हिन्दी में पहली बार उसका उल्लेख करते समय ‘एक गुफा में’ कहना अधिक स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל מִצּוֹעַר
  choice: सोअर से निकलकर ... ऊपर गया
  rationale: עלה की ऊर्ध्वगामी अथवा स्थलाकृतिक दिशा को ‘ऊपर गया’ से बनाए रखा गया है, और מן को स्वाभाविक हिन्दी में ‘से निकलकर’ कहा गया है।
- source_word: וַיֵּשֶׁב בָּהָר
  choice: पहाड़ी इलाके में ... रहने लगा
  rationale: ישב यहाँ निवास को सूचित करता है। एकवचन הַר स्थलरूप के सामूहिक अर्थ में आ सकता है; ‘पहाड़ी इलाका’ हिन्दी में स्वाभाविक है और अनावश्यक बहुवचन से बचता है।
- source_word: וּשְׁתֵּי בְנֹתָיו עִמּוֹ
  choice: उसकी दोनों बेटियाँ भी उसके साथ थीं
  rationale: इब्रानी के क्रियारहित उपवाक्य को स्पष्ट और सहज आधुनिक हिन्दी वाक्य के रूप में व्यक्त किया गया है।
- source_word: כִּי יָרֵא לָשֶׁבֶת בְּצֹעַר
  choice: क्योंकि वह सोअर में रहने से डरता था
  rationale: כִּי कारण बताता है और יָרֵא अवस्था व्यक्त करता है; ‘डरता था’ प्रसंग में स्वाभाविक हिन्दी है।
- source_word: וַיֵּשֶׁב בַּמְּעָרָה
  choice: एक गुफा में रहने लगा
  rationale: मूल में निश्चित उपपद है, पर पहली बार निवास-स्थान का उल्लेख करते समय हिन्दी में ‘एक गुफा’ अधिक स्वाभाविक है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: הוּא וּשְׁתֵּי בְנֹתָיו
  choice: वह अपनी दोनों बेटियों के साथ
  rationale: गुफा के निवासियों पर मूल के पुनरुक्त बल को हिन्दी में स्वाभाविक संयुक्त पद के द्वारा सुरक्षित रखा गया है।
