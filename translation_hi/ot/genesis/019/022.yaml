base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/022.yaml
  text: Hurry[a], escape there[b], for I cannot do anything until you arrive there.” Therefore the city was called Zoar.
translation:
  language: hi
  text: “जल्दी कर, वहाँ भागकर बच जा, क्योंकि जब तक तू वहाँ पहुँच न जाए, मैं कुछ नहीं कर सकता।” इसलिए उस नगर का नाम सोअर[a] पड़ा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सोअर’ नाम की ध्वनि इब्रानी के उस शब्द से मिलती है जिसका अर्थ ‘छोटा’ या ‘तुच्छ’ है; उत्पत्ति 19:20 देखें।
    reason: cross_reference
  - marker: b
    text: 'अधिक शाब्दिक रूप: “इसलिए उसने उस नगर का नाम सोअर रखा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: जल्दी कर
  rationale: आज्ञार्थक रूप तात्कालिकता प्रकट करता है; ‘जल्दी कर’ स्वाभाविक आधुनिक हिन्दी में उसका बल बनाए रखता है।
- source_word: הִמָּלֵט
  choice: भागकर बच जा
  rationale: निफ़अल आज्ञार्थक का अर्थ संकट से बच निकलना है। ‘भागकर बच जा’ पलायन और सुरक्षित निकलने—दोनों भावों को स्पष्ट करता है।
- source_word: שָׁמָּה
  choice: वहाँ
  rationale: दिशासूचक क्रियाविशेषण का अर्थ ‘वहाँ/वहाँ तक’ है; हिन्दी में गति-सूचक क्रिया के साथ ‘वहाँ’ स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आज्ञा का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और सहज है।
- source_word: לֹא אוּכַל
  choice: मैं ... नहीं कर सकता
  rationale: मूल पाठ स्पष्ट रूप से असमर्थता व्यक्त करता है; इसे अनुमति या इच्छा के अर्थ में नरम नहीं किया गया।
- source_word: לַעֲשׂוֹת דָּבָר
  choice: कुछ ... कर
  rationale: शाब्दिक अर्थ ‘कोई बात/काम करना’ है; नकार के साथ ‘कुछ नहीं कर सकता’ स्वाभाविक हिन्दी में व्यापक अर्थ सुरक्षित रखता है।
- source_word: עַד בֹּאֲךָ
  choice: जब तक तू ... पहुँच न जाए
  rationale: पुल्लिंग एकवचन संबोधन को ‘तू’ से और गंतव्य तक आने को सन्दर्भानुसार ‘पहुँचने’ से व्यक्त किया गया है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह स्थान-नाम की व्याख्या प्रस्तुत करने वाला निष्कर्षसूचक सूत्र है।
- source_word: קָרָא שֵׁם הָעִיר
  choice: उस नगर का नाम ... पड़ा
  rationale: हिब्रू की नामकरण-अभिव्यक्ति को सहज हिन्दी में प्रस्तुत किया गया है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: צֹעַר
  choice: सोअर
  rationale: स्थान के इब्रानी नाम का देवनागरी लिप्यंतरण; इससे निकटवर्ती ‘छोटा’ संबंधी शब्द-क्रीड़ा पादटिप्पणी द्वारा स्पष्ट की गई है।
theological_decisions:
- issue: न्याय के प्रसंग में ‘मैं नहीं कर सकता’ का कथन
  choice: मैं कुछ नहीं कर सकता
  alternative: मैं कुछ नहीं करूँगा / मुझे कुछ नहीं करना चाहिए
  rationale: לֹא אוּכַל सीधे असमर्थता व्यक्त करता है। वक्ता की पहचान या इस असमर्थता की धर्मवैज्ञानिक व्याख्या थोपे बिना मूल कथानक का तनाव बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लूत को संबोधित एकवचन पुल्लिंग रूप को ‘तू’ से व्यक्त किया गया है। प्रत्यक्ष कथन की तात्कालिकता और मूल पाठ में निहित धर्मवैज्ञानिक तनाव सुरक्षित हैं।
