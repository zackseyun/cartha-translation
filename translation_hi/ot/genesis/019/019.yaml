review_pass:
  verdict: revise
  source_fidelity: The draft conveys the verse’s overall plea and feared consequence accurately. However, “आपके दास पर आपकी कृपादृष्टि हुई है” shifts the Hebrew idiom from Lot’s finding favor to favor simply falling upon him, and “पहाड़ तक भागकर नहीं पहुँच सकता” unnecessarily adds the endpoint nuance “reach.” The revision more directly retains finding favor and escaping to the mountain.
  naturalness: The register is generally dignified and modern. “आपके सेवक ने आपकी दृष्टि में अनुग्रह पाया है” is a conventional, understandable formal biblical idiom and more accurately preserves the source imagery. “पहाड़ की ओर भाग निकल” is natural Hindi for escape in this context.
  terminology: “करुणा” is a viable contextual rendering of חֶסֶד, provided its wider semantic range remains footnoted. “सेवक” appropriately conveys the deferential self-reference of עַבְדְּךָ without foregrounding bonded status. “विपत्ति” correctly renders הָרָעָה contextually as calamity rather than moral evil.
  issues:
  - severity: medium
    issue: The favor idiom is not represented with Lot as its subject.
    rationale: מָצָא ... חֵן בְּעֵינֶיךָ literally presents “your servant” as having found favor “in your eyes.” “आपके दास पर आपकी कृपादृष्टि हुई” is understandable but restructures and weakens that idiom.
  - severity: low
    issue: “पहाड़ तक ... पहुँच सकता” adds a slightly narrower sense than the Hebrew.
    rationale: לְהִמָּלֵט הָהָרָה means to escape/flee toward the mountain. It does not specifically state successful arrival at it.
  revised_text: “देखिए, कृपया, आपके सेवक ने आपकी दृष्टि में अनुग्रह पाया है, और आपने मेरे प्राण बचाकर मुझ पर बहुत बड़ी करुणा[a] की है। पर मैं पहाड़ की ओर भाग नहीं निकल सकता; कहीं ऐसा न हो कि वह विपत्ति[b] मुझे आ पकड़े और मैं मर जाऊँ।”
