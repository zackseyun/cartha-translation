id: GEN.19.19
reference: Genesis 19:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִנֵּה נָ֠א מָצָ֨א עַבְדְּ/ךָ֣ חֵן֮ בְּ/עֵינֶי/ךָ֒ וַ/תַּגְדֵּ֣ל חַסְדְּ/ךָ֗ אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִמָּדִ֔/י לְ/הַחֲי֖וֹת אֶת נַפְשִׁ֑/י וְ/אָנֹכִ֗י לֹ֤א אוּכַל֙ לְ/הִמָּלֵ֣ט הָ/הָ֔רָ/ה פֶּן תִּדְבָּקַ֥/נִי הָ/רָעָ֖ה וָ/מַֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/019.yaml
  text: Look[a], please, your servant has found favor in your eyes, and you have made great your steadfast love that you have shown me by preserving my life. But I cannot escape to the mountain[b], lest the disaster overtake me and I die.
translation:
  language: hi
  text: “देखिए, कृपया, आपके सेवक ने आपकी दृष्टि में अनुग्रह पाया है, और आपने मेरे प्राण बचाकर मुझ पर बहुत बड़ी करुणा[a] की है। पर मैं पहाड़ की ओर भाग नहीं निकल सकता; कहीं ऐसा न हो कि वह विपत्ति[b] मुझे आ पकड़े और मैं मर जाऊँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अटल प्रेम,” “कृपा” अथवा “निष्ठावान प्रेम।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “वह बुराई”; यहाँ आशय उस विनाशकारी विपत्ति से है जो लूत को आ पकड़ सकती थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: देखिए, कृपा करके!
  rationale: הִנֵּה ध्यान आकर्षित करता है और נָא विनम्र किंतु तात्कालिक विनती जोड़ता है। यह हिंदी प्रयोग दोनों भावों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מָצָא ... חֵן בְּעֵינֶיךָ
  choice: आपके दास पर आपकी कृपादृष्टि हुई है
  rationale: हिब्रू मुहावरे ‘आपकी आँखों में अनुग्रह पाया’ का स्वाभाविक हिंदी रूप, जिसमें अनुकूल दृष्टि का बिंब बना रहता है।
- source_word: עַבְדְּךָ
  choice: आपके दास
  rationale: यहाँ अधीनस्थ स्थिति का कानूनी वर्णन नहीं, बल्कि सम्मानसूचक आत्म-संबोधन प्रमुख है; इसलिए ‘दास’ उपयुक्त है।
- source_word: וַתַּגְדֵּל חַסְדְּךָ
  choice: आपने ... बड़ी करुणा की है
  rationale: גדל के बढ़ाने/महान करने के भाव को ‘बड़ी’ और חֶסֶד की कृपालु, निष्ठावान भलाई को ‘करुणा’ से सहज हिंदी में व्यक्त किया गया है।
- source_word: עָשִׂיתָ עִמָּדִי
  choice: मुझ पर ... की है
  rationale: शाब्दिक ‘मेरे साथ किया’ की अपेक्षा हिंदी में करुणा के साथ यह स्वाभाविक संयोजन है।
- source_word: לְהַחֲיוֹת אֶת נַפְשִׁי
  choice: मेरे प्राण बचाकर
  rationale: वाक्यांश का आशय लूत को जीवित रखना है। ‘प्राण बचाकर’ נפש के जीवन/प्राण संबंधी अर्थ को संक्षिप्त और स्पष्ट रखता है।
- source_word: וְאָנֹכִי לֹא אוּכַל
  choice: पर मैं ... नहीं सकता
  rationale: וְ का संदर्भगत विरोध और אָנֹכִי का प्रथम पुरुष पर बल स्वाभाविक हिंदी में सुरक्षित है।
- source_word: לְהִמָּלֵט הָהָרָה
  choice: पहाड़ तक भागकर नहीं पहुँच सकता
  rationale: दिशासूचक रूप पहाड़ की ओर गति बताता है। संदर्भ में संकट से भाग निकलकर वहाँ पहुँचने का भाव है।
- source_word: פֶּן תִּדְבָּקַנִי
  choice: कहीं ऐसा न हो कि ... मुझे आ पकड़े
  rationale: פֶּן आशंकित परिणाम प्रस्तुत करता है और דבק यहाँ विपत्ति के पकड़ लेने या आ पहुँचने का मुहावरेदार अर्थ देता है।
- source_word: הָרָעָה
  choice: वह विपत्ति
  rationale: यहाँ רעה नैतिक बुराई नहीं, बल्कि सदोम पर आनेवाली विनाशकारी आपदा को सूचित करता है।
theological_decisions:
- issue: חֶסֶד का अनुवाद
  choice: करुणा
  alternative: अटल प्रेम; कृपा; निष्ठावान प्रेम
  rationale: इस विनती में प्राण बचाने के रूप में दिखाई गई कृपालु और दयापूर्ण भलाई मुख्य है। ‘करुणा’ हिंदी में स्वाभाविक है; पादटिप्पणी חֶסֶד के निष्ठा और स्थिर प्रेम वाले व्यापक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी; लूत का सम्मानपूर्ण और तात्कालिक निवेदन व्यक्त करने के लिए आदरसूचक संबोधन रखा गया है। भाषा dignified किंतु सामान्य पाठक के लिए सहज है; हिब्रू की वास्तविक शब्दार्थ-व्याप्ति पादटिप्पणियों में सुरक्षित रखी गई है।
