  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו הִנֵּה֙ נָשָׂ֣אתִי פָנֶ֔י/ךָ גַּ֖ם לַ/דָּבָ֣ר הַ/זֶּ֑ה לְ/בִלְתִּ֛י הָפְכִּ֥/י אֶת הָ/עִ֖יר אֲשֶׁ֥ר דִּבַּֽרְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/021.yaml
  text: 'And he said to him[a], “Look, I grant you this request also: I will not overthrow the city of which you have spoken.”'
translation:
  language: hi
  text: उसने उससे कहा, “देख, मैंने इस बात में भी तुझ पर कृपा की है[a]; जिस नगर की तूने चर्चा की है, उसे मैं उलट नहीं दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का शाब्दिक अर्थ है, “मैंने तेरा मुख उठाया है”; यहाँ इसका अर्थ है, “मैंने तुझ पर कृपा की है” या “मैंने तेरी विनती स्वीकार की है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह सामने वाले का ध्यान उत्तर की ओर खींचता है; आधुनिक हिन्दी में “देख” स्वाभाविक और सशक्त है।
- source_word: נָשָׂאתִי פָנֶיךָ
  choice: मैंने...तुझ पर कृपा की है
  rationale: शाब्दिक अर्थ “तेरा मुख उठाया है” है, पर यह इब्रानी मुहावरा यहाँ किसी की विनती स्वीकार करके उस पर अनुग्रह करने का भाव देता है।
- source_word: גַּם לַדָּבָר הַזֶּה
  choice: इस बात में भी
  rationale: דָּבָר यहाँ लूत द्वारा अभी उठाए गए विषय या अनुरोध को सूचित करता है; “भी” גַּם की योगात्मक शक्ति बनाए रखता है।
- source_word: לְבִלְתִּי הָפְכִּי
  choice: उसे मैं उलट नहीं दूँगा
  rationale: הפך का मूल चित्र नगर को उलट देने का है; यह अनुवाद सामान्य “नष्ट करना” की अपेक्षा मूल क्रिया से संबंध बनाए रखता है और आगामी वर्णन के अनुरूप है।
- source_word: הָעִיר אֲשֶׁר דִּבַּרְתָּ
  choice: जिस नगर की तूने चर्चा की है
  rationale: यह लूत द्वारा बताए गए नगर को स्पष्ट और स्वाभाविक हिन्दी में संदर्भित करता है।
theological_decisions: []
translation_notes:
  register: संवाद में एकवचन निकट संबोधन के लिए “तू/तुझ” रखा गया है, जो बाइबिलीय प्रसंग में स्पष्ट और गरिमापूर्ण है। वाक्य आधुनिक मानक हिन्दी में है, जबकि “उलट नहीं दूँगा” मूल इब्रानी क्रिया की ठोस छवि सुरक्षित रखता है।
