  naturalness: The Hindi is clear, fluent, and suitably elevated for direct speech while remaining modern. The singular “तू/तुझ” is internally consistent and appropriate to the dialogue’s register. “देख” effectively renders הִנֵּה without archaic wording.
  terminology: “कृपा” is a sound contextual rendering of the Hebrew favor idiom and does not overstate a theological interpretation. The footnote correctly supplies both the literal idiom and its contextual sense. “नगर” and “उलट” preserve the source’s formal and catastrophic imagery.
