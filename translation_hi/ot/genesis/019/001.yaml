reference: Genesis 19:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הַ/מַּלְאָכִ֤ים סְדֹ֨מָ/ה֙ בָּ/עֶ֔רֶב וְ/ל֖וֹט יֹשֵׁ֣ב בְּ/שַֽׁעַר סְדֹ֑ם וַ/יַּרְא לוֹט֙ וַ/יָּ֣קָם לִ/קְרָאתָ֔/ם וַ/יִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/001.yaml
  text: The two angels came to Sodom in the evening[a], and Lot was sitting in the gate of Sodom. When Lot saw them[c][b], he rose to meet them and bowed with his face to the ground.
translation:
  language: hi
  text: शाम को वे दोनों स्वर्गदूत सदोम पहुँचे। लूत सदोम के नगर-फाटक पर[a] बैठा था। जब लूत ने उन्हें देखा, तो वह उनसे मिलने के लिए उठा और भूमि पर मुँह के बल झुककर प्रणाम किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नगर का फाटक केवल आने-जाने का द्वार नहीं था; उसके आसपास का स्थान सार्वजनिक और नागरिक कामकाज का केंद्र भी होता था।
    reason: cultural_note
  - marker: b
    text: इब्रानी में गहरे झुकने की ऐसी मुद्रा वर्णित है जिसमें मुँह भूमि पर होता है; इसे ‘भूमि पर मुँह के बल दण्डवत किया’ भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: पहुँचे
  rationale: בוא का कथात्मक रूप किसी स्थान पर आने या पहुँचने को व्यक्त करता है; यहाँ सदोम गंतव्य है, इसलिए ‘पहुँचे’ स्वाभाविक और सटीक है।
- source_word: שְׁנֵי הַמַּלְאָכִים
  choice: वे दोनों स्वर्गदूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। पिछले प्रसंग के इन्हीं अलौकिक आगंतुकों के संदर्भ में ‘स्वर्गदूत’ आधुनिक पाठक के लिए स्पष्ट है; ‘वे’ पूर्ववर्ती कथा से उनका संबंध बनाए रखता है।
- source_word: סְדֹמָה
  choice: सदोम
  rationale: दिशासूचक ה सदोम की ओर गति बताता है; हिंदी में ‘सदोम पहुँचे’ इस दिशा और आगमन दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּעֶרֶב
  choice: शाम को
  rationale: यह आगमन का समय बताने वाला सामान्य कालवाचक पद है; ‘शाम को’ सहज आधुनिक हिंदी है।
- source_word: יֹשֵׁב
  choice: बैठा था
  rationale: कृदंत दृश्य की पृष्ठभूमि में जारी अवस्था बताता है; ‘बैठा था’ उस निरंतर अवस्था को बनाए रखता है।
- source_word: בְּשַׁעַר סְדֹם
  choice: सदोम के नगर-फाटक पर
  rationale: यह केवल दरवाजे को नहीं, नगर के फाटक और उससे जुड़े सार्वजनिक क्षेत्र को सूचित कर सकता है। ‘नगर-फाटक पर’ हिंदी में स्वाभाविक है और सांस्कृतिक अर्थ के लिए पाद-टिप्पणी दी गई है।
- source_word: וַיַּרְא לוֹט
  choice: जब लूत ने उन्हें देखा
  rationale: इब्रानी में कर्म प्रसंग से समझा जाता है; हिंदी में ‘उन्हें’ जोड़ने से संदर्भ स्पष्ट होता है। ‘जब…तो’ घटनाक्रम को सहज रूप देता है।
- source_word: וַיָּקָם לִקְרָאתָם
  choice: वह उनसे मिलने के लिए उठा
  rationale: यह पद उठकर आगंतुकों के स्वागत या भेंट के लिए आगे जाने का भाव देता है; चयनित वाक्यांश दोनों तत्व सुरक्षित रखता है।
- source_word: וַיִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: उनके सामने भूमि तक मुँह झुकाकर प्रणाम किया
  rationale: पूरा पद गहरे आदर में भूमि की ओर पूर्णतः झुकने की क्रिया बताता है। यह अनुवाद शारीरिक मुद्रा और सम्मान दोनों व्यक्त करता है, बिना इसे अनिवार्य रूप से आराधना घोषित किए।
theological_decisions:
- issue: क्या וַיִּשְׁתַּחוּ को आराधना मानकर अनुवाद किया जाए या सम्मानसूचक दण्डवत/प्रणाम के रूप में
  choice: सम्मानसूचक गहरा प्रणाम
  alternative: आराधना की
  rationale: שׁחה परमेश्वर की आराधना और मनुष्यों या उच्च पद वालों के सामने झुकने—दोनों के लिए प्रयुक्त हो सकता है। इस आतिथ्य-संबंधी प्रसंग में ‘प्रणाम किया’ पाठ से अधिक मजबूत धार्मिक दावा किए बिना क्रिया को व्यक्त करता है; ‘भूमि तक मुँह झुकाकर’ उसकी गहराई स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘नगर-फाटक’ सांस्कृतिक संदर्भ स्पष्ट करता है और ‘प्रणाम किया’ सम्मान की क्रिया बताता है, जबकि पाद-टिप्पणी पूर्ण दण्डवत मुद्रा को सुरक्षित रखती है।
