base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/037.yaml
  text: The firstborn bore a son and called his name Moab[a]; he is the father of Moab to this day.
translation:
  language: hi
  text: सबसे बड़ी बेटी ने एक पुत्र को जन्म दिया और उसका नाम मोआब रखा। वही आज तक मोआब का पिता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वही आज तक मोआबियों का पूर्वज है।” इब्रानी में शाब्दिक रूप से “मोआब का पिता” है; यहाँ पूर्वज का नाम उससे उत्पन्न लोगों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: जन्म दिया
  rationale: Qal रूप यहाँ संतान उत्पन्न करने के सामान्य अर्थ में है; आधुनिक हिन्दी में ‘एक पुत्र को जन्म दिया’ स्वाभाविक और स्पष्ट है।
- source_word: הַבְּכִירָה
  choice: पहलौठी
  rationale: स्त्रीलिंग पद का अर्थ ‘पहली जन्मी’ है और प्रसंग में लूत की बड़ी बेटी को सूचित करता है; ‘पहलौठी’ मूल की जन्मक्रम-संबंधी संज्ञा को बनाए रखता है।
- source_word: בֵּן
  choice: एक पुत्र
  rationale: जन्म-वर्णन में अनिश्चित संज्ञा के रूप में ‘एक पुत्र’ स्वाभाविक हिन्दी है।
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: उसका नाम … रखा
  rationale: इब्रानी मुहावरे ‘उसका नाम पुकारा’ का स्वाभाविक आधुनिक हिन्दी समतुल्य ‘उसका नाम … रखा’ है।
- source_word: מוֹאָב
  choice: मोआब
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: הוּא
  choice: वही
  rationale: स्वतंत्र सर्वनाम पहले उल्लिखित पुत्र पर बल देकर उसे फिर से इंगित करता है; ‘वही’ इस पुनरुक्त और बलात्मक भाव को व्यक्त करता है।
- source_word: אֲבִי מוֹאָב
  choice: मोआब का पिता
  rationale: मूल का शाब्दिक रूप बनाए रखा गया है। यहाँ ‘मोआब’ वंशज जाति के लिए भी प्रयुक्त हो सकता है; यह अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: עַד הַיּוֹם
  choice: आज तक
  rationale: यह कथावाचक के समय तक जारी स्थिति को व्यक्त करने वाला मानक इब्रानी मुहावरा है; ‘आज तक’ उसका सहज हिन्दी समतुल्य है।
