base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/003.yaml
  text: But he urged them strongly[a], so they turned aside to him and entered his house. He prepared a feast for them, baked unleavened bread[b], and they ate.
translation:
  language: hi
  text: पर उसने उनसे बहुत आग्रह किया[a], और वे उसके यहाँ मुड़ गए और उसके घर में आए। उसने उनके लिए एक भोज तैयार किया और बिना खमीर की रोटियाँ[b] सेंकीं; तब उन्होंने खाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन पर बहुत दबाव डाला” अथवा “बहुत हठ किया।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “अखमीरी रोटियाँ” या “बिना खमीर की टिकियाँ”; अर्थात ऐसी रोटी जिसमें खमीर न डाला गया हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצַר בָּם מְאֹד
  choice: उसने उनसे बहुत आग्रह किया
  rationale: פצר प्रबल आग्रह या ज़ोर देने का भाव व्यक्त करता है, और מְאֹד उसकी तीव्रता बढ़ाता है। यह अनुवाद आधुनिक हिंदी में स्वाभाविक रहते हुए दोनों तत्वों को सुरक्षित रखता है।
- source_word: וַיָּסֻרוּ אֵלָיו
  choice: वे उसकी ओर मुड़े
  rationale: סור के मूल 'मुड़ना/रास्ते से हटना' बिंब को बनाए रखता है और אֵלָיו को स्पष्ट रूप से 'उसकी ओर' व्यक्त करता है।
- source_word: וַיָּבֹאוּ אֶל־בֵּיתוֹ
  choice: उसके घर में गए
  rationale: गति और गंतव्य दोनों को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: מִשְׁתֶּה
  choice: एक भोज
  rationale: यह शब्द दावत या भोज को दर्शाता है, जिसमें पेय भी हो सकता है; प्रसंग में मदिरा को विशेष रूप से सामने लाना आवश्यक नहीं है।
- source_word: מַצּוֹת
  choice: बिना खमीर की रोटियाँ
  rationale: बहुवचन रूप को 'रोटियाँ' से सुरक्षित रखा गया है और अखमीरी होने का अर्थ साधारण पाठक के लिए स्पष्ट किया गया है।
- source_word: אָפָה
  choice: सेंकीं
  rationale: रोटियों के साथ 'सेंकना' स्वाभाविक हिंदी क्रिया है और मूल की पकाने की क्रिया को ठीक से व्यक्त करती है।
- source_word: וַיֹּאכֵלוּ
  choice: तब उन्होंने खाया
  rationale: कथा के क्रम में भोजन तैयार होने के बाद आगंतुकों के खाने को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
