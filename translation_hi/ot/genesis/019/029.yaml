  text: וַ/יְהִ֗י בְּ/שַׁחֵ֤ת אֱלֹהִים֙ אֶת עָרֵ֣י הַ/כִּכָּ֔ר וַ/יִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת אַבְרָהָ֑ם וַ/יְשַׁלַּ֤ח אֶת לוֹט֙ מִ/תּ֣וֹךְ הַ/הֲפֵכָ֔ה בַּ/הֲפֹךְ֙ אֶת הֶ֣/עָרִ֔ים אֲשֶׁר יָשַׁ֥ב בָּ/הֵ֖ן לֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/029.yaml
  text: So it happened[a], when God destroyed the cities of the plain, that God remembered Abraham and sent Lot out of the midst of the overthrow[d][c][b], when he overthrew the cities in which Lot had lived.
translation:
  language: hi
  text: जब परमेश्वर ने मैदान के नगरों का विनाश किया, तब परमेश्वर ने अब्राहम को स्मरण किया[a] और लूत को उस विनाश के बीच से बाहर भेज दिया[b], जब उसने उन नगरों को उलट दिया जिनमें लूत रहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परमेश्वर ने अब्राहम को स्मरण किया” इब्रानी मुहावरा है। इसका अर्थ यह नहीं कि परमेश्वर अब्राहम को भूल गया था, बल्कि यह है कि उसने अब्राहम का निष्ठापूर्वक ध्यान रखते हुए कार्य किया।
    reason: cultural_note
  - marker: b
    text: “विनाश” के लिए प्रयुक्त इब्रानी संज्ञा आगे के क्रिया-रूप “उलट दिया” से संबंधित है। इसका अनुवाद “उलटाव” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּשַׁחֵת
  choice: जब ... विनाश किया, तब ऐसा हुआ कि
  rationale: यह इब्रानी कथा-विन्यास मुख्य घटना के लिए कालगत पृष्ठभूमि प्रस्तुत करता है। हिंदी में यह रूप उसके कथात्मक बल को बनाए रखते हुए स्वाभाविक और स्पष्ट है।
- source_word: עָרֵי הַכִּכָּר
  choice: उस तराई के नगरों
  rationale: כִּכָּר यहाँ यरदन की तराई अथवा मैदानी भूभाग को सूचित करता है; 'तराई' प्रसंगानुकूल, संक्षिप्त और आधुनिक हिंदी में बोधगम्य है।
- source_word: וַיִּזְכֹּר אֱלֹהִים אֶת אַבְרָהָם
  choice: परमेश्वर ने अब्राहम को स्मरण किया
  rationale: मूल इब्रानी मुहावरे और उसके धर्मवैचारिक अनुनाद को बनाए रखा गया है; इसका अर्थ यह नहीं कि परमेश्वर पहले अब्राहम को भूल गया था।
- source_word: וַיְשַׁלַּח אֶת לוֹט
  choice: लूत को ... बाहर भेज दिया
  rationale: שׁלח का मूल अर्थ 'भेजना' है। उद्धार के परिणाम को संदर्भ स्पष्ट करता है, इसलिए मुख्य पाठ में 'बचा लिया' जैसा व्याख्यात्मक विस्तार नहीं किया गया।
- source_word: מִתּוֹךְ הַהֲפֵכָה
  choice: उस उलट-पुलट के बीच से
  rationale: यह תּוֹךְ के 'बीच' और הֲפֵכָה के विनाशकारी उलटाव—दोनों को दर्शाता है तथा अगले הפך से शब्दगत संबंध बचाता है।
- source_word: בַּהֲפֹךְ אֶת הֶעָרִים
  choice: जब उसने उन नगरों को उलट दिया
  rationale: कालवाचक infinitive construct को स्वाभाविक हिंदी उपवाक्य में व्यक्त किया गया और הֲפֵכָה/הפך की शब्द-पुनरावृत्ति यथासंभव सुरक्षित रखी गई।
- source_word: אֲשֶׁר יָשַׁב בָּהֵן לוֹט
  choice: जिनमें लूत रहता था
  rationale: ישׁב यहाँ निवास को व्यक्त करता है। 'रहता था' आधुनिक हिंदी में सहज है और अनावश्यक कालगत व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: '''परमेश्वर ने अब्राहम को स्मरण किया'' का अर्थ'
  choice: मुख्य पाठ में इब्रानी मुहावरे को यथावत रखना
  alternative: परमेश्वर ने अब्राहम का ध्यान रखकर कार्य किया / अब्राहम के कारण लूत को बचाया
  rationale: परमेश्वर का 'स्मरण करना' बाइबिलीय कथाओं में प्रायः संबंधपरक निष्ठा से प्रेरित कार्य को सूचित करता है। स्पष्ट व्याख्यात्मक रूप मुख्य पाठ में कारण या वाचा की प्रकृति को मूल से अधिक निश्चित कर देता।
- issue: लूत के बाहर भेजे जाने में उद्धार का भाव
  choice: '''बाहर भेज दिया'''
  alternative: '''बचा लिया'' या ''बाहर निकाल लिया'''
  rationale: प्रसंग निस्संदेह बचाव का है, पर मूल क्रिया שׁלח 'भेजना' है। औपचारिक अर्थ को रखते हुए परिणाम पाठक के लिए प्रसंग से स्पष्ट रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। 'स्मरण किया' ने बाइबिलीय मुहावरे को सुरक्षित रखा है, जबकि 'रहता था' जैसे रूप पाठ को सामान्य पाठक के लिए स्वाभाविक बनाते हैं। 'उलट-पुलट/उलट दिया' मूल के शब्द-संबंध को दर्शाता है, यद्यपि हिंदी में इसकी कुछ असामान्यता को पादटिप्पणी से स्पष्ट किया गया है।
