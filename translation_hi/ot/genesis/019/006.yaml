lexical_decisions:
- source_word: וַיֵּצֵא
  choice: बाहर गया
  rationale: יצא का कथात्मक रूप घटना को आगे बढ़ाता है और बाहर की ओर जाने की गति व्यक्त करता है।
- source_word: אֲלֵהֶם
  choice: उनके पास
  rationale: אֶל के साथ बहुवचन प्रत्यय उन बाहर खड़े पुरुषों की ओर गति दर्शाता है।
- source_word: לוֹט
  choice: लूत
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नामरूप।
- source_word: הַפֶּתְחָה
  choice: द्वार के मुहाने तक
  rationale: פֶּתַח भवन के खुले प्रवेश या द्वार-मुहाने को दर्शाता है, और दिशासूचक ה गति को उसकी ओर बताता है; यह अगले शब्द דֶּלֶת से भेद भी बनाए रखता है।
- source_word: וְהַדֶּלֶת
  choice: किवाड़
  rationale: דֶּלֶת यहाँ प्रवेश के खुले मुहाने से भिन्न, बंद किए जाने वाले वास्तविक दरवाज़े या पल्ले को सूचित करता है।
- source_word: סָגַר
  choice: बंद कर लिया
  rationale: संदर्भ में दरवाज़ा बंद करने की पूर्ण क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אַחֲרָיו
  choice: अपने पीछे
  rationale: 'यहाँ स्थानवाचक अर्थ है: लूत बाहर निकलकर किवाड़ अपने पीछे बंद करता है।'
