    text: या “भूमि।” इब्रानी אֶרֶץ का अर्थ “पृथ्वी,” “भूमि” या “ज़मीन” हो सकता है। यहाँ जलप्रलय-वृत्तांत की व्यापक प्रस्तुति के कारण “पृथ्वी” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשֵּׁנִי
  choice: और दूसरे महीने के
  rationale: वाव कथा के क्रम को आगे बढ़ाता है और ב समय का संकेत देता है। हिंदी में ‘और दूसरे महीने के’ स्वाभाविक रूप से दोनों बातों को व्यक्त करता है।
- source_word: בְּשִׁבְעָה וְעֶשְׂרִים יוֹם לַחֹדֶשׁ
  choice: सत्ताईसवें दिन
  rationale: यह इब्रानी तिथि-सूत्र है। हिंदी में महीने का उल्लेख पहले ही होने के कारण ‘सत्ताईसवें दिन’ स्पष्ट और स्वाभाविक है।
- source_word: יָבְשָׁה
  choice: सूख गई
  rationale: יבש का काल-रूप इस बिंदु तक प्राप्त हुई सूखी अवस्था को बताता है; आधुनिक हिंदी में ‘सूख गई’ परिणामकारी भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’, ‘देश/भूमि’ या ‘ज़मीन’ हो सकता है। जलप्रलय-वृत्तांत की व्यापक प्रस्तुति के कारण मुख्य पाठ में ‘पृथ्वी’ चुना गया है, जबकि वास्तविक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: הָאָרֶץ के भौगोलिक विस्तार की व्याख्या
  choice: पृथ्वी
  alternative: भूमि
  rationale: वृत्तांत का भाषा-परिवेश व्यापक है, पर इब्रानी शब्द अपने आप में स्थानीय अथवा विश्वव्यापी विस्तार को निर्णायक रूप से निश्चित नहीं करता; इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। तिथि-सूत्र को स्वाभाविक हिंदी क्रम में रखा गया है और אֶרֶץ की वास्तविक अर्थगत व्यापकता पादटिप्पणी में दी गई है।
