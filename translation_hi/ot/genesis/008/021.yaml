id: GEN.8.21
reference: Genesis 8:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֣רַח יְהוָה֮ אֶת רֵ֣יחַ הַ/נִּיחֹחַ֒ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל לִבּ֗/וֹ לֹֽא אֹ֠סִף לְ/קַלֵּ֨ל ע֤וֹד אֶת הָֽ/אֲדָמָה֙ בַּ/עֲב֣וּר הָֽ/אָדָ֔ם כִּ֠י יֵ֣צֶר לֵ֧ב הָ/אָדָ֛ם רַ֖ע מִ/נְּעֻרָ֑י/ו וְ/לֹֽא אֹסִ֥ף ע֛וֹד לְ/הַכּ֥וֹת אֶת כָּל חַ֖י כַּֽ/אֲשֶׁ֥ר עָשִֽׂיתִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/021.yaml
  text: And the LORD smelled the pleasing aroma, and the LORD said to himself, “I will never again curse the ground because of man, for the intention of man’s heart is evil from his youth. And I will never again strike down every living thing as I have done.”
translation:
  language: hi
  text: तब यहोवा ने उस सुखदायक सुगंध को सूँघा और अपने मन में कहा, “मैं मनुष्य के कारण भूमि को फिर कभी शाप नहीं दूँगा, क्योंकि मनुष्य के मन की प्रवृत्ति उसकी युवावस्था से ही बुरी है। और जैसा मैंने किया है, वैसा फिर कभी हर जीवित प्राणी को नष्ट नहीं करूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֵיחַ הַנִּיחֹחַ
  choice: सुखदायक सुगंध
  rationale: यह पदबंध ऐसी सुगंध बताता है जो प्रसन्नता या संतोष देती है; आधुनिक हिंदी में स्वाभाविक रहते हुए बलिदान-संबंधी भाव बनाए रखता है।
- source_word: אֶל לִבּוֹ
  choice: अपने मन में
  rationale: इब्रानी मुहावरे का स्वाभाविक हिंदी रूप, जो भीतर ही भीतर कहने का अर्थ देता है।
- source_word: יֵצֶר לֵב הָאָדָם
  choice: मनुष्य के मन की प्रवृत्ति
  rationale: יֵצֶר में गठन, झुकाव या मन की रची हुई प्रवृत्ति का भाव है; 'प्रवृत्ति' अस्पष्टता को अनुचित रूप से किसी एक व्यवस्थित धर्मशास्त्रीय अर्थ में सीमित नहीं करती।
- source_word: מִנְּעֻרָיו
  choice: उसकी युवावस्था से ही
  rationale: शाब्दिक अर्थ 'उसकी जवानी/युवावस्था से' है; स्रोत के समय-सूचक कथन को बनाए रखता है।
- source_word: לְהַכּוֹת אֶת כָּל חַי
  choice: हर जीवित प्राणी को नष्ट करना
  rationale: संदर्भ में הַכּוֹת केवल प्रहार नहीं, प्राणघातक विनाश दर्शाता है; 'नष्ट करना' हिंदी में आशय स्पष्ट करता है।
theological_decisions:
- issue: भूमि को शाप देने का कारण और मानव की बुरी प्रवृत्ति के बीच तनाव
  choice: दोनों उपवाक्यों को स्रोत के क्रम और 'क्योंकि' संबंध के साथ रखा गया
  alternative: कारण-संबंध को नरम करके केवल सामान्य टिप्पणी बनाना
  rationale: इब्रानी כִּי स्पष्ट व्याख्यात्मक/कारणात्मक संबंध देता है; कथन में उपस्थित धर्मशास्त्रीय तनाव को हल किए बिना सुरक्षित रखा गया है।
- issue: ईश्वर का 'हृदय में' कहना
  choice: अपने मन में कहा
  alternative: अपने आप से कहा
  rationale: यह स्रोत के हृदय/अंतरंग विचार वाले बिंब को हिंदी में स्वाभाविक ढंग से बनाए रखता है, बिना ईश्वरीय मनोविज्ञान पर अतिरिक्त निष्कर्ष जोड़े।
- issue: ईश्वरीय नाम יהוה
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: आधुनिक हिंदी बाइबिल पाठकों में परिचित व्यक्तिगत नाम का रूप चुना गया; इसे सामान्य उपाधि में बदलने से स्रोत का नाम-संबंधी भेद मिट सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य-संरचना इब्रानी के दोहरे संकल्प को बनाए रखती है, पर अस्वाभाविक शब्दानुकरण से बचती है।
