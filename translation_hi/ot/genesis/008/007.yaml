  text: וַ/יְשַׁלַּ֖ח אֶת הָֽ/עֹרֵ֑ב וַ/יֵּצֵ֤א יָצוֹא֙ וָ/שׁ֔וֹב עַד יְבֹ֥שֶׁת הַ/מַּ֖יִם מֵ/עַ֥ל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/007.yaml
  text: Then he sent out the raven[a], and it went out, going out and returning[b], until the waters had dried up from upon the earth.
translation:
  language: hi
  text: तब उसने कौए को बाहर भेजा, और वह बार-बार निकलता और लौटता रहा, जब तक कि धरती पर से पानी सूख नहीं गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “वह बाहर निकला, निकलता और लौटता रहा।” इब्रानी अभिव्यक्ति लगातार या बार-बार होने वाली गति दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: तब उसने ... बाहर भेजा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम व्यक्त करता है, और ‘बाहर भेजा’ שׁלח की क्रिया को स्पष्ट रखता है।
- source_word: הָעֹרֵב
  choice: कौए को
  rationale: עֹרֵב का सामान्य और सटीक हिन्दी नाम ‘कौआ’ है; निश्चित कर्म को ‘कौए को’ से व्यक्त किया गया है।
- source_word: וַיֵּצֵא יָצוֹא וָשׁוֹב
  choice: वह बाहर निकलकर बार-बार जाता और लौटता रहा
  rationale: Finite verb और infinitive absolute की श्रृंखला बाहर निकलने तथा लगातार या दोहराई गई आने-जाने की गति दर्शाती है। यह रूप स्रोत की ‘जाने और लौटने’ की भाषा को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: עַד יְבֹשֶׁת
  choice: जब तक ... सूख नहीं गया
  rationale: עַד समय की अंतिम सीमा बताता है; हिन्दी का ‘जब तक ... नहीं’ निर्माण उसी अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַמַּיִם
  choice: पानी
  rationale: מַיִם रूपतः बहुवचन है, किंतु आधुनिक हिन्दी में इस प्रसंग में ‘पानी’ स्वाभाविक सामूहिक संज्ञा है; ‘जलराशियाँ’ अनावश्यक रूप से साहित्यिक होतीं।
- source_word: מֵעַל הָאָרֶץ
  choice: धरती पर से
  rationale: यह चयन ‘धरती के ऊपर/उसकी सतह पर मौजूद पानी के वहाँ से सूख जाने’ की स्थानिक छवि को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: कौए के जाने और लौटने की दिशा
  choice: बार-बार जाता और लौटता रहा
  alternative: इधर-उधर उड़ता रहा
  rationale: मूल पाठ लौटने का स्थान स्पष्ट नहीं करता। चुना हुआ अनुवाद पुनरावृत्त गति को बनाए रखता है, पर यह नहीं जोड़ता कि कौआ हर बार जहाज़ में ही लौटा।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘उड़ता’ नहीं जोड़ा गया, क्योंकि पक्षी का उड़ना संदर्भ से स्वाभाविक होने पर भी इब्रानी क्रिया केवल ‘बाहर निकलना/जाना’ कहती है।
