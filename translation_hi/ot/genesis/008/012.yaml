  yaml_path: translation/ot/genesis/008/012.yaml
  text: Then he waited another seven days[a], and sent out the dove, and it did not return to him again.
translation:
  language: hi
  text: इसके बाद उसने सात दिन और प्रतीक्षा की। फिर उसने कबूतरी को बाहर भेजा, और वह फिर उसके पास लौटकर नहीं आई[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह अब उसके पास नहीं लौटी।” इब्रानी में नकार के साथ יָסְפָה तथा שׁוּב का प्रयोग “फिर नहीं लौटी” या “अब और नहीं लौटी”—दोनों प्रकार से समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיָּחֶל
  choice: इसके बाद उसने…प्रतीक्षा की
  rationale: यहाँ יחל का अर्थ प्रतीक्षा करना है; आरंभिक וַ कथा के अगले क्रम को दिखाता है, जिसे स्वाभाविक हिन्दी में ‘इसके बाद’ से व्यक्त किया गया है।
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: सात दिन और
  rationale: पूरा पदबंध पहले की अवधि के अतिरिक्त सात दिनों को बताता है। ‘सात दिन और’ इस पुनरावृत्त समयावधि को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיְשַׁלַּח אֶת־הַיּוֹנָה
  choice: फिर उसने कबूतरी को बाहर भेजा
  rationale: שׁלח का सामान्य अर्थ ‘भेजना’ है; प्रसंग में पक्षी को जहाज़ से भेजे जाने के कारण ‘बाहर भेजा’ उपयुक्त है। יוֹנָה के लिए प्रचलित और प्रसंगानुकूल ‘कबूतरी’ चुना गया है।
- source_word: וְלֹא יָסְפָה שׁוּב אֵלָיו עוֹד
  choice: और वह फिर उसके पास लौटकर नहीं आई
  rationale: नकार के साथ יסף और उसके बाद שׁוב…עוד का भाव ‘फिर वापस न आना’ अथवा ‘अब और वापस न आना’ हो सकता है। मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए घटना की पुनरावृत्ति न होने का भाव दिया गया है और वैकल्पिक कालगत अर्थ पादटिप्पणी में सुरक्षित है।
