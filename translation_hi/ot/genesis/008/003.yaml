source:
  edition: WLC
  text: וַ/יָּשֻׁ֧בוּ הַ/מַּ֛יִם מֵ/עַ֥ל הָ/אָ֖רֶץ הָל֣וֹךְ וָ/שׁ֑וֹב וַ/יַּחְסְר֣וּ הַ/מַּ֔יִם מִ/קְצֵ֕ה חֲמִשִּׁ֥ים וּ/מְאַ֖ת יֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/003.yaml
  text: And the waters receded from upon the earth[a], going and returning[b], and the waters diminished at the end of a hundred and fifty days.
translation:
  language: hi
  text: और जल धरती के ऊपर से लगातार पीछे हटता गया[a], और डेढ़ सौ दिनों के अंत में जल घट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “जाते और लौटते हुए”; यह जल के निरंतर और क्रमशः पीछे हटते जाने को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: पीछे हटता गया
  rationale: שׁוב का मूल अर्थ ‘लौटना’ है, पर जल और מֵעַל הָאָרֶץ के साथ यहाँ इसका आशय बाढ़ के जल का भूमि के ऊपर से पीछे हटना है।
- source_word: מֵעַל הָאָרֶץ
  choice: धरती के ऊपर से
  rationale: 'यह चयन מֵעַל की स्थान-संबंधी छवि बनाए रखता है: जल धरती पर छाया हुआ था और अब उसके ऊपर से हट रहा था।'
- source_word: הָלוֹךְ וָשׁוֹב
  choice: लगातार … गया
  rationale: यह क्रिया-संरचना जारी और क्रमिक गति व्यक्त करती है। सहज हिन्दी में ‘लगातार पीछे हटता गया’ उसी प्रगतिशील भाव को प्रकट करता है, बिना जल के आगे-पीछे डोलने का भ्रामक अर्थ दिए।
- source_word: וַיַּחְסְרוּ
  choice: घट गया
  rationale: חסר जल की मात्रा कम होने को बताता है। ‘घट गया’ आधुनिक, स्पष्ट हिन्दी है और पहले आए ‘पीछे हटता गया’ से भिन्न दूसरी क्रिया को बनाए रखता है।
- source_word: מִקְצֵה
  choice: के अंत में
  rationale: समय-सूचक प्रयोग में इसका अर्थ किसी अवधि के पूरा होने पर, अर्थात ‘के अंत में’, है।
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: डेढ़ सौ दिनों
  rationale: यह 150 दिनों की स्वाभाविक और सर्वसुलभ आधुनिक हिन्दी अभिव्यक्ति है।
