base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/009.yaml
  text: But the dove found no resting place for the sole of her foot[a], so she returned to him, to the ark, because the waters were on the surface of all the earth[d][c][b]. Then he stretched out his hand and took her and brought her to himself into the ark.
translation:
  language: hi
  text: परन्तु कबूतरी को अपने पैर का तलवा टिकाने के लिए कोई जगह नहीं मिली,[a] इसलिए वह उसके पास, जहाज़ की ओर लौट आई, क्योंकि सारी धरती की सतह पर पानी था। तब उसने अपना हाथ बढ़ाकर उसे ले लिया और उसे जहाज़ के भीतर अपने पास ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “अपने पैर के तलवे के लिए विश्राम-स्थान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצְאָה
  choice: नहीं मिली
  rationale: מצא का सामान्य अर्थ ‘मिलना/पाना’ है; नकार के साथ हिन्दी में ‘को ... नहीं मिली’ स्वाभाविक है।
- source_word: מָנוֹחַ לְכַף רַגְלָהּ
  choice: अपने पैर का तलवा टिकाने के लिए कोई जगह
  rationale: מָנוֹחַ के ठहरने के स्थान और כַּף רֶגֶל के ‘पैर के तलवे’ वाले ठोस बिंब, दोनों को सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: וַתָּשָׁב אֵלָיו אֶל־הַתֵּבָה
  choice: वह उसके पास, जहाज़ की ओर लौट आई
  rationale: दोनों दिशासूचक पद—‘उसके पास’ और ‘जहाज़ की ओर’—रखे गए हैं; אֶל यहाँ जहाज़ की ओर लौटने को बताता है, जबकि भीतर लाने की बात बाद में स्पष्ट होती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ कारणसूचक अर्थ स्पष्ट है।
- source_word: מַיִם עַל־פְּנֵי כָל־הָאָרֶץ
  choice: सारी धरती की सतह पर पानी था
  rationale: פְּנֵי के ‘सतह’ वाले बिंब को बनाए रखते हुए वाक्य को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: उसने अपना हाथ बढ़ाकर
  rationale: हाथ के साथ שׁלח का मुहावरेदार अर्थ ‘हाथ बढ़ाना’ है।
- source_word: וַיִּקָּחֶהָ
  choice: उसे पकड़ लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है; उड़कर लौटी कबूतरी को हाथ बढ़ाकर लेने के प्रसंग में ‘पकड़ लिया’ क्रिया को स्पष्ट और स्वाभाविक बनाता है, बिना बलपूर्वक पकड़ने का भाव जोड़े।
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו אֶל־הַתֵּבָה
  choice: अपने पास जहाज़ के भीतर ले आया
  rationale: ‘अपने पास’ और ‘जहाज़ के भीतर’ दोनों इब्रानी पद सुरक्षित हैं; हिन्दी क्रम स्वाभाविक रखा गया है।
