lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है, इसलिए आधुनिक हिन्दी में ‘तब’ स्वाभाविक है। דִּבֵּר का मूल भाव ‘बोला’ है, पर वचन की भूमिका में ‘कहा’ अधिक सहज और मुहावरेदार है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में यह इस्राएल के एकमात्र सच्चे परमेश्वर को सूचित करता है; ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट और गरिमापूर्ण है।
- source_word: אֶל
  choice: से
  rationale: हिन्दी में ‘किसी से कहना’ बोलने के संबोधित व्यक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נֹחַ
  choice: नूह
  rationale: इब्रानी नाम का हिन्दी में प्रचलित और मानक रूप।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: इब्रानी में यह आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में अलग से ‘यह कहते हुए’ जोड़ना भारी और अनावश्यक होगा; ‘कहा,’ वही कार्य स्वाभाविक ढंग से करता है।
