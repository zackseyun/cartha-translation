  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कबूतरी’ मूल के स्त्रीलिंग रूप और हिन्दी के स्वाभाविक पक्षी-नाम दोनों को दर्शाता है। कथात्मक ध्यानाकर्षण के लिए ‘और देखो’ बनाए रखा गया है।
