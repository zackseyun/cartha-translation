id: GEN.8.11
reference: Genesis 8:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תָּבֹ֨א אֵלָ֤י/ו הַ/יּוֹנָה֙ לְ/עֵ֣ת עֶ֔רֶב וְ/הִנֵּ֥ה עֲלֵה זַ֖יִת טָרָ֣ף בְּ/פִ֑י/הָ וַ/יֵּ֣דַע נֹ֔חַ כִּי קַ֥לּוּ הַ/מַּ֖יִם מֵ/עַ֥ל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/011.yaml
  text: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
translation:
  language: hi
  text: और साँझ के समय कबूतरी उसके पास आई[a]। और देखो, उसकी चोंच में जैतून का एक ताज़ा तोड़ा हुआ पत्ता था[b]। तब नूह जान गया कि पृथ्वी पर से पानी घट गया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके पास लौट आई”; हिब्रू क्रिया का अपना अर्थ “आई” है, यद्यपि प्रसंग लौटने का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: “ताज़ा तोड़ा हुआ” उस हिब्रू शब्द का अनुवाद है जिसका अर्थ तोड़ा या नोचा हुआ है; इससे संकेत मिलता है कि पत्ता हाल ही में किसी जीवित जैतून के पेड़ से लिया गया था।
    reason: lexical_alternative
  - marker: c
    text: या “पानी उतर गया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: आई
  rationale: בוא का सामान्य अर्थ ‘आना’ है। प्रसंग से कबूतरी का लौटना स्पष्ट है, पर वह अर्थ क्रिया में स्वयं व्यक्त नहीं है; इसलिए मुख्य पाठ में ‘आई’ रखा गया है।
- source_word: לְעֵת עֶרֶב
  choice: साँझ के समय
  rationale: यह पदबंध आगमन का समय बताता है; ‘साँझ के समय’ मूल के निकट और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה आगे की अप्रत्याशित और महत्त्वपूर्ण बात की ओर ध्यान खींचता है; ‘और देखो’ उसकी कथात्मक सजीवता बनाए रखता है।
- source_word: עֲלֵה זַיִת
  choice: जैतून का एक पत्ता
  rationale: शाब्दिक अर्थ ‘जैतून का पत्ता’ है; हिन्दी में यही सहज और स्पष्ट अभिव्यक्ति है।
- source_word: טָרָף
  choice: ताज़ा तोड़ा हुआ
  rationale: यह शब्द किसी वस्तु के तोड़े या नोचे जाने का भाव देता है और संकेत करता है कि पत्ता हाल ही में जीवित पेड़ से लिया गया था।
- source_word: בְּפִיהָ
  choice: उसकी चोंच में
  rationale: शाब्दिक रूप से ‘उसके मुँह में’ है। पक्षी के लिए ‘चोंच में’ आधुनिक हिन्दी में अधिक स्वाभाविक है और आशय को ठीक व्यक्त करता है; स्त्रीलिंग सर्वनाम कबूतरी के हिब्रू स्त्रीलिंग रूप के अनुरूप है।
- source_word: קַלּוּ הַמַּיִם
  choice: पानी घट गया था
  rationale: קלל यहाँ बाढ़ के पानी के कम होने या उतरने को व्यक्त करता है। ‘घट गया था’ सरल, स्वाभाविक और अर्थगत रूप से सटीक है।
- source_word: מֵעַל הָאָרֶץ
  choice: पृथ्वी पर से
  rationale: מֵעַל में किसी सतह के ऊपर से हटने का स्थानिक भाव है; ‘पृथ्वी पर से’ इस भाव को साधारण हिन्दी में सुरक्षित रखता है।
