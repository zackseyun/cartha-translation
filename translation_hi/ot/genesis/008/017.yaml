source:
  edition: WLC
  text: כָּל הַ/חַיָּ֨ה אֲשֶֽׁר אִתְּ/ךָ֜ מִ/כָּל בָּשָׂ֗ר בָּ/ע֧וֹף וּ/בַ/בְּהֵמָ֛ה וּ/בְ/כָל הָ/רֶ֛מֶשׂ הָ/רֹמֵ֥שׂ עַל הָ/אָ֖רֶץ הוצא אִתָּ֑/ךְ וְ/שָֽׁרְצ֣וּ בָ/אָ֔רֶץ וּ/פָר֥וּ וְ/רָב֖וּ עַל הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/017.yaml
  text: Bring out with you every living thing that is with you[a], from all flesh—birds and livestock and every creeping thing that creeps on the earth—so that they may swarm on the earth and be fruitful and multiply on the earth.
translation:
  language: hi
  text: तेरे साथ जो हर जीवित प्राणी है—हर प्रकार के प्राणियों में से पक्षी, पालतू पशु और भूमि पर रेंगनेवाला हर जीव—उसे अपने साथ बाहर ले आ, ताकि वे पृथ्वी पर बहुतायत से फैलें, फलें-फूलें और बढ़ें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: हर जीवित प्राणी
  rationale: यह व्यापक अभिव्यक्ति पक्षियों, पालतू पशुओं और रेंगनेवाले जीवों को समेटती है और חַיָּה को केवल जंगली पशुओं तक सीमित नहीं करती।
- source_word: מִכָּל בָּשָׂר
  choice: सब प्राणियों में से
  rationale: शाब्दिक अर्थ ‘सब मांस में से’ है, पर जलप्रलय के प्रसंग में בָּשָׂר सामूहिक रूप से प्राणधारी जीवों को दर्शाता है; चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בָּעוֹף וּבַבְּהֵמָה
  choice: पक्षी, पालतू पशु
  rationale: עוֹף के लिए ‘पक्षी’ स्वाभाविक है; בְּהֵמָה इस सूची में विशेषतः घरेलू बड़े पशुओं की श्रेणी को सूचित करता है, इसलिए ‘पालतू पशु’ चुना गया।
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: और भूमि पर रेंगनेवाला हर जीव
  rationale: ‘रेंगनेवाला’ संज्ञा और उससे जुड़े इब्रानी कृदंत के अर्थ-संबंध को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הוֹצֵא אִתָּךְ
  choice: अपने साथ बाहर ले आ
  rationale: 'हिफ़ील आज्ञार्थक का कारक भाव सुरक्षित है: नूह को जीवों को बाहर निकालकर अपने साथ लाना है।'
- source_word: וְשָׁרְצוּ
  choice: ताकि वे ... बहुतायत से फैलें
  rationale: שׁרץ में झुंडों या बड़ी संख्या में भर जाने और फैलने का भाव है। ‘बहुतायत से फैलें’ हिन्दी में विभिन्न पशु-श्रेणियों के लिए स्वाभाविक रहते हुए उस प्रचुरता को व्यक्त करता है।
- source_word: וּפָרוּ וְרָבוּ
  choice: फलें-फूलें और बढ़ते जाएँ
  rationale: यह सृष्टि-आशीष की भाषा को पहचानने योग्य रखता है और आधुनिक हिन्दी में प्रजनन तथा संख्या-वृद्धि का संयुक्त भाव स्पष्ट करता है।
- source_word: בָאָרֶץ / עַל הָאָרֶץ
  choice: पृथ्वी पर / भूमि पर
  rationale: अंतिम व्यापक कथन में אָרֶץ के लिए ‘पृथ्वी’ उचित है; रेंगने की भौतिक सतह के संदर्भ में ‘भूमि’ अधिक स्वाभाविक हिन्दी है।
theological_decisions:
- issue: जलप्रलय के बाद सृष्टि-आशीष की प्रतिध्वनि
  choice: ‘बहुतायत से फैलें, फलें-फूलें और बढ़ते जाएँ’ द्वारा प्रचुरता और वृद्धि की सृष्टि-संबंधी भाषा बनाए रखना
  alternative: केवल ‘उनकी संख्या बहुत बढ़े’ कहना
  rationale: इब्रानी पद सृष्टि-वृत्तांत की शब्दावली को जानबूझकर दोहराता है। चुना हुआ अनुवाद इस साहित्यिक-धर्मवैचारिक संबंध को बनाए रखता है, पर पाठ में अतिरिक्त व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर द्वारा नूह को एकवचन निकट संबोधन के कारण ‘तेरे/अपने’ रखा गया है। वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है।
