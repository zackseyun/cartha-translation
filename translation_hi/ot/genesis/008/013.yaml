  text: וַֽ֠/יְהִי בְּ/אַחַ֨ת וְ/שֵׁשׁ מֵא֜וֹת שָׁנָ֗ה בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ חָֽרְב֥וּ הַ/מַּ֖יִם מֵ/עַ֣ל הָ/אָ֑רֶץ וַ/יָּ֤סַר נֹ֨חַ֙ אֶת מִכְסֵ֣ה הַ/תֵּבָ֔ה וַ/יַּ֕רְא וְ/הִנֵּ֥ה חָֽרְב֖וּ פְּנֵ֥י הָֽ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/013.yaml
  text: And it came about in the six hundred and first year[a], in the first month, on the first day of the month, that the waters had dried up from upon the earth. Then Noah removed the covering of the ark and looked, and behold[c][b], the surface of the ground was dry.
translation:
  language: hi
  text: छह सौ एकवें वर्ष[a] के पहले महीने के पहले दिन ऐसा हुआ कि पृथ्वी पर से जल सूख गया था। तब नूह ने जहाज़ का आवरण[b] हटाया और देखा, तो भूमि की सतह सूख गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में वर्ष-गणना का आधार स्पष्ट नहीं कहा गया है; संदर्भ इसे नूह के जीवन के वर्षों से जोड़ता है।
    reason: contextual_ambiguity
  - marker: b
    text: या “जहाज़ की छत।” हिब्रू शब्द का सामान्य अर्थ “आवरण” है और वह इसकी बनावट को अधिक स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ कि
  rationale: यह हिब्रू कथात्मक सूत्र को स्वाभाविक, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּאַחַת וְשֵׁשׁ מֵאוֹת שָׁנָה
  choice: छः सौ एकवें वर्ष
  rationale: हिब्रू की संख्या-रचना का स्वाभाविक हिन्दी क्रमवाचक रूप है; वर्ष-गणना का आधार पद में स्पष्ट नहीं किया गया है।
- source_word: בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ
  choice: पहले महीने के पहले दिन
  rationale: हिब्रू के पंचांग-संबंधी मुहावरे को स्पष्ट और संक्षिप्त हिन्दी में प्रस्तुत करता है।
- source_word: חָרְבוּ הַמַּיִם מֵעַל הָאָרֶץ
  choice: पृथ्वी पर से जल सूख गया था
  rationale: חרב के ‘सूख जाने’ के अर्थ और מֵעַל के ‘ऊपर से’ संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיָּסַר
  choice: हटाया
  rationale: हिफ़ील रूप का अर्थ यहाँ किसी वस्तु को दूर करना है; ‘हटाया’ सरल और सटीक है।
- source_word: מִכְסֵה הַתֵּבָה
  choice: जहाज़ का ढकना
  rationale: מִכְסֵה सामान्यतः ढकने वाली वस्तु को सूचित करता है; ‘ढकना’ ‘छत’ की अपेक्षा कम वास्तुशिल्पीय अनुमान करता है। תֵּבָה के लिए नूह के प्रसंग में सामान्य हिन्दी ‘जहाज़’ रखी गई है।
- source_word: וַיַּרְא וְהִנֵּה
  choice: और देखा कि
  rationale: देखने की क्रिया और הִנֵּה के ध्यानाकर्षक परिणाम को सहज हिन्दी कथन में एक साथ व्यक्त करता है, बिना अनावश्यक पुरातनता के।
- source_word: חָרְבוּ פְּנֵי הָאֲדָמָה
  choice: भूमि की सतह सूख गई थी
  rationale: פְּנֵי का प्रसंगानुकूल अर्थ ‘सतह’ है; הָאֲדָמָה के लिए ‘भूमि’ पहले खंड की ‘पृथ्वी’ से अर्थगत भेद बनाए रखती है।
theological_decisions:
- issue: छः सौ एकवें वर्ष की गणना का आधार
  choice: मुख्य पाठ में केवल ‘छः सौ एकवें वर्ष’ रखा गया
  alternative: ‘नूह के जीवन के छः सौ एकवें वर्ष’
  rationale: आसपास का संदर्भ इसे नूह की आयु से जोड़ता है, पर इस पद का हिब्रू पाठ स्वयं गणना का आधार स्पष्ट रूप से नहीं दोहराता; इसलिए उसे मुख्य पाठ में जोड़कर निहितार्थ को प्रत्यक्ष कथन नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, कथात्मक और गरिमापूर्ण स्तर रखा गया है। ‘सन्दूक’ के बजाय परिचित प्रसंगानुकूल ‘जहाज़’ चुना गया है। ध्यानाकर्षक וְהִנֵּה को अलग से ‘देखो’ कहने के बजाय ‘देखा कि’ में स्वाभाविक रूप से समाहित किया गया है।
