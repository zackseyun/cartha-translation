id: GEN.8.22
reference: Genesis 8:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֹ֖ד כָּל יְמֵ֣י הָ/אָ֑רֶץ זֶ֡רַע וְ֠/קָצִיר וְ/קֹ֨ר וָ/חֹ֜ם וְ/קַ֧יִץ וָ/חֹ֛רֶף וְ/י֥וֹם וָ/לַ֖יְלָה לֹ֥א יִשְׁבֹּֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/022.yaml
  text: For as long as the earth endures[a], seedtime and harvest, cold and heat, summer and winter[b], and day and night shall not cease.
translation:
  language: hi
  text: जब तक पृथ्वी बनी रहेगी,[a] तब तक बोआई और कटनी, ठंड और गर्मी, ग्रीष्म और शीत ऋतु, और दिन और रात कभी बंद न होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “पृथ्वी के सारे दिनों तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹד כָּל יְמֵי הָאָרֶץ
  choice: जब तक पृथ्वी बनी रहेगी
  rationale: इब्रानी पदबंध पृथ्वी के समस्त दिनों की अवधि बताता है। यह हिंदी रूप स्वाभाविक ढंग से उसी कालगत सीमा को व्यक्त करता है, बिना इसे अनंतकाल का निरपेक्ष दावा बनाए।
- source_word: זֶרַע
  choice: बोआई
  rationale: קָצִיר के साथ युग्म में इसका आशय बीज वस्तु से नहीं, बीज बोने के कृषि-कार्य अथवा समय से है।
- source_word: קָצִיר
  choice: कटनी
  rationale: यह बोआई का स्वाभाविक कृषि-संबंधी प्रतिरूप है और साधारण हिंदी में फसल काटने के कार्य या समय को स्पष्ट करता है।
- source_word: קֹר וָחֹם
  choice: ठंड और गर्मी
  rationale: विरोधी जलवायु अवस्थाओं के युग्म को सीधा और स्वाभाविक रूप दिया गया है।
- source_word: קַיִץ וָחֹרֶף
  choice: ग्रीष्म और शीत ऋतु
  rationale: ये क्रमशः गर्मी और सर्दी के मौसम सूचित करते हैं; 'ऋतु' जोड़ने से पहले आए 'ठंड और गर्मी' के युग्म से अंतर स्पष्ट रहता है।
- source_word: יוֹם וָלַיְלָה
  choice: दिन और रात
  rationale: मूल के स्थिर युग्म और समय के निरंतर चक्र को यथावत रखता है।
- source_word: לֹא יִשְׁבֹּתוּ
  choice: कभी बंद न होंगे
  rationale: שׁבת यहाँ विश्राम करने के बजाय रुकने या समाप्त होने के अर्थ में है। 'बंद न होंगे' नामित चक्रों की निरंतरता को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: सृष्टि के नियमित चक्रों के विषय में प्रतिज्ञा की अवधि
  choice: यह प्रतिज्ञा तब तक लागू है जब तक पृथ्वी बनी रहती है।
  alternative: इन चक्रों के बिना किसी सीमा के सदा चलते रहने का निरपेक्ष दावा।
  rationale: כָּל יְמֵי הָאָרֶץ कथन को पृथ्वी के दिनों की अवधि तक सीमित करता है; अनुवाद इस कालगत सीमा को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कृषि-युग्म के लिए 'बोआई और कटनी' तथा ऋतु-युग्म को अलग पहचान देने के लिए 'ग्रीष्म और शीत ऋतु' चुना गया है।
