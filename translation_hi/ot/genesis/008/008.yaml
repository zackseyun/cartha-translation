base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/008.yaml
  text: Then he sent out the dove from him to see whether the waters had subsided from the surface of the ground[a][b].
translation:
  language: hi
  text: तब उसने अपने पास से एक कबूतर को बाहर भेजा, ताकि देखे कि धरती की सतह से पानी कम हुआ है या नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: तब उसने ... बाहर भेजा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ क्रम को और ‘बाहर भेजा’ पक्षी को छोड़ने के प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַיּוֹנָה
  choice: एक कबूतर को
  rationale: יוֹנָה कबूतर/फाख्ता जाति के पक्षी को दर्शाता है। हिन्दी बाइबलीय प्रयोग और इस प्रसंग में ‘कबूतर’ सर्वाधिक सहज है; निश्चित उपपद को हिन्दी में अनिवार्य रूप से अलग शब्द से व्यक्त नहीं किया जाता।
- source_word: מֵאִתּוֹ
  choice: अपने पास से
  rationale: यह नूह की उपस्थिति या निकटता से दूर भेजे जाने का भाव रखता है। ‘अपने पास से’ शाब्दिक संरचना और स्वाभाविक हिन्दी के बीच संतुलन रखता है तथा पाठ में न होने के कारण ‘जहाज़ से’ नहीं जोड़ता।
- source_word: לִרְאוֹת
  choice: ताकि देखे
  rationale: ראה का क्रियार्थक रूप उद्देश्य बताता है; ‘ताकि देखे’ इस उद्देश्य को सीधे व्यक्त करता है।
- source_word: הֲקַלּוּ
  choice: घटा है या नहीं
  rationale: קלל यहाँ बाढ़ के पानी के कम होने को बताता है। प्रश्नवाचक הֲ को हिन्दी में ‘या नहीं’ द्वारा स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: הַמַּיִם
  choice: पानी
  rationale: यद्यपि इब्रानी शब्द रूपतः बहुवचन है, आधुनिक हिन्दी में जलराशि के लिए ‘पानी’ स्वाभाविक अगणनीय संज्ञा है।
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: धरती की सतह पर से
  rationale: यह वाक्यांश भूमि की ऊपरी सतह से पानी हटने की स्थानिक छवि देता है। ‘धरती की सतह’ आधुनिक हिन्दी में स्पष्ट है और यहाँ पूरे ग्रह की अपेक्षा भूमि को सूचित करती है।
