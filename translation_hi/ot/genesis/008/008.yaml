  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। इब्रानी की प्रश्नात्मक अनिश्चितता को ‘या नहीं’ से सुरक्षित रखा गया है। अनावश्यक रूप से ‘जहाज़ से’ नहीं जोड़ा गया।
