  text: और गहरे जल के सोते और आकाश के झरोखे[a] बंद हो गए, और आकाश से होने वाली वर्षा को रोक दिया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आकाश के जल-द्वार।” इब्रानी में शाब्दिक रूप से आकाश के खुले भागों या झरोखों का उल्लेख है।
    reason: lexical_alternative
  - marker: b
    text: या “आकाश से होने वाली वर्षा थम गई।” इब्रानी क्रिया वर्षा के रोक दिए जाने पर बल दे सकती है, जिसका परिणाम उसका थम जाना था।
    reason: lexical_alternative
