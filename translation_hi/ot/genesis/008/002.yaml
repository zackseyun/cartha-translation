- source_word: וַיִּסָּכְרוּ
  choice: बन्द हो गए
  rationale: निफ़ाल रूप का निष्क्रिय भाव सुरक्षित रहता है और यह ‘सोते’ तथा ‘झरोखे’ दोनों के साथ स्वाभाविक है।
- source_word: מַעְיְנֹת תְּהוֹם
  choice: गहरे जल के सोते
  rationale: מַעְיְנֹת जल-स्रोतों को और תְּהוֹם सृष्टि-वर्णन के अथाह गहरे जल को सूचित करता है; यह अभिव्यक्ति आधुनिक हिन्दी में अर्थ स्पष्ट रखते हुए उस ब्रह्माण्डीय बिंब को बनाए रखती है।
- source_word: אֲרֻבֹּת הַשָּׁמַיִם
  choice: आकाश के झरोखे
  rationale: אֲרֻבֹּת का मूल बिंब खुलने-बन्द होने वाले झरोखों या खिड़कियों का है; ‘झरोखे’ काव्यात्मक किन्तु बोधगम्य हिन्दी है और ‘जल-द्वार’ जैसी व्याख्यात्मक तीव्रता नहीं जोड़ता।
- source_word: וַיִּכָּלֵא
  choice: रोक दी गई
  rationale: यह रूप वर्षा को थामे या रोके जाने का भाव देता है; केवल ‘रुक गई’ कहने से निष्क्रिय/नियंत्रित भाव कम हो जाता।
- source_word: הַגֶּשֶׁם
  choice: वर्षा
  rationale: ‘वर्षा’ सामान्य, सम्मानपूर्ण और प्रसंगानुकूल आधुनिक हिन्दी पर्याय है।
- source_word: מִן הַשָּׁמָיִם
  choice: आकाश से होनेवाली
  rationale: हिब्रू के स्रोत-संबंध को स्पष्ट करता है और उसी पद की पुनरावृत्ति को अर्थतः बनाए रखता है।
