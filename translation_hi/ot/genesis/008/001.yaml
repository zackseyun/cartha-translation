source:
  edition: WLC
  text: וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת נֹ֔חַ וְ/אֵ֤ת כָּל הַֽ/חַיָּה֙ וְ/אֶת כָּל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָ֑ה וַ/יַּעֲבֵ֨ר אֱלֹהִ֥ים ר֨וּחַ֙ עַל הָ/אָ֔רֶץ וַ/יָּשֹׁ֖כּוּ הַ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/001.yaml
  text: But God remembered Noah[a], and all the wild animals, and all the livestock that were with him in the ark. And God caused a wind to pass over the earth[b], and the waters subsided.
translation:
  language: hi
  text: परन्तु परमेश्वर ने नूह को, और उन सभी वन-पशुओं और पालतू पशुओं को याद किया[a], जो उसके साथ जहाज़ में थे। तब परमेश्वर ने पृथ्वी पर हवा बहाई[b], और पानी घट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नूह की सुध ली।” इब्रानी में “याद किया” प्रायः केवल स्मरण करने का नहीं, बल्कि ध्यान देकर निष्ठापूर्वक कार्य करने का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द רוּחַ का अर्थ “हवा,” “श्वास” या “आत्मा” हो सकता है। यहाँ प्रसंग के अनुसार “हवा” सबसे उपयुक्त है, यद्यपि इसमें उत्पत्ति 1:2 में जल के ऊपर आत्मा/हवा की प्रतिध्वनि भी सुनाई दे सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: याद किया
  rationale: यह इब्रानी मुहावरा केवल मानसिक स्मरण नहीं, बल्कि किसी की सुध लेकर उसके पक्ष में कार्य करने का भाव भी रखता है। ‘याद किया’ मूल बिंब और उसका धार्मिक-साहित्यिक तनाव बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: संदर्भ में यह एकवचन क्रिया के साथ इस्राएल के एक परमेश्वर के लिए प्रयुक्त है; हिन्दी बाइबलीय गद्य में ‘परमेश्वर’ स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: כָּל הַחַיָּה
  choice: सभी वन-पशुओं
  rationale: בְּהֵמָה के साथ युग्म में חַיָּה का अर्थ विशेषतः जंगली पशु है। ‘वन-पशु’ अगले वर्ग से भेद स्पष्ट रखता है।
- source_word: כָּל הַבְּהֵמָה
  choice: पालतू पशुओं
  rationale: यहाँ शब्द जंगली पशुओं के विपरीत घरेलू या पालतू पशुओं को दर्शाता है।
- source_word: אֲשֶׁר אִתּוֹ
  choice: जो उसके साथ
  rationale: सम्बन्धवाचक उपवाक्य का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: בַּתֵּבָה
  choice: जहाज़ में
  rationale: नूह के प्रसंग में תֵּבָה एक विशाल जलयान है। साधारण आधुनिक हिन्दी पाठक के लिए ‘जहाज़’ स्पष्ट और स्वाभाविक है, जबकि ‘सन्दूक’ इस प्रसंग में भ्रामक हो सकता है।
- source_word: וַיַּעֲבֵר ... רוּחַ
  choice: हवा चलाई
  rationale: העבר की कारक क्रिया और רוּחַ के मौसम-संबंधी अर्थ को सहज हिन्दी में व्यक्त करता है; परिणामस्वरूप पानी घटता है।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: जलप्रलय के व्यापक संदर्भ में אֶרֶץ का ‘पृथ्वी’ अर्थ उपयुक्त है, यद्यपि शब्द ‘भूमि’ भी हो सकता है।
- source_word: וַיָּשֹׁכּוּ הַמָּיִם
  choice: पानी घटने लगा
  rationale: क्रिया का अर्थ पानी का शांत होना या उतरना है। ‘घटने लगा’ घटनाक्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַ
  choice: परन्तु / तब
  rationale: आरम्भिक वाव न्याय से दया की ओर कथात्मक मोड़ दिखाता है, इसलिए ‘परन्तु’; अगला वाव क्रमिक परिणाम के लिए ‘तब’ से स्वाभाविक रूप में व्यक्त हुआ है।
theological_decisions:
- issue: ‘परमेश्वर ने नूह को याद किया’ में मानव-सदृश भाषा
  choice: मूल मुहावरे को ‘याद किया’ के रूप में बनाए रखा
  alternative: परमेश्वर ने नूह की सुध ली
  rationale: मूल की मानव-सदृश अभिव्यक्ति को समझाकर समाप्त नहीं किया गया। संदर्भ में इसका आशय परमेश्वर की विस्मृति नहीं, बल्कि नूह के प्रति उसकी ध्यानपूर्ण और प्रभावकारी निष्ठा है।
- issue: जलप्रलय के प्रसंग में רוּחַ का अर्थ
  choice: मुख्य पाठ में ‘हवा’
  alternative: आत्मा
  rationale: 'तत्काल प्रसंग मौसम-संबंधी है: हवा चलने पर पानी घटता है। फिर भी उत्पत्ति 1:2 में जल के ऊपर आत्मा/हवा की सम्भावित प्रतिध्वनि पादटिप्पणी में सुरक्षित रखी गई है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। पशुओं की दो इब्रानी श्रेणियों को ‘वन-पशु’ और ‘पालतू पशु’ से अलग रखा गया है। ‘याद किया’ तथा רוּחַ की वास्तविक अर्थ-सम्भावना पादटिप्पणियों सहित संरक्षित है।
