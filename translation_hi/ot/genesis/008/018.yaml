base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/018.yaml
  text: So Noah went out[b][a], and his sons and his wife and his sons’ wives with him.
translation:
  language: hi
  text: तब[a] नूह अपने बेटों, अपनी पत्नी और अपने बेटों की पत्नियों के साथ बाहर निकला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और नूह … बाहर निकला।” इब्रानी कथा-रूप को प्रसंग के अनुसार ‘तब’ या ‘और’ से व्यक्त किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: तब … बाहर निकला
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है। ‘तब’ प्रसंग में स्वाभाविक संबंधसूचक है और יָצָא का सीधा अर्थ ‘बाहर निकलना’ है।
- source_word: נֹחַ
  choice: नूह
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और सहज नाम-रूप।
- source_word: וּבָנָיו
  choice: अपने बेटों
  rationale: בָּנִים यहाँ विशेष रूप से पुत्रों को सूचित करता है; संबंधवाचक रूप हिन्दी वाक्य में स्वाभाविक है।
- source_word: וְאִשְׁתּוֹ
  choice: अपनी पत्नी
  rationale: एकवचन संज्ञा और तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय का सीधा अर्थ ‘उसकी पत्नी’ है; कर्ता नूह के साथ हिन्दी में ‘अपनी’ अधिक स्वाभाविक है।
- source_word: וּנְשֵׁי בָנָיו
  choice: अपने बेटों की पत्नियों
  rationale: यह इब्रानी अभिव्यक्ति का निकट और स्पष्ट रूप है; ‘बहुओं’ की अपेक्षा मूल संबंध को अधिक सीधे बनाए रखता है।
- source_word: אִתּוֹ
  choice: के साथ
  rationale: इब्रानी पूर्वसर्ग और प्रत्यय का अर्थ ‘उसके साथ’ है। हिन्दी में सभी साथियों को नूह से जोड़ने के लिए ‘के साथ’ स्वाभाविक रूप से प्रयुक्त हुआ है।
