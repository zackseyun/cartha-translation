  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। हिन्दी की स्वाभाविक वाक्य-रचना के अनुसार साथ आने वाले परिवारजनों को क्रिया से पहले रखा गया है, जबकि मूल के सभी संबंध और क्रम—बेटे, पत्नी, बेटों की पत्नियाँ—सुरक्षित हैं।
