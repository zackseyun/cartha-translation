source:
  edition: WLC
  text: וַ/תָּ֤נַח הַ/תֵּבָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י בְּ/שִׁבְעָה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ עַ֖ל הָרֵ֥י אֲרָרָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/004.yaml
  text: And in the seventh month[a], on the seventeenth day of the month, the ark came to rest on the mountains of Ararat.
translation:
  language: hi
  text: सातवें महीने के सत्रहवें दिन जहाज़ अरारात के पहाड़ों[a] पर आकर टिक गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘अरारात के पहाड़ों’ बहुवचन है; पाठ किसी एक खास पर्वत-शिखर, जैसे आज जिसे ‘अरारात पर्वत’ कहा जाता है, की बात आवश्यक रूप से नहीं करता, बल्कि अरारात के पहाड़ी क्षेत्र की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּנַח
  choice: आकर टिक गया
  rationale: נוח के वय्यिक्तोल रूप में जहाज़ के एक स्थान पर पहुँचकर स्थिर हो जाने की घटना व्यक्त है। ‘आकर टिक गया’ इस घटनात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַתֵּבָה
  choice: जहाज़
  rationale: नूह के जलयान के लिए आधुनिक हिन्दी में यह सहज और प्रसंगानुकूल शब्द है; मूल शब्द תֵּבָה संदूकनुमा बड़े पात्र या जलयान को सूचित करता है।
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: सातवें महीने
  rationale: कालसूचक ב और क्रमवाचक विशेषण का स्वाभाविक हिन्दी रूप; पूरी तिथि को ‘सातवें महीने के सत्रहवें दिन’ के रूप में व्यक्त किया गया है।
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: के सत्रहवें दिन
  rationale: इब्रानी तिथि-सूत्र का स्पष्ट और प्रचलित हिन्दी रूप।
- source_word: עַל
  choice: पर
  rationale: साधारण स्थानवाचक सम्बन्ध को सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: הָרֵי אֲרָרָט
  choice: अरारात के पहाड़ों
  rationale: הָרֵי बहुवचन समास रूप है, इसलिए अनुवाद बहुवचन रखता है और मूल पाठ को किसी एक विशिष्ट पर्वत-शिखर तक सीमित नहीं करता।
theological_decisions:
- issue: भौगोलिक पद הָרֵי אֲרָרָט
  choice: अरारात के पहाड़ों
  alternative: अरारात पर्वत पर
  rationale: मूल इब्रानी में ‘पहाड़’ बहुवचन है। अतः पारम्परिक एकवचन अभिव्यक्ति अपनाने से पाठ की अपेक्षा अधिक विशिष्ट भौगोलिक दावा हो जाता; बहुवचन मूल की सीमा और सम्भावित क्षेत्रीय अर्थ को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी वाक्यक्रम को कठोरता से दोहराने के बजाय हिन्दी के स्वाभाविक तिथि-विन्यास का प्रयोग किया गया है, जबकि घटनाक्रम और भौगोलिक बहुवचन सुरक्षित हैं।
