source:
  edition: WLC
  text: וַ/יִּ֥בֶן נֹ֛חַ מִזְבֵּ֖חַ לַֽ/יהוָ֑ה וַ/יִּקַּ֞ח מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה וּ/מִ/כֹּל֙ הָ/ע֣וֹף הַ/טָּהֹ֔ר וַ/יַּ֥עַל עֹלֹ֖ת בַּ/מִּזְבֵּֽחַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/020.yaml
  text: Then Noah built an altar to Yahweh[a], and took some of every clean animal and of every clean bird[b], and offered burnt offerings on the altar.
translation:
  language: hi
  text: तब नूह ने याहवे[a] के लिए एक वेदी बनाई। उसने हर प्रकार के शुद्ध पशु और हर प्रकार के शुद्ध पक्षी में से कुछ को लिया और वेदी पर होमबलियाँ चढ़ाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है, जिसे यहाँ ‘याहवे’ के रूप में प्रस्तुत किया गया है।
    reason: divine_name
lexical_decisions:
- source_word: וַיִּבֶן
  choice: बनाई
  rationale: בנה का सामान्य अर्थ ‘बनाना/निर्माण करना’ है; वेदी के साथ ‘वेदी बनाई’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: מִזְבֵּחַ
  choice: वेदी
  rationale: बलि चढ़ाने के स्थान के लिए हिन्दी बाइबलीय परंपरा में मानक और सुबोध शब्द।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ का हित/समर्पण संबंधी भाव ‘के लिए’ से व्यक्त होता है; יהוה को व्यक्तिगत परमेश्वरीय नाम के रूप में ‘यहोवा’ लिखा गया है।
- source_word: מִכֹּל
  choice: हर … में से कुछ
  rationale: मूल पाठ में शाब्दिक रूप से ‘हर/प्रत्येक … में से’ है। प्रसंगगत अंशवाचक भाव स्पष्ट करने और सभी शुद्ध जीवों की बलि का भ्रम टालने के लिए ‘कुछ’ जोड़ा गया है।
- source_word: הַבְּהֵמָה הַטְּהוֹרָה
  choice: हर शुद्ध पशु
  rationale: בְּהֵמָה स्थलीय पशु, विशेषतः बड़े या पालतू पशु, को सूचित कर सकता है; ‘पशु’ व्यापक और स्वाभाविक है। טָהוֹר का यहाँ बलि-संबंधी वर्गीकरण ‘शुद्ध’ से सुरक्षित रहता है।
- source_word: הָעוֹף הַטָּהֹר
  choice: हर शुद्ध पक्षी
  rationale: עוֹף उड़नेवाले प्राणी को दर्शाता है; इस बलि-प्रसंग में ‘पक्षी’ स्वाभाविक है और טָהוֹר के लिए ‘शुद्ध’ मूल की धार्मिक श्रेणी को बनाए रखता है।
- source_word: וַיַּעַל עֹלֹת
  choice: होमबलियाँ चढ़ाईं
  rationale: עלה का हिफ़ील यहाँ बलि चढ़ाने का तकनीकी भाव रखता है और עֹלֹת पूर्णतः जलाई जानेवाली बलियों का बहुवचन है; ‘होमबलियाँ चढ़ाईं’ संक्षिप्त, प्रचलित और अर्थपूर्ण है।
- source_word: בַּמִּזְבֵּחַ
  choice: वेदी पर
  rationale: בְּ का स्थानीय अर्थ इस प्रसंग में स्वाभाविक हिन्दी ‘वेदी पर’ से व्यक्त होता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में सामान्य उपाधि नहीं बल्कि चार अक्षरों वाला व्यक्तिगत नाम है। हिन्दी में व्यापक रूप से पहचाने जानेवाले ‘यहोवा’ को मुख्य पाठ में रखा गया और संभावित उच्चारण ‘याहवे’ को पादटिप्पणी में बताया गया; ‘प्रभु’ नाम को उपाधि से बदल देता।
- issue: מִכֹּל का अंशवाचक अर्थ
  choice: हर शुद्ध पशु और हर शुद्ध पक्षी में से कुछ
  alternative: हर शुद्ध पशु और हर शुद्ध पक्षी में से
  rationale: इब्रानी अभिव्यक्ति स्वयं ‘कुछ’ नहीं कहती, पर מן का अंशवाचक बल और कथा का प्रसंग हर श्रेणी में से चयन का संकेत देते हैं। मुख्य पाठ में आशय स्पष्ट किया गया, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण कथा-शैली। ‘वेदी’, ‘शुद्ध’ और ‘होमबलि’ जैसे स्थापित धर्मग्रंथीय शब्द बनाए गए हैं क्योंकि वे इस बलि-संबंधी प्रसंग को संक्षेप और सटीकता से व्यक्त करते हैं।
