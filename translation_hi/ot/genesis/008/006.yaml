  yaml_path: translation/ot/genesis/008/006.yaml
  text: At the end of forty days[b][a], Noah opened the window of the ark that he had made.
translation:
  language: hi
  text: चालीस दिन पूरे होने पर[a], नूह ने उस जहाज़ की खिड़की खोली जिसे उसने बनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चालीस दिन के बाद।” इब्रानी अभिव्यक्ति מִקֵּץ समयावधि पूरी होने पर आए बिंदु को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: (अलग से अनूदित नहीं; कालवाचक उपवाक्य में समाहित)
  rationale: यह इब्रानी कथात्मक सूत्र अगले घटनाक्रम को प्रस्तुत करता है। आधुनिक हिन्दी में इसे अलग से ‘और ऐसा हुआ’ कहने के बजाय आरंभिक कालवाचक वाक्यांश में समाहित करना अधिक स्वाभाविक है और कथाक्रम बना रहता है।
- source_word: מִקֵּץ
  choice: पूरे होने पर
  rationale: यह पद किसी समयावधि के अंत में पहुँचे बिंदु को दर्शाता है। ‘पूरे होने पर’ स्वाभाविक हिन्दी में इस अर्थ को व्यक्त करता है; ‘के बाद’ भी संभव है।
- source_word: אַרְבָּעִים יוֹם
  choice: चालीस दिन
  rationale: संख्या और संज्ञा का सीधा तथा स्वाभाविक हिन्दी रूप।
- source_word: וַיִּפְתַּח
  choice: खोली
  rationale: פתח का यहाँ सामान्य अर्थ ‘खोलना’ है; ‘खिड़की’ के साथ स्त्रीलिंग क्रियारूप प्रयुक्त हुआ है।
- source_word: חַלּוֹן
  choice: खिड़की
  rationale: यह संज्ञा सामान्यतः खिड़की अथवा खिड़की जैसे खुले स्थान को दर्शाती है; इस संदर्भ में ‘खिड़की’ स्पष्ट और प्रचलित है।
- source_word: הַתֵּבָה
  choice: जहाज़
  rationale: उत्पत्ति 6–9 में תֵּבָה नूह के जलपोत को दर्शाता है। आधुनिक साधारण हिन्दी में ‘जहाज़’ सहज बोधगम्य है, जबकि ‘सन्दूक’ वस्तु के आकार पर अनावश्यक बल दे सकता है।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो उसने बनाई थी
  rationale: सम्बन्धवाचक उपवाक्य निकटवर्ती स्त्रीलिंग संज्ञा ‘खिड़की’ से स्वाभाविक रूप से जुड़ता है। इब्रानी में सम्बन्धवाचक सर्वनाम का अपना लिंग नहीं है और क्रिया पर कर्म का लिंग चिह्नित नहीं होता; अतः व्याकरणतः यह ‘खिड़की’ को सूचित कर सकता है। पूर्ववर्ती वर्णन में नूह द्वारा जहाज़ की खिड़की बनाने का उल्लेख न होने पर भी यही निकटतम और स्वाभाविक सम्बद्धता है।
