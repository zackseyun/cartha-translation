  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כָּל הַֽ/חַיָּ֗ה כָּל הָ/רֶ֨מֶשׂ֙ וְ/כָל הָ/ע֔וֹף כֹּ֖ל רוֹמֵ֣שׂ עַל הָ/אָ֑רֶץ לְ/מִשְׁפְּחֹ֣תֵי/הֶ֔ם יָצְא֖וּ מִן הַ/תֵּבָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/019.yaml
  text: Every beast[a], every creeping thing, and every bird—everything that moves on the earth—went out from the ark by their families.
translation:
  language: hi
  text: हर पशु, हर रेंगनेवाला प्राणी और हर पक्षी—धरती पर चलने-फिरनेवाला हर प्राणी—अपने-अपने कुलों के अनुसार[a] जहाज़ से बाहर निकले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने-अपने परिवारों के अनुसार।’ इब्रानी अभिव्यक्ति पशुओं के वंशगत समूहों या विभागों का भाव बनाए रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: हर पशु
  rationale: यहाँ חַיָּה को रेंगनेवाले प्राणियों और पक्षियों से अलग श्रेणी के रूप में रखा गया है। ‘हर पशु’ इस वर्गीकरण को स्वाभाविक हिन्दी में व्यक्त करता है और पालतू या जंगली होने का अनावश्यक निर्धारण नहीं करता।
- source_word: כָּל הָרֶמֶשׂ
  choice: हर रेंगनेवाला प्राणी
  rationale: רֶמֶשׂ भूमि के निकट चलने या रेंगनेवाले छोटे प्राणियों की श्रेणी सूचित करता है। यह हिन्दी पद स्पष्ट है और उत्पत्ति के प्राणी-वर्गीकरण के अनुकूल है।
- source_word: וְכָל הָעוֹף
  choice: और हर पक्षी
  rationale: עוֹף व्यापक रूप से उड़नेवाले जीवों को सूचित कर सकता है, पर इस सूची और प्रसंग में ‘पक्षी’ सबसे स्वाभाविक और पर्याप्त रूप है।
- source_word: כֹּל רוֹמֵשׂ עַל הָאָרֶץ
  choice: धरती पर चलने-फिरनेवाला हर प्राणी
  rationale: रोमेश का अर्थ यहाँ धरती पर गति करनेवाले प्राणियों को समेटता है। ‘चलने-फिरनेवाला’ पहले आए ‘रेंगनेवाला’ की बोझिल पुनरावृत्ति से बचते हुए व्यापक अर्थ बनाए रखता है।
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: अपने-अपने कुलों के अनुसार
  rationale: מִשְׁפָּחָה का सामान्य अर्थ परिवार या कुल है। पशुओं के संदर्भ में यह वंशगत समूहों अथवा विभागों को दर्शाता है; ‘कुलों के अनुसार’ इस बिंब को ‘जातियों’ जैसे अधिक व्याख्यात्मक शब्द से बेहतर सुरक्षित रखता है।
- source_word: יָצְאוּ מִן הַתֵּבָה
  choice: जहाज़ से बाहर निकले
  rationale: יָצְאוּ साधारणतः बाहर जाने या निकलने का क्रियापद है। नूह के प्रसंग में תֵּבָה के लिए ‘जहाज़’ आधुनिक हिन्दी में परिचित और सहज पद है।
