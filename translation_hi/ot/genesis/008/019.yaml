translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हर’ से इब्रानी כָּל का वितरणात्मक बल व्यक्त किया गया है। मध्यवर्ती वाक्यांश को डैशों में रखकर मूल सूची की व्याख्यात्मक लय बनाए रखी गई है।
