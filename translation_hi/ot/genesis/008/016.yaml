base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/016.yaml
  text: Come out of the ark[a], you and your wife, and your sons and your sons' wives with you.
translation:
  language: hi
  text: “तुम अपनी पत्नी, अपने बेटों और अपने बेटों की पत्नियों के साथ जहाज़ से बाहर निकलो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֵא מִן הַתֵּבָה
  choice: जहाज़ से बाहर निकलो
  rationale: יצא का एकवचन पुल्लिंग आज्ञार्थक रूप बाहर जाने की सीधी आज्ञा देता है, और מִן उस स्थान के भीतर से बाहर आने को दर्शाता है। नूह के जलयान के लिए ‘जहाज़’ सहज और प्रचलित हिंदी शब्द है।
- source_word: אַתָּה
  choice: तुम
  rationale: स्वतंत्र सर्वनाम आज्ञा के कर्ता नूह को स्पष्ट करता है। आधुनिक मानक हिंदी में ‘तुम’ एकवचन संबोधन को स्वाभाविक रूप से व्यक्त करता है; अलग से ‘तुम स्वयं’ कहने पर अनावश्यक अतिरिक्त बल आ सकता था।
- source_word: וְאִשְׁתְּךָ
  choice: अपनी पत्नी
  rationale: इस संबंधसूचक प्रसंग में אִשָּׁה का अर्थ स्पष्ट रूप से ‘पत्नी’ है। हिंदी में कर्ता से संबंध दिखाने के लिए ‘अपनी’ स्वाभाविक है।
- source_word: וּבָנֶיךָ
  choice: अपने बेटों
  rationale: בָּנִים यहाँ पुत्रों को सूचित करता है, सामान्य रूप से सभी बच्चों को नहीं; आगे उनकी पत्नियों का उल्लेख भी इसकी पुष्टि करता है।
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: अपने बेटों की पत्नियों
  rationale: यह इब्रानी पदबंध का पारदर्शी और लगभग शाब्दिक रूप है। ‘बहुओं’ की अपेक्षा यह मूल संबंध-रचना को अधिक स्पष्ट रूप से बनाए रखता है।
- source_word: אִתָּךְ
  choice: के साथ
  rationale: यह परिवार के सदस्यों के नूह के साथ होने का भाव व्यक्त करता है। हिंदी वाक्य-विन्यास में इसे पूरी सूची के साथ जोड़ना स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। एकवचन संबोधन के लिए ‘तुम’ चुना गया है, जिससे इब्रानी की संख्या बनी रहती है और हिंदी में अनावश्यक रूप से कठोर या अत्यधिक औपचारिक स्वर नहीं आता। अंग्रेज़ी परामर्श-पाठ की पाद-टिप्पणी का चिह्न ‘ark’ के बाद है, जबकि उसकी सामग्री ‘sons’ wives’ से संबंधित है; हिंदी मुख्य पाठ स्वयं मूल पदबंध को स्पष्ट रूप से व्यक्त करता है, इसलिए कोई पाद-टिप्पणी नहीं जोड़ी गई।
