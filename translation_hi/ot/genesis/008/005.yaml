base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/005.yaml
  text: And the waters continued to recede until the tenth month. In the tenth month[a], on the first day of the month, the tops of the mountains became visible.
translation:
  language: hi
  text: जल लगातार घटता रहा, जब तक कि दसवाँ महीना नहीं आया। दसवें महीने के पहले दिन पहाड़ों की चोटियाँ दिखाई दीं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दिखाई पड़ीं” अथवा “प्रकट हुईं।” इब्रानी क्रिया का अधिक औपचारिक अनुवाद “देखी गईं” भी हो सकता है; यहाँ इसका अर्थ है कि जल घटने पर पहाड़ों की चोटियाँ दृष्टि में आ गईं, बिना किसी विशेष देखने वाले का संकेत दिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּיִם
  choice: जल
  rationale: हिन्दी में ‘जल’ सामूहिक द्रव्यवाचक संज्ञा के रूप में स्वाभाविक है और बाढ़ के पानी का सामूहिक अर्थ व्यक्त करता है।
- source_word: הָיוּ הָלוֹךְ וְחָסוֹר
  choice: लगातार घटता गया और ... घटता रहा
  rationale: היה के साथ क्रियार्थक निरपेक्ष रूप जारी और क्रमिक क्रिया बताते हैं। यह हिन्दी अभिव्यक्ति जल के निरंतर कम होते जाने का भाव सुरक्षित रखती है।
- source_word: עַד הַחֹדֶשׁ הָעֲשִׂירִי
  choice: दसवें महीने तक
  rationale: חֹדֶשׁ कथा के काल-निर्देश में सामान्यतः ‘महीना’ है; ‘तक’ עַד की समय-सीमा को व्यक्त करता है।
- source_word: בָּעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ
  choice: दसवें महीने के पहले दिन
  rationale: इब्रानी की संक्षिप्त दिनांक-रचना को सहज आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त किया गया है।
- source_word: נִרְאוּ
  choice: दिखाई देने लगीं
  rationale: निफ़अल रूप यहाँ दृश्य होने अथवा दृष्टि में आने का भाव देता है। यह चयन किसी विशेष देखने वाले को जोड़े बिना क्रमिक प्रकटता व्यक्त करता है।
- source_word: רָאשֵׁי הֶהָרִים
  choice: पहाड़ों की चोटियाँ
  rationale: רֹאשׁ का शाब्दिक अर्थ ‘सिर’ है, पर स्थलाकृतिक संदर्भ में ‘चोटियाँ’ स्वाभाविक हिन्दी है और पहाड़ों के ऊपरी भागों को दर्शाता है।
