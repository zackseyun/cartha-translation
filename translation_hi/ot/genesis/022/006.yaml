id: GEN.22.6
reference: Genesis 22:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת עֲצֵ֣י הָ/עֹלָ֗ה וַ/יָּ֨שֶׂם֙ עַל יִצְחָ֣ק בְּנ֔/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ אֶת הָ/אֵ֖שׁ וְ/אֶת הַֽ/מַּאֲכֶ֑לֶת וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/006.yaml
  text: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
translation:
  language: hi
  text: तब अब्राहम ने होमबलि की लकड़ियाँ लेकर अपने पुत्र इसहाक पर रखीं, और आग और छुरी अपने हाथ में ली। फिर वे दोनों साथ-साथ आगे चले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצֵי הָעֹלָה
  choice: होमबलि की लकड़ियाँ
  rationale: इब्रानी संबंधवाचक रचना का स्वाभाविक हिन्दी रूप है। ‘होमबलि’ उस बलि को व्यक्त करता है जो पूरी तरह आग में जलाई जाती थी, और ‘लकड़ियाँ’ बहुवचन को बनाए रखता है।
- source_word: וַיָּשֶׂם עַל
  choice: पर रखीं
  rationale: שׂים के साथ עַל का सीधा और स्वाभाविक अर्थ किसी वस्तु को किसी पर रखना है; इससे इसहाक पर रखे गए बोझ का चित्र भी बना रहता है।
- source_word: יִצְחָק בְּנוֹ
  choice: अपने पुत्र इसहाक
  rationale: यह हिन्दी में स्वाभाविक शब्दक्रम है और इसहाक के पुत्र होने पर इब्रानी पाठ का संबंध स्पष्ट रखता है।
- source_word: בְּיָדוֹ
  choice: अपने हाथ में
  rationale: इब्रानी एकवचन ‘उसके हाथ में’ का स्वाभाविक हिन्दी प्रतिरूप है और बताता है कि अब्राहम ने इन वस्तुओं को स्वयं लिया।
- source_word: הָאֵשׁ
  choice: आग
  rationale: मूल पाठ केवल ‘आग’ कहता है; किसी अंगारे, मशाल या पात्र को निर्दिष्ट करना पाठ से अधिक कहना होगा।
- source_word: הַמַּאֲכֶלֶת
  choice: छुरी
  rationale: यह वध में प्रयुक्त काटने वाले औजार को सूचित करता है। ‘छुरी’ सामान्य आधुनिक हिन्दी में स्पष्ट है, जबकि बलिदान संबंधी प्रयोजन प्रसंग से प्रकट होता है।
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: वे दोनों साथ-साथ आगे चले
  rationale: ‘वे दोनों’ स्पष्ट द्वित्व, ‘साथ-साथ’ संयुक्त यात्रा, और ‘आगे चले’ कथा में जारी गति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: עֹלָה की बलिदान-संबंधी संज्ञा
  choice: होमबलि
  alternative: आरोहण-बलि
  rationale: इस प्रसंग में עֹלָה उस स्थापित बलिदान-श्रेणी का नाम है जो पूरी तरह आग में चढ़ाई जाती थी। ‘होमबलि’ हिन्दी बाइबिलीय प्रयोग में इसे संक्षेप और स्पष्टता से व्यक्त करता है; ‘आरोहण-बलि’ मूल धातु की छवि तो रखता है, पर सामान्य पाठक के लिए अनावश्यक रूप से अस्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘तब’ क्रमिक वाव का स्वाभाविक कथात्मक प्रतिनिधित्व करता है। पाठ की गंभीरता बनाए रखते हुए अनिर्दिष्ट बातों—जैसे आग किस पात्र में थी या छुरी का विशेष प्रकार—को नहीं जोड़ा गया है।
