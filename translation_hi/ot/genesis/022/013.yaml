base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/013.yaml
  text: Then Abraham lifted up his eyes and looked[a], and behold, behind him was a ram caught in the thicket by its horns[b]. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: hi
  text: तब अब्राहम ने आँखें उठाईं और देखा। और देखो, उसके पीछे एक मेढ़ा था, जो घनी झाड़ी में अपने सींगों से फँसा हुआ था।[a] अब्राहम गया, उस मेढ़े को ले लिया, और अपने पुत्र के बदले उसे होमबलि के रूप में चढ़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसके पीछे” के स्थान पर केवल “पीछे” भी संभव है; इब्रानी में यहाँ “उसके” स्पष्ट रूप से नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: आँखें उठाकर देखा
  rationale: यह स्वाभाविक आधुनिक हिन्दी में दृष्टि ऊपर उठाने के इब्रानी मुहावरे को सुरक्षित रखता है; अगले וַיַּרְא को इसी संयुक्त क्रिया में सहज रूप से व्यक्त किया गया है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह कथन में अचानक ध्यान खींचने वाले इब्रानी संकेतक का प्रभाव बनाए रखता है।
- source_word: אַיִל
  choice: मेढ़ा
  rationale: वयस्क नर भेड़ और बलिदान के प्रसंग के लिए यह सटीक तथा प्रचलित हिन्दी शब्द है।
- source_word: אַחַר
  choice: उसके पीछे
  rationale: प्रसंग में इसे स्थानवाचक क्रियाविशेषण समझना सबसे स्वाभाविक है; फिर भी इब्रानी व्यंजन-पाठ में सर्वनाम स्पष्ट नहीं है, इसलिए पाठगत अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: נֶאֱחַז בַּסְּבַךְ בְּקַרְנָיו
  choice: अपने सींगों से झाड़ी में फँसा हुआ
  rationale: यह निष्क्रिय परिणामी अर्थ और सींगों के कारण झाड़ी में अटकने की छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּקַּח
  choice: पकड़ा
  rationale: यहाँ 'ले लिया' की अपेक्षा जानवर को अपने अधिकार में लेने की क्रिया को प्रसंगानुकूल और सहज ढंग से व्यक्त करता है।
- source_word: וַיַּעֲלֵהוּ לְעֹלָה
  choice: उसे होमबलि के रूप में चढ़ाया
  rationale: बलिदानी प्रसंग में עלה और עֹלָה की संयुक्त अभिव्यक्ति को संक्षिप्त, पारंपरिक किंतु समझने योग्य हिन्दी में प्रस्तुत करता है।
- source_word: תַּחַת בְּנוֹ
  choice: अपने पुत्र के बदले
  rationale: यहाँ תַּחַת का स्पष्ट प्रतिस्थापनार्थक भाव आधुनिक हिन्दी में सीधे व्यक्त होता है।
theological_decisions:
- issue: תַּחַת בְּנוֹ में प्रतिस्थापन का भाव
  choice: अपने पुत्र के बदले
  alternative: अपने पुत्र के स्थान पर
  rationale: दोनों इब्रानी के प्रतिस्थापनार्थक अर्थ को व्यक्त करते हैं; 'के बदले' अधिक सहज है और पद से आगे कोई बाद की धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। इब्रानी कथाशैली का ध्यानाकर्षक “और देखो” सुरक्षित है। उपलब्ध अंग्रेज़ी पादटिप्पणियों में दूसरी पादटिप्पणी का चिह्न मुख्य पाठ के अर्थ से मेल नहीं खाता था; “अपने पुत्र के बदले/स्थान पर” का विकल्प वास्तविक अर्थांतर नहीं, समानार्थी हिन्दी अभिव्यक्ति है, इसलिए उसे धर्मवैज्ञानिक निर्णय में दर्ज किया गया, अलग पादटिप्पणी नहीं बनाई गई।
