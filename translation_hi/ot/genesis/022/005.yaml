  text: וַ/יֹּ֨אמֶר אַבְרָהָ֜ם אֶל נְעָרָ֗י/ו שְׁבוּ לָ/כֶ֥ם פֹּה֙ עִֽם הַ/חֲמ֔וֹר וַ/אֲנִ֣י וְ/הַ/נַּ֔עַר נֵלְכָ֖ה עַד כֹּ֑ה וְ/נִֽשְׁתַּחֲוֶ֖ה וְ/נָשׁ֥וּבָה אֲלֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/005.yaml
  text: And Abraham said to his young men[a], “Stay here with the donkey. I and the boy will go over there[b], and we will worship and return to you.”
translation:
  language: hi
  text: तब अब्राहम ने अपने जवान सेवकों से कहा, “तुम लोग गधे के साथ यहीं ठहरो। मैं और यह लड़का वहाँ तक जाएँगे, आराधना करेंगे[a], और तुम्हारे पास लौट आएँगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दण्डवत करेंगे”; इब्रानी क्रिया का अधिक शाब्दिक अर्थ आराधना में झुकना या भूमि पर दण्डवत करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अब्राहम ने शाब्दिक रूप से बहुवचन में कहा, “हम तुम्हारे पास लौट आएँगे।” पाठ यह नहीं बताता कि वह किसी बात को छिपा रहा था, ऐसी आशा कर रहा था, या परमेश्वर के प्रबन्ध पर भरोसा व्यक्त कर रहा था।
    reason: theological_ambiguity
lexical_decisions:
- source_word: נְעָרָיו
  choice: अपने जवानों
  rationale: נַעַר युवक, सेवक या परिचारक को सूचित कर सकता है। यहाँ ये अब्राहम के साथ आए दो पुरुष हैं; ‘जवानों’ से मूल शब्द का व्यापक अर्थ और इसी पद में इसहाक के लिए प्रयुक्त संबंधित शब्द के साथ शाब्दिक संबंध बना रहता है।
- source_word: שְׁבוּ לָכֶם פֹּה
  choice: तुम लोग ... यहीं ठहरो
  rationale: יָשַׁב का मूल अर्थ बैठना, रहना या ठहरना है; आगे न आने के निर्देश में ‘यहीं ठहरो’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: עִם הַחֲמוֹר
  choice: गधे के साथ
  rationale: חֲמוֹר के लिए सामान्य आधुनिक हिन्दी शब्द ‘गधा’ है।
- source_word: וַאֲנִי וְהַנַּעַר
  choice: मैं और यह लड़का
  rationale: נַעַר यहाँ इसहाक को सूचित करता है। ‘यह लड़का’ प्रसंग और अब्राहम के दृष्टिकोण को स्वाभाविक रूप से व्यक्त करता है, बिना उसकी ठीक आयु निर्धारित किए।
- source_word: נֵלְכָה עַד כֹּה
  choice: वहाँ तक जाएँगे
  rationale: עַד כֹּה में निर्दिष्ट स्थान तक जाने का भाव है; ‘वहाँ तक’ उस स्थानसूचक अर्थ को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: וְנִשְׁתַּחֲוֶה
  choice: आराधना करेंगे
  rationale: שָׁחָה का मूल भाव झुकने या दण्डवत करने का है और धार्मिक प्रसंग में आराधना करना अभिप्रेत हो सकता है। मुख्य पाठ में धार्मिक आशय रखा गया है और शारीरिक भाव पादटिप्पणी में दिया गया है।
- source_word: וְנָשׁוּבָה אֲלֵיכֶם
  choice: और तुम्हारे पास लौट आएँगे
  rationale: मूल में प्रथम पुरुष बहुवचन है। हिन्दी में ‘लौट आएँगे’ वापसी का स्वाभाविक बोध देता है और अब्राहम तथा इसहाक दोनों को कर्ता बनाए रखता है।
theological_decisions:
- issue: लौटने के विषय में अब्राहम का बहुवचन कथन
  choice: “लौट आएँगे” के स्पष्ट बहुवचन को बनाए रखना
  alternative: इसे अब्राहम द्वारा बात छिपाना, विश्वास की घोषणा करना, या परमेश्वर के प्रबन्ध पर भरोसा मानकर स्पष्ट कर देना
  rationale: इब्रानी में आराधना और लौटने—दोनों क्रियाएँ प्रथम पुरुष बहुवचन में हैं। पाठ स्वयं अब्राहम के आशय की व्याख्या नहीं करता, इसलिए अनुवाद उस धार्मिक और कथात्मक तनाव को अनिर्णीत रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी रखी गई है। ‘जवानों’, ‘लड़का’, ‘यहीं ठहरो’ और ‘वहाँ तक’ साधारण पाठक के लिए सहज हैं; बहुवचन ‘लौट आएँगे’ मूल की अनिर्णीत धार्मिक तनावपूर्णता को सुरक्षित रखता है।
