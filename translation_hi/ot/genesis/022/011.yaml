  edition: WLC
  text: וַ/יִּקְרָ֨א אֵלָ֜י/ו מַלְאַ֤ךְ יְהוָה֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֖אמֶר אַבְרָהָ֣ם אַבְרָהָ֑ם וַ/יֹּ֖אמֶר הִנֵּֽנִ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/011.yaml
  text: But the angel of Yahweh called to him from heaven and said[a], “Abraham, Abraham!” And he said[b], “Here I am.”
translation:
  language: hi
  text: तब याहवे के दूत[a] ने स्वर्ग[b] से उसे पुकारा और कहा, “अब्राहम! अब्राहम!” उसने उत्तर दिया, “मैं यहाँ हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी מַלְאָךְ का अर्थ “दूत” या “स्वर्गदूत” हो सकता है; यहाँ वक्ता स्वर्ग से पुकारता है, इसलिए “स्वर्गदूत” भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “स्वर्गों से” है; स्वाभाविक हिन्दी में “स्वर्ग से” किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: पुकारकर कहा
  rationale: इस प्रसंग में קרא किसी व्यक्ति को ऊँची या स्पष्ट आवाज़ में संबोधित करने का बोध देता है; ‘पुकारकर कहा’ स्वाभाविक हिन्दी में अगले וַיֹּאמֶר के साथ वाक्य-संबंध भी बनाए रखता है।
- source_word: אֵלָיו
  choice: उसे
  rationale: אֶל के प्रत्यययुक्त रूप का संकेत अब्राहम की ओर है; ‘उसे’ हिन्दी में पुकारने की क्रिया के साथ स्वाभाविक है।
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे का दूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। स्वर्गीय प्रसंग के बावजूद ‘दूत’ मूल शब्द की व्यापकता और वास्तविक द्विअर्थता को सुरक्षित रखता है; याहवे को स्वयं वक्ता के साथ बिना आधार अभिन्न नहीं ठहराया गया है।
- source_word: מִן הַשָּׁמַיִם
  choice: स्वर्ग से
  rationale: שָׁמַיִם रूप की दृष्टि से बहुवचन है, पर यहाँ परमेश्वर के आकाशीय निवास-क्षेत्र के लिए प्रयुक्त है; आधुनिक हिन्दी में ‘स्वर्ग से’ स्वाभाविक रूप है।
- source_word: וַיֹּאמֶר
  choice: कहा / उत्तर दिया
  rationale: पहले प्रयोग में ‘कहा’ सीधा समतुल्य है। दूसरे प्रयोग में संवाद की प्रतिक्रिया स्पष्ट करने के लिए ‘उत्तर दिया’ स्वाभाविक है और अर्थ नहीं बदलता।
- source_word: אַבְרָהָם אַבְרָהָם
  choice: अब्राहम! अब्राहम!
  rationale: नाम की पुनरावृत्ति मूल पाठ का आग्रह और व्यक्तिगत संबोधन बनाए रखती है।
- source_word: הִנֵּנִי
  choice: मैं यहाँ हूँ
  rationale: यह उपस्थिति और तत्परता बताने वाला पारंपरिक उत्तर है; ‘मैं यहाँ हूँ’ आधुनिक हिन्दी में सहज और स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिवाचक वाचा-नाम है। ‘याहवे’ उसका निकट देवनागरी लिप्यंतरण है और उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: याहवे का दूत
  alternative: याहवे का स्वर्गदूत / स्वयं याहवे का प्रकट रूप
  rationale: पाठ उसे याहवे का מַלְאָךְ कहता है, पर इस पद में उसकी तात्त्विक पहचान की अलग व्याख्या नहीं करता। ‘दूत’ इस तनाव को खुला रखता है और किसी विशिष्ट सांप्रदायिक निष्कर्ष को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। आरम्भ का ‘तभी’ वַ के प्रसंगगत क्रम और निर्णायक हस्तक्षेप को व्यक्त करता है। संवाद में छोटे, सीधे वाक्य रखे गए हैं।
