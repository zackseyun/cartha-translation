source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם אֱלֹהִ֞ים יִרְאֶה לּ֥/וֹ הַ/שֶּׂ֛ה לְ/עֹלָ֖ה בְּנִ֑/י וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/008.yaml
  text: And Abraham said[a], “God will provide for himself the lamb for a burnt offering, my son.” So the two of them went on together.
translation:
  language: hi
  text: तब अब्राहम ने कहा[a], “मेरे बेटे, परमेश्वर होमबलि के लिए मेमने का प्रबंध अपने लिए करेगा।” और वे दोनों साथ-साथ आगे चलते गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “परमेश्वर होमबलि के लिए मेमने को अपने लिए देखेगा।” यहाँ प्रयुक्त इब्रानी क्रिया का अर्थ “देखना” हो सकता है और इस प्रसंग में मुहावरेदार रूप से “प्रबंध करना” भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है। ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है, बिना अतिरिक्त कारणात्मक अर्थ जोड़े।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: अब्राहम के कथन में यह इस्राएल के परमेश्वर के लिए प्रयुक्त सामान्य पद है; आधुनिक मानक हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: יִרְאֶה לּוֹ
  choice: प्रबंध अपने लिए करेगा
  rationale: רָאָה का मूल अर्थ ‘देखना’ है, पर यहाँ मुहावरेदार अर्थ ‘देख लेना/प्रबंध करना’ है। לּוֹ को ‘अपने लिए’ से स्पष्ट रखा गया है; इससे यह भाव बना रहता है कि परमेश्वर स्वयं अपने उद्देश्य के लिए बलि का पशु उपलब्ध करेगा।
- source_word: הַשֶּׂה
  choice: मेमने
  rationale: שֶׂה भेड़ या बकरी जैसे छोटे पालतू पशु को सूचित कर सकता है। इस बलिदानी संदर्भ और पिछले प्रश्न में प्रचलित हिन्दी अभिव्यक्ति के अनुसार ‘मेमना’ स्वाभाविक है, यद्यपि मूल शब्द अधिक व्यापक हो सकता है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה उस बलि का मानक पद है जो पूरी तरह वेदी पर जलाई जाती थी। ‘होमबलि’ हिन्दी की स्थापित, संक्षिप्त बलिदानी शब्दावली है।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: यह इसहाक के प्रति अब्राहम का सीधा और स्नेहपूर्ण संबोधन है। हिन्दी में ‘मेरे बेटे’ संबंध और भाव दोनों को स्वाभाविक रूप से रखता है।
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: और वे दोनों साथ-साथ आगे चलते गए
  rationale: यह अनुवाद दोनों के संयुक्त रूप से चलते रहने पर मूल के बल को बनाए रखता है और निकटवर्ती कथा में दोहराए गए वाक्यांश की प्रतिध्वनि भी बचाता है।
theological_decisions:
- issue: परमेश्वर के कार्य के विषय में अब्राहम के कथन का अर्थ
  choice: परमेश्वर होमबलि के लिए मेमने का प्रबंध अपने लिए करेगा
  alternative: परमेश्वर होमबलि के लिए मेमने को अपने लिए देखेगा / देख लेगा
  rationale: संदर्भ में ‘देखना’ मुहावरेदार रूप से ‘प्रबंध करना’ व्यक्त करता है, जबकि ‘अपने लिए’ לּוֹ को सुरक्षित रखता है। अनुवाद यह तय नहीं करता कि अब्राहम टालमटोल कर रहा था, विश्वास व्यक्त कर रहा था, भविष्यसूचक रूप से बोल रहा था, या इनका कोई संयोजन था; अतः कथा का तनाव बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘होमबलि’ स्थापित बाइबलीय शब्द है; ‘मेमना’ आम पाठक के लिए परिचित है। ‘साथ-साथ आगे चलते गए’ मूल के संयुक्त गमन और कथा में उसके भावनात्मक दोहराव को बनाए रखता है।
