  text: וַ/יֹּ֡אמֶר קַח נָ֠א אֶת בִּנְ/ךָ֨ אֶת יְחִֽידְ/ךָ֤ אֲשֶׁר אָהַ֨בְתָּ֙ אֶת יִצְחָ֔ק וְ/לֶךְ לְ/ךָ֔ אֶל אֶ֖רֶץ הַ/מֹּרִיָּ֑ה וְ/הַעֲלֵ֤/הוּ שָׁם֙ לְ/עֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽ/הָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/002.yaml
  text: And he said[a], “Please take your son, your only one, whom you love—Isaac—and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains that I will tell you.”
translation:
  language: hi
  text: उसने कहा, “कृपया अपने पुत्र को—अपने इकलौते[a] को, जिससे तुम प्रेम करते हो, अर्थात् इसहाक को—लेकर मोरिय्याह के देश में जाओ। वहाँ उन पहाड़ों में से एक पर, जिसके बारे में मैं तुम्हें बताऊँगा, उसे होमबलि के रूप में चढ़ाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने इकलौते पुत्र को।” इब्रानी शब्द יְחִידְךָ किसी इकलौते या अद्वितीय व्यक्ति पर बल दे सकता है; यहाँ यह आदेश में इसहाक की विशिष्ट स्थिति को उभारता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  choice: कृपया
  rationale: यह विनय अथवा आग्रह सूचित करने वाला अव्यय है; ‘कृपया’ आधुनिक हिन्दी में उसके भाव को स्वाभाविक रूप से व्यक्त करता है और इसे कालवाचक ‘अब’ नहीं बनाता।
- source_word: בִּנְךָ
  choice: अपने पुत्र को
  rationale: בֵּן और द्वितीय पुरुष एकवचन प्रत्यय का सीधा, मानक अनुवाद। ‘अपने’ हिन्दी वाक्य में संबोधित व्यक्ति से संबंध स्पष्ट करता है।
- source_word: יְחִידְךָ
  choice: अपने एकमात्र को
  rationale: יָחִיד किसी इकलौते अथवा अद्वितीय व्यक्ति पर बल देता है। इश्माएल के अस्तित्व को देखते हुए यह रूप उस संबंधपरक और विशेष स्थिति को बनाए रखता है, बिना उसे केवल जैविक अर्थ में सीमित किए।
- source_word: אֲשֶׁר אָהַבְתָּ
  choice: जिससे तुम प्रेम करते हो
  rationale: पूर्ण क्रिया यहाँ अब्राहम के स्थापित और वर्तमान प्रेम को बताती है; हिन्दी में वर्तमान काल उसका स्वाभाविक भाव देता है।
- source_word: וְלֶךְ לְךָ
  choice: लेकर … जाओ
  rationale: הלך + לְךָ का स्वाभाविक हिन्दी आदेश ‘जाओ’ है; ‘लेकर’ पहले आदेश קַח से जुड़कर वाक्य को सहज बनाता है। अतिरिक्त आत्मवाचक बल आरोपित नहीं किया गया।
- source_word: אֶרֶץ הַמֹּרִיָּה
  choice: मोरिय्याह देश
  rationale: אֶרֶץ का अर्थ देश अथवा भूभाग हो सकता है। ‘मोरिय्याह देश’ संक्षिप्त, पारंपरिक और स्पष्ट है।
- source_word: וְהַעֲלֵהוּ
  choice: उसे … चढ़ाओ
  rationale: बलिदान के प्रसंग में עלה का हिफ़ील रूप अर्पित करने या चढ़ाने का अर्थ देता है। ‘चढ़ाओ’ होमबलि की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְעֹלָה
  choice: होमबलि के रूप में
  rationale: עֹלָה पूर्णतः जलाए जाने वाले बलिदान का मानक पद है; ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में परिचित और संक्षिप्त है।
- source_word: עַל אַחַד הֶהָרִים
  choice: उन पहाड़ों में से एक पर
  rationale: הַר का सामान्य अर्थ ‘पहाड़’ है और यह वाक्य किसी अभी अनिर्दिष्ट पहाड़ को समूह में से चुनता है।
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: जिसके बारे में मैं तुम्हें बताऊँगा
  rationale: אָמַר का मूल अर्थ ‘कहना’ है, पर इस रचना में ‘बताऊँगा’ स्वाभाविक हिन्दी है। ‘दिखाऊँगा’ कहने से स्रोत से भिन्न क्रिया जुड़ जाती।
theological_decisions:
- issue: इश्माएल के अस्तित्व के बावजूद יְחִידְךָ का इसहाक के लिए प्रयोग
  choice: अपने एकमात्र को
  alternative: अपने इकलौते पुत्र को
  rationale: यह अनुवाद इसहाक की विलक्षण, संबंधपरक और प्रतिज्ञा-संबंधी स्थिति पर बल बनाए रखता है, पर यह तय नहीं करता कि पद का आशय केवल जैविक इकलौतापन है। पारंपरिक और संभव वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। एक व्यक्ति को संबोधित करने के लिए ‘तुम’ का प्रयोग किया गया है, ताकि आधुनिक पाठक के लिए भाषा स्वाभाविक रहे और ‘तू’ से उत्पन्न संभावित अवमाननापूर्ण आभास से बचा जा सके। आदेशों में आदरसूचक बहुवचन नहीं, बल्कि सामान्य एकवचन-संबोधन के क्रियारूप हैं।
