base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/003.yaml
  text: Abraham rose early in the morning[a], saddled his donkey, took two of his young men with him and Isaac his son, split the wood for a burnt offering, and arose and went to the place that God had told him.
translation:
  language: hi
  text: अब्राहम सुबह तड़के उठा। उसने अपने गधे पर काठी कसी और अपने दो जवानों[a] तथा अपने पुत्र इसहाक को साथ लिया। उसने होमबलि के लिए लकड़ियाँ चीरीं; फिर वह उठा और उस स्थान की ओर चल पड़ा, जिसके बारे में परमेश्वर ने उसे बताया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने दो सेवकों” अथवा “अपने दो परिचारकों”; इब्रानी शब्द נְעָרִים प्रसंग के अनुसार जवान पुरुषों या पुरुष सेवकों/परिचारकों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר
  choice: अब्राहम सुबह तड़के उठा
  rationale: השׁכים का अर्थ केवल जागना नहीं, बल्कि सवेरे जल्दी उठना है। ‘सुबह तड़के उठा’ इस बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: उसने अपने गधे पर काठी कसी
  rationale: इस यात्रा-संदर्भ में חבש का आशय गधे को काठी या यात्रा-सामग्री बाँधकर तैयार करना है।
- source_word: שְׁנֵי נְעָרָיו
  choice: अपने दो जवानों
  rationale: נַעַר युवक, सेवक या परिचारक के लिए प्रयुक्त हो सकता है। ‘जवानों’ मूल की आयु-संबंधी धारणा को रखते हुए सेवक होने की बात को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יִצְחָק בְּנוֹ
  choice: अपने पुत्र इसहाक को
  rationale: स्वाभाविक हिन्दी शब्दक्रम में इसहाक और अब्राहम के पुत्र-संबंध को स्पष्ट तथा प्रमुख रखा गया है।
- source_word: וַיְבַקַּע עֲצֵי עֹלָה
  choice: उसने होमबलि के लिए लकड़ियाँ चीरीं
  rationale: בקע का विशिष्ट अर्थ चीरना या फाड़ना है, और עֹלָה के लिए स्थापित हिन्दी पारिभाषिक शब्द ‘होमबलि’ है।
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: फिर वह उठा और ... चल पड़ा
  rationale: इब्रानी के दोनों क्रमिक क्रियापद बनाए रखे गए हैं, जबकि ‘चल पड़ा’ हिन्दी कथन में यात्रा आरम्भ करने का स्वाभाविक भाव देता है।
- source_word: אֶל־הַמָּקוֹם אֲשֶׁר אָמַר־לוֹ הָאֱלֹהִים
  choice: उस स्थान की ओर ... जिसके बारे में परमेश्वर ने उससे कहा था
  rationale: यह पूर्व में दिए गए परमेश्वर के निर्देश को स्वाभाविक हिन्दी में व्यक्त करता है और ‘स्थान’ को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
theological_decisions:
- issue: עֹלָה बलिदान-संज्ञा का अनुवाद
  choice: होमबलि
  alternative: सर्वांग होमबलि
  rationale: ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में उस बलिदान-वर्ग का संक्षिप्त और स्थापित समतुल्य है जो आग में पूर्णतः चढ़ाया जाता था; ‘सर्वांग’ जोड़ना अर्थ स्पष्ट कर सकता है, पर मूल पद से अधिक व्याख्यात्मक होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथा-शैली रखी गई है। छोटे वाक्यों और स्वाभाविक क्रिया-क्रम से पठनीयता बढ़ाई गई है, पर इब्रानी कथा में दोहराए गए ‘उठा और चल पड़ा’ को जानबूझकर बनाए रखा गया है।
