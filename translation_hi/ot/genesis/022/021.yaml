lexical_decisions:
- source_word: ע֥וּץ
  choice: ऊज़
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण; इसका अनुवाद नहीं किया गया है।
- source_word: בְּכֹר֖וֹ
  choice: उसका पहलौठा
  rationale: בכור जन्म-क्रम में पहले जन्मे पुत्र को दर्शाता है; ‘पहलौठा’ इस वंशावलीगत अर्थ को संक्षेप और स्वाभाविक ढंग से बनाए रखता है।
- source_word: בּ֣וּז
  choice: बूज़
  rationale: हिब्रू व्यक्तिवाचक नाम का हिन्दी लिप्यंतरण।
- source_word: אָחִ֑יו
  choice: उसका भाई
  rationale: संबंधवाचक शब्द और तृतीय पुरुष एकवचन प्रत्यय का सीधा अनुवाद; प्रसंग में सर्वनाम नाहोर की ओर संकेत करता है।
- source_word: קְמוּאֵ֖ל
  choice: कमूएल
  rationale: हिब्रू व्यक्तिवाचक नाम का हिन्दी में स्वाभाविक और प्रचलित रूप।
- source_word: אֲבִ֥י
  choice: पिता
  rationale: मूल शब्द का सर्वाधिक सीधा वंशावलीगत अर्थ; व्यापक ‘पूर्वज’ का संभावित अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: אֲרָֽם
  choice: अराम
  rationale: व्यक्तिवाचक नाम का सीधा लिप्यंतरण; पाठ से आगे बढ़कर इसे किसी भूभाग या जाति के रूप में स्पष्ट नहीं किया गया है।
theological_decisions:
- issue: אֲבִי אֲרָם का वंशावलीगत अर्थ
  choice: अराम का पिता
  alternative: अराम का पूर्वज
  rationale: हिब्रू पदबंध का सीधा अर्थ ‘अराम का पिता’ है। फिर भी वंशावलियों में ‘पिता’ कभी-कभी पूर्वज या कुल-प्रवर्तक को भी सूचित कर सकता है; इसलिए मुख्य पाठ में सीधा अर्थ और पाद-टिप्पणी में व्यापक संभावना रखी गई है।
