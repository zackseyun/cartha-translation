translation:
  language: hi
  text: और बतूएल से रिबका उत्पन्न हुई। ये वे आठ संतानें थीं जिन्हें मिल्का ने अब्राहम के भाई नाहोर से जनीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְתוּאֵל
  choice: और बतूएल
  rationale: वाव को वंशावली की निरंतरता दिखाने के लिए ‘और’ कहा गया है; नाम का रूप प्रचलित हिन्दी बाइबल परंपरा के निकट रखा गया है।
- source_word: יָלַד אֶת־רִבְקָה
  choice: से रिबका उत्पन्न हुई
  rationale: पुरुष कर्ता के साथ यालद का अर्थ पिता बनना/उत्पन्न करना है। हिन्दी में ‘बतूएल ने रिबका को जन्म दिया’ जैविक रूप से भ्रामक लगता, इसलिए ‘से ... उत्पन्न हुई’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: שְׁמֹנָה אֵלֶּה
  choice: ये वे आठ संतानें थीं
  rationale: हिब्रू में संज्ञा निहित है; हिन्दी में वाक्य स्पष्ट और स्वाभाविक बनाने के लिए ‘संतानें’ जोड़ा गया है।
- source_word: יָלְדָה מִלְכָּה
  choice: जिन्हें मिल्का ने ... जन्म दिया
  rationale: स्त्री कर्ता के साथ क्रिया का प्रत्यक्ष अर्थ जन्म देना है; संबंधवाचक रचना हिन्दी में दोनों उपवाक्यों को सहजता से जोड़ती है।
- source_word: לְנָחוֹר
  choice: नाहोर के लिए
  rationale: लामेद को औपचारिक रूप से ‘के लिए’ रखा गया है, जो इन संतानों के नाहोर से पारिवारिक संबंध को व्यक्त करता है; ‘नाहोर से’ पति को स्रोत बताने जैसा लग सकता है।
- source_word: אֲחִי אַבְרָהָם
  choice: अब्राहम के भाई
  rationale: यह संबंधसूचक पद नाहोर की पहचान करता है; हिन्दी में इसे नाम के पहले रखना स्वाभाविक है।
