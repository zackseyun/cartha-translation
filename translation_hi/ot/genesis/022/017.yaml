reference: Genesis 22:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי בָרֵ֣ךְ אֲבָרֶכְ/ךָ֗ וְ/הַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/כַ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֣ת הַ/יָּ֑ם וְ/יִרַ֣שׁ זַרְעֲ/ךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/017.yaml
  text: that I will surely bless you[a], and I will surely multiply your offspring like the stars of the heavens and like the sand that is on the seashore[c][b]; and your offspring will possess the gate of his enemies.
translation:
  language: hi
  text: कि मैं निश्चय ही तुझे आशीष दूँगा और तेरे वंश[a] को आकाश के तारों और समुद्र-तट पर की रेत के समान बहुत ही बढ़ाऊँगा; और तेरा वंश उसके शत्रुओं के फाटक पर अधिकार करेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल हिब्रू में ‘तेरा बीज’ है। यहाँ यह शब्द सामूहिक एकवचन है और वंश या वंशजों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरे वंशज अपने शत्रुओं के फाटक पर अधिकार करेंगे।” हिब्रू में ‘वंश/बीज’ और ‘उसके’ दोनों व्याकरण की दृष्टि से एकवचन हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: कि
  rationale: पिछले पद में आरम्भ हुई शपथयुक्त घोषणा की विषय-वस्तु को आगे बढ़ाता है; हिन्दी में ‘कि’ इस वाक्य-संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: בָרֵךְ אֲבָרֶכְךָ
  choice: मैं निश्चय ही तुझे आशीष दूँगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute की प्रबलता को सहज हिन्दी में ‘निश्चय ही’ से व्यक्त किया गया है।
- source_word: וְהַרְבָּה אַרְבֶּה
  choice: और ... बहुत ही बढ़ाऊँगा
  rationale: दोहराई गई हिब्रू रचना वृद्धि की तीव्रता और प्रतिज्ञा की दृढ़ता बताती है; ‘बहुत ही’ इसे स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: זַרְעֲךָ
  choice: तेरा वंश
  rationale: זֶרַע व्याकरण की दृष्टि से एकवचन और अर्थ की दृष्टि से सामूहिक है। ‘वंश’ हिन्दी में इस सामूहिक-एकवचन भाव को बनाए रखता है और ‘बीज’ से अधिक स्वाभाविक है।
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: आकाश के तारों के समान
  rationale: यह तुलना स्पष्ट, प्रतिष्ठित और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: समुद्र-तट पर की रेत के समान
  rationale: אֲשֶׁר עַל के स्थान-संबंध को बनाए रखते हुए שְׂפַת הַיָּם का स्वाभाविक हिन्दी रूप ‘समुद्र-तट’ दिया गया है।
- source_word: וְיִרַשׁ
  choice: पर अधिकार करेगा
  rationale: יָרַשׁ यहाँ शत्रु के नगर-द्वार पर नियंत्रण या अधिपत्य पाने का सक्रिय भाव रखता है; ‘अधिकार करेगा’ इस अर्थ को स्पष्ट रखता है।
- source_word: שַׁעַר
  choice: फाटक
  rationale: मूल बिंब को बनाए रखा गया है; नगर का फाटक नगर की सामरिक और नागरिक सत्ता का प्रतिनिधित्व कर सकता है।
- source_word: אֹיְבָיו
  choice: उसके शत्रुओं
  rationale: हिब्रू प्रत्यय एकवचन है और सामूहिक-एकवचन ‘वंश’ से मेल खाता है; ‘उसके’ उस व्याकरणिक तनाव को हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: זֶרַע का सामूहिक एकवचन और אֹיְבָיו का एकवचन प्रत्यय
  choice: ‘तेरा वंश ... उसके शत्रुओं’
  alternative: ‘तेरे वंशज ... उनके शत्रुओं’
  rationale: मूल पाठ वंश को एक सामूहिक एकवचन के रूप में रखता है। इसे बनाए रखने से पाठ को न तो केवल एक व्यक्ति तक सीमित किया जाता है, न ही उसकी एकवचन संरचना को चुपचाप बहुवचन बना दिया जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली अपनाई गई है। सम्बोधन ‘तू/तेरा’ का बाइबलीय निकट एकवचन रूप ‘तुझे/तेरे’ रखा गया है। समानान्तर हिब्रू बलाघात को हिन्दी में अनावश्यक रूप से कृत्रिम पुनरुक्ति किए बिना ‘निश्चय ही’ और ‘बहुत ही’ से व्यक्त किया गया है।
