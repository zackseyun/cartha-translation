lexical_decisions:
- source_word: כֶּשֶׂד
  choice: केसेद
  rationale: वंश-सूची में आए व्यक्ति के नाम का हिब्रू उच्चारणानुसार देवनागरी लिप्यंतरण किया गया है; इसका अर्थानुवाद नहीं किया गया।
- source_word: חֲזוֹ
  choice: हज़ो
  rationale: व्यक्तिवाचक नाम को आधुनिक हिन्दी में सहज और स्रोत के निकट रूप में लिप्यंतरित किया गया है।
- source_word: פִּלְדָּשׁ
  choice: पिलदाश
  rationale: व्यक्तिवाचक नाम का स्रोत-आधारित देवनागरी लिप्यंतरण किया गया है।
- source_word: יִדְלָף
  choice: यिदलाफ़
  rationale: आरम्भिक हिब्रू योद को ‘य’ और अंतिम फे को ‘फ़’ से दर्शाते हुए ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: בְּתוּאֵל
  choice: बतूएल
  rationale: हिब्रू स्वर-रूप के निकट रहते हुए नाम को देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְאֶת / וְאֵת
  choice: और
  rationale: दोहराया गया वाव संयोजन बताता है, जबकि אֵת निश्चित कर्म-चिह्न है; हिन्दी सूची में कर्म-चिह्न को अलग व्यक्त करना आवश्यक नहीं, इसलिए अल्पविरामों और अंतिम ‘और’ से स्वाभाविक समन्वय किया गया है।
