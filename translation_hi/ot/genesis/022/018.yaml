source:
  edition: WLC
  text: וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ עֵ֕קֶב אֲשֶׁ֥ר שָׁמַ֖עְתָּ בְּ/קֹלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/018.yaml
  text: And in your offspring all the nations of the earth will be blessed[a], because you have obeyed my voice.
translation:
  language: hi
  text: और तुम्हारे वंश में पृथ्वी की सभी जातियाँ आशीष पाएँगी[a], क्योंकि तुमने मेरी बात मानी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आपको आशीष देंगी।” यहाँ हिब्रू क्रिया को आत्मवाचक अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבָּרֲכוּ
  choice: आशीष पाएँगी
  rationale: हिब्रू हित्पएल रूप यहाँ कर्मवाच्य अथवा आत्मवाचक अर्थ दे सकता है। प्रतिज्ञा के प्रसंग में ‘आशीष पाएँगी’ स्वाभाविक और उपयुक्त है; आत्मवाचक संभावना पादटिप्पणी में रखी गई है।
- source_word: בְזַרְעֲךָ
  choice: तुम्हारे वंश में
  rationale: זֶרַע एक सामूहिक संज्ञा है, जिसका अर्थ संतान या वंश है। ‘वंश’ सामूहिक अर्थ बनाए रखता है, और בְ को ‘में’ कहना साधनसूचक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: पृथ्वी की सभी जातियाँ
  rationale: גּוֹיִם के लिए ‘जातियाँ’ आधुनिक हिन्दी में अलग-अलग जनसमुदायों/राष्ट्रों का स्वाभाविक बाइबलीय संकेत देता है, और ‘पृथ्वी की’ इसके विश्वव्यापी विस्तार को बनाए रखता है।
- source_word: עֵקֶב אֲשֶׁר
  choice: क्योंकि
  rationale: यह पदबंध प्रतिज्ञा की पुनर्पुष्टि का कारण बताता है; ‘क्योंकि’ इसका संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: שָׁמַעְתָּ בְּקֹלִי
  choice: तुमने मेरी बात मानी है
  rationale: इस हिब्रू मुहावरे का आशय केवल सुनना नहीं, बल्कि सुनकर आज्ञापालन करना है। ‘मेरी बात मानी’ आधुनिक हिन्दी में यही अर्थ स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ברך के हित्पएल रूप में अब्राहमी प्रतिज्ञा का अर्थ
  choice: जातियाँ अब्राहम के वंश में आशीष प्राप्त करेंगी।
  alternative: जातियाँ उसके वंश का नाम लेकर अपने लिए आशीष माँगेंगी।
  rationale: वाचा और प्रतिज्ञा का प्रसंग कर्मवाच्य/परिणामसूचक अर्थ का समर्थन करता है, पर हिब्रू रूप की आत्मवाचक संभावना वास्तविक है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है, न कि मुख्य पाठ में चुपचाप मिटाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘मेरी बात मानी’ मुहावरे का आज्ञापालन-संबंधी बल स्पष्ट करता है; ‘वंश में’ मूल की सामूहिकता और पूर्वसर्गीय अस्पष्टता को बनाए रखता है।
