- source_word: וַיִּקְרָא
  choice: तब … पुकारा
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; हिन्दी में ‘तब’ क्रम को स्वाभाविक रूप से व्यक्त करता है। सीधे संबोधन के प्रसंग में ‘पुकारा’ קרא का उपयुक्त और सहज अनुवाद है।
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा के दूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या विशेषतः स्वर्गीय ‘दूत’ हो सकता है। हिन्दी में ‘यहोवा के दूत’ स्वाभाविक है और उस प्राणी की तात्त्विक पहचान का अतिरिक्त निर्णय नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा रखा गया है।
- source_word: אֶל אַבְרָהָם
  choice: अब्राहम को
  rationale: אֶל यहाँ पुकार के संबोधित व्यक्ति को चिह्नित करता है; हिन्दी में ‘अब्राहम को’ इसका सहज रूप है।
- source_word: שֵׁנִית
  choice: दूसरी बार
  rationale: यह अनुवाद स्पष्ट क्रमवाचक अर्थ को बनाए रखता है; केवल ‘फिर’ कहना कम विशिष्ट होता।
- source_word: מִן הַשָּׁמַיִם
  choice: स्वर्ग से
  rationale: यद्यपि שָׁמַיִם रूप की दृष्टि से बहुवचन है, इस प्रसंग में हिन्दी का एकवचन ‘स्वर्ग से’ स्वाभाविक है और दिव्य वाणी के स्थान का भाव बनाए रखता है।
theological_decisions:
- issue: מַלְאַךְ יְהוָה की पहचान और अर्थ
  choice: यहोवा के दूत
  alternative: यहोवा के संदेशवाहक
  rationale: मुख्य पाठ में प्रचलित बाइबलीय अभिव्यक्ति रखी गई है, पर यह तय नहीं किया गया कि यह कोई सृजित स्वर्गीय प्राणी है या परमेश्वर का विशेष प्राकट्य। वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
