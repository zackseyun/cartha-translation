  text: And Abraham called the name of that place, “The LORD will provide,” as it is said to this day, “On the mountain of the LORD it will be provided.”
translation:
  language: hi
  text: और अब्राहम ने उस स्थान का नाम “यहोवा देखेगा” रखा। इसलिए आज तक यह कहा जाता है, “यहोवा के पर्वत पर वह दिखाई देगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि में बदलने के बजाय हिन्दी में प्रचलित रूप से व्यक्त किया गया है।
- source_word: יִרְאֶה
  choice: प्रबंध करेगा
  rationale: मूल क्रिया का सामान्य अर्थ “देखना” है, पर इस प्रसंग में देखना और आवश्यकता पूरी करना परस्पर जुड़े हैं; हिन्दी में नाम का आशय स्वाभाविक ढंग से व्यक्त करने के लिए “प्रबंध करेगा” चुना गया है और शाब्दिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יֵרָאֶה
  choice: प्रबंध किया जाएगा
  rationale: हिब्रू में यह “दिखाई देगा/प्रकट होगा” का निष्क्रिय रूप है, जो पिछले पदबंध के साथ जानबूझकर शब्द-क्रीड़ा बनाता है। प्रसंगगत अर्थ मुख्य पाठ में रखा गया और रूपगत अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַר
  choice: पर्वत
  rationale: स्रोत के सामान्य और स्पष्ट भौगोलिक शब्द का सीधा, गरिमापूर्ण हिन्दी समतुल्य।
theological_decisions:
- issue: יִרְאֶה और יֵרָאֶה में ‘देखने’ तथा ‘प्रबंध करने’ का संबंध
  choice: मुख्य पाठ में “प्रबंध” और पादटिप्पणियों में “देखेगा/दिखाई देगा”
  alternative: मुख्य पाठ में पूर्णतः शाब्दिक “यहोवा देखेगा… दिखाई देगा”
  rationale: कथा में परमेश्वर द्वारा बलि का पशु उपलब्ध कराने का संकेत स्पष्ट है, पर हिब्रू की वास्तविक शब्द-क्रीड़ा और अर्थगत तनाव को पादटिप्पणी में बनाए रखा गया है।
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: स्थान-नाम की रचना में व्यक्तिगत नाम महत्त्वपूर्ण है; इसलिए उसे सामान्य उपाधि से नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। “प्रबंध करेगा” सामान्य पाठक के लिए स्वाभाविक है; पादटिप्पणियाँ हिब्रू शब्द-क्रीड़ा और वास्तविक अस्पष्टता को स्पष्ट करती हैं।
