  register: भाषा आधुनिक, गरिमापूर्ण और संवाद-सुलभ रखी गई है। इसहाक द्वारा पिता के लिए आदरसूचक ‘देखिए’ तथा अब्राहम द्वारा आत्मीय ‘मेरे बेटे’ दृश्य के पारिवारिक और भावनात्मक स्वर को बनाए रखते हैं।
