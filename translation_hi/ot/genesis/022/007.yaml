base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/007.yaml
  text: And Isaac said to Abraham his father[a], “My father!” And he said, “Here I am, my son.” And he said, “Look, the fire and the wood—but where is the sheep for a burnt offering?”
translation:
  language: hi
  text: तब इसहाक ने अपने पिता अब्राहम से कहा, “पिताजी!” उन्होंने कहा, “मैं यहाँ हूँ, मेरे बेटे।” इसहाक ने कहा, “देखिए, आग और लकड़ी तो हैं, पर होमबलि के लिए भेड़[a] कहाँ है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू शब्द का अर्थ अधिक व्यापक है: झुंड का छोटा पशु, जैसे भेड़ या बकरी का बच्चा।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: हिब्रू कथा में אמר के इस सामान्य वर्णनात्मक रूप का स्वाभाविक हिन्दी समतुल्य ‘कहा’ है।
- source_word: אָבִיו
  choice: अपने पिता
  rationale: सम्बन्धवाचक अर्थ स्पष्ट रखते हुए हिन्दी में कर्ता इसहाक की ओर लौटने वाला ‘अपने’ स्वाभाविक है।
- source_word: אָבִי
  choice: पिताजी!
  rationale: प्रत्यक्ष सम्बोधन और आत्मीयता को आधुनिक, आदरपूर्ण हिन्दी में व्यक्त करता है; हिब्रू का प्रथम पुरुष सम्बन्धसूचक प्रत्यय हिन्दी सम्बोधन में इसी रूप से स्वाभाविक ढंग से आता है।
- source_word: הִנֶּנִי
  choice: हाँ
  rationale: इस संवाद में यह तत्पर उत्तर का सूत्र है। शाब्दिक ‘मैं यहाँ हूँ’ की अपेक्षा ‘हाँ’ आधुनिक हिन्दी में पिता के प्रत्युत्तर को अधिक स्वाभाविक रूप से व्यक्त करता है, जबकि अगला सम्बोधन उसकी आत्मीयता बनाए रखता है।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: सम्बन्धसूचक प्रत्यय और स्नेहपूर्ण सम्बोधन दोनों सुरक्षित रहते हैं।
- source_word: הִנֵּה
  choice: देखिए
  rationale: सामने उपस्थित वस्तुओं की ओर ध्यान खींचने वाला निर्देशसूचक बल आदरपूर्ण पुत्र-वाणी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: הָאֵשׁ וְהָעֵצִים
  choice: आग और लकड़ी तो हैं
  rationale: हिब्रू में दोनों निश्चित, उपस्थित वस्तुओं की सूची है; हिन्दी का ‘तो हैं’ आगे आने वाले विरोधी प्रश्न को सहज बनाता है।
- source_word: אַיֵּה
  choice: कहाँ है
  rationale: स्थानवाचक प्रश्न का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: הַשֶּׂה
  choice: मेमना
  rationale: बलिदान के प्रसंग में सरल और प्रचलित हिन्दी चयन; हिब्रू शब्द की अधिक व्यापक अर्थ-सीमा पाद-टिप्पणी में सुरक्षित है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה उस बलि का पारिभाषिक नाम है जो पूर्णतः जलाई जाती थी; ‘होमबलि’ प्रचलित और संक्षिप्त हिन्दी बाइबलीय पद है।
theological_decisions:
- issue: बलि-पशु הַשֶּׂה का अनुवाद
  choice: मेमना
  alternative: भेड़ या बकरी के झुंड का छोटा पशु
  rationale: सन्दर्भ में ‘मेमना’ हिन्दी में सहज बलिदानी अभिव्यक्ति है, पर मूल शब्द केवल मेमने तक सीमित नहीं है; इसलिए व्यापक अर्थ को पाद-टिप्पणी में बताया गया है।
- issue: הִנֶּנִי के साहित्यिक सूत्र का रूप
  choice: हाँ
  alternative: मैं यहाँ हूँ
  rationale: यहाँ वक्ता सामने उपस्थित है और सूत्र तत्पर प्रत्युत्तर का कार्य करता है। ‘हाँ’ संवाद में स्वाभाविक है; इससे कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी जाती।
