lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: निश्चित पद और क्रमवाचक संख्या वाली काल-सूचक पदावली का सीधा, स्वाभाविक हिन्दी रूप; ‘यात्रा के’ जोड़ना मूल में निहित नहीं है।
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: आँखें उठाकर
  rationale: इब्रानी मुहावरे ‘अपनी आँखें उठाईं’ की चित्रात्मकता बनाए रखते हुए हिन्दी में स्वाभाविक क्रम प्रस्तुत करता है।
- source_word: וַיַּרְא
  choice: देखा
  rationale: वाव-परिणामी कथात्मक क्रिया को भूतकालीन क्रम में सहज हिन्दी क्रिया से व्यक्त किया गया है।
- source_word: הַמָּקוֹם
  choice: उस स्थान
  rationale: निश्चित संज्ञा उस पहले से संकेत किए गए गंतव्य को दर्शाती है; हिन्दी में ‘उस स्थान’ संदर्भगत निश्चितता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵרָחֹק
  choice: दूर से
  rationale: दूरी बताने वाली इस पदावली का संक्षिप्त, वर्तमान और स्वाभाविक हिन्दी रूप।
- source_word: אַבְרָהָם
  choice: अब्राहम
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
