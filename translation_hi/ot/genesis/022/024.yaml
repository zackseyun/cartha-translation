  text: And his concubine[a], whose name was Reumah, also bore Tebah, Gaham, Tahash[b], and Maacah.
translation:
  language: hi
  text: और उसकी उपपत्नी[a], जिसका नाम रेऊमा था, उसने भी तेबह, गहम, तहश और माका को जन्म दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप में: “और उसकी उपपत्नी, और उसका नाम रेऊमा था”; इब्रानी में दोनों वाक्यांश समान स्तर पर ‘और’ से जुड़े हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: और उसकी उपपत्नी
  rationale: פִּילֶגֶשׁ पत्नी से भिन्न सामाजिक दर्जे वाली स्त्री को दर्शाता है; ‘उपपत्नी’ इस भेद को संक्षेप और गरिमा के साथ बनाए रखता है। संबद्ध प्रत्यय को ‘उसकी’ और וּ को ‘और’ से व्यक्त किया गया है।
- source_word: וּשְׁמָהּ
  choice: जिसका नाम ... था
  rationale: शाब्दिक समन्वयी रूप ‘और उसका नाम’ है, पर आधुनिक हिन्दी में स्त्री से संबंध स्पष्ट करने के लिए ‘जिसका नाम ... था’ अधिक स्वाभाविक है।
- source_word: רְאוּמָה
  choice: रूमा
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी ध्वन्यंतरण।
- source_word: וַתֵּלֶד
  choice: जन्म दिया
  rationale: ילד का हिफ़ील नहीं, यहाँ स्त्री कर्ता के साथ काल रूप ‘उसने जन्म दिया’ अर्थ देता है; यह आधुनिक हिन्दी में स्वाभाविक वंशावली-शैली है।
- source_word: גַּם הִוא
  choice: उसने भी
  rationale: ‘भी’ के साथ स्पष्ट सर्वनाम ‘उसने’ रखकर इब्रानी גַּם הִוא का बल सुरक्षित किया गया है और मिल्का के अतिरिक्त रूमा के भी संतान जनने का संकेत बना रहता है।
- source_word: אֶת טֶבַח וְאֶת גַּחַם וְאֶת תַּחַשׁ וְאֶת מַעֲכָה
  choice: तेबह, गहम, तहश और माका को
  rationale: व्यक्तिगत नामों को इब्रानी उच्चारण के निकट देवनागरी में ध्वन्यंतरित किया गया है; प्रत्यक्ष कर्म को अंतिम ‘को’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
