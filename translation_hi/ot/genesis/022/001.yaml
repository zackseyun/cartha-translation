  yaml_path: translation/ot/genesis/022/001.yaml
  text: After these things[a], God tested Abraham and said to him, “Abraham!” And he said[b], “Here I am.”
translation:
  language: hi
  text: इन घटनाओं के बाद परमेश्वर ने अब्राहम की परीक्षा ली और उससे कहा, “अब्राहम!” और उसने कहा, “मैं यहाँ हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: इन घटनाओं के बाद
  rationale: वाक्यांश कथा में समय का संक्रमण दिखाता है। דְּבָרִים का अर्थ व्यापक रूप से ‘बातें/घटनाएँ’ हो सकता है; इस कथात्मक संदर्भ में ‘घटनाएँ’ स्वाभाविक आधुनिक हिन्दी है। וַיְהִי को अलग से अनूदित करना आवश्यक नहीं।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ संज्ञा इस्राएल के परमेश्वर के लिए प्रयुक्त है, पर यह विशिष्ट नाम יהוה नहीं है। आधुनिक हिन्दी बाइबल शैली में ‘परमेश्वर’ स्पष्ट और गरिमापूर्ण है।
- source_word: נִסָּה
  choice: परीक्षा ली
  rationale: Piel रूप यहाँ परखने या जाँचने का अर्थ देता है। ‘परीक्षा ली’ सामान्य हिन्दी में स्वाभाविक है और बुराई के लिए लुभाने का भ्रामक अर्थ नहीं देता।
- source_word: אֶת אַבְרָהָם
  choice: अब्राहम की
  rationale: हिब्रू में अब्राहम सीधा कर्म है; हिन्दी मुहावरे ‘किसी की परीक्षा लेना’ के अनुसार संबंधकारक ‘की’ आवश्यक है।
- source_word: וַיֹּאמֶר אֵלָיו
  choice: और उससे कहा
  rationale: אמר तथा अप्रत्यक्ष कर्म का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: אַבְרָהָם
  choice: अब्राहम!
  rationale: यह प्रत्यक्ष संबोधन है; विस्मयादिबोधक चिह्न पुकार को स्पष्ट करता है।
- source_word: הִנֵּנִי
  choice: मैं यहाँ हूँ
  rationale: यह मुहावरा उपस्थित होने और तत्परता से उत्तर देने का भाव रखता है। ‘मैं यहाँ हूँ’ उसे सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के कर्ता होने पर נִסָּה का अर्थ
  choice: परमेश्वर ने अब्राहम की परीक्षा ली
  alternative: परमेश्वर ने अब्राहम को प्रलोभित किया
  rationale: इस प्रसंग में क्रिया का अर्थ परखना या सिद्ध करना है, न कि बुराई के लिए लुभाना। फिर भी पद परीक्षा की नैतिक और भावनात्मक कठिनाई को स्वयं स्पष्ट नहीं करता, इसलिए अनुवाद में अतिरिक्त धर्मवैज्ञानिक समाधान नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण कथात्मक शैली। ‘इन घटनाओं के बाद’ स्रोत की व्यापकता को संदर्भानुकूल रूप में व्यक्त करता है। संवाद संक्षिप्त रखा गया है और कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
