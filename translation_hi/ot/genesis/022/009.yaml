source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ אֶֽל הַ/מָּקוֹם֮ אֲשֶׁ֣ר אָֽמַר ל֣/וֹ הָ/אֱלֹהִים֒ וַ/יִּ֨בֶן שָׁ֤ם אַבְרָהָם֙ אֶת הַ/מִּזְבֵּ֔חַ וַֽ/יַּעֲרֹ֖ךְ אֶת הָ/עֵצִ֑ים וַֽ/יַּעֲקֹד֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ וַ/יָּ֤שֶׂם אֹת/וֹ֙ עַל הַ/מִּזְבֵּ֔חַ מִ/מַּ֖עַל לָ/עֵצִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/009.yaml
  text: Then they came to the place that God had told him[a], and Abraham built the altar there and arranged the wood. He bound Isaac his son and placed him on the altar[c][b], on top of the wood.
translation:
  language: hi
  text: तब वे उस स्थान पर पहुँचे, जिसके बारे में परमेश्वर ने उसे बताया था।[a] वहाँ अब्राहम ने वेदी[b] बनाई और लकड़ियों को व्यवस्थित किया। फिर उसने अपने पुत्र इसहाक को बाँधा और उसे वेदी पर, लकड़ियों के ऊपर रख दिया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस स्थान के विषय में परमेश्वर ने उससे कहा था।”
    reason: इब्रानी אמר (‘कहा’) की अपेक्षाकृत व्यापक अभिव्यक्ति और वैकल्पिक निकटवर्ती अनुवाद को दर्ज करने के लिए।
  - marker: b
    text: इब्रानी में “उस वेदी” है; निश्चित रूप उस विशेष वेदी की ओर संकेत कर सकता है जिसे इस बलिदान के लिए तैयार किया जा रहा था।
    reason: स्रोत-पाठ के निश्चित उपपद को सुरक्षित रखने के लिए।
  - marker: c
    text: इब्रानी में “लकड़ियों से ऊपर,” अर्थात व्यवस्थित की गई लकड़ियों के ऊपर।
    reason: मूल स्थानवाचक अभिव्यक्ति को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब वे ... पहुँचे
  rationale: बहुवचन कर्ता को बनाए रखते हुए कथानक में अगली घटना का स्वाभाविक संकेत देता है।
- source_word: אֶל הַמָּקוֹם
  choice: उस स्थान पर
  rationale: निर्दिष्ट स्थान को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: जिसके बारे में परमेश्वर ने उससे कहा था
  rationale: אמר की मूल व्यापकता को बनाए रखता है और पूर्व में दिए गए दैवी निर्देश को भूतपूर्व क्रिया से स्पष्ट करता है।
- source_word: וַיִּבֶן ... אֶת הַמִּזְבֵּחַ
  choice: वहाँ अब्राहम ने वेदी बनाई
  rationale: निर्माण की क्रिया को सीधे व्यक्त करता है। हिन्दी में पहली बार उल्लेख होने पर बिना संकेतवाचक निर्धारक के ‘वेदी’ स्वाभाविक है, जबकि पादटिप्पणी इब्रानी के निश्चित उपपद को दर्ज करती है।
- source_word: וַיַּעֲרֹךְ אֶת הָעֵצִים
  choice: लकड़ियाँ करीने से लगाईं
  rationale: ערך के व्यवस्थित करने या क्रम से लगाने के भाव को साधारण, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּעֲקֹד
  choice: बाँधा
  rationale: क्रिया के विशिष्ट और गंभीर अर्थ को बिना नरम किए सीधे सुरक्षित रखता है।
- source_word: יִצְחָק בְּנוֹ
  choice: अपने पुत्र इसहाक को
  rationale: इब्रानी संबंध को स्पष्ट और हिन्दी की स्वाभाविक पद-व्यवस्था में प्रस्तुत करता है।
- source_word: וַיָּשֶׂם אֹתוֹ עַל הַמִּזְבֵּחַ
  choice: उसे वेदी पर ... रख दिया
  rationale: שׂים की सामान्य स्थान-निर्धारण क्रिया को बिना अनावश्यक ढंग जोड़े व्यक्त करता है।
- source_word: מִמַּעַל לָעֵצִים
  choice: लकड़ियों के ऊपर
  rationale: व्यवस्थित लकड़ियों के ऊपर उसकी स्थिति को स्पष्ट रूप से दर्शाता है।
theological_decisions:
- issue: बलिदान के ढाँचे की निश्चितता
  choice: मुख्य पाठ में ‘वेदी’, पादटिप्पणी में ‘उस वेदी’
  alternative: उस वेदी
  rationale: इब्रानी में निश्चित उपपद है, पर पहली बार उल्लेख में ‘उस वेदी’ हिन्दी में पूर्व-परिचित वस्तु का अस्वाभाविक संकेत दे सकता है। पादटिप्पणी स्रोत की निश्चितता को सुरक्षित रखती है और किसी बाद की प्रतीकात्मक व्याख्या को नहीं जोड़ती।
- issue: इसहाक को बाँधने की क्रिया
  choice: अपने पुत्र इसहाक को बाँधा
  alternative: अपने पुत्र इसहाक को कसकर बाँधा
  rationale: ‘बाँधा’ עקד का सीधा अर्थ सुरक्षित रखता है; ‘कसकर’ स्रोत से अधिक विवरण जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। कथात्मक क्रम के लिए ‘तब’ और ‘फिर’ का सीमित प्रयोग किया गया है। ‘परमेश्वर’, ‘वेदी’ और ‘बाँधा’ जैसे प्रचलित बाइबिलीय शब्द रखे गए हैं; वाक्य को अनावश्यक धार्मिक व्याख्या से मुक्त रखा गया है।
