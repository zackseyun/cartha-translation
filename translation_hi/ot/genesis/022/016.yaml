  source_fidelity: The draft accurately conveys the oath formula, the divine-name formula, the causal clause, and the emphatic apposition “your son, your only son.” However, “अपने पुत्र ... को भी नहीं रोका” can naturally mean that Abraham did not stop his son, rather than that he did not hold him back. The Hebrew חָשַׂכְתָּ means “withheld/held back” in this context.
  naturalness: The register is suitably dignified and the use of “तूने” is appropriate to the direct singular address in this biblical narration. Recasting the final verb as “रोककर नहीं रखा” makes the intended sense clear in idiomatic Hindi without adding a sacrificial object not expressed in this verse.
  terminology: “याहवे” consistently represents יהוה, and “इकलौते पुत्र” naturally conveys the contextual force of יְחִידְךָ. The lexical-alternative footnote remains properly anchored to the withheld/held-back clause.
