  edition: WLC
  text: וַ/יֹּ֕אמֶר בִּ֥/י נִשְׁבַּ֖עְתִּי נְאֻם יְהוָ֑ה כִּ֗י יַ֚עַן אֲשֶׁ֤ר עָשִׂ֨יתָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/לֹ֥א חָשַׂ֖כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/016.yaml
  text: and said[a], “By myself I have sworn, declares Yahweh, because you have done this thing and have not withheld your son[b], your only son,”
translation:
  language: hi
  text: और कहा, “मैंने अपनी ही शपथ खाई है—यह याहवे की घोषणा है—क्योंकि तूने यह काम किया और अपने पुत्र, अपने इकलौते पुत्र को रोककर नहीं रखा[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पुत्र, अपने इकलौते पुत्र को भी नहीं बख्शा।” इब्रानी क्रिया का अर्थ “रोककर रखना” या इस प्रसंग में “बख्शना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: और कहा
  rationale: वाव-क्रमिक क्रिया पूर्ववर्ती कथानक को आगे बढ़ाती है; प्रसंग से कर्ता स्पष्ट होने के कारण हिन्दी में उसे दोहराना आवश्यक नहीं।
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: मैंने अपनी ही शपथ खाई है
  rationale: यह इब्रानी शपथ-सूत्र वक्ता के स्वयं को शपथ का आधार बनाने को व्यक्त करता है; पूर्ण क्रिया सम्पन्न शपथ के वर्तमान प्रभाव को बनाए रखती है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם एक गंभीर दैवी घोषणा का सूत्र है; याहवे व्यक्तिगत दैवी नाम को लिप्यंतरित करता है।
- source_word: כִּי יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: संयुक्त पद का प्रबल कारणवाचक अर्थ स्वाभाविक आधुनिक हिन्दी में ‘क्योंकि’ से स्पष्ट होता है।
- source_word: עָשִׂיתָ אֶת־הַדָּבָר הַזֶּה
  choice: तूने यह काम किया
  rationale: דָּבָר यहाँ अब्राहम के किए कार्य को सूचित करता है; ‘काम’ सहज और ठोस हिन्दी है।
- source_word: וְלֹא חָשַׂכְתָּ
  choice: और ... को भी नहीं रोका
  rationale: חָשַׂךְ का मूल भाव रोक रखना या पीछे रखना है; ‘नहीं रोका’ बलिदान के प्रसंग में स्वाभाविक है और ‘बख्शा नहीं’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: בִּנְךָ אֶת־יְחִידְךָ
  choice: अपने पुत्र, अपने इकलौते पुत्र
  rationale: यद्यपि संज्ञा की पुनरावृत्ति हिन्दी में जोड़ी गई है, यह יְחִידְךָ के ‘एकमात्र/अद्वितीय’ अर्थ और इब्रानी समानाधिकरण के जोर को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत दैवी नाम है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय लिप्यंतरित करता है।
- issue: יְחִידְךָ का अर्थ
  choice: अपने इकलौते पुत्र
  alternative: अपने एकमात्र जन / अपने अद्वितीय पुत्र
  rationale: यहाँ इसहाक की अनोखी, एकमात्र-पुत्र वाली स्थिति पर बल है। ‘इकलौते पुत्र’ हिन्दी में स्वाभाविक है और बाद की धर्मवैज्ञानिक प्रतिध्वनियों को अनावश्यक रूप से नहीं बढ़ाता।
- issue: חָשַׂךְ की प्रसंगगत छाया
  choice: नहीं रोका
  alternative: नहीं बख्शा
  rationale: ‘नहीं रोका’ मूल के रोक रखने वाले अर्थ को प्राथमिकता देता है; ‘नहीं बख्शा’ संभव है, पर बलिदान के परिणाम को अधिक स्पष्ट रूप से व्याख्यायित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। अब्राहम के लिए ‘तू’ मूल के एकवचन संबोधन और पारंपरिक बाइबिलीय गंभीरता को बनाए रखता है। वाक्य अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
