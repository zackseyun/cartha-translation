  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: इन बातों के बाद
  rationale: इब्रानी कथात्मक सूत्र का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप; וַיְהִי को अलग से ‘अब ऐसा हुआ’ कहने की आवश्यकता नहीं।
- source_word: וַיֻּגַּד לְאַבְרָהָם לֵאמֹר
  choice: अब्राहम को यह समाचार मिला
  rationale: इब्रानी कर्मवाच्य ‘अब्राहम को बताया गया’ और לֵאמֹר द्वारा आरम्भ कथन को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: सूचना की ओर ध्यान खींचने वाले इब्रानी अव्यय की स्पष्टता और बल बनाए रखता है।
- source_word: יָלְדָה ... בָּנִים
  choice: पुत्रों को जन्म दिया है
  rationale: बहुवचन בָּנִים का यहाँ वंशावली-संदर्भ में सटीक अर्थ ‘पुत्र’ है; पूर्ण क्रिया का परिणाम वर्तमान सूचना के रूप में दिया गया है।
- source_word: לְנָחוֹר אָחִיךָ
  choice: तुम्हारे भाई नाहोर के लिए
  rationale: לְ का औपचारिक संबंध बनाए रखता है और אָחִיךָ में निहित संबोधित ‘तुम्हारे’ को प्रत्यक्ष वचन में स्पष्ट करता है।
