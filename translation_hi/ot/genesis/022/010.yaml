  text: Then Abraham reached out his hand and took the knife to slaughter his son[a][b].
translation:
  language: hi
  text: तब अब्राहम ने अपना हाथ बढ़ाया और अपने बेटे का वध करने के लिए चाकू उठा लिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वध’ के लिए प्रयुक्त इब्रानी क्रिया सामान्य ‘मार डालना’ से अधिक विशिष्ट है और उसमें बलि के लिए वध करने की अर्थछाया हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: हाथ बढ़ाया
  rationale: इस प्रसंग में क्रिया का अर्थ हाथ को आगे बढ़ाना है, न कि किसी को भेजना। यह स्वाभाविक हिन्दी में ठोस क्रिया को सुरक्षित रखता है।
- source_word: יָדוֹ
  choice: अपना हाथ
  rationale: हिन्दी में कर्ता के अपने अंग के लिए ‘अपना’ स्वाभाविक है और इब्रानी के ‘उसका हाथ’ का ठीक आशय देता है।
- source_word: וַיִּקַּח
  choice: उठा लिया
  rationale: छुरे के संदर्भ में ‘उठा लिया’ सामान्य ‘ले लिया’ की अपेक्षा अधिक स्वाभाविक है, पर पकड़ने के ढंग को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: הַמַּאֲכֶלֶת
  choice: छुरा
  rationale: यह काटने और वध करने के काम का उपकरण है। ‘छुरा’ आधुनिक हिन्दी में इस दृश्य के लिए स्वाभाविक और ‘चाकू’ से अधिक गंभीर है, बिना किसी विशेष अनुष्ठानिक उपकरण का दावा किए।
- source_word: לִשְׁחֹט
  choice: वध करने के लिए
  rationale: ‘वध’ सामान्य ‘मार डालना’ से अधिक विशिष्ट है और बलि-संबंधी संभावना तथा प्रसंग की गंभीरता को बनाए रखता है।
- source_word: בְּנוֹ
  choice: अपने बेटे का
  rationale: हिन्दी का निजवाचक ‘अपने’ अब्राहम से संबंध स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַ
  choice: तब
  rationale: वाव-क्रमिक कथा की अगली क्रिया को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस क्रम को सहजता से व्यक्त करता है।
theological_decisions:
- issue: क्या שָׁחַט को बलि-संबंधी अर्थछाया वाले शब्द से व्यक्त किया जाए
  choice: वध करने के लिए
  alternative: मार डालने के लिए
  rationale: यह क्रिया साधारण हत्या से अधिक विशिष्ट है और प्रायः पशु-वध, विशेषकर बलि के संदर्भों में आती है। ‘वध’ उस अर्थछाया और भावात्मक भार को बनाए रखता है, पर बाद की कोई धर्मवैज्ञानिक व्याख्या आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘बेटा’ सामान्य पाठक के लिए ‘पुत्र’ से अधिक सहज है; ‘वध’ मूल क्रिया की विशिष्टता और गंभीरता सुरक्षित रखता है।
