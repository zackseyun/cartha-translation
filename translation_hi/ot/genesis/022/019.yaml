source:
  edition: WLC
  text: וַ/יָּ֤שָׁב אַבְרָהָם֙ אֶל נְעָרָ֔י/ו וַ/יָּקֻ֛מוּ וַ/יֵּלְכ֥וּ יַחְדָּ֖ו אֶל בְּאֵ֣ר שָׁ֑בַע וַ/יֵּ֥שֶׁב אַבְרָהָ֖ם בִּ/בְאֵ֥ר שָֽׁבַע־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/019.yaml
  text: So Abraham returned to his young men[a], and they arose and went together to Beersheba, and Abraham stayed in Beersheba.
translation:
  language: hi
  text: तब अब्राहम अपने जवानों[a] के पास लौट आया, और वे उठे और साथ-साथ बेरशेबा गए; और अब्राहम बेरशेबा में रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में है, “अब्राहम अपने जवानों के पास लौट आया।” इस वाक्य में इसहाक का उल्लेख नहीं है, यद्यपि इससे पहले की कथा में वह उपस्थित है।
    reason: कथात्मक अस्पष्टता को स्पष्ट करना, उसे मुख्य पाठ में हल किए बिना।
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौट आया
  rationale: शוב का काल-वृत्तांत में सामान्य अर्थ ‘लौटना’ है; ‘लौट आया’ स्वाभाविक आधुनिक हिन्दी में क्रमिक घटना व्यक्त करता है।
- source_word: נְעָרָיו
  choice: अपने सेवक युवकों
  rationale: נַעַר का अर्थ युवक, सेवक या परिचारक हो सकता है। संदर्भ में ये अब्राहम के साथ आए सेवक हैं (22:3, 5); ‘सेवक युवकों’ से उनकी भूमिका और मूल शब्द का आयु-संकेत दोनों बने रहते हैं।
- source_word: וַיָּקֻמוּ
  choice: वे उठे
  rationale: קום यहाँ अगली क्रिया आरम्भ करने के लिए उठने को दर्शाता है; ‘उठे’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: וַיֵּלְכוּ יַחְדָּו
  choice: साथ-साथ ... गए
  rationale: הלך के साथ יחדו सामूहिक गमन बताता है। ‘साथ-साथ गए’ मूल अर्थ को बिना चलने के ढंग की अतिरिक्त धारणा जोड़े व्यक्त करता है।
- source_word: בְּאֵר שָׁבַע
  choice: बेरशेबा
  rationale: स्थान-नाम को आधुनिक हिन्दी में प्रचलित बाइबलीय लिप्यंतरण के अनुसार रखा गया है।
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: ישב यहाँ किसी स्थान में निवास करने का अर्थ देता है। ‘रहने लगा’ आधुनिक हिन्दी में निवास का भाव व्यक्त करता है, जबकि ‘बस गया’ स्थायी बसावट का अधिक प्रबल अर्थ जोड़ सकता है।
theological_decisions:
- issue: पहाड़ से लौटने वाले के रूप में केवल अब्राहम का उल्लेख है, यद्यपि इससे पहले कथा में इसहाक उपस्थित है
  choice: मुख्य पाठ में केवल अब्राहम को लौटते हुए कहना और इसहाक को न जोड़ना
  alternative: यह स्पष्ट कर देना कि इसहाक भी अब्राहम के साथ लौटा
  rationale: इब्रानी पाठ लौटने वाले के रूप में अब्राहम का ही स्पष्ट उल्लेख करता है। अनुवाद को इस कथात्मक तनाव को बनाए रखना चाहिए, न कि अनुमान के आधार पर इसहाक को मुख्य पाठ में जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल पर गरिमापूर्ण कथात्मक शैली। छोटे वाक्यों से इब्रानी घटनाक्रम स्पष्ट रखा गया है।
