source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַל תִּשְׁלַ֤ח יָֽדְ/ךָ֙ אֶל הַ/נַּ֔עַר וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֑וּמָּה כִּ֣י עַתָּ֣ה יָדַ֗עְתִּי כִּֽי יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְ/לֹ֥א חָשַׂ֛כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידְ/ךָ֖ מִמֶּֽ/נִּי־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/012.yaml
  text: And he said[a], “Do not lay your hand on the boy, and do not do anything to him, for now I know that you fear God, since you have not withheld your son, your only son[b], from me.”
translation:
  language: hi
  text: और उसने कहा, “उस लड़के पर हाथ मत उठाना और उसके साथ कुछ भी मत करना, क्योंकि अब मैं जान गया हूँ कि तुम परमेश्वर का भय मानते हो; तुमने अपने पुत्र को, अपने इकलौते पुत्र को, मुझसे नहीं बचाकर रखा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּשְׁלַח יָדְךָ אֶל
  choice: उस लड़के पर हाथ मत उठाना
  rationale: इब्रानी मुहावरे का आशय बल प्रयोग करना या मारना है। आधुनिक हिन्दी में ‘हाथ उठाना’ स्वाभाविक है और हानि पहुँचाने की मनाही को स्पष्ट रखता है।
- source_word: הַנַּעַר
  choice: लड़का
  rationale: नַעַר का अर्थ संदर्भानुसार लड़का, किशोर या जवान हो सकता है; इस कथा-दृश्य में ‘लड़का’ सहज और उपयुक्त है।
- source_word: תַּעַשׂ לוֹ מְאוּמָּה
  choice: उसके साथ कुछ भी मत करना
  rationale: מְאוּמָּה का अर्थ ‘कुछ भी’ है; निषेध के साथ यह पूर्ण मनाही व्यक्त करता है।
- source_word: עַתָּה יָדַעְתִּי
  choice: अब मैं जान गया हूँ
  rationale: यह पूर्ण क्रिया से व्यक्त उस ज्ञान को स्वाभाविक हिन्दी में रखता है जो अब प्रमाणित या प्राप्त हुआ है, बिना कथन की धर्मवैज्ञानिक कठिनाई मिटाए।
- source_word: יְרֵא אֱלֹהִים
  choice: तुम परमेश्वर का भय मानते हो
  rationale: यह मूल की सीधी अभिव्यक्ति को बनाए रखता है; ‘श्रद्धा करते हो’ भय और श्रद्धा की संयुक्त धारणा को अधिक व्याख्यात्मक ढंग से सीमित कर सकता है।
- source_word: חָשַׂכְתָּ
  choice: नहीं रोका
  rationale: חָשַׂךְ का अर्थ रोक रखना, पीछे रखना या बचा रखना हो सकता है। ‘मुझसे नहीं रोका’ हिन्दी में स्वाभाविक है और מִמֶּנִּי के ‘मुझसे’ को सीधे सुरक्षित रखता है।
- source_word: יְחִידְךָ
  choice: अपने इकलौते को
  rationale: मूल में ‘अपने पुत्र, अपने इकलौते’ समानाधिकरण में है। ‘इकलौते को’ इस बलाघात और वास्तविक शब्दरचना को बनाए रखता है तथा ‘पुत्र’ की अनावश्यक पुनरावृत्ति से बचता है।
- source_word: מִמֶּנִּי
  choice: मुझसे
  rationale: पूर्वसर्ग מן का प्रथम पुरुष एकवचन रूप सीधे ‘मुझसे’ है; इसे ‘मेरे लिए’ करना अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: ‘अब मैं जान गया हूँ’ में परमेश्वर के ज्ञान का मानव-सदृश कथन
  choice: 'मूल कथन को सीधे बनाए रखा गया है: ‘अब मैं जान गया हूँ।’'
  alternative: ‘अब यह प्रकट हो गया है’ या ‘अब मैंने देख लिया है।’
  rationale: इब्रानी पाठ स्पष्टतः ‘अब मैं जान गया हूँ’ कहता है। अनुवाद इस धर्मवैज्ञानिक तनाव को सर्वज्ञता-संबंधी किसी निष्कर्ष के पक्ष में चुपचाप हल नहीं करता।
- issue: יְחִידְךָ का संबंध और बल
  choice: ‘अपने पुत्र, अपने इकलौते’
  alternative: ‘अपने इकलौते पुत्र’
  rationale: मूल में ‘पुत्र’ और ‘इकलौता’ दो समानाधिकरण पद हैं। चुना हुआ रूप उस बलाघात को अधिक निकटता से बनाए रखता है, जबकि वैकल्पिक रूप अधिक सहज पर कुछ समतल है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हाथ मत उठाना’ स्वाभाविक हिन्दी मुहावरा है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
