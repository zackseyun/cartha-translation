  text: וַ/יֹּ֨אמֶר יְהוּדָ֜ה אֶל יִשְׂרָאֵ֣ל אָבִ֗י/ו שִׁלְחָ֥/ה הַ/נַּ֛עַר אִתִּ֖/י וְ/נָק֣וּמָה וְ/נֵלֵ֑כָה וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת גַּם אֲנַ֥חְנוּ גַם אַתָּ֖ה גַּם טַפֵּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/008.yaml
  text: And Judah said to Israel his father[a], “Send the boy with me, and let us arise and go, so that we may live and not die—both we and you and our little ones.”
translation:
  language: hi
  text: तब यहूदा ने अपने पिता इस्राएल से कहा, “लड़के[क] को मेरे साथ भेज दीजिए। हम उठें और चलें, ताकि हम जीवित रहें और मर न जाएँ—हम भी, आप भी और हमारे बाल-बच्चे भी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “युवक।” इब्रानी शब्द נער केवल छोटे बच्चे के लिए नहीं, बल्कि किशोर या युवा पुरुष के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ प्रसंग की क्रमिक गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִשְׂרָאֵל אָבִיו
  choice: अपने पिता इस्राएल से
  rationale: मूल पाठ का ‘इस्राएल’ नाम बनाए रखते हुए पिता-पुत्र का संबंध स्पष्ट और स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: שִׁלְחָה
  choice: भेज दीजिए
  rationale: यह सीधे आग्रहसूचक आज्ञार्थक रूप है; पिता को संबोधन के अनुरूप आदरसूचक हिन्दी प्रयोग किया गया है।
- source_word: הַנַּעַר
  choice: लड़के
  rationale: נער किशोर अथवा युवा पुरुष के लिए भी प्रयुक्त हो सकता है; पारिवारिक संदर्भ में ‘लड़का’ स्वाभाविक है और उम्र को छोटे बच्चे तक सीमित नहीं करता।
- source_word: אִתִּי
  choice: मेरे साथ
  rationale: यह यहूदा द्वारा बिन्यामीन को स्वयं साथ ले जाने और उसकी जिम्मेदारी लेने को सीधे व्यक्त करता है।
- source_word: וְנָקוּמָה וְנֵלֵכָה
  choice: हम उठकर चलें
  rationale: दोनों सहोत्साहक क्रियाओं का संयुक्त आग्रह और तत्काल प्रस्थान का भाव संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: ताकि हम जीवित रहें और मर न जाएँ
  rationale: संदर्भ में प्रस्थान का उद्देश्य/परिणाम व्यक्त होता है; ‘ताकि’ इस व्यावहारिक संबंध को स्पष्ट करता है।
- source_word: גַּם אֲנַחְנוּ גַם אַתָּה גַּם טַפֵּנוּ
  choice: हम भी, आप भी और हमारे बाल-बच्चे भी
  rationale: दोहराए गए גם का समावेशी जोर तीनों समूहों के साथ ‘भी’ दोहराकर सुरक्षित रखा गया है।
- source_word: טַפֵּנוּ
  choice: हमारे बाल-बच्चे
  rationale: טף घराने के छोटे, आश्रित बच्चों को दर्शाता है; ‘बाल-बच्चे’ आधुनिक हिन्दी में उनकी सामूहिकता और असुरक्षा दोनों को सहजता से व्यक्त करता है।
