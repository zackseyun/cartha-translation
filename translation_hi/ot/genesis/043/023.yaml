  text: וַ/יֹּאמֶר֩ שָׁל֨וֹם לָ/כֶ֜ם אַל תִּירָ֗אוּ אֱלֹ֨הֵי/כֶ֜ם וֵֽ/אלֹהֵ֤י אֲבִי/כֶם֙ נָתַ֨ן לָ/כֶ֤ם מַטְמוֹן֙ בְּ/אַמְתְּחֹ֣תֵי/כֶ֔ם כַּסְפְּ/כֶ֖ם בָּ֣א אֵלָ֑/י וַ/יּוֹצֵ֥א אֲלֵ/הֶ֖ם אֶת שִׁמְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/023.yaml
  text: He said[a], “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks[b]. Your silver came to me.” Then he brought Simeon out to them.
translation:
  language: hi
  text: उसने कहा, “तुम्हारा कुशल-मंगल हो। मत डरो। तुम्हारे परमेश्वर और तुम्हारे पिता के परमेश्वर ने तुम्हारी बोरियों में तुम्हें खज़ाना[a] दिया है। तुम्हारी चाँदी[b] मेरे पास आ गई थी।” फिर वह शिमोन को बाहर निकालकर उनके पास ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छिपा हुआ खज़ाना।”
    reason: lexical_alternative
  - marker: b
    text: या “तुम्हारा धन मेरे पास आ गया था।” इब्रानी में ‘चाँदी’ का अर्थ प्रायः धन भी होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: तुम्हारा कुशल हो
  rationale: यहाँ שָׁלוֹם आश्वासन देने वाली शुभकामना है। ‘तुम्हारा कुशल हो’ इसके शांति और सकुशलता के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אַל תִּירָאוּ
  choice: मत डरो
  rationale: यह ירא के साथ सामान्य निषेधात्मक आज्ञा है; ‘मत डरो’ संक्षिप्त, स्वाभाविक और स्रोत के निकट है।
- source_word: אֱלֹהֵיכֶם וֵאלֹהֵי אֲבִיכֶם
  choice: तुम्हारे परमेश्वर और तुम्हारे पिता के परमेश्वर
  rationale: इस रचना में אֱלֹהִים एकवचन परमेश्वर को सूचित करता है। ‘पिता’ भी इब्रानी में एकवचन है, इसलिए उसे उसी रूप में रखा गया है।
- source_word: נָתַן לָכֶם
  choice: तुम्हें ... दिया है
  rationale: पूर्ण क्रिया के वर्तमान परिणाम—बोरियों में खज़ाना मिलने—को ध्यान में रखते हुए हिन्दी का पूर्ण वर्तमान स्वाभाविक है।
- source_word: מַטְמוֹן
  choice: खज़ाना
  rationale: शब्द किसी छिपाकर या संचित करके रखी गई मूल्यवान वस्तु को दर्शाता है। मुख्य पाठ में ‘खज़ाना’ सहज है; ‘छिपा हुआ खज़ाना’ का सूक्ष्म भाव पादटिप्पणी में रखा गया है।
- source_word: בְּאַמְתְּחֹתֵיכֶם
  choice: तुम्हारी बोरियों में
  rationale: संदर्भ अनाज ढोने की बोरियों का है; ‘बोरियाँ’ सामान्य ‘थैलों’ की अपेक्षा इस प्राचीन परिवहन-संदर्भ के अधिक अनुकूल है।
- source_word: כַּסְפְּכֶם בָּא אֵלָי
  choice: तुम्हारी चाँदी मेरे पास आ गई थी
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ है और इसका प्रयोग धन के लिए भी होता है। ‘मेरे पास आ गई’ इब्रानी की अभिव्यक्ति को बनाए रखता है; पूर्व भुगतान के लिए ‘थी’ हिन्दी में काल-संबंध स्पष्ट करता है।
- source_word: וַיּוֹצֵא אֲלֵהֶם אֶת שִׁמְעוֹן
  choice: फिर वह शिमोन को बाहर निकालकर उनके पास ले आया
  rationale: יצא का हिफ़ील रूप ‘बाहर निकालना/ले आना’ है। ‘बाहर’ हिरासत या भीतरी स्थान से निकाले जाने की दिशात्मक छाया बनाए रखता है।
theological_decisions:
- issue: भंडारी के कथन में परमेश्वर का उल्लेख
  choice: उसके शब्दों को सीधे ‘तुम्हारे परमेश्वर और तुम्हारे पिता के परमेश्वर’ के रूप में प्रस्तुत किया गया है, पर उसके निजी विश्वास के विषय में कोई निष्कर्ष नहीं जोड़ा गया।
  alternative: इसे केवल कूटनीतिक अनुकूलन मानना, अथवा इसे उसके पूर्ण व्यक्तिगत विश्वास का प्रमाण मानना।
  rationale: इब्रानी पाठ भंडारी के शब्द बताता है, पर उसके अंतर्मन या विश्वास की व्याख्या नहीं करता; अनुवाद इस धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘कुशल’, ‘खज़ाना’, ‘बोरियाँ’ और ‘चाँदी’ जैसे शब्द सामान्य पाठक के लिए सुबोध रहते हुए इब्रानी की ठोस शब्दावली को बनाए रखते हैं। परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान अर्थ से असंगत था; इसलिए [a] को ‘खज़ाना’ और [b] को ‘चाँदी’ के बाद रखा गया है।
