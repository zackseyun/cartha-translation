    reason: cross_reference
lexical_decisions:
- source_word: וְ/אֶת אֲחִי/כֶם קָחוּ
  choice: अपने भाई को भी साथ लो
  rationale: इब्रानी में 'अपने भाई' प्रत्यक्ष कर्म है और आरंभिक וְ का यहाँ योगात्मक बल है। हिंदी में 'भी' उस बल को स्वाभाविक रूप से व्यक्त करता है; 'साथ लो' לקח के यात्रा-संदर्भ को स्पष्ट और सहज रखता है।
- source_word: וְ/ק֖וּמוּ
  choice: और उठकर
  rationale: קום का मूल भाव 'उठना' सुरक्षित रखा गया है। कृदंतात्मक 'उठकर' अगले आदेश के साथ स्वाभाविक हिंदी क्रम बनाता है, बिना इसे केवल 'जाओ' में समेटे।
- source_word: שׁ֥וּבוּ
  choice: लौट जाओ
  rationale: שוב यहाँ पहले गए स्थान या व्यक्ति के पास वापस जाने का आदेश है। आधुनिक हिंदी में 'लौट जाओ' सीधा और स्वाभाविक है।
- source_word: אֶל הָ/אִישׁ
  choice: उस पुरुष के पास
  rationale: संदर्भ में निश्चित व्यक्ति की ओर संकेत है। 'उस पुरुष के पास' हिंदी में गंतव्य और पहले उल्लिखित मिस्री अधिकारी दोनों को स्वाभाविक ढंग से व्यक्त करता है; उसका पद या नाम मूल पाठ में नहीं जोड़ा गया।
