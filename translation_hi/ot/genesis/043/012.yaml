source:
  edition: WLC
  text: וְ/כֶ֥סֶף מִשְׁנֶ֖ה קְח֣וּ בְ/יֶדְ/כֶ֑ם וְ/אֶת הַ/כֶּ֜סֶף הַ/מּוּשָׁ֨ב בְּ/פִ֤י אַמְתְּחֹֽתֵי/כֶם֙ תָּשִׁ֣יבוּ בְ/יֶדְ/כֶ֔ם אוּלַ֥י מִשְׁגֶּ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/012.yaml
  text: Take double money in your hand[a], and take back in your hand the money that was returned in the mouth of your sacks[b]; perhaps it was a mistake.
translation:
  language: hi
  text: अपने साथ दुगुनी रकम[a] ले लो, और जो पैसा तुम्हारी बोरियों के मुँह[b] में वापस रख दिया गया था, उसे भी अपने साथ वापस ले जाओ; शायद कोई भूल हुई हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पहली बार की रकम के बराबर एक और रकम’।
    reason: मूल पद ‘दुगुनी रकम’ का अर्थ देता है; इसे पहले ले जाई गई रकम के बराबर अतिरिक्त राशि के रूप में भी व्यक्त किया जा सकता है।
  - marker: b
    text: अर्थात बोरियों के खुले सिरे पर।
    reason: इब्रानी में शाब्दिक अभिव्यक्ति ‘बोरियों के मुँह’ है।
lexical_decisions:
- source_word: כֶסֶף מִשְׁנֶה
  choice: दुगुना पैसा
  rationale: מִשְׁנֶה यहाँ पहले धन के बराबर एक और राशि जोड़कर कुल दुगुनी रकम ले जाने का भाव देता है। ‘दुगुना पैसा’ संक्षिप्त, स्वाभाविक और परिमाणगत अर्थ के निकट है।
- source_word: קְחוּ בְיֶדְכֶם
  choice: अपने साथ ... ले लो
  rationale: शाब्दिक रूप से ‘अपने हाथ में लो’ है, पर यहाँ בְיֶדְכֶם साथ लेकर चलने का भाव देता है। आधुनिक हिन्दी में ‘अपने साथ ले लो’ अधिक स्वाभाविक है।
- source_word: הַכֶּסֶף הַמּוּשָׁב
  choice: जो पैसा ... वापस रख दिया गया था
  rationale: Hophal कृदन्त का निष्क्रिय अर्थ है—पैसा लौटाया अथवा वापस रखवाया गया। प्रसंग में पैसा बोरियों में रखे जाने के कारण ‘वापस रख दिया गया था’ स्पष्ट और सटीक है।
- source_word: בְּפִי אַמְתְּחֹתֵיכֶם
  choice: तुम्हारी बोरियों के मुँह में
  rationale: פִּי का शाब्दिक अर्थ ‘मुँह’ है और पात्र के खुले सिरे के लिए प्रयुक्त हुआ है। हिन्दी में ‘बोरी का मुँह’ स्वाभाविक भी है और मूल बिंब को बनाए रखता है।
- source_word: תָּשִׁיבוּ בְיֶדְכֶם
  choice: उसे भी अपने साथ लौटा ले जाओ
  rationale: שוב का Hiphil रूप यहाँ ‘वापस ले जाना/लौटाना’ है। ‘अपने साथ’ בְיֶדְכֶם के वहन-संबंधी भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אוּלַי מִשְׁגֶּה הוּא
  choice: शायद यह कोई भूल हुई हो
  rationale: אוּלַי अनिश्चितता व्यक्त करता है और מִשְׁגֶּה अनजाने में हुई त्रुटि को। यह अनुवाद छल या नैतिक दोष का अनावश्यक संकेत नहीं जोड़ता।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी के ‘हाथ में’ मुहावरे को स्वाभाविक हिन्दी ‘अपने साथ’ से व्यक्त किया गया है, जबकि ‘बोरियों के मुँह’ का सजीव और हिन्दी में प्रचलित बिंब सुरक्षित रखा गया है।
