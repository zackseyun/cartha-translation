review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the doubled amount, the passive sense of the money having been put back, the sack-opening idiom, and the uncertainty that it was an error. ‘अपने साथ’ is a natural Hindi rendering of the carrying sense of בְיֶדְכֶם, though it does not retain the Hebrew’s repeated concrete reference to ‘hand.’
  naturalness: ‘दुगुनी रकम’ is more idiomatic than ‘दुगुना पैसा’ for a specified monetary amount. In this context ‘वापस ले जाओ’ is clearer and more natural than ‘लौटा ले जाओ,’ which can sound as though the object itself is performing the return.
  terminology: ‘रकम,’ ‘बोरियों के मुँह,’ ‘वापस रख दिया गया था,’ and ‘भूल’ are appropriate modern-standard Hindi choices. The note on ‘बोरियों के मुँह’ properly explains the literal container-opening idiom.
  issues:
  - severity: low
    issue: ‘दुगुना पैसा’ is slightly less idiomatic than ‘दुगुनी रकम.’
    rationale: The Hebrew denotes a doubled monetary amount; Hindi normally expresses this as ‘दुगुनी रकम.’
  - severity: low
    issue: ‘उसे भी अपने साथ लौटा ले जाओ’ is potentially awkward.
    rationale: ‘वापस ले जाओ’ naturally expresses bringing the money back, while retaining the carrying sense supplied by ‘अपने साथ.’
