  terminology: “उस आदमी” correctly avoids identifying him as a steward, and “यूसुफ” is consistent. “उन आदमियों” preserves the source’s generic designation rather than introducing “भाइयों.” The lexical-alternative note is retained with its anchor placed on the phrase to which it pertains.
