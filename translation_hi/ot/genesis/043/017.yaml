  yaml_path: translation/ot/genesis/043/017.yaml
  text: So the man did as Joseph said[a], and the man brought the men into Joseph’s house.
translation:
  language: hi
  text: तब उस आदमी ने वैसा ही किया जैसा यूसुफ ने कहा था, और वह उन आदमियों को यूसुफ के घर के भीतर ले गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन आदमियों को यूसुफ के घर ले आया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ने…किया
  rationale: यहाँ עשה किसी निर्देश का पालन करने को व्यक्त करता है; ‘वैसा ही किया’ स्वाभाविक हिंदी में यही अर्थ देता है।
- source_word: הָאִישׁ
  choice: उस आदमी
  rationale: इब्रानी पाठ दोनों बार केवल ‘आदमी’ कहता है। संदर्भ से वह गृह-प्रबंधक जान पड़ता है, पर पद में उसकी भूमिका स्पष्ट नहीं की गई है। हिंदी में पहले से उल्लिखित व्यक्ति के लिए ‘उस आदमी’ स्वाभाविक है।
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: वैसा ही…जैसा यूसुफ ने कहा था
  rationale: यह वाक्यांश यूसुफ के निर्देश के अनुरूप कार्य को व्यक्त करता है। ‘कहा था’ कथा के पूर्व निर्देश को स्वाभाविक रूप से दर्शाता है।
- source_word: וַיָּבֵא
  choice: ले गया
  rationale: בוא का हिफ़ील रूप किसी को किसी स्थान में लाने/ले जाने का कारण बनना दर्शाता है। हिंदी में कथावाचक के दृष्टिकोण से यूसुफ के घर तक पहुँचाने के लिए ‘ले गया’ अधिक स्वाभाविक है।
- source_word: הָאֲנָשִׁים
  choice: उन पुरुषों
  rationale: मूल पाठ सामान्य शब्द ‘पुरुषों’ का प्रयोग करता है; उन्हें सीधे ‘भाई’ कहना पद से अधिक व्याख्या जोड़ता।
- source_word: בֵּיתָה יוֹסֵף
  choice: यूसुफ के घर के भीतर
  rationale: בֵּיתָה पर दिशासूचक ה घर की ओर गति को दिखाता है और संदर्भ प्रवेश का संकेत देता है; ‘घर के भीतर’ इसे स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
