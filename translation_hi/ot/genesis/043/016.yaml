base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/016.yaml
  text: When Joseph saw Benjamin with them[a], he said to the one over his household, “Bring the men into the house, slaughter an animal, and prepare it[c][b], because the men will eat with me at noon.”
translation:
  language: hi
  text: जब यूसुफ ने बिन्यामीन को उनके साथ देखा, तब उसने अपने घर के प्रबंधक से कहा, “इन पुरुषों को घर के भीतर ले आओ, एक पशु का वध करो और उसे तैयार करो,[a] क्योंकि ये पुरुष दोपहर को मेरे साथ भोजन करेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “वध का वध करो” है—यह भोजन के लिए किसी पशु को काटने का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: यहाँ ראה का साधारण अर्थ किसी की उपस्थिति को देखना या ध्यान देना है; ‘देखा’ स्वाभाविक और सीधा अनुवाद है।
- source_word: אִתָּם אֶת־בִּנְיָמִין
  choice: उनके साथ बिन्यामीन को
  rationale: अर्थ यह है कि बिन्यामीन अपने भाइयों के साथ उपस्थित था; यह पदक्रम हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לַאֲשֶׁר עַל־בֵּיתוֹ
  choice: अपने घर के अधिकारी से
  rationale: इब्रानी का शाब्दिक अर्थ ‘उसके घर के ऊपर नियुक्त व्यक्ति’ है। ‘घर का अधिकारी’ उसकी प्रबंधकीय भूमिका को बिना अनावश्यक पदवी जोड़े व्यक्त करता है।
- source_word: הָבֵא אֶת־הָאֲנָשִׁים הַבָּיְתָה
  choice: इन पुरुषों को घर के भीतर ले आओ
  rationale: दिशासूचक रूप הַבָּיְתָה घर के अंदर ले जाने का भाव देता है; ‘भीतर’ इसे स्पष्ट करता है।
- source_word: וּטְבֹחַ טֶבַח וְהָכֵן
  choice: एक पशु का वध करके भोजन तैयार करो
  rationale: क्रिया-संज्ञा का इब्रानी प्रयोग भोजन के लिए पशु काटने का मुहावरा है। ‘भोजन’ प्रसंगगत निहितार्थ को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि पशु की जाति अनिर्दिष्ट रखी गई है।
- source_word: כִּי אִתִּי יֹאכְלוּ הָאֲנָשִׁים
  choice: क्योंकि ये पुरुष ... मेरे साथ भोजन करेंगे
  rationale: כִּי आदेश का कारण बताता है। ‘भोजन करेंगे’ सामान्य ‘खाएँगे’ से थोड़ा गरिमापूर्ण है और सामूहिक भोज के प्रसंग में स्वाभाविक है।
- source_word: בַּצָּהֳרָיִם
  choice: दोपहर को
  rationale: यह शब्द मध्याह्न अथवा दोपहर का समय बताता है; आधुनिक हिन्दी में ‘दोपहर को’ सहज है।
