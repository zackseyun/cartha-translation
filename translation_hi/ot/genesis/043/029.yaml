  edition: WLC
  text: וַ/יִּשָּׂ֣א עֵינָ֗י/ו וַ/יַּ֞רְא אֶת בִּנְיָמִ֣ין אָחִי/ו֮ בֶּן אִמּ/וֹ֒ וַ/יֹּ֗אמֶר הֲ/זֶה֙ אֲחִי/כֶ֣ם הַ/קָּטֹ֔ן אֲשֶׁ֥ר אֲמַרְתֶּ֖ם אֵלָ֑/י וַ/יֹּאמַ֕ר אֱלֹהִ֥ים יָחְנְ/ךָ֖ בְּנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/029.yaml
  text: He lifted up his eyes and saw Benjamin[a], his brother, his mother's son, and said, “Is this your youngest brother, of whom you spoke to me?” Then he said, “May God be gracious to you, my son.”
translation:
  language: hi
  text: उसने आँखें उठाकर अपने भाई बिन्यामीन को देखा, जो उसकी ही माँ का बेटा था,[a] और पूछा, “क्या यही तुम्हारा वह सबसे छोटा भाई है, जिसके बारे में तुमने मुझसे कहा था?” फिर उसने कहा, “परमेश्वर तुझ पर अनुग्रह करे, मेरे बेटे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका भाई, उसकी माँ का बेटा”; इससे इस बात पर जोर पड़ता है कि बिन्यामीन और यूसुफ की माँ एक ही थी।
    reason: मूल इब्रानी की समानाधिकरणात्मक संरचना और उसके पारिवारिक जोर को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: उसने आँखें उठाकर
  rationale: इब्रानी मुहावरे का चित्रात्मक रूप हिन्दी में स्वाभाविक ढंग से रखा गया है; केवल ‘उसने देखा’ कहने से मूल की सजीवता घट जाती।
- source_word: וַיַּרְא
  choice: देखा
  rationale: ראה का यहाँ सीधा अर्थ ‘देखना’ है और यह पूर्ववर्ती क्रिया के साथ स्वाभाविक क्रम बनाता है।
- source_word: אֶת בִּנְיָמִין
  choice: बिन्यामीन
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: אָחִיו בֶּן אִמּוֹ
  choice: अपने भाई बिन्यामीन को देखा, जो उसकी माँ का बेटा था
  rationale: मूल की समानाधिकरणात्मक अभिव्यक्ति को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है, जिससे एक ही माँ से भाई होने पर दिया गया जोर बना रहता है।
- source_word: הֲזֶה
  choice: क्या यही
  rationale: प्रश्नवाचक कण और संकेतवाचक सर्वनाम दोनों को स्वाभाविक हिन्दी प्रश्न में व्यक्त करता है।
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: तुम्हारा वह सबसे छोटा भाई
  rationale: संदर्भ में הַקָּטֹן भाइयों में आयु की दृष्टि से सबसे छोटे को सूचित करता है, न कि शरीर के आकार को।
- source_word: אֲשֶׁר אֲמַרְתֶּם אֵלָי
  choice: जिसके बारे में तुमने मुझसे कहा था
  rationale: मूल के निकट रहते हुए आधुनिक हिन्दी में अर्थ स्पष्ट करता है; ‘जिसकी चर्चा तुमने मुझसे की थी’ भी सम्भव है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: आशीर्वाद की इस अभिव्यक्ति में यह इस्राएल के परमेश्वर के लिए सामान्य पद है; हिन्दी बाइबलीय प्रयोग में ‘परमेश्वर’ स्वाभाविक है।
- source_word: יָחְנְךָ
  choice: तुझ पर अनुग्रह करे
  rationale: חנן के कृपापूर्ण अनुग्रह या दया दिखाने के भाव को आशीर्वचन के रूप में सीधे व्यक्त करता है।
- source_word: בְּנִי
  choice: हे मेरे बेटे
  rationale: पुल्लिंग एकवचन और स्नेहपूर्ण सम्बोधन दोनों सुरक्षित रखे गए हैं; ‘हे’ हिन्दी में सम्बोधन को स्पष्ट करता है।
theological_decisions:
- issue: אֱלֹהִים יָחְנְךָ में आशीर्वचन का बल
  choice: परमेश्वर तुझ पर अनुग्रह करे
  alternative: परमेश्वर तुझ पर कृपा करे
  rationale: इब्रानी क्रिया का रूप प्रार्थनापूर्ण कामना या आशीर्वाद व्यक्त करता है। हिन्दी में ‘करे’ इस बल को स्वाभाविक रूप से व्यक्त करता है, बिना अतिरिक्त धर्मवैज्ञानिक आशय जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। कथन में ‘तुम’ और व्यक्तिगत आशीर्वचन में मूल के एकवचन के अनुरूप ‘तुझ’ रखा गया है।
