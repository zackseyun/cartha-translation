base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/006.yaml
  text: Then Israel said[a], “Why did you do me harm by telling the man that you still had another brother?”
translation:
  language: hi
  text: तब इस्राएल ने कहा, “तुमने उस आदमी को यह बताकर मुझ पर यह मुसीबत क्यों डाली कि तुम्हारा एक और भाई अब भी है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: इब्रानी पाठ में यहाँ ‘इस्राएल’ नाम है; इसलिए इसे ‘याकूब’ से नहीं बदला गया।
- source_word: לָמָה
  choice: क्यों
  rationale: यह सीधे कारण पूछने वाला सामान्य प्रश्नवाचक शब्द है।
- source_word: הֲרֵעֹתֶם לִי
  choice: मुझ पर यह मुसीबत ... डाली
  rationale: רעע का हिफ़ील रूप किसी का बुरा करने या उसे हानि पहुँचाने का भाव देता है। प्रसंग में इस सूचना के कारण इस्राएल पर आई परेशानी अभिप्रेत है; यह हिन्दी मुहावरा उस कारणात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְהַגִּיד
  choice: यह बताकर
  rationale: क्रियार्थक संज्ञा उस माध्यम को बताती है जिसके द्वारा परेशानी उत्पन्न हुई; ‘बताकर’ यह संबंध स्पष्ट रखता है।
- source_word: לָאִישׁ
  choice: उस आदमी को
  rationale: यह पहले से परिचित मिस्री अधिकारी की ओर संकेत करता है; हिन्दी में ‘उस आदमी’ संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: הַעוֹד לָכֶם אָח
  choice: कि तुम्हारा एक और भाई भी है
  rationale: शाब्दिक भाव है कि उनके लिए अभी एक भाई विद्यमान है। प्रसंग में ‘एक और’ निहित है और ‘भी है’ עוֹד के शेष/अतिरिक्त अस्तित्व के भाव को सहज हिन्दी में व्यक्त करता है।
