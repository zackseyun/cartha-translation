  register: आधुनिक, गरिमापूर्ण और बोलचाल में सहज मानक हिन्दी। मूल में प्रयुक्त ‘इस्राएल’ को बनाए रखा गया है। आरोपपूर्ण प्रश्न का भाव सुरक्षित है, पर नैतिक ‘बुराई’ का अनावश्यक तीखापन नहीं जोड़ा गया।
