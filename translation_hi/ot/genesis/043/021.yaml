base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
translation:
  language: hi
  text: जब हम रात बिताने की जगह पहुँचे और अपनी बोरियाँ खोलीं, तो देखा कि हर एक की चाँदी उसकी बोरी के मुँह में थी—हमारी चाँदी पूरे तौल के अनुसार थी[a]—और हम उसे अपने हाथ में वापस ले आए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारी चाँदी उसके तौल के अनुसार थी”; अर्थात जितनी चाँदी तौलकर दी गई थी, उतनी ही पूरी मात्रा वापस मिली।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּלוֹן
  choice: रात बिताने की जगह
  rationale: यह शब्द यात्रा के दौरान रात ठहरने की जगह बताता है; आधुनिक अर्थ वाले व्यावसायिक ‘सराय’ को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: אַמְתְּחֹתֵינוּ / אַמְתַּחְתּוֹ
  choice: अपनी बोरियाँ / उसकी बोरी
  rationale: यहाँ अनाज अथवा यात्रा की बोरी अभिप्रेत है; यूसुफ के वृत्तांत में ‘बोरी’ स्वाभाविक और संदर्भानुकूल है।
- source_word: וְהִנֵּה
  choice: तो देखा कि
  rationale: यह अचानक हुई खोज को उभारता है; हिन्दी में ‘तो देखा कि’ उसी कथात्मक आश्चर्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כֶסֶף אִישׁ
  choice: हर एक की चाँदी
  rationale: אִישׁ का वितरणात्मक भाव ‘हर एक’ से और כֶסֶף का ठोस अर्थ ‘चाँदी’ से सुरक्षित रहता है।
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: उसकी बोरी के मुँह पर
  rationale: पात्र के खुले भाग के लिए प्रयुक्त इब्रानी ‘मुँह’ की सजीव उपमा हिन्दी में भी सहज और समझने योग्य है।
- source_word: בְּמִשְׁקָלוֹ
  choice: पूरे तौल के अनुसार
  rationale: वाक्यांश बताता है कि चाँदी की वही पूरी, तौली हुई मात्रा लौटी थी; यह अनुवाद न तो मात्रा घटाता है, न अनावश्यक व्याख्या जोड़ता है।
- source_word: וַנָּשֶׁב אֹתוֹ בְּיָדֵנוּ
  choice: हम उसे अपने हाथों में वापस ले आए हैं
  rationale: सीधे संवाद की वर्तमान परिस्थिति में भाई बता रहे हैं कि खोजी हुई चाँदी अब वे साथ वापस लाए हैं; पूर्ण वर्तमान हिन्दी में इस संवाद-संबंध को स्पष्ट करता है और ‘हाथ’ की मूल उपमा रखता है।
