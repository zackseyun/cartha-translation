  text: וְ/אִם אֵינְ/ךָ֥ מְשַׁלֵּ֖חַ לֹ֣א נֵרֵ֑ד כִּֽי הָ/אִ֞ישׁ אָמַ֤ר אֵלֵ֨י/נוּ֙ לֹֽא תִרְא֣וּ פָנַ֔/י בִּלְתִּ֖י אֲחִי/כֶ֥ם אִתְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/005.yaml
  text: But if you will not send him[a], we will not go down, because the man said to us, ‘You will not see my face unless your brother is with you.’
translation:
  language: hi
  text: पर यदि आप उसे नहीं भेजेंगे, तो हम नीचे नहीं जाएँगे, क्योंकि उस आदमी ने हमसे कहा था, “जब तक तुम्हारा भाई तुम्हारे साथ न हो, तुम मेरा चेहरा नहीं देखोगे[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “तुम मेरा चेहरा नहीं देखोगे।” यह किसी के सामने उपस्थित होने या उसकी उपस्थिति में आने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: पर यदि
  rationale: यह पिछले पद की शर्त के विपरीत स्थिति प्रस्तुत करता है; ‘पर यदि’ इस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵינְךָ מְשַׁלֵּחַ
  choice: आप उसे नहीं भेजेंगे
  rationale: नकार के साथ कृदन्त यहाँ याकूब के विचाराधीन निर्णय या इनकार को व्यक्त करता है। ‘उसे’ प्रसंग से बिन्यामीन के लिए जोड़ा गया है; इब्रानी में कर्म निहित है। याकूब के लिए आदरसूचक एकवचन ‘आप’ स्वाभाविक है।
- source_word: לֹא נֵרֵד
  choice: हम नीचे नहीं जाएँगे
  rationale: ירד कनान से मिस्र की ओर यात्रा के लिए प्रयुक्त भौगोलिक अभिव्यक्ति है; ‘नीचे जाना’ इसे बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनके नीचे न जाने का कारण प्रस्तुत करता है।
- source_word: הָאִישׁ
  choice: उस आदमी
  rationale: भाई अभी यूसुफ को नहीं पहचानते और उसे केवल ‘उस आदमी’ के रूप में बताते हैं; अनुवाद वक्ताओं की सीमित जानकारी बनाए रखता है।
- source_word: אָמַר אֵלֵינוּ
  choice: हमसे कहा था
  rationale: पूर्व में दिए गए कथन का सहज हिन्दी वर्णन है और सीधे उद्धरण की भूमिका बनाता है।
- source_word: לֹא תִרְאוּ פָנַי
  choice: तुम मेरा मुँह नहीं देखोगे
  rationale: शाब्दिक चित्र को सुरक्षित रखा गया है; प्रसंग में यह किसी के सामने उपस्थित होने या उससे भेंट करने का मुहावरा है।
- source_word: בִּלְתִּי
  choice: जब तक ... न हो
  rationale: यह आवश्यक शर्त व्यक्त करता है; हिन्दी में ‘जब तक ... न हो’ यहाँ ‘unless’ का स्वाभाविक समतुल्य है।
- source_word: אֲחִיכֶם אִתְּכֶם
  choice: तुम्हारा भाई तुम्हारे साथ न हो
  rationale: बहुवचन संबोधन बनाए रखा गया है और इब्रानी के क्रियारहित उपवाक्य के लिए हिन्दी में ‘हो’ जोड़ा गया है। भाई का नाम नहीं जोड़ा गया, क्योंकि मूल पाठ केवल ‘तुम्हारा भाई’ कहता है।
