base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/024.yaml
  text: The man brought the men into Joseph’s house and gave them water[a], and they washed their feet[c][b]; then he gave fodder to their donkeys.
translation:
  language: hi
  text: उस आदमी ने उन लोगों[a] को यूसुफ के घर के भीतर ले जाकर उन्हें पानी दिया; उन्होंने अपने पाँव धोए। फिर उसने उनके गधों को चारा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में यहाँ ‘उस आदमी’ और ‘उन लोगों’ कहा गया है। प्रसंग से उनकी पहचान यूसुफ के घर के व्यक्ति और यूसुफ के भाइयों के रूप में होती है, लेकिन इस पद में यह पहचान सीधे नहीं बताई गई है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֵא
  choice: भीतर पहुँचाया
  rationale: בוא का हिफ़ील रूप कारणवाचक गति बताता है—उस मनुष्य ने उन्हें घर में प्रवेश कराया। यह चयन हिन्दी में स्वाभाविक रहते हुए घर के भीतर जाने की दिशा को स्पष्ट करता है।
- source_word: הָאִישׁ
  choice: उस मनुष्य
  rationale: इब्रानी में केवल ‘मनुष्य’ है। प्रसंग से वह यूसुफ के घर का अधिकारी है, पर पद में उसकी भूमिका स्पष्ट नहीं की गई है।
- source_word: הָאֲנָשִׁים
  choice: उन पुरुषों
  rationale: मूल शब्द सामान्य बहुवचन ‘पुरुषों/मनुष्यों’ का है। प्रसंग में वे यूसुफ के भाई हैं, फिर भी अनुवाद पद की सामान्य संज्ञा बनाए रखता है।
- source_word: בֵּיתָה יוֹסֵף
  choice: यूसुफ के घर के भीतर
  rationale: בֵּיתָה में दिशासूचक प्रत्यय घर के अंदर की ओर गति दर्शाता है; ‘के भीतर’ इस बल को व्यक्त करता है।
- source_word: וַיִּתֶּן מַיִם
  choice: उन्हें पानी दिया
  rationale: मूल में ‘पानी दिया’ है; हिन्दी में ग्राहकों को प्रसंग से जोड़ने के लिए ‘उन्हें’ स्वाभाविक रूप से जोड़ा गया है।
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: उन्होंने अपने पाँव धोए
  rationale: क्रिया सक्रिय बहुवचन है, इसलिए यह नहीं कहा गया कि किसी सेवक ने उनके पाँव धोए।
- source_word: מִסְפּוֹא
  choice: चारा
  rationale: यह पशुओं के आहार का सामान्य शब्द है; आधुनिक हिन्दी में ‘चारा’ सटीक और सहज है।
- source_word: לַחֲמֹרֵיהֶם
  choice: उनके गधों को
  rationale: לְ अप्रत्यक्ष कर्म अथवा लाभार्थी को दर्शाता है; हिन्दी में ‘गधों को चारा दिया’ स्वाभाविक है।
