  yaml_path: translation/ot/genesis/043/003.yaml
  text: Then Judah said to him[a], “The man solemnly warned us, saying[b], ‘You shall not see my face unless your brother is with you.’”
translation:
  language: hi
  text: तब यहूदा ने उससे कहा, “उस आदमी ने हमें सख्ती से चेतावनी दी थी[a], यह कहकर, ‘यदि तुम्हारा भाई तुम्हारे साथ न हो, तो तुम मेरा चेहरा नहीं देखोगे।’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में क्रिया के साथ उसी धातु का एक विशेष रूप रखकर बात पर जोर दिया गया है। इसका अनुवाद ‘बहुत कड़ी चेतावनी दी थी’ या ‘साफ-साफ चेतावनी दी थी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ है, ‘तुम मेरा चेहरा नहीं देखोगे।’ इस मुहावरे का अर्थ ‘तुम मेरे सामने उपस्थित नहीं हो सकोगे’ भी हो सकता है।
    reason: lexical_alternative
