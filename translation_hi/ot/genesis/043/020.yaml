base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/020.yaml
  text: And they said[a], “Please, my lord[b], we came down the first time to buy food.”
translation:
  language: hi
  text: उन्होंने कहा, “कृपा कीजिए, स्वामी, हम पहली बार भोजन खरीदने के लिए सचमुच नीचे आए थे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: उन्होंने कहा
  rationale: वाव-क्रमिक कथात्मक रूप को सहज आधुनिक हिन्दी में व्यक्त करता है; अलग से ‘और’ आवश्यक नहीं है।
- source_word: בִּי
  choice: कृपया सुनिए
  rationale: यह विनम्र निवेदन की उद्गारात्मक अभिव्यक्ति है; हिन्दी संवाद में ‘कृपया सुनिए’ अधीनस्थ की सम्मानपूर्ण विनती को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲדֹנִי
  choice: हे हमारे स्वामी
  rationale: यह किसी मानवीय उच्चाधिकारी के लिए आदरसूचक संबोधन है। बोलने वाले अनेक हैं, इसलिए स्वाभाविक हिन्दी में ‘हमारे’ रखा गया है, यद्यपि इब्रानी रूप व्याकरणतः एकवचन ‘मेरे स्वामी’ है।
- source_word: יָרֹד יָרַדְנוּ
  choice: सचमुच … आए थे
  rationale: क्रिया के साथ प्रयुक्त निरपेक्ष क्रियार्थक संज्ञा बल देती है; ‘सचमुच’ उस जोर को स्पष्ट और सहज हिन्दी में बनाए रखता है।
- source_word: בַּתְּחִלָּה
  choice: पहली बार
  rationale: कथा के प्रसंग में यह उनकी पिछली, अर्थात पहली यात्रा को सूचित करता है।
- source_word: לִשְׁבָּר
  choice: मोल लेने
  rationale: यहाँ क्रिया खाद्य-सामग्री खरीदकर प्राप्त करने के अर्थ में है; ‘मोल लेने’ से क्रय का भाव स्पष्ट रहता है।
- source_word: אֹכֶל
  choice: भोजन
  rationale: मूल संज्ञा सामान्यतः भोजन/खाद्य पदार्थ को दर्शाती है; इसे केवल ‘अनाज’ तक सीमित नहीं किया गया।
theological_decisions:
- issue: אֲדֹנִי का मानवीय या ईश्वरीय संबोधन
  choice: मानवीय उच्चाधिकारी के लिए ‘स्वामी’
  alternative: प्रभु
  rationale: इस प्रसंग में संबोधन यूसुफ के घर के अधिकारी से है, परमेश्वर से नहीं; ‘प्रभु’ अनावश्यक धार्मिक अर्थ जगा सकता है।
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और कथात्मक हिन्दी। वक्ताओं की विनम्रता दिखाने के लिए ‘हे हमारे स्वामी, कृपया सुनिए’ रखा गया है। ‘यहाँ’ गंतव्य का हिन्दी में स्वाभाविक संकेत है; मूल क्रिया में मिस्र की ओर ‘नीचे आने’ का भाव निहित है।
