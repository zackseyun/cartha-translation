    rationale: יָרַדְנוּ means “we came/went down”; “आए थे” alone loses this feature, while “यहाँ” is not in the source.
  - severity: medium
    issue: Added speech and altered focus of emphasis
    rationale: “कृपया सुनिए” adds an imperative absent from בִּי, and “मोल लेने ही” places restrictive emphasis on the purchase purpose rather than on the emphatic “we came down.”
  - severity: low
    issue: Plural possessive in address
    rationale: אֲדֹנִי is singular (“my lord”). Hindi can naturally use the unpossessed vocative “स्वामी” for a group’s respectful address, avoiding an unsupported plural possessive.
