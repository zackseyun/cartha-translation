  yaml_path: translation/ot/genesis/043/033.yaml
  text: And they sat before him[a], the firstborn according to his birthright and the youngest according to his youth[b], and the men looked at one another in astonishment.
translation:
  language: hi
  text: वे उसके सामने बैठ गए—बड़े से लेकर सबसे छोटे तक, हर एक अपने जन्मक्रम के अनुसार; और वे पुरुष एक-दूसरे को देखकर अचंभित हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשְׁבוּ לְפָנָיו
  choice: वे उसके सामने बैठ गए
  rationale: क्रिया सक्रिय कथात्मक रूप में है; ‘बैठ गए’ स्वाभाविक हिन्दी है और לְפָנָיו का स्थान-संबंध ‘उसके सामने’ से स्पष्ट रहता है।
- source_word: הַבְּכֹר כִּבְכֹרָתוֹ
  choice: पहलौठा अपने जन्मक्रम के अनुसार
  rationale: הַבְּכֹר के पहलौठेपन को बनाए रखते हुए, इस भोज की बैठक-व्यवस्था में כִּבְכֹרָתוֹ का व्यावहारिक आशय जन्मक्रम है, न कि अनिवार्यतः उत्तराधिकार का अधिकार।
- source_word: וְהַצָּעִיר כִּצְעִרָתוֹ
  choice: और सबसे छोटा अपनी छोटी उम्र के अनुसार
  rationale: पहलौठे से सबसे छोटे तक क्रमबद्ध बैठने का विरोध स्पष्ट करता है और צעיר/צעירה की आयु तथा कनिष्ठता की शब्दगत संगति बनाए रखता है।
- source_word: וַיִּתְמְהוּ ... אִישׁ אֶל־רֵעֵהוּ
  choice: अचम्भे से एक-दूसरे को देखने लगे
  rationale: תמה विस्मय व्यक्त करता है और पारस्परिक पदबंध אִישׁ אֶל־רֵעֵהוּ को स्वाभाविक हिन्दी में दृश्य प्रतिक्रिया के रूप में व्यक्त किया गया है।
- source_word: הָאֲנָשִׁים
  choice: वे पुरुष
  rationale: मूल पाठ के ‘पुरुष’ को बनाए रखा गया है; ‘भाई’ कहना संदर्भतः सही होता, पर मूल संज्ञा से अधिक स्पष्ट व्याख्या जोड़ देता।
