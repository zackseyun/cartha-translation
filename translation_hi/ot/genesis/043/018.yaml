base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/018.yaml
  text: The men were afraid because they had been brought into Joseph’s house[a], and they said, “It is because of the money that was returned in our sacks the first time that we are being brought in, so that he may make a pretext against us and fall upon us and take us as servants, along with our donkeys.”
translation:
  language: hi
  text: जब उन्होंने देखा कि उन्हें यूसुफ के घर ले जाया गया है, तो वे लोग डर गए। उन्होंने कहा, “पहली बार हमारी बोरियों में जो चाँदी लौटा दी गई थी, उसी के कारण हमें भीतर लाया जा रहा है, ताकि वह हमारे विरुद्ध कोई बहाना बनाए[a], हम पर टूट पड़े, और हमें दास बना ले तथा हमारे गधे भी ले ले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे विरुद्ध कोई अवसर ढूँढ़े।” यहाँ प्रयुक्त इब्रानी मुहावरे का ठीक अर्थ निश्चित नहीं है।
    reason: कठिन इब्रानी मुहावरे לְהִתְגֹּלֵל עָלֵינוּ की वास्तविक lexical ambiguity को बनाए रखने के लिए।
lexical_decisions:
- source_word: וַיִּירְאוּ הָאֲנָשִׁים
  choice: वे पुरुष ... डर गए
  rationale: ירא यहाँ कथानक में उनकी तत्काल भयपूर्ण प्रतिक्रिया बताता है। ‘डर गए’ सहज आधुनिक हिन्दी है; ‘वे पुरुष’ मूल के निश्चित बहुवचन को बनाए रखता है।
- source_word: כִּי הוּבְאוּ בֵּית יוֹסֵף
  choice: कि उन्हें यूसुफ के घर लाया गया है
  rationale: הוּבְאוּ, בוא का होफ़अल रूप, कारणवाचक कर्मवाच्य है। हिन्दी में ‘लाया गया है’ उनकी वर्तमान स्थिति और उससे उपजे भय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל דְּבַר הַכֶּסֶף
  choice: चाँदी ... के कारण
  rationale: עַל דְּבַר यहाँ विषय मात्र नहीं, कारण या अवसर दर्शाता है। כֶּסֶף को प्राचीन विनिमय-माध्यम के संदर्भ में ‘चाँदी’ कहा गया है।
- source_word: הַשָּׁב בְּאַמְתְּחֹתֵינוּ
  choice: हमारी बोरियों में जो चाँदी लौटा दी गई थी
  rationale: הַשָּׁב परिणामसूचक कर्मवाच्य अर्थ देता है और אַמְתַּחַת अनाज या यात्रा की बोरी है। ‘लौटा दी गई थी’ पूर्व यात्रा की घटना स्पष्ट करता है।
- source_word: בַּתְּחִלָּה
  choice: पहली बार
  rationale: कथा-संदर्भ में यह उनकी पहली मिस्र-यात्रा की ओर संकेत करता है; ‘आरम्भ में’ की अपेक्षा ‘पहली बार’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: אֲנַחְנוּ מוּבָאִים
  choice: हमें भीतर लाया जा रहा है
  rationale: कर्मवाच्य कृदन्त जारी क्रिया को दर्शाता है। ‘भीतर’ घर में प्रवेश के निहित भाव को स्पष्ट करता है।
- source_word: לְהִתְגֹּלֵל עָלֵינוּ
  choice: ताकि वह हमारे विरुद्ध कोई बहाना ढूँढ़े
  rationale: यह कठिन मुहावरा शाब्दिक रूप से ‘हम पर लुढ़कना’ जैसा है, पर प्रसंग में विरोध का अवसर या आरोप का आधार खोजने का भाव देता है। फुटनोट अनिश्चितता को सुरक्षित रखता है।
- source_word: וּלְהִתְנַפֵּל עָלֵינוּ
  choice: हम पर टूट पड़े
  rationale: נפל के हित्पअेल रूप के साथ עַל यहाँ शत्रुतापूर्ण धावा बोलने का भाव देता है। ‘टूट पड़े’ चित्रात्मकता और आक्रमण दोनों को रखता है।
- source_word: וְלָקַחַת אֹתָנוּ לַעֲבָדִים וְאֶת חֲמֹרֵינוּ
  choice: हमें दास बना ले तथा हमारे गधे भी ले ले
  rationale: עֲבָדִים यहाँ बंधुआ दासत्व दर्शाता है, इसलिए ‘सेवक’ नहीं बल्कि ‘दास’ उपयुक्त है। हिन्दी में गधों को भी दास बनाने का भ्रामक अर्थ न निकले, इसलिए अंतिम पद को स्वाभाविक रूप से अलग किया गया है।
