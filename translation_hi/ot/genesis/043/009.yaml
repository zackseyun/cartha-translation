  text: אָֽנֹכִי֙ אֶֽעֶרְבֶ֔/נּוּ מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נּוּ אִם לֹ֨א הֲבִיאֹתִ֤י/ו אֵלֶ֨י/ךָ֙ וְ/הִצַּגְתִּ֣י/ו לְ/פָנֶ֔י/ךָ וְ/חָטָ֥אתִֽי לְ/ךָ֖ כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/009.yaml
  text: I myself will guarantee him. From my hand you may require him. If I do not bring him to you and set him before you[a], then I will bear the blame to you all my days.
translation:
  language: hi
  text: मैं स्वयं उसका जामिन बनूँगा। उसका हिसाब मेरे हाथ से लेना। यदि मैं उसे तेरे पास न लाऊँ और तेरे सामने उपस्थित न करूँ, तो मैं जीवन भर तेरे प्रति दोषी ठहरूँगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “तो मैं जीवन भर तेरे विरुद्ध पापी ठहरूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: मैं स्वयं
  rationale: स्वतंत्र सर्वनाम का बल बनाए रखता है और यह स्पष्ट करता है कि यहूदा व्यक्तिगत रूप से उत्तरदायित्व ले रहा है।
- source_word: אֶעֶרְבֶנּוּ
  choice: उसका जामिन बनता हूँ
  rationale: ערב का अर्थ किसी के लिए जमानत या उत्तरदायित्व लेना है। यह पद कानूनी-जैसे आश्वासन को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִיָּדִי תְּבַקְשֶׁנּוּ
  choice: तू उसे मेरे हाथ से माँगना
  rationale: हिब्रू के ठोस ‘मेरे हाथ से’ वाले उत्तरदायित्व-बिंब को सुरक्षित रखा गया है; ‘माँगना’ यहाँ हिसाब लेने या वापस माँगने के भाव में है।
- source_word: הֲבִיאֹתִיו אֵלֶיךָ
  choice: मैं उसे तेरे पास न लाऊँ
  rationale: हिफ़ील क्रिया का सीधा अर्थ ‘लाना’ है। ‘वापस’ प्रसंग में निहित है, पर मूल में स्पष्ट नहीं, इसलिए नहीं जोड़ा गया।
- source_word: וְהִצַּגְתִּיו לְפָנֶיךָ
  choice: तेरे सामने खड़ा न करूँ
  rationale: יצג के ‘सामने उपस्थित/खड़ा करना’ वाले ठोस अर्थ को बनाए रखता है।
- source_word: וְחָטָאתִי לְךָ
  choice: तेरे प्रति दोषी रहूँगा
  rationale: यहाँ חטא व्यक्तिगत प्रतिज्ञा भंग होने पर स्थायी दोष का भाव देता है। मुख्य पाठ में संबंधपरक दोष को स्वाभाविक हिन्दी में रखा गया है, जबकि ‘पाप’ वाला अधिक शाब्दिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: כָּל הַיָּמִים
  choice: जीवन भर
  rationale: मुहावरे का आशय आजीवन अवधि है; ‘जीवन भर’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: וְחָטָאתִי לְךָ का पारिवारिक प्रतिज्ञा के संदर्भ में अनुवाद
  choice: तेरे प्रति दोषी रहूँगा
  alternative: तेरे विरुद्ध पाप का दोषी रहूँगा
  rationale: यहूदा अपने पिता के सामने व्यक्तिगत और नैतिक उत्तरदायित्व स्वीकार करता है। मुख्य पाठ दोष के संबंधपरक भाव को स्पष्ट करता है, पर मूल क्रिया के सामान्य ‘पाप करना’ अर्थ को पाद-टिप्पणी में बनाए रखने से नैतिक-धार्मिक तनाव नहीं मिटता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। प्रसंग के पारिवारिक संबोधन के अनुरूप ‘तू/तेरे’ रखा गया है। ‘जामिन’ उत्तरदायित्व और जमानत के भाव को संक्षेप में व्यक्त करता है; ‘मेरे हाथ से’ मूल हिब्रू की ठोस जवाबदेही की छवि को सुरक्षित रखता है।
