  text: וַ/יֹּאמְר֡וּ שָׁא֣וֹל שָֽׁאַל הָ֠/אִישׁ לָ֣/נוּ וּ/לְ/מֽוֹלַדְתֵּ֜/נוּ לֵ/אמֹ֗ר הַ/ע֨וֹד אֲבִי/כֶ֥ם חַי֙ הֲ/יֵ֣שׁ לָ/כֶ֣ם אָ֔ח וַ/נַ֨גֶּד ל֔/וֹ עַל פִּ֖י הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה הֲ/יָד֣וֹעַ נֵדַ֔ע כִּ֣י יֹאמַ֔ר הוֹרִ֖ידוּ אֶת אֲחִי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/007.yaml
  text: They said, “The man questioned us closely about us and about our family, saying, ‘Is your father still alive? Do you have another brother?’ So we told him according to these words. How could we possibly know that he would say, ‘Bring your brother down’?”
translation:
  language: hi
  text: उन्होंने कहा, “उस आदमी ने हमारे और हमारे परिवार के विषय में हमसे बहुत पूछताछ की। उसने पूछा, ‘क्या तुम्हारा पिता अब भी जीवित है? क्या तुम्हारा कोई और भाई है?’ हमने इन बातों के अनुसार उसे उत्तर दिया। हम कैसे जान सकते थे कि वह कहेगा, ‘अपने भाई को नीचे ले आओ’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁאוֹל שָׁאַל
  choice: अच्छी तरह पूछताछ की
  rationale: एक ही धातु की पुनरुक्ति प्रश्नों की गहनता पर बल देती है; स्वाभाविक हिन्दी में इसे क्रियाविशेषण के साथ व्यक्त किया गया है।
- source_word: מוֹלַדְתֵּנוּ
  choice: हमारे परिवार
  rationale: यहाँ शब्द जन्म-संबंधी कुटुंब या कुल को सूचित करता है; प्रसंग में सरल और व्यापक ‘परिवार’ उपयुक्त है।
- source_word: עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: उसके सवालों के अनुसार
  rationale: शाब्दिक अर्थ ‘इन बातों के अनुसार’ है; संवाद के प्रसंग में आशय है कि उत्तर पूछी गई बातों के अनुरूप दिए गए।
- source_word: הֲיָדוֹעַ נֵדַע
  choice: हम भला कैसे जान सकते थे
  rationale: धातु की पुनरुक्ति वाला अलंकारिक प्रश्न प्रबल असंभवता व्यक्त करता है; हिन्दी में ‘भला कैसे’ वही बल स्वाभाविक रूप से देता है।
- source_word: הוֹרִידוּ
  choice: यहाँ नीचे ले आओ
  rationale: हिब्रू में स्पष्ट दिशासूचक ‘नीचे लाना’ है, क्योंकि कनान से मिस्र जाना नीचे जाना कहा गया है; ‘यहाँ’ गंतव्य को हिन्दी में स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; पारिवारिक संवाद के लिए सहज, किंतु गरिमापूर्ण भाषा। मूल के अलंकारिक प्रश्न और ‘नीचे ले आओ’ की भौगोलिक दिशा सुरक्षित रखी गई है।
