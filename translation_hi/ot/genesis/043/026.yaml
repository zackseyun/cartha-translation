- from: जब यूसुफ घर में आया, तब वे अपने हाथों में लाई हुई भेंट[a] घर के भीतर उसके पास ले आए[b], और उसके सामने भूमि तक झुक गए।
  to: जब यूसुफ घर में आया, तब वे वह भेंट[a], जो उनके हाथों में थी, घर के भीतर उसके पास ले आए[b], और उसके सामने भूमि पर झुक गए।
