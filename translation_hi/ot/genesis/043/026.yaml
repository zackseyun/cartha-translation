review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two directional references to the house, the brothers’ gift, and their act of obeisance before Joseph. However, ‘अपने हाथों में लाई हुई’ shifts the relative clause from the Hebrew’s stative ‘which was in their hands’ to an explicit prior act of bringing. The revision restores that wording without sacrificing natural Hindi.
  naturalness: The narrative is otherwise clear and appropriately dignified. ‘जो उनके हाथों में थी’ is both more idiomatic and closer to the source. ‘भूमि पर झुक गए’ is more natural Hindi than ‘भूमि तक झुक गए’ while retaining the downward-to-the-ground sense.
  terminology: ‘भेंट’ suitably renders מִנְחָה here as a diplomatic gift, without implying a cultic offering. The footnote appropriately notes ‘उपहार’ and ‘कर’ as contextual alternatives.
  issues:
  - severity: medium
    issue: The phrase ‘अपने हाथों में लाई हुई भेंट’ adds a participial sense of ‘brought/carried in their hands.’
    rationale: אֲשֶׁר בְּיָדָם literally identifies the gift as being ‘in their hands’; it does not itself describe the action of carrying or bringing it. ‘जो उनके हाथों में थी’ retains the source expression.
  - severity: low
    issue: ‘भूमि तक झुक गए’ is somewhat awkward in modern standard Hindi.
    rationale: ‘भूमि पर झुक गए’ naturally expresses bowing down to the ground and does not specify a stronger ritual posture than the Hebrew requires.
  revised_text: जब यूसुफ घर में आया, तब वे वह भेंट[a], जो उनके हाथों में थी, घर के भीतर उसके पास ले आए[b], और उसके सामने भूमि पर झुक गए।
