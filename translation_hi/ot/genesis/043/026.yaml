  text: וַ/יָּבֹ֤א יוֹסֵף֙ הַ/בַּ֔יְתָ/ה וַ/יָּבִ֥יאּוּ ל֛/וֹ אֶת הַ/מִּנְחָ֥ה אֲשֶׁר בְּ/יָדָ֖/ם הַ/בָּ֑יְתָ/ה וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/026.yaml
  text: When Joseph came into the house[a], they brought to him the gift that was in their hands into the house[c][b], and they bowed down to the ground before him.
translation:
  language: hi
  text: जब यूसुफ घर में आया, तब वे वह भेंट[a], जो उनके हाथों में थी, घर के भीतर उसके पास ले आए[b], और उसके सामने भूमि पर झुक गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भेंट’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ प्रसंग के अनुसार ‘उपहार’ या ‘कर’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में ‘घर में/घर के भीतर’ का उल्लेख दो बार है—पहले यूसुफ के आने के लिए और फिर भेंट भीतर लाए जाने के लिए।
    reason: literary_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का सामान्य अर्थ ‘आना’ या ‘प्रवेश करना’ है। ‘घर में आया’ दिशासूचक ה के साथ स्वाभाविक हिन्दी है।
- source_word: הַבַּיְתָה
  choice: घर में / घर के भीतर
  rationale: בית के साथ दिशासूचक ה घर की ओर अथवा उसके भीतर गति दर्शाता है। पद में हुई पुनरावृत्ति को दोनों स्थानों पर बनाए रखा गया है।
- source_word: וַיָּבִיאוּ לוֹ
  choice: उसके पास ले आए
  rationale: בוא के हिफ़ील रूप का अर्थ ‘लाना’ है। ‘उसके पास ले आए’ प्राप्तकर्ता और गति दोनों को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַמִּנְחָה
  choice: भेंट
  rationale: מנחה प्रसंग के अनुसार भेंट, उपहार या कर हो सकता है। यहाँ भाइयों द्वारा यूसुफ के लिए लाई गई सम्मानसूचक वस्तुओं के लिए ‘भेंट’ उपयुक्त है और इसे उपासना-संबंधी चढ़ावे के रूप में नहीं दर्शाता।
- source_word: אֲשֶׁר בְּיָדָם
  choice: अपने हाथों में लाई हुई
  rationale: मूल अर्थ ‘जो उनके हाथों में थी’ है। हिन्दी में यह रूप वस्तु को साथ लेकर आने का भाव स्वाभाविक रूप से व्यक्त करता है, जबकि ‘हाथों’ की ठोस छवि भी बनाए रखता है।
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: उसके सामने भूमि तक झुक गए
  rationale: שחה का यह रूप सम्मान में झुकने को और אָרְצָה भूमि की ओर गति को दर्शाता है। यह अनुवाद पूर्ण दण्डवत का अनावश्यक अनुमान लगाए बिना गहरे प्रणाम की मुद्रा व्यक्त करता है।
theological_decisions:
- issue: यूसुफ के सामने झुकने की क्रिया का स्वरूप
  choice: उसके सामने भूमि तक झुक गए
  alternative: उसे दण्डवत किया
  rationale: मूल पाठ सम्मानपूर्वक भूमि की ओर झुकने का वर्णन करता है; ‘दण्डवत’ धार्मिक आराधना अथवा शरीर की किसी अधिक निश्चित मुद्रा का अतिरिक्त संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कथात्मक शैली अपनाई गई है। ‘तब’ घटनाक्रम को स्पष्ट करता है; मूल की घर-संबंधी पुनरावृत्ति को जानबूझकर सुरक्षित रखा गया है।
