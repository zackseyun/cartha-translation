  yaml_path: translation/ot/genesis/043/030.yaml
  text: Then Joseph hurried[a], because his compassion for his brother was stirred, and he sought a place to weep[b]. He entered the room and wept there.
translation:
  language: hi
  text: तब यूसुफ ने जल्दी की, क्योंकि अपने भाई के लिए उसके मन में करुणा उमड़ पड़ी थी[a]। वह रोने के लिए जगह ढूँढ़ने लगा[b]। फिर वह कमरे में गया और वहाँ रोया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में इब्रानी मुहावरा कहता है कि अपने भाई के लिए उसकी ‘करुणाएँ उमड़ उठीं’ या ‘भीतर से गरम हो उठीं।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में अधिक शाब्दिक रूप से, ‘वह रोने के लिए खोजने लगा।’ प्रसंग से रोने के लिए किसी जगह की खोज का भाव निकलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: ने जल्दी की
  rationale: क्रिया का मूल अर्थ ‘शीघ्रता करना’ है। स्रोत में ‘बाहर’ स्पष्ट नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: נִכְמְרוּ רַחֲמָיו
  choice: उसके मन में करुणा उमड़ पड़ी थी
  rationale: यह इब्रानी मुहावरा भीतर की गहरी करुणा के प्रबल रूप से जाग उठने को व्यक्त करता है। यह चयन भाव की तीव्रता बचाते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֶל אָחִיו
  choice: अपने भाई के लिए
  rationale: पूर्वसर्ग भावना के लक्ष्य को दर्शाता है। ‘अपने भाई के लिए’ सहज हिन्दी है और स्रोत की तरह भाई का नाम नहीं जोड़ता।
- source_word: וַיְבַקֵּשׁ לִבְכּוֹת
  choice: वह रोने के लिए जगह ढूँढ़ने लगा
  rationale: शाब्दिक अर्थ ‘उसने रोना चाहा/रोने का उपाय ढूँढ़ा’ के निकट है; प्रसंग में यूसुफ रोने के लिए निजी स्थान खोज रहा है। ‘जगह’ निहित अर्थ को स्पष्ट करती है।
- source_word: הַחַדְרָה
  choice: भीतर के कमरे में
  rationale: संज्ञा किसी कमरे या कक्ष, संभवतः निजी भीतरी कक्ष, को दर्शाती है। यह आधुनिक पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: וַיֵּבְךְּ שָׁמָּה
  choice: और वहाँ रोया
  rationale: यह क्रिया और स्थानवाचक शब्द दोनों का सीधा तथा स्वाभाविक अनुवाद है।
