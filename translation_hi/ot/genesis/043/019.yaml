  yaml_path: translation/ot/genesis/043/019.yaml
  text: So they approached the man who was over Joseph’s household and spoke to him at the entrance of the house,[a]
translation:
  language: hi
  text: तब वे उस पुरुष के पास गए जो यूसुफ के घराने का अधिकारी था, और घर के प्रवेश-द्वार पर उससे बात की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घर के द्वार पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: वे ... के पास गए
  rationale: नגשׁ का अर्थ किसी के निकट जाना है; यह वाक्यांश आधुनिक हिन्दी में स्वाभाविक रूप से दिशात्मक भाव व्यक्त करता है।
- source_word: הָאִישׁ
  choice: उस पुरुष
  rationale: इब्रानी में सामान्य शब्द 'पुरुष' है; संदर्भगत भूमिका के आधार पर इसे 'भंडारी' या 'सेवक' बनाना मूल से अधिक विशिष्ट होता।
- source_word: אֲשֶׁר עַל בֵּית יוֹסֵף
  choice: जो यूसुफ के घराने का अधिकारी था
  rationale: עַל यहाँ देखरेख और अधिकार का भाव देता है; 'घराना' घरेलू प्रतिष्ठान को और 'अधिकारी' प्रशासनिक दायित्व को स्पष्ट करता है।
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: उससे बात की
  rationale: דבר אל का सामान्य अर्थ किसी से बोलना या बात करना है; अगले पद में कथन की विषय-वस्तु आती है।
- source_word: פֶּתַח הַבָּיִת
  choice: घर के प्रवेश-द्वार पर
  rationale: פֶּתַח किसी खुले प्रवेश-स्थान या द्वार को सूचित करता है; 'प्रवेश-द्वार' दृश्य को स्पष्ट और स्वाभाविक ढंग से प्रस्तुत करता है।
