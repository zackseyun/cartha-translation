base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/015.yaml
  text: So the men took this gift[a], and they took double the money in their hand, and Benjamin[d][c][b]. Then they arose and went down to Egypt and stood before Joseph.
translation:
  language: hi
  text: तब उन आदमियों ने वह भेंट ली, और अपने साथ दुगुनी रकम तथा बिन्यामीन को लिया। फिर वे उठे, मिस्र की ओर नीचे उतरे[a] और यूसुफ के सामने खड़े हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘मिस्र को नीचे गए/उतरे’; कनान से मिस्र की यात्रा के लिए यह प्रचलित भौगोलिक मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: उन पुरुषों
  rationale: इब्रानी पाठ का स्पष्ट पद ‘पुरुष’ है; प्रसंग से वे भाई हैं, पर अनुवाद में मूल पदनाम बनाए रखा गया है।
- source_word: הַמִּנְחָה הַזֹּאת
  choice: वह भेंट
  rationale: यहाँ מִנְחָה किसी अधिकारी को प्रसन्न करने के लिए लाई गई भेंट है, धार्मिक बलि नहीं। हिंदी में ‘भेंट’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִשְׁנֶה כֶּסֶף
  choice: दुगुना धन
  rationale: यह पद पहले की अपेक्षा दुगुनी धनराशि का बोध कराता है। ‘दुगुना धन’ संक्षिप्त और स्पष्ट है।
- source_word: כֶּסֶף
  choice: धन
  rationale: शाब्दिक अर्थ ‘चाँदी’ है, किंतु लेन-देन के इस प्रसंग में इसका अर्थ भुगतान के लिए धन है।
- source_word: בְיָדָם
  choice: अपने साथ
  rationale: शाब्दिक रूप ‘अपने हाथ में’ है; यहाँ यह साथ रखने या ले जाने का इब्रानी मुहावरा है। आधुनिक हिंदी में ‘अपने साथ’ अभिप्राय को सहजता से व्यक्त करता है।
- source_word: וְאֶת בִּנְיָמִן
  choice: तथा बिन्यामीन को
  rationale: प्रत्यक्ष कर्म-चिह्न से बिन्यामीन भी ‘लिया’ क्रिया के कर्मों में सम्मिलित है। हिंदी में ‘को’ संबंध स्पष्ट करता है।
- source_word: וַיָּקֻמוּ
  choice: वे उठे
  rationale: मूल क्रिया का अर्थ ‘उठना’ है और यात्रा आरंभ करने की क्रमिक कथा में इसे बनाए रखा गया है।
- source_word: וַיֵּרְדוּ מִצְרַיִם
  choice: मिस्र को उतर गए
  rationale: कनान से मिस्र की यात्रा के लिए प्रयुक्त इब्रानी भौगोलिक मुहावरे ‘उतरना’ को सुरक्षित रखा गया है।
- source_word: וַיַּעַמְדוּ לִפְנֵי יוֹסֵף
  choice: यूसुफ के सामने खड़े हुए
  rationale: यह मूल अभिव्यक्ति का सीधा, स्पष्ट और गरिमापूर्ण हिंदी रूप है।
