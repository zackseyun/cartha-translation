lexical_decisions:
- source_word: וְהָרָעָב
  choice: और ... अकाल
  rationale: רָעָב का अर्थ यहाँ कथा-संदर्भ में ‘अकाल’ है। आरंभिक וְ को पूर्ववर्ती कथा से स्पष्ट संबंध बनाए रखने के लिए ‘और’ से व्यक्त किया गया है।
- source_word: כָּבֵד
  choice: बहुत भयंकर था
  rationale: כָּבֵד का मूल अर्थ ‘भारी’ है, पर अकाल के साथ यह उसकी प्रचंडता या गंभीरता बताता है; आधुनिक हिन्दी में ‘बहुत भयंकर’ स्वाभाविक और स्पष्ट है।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: אֶרֶץ यहाँ पूरी पृथ्वी नहीं, कथा में पहले से ज्ञात क्षेत्र या देश को सूचित करता है; निश्चित उपपद הָ को ‘उस’ से व्यक्त किया गया है।
