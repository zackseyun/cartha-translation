  yaml_path: translation/ot/genesis/043/027.yaml
  text: He asked them about their well-being and said[a], “Is your elderly father, whom you spoke of[b], well? Is he still alive?”
translation:
  language: hi
  text: उसने उनका कुशल-क्षेम पूछा और कहा, “क्या तुम्हारे वृद्ध पिता, जिनका तुमने उल्लेख किया था, कुशल से हैं? क्या वे अब भी जीवित हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: उसने उनका कुशल-क्षेम पूछा
  rationale: यह इब्रानी मुहावरा किसी के सामान्य कल्याण और हालचाल के विषय में पूछने को व्यक्त करता है। ‘कुशल-क्षेम पूछना’ आधुनिक हिन्दी में स्वाभाविक है और केवल शांति या स्वास्थ्य तक अर्थ को सीमित नहीं करता।
- source_word: הֲשָׁלוֹם
  choice: कुशल से हैं
  rationale: यहाँ שָׁלוֹם पिता की समग्र कुशलता के बारे में प्रश्न है। ‘कुशल से’ संक्षिप्त और स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: אֲבִיכֶם הַזָּקֵן
  choice: तुम्हारे वृद्ध पिता
  rationale: הַזָּקֵן पिता की अधिक आयु का संकेत देता है। ‘वृद्ध’ सम्मानपूर्ण, स्पष्ट और वर्तमान मानक हिन्दी के अनुकूल है।
- source_word: אֲשֶׁר אֲמַרְתֶּם
  choice: जिनके विषय में तुमने बताया था
  rationale: शाब्दिक अर्थ ‘जिनके विषय में तुमने कहा था’ है; प्रसंग में भाइयों द्वारा पहले पिता का उल्लेख करना अभिप्रेत है। ‘बताया था’ हिन्दी में स्वाभाविक रूप से वही भाव व्यक्त करता है।
- source_word: הַעוֹדֶנּוּ חָי
  choice: क्या वे अब भी जीवित हैं
  rationale: עוֹד निरंतरता (‘अब भी’) और חָי जीवित होने को व्यक्त करता है। आदरसूचक एकवचन ‘वे/हैं’ वृद्ध पिता के लिए स्वाभाविक हिन्दी है।
