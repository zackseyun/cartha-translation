  yaml_path: translation/ot/genesis/043/002.yaml
  text: And when they had finished eating the grain that they had brought from Egypt[a], their father said to them, “Go back; buy us a little food.”
translation:
  language: hi
  text: जब वे मिस्र से लाया हुआ अनाज खा चुके थे, तब उनके पिता ने उनसे कहा, “लौट जाओ और हमारे लिए थोड़ा भोजन खरीदो।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लौट जाओ और हमारे लिए थोड़ा अनाज खरीदो।” इब्रानी क्रिया का इस प्रसंग में प्रयोग प्रायः अनाज खरीदने के लिए होता है, यद्यपि यहाँ उसका कर्म व्यापक अर्थ वाला ‘भोजन’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: जब ... तब
  rationale: इब्रानी कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; अलग से ‘ऐसा हुआ’ जोड़ना अनावश्यक और बोझिल होता।
- source_word: כִּלּוּ לֶאֱכֹל
  choice: खा चुके
  rationale: כלה और infinitive का मेल खाने की क्रिया पूरी हो जाने को दर्शाता है; ‘खा चुके’ पूर्ववर्ती पूर्णता को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַשֶּׁבֶר
  choice: अनाज
  rationale: यूसुफ की कथा और अकाल के प्रसंग में यह शब्द खरीदे गए अनाज को सूचित करता है, सामान्य भोजन को नहीं।
- source_word: הֵבִיאוּ מִמִּצְרָיִם
  choice: मिस्र से लाया हुआ
  rationale: यह स्पष्ट करता है कि अनाज पहले मिस्र से लाया गया था और बाद में समाप्त हुआ; हिन्दी कृदंत-रचना स्वाभाविक है।
- source_word: אֲבִיהֶם
  choice: उनके पिता
  rationale: मूल पाठ के संबंधवाचक पद को बनाए रखा गया है; यहाँ ‘याकूब’ नाम जोड़ना आवश्यक नहीं।
- source_word: שֻׁבוּ
  choice: फिर जाओ
  rationale: आज्ञा का आशय दोबारा उसी स्थान की यात्रा करना है। ‘फिर जाओ’ आधुनिक हिन्दी में स्वाभाविक है और वापसी की दिशा को प्रसंग से स्पष्ट रहने देता है।
- source_word: שִׁבְרוּ
  choice: मोल ले आओ
  rationale: इस प्रसंग में क्रिया का अर्थ अनाज या रसद खरीदना है। ‘मोल ले आओ’ खरीदने के साथ परिवार तक लाने के व्यावहारिक आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: לָנוּ
  choice: हमारे लिए
  rationale: दातृवाचक अर्थ को हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מְעַט אֹכֶל
  choice: थोड़ा भोजन
  rationale: מְעַט छोटी मात्रा और אֹכֶל सामान्य भोजन को दर्शाता है; यह शब्दावली अनाज के लिए पहले आए विशिष्ट पद से भेद बनाए रखती है।
