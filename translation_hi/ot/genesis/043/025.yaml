base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/025.yaml
  text: And they prepared the gift until Yosef came at noon[a], because they had heard that they would eat bread there.
translation:
  language: hi
  text: और उन्होंने दोपहर को यूसुफ के आने तक भेंट तैयार कर ली, क्योंकि उन्होंने सुना था कि वे वहीं भोजन करेंगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “रोटी खाएँगे”; यह साथ भोजन करने का इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: तैयार कर ली
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को तैयार करना है। स्त्रीलिंग ‘भेंट’ के साथ ‘तैयार कर ली’ स्वाभाविक है और कार्य के पूर्ण होने का भाव देता है।
- source_word: הַמִּנְחָה
  choice: भेंट
  rationale: इस प्रसंग में यह यूसुफ के लिए लाई गई सौगात है, कोई धार्मिक बलि या उपासना-संबंधी चढ़ावा नहीं। ‘भेंट’ सम्मानपूर्वक दिया गया उपहार स्पष्ट करती है।
- source_word: עַד בּוֹא יוֹסֵף
  choice: यूसुफ के आने तक
  rationale: עַד के साथ क्रियार्थक संज्ञा בּוֹא यूसुफ के आगमन तक की समय-सीमा बताती है।
- source_word: בַּצָּהֳרָיִם
  choice: दोपहर को
  rationale: यह शब्द मध्याह्न या दोपहर का समय बताता है; आधुनिक हिन्दी में ‘दोपहर को’ सहज है।
- source_word: כִּי שָׁמְעוּ
  choice: क्योंकि उन्होंने सुना था
  rationale: पहला כִּי कारण बताता है, और ‘सुना था’ से स्पष्ट होता है कि यह जानकारी भेंट तैयार करने से पहले मिल चुकी थी।
- source_word: כִּי שָׁם
  choice: कि वे वहीं
  rationale: दूसरा כִּי सुनी हुई बात की विषय-वस्तु आरम्भ करता है और שָׁם स्थान को दर्शाता है।
- source_word: יֹאכְלוּ לָחֶם
  choice: भोजन करेंगे
  rationale: शाब्दिक अर्थ ‘रोटी खाएँगे’ है, पर इब्रानी में यह साथ भोजन करने के लिए प्रयुक्त सामान्य मुहावरा है। मुख्य पाठ में अर्थ स्पष्ट रखा गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: मूल इब्रानी नाम का प्रचलित और सहज हिन्दी लिप्यंतरण।
