translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे वाक्यों से घटनाक्रम और यूसुफ के भावनात्मक संयम को स्पष्ट किया गया है। पादटिप्पणी-चिह्न ‘भोजन’ के बाद रखा गया है, क्योंकि वही לָחֶם से संबंधित है।
