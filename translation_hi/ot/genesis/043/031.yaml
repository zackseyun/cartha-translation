base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/031.yaml
  text: Then he washed his face[a], came out, controlled himself, and said, “Serve the food.”
translation:
  language: hi
  text: फिर उसने अपना चेहरा धोया और बाहर आया। उसने अपने आप को सँभाला और कहा, “भोजन[a] परोसो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल हिब्रू में ‘रोटी’; यहाँ यह शब्द संभवतः परोसे जाने वाले पूरे भोजन के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: धोया
  rationale: רחץ का सामान्य अर्थ ‘धोना’ है। रोने के बाद यूसुफ द्वारा चेहरा साफ करने के संदर्भ में यह स्वाभाविक और सटीक है।
- source_word: פָּנָיו
  choice: अपना चेहरा
  rationale: हिब्रू פָּנִים रूप की दृष्टि से बहुवचन है, पर एक व्यक्ति के मुख के लिए इसका अर्थ स्वाभाविक रूप से एकवचन ‘चेहरा’ होता है।
- source_word: וַיֵּצֵא
  choice: बाहर आया
  rationale: יצא का अर्थ बाहर जाना या निकलना है; कथानक में यूसुफ के निजी स्थान से उपस्थित लोगों के पास लौटने के कारण ‘बाहर आया’ स्वाभाविक है।
- source_word: וַיִּתְאַפַּק
  choice: अपने आप को सँभाला
  rationale: אפק के हित्पएल रूप में प्रबल भावना को रोकने और स्वयं पर नियंत्रण पाने का भाव है। ‘अपने आप को सँभाला’ आधुनिक हिन्दी में इस भाव को सहज ढंग से व्यक्त करता है।
- source_word: שִׂימוּ
  choice: परोसो
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘रखो’ है, पर भोजन के प्रसंग में आशय भोजन सामने रखने या परोसने का है।
- source_word: לָחֶם
  choice: भोजन
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, किंतु यह व्यापक अर्थ में भोजन के लिए भी प्रयुक्त होता है। भोज परोसे जाने के इस प्रसंग में ‘भोजन’ संदर्भगत अर्थ स्पष्ट करता है।
