  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יִשְׂרָאֵ֣ל אֲבִי/הֶ֗ם אִם כֵּ֣ן אֵפוֹא֮ זֹ֣את עֲשׂוּ֒ קְח֞וּ מִ/זִּמְרַ֤ת הָ/אָ֨רֶץ֙ בִּ/כְלֵי/כֶ֔ם וְ/הוֹרִ֥ידוּ לָ/אִ֖ישׁ מִנְחָ֑ה מְעַ֤ט צֳרִי֙ וּ/מְעַ֣ט דְּבַ֔שׁ נְכֹ֣את וָ/לֹ֔ט בָּטְנִ֖ים וּ/שְׁקֵדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/011.yaml
  text: 'Then Israel their father said to them[a], “If it must be so, then do this: take some of the choice products of the land in your containers, and carry down to the man a gift—a little balm and a little honey, gum and myrrh[c][b], pistachio nuts and almonds.”'
translation:
  language: hi
  text: 'तब उनके पिता इस्राएल ने उनसे कहा, “यदि ऐसा ही होना है, तो यह करो: देश की चुनिंदा उपज[a] में से कुछ अपने पात्रों में रख लो और उस आदमी के पास भेंट के रूप में ले जाओ—थोड़ा बलसान, थोड़ा शहद,[b] सुगंधित गोंद और गंधरस,[c] पिस्ते और बादाम।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “देश की कुछ उत्तम पैदावार” भी हो सकता है। हिब्रू अभिव्यक्ति केवल फलों को नहीं, बल्कि देश की चुनिंदा उपज को व्यापक रूप से दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: “शहद” से कुछ संदर्भों में मधुमक्खियों का शहद नहीं, बल्कि फलों से बना मीठा गाढ़ा रस भी अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “सुगंधित गोंद” और “गंधरस” के लिए प्रयुक्त हिब्रू शब्दों की सटीक पहचान अनिश्चित है; संभवतः ये विभिन्न सुगंधित गोंद या राल थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל אֲבִיהֶם
  choice: उनके पिता इस्राएल
  rationale: हिब्रू में ‘इस्राएल’ के साथ ‘उनके पिता’ समानाधिकरण में है। हिंदी में यह क्रम स्वाभाविक है और इस प्रसंग में याकूब के लिए प्रयुक्त ‘इस्राएल’ नाम को बनाए रखता है।
- source_word: אִם כֵּן אֵפוֹא
  choice: यदि ऐसा ही होना है, तो
  rationale: यह पदबंध परिस्थितियों के आगे अनिच्छापूर्वक मान जाने का भाव प्रकट करता है; केवल ‘यदि ऐसा है’ उस भाव को पर्याप्त रूप से नहीं दर्शाता।
- source_word: זֹאת עֲשׂוּ
  choice: यह करो
  rationale: सीधी आज्ञा का संक्षिप्त और स्वाभाविक हिंदी रूप।
- source_word: מִזִּמְרַת הָאָרֶץ
  choice: देश की चुनिंदा उपज में से कुछ
  rationale: यह अभिव्यक्ति देश की उत्तम या मूल्यवान पैदावार को व्यापक रूप से दर्शाती है, केवल फलों को नहीं।
- source_word: בִּכְלֵיכֶם
  choice: अपने पात्रों में
  rationale: हिब्रू शब्द सामान्यतः सामान रखने के पात्रों या साधनों के लिए है; ‘पात्र’ प्रकार को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְהוֹרִידוּ
  choice: ले जाओ
  rationale: मूल क्रिया में ‘नीचे ले जाने’ का भाव है, किंतु हिंदी में इस यात्रा के लिए ‘नीचे ले जाओ’ अस्वाभाविक हो सकता है। प्रसंगगत गमन और वस्तुओं को साथ ले जाने का अर्थ सुरक्षित रखा गया है।
- source_word: לָאִישׁ
  choice: उस आदमी के लिए
  rationale: यह पहले से उल्लिखित मिस्री अधिकारी की ओर संकेत करता है। ‘उस आदमी’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: מִנְחָה
  choice: भेंट
  rationale: यहाँ किसी व्यक्ति को प्रसन्न करने के लिए दिया जाने वाला उपहार अभिप्रेत है। ‘भेंट’ इस गैर-उपासना-संबंधी संदर्भ में उपयुक्त है।
- source_word: מְעַט צֳרִי
  choice: थोड़ा बलसान
  rationale: צֳרִי किसी औषधीय या सुगंधित राल/लेप को दर्शाता है; ‘बलसान’ पारंपरिक रूप से इस वस्तु का नाम है और इसे सामान्य ‘मरहम’ कहने से इसकी पहचान अनावश्यक रूप से बदलती नहीं।
- source_word: וּמְעַט דְּבַשׁ
  choice: थोड़ा शहद
  rationale: דְּבַשׁ का सामान्य अर्थ ‘शहद’ है, यद्यपि कुछ संदर्भों में मीठा फलों का गाढ़ा रस भी संभव है; यह संभावना पादटिप्पणी में रखी गई है।
- source_word: נְכֹאת
  choice: सुगंधित गोंद
  rationale: वनस्पति की सटीक पहचान अनिश्चित है। ‘सुगंधित गोंद’ पदार्थ की सामान्य प्रकृति बताता है, पर अत्यधिक निश्चित पहचान नहीं थोपता।
- source_word: לֹט
  choice: गंधरस
  rationale: परंपरागत अनुवादों में इसे गंधरस कहा जाता है, पर सटीक सुगंधित राल अनिश्चित है; अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: בָּטְנִים וּשְׁקֵדִים
  choice: पिस्ते और बादाम
  rationale: इन दो बहुवचन संज्ञाओं की सामान्य और व्यापक रूप से स्वीकृत वनस्पति पहचान क्रमशः पिस्ता और बादाम है।
