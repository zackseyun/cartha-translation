base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/032.yaml
  text: So they served him by himself[a], and them by themselves, and the Egyptians who ate with him by themselves, because the Egyptians could not eat bread with the Hebrews, for that is an abomination to the Egyptians.
translation:
  language: hi
  text: तब उन्होंने यूसुफ के लिए अलग भोजन परोसा, उसके भाइयों के लिए अलग, और यूसुफ के साथ खाने वाले मिस्रियों के लिए अलग; क्योंकि मिस्री इब्रियों के साथ भोजन[a] नहीं कर सकते थे, क्योंकि यह मिस्रियों के लिए घृणित बात थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘इब्रियों के साथ रोटी खाना’; यह साथ भोजन करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: उन्होंने ... भोजन परोसा
  rationale: मूल क्रिया का सामान्य अर्थ ‘रखना’ है, पर भोजन के प्रसंग में इसका आशय प्रत्येक समूह के सामने भोजन लगाना या परोसना है।
- source_word: לְבַדּוֹ / לְבַדָּם
  choice: अलग
  rationale: तीन बार दोहराई गई अलगाव की रचना को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָאֹכְלִים אִתּוֹ
  choice: जो उसके साथ खाते थे
  rationale: इब्रानी कृदंत को स्वाभाविक सम्बन्धवाचक उपवाक्य के रूप में प्रस्तुत किया गया है।
- source_word: לֹא יוּכְלוּן
  choice: नहीं कर सकते थे
  rationale: यह व्यावहारिक या सामाजिक असम्भवता व्यक्त करता है; हिन्दी में यही सहज और पर्याप्त रूप है।
- source_word: לֶאֱכֹל אֶת הָעִבְרִים לֶחֶם
  choice: इब्रियों के साथ भोजन करना
  rationale: शाब्दिक ‘रोटी खाना’ यहाँ साथ भोजन करने का मुहावरा है; मुख्य पाठ में अर्थ स्पष्ट किया गया और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: תוֹעֵבָה
  choice: घृणित
  rationale: शब्द किसी सांस्कृतिक या धार्मिक रूप से अत्यन्त आपत्तिजनक बात को दर्शाता है। ‘घृणित’ इसकी तीव्रता बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מִצְרִים / הָעִבְרִים
  choice: मिस्री / इब्री
  rationale: दोनों जातीय पहचानों और उनके बीच दर्शाई गई सामाजिक दूरी को स्पष्ट रूप से बनाए रखा गया है।
theological_decisions:
- issue: मिस्रियों द्वारा भोजन साझा न करने का स्वरूप
  choice: ‘मिस्रियों की दृष्टि में’ कहकर इसे उनकी सांस्कृतिक धारणा के रूप में व्यक्त किया गया
  alternative: ‘यह मिस्रियों के लिए घृणित था’
  rationale: मूल का לְמִצְרָיִם वही दृष्टिकोण दर्शाता है और हिन्दी में यह रूप इस घृणा को कथावाचक का सार्वभौमिक नैतिक निर्णय मान लेने से बचाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। तीनों समूहों के अलग-अलग बैठकर खाने पर मूल में दिए गए जोर को दोहराव द्वारा सुरक्षित रखा गया है। ‘उसके भाइयों’ में ‘भाइयों’ को प्रसंगगत संदर्भ स्पष्ट करने के लिए व्यक्त किया गया है।
