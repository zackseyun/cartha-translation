base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/028.yaml
  text: They said[a], “Your servant our father is well; he is still alive.” Then they bowed down and prostrated themselves.
translation:
  language: hi
  text: उन्होंने कहा[a], “आपके सेवक, हमारे पिता, कुशल हैं; वे अब भी जीवित हैं।” तब वे झुके और दण्डवत् किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “शान्ति” (शालोम) है; यहाँ इसका प्रयोग कुशल या भलाई के अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: कुशल से हैं
  rationale: यहाँ שָׁלוֹם पिता की दशा और कुशल-मंगल के विषय में पूछे गए प्रश्न का मुहावरेदार उत्तर है; ‘कुशल से हैं’ आधुनिक हिन्दी में स्वाभाविक रूप से वही अर्थ व्यक्त करता है।
- source_word: לְעַבְדְּךָ
  choice: आपका सेवक
  rationale: भाई यूसुफ से आदर और विनम्रता की दरबारी भाषा में बोलते हैं; यहाँ ‘सेवक’ उपयुक्त है और दासत्व का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: לְאָבִינוּ
  choice: हमारे पिता
  rationale: मूल के सीधे संबंधसूचक पदबंध को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: עוֹדֶנּוּ חָי
  choice: वे अब तक जीवित हैं
  rationale: ‘अब तक’ עוד की निरंतरता को व्यक्त करता है और आदरसूचक बहुवचन हिन्दी में पिता के उल्लेख के अनुरूप है।
- source_word: וַיִּקְּדוּ
  choice: झुककर
  rationale: קדד शरीर झुकाने की क्रिया बताता है; संयुक्त अभिव्यक्ति में ‘झुककर’ पहली शारीरिक गति को स्पष्ट रखता है।
- source_word: וישתחו
  choice: दण्डवत् किया
  rationale: यह पद किसी श्रेष्ठ व्यक्ति के सामने भूमि तक झुककर सम्मान प्रकट करने को दर्शाता है; ‘दण्डवत् किया’ शारीरिक अभिवादन को व्यक्त करता है, धार्मिक आराधना का दावा नहीं करता।
theological_decisions:
- issue: וישתחו में सम्मान अथवा आराधना का भाव
  choice: दण्डवत् किया
  alternative: आराधना की / प्रणाम किया
  rationale: प्रसंग यूसुफ के सामने सामाजिक और राजकीय सम्मान का है, परमेश्वर की आराधना का नहीं। ‘दण्डवत् किया’ मूल की गहरी शारीरिक मुद्रा बनाए रखता है, जबकि ‘आराधना की’ अनुचित धार्मिक अर्थ जोड़ सकता है और केवल ‘प्रणाम किया’ मुद्रा की तीव्रता घटा सकता है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और कथात्मक है। यूसुफ के लिए ‘आपका’ तथा पिता के लिए आदरसूचक ‘हैं/वे’ रखा गया है। ‘झुककर दण्डवत् किया’ मूल में आए दो निकटवर्ती शारीरिक क्रियापदों को संक्षिप्त और स्वाभाविक हिन्दी में अलग-अलग संकेत देता है।
