- source_word: נֵרְדָה
  choice: हम नीचे जाकर
  rationale: प्रथम पुरुष बहुवचन कोहोर्टेटिव शर्त के परिणाम में संकल्पित कार्य बताता है; हिन्दी में ‘हम नीचे जाकर ... लाएँगे’ स्वाभाविक रूप से इस आशय को व्यक्त करता है।
- source_word: וְנִשְׁבְּרָה
