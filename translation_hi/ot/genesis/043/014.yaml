source:
  edition: WLC
  text: וְ/אֵ֣ל שַׁדַּ֗י יִתֵּ֨ן לָ/כֶ֤ם רַחֲמִים֙ לִ/פְנֵ֣י הָ/אִ֔ישׁ וְ/שִׁלַּ֥ח לָ/כֶ֛ם אֶת אֲחִי/כֶ֥ם אַחֵ֖ר וְ/אֶת בִּנְיָמִ֑ין וַ/אֲנִ֕י כַּ/אֲשֶׁ֥ר שָׁכֹ֖לְתִּי שָׁכָֽלְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/014.yaml
  text: May God Almighty grant you mercy before the man[a], so that he may send back your other brother and Benjamin. And as for me, if I am bereaved[c][b], I am bereaved.
translation:
  language: hi
  text: सर्वशक्तिमान परमेश्वर उस पुरुष के सामने तुम पर दया करे[a], ताकि वह तुम्हारे दूसरे भाई[b] और बिन्यामीन को तुम्हारे पास वापस भेज दे। और जहाँ तक मेरी बात है, यदि मैं अपनी संतानों से वंचित हो जाऊँ, तो वंचित हो जाऊँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पुरुष के सामने तुम पर करुणा करे।” इब्रानी शब्द दया, करुणा या कोमल सहानुभूति का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “तुम्हारे दूसरे भाई” से आशय शिमोन है, जिसे मिस्र में रोक लिया गया था।
    reason: cross_reference
  - marker: c
    text: या, “जैसे मैं अपनी संतानों से वंचित हुआ हूँ, वैसे ही वंचित हूँ।” इब्रानी में एक ही क्रिया दोहराई गई है, जो याकूब की विवश स्वीकृति को व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: सर्वशक्तिमान परमेश्वर
  rationale: यह अर्थपूर्ण ईश्वरीय उपाधि है। ‘सर्वशक्तिमान परमेश्वर’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा केवल लिप्यंतरण करने के बजाय उपाधि का अर्थ बताता है।
- source_word: יִתֵּן לָכֶם רַחֲמִים
  choice: तुम पर दया करे
  rationale: रַחֲמִים दया, करुणा या कोमल सहानुभूति का बोध करा सकता है। प्रार्थना अथवा मंगलकामना के इस प्रसंग में ‘तुम पर दया करे’ स्वाभाविक हिन्दी है।
- source_word: לִפְנֵי הָאִישׁ
  choice: उस पुरुष के सामने
  rationale: לִפְנֵי का मूल अर्थ ‘के सामने/की उपस्थिति में’ है। ‘उस पुरुष’ पहले से उल्लिखित मिस्री अधिकारी की ओर संकेत करता है और इब्रानी अभिव्यक्ति को बनाए रखता है।
- source_word: וְשִׁלַּח לָכֶם
  choice: ताकि वह ... तुम्हारे पास वापस भेज दे
  rationale: यह पहले व्यक्त कामना की अगली कड़ी है। प्रसंग से लौटाकर भेजने का भाव स्पष्ट है; ‘तुम्हारे पास’ לָכֶם को सहज हिन्दी में व्यक्त करता है।
- source_word: אֶת אֲחִיכֶם אַחֵר
  choice: तुम्हारे दूसरे भाई
  rationale: אַחֵר यहाँ ‘दूसरे’ भाई को बिन्यामीन से अलग करता है; प्रसंग में वह शिमोन है।
- source_word: וַאֲנִי
  choice: और जहाँ तक मेरी बात है
  rationale: सर्वनाम के बलाघात और पुत्रों के विषय से याकूब की अपनी स्थिति की ओर हुए मोड़ को स्पष्ट करता है।
- source_word: כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי
  choice: यदि मैं अपने बच्चों से वंचित हुआ, तो वंचित हुआ
  rationale: שׁכל संतान खोने या संतान-विहीन हो जाने को व्यक्त करता है। क्रिया की पुनरावृत्ति को बनाए रखते हुए यह याकूब की विवश स्वीकृति दर्शाता है; ‘अपने बच्चों से’ निहित कर्म को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֵל שַׁדַּי का अनुवाद
  choice: सर्वशक्तिमान परमेश्वर
  alternative: एल शद्दाई
  rationale: नाम का केवल लिप्यंतरण करने के बजाय उपाधि का अर्थ देना साधारण हिन्दी पाठक के लिए स्पष्ट है। ‘सर्वशक्तिमान’ पारंपरिक और सम्भाव्य अर्थ है, यद्यपि שַׁדַּי की व्युत्पत्ति पूरी तरह निश्चित नहीं है।
- issue: याकूब के अंतिम कथन में काल और भाव
  choice: यदि मैं अपने बच्चों से वंचित हुआ, तो वंचित हुआ
  alternative: जैसे मैं वंचित हुआ हूँ, वैसे ही वंचित हूँ
  rationale: इब्रानी כַּאֲשֶׁר का शाब्दिक अर्थ ‘जैसे/जब’ हो सकता है, पर इस प्रसंग में पुनरुक्त क्रिया सम्भावित हानि के प्रति दृढ़, विवश समर्पण व्यक्त करती है। ‘यदि...तो...’ इस भाव को स्वाभाविक हिन्दी में रखता है और पुनरावृत्ति भी बचाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘पुरुष’ स्रोत के הָאִישׁ को औपचारिक रूप से सुरक्षित रखता है; ‘आदमी’ अधिक बोलचाल का विकल्प होता। वाक्य में प्रार्थनात्मक कामना और अंत में याकूब की भावपूर्ण विवशता दोनों को बनाए रखा गया है।
