  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘अपने सामने से’ मूल इब्रानी बिंब को सुरक्षित रखता है, जबकि पादटिप्पणी उसका सांस्कृतिक आशय स्पष्ट करती है। ‘नशे में हो गए’ मूल क्रिया की तीव्रता को बिना नरम किए व्यक्त करता है।
