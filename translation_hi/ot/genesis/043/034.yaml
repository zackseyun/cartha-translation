  text: וַ/יִּשָּׂ֨א מַשְׂאֹ֜ת מֵ/אֵ֣ת פָּנָי/ו֮ אֲלֵ/הֶם֒ וַ/תֵּ֜רֶב מַשְׂאַ֧ת בִּנְיָמִ֛ן מִ/מַּשְׂאֹ֥ת כֻּלָּ֖/ם חָמֵ֣שׁ יָד֑וֹת וַ/יִּשְׁתּ֥וּ וַֽ/יִּשְׁכְּר֖וּ עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/034.yaml
  text: He sent portions to them from before him[a], but Benjamin’s portion was five times as much as all of theirs[c][b]. So they drank and became drunk with him.
translation:
  language: hi
  text: उसने अपने सामने से उन्हें भोजन के हिस्से भिजवाए[a], पर बिन्यामीन का हिस्सा बाकी हर एक के हिस्से से पाँच गुना था[b]। तब उन्होंने उसके साथ पीया और नशे में हो गए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके सामने से”; सम्भवतः यूसुफ की मेज़ पर उसके सामने रखे भोजन में से हिस्से भेजे गए।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, “पाँच हाथ”; यह इब्रानी मुहावरा पाँच गुनी मात्रा को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: इस इब्रानी क्रिया का सीधा अर्थ “नशे में हो गए” है; कुछ अनुवाद इसे नरम करके “आनन्दित हुए” कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מַשְׂאֹת
  choice: भोजन के हिस्से भिजवाए
  rationale: भोज के संदर्भ में यह संयुक्त अभिव्यक्ति मेज़ पर बैठे लोगों को भोजन के हिस्से पहुँचवाने को दर्शाती है; केवल शाब्दिक ‘उठाया’ यहाँ स्वाभाविक नहीं होगा।
- source_word: מֵאֵת פָּנָיו
  choice: अपने सामने से
  rationale: यह इब्रानी की ‘उसके मुख/सामने से’ वाली छवि को बनाए रखता है; आशय सम्भवतः यूसुफ के अपने स्थान से भोजन भेजे जाने का है।
- source_word: מַשְׂאַת בִּנְיָמִן
  choice: बिन्यामीन का हिस्सा
  rationale: मूल शब्द भोज में दिए गए भोजन के हिस्से को दर्शाता है।
- source_word: מִמַּשְׂאֹת כֻּלָּם חָמֵשׁ יָדוֹת
  choice: उन सबमें से हर एक के हिस्से का पाँच गुना
  rationale: यह तुलना बिन्यामीन के हिस्से और बाकी प्रत्येक व्यक्ति के हिस्से के बीच स्पष्ट करता है तथा ‘सबके हिस्सों के कुल योग’ का भ्रामक अर्थ नहीं देता।
- source_word: וַיִּשְׁתּוּ
  choice: उन्होंने ... पीया
  rationale: यह भोज में मदिरा पीने की सीधी कथात्मक अभिव्यक्ति है।
- source_word: וַיִּשְׁכְּרוּ
  choice: नशे में हो गए
  rationale: क्रिया सामान्यतः मदहोश या नशे में हो जाने को व्यक्त करती है; इसे केवल ‘आनन्दित हुए’ कहकर नरम नहीं किया गया।
- source_word: עִמּוֹ
  choice: उसके साथ
  rationale: सर्वनाम का संदर्भ यूसुफ से है; हिन्दी में मूल की सर्वनामात्मक अभिव्यक्ति स्वाभाविक और स्पष्ट है।
