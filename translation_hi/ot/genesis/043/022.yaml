base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/022.yaml
  text: And we have brought down other silver in our hands to buy food[c][b][a]. We do not know who put our silver in our sacks.
translation:
  language: hi
  text: और भोजन[b] खरीदने के लिए हम अपने साथ[c] और भी चाँदी[a] नीचे लाए हैं। हम नहीं जानते कि हमारी चाँदी[a] हमारी बोरियों में किसने रख दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पैसे’; हिब्रू शब्द כֶּסֶף का अर्थ धातु के रूप में ‘चाँदी’ और लेन-देन में ‘पैसे’, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अनाज’; यहाँ प्रयुक्त अभिव्यक्ति विशेष रूप से अनाज खरीदने का संकेत दे सकती है, यद्यपि कर्म का शब्द व्यापक रूप से ‘भोजन’ है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘अपने हाथ में’।
    reason: literal_rendering
lexical_decisions:
- source_word: וְ/כֶסֶף אַחֵר
  choice: और भी चाँदी
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ है और प्रसंग में यह भुगतान के पैसे को दर्शाता है। ‘और भी’ אַחֵר के अतिरिक्त मात्रा के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הוֹרַדְנוּ
  choice: लाए हैं
  rationale: हिफ़ील रूप का शाब्दिक अर्थ ‘नीचे ले आए’ है और मिस्र की ओर यात्रा की भौगोलिक दिशा को सूचित करता है; पर इस वाक्य में हिन्दी का स्वाभाविक ‘लाए हैं’ गंतव्य तक साथ लाने का आशय स्पष्ट करता है।
- source_word: בְ/יָדֵ/נוּ
  choice: अपने साथ
  rationale: शाब्दिक ‘हमारे हाथ में’ यहाँ अधिकार या साथ होने का हिब्रू मुहावरा है। ‘अपने साथ’ आधुनिक हिन्दी में उसी अर्थ का सहज समतुल्य है।
- source_word: לִ/שְׁבָּר אֹכֶל
  choice: भोजन खरीदने के लिए
  rationale: שׁבר इस प्रसंग में रसद या अनाज खरीदना है, जबकि אֹכֶל व्यापक रूप से ‘भोजन’ है; इसलिए यह अनुवाद क्रिया और व्यापक कर्म दोनों को संतुलित रखता है।
- source_word: לֹא יָדַעְנוּ
  choice: हम नहीं जानते
  rationale: हिब्रू पूर्ण रूप यहाँ अब तक बनी हुई अज्ञान की अवस्था व्यक्त कर सकता है; प्रत्यक्ष कथन में वर्तमान हिन्दी स्वाभाविक है।
- source_word: מִי שָׂם
  choice: किसने रख दी
  rationale: अप्रत्यक्ष प्रश्न में מִי का सहज रूप ‘किसने’ और שׂים का सामान्य अर्थ ‘रखना’ है। ‘दी’ चाँदी के स्त्रीलिंग और कार्य की पूर्णता के अनुरूप है।
- source_word: בְּ/אַמְתְּחֹתֵי/נוּ
  choice: हमारी बोरियों में
  rationale: אַמְתַּחַת यात्रा में अनाज या सामान रखने की बोरी/थैली है; इस कथा-प्रसंग में ‘बोरियाँ’ स्पष्ट और प्रचलित है।
