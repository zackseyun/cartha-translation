id: GEN.18.32
reference: Genesis 18:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבְּרָ֣ה אַךְ הַ/פַּ֔עַם אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֲשָׂרָ֑ה וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָ/עֲשָׂרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/032.yaml
  text: Then he said[a], “Please, let not my lord be angry, and I will speak only this once more. Perhaps ten will be found there.” And he said[c][b], “I will not destroy it for the sake of the ten.”
translation:
  language: hi
  text: तब उसने कहा, “कृपया मेरे प्रभु क्रोधित न हों; मैं केवल एक बार और बोलूँगा। शायद वहाँ दस मिलें।” उसने कहा, “उन दस के कारण मैं उसका नाश नहीं करूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל נָא יִחַר לַאדֹנָי
  choice: कृपया मेरे प्रभु क्रोधित न हों
  rationale: נָא की विनम्रता को ‘कृपया’ से और חרה के क्रोध-संबंधी मुहावरे को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है। לַאדֹנָי को आदरपूर्ण प्रत्यक्ष संबोधन ‘मेरे प्रभु’ रखा गया है; यहाँ יהוה नाम नहीं है।
- source_word: וַאֲדַבְּרָה אַךְ הַפַּעַם
  choice: मैं केवल एक बार और बोलूँगा
  rationale: सहभावसूचक रूप वक्ता की विनम्र इच्छा/निवेदन को व्यक्त करता है, और אַךְ הַפַּעַם इस अंतिम अवसर की सीमा बताता है।
- source_word: אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה
  choice: शायद वहाँ दस मिलें
  rationale: אוּלַי संभावना व्यक्त करता है। מצא का निफ़अल अर्थ ‘पाए जाएँ/मिलें’ है; हिन्दी में ‘मिलें’ संक्षिप्त और स्वाभाविक है।
- source_word: לֹא אַשְׁחִית
  choice: मैं उसका नाश नहीं करूँगा
  rationale: שׁחת के हिफ़ील का अर्थ यहाँ नष्ट करना है। इब्रानी में कर्म निहित है; हिन्दी की स्पष्टता के लिए प्रसंगगत नगर/स्थान को ‘उसका’ से व्यक्त किया गया है।
- source_word: בַּעֲבוּר הָעֲשָׂרָה
  choice: उन दस के कारण
  rationale: בַּעֲבוּר कारण अथवा किसी के निमित्त कार्रवाई रोकने का भाव देता है। ‘उन दस के कारण’ सामान्य आधुनिक हिन्दी में मध्यस्थता की तर्क-श्रृंखला को स्पष्ट रखता है।
theological_decisions:
- issue: אֲדֹנָי के संबोधन का संदर्भ और रूप
  choice: मेरे प्रभु
  alternative: हे प्रभु / हे मेरे स्वामी
  rationale: व्यापक प्रसंग में वक्ता का संवाद दिव्य आगंतुक से है, फिर भी इस पद में प्रयुक्त शब्द יהוה नहीं है। ‘मेरे प्रभु’ आदरपूर्ण संबोधन को बनाए रखता है और शब्द से अधिक स्पष्ट धर्मवैज्ञानिक पहचान आरोपित नहीं करता।
- issue: לֹא אַשְׁחִית का निहित कर्म
  choice: उसका नाश नहीं करूँगा
  alternative: नाश नहीं करूँगा
  rationale: मूल में कर्म व्यक्त नहीं है, पर प्रसंग से नगर/स्थान समझा जाता है। हिन्दी में ‘उसका’ जोड़ना अर्थ स्पष्ट करता है, बिना संदर्भ को किसी अधिक विशिष्ट नाम तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मेरे प्रभु’ आदरपूर्ण किंतु जानबूझकर व्याख्यात्मक अति-निर्धारण से बचने वाला रूप है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई।
