- issue: הַמְכַסֶּה אֲנִי की प्रश्नात्मक शक्ति
  choice: क्या ... छिपाऊँ?
  alternative: क्या मैं ... छिपा रहा हूँ?
  rationale: कृदन्त को विचारात्मक प्रश्न के रूप में समझना प्रसंग में उपयुक्त है, पर अधिक शाब्दिक वर्तमानकालीन विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
