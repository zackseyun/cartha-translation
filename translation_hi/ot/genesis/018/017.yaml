  rationale: हिब्रू कृदन्त का निकट और स्वाभाविक अनुवाद वर्तमान प्रगतिशील रूप है; निकट भविष्य का आशय संदर्भ से समझा जा सकता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
