language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵֽרֲדָה נָּ֣א וְ/אֶרְאֶ֔ה הַ/כְּ/צַעֲקָתָ֛/הּ הַ/בָּ֥אָה אֵלַ֖/י עָשׂ֣וּ כָּלָ֑ה וְ/אִם לֹ֖א אֵדָֽעָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/021.yaml
  text: I will go down now and see whether they have done altogether according to its outcry that has come to me[a]; and if not[b], I will know.
translation:
  language: hi
  text: मैं अब नीचे उतरकर देखूँगा कि क्या उन्होंने मेरे पास पहुँची उसकी दुहाई के अनुसार पूरी तरह वैसा ही किया है[a]; और यदि नहीं, तो मैं जान लूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या उन्होंने उसके अनुसार पूरी तरह किया है?” इब्रानी में ‘किया’ और ‘पूर्णता’ का यह कठिन मुहावरा जाँचता है कि बताए गए कर्म पहुँची हुई दुहाई के पूरी तरह अनुरूप हैं या नहीं।
    reason: कठिन इब्रानी मुहावरा עָשׂוּ כָּלָה और उसके वैकल्पिक शब्दक्रम/अर्थ-छाया को स्पष्ट करना।
lexical_decisions:
- source_word: אֵרֲדָה נָּא
  choice: मैं अब नीचे उतरकर
  rationale: सहगामी रूप वक्ता के निश्चय या अभिप्राय को व्यक्त करता है, और נָא यहाँ आग्रह से अधिक तात्कालिकता को सूचित करता है।
- source_word: וְאֶרְאֶה
  choice: देखूँगा
  rationale: मूल क्रिया का सामान्य अर्थ ‘देखना’ रखते हुए प्रसंग में जाँचकर वास्तविकता जानने का भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: הַכְּצַעֲקָתָהּ
  choice: उसकी दुहाई के अनुसार
  rationale: צעקה गंभीर अन्याय या संकट से उठी पुकार है। ‘दुहाई’ इस न्याय-संबंधी भाव को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करती है; स्त्रीलिंग प्रत्यय को ‘उसकी’ के रूप में सुरक्षित रखा गया है।
- source_word: הַבָּאָה אֵלַי
  choice: मेरे पास पहुँची
  rationale: कृदन्त पदबंध को स्वाभाविक हिन्दी विशेषणीय रचना में रखा गया है।
- source_word: עָשׂוּ כָּלָה
  choice: उन्होंने पूरी तरह वैसा ही किया है
  rationale: कठिन इब्रानी मुहावरा इस बात की जाँच व्यक्त करता है कि उनके कर्म दुहाई में प्रकट स्थिति से पूरी तरह मेल खाते हैं। हिन्दी में ‘वैसा ही’ तुलना को स्पष्ट करता है, जबकि ‘पूरी तरह’ כָּלָה के पूर्णता-भाव को रखता है।
- source_word: וְאִם לֹא אֵדָעָה
  choice: या नहीं; तब मैं जान लूँगा
  rationale: हिन्दी में ‘या नहीं’ पूर्ववर्ती अप्रत्यक्ष प्रश्न से स्वाभाविक रूप से जुड़ता है। ‘जान लूँगा’ सहगामी रूप के निश्चय और जाँच से निष्कर्ष तक पहुँचने के भाव को व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर का मनुष्य-सदृश रीति से नीचे उतरकर देखना
  choice: ‘नीचे उतरकर देखूँगा’ को यथावत रखा गया
  alternative: इसे ‘मैं जाँच कर न्याय करूँगा’ जैसे अमूर्त कथन में बदलना
  rationale: इब्रानी कथा परमेश्वर की जाँच को मनुष्य-सदृश भाषा में प्रस्तुत करती है। अनुवाद इस धर्मवैचारिक तनाव को सिद्धान्तात्मक व्याख्या से समाप्त नहीं करता।
- issue: ‘मैं जान लूँगा’ और दिव्य सर्वज्ञता का तनाव
  choice: ज्ञान प्राप्त करने की कथात्मक भाषा को सुरक्षित रखा गया
  alternative: ‘मैं इसकी पुष्टि करूँगा’ अथवा ‘मैं प्रकट कर दूँगा’
  rationale: मूल पाठ אֵדָעָה कहता है; सर्वज्ञता के साथ इसका संबंध व्याख्या का विषय है, अनुवाद में उसे चुपचाप हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘दुहाई’ को अन्याय से उठी पुकार के अर्थ में चुना गया है। वाक्य को हिन्दी में स्वाभाविक बनाने के लिए शर्त को अप्रत्यक्ष प्रश्न ‘या नहीं’ में समाहित किया गया है, जबकि मूल की जाँच और ज्ञान की भाषा सुरक्षित है।
