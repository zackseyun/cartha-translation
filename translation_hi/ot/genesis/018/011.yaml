  yaml_path: translation/ot/genesis/018/011.yaml
  text: Abraham and Sarah were old[a], advanced in days; the way of women had ceased to be with Sarah.
translation:
  language: hi
  text: अब्राहम और सारा बूढ़े थे, उनकी आयु बहुत ढल चुकी थी। सारा का स्त्री-धर्म[a] बंद हो चुका था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘स्त्रियों का मार्ग’ है—यह मासिक धर्म के लिए प्रयुक्त एक शालीन मुहावरा है।
    reason: मूल इब्रानी मुहावरे और उसके आशय को स्पष्ट करना।
lexical_decisions:
- source_word: זְקֵנִים
  choice: बूढ़े
  rationale: यह विशेषण अधिक आयु को दर्शाता है; ‘बूढ़े’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: בָּאִים בַּיָּמִים
  choice: उनकी आयु बहुत ढल चुकी थी
  rationale: ‘दिनों में आगे बढ़े हुए’ इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप, जो अत्यधिक वृद्धावस्था बताता है।
- source_word: חָדַל לִהְיוֹת
  choice: बंद हो चुका था
  rationale: חָדַל के ‘रुक जाना/समाप्त हो जाना’ अर्थ और पूर्व में पूरी हो चुकी अवस्था को स्पष्ट करता है।
- source_word: אֹרַח כַּנָּשִׁים
  choice: स्त्री-धर्म
  rationale: यह प्रचलित और शालीन हिन्दी मुहावरा स्त्रियों के मासिक धर्म को व्यक्त करता है, जैसे मूल का शालीन मुहावरा।
- source_word: לְשָׂרָה
  choice: सारा का
  rationale: सम्बन्धसूचक ל को इस हिन्दी मुहावरे के अनुरूप स्वाभाविक सम्बन्ध-रचना में व्यक्त किया गया है।
