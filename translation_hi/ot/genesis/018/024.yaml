source:
  edition: WLC
  text: אוּלַ֥י יֵ֛שׁ חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר הַ/אַ֤ף תִּסְפֶּה֙ וְ/לֹא תִשָּׂ֣א לַ/מָּק֔וֹם לְמַ֛עַן חֲמִשִּׁ֥ים הַ/צַּדִּיקִ֖ם אֲשֶׁ֥ר בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/024.yaml
  text: Suppose there are fifty righteous people within the city[c][b][a]. Will you indeed sweep it away and not spare the place for the sake of the fifty righteous who are within it?
translation:
  language: hi
  text: मान लो कि नगर के भीतर पचास धर्मी लोग हों। क्या तू सचमुच उसे मिटा देगा और उन पचास धर्मियों के कारण, जो उसके भीतर हैं, उस स्थान को नहीं बचाएगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तू सचमुच उसे मिटा देगा और उन पचास धर्मियों के कारण, जो उसके भीतर हैं, उस स्थान को क्षमा नहीं करेगा?”
    reason: נשא यहाँ संदर्भ में ‘बचा देना/बख्श देना’ का अर्थ देता है; ‘क्षमा करना’ एक संभावित वैकल्पिक अर्थ है।
lexical_decisions:
- source_word: אוּלַי
  choice: मान लो कि
  rationale: अब्राहम की विनती में प्रयुक्त संभावित स्थिति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; मूल की अनिश्चितता को ‘शायद’ विकल्प में भी सुरक्षित रखा गया है।
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: पचास धर्मी लोग
  rationale: צַדִּיקִם धर्मी व्यक्तियों को दर्शाता है और यहाँ केवल पुरुषों तक सीमित नहीं है।
- source_word: בְּתוֹךְ הָעִיר
  choice: नगर के भीतर
  rationale: नगर की सीमाओं के अंदर होने का स्थानवाचक अर्थ स्पष्ट और स्वाभाविक रूप से देता है।
- source_word: הַאַף
  choice: सचमुच
  rationale: प्रश्न में निहित जोर और आश्चर्य को आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תִּסְפֶּה
  choice: उसे मिटा देगा
  rationale: न्याय में पूरे नगर को नष्ट कर देने का अर्थ देता है; ‘मिटा देना’ हिन्दी में स्वाभाविक और प्रबल है।
- source_word: וְלֹא תִשָּׂא לַמָּקוֹם
  choice: उस स्थान को नहीं छोड़ेगा
  rationale: विनाश से बचाने के न्यायिक-संदर्भित अर्थ को व्यक्त करता है, जबकि क्षमा के संभावित अर्थ को पादटिप्पणी में सुरक्षित रखता है।
- source_word: לְמַעַן
  choice: के कारण
  rationale: धर्मियों की उपस्थिति को नगर छोड़ देने का आधार बताता है।
- source_word: אֲשֶׁר בְּקִרְבָּהּ
  choice: जो उसके भीतर हैं
  rationale: मूल के स्पष्ट संबंधवाचक उपवाक्य और नगर के मध्य उपस्थित होने के भाव को बनाए रखता है।
theological_decisions:
- issue: נשא का अर्थ וְלֹא תִשָּׂא לַמָּקוֹם में
  choice: विनाश से छोड़ना/बचा देना
  alternative: उस स्थान को क्षमा करना
  rationale: निकट संदर्भ नगर को मिटा देने और ऐसा न करने के बीच विरोध रखता है। इसलिए मुख्य पाठ में विनाश से छोड़ने का अर्थ उपयुक्त है, पर ‘क्षमा करना’ मूल क्रिया की वास्तविक अर्थ-संभावना है और पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; अब्राहम द्वारा परमेश्वर को संबोधन के अनुरूप एकवचन ‘तू’ रखा गया है। भाषा सम्मानपूर्ण और सहज है, तथा मुख्य पाठ न्याय से बचाने का संदर्भगत अर्थ देता है।
