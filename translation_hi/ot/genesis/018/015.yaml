  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תְּכַחֵ֨שׁ שָׂרָ֧ה לֵ/אמֹ֛ר לֹ֥א צָחַ֖קְתִּי כִּ֣י יָרֵ֑אָה וַ/יֹּ֥אמֶר לֹ֖א כִּ֥י צָחָֽקְתְּ׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/015.yaml
  text: But Sarah denied it[a], saying, “I did not laugh,” because she was afraid. But he said, “No[b], but you did laugh.”
translation:
  language: hi
  text: पर सारा ने यह कहकर इनकार किया[a], “मैं नहीं हँसी,” क्योंकि वह डर गई थी। पर उसने कहा, “नहीं[b], तुम हँसी थीं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारा ने झूठ कहा”; इब्रानी क्रिया का अर्थ किसी बात से इनकार करना या असत्य कहना हो सकता है। यहाँ सारा अपने हँसने से इनकार करती है।
    reason: lexical_alternative
  - marker: b
    text: इस उपवाक्य में वक्ता का नाम स्पष्ट रूप से नहीं दिया गया है; आसपास के प्रसंग से उसकी पहचान यहोवा के रूप में होती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכַחֵשׁ
  choice: इनकार किया
  rationale: पिएल रूप यहाँ कही गई बात को नकारने का अर्थ देता है और असत्य बोलने का भाव भी रख सकता है। मुख्य पाठ में ‘इनकार किया’ प्रसंग के अनुरूप स्वाभाविक है तथा नैतिक अर्थ को आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: לֵאמֹר
  choice: यह कहकर
  rationale: यह प्रत्यक्ष कथन का परिचय देने वाला मानक उद्धरणात्मक प्रयोग है; हिंदी में ‘यह कहकर’ वाक्य के प्रवाह में स्वाभाविक है।
- source_word: לֹא צָחַקְתִּי
  choice: मैं नहीं हँसी
  rationale: निषेध के साथ प्रथम पुरुष स्त्रीलिंग कथन का सीधा और स्वाभाविक हिंदी रूप।
- source_word: כִּי יָרֵאָה
  choice: क्योंकि वह डर गई थी
  rationale: כִּי यहाँ सारा के इनकार का कारण बताता है। क्रिया की पूर्ण घटना को ‘डर गई थी’ सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: וַיֹּאמֶר
  choice: पर उसने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘पर’ सारा के इनकार और अगले प्रत्युत्तर के बीच विरोध स्पष्ट करता है।
- source_word: לֹא כִּי צָחָקְתְּ
  choice: नहीं, तुम हँसी थी
  rationale: आरंभिक לֹא सारा के कथन को अस्वीकार करता है और כִּי उसके बाद वास्तविकता पर बल देता है। हिंदी में यह संक्षिप्त प्रत्युत्तर मूल का प्रतिवाद सुरक्षित रखता है।
theological_decisions:
- issue: וַיֹּאמֶר में वक्ता की पहचान
  choice: ‘उसने कहा’ रखकर वक्ता का नाम इस उपवाक्य में न जोड़ना
  alternative: ‘यहोवा ने कहा’ अथवा ‘उन पुरुषों में से एक ने कहा’
  rationale: इस उपवाक्य में कर्ता का नाम दोबारा नहीं आया; केवल पुल्लिंग एकवचन क्रिया है। आसपास का प्रसंग वक्ता को यहोवा से जोड़ता है, पर पद स्वयं नाम नहीं दोहराता, इसलिए अनावश्यक विशिष्टता नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। स्त्री वक्ता के कारण ‘हँसी’ और सारा की मनःस्थिति के लिए ‘डर गई थी’ प्रयुक्त हैं। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
