  yaml_path: translation/ot/genesis/018/005.yaml
  text: And let me bring a morsel of bread[a], so that you may refresh your hearts; after that you may pass on, since this is why you have passed by your servant. And they said, “Yes[b], do as you have said.”
translation:
  language: hi
  text: “मैं थोड़ा-सा भोजन ले आता हूँ[a], ताकि आप अपना जी ताज़ा कर लें; उसके बाद आप आगे बढ़ जाइए, क्योंकि आप इसी कारण इस सेवक के यहाँ आए हैं।” उन्होंने कहा, “ठीक है, जैसा तुमने कहा है वैसा ही करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “रोटी का एक टुकड़ा।” आतिथ्य के इस प्रसंग में यह एक विनम्र अल्पोक्ति है।
    reason: lexical_alternative
