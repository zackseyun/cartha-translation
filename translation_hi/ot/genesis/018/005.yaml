- source_word: פַת לֶחֶם
  choice: थोड़ा-सा भोजन
  rationale: शाब्दिक अर्थ ‘रोटी का एक टुकड़ा’ है, पर आतिथ्य के प्रसंग में यह विनम्र अल्पोक्ति है; ‘थोड़ा-सा भोजन’ स्वाभाविक हिन्दी में उसके आशय को व्यक्त करता है।
- source_word: וְסַעֲדוּ לִבְּכֶם
  choice: ताकि आप अपना जी ताज़ा कर लें
  rationale: इब्रानी मुहावरा शाब्दिक रूप से हृदय को सहारा/बल देने की बात करता है और भोजन से तरोताज़ा होने को सूचित करता है; ‘जी ताज़ा कर लें’ कुछ मूल बिंब रखते हुए सहज है।
- source_word: אַחַר תַּעֲבֹרוּ
  choice: उसके बाद आप आगे बढ़ जाइए
  rationale: यहाँ עבר यात्रा जारी रखने को दर्शाता है; विनम्र आज्ञार्थक हिन्दी प्रसंग के अनुरूप है।
- source_word: כִּי עַל כֵּן
  choice: क्योंकि इसी कारण
  rationale: संयोजन अब्राहम की पेशकश का कारण बताता है; हिन्दी में संक्षिप्त और स्पष्ट रूप।
- source_word: עֲבַרְתֶּם עַל עַבְדְּכֶם
  choice: आप अपने सेवक के पास से होकर निकले हैं
  rationale: ‘पास से होकर निकलना’ עבר और यात्रा-संदर्भ को सीधे रखता है; ‘अपने सेवक’ अब्राहम की विनम्र आत्म-संज्ञा है।
- source_word: כֵּן תַּעֲשֶׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: ठीक है, जैसा तुमने कहा है वैसा ही करो
  rationale: उत्तर संक्षिप्त सहमति है; यह हिन्दी में उसकी स्वीकृति और निर्देश दोनों को स्वाभाविक ढंग से व्यक्त करता है।
