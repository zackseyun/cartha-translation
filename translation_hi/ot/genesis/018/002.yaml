  text: וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים נִצָּבִ֖ים עָלָ֑י/ו וַ/יַּ֗רְא וַ/יָּ֤רָץ לִ/קְרָאתָ/ם֙ מִ/פֶּ֣תַח הָ/אֹ֔הֶל וַ/יִּשְׁתַּ֖חוּ אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/002.yaml
  text: He lifted up his eyes and looked[a], and behold, three men were standing near him. When he saw them[b], he ran from the entrance of the tent to meet them and bowed down to the ground.
translation:
  language: hi
  text: उसने आँखें उठाकर देखा, और देखो, तीन पुरुष उसके पास खड़े थे।[a] उन्हें देखते ही वह तंबू के द्वार से उनसे मिलने दौड़ा और भूमि पर झुककर दण्डवत किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके बिलकुल पास खड़े थे’; हिब्रू संबंधबोधक शब्द बहुत निकट होने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘भूमि पर साष्टांग हो गया।’ यह क्रिया गहरे सम्मान की मुद्रा बताती है; अपने आप इसका अर्थ ‘आराधना की’ होना आवश्यक नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: उसने आँखें उठाकर
  rationale: हिब्रू मुहावरे की सजीवता बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וַיַּרְא
  choice: देखा / उन्हें देखते ही
  rationale: पहली बार क्रिया को सीधे ‘देखा’ कहा गया है; दूसरी बार उसी क्रिया को प्रसंगानुकूल ‘उन्हें देखते ही’ कहा गया है, जिससे क्रियाओं का समय-संबंध स्वाभाविक रूप से व्यक्त होता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह कथात्मक संकेत सामने आए दृश्य को सजीव और ध्यानाकर्षक बनाता है; ‘और देखो’ उसके बल को बनाए रखता है।
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: तीन पुरुष
  rationale: हिब्रू में स्पष्ट रूप से तीन पुरुषों का उल्लेख है; यह चयन स्रोत के लिंग-सूचक अर्थ को सुरक्षित रखता है।
- source_word: נִצָּבִים עָלָיו
  choice: उसके पास खड़े थे
  rationale: यहाँ संबंधबोधक शब्द निकटता या साथ खड़े होने का भाव दे सकता है। ‘पास’ प्रसंग में स्वाभाविक है और अनावश्यक रूप से उनके उसके ऊपर मंडराने का अर्थ नहीं देता।
- source_word: וַיָּרָץ לִקְרָאתָם
  choice: वह ... उनसे मिलने दौड़ा
  rationale: मूल क्रिया सचमुच दौड़ने को व्यक्त करती है; इससे अब्राहम की तत्परता और ठोस क्रिया बनी रहती है।
- source_word: מִפֶּתַח הָאֹהֶל
  choice: तंबू के द्वार से
  rationale: ‘द्वार’ तंबू के प्रवेश-स्थान के लिए संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: וַיִּשְׁתַּחוּ אָרְצָה
  choice: भूमि तक झुक गया
  rationale: यह शारीरिक रूप से गहराई से झुकने या दण्डवत होने की मुद्रा व्यक्त करता है, पर अपने आप इसे धार्मिक आराधना घोषित नहीं करता।
theological_decisions:
- issue: क्या अब्राहम की मुद्रा को किसी दिव्य व्यक्ति की आराधना के रूप में अनूदित किया जाए
  choice: ‘भूमि तक झुक गया’
  alternative: ‘आराधना की’ या ‘दण्डवत किया’
  rationale: हिब्रू क्रिया मनुष्यों अथवा परमेश्वर के सामने आदरपूर्वक झुकने के लिए प्रयुक्त हो सकती है। इस पद में पात्र अभी ‘तीन पुरुष’ कहे गए हैं; इसलिए ‘आराधना की’ कहना उस धार्मिक अर्थ को समय से पहले निश्चित कर देगा जिसे यह पद स्वयं स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, कथात्मक और गरिमापूर्ण शैली रखी गई है। ‘और देखो’ से मूल का ध्यानाकर्षक कथात्मक बल बचाया गया है। धार्मिक अर्थ को पहले से निर्धारित करने वाले ‘आराधना की’ से परहेज़ किया गया है।
