id: GEN.18.31
reference: Genesis 18:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הִנֵּֽה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֶשְׂרִ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָֽ/עֶשְׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/031.yaml
  text: Then he said[a], “See now, I have undertaken to speak to my Lord. Perhaps twenty will be found there.” And he said[b], “I will not destroy it for the sake of the twenty.”
translation:
  language: hi
  text: तब उसने कहा, “देखिए, मैंने अपने प्रभु से बोलने का साहस किया है। शायद वहाँ बीस मिलें।” तब उसने कहा, “उन बीस के कारण मैं उसका नाश नहीं करूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: देखिए
  rationale: दोनों अव्यय मिलकर विनम्रतापूर्वक ध्यान आकर्षित करते हैं। आधुनिक आदरसूचक ‘देखिए’ इस विनय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הוֹאַלְתִּי
  choice: मैंने ... साहस किया है
  rationale: यहाँ क्रिया अब्राहम के संकोच और फिर भी बोलने का दुस्साहस/साहस करने को व्यक्त करती है; यह केवल ‘आरम्भ किया’ से अधिक उपयुक्त है।
- source_word: לְדַבֵּר אֶל אֲדֹנָי
  choice: अपने प्रभु से बोलने
  rationale: ‘से बोलना’ मूल वाक्यांश का सीधा और स्वाभाविक रूप है। ‘प्रभु’ दिव्य संबोधन को दर्शाता है, जबकि ‘अपने’ प्रथम पुरुष संबंध को हिन्दी में सहज बनाता है।
- source_word: אוּלַי
  choice: शायद
  rationale: यह अब्राहम की विनम्र, अनिश्चित संभावना को सामान्य आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: יִמָּצְאוּן שָׁם עֶשְׂרִים
  choice: वहाँ बीस मिलें
  rationale: हिब्रू का निफ़अल भाव हिन्दी में ‘मिलें’ द्वारा स्वाभाविक रूप से व्यक्त होता है; संदर्भ से समझ आता है कि आशय बीस धर्मी लोगों से है, पर मूल की तरह संज्ञा को जोड़ा नहीं गया।
- source_word: לֹא אַשְׁחִית
  choice: मैं उसका नाश नहीं करूँगा
  rationale: हिफ़ईल क्रिया विनाश करने को व्यक्त करती है। हिन्दी में आवश्यक कर्म ‘उसका’ संदर्भित नगर/स्थान की ओर संकेत करता है।
- source_word: בַּעֲבוּר הָעֶשְׂרִים
  choice: उन बीस के कारण
  rationale: यह विशिष्ट बीस व्यक्तियों के कारण स्थान को नष्ट न करने की तर्क-श्रृंखला और हिब्रू निश्चित लेख दोनों को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: अब्राहम के संबोधन אֲדֹנָי का अनुवाद
  choice: अपने प्रभु
  alternative: अपने स्वामी
  rationale: व्यापक प्रसंग में संबोधित व्यक्ति दिव्य वार्ताकार है। ‘प्रभु’ उपाधि को व्यक्त करता है, पर इस पद में अनुपस्थित परमेश्वर के वाचा-नाम को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, आदरसूचक और गरिमापूर्ण रखी गई है। अब्राहम के विनम्र साहस को ‘देखिए’ और ‘साहस किया है’ से व्यक्त किया गया है। ‘बीस धर्मी’ स्पष्ट करके नहीं जोड़ा गया, ताकि मूल पाठ की संक्षिप्तता बनी रहे।
