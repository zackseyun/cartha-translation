source:
  edition: WLC
  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבֵּ֔רָה אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם שְׁלֹשִׁ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה אִם אֶמְצָ֥א שָׁ֖ם שְׁלֹשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/030.yaml
  text: Then he said[a], “Please, let not my Lord be angry, and I will speak. Perhaps thirty will be found there.” And he said, “I will not do it if I find thirty there.”
translation:
  language: hi
  text: तब उसने कहा, “हे मेरे प्रभु[a], कृपया क्रोध न करें; मुझे बोलने दें। हो सकता है कि वहाँ तीस लोग मिलें।” उसने कहा, “यदि मुझे वहाँ तीस मिलें, तो मैं ऐसा नहीं करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे स्वामी।” इब्रानी उपाधि को आदरपूर्ण संबोधन के रूप में भी समझा जा सकता है; यहाँ संदर्भ के कारण “प्रभु” रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: कृपया क्रोध न करें
  rationale: निषेध אַל, विनय-सूचक נָא और ‘भड़कना’ अर्थ वाले חרה का यह संयोजन क्रोध न करने की विनम्र प्रार्थना व्यक्त करता है। आधुनिक हिन्दी में यह स्वाभाविक और आदरपूर्ण है।
- source_word: לַאדֹנָי
  choice: हे मेरे प्रभु
  rationale: यह रूप प्रथम पुरुष एकवचन प्रत्यय सहित ‘मेरे स्वामी/प्रभु से’ है। प्रत्यक्ष संबोधन को हिन्दी में ‘हे मेरे प्रभु’ स्वाभाविक रूप से व्यक्त करता है और यहाँ कोई व्यक्तिवाचक दिव्य नाम नहीं जोड़ता।
- source_word: וַאֲדַבֵּרָה
  choice: मुझे बोलने दें
  rationale: कोहोर्टेटिव रूप आगे बोलने की विनम्र इच्छा अथवा अनुमति की प्रार्थना दर्शाता है; ‘मुझे बोलने दें’ उस भाव को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: אוּלַי
  choice: हो सकता है कि
  rationale: यह संभावना और संकोचपूर्ण अनुमान व्यक्त करता है, जो अब्राहम की विनम्र मध्यस्थता के स्वर के अनुकूल है।
- source_word: יִמָּצְאוּן
  choice: मिलें
  rationale: מצא का निफ़अल रूप यहाँ ‘पाए जाएँ/मिलें’ का भाव देता है। हिन्दी में ‘वहाँ तीस लोग मिलें’ स्वाभाविक रूप से उसी निष्क्रिय-संभाव्य अर्थ को व्यक्त करता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: साधारण स्थानवाचक क्रियाविशेषण का सीधा हिन्दी समतुल्य।
- source_word: שְׁלֹשִׁים
  choice: तीस
  rationale: मूल संख्या का सीधा अनुवाद; संदर्भ के कारण पहली उक्ति में ‘लोग’ स्पष्ट किया गया है।
- source_word: לֹא אֶעֱשֶׂה
  choice: मैं ऐसा नहीं करूँगा
  rationale: इब्रानी में कर्म निहित है और संदर्भ नगर पर न्यायकारी विनाश न करने का है। ‘ऐसा’ संक्षिप्तता बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: אִם אֶמְצָא
  choice: यदि मुझे ... मिलें
  rationale: सामान्य शर्तसूचक रचना को स्पष्ट आधुनिक हिन्दी में प्रस्तुत करता है; हिन्दी की संरचना के अनुसार कर्ता-संबंध ‘मुझे’ से व्यक्त हुआ है।
theological_decisions:
- issue: अब्राहम के संबोधन में אֲדֹנָי का अनुवाद
  choice: मेरे प्रभु
  alternative: मेरे स्वामी
  rationale: इस ईश्वरीय प्रकटाव के संदर्भ में संबोधन का लक्ष्य प्रभु समझा जाता है, इसलिए ‘प्रभु’ उपयुक्त है। फिर भी इब्रानी पद आदरपूर्ण मानवीय संबोधन भी हो सकता है; इस वास्तविक भाषिक अस्पष्टता को पादटिप्पणी में रखा गया है। वाचा का दिव्य नाम यहाँ नहीं है, इसलिए उसे अनुवाद में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। अब्राहम की विनम्रता ‘कृपया’ और ‘मुझे बोलने दें’ से व्यक्त होती है। ‘तीस लोग’ में ‘लोग’ संदर्भ से स्पष्ट पूर्ति है; उत्तर में मूल की संक्षिप्तता के अनुरूप केवल ‘तीस’ रखा गया है।
