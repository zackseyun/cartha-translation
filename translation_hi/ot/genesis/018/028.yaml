id: GEN.18.28
reference: Genesis 18:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: א֠וּלַי יַחְסְר֞וּ/ן חֲמִשִּׁ֤ים הַ/צַּדִּיקִם֙ חֲמִשָּׁ֔ה הֲ/תַשְׁחִ֥ית בַּ/חֲמִשָּׁ֖ה אֶת כָּל הָ/עִ֑יר וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית אִם אֶמְצָ֣א שָׁ֔ם אַרְבָּעִ֖ים וַ/חֲמִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/028.yaml
  text: Suppose five of the fifty righteous are lacking—will you destroy the whole city for five? And he said[c][b][a], “I will not destroy it if I find forty-five there.”
translation:
  language: hi
  text: यदि पचास धर्मियों की संख्या पाँच कम निकले, तो क्या तू उन पाँच के कारण पूरे नगर को नष्ट कर देगा? उसने कहा, “यदि मुझे वहाँ पैंतालीस मिलें, तो मैं उसे नष्ट नहीं करूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלַי
  choice: यदि … कम निकले
  rationale: यह अब्राहम की काल्पनिक शर्त को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ אוּלַי का भाव ‘मान लीजिए/यदि ऐसा हो’ है।
- source_word: יַחְסְרוּן חֲמִשִּׁים הַצַּדִּיקִם חֲמִשָּׁה
  choice: पचास धर्मियों की संख्या पाँच कम निकले
  rationale: हिब्रू में अपेक्षित पचास की संख्या में पाँच की कमी का भाव है। यह हिन्दी रूप इस अर्थ को स्पष्ट रखता है और पाँच विशिष्ट लोगों के अनुपस्थित होने का भ्रम नहीं पैदा करता।
- source_word: הַצַּדִּיקִם
  choice: धर्मी
  rationale: צַדִּיק के नैतिक और न्याय-संबंधी अर्थ को बनाए रखने वाला परिचित बाइबलीय हिन्दी शब्द।
- source_word: הֲתַשְׁחִית
  choice: क्या तू … नष्ट कर देगा
  rationale: שׁחת के हिफ़ील रूप का सीधा अर्थ ‘नष्ट करना’ है; प्रश्न की प्रत्यक्षता और अगले वाक्य में उसी क्रिया की पुनरावृत्ति सुरक्षित रहती है।
- source_word: בַּחֲמִשָּׁה
  choice: उन पाँच के कारण
  rationale: בְּ यहाँ कारण अथवा आधार दर्शाता है। ‘उन पाँच के कारण’ अपेक्षित संख्या में पाँच की कमी की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: אֶת כָּל הָעִיר
  choice: पूरे नगर को
  rationale: नगर की सम्पूर्णता को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לֹא אַשְׁחִית
  choice: मैं उसे नष्ट नहीं करूँगा
  rationale: प्रश्न में प्रयुक्त उसी मूल क्रिया को दोहराता है; ‘उसे’ का संकेत नगर की ओर है।
- source_word: אִם אֶמְצָא שָׁם אַרְבָּעִים וַחֲמִשָּׁה
  choice: यदि मुझे वहाँ पैंतालीस मिलें
  rationale: हिब्रू की शर्त और स्थानसूचक ‘वहाँ’ को रखते हुए आधुनिक हिन्दी की स्वाभाविक शब्द-रचना अपनाई गई है।
theological_decisions:
- issue: צַדִּיקִים का अनुवाद
  choice: धर्मी
  alternative: न्यायी
  rationale: ‘धर्मी’ इस प्रसंग में शब्द के व्यापक नैतिक और न्यायिक भार को बनाए रखता है; ‘न्यायी’ आधुनिक हिन्दी में मुख्यतः न्याय करने वाले व्यक्ति का अर्थ दे सकता है।
- issue: पाँच की कमी का आशय
  choice: पचास धर्मियों की अपेक्षित संख्या पाँच कम होना
  alternative: पचास में से पाँच विशिष्ट धर्मियों का अनुपस्थित होना
  rationale: हिब्रू वाक्य-विन्यास संख्या पचास में पाँच की कमी बताता है, न कि आवश्यक रूप से किसी पहचाने हुए समूह के पाँच सदस्यों की अनुपस्थिति।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। संवाद में परमेश्वर के लिए ‘तू’ रखा गया है, क्योंकि मूल हिब्रू में एकवचन प्रत्यक्ष संबोधन है और हिन्दी बाइबल-परंपरा में प्रार्थनात्मक संबोधन के रूप में यह स्वाभाविक है।
