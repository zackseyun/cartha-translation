  text: Then they said to him[a], “Where is Sarah your wife?” And he said, “There, in the tent.”
translation:
  language: hi
  text: तब उन्होंने उससे पूछा, “तुम्हारी पत्नी सारा कहाँ है?” उसने कहा, “देखो, वह तंबू में है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब उन्होंने पूछा
  rationale: बहुवचन क्रिया और कथानक के क्रम को स्वाभाविक हिन्दी में व्यक्त करता है; प्रश्नवाचक संवाद होने के कारण ‘पूछा’ प्रसंगानुकूल है।
- source_word: אֵלָיו
  choice: उससे
  rationale: अब्राहम की ओर संबोधन को सहज हिन्दी में व्यक्त करता है।
- source_word: אַיֵּה
  choice: कहाँ है
  rationale: स्थान पूछने वाले प्रश्नवाचक अव्यय का सामान्य हिन्दी रूप।
- source_word: שָׂרָה אִשְׁתֶּךָ
  choice: तुम्हारी पत्नी सारा
  rationale: नाम और वैवाहिक संबंध दोनों को स्पष्ट रखते हुए हिन्दी की स्वाभाविक पद-रचना अपनाई गई है।
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: एकवचन उत्तरदाता अब्राहम है; हिन्दी में संयोजक दोहराए बिना कथानक स्वाभाविक रहता है।
- source_word: הִנֵּה בָאֹהֶל
  choice: वहाँ, तंबू में
  rationale: הִנֵּה के संकेतात्मक बल और संक्षिप्त इब्रानी उत्तर को बनाए रखता है; ‘वह तंबू में है’ अर्थ स्पष्ट करता, पर मूल में निहित कर्ता और क्रिया को अनावश्यक रूप से स्पष्ट कर देता।
