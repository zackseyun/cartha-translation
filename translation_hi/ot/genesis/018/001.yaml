  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה בְּ/אֵלֹנֵ֖י מַמְרֵ֑א וְ/ה֛וּא יֹשֵׁ֥ב פֶּֽתַח הָ/אֹ֖הֶל כְּ/חֹ֥ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/001.yaml
  text: And Yahweh appeared to him by the oaks of Mamre[a], while he was sitting at the entrance of the tent in the heat of the day.
translation:
  language: hi
  text: याहवे मम्रे के बड़े वृक्षों के पास[a] उसे दिखाई दिए, जब वह दिन की गरमी में तंबू के प्रवेश-द्वार पर बैठा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मम्रे के बलूतों के पास” अथवा “मम्रे के तेरबिन्थ वृक्षों के पास।” इब्रानी शब्द बलूत या तेरबिन्थ जैसे बड़े वृक्षों का संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: दर्शन दिया
  rationale: निफ़ाल रूप यहाँ दृश्य रूप से प्रकट होने का भाव देता है। हिंदी बाइबलीय गद्य में ‘दर्शन दिया’ स्वाभाविक और गरिमापूर्ण है तथा ‘अपने आप को प्रकट किया’ की अपेक्षा ठोस दृश्य अर्थ बनाए रखता है।
- source_word: אֵלָיו
  choice: उसे
  rationale: पूर्वसर्ग और तृतीय पुरुष एकवचन प्रत्यय का सीधा अनुवाद है; संदर्भ में यह अब्राहम की ओर संकेत करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह उपाधि से बदलने के बजाय चतुरक्षरीय व्यक्तिगत नाम का देवनागरी लिप्यंतरण है।
- source_word: בְּאֵלֹנֵי
  choice: बड़े पेड़ों के पास
  rationale: אֵלוֹן की सटीक वृक्ष-प्रजाति अनिश्चित है और इसका अर्थ बलूत या बुतुम जैसे बड़े वृक्ष हो सकता है। मुख्य पाठ में सामान्य अर्थ रखने से अनिश्चितता को किसी एक प्रजाति के पक्ष में नहीं सुलझाया जाता।
- source_word: מַמְרֵא
  choice: मम्रे
  rationale: व्यक्तिवाचक स्थान-नाम का प्रचलित देवनागरी लिप्यंतरण।
- source_word: וְהוּא יֹשֵׁב
  choice: उस समय वह ... बैठा हुआ था
  rationale: इब्रानी कृदंत दृश्य की पृष्ठभूमि और साथ-साथ चल रही परिस्थिति बताता है; यह हिंदी में उसी संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פֶּתַח הָאֹהֶל
  choice: तंबू के द्वार पर
  rationale: פֶּתַח किसी खुले स्थान, प्रवेश या द्वार को बताता है; ‘तंबू के द्वार पर’ ठोस और सहज हिंदी है।
- source_word: כְּחֹם הַיּוֹם
  choice: दिन की गरमी में
  rationale: मूल मुहावरे का निकट और स्वाभाविक अनुवाद है; यह समय को अनावश्यक रूप से ठीक दोपहर नहीं ठहराता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: प्रकट होने की क्रिया का स्वरूप
  choice: दर्शन दिया
  alternative: अपने आप को प्रकट किया; दिखाई दिया
  rationale: ‘दर्शन दिया’ दृश्य अभिव्यक्ति को बनाए रखता है, पर इस पद में प्रकट रूप या आगंतुकों की पहचान के विषय में आगे की कथा से अधिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘बड़े पेड़ों’ से वृक्ष-प्रजाति की वास्तविक शब्दार्थगत अनिश्चितता मुख्य पाठ में सुरक्षित रहती है; अधिक विशिष्ट विकल्प पादटिप्पणी में दिए गए हैं।
