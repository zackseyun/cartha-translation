source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה זַעֲקַ֛ת סְדֹ֥ם וַ/עֲמֹרָ֖ה כִּי רָ֑בָּה וְ/חַ֨טָּאתָ֔/ם כִּ֥י כָבְדָ֖ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/020.yaml
  text: Then Yahweh said[a], “The outcry against Sodom and Gomorrah is great[b], and their sin is very severe.”
translation:
  language: hi
  text: तब याहवे ने कहा, “सदोम और अमोरा के विरुद्ध उठी पुकार[a] बहुत बड़ी है, और उनका पाप बहुत गंभीर[b] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सदोम और अमोरा की पुकार।” इब्रानी का अधिक शब्दशः अनुवाद ऐसा हो सकता है; मुख्य पाठ सन्दर्भ के अनुसार स्पष्ट करता है कि पुकार उनके विरुद्ध उठी थी।
    reason: lexical_alternative
  - marker: b
    text: या “उनका पाप बहुत भारी है।” इब्रानी में शाब्दिक रूप से पाप के ‘बहुत भारी’ होने की बात है—यह उसकी अत्यधिक गंभीरता बताने वाला मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: זַעֲקַת
  choice: के विरुद्ध उठी पुकार
  rationale: זְעָקָה अन्याय या घोर बुराई के कारण उठने वाली पुकार या फरियाद को सूचित कर सकता है। सन्दर्भ में पुकार सदोम और अमोरा के विषय में उनके विरुद्ध उठी है; हिन्दी में ‘के विरुद्ध उठी पुकार’ यह निहित सम्बन्ध स्पष्ट और स्वाभाविक बनाता है।
- source_word: סְדֹם וַעֲמֹרָה
  choice: सदोम और अमोरा
  rationale: इन स्थान-नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं।
- source_word: כִּי רָבָּה
  choice: बहुत बड़ी है
  rationale: स्त्रीलिंग एकवचन विशेषण זַעֲקַת से मेल खाता है और पुकार की व्यापकता या तीव्रता व्यक्त करता है।
- source_word: וְחַטָּאתָם
  choice: और उनका पाप
  rationale: एकवचन संज्ञा बहुवचन सम्बन्धसूचक प्रत्यय के साथ लोगों के सामूहिक दुष्कर्म को दर्शाती है; ‘उनका पाप’ इसे सीधे व्यक्त करता है।
- source_word: כִּי כָבְדָה מְאֹד
  choice: बहुत गंभीर है
  rationale: כבד का मूल अर्थ ‘भारी होना’ है, पर नैतिक या न्यायिक सन्दर्भ में यह अपराध की अत्यधिक गंभीरता बताता है। ‘बहुत गंभीर’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका निकट देवनागरी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: זַעֲקַת में सम्बन्ध का अर्थ
  choice: सदोम और अमोरा के विरुद्ध उठी पुकार
  alternative: सदोम और अमोरा की पुकार
  rationale: सन्दर्भ उनके घोर पाप के विषय में उठी फरियाद का समर्थन करता है, किन्तु इब्रानी संबंधसूचक रचना अपने आप में ‘की पुकार’ भी कही जा सकती है। मुख्य पाठ सन्दर्भगत अर्थ देता है और पादटिप्पणी भाषिक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की समानान्तर इब्रानी संरचना—पुकार की महानता और पाप की गंभीरता—को बनाए रखा गया है।
