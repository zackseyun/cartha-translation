id: GEN.18.33
reference: Genesis 18:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ יְהוָ֔ה כַּ/אֲשֶׁ֣ר כִּלָּ֔ה לְ/דַבֵּ֖ר אֶל אַבְרָהָ֑ם וְ/אַבְרָהָ֖ם שָׁ֥ב לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/033.yaml
  text: Then Yahweh went his way when he had finished speaking to Abraham[a], and Abraham returned to his place.
translation:
  language: hi
  text: जब याहवे[a] अब्राहम से बात कर चुके, तब वे वहाँ से चले गए; और अब्राहम अपने स्थान पर लौट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘YHWH’। इसका एक अन्य प्रचलित हिन्दी रूप ‘यहोवा’ है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: वहाँ से चले गए
  rationale: הלך यहाँ बातचीत समाप्त होने पर प्रस्थान को सूचित करता है। ‘वहाँ से चले गए’ आधुनिक हिन्दी में स्वाभाविक है और किसी अनिर्दिष्ट गंतव्य को नहीं जोड़ता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम YHWH को शीर्षक से बदलने के बजाय उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: כַּאֲשֶׁר כִּלָּה לְדַבֵּר
  choice: जब ... बात कर चुके
  rationale: यह वाक्यांश बोलने की क्रिया पूर्ण होने के समय को बताता है। पूर्णतासूचक ‘कर चुके’ उस क्रम को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: אֶל אַבְרָהָם
  choice: अब्राहम से
  rationale: यद्यपि אֶל का मूल भाव ‘की ओर/से’ है, हिन्दी में किसी व्यक्ति को संबोधित करके बोलने के लिए ‘से बात करना’ सर्वाधिक स्वाभाविक है।
- source_word: שָׁב לִמְקֹמוֹ
  choice: अपने स्थान पर लौट गया
  rationale: שׁוב वापसी और מָקוֹם ‘स्थान’ को दर्शाता है। ‘अपने स्थान’ मूल की अनिश्चितता बचाता है और अनावश्यक रूप से ‘घर’ नहीं जोड़ता।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम YHWH का प्रयोग करता है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है; ‘यहोवा’ परंपरागत वैकल्पिक रूप है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘वे’ का प्रयोग याहवे के लिए आदरसूचक एकवचन के रूप में किया गया है, जबकि अब्राहम के लिए सामान्य एकवचन क्रिया रखी गई है।
