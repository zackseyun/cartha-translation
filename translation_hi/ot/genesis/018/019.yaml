  text: כִּ֣י יְדַעְתִּ֗י/ו לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת בָּנָ֤י/ו וְ/אֶת בֵּית/וֹ֙ אַחֲרָ֔י/ו וְ/שָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַ/עֲשׂ֥וֹת צְדָקָ֖ה וּ/מִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר דִּבֶּ֖ר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/019.yaml
  text: For I have known him[a], so that he may command his children and his household after him, and they may keep the way of Yahweh by doing righteousness and justice[d][c][b], so that Yahweh may bring upon Abraham what he has spoken concerning him.
translation:
  language: hi
  text: क्योंकि मैं उसे जानता हूँ[a], ताकि वह अपने बेटों[b] और अपने बाद आने वाले अपने घराने को आज्ञा दे कि वे धार्मिकता और न्याय करते हुए याहवे के मार्ग[c] का पालन करें, ताकि याहवे अब्राहम के लिए वह पूरा करे जो उसने उसके विषय में कहा है[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि मैंने उसे चुना है।” इब्रानी क्रिया का सामान्य अर्थ “जानना” है, पर इस प्रसंग में वह विशेष संबंध, कृपा या चुनाव का भाव भी दे सकती है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शब्द पुल्लिंग बहुवचन, अर्थात् “उसके बेटे,” है; “उसका घराना” निर्देश के दायरे को बेटों से आगे बढ़ाता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात् वह जीवन-पद्धति जिसकी अपेक्षा याहवे करता है।
    reason: cultural_note
  - marker: d
    text: 'भावानुवाद: “ताकि याहवे अब्राहम से की हुई अपनी प्रतिज्ञा पूरी करे।” मूल में अधिक शाब्दिक रूप से है, “ताकि याहवे अब्राहम पर वह ले आए जो उसने उसके विषय में कहा है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; हिन्दी में ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְדַעְתִּיו
  choice: मैंने उसे जाना है
  rationale: मूल क्रिया का सामान्य अर्थ ‘जानना’ है। प्रसंग में विशेष संबंध या चुनाव का भाव संभव है, पर मुख्य पाठ में अधिक व्याख्यात्मक ‘चुना है’ रखने के बजाय मूल शब्द की अस्पष्टता सुरक्षित रखी गई है।
- source_word: לְמַעַן אֲשֶׁר
  choice: ताकि
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम व्यक्त करता है; ‘ताकि’ आधुनिक हिन्दी में सहज है।
- source_word: יְצַוֶּה
  choice: आज्ञा दे
  rationale: पिएल रूप में क्रिया का बल ‘आज्ञा देना’ या ‘निर्देश देना’ है; ‘आज्ञा दे’ उसकी दृढ़ता बनाए रखता है।
- source_word: בָּנָיו
  choice: अपने बेटों
  rationale: इब्रानी रूप पुल्लिंग बहुवचन है। ‘बेटों’ उसका प्रत्यक्ष रूप है; साथ का ‘घराना’ निर्देश के व्यापक घरेलू दायरे को दिखाता है।
- source_word: בֵּיתוֹ
  choice: अपने घराने
  rationale: यहाँ ‘घर’ भवन नहीं, बल्कि अब्राहम के घरेलू समुदाय को दर्शाता है; इसलिए ‘घराना’ उपयुक्त है।
- source_word: וְשָׁמְרוּ דֶּרֶךְ יְהוָה
  choice: वे याहवे के मार्ग का पालन करें
  rationale: मार्ग के साथ שׁמר का अर्थ उस जीवन-पद्धति को मानना और उसमें बने रहना है; ‘मार्ग का पालन करें’ हिन्दी में स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के प्रचलित हिन्दी लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט
  choice: धार्मिकता और न्याय करते हुए
  rationale: यह वाक्यांश बताता है कि याहवे के मार्ग का पालन कैसे किया जाए। ‘धार्मिकता’ और ‘न्याय’ दोनों अलग इब्रानी संकल्पनाओं को बनाए रखते हैं।
- source_word: לְמַעַן הָבִיא יְהוָה עַל אַבְרָהָם
  choice: ताकि याहवे अब्राहम पर वह बात ले आए
  rationale: ‘पर ... ले आए’ मूल की הֵבִיא עַל रचना को निकटता से रखता है और कथन के पूरा होने का भाव देता है, बिना उसे मुख्य पाठ में स्पष्टतः ‘प्रतिज्ञा’ कहे।
- source_word: אֵת אֲשֶׁר דִּבֶּר עָלָיו
  choice: जो उसने उसके विषय में कही है
  rationale: यह ‘जिसके विषय में कहा’ की मूल अभिव्यक्ति को सुरक्षित रखता है; इसे ‘जिसकी प्रतिज्ञा की’ कहना संभावित अर्थ है, पर अधिक व्याख्यात्मक है।
theological_decisions:
- issue: יָדַע को संबंधपरक ‘जानना’ माना जाए या चुनाव के अर्थ में ‘चुनना’
  choice: मैंने उसे जाना है
  alternative: मैंने उसे चुना है
  rationale: प्रसंग में परमेश्वर की विशेष कृपा और उद्देश्य निहित हो सकते हैं, किन्तु क्रिया का प्रत्यक्ष अर्थ ‘जानना’ है। इसलिए मुख्य पाठ चुनाव की व्याख्या को अनिवार्य नहीं बनाता और विकल्प टिप्पणी में दिया गया है।
- issue: दिव्य नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना हिन्दी में लिप्यंतरित करता है।
- issue: अंतिम कथन को प्रतिज्ञा के रूप में स्पष्ट करना या ‘कही हुई बात’ की व्यापकता बनाए रखना
  choice: वह बात ... जो उसने उसके विषय में कही है
  alternative: जो प्रतिज्ञा उसने उससे की है, उसे पूरा करे
  rationale: प्रसंग प्रतिज्ञा की ओर संकेत करता है, पर मूल पाठ सामान्यतः ‘कहा’ और ‘उसके विषय में’ कहता है। मुख्य पाठ उस शब्दावली को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘मैंने उसे जाना है’ और ‘अब्राहम पर ... ले आए’ कुछ हद तक स्रोत-सन्निकट अभिव्यक्तियाँ हैं; उनकी संभावित व्याख्या पादटिप्पणियों में दी गई है।
