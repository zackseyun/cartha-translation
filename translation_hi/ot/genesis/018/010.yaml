  text: וַ/יֹּ֗אמֶר שׁ֣וֹב אָשׁ֤וּב אֵלֶ֨י/ךָ֙ כָּ/עֵ֣ת חַיָּ֔ה וְ/הִנֵּה בֵ֖ן לְ/שָׂרָ֣ה אִשְׁתֶּ֑/ךָ וְ/שָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָ/אֹ֖הֶל וְ/ה֥וּא אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/010.yaml
  text: And he said[a], “I will surely return to you about this time next year, and behold[c][b], Sarah your wife will have a son.” And Sarah was listening at the entrance of the tent behind him.
translation:
  language: hi
  text: तब उसने कहा, “मैं अगले वर्ष इसी समय तुम्हारे पास अवश्य लौटूँगा[a]; और देखो, तुम्हारी पत्नी सारा का एक पुत्र होगा।” सारा तंबू के द्वार पर सुन रही थी, जो उसके पीछे था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू का वाक्यांश शाब्दिक रूप से “जीवन के समय के अनुसार” है; प्रसंग में इसका अर्थ अगले वर्ष लगभग इसी समय है।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू: “और वह उसके पीछे था।” सर्वनाम अत्यंत संक्षिप्त है; संभवतः “वह” तंबू के द्वार को और “उसके” वक्ता को सूचित करता है।'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: हिब्रू कथा-शैली के wayyiqtol को स्वाभाविक हिन्दी में व्यक्त करता है और वक्ता की पहचान को मूल पाठ की तरह अनिर्दिष्ट रखता है।
- source_word: שׁוֹב אָשׁוּב
  choice: अवश्य लौटूँगा
  rationale: क्रिया के साथ infinitive absolute लौटने की निश्चितता और बल को प्रकट करता है; ‘अवश्य’ आधुनिक हिन्दी में यही जोर देता है।
- source_word: כָּעֵת חַיָּה
  choice: अगले वर्ष इसी समय के आस-पास
  rationale: यह प्रसंगानुसार अगले वर्ष की इसी ऋतु या समय को सूचित करने वाला मुहावरा है; शाब्दिक ‘जीवन के समय’ हिन्दी में अर्थ स्पष्ट नहीं करेगा।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: ध्यान आकर्षित करने और घोषणा पर बल देने वाले हिब्रू अव्यय का सहज, वर्तमान हिन्दी रूप।
- source_word: בֵן לְשָׂרָה אִשְׁתֶּךָ
  choice: तुम्हारी पत्नी सारा का एक पुत्र होगा
  rationale: לְ से व्यक्त भावी प्राप्ति/अधिकार को स्वाभाविक हिन्दी जन्म-घोषणा में प्रस्तुत करता है।
- source_word: שָׂרָה שֹׁמַעַת
  choice: सारा … सुन रही थी
  rationale: वर्तमान कृदंत दृश्य में चल रही क्रिया को दिखाता है; अपूर्ण भूतकालीन हिन्दी रूप उस कालगत भाव को सुरक्षित रखता है।
- source_word: פֶּתַח הָאֹהֶל וְהוּא אַחֲרָיו
  choice: तंबू के द्वार पर, उसके पीछे
  rationale: सारा का स्थान और वक्ता के पीछे तंबू-द्वार की स्थिति संक्षिप्त तथा स्वाभाविक हिन्दी में व्यक्त होती है; सर्वनामगत संक्षिप्तता की वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: वक्ता की पहचान
  choice: केवल ‘उसने’
  alternative: ‘यहोवा ने’ अथवा ‘उन पुरुषों में से एक ने’
  rationale: इस पद के हिब्रू क्रियारूप में कर्ता केवल तीसरे पुरुष एकवचन के रूप में निहित है। व्यापक प्रसंग से कोई विशिष्ट पहचान जोड़ने के बजाय पद की अपनी अनिर्दिष्टता सुरक्षित रखी गई है।
- issue: प्रतिज्ञा का स्वरूप
  choice: ‘सारा का एक पुत्र होगा’
  alternative: ‘सारा एक पुत्र को जन्म देगी’
  rationale: मूल पाठ जन्म देने की क्रिया स्पष्ट रूप से नहीं कहता, बल्कि ‘सारा के लिए/सारा का पुत्र’ कहता है; चुना गया रूप उसी संयम को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। ‘तुम्हारे’ संबोधन से अनावश्यक पुरातनता से बचते हुए एकवचन प्रसंग स्पष्ट रहता है। ‘पुत्र’ घोषणा की गरिमा बनाए रखता है, जबकि वाक्य-संरचना सामान्य पाठक के लिए सहज है।
