  yaml_path: translation/ot/genesis/018/004.yaml
  text: Please let a little water be brought[a], and wash your feet[b], and rest yourselves under the tree.
translation:
  language: hi
  text: थोड़ा-सा पानी लाया जाए; आप अपने पाँव धो लें और उस पेड़ के नीचे विश्राम करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֻקַּח נָא
  choice: लाया जाए
  rationale: לקח का निष्क्रिय आज्ञार्थक रूप और विनय-सूचक נָא मिलकर नम्र अनुरोध व्यक्त करते हैं। हिंदी में संदर्भ और आदरसूचक क्रियाओं के साथ ‘लाया जाए’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מְעַט מַיִם
  choice: थोड़ा-सा पानी
  rationale: मूल में पानी की थोड़ी मात्रा है; यह अब्राहम के विनम्र आतिथ्य-प्रस्ताव को बनाए रखता है।
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: आप अपने पाँव धो लें
  rationale: बहुवचन आगंतुकों को संबोधित आज्ञार्थक क्रिया को हिंदी में आदरसूचक और विनम्र अनुरोध के रूप में व्यक्त किया गया है। ‘अपने’ स्वाभाविक हिंदी प्रयोग है।
- source_word: וְהִשָּׁעֲנוּ
  choice: विश्राम करें
  rationale: שען के निफ़अल रूप का मूल भाव सहारा लेकर टिकने या लेटने का है; आतिथ्य के इस संदर्भ में ‘विश्राम करें’ स्वाभाविक हिंदी है और संदर्भगत आशय संप्रेषित करता है।
- source_word: תַּחַת הָעֵץ
  choice: उस पेड़ के नीचे
  rationale: निश्चित पदबंध किसी निकटस्थ, पहचाने हुए पेड़ की ओर संकेत करता है; हिंदी में ‘उस पेड़’ यह निश्चितता स्वाभाविक ढंग से व्यक्त करता है।
