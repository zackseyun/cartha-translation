  yaml_path: translation/ot/genesis/018/022.yaml
  text: Then the men turned from there and went toward Sodom[a], but Abraham still stood before Yahweh.
translation:
  language: hi
  text: तब वे पुरुष वहाँ से मुड़े और सदोम की ओर चले गए, पर अब्राहम अब भी याहवे के सामने खड़ा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन साक्ष्यों में यह पाठ है, “और याहवे अब भी अब्राहम के सामने खड़ा था।” इब्रानी मसोरेटिक पाठ में है, “और अब्राहम अब भी याहवे के सामने खड़ा था।”
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: मुड़े
  rationale: यह क्रिया दिशा बदलने और उस स्थान से आगे बढ़ने का संकेत देती है; ‘मुड़े’ संक्षिप्त और स्वाभाविक है।
- source_word: הָאֲנָשִׁים
  choice: वे पुरुष
  rationale: इब्रानी पाठ उन्हें सामान्य कथात्मक शब्द ‘पुरुष’ कहता है; अनुवाद उनकी पहचान की अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: סְדֹמָה
  choice: सदोम की ओर
  rationale: स्थान-नाम के साथ लगा दिशासूचक प्रत्यय सदोम की दिशा में गति को व्यक्त करता है।
- source_word: עוֹדֶנּוּ עֹמֵד
  choice: अब भी ... खड़ा था
  rationale: यह पदबंध अब्राहम की जारी अवस्था को व्यक्त करता है; हिंदी में यह रूप सहजता से निरंतरता बनाए रखता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह स्थानिक अर्थ ‘सामने’ और किसी की उपस्थिति में होने का भाव—दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिंदी लिप्यंतरण है, न कि उसके स्थान पर प्रयुक्त कोई उपाधि।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: अंतिम उपवाक्य का पाठ-रूप
  choice: अब्राहम ... याहवे के सामने खड़ा था
  alternative: याहवे ... अब्राहम के सामने खड़ा था
  rationale: मुख्य पाठ WLC के मसोरेटी पाठ का अनुसरण करता है, जबकि प्राचीन पाठ-परंपरा में सुरक्षित उलटे पाठ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘वे पुरुष’ मूल के सतही वर्णन को बनाए रखता है, और पाठांतर-सूचक चिह्न संबंधित अंतिम उपवाक्य के बाद रखा गया है।
