source:
  edition: WLC
  text: חָלִ֨לָ/ה לְּ/ךָ֜ מֵ/עֲשֹׂ֣ת כַּ/דָּבָ֣ר הַ/זֶּ֗ה לְ/הָמִ֤ית צַדִּיק֙ עִם רָשָׁ֔ע וְ/הָיָ֥ה כַ/צַּדִּ֖יק כָּ/רָשָׁ֑ע חָלִ֣לָ/ה לָּ֔/ךְ הֲ/שֹׁפֵט֙ כָּל הָ/אָ֔רֶץ לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/025.yaml
  text: Far be it from you to do such a thing—to put the righteous to death with the wicked[a], so that the righteous would be like the wicked. Far be it from you! Shall not the Judge of all the earth do justice?
translation:
  language: hi
  text: तू ऐसा करे, यह तुझसे दूर रहे—कि तू दुष्ट के साथ धर्मी को भी मार डाले, और धर्मी दुष्ट के समान हो जाए। तू ऐसा करे, यह तुझसे दूर रहे! क्या सारी पृथ्वी का न्यायी न्याय नहीं करेगा?[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “क्या सारी पृथ्वी का न्यायी वह नहीं करेगा जो न्यायोचित है?”
    reason: מִשְׁפָּט के लिए ‘न्याय करना’ और ‘जो न्यायोचित है वह करना’ दोनों संदर्भानुकूल अभिव्यक्तियाँ हैं।
lexical_decisions:
- source_word: חָלִילָה
  choice: ऐसा करना तुझसे कोसों दूर रहे
  rationale: यह तीव्र अस्वीकार और घृणा व्यक्त करने वाला मुहावरा है। हिंदी मुहावरा मूल की प्रबलता को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: מֵעֲשֹׂת כַּדָּבָר הַזֶּה
  choice: ऐसा करना
  rationale: शाब्दिक ‘यह काम करने से’ की अपेक्षा यह हिंदी में अधिक स्वाभाविक है और חָלִילָה के साथ वाक्य का अर्थ स्पष्ट रखता है।
- source_word: לְהָמִית
  choice: मार डाले
  rationale: हिफ़ील रूप का अर्थ मृत्यु का कारण बनना है; इस प्रसंग में ‘मार डालना’ उसका स्पष्ट और स्वाभाविक हिंदी रूप है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यहाँ शब्द नैतिक और न्यायिक दोनों अर्थ रखता है। ‘धर्मी’ दुष्ट के साथ मूल विरोध को बनाए रखता है; केवल ‘निर्दोष’ कहना अर्थ को न्यायिक पक्ष तक सीमित कर सकता था।
- source_word: עִם רָשָׁע
  choice: दुष्ट के साथ
  rationale: इब्रानी में दोनों संज्ञाएँ एकवचन और प्रतिनिधिक हैं; हिंदी में एकवचन रखने से मूल की अभिव्यक्ति और सीधा विरोध सुरक्षित रहता है।
- source_word: וְהָיָה כַצַּדִּיק כָּרָשָׁע
  choice: और धर्मी का हाल दुष्ट के समान हो जाए
  rationale: वाक्य उस असह्य परिणाम को व्यक्त करता है जिसमें धर्मी और दुष्ट के साथ समान व्यवहार होगा। ‘हाल ... समान’ तुलना को सहज हिंदी में स्पष्ट करता है।
- source_word: הֲשֹׁפֵט כָּל הָאָרֶץ
  choice: क्या सारी पृथ्वी का न्यायी
  rationale: कृदन्त यहाँ परमेश्वर के लिए संज्ञात्मक उपाधि है। ‘सारी पृथ्वी’ उसके न्याय के सार्वभौमिक विस्तार को बनाए रखता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ अर्थ केवल निर्णय सुनाना नहीं, बल्कि न्यायोचित काम करना है। ‘न्याय करना’ हिंदी का स्वाभाविक प्रयोग है और नैतिक-न्यायिक बल को सुरक्षित रखता है।
theological_decisions:
- issue: अब्राहम द्वारा परमेश्वर के न्यायी चरित्र से की गई साहसपूर्ण अपील
  choice: क्या सारी पृथ्वी का न्यायी न्याय नहीं करेगा?
  alternative: क्या सारी पृथ्वी का न्यायी वह नहीं करेगा जो न्यायोचित है?
  rationale: मूल का प्रश्न सकारात्मक उत्तर की अपेक्षा करता है और अब्राहम की निर्भीक अपील को नरम नहीं करता। ‘न्याय नहीं करेगा?’ מִשְׁפָּט के संक्षिप्त नैतिक-न्यायिक बल और मूल की अलंकारिक तीव्रता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सीधा और सामान्य पाठक के लिए सुबोध रूप। परमेश्वर को अब्राहम का संबोधन होने के कारण एकवचन ‘तू/तुझसे’ रखा गया है, जो निकटता और मूल के व्याकरण दोनों को दर्शाता है; भाषा में अनावश्यक सांप्रदायिक शब्दावली नहीं जोड़ी गई।
