base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/026.yaml
  text: And Yahweh said[a], “If I find fifty righteous people within the city of Sodom, then I will spare the whole place for their sake.”
translation:
  language: hi
  text: तब यहवे ने कहा, “यदि मुझे सदोम नगर के भीतर पचास धर्मी लोग मिलें, तो मैं उनके कारण उस पूरे स्थान को बख्श दूँगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्षमा कर दूँगा।” हिब्रू क्रिया में दोष को उठा लेने अथवा न्याय को रोक लेने का भाव हो सकता है; यहाँ प्रसंग के अनुसार “बख्श दूँगा” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: हिब्रू कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אִם אֶמְצָא
  choice: यदि मुझे ... मिलें
  rationale: शर्त को स्पष्ट रखता है और बहुवचन व्यक्तियों के साथ स्वाभाविक हिन्दी प्रयोग देता है।
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: पचास धर्मी लोग
  rationale: צַדִּיקִם धर्मी व्यक्तियों को सूचित करता है; ‘लोग’ अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: בְּתוֹךְ הָעִיר
  choice: नगर के भीतर
  rationale: स्थान के अंदर या मध्य में होने का भाव सहज और स्पष्ट रूप में सुरक्षित रहता है।
- source_word: וְנָשָׂאתִי
  choice: छोड़ दूँगा
  rationale: यहाँ क्रिया का प्रसंगगत अर्थ न्याय अथवा विनाश को रोककर स्थान को बख्श देना है; हिन्दी में ‘छोड़ दूँगा’ इस भाव को स्वाभाविक रूप से व्यक्त करता है, जबकि क्षमा का अर्थ भी पादटिप्पणी में सुरक्षित है।
- source_word: לְכָל הַמָּקוֹם
  choice: उस पूरे स्थान को
  rationale: न्याय के अधीन समूचे स्थान के व्यापक दायरे को बनाए रखता है।
- source_word: בַּעֲבוּרָם
  choice: उनके कारण
  rationale: धर्मियों के कारण अथवा उनके निमित्त पूरे स्थान को छोड़ देने का संबंध स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; इसलिए उसे किसी उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- issue: וְנָשָׂאתִי में क्षमा और दंड रोकने का अर्थ-संबंध
  choice: छोड़ दूँगा
  alternative: क्षमा कर दूँगा; बख्श दूँगा
  rationale: तात्कालिक प्रसंग नगर के विनाश को रोकने का है, इसलिए ‘छोड़ दूँगा’ स्पष्ट है; फिर भी हिब्रू क्रिया में दोष उठाने या क्षमा करने की अर्थ-छाया को पादटिप्पणी में रखा गया है।
