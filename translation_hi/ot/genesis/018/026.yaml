    issue: ‘छोड़ दूँगा’ is semantically underdetermined.
    rationale: In ordinary Hindi it may suggest leaving a place behind or abandoning it, whereas the Hebrew idiom in this judgment context means to forgive/pardon or spare the place from judgment.
