base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/023.yaml
  text: Then Abraham came near and said[a], “Will you indeed sweep away the righteous with the wicked?”
translation:
  language: hi
  text: तब अब्राहम ने पास आकर कहा, “क्या तू सचमुच धर्मी को दुष्ट के साथ मिटा देगा[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नष्ट कर देगा” अथवा “समाप्त कर देगा”; इब्रानी क्रिया न्याय के द्वारा हटा दिए जाने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: पास आकर
  rationale: נגשׁ का अर्थ निकट आना है। यह अब्राहम के आगे बढ़कर विनती करने के शारीरिक और संवादात्मक भाव, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: אַבְרָהָם
  choice: अब्राहम
  rationale: व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
- source_word: וַיֹּאמַר
  choice: कहा
  rationale: אמר के सामान्य कथात्मक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַאַף
  choice: क्या ... सचमुच
  rationale: प्रश्नवाचक ה और बलवाचक אַף के संयुक्त आश्चर्यपूर्ण आग्रह को हिन्दी प्रश्न-रचना और ‘सचमुच’ द्वारा व्यक्त किया गया है।
- source_word: תִּסְפֶּה
  choice: मिटा देगा
  rationale: ספה यहाँ न्याय के अंतर्गत पूरी तरह हटा देने या नष्ट कर देने का भाव रखता है। ‘मिटा देगा’ सजीव, स्पष्ट और प्रसंगानुकूल है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: एकवचन रूप यहाँ नैतिक वर्ग के प्रतिनिधि के रूप में प्रयुक्त है। हिन्दी का ‘धर्मी’ इस सामान्य श्रेणी को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עִם
  choice: के साथ
  rationale: साझे न्यायिक परिणाम का सीधा अर्थ बनाए रखता है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन विशेषण यहाँ सामान्य नैतिक श्रेणी का प्रतिनिधित्व करता है और ‘धर्मी’ के स्पष्ट प्रतिलोम के रूप में आता है।
theological_decisions:
- issue: एकवचन में नैतिक श्रेणियाँ
  choice: צַדִּיק और רָשָׁע को प्रतिनिधिक एकवचन ‘धर्मी’ और ‘दुष्ट’ के रूप में रखना।
  alternative: ‘धर्मी जन’ और ‘दुष्ट जन’, अथवा बहुवचन ‘धर्मियों’ और ‘दुष्टों’ के रूप में अनुवाद करना।
  rationale: इब्रानी एकवचन रूपों से ईश्वरीय न्याय का सामान्य सिद्धान्त सामने रखता है। हिन्दी में ‘धर्मी’ और ‘दुष्ट’ एकवचन रहते हुए भी वर्गसूचक अर्थ दे सकते हैं, इसलिए मूल की संख्या और उसका व्यापक आशय दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। परमेश्वर के लिए एकवचन निकट-संबोधन ‘तू’ बाइबलीय हिन्दी की प्रार्थनात्मक परम्परा और इब्रानी के एकवचन संबोधन के अनुरूप है; इसे अनादर के अर्थ में नहीं लिया जाना चाहिए।
