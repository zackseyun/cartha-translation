  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/יִפָּלֵ֥א מֵ/יְהוָ֖ה דָּבָ֑ר לַ/מּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛י/ךָ כָּ/עֵ֥ת חַיָּ֖ה וּ/לְ/שָׂרָ֥ה בֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/014.yaml
  text: Is anything too difficult for Yahweh? At the appointed time I will return to you[a], about this time next year[b], and Sarah will have a son.
translation:
  language: hi
  text: क्या कोई बात याहवे के लिए बहुत कठिन है?[a] नियत समय पर मैं तुम्हारे पास लौटूँगा—अगले वर्ष लगभग इसी समय[b]—और सारा को एक पुत्र होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या कोई बात याहवे के लिए बहुत अद्भुत है?” इब्रानी क्रिया किसी असाधारण बात या मानवीय सामर्थ्य से परे बात का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी वाक्यांश का शाब्दिक अर्थ कठिन है; परंपरागत रूप से इसे “जीवन के समय के अनुसार” समझा जाता है। यहाँ इसका सम्भावित अर्थ अगले वर्ष की यही ऋतु या समय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִפָּלֵא
  choice: बहुत कठिन
  rationale: निफ़अल रूप यहाँ ऐसी बात का बोध करा सकता है जो असाधारण हो या किसी की सामर्थ्य से परे हो। आलंकारिक प्रश्न में ‘बहुत कठिन’ सहज हिन्दी में याहवे की सामर्थ्य के संदर्भ को व्यक्त करता है, जबकि ‘असंभव’ इब्रानी से अधिक प्रबल निष्कर्ष होता।
- source_word: מֵיְהוָה
  choice: याहवे के लिए
  rationale: פלא के साथ מן सीमा या सामर्थ्य की तुलना का भाव देता है; हिन्दी में ‘याहवे के लिए’ इस प्रश्न का आशय स्वाभाविक रूप से प्रकट करता है।
- source_word: דָּבָר
  choice: कोई बात
  rationale: דָּבָר का अर्थ ‘बात, विषय, वस्तु’ हो सकता है। प्रश्नवाचक वाक्य में ‘कोई बात’ इसके व्यापक अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: לַמּוֹעֵד
  choice: ठहराए हुए समय पर
  rationale: מוֹעֵד किसी निश्चित या नियुक्त समय को दर्शाता है। ‘ठहराए हुए समय’ में पहले से निश्चित अवसर का भाव स्पष्ट है।
- source_word: אָשׁוּב אֵלֶיךָ
  choice: मैं तुम्हारे पास लौटूँगा
  rationale: שׁוּב का प्रसंगानुकूल अर्थ लौटना है, और एकवचन पुल्लिंग सम्बोधन अब्राहम की ओर है; इसलिए नाम जोड़े बिना ‘तुम्हारे पास’ रखा गया है।
- source_word: כָּעֵת חַיָּה
  choice: अगले वर्ष लगभग इसी समय
  rationale: यह कठिन इब्रानी मुहावरा प्रसंग में आने वाले वर्ष के इसी समय या ऋतु की ओर संकेत करता है। स्पष्ट आधुनिक हिन्दी के लिए मुहावरे का अर्थ मुख्य पाठ में दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּלְשָׂרָה בֵן
  choice: और सारा का एक पुत्र होगा
  rationale: इब्रानी खंड में व्यक्त क्रिया नहीं है, पर प्रसंग में भविष्य की प्रतिज्ञा स्पष्ट है। यह हिन्दी रूप उस आशय को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरी वाचा-नाम सीधे आया है; इसलिए उसे उपाधि में बदलने के बजाय हिन्दी में ध्वन्यात्मक रूप ‘याहवे’ रखा गया है।
- issue: आलंकारिक प्रश्न में פלא का बल
  choice: क्या कोई बात याहवे के लिए बहुत कठिन है?
  alternative: क्या कोई बात याहवे के लिए बहुत अद्भुत है? / क्या याहवे के लिए कुछ असंभव है?
  rationale: ‘बहुत कठिन’ प्रतिज्ञा पूरी करने की याहवे की सामर्थ्य पर बल देता है, पर ‘असंभव’ कहकर मूल शब्द की तुलना में अधिक निरपेक्ष दार्शनिक कथन नहीं बनाता। ‘अद्भुत’ वाला वास्तविक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘पुत्र’ और ‘ठहराए हुए समय’ जैसे शब्द बाइबलीय कथन की गरिमा बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए स्पष्ट है।
