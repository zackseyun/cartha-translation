  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַ֨בְרָהָ֔ם הָי֧וֹ יִֽהְיֶ֛ה לְ/ג֥וֹי גָּד֖וֹל וְ/עָצ֑וּם וְ/נִ֨בְרְכוּ ב֔/וֹ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/018.yaml
  text: Abraham will surely become a great and mighty nation[a], and all the nations of the earth will be blessed in him.
translation:
  language: hi
  text: अब्राहम निश्चय ही एक महान और शक्तिशाली राष्ट्र बनेगा, और पृथ्वी के सभी राष्ट्र उसमें आशीष पाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “पृथ्वी के सभी राष्ट्र उसके द्वारा अपने को आशीष देंगे।” इब्रानी क्रिया-रूप का यह आत्मवाचक अर्थ भी संभव है; मुख्य पाठ में इसे कर्मवाच्य अर्थ में लिया गया है: “उसमें आशीष पाएँगे।”'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיוֹ יִהְיֶה
  choice: निश्चय ही ... बनेगा
  rationale: इनफ़िनिटिव ऐब्सोल्यूट के साथ इम्परफ़ेक्ट क्रिया भविष्य की बात पर विशेष बल देती है। हिंदी में ‘निश्चय ही ... बनेगा’ इस बल और לְגוֹי के साथ होने वाले परिवर्तन—राष्ट्र बनना—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְגוֹי
  choice: एक ... राष्ट्र
  rationale: גוי यहाँ एक जनसमुदाय या राष्ट्र को दर्शाता है। ‘राष्ट्र’ उसी पद के अगले प्रयोग से संगति रखता है और ‘जाति’ से उत्पन्न हो सकने वाले आधुनिक जाति-व्यवस्था संबंधी भ्रम से बचाता है।
- source_word: גָּדוֹל
  choice: महान
  rationale: ‘महान’ आकार, महत्त्व और प्रतिष्ठा की व्यापक अर्थ-छाया को बनाए रखता है और प्रतिज्ञा की गरिमापूर्ण भाषा के अनुकूल है।
- source_word: וְעָצוּם
  choice: और शक्तिशाली
  rationale: עָצוּם सामर्थ्य और प्रबलता व्यक्त कर सकता है। ‘शक्तिशाली’ इसे केवल संख्या या आकार तक सीमित नहीं करता।
- source_word: וְנִבְרְכוּ
  choice: आशीष पाएँगे
  rationale: निफ़अल रूप को मुख्य पाठ में कर्मवाच्य अर्थ में लिया गया है। हिंदी में ‘आशीष पाएँगे’ ‘आशीषित होंगे’ की अपेक्षा अधिक स्वाभाविक है और राष्ट्रों को आशीष के प्राप्तकर्ता के रूप में दिखाता है। संभावित आत्मवाचक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: בוֹ
  choice: उसमें
  rationale: בְּ उपसर्ग के मूल ‘में’ संबंध को बनाए रखा गया है और ‘उसके द्वारा’ जैसे अधिक व्याख्यात्मक अनुवाद को मुख्य पाठ में नहीं अपनाया गया।
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: पृथ्वी के सभी राष्ट्र
  rationale: यह उत्पत्ति में विश्वव्यापी अर्थ रखने वाला सूत्र है। ‘राष्ट्र’ पहले आए גוי से शब्दगत संगति रखता है और ‘पृथ्वी’ स्थानीय ‘देश’ की अपेक्षा व्यापक आशय स्पष्ट करता है।
theological_decisions:
- issue: अब्राहम से संबंधित आशीष-सूत्र का अर्थ
  choice: राष्ट्र अब्राहम में आशीष के प्राप्तकर्ता हैं—‘उसमें आशीष पाएँगे।’
  alternative: राष्ट्र अब्राहम के द्वारा अपने को आशीष देंगे।
  rationale: ברך का निफ़अल रूप कर्मवाच्य या आत्मवाचक समझा जा सकता है। व्यापक वाचा-संदर्भ में कर्मवाच्य अर्थ उपयुक्त है, पर वास्तविक भाषिक अस्पष्टता को मिटाने के बजाय वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आशीष पाएँगे’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘महान और शक्तिशाली राष्ट्र’ मूल की उन्नत प्रतिज्ञात्मक शैली को बनाए रखता है।
