  text: וַ/יָּקֻ֤מוּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יַּשְׁקִ֖פוּ עַל פְּנֵ֣י סְדֹ֑ם וְ/אַ֨בְרָהָ֔ם הֹלֵ֥ךְ עִמָּ֖/ם לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/016.yaml
  text: Then the men rose up from there and looked down toward Sodom[b][a], and Abraham was walking with them to send them on their way.
translation:
  language: hi
  text: तब वे पुरुष वहाँ से उठे और सदोम की ओर नीचे देखा[a]; और अब्राहम उन्हें विदा करने के लिए उनके साथ चल रहा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सदोम की ओर देखा।” इब्रानी क्रिया प्रायः किसी ऊँचे स्थान से नीचे या बाहर की ओर देखने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन्हें विदा करने के लिए साथ जाना।” इब्रानी अभिव्यक्ति में विदा होते अतिथियों के साथ चलकर उन्हें आगे के मार्ग के लिए विदा करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ מִשָּׁם
  choice: वहाँ से उठे
  rationale: קום के कथात्मक रूप और מִשָּׁם के स्थान-सूचक अर्थ को सहज हिन्दी में रखता है; यह भोजन के बाद उठने और आगे बढ़ने के बीच अनावश्यक चुनाव नहीं करता।
- source_word: הָאֲנָשִׁים
  choice: वे पुरुष
  rationale: मूल पाठ के सामान्य शब्द 'पुरुष' को बनाए रखता है और इस पद में उनकी पहचान को समय से पहले 'स्वर्गदूत' कहकर निर्धारित नहीं करता।
- source_word: וַיַּשְׁקִפוּ עַל־פְּנֵי סְדֹם
  choice: सदोम की ओर नीचे दृष्टि की
  rationale: שׁקף में निहित किसी ऊँचे स्थान से नीचे/दूर देखने की छाया और सदोम की दिशा—दोनों को व्यक्त करता है।
- source_word: הֹלֵךְ עִמָּם
  choice: उनके साथ-साथ चल रहा था
  rationale: सहभागी कृदन्त की जारी क्रिया को 'चल रहा था' द्वारा और עִמָּם को 'साथ-साथ' द्वारा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְשַׁלְּחָם
  choice: उन्हें विदा करने
  rationale: यहाँ שׁלח मेहमानों के साथ कुछ दूर जाकर उन्हें आगे के मार्ग के लिए विदा करने की आतिथ्य-संबंधी प्रथा को सूचित करता है।
theological_decisions:
- issue: הָאֲנָשִׁים की पहचान
  choice: मुख्य पाठ में 'वे पुरुष'
  alternative: '''वे अतिथि'' अथवा ''वे स्वर्गदूत'''
  rationale: इस पद में इब्रानी पाठ सामान्य संज्ञा 'पुरुष' प्रयोग करता है। उसी को रखने से कथात्मक और धर्मवैज्ञानिक तनाव सुरक्षित रहता है तथा पहचान को समय से पहले निश्चित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। 'दृष्टि की' ऊँचे स्थान से देखने की सूक्ष्मता बनाए रखता है, जबकि पादटिप्पणी अधिक सामान्य विकल्प देती है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
