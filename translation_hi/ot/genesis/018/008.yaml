base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/008.yaml
  text: Then he took curds and milk and the calf that he had prepared[a], and set it before them[b]. He stood by them under the tree while they ate.
translation:
  language: hi
  text: तब उसने दही[a] और दूध, और वह बछड़ा जो उसने तैयार किया था, लिया और उनके सामने परोस दिया। जब वे खा रहे थे, तब वह पेड़ के नीचे उनके पास खड़ा रहा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मक्खन” अथवा “मलाई”; इब्रानी शब्द किसी गाढ़े दुग्ध-पदार्थ को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके ऊपर खड़ा था”; यहाँ भाव संभवतः यह है कि वह मेजबान के रूप में पास खड़ा होकर उनकी सेवा कर रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: दही
  rationale: यह इब्रानी शब्द गाढ़े दुग्ध-पदार्थ को दर्शाता है; पशुपालक परिवेश में ‘दही’ सहज और उपयुक्त है, यद्यपि इसका ठीक रूप अनिश्चित है।
- source_word: חָלָב
  choice: दूध
  rationale: दूध के लिए प्रयुक्त सामान्य इब्रानी संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: וּבֶן הַבָּקָר
  choice: वह बछड़ा
  rationale: शाब्दिक अर्थ ‘गोधन का बच्चा’ है; पिछले पद में तैयार किए गए विशिष्ट पशु के संदर्भ में ‘वह बछड़ा’ स्वाभाविक है।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो उसने तैयार करवाया था
  rationale: भोजन के संदर्भ में עשה का अर्थ ‘तैयार करना’ है। पिछले पद के अनुसार अब्राहम ने सेवक से इसे तैयार कराया था, इसलिए प्रेरणार्थक हिंदी प्रसंग को स्पष्ट करती है।
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: उनके सामने परोस दिया
  rationale: शाब्दिक रूप ‘उनके सामने रखा/दिया’ भोजन अतिथियों के आगे रखने को सूचित करता है; ‘परोस दिया’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: וְהוּא עֹמֵד עֲלֵיהֶם
  choice: वह उनके पास खड़ा रहा
  rationale: शाब्दिक ‘उनके ऊपर खड़ा था’ यहाँ मेजबान के रूप में पास खड़े होकर सेवा करने का भाव देता है; ‘उनके पास’ भ्रामक प्रभुत्व-सूचक अर्थ से बचाता है।
- source_word: תַּחַת הָעֵץ
  choice: पेड़ के नीचे
  rationale: पूर्वसर्गीय पदबंध का सीधा, सहज अनुवाद।
- source_word: וַיֹּאכֵלוּ
  choice: जब वे खा रहे थे
  rationale: मुख्य क्रिया का मूल अर्थ ‘और उन्होंने खाया’ है; हिंदी में साथ-साथ चल रही मेजबानी को ‘जब वे खा रहे थे’ स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: क्या आगंतुकों की बाद की धर्मवैज्ञानिक पहचान को अनुवाद में उभारा जाए
  choice: पद को अब्राहम की अतिथि-सेवा के सामान्य कथात्मक शब्दों में रखा गया है।
  alternative: सेवा-संबंधी भाषा को अधिक महिमामय बनाकर आगंतुकों की दिव्य स्थिति का संकेत देना।
  rationale: इस पद में मुख्यतः भोजन परोसने और पास खड़े रहने का वर्णन है; अनुवाद में ऐसी धर्मवैज्ञानिक व्याख्या नहीं जोड़ी जानी चाहिए जो इब्रानी पाठ में स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। ‘परोस दिया’ आतिथ्य के प्रसंग को स्वाभाविक बनाता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
