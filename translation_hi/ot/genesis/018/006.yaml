translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फौरन’ और ‘जल्दी से’ मूल में दोहराई गई तत्परता को बनाए रखते हैं। ‘रोटियाँ’ सांस्कृतिक रूप से स्पष्ट है और עֻגוֹת को आधुनिक मीठे केक के रूप में समझने से बचाता है।
