base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/006.yaml
  text: So Abraham hurried into the tent to Sarah and said[a], “Quickly[b], knead three seahs of fine flour and make cakes.”
translation:
  language: hi
  text: तब अब्राहम जल्दी से तंबू में सारा के पास गया और उससे कहा, “जल्दी से तीन सेआ[a][b] बारीक मैदा गूँधो और रोटियाँ बनाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सेआ प्राचीन समय में सूखी वस्तुओं को मापने की एक इकाई थी; तीन सेआ लगभग 20–22 लीटर के बराबर थे।
    reason: cultural_note
  - marker: b
    text: या, “तीन माप।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: जल्दी से
  rationale: क्रिया शीघ्रता से काम करने को व्यक्त करती है; यह सहज आधुनिक हिन्दी में कथा की तत्परता बनाए रखती है।
- source_word: הָאֹהֱלָה
  choice: तम्बू में
  rationale: दिशासूचक प्रत्यय तम्बू की ओर गति बताता है; सन्दर्भ में अब्राहम सारा से बात करने के लिए भीतर जाता है।
- source_word: מַהֲרִי
  choice: फौरन
  rationale: यह सारा को सम्बोधित स्त्रीलिंग एकवचन आज्ञा है; ‘फौरन’ प्रत्यक्ष वचन में आग्रह और शीघ्रता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁלֹשׁ סְאִים
  choice: तीन सआ
  rationale: सआ एक निश्चित प्राचीन सूखा माप है। इसे लिप्यन्तरित रखने से मूल की ठोस माप-इकाई सुरक्षित रहती है; अर्थ के लिए पादटिप्पणी दी गई है।
- source_word: קֶמַח סֹלֶת
  choice: बढ़िया मैदा
  rationale: यह पदबंध उच्च गुणवत्ता के बारीक पिसे आटे को दर्शाता है; ‘बढ़िया मैदा’ साधारण आधुनिक हिन्दी में गुण और महीनपन दोनों स्पष्ट करता है।
- source_word: לוּשִׁי
  choice: गूँधो
  rationale: क्रिया विशेष रूप से आटा गूँधने के लिए है, केवल मिलाने के लिए नहीं।
- source_word: וַעֲשִׂי עֻגוֹת
  choice: और रोटियाँ बनाओ
  rationale: עֻגוֹת गोल, साधारण रोटी-जैसी टिकियों के लिए प्रयुक्त है। हिन्दी में ‘रोटियाँ’ भोजन-सन्दर्भ में स्वाभाविक है और आधुनिक मीठे ‘केक’ का भ्रामक अर्थ नहीं देता।
