  yaml_path: translation/ot/genesis/018/013.yaml
  text: And the LORD said to Abraham, “Why did Sarah laugh, saying, ‘Will I really bear a child, now that I am old?’”
translation:
  language: hi
  text: तब यहोवा ने अब्राहम से कहा, “सारा यह कहकर क्यों हँसी, ‘क्या मैं सचमुच बच्चे को जन्म दूँगी, जबकि मैं बूढ़ी हो गई हूँ?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित और स्पष्ट रूप में प्रस्तुत किया गया है।
- source_word: הַאַף אֻמְנָם
  choice: क्या मैं सचमुच
  rationale: दोनों बलसूचक अवयवों के संयुक्त प्रश्नवाचक जोर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵלֵד
  choice: बच्चे को जन्म दूँगी
  rationale: क्रिया का आशय केवल गर्भधारण नहीं, संतान को जन्म देना है; स्त्रीलिंग प्रथम पुरुष रूप भी सुरक्षित है।
- source_word: וַאֲנִי זָקַנְתִּי
  choice: जबकि मैं बूढ़ी हो गई हूँ
  rationale: विरोधसूचक प्रसंग और पूर्ण क्रिया से व्यक्त वर्तमान वृद्धावस्था को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में सामान्य उपाधि नहीं बल्कि चतुरक्षरी व्यक्तिगत नाम है; इसलिए नाम का लिप्यंतरण स्रोत के भेद को सुरक्षित रखता है।
- issue: सारा के प्रश्न की अनिश्चितता और विस्मय
  choice: क्या मैं सचमुच…?
  alternative: क्या निश्चय ही मैं…?
  rationale: प्रश्न के संदेहपूर्ण और विस्मयकारी स्वर को आधुनिक, स्वाभाविक हिन्दी में बिना अतिरिक्त व्याख्या के रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। प्रत्यक्ष कथन के भीतर उद्धृत प्रश्न को स्पष्ट रखने के लिए हिन्दी उद्धरण-चिह्नों का प्रयोग किया गया है।
