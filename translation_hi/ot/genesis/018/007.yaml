  text: And Abraham ran to the herd and took a tender and good calf and gave it to the young man[a], and he hurried to prepare it.
translation:
  language: hi
  text: अब्राहम मवेशियों के झुंड के पास दौड़ा, और एक कोमल और उत्तम बछड़ा लेकर उसे उस युवक[a] को दिया। युवक उसे तैयार करने में जल्दी करने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवक’ अथवा ‘लड़का’; इब्रानी शब्द (הַנַּעַר) प्रसंग के अनुसार युवक, लड़के या सेवक को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּקָר
  choice: पशुओं के झुंड
  rationale: यहाँ शब्द सामूहिक रूप से गोवंश को दर्शाता है। ‘पशुओं के झुंड’ चयन के लिए कई पशुओं के पास जाने का भाव स्पष्ट करता है।
- source_word: רָץ
  choice: दौड़कर
  rationale: क्रिया सीधे दौड़ने का बोध देती है और अब्राहम के आतिथ्य की तत्परता को सजीव रखती है।
- source_word: בֶּן־בָּקָר
  choice: एक बछड़ा
  rationale: शाब्दिक अर्थ ‘गोवंश का बच्चा’ है; इस भोजन-तैयारी के प्रसंग में ‘बछड़ा’ स्वाभाविक और स्पष्ट है।
- source_word: רַךְ וָטוֹב
  choice: कोमल और अच्छा
  rationale: यह शब्द-युग्म पशु की कोमलता और उत्तम गुणवत्ता दोनों व्यक्त करता है तथा इब्रानी की सरल संरचना को बनाए रखता है।
- source_word: הַנַּעַר
  choice: उस जवान
  rationale: इब्रानी शब्द युवक, लड़के या सेवक को सूचित कर सकता है। ‘जवान’ आयु-संबंधी मूल अर्थ रखता है और मुख्य पाठ में ‘सेवक’ की संदर्भगत व्याख्या आरोपित नहीं करता।
- source_word: וַיְמַהֵר
  choice: जल्दी की
  rationale: यह क्रिया शीघ्रता से काम करने को व्यक्त करती है और कथा में आतिथ्य की तत्परता बनाए रखती है।
- source_word: לַעֲשׂוֹת אֹתוֹ
  choice: उसे तैयार करने
  rationale: यद्यपि עשה का सामान्य अर्थ ‘करना/बनाना’ है, यहाँ भोजन के प्रसंग में इसका स्वाभाविक अर्थ बछड़े को भोजन के लिए तैयार करना है।
