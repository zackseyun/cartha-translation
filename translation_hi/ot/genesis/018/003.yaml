id: GEN.18.3
reference: Genesis 18:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אֲדֹנָ֗/י אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אַל נָ֥א תַעֲבֹ֖ר מֵ/עַ֥ל עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/003.yaml
  text: And he said[a], “My lord, if I have found favor in your eyes, please do not pass by your servant.”
translation:
  language: hi
  text: तब उसने कहा,[a] “मेरे प्रभु, यदि आपकी दृष्टि में मुझ पर कृपा हुई है, तो कृपया अपने सेवक के पास से आगे न निकल जाइए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे प्रभु,” यदि अब्राहम का यह सम्बोधन आगन्तुक के लिए सम्मानसूचक सम्बोधन न होकर विशेष रूप से परमेश्वर से किया गया माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: तब उसने कहा
  rationale: हिब्रू कथात्मक वय्यिक्तोल क्रम में अब्राहम की वाणी आरम्भ करता है; ‘तब’ आधुनिक हिन्दी में प्रसंग का स्वाभाविक प्रवाह रखता है।
- source_word: אֲדֹנָי
  choice: मेरे प्रभु
  rationale: यह सम्मानसूचक एकवचन सम्बोधन है और इसके बाद एकवचन ‘आपकी’ तथा ‘अपने सेवक’ आते हैं। ‘मेरे प्रभु’ आगन्तुक के प्रति आदर व्यक्त करता है, जबकि यह सम्भावना खुली रखता है कि सम्बोधन परमेश्वर से है।
- source_word: אִם נָא
  choice: यदि
  rationale: यह विनम्र शर्तसूचक अभिव्यक्ति है। נָא की विनय को आगे ‘कृपया’ में व्यक्त किया गया है, जिससे हिन्दी में अनावश्यक दोहराव नहीं होता।
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: आपकी दृष्टि में मुझ पर अनुग्रह हुआ है
  rationale: यह हिब्रू मुहावरे की दृष्टि-सम्बन्धी छवि और अनुकूल कृपा का भाव बनाए रखता है तथा आधुनिक हिन्दी में समझने योग्य है।
- source_word: אַל נָא
  choice: तो कृपया ... न
  rationale: निषेध और विनती के भाव को स्वाभाविक, आदरपूर्ण हिन्दी अनुरोध में व्यक्त करता है।
- source_word: תַעֲבֹר מֵעַל
  choice: के पास से आगे निकल जाइए
  rationale: क्रिया और पूर्वसर्ग का आशय किसी के पास से गुजरकर आगे बढ़ जाना है; यह चयन उस गतिशील अर्थ को स्पष्ट रखता है।
- source_word: עַבְדֶּךָ
  choice: अपने सेवक
  rationale: यहाँ अब्राहम आदरपूर्वक अपने लिए अधीनता-सूचक भाषा बोलता है; ‘सेवक’ इस सामाजिक और विनम्र प्रयोग के लिए स्वाभाविक है।
theological_decisions:
- issue: אֲדֹנָי को परमेश्वर की उपाधि माना जाए या आगन्तुक के लिए सम्मानसूचक सम्बोधन
  choice: मेरे प्रभु
  alternative: हे प्रभु
  rationale: उत्पत्ति 18 में यहोवा के प्रकट होने का व्यापक प्रसंग है, पर तत्काल वाक्य एक आगन्तुक को एकवचन में सम्बोधित करता है। मुख्य पाठ सम्मानसूचक अर्थ रखता है और पादटिप्पणी परमेश्वर को सीधे सम्बोधित करने की सम्भावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरपूर्ण एकवचन के लिए ‘आप’ रूप, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज शब्दावली।
