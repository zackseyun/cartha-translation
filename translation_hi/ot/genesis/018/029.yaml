  text: וַ/יֹּ֨סֶף ע֜וֹד לְ/דַבֵּ֤ר אֵלָי/ו֙ וַ/יֹּאמַ֔ר אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם אַרְבָּעִ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה בַּ/עֲב֖וּר הָ/אַרְבָּעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/029.yaml
  text: He spoke to him again and said[a], “Perhaps forty will be found there.” And he said[b], “I will not do it for the sake of the forty.”
translation:
  language: hi
  text: उसने फिर उससे कहा, “शायद वहाँ चालीस मिलें।” तब उसने कहा, “उन चालीस की खातिर मैं ऐसा नहीं करूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר אֵלָיו וַיֹּאמַר
  choice: उसने फिर उससे कहा
  rationale: יסף + עוד + infinitive पुनरावृत्ति/निरंतरता का भाव देता है। हिंदी में दोहरे कथन-क्रिया-प्रयोग की अनावश्यक पुनरुक्ति से बचते हुए ‘फिर ... कहा’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אוּלַי
  choice: शायद
  rationale: यह अब्राहम की विनम्र और अनिश्चित संभावना को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: יִמָּצְאוּן שָׁם אַרְבָּעִים
  choice: वहाँ चालीस मिलें
  rationale: מצא का निफ़अल रूप ‘पाए जाएँ/मिलें’ का निष्क्रिय भाव रखता है। हिंदी में संभावनार्थक ‘मिलें’ अधिक स्वाभाविक है और संदर्भ में चालीस धर्मियों का संकेत बना रहता है।
- source_word: לֹא אֶעֱשֶׂה
  choice: मैं ऐसा नहीं करूँगा
  rationale: इब्रानी में कर्म निहित है। ‘ऐसा’ पूर्ववर्ती संदर्भ की ओर संकेत करता है, पर मुख्य पाठ में ‘नष्ट करना’ जोड़कर आशय को आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: בַּעֲבוּר הָאַרְבָּעִים
  choice: उन चालीस के कारण
  rationale: בַּעֲבוּר यहाँ उन चालीस व्यक्तियों के कारण कार्रवाई रोकने का आधार बताता है। ‘के कारण’ वर्तमान हिंदी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: לֹא אֶעֱשֶׂה में परमेश्वर की कार्रवाई का निहित कर्म
  choice: ऐसा नहीं करूँगा
  alternative: उसे नष्ट नहीं करूँगा
  rationale: मूल इब्रानी केवल ‘मैं नहीं करूँगा’ कहता है और कार्रवाई को प्रसंग से समझने देता है। ‘ऐसा’ हिंदी में अर्थपूर्ण रहते हुए इसी अस्पष्टता को यथासंभव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। वक्ताओं की पहचान प्रसंग से स्पष्ट होने के कारण मूल पाठ की तरह सर्वनाम बनाए रखे गए हैं। ‘चालीस’ के साथ ‘धर्मी लोग’ नहीं जोड़ा गया, क्योंकि इस पद में संज्ञा मूलतः निहित है।
