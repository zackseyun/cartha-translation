source:
  edition: WLC
  text: וַ/תִּצְחַ֥ק שָׂרָ֖ה בְּ/קִרְבָּ֣/הּ לֵ/אמֹ֑ר אַחֲרֵ֤י בְלֹתִ/י֙ הָֽיְתָה לִּ֣/י עֶדְנָ֔ה וַֽ/אדֹנִ֖/י זָקֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/012.yaml
  text: So Sarah laughed to herself[a], saying, “After I am worn out, shall I have pleasure, while my lord is old?”
translation:
  language: hi
  text: तब सारा अपने मन में हँसी और कहने लगी, “जब मैं क्षीण हो चुकी हूँ, तब क्या मुझे सुख मिलेगा[a], जबकि मेरे स्वामी बूढ़े हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्या मुझे आनंद मिलेगा?” यहाँ दाम्पत्य सुख या फिर से यौवन की स्फूर्ति का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְחַק
  choice: हँसी
  rationale: צחק का काल रूप यहाँ सामान्यतः ‘हँसना’ व्यक्त करता है; प्रसंग सारा की भीतर की प्रतिक्रिया का है।
- source_word: בְּקִרְבָּהּ
  choice: अपने मन में
  rationale: शाब्दिक अर्थ ‘अपने भीतर’ है; ‘अपने मन में’ आधुनिक हिन्दी में भीतर ही भीतर हुई प्रतिक्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֵאמֹר
  choice: कहने लगी
  rationale: यह रूप आगे आने वाले कथन का परिचय देता है; भीतर की स्थिति पिछले पदबंध से स्पष्ट है।
- source_word: אַחֲרֵי בְלֹתִי
  choice: जब मैं जीर्ण हो चुकी हूँ
  rationale: בלה में घिस जाने या क्षीण हो जाने का भाव है। ‘जीर्ण’ शारीरिक क्षीणता को बनाए रखता है और केवल ‘बूढ़ी’ कहने से बचता है, क्योंकि आगे अब्राहम की वृद्धावस्था अलग से कही गई है।
- source_word: הָיְתָה לִּי עֶדְנָה
  choice: क्या मुझे सुख मिलेगा
  rationale: वाक्यरचना भावी संभावना का प्रश्न व्यक्त करती है। ‘सुख’ दुर्लभ संज्ञा עֶדְנָה के व्यापक आनंद, दाम्पत्य सुख अथवा नई शारीरिक स्फूर्ति के संभावित अर्थों को अनावश्यक रूप से सीमित नहीं करता।
- source_word: עֶדְנָה
  choice: सुख
  rationale: यह व्यापक और संयत हिन्दी शब्द है, जो प्रसंग के शारीरिक और दाम्पत्य संकेतों के लिए जगह छोड़ता है; अधिक विशिष्ट संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: וַאדֹנִי
  choice: मेरे स्वामी
  rationale: यह सारा द्वारा अब्राहम के लिए प्रयुक्त आदरसूचक संबोधन है, परमेश्वर की उपाधि नहीं।
- source_word: זָקֵן
  choice: बूढ़े हैं
  rationale: यह सरल और प्रत्यक्ष आधुनिक हिन्दी अभिव्यक्ति है।
theological_decisions:
- issue: עֶדְנָה में निहित अर्थ
  choice: मुख्य पाठ में व्यापक शब्द ‘सुख’
  alternative: दाम्पत्य सुख; यौन आनंद; फिर से यौवन की स्फूर्ति
  rationale: इब्रानी शब्द सारा की वृद्ध देह और वैवाहिक स्थिति के संदर्भ में शारीरिक या दाम्पत्य संकेत रख सकता है, पर उसका अर्थ केवल एक संभावना तक सीमित नहीं है। व्यापक अनुवाद मूल की अर्थगत खुलावट बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘अपने मन में’ आंतरिक हँसी को स्वाभाविक हिन्दी में व्यक्त करता है; ‘जीर्ण’ मूल के क्षीण या घिस चुके होने के शारीरिक भाव को सुरक्षित रखता है।
