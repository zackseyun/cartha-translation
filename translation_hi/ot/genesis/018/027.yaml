language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֥עַן אַבְרָהָ֖ם וַ/יֹּאמַ֑ר הִנֵּה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י וְ/אָנֹכִ֖י עָפָ֥ר וָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/027.yaml
  text: Then Abraham answered and said[a], “Behold, please, I have dared to speak to my Lord, though I am dust and ashes.”
translation:
  language: hi
  text: तब अब्राहम ने उत्तर देकर कहा, “देखिए तो, मैंने अपने प्रभु[a] से बात करने का साहस किया है, यद्यपि मैं धूल और राख हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे स्वामी।” हिब्रानी रूप आदरपूर्ण संबोधन भी हो सकता है; यहाँ प्रसंग संबोधित व्यक्ति की पहचान यहोवा से कराता है, इसलिए “प्रभु” किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: ने उत्तर दिया
  rationale: हिब्रानी के दोहरे कथन-सूत्र का अर्थ स्वाभाविक आधुनिक हिन्दी में एक ही वाक्यांश से व्यक्त होता है; ‘उत्तर देकर कहा’ अनावश्यक रूप से भारी लगता है।
- source_word: הִנֵּה נָא
  choice: देखिए, कृपा करके
  rationale: הִנֵּה ध्यान आकर्षित करता है और נָא विनम्र निवेदन जोड़ता है। यह रूप दोनों कार्यों को आधुनिक, आदरपूर्ण हिन्दी में बनाए रखता है।
- source_word: הוֹאַלְתִּי
  choice: मैंने ... साहस किया है
  rationale: इस संदर्भ में क्रिया अपने ऊपर कुछ लेने अथवा विनम्रता के साथ ऐसा करने का साहस करने का भाव देती है; अब्राहम की दीनता और निर्भीक निवेदन दोनों सुरक्षित रहते हैं।
- source_word: לְדַבֵּר אֶל
  choice: से बात करने
  rationale: हिन्दी में किसी संबोधित व्यक्ति के साथ ‘बात करना’ स्वाभाविक है और דִּבֵּר का अपेक्षित अर्थ देता है।
- source_word: אֲדֹנָי
  choice: अपने प्रभु
  rationale: रूप का अर्थ ‘मेरे प्रभु/स्वामी’ है। हिन्दी में ‘अपने प्रभु से’ वक्ता-संबंध को स्वाभाविक ढंग से व्यक्त करता है; संदर्भ में संबोधित व्यक्ति यहोवा से पहचाना गया है, पर मानवीय सम्मानसूचक संबोधन की भाषिक संभावना भी टिप्पणी में रखी गई है।
- source_word: וְאָנֹכִי
  choice: यद्यपि मैं
  rationale: शाब्दिक ‘और मैं’ यहाँ अब्राहम के साहस और उसकी तुच्छता के बीच विरोध प्रकट करता है; ‘यद्यपि’ उस निहित concessive संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: עָפָר וָאֵפֶר
  choice: धूल और राख
  rationale: यह नश्वरता और नगण्यता व्यक्त करने वाला युग्म है; हिन्दी में ‘धूल और राख’ सीधा और प्रतिष्ठित समतुल्य है।
theological_decisions:
- issue: अब्राहम के संबोधन אֲדֹנָי का अनुवाद
  choice: अपने प्रभु
  alternative: अपने स्वामी
  rationale: हिब्रानी रूप आदरपूर्वक किसी श्रेष्ठ व्यक्ति को संबोधित कर सकता है, जबकि निकटवर्ती संदर्भ में अब्राहम का संबोधन यहोवा से जुड़ा है। ‘प्रभु’ संदर्भगत दिव्य पहचान को व्यक्त करता है, और पाद-टिप्पणी भाषिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘देखिए, कृपा करके’ विनम्र निवेदन को व्यक्त करता है, और ‘साहस किया है’ अब्राहम की दीनता तथा निर्भीकता के तनाव को बनाए रखता है।
