  yaml_path: translation/ot/genesis/048/008.yaml
  text: When Israel saw Joseph's sons[a], he said[b], “Who are these?”
translation:
  language: hi
  text: जब इस्राएल[a] ने यूसुफ के पुत्रों को देखा, तो उसने कहा, “ये कौन हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी पाठ में याकूब के लिए ‘इस्राएल’ नाम प्रयुक्त है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: जब ... ने ... देखा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है और अगले कथन की परिस्थिति बताता है; हिंदी में ‘जब’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ में ‘याकूब’ नहीं, बल्कि उसकी वाचा-संबंधी पहचान ‘इस्राएल’ प्रयुक्त हुई है; इसलिए वही नाम रखा गया है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का व्याकरणिक चिह्न है और हिंदी में इसका कोई स्वतंत्र शब्द-समानार्थी नहीं है।
- source_word: בְּנֵי יוֹסֵף
  choice: यूसुफ के पुत्रों
  rationale: इब्रानी संबंधसूचक पदबंध का सीधा और स्वाभाविक हिंदी रूप ‘यूसुफ के पुत्र’ है। ‘पुत्रों’ यहाँ क्रिया के कर्म के रूप में आया है।
- source_word: וַיֹּאמֶר
  choice: तो उसने पूछा
  rationale: शाब्दिक अर्थ ‘उसने कहा’ है, पर प्रत्यक्ष वचन प्रश्न है; इसलिए वर्तमान हिंदी में ‘उसने पूछा’ संवाद की क्रिया को अधिक स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘तो’ कथात्मक क्रम बनाए रखता है।
- source_word: מִי אֵלֶּה
  choice: ये कौन हैं?
  rationale: बहुवचन संकेतवाचक और पहचान पूछने वाले प्रश्न का स्वाभाविक तथा सटीक हिंदी रूप।
theological_decisions:
- issue: पितामह के नाम का रूप
  choice: इस्राएल
  alternative: याकूब
  rationale: इस पद में इब्रानी पाठ जानबूझकर ‘इस्राएल’ कहता है; उसे ‘याकूब’ से बदलने पर मूल पाठ का नाम-चयन मिट जाएगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुत्र’ ने पारिवारिक संदर्भ में औपचारिकता और स्पष्टता बनाए रखी है; ‘ये कौन हैं?’ सामान्य आधुनिक हिंदी का स्वाभाविक प्रश्न है।
