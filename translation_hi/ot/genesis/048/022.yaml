  text: וַ/אֲנִ֞י נָתַ֧תִּֽי לְ/ךָ֛ שְׁכֶ֥ם אַחַ֖ד עַל אַחֶ֑י/ךָ אֲשֶׁ֤ר לָקַ֨חְתִּי֙ מִ/יַּ֣ד הָֽ/אֱמֹרִ֔י בְּ/חַרְבִּ֖/י וּ/בְ/קַשְׁתִּֽ/י־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/022.yaml
  text: And I give you one portion above your brothers[a], which I took from the hand of the Amorite with my sword and with my bow.
translation:
  language: hi
  text: और मैं स्वयं तुम्हें तुम्हारे भाइयों से अधिक एक भाग[a] देता हूँ, जिसे मैंने अपनी तलवार और अपने धनुष से एमोरी के हाथ से लिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द שְׁכֶם (शकेम) का अर्थ ‘कंधा’ या ‘पर्वतीय ढाल’ भी हो सकता है और यह ‘शकेम’ स्थान-नाम की ओर संकेत कर सकता है। इसलिए इस कथन में भाइयों से अधिक एक भाग और बाद में यूसुफ से जुड़े शकेम—दोनों की ओर जानबूझकर संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: और मैं स्वयं
  rationale: स्वतंत्र सर्वनाम אֲנִי क्रिया में पहले से निहित कर्ता पर बल देता है; ‘मैं स्वयं’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נָתַתִּי
  choice: देता हूँ
  rationale: रूप पूर्णकालिक है, पर याकूब की वसीयतनुमा घोषणा में यह तत्काल प्रभाव से किए जा रहे औपचारिक प्रदान को व्यक्त कर सकता है।
- source_word: שְׁכֶם אַחַד
  choice: एक भाग
  rationale: इस प्रसंग में जोसेफ को भाइयों से अधिक विरासत का एक अंश देना प्रमुख अर्थ है। שְׁכֶם में ‘कंधा/पर्वतीय ढाल’ का अर्थ और शकेम स्थान-नाम की प्रतिध्वनि भी संभव है; उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עַל אַחֶיךָ
  choice: तुम्हारे भाइयों से अधिक
  rationale: यहाँ עַל लाभ या अतिरिक्तता का तुलनात्मक भाव देता है; हिन्दी में ‘से अधिक’ इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: אֲשֶׁר לָקַחְתִּי
  choice: जिसे मैंने ... लिया था
  rationale: सम्बन्धवाचक उपवाक्य और לקח के सीधे अर्थ को बनाए रखता है; अधिग्रहण का ढंग आगे के हथियारों वाले वाक्यांश से स्पष्ट होता है।
- source_word: מִיַּד הָאֱמֹרִי
  choice: एमोरी के हाथ से
  rationale: ‘हाथ से’ मूल इब्रानी मुहावरे और किसी के अधिकार या कब्ज़े से लेने, दोनों को बनाए रखता है। एकवचन ‘एमोरी’ को सामूहिक अथवा प्रतिनिधिक प्रयोग के रूप में सुरक्षित रखा गया है।
- source_word: בְּחַרְבִּי וּבְקַשְׁתִּי
  choice: अपनी तलवार और अपने धनुष से
  rationale: दोनों हथियारों को स्पष्टतः साधन के रूप में प्रस्तुत करता और मूल की युद्ध-संबंधी छवि बनाए रखता है।
theological_decisions:
- issue: שְׁכֶם का सामान्य संज्ञा के रूप में अर्थ, शकेम स्थान-नाम से उसका शब्दालंकार, और जोसेफ के अतिरिक्त उत्तराधिकार का संबंध
  choice: मुख्य पाठ में ‘एक भाग’ और पादटिप्पणी में ‘कंधा/पर्वतीय ढाल’ तथा शकेम स्थान-नाम की सम्भावित प्रतिध्वनि
  alternative: मुख्य पाठ में ‘एक पर्वतीय ढाल’ अथवा ‘शकेम—एक भाग’
  rationale: प्रसंग अतिरिक्त उत्तराधिकार के अर्थ का समर्थन करता है, किंतु इब्रानी शब्द की भौगोलिक अर्थ-छाया और शकेम से सम्भावित शब्दालंकार वास्तविक हैं। पादटिप्पणी इस बहुअर्थकता को बिना किसी एक संकेत को अनावश्यक रूप से निर्णायक बनाए सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मैं स्वयं’ मूल के बलाघात को, ‘भाग’ विरासत के प्रसंग को, और पादटिप्पणी שְׁכֶם की वास्तविक बहुअर्थकता को सुरक्षित रखती है।
