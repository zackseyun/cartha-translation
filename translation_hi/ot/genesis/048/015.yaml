  yaml_path: translation/ot/genesis/048/015.yaml
  text: And he blessed Joseph and said[a], “The God before whom my fathers Abraham and Isaac walked[b], the God who has shepherded me from my beginning to this day,”
translation:
  language: hi
  text: उसने यूसुफ को आशीर्वाद दिया और कहा, “वह परमेश्वर, जिसके सामने मेरे पूर्वज अब्राहम और इसहाक चलते रहे; वह परमेश्वर, जो मेरे जीवन के आरम्भ[b] से आज तक मेरा चरवाहा रहा है[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी चरवाही करता आया है” अथवा “मुझे चराता आया है।” इब्रानी क्रिया में चरवाहे की निरंतर देखभाल और पालन-पोषण का चित्र है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरे जीवन भर।” इब्रानी अभिव्यक्ति याकूब के जीवन अथवा अस्तित्व के आरम्भिक समय की ओर संकेत करती है और इस बात पर बल देती है कि परमेश्वर आरम्भ से उसकी देखभाल करता आया है।
    reason: lexical_alternative
