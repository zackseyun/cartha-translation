  text: וַ/יַּ֣רְא יוֹסֵ֗ף כִּי יָשִׁ֨ית אָבִ֧י/ו יַד יְמִינ֛/וֹ עַל רֹ֥אשׁ אֶפְרַ֖יִם וַ/יֵּ֣רַע בְּ/עֵינָ֑י/ו וַ/יִּתְמֹ֣ךְ יַד אָבִ֗י/ו לְ/הָסִ֥יר אֹתָ֛/הּ מֵ/עַ֥ל רֹאשׁ אֶפְרַ֖יִם עַל רֹ֥אשׁ מְנַשֶּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/017.yaml
  text: When Joseph saw that his father had placed his right hand on Ephraim’s head[a], it was displeasing in his eyes, and he took hold of his father’s hand to remove it from Ephraim’s head to Manasseh’s head.
translation:
  language: hi
  text: जब यूसुफ ने देखा कि उसके पिता ने अपना दाहिना हाथ एप्रैम के सिर पर रखा था, तो उसे यह बुरा लगा[a]; और उसने अपने पिता का हाथ थाम लिया, ताकि उसे एप्रैम के सिर से हटाकर मनश्शे के सिर पर रख दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यह उसकी आँखों में बुरा था,” अर्थात उसे यह अच्छा नहीं लगा।
    reason: मूल इब्रानी मुहावरे की आँखों-संबंधी छवि और उसके प्रसंगगत अर्थ—दोनों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: जब यूसुफ ने देखा कि
  rationale: कथा के क्रम और כִּי द्वारा प्रस्तुत देखी गई बात—दोनों को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָשִׁית
  choice: रख दिया है
  rationale: हाथ को सिर पर रखने की पूरी हो चुकी क्रिया को यूसुफ की दृष्टि से स्पष्ट करता है; हिन्दी में निकट भूतकाल इस प्रसंग में स्वाभाविक है।
- source_word: יַד יְמִינוֹ
  choice: अपना दाहिना हाथ
  rationale: मूल के ठोस अंग-संबंधी पद और आशीर्वाद के संकेत की महत्ता को बनाए रखता है।
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: उसे यह बुरा लगा
  rationale: हिन्दी में अर्थ को स्वाभाविक रूप से देता है; मूल का शाब्दिक आँखों-वाला मुहावरा पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיִּתְמֹךְ
  choice: पकड़ लिया
  rationale: תמך के पकड़ने/थामने के अर्थ को यहाँ की शारीरिक क्रिया के अनुरूप व्यक्त करता है, बिना अनावश्यक कठोरता जोड़े।
- source_word: לְהָסִיר אֹתָהּ
  choice: ताकि उसे ... हटाकर ... रख दे
  rationale: उद्देश्यसूचक לְ को स्पष्ट करता है और हाथ को एक सिर से दूसरे सिर पर ले जाने की दिशा बनाए रखता है।
- source_word: מֵעַל רֹאשׁ אֶפְרַיִם עַל רֹאשׁ מְנַשֶּׁה
  choice: एप्रैम के सिर पर से हटाकर मनश्शे के सिर पर
  rationale: מֵעַל और עַל की स्थानिक दिशा को सहज हिन्दी में स्पष्ट रूप से व्यक्त करता है।
