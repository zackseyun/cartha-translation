id: GEN.48.9
reference: Genesis 48:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל אָבִ֔י/ו בָּנַ֣/י הֵ֔ם אֲשֶׁר נָֽתַן לִ֥/י אֱלֹהִ֖ים בָּ/זֶ֑ה וַ/יֹּאמַ֕ר קָֽחֶ/ם נָ֥א אֵלַ֖/י וַ/אֲבָרֲכֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/009.yaml
  text: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
translation:
  language: hi
  text: यूसुफ ने अपने पिता से कहा, “ये मेरे बेटे हैं, जिन्हें परमेश्वर ने मुझे यहाँ[a] दिया है।” तब उसके पिता ने कहा, “कृपया इन्हें मेरे पास ले आओ[b], ताकि मैं इन्हें आशीर्वाद दूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस स्थान में।” हिब्रू अभिव्यक्ति यूसुफ के वर्तमान स्थान की ओर अधिक विशेष रूप से संकेत कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “कृपया इन्हें मेरे पास ले आओ, और मैं इन्हें आशीर्वाद दूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַי הֵם
  choice: ये मेरे बेटे हैं
  rationale: ‘बेटे’ पुल्लिंग बहुवचन को ठीक रूप से व्यक्त करता है; संकेतवाचक ‘ये’ सामने उपस्थित दोनों पुत्रों की पहचान को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: אֲשֶׁר נָתַן לִי אֱלֹהִים
  choice: जिन्हें परमेश्वर ने मुझे ... दिया है
  rationale: यह रचना पुत्रों को परमेश्वर की देन बताती है और भूतकालीन दान के वर्तमान परिणाम को स्वाभाविक हिंदी में व्यक्त करती है।
- source_word: בָּזֶה
  choice: यहाँ
  rationale: इस संकेतवाचक अभिव्यक्ति का प्रसंगानुकूल अर्थ यूसुफ का वर्तमान स्थान, अर्थात मिस्र, है; ‘यहाँ’ संक्षिप्त और स्वाभाविक है।
- source_word: קָחֶם נָא אֵלַי
  choice: कृपया इन्हें मेरे पास ले आओ
  rationale: לקח का मूल भाव ‘लेना/ले जाना’ है, पर वक्ता की ओर गति होने के कारण हिंदी में ‘ले आओ’ स्वाभाविक है; ‘कृपया’ נָא की विनम्रता व्यक्त करता है।
- source_word: וַאֲבָרֲכֵם
  choice: ताकि मैं इन्हें आशीर्वाद दूँ
  rationale: अनुरोध के बाद आया यह क्रियारूप उद्देश्य/इच्छा का भाव रखता है; ‘ताकि ... दूँ’ उसे सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: אֱלֹהִים का संदर्भ
  choice: परमेश्वर
  alternative: ईश्वर / कोई देवता
  rationale: कुलपिताओं की कथा और यूसुफ के कथन के संदर्भ में यह इस्राएल के एकमात्र परमेश्वर को दर्शाता है; ‘परमेश्वर’ आधुनिक हिंदी बाइबलीय भाषा में स्पष्ट और प्रतिष्ठित है।
- issue: आशीर्वाद देने की अभिव्यक्ति
  choice: ताकि मैं इन्हें आशीर्वाद दूँ
  alternative: और मैं इन्हें आशीर्वाद दूँगा
  rationale: हिब्रू रूप अनुरोध के उद्देश्य अथवा वक्ता की इच्छा को व्यक्त कर सकता है। उद्देश्यवाचक अनुवाद चुना गया है, जबकि भविष्यवाचक अर्थ भी संभव है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दूसरे कथन के वक्ता को प्रसंग के आधार पर ‘उसके पिता’ कहकर स्पष्ट किया गया है, ताकि हिंदी में सर्वनामगत अस्पष्टता न रहे।
