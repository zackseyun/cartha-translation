  text: וַ/יְהִ֗י אַחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יֹּ֣אמֶר לְ/יוֹסֵ֔ף הִנֵּ֥ה אָבִ֖י/ךָ חֹלֶ֑ה וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י בָנָי/ו֙ עִמּ֔/וֹ אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/001.yaml
  text: After these things[a], it was said to Yoseph, “Look, your father is sick.” So he took his two sons with him, Manasseh and Ephraim.
translation:
  language: hi
  text: इन बातों के बाद किसी ने यूसुफ से कहा, “देखो, तुम्हारे पिता बीमार हैं।” तब वह अपने दोनों पुत्रों, मनश्शे और एप्रैम को अपने साथ ले गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: इन बातों के बाद
  rationale: यह स्वाभाविक हिन्दी में नए कथात्मक घटनाक्रम को आरम्भ करता है और ‘इन बातों के बाद’ द्वारा पिछले प्रसंग से स्पष्ट कालगत संबंध बनाए रखता है; וַיְהִי के लिए अलग से कृत्रिम या पुरातन ‘और ऐसा हुआ’ आवश्यक नहीं है।
- source_word: וַיֹּאמֶר לְיוֹסֵף
  choice: किसी ने यूसुफ से कहा
  rationale: इब्रानी में वक्ता का नाम नहीं दिया गया है। ‘किसी ने’ इस अनिश्चितता को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाले कण की तात्कालिकता को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: אָבִיךָ חֹלֶה
  choice: तुम्हारे पिता बीमार हैं
  rationale: वर्तमान अवस्था का सीधा और स्वाभाविक हिन्दी रूप। पिता के लिए आदरसूचक बहुवचन क्रिया हिन्दी की सामान्य मर्यादित शैली के अनुरूप है।
- source_word: וַיִּקַּח אֶת שְׁנֵי בָנָיו עִמּוֹ
  choice: तब वह अपने दोनों पुत्रों ... को अपने साथ ले गया
  rationale: ‘तब’ कथानक की अगली क्रिया को सहज रूप से आगे बढ़ाता है। ‘पुत्रों’ गरिमापूर्ण किंतु सामान्य आधुनिक हिन्दी है, और ‘अपने साथ ले गया’ עִמּוֹ को स्पष्ट करता है।
- source_word: מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: मनश्शे और एप्रैम
  rationale: ये हिन्दी बाइबिल परंपरा में प्रचलित और मूल नामों के निकट रूप हैं; दोनों नाम ‘अपने दोनों पुत्रों’ के समानाधिकरण में रखे गए हैं।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण कथात्मक शैली। अज्ञात वक्ता को ‘किसी ने’ कहकर मूल की अनिश्चितता सुरक्षित रखी गई है। किसी पाठकीय पादटिप्पणी की आवश्यकता नहीं, क्योंकि यह अस्पष्टता मुख्य पाठ में ही स्पष्ट रूप से संरक्षित है।
