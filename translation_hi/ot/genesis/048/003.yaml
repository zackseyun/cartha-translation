    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: फिर ... ने ... कहा
  rationale: वाव-क्रमिक कथा की अगली घटना को आगे बढ़ाता है। ‘फिर’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵל שַׁדַּי
  choice: सर्वशक्तिमान परमेश्वर
  rationale: यह एक ईश्वरीय उपाधि है। यह प्रचलित हिन्दी अर्थ को स्पष्ट रखता है, जबकि שַׁדַּי की सटीक अर्थ-छाया विवादित होने के कारण ‘एल शद्दाय’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נִרְאָה אֵלַי
  choice: मुझे दर्शन दिया
  rationale: निफ़अल रूप यहाँ ईश्वरीय प्रत्यक्ष प्रकट होने को व्यक्त करता है। ‘मुझे दर्शन दिया’ स्वाभाविक, गरिमापूर्ण हिन्दी है और दृश्य प्रकटता के भाव को बनाए रखता है।
- source_word: בְּלוּז
  choice: लूज़ में
  rationale: नामित स्थान पर घटना घटने को आधुनिक हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश के
  rationale: मूल के ‘देश/भूमि’ तत्व को सुरक्षित रखते हुए लूज़ के भौगोलिक स्थान को स्पष्ट करता है।
- source_word: וַיְבָרֶךְ אֹתִי
  choice: और मुझे आशीष दी
  rationale: क्रिया का कर्ता वही परमेश्वर है; हिन्दी में कर्ता दोहराए बिना वाक्य स्वाभाविक रहता है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֵל שַׁדַּי का अनुवाद
  choice: सर्वशक्तिमान परमेश्वर
  alternative: एल शद्दाय
  rationale: मुख्य पाठ में उपाधि का प्रचलित अर्थ दिया गया है, पर שַׁדַּי की सटीक व्युत्पत्ति और अर्थ-छाया निश्चित नहीं है; इसलिए लिप्यंतरण को पादटिप्पणी में रखा गया है ताकि वास्तविक शब्दार्थगत अनिश्चितता बनी रहे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लूज़’ स्थाननाम का निकट लिप्यंतरण है। ईश्वरीय प्रकटता के लिए ‘दर्शन दिया’ सामान्य पाठक के लिए बोधगम्य है और मूल के आशय से आगे कोई विशेष दार्शनिक व्याख्या नहीं जोड़ता।
