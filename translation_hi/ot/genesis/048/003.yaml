  text: फिर याकूब ने यूसुफ से कहा, “सर्वशक्तिमान परमेश्वर[a] कनान देश के लूज़ में मेरे सामने प्रकट हुए और मुझे आशीष दी।”
  philosophy: optimal-equivalence
  footnotes:
