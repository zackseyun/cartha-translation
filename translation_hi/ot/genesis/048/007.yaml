  text: וַ/אֲנִ֣י בְּ/בֹאִ֣/י מִ/פַּדָּ֗ן מֵ֩תָה֩ עָלַ֨/י רָחֵ֜ל בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ בַּ/דֶּ֔רֶךְ בְּ/ע֥וֹד כִּבְרַת אֶ֖רֶץ לָ/בֹ֣א אֶפְרָ֑תָה וָ/אֶקְבְּרֶ֤/הָ שָּׁם֙ בְּ/דֶ֣רֶךְ אֶפְרָ֔ת הִ֖וא בֵּ֥ית לָֽחֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/007.yaml
  text: As for me[a], when I came from Paddan, Rachel died to my sorrow in the land of Canaan on the way, while there was still some distance to go to Ephrath; and I buried her there on the way to Ephrath (that is[c][b], Bethlehem).
translation:
  language: hi
  text: और मैं—जब मैं पद्दान[a] से आ रहा था, तब कनान देश में रास्ते में राहेल मेरे पास मर गई[b], जबकि एप्रात पहुँचने के लिए अभी कुछ दूरी बाकी थी[c]; और मैंने उसे वहीं एप्रात के मार्ग में दफनाया (अर्थात् बेतलेहेम)।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में केवल “पद्दान” है; संबंधित पदों के आधार पर इसे कभी-कभी “पद्दान-अराम” कहा जाता है।
    reason: lexical_alternative
  - marker: b
    text: “मेरे पास मर गई” के पीछे का इब्रानी मुहावरा शाब्दिक रूप से “मुझ पर मर गई” है। यह उसकी मृत्यु के याकूब के निकट होने या उस मृत्यु के उस पर पड़े निजी भार—दोनों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: “कुछ दूरी” एक इब्रानी मुहावरे का अनुवाद है जो शेष भूमि/दूरी के एक हिस्से को दर्शाता है; इसकी ठीक माप निश्चित नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: और मैं—
  rationale: संयोजक और स्वतंत्र सर्वनाम याकूब के निजी स्मरण की ओर विषयगत मोड़ तथा बल दिखाते हैं; हिंदी में विराम-चिह्न सहित यह रूप स्वाभाविक है।
- source_word: בְּבֹאִי מִפַּדָּן
  choice: जब मैं पद्दान से लौट रहा था
  rationale: בוא का मूल अर्थ ‘आना’ है, पर वक्ता की यात्रा और हिंदी कथन-प्रवाह में ‘लौट रहा था’ दिशा को स्वाभाविक रूप से व्यक्त करता है; स्थान-नाम को स्रोत के संक्षिप्त रूप ‘पद्दान’ में रखा गया है।
- source_word: מֵתָה עָלַי
  choice: मेरे पास मर गई
  rationale: शाब्दिक मुहावरा ‘मुझ पर मर गई’ है। ‘मेरे पास’ उसके याकूब के निकट मरने का स्थानिक-व्यक्तिगत भाव रखता है, जबकि भावनात्मक अर्थ को निर्णायक नहीं बनाता; अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: בְּאֶרֶץ כְּנַעַן בַּדֶּרֶךְ
  choice: कनान देश में, रास्ते में ही
  rationale: भौगोलिक और मार्ग-संबंधी दोनों सूचनाएँ रखी गई हैं; ‘ही’ राहेल के मार्ग में मरने पर स्वाभाविक हिंदी बल देता है।
- source_word: בְּעוֹד כִּבְרַת אֶרֶץ לָבֹא אֶפְרָתָה
  choice: उस समय एप्रात पहुँचने में अभी कुछ दूरी बाकी थी
  rationale: כברת ארץ अनिश्चित लंबाई वाली बची हुई दूरी का मुहावरा है; ‘कुछ दूरी’ झूठी सटीकता से बचता है।
- source_word: וָאֶקְבְּרֶהָ שָּׁם
  choice: इसलिए मैंने उसे वहीं ... दफ़ना दिया
  rationale: दफ़नाने की अगली क्रिया और निर्दिष्ट स्थान स्पष्ट हैं। हिंदी में ‘इसलिए’ संदर्भगत परिणाम को सहज बनाता है, यद्यपि हिब्रू संयोजक सामान्य कथात्मक क्रम भी व्यक्त कर सकता है।
- source_word: בְּדֶרֶךְ אֶפְרָת
  choice: एप्रात के रास्ते में
  rationale: यह मार्ग/स्थान को एप्रात के संबंध में बताता है; हिंदी में ‘के रास्ते में’ स्वाभाविक है।
- source_word: הִוא בֵּית לָחֶם
  choice: एप्रात ही बेतलेहेम है
  rationale: हिब्रू की पहचानसूचक व्याख्या को सीधे और स्पष्ट रूप में रखा गया है।
theological_decisions:
- issue: מֵתָה עָלַי में स्थानिक और भावनात्मक अर्थ की अस्पष्टता
  choice: मुख्य पाठ में ‘मेरे पास मर गई’
  alternative: ‘मेरे दुःख के लिए मर गई’ / ‘मुझ पर मर गई’
  rationale: स्रोत का עָלַי व्यक्तिगत निकटता, घटना का याकूब पर आ पड़ना, अथवा शोक का भार सुझा सकता है। मुख्य पाठ स्थानिक-व्यक्तिगत अर्थ रखता है और पादटिप्पणी अन्य संभावना को सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। लंबे हिब्रानी वाक्य को स्पष्टता के लिए तीन वाक्यों में बाँटा गया है। स्थान-नाम पद्दान, एप्रात और बेतलेहेम स्रोत के निकट रखे गए हैं।
