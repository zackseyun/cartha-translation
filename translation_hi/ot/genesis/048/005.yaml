  text: וְ/עַתָּ֡ה שְׁנֵֽי בָנֶי/ךָ֩ הַ/נּוֹלָדִ֨ים לְ/ךָ֜ בְּ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּאִ֥/י אֵלֶ֛י/ךָ מִצְרַ֖יְמָ/ה לִ/י הֵ֑ם אֶפְרַ֨יִם֙ וּ/מְנַשֶּׁ֔ה כִּ/רְאוּבֵ֥ן וְ/שִׁמְע֖וֹן יִֽהְיוּ לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/005.yaml
  text: And now[a], your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine; Ephraim and Manasseh shall be mine[c][b], like Reuben and Simeon.
translation:
  language: hi
  text: और अब, तेरे दोनों पुत्र, जो मिस्र देश में जन्मे—मेरे मिस्र में तेरे पास आने से पहले—मेरे हैं। एप्रैम और मनश्शे मेरे होंगे, जैसे रूबेन और शिमोन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: यह याकूब के कथन में अगले महत्त्वपूर्ण विषय को जोड़ता और उस पर बल देता है।
- source_word: שְׁנֵי בָנֶיךָ
  choice: तेरे दोनों पुत्र
  rationale: संख्या और संबंध दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַנּוֹלָדִים לְךָ
  choice: तुझसे उत्पन्न हुए
  rationale: इब्रानी कृदंत पुत्रों के जन्म और यूसुफ से उनके संबंध का वर्णन करता है; यह औपचारिक किन्तु सुबोध हिन्दी है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में
  rationale: मूल पाठ में व्यक्त אֶרֶץ (‘देश’) को बनाए रखता है।
- source_word: עַד בֹּאִי אֵלֶיךָ מִצְרָיְמָה
  choice: मेरे तेरे पास मिस्र आने तक
  rationale: עַד का औपचारिक अर्थ ‘तक’ सुरक्षित रखता है और मिस्र की पुनरावृत्ति सहित मूल वाक्य की स्थान-सूचना को स्पष्ट करता है; प्रसंगगत अर्थ पादटिप्पणी में बताया गया है।
- source_word: לִי הֵם
  choice: मेरे हैं
  rationale: याकूब के सीधे दावे को बिना तकनीकी ‘गोद लेने’ की शब्दावली जोड़े संक्षेप में प्रस्तुत करता है।
- source_word: אֶפְרַיִם וּמְנַשֶּׁה
  choice: एप्रैम और मनश्शे
  rationale: हिन्दी बाइबल परंपरा के परिचित नामरूपों का प्रयोग किया गया है।
- source_word: כִּרְאוּבֵן וְשִׁמְעוֹן
  choice: जैसे रूबेन और शिमोन
  rationale: उपसर्ग כְּ द्वारा व्यक्त तुलना को स्पष्ट और स्वाभाविक रूप में रखता है।
- source_word: יִהְיוּ לִי
  choice: मेरे होंगे
  rationale: भविष्यत् कथन और मूल के ‘मेरे हैं/मेरे होंगे’ क्रम को सुरक्षित रखता है।
theological_decisions:
- issue: एप्रैम और मनश्शे पर याकूब के दावे का स्वरूप
  choice: ‘मेरे हैं’ और ‘मेरे होंगे’ के रूप में सीधा दावा
  alternative: ‘मैं उन्हें अपने पुत्रों के रूप में गोद लेता हूँ’
  rationale: यह पद उन्हें रूबेन और शिमोन के तुल्य याकूब की संतान की हैसियत देता है, पर मूल इब्रानी में गोद लेने का कोई तकनीकी शब्द नहीं है; इसलिए उस कानूनी प्रक्रिया को मुख्य पाठ में स्पष्ट रूप से जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पारिवारिक संबोधन ‘तेरे/तुझसे’ रखा गया है, जो प्राचीन पितृसत्तात्मक संवाद के अनुरूप है। वाक्य को सुबोध बनाने के लिए दो वाक्यों में बाँटा गया है, जबकि ‘मिस्र’ की मूल पुनरावृत्ति और ‘मेरे हैं/मेरे होंगे’ का तनाव बनाए रखा गया है।
