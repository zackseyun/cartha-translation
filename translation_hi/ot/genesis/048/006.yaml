  yaml_path: translation/ot/genesis/048/006.yaml
  text: But your offspring whom you father after them will be yours[b][a]; they will be called by the name of their brothers in their inheritance.
translation:
  language: hi
  text: परन्तु तुम्हारी जो सन्तान उनके बाद जन्मी है, वह तुम्हारी होगी[a]; वे अपनी विरासत में अपने भाइयों के नाम से कहलाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् उन्हें अलग गोत्रीय विरासत नहीं मिलेगी, बल्कि वे एप्रैम और मनश्शे के नाम के अधीन गिने जाएँगे।
    reason: cross_reference
lexical_decisions:
- source_word: וּמוֹלַדְתְּךָ
  choice: तुमसे उत्पन्न होनेवाली सन्तान
  rationale: यह अभिव्यक्ति जन्मे हुए बच्चों/सन्तान का बोध कराती है और हिन्दी में स्वाभाविक रहते हुए मूल की व्यापकता बनाए रखती है।
- source_word: הוֹלַדְתָּ
  choice: तुमसे उत्पन्न होनेवाली
  rationale: हिफ़ील रूप यहाँ यूसुफ के पिता बनने, अर्थात उससे सन्तान उत्पन्न होने, को व्यक्त करता है; हिन्दी में यह पितृ-सन्दर्भ स्पष्ट और सहज है।
- source_word: אַחֲרֵיהֶם
  choice: उनके बाद
  rationale: सन्दर्भ एप्रैम और मनश्शे के बाद जन्म लेनेवाली सन्तान का है; यह मूल का सीधा अनुवाद है।
- source_word: לְךָ יִהְיוּ
  choice: तुम्हारी होगी
  rationale: यह एप्रैम और मनश्शे को याकूब का माने जाने के विपरीत पारिवारिक और उत्तराधिकार-संबंधी सम्बद्धता व्यक्त करता है।
- source_word: עַל שֵׁם אֲחֵיהֶם
  choice: अपने भाइयों के नाम से ही
  rationale: यह बाद की सन्तान को उनके भाइयों की गोत्रीय पहचान के अधीन गिने जाने का संकेत देता है; ‘नाम’ की मूल छवि सुरक्षित रखी गई है।
- source_word: אֲחֵיהֶם
  choice: अपने भाइयों
  rationale: मूल का शाब्दिक पारिवारिक शब्द रखा गया है; सन्दर्भ में भाई एप्रैम और मनश्शे हैं।
- source_word: יִקָּרְאוּ
  choice: पुकारे जाएँगे
  rationale: निफ़ाल रूप का सामान्य अर्थ ‘कहलाना/पुकारा जाना’ है और यहाँ किसी नाम के अधीन गिने जाने का भाव भी समाहित है।
- source_word: בְּנַחֲלָתָם
  choice: अपनी विरासत में
  rationale: נַחֲלָה पैतृक अथवा गोत्रीय उत्तराधिकार/भाग को दर्शाता है; ‘विरासत’ साधारण आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: बाद में जन्मी सन्तान की गोत्रीय उत्तराधिकार-स्थिति
  choice: मुख्य पाठ में ‘अपने भाइयों के नाम से ही ... पुकारे जाएँगे’ रखा गया और अर्थ फुटनोट में स्पष्ट किया गया।
  alternative: मुख्य पाठ में सीधे कहना कि उन्हें एप्रैम और मनश्शे के गोत्रों में गिना जाएगा।
  rationale: मूल पाठ नाम से पुकारे जाने की भाषा रखता है; व्याख्यात्मक अर्थ को मुख्य पाठ में प्रतिस्थापित करने के बजाय फुटनोट में देना मूल की रूपकात्मक और विधिक भाषा को बचाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘सन्तान’ सामूहिक एकवचन के रूप में मूल की व्यापकता रखता है; ‘विरासत’ उत्तराधिकार और गोत्रीय भाग दोनों के लिए सहज है।
