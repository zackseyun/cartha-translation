source:
  edition: WLC
  text: וַ/יִּקַּ֣ח יוֹסֵף֮ אֶת שְׁנֵי/הֶם֒ אֶת אֶפְרַ֤יִם בִּֽ/ימִינ/וֹ֙ מִ/שְּׂמֹ֣אל יִשְׂרָאֵ֔ל וְ/אֶת מְנַשֶּׁ֥ה בִ/שְׂמֹאל֖/וֹ מִ/ימִ֣ין יִשְׂרָאֵ֑ל וַ/יַּגֵּ֖שׁ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/013.yaml
  text: And Joseph took the two of them—Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right—and brought them near to him.
translation:
  language: hi
  text: तब यूसुफ ने उन दोनों को लिया—एप्रैम को अपने दाहिने हाथ से इस्राएल की बाईं ओर, और मनश्शे को अपने बाएँ हाथ से इस्राएल की दाईं ओर—और उन्हें उसके पास ले आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: तब ... ने ... लिया
  rationale: क्रियाओं के क्रम को स्वाभाविक हिन्दी में व्यक्त करते हुए कथात्मक वाव का अनुवाद ‘तब’ से किया गया है।
- source_word: בִּימִינוֹ / בִשְׂמֹאלוֹ
  choice: अपने दाहिने हाथ से / अपने बाएँ हाथ से
  rationale: हिब्रू में स्थान या साधनसूचक בְּ को यहाँ यूसुफ द्वारा प्रत्येक पुत्र को संबंधित हाथ से थामने की क्रिया के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מִשְּׂמֹאל יִשְׂרָאֵל / מִימִין יִשְׂרָאֵל
  choice: इस्राएल की बाईं ओर / इस्राएल की दाईं ओर
  rationale: מִן यहाँ अलगाव की अपेक्षा सापेक्ष स्थिति दर्शाता है; ‘ओर’ स्थानिक संबंध को स्पष्ट और सहज रखता है।
- source_word: וַיַּגֵּשׁ אֵלָיו
  choice: और उन्हें उसके पास ले आया
  rationale: הגיש का कारक अर्थ ‘निकट लाना’ है; हिन्दी में ‘उसके पास ले आया’ स्वाभाविक है और प्रत्यय का संदर्भ इस्राएल ही रहने देता है।
