  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। पुत्रों की स्थिति और यूसुफ के हाथों की दिशा को मूल के अनुसार स्पष्ट रखा गया है; किसी व्याख्यात्मक धार्मिक निष्कर्ष को नहीं जोड़ा गया।
