base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/016.yaml
  text: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
translation:
  language: hi
  text: वह दूत, जिसने मुझे हर अनिष्ट से छुड़ाया है,[a] इन लड़कों को आशीष दे। वे मेरे और मेरे पुरखाओं अब्राहम और इसहाक के नाम से जाने जाएँ,[b] और देश में बहुत बढ़ें।[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘हर बुराई से’; इब्रानी शब्द का अर्थ ‘हर हानि’, ‘हर अनिष्ट’ या ‘हर संकट’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘मेरा नाम और मेरे पुरखाओं अब्राहम और इसहाक का नाम उन पर पुकारा जाए।’
    reason: lexical_alternative
  - marker: c
    text: यहाँ प्रयुक्त दुर्लभ इब्रानी क्रिया भरपूर वृद्धि का बोध कराती है और संभवतः मछलियों की तरह बहुत बढ़ने का बिंब रखती है।
    reason: lexical_alternative
  - marker: d
    text: ‘देश’ के स्थान पर ‘धरती’ भी संभव है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: वह दूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या संदर्भानुसार ‘स्वर्गदूत’ हो सकता है। ‘वह दूत’ मूल शब्द की व्यापकता और इस पात्र की पहचान से जुड़ी अस्पष्टता बनाए रखता है।
- source_word: הַגֹּאֵל אֹתִי
  choice: जिसने मुझे ... छुड़ाया है
  rationale: גאל छुटकारा दिलाने या छुड़ाने का भाव रखता है। हिन्दी में पूर्ण क्रिया याकूब के बीते जीवन में मिली रक्षा को स्वाभाविक रूप से व्यक्त करती है, जबकि उद्धार-संबंधी अर्थ भी बना रहता है।
- source_word: מִכָּל רָע
  choice: हर विपत्ति से
  rationale: רָע नैतिक बुराई के साथ-साथ हानि, अनिष्ट और विपत्ति भी दर्शा सकता है। इस स्मरणात्मक संदर्भ में ‘विपत्ति’ स्वाभाविक है; व्यापक शाब्दिक विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: יְבָרֵךְ
  choice: आशीष दे
  rationale: यहाँ yiqtol आशीर्वचन में इच्छासूचक अर्थ देता है; ‘आशीष दे’ हिन्दी में उसी प्रार्थनात्मक भाव को स्पष्ट करता है।
- source_word: הַנְּעָרִים
  choice: इन लड़कों
  rationale: यह मनश्शे और एप्रैम की ओर संकेत करता है। ‘इन लड़कों’ निकट संदर्भ में ठोस और आधुनिक हिन्दी है।
- source_word: וְיִקָּרֵא בָהֶם שְׁמִי
  choice: मेरा नाम ... उनसे जुड़ा रहे
  rationale: शाब्दिक मुहावरा ‘मेरा नाम उन पर पुकारा जाए’ हिन्दी में अस्पष्ट और अस्वाभाविक हो सकता है। ‘नाम उनसे जुड़ा रहे’ वंशीय पहचान और नाम धारण करने का आशय संप्रेषित करता है, जबकि शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: וְשֵׁם אֲבֹתַי אַבְרָהָם וְיִצְחָק
  choice: मेरे पुरखाओं अब्राहम और इसहाक का नाम
  rationale: मूल में ‘नाम’ एकवचन है और संयुक्त पारिवारिक पहचान का बोध कराता है। हिन्दी में भी एकवचन बनाए रखा गया है।
- source_word: וְיִדְגּוּ לָרֹב
  choice: वे ... बहुत बढ़ें
  rationale: दुर्लभ क्रिया דגה अत्यधिक, संभवतः मछलियों-जैसी, वृद्धि का संकेत देती है। मुख्य पाठ में ‘बहुत बढ़ें’ अर्थ को स्पष्ट और स्वाभाविक रखता है; संभावित बिंब पाद-टिप्पणी में है।
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: देश के बीच
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘धरती’ हो सकता है। वंश और भूमि के पितृकालीन संदर्भ में ‘देश’ उपयुक्त है, पर व्यापक विकल्प पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: याकूब के आशीर्वाद में ‘दूत’ की पहचान
  choice: ‘वह दूत’ कहकर उसकी पहचान को और अधिक निश्चित नहीं किया गया।
  alternative: उसे स्पष्ट रूप से परमेश्वर का प्रत्यक्ष प्रकट होना, मसीह-पूर्व प्राकट्य, अथवा केवल एक सृजित स्वर्गदूत बताना।
  rationale: पद परमेश्वर की रक्षा और दूत के छुड़ाने के कार्य को निकटता से जोड़ता है, पर दूत के तात्त्विक स्वरूप को स्पष्ट नहीं करता। अनुवाद इस धर्मवैज्ञानिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुरखाओं’ वंशीय संदर्भ में स्वाभाविक है। मुख्य पाठ में कठिन इब्रानी मुहावरों को अर्थ-स्पष्ट हिन्दी में रखा गया है और उनकी वास्तविक शाब्दिक तथा अर्थगत संभावनाएँ पाद-टिप्पणियों में संरक्षित हैं।
