  text: וַ/יְבָ֨רֲכֵ֜/ם בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמוֹר֒ בְּ/ךָ֗ יְבָרֵ֤ךְ יִשְׂרָאֵל֙ לֵ/אמֹ֔ר יְשִֽׂמְ/ךָ֣ אֱלֹהִ֔ים כְּ/אֶפְרַ֖יִם וְ/כִ/מְנַשֶּׁ֑ה וַ/יָּ֥שֶׂם אֶת אֶפְרַ֖יִם לִ/פְנֵ֥י מְנַשֶּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/020.yaml
  text: So he blessed them that day[a], saying, “By you Israel will bless, saying, ‘May God make you like Ephraim and like Manasseh.’” And he set Ephraim before Manasseh.
translation:
  language: hi
  text: उस दिन उसने उन्हें आशीष देते हुए कहा, “तुम्हारे द्वारा[क] इस्राएल यह कहकर आशीष देगा, ‘परमेश्वर तुम्हें एप्रैम और मनश्शे के समान बनाए।’” और उसने एप्रैम को मनश्शे से आगे रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “तुम में।” अर्थात् इस्राएल तुम्हारा उल्लेख करके आशीष देने का सूत्र प्रयोग करेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: उसने उन्हें ... आशीष दी
  rationale: ברך के पिएल रूप का सामान्य अर्थ ‘आशीष देना’ है; बहुवचन कर्म-प्रत्यय एप्रैम और मनश्शे दोनों को सूचित करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह इब्रानी का स्वाभाविक कालवाचक पद है और दिन की विशिष्टता बनाए रखता है।
- source_word: לֵאמֹר
  choice: यह कहकर
  rationale: प्रत्यक्ष कथन आरम्भ कराने वाले इब्रानी पद को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּךָ יְבָרֵךְ יִשְׂרָאֵל
  choice: तुम्हारा नाम लेकर इस्राएल यह आशीष दिया करेगा
  rationale: בְּךָ यहाँ उस व्यक्ति या उसके नाम को आशीष के नमूने/माध्यम के रूप में लेने का भाव देता है। हिन्दी में ‘तुम्हारा नाम लेकर’ आशय को स्पष्ट करता है, जबकि ‘इस्राएल’ को बिना विस्तार के रखता है।
- source_word: יְשִׂמְךָ אֱלֹהִים
  choice: परमेश्वर तुम्हें ... बनाए
  rationale: आशीष के प्रसंग में यह इच्छा-सूचक प्रयोग है; ‘बनाए’ हिन्दी में स्वाभाविक कामनार्थक रूप है।
- source_word: כְּאֶפְרַיִם וְכִמְנַשֶּׁה
  choice: एप्रैम और मनश्शे के समान
  rationale: दोनों व्यक्तियों को आशीष के प्रतिमान के रूप में प्रस्तुत करने वाली तुलना को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: וַיָּשֶׂם אֶת־אֶפְרַיִם לִפְנֵי מְנַשֶּׁה
  choice: इस प्रकार उसने एप्रैम को मनश्शे से आगे रखा
  rationale: לִפְנֵי का स्थानगत ‘आगे’ और आशीष में प्राथमिकता—दोनों भाव सुरक्षित रहते हैं; ‘इस प्रकार’ कथित आशीष के क्रम से निष्कर्षात्मक संबंध दिखाता है।
theological_decisions:
- issue: आशीष के सूत्र में ‘इस्राएल’ का संदर्भ
  choice: ‘इस्राएल’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘याकूब’ अथवा ‘इस्राएल के लोग’
  rationale: मूल पाठ केवल ‘इस्राएल’ कहता है। इससे पूर्वज याकूब और भावी सामुदायिक इस्राएल, दोनों की प्रतिध्वनि बनी रहती है; किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- issue: एप्रैम को मनश्शे से आगे रखने का अर्थ
  choice: ‘आगे रखा’
  alternative: ‘अधिक महान ठहराया’
  rationale: मूल में स्थान/क्रम की भाषा है जो प्राथमिकता का संकेत देती है, पर उसके पूरे धर्मवैज्ञानिक अर्थ को स्पष्ट कथन में नहीं बदलती।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। इब्रानी आशीर्वचन की पुनरुक्ति को हिन्दी में अनावश्यक बोझिलता से बचाते हुए ‘यह आशीष दिया करेगा’ द्वारा व्यक्त किया गया है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
