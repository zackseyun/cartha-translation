base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/002.yaml
  text: And it was told to Jacob[a], and it was said, “Look, your son Joseph has come to you.” And Israel strengthened himself and sat up on the bed.
translation:
  language: hi
  text: 'याकूब को सूचना दी गई: “देखो, तुम्हारा पुत्र यूसुफ तुम्हारे पास आ गया है।” और इस्राएल ने अपनी शक्ति बटोरी और पलंग पर बैठ गया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד לְיַעֲקֹב
  choice: याकूब को बताया गया
  rationale: हिफ़ील क्रिया का अर्थ ‘बताना/सूचित करना’ है। मूल में बताने वाला अनिर्दिष्ट है, इसलिए हिन्दी में कर्मवाच्य स्वाभाविक और स्रोत-संगत है।
- source_word: וַיֹּאמֶר
  choice: और कहा गया
  rationale: मूल इब्रानी में सूचना देने और कहने की दोनों क्रियाएँ अलग-अलग हैं; औपचारिक निकटता बनाए रखने के लिए दोनों को रखा गया है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला संकेतवाचक अव्यय है। ‘देख’ आधुनिक हिन्दी में इसका सीधा और स्वाभाविक बल व्यक्त करता है।
- source_word: בִּנְךָ יוֹסֵף
  choice: तेरा पुत्र यूसुफ
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक रूप को ‘तेरा’ से और בֵּן को गरिमापूर्ण सामान्य शब्द ‘पुत्र’ से व्यक्त किया गया है।
- source_word: בָּא אֵלֶיךָ
  choice: तेरे पास आ गया है
  rationale: पूर्ण क्रिया तत्काल वर्तमान परिणाम वाली पूरी हो चुकी आमद को दर्शाती है; ‘आ गया है’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּתְחַזֵּק
  choice: अपनी शक्ति बटोरी
  rationale: חזק के हित्पएल रूप में स्वयं को बलवान करने या बची हुई शक्ति जुटाने का भाव है। बीमार याकूब के प्रसंग में ‘अपनी शक्ति बटोरी’ अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: וַיֵּשֶׁב עַל הַמִּטָּה
  choice: पलंग पर बैठ गया
  rationale: ישב का मूल अर्थ ‘बैठना’ और מִטָּה का अर्थ ‘पलंग/बिछौना’ है। हिन्दी की संयुक्त क्रिया ‘बैठ गया’ अवस्था-परिवर्तन को स्वाभाविक रूप से प्रकट करती है।
theological_decisions:
- issue: एक ही पद में ‘याकूब’ और ‘इस्राएल’ दोनों नामों का प्रयोग
  choice: मूल के नाम-परिवर्तन को ज्यों का त्यों बनाए रखना
  alternative: शैलीगत एकरूपता के लिए दोनों स्थानों पर ‘याकूब’ कहना
  rationale: इब्रानी पाठ पहले ‘याकूब’ और फिर ‘इस्राएल’ कहता है। इस साहित्यिक या धर्मवैचारिक तनाव को किसी एक व्याख्या से समतल किए बिना सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, जिसमें साधारण पाठक के लिए सहजता और बाइबलीय कथन की गरिमा दोनों रखी गई हैं। आरम्भ के दोनों इब्रानी कथन-क्रियापदों को जानबूझकर संरक्षित किया गया है; इससे वाक्य कुछ औपचारिक रहता है, पर स्रोत की पुनरुक्ति नहीं मिटती।
