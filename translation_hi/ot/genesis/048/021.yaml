  verdict: revise
  source_fidelity: The draft accurately preserves Israel (not Jacob), the imminent-death sense, the contrastive force of the conjunction, and the plural addressees in the final clauses. However, ‘देश’ is less precise for אֶרֶץ here than ‘भूमि,’ which refers to the ancestral land, and the return verb can be expressed more idiomatically in Hindi.
