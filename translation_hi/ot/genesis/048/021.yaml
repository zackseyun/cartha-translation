id: GEN.48.21
reference: Genesis 48:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף הִנֵּ֥ה אָנֹכִ֖י מֵ֑ת וְ/הָיָ֤ה אֱלֹהִים֙ עִמָּ/כֶ֔ם וְ/הֵשִׁ֣יב אֶתְ/כֶ֔ם אֶל אֶ֖רֶץ אֲבֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/021.yaml
  text: Then Israel said to Joseph[a], “Behold, I am about to die[b], but God will be with you and will bring you back to the land of your fathers.”
translation:
  language: hi
  text: तब इस्राएल ने यूसुफ से कहा, “देखो, मैं मरने वाला हूँ, परन्तु परमेश्वर तुम लोगों के साथ रहेगा और तुम लोगों को तुम्हारे पूर्वजों की भूमि में वापस ले जाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इसके क्रमिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ में याकूब का नाम ‘इस्राएल’ है; इसलिए उसी नाम को बनाए रखा गया है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला संवाद-सूचक है; ‘देख’ आधुनिक हिन्दी में स्वाभाविक और प्रत्यक्ष है।
- source_word: אָנֹכִי מֵת
  choice: मैं मरने पर हूँ
  rationale: सहभागी रूप यहाँ निकट भविष्य में होने वाली मृत्यु बताता है, न कि मृत्यु पूरी हो चुकने की स्थिति।
- source_word: וְהָיָה אֱלֹהִים עִמָּכֶם
  choice: परन्तु परमेश्वर तुम लोगों के साथ रहेगा
  rationale: वाव मूलतः संयोजक है, पर प्रसंग में इस्राएल की आसन्न मृत्यु और परमेश्वर की बनी रहने वाली उपस्थिति के बीच विरोध स्पष्ट है। बहुवचन प्रत्यय को ‘तुम लोगों’ से प्रत्यक्ष किया गया है।
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: और तुम लोगों को ... लौटा ले जाएगा
  rationale: 'שׁוב का हिफ़ील रूप कारक अर्थ देता है: परमेश्वर उन्हें वापस आने का कारण बनेगा; ‘लौटा ले जाएगा’ हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।'
- source_word: אֶל אֶרֶץ אֲבֹתֵיכֶם
  choice: तुम्हारे पूर्वजों के देश में
  rationale: यह कुलपिताओं की पैतृक भूमि की ओर संकेत करता है; ‘पूर्वजों’ आधुनिक हिन्दी में स्वाभाविक है और बहुवचन सम्बन्ध को सुरक्षित रखता है।
theological_decisions:
- issue: प्रतिज्ञा में बहुवचन सर्वनामों का अभिप्राय
  choice: ‘तुम लोगों’ कहकर बहुवचन को स्पष्ट रखा गया है, जिससे प्रतिज्ञा यूसुफ से आगे उसके परिवार या वंशजों तक पहुँचती है।
  alternative: सिर्फ ‘तुम’ कहना, जिसे हिन्दी में एकवचन भी समझा जा सकता है।
  rationale: עִמָּכֶם और אֶתְכֶם दोनों में बहुवचन प्रत्यय हैं; उन्हें स्पष्ट करना वाचा-संबंधी व्यापकता को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- issue: परमेश्वर की उपस्थिति से पहले वाव का संवादगत बल
  choice: विरोधसूचक ‘परन्तु’
  alternative: साधारण संयोजक ‘और’
  rationale: मूल संयोजक दोनों अर्थों की अनुमति देता है, किंतु यहाँ ‘मैं मरने पर हूँ’ के विपरीत परमेश्वर की निरंतर उपस्थिति रखी गई है; इसलिए हिन्दी में विरोधसूचक संबंध व्यक्त किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘तुम लोगों’ से इब्रानी बहुवचन खुलकर सामने आता है; ‘परन्तु’ औपचारिक किंतु प्रचलित विरोधसूचक है।
