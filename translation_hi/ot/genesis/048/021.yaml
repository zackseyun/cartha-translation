    issue: Unidiomatic expression for imminent death
    rationale: ‘मैं मरने पर हूँ’ is not natural modern standard Hindi. ‘मैं मरने वाला हूँ’ clearly conveys the participial, imminent-death sense without suggesting completed death.
  - severity: low
    issue: Land rendered as ‘देश’
    rationale: אֶרֶץ in this covenantal context denotes the ancestral land/territory. ‘भूमि’ is more precise and avoids narrowing the phrase to a modern-style country.
  - severity: low
    issue: Attention marker is overly clipped
    rationale: ‘देखो’ is the normal modern Hindi discourse marker for הִנֵּה in direct speech; ‘देख’ can sound abrupt or colloquial.
