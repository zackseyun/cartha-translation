source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יִשְׂרָאֵ֨ל אֶת יְמִינ֜/וֹ וַ/יָּ֨שֶׁת עַל רֹ֤אשׁ אֶפְרַ֨יִם֙ וְ/ה֣וּא הַ/צָּעִ֔יר וְ/אֶת שְׂמֹאל֖/וֹ עַל רֹ֣אשׁ מְנַשֶּׁ֑ה שִׂכֵּל֙ אֶת יָדָ֔י/ו כִּ֥י מְנַשֶּׁ֖ה הַ/בְּכֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/014.yaml
  text: Then Israel stretched out his right hand and placed it on Ephraim’s head[a], though he was the younger, and his left hand on Manasseh’s head, crossing his hands, for Manasseh was the firstborn.
translation:
  language: hi
  text: तब इस्राएल ने अपना दाहिना हाथ बढ़ाकर एप्रैम के सिर पर रखा, यद्यपि वह छोटा था, और अपना बायाँ हाथ मनश्शे के सिर पर रखा। उसने अपने हाथों को जान-बूझकर आड़ा रखा, क्योंकि मनश्शे पहलौठा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: हाथ बढ़ाकर
  rationale: भौतिक संकेत के इस प्रसंग में क्रिया का अर्थ हाथ को आगे बढ़ाना है, न कि भेजना।
- source_word: וַיָּשֶׁת
  choice: रखा
  rationale: सिर पर हाथ रखने की सोद्देश्य क्रिया के लिए यह स्वाभाविक और सटीक हिन्दी है।
- source_word: יְמִינוֹ / שְׂמֹאלוֹ
  choice: अपना दाहिना हाथ / अपना बायाँ हाथ
  rationale: दोनों हाथों का स्पष्ट उल्लेख मूल की समानांतर रचना और आशीर्वाद के संकेत को बनाए रखता है।
- source_word: וְהוּא הַצָּעִיר
  choice: यद्यपि वह छोटा था
  rationale: 'यह प्रसंगगत विरोध व्यक्त करता है: छोटा होने पर भी एप्रैम के सिर पर दाहिना हाथ रखा गया।'
- source_word: שִׂכֵּל אֶת יָדָיו
  choice: उसने अपने हाथ जान-बूझकर इस प्रकार रखे कि वे एक-दूसरे को लाँघ गए
  rationale: कठिन इब्रानी पदबंध में कुशल अथवा सोद्देश्य ढंग से हाथ रखने का भाव है; निकट प्रसंग से हाथों का एक-दूसरे को लाँघना स्पष्ट होता है। अनुवाद दोनों पक्षों को व्यक्त करता है।
- source_word: הַבְּכֹר
  choice: पहलौठा
  rationale: यह जन्मक्रम और उससे जुड़ी सांस्कृतिक महत्ता को केवल आयु-सूचक 'बड़ा' से अधिक ठीक प्रकार सुरक्षित रखता है।
theological_decisions:
- issue: שִׂכֵּל אֶת יָדָיו का अर्थ
  choice: याकूब ने जान-बूझकर हाथ इस प्रकार रखे कि वे एक-दूसरे को लाँघ गए।
  alternative: याकूब ने अपने हाथ कुशलता अथवा समझ-बूझ से रखे, बिना हाथ लाँघने को पदबंध का प्रत्यक्ष अर्थ माने।
  rationale: दाहिना हाथ छोटे एप्रैम पर और बायाँ पहलौठे मनश्शे पर रखने का तत्काल प्रसंग जान-बूझकर किए गए उलटाव को दर्शाता है। फिर भी पदबंध की शाब्दिक कठिनाई को पादटिप्पणी में सुरक्षित रखा गया है और इससे कोई बाद की सैद्धांतिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथन। ‘पहलौठा’ बाइबिलीय-सांस्कृतिक अर्थ को सुरक्षित रखता है। मुख्य पाठ में कठिन इब्रानी पदबंध के सोद्देश्य भाव और प्रसंग से स्पष्ट हाथ लाँघने—दोनों को रखा गया है।
