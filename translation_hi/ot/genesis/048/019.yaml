base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/019.yaml
  text: But his father refused and said[a], “I know, my son, I know. He too will become a people, and he too will become great. Nevertheless, his younger brother will become greater than he, and his offspring will become the fullness of nations.”
translation:
  language: hi
  text: परन्तु उसके पिता ने मना कर दिया और कहा, “मैं जानता हूँ, मेरे बेटे, मैं जानता हूँ। वह भी एक जनसमुदाय बनेगा और वह भी महान होगा। फिर भी, उसका छोटा भाई उससे अधिक महान होगा, और उसका वंश राष्ट्रों की भरपूरी बन जाएगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राष्ट्रों का एक बड़ा समूह।” हिब्रू में अधिक शाब्दिक रूप से, “राष्ट्रों की भरपूरी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: इनकार किया
  rationale: क्रिया מאן जान-बूझकर अस्वीकार करने का भाव देती है; प्रसंग में याकूब ने यूसुफ द्वारा हाथ बदलवाने का प्रयास स्वीकार नहीं किया।
- source_word: יָדַעְתִּי ... יָדַעְתִּי
  choice: मैं जानता हूँ, मेरे बेटे, मैं जानता हूँ
  rationale: मूल की बलाघाती पुनरुक्ति को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: גַּם הוּא יִהְיֶה לְעָם
  choice: वह भी एक जाति बनेगा
  rationale: עָם सामूहिक जनसमुदाय को दर्शाता है; इस वंशगत संदर्भ में ‘जाति’ आधुनिक हिन्दी में स्वाभाविक है और ‘राष्ट्र’ से कम राजनीतिक अर्थ देता है।
- source_word: וְגַם הוּא יִגְדָּל
  choice: वह भी महान होगा
  rationale: גדל यहाँ प्रतिष्ठा और महत्त्व में महान होने को व्यक्त करता है; हिन्दी में ‘महान होगा’ सहज भविष्यगत अभिव्यक्ति है।
- source_word: וְאוּלָם
  choice: फिर भी
  rationale: मनश्शे की भावी महानता और एप्रैम की उससे अधिक महानता के बीच प्रबल विरोध बनाए रखता है।
- source_word: אָחִיו הַקָּטֹן
  choice: उसका छोटा भाई
  rationale: הַקָּטֹן यहाँ आयु और जन्मक्रम में छोटे भाई को दर्शाता है; हिन्दी का ‘छोटा भाई’ स्वाभाविक और स्पष्ट है।
- source_word: יִגְדַּל מִמֶּנּוּ
  choice: उससे अधिक महान होगा
  rationale: तुलनात्मक מִן को स्पष्ट रखते हुए पहले आए גדל के साथ शब्दगत संगति रखी गई है।
- source_word: וְזַרְעוֹ
  choice: उसका वंश
  rationale: זֶרַע का सामूहिक एकवचन भाव ‘वंश’ से स्वाभाविक रूप में व्यक्त होता है और भावी वंशजों को समेटता है।
- source_word: יִהְיֶה מְלֹא הַגּוֹיִם
  choice: जातियों की भरपूरी होगा
  rationale: מְלֹא के मूल ‘भराव/पूर्ण मात्रा’ के भाव को ‘बहुत-सी जातियाँ’ जैसे व्याख्यात्मक सरलीकरण में बदले बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: מְלֹא הַגּוֹיִם का अर्थ
  choice: जातियों की भरपूरी
  alternative: जातियों का एक बड़ा समुदाय / बहुत-सी जातियाँ
  rationale: हिब्रू पदबंध असामान्य और अर्थ-सघन है। मुख्य पाठ में ‘भरपूरी’ रखकर उसकी वास्तविक अस्पष्टता तथा सम्भावित पारपाठीय प्रतिध्वनि सुरक्षित रखी गई है; फुटनोट अधिक व्याख्यात्मक अर्थ बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘मेरे बेटे’ और ‘छोटा भाई’ सामान्य बोलचाल के निकट हैं, जबकि कठिन हिब्रू पदबंध के लिए ‘भरपूरी’ जानबूझकर रखा गया है और उसका अर्थ फुटनोट में स्पष्ट किया गया है।
