source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף רְאֹ֥ה פָנֶ֖י/ךָ לֹ֣א פִלָּ֑לְתִּי וְ/הִנֵּ֨ה הֶרְאָ֥ה אֹתִ֛/י אֱלֹהִ֖ים גַּ֥ם אֶת זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/011.yaml
  text: And Israel said to Joseph[a], “I did not expect to see your face, and behold, God has let me see even your offspring.”
translation:
  language: hi
  text: तब इस्राएल ने यूसुफ़ से कहा, “मैंने सोचा भी नहीं था कि मैं तुम्हारा चेहरा[a] देखूँगा; और देखो, परमेश्वर ने मुझे तुम्हारी संतान भी दिखा दी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “मैंने यह आशा नहीं की थी कि मैं तुम्हारा चेहरा देखूँगा।” ‘चेहरा देखना’ यहाँ किसी व्यक्ति को प्रत्यक्ष देखने या उससे मिलने का मुहावरा है; मुख्य पाठ में मूल की ठोस अभिव्यक्ति रखी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; हिंदी में ‘तब’ प्रसंग के क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ में ‘याकूब’ नहीं, वाचा-संबंधी नाम ‘इस्राएल’ है; इसलिए उसी को रखा गया है।
- source_word: רְאֹה פָנֶיךָ
  choice: तुम्हारा मुख देखूँगा
  rationale: यह मुहावरा व्यक्ति को प्रत्यक्ष देखने का अर्थ देता है, पर ‘मुख देखना’ मूल की ठोस और भावपूर्ण अभिव्यक्ति को सुरक्षित रखता है।
- source_word: לֹא פִלָּלְתִּי
  choice: मैंने सोचा भी नहीं था
  rationale: इस प्रसंग में क्रिया का अर्थ प्रार्थना करना नहीं, बल्कि कल्पना या आशा करना है। यह हिंदी अभिव्यक्ति अप्रत्याशित पुनर्मिलन का भाव स्वाभाविक रूप से देती है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: आश्चर्य और विशेष बल देने वाले हिब्रू संकेतक को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: הֶרְאָה אֹתִי
  choice: मुझे ... देखने दिया है
  rationale: ראה के हिफ़ील रूप का कारणवाचक भाव है; यह चयन परमेश्वर द्वारा यह अवसर प्रदान किए जाने को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यह सामान्य ईश्वरीय पद है, न कि YHWH नाम; हिंदी बाइबलीय भाषा में ‘परमेश्वर’ इसका स्पष्ट और प्रतिष्ठित समतुल्य है।
- source_word: גַּם
  choice: भी
  rationale: यह यूसुफ़ को देखने से बढ़कर उसकी संतान को देखने के अतिरिक्त और अप्रत्याशित वरदान पर बल देता है।
- source_word: זַרְעֶךָ
  choice: तुम्हारी संतान
  rationale: זרע यहाँ सामूहिक एकवचन है। ‘संतान’ आधुनिक हिंदी में स्वाभाविक है और ‘बीज’ की अनावश्यक शाब्दिकता से बचते हुए अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: पितृकालीन आख्यान में אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: ईश्वर
  rationale: पद सामान्य ईश्वरीय उपाधि है और वचन में प्राप्त अप्रत्याशित आशीष का श्रेय परमेश्वर को दिया गया है; किसी अतिरिक्त सांप्रदायिक या सिद्धान्तगत व्याख्या की आवश्यकता नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘मुख देखना’ मूल हिब्रू की भावपूर्ण ठोसता बनाए रखता है, जबकि ‘सोचा भी नहीं था’ לֹא פִלָּלְתִּי का प्रसंगानुकूल भाव स्पष्ट करता है।
