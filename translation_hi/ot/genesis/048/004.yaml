language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הִנְ/נִ֤י מַפְרְ/ךָ֙ וְ/הִרְבִּיתִ֔/ךָ וּ/נְתַתִּ֖י/ךָ לִ/קְהַ֣ל עַמִּ֑ים וְ/נָ֨תַתִּ֜י אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֲחֻזַּ֥ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/004.yaml
  text: And he said to me, ‘Look, I will make you fruitful and multiply you, and I will make you into an assembly of peoples, and I will give this land to your offspring after you as an everlasting possession.’
translation:
  language: hi
  text: और उसने मुझसे कहा, ‘देख, मैं तुझे फलवंत करूँगा और तेरी संख्या बढ़ाऊँगा; मैं तुझे जातियों की एक सभा बनाऊँगा और तेरे पश्चात् तेरे वंशजों को यह भूमि सदा की संपत्ति के रूप में दूँगा।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: यह ध्यान आकर्षित करने वाली अभिव्यक्ति है; आधुनिक हिन्दी में ‘देख, मैं’ प्रतिज्ञा पर स्वाभाविक बल देता है।
- source_word: מַפְרְךָ
  choice: तुझे फलवन्त करूँगा
  rationale: हिफ़ील रूप की कारणवाचकता और उत्पत्ति में प्रजनन/वंशवृद्धि के अर्थ को बनाए रखता है।
- source_word: וְהִרְבִּיתִךָ
  choice: तेरी संख्या बढ़ाऊँगा
  rationale: ‘बहुत बढ़ाऊँगा’ की अपेक्षा आशय को स्पष्ट करते हुए जनसंख्या और वंशवृद्धि का भाव व्यक्त करता है।
- source_word: לִקְהַל עַמִּים
  choice: अनेक जातियों का एक समुदाय
  rationale: קהל के सभा/समुदाय और עמים के बहुवचन ‘जातियों’ दोनों को सुरक्षित रखता है; ‘अनेक’ हिन्दी में बहुवचन का स्वाभाविक संप्रेषण करता है।
- source_word: לְזַרְעֲךָ אַחֲרֶיךָ
  choice: तेरे बाद तेरे वंश को
  rationale: זֶרַע का सामूहिक अर्थ ‘वंश’ और אַחֲרֶיךָ का कालगत अर्थ दोनों सीधे व्यक्त होते हैं।
- source_word: אֲחֻזַּת עוֹלָם
  choice: सदा की सम्पत्ति के रूप में
  rationale: אֲחֻזָּה की अधिकारपूर्वक धारण की हुई भूमि/सम्पत्ति और עוֹלָם की स्थायी अवधि को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: भूमि की प्रतिज्ञा की अवधि
  choice: सदा की सम्पत्ति
  alternative: अनन्त निज भूमि
  rationale: ‘सदा’ עוֹלָם का सामान्य और संदर्भानुकूल अनुवाद है; यह अवधि के दावे को बनाए रखता है, पर किसी विशेष धर्मवैज्ञानिक व्यवस्था की व्याख्या नहीं जोड़ता।
- issue: ‘peoples’ की सामूहिक बहुलता
  choice: अनेक जातियों का एक समुदाय
  alternative: लोगों की एक सभा
  rationale: ‘जातियों’ से विशिष्ट जनसमूहों की बहुलता स्पष्ट होती है, जबकि ‘समुदाय’ קהל के सामूहिक एकत्व को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। प्रत्यक्ष कथन में एकवचन आत्मीय सर्वनाम ‘तू/तेरा’ के रूप (‘तुझे’, ‘तेरी’, ‘तेरे’) मूल के एकवचन संबोधन को सुरक्षित रखते हैं।
