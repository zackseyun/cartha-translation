review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Jacob as the referent of the possessive and preserves Joseph’s act of reverential bowing. However, ‘हटाया’ can imply merely moving the boys aside, whereas the Hiphil of יצא more specifically conveys bringing/taking them out from their close position. ‘निकाला’ better represents this movement without adding detail.
  naturalness: ‘मुँह भूमि की ओर करके दण्डवत किया’ is understandable but somewhat mechanically phrased. ‘भूमि पर मुँह के बल झुककर प्रणाम किया’ is natural modern Hindi and clearly expresses the full prostration indicated by the Hebrew.
  terminology: ‘याकूब,’ ‘यूसुफ,’ and ‘दण्डवत/प्रणाम’ are appropriate for the register. The revised wording retains a reverential gesture without imposing a denominational interpretation.
  issues:
  - severity: medium
    issue: ‘हटाया’ is less precise for וַיּוֹצֵא.
    rationale: It may mean simply ‘moved aside.’ The source denotes Joseph causing the boys to come out from their position by Jacob’s knees.
  - severity: low
    issue: The bowing phrase is stylistically awkward.
    rationale: The combination ‘मुँह भूमि की ओर करके दण्डवत किया’ is overly literal in construction; a more idiomatic Hindi formulation can retain the same posture.
  revised_text: तब यूसुफ ने उन्हें याकूब के घुटनों के पास से[a] निकाला, और भूमि पर मुँह के बल झुककर प्रणाम किया।
