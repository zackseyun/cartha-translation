  text: וַ/יּוֹצֵ֥א יוֹסֵ֛ף אֹתָ֖/ם מֵ/עִ֣ם בִּרְכָּ֑י/ו וַ/יִּשְׁתַּ֥חוּ לְ/אַפָּ֖י/ו אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/012.yaml
  text: Then Joseph brought them out from between his knees[a], and he bowed with his face to the ground.
translation:
  language: hi
  text: तब यूसुफ ने उन्हें याकूब के घुटनों के पास से[a] निकाला, और भूमि पर मुँह के बल झुककर प्रणाम किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘याकूब के घुटनों के बीच से।’ इब्रानी अभिव्यक्ति आशीर्वाद के समय लड़कों की याकूब के बहुत निकट स्थिति का वर्णन कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: हटाया
  rationale: 'हिफ़ील रूप का कारणवाचक भाव है: यूसुफ ने दोनों पुत्रों को याकूब के निकट उनकी स्थिति से हटाया। हिन्दी में ‘हटाया’ इस दृश्य को स्वाभाविक रूप से व्यक्त करता है।'
- source_word: אֹתָם
  choice: उन्हें
  rationale: यह प्रत्यक्ष कर्म सर्वनाम एप्रैम और मनश्शे को सूचित करता है।
- source_word: מֵעִם בִּרְכָּיו
  choice: याकूब के घुटनों के पास से
  rationale: מֵעִם का मूल भाव ‘के पास/साथ से’ है। प्रसंग में सर्वनाम याकूब की ओर संकेत करता है; नाम स्पष्ट करने से हिन्दी में संदर्भ भ्रमित नहीं होता, जबकि ‘पास’ इब्रानी अभिव्यक्ति की स्थानगत व्यापकता बनाए रखता है।
- source_word: וַיִּשְׁתַּחוּ
  choice: दण्डवत किया
  rationale: क्रिया आदरपूर्वक भूमि तक झुकने को व्यक्त करती है। अगले वाक्यांश के साथ ‘दण्डवत किया’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: לְאַפָּיו
  choice: मुँह ... करके
  rationale: शाब्दिक रूप से मुख की दिशा बताने वाला पद है और אָרְצָה के साथ भूमि की ओर मुँह करके झुकने की मुद्रा व्यक्त करता है।
- source_word: אָרְצָה
  choice: भूमि की ओर
  rationale: दिशासूचक रूप है, जिसका अर्थ यहाँ ‘भूमि की ओर’ है।
theological_decisions:
- issue: ‘उसके घुटनों’ में संबंधवाचक सर्वनाम का संदर्भ
  choice: याकूब के घुटने
  alternative: यूसुफ के घुटने
  rationale: प्रसंग में याकूब ने लड़कों को अपने निकट लिया था और अब यूसुफ उन्हें वहाँ से हटाता है। इसलिए प्रत्यय का सबसे स्वाभाविक संदर्भ याकूब है; हिन्दी में नाम स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दण्डवत किया’ आदरपूर्ण पूर्ण झुकाव को संक्षेप में व्यक्त करता है; ‘भूमि की ओर’ मूल के दिशासूचक भाव को बनाए रखता है।
