  text: וְ/עֵינֵ֤י יִשְׂרָאֵל֙ כָּבְד֣וּ מִ/זֹּ֔קֶן לֹ֥א יוּכַ֖ל לִ/רְא֑וֹת וַ/יַּגֵּ֤שׁ אֹתָ/ם֙ אֵלָ֔י/ו וַ/יִּשַּׁ֥ק לָ/הֶ֖ם וַ/יְחַבֵּ֥ק לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/010.yaml
  text: Israel’s eyes were dim with age[a]; he could not see. So he brought them near to him[b], and he kissed them and embraced them.
translation:
  language: hi
  text: इस्राएल की आँखें बुढ़ापे के कारण धुँधली हो गई थीं[a]; वह देख नहीं सकता था। तब यूसुफ उन दोनों को उसके पास ले आया[b], और इस्राएल ने उन्हें चूमा और गले लगाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “इस्राएल की आँखें बुढ़ापे से भारी हो गई थीं।” यह मुहावरा दृष्टि धुँधली हो जाने को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में कर्ता का नाम नहीं दिया गया है; शाब्दिक रूप से, “तब वह उन्हें उसके पास ले आया।” प्रसंग के अनुसार यहाँ यूसुफ अपने पुत्रों को इस्राएल के पास ले आता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: עֵינֵי יִשְׂרָאֵל
  choice: इस्राएल की आँखें
  rationale: हिब्रू की संबंधसूचक रचना का स्वाभाविक हिन्दी रूप; मूल में प्रयुक्त व्यक्तिगत नाम ‘इस्राएल’ को बनाए रखा गया है।
- source_word: כָּבְדוּ מִזֹּקֶן
  choice: बुढ़ापे के कारण धुँधली हो गई थीं
  rationale: शाब्दिक अर्थ ‘बुढ़ापे से भारी हो गई थीं’ है, पर आँखों के संदर्भ में यह मुहावरा दृष्टि क्षीण होने को व्यक्त करता है। कारणसूचक מִן को ‘के कारण’ से स्पष्ट किया गया है।
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: वह देख नहीं सकता था
  rationale: असमर्थता और क्रिया के सरल, स्वाभाविक आधुनिक हिन्दी समतुल्य।
- source_word: וַיַּגֵּשׁ אֹתָם אֵלָיו
  choice: तब यूसुफ उन दोनों को उसके पास ले आया
  rationale: हिफ़ील क्रिया का अर्थ ‘पास ले आना’ है। हिब्रू में कर्ता और सर्वनाम अंतर्निहित हैं; पिछले संदर्भ के आधार पर यूसुफ पुत्रों को इस्राएल के पास लाता है। हिन्दी में भ्रामक सर्वनाम-श्रृंखला से बचने के लिए यूसुफ का नाम स्पष्ट किया गया है। ‘उन दोनों’ एप्रैम और मनश्शे को सूचित करता है।
- source_word: וַיִּשַּׁק לָהֶם וַיְחַבֵּק לָהֶם
  choice: और इस्राएल ने उन्हें चूमा और गले लगाया
  rationale: स्नेहपूर्ण दोनों क्रियाओं का स्वाभाविक हिन्दी रूप। क्रियाओं का कर्ता संदर्भ से इस्राएल है; हिन्दी में अस्पष्टता रोकने के लिए नाम दोहराया गया है।
theological_decisions:
- issue: וַיַּגֵּשׁ का अंतर्निहित कर्ता और אֵלָיו का संकेत
  choice: मुख्य पाठ में यूसुफ को कर्ता और इस्राएल को ‘उसके’ का संदर्भ माना गया
  alternative: ‘तब वह उन्हें अपने पास ले आया’—अर्थात इस्राएल कर्ता हो
  rationale: पद 9 में इस्राएल यूसुफ से पुत्रों को अपने पास लाने को कहता है, इसलिए प्रसंग यूसुफ को यहाँ कर्ता मानने का प्रबल आधार देता है। फिर भी हिब्रू क्रियारूप में नाम स्पष्ट नहीं है, इसलिए वैकल्पिक व्याकरणिक पठन को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और कथात्मक गरिमा वाली रखी गई है। ‘गले लगाया’ सामान्य पाठक के लिए स्वाभाविक है। सर्वनामों से उत्पन्न संभावित भ्रम दूर करने के लिए यूसुफ और इस्राएल के नाम स्पष्ट किए गए हैं, जबकि मूल की व्याकरणिक अस्पष्टता पादटिप्पणी में दर्ज है।
