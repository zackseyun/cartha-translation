  text: וַ/יֹּ֧אמֶר יוֹסֵ֛ף אֶל אָבִ֖י/ו לֹא כֵ֣ן אָבִ֑/י כִּי זֶ֣ה הַ/בְּכֹ֔ר שִׂ֥ים יְמִינְ/ךָ֖ עַל רֹאשֽׁ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/018.yaml
  text: And Joseph said to his father, “Not so, my father, for this one is the firstborn. Put your right hand on his head.”
translation:
  language: hi
  text: तब यूसुफ ने अपने पिता से कहा, “ऐसा नहीं, पिताजी; क्योंकि यह ज्येष्ठ पुत्र है। अपना दाहिना हाथ इसके सिर पर रखिए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी कथन में ‘तब’ इस प्रगति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל אָבִיו
  choice: अपने पिता से
  rationale: אֶל के साथ ‘से कहा’ हिन्दी में स्वाभाविक है, और ‘अपने’ स्पष्ट करता है कि बात यूसुफ के पिता की है।
- source_word: לֹא כֵן
  choice: ऐसा नहीं
  rationale: यह सुधार या विनम्र विरोध का सीधा मुहावरा है; ‘ऐसा नहीं’ उसकी संक्षिप्तता और स्वर बनाए रखता है।
- source_word: אָבִי
  choice: मेरे पिता
  rationale: प्रथम पुरुष एकवचन प्रत्यय को स्पष्ट रखता और यूसुफ का आदरपूर्ण संबोधन सुरक्षित करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह यूसुफ के विरोध का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: זֶה
  choice: यह
  rationale: संकेतवाचक शब्द उस पुत्र की ओर प्रत्यक्ष संकेत करता है; दृश्य प्रसंग में ‘यह’ पर्याप्त और स्वाभाविक है।
- source_word: הַבְּכֹר
  choice: पहलौठा
  rationale: यह केवल अधिक आयु नहीं, बल्कि जन्मक्रम और पारिवारिक हैसियत दोनों व्यक्त करता है।
- source_word: שִׂים
  choice: रखिए
  rationale: आज्ञार्थक भाव को आदरयुक्त हिन्दी संबोधन में व्यक्त करता है, क्योंकि यूसुफ अपने पिता से बोल रहा है।
- source_word: יְמִינְךָ
  choice: अपना दाहिना हाथ
  rationale: यहाँ ימין स्पष्टतः दाहिने हाथ को दर्शाता है; ‘अपना’ हिन्दी में संबंध को स्वाभाविक बनाता है।
- source_word: עַל רֹאשׁוֹ
  choice: इसके सिर पर
  rationale: संकेतित पुत्र के सिर पर हाथ रखने की क्रिया को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आशीर्वाद के प्रसंग में ज्येष्ठता का पद
  choice: पहलौठा
  alternative: सबसे बड़ा
  rationale: ‘पहलौठा’ जन्मक्रम के साथ उससे जुड़ी पारिवारिक हैसियत और आशीर्वाद-संबंधी महत्त्व भी सुरक्षित रखता है; ‘सबसे बड़ा’ इसे केवल आयु तक सीमित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पुत्र का पिता से संवाद होने के कारण ‘रखिए’ आदरपूर्ण है; ‘ऐसा नहीं, मेरे पिता’ मूल के सीधे किंतु सम्मानपूर्ण विरोध को बनाए रखता है।
