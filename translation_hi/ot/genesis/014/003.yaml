lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: ये सब
  rationale: संज्ञा जोड़े बिना इब्रानी के सामूहिक संकेतवाचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। संदर्भ से राजाओं का बोध होता है, पर मूल में यहाँ 'राजा' नहीं है।
- source_word: חָבְרוּ
  choice: एक साथ आ मिले
  rationale: क्रिया के जुड़ने या एकत्र होने के मूल अर्थ को बनाए रखता है और प्रसंग में स्वाभाविक है; 'संधि की' मूल से अधिक स्पष्ट राजनीतिक अर्थ जोड़ता।
- source_word: אֶל
  choice: में
  rationale: एकत्र होने की क्रिया के साथ यह उस स्थान को बताता है जहाँ वे मिले; हिन्दी में 'में' अधिक स्वाभाविक है।
- source_word: עֵמֶק הַשִּׂדִּים
  choice: सिद्दीम की घाटी
  rationale: עֵמֶק का सामान्य अर्थ 'घाटी' है और स्थान-नाम שִׂדִּים को 'सिद्दीम' के रूप में लिप्यंतरित किया गया है।
- source_word: הוּא
  choice: अर्थात्
  rationale: यह सर्वनाम यहाँ बाद में परिचित स्थान-नाम के रूप में व्याख्यात्मक पहचान प्रस्तुत करता है।
- source_word: יָם הַמֶּלַח
  choice: लवण सागर
  rationale: इब्रानी पद का सीधा अर्थ 'नमक/लवण का सागर' है। 'लवण सागर' हिन्दी में संक्षिप्त, गरिमापूर्ण और स्थान-नाम के रूप में उपयुक्त है; आधुनिक नाम पादटिप्पणी में दिया गया है।
