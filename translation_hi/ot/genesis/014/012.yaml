  text: वे अब्राम के भतीजे लूत[a] और उसकी संपत्ति को लेकर चले गए; वह सदोम में रहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अब्राम के भाई का बेटा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: लेकर
  rationale: לקח का सामान्य अर्थ ‘लेना’ है। युद्ध और लूट के इस प्रसंग में ‘लेकर चले गए’ स्वाभाविक है और ‘पकड़ लिया’ या ‘बंदी बना लिया’ जैसी अतिरिक्त स्पष्टता नहीं जोड़ता।
- source_word: רְכֻשׁוֹ
  choice: उसकी सारी संपत्ति
  rationale: רְכוּשׁ चल संपत्ति और संचित माल को दर्शाता है। ‘संपत्ति’ आधुनिक हिन्दी में स्पष्ट है; ‘सारी’ हिन्दी में इस संयुक्त कर्म की पूर्णता को सहज ढंग से व्यक्त करता है।
- source_word: בֶּן אֲחִי אַבְרָם
  choice: अब्राम के भतीजे
  rationale: इब्रानी का शाब्दिक रूप ‘अब्राम के भाई का बेटा’ है। ‘भतीजा’ उसी संबंध को संक्षेप और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: וַיֵּלֵכוּ
  choice: चले गए
  rationale: הלך का कथात्मक अर्थ ‘जाना’ है। यहाँ ‘चले गए’ लूत और उसकी संपत्ति को साथ ले जाकर स्थान से प्रस्थान करने का भाव स्वाभाविक रूप से देता है।
- source_word: וְהוּא יֹשֵׁב בִּסְדֹם
  choice: लूत उस समय सदोम में रहता था
  rationale: यह पृष्ठभूमि बताने वाला खंड है। अस्पष्ट सर्वनाम से बचने के लिए ‘लूत’ दोहराया गया है, और ‘उस समय’ प्रसंगगत पृष्ठभूमि को बिना कारणात्मक अर्थ जोड़े स्पष्ट करता है।
