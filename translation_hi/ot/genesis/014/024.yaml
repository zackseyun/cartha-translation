  text: בִּלְעָדַ֗/י רַ֚ק אֲשֶׁ֣ר אָֽכְל֣וּ הַ/נְּעָרִ֔ים וְ/חֵ֨לֶק֙ הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הָלְכ֖וּ אִתִּ֑/י עָנֵר֙ אֶשְׁכֹּ֣ל וּ/מַמְרֵ֔א הֵ֖ם יִקְח֥וּ חֶלְקָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/024.yaml
  text: I will take nothing except only what the young men have eaten[a], and the share of the men who went with me—Aner, Eshcol, and Mamre[c][b]. Let them take their share.
translation:
  language: hi
  text: 'मैं कुछ नहीं लूँगा—सिवाय उसके जो युवकों ने खाया है[a], और उन लोगों के हिस्से के जो मेरे साथ गए थे: आनेर, एशकोल और मम्रे। वे अपना हिस्सा ले लें[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवकों ने’ अथवा ‘सहायकों ने’। इब्रानी शब्द का अर्थ प्रसंग के अनुसार युवक या सेवक-सहायक हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वे अपना हिस्सा लेंगे।’ इब्रानी क्रियारूप साधारण भविष्य भी व्यक्त कर सकता है, यद्यपि यहाँ अनुमति का भाव अधिक प्रसंगानुकूल है।
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעָדַי רַק
  choice: मैं कुछ नहीं लूँगा—सिवाय
  rationale: इब्रानी वाक्य पिछले पद में अब्राम के इनकार पर निर्भर एक अपूर्ण अपवाद-वाक्य से शुरू होता है। हिन्दी में निहित क्रिया को स्पष्ट करना स्वाभाविक है; ‘सिवाय’ अपवाद और רַק के प्रतिबंधात्मक बल को संक्षेप में व्यक्त करता है।
- source_word: אֲשֶׁר אָכְלוּ הַנְּעָרִים
  choice: उसके जो जवानों ने खा लिया है
  rationale: נְעָרִים का अर्थ प्रसंग के अनुसार जवान या सेवक/सहायक हो सकता है। ‘जवानों’ मूल शब्द की आयु-संबंधी सामान्य अभिव्यक्ति को बनाए रखता है, जबकि विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְחֵלֶק הָאֲנָשִׁים
  choice: और उन पुरुषों के हिस्से
  rationale: חֵלֶק युद्ध की लूट में मिलने वाले ‘हिस्से’ को दर्शाता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֲשֶׁר הָלְכוּ אִתִּי
  choice: जो मेरे साथ गए थे
  rationale: यह הלך की गति-संबंधी छवि को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: עָנֵר אֶשְׁכֹּל וּמַמְרֵא
  choice: आनेर, एशकोल और मम्रे
  rationale: व्यक्तिनामों का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: הֵם יִקְחוּ חֶלְקָם
  choice: वे अपना हिस्सा ले लें
  rationale: प्रसंग में अपूर्ण क्रिया अनुमति या रियायत व्यक्त करती है। हिन्दी का ‘ले लें’ इस भाव को स्वाभाविक रूप से प्रकट करता है, यद्यपि साधारण भविष्य भी व्याकरणतः संभव है।
theological_decisions:
- issue: पिछले पद से निहित इनकार की निरंतरता
  choice: ‘मैं कुछ नहीं लूँगा’ को स्पष्ट रूप से जोड़ा गया
  alternative: 'केवल खंड-वाक्य: ‘सिवाय उसके जो…’'
  rationale: इब्रानी בִּלְעָדַי पिछले पद के कथन पर निर्भर है। हिन्दी में निहित क्रिया को दोहराने से अर्थ स्पष्ट होता है और अब्राम के लूट न लेने के संकल्प को बिना doctrinal विस्तार के ठीक से व्यक्त किया जाता है।
- issue: יִקְחוּ का विधिक बल
  choice: 'अनुमति: ‘वे अपना हिस्सा ले लें’'
  alternative: 'साधारण भविष्य: ‘वे अपना हिस्सा लेंगे’'
  rationale: अब्राम अपने सहयोगियों को उनका हिस्सा लेने देता है; इसलिए अनुमति का भाव प्रसंगानुकूल है, पर रूपगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। लूट के बँटवारे के प्रसंग में ‘हिस्सा’ सामान्य और स्पष्ट शब्द है। मूल की अस्पष्टताओं को पादटिप्पणियों में सुरक्षित रखा गया है।
