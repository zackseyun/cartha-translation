id: GEN.14.21
reference: Genesis 14:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ סְדֹ֖ם אֶל אַבְרָ֑ם תֶּן לִ֣/י הַ/נֶּ֔פֶשׁ וְ/הָ/רְכֻ֖שׁ קַֽח לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/021.yaml
  text: Then the king of Sodom said to Abram[a], “Give me the people[b], and take the possessions for yourself.”
translation:
  language: hi
  text: तब सदोम के राजा ने अब्राम से कहा, “लोगों को मुझे दे दो और सम्पत्ति अपने लिए रख लो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֶלֶךְ סְדֹם
  choice: सदोम के राजा
  rationale: इब्रानी संबंधसूचक रचना का हिन्दी में सीधा और स्वाभाविक रूप।
- source_word: אֶל אַבְרָם
  choice: अब्राम से
  rationale: कहने की क्रिया के साथ אֶל को हिन्दी में स्वाभाविक रूप से ‘से’ कहा जाता है; ‘अब्राम’ नाम का प्रचलित हिन्दी रूप है।
- source_word: תֶּן לִי
  choice: मुझे दे दो
  rationale: आज्ञार्थक क्रिया और प्रथम पुरुष संबंध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַנֶּפֶשׁ
  choice: लोगों को
  rationale: נֶפֶשׁ यहाँ व्याकरणतः एकवचन होते हुए सामूहिक अर्थ में छुड़ाए गए व्यक्तियों को सूचित करता है; ‘लोगों’ से प्रसंगगत अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: וְהָרְכֻשׁ
  choice: और सम्पत्ति
  rationale: רְכוּשׁ चल सम्पत्ति, माल-असबाब या धन-सामान को दर्शाता है; ‘सम्पत्ति’ व्यापक और गरिमापूर्ण हिन्दी विकल्प है।
- source_word: קַח לָךְ
  choice: अपने लिए रख लो
  rationale: शाब्दिक अर्थ ‘अपने लिए ले लो’ है, पर विभाजन के इस प्रसंग में ‘रख लो’ स्वाभाविक हिन्दी है और व्यक्तिगत लाभ/अधिकार का भाव सुरक्षित रखता है।
theological_decisions: []
