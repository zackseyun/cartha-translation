  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। मूल में הַנֶּפֶשׁ के सामूहिक प्रयोग को ‘लोगों’ द्वारा व्यक्त किया गया है। किसी सम्प्रदायगत व्याख्या को नहीं जोड़ा गया।
