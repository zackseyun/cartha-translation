  yaml_path: translation/ot/genesis/014/009.yaml
  text: Chedorlaomer king of Elam[a], Tidal king of Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against the five.
translation:
  language: hi
  text: एलाम का राजा कदोर्लाओमेर, गोयीम का राजा तिदाल[a], शिनार का राजा अम्रापेल और एल्लासार का राजा अर्योक—ये चार राजा उन पाँच राजाओं के विरुद्ध थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तिदाल, जातियों का राजा।’ इब्रानी शब्द גּוֹיִם का अर्थ सामान्यतः ‘जातियाँ’ होता है, लेकिन यहाँ यह एक स्थान-नाम (‘गोयीम’) भी हो सकता है।
    reason: वैकल्पिक पाठ-अर्थ
