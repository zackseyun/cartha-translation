translation:
  language: hi
  text: रात को उसने और उसके सेवकों ने उन पर अलग-अलग दलों में धावा बोला, उन्हें परास्त किया और दमिश्क के उत्तर में स्थित होबा तक उनका पीछा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּחָלֵק עֲלֵיהֶם
  choice: अलग-अलग दल बनाकर उन पर हमला किया
  rationale: हिब्रू में शाब्दिक अर्थ ‘उनके विरुद्ध बँट गया’ है; प्रसंग में यह रात के समय दलों में बँटकर आक्रमण करने की सैन्य कार्रवाई दर्शाता है।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: עֶבֶד का सामान्य अर्थ ‘सेवक’ है; यहाँ अब्राम के घराने के अधीन पुरुषों के लिए स्वाभाविक और व्यापक शब्द रखा गया है।
- source_word: וַיַּכֵּם
  choice: उन्हें मार गिराया
  rationale: נכה का हिफ़ील रूप शत्रु को प्रहार करके परास्त या मार गिराने का अर्थ दे सकता है; युद्ध-संदर्भ में ‘मार गिराया’ उपयुक्त है, बिना यह दावा किए कि प्रत्येक व्यक्ति मारा गया।
- source_word: מִשְּׂמֹאל לְדַמָּשֶׂק
  choice: दमिश्क के उत्तर में
  rationale: प्राचीन दिशाभिमुखता में ‘बाईं ओर’ उत्तर को सूचित करती है; आधुनिक हिन्दी में आशय स्पष्ट किया गया है।
