  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מַלְכִּי צֶ֨דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָ/יָ֑יִן וְ/ה֥וּא כֹהֵ֖ן לְ/אֵ֥ל עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/018.yaml
  text: And Melchizedek king of Salem brought out bread and wine[b][a]. He was a priest of God Most High.
translation:
  language: hi
  text: और शालेम का राजा मलिकिसिदक रोटी और दाखमधु निकाल लाया। वह परमप्रधान परमेश्वर का याजक था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכִּי צֶדֶק
  choice: मलिकिसिदक
  rationale: व्यक्तिवाचक नाम का अर्थानुवाद न करके हिन्दी बाइबल परंपरा में प्रचलित रूप में लिप्यंतरण किया गया है।
- source_word: מֶלֶךְ שָׁלֵם
  choice: शालेम का राजा
  rationale: राजकीय पद और स्थान-नाम के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है; שָׁלֵם को स्थान-नाम मानकर लिप्यंतरित किया गया है।
- source_word: הוֹצִיא
  choice: ले आया
  rationale: हिफ़ईल क्रिया का संदर्भगत अर्थ किसी वस्तु को बाहर लाना/सामने लाना है; ‘ले आया’ आधुनिक हिन्दी में सहज रहते हुए ठोस क्रिया को सुरक्षित रखता है।
- source_word: לֶחֶם וָיָיִן
  choice: रोटी और दाखमधु
  rationale: दोनों खाद्य-पेय वस्तुओं का सीधा अनुवाद है; ‘दाखमधु’ יָיִן का स्पष्ट और गरिमापूर्ण हिन्दी रूप है।
- source_word: כֹהֵן
  choice: याजक
  rationale: उपासना-संबंधी अधिकारी के लिए मानक हिन्दी बाइबलीय पद है और यहाँ बाद की इस्राएली याजकीय व्यवस्था का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: אֵל עֶלְיוֹן
  choice: परमप्रधान परमेश्वर
  rationale: दैवी पदवी का अर्थानुवाद किया गया है; ‘परमप्रधान’ עֶלְיוֹן की सर्वोच्चता और ‘परमेश्वर’ אֵל के दैवी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהוּא
  choice: वह ... था
  rationale: संयोजक सहित सर्वनाम नई पहचानसूचक उपवाक्य आरंभ करता है; हिन्दी में अलग वाक्य और निहित योजक क्रिया को ‘था’ से व्यक्त करना स्वाभाविक है।
theological_decisions:
- issue: रोटी और दाखमधु के वर्णन में बाद की संस्कार-संबंधी व्याख्या को उभारना
  choice: साधारण ऐतिहासिक कथन ‘रोटी और दाखमधु ले आया’ रखा गया
  alternative: ऐसी शब्दावली अपनाना जो प्रभुभोज की पूर्वछाया को स्पष्ट रूप से सूचित करे
  rationale: इस पद में केवल वस्तुएँ लाने की घटना कही गई है; बाद की धर्मवैज्ञानिक व्याख्या को मूल कथन में नहीं जोड़ा गया।
- issue: אֵל עֶלְיוֹן को नाम के रूप में लिप्यंतरित करना या पदवी के रूप में अनूदित करना
  choice: परमप्रधान परमेश्वर
  alternative: एल एल्योन
  rationale: यहाँ पदबंध दैवी उपाधि/परिचय के रूप में काम करता है। अर्थानुवाद सामान्य हिन्दी पाठक के लिए अर्थ स्पष्ट रखता है, जबकि मूल की धर्मवैज्ञानिक शक्ति को घटाता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। नामों के लिए हिन्दी बाइबल परंपरा के परिचित रूप रखे गए हैं; वाक्य में कोई संस्कारवादी विस्तार नहीं जोड़ा गया।
