  text: וַ֠/יָּשֻׁבוּ וַ/יָּבֹ֜אוּ אֶל עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַ/יַּכּ֕וּ אֶֽת כָּל שְׂדֵ֖ה הָ/עֲמָלֵקִ֑י וְ/גַם֙ אֶת הָ֣/אֱמֹרִ֔י הַ/יֹּשֵׁ֖ב בְּ/חַֽצְצֹ֥ן תָּמָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/007.yaml
  text: Then they turned back and came to En-mishpat (that is[a], Kadesh), and struck all the country of the Amalekites[c][b], and also the Amorites who were living in Hazazon-tamar.
translation:
  language: hi
  text: फिर वे लौटकर एन-मिशपात[a] (अर्थात् कादेश) आए और अमालेकियों के पूरे प्रदेश पर आक्रमण किया, और हससोन-तामार[c] में रहने वाले एमोरियों पर भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एन-मिशपात’ का अर्थ है ‘न्याय का सोता’।
    reason: cultural_note
  - marker: c
    text: 2 इतिहास 20:2 में हससोन-तामार की पहचान एन-गदी से की गई है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: फिर वे लौटकर
  rationale: वाव-क्रमिक कथात्मक रूप अगले घटनाक्रम को व्यक्त करता है; שוב का स्वाभाविक हिन्दी रूप यहाँ ‘लौटकर’ है।
- source_word: וַיָּבֹאוּ אֶל
  choice: आए
  rationale: בוא के साथ אֶל गंतव्य तक आने को दर्शाता है; हिन्दी में स्थान के साथ ‘आए’ पर्याप्त और स्वाभाविक है।
- source_word: עֵין מִשְׁפָּט
  choice: एन-मिशपात
  rationale: यह स्थान-नाम है, इसलिए मुख्य पाठ में इसका लिप्यंतरण किया गया है; शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הִוא קָדֵשׁ
  choice: (अर्थात् कादेश)
  rationale: यह उपवाक्य पहले स्थान-नाम की पहचान कादेश के रूप में करता है; कोष्ठकीय प्रस्तुति आधुनिक हिन्दी में स्पष्ट है।
- source_word: וַיַּכּוּ
  choice: मार गिराया
  rationale: נכה का अर्थ मारना, प्रहार करना या परास्त करना हो सकता है। ‘मार गिराया’ सैन्य आक्रमण की तीव्रता रखता है, पर पूर्ण विजय या संहार को अनिवार्य रूप से नहीं जोड़ता।
- source_word: כָּל שְׂדֵה הָעֲמָלֵקִי
  choice: अमालेकियों के सारे प्रदेश
  rationale: שׂדה का मूल अर्थ ‘मैदान/खेत’ है, किंतु जातिनाम के साथ यहाँ उनके बसे हुए भूभाग का संकेत संभव है। ‘प्रदेश’ हिन्दी में भौगोलिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: הָעֲמָלֵקִי
  choice: अमालेकियों
  rationale: इब्रानी में एकवचन जातिवाचक रूप सामूहिक अर्थ रखता है; हिन्दी में बहुवचन जातिनाम स्वाभाविक है।
- source_word: וְגַם אֶת הָאֱמֹרִי
  choice: और उन एमोरियों को भी
  rationale: וְגַם का योगात्मक बल ‘और...भी’ से सुरक्षित रहता है। जातिवाचक एकवचन को हिन्दी में सामूहिक बहुवचन किया गया है।
- source_word: הַיֹּשֵׁב
  choice: जो ... रहते थे
  rationale: कर्तृवाचक कृदंत वहाँ निरंतर निवास करने वाले समुदाय का वर्णन करता है।
- source_word: בְּחַצְצֹן תָּמָר
  choice: हससोन-तामार में
  rationale: स्थान-नाम का निकट लिप्यंतरण किया गया है और בְּ को निवास-संदर्भ में ‘में’ से व्यक्त किया गया है।
