source:
  edition: WLC
  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדָרְלָעֹ֗מֶר וְ/הַ/מְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּכּ֤וּ אֶת רְפָאִים֙ בְּ/עַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְ/אֶת הַ/זּוּזִ֖ים בְּ/הָ֑ם וְ/אֵת֙ הָֽ/אֵימִ֔ים בְּ/שָׁוֵ֖ה קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
translation:
  language: hi
  text: चौदहवें वर्ष में कदोर्लाओमेर आया, और उसके साथ के राजा भी आए। उन्होंने अश्तरोत-कर्नैम में रपाइयों[a] को, हाम में जूजियों को और शावे-किर्यातैम[b] में एमियों को पराजित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: रपाइयों को कभी-कभी “दैत्य” या “विशालकाय लोग” कहा जाता है; यहाँ इब्रानी शब्द को एक जाति के नाम के रूप में रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: “शावे-किर्यातैम” का अर्थ “किर्यातैम का मैदान” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: चौदहवें वर्ष में
  rationale: यह पदबंध कथा के पिछले घटनाक्रम से जुड़ा समय बताता है। आरंभिक ו को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं है।
- source_word: בָּא
  choice: आए
  rationale: בוא का सामान्य अर्थ ‘आना’ है। बहुवचन क्रिया हिन्दी में कदोर्लाओमेर और उसके सहयोगी राजाओं—पूरे संयुक्त कर्ता—के अनुरूप है।
- source_word: כְדָרְלָעֹמֶר
  choice: कदोर्लाओमेर
  rationale: यह इब्रानी नाम का निकट देवनागरी लिप्यंतरण है।
- source_word: וְהַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: और उसके साथ के राजा
  rationale: यह कदोर्लाओमेर के साथ आए सहयोगी राजाओं को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּכּוּ
  choice: उन्होंने ... को पराजित किया
  rationale: נכה का मूल भाव ‘मारना/प्रहार करना’ है, पर युद्ध-सूची के इस प्रसंग में ‘पराजित किया’ उसका स्वाभाविक अर्थ देता है और अनावश्यक रूप से संहार का अर्थ नहीं जोड़ता।
- source_word: רְפָאִים
  choice: रपाइयों
  rationale: इसे किसी शारीरिक विशेषता के अर्थ में अनूदित करने के बजाय जाति-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: בְּעַשְׁתְּרֹת קַרְנַיִם
  choice: अश्तरोत-कर्नैम में
  rationale: स्थान-नाम को लिप्यंतरित रखा गया है; בְ के लिए यहाँ ‘में’ स्वाभाविक है।
- source_word: הַזּוּזִים
  choice: जूजियों
  rationale: जाति-नाम זוזים का हिन्दी बहुवचन-रूप है।
- source_word: בְּהָם
  choice: हाम में
  rationale: הם को यहाँ स्थान-नाम मानकर लिप्यंतरित किया गया है।
- source_word: הָאֵימִים
  choice: एमियों
  rationale: जाति-नाम אימים का हिन्दी बहुवचन-रूप है।
- source_word: בְּשָׁוֵה קִרְיָתָיִם
  choice: शावे-किर्यातैम में
  rationale: वाक्य में यह युद्ध-स्थल है। पूरे पदबंध को स्थान-नाम के रूप में लिप्यंतरित करना שוה को निश्चित रूप से ‘मैदान’ मान लेने से बचाता है।
theological_decisions:
- issue: רְפָאִים की पहचान
  choice: जाति-नाम ‘रपाई’ के रूप में रखा
  alternative: ‘दैत्य’ या ‘विशालकाय लोग’
  rationale: इस पद में शब्द जाति-नामों की सूची में आता है; केवल इसी आधार पर शारीरिक आकार संबंधी व्याख्या जोड़ना उचित नहीं है।
- issue: שָׁוֵה קִרְיָתָיִם का स्वरूप
  choice: संयुक्त स्थान-नाम ‘शावे-किर्यातैम’
  alternative: ‘किर्यातैम का मैदान’
  rationale: दोनों विश्लेषण संभव हैं। मुख्य पाठ में स्थान-नाम रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है, ताकि वास्तविक अस्पष्टता बनी रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। जाति-नामों को हिन्दी विभक्ति-संगत रूप दिया गया है और अपरिचित नामों की वास्तविक अस्पष्टता पादटिप्पणियों में सुरक्षित रखी गई है।
