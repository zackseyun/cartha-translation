  text: וַֽ/יְבָרְכֵ֖/הוּ וַ/יֹּאמַ֑ר בָּר֤וּךְ אַבְרָם֙ לְ/אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/019.yaml
  text: And he blessed him and said[a], “Blessed be Abram by God Most High[b], possessor of heaven and earth.”
translation:
  language: hi
  text: और उसने उसे आशीर्वाद दिया और कहा, “परमप्रधान परमेश्वर की ओर से अब्राम धन्य हो, जो आकाश[b] और पृथ्वी का स्वामी[a] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो आकाश और पृथ्वी का सृष्टिकर्ता है।” इब्रानी कृदन्त का अर्थ “स्वामी,” “मालिक,” या इस प्रसंग में “सृष्टिकर्ता” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “आकाशों और पृथ्वी का।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: और उसने उसे आशीर्वाद दिया
  rationale: वय्यिक्तोल कथात्मक क्रम और तृतीय पुरुष एकवचन कर्म-प्रत्यय को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֹּאמַר
  choice: और कहा
  rationale: इब्रानी कथात्मक संयोजन को बनाए रखते हुए वचन का स्वाभाविक परिचय देता है।
- source_word: בָּרוּךְ
  choice: धन्य हो
  rationale: आशीर्वचन में प्रयुक्त विधेयात्मक निष्क्रिय कृदन्त की गरिमापूर्ण और प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: אַבְרָם
  choice: अब्राम
  rationale: इस प्रसंग में पात्र का नाम अभी अब्राहम नहीं हुआ है; इसलिए मूल नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: לְאֵל
  choice: परमप्रधान परमेश्वर की ओर से
  rationale: आशीर्वाद-सूत्र में ל उस परमेश्वर को आशीष के स्रोत के रूप में सूचित कर सकता है; यह हिन्दी में उस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אֵל עֶלְיוֹן
  choice: परमप्रधान परमेश्वर
  rationale: संज्ञा और विशेषण से बने ईश्वरीय पदनाम को संक्षिप्त, गरिमापूर्ण और प्रचलित हिन्दी में सुरक्षित रखता है।
- source_word: קֹנֵה
  choice: स्वामी
  rationale: קנה का कृदन्त यहाँ अधिकार या स्वामित्व का अर्थ दे सकता है, जबकि ‘सृष्टिकर्ता’ भी संभव है। मुख्य पाठ में ‘स्वामी’ व्यापक अर्थ को रखता है और दूसरी संभावना पादटिप्पणी में दी गई है।
- source_word: שָׁמַיִם וָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: समस्त सृष्टि को सूचित करने वाले इस युग्म की यह स्वाभाविक हिन्दी अभिव्यक्ति है; मूल के रूपगत बहुवचन को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय पदनाम में קֹנֵה का अर्थ
  choice: आकाश और पृथ्वी का स्वामी
  alternative: आकाश और पृथ्वी का सृष्टिकर्ता
  rationale: इब्रानी קנה स्वामित्व, प्राप्ति या कुछ प्रसंगों में सृजन का बोध करा सकता है। ‘स्वामी’ मुख्य पाठ में शब्द की अर्थ-सीमा को अनावश्यक रूप से संकुचित नहीं करता, जबकि ‘सृष्टिकर्ता’ को वास्तविक वैकल्पिक अर्थ के रूप में पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण आशीर्वचन-रजिस्टर अपनाया गया है। ‘धन्य हो’ सूत्रात्मक बल को रखता है; ‘की ओर से’ आशीष के स्रोत को स्वाभाविक हिन्दी में व्यक्त करता है। दोनों पादटिप्पणी-चिह्न संबंधित पदबंध के तुरंत बाद मुख्य पाठ में दिए गए हैं।
