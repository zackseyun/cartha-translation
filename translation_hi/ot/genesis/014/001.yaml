base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/001.yaml
  text: 'And it happened in the days of Amraphel king of Shinar[a], Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations:'
translation:
  language: hi
  text: और ऐसा हुआ कि शिनार के राजा अम्रापेल, एल्लासार के राजा अर्योक, एलाम के राजा कदोर्लाओमेर और गोयीम[a] के राजा तिदाल के दिनों में—
  philosophy: optimal-equivalence
  footnotes:
