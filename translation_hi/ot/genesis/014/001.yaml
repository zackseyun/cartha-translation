  choice: एलाम के राजा कदोर्लाओमेर
  rationale: नाम का ध्वन्यात्मक लिप्यंतरण करते हुए राजकीय उपाधि को सहज हिन्दी क्रम में व्यक्त किया गया है।
- source_word: וְתִדְעָל מֶלֶךְ גּוֹיִם
  choice: और गोयीम के राजा तिदाल
  rationale: समानांतर राजकीय उपाधियों के कारण גּוֹיִם को मुख्य पाठ में संभावित स्थान/जनसमूह-नाम मानकर लिप्यंतरित किया गया है; उसका सामान्य अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: גּוֹיִם की पहचान
  choice: गोयीम के राजा
  alternative: जातियों के राजा
  rationale: यहाँ अन्य राजाओं के साथ समानांतर संरचना इसे किसी भूभाग या जनसमूह की संज्ञा मानने की संभावना देती है, पर सामान्य संज्ञा वाला अर्थ भी संभव है; इसलिए अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण कथात्मक शैली। नामों को देवनागरी में मूल ध्वनियों के निकट लिप्यंतरित किया गया है। पद वाक्यांश के रूप में अगले पद में जारी रहता है, इसलिए अंत में दीर्घ विराम-चिह्न रखा गया है।
