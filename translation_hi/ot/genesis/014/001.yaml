    text: या, “जातियों के राजा तिदाल।” इब्रानी शब्द गोयीम का सामान्य अर्थ “जातियाँ” है, लेकिन यहाँ अन्य राजकीय उपाधियों के समान यह किसी स्थान या जनसमूह का नाम भी हो सकता है।
    reason: lexical_alternative
