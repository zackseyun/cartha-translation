  text: וְ/עֵ֣מֶק הַ/שִׂדִּ֗ים בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר וַ/יָּנֻ֛סוּ מֶֽלֶךְ סְדֹ֥ם וַ/עֲמֹרָ֖ה וַ/יִּפְּלוּ שָׁ֑מָּ/ה וְ/הַ/נִּשְׁאָרִ֖ים הֶ֥רָ/ה נָּֽסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/010.yaml
  text: The Valley of Siddim was full of bitumen pits[a], and the kings of Sodom and Gomorrah fled and fell there[c][b], while the rest fled to the hill country.
translation:
  language: hi
  text: सिद्दीम की घाटी डामर के गड्ढों[a] से भरी थी; सदोम और अमोरा के राजा भागे और वहीं गिर पड़े[b], और बाकी लोग पहाड़ी प्रदेश की ओर भाग गए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, ‘बिटुमेन के गड्ढे’ या ‘तारकोल के गड्ढे’; इब्रानी शब्द बिटुमेन को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वे सिद्दीम की घाटी में गिरे; संभवतः डामर के गड्ढों में, पर मूल पाठ में यहाँ गड्ढों का स्पष्ट उल्लेख नहीं है।
    reason: ambiguity_preservation
  - marker: c
    text: या ‘पहाड़ों की ओर’।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵמֶק הַשִּׂדִּים
  choice: सिद्दीम की घाटी
  rationale: स्थान-नाम को लिप्यंतरित करते हुए עֵמֶק का स्वाभाविक हिन्दी रूप ‘घाटी’ रखा गया है।
- source_word: בֶּאֱרֹת בֶּאֱרֹת חֵמָר
  choice: डामर के गड्ढों से भरी थी
  rationale: संज्ञा की पुनरावृत्ति गड्ढों की बहुतायत दर्शाती है; חֵמָר बिटुमेन या प्राकृतिक डामर को सूचित करता है। ‘डामर’ सामान्य हिन्दी पाठक के लिए सहज है।
- source_word: מֶלֶךְ סְדֹם וַעֲמֹרָה
  choice: सदोम और अमोरा के राजा
  rationale: यद्यपि מֶלֶךְ रूपतः एकवचन है, दोनों नगरों का उल्लेख और आगे के बहुवचन क्रिया-रूप अलग-अलग राजाओं का संकेत देते हैं।
- source_word: וַיִּפְּלוּ שָׁמָּה
  choice: वहीं गिर पड़े
  rationale: मूल पाठ में נפל का सामान्य अर्थ ‘गिरना’ है और किसी स्पष्ट कर्म का उल्लेख नहीं है; इसलिए गड्ढों में गिरने की संभावित धारणा को मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: וְהַנִּשְׁאָרִים
  choice: बाकी लोग
  rationale: यह शेष बचे लोगों को दर्शाता है; आधुनिक हिन्दी में यह सहज और स्पष्ट अभिव्यक्ति है।
- source_word: הֶרָה
  choice: पहाड़ी प्रदेश की ओर
  rationale: הַר के साथ दिशासूचक प्रत्यय पहाड़ या पहाड़ी क्षेत्र की ओर गति बताता है; ‘पहाड़ी प्रदेश की ओर’ भौगोलिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיָּנֻסוּ / נָסוּ
  choice: भागे / भाग गए
  rationale: दोनों क्रियाएँ נוס धातु से हैं और युद्ध से पलायन को दर्शाती हैं; हिन्दी वाक्य-प्रवाह के अनुसार समान अर्थ के स्वाभाविक रूप रखे गए हैं।
