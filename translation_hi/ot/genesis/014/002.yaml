base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/002.yaml
  text: they made war against Bera king of Sodom[a], Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela (that is[c][b], Zoar).
translation:
  language: hi
  text: उन्होंने सदोम के राजा बेरा, अमोरा के राजा बिरशा, अदमा के राजा शिनाब, त्सबोयीम के राजा शेमेबेर और बेला (अर्थात् त्सोअर) के राजा के विरुद्ध युद्ध किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשׂוּ מִלְחָמָה
  choice: युद्ध किया
  rationale: हिब्रू मुहावरे का अर्थ स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है; ‘युद्ध छेड़ा’ की अपेक्षा यह आरम्भ करने का अतिरिक्त भाव नहीं जोड़ता।
- source_word: אֶת ... וְאֶת
  choice: के विरुद्ध
  rationale: इस प्रसंग में चिह्नित संज्ञाएँ उन राजाओं की सूची हैं जिनके विरुद्ध युद्ध किया गया; हिन्दी में एक बार सूची के अंत में ‘के विरुद्ध’ रखना सभी पाँच राजाओं पर स्पष्ट रूप से लागू होता है।
- source_word: בֶּרַע
  choice: बेरा
  rationale: व्यक्तिनाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: מֶלֶךְ סְדֹם
  choice: सदोम के राजा
  rationale: सम्बन्धसूचक हिब्रू पदबंध को स्वाभाविक हिन्दी क्रम में प्रस्तुत किया गया है।
- source_word: בִּרְשַׁע
  choice: बिरशा
  rationale: व्यक्तिनाम का हिब्रू उच्चारण के निकट लिप्यंतरण।
- source_word: עֲמֹרָה
  choice: अमोरा
  rationale: हिब्रू रूप का देवनागरी में प्रत्यक्ष लिप्यंतरण; अंग्रेज़ी के पारंपरिक ‘Gomorrah’ पर निर्भर नहीं।
- source_word: שִׁנְאָב
  choice: शिनाब
  rationale: व्यक्तिनाम का हिब्रू उच्चारण के निकट लिप्यंतरण।
- source_word: אַדְמָה
  choice: अदमा
  rationale: स्थाननाम का हिब्रू उच्चारण के निकट लिप्यंतरण।
- source_word: שֶׁמְאֵבֶר
  choice: शेमेबेर
  rationale: व्यक्तिनाम का हिब्रू उच्चारण के निकट लिप्यंतरण।
- source_word: צביים
  choice: सबोयीम
  rationale: मसोरेटिक पाठ के व्यंजन और स्वर-परंपरा के निकट हिन्दी लिप्यंतरण; अंग्रेज़ी रूप को आधार नहीं बनाया गया।
- source_word: מֶלֶךְ בֶּלַע
  choice: बेला के राजा
  rationale: मूल पाठ में इस अंतिम राजा का व्यक्तिगत नाम नहीं दिया गया; इसलिए केवल नगर के आधार पर उसकी पहचान बनाए रखी गई है।
- source_word: הִיא צֹעַר
  choice: अर्थात सोअर
  rationale: स्त्रीलिंग सर्वनाम ‘वह’ बेला नगर की ओर संकेत कर उसे सोअर के रूप में पहचानता है; ‘अर्थात’ इसका व्याख्यात्मक कार्य सहज हिन्दी में व्यक्त करता है।
