source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַבְרָ֖ם אֶל מֶ֣לֶךְ סְדֹ֑ם הֲרִימֹ֨תִי יָדִ֤/י אֶל יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/022.yaml
  text: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
translation:
  language: hi
  text: पर अब्राम ने सदोम के राजा से कहा, “मैंने याहवे, परमप्रधान परमेश्वर, आकाश और पृथ्वी के स्वामी[b], की ओर अपना हाथ उठाया है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हाथ उठाना शपथ लेने का इब्रानी संकेत था; अर्थात अब्राम शपथ खा रहा था।
    reason: cultural_note
  - marker: b
    text: या “सृष्टिकर्ता।” इब्रानी शब्द का अर्थ “स्वामी,” “अधिपति,” या इस संदर्भ में “सृष्टिकर्ता” समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर ... ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; तत्काल संदर्भ में सदोम के राजा के प्रस्ताव के प्रति अब्राम का उत्तर विरोधात्मक है, इसलिए ‘पर’ स्वाभाविक है।
- source_word: הֲרִימֹתִי יָדִי
  choice: मैंने ... अपना हाथ उठाया है
  rationale: मूल इब्रानी के ठोस शपथ-संकेत को बनाए रखा गया है; उसका सांस्कृतिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: उपाधि से बदलने के बजाय इब्रानी व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण रखा गया है।
- source_word: אֵל עֶלְיוֹן
  choice: परमप्रधान परमेश्वर
  rationale: उपाधि का स्वाभाविक और प्रतिष्ठित हिन्दी अनुवाद, जो परमेश्वर की सर्वोच्चता व्यक्त करता है।
- source_word: קֹנֵה
  choice: स्वामी
  rationale: यहाँ कृदंत अधिकार अथवा स्वामित्व का बोध दे सकता है; सहज हिन्दी के लिए ‘स्वामी’ चुना गया है, जबकि ‘सृष्टिकर्ता’ का संभावित अर्थ पादटिप्पणी में रखा गया है।
- source_word: שָׁמַיִם וָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: समस्त सृष्टि को सूचित करने वाले इब्रानी युग्म का मानक और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: पाठ में व्यक्तिगत ईश्वरीय नाम प्रत्यक्ष रूप से है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: קֹנֵה שָׁמַיִם וָאָרֶץ का अर्थ
  choice: आकाश और पृथ्वी के स्वामी
  alternative: आकाश और पृथ्वी के सृष्टिकर्ता
  rationale: इब्रानी शब्द प्राप्त करने, अधिकार रखने अथवा सृजन करने के अर्थ दे सकता है। मुख्य पाठ में स्वामित्व का अर्थ रखा गया है और वास्तविक अर्थ-संदेह को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। ‘के सामने’ शपथ की दिशा/साक्षी को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ में इब्रानी मुहावरा और קֹנֵה की अर्थगत खुलावट पादटिप्पणियों सहित सुरक्षित हैं।
