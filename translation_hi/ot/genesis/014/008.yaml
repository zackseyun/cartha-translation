language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֶֽלֶךְ סְדֹ֜ם וּ/מֶ֣לֶךְ עֲמֹרָ֗ה וּ/מֶ֤לֶךְ אַדְמָה֙ וּ/מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִוא צֹ֑עַר וַ/יַּֽעַרְכ֤וּ אִתָּ/ם֙ מִלְחָמָ֔ה בְּ/עֵ֖מֶק הַ/שִּׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/008.yaml
  text: Then the king of Sodom[a], the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out, and they drew up for battle with them in the Valley of Siddim.
translation:
  language: hi
  text: तब सदोम का राजा, अमोरा का राजा, अदमा का राजा, सबोयीम का राजा और बेला (अर्थात् सोअर) का राजा निकल पड़े। उन्होंने सिद्दीम की घाटी में उनके साथ युद्ध के लिए मोर्चा बाँधा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके विरुद्ध युद्ध के लिए मोर्चा बाँधा।” इब्रानी में शब्दशः “उनके साथ युद्ध” है।
    reason: इब्रानी אִתָּם का मूल अर्थ ‘उनके साथ’ है, पर युद्ध के संदर्भ में इसका आशय ‘उनके विरुद्ध’ समझा जा सकता है।
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: तब ... निकल पड़े
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है। क्रिया इब्रानी में एकवचन है और संयुक्त कर्ता से पहले आती है, पर हिन्दी में राजाओं के सामूहिक कार्य के लिए बहुवचन स्वाभाविक है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: प्रत्येक शासक की उपाधि के लिए मानक शब्द; इब्रानी की पुनरावृत्ति बनाए रखी गई है।
- source_word: סְדֹם / עֲמֹרָה / אַדְמָה / צביים
  choice: सदोम / अमोरा / अदमा / सबोयीम
  rationale: इन स्थान-नामों के प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाए गए हैं।
- source_word: בֶּלַע הִוא צֹעַר
  choice: बेला (अर्थात् सोअर)
  rationale: इब्रानी उपवाक्य बेला की पहचान सोअर के रूप में करता है; कोष्ठक आधुनिक हिन्दी में इस व्याख्यात्मक सूचना को स्पष्ट रखते हैं।
- source_word: וַיַּעַרְכוּ
  choice: मोर्चा बाँधा
  rationale: सैन्य प्रसंग में ערך सेना को युद्ध-क्रम में लगाने का संकेत देता है। ‘मोर्चा बाँधा’ वर्तमान हिन्दी में स्वाभाविक है और केवल ‘तैयार हुए’ से अधिक विशिष्ट सैन्य भाव रखता है।
- source_word: אִתָּם מִלְחָמָה
  choice: उनके साथ युद्ध के लिए
  rationale: אִתָּם का औपचारिक अर्थ ‘उनके साथ’ रखा गया है; युद्ध का संदर्भ विरोधी संबंध स्पष्ट करता है, जबकि ‘उनके विरुद्ध’ अर्थ को अधिक स्पष्ट पर कुछ अधिक व्याख्यात्मक बनाता।
- source_word: בְּעֵמֶק הַשִּׂדִּים
  choice: सिद्दीम की घाटी में
  rationale: עֵמֶק के लिए सहज आधुनिक हिन्दी ‘घाटी’ और स्थान-नाम के लिए ‘सिद्दीम’ लिप्यंतरण प्रयुक्त हुआ है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजाओं की सूची में इब्रानी की औपचारिक पुनरावृत्ति सुरक्षित है; लम्बे वाक्य को हिन्दी की पठनीयता के लिए दो वाक्यों में बाँटा गया है।
