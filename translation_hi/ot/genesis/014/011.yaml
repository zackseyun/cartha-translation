    text: या, “उनकी सारी रसद।” इब्रानी शब्द सामान्य भोजन या यात्रा अथवा सैनिक अभियान के लिए रखी खाद्य-सामग्री को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: लेकर
  rationale: לקח का सामान्य अर्थ ‘लेना’ है। अगले क्रियापद के साथ हिंदी में ‘लेकर चले गए’ स्वाभाविक है और बिना अनावश्यक व्याख्या के लूटकर ले जाने का प्रसंग व्यक्त करता है।
- source_word: כָּל
  choice: सारी
  rationale: दोनों संज्ञाओं के साथ दोहराए गए परिमाणवाचक शब्द की व्यापकता को ‘सारी’ से सुरक्षित रखा गया है।
- source_word: רְכֻשׁ
  choice: संपत्ति
  rationale: यह चल संपत्ति, माल या अधिकार में रखी वस्तुओं को सूचित करता है; ‘संपत्ति’ आधुनिक हिंदी में पर्याप्त व्यापक और स्पष्ट है।
- source_word: סְדֹם וַעֲמֹרָה
  choice: सदोम और अमोरा
  rationale: स्थान-नामों के प्रचलित हिंदी लिप्यंतरण रखे गए हैं।
- source_word: אָכְלָם
  choice: उनकी सारी खाद्य-सामग्री
  rationale: संज्ञा का मूल अर्थ भोजन है और प्रत्यय बहुवचन ‘उनकी’ को व्यक्त करता है। ‘खाद्य-सामग्री’ भोजन तथा संदर्भानुसार खाने की रसद—दोनों अर्थों के लिए स्वाभाविक व्यापकता रखती है।
- source_word: וַיֵּלֵכוּ
  choice: चले गए
  rationale: הלך के कथात्मक रूप को प्रस्थान के इस संदर्भ में स्वाभाविक हिंदी ‘चले गए’ से व्यक्त किया गया है।
