  yaml_path: translation/ot/genesis/014/011.yaml
  text: Then they took all the possessions of Sodom and Gomorrah[a], and all their food, and went away.
translation:
  language: hi
  text: तब वे सदोम और अमोरा की सारी संपत्ति और उनकी सारी खाद्य-सामग्री[a] लेकर चले गए।
  philosophy: optimal-equivalence
  footnotes:
