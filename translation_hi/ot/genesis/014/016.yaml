base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/016.yaml
  text: He brought back all the possessions[a]; he also brought back Lot his kinsman, and his possessions[d][c][b], and also the women and the people.
translation:
  language: hi
  text: वह सारी सम्पत्ति वापस ले आया; वह अपने सम्बन्धी[a] लूत और उसकी सम्पत्ति को भी वापस ले आया, तथा स्त्रियों और लोगों को भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उसका भाई लूत’; यहाँ ‘भाई’ का अर्थ निकट सम्बन्धी है। कथा के अनुसार लूत अब्राम का भतीजा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב / הֵשִׁיב
  choice: वापस ले आया
  rationale: दोनों हिफ़ील रूप किसी व्यक्ति या वस्तु को लौटाकर लाने का भाव देते हैं। हिन्दी में यह प्रयोग स्वाभाविक है; क्रिया की पुनरावृत्ति मूल पाठ की दो-खंडीय रचना को बनाए रखती है।
- source_word: כָּל הָרְכֻשׁ / וּרְכֻשׁוֹ
  choice: सारी सम्पत्ति / उसकी सम्पत्ति
  rationale: רְכוּשׁ चल सम्पत्ति, माल या सामान को दर्शाता है। ‘सम्पत्ति’ व्यापक और गरिमापूर्ण है तथा दोनों स्थानों पर समान शब्द रखने से मूल की पुनरावृत्ति बनी रहती है।
- source_word: וְגַם
  choice: भी
  rationale: ‘भी’ दोनों बार योग और बल के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לוֹט אָחִיו
  choice: अपने सम्बन्धी लूत
  rationale: אָחִיו का शाब्दिक अर्थ ‘उसका भाई’ है, पर यह निकट सम्बन्धी के व्यापक अर्थ में भी आता है। कथा में लूत अब्राम का भतीजा है, इसलिए मुख्य पाठ में ‘सम्बन्धी’ संदर्भ के अनुरूप है और पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: הַנָּשִׁים
  choice: स्त्रियों
  rationale: मूल संज्ञा व्यापक रूप से स्त्रियों को दर्शाती है; इसे केवल ‘पत्नियों’ तक सीमित करना पाठ से अधिक विशिष्ट होगा।
- source_word: הָעָם
  choice: अन्य लोगों
  rationale: עָם सामूहिक रूप से लोगों को दर्शाता है। हिन्दी में ‘स्त्रियों तथा लोगों’ स्त्रियों को ‘लोगों’ से अलग सुनवा सकता है, इसलिए ‘अन्य लोगों’ आशय स्पष्ट करता है कि शेष जनसमूह भी लौटाया गया।
