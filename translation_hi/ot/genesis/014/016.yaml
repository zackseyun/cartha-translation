translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। अर्धविराम मूल के दो मुख्य क्रियात्मक खंडों को अलग करता है। ‘सम्बन्धी’ व्यापक रिश्तेदारी को व्यक्त करता है, जबकि पादटिप्पणी मूल के शाब्दिक ‘भाई’ को सुरक्षित रखती है।
