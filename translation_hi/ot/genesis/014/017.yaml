  text: וַ/יֵּצֵ֣א מֶֽלֶךְ סְדֹם֮ לִ/קְרָאת/וֹ֒ אַחֲרֵ֣י שׁוּב֗/וֹ מֵֽ/הַכּוֹת֙ אֶת כְּדָרלָעֹ֔מֶר וְ/אֶת הַ/מְּלָכִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ אֶל עֵ֣מֶק שָׁוֵ֔ה ה֖וּא עֵ֥מֶק הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/017.yaml
  text: Then the king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him[a], to the Valley of Shaveh (that is[b], the King's Valley).
translation:
  language: hi
  text: कदोर्लाओमेर और उसके साथ के राजाओं को पराजित करके उसके लौट आने के बाद, सदोम का राजा उससे मिलने के लिए शावे की तराई की ओर निकला; यानी राजा की तराई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: तब ... निकला
  rationale: वाव-क्रमबोधक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिंदी में घटनाक्रम स्पष्ट करता है।
- source_word: מֶלֶךְ סְדֹם
  choice: सदोम का राजा
  rationale: इब्रानी संबंधसूचक रचना का सीधा और स्वाभाविक हिंदी रूप।
- source_word: לִקְרָאתוֹ
  choice: उससे मिलने के लिए
  rationale: किसी के स्वागत अथवा भेंट के उद्देश्य से बाहर जाने की सामान्य इब्रानी अभिव्यक्ति।
- source_word: אַחֲרֵי שׁוּבוֹ מֵהַכּוֹת
  choice: जब वह ... पराजित करके लौट रहा था
  rationale: वापसी और सैन्य विजय का संबंध सहज आधुनिक हिंदी में व्यक्त होता है; ‘पराजित’ נכה के प्रसंगगत सैन्य अर्थ को स्पष्ट करता है।
- source_word: כְּדָרלָעֹמֶר
  choice: कदोर्लाओमेर
  rationale: इब्रानी स्वरांकन के निकट देवनागरी लिप्यंतरण।
- source_word: וְאֶת הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: और उसके साथ के राजाओं को
  rationale: ‘उसके’ का निकटतम और प्रसंगगत पूर्वपद कदोर्लाओमेर है; हिंदी में संक्षिप्त और स्पष्ट।
- source_word: אֶל עֵמֶק שָׁוֵה
  choice: शावे की तराई तक
  rationale: אֶל की दिशात्मक शक्ति को ‘तक’ से बनाए रखा गया है; עֵמֶק के लिए भू-आकृतिक और पारंपरिक रूप से सुबोध ‘तराई’ चुना गया है।
- source_word: הוּא עֵמֶק הַמֶּלֶךְ
  choice: शावे की तराई को राजा की तराई भी कहा जाता है
  rationale: पहचान बताने वाले उपवाक्य को प्राकृतिक हिंदी में स्पष्ट किया गया है, बिना स्थानों को दो अलग जगह मानने का संकेत दिए।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। अस्पष्ट ‘वह/उससे’ को मूल के अनुरूप बनाए रखा गया है, जहाँ उसका संदर्भ निकटवर्ती कथा से पहचाना जाता है।
