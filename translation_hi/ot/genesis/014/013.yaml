base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/013.yaml
  text: Then a fugitive came and told Abram the Hebrew[a]. Now he was dwelling by the oaks of Mamre the Amorite, brother of Eshcol and brother of Aner[c][b]; these were allies of Abram.
translation:
  language: hi
  text: तब एक बच निकला व्यक्ति आया और उसने इब्री अब्राम को यह समाचार दिया। उस समय अब्राम एमोरी मम्रे के बांज वृक्षों के पास[a] रहता था। मम्रे एश्कोल और आनेर का भाई[b] था, और वे अब्राम के सहयोगी[c] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मम्रे के तारपीन वृक्षों के पास।” इब्रानी शब्द बड़े वृक्षों को दर्शा सकता है, जिन्हें प्रायः बांज या तारपीन वृक्ष माना जाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “एश्कोल और आनेर का संबंधी।” ‘भाई’ के लिए प्रयुक्त इब्रानी शब्द परिवार के किसी अधिक दूर के पुरुष संबंधी को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ, “अब्राम के साथ वाचा के स्वामी/भागी”; अर्थात वे लोग जो एक संधि द्वारा उससे बँधे थे।
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּלִיט
  choice: युद्ध से बच निकला एक व्यक्ति
  rationale: यह संज्ञा खतरे या युद्ध से बच निकलने वाले व्यक्ति को दर्शाती है। संदर्भ के आधार पर ‘युद्ध से’ जोड़ा गया है; ‘भगोड़ा’ अनावश्यक रूप से अपराध या पलायन का भाव दे सकता है।
- source_word: וַיַּגֵּד
  choice: यह समाचार दिया
  rationale: क्रिया का अर्थ बताना या सूचना देना है। कथात्मक संदर्भ में यह स्वाभाविक और स्पष्ट है।
- source_word: הָעִבְרִי
  choice: इब्री
  rationale: यहाँ अब्राम के लिए प्रयुक्त जातीय-सामाजिक पदनाम को पारंपरिक और पहचानने योग्य हिन्दी रूप में रखा गया है।
- source_word: שֹׁכֵן
  choice: रहता था
  rationale: कृदन्त उस समय जारी निवास को व्यक्त करता है; ‘रहता था’ आधुनिक हिन्दी में सहज रूप से इस कालगत भाव को बनाए रखता है।
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: मम्रे के बांज वृक्षों के पास
  rationale: אֵלֹנֵי बड़े वृक्षों के लिए प्रयुक्त हो सकता है, जिन्हें प्रायः बांज या तारपीन वृक्ष माना जाता है। मुख्य पाठ में परिचित ‘बांज वृक्ष’ रखा गया और अनिश्चितता पादटिप्पणी में सुरक्षित की गई है।
- source_word: הָאֱמֹרִי
  choice: एमोरी
  rationale: मम्रे की जातीय पहचान बताने वाला मानक पदनाम है।
- source_word: אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר
  choice: एश्कोल और आनेर का भाई
  rationale: दोहराए गए ‘भाई’ को स्वाभाविक हिन्दी में एक बार कहना पर्याप्त है। אָח का मूल अर्थ ‘भाई’ है, जबकि व्यापक संबंधी का अर्थ पादटिप्पणी में दिया गया है।
- source_word: בַּעֲלֵי בְרִית אַבְרָם
  choice: अब्राम के सहयोगी
  rationale: शाब्दिक मुहावरा ‘वाचा के स्वामी/भागी’ उन लोगों को दर्शाता है जो संधि द्वारा अब्राम से बँधे थे। ‘सहयोगी’ आधुनिक हिन्दी में संबंध का आशय स्पष्ट करता है; वाचागत स्वरूप पादटिप्पणी में बताया गया है।
