reference: Genesis 14:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִם מִ/חוּט֙ וְ/עַ֣ד שְׂרֽוֹךְ נַ֔עַל וְ/אִם אֶקַּ֖ח מִ/כָּל אֲשֶׁר לָ֑/ךְ וְ/לֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת אַבְרָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/023.yaml
  text: that I would not take from a thread to a sandal strap[a], or anything that is yours, lest you say, ‘I have made Abram rich.’
translation:
  language: hi
  text: कि मैं एक धागे से लेकर चप्पल के पट्टे तक, तुम्हारी कोई भी वस्तु नहीं लूँगा[a], ताकि तुम यह न कहो, ‘मैंने अब्राम को धनी बनाया है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में यह लुप्तांशयुक्त शपथ-सूत्र है; शब्दशः: “यदि एक धागे से लेकर चप्पल के पट्टे तक, और यदि मैं तुम्हारी किसी भी वस्तु में से लूँ...” इसका आशय शपथ खाकर कुछ भी लेने से इनकार करना है।'
    reason: मूल भाषा की शपथ-संरचना और अनुवाद में स्पष्ट किए गए निहित निषेध को बताना।
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: कि मैं ... नहीं लूँगा
  rationale: पद 22 में हाथ उठाकर खाई गई शपथ के संदर्भ में אִם एक लुप्तांशयुक्त शपथ-सूत्र है, साधारण शर्त नहीं। हिन्दी में निहित निषेध को स्पष्ट करने से शपथपूर्वक इनकार का अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: מִחוּט
  choice: एक धागे से
  rationale: חוּט का ठोस अर्थ ‘धागा’ है। ‘एक’ जोड़ने से अति छोटी वस्तु तक न लेने का भाव सहज हिन्दी में व्यक्त होता है।
- source_word: וְעַד שְׂרֹוךְ נַעַל
  choice: चप्पल के पट्टे तक
  rationale: שְׂרוֹךְ נַעַל प्राचीन पादत्राण को बाँधने वाले पट्टे को दर्शाता है। ‘चप्पल का पट्टा’ आधुनिक पाठक के लिए स्पष्ट है और ‘जूते का फीता’ जैसी काल-विसंगति से बचता है।
- source_word: אֶקַּח
  choice: मैं ... नहीं लूँगा
  rationale: शपथ-सूत्र के अधीन यह क्रिया भविष्य में कुछ न लेने का दृढ़ निश्चय व्यक्त करती है; हिन्दी का सामान्य भविष्यकाल इस आशय को ठीक से देता है।
- source_word: מִכָּל אֲשֶׁר לָךְ
  choice: तुम्हारी कोई भी वस्तु
  rationale: यह स्वामित्व और כָּל की सर्वसमावेशी शक्ति—राजा की वस्तुओं में से कुछ भी नहीं—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְלֹא תֹאמַר
  choice: ताकि तुम यह न कहो
  rationale: यह अब्राम के इनकार का उद्देश्य अथवा अभिप्रेत परिणाम बताता है। ‘ताकि’ आधुनिक हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: הֶעֱשַׁרְתִּי
  choice: मैंने ... धनी बनाया है
  rationale: עשר के हिफ़ील रूप का अर्थ किसी को धनी बनाना है। यह अनुवाद सदोम के राजा के संभावित दावे को सीधे बनाए रखता है।
- source_word: אַבְרָם
  choice: अब्राम
  rationale: नाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: लुप्तांशयुक्त शपथ-सूत्र
  choice: 'इसे शपथपूर्वक इनकार के रूप में स्पष्ट किया गया है: ‘मैं ... नहीं लूँगा।’'
  alternative: 'शब्दशः शर्त के रूप में: ‘यदि धागे से ... और यदि मैं लूँ...।’'
  rationale: इब्रानी शपथों में אִם के साथ दंड-वाक्य प्रायः अनकहा रहता है। पिछले पद में अब्राम का हाथ उठाना इस प्रयोग को शपथ बनाता है; निहित निषेध स्पष्ट करना अर्थ को प्रकट करता है, कोई नया धर्मवैचारिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद 22 से वाक्यगत संबंध बनाए रखने के लिए आरम्भ में ‘कि’ रखा गया है। ठोस इब्रानी बिंब ‘धागे’ और ‘चप्पल के पट्टे’ सुरक्षित हैं।
