  yaml_path: translation/ot/genesis/014/006.yaml
  text: and the Horites in their hill country of Seir[a], as far as El-paran, which is by the wilderness.
translation:
  language: hi
  text: और उन्होंने सेईर के पहाड़ी प्रदेश में होरियों को एल-पारान[a] तक पराजित किया, जो मरुभूमि के पास है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एल पारान”; यदि इस नाम को निश्चित स्थान-नाम के बजाय उसके शब्दार्थ के अनुसार समझा जाए, तो संभवतः “पारान का बलूत या तेरबिन्थ वृक्ष।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: को भी मारते हुए वे ... पहुँचे
  rationale: यह पद पिछले पद से पराजित किए गए लोगों की सूची जारी रखता है। हिब्रू कर्मचिह्न का अलग अनुवाद नहीं किया गया; संदर्भ से निहित क्रिया और अभियान की गति स्वाभाविक हिन्दी में स्पष्ट की गई है।
- source_word: הַחֹרִי
  choice: होरियों
  rationale: यह जातिवाचक सामूहिक नाम है; हिन्दी में प्रचलित लिप्यंतरण का बहुवचन रूप रखा गया है।
- source_word: בְּהַרְרָם שֵׂעִיר
  choice: सेईर के पहाड़ी प्रदेश में रहनेवाले
  rationale: शाब्दिक अर्थ ‘सेईर में उनके पहाड़ों’ के निकट है। ‘पहाड़ी प्रदेश’ क्षेत्र का स्वाभाविक हिन्दी बोध देता है और ‘रहनेवाले’ होरियों तथा उस भूभाग का संबंध स्पष्ट करता है।
- source_word: עַד
  choice: तक
  rationale: अभियान की भौगोलिक सीमा को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֵיל פָּארָן
  choice: एल-पारान
  rationale: इसे निश्चित स्थान-नाम मानकर लिप्यंतरित किया गया है, ताकि אֵיל को अनिवार्य रूप से ‘बांज’ या ‘बड़े वृक्ष’ के अर्थ में तय न किया जाए; वैकल्पिक व्युत्पत्तिपरक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר עַל הַמִּדְבָּר
  choice: जो जंगल के किनारे है
  rationale: यह संबंधवाचक उपवाक्य स्थान बताता है। यहाँ עַל का व्यापक स्थानिक अर्थ ‘किनारे’ से स्वाभाविक रूप में व्यक्त होता है।
