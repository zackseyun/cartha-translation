  text: וַ/יִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑י/ו וַ/יָּ֨רֶק אֶת חֲנִיכָ֜י/ו יְלִידֵ֣י בֵית֗/וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּ/שְׁלֹ֣שׁ מֵא֔וֹת וַ/יִּרְדֹּ֖ף עַד דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/014.yaml
  text: When Abram heard that his kinsman had been taken captive[a], he led out his trained men, born in his household, three hundred and eighteen[b], and pursued them as far as Dan.
translation:
  language: hi
  text: जब अब्राम ने सुना कि उसका भाई[a] बंदी बना लिया गया था, तब उसने अपने घर में जन्मे तीन सौ अठारह प्रशिक्षित जनों को जुटाया[b] और दान तक उनका पीछा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उसका भाई’; यहाँ ‘भाई’ निकट पुरुष रिश्तेदार, जैसे भतीजे, के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ अनूदित क्रिया का अर्थ ‘बाहर ले गया’, ‘निकाल लाया’ या सम्भवतः ‘हथियारबंद किया’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבָּה
  choice: बंदी बना लिया गया है
  rationale: שׁבה के निफ़अल रूप का युद्ध-संदर्भ में अर्थ बंदी बनाए जाना है। हिन्दी में यह प्रयोग स्वाभाविक और स्पष्ट है।
- source_word: אָחִיו
  choice: उसका भाई
  rationale: मूल इब्रानी में शाब्दिक रूप से ‘उसका भाई’ है। אָח निकट पुरुष रिश्तेदार के लिए भी प्रयुक्त हो सकता है; इसलिए मूल शब्द मुख्य पाठ में रखा और व्यापक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: וַיָּרֶק
  choice: जुटाया
  rationale: यह दुर्लभ और विवादित क्रिया इस संदर्भ में अब्राम द्वारा अपने जनों को पीछा करने के लिए तैयार करने अथवा बाहर ले जाने को दर्शाती है। ‘जुटाया’ सैन्य प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अन्य संभावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: חֲנִיכָיו
  choice: अपने ... प्रशिक्षित जनों
  rationale: यह संज्ञा अब्राम के अधिकार में प्रशिक्षित या दीक्षित लोगों को सूचित करती है। ‘प्रशिक्षित जन’ लिंग और सैन्य भूमिका दोनों को संदर्भ में सहज रूप से व्यक्त करता है, बिना ‘दास’ का अर्थ अनावश्यक रूप से जोड़ने के।
- source_word: יְלִידֵי בֵיתוֹ
  choice: अपने घर में जन्मे
  rationale: यह वाक्यांश घराने में जन्मे आश्रित जनों की पहचान कराता है। ‘अपने घर में जन्मे’ मूल संरचना और सामाजिक संदर्भ को सरल आधुनिक हिन्दी में बनाए रखता है।
- source_word: שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת
  choice: तीन सौ अठारह
  rationale: मूल की पूर्ण संख्या को हिन्दी शब्दों में दिया गया है, जो कथात्मक और गरिमापूर्ण शैली के अनुरूप है।
- source_word: וַיִּרְדֹּף
  choice: उनका पीछा किया
  rationale: רדף यहाँ सैन्य पीछा करने को सूचित करता है। कर्म ‘उनका’ प्रसंग से स्पष्ट है और हिन्दी में वाक्य पूरा करने के लिए स्वाभाविक रूप से जोड़ा गया है।
- source_word: עַד דָּן
  choice: दान तक
  rationale: עַד पीछा किए जाने की सीमा बताता है; ‘दान तक’ इसे संक्षिप्त और स्पष्ट रूप में व्यक्त करता है।
theological_decisions:
- issue: लूत के लिए प्रयुक्त संबंध-सूचक शब्द
  choice: मुख्य पाठ में ‘उसका भाई’
  alternative: उसका निकट संबंधी / उसका भतीजा
  rationale: यद्यपि लूत अब्राम का भतीजा है, मूल पाठ אָחִיו अर्थात ‘उसका भाई’ कहता है, और यह इब्रानी शब्द व्यापक रूप से निकट पुरुष रिश्तेदार को भी सूचित कर सकता है। मूल की अभिव्यक्ति को बिना व्याख्यात्मक सरलीकरण के रखा गया है और प्रासंगिक अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- issue: וַיָּרֶק की अनिश्चित क्रियात्मक बारीकी
  choice: जुटाया
  alternative: बाहर ले गया / निकाल लाया / सम्भवतः हथियारबंद किया
  rationale: क्रिया का सटीक भाव विवादित है। ‘जुटाया’ पीछा करने के लिए लोगों को सक्रिय करने का प्रसंगगत अर्थ देता है, पर किसी एक विवादित अर्थ को निर्णायक नहीं बनाता; विकल्प पाद-टिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, कथात्मक और गरिमापूर्ण शैली रखी गई है। ‘भाई’ मूल इब्रानी की जानबूझकर सुरक्षित रखी गई अभिव्यक्ति है; ‘जुटाया’ कठिन क्रिया के सैन्य संदर्भ को सहज रूप देता है, जबकि उसकी वास्तविक अनिश्चितता पाद-टिप्पणी में बनी रहती है।
