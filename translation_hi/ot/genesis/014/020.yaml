source:
  edition: WLC
  text: וּ/בָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר מִגֵּ֥ן צָרֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וַ/יִּתֶּן ל֥/וֹ מַעֲשֵׂ֖ר מִ/כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/020.yaml
  text: And blessed be God Most High[a], who delivered your enemies into your hand[b]. And he gave him a tenth of everything.
translation:
  language: hi
  text: और परमप्रधान परमेश्वर धन्य हो, जिसने तुम्हारे शत्रुओं को तुम्हारे हाथ में सौंप दिया। और उसने उसे सब कुछ में से दसवाँ भाग[a] दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, परंपरागत रूप से: “दशमांश।”'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “दिया” का कर्ता फिर से नहीं बताया गया है। संदर्भ से सबसे स्वाभाविक अर्थ यह है कि अब्राम ने मलिकिसिदक को सब कुछ में से दसवाँ भाग दिया।
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: और ... धन्य हो
  rationale: आशीर्वचन के विधिसूचक भाव को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है तथा आरम्भिक संयोजक को भी बनाए रखता है।
- source_word: אֵל עֶלְיוֹן
  choice: परमप्रधान परमेश्वर
  rationale: यह दैवी उपाधि है; 'परमप्रधान' עֶלְיוֹן का अर्थ रखता है और 'परमेश्वर' आधुनिक हिन्दी में אֵל का स्वाभाविक धार्मिक समतुल्य है।
- source_word: מִגֵּן
  choice: कर दिया
  rationale: यहाँ क्रिया का अर्थ शत्रुओं को किसी के अधिकार में सौंप देना है; पूरे वाक्यांश 'हाथ में कर दिया' से सैन्य विजय का आशय स्पष्ट होता है।
- source_word: צָרֶיךָ
  choice: तुम्हारे शत्रुओं
  rationale: बहुवचन और द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय को स्पष्ट तथा सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּיָדֶךָ
  choice: तुम्हारे हाथ में
  rationale: किसी के अधिकार या वश में सौंपने का इब्रानी मुहावरा ठोस रूप में सुरक्षित रहता है और हिन्दी में समझने योग्य है।
- source_word: וַיִּתֶּן
  choice: और उसने ... दिया
  rationale: सरल कथात्मक क्रम को रखता है और इब्रानी में न दोहराए गए कर्ता को सर्वनाम से ही व्यक्त कर उसकी कुछ अस्पष्टता बनाए रखता है।
- source_word: לוֹ
  choice: उसे
  rationale: परोक्ष कर्म को स्वाभाविक हिन्दी में व्यक्त करता है; सन्दर्भ में इसका संकेत मलिकिसिदक की ओर है।
- source_word: מַעֲשֵׂר
  choice: दसवाँ भाग
  rationale: शाब्दिक अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है और बाद की संस्थागत धारणाओं को अनावश्यक रूप से नहीं जोड़ता।
- source_word: מִכֹּל
  choice: सब कुछ का
  rationale: सम्पूर्ण वस्तुओं या लूट में से दिए गए अंश की व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: וַיִּתֶּן का निहित कर्ता
  choice: मुख्य पाठ में सर्वनाम रखा गया है; सन्दर्भतः अब्राम ने मलिकिसिदक को दिया।
  alternative: मलिकिसिदक को कर्ता माना जा सकता है, यद्यपि सन्दर्भ में यह कम सम्भावित है।
  rationale: इब्रानी वाक्य कर्ता को दोहराता नहीं है। निकटवर्ती सन्दर्भ और बाद का बाइबलीय उल्लेख अब्राम को कर्ता मानने के पक्ष में हैं, पर वास्तविक व्याकरणिक अस्पष्टता को पादटिप्पणी में सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और पाठयोग्य रूप। 'परमप्रधान परमेश्वर' दैवी उपाधि की ऊँचाई रखता है; 'तुम्हारे हाथ में' मूल मुहावरे को सुरक्षित रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
