  yaml_path: translation/ot/genesis/014/004.yaml
  text: For twelve years they had served Kedorlaomer[a], but in the thirteenth year they rebelled.
translation:
  language: hi
  text: बारह वर्ष तक वे कदोर्लाओमेर के अधीन रहे, पर तेरहवें वर्ष उन्होंने विद्रोह कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: बारह वर्ष तक
  rationale: इब्रानी अवधि को व्यक्त करता है; हिंदी में ‘तक’ इस जारी अवधि को स्वाभाविक रूप से प्रकट करता है।
- source_word: עָבְדוּ
  choice: वे ... के अधीन रहे
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है, पर यहाँ राजनैतिक संदर्भ में किसी अधिपति के वश या अधीन रहने का भाव है। ‘के अधीन रहे’ सामान्य हिंदी में यह आशय स्पष्ट करता है।
- source_word: כְּדָרְלָעֹמֶר
  choice: कदोर्लाओमेर
  rationale: व्यक्तिनाम का अनुवाद नहीं, बल्कि इब्रानी रूप के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: पर तेरहवें वर्ष
  rationale: शाब्दिक रूप ‘और तेरह वर्ष’ है, किंतु प्रसंग में तेरहवें वर्ष का समय और घटनात्मक विरोध अभिप्रेत है; हिंदी में यह रूप सहज और स्पष्ट है।
- source_word: מָרָדוּ
  choice: उन्होंने विद्रोह कर दिया
  rationale: क्रिया का अर्थ राजसत्ता के विरुद्ध विद्रोह करना है। ‘कर दिया’ कथानक में निर्णायक घटना को स्वाभाविक हिंदी में व्यक्त करता है।
