base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/020.yaml
  text: So the field and the cave that was in it were deeded to Abraham as a burial property from the sons of Heth[a][b][c].
translation:
  language: hi
  text: इस प्रकार वह खेत और उसमें की गुफा हेत के पुत्रों से अब्राहम को दफ़न के लिए एक संपत्ति के रूप में हस्तांतरित हो गए।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “हित्ती लोग।”
    reason: בְּנֵי חֵת का प्रचलित जातीय नामार्थ।
  - marker: b
    text: अधिक शाब्दिक रूप में, “अब्राहम को दफ़न की संपत्ति के रूप में स्थापित हो गए।” यहाँ इब्रानी क्रिया कानूनी स्वामित्व के अब्राहम के पक्ष में स्थापित हो जाने का संकेत देती है।
    reason: मूल क्रिया के अधिक औपचारिक अनुवाद और उसके कानूनी संदर्भ को बताना।
lexical_decisions:
- source_word: וַיָּקָם
  choice: विधिवत पक्के हो गए
  rationale: इस भूमि-क्रय के कानूनी संदर्भ में क्रिया קום संपत्ति पर अब्राहम का अधिकार विधिवत स्थापित और मान्य हो जाने को दर्शाती है। यह हिंदी प्रयोग कानूनी पुष्टि का भाव व्यक्त करता है, जबकि मूल के रूपक को जबरन शाब्दिक नहीं बनाता।
- source_word: הַשָּׂדֶה
  choice: वह खेत
  rationale: यह पहले वर्णित खरीदी गई भूमि को स्वाभाविक और स्पष्ट रूप से दर्शाता है।
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: और उसमें की गुफा
  rationale: सर्वनाम का संबंध खेत से बनाए रखते हुए इब्रानी संबंधवाचक वाक्यांश को संक्षिप्त, स्वाभाविक हिंदी में प्रस्तुत करता है।
- source_word: לְאַבְרָהָם
  choice: अब्राहम के लिए
  rationale: लामेद अब्राहम को कानूनी प्राप्तकर्ता और स्वामी के रूप में चिह्नित करता है।
- source_word: לַאֲחֻזַּת קָבֶר
  choice: कब्रिस्तान की संपत्ति के रूप में
  rationale: אֲחֻזָּה के स्वामित्व अथवा स्थायी संपत्ति के कानूनी भाव और קָבֶר के दफन-संबंधी प्रयोजन, दोनों को व्यक्त करता है।
- source_word: מֵאֵת
  choice: की ओर से
  rationale: लेन-देन में स्वामित्व देने वाले पक्ष को दर्शाता है; हिंदी में यह 'के हाथ से' की अपेक्षा अधिक स्वाभाविक है।
- source_word: בְּנֵי חֵת
  choice: हेत के वंशजों
  rationale: इब्रानी अभिव्यक्ति के वंशगत रूप को बनाए रखता है और आधुनिक हिंदी में 'हेत के पुत्रों' से अधिक स्वाभाविक है।
