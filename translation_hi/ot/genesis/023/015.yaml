  text: אֲדֹנִ֣/י שְׁמָעֵ֔/נִי אֶרֶץ֩ אַרְבַּ֨ע מֵאֹ֧ת שֶֽׁקֶל כֶּ֛סֶף בֵּינִ֥/י וּ/בֵֽינְ/ךָ֖ מַה הִ֑וא וְ/אֶת מֵתְ/ךָ֖ קְבֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/015.yaml
  text: 'My lord[a], listen to me: a piece of land worth four hundred shekels of silver—what is that between me and you? Bury your dead.'
translation:
  language: hi
  text: “मेरे स्वामी, मेरी बात सुनिए। भूमि का एक टुकड़ा, जिसकी कीमत चार सौ शेकेल चाँदी है[a]—वह मेरे और आपके बीच क्या है? और अपने मृतक को दफ़ना दीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “भूमि—चार सौ शेकेल चाँदी—वह मेरे और आपके बीच क्या है?” इब्रानी वाक्य संक्षिप्त और लुप्तपदीय है; सौदे की बातचीत में यह आलंकारिक ढंग से कीमत को मामूली बताता है।'
    reason: मूल की लुप्तपदीय रचना और सम्भव अधिक शाब्दिक अनुवाद बताने के लिए।
lexical_decisions:
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: यह एप्रोन के लिए आदरसूचक संबोधन है, परमेश्वर की उपाधि नहीं। ‘मेरे स्वामी’ सामाजिक विनम्रता और एकवचन संबोधन को बनाए रखता है।
- source_word: שְׁמָעֵנִי
  choice: मेरी बात सुनिए
  rationale: आदरपूर्ण आग्रह के संदर्भ में यह आधुनिक हिन्दी का स्वाभाविक रूप है और इब्रानी आज्ञार्थक भाव को व्यक्त करता है।
- source_word: אֶרֶץ
  choice: भूमि का यह टुकड़ा
  rationale: यहाँ शब्द सामान्य अर्थ में धरती नहीं, बल्कि सौदे में विचाराधीन निश्चित भूखंड को सूचित करता है।
- source_word: אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף
  choice: मूल्य चार सौ शेकेल चाँदी है
  rationale: इब्रानी वाक्यांश संक्षिप्त और लुप्तपदीय है; ‘मूल्य’ जोड़ने से उसका संदर्भगत आशय स्वाभाविक हिन्दी में स्पष्ट होता है, जबकि मूल राशि और भार-मुद्रा ‘शेकेल’ सुरक्षित रहते हैं।
- source_word: בֵּינִי וּבֵינְךָ מַה הִוא
  choice: यह मेरे और आपके बीच क्या है?
  rationale: यह शब्दक्रम दोनों एकवचन पक्षों को स्पष्ट रखता है और सौदे के दौरान कीमत को तुच्छ बताने वाले आलंकारिक प्रश्न को बिना समझाए प्रस्तुत करता है।
- source_word: וְאֶת מֵתְךָ קְבֹר
  choice: अपने मृतक को दफ़ना दीजिए
  rationale: ‘अपने मृतक’ एकवचन इब्रानी के अनुरूप है। आदरसूचक आज्ञार्थक रूप वार्तालाप के सामाजिक स्तर के अनुकूल है; आरंभिक वाव को अलग परिणामसूचक ‘इसलिए’ बनाकर अधिक स्पष्ट नहीं किया गया।
