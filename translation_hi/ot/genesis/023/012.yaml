lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: झुककर प्रणाम किया
  rationale: यह क्रिया आदर या विनम्रता प्रकट करने के लिए झुकने का संकेत देती है। इस सामाजिक लेन-देन के प्रसंग में यह सम्मानसूचक शारीरिक भाव है, आराधना नहीं।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह पदबंध किसी की उपस्थिति में या उसके सामने होने का स्वाभाविक अर्थ देता है।
- source_word: עַם הָאָרֶץ
  choice: उस देश के लोगों
  rationale: यहाँ संयुक्त पदबंध स्थानीय क्षेत्र के लोगों को एक सामाजिक समुदाय के रूप में दर्शाता है; 'उस देश के लोग' आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: וַ
  choice: तब
  rationale: वाव-युक्त कथात्मक क्रिया घटनाक्रम को आगे बढ़ाती है; 'तब' क्रमिक प्रगति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַבְרָהָם
  choice: अब्राहम
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
