  yaml_path: translation/ot/genesis/023/003.yaml
  text: Then Abraham rose from before his dead wife and spoke to the sons of Heth[a], saying,
translation:
  language: hi
  text: 'फिर अब्राहम अपनी मृत पत्नी के पास से उठा और हेत के पुत्रों[a] से बोला:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हित्ती’; इब्रानी में ‘हेत के पुत्रों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: फिर ... उठा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘फिर’ घटनाक्रम और ‘उठा’ קום की क्रिया को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: מֵעַל פְּנֵי
  choice: के पास से
  rationale: इस प्रसंग में यह मुहावरा मृत देह की निकट उपस्थिति से हटने को दर्शाता है; शाब्दिक ‘मुख के ऊपर से’ हिन्दी में भ्रामक होता।
- source_word: מֵתוֹ
  choice: अपनी मृत पत्नी
  rationale: इब्रानी में शाब्दिक अर्थ ‘उसकी मृत जन’ है; पिछले प्रसंग से स्त्री और पत्नी सारा स्पष्ट है। हिन्दी में ‘अपनी मृत पत्नी’ स्वाभाविक है और संदर्भ को बिना नाम दोहराए स्पष्ट रखता है।
- source_word: וַיְדַבֵּר ... לֵאמֹר
  choice: से कहने लगा,
  rationale: यह स्वाभाविक हिन्दी वाक्यांश बोलने की क्रिया और आगे आने वाले कथन की भूमिका—दोनों को व्यक्त करता है।
- source_word: בְּנֵי חֵת
  choice: हेत के पुत्रों
  rationale: मूल पदबंध ‘हेत के पुत्र’ को मुख्य पाठ में बनाए रखा गया है; प्रचलित जातिनाम ‘हित्ती’ पादटिप्पणी में दिया गया है।
