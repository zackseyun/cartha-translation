  text: וַ/תָּ֣מָת שָׂרָ֗ה בְּ/קִרְיַ֥ת אַרְבַּ֛ע הִ֥וא חֶבְר֖וֹן בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יָּבֹא֙ אַבְרָהָ֔ם לִ/סְפֹּ֥ד לְ/שָׂרָ֖ה וְ/לִ/בְכֹּתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/002.yaml
  text: And Sarah died in Kiriath-arba (that is[a], Hebron) in the land of Canaan[b], and Abraham came to mourn for Sarah and to weep for her.
translation:
  language: hi
  text: और सारा कनान देश में किर्यत-अरबा, अर्थात् हेब्रोन[a], में मर गई; और अब्राहम सारा के लिए विलाप करने[b] और उसके लिए रोने आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ किर्यत-अरबा की पहचान हेब्रोन के रूप में की गई है।
    reason: cross_reference
  - marker: b
    text: या, “सारा के लिए शोक मनाने और उसके लिए रोने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: मर गई
  rationale: מות मृत्यु को सीधे व्यक्त करता है; ‘मर गई’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है तथा मूल कथन को नरम नहीं करता।
- source_word: בְּקִרְיַת אַרְבַּע
  choice: किर्यत-अरबा में
  rationale: स्थान-नाम का लिप्यंतरण किया गया है; योजक-चिह्न हिब्रू पदबंध की पारंपरिक नाम-रचना को स्पष्ट रखता है।
- source_word: הִוא חֶבְרוֹן
  choice: यह हेब्रोन है
  rationale: हिब्रू का सर्वनाम-संज्ञा वाक्य किर्यत-अरबा की पहचान हेब्रोन के रूप में कराता है; यह रूप उसकी संक्षिप्त व्याख्यात्मक शक्ति बनाए रखता है।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश के
  rationale: अर्थ ‘कनान देश में’ है; हिन्दी में स्थान के भीतर नगर बताने के लिए ‘कनान देश के ... में’ अधिक स्वाभाविक है और אֶרֶץ को भी व्यक्त करता है।
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का सामान्य अर्थ ‘आना’ है। कथात्मक दृष्टिकोण के अनुरूप ‘आया’ रखा गया; मूल यह नहीं बताता कि वह कहाँ से आया।
- source_word: לִסְפֹּד לְשָׂרָה
  choice: सारा के लिए विलाप करने
  rationale: ספד शोक के अवसर पर विलाप करने को दर्शाता है। ‘विलाप’ औपचारिक शोक की विशेषता को ‘शोक मनाने’ से अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: וְלִבְכֹּתָהּ
  choice: और उस पर रोने
  rationale: בכה रोने को व्यक्त करता है और स्त्रीलिंग प्रत्यय सारा की ओर संकेत करता है। ‘उस पर रोने’ शोक-संदर्भ में स्वाभाविक है और व्यक्तिगत संबंध बनाए रखता है।
