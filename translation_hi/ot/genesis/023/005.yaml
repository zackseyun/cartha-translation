lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: तब ... उत्तर देते हुए
  rationale: ענה का क़ाल वय्यिक्तोल कथानक में अगली प्रतिक्रिया आरम्भ करता है। ‘उत्तर’ संवाद-संदर्भ को स्पष्ट रखता है, और ‘तब’ क्रमागत कथन-रूप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְנֵי חֵת
  choice: हेत के पुत्रों
  rationale: इब्रानी का शाब्दिक वंश-सूचक पद ‘हेत के पुत्र’ है। इसे मुख्य पाठ में रखने से मूल अभिव्यक्ति और ‘हेत’ नाम सुरक्षित रहते हैं; प्रासंगिक सामूहिक विकल्प ‘हित्ती लोग’ पादटिप्पणी में दिया गया है।
- source_word: אֶת אַבְרָהָם
  choice: अब्राहम को
  rationale: אֶת निश्चित प्रत्यक्ष कर्म का चिह्न है; हिन्दी में कर्म-चिह्न ‘को’ द्वारा अब्राहम को उत्तर के संबोधित कर्म के रूप में व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: אמר का infinitive construct आगामी प्रत्यक्ष वचन का परिचय देता है। ‘कहा’ आधुनिक हिन्दी में इस सूत्र को सहज रूप से व्यक्त करता है।
- source_word: לוֹ
  choice: उससे
  rationale: ל के साथ तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय संबोधित व्यक्ति अब्राहम की ओर संकेत करता है। ‘उससे’ इस संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
