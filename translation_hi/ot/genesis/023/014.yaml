  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: तब … ने … उत्तर देते हुए कहा
  rationale: संवादात्मक कथा में ענה का यह रूप पिछले कथन के प्रत्युत्तर को आगे बढ़ाता है। हिंदी में ‘तब’ क्रम को और ‘उत्तर देते हुए कहा’ प्रत्युत्तर तथा आगामी प्रत्यक्ष कथन, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֶפְרוֹן
  choice: एप्रोन
  rationale: हिब्रू नाम עֶפְרוֹן का हिंदी देवनागरी में स्रोत-निकट और सुबोध लिप्यंतरण।
- source_word: אֶת אַבְרָהָם
  choice: अब्राहम को
  rationale: אֵת कर्म-सूचक चिह्न है; ענה के संवादात्मक प्रयोग में अब्राहम संबोधित व्यक्ति हैं। ‘अब्राहम को’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह infinitive construct आगामी वचन का परिचय देता है। संयुक्त अभिव्यक्ति ‘उत्तर देते हुए कहा’ हिब्रू की उत्तर देने और कहने की दोनों क्रियाओं को बनाए रखती है।
- source_word: לוֹ
  choice: अब्राहम को में निहित
  rationale: सर्वनाम का संदर्भ अब्राहम है। हिंदी में ‘अब्राहम को उत्तर देते हुए’ के बाद अलग से ‘उससे’ कहना अनावश्यक और बोझिल पुनरुक्ति होगा।
