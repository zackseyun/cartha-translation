  yaml_path: translation/ot/genesis/023/007.yaml
  text: Then Abraham rose and bowed down to the people of the land[a], to the sons of Heth.
translation:
  language: hi
  text: तब अब्राहम उठा और उस देश के लोगों के सामने—अर्थात् हेत के वंशजों[a] के सामने—झुका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “हेत के पुत्र”; इन्हें “हित्ती” भी कहा जाता है।
    reason: वंशसूचक इब्रानी पद और प्रचलित जातीय नाम—दोनों को पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: וַיָּקָם
  choice: तब अब्राहम उठा
  rationale: קום का यह कथात्मक रूप उठने या खड़े होने को दर्शाता है। “तब” क्रमसूचक וַ का स्वाभाविक हिन्दी रूप है।
- source_word: וַיִּשְׁתַּחוּ
  choice: झुका
  rationale: שׁחה आदरपूर्वक नीचे झुकने या दण्डवत् होने का संकेत देता है। प्रसंग में “झुका” शारीरिक भाव को सहज ढंग से रखता है और इसे अनिवार्यतः उपासना नहीं बनाता।
- source_word: לְעַם הָאָרֶץ
  choice: उस देश के लोगों के सामने
  rationale: לְ यहाँ झुकने की क्रिया के सम्मुख व्यक्ति-समूह को चिह्नित करता है। עַם הָאָרֶץ का निकट और स्वाभाविक अनुवाद “उस देश के लोग” है।
- source_word: לִבְנֵי חֵת
  choice: अर्थात् हेत के वंशजों के सामने
  rationale: शाब्दिक अर्थ “हेत के पुत्र” है, पर जातीय-सामुदायिक संदर्भ में आधुनिक हिन्दी का “हेत के वंशज” अधिक स्पष्ट है। दोहराया गया לְ “के सामने” की पुनरावृत्ति से प्रतिबिंबित हुआ है, और यह पद पहले समूह की पहचान स्पष्ट करता है।
- source_word: חֵת
  choice: हेत
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण किया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। “दण्डवत् किया” से उत्पन्न हो सकने वाले अनावश्यक उपासना-संकेत से बचते हुए सम्मानसूचक शारीरिक भाव के लिए “झुका” चुना गया है।
