base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/016.yaml
  text: 'So Abraham listened to Ephron[a], and Abraham weighed out for Ephron the silver that he had spoken in the hearing of the sons of Heth: four hundred shekels of silver[b], current with the merchant.'
translation:
  language: hi
  text: तब अब्राहम ने एप्रोन की बात सुनी, और अब्राहम ने एप्रोन के लिए वह चाँदी तौल दी जिसकी मात्रा उसने हित्तियों[a] के सुनते बताई थी—चार सौ शेकेल चाँदी, जो व्यापार में प्रचलित थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हेत के पुत्र।”
    reason: lexical_alternative
  - marker: b
    text: या “जो व्यापारी को स्वीकार्य थी,” अथवा “व्यापारियों के मानक भार के अनुसार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אַבְרָהָם אֶל עֶפְרוֹן
  choice: अब्राहम ने एप्रोन की बात मान ली
  rationale: שׁמע אל का अर्थ किसी की बात सुनना और उस पर ध्यान देना है; लेन-देन के इस संदर्भ में हिंदी का ‘बात मान ली’ मूल्य को स्वीकार कर आगे बढ़ने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּשְׁקֹל
  choice: तौल दी
  rationale: שׁקל चाँदी को भार से तौलने की ठोस क्रिया बताता है, क्योंकि यह सिक्कों के प्रचलन से पहले भार के रूप में भुगतान था।
- source_word: הַכֶּסֶף
  choice: चाँदी
  rationale: כֶּסֶף यहाँ भुगतान में प्रयुक्त धातु चाँदी है; ‘धन’ या ‘रुपये’ की अपेक्षा यह ऐतिहासिक और भौतिक विशिष्टता बनाए रखता है।
- source_word: אֲשֶׁר דִּבֶּר
  choice: जितनी मात्रा बताई थी
  rationale: דבר का मूल अर्थ ‘कहा’ है, पर संदर्भ में एप्रोन द्वारा सार्वजनिक रूप से बताई गई चाँदी की मात्रा अभिप्रेत है; यह अनुवाद हिंदी में स्पष्ट और प्रसंगानुकूल है।
- source_word: בְּאָזְנֵי בְנֵי חֵת
  choice: हित्तियों के सुनते
  rationale: בְּאָזְנֵי का शाब्दिक भाव ‘कानों में’ है और सार्वजनिक सुनवाई को दर्शाता है। ‘हित्तियों के सुनते’ संक्षिप्त, स्वाभाविक और मूल के निकट है; ‘हेत के पुत्र’ का शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: אַרְבַּע מֵאוֹת שֶׁקֶל כֶּסֶף
  choice: चार सौ शेकेल चाँदी
  rationale: यह भार और पदार्थ की सीधी अभिव्यक्ति है। ‘शेकेल’ प्राचीन भार-इकाई को सुरक्षित रखता है।
- source_word: עֹבֵר לַסֹּחֵר
  choice: जो व्यापारियों के बीच प्रचलित थी
  rationale: मुहावरे का आशय व्यापार में स्वीकार्य या मानक चाँदी से है। यह रूप मूल की व्यापारिक धारणा को सहज हिंदी में रखता है, जबकि संभावित वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
