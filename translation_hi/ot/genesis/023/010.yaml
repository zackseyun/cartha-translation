base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/010.yaml
  text: Ephron was sitting among the sons of Heth[a], and Ephron the Hittite answered Abraham in the hearing of the sons of Heth, before all who entered the gate of his city, saying[b],
translation:
  language: hi
  text: एप्रोन हेत के वंशजों[a] के बीच बैठा था, और हित्ती एप्रोन ने हेत के वंशजों की सुनवाई में, और उसके नगर के फाटक[b] से प्रवेश करने वाले सभी लोगों के सामने, अब्राहम को उत्तर दिया और कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर “हेत के वंशज” का अनुवाद “हित्ती लोग” भी हो सकता है; इब्रानी में शाब्दिक रूप से “हेत के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: नगर का फाटक वह सार्वजनिक स्थान था जहाँ साक्षियों की उपस्थिति में कानूनी और व्यापारिक मामलों का निपटारा किया जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב
  choice: बैठा था
  rationale: इब्रानी कृदन्त दृश्य में एप्रोन की उस समय की स्थिति को दर्शाता है; ‘बैठा था’ इस जारी स्थितिपरक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּתוֹךְ
  choice: के बीच
  rationale: सभा में उपस्थित समुदाय के मध्य होने का सामाजिक अर्थ व्यक्त करता है।
- source_word: בְּנֵי חֵת
  choice: हेत के वंशज
  rationale: इब्रानी ‘हेत के पुत्र’ का वंश-समुदाय संबंध बनाए रखते हुए ‘वंशज’ आधुनिक हिन्दी में अधिक स्वाभाविक है; वैकल्पिक जातीय पद ‘हित्ती लोग’ पादटिप्पणी में दिया गया है।
- source_word: וַיַּעַן
  choice: उत्तर देते हुए कहा
  rationale: संवाद में ענה का सामान्य अर्थ ‘उत्तर देना’ है; अगले पद की प्रत्यक्ष वाणी से जोड़ने के लिए हिन्दी में संयुक्त अभिव्यक्ति स्वाभाविक है।
- source_word: הַחִתִּי
  choice: हित्ती
  rationale: निश्चित जातीय पहचान को संक्षिप्त और प्रचलित हिन्दी रूप में व्यक्त करता है।
- source_word: בְּאָזְנֵי
  choice: के सुनते हुए
  rationale: इब्रानी मुहावरे का अर्थ है कि बात संबंधित लोगों की सुनवाई में सार्वजनिक रूप से कही गई।
- source_word: לְכֹל בָּאֵי שַׁעַר עִירוֹ
  choice: उन सभी लोगों के सामने जो उसके नगर के फाटक में प्रवेश करते थे
  rationale: सभी सार्वजनिक साक्षियों की उपस्थिति और मूल के प्रवेश-संबंधी पदबंध, दोनों को सुरक्षित रखता है।
- source_word: שַׁעַר עִירוֹ
  choice: उसके नगर का फाटक
  rationale: इब्रानी संबंधसूचक रचना का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: आगे आने वाली प्रत्यक्ष वाणी का मानक कथात्मक परिचय है।
