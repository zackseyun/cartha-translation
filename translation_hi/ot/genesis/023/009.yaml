base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/009.yaml
  text: and let him give me the cave of Machpelah[a], which belongs to him, which is at the end of his field. For the full price in silver[d][c][b], let him give it to me among you as a burial property.
translation:
  language: hi
  text: और वह मुझे मकपेला की वह गुफा दे दे, जो उसकी है और उसके खेत के छोर पर है; वह उसे तुम्हारे बीच चाँदी की पूरी कीमत पर मुझे दफ़नाने के लिए संपत्ति के रूप में दे दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दफ़नाने के लिए संपत्ति’ का अर्थ केवल दफ़नाने की अनुमति नहीं, बल्कि दफ़नाने के लिए कानूनी रूप से अधिकार में ली गई संपत्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: और वह ... दे दे
  rationale: निवेदन के प्रसंग में हिब्रू अपूर्ण क्रिया का इच्छार्थक बल है; ‘दे दे’ आधुनिक हिन्दी में विनम्र किंतु स्पष्ट अनुरोध व्यक्त करता है।
- source_word: מְעָרַת הַמַּכְפֵּלָה
  choice: मकपेला की गुफा
  rationale: सम्बन्धवाचक रचना और स्थान-नाम को स्वाभाविक हिन्दी में रखा गया है।
- source_word: אֲשֶׁר לוֹ
  choice: जो उसकी है
  rationale: मूल की स्वामित्व-सूचक संक्षिप्त अभिव्यक्ति को बनाए रखता है।
- source_word: אֲשֶׁר בִּקְצֵה שָׂדֵהוּ
  choice: उसके खेत के छोर पर है
  rationale: קצה का अर्थ छोर, किनारा या अंतिम भाग हो सकता है; ‘छोर’ इस स्थानिक व्यापकता को अपेक्षाकृत सुरक्षित रखता है।
- source_word: בְּכֶסֶף מָלֵא
  choice: चाँदी की पूरी कीमत पर
  rationale: शाब्दिक ‘पूरी चाँदी’ भुगतान की पूरी रकम का मुहावरा है; यह अनुवाद लेन-देन का आशय स्पष्ट करता है और चाँदी का उल्लेख भी बनाए रखता है।
- source_word: יִתְּנֶנָּה
  choice: उसे ... दे दे
  rationale: क्रिया נתן को ‘देना’ ही रखा गया है; कीमत का वाक्यांश स्पष्ट करता है कि यह बिना मूल्य का उपहार नहीं है।
- source_word: בְּתוֹכְכֶם
  choice: तुम लोगों के बीच
  rationale: समुदाय के बीच और उसकी मान्यता में संपत्ति हस्तांतरण का सामाजिक-कानूनी संदर्भ सुरक्षित रहता है।
- source_word: לַאֲחֻזַּת קָבֶר
  choice: कब्र की संपत्ति के रूप में
  rationale: אֲחֻזָּה केवल उपयोग-स्थान नहीं, बल्कि अधिकारपूर्वक रखी गई संपत्ति को सूचित करता है।
