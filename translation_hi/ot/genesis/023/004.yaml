  text: גֵּר וְ/תוֹשָׁ֥ב אָנֹכִ֖י עִמָּ/כֶ֑ם תְּנ֨וּ לִ֤/י אֲחֻזַּת קֶ֨בֶר֙ עִמָּ/כֶ֔ם וְ/אֶקְבְּרָ֥ה מֵתִ֖/י מִ/לְּ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/004.yaml
  text: I am a foreigner and a sojourner among you[a]. Give me a burial site among you[b], so that I may bury my dead out of my sight.
translation:
  language: hi
  text: “मैं आपके बीच एक परदेशी और प्रवासी हूँ। मुझे आपके बीच कब्र के लिए एक संपत्ति[a] दीजिए, ताकि मैं अपने मृतक को दफ़ना कर अपनी आँखों के सामने से हटा दूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध में केवल कब्र की जगह नहीं, बल्कि अधिकार में ली गई भूमि या संपत्ति का भाव भी है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “मेरे सामने से।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: परदेशी
  rationale: यह शब्द ऐसे व्यक्ति को दर्शाता है जो अपनी जन्मभूमि और कुल-क्षेत्र से बाहर रहता है तथा जिसे स्थानीय भूमि-अधिकार पूर्ण रूप से प्राप्त नहीं हैं। ‘परदेशी’ आधुनिक हिन्दी में स्वाभाविक है और अब्राहम की बाहरी सामाजिक स्थिति को बनाए रखता है।
- source_word: וְתוֹשָׁב
  choice: प्रवासी
  rationale: यह גֵּר के साथ मिलकर स्थानीय समाज में रहने, पर स्थायी पैतृक अधिकार न रखने की स्थिति बताता है। ‘प्रवासी’ सामान्य पाठक के लिए सुबोध है और केवल अल्पकालिक ठहराव का अनावश्यक दावा नहीं करता।
- source_word: עִמָּכֶם
  choice: आपके बीच
  rationale: शाब्दिक अर्थ ‘आपके साथ’ है, पर यहाँ सामुदायिक उपस्थिति का भाव है; दोनों स्थानों पर ‘आपके बीच’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: תְּנוּ לִי
  choice: मुझे ... दीजिए
  rationale: נתן का आज्ञार्थक रूप सीधा अनुरोध है। बहुवचन संबोधन और विनम्र हिन्दी प्रयोग के लिए ‘दीजिए’ उपयुक्त है।
- source_word: אֲחֻזַּת קֶבֶר
  choice: कब्र के लिए एक संपत्ति
  rationale: אֲחֻזָּה केवल कब्र खोदने की जगह नहीं, बल्कि अधिकार में ली गई भूमि अथवा संपत्ति का बोध करा सकता है। यह अनुवाद अध्याय के भूमि-अधिकार संबंधी कानूनी भाव को सुरक्षित रखता है।
- source_word: וְאֶקְבְּרָה
  choice: ताकि मैं ... दफ़ना दूँ
  rationale: अनुरोध के बाद आया cohortative उद्देश्य अथवा अपेक्षित परिणाम व्यक्त करता है। ‘ताकि’ उस संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: מֵתִי
  choice: अपने मृतक
  rationale: इब्रानी में एकवचन रूप पर प्रथम पुरुष प्रत्यय है और अर्थ परिवार के मृत सदस्य से है। ‘अपने मृतक’ सारा का नाम जोड़े बिना मूल की संक्षिप्त अभिव्यक्ति बनाए रखता है।
- source_word: מִלְּפָנַי
  choice: अपनी आँखों के सामने से हटा कर
  rationale: शाब्दिक भाव ‘मेरे सामने से’ है। हिन्दी में यह रूप दृश्य उपस्थिति हटाने और उसके लिए दफ़नाने के आशय को स्वाभाविक ढंग से व्यक्त करता है।
