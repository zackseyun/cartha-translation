translation:
  language: hi
  text: वह अब्राहम की सम्पत्ति हो गई—हेत के पुत्रों[a] की आँखों के सामने, और उन सबके सामने जो उसके नगर के फाटक में प्रवेश करते थे।
  philosophy: optimal-equivalence
  footnotes:
