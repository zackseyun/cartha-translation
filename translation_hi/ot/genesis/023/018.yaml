    text: 'या ‘हित्ती लोग’। शाब्दिक अर्थ: ‘हेत के पुत्र’।'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַבְרָהָם
  choice: अब्राहम की
  rationale: लेन-देन के इस कानूनी संदर्भ में לְ प्राप्तकर्ता और स्वामित्व-संबंध दिखाता है; ‘अब्राहम की सम्पत्ति’ स्वाभाविक हिन्दी में इसे स्पष्ट करता है।
- source_word: לְמִקְנָה
  choice: सम्पत्ति ठहरी
  rationale: מִקְנָה अर्जित सम्पत्ति या अधिकार में आई वस्तु को दर्शाता है; ‘सम्पत्ति ठहरी’ पिछले पद से चल रहे कानूनी हस्तांतरण के परिणाम को व्यक्त करता है।
- source_word: לְעֵינֵי
  choice: की आँखों के सामने
  rationale: हिब्रू मुहावरे की दृश्यात्मकता और सार्वजनिक साक्ष्य का भाव दोनों सुरक्षित रहते हैं।
- source_word: בְנֵי חֵת
  choice: हित्त के वंशजों
  rationale: शाब्दिक ‘हित्त के पुत्रों’ की जातीय-वंशीय पहचान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘हित्ती लोगों’ को पादटिप्पणी में वैकल्पिक रूप दिया गया है।
- source_word: בְּכֹל בָּאֵי
  choice: उन सबके सामने जो ... प्रवेश करते थे
  rationale: यह नगर-फाटक पर उपस्थित व्यापक सार्वजनिक साक्षी-समूह को दर्शाता है और मूल के participial वाक्यांश को सहज हिन्दी संबंधवाचक उपवाक्य में रखता है।
- source_word: שַׁעַר עִירוֹ
  choice: उसके नगर के फाटक
  rationale: मूल का संबंधवाचक ढाँचा और नगर-फाटक का नागरिक तथा कानूनी परिवेश सुरक्षित रखा गया है; ‘उसके’ का संदर्भ मूल की तरह खुला रहता है।
theological_decisions:
- issue: עִירוֹ में ‘उसके’ का संदर्भ
  choice: उसके नगर
  alternative: उस नगर / एप्रोन के नगर
  rationale: मूल पाठ पुल्लिंग एकवचन सर्वनाम देता है, पर उसका संदर्भ स्पष्ट नाम से नहीं बताता; इसलिए अनुवाद में मूल की संदर्भगत अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक कानूनी लेन-देन के अनुरूप हिन्दी। पद 17 से वाक्यगत निरंतरता मानते हुए ‘ठहरी’ का प्रयोग किया गया है; स्वतंत्र पाठ में स्पष्टता के लिए आरम्भ में ‘वह’ रखा गया है।
