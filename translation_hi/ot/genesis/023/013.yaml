  text: וַ/יְדַבֵּ֨ר אֶל עֶפְר֜וֹן בְּ/אָזְנֵ֤י עַם הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר אַ֛ךְ אִם אַתָּ֥ה ל֖וּ שְׁמָעֵ֑/נִי נָתַ֜תִּי כֶּ֤סֶף הַ/שָּׂדֶה֙ קַ֣ח מִמֶּ֔/נִּי וְ/אֶקְבְּרָ֥ה אֶת מֵתִ֖/י שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/013.yaml
  text: 'And he spoke to Ephron in the hearing of the people of the land[a], saying, “If only you would hear me: I give the silver for the field; take it from me[b], so that I may bury my dead there.”'
translation:
  language: hi
  text: 'तब उसने उस देश के लोगों के सुनते हुए एफ्रोन से कहा, “कृपया मेरी बात सुनिए: मैं उस खेत के लिए चाँदी देता हूँ[a]; उसे मुझसे ले लीजिए, ताकि मैं अपने मृत परिजन को वहाँ दफ़ना सकूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “मैंने उस खेत की चाँदी दे दी है”; यहाँ पूर्ण रूप सौदे के बीच औपचारिक या निष्पादक प्रस्ताव व्यक्त कर सकता है। इसका अनुवाद “मैं उस खेत के लिए चाँदी दूँगा” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब उसने ... कहा
  rationale: דבר के औपचारिक बोलने के भाव को स्वाभाविक हिन्दी कथन-रचना में व्यक्त करता है; וַ का कथानक-संबंध ‘तब’ से स्पष्ट होता है।
- source_word: בְּאָזְנֵי עַם הָאָרֶץ
  choice: उस देश के लोगों के सुनते हुए
  rationale: शाब्दिक ‘कानों में’ के स्थान पर सार्वजनिक रूप से सुनाई देने का इब्रानी मुहावरेदार अर्थ स्वाभाविक हिन्दी में रखता है।
- source_word: אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי
  choice: यदि आप मेरी बात सुनें
  rationale: यह कुछ संक्षिप्त और मुहावरेदार विनम्र आग्रह है; आदरसूचक ‘आप’ सौदेबाज़ी के प्रसंग के अनुकूल है।
- source_word: נָתַתִּי
  choice: मैं ... देता हूँ
  rationale: पूर्ण रूप यहाँ लेन-देन में औपचारिक, निष्पादक प्रस्ताव व्यक्त कर सकता है; वर्तमानकालीन हिन्दी इस भाषिक क्रिया को स्वाभाविक रूप से दर्शाती है, जबकि रूपगत विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: כֶּסֶף הַשָּׂדֶה
  choice: उस खेत की चाँदी
  rationale: כֶּסֶף का ठोस अर्थ ‘चाँदी’ और संबंधसूचक संरचना दोनों सुरक्षित हैं; प्रसंग में इसका अर्थ खेत के लिए दी जाने वाली चाँदी है।
- source_word: קַח מִמֶּנִּי
  choice: उसे मुझसे ले लीजिए
  rationale: चाँदी को निहित कर्म मानकर ‘उसे’ जोड़ना हिन्दी में आवश्यक स्पष्टता देता है; विनम्र आज्ञार्थक प्रसंग के अनुरूप है।
- source_word: וְאֶקְבְּרָה
  choice: ताकि मैं ... दफ़ना सकूँ
  rationale: सहवाची/इच्छासूचक रूप के उद्देश्य-भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵתִי
  choice: अपनी मृतका को
  rationale: इब्रानी का अर्थ ‘मेरी मृत [व्यक्ति]’ है; प्रसंग में स्त्री सारा का उल्लेख होने के कारण हिन्दी में आवश्यक लिंग ‘मृतका’ आता है, बिना पद में उसका नाम जोड़ने के।
- source_word: שָׁמָּה
  choice: वहाँ
  rationale: स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक समतुल्य।
