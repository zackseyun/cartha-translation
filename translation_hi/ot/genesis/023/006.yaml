  choice: जिससे आप अपने मृतक को दफ़न न कर पाएँ
  rationale: 'מן और infinitive के निवारक भाव को स्वाभाविक हिन्दी में स्पष्ट करता है: कोई कब्र रोककर दफ़नाने में बाधा नहीं डालेगा।'
theological_decisions:
- issue: נְשִׂיא אֱלֹהִים का अर्थ
  choice: मुख्य पाठ में ‘परमेश्वर के एक प्रधान’
  alternative: ‘एक महान/अत्यंत शक्तिशाली प्रधान’
  rationale: इब्रानी में אֱלֹהִים कभी-कभी अतिशयोक्तिपरक बल दे सकता है, पर पदबंध परमेश्वर से विशेष संबंध या प्रतिष्ठा का संकेत भी दे सकता है। मुख्य पाठ स्रोत की अभिव्यक्ति को सुरक्षित रखता है और वैकल्पिक मुहावरेदार अर्थ पादटिप्पणी में देता है।
