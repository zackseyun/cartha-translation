base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/006.yaml
  text: 'Hear us[a], my lord: you are a prince of God among us. Bury your dead in the choicest of our tombs. None of us will withhold his tomb from you[b], from burying your dead.'
translation:
  language: hi
  text: “मेरे प्रभु, हमारी सुनिए। आप हमारे बीच परमेश्वर के एक सरदार हैं[a]। हमारी सबसे अच्छी कब्रों में से किसी में अपने मृतक को दफ़न कीजिए। हममें से कोई भी अपनी कब्र आपसे नहीं रोकेगा, जिससे आप अपने मृतक को दफ़न न कर पाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे बीच एक महान सरदार हैं।” इब्रानी में “परमेश्वर के सरदार” पदबंध अतिशयोक्ति के रूप में भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
