  register: आदरपूर्ण, सामुदायिक वार्ता के अनुरूप आधुनिक मानक हिन्दी। ‘दफ़न’ सामान्य और सहज है; ‘कब्र’ अध्याय के भूमि और समाधि-स्थान संबंधी प्रसंग के अनुकूल है। संबोधन में ‘आप/सुनिए/कीजिए’ से सामाजिक सम्मान व्यक्त किया गया है।
