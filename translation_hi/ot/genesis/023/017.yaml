  yaml_path: translation/ot/genesis/023/017.yaml
  text: So Ephron’s field at Machpelah[a], which was before Mamre—the field, the cave that was in it, and every tree in the field, within all its surrounding border—was confirmed
translation:
  language: hi
  text: इस प्रकार मम्रे के सामने मकपेला में एप्रोन का खेत—वह खेत, उसमें की गुफा, और उस खेत में उसकी चारों ओर की सारी सीमा के भीतर के सभी पेड़—मान्य ठहरा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्थापित हुआ” अथवा “हस्तांतरित हुआ”; यहाँ इब्रानी क्रिया का अर्थ संभवतः बिक्री के प्रसंग में संपत्ति के कानूनी रूप से पुष्ट किए जाने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: पक्का ठहरा
  rationale: क्रय-विक्रय के इस कानूनी प्रसंग में קום केवल खड़े होने का नहीं, बल्कि संपत्ति के विधिवत् निश्चित या मान्य हो जाने का भाव देता है। ‘पक्का ठहरा’ उस कानूनी अर्थ को सहज हिन्दी में व्यक्त करता है और अगले पद से जुड़ने की गुंजाइश बनाए रखता है।
- source_word: שְׂדֵה עֶפְרוֹן
  choice: एप्रोन का खेत
  rationale: इब्रानी संबंधवाचक संरचना का स्वाभाविक हिन्दी रूप।
- source_word: בַּמַּכְפֵּלָה
  choice: मकपेला में
  rationale: मकपेला स्थान-नाम है; בְּ के स्थानीय अर्थ को ‘में’ द्वारा रखा गया है।
- source_word: לִפְנֵי מַמְרֵא
  choice: मम्रे के सामने
  rationale: לִפְנֵי के स्थानवाचक मूल अर्थ ‘के सामने’ को सुरक्षित रखा गया है; किसी निश्चित दिशा को अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: वह खेत, उसमें की गुफा
  rationale: मूल के कानूनी सूचीकरण और ‘खेत’ की पुनरावृत्ति को बनाए रखते हुए हिन्दी में संक्षिप्त, स्पष्ट रूप दिया गया है।
- source_word: וְכָל הָעֵץ אֲשֶׁר בַּשָּׂדֶה
  choice: खेत के सभी पेड़
  rationale: כָל के साथ एकवचन सामूहिक הָעֵץ का अर्थ खेत में स्थित समस्त पेड़ों से है।
- source_word: אֲשֶׁר בְּכָל גְּבֻלוֹ סָבִיב
  choice: उसकी चारों ओर की पूरी सीमा के भीतर
  rationale: वाक्यांश संपत्ति की समूची परिधि के भीतर आने वाली वस्तुओं को कानूनी ढंग से निर्दिष्ट करता है; ‘चारों ओर’ और ‘पूरी सीमा’ उसकी व्यापकता बनाए रखते हैं।
