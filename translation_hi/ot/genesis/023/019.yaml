source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵן֩ קָבַ֨ר אַבְרָהָ֜ם אֶת שָׂרָ֣ה אִשְׁתּ֗/וֹ אֶל מְעָרַ֞ת שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה עַל פְּנֵ֥י מַמְרֵ֖א הִ֣וא חֶבְר֑וֹן בְּ/אֶ֖רֶץ כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/019.yaml
  text: After this[a], Abraham buried Sarah his wife in the cave of the field of Machpelah, facing Mamre (that is, Hebron), in the land of Canaan.
translation:
  language: hi
  text: इसके बाद अब्राहम ने अपनी पत्नी सारा को कनान देश में मम्रे (अर्थात् हेब्रोन) के सामने[a], मकपेला के खेत की गुफा में दफनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मम्रे के सम्मुख” अथवा “मम्रे के दूसरी ओर।” इब्रानी पदबंध मम्रे के सामने या उसकी ओर मुख किए हुए स्थान को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह पदबंध कथा में समयक्रम का स्वाभाविक संकेत देता है; ‘इसके बाद’ आधुनिक हिन्दी में स्पष्ट है और इब्रानी से अधिक विशिष्टता नहीं जोड़ता।
- source_word: קָבַר
  choice: दफनाया
  rationale: यह क्रिया सामान्य रूप से शव को गाड़ने या दफनाने के अर्थ में है; ‘दफनाया’ सहज और प्रचलित हिन्दी है।
- source_word: אֶת שָׂרָה אִשְׁתּוֹ
  choice: अपनी पत्नी सारा को
  rationale: हिन्दी की स्वाभाविक शब्द-व्यवस्था अपनाई गई है और सारा का अब्राहम की पत्नी होना स्पष्ट रखा गया है।
- source_word: אֶל מְעָרַת
  choice: गुफा में
  rationale: पूर्वसर्ग אֶל का मूल भाव ‘की ओर/में’ है, पर दफनाने के प्रसंग में हिन्दी का स्वाभाविक स्थानवाचक प्रयोग ‘में’ है।
- source_word: מְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: मकपेला के खेत की गुफा
  rationale: इब्रानी संबंध-श्रृंखला को स्पष्ट और स्वाभाविक हिन्दी में रखते हुए गुफा का संबंध मकपेला के खेत से जोड़ा गया है।
- source_word: הַמַּכְפֵּלָה
  choice: मकपेला
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण किया गया है; इब्रानी निश्चित उपपद को हिन्दी में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: עַל פְּנֵי מַמְרֵא
  choice: मम्रे के सामने
  rationale: यह स्थानगत पदबंध मम्रे के सामने, सम्मुख या उस पार होने का भाव दे सकता है। मुख्य पाठ में संक्षिप्त और स्वाभाविक ‘के सामने’ रखा गया है तथा संभावित अर्थ-छाया पाद-टिप्पणी में दी गई है।
- source_word: הִוא חֶבְרוֹן
  choice: अर्थात् हेब्रोन
  rationale: यह मम्रे की पहचान हेब्रोन के रूप में बताने वाला स्पष्टीकरण है; ‘अर्थात्’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: इब्रानी में ‘देश/भूमि’ स्पष्ट रूप से उपस्थित है; ‘कनान देश’ उस भौगोलिक अभिव्यक्ति को बनाए रखता है।
