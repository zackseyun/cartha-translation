  edition: WLC
  text: לֹֽא אֲדֹנִ֣/י שְׁמָעֵ֔/נִי הַ/שָּׂדֶה֙ נָתַ֣תִּי לָ֔/ךְ וְ/הַ/מְּעָרָ֥ה אֲשֶׁר בּ֖/וֹ לְ/ךָ֣ נְתַתִּ֑י/הָ לְ/עֵינֵ֧י בְנֵי עַמִּ֛/י נְתַתִּ֥י/הָ לָּ֖/ךְ קְבֹ֥ר מֵתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/011.yaml
  text: 'No[a], my lord, listen to me: I give you the field, and I give you the cave that is in it[b]. In the sight of the sons of my people I give it to you[c]. Bury your dead.'
translation:
  language: hi
  text: “नहीं[a], मेरे स्वामी, मेरी बात सुनिए। मैं यह खेत आपको देता हूँ, और जो गुफा उसमें है, उसे भी आपको देता हूँ। मेरे लोगों के सामने[b] मैं उसे आपको देता हूँ। अपने मृतक को दफ़ना दीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक औपचारिक रूप में, “ऐसा नहीं, मेरे स्वामी; मेरी बात सुनिए।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “मेरे लोगों के पुत्रों की आँखों के सामने” है; अर्थात समुदाय के लोगों की सार्वजनिक उपस्थिति और गवाही में।
    reason: cultural_note
lexical_decisions:
- source_word: לֹא
  choice: नहीं
  rationale: यहाँ निषेध अब्राहम के प्रस्ताव का विनम्र प्रतिवाद या सुधार है। ‘नहीं’ आधुनिक हिन्दी में स्वाभाविक है; ‘ऐसा नहीं’ अधिक स्पष्ट औपचारिक विकल्प है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: यह अब्राहम के लिए सम्मानसूचक संबोधन है। ‘मेरे स्वामी’ सामाजिक आदर को बनाए रखता है और इसे परमेश्वर के लिए प्रयुक्त उपाधि मानकर नहीं चलता।
- source_word: שְׁמָעֵנִי
  choice: मेरी बात सुनिए
  rationale: आज्ञार्थक रूप में विनम्र आग्रह है। आदरसूचक ‘सुनिए’ वार्ता के सामाजिक प्रसंग के अनुकूल है।
- source_word: הַשָּׂדֶה נָתַתִּי לָךְ
  choice: खेत मैं आपको देता हूँ
  rationale: शब्द-क्रम में ‘खेत’ पर बल है, और पूर्ण क्रिया यहाँ संपत्ति सौंपने की वर्तमान, निष्पादक घोषणा के रूप में प्रयुक्त है।
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ לְךָ נְתַתִּיהָ
  choice: और उसमें जो गुफा है, वह भी आपको देता हूँ
  rationale: गुफा का खेत के भीतर होना स्पष्ट रखा गया है। ‘भी’ हिन्दी में दूसरे दान की संबद्धता और जोर को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְעֵינֵי בְנֵי עַמִּי
  choice: अपने लोगों के सामने
  rationale: शाब्दिक अर्थ ‘मेरे लोगों के पुत्रों की आँखों के सामने’ है; मुहावरे का आशय समुदाय की सार्वजनिक उपस्थिति और साक्षी में संपत्ति देना है।
- source_word: מֵתֶךָ
  choice: अपने मृतक को
  rationale: इब्रानी एकवचन है और प्रसंग में सारा की ओर संकेत करता है। ‘मृतक’ मूल की अभिव्यक्ति को बनाए रखता है, बिना नाम को पाठ में जोड़ने के।
