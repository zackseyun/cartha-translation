translation_notes:
  register: भाषा आधुनिक, आदरसूचक और संपत्ति-सौदे के सार्वजनिक प्रसंग के अनुरूप रखी गई है। ‘देता हूँ’ को निष्पादक वर्तमान के रूप में रखा गया है, क्योंकि वक्ता इन्हीं शब्दों द्वारा हस्तांतरण की पेशकश कर रहा है।
