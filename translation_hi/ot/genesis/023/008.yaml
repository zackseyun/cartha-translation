source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר אִתָּ֖/ם לֵ/אמֹ֑ר אִם יֵ֣שׁ אֶֽת נַפְשְׁ/כֶ֗ם לִ/קְבֹּ֤ר אֶת מֵתִ/י֙ מִ/לְּ/פָנַ֔/י שְׁמָע֕וּ/נִי וּ/פִגְעוּ לִ֖/י בְּ/עֶפְר֥וֹן בֶּן צֹֽחַר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/008.yaml
  text: And he spoke with them[a], saying, “If it is your desire that I bury my dead out of my sight, listen to me and intercede for me with Ephron son of Zohar,”
translation:
  language: hi
  text: तब उसने उनसे कहा, “यदि आपकी इच्छा है कि मैं अपने मृतक को अपनी आँखों से ओझल करके दफ़ना दूँ, तो मेरी बात सुनिए और सोहर के पुत्र एप्रोन से मेरी ओर से विनती कीजिए[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सोहर के पुत्र एप्रोन से मेरे लिए आग्रह कीजिए।”
    reason: פגע के यहाँ किसी की ओर से आग्रह, निवेदन या विनती करने के निकटवर्ती अर्थ सम्भव हैं।
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם לֵאמֹר
  choice: तब उसने उनसे कहा
  rationale: हिब्रू की ‘उनसे बोला, यह कहते हुए’ संरचना को स्वाभाविक आधुनिक हिन्दी कथन-शैली में व्यक्त किया गया है।
- source_word: אִם יֵשׁ אֶת־נַפְשְׁכֶם
  choice: यदि आपकी इच्छा है
  rationale: ‘आपका प्राण/मन है’ का शाब्दिक रूप यहाँ इच्छा या सहमति का मुहावरा है; चुना हुआ रूप उसी भाव को स्पष्ट और सम्मानपूर्ण हिन्दी में रखता है।
- source_word: לִקְבֹּר אֶת־מֵתִי מִלְּפָנַי
  choice: मैं अपने मृतक को अपनी आँखों से ओझल करके दफ़ना दूँ
  rationale: ‘मेरे मृतक’ की एकवचन और संबंधसूचक अस्पष्टता को बनाए रखा गया है; ‘मेरी आँखों से ओझल’ מִלְּפָנַי के शोक और दफ़न-संदर्भ के स्वाभाविक अर्थ को व्यक्त करता है।
- source_word: שְׁמָעוּנִי
  choice: मेरी बात सुनिए
  rationale: आज्ञार्थक क्रिया को विनम्र बहुवचन में दिया गया है, जो अब्राहम के सार्वजनिक और सम्मानपूर्ण निवेदन के अनुकूल है।
- source_word: וּפִגְעוּ לִי בְּעֶפְרוֹן
  choice: एप्रोन से मेरी ओर से विनती कीजिए
  rationale: פגע עם ב इस वार्ता-संदर्भ में किसी के पास जाकर दूसरे की ओर से आग्रह या विनती करने का भाव रखता है; हिन्दी रूप उस मध्यस्थ अपील को व्यक्त करता है, बिना उसे कोई औपचारिक धार्मिक अर्थ दिए।
- source_word: עֶפְרוֹן בֶּן־צֹחַר
  choice: सोहर के पुत्र एप्रोन
  rationale: व्यक्तिनामों का ध्वन्यात्मक लिप्यंतरण किया गया है और בן को पारदर्शी रूप से ‘पुत्र’ कहा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सम्मानपूर्ण, सहज और गरिमामय रूप अपनाया गया है। ‘मेरे मृतक’ को जानबूझकर ‘मेरी पत्नी’ नहीं किया गया, ताकि मूल पाठ की अभिव्यक्ति बनी रहे।
