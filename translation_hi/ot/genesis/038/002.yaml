  text: וַ/יַּרְא שָׁ֧ם יְהוּדָ֛ה בַּת אִ֥ישׁ כְּנַעֲנִ֖י וּ/שְׁמ֣/וֹ שׁ֑וּעַ וַ/יִּקָּחֶ֖/הָ וַ/יָּבֹ֥א אֵלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/002.yaml
  text: There Judah saw the daughter of a Canaanite man whose name was Shua[b][a], and he took her and went in to her.
translation:
  language: hi
  text: वहाँ यहूदा ने एक कनानी पुरुष की बेटी को देखा। उस पुरुष का नाम शूआ था[a]। उसने उसे ले लिया और उसके पास गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “और उसका नाम शूआ था।” यहाँ “उसका” कनानी पुरुष, अर्थात पिता, के लिए है; बेटी के लिए नहीं।
    reason: lexical_alternative
  - marker: b
    text: “उसके पास गया” यौन-संबंध के लिए प्रयुक्त एक इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: ראה का सामान्य और सीधा कथात्मक अर्थ ‘देखा’ है; ‘मिला’ अर्थ में अनावश्यक विस्तार करता।
- source_word: שָׁם
  choice: वहाँ
  rationale: स्थानवाचक क्रियाविशेषण का स्वाभाविक और संक्षिप्त हिन्दी समतुल्य।
- source_word: בַּת אִישׁ כְּנַעֲנִי
  choice: एक कनानी पुरुष की बेटी
  rationale: यह पदबंध मूल इब्रानी की संबंध-रचना को स्पष्ट रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וּשְׁמוֹ שׁוּעַ
  choice: जिसका नाम शूआ था
  rationale: पुल्लिंग प्रत्यय से नाम कनानी पुरुष अर्थात पिता का है, बेटी का नहीं; हिन्दी में ‘जिसका’ का निकटतम पूर्वपद ‘पुरुष’ है।
- source_word: וַיִּקָּחֶהָ
  choice: उसने उसे ले लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है। प्रसंग विवाह का संकेत दे सकता है, पर ‘विवाह किया’ कहना मूल से अधिक स्पष्ट व्याख्या होगी।
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: उसके पास गया
  rationale: इब्रानी मुहावरे की बाहरी संरचना और संयत कथात्मक शैली रखी गई है; इसका यौन-संबंधी आशय पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: וַיִּקָּחֶהָ में विवाह का निहितार्थ
  choice: उसे ले लिया
  alternative: उससे विवाह किया
  rationale: विवाह का निहितार्थ संभव है, किंतु क्रिया स्वयं केवल ‘लेना’ कहती है; इसलिए पाठ की अर्थगत गुंजाइश सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘ले लिया’ और ‘उसके पास गया’ मूल की संक्षिप्तता तथा अंतर्निहित अर्थ को बनाए रखते हैं; आवश्यक स्पष्टीकरण पादटिप्पणियों में दिया गया है।
