  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֞ל אֶת אַנְשֵׁ֤י מְקֹמָ/הּ֙ לֵ/אמֹ֔ר אַיֵּ֧ה הַ/קְּדֵשָׁ֛ה הִ֥וא בָ/עֵינַ֖יִם עַל הַ/דָּ֑רֶךְ וַ/יֹּ֣אמְר֔וּ לֹא הָיְתָ֥ה בָ/זֶ֖ה קְדֵשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/021.yaml
  text: He asked the men of her place[a], saying, “Where is the cult prostitute who was at Enaim by the road?” But they said[b], “There has been no cult prostitute here.”
translation:
  language: hi
  text: उसने उस स्थान के लोगों[a] से पूछा, “उपासना से जुड़ी वह वेश्या[b] कहाँ है, जो एनैम[c] में सड़क के किनारे थी?” उन्होंने कहा, “यहाँ उपासना से जुड़ी कोई वेश्या नहीं थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “उसके स्थान के लोगों” है। यहाँ आशय उस स्थान के स्थानीय लोगों से है।
    reason: textual_ambiguity
  - marker: b
    text: इब्रानी शब्द सामान्यतः ऐसी वेश्या को सूचित करता है जिसका किसी धार्मिक उपासना या पंथगत प्रथा से संबंध था। इसका अनुवाद “मंदिर की वेश्या” भी किया जाता है, पर मूल पाठ किसी मंदिर-भवन का स्पष्ट उल्लेख नहीं करता।
    reason: lexical_alternative
  - marker: c
    text: एनैम एक स्थान का नाम है। इब्रानी में इसका रूप “आँखों” शब्द से संबंधित है और संभवतः “स्रोतों” का भी बोध करा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: उसने ... पूछा
  rationale: שׁאל के सामान्य कथात्मक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אַנְשֵׁי מְקֹמָהּ
  choice: उस स्थान के लोगों
  rationale: इब्रानी में शाब्दिक रूप से ‘उसके स्थान के पुरुष/लोग’ है। हिन्दी में ‘उस स्थान के लोगों’ प्रसंगानुकूल और सहज है, जबकि स्त्रीलिंग प्रत्यय की असामान्यता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לֵאמֹר
  choice: पूछा, “...”
  rationale: प्रत्यक्ष कथन का परिचय देने वाले לֵאמֹר को हिन्दी में अलग से ‘कहते हुए’ जोड़ने के बजाय ‘पूछा’ और उद्धरण की रचना में स्वाभाविक रूप से समाहित किया गया है।
- source_word: הַקְּדֵשָׁה
  choice: उपासना से जुड़ी ... वेश्या
  rationale: קְדֵשָׁה को सामान्य זֹנָה से अलग रखते हुए उसके धार्मिक/उपासनात्मक संबंध को व्यक्त करता है। ‘देवदासी’ भारतीय धार्मिक संस्था का अनचाहा अर्थ लाता, और ‘मंदिर की वेश्या’ किसी निश्चित मंदिर-भवन का संकेत दे सकता है।
- source_word: בָעֵינַיִם
  choice: एनैम में
  rationale: प्रसंग में इसे स्थान-नाम मानकर देवनागरी में लिप्यंतरित किया गया है; इसके शब्दगत संबंध को पादटिप्पणी में बताया गया है।
- source_word: עַל הַדָּרֶךְ
  choice: सड़क के किनारे
  rationale: इस प्रसंग में עַל הַדָּרֶךְ मार्ग के पास स्थित होने का बोध देता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לֹא הָיְתָה בָזֶה קְדֵשָׁה
  choice: यहाँ उपासना से जुड़ी कोई वेश्या नहीं थी
  rationale: स्थानीय लोगों के उत्तर को अनावश्यक रूप से ‘कभी नहीं’ बनाकर अधिक व्यापक किए बिना, स्थान पर ऐसी स्त्री की अनुपस्थिति के रूप में व्यक्त करता है।
theological_decisions:
- issue: קְדֵשָׁה का धार्मिक और यौन अर्थ
  choice: उपासना से जुड़ी वेश्या
  alternative: मंदिर की वेश्या; धार्मिक वेश्या; केवल वेश्या
  rationale: चुना हुआ रूप धार्मिक संबंध और वेश्यावृत्ति—दोनों को बनाए रखता है, पर किसी विशिष्ट मंदिर-संस्था या भारतीय ‘देवदासी’ परंपरा को पाठ में नहीं लाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। संवाद में सहज हिन्दी वाक्य-विन्यास अपनाया गया है। ‘उपासना से जुड़ी वेश्या’ कुछ लंबा है, पर यह इब्रानी קְדֵשָׁה और अध्याय में प्रयुक्त सामान्य ‘वेश्या’ के बीच का भेद सुरक्षित रखता है।
