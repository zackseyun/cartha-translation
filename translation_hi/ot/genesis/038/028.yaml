  yaml_path: translation/ot/genesis/038/028.yaml
  text: And when she was giving birth[a], he put out a hand, and the midwife took it and tied a scarlet thread on his hand, saying[c][b], “This one came out first.”
translation:
  language: hi
  text: जब वह प्रसव कर रही थी, तब एक बच्चे ने अपना हाथ बाहर निकाला। दाई ने उसका हाथ लेकर उस पर लाल रंग का धागा बाँध दिया और कहा, “यह पहले बाहर निकला है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह लाल धागा उस बच्चे को पहचानने का चिह्न था जिसका हाथ पहले बाहर आया था और जिसे दाई ने पहले बाहर निकलने वाला समझा था।
    reason: cultural_note
lexical_decisions:
- source_word: בְלִדְתָּהּ
  choice: जब वह जनने लगी
  rationale: בְּ + infinitive construct तथा 3fs प्रत्यय प्रसव के समय की परिस्थिति व्यक्त करते हैं। यह हिंदी में स्वाभाविक रूप से जारी प्रसव-प्रक्रिया को बताता है।
- source_word: וַיִּתֶּן יָד
  choice: एक बच्चे ने अपना हाथ बाहर निकाला
  rationale: शाब्दिक रूप से ‘उसने हाथ दिया’ प्रसव के दौरान हाथ निकलने का इब्रानी मुहावरा है। कर्ता पुल्लिंग एकवचन है, पर दोनों जुड़वाँ में से कौन है यह अभी अनिश्चित है; इसलिए ‘एक बच्चे ने’ स्पष्ट और स्वाभाविक है।
- source_word: הַמְיַלֶּדֶת
  choice: दाई
  rationale: यह ילד धातु का स्त्रीलिंग कारक रूप है और प्रसव कराने वाली स्त्री को दर्शाता है; ‘दाई’ इसका संक्षिप्त और प्रचलित हिंदी पर्याय है।
- source_word: וַתִּקְשֹׁר עַל יָדוֹ שָׁנִי
  choice: उस पर लाल रंग का धागा बाँध दिया
  rationale: שָׁנִי गहरे लाल/किरमिजी रंग की सामग्री को दर्शाता है। संदर्भ में पहचान-चिह्न के लिए धागा निहित है; ‘लाल रंग का धागा’ साधारण पाठक के लिए स्पष्ट है।
- source_word: זֶה יָצָא רִאשֹׁנָה
  choice: यह पहले बाहर निकला है
  rationale: यह वाक्य उस बच्चे की पहचान करता है जिसका हाथ पहले दिखाई दिया। ‘पहले बाहर निकला’ मूल क्रिया और क्रम को रखता है; ‘पहिलौठा’ कहना मूल में निहित न होने वाली सामाजिक-कानूनी हैसियत जोड़ देता।
theological_decisions:
- issue: पहले निकलने और पहिलौठे की हैसियत का संबंध
  choice: ‘यह पहले बाहर निकला है’
  alternative: ‘यही पहिलौठा है’
  rationale: मूल पाठ केवल पहले बाहर निकलने की दाई की घोषणा करता है; वह यहाँ स्पष्ट रूप से पहिलौठे का पद घोषित नहीं करता। इसलिए बाद की कथा का तनाव खुला रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथा-शैली। ‘जनने लगी’ प्रसव की प्रक्रिया को संक्षेप में व्यक्त करता है। ‘एक बच्चे’ से जुड़वाँ बच्चों में से अभी अज्ञात कर्ता स्पष्ट होता है। मुख्य पाठ में केवल एक आवश्यक सांस्कृतिक टिप्पणी रखी गई है।
