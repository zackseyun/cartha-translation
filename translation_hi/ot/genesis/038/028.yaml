  to: जब वह प्रसव कर रही थी, तब एक बच्चे ने अपना हाथ बाहर निकाला। दाई ने उसका हाथ लेकर उस पर लाल रंग का धागा बाँध दिया और कहा, “यह पहले बाहर निकला है।”[a]
