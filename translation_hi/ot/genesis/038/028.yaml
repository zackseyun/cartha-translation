    text: यह लाल धागा उस बच्चे को पहचानने का चिह्न था जिसका हाथ पहले बाहर आया था और जिसे दाई ने पहले बाहर निकलने वाला समझा था।
    reason: cultural_note
  revision_rationale: The revision improves modern Hindi idiom for the childbirth setting and refines the cultural note to match the narrated sequence. It preserves the Hebrew’s indefinite reference to one of the twins and the midwife’s own declaration, without asserting a firstborn status.
