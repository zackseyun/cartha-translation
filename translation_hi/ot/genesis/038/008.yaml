base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/008.yaml
  text: Then Judah said to Onan[a], “Go in to your brother’s wife, perform the duty of a brother-in-law to her, and raise up offspring for your brother.”
translation:
  language: hi
  text: तब यहूदा ने ओनान से कहा, “अपने भाई की पत्नी के पास जा, उसके साथ देवर के रूप में अपना कर्तव्य निभा[a], और अपने भाई के लिए संतान उत्पन्न कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक तकनीकी रूप में, “उसके साथ देवर-विवाह का दायित्व पूरा कर।”
    reason: शब्दार्थ का तकनीकी विकल्प
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֹּא אֶל
  choice: के पास जा
  rationale: यह इब्रानी मुहावरा इस वैवाहिक संदर्भ में यौन-संबंध की ओर संकेत करता है। हिन्दी में ‘के पास जा’ मूल की अप्रत्यक्षता बनाए रखता है और अगले आदेश के संदर्भ से आशय स्पष्ट हो जाता है।
- source_word: אֵשֶׁת אָחִיךָ
  choice: अपने भाई की पत्नी
  rationale: यह संबंधवाचक संरचना का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: וְיַבֵּם אֹתָהּ
  choice: उसके प्रति देवर का कर्तव्य निभा
  rationale: יִבֵּם एक तकनीकी पारिवारिक-कानूनी क्रिया है। यह रूप सामान्य पाठक को अर्थ बताता है, पर इसे केवल विवाह या केवल यौन-संबंध तक सीमित नहीं करता।
- source_word: וְהָקֵם זֶרַע
  choice: संतान उत्पन्न कर
  rationale: इस मुहावरे का आशय मृत भाई के लिए संतान और उसकी वंश-रेखा कायम करना है। ‘संतान उत्पन्न कर’ वर्तमान हिन्दी में स्पष्ट है और זֶרַע को अस्पष्ट ‘बीज’ के रूप में नहीं रखता।
- source_word: לְאָחִיךָ
  choice: अपने भाई के लिए
  rationale: 'ל यहाँ हित अथवा उद्देश्य दर्शाता है: संतान मृत भाई की मानी जाएगी।'
theological_decisions:
- issue: देवर-विवाह संबंधी तकनीकी शब्दावली को बाद की कानूनी या सांप्रदायिक व्याख्या से बचाते हुए प्रस्तुत करना
  choice: उसके प्रति देवर का कर्तव्य निभा
  alternative: उसके साथ देवर-विवाह का कर्तव्य पूरा कर
  rationale: मूल क्रिया मृत भाई की पत्नी के प्रति भाई के दायित्व को व्यक्त करती है। मुख्य पाठ में सहज भाषा रखी गई है और तकनीकी विकल्प पाद-टिप्पणी में दिया गया है; इससे पारिवारिक दायित्व बना रहता है, पर अनावश्यक कानूनी विस्तार नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। आदेशों में एकवचन अनौपचारिक क्रियारूप (‘जा’, ‘निभा’, ‘कर’) मूल संबोधन की सीधाई को बनाए रखते हैं।
