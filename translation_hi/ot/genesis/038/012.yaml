base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/012.yaml
  text: After many days had passed[a], the daughter of Shua, Judah’s wife, died. When Judah was comforted[c][b], he went up to Timnah to his sheep shearers—he and his friend Hirah the Adullamite.
translation:
  language: hi
  text: बहुत दिन बीतने के बाद[a], यहूदा की पत्नी, शूआ की बेटी[b], मर गई। जब यहूदा को सांत्वना मिली[c], तब वह अपने मित्र, अदुल्लामी हीरा के साथ अपनी भेड़ों की ऊन कतरनेवाले लोगों के पास तिम्ना की ओर ऊपर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘बहुत समय बीतने के बाद।’ शाब्दिक अर्थ: ‘दिन बहुत हो गए।’'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘शूआ की बेटी’; कुछ लोग इसे व्यक्तिगत नाम ‘बत-शूआ’ मानते हैं।
    reason: alternative_reading
  - marker: c
    text: या ‘और यहूदा को सांत्वना मिली’ या ‘यहूदा को सांत्वना मिलने के बाद।’ इब्रानी क्रिया यहाँ शोक के बाद सांत्वना पाने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: बहुत दिन बीतने के बाद
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘दिन बहुत हो गए’ है; यह रूप उसके समय-संबंधी अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בַּת שׁוּעַ אֵשֶׁת יְהוּדָה
  choice: यहूदा की पत्नी, शूआ की बेटी
  rationale: मूल पाठ के संबंधसूचक पद ‘शूआ की बेटी’ को व्यक्तिगत नाम मान लेने के बजाय स्पष्ट रूप में सुरक्षित रखा गया है।
- source_word: וַיִּנָּחֶם יְהוּדָה
  choice: शोक के बाद जब यहूदा को सांत्वना मिली
  rationale: निफ़अल रूप यहाँ मृत्यु के बाद सांत्वना पाने को दर्शाता है, मन फिराने को नहीं; ‘शोक के बाद’ प्रसंग में निहित अर्थ को स्पष्ट करता है।
- source_word: וַיַּעַל
  choice: गया
  rationale: עלה में ‘ऊपर जाना’ का दिशात्मक भाव हो सकता है, पर आधुनिक हिन्दी में तिम्ना की यात्रा के लिए केवल ‘गया’ अधिक स्वाभाविक है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: עַל גֹּזֲזֵי צֹאנוֹ
  choice: जहाँ उसकी भेड़ों की ऊन कतरनेवाले थे
  rationale: यह पद उन लोगों की ओर जाने को बताता है जो उसके झुंड की ऊन कतर रहे थे; हिन्दी में स्थान-सापेक्ष उपवाक्य आशय को स्पष्ट और स्वाभाविक बनाता है।
- source_word: הוּא וְחִירָה רֵעֵהוּ הָעֲדֻלָּמִי
  choice: अपने मित्र, अदुल्लामी हीरा के साथ
  rationale: साथी के संबंध और उसके अदुल्लाम निवासी होने की पहचान को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: תִּמְנָתָה
  choice: तिम्ना को
  rationale: स्थान-नाम पर लगा दिशासूचक प्रत्यय तिम्ना की ओर गति दर्शाता है।
theological_decisions:
- issue: וַיִּנָּחֶם का अर्थ
  choice: सांत्वना मिली
  alternative: पछताया / मन फिराया
  rationale: शोक और पत्नी की मृत्यु का प्रसंग यहाँ נחם के सांत्वना पाने वाले अर्थ की माँग करता है; पश्चात्ताप का अर्थ प्रसंगानुकूल नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। ‘ऊन कतरनेवाले’ सामान्य पाठक के लिए स्पष्ट है; संबंधसूचक ‘शूआ की बेटी’ और सांत्वना के निष्क्रिय भाव को मूल के अनुरूप बनाए रखा गया है।
