  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रजिस्टर अपनाया गया है। ‘उठकर चली गई’ हिब्रू की क्रमिक क्रियाओं को संक्षेप और स्वाभाविकता से रखता है। ‘घूँघट’ भारतीय पाठक के लिए चेहरे या सिर के उस आवरण का सहज नाम है जिसे तामार ने भेष के लिए पहना था।
