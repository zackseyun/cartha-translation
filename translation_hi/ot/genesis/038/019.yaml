  yaml_path: translation/ot/genesis/038/019.yaml
  text: Then she arose and went away[b][a], and she removed her veil from upon her and put on the garments of her widowhood.
translation:
  language: hi
  text: तब वह उठी और चली गई; उसने अपना घूँघट उतार दिया और अपने वैधव्य के वस्त्र पहन लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: वह उठकर
  rationale: קום का यह कथात्मक रूप अगली क्रिया की ओर बढ़ाता है; ‘उठकर’ आधुनिक हिन्दी में स्वाभाविक है और क्रियाओं का क्रम बनाए रखता है।
- source_word: וַתֵּלֶךְ
  choice: चली गई
  rationale: הלך यहाँ उस स्थान से प्रस्थान को व्यक्त करता है; स्त्रीलिंग ‘चली गई’ सहज हिन्दी में यही अर्थ देता है।
- source_word: וַתָּסַר צְעִיפָהּ מֵעָלֶיהָ
  choice: उसने अपना घूँघट उतारा
  rationale: हिफ़िल סור और מֵעָלֶיהָ मिलकर शरीर पर से आवरण हटाने का भाव देते हैं। ‘उतारा’ इस पूरे भाव को स्वाभाविक हिन्दी में व्यक्त करता है; צָעִיף के लिए प्रसंगानुकूल ‘घूँघट’ चेहरे या सिर के आवरण को दर्शाता है।
- source_word: וַתִּלְבַּשׁ
  choice: पहन लिए
  rationale: לבש का अर्थ कपड़े पहनना है; बहुवचन ‘वस्त्र’ के साथ ‘पहन लिए’ स्वाभाविक है।
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: विधवा के वस्त्र
  rationale: यह समास उसकी विधवा-अवस्था से जुड़े विशिष्ट वस्त्रों को बताता है। ‘विधवा के वस्त्र’ अर्थ और गरिमापूर्ण शैली दोनों को सुरक्षित रखता है।
- source_word: וַתִּלְבַּשׁ בִּגְדֵי אַלְמְנוּתָהּ
  choice: फिर से विधवा के वस्त्र पहन लिए
  rationale: हिब्रू में ‘फिर से’ अलग शब्द के रूप में नहीं है, पर अध्याय के पूर्व प्रसंग में इन्हीं वस्त्रों को उतारने के बाद अब पहनना उनकी पुनःधारण क्रिया है; हिन्दी में यह निहित क्रम स्पष्ट और स्वाभाविक होता है।
theological_decisions: []
