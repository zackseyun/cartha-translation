base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/030.yaml
  text: Afterward his brother came out[a], with the scarlet thread on his hand[b], and he called his name Zerah.
translation:
  language: hi
  text: इसके बाद उसका भाई बाहर आया, जिसके हाथ पर लाल धागा[a] था; और उसने उसका नाम जेरह रखा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से ‘लाल रंग का’ है; ‘धागा’ पद 28 के तत्काल प्रसंग से स्पष्ट करके जोड़ा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘और उसने उसका नाम जेरह पुकारा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: इसके बाद
  rationale: यह पद पिछले जन्म-वृत्तांत के बाद होने वाली अगली घटना बताता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: יָצָא
  choice: बाहर आया
  rationale: जन्म के प्रसंग में ‘बाहर आया’ मूल क्रिया के सामान्य अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: אָחִיו
  choice: उसका भाई
  rationale: यह सीधे दूसरे जुड़वाँ भाई को दर्शाता है और एकवचन पुल्लिंग प्रत्यय को बनाए रखता है।
- source_word: אֲשֶׁר עַל־יָדוֹ הַשָּׁנִי
  choice: जिसके हाथ पर लाल धागा था
  rationale: सम्बन्धवाचक उपवाक्य उस भाई की पहचान उसके हाथ पर बँधे लाल चिह्न से कराता है। ‘धागा’ तत्काल पूर्ववर्ती प्रसंग (पद 28) से स्पष्ट करके जोड़ा गया है।
- source_word: הַשָּׁנִי
  choice: लाल धागा
  rationale: शाब्दिक अर्थ ‘वह लाल/सिंदूरी वस्तु’ है; पद 28 में उल्लिखित धागे के आधार पर ‘धागा’ जोड़ना हिन्दी में अर्थ स्पष्ट करता है।
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: और उसने उसका नाम … रखा
  rationale: यह ‘उसने उसका नाम पुकारा’ वाले हिब्रू मुहावरे का स्वाभाविक हिन्दी रूप है। कर्ता को मूल की तरह केवल पुल्लिंग एकवचन ‘उसने’ रखा गया है, बिना उसकी पहचान निश्चित किए।
- source_word: זָרַח
  choice: जेरह
  rationale: हिब्रू व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
theological_decisions:
- issue: नाम रखने वाले की पहचान
  choice: कर्ता को केवल ‘उसने’ कहा गया है
  alternative: दाई ने उसका नाम जेरह रखा
  rationale: हिब्रू क्रिया पुल्लिंग एकवचन है और कर्ता का नाम स्पष्ट नहीं करती; इसलिए प्रसंग के आधार पर किसी विशिष्ट व्यक्ति को जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘इसके बाद’ घटनाक्रम को सहज रूप से जोड़ता है; अर्धविराम जन्म और नामकरण की निकट सम्बद्ध क्रियाओं को स्पष्ट करता है।
