lexical_decisions:
- source_word: וַתַּהַר
  choice: वह गर्भवती हुई
  rationale: हिब्रू क्रिया הרה गर्भधारण करने या गर्भवती होने को व्यक्त करती है। आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: וַתֵּלֶד בֵּן
  choice: उसने एक पुत्र को जन्म दिया
  rationale: ילד का यहाँ अर्थ जन्म देना है, और בֵּן पारिवारिक संबंध के अर्थ में ‘पुत्र’ है। यह संयोजन सहज आधुनिक हिन्दी में स्रोत का पूरा अर्थ देता है।
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: यहूदा ने उसका नाम ... रखा
  rationale: क्रिया पुल्लिंग एकवचन है, जबकि पिछली दोनों क्रियाएँ स्त्रीलिंग हैं। इसलिए कर्ता का स्वाभाविक संदर्भ यहूदा है; हिन्दी में अस्पष्ट ‘उसने’ के बजाय नाम दोहराने से व्याकरणिक परिवर्तन स्पष्ट रहता है।
- source_word: עֵר
  choice: एर
  rationale: हिब्रू व्यक्तिगत नाम का देवनागरी में निकट और प्रचलित लिप्यंतरण।
theological_decisions:
- issue: וַיִּקְרָא (‘नाम रखा’) का कर्ता
  choice: कर्ता को ‘यहूदा’ के रूप में स्पष्ट किया गया है।
  alternative: ‘उसने उसका नाम एर रखा’ अथवा स्त्री को कर्ता मानना।
  rationale: मसोरेटिक पाठ में क्रिया स्पष्ट रूप से पुल्लिंग एकवचन है और पूर्ववर्ती स्त्रीलिंग क्रियाओं से कर्ता-परिवर्तन दर्शाती है। निकटतम स्वाभाविक पुरुष संदर्भ यहूदा है। यह व्याकरणिक स्पष्टता है, कोई सांप्रदायिक व्याख्या नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुत्र’ कथात्मक और वंश-संबंधी संदर्भ के अनुकूल है; नामकरण की हिब्रू अभिव्यक्ति को स्वाभाविक हिन्दी ‘नाम रखा’ में प्रस्तुत किया गया है।
