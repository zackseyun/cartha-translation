revisions:
- from: तब यहूदा ने अपने अदुल्लामी मित्र के हाथ बकरी का बच्चा भेजा, ताकि वह उस स्त्री के हाथ से गिरवी रखी वस्तुएँ वापस ले आए; पर उसे वह स्त्री नहीं मिली।
  to: तब यहूदा ने अपने अदुल्लामी मित्र के हाथ से बकरी का बच्चा भेजा, ताकि वह उस स्त्री के हाथ से गिरवी वापस ले आए; पर उसका मित्र उस स्त्री को नहीं ढूँढ़ पाया।
  rationale: The revision retains the Hebrew’s concrete “by the hand of” and “from the hand of the woman” expressions in natural Hindi, renders the pledge as the singular collective “गिरवी,” and makes the final subject-reference clear without altering the meaning.
  reviewer_model: gpt-5.6-terra
