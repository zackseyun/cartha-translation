  text: וַ/יִּשְׁלַ֨ח יְהוּדָ֜ה אֶת גְּדִ֣י הָֽ/עִזִּ֗ים בְּ/יַד֙ רֵעֵ֣/הוּ הָֽ/עֲדֻלָּמִ֔י לָ/קַ֥חַת הָ/עֵרָב֖וֹן מִ/יַּ֣ד הָ/אִשָּׁ֑ה וְ/לֹ֖א מְצָאָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/020.yaml
  text: Then Judah sent the young goat by the hand of his Adullamite friend to take back the pledge from the woman's hand[c][b][a], but he did not find her.
translation:
  language: hi
  text: तब यहूदा ने अपने अदुल्लामी मित्र के हाथ से बकरी का बच्चा भेजा, ताकि वह उस स्त्री के हाथ से गिरवी वापस ले आए; पर उसका मित्र उस स्त्री को नहीं ढूँढ़ पाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब ... भेजा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक क्रम व्यक्त करता है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: इस नाम का मानक हिन्दी बाइबलीय रूप।
- source_word: גְּדִי הָעִזִּים
  choice: बकरी का बच्चा
  rationale: हिब्रू पदबंध एक कम उम्र के बकरे/बकरी के बच्चे को दर्शाता है; हिन्दी में यह सहज और स्पष्ट है।
- source_word: בְּיַד רֵעֵהוּ הָעֲדֻלָּמִי
  choice: अपने अदुल्लामी मित्र के हाथ
  rationale: ‘के हाथ’ एजेंसी बताने वाले हिब्रू मुहावरे को स्वाभाविक हिन्दी में भी बनाए रखता है।
- source_word: לָקַחַת
  choice: वापस ले आए
  rationale: प्रयोजनसूचक क्रिया है; संदर्भ में यह पहले दी गई वस्तुओं को पुनः प्राप्त करने की बात है।
- source_word: הָעֵרָבוֹן
  choice: गिरवी रखी वस्तुएँ
  rationale: संज्ञा उस जमानत/गिरवी को दर्शाती है जो कई वस्तुओं—मुहर, डोरी और लाठी—के रूप में दी गई थी; बहुवचन अभिप्रेत वस्तुओं को हिन्दी में स्पष्ट करता है।
- source_word: מִיַּד הָאִשָּׁה
  choice: उस स्त्री के हाथ से
  rationale: हिब्रू की ठोस अभिव्यक्ति ‘स्त्री के हाथ से’ को हिन्दी में अर्थपूर्ण और स्वाभाविक रूप से संरक्षित किया गया है।
- source_word: וְלֹא מְצָאָהּ
  choice: पर उसे वह स्त्री नहीं मिली
  rationale: सर्वनाम का स्त्रीलिंग कर्म स्पष्ट करते हुए उद्देश्य और असफल परिणाम के बीच विरोध ‘पर’ से व्यक्त किया गया है।
