base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/011.yaml
  text: Then Judah said to Tamar his daughter-in-law[a], “Remain a widow in your father’s house until my son Shelah grows up,” for he said, “Lest he also die like his brothers.” So Tamar went and lived in her father’s house.
translation:
  language: hi
  text: तब यहूदा ने अपनी बहू तामार से कहा, “मेरे बेटे शेला के बड़े होने तक अपने पिता के घर में विधवा रहो।” क्योंकि उसने मन में कहा[a], “कहीं ऐसा न हो कि वह भी अपने भाइयों की तरह मर जाए।” तब तामार जाकर अपने पिता के घर में रहने लगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “कहा”; यहाँ इसका अर्थ “सोचा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי אַלְמָנָה
  choice: विधवा रहो
  rationale: आज्ञार्थक क्रिया और संज्ञा मिलकर तामार को विधवा की स्थिति में बने रहने का निर्देश देते हैं; यह आधुनिक हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: בֵית אָבִיךְ
  choice: अपने पिता के घर में
  rationale: यह पैतृक घराने में निवास का सामान्य इब्रानी मुहावरा है; हिन्दी में यह रूप स्थान और पारिवारिक आश्रय दोनों को सहजता से व्यक्त करता है।
- source_word: עַד יִגְדַּל שֵׁלָה בְנִי
  choice: मेरे बेटे शेला के बड़े होने तक
  rationale: יִגְדַּל यहाँ शेला के विवाह-योग्य आयु तक बढ़ने की ओर संकेत करता है, पर अनुवाद पाठ से आगे जाकर आयु या विवाह को स्पष्ट नहीं करता।
- source_word: כִּי אָמַר
  choice: क्योंकि उसने मन में कहा
  rationale: אָמַר का मूल अर्थ ‘कहा’ है, पर यहाँ कोई श्रोता नहीं बताया गया और यहूदा का भीतरी विचार प्रस्तुत होता है। ‘मन में कहा’ मूल कथन-क्रिया और आंतरिक विचार, दोनों को बनाए रखता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह आशंका या भय से बचने की इच्छा व्यक्त करने वाला स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: כְּאֶחָיו
  choice: अपने भाइयों की तरह
  rationale: यह एर और ओनान के समान मृत्यु की तुलना को सीधे बनाए रखता है।
- source_word: וַתֵּשֶׁב
  choice: रहने लगी
  rationale: कथानक में यह तामार के जाकर पिता के घर में निवास करने को दर्शाता है; ‘रहने लगी’ हिन्दी में स्थायी निवास का स्वाभाविक भाव देता है।
- source_word: כַּלָּתוֹ
  choice: अपनी बहू
  rationale: यह मानक पारिवारिक संबंध-सूचक शब्द है और प्रसंग में अर्थ स्पष्ट है।
theological_decisions:
- issue: यहूदा के कथन को बाहरी वचन या आंतरिक विचार के रूप में समझना
  choice: ‘मन में कहा’ के द्वारा दोनों पहलुओं को साथ रखना
  alternative: ‘सोचा’ या केवल ‘कहा’
  rationale: स्रोत में אָמַר अर्थात ‘कहा’ है, जबकि प्रसंग इसे आंतरिक तर्क के रूप में प्रस्तुत करता है। चुना हुआ रूप शब्दार्थ और प्रसंग के बीच के तनाव को मिटाता नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विधवा रहो’ सामाजिक स्थिति को स्पष्ट करता है, और ‘कहीं ऐसा न हो कि’ यहूदा की आशंका को स्वाभाविक हिन्दी में व्यक्त करता है।
