  text: וַ/יַּכֵּ֣ר יְהוּדָ֗ה וַ/יֹּ֨אמֶר֙ צָֽדְקָ֣ה מִמֶּ֔/נִּי כִּֽי עַל כֵּ֥ן לֹא נְתַתִּ֖י/הָ לְ/שֵׁלָ֣ה בְנִ֑/י וְ/לֹֽא יָסַ֥ף ע֖וֹד לְ/דַעְתָּֽ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/026.yaml
  text: Then Judah recognized them and said[a], “She is more righteous than I[b], because I did not give her to Shelah my son.” And he did not know her again.
translation:
  language: hi
  text: तब यहूदा ने उन वस्तुओं को पहचान लिया और कहा, “वह मुझसे अधिक धर्मी[a] है, क्योंकि मैंने उसे अपने बेटे शेला को नहीं दिया।” इसके बाद उसने फिर कभी उससे सहवास नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह मुझसे अधिक सही है।”
    reason: צָדְקָה का अर्थ इस प्रसंग में ‘धर्मी’ अथवा ‘सही पक्ष पर’ हो सकता है।
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: उन वस्तुओं को पहचान लिया
  rationale: क्रिया का कर्म इब्रानी में व्यक्त नहीं है, पर पिछले पद में दिखाई गई गिरवी की वस्तुएँ स्पष्ट संदर्भ हैं; स्वाभाविक हिन्दी के लिए कर्म जोड़ा गया है।
- source_word: צָדְקָה מִמֶּנִּי
  choice: वह मुझसे अधिक धर्मी है
  rationale: तुलनात्मक מִן को ‘मुझसे अधिक’ द्वारा व्यक्त किया गया है और צדק के नैतिक बल को ‘धर्मी’ में बनाए रखा गया है; यह कथन इसी प्रसंग में तामार और यहूदा की तुलना करता है।
- source_word: כִּי עַל כֵּן
  choice: क्योंकि
  rationale: यह पदबंध यहूदा के कथन का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्वाभाविक और पर्याप्त रूप है।
- source_word: לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי
  choice: मैंने उसे अपने बेटे शेला को नहीं दिया
  rationale: मूल की संक्षिप्त अभिव्यक्ति रखी गई है; विवाह में देना कथा-संदर्भ से स्पष्ट है।
- source_word: וְלֹא יָסַף עוֹד לְדַעְתָּהּ
  choice: इसके बाद उसने फिर कभी उससे सहवास नहीं किया
  rationale: ‘जानना’ यहाँ यौन-संबंध का इब्रानी शिष्टोक्ति-प्रयोग है। ‘सहवास’ उसका स्पष्ट, संक्षिप्त और गरिमापूर्ण हिन्दी रूप है; ‘फिर कभी नहीं’ आगे संबंध न रखने का भाव व्यक्त करता है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: שֵׁלָה
  choice: शेला
  rationale: व्यक्तिनाम का स्रोत-सम्मत हिन्दी लिप्यंतरण।
theological_decisions:
- issue: यहूदा की स्वीकारोक्ति में नैतिक मूल्यांकन
  choice: यहूदा इस मामले में तामार को अपने से अधिक धर्मी मानता है।
  alternative: ‘वह मुझसे अधिक सही है’—इसे मुख्यतः उसके दावे या आचरण के औचित्य की तुलना के रूप में पढ़ना।
  rationale: मूल का तुलनात्मक कथन नैतिक बल रखता है, पर तामार की पूर्ण निष्पापता का सार्वभौमिक दावा नहीं करता। मुख्य पाठ इस तनाव को बनाए रखता है और पादटिप्पणी वैकल्पिक स्वाभाविक अर्थ देती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धर्मी’ मूल के नैतिक शब्द-संबंध को सुरक्षित रखता है, जबकि पादटिप्पणी प्रसंगगत वैकल्पिक अर्थ बताती है। ‘सहवास’ इब्रानी शिष्टोक्ति को अस्पष्ट किए बिना शालीन हिन्दी में व्यक्त करता है।
