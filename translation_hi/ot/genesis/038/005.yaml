  text: וַ/תֹּ֤סֶף עוֹד֙ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁלָ֑ה וְ/הָיָ֥ה בִ/כְזִ֖יב בְּ/לִדְתָּ֥/הּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/005.yaml
  text: She conceived again and bore a son[a], and she called his name Shelah[b]. And he was at Chezib when she bore him.
translation:
  language: hi
  text: उसने फिर एक पुत्र को जन्म दिया और उसका नाम शेला रखा। जब उसने उसे जन्म दिया, तब वह[a] कज़ीब[b] में था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में यहाँ पुल्लिंग रूप ‘वह था’ है; इसका संकेत सम्भवतः यहूदा की ओर है। कुछ प्राचीन साक्षियों और व्याख्याकारों के अनुसार पाठ का अर्थ ‘वह थी’ है, अर्थात बच्चे की माता कज़ीब में थी।
    reason: alternative_reading
  - marker: b
    text: इस स्थान के नाम को कुछ प्रसंगों में ‘कजीब’ भी लिखा जाता है; दोनों रूप एक ही स्थान के नाम हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף עוֹד וַתֵּלֶד בֵּן
  choice: उसने फिर एक पुत्र को जन्म दिया
  rationale: יסף + עוד दोहराई गई क्रिया को व्यक्त करता है। प्रसंग में अगली जन्म-घटना अभिप्रेत है; हिन्दी में यह रूप स्वाभाविक है और मूल में स्पष्ट रूप से न कही गई गर्भधारण की क्रिया नहीं जोड़ता।
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ שֵׁלָה
  choice: और उसका नाम शेला रखा
  rationale: शाब्दिक अर्थ ‘उसका नाम शेला पुकारा’ है; ‘नाम ... रखा’ आधुनिक हिन्दी में उसी नामकरण-वाक्य का स्वाभाविक और स्पष्ट रूप है।
- source_word: וְהָיָה
  choice: तब वह ... था
  rationale: मसोरेटिक इब्रानी क्रिया पुल्लिंग एकवचन है। ‘वह ... था’ इस व्याकरणिक रूप को बनाए रखता है, पर सर्वनाम का अभिप्रेत व्यक्ति अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: בִכְזִיב
  choice: कज़ीब में
  rationale: स्थान-नाम כזיב का ध्वन्यात्मक लिप्यंतरण किया गया है; ‘में’ हिन्दी में किसी नगर में उपस्थित होने का स्वाभाविक चिह्न है।
- source_word: בְּלִדְתָּהּ אֹתוֹ
  choice: जब उसने उसे जन्म दिया
  rationale: בְּ के साथ क्रियार्थक संज्ञा यहाँ समय-संबंध बताती है; यह अनुवाद इब्रानी अर्थ को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: וְהָיָה का लिंग और कज़ीब में उपस्थित व्यक्ति
  choice: मुख्य पाठ में पुल्लिंग ‘वह ... था’
  alternative: ‘वह ... थी,’ अर्थात बच्चे की माता कज़ीब में थी
  rationale: WLC/मसोरेटिक पाठ में क्रिया पुल्लिंग एकवचन है, इसलिए मुख्य पाठ उसी को दर्शाता है। कुछ प्राचीन साक्षी और व्याख्याएँ स्त्रीलिंग विषय समझते हैं; वास्तविक पाठगत/व्याख्यात्मक तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामों को इब्रानी उच्चारण के निकट देवनागरी में लिखा गया है। अंतिम खंड में इब्रानी के पुल्लिंग रूप को मुख्य पाठ में रखते हुए संदर्भगत अस्पष्टता को पादटिप्पणी में स्पष्ट किया गया है।
