source:
  edition: WLC
  text: וַ/יֵּ֛רַע בְּ/עֵינֵ֥י יְהוָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה וַ/יָּ֖מֶת גַּם אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/010.yaml
  text: What he did was evil in the sight of Yahweh, so he put him to death also.
translation:
  language: hi
  text: उसने जो किया, वह यहोवा की दृष्टि में बुरा था; इसलिए यहोवा ने उसे भी मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרַע
  choice: बुरा था
  rationale: क्रिया רעע यहाँ नैतिक रूप से बुरा होने का भाव देती है; ‘बुरा था’ सरल और प्रत्यक्ष है तथा इसे केवल ‘अप्रिय लगा’ कहकर हल्का नहीं करता।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: यह इब्रानी मुहावरा परमेश्वर के मूल्यांकन को व्यक्त करता है। ‘की दृष्टि में’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר עָשָׂה
  choice: उसने जो किया
  rationale: सम्बन्धवाचक उपवाक्य ओनान के पिछले पद में वर्णित कार्य की ओर संकेत करता है; यह रूप सहज और स्पष्ट है।
- source_word: וַיָּמֶת
  choice: यहोवा ने उसे ... मार डाला
  rationale: מות का हिफ़ईल रूप कारक है और मृत्यु को सीधे यहोवा के कार्य के रूप में प्रस्तुत करता है। कर्ता को दोहराने से हिन्दी में सर्वनाम-संदेह दूर होता है।
- source_word: גַּם אֹתוֹ
  choice: उसे भी
  rationale: ‘भी’ ओनान के दण्ड को उससे पहले एर को मिले दण्ड से जोड़ता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में टेट्राग्राम יהוה स्पष्ट रूप से है। हिन्दी के सामान्य बाइबलीय प्रयोग में पहचाने जाने वाले व्यक्तिगत नाम ‘यहोवा’ को चुना गया, न कि उपाधि ‘प्रभु’।
- issue: וַיָּמֶת में ईश्वरीय न्याय और कर्तृत्व
  choice: इसलिए यहोवा ने उसे भी मार डाला
  alternative: और वह भी मर गया
  rationale: हिफ़ईल कारक रूप मृत्यु को यहोवा द्वारा दिए गए न्याय के रूप में रखता है; निष्क्रिय विकल्प मूल के प्रत्यक्ष कर्तृत्व को धुंधला कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। अर्धविराम कारण और परिणाम के निकट सम्बन्ध को स्पष्ट करता है।
