source:
  edition: WLC
  text: וַ/יֵּ֣דַע אוֹנָ֔ן כִּ֛י לֹּ֥א ל֖/וֹ יִהְיֶ֣ה הַ/זָּ֑רַע וְ/הָיָ֞ה אִם בָּ֨א אֶל אֵ֤שֶׁת אָחִי/ו֙ וְ/שִׁחֵ֣ת אַ֔רְצָ/ה לְ/בִלְתִּ֥י נְתָן זֶ֖רַע לְ/אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/009.yaml
  text: But Onan knew that the offspring would not be his[a]; so whenever he went in to his brother’s wife, he spilled it on the ground[b], so as not to give offspring to his brother.
translation:
  language: hi
  text: पर ओनान जानता था कि होने वाली संतान उसकी नहीं मानी जाएगी[a]; इसलिए जब-जब वह अपने भाई की पत्नी के पास जाता, तब वह अपना वीर्य भूमि पर गिरा देता[b], ताकि अपने भाई को संतान न दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “बीज उसका नहीं होगा।” देवर-विवाह के इस संदर्भ में होने वाली संतान मृत भाई के नाम से मानी जाती।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक भाव “उसे भूमि पर नष्ट/बरबाद कर देता” है। संदर्भ में ‘उसे’ ओनान के वीर्य को सूचित करता है और गर्भधारण रोकने की उसकी क्रिया का वर्णन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: जानता था
  rationale: कथात्मक संदर्भ में ידע का सीधा और स्वाभाविक अर्थ; यह ओनान की पहले से विद्यमान समझ को व्यक्त करता है।
- source_word: לֹא לוֹ יִהְיֶה הַזָּרַע
  choice: वह संतान उसकी नहीं मानी जाएगी
  rationale: शाब्दिक रूप से ‘वह वंश/बीज उसका नहीं होगा’; देवर-विवाह के संदर्भ में भाव यह है कि होने वाली संतान मृत भाई के नाम से मानी जाती, ओनान के नाम से नहीं।
- source_word: וְהָיָה אִם־בָּא
  choice: जब-जब ... जाता
  rationale: यह रचना अतीत में बार-बार होने वाले कार्य को दर्शाती है; हिन्दी में ‘जब-जब’ उस पुनरावृत्ति को स्पष्ट करती है।
- source_word: בָּא אֶל־אֵשֶׁת אָחִיו
  choice: अपने भाई की पत्नी के पास जाता
  rationale: मूल के शिष्ट यौन-संबंधी मुहावरे को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: וְשִׁחֵת אַרְצָה
  choice: उसे भूमि पर नष्ट कर देता
  rationale: שחת का मूल अर्थ ‘नष्ट/बरबाद करना’ है। अनिर्दिष्ट कर्म को ‘उसे’ से बनाए रखते हुए यह गर्भधारण रोकने की क्रिया बताता है, पर मूल से अधिक स्पष्ट शब्दावली नहीं जोड़ता।
- source_word: לְבִלְתִּי נְתָן זֶרַע לְאָחִיו
  choice: ताकि अपने भाई को संतान न दे
  rationale: उद्देश्यवाचक उपवाक्य को स्पष्ट करता है; यहाँ זרע का आशय भाई के नाम की संतान से है।
theological_decisions:
- issue: זרע का कानूनी-पारिवारिक अर्थ और ओनान की शारीरिक क्रिया
  choice: दोनों कानूनी प्रसंगों में ‘संतान’ और क्रिया के लिए ‘उसे भूमि पर नष्ट कर देता’
  alternative: हर जगह ‘बीज’ कहना, अथवा क्रिया को अधिक स्पष्ट शारीरिक शब्दों में व्यक्त करना
  rationale: पद एक ओर मृत भाई के नाम से मानी जाने वाली संतान की बात करता है और दूसरी ओर गर्भधारण रोकने के साधन की। चुना हुआ अनुवाद दोनों स्तरों को अलग रखता है और पाठ में कोई अतिरिक्त नैतिक या सांप्रदायिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण कथात्मक शैली। ‘पास जाता’ मूल के शिष्ट मुहावरे को रखता है, और ‘जब-जब’ पुनरावृत्त क्रिया को सहज रूप से प्रकट करता है।
