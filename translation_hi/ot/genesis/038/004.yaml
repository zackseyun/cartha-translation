  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: वह गर्भवती हुई
  rationale: हिब्रू क्रिया הרה यहाँ गर्भधारण करने को व्यक्त करती है। आधुनिक हिंदी में ‘गर्भवती हुई’ स्वाभाविक और स्पष्ट है।
- source_word: עוֹד
  choice: फिर
  rationale: जन्मों के इस क्रम में यह शब्द घटना की पुनरावृत्ति बताता है; हिंदी कथात्मक शैली में ‘फिर’ सहज है।
- source_word: וַתֵּלֶד בֵּן
  choice: उसने एक पुत्र को जन्म दिया
  rationale: यह ילד और ‘पुत्र’ की हिब्रू प्रसव-संबंधी अभिव्यक्ति का स्वाभाविक, गरिमापूर्ण हिंदी रूप है।
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: उसने उसका नाम ... रखा
  rationale: हिब्रू का शाब्दिक अर्थ ‘उसका नाम पुकारा’ है, पर नामकरण के लिए आधुनिक मानक हिंदी में ‘नाम रखा’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אוֹנָן
  choice: ओनान
  rationale: व्यक्तिवाचक नाम को उसके हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
