  register: भाषा आधुनिक, सहज और कथात्मक रखी गई है। मूल इब्रानी की यौन शिष्टोक्ति को मुख्य पाठ में परोक्ष रूप से सुरक्षित रखते हुए पादटिप्पणी में स्पष्ट किया गया है। ‘मार्ग’ गरिमापूर्ण सामान्य बाइबलीय कथाशैली के अनुकूल है, जबकि संवाद में ‘ज़रा’ स्वाभाविक आग्रह व्यक्त करता है।
