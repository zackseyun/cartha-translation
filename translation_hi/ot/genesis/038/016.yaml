base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/016.yaml
  text: So he turned aside to her by the road and said[a], “Please, let me come in to you,” for he did not know that she was his daughter-in-law. And she said, “What will you give me[b], that you may come in to me?”
translation:
  language: hi
  text: तब वह रास्ते के किनारे उसकी ओर मुड़ गया और बोला, “ज़रा मुझे तुम्हारे पास आने दो[a],” क्योंकि वह नहीं जानता था कि वह उसकी बहू है। उसने कहा, “मुझे क्या दोगे[b], कि तुम मेरे पास आओ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “तुम्हारे/मेरे पास आना”; यहाँ यह यौन-संबंध के लिए प्रयुक्त शिष्टोक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या, “मुझे क्या भुगतान करोगे?” इब्रानी में अधिक शाब्दिक रूप से “मुझे क्या दोगे?” है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ
  choice: मार्ग के किनारे उसकी ओर मुड़ा
  rationale: נטה यहाँ अपने रास्ते से हटकर किसी की ओर जाने को व्यक्त करता है; ‘मार्ग के किनारे’ प्रसंग में तामार के बैठने के स्थान को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: הָבָה נָּא
  choice: ज़रा मुझे ... दो
  rationale: यह आग्रहसूचक पद-समूह है। ‘ज़रा ... दो’ आधुनिक हिन्दी में आग्रह को सहजता से व्यक्त करता है, बिना अनावश्यक कठोरता या पुरातनता के।
- source_word: אָבוֹא אֵלַיִךְ / תָבוֹא אֵלַי
  choice: अपने पास आने दो / मेरे पास आओ
  rationale: בוא אל इस प्रसंग में यौन-संबंध का शिष्टोक्तिपूर्ण संकेत है। मुख्य पाठ में ‘पास आना’ मूल की परोक्षता बनाए रखता है; अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כִּי לֹא יָדַע
  choice: क्योंकि वह नहीं जानता था
  rationale: כִּי यहाँ यह स्पष्ट करने वाला कारणसूचक उपवाक्य आरम्भ करता है कि यहूदा ने ऐसा क्यों किया।
- source_word: כִּי כַלָּתוֹ הִוא
  choice: कि वह उसकी बहू है
  rationale: כַלָּה के लिए इस पारिवारिक संदर्भ में ‘बहू’ सटीक और सामान्य आधुनिक हिन्दी शब्द है।
- source_word: מַה תִּתֶּן לִּי
  choice: मुझे क्या दोगे
  rationale: मूल पाठ सामान्य क्रिया ‘देना’ का प्रयोग करता है। प्रसंग में भुगतान निहित है, पर मुख्य पाठ में मूल की व्यापक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: כִּי תָבוֹא אֵלָי
  choice: ताकि तुम मेरे पास आओ
  rationale: यहाँ כִּי अपेक्षित विनिमय अथवा उद्देश्य को जोड़ता है। ‘ताकि’ हिन्दी में वाक्य-संबंध को स्पष्ट और स्वाभाविक बनाता है।
