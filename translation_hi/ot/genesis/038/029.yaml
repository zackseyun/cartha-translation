base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/029.yaml
  text: And as he drew back his hand[a], behold, his brother came out. Then she said[b], “What a breach you have made for yourself!” So his name was called Perez.
translation:
  language: hi
  text: जब उसने अपना हाथ पीछे खींच लिया, तभी उसका भाई निकल आया। तब उसने कहा, “तूने अपने लिए कैसी दरार बना ली है!”[a] इसलिए उसका नाम पेरेस रखा गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: “तूने अपने लिए कैसी दरार बना ली है!” इस उक्ति में प्रयुक्त क्रिया और ‘दरार’ के लिए शब्द उसी इब्रानी मूल से हैं जिससे ‘पेरेस’ नाम बना है।'
    reason: मूल इब्रानी के शब्दालंकार और कठिन वाक्य-विन्यास को स्पष्ट करना।
lexical_decisions:
- source_word: כְּמֵשִׁיב יָדוֹ
  choice: जब उसने अपना हाथ पीछे खींच लिया
  rationale: שׁוב के हिफ़ील कृदंत और יָד का प्रयोग यहाँ हाथ वापस खींचने की ठोस क्रिया बताता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וְהִנֵּה
  choice: तभी
  rationale: הִנֵּה से आने वाली आकस्मिकता और कथात्मक चौंक को आधुनिक हिन्दी में सहज ढंग से व्यक्त करता है।
- source_word: יָצָא אָחִיו
  choice: उसका भाई निकल आया
  rationale: जन्म के प्रसंग में יָצָא का सीधा शारीरिक अर्थ बनाए रखता है।
- source_word: מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  choice: तू कैसी बाधा तोड़कर निकल आया है!
  rationale: פרץ की बलपूर्वक रास्ता बनाने या अवरोध तोड़कर निकलने की छवि को स्वाभाविक हिन्दी में व्यक्त करता है। कठिन עָלֶיךָ को अलग से अतिशाब्दिक बनाने के बजाय आत्मवाची क्रिया ‘निकल आया’ में समाहित किया गया है।
- source_word: פָּרֶץ
  choice: पेरेस
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण; मूल इब्रानी में इसका संबंध פרץ, अर्थात् ‘तोड़कर निकलना/दरार’, से है।
- source_word: וַיִּקְרָא שְׁמוֹ פָּרֶץ
  choice: इसलिए उसका नाम पेरेस रखा गया
  rationale: इब्रानी की निरवैयक्तिक नामकरण-रचना को बिना किसी अनिर्दिष्ट कर्ता को जोड़ें स्वाभाविक हिन्दी में सुरक्षित रखता है।
