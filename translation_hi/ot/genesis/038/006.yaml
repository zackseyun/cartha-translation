translation:
  language: hi
  text: यहूदा ने अपने पहलौठे पुत्र एर के लिए एक पत्नी ली, और उसका नाम तामार था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ली
  rationale: לָקַח का मूल अर्थ ‘लेना’ है। यहाँ यहूदा द्वारा अपने पुत्र के लिए पत्नी चुनने या विवाह की व्यवस्था करने का भाव है; ‘पत्नी ली’ इब्रानी रचना को निकटता से रखते हुए हिंदी में समझने योग्य है।
- source_word: אִשָּׁה
  choice: एक पत्नी
  rationale: विवाह के प्रसंग में אִשָּׁה का संबंधपरक अर्थ ‘पत्नी’ है, केवल सामान्य ‘स्त्री’ नहीं।
- source_word: לְעֵר
  choice: एर के लिए
  rationale: לְ यहाँ उस व्यक्ति को दर्शाता है जिसके लिए यहूदा पत्नी लाया; इसलिए ‘के लिए’ स्वाभाविक और सटीक है।
- source_word: בְּכוֹרוֹ
  choice: अपने पहलौठे
  rationale: בְּכוֹר का शाब्दिक और पारिवारिक अर्थ ‘पहलौठा’ है; इससे जन्मक्रम का स्रोत-पाठीय संकेत सुरक्षित रहता है।
- source_word: וּשְׁמָהּ
  choice: और उसका नाम ... था
  rationale: यह इब्रानी की सामान्य नाम-परिचय रचना है और आधुनिक हिंदी में स्वाभाविक रूप से व्यक्त होती है।
- source_word: תָּמָר
  choice: तामार
  rationale: व्यक्तिनाम को प्रचलित हिंदी बाइबलीय लिप्यंतरण के अनुसार रखा गया है।
