base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/001.yaml
  text: At that time Judah went down from his brothers and turned aside to a certain Adullamite whose name was Hirah[a][b].
translation:
  language: hi
  text: उस समय[a] यहूदा अपने भाइयों से अलग होकर नीचे गया और हीरा नाम के एक अदुल्लामी व्यक्ति[b] की ओर मुड़ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “और उस समय ऐसा हुआ।”'
    reason: lexical_alternative
  - marker: b
    text: या “अदुल्लाम का एक व्यक्ति”; इब्रानी अभिव्यक्ति केवल उसके मूल स्थान की पहचान कर सकती है, पर किसी विशेष व्यक्ति का परिचय भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: उस समय
  rationale: यह इब्रानी कथात्मक सूत्र नए प्रसंग का समय बताता है। ‘उस समय’ आधुनिक हिन्दी में स्वाभाविक है; अधिक शब्दशः विकल्प पादटिप्पणी में दिया गया है।
- source_word: וַיֵּרֶד
  choice: नीचे गया
  rationale: इससे ירד का दिशात्मक अर्थ बना रहता है और कथात्मक हिन्दी में सहज अभिव्यक्ति मिलती है।
- source_word: מֵאֵת אֶחָיו
  choice: अपने भाइयों के पास से
  rationale: यह यहूदा के अपने भाइयों से अलग होकर जाने को सीधे व्यक्त करता है और ‘भाइयों’ के पारिवारिक अर्थ को सुरक्षित रखता है।
- source_word: וַיֵּט עַד
  choice: की ओर मुड़ गया
  rationale: यहाँ נטה का अर्थ किसी व्यक्ति की ओर मुड़ना है; यह अनावश्यक रूप से ‘ठहरने’ का अर्थ जोड़े बिना दिशा और विचलन दोनों को व्यक्त करता है।
- source_word: אִישׁ עֲדֻלָּמִי
  choice: एक अदुल्लामी व्यक्ति
  rationale: यह व्यक्ति का अदुल्लाम से संबंध बताता है और हिन्दी में स्वाभाविक रूप से एक नए पात्र का परिचय देता है। इब्रानी की संभावित सामान्य अथवा विशिष्ट पहचान पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וּשְׁמוֹ חִירָה
  choice: हीरा नाम के
  rationale: इब्रानी नामकरण-वाक्य को संज्ञा-समूह में जोड़ना आधुनिक हिन्दी में सहज है और व्यक्ति की पहचान स्पष्ट रखता है।
- source_word: חִירָה
  choice: हीरा
  rationale: इब्रानी व्यक्तिगत नाम का मानक देवनागरी लिप्यंतरण।
