base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/025.yaml
  text: As she was being brought out[a], she sent word to her father-in-law, saying, “I am pregnant by the man to whom these belong.” And she said, “Please identify whose signet ring, cords, and staff these are.”
translation:
  language: hi
  text: जब उसे बाहर ले जाया जा रहा था, तब उसने अपने ससुर के पास यह संदेश भिजवाया, “जिस पुरुष की ये वस्तुएँ हैं, उसी से मैं गर्भवती हूँ।” और उसने कहा, “कृपया पहचानिए[a] कि यह मुहर, ये डोरियाँ और यह लाठी किसकी हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहचानकर बताइए।” इब्रानी क्रिया का अर्थ पहचानना अथवा पहचान करके निश्चित करना हो सकता है; यहाँ प्रमाण प्रस्तुत करने का तीखा भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּצֵאת
  choice: बाहर ले जाया जा रहा था
  rationale: יצא का होफाल कृदंत चल रही निष्कासन-क्रिया को दर्शाता है; दंड के लिए बाहर ले जाए जाने का प्रसंग इस कर्मवाच्य रूप में स्वाभाविक रूप से व्यक्त होता है।
- source_word: שָׁלְחָה אֶל חָמִיהָ
  choice: अपने ससुर के पास यह संदेश भिजवाया
  rationale: शाब्दिक अर्थ ‘अपने ससुर के पास भेजा’ है; आगे आए कथन के कारण हिन्दी में संदेश भिजवाने का आशय स्पष्ट करना स्वाभाविक है।
- source_word: לְאִישׁ אֲשֶׁר אֵלֶּה לּוֹ אָנֹכִי הָרָה
  choice: जिस पुरुष की ये वस्तुएँ हैं, उसी से मैं गर्भवती हूँ
  rationale: स्वामित्व बताने वाली सम्बन्धवाचक रचना और गर्भ के पिता का निहित संकेत दोनों को स्पष्ट, पर संयत हिन्दी में रखा गया है। ‘उसी’ मूल कथन के पहचान-संबंधी बल को स्वाभाविक रूप देता है।
- source_word: הַכֶּר נָא
  choice: कृपया पहचानिए
  rationale: נכר का अर्थ पहचानना या पहचान करके बताना हो सकता है; נא के विनम्र अनुरोध को ‘कृपया’ से व्यक्त किया गया है।
- source_word: חֹתֶמֶת
  choice: मुहर
  rationale: यह व्यक्ति की पहचान और प्रमाणीकरण के लिए प्रयुक्त निजी seal है। मूल शब्द अंगूठी को अनिवार्य रूप से नहीं बताता, इसलिए ‘मुहर’ अधिक सुरक्षित और सामान्य हिन्दी विकल्प है।
- source_word: פְּתִילִים
  choice: डोरियाँ
  rationale: मूल संज्ञा बहुवचन में है और मुहर से जुड़ी डोरियों की ओर संकेत करती है; हिन्दी बहुवचन सुरक्षित रखा गया है।
- source_word: מַטֶּה
  choice: लाठी
  rationale: पितृकालीन कथा में हाथ में रखी जाने वाली staff के लिए ‘लाठी’ सामान्य, स्पष्ट और प्रसंगानुकूल हिन्दी है।
