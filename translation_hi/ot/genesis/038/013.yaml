base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/013.yaml
  text: And Tamar was told[a], saying, “Look, your father-in-law is going up to Timnah to shear his sheep.”
translation:
  language: hi
  text: 'और तामार को यह समाचार मिला[a]: “देखो, तुम्हारा ससुर अपनी भेड़ों की ऊन कतरने के लिए तिम्ना जा रहा है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और तामार को बताया गया, यह कहते हुए।”
    reason: मूल इब्रानी की निष्क्रिय सूचना-रचना और לֵאמֹר सूत्र का अधिक औपचारिक विकल्प।
lexical_decisions:
- source_word: וַיֻּגַּד לְתָמָר
  choice: तामार को यह समाचार मिला
  rationale: होफ़ाल रूप निष्क्रिय सूचना दिए जाने को व्यक्त करता है। आधुनिक हिन्दी में यह प्रयोग स्वाभाविक है और अज्ञात सूचना देने वाले को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: לֵאמֹר
  choice: उद्धरण से पहले विसर्ग
  rationale: यह प्रत्यक्ष कथन का परिचय देता है; हिन्दी में ‘यह कहते हुए’ की अपेक्षा विराम-चिह्न इसे अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह सूचना की ओर ध्यान खींचने वाला उद्गार है; ‘देखो’ आधुनिक और सहज है।
- source_word: חָמִיךְ
  choice: तुम्हारा ससुर
  rationale: स्त्रीलिंग एकवचन संबोधन तामार के लिए है; संबंध-सूचक शब्द स्पष्ट रखा गया है।
- source_word: עֹלֶה
  choice: जा रहा है
  rationale: कर्तृवाचक कृदन्त जारी या निकट भविष्य की गति बताता है। गंतव्य की ओर जाने का स्वाभाविक हिन्दी रूप चुना गया; ‘ऊपर जा रहा है’ यहाँ असहज भौगोलिक अति-स्पष्टीकरण होता।
- source_word: תִמְנָתָה
  choice: तिम्ना
  rationale: दिशासूचक ה के कारण गंतव्य का भाव ‘तिम्ना जा रहा है’ में स्वाभाविक रूप से व्यक्त है।
- source_word: לָגֹז
  choice: ऊन कतरने के लिए
  rationale: ל सहित धात्वर्थक रूप प्रयोजन बताता है। हिन्दी में भेड़ों के संदर्भ में ‘ऊन कतरना’ स्पष्ट और प्रचलित है।
- source_word: צֹאנוֹ
  choice: अपनी भेड़ों
  rationale: ऊन कतरने के प्रसंग में सामूहिक צאן का आशय भेड़ें है; ‘अपनी’ हिन्दी में कर्ता यहूदा से संबंध स्वाभाविक रूप से दिखाता है।
