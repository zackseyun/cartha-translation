base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/023.yaml
  text: And Judah said[a], “Let her keep them, lest we become a laughingstock. Look, I sent this young goat, but you did not find her.”
translation:
  language: hi
  text: तब यहूदा ने कहा, “उसे वे चीज़ें अपने पास रखने दो, कहीं हम उपहास के पात्र न बन जाएँ।[a] देखो, मैंने बकरी का यह बच्चा भेजा था, पर तुम्हें वह स्त्री नहीं मिली।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कहीं हमारी बदनामी न हो जाए” अथवा “कहीं लोग हमारा उपहास न करें।” इब्रानी अभिव्यक्ति तिरस्कार या उपहास का पात्र बनने की बात करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקַּח לָהּ
  choice: उसे वे चीज़ें अपने पास रखने दो
  rationale: यहाँ स्त्रीलिंग अपूर्ण क्रिया प्रसंग में अनुमति या छोड़ देने का भाव व्यक्त करती है। कर्म इब्रानी में निहित है और पिछले प्रसंग की गिरवी रखी चीज़ों की ओर संकेत करता है; इसलिए हिन्दी में बहुवचन ‘वे चीज़ें’ स्पष्ट और स्वाभाविक है।
- source_word: פֶּן נִהְיֶה לָבוּז
  choice: कहीं हम उपहास के पात्र न बन जाएँ
  rationale: בּוּז में तिरस्कार, उपहास और सामाजिक अपमान का भाव है। यह अनुवाद यहूदा की लोक-लज्जा की चिंता को व्यक्त करता है और अर्थ की सीमा को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला वार्तालाप-सूचक अव्यय है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और मूल का संकेतात्मक बल बनाए रखता है।
- source_word: שָׁלַחְתִּי הַגְּדִי הַזֶּה
  choice: मैंने बकरी का यह बच्चा भेजा था
  rationale: גְּדִי बकरी के बच्चे को दर्शाता है। ‘भेजा था’ प्रसंग में पहले किए गए प्रयास को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘यह’ मूल के संकेतवाचक को सुरक्षित रखता है।
- source_word: וְאַתָּה לֹא מְצָאתָהּ
  choice: पर तुम्हें वह स्त्री नहीं मिली
  rationale: ו यहाँ पहले कथन के विपरीत परिणाम प्रस्तुत करता है, इसलिए ‘पर’ उपयुक्त है। स्त्रीलिंग प्रत्यय खोजी जा रही स्त्री को सूचित करता है; हिन्दी में ‘वह स्त्री’ संदर्भ को स्पष्ट करता है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: नाम का प्रचलित मानक हिन्दी बाइबलीय रूप रखा गया है।
