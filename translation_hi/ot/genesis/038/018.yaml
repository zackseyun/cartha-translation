translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद संक्षिप्त है और मूल की कथात्मक गति बनाए रखता है। यौन सम्बन्ध के लिए मूल की शिष्टोक्ति को मुख्य पाठ में सुरक्षित रखते हुए उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
