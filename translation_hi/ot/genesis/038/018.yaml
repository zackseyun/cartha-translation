base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/018.yaml
  text: He said[a], “What pledge shall I give you?” And she said, “Your seal, your cord, and your staff that is in your hand.” So he gave them to her and went in to her[c][b], and she conceived by him.
translation:
  language: hi
  text: उसने कहा, “मैं तुम्हें क्या गिरवी दूँ?” उसने उत्तर दिया, “तुम्हारी मुहर[a], तुम्हारी डोरी, और वह लाठी जो तुम्हारे हाथ में है।” तब उसने वे चीज़ें उसे दे दीं और उसके पास गया[b], और वह उससे गर्भवती हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी मुद्रा।” इब्रानी में मुहर लगाने वाले साधन का ठीक रूप नहीं बताया गया है।
    reason: lexical_alternative
  - marker: b
    text: “उसके पास गया” यौन संबंध के लिए प्रयुक्त इब्रानी शिष्टोक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵרָבוֹן
  choice: गिरवी
  rationale: यह उस वस्तु को दर्शाता है जो बाद में भुगतान किए जाने तक जमानत के रूप में दी जाती है। प्रश्न में “क्या गिरवी दूँ?” स्वाभाविक और ठोस है।
- source_word: חֹתָמְךָ
  choice: अपनी मुहर
  rationale: इब्रानी शब्द पहचान के लिए प्रयुक्त मुहर या मुहर लगाने के साधन को दर्शाता है, पर उसका ठीक रूप नहीं बताता; इसलिए “अँगूठी” जोड़कर अर्थ को सीमित नहीं किया गया।
- source_word: וּפְתִילֶךָ
  choice: अपनी डोरी
  rationale: यह सम्भवतः मुहर से जुड़ी डोरी थी। “डोरी” मूल शब्द के सामान्य अर्थ को बिना अनावश्यक विस्तार के व्यक्त करती है।
- source_word: וּמַטְּךָ אֲשֶׁר בְּיָדֶךָ
  choice: अपने हाथ की लाठी
  rationale: यह संक्षिप्त और स्वाभाविक हिन्दी में उस लाठी को व्यक्त करता है जो उसके हाथ में थी, और मूल का ठोस बिंब बनाए रखता है।
- source_word: וַיִּתֶּן לָּהּ
  choice: उसने वे चीज़ें उसे दे दीं
  rationale: क्रिया में वस्तुएँ स्पष्ट रूप से नहीं दोहराई गईं, पर सन्दर्भ में माँगी गई तीनों वस्तुएँ हैं; हिन्दी में “वे चीज़ें” अर्थ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: उसके पास गया
  rationale: यह मूल इब्रानी के शिष्टोक्ति-युक्त वर्णन को बनाए रखता है; यौन सम्बन्ध का आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וַתַּהַר לוֹ
  choice: वह उससे गर्भवती हो गई
  rationale: यह आधुनिक हिन्दी में गर्भधारण और पुरुष से उसके सम्बन्ध—दोनों को स्पष्ट तथा स्वाभाविक रूप से व्यक्त करता है।
