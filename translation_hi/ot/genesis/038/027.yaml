  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: जब ... समय आया
  rationale: यह इब्रानी कथात्मक क्रम और समय-सूचक पदबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना अनावश्यक ‘अब’ जोड़े।
- source_word: לִדְתָּהּ
  choice: उसके जन्म देने का
  rationale: ילד के infinitive construct और स्त्रीलिंग एकवचन प्रत्यय का स्पष्ट, वर्तमान हिन्दी रूप है।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: ‘देखो’ ध्यान आकर्षित करने और अप्रत्याशित तथ्य सामने लाने वाली הִנֵּה की कथात्मक शक्ति बनाए रखता है; ‘तो’ हिन्दी वाक्य के प्रवाह को स्वाभाविक बनाता है।
- source_word: תְאוֹמִים
  choice: जुड़वाँ बच्चे
  rationale: संदर्भ में यह स्वाभाविक और स्पष्ट हिन्दी है; ‘बच्चे’ जोड़ने से संज्ञात्मक अर्थ साफ़ होता है, बिना संख्या संबंधी अतिरिक्त सूचना जोड़े।
- source_word: בְּבִטְנָהּ
  choice: उसके गर्भ में
  rationale: प्रसव के संदर्भ में בטן का अभिप्राय ‘गर्भ’ है, न कि सामान्यतः ‘पेट’।
