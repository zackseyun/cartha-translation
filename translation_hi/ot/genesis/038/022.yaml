base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/022.yaml
  text: So he returned to Judah and said[a], “I did not find her, and also the men of the place said[b], ‘There has been no cult prostitute here.’”
translation:
  language: hi
  text: तब वह यहूदा के पास लौटकर बोला, “मैंने उसे नहीं पाया। उस स्थान के पुरुषों ने भी कहा, ‘यहाँ कोई क़ेदेशा[a] नहीं थी।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू क़ेदेशा। इसका अर्थ अनिश्चित है; परंपरागत अनुवाद “पंथ से जुड़ी वेश्या” या “मंदिर की वेश्या” हैं। अधिक शाब्दिक अर्थ “पवित्र” या “समर्पित स्त्री” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: तब वह … लौटकर
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ क्रमिक प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל־יְהוּדָה
  choice: यहूदा के पास
  rationale: אֶל दिशा को सूचित करता है; व्यक्ति के पास लौटने के लिए यह स्वाभाविक हिन्दी है।
- source_word: לֹא מְצָאתִיהָ
  choice: मैंने उसे नहीं पाया
  rationale: नकार सहित पूर्ण क्रिया पूरी हो चुकी खोज का सीधा भूतकालीन विवरण देती है; इसमें असमर्थता का अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: उस स्थान के पुरुषों
  rationale: हिब्रू पदबंध का लिंग-विशिष्ट अर्थ ‘स्थान के पुरुष’ है; ‘लोगों’ कहने से यह विशेषता मिट जाती।
- source_word: לֹא הָיְתָה בָזֶה
  choice: यहाँ … नहीं थी
  rationale: अस्तित्व अथवा उपस्थिति के निषेध को सहज हिन्दी में व्यक्त करता है; בָזֶה का प्रसंगानुकूल अर्थ ‘यहाँ’ है।
- source_word: קְדֵשָׁה
  choice: पंथ से जुड़ी … वेश्या
  rationale: यह शब्द साधारण वेश्या के लिए प्रयुक्त זֹנָה से भिन्न, किसी धार्मिक पंथ अथवा अनुष्ठान से संबद्ध स्त्री को सूचित करता है। यह रूप ‘मन्दिर की वेश्या’ की अपेक्षा कम संकीर्ण है और किसी औपचारिक मन्दिर-संस्था को अनावश्यक रूप से नहीं मानता।
theological_decisions:
- issue: קְדֵשָׁה की धार्मिक-सांस्कृतिक पहचान
  choice: पंथ से जुड़ी वेश्या
  alternative: मन्दिर की वेश्या; समर्पित स्त्री
  rationale: मूल शब्द का धार्मिक संबंध बनाए रखा गया है, पर यह निश्चित नहीं किया गया कि वह किसी औपचारिक मन्दिर संस्था की पदाधिकारी थी। पादटिप्पणी वैकल्पिक अर्थ की वास्तविक अनिश्चितता बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी अपनाई गई है। ‘पंथ से जुड़ी वेश्या’ सामान्य पाठक के लिए अर्थ खोलता है, जबकि पादटिप्पणी मूल शब्द की अनिश्चितता और वैकल्पिक अनुवाद सुरक्षित रखती है।
