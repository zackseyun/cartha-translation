  text: וַ/תָּסַר֩ בִּגְדֵ֨י אַלְמְנוּתָ֜/הּ מֵֽ/עָלֶ֗י/הָ וַ/תְּכַ֤ס בַּ/צָּעִיף֙ וַ/תִּתְעַלָּ֔ף וַ/תֵּ֨שֶׁב֙ בְּ/פֶ֣תַח עֵינַ֔יִם אֲשֶׁ֖ר עַל דֶּ֣רֶךְ תִּמְנָ֑תָ/ה כִּ֤י רָאֲתָה֙ כִּֽי גָדַ֣ל שֵׁלָ֔ה וְ/הִ֕וא לֹֽא נִתְּנָ֥ה ל֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/014.yaml
  text: So she took off her widow’s garments from herself, and wrapped herself in a veil, and sat at the entrance to Enaim, which is on the road to Timnah. For she saw that Shelah had grown up, yet she had not been given to him as a wife.
translation:
  language: hi
  text: तब उसने अपने विधवा-वस्त्र उतार दिए, घूँघट से अपने को ढका और अपने को लपेट लिया, और एनैम के प्रवेश[a] पर बैठ गई, जो तिम्ना जाने वाले मार्ग पर है। क्योंकि उसने देखा कि शेला बड़ा हो गया था, फिर भी वह शेला को पत्नी के रूप में नहीं दी गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एनैम के द्वार पर”; इब्रानी पदबंध को किसी स्थान के नाम के रूप में समझा जाता है, पर उसका सटीक रूप अनिश्चित है।
    reason: בְּפֶתַח עֵינַיִם की नामगत और भौगोलिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: अपने विधवा-वस्त्र
  rationale: यह विधवा के रूप में पहने जाने वाले विशिष्ट वस्त्रों को दर्शाता है; ‘शोक के वस्त्र’ कहना स्रोत से अधिक अर्थ जोड़ता।
- source_word: בַּצָּעִיף
  choice: घूँघट
  rationale: צָעִיף सिर या चेहरे को ढकने वाले आवरण का द्योतक है; आधुनिक हिंदी में ‘घूँघट’ इस प्रसंग में सहज और स्पष्ट है।
- source_word: וַתִּתְעַלָּף
  choice: अपने को ढक लिया
  rationale: क्रिया स्वयं को लपेटने या छिपाने का भाव देती है; इसे अलग रूप में रखने से निकटवर्ती ‘घूँघट ओढ़कर’ के बाद भी मूल की दूसरी क्रिया सुरक्षित रहती है।
- source_word: בְּפֶתַח עֵינַיִם
  choice: एनैम के प्रवेश-स्थान पर
  rationale: עֵינַיִם को स्थान-नाम मानते हुए פֶּתַח का अर्थ ‘प्रवेश-स्थान’ रखा गया है; अभिव्यक्ति में कुछ भौगोलिक/नामगत अस्पष्टता है, जिसे पाद-टिप्पणी में दर्शाया गया है।
- source_word: תִּמְנָתָה
  choice: तिम्ना जाने वाले
  rationale: दिशासूचक ה को हिंदी में ‘जाने वाले’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: तामार को शेला न दिए जाने का निष्क्रिय वाक्य
  choice: उसे उसकी पत्नी बनने के लिए नहीं दिया गया था
  alternative: यहूदा ने उसे शेला की पत्नी नहीं बनाया था
  rationale: मूल पाठ निष्क्रिय है और कर्ता का स्पष्ट नाम नहीं लेता; अनुवाद उसी कथात्मक तनाव और उत्तरदायित्व की अप्रत्यक्षता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। ‘घूँघट ओढ़कर अपने को ढक लिया’ में मूल की दो क्रमिक क्रियाएँ जानबूझकर सुरक्षित हैं, भले हिंदी में उनमें हल्की पुनरुक्ति सुनाई दे।
