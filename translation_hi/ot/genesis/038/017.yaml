  naturalness: The dialogue is clear and appropriately concise. ‘कोई बंधक’ is a more precise, natural formal term in this commercial context than ‘कोई जमानत.’
  terminology: ‘बंधक’ denotes something given as security pending fulfillment and is suitable for עֵרָבוֹן. The footnote should distinguish nearby alternatives without treating the legal-bail sense of ‘जमानत’ as the primary meaning.
