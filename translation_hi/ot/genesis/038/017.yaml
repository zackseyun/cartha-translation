    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִי עִזִּים
  choice: बकरी का एक बच्चा
  rationale: यह पदबंध बकरियों के एक बच्चे को सूचित करता है। यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: מִן הַצֹּאן
  choice: झुंड में से
  rationale: צֹאן भेड़-बकरियों जैसे छोटे पालतू पशुओं के झुंड को दर्शाता है; पशु पहले ही बकरी के बच्चे के रूप में निर्दिष्ट है, इसलिए ‘झुंड में से’ स्वाभाविक है।
- source_word: עֵרָבוֹן
  choice: जमानत
  rationale: यह किसी भावी वचन-पूर्ति की गारंटी के रूप में दी गई वस्तु को दर्शाता है। ‘जमानत’ सामान्य हिन्दी में इस अर्थ को स्पष्ट रूप से व्यक्त करती है।
- source_word: עַד שָׁלְחֶךָ
  choice: उसे भेजने तक
  rationale: शाब्दिक अर्थ ‘तुम्हारे भेजने तक’ है; सन्दर्भ से कर्म बकरी का बच्चा है, जिसे हिन्दी में ‘उसे’ द्वारा स्वाभाविक रूप से स्पष्ट किया गया है।
- source_word: אִם תִּתֵּן
  choice: यदि ... दे दो
  rationale: यह तामार की शर्त को प्रत्यक्ष संवाद में सहज आधुनिक हिन्दी के रूप में व्यक्त करता है।
- source_word: אָנֹכִי אֲשַׁלַּח
  choice: मैं ... भेज दूँगा
  rationale: स्वतंत्र सर्वनाम के बल और भविष्य के आश्वासन को ‘मैं’ तथा पूर्णता-सूचक ‘दूँगा’ सहज रूप में व्यक्त करते हैं।
