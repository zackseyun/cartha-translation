  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वेश्या’ स्रोत-पद का सीधा और सामान्य हिन्दी समतुल्य है; पुराने या आधुनिक समाजशास्त्रीय अर्थ जोड़ने वाले विकल्पों से बचा गया है।
