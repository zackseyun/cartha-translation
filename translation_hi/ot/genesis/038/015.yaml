base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/015.yaml
  text: When Judah saw her[a], he thought she was a prostitute, because she had covered her face.
translation:
  language: hi
  text: जब यहूदा ने उसे देखा, तो उसने उसे वेश्या समझा[a], क्योंकि उसने अपना चेहरा ढक रखा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उसे वेश्या माना।”
    reason: חשב के इस प्रयोग को ‘समझना’ अथवा ‘मानना’ दोनों रूपों में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וַיִּרְאֶהָ
  choice: जब यहूदा ने उसे देखा
  rationale: ראה का अर्थ ‘देखना’ है। ‘जब ... देखा’ वाव-क्रमिक क्रियाओं के बीच समय-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּחְשְׁבֶהָ
  choice: उसने उसे ... समझा
  rationale: חשב यहाँ तामार की पहचान के विषय में यहूदा के मानसिक निष्कर्ष को व्यक्त करता है। ‘समझा’ आधुनिक हिन्दी में स्वाभाविक है और उसके गलत अनुमान को ठीक प्रकार से दर्शाता है।
- source_word: לְזוֹנָה
  choice: वेश्या
  rationale: זוֹנָה का अर्थ वेश्यावृत्ति करने वाली स्त्री है। ‘वेश्या’ स्पष्ट, प्रचलित और स्रोत के अर्थ के निकट है।
- source_word: כִּי
  choice: क्योंकि
  rationale: כִּי यहूदा के निष्कर्ष का कारण प्रस्तुत करता है; इसलिए स्पष्ट कारणसूचक ‘क्योंकि’ उपयुक्त है।
- source_word: כִסְּתָה פָּנֶיהָ
  choice: उसने अपना चेहरा ढक रखा था
  rationale: כסה ‘ढकना’ और פניה ‘उसका चेहरा’ है। ‘ढक रखा था’ उस पहले से विद्यमान स्थिति को व्यक्त करता है जिसके कारण यहूदा ने यह निष्कर्ष निकाला।
theological_decisions: []
