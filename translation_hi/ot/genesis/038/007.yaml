base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/007.yaml
  text: Er[a], Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
translation:
  language: hi
  text: यहूदा का पहलौठा पुत्र एर याहवे की दृष्टि में दुष्ट था, और याहवे ने उसे मार डाला।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “और याहवे ने उसकी मृत्यु कराई।”
    reason: कारक क्रिया का अधिक रूपात्मक विकल्प।
lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; हिन्दी वाक्य में भूतकालीन ‘था’ पर्याप्त और स्वाभाविक है, इसलिए कोई कृत्रिम आरम्भिक ‘अब’ या ‘तब’ नहीं जोड़ा गया।
- source_word: עֵר
  choice: एर
  rationale: व्यक्तिनाम को आधुनिक हिन्दी देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּכוֹר יְהוּדָה
  choice: यहूदा का पहलौठा
  rationale: सम्बन्धवाचक रचना और जन्मक्रम दोनों को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רַע
  choice: दुष्ट
  rationale: यहाँ शब्द याहवे के नैतिक मूल्यांकन को बताता है; ‘दुष्ट’ साधारण ‘बुरा’ की तुलना में इस नैतिक गम्भीरता को अधिक स्पष्ट रखता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में
  rationale: इब्रानी मुहावरे का अर्थ याहवे के मूल्यांकन में है; ‘दृष्टि में’ हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: וַיְמִתֵהוּ
  choice: उसे मार डाला
  rationale: מות के हिफ़ील रूप की कारकता और याहवे की प्रत्यक्ष दैवी क्रिया को स्पष्ट, गम्भीर और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: एर की मृत्यु में दैवी कर्तृत्व
  choice: याहवे ने उसे मार डाला
  alternative: याहवे ने उसकी मृत्यु कर दी
  rationale: इब्रानी कारक क्रिया एर की मृत्यु को स्पष्ट रूप से याहवे की क्रिया ठहराती है। मुख्य पाठ इसे नरम नहीं करता और मृत्यु के साधन के विषय में कुछ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पहलौठा’ बाइबलीय पारिवारिक पद के रूप में व्यापक रूप से समझा जाता है। पादटिप्पणी-चिह्न उस क्रिया के बाद रखा गया है जिससे उसका सम्बन्ध है।
