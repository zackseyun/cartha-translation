lexical_decisions:
- source_word: וַיִּפֹּל עַל
  choice: से लिपटकर
  rationale: शाब्दिक अर्थ ‘पर गिर पड़ा’ है, पर गले के साथ यह इब्रानी मुहावरा आलिंगन को व्यक्त करता है। आधुनिक हिन्दी में ‘गले से लिपटकर’ दृश्य और भाव दोनों को स्वाभाविक रूप से संप्रेषित करता है।
- source_word: צַוְּארֵי / צַוָּארָיו
  choice: गले / उसके गले
  rationale: पहला रूप व्याकरणिक रूप से बहुवचन-सदृश है, किंतु इस मुहावरे में गर्दन के क्षेत्र को सूचित करता है। हिन्दी में ‘गले’ कहना स्वाभाविक है और आलिंगन का आशय स्पष्ट रखता है।
- source_word: בִנְיָמִן
  choice: बिन्यामीन
  rationale: मूल इब्रानी नाम के निकट प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: אָחִיו
  choice: अपने भाई
  rationale: इब्रानी में स्पष्ट पारिवारिक संबंध को बनाए रखते हुए हिन्दी में कर्ता योसेफ़ की ओर संकेत करने के लिए ‘अपने’ स्वाभाविक है।
- source_word: וַיֵּבְךְּ / בָּכָה
  choice: रोया
  rationale: בכה का सामान्य अर्थ रोना है। ‘रोया’ आधुनिक हिन्दी में सहज, गरिमापूर्ण और दोनों क्रियाओं के लिए सुसंगत है।
- source_word: וּבִנְיָמִן
  choice: और बिन्यामीन भी
  rationale: वाव समन्वय प्रकट करता है; हिन्दी में ‘भी’ पारस्परिक क्रिया को स्वाभाविक बनाता है, बिना कथ्य में कोई नया धर्मवैज्ञानिक बल जोड़े।
