- source_word: עֲגָלוֹת
  choice: गाड़ियाँ
  rationale: यह लोगों और सामान को ले जाने वाले पहिएदार वाहनों के लिए सरल और व्यापक आधुनिक हिन्दी शब्द है; ‘बैलगाड़ियाँ’ कहना मूल से अधिक विशिष्ट होता।
- source_word: עַל פִּי פַרְעֹה
  choice: फ़िरौन की आज्ञा के अनुसार
  rationale: शाब्दिक रूप से ‘फ़िरौन के मुँह के अनुसार’ एक इब्रानी मुहावरा है, जिसका अर्थ उसकी आज्ञा या आदेश के अनुसार है।
- source_word: צֵדָה
  choice: भोजन-सामग्री
  rationale: यह यात्रा के लिए रखी गई रसद को दर्शाता है। ‘भोजन-सामग्री’ सामान्य पाठक के लिए ‘रसद’ से अधिक सहज है और संदर्भ में आवश्यक खाद्य प्रबंध को व्यक्त करता है।
- source_word: לַדָּרֶךְ
  choice: यात्रा के लिए
  rationale: संदर्भ में इसका आशय मार्ग पर उपयोग हेतु दी गई सामग्री से है; ‘यात्रा के लिए’ स्वाभाविक हिन्दी है।
