  text: And the sons of Israel did so[a], and Joseph gave them wagons according to Pharaoh’s command, and he gave them provisions for the journey.
translation:
  language: hi
  text: इस्राएल के पुत्रों ने वैसा ही किया। यूसुफ ने फ़िरौन की आज्ञा के अनुसार[a] उन्हें गाड़ियाँ दीं और यात्रा के लिए आवश्यक सामग्री दी।
  philosophy: optimal-equivalence
  footnotes:
