    text: इब्रानी में शाब्दिक रूप से, ‘फ़िरौन के मुँह के अनुसार’; यह एक मुहावरा है जिसका अर्थ है, ‘फ़िरौन की आज्ञा के अनुसार।’
    reason: lexical_alternative
lexical_decisions:
