- from: वहाँ मैं तुम्हारा भरण-पोषण करूँगा, क्योंकि अकाल के अभी पाँच वर्ष और बाकी हैं; कहीं ऐसा न हो कि तुम, तुम्हारा घराना और तुम्हारा सब कुछ दरिद्र हो जाए।
  to: वहाँ मैं तुम्हारा भरण-पोषण करूँगा, क्योंकि अकाल के अभी पाँच वर्ष और बाकी हैं; कहीं ऐसा न हो कि तुम अपने घराने और अपनी सारी संपत्ति समेत दरिद्र हो जाओ।
