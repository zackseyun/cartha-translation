review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys Joseph’s promise to provide sustenance in Goshen, the remaining five years of famine, and the feared outcome of destitution. The revision retains the Hebrew’s inclusive scope: Joseph, his household, and all his possessions.'
  naturalness: The final coordinated phrase in the draft ("तुम, तुम्हारा घराना और तुम्हारा सब कुछ दरिद्र हो जाए") has awkward singular agreement and makes possessions themselves sound personally impoverished. Recasting it with "समेत" is natural modern Hindi while preserving the inclusive sense.
  terminology: “भरण-पोषण करूँगा” appropriately renders וְכִלְכַּלְתִּי in this context. “अकाल,” “घराना,” and “दरिद्र” fit the dignified narrative register. “सारी संपत्ति” naturally expresses “all that belongs to you.”
  issues:
  - severity: low
    issue: Awkward agreement and predication in the final warning clause
    rationale: With the coordinated expression “तुम, तुम्हारा घराना और तुम्हारा सब कुछ,” singular “हो जाए” is grammatically awkward; additionally, “सब कुछ” being “दरिद्र” is less idiomatic in Hindi. The Hebrew’s inclusive enumeration can be expressed naturally by making Joseph’s addressees destitute together with their household and possessions.
  revised_text: वहाँ मैं तुम्हारा भरण-पोषण करूँगा, क्योंकि अकाल के अभी पाँच वर्ष और बाकी हैं; कहीं ऐसा न हो कि तुम अपने घराने और अपनी सारी संपत्ति समेत दरिद्र हो जाओ।
  revised_footnotes: []
  revision_rationale: A limited idiomatic revision resolves the Hindi agreement problem in the final clause. It preserves the source’s warning that Joseph, his household, and everything belonging to him would otherwise be reduced to destitution.
