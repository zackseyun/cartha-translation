  text: וְ/כִלְכַּלְתִּ֤י אֹֽתְ/ךָ֙ שָׁ֔ם כִּי ע֛וֹד חָמֵ֥שׁ שָׁנִ֖ים רָעָ֑ב פֶּן תִּוָּרֵ֛שׁ אַתָּ֥ה וּ/בֵֽיתְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/011.yaml
  text: There I will provide for you, because there are still five years of famine, lest you and your household and all that belongs to you become destitute.
translation:
  language: hi
  text: वहाँ मैं तुम्हारा भरण-पोषण करूँगा, क्योंकि अकाल के अभी पाँच वर्ष और बाकी हैं; कहीं ऐसा न हो कि तुम अपने घराने और अपनी सारी संपत्ति समेत दरिद्र हो जाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִלְכַּלְתִּי
  choice: मैं ... भरण-पोषण करूँगा
  rationale: पिएल क्रिया यहाँ आवश्यक भोजन और साधन उपलब्ध कराने का भाव रखती है; ‘भरण-पोषण’ इसे स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: כִּי עוֹד חָמֵשׁ שָׁנִים רָעָב
  choice: क्योंकि अकाल के अभी पाँच वर्ष और बाकी हैं
  rationale: כִּי का कारणसूचक अर्थ और עוֹד का शेष अवधि का भाव स्पष्ट रखते हुए हिन्दी वाक्य-विन्यास अपनाया गया है।
- source_word: פֶּן תִּוָּרֵשׁ
  choice: कहीं ऐसा न हो कि ... दरिद्र हो जाए
  rationale: פֶּן चेतावनी अथवा आशंकित परिणाम बताता है। תִּוָּרֵשׁ का अर्थ यहाँ निर्धन या साधनहीन हो जाना है; ‘दरिद्र हो जाए’ इस तीव्रता को बनाए रखता है।
- source_word: וְכָל־אֲשֶׁר־לָךְ
  choice: और तुम्हारा सब कुछ
  rationale: इब्रानी का व्यापक अर्थ—जो कुछ तुम्हारा है—संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित है।
