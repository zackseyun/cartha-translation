source:
  edition: WLC
  text: וְ/לֹֽא יָכֹ֨ל יוֹסֵ֜ף לְ/הִתְאַפֵּ֗ק לְ/כֹ֤ל הַ/נִּצָּבִים֙ עָלָ֔י/ו וַ/יִּקְרָ֕א הוֹצִ֥יאוּ כָל אִ֖ישׁ מֵ/עָלָ֑/י וְ/לֹא עָ֤מַד אִישׁ֙ אִתּ֔/וֹ בְּ/הִתְוַדַּ֥ע יוֹסֵ֖ף אֶל אֶחָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/001.yaml
  text: Then Joseph could no longer restrain himself before all those standing by him[a], and he cried out[c][b], “Have everyone go out from me!” And no one remained with him when Joseph made himself known to his brothers.
translation:
  language: hi
  text: तब यूसुफ अपने पास खड़े सभी लोगों के सामने[a] अपने आप को और न रोक सका। उसने पुकारकर कहा, “सबको मेरे सामने से बाहर कर दो!” जब यूसुफ ने अपने भाइयों को अपने को प्रकट किया, तब कोई भी उसके साथ वहाँ नहीं रहा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “उन सबके सामने जो उसके पास खड़े थे।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “कोई व्यक्ति उसके साथ खड़ा नहीं रहा,” अर्थात् वहाँ कोई और उपस्थित नहीं रहा।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכֹל ... לְהִתְאַפֵּק
  choice: अपने आप को और न रोक सका
  rationale: नकार के साथ क्षमता-सूचक क्रिया और आत्मवाचक रूप मिलकर स्वयं को रोक न पाने का भाव देते हैं। ‘और न रोक सका’ प्रसंग में संचित भावनाओं के टूटने को स्वाभाविक हिन्दी में व्यक्त करता है, पर भावना का प्रकार अलग से नहीं जोड़ता।
- source_word: לְכֹל הַנִּצָּבִים עָלָיו
  choice: अपने पास खड़े सभी लोगों के सामने
  rationale: निष्पन्न कृदन्त उन लोगों को दर्शाता है जो यूसुफ के निकट उपस्थित या तैनात थे। ‘सामने’ यहाँ उपस्थिति का सम्बन्ध व्यक्त करता है; ‘सेवक’ कहना अनावश्यक व्याख्या होती।
- source_word: וַיִּקְרָא
  choice: उसने पुकारकर कहा
  rationale: क्रिया ऊँची आवाज़ में पुकारने का अर्थ देती है। हिन्दी में उद्धृत आदेश को स्वाभाविक रूप से जोड़ने के लिए ‘पुकारकर कहा’ चुना गया है।
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלָי
  choice: सब लोगों को मेरे पास से बाहर भेज दो
  rationale: बहुवचन प्रेरणार्थक आज्ञा उपस्थित लोगों से प्रत्येक अन्य व्यक्ति को बाहर करने को कहती है। ‘सब लोगों’ से כָל אִישׁ का वितरणात्मक अर्थ स्वाभाविक हिन्दी में आता है।
- source_word: וְלֹא עָמַד אִישׁ אִתּוֹ
  choice: कोई भी उसके साथ वहाँ नहीं रहा
  rationale: शाब्दिक ‘कोई व्यक्ति उसके साथ खड़ा नहीं रहा’ प्रसंग में किसी के उपस्थित न रहने का मुहावरा है। मुख्य पाठ में अर्थ-स्पष्ट हिन्दी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: בְּהִתְוַדַּע יוֹסֵף אֶל אֶחָיו
  choice: जब यूसुफ ने अपने भाइयों के सामने अपने को प्रकट किया
  rationale: ידע का हित्पएल रूप यहाँ स्वयं को ज्ञात या प्रकट करने का अर्थ देता है। यह अनुवाद आत्मवाचकता बनाए रखता है और केवल ‘परिचय दिया’ की अपेक्षा दृश्य की गंभीरता को बेहतर ढंग से व्यक्त करता है।
