base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/003.yaml
  text: Then Joseph said to his brothers[a], “I am Joseph. Is my father still alive?” But his brothers could not answer him[b], because they were dismayed at his presence.
translation:
  language: hi
  text: तब यूसुफ ने अपने भाइयों से कहा, “मैं यूसुफ हूँ। क्या मेरे पिता अब भी जीवित हैं?” पर उसके भाई उसे उत्तर न दे सके, क्योंकि वे उसके सामने घबरा गए थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्योंकि वे उसके सामने भयभीत हो गए थे” अथवा “क्योंकि वे उसके सामने व्याकुल हो गए थे।” इब्रानी पद अचानक घबराहट, भय या व्याकुलता व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל אֶחָיו
  choice: अपने भाइयों से
  rationale: सन्दर्भ में ये यूसुफ के सगे भाई हैं; हिन्दी में वक्ता के कर्ता से सम्बन्ध स्पष्ट करने के लिए “अपने” स्वाभाविक है।
- source_word: אֲנִי יוֹסֵף
  choice: मैं यूसुफ हूँ
  rationale: यूसुफ की स्पष्ट आत्म-पहचान को सीधे और प्रचलित हिन्दी नाम-रूप के साथ रखा गया है।
- source_word: הַעוֹד אָבִי חָי
  choice: क्या मेरे पिता अब भी जीवित हैं?
  rationale: הַעוֹד किसी अवस्था के अब तक बने रहने का प्रश्न करता है; “अब भी” इसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: וְלֹא יָכְלוּ ... לַעֲנוֹת אֹתוֹ
  choice: पर ... उसे उत्तर न दे सके
  rationale: יכל की असमर्थता को “न दे सके” व्यक्त करता है, और “पर” रहस्योद्घाटन के बाद आए विरोधात्मक मोड़ को स्पष्ट करता है।
- source_word: נִבְהֲלוּ
  choice: घबरा गए थे
  rationale: निफ़अल रूप अचानक व्याकुल, भयभीत या स्तब्ध हो जाने का भाव रखता है। “घबरा गए” तीव्र प्रतिक्रिया को व्यक्त करता है, पर केवल आतंक का अर्थ थोपता नहीं।
- source_word: מִפָּנָיו
  choice: उसकी उपस्थिति से
  rationale: शाब्दिक अर्थ “उसके मुख/सामने से” है; यहाँ यह उसके सामने उपस्थित होने से उत्पन्न प्रतिक्रिया दर्शाता है।
