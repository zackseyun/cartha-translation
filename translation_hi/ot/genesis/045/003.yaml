  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। “पिता” तथा “जीवित” जैसे औपचारिक किन्तु सामान्य शब्द रखे गए हैं; नִבְהֲלוּ की अर्थ-सीमा को मुख्य पाठ और पादटिप्पणी में बिना अनावश्यक रूप से तीव्र किए सुरक्षित रखा गया है।
