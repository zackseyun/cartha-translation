  text: And he kissed all his brothers and wept over them. After that[a], his brothers spoke with him.
translation:
  language: hi
  text: तब उसने अपने सभी भाइयों को चूमा और उन सब पर रोया। इसके बाद उसके भाइयों ने उससे बातचीत की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְנַשֵּׁק
  choice: चूमा
  rationale: पिएल रूप यहाँ स्नेह और मेल-मिलाप के चुंबन को व्यक्त करता है; हिन्दी में ‘चूमा’ स्वाभाविक है और अनिश्चित पुनरावृत्ति को अनावश्यक रूप से नहीं जोड़ता।
- source_word: לְכָל אֶחָיו
  choice: अपने सब भाइयों को
  rationale: כָּל बहुवचन के साथ यूसुफ के भाइयों की समग्रता बताता है; ‘अपने सब भाइयों’ से संबंध और पूर्णता दोनों स्पष्ट होते हैं।
- source_word: וַיֵּבְךְּ עֲלֵיהֶם
  choice: उनसे लिपटकर रोया
  rationale: शाब्दिक ‘उन पर रोया’ आधुनिक हिन्दी में अस्वाभाविक है। प्रसंग में עַל शारीरिक निकटता का संकेत देता है, इसलिए ‘उनसे लिपटकर रोया’ दृश्य का स्वाभाविक संप्रेषण करता है।
- source_word: וְאַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह पदबंध घटनाओं का कालानुक्रमिक क्रम दर्शाता है; ‘इसके बाद’ स्पष्ट और वर्तमान हिन्दी में सहज है।
- source_word: דִּבְּרוּ אֶחָיו אִתּוֹ
  choice: उसके भाइयों ने उससे बातचीत की
  rationale: דבר के साथ אֵת पारस्परिक संवाद का बोध करा सकता है। ‘बातचीत की’ मेल-मिलाप के बाद हुए संवाद को स्वाभाविक हिन्दी में व्यक्त करता है।
