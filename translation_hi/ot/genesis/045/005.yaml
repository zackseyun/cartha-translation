language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אַל תֵּעָ֣צְב֗וּ וְ/אַל יִ֨חַר֙ בְּ/עֵ֣ינֵי/כֶ֔ם כִּֽי מְכַרְתֶּ֥ם אֹתִ֖/י הֵ֑נָּה כִּ֣י לְ/מִֽחְיָ֔ה שְׁלָחַ֥/נִי אֱלֹהִ֖ים לִ/פְנֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
translation:
  language: hi
  text: और अब, तुम दुखी न हो[a] और इस बात पर अपने आप पर क्रोधित न हो[b] कि तुमने मुझे यहाँ बेच दिया, क्योंकि जीवन बचाने के लिए[c] परमेश्वर ने मुझे तुमसे पहले भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शोक न करो।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘तुम्हारी आँखों में न जले’; यह क्रोधित या अप्रसन्न होने का मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘जीवन के संरक्षण के लिए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक ו और कालसूचक עַתָּה दोनों को रखते हुए यूसुफ की वर्तमान अपील का स्वाभाविक आरंभ करता है।
- source_word: אַל תֵּעָצְבוּ
  choice: तुम दुखी न हो
  rationale: עצב यहाँ मानसिक पीड़ा या शोक व्यक्त करता है; यह आधुनिक हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: וְאַל יִחַר בְּעֵינֵיכֶם
  choice: अपने आप से क्रोधित न हो
  rationale: शाब्दिक मुहावरा ‘तुम्हारी आँखों में न जले’ क्रोध या अप्रसन्नता का संकेत है; प्रसंग में भाइयों का स्वयं पर क्रोध अभिप्रेत है।
- source_word: כִּי מְכַרְתֶּם אֹתִי הֵנָּה
  choice: कि तुमने मुझे यहाँ बेच दिया
  rationale: पहला כִּי निषेध के कारण/विषय को प्रस्तुत करता है और הֵנָּה का स्थानसूचक अर्थ ‘यहाँ’ से स्पष्ट रहता है।
- source_word: לְמִחְיָה
  choice: जीवन बचाने के लिए
  rationale: מִחְיָה जीवन के संरक्षण या जीवित बने रहने को सूचित करता है; उद्देश्यवाचक हिन्दी मूल बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: שְׁלָחַנִי אֱלֹהִים
  choice: परमेश्वर ने मुझे भेजा है
  rationale: हिब्रू पूर्ण क्रिया पूर्व में घटित और वर्तमान स्थिति में प्रभावी कार्य को बताती है; हिन्दी का पूर्ण वर्तमान यहाँ सहज है और परमेश्वर की सक्रिय भूमिका बनाए रखता है।
- source_word: לִפְנֵיכֶם
  choice: तुमसे आगे
  rationale: यह भाइयों के आने से पहले भेजे जाने की कालगत और स्थानगत प्राथमिकता दोनों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय विधान और मानवीय उत्तरदायित्व
  choice: ‘तुमने मुझे यहाँ बेच दिया’ और ‘परमेश्वर ने मुझे...भेजा है’—दोनों कथनों को स्पष्ट और साथ-साथ रखा गया है।
  alternative: भाइयों के कार्य को नरम करके कहना कि उन्होंने यूसुफ को केवल ‘दूर भेजा’, या परमेश्वर की भूमिका को मात्र अनुमति तक सीमित करना।
  rationale: हिब्रू पाठ मानवीय दोषपूर्ण कार्य और परमेश्वर के जीवनरक्षक उद्देश्य को बिना उनका तनाव मिटाए आमने-सामने रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में बहुवचन ‘तुम’ प्रसंगानुकूल और सुबोध है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है।
