review_pass:
  verdict: revise
  source_fidelity: The draft preserves the key juxtaposition of the brothers' act ('you sold me') and God's purposeful action. However, the Hindi perfect-present 'भेजा है' is less direct than the Hebrew narrative perfect here; simple past 'भेजा' better represents Joseph's statement. 'तुमसे पहले' also makes the temporal force of לִפְנֵיכֶם clearer.
  naturalness: ‘अपने आप से क्रोधित’ is understandable but not idiomatic modern standard Hindi. ‘अपने आप पर क्रोधित’ is the natural construction. A comma after ‘और अब’ improves the discourse opening.
  terminology: ‘परमेश्वर’ is an appropriate established rendering of אֱלֹהִים in this context. ‘जीवन बचाने के लिए’ faithfully conveys לְמִחְיָה without narrowing its life-preserving scope.
  issues:
  - severity: medium
    issue: Verb form in ‘परमेश्वर ने मुझे तुमसे आगे भेजा है’
    rationale: The Hebrew שְׁלָחַנִי is a perfect in narrative discourse. ‘परमेश्वर ने मुझे ... भेजा’ is the more faithful and idiomatic Hindi past rendering in this context.
  - severity: low
    issue: Postposition in ‘अपने आप से क्रोधित’
    rationale: For anger directed at oneself, modern Hindi idiom uses ‘अपने आप पर क्रोधित,’ not ‘अपने आप से क्रोधित.’
  - severity: low
    issue: Rendering of לִפְנֵיכֶם
    rationale: ‘तुमसे पहले’ directly conveys the primary temporal sense, that Joseph was sent in advance of the brothers.
