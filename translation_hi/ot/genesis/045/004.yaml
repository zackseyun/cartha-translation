  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूसुफ के विनम्र बुलावे, भाइयों के निकट आने और फिर उसकी सीधी आत्म-पहचान का क्रम सुरक्षित है। कोई सम्प्रदायगत व्याख्या नहीं जोड़ी गई।
