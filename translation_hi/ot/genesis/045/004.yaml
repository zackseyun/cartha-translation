  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יוֹסֵ֧ף אֶל אֶחָ֛י/ו גְּשׁוּ נָ֥א אֵלַ֖/י וַ/יִּגָּ֑שׁוּ וַ/יֹּ֗אמֶר אֲנִי֙ יוֹסֵ֣ף אֲחִי/כֶ֔ם אֲשֶׁר מְכַרְתֶּ֥ם אֹתִ֖/י מִצְרָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/004.yaml
  text: Then Joseph said to his brothers, “Please come near to me.” And they came near. Then he said, “I am Joseph, your brother, whom you sold into Egypt.”
translation:
  language: hi
  text: तब यूसुफ ने अपने भाइयों से कहा, “कृपया मेरे पास आओ।” वे उसके पास आए। तब उसने कहा, “मैं तुम्हारा भाई यूसुफ हूँ, जिसे तुमने मिस्र में बेच दिया था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम की क्रमिकता स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל־אֶחָיו
  choice: अपने भाइयों से
  rationale: बहुवचन אָח और तृतीय पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘उसके भाई’ है; हिन्दी में कर्ता यूसुफ होने के कारण ‘अपने भाइयों’ स्वाभाविक है।
- source_word: גְּשׁוּ נָא אֵלַי
  choice: कृपया मेरे पास आओ
  rationale: נגשׁ निकट आने को और נָא विनम्र अनुरोध को व्यक्त करता है। ‘मेरे पास आओ’ सहज आधुनिक हिन्दी है और तुलनात्मक ‘और पास’ नहीं जोड़ता।
- source_word: וַיִּגָּשׁוּ
  choice: वे उसके पास आए
  rationale: आदेश और उसके प्रत्युत्तर में प्रयुक्त उसी इब्रानी धातु की पुनरावृत्ति को ‘पास आए’ द्वारा बनाए रखा गया है। दृष्टिकोण स्पष्ट रखने के लिए ‘उसके’ प्रयुक्त है।
- source_word: אֲנִי יוֹסֵף
  choice: मैं ... यूसुफ हूँ
  rationale: क्रियारहित इब्रानी वाक्य हिन्दी में ‘हूँ’ के साथ स्वाभाविक रूप से व्यक्त होता है; ‘यूसुफ’ प्रचलित हिन्दी बाइबलीय नाम है।
- source_word: אֲחִיכֶם
  choice: तुम्हारा भाई
  rationale: एकवचन संज्ञा और द्वितीय पुरुष बहुवचन प्रत्यय यूसुफ का उन सबके भाई होना बताते हैं।
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתִי
  choice: जिसे तुमने ... बेच दिया था
  rationale: सम्बन्धवाचक उपवाक्य का व्यक्तिगत और आरोपात्मक बल सुरक्षित है। ‘बेच दिया था’ पूर्व में पूरी हुई घटना को सहज हिन्दी में व्यक्त करता है।
- source_word: מִצְרָיְמָה
  choice: मिस्र में
  rationale: दिशासूचक ה मिस्र की ओर/मिस्र तक गमन दर्शाता है। बेचने की हिन्दी अभिव्यक्ति में ‘मिस्र में बेच दिया’ गन्तव्य का स्वाभाविक अर्थ देती है; ‘मिस्र को’ अनर्थक हो सकता है।
