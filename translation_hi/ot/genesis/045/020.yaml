  language: hi
  text: और अपनी वस्तुओं की चिंता मत करना,[a] क्योंकि मिस्र देश का सारा उत्तम धन तुम्हारा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “तुम्हारी आँख तुम्हारी वस्तुओं पर तरस न खाए”; अर्थात् उनके लिए मोह या खेद मत करना।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵינְכֶם אַל־תָּחֹס
  choice: और ... चिंता मत करना
  rationale: शाब्दिक रूप से यह ‘तुम्हारी आँख ... तरस न खाए’ है। यहाँ ‘आँख’ और חוס का मुहावरा पीछे छूटने वाली वस्तुओं के लिए मोह, खेद या चिंता न करने का भाव देता है; स्वाभाविक आधुनिक हिन्दी में ‘चिंता मत करना’ संदर्भगत अर्थ स्पष्ट करता है।
- source_word: עַל־כְּלֵיכֶם
  choice: अपनी वस्तुओं की
  rationale: כְּלִי का अर्थ पात्र, सामान, उपकरण या वस्तुएँ हो सकता है। परिवार के मिस्र जाने के संदर्भ में ‘वस्तुएँ’ व्यापक और सहज है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसका स्वाभाविक संबंधसूचक है।
- source_word: טוּב כָּל־אֶרֶץ מִצְרַיִם
  choice: मिस्र देश की सारी उत्तम वस्तुएँ
  rationale: טוּב यहाँ अमूर्त भलाई के बजाय देश की अच्छी या उत्तम उपज और संपदा को सूचित करता है। ‘सारी उत्तम वस्तुएँ’ हिब्रू की सामूहिक अभिव्यक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָכֶם הוּא
  choice: तुम्हारी हैं
  rationale: लामेद-युक्त सर्वनाम और הוּא अधिकार तथा आश्वासन व्यक्त करते हैं; हिन्दी में ‘तुम्हारी हैं’ सीधा और स्वाभाविक है।
