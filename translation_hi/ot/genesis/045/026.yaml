  text: וַ/יַּגִּ֨דוּ ל֜/וֹ לֵ/אמֹ֗ר ע֚וֹד יוֹסֵ֣ף חַ֔י וְ/כִֽי ה֥וּא מֹשֵׁ֖ל בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם וַ/יָּ֣פָג לִבּ֔/וֹ כִּ֥י לֹא הֶאֱמִ֖ין לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/026.yaml
  text: They told him[a], saying, “Joseph is still alive, and he is ruler over all the land of Egypt.” But his heart went numb, for he did not believe them.
translation:
  language: hi
  text: उन्होंने उससे कहा, “यूसुफ अब भी जीवित है, और वह सारे मिस्र देश पर शासन करता है।” यह सुनकर उसका हृदय सुन्न पड़ गया[a], क्योंकि उसने उनकी बात पर विश्वास नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका हृदय बैठ गया” अथवा “उसका हृदय शिथिल पड़ गया।” इब्रानी मुहावरा यह बताता है कि यह समाचार सुनकर याकूब भीतर से स्तब्ध और निर्बल हो गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: उन्होंने उससे कहा
  rationale: यह इब्रानी सूचना देने और प्रत्यक्ष कथन आरम्भ करने की शैली को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עוֹד יוֹסֵף חַי
  choice: यूसुफ अब भी जीवित है
  rationale: עוֹד यहाँ यूसुफ के लगातार जीवित होने की अवस्था बताता है; “अब भी” इस आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְכִי הוּא מֹשֵׁל
  choice: और वह … शासन करता है
  rationale: מֹשֵׁל शासन करने वाले व्यक्ति या शासन करने की क्रिया को दर्शाता है। क्रियात्मक अनुवाद किसी विशिष्ट मिस्री पदनाम को आरोपित किए बिना उसके व्यापक अधिकार को व्यक्त करता है।
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: सारे मिस्र देश पर
  rationale: מֹשֵׁל के साथ בְּ शासन के क्षेत्र को सूचित करता है; हिन्दी में “पर” अधिकार के इस सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיָּפָג לִבּוֹ
  choice: उसका हृदय सुन्न पड़ गया
  rationale: פוג के दुर्लभ प्रयोग में शिथिल, चेतनाशून्य या स्तब्ध पड़ने का भाव है। यह अनुवाद मूल के हृदय-वाले रूपक और याकूब की स्तब्ध आन्तरिक प्रतिक्रिया—दोनों को बनाए रखता है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: כִּי לֹא הֶאֱמִין לָהֶם
  choice: क्योंकि उसने उनकी बात पर विश्वास नहीं किया
  rationale: כִּי प्रतिक्रिया का कारण बताता है। हिन्दी में “उनकी बात पर विश्वास” स्रोत के “उन पर विश्वास नहीं किया” का प्रसंगानुकूल और स्वाभाविक रूप है।
