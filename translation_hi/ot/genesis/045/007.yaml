  text: וַ/יִּשְׁלָחֵ֤/נִי אֱלֹהִים֙ לִ/פְנֵי/כֶ֔ם לָ/שׂ֥וּם לָ/כֶ֛ם שְׁאֵרִ֖ית בָּ/אָ֑רֶץ וּ/לְ/הַחֲי֣וֹת לָ/כֶ֔ם לִ/פְלֵיטָ֖ה גְּדֹלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/007.yaml
  text: And God sent me ahead of you to preserve for you a remnant in the land[b][a], and to keep you alive by a great deliverance.
translation:
  language: hi
  text: और परमेश्वर ने मुझे तुमसे पहले भेजा, ताकि देश में तुम्हारे लिए एक शेष बना रहे[a] और बड़े छुटकारे के लिए तुम्हें जीवित रखे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि देश में तुम्हारे लिए जीवित बचे लोग/वंशज बने रहें।” हिब्रू शब्द का अर्थ ‘शेष’, ‘जीवित बचे लोग’ या ‘वंशज’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “ताकि बड़े पैमाने पर लोग जीवित बचें,” अथवा “बड़े बच निकलने के लिए।” हिब्रू पदबंध बचाए जाने की घटना अथवा उसके फलस्वरूप बचे लोगों पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵנִי
  choice: ने मुझे भेजा
  rationale: वय्यिक्तोल कथा में बीती घटना को आगे बढ़ाता है; हिन्दी में सामान्य भूतकाल स्वाभाविक है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ शब्द एकमात्र परमेश्वर के लिए है; आधुनिक हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ स्पष्ट और गरिमापूर्ण है।
- source_word: לִפְנֵיכֶם
  choice: तुमसे पहले
  rationale: शाब्दिक अर्थ ‘तुम्हारे आगे/सामने’ है, पर प्रसंग में मिस्र पहले भेजे जाने की कालगत प्राथमिकता अभिप्रेत है।
- source_word: לָשׂוּם לָכֶם שְׁאֵרִית
  choice: तुम्हारे लिए बचे हुओं को बनाए रखे
  rationale: שׂום का मूल अर्थ रखना/स्थापित करना है और שְׁאֵרִית बचे हुए लोगों को दर्शा सकता है। यह संयोजन संरक्षण का आशय स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁאֵרִית
  choice: बचे हुए
  rationale: यह ‘जो शेष बचा है’, ‘जीवित बचे लोग’ या ‘वंशज’ को सूचित कर सकता है। ‘बचे हुए’ मूल की व्यापकता और व्यक्ति-संदर्भ दोनों बनाए रखता है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: अकाल और मिस्र के स्थानीय प्रसंग में אֶרֶץ का अर्थ ‘देश/भूमि’ है, न कि व्यापक ‘पृथ्वी’।
- source_word: וּלְהַחֲיוֹת לָכֶם
  choice: तुम्हें जीवित रखे
  rationale: חיה का हिफ़ील रूप जीवन बचाए रखने या जीवित रखने का कारक अर्थ देता है।
- source_word: לִפְלֵיטָה גְּדֹלָה
  choice: एक महान छुटकारे के द्वारा
  rationale: פְּלֵיטָה छुटकारे/बच निकलने अथवा बचे हुए लोगों को दर्शा सकता है। मुख्य पाठ में ‘महान छुटकारा’ बड़े पैमाने के बचाव के परिणाम को व्यक्त करता है; वैकल्पिक व्यक्ति-वाचक अर्थ टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: שְׁאֵרִית को पारिभाषिक ‘शेष’ मानें या प्रसंगानुसार जीवित बचे लोग
  choice: बचे हुए
  alternative: शेष; जीवित बचे लोग; वंशज
  rationale: ‘बचे हुए’ उत्तरजीविता का तत्काल अर्थ स्पष्ट करता है और शब्द की बाइबलीय अनुगूँज को किसी बाद की धर्मवैज्ञानिक योजना तक सीमित नहीं करता।
- issue: לִפְלֵיטָה גְּדֹלָה घटना/परिणामस्वरूप छुटकारा है या बड़ी संख्या में बचे लोग
  choice: एक महान छुटकारे के द्वारा
  alternative: बड़े बचाव के लिए; बहुत-से जीवित बचे लोगों के रूप में
  rationale: समानांतर ‘तुम्हें जीवित रखे’ के साथ मुख्य पाठ में बचाने का परिणाम स्वाभाविक है, किंतु हिब्रू की व्यक्ति-वाचक संभावना टिप्पणी में स्पष्ट रखी गई है।
- issue: לְ का बल उद्देश्य/परिणाम है या साधन
  choice: के द्वारा
  alternative: के लिए
  rationale: प्रसंग में यह जीवित रखने के बड़े बचावकारी परिणाम या माध्यम के रूप में समझा जा सकता है। हिन्दी मुख्य पाठ में ‘के द्वारा’ सुबोध है, जबकि टिप्पणी उद्देश्य/परिणाम की दूसरी संभावना बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन का बहुवचन ‘तुम’ रखा गया है। वाक्य गरिमापूर्ण किंतु सहज है। ‘बचे हुए’ को अस्पष्ट संज्ञा बनाने के बजाय लोगों के अर्थ में रखा गया है, और मूल की दोनों प्रमुख अर्थ-संभावनाएँ टिप्पणियों में संरक्षित हैं।
