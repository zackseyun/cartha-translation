  text: The report was heard in Pharaoh’s house[a], saying[b], “Joseph’s brothers have come,” and it was pleasing in the eyes of Pharaoh and in the eyes of his servants.
translation:
  language: hi
  text: 'और यह समाचार फ़िरौन के घर में सुना गया: “यूसुफ के भाई आए हैं।” यह बात फ़िरौन और उसके सेवकों को अच्छी लगी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַקֹּל נִשְׁמַע
  choice: यह समाचार ... सुना गया
  rationale: קּוֹל का मूल अर्थ ‘आवाज़’ है, पर यहाँ अगले कथन की विषयवस्तु के कारण इसका अर्थ ‘समाचार/खबर’ है। निफ़अल נִשְׁמַע के कर्मवाच्य रूप को ‘सुना गया’ से सुरक्षित रखा गया है।
- source_word: בֵּית פַּרְעֹה
  choice: फ़िरौन के घराने में
  rationale: शाब्दिक अर्थ ‘फ़िरौन का घर’ है; इस राजकीय प्रसंग में ‘घराना’ महल से जुड़े लोगों और दरबार को स्वाभाविक रूप से व्यक्त करता है, बिना केवल भवन तक अर्थ सीमित किए।
- source_word: לֵאמֹר
  choice: उद्धरण से पहले द्विबिंदु
  rationale: हिब्रू का ‘कहते हुए’ यहाँ समाचार की विषयवस्तु प्रस्तुत करता है। हिन्दी में द्विबिंदु और प्रत्यक्ष कथन इसका स्वाभाविक समतुल्य है।
- source_word: בָּאוּ אֲחֵי יוֹסֵף
  choice: यूसुफ के भाई आए हैं
  rationale: पूर्ण हुई घटना की वर्तमान प्रासंगिकता को हिन्दी का पूर्ण वर्तमान ‘आए हैं’ स्पष्ट करता है।
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: अच्छी लगी
  rationale: शाब्दिक मुहावरा ‘आँखों में अच्छा था’ आधुनिक हिन्दी में अस्वाभाविक है। ‘अच्छी लगी’ उसी अनुकूल प्रतिक्रिया को संक्षेप और सहज रूप से व्यक्त करता है।
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: עֶבֶד का सीधा और पर्याप्त व्यापक हिन्दी समतुल्य ‘सेवक’ है; ‘अधिकारी’ कहने से पद अनावश्यक रूप से निश्चित हो जाता।
