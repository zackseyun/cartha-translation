base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/017.yaml
  text: 'Then Pharaoh said to Joseph[a], “Tell your brothers, ‘Do this: load your beasts and go[b]; return to the land of Canaan.’”'
translation:
  language: hi
  text: 'तब फ़िरौन ने यूसुफ़ से कहा, “अपने भाइयों से कहो, ‘यह करो: अपने पशुओं पर सामान लादो और कनान देश लौट जाओ।’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के राजकीय पदनाम का प्रचलित हिन्दी रूप।
- source_word: אֱמֹר אֶל אַחֶיךָ
  choice: अपने भाइयों से कहो
  rationale: आदेशात्मक आशय और प्रत्यक्ष कथन की भूमिका दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: זֹאת עֲשׂוּ
  choice: यह करो
  rationale: संकेतवाचक पद और बहुवचन आज्ञा का संक्षिप्त, सीधा अनुवाद।
- source_word: טַעֲנוּ אֶת בְּעִירְכֶם
  choice: अपने पशुओं पर सामान लादो
  rationale: संदर्भ में בְּעִיר बोझ ढोने वाले पालतू पशुओं को सूचित करता है; हिन्दी में ‘पर सामान लादो’ क्रिया का अपेक्षित अर्थ स्पष्ट करता है।
- source_word: וּלְכוּ בֹאוּ
  choice: लौट जाओ
  rationale: दो क्रमिक आज्ञाओं—जाओ और आओ/पहुँचो—को गंतव्य की ओर वापसी की स्वाभाविक हिन्दी अभिव्यक्ति में समेटता है।
- source_word: אַרְצָה כְּנָעַן
  choice: कनान देश
  rationale: दिशासूचक प्रत्यय और ‘देश/भूमि’ संज्ञा सहित कनान की ओर गमन को व्यक्त करता है।
