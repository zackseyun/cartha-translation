translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘पशुओं’ को व्यापक रखा गया है, जबकि संदर्भ से बोझ ढोने वाले पशु अभिप्रेत हैं। हिब्रू के दोहरे וּלְכוּ בֹאוּ को शब्दशः असहज ‘जाओ, आओ’ के बजाय अर्थानुकूल ‘लौट जाओ’ किया गया है।
