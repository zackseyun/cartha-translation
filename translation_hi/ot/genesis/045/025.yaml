  yaml_path: translation/ot/genesis/045/025.yaml
  text: So they went up from Egypt and came to the land of Canaan, to Jacob their father.
translation:
  language: hi
  text: तब वे मिस्र से ऊपर गए और कनान देश में अपने पिता याकूब के पास आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: ऊपर गए
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है। मिस्र से कनान की यात्रा के भौगोलिक और पारंपरिक दिशात्मक भाव को बनाए रखने के लिए ‘ऊपर गए’ उपयुक्त है।
- source_word: מִמִּצְרָיִם
  choice: मिस्र से
  rationale: מִן स्रोत या प्रस्थान-बिंदु बताता है; מִצְרַיִם का प्रचलित हिन्दी नाम ‘मिस्र’ है।
- source_word: וַיָּבֹאוּ
  choice: आए
  rationale: בוא का सामान्य अर्थ ‘आना/पहुँचना’ है। यहाँ ‘आए’ स्वाभाविक है और प्रवेश का अनावश्यक विशिष्टीकरण नहीं करता।
- source_word: אֶרֶץ כְּנַעַן
  choice: कनान देश में
  rationale: इब्रानी पदबंध में אֶרֶץ ‘देश/भूमि’ स्पष्ट रूप से उपस्थित है; हिन्दी में ‘कनान देश’ पूरा अर्थ सहजता से व्यक्त करता है।
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: अपने पिता याकूब के पास
  rationale: אֶל व्यक्ति की ओर गमन को दर्शाता है, जिसे हिन्दी में ‘के पास’ स्वाभाविक रूप से व्यक्त करता है; אֲבִיהֶם का सीधा अर्थ ‘उनके पिता’ है, और कर्ता के साथ संबंध के कारण ‘अपने पिता’ अधिक सहज हिन्दी है।
theological_decisions: []
