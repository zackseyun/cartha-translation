  register: सरल, आधुनिक और गरिमापूर्ण कथात्मक हिन्दी। ‘ऊपर गए’ को जानबूझकर रखा गया है ताकि इब्रानी यात्रा-सूत्र की दिशात्मक छटा बनी रहे; वाक्य में कोई आवश्यक पाठालोचनात्मक या धर्मवैज्ञानिक पादटिप्पणी नहीं है।
