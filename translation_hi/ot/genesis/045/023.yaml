  text: וּ/לְ/אָבִ֞י/ו שָׁלַ֤ח כְּ/זֹאת֙ עֲשָׂרָ֣ה חֲמֹרִ֔ים נֹשְׂאִ֖ים מִ/טּ֣וּב מִצְרָ֑יִם וְ/עֶ֣שֶׂר אֲתֹנֹ֡ת נֹֽ֠שְׂאֹת בָּ֣ר וָ/לֶ֧חֶם וּ/מָז֛וֹן לְ/אָבִ֖י/ו לַ/דָּֽרֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/023.yaml
  text: 'And to his father he sent this: ten donkeys carrying some of the best things of Egypt[a], and ten female donkeys carrying grain and bread and provisions for his father for the journey.'
translation:
  language: hi
  text: 'और उसने अपने पिता के लिए यह भेजा: दस गधे, जो मिस्र की उत्तम वस्तुओं में से कुछ ले जा रहे थे,[a] और दस गधियाँ, जो अनाज, रोटी और अपने पिता की यात्रा के लिए भोजन-सामग्री ले जा रही थीं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मिस्र की उत्तम वस्तुओं में से’ अथवा ‘मिस्र की समृद्धि में से।’
    reason: מִטּוּב מִצְרָיִם में טוּב का अर्थ उत्तम वस्तुएँ, उपज या समृद्धि हो सकता है, और מִן स्रोत अथवा अंश का भाव दे सकता है।
lexical_decisions:
- source_word: כְּזֹאת
  choice: यह
  rationale: यह अभिव्यक्ति आगे दी गई भेजी हुई वस्तुओं की सूची का स्वाभाविक परिचय देती है; हिन्दी में ‘यह भेजा’ संक्षिप्त और स्पष्ट है।
- source_word: חֲמֹרִים
  choice: गधे
  rationale: आधुनिक मानक हिन्दी में यह सामान्य और सहज शब्द है।
- source_word: נֹשְׂאִים / נֹשְׂאֹת
  choice: जिन पर ... लदी थीं / लदी थी
  rationale: सहभागी रूप पशुओं द्वारा ढोई जा रही वस्तुओं का वर्णन करते हैं; हिन्दी में बोझ लदा होना अधिक स्वाभाविक है। क्रिया का वचन निकटस्थ भार-संज्ञा के अनुसार रखा गया है।
- source_word: מִטּוּב מִצְרָיִם
  choice: मिस्र की उत्तम वस्तुओं में से कुछ
  rationale: यह טוּב की व्यापकता और מִן के अंशवाचक भाव दोनों को बनाए रखता है, बिना वस्तुओं को केवल उपज मान लेने के।
- source_word: אֲתֹנֹת
  choice: गधियाँ
  rationale: इब्रानी में स्त्रीलिंग पशुओं का स्पष्ट भेद है; ‘गधियाँ’ इसे स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: בָּר
  choice: अनाज
  rationale: यह सामान्य अर्थ को रखता है और अनिश्चित रूप से गेहूँ जैसी किसी खास फ़सल को नहीं जोड़ता।
- source_word: לֶחֶם
  choice: रोटी
  rationale: सूची में इसके सामान्य ठोस अर्थ को बनाए रखा गया है, इसे व्यापक ‘भोजन’ में नहीं मिलाया गया।
- source_word: מָזוֹן
  choice: भोजन-सामग्री
  rationale: यात्रा के लिए रखी अन्य खाद्य-सामग्री या रसद का अर्थ स्पष्ट करता है और ‘रोटी’ से अलग रहता है।
- source_word: לַדָּרֶךְ
  choice: यात्रा के लिए
  rationale: प्रसंग में मार्ग के दौरान उपयोग हेतु सामग्री का स्वाभाविक हिन्दी रूप है।
