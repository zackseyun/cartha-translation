  language: hi
  text: तब उसने अपने भाइयों को विदा किया और वे चल पड़े। उसने उनसे कहा, “रास्ते में आपस में झगड़ना मत।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रास्ते में व्याकुल मत होना,” “क्रोधित मत होना,” अथवा “डरना मत।” इब्रानी क्रिया कई प्रकार की भावनात्मक अशांति व्यक्त कर सकती है; यूसुफ के अपने को प्रकट करने के बाद भाइयों के साथ यात्रा करने के तत्काल संदर्भ में “आपस में झगड़ना” उपयुक्त जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: उसने ... विदा किया
  rationale: पिएल रूप यहाँ यूसुफ द्वारा भाइयों को अपने पास से रवाना करने का भाव देता है; आधुनिक हिन्दी में “विदा किया” स्वाभाविक और सटीक है।
- source_word: אֶת־אֶחָיו
  choice: अपने भाइयों को
  rationale: मूल का पारिवारिक संबंध और यूसुफ के पुरुष सहोदरों का कथानक-संदर्भ सीधे बनाए रखा गया है।
- source_word: וַיֵּלֵכוּ
  choice: वे चल पड़े
  rationale: הלך का मूल भाव ‘जाना/चलना’ है; विदाई के बाद प्रस्थान को “चल पड़े” सहज हिन्दी में व्यक्त करता है।
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: उसने उनसे कहा
  rationale: यह मानक कथात्मक वचन-सूत्र का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: אַל
  choice: मत
  rationale: निषेधात्मक आदेश को हिन्दी में स्वाभाविक रीति से व्यक्त करता है।
- source_word: תִּרְגְּזוּ
  choice: आपस में झगड़ना
  rationale: רגז भावनात्मक उत्तेजना, क्रोध, भय या अशांति का संकेत दे सकता है। भाइयों की सामूहिक यात्रा और संभावित परस्पर दोषारोपण के निकट संदर्भ में “आपस में झगड़ना” उपयुक्त है, जबकि मूल की व्यापक अर्थ-संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: בַּדָּרֶךְ
  choice: रास्ते में
  rationale: कनान लौटने की यात्रा को दर्शाने वाला संक्षिप्त, प्रचलित और मूल के निकट हिन्दी प्रयोग है।
