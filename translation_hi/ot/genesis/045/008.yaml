source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹֽא אַתֶּ֞ם שְׁלַחְתֶּ֤ם אֹתִ/י֙ הֵ֔נָּה כִּ֖י הָ/אֱלֹהִ֑ים וַ/יְשִׂימֵ֨/נִֽי לְ/אָ֜ב לְ/פַרְעֹ֗ה וּ/לְ/אָדוֹן֙ לְ/כָל בֵּית֔/וֹ וּ/מֹשֵׁ֖ל בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/008.yaml
  text: So now[a], it was not you who sent me here, but God; and he has made me a father to Pharaoh, and lord over all his house, and ruler over all the land of Egypt.
translation:
  language: hi
  text: तो अब, मुझे यहाँ तुमने नहीं, बल्कि परमेश्वर ने भेजा है; और उसने मुझे फ़िरौन के लिए एक पिता[a], उसके सारे घराने का स्वामी, और मिस्र के सारे देश का शासक बनाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘फ़िरौन के लिए पिता के समान,’ अर्थात् उसका प्रमुख संरक्षक, सलाहकार या हितैषी।
    reason: ‘पिता’ यहाँ संभवतः रूपकात्मक पदवी है; टिप्पणी उसके संभावित कार्यगत अर्थ बताती है, जबकि मुख्य पाठ मूल छवि को बनाए रखता है।
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले कथन से निष्कर्ष की ओर बढ़ता है; ‘इसलिए’ संयोजक बल और ‘अब’ काल/विमर्श-सूचक बल को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: לֹא אַתֶּם שְׁלַחְתֶּם אֹתִי הֵנָּה כִּי הָאֱלֹהִים
  choice: मुझे यहाँ तुमने नहीं, बल्कि परमेश्वर ने भेजा है
  rationale: ‘तुमने नहीं, बल्कि परमेश्वर ने’ मूल के स्पष्ट विरोध और אַתֶּם पर बल को बनाए रखता है; ‘यहाँ’ मिस्र की ओर संकेत करता है।
- source_word: וַיְשִׂימֵנִי
  choice: और उसने मुझे ... बनाया है
  rationale: यह परमेश्वर के उस कार्य को आगे बढ़ाता है जिसका परिणाम यूसुफ की वर्तमान पदवी में बना हुआ है।
- source_word: לְאָב לְפַרְעֹה
  choice: फ़िरौन के लिए पिता
  rationale: ‘पिता’ की मूल रूपकात्मक छवि को मुख्य पाठ में सुरक्षित रखा गया है; केवल ‘सलाहकार’ कहना इसके संरक्षक, हितकारी और प्रमुख परामर्शदाता जैसे व्यापक भाव को संकुचित कर देता।
- source_word: וּלְאָדוֹן לְכָל בֵּיתוֹ
  choice: उसके सारे घराने का स्वामी
  rationale: ‘स्वामी’ अधिकार को व्यक्त करता है और ‘घराना’ यहाँ फ़िरौन के परिवार, सेवकों तथा राजकीय गृह-व्यवस्था के व्यापक अर्थ को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: וּמֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: मिस्र के सारे देश का शासक
  rationale: ‘शासक’ מֹשֵׁל के व्यापक शासन-अधिकार को बिना किसी अधिक विशिष्ट प्रशासनिक पद का संकेत दिए व्यक्त करता है; ‘देश’ אֶרֶץ के भौगोलिक विस्तार को बनाए रखता है।
theological_decisions:
- issue: यूसुफ के कथन में परमेश्वर की सर्वोच्च योजना और भाइयों की मानवीय भूमिका
  choice: ‘तुमने नहीं, बल्कि परमेश्वर ने’ के प्रबल विरोध को यथावत रखा गया है।
  alternative: विरोध को नरम करके भाइयों की भूमिका को कम करना, या परमेश्वर के विधान की कोई विस्तृत धर्मवैज्ञानिक व्याख्या जोड़ना।
  rationale: मूल कथन परमेश्वर के निर्णायक और उद्देश्यपूर्ण कार्य पर बल देता है, पर प्रसंग में भाइयों के वास्तविक कर्म को नकारता नहीं। अनुवाद इस तनाव को समझाकर समाप्त करने के बजाय सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। वाक्य में ‘तुमने नहीं, बल्कि परमेश्वर ने’ से मूल का बल स्पष्ट होता है। ‘फ़िरौन’, ‘स्वामी’ और ‘शासक’ सामान्य पाठकों के लिए परिचित तथा प्रसंगानुकूल हैं।
