source:
  edition: WLC
  text: וַ/יְדַבְּר֣וּ אֵלָ֗י/ו אֵ֣ת כָּל דִּבְרֵ֤י יוֹסֵף֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֲלֵ/הֶ֔ם וַ/יַּרְא֙ אֶת הָ֣/עֲגָל֔וֹת אֲשֶׁר שָׁלַ֥ח יוֹסֵ֖ף לָ/שֵׂ֣את אֹת֑/וֹ וַ/תְּחִ֕י ר֖וּחַ יַעֲקֹ֥ב אֲבִי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/027.yaml
  text: And they told him all the words of Yosef that he had spoken to them[a], and he saw the wagons that Yosef had sent to carry him[b], and the spirit of their father Yaakov revived.
translation:
  language: hi
  text: और उन्होंने यूसुफ की वे सारी बातें उसे बताईं जो उसने उनसे कही थीं, और जब उसने वे गाड़ियाँ देखीं जिन्हें यूसुफ ने उसे ले आने के लिए भेजा था, तब उनके पिता याकूब की जान में जान आई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: उन्होंने ... उसे बताईं
  rationale: संदर्भ में यह भाइयों द्वारा याकूब को यूसुफ का संदेश सुनाना है; ‘बताईं’ आधुनिक हिन्दी में स्वाभाविक रूप से इस संप्रेषण को व्यक्त करता है।
- source_word: אֵת כָּל דִּבְרֵי יוֹסֵף אֲשֶׁר דִּבֶּר אֲלֵהֶם
  choice: यूसुफ की वे सारी बातें ... जो उसने उनसे कही थीं
  rationale: ‘बातें’ דִּבְרֵי के ठोस भाव को बनाए रखता है, और ‘कही थीं’ पहले घट चुकी वाणी को सहज हिन्दी में दर्शाता है।
- source_word: הָעֲגָלוֹת
  choice: गाड़ियाँ
  rationale: यह परिवहन के लिए भेजे गए पहिएदार वाहनों को दर्शाता है; ‘गाड़ियाँ’ सामान्य आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: אֲשֶׁר שָׁלַח יוֹסֵף לָשֵׂאת אֹתוֹ
  choice: जिन्हें यूसुफ ने उसे ले आने के लिए भेजा था
  rationale: נשא का मूल भाव उठाने या ढोने का है, पर वाहन और गंतव्य के इस प्रसंग में ‘ले आने’ से अभिप्रेत परिवहन स्वाभाविक हिन्दी में ठीक व्यक्त होता है।
- source_word: וַתְּחִי רוּחַ
  choice: जान में जान आई
  rationale: यह प्रचलित हिन्दी मुहावरा पुनः प्राप्त जीवट, आशा और उत्साह को व्यक्त करता है तथा חיה की जीवन-संबंधी छवि को बनाए रखता है।
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: उनके पिता याकूब
  rationale: हिन्दी वाक्य-विन्यास में स्वाभाविक है; יַעֲקֹב का प्रचलित हिन्दी बाइबलीय रूप ‘याकूब’ रखा गया है।
theological_decisions:
- issue: רוּחַ का अर्थ
  choice: जान में जान आई
  alternative: आत्मा फिर जी उठी
  rationale: यहाँ רוּחַ मनुष्य की जीवनी-शक्ति या हौसले का द्योतक है; हिन्दी मुहावरा किसी पृथक तत्त्व के पुनरुत्थान का अनावश्यक धर्मवैज्ञानिक संकेत दिए बिना मूल जीवन-छवि को संप्रेषित करता है।
- issue: יַעֲקֹב नाम का रूप
  choice: याकूब
  alternative: याकोव
  rationale: ‘याकूब’ आधुनिक हिन्दी बाइबल-पाठकों के लिए प्रतिष्ठित और सहज पहचान योग्य नाम-रूप है, जबकि यह नाम का अनुवाद नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल के क्रमिक संयोजनों को हिन्दी की स्वाभाविक रचना में ‘और... और जब... तब...’ द्वारा व्यक्त किया गया है।
