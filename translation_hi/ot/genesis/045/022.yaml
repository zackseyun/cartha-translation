    text: इब्रानी में शाब्दिक रूप से ‘तीन सौ चाँदी’ है; यहाँ मुद्रा की कोई विशिष्ट इकाई नहीं बताई गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכֻלָּם ... לָאִישׁ
  choice: उनमें से हर एक को
  rationale: दोनों पद मिलकर वितरण का भाव देते हैं—समूह के प्रत्येक व्यक्ति को। यह हिन्दी में स्वाभाविक है और इब्रानी की पुनरुक्ति को अनगढ़ ढंग से दोहराए बिना उसका बल बनाए रखता है।
- source_word: נָתַן
  choice: उसने ... दिए
  rationale: उपहार देने के इस कथात्मक प्रसंग में נתן का सीधा और सामान्य अर्थ सुरक्षित रखा गया है।
- source_word: חֲלִפוֹת שְׂמָלֹת
  choice: जोड़ी कपड़े
  rationale: यह पद बदलने के लिए दिए गए कपड़ों के एक पूरे सेट को सूचित करता है। आधुनिक हिन्दी में ‘एक जोड़ी कपड़े’ प्रति व्यक्ति एक सेट का स्वाभाविक बोध कराता है; दूसरी बार बहुवचन संख्या के साथ ‘पाँच जोड़ी कपड़े’ रखा गया है।
- source_word: וּלְבִנְיָמִן
  choice: पर बिन्यामीन को
  rationale: वाव यहाँ अन्य भाइयों के उपहार और बिन्यामीन के विशेष उपहार के बीच प्रसंगगत विरोध दिखाता है; ‘पर’ उसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁלֹשׁ מֵאוֹת כֶּסֶף
  choice: चाँदी के तीन सौ सिक्के
  rationale: इब्रानी में शाब्दिक रूप से ‘तीन सौ चाँदी’ है और कोई विशिष्ट मौद्रिक इकाई नहीं दी गई। ‘सिक्के’ रकम का सामान्य बोध देता है, जबकि ‘शेकेल’ जोड़ना स्रोत से अधिक विशिष्ट होता।
- source_word: וְחָמֵשׁ חֲלִפֹת שְׂמָלֹת
  choice: और पाँच जोड़ी कपड़े
  rationale: पहले आए वस्त्र-संबंधी पद का अर्थ और शब्दावली समान रखी गई है तथा संख्या स्पष्ट रूप से सुरक्षित है।
