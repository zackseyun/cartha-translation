lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक क्रम व्यक्त करता है, बिना अनावश्यक कारणात्मक अर्थ जोड़े।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: इब्रानी पाठ में स्पष्ट रूप से ‘इस्राएल’ है; इसलिए इसे ‘याकूब’ से नहीं बदला गया।
- source_word: רַב
  choice: बस!
  rationale: यहाँ यह पर्याप्तता की भावपूर्ण विस्मयादिबोधक घोषणा है; ‘बस!’ इसकी संक्षिप्तता और भावात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עוֹד
  choice: अब भी
  rationale: חָי के साथ यह जीवन की निरंतरता बताता है—यूसुफ अब भी जीवित है।
- source_word: בְּנִי
  choice: मेरा बेटा
  rationale: संबंध और आत्मीयता को सामान्य आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: חָי
  choice: जीवित
  rationale: विधेय विशेषण का सीधा और गरिमापूर्ण हिन्दी समतुल्य।
- source_word: אֵלְכָה
  choice: मैं ... जाकर
  rationale: कोहोर्टेटिव रूप दृढ़ संकल्प व्यक्त करता है; संयुक्त हिन्दी वाक्य ‘मैं ... जाकर उसे देखूँगा’ इस निश्चय को सहज रूप में रखता है।
- source_word: וְאֶרְאֶנּוּ
  choice: उसे देखूँगा
  rationale: क्रिया और तृतीय पुरुष एकवचन कर्म-प्रत्यय का स्वाभाविक हिन्दी रूप।
- source_word: בְּטֶרֶם אָמוּת
  choice: मरने से पहले
  rationale: कालवाचक संबंध को संक्षिप्त और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
