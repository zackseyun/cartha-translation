source:
  edition: WLC
  text: כִּי זֶ֛ה שְׁנָתַ֥יִם הָ/רָעָ֖ב בְּ/קֶ֣רֶב הָ/אָ֑רֶץ וְ/עוֹד֙ חָמֵ֣שׁ שָׁנִ֔ים אֲשֶׁ֥ר אֵין חָרִ֖ישׁ וְ/קָצִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/006.yaml
  text: For these two years the famine has been in the midst of the land[b][a], and there are still five years in which there will be neither plowing nor harvest.
translation:
  language: hi
  text: क्योंकि देश में अकाल पड़े हुए अब दो वर्ष हो चुके हैं, और अभी पाँच वर्ष और बाकी हैं, जिनमें न जुताई होगी, न कटनी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह यूसुफ के पहले कथन का कारण स्पष्ट करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: זֶה שְׁנָתַיִם
  choice: ये दो वर्ष हो चुके हैं
  rationale: इब्रानी प्रयोग वर्तमान समय तक बीत चुकी दो वर्ष की अवधि बताता है; हिन्दी में पूर्णता सूचक रूप अर्थ को स्पष्ट और सहज रखता है।
- source_word: הָרָעָב
  choice: अकाल
  rationale: कथा में पहले से उल्लिखित विशिष्ट अकाल का संकेत है; हिन्दी में बिना परसर्गीय निश्चितता-चिह्न के भी संदर्भ स्पष्ट है।
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: देश में
  rationale: शाब्दिक अर्थ ‘देश के बीच में’ है, पर इस संदर्भ में इसका स्वाभाविक अर्थ देश के भीतर/देश में है; ‘धरती’ की अपेक्षा स्थानीय भौगोलिक संदर्भ में ‘देश’ उपयुक्त है।
- source_word: וְעוֹד חָמֵשׁ שָׁנִים
  choice: और अभी पाँच वर्ष और होंगे
  rationale: आगे शेष रहने वाली पाँच वर्ष की अवधि को आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: אֲשֶׁר אֵין
  choice: जिनमें न ... होगी, न ...
  rationale: संबंधवाचक उपवाक्य आने वाले पाँच वर्षों का वर्णन करता है; भविष्यकाल वक्ता के समय-बिंदु के अनुरूप है।
- source_word: חָרִישׁ
  choice: जुताई
  rationale: खेती के लिए भूमि जोतने की क्रिया का सामान्य और स्पष्ट आधुनिक हिन्दी शब्द।
- source_word: קָצִיר
  choice: कटनी
  rationale: फसल काटने की क्रिया अथवा ऋतु को व्यक्त करता है और ‘जुताई’ के साथ कृषि-युग्म को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य इब्रानी के कारणसूचक संबंध और बीते दो तथा आने वाले पाँच वर्षों के कालगत विरोध को स्पष्ट रखता है।
