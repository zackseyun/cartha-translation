source:
  edition: WLC
  text: וְ/יָשַׁבְתָּ֣ בְ/אֶֽרֶץ גֹּ֗שֶׁן וְ/הָיִ֤יתָ קָרוֹב֙ אֵלַ֔/י אַתָּ֕ה וּ/בָנֶ֖י/ךָ וּ/בְנֵ֣י בָנֶ֑י/ךָ וְ/צֹאנְ/ךָ֥ וּ/בְקָרְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/010.yaml
  text: You shall live in the land of Goshen, and you shall be near me—you and your sons and your grandsons, and your flocks and your herds and all that you have.
translation:
  language: hi
  text: तुम गोशेन प्रदेश में बसोगे और मेरे निकट रहोगे—तुम, तुम्हारे बेटे, तुम्हारे पोते, तुम्हारी भेड़-बकरियों के झुंड, तुम्हारे गाय-बैलों के झुंड और जो कुछ तुम्हारा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: तुम ... रहोगे
  rationale: ישׁב यहाँ किसी स्थान पर स्थायी रूप से निवास करने के अर्थ में है; आधुनिक हिन्दी में ‘रहोगे’ स्वाभाविक और स्पष्ट है।
- source_word: בְאֶרֶץ גֹּשֶׁן
  choice: गोशेन देश में
  rationale: אֶרֶץ भौगोलिक भूभाग को सूचित करता है; ‘गोशेन देश’ मूल संरचना और स्थान-विशेष दोनों को बनाए रखता है।
- source_word: וְהָיִיתָ קָרוֹב אֵלַי
  choice: और मेरे पास रहोगे
  rationale: היה के साथ קָרוֹב निकटता व्यक्त करता है। ‘मेरे पास रहोगे’ हिन्दी में स्वाभाविक है और यूसुफ द्वारा कही गई भौगोलिक निकटता को सुरक्षित रखता है।
- source_word: אַתָּה
  choice: तुम
  rationale: स्वतंत्र सर्वनाम पर बल है; डैश के बाद सूची की शुरुआत में ‘तुम’ रखकर यह बल व्यक्त किया गया है।
- source_word: וּבָנֶיךָ
  choice: तुम्हारे बेटे
  rationale: בנים यहाँ पुल्लिंग बहुवचन है और अगला पद उनके बेटों का अलग उल्लेख करता है; इसलिए ‘बेटे’ सटीक है।
- source_word: וּבְנֵי בָנֶיךָ
  choice: तुम्हारे पोते
  rationale: शाब्दिक अर्थ ‘तुम्हारे बेटों के बेटे’ है; ‘पोते’ इसका स्वाभाविक और लिंग-सटीक हिन्दी रूप है।
- source_word: וְצֹאנְךָ
  choice: तुम्हारी भेड़-बकरियों के झुंड
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ और बकरियों, का सामूहिक पद है; स्पष्ट हिन्दी के लिए दोनों का उल्लेख किया गया है।
- source_word: וּבְקָרְךָ
  choice: तुम्हारे गाय-बैलों के झुंड
  rationale: בקר बड़े मवेशियों को दर्शाता है; ‘गाय-बैल’ आधुनिक पाठक के लिए अर्थ स्पष्ट करता है और צֹאן से भेद बनाए रखता है।
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: और जो कुछ तुम्हारा है
  rationale: यह व्यापक स्वामित्व-सूचक वाक्यांश है; चुना हुआ रूप संक्षिप्त, स्वाभाविक और सर्वसमावेशी है।
