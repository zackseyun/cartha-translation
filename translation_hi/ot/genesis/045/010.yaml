  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। यूसुफ का याकूब से एकवचन सम्बोधन ‘तुम’ के रूप में रखा गया है। डैश मूल के स्वतंत्र सर्वनाम אַתָּה के बल और उसके बाद आने वाली विस्तृत सूची को स्पष्ट करता है।
