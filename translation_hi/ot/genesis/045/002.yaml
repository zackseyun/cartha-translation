  yaml_path: translation/ot/genesis/045/002.yaml
  text: And he wept aloud[a], and the Egyptians heard[c][b], and Pharaoh’s household heard.
translation:
  language: hi
  text: तब वह ज़ोर से रोया[a]। मिस्रियों ने उसकी आवाज़ सुनी[b], और फ़िरौन के घराने ने भी वह आवाज़ सुनी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसने रोने में अपनी आवाज़ दी”; यह इब्रानी मुहावरा ऊँची आवाज़ में रोने का अर्थ देता है।
    reason: lexical_alternative
  - marker: b
    text: “मिस्र ने सुना” भी सम्भव है, यदि इसे देश अथवा उसके लोगों के लिए सामूहिक प्रयोग माना जाए; बहुवचन क्रिया “मिस्रियों” का समर्थन करती है।
    reason: lexical_alternative
  - marker: c
    text: “फ़िरौन का घर” या व्यापक अर्थ में “फ़िरौन का दरबार” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי
  choice: वह फूट-फूटकर रोने लगा
  rationale: शाब्दिक रूप से यह ‘उसने रोने में अपनी आवाज़ दी’ है; इब्रानी मुहावरा ऊँची और स्पष्ट सुनाई देने वाली रुलाई व्यक्त करता है। आधुनिक हिन्दी में ‘फूट-फूटकर रोने लगा’ उसी भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּשְׁמְעוּ
  choice: ने उसकी आवाज़ सुनी
  rationale: यहाँ שׁמע का अर्थ ध्वनि सुनना है। हिन्दी में कर्म स्पष्ट करने के लिए ‘उसकी आवाज़’ जोड़ा गया है, जो पिछले वाक्यांश में निहित है।
- source_word: מִצְרַיִם
  choice: मिस्रियों
  rationale: शब्द ‘मिस्र’ देश को भी सूचित कर सकता है, पर बहुवचन क्रिया सामूहिक रूप से मिस्र के लोगों की ओर संकेत करती है; इसलिए ‘मिस्रियों’ अधिक स्वाभाविक है।
- source_word: בֵּית פַּרְעֹה
  choice: फ़िरौन के घराने
  rationale: इब्रानी ‘घर’ यहाँ राजपरिवार, राजकीय गृहस्थी अथवा दरबार से जुड़े लोगों को सूचित कर सकता है। ‘घराना’ मूल रूपक और उसका सामूहिक अर्थ दोनों बनाए रखता है।
