  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और श्रव्य प्रवाह रखा गया है। ‘घरानों’ द्वारा विस्तृत पारिवारिक इकाई और ‘उत्तम उपज’ द्वारा इब्रानी मुहावरे का प्रसंगगत अर्थ व्यक्त किया गया है; पादटिप्पणी में मूल बिंब सुरक्षित है।
