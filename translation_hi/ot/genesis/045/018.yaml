source:
  edition: WLC
  text: וּ/קְח֧וּ אֶת אֲבִי/כֶ֛ם וְ/אֶת בָּתֵּי/כֶ֖ם וּ/בֹ֣אוּ אֵלָ֑/י וְ/אֶתְּנָ֣ה לָ/כֶ֗ם אֶת טוּב֙ אֶ֣רֶץ מִצְרַ֔יִם וְ/אִכְל֖וּ אֶת חֵ֥לֶב הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/018.yaml
  text: Take your father and your households[a], and come to me, and I will give you the best of the land of Egypt, and you shall eat the fat of the land.
translation:
  language: hi
  text: अपने पिता और अपने घरानों को लेकर मेरे पास आओ। मैं तुम्हें मिस्र देश का उत्तम भाग दूँगा, और तुम देश की उत्तम उपज[a] खाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘देश की चरबी’; यह इब्रानी मुहावरा देश की सबसे समृद्ध या उत्तम उपज को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ
  choice: लेकर
  rationale: לקח के बहुवचन आदेश का मूल भाव ‘लेना’ है; हिंदी में ‘अपने पिता...को लेकर आओ’ गंतव्य-सहित निर्देश को स्वाभाविक और सटीक रूप से व्यक्त करता है।
- source_word: אֲבִיכֶם
  choice: अपने पिता
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय सहित एकवचन संज्ञा याकूब की ओर संकेत करती है।
- source_word: בָּתֵּיכֶם
  choice: अपने घरानों
  rationale: यहाँ בַּיִת केवल भवन नहीं, बल्कि परिवार, आश्रितों और पूरे घरेलू समुदाय को सूचित करता है; ‘घरानों’ से यह सामाजिक इकाई बनी रहती है।
- source_word: וּבֹאוּ אֵלָי
  choice: मेरे पास आओ
  rationale: בוא के बहुवचन आदेश और אֵלַי का सीधा, स्वाभाविक हिंदी अनुवाद; मूल में ‘वापस’ स्पष्ट नहीं है।
- source_word: וְאֶתְּנָה לָכֶם
  choice: मैं तुम्हें ... दूँगा
  rationale: आदेशों के बाद प्रयुक्त נתן का यह रूप प्रसंग में आश्वासन अथवा प्रतिज्ञा व्यक्त करता है।
- source_word: טוּב אֶרֶץ מִצְרַיִם
  choice: मिस्र देश का उत्तम भाग
  rationale: טוּב यहाँ देश की श्रेष्ठता, समृद्धि अथवा सर्वोत्तम संसाधनों का बोध कराता है; ‘उत्तम भाग’ स्थान और उसकी संपन्नता दोनों के लिए स्वाभाविक है।
- source_word: וְאִכְלוּ
  choice: और तुम ... खाओगे
  rationale: रूप आदेशात्मक है, पर preceding प्रतिज्ञा के साथ यह परिणाम अथवा सुनिश्चित भविष्य का भाव देता है; हिंदी में भविष्यकाल अर्थ को स्पष्ट और सहज बनाता है।
- source_word: חֵלֶב הָאָרֶץ
  choice: देश की उत्तम उपज
  rationale: शाब्दिक ‘देश की चरबी’ आधुनिक हिंदी में भ्रामक हो सकती है। मुहावरे का आशय भूमि की सबसे समृद्ध और चुनी हुई पैदावार है; ‘उत्तम उपज’ इसे स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक बिंब सुरक्षित रखती है।
