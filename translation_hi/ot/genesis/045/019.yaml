source:
  edition: WLC
  text: וְ/אַתָּ֥ה צֻוֵּ֖יתָה זֹ֣את עֲשׂ֑וּ קְחוּ לָ/כֶם֩ מֵ/אֶ֨רֶץ מִצְרַ֜יִם עֲגָל֗וֹת לְ/טַפְּ/כֶם֙ וְ/לִ/נְשֵׁי/כֶ֔ם וּ/נְשָׂאתֶ֥ם אֶת אֲבִי/כֶ֖ם וּ/בָאתֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/019.yaml
  text: 'And you are commanded[a], ‘Do this: take for yourselves wagons from the land of Egypt for your little ones and for your wives[c][b], and carry your father and come.’'
translation:
  language: hi
  text: 'और तुझे यह आज्ञा दी गई है: “यह करो—मिस्र देश से अपने बाल-बच्चों[b] और अपनी पत्नियों के लिए गाड़ियाँ[a] ले लो; अपने पिता को लेकर आओ[c]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छकड़े”; यहाँ मिस्र से भेजे जाने वाले परिवहन-वाहन अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द विशेष रूप से छोटे बच्चों को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक भाव है, “अपने पिता को लेकर आओ।” प्रसंग में मिस्र लौटना अभिप्रेत है, यद्यपि यहाँ “वापस” शब्द नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: צֻוֵּיתָה
  choice: तुझे यह आज्ञा दी गई है
  rationale: पुअल रूप निष्क्रिय भाव व्यक्त करता है और एकवचन में यूसुफ को संबोधित करता है; प्रसंग में आज्ञा फिरौन की ओर से है, पर स्रोत में उसका नाम यहाँ दोहराया नहीं गया।
- source_word: זֹאת עֲשׂוּ
  choice: यह करो
  rationale: इब्रानी की संक्षिप्त आदेशात्मक अभिव्यक्ति को स्वाभाविक और सीधे ढंग से रखा गया है।
- source_word: קְחוּ לָכֶם
  choice: ले लो
  rationale: לָכֶם का लाभार्थक/आत्मवाची भाव हिन्दी के ‘ले लो’ में स्वाभाविक रूप से व्यक्त होता है; अलग से ‘अपने लिए’ जोड़ना अगले उद्देश्य-वाक्यांश के साथ बोझिल होता।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: אֶרֶץ को स्पष्ट रखते हुए आधुनिक हिन्दी में सहज अभिव्यक्ति चुनी गई है।
- source_word: עֲגָלוֹת
  choice: गाड़ियाँ
  rationale: यह लोगों और सामान के स्थल-परिवहन के वाहनों को दर्शाता है; ‘गाड़ियाँ’ किसी अप्रमाणित विशिष्ट पशु या बनावट को जोड़े बिना अर्थ देता है।
- source_word: לְטַפְּכֶם
  choice: अपने बाल-बच्चों के लिए
  rationale: טַף मुख्यतः छोटे बच्चों को सूचित करता है; ‘बाल-बच्चे’ सामान्य हिन्दी में परिवार के छोटे बच्चों का भाव सहजता से देता है।
- source_word: וְלִנְשֵׁיכֶם
  choice: और अपनी पत्नियों के लिए
  rationale: इस पारिवारिक यात्रा के प्रसंग में נָשִׁים का संबंधसूचक अर्थ ‘पत्नियाँ’ स्पष्ट है।
- source_word: וּנְשָׂאתֶם אֶת אֲבִיכֶם וּבָאתֶם
  choice: फिर अपने पिता को साथ लेकर आओ
  rationale: נשא यहाँ पिता को ढोकर/साथ लाने का भाव रखता है और בוא ‘आना’ है; संयुक्त हिन्दी अभिव्यक्ति दोनों क्रियाओं का अर्थ स्वाभाविक रूप से देती है।
theological_decisions:
- issue: आज्ञा देने वाले की पहचान
  choice: मुख्य पाठ में कर्ता को अनकहा रखा गया
  alternative: ‘फिरौन ने तुझे आज्ञा दी है’
  rationale: प्रसंग से फिरौन अभिप्रेत है, पर इस वाक्य में निष्क्रिय क्रिया है और कर्ता स्पष्ट रूप से नहीं दिया गया; इसलिए उसे पाठ में जोड़ना उचित नहीं।
- issue: וּבָאתֶם में लौटने का भाव
  choice: ‘आओ’ का अर्थ ‘लेकर आओ’ में रखा गया
  alternative: ‘वापस आओ’ या ‘मिस्र लौट आओ’
  rationale: प्रसंग मिस्र लौटने की ओर संकेत करता है, किंतु इब्रानी क्रिया स्वयं केवल ‘आना’ कहती है; अतः ‘वापस’ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण संबोधन रखा गया है। यूसुफ के लिए एकवचन ‘तुझे’ और उसके भाइयों के लिए बहुवचन आदेश ‘करो/ले लो/आओ’ का भेद सुरक्षित है। ‘बाल-बच्चे’ आम पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी उसके अधिक विशिष्ट स्रोतार्थ को स्पष्ट करती है।
