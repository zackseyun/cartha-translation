  text: וְ/הִגַּדְתֶּ֣ם לְ/אָבִ֗/י אֶת כָּל כְּבוֹדִ/י֙ בְּ/מִצְרַ֔יִם וְ/אֵ֖ת כָּל אֲשֶׁ֣ר רְאִיתֶ֑ם וּ/מִֽהַרְתֶּ֛ם וְ/הוֹרַדְתֶּ֥ם אֶת אָבִ֖/י הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/013.yaml
  text: And tell my father about all my honor in Egypt and everything you have seen[b][a]. Hurry and bring my father down here.
translation:
  language: hi
  text: और तुम मेरे पिता को मिस्र में मेरी सारी प्रतिष्ठा और जो कुछ तुमने देखा है, वह सब बताना। जल्दी करो और मेरे पिता को यहाँ नीचे ले आओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִגַּדְתֶּם
  choice: और तुम ... बताना
  rationale: נגד के हिफ़ील रूप का अर्थ यहाँ किसी बात को ज्ञात कराना या बताना है। प्रसंग में यह यूसुफ द्वारा अपने भाइयों को दिया गया स्वाभाविक निर्देश है।
- source_word: כָּל כְּבוֹדִי
  choice: मेरा कितना सम्मान है
  rationale: כָּבוֹד यहाँ मिस्र में यूसुफ की प्रतिष्ठा, उच्च पद और वैभव की ओर संकेत करता है। हिंदी में ‘मेरा कितना सम्मान है’ इस समग्र ऊँचे दर्जे को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּמִצְרַיִם
  choice: मिस्र में
  rationale: यह सीधा स्थानवाचक वाक्यांश है।
- source_word: כָּל אֲשֶׁר רְאִיתֶם
  choice: वह सब जो तुमने देखा है
  rationale: यह भाइयों द्वारा प्रत्यक्ष देखी गई सभी बातों को समेटता है और मूल की संरचना को सहज हिंदी में बनाए रखता है।
- source_word: וּמִהַרְתֶּם
  choice: जल्दी करो
  rationale: क्रिया में तात्कालिकता और आदेश का भाव है; ‘जल्दी करो’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: וְהוֹרַדְתֶּם
  choice: नीचे ले आओ
  rationale: ירד के हिफ़ील रूप में किसी को नीचे आने का कारण बनाना निहित है। मिस्र की ओर यात्रा को उत्पत्ति में ‘नीचे’ जाना कहा जाता है, इसलिए दिशात्मक भाव सुरक्षित रखा गया है।
- source_word: הֵנָּה
  choice: यहाँ
  rationale: यह वक्ता के स्थान की ओर गंतव्य को दर्शाता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सम्मान’ को ‘महिमा’ की अपेक्षा प्राथमिकता दी गई है, क्योंकि यहाँ प्रसंग यूसुफ के मिस्र में ऊँचे पद और प्रतिष्ठा का है। ‘नीचे ले आओ’ मूल के भौगोलिक-कथात्मक दिशाबोध को सुरक्षित रखता है।
