  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। पिता के प्रति आदरसूचक ‘आप/आइए/कीजिए’ रखा गया है, जबकि भाइयों को संबोधित बहुवचन आज्ञा में ‘करो/जाओ’ प्रयुक्त है। इब्रानी की ऊपर/नीचे वाली भौगोलिक दिशा जानबूझकर सुरक्षित रखी गई है।
