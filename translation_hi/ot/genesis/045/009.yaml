base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/009.yaml
  text: 'Hurry and go up to my father[a], and say to him, ‘Thus says your son Joseph: God has made me lord over all Egypt. Come down to me; do not delay.’'
translation:
  language: hi
  text: 'जल्दी करो और ऊपर मेरे पिता के पास जाओ, और उनसे कहो, ‘तुम्हारा पुत्र यूसुफ यह कहता है: परमेश्वर ने मुझे सारे मिस्र का स्वामी बनाया है। मेरे पास नीचे चले आइए; देर मत कीजिए[a]।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘विलंब न कीजिए’; अधिक शाब्दिक रूप से, ‘खड़े न रहिए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֲרוּ
  choice: जल्दी करो
  rationale: बहुवचन आज्ञार्थक रूप तात्कालिकता प्रकट करता है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וַעֲלוּ
  choice: ऊपर जाओ
  rationale: עלה की दिशात्मक छवि बनाए रखी गई है; मिस्र से कनान की यात्रा को उत्पत्ति में ‘ऊपर जाना’ कहा जाता है।
- source_word: אֶל אָבִי
  choice: मेरे पिता के पास
  rationale: दिशा और संबंध दोनों को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: וַאֲמַרְתֶּם אֵלָיו
  choice: और उनसे कहो
  rationale: पहली आज्ञा के बाद अगला निर्देश स्वाभाविक हिन्दी में आज्ञार्थक रूप में दिया गया है; पिता के लिए आदरसूचक सर्वनाम उपयुक्त है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: इब्रानी संदेशवाहक सूत्र का अर्थ स्पष्ट रखते हुए आधुनिक हिन्दी में स्वाभाविक रूप चुना गया है।
- source_word: בִּנְךָ יוֹסֵף
  choice: आपका पुत्र यूसुफ
  rationale: इब्रानी शब्दक्रम और पुत्र के रूप में यूसुफ की पहचान दोनों सुरक्षित रहते हैं।
- source_word: שָׂמַנִי אֱלֹהִים
  choice: परमेश्वर ने मुझे ... बनाया है
  rationale: שׂים यहाँ किसी अधिकारपूर्ण पद पर स्थापित करने का भाव देता है; ‘बनाया है’ हिन्दी में सहज है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: क्रिया और प्रसंग एकवचन परमेश्वर की ओर संकेत करते हैं; हिन्दी बाइबलीय प्रयोग में ‘परमेश्वर’ स्पष्ट और प्रतिष्ठित पद है।
- source_word: לְאָדוֹן לְכָל מִצְרָיִם
  choice: सारे मिस्र का स्वामी
  rationale: अधिकार के क्षेत्र को स्वाभाविक हिन्दी संबंध-रचना से व्यक्त किया गया है; ‘स्वामी’ אָדוֹן के अधिकार-सूचक अर्थ को बिना राजनीतिक पद विशेष ठहराए रखता है।
- source_word: רְדָה אֵלַי
  choice: मेरे पास नीचे चले आइए
  rationale: भौगोलिक ‘नीचे उतरने’ की दिशा और वक्ता की ओर आने—दोनों भाव सुरक्षित हैं; पिता को संबोधन होने से आदरसूचक आज्ञा प्रयुक्त है।
- source_word: אַל תַּעֲמֹד
  choice: देर मत कीजिए
  rationale: עמד का शाब्दिक अर्थ ‘खड़ा रहना’ है, पर यहाँ निषेध में रुकने या विलंब करने का मुहावरेदार भाव है।
theological_decisions:
- issue: यूसुफ के कथन में אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: देवता
  rationale: एकवचन क्रियार्थ और व्यापक प्रसंग यूसुफ द्वारा अपने उपास्य परमेश्वर के विधान को मानने की ओर संकेत करते हैं; यह पाठ के अर्थ का अनुसरण है, कोई अतिरिक्त सांप्रदायिक दावा नहीं।
