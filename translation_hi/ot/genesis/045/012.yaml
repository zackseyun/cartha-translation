  yaml_path: translation/ot/genesis/045/012.yaml
  text: And look[a], your eyes see—and the eyes of my brother Benjamin—that it is my mouth that is speaking to you.
translation:
  language: hi
  text: और देखो, तुम्हारी आँखें और मेरे भाई बिन्यामीन की आँखें यह देख रही हैं कि तुमसे बोलने वाला मुँह मेरा ही है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह पद सुनने वालों का ध्यान तत्काल और जोर देकर खींचता है। आधुनिक हिन्दी में ‘और देखो’ इस संवादात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֵינֵיכֶם רֹאוֹת
  choice: तुम्हारी आँखें ... देख रही हैं
  rationale: ‘आँखें’ को स्पष्ट रखने से प्रत्यक्ष दृश्य पुष्टि की इब्रानी सजीवता बनी रहती है; स्त्रीलिंग बहुवचन कृदंत का वर्तमानकालिक भाव ‘देख रही हैं’ से व्यक्त होता है।
- source_word: וְעֵינֵי אָחִי בִנְיָמִין
  choice: और मेरे भाई बिन्यामीन की आँखें
  rationale: यह ‘तुम्हारी आँखें’ के समानांतर रचना को बनाए रखता है और बिन्यामीन को यूसुफ के भाई के रूप में स्पष्ट करता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ यह उस बात की विषय-वस्तु प्रस्तुत करता है जिसकी पुष्टि उनकी आँखें कर रही हैं।
- source_word: פִי
  choice: मेरा ही मुँह
  rationale: मूल में ठोस रूप से ‘मेरा मुँह’ है, जो इस बात पर बल देता है कि यूसुफ स्वयं उनसे बोल रहा है, किसी दुभाषिए के माध्यम से नहीं; ‘ही’ हिन्दी में इसी केंद्रित बल को स्वाभाविक बनाता है।
- source_word: הַמְדַבֵּר אֲלֵיכֶם
  choice: तुमसे बात करने वाला
  rationale: संज्ञार्थक निश्चित कृदंत को हिन्दी में स्वाभाविक रूप से व्यक्त करता है और जारी प्रत्यक्ष संबोधन का भाव बनाए रखता है।
