  text: इस प्रकार शेत की कुल आयु नौ सौ बारह वर्ष हुई; फिर वह मर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: कुल आयु ... हुई
  rationale: वंशावली के इस सारांश-वाक्य में इब्रानी पदबंध किसी व्यक्ति के जीवन के सभी दिनों, अर्थात उसकी कुल आयु, को बताता है। यह हिंदी में स्वाभाविक रहते हुए मूल अर्थ को सुरक्षित रखता है।
- source_word: שֵׁת
  choice: शेत
  rationale: व्यक्तिनाम का मूल इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: नौ सौ बारह वर्ष
  rationale: इब्रानी में संख्या का क्रम शाब्दिक रूप से 'बारह वर्ष और नौ सौ वर्ष' है; आधुनिक हिंदी में उसी कुल संख्या 912 को स्वाभाविक क्रम में व्यक्त किया गया है।
- source_word: וַיָּמֹת
  choice: फिर वह मर गया
  rationale: यह वंशावली में बार-बार आने वाला समापन-सूत्र है। 'फिर' कथानक के क्रम को स्पष्ट करता और मृत्यु की सीधी, गंभीर अभिव्यक्ति बनाए रखता है।
