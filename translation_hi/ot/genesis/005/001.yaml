id: GEN.5.1
reference: Genesis 5:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זֶ֣ה סֵ֔פֶר תּוֹלְדֹ֖ת אָדָ֑ם בְּ/י֗וֹם בְּרֹ֤א אֱלֹהִים֙ אָדָ֔ם בִּ/דְמ֥וּת אֱלֹהִ֖ים עָשָׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/001.yaml
  text: This is the book of the generations of Adam[a]. In the day God created man[b], he made him in the likeness of God.
translation:
  language: hi
  text: यह आदम की वंशावली की पुस्तक है। जिस दिन[a] परमेश्वर ने मनुष्य[b] की सृष्टि की, उसने उसे परमेश्वर की समानता के अनुरूप बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरा ‘जिस दिन’ यहाँ ‘जब’ के अर्थ में भी प्रयुक्त हो सकता है।
    reason: कालवाचक मुहावरे का वैकल्पिक अर्थ।
  - marker: b
    text: इब्रानी में यहाँ वही शब्द है जिसका पहले ‘आदम’ नाम के रूप में प्रयोग हुआ है; इस स्थान पर उसका अर्थ ‘मनुष्य’ या ‘मानवजाति’ हो सकता है।
    reason: आदम/मनुष्य के शब्दार्थ की वास्तविक अस्पष्टता।
lexical_decisions:
- source_word: זֶה סֵפֶר
  choice: यह ... लेखा है
  rationale: यह पद एक शीर्षकात्मक नामवाचक वाक्य है। 'लेखा' लिखित अभिलेख या विवरण का स्वाभाविक आधुनिक हिन्दी रूप है और यहाँ वंश-सूची के आशय को स्पष्ट करता है।
- source_word: תּוֹלְדֹת
  choice: वंशावली
  rationale: यह उत्पत्ति की संरचनात्मक संज्ञा है, जिसका अर्थ पीढ़ियाँ, वंशज या उनसे संबंधित विवरण हो सकता है। अध्याय 5 की वंश-सूची के संदर्भ में 'वंशावली' स्वाभाविक और सटीक है।
- source_word: אָדָם (पहला प्रयोग)
  choice: आदम
  rationale: आगामी वंशावली के पूर्वज का व्यक्तिगत नाम अभिप्रेत है।
- source_word: בְּיוֹם בְּרֹא
  choice: जिस दिन ... सृष्टि की
  rationale: इब्रानी कालवाचक मुहावरे का औपचारिक स्वर सुरक्षित रहता है; यहाँ इसका व्यापक अर्थ 'जब' भी हो सकता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रियार्थ वाले इस संदर्भ में हिन्दी बाइबलीय गद्य का मानक, गरिमापूर्ण रूप।
- source_word: אָדָם (दूसरा प्रयोग)
  choice: मनुष्य
  rationale: यहाँ शब्द सृष्टि-वृत्तांत की ओर संकेत करते हुए मानव जाति को प्रतिनिधिक रूप से व्यक्त करता है; 'मनुष्य' हिन्दी में एकवचन रूप और सामूहिक अर्थ दोनों को स्वाभाविक रूप से रखता है।
- source_word: בִּדְמוּת
  choice: की समानता में
  rationale: דְּמוּת का सीधा अर्थ समानता या सदृशता है। इसे 'स्वरूप' या 'प्रतिरूप' कहने से צֶלֶם के साथ अनावश्यक समानीकरण हो सकता है।
- source_word: עָשָׂה אֹתוֹ
  choice: उसने उसे ... बनाया
  rationale: עשה के व्यापक अर्थ के लिए 'बनाया' उचित है और एकवचन पुल्लिंग सर्वनाम का रूप सुरक्षित रहता है।
theological_decisions:
- issue: एक ही पद में אָדָם के दो अर्थ
  choice: पहले प्रयोग में व्यक्तिगत नाम 'आदम'; दूसरे में सामान्य/प्रतिनिधिक 'मनुष्य'
  alternative: दोनों स्थानों पर 'आदम', अथवा दूसरे स्थान पर 'मानवजाति'
  rationale: पहला प्रयोग वंशावली के नामित पूर्वज को दर्शाता है, जबकि दूसरा सृष्टि-वृत्तांत की मानवता की रचना को प्रतिध्वनित करता है। 'मनुष्य' मूल के एकवचन प्रतिनिधिक रूप और व्यापक अर्थ दोनों को बनाए रखता है।
- issue: परमेश्वर से समानता की शब्दावली
  choice: '''समानता'' को बनाए रखना'
  alternative: '''स्वरूप'' या ''प्रतिरूप'''
  rationale: यहाँ मूल पाठ में דְּמוּת है, צֶלֶם नहीं; इसलिए निकटवर्ती सृष्टि-पाठ की अलग शब्दावली से इसका समानीकरण नहीं किया गया।
- issue: בְּיוֹם का कालवाचक बल
  choice: '''जिस दिन'' के रूप में मुख्य पाठ'
  alternative: '''जब'''
  rationale: '''जिस दिन'' इब्रानी अभिव्यक्ति की औपचारिक प्रतिध्वनि रखता है, पर इसे अनिवार्यतः चौबीस घंटे के कालखंड तक सीमित नहीं किया जाना चाहिए; इसीलिए पाद-टिप्पणी में मुहावरे का वैकल्पिक अर्थ दिया गया है।'
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय गद्य। 'वंशावली का लेखा' शीर्षक की औपचारिकता और अध्याय की वास्तविक विषयवस्तु दोनों को व्यक्त करता है। मुख्य पाठ में उपस्थित [a] चिह्न पाद-टिप्पणी से मेल खाता है।
