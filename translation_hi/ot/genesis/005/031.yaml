base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/031.yaml
  text: So all the days of Lamech were seven hundred seventy-seven years[a], and he died.
translation:
  language: hi
  text: इस प्रकार लेमेक की कुल आयु सात सौ सतहत्तर वर्ष[a] थी, और वह मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में संख्या का शाब्दिक क्रम है, “सात और सत्तर वर्ष, और सात सौ वर्ष,” अर्थात 777 वर्ष।
    reason: मूल इब्रानी में संख्या के भिन्न क्रम को स्पष्ट करना।
lexical_decisions:
- source_word: וַיְהִי
  choice: इस प्रकार ... हुए
  rationale: वाव-क्रमिक रूप वंशावली में लेमेक के जीवन का सार प्रस्तुत करता है। ‘इस प्रकार’ पूर्ववर्ती विवरण से स्वाभाविक संबंध रखता है और ‘हुए’ हिन्दी में कथन को पूरा करता है।
- source_word: כָּל יְמֵי
  choice: जीवन के कुल दिन
  rationale: मूल के ‘सभी दिन’ वाले जीवन-अवधि संबंधी मुहावरे को स्पष्ट, स्वाभाविक हिन्दी में रखते हुए ‘दिन’ की छवि भी सुरक्षित रखी गई है।
- source_word: לֶמֶךְ
  choice: लेमेक
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी लिप्यंतरण।
- source_word: שֶׁבַע וְשִׁבְעִים ... וּשְׁבַע מֵאוֹת
  choice: सात सौ सतहत्तर
  rationale: इब्रानी क्रम इकाई, दहाई और फिर सैकड़े देता है; आधुनिक हिन्दी में कुल संख्या 777 को स्वाभाविक क्रम में व्यक्त किया गया है।
- source_word: שָׁנָה
  choice: वर्ष
  rationale: संख्या के बाद ‘वर्ष’ आधुनिक मानक हिन्दी में स्वाभाविक सामूहिक रूप है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: उत्पत्ति 5 के बार-बार आने वाले समापन सूत्र को सीधा और गंभीर रूप देते हुए कथात्मक ‘और’ सुरक्षित रखा गया है।
theological_decisions:
- issue: उत्पत्ति 5 में वंशावली की जीवन-अवधि का सूत्र
  choice: आयु को बिना व्याख्यात्मक योग्यता के सीधे ऐतिहासिक जीवन-अवधि के सार के रूप में प्रस्तुत किया गया है।
  alternative: संख्याओं को अनुवाद में प्रतीकात्मक बताना।
  rationale: इब्रानी पाठ एक सीधी संख्यात्मक जीवन-अवधि और मृत्यु-सूचना देता है; अनुवाद में ऐसी प्रतीकात्मक या संशयवादी व्याख्या नहीं जोड़ी जानी चाहिए जो पाठ स्वयं नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘जीवन के कुल दिन’ मूल मुहावरे की औपचारिक छवि और हिन्दी की स्पष्टता के बीच संतुलन रखता है।
