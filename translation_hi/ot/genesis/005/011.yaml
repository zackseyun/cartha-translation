  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: कुल आयु ... हुई
  rationale: वंशावली के इस रूढ़ इब्रानी पदबंध का आशय जीवन के कुल वर्षों से है। हिंदी में यह स्वाभाविक और स्पष्ट है, जबकि शब्दशः ‘सारे दिन हुए’ असहज होता।
- source_word: אֱנוֹשׁ
  choice: एनोश
  rationale: नाम का लिप्यंतरण इब्रानी उच्चारण के निकट रखा गया है।
- source_word: חָמֵשׁ שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: नौ सौ पाँच वर्ष
  rationale: इब्रानी में संख्या का क्रम ‘पाँच और नौ सौ’ है; आधुनिक हिंदी में कुल संख्या स्वाभाविक क्रम में दी गई है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: अध्याय की मानक समापन उक्ति को सीधा और स्पष्ट रखा गया है।
