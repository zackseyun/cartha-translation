lexical_decisions:
- source_word: וַיְחִי
  choice: जब ... नब्बे वर्ष का हुआ
  rationale: वंशावली के इस आयु-सूचक सूत्र में क्रिया חיה का अर्थ उस आयु तक जीवित रहना है; हिंदी में अगली क्रिया से जोड़कर यह रूप स्वाभाविक और सटीक है।
- source_word: אֱנוֹשׁ
  choice: एनोश
  rationale: यह रूप इब्रानी नाम אֱנוֹשׁ का सीधा देवनागरी लिप्यंतरण है।
- source_word: תִּשְׁעִים שָׁנָה
  choice: नब्बे वर्ष
  rationale: आयु बताने के लिए आधुनिक मानक हिंदी में यह स्वाभाविक रूप है।
- source_word: וַיּוֹלֶד
  choice: उससे ... उत्पन्न हुआ
  rationale: हिफ़ील रूप पुरुष पूर्वज के द्वारा संतान उत्पन्न होने को व्यक्त करता है। यह हिंदी वंशावली-शैली में स्वाभाविक है और पुरातन या अत्यधिक तकनीकी शब्दावली से बचता है।
- source_word: אֶת
  choice: अलग से अनूदित नहीं
  rationale: यह निश्चित कर्म का व्याकरणिक चिह्न है; हिंदी वाक्य-विन्यास में इसका स्वतंत्र अनुवाद आवश्यक नहीं।
- source_word: קֵינָן
  choice: केनान
  rationale: यह इब्रानी मासोरेटिक रूप קֵינָן का सीधा देवनागरी लिप्यंतरण है।
