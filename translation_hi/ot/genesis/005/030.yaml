  text: And Lamech lived five hundred and ninety-five years after he fathered Noah[a], and he fathered sons and daughters.
translation:
  language: hi
  text: और नूह का पिता बनने के बाद लेमेक पाँच सौ पंचानवे वर्ष जीवित रहा, और उसके बेटे और बेटियाँ हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के इस सूत्र में यह क्रिया किसी घटना के बाद बीती जीवन-अवधि बताती है; ‘जीवित रहा’ स्वाभाविक और सटीक हिन्दी है।
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־נֹחַ
  choice: नूह को जन्म देने के बाद
  rationale: हिफ़ील रूप पिता द्वारा संतान उत्पन्न करने को व्यक्त करता है। हिन्दी में पुरुष कर्ता के साथ ‘जन्म देना’ सहज है और प्रसंग में पितृत्व स्पष्ट रहता है।
- source_word: נֹחַ
  choice: नूह
  rationale: नाम का प्रचलित मानक हिन्दी बाइबलीय रूप रखा गया है।
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וַחֲמֵשׁ מֵאוֹת שָׁנָה
  choice: पाँच सौ पंचानवे वर्ष
  rationale: इब्रानी क्रम 95 + 500 है; हिन्दी की स्वाभाविक संख्या-पद्धति में कुल 595 को ‘पाँच सौ पंचानवे’ कहा गया है।
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: उसके और भी बेटे-बेटियाँ हुए
  rationale: इब्रानी स्पष्ट रूप से पुत्रों और पुत्रियों का उल्लेख करता है। हिन्दी में बाद की संतानों के लिए यह स्वाभाविक अभिव्यक्ति है; ‘और भी’ वंशावली के प्रसंग से स्पष्ट करता है कि नूह के अतिरिक्त संतानें हुईं।
