  yaml_path: translation/ot/genesis/005/015.yaml
  text: Mahalalel lived sixty-five years and fathered Jared.
translation:
  language: hi
  text: महललेल पैंसठ वर्ष का हुआ, तब वह येरेद का पिता बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जब … वर्ष का हुआ
  rationale: वंशावली के इस सूत्र में חיה व्यक्ति की उस आयु को बताता है जिस पर अगली घटना हुई। स्वाभाविक आधुनिक हिन्दी में इसे कालवाचक उपवाक्य के रूप में व्यक्त किया गया है।
- source_word: מַהֲלַלְאֵל
  choice: महललेल
  rationale: व्यक्तिवाचक नाम का अनुवाद करने के बजाय इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה
  choice: पैंसठ वर्ष
  rationale: इब्रानी में संख्या का क्रम ‘पाँच और साठ’ है; आधुनिक हिन्दी में ठीक वही संख्या स्वाभाविक क्रम में ‘पैंसठ’ कही जाती है।
- source_word: וַיּוֹלֶד
  choice: उसने … को जन्म दिया
  rationale: हिफ़ील रूप पुरुष वंशावली में संतान उत्पन्न करने, अर्थात पिता बनने, को व्यक्त करता है। हिन्दी बाइबलीय वंशावलियों में यह स्पष्ट और प्रचलित अभिव्यक्ति है तथा इसका कर्ता महललेल ही रहता है।
- source_word: אֶת יָרֶד
  choice: येरेद को
  rationale: אֶת निश्चित प्रत्यक्ष कर्म का चिह्न है, जिसे हिन्दी में कर्मसूचक ‘को’ से व्यक्त किया गया है; יָרֶד का इब्रानी-निकट लिप्यंतरण ‘येरेद’ है।
