  yaml_path: translation/ot/genesis/005/028.yaml
  text: And Lamech lived one hundred and eighty-two years, and fathered a son.
translation:
  language: hi
  text: लेमेक एक सौ बयासी वर्ष का था जब वह एक पुत्र का पिता बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जब ... वर्ष का हुआ
  rationale: वंशावली के इस सूत्र में חיה अगले प्रसंग से पहले की आयु बताता है। हिंदी में ‘जब लेमेक ... वर्ष का हुआ’ संख्या और अगली क्रिया का संबंध स्वाभाविक तथा स्पष्ट रूप से व्यक्त करता है।
- source_word: לֶמֶךְ
  choice: लेमेक
  rationale: इब्रानी व्यक्तिगत नाम का आधुनिक हिंदी में प्रचलित लिप्यंतरण।
- source_word: שְׁתַּיִם וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: एक सौ बयासी वर्ष
  rationale: इब्रानी संख्या-क्रम को मानक हिंदी संख्या-क्रम में स्वाभाविक ढंग से प्रस्तुत किया गया है।
- source_word: וַיּוֹלֶד
  choice: उससे ... उत्पन्न हुआ
  rationale: पुल्लिंग कर्ता के साथ हिफ़ील ילד संतान उत्पन्न करने अर्थात पिता बनने को दर्शाता है। ‘उससे ... उत्पन्न हुआ’ आधुनिक, गरिमापूर्ण हिंदी में वंशावली का अर्थ स्पष्ट करता है और पुराने ‘जन्माया’ से अधिक स्वाभाविक है।
- source_word: בֵּן
  choice: एक पुत्र
  rationale: בֵּן का अर्थ ‘पुत्र’ है; यहाँ पुत्र का नाम अभी नहीं दिया गया, इसलिए ‘एक’ स्वाभाविक अनिश्चितता व्यक्त करता है।
