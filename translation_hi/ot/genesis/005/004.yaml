  text: After he fathered Seth[a], Adam lived eight hundred years and fathered sons and daughters.
translation:
  language: hi
  text: शेत का पिता बनने के बाद आदम आठ सौ वर्ष जीवित रहा और उसने बेटे-बेटियाँ उत्पन्न कीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי אָדָם
  choice: आदम ... जीवित रहा
  rationale: इब्रानी का शाब्दिक रूप ‘आदम के दिन ... हुए’ जीवन-अवधि बताने वाला मुहावरा है; आधुनिक हिन्दी में ‘जीवित रहा’ उसका स्वाभाविक और सटीक अर्थ देता है।
- source_word: אָדָם
  choice: आदम
  rationale: वंशावली के इस प्रसंग में यह सामान्य ‘मनुष्य’ नहीं, व्यक्ति का नाम है।
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־שֵׁת
  choice: शेत को जन्म देने के बाद
  rationale: हिफ़ील रूप पुरुष द्वारा संतान उत्पन्न करने का बोध कराता है। हिन्दी में पिता के विषय में भी ‘जन्म देना’ प्रचलित है और यहाँ वंशोत्पत्ति का अर्थ स्पष्ट रखता है।
- source_word: שְׁמֹנֶה מֵאֹת שָׁנָה
  choice: आठ सौ वर्ष
  rationale: यह अवधि बताने वाली सीधी संख्या-अभिव्यक्ति है।
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: उसके और भी बेटे-बेटियाँ पैदा हुए
  rationale: इब्रानी स्पष्ट रूप से पुत्रों और पुत्रियों दोनों का उल्लेख करता है। प्रसंगानुसार ‘और भी’ यह स्पष्ट करता है कि शेत के अतिरिक्त अन्य संतानें हुईं।
theological_decisions:
- issue: אָדָם का अर्थ
  choice: व्यक्तिनाम ‘आदम’
  alternative: ‘मनुष्य’
  rationale: तत्कालीन वंशावली-संदर्भ में यह नामित व्यक्ति आदम को दर्शाता है, मानवजाति को सामान्य रूप से नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। मूल इब्रानी की जीवन-अवधि वाली मुहावरेदार रचना को स्वाभाविक हिन्दी में व्यक्त किया गया है।
