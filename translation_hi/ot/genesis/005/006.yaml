  yaml_path: translation/ot/genesis/005/006.yaml
  text: Seth lived 105 years and fathered Enosh[a].
translation:
  language: hi
  text: शेत 105 वर्ष का हुआ और एनोश का पिता बना[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक औपचारिक रूप में, «एनोश को जन्म दिया।»
