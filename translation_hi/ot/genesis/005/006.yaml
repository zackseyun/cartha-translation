lexical_decisions:
- source_word: וַיְחִי
  choice: वर्ष का हुआ
  rationale: वंशावली के इस आयु-सूत्र में חיה बताता है कि अगली उल्लिखित घटना के समय शेत की आयु कितनी थी। प्राकृतिक हिन्दी में इसे संख्या के साथ ‘वर्ष का हुआ’ कहना स्पष्ट है।
- source_word: שֵׁת
  choice: शेत
  rationale: इब्रानी שֵׁת का मानक हिन्दी लिप्यंतरण।
- source_word: חָמֵשׁ שָׁנִים וּמְאַת שָׁנָה
  choice: 105 वर्ष
  rationale: इब्रानी पदबंध का शाब्दिक क्रम ‘पाँच वर्ष और एक सौ वर्ष’ है, जिसका अर्थ 105 वर्ष है; आधुनिक हिन्दी में अंकों का प्रयोग सहज और सटीक है।
- source_word: וַיּוֹלֶד
  choice: उसने … को जन्म दिया
  rationale: हिफ़ील रूप वंशावली में संतान उत्पन्न करने या पिता बनने को व्यक्त करता है। पुरुष कर्ता के लिए हिन्दी में ‘जन्म दिया’ का प्रयोग बाइबलीय वंशावलियों में प्रचलित और सामान्य पाठक के लिए बोधगम्य है।
- source_word: אֶת אֱנוֹשׁ
  choice: एनोश को
  rationale: אֶת प्रत्यक्ष कर्म को चिह्नित करता है और हिन्दी में ‘को’ से व्यक्त हुआ है; אֱנוֹשׁ का स्रोत-सापेक्ष लिप्यंतरण ‘एनोश’ है।
