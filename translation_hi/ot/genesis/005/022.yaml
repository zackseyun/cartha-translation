base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/022.yaml
  text: Enoch walked with God three hundred years after he fathered Methuselah[b][a], and he fathered sons and daughters.
translation:
  language: hi
  text: मतूशेलह का पिता बनने के बाद हनोक तीन सौ वर्ष तक परमेश्वर के साथ चलता रहा,[a] और उसके बेटे और बेटियाँ हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के साथ संगति में जीवन बिताता रहा।” इब्रानी मुहावरे का शाब्दिक अर्थ है, “परमेश्वर के साथ चलता रहा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: चलता रहा
  rationale: हित्पएल रूप यहाँ जीवन के निरंतर आचरण का रूपक है। ‘चलता रहा’ मूल रूपक और दीर्घकालिक भाव दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֶת הָאֱלֹהִים
  choice: परमेश्वर के साथ
  rationale: इस मुहावरे में אֶת संबंध और संगति का भाव देता है। ‘परमेश्वर के साथ’ हिन्दी में स्वाभाविक है और मूल के संबंधपरक रूपक को सुरक्षित रखता है।
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־מְתוּשֶׁלַח
  choice: मतूशेलह को जन्म देने के बाद
  rationale: אַחֲרֵי का काल-संबंध स्पष्ट है। पुरुष कर्ता के लिए ‘जन्म देने’ का प्रयोग वंशावली की हिन्दी में सहज है और हिफ़ील הוֹלִידוֹ के पितृत्व-संबंधी अर्थ को व्यक्त करता है।
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: तीन सौ वर्ष तक
  rationale: ‘तक’ हिन्दी में उस अवधि को स्पष्ट रूप से ‘चलता रहा’ से जोड़ता है और यह गलत आभास नहीं होने देता कि संख्या मतूशेलह के जन्म से जुड़ी है।
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: और उसके बेटे-बेटियाँ हुए
  rationale: मूल में पुत्रों और पुत्रियों दोनों का स्पष्ट उल्लेख है। हिन्दी वंशावली-शैली में यह स्वाभाविक है और अनावश्यक रूप से पुरातन ‘उत्पन्न किया’ से बचता है।
- source_word: מְתוּשֶׁלַח
  choice: मतूशेलह
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
theological_decisions:
- issue: हनोक और परमेश्वर के संबंध को व्यक्त करने वाला ‘परमेश्वर के साथ चलना’ मुहावरा
  choice: मुख्य पाठ में ‘परमेश्वर के साथ चलता रहा’ रूपक को बनाए रखा गया
  alternative: परमेश्वर के साथ संगति में जीवन बिताता रहा
  rationale: मूल का रूपक धर्मवैचारिक और साहित्यिक महत्व रखता है। व्याख्यात्मक विकल्प अर्थ को संकरा कर सकता है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बेटे-बेटियाँ’ मूल के लिंग-विशिष्ट बहुवचन को सुरक्षित रखता है; ‘तीन सौ वर्ष तक’ अवधि का संबंध स्पष्ट करता है।
