  text: So all the days of Kenan were nine hundred and ten years[b][a], and he died.
translation:
  language: hi
  text: इस प्रकार केनान की कुल आयु नौ सौ दस वर्ष हुई, और वह मर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: इस प्रकार ... की कुल आयु ... हुई
  rationale: वंशावली के क्रम को ‘इस प्रकार’ से जोड़ा गया है। शाब्दिक ‘सारे दिन’ के बजाय इस सूत्र का स्वाभाविक हिन्दी अर्थ ‘कुल आयु’ रखा गया है।
- source_word: קֵינָן
  choice: केनान
  rationale: यह रूप इब्रानी नाम के उच्चारण को सीधे देवनागरी में प्रस्तुत करता है।
- source_word: עֶשֶׂר שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: नौ सौ दस वर्ष
  rationale: इब्रानी में संख्या का क्रम ‘दस और नौ सौ’ है; आधुनिक हिन्दी में इसे स्वाभाविक क्रम में रखा गया है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: वंशावली के समापन-सूत्र को सीधे, सरल और गरिमापूर्ण हिन्दी में रखा गया है।
