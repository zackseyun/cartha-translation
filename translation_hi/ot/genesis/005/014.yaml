  register: आधुनिक मानक हिन्दी; वंशावली की संक्षिप्त, आवर्ती लय और गंभीर स्वर सुरक्षित रखा गया है। अनावश्यक पादटिप्पणी नहीं दी गई, क्योंकि ‘केनान’ इब्रानी रूप का स्पष्ट लिप्यंतरण है और ‘कुल आयु’ सूत्र का स्वाभाविक अर्थ व्यक्त करता है।
