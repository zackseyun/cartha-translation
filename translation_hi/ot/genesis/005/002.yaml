  text: Male and female he created them[a], and he blessed them and called their name Man on the day they were created.
translation:
  language: hi
  text: नर और नारी के रूप में उसने उनकी सृष्टि की, उन्हें आशीष दी, और जिस दिन उनकी सृष्टि हुई, उस दिन उसने उनका नाम “मनुष्य”[a] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द ‘आदम’ का अर्थ सामूहिक रूप से ‘मनुष्य’ या ‘मानवजाति’ हो सकता है, और यह व्यक्तिगत नाम ‘आदम’ भी है।
    reason: alternative_reading
lexical_decisions:
- source_word: זָכָר וּנְקֵבָה
  choice: नर और नारी के रूप में
  rationale: यह जोड़ी सृष्टि के प्रसंग में पुरुष और स्त्री के लैंगिक भेद को व्यक्त करती है। हिंदी में केवल ‘नर और मादा’ मनुष्यों के लिए अस्वाभाविक लगता है, जबकि ‘पुरुष और स्त्री’ अगले सामूहिक नाम के साथ भ्रम पैदा कर सकता है; यह रूप अर्थ और स्वाभाविकता दोनों रखता है।
- source_word: בְּרָאָם
  choice: उसने उनकी सृष्टि की
  rationale: काल पूर्ण हुई सृष्टि की क्रिया बताता है और बहुवचन प्रत्यय दोनों को समेटता है।
- source_word: וַיְבָרֶךְ אֹתָם
  choice: और उन्हें आशीष दी
  rationale: ברך के लिए प्रचलित, गरिमापूर्ण और स्पष्ट हिंदी अभिव्यक्ति।
- source_word: וַיִּקְרָא אֶת־שְׁמָם
  choice: उसने उनका नाम … रखा
  rationale: इब्रानी में एकवचन ‘नाम’ और बहुवचन ‘उनका’ है; हिंदी का यह नामकरण-वाक्य उसी सामूहिक नाम को स्वाभाविक रूप से बनाए रखता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ नर और नारी दोनों को एक ही सामूहिक नाम दिया गया है, इसलिए ‘मनुष्य’ प्राथमिक अर्थ को व्यक्त करता है। इब्रानी रूप ‘आदम’ व्यक्तिगत नाम भी हो सकता है; यह संभावना पादटिप्पणी में सुरक्षित है।
- source_word: בְּיוֹם הִבָּרְאָם
  choice: जिस दिन उनकी सृष्टि हुई
  rationale: समय-संबंधी ‘जिस दिन’ तथा निफ़अल के कर्मवाच्य भाव दोनों को स्पष्ट और स्वाभाविक हिंदी में रखता है।
theological_decisions:
- issue: אָדָם का सामूहिक मानवीय पहचान अथवा व्यक्तिगत नाम के रूप में अर्थ
  choice: मुख्य पाठ में “मनुष्य”
  alternative: “आदम”
  rationale: तात्कालिक संदर्भ नर और नारी दोनों को दिए गए एक नाम की बात करता है, इसलिए सामूहिक अर्थ प्रमुख है। फिर भी यही इब्रानी शब्द वंशावली में व्यक्तिगत नाम ‘आदम’ भी है; पाठ की वास्तविक अर्थ-द्विविधा पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘उनका नाम मनुष्य रखा’ सामूहिक एकवचन को बनाए रखता है। मुख्य पाठ का [a] चिह्न אָדָם से जुड़ी अर्थ-द्विविधा की पादटिप्पणी की ओर संकेत करता है।
