  rationale: हिफ़ील הוֹלִיד वंशावली में संतान उत्पन्न करने अथवा उसका पिता बनने का भाव रखता है। पुरुष के लिए हिन्दी में ‘जन्म देने’ की अपेक्षा ‘पिता बनने’ का प्रयोग अधिक स्वाभाविक है।
- source_word: חֲמֵשׁ עֶשְׂרֵה ... וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: आठ सौ पंद्रह वर्ष
  rationale: इब्रानी में संख्या 15 + 800 के क्रम में है; हिन्दी में कुल अवधि को ‘आठ सौ पंद्रह वर्ष’ कहना स्वाभाविक है।
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: और उसके बेटे और बेटियाँ भी हुए
  rationale: इब्रानी स्पष्ट रूप से पुत्रों और पुत्रियों दोनों का उल्लेख करता है। हिन्दी में यह रचना स्वाभाविक है और ‘भी’ नामित पुत्र के अतिरिक्त अन्य संतानों का संदर्भ स्पष्ट करता है।
