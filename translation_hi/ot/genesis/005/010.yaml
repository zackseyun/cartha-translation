  yaml_path: translation/ot/genesis/005/010.yaml
  text: And Enosh lived eight hundred and fifteen years after he fathered Kenan[c][b][a], and he fathered sons and daughters.
translation:
  language: hi
  text: केनान[b] का पिता बनने[a] के बाद एनोश आठ सौ पंद्रह वर्ष जीवित रहा[c], और वह बेटों और बेटियों का भी पिता बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उत्पन्न करने”; परंपरागत हिन्दी में “उत्पन्न किया” भी कहा जाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी नाम “केनान” है; यूनानी से प्रभावित परंपरागत रूपों में “कैनान” मिलता है।
    reason: alternative_reading
  - marker: c
    text: 'इसे इस प्रकार भी रखा जा सकता है: “और एनोश, केनान का पिता बनने के बाद, आठ सौ पंद्रह वर्ष जीवित रहा।”'
    reason: source_word_order
lexical_decisions:
