id: GEN.5.3
reference: Genesis 5:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יְחִ֣י אָדָ֗ם שְׁלֹשִׁ֤ים וּ/מְאַת֙ שָׁנָ֔ה וַ/יּ֥וֹלֶד בִּ/דְמוּת֖/וֹ כְּ/צַלְמ֑/וֹ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵֽׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/003.yaml
  text: Adam lived one hundred thirty years and fathered a son in his likeness[a], according to his image[c][b], and called his name Seth.
translation:
  language: hi
  text: आदम एक सौ तीस वर्ष का हुआ, तब उसने अपने समान[a], अपने स्वरूप के अनुसार[b], एक पुत्र उत्पन्न किया और उसका नाम शेत रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी समानता में।”
    reason: मूल इब्रानी की स्थानवाचक अभिव्यक्ति दिखाने के लिए।
  - marker: b
    text: “अपने समान, अपने स्वरूप के अनुसार” शब्दावली उत्पत्ति 1:26–27 की प्रतिध्वनि है।
    reason: महत्त्वपूर्ण अंतर्पाठीय संबंध बताने के लिए।
lexical_decisions:
- source_word: וַיְחִי
  choice: एक सौ तीस वर्ष का हुआ
  rationale: वंशावली के इस आयु-सूत्र में חיה का आशय उस समय तक जीवित रहने और बताई गई आयु तक पहुँचने से है; आधुनिक हिन्दी में यह रूप स्वाभाविक है।
- source_word: אָדָם
  choice: आदम
  rationale: यहाँ शब्द सामान्य ‘मनुष्य’ नहीं, वंशावली में व्यक्ति के नाम के रूप में प्रयुक्त है।
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: एक सौ तीस वर्ष
  rationale: इब्रानी संख्या-पद और स्पष्ट ‘वर्ष’ का सीधा हिन्दी रूप।
- source_word: וַיּוֹלֶד
  choice: एक पुत्र उत्पन्न किया
  rationale: हिफ़ील में पुरुष कर्ता के साथ ילד का अर्थ संतान उत्पन्न करना/पिता बनना है। ‘पुत्र’ अगले नामकरण और शेत के संदर्भ से निहित है तथा हिन्दी में वाक्य को स्पष्ट बनाता है।
- source_word: בִּדְמוּתוֹ
  choice: अपने समान
  rationale: דמות समानता या सदृशता दर्शाता है। यह सरल हिन्दी है और उत्पत्ति 1:26 की प्रतिध्वनि बनाए रखता है।
- source_word: כְּצַלְמוֹ
  choice: अपने स्वरूप के अनुसार
  rationale: צלם के लिए ‘स्वरूप’ और כ के लिए ‘के अनुसार’ रखने से דמות और צלם की अलग शब्दावली तथा मूल की समानांतर रचना सुरक्षित रहती है।
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ שֵׁת
  choice: उसका नाम शेत रखा
  rationale: शाब्दिक मुहावरा ‘उसका नाम पुकारा’ है, पर आधुनिक हिन्दी में ‘नाम रखा’ उसका स्वाभाविक और सटीक समतुल्य है।
- source_word: שֵׁת
  choice: शेत
  rationale: इब्रानी व्यक्तिगत नाम שֵׁת का निकट देवनागरी लिप्यंतरण।
theological_decisions:
- issue: आदम के पुत्र का आदम की समानता और स्वरूप में होना
  choice: वाक्य को आदम से पुत्र की सदृशता के रूप में सीधे प्रस्तुत किया गया और उत्पत्ति 1:26–27 की शब्दगत प्रतिध्वनि सुरक्षित रखी गई।
  alternative: इसे पतन के बाद परमेश्वर के स्वरूप के घटने या मिटने का स्पष्ट कथन मानना।
  rationale: पद प्रतिध्वनि तो उत्पन्न करता है, पर उसके व्यापक धर्मवैज्ञानिक परिणाम स्वयं नहीं समझाता; इसलिए अनुवाद उस तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘एक सौ तीस वर्ष का हुआ, तब’ इब्रानी वंशावली-सूत्र को स्वाभाविक हिन्दी में व्यक्त करता है। समानता और स्वरूप की दो अलग संज्ञाएँ जानबूझकर बनाए रखी गई हैं।
