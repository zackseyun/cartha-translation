  yaml_path: translation/ot/genesis/005/005.yaml
  text: So all the days of Adam that he lived were nine hundred and thirty years[a], and he died.
translation:
  language: hi
  text: इस प्रकार आदम के जीवन के कुल दिन नौ सौ तीस वर्ष हुए[a], और वह मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द ‘आदम’ का अर्थ कुछ संदर्भों में ‘मनुष्य’ या ‘मानवजाति’ हो सकता है, पर यहाँ वंशावली में यह व्यक्ति आदम को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: हुए
  rationale: वंशावली के इस सारांश-वाक्य में היה का रूप कुल आयु बताता है; हिंदी में ‘हुए’ स्वाभाविक है और मूल सूत्र की संरचना भी बनाए रखता है।
- source_word: כָּל יְמֵי
  choice: उसके कुल दिन
  rationale: यह चयन जीवन को ‘दिनों’ में गिनने वाली इब्रानी अभिव्यक्ति और उत्पत्ति 5 के दोहराए जाने वाले वंशावली-सूत्र को सुरक्षित रखता है।
- source_word: אָדָם
  choice: आदम
  rationale: इस वंशावली-संदर्भ में यह सामान्य ‘मनुष्य/मानवजाति’ नहीं, बल्कि व्यक्ति का नाम है; इसलिए नाम का लिप्यंतरण किया गया है।
- source_word: אֲשֶׁר חַי
  choice: जितने दिन जीवित रहा
  rationale: सम्बन्धवाचक उपवाक्य ‘दिनों’ से जुड़ा है; यह हिंदी में स्वाभाविक रहते हुए उसके जीवन के सभी दिनों का अर्थ व्यक्त करता है।
- source_word: תְּשַׁע מֵאוֹת ... וּשְׁלֹשִׁים שָׁנָה
  choice: नौ सौ तीस वर्ष
  rationale: संख्या को शब्दों में देना वंशावली के साहित्यिक और गरिमापूर्ण स्वर के अनुरूप है।
- source_word: וַיָּמֹת
  choice: फिर वह मर गया
  rationale: यह अध्याय में बार-बार आने वाले मृत्यु-सूत्र को संक्षेप और स्पष्टता से रखता है; ‘मर गया’ मूल की सीधी और गंभीर अभिव्यक्ति है।
theological_decisions:
- issue: אָדָם का अर्थ
  choice: व्यक्तिनाम ‘आदम’
  alternative: ‘मनुष्य’ या ‘मानवजाति’
  rationale: शब्द अन्य संदर्भों में ‘मनुष्य/मानवजाति’ हो सकता है, पर उत्पत्ति 5:5 की वंशावली में यह नामित व्यक्ति को दर्शाता है।
- issue: मृत्यु-सूत्र का संरक्षण
  choice: ‘फिर वह मर गया’
  alternative: मृत्यु को नरम करने वाला भावानुवाद
  rationale: मूल पाठ का दोहराया हुआ निष्कर्ष मानव मृत्यु की गंभीरता को सामने रखता है; अनुवाद इसे बिना नरम किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण वंशावली-शैली अपनाई गई है। ‘कुल दिन’ मूल इब्रानी मुहावरे और अध्याय के आवर्ती सूत्र को बनाए रखता है; विरामचिह्न हिंदी में वाक्य का प्रवाह स्पष्ट करते हैं।
