  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के इस सूत्र में यह क्रिया निर्दिष्ट घटना के बाद जीवन की अवधि बताती है; ‘जीवित रहा’ स्वाभाविक और अर्थसंगत है।
- source_word: אַחֲרֵי
  choice: के बाद
  rationale: यह एनोश के जन्म के बाद की अवधि का स्पष्ट कालवाचक संकेत है।
- source_word: הוֹלִידוֹ אֶת־אֱנוֹשׁ
  choice: एनोश को जन्म देने
  rationale: हिफ़ील रूप पुरुष कर्ता द्वारा संतान उत्पन्न करने का वंशावलीगत अर्थ देता है। आधुनिक हिन्दी में ‘जन्म देने’ सहज है और शेत कर्ता बना रहता है।
- source_word: שֶׁבַע שָׁנִים וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: आठ सौ सात वर्ष
  rationale: इब्रानी में इकाई सैकड़ों से पहले है; हिन्दी की स्वाभाविक संख्या-रचना में कुल संख्या ‘आठ सौ सात’ होती है।
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: और उसके और भी बेटे-बेटियाँ हुईं
  rationale: यह इब्रानी के पुरुष और स्त्री दोनों प्रकार की संतानों को स्पष्ट रखता है। ‘और भी’ एनोश के अतिरिक्त संतानों का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
