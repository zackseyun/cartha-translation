  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: कुल आयु ... हुई
  rationale: शाब्दिक अर्थ ‘उसके सब दिन हुए’ है, पर वंशावली के इस योगसूचक सूत्र को आधुनिक स्वाभाविक हिन्दी में ‘कुल आयु ... हुई’ स्पष्ट रूप से व्यक्त करता है।
- source_word: מְתוּשֶׁלַח
  choice: मतूशेलह
  rationale: इब्रानी नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण।
- source_word: תֵּשַׁע וְשִׁשִּׁים ... וּתְשַׁע מֵאוֹת
  choice: नौ सौ उनहत्तर
  rationale: इब्रानी में इकाई-दहाई और सैकड़े का क्रम हिन्दी से भिन्न है; आधुनिक हिन्दी संख्या-क्रम में स्वाभाविक अनुवाद किया गया है।
- source_word: שָׁנָה ... שָׁנָה
  choice: वर्ष
  rationale: दोहराए गए इब्रानी संख्या-विन्यास को हिन्दी में एक संयुक्त संख्या के बाद ‘वर्ष’ रखकर स्वाभाविक बनाया गया है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: वंशावली के मानक समापन-सूत्र को सीधे और स्पष्ट रूप में रखा गया है।
