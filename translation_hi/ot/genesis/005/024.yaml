base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/024.yaml
  text: Enoch walked with God[a], and he was no more, because God took him.
translation:
  language: hi
  text: हनोक परमेश्वर के साथ चलता रहा, और वह नहीं रहा[a], क्योंकि परमेश्वर ने उसे ले लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “और वह नहीं था।” इब्रानी अभिव्यक्ति बताती है कि हनोक अब उपस्थित नहीं था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: चलता रहा
  rationale: हित्पएल रूप निरंतर जीवन-चाल या आचरण का भाव देता है; ‘चलता रहा’ इब्रानी रूपक और उसकी सततता दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֶת הָאֱלֹהִים
  choice: परमेश्वर के साथ
  rationale: הלך के साथ אֶת संगति या साथ होने का अर्थ देता है; यह सम्बन्धात्मक भाव को सुरक्षित रखता है।
- source_word: וְאֵינֶנּוּ
  choice: फिर वह नहीं रहा
  rationale: शाब्दिक अर्थ ‘और वह नहीं था’ है। ‘फिर वह नहीं रहा’ उसकी अनुपस्थिति बताता है, पर उसके साथ वास्तव में क्या हुआ इसे आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह हनोक के उपस्थित न रहने का कारण प्रस्तुत करता है।
- source_word: לָקַח אֹתוֹ
  choice: उसे उठा लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है। इस प्रसंग में ‘उठा लिया’ हिन्दी में परमेश्वर द्वारा असाधारण रूप से अपने पास ले लिए जाने का संकेत देता है, फिर भी गन्तव्य या रीति को स्पष्ट नहीं करता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस कथात्मक प्रसंग में यह इस्राएल के एकमात्र परमेश्वर को सूचित करता है; मानक हिन्दी बाइबलीय प्रयोग में ‘परमेश्वर’ उपयुक्त है।
theological_decisions:
- issue: क्या यह स्पष्ट किया जाए कि हनोक मरा नहीं अथवा स्वर्ग उठा लिया गया
  choice: 'संयत कथन रखा गया: ‘फिर वह नहीं रहा, क्योंकि परमेश्वर ने उसे उठा लिया।’'
  alternative: ‘वह मरा नहीं’ अथवा ‘परमेश्वर उसे स्वर्ग ले गया’
  rationale: इब्रानी पाठ असाधारण दैवीय हस्तक्षेप का संकेत देता है, पर इस पद में न तो ‘स्वर्ग’ कहता है और न सीधे मृत्यु का निषेध करता है। इसलिए बाद की व्याख्या को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘चलता रहा’ से निरंतर जीवन-व्यवहार का इब्रानी रूपक बचाया गया है। मुख्य पाठ में [a] चिह्न उपस्थित है।
