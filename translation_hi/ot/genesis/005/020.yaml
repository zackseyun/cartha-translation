  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: इस प्रकार ... हुई
  rationale: वंशावली में यह क्रिया जीवन-वर्षों का सार प्रस्तुत करती है। ‘इस प्रकार’ कथात्मक क्रम और निष्कर्षसूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל יְמֵי
  choice: कुल आयु
  rationale: शाब्दिक ‘सारे दिन’ यहाँ व्यक्ति के संपूर्ण जीवनकाल का वंशावली-सूत्र है; ‘कुल आयु’ आधुनिक हिन्दी में वही अर्थ स्पष्ट और संक्षिप्त रूप से देता है।
- source_word: יֶרֶד
  choice: येरेद
  rationale: यह रूप इब्रानी नाम יֶרֶד के उच्चारण को सीधे देवनागरी में दर्शाता है।
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: नौ सौ बासठ वर्ष
  rationale: इब्रानी संख्या ‘बासठ और नौ सौ’ को आधुनिक हिन्दी के स्वाभाविक संख्या-क्रम में रखा गया है और दो बार आए ‘वर्ष’ को एक बार व्यक्त किया गया है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: उत्पत्ति 5 के मानक समापन-सूत्र को सरल और स्पष्ट हिन्दी में सुरक्षित रखा गया है।
