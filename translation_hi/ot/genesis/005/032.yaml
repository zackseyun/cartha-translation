  yaml_path: translation/ot/genesis/005/032.yaml
  text: When Noah was five hundred years old[a], he fathered Shem, Ham[b], and Japheth.
translation:
  language: hi
  text: जब नूह पाँच सौ वर्ष का था, तब वह शेम, हाम और येपेत का पिता बना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नामों का क्रम इब्रानी पाठ के अनुसार है। इससे यह आवश्यक नहीं कि यही उनका जन्मक्रम था या तीनों का जन्म एक ही वर्ष में हुआ था।
    reason: मूल वाक्य की कालगत और जन्मक्रम-संबंधी अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: וַיְהִי
  choice: जब ... हुआ, तब
  rationale: यहाँ कथात्मक रूप आयु बताने वाली समय-संबंधी परिस्थिति प्रस्तुत करता है। यह हिंदी में स्वाभाविक है और प्रसंग के कालक्रम को बनाए रखता है।
- source_word: בֶּן חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: पाँच सौ वर्ष का हुआ
  rationale: בן + संख्या + שנה आयु बताने वाला इब्रानी मुहावरा है; हिंदी में इसका स्वाभाविक रूप ‘पाँच सौ वर्ष का हुआ’ है।
- source_word: וַיּוֹלֶד
  choice: पिता बना
  rationale: हिफ़ील रूप पुरुष कर्ता के विषय में ‘संतान उत्पन्न करना/पिता बनना’ व्यक्त करता है। ‘पिता बना’ सटीक और सहज है तथा पुरुष के लिए अस्वाभाविक ‘जन्म दिया’ से बचाता है।
- source_word: נֹחַ
  choice: नूह
  rationale: हिंदी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: שֵׁם
  choice: शेम
  rationale: मूल नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: חָם
  choice: हाम
  rationale: मूल नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: יָפֶת
  choice: येपेत
  rationale: मूल नाम का प्रचलित हिंदी लिप्यंतरण।
theological_decisions:
- issue: शेम, हाम और येपेत की सूची से जन्मक्रम अथवा एक ही वर्ष में जन्म का संकेत
  choice: मूल इब्रानी क्रम बनाए रखा गया और मुख्य पाठ में जन्मक्रम या एक ही वर्ष में जन्म का दावा नहीं जोड़ा गया।
  alternative: नामों को अनुमानित जन्मक्रम में रखना या यह स्पष्ट कहना कि तीनों उसी वर्ष जन्मे।
  rationale: पद नामों को इसी क्रम में देता है, पर यह क्रम अनिवार्य रूप से जन्मक्रम नहीं बताता और न ही व्याकरण यह आवश्यक करता है कि तीनों एक ही वर्ष में जन्मे हों।
translation_notes:
