  yaml_path: translation/ot/genesis/005/016.yaml
  text: After he fathered Jared, Mahalalel lived eight hundred and thirty years and fathered sons and daughters.
translation:
  language: hi
  text: येरेद को जन्म देने के बाद महललेल आठ सौ तीस वर्ष जीवित रहा, और उसके बेटे-बेटियाँ भी हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के इस सूत्र में חיה नामित पुत्र के जन्म के बाद जारी जीवन-अवधि को बताता है; ‘जीवित रहा’ स्वाभाविक और अर्थ-सटीक है।
- source_word: מַהֲלַלְאֵל
  choice: महललेल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־יֶרֶד
  choice: येरेद को जन्म देने के बाद
  rationale: אַחֲרֵי समयगत पश्चातता व्यक्त करता है और ילד का हिफ़ील पुरुष कर्ता के संतान उत्पन्न करने को; यह हिन्दी में स्पष्ट और सहज रूप है।
- source_word: שְׁלֹשִׁים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: आठ सौ तीस वर्ष
  rationale: इब्रानी में संख्या ‘तीस वर्ष और आठ सौ वर्ष’ के क्रम में है; हिन्दी के स्वाभाविक संख्या-क्रम में वही कुल अवधि दी गई है।
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: और उसके और बेटे-बेटियाँ पैदा हुए
  rationale: ‘बेटे-बेटियाँ’ दोनों लिंगों का स्पष्ट उल्लेख सुरक्षित रखता है। ‘और’ यह दर्शाता है कि नामित येरेद के अतिरिक्त भी संतान हुई, जबकि हिन्दी में ‘पैदा हुए’ बार-बार ‘जन्म देने’ की अपेक्षा अधिक स्वाभाविक है।
theological_decisions: []
