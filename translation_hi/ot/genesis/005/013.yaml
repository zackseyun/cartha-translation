base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/013.yaml
  text: And Kenan lived eight hundred and forty years after he fathered Mahalalel[b][a], and he fathered sons and daughters.
translation:
  language: hi
  text: महाललेल का पिता बनने के बाद केनान आठ सौ चालीस वर्ष जीवित रहा, और उसके और भी बेटे-बेटियाँ हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के आयु-विवरण में חיה का यह स्वाभाविक और अर्थ-सटीक हिन्दी रूप है।
- source_word: קֵינָן
  choice: केनान
  rationale: इब्रानी नाम קֵינָן का सीधा देवनागरी लिप्यंतरण।
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־מַהֲלַלְאֵל
  choice: महाललेल का पिता बनने के बाद
  rationale: हिफ़ील הוֹלִידוֹ के पुरुष-विशिष्ट अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘जन्म देने’ से माता का अर्थ निकल सकने वाली अस्पष्टता से बचता है।
- source_word: אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: आठ सौ चालीस वर्ष
  rationale: इब्रानी में संख्या का क्रम ‘चालीस और आठ सौ’ है; हिन्दी में कुल संख्या को सामान्य क्रम में रखना स्वाभाविक है और वही परिमाण सुरक्षित रहता है।
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: और उसके और भी बेटे-बेटियाँ हुए
  rationale: इब्रानी में पुत्र और पुत्रियाँ दोनों स्पष्ट हैं। ‘और भी’ इस बात को स्वाभाविक हिन्दी में प्रकट करता है कि महाललेल के अतिरिक्त अन्य संतानें हुईं।
