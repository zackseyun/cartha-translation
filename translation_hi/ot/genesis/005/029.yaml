  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אֶת שְׁמ֛/וֹ נֹ֖חַ לֵ/אמֹ֑ר זֶ֞֠ה יְנַחֲמֵ֤/נוּ מִֽ/מַּעֲשֵׂ֨/נוּ֙ וּ/מֵ/עִצְּב֣וֹן יָדֵ֔י/נוּ מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר אֵֽרְרָ֖/הּ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/029.yaml
  text: And he called his name Noah[a], saying, “This one will comfort us from our work and from the painful toil of our hands, from the ground that Yahweh has cursed.”
translation:
  language: hi
  text: और उसने उसका नाम नूह[a] रखा और कहा, “यह हमारे काम और हमारे हाथों के कष्टदायक परिश्रम से हमें राहत देगा—उस भूमि से, जिसे यहोवा ने शाप दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नूह” नाम की ध्वनि “विश्राम” या “राहत” से मिलती-जुलती है; “राहत देगा” का अनुवाद “हमें सांत्वना देगा” भी हो सकता है। अंतिम वाक्यांश का अर्थ “उस भूमि के कारण” भी समझा जा सकता है।
    reason: नाम-क्रीड़ा, נחם के शाब्दिक विकल्प, और अंतिम מִן के संभावित कारणात्मक संबंध को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: उसने उसका नाम … रखा
  rationale: हिन्दी में नामकरण की स्वाभाविक अभिव्यक्ति; इब्रानी के औपचारिक नामकरण-विन्यास का अर्थ सुरक्षित रहता है।
- source_word: נֹחַ
  choice: नूह
  rationale: हिन्दी बाइबल-परंपरा में प्रचलित और सहज नाम-रूप।
- source_word: זֶה
  choice: यह
  rationale: शिशु की ओर संकेत करने वाले इब्रानी निदर्शक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: יְנַחֲמֵנוּ
  choice: हमें … राहत देगा
  rationale: मूल क्रिया का अर्थ सांत्वना/दिलासा देना है, पर श्रम और पीड़ा के प्रसंग में ‘राहत देगा’ अपेक्षित व्यावहारिक परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है; नूह नाम से ध्वनि-संबंध पादटिप्पणी में रखा गया है।
- source_word: מִמַּעֲשֵׂנוּ
  choice: हमारे काम से
  rationale: यहाँ नैतिक कर्म नहीं, मनुष्य का श्रम और काम अभिप्रेत है।
- source_word: וּמֵעִצְּבוֹן יָדֵינוּ
  choice: हमारे हाथों के कष्टदायक परिश्रम से
  rationale: उत्पत्ति 3:17 की प्रतिध्वनि रखते हुए पीड़ा और कठिन श्रम दोनों भाव व्यक्त होते हैं।
- source_word: מִן־הָאֲדָמָה
  choice: उस भूमि के कारण
  rationale: इस प्रसंग में מן को स्रोत/कारण के अर्थ में लेने से स्पष्ट होता है कि शापित भूमि श्रम और कष्ट का कारण है; ‘भूमि से’ अधिक शब्दशः विकल्प है।
- source_word: אֲשֶׁר אֵרְרָהּ
  choice: जिसे … शाप दिया है
  rationale: भूमि को विशेषित करने वाले संबंधवाचक उपवाक्य का स्पष्ट हिन्दी रूप।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: नूह नाम और יְנַחֲמֵנוּ के बीच शब्द-क्रीड़ा
  choice: मुख्य पाठ में ‘राहत देगा’; पादटिप्पणी में ‘सांत्वना देगा’ और विश्राम/राहत से ध्वनि-संबंध
  alternative: हमें सांत्वना देगा / हमें विश्राम देगा
  rationale: क्रिया נחם का सामान्य अर्थ सांत्वना देना है, जबकि נֹחַ नाम ‘विश्राम’ से ध्वन्यात्मक रूप से जुड़ता है। पद में कठोर व्युत्पत्ति के बजाय ध्वनि-आधारित नाम-क्रीड़ा है; इसलिए दोनों पहलुओं को बिना एक में मिला देने के सुरक्षित रखा गया है।
- issue: מִן־הָאֲדָמָה का संबंध
  choice: शापित भूमि को कष्ट का कारण मानते हुए ‘उस भूमि के कारण’
  alternative: उस भूमि से
  rationale: इब्रानी वाक्यरचना स्रोत या कारण दोनों की छाया दे सकती है। प्रसंग में भूमि पर शाप के कारण मनुष्य के श्रम का कष्ट बढ़ता है; चुना हुआ रूप हिन्दी में यह संबंध स्पष्ट करता है, जबकि अधिक शब्दशः विकल्प को निर्णय में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘कष्टदायक परिश्रम’ उत्पत्ति 3 के शाप और पीड़ापूर्ण श्रम की प्रतिध्वनि बनाए रखता है।
