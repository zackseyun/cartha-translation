  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और वंशावली-सार के अनुरूप। ‘कुल आयु’ ने इब्रानी ‘उसके सारे दिन’ के जीवनकाल-संबंधी मुहावरे को सहज हिंदी में व्यक्त किया है।
