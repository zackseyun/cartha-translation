  text: וַ/יְהִ֖י כָּל יְמֵ֣י חֲנ֑וֹךְ חָמֵ֤שׁ וְ/שִׁשִּׁים֙ שָׁנָ֔ה וּ/שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/023.yaml
  text: So all the days of Enoch were three hundred sixty-five years.
translation:
  language: hi
  text: इस प्रकार हनोक की कुल आयु तीन सौ पैंसठ वर्ष हुई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: इस प्रकार ... हुई
  rationale: वाव-क्रमिक रूप वंशावली के सार-वाक्य को आगे बढ़ाता है। हिंदी में ‘इस प्रकार ... हुई’ स्वाभाविक ढंग से उस निष्कर्षात्मक और कथात्मक संबंध को व्यक्त करता है।
- source_word: כָּל יְמֵי
  choice: कुल आयु
  rationale: शाब्दिक अर्थ ‘सारे दिन’ है, पर वंशावली के इस सूत्र में आशय पूरे जीवनकाल से है। आधुनिक हिंदी में ‘कुल आयु’ स्पष्ट और स्वाभाविक है।
- source_word: חֲנוֹךְ
  choice: हनोक
  rationale: व्यक्तिनाम को प्रचलित हिंदी बाइबलीय लिप्यंतरण में रखा गया है।
- source_word: חָמֵשׁ וְשִׁשִּׁים ... וּשְׁלֹשׁ מֵאוֹת
  choice: तीन सौ पैंसठ
  rationale: इब्रानी संख्या-क्रम को अर्थ बदले बिना स्वाभाविक आधुनिक हिंदी क्रम में प्रस्तुत किया गया है।
- source_word: שָׁנָה ... שָׁנָה
  choice: वर्ष
  rationale: इब्रानी में संख्या के साथ ‘वर्ष’ दो बार आता है; हिंदी में संयुक्त कुल संख्या के बाद एक बार ‘वर्ष’ कहना स्वाभाविक है।
theological_decisions: []
