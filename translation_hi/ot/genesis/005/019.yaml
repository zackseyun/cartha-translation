    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के इस सूत्र में חיה की क्रिया बताई गई अवधि तक जीवित रहने को व्यक्त करती है; आधुनिक हिन्दी में ‘जीवित रहा’ स्वाभाविक और सटीक है।
- source_word: יֶרֶד
  choice: येरेद
  rationale: यह रूप हिब्रू नाम की ध्वनि को प्रचलित हिन्दी बाइबलीय रूप ‘येरेद’ में प्रस्तुत करता है।
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת חֲנוֹךְ
  choice: हनोक को जन्म देने के बाद
  rationale: אַחֲרֵי समयगत ‘के बाद’ है और ילד का हिफ़इल वंशावली में पिता द्वारा संतान उत्पन्न करने को दर्शाता है; हिन्दी में ‘को जन्म देने’ का प्रयोग पुरुष कर्ता के साथ भी स्वाभाविक है।
- source_word: חֲנוֹךְ
  choice: हनोक
  rationale: यह हिब्रू חֲנוֹךְ का हिन्दी में परिचित और निकट लिप्यंतरण है।
- source_word: שְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: आठ सौ वर्ष
  rationale: संख्या-वाचक अवधि को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: उसके और भी बेटे-बेटियाँ हुईं
  rationale: हिब्रू स्पष्ट रूप से पुत्रों और पुत्रियों दोनों का उल्लेख करता है। हिन्दी की स्वाभाविक वंशावली-शैली में यह पिता बनने का भाव बनाए रखता है; ‘और भी’ पहले उल्लिखित हनोक के अतिरिक्त संतानों का संकेत स्पष्ट करता है।
