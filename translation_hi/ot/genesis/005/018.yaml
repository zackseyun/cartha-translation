  text: येरेद एक सौ बासठ वर्ष का था जब वह हनोक का पिता बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के आयु-सूत्र में חיה का अर्थ किसी आयु तक जीवित रहना है; ‘जीवित रहा’ स्वाभाविक और स्रोत के निकट है।
- source_word: יֶרֶד
  choice: येरेद
  rationale: हिब्रू उच्चारण के निकट और देवनागरी में स्पष्ट नाम-लिप्यंतरण।
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּמְאַת שָׁנָה
  choice: एक सौ बासठ वर्ष
  rationale: हिब्रू संख्या-क्रम को आधुनिक मानक हिंदी के स्वाभाविक क्रम में व्यक्त किया गया है।
- source_word: וַיּוֹלֶד
  choice: उसने ... को जन्म दिया
  rationale: हिफ़ील रूप पुरुष कर्ता के विषय में ‘संतान उत्पन्न करना/पिता बनना’ व्यक्त करता है। हिंदी का पारंपरिक वंशावली-वाक्यांश ‘जन्म दिया’ संक्षिप्त और सुबोध है, यद्यपि संदर्भ से पिता का कर्तृत्व स्पष्ट रहता है।
- source_word: אֶת חֲנוֹךְ
  choice: हनोक को
  rationale: אֶת निश्चित कर्म का चिह्न है और हिंदी में ‘को’ से व्यक्त होता है; חֲנוֹךְ का स्रोत-सन्निकट प्रचलित रूप ‘हनोक’ रखा गया है।
