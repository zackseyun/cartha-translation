  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के इस सूत्र में חיה का अर्थ संतान उत्पन्न होने तक की आयु बताना है; ‘जीवित रहा’ मूल क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲנוֹךְ
  choice: हनोक
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबल-रूप में लिप्यंतरित किया गया है।
- source_word: חָמֵשׁ וְשִׁשִּׁים שָׁנָה
  choice: पैंसठ वर्ष
  rationale: हिब्रू में शाब्दिक क्रम ‘पाँच और साठ’ है; आधुनिक हिन्दी में स्वाभाविक संख्या-रूप ‘पैंसठ’ है।
- source_word: וַיּוֹלֶד
  choice: उससे … उत्पन्न हुआ
  rationale: पुल्लिंग कर्ता के साथ ילד वंशावली में संतान उत्पन्न करने का बोध देता है। यह हिन्दी प्रयोग संक्षिप्त और स्वाभाविक है तथा पिता-संतान संबंध स्पष्ट रखता है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह हिब्रू का निश्चित कर्म-सूचक चिह्न है; हिन्दी में इसका अलग समानार्थी शब्द आवश्यक नहीं है।
- source_word: מְתוּשָׁלַח
  choice: मतूशेलह
  rationale: व्यक्तिनाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
