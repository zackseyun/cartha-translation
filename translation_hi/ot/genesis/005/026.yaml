  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के कथन में חיה नामित पुत्र के जन्म के बाद की जीवन-अवधि बताता है; ‘जीवित रहा’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: מְתוּשֶׁלַח
  choice: मतूशेलह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण।
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־לֶמֶךְ
  choice: लेमेक को जन्म देने के बाद
  rationale: אַחֲרֵי कालगत उत्तरवर्तिता बताता है और ילד का हिफ़ील पुरुष को संतान का जनक बनने के अर्थ में है; हिंदी में ‘जन्म देने’ का प्रयोग इस वंशावली-सूत्र में सुबोध है।
- source_word: שְׁתַּיִם וּשְׁמוֹנִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה
  choice: 782 वर्ष
  rationale: इब्रानी संख्या-क्रम का कुल योग 782 है; अंकों में प्रस्तुति स्पष्ट और संक्षिप्त है।
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: और उससे बेटे-बेटियाँ पैदा हुए
  rationale: वाक्यांश जनक के रूप में उसकी अन्य संतानों के होने को बताता है और בָּנִים וּבָנוֹת में पुत्र-पुत्रियों का स्पष्ट भेद सुरक्षित रखता है।
