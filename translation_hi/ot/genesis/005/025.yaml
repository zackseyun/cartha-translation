  text: मतूशेलह एक सौ सत्तासी वर्ष जीवित रहा, और फिर लेमेक का पिता बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के इस सूत्र में חיה का अर्थ किसी आयु तक जीवित रहना है; ‘जीवित रहा’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: מְתוּשֶׁלַח
  choice: मतूशेलह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: שֶׁבַע וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: एक सौ सत्तासी वर्ष
  rationale: इब्रानी की संख्या-रचना को आधुनिक हिन्दी के स्वाभाविक क्रम में व्यक्त किया गया है।
- source_word: וַיּוֹלֶד
  choice: तब उससे ... उत्पन्न हुआ
  rationale: हिफ़ील रूप वंशावली में पुरुष के पिता बनने को व्यक्त करता है; यह हिन्दी प्रयोग जैविक वंश-संबंध को स्वाभाविक ढंग से बताता है और अत्यधिक तकनीकी भाषा से बचता है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का चिह्न है; हिन्दी वाक्य-विन्यास में इसका कोई अलग शब्द आवश्यक नहीं है।
- source_word: לָמֶךְ
  choice: लेमेक
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित देवनागरी लिप्यंतरण।
