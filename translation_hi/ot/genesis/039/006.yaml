translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सुधि नहीं रखता था’ स्रोत के ‘नहीं जानता था’ मुहावरे को सपाट अज्ञान के रूप में समझने से बचाते हुए उसकी अर्थ-छाया बनाए रखता है। अंतिम वाक्य में शारीरिक बनावट और दृश्य रूप के बीच इब्रानी समानांतर भेद सुरक्षित है।
