source:
  edition: WLC
  text: וַ/יַּעֲזֹ֣ב כָּל אֲשֶׁר ל/וֹ֮ בְּ/יַד יוֹסֵף֒ וְ/לֹא יָדַ֤ע אִתּ/וֹ֙ מְא֔וּמָה כִּ֥י אִם הַ/לֶּ֖חֶם אֲשֶׁר ה֣וּא אוֹכֵ֑ל וַ/יְהִ֣י יוֹסֵ֔ף יְפֵה תֹ֖אַר וִ/יפֵ֥ה מַרְאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/006.yaml
  text: So he left all that he had in Joseph’s hand[a], and he knew nothing with him except the food that he ate[b]. Now Joseph was handsome in form and handsome in appearance.
translation:
  language: hi
  text: इस प्रकार उसने अपना सब कुछ यूसुफ के हाथ में छोड़ दिया[a]। जिस भोजन को वह खाता था उसके सिवा, वह किसी बात की सुधि नहीं रखता था[b]। यूसुफ की देह-रचना सुंदर थी और उसका रूप भी सुंदर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हाथ में’ अर्थात उसकी देखरेख और अधिकार में।
    reason: idiom_clarification
  - marker: b
    text: शाब्दिक रूप से ‘रोटी’; यहाँ इसका अर्थ सामान्यतः भोजन भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב כָּל אֲשֶׁר לוֹ
  choice: उसने अपना सब कुछ ... छोड़ दिया
  rationale: עָזַב का मूल अर्थ ‘छोड़ना’ है; प्रसंग में इससे यूसुफ को सारी ज़िम्मेदारी सौंप देने का भाव स्वाभाविक रूप से प्रकट होता है।
- source_word: בְּיַד יוֹסֵף
  choice: यूसुफ के हाथ में
  rationale: इब्रानी का ‘हाथ में’ मुहावरा अधिकार और देखरेख को सूचित करता है। हिन्दी में भी यह बिंब समझने योग्य है, इसलिए इसे बनाए रखा गया है।
- source_word: וְלֹא יָדַע אִתּוֹ מְאוּמָה
  choice: यूसुफ के रहते वह ... और किसी बात की सुधि नहीं रखता था
  rationale: शाब्दिक रचना ‘उसके साथ/रहते उसने कुछ नहीं जाना’ है। यहाँ अर्थ यह है कि यूसुफ की देखरेख में पोतीपर को अपने मामलों की चिंता या निगरानी नहीं करनी पड़ती थी; ‘सुधि नहीं रखता था’ יָדַע की जानने और ध्यान रखने की अर्थ-छाया को स्वाभाविक हिन्दी में रखता है।
- source_word: כִּי אִם
  choice: के सिवा
  rationale: यह अपवाद बताने वाली सामान्य इब्रानी रचना है; ‘के सिवा’ इसका संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: הַלֶּחֶם אֲשֶׁר הוּא אוֹכֵל
  choice: अपने खाने के भोजन
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, पर यह व्यापक अर्थ में भोजन भी दर्शाता है। मुख्य पाठ में ‘भोजन’ प्रसंगानुकूल है और पादटिप्पणी मूल शब्द बताती है।
- source_word: יְפֵה תֹאַר וִיפֵה מַרְאֶה
  choice: सुंदर डील-डौल और मनोहर रूप वाला
  rationale: 'दोनों समानांतर पदों का भेद रखा गया है: תֹאַר शारीरिक बनावट या डील-डौल और מַרְאֶה दिखाई देने वाले रूप को दर्शाता है।'
