  yaml_path: translation/ot/genesis/039/016.yaml
  text: So she kept his garment beside her until his master came home.
translation:
  language: hi
  text: तब उसने उसका वस्त्र अपने पास तब तक रखा, जब तक उसका स्वामी घर नहीं आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּנַּח
  choice: तब उसने ... रखा
  rationale: हिफ़ील रूप यहाँ वस्त्र को अपने पास रख छोड़ने या सुरक्षित रखे रहने का भाव देता है; प्रसंग में सरल हिंदी ‘रखा’ स्वाभाविक है।
- source_word: בִּגְדוֹ
  choice: उसका वस्त्र
  rationale: בֶּגֶד का सामान्य अर्थ ‘वस्त्र’ है; मूल पाठ वस्त्र का प्रकार निर्दिष्ट नहीं करता।
- source_word: אֶצְלָהּ
  choice: अपने पास
  rationale: यह स्त्री के निकट या उसके कब्ज़े में रखे जाने को व्यक्त करता है।
- source_word: עַד בּוֹא
  choice: तब तक ... जब तक ... नहीं आया
  rationale: हिंदी की स्वाभाविक काल-सीमा रचना द्वारा ‘उसके आने तक’ का अर्थ स्पष्ट किया गया है।
- source_word: אֲדֹנָיו
  choice: उसका स्वामी
  rationale: प्रत्यय यूसुफ़ की ओर संकेत करता है; ‘स्वामी’ सेवक-मालिक संबंध को बनाए रखता है।
- source_word: אֶל־בֵּיתוֹ
  choice: घर ... आया
  rationale: शाब्दिक अर्थ ‘अपने घर में आया’ है; आधुनिक हिंदी में ‘घर आया’ वही गंतव्य स्वाभाविक ढंग से व्यक्त करता है।
