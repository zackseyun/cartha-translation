translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्वर अपनाया गया है। ‘इब्री दास’ सामाजिक स्थिति और जातीय पहचान दोनों को स्पष्ट रखता है। अंतिम पदबंध की जानबूझकर व्यापक अर्थ-छाया को ‘खिलवाड़’ द्वारा सुरक्षित रखा गया है।
