  text: וַ/תְּדַבֵּ֣ר אֵלָ֔י/ו כַּ/דְּבָרִ֥ים הָ/אֵ֖לֶּה לֵ/אמֹ֑ר בָּֽא אֵלַ֞/י הָ/עֶ֧בֶד הָֽ/עִבְרִ֛י אֲשֶׁר הֵבֵ֥אתָ לָּ֖/נוּ לְ/צַ֥חֶק בִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/017.yaml
  text: Then she spoke to him with words like these[a], saying, “The Hebrew servant whom you brought to us came to me to mock me.”
translation:
  language: hi
  text: 'तब उसने उससे इन जैसी बातें कहीं, यह कहकर: “जिस इब्री दास को तुम हमारे पास लाए हो, वह मेरा उपहास करने मेरे पास आया था।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझसे खिलवाड़ करने” या “मेरा मज़ाक उड़ाने।” प्रसंग में इसमें दुर्व्यवहार या यौन आशय भी हो सकता है।
    reason: לְצַחֶק בִּי के प्राथमिक ‘उपहास/मज़ाक’ अर्थ के साथ उसके प्रसंगगत संभावित दुर्व्यवहारपूर्ण या यौन संकेत को बिना किसी एक अर्थ को निश्चित किए सुरक्षित रखता है।
lexical_decisions:
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: तब उसने उससे ... बातें कहीं
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; सर्वनाम को मूल के अनुसार बनाए रखा गया है, और प्रसंग में उसका संकेत उसके पति की ओर है।
- source_word: כַּדְּבָרִים הָאֵלֶּה לֵאמֹר
  choice: ऐसी ही बातें कहीं
  rationale: यह इब्रानी मुहावरा उसके कथन का आशय प्रस्तुत करता है; हिन्दी में अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक और बोझिल होता।
- source_word: הָעֶבֶד הָעִבְרִי
  choice: इब्री दास
  rationale: ‘दास’ उसकी बंधुआ घरेलू स्थिति को ‘सेवक’ से अधिक स्पष्ट रखता है; ‘इब्री’ जातीय पहचान को विशेषण रूप में व्यक्त करता है।
- source_word: אֲשֶׁר הֵבֵאתָ לָּנוּ
  choice: जिस ... को तुम हमारे पास लाए हो
  rationale: आरोप लगाने वाली भाषा और प्रथम पुरुष बहुवचन ‘हमारे’ दोनों सुरक्षित रखे गए हैं।
- source_word: בָּא אֵלַי
  choice: वह मेरे पास ... आया था
  rationale: בוא के साथ אל उसकी ओर आने की सामान्य गति बताता है; अनावश्यक रूप से यौन संकेत को क्रिया में नहीं जोड़ा गया।
- source_word: לְצַחֶק בִּי
  choice: मुझसे खिलवाड़ करने
  rationale: ‘खिलवाड़ करना’ उपहास, दुर्व्यवहार और प्रसंगगत यौन आशय की अस्पष्टता को किसी एक अर्थ में सीमित किए बिना स्वाभाविक हिन्दी में बनाए रखता है।
