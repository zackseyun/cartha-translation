  text: And when I raised my voice and cried out[a], he left his garment beside me and fled outside.
translation:
  language: hi
  text: और जब मैंने ऊँची आवाज़ में पुकारा, वह अपना वस्त्र मेरे पास छोड़कर बाहर भाग गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּהֲרִימִי
  choice: और जैसे ही मैंने ऊँची आवाज़ में
  rationale: यह रचना समय-सूचक उपवाक्य आरम्भ करती है। हिन्दी में ‘जैसे ही’ घटनाओं का तत्काल क्रम स्वाभाविक ढंग से व्यक्त करता है; ‘ऊँची आवाज़ में’ קוֹלִי के साथ רום के हिफ़ील प्रयोग का मुहावरेदार रूप है।
- source_word: וָאֶקְרָא
  choice: पुकारा
  rationale: קרא यहाँ संकट में आवाज़ लगाने को दर्शाता है। ‘पुकारा’ अर्थ को सुरक्षित रखता है और अनावश्यक रूप से आवाज़ की तीव्रता निश्चित नहीं करता।
- source_word: וַיַּעֲזֹב
  choice: छोड़कर
  rationale: עזב का संदर्भगत अर्थ वस्त्र को वहीं छोड़ देना है; संयुक्त क्रिया हिन्दी में अगले कार्य से इसका संबंध सहज बनाती है।
- source_word: בִּגְדוֹ
  choice: अपना वस्त्र
  rationale: בגד किसी सामान्य पहनावे का शब्द है। ‘वस्त्र’ किसी विशेष प्रकार, जैसे चोगा या अंगरखा, को आरोपित नहीं करता।
- source_word: אֶצְלִי
  choice: मेरे पास
  rationale: אצל निकटता दर्शाता है। ‘मेरे पास’ स्थानगत अर्थ देता है, बिना यह अनिवार्य किए कि वस्त्र उसके अधिकार में सौंपा गया था।
- source_word: וַיָּנָס הַחוּצָה
  choice: बाहर भाग गया
  rationale: נוס पलायन को और दिशासूचक הַחוּצָה बाहर की ओर गति को व्यक्त करता है। ‘बाहर भाग गया’ आधुनिक हिन्दी में दोनों भाव स्वाभाविक रूप से रखता है।
