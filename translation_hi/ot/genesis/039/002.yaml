base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/002.yaml
  text: Yahweh was with Joseph[a], and he became a successful man; and he was in the house of his Egyptian master.
translation:
  language: hi
  text: याहवे यूसुफ के साथ था, और वह एक सफल व्यक्ति[a] बन गया; वह अपने मिस्री स्वामी के घर में था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्नति करनेवाला व्यक्ति।” इब्रानी कृदंत ऐसे व्यक्ति को दर्शा सकता है जो उन्नति करता या सफल होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण के रूप में रखा गया है।
- source_word: אֶת יוֹסֵף
  choice: यूसुफ के साथ
  rationale: यह रचना यूसुफ के साथ याहवे की उपस्थिति और कृपा को व्यक्त करती है; ‘यूसुफ’ हिंदी में नाम का प्रचलित रूप है।
- source_word: אִישׁ מַצְלִיחַ
  choice: एक सफल व्यक्ति
  rationale: מַצְלִיחַ यहाँ ऐसे व्यक्ति को बताता है जो अपने कामों में सफलता या उन्नति पाता है। ‘सफल व्यक्ति’ आधुनिक हिंदी में स्वाभाविक है और अर्थ को केवल आर्थिक समृद्धि तक सीमित नहीं करता।
- source_word: בְּבֵית אֲדֹנָיו
  choice: अपने स्वामी के घर में
  rationale: शाब्दिक स्थान-सूचक अर्थ को बनाए रखते हुए אֲדֹנָיו को यूसुफ पर अधिकार रखने वाले स्वामी के रूप में व्यक्त किया गया है।
- source_word: הַמִּצְרִי
  choice: मिस्री
  rationale: यह विशेषण यूसुफ के स्वामी की जातीय पहचान बताता है और हिंदी में ‘मिस्री स्वामी’ स्वाभाविक है।
- source_word: וַיְהִי ... וַיְהִי ... וַיְהִי
  choice: था ... बन गया ... था
  rationale: पहली और अंतिम दशा तथा बीच में यूसुफ की सफल स्थिति के विकसित होने को स्वाभाविक हिंदी में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है; इसलिए उसे किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘व्यक्ति’ हिंदी में ‘मनुष्य’ या ‘पुरुष’ की अपेक्षा इस विधेय में अधिक स्वाभाविक है, जबकि संदर्भ स्पष्ट रूप से यूसुफ को ही बताता है।
