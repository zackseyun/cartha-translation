source:
  edition: WLC
  text: וַ/יִּתֵּ֞ן שַׂ֤ר בֵּית הַ/סֹּ֨הַר֙ בְּ/יַד יוֹסֵ֔ף אֵ֚ת כָּל הָ֣/אֲסִירִ֔ם אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/סֹּ֑הַר וְ/אֵ֨ת כָּל אֲשֶׁ֤ר עֹשִׂים֙ שָׁ֔ם ה֖וּא הָיָ֥ה עֹשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/022.yaml
  text: And the chief of the prison put into Yosef’s hand all the prisoners who were in the prison[a], and whatever was done there[c][b], he was the one doing it.
translation:
  language: hi
  text: कारागार के अधिकारी ने कारागार में बंद सभी कैदियों को यूसुफ के हाथ में सौंप दिया[a], और वहाँ जो कुछ किया जाता था, वह सब वही करता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यूसुफ के हाथ में दे दिया”; इसका अर्थ है कि कैदियों पर अधिकार और उनकी जिम्मेदारी उसे सौंप दी गई।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वहाँ होनेवाले हर काम की सक्रिय जिम्मेदारी यूसुफ की थी। इसका अनुवाद “वहाँ का सारा काम वही संभालता था” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: कारागार का अधिकारी
  rationale: שַׂר यहाँ कारागार के प्रभारी अधिकारी को दर्शाता है। यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है और पद का अर्थ स्पष्ट रखता है।
- source_word: בְּיַד יוֹסֵף
  choice: यूसुफ के हाथ में सौंप दिया
  rationale: ‘हाथ में देना’ अधिकार और जिम्मेदारी सौंपने का इब्रानी मुहावरा है; हिन्दी में भी यह बिंब स्वाभाविक और बोधगम्य है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: इब्रानी नाम יוֹסֵף का प्रचलित और स्रोत-समीप हिन्दी रूप।
- source_word: כָּל הָאֲסִירִם
  choice: सभी कैदियों
  rationale: אֲסִירִים कारागार में बंद व्यक्तियों को सूचित करता है; ‘कैदी’ सामान्य आधुनिक हिन्दी का स्पष्ट शब्द है।
- source_word: וְאֵת כָּל אֲשֶׁר עֹשִׂים שָׁם
  choice: और वहाँ जो कुछ किया जाता था
  rationale: बहुवचन कर्तृवाचक कृदंत עֹשִׂים का कर्ता अनिर्दिष्ट है। हिन्दी का कर्मवाच्य उस अनिश्चितता को बनाए रखता है।
- source_word: הוּא הָיָה עֹשֶׂה
  choice: वह सब वही करता था
  rationale: הוּא का बल ‘वही’ से और היה + कृदंत की निरंतर अथवा नियमित क्रिया ‘करता था’ से व्यक्त होती है।
theological_decisions:
- issue: यूसुफ की भूमिका—स्वयं हर कार्य करना या समस्त कार्य का उत्तरदायी संचालन करना
  choice: मुख्य पाठ में ‘वह सब वही करता था’ रखकर इब्रानी की सक्रिय और बलयुक्त अभिव्यक्ति सुरक्षित रखी गई।
  alternative: ‘वह सब उसी की देखरेख में होता था’ या ‘वही सब करवाता था।’
  rationale: वैकल्पिक रूप प्रशासनिक देखरेख को अधिक स्पष्ट करते हैं, पर मूल के सक्रिय עֹשֶׂה को कारणवाचक या केवल पर्यवेक्षी अर्थ में सीमित कर सकते हैं। टिप्पणी में व्यापक उत्तरदायित्व की संभावना बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कारागार’ औपचारिक कथात्मक प्रसंग के अनुकूल है, जबकि ‘कैदी’ प्रचलित और स्पष्ट है। ‘वही करता था’ मूल के बल और नियमित क्रिया—दोनों को बनाए रखता है।
