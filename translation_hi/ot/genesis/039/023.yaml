  text: אֵ֣ין שַׂ֣ר בֵּית הַ/סֹּ֗הַר רֹאֶ֤ה אֶֽת כָּל מְא֨וּמָה֙ בְּ/יָד֔/וֹ בַּ/אֲשֶׁ֥ר יְהוָ֖ה אִתּ֑/וֹ וַֽ/אֲשֶׁר ה֥וּא עֹשֶׂ֖ה יְהוָ֥ה מַצְלִֽיחַ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/023.yaml
  text: The chief of the prison paid attention to nothing that was in his hand[a], because Yahweh was with him; and whatever he did[c][b], Yahweh made prosper.
translation:
  language: hi
  text: जेल का प्रमुख यूसुफ को सौंपी गई किसी भी चीज़ की देखरेख नहीं करता था[a][b], क्योंकि याहवे उसके साथ था; और वह जो कुछ करता था, याहवे उसे सफल करता था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘कुछ भी नहीं देखता था’; यहाँ आशय है कि वह न उसकी जाँच करता था, न उसकी चिंता करता था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उसके हाथ में जो कुछ था’; यह यूसुफ के अधिकार या जिम्मेदारी में सौंपी गई बातों के लिए इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: c
    text: इसे ‘याहवे उसके हर काम को सफलता देता था’ भी अनूदित किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: जेल का प्रमुख
  rationale: שַׂר प्रशासनिक प्रधान या अधिकारी को दर्शाता है। ‘जेल का प्रमुख’ आधुनिक हिन्दी में स्वाभाविक है और पद की वरिष्ठता बनाए रखता है।
- source_word: אֵין ... רֹאֶה
  choice: देखरेख नहीं करता था
  rationale: यहाँ ‘नहीं देखता था’ का आशय यह है कि प्रमुख यूसुफ को सौंपे गए मामलों की जाँच या निगरानी स्वयं नहीं करता था।
- source_word: כָּל מְאוּמָה בְּיָדוֹ
  choice: यूसुफ के अधिकार में सौंपी गई किसी भी बात
  rationale: בְּיָדוֹ का शाब्दिक अर्थ ‘उसके हाथ में’ है, पर सन्दर्भ में यह किसी के नियंत्रण या जिम्मेदारी में सौंपे जाने का मुहावरा है। स्पष्टता के लिए सर्वनाम का अभिप्रेत व्यक्ति ‘यूसुफ’ व्यक्त किया गया है।
- source_word: בַּאֲשֶׁר יְהוָה אִתּוֹ
  choice: क्योंकि याहवे उसके साथ था
  rationale: בַּאֲשֶׁר यहाँ कारण बताता है; ‘क्योंकि’ प्रमुख के भरोसे का आधार स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: וַאֲשֶׁר הוּא עֹשֶׂה
  choice: वह जो कुछ करता था
  rationale: यह सम्बन्धवाचक रचना यूसुफ के सभी कार्यों को समग्र रूप से दर्शाती है।
- source_word: מַצְלִיחַ
  choice: सफल करता था
  rationale: 'צלח के हिफ़ील रूप का कारणवाचक भाव है: याहवे यूसुफ के किए हुए काम को सफलता देता था।'
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत नाम יְהוָה है। ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: यूसुफ के कार्यों की सफलता में ईश्वरीय कर्तृत्व
  choice: याहवे उसे सफल करता था
  alternative: उसका काम सफल होता था
  rationale: מַצְלִיחַ कारणवाचक रूप में है, इसलिए पाठ याहवे को सफलता देने वाला कर्ता बताता है; केवल परिणाम बताने से यह बल घट जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जेल’ सामान्य पाठक के लिए ‘कारागार’ से अधिक सहज है, जबकि ‘प्रमुख’ प्रशासनिक पद का भाव बनाए रखता है। मुख्य पाठ में इब्रानी मुहावरे का अर्थ दिया गया है और उसकी ठोस मूल छवि पादटिप्पणी में सुरक्षित रखी गई है।
