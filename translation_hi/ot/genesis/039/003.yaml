base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/003.yaml
  text: His master saw that Yahweh was with him[a], and that Yahweh made prosper in his hand all that he did.
translation:
  language: hi
  text: उसके स्वामी ने देखा कि यहोवा उसके साथ था और जो कुछ वह करता था, उसे यहोवा उसके हाथ में[a] सफल करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके द्वारा” अथवा “उसके प्रबंध में”; इब्रानी में शाब्दिक रूप से “उसके हाथ में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: ראה का सामान्य आख्यानात्मक अर्थ ‘देखा’ है; संदर्भ में इससे प्रमाण के आधार पर पहचानने का भाव भी निकलता है, पर सरल इब्रानी अभिव्यक्ति बनाए रखी गई है।
- source_word: אֲדֹנָיו
  choice: उसके स्वामी
  rationale: यह पोतीपर को यूसुफ के गृहस्थी-संबंधी स्वामी के रूप में बताता है; आधुनिक हिंदी में ‘स्वामी’ इस सामाजिक संबंध को गरिमापूर्वक व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אִתּוֹ
  choice: उसके साथ था
  rationale: यह वाक्यांश यूसुफ के साथ परमेश्वर की उपस्थिति बताता है और मूल सर्वनाम-संबंध को बनाए रखता है।
- source_word: וְכֹל אֲשֶׁר הוּא עֹשֶׂה
  choice: वह जो कुछ करता था
  rationale: यह मूल के व्यापक और जारी कार्य-भाव को स्वाभाविक हिंदी आख्यान में व्यक्त करता है।
- source_word: מַצְלִיחַ
  choice: सफल करता था
  rationale: 'צלח के हिफ़ील रूप का कारणवाचक भाव सुरक्षित है: सफलता का कर्ता यहोवा है।'
- source_word: בְּיָדוֹ
  choice: उसके हाथ में
  rationale: मूल का ठोस मुहावरा बनाए रखा गया है; यह यूसुफ के हाथों, उसके प्रबंध में, या उसके द्वारा होने के अर्थों के लिए खुला रहता है।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम है; उसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: בְּיָדוֹ की अर्थ-सीमा
  choice: मुख्य पाठ में ‘उसके हाथ में’
  alternative: ‘उसके द्वारा’ या ‘उसके प्रबंध में’
  rationale: शाब्दिक चित्र और साधन, कार्यक्षेत्र तथा निर्देशन के बीच की वास्तविक अर्थगत खुली संभावना सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण आख्यान-शैली। ‘सफल करता था’ कारणवाचक दिव्य कर्तृत्व को स्पष्ट रखता है, जबकि ‘उसके हाथ में’ मूल मुहावरे की अर्थगत व्यापकता बचाता है।
