base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/007.yaml
  text: And after these things[a], his master's wife cast her eyes on Yosef and said, “Lie with me.”
translation:
  language: hi
  text: इन बातों के बाद, उसके स्वामी की पत्नी ने यूसुफ पर नज़र गड़ाई[a] और कहा, “मेरे साथ सो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “यूसुफ की ओर अपनी आँखें उठाईं”; यहाँ यह मुहावरा उस पर केंद्रित, कामनापूर्ण दृष्टि को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: इन बातों के बाद
  rationale: यह इब्रानी कथात्मक सूत्र बाद की घटना का परिचय देता है। यह अनुवाद मूल अभिव्यक्ति के निकट रहते हुए स्वाभाविक हिन्दी है।
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ אֶל
  choice: नज़र गड़ाई
  rationale: शाब्दिक अर्थ ‘अपनी आँखें ... की ओर उठाईं’ है, पर प्रसंग में यह साधारण देखने के बजाय केंद्रित और कामनापूर्ण दृष्टि व्यक्त करता है। ‘नज़र गड़ाई’ इस भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: אֵשֶׁת אֲדֹנָיו
  choice: उसके स्वामी की पत्नी
  rationale: सम्बन्धसूचक इब्रानी पद स्त्री की पहचान यूसुफ के स्वामी की पत्नी के रूप में करता है; यह हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित और पाठकों के लिए सहज नामरूप।
- source_word: שִׁכְבָה עִמִּי
  choice: मेरे साथ सो
  rationale: यह सीधा यौन प्रस्ताव है। ‘मेरे साथ सो’ आधुनिक हिन्दी में स्वाभाविक है और मूल की संक्षिप्त प्रत्यक्षता को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन संक्षिप्त, सीधा और गरिमापूर्ण रखा गया है। ‘स्वामी’ प्राचीन सामाजिक सम्बन्ध को व्यक्त करता है, और पत्नी के प्रस्ताव की स्पष्टता को अनावश्यक रूप से अश्लील बनाए बिना सुरक्षित रखा गया है।
