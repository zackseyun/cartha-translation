base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/004.yaml
  text: And Joseph found favor in his eyes and served him[c][b][a], and he appointed him over his house and put all that he had into his hand.
translation:
  language: hi
  text: यूसुफ़ उसकी दृष्टि में कृपापात्र हुआ और उसकी सेवा की। तब उसने यूसुफ़ को अपने घराने का अधिकारी ठहराया और अपना सब कुछ उसके हाथ में सौंप दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हाथ में सौंप दिया’ का अर्थ है उसके अधिकार और देखरेख में दे दिया।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְצָא יוֹסֵף חֵן בְּעֵינָיו
  choice: यूसुफ़ उसकी दृष्टि में कृपापात्र हुआ
  rationale: ‘दृष्टि में कृपापात्र होना’ हिब्रू मुहावरे ‘आँखों में अनुग्रह पाना’ का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; इससे प्रसंग को अनावश्यक धर्मवैज्ञानिक अर्थ नहीं मिलता।
- source_word: וַיְשָׁרֶת אֹתוֹ
  choice: उसकी सेवा करने लगा
  rationale: שרת यहाँ पोतीपर की व्यक्तिगत सेवा करने को व्यक्त करता है। क्रमिक कथानक में ‘करने लगा’ स्वाभाविक हिन्दी है।
- source_word: וַיַּפְקִדֵהוּ עַל־בֵּיתוֹ
  choice: उसने यूसुफ़ को अपने घराने का अधिकारी ठहराया
  rationale: פקד का प्रशासनिक भाव नियुक्त करके देखरेख सौंपना है। ‘घराना’ בַּיִת के व्यापक घरेलू प्रतिष्ठान को व्यक्त करता है, और ‘यूसुफ़’ सर्वनामों की हिन्दीगत अस्पष्टता दूर करता है।
- source_word: וְכָל־יֶשׁ־לוֹ
  choice: अपना सब कुछ
  rationale: यह पोतीपर की समस्त संपत्ति और संसाधनों को व्यापक रूप से समेटता है।
- source_word: נָתַן בְּיָדוֹ
  choice: उसके हाथ में सौंप दिया
  rationale: हिब्रू के ‘हाथ में देना’ वाले अधिकार और देखरेख के मुहावरे तथा उसके चित्रात्मक रूप—दोनों को सुरक्षित रखता है।
