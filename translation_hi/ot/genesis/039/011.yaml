  text: And it happened on such a day that he went into the house to do his work[b][a], and none of the men of the house was there in the house.
translation:
  language: hi
  text: एक दिन ऐसा हुआ कि वह अपना काम करने के लिए घर के भीतर गया, और वहाँ घर में घर के पुरुषों में से कोई भी नहीं था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּהַיּוֹם הַזֶּה
  choice: एक दिन ऐसा हुआ कि
  rationale: यह इब्रानी कथात्मक सूत्र और अवसरसूचक मुहावरा है। यह हिंदी में सहज रूप से किसी विशेष दिन या अवसर को प्रस्तुत करता है, बिना उसे ठीक उसी कैलेंडर-दिन पर अनावश्यक रूप से सीमित किए।
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: वह ... घर के भीतर गया
  rationale: בוא के साथ दिशासूचक ה घर के अंदर की ओर गति बताता है। 'भीतर गया' हिंदी में इस दिशा को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לַעֲשׂוֹת מְלַאכְתּוֹ
  choice: अपना काम करने के लिए
  rationale: מְלָאכָה यहाँ यूसुफ के सामान्य कार्य या दायित्व को दर्शाता है; 'अपना काम' इसका सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: וְאֵין אִישׁ מֵאַנְשֵׁי הַבַּיִת
  choice: घर के पुरुषों में से कोई भी ... नहीं था
  rationale: मूल पाठ घर के पुरुषों का स्पष्ट उल्लेख करता है। यह चयन उस लिंग-सूचना को बनाए रखते हुए हिंदी की स्वाभाविक नकारात्मक रचना का प्रयोग करता है।
- source_word: שָׁם בַּבָּיִת
  choice: वहाँ घर में
  rationale: यह रूप שָׁם और בַּבָּיִת दोनों को व्यक्त करता है। हिंदी में हल्की पुनरुक्ति मूल की स्थानसूचक स्पष्टता और बल को सुरक्षित रखती है।
