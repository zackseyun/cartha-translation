source:
  edition: WLC
  text: וַ/יְהִ֡י מֵ/אָז֩ הִפְקִ֨יד אֹת֜/וֹ בְּ/בֵית֗/וֹ וְ/עַל֙ כָּל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית הַ/מִּצְרִ֖י בִּ/גְלַ֣ל יוֹסֵ֑ף וַ/יְהִ֞י בִּרְכַּ֤ת יְהוָה֙ בְּ/כָל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ בַּ/בַּ֖יִת וּ/בַ/שָּׂדֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/005.yaml
  text: And from the time he appointed him over his house and over all that he had[a], Yahweh blessed the Egyptian’s house because of Joseph, and Yahweh’s blessing was on all that he had[b], in the house and in the field.
translation:
  language: hi
  text: जब से उसने यूसुफ को अपने घर और अपनी सारी संपत्ति का प्रबंधक नियुक्त किया, तब से यहोवा ने यूसुफ के कारण उस मिस्री के घराने को आशीष दी, और यहोवा की आशीष उस मिस्री की सारी संपत्ति पर थी—घर में और खेत में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאָז
  choice: जब से ... तब से
  rationale: यह इब्रानी पद उस समय-बिंदु को सूचित करता है जिससे आगे वर्णित स्थिति बनी रही; हिन्दी में यह सहसंबंधी रचना स्वाभाविक और स्पष्ट है।
- source_word: הִפְקִיד אֹתוֹ בְּבֵיתוֹ וְעַל כָּל אֲשֶׁר יֶשׁ לוֹ
  choice: उसे अपने घर और अपनी सारी संपत्ति का अधिकारी ठहराया
  rationale: हिफ़ील क्रिया यहाँ यूसुफ को प्रशासन और देखरेख का अधिकार सौंपने का अर्थ देती है; ‘अधिकारी ठहराया’ औपचारिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיְבָרֶךְ
  choice: आशीष दी
  rationale: मूल क्रिया का सीधा अर्थ ‘आशीष देना’ है; केवल भौतिक समृद्धि कहना मूल के ईश्वरीय कर्तृत्व को सीमित कर देता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिवाचक दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: בֵּית הַמִּצְרִי
  choice: उस मिस्री के घराने
  rationale: यहाँ ‘घर’ व्यक्ति के निवास के साथ उसके गृहस्थ प्रतिष्ठान को भी सूचित कर सकता है; ‘घराने’ से व्यापक घरेलू क्षेत्र स्पष्ट होता है।
- source_word: בִּגְלַל יוֹסֵף
  choice: यूसुफ के कारण
  rationale: בגלל कारण बताता है; यह सीधा और अर्थ-संगत हिन्दी रूप है।
- source_word: בִּרְכַּת יְהוָה בְּכָל אֲשֶׁר יֶשׁ לוֹ
  choice: यहोवा की आशीष उसकी हर चीज़ पर थी
  rationale: בְּ यहाँ आशीष के क्षेत्र अथवा विस्तार को बताता है; ‘पर थी’ हिन्दी में आशीष के उसके समस्त अधिकार-क्षेत्र पर होने को सहजता से व्यक्त करता है।
- source_word: בַּבַּיִת וּבַשָּׂדֶה
  choice: घर में भी और खेत में भी
  rationale: यह घरेलू और कृषि—दोनों क्षेत्रों को समेटने वाला ठोस युग्म है; ‘भी...भी’ कुल विस्तार को स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिवाचक दिव्य नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ अधिक परिचित और सामान्य पाठक के लिए सहज है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: यूसुफ के कारण मिली आशीष का आशय
  choice: यूसुफ के कारण
  alternative: यूसुफ के निमित्त
  rationale: पाठ स्पष्टतः यूसुफ को उस मिस्री के घराने पर आई आशीष का कारण/अवसर बताता है। अनुवाद इस संबंध को बनाए रखता है, पर उसके पीछे कोई अतिरिक्त धर्मवैज्ञानिक तंत्र नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। ‘संपत्ति का अधिकारी ठहराया’ प्रशासनिक जिम्मेदारी को व्यक्त करता है और ‘घर में भी और खेत में भी’ मूल के व्यापक युग्म को स्वाभाविक हिन्दी में बनाए रखता है।
