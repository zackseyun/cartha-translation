  edition: WLC
  text: וְ/יוֹסֵ֖ף הוּרַ֣ד מִצְרָ֑יְמָ/ה וַ/יִּקְנֵ֡/הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַ/טַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִ/יַּד֙ הַ/יִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖/הוּ שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/001.yaml
  text: Joseph had been brought down to Egypt[a], and Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian[b], bought him from the Ishmaelites who had brought him down there.
translation:
  language: hi
  text: यूसुफ को मिस्र ले जाया गया था, और फिरौन के एक अधिकारी[a], अंगरक्षकों के प्रधान[b], एक मिस्री पोतीपर ने उसे उन इश्माएलियों से खरीद लिया, जो उसे वहाँ ले गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द का अर्थ ‘राजकीय अधिकारी’ या ‘नपुंसक’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अंगरक्षकों के प्रधान’ का अनुवाद ‘जल्लादों के प्रधान’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד
  choice: ले जाया गया था
  rationale: होफ़अल रूप कर्मवाच्य और कारणवाचक भाव रखता है—यूसुफ स्वयं नहीं गया, बल्कि उसे ले जाया गया। पूर्ण भूतकाल खरीदने से पहले हुई क्रिया को स्पष्ट करता है। हिंदी में ‘नीचे ले जाया गया’ यहाँ अस्वाभाविक होता, इसलिए दिशा का भाव सहज रूप में व्यक्त किया गया है।
- source_word: מִצְרָיְמָה
  choice: मिस्र
  rationale: दिशासूचक प्रत्यय मिस्र की ओर गति बताता है; ‘मिस्र ले जाया गया’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: וַיִּקְנֵהוּ
  choice: उसे ... खरीद लिया
  rationale: दास-व्यापार के इस संदर्भ में קנה का सीधा अर्थ ‘खरीदना’ है; ‘खरीद लिया’ लेन-देन की पूर्णता भी व्यक्त करता है।
- source_word: סְרִיס פַּרְעֹה
  choice: फिरौन के एक अधिकारी
  rationale: סְרִיס राजदरबार के अधिकारी या नपुंसक, दोनों अर्थ दे सकता है। मुख्य पाठ में व्यापक पद-संबंधी अर्थ रखा गया है और दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: שַׂר הַטַּבָּחִים
  choice: अंगरक्षकों के प्रधान
  rationale: यह पद राजकीय अंगरक्षकों अथवा दंड देने वालों के प्रमुख को सूचित कर सकता है। ‘अंगरक्षकों के प्रधान’ पद का स्पष्ट और प्रतिष्ठित हिंदी रूप है; वैकल्पिक बारीकी पादटिप्पणी में दी गई है।
- source_word: אִישׁ מִצְרִי
  choice: एक मिस्री पुरुष
  rationale: यह रूप אִישׁ (‘पुरुष’) और राष्ट्रीयता-सूचक शब्द, दोनों को व्यक्त करता है और पोतीपर की पहचान स्पष्ट करता है।
- source_word: מִיַּד הַיִּשְׁמְעֵאלִים
  choice: उन इश्माएलियों से
  rationale: शाब्दिक ‘हाथ से’ खरीद के संदर्भ में एक हिब्रू मुहावरा है; हिंदी में ‘से खरीद लिया’ उसका स्वाभाविक अर्थ देता है।
- source_word: אֲשֶׁר הוֹרִדֻהוּ שָׁמָּה
  choice: जो उसे वहाँ ले गए थे
  rationale: संबंधवाचक वाक्य इश्माएलियों को कर्ता बताता है और ‘वहाँ’ मिस्र की ओर संकेत करता है।
theological_decisions:
- issue: पोतीपर के लिए סְרִיס का अर्थ
  choice: मुख्य पाठ में ‘फिरौन के एक अधिकारी’
  alternative: ‘फिरौन का एक नपुंसक अधिकारी’ अथवा ‘फिरौन का खोजा’
  rationale: हिब्रू शब्द वास्तविक नपुंसक व्यक्ति और राजकीय अधिकारी, दोनों के लिए प्रयुक्त हो सकता है। कथा यहाँ जैविक अर्थ को अनिवार्य नहीं करती; इसलिए मुख्य पाठ में व्यापक प्रशासनिक अर्थ है, जबकि वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
- issue: שַׂר הַטַּבָּחִים पद का आशय
  choice: ‘अंगरक्षकों के प्रधान’
  alternative: ‘जल्लादों के प्रधान’
  rationale: पद में राजकीय सुरक्षा और मृत्युदंड लागू कराने वाले अधिकारियों, दोनों से संबंध की संभावना है। मुख्य पाठ स्पष्ट पदनाम देता है और कठोर शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘पोतीपर नामक’ से लंबे समानाधिकरणों को स्वाभाविक हिंदी क्रम मिला है। मुख्य पाठ स्रोत की कर्मवाच्यता, खरीद के लेन-देन और इश्माएलियों की भूमिका को बनाए रखता है; जहाँ हिब्रू पदों में वास्तविक अर्थगत अस्पष्टता है, उसे पादटिप्पणियों में स्पष्ट किया गया है।
