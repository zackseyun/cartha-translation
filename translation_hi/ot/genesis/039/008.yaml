  register: आधुनिक मानक हिन्दी; संवाद में स्वामी की पत्नी के लिए सम्मानसूचक ‘देखिए’ और स्वामी के लिए बहुवचन आदरसूचक क्रियारूप रखे गए हैं। भाषा सहज किंतु गरिमापूर्ण है; मूल इब्रानी मुहावरों का अर्थ स्पष्ट किया गया है और ‘हाथ में’ का ठोस रूपक सुरक्षित रखा गया है।
