  text: וַ/יְמָאֵ֓ן וַ/יֹּ֨אמֶר֙ אֶל אֵ֣שֶׁת אֲדֹנָ֔י/ו הֵ֣ן אֲדֹנִ֔/י לֹא יָדַ֥ע אִתִּ֖/י מַה בַּ/בָּ֑יִת וְ/כֹ֥ל אֲשֶׁר יֶשׁ ל֖/וֹ נָתַ֥ן בְּ/יָדִֽ/י׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/008.yaml
  text: But he refused and said to his master's wife[a], "Look, my master does not concern himself with what is in the house[c][b], and everything that belongs to him he has put into my hand."
translation:
  language: hi
  text: पर उसने इनकार किया और अपने स्वामी की पत्नी से कहा, “देखिए, मेरे स्वामी को घर में क्या है, इसकी चिंता नहीं करते, और जो कुछ उनका है, वह सब उन्होंने मेरे हाथ में दे दिया है।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “मेरे हाथ में दे दिया है”; अर्थात, मेरे सुपुर्द कर दिया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: पर उसने इनकार किया
  rationale: संदर्भ में यह पिछले पद में दिए गए प्रस्ताव के प्रति यूसुफ का स्पष्ट विरोध है; ‘पर’ प्रतिकूल संबंध और ‘इनकार किया’ क्रिया का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֹּאמֶר אֶל־אֵשֶׁת אֲדֹנָיו
  choice: और अपने स्वामी की पत्नी से कहा
  rationale: यह इब्रानी संबंधवाचक संरचना का सहज और सटीक हिन्दी रूप है।
- source_word: הֵן
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला अव्यय है। स्त्री से सीधे संबोधन में ‘देखिए’ आधुनिक, सम्मानपूर्ण और स्वाभाविक है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: घराने में यूसुफ और पोतीपर के सामाजिक संबंध को ‘स्वामी’ ठीक प्रकार व्यक्त करता है और अनावश्यक धर्मवैज्ञानिक संकेत से बचता है।
- source_word: לֹא יָדַע אִתִּי מַה בַּבָּיִת
  choice: मेरे रहते मेरे स्वामी को इसकी चिंता नहीं कि घर में क्या-क्या है
  rationale: शाब्दिक संरचना ‘मेरे साथ नहीं जानता’ हिन्दी में अस्पष्ट होती। यहाँ भाव यह है कि यूसुफ की देखरेख के कारण स्वामी घर के मामलों की चिंता नहीं करता। ‘मेरे रहते’ אִתִּי को संक्षेप में बनाए रखता है, जबकि ‘क्या-क्या है’ समस्त घरेलू वस्तुओं और मामलों की ओर संकेत करता है।
- source_word: וְכֹל אֲשֶׁר יֶשׁ־לוֹ
  choice: जो कुछ उनका है, वह सब
  rationale: यह स्वामी की संपत्ति की संपूर्णता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נָתַן בְּיָדִי
  choice: उन्होंने मेरे हाथ में सौंप दिया है
  rationale: यह मूल के ‘मेरे हाथ में दिया’ रूपक को बनाए रखते हुए अधिकार और भरोसे से सौंपने का भाव स्पष्ट करता है।
