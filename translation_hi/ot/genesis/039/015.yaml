  text: וַ/יְהִ֣י כְ/שָׁמְע֔/וֹ כִּֽי הֲרִימֹ֥תִי קוֹלִ֖/י וָ/אֶקְרָ֑א וַ/יַּעֲזֹ֤ב בִּגְד/וֹ֙ אֶצְלִ֔/י וַ/יָּ֖נָס וַ/יֵּצֵ֥א הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/015.yaml
  text: And when he heard that I had raised my voice and cried out[b][a], he left his garment beside me and fled and went outside.
translation:
  language: hi
  text: जब उसने सुना कि मैंने अपनी आवाज़ ऊँची की और चिल्लाई[a], तो वह अपना वस्त्र मेरे पास[b] छोड़कर भागा और बाहर निकल गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं ऊँची आवाज़ में पुकार उठी।”
    reason: lexical_alternative
  - marker: b
    text: या, “मेरे साथ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְשָׁמְעוֹ
  choice: जब उसने सुना
  rationale: וַיְהִי के साथ כְּ + infinitive construct यहाँ कालसूचक उपवाक्य बनाता है; आधुनिक हिन्दी में ‘जब उसने सुना’ स्वाभाविक रूप से कथा का क्रम बनाए रखता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי उस बात की विषयवस्तु प्रस्तुत करता है जिसे उसने सुना; इसलिए ‘कि’ उपयुक्त है।
- source_word: הֲרִימֹתִי קוֹלִי
  choice: मैंने अपनी आवाज़ ऊँची की
  rationale: यह इब्रानी मुहावरे का निकट और स्पष्ट हिन्दी रूप है तथा अगले क्रियापद से उसका अलग स्वरूप बनाए रखता है।
- source_word: וָאֶקְרָא
  choice: और चिल्लाई
  rationale: इस प्रसंग में קרא ऊँची और तात्कालिक पुकार को व्यक्त करता है। स्त्री वक्ता के अनुसार ‘चिल्लाई’ स्वाभाविक हिन्दी है, पर सहायता माँगने जैसी अनकही विषयवस्तु नहीं जोड़ती।
- source_word: וַיַּעֲזֹב בִּגְדוֹ
  choice: वह अपना वस्त्र ... छोड़कर
  rationale: בגד एकवचन है; ‘वस्त्र’ उस संख्या और कथा के तत्काल संदर्भ को सुरक्षित रखता है।
- source_word: אֶצְלִי
  choice: मेरे पास
  rationale: אֶצְלִי निकटता अथवा किसी के पास रह जाने—दोनों का भाव दे सकता है। ‘मेरे पास’ हिन्दी में इस वास्तविक अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
- source_word: וַיָּנָס
  choice: भागा
  rationale: נוס अचानक पलायन को दर्शाता है; ‘भागा’ सरल और सटीक आधुनिक हिन्दी है।
- source_word: וַיֵּצֵא הַחוּצָה
  choice: और बाहर निकल गया
  rationale: क्रिया तथा दिशासूचक הַחוּצָה बाहर की ओर जाने को व्यक्त करते हैं; ‘बाहर निकल गया’ इसे स्वाभाविक हिन्दी में रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सरल और कथात्मक है। स्त्री वक्ता के कारण ‘चिल्लाई’ स्त्रीलिंग में रखा गया है। ‘मेरे पास’ स्रोत की स्थान और अभिरक्षा से जुड़ी संभावित द्विअर्थता को बिना अनावश्यक रूप से तय किए सुरक्षित रखता है।
