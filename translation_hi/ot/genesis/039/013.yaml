  text: And it happened[a], when she saw that he had left his garment in her hand and had fled outside,
translation:
  language: hi
  text: और ऐसा हुआ कि जब उसने देखा कि वह अपना वस्त्र उसके हाथ में छोड़कर बाहर भाग गया था,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह कथात्मक क्रम और नए घटनाक्रम की भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּרְאוֹתָהּ
  choice: जब उसने देखा
  rationale: כְּ के साथ infinitive construct और स्त्रीलिंग एकवचन प्रत्यय यहाँ स्पष्ट कालवाचक अर्थ देता है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषयवस्तु प्रस्तुत करता है जिसे स्त्री ने देखा।
- source_word: עָזַב
  choice: छोड़कर
  rationale: संदर्भ में क्रिया का सीधा अर्थ ‘छोड़ना’ है; संयुक्त क्रिया-रचना हिन्दी में दोनों पूर्ववर्ती कार्यों का स्वाभाविक क्रम रखती है।
- source_word: בִּגְדוֹ
  choice: अपना वस्त्र
  rationale: בֶּגֶד किसी सामान्य वस्त्र को दर्शाता है; ‘वस्त्र’ अनावश्यक रूप से ‘चोगा’ जैसी विशिष्टता नहीं जोड़ता। ‘अपना’ हिन्दी में कर्ता से संबंध स्पष्ट और स्वाभाविक बनाता है।
- source_word: בְּיָדָהּ
  choice: उसके हाथ में
  rationale: यह मूल पाठ की ठोस और सजीव अभिव्यक्ति का सीधा हिन्दी रूप है।
- source_word: וַיָּנָס
  choice: भाग गया है
  rationale: נוּס का अर्थ भय या शीघ्रता से निकल भागना है। पूर्णता सूचित करने वाला रूप स्त्री द्वारा देखी गई तत्कालीन स्थिति को व्यक्त करता है।
- source_word: הַחוּצָה
  choice: बाहर
  rationale: दिशासूचक ה स्थानीय गति को बाहर की ओर दिखाता है; हिन्दी में ‘बाहर भाग गया’ उसी दिशा को सहज रूप से व्यक्त करता है।
