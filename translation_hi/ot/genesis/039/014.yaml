id: GEN.39.14
reference: Genesis 39:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תִּקְרָ֞א לְ/אַנְשֵׁ֣י בֵיתָ֗/הּ וַ/תֹּ֤אמֶר לָ/הֶם֙ לֵ/אמֹ֔ר רְא֗וּ הֵ֥בִיא לָ֛/נוּ אִ֥ישׁ עִבְרִ֖י לְ/צַ֣חֶק בָּ֑/נוּ בָּ֤א אֵלַ/י֙ לִ/שְׁכַּ֣ב עִמִּ֔/י וָ/אֶקְרָ֖א בְּ/ק֥וֹל גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/014.yaml
  text: Then she called the men of her household and said to them[a], “Look, he has brought a Hebrew man to us to mock us. He came in to me to lie with me[b], and I cried out with a loud voice.”
translation:
  language: hi
  text: तब उसने अपने घर के पुरुषों को बुलाकर उनसे कहा, “देखो, वह हमारे पास एक इब्री पुरुष को ले आया है, ताकि वह हमारा उपहास करे[a]। वह मेरे साथ लेटने[b] के लिए मेरे पास आया, और मैं ऊँचे स्वर से चिल्लाई।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हम पर हँसे,” अथवा “हमसे खिलवाड़ करे।” हिब्रू क्रिया उपहास या अपमानजनक खेल का भाव दे सकती है; इस आरोप के संदर्भ में इसमें यौन अपमान की छाया है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “लेटने” का अर्थ यौन संबंध बनाना है।
    reason: idiom_clarification
lexical_decisions:
- source_word: וַתִּקְרָא לְאַנְשֵׁי בֵיתָהּ
  choice: तब उसने अपने घर के पुरुषों को बुलाकर
  rationale: वाक्य कथा को आगे बढ़ाता है; ‘तब’ क्रम को स्वाभाविक रूप से व्यक्त करता है। אַנְשֵׁי का पुरुषवाचक अर्थ और בֵיתָהּ का घरेलू/गृहस्थी-संबंधी भाव सुरक्षित रखा गया है।
- source_word: וַתֹּאמֶר לָהֶם לֵאמֹר
  choice: उनसे कहा
  rationale: हिब्रू की कथन-परिचयात्मक पुनरुक्ति को स्वाभाविक हिन्दी में संक्षिप्त किया गया है।
- source_word: רְאוּ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाली बहुवचन आज्ञा के लिए वर्तमान, सहज हिन्दी।
- source_word: הֵבִיא לָנוּ אִישׁ עִבְרִי
  choice: वह हमारे पास एक इब्री पुरुष को ले आया है
  rationale: הֵבִיא के कारक अर्थ ‘ले आना’, לָנוּ के ‘हमारे पास/हमारे लिए’ भाव, और אִישׁ עִבְרִי में जातीय तथा पुरुषवाचक दोनों सूचनाएँ रखी गई हैं।
- source_word: לְצַחֶק בָּנוּ
  choice: ताकि वह हमारा उपहास करे
  rationale: क्रिया यहाँ हँसी उड़ाने, अपमानजनक खेल करने या खिलवाड़ करने का भाव दे सकती है। ‘उपहास करे’ आरोप का व्यापक अर्थ बनाए रखता है; संदर्भ में यौन अपमान की छाया भी बनी रहती है।
- source_word: בָּא אֵלַי
  choice: वह ... मेरे पास आया
  rationale: בוא + אֶל का सीधा अर्थ ‘किसी के पास आना’ है; हिन्दी में अनावश्यक रूप से घुस आने का भाव नहीं जोड़ा गया।
- source_word: לִשְׁכַּב עִמִּי
  choice: मेरे साथ लेटने के लिए
  rationale: हिब्रू के प्रचलित यौन मुहावरे का स्रोत-समीप और गरिमापूर्ण रूप; संदर्भ में इसका आशय संभोग करना है।
- source_word: וָאֶקְרָא בְּקוֹל גָּדוֹל
  choice: और मैं ऊँचे स्वर से चिल्लाई
  rationale: וָ की सामान्य संयोजक शक्ति को ‘और’ से रखा गया है; ‘चिल्लाई’ संकटपूर्ण पुकार और בְּקוֹל גָּדוֹל की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
