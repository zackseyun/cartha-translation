  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יֵּ֥ט אֵלָ֖י/ו חָ֑סֶד וַ/יִּתֵּ֣ן חִנּ֔/וֹ בְּ/עֵינֵ֖י שַׂ֥ר בֵּית הַ/סֹּֽהַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/021.yaml
  text: But Yahweh was with Joseph and extended covenant faithfulness to him[b][a], and he gave him favor in the eyes of the chief of the prison.
translation:
  language: hi
  text: परन्तु यहोवा यूसुफ के साथ था और उसने उस पर अटल प्रेम दिखाया,[a] और उसने यूसुफ को बन्दीगृह के अधिकारी की दृष्टि में कृपा प्राप्त कराई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर निष्ठावान प्रेम किया”; इब्रानी חָסֶד का अर्थ “अटल प्रेम,” “निष्ठावान प्रेम,” या “दयालुता” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: וַיְהִי ... אֶת
  choice: के साथ था
  rationale: यह इब्रानी संरचना उपस्थिति और साथ बने रहने को व्यक्त करती है; हिन्दी में यह सहज और प्रसंगानुकूल है।
- source_word: וַיֵּט אֵלָיו חָסֶד
  choice: उस पर अटल प्रेम दिखाया
  rationale: נָטָה और חֶסֶד का संयुक्त प्रयोग यहाँ यूसुफ के प्रति यहोवा के स्थिर, निष्ठावान अनुग्रह को दर्शाता है। शाब्दिक 'उसकी ओर ... झुकाया' हिन्दी में अस्वाभाविक होता।
- source_word: חִנּוֹ
  choice: उसे कृपा दिलाई
  rationale: हिफ़ील וַיִּתֵּן का कर्ता यहोवा है; भाव यह है कि उसने अधिकारी की दृष्टि में यूसुफ को अनुकूल स्वीकृति प्राप्त कराई।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: इब्रानी मुहावरे का स्वाभाविक और गरिमापूर्ण हिन्दी समतुल्य।
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: बन्दीगृह का अधिकारी
  rationale: निर्माण का अर्थ बन्दीगृह का प्रभारी व्यक्ति है; 'अधिकारी' आधुनिक हिन्दी में सहज है और पद की ठीक प्रकृति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַ
  choice: परन्तु
  rationale: पूर्ववर्ती कारावास की परिस्थिति और यहोवा की उपस्थिति के बीच कथात्मक विरोध को स्पष्ट करता है।
theological_decisions:
- issue: חֶסֶד में निहित निष्ठावान प्रेम
  choice: अटल प्रेम
  alternative: वाचा की निष्ठा; करुणा; निष्ठावान प्रेम
  rationale: तात्कालिक पद में किसी वाचा का स्पष्ट उल्लेख नहीं है, इसलिए 'वाचा की निष्ठा' अर्थ को आवश्यकता से अधिक निश्चित कर सकती है। 'अटल प्रेम' इस शब्द के स्थिर और निष्ठावान अनुग्रह को सहज हिन्दी में बनाए रखता है; विकल्प पादटिप्पणी में दिया गया है।
- issue: יהוה का निरूपण
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को सुरक्षित रखते हुए हिन्दी पाठकों में प्रचलित रूप अपनाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। 'बन्दीगृह' औपचारिक किन्तु सामान्यतः बोधगम्य है; 'अधिकारी' मूल पद की व्यापकता बनाए रखता है।
