source:
  edition: WLC
  text: אֵינֶ֨/נּוּ גָד֜וֹל בַּ/בַּ֣יִת הַ/זֶּה֮ מִמֶּ/נִּי֒ וְ/לֹֽא חָשַׂ֤ךְ מִמֶּ֨/נִּי֙ מְא֔וּמָה כִּ֥י אִם אוֹתָ֖/ךְ בַּ/אֲשֶׁ֣ר אַתְּ אִשְׁתּ֑/וֹ וְ/אֵ֨יךְ אֶֽעֱשֶׂ֜ה הָ/רָעָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/חָטָ֖אתִי לֵֽ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/009.yaml
  text: There is no one greater in this house than I am[a], and he has withheld nothing from me except you, because you are his wife[b]. So how could I do this great evil and sin against God?
translation:
  language: hi
  text: इस घर में मुझसे बड़ा कोई नहीं; उसने तुम्हें छोड़कर मुझसे कुछ भी नहीं रोका है, क्योंकि तुम उसकी पत्नी हो। फिर मैं यह बड़ा बुरा काम कैसे करूँ और परमेश्वर के विरुद्ध पाप करूँ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵינֶנּוּ גָדוֹל ... מִמֶּנִּי
  choice: इस घर में मुझसे बड़ा कोई नहीं है
  rationale: אֵין की रचना यहाँ किसी अधिक बड़े व्यक्ति के अस्तित्व का निषेध करती है; यह यूसुफ के घराने में अधिकार और पद को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: בַּבַּיִת הַזֶּה
  choice: इस घर में
  rationale: בַּיִת भौतिक घर के साथ पूरे घराने और उसकी व्यवस्था को भी सूचित कर सकता है; ‘घर’ मूल बिंब और व्यापक अर्थ दोनों बनाए रखता है।
- source_word: חָשַׂךְ מִמֶּנִּי מְאוּמָה
  choice: मुझसे कुछ भी नहीं रोका
  rationale: חָשַׂךְ का अर्थ रोक रखना या वंचित रखना है; नकार के साथ מְאוּמָה का अर्थ ‘कुछ भी नहीं’ होता है।
- source_word: כִּי אִם אוֹתָךְ
  choice: आप को छोड़कर
  rationale: नकार के बाद כִּי אִם स्पष्ट अपवाद प्रकट करता है। आदरसूचक ‘आप’ आधुनिक हिन्दी में स्वाभाविक है और स्त्रीलिंग हिब्रू संबोधन का संदर्भ बनाए रखता है।
- source_word: בַּאֲשֶׁר אַתְּ אִשְׁתּוֹ
  choice: क्योंकि आप उनकी पत्नी हैं
  rationale: यह पदबंध अपवाद का कारण देता है। ‘उनकी’ पोतीपर के लिए आदरसूचक एकवचन है।
- source_word: וְאֵיךְ אֶעֱשֶׂה
  choice: फिर मैं ... कैसे करूँ
  rationale: וְאֵיךְ पिछले कथन से निकलने वाला नैतिक निष्कर्ष प्रस्तुत करता है; ‘फिर ... कैसे’ उसका अनुमानात्मक बल व्यक्त करता है।
- source_word: הָרָעָה הַגְּדֹלָה הַזֹּאת
  choice: ऐसी बड़ी बुराई
  rationale: רָעָה नैतिक बुराई, दुष्टता या अनुचित काम को सूचित कर सकता है। ‘बड़ी बुराई’ मूल की नैतिक गंभीरता को बिना संप्रदायगत व्याख्या के बनाए रखती है।
- source_word: וְחָטָאתִי לֵאלֹהִים
  choice: और परमेश्वर के विरुद्ध पाप करूँ
  rationale: חטא के साथ ל यहाँ किसी के विरुद्ध पाप करने का भाव देता है; प्रसंग में אֱלֹהִים यूसुफ द्वारा पूजे जाने वाले परमेश्वर को सूचित करता है।
theological_decisions:
- issue: यूसुफ के कथन में אֱלֹהִים का संदर्भ
  choice: परमेश्वर
  alternative: किसी देवता / ईश्वर
  rationale: उत्पत्ति की कथा में यूसुफ अपने आराध्य परमेश्वर की ओर संकेत करता है, और उसका कथन इस काम को केवल स्वामी के प्रति अपराध नहीं बल्कि परमेश्वर के विरुद्ध पाप बताता है।
- issue: प्रस्तावित व्यभिचार का नैतिक स्वरूप
  choice: बड़ी बुराई और परमेश्वर के विरुद्ध पाप
  alternative: केवल स्वामी के विश्वास का सामाजिक उल्लंघन
  rationale: 'हिब्रू पाठ दोनों आयामों को स्पष्ट रूप से रखता है: पोतीपर की पत्नी होने के कारण विश्वासघात और परमेश्वर के विरुद्ध पाप। अनुवाद इस तनाव को बनाए रखता है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। पोतीपर और उसकी पत्नी के लिए आदरसूचक बहुवचन ‘उन्होंने/उनकी/आप’ प्रयुक्त हुआ है। कोई पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि मुख्य पाठ में हिब्रू का अर्थ और उसकी वास्तविक व्यापकता स्वाभाविक रूप से सुरक्षित है।
