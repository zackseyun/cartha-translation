  text: וַ/יְהִ֕י כְּ/דַבְּרָ֥/הּ אֶל יוֹסֵ֖ף י֣וֹם י֑וֹם וְ/לֹא שָׁמַ֥ע אֵלֶ֛י/הָ לִ/שְׁכַּ֥ב אֶצְלָ֖/הּ לִ/הְי֥וֹת עִמָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/010.yaml
  text: And it happened[a], as she spoke to Yosef day after day, that he did not listen to her, to lie beside her or to be with her.
translation:
  language: hi
  text: और ऐसा हुआ कि जब वह दिन-प्रतिदिन यूसुफ से कहती रही, तो उसने उसकी बात नहीं मानी कि वह उसके पास लेटे या उसके साथ रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ
  rationale: यह कथानक में अगली घटना का परिचय देने वाला रूप है। ‘और ऐसा हुआ’ इसके प्रवचनात्मक कार्य को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: כְּדַבְּרָהּ אֶל־יוֹסֵף
  choice: जब वह ... यूसुफ से कहती रही
  rationale: כְּ यहाँ कालवाचक अर्थ देता है। अगले पदबंध ‘दिन-प्रतिदिन’ के साथ ‘कहती रही’ उसके बार-बार आग्रह करने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: יוֹם יוֹם
  choice: दिन-प्रतिदिन
  rationale: संज्ञा की पुनरावृत्ति लगातार दोहराव को व्यक्त करती है; ‘दिन-प्रतिदिन’ इस बल को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: שָׁמַע אֵלֶיהָ
  choice: उसकी बात नहीं मानी
  rationale: इस प्रयोग में שׁמע किसी की बात सुनने, ध्यान देने या मानने का अर्थ रखता है। प्रसंग में ‘बात नहीं मानी’ यूसुफ के स्पष्ट इनकार को सहज हिन्दी में व्यक्त करता है।
- source_word: לִשְׁכַּב אֶצְלָהּ
  choice: उसके पास लेटने के लिए
  rationale: שׁכב यहाँ यौन अर्थ रख सकता है, पर אֵצֶל का स्थानवाचक बल ‘पास’ से सुरक्षित रहता है। यह अनुवाद अगले अलग पदबंध ‘उसके साथ रहने’ का अपना अर्थ भी बनाए रखता है।
- source_word: לִהְיוֹת עִמָּהּ
  choice: उसके साथ रहने के लिए
  rationale: היה עם का सामान्य अर्थ किसी के साथ होना या रहना है। यह चयन यौन कृत्य से आगे समझौतापूर्ण निकटता से भी यूसुफ के इनकार की व्यापकता को सुरक्षित रखता है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: यह हिन्दी बाइबल परंपरा में प्रचलित, सुबोध और गरिमापूर्ण नाम-रूप है।
theological_decisions:
- issue: क्या दोनों अंतिम पदबंधों को केवल यौन संबंध के समानार्थी रूप में अनूदित किया जाए
  choice: ‘उसके पास लेटने’ और ‘उसके साथ रहने’ को अलग रखा गया
  alternative: ‘उसके साथ सोने या रहने’ अथवा दोनों को केवल यौन संबंध का संकेत मानना
  rationale: हिब्रू दो अलग उद्देश्यवाचक पदबंध रखता है। पहला प्रसंग में यौन अर्थ ग्रहण कर सकता है, जबकि दूसरा अधिक व्यापक संगति या निकटता का भाव बनाए रखता है; इसलिए दोनों को एक अर्थ में मिला देना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, कथात्मक और गरिमापूर्ण शैली अपनाई गई है। ‘तब भी’ मूल वाक्य में निहित लगातार आग्रह और यूसुफ के विरोध के संबंध को स्पष्ट करता है, बिना अर्थ को सांप्रदायिक या व्याख्यात्मक रूप से संकीर्ण किए।
