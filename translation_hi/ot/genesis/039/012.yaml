source:
  edition: WLC
  text: וַ/תִּתְפְּשֵׂ֧/הוּ בְּ/בִגְד֛/וֹ לֵ/אמֹ֖ר שִׁכְבָ֣/ה עִמִּ֑/י וַ/יַּעֲזֹ֤ב בִּגְד/וֹ֙ בְּ/יָדָ֔/הּ וַ/יָּ֖נָס וַ/יֵּצֵ֥א הַ/חֽוּצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/012.yaml
  text: Then she grabbed him by his garment[a], saying[b], “Lie with me!” But he left his garment in her hand and fled and went outside.
translation:
  language: hi
  text: तब उसने उसका वस्त्र[a] पकड़कर कहा, “मेरे साथ लेट!”[b] पर वह अपना वस्त्र उसके हाथ में छोड़कर भागा और बाहर निकल गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वस्त्र’ का अनुवाद ‘कपड़ा’, ‘चोगा’ या ‘अंगरखा’ भी किया जा सकता है; इब्रानी शब्द किसी पहनावे के लिए प्रयुक्त सामान्य शब्द है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरे साथ सो!” इब्रानी मुहावरे में यौन प्रस्ताव के लिए शाब्दिक रूप से ‘लेट’ क्रिया का प्रयोग हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפְּשֵׂהוּ
  choice: उसने ... पकड़कर
  rationale: תפשׂ किसी को या किसी वस्तु को दृढ़ता से पकड़ने का भाव देता है। यहाँ ‘पकड़कर’ स्वाभाविक आधुनिक हिन्दी में अचानक की गई शारीरिक क्रिया को स्पष्ट करता है।
- source_word: בְּבִגְדוֹ / בִּגְדוֹ
  choice: उसका वस्त्र / अपना वस्त्र
  rationale: בגד किसी सामान्य पहनावे या कपड़े के लिए प्रयुक्त होता है; ‘वस्त्र’ किसी विशेष प्रकार, जैसे चोगा या अंगरखा, को अनावश्यक रूप से निश्चित नहीं करता। दूसरे उल्लेख में हिन्दी का ‘अपना’ कर्ता से संबंध स्पष्ट और स्वाभाविक बनाता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह रूप प्रत्यक्ष कथन का परिचय देता है। हिन्दी में पूर्वकालिक ‘पकड़कर कहा’ मूल घटनाक्रम को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שִׁכְבָה עִמִּי
  choice: मेरे साथ लेट!
  rationale: שׁכב עם यहाँ यौन प्रस्ताव का शिष्टोक्तिपूर्ण मुहावरा है। ‘मेरे साथ लेट’ मूल क्रिया ‘लेटना’ को बनाए रखता है और प्रसंग में उसका यौन आशय समझ में आता है।
- source_word: וַיַּעֲזֹב
  choice: छोड़कर
  rationale: עזב का यहाँ अर्थ वस्त्र को वहीं छोड़ देना है। ‘छोड़कर’ अगले भागने के कार्य से स्वाभाविक रूप से जुड़ता है।
- source_word: בְּיָדָהּ
  choice: उसके हाथ में
  rationale: יד का सीधा अर्थ ‘हाथ’ है और वाक्यांश बताता है कि वस्त्र उसी के हाथ में रह गया।
- source_word: וַיָּנָס
  choice: भागा
  rationale: נוס तत्काल बच निकलने या पलायन करने का भाव देता है; ‘भागा’ सामान्य आधुनिक हिन्दी में इसकी तीव्रता बनाए रखता है।
- source_word: וַיֵּצֵא הַחוּצָה
  choice: बाहर निकल गया
  rationale: יצא और दिशासूचक החוצה भीतर से बाहर जाने को व्यक्त करते हैं। ‘बाहर निकल गया’ हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
