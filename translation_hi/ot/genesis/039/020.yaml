  text: וַ/יִּקַּח֩ אֲדֹנֵ֨י יוֹסֵ֜ף אֹת֗/וֹ וַֽ/יִּתְּנֵ֨/הוּ֙ אֶל בֵּ֣ית הַ/סֹּ֔הַר מְק֕וֹם אֲשֶׁר אסורי הַ/מֶּ֖לֶךְ אֲסוּרִ֑ים וַֽ/יְהִי שָׁ֖ם בְּ/בֵ֥ית הַ/סֹּֽהַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/020.yaml
  text: So Joseph’s master took him and put him into the prison[a], the place where the king’s prisoners were confined[b]. And he was there in the prison.
translation:
  language: hi
  text: तब यूसुफ़ के स्वामी ने उसे लेकर बंदीगृह[a] में डाल दिया, उस स्थान में जहाँ राजा के बंदी कैद रखे जाते थे[b]। और वह वहाँ बंदीगृह में था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘सोहर का घर’; ‘सोहर’ संभवतः मिस्री मूल का शब्द है, जो बंदीगृह या निरोध-स्थान को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: इब्रानी में ‘बाँधना/बंदी बनाना’ धातु दोहराई गई है; शाब्दिक रूप से, ‘जहाँ राजा के बंदी बंदी बनाए हुए थे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֵי יוֹסֵף
  choice: यूसुफ़ के स्वामी
  rationale: यहाँ אֲדֹנֵי यूसुफ़ के मानवीय स्वामी को दर्शाता है, कोई ईश्वरीय उपाधि नहीं। ‘स्वामी’ प्रसंग और गरिमापूर्ण आधुनिक हिन्दी के अनुकूल है।
- source_word: וַיִּקַּח
  choice: पकड़कर
  rationale: לקח का मूल अर्थ ‘लेना’ है; यहाँ दंडात्मक कार्रवाई के प्रसंग में ‘पकड़कर’ स्वाभाविक है, पर ‘धर दबोचा’ जैसी अनावश्यक तीव्रता नहीं जोड़ता।
- source_word: וַיִּתְּנֵהוּ אֶל
  choice: में डाल दिया
  rationale: נתן के साथ אֶל यहाँ किसी व्यक्ति को किसी स्थान के भीतर रखे जाने को व्यक्त करता है; बंदीगृह के संदर्भ में ‘में डाल दिया’ सहज हिन्दी है।
- source_word: בֵּית הַסֹּהַר
  choice: बंदीगृह
  rationale: यह पद कारावास अथवा निरोध-स्थान को दर्शाता है। ‘बंदीगृह’ अर्थ को स्पष्ट रखते हुए ‘जेल’ की अपेक्षा अधिक गरिमापूर्ण और कथात्मक शैली के अनुकूल है।
- source_word: מְקוֹם אֲשֶׁר
  choice: उस स्थान में जहाँ
  rationale: इब्रानी पाठ बंदीगृह की व्याख्या ‘उस स्थान’ के रूप में करता है; हिन्दी में इस व्याख्यात्मक संबंध को स्पष्ट रखा गया है।
- source_word: אֲסוּרֵי הַמֶּלֶךְ אֲסוּרִים
  choice: राजा के बंदी बाँधकर रखे जाते थे
  rationale: मूल में אסר धातु की पुनरावृत्ति बंदी होने और बाँधे रखे जाने दोनों पर बल देती है। यह अनुवाद उस शब्द-प्रतिध्वनि को यथासंभव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיְהִי שָׁם בְּבֵית הַסֹּהַר
  choice: और वह वहीं बंदीगृह में रहा
  rationale: ‘वहीं’ שָׁם को और ‘बंदीगृह में’ दोहराए गए स्थान को सुरक्षित रखता है। हिन्दी में היה के परिणामस्वरूप जारी स्थिति के लिए ‘रहा’ स्वाभाविक है।
