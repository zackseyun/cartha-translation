source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹנָ֜י/ו אֶת דִּבְרֵ֣י אִשְׁתּ֗/וֹ אֲשֶׁ֨ר דִּבְּרָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר כַּ/דְּבָרִ֣ים הָ/אֵ֔לֶּה עָ֥שָׂהּ לִ֖/י עַבְדֶּ֑/ךָ וַ/יִּ֖חַר אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/019.yaml
  text: And it happened that when his master heard the words of his wife that she spoke to him[a], saying[b], “According to these words your servant did to me,” his anger burned.
translation:
  language: hi
  text: ऐसा हुआ कि जब उसके मालिक ने अपनी पत्नी की वे बातें सुनीं जो उसने उससे कही थीं—“तेरे गुलाम[a] ने मेरे साथ ऐसा[b] किया”—तो उसका क्रोध भड़क उठा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे सेवक।” इब्रानी शब्द עֶבֶד का अर्थ ‘सेवक’ या ‘गुलाम’ दोनों हो सकता है; यहाँ यूसुफ की स्थिति को देखते हुए ‘गुलाम’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “इन बातों के अनुसार।” इब्रानी अभिव्यक्ति का अर्थ “ऐसी बातें/काम” भी हो सकता है या वह पहले बताए गए आरोप की ओर संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ कि
  rationale: यह इब्रानी कथानक में अगली घटना का परिचय देता है; यह रूप उसके क्रमिक और घटनात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כִשְׁמֹעַ
  choice: जब ... सुनीं
  rationale: כְּ के साथ क्रिया-वाचक संज्ञा यहाँ समय-संबंध व्यक्त करती है; हिन्दी में ‘जब’ इसका स्वाभाविक रूप है।
- source_word: אֲדֹנָיו
  choice: उसके मालिक
  rationale: संदर्भ में पोतीपर यूसुफ का स्वामी और स्वामित्व रखने वाला गृह-मालिक है; ‘मालिक’ आधुनिक हिन्दी में इस संबंध को स्पष्ट करता है।
- source_word: דִּבְרֵי אִשְׁתּוֹ אֲשֶׁר דִּבְּרָה אֵלָיו
  choice: अपनी पत्नी की वे बातें ... जो उसने उससे कही थीं
  rationale: ‘बातें’ मूल के דְּבָרִים को बनाए रखता है और संबंधवाचक उपवाक्य को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ऐसा-ऐसा
  rationale: यह हिन्दी में उन कथित कामों के प्रकार या वर्णित आरोप की ओर संकेत करता है और इब्रानी वाक्यांश की संभावित अर्थ-सीमा को खुला रखता है।
- source_word: עַבְדְּךָ
  choice: तेरे गुलाम
  rationale: עֶבֶד का अर्थ सेवक या गुलाम हो सकता है; पोतीपर के घर में यूसुफ की बंधुआ और स्वामित्वाधीन स्थिति के कारण ‘गुलाम’ अधिक सटीक है।
- source_word: עָשָׂה לִי
  choice: ने मेरे साथ ... किया
  rationale: ‘किया’ मूल की सामान्य क्रिया को बनाए रखता है; हिन्दी में ‘मेरे साथ’ आरोप के प्रसंग में לִי को स्वाभाविक रूप से व्यक्त करता है, बिना किसी खास कृत्य को जोड़ने के।
- source_word: וַיִּחַר אַפּוֹ
  choice: उसका क्रोध भड़क उठा
  rationale: यह मूल के जलने या भड़कने वाले क्रोध-रूपक को आधुनिक, सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: मालिक के क्रोध का लक्ष्य या कारण
  choice: केवल ‘उसका क्रोध भड़क उठा’ कहा गया है
  alternative: यह स्पष्ट करना कि वह यूसुफ पर क्रोधित हुआ या पत्नी के कथन पर
  rationale: इब्रानी पाठ क्रोध का लक्ष्य स्पष्ट नहीं करता; अनुवाद इस कथात्मक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। पत्नी के सीधे संबोधन में ‘तेरे’ प्रसंगानुकूल है। उद्धरण में किसी विशेष यौन कृत्य को स्पष्ट नहीं किया गया, क्योंकि मूल पाठ यहाँ केवल संकेतात्मक आरोप देता है।
