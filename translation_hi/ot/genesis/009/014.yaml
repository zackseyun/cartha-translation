base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/014.yaml
  text: And when I bring clouds over the earth[a], the bow will be seen in the cloud,
translation:
  language: hi
  text: और जब मैं पृथ्वी के ऊपर बादल लाऊँगा, तब धनुष[a] बादल में दिखाई देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “इंद्रधनुष।” हिब्रू में प्रयुक्त शब्द सामान्यतः ‘धनुष’ के लिए होता है, जो इस संदर्भ में वाचा के चिह्न, इंद्रधनुष, को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और जब…तब
  rationale: यह रचना भविष्य में होने वाली परिस्थिति का परिचय देती है। हिन्दी में ‘जब…तब’ उसके कालगत संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּעַנְנִי עָנָן
  choice: मैं…बादल छा दूँगा
  rationale: ענן का यहाँ कारणवाचक/नामधातुजन्य भाव है—पृथ्वी पर बादल लाना या उसे बादलों से ढकना। ‘बादल छा दूँगा’ आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर की कर्तृता बनाए रखता है।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: जलप्रलय की वाचा का व्यापक संदर्भ ‘देश’ की अपेक्षा ‘पृथ्वी’ का समर्थन करता है; ‘पर’ עַל का सहज हिन्दी रूप है।
- source_word: וְנִרְאֲתָה
  choice: दिखाई देगा
  rationale: ראה के निफ़अल रूप का ‘दिखाई देना/देखा जाना’ भाव और भविष्यकाल दोनों सुरक्षित रहते हैं।
- source_word: הַקֶּשֶׁת
  choice: धनुष
  rationale: קֶשֶׁת सामान्यतः ‘धनुष’ है। संदर्भ में यह इंद्रधनुष को सूचित करता है, पर ‘धनुष’ मूल शब्द की दृश्य और वाचागत छवि को बनाए रखता है।
- source_word: בֶּעָנָן
  choice: बादल में
  rationale: हिब्रू में यहाँ निश्चित एकवचन है; इसलिए ‘बादल में’ उसके रूप का सीधा और स्वाभाविक प्रतिनिधित्व करता है।
theological_decisions:
- issue: नूह की वाचा के संदर्भ में קֶשֶׁת का अनुवाद
  choice: धनुष
  alternative: इंद्रधनुष
  rationale: मूल पाठ सामान्य हिब्रू शब्द ‘धनुष’ का प्रयोग करता है, जबकि संदर्भ स्पष्ट करता है कि वाचा का चिह्न इंद्रधनुष है। मुख्य पाठ में ‘धनुष’ रखने और पादटिप्पणी में संदर्भगत अर्थ बताने से शब्द-चित्र और अर्थ दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप। ‘जब…तब’ से वाक्य-संबंध स्पष्ट किया गया है और ‘बादल छा दूँगा’ मूल की कारणवाचक क्रिया को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
