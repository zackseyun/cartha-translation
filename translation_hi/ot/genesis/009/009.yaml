source:
  edition: WLC
  text: וַ/אֲנִ֕י הִנְנִ֥/י מֵקִ֛ים אֶת בְּרִיתִ֖/י אִתְּ/כֶ֑ם וְ/אֶֽת זַרְעֲ/כֶ֖ם אַֽחֲרֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/009.yaml
  text: And as for me[a], behold, I am establishing my covenant with you and with your offspring after you.
translation:
  language: hi
  text: और देखो, मैं अपनी वाचा तुम्हारे साथ और तुम्हारे बाद आने वाले तुम्हारे वंशजों के साथ स्थापित करता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: और … मैं
  rationale: संयोजक और स्वतंत्र सर्वनाम वक्ता के बदलाव तथा हल्के बल को प्रकट करते हैं। हिन्दी में ‘और … मैं’ स्वाभाविक है; ‘जहाँ तक मेरी बात है’ यहाँ आवश्यकता से अधिक भारी होता।
- source_word: הִנְנִי
  choice: देखो
  rationale: यह पद ध्यान आकर्षित करके कथन को गंभीर बल देता है। ‘देखो’ आधुनिक हिन्दी में स्पष्ट है और ‘मैं उपस्थित हूँ’ जैसा भिन्न अर्थ नहीं जोड़ता।
- source_word: מֵקִים
  choice: स्थापित करता हूँ
  rationale: קום के हिफ़ील कृदन्त का आशय वाचा को कायम या स्थापित करने की वर्तमान, विधिवत क्रिया है। यह अनुवाद केवल पुनर्पुष्टि का अर्थ अनिवार्य नहीं बनाता।
- source_word: בְּרִיתִי
  choice: अपनी वाचा
  rationale: ‘वाचा’ ईश्वर और मनुष्यों के बीच औपचारिक प्रतिज्ञाबद्ध संबंध के लिए प्रचलित बाइबलीय शब्द है और ‘संधि’ की अपेक्षा इस संदर्भ को बेहतर बनाए रखता है।
- source_word: אִתְּכֶם
  choice: तुम्हारे साथ
  rationale: बहुवचन संबोधन और संबंधसूचक पूर्वसर्ग का सीधा तथा स्वाभाविक हिन्दी रूप।
- source_word: וְאֶת זַרְעֲכֶם
  choice: और … तुम्हारे वंश के साथ
  rationale: זֶרַע सामूहिक संज्ञा है और भावी संतान या वंशजों को सूचित कर सकती है। ‘वंश’ हिन्दी में इस सामूहिक और पीढ़ीगत अर्थ को संक्षेप में व्यक्त करता है; समानांतर रचना स्पष्ट करने के लिए ‘के साथ’ दोहराया गया है।
- source_word: אַחֲרֵיכֶם
  choice: तुम्हारे बाद
  rationale: यह आगामी पीढ़ियों का संकेत देता है; ‘तुम्हारे बाद’ मूल की संक्षिप्तता और क्रम दोनों को बनाए रखता है।
theological_decisions:
- issue: ईश्वर-मनुष्य संबंध में בְּרִית का अनुवाद
  choice: वाचा
  alternative: संधि; करार
  rationale: ‘वाचा’ मूल के औपचारिक, प्रतिज्ञाबद्ध संबंध को सुरक्षित रखता है, जबकि ‘संधि’ अधिक राजनीतिक और ‘करार’ अधिक लौकिक या कानूनी लग सकता है। इससे पद में अतिरिक्त साम्प्रदायिक सिद्धान्त नहीं जोड़ा जाता।
- issue: מֵקִים में स्थापना बनाम पुनर्पुष्टि
  choice: स्थापित करता हूँ
  alternative: दृढ़ करता हूँ; कायम रखता हूँ
  rationale: संदर्भ में वाचा की स्थापना का अर्थ पर्याप्त है। ‘दृढ़ करता हूँ’ पूर्वस्थापित वाचा की पुनर्पुष्टि को आवश्यकता से अधिक निश्चित कर सकता है, इसलिए मूल की संभावित व्यापकता बनाए रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘देखो’ मूल के गंभीर ध्यानसूचक बल को रखता है; ‘वाचा’ प्रमुख बाइबलीय पदावली की संगति बनाए रखता है।
