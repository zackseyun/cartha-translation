base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/018.yaml
  text: The sons of Noah who came out of the ark were Shem, Ham, and Japheth; and Ham was the father of Canaan.
translation:
  language: hi
  text: नूह के जो बेटे जहाज़ से बाहर निकले थे, वे शेम, हाम और यापेत थे; और हाम कनान का पिता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: थे
  rationale: यहाँ क्रिया היה का रूप साधारण भूतकालीन योजक क्रिया के रूप में विषय और विधेय को जोड़ता है; ‘हो गए’ परिवर्तन का अनावश्यक भाव लाता।
- source_word: בְנֵי נֹחַ
  choice: नूह के ... बेटे
  rationale: इब्रानी संबंधवाचक रचना का स्वाभाविक आधुनिक हिन्दी रूप; ‘पुत्र’ की अपेक्षा ‘बेटे’ आम पाठकों के लिए अधिक सहज है और गरिमा भी बनाए रखता है।
- source_word: הַיֹּצְאִים מִן הַתֵּבָה
  choice: जो ... जहाज़ से बाहर निकले थे
  rationale: संज्ञीकृत कृदंत को संबंधवाचक उपवाक्य से व्यक्त किया गया है। מן का अलग होने का भाव ‘से बाहर’ में स्पष्ट है। תֵּבָה के लिए इस प्रसंग में ‘जहाज़’ सहज और व्यापक रूप से बोधगम्य है।
- source_word: שֵׁם וְחָם וָיָפֶת
  choice: शेम, हाम और येपेत
  rationale: नामों को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְחָם הוּא אֲבִי כְנָעַן
  choice: और हाम कनान का पिता था
  rationale: नाममात्र उपवाक्य और אֲבִי की संबंधवाचक रचना को सीधे रखा गया है; यह अगले वृत्तांत के लिए कनान से हाम का संबंध स्पष्ट करता है।
theological_decisions:
- issue: हाम और कनान का वंशगत परिचय
  choice: ‘और हाम कनान का पिता था’ को मुख्य पाठ में स्पष्ट कथात्मक सूचना के रूप में रखा गया।
  alternative: इसे कोष्ठकीय या गौण सूचना की तरह शैलीगत रूप से कम प्रमुख करना।
  rationale: इब्रानी पाठ इस संबंध को स्पष्ट रूप से बताकर आगे की घटना की भूमिका बाँधता है। अनुवाद इससे आगे कोई जातीय या धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। वाक्य-रचना मूल के कथात्मक बल को बनाए रखते हुए स्वाभाविक हिन्दी में है।
