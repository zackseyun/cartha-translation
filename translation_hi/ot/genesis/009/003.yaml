  yaml_path: translation/ot/genesis/009/003.yaml
  text: Every moving thing that is alive shall be food for you. As I gave you the green plants[a], I have given you everything.
translation:
  language: hi
  text: हर चलने-फिरने वाला जीवित प्राणी[a] तुम्हारे भोजन के लिए होगा। हरे पौधों के समान मैंने तुम्हें सब कुछ दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर रेंगने वाला जीव जो जीवित है।” इब्रानी शब्द רֶמֶשׂ प्रायः रेंगने या झुंड में चलने वाले जीवों के लिए आता है, पर यहाँ प्रसंग में संभवतः इसका अर्थ व्यापक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רֶמֶשׂ
  choice: हर चलता-फिरता जीव
  rationale: रֶמֶשׂ रेंगने या झुंड में चलने वाले जीवों को सूचित कर सकता है, पर इस प्रसंग में इसका आशय व्यापक जान पड़ता है। ‘चलता-फिरता जीव’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को केवल रेंगने वाले जीवों तक सीमित नहीं करता।
- source_word: אֲשֶׁר הוּא חַי
  choice: जीव
  rationale: ‘जीव’ में जीवित होने का भाव स्वाभाविक रूप से निहित है; इससे ‘जो जीवित है’ जैसी बोझिल पुनरुक्ति से बचते हुए मूल विशेषण का आशय बना रहता है।
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: तुम्हारे भोजन के लिए होगा
  rationale: यह दैवी अनुमति और प्रावधान, दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּיֶרֶק עֵשֶׂב
  choice: जैसे मैंने तुम्हें हरे पौधे दिए थे
  rationale: यֶרֶק עֵשֶׂב सामूहिक रूप से हरी वनस्पति को दर्शाता है। ‘हरे पौधे’ साधारण पाठक के लिए स्पष्ट है, और ‘दिए थे’ पहले दिए गए आहार की ओर संकेत करता है।
- source_word: נָתַתִּי לָכֶם אֶת כֹּל
  choice: अब मैं तुम्हें सब कुछ देता हूँ
  rationale: इब्रानी पूर्ण क्रिया वर्तमान में प्रभावी दान को व्यक्त करती है। ‘अब’ प्रसंग में पशु-आहार के नए अनुदान और पहले दिए गए पौधों के बीच तुलना स्पष्ट करता है; ‘सब कुछ’ כֹּל की व्यापकता बनाए रखता है।
theological_decisions:
- issue: जलप्रलय के बाद आहार के अनुदान का विस्तार
  choice: यह पद जीव-जगत को मानव आहार के लिए व्यापक रूप से प्रदान करता है।
  alternative: רֶמֶשׂ को केवल छोटे, रेंगने वाले या झुंड में चलने वाले जीवों तक सीमित मानना।
  rationale: यद्यपि רֶמֶשׂ का संकीर्ण अर्थ संभव है, ‘हर’, जीवित होने की योग्यता और अंतिम ‘सब कुछ’ इस प्रसंग में व्यापक अर्थ का समर्थन करते हैं। फिर भी शब्द की वास्तविक शाब्दिक सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘चलता-फिरता जीव’ व्यापक प्रसंग और मूल शब्द की गति-संबंधी छवि, दोनों को बनाए रखता है। पादटिप्पणी चिह्न [a] मुख्य पाठ में सम्मिलित है।
