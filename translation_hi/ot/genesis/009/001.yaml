reference: Genesis 9:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֱלֹהִ֔ים אֶת נֹ֖חַ וְ/אֶת בָּנָ֑י/ו וַ/יֹּ֧אמֶר לָ/הֶ֛ם פְּר֥וּ וּ/רְב֖וּ וּ/מִלְא֥וּ אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/001.yaml
  text: And God blessed Noah and his sons[a], and said to them, “Be fruitful and multiply and fill the earth.”
translation:
  language: hi
  text: परमेश्वर ने नूह और उसके पुत्रों को आशीष दी और उनसे कहा, “फूलो-फलो, बढ़ो और पृथ्वी[a] को भर दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पृथ्वी” का अनुवाद “भूमि” भी हो सकता है; पर यहाँ जलप्रलय के बाद का संदर्भ और उत्पत्ति 1:28 की प्रतिध्वनि “पृथ्वी” के पक्ष में हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: आशीष दी
  rationale: पिएल रूप यहाँ केवल प्रशंसा करने नहीं, बल्कि आशीष प्रदान करने का भाव व्यक्त करता है; ‘आशीष दी’ स्वाभाविक और सटीक हिन्दी है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस कथा-संदर्भ में यह इस्राएल के एकमात्र परमेश्वर के लिए प्रयुक्त है; ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय शैली में स्पष्ट और गरिमापूर्ण है।
- source_word: נֹחַ
  choice: नूह
  rationale: नाम का प्रचलित मानक हिन्दी रूप रखा गया है।
- source_word: בָּנָיו
  choice: उसके पुत्रों
  rationale: इब्रानी में विशेष रूप से ‘पुत्र’ हैं, सामान्य ‘सन्तान’ नहीं; इसलिए लैंगिक विशिष्टता सुरक्षित रखी गई है।
- source_word: וַיֹּאמֶר לָהֶם
  choice: और उनसे कहा
  rationale: यह सामान्य कथात्मक वाक्यांश का सहज हिन्दी रूप है और कथन में अतिरिक्त व्याख्यात्मक बल नहीं जोड़ता।
- source_word: פְּרוּ
  choice: फूलो-फलो
  rationale: यह हिन्दी में प्रजनन और समृद्ध वृद्धि का स्वाभाविक मुहावरा है तथा उत्पत्ति 1:28 की प्रतिध्वनि बनाए रखता है।
- source_word: וּרְבוּ
  choice: बढ़ो
  rationale: यहाँ क्रिया संख्या में बहुत होने या बढ़ने का आदेश देती है; ‘बढ़ो’ संक्षिप्त और स्वाभाविक है तथा ‘फूलो-फलो’ के साथ अनावश्यक पुनरुक्ति से बचती है।
- source_word: וּמִלְאוּ
  choice: भर दो
  rationale: क्रिया का सीधा अर्थ ‘भरना’ है; ‘फिर से भरना’ जैसा अर्थ मूल में आवश्यक नहीं है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: जलप्रलय के बाद का वैश्विक संदर्भ और उत्पत्ति 1:28 की प्रतिध्वनि स्थानीय ‘देश/भूमि’ की अपेक्षा ‘पृथ्वी’ का समर्थन करती है।
theological_decisions:
- issue: उत्पत्ति 1:28 के सृष्टि-आदेश से संबंध
  choice: “फूलो-फलो, बढ़ो और पृथ्वी को भर दो” जैसी निकट समान अभिव्यक्ति रखी गई है।
  alternative: “बहुत-सी सन्तान उत्पन्न करो और सारी पृथ्वी पर बस जाओ” जैसे अधिक व्याख्यात्मक शब्द।
  rationale: मूल इब्रानी जानबूझकर सृष्टि की आशीष-भाषा दोहराता है। निकट समान शब्दावली जलप्रलय के बाद मानवता और आरम्भिक सृष्टि-आदेश के बीच धार्मिक निरन्तरता को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘फूलो-फलो’ प्रचलित मुहावरा है और मूल की सृष्टि-संबंधी प्रतिध्वनि को बनाए रखता है। पादटिप्पणी-चिह्न उस शब्दसमूह के बाद रखा गया है जिससे वह संबंधित है।
