- from: तब परमेश्वर ने कहा, “यह उस वाचा का चिन्ह है जिसे मैं अपने और तुम्हारे बीच तथा तुम्हारे साथ के हर जीवित प्राणी के बीच आने वाली सभी पीढ़ियों के लिए दे रहा हूँ:”
  to: तब परमेश्वर ने कहा, “यह उस वाचा का चिन्ह है जिसे मैं अपने, तुम्हारे और तुम्हारे साथ के हर जीवित प्राणी के बीच पीढ़ी-दर-पीढ़ी सदा के लिए दे रहा हूँ:”
  rationale: The revision corrects the relationship among the covenant parties and restores the enduring force of the final Hebrew phrase. It retains the draft’s direct rendering of נֹתֵן (‘दे रहा हूँ’), established biblical terminology, and the anticipatory colon.
