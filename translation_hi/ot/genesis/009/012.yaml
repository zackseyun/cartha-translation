id: GEN.9.12
reference: Genesis 9:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁר אֲנִ֣י נֹתֵ֗ן בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה אֲשֶׁ֣ר אִתְּ/כֶ֑ם לְ/דֹרֹ֖ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/012.yaml
  text: And God said[a], “This is the sign of the covenant that I am giving between me and you and every living creature that is with you[b], for perpetual generations:”
translation:
  language: hi
  text: तब परमेश्वर ने कहा, “यह उस वाचा का चिन्ह है जिसे मैं अपने, तुम्हारे और तुम्हारे साथ के हर जीवित प्राणी के बीच पीढ़ी-दर-पीढ़ी सदा के लिए दे रहा हूँ:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ एकमात्र परमेश्वर नूह से बोल रहे हैं; ‘परमेश्वर’ मानक और गरिमापूर्ण हिन्दी रूप है।
- source_word: זֹאת אוֹת הַבְּרִית
  choice: यह उस वाचा का चिन्ह है
  rationale: אוֹת के लिए ‘चिन्ह’ दृश्य संकेत का अर्थ देता है, और בְּרִית के लिए ‘वाचा’ प्रमुख बाइबलीय पदावली को बनाए रखता है।
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: जिसे मैं ... दे रहा हूँ
  rationale: नֹתֵן का मूल अर्थ ‘दे रहा हूँ’ है। हिन्दी में ‘वाचा का चिन्ह देना’ स्वाभाविक है और इब्रानी कृदन्त की प्रगतिशीलता भी सुरक्षित रहती है।
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין
  choice: अपने और तुम्हारे बीच तथा ... के बीच
  rationale: दोहराए गए בֵּין द्वारा वाचा के पक्ष स्पष्ट किए गए हैं; हिन्दी में ‘तथा’ संरचना को साफ और प्रवाहपूर्ण रखता है।
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: हर जीवित प्राणी
  rationale: सन्दर्भ में मनुष्यों के साथ पशु भी सम्मिलित हैं; ‘जीवित प्राणी’ व्यापक अर्थ रखता है और ‘आत्मा’ से जुड़ी अनपेक्षित मानवशास्त्रीय धारणाओं से बचता है।
- source_word: אֲשֶׁר אִתְּכֶם
  choice: तुम्हारे साथ के
  rationale: यह सम्बन्धवाचक उपवाक्य नूह और उसके परिवार के साथ उपस्थित प्राणियों को निर्दिष्ट करता है; संक्षिप्त हिन्दी रूप स्वाभाविक है।
- source_word: לְדֹרֹת עוֹלָם
  choice: आने वाली सभी पीढ़ियों के लिए
  rationale: यह रूप पीढ़ी-दर-पीढ़ी स्थायी निरन्तरता को सहज आधुनिक हिन्दी में व्यक्त करता है; עוֹלָם की दीर्घकालिक व्यापकता ‘सभी’ और भावी सन्दर्भ से प्रकट होती है।
theological_decisions:
- issue: नֹתֵן के साथ वाचा/चिन्ह की क्रिया
  choice: जिसे मैं ... दे रहा हूँ
  alternative: जिसे मैं स्थापित कर रहा हूँ
  rationale: मूल क्रिया का सीधा अर्थ ‘देना’ है और उसका कर्म निकटतम रूप से ‘वाचा का चिन्ह’ समझा जा सकता है। ‘स्थापित करना’ सन्दर्भानुकूल हो सकता है, पर स्रोत की क्रिया से अधिक व्याख्यात्मक है।
- issue: נֶפֶשׁ חַיָּה का दायरा
  choice: हर जीवित प्राणी
  alternative: हर जीवित जीव
  rationale: जलप्रलय के बाद की वाचा में पशु भी स्पष्टतः सम्मिलित हैं। ‘प्राणी’ इस व्यापक दायरे को रखता है और נֶפֶשׁ को केवल मनुष्य की ‘आत्मा’ मानने की धार्मिक धारणा आरोपित नहीं करता।
- issue: לְדֹרֹת עוֹלָם की कालगत शक्ति
  choice: आने वाली सभी पीढ़ियों के लिए
  alternative: सदा की पीढ़ियों के लिए
  rationale: עולם स्थायी अथवा अनिश्चित दूर भविष्य तक की अवधि बता सकता है। चुना हुआ रूप निरन्तर पीढ़ीगत दायरे को व्यक्त करता है, बिना दार्शनिक अर्थ में अनन्तता को अनावश्यक रूप से निश्चित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। ‘वाचा’ और ‘चिन्ह’ जैसी स्थापित बाइबलीय पदावली रखी गई है। पद अगले वाक्य में चिन्ह की पहचान की ओर ले जाता है, इसलिए अन्त में द्विबिन्दु रखा गया है।
