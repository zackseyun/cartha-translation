id: GEN.9.2
reference: Genesis 9:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מוֹרַאֲ/כֶ֤ם וְ/חִתְּ/כֶם֙ יִֽהְיֶ֔ה עַ֚ל כָּל חַיַּ֣ת הָ/אָ֔רֶץ וְ/עַ֖ל כָּל ע֣וֹף הַ/שָּׁמָ֑יִם בְּ/כֹל֩ אֲשֶׁ֨ר תִּרְמֹ֧שׂ הָֽ/אֲדָמָ֛ה וּֽ/בְ/כָל דְּגֵ֥י הַ/יָּ֖ם בְּ/יֶדְ/כֶ֥ם נִתָּֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/002.yaml
  text: And the fear of you and the dread of you shall be upon every beast of the earth and upon every bird of the heavens[a], on everything that creeps on the ground, and on all the fish of the sea[c][b]; into your hand they are given.
translation:
  language: hi
  text: तुम्हारा भय और तुम्हारा आतंक पृथ्वी के हर पशु, आकाश के हर पक्षी, भूमि पर रेंगनेवाले हर प्राणी और समुद्र की सभी मछलियों पर होगा। वे तुम्हारे हाथ में सौंपे गए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹרַאֲכֶם
  choice: तुम्हारा भय
  rationale: यह संज्ञा उस भय को व्यक्त करती है जो मनुष्यों के कारण उत्पन्न होगा; हिन्दी में ‘तुम्हारा भय’ मूल के संबंधवाचक भाव को स्वाभाविक ढंग से बनाए रखता है।
- source_word: חִתְּכֶם
  choice: तुम्हारा आतंक
  rationale: ‘आतंक’ पहले पद ‘भय’ से भिन्न रहते हुए युग्म की तीव्रता को सुरक्षित रखता है।
- source_word: יִהְיֶה
  choice: बना रहेगा
  rationale: अपूर्ण क्रिया यहाँ आगामी और स्थायी परिणामी अवस्था बताती है; ‘बना रहेगा’ आधुनिक हिन्दी में इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: חַיַּת הָאָרֶץ
  choice: पृथ्वी के हर जीव-जन्तु
  rationale: חַיָּה यहाँ स्थल-जीवों को सामूहिक रूप से दर्शाता है। ‘जीव-जन्तु’ सामान्य पाठक के लिए व्यापक और स्वाभाविक है तथा इसे केवल जंगली पशुओं तक सीमित नहीं करता।
- source_word: עוֹף הַשָּׁמָיִם
  choice: आकाश के हर पक्षी
  rationale: संदर्भ में עוֹף का सामान्य अर्थ ‘पक्षी’ है और שָׁמַיִם के लिए ‘आकाश’ सहज आधुनिक हिन्दी है।
- source_word: בְּכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: भूमि पर रेंगनेवाले हर प्राणी
  rationale: רמשׂ भूमि पर रेंगने अथवा छोटे जीवों के चलने की ठोस छवि देता है; ‘भूमि’ पहले आए ‘पृथ्वी’ से אֲדָמָה का भेद बनाए रखता है।
- source_word: דְּגֵי הַיָּם
  choice: समुद्र की सभी मछलियाँ
  rationale: यह पद सीधे समुद्र की मछलियों को सामूहिक रूप से सूचित करता है और ‘सभी’ आसपास की व्यापकता को बनाए रखता है।
- source_word: בְּיֶדְכֶם נִתָּנוּ
  choice: वे तुम्हारे हाथ में सौंपे गए हैं
  rationale: ‘हाथ में सौंपना’ मूल इब्रानी रूपक और उसके अधिकार/नियंत्रण के आशय दोनों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: जलप्रलय के बाद पशुओं पर मनुष्य का अधिकार
  choice: पशुओं का मनुष्यों से भय और मनुष्यों के हाथ में उनका सौंपा जाना स्पष्ट रखा गया है।
  alternative: ‘वे तुम्हारे अधीन कर दिए गए हैं’ कहकर अधिकार के आशय को सीधे खोल देना, या प्रभुत्व के भाव को नरम कर देना।
  rationale: मूल पाठ वास्तविक मानवीय अधिकार का संकेत देता है, पर उसे ‘हाथ में सौंपे गए’ रूपक द्वारा व्यक्त करता है। रूपक को बनाए रखने से पाठ का तनाव सुरक्षित रहता है और बाद की कोई धार्मिक या नैतिक व्यवस्था इसमें नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘भय और आतंक’ मूल के समानार्थी युग्म की तीव्रता बनाए रखते हैं; ‘रेंगनेवाले’ को प्रचलित संयुक्त वर्तनी में लिखा गया है।
