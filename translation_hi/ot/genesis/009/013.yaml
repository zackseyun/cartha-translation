id: GEN.9.13
reference: Genesis 9:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֶת קַשְׁתִּ֕/י נָתַ֖תִּי בֶּֽ/עָנָ֑ן וְ/הָֽיְתָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵ֥ין הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/013.yaml
  text: I have set my bow in the cloud[a], and it will be a sign of the covenant between me and the earth.
translation:
  language: hi
  text: मैंने अपना धनुष बादल में रखा है[a], और वह मेरे और पृथ्वी के बीच वाचा का चिह्न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपना इंद्रधनुष।’ इब्रानी में शाब्दिक रूप से ‘अपना धनुष’ है—वही सामान्य शब्द जो धनुष के लिए आता है; यहाँ बादल के संदर्भ में इसका अभिप्राय इंद्रधनुष है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קַשְׁתִּי
  choice: अपना धनुष
  rationale: קֶשֶׁת का सामान्य अर्थ ‘धनुष’ है। बादल के संदर्भ में इसका संकेत इंद्रधनुष की ओर है, फिर भी मुख्य पाठ में मूल इब्रानी बिंब को रखा गया है और संदर्भगत अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: נָתַתִּי
  choice: मैंने ... रखा है
  rationale: נתן यहाँ किसी वस्तु को स्थापित या रख देने के अर्थ में है। हिंदी का पूर्ण वर्तमान रूप उस कार्य के वर्तमान महत्व को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֶּעָנָן
  choice: बादल में
  rationale: इब्रानी संज्ञा निश्चित एकवचन में है; हिंदी में ‘बादल में’ उसी रूप और दृश्य को सहजता से बनाए रखता है।
- source_word: וְהָיְתָה
  choice: और वह ... होगा
  rationale: 'संदर्भ में यह आगे के परिणाम या कार्य को बताता है: रखा हुआ धनुष वाचा के चिह्न के रूप में रहेगा।'
- source_word: לְאוֹת בְּרִית
  choice: वाचा का चिह्न
  rationale: אוֹת का अर्थ ‘चिह्न’ और בְּרִית का अर्थ ‘वाचा’ है। हिंदी में संबंधसूचक रचना स्पष्ट और स्वाभाविक है।
- source_word: בֵּינִי וּבֵין הָאָרֶץ
  choice: मेरे और पृथ्वी के बीच
  rationale: जलप्रलय-वृत्तांत के विश्वव्यापी संदर्भ में אֶרֶץ के लिए ‘पृथ्वी’ उपयुक्त है; ‘भूमि’ भी संभव है, पर यहाँ अपेक्षाकृत संकीर्ण प्रतीत होगी।
theological_decisions:
- issue: वाचा के संदर्भ में קַשְׁתִּי का अभिप्राय
  choice: मुख्य पाठ में शाब्दिक ‘धनुष’, जिसे संदर्भ में इंद्रधनुष समझा जाता है
  alternative: अपना इंद्रधनुष
  rationale: मूल में हथियार के लिए प्रयुक्त सामान्य शब्द ‘धनुष’ ही है। इसे बनाए रखने से इब्रानी बिंब और उसकी संभावित धार्मिक अर्थ-गहनता सुरक्षित रहती है; स्पष्ट संदर्भगत अर्थ पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘वाचा’ बाइबलीय संबंध की औपचारिकता को बनाए रखता है; ‘धनुष’ मूल रूपक को सुरक्षित रखता है।
