base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/016.yaml
  text: The bow will be in the cloud[b][a], and I will see it and remember the everlasting covenant between God and every living creature among all flesh that is on the earth.
translation:
  language: hi
  text: धनुष[a] बादल में होगा, और मैं उसे देखूँगा और परमेश्वर और पृथ्वी पर के हर जीवित प्राणी—अर्थात् समस्त देहधारी प्राणियों—के बीच की सदा की वाचा को स्मरण करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इंद्रधनुष।’ इब्रानी शब्द का शाब्दिक अर्थ ‘धनुष’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: रहेगा
  rationale: संयोजक वाव के साथ यह पूर्ण क्रिया भविष्य की ओर उन्मुख ईश्वरीय वाणी को आगे बढ़ाती है। ‘रहेगा’ हिन्दी में बादल में चिन्ह की उपस्थिति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַקֶּשֶׁת
  choice: धनुष
  rationale: इब्रानी संज्ञा का शाब्दिक अर्थ ‘धनुष’ है। प्रसंग में यह आकाश में दिखाई देने वाला इंद्रधनुष है; मुख्य पाठ स्रोत-चित्र को रखता है और स्पष्ट संदर्भार्थ पाद-टिप्पणी में देता है।
- source_word: בֶּעָנָן
  choice: बादल में
  rationale: मूल में संज्ञा निश्चित और एकवचन है; ‘बादल में’ उसी रूप को सहज हिन्दी में बनाए रखता है।
- source_word: וּרְאִיתִיהָ
  choice: और मैं उसे देखूँगा
  rationale: स्त्रीलिंग कर्म-प्रत्यय का संकेत पहले आए ‘धनुष’ की ओर है। सरल समन्वित भविष्यकाल मूल वाक्य-क्रम को सुरक्षित रखता है।
- source_word: לִזְכֹּר
  choice: ताकि … स्मरण करूँ
  rationale: लामेद सहित क्रियार्थक संज्ञा उद्देश्य या परिणाम व्यक्त करती है। ‘ताकि’ इस संबंध को स्पष्ट और स्वाभाविक हिन्दी में दिखाता है।
- source_word: בְּרִית עוֹלָם
  choice: सदा की वाचा
  rationale: यह पदबंध युगों तक बनी रहने वाली वाचा बताता है। ‘सदा की वाचा’ वर्तमान हिन्दी में स्पष्ट है और עוֹלָם की स्थायित्व-सूचक शक्ति रखता है।
- source_word: בֵּין אֱלֹהִים וּבֵין
  choice: परमेश्वर और … के बीच
  rationale: इब्रानी में ‘बीच’ की पुनरावृत्ति होती है; हिन्दी में ‘परमेश्वर और … के बीच’ उसी संबंध का स्वाभाविक रूप है।
- source_word: כָּל נֶפֶשׁ חַיָּה בְּכָל בָּשָׂר
  choice: सभी देहधारी जीवों
  rationale: נֶפֶשׁ חַיָּה जीवित प्राणी को और בְּכָל בָּשָׂר उसके देहधारी जीवन के व्यापक वर्ग को निर्दिष्ट करता है। ‘सभी देहधारी जीवों’ अनावश्यक पुनरुक्ति से बचते हुए दोनों भावों को समेटता है।
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: पृथ्वी पर के
  rationale: संबंधवाचक उपवाक्य जीवों का क्षेत्र निर्धारित करता है। सार्वभौमिक जलप्रलय-वाचा के संदर्भ में הָאָרֶץ के लिए ‘पृथ्वी’ उपयुक्त है।
theological_decisions:
- issue: परमेश्वर का वाचा को स्मरण करना
  choice: मैं उसे देखूँगा, ताकि … वाचा को स्मरण करूँ
  alternative: मैं उसे देखकर अपनी वाचा के अनुसार कार्य करूँगा
  rationale: मूल पाठ परमेश्वर के लिए देखने और स्मरण करने की मानवरूपी, वाचागत भाषा का प्रयोग करता है। अनुवाद इसे व्याख्यात्मक रूप से ‘कार्य करने’ में नहीं बदलता और मूल का धर्मवैचारिक तनाव बनाए रखता है।
- issue: प्रत्यक्ष ईश्वरीय वाणी में ‘परमेश्वर’ का तृतीय पुरुष प्रयोग
  choice: परमेश्वर और … के बीच
  alternative: मेरे और … के बीच
  rationale: यद्यपि वक्ता स्वयं परमेश्वर हैं, इब्रानी पाठ यहाँ स्पष्ट रूप से אֱלֹהִים कहता है। तृतीय पुरुष को बनाए रखना मूल की विशिष्ट अभिव्यक्ति को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वाचा’ बाइबलीय संदर्भ में प्रचलित और अर्थ-सटीक पद है; ‘देहधारी जीव’ मूल के ‘जीवित प्राणी/समस्त देह’ के संयुक्त भाव को संक्षेप में व्यक्त करता है।
