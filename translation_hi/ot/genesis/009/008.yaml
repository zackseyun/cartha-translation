  yaml_path: translation/ot/genesis/009/008.yaml
  text: Then God said to Noah and to his sons with him, saying,
translation:
  language: hi
  text: 'तब परमेश्वर ने नूह और उसके पुत्रों से, जो उसके साथ थे, कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक भूतकाल कथा को आगे बढ़ाता है। ‘तब’ उसके क्रमिक बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में यह इस्राएली धर्मग्रंथ के एकमात्र सच्चे परमेश्वर को सूचित करता है; ‘परमेश्वर’ मानक, गरिमापूर्ण हिन्दी रूप है।
- source_word: אֶל ... וְאֶל
  choice: '... और ... से'
  rationale: ‘किसी से कहना’ आधुनिक हिन्दी की स्वाभाविक रचना है और दोनों संबोधित पक्षों को समन्वित करती है।
- source_word: נֹחַ
  choice: नूह
  rationale: यह नाम हिन्दी बाइबलीय परंपरा में प्रचलित रूप से लिप्यंतरित किया गया है।
- source_word: בָּנָיו
  choice: उसके पुत्रों
  rationale: हिब्रू शब्द यहाँ स्पष्ट रूप से पुरुष संतानों को दर्शाता है; इसलिए सामान्य ‘संतानों’ के बजाय ‘पुत्रों’ चुना गया है।
- source_word: אִתּוֹ
  choice: उसके साथ
  rationale: यह वाक्यांश नूह के पुत्रों की उसके साथ उपस्थिति बताता है और हिब्रू की संक्षिप्तता बनाए रखता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: हिब्रू का यह क्रियारूप आगे आने वाले कथन का परिचय देता है। हिन्दी में ‘कहा’ के बाद अगले पद में प्रत्यक्ष वचन रखना ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक है और वही संवादात्मक कार्य निभाता है।
