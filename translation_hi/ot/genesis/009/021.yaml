source:
  edition: WLC
  text: וַ/יֵּ֥שְׁתְּ מִן הַ/יַּ֖יִן וַ/יִּשְׁכָּ֑ר וַ/יִּתְגַּ֖ל בְּ/ת֥וֹךְ אָהֳלֹֽ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/021.yaml
  text: He drank some of the wine[a], became drunk[b], and uncovered himself inside his tent.
translation:
  language: hi
  text: उसने दाखमधु में से कुछ पिया[a], मतवाला हो गया, और अपने तंबू के भीतर अपने को उघाड़ लिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “दाखमधु में से पिया।” यहाँ इब्रानी पदबंध का अर्थ सम्भवतः दाखमधु का कुछ भाग पीना है।'
    reason: lexical_alternative
  - marker: b
    text: या “उघड़ा हुआ पड़ा रहा” अथवा “उघड़ा हुआ था।” इब्रानी क्रिया का अवस्थात्मक अनुवाद भी सम्भव है, पर यहाँ आत्मवाचक अर्थ अधिक उपयुक्त जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁתְּ
  choice: उसने पिया
  rationale: שׁתה के क़ाल वय्यिक्तोल रूप को स्वाभाविक हिन्दी कथात्मक भूतकाल में व्यक्त किया गया है; आरम्भिक וַ का क्रम प्रसंग और क्रियाओं की शृंखला से स्पष्ट है।
- source_word: מִן הַיַּיִן
  choice: दाखमधु में से कुछ
  rationale: מִן यहाँ अंशवाचक अर्थ देता है। ‘में से कुछ’ मूल के ‘दाखमधु में से’ भाव को स्वाभाविक और स्पष्ट हिन्दी में रखता है।
- source_word: וַיִּשְׁכָּר
  choice: मतवाला हो गया
  rationale: שׁכר का क़ाल रूप नशे की अवस्था में प्रवेश बताता है। ‘मतवाला हो गया’ गरिमापूर्ण आधुनिक हिन्दी में इस आरम्भिक/परिणामी अर्थ को व्यक्त करता है।
- source_word: וַיִּתְגַּל
  choice: अपने कपड़े उतार दिए
  rationale: גלה का हित्पाएल रूप यहाँ आत्मवाचक अनावरण का संकेत देता है। यह हिन्दी में ‘अपने को उघाड़ लिया’ की अपेक्षा अधिक स्वाभाविक है, यद्यपि मूल की अवस्थात्मक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: בְּתוֹךְ אָהֳלֹה
  choice: अपने तंबू के भीतर
  rationale: בְּתוֹךְ स्थान के आन्तरिक भाग को सूचित करता है; ‘के भीतर’ आधुनिक, स्पष्ट और मूल के अनुरूप है।
theological_decisions:
- issue: नूह की मतवाली अवस्था और अनावरण का नैतिक/धर्मवैज्ञानिक अर्थ
  choice: घटना को वर्णनात्मक रूप से प्रस्तुत किया गया है, बिना स्पष्ट नैतिक टिप्पणी या यौन आशय जोड़े।
  alternative: वह अपने तंबू में नंगा पड़ा रहा / वह अपने तंबू में उघड़ा हुआ था।
  rationale: इब्रानी पाठ पीने, मतवाला होने और अनावरण को बताता है, पर इस पद में अलग से नैतिक निर्णय नहीं देता। आत्मवाचक अनुवाद क्रियारूप को दर्शाता है, जबकि पादटिप्पणी अवस्थात्मक सम्भावना को बनाए रखती है और आगे के प्रसंग को महत्त्व स्पष्ट करने देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘दाखमधु’ बाइबलीय परिवेश में मदिरा का स्पष्ट और प्रचलित पद है; ‘मतवाला’ औपचारिकता और सामान्य बोध के बीच संतुलन रखता है।
