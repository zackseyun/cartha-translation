lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי נֹחַ
  choice: इस प्रकार नूह की कुल आयु ... हुई
  rationale: यह इब्रानी वंशावली-सूत्र नूह के जीवन की कुल अवधि का सार प्रस्तुत करता है। हिंदी में ‘कुल आयु’ मूल मुहावरे ‘नूह के सब दिन’ का स्पष्ट और स्वाभाविक अर्थ देता है, जबकि ‘इस प्रकार’ समापन-सार के कथात्मक संबंध को व्यक्त करता है।
- source_word: תְּשַׁע מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: नौ सौ पचास वर्ष
  rationale: मूल पाठ संख्या को ‘नौ सौ वर्ष और पचास वर्ष’ के दो समन्वित भागों में रखता है; मानक आधुनिक हिंदी में संयुक्त संख्या स्वाभाविक और अर्थतः पूर्ण है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: एकवचन क्रिया का कर्ता नूह है। हिंदी में ‘वह’ जोड़ना आवश्यक स्वाभाविकता देता है और मूल के संक्षिप्त वंशावली-समापन को बनाए रखता है।
