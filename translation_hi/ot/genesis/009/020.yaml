  text: Noah[a], a man of the soil[b], began to plant a vineyard.
translation:
  language: hi
  text: नूह[a], जो भूमि पर खेती करने वाला एक व्यक्ति था, ने अंगूरों का एक बाग लगाना शुरू किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा गया है: “नूह, जो भूमि पर खेती करने वाला एक व्यक्ति था, अंगूरों का बाग लगानेवाला पहला व्यक्ति था।” इब्रानी वाक्य बहुत संक्षिप्त है; कुछ लोग “शुरू किया” को “सबसे पहले किया” के अर्थ में लेते हैं।'
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी में शाब्दिक क्रिया-क्रम है: “शुरू किया और अंगूरों का बाग लगाया।”'
    reason: source_form
lexical_decisions:
- source_word: וַיָּחֶל
  choice: लगाना शुरू किया
  rationale: हिफ़ील रूप का यहाँ स्वाभाविक अर्थ ‘आरम्भ करना’ है। अगले क्रियापद ‘लगाया’ के साथ संक्षिप्त इब्रानी रचना को सहज हिन्दी में ‘लगाना शुरू किया’ कहा गया है।
- source_word: נֹחַ
  choice: नूह
  rationale: इस व्यक्ति-नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: אִישׁ הָאֲדָמָה
  choice: भूमि पर खेती करनेवाले
  rationale: शाब्दिक भाव ‘भूमि का मनुष्य’ है, जो यहाँ भूमि पर काम करनेवाले कृषक को दर्शाता है। यह अभिव्यक्ति कृषि-संबंधी अर्थ को स्पष्ट रखते हुए हिन्दी में स्वाभाविक है।
- source_word: וַיִּטַּע
  choice: लगाना
  rationale: נטע पौधे या बाग लगाने की सामान्य क्रिया है; सहायक क्रिया ‘शुरू किया’ के कारण हिन्दी में इसका infinitive रूप आया है।
- source_word: כָּרֶם
  choice: अंगूरों का बाग
  rationale: כֶּרֶם अंगूर उगाने के लिए लगाया गया बाग है; ‘अंगूरों का बाग’ सामान्य हिन्दी पाठक के लिए स्पष्ट और सटीक है।
theological_decisions:
- issue: संक्षिप्त क्रिया-क्रम וַיָּחֶל ... וַיִּטַּע का अर्थ
  choice: नूह ने अंगूरों का बाग लगाना शुरू किया
  alternative: नूह अंगूरों का बाग लगानेवाला पहला व्यक्ति था
  rationale: मूल पाठ की सबसे सीधी समझ में ‘आरम्भ किया’ का भाव अगली क्रिया ‘लगाया’ तक जाता है। ‘पहला व्यक्ति था’ सम्भव व्याख्या है, पर ‘पहला’ मूल में स्पष्ट रूप से नहीं लिखा है; इसलिए उसे मुख्य पाठ के बजाय पादटिप्पणी में रखा गया है।
