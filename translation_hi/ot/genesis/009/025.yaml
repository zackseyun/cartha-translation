language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אָר֣וּר כְּנָ֑עַן עֶ֥בֶד עֲבָדִ֖ים יִֽהְיֶ֥ה לְ/אֶחָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/025.yaml
  text: And he said[a], “Canaan is cursed[c][b]; he shall be a servant of servants to his brothers.”
translation:
  language: hi
  text: तब उसने कहा, “कनान शापित है![a] वह अपने भाइयों का दासों का दास होगा।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ क्रिया नहीं है; शाब्दिक रूप से, “कनान शापित है।” पाठ में कनान का नाम है, हाम का नहीं।
    reason: व्याकरणिक और पाठगत स्पष्टता
  - marker: b
    text: “दासों का दास” इब्रानी की तीव्रतावाचक अभिव्यक्ति है; इसका भाव अत्यन्त नीची दासता है।
    reason: इब्रानी मुहावरे की व्याख्या
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वाव-परिणामी के साथ यह कथात्मक क्रम में अगले कथन का परिचय देता है। ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है; कर्ता को नाम देकर स्पष्ट नहीं किया गया, क्योंकि इब्रानी में केवल ‘उसने’ है।
- source_word: אָרוּר
  choice: शापित हो
  rationale: यह विधेय विशेषण शाप की गंभीर घोषणा में आया है। ‘शापित हो’ हिन्दी में अभिशापात्मक बल को स्वाभाविक रूप से व्यक्त करता है, यद्यपि इसे घोषणात्मक ‘शापित है’ भी समझा जा सकता है।
- source_word: כְּנָעַן
  choice: कनान
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी रूप। पाठ स्पष्ट रूप से कनान का नाम लेता है, हाम का नहीं।
- source_word: עֶבֶד עֲבָדִים
  choice: दासों का दास
  rationale: इब्रानी की दोहरावयुक्त, तीव्रतावाचक अभिव्यक्ति को बनाए रखा गया है। इसका भाव अत्यन्त नीची दासता है, पर मुख्य पाठ में उस अर्थ को व्याख्यात्मक ढंग से पूरी तरह खोलने के बजाय मूल अलंकार सुरक्षित रखा गया है।
- source_word: יִהְיֶה
  choice: होगा
  rationale: अपूर्ण क्रिया यहाँ शाप-वचन के भावी परिणाम को व्यक्त करती है। ‘होगा’ आधुनिक हिन्दी में स्वाभाविक और गंभीर है।
- source_word: לְאֶחָיו
  choice: अपने भाइयों के अधीन
  rationale: शाब्दिक अर्थ ‘अपने भाइयों के लिए/प्रति’ है; दासता के प्रसंग में हिन्दी का ‘के अधीन’ संबंध को स्पष्ट और स्वाभाविक बनाता है। ‘भाइयों’ का पुरुषवाचक और पारिवारिक/वंशीय स्वरूप बनाए रखा गया है।
theological_decisions:
- issue: नूह के शाप का लक्ष्य
  choice: मुख्य पाठ में कनान को ही शापित कहा गया है।
  alternative: शाप को सीधे हाम पर लागू करना
  rationale: इब्रानी पाठ में स्पष्ट नाम ‘कनान’ है। अनुवाद ऐसी व्याख्यात्मक परंपरा को पाठ में नहीं मिलाता जो लक्ष्य को हाम में बदल दे।
- issue: दासता की भाषा
  choice: ‘दासों का दास’
  alternative: ‘सेवकों का सेवक’ या केवल ‘सबसे नीचा दास’
  rationale: यह चुनाव बंधुआ अधीनता की कठोरता तथा इब्रानी की तीव्रतावाचक पुनरुक्ति दोनों को सुरक्षित रखता है।
- issue: אָרוּר का वाक्य-बल
  choice: ‘शापित हो’ के रूप में अभिशापात्मक घोषणा
  alternative: ‘शापित है’ के रूप में घोषणात्मक कथन
  rationale: स्वरित क्रियात्मक रूप न होने के कारण इब्रानी संक्षिप्त विधेय-वाक्य है; प्रसंग में यह शाप-वचन है। हिन्दी में ‘शापित हो’ उस वाक्य-बल को स्वाभाविक रूप से देता है, जबकि पादटिप्पणी घोषणात्मक संभावना दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के योग्य रखी गई है। ‘दास’ कठोर दासता को व्यक्त करता है; ‘सेवक’ की अपेक्षाकृत कोमल छाया से बचा गया है। मूल की संक्षिप्तता और काव्यात्मक गंभीरता बनाए रखने के लिए वाक्य छोटा रखा गया है।
