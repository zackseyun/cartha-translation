  text: וַ/יֹּ֥אמֶר אֱלֹהִ֖ים אֶל נֹ֑חַ זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁ֣ר הֲקִמֹ֔תִי בֵּינִ֕/י וּ/בֵ֥ין כָּל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/017.yaml
  text: And God said to Noah[a], “This is the sign of the covenant that I have established between me and all flesh that is on the earth.”
translation:
  language: hi
  text: तब परमेश्वर ने नूह से कहा, “यह उस वाचा का चिन्ह है जिसे मैंने अपने और पृथ्वी पर के सभी प्राणियों[a] के बीच स्थापित किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “समस्त देहधारी।” इस प्रसंग में यह व्यापक इब्रानी अभिव्यक्ति पृथ्वी पर के सभी सजीव प्राणियों के लिए प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में प्रसंग का स्वाभाविक क्रम व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ इस्राएल के एकमात्र परमेश्वर का उल्लेख है; ‘परमेश्वर’ मानक, गरिमापूर्ण हिन्दी रूप है।
- source_word: אֶל נֹחַ
  choice: नूह से
  rationale: पूर्वसर्ग सम्बोधित व्यक्ति को दर्शाता है; हिन्दी में ‘से कहा’ स्वाभाविक प्रयोग है।
- source_word: זֹאת אוֹת הַבְּרִית
  choice: यह उस वाचा का चिन्ह है
  rationale: निर्देशक सर्वनाम पहचानसूचक वाक्य आरम्भ करता है; אוֹת के लिए ‘चिन्ह’ और בְּרִית के लिए पारंपरिक तथा अर्थ-सटीक ‘वाचा’ रखा गया है।
- source_word: הֲקִמֹתִי
  choice: मैंने ... स्थापित किया है
  rationale: हिफ़ील रूप वाचा को स्थापित या दृढ़ करने का अर्थ देता है; पूर्ण कार्य की वर्तमान प्रासंगिकता हिन्दी पूर्ण वर्तमान से व्यक्त होती है।
- source_word: בֵּינִי וּבֵין
  choice: अपने और ... के बीच
  rationale: यह वाचा के दोनों पक्षों का मानक सम्बन्धसूचक विन्यास है।
- source_word: כָּל בָּשָׂר
  choice: सभी प्राणियों
  rationale: शाब्दिक अर्थ ‘सब प्राणी/सारा मांस’ है, पर इस प्रसंग में इसका विस्तार मनुष्यों से आगे समस्त स्थलीय सजीव प्राणियों तक है; ‘सभी प्राणियों’ आधुनिक हिन्दी में उस व्यापक आशय को स्पष्ट रखता है।
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: पृथ्वी पर के
  rationale: सम्बन्धवाचक पदबंध ‘सभी प्राणियों’ को सीमित करता है; सार्वभौमिक जलप्रलय-वाचा के प्रसंग में הָאָרֶץ के लिए ‘पृथ्वी’ उपयुक्त है।
theological_decisions:
- issue: नूह की वाचा में כָּל בָּשָׂר का दायरा
  choice: सभी प्राणी
  alternative: सभी मनुष्य; समस्त देहधारी
  rationale: उत्पत्ति 9 के प्रसंग में यह पद मनुष्यों तक सीमित नहीं, बल्कि पशु-जगत को भी समेटता है। इसलिए ऐसा हिन्दी रूप चुना गया है जो इस व्यापकता को बनाए रखे और वाचा को केवल मानवता तक न घटाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण कथात्मक रजिस्टर। ‘वाचा’ और ‘चिन्ह’ जैसे परिचित बाइबिलीय पद बनाए गए हैं; कठिन शाब्दिक मुहावरे को मुख्य पाठ में स्वाभाविक हिन्दी और पाद-टिप्पणी में अधिक औपचारिक विकल्प से व्यक्त किया गया है।
