id: GEN.9.6
reference: Genesis 9:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שֹׁפֵךְ֙ דַּ֣ם הָֽ/אָדָ֔ם בָּֽ/אָדָ֖ם דָּמ֣/וֹ יִשָּׁפֵ֑ךְ כִּ֚י בְּ/צֶ֣לֶם אֱלֹהִ֔ים עָשָׂ֖ה אֶת הָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/006.yaml
  text: Whoever sheds the blood of man[a], by man shall his blood be shed[b], for God made man in his image.
translation:
  language: hi
  text: जो किसी मनुष्य का खून बहाए, मनुष्य के द्वारा उसका खून बहाया जाएगा; क्योंकि परमेश्वर ने मनुष्य को अपने स्वरूप में बनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: जो ... बहाए
  rationale: कर्तृवाचक कृदंत यहाँ सामान्य, नीतिवचन-सदृश विधान है; ‘जो ... बहाए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: דַּם הָאָדָם
  choice: किसी मनुष्य का खून
  rationale: यहाँ דם हिंसक रूप से जीवन लेने का बोध देता है। ‘खून बहाना’ हिन्दी का स्वाभाविक मुहावरा है, और ‘किसी मनुष्य’ אדם के सामान्य मानवीय अर्थ को स्पष्ट करता है।
- source_word: בָּאָדָם
  choice: मनुष्य के द्वारा
  rationale: ב को साधन अथवा कर्ता बताने वाला माना गया है। यह अनुवाद मानवीय माध्यम से न्याय होने का सबसे स्वाभाविक अर्थ रखता है, पर उसकी व्यवस्था का विस्तार नहीं करता।
- source_word: דָּמוֹ יִשָּׁפֵךְ
  choice: उसका खून बहाया जाएगा
  rationale: निफ़अल अपूर्ण क्रिया के कर्मवाच्य और गंभीर विधिक स्वर को बनाए रखता है; ‘अवश्य’ जोड़कर दायित्व का बल स्रोत से अधिक नहीं किया गया।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले विधान का आधार प्रस्तुत करता है।
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: अपने स्वरूप में
  rationale: स्पष्ट कर्ता परमेश्वर के साथ ‘अपने स्वरूप में’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘प्रतिरूप’ की तुलना में ‘स्वरूप’ परिचित और गरिमापूर्ण है।
- source_word: עָשָׂה
  choice: बनाया है
  rationale: עשה का सीधा अर्थ ‘बनाना’ है; ‘सृजा’ कहना यहाँ प्रयुक्त क्रिया ברא का भाव अनावश्यक रूप से ला सकता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: अन्तिम אדם समस्त मानवजाति के प्रतिनिधिक एकवचन को दर्शाता है। ‘मनुष्य’ आधुनिक हिन्दी में स्त्री-पुरुष दोनों को समेटता है और पद की पुनरुक्ति को यथासंभव सुरक्षित रखता है।
theological_decisions:
- issue: אָדָם का सामान्य मानवीय अर्थ
  choice: मनुष्य
  alternative: मानवजाति / आदमी
  rationale: इस पद में אדם किसी पुरुष मात्र को नहीं, मानव प्राणी को सामान्य रूप से सूचित करता है। ‘मनुष्य’ प्रतिनिधिक एकवचन और गरिमापूर्ण शैली दोनों बनाए रखता है।
- issue: בָּאָדָם में मानवीय कर्तृत्व या केवल प्रतिफल की भविष्यवाणी
  choice: मनुष्य के द्वारा उसका खून बहाया जाएगा
  alternative: मनुष्यों के बीच उसका खून बहाया जाएगा
  rationale: साधनवाचक/कर्तृवाचक ב वाक्य-विन्यास में अधिक स्वाभाविक है। फिर भी अनुवाद यह नहीं बताता कि इसे कौन-सी विशेष संस्था या प्रक्रिया लागू करेगी।
- issue: परमेश्वर के स्वरूप वाला उपवाक्य
  choice: परमेश्वर ने मनुष्य को अपने स्वरूप में बनाया है
  alternative: परमेश्वर के स्वरूप में उसने मनुष्य को बनाया है
  rationale: शब्द-क्रम को स्वाभाविक हिन्दी में रखा गया है और यह मूल दावा अक्षुण्ण है कि मानव जीवन का विशेष मूल्य परमेश्वर के स्वरूप से जुड़ा है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य संक्षिप्त, गंभीर और विधिक-नीतिवचनात्मक रखा गया है। ‘खून बहाना’ सामान्य पाठक के लिए ‘रक्त बहाना’ से अधिक स्वाभाविक है, जबकि ‘मनुष्य’ गरिमापूर्ण और समावेशी मानवीय अर्थ देता है।
