source:
  edition: WLC
  text: וְ/אַ֨ךְ אֶת דִּמְ/כֶ֤ם לְ/נַפְשֹֽׁתֵי/כֶם֙ אֶדְרֹ֔שׁ מִ/יַּ֥ד כָּל חַיָּ֖ה אֶדְרְשֶׁ֑/נּוּ וּ/מִ/יַּ֣ד הָֽ/אָדָ֗ם מִ/יַּד֙ אִ֣ישׁ אָחִ֔י/ו אֶדְרֹ֖שׁ אֶת נֶ֥פֶשׁ הָֽ/אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/005.yaml
  text: And surely I will require your blood for your lives[a]. From the hand of every beast I will require it[e][d][c][b], and from the hand of man—from the hand of each man's brother—I will require the life of the man.
translation:
  language: hi
  text: और निश्चय ही मैं तुम्हारे प्राणों के लिए तुम्हारे खून का हिसाब लूँगा[a]। हर पशु से मैं उसका हिसाब लूँगा[b], और मनुष्य से—हर व्यक्ति के भाई से—मैं मनुष्य के प्राण का हिसाब लूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे खून का, तुम्हारे प्राणों के संबंध में।” इब्रानी में खून और प्राण का संबंध संक्षिप्त रूप में व्यक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर पशु के हाथ से मैं उसे माँगूँगा।” यहाँ “हाथ से” कर्तृत्व और जवाबदेही का मुहावरा है, और “उसे” पहले बताए गए खून की ओर संकेत करता है।
    reason: source_idiom
  - marker: c
    text: शाब्दिक रूप से, “मनुष्य के हाथ से, हर व्यक्ति के भाई के हाथ से।” यह अभिव्यक्ति दूसरे मनुष्य के जीवन के लिए प्रत्येक मनुष्य की जवाबदेही पर बल देती है।
    reason: source_idiom
lexical_decisions:
- source_word: וְאַךְ
  choice: और निश्चय ही
  rationale: וְ के संबंधसूचक बल और אַךְ के जोर को स्वाभाविक तथा गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: דִּמְכֶם לְנַפְשֹׁתֵיכֶם
  choice: तुम्हारे खून का, अर्थात् तुम्हारे प्राणों का
  rationale: दोनों अलग इब्रानी शब्दों—‘खून’ और ‘प्राण/जीवन’—को बनाए रखते हुए उनके निकट संबंध को स्पष्ट करता है; ‘जीवन-रक्त’ कहने पर अगले पदांश के साथ अनावश्यक पुनरुक्ति होती।
- source_word: אֶדְרֹשׁ / אֶדְרְשֶׁנּוּ
  choice: हिसाब लूँगा / उसका हिसाब लूँगा
  rationale: דרשׁ का यहाँ न्यायिक आशय खून बहाए जाने के लिए जवाबदेही माँगना है। ‘हिसाब लेना’ आधुनिक हिन्दी में स्वाभाविक है और इस न्यायिक बल को व्यक्त करता है।
- source_word: מִיַּד
  choice: से
  rationale: शाब्दिक अर्थ ‘के हाथ से’ है, पर यहाँ यह कर्तृत्व और जवाबदेही का मुहावरा है। हिन्दी में बार-बार ‘हाथ से’ कहना कृत्रिम और संभावित रूप से भ्रामक होता; ‘से’ अर्थ को स्वाभाविक रूप से देता है।
- source_word: כָּל חַיָּה
  choice: हर पशु
  rationale: संदर्भ में חַיָּה मनुष्य के विपरीत पशु को सूचित करता है। ‘हर जीवित प्राणी’ से मनुष्य-पशु का विरोध धुँधला पड़ सकता था।
- source_word: אִישׁ אָחִיו
  choice: हर मनुष्य के भाई से
  rationale: शाब्दिक बंधुता की भाषा और प्रत्येक मनुष्य की दूसरे मनुष्य के प्रति जवाबदेही को बनाए रखता है; ‘साथी मनुष्य’ अधिक व्याख्यात्मक होता।
- source_word: נֶפֶשׁ הָאָדָם
  choice: मनुष्य के प्राण
  rationale: נֶפֶשׁ यहाँ खून और हत्या के संदर्भ में जीवित प्राण/जीवन को दर्शाता है, किसी अमूर्त आत्मा के विषय में अलग तत्त्वमीमांसात्मक दावा नहीं।
theological_decisions:
- issue: खून और प्राण के बीच לְ का संबंध
  choice: ‘तुम्हारे खून का, अर्थात् तुम्हारे प्राणों का’
  alternative: ‘तुम्हारे प्राणों के लिए तुम्हारे खून का’
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य पाठ में खून और प्राण का संबंध स्पष्ट किया गया है, जबकि पादटिप्पणी अधिक रूपात्मक विकल्प सुरक्षित रखती है।
- issue: נֶפֶשׁ का अर्थ
  choice: प्राण/जीवन, न कि आत्मा
  alternative: आत्मा
  rationale: तात्कालिक संदर्भ खून बहाने और मानव-जीवन लेने की जवाबदेही का है। ‘आत्मा’ आधुनिक पाठक को ऐसा शरीर-आत्मा संबंधी दावा सुना सकता है जो यहाँ अग्रभूमि में नहीं है।
- issue: אִישׁ אָחִיו में ‘भाई’ की भाषा
  choice: शाब्दिक ‘हर मनुष्य के भाई’ को बनाए रखना
  alternative: ‘उसके साथी मनुष्य’
  rationale: यह वाक्य मानव समुदाय के पारस्परिक बंधुत्व और जवाबदेही को एक साथ उभारता है; इसे सामान्य ‘दूसरे मनुष्य’ में बदलना स्रोत की तनावपूर्ण बंधुता-भाषा को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट न्यायिक शैली अपनाई गई है। ‘रक्त’ की अपेक्षा ‘खून’ सामान्य पाठकों के लिए अधिक सहज है, जबकि ‘प्राण’ खून और जीवन के संबंध को संक्षेप में व्यक्त करता है। स्रोत के ‘हाथ से’ मुहावरे को मुख्य पाठ में स्वाभाविक ‘से’ किया गया और पादटिप्पणी में शाब्दिक रूप सुरक्षित रखा गया है।
