source:
  edition: WLC
  text: אַךְ בָּשָׂ֕ר בְּ/נַפְשׁ֥/וֹ דָמ֖/וֹ לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/004.yaml
  text: But you shall not eat flesh with its life[a], that is[b], its blood.
translation:
  language: hi
  text: परन्तु जिस मांस में उसका जीवन—अर्थात् उसका लहू—हो, उसे मत खाना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे अधिक शाब्दिक रूप से इस प्रकार भी पढ़ा जा सकता है: “परन्तु मांस को उसके जीवन—उसके लहू—समेत न खाना।”'
    reason: इब्रानी में ‘जीवन’ और ‘लहू’ के बीच ‘अर्थात्’ जैसा कोई स्पष्ट संयोजक नहीं है; दोनों शब्द सीधे समानाधिकरण में रखे गए हैं।
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु
  rationale: यह पिछले पद में पशुओं को भोजन के रूप में खाने की अनुमति पर अपवाद अथवा सीमा लगाता है; ‘परन्तु’ इस विरोध को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בָּשָׂר
  choice: मांस
  rationale: इस प्रसंग में यह खाने योग्य देह-मांस को दर्शाता है। आधुनिक हिन्दी में ‘मांस’ स्रोत की ठोस छवि और आहार-संबंधी अर्थ दोनों को स्पष्ट रखता है।
- source_word: בְּנַפְשׁוֹ
  choice: उसके जीवन समेत
  rationale: यहाँ נֶפֶשׁ का अर्थ प्राणी का जीवन है, न कि बाद की धर्मवैज्ञानिक धारणा के अनुसार कोई अमूर्त ‘आत्मा’। ‘जीवन’ आधुनिक पाठक के लिए स्पष्ट है और בְּ के सहवर्ती अर्थ को ‘समेत’ व्यक्त करता है।
- source_word: דָמוֹ
  choice: उसके लहू
  rationale: דָם का सीधा अर्थ ‘लहू/रक्त’ है। ‘लहू’ सहज, ठोस और बाइबिलीय गरिमा वाला शब्द है; इसे ‘जीवन-रक्त’ कहना अगले पदबंध की व्याख्यात्मक शक्ति को पहले ही समेट देता।
- source_word: בְּנַפְשׁוֹ דָמוֹ
  choice: उसके जीवन—अर्थात् उसके लहू—समेत
  rationale: इब्रानी में ‘जीवन’ और ‘लहू’ संक्षिप्त समानाधिकरण में साथ रखे गए हैं। ‘अर्थात्’ हिन्दी में उनके संबंध को स्पष्ट करता है, जबकि डैश मूल की संक्षिप्तता को कुछ हद तक बनाए रखते हैं।
- source_word: לֹא תֹאכֵלוּ
  choice: तुम ... न खाना
  rationale: निषेधात्मक अपूर्ण क्रिया यहाँ आज्ञात्मक निषेध है। ‘न खाना’ सामान्य आधुनिक हिन्दी में स्पष्ट है और ‘तुम’ मूल के बहुवचन संबोधन को बनाए रखता है।
theological_decisions:
- issue: נֶפֶשׁ और लहू का संबंध
  choice: נֶפֶשׁ का अनुवाद ‘जीवन’ किया गया और लहू को उसका स्पष्टीकरण माना गया।
  alternative: ‘प्राण’ या ‘आत्मा’; अथवा बिना ‘अर्थात्’ के सीधा समानाधिकरण।
  rationale: इस संदर्भ में शब्द जीवित प्राणी के जीवन को दर्शाता है। ‘आत्मा’ कहना पाठ में अनावश्यक रूप से बाद की धर्मवैज्ञानिक श्रेणी ला सकता है। फिर भी इब्रानी की संक्षिप्त रचना में संबंध की कुछ व्याकरणिक अस्पष्टता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘परन्तु’ और ‘लहू’ गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध हैं। वाक्य-विन्यास निषेध की गंभीरता रखता है, और ‘तुम’ इब्रानी बहुवचन को व्यक्त करता है।
