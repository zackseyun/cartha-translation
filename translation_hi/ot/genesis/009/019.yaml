    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשָׁה אֵלֶּה
  choice: ये तीनों
  rationale: इब्रानी पदबंध में संख्या और संकेतवाचक शब्द पर बल है। ‘ये तीनों’ आधुनिक हिन्दी में स्वाभाविक है और उस बल को बनाए रखता है।
- source_word: בְּנֵי נֹחַ
  choice: नूह के पुत्र थे
  rationale: इब्रानी में कोई स्पष्ट संयोजक क्रिया नहीं है; हिन्दी कथात्मक प्रवाह के लिए ‘थे’ की पूर्ति करती है।
- source_word: וּמֵאֵלֶּה
  choice: और इन्हीं से
  rationale: מִן के साथ संकेतवाचक रूप का अर्थ ‘इनसे’ है; ‘इन्हीं’ तीनों पुत्रों से संबंध पर मूल पाठ का बल स्पष्ट करता है।
- source_word: נָפְצָה
  choice: लोग फैल गए
  rationale: נפץ का मूल भाव बिखरने या फैलने का है। यहाँ वंशावली के संदर्भ में पृथ्वी पर मनुष्यों के फैलने की बात है; यह अनुवाद मूल क्रिया की गति और संदर्भगत जन-विस्तार दोनों को व्यक्त करता है।
- source_word: כָל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: जलप्रलय के बाद के सार्वभौमिक संदर्भ में אֶרֶץ के लिए ‘पृथ्वी’ उपयुक्त है। हिन्दी में फैलने की क्रिया के साथ ‘सारी पृथ्वी पर’ स्वाभाविक है।
theological_decisions:
- issue: जलप्रलय के बाद הָאָרֶץ का विस्तार
  choice: सारी पृथ्वी
  alternative: सारा देश
  rationale: यह पद आगे आने वाली जातियों की सूची की भूमिका के रूप में नूह के पुत्रों से मानवजाति के व्यापक फैलाव का सार देता है; इसलिए यहाँ स्थानीय ‘देश’ की अपेक्षा ‘पृथ्वी’ अधिक संभावित है।
- issue: נָפְצָה का कर्ता और अर्थ
  choice: लोग फैल गए
  alternative: सारी पृथ्वी आबाद हुई / सारी पृथ्वी बिखर गई
  rationale: व्याकरण में ‘सारी पृथ्वी’ कर्ता के रूप में पढ़ी जा सकती है, पर ‘पृथ्वी बिखर गई’ हिन्दी में भ्रामक होगा। संदर्भ मनुष्यों के फैलाव का है; ‘लोग’ को स्पष्ट करके अर्थ स्वाभाविक बनाया गया है, और अधिक शाब्दिक रचना पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आबाद हुई’ की तुलना में ‘लोग फैल गए’ मूल क्रिया נפץ के फैलने/बिखरने के भाव को बेहतर बचाता है और हिन्दी में पृथ्वी के स्वयं बिखरने की गलत छवि से बचाता है।
