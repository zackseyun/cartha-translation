  yaml_path: translation/ot/genesis/009/022.yaml
  text: And Ham[a], the father of Canaan, saw his father's nakedness and told his two brothers outside.
translation:
  language: hi
  text: और कनान के पिता हाम ने अपने पिता की नग्नता[a] देखी और बाहर अपने दोनों भाइयों को बताया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “उसके पिता की नग्नता।” पुराने नियम के कुछ संदर्भों में यह अभिव्यक्ति यौन व्यंजना के रूप में प्रयुक्त हो सकती है; यहाँ अनुवाद शाब्दिक शब्दावली को बनाए रखता है और उस व्याख्यात्मक प्रश्न को खुला छोड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: ראה का यह कथात्मक रूप सामान्य रूप से ‘देखा’ अर्थ देता है; इससे अधिक व्याख्यात्मक अर्थ आवश्यक नहीं है।
- source_word: חָם
  choice: हाम
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: אֲבִי כְנַעַן
  choice: कनान के पिता
  rationale: इब्रानी संबंधवाची पदबंध हाम की पहचान ‘कनान के पिता’ के रूप में करता है; इसे स्पष्ट और स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: עֶרְוַת אָבִיו
  choice: अपने पिता का नंगापन
  rationale: यह इब्रानी अभिव्यक्ति का निकट और स्वाभाविक हिन्दी रूप है। इससे किसी अधिक विशिष्ट यौन कृत्य को पाठ में आरोपित नहीं किया जाता।
- source_word: וַיַּגֵּד
  choice: बताया
  rationale: נגד के हिफ़ील रूप का यहाँ स्वाभाविक कथात्मक अर्थ ‘बताया’ है।
- source_word: לִשְׁנֵי אֶחָיו
  choice: अपने दोनों भाइयों को
  rationale: मूल पाठ में संख्या ‘दो’ स्पष्ट है; ‘दोनों भाइयों’ से हिन्दी में यह स्वाभाविक रूप से व्यक्त होती है।
- source_word: בַּחוּץ
  choice: बाहर
  rationale: यह नूह के तंबू के भीतर होने के विपरीत बाहरी स्थान को संक्षेप और स्पष्ट रूप से दर्शाता है।
theological_decisions:
- issue: इस कथा में ‘अपने पिता का नंगापन’ का अर्थ
  choice: शब्दावली को निकट रूप में रखते हुए केवल यह कहा गया है कि हाम ने अपने पिता का नंगापन देखा।
  alternative: इसे किसी अधिक गंभीर यौन अपराध या माता के साथ अनाचार की ओर संकेत करने वाला व्यंजक मानना।
  rationale: कुछ पुराने नियम के संदर्भों में यह अभिव्यक्ति यौन व्यंजना हो सकती है, पर इस पद में क्रियाएँ ‘देखा’ और ‘बताया’ हैं तथा निकट संदर्भ नूह के उघड़े होने पर केंद्रित है। इसलिए मुख्य पाठ अस्पष्टता को बनाए रखता है और टिप्पणी व्यापक व्याख्यात्मक संभावना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘नंगापन’ सामान्य पाठक के लिए सहज है, जबकि पादटिप्पणी में अधिक औपचारिक ‘नग्नता’ देकर इब्रानी अभिव्यक्ति का शाब्दिक स्वरूप स्पष्ट किया गया है।
