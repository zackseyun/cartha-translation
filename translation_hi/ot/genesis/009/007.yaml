  yaml_path: translation/ot/genesis/009/007.yaml
  text: And as for you[a], be fruitful and multiply; swarm in the earth and multiply in it.
translation:
  language: hi
  text: और तुम फलो-फूलो और बढ़ो; पृथ्वी पर बहुतायत से बढ़ो[a] और उसमें बढ़ो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पृथ्वी पर उमड़ो।” इब्रानी क्रिया बहुतायत में पनपने या बड़ी संख्या में उमड़ने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: और तुम
  rationale: स्वतंत्र सर्वनाम אַתֶּם संबोधन पर बल देता है; हिन्दी में प्रसंगगत पुनरारंभ और बल को स्वाभाविक रूप से ‘और तुम’ व्यक्त करता है।
- source_word: פְּרוּ
  choice: फलो-फूलो
  rationale: פרה का आशय सन्तान उत्पन्न करके फलवन्त होने से है। ‘फलो-फूलो’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा इसे केवल कृषि-संबंधी अर्थ तक सीमित नहीं करता।
- source_word: וּרְבוּ
  choice: और बढ़ते जाओ
  rationale: רבה संख्यात्मक वृद्धि को व्यक्त करता है। ‘बढ़ते जाओ’ आज की सहज हिन्दी में पुनरावृत्त आदेश और निरन्तर वृद्धि का भाव बनाए रखता है।
- source_word: שִׁרְצוּ
  choice: भरपूर फैलो
  rationale: שׁרץ तीव्र और प्रचुर जन-वृद्धि तथा फैलाव का सजीव भाव रखता है। मनुष्यों के लिए ‘झुंड की तरह उमड़ो’ जैसे अप्राकृतिक शब्दों से बचते हुए ‘भरपूर फैलो’ उसका बल संप्रेषित करता है।
- source_word: בָאָרֶץ
  choice: पृथ्वी पर
  rationale: यहाँ אֶרֶץ जलप्रलय के बाद मानव-वृद्धि के क्षेत्र के रूप में पृथ्वी को दर्शाता है; हिन्दी में सतह और निवास-क्षेत्र के लिए ‘पृथ्वी पर’ स्वाभाविक है।
- source_word: וּרְבוּ בָהּ
  choice: और उस पर बढ़ते जाओ
  rationale: רבה की पुनरावृत्ति को बल और समानांतरता के लिए बनाए रखा गया है; בָהּ का स्त्रीलिंग प्रत्यय पृथ्वी की ओर लौटता है।
theological_decisions:
- issue: सृष्टि-आदेश और जलप्रलय के बाद की आशीष से इस पद का संबंध
  choice: नूह और उसके पुत्रों को दिए गए नवीकृत आदेश/आशीष के शब्दों को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के प्रस्तुत किया गया है।
  alternative: इसे केवल उत्पत्ति 1:28 की पुनरावृत्ति मानना, या पाठ में विस्तृत वाचा-संबंधी धर्मसिद्धान्त जोड़ना।
  rationale: इब्रानी में उत्पत्ति 1:28 से समानता रखने वाली आज्ञार्थक आशीष की भाषा है; अनुवाद उस प्रतिध्वनि को रखता है, पर पाठ से आगे कोई निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किन्तु गरिमापूर्ण शैली। ‘फलो-फूलो’ और ‘बढ़ते जाओ’ आशीष-सदृश आज्ञा की लय बनाए रखते हैं। प्रबल इब्रानी क्रिया שׁרץ की असामान्य सजीवता को मुख्य पाठ और पाद-टिप्पणी दोनों में सुरक्षित रखा गया है।
