source:
  edition: WLC
  text: יַ֤פְתְּ אֱלֹהִים֙ לְ/יֶ֔פֶת וְ/יִשְׁכֹּ֖ן בְּ/אָֽהֳלֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/027.yaml
  text: May God enlarge Japheth[a], and may he dwell in the tents of Shem, and let Canaan be a servant to them.
translation:
  language: hi
  text: ईश्वर येपेत को विस्तार दे, और वह शेम के तंबुओं में निवास करे[a]; और कनान उनका गुलाम हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वह’ से ईश्वर या येपेत, दोनों में से कोई अभिप्रेत हो सकता है। इब्रानी में ‘निवास करे’ का कर्ता स्पष्ट नहीं किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: יַפְתְּ
  choice: विस्तार करे
  rationale: यह क्रिया येपेत के लिए स्थान विस्तृत करने या उसे फैलाव देने का भाव रखती है। ‘विस्तार करे’ आशीर्वाद की शैली में स्वाभाविक है, यद्यपि इब्रानी में येपेत के नाम के साथ होने वाला ध्वनि-खेल हिन्दी में पूरी तरह सुरक्षित नहीं रह सकता।
- source_word: אֱלֹהִים
  choice: ईश्वर
  rationale: क्रिया एकवचन है और यहाँ एकमात्र परमेश्वर अभिप्रेत है; आधुनिक मानक हिन्दी में ‘ईश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: לְיֶפֶת
  choice: येपेत का
  rationale: सम्बन्धसूचक उपसर्ग को हिन्दी मुहावरे के अनुसार ‘येपेत का विस्तार करे’ में व्यक्त किया गया है। व्यक्तिगत नाम का लिप्यंतरण किया गया है।
- source_word: וְיִשְׁכֹּן
  choice: और वह ... निवास करे
  rationale: संभावनार्थक/कामनार्थक क्रिया को ‘निवास करे’ से व्यक्त किया गया है। ‘वह’ इब्रानी की तरह कर्ता को ईश्वर या येपेत में से किसी एक के रूप में निश्चित नहीं करता।
- source_word: בְּאָהֳלֵי שֵׁם
  choice: शेम के तंबुओं में
  rationale: स्थानसूचक वाक्यांश और ‘तंबुओं’ का ठोस बिंब अक्षुण्ण रखा गया है।
- source_word: וִיהִי
  choice: और ... हो
  rationale: यह रूप आशीर्वाद/शाप की कामनार्थक शैली को स्वाभाविक हिन्दी में आगे बढ़ाता है।
- source_word: כְנַעַן
  choice: कनान
  rationale: व्यक्ति और उसके वंश को सूचित करने वाला नाम हिन्दी में प्रचलित रूप के अनुसार रखा गया है।
- source_word: עֶבֶד
  choice: दास
  rationale: यहाँ अधीनता की स्थिति प्रमुख है; ‘दास’ इसे ‘सेवक’ की अपेक्षा अधिक स्पष्टता से व्यक्त करता है।
- source_word: לָמוֹ
  choice: उनका
  rationale: यह बहुवचन सर्वनाम है और प्रसंग में स्वाभाविक रूप से शेम और येपेत से सम्बद्ध समझा जाता है। ‘उनका’ हिन्दी में बहुवचन को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘शेम के तंबुओं में निवास करे’ का कर्ता
  choice: मुख्य पाठ में ‘वह’ रखकर कर्ता को अनिर्णीत छोड़ा गया है।
  alternative: ‘ईश्वर शेम के तंबुओं में निवास करे’ अथवा ‘येपेत शेम के तंबुओं में निवास करे।’
  rationale: इब्रानी क्रिया का कर्ता स्पष्ट रूप से लिखा नहीं गया है और व्याकरण तथा प्रसंग दोनों अर्थों की अनुमति देते हैं। किसी एक व्याख्या को मुख्य पाठ में आरोपित करने के बजाय वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आशीर्वाद की कामनार्थक लय के लिए ‘करे’ और ‘हो’ का प्रयोग किया गया है; ‘तंबुओं’ की मूल छवि तथा कर्ता की वास्तविक अस्पष्टता सुरक्षित है।
