  text: וַ/יִּ֥יקֶץ נֹ֖חַ מִ/יֵּינ֑/וֹ וַ/יֵּ֕דַע אֵ֛ת אֲשֶׁר עָ֥שָׂה ל֖/וֹ בְּנ֥/וֹ הַ/קָּטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/024.yaml
  text: When Noah awoke from his wine[a], he knew what his youngest son had done to him.
translation:
  language: hi
  text: जब नूह अपने दाखमधु के नशे से जागा, तब उसे पता चला कि उसके छोटे बेटे[a] ने उसके साथ क्या किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके सबसे छोटे बेटे ने।” इब्रानी विशेषण का अर्थ प्रसंग के अनुसार “छोटा,” “कम आयु का,” या “सबसे छोटा” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקֶץ
  choice: जागा
  rationale: क्रिया יקץ का सामान्य अर्थ नींद से जागना है। यहाँ दाखमधु के कारण आई नींद से जागना प्रसंगानुकूल है; ‘नशा उतर गया’ कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: מִיֵּינוֹ
  choice: अपने दाखमधु के नशे से
  rationale: शाब्दिक रूप ‘अपने दाखमधु से’ है, पर हिन्दी में ‘दाखमधु से जागा’ अस्वाभाविक और अस्पष्ट है। ‘दाखमधु के नशे से जागा’ मूल मुहावरे का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיֵּדַע
  choice: उसे पता चला
  rationale: ידע का मूल अर्थ ‘जानना’ है; इस घटनाक्रम में यह पहले हुई बात का ज्ञान होने को दर्शाता है। हिन्दी में ‘उसे पता चला’ स्वाभाविक है और ज्ञान मिलने की कथात्मक प्रगति स्पष्ट करता है।
- source_word: אֵת אֲשֶׁר עָשָׂה לוֹ
  choice: उसके साथ क्या किया था
  rationale: यह अनिश्चित रूप से उस काम की ओर संकेत करता है जो नूह के प्रति पहले किया जा चुका था। हिन्दी का पूर्ण भूतकाल घटनाओं का क्रम बनाए रखता है और कार्य का स्वरूप निर्धारित नहीं करता।
- source_word: בְּנוֹ הַקָּטָן
  choice: उसके छोटे बेटे
  rationale: קָטָן का अर्थ ‘छोटा’, ‘कम आयु का’ या प्रसंगानुसार ‘सबसे छोटा’ हो सकता है। ‘छोटा बेटा’ हिन्दी में आयु-क्रम का स्वाभाविक संकेत देता है और ‘सबसे छोटा’ की अपेक्षा मूल की संभावित तुलनात्मक अस्पष्टता अधिक सुरक्षित रखता है।
theological_decisions:
- issue: नूह के साथ किए गए कार्य का स्वरूप
  choice: ‘उसके साथ क्या किया था’ कहकर कार्य को अनिर्दिष्ट रखा गया।
  alternative: इसे केवल नंगापन देखने और बताने, अथवा किसी अधिक गंभीर यौन अपराध के रूप में स्पष्ट करना।
  rationale: इस पद का इब्रानी पाठ कार्य की प्रकृति नहीं बताता। किसी विशिष्ट व्याख्या को अनुवाद में जोड़ना मूल की जानबूझकर बनी अस्पष्टता और धर्मवैचारिक तनाव को मिटा देता।
- issue: ‘छोटे बेटे’ का अभिप्रेत व्यक्ति और आयु-क्रम
  choice: इब्रानी पारिवारिक पदबंध को ‘उसके छोटे बेटे’ के रूप में रखा गया, बिना किसी व्यक्ति का नाम जोड़े।
  alternative: ‘उसके सबसे छोटे बेटे’ कहना या हाम अथवा कनान का नाम स्पष्ट रूप से जोड़ना।
  rationale: קָטָן आयु में छोटे अथवा सबसे छोटे का बोध करा सकता है, और व्यापक प्रसंग में अभिप्रेत व्यक्ति को लेकर प्रश्न उठते हैं। अनुवाद मूल से अधिक स्पष्टता नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दाखमधु’ बाइबलीय संदर्भ में परिचित तथा स्पष्ट शब्द है। मुख्य पाठ में ‘छोटे बेटे’ और पादटिप्पणी में ‘सबसे छोटे बेटे’ रखकर इब्रानी विशेषण की वास्तविक अर्थ-सीमा सुरक्षित की गई है।
