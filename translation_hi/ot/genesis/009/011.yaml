  text: וַ/הֲקִמֹתִ֤י אֶת בְּרִיתִ/י֙ אִתְּ/כֶ֔ם וְ/לֹֽא יִכָּרֵ֧ת כָּל בָּשָׂ֛ר ע֖וֹד מִ/מֵּ֣י הַ/מַּבּ֑וּל וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְ/שַׁחֵ֥ת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/011.yaml
  text: 'And I will establish my covenant with you: never again will all flesh be cut off by the waters of the flood[b][a], and never again will there be a flood to destroy the earth.'
translation:
  language: hi
  text: 'और मैं तुम्हारे साथ अपनी वाचा स्थापित करूँगा: जलप्रलय के जल से फिर कभी समस्त प्राणी[a] नष्ट नहीं होंगे[b], और पृथ्वी को नष्ट करने के लिए फिर कभी जलप्रलय नहीं होगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘समस्त प्राणी’ का संकेत व्यापक रूप से जीवित प्राणियों की ओर है, केवल मनुष्यों की ओर नहीं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘काट डाले जाएँगे’; यहाँ इसका अर्थ विनाश होना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: मैं…कायम करूँगा
  rationale: हिफ़ील रूप और वाचा-संबंधी प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है। ‘कायम करूँगा’ स्थापित करने और दृढ़ रखने—दोनों संभावित भावों को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: בְּרִיתִי
  choice: अपनी वाचा
  rationale: ‘वाचा’ उत्पत्ति में इस प्रमुख धर्मवैचारिक और साहित्यिक पद की गंभीरता तथा निरंतरता बनाए रखता है।
- source_word: אִתְּכֶם
  choice: तुम्हारे साथ
  rationale: बहुवचन संबोधन का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: יִכָּרֵת
  choice: नाश नहीं किए जाएँगे
  rationale: निफ़ाल का शाब्दिक अर्थ ‘काट दिए जाएँगे’ है, पर जलप्रलय के प्रसंग में उसका अभिप्राय विनाश है। मुख्य पाठ में स्पष्ट आधुनिक हिन्दी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: כָּל בָּשָׂר
  choice: समस्त देहधारी
  rationale: हिब्रू की देह-संबंधी अभिव्यक्ति को बनाए रखते हुए इसका दायरा केवल मनुष्यों तक सीमित नहीं करता।
- source_word: עוֹד
  choice: फिर कभी
  rationale: नकारात्मक प्रतिज्ञात्मक संदर्भ में इसका स्वाभाविक अर्थ ‘फिर कभी नहीं’ है।
- source_word: מִמֵּי הַמַּבּוּל
  choice: जलप्रलय के जल से
  rationale: מן को विनाश के साधन अथवा स्रोत के रूप में व्यक्त करता है और मूल की संरचना के निकट रहता है।
- source_word: מַבּוּל
  choice: जलप्रलय
  rationale: नूह-वृत्तांत में महाविनाशकारी बाढ़ के लिए स्पष्ट, प्रतिष्ठित और सामान्य हिन्दी पद।
- source_word: לְשַׁחֵת
  choice: नाश करने के लिए
  rationale: इस प्रसंग में שׁחת के विनाशकारी अर्थ को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: जलप्रलय और सार्वभौमिक वाचा के संदर्भ में व्यापक अर्थ उचित है; ‘देश’ या ‘भूमि’ इसे अनावश्यक रूप से स्थानीय बना सकता है।
theological_decisions:
- issue: वाचा की प्रतिज्ञा में כָּל בָּשָׂר का दायरा
  choice: ‘समस्त देहधारी’ रखा गया, जिससे मनुष्य और अन्य जीव दोनों सम्मिलित रह सकें।
  alternative: केवल ‘सभी मनुष्य’ अथवा स्पष्ट व्याख्यात्मक रूप ‘सभी जीवित प्राणी’।
  rationale: जलप्रलय के बाद की वाचा में मनुष्य और पशु दोनों आते हैं। चुना हुआ रूप मूल की व्यापकता और देह-संबंधी रूपक को बनाए रखता है।
- issue: वाचा के साथ קום का भाव
  choice: ‘अपनी वाचा कायम करूँगा’।
  alternative: ‘अपनी वाचा स्थापित करूँगा’ अथवा ‘अपनी वाचा की पुष्टि करूँगा’।
  rationale: यह रूप वाचा की स्थापना और उसकी दृढ़ पुष्टि के बीच संभावित अर्थगत तनाव को किसी एक व्याख्या में पूरी तरह बंद नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, स्पष्ट और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘वाचा’, ‘कायम करना’ और ‘जलप्रलय’ बाइबिलीय गरिमा बनाए रखते हैं, जबकि वाक्यरचना साधारण पाठक के लिए सहज है।
