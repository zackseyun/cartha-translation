  text: जलप्रलय के बाद नूह साढ़े तीन सौ वर्ष जीवित रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: חיה का वय्यिक्तोल रूप यहाँ जलप्रलय के बाद नूह के जीवन की अवधि बताता है। ‘जीवित रहा’ आधुनिक हिन्दी में स्वाभाविक है और ‘बचा रहा’ की तरह उद्धार पर अनावश्यक बल नहीं देता।
- source_word: נֹחַ
  choice: नूह
  rationale: नֹחַ नाम का हिन्दी बाइबलीय परंपरा में प्रचलित और सुबोध लिप्यंतरण।
- source_word: אַחַר
  choice: के बाद
  rationale: यह समयगत पश्चातता व्यक्त करता है; ‘के बाद’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: הַמַּבּוּל
  choice: जलप्रलय
  rationale: सप्रत्यय संज्ञा कथा में पहले से ज्ञात महाप्लावन को दर्शाती है। ‘जलप्रलय’ आधुनिक हिन्दी में स्पष्ट और स्थापित पद है।
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: साढ़े तीन सौ वर्ष
  rationale: शाब्दिक संख्या ‘तीन सौ और पचास वर्ष’ का स्वाभाविक तथा सटीक हिन्दी संख्यात्मक रूप ‘साढ़े तीन सौ वर्ष’ है।
