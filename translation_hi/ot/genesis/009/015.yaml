id: GEN.9.15
reference: Genesis 9:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/זָכַרְתִּ֣י אֶת בְּרִיתִ֗/י אֲשֶׁ֤ר בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה בְּ/כָל בָּשָׂ֑ר וְ/לֹֽא יִֽהְיֶ֨ה ע֤וֹד הַ/מַּ֨יִם֙ לְ/מַבּ֔וּל לְ/שַׁחֵ֖ת כָּל בָּשָֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/015.yaml
  text: and I will remember my covenant that is between me and you and every living creature among all flesh[b][a], and the waters will never again become a flood to destroy all flesh.
translation:
  language: hi
  text: और मैं अपनी उस वाचा को स्मरण करूँगा जो मेरे और तुम्हारे तथा हर जीवित प्राणी के साथ है—अर्थात् सभी देहधारी प्राणियों के साथ; और जल फिर कभी सभी देहधारी प्राणियों को नष्ट करने के लिए जलप्रलय नहीं बनेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: और मैं…स्मरण करूँगा
  rationale: संयुक्त क्रिया का यहाँ परमेश्वर के कथन में भविष्यकालीन अर्थ है। ‘स्मरण करूँगा’ वाचा-संबंधी इब्रानी अभिव्यक्ति और उसके धर्मवैज्ञानिक तनाव को बनाए रखता है।
- source_word: בְּרִיתִי
  choice: अपनी वाचा
  rationale: ‘वाचा’ औपचारिक संबंध और प्रतिज्ञा का मानक, गरिमापूर्ण हिन्दी रूप है।
- source_word: כָּל נֶפֶשׁ חַיָּה בְּכָל בָּשָׂר
  choice: सभी देहधारी प्राणियों में से हर जीवित प्राणी
  rationale: यह रूप נֶפֶשׁ חַיָּה को ‘जीवित प्राणी’ और בְּכָל בָּשָׂר के वर्गगत/समावेशी भाव को स्वाभाविक हिन्दी में व्यक्त करता है; इसमें मनुष्यों के साथ पशु भी सम्मिलित हैं।
- source_word: וְלֹא יִהְיֶה עוֹד הַמַּיִם לְמַבּוּל
  choice: और जल फिर कभी ऐसा जलप्रलय न बनेगा
  rationale: ‘फिर कभी…न’ स्थायी पुनरावृत्ति-निषेध व्यक्त करता है, और לְמַבּוּל को परिणाम/कार्य के अर्थ में स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: לְשַׁחֵת כָּל בָּשָׂר
  choice: जो सभी प्राणियों को नष्ट कर दे
  rationale: לְשַׁחֵת उद्देश्य/परिणाम बताता है। अंतिम כָּל בָּשָׂר का आशय समस्त देहधारी जीव हैं; ‘सभी प्राणी’ आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: परमेश्वर के स्मरण की मानव-सदृश भाषा
  choice: ‘मैं…स्मरण करूँगा’ को यथावत रखना
  alternative: ‘मैं अपनी वाचा के अनुसार कार्य करूँगा’ या ‘मैं अपनी वाचा को ध्यान में रखूँगा’
  rationale: मूल पाठ स्पष्टतः स्मरण की भाषा प्रयुक्त करता है। उसकी व्याख्या करके तनाव मिटाने के बजाय वाचा-संबंधी कथन को सुरक्षित रखा गया है।
- issue: כָּל בָּשָׂר का व्यापक दायरा
  choice: मनुष्यों और पशुओं दोनों को समेटने वाला ‘सभी देहधारी प्राणी/सभी प्राणी’
  alternative: ‘सभी मनुष्य’
  rationale: संदर्भ में वाचा हर जीवित प्राणी से है; अतः इसे केवल मानवजाति तक सीमित करना अनुचित होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। ‘वाचा’, ‘स्मरण’ और ‘जलप्रलय’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; अस्वाभाविक ‘सब देह’ को मुख्य पाठ में स्पष्ट अर्थ से व्यक्त कर शाब्दिक रूप पादटिप्पणी में दिया गया है।
