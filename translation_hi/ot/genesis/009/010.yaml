  text: וְ/אֵ֨ת כָּל נֶ֤פֶשׁ הַֽ/חַיָּה֙ אֲשֶׁ֣ר אִתְּ/כֶ֔ם בָּ/ע֧וֹף בַּ/בְּהֵמָ֛ה וּֽ/בְ/כָל חַיַּ֥ת הָ/אָ֖רֶץ אִתְּ/כֶ֑ם מִ/כֹּל֙ יֹצְאֵ֣י הַ/תֵּבָ֔ה לְ/כֹ֖ל חַיַּ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/010.yaml
  text: 'and with every living creature that is with you: the birds[a], the livestock, and every beast of the earth with you, from all that came out of the ark[d][c][b], every beast of the earth.'
translation:
  language: hi
  text: और तुम्हारे साथ के प्रत्येक जीवित प्राणी के साथ भी—पक्षियों, पालतू पशुओं और पृथ्वी के प्रत्येक जंगली पशु के साथ जो तुम्हारे साथ हैं—जहाज़ से बाहर निकले उन सभी के साथ, पृथ्वी के प्रत्येक जंगली पशु के साथ भी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस वाक्य का अंतिम भाग इब्रानी में कठिन है। अधिक शब्दशः: “जहाज़ से बाहर निकले उन सभी में से, पृथ्वी के प्रत्येक जंगली पशु के लिए।”'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ הַחַיָּה
  choice: हर जीवित प्राणी
  rationale: यह पदबंध इस प्रसंग में व्यापक रूप से प्राणी-जगत को दर्शाता है। ‘जीवित प्राणी’ स्वाभाविक है और ‘जीवित प्राण/आत्मा’ की अपेक्षा आशय को अधिक स्पष्ट रखता है।
- source_word: עוֹף
  choice: पक्षी
  rationale: यह शब्द उड़नेवाले जीवों को व्यापक रूप से सूचित कर सकता है, पर इस वर्ग-सूची में ‘पक्षी’ सहज और पर्याप्त रूप से सटीक है।
- source_word: בְּהֵמָה
  choice: पालतू पशु
  rationale: यहाँ यह जंगली पशुओं से अलग घरेलू पशुओं की श्रेणी को दर्शाता है; ‘पालतू पशु’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: חַיַּת הָאָרֶץ
  choice: पृथ्वी के जंगली पशु
  rationale: यह पदबंध पक्षियों और पालतू पशुओं से भिन्न जंगली स्थल-पशुओं की श्रेणी बताता है।
- source_word: מִכֹּל יֹצְאֵי הַתֵּבָה
  choice: अर्थात उन सब से जो जहाज़ से बाहर निकले थे
  rationale: מִן को यहाँ उन प्राणियों की पहचान स्पष्ट करनेवाला माना गया है। ‘अर्थात’ हिन्दी में इस संक्षिप्त इब्रानी संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְכֹל חַיַּת הָאָרֶץ
  choice: पृथ्वी के हर जंगली पशु से
  rationale: अंतिम पदबंध को पुनरारंभकारी/व्याख्यात्मक रूप में रखा गया है, किंतु कठिन इब्रानी वाक्य-विन्यास को पादटिप्पणी में सुरक्षित किया गया है।
theological_decisions:
- issue: वाचा में सम्मिलित प्राणियों का दायरा और अंतिम पदबंध का वाक्य-विन्यास
  choice: वचन में नूह के साथ के सभी जीवित प्राणी सम्मिलित हैं—पक्षी, पालतू पशु और जंगली पशु; अंतिम पदबंध को पुनरुक्तिपरक/व्याख्यात्मक माना गया है।
  alternative: अंतिम शब्दों का अधिक रूपगत अनुवाद ‘पृथ्वी के हर जंगली पशु के लिए’ हो सकता है।
  rationale: इब्रानी रचना संक्षिप्त और पुनरुक्तिपूर्ण है। मुख्य पाठ दायरे को स्पष्ट रखता है, जबकि पादटिप्पणी कठिन वाक्य-विन्यास और वैकल्पिक रूपगत पठन को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘जहाज़’ को תֵּבָה के लिए पाठक-सुलभ पारंपरिक शब्द के रूप में रखा गया है; ‘पालतू पशु’ और ‘जंगली पशु’ से इब्रानी श्रेणीगत भेद स्पष्ट किया गया है।
