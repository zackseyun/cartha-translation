base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/023.yaml
  text: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
translation:
  language: hi
  text: तब शेम और येपेत ने वह वस्त्र[a] लिया और उसे अपने-अपने कंधों पर रखा। फिर वे पीछे की ओर चले और उन्होंने अपने पिता का नंगापन ढक दिया। उनके चेहरे पीछे की ओर थे, इसलिए उन्होंने अपने पिता का नंगापन नहीं देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाहरी वस्त्र।’ इब्रानी शब्द ऐसे वस्त्र के लिए है जिसे यहाँ नूह को ढकने के लिए इस्तेमाल किया गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लिया
  rationale: לקח का सामान्य कथात्मक अर्थ ‘लेना’ है; एकवचन क्रिया संयुक्त कर्ता से पहले आई है, पर हिंदी में दोनों नामों के साथ स्वाभाविक बहुवचन वाक्य-विन्यास रखा गया है।
- source_word: שֵׁם וָיֶפֶת
  choice: शेम और येपेत
  rationale: इब्रानी नामों का देवनागरी लिप्यंतरण मूल उच्चारण के निकट रखा गया है।
- source_word: הַשִּׂמְלָה
  choice: वह ओढ़ना
  rationale: שׂמלה बाहरी वस्त्र या चादरनुमा ओढ़ने के कपड़े को दर्शाता है। ‘ओढ़ना’ उस ठोस वस्तु और ढकने के प्रसंग को सहज हिंदी में व्यक्त करता है, बिना उसका आकार अनावश्यक रूप से निश्चित किए।
- source_word: וַיָּשִׂימוּ עַל שְׁכֶם שְׁנֵיהֶם
  choice: उसे अपने दोनों कंधों पर रख लिया
  rationale: शाब्दिक संरचना ‘उन दोनों के कंधे पर रखा’ है। हिंदी बहुवचन दोनों के संयुक्त रूप से वस्त्र उठाने का भाव स्वाभाविक ढंग से देता है।
- source_word: אֲחֹרַנִּית
  choice: पीछे की ओर
  rationale: यह क्रियाविशेषण उलटी दिशा में चलने और चेहरों की विपरीत दिशा—दोनों को बताता है; पुनरावृत्ति का भाव सुरक्षित रखा गया है।
- source_word: וַיְכַסּוּ
  choice: ढक दिया
  rationale: כסה का प्रसंगानुकूल सीधा अर्थ ‘ढकना’ है।
- source_word: עֶרְוַת אֲבִיהֶם
  choice: अपने पिता का नंगापन
  rationale: यह इब्रानी पदबंध का सीधा और गरिमापूर्ण अनुवाद है तथा शरीर के खुले होने और उससे जुड़ी लज्जा—दोनों भावों को बनाए रखता है।
- source_word: וּפְנֵיהֶם אֲחֹרַנִּית
  choice: उनके चेहरे पीछे की ओर थे
  rationale: मूल में यह क्रियारहित उपवाक्य है। हिंदी में ‘थे’ जोड़कर उसकी दिशा को स्पष्ट और सहज बनाया गया है, बिना ‘मोड़ रखे थे’ जैसी अतिरिक्त क्रिया जोड़े।
- source_word: לֹא רָאוּ
  choice: नहीं देखा
  rationale: ראה का साधारण निषेधात्मक अर्थ रखा गया है; ‘दृष्टि नहीं डाली’ जैसे अधिक व्याख्यात्मक भाव से बचा गया है।
theological_decisions:
- issue: ‘अपने पिता का नंगापन’ का आशय
  choice: नूह के खुले शरीर का प्रत्यक्ष उल्लेख, जिसे शेम और येपेत आदरपूर्वक ढकते हैं
  alternative: बाद के लैव्यव्यवस्था-संबंधी प्रयोग के आधार पर कोई विशिष्ट यौनार्थक व्यंजना
  rationale: इस पद की ठोस क्रियाएँ—ओढ़ना लेना, पीछे की ओर चलना, शरीर ढकना और न देखना—प्रत्यक्ष शारीरिक अनावृत्ति पर केंद्रित हैं। फिर भी मूल पदबंध को ज्यों का त्यों अर्थपूर्ण रखा गया है और किसी अधिक विशिष्ट व्याख्या को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘नंगापन’ मूल की स्पष्टता और लज्जा-संबंधी भाव को सुरक्षित रखता है; ‘ओढ़ना’ सामान्य पाठक के लिए सहज है और पादटिप्पणी में व्यापक शाब्दिक विकल्प दिया गया है।
