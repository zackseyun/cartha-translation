source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בָּר֥וּךְ יְהֹוָ֖ה אֱלֹ֣הֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/026.yaml
  text: And he said, “Blessed be the LORD, the God of Shem, and let Canaan be their servant.”
translation:
  language: hi
  text: और उसने कहा, “यहोवा, शेम का परमेश्वर, धन्य हो; और कनान उनका दास हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उनका” का अनुवाद “उसका” भी हो सकता है।
    reason: हिब्रू לָמוֹ सामान्यतः बहुवचन है, पर काव्य में कभी एकवचन अर्थ भी दे सकता है; संदर्भ दोनों व्याख्याओं की संभावना छोड़ता है।
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य हो
  rationale: यह आशीर्वाद या स्तुति की उद्घोषणा है; ‘धन्य हो’ हिब्रू की संक्षिप्तता और भाव दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; ‘यहोवा’ आधुनिक हिन्दी बाइबल-पाठकों के लिए परिचित रूप है और इसे सामान्य उपाधि में नहीं बदलता।
- source_word: עֶבֶד
  choice: दास
  rationale: यह शब्द अधीनस्थ सेवा से लेकर दासत्व तक का अर्थ दे सकता है; इस शाप-संदर्भ में ‘दास’ उसकी कठोरता को बनाए रखता है, जबकि ‘सेवक’ उसे अनावश्यक रूप से नरम कर सकता है।
- source_word: לָמוֹ
  choice: उनका
  rationale: यह काव्यात्मक सर्वनाम-प्रत्यय सामान्यतः बहुवचन ‘उनका/उनके लिए’ समझा जाता है, पर कभी एकवचन अर्थ में भी प्रयुक्त हो सकता है। हिन्दी ‘उनका’ बहुवचन और आदरसूचक एकवचन—दोनों की कुछ गुंजाइश बनाए रखता है।
theological_decisions:
- issue: לָמוֹ का वचन और संकेतित व्यक्ति/समूह
  choice: उनका दास
  alternative: उसका दास
  rationale: व्याकरणिक रूप बहुवचन अर्थ ‘उनका’ का समर्थन करता है, संभवतः शेम और उसके वंशजों की ओर संकेत करते हुए; फिर भी काव्यात्मक एकवचन की संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: आशीर्वाद का प्रत्यक्ष पात्र
  choice: शेम का परमेश्वर यहोवा धन्य हो
  alternative: शेम धन्य हो
  rationale: हिब्रू वाक्य सीधे यहोवा को ‘धन्य’ कहता है, शेम को नहीं; इसलिए स्तुति का केंद्र परमेश्वर ही रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के लिए सहज रखी गई है। ‘दास’ मूल की सामाजिक कठोरता को स्पष्ट करता है; वाक्य-विन्यास हिब्रू काव्यात्मक घोषणा की समानांतरता बनाए रखता है।
