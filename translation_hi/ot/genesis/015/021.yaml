  text: and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: hi
  text: और एमोरी, और कनानी, और गिर्गाशी, और यबूसी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: और
  rationale: וְ सूची को आगे बढ़ाता है और אֶת निश्चित कर्म का चिह्न है। हिन्दी में कर्म-चिह्न को प्रत्येक नाम से पहले अलग रूप में दिखाना स्वाभाविक नहीं है; बार-बार ‘और’ रखने से मूल सूची की संरचना बनी रहती है।
- source_word: הָאֱמֹרִי
  choice: एमोरी
  rationale: हिब्रू में यह जातिवाचक सामूहिक एकवचन है। हिन्दी बाइबलीय प्रयोग में ‘एमोरी’ समुदाय के सामूहिक नाम के रूप में स्वाभाविक है।
- source_word: הַכְּנַעֲנִי
  choice: कनानी
  rationale: जातिवाचक सामूहिक संज्ञा को हिन्दी में ‘कनानी’ समुदाय के नाम के रूप में रखा गया है।
- source_word: הַגִּרְגָּשִׁי
  choice: गिर्गाशी
  rationale: हिब्रू जातिनाम का निकट देवनागरी लिप्यंतरण, सामूहिक समुदाय को सूचित करता है।
- source_word: הַיְבוּסִי
  choice: यबूसी
  rationale: हिब्रू जातिनाम का प्रचलित हिन्दी रूप, यहाँ पूरे समुदाय के लिए प्रयुक्त है।
