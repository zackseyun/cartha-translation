source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤/י יֱהוִה֙ מַה תִּתֶּן לִ֔/י וְ/אָנֹכִ֖י הוֹלֵ֣ךְ עֲרִירִ֑י וּ/בֶן מֶ֣שֶׁק בֵּיתִ֔/י ה֖וּא דַּמֶּ֥שֶׂק אֱלִיעֶֽזֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/002.yaml
  text: But Abram said[a], “Lord Yahweh, what will you give me, since I am going childless, and the heir of my house is Eliezer of Damascus?”
translation:
  language: hi
  text: पर अब्राम ने कहा[a], “हे प्रभु यहोवा, तू मुझे क्या देगा? मैं तो निःसंतान ही जा रहा हूँ, और मेरे घर का वारिस दमिश्क का एलीएजेर है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ‘मेरे घर का बेन-मेशेक’ है, जो एक असामान्य पदबंध है। इसका अर्थ संभवतः ‘मेरे घर का प्रबंधक’ या ‘मेरे घर का स्वामी/वारिस’ है; इसका शाब्दिक अर्थ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, पर यहाँ अब्राम की बात पिछले प्रतिज्ञा-वचन के प्रत्युत्तर में चिंता प्रकट करती है; इसलिए ‘पर’ प्रसंगगत विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲדֹנָי יֱהוִה
  choice: हे प्रभु यहोवा
  rationale: אֲדֹנָי को संबोधन में ‘हे प्रभु’ और परमेश्वर के निजी नाम יֱהוִה को ‘यहोवा’ रखा गया है, जिससे दोनों पद अलग-अलग सुरक्षित रहते हैं।
- source_word: מַה תִּתֶּן לִי
  choice: तू मुझे क्या देगा?
  rationale: अपूर्ण क्रिया यहाँ भविष्य का स्वाभाविक अर्थ देती है। एकवचन संबोधन के अनुरूप ‘तू’ निकट और सीधा है।
- source_word: וְאָנֹכִי הוֹלֵךְ עֲרִירִי
  choice: मैं तो निःसंतान ही जा रहा हूँ
  rationale: הוֹלֵךְ के ‘जाने’ वाले रूपक और עֲרִירִי के संतानहीन होने के अर्थ को बनाए रखा गया है; ‘तो’ प्रश्न के कारणात्मक/विरोधात्मक भाव को स्वाभाविक बनाता है।
- source_word: בֶן מֶשֶׁק בֵּיתִי
  choice: मेरे घर का वारिस
  rationale: यह असामान्य और विवादित पदबंध है। अगले पद के उत्तराधिकार-संदर्भ में ‘वारिस’ सबसे स्पष्ट संभावित अर्थ देता है, जबकि शाब्दिकता और अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  choice: दमिश्क का एलीएज़ेर
  rationale: यह एलीएज़ेर की दमिश्क से उत्पत्ति या संबद्धता को व्यक्त करने वाला स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: अֲדֹנָי יֱהוִה में परमेश्वर के नाम का अनुवाद
  choice: हे प्रभु यहोवा
  alternative: हे प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי और निजी नाम יֱהוִה दोनों हैं। ‘प्रभु यहोवा’ दोनों को स्पष्ट रखता है और निजी नाम को सामान्य उपाधि में विलीन नहीं करता।
- issue: בֶן מֶשֶׁק בֵּיתִי का उत्तराधिकार-संबंधी अर्थ
  choice: मेरे घर का वारिस
  alternative: मेरे घर का प्रबंधक / मेरे घर की संपत्ति का पुत्र
  rationale: मूल अभिव्यक्ति दुर्लभ और अनिश्चित है। संदर्भ वारिस की समस्या की ओर संकेत करता है, पर अन्य अर्थ संभव होने के कारण उन्हें पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘निःसंतान ही जा रहा हूँ’ मूल रूपक को बनाए रखता है; कठिन पदबंध को मुख्य पाठ में स्पष्ट किया गया है और उसकी वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित है।
