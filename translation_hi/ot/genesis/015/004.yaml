source:
  edition: WLC
  text: וְ/הִנֵּ֨ה דְבַר יְהוָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר לֹ֥א יִֽירָשְׁ/ךָ֖ זֶ֑ה כִּי אִם֙ אֲשֶׁ֣ר יֵצֵ֣א מִ/מֵּעֶ֔י/ךָ ה֖וּא יִֽירָשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/004.yaml
  text: And behold, the word of the LORD came to him, saying, “This man will not be your heir; rather, one who comes from your own body will be your heir.”
translation:
  language: hi
  text: और देखो, यहोवा का वचन उसके पास आया और कहा, “यह व्यक्ति तुम्हारा वारिस नहीं होगा, बल्कि जो तुम्हारे अपने शरीर से उत्पन्न होगा, वही तुम्हारा वारिस होगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: हिब्रू कथन में आए आकस्मिक और ध्यानाकर्षक मोड़ को स्पष्ट रूप से बनाए रखता है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: दिव्य नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से और דְבַר को ‘वचन’ से व्यक्त किया गया है।
- source_word: זֶה
  choice: यह मनुष्य
  rationale: संदर्भ में संकेतवाचक शब्द अब्राम द्वारा बताए गए व्यक्ति की ओर संकेत करता है; ‘मनुष्य’ जोड़ने से हिन्दी में आशय स्वाभाविक और स्पष्ट होता है।
- source_word: יִירָשְׁךָ
  choice: तुम्हारा वारिस होगा
  rationale: यहाँ क्रिया संपत्ति पाने वाले उत्तराधिकारी के अर्थ में है; हिन्दी में संज्ञात्मक अभिव्यक्ति अधिक स्वाभाविक है।
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: जो तुम्हारे अपने शरीर से उत्पन्न होगा
  rationale: शाब्दिक ‘जो तुम्हारी अंतड़ियों/भीतर से निकलेगा’ के जैविक वंशज वाले मुहावरेदार अर्थ को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הוּא
  choice: वही
  rationale: हिब्रू के स्पष्ट बलाघात को बनाए रखता है कि वही व्यक्ति वारिस होगा।
theological_decisions:
- issue: दिव्य नाम יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; ‘यहोवा’ उसे उपाधि में बदले बिना हिन्दी पाठक के लिए पहचानने योग्य रूप में रखता है।
- issue: वंशज की पहचान की सीमा
  choice: जो तुम्हारे अपने शरीर से उत्पन्न होगा
  alternative: तुम्हारा पुत्र
  rationale: मूल पाठ जैविक वंशज कहता है, पर इस पद में सीधे ‘पुत्र’ शब्द नहीं है; इसलिए उससे अधिक विशिष्ट कथन नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली। ‘और देखो’ मूल के ध्यानाकर्षक मोड़ को बनाए रखता है; ‘अपने शरीर से उत्पन्न’ सामान्य पाठक के लिए समझने योग्य रहते हुए प्राचीन हिब्रू मुहावरे का आशय देता है।
