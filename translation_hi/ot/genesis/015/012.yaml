base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/012.yaml
  text: As the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
translation:
  language: hi
  text: जब सूर्य डूबने लगा, तब अब्राम पर गहरी नींद[a] छा गई। और देखो, एक बड़ा, अंधकारमय आतंक[b] उस पर छाने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तंद्रा’। इब्रानी शब्द असाधारण रूप से गहरी और सम्भवतः परमेश्वर द्वारा लाई गई नींद को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अंधकार का बड़ा आतंक’ अथवा ‘बड़ा घोर आतंक’। इब्रानी में आतंक और अंधकार के विचार एक सघन, सजीव वाक्यांश में जुड़े हुए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ לָבוֹא
  choice: जब सूर्य डूबने लगा, तब
  rationale: यह हिन्दी में दृश्य के समय-संबंध को स्वाभाविक रूप से व्यक्त करता है और सूर्यास्त की आरम्भ होती प्रक्रिया को बनाए रखता है।
- source_word: תַרְדֵּמָה
  choice: गहरी नींद
  rationale: इस शब्द का सीधा अर्थ असाधारण रूप से गहरी नींद है; दर्शन-संबंधी प्रसंग होने पर भी मुख्य पाठ में ‘समाधि’ या ‘मूर्छा’ कहना अधिक व्याख्यात्मक होता।
- source_word: נָפְלָה עַל אַבְרָם
  choice: अब्राम पर … छा गई
  rationale: हिन्दी में नींद के किसी पर आने के लिए ‘छा गई’ स्वाभाविक है और मूल के किसी अनुभव के ऊपर आ पड़ने का भाव रखता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह आकस्मिक और सजीव ध्यानाकर्षण को बनाए रखता है।
- source_word: אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: एक बड़ा, अंधकारमय आतंक
  rationale: यह मूल की सघन और कुछ हद तक अस्पष्ट अभिव्यक्ति में आतंक, अंधकार और तीव्रता—तीनों को अलग किए बिना रखता है।
- source_word: נֹפֶלֶת עָלָיו
  choice: उस पर छाने लगा
  rationale: वर्तमान कृदन्त के प्रगतिशील और सजीव पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַבְרָם
  choice: अब्राम
  rationale: नाम का प्रचलित हिन्दी लिप्यंतरण।
theological_decisions:
- issue: प्रकाशन-संबंधी प्रसंग में תַרְדֵּמָה का स्वरूप
  choice: गहरी नींद
  alternative: दिव्य तंद्रा
  rationale: मूल शब्द मुख्यतः गहरी नींद बताता है। ‘दिव्य तंद्रा’ प्रसंगानुकूल हो सकती है, पर मुख्य पाठ में वह कारण और स्वरूप को आवश्यकता से अधिक निश्चित कर देगी।
- issue: אֵימָה חֲשֵׁכָה גְדֹלָה में आतंक और अंधकार का संबंध
  choice: एक बड़ा, अंधकारमय आतंक
  alternative: अंधकार का बड़ा आतंक
  rationale: मूल इब्रानी दोनों विचारों को एक सघन वाक्यांश में रखती है और उनका सटीक संबंध स्पष्ट नहीं करती। चुना हुआ रूप उसी तनाव को बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी अपनाई गई है। ‘और देखो’ मूल के नाटकीय ध्यानाकर्षण को बनाए रखता है। दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
