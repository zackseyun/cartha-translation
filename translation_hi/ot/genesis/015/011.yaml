lexical_decisions:
- source_word: וַיֵּרֶד
  choice: उतर आए
  rationale: यָרַד नीचे आने या उतरने की गति बताता है; प्रसंग में बहुवचन सामूहिक अर्थ के अनुसार ‘उतर आए’ स्वाभाविक है।
- source_word: הָעַיִט
  choice: शिकारी पक्षी
  rationale: עַיִט एकवचन रूप में होकर भी पक्षियों के समूह का सामूहिक अर्थ दे सकता है। ‘शिकारी पक्षी’ मूल शब्द की व्यापकता बनाए रखता है; ‘गिद्ध’ अनावश्यक रूप से अधिक विशिष्ट होता।
- source_word: הַפְּגָרִים
  choice: लोथों
  rationale: פֶּגֶר मरे हुए शरीर या पशु की लोथ को दर्शाता है। यहाँ बलि के लिए मारे गए पशुओं के संदर्भ में ‘लोथ’ सटीक और संक्षिप्त है।
- source_word: וַיַּשֵּׁב אֹתָם
  choice: उन्हें भगा दिया
  rationale: שׁוּב का हिफ़ील रूप यहाँ उन्हें पीछे हटाने या दूर करने का अर्थ देता है; ‘भगा दिया’ आधुनिक हिन्दी में इस सक्रिय क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אַבְרָם
  choice: अब्राम
  rationale: इस कथा-बिंदु पर नाम अभी अब्राम ही है; मानक हिन्दी लिप्यंतरण रखा गया है।
