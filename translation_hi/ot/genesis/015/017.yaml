  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ בָּ֔אָה וַ/עֲלָטָ֖ה הָיָ֑ה וְ/הִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְ/לַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַ/גְּזָרִ֥ים הָ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/017.yaml
  text: And when the sun had gone down and it was dark[a], behold[b], a smoking firepot and a flaming torch passed between these pieces.
translation:
  language: hi
  text: जब सूर्य डूब चुका था और अँधेरा हो गया था, तब देखो, धुआँ छोड़ती हुई एक भट्ठी[a] और धधकती हुई एक मशाल उन टुकड़ों[b] के बीच से होकर गुज़रीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धुआँ छोड़ता हुआ तंदूर’ अथवा ‘धुआँ छोड़ता हुआ अग्निपात्र।’ इब्रानी शब्द एक प्रकार के भट्ठीनुमा ओवन या अग्निपात्र को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: ये उन पशुओं के काटे हुए भाग हैं जिन्हें अब्राम ने पहले तैयार किया था (देखें उत्पत्ति 15:10)।
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ בָּאָה
  choice: जब सूर्य डूब चुका
  rationale: सूर्य के साथ בוא सूर्यास्त का मुहावरा है। ‘डूब चुका’ पूर्वघटित अवस्था और ठोस दृश्य, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַעֲלָטָה הָיָה
  choice: और अँधेरा हो गया
  rationale: עֲלָטָה अँधेरे या गहन धुँधलेपन को सूचित करता है। ‘अँधेरा हो गया’ बिना अनावश्यक तीव्रता जोड़े घटनाक्रम को सहज हिन्दी में रखता है।
- source_word: וְהִנֵּה
  choice: तब देखो
  rationale: הִנֵּה दृश्य की ओर तत्काल और सजीव ध्यान खींचता है। ‘देखो’ इसकी साहित्यिक और गंभीर प्रस्तुति बनाए रखता है।
- source_word: תַנּוּר עָשָׁן
  choice: धुआँ छोड़ती हुई एक भट्ठी
  rationale: תַנּוּר आग रखने या जलाने का पात्र अथवा भट्ठी/तंदूर है और עָשָׁן धुएँ का बोध देता है। ‘भट्ठी’ दृश्य को स्पष्ट रखती है, जबकि पादटिप्पणी संभावित विकल्प बताती है।
- source_word: לַפִּיד אֵשׁ
  choice: धधकती हुई एक मशाल
  rationale: לַפִּיד मशाल है और אֵשׁ उसके अग्निमय स्वरूप पर बल देता है। ‘धधकती हुई मशाल’ इस चित्र को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: אֲשֶׁר עָבַר
  choice: से होकर गुज़रीं
  rationale: क्रिया इन दोनों अग्निमय वस्तुओं के टुकड़ों के बीच से जाने का वर्णन करती है। हिन्दी में संयुक्त कर्ता के साथ बहुवचन क्रिया स्वाभाविक है; इससे वस्तुओं की पहचान के विषय में कोई अतिरिक्त व्याख्या नहीं जोड़ी गई।
- source_word: בֵּין הַגְּזָרִים הָאֵלֶּה
  choice: उन टुकड़ों के बीच से
  rationale: גְּזָרִים पिछले प्रसंग में काटकर रखे गए पशुओं के भाग हैं। हिन्दी कथन में ‘उन टुकड़ों’ से पूर्ववर्ती संदर्भ स्वाभाविक रूप से जुड़ता है।
theological_decisions:
- issue: वाचा बाँधने के दृश्य में अग्निमय वस्तुओं की प्रकृति
  choice: मुख्य पाठ में दृश्य का वर्णन किया गया है, पर भट्ठी और मशाल को स्पष्ट रूप से स्वयं परमेश्वर नहीं कहा गया।
  alternative: इन्हें उन टुकड़ों के बीच से गुज़रती हुई यहोवा की प्रत्यक्ष उपस्थिति के रूप में स्पष्ट करना।
  rationale: व्यापक प्रसंग इसे परमेश्वर की वाचा-संबंधी उपस्थिति के रूप में समझने का मजबूत आधार देता है, पर इस पद का इब्रानी पाठ केवल दिखाई देने वाले चिह्नों का नाम लेता है। वर्णनात्मक अनुवाद मूल की धर्मवैचारिक गहनता और तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘तब देखो’ मूल की सजीव प्रस्तुति बनाए रखता है; ‘धुआँ छोड़ती हुई’ और ‘धधकती हुई’ दृश्य को स्पष्ट करते हैं, जबकि पादटिप्पणियाँ प्रमुख शाब्दिक विकल्प और पूर्वप्रसंग बताती हैं।
