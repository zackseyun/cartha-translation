  text: וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהוִ֔ה בַּ/מָּ֥ה אֵדַ֖ע כִּ֥י אִֽירָשֶֽׁ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/008.yaml
  text: And he said[a], “Lord Yahweh, how will I know that I will possess it?”
translation:
  language: hi
  text: तब उसने कहा[a], “हे प्रभु याहवे, मैं कैसे जानूँ कि मैं उस पर अधिकार करूँगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसे विरासत में पाऊँगा।”
    reason: ירשׁ का अर्थ ‘अधिकार करना/पाना’ के साथ ‘विरासत में पाना’ भी हो सकता है।
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: तब उसने कहा
  rationale: हिब्रू कथात्मक wayyiqtol पिछले कथन के बाद कथा को आगे बढ़ाता है; ‘तब उसने कहा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֲדֹנָי יֱהוִה
  choice: हे प्रभु यहोवा
  rationale: सम्बोधन में אֲדֹנָי को ‘प्रभु’ और परमेश्वर के विशिष्ट नाम יהוה को ‘यहोवा’ के रूप में रखा गया है।
- source_word: בַּמָּה אֵדַע
  choice: मैं कैसे जानूँ
  rationale: शाब्दिक अर्थ ‘किसके द्वारा मैं जानूँ?’ है; यहाँ अब्राम किसी प्रमाण या आश्वासन का साधन पूछता है, जिसे हिन्दी में ‘मैं कैसे जानूँ’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात का परिचय देता है जिसे अब्राम जानना चाहता है।
- source_word: אִירָשֶׁנָּה
  choice: मैं इस पर अधिकार करूँगा
  rationale: ירשׁ भूमि को विरासत में पाने, अपने अधिकार में लेने या उस पर अधिकार रखने का अर्थ दे सकता है। निकटवर्ती सन्दर्भ की ‘भूमि’ के लिए ‘इस पर अधिकार करना’ वास्तविक प्राप्ति को स्पष्ट रखते हुए इस अर्थ-क्षेत्र को व्यक्त करता है।
theological_decisions:
- issue: संयुक्त सम्बोधन אֲדֹנָי יֱהוִה में परमेश्वर के नाम का अनुवाद
  choice: हे प्रभु यहोवा
  alternative: हे प्रभु परमेश्वर
  rationale: मूल पाठ में सामान्य उपाधि אֲדֹנָי के साथ विशिष्ट नाम יהוה है; इसलिए दोनों को अलग-अलग दर्शाया गया है, बिना नाम को केवल उपाधि में बदलने के।
- issue: ירשׁ में विरासत और अधिकार-प्राप्ति का अर्थ
  choice: इस पर अधिकार करूँगा
  alternative: इसे विरासत में पाऊँगा
  rationale: सन्दर्भ प्रतिज्ञा की हुई भूमि के भावी वास्तविक अधिकार का है। मुख्य पाठ ‘अधिकार’ को व्यक्त करता है; ‘विरासत’ की वाचा-संबंधी छाया सम्भव है, पर यहाँ अर्थ को किसी एक धर्मवैज्ञानिक व्याख्या तक सीमित करना आवश्यक नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानपूर्ण और सरल कथात्मक शैली। ‘हे’ सम्बोधन को स्पष्ट करता है। भूमि स्त्रीलिंग होने पर भी ‘इस पर’ का प्रयोग हिन्दी में अधिक स्वाभाविक है और अधिकार के भाव को साफ रखता है।
