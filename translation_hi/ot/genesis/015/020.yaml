- source_word: וְאֶת
  choice: और … को
  rationale: וְ इस चलती हुई सूची में एक और समूह जोड़ता है, जबकि אֵת कर्म को चिह्नित करता है। हिंदी में इसे आरंभिक “और” तथा सूची के अंत में “को” से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: הַחִתִּי
  choice: हित्ती लोग
  rationale: इब्रानी में रूप एकवचन है, पर यहाँ जातिवाचक सामूहिक अर्थ रखता है; “हित्ती लोग” आधुनिक हिंदी में उस जनसमूह को स्पष्ट करता है।
- source_word: הַפְּרִזִּי
  choice: परिज्जी लोग
  rationale: यह भी रूप की दृष्टि से एकवचन, किंतु अर्थ में सामूहिक जातिनाम है। प्रचलित हिंदी बाइबलीय नाम “परिज्जी” रखा गया है।
- source_word: הָרְפָאִים
  choice: रपाई लोग
  rationale: भूमि में रहने वाले जनसमूहों की इस सूची में यह जातिनाम है। लिप्यंतरण नाम के रूप को बनाए रखता है और “विशालकाय लोग” जैसी व्याख्या को मुख्य पाठ में नहीं डालता।
theological_decisions:
- issue: רְפָאִים को जातिनाम मानना या वर्णनात्मक रूप से विशालकाय लोग समझना
  choice: मुख्य पाठ में जातिनाम “रपाई लोग”
  alternative: “विशालकाय लोग”
  rationale: उत्पत्ति 15:19–21 में भूमि के जनसमूहों की सूची दी गई है, इसलिए यहाँ जातिनाम वाला अर्थ संदर्भ के अधिक अनुकूल है। दूसरे अर्थ की वास्तविक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
