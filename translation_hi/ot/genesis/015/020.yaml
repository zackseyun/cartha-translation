  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। जातिनामों को सामूहिक अर्थ स्पष्ट करने के लिए “लोगों” के साथ रखा गया है; तीनों नाम एक ही सूची में होने के कारण “लोगों” केवल अंत में लगाया गया है।
