base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/005.yaml
  text: Then he brought him outside and said[a], “Please look toward the heavens and count the stars, if you are able to count them.” Then he said to him, “So shall your offspring be.”
translation:
  language: hi
  text: फिर वह उसे बाहर ले गया और कहा, “कृपया आकाश की ओर देख और तारों को गिन—यदि तू उन्हें गिन सके।” फिर उसने उससे कहा, “तेरी संतान[a] ऐसी ही होगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरा बीज”; इब्रानी शब्द रूप में एकवचन है, पर सामूहिक अर्थ में पूरी संतति को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא אֹתוֹ הַחוּצָה
  choice: वह उसे बाहर ले गया
  rationale: हिफ़ील रूप का प्रेरणार्थक भाव और बाहर की ओर गति, दोनों स्वाभाविक आधुनिक हिन्दी में सुरक्षित रहते हैं।
- source_word: הַבֶּט נָא הַשָּׁמַיְמָה
  choice: कृपया आकाश की ओर देख
  rationale: הַבֶּט की आज्ञा, נָא की विनम्र अथवा आग्रहपूर्ण छाया, और दिशासूचक रूप का भाव स्पष्ट तथा सहज हिन्दी में व्यक्त होता है।
- source_word: וּסְפֹר הַכּוֹכָבִים
  choice: और तारों को गिन
  rationale: यह सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: אִם תּוּכַל לִסְפֹּר אֹתָם
  choice: यदि तू उन्हें गिन सके
  rationale: शर्त और गिन पाने की सामर्थ्य, दोनों को संक्षिप्त रूप से बनाए रखता है।
- source_word: כֹּה יִהְיֶה
  choice: ऐसा ही होगा
  rationale: तारों से की गई तुलनात्मक प्रतिज्ञा को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: זַרְעֶךָ
  choice: तेरा वंश
  rationale: यह आधुनिक हिन्दी में सामूहिक संतति के लिए स्वाभाविक है; पदटिप्पणी मूल इब्रानी शब्द के एकवचन रूप और सामूहिक अर्थ को स्पष्ट करती है।
theological_decisions:
- issue: प्रतिज्ञा के प्रसंग में זַרְעֶךָ का एकवचन रूप और सामूहिक अर्थ
  choice: तेरा वंश
  alternative: तेरा बीज; तेरी संतान
  rationale: ‘वंश’ सामान्य पाठक के लिए स्वाभाविक सामूहिक अभिव्यक्ति है। फिर भी इब्रानी संज्ञा के रूपगत एकवचन और उससे जुड़ी संभावित धार्मिक प्रतिध्वनि को पदटिप्पणी में सुरक्षित रखा गया है, ताकि पाठ उसे समय से पहले केवल बहुवचन ‘वंशजों’ के अर्थ में सीमित न कर दे।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर और अब्राम के प्रत्यक्ष संवाद में पारंपरिक एकवचन ‘तू/तेरा’ रखा गया है। भाषा सरल, वर्तमान और गरिमापूर्ण है।
