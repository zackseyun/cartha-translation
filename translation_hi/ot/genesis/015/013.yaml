id: GEN.15.13
reference: Genesis 15:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/אַבְרָ֗ם יָדֹ֨עַ תֵּדַ֜ע כִּי גֵ֣ר יִהְיֶ֣ה זַרְעֲ/ךָ֗ בְּ/אֶ֨רֶץ֙ לֹ֣א לָ/הֶ֔ם וַ/עֲבָד֖וּ/ם וְ/עִנּ֣וּ אֹתָ֑/ם אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/013.yaml
  text: Then he said to Abram[a], “Know for certain that your offspring will be sojourners in a land not theirs[c][b], and they will enslave them and afflict them four hundred years.”
translation:
  language: hi
  text: तब उसने अब्राम से कहा, “यह बात निश्चय जान ले कि तेरी संतान एक ऐसे देश में परदेशी होकर रहेगी जो उनका नहीं होगा; वहाँ के लोग उनसे दासों की तरह सेवा कराएँगे और उन्हें चार सौ वर्ष तक सताएँगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: यह बात निश्चय जान ले
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute कथन को बल देता है। यह हिंदी प्रयोग उस निश्चितता और आग्रह को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גֵר
  choice: परदेशी होकर रहेगी
  rationale: גֵר अपनी भूमि से बाहर गैर-मालिक निवासी के रूप में रहने वाले व्यक्ति को दर्शाता है। ‘परदेशी होकर रहना’ आधुनिक हिंदी में बोधगम्य है और अस्थायी अथवा आश्रित निवास का भाव बनाए रखता है।
- source_word: זַרְעֲךָ
  choice: तेरी संतान
  rationale: यह सामूहिक एकवचन है। हिंदी में ‘संतान’ सामूहिक अर्थ और वचन की लचक दोनों को स्वाभाविक रूप से बनाए रखती है।
- source_word: בְּאֶרֶץ לֹא לָהֶם
  choice: एक ऐसे देश में ... जो उनका नहीं होगा
  rationale: यह भूमि पर उनके स्वामित्व के अभाव को स्पष्ट करते हुए इब्रानी वाक्य के निकट रहता है।
- source_word: וַעֲבָדוּם
  choice: वहाँ के लोग उनसे दासों की तरह सेवा कराएँगे
  rationale: עבד का हिफ़ील रूप यहाँ दूसरों से सेवा कराने, संदर्भतः दासवत जबरन सेवा कराने, का अर्थ देता है। स्पष्ट संज्ञा-विषय हिंदी में दोहरे ‘वे/उन्हें’ की उलझन से बचाता है, यद्यपि स्रोत में कर्ता केवल क्रिया के बहुवचन रूप से निहित है।
- source_word: וְעִנּוּ אֹתָם
  choice: और उन्हें ... सताएँगे
  rationale: पिएल में ענה कठोर व्यवहार, पीड़ा देने या उत्पीड़न का बोध कराता है। ‘सताएँगे’ सामान्य आधुनिक हिंदी में व्यापक अर्थ को सुरक्षित रखता है।
- source_word: אַרְבַּע מֵאוֹת שָׁנָה
  choice: चार सौ वर्ष तक
  rationale: ‘तक’ अवधि-सूचक अर्थ को स्वाभाविक हिंदी में प्रकट करता है; इब्रानी में अवधि वाक्य के अंत में बिना पूर्वसर्ग दी गई है।
- source_word: וַיֹּאמֶר לְאַבְרָם
  choice: तब उसने अब्राम से कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ हिंदी में इस क्रम को सहजता से व्यक्त करता है।
theological_decisions:
- issue: וַעֲבָדוּם וְעִנּוּ אֹתָם में बहुवचन कर्ता का संदर्भ
  choice: विदेशी देश के लोग अब्राम की संतान से सेवा कराएँगे और उसे सताएँगे
  alternative: कर्ता को अनिर्दिष्ट ‘वे’ ही रहने देना; अथवा भाववाच्य में ‘उनसे दासों की तरह सेवा कराई जाएगी और उन्हें सताया जाएगा’ कहना
  rationale: इब्रानी में दोनों क्रियाओं के कर्ता बहुवचन और कर्म-प्रत्यय भी बहुवचन हैं। संदर्भ में कर्ता विदेशी देश के निवासी सबसे स्वाभाविक हैं, पर पाठ उनका नाम नहीं लेता। हिंदी में ‘वहाँ के लोग’ अर्थ स्पष्ट करता है, जबकि किसी विशिष्ट जाति या देश को अनावश्यक रूप से नहीं जोड़ता।
- issue: चार सौ वर्ष किस पूरे घटनाक्रम से संबद्ध हैं
  choice: अवधि को अंतिम संयुक्त कथन के साथ रखा गया है
  alternative: इसे केवल सताए जाने की अवधि या संपूर्ण परदेशी निवास, सेवा और उत्पीड़न की अवधि के रूप में स्पष्ट करना
  rationale: इब्रानी में समय-पद अंत में है और उसके दायरे में कुछ संरचनात्मक अस्पष्टता बनी रहती है। अनुवाद उसे उसी क्रम में रखता है और किसी एक कालक्रम-संबंध को व्याख्यात्मक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अब्राम से प्रत्यक्ष संबोधन में ‘तेरी’ मूल के एकवचन दूसरे पुरुष को स्पष्ट करता है। लंबे सर्वनाम-क्रम से होने वाली हिंदी अस्पष्टता दूर करने के लिए ‘वहाँ के लोग’ कहा गया है, पर उत्पीड़कों की कोई ऐसी विशिष्ट पहचान नहीं जोड़ी गई जो इस पद में नहीं है।
