source:
  edition: WLC
  text: וְ/ד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא שָׁלֵ֛ם עֲוֺ֥ן הָ/אֱמֹרִ֖י עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/016.yaml
  text: And in the fourth generation they will return here[b][a], for the iniquity of the Amorites is not yet complete.
translation:
  language: hi
  text: और चौथी पीढ़ी में वे यहाँ लौट आएँगे, क्योंकि अमोरी जाति[a] का अधर्म अभी तक अपनी पूरी सीमा तक नहीं पहुँचा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अमोरी का अधर्म”; मूल भाषा में एकवचन ‘अमोरी’ पूरी जाति के लिए सामूहिक रूप से प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: मूल भाषा में शाब्दिक रूप से “यहाँ तक”; इस प्रसंग में अर्थ है कि उस समय तक उनका अधर्म अपनी पूरी सीमा तक नहीं पहुँचा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֹור רְבִיעִי
  choice: और चौथी पीढ़ी में
  rationale: דּוֹר का अर्थ ‘पीढ़ी’ और רְבִיעִי का अर्थ ‘चौथी’ है। प्रसंग में वापसी का समय बताने के लिए हिंदी में ‘पीढ़ी में’ स्वाभाविक है।
- source_word: יָשׁוּבוּ הֵנָּה
  choice: वे यहाँ लौट आएँगे
  rationale: שׁוּב वापसी को और הֵנָּה वक्ता द्वारा बताए गए स्थान की ओर आने को व्यक्त करता है; ‘यहाँ लौट आएँगे’ दोनों भाव सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आगे दिए गए कारण का परिचय देता है।
- source_word: לֹא שָׁלֵם
  choice: पूरा नहीं हुआ है
  rationale: שָׁלֵם यहाँ पूर्ण होने या पूरी सीमा तक पहुँचने का भाव देता है; हिंदी में यह रूप नैतिक बुराई के अभी परिपक्व न होने को सहजता से व्यक्त करता है।
- source_word: עֲוֺן
  choice: अधर्म
  rationale: עָוֹן में अधर्म, दोष या दंड का अर्थ हो सकता है। यहाँ लोगों की नैतिक बुराई अभिप्रेत है, इसलिए ‘अधर्म’ उपयुक्त है।
- source_word: הָאֱמֹרִי
  choice: अमोरी जाति
  rationale: मूल रूप एकवचन है, पर वह सामूहिक रूप से पूरे जनसमूह का बोध कराता है। ‘अमोरी जाति’ इस सामूहिक एकवचन को सुरक्षित रखता है।
- source_word: עַד הֵנָּה
  choice: अभी तक
  rationale: शाब्दिक रूप ‘यहाँ तक’ है, किंतु इस प्रसंग में सीमा समय-संबंधी है; ‘अभी तक’ वर्तमान स्थिति और भावी पूर्णता के बीच का तनाव बनाए रखता है।
theological_decisions:
- issue: न्याय में विलंब और वंशजों की वापसी
  choice: वापसी के समय को अमोरी जाति के अधर्म के अभी पूरा न होने से जोड़ा गया है।
  alternative: इस विलंब को विशेष रूप से परमेश्वर के धैर्य या इस्राएल के मिस्र में निर्माण की विस्तृत शिक्षा के रूप में समझाना।
  rationale: पद केवल इतना स्पष्ट करता है कि अमोरियों का अधर्म अभी पूरा नहीं हुआ है; अनुवाद इससे आगे कोई धर्मवैज्ञानिक व्यवस्था आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लौट आएँगे’ गंतव्य की ओर वापसी का स्वाभाविक हिंदी रूप है, जबकि ‘अभी तक पूरा नहीं हुआ’ मूल की समयगत अस्पष्टता और नैतिक तनाव को बिना अतिरिक्त सिद्धांत जोड़े सुरक्षित रखता है।
