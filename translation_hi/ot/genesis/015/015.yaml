  text: וְ/אַתָּ֛ה תָּב֥וֹא אֶל אֲבֹתֶ֖י/ךָ בְּ/שָׁל֑וֹם תִּקָּבֵ֖ר בְּ/שֵׂיבָ֥ה טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/015.yaml
  text: As for you[a], you will go to your fathers in peace; you will be buried at a good old age.
translation:
  language: hi
  text: जहाँ तक तेरी बात है[a], तू शान्ति से अपने पुरखों के पास जाएगा; तुझे अच्छी-भली वृद्धावस्था में दफ़नाया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘अपने पितरों के पास’। यह इब्रानी मुहावरा मरने और पिछली पीढ़ियों में जा मिलने को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: परन्तु तू
  rationale: संयोजक के साथ स्वतंत्र सर्वनाम अब्राम के वंशजों से स्वयं अब्राम की ओर विषयगत और हल्का विरोधसूचक परिवर्तन दिखाता है।
- source_word: תָּב֥וֹא
  choice: जाएगा
  rationale: ‘अपने पुरखों के पास’ के साथ यह मृत्यु का मुहावरा है; हिन्दी में इस प्रसंग में ‘जाना’ स्वाभाविक है।
- source_word: אֶל אֲבֹתֶיךָ
  choice: अपने पुरखों के पास
  rationale: यह इब्रानी ‘अपने पितरों/पूर्वजों के पास’ का पारिवारिक मुहावरा है। ‘पुरखों’ से पूर्व पीढ़ियों का अर्थ स्वाभाविक रूप से व्यक्त होता है और मृत्यु-संबंधी मुहावरा सुरक्षित रहता है।
- source_word: בְּשָׁלוֹם
  choice: शान्ति से
  rationale: שָׁלוֹם में शान्ति, कुशल और संपूर्ण कल्याण का भाव है; ‘शान्ति से’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: תִּקָּבֵר
  choice: दफ़नाया जाएगा
  rationale: קבר के निफ़अल रूप का सीधा कर्मवाच्य अर्थ है; यह आधुनिक हिन्दी में सामान्य अन्त्येष्टि-संबंधी अभिव्यक्ति है।
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: अच्छी वृद्धावस्था में
  rationale: यह पदबंध अनुकूल अर्थ वाली उन्नत आयु को दर्शाता है; चयन मूल के ‘अच्छी’ विशेषण और वृद्धावस्था दोनों को बनाए रखता है।
theological_decisions:
- issue: ‘अपने पुरखों के पास जाएगा’ का अर्थ
  choice: अब्राम की मृत्यु और पिछली पीढ़ियों में जा मिलने का मुहावरा, परलोक की दशा का विस्तृत निर्धारण किए बिना
  alternative: पूर्वजों के साथ वास्तविक दफ़न होना, अथवा मृत्यु के बाद पूर्वजों के साथ सचेत संगति का अधिक स्पष्ट दावा
  rationale: यह एक प्रचलित मृत्यु-सूचक अभिव्यक्ति है। अब्राम को अपने निकट पूर्वजों के साथ दफ़नाया नहीं जाना था, इसलिए अर्थ केवल साझा कब्रस्थान तक सीमित नहीं है; फिर भी पद परलोक की विस्तृत अवस्था को स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर द्वारा अब्राम को सीधे संबोधन के कारण ‘तू’ रखा गया है। ‘पुरखे’ बोलचाल और साहित्यिक गरिमा के बीच संतुलन देता है; पद का मृत्यु-संबंधी मुहावरा बिना अतिरिक्त परलोक-सिद्धान्त जोड़े सुरक्षित रखा गया है।
