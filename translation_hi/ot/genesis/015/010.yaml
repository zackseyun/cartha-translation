  to: तब वह उन सबको उसके पास ले आया, उन्हें बीच से दो टुकड़ों में काटा, और हर एक टुकड़े को उसके दूसरे टुकड़े के सामने रख दिया; पर पक्षियों को उसने दो टुकड़ों में नहीं काटा।
