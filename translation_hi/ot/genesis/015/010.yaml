  text: וַ/יִּֽקַּֽח ל֣/וֹ אֶת כָּל אֵ֗לֶּה וַ/יְבַתֵּ֤ר אֹתָ/ם֙ בַּ/תָּ֔וֶךְ וַ/יִּתֵּ֥ן אִישׁ בִּתְר֖/וֹ לִ/קְרַ֣את רֵעֵ֑/הוּ וְ/אֶת הַ/צִפֹּ֖ר לֹ֥א בָתָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/010.yaml
  text: So he brought all these to him[a], cut them in two, and placed each half opposite the other[c][b]; but he did not cut the birds in two.
translation:
  language: hi
  text: तब वह उन सबको उसके पास ले आया, उन्हें बीच से दो टुकड़ों में काटा, और हर एक टुकड़े को उसके दूसरे टुकड़े के सामने रख दिया; पर पक्षियों को उसने दो टुकड़ों में नहीं काटा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח לוֹ אֶת כָּל אֵלֶּה
  choice: तब वह उन सबको उसके पास ले आया
  rationale: वैयक्तिक सर्वनाम לוֹ को निकटवर्ती आज्ञा (पद 9, ‘मेरे पास ला’) के संदर्भ में परमेश्वर की ओर संकेत मानकर ‘उसके पास’ रखा गया है। וַיִּקַּח का मूल अर्थ ‘लिया’ है, पर इस संदर्भ में आज्ञा का पालन करते हुए पशुओं को लाने का भाव स्वाभाविक है।
- source_word: וַיְבַתֵּר אֹתָם בַּתָּוֶךְ
  choice: उन्हें बीच से दो भागों में काटा
  rationale: בתר पशुओं को काटकर विभाजित करने को दर्शाता है और בַּתָּוֶךְ ‘बीच में/बीच से’ को स्पष्ट करता है। ‘दो भागों में’ परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ
  choice: और हर भाग को उसके दूसरे भाग के सामने रख दिया
  rationale: אִישׁ ... רֵעֵהוּ यहाँ वितरणसूचक मुहावरा है—प्रत्येक कटा हुआ भाग अपने संगत दूसरे भाग के सामने। यह अनुवाद स्थानिक व्यवस्था को स्पष्ट रखता है और ‘जोड़ी’ जैसी अतिरिक्त धारणा नहीं जोड़ता।
- source_word: וְאֶת הַצִפֹּר לֹא בָתָר
  choice: पर पक्षियों को उसने दो भागों में नहीं काटा
  rationale: एकवचन सामूहिक הַצִפֹּר पिछले पद में उल्लिखित दोनों पक्षियों की ओर संकेत करता है, इसलिए हिन्दी में बहुवचन स्वाभाविक है। पहले वाले कार्य को दोहराकर निषेध स्पष्ट किया गया है।
theological_decisions:
- issue: वाचा बाँधने की रीति से जुड़ी काटने की भाषा
  choice: पशुओं को दो भागों में काटकर आमने-सामने रखने की ठोस क्रिया को ही अनूदित किया गया है।
  alternative: पद में ही वाचा-विधि का व्याख्यात्मक उल्लेख जोड़ना।
  rationale: इब्रानी पाठ रीति की क्रियाओं का वर्णन करता है, पर इस पद में उनका धर्मवैचारिक अर्थ नहीं समझाता। अतः चित्रात्मकता और वाचागत संकेत सुरक्षित हैं, किंतु व्याख्या मूल पाठ में नहीं जोड़ी गई।
- issue: לוֹ का संदर्भ
  choice: ‘उसके पास’—अर्थात परमेश्वर के पास।
  alternative: ‘अपने लिए’।
  rationale: रूप व्याकरणतः दातृवाचक है और कभी हितार्थक/स्वार्थवाचक हो सकता है, किंतु पद 9 की ‘मेरे पास ला’ आज्ञा इस पद में परमेश्वर को संदर्भित करने के पक्ष में प्रबल संदर्भ देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘हर भाग को उसके दूसरे भाग के सामने’ मूल के वितरणसूचक मुहावरे और स्थानिक चित्र को सामान्य पाठक के लिए स्पष्ट करता है।
