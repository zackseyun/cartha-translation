id: GEN.15.1
reference: Genesis 15:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הָיָ֤ה דְבַר יְהוָה֙ אֶל אַבְרָ֔ם בַּֽ/מַּחֲזֶ֖ה לֵ/אמֹ֑ר אַל תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔/ךְ שְׂכָרְ/ךָ֖ הַרְבֵּ֥ה מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/001.yaml
  text: After these things[a], the word of Yahweh came to Abram in a vision, saying, “Do not fear, Abram. I am a shield for you; your reward will be very great.”
translation:
  language: hi
  text: 'इन बातों के बाद याहवे का वचन एक दर्शन में अब्राम के पास आया: “मत डर, अब्राम। मैं तेरे लिए ढाल हूँ; तेरा प्रतिफल बहुत बड़ा होगा।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “मैं तेरी ढाल हूँ; तेरा प्रतिफल अत्यन्त बड़ा है।” क्रियारहित इब्रानी को इस प्रकार भी समझा गया है: “मैं ही तेरी ढाल और तेरा अत्यन्त बड़ा प्रतिफल हूँ।”'
    reason: इब्रानी की अंतिम दो क्रियारहित उक्तियों में संबंध और काल स्पष्ट नहीं हैं; मुख्य पाठ मसोरेटिक वाक्य-विभाजन तथा प्रतिज्ञात्मक प्रसंग का अनुसरण करता है।
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: इन बातों के बाद
  rationale: דְּבָרִים का व्यापक अर्थ बनाए रखता है; प्रसंग में यह पिछली घटनाओं की ओर संकेत करता है, पर अनावश्यक रूप से केवल ‘घटनाएँ’ नहीं कहता।
- source_word: דְבַר יְהוָה
  choice: याहवे का वचन
  rationale: यह प्रकाशन के लिए प्रयुक्त पहचाना हुआ इब्रानी पदबंध है; ‘वचन’ उसकी औपचारिक और धर्मवैचारिक गरिमा बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक दिव्य नाम को उपाधि में बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: הָיָה ... אֶל אַבְרָם
  choice: अब्राम के पास आया
  rationale: इब्रानी में वचन के किसी व्यक्ति तक पहुँचने की अभिव्यक्ति का यह स्वाभाविक हिन्दी रूप है।
- source_word: בַּמַּחֲזֶה
  choice: एक दर्शन में
  rationale: מַחֲזֶה यहाँ ईश्वर से प्राप्त दृश्यात्मक प्रकाशन को दर्शाता है; हिन्दी में अनिश्चित अर्थ स्पष्ट करने के लिए ‘एक’ स्वाभाविक है।
- source_word: לֵאמֹר
  choice: उसने कहा
  rationale: शाब्दिक ‘यह कहते हुए’ की अपेक्षा यह वर्तमान हिन्दी में सीधे कथन का सहज परिचय देता है और बोलने वाले के रूप में याहवे को स्पष्ट रखता है।
- source_word: אַל תִּירָא
  choice: मत डर
  rationale: प्रत्यक्ष निषेध का संक्षिप्त, स्वाभाविक और वर्तमान हिन्दी रूप।
- source_word: מָגֵן לָךְ
  choice: तेरे लिए ढाल
  rationale: לָךְ के ‘तेरे लिए’ अर्थ को बनाए रखता है और उसे केवल स्वामित्वसूचक ‘तेरी ढाल’ में नहीं बदलता।
- source_word: שְׂכָרְךָ
  choice: तेरा प्रतिफल
  rationale: שָׂכָר मजदूरी, पारिश्रमिक या प्रतिफल हो सकता है; इस प्रतिज्ञात्मक प्रसंग में ‘प्रतिफल’ पर्याप्त व्यापक और गरिमापूर्ण है।
- source_word: הַרְבֵּה מְאֹד
  choice: बहुत बड़ा होगा
  rationale: इब्रानी की क्रियारहित उक्ति को प्रतिज्ञा के प्रसंग में स्वाभाविक हिन्दी भविष्यकाल से व्यक्त करता है; ‘बहुत बड़ा’ मात्रा और महत्त्व की प्रचुरता बताता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार अक्षरों वाला दिव्य नाम है; ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है।
- issue: שְׂכָרְךָ הַרְבֵּה מְאֹד में निहित क्रिया और उसका काल
  choice: तेरा प्रतिफल बहुत बड़ा होगा
  alternative: तेरा प्रतिफल बहुत बड़ा है
  rationale: इब्रानी में स्पष्ट योजक क्रिया नहीं है। मुख्य पाठ में प्रतिज्ञात्मक प्रसंग के अनुसार भविष्यकाल लिया गया है, जबकि वर्तमानकाल भी व्याकरणतः संभव है।
- issue: क्या ‘अत्यन्त बड़ा प्रतिफल’ स्वयं याहवे है
  choice: ‘ढाल’ और ‘प्रतिफल’ को दो अलग विधेय मानना
  alternative: मैं ही तेरी ढाल और तेरा अत्यन्त बड़ा प्रतिफल हूँ
  rationale: मसोरेटिक विराम-चिह्न और निकटतम वाक्यरचना ‘मैं तेरे लिए ढाल हूँ’ तथा ‘तेरा प्रतिफल बहुत बड़ा होगा’ का समर्थन करते हैं। फिर भी क्रियारहित संक्षिप्त इब्रानी के कारण याहवे को ही प्रतिफल मानने वाला प्राचीन वैकल्पिक पाठार्थ संभव है और पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। अब्राम को संबोधन में ‘तू/तेरा’ के रूप पारंपरिक निकटता और एकवचन को स्वाभाविक हिन्दी में व्यक्त करते हैं। ‘दर्शन’ और ‘प्रतिफल’ जैसे शब्द सामान्य धार्मिक हिन्दी में पहचाने जाते हैं, पर अत्यधिक संस्कृतनिष्ठ वाक्यरचना से बचा गया है।
