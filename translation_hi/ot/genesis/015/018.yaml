source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת אַבְרָ֖ם בְּרִ֣ית לֵ/אמֹ֑ר לְ/זַרְעֲ/ךָ֗ נָתַ֨תִּי֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/נְּהַ֣ר מִצְרַ֔יִם עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/018.yaml
  text: On that day Yahweh made a covenant with Abram[a], saying, “To your offspring I have given this land, from the river of Egypt as far as the great river[b], the Euphrates.”
translation:
  language: hi
  text: उस दिन याहवे ने अब्राम के साथ वाचा बाँधी[a] और कहा, “मैंने तुम्हारे वंश को यह देश दे दिया है—मिस्र की नदी[b] से लेकर उस महान नदी, अर्थात् फरात तक।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “वाचा काटी” है। यह वाचा बाँधने का मुहावरा है और संभवतः आसपास वर्णित वाचा-संबंधी अनुष्ठान की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: इसे “मिस्र के नाले” या “मिस्र की वादी” भी समझा गया है। हिब्रू में “मिस्र की नदी” है, पर ठीक किस भौगोलिक स्थान का उल्लेख है, इस पर मतभेद है।
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह किसी निश्चित अवसर को सूचित करने वाला स्वाभाविक और मूल के निकट हिन्दी प्रयोग है।
- source_word: כָּרַת ... בְּרִית
  choice: वाचा बाँधी
  rationale: हिब्रू मुहावरे का शाब्दिक अर्थ ‘वाचा काटी’ है; हिन्दी में ‘वाचा बाँधी’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है, जबकि शाब्दिक रूप और अनुष्ठानिक पृष्ठभूमि पादटिप्पणी में दी गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण का प्रयोग किया गया है, शीर्षक से उसका प्रतिस्थापन नहीं किया गया।
- source_word: אֶת אַבְרָם
  choice: अब्राम के साथ
  rationale: वाचा बाँधने के संबंधात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְזַרְעֲךָ
  choice: तुम्हारे वंश को
  rationale: זֶרַע के सामूहिक एकवचन अर्थ को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: נָתַתִּי
  choice: मैंने ... दे दिया है
  rationale: पूर्ण क्रिया के पूर्ण किए गए, वर्तमान प्रभाव वाले वाचागत अनुदान को व्यक्त करता है, बिना इसे केवल भविष्यकालीन प्रतिज्ञा बनाने के।
- source_word: הָאָרֶץ הַזֹּאת
  choice: यह देश
  rationale: क्षेत्रीय भूमि के संदर्भ में ‘देश’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: מִנְּהַר מִצְרַיִם
  choice: मिस्र की नदी से
  rationale: נָהָר का सामान्य अर्थ ‘नदी’ मुख्य पाठ में रखा गया है; भौगोलिक पहचान की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: उस महान नदी, फरात तक
  rationale: सीमा-सूचक עַד और ‘महान नदी’ के साथ फरात की समानाधिकरणात्मक पहचान दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है; हिन्दी की प्रतिष्ठित बाइबलीय परंपरा में परिचित ‘यहोवा’ उसे उपाधि से बदले बिना नाम के रूप में प्रस्तुत करता है।
- issue: वाचागत अनुदान में נָתַתִּי का पक्ष
  choice: मैंने ... दे दिया है
  alternative: मैं ... देता हूँ
  rationale: हिब्रू पूर्ण रूप अनुदान को निश्चित और प्रभावी रूप से दिया हुआ प्रस्तुत कर सकता है; हिन्दी पूर्ण वर्तमान उसकी पूर्णता और वर्तमान प्रासंगिकता दोनों रखता है।
- issue: זֶרַע का सामूहिक अर्थ
  choice: वंश
  alternative: वंशजों
  rationale: ‘वंश’ सामूहिक एकवचन की गुंजाइश बनाए रखता है और उसे स्पष्ट बहुवचन में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली रखी गई है। ‘वाचा’ और ‘वंश’ जैसे स्थापित बाइबलीय शब्द अर्थगत सटीकता के लिए बनाए रखे गए हैं; वाक्य विन्यास बोलचाल से ऊपर, पर सामान्य पाठक के लिए सहज है।
