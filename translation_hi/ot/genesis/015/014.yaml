reference: Genesis 15:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/גַ֧ם אֶת הַ/גּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ דָּ֣ן אָנֹ֑כִי וְ/אַחֲרֵי כֵ֥ן יֵצְא֖וּ בִּ/רְכֻ֥שׁ גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/014.yaml
  text: But I will also judge the nation that they serve[b][a], and afterward they will come out with great possessions.
translation:
  language: hi
  text: परन्तु जिस जाति की वे सेवा करेंगे, उसका न्याय मैं भी करूँगा; और उसके बाद वे बहुत-सी सम्पत्ति लेकर निकलेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: परन्तु ... भी
  rationale: וְ के साथ גַם पूर्ववर्ती दुःख के कथन से विरोधात्मक निरन्तरता और अतिरिक्त ईश्वरीय कार्रवाई व्यक्त करता है; हिन्दी में ‘परन्तु ... भी’ दोनों बलों को स्वाभाविक ढंग से रखता है।
- source_word: הַגּוֹי
  choice: जिस जाति ... उसका
  rationale: גּוֹי यहाँ अब्राम के वंशजों पर शासन करने वाले विदेशी राष्ट्रीय समुदाय को सूचित करता है। ‘जाति’ आधुनिक बाइबलीय हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: אֲשֶׁר יַעֲבֹדוּ
  choice: जिस जाति की वे सेवा करेंगे
  rationale: עבד के काल रूप का मूल अर्थ ‘सेवा करना/काम करना’ है। मुख्य पाठ में इसी स्पष्ट शब्दार्थ को रखा गया है; दासत्व का भाव प्रसंग से प्रकट होता है, पर क्रिया में उसे अनिवार्य रूप से व्यक्त नहीं किया गया।
- source_word: דָּן אָנֹכִי
  choice: उसका न्याय मैं ... करूँगा
  rationale: דָּן न्यायिक अर्थ रखता है और אָנֹכִי कर्ता ‘मैं’ पर बल देता है। भविष्य के प्रसंग में ‘मैं ... करूँगा’ स्वाभाविक है; हिन्दी शब्दक्रम कर्ता के बल को भी बनाए रखता है।
- source_word: וְאַחֲרֵי כֵן
  choice: और उसके बाद
  rationale: यह पदबंध घटनाओं का कालानुक्रमिक क्रम बताता है; ‘और उसके बाद’ सीधा तथा स्वाभाविक अनुवाद है।
- source_word: יֵצְאוּ
  choice: वे ... निकलेंगे
  rationale: יצא का अर्थ ‘बाहर जाना/निकलना’ है। ‘निकलेंगे’ हिन्दी में स्थान और दासता दोनों से बाहर आने को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: בִּרְכֻשׁ גָּדוֹל
  choice: बहुत-सी सम्पत्ति लेकर
  rationale: רְכוּשׁ चल-अचल माल, सामान या सम्पत्ति का ठोस भाव रखता है, और גָּדוֹל यहाँ बड़ी मात्रा सूचित करता है। ‘बहुत-सी सम्पत्ति लेकर’ स्वाभाविक हिन्दी में साथ ले जाने का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: अत्याचारी जाति पर परमेश्वर की कार्रवाई का स्वरूप
  choice: न्याय करूँगा
  alternative: दण्ड दूँगा
  rationale: דָּן न्यायिक भाषा है। ‘न्याय करूँगा’ विधिक और नैतिक आयाम को सुरक्षित रखता है, जबकि ‘दण्ड दूँगा’ परिणाम को अधिक संकीर्ण रूप से निर्धारित कर देता।
- issue: विदेशी जाति के अधीन अब्राम के वंशजों की स्थिति
  choice: सेवा करेंगे
  alternative: दास बने रहेंगे
  rationale: עבד काल में स्पष्टतः ‘सेवा करना’ है। प्रसंग बाध्य सेवा या दासत्व की ओर संकेत करता है, पर मुख्य पाठ में उसे अधिक स्पष्ट बनाकर मूल की शब्दगत व्यापकता को समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। ‘परन्तु’ और ‘न्याय’ औपचारिकता बनाए रखते हैं; वाक्यरचना सरल है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य अनुवाद मूल की शब्दगत व्यापकता और प्रसंगगत तनाव दोनों सुरक्षित रखता है।
