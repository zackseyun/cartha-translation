  yaml_path: translation/ot/genesis/015/019.yaml
  text: the Kenites[a], the Kenizzites, and the Kadmonites—
translation:
  language: hi
  text: केनियों, कनिज्जियों और कद्मोनियों[a] को—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क़दमोनी (קַדְמֹנִי) शब्द ‘पूर्व’ या ‘पूरब’ से संबंधित है; यहाँ जातियों की सूची में होने के कारण इसका अनुवाद जातिनाम ‘कद्मोनी’ के रूप में किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת
  choice: को
  rationale: यह प्रत्यक्ष कर्म का चिह्न है। हिन्दी में पूरी सूची के अंत में ‘को’ रखकर इसके व्याकरणिक कार्य को स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: הַקֵּינִי
  choice: केनियों
  rationale: निश्चित उपपद सहित यह जातिनाम सामूहिक अर्थ में प्रयुक्त है; हिन्दी में लोगों के समुदाय को बहुवचन ‘केनियों’ से स्पष्ट किया गया है।
- source_word: וְאֶת
  choice: और … को
  rationale: וְ सूची की अगली इकाई जोड़ता है, जबकि אֶת का कार्य सूची के अंत में आए ‘को’ में समाहित है।
- source_word: הַקְּנִזִּי
  choice: कनिज्जियों
  rationale: यह भूमि से जुड़ी जातियों की सूची में सामूहिक जातिनाम है; इसलिए हिन्दी बहुवचन रूप चुना गया है।
- source_word: וְאֵת
  choice: और … को
  rationale: संयोजक अंतिम जाति को सूची से जोड़ता है; कर्मचिह्न का अनुवाद साझा ‘को’ से हुआ है।
- source_word: הַקַּדְמֹנִי
  choice: कद्मोनियों
  rationale: यद्यपि यह शब्द ‘पूर्व’ या ‘पूरब’ से संबंधित है, यहाँ समानांतर जातिनामों की सूची में एक जातिनाम के रूप में आया है; इसलिए उसके नामात्मक स्वरूप को लिप्यंतरित किया गया है।
theological_decisions: []
