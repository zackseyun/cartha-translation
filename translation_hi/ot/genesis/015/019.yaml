  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। तीनों जातिनामों को समुदायसूचक बहुवचन में रखा गया है। साझा कर्मचिह्न ‘को’ सूची के अंत में है, और अंतिम डैश अगले पद तक चलने वाली सूची का संकेत देता है।
