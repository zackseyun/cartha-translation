  text: וַ/יֹּ֖אמֶר אֵלָ֑י/ו אֲנִ֣י יְהוָ֗ה אֲשֶׁ֤ר הוֹצֵאתִ֨י/ךָ֙ מֵ/א֣וּר כַּשְׂדִּ֔ים לָ֧/תֶת לְ/ךָ֛ אֶת הָ/אָ֥רֶץ הַ/זֹּ֖את לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/007.yaml
  text: And he said to him[a], “I am Yahweh[c][b], who brought you out from Ur of the Chaldeans to give you this land to possess.”
translation:
  language: hi
  text: और उसने उससे कहा, “मैं याहवे हूँ, जो तुम्हें कसदियों के ऊर से निकाल लाया, तुम्हें यह भूमि देने के लिए कि तुम इस पर अधिकार कर सको[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसे विरासत में पाने के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: और उसने उससे कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘और ... कहा’ इब्रानी क्रम को बनाए रखता है। אֵלָיו का अर्थ प्रसंगानुसार ‘उससे’ है।
- source_word: אֲנִי יְהוָה
  choice: मैं याहवे हूँ
  rationale: इब्रानी के क्रियारहित परिचय-वाक्य को स्वाभाविक हिन्दी में ‘हूँ’ के साथ व्यक्त किया गया है और परमेश्वर के व्यक्तिगत नाम को लिप्यंतरित किया गया है।
- source_word: הוֹצֵאתִיךָ
  choice: तुम्हें ... से निकाल लाया
  rationale: יצא के हिफ़ील रूप में किसी को बाहर ले आने का कारक भाव है; यह हिन्दी प्रयोग उस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵאוּר כַּשְׂדִּים
  choice: कसदियों के ऊर से
  rationale: स्थान-नाम אוּר को ‘ऊर’ और जाति-संबंधी כַּשְׂדִּים को प्रचलित हिन्दी रूप ‘कसदियों’ से व्यक्त किया गया है।
- source_word: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת
  choice: ताकि यह देश तुम्हें दूँ
  rationale: ל लगा infinitive यहाँ उद्देश्य बताता है; हिन्दी में ‘ताकि’ इस संबंध को स्पष्ट और सहज बनाता है। הָאָרֶץ को इस भूमि-प्रतिज्ञा के प्रसंग में ‘देश’ कहा गया है।
- source_word: לְרִשְׁתָּהּ
  choice: और तुम इसे अपने अधिकार में ले लो
  rationale: ירשׁ यहाँ देश को प्राप्त करके उस पर अधिकार करने का अर्थ देता है। समन्वित उद्देश्य-वाक्य हिन्दी में स्वाभाविक है और मूल के स्त्रीलिंग प्रत्यय का संदर्भ ‘इस देश’ से ‘इसे’ द्वारा बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ संभावित प्राचीन उच्चारण के निकट हिन्दी लिप्यंतरण है और इसे किसी उपाधि से नहीं बदलता।
- issue: לְרִשְׁתָּהּ में अधिकार और विरासत का अर्थ-संबंध
  choice: इसे अपने अधिकार में ले लो
  alternative: इसे विरासत में पाओ
  rationale: इस प्रसंग में भूमि को प्राप्त करके उस पर अधिकार करने का भाव प्रमुख है, पर ירשׁ में विरासत पाने का अर्थ भी संभव है; इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ऊर’ और ‘कसदी’ जैसे स्थापित बाइबलीय नाम बनाए गए हैं; वाक्य का उद्देश्य-संबंध स्पष्ट करने के लिए ‘ताकि’ और दूसरा समन्वित उद्देश्य-वाक्य प्रयोग किया गया है।
