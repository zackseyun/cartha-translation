  yaml_path: translation/ot/genesis/015/006.yaml
  text: And he believed Yahweh[c][b][a], and he counted it to him as righteousness.
translation:
  language: hi
  text: और उसने यहोवा पर विश्वास किया[a], और यहोवा ने इसे उसके लिए धार्मिकता गिना[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहोवा पर भरोसा रखा।’
    reason: lexical_alternative
  - marker: b
    text: या ‘इसे उसके लेखे धार्मिकता गिना’ अथवा ‘इसे उसके लिए धार्मिकता ठहराया।’
    reason: lexical_alternative
  - marker: c
    text: हिब्रू वाक्य-विन्यास को सामान्यतः इस अर्थ में समझा जाता है कि यहोवा ने अब्राम के विश्वास करने को धार्मिकता गिना। एक कम संभावित अर्थ में अब्राम को ‘गिना’ का कर्ता समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הֶאֱמִן
  choice: और उसने ... पर विश्वास किया
  rationale: हिफ़ील रूप यहाँ किसी पर भरोसा रखने या विश्वास करने को व्यक्त करता है। ‘विश्वास किया’ आधुनिक हिन्दी में सीधा और स्वाभाविक है तथा मूल क्रिया की व्यापक बाइबलीय प्रतिध्वनि को बनाए रखता है।
- source_word: בַּ/יהוָה
  choice: यहोवा पर
  rationale: בְּ विश्वास के लक्ष्य को चिह्नित करता है। परमेश्वर के व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַ/יַּחְשְׁבֶהָ
  choice: और यहोवा ने इसे ... माना
  rationale: חשב का अर्थ किसी बात को गिनना, लेखे में रखना या मानना है। ‘माना’ हिन्दी में स्वाभाविक है और मूल्यांकन/लेखे में गिने जाने का भाव रखता है। स्त्रीलिंग प्रत्यय को ‘इसे’ से व्यक्त किया गया है, जिससे विश्वास करने की क्रिया की ओर संकेत रहता है और ‘विश्वास’ जैसे व्याख्यात्मक संज्ञा-पद को मूल पाठ में जोड़ा नहीं जाता।
- source_word: לּוֹ
  choice: उसके लिए
  rationale: לְ के साथ सर्वनाम उस व्यक्ति को दर्शाता है जिसके संबंध में यह बात धार्मिकता मानी गई। ‘उसके लिए’ सहज हिन्दी में इस संबंध को व्यक्त करता है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: यहाँ צְדָקָה न्यायोचित या धर्मी ठहरने की अवस्था/गुण को व्यक्त करता है। ‘धार्मिकता’ इसका स्थापित और प्रसंगानुकूल हिन्दी समकक्ष है।
theological_decisions:
- issue: ‘माना’ क्रिया का कर्ता
  choice: 'यहोवा को कर्ता मानते हुए नाम को दोहराया गया: ‘यहोवा ने इसे ... माना।’'
  alternative: 'अब्राम को कर्ता मानना: उसने यहोवा पर विश्वास किया और उसने उसे/इसे धार्मिकता माना।'
  rationale: प्रसंग और इस पद की व्यापक बाइबलीय ग्रहण-परंपरा में यहोवा को क्रिया का कर्ता समझना सर्वाधिक स्वाभाविक है। हिन्दी में केवल ‘उसने’ रखने से कर्ता अनावश्यक रूप से अस्पष्ट हो जाता, इसलिए मुख्य अर्थ स्पष्ट किया गया है और कम संभावित व्याकरणिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: स्त्रीलिंग प्रत्यय הָ का संदर्भ
  choice: इसे
  alternative: अब्राम के विश्वास या उसकी भरोसा रखने की प्रतिक्रिया को स्पष्ट संज्ञा से व्यक्त करना।
  rationale: हिब्रू स्त्रीलिंग प्रत्यय किसी अमूर्त क्रिया या घटना की ओर संकेत कर सकता है। ‘इसे’ मूल की संक्षिप्तता और कुछ हद तक उसकी संदर्भगत खुलावट को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। ‘उसके लेखे’ जैसे अपेक्षाकृत पुराने मुहावरे को मुख्य पाठ के बजाय पादटिप्पणी में रखा गया है; मुख्य पाठ में सर्वनामगत अस्पष्टता से बचने के लिए ‘यहोवा’ दोहराया गया है।
