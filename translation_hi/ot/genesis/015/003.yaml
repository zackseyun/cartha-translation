id: GEN.15.3
reference: Genesis 15:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָ֔ם הֵ֣ן לִ֔/י לֹ֥א נָתַ֖תָּה זָ֑רַע וְ/הִנֵּ֥ה בֶן בֵּיתִ֖/י יוֹרֵ֥שׁ אֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/003.yaml
  text: Then Abram said[a], “Behold, you have given me no offspring, and behold[b], a son of my household will inherit me.”
translation:
  language: hi
  text: तब अब्राम ने कहा, “देख, तूने मुझे कोई संतान नहीं दी; और देख, मेरे घराने का एक जन मेरा वारिस होगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम व्यक्त करता है।
- source_word: הֵן
  choice: देख
  rationale: यह अव्यय ध्यान खींचकर कथन पर बल देता है; ‘देख’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: לִי לֹא נָתַתָּה זָרַע
  choice: तूने मुझे कोई संतान नहीं दी
  rationale: זֶרַע का शाब्दिक अर्थ ‘बीज’ है, पर यहाँ इसका आशय वंश अथवा संतान से है। ‘संतान’ अब्राम की निःसंतानता को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देख
  rationale: दूसरा संकेतवाचक अव्यय अब्राम के निष्कर्ष पर फिर से बल देता है और पहले ‘देख’ के साथ अलंकारिक समानता बनाए रखता है।
- source_word: בֶן בֵּיתִי
  choice: मेरे घराने का एक जन
  rationale: शाब्दिक रूप ‘मेरे घर का पुत्र’ है। यहाँ यह घराने से संबद्ध पुरुष को सूचित करता है; ‘जन’ पाठ में न कही गई दास की विशिष्ट सामाजिक स्थिति आरोपित किए बिना घरेलू संबद्धता बचाता है।
- source_word: יוֹרֵשׁ אֹתִי
  choice: मेरा वारिस होगा
  rationale: शाब्दिक संरचना ‘मुझे विरासत में पाएगा’ है, पर हिन्दी में वह भ्रामक और अस्वाभाविक होगी। ‘मेरा वारिस होगा’ क्रियाविशेषणात्मक कृदंत का भाव और अब्राम की संपत्ति/वंश के उत्तराधिकार का आशय स्पष्ट करता है।
theological_decisions:
- issue: अब्राम की निःसंतानता और घराने के व्यक्ति का उत्तराधिकार
  choice: पद को इस अर्थ में प्रस्तुत किया गया है कि संतान न होने के कारण अब्राम के घराने से संबद्ध एक व्यक्ति उसका वारिस होगा।
  alternative: उसे विशेष रूप से अब्राम के घर में जन्मा दास अथवा सेवक कहना।
  rationale: इस पद में ‘दास’ का शब्द नहीं है, बल्कि ‘मेरे घर का पुत्र’ है। इसलिए अनुवाद आसपास के संदर्भ से संभव अधिक विशिष्ट सामाजिक पहचान को इस पद में आरोपित नहीं करता।
- issue: יוֹרֵשׁ אֹתִי में प्रत्यक्ष कर्म ‘मुझे’
  choice: मुहावरेदार रूप ‘मेरा वारिस होगा’।
  alternative: अधिक शाब्दिक ‘मुझे विरासत में पाएगा’।
  rationale: इब्रानी में ‘मुझे’ संभवतः अब्राम की संपत्ति और वंशगत स्थान के लिए लक्षणा है। हिन्दी में अधिक शाब्दिक रूप गलत अर्थ दे सकता है; चुना हुआ रूप आशय को व्यक्त करता है, यद्यपि मूल की असामान्य संरचना को समतल करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। परमेश्वर को अब्राम के सीधे संबोधन में ‘तू’ रखा गया है, जो बाइबिलीय हिन्दी की निकट और एकवचन संबोधन-परंपरा के अनुरूप है। ‘घराने’ से घरेलू समुदाय का व्यापक भाव सुरक्षित रहता है।
