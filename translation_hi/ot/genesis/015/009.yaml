- source_word: עֶגְלָה מְשֻׁלֶּשֶׁת
  choice: तीन वर्ष की एक बछिया
  rationale: עֶגְלָה युवा मादा गोवंश को दर्शाता है और מְשֻׁלֶּשֶׁת को इस पशु-सूची में परंपरागत रूप से तीन वर्ष की आयु का सूचक समझा जाता है।
- source_word: עֵז מְשֻׁלֶּשֶׁת
  choice: तीन वर्ष की एक बकरी
  rationale: עֵז यहाँ मादा बकरी है; हिन्दी में ‘बकरी’ स्वयं स्पष्ट और स्वाभाविक स्त्रीलिंग संज्ञा है।
- source_word: אַיִל מְשֻׁלָּשׁ
  choice: तीन वर्ष का एक मेढ़ा
  rationale: אַיִל नर भेड़ अर्थात मेढ़े के लिए मानक शब्द है; आयु-सूचक विशेषण को समानांतर पशुओं के अनुरूप रखा गया है।
- source_word: תֹר
  choice: पंडुक
  rationale: यह सामान्य कबूतर के बजाय टर्टलडव की विशिष्ट जाति को दर्शाता है; ‘पंडुक’ उसका सटीक और प्रचलित हिन्दी नाम है।
- source_word: גוֹזָל
  choice: कबूतर का एक बच्चा
  rationale: शब्द व्यापक रूप से पक्षी के बच्चे को दर्शा सकता है, पर תֹר के साथ अनुष्ठानिक जोड़ी में इसे परंपरागत रूप से कबूतर का बच्चा समझा जाता है।
