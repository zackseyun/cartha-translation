base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/009.yaml
  text: And he said to him[a], “Bring me a three-year-old heifer, a three-year-old female goat, a three-year-old ram, a turtledove[b], and a young pigeon.”
translation:
  language: hi
  text: तब उसने उससे[a] कहा, “मेरे लिए तीन वर्ष की[b] बछिया, तीन वर्ष की बकरी, तीन वर्ष का मेढ़ा, एक फाख्ता और कबूतर का एक बच्चा ले आओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘उससे कहा’ और ‘मेरे लिए लो।’ प्रसंग में आशय इन पशु-पक्षियों को लाकर देने का है।
    reason: lexical_alternative
  - marker: b
    text: ‘तीन वर्ष की/का’ के लिए आया इब्रानी शब्द तीनों पशुओं के साथ दोहराया गया है; यहाँ इसे परंपरागत रूप से तीन वर्ष की आयु का सूचक समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
