base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/019.yaml
  text: And there was evening[a], and there was morning—the fourth day.
translation:
  language: hi
  text: और साँझ हुई, और भोर हुई—चौथा दिन।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दानुसार: “और साँझ हुई और भोर हुई—एक चौथा दिन।”'
    reason: इब्रानी में יוֹם רְבִיעִי के साथ पृथक निश्चयवाचक उपपद नहीं है; मुख्य पाठ का ‘चौथा दिन’ अधिक स्वाभाविक हिन्दी है।
lexical_decisions:
- source_word: וַיְהִי
  choice: हुई
  rationale: यहाँ היה का वय्यिक्तोल रूप सृष्टि-वर्णन में दिन की समाप्ति बताने वाले आवर्ती सूत्र का भाग है। स्त्रीलिंग संज्ञाओं ‘साँझ’ और ‘भोर’ के साथ ‘हुई’ स्वाभाविक हिन्दी है और अस्तित्व/घटना का भाव बनाए रखता है।
- source_word: עֶרֶב
  choice: साँझ
  rationale: עֶרֶב का सीधा अर्थ संध्या का समय है। ‘साँझ’ आधुनिक पाठकों के लिए सहज, संक्षिप्त और इस आवर्ती काव्यमय सूत्र के अनुकूल है।
- source_word: וַיְהִי
  choice: हुई
  rationale: दूसरी आवृत्ति को भी पहले के समान रखा गया है, ताकि इब्रानी सूत्र की समरूपता और लय सुरक्षित रहे।
- source_word: בֹּקֶר
  choice: भोर
  rationale: בֹּקֶר सुबह के समय को दर्शाता है। ‘भोर’ यहाँ ‘साँझ’ के साथ स्वाभाविक युग्म बनाता है और दिन के आरंभ का भाव स्पष्ट करता है।
- source_word: יוֹם רְבִיעִי
  choice: चौथा दिन
  rationale: इब्रानी पद दिन की पहचान क्रमवाचक संख्या से करता है। हिन्दी में बिना अतिरिक्त निश्चयवाचक शब्द के ‘चौथा दिन’ स्वाभाविक और सटीक है।
theological_decisions:
- issue: सृष्टि-दिवस के सूत्र का ऐसा अनुवाद जो किसी विशिष्ट कालक्रम या पृथ्वी की आयु संबंधी मत को न जोड़े
  choice: और साँझ हुई, और भोर हुई—चौथा दिन।
  alternative: और साँझ हुई और भोर हुई—एक चौथा दिन।
  rationale: अनुवाद इब्रानी के आवर्ती सूत्र को सीधे रूप में रखता है और ‘दिन’ की प्रकृति अथवा अवधि पर चलने वाली व्यापक व्याख्यात्मक बहस का निर्णय नहीं करता। ‘चौथा दिन’ आधुनिक हिन्दी में स्वाभाविक है और क्रमवाचक पहचान बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘साँझ’ और ‘भोर’ आवर्ती सूत्र की संक्षिप्त लय को बनाए रखते हैं; विराम-चिह्न चौथे दिन की समापन पहचान को उभारता है।
