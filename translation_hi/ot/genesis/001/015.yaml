  choice: और वे ... ठहरें
  rationale: पूर्ववर्ती सृष्टि-आज्ञा की इच्छार्थक शक्ति यहाँ जारी रहती है। ‘ठहरें’ उनके नियुक्त उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִמְאוֹרֹת
  choice: ज्योतियाँ
  rationale: מָאוֹר अमूर्त प्रकाश नहीं, बल्कि प्रकाश देने वाले पिंड या स्रोत को दर्शाता है। ‘ज्योतियाँ’ संक्षिप्त, गरिमापूर्ण और सन्दर्भानुकूल है।
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: आकाश के विस्तार में
  rationale: यह अनुवाद רָקִיעַ के फैले हुए विस्तार के भाव तथा הַשָּׁמַיִם के आकाशीय सन्दर्भ—दोनों को सुरक्षित रखता है, बिना किसी विशिष्ट भौतिक ब्रह्माण्ड-कल्पना को थोपे।
- source_word: לְהָאִיר
  choice: प्रकाश दें
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘प्रकाश देना’ है; यह केवल ‘चमकना’ से अधिक सटीक है।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: עַל यहाँ प्रकाश पड़ने के क्षेत्र को दर्शाता है; ‘पृथ्वी पर’ स्वाभाविक और सटीक हिन्दी है।
- source_word: וַיְהִי כֵן
  choice: और वैसा ही हो गया
  rationale: यह उत्पत्ति 1 की बार-बार आने वाली आज्ञा-पूर्ति की अभिव्यक्ति को सहज आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: सृष्टि-वचन में וְהָיוּ की इच्छार्थक शक्ति
  choice: इसे आज्ञा की निरन्तरता के रूप में ‘और वे ... ठहरें’ अनूदित किया गया है।
  alternative: ‘और वे ... होंगे’ जैसे साधारण भविष्यकाल के रूप में अनुवाद।
  rationale: निकटवर्ती वाक्य-विन्यास इसे परमेश्वर की नियुक्ति-संबंधी आज्ञा के भीतर रखता है। इच्छार्थक अनुवाद आज्ञा और उसकी पूर्ति की साहित्यिक संरचना को सुरक्षित रखता है, बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठकों के लिए स्पष्ट, किंतु गरिमापूर्ण। ‘आकाश के विस्तार’ से मूल की अभिव्यक्ति सुरक्षित रहती है और ‘ज्योतियाँ’ खगोलीय प्रकाश-स्रोतों को स्वाभाविक ढंग से व्यक्त करता है।
