source:
  edition: WLC
  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/א֖וֹר כִּי ט֑וֹב וַ/יַּבְדֵּ֣ל אֱלֹהִ֔ים בֵּ֥ין הָ/א֖וֹר וּ/בֵ֥ין הַ/חֹֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/004.yaml
  text: And God saw that the light was good[a], and God separated the light from the darkness.
translation:
  language: hi
  text: और परमेश्वर ने देखा कि प्रकाश अच्छा है, और परमेश्वर ने प्रकाश को अंधकार से अलग किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रकाश और अंधकार के बीच भेद किया”; इब्रानी क्रिया दो वस्तुओं को विभाजित करने या उनके बीच भेद स्थापित करने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: ראה का यह कथात्मक रूप सामान्यतः ‘देखा’ है; यहाँ यह मूल्यांकन का भाव भी समेटता है, पर उसे अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: उत्पत्ति 1 में बहुवचन-रूप वाला यह संज्ञा-पद एकवचन क्रियाओं के साथ एक सृष्टिकर्ता के लिए प्रयुक्त हुआ है; ‘परमेश्वर’ मानक और गरिमापूर्ण हिन्दी रूप है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का व्याकरणिक चिह्न है; हिन्दी में इसका कार्य वाक्य-विन्यास और ‘को’ से व्यक्त होता है।
- source_word: הָאוֹר
  choice: प्रकाश
  rationale: संदर्भ में यह पिछले पद में अस्तित्व में आए विशिष्ट प्रकाश को सूचित करता है; हिन्दी में भाववाचक/द्रव्यवाचक ‘प्रकाश’ के साथ अलग निश्चित उपपद आवश्यक नहीं है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי परमेश्वर के देखने की विषय-वस्तु प्रस्तुत करता है; हिन्दी में ‘कि’ इसका स्वाभाविक समतुल्य है।
- source_word: טוֹב
  choice: अच्छा
  rationale: טוֹב का सामान्य मूल्यांकनात्मक अर्थ ‘अच्छा’ है; ‘मनभावना’ या ‘लाभकारी’ जैसे रूप अर्थ को अनावश्यक रूप से सीमित करेंगे।
- source_word: וַיַּבְדֵּל
  choice: अलग किया
  rationale: בדל का अर्थ अलग करना, विभाजित करना या भेद स्थापित करना हो सकता है। ‘अलग किया’ इस सृष्टि-विन्यास के संदर्भ में स्वाभाविक है और प्रक्रिया का प्रकार तय नहीं करता।
- source_word: בֵּין ... וּבֵין
  choice: को ... से
  rationale: इब्रानी में शाब्दिक रचना ‘के बीच ... और के बीच’ है; ‘अलग किया’ के साथ हिन्दी की स्वाभाविक रचना ‘प्रकाश को अंधकार से’ है।
- source_word: הַחֹשֶׁךְ
  choice: अंधकार
  rationale: यह सृष्टि-वृत्तांत में पहले उल्लिखित अंधकार की ओर संकेत करता है; हिन्दी में ‘अंधकार’ बिना किसी निश्चित उपपद के स्वाभाविक है।
theological_decisions:
- issue: दोनों उपवाक्यों में אֱלֹהִים विषय की पुनरावृत्ति
  choice: दोनों बार ‘परमेश्वर’ रखा गया है।
  alternative: दूसरे उपवाक्य में ‘उसने’ कहना।
  rationale: इब्रानी पाठ सर्वनाम के बजाय परमेश्वर का नाम-पद दोहराता है। पुनरावृत्ति मूल की लय और बल को सुरक्षित रखती है।
- issue: प्रकाश और अंधकार के अलगाव का स्वरूप
  choice: ‘अलग किया’ कहा गया है, बिना यह निर्धारित किए कि अलगाव स्थानिक, कालिक या संकल्पनात्मक था।
  alternative: ‘विभाजित किया’ या ‘के बीच भेद किया’।
  rationale: मूल पाठ अलगाव की प्रक्रिया या स्वरूप स्पष्ट नहीं करता; अनुवाद इस ब्रह्मांडीय और धर्मवैचारिक खुलेपन को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। इब्रानी की दो समांतर क्रियाओं और ‘परमेश्वर’ की पुनरावृत्ति को रखा गया है; हिन्दी की स्वाभाविकता के लिए निश्चित उपपदों को यांत्रिक रूप से नहीं जोड़ा गया।
