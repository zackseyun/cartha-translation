source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָ/אָ֨רֶץ֙ דֶּ֔שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְ/מִינ֔/וֹ אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/011.yaml
  text: 'And God said[a], “Let the earth sprout vegetation: plants yielding seed, and fruit trees bearing fruit according to their kinds, with their seed in them[c][b], on the earth.” And it was so.'
translation:
  language: hi
  text: और परमेश्वर ने कहा, “धरती वनस्पति उगाए[a]—बीज उत्पन्न करनेवाले पौधे और फलदार वृक्ष, जो अपनी-अपनी जाति के अनुसार[b] फल दें और जिनमें उनका बीज हो[c]—धरती पर।” और ऐसा ही हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धरती वनस्पति उत्पन्न करे।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “उसकी जाति के अनुसार”; एकवचन का प्रयोग अलग-अलग वर्गों के लिए वितरणात्मक अर्थ में हुआ है।
    reason: lexical_alternative
  - marker: c
    text: या “जिसका बीज उसी में हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּדְשֵׁא
  choice: धरती हरियाली उगाए
  rationale: हिफ़ील आज्ञार्थक भाव में धरती को वनस्पति अंकुरित करने के लिए कहा गया है। ‘उगाए’ कारणवाचक भाव और उभरती वनस्पति की छवि दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דֶּשֶׁא
  choice: हरियाली
  rationale: यह ताज़ी हरी वनस्पति के लिए व्यापक सामूहिक शब्द है; ‘घास’ इसका अर्थ अनावश्यक रूप से सीमित कर देता।
- source_word: עֵשֶׂב
  choice: पौधे
  rationale: यह विशेषतः कोमल या शाकीय वनस्पति को सूचित करता है। ‘पौधे’ आधुनिक पाठक के लिए स्पष्ट है और ‘जड़ी-बूटी’ जैसे संकुचित अर्थ से बचता है।
- source_word: מַזְרִיעַ זֶרַע
  choice: बीज उत्पन्न करनेवाले
  rationale: कृदन्तीय पद पौधों की नियमित बीजोत्पादक विशेषता बताता है; यह हिन्दी में सहज और अर्थ-सटीक है।
- source_word: עֵץ פְּרִי
  choice: फलदार वृक्ष
  rationale: रचना ऐसे वृक्षों के वर्ग को दर्शाती है जिनकी विशेषता फल देना है; ‘फलदार वृक्ष’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: עֹשֶׂה פְּרִי
  choice: फल दें
  rationale: शाब्दिक ‘फल बनाएँ’ के बजाय कृषि-संदर्भ में ‘फल दें’ स्वाभाविक है और वृक्ष की विशिष्ट क्रिया को बनाए रखता है।
- source_word: לְמִינוֹ
  choice: अपनी-अपनी जाति के अनुसार
  rationale: इब्रानी में एकवचन रूप का वितरणात्मक प्रयोग है। ‘अपनी-अपनी’ प्रत्येक वर्ग पर अलग-अलग लागू होने वाला भाव स्पष्ट करता है, बिना आधुनिक वैज्ञानिक वर्गीकरण आरोपित किए।
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: जिनमें उनका बीज हो
  rationale: सम्बन्धवाचक उपवाक्य बीज के उन्हीं में निहित होने की बात कहता है। बहुवचन हिन्दी सामूहिक वृक्षों के साथ स्वाभाविक है, जबकि पादटिप्पणी शाब्दिक एकवचन बताती है।
- source_word: עַל הָאָרֶץ
  choice: धरती पर
  rationale: यह सीधा स्थानवाचक पद है और सृष्टि-वर्णन के संदर्भ में स्वाभाविक है।
- source_word: וַיְהִי כֵן
  choice: और ऐसा ही हो गया
  rationale: यह उत्पत्ति 1 का मानक पूर्ति-सूत्र है; अनुवाद उसकी संक्षिप्तता और गंभीर कथात्मक लय बनाए रखता है।
theological_decisions:
- issue: सृजी गई वनस्पति की श्रेणियों का दायरा
  choice: इब्रानी की वनस्पति-श्रेणियों को व्यापक, अनुभवपरक वर्गों के रूप में अलग-अलग बनाए रखा गया है।
  alternative: इन्हें या तो अधिक संकीर्ण रूप से ‘घास, बीजवाला साग और फलवृक्ष’ कहा जा सकता था, या सबको मिलाकर ‘हर प्रकार के पेड़-पौधे’ कहा जा सकता था।
  rationale: मूल पाठ सुव्यवस्थित वनस्पति-वर्ग प्रस्तुत करता है, पर आधुनिक वैज्ञानिक वर्गीकरण नहीं देता। चुना गया रूप न तो श्रेणियों को अनावश्यक रूप से संकीर्ण करता है, न उन्हें सामान्यीकृत करके मिटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण सृष्टि-वर्णन। ‘हरियाली’ व्यापक सामूहिक अर्थ देता है; ‘अपनी-अपनी जाति’ आधुनिक जैववैज्ञानिक वर्गीकरण का संकेत दिए बिना इब्रानी के वितरणात्मक एकवचन को स्वाभाविक रूप से व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
