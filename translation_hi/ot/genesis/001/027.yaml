id: GEN.1.27
reference: Genesis 1:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּבְרָ֨א אֱלֹהִ֤ים אֶת הָֽ/אָדָם֙ בְּ/צַלְמ֔/וֹ בְּ/צֶ֥לֶם אֱלֹהִ֖ים בָּרָ֣א אֹת֑/וֹ זָכָ֥ר וּ/נְקֵבָ֖ה בָּרָ֥א אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/027.yaml
  text: So God created man in his image[a]; in the image of God he created him; male and female he created them.
translation:
  language: hi
  text: इस प्रकार परमेश्वर ने मनुष्य को अपने स्वरूप में रचा[a]; परमेश्वर के स्वरूप में उसने उसे रचा; नर और नारी के रूप में उसने उन्हें रचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानवजाति को”; यहाँ इब्रानी शब्द आदाम एकवचन और प्रतिनिधिक है तथा पूरी मानवता की ओर संकेत करता है।
    reason: वैकल्पिक अर्थ को स्पष्ट करते हुए मूल के प्रतिनिधिक एकवचन को दिखाना।
lexical_decisions:
- source_word: וַיִּבְרָא / בָּרָא
  choice: रचा
  rationale: यहाँ क्रिया परमेश्वर के सृजन-कार्य को व्यक्त करती है। “रचा” तीनों बार दोहराकर इब्रानी की पुनरावृत्ति और ऊँची काव्यात्मक शैली सुरक्षित रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: बहुवचन रूप के बावजूद एकवचन क्रिया के साथ यह इस्राएल के एक परमेश्वर को सूचित करता है; आधुनिक मानक हिन्दी में “परमेश्वर” स्वाभाविक और गरिमापूर्ण है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: एकवचन रूप यहाँ समस्त मानवजाति का प्रतिनिधित्व करता है, जैसा कि आगे एकवचन “उसे” से बहुवचन “उन्हें” की ओर परिवर्तन दिखाता है। “मनुष्य” हिन्दी में इस प्रतिनिधिक अर्थ और एकवचन व्याकरण—दोनों को बनाए रखता है।
- source_word: בְּצַלְמוֹ
  choice: अपने स्वरूप में
  rationale: पूर्वसर्ग בְּ और प्रत्यय का स्वाभाविक अर्थ “अपने स्वरूप में” है; “अपने” का संबंध कर्ता परमेश्वर से स्पष्ट है।
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: परमेश्वर के स्वरूप में
  rationale: यह पहले वाक्यांश को दोहराकर बल देता है। “स्वरूप” की पुनरावृत्ति इब्रानी समानांतरता और धर्मवैचारिक जोर को सुरक्षित रखती है।
- source_word: אֹתוֹ
  choice: उसे
  rationale: पुल्लिंग एकवचन सर्वनाम प्रतिनिधिक הָאָדָם की ओर संकेत करता है; “उसे” एकवचन से बहुवचन की जानबूझकर की गई गति बनाए रखता है।
- source_word: זָכָר וּנְקֵבָה
  choice: नर और नारी के रूप में
  rationale: मूल शब्द लिंग-भेद के सूचक हैं, न कि संबंधसूचक “पुरुष और स्त्री” वाली जोड़ी। “नर और नारी” इस भेद को सटीक तथा मनुष्यों के संदर्भ में गरिमापूर्ण ढंग से व्यक्त करता है; “के रूप में” हिन्दी वाक्य को स्वाभाविक बनाता है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: बहुवचन सर्वनाम प्रतिनिधिक एकवचन मानवता से नर और नारी की बहुलता की ओर परिवर्तन को सुरक्षित रखता है।
theological_decisions:
- issue: प्रतिनिधिक मानवता के संदर्भ में אָדָם का अनुवाद
  choice: मनुष्य
  alternative: मानवजाति; वह मनुष्य
  rationale: इब्रानी में הָאָדָם और उससे जुड़ा सर्वनाम एकवचन हैं, पर अगली पंक्ति “नर और नारी” तथा “उन्हें” कहती है। “मनुष्य” स्रोत की एकवचन प्रतिनिधिकता और समस्त मानवता के आशय—दोनों को बिना किसी एक पुरुष व्यक्ति तक सीमित किए बनाए रखता है।
- issue: एकवचन से बहुवचन की ओर परिवर्तन
  choice: “उसे” और फिर “उन्हें”
  alternative: दोनों स्थानों पर बहुवचन सर्वनाम
  rationale: मूल पाठ का व्याकरण मानवता को पहले प्रतिनिधिक एकवचन और फिर नर-नारी की बहुलता के रूप में प्रस्तुत करता है; इसे समतल नहीं किया गया।
- issue: “स्वरूप में” बनाम “स्वरूप के रूप में”
  choice: स्वरूप में
  alternative: स्वरूप के रूप में
  rationale: पूर्वसर्ग का सामान्य अर्थ और पारंपरिक धर्मवैचारिक तनाव बनाए रखने के लिए “में” चुना गया; अनुवाद मनुष्य को स्वयं परमेश्वर का स्वरूप घोषित करने वाली वैकल्पिक व्याख्या को मुख्य पाठ में नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक लय रखी गई है। “रचा” और “स्वरूप” की तीनfold/दोहरावयुक्त संरचना मूल की पुनरावृत्ति को दर्शाती है; “उसे” से “उन्हें” की गति जानबूझकर सुरक्षित है।
