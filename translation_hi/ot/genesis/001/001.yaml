source:
  edition: WLC
  text: בְּ/רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַ/שָּׁמַ֖יִם וְ/אֵ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: hi
  text: आरम्भ में, जब परमेश्वर ने आकाश और पृथ्वी की सृष्टि की[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'परंपरागत रूप से इसे एक पूर्ण वाक्य के रूप में अनूदित किया जाता है: “आरम्भ में परमेश्वर ने आकाश और पृथ्वी की सृष्टि की।” इब्रानी में निश्चित उपपद रहित בְּרֵאשִׁית के बाद रूपांतरित क्रिया בָּרָא आती है; इसलिए इसे आश्रित कालवाचक उपवाक्य के रूप में पढ़ना अधिक स्वाभाविक है, जैसा कि उत्पत्ति 2:4ख में है। तब मुख्य उपवाक्य वचन 3 में आता है: “परमेश्वर ने कहा, ‘उजियाला हो।’”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: आरम्भ में, जब … सृष्टि की
  rationale: निर्देशक उपपद से रहित בְּרֵאשִׁית और उसके बाद आए सीमित क्रियारूप בָּרָא को आश्रित कालवाचक उपवाक्य के रूप में समझना स्वाभाविक है। यह अनुवाद רֵאשִׁית के ‘आरम्भ’ अर्थ को बनाए रखते हुए वाक्य को आगे की मुख्य क्रिया से जोड़ता है।
- source_word: בָּרָא
  choice: सृष्टि की
  rationale: यह इब्रानी बाइबल में परमेश्वर के सृजन के लिए मानक क्रिया है। ‘सृष्टि की’ हिन्दी में प्रतिष्ठित, सहज और प्रक्रिया के विषय में अनावश्यक निष्कर्ष से मुक्त है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: रूप की दृष्टि से यह बहुवचन है, पर यहाँ इसके साथ एकवचन क्रिया בָּרָא है; इसलिए इसका एकवचन अर्थ ‘परमेश्वर’ है।
- source_word: אֵת
  choice: '[अलग से अनूदित नहीं; निश्चित प्रत्यक्ष कर्म का चिह्न]'
  rationale: इस इब्रानी व्याकरणिक चिह्न का हिन्दी में कोई पृथक शब्दगत समकक्ष नहीं है; उसका कार्य वाक्य-विन्यास से प्रकट होता है।
- source_word: הַשָּׁמַיִם
  choice: आकाश
  rationale: שָׁמַיִם का रूप इब्रानी में बहुवचन/द्विवचन-सदृश है, किंतु आधुनिक हिन्दी में इस सृष्टि-वर्णन के लिए ‘आकाश’ स्वाभाविक और व्यापक है। ‘आकाश और पृथ्वी’ मिलकर समूची सृष्टि को व्यक्त करते हैं।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: אָרֶץ का अर्थ ‘देश/भूमि’ भी हो सकता है, पर ‘आकाश’ के साथ इस विश्वव्यापी युग्म में ‘पृथ्वी’ अभिप्रेत है।
theological_decisions:
- issue: आरम्भिक वाक्यांश की वाक्य-संरचना
  choice: 'आश्रित कालवाचक उपवाक्य: ‘आरम्भ में, जब परमेश्वर ने आकाश और पृथ्वी की सृष्टि की—’'
  alternative: 'स्वतंत्र पूर्ण वाक्य: ‘आरम्भ में परमेश्वर ने आकाश और पृथ्वी की सृष्टि की।’'
  rationale: निर्देशक उपपद से रहित בְּרֵאשִׁית, उसके तुरंत बाद सीमित क्रिया בָּרָא, और उत्पत्ति 2:4ख तथा होशे 1:2 जैसे समान आरम्भ आश्रित पाठ का समर्थन करते हैं। फिर भी परंपरागत स्वतंत्र-वाक्य पाठ प्राचीन और व्यापक है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘सृष्टि की’ धार्मिक रूप से परिचित है, पर यांत्रिकी को नहीं समझाता। दीर्घ विराम-चिह्न पद 1 की आश्रित संरचना और आगे जारी वाक्य को दर्शाता है।
