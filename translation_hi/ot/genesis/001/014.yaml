source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יְהִ֤י מְאֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הַבְדִּ֕יל בֵּ֥ין הַ/יּ֖וֹם וּ/בֵ֣ין הַ/לָּ֑יְלָה וְ/הָי֤וּ לְ/אֹתֹת֙ וּ/לְ/מ֣וֹעֲדִ֔ים וּ/לְ/יָמִ֖ים וְ/שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/014.yaml
  text: And God said[a], “Let there be lights in the expanse of the heavens to separate the day from the night, and let them be for signs and for appointed times[d][c][b], and for days and years.”
translation:
  language: hi
  text: और परमेश्वर ने कहा, “आकाश के फैलाव में ज्योतियाँ हों, जो दिन को रात से अलग करें; और वे चिह्नों, नियत समयों[a], तथा दिनों और वर्षों के लिए हों।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऋतुओं।” इब्रानी शब्द מוֹעֲדִים का अर्थ प्रायः नियत समय होता है और अन्य संदर्भों में इसमें पर्वों के नियत समय भी सम्मिलित हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֹרֹת
  choice: ज्योतियाँ
  rationale: यह संज्ञा प्रकाश देनेवाले पिंडों या प्रकाश-स्रोतों को दर्शाती है। ‘ज्योतियाँ’ गरिमापूर्ण, सुबोध और ‘प्रकाश’ से अधिक वस्तुवाचक है।
- source_word: רָקִיעַ הַשָּׁמַיִם
  choice: आकाश का फैलाव
  rationale: ‘फैलाव’ फैली हुई आकाशीय जगह का भाव रखता है और ऐसा ठोस गुंबद निर्दिष्ट नहीं करता जो मूल शब्द से अनिवार्यतः सिद्ध नहीं है।
- source_word: לְהַבְדִּיל בֵּין הַיּוֹם וּבֵין הַלַּיְלָה
  choice: दिन को रात से अलग करें
  rationale: यह उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है और उत्पत्ति 1 में बार-बार आनेवाले अलग करने के भाव को बनाए रखता है।
- source_word: לְאֹתֹת
  choice: चिह्नों के लिए
  rationale: ‘चिह्न’ शब्द का व्यापक अर्थ बनाए रखता है और खगोलीय पिंडों की भूमिका को किसी एक प्रकार के संकेत तक सीमित नहीं करता।
- source_word: לְמוֹעֲדִים
  choice: नियत समयों के लिए
  rationale: यह उन निर्धारित अवसरों या समयों का व्यापक भाव रखता है जिनमें ऋतुएँ और उत्सवी समय भी संदर्भानुसार सम्मिलित हो सकते हैं, पर यहाँ अर्थ को केवल उन्हीं तक सीमित नहीं करता।
- source_word: לְיָמִים וְשָׁנִים
  choice: दिनों और वर्षों के लिए
  rationale: यह मूल में दिए गए कालखंडों का सीधा और स्वाभाविक अनुवाद है।
- source_word: יְהִי ... וְהָיוּ
  choice: हों ... और वे ... हों
  rationale: यह ईश्वरीय आज्ञा की शैली तथा दूसरे खंड के प्रयोजनात्मक भाव को बनाए रखता है।
theological_decisions:
- issue: सृष्टि-वृत्तांत में מוֹעֲדִים का अर्थ
  choice: व्यापक अर्थ में ‘नियत समय’
  alternative: ‘ऋतुएँ’ या विशेष रूप से ‘पर्व’
  rationale: संदर्भ समय की वैश्विक व्यवस्था का है। ‘नियत समय’ बाद के पर्व-संबंधी प्रयोग की संभावित अनुगूँज को खुला रखता है, पर इस पद में अनावश्यक रूप से केवल धार्मिक पर्वों या केवल मौसमी ऋतुओं का अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘आकाश का फैलाव’ मूल रूपक को रखते हुए पुरातन या अत्यधिक तकनीकी शब्दावली से बचता है; वाक्य की आज्ञात्मक लय सृष्टि-वृत्तांत के अनुरूप रखी गई है।
