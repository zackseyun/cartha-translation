id: GEN.1.25
reference: Genesis 1:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֩ אֶת חַיַּ֨ת הָ/אָ֜רֶץ לְ/מִינָ֗/הּ וְ/אֶת הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/אֵ֛ת כָּל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/025.yaml
  text: And God made the beasts of the earth according to their kinds[a], and the livestock according to their kinds, and every creeping thing of the ground according to its kind[c][b]. And God saw that it was good.
translation:
  language: hi
  text: और परमेश्वर ने पृथ्वी के वन-पशुओं को अपनी-अपनी जाति के अनुसार, पालतू पशुओं को अपनी-अपनी जाति के अनुसार, और भूमि पर रेंगने वाले हर जीव को उसकी जाति के अनुसार बनाया। और परमेश्वर ने देखा कि यह अच्छा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: बनाया
  rationale: עשה का सामान्य अर्थ ‘बनाना/करना’ है; सृष्टि के इस प्रसंग में ‘बनाया’ सीधा और स्वाभाविक है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: उत्पत्ति 1 में यह संज्ञा एकवचन क्रिया के साथ एक सृष्टिकर्ता के लिए प्रयुक्त हुई है; ‘परमेश्वर’ मानक और गरिमापूर्ण हिन्दी रूप है।
- source_word: חַיַּת הָאָרֶץ
  choice: पृथ्वी के वन-पशु
  rationale: यह पद पालतू पशुओं से अलग स्थल पर रहने वाले जंगली पशुओं का वर्ग बताता है। ‘वन-पशु’ संक्षिप्त, स्वाभाविक और वर्गभेद को स्पष्ट रखने वाला रूप है।
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: उनकी जातियों के अनुसार / उसकी जाति के अनुसार
  rationale: מין यहाँ प्राणी-वर्ग या प्रकार को सूचित करता है। ‘जाति’ हिन्दी बाइबलीय संदर्भ में सुबोध है, पर इसे आधुनिक वैज्ञानिक ‘species’ के तकनीकी अर्थ में नहीं लेना चाहिए।
- source_word: הַבְּהֵמָה
  choice: पालतू पशु
  rationale: यहाँ בהמה वन-पशुओं से भिन्न, विशेषतः मनुष्य के अधीन रहने वाले बड़े पशुओं को सूचित करता है; ‘पालतू पशु’ ‘मवेशी’ की अपेक्षा अधिक व्यापक है।
- source_word: כָּל רֶמֶשׂ הָאֲדָמָה
  choice: भूमि पर रेंगने वाला हर जीव
  rationale: רמש भूमि के निकट चलने या रेंगने वाले छोटे जीवों को दर्शाता है। הָאֲדָמָה के लिए ‘भूमि’ चुनने से पहले आए הָאָרֶץ (‘पृथ्वी’) के साथ मूल का शब्दभेद बना रहता है।
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: और परमेश्वर ने देखा कि यह अच्छा था
  rationale: यह उत्पत्ति 1 का आवर्ती मूल्यांकन-वाक्य है; ‘यह अच्छा था’ हिन्दी में स्वाभाविक रूप से उसके आशय को व्यक्त करता है।
theological_decisions:
- issue: सृष्ट प्राणियों के वर्गों में आधुनिक वैज्ञानिक वर्गीकरण न आरोपित करना
  choice: जाति
  alternative: प्रजाति
  rationale: मूल का מין सामान्य प्रकार या वर्ग को दर्शाता है; ‘प्रजाति’ आधुनिक जैविक taxonomy का तकनीकी अर्थ अनावश्यक रूप से ला सकती है।
- issue: הָאָרֶץ और הָאֲדָמָה के बीच शब्दगत भेद
  choice: पृथ्वी … भूमि
  alternative: पृथ्वी … पृथ्वी
  rationale: दो अलग किन्तु संबंधित इब्रानी शब्दों को अलग हिन्दी शब्दों से व्यक्त करने पर मूल पाठ का सूक्ष्म भेद सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की आवर्ती संरचना मूल इब्रानी की लय और तीन प्राणी-वर्गों के भेद को बनाए रखती है।
