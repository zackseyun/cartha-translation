id: GEN.1.9
reference: Genesis 1:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יִקָּו֨וּ הַ/מַּ֜יִם מִ/תַּ֤חַת הַ/שָּׁמַ֨יִם֙ אֶל מָק֣וֹם אֶחָ֔ד וְ/תֵרָאֶ֖ה הַ/יַּבָּשָׁ֑ה וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/009.yaml
  text: And God said[a], “Let the waters under the heavens be gathered into one place, and let the dry land appear.” And it was so.
translation:
  language: hi
  text: फिर परमेश्वर ने कहा, “आकाश के नीचे का जल एक स्थान में इकट्ठा हो जाए और सूखी भूमि दिखाई दे।” और वैसा ही हो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: फिर ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘फिर’ स्वाभाविक रूप से घटनाक्रम व्यक्त करता है, बिना अनावश्यक सूक्ष्म कालक्रम जोड़े।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ एकवचन क्रिया के साथ यह एक सृष्टिकर्ता परमेश्वर को दर्शाता है; ‘परमेश्वर’ मानक, गरिमापूर्ण हिन्दी रूप है।
- source_word: יִקָּווּ
  choice: इकट्ठा हो जाए
  rationale: आज्ञार्थक इच्छा तथा जल के एकत्र होने के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמַּיִם
  choice: जल
  rationale: हिब्रू का रूप बहुवचन है, पर हिन्दी में ‘जल’ सामूहिक संज्ञा के रूप में अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: आकाश के नीचे का
  rationale: प्रसंग में जल की स्थिति बताता है। שָׁמַיִם के लिए यहाँ ‘आकाश’ दृश्य नभ/विस्तार के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל מָקוֹם אֶחָד
  choice: एक स्थान में
  rationale: एक ही स्थान की ओर एकत्रीकरण को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְתֵרָאֶה
  choice: और ... दिखाई दे
  rationale: निफ़अल आज्ञार्थक रूप दृश्य रूप से प्रकट होने की आज्ञा देता है; ‘दिखाई दे’ रूप और अर्थ दोनों को निकटता से रखता है।
- source_word: הַיַּבָּשָׁה
  choice: सूखी भूमि
  rationale: एकत्र जल से अलग होकर प्रकट हुए सूखे भूभाग के लिए स्पष्ट और प्रचलित हिन्दी अभिव्यक्ति।
- source_word: וַיְהִי כֵן
  choice: और वैसा ही हो गया
  rationale: परमेश्वर की आज्ञा पूरी होने का आवर्ती सूत्र स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: सृष्टि-वृत्तांत में שָׁמַיִם का अर्थ
  choice: आकाश
  alternative: स्वर्ग/आकाशमंडल
  rationale: इस पद में भौतिक जल के ‘नीचे’ स्थित होने के कारण दृश्य आकाश का अर्थ संदर्भानुकूल है। शब्द की व्यापक अर्थ-सीमा को किसी विस्तृत ब्रह्मांड-विज्ञान या स्वर्गलोक-संबंधी दावे में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘जल’ और ‘सूखी भूमि’ सृष्टि-वृत्तांत के औपचारिक स्वर को बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सहज है।
