  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לָ/אוֹר֙ י֔וֹם וְ/לַ/חֹ֖שֶׁךְ קָ֣רָא לָ֑יְלָה וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם אֶחָֽד׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/005.yaml
  text: And God called the light Day[a], and the darkness he called Night. And there was evening, and there was morning—the first day.
translation:
  language: hi
  text: और परमेश्वर ने उजियाले को “दिन” कहा, और अंधकार को “रात” कहा। और साँझ हुई और भोर हुई—एक दिन[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “दिन एक” है; क्रम के संदर्भ में इसे “पहला दिन” भी समझा जाता है।
    reason: हिब्रू cardinal אֶחָד के शाब्दिक रूप और क्रमगत, कार्यात्मक वैकल्पिक समझ—दोनों को बिना किसी एक को निश्चित किए दर्शाता है।
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: नाम रखा
  rationale: नामकरण के इस प्रसंग में קרא का स्वाभाविक हिन्दी रूप ‘नाम रखना’ है; यह केवल पुकारने की अपेक्षा आशय अधिक स्पष्ट करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यह बहुवचन-रूप संज्ञा यहाँ एकवचन क्रिया के साथ एक सृष्टिकर्ता के लिए प्रयुक्त है; ‘परमेश्वर’ मानक और गरिमापूर्ण हिन्दी रूप है।
- source_word: לָאוֹר
  choice: उजियाले का
  rationale: ל־ नामकरण-रचना का अंग है। हिन्दी में ‘उजियाले का नाम’ स्वाभाविक है; ‘उजियाला’ सामान्य पाठक के लिए सहज और प्रसंगानुकूल है।
- source_word: יוֹם
  choice: दिन
  rationale: यह उजियाले को दिया गया नाम है। उद्धरण-चिह्न नामकरण को स्पष्ट करते हैं; देवनागरी में बड़े अक्षर न होने के कारण उनका उपयोग उपयुक्त है।
- source_word: וְלַחֹשֶׁךְ
  choice: और अंधकार का
  rationale: समानांतर नामकरण-रचना को हिन्दी में संक्षेप और स्वाभाविक ढंग से बनाए रखता है।
- source_word: קָרָא לָיְלָה
  choice: नाम “रात” रखा
  rationale: दूसरे नामकरण को पहले के साथ साझा क्रिया-रचना में रखा गया है; इससे हिब्रू समानांतरता अर्थ सहित स्वाभाविक हिन्दी में आती है।
- source_word: וַיְהִי עֶרֶב
  choice: फिर साँझ हुई
  rationale: וַיְהִי के क्रमवाचक बल को ‘फिर’ व्यक्त करता है। עֶרֶב के लिए ‘साँझ’ सामान्य और सटीक है।
- source_word: וַיְהִי בֹקֶר
  choice: और भोर हुई
  rationale: दोहराई गई रचना को बनाए रखते हुए בֹקֶר का यहाँ स्वाभाविक हिन्दी रूप ‘भोर’ है।
- source_word: יוֹם אֶחָד
  choice: एक दिन
  rationale: हिब्रू में क्रमवाचक ‘पहला’ नहीं, बल्कि संख्या ‘एक’ है। ‘एक दिन’ वास्तविक शब्दरूप और उसकी सम्भावित अर्थगत खुलावट को सुरक्षित रखता है।
theological_decisions:
- issue: सृष्टि-दिवस के सूत्र के अंत में יוֹם אֶחָד का अनुवाद
  choice: एक दिन
  alternative: पहला दिन
  rationale: मूल में אֶחָד संख्या ‘एक’ है, ‘पहला’ नहीं। आगामी क्रम में इसका कार्य पहले दिन जैसा है, पर मुख्य पाठ में ‘एक दिन’ रखने से मूल की विशिष्ट अभिव्यक्ति और उससे जुड़ा अर्थगत तनाव बिना निर्णय थोपे सुरक्षित रहता है; प्रचलित वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली। ‘नाम रखा’ सहज हिन्दी नामकरण-वाक्य है। ‘उजियाला’, ‘साँझ’ और ‘भोर’ सामान्य पाठकों के लिए परिचित हैं। उद्धरण-चिह्न ‘दिन’ और ‘रात’ को दिए गए नामों के रूप में दिखाते हैं।
