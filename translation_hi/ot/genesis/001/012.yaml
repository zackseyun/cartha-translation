source:
  edition: WLC
  text: וַ/תּוֹצֵ֨א הָ/אָ֜רֶץ דֶּ֠שֶׁא עֵ֣שֶׂב מַזְרִ֤יעַ זֶ֨רַע֙ לְ/מִינֵ֔/הוּ וְ/עֵ֧ץ עֹֽשֶׂה פְּרִ֛י אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/012.yaml
  text: And the earth brought forth vegetation[a], plants yielding seed according to their kinds, and trees bearing fruit in which is their seed, according to their kinds[b]. And God saw that it was good.
translation:
  language: hi
  text: और पृथ्वी ने हरियाली उगाई—बीज देने वाले पौधे, अपनी-अपनी किस्म के अनुसार[a], और फल देने वाले वृक्ष, जिनमें बीज हो, अपनी-अपनी किस्म के अनुसार[b]। और परमेश्वर ने देखा कि यह अच्छा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी किस्म के अनुसार।” इब्रानी अभिव्यक्ति सृजित प्रकारों या वर्गों को दर्शाती है; यहाँ आधुनिक जैविकी का तकनीकी शब्द “प्रजाति” अभिप्रेत नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिनके फल में बीज हो।” इब्रानी में “जिसमें उसका बीज है” का संदर्भ संक्षिप्त है।
    reason: source_ambiguity
lexical_decisions:
- source_word: וַתּוֹצֵא
  choice: उगाई
  rationale: हिफ़ील क्रिया यहाँ पृथ्वी द्वारा वनस्पति को निकलने या उगने देने का भाव व्यक्त करती है। ‘उगाई’ आधुनिक हिन्दी में स्वाभाविक है और कारणवाचक अर्थ को बनाए रखती है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: उत्पत्ति 1 के विश्वव्यापी सृष्टि-वर्णन में ‘पृथ्वी’ उपयुक्त है; केवल किसी सीमित ‘भूमि’ का अर्थ यहाँ संकरा होगा।
- source_word: דֶּשֶׁא
  choice: हरियाली
  rationale: यह शब्द ताज़ी हरी वनस्पति का सामूहिक बोध देता है, केवल घास का नहीं। ‘हरियाली’ व्यापक अर्थ को सहज हिन्दी में व्यक्त करती है।
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: बीज देने वाले पौधे
  rationale: यह पद बीज उत्पन्न करने वाली वनस्पति को दर्शाता है। ‘पौधे’ और ‘बीज देने वाले’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक हैं।
- source_word: לְמִינֵהוּ
  choice: अपनी-अपनी किस्म के अनुसार
  rationale: מִין सृजित वर्ग या प्रकार को दर्शाता है। ‘किस्म’ आधुनिक जैविकी के तकनीकी ‘प्रजाति’ शब्द को आरोपित किए बिना वर्गगत अर्थ देता है।
- source_word: וְעֵץ עֹשֶׂה פְּרִי
  choice: और फल देने वाले वृक्ष
  rationale: एकवचन עֵץ यहाँ सामूहिक अर्थ में है। हिन्दी में बहुवचन ‘वृक्ष’ और ‘फल देने वाले’ इस भाव को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: जिनके फल में उनका बीज था
  rationale: वाक्यांश बताता है कि बीज फल में निहित था। हिन्दी में स्पष्टता के लिए ‘फल में’ कहा गया है, जबकि ‘उनका बीज’ वृक्षों के सामूहिक सन्दर्भ से मेल खाता है।
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: और परमेश्वर ने देखा कि यह अच्छा था
  rationale: यह उत्पत्ति 1 का बार-बार आने वाला मूल्यांकन-वाक्य है। यह अनुवाद उसके सरल और गरिमापूर्ण रूप को बनाए रखता है।
theological_decisions:
- issue: सृष्टि के वर्गों को आधुनिक जैविक वर्गीकरण बनाए बिना व्यक्त करना
  choice: अपनी-अपनी किस्म के अनुसार
  alternative: अपनी-अपनी प्रजाति के अनुसार
  rationale: इब्रानी מִין प्राचीन पाठ में प्रकार या वर्ग को दर्शाता है, आधुनिक विज्ञान के तकनीकी ‘species’ को नहीं। इसलिए ‘किस्म’ पाठ के दावे को न बढ़ाता है, न उसे किसी आधुनिक वैज्ञानिक या विवादात्मक ढाँचे में बाँधता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘हरियाली’ व्यापक वनस्पति-वर्ग को और ‘किस्म’ गैर-तकनीकी सृजित वर्ग को व्यक्त करता है। एम-डैश सूची का विस्तार स्पष्ट करता है, पर मूल पाठ के संबंधों को पुनर्व्याख्यायित नहीं करता।
