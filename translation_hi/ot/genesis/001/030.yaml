source:
  edition: WLC
  text: וּֽ/לְ/כָל חַיַּ֣ת הָ֠/אָרֶץ וּ/לְ/כָל ע֨וֹף הַ/שָּׁמַ֜יִם וּ/לְ/כֹ֣ל רוֹמֵ֣שׂ עַל הָ/אָ֗רֶץ אֲשֶׁר בּ/וֹ֙ נֶ֣פֶשׁ חַיָּ֔ה אֶת כָּל יֶ֥רֶק עֵ֖שֶׂב לְ/אָכְלָ֑ה וַֽ/יְהִי כֵֽן־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/030.yaml
  text: And to every beast of the earth[a], and to every bird of the heavens, and to everything that creeps on the earth in which there is a living creature, every green plant is for food[c][b]. And it was so.
translation:
  language: hi
  text: और धरती के हर जीव-जन्तु, आकाश के हर पक्षी और धरती पर रेंगनेवाले हर प्राणी को, जिसमें जीवित प्राणी है, सब हरी वनस्पति भोजन के लिए है। और ऐसा ही हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַיַּת הָאָרֶץ
  choice: धरती का हर जीव-जन्तु
  rationale: यह पदबंध स्थल-जीवों की श्रेणी को सूचित करता है। ‘जीव-जन्तु’ आधुनिक हिन्दी में स्वाभाविक है और ‘जंगली’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: עוֹף הַשָּׁמַיִם
  choice: आकाश का हर पक्षी
  rationale: यहाँ עוֹף के लिए ‘पक्षी’ सुस्पष्ट और स्वाभाविक है; שָׁמַיִם का प्रसंगानुकूल हिन्दी रूप ‘आकाश’ है।
- source_word: כֹל רוֹמֵשׂ עַל הָאָרֶץ
  choice: धरती पर रेंगनेवाला हर प्राणी
  rationale: רוֹמֵשׂ की ठोस गति-छवि को ‘रेंगनेवाला’ बनाए रखता है, जबकि ‘प्राणी’ हिन्दी वाक्य में श्रेणी को स्पष्ट करता है।
- source_word: אֲשֶׁר בּוֹ נֶפֶשׁ חַיָּה
  choice: जिसमें जीवित प्राण है
  rationale: यह नֶפֶשׁ חַיָּה को ‘जीवन की श्वास’ वाली भिन्न इब्रानी अभिव्यक्ति से नहीं मिलाता और जीवित प्राणी होने की धारणा को अपेक्षाकृत औपचारिक हिन्दी में सुरक्षित रखता है।
- source_word: אֵת כָּל יֶרֶק עֵשֶׂב
  choice: सब हरी वनस्पति
  rationale: दोनों शब्द मिलकर हरी पादप-वृद्धि या वनस्पति का बोध कराते हैं। ‘हरी वनस्पति’ संक्षिप्त, वर्तमान और प्रसंगानुकूल है।
- source_word: לְאָכְלָה
  choice: भोजन के लिए
  rationale: लामेद-युक्त रूप उद्देश्य या उपयोग बताता है; ‘भोजन के लिए’ इसका सहज हिन्दी रूप है।
- source_word: וַיְהִי כֵן
  choice: और ऐसा ही हुआ
  rationale: यह उत्पत्ति 1 का मानक सिद्धि-सूत्र है और हिन्दी में संक्षिप्त तथा गरिमापूर्ण है।
theological_decisions:
- issue: पशुओं के संदर्भ में נֶפֶשׁ חַיָּה का अनुवाद
  choice: जीवित प्राण
  alternative: जीवित प्राणी
  rationale: मूल पदबंध सजीव प्राणी/जीवित सत्ता को दर्शाता है, न कि उत्पत्ति 2:7 की ‘जीवन की श्वास’ वाली अलग अभिव्यक्ति को। ‘जीवित प्राण’ उपवाक्य ‘जिसमें ... है’ के साथ मूल की संरचना और उसके जीवन-संबंधी बल को बनाए रखता है, बिना पशु-आत्मा के विषय में अतिरिक्त सिद्धान्त जोड़े।
- issue: पिछले पद से क्रिया की पूर्ति
  choice: सब हरी वनस्पति भोजन के लिए है
  alternative: मैं सब हरी वनस्पति भोजन के लिए देता हूँ
  rationale: इस पद में ‘मैं देता हूँ’ क्रिया स्पष्ट रूप से नहीं दोहराई गई; हिन्दी में विधेय जोड़कर वाक्य पूरा किया गया है, पर वक्ता की क्रिया को मूल से अधिक स्पष्ट नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण बाइबलीय गद्य। समन्वयी पुनरावृत्ति को यथासंभव रखा गया है और ‘जीवन की श्वास’ से जानबूझकर बचा गया है, क्योंकि वह यहाँ के इब्रानी पदबंध से भिन्न अभिव्यक्ति है।
