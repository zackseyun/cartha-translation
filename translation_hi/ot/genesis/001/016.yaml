source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִ֔ים אֶת שְׁנֵ֥י הַ/מְּאֹרֹ֖ת הַ/גְּדֹלִ֑ים אֶת הַ/מָּא֤וֹר הַ/גָּדֹל֙ לְ/מֶמְשֶׁ֣לֶת הַ/יּ֔וֹם וְ/אֶת הַ/מָּא֤וֹר הַ/קָּטֹן֙ לְ/מֶמְשֶׁ֣לֶת הַ/לַּ֔יְלָה וְ/אֵ֖ת הַ/כּוֹכָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/016.yaml
  text: 'And God made the two great lights: the greater light to rule the day[a], and the lesser light to rule the night, and the stars.'
translation:
  language: hi
  text: 'और परमेश्वर ने दो बड़ी ज्योतियाँ बनाईं: दिन पर शासन करने के लिए बड़ी ज्योति, और रात पर शासन करने के लिए छोटी ज्योति, और तारे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: बनाईं
  rationale: עשה का सामान्य अर्थ ‘बनाना/करना’ है। यहाँ ‘बनाईं’ सहज है और ‘नियुक्त किया’ जैसा संदर्भ से निकाला गया अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: उत्पत्ति 1 में यह शब्द एकवचन क्रिया के साथ एक परमेश्वर को दर्शाता है; आधुनिक मानक हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים
  choice: दो बड़ी ज्योतियाँ
  rationale: מָאוֹר प्रकाश देने वाली वस्तु को सूचित करता है। ‘ज्योतियाँ’ मूल की ठोस संज्ञा तथा सूर्य और चन्द्रमा का नाम न लेने वाली शब्दावली, दोनों को बनाए रखता है।
- source_word: הַמָּאוֹר הַגָּדֹל
  choice: बड़ी ज्योति
  rationale: शाब्दिक अर्थ ‘बड़ी ज्योति’ है। अगली ‘छोटी ज्योति’ के साथ इसका तुलनात्मक विरोध हिन्दी में स्वाभाविक रूप से स्पष्ट है।
- source_word: לְמֶמְשֶׁלֶת הַיּוֹם
  choice: दिन पर शासन करने के लिए
  rationale: מֶמְשֶׁלֶת शासन या प्रभुत्व को व्यक्त करता है; यह रूप प्रयोजन और शासन के भाव को स्पष्ट तथा स्वाभाविक हिन्दी में रखता है।
- source_word: הַמָּאוֹר הַקָּטֹן
  choice: छोटी ज्योति
  rationale: קָטֹן का सीधा अर्थ ‘छोटा’ है और यह ‘बड़ी ज्योति’ के समानांतर सटीक बैठता है।
- source_word: לְמֶמְשֶׁלֶת הַלַּיְלָה
  choice: रात पर शासन करने के लिए
  rationale: पहले समान वाक्यांश के अनुरूप अनुवाद मूल की समांतर रचना बनाए रखता है।
- source_word: וְאֵת הַכּוֹכָבִים
  choice: और तारों को भी
  rationale: संयोजक וְ तथा कर्मचिह्न אֵת एक अतिरिक्त बनाई गई वस्तु जोड़ते हैं। ‘भी’ हिन्दी में इस संक्षिप्त परिशिष्ट का भाव स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: आकाशीय पिंडों के सामान्य नामों के स्थान पर वर्णनात्मक पद
  choice: ‘बड़ी ज्योति’ और ‘छोटी ज्योति’ को बनाए रखा गया।
  alternative: ‘सूर्य’ और ‘चन्द्रमा’
  rationale: इब्रानी पाठ सूर्य और चन्द्रमा के सामान्य नामों का प्रयोग नहीं करता, बल्कि מָאוֹר कहता है। मूल शब्दावली को बनाए रखना पाठ में न आए नामों को जोड़ने से बचाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ज्योति’ साहित्यिक होते हुए भी प्रचलित और प्रसंगानुकूल है। वाक्य की समांतरता स्पष्ट करने के लिए दीर्घ विराम-चिह्नों का प्रयोग किया गया है।
