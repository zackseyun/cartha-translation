id: GEN.1.28
reference: Genesis 1:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֹתָ/ם֮ אֱלֹהִים֒ וַ/יֹּ֨אמֶר לָ/הֶ֜ם אֱלֹהִ֗ים פְּר֥וּ וּ/רְב֛וּ וּ/מִלְא֥וּ אֶת הָ/אָ֖רֶץ וְ/כִבְשֻׁ֑/הָ וּ/רְד֞וּ בִּ/דְגַ֤ת הַ/יָּם֙ וּ/בְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/בְ/כָל חַיָּ֖ה הָֽ/רֹמֶ֥שֶׂת עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/028.yaml
  text: And God blessed them[a], and God said to them, “Be fruitful, and multiply, and fill the earth, and subdue it, and rule over the fish of the sea, and over the birds of the heavens[b], and over every living thing that moves on the earth.”
translation:
  language: hi
  text: परमेश्वर ने उन्हें आशीष दी और उनसे कहा, “फलो-फूलो, संख्या में बढ़ो, पृथ्वी को भर दो और उसे अपने अधीन कर लो; और समुद्र की मछलियों, आकाश के पक्षियों और पृथ्वी पर चलने-फिरनेवाले हर जीवित प्राणी[b] पर शासन करो[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर अधिकार रखो।”
    reason: lexical_alternative
  - marker: b
    text: या, “पृथ्वी पर रेंगनेवाले हर जीवित प्राणी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: आशीष दी
  rationale: पिएल रूप यहाँ प्रभावी रूप से आशीष प्रदान करने को व्यक्त करता है; ‘आशीष दी’ स्वाभाविक और धार्मिक संदर्भ में सुबोध है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: उत्पत्ति 1 में एकवचन क्रिया के साथ यह इस्राएल के एक परमेश्वर को सूचित करता है; आधुनिक हिन्दी बाइबलीय शैली में ‘परमेश्वर’ स्पष्ट और प्रतिष्ठित पद है।
- source_word: פְּרוּ
  choice: फलो-फूलो
  rationale: आज्ञा प्रजनन और सन्तानोत्पत्ति से सम्बन्धित है। ‘फलो-फूलो’ हिन्दी का स्वाभाविक और परिचित मुहावरा है; अगले वाक्यांश ‘संख्या में बढ़ो’ से इसका आशय स्पष्ट होता है।
- source_word: וּרְבוּ
  choice: संख्या में बढ़ो
  rationale: רבה यहाँ लोगों की संख्या बढ़ने को व्यक्त करता है। ‘संख्या में’ जोड़ने से आधुनिक हिन्दी में अर्थ स्पष्ट रहता है और इसे केवल समृद्धि समझे जाने की सम्भावना घटती है।
- source_word: וּמִלְאוּ
  choice: भर दो
  rationale: מלא का सीधा अर्थ भरना है; ‘पृथ्वी को भर दो’ मूल आज्ञा की शक्ति और व्यापकता बनाए रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: उत्पत्ति 1 के सार्वभौमिक सृष्टि-सन्दर्भ में यह किसी स्थानीय भूभाग के बजाय पूरी पृथ्वी को सूचित करता है।
- source_word: וְכִבְשֻׁהָ
  choice: उसे अपने अधीन कर लो
  rationale: כבש नियंत्रण में लाने या अधीन करने की प्रबल धारणा रखता है। यह रूप उस शक्ति को बनाए रखता है, पर मूल से परे शोषण का विचार नहीं जोड़ता।
- source_word: וּרְדוּ
  choice: पर शासन करो
  rationale: רדה अधिकारपूर्वक शासन करने को व्यक्त करता है। ‘पर शासन करो’ सामान्य आधुनिक हिन्दी में स्पष्ट है और इसे केवल देखभाल करने तक नरम नहीं करता।
- source_word: בִּדְגַת הַיָּם
  choice: समुद्र की मछलियों
  rationale: यह पद विशेष रूप से समुद्र की मछलियों का उल्लेख करता है, इसलिए व्यापक ‘समुद्री जीवों’ की अपेक्षा यह अधिक सटीक है।
- source_word: בְעוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षियों
  rationale: עוֹף उड़नेवाले जीवों के लिए व्यापक हो सकता है, पर इस सन्दर्भ में ‘पक्षी’ सबसे स्वाभाविक है; שָׁמַיִם के लिए यहाँ ‘आकाश’ सहज हिन्दी है।
- source_word: בְכָל חַיָּה
  choice: हर जीवित प्राणी
  rationale: חיה यहाँ व्यापक रूप से जीव या पशु को दर्शाता है; ‘हर जीवित प्राणी’ अर्थ को अनावश्यक रूप से जंगली पशुओं तक सीमित नहीं करता।
- source_word: הָרֹמֶשֶׂת
  choice: चलने-फिरनेवाले
  rationale: רמש भूमि पर गति करने को व्यक्त करता है और प्रायः छोटे या रेंगनेवाले जीवों के लिए आता है। ‘चलने-फिरनेवाले’ व्यापकता बनाए रखता है; अधिक संकीर्ण विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: כבש और רדה में सृष्टि के प्रति मानव अधिकार की शक्ति
  choice: ‘अपने अधीन कर लो’ और ‘पर शासन करो’ जैसे प्रबल अधिकारसूचक शब्द बनाए रखे गए।
  alternative: ‘उसकी देखभाल करो’ या ‘उसके भण्डारी बनो’
  rationale: इब्रानी क्रियाएँ केवल देखभाल से अधिक प्रबल हैं। अनुवाद न तो उन्हें शोषण का आदेश बनाता है, न केवल संरक्षण की भाषा में नरम करता है।
- issue: הָאָרֶץ का दायरा
  choice: ‘पृथ्वी’
  alternative: ‘भूमि’ या ‘देश’
  rationale: उत्पत्ति 1 के विश्वव्यापी सृष्टि-वर्णन में आदेश का क्षेत्र स्थानीय भूभाग नहीं, पूरी पृथ्वी है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सुबोध किन्तु गरिमापूर्ण रखी गई है। आज्ञार्थक क्रियाओं की श्रृंखला और मूल पाठ के प्रबल शासन-सूचक भाव को बनाए रखते हुए अनावश्यक पुरातन शब्दावली से बचा गया है। पादटिप्पणी-चिह्न अर्थ-संबंधित पदों के ठीक बाद रखे गए हैं।
