id: GEN.1.7
reference: Genesis 1:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֮ אֶת הָ/רָקִיעַ֒ וַ/יַּבְדֵּ֗ל בֵּ֤ין הַ/מַּ֨יִם֙ אֲשֶׁר֙ מִ/תַּ֣חַת לָ/רָקִ֔יעַ וּ/בֵ֣ין הַ/מַּ֔יִם אֲשֶׁ֖ר מֵ/עַ֣ל לָ/רָקִ֑יעַ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/007.yaml
  text: So God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse[a]. And it was so.
translation:
  language: hi
  text: तब परमेश्वर ने विस्तार[a] बनाया और विस्तार के नीचे के जल को विस्तार के ऊपर के जल से अलग किया। और ऐसा ही हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाश-मंडल’ (पारंपरिक); ‘गुंबद’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: बनाया
  rationale: עשה का सामान्य अर्थ ‘बनाना/करना’ है। सृष्टि के इस प्रसंग में ‘बनाया’ सीधा, स्वाभाविक और विशेष अर्थ थोपे बिना मूल के निकट है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: उत्पत्ति 1 में यह शब्द एकवचन क्रिया के साथ एकमात्र सृष्टिकर्ता को दर्शाता है; आधुनिक मानक हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: הָרָקִיעַ
  choice: विस्तार
  rationale: רָקִיעַ में फैली या विस्तृत वस्तु का भाव है। ‘विस्तार’ इस स्थानिक अर्थ को बनाए रखता है और उसकी बनावट या आकार के विषय में अनावश्यक रूप से कोई विशेष ब्रह्मांडीय व्याख्या निश्चित नहीं करता।
- source_word: וַיַּבְדֵּל
  choice: अलग किया
  rationale: בדל का अर्थ अलग करना या विभाजित करना है। ‘अलग किया’ सरल आधुनिक हिन्दी में सृष्टि-वर्णन की विभाजनकारी क्रिया को स्पष्ट रखता है।
- source_word: בֵּין ... וּבֵין
  choice: को ... से
  rationale: हिब्रू रचना दो समूहों के बीच भेद बताती है। हिन्दी में ‘एक को दूसरे से अलग किया’ इसका स्वाभाविक समानार्थी विन्यास है।
- source_word: הַמַּיִם
  choice: जल
  rationale: מים रूप की दृष्टि से बहुवचन है, पर प्रायः द्रव्यवाचक रूप में प्रयुक्त होता है। हिन्दी का ‘जल’ सामूहिक अर्थ और गरिमापूर्ण साहित्यिक शैली दोनों बनाए रखता है।
- source_word: אֲשֶׁר מִתַּחַת לָרָקִיעַ
  choice: विस्तार के नीचे के जल
  rationale: यह पदबंध स्पष्ट ऊर्ध्वाधर स्थिति बताता है; ‘नीचे’ इसके अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: אֲשֶׁר מֵעַל לָרָקִיעַ
  choice: विस्तार के ऊपर के जल
  rationale: ‘ऊपर’ मूल के स्थानिक विरोध को ‘नीचे’ के साथ स्पष्ट और संतुलित ढंग से व्यक्त करता है।
- source_word: וַיְהִי כֵן
  choice: और ऐसा ही हो गया
  rationale: यह उत्पत्ति 1 में परमेश्वर की आज्ञा की पूर्ति बताने वाला आवर्ती सूत्र है। ‘ऐसा ही हो गया’ उस परिणाम और साहित्यिक आवृत्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सृष्टि-वर्णन में רָקִיעַ का अनुवाद और उससे जुड़ी ब्रह्मांडीय धारणाएँ
  choice: विस्तार
  alternative: आकाश-मंडल; गुंबद
  rationale: ‘विस्तार’ मूल शब्द के फैलाव संबंधी बिंब को बनाए रखता है, जबकि ‘आकाश-मंडल’ पारंपरिक है और ‘गुंबद’ किसी विशिष्ट आकार को अधिक दृढ़ता से सूचित कर सकता है। मुख्य पाठ प्राचीन ब्रह्मांड-रचना के प्रश्न को मूल से अधिक निश्चित नहीं करता; विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘जल’ और ‘परमेश्वर’ बाइबलीय साहित्यिक गरिमा बनाए रखते हैं, जबकि वाक्य-विन्यास वर्तमान हिन्दी में सहज है।
