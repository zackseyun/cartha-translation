id: GEN.1.29
reference: Genesis 1:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים הִנֵּה֩ נָתַ֨תִּי לָ/כֶ֜ם אֶת כָּל עֵ֣שֶׂב זֹרֵ֣עַ זֶ֗רַע אֲשֶׁר֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֶת כָּל הָ/עֵ֛ץ אֲשֶׁר בּ֥/וֹ פְרִי עֵ֖ץ זֹרֵ֣עַ זָ֑רַע לָ/כֶ֥ם יִֽהְיֶ֖ה לְ/אָכְלָֽה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/029.yaml
  text: And God said[a], “Behold, I have given you every seed-bearing plant that is on the face of all the earth, and every tree in which is the fruit of a tree bearing seed[c][b]. It will be for you as food.”
translation:
  language: hi
  text: और परमेश्वर ने कहा, “देखो, मैंने तुम्हें हर बीज उत्पन्न करनेवाला पौधा, जो सारी पृथ्वी की सतह पर है, और हर वह पेड़ दिया है जिसके फल में बीज होता है। ये तुम्हारे भोजन के लिए होंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह आधुनिक और स्वाभाविक ध्यानाकर्षक शब्द है, जो हिब्रू अव्यय की ओर ध्यान खींचने की शक्ति बनाए रखता है।
- source_word: נָתַתִּי
  choice: मैंने ... दिया है
  rationale: हिब्रू पूर्ण क्रिया सृष्टि के प्रसंग में पूर्ण किए गए, किंतु वर्तमान महत्त्व रखनेवाले अनुदान को व्यक्त करती है।
- source_word: כָּל עֵשֶׂב זֹרֵעַ זֶרַע
  choice: हर बीजदार पौधा
  rationale: עֵשֶׂב व्यापक वनस्पति को सूचित करता है; ‘पौधा’ आधुनिक हिन्दी में ‘साग-पात’ या पाक-कला की ‘जड़ी-बूटी’ से अधिक स्पष्ट है। ‘बीजदार’ सहभागी पदबंध को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר עַל פְּנֵי כָל הָאָרֶץ
  choice: पृथ्वी भर की सतह पर उगनेवाला
  rationale: ‘पृथ्वी भर’ समग्रता और ‘सतह पर’ मूल स्थानवाचक बिंब को बनाए रखते हैं; ‘उगनेवाला’ हिन्दी में पौधे के साथ अपेक्षित अर्थ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: כָּל הָעֵץ
  choice: हर वह पेड़
  rationale: כָּל के साथ एकवचन संज्ञा का वितरणात्मक अर्थ हिन्दी के ‘हर’ से ठीक व्यक्त होता है; ‘वह’ आगामी संबंधवाचक उपवाक्य से स्वाभाविक जोड़ बनाता है।
- source_word: אֲשֶׁר בּוֹ פְרִי עֵץ זֹרֵעַ זָרַע
  choice: जिसके फल में बीज होता है
  rationale: यह हिब्रू की कुछ संकुचित संरचना को सहज हिन्दी में व्यक्त करता है और फल के भीतर बीज होने की बात स्पष्ट रखता है।
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: ये तुम्हारे भोजन के लिए होंगे
  rationale: ‘ये’ दोनों सामूहिक खाद्य-श्रेणियों की ओर संकेत करता है। हिन्दी में स्वाभाविक बहुवचन लगाया गया है, जबकि हिब्रू का एकवचन सामूहिक कर्ता के साथ आता है।
theological_decisions:
- issue: वनस्पति और वृक्षों का भोजन के रूप में दिया जाना
  choice: पद जितना कहता है उतना ही—पौधों और बीजवाले फलों को मनुष्यों के भोजन के लिए दिया गया—व्यक्त किया गया है।
  alternative: इसे सार्वकालिक आहार-विधान या अन्य भोजन के स्थायी निषेध के रूप में स्पष्ट करना।
  rationale: मूल पद ऐसा व्यापक धर्मवैधानिक निष्कर्ष स्पष्ट रूप से नहीं देता; अनुवाद को बाद की व्याख्यात्मक या सांप्रदायिक निष्पत्तियाँ नहीं जोड़नी चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘परमेश्वर’, ‘देखो’, ‘पृथ्वी भर की सतह’ और ‘भोजन’ बाइबलीय गरिमा बनाए रखते हैं; अत्यधिक संस्कृतनिष्ठ या पुरातन शब्दावली से बचा गया है।
