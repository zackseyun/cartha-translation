  yaml_path: translation/ot/genesis/001/023.yaml
  text: And there was evening[a], and there was morning—the fifth day.
translation:
  language: hi
  text: और साँझ हुई, और भोर हुई—पाँचवाँ दिन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: हुई
  rationale: यहाँ यह क्रिया सृष्टि-वर्णन के आवर्ती कथात्मक सूत्र का भाग है। ‘हुई’ सहज हिन्दी है और मूल की लय तथा पुनरावृत्ति बनाए रखती है; ‘हो गई’ अपेक्षाकृत अधिक परिणामसूचक लग सकता है।
- source_word: עֶרֶב
  choice: साँझ
  rationale: यह संज्ञा शाम या संध्या को दर्शाती है। ‘साँझ’ सामान्य, स्वाभाविक और गरिमापूर्ण हिन्दी है तथा आवर्ती सूत्र में संक्षिप्त रहती है।
- source_word: בֹקֶר
  choice: भोर
  rationale: यह संज्ञा सुबह को दर्शाती है। ‘भोर’ साँझ के साथ स्पष्ट कालगत समानांतर बनाती है और मूल की संक्षिप्त काव्यात्मक लय को बनाए रखती है।
- source_word: יוֹם
  choice: दिन
  rationale: यहाँ यह गिने हुए सृष्टि-दिन का नाम देता है। ‘दिन’ इसका सीधा हिन्दी समतुल्य है; इसमें अवधि के विषय में कोई अतिरिक्त व्याख्या नहीं जोड़ी गई।
- source_word: חֲמִישִׁי
  choice: पाँचवाँ
  rationale: यह क्रमवाचक विशेषण ‘दिन’ को विशेषित करता है। ‘पाँचवाँ’ इसका सटीक और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: सृष्टि-दिन के सूत्र का स्वरूप
  choice: ‘साँझ हुई, और भोर हुई—पाँचवाँ दिन’ के कालगत सूत्र और क्रमवाचक दिन को ज्यों का त्यों बनाए रखा गया है।
  alternative: इसे व्याख्यात्मक ढंग से अनिवार्यतः चौबीस घंटे का दिन या युग/दीर्घ काल बताना।
  rationale: इब्रानी पाठ साँझ-भोर का आवर्ती सूत्र और क्रमांकित दिन प्रस्तुत करता है, पर बाद की बहसों को अनुवाद में स्वयं निर्णीत नहीं करता। इसलिए अवधि या साहित्यिक स्वरूप के बारे में कोई सांप्रदायिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और आवर्ती सृष्टि-सूत्र के अनुकूल संक्षिप्त शैली। ‘साँझ’ और ‘भोर’ से मूल का समानांतर विन्यास तथा लय सुरक्षित रहती है।
