  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שְׁלִישִֽׁי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/013.yaml
  text: And there was evening[a], and there was morning—the third day.
translation:
  language: hi
  text: और साँझ हुई, और भोर हुई—तीसरा दिन।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और साँझ हुई और भोर हुई, दिन तीसरा।”'
    reason: मूल इब्रानी के शब्दक्रम और संयोजक संरचना का अधिक शाब्दिक विकल्प देना।
lexical_decisions:
- source_word: וַיְהִי
  choice: हुई
  rationale: यहाँ היה का वाव-क्रमिक रूप सृष्टि-वर्णन की आवर्ती कथा-शैली का अंग है। हिंदी में ‘हुई’ स्वाभाविक है और दोनों खंडों में इसकी पुनरावृत्ति इब्रानी लय को बनाए रखती है।
- source_word: עֶרֶב
  choice: साँझ
  rationale: यह शब्द शाम अथवा दिन ढलने के समय को दर्शाता है। ‘साँझ’ आधुनिक हिंदी में सहज, संक्षिप्त और इस काव्यात्मक आवर्तन के अनुकूल है।
- source_word: בֹּקֶר
  choice: भोर
  rationale: यह शब्द सुबह को दर्शाता है। ‘भोर’ साँझ के साथ स्वाभाविक समानांतर बनाता है और मूल की संक्षिप्त लय बनाए रखता है।
- source_word: יוֹם
  choice: दिन
  rationale: यहाँ यह सृष्टि-वर्णन के क्रमांकित दिन को सूचित करता है; ‘दिन’ इसका सीधा और संदर्भानुकूल अनुवाद है।
- source_word: שְׁלִישִׁי
  choice: तीसरा
  rationale: यह क्रमवाचक विशेषण सीधे ‘तीसरा’ अर्थ देता है और ‘दिन’ से संबंधित है।
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: और साँझ हुई, और भोर हुई
  rationale: दोनों उपवाक्यों में ‘और’ तथा ‘हुई’ बनाए रखने से इब्रानी की आवर्ती संरचना और कथात्मक लय सुरक्षित रहती है।
theological_decisions:
- issue: सृष्टि के दिनों की कालावधि या साहित्यिक भूमिका पर कोई विशेष व्याख्या आरोपित किए बिना आवर्तन का अनुवाद
  choice: और साँझ हुई, और भोर हुई—तीसरा दिन।
  alternative: और साँझ हुई और भोर हुई, दिन तीसरा।
  rationale: ‘तीसरा दिन’ יוֹם שְׁלִישִׁי का स्वाभाविक हिंदी रूप है। यह सृष्टि-वर्णन का क्रम स्पष्ट करता है, पर ‘दिन’ की अवधि अथवा साहित्यिक भूमिका से जुड़े बाद के मतभेदों का निर्णय अनुवाद में नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘साँझ’ और ‘भोर’ मूल के संक्षिप्त, लयात्मक आवर्तन को स्वाभाविक हिंदी में व्यक्त करते हैं।
