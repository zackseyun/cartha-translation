source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תּוֹצֵ֨א הָ/אָ֜רֶץ נֶ֤פֶשׁ חַיָּה֙ לְ/מִינָ֔/הּ בְּהֵמָ֥ה וָ/רֶ֛מֶשׂ וְ/חַֽיְתוֹ אֶ֖רֶץ לְ/מִינָ֑/הּ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/024.yaml
  text: 'And God said[a], “Let the earth bring forth living creatures according to their kinds: livestock, creeping things, and wild animals of the earth according to their kinds.” And it was so.'
translation:
  language: hi
  text: और परमेश्वर ने कहा, “पृथ्वी जीवित प्राणियों को उनकी जाति के अनुसार उत्पन्न करे—घरेलू पशु, भूमि पर रेंगनेवाले जीव और पृथ्वी के जंगली पशु, उनकी जाति के अनुसार।” और वैसा ही हो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹצֵא
  choice: उत्पन्न करे
  rationale: हिफ़ील आज्ञार्थक भाव में पृथ्वी को कर्ता बनाकर जीवों को सामने लाने या उत्पन्न करने की ईश्वरीय आज्ञा व्यक्त की गई है; यह हिंदी में स्वाभाविक रूप से उस कारक अर्थ को रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: सृष्टि-वृत्तांत में यह स्थलीय जगत को व्यापक रूप से दर्शाता है, इसलिए ‘भूमि’ की अपेक्षा ‘पृथ्वी’ उपयुक्त है।
- source_word: נֶפֶשׁ חַיָּה
  choice: जीवित प्राणियों
  rationale: यह पदबंध सजीव प्राणियों को दर्शाता है और आगे दी गई अनेक श्रेणियों के कारण हिंदी में बहुवचन स्वाभाविक है; ‘जीवित आत्माएँ’ अनावश्यक दार्शनिक या धर्मवैज्ञानिक अर्थ ला सकता है।
- source_word: לְמִינָהּ
  choice: उनकी जाति के अनुसार
  rationale: हिब्रू रूप एकवचन-सामूहिक है, पर पशु-श्रेणियों में वितरण का भाव है; हिंदी बहुवचन इस अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: בְּהֵמָה
  choice: घरेलू पशु
  rationale: यहाँ शब्द बड़े, विशेषतः पालतू या घरेलू स्थलीय पशुओं की श्रेणी को जंगली पशुओं से अलग करता है।
- source_word: רֶמֶשׂ
  choice: भूमि पर रेंगनेवाले जीव
  rationale: यह छोटे भूमि-गतिशील जीवों की व्यापक श्रेणी है; यह अनुवाद केवल सरीसृपों तक अर्थ को सीमित नहीं करता।
- source_word: חַיְתוֹ אֶרֶץ
  choice: पृथ्वी के जंगली पशु
  rationale: यह पदबंध घरेलू पशुओं से भिन्न वन्य स्थलीय पशुओं को दर्शाता है।
- source_word: וַיְהִי כֵן
  choice: और वैसा ही हो गया
  rationale: यह उत्पत्ति 1 का संक्षिप्त पूर्ति-सूत्र है और हिंदी में घटना की सिद्धि को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: נֶפֶשׁ को धर्मवैज्ञानिक रूप से भारित शब्द में प्रस्तुत करना या नहीं
  choice: जीवित प्राणी
  alternative: जीवित आत्माएँ / जीवित जीवधारी
  rationale: इस संदर्भ में पदबंध सामान्यतः प्राणवान सृष्टि को दर्शाता है, न कि पशुओं की आध्यात्मिक संरचना पर कोई पृथक सिद्धांत; ‘जीवित प्राणी’ स्रोत का आशय बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘घरेलू पशु’ और ‘जंगली पशु’ से मूल की श्रेणीगत भिन्नता स्पष्ट रखी गई है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि lexical ambiguity मुख्य पाठ में पर्याप्त रूप से व्यक्त है।
