source:
  edition: WLC
  text: וַ/יַּ֤רְא אֱלֹהִים֙ אֶת כָּל אֲשֶׁ֣ר עָשָׂ֔ה וְ/הִנֵּה ט֖וֹב מְאֹ֑ד וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם הַ/שִּׁשִּֽׁי־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/031.yaml
  text: And God saw all that he had made, and behold, it was very good. And there was evening and there was morning, the sixth day.
translation:
  language: hi
  text: और परमेश्वर ने वह सब देखा जो उसने बनाया था, और देखो, वह बहुत अच्छा था। और साँझ हुई और भोर हुई, छठा दिन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: ראה के कथात्मक रूप का सीधा और स्वाभाविक हिन्दी रूप ‘देखा’ है। प्रसंग में मूल्यांकन का भाव निहित है, पर अनुवाद उसे अतिरिक्त शब्दों से नहीं बढ़ाता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: उत्पत्ति 1 में यह संज्ञा एकवचन क्रिया के साथ एक सृष्टिकर्ता के लिए प्रयुक्त है; ‘परमेश्वर’ आधुनिक मानक हिन्दी में स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: כָּל אֲשֶׁר עָשָׂה
  choice: वह सब जो उसने बनाया था
  rationale: यह पूरी सृष्टि का समाहार करता है। ‘बनाया था’ परमेश्वर के देखने से पहले पूर्ण हो चुके कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה ध्यान आकर्षित करने और कथन को सजीव बनाने वाला अव्यय है। ‘देखो’ इसका आलंकारिक बल बनाए रखते हुए सामान्य आधुनिक पाठक के लिए स्पष्ट है।
- source_word: טוֹב מְאֹד
  choice: बहुत अच्छा
  rationale: טוֹב के व्यापक ‘अच्छा’ अर्थ और מְאֹד की तीव्रता को सीधे व्यक्त करता है, बिना अच्छाई को केवल नैतिक, सौंदर्यपरक या कार्यात्मक अर्थ तक सीमित किए।
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: फिर साँझ हुई और भोर हुई
  rationale: यह उत्पत्ति 1 की दिन-समापन सूत्रबद्ध अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है। ‘फिर’ कथात्मक अनुक्रम स्पष्ट करता है।
- source_word: יוֹם הַשִּׁשִּׁי
  choice: छठा दिन
  rationale: निश्चित क्रमवाचक पद का सीधा और स्वाभाविक हिन्दी रूप है। पूर्ववर्ती विराम के साथ यह दिन की पहचान करता है।
theological_decisions:
- issue: טוֹב מְאֹד में सृष्टि की अच्छाई का स्वरूप
  choice: बहुत अच्छा
  alternative: अत्यन्त अच्छा
  rationale: ‘बहुत अच्छा’ मूल के व्यापक सकारात्मक मूल्यांकन को बनाए रखता है और अच्छाई को किसी एक दार्शनिक या धर्मवैज्ञानिक श्रेणी में सीमित नहीं करता।
- issue: सृष्टि के दिनों पर विवाद को पूर्वनिर्धारित किए बिना दिन-सूत्र का अनुवाद
  choice: फिर साँझ हुई और भोर हुई—छठा दिन
  alternative: और साँझ हुई और भोर हुई, छठा दिन
  rationale: यह इब्रानी सूत्र के क्रम और छठे दिन की पहचान को सुरक्षित रखता है, पर दिन की अवधि या साहित्यिक भूमिका के बारे में कोई अतिरिक्त व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘और देखो’ मूल के ध्यानाकर्षक अव्यय का बल बचाता है; ‘साँझ’ और ‘भोर’ सामान्य तथा काव्यात्मक गरिमा वाले काल-सूचक शब्द हैं। किसी पाद-टिप्पणी की आवश्यकता नहीं है।
