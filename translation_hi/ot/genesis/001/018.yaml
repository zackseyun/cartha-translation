source:
  edition: WLC
  text: וְ/לִ/מְשֹׁל֙ בַּ/יּ֣וֹם וּ/בַ/לַּ֔יְלָה וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/018.yaml
  text: and to rule over the day and over the night[a], and to separate the light from the darkness. And God saw that it was good.
translation:
  language: hi
  text: और दिन और रात पर शासन करने तथा प्रकाश को अंधकार से अलग करने[a] के लिए। और परमेश्वर ने देखा कि यह अच्छा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रकाश और अंधकार के बीच भेद करने के लिए।”
    reason: बदल का अर्थ ‘अलग करने’ के साथ-साथ ‘भेद स्थापित करने’ भी हो सकता है; यह विकल्प उस अर्थ-छाया को सुरक्षित रखता है।
lexical_decisions:
- source_word: וְ/לִ/מְשֹׁל
  choice: और ... शासन करने के लिए
  rationale: למשל यहाँ पिछले पद में बताए गए ज्योतियों के उद्देश्य या कार्य को व्यक्त करता है। ‘शासन करने’ से उनके नियत संचालनकारी कार्य का भाव बना रहता है, पर उन्हें स्वतंत्र देवता नहीं माना जाता।
- source_word: בַּ/יּוֹם וּ/בַ/לַּיְלָה
  choice: दिन पर और रात पर
  rationale: दोनों संज्ञाओं के साथ आए בְּ और निश्चितता को समानांतर हिंदी संरचना में रखा गया है। ‘दिन पर और रात पर’ मूल के दोहरे विन्यास और शासन के कार्य-क्षेत्र को स्पष्ट करता है।
- source_word: וּֽ/לֲ/הַבְדִּיל
  choice: तथा ... अलग करने के लिए
  rationale: בדל उत्पत्ति 1 में परमेश्वर द्वारा स्थापित अलगाव या सीमा को दर्शाता है। ‘अलग करने’ से इसका ठोस मूल भाव स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: בֵּין הָ/אוֹר וּ/בֵין הַ/חֹשֶׁךְ
  choice: प्रकाश को अंधकार से
  rationale: हिंदी में ‘अलग करना’ के साथ ‘को ... से’ स्वाभाविक है और इब्रानी בין ... ובין का संबंध ठीक व्यक्त करता है। אור और חשך के लिए सामान्य आधुनिक शब्द ‘प्रकाश’ और ‘अंधकार’ चुने गए हैं।
- source_word: וַ/יַּרְא אֱלֹהִים
  choice: और परमेश्वर ने देखा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है। ‘और’ उत्पत्ति 1 की आवर्ती इब्रानी कथात्मक लय को बनाए रखता है।
- source_word: כִּי טוֹב
  choice: कि यह अच्छा था
  rationale: טוב यहाँ सृष्टि की भलाई, उपयुक्तता और सुव्यवस्था को समेटता है। ‘अच्छा’ इस व्यापक अर्थ और परिचित आवर्ती कथन दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: सृष्टि में आकाशीय ज्योतियों का कार्य
  choice: ज्योतियों को दिन और रात पर शासन करने तथा प्रकाश और अंधकार को अलग रखने का नियत कार्य दिया गया है।
  alternative: इसे इस प्रकार व्यक्त करना कि ज्योतियाँ स्वतंत्र या दैवी सत्ताओं की तरह प्रभुत्व करती हैं।
  rationale: मूल पाठ משל की शासन-संबंधी भाषा का प्रयोग करता है, इसलिए उसे दबाया नहीं गया; फिर भी प्रसंग में परमेश्वर ही नियुक्त करने और अच्छा ठहराने वाला सर्वोच्च कर्ता है। अनावश्यक पौराणिक या सांप्रदायिक अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण शैली रखी गई है। पद के आरंभिक ‘और’ तथा उद्देश्यसूचक खंड को पिछले पद से जुड़ी इब्रानी संरचना के अनुरूप बनाए रखा गया है। ‘प्रकाश’ और ‘अंधकार’ साधारण पाठक के लिए स्पष्ट हैं, जबकि ‘शासन करने’ से मूल की जानबूझकर प्रयुक्त कार्यात्मक भाषा बनी रहती है।
