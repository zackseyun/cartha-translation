base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/008.yaml
  text: And God called the expanse Heaven[a]. And there was evening[b], and there was morning—the second day.
translation:
  language: hi
  text: और परमेश्वर ने उस फैलाव का नाम आकाश[a] रखा। फिर साँझ हुई और फिर भोर हुई—दूसरा दिन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्ग” अथवा “आकाशमंडल।” इब्रानी שָׁמַיִם आकाश या स्वर्ग को सूचित कर सकता है; यहाँ यही नाम परमेश्वर उस फैलाव को देते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: नाम रखा
  rationale: कרא के साथ ל यहाँ नाम देने या नाम निर्धारित करने का भाव व्यक्त करता है; आधुनिक हिन्दी में “नाम रखा” इसे स्वाभाविक और स्पष्ट रूप से बताता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: उत्पत्ति 1 में यह रूप एकवचन क्रिया के साथ एक सृष्टिकर्ता के लिए प्रयुक्त है; “परमेश्वर” हिन्दी बाइबलीय शैली में प्रतिष्ठित और सुबोध है।
- source_word: לָרָקִיעַ
  choice: उस फैलाव
  rationale: רָקִיעַ किसी फैलाई या विस्तृत की गई वस्तु को सूचित करता है। “फैलाव” इस मूल भाव को रखता है और “गुम्बद” जैसी अधिक व्याख्यात्मक धारणा नहीं थोपता।
- source_word: שָׁמָיִם
  choice: आकाश
  rationale: यहाँ यह उस फैलाव को दिया गया नाम है। “आकाश” आधुनिक हिन्दी में दृश्य आकाश के लिए सहज है और “स्वर्ग” से उत्पन्न परमेश्वर के निवास-स्थान की संभावित गलत धारणा से बचाता है।
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: फिर साँझ हुई और फिर भोर हुई
  rationale: दोहराई गई हिब्रू कथा-रचना को हिन्दी में स्वाभाविक क्रम के साथ बनाए रखता है; “साँझ” और “भोर” सृष्टि-वृत्तांत की गरिमामय शैली के अनुकूल हैं।
- source_word: יוֹם שֵׁנִי
  choice: दूसरा दिन
  rationale: हिब्रू में निश्चित उपपद न होने पर भी यह दिनों के क्रम में क्रमवाचक नामांकन है; हिन्दी में “दूसरा दिन” स्वाभाविक है।
theological_decisions:
- issue: שָׁמַיִם को רָקִיעַ के दिए गए नाम के रूप में प्रस्तुत करना
  choice: आकाश
  alternative: स्वर्ग / आकाशमंडल
  rationale: “आकाश” नामकरण के आशय और दृश्य जगत के संदर्भ को स्पष्ट रखता है, बिना बाद की किसी विशिष्ट ब्रह्मांड-रचना या परमेश्वर के निवास-स्थान का अर्थ आरोपित किए। पाठ की अर्थ-सीमा बताने के लिए विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: 'आधुनिक मानक हिन्दी में सरल, गरिमामय कथात्मक शैली। “नाम रखा” नामकरण को स्पष्ट करता है; “फैलाव” मूल शब्द की फैलाए जाने की छवि बनाए रखता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान असंगत था: רָקִיעַ संबंधी टिप्पणी को [b] से जोड़ा गया था, पर मुख्य पाठ में [b] “evening” के बाद था। हिन्दी मसौदे में केवल वास्तविक रूप से आवश्यक שָׁמַיִם-विकल्प की टिप्पणी [a] रखी गई है।'
