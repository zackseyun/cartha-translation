base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/026.yaml
  text: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
translation:
  language: hi
  text: तब परमेश्वर ने कहा, “हम मनुष्य[a] को अपने स्वरूप में, अपनी समानता के अनुसार[b] बनाएँ; और वे समुद्र की मछलियों, आकाश के पक्षियों[c], पालतू पशुओं, सारी पृथ्वी और हर रेंगनेवाले जीव पर, जो पृथ्वी पर रेंगता है, शासन करें[d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानवजाति।” यहाँ हिब्रू आदाम जातिवाचक सामूहिक एकवचन है—मानवजाति को एक वर्ग के रूप में देखा गया है; इसलिए आगे बहुवचन में “वे ... शासन करें” आता है।
    reason: lexical_alternative
  - marker: b
    text: “हम ... बनाएँ” और “अपने स्वरूप” जैसे बहुवचन मूल हिब्रू के अनुसार रखे गए हैं। इनकी व्याख्या ईश्वरीय आत्म-विमर्श, स्वर्गीय सभा को सम्बोधन, अथवा—मसीही धर्मग्रन्थ के व्यापक परिप्रेक्ष्य में—बाद में प्रकट त्रिएकता के अनुरूप संकेत के रूप में की जाती रही है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से “आकाशों के पक्षियों।” इस प्रसंग में आशय आकाश में उड़नेवाले पक्षियों से है।
    reason: lexical_alternative
  - marker: d
    text: या “प्रभुत्व करें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में क्रिया एकवचन है और संकेत एक परमेश्वर की ओर है; हिन्दी बाइबलीय शैली में ‘परमेश्वर’ स्वाभाविक और प्रतिष्ठित पद है।
- source_word: נַעֲשֶׂה
  choice: हम ... बनाएँ
  rationale: प्रथम पुरुष बहुवचन के इच्छार्थक/विचारात्मक भाव को बनाए रखता है और बहुवचन का अर्थ व्याख्या द्वारा तय नहीं करता।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ शब्द जातिवाचक सामूहिक एकवचन है—मानवजाति को एक वर्ग के रूप में दर्शाता है—जबकि आगे की बहुवचन क्रिया ‘वे ... शासन करें’ उसके सामूहिक अर्थ को स्पष्ट करती है।
- source_word: בְּצַלְמֵנוּ
  choice: अपने स्वरूप में
  rationale: צלם प्रतिरूप, आकृति या प्रतिनिधित्व का बोध देता है; ‘स्वरूप में’ हिन्दी में गरिमापूर्ण और सीधा अनुवाद है।
- source_word: כִּדְמוּתֵנוּ
  choice: अपनी समानता के अनुसार
  rationale: כ + דמות अनुरूपता का अर्थ देता है; यह अनुवाद ‘स्वरूप’ और ‘समानता’ के बीच मूल पाठ का शब्दगत भेद बनाए रखता है।
- source_word: וְיִרְדּוּ
  choice: और वे ... पर शासन करें
  rationale: तृतीय पुरुष बहुवचन इच्छार्थक क्रिया को व्यक्त करता है और सामूहिक ‘मनुष्य’ से बहुवचन की ओर मूल पाठ के बदलाव को सुरक्षित रखता है।
- source_word: בִדְגַת הַיָּם
  choice: समुद्र की मछलियों पर
  rationale: यह हिब्रू संबंध-संरचना का स्वाभाविक हिन्दी रूप है।
- source_word: וּבְעוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षियों पर
  rationale: עוף के लिए ‘पक्षी’ सहज है; इस प्रसंग में השמים का दृश्य अर्थ ‘आकाश’ है।
- source_word: וּבַבְּהֵמָה
  choice: पालतू पशुओं पर
  rationale: בהמה यहाँ पालतू भू-पशुओं के वर्ग को सूचित करता है; ‘पालतू पशु’ ‘पशु’ से अधिक सटीक और ‘मवेशी’ से अधिक व्यापक है।
- source_word: וּבְכָל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: उत्पत्ति 1 में ארץ का क्षेत्र स्थानीय भूमि नहीं, सम्पूर्ण पृथ्वी है।
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ
  choice: रेंगनेवाले हर जीव पर
  rationale: रूपक पुनरावृत्ति का अर्थ स्वाभाविक हिन्दी में रखा गया है; ‘जीव’ स्पष्ट करता है कि संकेत भूमि के निकट चलनेवाले प्राणियों की ओर है।
theological_decisions:
- issue: ‘हम बनाएँ ... अपने स्वरूप ... अपनी समानता’ में बहुवचन
  choice: मुख्य पाठ में सभी बहुवचन रूप सुरक्षित रखे गए हैं और सम्बोधित जन की पहचान तय नहीं की गई।
  alternative: इसे ईश्वरीय आत्म-विमर्श, स्वर्गीय सभा को सम्बोधन, अथवा व्यापक मसीही धर्मग्रन्थीय पठन में त्रिएकता के अनुरूप संकेत के रूप में स्पष्ट करना।
  rationale: हिब्रू पाठ बहुवचन बोलता है, पर इस वाक्य में उसका आशय स्पष्ट नहीं करता। अनुवाद को उस वास्तविक अस्पष्टता और धर्मवैचारिक तनाव को बनाए रखना चाहिए।
- issue: אָדָם का सामूहिक अर्थ
  choice: ‘मनुष्य’ को जातिवाचक सामूहिक एकवचन के रूप में रखा गया और आगे ‘वे ... शासन करें’ से बहुवचन सुरक्षित रखा गया।
  alternative: ‘मानवजाति’ या ‘मानवता’ कहना।
  rationale: ‘मनुष्य’ प्रतिनिधिक एकवचन और आगे आनेवाले बहुवचन के बीच मूल पाठ का संबंध बनाए रखता है, जबकि टिप्पणी सामूहिक अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; शैली गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है। ‘परमेश्वर,’ ‘स्वरूप,’ और ‘शासन करें’ बाइबलीय गरिमा बनाए रखते हैं, जबकि वाक्यरचना आधुनिक है। सभी टिप्पणियों के चिह्न मुख्य पाठ में उपस्थित हैं।
