id: GEN.1.17
reference: Genesis 1:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן אֹתָ֛/ם אֱלֹהִ֖ים בִּ/רְקִ֣יעַ הַ/שָּׁמָ֑יִם לְ/הָאִ֖יר עַל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/017.yaml
  text: And God set them in the expanse of the heavens to give light on the earth[a].
translation:
  language: hi
  text: और परमेश्वर ने उन्हें आकाश के फैलाव में रखा, ताकि वे पृथ्वी पर प्रकाश दें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाशमण्डल में।’
    reason: רָקִיעַ के लिए प्रचलित वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: रखा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है; इस प्रसंग में खगोलीय ज्योतियों को उनके स्थान पर स्थापित करने के लिए ‘रखा’ स्वाभाविक और सटीक है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: यह कर्मवाचक सर्वनाम पिछले पद में उल्लिखित बड़ी और छोटी ज्योति तथा तारों की ओर संकेत करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: उत्पत्ति 1 में बहुवचन-रूप वाला यह संज्ञा-पद एकवचन क्रिया के साथ एक सृष्टिकर्ता के लिए प्रयुक्त हुआ है; ‘परमेश्वर’ मानक और गरिमापूर्ण हिन्दी रूप है।
- source_word: בִּרְקִיעַ
  choice: फैलाव में
  rationale: רָקִיעַ किसी फैली हुई विस्तृत जगह को सूचित करता है। ‘फैलाव’ स्रोत की स्थानिक छवि को बनाए रखता है और अनावश्यक आधुनिक वैज्ञानिक या कठोर ब्रह्माण्डीय व्याख्या नहीं जोड़ता।
- source_word: הַשָּׁמַיִם
  choice: आकाश के
  rationale: שָׁמַיִם का सामान्य हिन्दी सन्दर्भगत रूप ‘आकाश’ है; सम्बन्धसूचक रचना ‘आकाश के फैलाव’ मूल בִּרְקִיעַ הַשָּׁמַיִם को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: לְהָאִיר
  choice: ताकि वे ... प्रकाश दें
  rationale: אור का हिफ़ील रूप कारणवाचक है—केवल चमकना नहीं, बल्कि प्रकाश देना। उद्देश्यसूचक לְ को ‘ताकि’ से स्पष्ट किया गया है।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: עַל यहाँ उस स्थान को बताता है जिस पर प्रकाश पड़ता है; ‘पृथ्वी पर’ स्पष्ट और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: सृष्टि-वर्णन में רָקִיעַ का ब्रह्माण्डीय अर्थ
  choice: ‘फैलाव’
  alternative: ‘आकाशमण्डल’ या ‘गुम्बद’
  rationale: ‘फैलाव’ मूल शब्द के विस्तृत, फैले हुए क्षेत्र के अर्थ को सुरक्षित रखता है, पर न तो किसी विशिष्ट प्राचीन ठोस संरचना को निर्णायक बनाता है, न आधुनिक वैज्ञानिक धारणा को पाठ में आरोपित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘आकाश के फैलाव’ मूल इब्रानी सम्बन्धसूचक संरचना और उसकी प्राचीन स्थानिक छवि को यथासम्भव बनाए रखता है।
