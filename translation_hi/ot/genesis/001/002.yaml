  text: וְ/הָ/אָ֗רֶץ הָיְתָ֥ה תֹ֨הוּ֙ וָ/בֹ֔הוּ וְ/חֹ֖שֶׁךְ עַל פְּנֵ֣י תְה֑וֹם וְ/ר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/002.yaml
  text: And the earth was formless and empty[a], and darkness was over the surface of the deep, and the Spirit of God was hovering over the surface of the waters.
translation:
  language: hi
  text: और पृथ्वी आकारहीन और खाली थी, और अथाह जलराशि की सतह पर अंधकार था, और परमेश्वर की आत्मा[a] जल की सतह के ऊपर मंडरा रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर की ओर से आई हवा” अथवा “परमेश्वर की हवा” जल की सतह के ऊपर मंडरा रही थी।
    reason: וְרוּחַ אֱלֹהִים में רוּחַ का अर्थ ‘आत्मा’ या ‘हवा’ दोनों हो सकता है, और संबंधसूचक रचना स्रोत अथवा संबंध का भाव भी दे सकती है।
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: और पृथ्वी
  rationale: वाव के संयोजक कार्य को ‘और’ से स्पष्ट रखा गया है; הָאָרֶץ का सामान्य अर्थ यहाँ ‘पृथ्वी’ है।
- source_word: הָיְתָה
  choice: थी
  rationale: यहाँ क्रिया स्वाभाविक रूप से पृथ्वी की तत्कालीन अवस्था बताती है; ‘हो गई थी’ जैसा परिवर्तन-सूचक अर्थ प्रसंग द्वारा अपेक्षित नहीं है।
- source_word: תֹהוּ וָבֹהוּ
  choice: आकारहीन और सूनी
  rationale: यह युग्म अव्यवस्थित, अभी आकार न पाई हुई रिक्त दशा को व्यक्त करता है। यह चयन आधुनिक हिन्दी में सहज है और ‘निराकार’ से जुड़ सकने वाले दार्शनिक अर्थ से बचता है।
- source_word: וְחֹשֶׁךְ
  choice: और ... अंधकार था
  rationale: नामवाची उपवाक्य को स्वाभाविक हिन्दी वाक्य-विन्यास में प्रस्तुत किया गया है।
- source_word: עַל־פְּנֵי תְהוֹם
  choice: अथाह जल की सतह पर
  rationale: תְהוֹם आदिम अथाह जल-गहराई को सूचित करता है; ‘सतह पर’ עַל־פְּנֵי की स्थान-संबंधी छवि को सहज हिन्दी में बनाए रखता है।
- source_word: וְרוּחַ אֱלֹהִים
  choice: और परमेश्वर का आत्मा
  rationale: רוּחַ का अर्थ ‘आत्मा’, ‘हवा’ या ‘श्वास’ हो सकता है। मुख्य पाठ में प्राचीन और प्रबल ‘परमेश्वर का आत्मा’ पाठ रखा गया है, जबकि वास्तविक भाषाई अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: מְרַחֶפֶת
  choice: मंडरा रहा था
  rationale: कृदंत लगातार जारी गति दर्शाता है; ‘मंडरा रहा था’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמָּיִם
  choice: जल
  rationale: हिन्दी में ‘जल’ सामूहिक अर्थ में स्वाभाविक है और इस प्रसंग की विस्तृत जलराशि को व्यक्त करता है; अनावश्यक ‘जलों’ से बचा गया है।
theological_decisions:
- issue: הָיְתָה को अवस्था-सूचक ‘थी’ समझा जाए या परिवर्तन-सूचक ‘हो गई थी’
  choice: थी
  alternative: हो गई थी
  rationale: इब्रानी इस स्थान पर पृथ्वी की दशा का वर्णन स्वाभाविक रूप से करती है और परिवर्तन को आवश्यक नहीं ठहराती। ‘थी’ किसी पूर्व विनाश या अंतराल संबंधी धर्मवैज्ञानिक धारणा को पाठ में नहीं जोड़ता।
- issue: וְרוּחַ אֱלֹהִים से परमेश्वर का आत्मा अभिप्रेत है या परमेश्वर की ओर से आई हवा
  choice: परमेश्वर का आत्मा
  alternative: परमेश्वर की ओर से आई हवा; परमेश्वर की हवा
  rationale: इब्रानी पदबंध में दोनों अर्थ भाषाई रूप से संभव हैं। मुख्य पाठ में आत्मा वाला पाठ अपनाया गया है, पर पादटिप्पणी हवा वाले पाठों को देकर मूल अस्पष्टता और धर्मवैज्ञानिक तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य रखा गया है। वाक्य की क्रमिक ‘और’ संरचना इब्रानी कथन-प्रवाह को सुनाई देती है, जबकि शब्दावली सामान्य पाठक के लिए बोधगम्य है।
