id: GEN.1.6
reference: Genesis 1:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יְהִ֥י רָקִ֖יעַ בְּ/ת֣וֹךְ הַ/מָּ֑יִם וִ/יהִ֣י מַבְדִּ֔יל בֵּ֥ין מַ֖יִם לָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/006.yaml
  text: And God said[a], “Let there be an expanse in the midst of the waters[b], and let it separate water from water.”
translation:
  language: hi
  text: तब परमेश्वर ने कहा, “जल के बीच एक विस्तार[a] हो, और वह जल को जल से अलग करे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आकाशमंडल,” “मेहराब,” अथवा “गुंबद।” इब्रानी רָקִיעַ का संबंध किसी फैली हुई वस्तु या क्षेत्र से है; अनुवाद इस बात के अनुसार भिन्न होते हैं कि प्राचीन ब्रह्मांड-चित्र को कितनी स्पष्टता से व्यक्त किया जाए।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जल और जल के बीच अलग करने वाला हो,” अर्थात एक जलराशि को दूसरी से अलग करे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है। ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है, बिना समय-संबंध को अनावश्यक रूप से विशिष्ट बनाए।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: उत्पत्ति 1 में बहुवचन-रूप संज्ञा के साथ एकवचन क्रिया है और इसका संकेत एक सृष्टिकर्ता की ओर है। ‘परमेश्वर’ मानक, प्रतिष्ठित और सहज हिन्दी पद है।
- source_word: יְהִי
  choice: हो
  rationale: היה का यह आज्ञार्थक भाव ईश्वरीय सृजन-वचन व्यक्त करता है। हिन्दी में ‘हो’ संक्षिप्त और प्रभावशाली रूप से वही भाव देता है।
- source_word: רָקִיעַ
  choice: विस्तार
  rationale: यह शब्द किसी फैली या विस्तृत वस्तु/क्षेत्र का बोध कराता है। ‘विस्तार’ मूल बिंब को बनाए रखता है, पर मुख्य पाठ में किसी एक विशिष्ट प्राचीन ब्रह्मांडीय संरचना को निश्चित नहीं करता।
- source_word: בְּתוֹךְ הַמָּיִם
  choice: जल के बीच
  rationale: यह वाक्यांश आरम्भिक जलराशि के मध्य स्थिति बताता है। ‘जल के बीच’ आधुनिक हिन्दी में स्वाभाविक और मूल के निकट है।
- source_word: וִיהִי מַבְדִּיל
  choice: और वह ... अलग करे
  rationale: दूसरा आज्ञार्थक भाव उस विस्तार के कार्य को बताता है। ‘वह’ पिछले खंड के ‘विस्तार’ को स्पष्ट रूप से विषय बनाता है और ‘अलग करे’ हिफ़ील रूप के कारक अर्थ को व्यक्त करता है।
- source_word: בֵּין מַיִם לָמָיִם
  choice: जल को जल से
  rationale: मूल का शाब्दिक ढाँचा ‘जल और जल के बीच’ है। ‘अलग करे’ के साथ हिन्दी मुहावरे के अनुसार ‘जल को जल से’ दो जलराशियों के पृथक्करण को स्पष्ट करता है।
theological_decisions:
- issue: רָקִיעַ और प्राचीन ब्रह्मांड-कल्पना का संबंध
  choice: विस्तार
  alternative: आकाशमंडल, मेहराब या गुंबद
  rationale: पद जल के बीच बनाई गई एक पृथक्कारक संरचना या विस्तार का वर्णन करता है। ‘विस्तार’ शब्द के फैलाव-संबंधी बिंब को सुरक्षित रखता है, जबकि अधिक ठोस ब्रह्मांडीय व्याख्या को मुख्य पाठ में अनिवार्य नहीं बनाता। अन्य संभावित अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जल’ सृष्टि-वर्णन के काव्यात्मक-औपचारिक स्तर के अनुकूल है; ‘विस्तार’ पारंपरिक ‘आकाशमंडल’ की अपेक्षा अधिक सुलभ है और मूल शब्द की वास्तविक अर्थगत अनिश्चितता को खुला रखता है।
