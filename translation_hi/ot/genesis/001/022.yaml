source:
  edition: WLC
  text: וַ/יְבָ֧רֶךְ אֹתָ֛/ם אֱלֹהִ֖ים לֵ/אמֹ֑ר פְּר֣וּ וּ/רְב֗וּ וּ/מִלְא֤וּ אֶת הַ/מַּ֨יִם֙ בַּ/יַּמִּ֔ים וְ/הָ/ע֖וֹף יִ֥רֶב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/022.yaml
  text: And God blessed them[a], saying, “Be fruitful and multiply, and fill the waters in the seas, and let the birds multiply on the earth.”
translation:
  language: hi
  text: और परमेश्वर ने उन्हें आशीष दी और कहा, “फलो-फूलो और बहुत बढ़ो, और समुद्रों के जल में भर जाओ; और पृथ्वी पर पक्षी[a] बहुत बढ़ें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पक्षी’ के स्थान पर ‘उड़नेवाले जीव’ भी हो सकता है; इब्रानी शब्द עוֹף का अर्थ अधिक व्यापक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: आशीष दी
  rationale: पिएल रूप यहाँ परमेश्वर द्वारा आशीष प्रदान करने को व्यक्त करता है। यह स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: यह कर्मवाचक सर्वनाम पिछले पद में वर्णित समुद्री जीवों और पक्षियों की ओर संकेत करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: उत्पत्ति 1 में एकवचन क्रिया के साथ यह एक सृष्टिकर्ता परमेश्वर के लिए प्रयुक्त है; हिन्दी बाइबलीय शैली में ‘परमेश्वर’ स्पष्ट और प्रचलित है।
- source_word: לֵאמֹר
  choice: और कहा
  rationale: सीधे कथन का स्वाभाविक हिन्दी परिचय; इससे इब्रानी के ‘कहते हुए’ निर्माण का अर्थ स्पष्ट रूप से आता है।
- source_word: פְּרוּ
  choice: फलो-फूलो
  rationale: यह प्रजनन और फलवन्त होने का आशीषात्मक आदेश है। ‘फलो-फूलो’ वर्तमान हिन्दी में स्वाभाविक मुहावरा है और केवल संख्या-वृद्धि तक अर्थ को सीमित नहीं करता।
- source_word: וּרְבוּ
  choice: और बहुत बढ़ो
  rationale: रבה यहाँ संख्या में बढ़ने को दर्शाता है। ‘बहुत बढ़ो’ सहज हिन्दी में बहुलता का भाव रखता है।
- source_word: וּמִלְאוּ
  choice: और ... भर दो
  rationale: מלא का आदेशात्मक अर्थ ‘भरना’ है; ‘भर दो’ हिन्दी में प्रत्यक्ष आदेश को बनाए रखता है।
- source_word: אֶת הַמַּיִם בַּיַּמִּים
  choice: समुद्रों के जल को
  rationale: यह वाक्यांश ‘समुद्रों में स्थित जल’ को व्यक्त करता है और מַיִם तथा יַמִּים के सामूहिक/बहुवचन भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְהָעוֹף
  choice: और ... पक्षी
  rationale: इस संदर्भ में ‘पक्षी’ सबसे स्वाभाविक अर्थ है, यद्यपि עוֹף व्यापक रूप से उड़नेवाले जीवों को भी सूचित कर सकता है; इसलिए विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: יִרֶב
  choice: बहुत बढ़ें
  rationale: यह इच्छा/आज्ञा-सूचक रूप है। ‘बढ़ें’ साधारण भविष्यवाणी बनाने के बजाय आशीष में निहित इच्छात्मक-आदेशात्मक स्वर बनाए रखता है।
- source_word: בָּאָרֶץ
  choice: पृथ्वी पर
  rationale: यह पक्षियों की वृद्धि के स्थलीय क्षेत्र को दर्शाता है; ‘पृथ्वी पर’ उत्पत्ति 1 की व्यापक सृष्टि-भाषा के अनुकूल है।
theological_decisions:
- issue: आशीष के भीतर कथन का स्वरूप
  choice: 'पहली क्रियाओं को प्रत्यक्ष आदेश और अंतिम क्रिया को इच्छात्मक रूप में रखा गया है: ‘फलो-फूलो ... भर दो; ... बहुत बढ़ें।’'
  alternative: सभी क्रियाओं को सीधे आदेश बनाना, अथवा अंतिम खंड को साधारण भविष्यवाणी ‘पक्षी बढ़ेंगे’ के रूप में देना।
  rationale: इब्रानी में आशीष प्रत्यक्ष वाणी के भीतर आदेशात्मक और जुसिव/इच्छात्मक रूपों से व्यक्त होती है। अनुवाद इसे न केवल आदेश और न केवल भविष्यवाणी बनाता है, बल्कि दोनों के बीच का मूल तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय शैली अपनाई गई है। ‘फलो-फूलो’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘बहुत बढ़ो/बढ़ें’ संख्या-वृद्धि और आशीषात्मक स्वर दोनों को स्पष्ट करता है।
