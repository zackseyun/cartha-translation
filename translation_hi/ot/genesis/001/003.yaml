id: GEN.1.3
reference: Genesis 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֱלֹהִ֖ים יְהִ֣י א֑וֹר וַֽ/יְהִי אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/003.yaml
  text: And God said[a], “Let there be light,” and there was light.
translation:
  language: hi
  text: और परमेश्वर ने कहा[a], “उजियाला हो,” और उजियाला हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उजियाला हो जाए।” इब्रानी में प्रयुक्त इच्छासूचक रूप इच्छा अथवा आदेश व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: और ... ने कहा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है। ‘और ... ने कहा’ इब्रानी कथात्मक क्रम को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ बहुवचन-रूप संज्ञा एकवचन क्रिया के साथ आती है और एक सृष्टिकर्ता का उल्लेख करती है; आधुनिक मानक हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: יְהִי
  choice: हो
  rationale: היה का आज्ञार्थक इच्छासूचक रूप दैवी इच्छा अथवा प्रभावी आदेश व्यक्त करता है। ‘उजियाला हो’ संक्षिप्त, गरिमापूर्ण और हिन्दी में स्वाभाविक सृष्टि-वचन है।
- source_word: אוֹר
  choice: उजियाला
  rationale: मूल अर्थ ‘प्रकाश/उजियाला’ है। ‘उजियाला’ इस कथन में सहज और परिचित है तथा किसी विशेष प्रकाश-स्रोत या रूपक को नहीं जोड़ता।
- source_word: וַיְהִי
  choice: और ... हो गया
  rationale: היה का वय्यिक्तोल दैवी वचन के तत्काल परिणाम को बताता है। ‘हो गया’ सृजनात्मक परिणाम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אוֹר
  choice: उजियाला
  rationale: इब्रानी की पुनरावृत्ति बनाए रखने और आदेश की पूर्ति पर बल देने के लिए उसी संज्ञा को दोहराया गया है।
theological_decisions:
- issue: दैवी सृष्टि-आदेश का अनुवाद
  choice: उजियाला हो
  alternative: उजियाला हो जाए
  rationale: इब्रानी इच्छासूचक रूप दैवी इच्छा और प्रभावी आदेश दोनों को व्यक्त कर सकता है। मुख्य पाठ का ‘उजियाला हो’ उसकी संक्षिप्तता और गंभीरता बनाए रखता है; पादटिप्पणी वैकल्पिक इच्छासूचक अभिव्यक्ति बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और परिचित बाइबलीय शैली। ‘उजियाला’ को ‘प्रकाश’ पर इसलिए चुना गया है कि सृष्टि-वचन और उसकी पूर्ति दोनों में कथन सहज तथा स्मरणीय रहे; किसी सांप्रदायिक विशिष्टता को नहीं जोड़ा गया।
