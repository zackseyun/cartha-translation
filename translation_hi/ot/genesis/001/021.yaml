base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/021.yaml
  text: So God created the great sea creatures[a], and every living creature that moves, with which the waters swarmed, according to their kinds, and every winged bird according to its kind. And God saw that it was good.
translation:
  language: hi
  text: परमेश्वर ने बड़े-बड़े समुद्री जीवों[a] को, और हर उस जीवित प्राणी को जो चलता-फिरता है और जिनसे जल उनके-अपने प्रकार के अनुसार बहुतायत से भर गए थे, और हर पंखवाले पक्षी को उसके प्रकार के अनुसार सृजा। तब परमेश्वर ने देखा कि यह अच्छा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बड़े-बड़े समुद्री दैत्य’ अथवा ‘बड़े-बड़े अजगर।’ इब्रानी शब्द तन्नीनीम बड़े, सर्पाकार या विकराल जीवों के लिए प्रयुक्त हो सकता है; यहाँ जलीय प्रसंग ‘समुद्री जीवों’ के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרָא
  choice: बनाया
  rationale: यहाँ ברא परमेश्वर के सृजनात्मक कार्य को व्यक्त करता है। आधुनिक हिन्दी में ‘बनाया’ वाक्य को स्वाभाविक रखता है, जबकि प्रसंग स्पष्ट रूप से सृष्टि का है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया के साथ यह इस्राएल के एक परमेश्वर को सूचित करता है; ‘परमेश्वर’ मानक, गरिमापूर्ण हिन्दी रूप है।
- source_word: הַתַּנִּינִם הַגְּדֹלִים
  choice: बड़े-बड़े समुद्री जीवों
  rationale: תנינים बड़े, सर्पाकार या विकराल जीवों को सूचित कर सकता है। जलीय प्रसंग में ‘समुद्री जीव’ स्पष्ट और स्वाभाविक है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: כָּל נֶפֶשׁ הַחַיָּה
  choice: हर प्रकार के उन जीवित प्राणियों
  rationale: נפש חיה यहाँ प्राणवान जीवों का बोध कराता है, न कि बाद की दार्शनिक या धर्मवैज्ञानिक धारणा में ‘आत्मा’ का।
- source_word: הָרֹמֶשֶׂת
  choice: जो चलते-फिरते हैं
  rationale: רמש व्यापक रूप से गति करने या रेंगने का अर्थ दे सकता है; ‘चलते-फिरते’ अर्थ को केवल रेंगनेवाले जीवों तक सीमित नहीं करता।
- source_word: אֲשֶׁר שָׁרְצוּ הַמַּיִם
  choice: जिनसे जल भर गए
  rationale: שרץ बहुतायत से उमड़ने या भर जाने का भाव देता है। यह रूप उस प्रचुरता को सहज हिन्दी में व्यक्त करता है।
- source_word: לְמִינֵהֶם
  choice: हर प्रकार के
  rationale: מין सृष्टि के जीवों के वर्गीकरण को दर्शाता है; हिन्दी में ‘हर प्रकार के’ स्वाभाविक रूप से यही अर्थ देता है।
- source_word: כָּל עוֹף כָּנָף
  choice: हर प्रकार के पंखवाले पक्षियों
  rationale: עוף כנף उड़नेवाले, पंखयुक्त जीवों की श्रेणी है; ‘पंखवाले पक्षी’ संक्षिप्त और सहज है।
- source_word: לְמִינֵהוּ
  choice: हर प्रकार के
  rationale: एकवचन सामूहिक श्रेणी के अनुसार वर्गीकरण को हिन्दी में सहज ढंग से व्यक्त किया गया है।
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: परमेश्वर ने देखा कि यह अच्छा है
  rationale: उत्पत्ति 1 में बार-बार आने वाले मूल्यांकन-सूत्र को स्पष्ट और गरिमापूर्ण हिन्दी में रखा गया है।
