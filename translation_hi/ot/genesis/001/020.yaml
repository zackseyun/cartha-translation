id: GEN.1.20
reference: Genesis 1:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יִשְׁרְצ֣וּ הַ/מַּ֔יִם שֶׁ֖רֶץ נֶ֣פֶשׁ חַיָּ֑ה וְ/עוֹף֙ יְעוֹפֵ֣ף עַל הָ/אָ֔רֶץ עַל פְּנֵ֖י רְקִ֥יעַ הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/020.yaml
  text: And God said[a], “Let the waters swarm with swarms of living creatures[c][b], and let birds fly above the earth across the face of the expanse of the heavens.”
translation:
  language: hi
  text: तब परमेश्वर ने कहा, “जल जीवित प्राणियों के झुंडों से भर जाएँ,[a] और उड़नेवाले जीव[b] पृथ्वी के ऊपर, आकाश के विस्तार[c] के सामने से उड़ें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जल जीवित प्राणियों के झुंडों से उमड़ें।” इब्रानी में एक ही मूल की क्रिया और संज्ञा साथ आकर जीवन की बहुतायत पर बल देती हैं।
    reason: lexical_alternative
  - marker: b
    text: या “पक्षी।” इब्रानी शब्द का अर्थ अधिक व्यापक रूप से उड़नेवाले जीव भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “विस्तार” का अनुवाद “आकाशमंडल” या “गुंबद” भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा की प्रगति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘तब’ क्रम को दिखाता है, पर कारण का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: יִשְׁרְצוּ הַמַּיִם שֶׁרֶץ
  choice: जल ... के झुंडों से भर जाएँ
  rationale: क्रिया और सजातीय संज्ञा के द्वारा व्यक्त प्रचुर, उमड़ते जीवन को सहज हिन्दी में सुरक्षित रखता है; शाब्दिक पुनरुक्ति हिन्दी में अस्वाभाविक होती।
- source_word: נֶפֶשׁ חַיָּה
  choice: जीवित प्राणी
  rationale: यहाँ अर्थ सजीव प्राणियों का है; ‘जीवित आत्माएँ’ बाद की दार्शनिक या धर्मवैज्ञानिक धारणाएँ अनावश्यक रूप से ला सकता है।
- source_word: וְעוֹף
  choice: उड़नेवाले जीव
  rationale: עוֹף का अर्थ केवल आधुनिक वर्गीकरण के ‘पक्षियों’ तक सीमित नहीं होना चाहिए; व्यापक मूल अर्थ को बनाए रखता है।
- source_word: יְעוֹפֵף
  choice: उड़ें
  rationale: क्रिया की आज्ञार्थक/इच्छार्थक शक्ति और उड़ने की गति को सीधे व्यक्त करता है।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी के ऊपर
  rationale: उड़ान के संदर्भ में स्थान पृथ्वी से ऊपर है, न कि उसकी सतह पर।
- source_word: עַל פְּנֵי רְקִיעַ הַשָּׁמָיִם
  choice: आकाश के विस्तार के सामने
  rationale: 'עַל־פְּנֵי के ठोस स्थानिक चित्र को सुरक्षित रखता है: जीव पृथ्वी से दिखाई देने वाले विस्तार के सामने उड़ते हैं।'
- source_word: רְקִיעַ הַשָּׁמָיִם
  choice: आकाश का विस्तार
  rationale: रָקִיעַ की विस्तृत संरचना को बिना किसी विवादित ब्रह्मांडीय मॉडल को निश्चित किए व्यक्त करता है; ‘आकाश’ हिन्दी में הַשָּׁמַיִם का स्वाभाविक संदर्भ देता है।
theological_decisions:
- issue: सृष्टि-वर्णन में נֶפֶשׁ का अर्थ
  choice: जीवित प्राणी
  alternative: जीवित आत्माएँ
  rationale: वाक्यांश यहाँ प्राणवान जीवों को बताता है, आत्मा की प्रकृति के विषय में कोई तकनीकी धर्मवैज्ञानिक दावा नहीं करता।
- issue: רְקִיעַ का ब्रह्मांड-वर्णन
  choice: विस्तार
  alternative: गुंबद / आकाशमंडल
  rationale: मूल पद की स्थानिक छवि को रखता है, पर पाठ से अधिक निश्चित ठोस ब्रह्मांडीय संरचना आरोपित नहीं करता।
- issue: עוֹף का जैविक दायरा
  choice: उड़नेवाले जीव
  alternative: पक्षी
  rationale: मूल इब्रानी शब्द आधुनिक वैज्ञानिक वर्ग ‘पक्षी’ से व्यापक हो सकता है; व्यापक अनुवाद वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जल’ का बहुवचन क्रिया ‘जाएँ’ उत्पत्ति 1 के बहुवचनात्मक इब्रानी הַמַּיִם और हिन्दी बाइबलीय प्रयोग दोनों के अनुकूल है। पदचिह्न [a], [b], [c] संबंधित शब्दों के तुरंत बाद रखे गए हैं।
