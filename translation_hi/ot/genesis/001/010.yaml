id: GEN.1.10
reference: Genesis 1:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לַ/יַּבָּשָׁה֙ אֶ֔רֶץ וּ/לְ/מִקְוֵ֥ה הַ/מַּ֖יִם קָרָ֣א יַמִּ֑ים וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/010.yaml
  text: And God called the dry land Earth[a], and the gathering of the waters he called Seas. And God saw that it was good.
translation:
  language: hi
  text: और परमेश्वर ने सूखी भूमि को ‘धरती’ कहा, और जल के जमाव को ‘समुद्रों’ कहा। और परमेश्वर ने देखा कि यह अच्छा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  choice: कहा
  rationale: यहाँ क्रिया नाम रखने या किसी नाम से पुकारने का भाव देती है। ‘कहा’ नामकरण-सूत्र की पुनरावृत्ति को बनाए रखता है और हिंदी में स्वाभाविक है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: उत्पत्ति 1 में यह बहुवचन-रूप संज्ञा एकवचन क्रियाओं के साथ एक सृष्टिकर्ता के लिए प्रयुक्त है; ‘परमेश्वर’ आधुनिक हिंदी बाइबलीय भाषा में स्पष्ट और गरिमापूर्ण समतुल्य है।
- source_word: לַיַּבָּשָׁה
  choice: सूखी भूमि
  rationale: यह शब्द एकत्र जल के विपरीत प्रकट हुई शुष्क भूमि को दर्शाता है; ‘सूखी भूमि’ अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: אֶרֶץ
  choice: ‘धरती’
  rationale: नामकरण के इस प्रसंग में शब्द सूखी भूमि को दिए गए नाम के रूप में कार्य करता है। देवनागरी में बड़े अक्षर न होने के कारण उद्धरण-चिह्न नामकरण को दिखाते हैं; ‘धरती’ मूल शब्द के भूमि/पृथ्वी अर्थ-विस्तार को बनाए रखता है।
- source_word: מִקְוֵה הַמַּיִם
  choice: इकट्ठा हुआ जल
  rationale: यह पद जल के संकलित समूह या जमाव को दर्शाता है। हिंदी में ‘इकट्ठा हुआ जल’ स्वाभाविक है और निकटवर्ती प्रसंग में जल के एक स्थान पर एकत्र होने से जुड़ता है।
- source_word: יַמִּים
  choice: ‘समुद्र’
  rationale: हिब्रू रूप बहुवचन है और एकत्र जलराशियों को सूचित करता है। हिंदी में वर्ग या सामूहिक नाम के रूप में ‘समुद्र’ अधिक स्वाभाविक है; उद्धरण-चिह्न इसके नाम होने को स्पष्ट करते हैं।
- source_word: וַיַּרְא
  choice: देखा
  rationale: यह उत्पत्ति 1 में बार-बार आने वाले मूल्यांकन-सूत्र का सामान्य और सीधा अनुवाद है।
- source_word: כִּי טוֹב
  choice: कि यह अच्छा था
  rationale: ‘अच्छा’ טוֹב की व्यापक अर्थवत्ता को बनाए रखता है और उसे केवल सुंदरता, उपयोगिता या प्रसन्नता तक सीमित नहीं करता।
theological_decisions:
- issue: אֶרֶץ को सामान्य संज्ञा माना जाए या नामकरण-सूत्र में दिए गए नाम के रूप में प्रस्तुत किया जाए
  choice: नामकरण का भाव दिखाने के लिए ‘धरती’ को उद्धरण-चिह्नों में रखा गया है
  alternative: सामान्य संज्ञा के रूप में ‘भूमि’ या बिना उद्धरण-चिह्न ‘धरती’
  rationale: परमेश्वर यहाँ सूखी भूमि का स्पष्ट रूप से नाम रखते हैं। हिंदी में बड़े अक्षरों का भेद नहीं होता, इसलिए उद्धरण-चिह्न साहित्यिक नामकरण को संकेत करते हैं, बिना किसी आधुनिक वैज्ञानिक अवधारणा को पाठ में आरोपित किए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामकरण-सूत्र की समानांतर संरचना और अंतिम मूल्यांकन-सूत्र को सुरक्षित रखा गया है।
