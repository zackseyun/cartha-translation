  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हमें क्या लाभ होगा’ यहूदा की व्यावहारिक गणना को व्यक्त करता है, जबकि पादटिप्पणी मूल इब्रानी के ठोस ‘खून ढकने’ वाले बिंब को सुरक्षित रखती है।
