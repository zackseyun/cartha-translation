  text: וַ/יֹּ֥אמֶר יְהוּדָ֖ה אֶל אֶחָ֑י/ו מַה בֶּ֗צַע כִּ֤י נַהֲרֹג֙ אֶת אָחִ֔י/נוּ וְ/כִסִּ֖ינוּ אֶת דָּמֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/026.yaml
  text: Then Judah said to his brothers[a], “What profit is there if we kill our brother and cover up his blood?”
translation:
  language: hi
  text: तब यहूदा ने अपने भाइयों से कहा, “यदि हम अपने भाई को मार डालें और उसका खून छिपाएँ, तो हमें क्या लाभ होगा?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि हम अपने भाई को मार डालें और उसका खून ढक दें, तो हमें क्या लाभ होगा?” इब्रानी में “उसका खून ढकना” रक्तपात या उसके लिए अपनी दोषिता छिपाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: इस व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: אֶל אֶחָיו
  choice: अपने भाइयों से
  rationale: पुल्लिंग बहुवचन यहाँ उपस्थित यूसुफ के पुरुष सहोदरों को सूचित करता है; ‘भाइयों’ सटीक और स्वाभाविक है।
- source_word: מַה בֶּצַע
  choice: हमें क्या लाभ होगा
  rationale: בֶּצַע लाभ या स्वार्थपूर्ण प्राप्ति को सूचित करता है। हिन्दी में यह प्रश्न की व्यावहारिक और स्वार्थपरक धार को स्पष्ट रखते हुए स्वाभाविक है।
- source_word: כִּי
  choice: यदि
  rationale: यहाँ כִּי आलंकारिक प्रश्न की परिस्थिति प्रस्तुत करता है; हिन्दी में ‘यदि’ उपयुक्त है।
- source_word: נַהֲרֹג
  choice: हम ... मार डालें
  rationale: प्रथम पुरुष बहुवचन अपूर्ण क्रिया को शर्तसूचक हिन्दी वाक्य में ‘मार डालें’ स्वाभाविक और अर्थसटीक रूप से व्यक्त करता है।
- source_word: אָחִינוּ
  choice: अपने भाई को
  rationale: प्रत्यक्ष पारिवारिक संबोधन पंक्ति के नैतिक तनाव का केंद्र है; हिन्दी में कर्ता-सापेक्ष ‘अपने’ स्वाभाविक है।
- source_word: וְכִסִּינוּ אֶת דָּמוֹ
  choice: और उसका खून छिपाएँ
  rationale: शाब्दिक बिंब ‘उसका खून ढकें’ है, पर यह रक्तपात अथवा उसके अपराध को छिपाने का मुहावरा है। ‘खून छिपाएँ’ मूल बिंब और आशय दोनों को समझने योग्य हिन्दी में रखता है।
