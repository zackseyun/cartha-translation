reference: Genesis 37:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ נָסְע֣וּ מִ/זֶּ֔ה כִּ֤י שָׁמַ֨עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָ/ה וַ/יֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔י/ו וַ/יִּמְצָאֵ֖/ם בְּ/דֹתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/017.yaml
  text: The man said[a], “They have moved on from here, because I heard them saying[b], ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.
translation:
  language: hi
  text: उस आदमी ने कहा, “वे यहाँ से चले गए हैं, क्योंकि मैंने उन्हें कहते सुना[b], ‘चलो, दोतान[a] चलें।’” तब यूसुफ़ अपने भाइयों के पीछे गया और उसने उन्हें दोतान में पाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में स्थान-नाम ‘दोतान’ के साथ दिशा बताने वाला प्रत्यय लगा है; शाब्दिक भाव है, “दोतान की ओर।”
    reason: cultural_note
  - marker: b
    text: या, “मैंने उन्हें यह कहते हुए सुना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסְעוּ מִזֶּה
  choice: वे यहाँ से आगे निकल गए हैं
  rationale: נסע प्रायः किसी स्थान से पड़ाव उठाकर आगे बढ़ने को दर्शाता है। यह हिंदी अभिव्यक्ति प्रस्थान और आगे बढ़ने—दोनों भावों को स्वाभाविक रूप से व्यक्त करती है, बिना अनावश्यक रूप से डेरे का उल्लेख जोड़े।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי उस आदमी के कथन का कारण बताता है; इसलिए कारणवाचक ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: שָׁמַעְתִּי אֹמְרִים
  choice: मैंने उन्हें कहते सुना
  rationale: שָׁמַעְתִּי के साथ बहुवचन कृदंत אֹמְרִים सुनाई देती हुई वाणी को व्यक्त करता है। संदर्भ से ‘उन्हें’ यूसुफ़ के भाइयों की ओर संकेत करता है।
- source_word: נֵלְכָה
  choice: चलो ... चलें
  rationale: प्रथम पुरुष बहुवचन cohortative सामूहिक प्रस्ताव या आत्म-प्रेरणा व्यक्त करता है। आधुनिक हिंदी में ‘चलो ... चलें’ इसी भाव को सहजता से रखता है।
- source_word: דֹּתָיְנָה
  choice: दोतान चलें
  rationale: स्थान-नाम पर लगा दिशासूचक प्रत्यय दोतान की ओर गति बताता है। हिंदी में गंतव्य के साथ ‘दोतान चलें’ स्वाभाविक है।
- source_word: אַחַר אֶחָיו
  choice: अपने भाइयों के पीछे
  rationale: אַחַר यहाँ किसी के पीछे जाने या उसका अनुसरण करने का अर्थ देता है। यह अनुवाद मूल की सरलता बनाए रखता है और ‘पीछा करने’ जैसी शत्रुतापूर्ण छाया नहीं जोड़ता।
- source_word: וַיִּמְצָאֵם בְּדֹתָן
  choice: उसने उन्हें दोतान में पाया
  rationale: מצא का सामान्य कथात्मक अर्थ ‘पाना’ है, और בְּ स्थान को दर्शाता है। ‘दोतान में’ आधुनिक हिंदी में नगर के भीतर उनकी स्थिति को स्वाभाविक रूप से बताता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में ‘चलो ... चलें’ बोलचाल की स्वाभाविकता देता है, जबकि कथात्मक वाक्य संरचना मूल की क्रमिक गति को बनाए रखती है। ‘यूसुफ़’ और ‘दोतान’ प्रचलित हिंदी बाइबलीय लिप्यंतरण के अनुरूप हैं।
