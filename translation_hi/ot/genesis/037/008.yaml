  text: וַ/יֹּ֤אמְרוּ ל/וֹ֙ אֶחָ֔י/ו הֲ/מָלֹ֤ךְ תִּמְלֹךְ֙ עָלֵ֔י/נוּ אִם מָשׁ֥וֹל תִּמְשֹׁ֖ל בָּ֑/נוּ וַ/יּוֹסִ֤פוּ עוֹד֙ שְׂנֹ֣א אֹת֔/וֹ עַל חֲלֹמֹתָ֖י/ו וְ/עַל דְּבָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/008.yaml
  text: His brothers said to him, “Will you really reign over us? Will you really rule over us?” So they hated him even more because of his dreams and because of his words.
translation:
  language: hi
  text: उसके भाइयों ने उससे कहा, “क्या तू सचमुच हम पर राज करेगा? क्या तू सचमुच हम पर शासन करेगा?” इसलिए वे उसके सपनों और उसकी बातों के कारण उससे और भी अधिक घृणा करने लगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמָלֹךְ תִּמְלֹךְ
  choice: क्या तू सचमुच ... राजा बनेगा?
  rationale: एक ही धातु की पुनरुक्ति प्रश्न को तीखा और अविश्वासपूर्ण बनाती है; ‘सचमुच’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है। ‘राजा बनेगा’ यहाँ राज करने के दावे का सामान्य और स्पष्ट रूप है।
- source_word: מָשׁוֹל תִּמְשֹׁל
  choice: क्या तू सचमुच ... शासन करेगा?
  rationale: दूसरी धातु की पुनरुक्ति का बल भी ‘सचमुच’ से रखा गया है, जबकि ‘शासन करेगा’ पहले प्रश्न से अर्थगत भेद बनाए रखता है।
- source_word: עַל חֲלֹמֹתָיו וְעַל דְּבָרָיו
  choice: उसके सपनों और उसकी बातों के कारण
  rationale: עַל यहाँ घृणा का कारण बताता है। ‘बातों’ बहुवचन को बनाए रखता है और उसके द्वारा सपनों का वर्णन करने की ओर संकेत करता है।
theological_decisions:
- issue: यूसुफ के भावी अधिकार के विषय में भाइयों के प्रश्नों का स्वर
  choice: दोनों प्रश्नों को अविश्वास और उपहासपूर्ण तीव्रता के साथ रखा गया है
  alternative: इन्हें भावी राज्य की निष्पक्ष भविष्यवाणी के रूप में प्रस्तुत करना
  rationale: प्रश्नवाचक הֲ और धातु की पुनरुक्ति संदर्भ में भाइयों की तीखी अस्वीकृति व्यक्त करते हैं; पाठ अभी यह नहीं बताता कि वे सपनों की पूर्ति को स्वीकार करते थे।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। पारिवारिक संवाद में एकवचन ‘तू’ निकट संबंध और तिरस्कारपूर्ण स्वर दोनों को स्वाभाविक रूप से व्यक्त करता है।
