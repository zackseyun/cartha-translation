id: GEN.37.29
reference: Genesis 37:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֤שָׁב רְאוּבֵן֙ אֶל הַ/בּ֔וֹר וְ/הִנֵּ֥ה אֵין יוֹסֵ֖ף בַּ/בּ֑וֹר וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/029.yaml
  text: When Reuben returned to the pit[a], behold, Joseph was not in the pit[b], and he tore his clothes.
translation:
  language: hi
  text: जब रूबेन उस गड्ढे[a] के पास लौटा, तो देखा कि यूसुफ गड्ढे में नहीं था। तब उसने अपने कपड़े फाड़े।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जलकुंड”; इब्रानी शब्द बोर का अर्थ गड्ढा या पानी जमा करने का कुंड हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अपने कपड़े फाड़ना शोक, सदमे या गहरी व्याकुलता व्यक्त करने की प्रथा थी।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौटा
  rationale: שׁוב का यह कथात्मक रूप पहले के स्थान पर वापस आने को व्यक्त करता है; ‘लौटा’ स्वाभाविक और सटीक हिन्दी है।
- source_word: הַבּוֹר / בַּבּוֹר
  choice: गड्ढा / गड्ढे में
  rationale: בּוֹר का अर्थ गड्ढा या जलकुंड हो सकता है। इस प्रसंग में ‘गड्ढा’ सामान्य पाठक के लिए सहज है और उस स्थान के रूप में उपयुक्त है जिसमें यूसुफ को डाला गया था; वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: וְהִנֵּה
  choice: तो देखा कि
  rationale: הִנֵּה आगे की अप्रत्याशित स्थिति की ओर ध्यान खींचता है। ‘तो देखा कि’ आधुनिक हिन्दी में रूबेन के अचानक यह जानने का कथात्मक प्रभाव बनाए रखता है।
- source_word: אֵין יוֹסֵף בַּבּוֹר
  choice: यूसुफ गड्ढे में नहीं था
  rationale: אֵין यहाँ अनुपस्थिति व्यक्त करता है। यह अनुवाद स्वाभाविक है और ‘जा चुका था’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: तब उसने अपने कपड़े फाड़े
  rationale: यह शोक, सदमे या व्याकुलता की प्रचलित प्राचीन अभिव्यक्ति थी। ‘अपने कपड़े फाड़े’ वर्तमान हिन्दी में स्पष्ट और सहज है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। הִנֵּה का शाब्दिक ‘देखो’ न देकर ‘तो देखा कि’ किया गया है, जिससे हिन्दी कथन स्वाभाविक रहते हुए अचानक खोज का भाव सुरक्षित रहता है।
