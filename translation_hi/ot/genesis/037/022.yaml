  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֣ם רְאוּבֵן֮ אַל תִּשְׁפְּכוּ דָם֒ הַשְׁלִ֣יכוּ אֹת֗/וֹ אֶל הַ/בּ֤וֹר הַ/זֶּה֙ אֲשֶׁ֣ר בַּ/מִּדְבָּ֔ר וְ/יָ֖ד אַל תִּשְׁלְחוּ ב֑/וֹ לְמַ֗עַן הַצִּ֤יל אֹת/וֹ֙ מִ/יָּדָ֔/ם לַ/הֲשִׁיב֖/וֹ אֶל אָבִֽי/ו׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/022.yaml
  text: And Reuben said to them[a], “Do not shed blood. Throw him into this pit that is in the wilderness, but do not lay a hand on him”—that he might rescue him from their hand[b], to return him to his father.
translation:
  language: hi
  text: तब रूबेन ने उनसे कहा, “खून मत बहाओ। उसे इस गड्ढे[a] में फेंक दो, जो वीराने में है, पर उस पर हाथ मत उठाना।” उसने यह इसलिए कहा कि वह उसे उनके हाथ से छुड़ाकर उसके पिता के पास लौटा दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कुंड।” इब्रानी शब्द पानी जमा करने के लिए खोदे गए गहरे कुंड को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁפְּכוּ דָם
  choice: खून मत बहाओ
  rationale: यह इब्रानी मुहावरे की रक्त बहाने वाली हिंसा और उससे जुड़े दोष की धारणा को बनाए रखता है तथा आधुनिक हिन्दी में स्वाभाविक है; ‘उसे मत मारो’ अधिक व्याख्यात्मक होता।
- source_word: הַשְׁלִיכוּ אֹתוֹ
  choice: उसे ... फेंक दो
  rationale: क्रिया के प्रत्यक्ष और बलपूर्ण भौतिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַבּוֹר
  choice: गड्ढे
  rationale: בּוֹר के व्यापक अर्थ को रखता है; संदर्भ में पानी जमा करने का कुंड भी संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: जो वीराने में है
  rationale: מִדְבָּר को केवल रेतीला रेगिस्तान मानने से बचते हुए निर्जन खुले क्षेत्र का अर्थ देता है और אֲשֶׁר को स्पष्ट रूप से दर्शाता है।
- source_word: וְיָד אַל תִּשְׁלְחוּ בוֹ
  choice: पर उस पर हाथ मत उठाना
  rationale: इब्रानी मुहावरे का स्वाभाविक हिन्दी समतुल्य है, जो स्वयं उस पर हिंसा न करने की मनाही व्यक्त करता है।
- source_word: לְמַעַן הַצִּיל אֹתוֹ מִיָּדָם
  choice: उसने यह इसलिए कहा कि वह उसे उनके हाथ से छुड़ाकर
  rationale: उद्देश्यसूचक לְמַעַן और ‘उनके हाथ से’ अर्थात उनके वश से बचाने के भाव को स्पष्ट करता है; कथाकार की व्याख्या को प्रत्यक्ष कथन से अलग रखा गया है।
- source_word: לַהֲשִׁיבוֹ אֶל אָבִיו
  choice: उसके पिता के पास लौटा दे
  rationale: हिफ़ील रूप के ‘वापस पहुँचाने/लौटाने’ के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: רְאוּבֵן
  choice: रूबेन
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नामरूप अपनाया गया है।
theological_decisions:
- issue: रूबेन के कथन और कथाकार द्वारा बताए गए उसके गुप्त उद्देश्य की सीमा
  choice: उद्धरण को ‘हाथ मत उठाना’ पर समाप्त करके अगला वाक्य कथाकार की व्याख्या के रूप में दिया गया है।
  alternative: उद्देश्यसूचक अंश को रूबेन के प्रत्यक्ष कथन की निरंतरता जैसा प्रस्तुत करना।
  rationale: इब्रानी में לְמַעַן से आरंभ अंश स्वाभाविक रूप से रूबेन की मंशा बताने वाली कथात्मक टिप्पणी है; इससे उसके प्रकट प्रस्ताव और छिपे बचाव-उद्देश्य का तनाव बना रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘खून मत बहाओ,’ ‘हाथ मत उठाना,’ और ‘उनके हाथ से छुड़ाकर’ जैसे मुहावरे स्रोत की छवि और कथात्मक तनाव को बनाए रखते हैं।
