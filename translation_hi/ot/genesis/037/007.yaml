source:
  edition: WLC
  text: וְ֠/הִנֵּה אֲנַ֜חְנוּ מְאַלְּמִ֤ים אֲלֻמִּים֙ בְּ/ת֣וֹךְ הַ/שָּׂדֶ֔ה וְ/הִנֵּ֛ה קָ֥מָה אֲלֻמָּתִ֖/י וְ/גַם נִצָּ֑בָה וְ/הִנֵּ֤ה תְסֻבֶּ֨ינָה֙ אֲלֻמֹּ֣תֵי/כֶ֔ם וַ/תִּֽשְׁתַּחֲוֶ֖יןָ לַ/אֲלֻמָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/007.yaml
  text: And behold[a], we were binding sheaves in the midst of the field, and behold, my sheaf rose and also stood upright; and behold[c][b], your sheaves gathered around and bowed down to my sheaf.
translation:
  language: hi
  text: और देखो, हम खेत के बीचोंबीच पूले बाँध रहे थे; और देखो, मेरा पूला उठा और सीधा खड़ा हो गया; और देखो, तुम्हारे पूले चारों ओर आकर मेरे पूले के आगे झुक गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे पूले के आगे दण्डवत् हो गए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो / तभी / फिर देखो
  rationale: स्वप्न-वर्णन में बार-बार आने वाला यह संकेत घटनाओं को प्रत्यक्ष और सजीव बनाता है। हिन्दी में यांत्रिक पुनरावृत्ति से बचते हुए उसकी क्रमिकता और जीवंतता सुरक्षित रखी गई है।
- source_word: מְאַלְּמִים אֲלֻמִּים
  choice: पूले बाँध रहे थे
  rationale: क्रिया और उसी मूल की संज्ञा अनाज को बाँधकर पूला बनाने की कृषि-संबंधी क्रिया दर्शाती हैं; ‘पूले बाँधना’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: בְּתוֹךְ הַשָּׂדֶה
  choice: खेत के बीच में
  rationale: בְּתוֹךְ के स्थानिक अर्थ को केवल ‘खेत में’ कहने की अपेक्षा अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: קָמָה וְגַם נִצָּבָה
  choice: उठकर सीधा खड़ा हो गया
  rationale: पहले उठने और फिर स्थिर, सीधा खड़े होने की क्रमिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; וְגַם का वृद्धिशील बल इसी संयुक्त अभिव्यक्ति में निहित है।
- source_word: תְסֻבֶּינָה
  choice: चारों ओर आकर
  rationale: क्रिया के घूमने या घेरने के अर्थ को प्रसंगानुकूल ढंग से व्यक्त करता है और यह अनावश्यक रूप से पूर्ण घेराबंदी निश्चित नहीं करता।
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: सामने झुक गए
  rationale: क्रिया का मूल अर्थ आदर या अधीनता में झुकना है। मुख्य पाठ में सहज आधुनिक हिन्दी रखी गई है, जबकि अधिक तीव्र शारीरिक अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: אֲלֻמָּתִי / אֲלֻמֹּתֵיכֶם
  choice: मेरा पूला / तुम्हारे पूले
  rationale: कृषि-चित्र और स्वप्न में दोनों पक्षों के प्रतीकात्मक संबंध को समान शब्दावली द्वारा स्पष्ट रखा गया है।
theological_decisions:
- issue: וַתִּשְׁתַּחֲוֶיןָ में नमन की तीव्रता और आशय
  choice: मेरे पूले के सामने झुक गए
  alternative: मेरे पूले के आगे दण्डवत् हो गए
  rationale: पद स्वयं झुकने या भूमि तक दण्डवत् होने की क्रिया को व्यक्त कर सकता है, पर इस स्थान पर उपासना या किसी विशेष राजनीतिक आशय को स्पष्ट नहीं करता। मुख्य पाठ तटस्थ रखा गया है और अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सजीव किंतु गरिमापूर्ण कथात्मक स्तर अपनाया गया है। ‘देखो’ स्वप्न की प्रत्यक्षता बनाए रखता है, और ‘पूला’ कृषि-संदर्भ को साधारण पाठक के लिए स्पष्ट करता है।
