    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: तब उन्होंने ... लिया
  rationale: वय्यिक्तोल कथा के अगले क्रम को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּתֹנֶת יוֹסֵף
  choice: यूसुफ का अंगरखा
  rationale: כְּתֹנֶת शरीर पर पहने जाने वाले कुरते या चोगे जैसे वस्त्र को दर्शाता है। ‘अंगरखा’ आधुनिक हिन्दी में गरिमापूर्ण और पर्याप्त रूप से स्रोत-समीप है।
- source_word: וַיִּשְׁחֲטוּ
  choice: हलाल किया
  rationale: क्रिया किसी पशु का गला काटकर वध करने के विशिष्ट अर्थ में है; ‘हलाल किया’ सामान्य ‘मार डाला’ की अपेक्षा उस विधि को अधिक स्पष्ट करता है, यहाँ किसी धार्मिक अनुष्ठान का दावा किए बिना।
- source_word: שְׂעִיר עִזִּים
  choice: एक बकरे को
  rationale: यह पद नर बकरी को निर्दिष्ट करता है; ‘बकरा’ हिन्दी में लिंग-भेद को सहज रूप से सुरक्षित रखता है।
- source_word: וַיִּטְבְּלוּ
  choice: डुबो दिया
  rationale: क्रिया का अर्थ किसी वस्तु को तरल में डुबाना है; वस्त्र और खून के इस प्रसंग में यह स्वाभाविक हिन्दी है।
- source_word: הַכֻּתֹּנֶת
  choice: उस अंगरखे को
  rationale: निश्चित उपपद पहले बताए गए उसी वस्त्र की ओर संकेत करता है; हिन्दी में ‘उस’ यह संदर्भ स्पष्ट करता है और पहले चयनित शब्द को बनाए रखता है।
- source_word: בַּדָּם
  choice: खून में
  rationale: संदर्भ से यह अभी मारे गए बकरे का खून है। हिन्दी में ‘खून में’ स्वाभाविक है और निश्चितता संदर्भ से स्पष्ट रहती है।
