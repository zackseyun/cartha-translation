lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौटकर
  rationale: שׁוב का अर्थ लौटना है; संयुक्त क्रिया कथानक के क्रम को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: אֶל אֶחָיו
  choice: अपने भाइयों के पास
  rationale: אֶל दिशा दर्शाता है और אֶחָיו का अर्थ ‘उसके भाई’ है; हिन्दी में ‘अपने भाइयों के पास’ स्वाभाविक है।
- source_word: הַיֶּלֶד
  choice: वह लड़का
  rationale: יֶלֶד का अर्थ लड़का या बालक हो सकता है। प्रसंग में यूसुफ की ओर संकेत करने के लिए ‘वह लड़का’ सहज और वर्तमान हिन्दी है।
- source_word: אֵינֶנּוּ
  choice: वहाँ नहीं है
  rationale: यह अभिव्यक्ति तत्काल अनुपस्थिति बताती है। ‘वहाँ नहीं है’ मृत्यु का अर्थ आरोपित किए बिना मूल के निकट रहती है।
- source_word: וַאֲנִי
  choice: और मैं—मैं
  rationale: सर्वनाम पर दिए गए बल और रूबेन की घबराहट को हिन्दी में पुनरुक्ति और विराम-चिह्न द्वारा प्रकट किया गया है।
- source_word: אָנָה אֲנִי בָא
  choice: मैं कहाँ जाऊँ?
  rationale: शाब्दिक संरचना ‘मैं कहाँ आता हूँ?’ है, पर गंतव्यवाचक इस इब्रानी मुहावरे का आशय संकट में ‘मैं कहाँ जाऊँ?’ या ‘मैं क्या करूँ?’ है। चुना हुआ रूप स्वाभाविक हिन्दी में गति और व्याकुलता दोनों रखता है।
