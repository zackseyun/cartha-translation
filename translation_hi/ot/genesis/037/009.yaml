base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/009.yaml
  text: 'Then he dreamed another dream and told it to his brothers[a], and said, “Look, I have dreamed another dream: the sun, the moon, and eleven stars were bowing down to me.”'
translation:
  language: hi
  text: 'फिर उसने एक और सपना देखा और उसे अपने भाइयों को बताया। उसने कहा, “देखो, मैंने एक और सपना देखा है: सूर्य, चन्द्रमा और ग्यारह तारे मेरे सामने झुक रहे थे[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे सामने दण्डवत कर रहे थे।” इब्रानी क्रिया गहरे सम्मान में भूमि तक झुकने को भी व्यक्त कर सकती है; यहाँ आशय सम्मान या अधीनता है, ईश्वरीय उपासना नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם עוֹד חֲלוֹם אַחֵר
  choice: फिर उसने एक और सपना देखा
  rationale: वय्यिक़्तोल कथा को आगे बढ़ाता है, इसलिए ‘फिर’ स्वाभाविक क्रम व्यक्त करता है। עוֹד और אַחֵר की पुनरावृत्ति का भाव ‘एक और सपना’ से स्पष्ट होता है।
- source_word: וַיְסַפֵּר אֹתוֹ לְאֶחָיו
  choice: और उसे अपने भाइयों को बताया
  rationale: סִפֵּר का सामान्य अर्थ बताना या वर्णन करना है। ‘बताया’ आधुनिक हिन्दी में सहज है और לְאֶחָיו को ‘अपने भाइयों को’ के रूप में ठीक से व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला संवाद-सूचक है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक और प्रत्यक्ष है।
- source_word: חָלַמְתִּי חֲלוֹם עוֹד
  choice: मैंने एक और सपना देखा है
  rationale: इब्रानी की पुनरुक्त संरचना का अर्थ बनाए रखते हुए यह हिन्दी में स्वाभाविक है। ‘देखा है’ अभी बताए जा रहे हाल के अनुभव से इसे जोड़ता है।
- source_word: וְהִנֵּה
  choice: ':'
  rationale: दूसरा הִנֵּה सपने का दृश्य प्रस्तुत करता है। हिन्दी में विसर्ग-चिह्न उस प्रस्तुतिकरण को सहज रूप से व्यक्त करता है, बिना ‘देखो’ को अनावश्यक रूप से दोहराए।
- source_word: הַשֶּׁמֶשׁ וְהַיָּרֵחַ וְאַחַד עָשָׂר כּוֹכָבִים
  choice: सूर्य, चन्द्रमा और ग्यारह तारे
  rationale: खगोलीय पिंडों और संख्या का सीधा, स्पष्ट और गरिमापूर्ण अनुवाद।
- source_word: מִשְׁתַּחֲוִים לִי
  choice: मेरे सामने झुक रहे थे
  rationale: भागधातु सपने के भीतर चल रही क्रिया दिखाता है। שׁחה यहाँ गहरा सम्मान या अधीनता प्रकट करने के लिए झुकने को दर्शाता है; प्रसंग में ईश्वरीय आराधना अभिप्रेत नहीं है।
theological_decisions:
- issue: यूसुफ के सपने में מִשְׁתַּחֲוִים का आशय
  choice: गैर-उपासना संबंधी सम्मान या अधीनता—‘मेरे सामने झुक रहे थे’
  alternative: ‘मेरी उपासना कर रहे थे’
  rationale: निकटवर्ती कथा-प्रसंग पारिवारिक अधीनता और बाद में प्रकट किए गए सम्मान से संबंधित है, न कि यूसुफ की ईश्वरीय उपासना से। ‘झुक रहे थे’ मूल क्रिया की सामाजिक अर्थ-सीमा को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, कथात्मक और गरिमापूर्ण रूप रखा गया है। ‘देखो’ प्रत्यक्ष संवाद में स्वाभाविक ध्यान-सूचक है। मुख्य पाठ में सहज ‘झुक रहे थे’ रखा गया है और अधिक शाब्दिक ‘दण्डवत’ को पाद-टिप्पणी में दिया गया है।
