source:
  edition: WLC
  text: וַ/יִּרְא֣וּ אֶחָ֗י/ו כִּֽי אֹת֞/וֹ אָהַ֤ב אֲבִי/הֶם֙ מִ/כָּל אֶחָ֔י/ו וַֽ/יִּשְׂנְא֖וּ אֹת֑/וֹ וְ/לֹ֥א יָכְל֖וּ דַּבְּר֥/וֹ לְ/שָׁלֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/004.yaml
  text: When his brothers saw that their father loved him more than all his brothers[a], they hated him and could not speak peaceably to him.
translation:
  language: hi
  text: जब उसके भाइयों ने देखा कि उनका पिता उससे उसके सभी भाइयों की अपेक्षा अधिक प्रेम करता था, तब उन्होंने उससे घृणा की और उससे शांति से बात नहीं कर सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: जब ... ने देखा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; हिंदी में ‘जब’ बोध और उसके परिणाम के बीच स्वाभाविक कालगत संबंध व्यक्त करता है।
- source_word: אֶחָיו
  choice: उसके भाइयों
  rationale: तृतीय पुरुष एकवचन प्रत्यय यूसुफ के भाइयों की ओर संकेत करता है।
- source_word: כִּי
  choice: कि
  rationale: यह उनके देखने की विषय-वस्तु प्रस्तुत करता है, न कि केवल कारण।
- source_word: אָהַב
  choice: प्रेम करता है
  rationale: मूल क्रिया का सामान्य अर्थ ‘प्रेम करना’ है; पक्षपात का भाव तुलनात्मक वाक्यांश और संदर्भ से आता है।
- source_word: אֲבִיהֶם
  choice: उनका पिता
  rationale: मूल में तृतीय पुरुष बहुवचन प्रत्यय है, जो भाइयों के सामूहिक संबंध को व्यक्त करता है।
- source_word: מִכָּל אֶחָיו
  choice: उससे उसके सभी भाइयों से अधिक
  rationale: तुलनात्मक מִן और כָּל को निकटता से रखते हुए हिंदी में तुलना स्पष्ट की गई है; ‘अन्य’ मूल में स्पष्ट नहीं है।
- source_word: וַיִּשְׂנְאוּ
  choice: वे उससे घृणा करने लगे
  rationale: שׂנא का अर्थ ‘घृणा करना’ है; ‘करने लगे’ कथा में उनकी प्रतिक्रिया के आरंभ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְלֹא יָכְלוּ
  choice: और ... नहीं कर सके
  rationale: यह उनकी घृणा से जुड़ी असमर्थता को सीधे व्यक्त करता है।
- source_word: דַּבְּרוֹ
  choice: उससे ... बात
  rationale: सर्वनामिक प्रत्यय का आशय यूसुफ को संबोधित करके या उसके साथ बोलना है; हिंदी में ‘उससे बात करना’ स्वाभाविक है।
- source_word: לְשָׁלֹם
  choice: शांति से
  rationale: इब्रानी पदबंध शांतिपूर्ण अथवा मैत्रीपूर्ण ढंग से बोलने को दर्शाता है; ‘शांति से’ मूल मुहावरे की छवि भी बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘शांति से बात’ मूल לְשָׁלֹם की अर्थ-छवि को बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
