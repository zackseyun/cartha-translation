    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: गए
  rationale: הלך के वय्यिक्तोल रूप से कथा की अगली घटना व्यक्त होती है। हिंदी में साधारण भूतकाल ‘गए’ स्वाभाविक है; स्रोत में अलग से ‘अब’ जैसा कालसूचक शब्द नहीं है।
- source_word: אֶחָיו
  choice: उसके भाई
  rationale: संज्ञा का अर्थ ‘उसके भाई’ है और प्रसंग में यह यूसुफ के पुरुष सहोदरों को दर्शाती है।
- source_word: לִרְעוֹת
  choice: चराने के लिए
  rationale: רעה का यह रूप झुंड की देखभाल करते हुए उसे चराने के उद्देश्य को व्यक्त करता है। आधुनिक हिंदी में ‘चराने के लिए’ स्पष्ट और स्वाभाविक है।
- source_word: אֶת
  choice: '[प्रत्यक्ष कर्म-चिह्न; अनूदित नहीं]'
  rationale: אֵת निश्चित प्रत्यक्ष कर्म का व्याकरणिक चिह्न है और इसका स्वतंत्र हिंदी समतुल्य नहीं है।
- source_word: צֹאן
  choice: झुंड
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़-बकरियों, के सामूहिक झुंड को दर्शाता है। ‘झुंड’ प्रजाति को अनावश्यक रूप से सीमित नहीं करता।
- source_word: אֲבִיהֶם
  choice: अपने पिता के
  rationale: रचनात्मक रूप और बहुवचन प्रत्यय स्वामित्व बताते हैं। कर्ता भाइयों के संदर्भ में हिंदी का आत्मवाचक ‘अपने’ सबसे स्वाभाविक है।
- source_word: בִּשְׁכֶם
  choice: शकेम
  rationale: स्थाननाम שְׁכֶם को ‘शकेम’ रूप में लिप्यंतरित किया गया है। मुख्य पाठ में विभक्ति-चिह्न को खुला छोड़ा गया है, जबकि पादटिप्पणी बताती है कि בְּ स्थान के भीतर या उसके पास होने का बोध करा सकता है।
