  register: आधुनिक मानक हिंदी में संक्षिप्त, सहज और गरिमापूर्ण कथात्मक शैली रखी गई है। ‘अपने पिता’ हिंदी में कर्ता के साथ स्वाभाविक आत्मवाचक संबंध व्यक्त करता है। स्थान-संबंधी वास्तविक इब्रानी अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
