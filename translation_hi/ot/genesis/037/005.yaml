  yaml_path: translation/ot/genesis/037/005.yaml
  text: Joseph dreamed a dream[a], and he told it to his brothers, and they hated him even more.
translation:
  language: hi
  text: यूसुफ़ ने एक सपना देखा[a], और उसने उसे अपने भाइयों को बताया, और वे उससे और भी अधिक घृणा करने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘सपना देखना’ क्रिया और ‘सपना’ संज्ञा एक ही मूल शब्द से बने हैं।
    reason: मूल की सजातीय क्रिया-नाम रचना को दिखाने के लिए।
lexical_decisions:
- source_word: וַיַּחֲלֹם יוֹסֵף חֲלוֹם
  choice: यूसुफ़ ने एक सपना देखा
  rationale: इब्रानी में सजातीय क्रिया-नाम रचना, शाब्दिक रूप से ‘यूसुफ़ ने एक सपना सपना देखा’ जैसी है। हिन्दी में ‘एक सपना देखा’ स्वाभाविक है और मूल अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיַּגֵּד לְאֶחָיו
  choice: और उसे अपने भाइयों को बताया
  rationale: נגד का अर्थ यहाँ बताना या प्रकट करना है। ‘उसे’ पिछले पदबंध के सपने की ओर स्वाभाविक रूप से संकेत करता है, और ‘भाइयों’ मूल के पुल्लिंग पारिवारिक शब्द को बनाए रखता है।
- source_word: וַיּוֹסִפוּ עוֹד שְׂנֹא אֹתוֹ
  choice: तब वे उससे और भी अधिक घृणा करने लगे
  rationale: יסף और עוד का मेल पहले से मौजूद घृणा में वृद्धि दिखाता है। ‘और भी अधिक’ इस बढ़ोतरी को व्यक्त करता है; ‘करने लगे’ हिन्दी में घटनाक्रम के परिणाम को सहज रूप देता है।
- source_word: וַ
  choice: और / तब
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है। पहले स्थान पर ‘और’ तथा परिणामसूचक अगले खंड में ‘तब’ स्वाभाविक हिन्दी प्रवाह देते हैं; आरम्भ में ऐसा कोई अलग ‘अब’ नहीं जोड़ा गया जिसका मूल में स्पष्ट शब्द हो।
