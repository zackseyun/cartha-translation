  text: וַ/יִּמְצָאֵ֣/הוּ אִ֔ישׁ וְ/הִנֵּ֥ה תֹעֶ֖ה בַּ/שָּׂדֶ֑ה וַ/יִּשְׁאָלֵ֧/הוּ הָ/אִ֛ישׁ לֵ/אמֹ֖ר מַה תְּבַקֵּֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/015.yaml
  text: A man found him[a], and behold, he was wandering in the field. The man asked him, saying, “What are you seeking?”
translation:
  language: hi
  text: एक आदमी उसे मिला, और उसने देखा कि वह मैदान में भटक रहा था। उस आदमी ने उससे पूछा, “तुम क्या ढूँढ़ रहे हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצָאֵהוּ
  choice: उसे देखा
  rationale: מצא का मूल अर्थ ‘पाना/मिलना’ है; इस प्रसंग में हिंदी का ‘उसे देखा कि…’ आगे आने वाली अवस्था के साथ स्वाभाविक रूप से जुड़ता है और उस आदमी के यूसुफ को पा लेने का भाव रखता है।
- source_word: אִישׁ
  choice: एक आदमी
  rationale: אִישׁ यहाँ एक अनिर्दिष्ट पुरुष व्यक्ति को दर्शाता है; ‘एक आदमी’ उसके ठोस, एकवचन और पुरुषवाचक संदर्भ को बनाए रखता है।
- source_word: וְהִנֵּה
  choice: कि
  rationale: הִנֵּה दृश्य को ध्यान के सामने लाता है। आधुनिक हिंदी में ‘देखा कि’ इस प्रस्तुतीकरण को सहज ढंग से व्यक्त करता है; अलग से ‘देखो’ कहना यहाँ कृत्रिम होता।
- source_word: תֹעֶה
  choice: भटक रहा था
  rationale: תעה का कृदंत मार्ग से इधर-उधर भटकने की चल रही अवस्था बताता है; ‘भटक रहा था’ उसे निश्चित रूप से ‘खोया हुआ’ घोषित किए बिना यही भाव देता है।
- source_word: בַּשָּׂדֶה
  choice: खुले मैदान में
  rationale: שָׂדֶה खेत, मैदान या खुले ग्रामीण क्षेत्र को दर्शा सकता है। झुंड खोजने के प्रसंग में ‘खुला मैदान’ हिंदी पाठक को केवल खेती किए हुए एक खेत तक अर्थ सीमित करने से बचाता है।
- source_word: וַיִּשְׁאָלֵהוּ
  choice: उससे पूछा
  rationale: שאל का सामान्य और स्वाभाविक हिंदी समतुल्य ‘पूछना’ है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष कथन से व्यक्त
  rationale: हिब्रू का नियमित कथन-परिचायक לֵאמֹר हिंदी में अलग से ‘यह कहते हुए’ दोहराने के बजाय ‘पूछा’ और उद्धरण द्वारा स्वाभाविक रूप से व्यक्त होता है।
- source_word: מַה תְּבַקֵּשׁ
  choice: तुम क्या ढूँढ़ रहे हो?
  rationale: בקש यहाँ किसी व्यक्ति या वस्तु को खोजने का अर्थ देता है। ‘ढूँढ़ रहे हो’ वर्तमान में चल रही खोज को स्पष्ट और बोलचाल-सम्मत आधुनिक हिंदी में व्यक्त करता है।
