- from: एक आदमी ने उसे देखा कि वह खुले मैदान में भटक रहा था। उस आदमी ने उससे पूछा, “तुम क्या ढूँढ़ रहे हो?”
  to: एक आदमी उसे मिला, और उसने देखा कि वह मैदान में भटक रहा था। उस आदमी ने उससे पूछा, “तुम क्या ढूँढ़ रहे हो?”
