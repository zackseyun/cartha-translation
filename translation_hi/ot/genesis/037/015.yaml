review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Joseph's wandering and the man's question, but ‘उसे देखा’ renders the finding/encountering verb וַיִּמְצָאֵהוּ as mere seeing. The Hebrew states that a man came upon/found him; the vivid notice of his wandering follows separately.
  naturalness: The revised wording is natural modern standard Hindi and preserves the concise narrative movement. ‘मैदान’ is an appropriate broad rendering of שָׂדֶה without adding ‘open,’ which is not explicit in the Hebrew.
  terminology: ‘एक आदमी,’ ‘भटक रहा था,’ and ‘ढूँढ़ रहे हो’ are accurate, clear choices for אישׁ, תֹעֶה, and תבקשׁ. No theological terminology occurs.
  issues:
  - severity: medium
    issue: ‘उसे देखा’ weakens and changes וַיִּמְצָאֵהוּ.
    rationale: מצא means ‘find’ or ‘come upon/encounter,’ not simply ‘see.’ Hindi ‘उसे मिला’ accurately conveys the narrative encounter.
  - severity: low
    issue: ‘खुले मैदान’ adds ‘open’ to שָׂדֶה.
    rationale: The Hebrew denotes a field/open country but does not explicitly specify ‘open.’ ‘मैदान’ retains the broad sense without this added modifier.
  revised_text: एक आदमी उसे मिला, और उसने देखा कि वह मैदान में भटक रहा था। उस आदमी ने उससे पूछा, “तुम क्या ढूँढ़ रहे हो?”
