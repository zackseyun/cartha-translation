  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। हिब्रू कथा की संक्षिप्तता सुरक्षित है, पर वְהִנֵּה और לֵאמֹר को शब्दशः रखकर हिंदी को अस्वाभाविक नहीं बनाया गया। पद में किसी पाद-टिप्पणी की आवश्यकता नहीं है।
