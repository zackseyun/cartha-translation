base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/036.yaml
  text: Meanwhile[a], the Medanites sold him into Egypt to Potiphar, an officer of Pharaoh[c][b], the captain of the guard.
translation:
  language: hi
  text: इस बीच मदानियों[a] ने उसे मिस्र ले जाकर पोतीपर को बेच दिया, जो फ़िरौन का एक अधिकारी और अंगरक्षकों का प्रधान[b][c] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘मदानी’ है। आसपास के वृत्तांत और कुछ प्राचीन अनुवादों के आधार पर यहाँ परम्परागत रूप से ‘मिद्यानी’ भी समझा गया है।
    reason: alternative_reading
  - marker: b
    text: या ‘फ़िरौन का एक नपुंसक’ अथवा ‘फ़िरौन का एक दरबारी अधिकारी।’ इब्रानी शब्द वास्तविक नपुंसक या किसी राजकीय अधिकारी—दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘वध करने वालों का प्रधान।’ राजकीय प्रसंग में इसका आशय अंगरक्षकों, जल्लादों या शाही सुरक्षा-दल के प्रधान से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּדָנִים
  choice: इस बीच मदानियों
  rationale: वाव को प्रसंग के दृश्य-परिवर्तन के अनुसार स्वाभाविक हिन्दी में ‘इस बीच’ कहा गया है। जातिनाम מְדָנִים का रूप ‘मदानी’ रखा गया है; आसपास के वृत्तांत में ‘मिद्यानी’ होने की सम्भावना पादटिप्पणी में दी गई है।
- source_word: מָכְרוּ אֹתוֹ
  choice: ने उसे ... बेच दिया
  rationale: इब्रानी काल-वाचक रूप कथा में पूर्ण हुई घटना बताता है; हिन्दी में ‘बेच दिया’ स्वाभाविक और सटीक है। ‘उसे’ का संकेत यूसुफ़ की ओर है।
- source_word: אֶל מִצְרָיִם
  choice: मिस्र में
  rationale: אֶל में दिशा का भाव है, पर अगले पद में वहीं के खरीदार का नाम आता है; हिन्दी में ‘मिस्र में ... के हाथ बेच दिया’ गन्तव्य और बिक्री-स्थान दोनों को सहज रूप से व्यक्त करता है।
- source_word: לְפוֹטִיפַר
  choice: पोतीपर के हाथ
  rationale: לְ खरीदार को चिह्नित करता है। ‘के हाथ बेच दिया’ वर्तमान हिन्दी का स्वाभाविक मुहावरा है और पोतीपर को खरीदार के रूप में स्पष्ट करता है।
- source_word: סְרִיס פַּרְעֹה
  choice: फ़िरौन के एक अधिकारी
  rationale: סָרִיס का अर्थ वास्तविक नपुंसक भी हो सकता है और राजकीय/दरबारी अधिकारी भी। मुख्य पाठ में कम निर्णायक और प्रसंगानुकूल ‘अधिकारी’ रखा गया है; दूसरी सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: שַׂר הַטַּבָּחִים
  choice: अंगरक्षकों का प्रधान
  rationale: राजदरबार के प्रसंग में यह पद सुरक्षा, दण्ड या मृत्युदण्ड से जुड़े शाही दल के प्रमुख को दर्शा सकता है। ‘अंगरक्षकों का प्रधान’ पद की राजकीय प्रकृति को साधारण पाठक के लिए स्पष्ट करता है, जबकि शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
