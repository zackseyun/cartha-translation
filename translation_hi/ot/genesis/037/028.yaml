  text: וַ/יַּֽעַבְרוּ֩ אֲנָשִׁ֨ים מִדְיָנִ֜ים סֹֽחֲרִ֗ים וַֽ/יִּמְשְׁכוּ֙ וַ/יַּֽעֲל֤וּ אֶת יוֹסֵף֙ מִן הַ/בּ֔וֹר וַ/יִּמְכְּר֧וּ אֶת יוֹסֵ֛ף לַ/יִּשְׁמְעֵאלִ֖ים בְּ/עֶשְׂרִ֣ים כָּ֑סֶף וַ/יָּבִ֥יאוּ אֶת יוֹסֵ֖ף מִצְרָֽיְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/028.yaml
  text: Then Midianite men[a], traders, passed by; and they pulled Joseph up and lifted him out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver[c][b]. Then they brought Joseph to Egypt.
translation:
  language: hi
  text: तब मिद्यानी पुरुष, जो व्यापारी थे, उधर से गुज़रे; और उन्होंने[b] यूसुफ को खींचा और गड्ढे से ऊपर निकाला, और यूसुफ को इश्माएलियों को बीस चाँदी के टुकड़ों[a] के बदले बेच दिया। फिर वे यूसुफ को मिस्र ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से ‘बीस चाँदी’ है; माप या मुद्रा की इकाई स्पष्ट रूप से नहीं बताई गई है।
    reason: lexical_alternative
  - marker: b
    text: मिद्यानी व्यापारियों और इश्माएलियों के उल्लेख के संदर्भ में हिब्रू में बहुवचन क्रियाएँ हैं। इसलिए यह कुछ अस्पष्ट रहता है कि प्रत्येक कार्य किस समूह ने किया।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: उधर से गुज़रे
  rationale: यह स्थान के पास से आगे बढ़ने का स्वाभाविक आधुनिक हिन्दी 표현 है और आगमन का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: אֲנָשִׁים מִדְיָנִים סֹחֲרִים
  choice: मिद्यानी व्यापारी
  rationale: हिब्रू में ‘मिद्यानी पुरुष, व्यापारी’ है; हिन्दी में ‘मिद्यानी व्यापारी’ अधिक स्वाभाविक है और दोनों आवश्यक पहचानों को बनाए रखता है।
- source_word: וַיִּמְשְׁכוּ וַיַּעֲלוּ ... מִן הַבּוֹר
  choice: खींचकर गड्ढे से बाहर निकाला
  rationale: यह משך और עלה की संयुक्त गति—खींचना और ऊपर/बाहर लाना—को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיִּמְכְּרוּ ... לַיִּשְׁמְעֵאלִים
  choice: इश्माएलियों के हाथ बेच दिया
  rationale: ‘के हाथ बेच दिया’ आधुनिक हिन्दी में बिक्री के प्राप्तकर्ता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּעֶשְׂרִים כָּסֶף
  choice: बीस चाँदी के टुकड़ों में
  rationale: मूल में शाब्दिक रूप से ‘बीस चाँदी’ है और इकाई नहीं दी गई; इसलिए ‘टुकड़ों’ को पूरक रूप में रखा गया है, ‘शेकेल’ नहीं जोड़ा गया।
- source_word: וַיָּבִיאוּ ... מִצְרָיְמָה
  choice: मिस्र ले गए
  rationale: गंतव्य की ओर गति के इस प्रसंग में ‘ले गए’ हिन्दी कथावाचन में ‘लाए’ की अपेक्षा अधिक स्वाभाविक है।
theological_decisions:
- issue: मिद्यानी व्यापारियों और इश्माएलियों के उल्लेख के बाद बहुवचन क्रियाओं का कर्ता
  choice: सभी क्रियाओं के लिए अनिर्दिष्ट ‘उन्होंने/वे’ रखा गया
  alternative: हर अगली क्रिया को स्पष्ट रूप से मिद्यानियों या इश्माएलियों से जोड़ना
  rationale: हिब्रू बहुवचन क्रियाओं का कर्ता दो समूहों के उल्लेख के बीच पूरी तरह स्पष्ट नहीं करता। हिन्दी में सर्वनाम रखकर इस वास्तविक कथात्मक अस्पष्टता को बिना सामंजस्य थोपे सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘गड्ढा’, ‘व्यापारी’, और ‘चाँदी के टुकड़े’ सामान्य पाठक के लिए सुबोध हैं। समूहों की पहचान और कर्ता-संबंधी मूल अस्पष्टता को सुरक्षित रखा गया है।
