  text: וַֽ/יְשַׁלְּח֞וּ אֶת כְּתֹ֣נֶת הַ/פַּסִּ֗ים וַ/יָּבִ֨יאוּ֙ אֶל אֲבִי/הֶ֔ם וַ/יֹּאמְר֖וּ זֹ֣את מָצָ֑אנוּ הַכֶּר נָ֗א הַ/כְּתֹ֧נֶת בִּנְ/ךָ֛ הִ֖וא אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/032.yaml
  text: Then they sent the robe with long sleeves and brought it to their father[a], and said, “We found this[b]. Please identify whether it is your son's robe or not.”
translation:
  language: hi
  text: तब उन्होंने वह लंबी बाँहों वाला चोगा[a] भेजा और उसे अपने पिता के पास ले आए, और कहा, “हमें यह मिला है। कृपया पहचानिए[b] कि यह आपके बेटे का चोगा है या नहीं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अलंकृत चोगा,” “बहुमूल्य सजावट वाला अंगरखा”; परम्परागत अनुवाद, “रंग-बिरंगा चोगा।” इब्रानी पद का अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: मूल क्रिया का अर्थ “पहचानना” या “पहचान कर बताना” है। यही शब्दावली आगे की कथा में पहचान और गलत पहचान के प्रसंगों में महत्त्वपूर्ण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: उन्होंने ... भिजवाया
  rationale: पिएल रूप यहाँ ‘भेजना’ व्यक्त करता है। अगले क्रियापद ‘ले आए’ के साथ सम्भावित प्रेषित दूतों को हिन्दी में अनावश्यक रूप से निर्दिष्ट किए बिना ‘भिजवाया’ स्वाभाविक है।
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: लम्बी बाँहों वाला चोगा
  rationale: כְּתֹנֶת एक अंगरखे या चोगे जैसा वस्त्र है। פַּסִּים का अर्थ अनिश्चित है; सम्भवतः हथेलियों अथवा तलवों तक पहुँचने वाले लम्बे वस्त्र की ओर संकेत करता है। ‘रंग-बिरंगा’ कहना स्रोत से अधिक निश्चित होगा।
- source_word: וַיָּבִיאוּ אֶל אֲבִיהֶם
  choice: अपने पिता के पास
  rationale: इब्रानी में स्पष्टतः ‘उनके पिता के पास’ है। हिन्दी वाक्य में ‘भिजवाया’ भेजने और पहुँचाने की संयुक्त क्रिया को सहज रूप से व्यक्त करता है और पिता का नाम नहीं जोड़ता।
- source_word: זֹאת מָצָאנוּ
  choice: यह हमें मिला है
  rationale: यह भाइयों के संक्षिप्त और भ्रामक कथन को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: הַכֶּר נָא
  choice: कृपया पहचानिए
  rationale: हिफ़ील रूप का अर्थ ‘पहचानना/पहचान कर बताना’ है। ‘पहचानिए’ मूल शब्द को स्पष्ट रखता है और कथा में पहचान तथा गलत पहचान की पुनरावृत्ति को भी बचाता है।
- source_word: הַכְּתֹנֶת בִּנְךָ הִוא אִם לֹא
  choice: कि यह आपके बेटे का चोगा है या नहीं
  rationale: אִם־לֹא की अप्रत्यक्ष प्रश्न-संरचना ‘कि ... है या नहीं’ से सहज रूप में व्यक्त होती है। ‘आपके बेटे’ भाइयों की यूसुफ़ से दूरी दिखाने वाली मूल अभिव्यक्ति को सुरक्षित रखता है।
