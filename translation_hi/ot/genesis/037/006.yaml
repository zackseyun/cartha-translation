- source_word: אֲשֶׁר חָלָמְתִּי
  choice: जो मैंने देखा है
  rationale: हिन्दी में सपना ‘देखना’ स्वाभाविक सहप्रयोग है। पूर्ण पक्ष का ‘देखा है’ अभी सुनाए जा रहे हाल के अनुभव को सहज रूप से व्यक्त करता है।
