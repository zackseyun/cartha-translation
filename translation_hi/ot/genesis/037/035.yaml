source:
  edition: WLC
  text: וַ/יָּקֻמוּ֩ כָל בָּנָ֨י/ו וְ/כָל בְּנֹתָ֜י/ו לְ/נַחֲמ֗/וֹ וַ/יְמָאֵן֙ לְ/הִתְנַחֵ֔ם וַ/יֹּ֕אמֶר כִּֽי אֵרֵ֧ד אֶל בְּנִ֛/י אָבֵ֖ל שְׁאֹ֑לָ/ה וַ/יֵּ֥בְךְּ אֹת֖/וֹ אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/035.yaml
  text: Then all his sons and all his daughters rose up to comfort him[a], but he refused to be comforted and said, “For I will go down to Sheol to my son[b], mourning.” So his father wept for him.
translation:
  language: hi
  text: तब उसके सभी बेटे और सभी बेटियाँ उसे सांत्वना देने के लिए उठ खड़े हुए, पर उसने सांत्वना पाने से इनकार कर दिया और कहा, “मैं अपने बेटे के पास शोक करता हुआ शिओल में उतर जाऊँगा।” और उसका पिता उसके लिए रोया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: उठे
  rationale: קום के सामान्य कथात्मक अर्थ ‘उठना’ को सहज हिन्दी में बनाए रखता है।
- source_word: כָל בָּנָיו וְכָל בְּנֹתָיו
  choice: उसके सब बेटे और सब बेटियाँ
  rationale: इब्रानी में बेटों और बेटियों का स्पष्ट अलग-अलग उल्लेख है, इसलिए उसे ‘संतान’ में समेटा नहीं गया।
- source_word: לְנַחֲמוֹ / לְהִתְנַחֵם
  choice: उसे सांत्वना देने / सांत्वना पाने
  rationale: एक ही धातु के सक्रिय और हित्पएल रूपों का संबंध स्पष्ट रखते हुए शोक के प्रसंग के लिए स्वाभाविक आधुनिक हिन्दी दी गई है।
- source_word: וַיְמָאֵן
  choice: इनकार कर दिया
  rationale: यह केवल अनिच्छा नहीं, बल्कि सांत्वना स्वीकार करने से स्पष्ट मना करना व्यक्त करता है।
- source_word: אֵרֵד
  choice: मैं ... उतर जाऊँगा
  rationale: मूल के ‘नीचे उतरने’ की स्थानिक कल्पना सुरक्षित रहती है और हिन्दी में भावी निश्चय भी स्वाभाविक रूप से व्यक्त होता है।
- source_word: אֶל־בְּנִי
  choice: अपने बेटे के पास
  rationale: אֶל के ‘की ओर/के पास’ अर्थ को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखा गया है।
- source_word: אָבֵל
  choice: शोक करता हुआ
  rationale: याकूब की शोकमग्न दशा को क्रियाविशेषणात्मक ढंग से व्यक्त करता है और मूल की संक्षिप्तता बनाए रखता है।
- source_word: שְׁאֹלָה
  choice: अधोलोक में
  rationale: यह केवल कब्र नहीं, मृतकों के लोक की इब्रानी धारणा को सूचित करता है। ‘अधोलोक’ आधुनिक हिन्दी पाठक के लिए ‘शिओल’ के लिप्यंतरण से अधिक बोधगम्य है, जबकि पादटिप्पणी मूल पद बताती है।
- source_word: וַיֵּבְךְּ אֹתוֹ אָבִיו
  choice: और उसका पिता उसके लिए रोया
  rationale: कर्ता ‘उसका पिता’ और कर्म-संबंध ‘उसके लिए’ को मूल के निकट तथा बिना अनावश्यक कालगत विस्तार के रखा गया है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; शिओल
  rationale: ‘कब्र’ अर्थ को अत्यधिक संकीर्ण कर सकता है, जबकि ‘नरक’ बाद की विशिष्ट दंड-संबंधी धारणा आरोपित करेगा। ‘अधोलोक’ मृतकों के लोक का व्यापक और धर्मवैज्ञानिक रूप से संयमित संकेत देता है; मूल पद पादटिप्पणी में सुरक्षित है।
- issue: אֶל־בְּנִי אָבֵל שְׁאֹלָה का वाक्यगत संबंध
  choice: अपने बेटे के पास शोक करता हुआ अधोलोक में उतर जाऊँगा
  alternative: शोक करता हुआ अधोलोक में अपने बेटे के पास उतर जाऊँगा
  rationale: मुख्य पाठ मूल पदक्रम के संबंधों को यथासंभव बनाए रखता है; वैकल्पिक विन्यास पादटिप्पणी में देकर ‘शोक करता हुआ’ और दोनों गंतव्य-सूचक पदबंधों के संबंध को कृत्रिम रूप से अंतिम नहीं ठहराया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सांत्वना’ शोक-संदर्भ में स्वाभाविक औपचारिक शब्द है। ‘अधोलोक’ को ‘नरक’ से जानबूझकर अलग रखा गया है, ताकि मूल पाठ से अधिक विकसित परलोक-दृष्टि न थोपी जाए।
