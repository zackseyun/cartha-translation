base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/021.yaml
  text: But when Reuben heard it[a], he rescued him from their hand and said, “Let us not take his life.”
translation:
  language: hi
  text: पर जब रूबेन ने यह सुना, तो उसने यूसुफ को उनके हाथ से बचाया और कहा, “हम उसकी जान न लें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: जब ... ने यह सुना
  rationale: שׁמע का मूल अर्थ ‘सुनना’ है। पिछले पद में भाइयों की कही बात इसका संदर्भ है, इसलिए हिन्दी में ‘यह’ जोड़ना स्वाभाविक है; वाव-क्रम की कालगत भूमिका को ‘जब’ व्यक्त करता है।
- source_word: רְאוּבֵן
  choice: रूबेन
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַיַּצִּלֵהוּ
  choice: उसने यूसुफ को ... बचाया
  rationale: हिफ़ील रूप का अर्थ ‘छुड़ाना/बचाना’ है। सर्वनाम ‘उसे’ के स्थान पर ‘यूसुफ को’ हिन्दी में संदर्भ स्पष्ट रखता है, बिना अर्थ बदले।
- source_word: מִיָּדָם
  choice: उनके हाथ से
  rationale: मूल इब्रानी बिंब को सुरक्षित रखता है, जहाँ ‘हाथ’ अधिकार और नियंत्रण को दर्शाता है।
- source_word: וַיֹּאמֶר
  choice: और कहा
  rationale: प्रत्यक्ष कथन प्रस्तुत करने वाला सामान्य आख्यानात्मक प्रयोग।
- source_word: לֹא נַכֶּנּוּ נָפֶשׁ
  choice: हम उसकी जान न लें
  rationale: शाब्दिक रूप से ‘हम उसे प्राण के संबंध में न मारें’ जैसा वाक्यांश घातक प्रहार करने का मुहावरा है। ‘जान न लें’ आधुनिक हिन्दी में उसके आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
theological_decisions: []
