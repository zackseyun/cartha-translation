source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ לֶךְ נָ֨א רְאֵ֜ה אֶת שְׁל֤וֹם אַחֶ֨י/ךָ֙ וְ/אֶת שְׁל֣וֹם הַ/צֹּ֔אן וַ/הֲשִׁבֵ֖/נִי דָּבָ֑ר וַ/יִּשְׁלָחֵ֨/הוּ֙ מֵ/עֵ֣מֶק חֶבְר֔וֹן וַ/יָּבֹ֖א שְׁכֶֽמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/014.yaml
  text: He said to him[a], “Go now, see about the well-being of your brothers and the well-being of the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.
translation:
  language: hi
  text: उसने उससे कहा, “ज़रा जाकर देखो कि तुम्हारे भाइयों का कुशल-मंगल और झुंड का कुशल-मंगल कैसा है, और लौटकर मुझे समाचार दो।” तब उसने उसे हेब्रोन की घाटी से भेजा, और वह शकेम पहुँचा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶךְ נָא
  choice: अब जाकर
  rationale: आज्ञार्थक לֶךְ के साथ विनम्रता या आग्रह सूचित करने वाले נָא को प्रसंगानुकूल सहज हिन्दी में व्यक्त करता है।
- source_word: רְאֵה אֶת שְׁלוֹם
  choice: देखो कि ... कुशल से हैं या नहीं
  rationale: רְאֵה का मूल बोध ‘देखना’ बनाए रखते हुए שְׁלוֹם को यहाँ व्यक्ति या पशुओं की दशा और कुशल-मंगल के अर्थ में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: אַחֶיךָ
  choice: तुम्हारे भाई
  rationale: इब्रानी पुल्लिंग बहुवचन है और प्रसंग में यूसुफ के भाइयों को ही सूचित करता है।
- source_word: הַצֹּאן
  choice: झुंड
  rationale: צֹאן भेड़-बकरियों जैसे छोटे पालतू पशुओं के सामूहिक झुंड को सूचित कर सकता है; ‘झुंड’ किसी एक प्रजाति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַהֲשִׁבֵנִי דָּבָר
  choice: लौटकर मुझे समाचार दो
  rationale: हिफ़ील שוב और דָּבָר का मुहावरा वापस आकर सूचना देने का भाव रखता है; हिन्दी में यह रूप अर्थ और वापसी दोनों को स्पष्ट करता है।
- source_word: מֵעֵמֶק חֶבְרוֹן
  choice: हेब्रोन की तराई से
  rationale: עֵמֶק के घाटी या निचले विस्तृत भूभाग के अर्थ को ‘तराई’ स्वाभाविक ढंग से व्यक्त करता है और हेब्रोन के साथ संबंध बनाए रखता है।
- source_word: שְׁכֶמָה
  choice: शकेम पहुँचा
  rationale: स्थान-नाम पर दिशासूचक הָ गति को शकेम की ओर बताता है; हिन्दी में ‘शकेम पहुँचा’ इसे सहज रूप से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। शְׁלוֹם की दोनों आवृत्तियों को समान रूप से ‘कुशल से’ रखकर स्रोत की पुनरावृत्ति और अर्थ-साम्य सुरक्षित रखा गया है।
