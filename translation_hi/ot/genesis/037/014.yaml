revisions:
- from: उसने उससे कहा, “अब जाकर देखो कि तुम्हारे भाई कुशल से हैं या नहीं और झुंड कुशल से है या नहीं, और लौटकर मुझे समाचार दो।” तब उसने उसे हेब्रोन की तराई से भेजा, और वह शकेम पहुँचा।
  to: उसने उससे कहा, “ज़रा जाकर देखो कि तुम्हारे भाइयों का कुशल-मंगल और झुंड का कुशल-मंगल कैसा है, और लौटकर मुझे समाचार दो।” तब उसने उसे हेब्रोन की घाटी से भेजा, और वह शकेम पहुँचा।
  rationale: The revision replaces the overly specific ‘तराई’ with ‘घाटी,’ renders the softening force of נָא without adding urgency, and expresses both occurrences of שָׁלוֹם in an idiomatic, deliberately parallel Hindi form. No footnote is necessary because the translation does not conceal a material ambiguity.
