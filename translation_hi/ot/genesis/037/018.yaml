lexical_decisions:
- source_word: וַיִּרְאוּ אֹתוֹ מֵרָחֹק
  choice: उन्होंने उसे दूर से देख लिया
  rationale: रूप रאה का सामान्य कथात्मक अर्थ ‘देखना’ है। ‘देख लिया’ दूर से उस पर उनकी दृष्टि पड़ने और आगे की तत्काल कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבְטֶרֶם יִקְרַב אֲלֵיהֶם
  choice: और उसके उनके पास पहुँचने से पहले ही
  rationale: בְּטֶרֶם समय-संबंधी अर्थ ‘इससे पहले कि’ देता है; קרב का अर्थ निकट आना या पहुँच जाना है। यह रचना हिन्दी में स्वाभाविक रहते हुए वही समयक्रम बनाए रखती है।
- source_word: וַיִּתְנַכְּלוּ אֹתוֹ
  choice: उन्होंने उसके विरुद्ध षड्यंत्र रचा
  rationale: נכל के हित्पएल रूप में शत्रुतापूर्ण चाल, कपट या षड्यंत्र का भाव है। अगले उद्देश्यसूचक पद के कारण यहाँ जान लेने की सोची-समझी योजना स्पष्ट है।
- source_word: לַהֲמִיתוֹ
  choice: कि उसे मार डालें
  rationale: מות का हिफ़ील infinitive construct, 3ms प्रत्यय के साथ, उसे मरवा देने या मार डालने के उद्देश्य को व्यक्त करता है। ‘कि उसे मार डालें’ षड्यंत्र के उद्देश्य को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
