  text: וַ/יְסַפֵּ֣ר אֶל אָבִי/ו֮ וְ/אֶל אֶחָי/ו֒ וַ/יִּגְעַר בּ֣/וֹ אָבִ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מָ֛ה הַ/חֲל֥וֹם הַ/זֶּ֖ה אֲשֶׁ֣ר חָלָ֑מְתָּ הֲ/ב֣וֹא נָב֗וֹא אֲנִי֙ וְ/אִמְּ/ךָ֣ וְ/אַחֶ֔י/ךָ לְ/הִשְׁתַּחֲוֺ֥ת לְ/ךָ֖ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/010.yaml
  text: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
translation:
  language: hi
  text: उसने यह सपना अपने पिता और अपने भाइयों को बताया। तब उसके पिता ने उसे डाँटा और कहा, “यह कैसा सपना है जो तुमने देखा है? क्या मैं, तुम्हारी माँ और तुम्हारे भाई सचमुच आकर तुम्हारे सामने भूमि तक झुकेंगे[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे सामने दंडवत करेंगे।” हिब्रू क्रिया गहरा प्रणाम या अधीनता प्रकट करने के लिए भूमि तक झुकने का अर्थ दे सकती है; यहाँ इसका अर्थ अनिवार्य रूप से आराधना करना नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: उसने यह सपना ... बताया
  rationale: पिएल रूप का अर्थ ‘बताना/वर्णन करना’ है। प्रसंग से निहित कर्म सपना है; उसे हिन्दी में स्पष्ट करने से वाक्य स्वाभाविक रहता है।
- source_word: וַיִּגְעַר בּוֹ
  choice: उसे डाँटा
  rationale: גער कड़ी मौखिक फटकार को व्यक्त करता है। आधुनिक सामान्य हिन्दी में ‘डाँटा’ स्वाभाविक और अर्थानुकूल है।
- source_word: מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ
  choice: यह कैसा सपना है जो तुमने देखा है?
  rationale: हिब्रू के विस्मय और अस्वीकृति-भरे प्रश्न को सुरक्षित रखता है। हिन्दी में सपना ‘देखना’ स्वाभाविक प्रयोग है।
- source_word: הֲבוֹא נָבוֹא
  choice: क्या सचमुच ... आकर
  rationale: क्रिया के निरपेक्ष रूप और सीमित क्रिया की पुनरुक्ति से उत्पन्न बल को ‘सचमुच’ व्यक्त करता है।
- source_word: לְהִשְׁתַּחֲוֺת לְךָ אָרְצָה
  choice: तुम्हारे सामने भूमि तक झुकेंगे
  rationale: यहाँ השתחוה सामाजिक अधीनता और गहरी दंडवत मुद्रा बताता है, अनिवार्यतः आराधना नहीं; אָרְצָה नीचे भूमि की ओर गति को स्पष्ट करता है।
theological_decisions:
- issue: गैर-उपासना प्रसंग में השתחוה का अर्थ
  choice: तुम्हारे सामने भूमि तक झुकेंगे
  alternative: तुम्हारी आराधना करेंगे; तुम्हारे सामने दंडवत करेंगे
  rationale: पारिवारिक सत्ता और अधीनता के इस प्रसंग में क्रिया गहरा प्रणाम बताती है। ‘आराधना’ अनावश्यक धार्मिक अर्थ जोड़ती, जबकि ‘भूमि तक झुकना’ शारीरिक मुद्रा और सामाजिक आशय दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘तुम’ पारिवारिक संबोधन के अनुरूप है। प्रश्न की तीव्रता ‘यह कैसा सपना’ और ‘क्या सचमुच’ से व्यक्त की गई है।
