  rationale: यह सामने आते व्यक्ति की ओर ध्यान खींचने वाला उद्गार है; ‘देखो’ वर्तमान हिन्दी में स्वाभाविक और सीधा समतुल्य है।
- source_word: בַּעַל הַחֲלֹמוֹת
  choice: सपनों का मालिक
  rationale: בעל का मूल बिंब ‘मालिक/स्वामी’ है और סמיכות-रचना इसे ‘सपनों’ से जोड़ती है। हिन्दी में यह अभिव्यक्ति समझ में आती है तथा भाइयों के व्यंग्यपूर्ण उपनाम का असामान्य, तंजभरा स्वर बनाए रखती है।
- source_word: הַלָּזֶה
  choice: वह
  rationale: यह संकेतवाचक रूप दूर से दिख रहे यूसुफ की ओर तिरस्कारपूर्ण ढंग से संकेत करता है; हिन्दी में ‘वह’ उस दूरी और भाव को ‘यह’ से अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּא
  choice: आ रहा है
  rationale: בוא का कृदन्त यहाँ प्रगतिशील निकट-आगमन बताता है; ‘आ रहा है’ उसका स्वाभाविक हिन्दी रूप है।
