  choice: और वे कहने लगे
  rationale: वय्यिक्तोल रूप कथा की अगली क्रिया आरम्भ करता है; बहुवचन वार्ता और प्रसंग में जारी उपहास के लिए ‘कहने लगे’ स्वाभाविक हिन्दी है।
- source_word: אִישׁ אֶל־אָחִיו
  choice: आपस में
