  text: וַֽ/יְהִ֕י כַּֽ/אֲשֶׁר בָּ֥א יוֹסֵ֖ף אֶל אֶחָ֑י/ו וַ/יַּפְשִׁ֤יטוּ אֶת יוֹסֵף֙ אֶת כֻּתָּנְתּ֔/וֹ אֶת כְּתֹ֥נֶת הַ/פַּסִּ֖ים אֲשֶׁ֥ר עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/023.yaml
  text: And when Joseph came to his brothers[a], they stripped Joseph of his tunic, the tunic of many colors that was on him.
translation:
  language: hi
  text: जब यूसुफ अपने भाइयों के पास पहुँचा, तब उन्होंने यूसुफ का अंगरखा, अर्थात वह विशेष अंगरखा[a] जो वह पहने हुए था, उसके तन से उतार लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लंबी बाँहों वाला अंगरखा,’ ‘रंग-बिरंगा अंगरखा,’ अथवा ‘अलंकृत अंगरखा।’ इब्रानी पदबंध כְּתֹנֶת הַפַּסִּים का ठीक अर्थ अनिश्चित है; पारंपरिक अनुवाद ‘रंग-बिरंगा अंगरखा’ संभव है, पर शायद कम संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: जब…तब
  rationale: यह इब्रानी कथात्मक सूत्र अगली घटना का समय बताता है। हिंदी में ‘जब…तब’ स्वाभाविक ढंग से उसका कालगत संबंध व्यक्त करता है।
- source_word: בָּא
  choice: पहुँचा
  rationale: संदर्भ में यूसुफ का अपने भाइयों के पास आना अभिप्रेत है; ‘पहुँचा’ हिंदी कथन में गंतव्य तक आने को सहज रूप से व्यक्त करता है।
- source_word: אֶל אֶחָיו
  choice: अपने भाइयों के पास
  rationale: इब्रानी पुल्लिंग बहुवचन है और प्रसंग में यूसुफ के पुरुष सहोदरों को सूचित करता है।
- source_word: וַיַּפְשִׁיטוּ
  choice: उसके तन से उतार लिया
  rationale: क्रिया किसी के वस्त्र उतरवाने या उतार लेने को व्यक्त करती है। यह चयन भाइयों द्वारा यूसुफ पर की गई प्रत्यक्ष और बलपूर्ण कार्रवाई को स्वाभाविक हिंदी में रखता है।
- source_word: כֻּתָּנְתּוֹ
  choice: उसका अंगरखा
  rationale: כֻּתֹּנֶת शरीर पर पहने जाने वाले कुरते या अंगरखे जैसे वस्त्र को दर्शाता है। ‘अंगरखा’ गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है।
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: विशेष अंगरखा[a]
  rationale: פַּסִּים का सटीक आशय विवादित है। ‘विशेष’ वस्त्र की विशिष्टता बताता है, पर उसे निश्चित रूप से रंग-बिरंगा, लंबी बाँहों वाला या अलंकृत घोषित नहीं करता; संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: אֲשֶׁר עָלָיו
  choice: जो वह पहने हुए था
  rationale: यह उपवाक्य उस समय यूसुफ के शरीर पर मौजूद वस्त्र की पहचान करता है; हिंदी में यह निकट और स्वाभाविक समतुल्य है।
