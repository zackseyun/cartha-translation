  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘अर्थात’ मूल में अंगरखे के दोहरे उल्लेख को स्पष्ट करता है, और ‘विशेष’ विवादित इब्रानी पदबंध की अनिश्चितता को मुख्य पाठ में खुला रखता है।
