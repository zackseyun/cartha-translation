lexical_decisions:
- source_word: וַיְקַנְאוּ בֹו
  choice: उससे जलते थे
  rationale: यहाँ קנא किसी व्यक्ति के प्रति ईर्ष्या या जलन को व्यक्त करता है। आधुनिक हिन्दी में ‘उससे जलते थे’ स्वाभाविक है और भाइयों की लगातार बनी प्रतिक्रिया को ठीक प्रकार प्रकट करता है।
- source_word: אֶחָיו
  choice: उसके भाई
  rationale: इब्रानी शब्द पुल्लिंग बहुवचन है और कथा में यूसुफ के भाइयों को ही दर्शाता है।
- source_word: וְאָבִיו
  choice: पर उसके पिता
  rationale: וְ का मूल अर्थ ‘और’ है, लेकिन यहाँ भाइयों की ईर्ष्या और पिता की विचारशील प्रतिक्रिया के बीच स्पष्ट विरोध है; इसलिए हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: שָׁמַר
  choice: मन में रखा
  rationale: שׁמר का मूल भाव ‘रखना/सुरक्षित रखना’ है; इस संदर्भ में इसका अर्थ कही गई बात को ध्यान में बनाए रखना और उस पर विचार करते रहना है।
- source_word: אֶת־הַדָּבָר
  choice: इस बात को
  rationale: דבר का अर्थ ‘वचन,’ ‘बात,’ या ‘मामला’ हो सकता है। यहाँ यह यूसुफ द्वारा सुनाए गए स्वप्न और उसके आशय की ओर संकेत करता है; ‘इस बात’ सहज हिन्दी है और स्रोत की अर्थ-व्याप्ति बनाए रखता है।
