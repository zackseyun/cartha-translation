base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/027.yaml
  text: Come[a], let us sell him to the Ishmaelites, and let not our hand be upon him, for he is our brother[c][b], our own flesh.” And his brothers listened.
translation:
  language: hi
  text: “आओ, हम उसे इश्माएलियों को बेच दें और उस पर अपना हाथ न उठाएँ[a], क्योंकि वह हमारा भाई, हमारा अपना मांस[b] है।” तब उसके भाइयों ने उसकी बात सुनी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “हमारा हाथ उस पर न हो”; आशय है कि वे स्वयं उसे हानि न पहुँचाएँ।'
    reason: lexical_alternative
  - marker: b
    text: अर्थात “हमारा अपना कुटुम्ब” या “हमारा रक्त-संबंधी।”
    reason: lexical_alternative
  - marker: c
    text: “उसकी बात सुनी” का अर्थ यहाँ “उसकी बात मान ली” या “उससे सहमत हुए” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: आओ
  rationale: बहुवचन आज्ञार्थक रूप यहाँ किसी कार्य के लिए उकसाने वाला मुहावरा है; ‘आओ’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: וְנִמְכְּרֶנּוּ
  choice: हम उसे ... बेच दें
  rationale: प्रथम पुरुष बहुवचन का इच्छार्थक भाव सामूहिक प्रस्ताव व्यक्त करता है; ‘बेच दें’ उस भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: לַיִּשְׁמְעֵאלִים
  choice: इश्माएलियों को
  rationale: यह पूर्वसर्ग सहित जातिनाम है और बिक्री के प्राप्तकर्ता को दर्शाता है।
- source_word: וְיָדֵנוּ אַל תְּהִי בוֹ
  choice: उस पर अपना हाथ न उठाएँ
  rationale: शाब्दिक चित्र ‘हमारा हाथ उस पर न हो’ है; हिन्दी मुहावरा ‘हाथ न उठाना’ सीधे हिंसा न करने का अर्थ स्पष्ट करते हुए हाथ की मूल छवि बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह यहूदा के प्रस्ताव का कारण प्रस्तुत करता है।
- source_word: אָחִינוּ
  choice: हमारा भाई
  rationale: मूल का सीधा निकट संबंध-सूचक अर्थ सुरक्षित रखा गया है।
- source_word: בְשָׂרֵנוּ
  choice: हमारा अपना मांस
  rationale: यहाँ ‘मांस’ रक्त-संबंध और निकट कुटुम्बता का ठोस इब्रानी रूपक है; ‘अपना’ हिन्दी में उसके आत्मीय बल को स्पष्ट करता है।
- source_word: וַיִּשְׁמְעוּ אֶחָיו
  choice: तब उसके भाइयों ने उसकी बात सुनी
  rationale: שׁמע का अर्थ सुनना, ध्यान देना या मान लेना हो सकता है। ‘बात सुनी’ मूल की अर्थगत खुलावट को रखता है, जबकि प्रसंग में सहमति का संकेत भी देता है।
