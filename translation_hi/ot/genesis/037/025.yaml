base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/025.yaml
  text: Then they sat down to eat bread, and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites was coming from Gilead, with their camels carrying gum, balm, and myrrh, on their way to take it down to Egypt.
translation:
  language: hi
  text: तब वे भोजन करने बैठ गए। उन्होंने आँखें उठाकर देखा, तो गिलाद से इश्माएलियों का एक कारवाँ आ रहा था। उनके ऊँट सुगंधित गोंद, बाम और लादानम[a] लादे हुए थे, और वे इन्हें मिस्र ले जा रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लादानम’ एक सुगंधित राल थी; इस इब्रानी शब्द से अभिप्रेत पदार्थ की पहचान पूरी तरह निश्चित नहीं है।
    reason: दुर्लभ इब्रानी शब्द לֹט की वनस्पतिक पहचान संबंधी अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: לֶאֱכָל לֶחֶם
  choice: खाना खाने
  rationale: शाब्दिक अर्थ ‘रोटी खाने’ है, पर इब्रानी में לֶחֶם भोजन के लिए भी प्रयुक्त होता है; प्रसंग में स्वाभाविक आधुनिक हिन्दी ‘खाना खाने’ है।
- source_word: אֹרְחַת יִשְׁמְעֵאלִים
  choice: इश्माएलियों का एक कारवाँ
  rationale: אֹרְחָה यात्रियों, विशेषतः व्यापारियों, के दल को सूचित करता है; ‘कारवाँ’ हिन्दी में सटीक और सहज है।
- source_word: נְכֹאת
  choice: सुगंधित गोंद
  rationale: इस दुर्लभ व्यापारिक पदार्थ की पहचान निश्चित नहीं है; सामान्य श्रेणी ‘सुगंधित गोंद’ अनावश्यक अति-विशिष्टता से बचाती है।
- source_word: צְרִי
  choice: बलसान
  rationale: यह औषधीय अथवा सुगंधित वृक्ष-राल/बाम को सूचित करता है; ‘बलसान’ वस्तु की प्राचीन व्यापारिक प्रकृति बनाए रखता है।
- source_word: לֹט
  choice: लादानम
  rationale: संभवतः सुगंधित राल ladanum है; इसे ‘गन्धरस’ कहना अनिश्चित पहचान को myrrh के साथ मिला सकता है।
- source_word: לְהוֹרִיד מִצְרָיְמָה
  choice: मिस्र ले जा रहे थे
  rationale: मूल का ‘मिस्र की ओर नीचे ले जाना’ हिन्दी में गंतव्य-केंद्रित स्वाभाविक रूप में व्यक्त किया गया है।
