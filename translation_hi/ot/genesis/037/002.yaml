  text: אֵ֣לֶּה תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן שְׁבַֽע עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת אֶחָי/ו֙ בַּ/צֹּ֔אן וְ/ה֣וּא נַ֗עַר אֶת בְּנֵ֥י בִלְהָ֛ה וְ/אֶת בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑י/ו וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת דִּבָּתָ֥/ם רָעָ֖ה אֶל אֲבִי/הֶֽם׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
translation:
  language: hi
  text: याकूब का वंश-वृत्तांत यह है:[a] यूसुफ सत्रह वर्ष का था। वह अपने भाइयों के साथ भेड़-बकरियाँ चराता था। वह युवक था और बिल्हा के पुत्रों तथा जिल्पा के पुत्रों के साथ था; बिल्हा और जिल्पा उसके पिता की पत्नियाँ थीं। यूसुफ उनके बारे में बुरी खबर उनके पिता के पास लाया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याकूब का वृत्तांत यह है।” इब्रानी शब्द तोलेदोत उत्पत्ति में प्रायः एक नए खंड का आरम्भ करता है और केवल जैविक वंशजों को नहीं, बल्कि किसी व्यक्ति से आगे बढ़ने वाले पारिवारिक इतिहास को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में “उनके पिता” है; बहुवचन संबंधवाचक रूप याकूब को यूसुफ और उसके भाइयों के साझा पिता के रूप में प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּלְדוֹת
  choice: वंश-वृत्तांत
  rationale: उत्पत्ति में यह शब्द प्रायः किसी नए खंड का संरचनात्मक शीर्षक है और किसी व्यक्ति से आगे बढ़ने वाले वंश तथा इतिहास, दोनों को समेट सकता है। ‘वंश-वृत्तांत’ इस दोहरे भाव को केवल ‘वंशावली’ की अपेक्षा अधिक अच्छी तरह सुरक्षित रखता है।
- source_word: הָיָה רֹעֶה
  choice: चराता था
  rationale: कृदंतयुक्त रचना लगातार चल रही चरवाही की गतिविधि बताती है; आधुनिक हिन्दी में ‘भेड़-बकरियाँ चराता था’ स्वाभाविक है।
- source_word: צֹּאן
  choice: भेड़-बकरियाँ
  rationale: इब्रानी सामूहिक संज्ञा छोटे पालतू पशुओं, विशेषतः भेड़ों और बकरियों के झुंड, को दर्शा सकती है। हिन्दी में यह युग्म अर्थ को सहज रूप से व्यक्त करता है।
- source_word: נַעַר
  choice: युवक
  rationale: यूसुफ की आयु सत्रह वर्ष बताई गई है; इसलिए ‘युवक’ उपयुक्त है और ‘बालक’ की अपेक्षा आयु-संदर्भ से बेहतर मेल खाता है।
- source_word: אֶת בְּנֵי בִלְהָה וְאֶת בְּנֵי זִלְפָּה
  choice: बिल्हा के पुत्रों तथा जिल्पा के पुत्रों के साथ था
  rationale: यह रचना व्याकरण की दृष्टि से कठिन है। ‘के साथ था’ संगति का न्यूनतम व्याख्यात्मक और स्वाभाविक हिन्दी रूप है; इससे सेवक होने जैसा अनिश्चित अर्थ नहीं जोड़ा गया।
- source_word: נְשֵׁי אָבִיו
  choice: उसके पिता की पत्नियाँ
  rationale: सीधा संबंधवाचक पदबंध है, जो बिल्हा और जिल्पा की पहचान याकूब की पत्नियों के रूप में कराता है।
- source_word: דִּבָּתָם רָעָה
  choice: उनके बारे में बुरी खबर
  rationale: यह पदबंध उनके विषय में प्रतिकूल सूचना या विवरण बताता है। ‘बुरी खबर’ सहज आधुनिक हिन्दी है और इसे अनावश्यक रूप से झूठी निंदा नहीं ठहराता।
- source_word: אֶל אֲבִיהֶם
  choice: उनके पिता के पास
  rationale: मूल में बहुवचन संबंधवाचक प्रत्यय है—‘उनके पिता’; इसे ‘अपने पिता’ बनाकर समतल नहीं किया गया।
