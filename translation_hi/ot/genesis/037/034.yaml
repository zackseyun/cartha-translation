  text: Then Jacob tore his clothes[a], put sackcloth around his waist, and mourned for his son many days.
translation:
  language: hi
  text: तब याकूब ने अपने कपड़े फाड़े, अपनी कमर पर टाट बाँधा और बहुत दिनों तक अपने बेटे के लिए शोक मनाता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרַע
  choice: फाड़े
  rationale: शोक के प्रसंग में קרע कपड़े फाड़ने की ठोस और प्रचलित क्रिया को व्यक्त करता है; ‘फाड़े’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: שִׂמְלֹתָיו
  choice: अपने कपड़े
  rationale: שִׂמְלָה सामान्य रूप से वस्त्र या कपड़ों को दर्शाता है; ‘कपड़े’ सहज और व्यापक है।
- source_word: שַׂק
  choice: टाट
  rationale: שַׂק शोक के समय पहने या लपेटे जाने वाले खुरदरे वस्त्र को दर्शाता है; हिन्दी बाइबलीय और सामान्य प्रयोग में ‘टाट’ संक्षिप्त और परिचित है।
- source_word: בְּמָתְנָיו
  choice: अपनी कमर पर
  rationale: מָתְנַיִם कमर/कटि-प्रदेश को दर्शाता है; ‘कमर पर’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וַיִּתְאַבֵּל
  choice: शोक मनाता रहा
  rationale: אבל का हित्पएल रूप शोक की अवस्था और उससे जुड़े व्यवहार को व्यक्त करता है; ‘शोक मनाता रहा’ अवधि और निरंतरता दोनों को स्वाभाविक रूप से दर्शाता है।
- source_word: עַל־בְּנוֹ
  choice: अपने बेटे के लिए
  rationale: शोक-संबंधी प्रयोग में עַל को हिन्दी में स्वाभाविक रूप से ‘के लिए’ कहा जा सकता है।
- source_word: יָמִים רַבִּים
  choice: बहुत दिनों तक
  rationale: शाब्दिक अर्थ ‘बहुत दिन’ है; हिन्दी में अवधि बताने के लिए ‘बहुत दिनों तक’ अधिक स्वाभाविक है।
