base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/001.yaml
  text: Jacob lived in the land of his father's sojournings[a], in the land of Canaan.
translation:
  language: hi
  text: याकूब उस देश में रहने लगा जहाँ उसके पिता ने परदेशी के रूप में निवास किया था—कनान देश में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: और याकूब … रहने लगा
  rationale: ישׁב का अर्थ यहाँ निवास करना है; वय्यिक्तोल कथा को आगे बढ़ाता है, इसलिए आरंभिक וַ को स्वाभाविक हिन्दी में ‘और’ से व्यक्त किया गया है। ‘रहने लगा’ नए कथात्मक खंड में याकूब के निवास पर ध्यान लाता है, पर स्थायी स्वामित्व का भाव नहीं जोड़ता।
- source_word: בְּאֶרֶץ
  choice: देश में / उस देश में
  rationale: אֶרֶץ भौगोलिक भूभाग के लिए है। हिन्दी में ‘देश’ स्वाभाविक है; दूसरी आवृत्ति को ‘उस देश’ के रूप में रखकर मूल की पुनरुक्ति और समानाधिकरण-संबंध सुरक्षित रखा गया है।
- source_word: מְגוּרֵי אָבִיו
  choice: जहाँ उसका पिता परदेशी होकर रहा था
  rationale: מְגוּרִים में केवल सामान्य निवास नहीं, बल्कि परदेशी या प्रवासी के रूप में रहने का भाव है। संबंधवाचक उपवाक्य आधुनिक हिन्दी में मूल अर्थ को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: यह भूभाग की स्पष्ट पहचान है। ‘कनान देश’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक और सटीक है।
theological_decisions:
- issue: इसहाक के निवास की स्थिति
  choice: ‘परदेशी होकर रहा था’ द्वारा अस्थायी/गैर-मूलनिवासी निवास का भाव बनाए रखा गया
  alternative: ‘जहाँ उसका पिता रहता था’
  rationale: सामान्य ‘रहता था’ מְגוּרֵי में निहित परदेशी निवास के महत्त्वपूर्ण भाव को मिटा देता। यह भूमि की प्रतिज्ञा और तत्कालीन निवास के बीच मूल पाठ के तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की दोहरी ‘देश में’ संरचना को हिन्दी वाक्य-विन्यास में स्वाभाविक रूप से पुनर्स्थापित किया गया है।
