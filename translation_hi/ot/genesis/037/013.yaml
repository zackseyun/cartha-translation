base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/013.yaml
  text: Then Israel said to Joseph[a], “Are not your brothers shepherding at Shechem? Come, and I will send you to them.” And he said to him, “Here I am.”
translation:
  language: hi
  text: तब इस्राएल ने यूसुफ से कहा, “क्या तुम्हारे भाई शकेम में झुंड चरा रहे हैं?[a] आओ, मैं तुम्हें उनके पास भेजूँ।” उसने उससे कहा, “मैं तैयार हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झुंड की देखभाल कर रहे हैं।”
    reason: רֹעִים केवल चराने नहीं, झुंड की देखभाल करने का व्यापक अर्थ भी दे सकता है।
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल इब्रानी पाठ में यहाँ याकूब नहीं, व्यक्तिगत नाम ‘इस्राएल’ है; इसलिए उसी का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: यह सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है; हिन्दी में ‘क्या ... नहीं’ उसके प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: אַחֶיךָ
  choice: तुम्हारे भाई
  rationale: पुल्लिंग बहुवचन संज्ञा पर द्वितीय पुरुष एकवचन प्रत्यय यूसुफ के भाइयों की ओर स्पष्ट संकेत करता है।
- source_word: רֹעִים
  choice: भेड़-बकरियाँ ... चरा रहे हैं
  rationale: רעה का कृदन्त पशुधन को चराने और उसकी देखभाल करने की गतिविधि बताता है। हिन्दी में यह प्रयोग प्रसंगानुकूल और सहज है; पशु-समूह कर्म मूल में अंतर्निहित है।
- source_word: בִּשְׁכֶם
  choice: शकेम में
  rationale: בְּ स्थानसूचक है और ‘शकेम में’ आधुनिक हिन्दी में स्वाभाविक है; स्थाननाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: לְכָה
  choice: आओ
  rationale: यह पुल्लिंग एकवचन आज्ञार्थक रूप यहाँ बुलावे/प्रेरणा के रूप में प्रयुक्त है; ‘आओ’ उसके सीधे स्वर को बनाए रखता है।
- source_word: וְאֶשְׁלָחֲךָ
  choice: मैं तुम्हें ... भेजूँ
  rationale: पहले पुरुष के इच्छार्थक रूप को ‘मैं ... भेजूँ’ से व्यक्त किया गया है, जो बुलावे के बाद उद्देश्य/प्रस्ताव की छाया को साधारण भविष्य ‘भेजूँगा’ से बेहतर बनाए रखता है।
- source_word: אֲלֵיהֶם
  choice: उनके पास
  rationale: सर्वनाम पहले उल्लिखित भाइयों की ओर लौटता है; व्यक्तियों के गंतव्य के लिए ‘उनके पास’ स्वाभाविक हिन्दी है।
- source_word: הִנֵּנִי
  choice: मैं उपस्थित हूँ
  rationale: यह स्वयं को तत्परता से प्रस्तुत करने का इब्रानी कथात्मक सूत्र है। ‘मैं उपस्थित हूँ’ शाब्दिक उपस्थिति और प्रत्युत्तर की तत्परता दोनों को गरिमापूर्ण हिन्दी में व्यक्त करता है।
