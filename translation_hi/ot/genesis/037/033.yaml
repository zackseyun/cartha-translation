  yaml_path: translation/ot/genesis/037/033.yaml
  text: He recognized it and said[a], “It is my son’s tunic. A wild animal has devoured him[c][b]. Yosef has surely been torn to pieces.”
translation:
  language: hi
  text: उसने उसे पहचान लिया और कहा, “यह मेरे बेटे का अंगरखा है। एक हिंसक जंगली पशु ने उसे खा लिया है। योसेफ़ को निश्चय ही फाड़ डाला गया है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में क्रिया को दोहराकर बल दिया गया है: “फाड़ा गया—निश्चय ही फाड़ा गया।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכִּירָהּ
  choice: उसने उसे पहचान लिया
  rationale: हिफ़इल रूप का अर्थ ‘पहचानना’ है। स्त्रीलिंग कर्म-प्रत्यय अंगरखे की ओर संकेत करता है; हिन्दी में उसके लिए स्वाभाविक रूप से ‘उसे’ आया है।
- source_word: כְּתֹנֶת בְּנִי
  choice: मेरे बेटे का अंगरखा
  rationale: כְּתֹנֶת शरीर पर पहने जाने वाले लंबे वस्त्र को दर्शाता है। ‘अंगरखा’ सामान्य ‘कपड़े’ से अधिक विशिष्ट और प्रसंगानुकूल है।
- source_word: חַיָּה רָעָה
  choice: किसी जंगली पशु
  rationale: प्रसंग में חַיָּה वन्य पशु है। רָעָה उसकी हानिकारक या हिंसक प्रकृति बताता है; मुख्य पाठ में सहज हिन्दी ‘जंगली पशु’ रखी गई और अधिक शब्दशः अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֲכָלָתְהוּ
  choice: उसे खा लिया है
  rationale: क्रिया का सीधा अर्थ ‘खा लेना’ है। पशु के आक्रमण के प्रसंग में यह स्वाभाविक है और ‘निगल गया’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: טָרֹף טֹרַף
  choice: निश्चय ही फाड़ डाला गया है
  rationale: क्रिया के पूर्व धात्वर्थक infinitive absolute उसी क्रिया को प्रबल करता है। ‘निश्चय ही’ इस बल को सहज हिन्दी में व्यक्त करता है और निष्क्रिय रूप मूल संरचना को बनाए रखता है।
- source_word: יוֹסֵף
  choice: योसेफ़
  rationale: यह रूप इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण है।
