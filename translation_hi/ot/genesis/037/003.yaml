  text: וְ/יִשְׂרָאֵ֗ל אָהַ֤ב אֶת יוֹסֵף֙ מִ/כָּל בָּנָ֔י/ו כִּֽי בֶן זְקֻנִ֥ים ה֖וּא ל֑/וֹ וְ/עָ֥שָׂה ל֖/וֹ כְּתֹ֥נֶת פַּסִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/003.yaml
  text: Israel loved Joseph more than all his sons[a], because he was the son of his old age; and he made for him a richly ornamented robe.
translation:
  language: hi
  text: इस्राएल अपने सभी पुत्रों से अधिक यूसुफ से प्रेम करता था, क्योंकि वह उसके बुढ़ापे का पुत्र था; और उसने उसके लिए एक विशेष रूप से सजा हुआ चोगा[a] बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “अनेक रंगों वाला चोगा।” हिब्रू पद का अर्थ अनिश्चित है; इसका संकेत विशेष रूप से सजे हुए वस्त्र की ओर हो सकता है, या ऐसे वस्त्र की ओर जो कलाइयों और टखनों तक पहुँचता था—यह आवश्यक नहीं कि वह विशेषतः उसके रंगों को सूचित करे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ में व्यक्तिगत नाम ‘इस्राएल’ है; इसलिए ‘याकूब’ से प्रतिस्थापित नहीं किया गया। आरंभिक וְ को हिन्दी कथा-प्रवाह में अलग शब्द के रूप में व्यक्त करना आवश्यक नहीं है।
- source_word: אָהַב
  choice: प्रेम करता था
  rationale: क्रिया का सामान्य अर्थ ‘प्रेम करना’ है। प्रसंग में पक्षपात निहित है, फिर भी मुख्य पाठ में मूल क्रिया की शक्ति सुरक्षित रखी गई है।
- source_word: מִכָּל בָּנָיו
  choice: अपने सब पुत्रों से बढ़कर
  rationale: מִן के तुलनात्मक अर्थ और ‘उसके सब पुत्रों’—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह इस्राएल के विशेष प्रेम का कारण प्रस्तुत करता है।
- source_word: בֶן זְקֻנִים הוּא לוֹ
  choice: वह उसके बुढ़ापे का पुत्र था
  rationale: हिब्रू मुहावरे को निकटता से रखते हुए सम्बन्ध स्पष्ट किया गया है; ‘उसके’ का संकेत इस्राएल की ओर है।
- source_word: וְעָשָׂה לוֹ
  choice: और उसने उसके लिए … बनवाया
  rationale: वाक्य इस्राएल को वस्त्र की व्यवस्था कराने वाला बताता है। हिन्दी में किसी प्रतिष्ठित व्यक्ति द्वारा वस्त्र तैयार कराने के लिए ‘बनवाया’ अधिक स्वाभाविक है, यद्यपि हिब्रू क्रिया शाब्दिक रूप से ‘बनाया’ है।
- source_word: כְּתֹנֶת
  choice: चोगा
  rationale: यह शरीर पर पहने जाने वाले वस्त्र को सूचित करता है। ‘चोगा’ सामान्य हिन्दी पाठक के लिए ‘कुर्ता’ या तकनीकी ‘अंगरखा’ की अपेक्षा इस कथा में अधिक सुबोध है।
- source_word: פַּסִּים
  choice: विशेष रूप से सजा हुआ
  rationale: शब्द का सटीक अर्थ अनिश्चित है। यह चयन वस्त्र की विशिष्टता दर्शाता है, पर रंगों या लंबी बाँहों की किसी एक विवादित व्याख्या को निश्चित नहीं बनाता।
