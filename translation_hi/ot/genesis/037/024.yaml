  yaml_path: translation/ot/genesis/037/024.yaml
  text: Then they took him and threw him into the pit[a]. Now the pit was empty; there was no water in it.
translation:
  language: hi
  text: तब उन्होंने उसे लिया और उस गड्ढे[a] में फेंक दिया। गड्ढा खाली था; उसमें पानी नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जलकुंड”; इब्रानी शब्द בּוֹר पानी जमा करने के लिए बने गड्ढे या जलकुंड को भी सूचित कर सकता है। आगे यह कहना कि उसमें पानी नहीं था, इसी अर्थ के अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֻהוּ
  choice: तब उन्होंने उसे पकड़कर
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है। לקח का मूल अर्थ ‘लेना’ है, पर इस हिंसक प्रसंग में ‘पकड़ना’ सहज हिन्दी है और ‘धर दबोचना’ जैसी अधिक तीव्र व्याख्या से बचता है।
- source_word: וַיַּשְׁלִכוּ אֹתוֹ
  choice: उसे ... फेंक दिया
  rationale: השליך का सामान्य अर्थ ‘फेंकना/डालना’ है। ‘फेंक दिया’ आधुनिक हिन्दी में स्पष्ट है और क्रिया की हिंसक प्रकृति को बिना बढ़ाए व्यक्त करता है।
- source_word: הַבֹּרָה
  choice: उस गड्ढे में
  rationale: בּוֹר गड्ढे, जलकुंड या हौद-सदृश भूमिगत स्थान को सूचित कर सकता है। ‘गड्ढा’ अर्थ को व्यापक रखता है; जलकुंड की सम्भावना पादटिप्पणी में दी गई है। दिशासूचक ה को हिन्दी का ‘में’ व्यक्त करता है।
- source_word: וְהַבּוֹר רֵק
  choice: गड्ढा खाली था
  rationale: यह अगला खंड गड्ढे की दशा बताने वाला व्याख्यात्मक कथन है। हिन्दी में अलग वाक्य बिना अनावश्यक संयोजक के स्वाभाविक है। רֵק का सीधा अर्थ ‘खाली’ है।
- source_word: אֵין בּוֹ מָיִם
  choice: उसमें पानी नहीं था
  rationale: यह स्पष्ट करता है कि गड्ढा किस अर्थ में खाली था। अनुवाद पानी के स्पष्ट उल्लेख और इब्रानी अस्तित्ववाचक निषेध—दोनों को बनाए रखता है।
