  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में सहज रखी गई है। भाइयों के संयुक्त षड्यंत्र और अंतिम उपहासपूर्ण चुनौती को स्पष्ट किया गया है; मूल की संभावित शब्दार्थगत विविधता पादटिप्पणियों में सुरक्षित है।
