review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the brothers’ joint proposal, killing, casting Joseph into a pit, fabricating an animal attack, and the taunting conclusion. However, “इन गड्ढों” introduces a demonstrative (“these”) absent from בְּאַחַד הַבֹּרוֹת, and “इसलिए” makes the discourse connection more explicitly inferential than the Hebrew requires. The adjective רָעָה should also be represented in the main text rather than only in a note.
  naturalness: The Hindi is clear and appropriately grave. “अब आओ” is more direct and idiomatic for the exhortative לְכוּ, and removing “इन” makes the phrase natural without adding information.
  terminology: “गड्ढा” is a sound general rendering of בּוֹר; the cistern alternative is properly retained in a note. “हिंसक जंगली पशु” retains both components of חַיָּה רָעָה in a modern, formal register.
  issues:
  - severity: medium
    issue: “इन गड्ढों में से” adds a demonstrative not present in the Hebrew.
    rationale: The source says simply “into one of the pits/cisterns.” “गड्ढों में से किसी एक में” preserves the indefinite reference.
  - severity: low
    issue: “इसलिए अब” is stronger than the source discourse marker.
    rationale: וְעַתָּה can naturally be rendered “अब” or “तो अब”; “इसलिए” adds a specific logical inference. “अब आओ” retains urgency without over-specifying the connection.
  - severity: medium
    issue: The main text omits the qualifying force of רָעָה in חַיָּה רָעָה.
    rationale: While “जंगली जानवर” is possible in context, the modifying adjective should normally be represented in the translation itself. “हिंसक जंगली पशु” does so without excessive interpretive force.
  revised_text: “अब आओ, हम उसे मार डालें और गड्ढों[a] में से किसी एक में फेंक दें। फिर हम कहेंगे, ‘एक हिंसक जंगली पशु[b] उसे खा गया।’ तब हम देखेंगे कि उसके सपनों का क्या होता है।”
