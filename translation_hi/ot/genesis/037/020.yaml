id: GEN.37.20
reference: Genesis 37:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֣ה לְכ֣וּ וְ/נַֽהַרְגֵ֗/הוּ וְ/נַשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הַ/בֹּר֔וֹת וְ/אָמַ֕רְנוּ חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְ/הוּ וְ/נִרְאֶ֕ה מַה יִּהְי֖וּ חֲלֹמֹתָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/020.yaml
  text: So now[a], come, let us kill him and throw him into one of the pits, and we will say[b], ‘A wild animal has devoured him.’ Then we will see what becomes of his dreams.’
translation:
  language: hi
  text: “अब आओ, हम उसे मार डालें और गड्ढों[a] में से किसी एक में फेंक दें। फिर हम कहेंगे, ‘एक हिंसक जंगली पशु[b] उसे खा गया।’ तब हम देखेंगे कि उसके सपनों का क्या होता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जलकुंडों।” इब्रानी शब्द בּוֹר प्रसंग के अनुसार गड्ढे, जलकुंड या कुएँ जैसी जल-संग्रह की जगह के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “एक जंगली पशु।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: संयोजक और कालसूचक दोनों भावों को रखते हुए तत्काल प्रस्ताव की ओर स्वाभाविक संक्रमण व्यक्त करता है।
- source_word: לְכוּ
  choice: आओ
  rationale: बहुवचन आज्ञार्थक यहाँ कहीं जाने की शाब्दिक आज्ञा नहीं, बल्कि साझा कार्रवाई के लिए आह्वान है।
- source_word: וְנַהַרְגֵהוּ
  choice: हम उसे मार डालें
  rationale: प्रथम पुरुष बहुवचन के संकल्पात्मक भाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְנַשְׁלִכֵהוּ
  choice: फेंक दें
  rationale: मूल क्रिया के फेंकने या डाल देने के अर्थ को वर्तमान, सहज हिन्दी में रखता है।
- source_word: בְּאַחַד הַבֹּרוֹת
  choice: इन गड्ढों में से किसी एक में
  rationale: בּוֹר के व्यापक अर्थ के लिए ‘गड्ढा’ स्पष्ट सामान्य शब्द है; प्रसंग में जलकुंड भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: וְאָמַרְנוּ
  choice: फिर हम कहेंगे
  rationale: योजना में अगली भावी कार्रवाई को स्वाभाविक क्रम में व्यक्त करता है।
- source_word: חַיָּה רָעָה
  choice: कोई जंगली जानवर
  rationale: प्रसंग में घातक वन्य पशु का भाव है। मुख्य पाठ में सहज पद रखा गया है और רָעָה के अधिक स्पष्ट ‘हिंसक’ भाव को पादटिप्पणी में दिया गया है।
- source_word: אֲכָלָתְהוּ
  choice: उसे खा गया
  rationale: मूल की सामान्य ‘खाना’ क्रिया को अनावश्यक तीव्रता जोड़े बिना सीधे रूप में प्रस्तुत करता है।
- source_word: וְנִרְאֶה
  choice: तब हम देखेंगे
  rationale: भाइयों की योजना के परिणामी और उपहासपूर्ण भाव को व्यक्त करता है, जबकि रूप में संभावित संकल्पात्मक छाया को पूरी तरह कठोर नहीं बनाता।
- source_word: מַה יִּהְיוּ חֲלֹמֹתָיו
  choice: उसके सपनों का क्या होता है
  rationale: शाब्दिक संरचना की असहजता से बचते हुए सपनों के भावी परिणाम को चुनौती देने वाला मूल भाव सुरक्षित रखता है।
