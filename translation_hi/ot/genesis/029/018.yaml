  text: וַ/יֶּאֱהַ֥ב יַעֲקֹ֖ב אֶת רָחֵ֑ל וַ/יֹּ֗אמֶר אֶֽעֱבָדְ/ךָ֙ שֶׁ֣בַע שָׁנִ֔ים בְּ/רָחֵ֥ל בִּתְּ/ךָ֖ הַ/קְּטַנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/018.yaml
  text: Jacob loved Rachel[a], and he said, “I will serve you seven years for Rachel your younger daughter.”
translation:
  language: hi
  text: याकूब राहेल से प्रेम करता था[a]। उसने कहा, “तुम्हारी छोटी बेटी राहेल के लिए मैं सात वर्ष तुम्हारी सेवा करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “और याकूब राहेल से प्रेम करता था।” आरंभ का संयोजक केवल कथा को आगे बढ़ाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: प्रेम करता था
  rationale: אָהַב का सीधा अर्थ प्रेम करना है। हिन्दी में अपूर्ण भूतकाल यहाँ याकूब के निरंतर प्रेम को स्वाभाविक ढंग से व्यक्त करता है; ‘प्रेम में पड़ा था’ स्रोत से अधिक व्याख्यात्मक होता।
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: אמר प्रत्यक्ष कथन का सामान्य परिचायक है; ‘कहा’ बिना अतिरिक्त अर्थ जोड़े इसका सीधा अनुवाद है।
- source_word: אֶעֱבָדְךָ
  choice: मैं ... तुम्हारी सेवा करूँगा
  rationale: עבד यहाँ लाबान के अधीन श्रम करने को दर्शाता है। ‘सेवा करूँगा’ श्रम और संबंध दोनों को बनाए रखता है, जबकि ‘काम करूँगा’ अधिक सामान्य विकल्प है।
- source_word: שֶׁבַע שָׁנִים
  choice: सात वर्ष
  rationale: संख्या और संज्ञा का सीधा, स्पष्ट तथा गरिमापूर्ण हिन्दी रूप।
- source_word: בְּרָחֵל
  choice: राहेल के लिए
  rationale: यहाँ ב सेवा के आधार अथवा विवाह-संबंधी विनिमय को सूचित करता है। ‘के लिए’ स्वाभाविक है और ‘बदले में’ जैसी अधिक स्पष्ट व्याख्या नहीं जोड़ता।
- source_word: בִּתְּךָ
  choice: तुम्हारी ... बेटी
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित पद का सीधा अनुवाद।
- source_word: הַקְּטַנָּה
  choice: छोटी
  rationale: पारिवारिक तुलना में קָטָן आयु की दृष्टि से छोटी संतान को दर्शाता है। आधुनिक हिन्दी में ‘छोटी बेटी’ स्वाभाविक रूप से ‘कम आयु वाली बेटी’ समझा जाता है।
- source_word: וַ
  choice: वाक्य-क्रम द्वारा व्यक्त
  rationale: आरंभिक वाव कथा को आगे बढ़ाता है। हिन्दी में अलग वाक्य और क्रमबद्ध वर्णन वही कार्य स्वाभाविक रूप से करते हैं; ‘और’ भी अधिक औपचारिक विकल्प है।
