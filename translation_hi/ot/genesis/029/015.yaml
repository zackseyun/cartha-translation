base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/015.yaml
  text: Then Laban said to Jacob[a], “Because you are my relative, should you work for me for nothing? Tell me, what your wages should be.”
translation:
  language: hi
  text: तब लाबान ने याकूब से कहा, “क्या केवल इसलिए कि तुम मेरे संबंधी[a] हो, तुम मेरे लिए बिना मज़दूरी के काम करोगे? मुझे बताओ कि तुम्हारी मज़दूरी क्या होनी चाहिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘मेरा भाई’; यहाँ यह शब्द व्यापक अर्थ में किसी संबंधी या कुटुंबी के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי
  choice: क्या केवल इसलिए कि
  rationale: 'यह पदबंध लाबान के अलंकारिक प्रश्न का आधार प्रकट करता है: केवल रिश्तेदारी के कारण याकूब से बिना पारिश्रमिक काम कराना उचित नहीं। प्रश्नात्मक रूप हिब्रू की संरचना और भाव दोनों को बनाए रखता है।'
- source_word: אָחִי
  choice: मेरे भाई[a]
  rationale: हिब्रू शब्द का मूल अर्थ ‘मेरा भाई’ है, पर यहाँ वह निकट संबंधी के व्यापक अर्थ में प्रयुक्त है, क्योंकि याकूब लाबान का भांजा है। मुख्य पाठ में मूल रूप रखा गया है और पादटिप्पणी अर्थ स्पष्ट करती है।
- source_word: וַעֲבַדְתַּנִי
  choice: तुम मेरे लिए ... काम करोगे
  rationale: संदर्भ में עבד लाबान के लिए श्रम करने को दर्शाता है। आधुनिक हिन्दी में ‘काम करोगे’ स्वाभाविक है और आगे आने वाली मज़दूरी की बात से स्पष्ट रूप से जुड़ता है।
- source_word: חִנָּם
  choice: बिना मज़दूरी के
  rationale: यहाँ अर्थ बिना प्रतिफल या वेतन के काम करना है। ‘बिना मज़दूरी के’ अगले वाक्य के מַשְׂכֻּרְתֶּךָ से शब्दगत संबंध भी बनाए रखता है।
- source_word: הַגִּידָה לִּי
  choice: मुझे बताओ
  rationale: आज्ञार्थक क्रिया और अप्रत्यक्ष कर्म का सहज, सीधा आधुनिक हिन्दी रूप।
- source_word: מַה מַשְׂכֻּרְתֶּךָ
  choice: तुम्हारी मज़दूरी क्या होनी चाहिए
  rationale: מַשְׂכֹּרֶת श्रम के बदले मिलने वाली मज़दूरी या वेतन है। बातचीत में पारिश्रमिक अभी तय किया जाना है, इसलिए ‘क्या होनी चाहिए’ प्रसंग के अनुकूल है।
