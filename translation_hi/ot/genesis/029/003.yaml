  text: וְ/נֶאֶסְפוּ שָׁ֣מָּ/ה כָל הָ/עֲדָרִ֗ים וְ/גָלֲל֤וּ אֶת הָ/אֶ֨בֶן֙ מֵ/עַל֙ פִּ֣י הַ/בְּאֵ֔ר וְ/הִשְׁק֖וּ אֶת הַ/צֹּ֑אן וְ/הֵשִׁ֧יבוּ אֶת הָ/אֶ֛בֶן עַל פִּ֥י הַ/בְּאֵ֖ר לִ/מְקֹמָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/003.yaml
  text: And all the flocks would gather there[a], and they would roll the stone away from the mouth of the well and water the flock[b], and then put the stone back in its place over the mouth of the well.
translation:
  language: hi
  text: और वहाँ सभी झुंड इकट्ठे हुआ करते थे। तब वे कुएँ के मुँह[a] पर से पत्थर लुढ़काकर हटाते, झुंड को पानी पिलाते, और फिर पत्थर को कुएँ के मुँह पर उसकी जगह वापस रख देते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “कुएँ का मुँह”; अर्थात कुएँ का खुला भाग।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶאֶסְפוּ
  choice: इकट्ठे हुआ करते थे
  rationale: निफ़अल अपूर्ण क्रिया इस वर्णन में बार-बार होने वाली अतीत की गतिविधि बताती है; यह हिंदी प्रयोग उस प्रचलित क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָל הָעֲדָרִים
  choice: भेड़ों के सब झुंड
  rationale: עדרים पशुओं के झुंडों को दर्शाता है; निकटवर्ती चरवाही संदर्भ में भेड़ों के झुंड स्पष्ट और स्वाभाविक है।
- source_word: וְגָלֲלוּ
  choice: लुढ़काकर हटा देते
  rationale: גלל पत्थर को लुढ़काने की ठोस क्रिया व्यक्त करता है, और हिंदी में 'हटा देते' उसके कुएँ के मुँह पर से दूर किए जाने को स्पष्ट करता है।
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: कुएँ के मुँह पर से
  rationale: פי הבאר का शाब्दिक बिंब सुरक्षित रखा गया है; यहाँ इसका अर्थ कुएँ का खुला भाग है। מעל को 'पर से' स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהִשְׁקוּ
  choice: पानी पिलाते
  rationale: शקה का हिफ़इल रूप पशुओं को पानी देने या पिलाने का अर्थ रखता है।
- source_word: אֶת הַצֹּאן
  choice: भेड़-बकरियों को
  rationale: צאן एक सामूहिक पद है जो छोटे पालतू पशुओं—विशेषतः भेड़ और बकरियों—को समेट सकता है; हिंदी में 'भेड़-बकरियाँ' इस दायरे को सहजता से दर्शाता है।
- source_word: וְהֵשִׁיבוּ
  choice: वापस रख देते
  rationale: שוב का हिफ़इल रूप किसी वस्तु को लौटाने का अर्थ देता है; पत्थर के लिए यह हिंदी में स्वाभाविक अभिव्यक्ति है।
- source_word: לִמְקֹמָהּ
  choice: उसकी जगह
  rationale: स्त्रीलिंग प्रत्यय पत्थर की नियत जगह की ओर संकेत करता है; लौटाने का भाव 'वापस' में पहले ही व्यक्त है।
