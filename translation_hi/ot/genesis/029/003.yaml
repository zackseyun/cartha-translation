  to: और वहाँ सभी झुंड इकट्ठे हुआ करते थे। तब वे कुएँ के मुँह[a] पर से पत्थर लुढ़काकर हटाते, झुंड को पानी पिलाते, और फिर पत्थर को कुएँ के मुँह पर उसकी जगह वापस रख देते थे।
  rationale: “चरवाहे” हटाकर “वे” रखा गया है, ताकि इब्रानी में अनुक्त रहने वाला कर्ता अनुक्त ही रहे। पशुओं के लिए दोनों स्थानों पर “झुंड” रखा गया है, जो मूल के सामूहिक पशुपालक पदों के अनुकूल है और अनावश्यक रूप से प्रजाति निर्दिष्ट नहीं करता।
