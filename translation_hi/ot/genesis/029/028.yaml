  yaml_path: translation/ot/genesis/029/028.yaml
  text: And Jacob did so[a], and he completed this week; then Laban gave him Rachel his daughter as his wife.
translation:
  language: hi
  text: याकूब ने वैसा ही किया और इस सप्ताह[क] को पूरा किया। तब लाबान ने अपनी बेटी राहेल को याकूब की पत्नी के रूप में दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “इस विवाह-सप्ताह को।” इब्रानी शब्द का शाब्दिक अर्थ सात की अवधि है; यहाँ सम्भवतः विवाह-उत्सव के सप्ताह का संकेत है।
    reason: 'सांस्कृतिक और शाब्दिक स्पष्टीकरण: इब्रानी שְׁבֻעַ का अर्थ सात की अवधि है और विवाह के संदर्भ में उसका सम्भावित विशेष अर्थ स्पष्ट करता है।'
lexical_decisions:
- source_word: וַיַּעַשׂ יַעֲקֹב כֵּן
  choice: याकूब ने वैसा ही किया
  rationale: עשה के साथ כֵּן पिछले पद में लाबान के निर्देश की ओर संकेत करता है; ‘वैसा ही किया’ इस संदर्भसूचक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיְמַלֵּא
  choice: पूरा किया
  rationale: מלא का पिएल रूप यहाँ किसी समयावधि को पूरा करने के अर्थ में है।
- source_word: שְׁבֻעַ זֹאת
  choice: वह सप्ताह
  rationale: शाब्दिक अर्थ सात की अवधि है; विवाह-संदर्भ में यह लिआ का विवाह-सप्ताह है। हिन्दी में ‘वह सप्ताह’ पिछले पद में उल्लिखित अवधि से इसका संबंध स्पष्ट करता है।
- source_word: וַיִּתֶּן לוֹ
  choice: तब लाबान ने ... उसे ... दे दी
  rationale: इब्रानी में कर्ता संदर्भ से लाबान है; हिन्दी में नाम स्पष्ट करना स्वाभाविक है। ‘तब’ घटनाक्रम को व्यक्त करता है।
- source_word: אֶת רָחֵל בִּתּוֹ
  choice: अपनी बेटी राहेल
  rationale: संबंध और नाम को स्वाभाविक आधुनिक हिन्दी क्रम में रखा गया है।
- source_word: לוֹ לְאִשָּׁה
  choice: उसे पत्नी के रूप में
  rationale: यह रचना किसी स्त्री को विवाह में पत्नी के रूप में देने का संकेत करती है; चयन आधुनिक और गरिमापूर्ण हिन्दी है।
