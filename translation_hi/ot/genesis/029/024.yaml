  text: And Laban gave Zilpah his female servant to Leah his daughter as a female servant[a][b].
translation:
  language: hi
  text: और लाबान ने अपनी दासी जिल्पा को अपनी बेटी लिआ को दासी के रूप में दे दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दासी’ के लिए प्रयुक्त इब्रानी शब्द आश्रित और संभवतः दासत्व की स्थिति वाली स्त्री सेविका को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: दे दिया
  rationale: נתן का सामान्य अर्थ ‘देना’ है। यहाँ ‘दे दिया’ हिन्दी कथात्मक शैली में स्वाभाविक है और किसी अतिरिक्त कानूनी अर्थ को आरोपित नहीं करता।
- source_word: לָהּ
  choice: उसे
  rationale: इब्रानी में स्त्रीलिंग सर्वनाम ‘उसे/उसको’ है। इसे बनाए रखने से मूल वाक्य की संरचना और उसका वास्तविक संदर्भ सुरक्षित रहता है।
- source_word: זִלְפָּה
  choice: जिल्पा
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुसार प्रस्तुत किया गया है।
- source_word: שִׁפְחָתוֹ
  choice: अपनी दासी
  rationale: שִׁפְחָה आश्रित और संभवतः दासत्व की स्थिति वाली स्त्री सेविका को सूचित करता है। ‘दासी’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी है; उसकी सामाजिक स्थिति को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לְלֵאָה בִתּוֹ
  choice: अपनी बेटी लिआ की
  rationale: לְ यहाँ प्राप्तकर्ता/संबंध को सूचित करता है। अंतिम भूमिका-संज्ञा के साथ स्वाभाविक हिन्दी में इसे ‘अपनी बेटी लिआ की दासी’ के रूप में व्यवस्थित किया गया है।
- source_word: שִׁפְחָה
  choice: दासी होने के लिए
  rationale: अंतिम שִׁפְחָה जिल्पा की दी गई भूमिका बताता है। ‘दासी होने के लिए’ हिन्दी में स्वाभाविक है और मूल में एक ही शब्द की पुनरावृत्ति को अर्थपूर्ण ढंग से बनाए रखता है।
