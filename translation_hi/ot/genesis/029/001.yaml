  rationale: शाब्दिक रूप से ‘याकूब ने अपने पैर उठाए’; यह इब्रानी मुहावरा उत्साह या दृढ़ता से यात्रा आगे बढ़ाने का संकेत देता है। आधुनिक हिन्दी में ‘चल पड़ा’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַרְצָה בְנֵי־קֶדֶם
  choice: पूर्व के लोगों के देश में
  rationale: בְּנֵי־קֶדֶם का शाब्दिक रूप ‘पूर्व के पुत्र’ है, पर यह पूर्व दिशा में रहने वाले लोगों के लिए सामूहिक अभिव्यक्ति है। ‘पूर्व के लोगों’ से आशय स्पष्ट रहता है और अनावश्यक वंशगत निष्कर्ष नहीं जुड़ता।
