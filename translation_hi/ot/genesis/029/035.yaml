source:
  edition: WLC
  text: וַ/תַּ֨הַר ע֜וֹד וַ/תֵּ֣לֶד בֵּ֗ן וַ/תֹּ֨אמֶר֙ הַ/פַּ֨עַם֙ אוֹדֶ֣ה אֶת יְהוָ֔ה עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ יְהוּדָ֑ה וַֽ/תַּעֲמֹ֖ד מִ/לֶּֽדֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/035.yaml
  text: And she conceived again and bore a son[a], and she said, “This time I will praise Yahweh.” Therefore she named him Judah. Then she stopped bearing children.
translation:
  language: hi
  text: और वह फिर गर्भवती हुई और उसने एक पुत्र को जन्म दिया। उसने कहा, “इस बार मैं याहवे की स्तुति करूँगी।” इसलिए उसने उसका नाम यहूदा रखा।[a] तब उसने सन्तान जनना बन्द कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यहूदा” नाम की ध्वनि उस इब्रानी क्रिया से मिलती है जिसका अर्थ “स्तुति करना” या “धन्यवाद देना” है।
    reason: नामकरण में निहित इब्रानी शब्द-क्रीड़ा हिन्दी में स्वतः सुनाई नहीं देती।
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: वह फिर गर्भवती हुई
  rationale: הרה गर्भ धारण करने को और עוֹד इस जन्म-क्रम में पुनरावृत्ति को व्यक्त करता है; आधुनिक हिन्दी में यह सहज और स्पष्ट है।
- source_word: וַתֵּלֶד בֵּן
  choice: उसने एक पुत्र को जन्म दिया
  rationale: यह ילד और בן के सामान्य प्रसव-संबंधी अर्थ को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הַפַּעַם
  choice: इस बार
  rationale: यह पिछले जन्मों की तुलना में वर्तमान अवसर की ओर संकेत करने वाले इब्रानी पद का सीधा अर्थ सुरक्षित रखता है।
- source_word: אוֹדֶה
  choice: मैं ... स्तुति करूँगी
  rationale: ידה का हिफ़ील रूप यहाँ स्तुति अथवा धन्यवाद व्यक्त कर सकता है। 'स्तुति करूँगी' नाम यहूदा के साथ ध्वन्यात्मक शब्द-क्रीड़ा को हिन्दी में समझाने के लिए उपयुक्त है, जबकि कालगत भाव भी बना रहता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत ईश-नाम को हिन्दी में प्रचलित लिप्यन्तरण द्वारा रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह नामकरण के कारण और परिणाम का संबंध सहज हिन्दी में स्पष्ट करता है।
- source_word: קָרְאָה שְׁמוֹ יְהוּדָה
  choice: उसने उसका नाम यहूदा रखा
  rationale: शाब्दिक 'उसने उसका नाम पुकारा' के बजाय यह इब्रानी नामकरण-वाक्य का स्वाभाविक हिन्दी रूप है।
- source_word: וַתַּעֲמֹד מִלֶּדֶת
  choice: तब उसने सन्तान जनना बन्द कर दिया
  rationale: עמד + מן + infinitive यहाँ किसी क्रिया को रोक देने का अर्थ देता है; 'सन्तान जनना' प्रसंग में आशय को स्पष्ट करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत ईश-नाम का प्रयोग करता है। हिन्दी के सामान्य बाइबलीय पाठकों के लिए परिचित 'यहोवा' इसे उपाधि में बदले बिना नाम के रूप में सुरक्षित रखता है; 'याहवे' अधिक प्रत्यक्ष शैक्षिक लिप्यन्तरण है।
- issue: אוֹדֶה में स्तुति और धन्यवाद का अर्थ-क्षेत्र
  choice: स्तुति करूँगी
  alternative: धन्यवाद दूँगी
  rationale: दोनों अर्थ स्रोत-धातु में संभव हैं। नाम 'यहूदा' की व्युत्पत्तिपरक ध्वनि और कथानक की नामकरण-व्याख्या के कारण 'स्तुति' मुख्य पाठ में चुना गया है, बिना यह दावा किए कि धन्यवाद का भाव असंभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल कथात्मक प्रवाह और गरिमापूर्ण बाइबलीय शैली। 'पुत्र', 'स्तुति' और 'सन्तान जनना' औपचारिकता बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
