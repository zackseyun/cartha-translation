id: GEN.29.33
reference: Genesis 29:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר כִּֽי שָׁמַ֤ע יְהוָה֙ כִּֽי שְׂנוּאָ֣ה אָנֹ֔כִי וַ/יִּתֶּן לִ֖/י גַּם אֶת זֶ֑ה וַ/תִּקְרָ֥א שְׁמ֖/וֹ שִׁמְעֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/033.yaml
  text: Then she conceived again and bore a son[a], and said, “Because Yahweh has heard that I am hated[b], he has given me this one also.” So she called his name Simeon.
translation:
  language: hi
  text: फिर वह गर्भवती हुई और उसने एक पुत्र को जन्म दिया। उसने कहा, “क्योंकि याहवे ने सुना है कि मुझसे घृणा की जाती है[a], इसलिए उसने मुझे यह पुत्र भी दिया है।” अतः उसने उसका नाम शिमोन[b] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझसे प्रेम नहीं किया जाता” अथवा “मुझसे कम प्रेम किया जाता है।” इब्रानी शब्द का शाब्दिक अर्थ “घृणा की गई” है, पर इस संदर्भ में वह अस्वीकृत होने या तुलनात्मक रूप से कम प्रेम पाने का भाव भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “शिमोन” नाम की ध्वनि उस इब्रानी शब्द से मिलती-जुलती है जिसका अर्थ “उसने सुना” है।
    reason: wordplay
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: फिर वह गर्भवती हुई
  rationale: וַ कथानक को आगे बढ़ाता है और עוֹד पुनरावृत्ति दर्शाता है। आधुनिक हिन्दी में यह वाक्यांश स्वाभाविक रूप से क्रम और दोबारा गर्भधारण—दोनों व्यक्त करता है।
- source_word: וַתֵּלֶד בֵּן
  choice: और उसने एक पुत्र को जन्म दिया
  rationale: यह ילד + בן का स्पष्ट, स्वाभाविक और स्रोत के निकट हिन्दी रूप है।
- source_word: כִּי שָׁמַע יְהוָה
  choice: क्योंकि याहवे ने सुना है
  rationale: כִּי यहाँ लिआ के कथन का कारण बताता है। पूर्ण क्रिया שָׁמַע का ‘ने सुना है’ रूप पूरी हुई क्रिया की वर्तमान प्रासंगिकता बनाए रखता है; יְהוָה को व्यक्तिगत दिव्य नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: כִּי שְׂנוּאָה אָנֹכִי
  choice: कि मुझसे घृणा की जाती है
  rationale: שְׂנוּאָה का मूल अर्थ ‘घृणा की गई/घृणा का पात्र’ है। हिन्दी का कर्मवाच्य मूल की तीव्रता और अनिर्दिष्ट कर्ता को बनाए रखता है; याकूब का नाम पाठ में जोड़ा नहीं गया।
- source_word: וַיִּתֶּן לִי גַּם אֶת זֶה
  choice: इसलिए उसने मुझे यह पुत्र भी दिया है
  rationale: זֶה नवजात पुत्र की ओर संकेत करता है और גַּם उसके अतिरिक्त दिए जाने पर बल देता है। हिन्दी में ‘पुत्र’ दोहराना संदर्भ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: अतः उसने उसका नाम … रखा
  rationale: हिन्दी में नामकरण-सूत्र का स्वाभाविक रूप ‘नाम रखा’ है; ‘अतः’ लिआ के कथन और नामकरण के परिणामात्मक संबंध को व्यक्त करता है।
- source_word: שִׁמְעוֹן
  choice: शिमोन
  rationale: यह इब्रानी नाम का निकट देवनागरी लिप्यंतरण है और שָׁמַע (‘उसने सुना’) के साथ ध्वनि-संबंध को कुछ हद तक बनाए रखता है।
theological_decisions:
- issue: लिआ द्वारा अपनी वैवाहिक स्थिति का वर्णन
  choice: मुझसे घृणा की जाती है
  alternative: मुझसे प्रेम नहीं किया जाता / मुझसे कम प्रेम किया जाता है
  rationale: इब्रानी שְׂנוּאָה का सीधा और प्रबल अर्थ सुरक्षित रखा गया है। संदर्भ में यह अस्वीकृति या तुलनात्मक रूप से कम प्रेम को सूचित कर सकता है, पर मुख्य पाठ में उसे नरम करने से कथानक का तनाव घट जाता।
- issue: दिव्य नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत दिव्य नाम है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण प्रस्तुत करता है, किसी उपाधि से उसका स्थानापन्न नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘घृणा’ की तीव्रता को मुख्य पाठ में सुरक्षित रखते हुए संदर्भगत हल्के अर्थ पादटिप्पणी में दिए गए हैं। नाम ‘शिमोन’ इब्रानी ध्वनि और पद के शब्द-खेल के अनुकूल है।
