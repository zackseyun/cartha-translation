source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יַעֲקֹ֤ב אֶל לָבָן֙ הָבָ֣/ה אֶת אִשְׁתִּ֔/י כִּ֥י מָלְא֖וּ יָמָ֑/י וְ/אָב֖וֹאָה אֵלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/021.yaml
  text: Then Jacob said to Laban[a], “Give me my wife, for my days are fulfilled, that I may go in to her.”
translation:
  language: hi
  text: तब याकूब ने लाबान से कहा, “मेरी पत्नी मुझे दे दो, क्योंकि मेरे ठहराए हुए दिन पूरे हो गए हैं, ताकि मैं उसके पास जाऊँ[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उसके पास जाऊँ’; यह विवाह को शारीरिक संबंध द्वारा पूर्ण करने के लिए प्रयुक्त शिष्टोक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: मुझे दे दो
  rationale: यह लाबान से किया गया आग्रह है। हिन्दी में ‘मुझे दे दो’ निहित अप्रत्यक्ष कर्म को स्वाभाविक रूप से व्यक्त करता है और विवाह के प्रसंग के अनुकूल है।
- source_word: אֶת אִשְׁתִּי
  choice: मेरी पत्नी
  rationale: אִשָּׁה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है; यहाँ तय विवाह और पूरी की गई सेवा के संदर्भ में ‘मेरी पत्नी’ उपयुक्त है।
- source_word: כִּי מָלְאוּ יָמָי
  choice: क्योंकि मेरे ठहराए हुए दिन पूरे हो गए हैं
  rationale: मूल अभिव्यक्ति का शाब्दिक भाव ‘मेरे दिन पूरे हो गए’ है और यह लाबान के साथ तय सेवा-अवधि की ओर संकेत करती है। ‘ठहराए हुए’ जोड़ने से संदर्भ स्पष्ट होता है, जबकि ‘दिन’ की मूल छवि बनी रहती है।
- source_word: וְאָבוֹאָה אֵלֶיהָ
  choice: ताकि मैं उसके पास जाऊँ
  rationale: בוא אל वैवाहिक संबंध पूर्ण करने के लिए प्रयुक्त शिष्टोक्ति है। हिन्दी में ‘उसके पास जाऊँ’ उसकी मर्यादित और अप्रत्यक्ष अभिव्यक्ति बनाए रखता है; ‘ताकि’ उद्देश्य का भाव व्यक्त करता है।
