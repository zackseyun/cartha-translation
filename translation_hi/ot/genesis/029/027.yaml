source:
  edition: WLC
  text: מַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וְ/נִתְּנָ֨ה לְ/ךָ֜ גַּם אֶת זֹ֗את בַּ/עֲבֹדָה֙ אֲשֶׁ֣ר תַּעֲבֹ֣ד עִמָּדִ֔/י ע֖וֹד שֶֽׁבַע שָׁנִ֥ים אֲחֵרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/027.yaml
  text: Complete this woman's bridal week[c][b][a], and we will give you this one also in return for the work that you will do with me for another seven years.
translation:
  language: hi
  text: इसका विवाह-सप्ताह पूरा कर लो[a], फिर हम इसे भी तुम्हें दे देंगे[b], उस काम के बदले जो तुम मेरे लिए और सात वर्ष करोगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा में शाब्दिक रूप से, “इसका सप्ताह पूरा कर लो”; यहाँ आशय प्रचलित सात दिन के विवाह-सप्ताह से है।
    reason: cultural_note
  - marker: b
    text: या, “तब यह भी तुम्हें दे दी जाएगी।” मूल भाषा का रूप औपचारिक रूप से स्त्रीलिंग एकवचन है।
    reason: lexical_alternative
  - marker: c
    text: या, “जो तुम मेरे साथ और सात वर्ष काम करोगे।” यहाँ प्रयुक्त क्रिया का अर्थ ‘काम करना’ या ‘सेवा करना’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: पूरा कर लो
  rationale: आज्ञार्थक रूप निर्धारित अवधि को पूरा करने के लिए कहता है। ‘पूरा कर लो’ आधुनिक हिन्दी में स्वाभाविक है और आदेश को प्रसंगानुकूल ढंग से व्यक्त करता है।
- source_word: שְׁבֻעַ זֹאת
  choice: इसका विवाह-सप्ताह
  rationale: शाब्दिक अर्थ ‘इसका सप्ताह’ है; प्रसंग में זֹאת का संकेत लिआ की ओर और שְׁבֻעַ का संकेत विवाह से जुड़े सात दिनों की ओर है। ‘विवाह-सप्ताह’ सांस्कृतिक आशय स्पष्ट करता है, जबकि ‘इसका’ मूल संकेतवाचक की संक्षिप्तता बनाए रखता है।
- source_word: וְנִתְּנָה לְךָ
  choice: तब हम ... तुम्हें दे देंगे
  rationale: रूप औपचारिक रूप से स्त्रीलिंग एकवचन है और ‘वह तुम्हें दे दी जाएगी’ भी संभव है; पर प्रसंग में लाबान अपने पक्ष से राहेल को देने का वचन देता है। हिन्दी में सक्रिय बहुवचन इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גַּם אֶת זֹאת
  choice: दूसरी को भी
  rationale: यह राहेल, अर्थात दूसरी बेटी, की ओर संकेत करता है। ‘दूसरी को भी’ हिन्दी में स्पष्ट और स्वाभाविक है; संकेतवाचक की अधिक शाब्दिक अभिव्यक्ति पादटिप्पणी में दी गई है।
- source_word: בַּעֲבֹדָה אֲשֶׁר תַּעֲבֹד
  choice: उस काम के बदले जो तुम ... करोगे
  rationale: संज्ञा और उसी मूल की क्रिया मिलकर श्रम की शर्त या प्रतिदान व्यक्त करती हैं। यह हिन्दी रूप लेन-देन के भाव को स्पष्ट रखता है।
- source_word: עִמָּדִי
  choice: मेरे यहाँ
  rationale: शाब्दिक अर्थ ‘मेरे साथ’ है, पर अधीन श्रम की व्यवस्था में हिन्दी का ‘मेरे यहाँ काम करना’ अपेक्षित संबंध को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: और सात वर्ष
  rationale: यह पहले के सात वर्षों के अतिरिक्त सात और वर्षों को दर्शाता है। संक्षिप्त हिन्दी अभिव्यक्ति जोड़ के भाव को बनाए रखती है।
theological_decisions:
- issue: וְנִתְּנָה की कर्तृवाच्य/कर्मवाच्य प्रस्तुति
  choice: हम दूसरी को भी तुम्हें दे देंगे
  alternative: दूसरी भी तुम्हें दे दी जाएगी
  rationale: मूल रूप की व्याकरणिक असामान्यता को पूरी तरह मिटाया नहीं गया; सहज मुख्य पाठ में लाबान के वचन का आशय रखा गया है और औपचारिक विकल्प पादटिप्पणी में सुरक्षित है। यहाँ कोई संप्रदायगत अर्थ नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विवाह-सप्ताह’ सांस्कृतिक संदर्भ खोलता है; ‘मेरे यहाँ काम करना’ हिन्दी में श्रम-संबंध को स्वाभाविक बनाता है। मूल की व्याकरणिक अस्पष्टता पादटिप्पणी में संरक्षित है।
