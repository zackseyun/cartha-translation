  text: וַ/יֹּ֣אמֶר לָבָ֗ן ט֚וֹב תִּתִּ֣/י אֹתָ֣/הּ לָ֔/ךְ מִ/תִּתִּ֥/י אֹתָ֖/הּ לְ/אִ֣ישׁ אַחֵ֑ר שְׁבָ֖/ה עִמָּדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/019.yaml
  text: Laban said[a], “It is better that I give her to you than that I give her to another man. Stay with me.”
translation:
  language: hi
  text: लाबान ने कहा, “किसी दूसरे पुरुष को देने से अच्छा है कि मैं उसे तुम्हें दूँ। मेरे साथ रहो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: यह אמר का सामान्य कथात्मक रूप है, जो प्रत्यक्ष कथन का परिचय देता है।
- source_word: טוֹב ... מִן
  choice: से अच्छा है
  rationale: यहाँ טוֹב के साथ מִן तुलनात्मक रचना बनाता है; आधुनिक हिन्दी में ‘से अच्छा है’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: תִּתִּי אֹתָהּ לָךְ
  choice: कि मैं उसे तुम्हें दूँ
  rationale: प्रथम पुरुष प्रत्यययुक्त क्रियार्थक संज्ञा को हिन्दी में सहज आश्रित उपवाक्य के रूप में व्यक्त किया गया है।
- source_word: מִתִּתִּי אֹתָהּ לְאִישׁ אַחֵר
  choice: किसी दूसरे पुरुष को देने से
  rationale: तुलनात्मक מִן और क्रियार्थक रूप का अर्थ सुरक्षित रखते हुए हिन्दी की स्वाभाविक तुलना-रचना अपनाई गई है।
- source_word: אִישׁ אַחֵר
  choice: किसी दूसरे पुरुष
  rationale: यह इब्रानी के शाब्दिक अर्थ ‘दूसरे पुरुष’ को बनाए रखता है; ‘दूसरा पति’ कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: שְׁבָה
  choice: रहो
  rationale: ישׁב का आज्ञार्थक रूप यहाँ ठहरने या साथ बने रहने को दर्शाता है; ‘रहो’ सरल और प्रसंगानुकूल है।
- source_word: עִמָּדִי
  choice: मेरे साथ
  rationale: यह लाबान के साथ निरंतर उपस्थित रहने का सीधा अर्थ देता है।
