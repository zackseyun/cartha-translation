  text: And Laban gave Bilhah[a], his female servant, to Rachel his daughter as her female servant.
translation:
  language: hi
  text: और लाबान ने अपनी बेटी राहेल को अपनी दासी बिल्हा, राहेल की दासी के रूप में दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: और ... दी
  rationale: वाव-क्रमिक रूप बीती हुई अगली घटना बताता है; हिन्दी में स्त्रीलिंग कर्म ‘बिल्हा’ के अनुसार ‘दी’ स्वाभाविक है।
- source_word: לָבָן
  choice: लाबान
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לְרָחֵל
  choice: राहेल को
  rationale: ל यहाँ प्राप्तकर्ता को चिह्नित करता है; हिन्दी में ‘को’ इसका स्वाभाविक रूप है।
- source_word: בִּתּוֹ
  choice: अपनी बेटी
  rationale: प्रत्यय लाबान की बेटी को सूचित करता है; समान कर्ता के कारण हिन्दी में ‘अपनी’ स्वाभाविक और स्पष्ट है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: निश्चित प्रत्यक्ष कर्म का चिह्न हिन्दी में अलग शब्द नहीं माँगता; वाक्य-विन्यास से उसका कार्य व्यक्त है।
- source_word: בִּלְהָה
  choice: बिल्हा
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी लिप्यंतरण।
- source_word: שִׁפְחָתוֹ
  choice: अपनी दासी
  rationale: שִׁפְחָה घराने में अधीनस्थ स्त्री सेविका अथवा दासी को दर्शाता है। ‘दासी’ संक्षिप्त, परिचित और सामाजिक अधीनता को ‘सेविका’ से अधिक स्पष्ट रखता है।
- source_word: לָהּ לְשִׁפְחָה
  choice: ताकि वह उसकी दासी हो
  rationale: शाब्दिक रूप ‘उसके लिए दासी के रूप में’ भूमिका अथवा उद्देश्य व्यक्त करता है; हिन्दी में यह उपवाक्य अर्थ और दूसरे שִׁפְחָה की पुनरावृत्ति दोनों सुरक्षित रखता है।
