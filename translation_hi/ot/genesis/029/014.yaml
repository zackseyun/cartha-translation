  yaml_path: translation/ot/genesis/029/014.yaml
  text: Then Laban said to him[b][a], “Surely you are my bone and my flesh.” And he stayed with him for a month.
translation:
  language: hi
  text: तब लाबान ने उससे कहा, “निश्चय ही तुम मेरी हड्डी और मेरा मांस हो।”[a] और याकूब उसके साथ पूरे एक महीने रहा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरी हड्डी और मेरा मांस” निकट रक्त-संबंधी या अपने कुल के व्यक्ति के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: b
    text: 'शाब्दिक रूप से: “दिनों का एक महीना”; अर्थात पूरे एक महीने तक।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह सीमाबोधक नहीं, बल्कि लाबान द्वारा निकट रक्त-संबंध की जोरदार पुष्टि करने वाला अव्यय है।
- source_word: עַצְמִי וּבְשָׂרִי
  choice: मेरी हड्डी और मेरा मांस
  rationale: मूल इब्रानी का नातेदारी-सूचक मुहावरा और उसका बिंब सुरक्षित रखा गया है; हिन्दी में इसका आशय पादटिप्पणी से स्पष्ट किया गया है।
- source_word: אָתָּה
  choice: तू ... है
  rationale: प्रत्यक्ष पारिवारिक संबोधन में एकवचन ‘तू’ स्वाभाविक है और इब्रानी स्वतंत्र सर्वनाम का बल बनाए रखता है।
- source_word: וַיֵּשֶׁב עִמּוֹ
  choice: और याकूब उसके साथ ... रहा
  rationale: ישב यहाँ सीमित अवधि तक साथ ठहरने या रहने का अर्थ देता है। अस्पष्ट ‘वह’ के स्थान पर प्रसंगगत कर्ता ‘याकूब’ रखने से हिन्दी में संदर्भ साफ रहता है।
- source_word: חֹדֶשׁ יָמִים
  choice: पूरे एक महीने
  rationale: शाब्दिक रूप ‘दिनों का एक महीना’ इब्रानी मुहावरा है; ‘पूरे एक महीने’ उसकी अवधि और स्वाभाविक हिन्दी दोनों को व्यक्त करता है।
