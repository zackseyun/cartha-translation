source:
  edition: WLC
  text: וַ/יָּבֹא֙ גַּ֣ם אֶל רָחֵ֔ל וַ/יֶּאֱהַ֥ב גַּֽם אֶת רָחֵ֖ל מִ/לֵּאָ֑ה וַ/יַּעֲבֹ֣ד עִמּ֔/וֹ ע֖וֹד שֶֽׁבַע שָׁנִ֥ים אֲחֵרֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/030.yaml
  text: So he went in to Rachel also[a], and he loved Rachel more than Leah; and he served with him for another seven years.
translation:
  language: hi
  text: फिर याकूब राहेल के पास भी गया[a] और उसने लिआ की अपेक्षा राहेल से अधिक प्रेम किया। उसने लाबान के साथ सात वर्ष और काम किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “के पास गया” वैवाहिक संबंध स्थापित करने, अर्थात सहवास करने, के लिए प्रयुक्त शिष्ट अभिव्यक्ति है।
    reason: मुहावरे में निहित यौन अर्थ को स्पष्ट करना, जिसे मुख्य पाठ ने मूल की तरह अप्रत्यक्ष रखा है।
lexical_decisions:
- source_word: וַיָּבֹא גַּם אֶל־רָחֵל
  choice: याकूब राहेल के पास भी गया
  rationale: בוא אֶל वैवाहिक प्रसंग में सहवास की ओर संकेत करने वाला शिष्ट मुहावरा है। हिन्दी में ‘के पास गया’ उसी निहित अर्थ को बनाए रखता है, पर अनावश्यक रूप से स्पष्ट नहीं होता। ‘भी’ גַּם को व्यक्त करता है और लिआ के बाद राहेल के साथ संबंध जुड़ने को दिखाता है।
- source_word: וַיֶּאֱהַב גַּם אֶת־רָחֵל
  choice: वह राहेल से ... प्रेम करता था
  rationale: אָהַב का सामान्य अर्थ ‘प्रेम करना’ है; मूल में अतिरिक्त तीव्रता-सूचक शब्द नहीं है। हिन्दी में निरंतर भाव के लिए ‘करता था’ स्वाभाविक है।
- source_word: מִלֵּאָה
  choice: लिआ की अपेक्षा अधिक
  rationale: מִן यहाँ प्रेम के स्तर की तुलना प्रकट करता है। ‘की अपेक्षा अधिक’ आधुनिक मानक हिन्दी में स्पष्ट तुलनात्मक अर्थ देता है।
- source_word: וַיַּעֲבֹד עִמּוֹ
  choice: लाबान के यहाँ ... काम करता रहा
  rationale: עבד का अर्थ सेवा या काम करना है। עִמּוֹ का शाब्दिक अर्थ ‘उसके साथ’ है, पर प्रसंग में लाबान के अधीन/यहाँ काम करना अभिप्रेत है। पूर्ववर्ती संदर्भ से सर्वनाम को ‘लाबान’ के रूप में स्पष्ट किया गया है।
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: सात वर्ष और
  rationale: עוֹד और אֲחֵרוֹת मिलकर अतिरिक्त अवधि बताते हैं। ‘सात वर्ष और’ संक्षिप्त तथा स्वाभाविक हिन्दी है।
theological_decisions:
- issue: מִן का तुलनात्मक अथवा वरीयतामूलक अर्थ
  choice: राहेल से लिआ की अपेक्षा अधिक प्रेम
  alternative: राहेल से प्रेम करता था, लिआ से नहीं/लिआ के बजाय
  rationale: प्रेम के क्रिया-पद के बाद מִן का सबसे स्वाभाविक अर्थ तुलना है। यह अनुवाद लिआ के प्रति प्रेम की पूर्ण अनुपस्थिति का दावा नहीं करता और प्रसंग की तनावपूर्ण स्थिति को बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘के पास गया’ मूल के शिष्ट मुहावरे को बनाए रखता है; ‘काम करता रहा’ दीर्घकालीन सेवा को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
