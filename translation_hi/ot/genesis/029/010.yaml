translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की तीनfold पारिवारिक पुनरावृत्ति बनाए रखी गई है। अत्यधिक लंबे संयुक्त वाक्य से बचने के लिए घटनाक्रम को दो वाक्यों में रखा गया है, बिना किसी अर्थगत संबंध को बदले।
