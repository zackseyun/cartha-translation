source:
  edition: WLC
  text: וַ/יְהִ֡י כַּ/אֲשֶׁר֩ רָאָ֨ה יַעֲקֹ֜ב אֶת רָחֵ֗ל בַּת לָבָן֙ אֲחִ֣י אִמּ֔/וֹ וְ/אֶת צֹ֥אן לָבָ֖ן אֲחִ֣י אִמּ֑/וֹ וַ/יִּגַּ֣שׁ יַעֲקֹ֗ב וַ/יָּ֤גֶל אֶת הָ/אֶ֨בֶן֙ מֵ/עַל֙ פִּ֣י הַ/בְּאֵ֔ר וַ/יַּ֕שְׁקְ אֶת צֹ֥אן לָבָ֖ן אֲחִ֥י אִמּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/010.yaml
  text: And when Jacob saw Rachel[a], the daughter of Laban, his mother’s brother, and the flock of Laban, his mother’s brother, Jacob came near and rolled the stone from the mouth of the well, and watered the flock of Laban, his mother’s brother.
translation:
  language: hi
  text: जब याकूब ने याकूब की माँ के भाई लाबान की बेटी राहेल[a] को और याकूब की माँ के भाई लाबान के झुंड को देखा, तब याकूब पास गया। उसने कुएँ के मुँह पर से पत्थर लुढ़काया और याकूब की माँ के भाई लाबान के झुंड को पानी पिलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “याकूब की माँ का भाई” संबंध तीन बार दोहराया गया है, जिससे लाबान के साथ याकूब के पारिवारिक संबंध पर बल पड़ता है।
    reason: मूल पाठ की अर्थपूर्ण पुनरावृत्ति को स्पष्ट करना
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: जब … तब
  rationale: यह इब्रानी कथात्मक सूत्र अगले घटनाक्रम का समय बताता है। हिन्दी में ‘जब … तब’ उसका काल-संबंध स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: רָאָה
  choice: देखा
  rationale: यहाँ क्रिया साधारण दृश्य-बोध बताती है; ‘देखा’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: אֲחִי אִמּוֹ
  choice: उसकी/अपनी माँ का भाई
  rationale: मूल पाठ इस संबंध-सूचक पदबंध को तीन बार दोहराता है। ‘मामा’ कहने के बजाय स्पष्ट संबंधवाचक रूप रखने से मूल की पुनरावृत्ति और पारिवारिक बल सुरक्षित रहता है; वाक्य की हिन्दी संरचना के अनुसार ‘उसकी’ और ‘अपनी’ का प्रयोग किया गया है।
- source_word: צֹאן
  choice: झुंड
  rationale: צֹאן भेड़-बकरियों जैसे छोटे पालतू पशुओं के सामूहिक समूह को सूचित कर सकता है। ‘झुंड’ प्रजाति को अनावश्यक रूप से निश्चित किए बिना सामूहिक अर्थ बनाए रखता है।
- source_word: וַיִּגַּשׁ
  choice: पास गया
  rationale: क्रिया घटनास्थल की ओर बढ़ने या निकट जाने को बताती है; ‘पास गया’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: וַיָּגֶל
  choice: लुढ़का दिया
  rationale: גלל का ठोस अर्थ लुढ़काना है। पत्थर के संदर्भ में यह क्रिया मूल बिंब को ‘हटा दिया’ की अपेक्षा अधिक स्पष्ट रूप से सुरक्षित रखती है।
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: कुएँ के मुँह पर से
  rationale: ‘कुएँ का मुँह’ मूल इब्रानी रूपक को बनाए रखता है और हिन्दी में भी समझने योग्य है; ‘पर से’ पत्थर के कुएँ के मुँह के ऊपर होने और वहाँ से हटाए जाने को व्यक्त करता है।
- source_word: וַיַּשְׁקְ
  choice: पानी पिलाया
  rationale: शקה का हिफ़ील रूप किसी को पानी देने का अर्थ रखता है। पशुओं के लिए ‘पानी पिलाया’ स्वाभाविक आधुनिक हिन्दी है।
