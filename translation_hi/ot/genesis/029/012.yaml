  yaml_path: translation/ot/genesis/029/012.yaml
  text: Jacob told Rachel that he was her father's relative and that he was Rebekah's son[a]. Then she ran and told her father.
translation:
  language: hi
  text: याकूब ने राहेल को बताया कि वह उसके पिता का रिश्तेदार और रिबका का बेटा है। तब वह दौड़कर अपने पिता के पास गई और उन्हें बताया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: बताया
  rationale: נגד के हिफ़ील रूप का सामान्य अर्थ किसी बात को बताना या प्रकट करना है; कथा में ‘बताया’ स्वाभाविक है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ दोनों बार यह ‘बताया’ के बाद कही गई बात का परिचय देता है।
- source_word: אֲחִי אָבִיהָ
  choice: उसके पिता का रिश्तेदार
  rationale: אָח का मूल अर्थ ‘भाई’ है, पर यह निकट पुरुष संबंधी के लिए भी प्रयुक्त हो सकता है। याकूब लाबान का सगा भाई नहीं, बल्कि भांजा है; इसलिए ‘रिश्तेदार’ प्रसंगगत संबंध को सही और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֶן רִבְקָה
  choice: रिबका का बेटा
  rationale: सरल पुत्र-संबंध को आधुनिक हिन्दी में सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַתָּרָץ
  choice: दौड़कर
  rationale: רץ स्पष्ट रूप से दौड़ने की क्रिया बताता है और कथा की तीव्र गति बनाए रखता है।
- source_word: וַתַּגֵּד לְאָבִיהָ
  choice: अपने पिता को बताने गई
  rationale: हिब्रू क्रमिक क्रियाओं को स्वाभाविक हिन्दी में उद्देश्यसूचक रचना से व्यक्त किया गया है; इससे दौड़ने और पिता को समाचार देने, दोनों घटनाएँ बनी रहती हैं।
