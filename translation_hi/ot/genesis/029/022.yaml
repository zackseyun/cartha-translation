  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֶּאֱסֹ֥ף לָבָ֛ן אֶת כָּל אַנְשֵׁ֥י הַ/מָּק֖וֹם וַ/יַּ֥עַשׂ מִשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/022.yaml
  text: So Laban gathered all the men of the place and made a feast[a][b].
translation:
  language: hi
  text: तब लाबान ने उस स्थान के सभी पुरुषों को इकट्ठा किया और एक भोज दिया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस स्थान के सभी लोगों को।” इब्रानी में अधिक अक्षरशः “उस स्थान के सभी पुरुषों को” है; विवाह-उत्सव के प्रसंग में सम्भवतः नगर के पुरुष निवासी अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भोज” के लिए प्रयुक्त इब्रानी शब्द उत्सव की दावत को दर्शाता है और उसमें मदिरापान सम्मिलित होने का भाव भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: इकट्ठा किया
  rationale: אסף यहाँ लोगों को एक स्थान पर जुटाने के अर्थ में है। ‘इकट्ठा किया’ सहज आधुनिक हिन्दी है और क्रिया का ठोस भाव बनाए रखता है।
- source_word: לָבָן
  choice: लाबान
  rationale: इब्रानी नाम का हिन्दी में प्रचलित और स्रोत के निकट लिप्यंतरण।
- source_word: אֶת כָּל אַנְשֵׁי הַמָּקוֹם
  choice: उस स्थान के सभी पुरुषों को
  rationale: אַנְשֵׁי, אִישׁ का पुल्लिंग बहुवचन संबंध-रूप है और अक्षरशः ‘पुरुषों’ को सूचित करता है। विवाह-भोज के प्रसंग में सम्भवतः स्थानीय पुरुष निवासी अभिप्रेत हैं; ‘स्थान’ הַמָּקוֹם की अनिर्दिष्टता बचाता है।
- source_word: וַיַּעַשׂ
  choice: दिया
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ व्यापक है, पर מִשְׁתֶּה के साथ हिन्दी में ‘भोज दिया’ स्वाभाविक मुहावरा है और आयोजन का आशय स्पष्ट करता है।
- source_word: מִשְׁתֶּה
  choice: एक भोज
  rationale: מִשְׁתֶּה उत्सवपूर्ण दावत या भोज को सूचित करता है, जिसमें मदिरापान भी सम्मिलित हो सकता है। ‘भोज’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, स्वाभाविक और गरिमापूर्ण शैली अपनाई गई है। वाक्य को इब्रानी कथात्मक क्रम के अनुरूप रखा गया है; ‘तब’ से कथा की अगली घटना सहज रूप में जुड़ती है।
