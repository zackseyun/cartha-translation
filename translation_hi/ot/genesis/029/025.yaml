base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/025.yaml
  text: In the morning, behold, it was Leah. And he said to Laban, “What is this you have done to me? Was it not for Rachel that I worked with you? So why have you deceived me?”
translation:
  language: hi
  text: सुबह हुई, तो देखा कि वह लिआ थी। तब याकूब ने लाबान से कहा, “तुमने मेरे साथ यह क्या किया? क्या मैंने राहेल के लिए तुम्हारे यहाँ काम नहीं किया था? फिर तुमने मुझे धोखा क्यों दिया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: तो देखा कि
  rationale: हिब्रानी कथन में अचानक हुए बोध और आश्चर्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; केवल ‘देखो’ कहना यहाँ कृत्रिम लगता।
- source_word: עָבַדְתִּי עִמָּךְ
  choice: मैंने तुम्हारे यहाँ काम किया था
  rationale: शाब्दिक अर्थ ‘तुम्हारे साथ/पास सेवा की’ है; प्रसंग में लाबान के अधीन किए गए श्रम को सहज हिन्दी में व्यक्त किया गया है।
- source_word: רִמִּיתָנִי
  choice: तुमने मुझे धोखा दिया
  rationale: क्रिया רמה का यहाँ अर्थ छल या धोखा देना है; ‘धोखा दिया’ सामान्य और सटीक हिन्दी है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘तो देखा कि’ से मूल के וְהִנֵּה में निहित आकस्मिक पहचान और विस्मय सुरक्षित रखा गया है। स्पष्टता के लिए वक्ता ‘याकूब’ का नाम जोड़ा गया है, जो निकटवर्ती प्रसंग से निर्विवाद है।
