  text: He said to them[a], “Is he well?” And they said, “He is well. And look, Rachel his daughter is coming with the flock.”
translation:
  language: hi
  text: उसने उनसे पूछा,[a] “क्या वह कुशल से है?” उन्होंने कहा, “वह कुशल से है। देखो, उसकी बेटी राहेल भेड़-बकरियों के झुंड के साथ आ रही है।”
  philosophy: optimal-equivalence
  footnotes:
