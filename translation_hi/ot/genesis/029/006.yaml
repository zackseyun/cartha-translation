    text: या, “क्या उसके साथ सब कुशल है?” हिब्रू में यहाँ ‘शालोम’ का अर्थ कुशलता या भलाई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשָׁלוֹם לוֹ
  choice: क्या वह कुशल से है?
  rationale: यहाँ שָׁלוֹם लाबान की कुशलता और भलाई के विषय में पूछता है; आधुनिक हिन्दी में ‘कुशल से’ स्वाभाविक रूप से यही भाव व्यक्त करता है।
- source_word: שָׁלוֹם
  choice: हाँ, वह कुशल से है
  rationale: उत्तर प्रश्न की भाषा को दोहराकर लाबान की कुशलता की पुष्टि करता है; हिन्दी में स्पष्टता और स्वाभाविकता के लिए कर्ता और क्रिया जोड़े गए हैं।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: यह शब्द सामने दिखाई दे रही बात की ओर तुरंत ध्यान खींचता है; ‘देखो’ आधुनिक और सीधा समतुल्य है।
- source_word: רָחֵל
  choice: राहेल
  rationale: हिब्रू नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: בִּתּוֹ
  choice: उसकी बेटी
  rationale: सर्वनाम का संकेत लाबान की ओर है और पारिवारिक संबंध स्पष्ट रखा गया है।
- source_word: בָּאָה
  choice: आ रही है
  rationale: यह रूप दृश्य में उसी समय जारी गति को व्यक्त करता है, इसलिए हिन्दी का वर्तमान अपूर्ण रूप उपयुक्त है।
- source_word: עִם הַצֹּאן
  choice: भेड़-बकरियों के झुंड के साथ
  rationale: צֹאן छोटे पालतू पशुओं—विशेषकर भेड़ और बकरियों—का सामूहिक शब्द है; हिन्दी में यह अनुवाद उसके व्यापक अर्थ को स्पष्ट रखता है।
