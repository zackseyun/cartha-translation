- source_word: וַיֹּאמֶר לָהֶם
  choice: उसने उनसे कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; हिन्दी में बार-बार आरम्भिक ‘और’ जोड़े बिना कथात्मक क्रम स्वाभाविक रूप से स्पष्ट रहता है। לָהֶם का अर्थ ‘उनसे’ है।
- source_word: הֲיְדַעְתֶּם
  choice: क्या तुम ... जानते हो
