- source_word: לָבָן
  choice: लाबान
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן נָחוֹר
  choice: नाहोर के पुत्र
  rationale: בֶּן का सीधा अर्थ ‘पुत्र’ सुरक्षित रखा गया है और नाहोर नाम का प्रचलित हिन्दी रूप अपनाया गया है।
- source_word: וַיֹּאמְרוּ
  choice: उन्होंने कहा
  rationale: बहुवचन उत्तर देने वालों को दर्शाता है; हिन्दी कथाशैली में आरम्भिक ‘और’ आवश्यक नहीं है।
- source_word: יָדָעְנוּ
  choice: हम उसे जानते हैं
  rationale: प्रश्न में आए יָדַע की पुनरावृत्ति ‘जानते’ से सुरक्षित है। सहज हिन्दी के लिए सन्दर्भ से स्पष्ट कर्म ‘उसे’ जोड़ा गया है और इसे पादटिप्पणी में बताया गया है।
