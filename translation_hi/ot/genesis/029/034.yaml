  edition: WLC
  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר עַתָּ֤ה הַ/פַּ֨עַם֙ יִלָּוֶ֤ה אִישִׁ/י֙ אֵלַ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שְׁלֹשָׁ֣ה בָנִ֑ים עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ לֵוִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/034.yaml
  text: And she conceived again and bore a son[a], and said, “Now this time my husband will be attached to me, because I have borne him three sons.” Therefore his name was called Levi.
translation:
  language: hi
  text: और वह फिर गर्भवती हुई और उसने एक पुत्र को जन्म दिया। उसने कहा, “अबकी बार मेरा पति मुझसे जुड़ जाएगा,[a] क्योंकि मैंने उसके लिए तीन पुत्रों को जन्म दिया है।” इसलिए उसका नाम लेवी रखा गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जुड़ जाएगा” के लिए प्रयुक्त इब्रानी क्रिया की ध्वनि “लेवी” नाम से मिलती-जुलती है।
    reason: मूल इब्रानी के नाम-संबंधी शब्दालंकार को सुरक्षित करना।
lexical_decisions:
- source_word: וַתַּהַר עוֹד וַתֵּלֶד בֵּן
  choice: और वह फिर गर्भवती हुई और उसने एक पुत्र को जन्म दिया
  rationale: यह आधुनिक हिन्दी में स्वाभाविक ढंग से पुनः गर्भधारण और पुत्र-जन्म की क्रमिक घटनाओं को व्यक्त करता है।
- source_word: עַתָּה הַפַּעַם
  choice: अबकी बार
  rationale: यह עַתָּה और הַפַּעַם के संयुक्त बल को सहज और संक्षिप्त हिन्दी में बनाए रखता है।
- source_word: יִלָּוֶה אִישִׁי אֵלַי
  choice: मेरा पति मुझसे जुड़ जाएगा
  rationale: निफ़अल क्रिया לוה का जुड़ने या साथ होने का भाव सुरक्षित रहता है और लेवी नाम के साथ मूल इब्रानी शब्दालंकार की ओर संकेत करता है।
- source_word: כִּי יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים
  choice: क्योंकि मैंने उसके लिए तीन पुत्रों को जन्म दिया है
  rationale: לוֹ को स्पष्ट रखते हुए पूर्ण क्रिया के वर्तमान-प्रासंगिक परिणाम को हिन्दी पूर्णकाल में व्यक्त किया गया है।
- source_word: עַל כֵּן קָרָא שְׁמוֹ לֵוִי
  choice: इसलिए उसका नाम लेवी रखा गया
  rationale: मूल में कर्ता स्पष्ट नहीं है; कर्मवाच्य हिन्दी अनिश्चित कर्ता को जोड़े बिना नामकरण के परिणाम पर बल देता है।
theological_decisions:
- issue: יִלָּוֶה और לֵוִי के बीच नामकरण-संबंधी शब्दालंकार
  choice: मुख्य पाठ में “जुड़ जाएगा” और पादटिप्पणी में इब्रानी ध्वनि-संबंध की सूचना
  alternative: मेरे साथ हो जाएगा / मुझसे लगा रहेगा
  rationale: “जुड़ जाएगा” मूल अर्थ के निकट, आधुनिक और संबंधपरक है; कोई अतिरिक्त वैवाहिक या सांप्रदायिक अर्थ आरोपित नहीं करता। पादटिप्पणी उस शब्दालंकार को स्पष्ट करती है जिसे हिन्दी में पूर्णतः पुनरुत्पादित नहीं किया जा सकता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। “अबकी बार” बोलचाल में बोधगम्य होते हुए भी साहित्यिक कथा के अनुकूल है।
