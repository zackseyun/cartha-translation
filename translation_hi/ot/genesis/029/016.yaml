- source_word: שֵׁם
  choice: का नाम
  rationale: हिब्रू की समानांतर नाम-परिचय रचना को दोनों खंडों में बनाए रखा गया है।
- source_word: הַגְּדֹלָה
  choice: बड़ी
  rationale: दो बहनों के संदर्भ में यह शब्द आयु में बड़ी बेटी को दर्शाता है, आकार को नहीं।
- source_word: לֵאָה
  choice: लिआ
  rationale: हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: הַקְּטַנָּה
  choice: छोटी
  rationale: बहनों के संदर्भ में आयु में छोटी बेटी का स्वाभाविक हिन्दी संकेत।
- source_word: רָחֵל
  choice: राहेल
  rationale: हिब्रू नाम का प्रचलित और स्रोत-सन्निकट हिन्दी लिप्यंतरण।
