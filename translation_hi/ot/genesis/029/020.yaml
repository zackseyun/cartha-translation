source:
  edition: WLC
  text: וַ/יַּעֲבֹ֧ד יַעֲקֹ֛ב בְּ/רָחֵ֖ל שֶׁ֣בַע שָׁנִ֑ים וַ/יִּהְי֤וּ בְ/עֵינָי/ו֙ כְּ/יָמִ֣ים אֲחָדִ֔ים בְּ/אַהֲבָת֖/וֹ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/020.yaml
  text: So Jacob served seven years for Rachel[a], and they seemed like only a few days to him because of his love for her.
translation:
  language: hi
  text: तब याकूब ने राहेल के लिए सात वर्ष तक सेवा की, और राहेल के प्रति उसके प्रेम के कारण वे उसे कुछ ही दिनों के समान लगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे याकूब की दृष्टि में कुछ दिनों के समान थे।”
    reason: मूल इब्रानी के दृष्टि-संबंधी मुहावरे और अधिक शाब्दिक अभिव्यक्ति को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: सेवा की
  rationale: עבד में काम करने और किसी के लिए सेवा करने—दोनों का भाव है। यहाँ यह विवाह के लिए ठहराई गई सेवा है, इसलिए ‘सेवा की’ उसके श्रम और अनुबंधात्मक संबंध दोनों को बनाए रखता है।
- source_word: בְּרָחֵל
  choice: राहेल के लिए
  rationale: इस प्रसंग में ב उस व्यक्ति को सूचित करता है जिसके साथ विवाह करने के लिए सेवा की गई। ‘राहेल के लिए’ आधुनिक हिन्दी में स्वाभाविक है और मूल की संक्षिप्तता बनाए रखता है।
- source_word: שֶׁבַע שָׁנִים
  choice: सात वर्ष
  rationale: यह संख्या और समयावधि का सीधा, स्वाभाविक अनुवाद है।
- source_word: וַיִּהְיוּ בְעֵינָיו
  choice: वे वर्ष उसे … लगे
  rationale: ‘उसकी आँखों में थे’ एक इब्रानी मुहावरा है जो व्यक्तिगत अनुभूति बताता है। हिन्दी में ‘उसे … लगे’ उसी अर्थ को सहज रूप से व्यक्त करता है।
- source_word: כְּיָמִים אֲחָדִים
  choice: बस कुछ ही दिनों जैसे
  rationale: इसका शाब्दिक भाव ‘कुछ दिनों के समान’ है। ‘बस कुछ ही’ सात वर्षों के बहुत थोड़े प्रतीत होने के संदर्भगत बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּאַהֲבָתוֹ אֹתָהּ
  choice: उससे प्रेम करने के कारण
  rationale: בְּ यहाँ परिस्थिति अथवा कारण का भाव देता है। यह अनुवाद स्पष्ट करता है कि राहेल के प्रति याकूब का प्रेम ही उन वर्षों के थोड़े लगने का कारण था।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सेवा की’ को ‘काम किया’ पर प्राथमिकता दी गई है ताकि विवाह के लिए किए गए श्रम का संबंधपरक और अनुबंधात्मक भाव बना रहे; अनुभूति-सूचक इब्रानी मुहावरे को मुख्य पाठ में स्वाभाविक हिन्दी और पादटिप्पणी में अधिक शाब्दिक रूप दिया गया है।
