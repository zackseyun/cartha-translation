base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/013.yaml
  text: And when Laban heard the news about Jacob[a], his sister’s son, he ran to meet him and embraced him and kissed him and brought him to his house[c][b]. Then Jacob told Laban all these things.
translation:
  language: hi
  text: जब लाबान ने अपनी बहन के बेटे याकूब के बारे में खबर[a] सुनी, तो वह उससे मिलने दौड़ा। उसने याकूब को गले लगाया, उसे चूमा और अपने घर ले आया। तब याकूब ने लाबान को ये सारी बातें बताईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याकूब के विषय में समाचार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: जब ... सुनी
  rationale: כ के साथ infinitive construct यहाँ कालवाचक उपवाक्य बनाता है। ‘जब ... सुनी’ स्वाभाविक हिन्दी है और अनावश्यक रूप से तत्कालता पर बल नहीं देता।
- source_word: שֵׁמַע יַעֲקֹב
  choice: याकूब के आने की खबर
  rationale: שֵׁמַע का अर्थ यहाँ याकूब के विषय में मिली खबर है। निकट संदर्भ में यह उसके आगमन की खबर है; इसलिए हिन्दी में स्पष्ट और स्वाभाविक रूप दिया गया है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: בֶּן אֲחֹתוֹ
  choice: अपनी बहन के बेटे
  rationale: हिब्रू के स्पष्ट संबंधसूचक पद को ‘भांजे’ में संक्षिप्त करने के बजाय उसी रूप में रखा गया है। ‘अपनी’ का संबंध लाबान से है।
- source_word: וַיָּרָץ לִקְרָאתוֹ
  choice: वह उससे मिलने दौड़ा
  rationale: לִקְרָאתוֹ का सीधा अर्थ उसकी ओर जाकर उससे मिलना है; यह हिन्दी में सहज कथात्मक अभिव्यक्ति है।
- source_word: וַיְחַבֶּק לוֹ
  choice: उसने याकूब को गले लगाया
  rationale: חבק के लिए ‘गले लगाया’ आधुनिक हिन्दी में स्वाभाविक है। याकूब का नाम दोहराने से कर्ता और कर्म स्पष्ट रहते हैं।
- source_word: וַיְנַשֵּׁק לוֹ
  choice: उसे चूमा
  rationale: נשׁק का साधारण अर्थ ‘चूमना’ है और पारिवारिक अभिवादन के संदर्भ में इसे बिना अतिरिक्त व्याख्या के रखा गया है।
- source_word: וַיְבִיאֵהוּ אֶל בֵּיתוֹ
  choice: अपने घर ले आया
  rationale: हिफ़ील क्रिया का अर्थ ‘लाना’ है। हिन्दी दृष्टिकोण में ‘ले आया’ स्वाभाविक रूप से लाबान द्वारा याकूब को अपने घर पहुँचाने को व्यक्त करता है।
- source_word: וַיְסַפֵּר לְלָבָן
  choice: तब याकूब ने लाबान को ... बताईं
  rationale: हिब्रू में कर्ता अप्रकट है, पर संदर्भ में याकूब अभिप्रेत है। नाम स्पष्ट करने से लाबान से याकूब की ओर कर्ता-परिवर्तन साफ होता है।
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ये सारी बातें
  rationale: דברים यहाँ शब्दों के बजाय याकूब द्वारा सुनाए गए प्रसंगों या बातों को दर्शाता है। ‘ये सारी बातें’ सहज और अर्थानुकूल है।
