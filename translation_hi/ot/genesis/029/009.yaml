base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/009.yaml
  text: While he was still speaking with them[a], Rachel came with her father’s flock, for she was a shepherdess.
translation:
  language: hi
  text: जब वह अभी उनसे बात कर ही रहा था, तब राहेल अपने पिता की भेड़-बकरियों के झुंड के साथ आई, क्योंकि वह चरवाहिन थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह झुंड चराती थी।” इब्रानी में स्त्रीलिंग रूप है, जो राहेल को झुंड की देखभाल करने वाली बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: जब वह अभी उनसे बात कर ही रहा था
  rationale: यह अभिव्यक्ति जारी बातचीत और उसी समय होने वाली अगली घटना का संबंध स्वाभाविक हिन्दी में स्पष्ट करती है। ‘ही’ तत्कालीन कालगत समानांतरता पर हल्का बल देता है।
- source_word: וְרָחֵל בָּאָה
  choice: तब राहेल ... आई
  rationale: בוא का सामान्य कथात्मक अर्थ ‘आना’ है। ‘तब’ हिन्दी में पिछले आश्रित उपवाक्य से मुख्य घटना को सहज रूप से जोड़ता है।
- source_word: עִם הַצֹּאן אֲשֶׁר לְאָבִיהָ
  choice: अपने पिता की भेड़-बकरियों के झुंड के साथ
  rationale: צֹאן छोटे पालतू पशुओं, विशेषतः भेड़-बकरियों, के सामूहिक झुंड को दर्शाता है। ‘अपने पिता की’ इब्रानी संबंधवाचक वाक्यांश में व्यक्त स्वामित्व को स्वाभाविक हिन्दी में रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह राहेल के झुंड के साथ आने का कारण अथवा कथात्मक स्पष्टीकरण प्रस्तुत करता है।
- source_word: רֹעָה הִוא
  choice: वह चरवाहिन थी
  rationale: इब्रानी स्त्रीलिंग रूप राहेल की भूमिका को झुंड की देखभाल करने वाली के रूप में पहचानता है। ‘चरवाहिन’ हिन्दी में उस स्त्रीलिंग भूमिका को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
