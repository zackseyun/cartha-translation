source:
  edition: WLC
  text: וַ/תַּ֤הַר לֵאָה֙ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ רְאוּבֵ֑ן כִּ֣י אָֽמְרָ֗ה כִּֽי רָאָ֤ה יְהוָה֙ בְּ/עָנְיִ֔/י כִּ֥י עַתָּ֖ה יֶאֱהָבַ֥/נִי אִישִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/032.yaml
  text: Leah conceived and bore a son[a], and she called his name Reuben, for she said, “Because Yahweh has seen my affliction, now my husband will love me.”
translation:
  language: hi
  text: लेआ गर्भवती हुई और उसने एक पुत्र को जन्म दिया। उसने उसका नाम रूबेन[a] रखा, क्योंकि उसने कहा, “याहवे ने मेरे दुःख को देखा है; इसलिए अब मेरा पति मुझसे प्रेम करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“रूबेन” नाम का उच्चारण उस हिब्रू वाक्यांश से मिलता-जुलता है जिसका अर्थ है “देखो, एक पुत्र”; यहाँ लेआ के इन शब्दों से भी इसकी व्याख्या होती है: “याहवे ने मेरे दुःख को देखा है।”'
    reason: नाम और ראה (‘देखना’) के बीच की हिब्रू शब्द-क्रीड़ा हिन्दी में प्रत्यक्ष रूप से सुरक्षित नहीं रह सकती।
lexical_decisions:
- source_word: וַתַּהַר
  choice: गर्भवती हुई
  rationale: हिब्रू क्रिया הרה गर्भ धारण करने को व्यक्त करती है। आधुनिक हिन्दी में ‘गर्भवती हुई’ स्वाभाविक और स्पष्ट है।
- source_word: וַתֵּלֶד בֵּן
  choice: एक पुत्र को जन्म दिया
  rationale: यह ילד और בן के प्रसव-संबंधी सामान्य प्रयोग का सहज हिन्दी रूप है।
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: उसने उसका नाम … रखा
  rationale: यह हिब्रू नामकरण-सूत्र का अर्थ और नाम से जुड़ी व्याख्या दोनों सुरक्षित रखता है।
- source_word: רְאוּבֵן
  choice: रूबेन
  rationale: परिचित हिन्दी लिप्यंतरण अपनाया गया है; नाम में निहित हिब्रू शब्द-क्रीड़ा पादटिप्पणी में स्पष्ट की गई है।
- source_word: כִּי רָאָה יְהוָה
  choice: याहवे ने … देखा है
  rationale: पूर्ण क्रिया को वर्तमान परिणाम वाले कथन के रूप में रखा गया है और परमेश्वर के व्यक्तिगत नाम को लिप्यंतरित किया गया है।
- source_word: בְּעָנְיִי
  choice: मेरे दुःख को
  rationale: עֳנִי यहाँ लेआ की पीड़ादायक दशा को दर्शाता है; ‘दुःख’ साधारण पाठक के लिए स्वाभाविक और भावपूर्ण है।
- source_word: כִּי עַתָּה
  choice: इसलिए अब
  rationale: दूसरा כִּי लेआ की परिस्थिति और उसकी आगामी आशा के बीच कारणात्मक संबंध प्रकट करता है; ‘इसलिए अब’ हिन्दी में उस तर्क को स्पष्ट रखता है।
- source_word: יֶאֱהָבַנִי אִישִׁי
  choice: मेरा पति मुझसे प्रेम करेगा
  rationale: वैवाहिक संदर्भ में אִישִׁי का अर्थ ‘मेरा पति’ है, और אהב की भावनात्मक शक्ति ‘प्रेम करेगा’ से सुरक्षित रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लेआ’ मूल हिब्रू उच्चारण के निकट लिप्यंतरण है, जबकि ‘रूबेन’ हिन्दी बाइबलीय परंपरा में परिचित रूप है।
