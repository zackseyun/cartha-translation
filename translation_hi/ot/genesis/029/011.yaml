  text: तब याकूब ने राहेल को चूमा[a], अपना स्वर ऊँचा करके रोया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राहेल को चुंबन देकर अभिवादन किया।” इब्रानी क्रिया का सामान्य अर्थ “चूमना” है, पर इस प्रसंग में यह पारिवारिक अभिवादन का भाव भी रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁק
  choice: चूमा
  rationale: नשק का काल रूप सामान्यतः शारीरिक रूप से ‘चूमना’ व्यक्त करता है। प्रसंग में यह पारिवारिक अभिवादन भी है, पर मुख्य पाठ में सीधा अर्थ रखना उचित है।
- source_word: לְרָחֵל
  choice: राहेल को
  rationale: לְ यहाँ ‘चूमना’ क्रिया के व्यक्ति-वाचक कर्म को चिह्नित करता है; स्वाभाविक हिन्दी में ‘राहेल को चूमा’ कहा जाता है।
- source_word: וַיִּשָּׂא אֶת־קֹלוֹ
  choice: ऊँचे स्वर से
  rationale: शाब्दिक रूप ‘अपनी आवाज़ उठाई’ है; इस मुहावरे का प्रसंगानुकूल आशय जोर से रोना है। ‘ऊँचे स्वर से’ अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיֵּבְךְּ
  choice: रो पड़ा
  rationale: בכה का अर्थ ‘रोना/विलाप करना’ है। ‘रो पड़ा’ क्रमिक कथा में भावनात्मक क्रिया के आरंभ को सहज हिन्दी में व्यक्त करता है।
- source_word: וַ
  choice: तब
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में घटनाक्रम का स्वाभाविक संकेत है।
