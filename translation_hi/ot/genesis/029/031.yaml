  yaml_path: translation/ot/genesis/029/031.yaml
  text: When the LORD saw that Leah was hated, he opened her womb, but Rachel was barren.
translation:
  language: hi
  text: जब यहोवा ने देखा कि लिआ से घृणा की जाती थी, तब उसने उसकी कोख खोल दी, पर राहेल बाँझ थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: שְׂנוּאָה
  choice: घृणा की जाती थी
  rationale: हिब्रू निष्क्रिय कृदंत का अर्थ ‘घृणा की गई/घृणा की पात्र’ है। इसे ‘उपेक्षित’ या ‘कम प्रेम की गई’ कहकर नरम नहीं किया गया, और घृणा करने वाले व्यक्ति का नाम भी नहीं जोड़ा गया।
- source_word: וַיִּפְתַּח אֶת־רַחְמָהּ
  choice: उसने उसकी कोख खोल दी
  rationale: मूल पाठ के शारीरिक रूपक को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखा गया है; प्रसंग में इसका आशय गर्भधारण की क्षमता देना है।
- source_word: עֲקָרָה
  choice: बाँझ
  rationale: स्त्री की संतान उत्पन्न न कर सकने की अवस्था के लिए संक्षिप्त और प्रचलित हिन्दी शब्द।
theological_decisions:
- issue: लिआ की दशा की तीव्रता
  choice: घृणा की जाती थी
  alternative: उससे प्रेम नहीं किया जाता था
  rationale: मूल शब्द की तीव्रता और कथा में विद्यमान पारिवारिक तनाव को सुरक्षित रखा गया है; तुलनात्मक अर्थ संभव होने पर भी उसे पाठ में निश्चित नहीं किया गया।
- issue: गर्भधारण में यहोवा की सक्रिय भूमिका
  choice: उसने उसकी कोख खोल दी
  alternative: वह गर्भवती हो गई
  rationale: हिब्रू पाठ यहोवा को सक्रिय कर्ता बताता है, इसलिए उस कारणात्मक कथन को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘कोख खोल दी’ मूल हिब्रू रूपक को सुरक्षित रखता है, जबकि वाक्य-संरचना सामान्य पाठक के लिए सहज है।
