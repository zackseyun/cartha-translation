  text: וַ/יֹּ֗אמֶר הֵ֥ן עוֹד֙ הַ/יּ֣וֹם גָּד֔וֹל לֹא עֵ֖ת הֵאָסֵ֣ף הַ/מִּקְנֶ֑ה הַשְׁק֥וּ הַ/צֹּ֖אן וּ/לְכ֥וּ רְעֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/007.yaml
  text: Then he said[a], “Look, the day is still long; it is not time for the livestock to be gathered. Water the flock[b], then go and pasture them.”
translation:
  language: hi
  text: तब उसने कहा, “देखो, अभी दिन बहुत बाकी है; पशुओं को इकट्ठा करने का समय नहीं हुआ है। झुंड को पानी पिलाओ, फिर जाओ और उन्हें चराओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; ‘देखो’ आधुनिक और स्वाभाविक हिन्दी में उसके संवादात्मक बल को बनाए रखता है।
- source_word: עוֹד הַיּוֹם גָּדוֹל
  choice: अभी दिन बहुत बाकी है
  rationale: शाब्दिक रूप से ‘दिन अभी बड़ा/लंबा है’; यह इब्रानी मुहावरा बताता है कि दिन का काफी समय शेष है। चुना हुआ रूप हिन्दी में यही भाव स्वाभाविक ढंग से देता है।
- source_word: לֹא עֵת הֵאָסֵף הַמִּקְנֶה
  choice: पशुओं को इकट्ठा करने का समय नहीं हुआ है
  rationale: מִקְנֶה पालतू पशुओं के लिए व्यापक सामूहिक संज्ञा है, और הֵאָסֵף का निष्क्रिय अर्थ ‘इकट्ठा किया जाना’ है। हिन्दी में सक्रिय-अनिश्चित रचना सहज है और अर्थ को सुरक्षित रखती है।
- source_word: הַשְׁקוּ
  choice: पानी पिलाओ
  rationale: שׁקה का हिफ़ील आज्ञार्थक रूप ‘पानी देना/पिलाना’ है; ‘पानी पिलाओ’ स्पष्ट और बोलचाल में स्वाभाविक है।
- source_word: הַצֹּאן
  choice: भेड़-बकरियों
  rationale: צֹאן छोटे पालतू पशुओं—विशेषतः भेड़ों और बकरियों—का सामूहिक संकेत कर सकता है; ‘भेड़-बकरियाँ’ हिन्दी पाठक के लिए इसकी व्याप्ति स्पष्ट करता है।
- source_word: וּלְכוּ רְעוּ
  choice: फिर जाकर उन्हें चराओ
  rationale: दोनों बहुवचन आज्ञाओं का क्रम सुरक्षित है। רעה यहाँ पशुओं को चराने/चरागाह में ले जाने के अर्थ में है।
theological_decisions: []
