  register: आधुनिक मानक हिन्दी; संवाद सरल, स्वाभाविक और गरिमापूर्ण रखा गया है। मूल के सामूहिक पशु-संबंधी शब्दों का भेद ‘पशुओं’ और ‘भेड़-बकरियों’ से व्यक्त किया गया है।
