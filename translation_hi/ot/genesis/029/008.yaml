  text: וַ/יֹּאמְרוּ֮ לֹ֣א נוּכַל֒ עַ֣ד אֲשֶׁ֤ר יֵאָֽסְפוּ֙ כָּל הָ֣/עֲדָרִ֔ים וְ/גָֽלֲלוּ֙ אֶת הָ/אֶ֔בֶן מֵ/עַ֖ל פִּ֣י הַ/בְּאֵ֑ר וְ/הִשְׁקִ֖ינוּ הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/008.yaml
  text: They said[a], “We cannot until all the flocks are gathered and they roll the stone away from the mouth of the well[b]; then we water the sheep.”
translation:
  language: hi
  text: उन्होंने कहा, “जब तक सभी झुंड इकट्ठे न हो जाएँ और कुएँ के मुँह पर से पत्थर न लुढ़का दिया जाए, तब तक हम भेड़-बकरियों को पानी नहीं पिला सकते। उसके बाद हम उन्हें पानी पिलाते हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נוּכַל
  choice: हम ऐसा नहीं कर सकते
  rationale: पहले पुरुष बहुवचन में יכל असमर्थता व्यक्त करता है। हिंदी में पूर्व प्रसंग से आशय स्पष्ट होने के कारण ‘ऐसा’ जोड़ना स्वाभाविक है।
- source_word: יֵאָסְפוּ
  choice: इकट्ठे न हो जाएँ
  rationale: אסף का निफ़अल रूप यहाँ झुंडों के एक स्थान पर इकट्ठा हो जाने को दर्शाता है; עַד אֲשֶׁר के साथ हिंदी में ‘जब तक...न’ स्वाभाविक है।
- source_word: הָעֲדָרִים
  choice: सभी झुंड
  rationale: עדר पशुओं के झुंड के लिए सामान्य शब्द है; यहाँ पशु-प्रकार को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: וְגָלֲלוּ אֶת־הָאֶבֶן
  choice: लोग ... पत्थर न लुढ़का दें
  rationale: גלל का अर्थ ‘लुढ़काना’ है। हिब्रू का अनिर्दिष्ट बहुवचन कर्ता हिंदी में ‘लोग’ से स्वाभाविक रूप में व्यक्त हुआ है।
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: कुएँ के मुँह पर से
  rationale: पी ‘मुँह’ के ठोस हिब्रू रूपक को सुरक्षित रखता है और हिंदी में कुएँ के खुले भाग के लिए समझने योग्य है।
- source_word: וְהִשְׁקִינוּ
  choice: उसके बाद हम ... पानी पिलाते हैं
  rationale: שקה का हिफ़ील ‘पानी पिलाना’ है। अंतिम क्रिया को सामान्य प्रथा के रूप में वर्तमान काल में रखा गया है और क्रम को ‘उसके बाद’ से स्पष्ट किया गया है।
- source_word: הַצֹּאן
  choice: भेड़-बकरियों
  rationale: צאן सामूहिक रूप से छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, को दर्शा सकता है; ‘भेड़-बकरियाँ’ हिंदी में इसकी व्यापकता को सहजता से व्यक्त करता है।
