translation_notes:
  register: आधुनिक मानक हिंदी; संवाद स्वाभाविक किंतु गरिमापूर्ण रखा गया है। कुएँ के ‘मुँह’ की मूल ठोस छवि सुरक्षित है। हिब्रू की क्रमिक संरचना को दो वाक्यों में व्यक्त किया गया है ताकि असमर्थता और प्रचलित प्रक्रिया दोनों स्पष्ट रहें।
