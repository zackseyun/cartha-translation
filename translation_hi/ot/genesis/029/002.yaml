source:
  edition: WLC
  text: וַ/יַּ֞רְא וְ/הִנֵּ֧ה בְאֵ֣ר בַּ/שָּׂדֶ֗ה וְ/הִנֵּה שָׁ֞ם שְׁלֹשָׁ֤ה עֶדְרֵי צֹאן֙ רֹבְצִ֣ים עָלֶ֔י/הָ כִּ֚י מִן הַ/בְּאֵ֣ר הַ/הִ֔וא יַשְׁק֖וּ הָ/עֲדָרִ֑ים וְ/הָ/אֶ֥בֶן גְּדֹלָ֖ה עַל פִּ֥י הַ/בְּאֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/002.yaml
  text: He looked[a], and behold, there was a well in the field, and behold, three flocks of sheep were lying there beside it, because from that well they watered the flocks[e][d][c][b]. And the stone on the mouth of the well was large.
translation:
  language: hi
  text: उसने देखा, और देखो, मैदान में एक कुआँ था। और देखो, उसके पास[a] भेड़-बकरियों के तीन झुंड लेटे हुए थे, क्योंकि लोग उसी कुएँ से झुंडों को पानी पिलाते थे[b]। कुएँ के मुँह पर[c] एक बड़ा पत्थर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उस पर।”
    reason: मूल स्थान-संबंधी अभिव्यक्ति को दर्ज करना।
  - marker: b
    text: या, “झुंडों को पानी पिलाया करते थे।”
    reason: इब्रानी अपूर्ण क्रिया यहाँ प्रचलित या बार-बार होने वाली क्रिया भी व्यक्त कर सकती है।
  - marker: c
    text: अर्थात् कुएँ के खुले भाग पर।
    reason: इब्रानी मुहावरे “कुएँ के मुँह” का आशय स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּרְא
  choice: उसने देखा
  rationale: ראה का सामान्य अर्थ ‘देखना’ है; यह रूप कथा को आगे बढ़ाते हुए सामने आए दृश्य का परिचय देता है।
- source_word: וְהִנֵּה ... וְהִנֵּה
  choice: और देखो ... और देखो
  rationale: दोनों बार आए הִנֵּה को बनाए रखने से मूल की सजीव, ध्यान खींचने वाली पुनरुक्ति सुरक्षित रहती है।
- source_word: בַּשָּׂדֶה
  choice: मैदान में
  rationale: שׂדה यहाँ खेत अथवा खुले मैदानी क्षेत्र को सूचित कर सकता है; ‘मैदान’ प्रसंग में स्वाभाविक और व्यापक है।
- source_word: שְׁלֹשָׁה עֶדְרֵי צֹאן
  choice: भेड़-बकरियों के तीन झुंड
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, दोनों को समेट सकता है; संयुक्त अभिव्यक्ति स्रोत की अर्थ-सीमा को बनाए रखती है।
- source_word: רֹבְצִים
  choice: लेटे हुए थे
  rationale: רבץ पशुओं के लेटने या विश्राम करने को दर्शाता है; ‘लेटे हुए थे’ इसका सीधा और स्वाभाविक रूप है।
- source_word: עָלֶיהָ
  choice: उसके पास
  rationale: शाब्दिक स्थान-संबंध ‘उस पर’ है, किंतु कुएँ और झुंडों के प्रसंग में अभिप्राय उसके पास होने का है।
- source_word: יַשְׁקוּ
  choice: लोग ... पानी पिलाते थे
  rationale: हिफ़िल रूप का अर्थ पशुओं को पानी पिलाना है। इब्रानी में बहुवचन कर्ता अनिर्दिष्ट है; हिंदी में ‘लोग’ उस अनिर्दिष्ट कर्ता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל פִּי הַבְּאֵר
  choice: कुएँ के मुँह पर
  rationale: यह मूल रूपक का निकट अनुवाद है और कुएँ के खुले भाग पर रखे पत्थर का स्पष्ट बोध कराता है।
