lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: और शाम को
  rationale: इब्रानी कथानक-सूत्र और समय-सूचक वाक्यांश को आधुनिक, सहज हिन्दी में संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּקַּח
  choice: उसने ... को लिया
  rationale: לקח का सीधा कथात्मक अर्थ ‘लेना’ है; यह पाठ में निहित बात से अधिक उद्देश्य नहीं जोड़ता।
- source_word: לֵאָה בִתּוֹ
  choice: अपनी बेटी लिआ
  rationale: हिन्दी की स्वाभाविक पद-रचना अपनाते हुए नाम और पारिवारिक संबंध दोनों सुरक्षित रखे गए हैं।
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו
  choice: उसे याकूब के पास ले आया
  rationale: हिफ़ील रूप का अर्थ ‘लाना’ है। पूर्वपद के संदर्भ से सर्वनाम ‘उसके’ को स्पष्ट करने के लिए ‘याकूब’ कहा गया है।
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: याकूब ने उसके साथ संबंध बनाए
  rationale: בוא אל यहाँ यौन-संबंध के लिए प्रचलित इब्रानी शिष्टोक्ति है। शब्दशः हिन्दी ‘उसके भीतर गया’ अस्वाभाविक और भ्रामक होगी; यह चयन अर्थ को मर्यादित और स्पष्ट ढंग से देता है।
