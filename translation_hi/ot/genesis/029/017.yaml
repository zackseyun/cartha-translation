  rationale: 'The revision replaces ‘रूप और रंग’ with ‘सुन्दर आकृति और सुन्दर रूप’ so that the translation does not imply complexion and instead preserves both Hebrew descriptions: beauty of form/figure and beauty of appearance. The ambiguity of Leah’s eye description and its explanatory footnote are retained.'
