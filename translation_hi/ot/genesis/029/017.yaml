  text: लिआ की आँखें कोमल[a] थीं, पर राहेल सुन्दर आकृति और सुन्दर रूप वाली थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नाज़ुक” अथवा “दुर्बल।” इब्रानी विशेषण कोमलता या नाज़ुकी का बोध करा सकता है; यहाँ उसका ठीक-ठीक आशय निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: आँखें
  rationale: इब्रानी रचना स्पष्ट रूप से लिआ की आँखों का उल्लेख करती है, न कि उसके समूचे रूप का।
- source_word: רַכּוֹת
  choice: कोमल
  rationale: विशेषण में कोमलता, नाज़ुकी या दुर्बलता का भाव हो सकता है। ‘कोमल’ सबसे कम मूल्यांकनात्मक विकल्प है और मूल की अनिश्चितता को अनावश्यक रूप से नकारात्मक नहीं बनाता।
- source_word: יְפַת תֹּאַר
  choice: रूप में सुन्दर
  rationale: यह पदबंध शारीरिक गठन या आकृति की सुन्दरता बताता है; ‘रूप’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उस अर्थ को व्यक्त करता है।
- source_word: וִיפַת מַרְאֶה
  choice: रंग में सुन्दर
  rationale: מַרְאֶה दिखाई देने वाले स्वरूप या मुखाकृति की ओर संकेत करता है। ‘रूप और रंग’ का प्रचलित हिन्दी युग्म मूल के गठन और दृश्य स्वरूप के दोहरे वर्णन को सहज ढंग से सुरक्षित रखता है।
- source_word: וְ
  choice: पर
  rationale: यद्यपि मूल संयोजक सामान्यतः ‘और’ है, यहाँ दोनों बहनों के वर्णन में प्रसंगगत विरोध है; ‘पर’ उसे स्वाभाविक हिन्दी में व्यक्त करता है।
