base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/004.yaml
  text: Jacob said to them[a], “My brothers, where are you from?” They said[b], “We are from Haran.”
translation:
  language: hi
  text: याकूब ने उनसे कहा, “मेरे भाइयो,[a] तुम कहाँ के हो?” उन्होंने कहा, “हम हारान के हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मेरे भाइयो” विनम्रतापूर्वक किया गया भ्रातृ-संबोधन है; इससे यह आवश्यक नहीं कि वे सचमुच उसके सगे या संबंधी थे।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: उनसे कहा
  rationale: אמר सामान्य कथन-क्रिया है और לָהֶם संबोधन का अप्रत्यक्ष कर्म है; इसलिए स्वाभाविक हिन्दी में ‘उनसे कहा’ उपयुक्त है।
- source_word: אַחַי
  choice: मेरे भाइयो
  rationale: शाब्दिक अर्थ ‘मेरे भाइयो’ है। सम्बोधन रूप ‘भाइयो’ पुरुष-बहुवचन चरवाहों के प्रति विनम्र भ्रातृ-संबोधन को बनाए रखता है।
- source_word: מֵאַיִן אַתֶּם
  choice: तुम कहाँ के हो
  rationale: מֵאַיִן उद्गम या स्थान पूछता है। ‘तुम कहाँ के हो?’ आधुनिक हिन्दी में स्वाभाविक है और हिब्रू के आशय को स्पष्ट रखता है।
- source_word: מֵחָרָן אֲנָחְנוּ
  choice: हम हारान के हैं
  rationale: מִן उद्गम बताता है और स्वतंत्र सर्वनाम אֲנָחְנוּ उत्तर पर बल देता है। हिन्दी में स्वाभाविक वाक्य के लिए ‘हैं’ जोड़ा गया है।
- source_word: חָרָן
  choice: हारान
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
