base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/026.yaml
  text: Laban said[a], “It is not done this way in our place[c][b], to give the younger before the older.”
translation:
  language: hi
  text: लाबान ने कहा, “हमारे यहाँ ऐसा नहीं किया जाता कि बड़ी से पहले छोटी को ब्याह दिया जाए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: אמר के कथात्मक रूप का स्वाभाविक मानक हिन्दी अनुवाद।
- source_word: לָבָן
  choice: लाबान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לֹא יֵעָשֶׂה כֵן
  choice: ऐसा नहीं किया जाता
  rationale: निफ़अल रूप यहाँ किसी स्थानीय रीति या मान्य व्यवहार को व्यक्त करता है; यह हिन्दी में उसी निर्वैयक्तिक भाव को सहजता से रखता है।
- source_word: בִּמְקוֹמֵנוּ
  choice: हमारे यहाँ
  rationale: शाब्दिक अर्थ ‘हमारे स्थान में’ है, पर सन्दर्भ में स्थानीय समाज और उसकी प्रथा अभिप्रेत है; ‘हमारे यहाँ’ स्वाभाविक और सटीक है।
- source_word: לָתֵת
  choice: ब्याह दिया जाए
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘देना’ है, किन्तु प्रसंग स्पष्टतः विवाह में बेटी देने का है; हिन्दी में केवल ‘देना’ अस्पष्ट और अस्वाभाविक होता।
- source_word: הַצְּעִירָה
  choice: छोटी
  rationale: स्त्रीलिंग विशेषण संज्ञा के रूप में प्रयुक्त है और छोटी बेटी को सूचित करता है; ‘छोटी’ हिन्दी में स्वाभाविक है।
- source_word: לִפְנֵי
  choice: से पहले
  rationale: यहाँ स्थान नहीं, क्रम में प्राथमिकता व्यक्त होती है।
- source_word: הַבְּכִירָה
  choice: बड़ी
  rationale: स्त्रीलिंग रूप बड़ी अथवा पहलौठी बेटी को दर्शाता है; छोटी के साथ ‘बड़ी’ स्वाभाविक तुलनात्मक जोड़ी बनाती है, जबकि जन्मक्रम का भाव बना रहता है।
