id: GEN.20.4
reference: Genesis 20:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑י/הָ וַ/יֹּאמַ֕ר אֲדֹנָ֕/י הֲ/ג֥וֹי גַּם צַדִּ֖יק תַּהֲרֹֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/004.yaml
  text: Abimelech had not come near her[a], so he said, “Lord[b], will you kill even a righteous nation?”
translation:
  language: hi
  text: अबीमेलेक उसके निकट नहीं गया था[a]। उसने कहा, “हे प्रभु, क्या तू एक निर्दोष राष्ट्र[b] को भी मार डालेगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसके निकट जाना’ यहाँ एक इब्रानी मुहावरा है, जिसका अर्थ सारा के साथ यौन-संबंध बनाना है।
    reason: cultural_note
  - marker: b
    text: या ‘निर्दोष लोगों’। इब्रानी शब्द किसी जनसमुदाय या राष्ट्र के लिए प्रयुक्त सामूहिक संज्ञा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַב אֵלֶיהָ
  choice: उसके निकट नहीं गया था
  rationale: यह इब्रानी मुहावरे का निकटवर्ती रूप है; प्रसंग में इसका आशय सारा के साथ यौन-संबंध न बनाने से है। पाठ में मूल अभिव्यक्ति रखकर अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: अबीमेलेक स्वप्न में परमेश्वर को संबोधित कर रहा है। संबोधन के लिए ‘हे प्रभु’ स्वाभाविक और गरिमापूर्ण हिन्दी है; ‘प्रभु परमेश्वर’ मूल से अतिरिक्त होगा।
- source_word: גּוֹי
  choice: राष्ट्र
  rationale: यह शब्द किसी सामूहिक जनसमुदाय या राष्ट्र को सूचित करता है। ‘राष्ट्र’ अबीमेलेक की विनती के सामूहिक दायरे को बनाए रखता है, जबकि पादटिप्पणी ‘लोग’ की सम्भावना बताती है।
- source_word: גַּם
  choice: भी
  rationale: 'प्रश्न में यह बलाघात देता है: क्या निर्दोष राष्ट्र तक को मार डाला जाएगा? हिन्दी में ‘भी’ इस बल को स्वाभाविक रूप से व्यक्त करता है।'
- source_word: צַדִּיק
  choice: निर्दोष
  rationale: इस प्रसंग में अबीमेलेक दोषरहित होने की दलील दे रहा है। ‘निर्दोष’ न्यायिक और नैतिक आशय को स्वाभाविक हिन्दी में व्यक्त करता है; ‘धर्मी’ सम्भव है, पर यहाँ भक्ति या स्थायी धार्मिक चरित्र का अनावश्यक संकेत दे सकता है।
- source_word: תַּהֲרֹג
  choice: मार डालेगा
  rationale: प्रत्यक्ष आलंकारिक प्रश्न में इब्रानी अपूर्ण क्रिया का भावी आशय हिन्दी के ‘मार डालेगा’ से स्पष्ट और स्वाभाविक रूप में आता है।
- source_word: וַאֲבִימֶלֶךְ ... וַיֹּאמַר
  choice: अबीमेलेक ...। उसने कहा
  rationale: वाव-रूप कथा को आगे बढ़ाते हैं। दो छोटे वाक्य आधुनिक हिन्दी में क्रम को साफ रखते हैं और मूल में निहित न होने वाला स्पष्ट कारणसूचक शब्द जोड़ने से बचते हैं।
theological_decisions:
- issue: अबीमेलेक की विनती में גּוֹי का सामूहिक दायरा
  choice: ‘राष्ट्र’ रखकर सामूहिक अर्थ को सुरक्षित रखा गया है।
  alternative: ‘लोग’ या ‘घराना’
  rationale: इब्रानी शब्द एक सामूहिक जनसमुदाय को दर्शाता है और प्रसंग में संकट अकेले राजा तक सीमित नहीं है। ‘राष्ट्र’ ठीक राजनीतिक आकार निर्धारित किए बिना इस तनाव को बनाए रखता है।
- issue: צַדִּיק का नैतिक या न्यायिक अर्थ
  choice: ‘निर्दोष’
  alternative: ‘धर्मी’ या ‘न्यायी’
  rationale: अबीमेलेक यहाँ इस विशेष मामले में दोष न होने की अपील करता है। ‘निर्दोष’ उस दावे को व्यक्त करता है, बिना यह निर्णय दिए कि वह और उसका राष्ट्र हर अर्थ में धर्मी हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। परमेश्वर को संबोधित करते समय एकवचन ‘तू’ बाइबिलीय प्रत्यक्षता को बनाए रखता है। मूल इब्रानी के यौन-संबंध संबंधी मुहावरे को मुख्य पाठ में सुरक्षित रखकर पादटिप्पणी में स्पष्ट किया गया है।
