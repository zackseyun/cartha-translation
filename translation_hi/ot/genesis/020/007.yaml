source:
  edition: WLC
  text: וְ/עַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת הָ/אִישׁ֙ כִּֽי נָבִ֣יא ה֔וּא וְ/יִתְפַּלֵּ֥ל בַּֽעַדְ/ךָ֖ וֶֽ/חְיֵ֑ה וְ/אִם אֵֽינְ/ךָ֣ מֵשִׁ֗יב דַּ֚ע כִּי מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/007.yaml
  text: Now then[a], return the man's wife, for he is a prophet, and he will pray for you, and you will live. But if you do not return her, know that you will surely die—you and all who are yours.
translation:
  language: hi
  text: अब उस मनुष्य की पत्नी को लौटा दो, क्योंकि वह नबी है। वह तुम्हारे लिए प्रार्थना करेगा और तुम जीवित रहोगे। पर यदि तुम उसे न लौटाओ, तो जान लो कि तुम निश्चय ही मर जाओगे—तुम और तुम्हारे सब लोग[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम और जो कुछ तुम्हारा है” अथवा “तुम और तुम्हारा सब कुछ।” इब्रानी अभिव्यक्ति व्यापक है और इसमें अबीमेलेक के घराने के लोगों के साथ उसकी संपत्ति भी शामिल हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पदबंध समय के साथ पिछले कथन से निष्कर्ष और तत्काल आदेश की ओर संक्रमण भी दिखाता है।
- source_word: הָשֵׁב
  choice: लौटा दो
  rationale: हिफ़ील आज्ञार्थ यहाँ स्त्री को उसके पति के पास वापस करने का आदेश देता है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: אֵשֶׁת הָאִישׁ
  choice: उस मनुष्य की पत्नी
  rationale: यह इब्रानी संबंधवाचक रचना को सुरक्षित रखता है और स्पष्ट करता है कि स्त्री विवाहित है।
- source_word: כִּי נָבִיא הוּא
  choice: क्योंकि वह नबी है
  rationale: כִּי आदेश का कारण देता है और נָבִיא का सीधा, प्रचलित समतुल्य ‘नबी’ है।
- source_word: וְיִתְפַּלֵּל בַּעַדְךָ
  choice: वह तुम्हारे लिए प्रार्थना करेगा
  rationale: यिक़्तोल को भावी/परिणामी कथन के रूप में लिया गया है; בְּעַד में किसी की ओर से प्रार्थना करने का भाव है।
- source_word: וֶחְיֵה
  choice: और तुम जीवित रहोगे
  rationale: रूप आज्ञार्थ है, पर इस क्रम में अबीमेलेक के जीवित रहने के परिणाम को व्यक्त करता है; हिन्दी में भविष्यकाल इसका आशय स्वाभाविक ढंग से देता है।
- source_word: וְאִם אֵינְךָ מֵשִׁיב
  choice: पर यदि तुम उसे न लौटाओ
  rationale: नकार के साथ कृदन्त लौटाने से इनकार या ऐसा न करने की दशा बताता है; ‘उसे’ संदर्भ में पत्नी के लिए स्पष्ट रूप से जोड़ा गया है।
- source_word: דַּע
  choice: जान लो
  rationale: प्रत्यक्ष आज्ञार्थ गंभीर चेतावनी प्रस्तुत करता है; ‘जान लो’ आधुनिक हिन्दी में उसका बल बनाए रखता है।
- source_word: מוֹת תָּמוּת
  choice: तुम निश्चय ही मर जाओगे
  rationale: क्रियार्थक संज्ञा और सीमित क्रिया का संयोजन मृत्यु की निश्चितता पर बल देता है; ‘निश्चय ही’ उस तीव्रता को व्यक्त करता है।
- source_word: אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: तुम और तुम्हारे सभी लोग
  rationale: व्यापक इब्रानी अभिव्यक्ति अबीमेलेक के घराने के लोगों तथा उससे संबंधित सबको समेट सकती है। मृत्यु की चेतावनी के संदर्भ में व्यक्ति-सूचक अनुवाद सर्वाधिक स्वाभाविक है, जबकि व्यापकता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ‘तुम और כל אשר לך’ में न्याय का दायरा
  choice: तुम और तुम्हारे सभी लोग
  alternative: तुम और जो कुछ तुम्हारा है / तुम और तुम्हारा सब कुछ
  rationale: निकटवर्ती कथा में दण्ड पूरे घराने को प्रभावित करता है, इसलिए व्यक्ति-सम्मिलित रूप संदर्भ के अनुकूल है। फिर भी मूल अभिव्यक्ति व्यापक है और केवल लोगों तक स्पष्ट रूप से सीमित नहीं, इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। परमेश्वर द्वारा एक पुरुष को संबोधित करने वाले एकवचन रूपों को हिन्दी के स्वाभाविक सम्मानसूचक ‘तुम’ रूप में व्यक्त किया गया है; वाक्यों में चेतावनी की गंभीरता और मूल की संक्षिप्तता बनाए रखी गई है।
