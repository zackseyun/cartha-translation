  yaml_path: translation/ot/genesis/020/011.yaml
  text: And Abraham said[a], “Because I said, ‘Surely there is no fear of God in this place, and they will kill me because of my wife.’”
translation:
  language: hi
  text: अब्राहम ने कहा, “क्योंकि मैंने कहा था, ‘निश्चय ही इस स्थान में परमेश्वर का भय[a] नहीं है, और वे मेरी पत्नी के कारण मुझे मार डालेंगे।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के प्रति श्रद्धा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अब्राहम के पिछले आचरण का कारण बताता है; हिन्दी में ‘क्योंकि’ इसके कारणसूचक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָמַרְתִּי
  choice: मैंने मन में कहा था
  rationale: मूल क्रिया का सामान्य अर्थ ‘कहना’ है, पर यहाँ वह अब्राहम के आन्तरिक विचार को बताती है। ‘मन में कहा’ मूल बिम्ब और प्रसंगगत अर्थ दोनों को बनाए रखता है।
- source_word: רַק
  choice: निश्चय ही
  rationale: यहाँ यह शब्द अब्राहम की दृढ़ धारणा पर बल देता है; ‘निश्चय ही’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: אֵין יִרְאַת אֱלֹהִים
  choice: परमेश्वर का भय नहीं है
  rationale: यह मूल धार्मिक-नैतिक मुहावरे को सुरक्षित रखता है और परमेश्वर के सामने उत्तरदायित्व का भाव व्यक्त करता है।
- source_word: בַּמָּקוֹם הַזֶּה
  choice: इस स्थान में
  rationale: यह स्थानसूचक वाक्यांश का सीधा और स्वाभाविक अनुवाद है।
- source_word: וַהֲרָגוּנִי
  choice: और ... वे मुझे मार डालेंगे
  rationale: यह अब्राहम द्वारा अपेक्षित परिणाम को व्यक्त करता है; ‘मार डालेंगे’ हत्या के आशय को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: עַל דְּבַר אִשְׁתִּי
  choice: मेरी पत्नी के कारण
  rationale: यह इब्रानी मुहावरे के कारणसूचक अर्थ को स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: יִרְאַת אֱלֹהִים का अनुवाद
  choice: परमेश्वर का भय
  alternative: परमेश्वर के प्रति श्रद्धा
  rationale: ‘भय’ मूल इब्रानी पद और उसके बाइबलीय धार्मिक-नैतिक भार को बनाए रखता है; पादटिप्पणी अधिक व्याख्यात्मक विकल्प देती है, बिना मुख्य पाठ के तनाव को कम किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘मन में कहा’ आन्तरिक विचार को स्वाभाविक बनाता है, जबकि ‘परमेश्वर का भय’ मूल बाइबलीय मुहावरे को सुरक्षित रखता है।
