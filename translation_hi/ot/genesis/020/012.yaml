  text: וְ/גַם אָמְנָ֗ה אֲחֹתִ֤/י בַת אָבִ/י֙ הִ֔וא אַ֖ךְ לֹ֣א בַת אִמִּ֑/י וַ/תְּהִי לִ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/012.yaml
  text: Besides[a], she really is my sister—the daughter of my father, though not the daughter of my mother—and she became my wife.
translation:
  language: hi
  text: इसके अलावा[a], वह सचमुच मेरी बहन है—वह मेरे पिता की बेटी है, लेकिन मेरी माँ की बेटी नहीं—और वह मेरी पत्नी बनी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और वास्तव में वह मेरी बहन है—मेरे पिता की बेटी, पर मेरी माँ की बेटी नहीं।”'
    reason: וְגַם के शाब्दिक संयोजक रूप और पूरे कथन की अधिक औपचारिक संरचना को दिखाने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וְגַם
  choice: इसके अलावा
  rationale: संयोजक और योगसूचक अव्यय अब्राहम के बचाव में एक और तथ्य जोड़ते हैं; ‘इसके अलावा’ आधुनिक हिन्दी में इस संवादगत कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָמְנָה
  choice: सचमुच
  rationale: यह अव्यय कथन की सत्यता पर बल देता है; ‘सचमुच’ सहज और गरिमापूर्ण हिन्दी है।
- source_word: אֲחֹתִי
  choice: मेरी बहन
  rationale: यह प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय के साथ सीधा नातेदारी-सूचक शब्द है।
- source_word: בַת אָבִי
  choice: मेरे पिता की बेटी
  rationale: यह समानाधिकरण पद स्पष्ट करता है कि वह किस अर्थ में उसकी बहन है और अगले समानांतर वाक्यांश की संरचना बनाए रखता है।
- source_word: הִוא
  choice: वह ... है
  rationale: इब्रानी का संज्ञात्मक वाक्य वर्तमान संबंध को व्यक्त करता है; हिन्दी में वर्तमानकालीन ‘है’ स्वाभाविक है।
- source_word: אַךְ לֹא
  choice: लेकिन ... नहीं
  rationale: यहाँ अव्यय पहले कथन को सीमित या स्पष्ट करता है; ‘लेकिन ... नहीं’ उस विरोधात्मक योग्यता को साफ़ और स्वाभाविक ढंग से रखता है।
- source_word: בַת אִמִּי
  choice: मेरी माँ की बेटी
  rationale: यह ‘मेरे पिता की बेटी’ के समानांतर पारिवारिक संबंध को यथावत रखता है।
- source_word: וַתְּהִי לִי לְאִשָּׁה
  choice: और वह मेरी पत्नी बनी
  rationale: היה के साथ दोहरे לְ का यह प्रयोग विवाह की अवस्था में प्रवेश को दर्शाता है; ‘पत्नी बनी’ घटनात्मक अर्थ को ‘पत्नी थी’ से बेहतर सुरक्षित रखता है।
