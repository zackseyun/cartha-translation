  text: וַ/יֹּ֧אמֶר אַבְרָהָ֛ם אֶל שָׂרָ֥ה אִשְׁתּ֖/וֹ אֲחֹ֣תִ/י הִ֑וא וַ/יִּשְׁלַ֗ח אֲבִימֶ֨לֶךְ֙ מֶ֣לֶךְ גְּרָ֔ר וַ/יִּקַּ֖ח אֶת שָׂרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/002.yaml
  text: And Abraham said of Sarah his wife[b][a], “She is my sister.” So Abimelech king of Gerar sent and took Sarah.
translation:
  language: hi
  text: अब्राहम ने अपनी पत्नी सारा के विषय में कहा,[a] “वह मेरी बहन है।” तब गरार के राजा अबीमेलेक ने भेजकर सारा को ले लिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी पत्नी सारा से कहा।” इब्रानी संबंधबोधक शब्द का अधिक शाब्दिक अर्थ ऐसा हो सकता है, पर “वह मेरी बहन है” कथन के कारण संदर्भ में सारा के विषय में बोलना अधिक उपयुक्त जान पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात, अबीमेलेक ने सारा को अपने पास लाने का आदेश दिया; इब्रानी में संक्षेप से केवल “भेजा और सारा को ले लिया” है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: אמר के सामान्य कथात्मक रूप का स्वाभाविक और सीधा हिन्दी समतुल्य।
- source_word: אֶל שָׂרָה אִשְׁתּוֹ
  choice: अपनी पत्नी सारा के विषय में
  rationale: אֶל सामान्यतः ‘से/को’ हो सकता है, पर उद्धृत कथन ‘वह मेरी बहन है’ इस संदर्भ में सारा के विषय में कही गई बात को अधिक स्वाभाविक बनाता है; पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: אֲחֹתִי הִוא
  choice: वह मेरी बहन है
  rationale: संज्ञात्मक इब्रानी वाक्य और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय का सीधा, सहज हिन्दी रूप।
- source_word: וַיִּשְׁלַח
  choice: लोगों को भेजकर
  rationale: मूल में केवल ‘भेजा’ है और भेजे गए व्यक्तियों का उल्लेख निहित है; हिन्दी में अगली क्रिया से स्वाभाविक संबंध बनाने के लिए निहित कर्म को सामान्य रूप में व्यक्त किया गया है।
- source_word: מֶלֶךְ גְּרָר
  choice: गरार के राजा
  rationale: इब्रानी रचना का स्वाभाविक हिन्दी संबंधवाचक रूप।
- source_word: וַיִּקַּח אֶת שָׂרָה
  choice: सारा को बुलवा लिया
  rationale: शाब्दिक अर्थ ‘सारा को ले लिया’ है; राजकीय संदर्भ में भेजे गए लोगों के द्वारा उसे अपने पास मँगाने का भाव आधुनिक हिन्दी में इससे स्पष्ट होता है, जबकि पादटिप्पणी मूल की संक्षिप्त अभिव्यक्ति बताती है।
theological_decisions:
- issue: अबीमेलेक की कार्रवाई का संभावित व्याख्यात्मक विस्तार
  choice: सारा को बुलवा लिया
  alternative: सारा को पत्नी बना लिया / सारा को अपने घराने में ले लिया
  rationale: इस पद में इब्रानी केवल ‘सारा को ले लिया’ कहती है। विवाह या रखैल बनाने का उद्देश्य स्पष्ट रूप से जोड़ना स्रोत से आगे जाता, इसलिए मुख्य पाठ उस विस्तार से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘पत्नी’, ‘बहन’, ‘राजा’ जैसे सामान्य शब्द अपनाए गए हैं; न तो विवाह का उद्देश्य मुख्य पाठ में जोड़ा गया है, न इब्रानी की संभावित अस्पष्टता छिपाई गई है।
