base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/005.yaml
  text: Did he not himself say to me[a], ‘She is my sister’? And she herself also said, ‘He is my brother.’ In the integrity of my heart and the innocence of my hands I have done this.
translation:
  language: hi
  text: क्या उसी ने मुझसे नहीं कहा था, “वह मेरी बहन है”? और उसने स्वयं भी कहा था, “वह मेरा भाई है।” मैंने यह काम निष्कपट मन और निर्दोष हाथों से[a] किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मन की खराई और हाथों की शुद्धता के साथ।” इब्रानी में सच्चाई और निर्दोषता के लिए नैतिक-कानूनी मुहावरों का प्रयोग हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הוּא אָמַר לִי
  choice: क्या उसी ने मुझसे नहीं कहा था
  rationale: नकारात्मक प्रश्न अपेक्षित सकारात्मक उत्तर व्यक्त करता है; ‘उसी ने’ स्वतंत्र सर्वनाम הוּא के बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: אֲחֹתִי הִוא
  choice: वह मेरी बहन है
  rationale: सम्बन्ध-सूचक कथन का सीधा और स्वाभाविक अनुवाद।
- source_word: וְהִיא גַם הִוא אָמְרָה
  choice: और उसने भी स्वयं कहा था
  rationale: גם और स्वतंत्र सर्वनाम के संयुक्त बल को ‘भी स्वयं’ से व्यक्त किया गया है।
- source_word: אָחִי הוּא
  choice: वह मेरा भाई है
  rationale: इब्रानी कथन का सीधा समतुल्य।
- source_word: בְּתָם לְבָבִי
  choice: निष्कपट मन
  rationale: תָם यहाँ मन की सच्चाई, खराई और नेकनीयती का दावा व्यक्त करता है; ‘निष्कपट’ सामान्य आधुनिक हिन्दी में इस भाव को सहजता से संप्रेषित करता है।
- source_word: וּבְנִקְיֹן כַּפַּי
  choice: निर्दोष हाथों से
  rationale: נִקְיֹן כַּפַּי नैतिक-कानूनी निर्दोषता का रूपक है; ‘निर्दोष हाथ’ रूपक और कर्म-संबंधी अर्थ दोनों बनाए रखता है।
- source_word: עָשִׂיתִי זֹאת
  choice: मैंने यह काम ... किया है
  rationale: पूर्ण क्रिया को तत्काल आत्म-पक्षसमर्थन के सन्दर्भ में हिन्दी के पूर्ण वर्तमान से स्वाभाविक रूप दिया गया है।
theological_decisions:
- issue: अबीमेलेक के आत्म-पक्षसमर्थन में नैतिक-कानूनी मुहावरा
  choice: ‘निष्कपट मन और निर्दोष हाथों से’ कहकर इस विशेष काम के विषय में उसकी नेकनीयती और निर्दोषता का दावा व्यक्त किया गया है।
  alternative: ‘मन की खराई और हाथों की शुद्धता में’ जैसा अधिक शब्दशः रूप।
  rationale: पद पूर्ण पापरहितता का सिद्धान्त प्रस्तुत नहीं करता, बल्कि इस घटना के सम्बन्ध में अबीमेलेक का दावा दर्ज करता है। अनुवाद उस सीमा और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘उसी ने’ और ‘भी स्वयं’ मूल के बलाघात को रखते हैं, जबकि अंतिम वाक्य इब्रानी रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
