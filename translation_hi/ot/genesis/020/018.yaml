base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/018.yaml
  text: For Yahweh had completely closed every womb in Abimelech’s household because of Sarah[a], Abraham’s wife.
translation:
  language: hi
  text: क्योंकि यहोवा ने अबीमेलेक के घराने की हर कोख को पूरी तरह[a] बंद कर दिया था, अब्राहम की पत्नी सारा के कारण।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पूरी तरह बंद कर दिया था’ के लिए मूल इब्रानी में उसी धातु का अनन्त रूप क्रिया के साथ रखकर विशेष बल दिया गया है; अनुवाद ‘निश्चय ही बंद कर दिया था’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद की घटना का कारण बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָצֹר עָצַר
  choice: पूरी तरह बंद कर दिया था
  rationale: क्रिया के साथ infinitive absolute क्रिया की तीव्रता और पूर्णता पर बल देता है; पूर्ण भूतकाल पूर्ववर्ती घटना को दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: בְּעַד כָּל רֶחֶם לְבֵית אֲבִימֶלֶךְ
  choice: अबीमेलेक के घराने की हर कोख को
  rationale: ‘घराना’ भौतिक भवन के बजाय अबीमेलेक के गृह-समुदाय को दर्शाता है; ‘हर कोख’ मूल की ठोस शारीरिक छवि बनाए रखती है।
- source_word: עַל דְּבַר שָׂרָה
  choice: सारा के कारण
  rationale: यह वाक्यांश दंड का कारण बताता है।
- source_word: אֵשֶׁת אַבְרָהָם
  choice: जो अब्राहम की पत्नी थी
  rationale: सारा की पहचान और कथा के लिए केंद्रीय वैवाहिक संबंध को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में परिचित लिप्यंतरण ‘यहोवा’ रखा गया है; ‘याहवे’ निकटतर वैकल्पिक लिप्यंतरण है।
- issue: बांझपन के लिए ईश्वरीय कर्तृत्व
  choice: यहोवा ने ... बंद कर दिया था
  alternative: कोखें बंद हो गई थीं
  rationale: मूल इब्रानी यहोवा को स्पष्ट कर्ता बताता है; इसे निष्क्रिय या अस्पष्ट नहीं किया गया।
