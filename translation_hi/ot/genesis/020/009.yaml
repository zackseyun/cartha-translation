reference: Genesis 20:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֲבִימֶ֜לֶךְ לְ/אַבְרָהָ֗ם וַ/יֹּ֨אמֶר ל֜/וֹ מֶֽה עָשִׂ֤יתָ לָּ֨/נוּ֙ וּ/מֶֽה חָטָ֣אתִי לָ֔/ךְ כִּֽי הֵבֵ֧אתָ עָלַ֛/י וְ/עַל מַמְלַכְתִּ֖/י חֲטָאָ֣ה גְדֹלָ֑ה מַעֲשִׂים֙ אֲשֶׁ֣ר לֹא יֵֽעָשׂ֔וּ עָשִׂ֖יתָ עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/009.yaml
  text: Then Abimelech called Abraham and said to him[a], “What have you done to us? And how have I sinned against you[b], that you have brought a great sin on me and on my kingdom? You have done to me things that should not be done.”
translation:
  language: hi
  text: तब अबीमेलेक ने अब्राहम को बुलाकर उससे कहा, “तुमने हमारे साथ यह क्या किया? मैंने तुम्हारे विरुद्ध ऐसा क्या पाप किया था[a] कि तुमने मुझ पर और मेरे राज्य पर इतना बड़ा पाप ला दिया? तुमने मेरे साथ ऐसे काम किए हैं, जो नहीं किए जाने चाहिए[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने तुम्हारा ऐसा क्या अपराध किया था?”
    reason: חטא לְ का अर्थ किसी के विरुद्ध पाप करना या उसका अपराध करना हो सकता है।
  - marker: b
    text: शाब्दिक रूप से, “जो नहीं किए जाते।”
    reason: इब्रानी निष्क्रिय अभिव्यक्ति सामान्यतः अस्वीकार्य या अनुचित माने जाने वाले कामों की ओर संकेत करती है।
lexical_decisions:
- source_word: וַיִּקְרָא ... לְאַבְרָהָם
  choice: अब्राहम को बुलाकर
  rationale: קרא के साथ לְ किसी व्यक्ति को बुलाने का अर्थ देता है। ‘बुलाकर’ स्वाभाविक हिन्दी है और अनावश्यक रूप से औपचारिक ‘तलब किया’ जैसा भाव नहीं जोड़ता।
- source_word: מֶה עָשִׂיתָ לָּנוּ
  choice: तुमने हमारे साथ यह क्या किया?
  rationale: यह प्रत्यक्ष और आरोपपूर्ण प्रश्न है। हिन्दी में ‘यह क्या किया’ वर्तमान परिणाम और विस्मय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּמֶה חָטָאתִי לָךְ
  choice: मैंने तुम्हारे विरुद्ध ऐसा क्या पाप किया था
  rationale: חטא का नैतिक-धार्मिक भार बनाए रखने के लिए ‘पाप किया’ चुना गया है; לָךְ को प्रसंगानुसार ‘तुम्हारे विरुद्ध’ कहा गया है। ‘ऐसा क्या’ अगले परिणामसूचक वाक्य से सहज संबंध बनाता है।
- source_word: הֵבֵאתָ עָלַי וְעַל מַמְלַכְתִּי
  choice: तुमने मुझ पर और मेरे राज्य पर ... ला दिया
  rationale: हिफ़ील रूप के ‘किसी वस्तु को किसी पर ले आना’ वाले रूपक को हिन्दी में सुरक्षित रखा गया है।
- source_word: חֲטָאָה גְדֹלָה
  choice: इतना बड़ा पाप
  rationale: חֲטָאָה पाप, अपराध या उससे उत्पन्न दोष का संकेत दे सकता है। ‘बड़ा पाप’ मूल की नैतिक गंभीरता को बनाए रखता है, जबकि ‘इतना’ आरोप के परिणामसूचक ढाँचे को स्वाभाविक बनाता है।
- source_word: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ
  choice: ऐसे काम ... जो नहीं किए जाने चाहिए
  rationale: शाब्दिक निष्क्रिय रचना सामान्य आचरण की सीमा और नैतिक अनुचितता प्रकट करती है; ‘नहीं किए जाने चाहिए’ आधुनिक हिन्दी में उसका स्वाभाविक अर्थ देता है।
- source_word: עָשִׂיתָ עִמָּדִי
  choice: तुमने मेरे साथ ... किए हैं
  rationale: עשה עם का यहाँ अर्थ किसी के साथ व्यवहार करना या उसके प्रति कुछ करना है। यह चयन आरोपपूर्ण स्वर को स्पष्ट और सहज रखता है।
theological_decisions:
- issue: ‘बड़ा पाप’ किसने किया या उसका दोष किस पर आया
  choice: ‘मुझ पर और मेरे राज्य पर इतना बड़ा पाप ला दिया’
  alternative: ‘मुझे और मेरे राज्य को बड़े दोष का भागी बना दिया’
  rationale: मूल पाठ ‘पाप लाने’ की भाषा का प्रयोग करता है और यह स्पष्ट नहीं करता कि बल मुख्यतः संभावित कृत्य, सामूहिक दोष या दंड पर है। रूपक को बनाए रखने से यह तनाव अनावश्यक रूप से हल नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और संवाद के लिए स्वाभाविक रखी गई है। ‘अबीमेलेक,’ ‘अब्राहम,’ ‘पाप’ और ‘राज्य’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं; आरोप की तीव्रता को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
