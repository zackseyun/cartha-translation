source:
  edition: WLC
  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר הִתְע֣וּ אֹתִ֗/י אֱלֹהִים֮ מִ/בֵּ֣ית אָבִ/י֒ וָ/אֹמַ֣ר לָ֔/הּ זֶ֣ה חַסְדֵּ֔/ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑/י אֶ֤ל כָּל הַ/מָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּ/ה אִמְרִי לִ֖/י אָחִ֥/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/013.yaml
  text: 'And when God caused me to wander from my father’s house[a], I said to her, ‘This is the kindness you must show me: at every place we come to, say of me[b], “He is my brother.”’'
translation:
  language: hi
  text: 'और जब परमेश्वर ने मुझे मेरे पिता के घर से भटकाते फिराया[a], तब मैंने उससे कहा, ‘तुम मुझ पर यह कृपा[b] करना: जहाँ भी हम जाएँ, वहाँ मेरे विषय में कहना, “यह मेरा भाई है।”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे मेरे पिता के घर से भटका दिया।” इब्रानी क्रिया कारक है और भटकने या इधर-उधर फिरने का भाव दे सकती है; यहाँ इसका अर्थ आवश्यक रूप से नैतिक रूप से पथभ्रष्ट होना नहीं है।
    reason: lexical_alternative
  - marker: b
    text: ‘कृपा’ इब्रानी शब्द हेसद का अनुवाद है; संदर्भ के अनुसार इसमें दयालुता, निष्ठावान प्रेम, या विश्वासयोग्य कृपा का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוּ
  choice: भटकते फिरने को निकाला
  rationale: हिफ़ील रूप की कारकता और लगातार अस्थिर भ्रमण, दोनों को व्यक्त करता है; ‘भटका दिया’ नैतिक पथभ्रष्टता का अनावश्यक संकेत दे सकता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: रूप बहुवचन है, पर संदर्भ और क्रिया का आशय अब्राहम के एकमात्र परमेश्वर से है।
- source_word: מִבֵּית אָבִי
  choice: मेरे पिता के घर से
  rationale: इब्रानी पारिवारिक घराने और मूल निवास, दोनों का बोध देता है; यह निकट और स्वाभाविक अनुवाद है।
- source_word: חַסְדֵּךְ
  choice: यह कृपा
  rationale: इस व्यक्तिगत अनुरोध में חסד का अर्थ कृपा या दयालुता है; ‘कृपा’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: תַּעֲשִׂי עִמָּדִי
  choice: तुम मुझ पर ... करना
  rationale: शाब्दिक ‘मेरे साथ करना’ को हिन्दी मुहावरे के अनुसार חסד के साथ ‘मुझ पर कृपा करना’ कहा गया है।
- source_word: אֶל כָּל הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה
  choice: हम जिस-जिस स्थान पर जाएँ, वहाँ
  rationale: वितरणात्मक ‘हर स्थान’ और वहाँ पहुँचने की धारणा को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: אִמְרִי לִי
  choice: मेरे विषय में कहना
  rationale: इब्रानी ‘मेरे लिए/मुझसे कहना’ का संदर्भगत आशय दूसरों से अब्राहम के विषय में यह बात कहना है।
- source_word: אָחִי הוּא
  choice: यह मेरा भाई है
  rationale: प्रत्यक्ष कथन में ‘भाई’ को यथावत रखा गया है, क्योंकि कथा इसी दावे पर निर्भर है।
theological_decisions:
- issue: अब्राहम के भ्रमण में परमेश्वर की भूमिका
  choice: परमेश्वर ने मुझे ... भटकते फिरने को निकाला
  alternative: परमेश्वर ने मुझे भटकने दिया; देवताओं ने मुझे भटकाया
  rationale: इब्रानी में परमेश्वर कारक क्रिया के व्याकरणिक कर्ता हैं। अनुवाद इस दैवी सक्रियता को नरम नहीं करता, पर ‘पथभ्रष्ट किया’ जैसी नैतिक व्यंजना भी नहीं जोड़ता। संदर्भ में אֱלֹהִים का बहुवचन ‘देवता’ अर्थ असंगत है।
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठक के लिए सहज, किंतु कथात्मक गरिमा बनाए रखी गई है। परमेश्वर की कारक भूमिका और इब्रानी क्रिया की संभावित कठोरता को मुख्य पाठ तथा पादटिप्पणी में संतुलित ढंग से सुरक्षित रखा गया है।
