  rationale: यह सामने उपस्थित बात की ओर ध्यान खींचने वाला स्वाभाविक आधुनिक हिन्दी प्रयोग है।
- source_word: אַרְצִי לְפָנֶיךָ
  choice: मेरा देश तुम्हारे सामने है
  rationale: इब्रानी स्थानवाचक मुहावरे को निकटता से रखते हुए उपलब्धता और स्वतंत्र चुनाव का भाव सुरक्षित रहता है।
