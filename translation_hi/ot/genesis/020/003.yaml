source:
  edition: WLC
  text: וַ/יָּבֹ֧א אֱלֹהִ֛ים אֶל אֲבִימֶ֖לֶךְ בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ הִנְּ/ךָ֥ מֵת֙ עַל הָ/אִשָּׁ֣ה אֲשֶׁר לָקַ֔חְתָּ וְ/הִ֖וא בְּעֻ֥לַת בָּֽעַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/003.yaml
  text: But God came to Abimelech in a dream by night and said to him[a], “Behold, you are a dead man because of the woman whom you have taken[c][b], for she is married.”
translation:
  language: hi
  text: तब परमेश्वर रात में स्वप्न में अबीमेलेक के पास आए और उससे कहा, “देख, जिस स्त्री को तूने ले लिया है उसके कारण तू मरा ही समझ,[a] क्योंकि वह विवाहित है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के निकट: “देख, तू मरा हुआ है” या “देख, तू मरेगा।” इब्रानी रचना निश्चित और आसन्न मृत्यु की चेतावनी व्यक्त करती है।'
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी मुहावरे का शाब्दिक भाव: “वह पति वाली है,” अर्थात उसका पहले से पति है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: के पास आकर
  rationale: स्वप्न में हुए दैवी साक्षात्कार के लिए בוא का स्वाभाविक कथात्मक अर्थ व्यक्त करता है और भौतिक प्रवेश का अनावश्यक संकेत नहीं देता।
- source_word: בַּחֲלוֹם הַלָּיְלָה
  choice: रात को ... स्वप्न में
  rationale: रात्रिकालीन स्वप्न का अर्थ स्पष्ट और स्वाभाविक आधुनिक हिन्दी में देता है।
- source_word: הִנְּךָ מֵת
  choice: देख, ... तू मरने पर है
  rationale: הִנֵּה की चेतावनीसूचक शक्ति और מֵת में निहित निश्चित, आसन्न मृत्यु—वर्तमान अवस्था और भावी परिणाम के बीच की अस्पष्टता सहित—को व्यक्त करता है।
- source_word: לָקַחְתָּ
  choice: ले आया है
  rationale: לקח को तटस्थ रूप में रखता है; ऐसा बलपूर्वक हरण इसमें नहीं जोड़ता जो क्रिया स्वयं अनिवार्यतः व्यक्त नहीं करती। परिणामी वर्तमान स्थिति को पूर्ण पक्ष से दिखाता है।
- source_word: בְּעֻלַת בָּעַל
  choice: वह विवाहित है
  rationale: मुहावरे का आशय है कि स्त्री का पहले से पति है। यह हिन्दी में स्वाभाविक है और स्वामित्व की ऐसी धारणा नहीं जोड़ता जिसे लक्ष्य भाषा में शाब्दिक रूप देना भ्रामक हो सकता है।
theological_decisions:
- issue: הִנְּךָ מֵת में मृत्यु की कालगत और विधिक शक्ति
  choice: तू मरने पर है
  alternative: तू मरा हुआ है / तू मरेगा
  rationale: इब्रानी रचना निश्चित और आसन्न मृत्यु-दण्ड की घोषणा करती है, पर उसे केवल वर्तमान तथ्य या साधारण भविष्यकाल में सीमित नहीं करती। चुना हुआ रूप इस तनाव को बनाए रखता है।
- issue: בְּעֻלַת בָּעַל का वैवाहिक अर्थ
  choice: वह विवाहित है
  alternative: उसका पति है / वह पति के अधिकार में है
  rationale: संदर्भ में मूल बात उसका विद्यमान वैवाहिक बंधन है। चुना हुआ पाठ यही स्पष्ट करता है, बिना अतिरिक्त सामाजिक या धर्मसैद्धान्तिक दावे जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन गरिमापूर्ण किंतु सहज है। अबीमेलेक को दैवी प्रत्यक्ष संबोधन में एकवचन ‘तू’ मूल की निकटता और चेतावनी की तीव्रता बनाए रखता है। ‘परन्तु’ प्रसंगगत विरोध को दर्शाता है।
