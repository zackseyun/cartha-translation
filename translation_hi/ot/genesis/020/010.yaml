lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲבִימֶלֶךְ
  choice: अबीमेलेक
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶל־אַבְרָהָם
  choice: अब्राहम से
  rationale: हिन्दी में बोलने के संबोधित व्यक्ति को ‘से’ द्वारा स्वाभाविक रूप से व्यक्त किया जाता है।
- source_word: מָה רָאִיתָ
  choice: तुमने क्या देखा
  rationale: यह हिब्रू के शाब्दिक बिंब ‘क्या देखा’ को बनाए रखता है, जबकि प्रसंग में इसका आशय यह भी हो सकता है कि अब्राहम ने क्या समझा या उसके मन में क्या था।
- source_word: כִּי עָשִׂיתָ
  choice: कि ... किया
  rationale: ‘कि’ प्रश्न और उसके परिणामस्वरूप किए गए काम के बीच हिब्रू संबंध को निकटता और सहजता से व्यक्त करता है।
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: यह काम
  rationale: דָּבָר का अर्थ यहाँ किए गए कार्य या बात से है; ‘यह काम’ आधुनिक हिन्दी में स्वाभाविक है और ‘यह दुष्कर्म’ जैसी अतिरिक्त नैतिक व्याख्या नहीं जोड़ता।
