source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלָ֨י/ו הָֽ/אֱלֹהִ֜ים בַּ/חֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֨עְתִּי֙ כִּ֤י בְ/תָם לְבָבְ/ךָ֙ עָשִׂ֣יתָ זֹּ֔את וָ/אֶחְשֹׂ֧ךְ גַּם אָנֹכִ֛י אֽוֹתְ/ךָ֖ מֵ/חֲטוֹ לִ֑/י עַל כֵּ֥ן לֹא נְתַתִּ֖י/ךָ לִ/נְגֹּ֥עַ אֵלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/006.yaml
  text: Then God said to him in the dream[a], “Yes, I know that you did this in the integrity of your heart, and I also kept you from sinning against me[b]. Therefore I did not let you touch her.”
translation:
  language: hi
  text: तब परमेश्वर ने स्वप्न में उससे कहा[a], “हाँ, मैं जानता हूँ कि तुमने यह अपने मन की खराई से किया। मैंने भी तुम्हें मेरे विरुद्ध पाप करने से रोका; इसीलिए मैंने तुम्हें उसे छूने नहीं दिया[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में इसका अर्थ “उस स्वप्न में” भी हो सकता है; यहाँ लगा निश्चित उपपद प्रसंग में पहले से चल रहे उसी स्वप्न की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “उसे छूना” यौन-संपर्क के लिए प्रयुक्त एक संयत अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלֹם
  choice: स्वप्न में
  rationale: हिब्रू में उपपद निश्चितता का संकेत देता है और प्रसंग में यह उसी चल रहे स्वप्न की ओर इंगित करता है। आधुनिक हिन्दी में ‘स्वप्न में’ स्वाभाविक है; निश्चितता की बारीकी पादटिप्पणी में दी गई है।
- source_word: גַּם אָנֹכִי
  choice: हाँ, मैं / मैंने भी
  rationale: पहली बार यह परमेश्वर की पुष्टि और बलाघात व्यक्त करता है, इसलिए ‘हाँ, मैं’; दूसरी बार इसकी पुनरावृत्ति को स्वाभाविक हिन्दी में ‘मैंने भी’ रखा गया है।
- source_word: בְתָם לְבָבְךָ
  choice: अपने मन की खराई से
  rationale: תֹּם संपूर्णता, निष्कपटता और नैतिक खराई का भाव रखता है। ‘मन की खराई’ नैतिक अर्थ को बनाए रखता है, पर पूर्ण कानूनी निर्दोषता का दावा नहीं जोड़ता।
- source_word: וָאֶחְשֹׂךְ ... אוֹתְךָ
  choice: मैंने ... तुम्हें ... रोके रखा
  rationale: यह क्रिया किसी को पीछे रखने या कोई कार्य करने से रोकने का अर्थ देती है। ‘रोके रखा’ दैवी रोकथाम को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵחֲטוֹא לִי
  choice: अपने विरुद्ध पाप करने से
  rationale: מִן के साथ क्रियारूप किसी कार्य से रोकने को व्यक्त करता है, और לִי यहाँ पाप को परमेश्वर के विरुद्ध किया गया अपराध बताता है।
- source_word: עַל כֵּן
  choice: इसीलिए
  rationale: यह पिछले कथन में वर्णित परमेश्वर की रोकथाम और उसके परिणाम के बीच सीधा संबंध दिखाता है।
- source_word: לֹא נְתַתִּיךָ
  choice: मैंने तुम्हें ... नहीं दिया
  rationale: נָתַן और क्रियार्थक रूप का यह प्रयोग अनुमति देने के अर्थ में है; हिन्दी में ‘नहीं दिया’ इसी मुहावरे को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִנְגֹּעַ אֵלֶיהָ
  choice: उसे छूने
  rationale: शाब्दिक अर्थ ‘छूना’ है, किंतु प्रसंग में यह यौन-संपर्क के लिए संयत अभिव्यक्ति है। हिन्दी में ‘छूना’ मूल की मर्यादित और कुछ हद तक अप्रत्यक्ष भाषा को बनाए रखता है।
theological_decisions:
- issue: ‘मेरे विरुद्ध पाप करने’ का आशय
  choice: संभावित अपराध को परमेश्वर के विरुद्ध पाप के रूप में व्यक्त किया गया है।
  alternative: इसे केवल सारा या अब्राहम के विरुद्ध अपराध, अथवा सामान्य रूप से परमेश्वर को अप्रसन्न करना समझना।
  rationale: हिब्रू לִי परमेश्वर को वह व्यक्ति बताता है जिसके विरुद्ध यह पाप होता। अनुवाद इस स्पष्ट धर्मवैचारिक आयाम को रखता है, पर इससे आगे कोई व्यवस्थित धर्मसिद्धांत नहीं जोड़ता।
- issue: अबीमेलेक के न पाप करने में दैवी रोकथाम और उसके मन की खराई का संबंध
  choice: 'दोनों कथनों को साथ रखा गया है: उसने मन की खराई से काम किया, और परमेश्वर ने उसे पाप करने से रोका।'
  alternative: उसकी खराई को पूर्ण निर्दोषता मानना, या दैवी रोकथाम के कारण उसकी नैतिक दशा को अप्रासंगिक मानना।
  rationale: मूल पाठ मानवीय अभिप्राय और दैवी रोकथाम दोनों की पुष्टि करता है। अनुवाद इस तनाव को बिना सुलझाए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मन की खराई’, ‘पाप करने से रोके रखा’ और ‘उसे छूने’ जैसे पद मूल की नैतिक गंभीरता, दैवी सक्रियता और संयत अभिव्यक्ति को बनाए रखते हैं।
