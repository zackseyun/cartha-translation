base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/008.yaml
  text: So Abimelech rose early in the morning and called all his servants and spoke all these things in their hearing[b][a], and the men were very afraid.
translation:
  language: hi
  text: अबीमेलेक सुबह तड़के उठा और उसने अपने सभी सेवकों को बुलाया[a] और उनके सामने ये सारी बातें कहीं। तब वे पुरुष बहुत डर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सभी सेवकों को एकत्र किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: भोर को उठा
  rationale: हिफ़िल रूप का अर्थ तड़के उठना है। ‘भोर को उठा’ इब्रानी काल-सूचक मुहावरे और प्रसंग की तत्परता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּקְרָא לְכָל עֲבָדָיו
  choice: अपने सभी सेवकों को बुलाया
  rationale: עֶבֶד का अर्थ सेवक या दास हो सकता है; यहाँ राजकीय गृहस्थी के सेवकों/अधिकारियों का संदर्भ है और बंधुआ स्थिति पर बल नहीं है। קרא के लिए ‘बुलाया’ सीधा और स्वाभाविक है।
- source_word: וַיְדַבֵּר אֶת כָּל הַדְּבָרִים הָאֵלֶּה בְּאָזְנֵיהֶם
  choice: ये सारी बातें उन्हें सुनाईं
  rationale: शाब्दिक ‘उनके कानों में’ का आशय उनकी सुनवाई में कहना है। ‘उन्हें सुनाईं’ पूरे पदबंध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיִּירְאוּ הָאֲנָשִׁים מְאֹד
  choice: तब वे लोग बहुत डर गए
  rationale: यहाँ ירא श्रद्धा नहीं, भय बताता है और מְאֹד उसकी तीव्रता बढ़ाता है। הָאֲנָשִׁים पूर्वोक्त सेवकों को संदर्भित करता है; हिन्दी में ‘वे लोग’ इस संदर्भ को स्पष्ट और स्वाभाविक रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भोर को’ तात्कालिकता दर्शाता है; ‘उन्हें सुनाईं’ इब्रानी मुहावरे ‘उनके कानों में कहा’ का स्वाभाविक हिन्दी रूप है।
