source:
  edition: WLC
  text: וּ/לְ/שָׂרָ֣ה אָמַ֗ר הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֨סֶף֙ לְ/אָחִ֔י/ךְ הִנֵּ֤ה הוּא לָ/ךְ֙ כְּס֣וּת עֵינַ֔יִם לְ/כֹ֖ל אֲשֶׁ֣ר אִתָּ֑/ךְ וְ/אֵ֥ת כֹּ֖ל וְ/נֹכָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/016.yaml
  text: And to Sarah he said[a], “Look, I have given a thousand pieces of silver to your brother. Look, it is for you a covering of the eyes to all who are with you[b], and before everyone you are vindicated.”
translation:
  language: hi
  text: और सारा से उसने कहा, “देख, मैंने तेरे भाई को चाँदी के एक हज़ार टुकड़े दिए हैं। देख, यह तेरे लिए, और तेरे साथ रहने वाले सभी लोगों के लिए, आँखों की ओट है[a]; और सबके सामने तू निर्दोष ठहराई गई है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आँखों के लिए ओट।” यह कठिन मुहावरा संभवतः ऐसी सार्वजनिक क्षतिपूर्ति को दर्शाता है जो हुए अपमान को ढकती और सारा का सम्मान पुनः स्थापित करती है।
    reason: lexical_alternative
  - marker: b
    text: या “तू दोषमुक्त की गई है,” अथवा “सबके सामने मामला निपट गया है।” अंतिम इब्रानी खंड कठिन है; इसका अर्थ “तुझे उलाहना दिया गया है” भी समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֶלֶף כֶּסֶף
  choice: चाँदी के एक हज़ार टुकड़े
  rationale: इब्रानी में शाब्दिक रूप से ‘एक हज़ार चाँदी’ है; माप या सिक्के का प्रकार स्पष्ट न होने के कारण ‘टुकड़े’ अनावश्यक विशिष्टता से बचता है।
- source_word: לְאָחִיךְ
  choice: तेरे भाई को
  rationale: ‘भाई’ कथानक में सारा द्वारा अब्राहम के विषय में किए गए दावे को याद दिलाता है और मूल की विडंबना बनाए रखता है।
- source_word: כְּסוּת עֵינַיִם
  choice: आँखों का परदा
  rationale: यह कठिन मुहावरा है। मुख्य पाठ में रूपक बनाए रखा गया है; संदर्भ में यह सार्वजनिक क्षतिपूर्ति द्वारा अपमान को ढकने और सारा का सम्मान पुनः स्थापित करने की ओर संकेत कर सकता है।
- source_word: לְכֹל אֲשֶׁר אִתָּךְ
  choice: उन सबकी ... जो तेरे साथ हैं
  rationale: यह भुगतान के सार्वजनिक प्रभाव को सारा के साथ रहने वालों तक पहुँचाता है और לְ के सामान्य संबंध को बनाए रखता है।
- source_word: וְאֵת כֹּל
  choice: और सबके सामने
  rationale: संक्षिप्त और कठिन वाक्यांश को अगले क्रियारूप के साथ जोड़कर सार्वजनिक दायरे के रूप में व्यक्त किया गया है।
- source_word: וְנֹכָחַת
  choice: तू निर्दोष ठहराई गई है
  rationale: נכח/יכח के निफ़अल रूप को यहाँ सार्वजनिक रूप से सही या दोषमुक्त सिद्ध होने के अर्थ में लिया गया है; संदर्भ में अबीमेलेक सारा की प्रतिष्ठा बहाल कर रहा है।
theological_decisions:
- issue: अंतिम इब्रानी खंड וְאֵת כֹּל וְנֹכָחַת का अर्थ
  choice: और सबके सामने तू निर्दोष ठहराई गई है
  alternative: और सबके सामने तुझे उलाहना दिया गया है; अथवा, सबके सामने मामला निपटा दिया गया है
  rationale: व्याकरण और शब्दार्थ कई अर्थों की अनुमति देते हैं। प्रसंग में सार्वजनिक क्षतिपूर्ति और सारा के सम्मान की बहाली ‘निर्दोष ठहराई गई’ का समर्थन करती है, पर कठिनाई को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। कथात्मक निकटता तथा एकवचन स्त्रीलिंग संबोधन बनाए रखने के लिए ‘तेरे/तू’ रखा गया है। कठिन इब्रानी रूपक और अंतिम खंड की वास्तविक अस्पष्टता मुख्य पाठ तथा पादटिप्पणियों में सुरक्षित रखी गई है।
