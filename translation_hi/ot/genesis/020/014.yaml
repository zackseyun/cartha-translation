base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/014.yaml
  text: Then Abimelech took sheep and cattle[a], and male servants and female servants, and gave them to Abraham[c][b]; and he returned Sarah his wife to him.
translation:
  language: hi
  text: तब अबीमेलेक ने भेड़-बकरियाँ[a], गाय-बैल, दास और दासियाँ[b] लेकर अब्राहम को दे दिए; और अब्राहम की पत्नी सारा को अब्राहम के पास लौटा दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द छोटे पालतू पशुओं के समूह, विशेषकर भेड़ों और बकरियों, के लिए प्रयुक्त हो सकता है; इसका अनुवाद ‘झुंड’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में पुरुष और स्त्री दासों के अलग-अलग शब्द हैं। कुछ अनुवाद यहाँ ‘सेवक और सेविकाएँ’ कहते हैं, पर पशुओं के साथ दिए जाने का प्रसंग उनकी दासता को प्रमुख बनाता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘अब्राहम की पत्नी सारा को अब्राहम के पास फिर से पहुँचा दिया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लेकर
  rationale: לקח का मूल अर्थ ‘लेना’ है। संयुक्त क्रिया-विन्यास ‘लेकर ... दे दिए’ इब्रानी कथा-क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: यह सामूहिक संज्ञा छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, को सूचित कर सकती है; इसलिए केवल ‘भेड़ें’ की अपेक्षा ‘भेड़-बकरियाँ’ अधिक व्यापक और स्रोत-संगत है।
- source_word: בָקָר
  choice: गाय-बैल
  rationale: यह गोवंशीय पालतू पशुओं के लिए सामूहिक शब्द है। ‘गाय-बैल’ साधारण हिन्दी में उसके व्यापक अर्थ को स्पष्ट करता है।
- source_word: עֲבָדִים
  choice: दास
  rationale: स्थानांतरण की इस प्रसंगगत स्थिति में शब्द अधीन और स्वामित्वाधीन पुरुषों को सूचित करता है; ‘दास’ सामाजिक वास्तविकता को ‘सेवक’ की तुलना में अधिक स्पष्ट रखता है।
- source_word: שְׁפָחוֹת
  choice: दासियाँ
  rationale: यह स्त्री घरेलू दासों या अधीन सेविकाओं के लिए प्रयुक्त शब्द है। ‘दासियाँ’ निकटवर्ती पुरुषवाची ‘दास’ के साथ स्रोत का लिंग-भेद बनाए रखता है।
- source_word: וַיִּתֵּן
  choice: दे दिए
  rationale: क्रिया का सीधा अर्थ ‘देना’ है। हिन्दी में बहुविध पूर्वोक्त वस्तुओं और व्यक्तियों के लिए ‘दे दिए’ स्वाभाविक है।
- source_word: וַיָּשֶׁב
  choice: लौटा दिया
  rationale: שוב के हिफ़ील रूप का अर्थ ‘लौटा देना’ या ‘फिर से पहुँचा देना’ है; यह अनावश्यक व्याख्या जोड़े बिना कारक भाव व्यक्त करता है।
- source_word: אִשְׁתּוֹ
  choice: अब्राहम की पत्नी
  rationale: प्रत्यय का संबंध अब्राहम से है। हिन्दी में नाम दोहराने से संभावित सर्वनाम-संदेह दूर होता है और आशय स्पष्ट रहता है।
- source_word: לּוֹ
  choice: उसके पास
  rationale: प्रत्यय अब्राहम की ओर संकेत करता है। ‘उसके पास’ इब्रानी संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
