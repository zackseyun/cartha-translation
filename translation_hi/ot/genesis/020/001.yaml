  text: From there Abraham journeyed toward the Negev and settled between Kadesh and Shur[a]; he sojourned in Gerar.
translation:
  language: hi
  text: वहाँ से अब्राहम ने नेगेव[a] की ओर यात्रा की और कादेश और शूर के बीच निवास किया; वह गरार में परदेशी के रूप में रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दक्षिण की ओर।” इब्रानी शब्द किसी विशेष दक्षिणी भूभाग—नेगेव—अथवा सामान्य रूप से दक्षिण दिशा, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע מִשָּׁם
  choice: वहाँ से ... यात्रा की
  rationale: क्रिया נסע स्थान छोड़कर आगे यात्रा करने का बोध देती है; यह रूप कथा की गति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אַרְצָה הַנֶּגֶב
  choice: नेगेव की ओर
  rationale: אַרְצָה पर दिशासूचक प्रत्यय गति की दिशा बताता है, और הַנֶּגֶב यहाँ संभवतः नेगेव नामक दक्षिणी भूभाग को सूचित करता है।
- source_word: וַיֵּשֶׁב
  choice: बस गया
  rationale: ישב यहाँ किसी क्षेत्र में निवास स्थापित करने का अर्थ देता है; 'बस गया' सहज हिन्दी है और अगले खंड में आए अस्थायी/परदेशी निवास से उचित भेद रखता है।
- source_word: בֵּין קָדֵשׁ וּבֵין שׁוּר
  choice: कादेश और शूर के बीच
  rationale: यह दो स्थानों के बीच के क्षेत्र को बताने वाला सीधा भौगोलिक संकेत है; स्थान-नामों का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: וַיָּגָר
  choice: परदेशी के रूप में रहने लगा
  rationale: גור केवल रहने नहीं, बल्कि अपने स्थायी देश से बाहर परदेशी अथवा अस्थायी निवासी के रूप में रहने का भाव रखता है; यह अनुवाद उस अर्थ को सामान्य हिन्दी में स्पष्ट करता है।
- source_word: בִּגְרָר
  choice: गरार में
  rationale: स्थानवाचक בְּ के साथ आए नगर-नाम का स्वाभाविक हिन्दी रूप।
