  yaml_path: translation/ot/genesis/020/017.yaml
  text: Then Abraham prayed to God[a], and God healed Abimelech, his wife, and his female servants[b], and they gave birth.
translation:
  language: hi
  text: तब अब्राहम ने परमेश्वर से प्रार्थना की। परमेश्वर ने अबीमेलेक, उसकी पत्नी और उसकी सेविकाओं[a] को चंगा किया, और उसकी पत्नी और सेविकाओं ने बच्चों को जन्म दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दासियों’; इब्रानी शब्द स्त्री दासियों को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: प्रार्थना की
  rationale: פלל के हित्पएल रूप का सामान्य अर्थ ‘प्रार्थना करना’ है। प्रसंग में मध्यस्थता निहित है, पर क्रिया स्वयं उसे स्पष्ट रूप से व्यक्त नहीं करती।
- source_word: אֶל הָאֱלֹהִים / אֱלֹהִים
  choice: परमेश्वर से / परमेश्वर ने
  rationale: यहाँ אֱלֹהִים एक सच्चे परमेश्वर को सूचित करता है। ‘परमेश्वर’ आधुनिक हिन्दी में स्वाभाविक और प्रतिष्ठित बाइबलीय संबोधन है।
- source_word: וַיִּרְפָּא
  choice: चंगा किया
  rationale: רפא का सीधा अर्थ ‘चंगा करना’ है; यह रोग या बाधा का स्वरूप अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֶת אֲבִימֶלֶךְ
  choice: अबीमेलेक
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אִשְׁתּוֹ
  choice: उसकी पत्नी
  rationale: अबीमेलेक की पत्नी को सूचित करने वाला सीधा संबंधसूचक पदबंध।
- source_word: אַמְהֹתָיו
  choice: उसकी सेविकाओं
  rationale: אָמָה स्त्री सेविका अथवा दासी को सूचित कर सकता है। ‘सेविकाओं’ सहज आधुनिक हिन्दी है; दासता की संभावित सामाजिक स्थिति पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וַיֵּלֵדוּ
  choice: और उन्होंने बच्चों को जन्म दिया
  rationale: ילד का अर्थ ‘जन्म देना’ है। हिन्दी में ‘बच्चों को’ जोड़ना क्रिया को स्वाभाविक बनाता है, जबकि ‘और’ इब्रानी कथात्मक संयोजक की अस्पष्टता बनाए रखता है और फल-संबंध को मुख्य पाठ में स्पष्ट रूप से नहीं जोड़ता।
theological_decisions:
- issue: अंतिम क्रिया का चंगाई से संबंध
  choice: ‘और उन्होंने बच्चों को जन्म दिया’
  alternative: ‘जिससे वे बच्चों को जन्म दे सकीं’
  rationale: प्रसंग इसे परमेश्वर की चंगाई का परिणाम बताता है, किंतु इब्रानी पाठ केवल संयोजक वाव का प्रयोग करता है। ‘और’ क्रम तथा संभावित परिणाम—दोनों के बीच की मूल अस्पष्टता को बनाए रखता है।
- issue: אָמָה की सामाजिक स्थिति
  choice: मुख्य पाठ में ‘सेविकाओं’
  alternative: ‘दासियों’ या ‘दास स्त्रियों’
  rationale: मूल शब्द सेवा और दासता दोनों का बोध करा सकता है। मुख्य पाठ में सहज शब्द रखा गया है और अधिक कठोर सामाजिक अर्थ पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो वाक्यों का प्रयोग हिन्दी में लंबे संयुक्त वाक्य की तुलना में अधिक स्पष्ट है। स्त्रियों को अंतिम बहुवचन क्रिया का कर्ता स्वाभाविक रूप से समझा जाता है।
