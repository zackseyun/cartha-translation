  text: And Pharaoh said to Jacob[b][a], “How many are the days of the years of your life?”
translation:
  language: hi
  text: तब फ़िरौन ने याकूब से कहा, “तुम्हारे जीवन के वर्षों के दिन कितने हैं?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह उम्र पूछने का औपचारिक इब्रानी ढंग है; अधिक सहज हिन्दी में: “तुम्हारी उम्र कितनी है?”'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... पूछा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है। प्रत्यक्ष वचन प्रश्न होने के कारण हिन्दी में ‘पूछा’ स्वाभाविक है और कथन की क्रिया को प्रसंगानुसार व्यक्त करता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का हिन्दी बाइबलीय प्रयोग में प्रचलित रूप।
- source_word: אֶל יַעֲקֹב
  choice: याकूब से
  rationale: אֶל संबोधित व्यक्ति को चिह्नित करता है; हिन्दी में ‘पूछा’ के साथ ‘से’ स्वाभाविक कारक है।
- source_word: כַּמָּה
  choice: कितने
  rationale: गिने जाने वाले दिनों के विषय में परिमाणसूचक प्रश्न को व्यक्त करता है।
- source_word: יְמֵי שְׁנֵי חַיֶּיךָ
  choice: तुम्हारे जीवन के वर्षों के दिन
  rationale: मूल के स्तरित इब्रानी मुहावरे—‘दिन’, ‘वर्ष’ और ‘जीवन’—को यथासंभव बनाए रखा गया है; इसे केवल ‘तुम्हारी उम्र कितनी है?’ बनाकर स्रोत की औपचारिक अभिव्यक्ति को मिटाया नहीं गया।
