id: GEN.47.13
reference: Genesis 47:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֶ֤חֶם אֵין֙ בְּ/כָל הָ/אָ֔רֶץ כִּֽי כָבֵ֥ד הָ/רָעָ֖ב מְאֹ֑ד וַ/תֵּ֜לַהּ אֶ֤רֶץ מִצְרַ֨יִם֙ וְ/אֶ֣רֶץ כְּנַ֔עַן מִ/פְּנֵ֖י הָ/רָעָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/013.yaml
  text: There was no food in all the land[a], because the famine was very severe[b]; and the land of Egypt and the land of Canaan languished because of the famine.
translation:
  language: hi
  text: पूरे देश में भोजन[a] नहीं था, क्योंकि अकाल बहुत भयंकर था; और मिस्र देश तथा कनान देश अकाल के कारण निढाल हो गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘रोटी’; यहाँ सम्भवतः सामान्य रूप से भोजन के अर्थ में।
    reason: lexical_alternative
  - marker: b
    text: या ‘मुरझा गए’ अथवा ‘शक्तिहीन हो गए’। इब्रानी क्रिया अकाल के दुर्बल कर देने वाले प्रभाव को रूपक के रूप में व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: भोजन
  rationale: इसका शाब्दिक अर्थ ‘रोटी’ है, पर अकाल के प्रसंग में यह व्यापक रूप से खाने-पीने की सामग्री को दर्शाता है; इसलिए ‘भोजन’ स्वाभाविक और संदर्भानुकूल है।
- source_word: אֵין
  choice: नहीं था
  rationale: भूतकालीन कथानक में अस्तित्व के अभाव को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּכָל הָאָרֶץ
  choice: पूरे देश में
  rationale: संदर्भ में הָאָרֶץ अकाल से प्रभावित भूभाग को दर्शाता है, न कि अनिवार्य रूप से समूची पृथ्वी को।
- source_word: כָבֵד ... מְאֹד
  choice: बहुत भयंकर
  rationale: ‘भारी’ के शाब्दिक भाव को अकाल की तीव्रता के लिए स्वाभाविक हिन्दी में व्यक्त करता है और מְאֹד की प्रबलता बनाए रखता है।
- source_word: הָרָעָב
  choice: अकाल
  rationale: यूसुफ की कथा में खाद्य-संकट के लिए मानक और सटीक हिन्दी शब्द।
- source_word: וַתֵּלַהּ
  choice: निढाल हो गए
  rationale: क्रिया अकाल के कारण शक्तिहीन, शिथिल या चुक जाने का रूपकात्मक भाव देती है; ‘निढाल हो गए’ भूमि और उसके निवासियों की दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶרֶץ מִצְרַיִם וְאֶרֶץ כְּנַעַן
  choice: मिस्र देश तथा कनान देश
  rationale: दोनों स्थानों के साथ ‘देश’ रखकर इब्रानी की भौगोलिक अभिव्यक्ति को सुरक्षित रखा गया है।
- source_word: מִפְּנֵי הָרָעָב
  choice: अकाल के कारण
  rationale: कारण बताने वाले इब्रानी पदबंध का स्पष्ट और सहज हिन्दी अनुवाद।
