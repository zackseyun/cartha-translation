translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण पर सहज शैली रखी गई है। फ़िरौन यूसुफ को एकवचन आत्मीय/सामान्य संबोधन ‘तुम’ से संबोधित करता है। ‘गोशेन प्रदेश’ मूल के भौगोलिक पद को स्पष्ट रखता है। सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद दिए गए हैं; अंग्रेज़ी परामर्श-पाठ में चिह्नों और पादटिप्पणियों का क्रम असंगत था, इसलिए मूल विषयवस्तु के अनुसार उन्हें सही स्थान पर लगाया गया है।
