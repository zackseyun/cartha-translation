  edition: WLC
  text: אֶ֤רֶץ מִצְרַ֨יִם֙ לְ/פָנֶ֣י/ךָ הִ֔וא בְּ/מֵיטַ֣ב הָ/אָ֔רֶץ הוֹשֵׁ֥ב אֶת אָבִ֖י/ךָ וְ/אֶת אַחֶ֑י/ךָ יֵשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן וְ/אִם יָדַ֗עְתָּ וְ/יֶשׁ בָּ/ם֙ אַנְשֵׁי חַ֔יִל וְ/שַׂמְתָּ֛/ם שָׂרֵ֥י מִקְנֶ֖ה עַל אֲשֶׁר לִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/006.yaml
  text: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
translation:
  language: hi
  text: “मिस्र देश तुम्हारे सामने है[a]। अपने पिता और भाइयों को देश के सबसे अच्छे भाग में बसाओ; वे गोशेन प्रदेश में रहें। और यदि तुम जानते हो कि उनमें योग्य पुरुष हैं[b], तो उन्हें मेरे पशुधन के निरीक्षक नियुक्त कर दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तुम्हारे सामने है” एक इब्रानी मुहावरा है, जिसका यहाँ अर्थ है कि मिस्र में स्थान चुनने की स्वतंत्रता तुम्हें है।
    reason: cultural_note
  - marker: b
    text: या “सक्षम पुरुष,” “कुशल पुरुष”; अधिक शाब्दिक रूप से “सामर्थ्यवान पुरुष।” यहाँ इस पद का अर्थ अनिवार्यतः युद्ध में वीर पुरुष नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ מִצְרַיִם לְפָנֶיךָ הִוא
  choice: मिस्र देश तुम्हारे सामने है
  rationale: इब्रानी मुहावरे की मूल छवि को बनाए रखता है; प्रसंग में इसका आशय है कि मिस्र में स्थान चुनने की स्वतंत्रता उपलब्ध है।
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: देश के सबसे अच्छे भाग में
  rationale: מֵיטַב देश के उत्तम या चुनिंदा हिस्से को दर्शाता है; ‘भाग’ जोड़ने से आधुनिक हिन्दी में आशय स्पष्ट और स्वाभाविक होता है।
- source_word: הוֹשֵׁב
  choice: बसाओ
  rationale: ישׁב का हिफ़ील आज्ञार्थक रूप कारणवाचक है—यूसुफ को अपने परिवार को वहाँ बसाना है।
- source_word: יֵשְׁבוּ
  choice: वे ... रहें
  rationale: यहाँ काल रूप स्थायी निवास का बोध देता है; ‘रहें’ सहज आधुनिक हिन्दी है।
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: गोशेन प्रदेश में
  rationale: मूल में ‘देश/भूमि’ स्पष्ट है; हिन्दी में ‘प्रदेश’ भौगोलिक क्षेत्र का स्वाभाविक बोध देता है।
- source_word: וְאִם יָדַעְתָּ
  choice: और यदि तुम जानते हो
  rationale: मूल की शर्त और यूसुफ के व्यक्तिगत ज्ञान, दोनों को सीधे बनाए रखता है।
- source_word: אַנְשֵׁי חַיִל
  choice: योग्य पुरुष
  rationale: इस पशुपालन और प्रशासनिक प्रसंग में पद सामर्थ्य, दक्षता या योग्यता का संकेत देता है, अनिवार्यतः सैनिक वीरता का नहीं।
- source_word: וְשַׂמְתָּם
  choice: उन्हें ... नियुक्त कर दो
  rationale: कार्यालय या उत्तरदायित्व सौंपने के प्रसंग में שׂים का कार्यगत अर्थ ‘नियुक्त करना’ है।
- source_word: שָׂרֵי מִקְנֶה
  choice: पशुधन के अधिकारी
  rationale: שָׂרֵי निरीक्षण या नेतृत्व की जिम्मेदारी रखने वालों और מִקְנֶה पालतू पशुओं के समूह को दर्शाता है।
- source_word: עַל אֲשֶׁר לִי
  choice: मेरे पशुधन के
  rationale: शाब्दिक ‘जो मेरा है’ का संदर्भ प्रसंग में फ़िरौन के पशुधन से है; संक्षिप्त हिन्दी में संबंध स्पष्ट किया गया है।
