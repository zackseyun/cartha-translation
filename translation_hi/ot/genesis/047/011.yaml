language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יּוֹשֵׁ֣ב יוֹסֵף֮ אֶת אָבִ֣י/ו וְ/אֶת אֶחָי/ו֒ וַ/יִּתֵּ֨ן לָ/הֶ֤ם אֲחֻזָּה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/מֵיטַ֥ב הָ/אָ֖רֶץ בְּ/אֶ֣רֶץ רַעְמְסֵ֑ס כַּ/אֲשֶׁ֖ר צִוָּ֥ה פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/011.yaml
  text: So Joseph settled his father and his brothers[a], and gave them a possession in the land of Egypt, in the best part of the land, in the land of Rameses, just as Pharaoh had commanded.
translation:
  language: hi
  text: तब यूसुफ ने अपने पिता और भाइयों को बसाया और उन्हें मिस्र देश के सबसे उत्तम[a] भाग में, रामसेस के क्षेत्र में, एक भू-संपत्ति दी, जैसा फ़िरौन ने आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सबसे चुनिंदा।”
    reason: מֵיטַב में ‘सर्वोत्तम’ के साथ ‘चुनिंदा’ अथवा ‘उत्कृष्ट’ भाग का भाव भी संभव है।
lexical_decisions:
- source_word: וַיּוֹשֵׁב
  choice: बसाया
  rationale: हिफ़ील रूप का कारणवाचक अर्थ है कि यूसुफ ने उन्हें वहाँ रहने के लिए स्थापित किया; ‘बसाया’ इसे स्वाभाविक और संक्षिप्त हिंदी में व्यक्त करता है।
- source_word: אָבִיו וְאֶת־אֶחָיו
  choice: अपने पिता और भाइयों को
  rationale: इब्रानी पाठ में दोनों संबंध स्पष्ट रूप से दिए गए हैं; इसलिए व्यापक ‘परिवार’ के बजाय इन्हीं संबंध-सूचक शब्दों को रखा गया है।
- source_word: וַיִּתֵּן לָהֶם אֲחֻזָּה
  choice: उन्हें ... एक भू-संपत्ति दी
  rationale: אֲחֻזָּה अधिकार में दी गई भूमि अथवा भू-धारण को दर्शाता है। ‘भू-संपत्ति’ भूमि-संबंधी ठोस अर्थ रखता है और ‘विरासत’ के अनावश्यक वाचा-संबंधी संकेत से बचता है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश के
  rationale: ‘देश’ मूल के אֶרֶץ को व्यक्त करता है; हिंदी वाक्य-विन्यास में इसे आगे आने वाले ‘भाग’ से जोड़ा गया है।
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: सबसे उत्तम भाग में
  rationale: מֵיטַב देश के सर्वोत्तम अथवा सबसे चुनिंदा हिस्से को दर्शाता है; यह हिंदी में स्वाभाविक और अर्थ की दृष्टि से निकट है।
- source_word: בְּאֶרֶץ רַעְמְסֵס
  choice: रामसेस के क्षेत्र में
  rationale: यहाँ אֶרֶץ नगर से संबद्ध भू-क्षेत्र अथवा प्रदेश को सूचित कर सकता है; ‘क्षेत्र’ हिंदी में स्थान-संबंध स्पष्ट करता है और अनावश्यक पुनरुक्ति से बचाता है।
- source_word: כַּאֲשֶׁר צִוָּה פַרְעֹה
  choice: जैसा फ़िरौन ने आज्ञा दी थी
  rationale: यह वाक्यांश बताता है कि यूसुफ की कार्रवाई फ़िरौन की पहले दी हुई आज्ञा के अनुरूप थी।
