  yaml_path: translation/ot/genesis/047/005.yaml
  text: Then Pharaoh said to Joseph[a], “Your father and your brothers have come to you.”
translation:
  language: hi
  text: तब फ़िरौन ने यूसुफ़ से कहा, “तुम्हारे पिता और तुम्हारे भाई तुम्हारे पास आ गए हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के राजा की उपाधि के लिए प्रचलित हिन्दी रूप।
- source_word: אֶל יוֹסֵף
  choice: यूसुफ़ से
  rationale: भाषण के संबोधित व्यक्ति को हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: अलग से अनूदित नहीं
  rationale: कहने की क्रिया के बाद यह इब्रानी में प्रत्यक्ष कथन का परिचय देता है; ‘कहा’ के साथ हिन्दी में इसे दोहराना अनावश्यक और अस्वाभाविक होगा।
- source_word: אָבִיךָ
  choice: तुम्हारे पिता
  rationale: यूसुफ़ को संबोधित द्वितीय पुरुष संबंधसूचक रूप का सीधा अनुवाद।
- source_word: וְאַחֶיךָ
  choice: और तुम्हारे भाई
  rationale: मूल शब्द स्पष्ट रूप से ‘भाइयों’ को दर्शाता है; इसे व्यापक ‘परिवार’ नहीं किया गया।
- source_word: בָּאוּ
  choice: आ गए हैं
  rationale: पूर्ण हो चुकी ऐसी गति को दर्शाता है जिसका वर्तमान संवाद में तत्काल प्रभाव है; हिन्दी का पूर्ण वर्तमान रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֵלֶיךָ
  choice: तुम्हारे पास
  rationale: यूसुफ़ की ओर आने की दिशा को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है; ‘यहाँ’ जोड़ना मूल से अधिक कहना होता।
