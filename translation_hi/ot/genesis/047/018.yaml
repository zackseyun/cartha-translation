  to: जब वह वर्ष समाप्त हो गया, तब वे दूसरे वर्ष उसके पास आए और उससे कहा, “हम अपने स्वामी से यह बात नहीं छिपाएँगे कि पैसा चुक गया है[a] और पशुधन मेरे स्वामी का हो गया है। मेरे स्वामी के सामने हमारे शरीर और हमारी भूमि के सिवा कुछ नहीं बचा है[b]।”
