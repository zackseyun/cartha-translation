    text: या ‘चाँदी समाप्त हो गई है।’ हिब्रू में ‘चाँदी’ शब्द प्रायः पैसे के अर्थ में प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हम स्वयं।’ हिब्रू में शाब्दिक रूप से ‘हमारे शरीर’ है।
    reason: lexical_alternative
  revision_rationale: The revision preserves the Hebrew singular deferential address, makes the livestock clause explicitly possessive to reflect its transfer to the lord, and improves idiomatic Hindi in the final exception clause. The lexical-alternative footnotes remain correctly anchored to the money and bodies expressions.
