  text: וַ/תִּתֹּם֮ הַ/שָּׁנָ֣ה הַ/הִוא֒ וַ/יָּבֹ֨אוּ אֵלָ֜י/ו בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹֽא נְכַחֵ֣ד מֵֽ/אֲדֹנִ֔/י כִּ֚י אִם תַּ֣ם הַ/כֶּ֔סֶף וּ/מִקְנֵ֥ה הַ/בְּהֵמָ֖ה אֶל אֲדֹנִ֑/י לֹ֤א נִשְׁאַר֙ לִ/פְנֵ֣י אֲדֹנִ֔/י בִּלְתִּ֥י אִם גְּוִיָּתֵ֖/נוּ וְ/אַדְמָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/018.yaml
  text: 'When that year ended[a], they came to him in the second year and said to him, “We will not hide it from my lord: the money is gone, and the livestock of the herds belongs to my lord[b]. Nothing is left before my lord except our bodies and our land.”'
translation:
  language: hi
  text: जब वह वर्ष समाप्त हो गया, तब वे दूसरे वर्ष उसके पास आए और उससे कहा, “हम अपने स्वामी से यह बात नहीं छिपाएँगे कि पैसा चुक गया है[a] और पशुधन मेरे स्वामी का हो गया है। मेरे स्वामी के सामने हमारे शरीर और हमारी भूमि के सिवा कुछ नहीं बचा है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चाँदी समाप्त हो गई है।’ हिब्रू में ‘चाँदी’ शब्द प्रायः पैसे के अर्थ में प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हम स्वयं।’ हिब्रू में शाब्दिक रूप से ‘हमारे शरीर’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֹּם הַשָּׁנָה הַהִוא
  choice: जब वह वर्ष समाप्त हो गया
  rationale: תמם का अर्थ पूरा होना या समाप्त हो जाना है; यह अनुवाद समय-सूचक उपवाक्य को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: दूसरे वर्ष
  rationale: हिब्रू में स्पष्ट रूप से ‘दूसरे वर्ष’ है। संदर्भ में यह अगला वर्ष है, पर अनुवाद मूल की गणना को नहीं बदलता।
- source_word: לֹא נְכַחֵד מֵאֲדֹנִי
  choice: हम अपने स्वामी से यह बात नहीं छिपाएँगे
  rationale: כחד का पिएल रूप छिपाने या गुप्त रखने को व्यक्त करता है। ‘अपने स्वामी’ समूह के कथन में स्वाभाविक है और אֲדֹנִי के आदरसूचक एकवचन भाव को बनाए रखता है।
- source_word: תַּם הַכֶּסֶף
  choice: पैसा चुक गया है
  rationale: כֶּסֶף का मूल अर्थ चाँदी है, पर यहाँ वह भुगतान के साधन अर्थात पैसे के अर्थ में है; תם उसके पूरी तरह खर्च हो जाने को बताता है।
- source_word: וּמִקְנֵה הַבְּהֵמָה אֶל אֲדֹנִי
  choice: पशुधन भी हमारे स्वामी के पास आ चुका है
  rationale: מִקְנֵה הַבְּהֵמָה पशुओं के रूप में संपत्ति या पशुधन को दर्शाता है। אֶל אֲדֹנִי यहाँ स्वामी को उसका हस्तांतरण सूचित करता है; ‘पास आ चुका है’ उस अर्थ को बिना अनावश्यक विस्तार के रखता है।
- source_word: לֹא נִשְׁאַר לִפְנֵי אֲדֹנִי
  choice: अब हमारे स्वामी के सामने ... कुछ नहीं बचा है
  rationale: निषאר का अर्थ बचा या शेष रहना है और לִפְנֵי का शाब्दिक ‘सामने’ मूल हिब्रू बिंब को सुरक्षित रखता है।
- source_word: בִּלְתִּי אִם
  choice: के सिवा
  rationale: यह पदबंध यहाँ अपवाद व्यक्त करता है; आधुनिक हिन्दी में ‘के सिवा’ सटीक और स्वाभाविक है।
- source_word: גְּוִיָּתֵנוּ
  choice: हमारे शरीरों
  rationale: גְּוִיָּה शरीर या देह को सूचित करता है। यहाँ जीवित लोगों के अपने आपको सौंपने की संभावना है, इसलिए ‘शरीरों’ मूल की ठोस अभिव्यक्ति को बनाए रखता है।
