  yaml_path: translation/ot/genesis/047/003.yaml
  text: And Pharaoh said to his brothers[a], “What is your occupation?” And they said to Pharaoh, “Your servants are shepherds of flocks[b], both we and our fathers.”
translation:
  language: hi
  text: तब फ़िरौन ने उसके भाइयों से पूछा, “तुम्हारा काम-धंधा क्या है?” उन्होंने फ़िरौन से कहा, “आपके सेवक भेड़-बकरियों के चरवाहे हैं[a]—हम भी और हमारे पुरखे भी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में “झुंड के चरवाहे”; यहाँ झुंड से आशय विशेष रूप से भेड़-बकरियों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: तुम्हारा काम-धंधा क्या है?
  rationale: מַעֲשֶׂה यहाँ पेशे या आजीविका के काम को सूचित करता है। ‘काम-धंधा’ आधुनिक, सहज हिन्दी में व्यावसायिक अर्थ स्पष्ट करता है।
- source_word: רֹעֵה צֹאן
  choice: भेड़-बकरियों के चरवाहे
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, के झुंड को दर्शाता है। यह अनुवाद दोनों प्रजातियों को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: עֲבָדֶיךָ
  choice: आपके सेवक
  rationale: फ़िरौन को सीधे संबोधित करते हुए यह दरबारी विनम्रता का आत्म-सूचक प्रयोग है; यहाँ दासत्व का अर्थ प्रमुख नहीं है।
- source_word: גַּם אֲנַחְנוּ גַּם אֲבוֹתֵינוּ
  choice: हम भी और हमारे पुरखे भी
  rationale: दोहराया गया גַּם दोनों पक्षों पर बल देता और पीढ़ियों की निरंतरता बनाए रखता है। ‘पुरखे’ वंशगत पूर्वजों के लिए सहज और गरिमापूर्ण है।
- source_word: אֶל אֶחָיו
  choice: उसके भाइयों से
  rationale: इब्रानी सर्वनाम का संदर्भ यूसुफ से है। मूल की अभिव्यक्ति को बनाए रखते हुए नाम को अनावश्यक रूप से मुख्य पाठ में नहीं जोड़ा गया।
