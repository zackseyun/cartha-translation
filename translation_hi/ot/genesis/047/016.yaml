source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ הָב֣וּ מִקְנֵי/כֶ֔ם וְ/אֶתְּנָ֥ה לָ/כֶ֖ם בְּ/מִקְנֵי/כֶ֑ם אִם אָפֵ֖ס כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/016.yaml
  text: And Joseph said[a], “Bring your livestock, and I will give to you in exchange for your livestock[b], if the money is gone.”
translation:
  language: hi
  text: तब यूसुफ ने कहा, “अपने मवेशी दे दो। यदि[b] पैसा समाप्त हो गया है, तो मैं तुम्हारे मवेशियों के बदले तुम्हें भोजन[a] दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से केवल “तुम्हें दूँगा” है; अकाल के तत्काल प्रसंग के आधार पर “भोजन” जोड़ा गया है।
    reason: lexical_alternative
  - marker: b
    text: या “चूँकि”; इस संदर्भ में “यदि” कारण का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: दे दो
  rationale: यह बहुवचन आज्ञार्थक रूप है और इस लेन-देन में पशुओं को सौंपने का भाव व्यक्त करता है। हिंदी में ‘दे दो’ स्रोत के निकट और स्वाभाविक है।
- source_word: מִקְנֵיכֶם
  choice: अपने मवेशी / तुम्हारे मवेशियों
  rationale: מִקְנֶה पाले हुए पशुधन का व्यापक सूचक है। ‘मवेशी’ आधुनिक हिंदी में इस सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאֶתְּנָה לָכֶם
  choice: तुम्हें भोजन दूँगा
  rationale: हिब्रू में ‘दूँगा’ का कर्म व्यक्त नहीं है, पर तत्काल प्रसंग अकाल में भोजन प्राप्त करने का है। स्पष्ट और स्वाभाविक हिंदी के लिए ‘भोजन’ जोड़ा गया है और इसे पादटिप्पणी में बताया गया है।
- source_word: בְּמִקְנֵיכֶם
  choice: तुम्हारे मवेशियों के बदले
  rationale: यहाँ בְּ विनिमय का संबंध व्यक्त करता है; ‘के बदले’ लेन-देन का अर्थ स्पष्ट और मुहावरेदार ढंग से देता है।
- source_word: אִם
  choice: यदि
  rationale: אִם का मूल सशर्त अर्थ ‘यदि’ है। संदर्भ में इसका कारणसूचक अर्थ ‘क्योंकि/चूँकि’ भी संभव है; मुख्य पाठ में स्रोत की औपचारिक अनिश्चितता रखी गई है।
- source_word: אָפֵס כָּסֶף
  choice: पैसा समाप्त हो गया है
  rationale: אָפֵס किसी वस्तु के चुक जाने या समाप्त हो जाने को दर्शाता है। यह अनुवाद धन के खत्म हो जाने का भाव स्पष्ट रखता है।
