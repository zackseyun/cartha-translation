  yaml_path: translation/ot/genesis/047/028.yaml
  text: Jacob lived in the land of Egypt seventeen years[a], and the days of Jacob, the years of his life, were one hundred forty-seven years.
translation:
  language: hi
  text: याकूब मिस्र की भूमि में सत्रह वर्ष जीवित रहा, और याकूब के दिन, उसके जीवन के वर्ष[a], कुल एक सौ सैंतालीस वर्ष हुए।
  philosophy: optimal-equivalence
  footnotes:
