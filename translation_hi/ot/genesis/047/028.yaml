- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: सत्रह वर्ष
  rationale: संख्या और वर्ष की अभिव्यक्ति का मानक हिंदी रूप।
- source_word: וַיְהִי
  choice: कुल … हुए
  rationale: आयु के सारांश में इब्रानी क्रिया का स्वाभाविक हिंदी समतुल्य; ‘कुल’ अंतिम योग को स्पष्ट करता है।
- source_word: יְמֵי יַעֲקֹב
  choice: याकूब के जीवन के दिन
  rationale: इब्रानी ‘याकूब के दिन’ की जीवन-अवधि संबंधी अभिव्यक्ति को पर्याप्त औपचारिकता से बनाए रखते हुए हिंदी में अर्थ स्पष्ट करता है।
- source_word: שְׁנֵי חַיָּיו
  choice: अर्थात् उसके जीवन के वर्ष
  rationale: यह समानाधिकरण पद पहले वाक्यांश को स्पष्ट करता है; ‘अर्थात्’ हिंदी पाठक के लिए दोनों अभिव्यक्तियों का संबंध स्वाभाविक बनाता है।
- source_word: שֶׁבַע שָׁנִים וְאַרְבָּעִים וּמְאַת שָׁנָה
  choice: एक सौ सैंतालीस वर्ष
  rationale: इब्रानी संख्या-क्रम को हिंदी के सामान्य अवरोही क्रम में प्रस्तुत करते हुए ठीक वही कुल संख्या देता है।
