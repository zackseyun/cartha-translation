  yaml_path: translation/ot/genesis/047/031.yaml
  text: He said[a], “Swear to me,” and he swore to him. Then Israel bowed himself on the head of the bed.
translation:
  language: hi
  text: उसने कहा, “मुझसे शपथ खा,” और उसने उससे शपथ खाई। तब इस्राएल ने पलंग के सिरहाने[a] झुककर प्रणाम किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लाठी के सिरे पर झुककर प्रणाम किया।” इब्रानी व्यंजनों को इस प्रकार भी पढ़ा जा सकता है; सेप्टुआजिन्ट और इब्रानियों 11:21 में यही अर्थ मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁבְעָה לִי
  choice: मुझसे शपथ खा
  rationale: आज्ञार्थक शपथ-सूत्र की सीधी और स्वाभाविक हिन्दी अभिव्यक्ति; ‘मुझसे’ प्रतिज्ञा पाने वाले व्यक्ति को स्पष्ट करता है।
- source_word: וַיִּשָּׁבַע לוֹ
  choice: उसने उससे शपथ खाई
  rationale: उसी शपथ-धातु की पुनरावृत्ति बनाए रखता है और बताता है कि यूसुफ ने इस्राएल के प्रति शपथ खाई।
- source_word: וַיִּשְׁתַּחוּ
  choice: झुककर प्रणाम किया
  rationale: क्रिया शारीरिक रूप से झुकने और प्रसंगानुसार आराधना, दोनों का अर्थ दे सकती है। यहाँ कोई कर्म स्पष्ट नहीं है; इसलिए यह चयन शारीरिक मुद्रा को व्यक्त करता है, पर मुख्य पाठ में आराधना का आशय अनिवार्य नहीं बनाता।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: इब्रानी पाठ में प्रयुक्त नाम को सुरक्षित रखा गया है; इसे ‘याकूब’ से नहीं बदला गया।
- source_word: עַל רֹאשׁ הַמִּטָּה
  choice: पलंग के सिरहाने
  rationale: मसोरा-स्वरांकन के अनुसार הַמִּטָּה का अर्थ ‘पलंग’ है। ‘सिरहाने’ आधुनिक हिन्दी में पलंग के सिर की ओर/उसके सहारे की स्थानगत धारणा स्वाभाविक रूप से देता है, बिना अस्वाभाविक ‘पलंग के सिर पर’ कहे।
theological_decisions:
- issue: मसोरा-पाठ के ‘पलंग’ और सेप्टुआजिन्ट तथा इब्रानियों 11:21 में प्रतिबिंबित ‘लाठी’ पाठ के बीच भिन्नता
  choice: पलंग
  alternative: लाठी
  rationale: उत्पत्ति के मुख्य पाठ में उपलब्ध WLC के मसोरा-स्वरांकन הַמִּטָּה (‘पलंग’) का अनुसरण किया गया है। वही व्यंजन दूसरे स्वरांकन के साथ ‘लाठी’ पढ़े जा सकते हैं; इस प्राचीन और धर्मवैचारिक रूप से महत्त्वपूर्ण पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: וַיִּשְׁתַּחוּ में शारीरिक प्रणाम और आराधना की अर्थ-संभावना
  choice: झुककर प्रणाम किया
  alternative: आराधना की
  rationale: प्रसंग में क्रिया का कोई स्पष्ट कर्म नहीं है। मुख्य पाठ शारीरिक क्रिया को सामने रखता है और परमेश्वर की आराधना को न तो नकारता है, न अनावश्यक रूप से स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शपथ खा/खाई’ प्रत्यक्ष संवाद की दृढ़ता और मूल की शब्द-पुनरावृत्ति बनाए रखता है। पादटिप्पणी-चिह्न उसी विवादित पदबंध के बाद रखा गया है जिससे वह संबंधित है।
