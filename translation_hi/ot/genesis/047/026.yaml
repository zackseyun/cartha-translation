  text: וַ/יָּ֣שֶׂם אֹתָ֣/הּ יוֹסֵ֡ף לְ/חֹק֩ עַד הַ/יּ֨וֹם הַ/זֶּ֜ה עַל אַדְמַ֥ת מִצְרַ֛יִם לְ/פַרְעֹ֖ה לַ/חֹ֑מֶשׁ רַ֞ק אַדְמַ֤ת הַ/כֹּֽהֲנִים֙ לְ/בַדָּ֔/ם לֹ֥א הָיְתָ֖ה לְ/פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/026.yaml
  text: 'So Joseph made it a statute that stands to this day concerning the land of Egypt: the fifth is for Pharaoh[d][c][b][a]. Only the land of the priests alone did not become Pharaoh’s.'
translation:
  language: hi
  text: 'इस प्रकार यूसुफ ने मिस्र की भूमि के विषय में यह नियम ठहराया, जो आज तक चला आ रहा है: उपज का पाँचवाँ भाग फ़िरौन का होगा। केवल याजकों की भूमि फ़िरौन की नहीं हुई।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָהּ ... לְחֹק
  choice: यह नियम ठहराया
  rationale: שׂוּם के साथ חֹק कानूनी-प्रशासनिक संदर्भ में किसी व्यवस्था को नियम के रूप में स्थापित करने का भाव देता है। सर्वनाम אֹתָהּ को हिन्दी में ‘यह’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: जो आज तक चला आ रहा है
  rationale: यह मुहावरा कथाकार के समय तक नियम की निरंतर वैधता बताता है; सम्बन्धवाचक वाक्य हिन्दी में इसका आशय स्पष्ट करता है।
- source_word: עַל אַדְמַת מִצְרַיִם
  choice: मिस्र की भूमि के विषय में
  rationale: यहाँ עַל नियम के लागू होने के क्षेत्र या विषय को सूचित करता है।
- source_word: לְפַרְעֹה לַחֹמֶשׁ
  choice: उपज का पाँचवाँ भाग फ़िरौन का होगा
  rationale: חֹמֶשׁ पाँचवें हिस्से को दर्शाता है और पिछले पद के अनुसार यह उपज का हिस्सा है। לְפַרְעֹה प्राप्तकर्ता या अधिकार को बताता है। ‘होगा’ नियम की स्थायी शर्त को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רַק אַדְמַת הַכֹּהֲנִים לְבַדָּם
  choice: केवल याजकों की भूमि
  rationale: רַק और לְבַדָּם दोनों अपवाद को बल देते हैं; हिन्दी में ‘केवल’ इस संयुक्त बल को बिना अस्वाभाविक पुनरुक्ति के व्यक्त करता है।
- source_word: לֹא הָיְתָה לְפַרְעֹה
  choice: फ़िरौन की नहीं हुई
  rationale: היה + ל परिणामी स्वामित्व का संकेत देता है; संदर्भ में भूमि के फ़िरौन के अधिकार में न आने का भाव है।
