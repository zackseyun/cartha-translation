  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। ‘याजक’ और ‘फ़िरौन’ प्रचलित बाइबलीय शब्दावली हैं। ‘उपज का’ पूर्वपद के संदर्भ को स्पष्ट करता है, जिससे पाँचवाँ भाग भूमि का नहीं बल्कि पैदावार का समझा जाए।
