  text: उसने अपने भाइयों में से[a] पाँच लोगों को लिया और उन्हें फ़िरौन के सामने प्रस्तुत किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, शाब्दिक रूप से, “अपने भाइयों के छोर/किनारे से”; अथवा “अपने भाइयों में से सबसे उत्तम लोगों को।” इब्रानी अभिव्यक्ति में “छोर/किनारे” का भाव है, पर यहाँ उसका अर्थ संभवतः भाइयों के समूह में से पाँच को चुनना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְצֵה
  choice: में से
  rationale: מִן के साथ קָצֶה का शाब्दिक अर्थ ‘छोर/किनारे से’ है, पर यहाँ यह बड़े समूह में से कुछ व्यक्तियों के चयन को व्यक्त करता है। ‘में से’ आधुनिक हिन्दी में इस अंशात्मक भाव को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: אֶחָיו
  choice: अपने भाइयों
  rationale: संदर्भ यूसुफ़ के सगे भाइयों का है; इसलिए व्यापक ‘कुटुम्बियों’ के बजाय ‘भाइयों’ सटीक है। कर्ता के साथ संबंध स्पष्ट करने के लिए ‘अपने’ स्वाभाविक हिन्दी है।
- source_word: לָקַח
  choice: लिया
  rationale: क्रिया का सामान्य अर्थ ‘लेना’ है। संदर्भ में चयन निहित है, फिर भी ‘लिया’ मूल शब्दावली को बनाए रखता है।
- source_word: חֲמִשָּׁה אֲנָשִׁים
  choice: पाँच पुरुषों
  rationale: संख्या और संज्ञा का सीधा अनुवाद है; ये पुरुष यूसुफ़ के भाइयों में से थे।
- source_word: וַיַּצִּגֵם
  choice: उन्हें ... प्रस्तुत किया
  rationale: हिफ़िल रूप का अर्थ किसी को सामने खड़ा करना या प्रस्तुत करना है। राज-दरबार के प्रसंग में ‘प्रस्तुत किया’ स्वाभाविक और अर्थानुकूल है।
- source_word: לִפְנֵי פַרְעֹה
  choice: फ़िरौन के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने/की उपस्थिति में’ है; यहाँ ‘फ़िरौन के सामने’ संक्षिप्त और स्वाभाविक है।
