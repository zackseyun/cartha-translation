source:
  edition: WLC
  text: וְ/אֶ֨ת הָ/עָ֔ם הֶעֱבִ֥יר אֹת֖/וֹ לֶ/עָרִ֑ים מִ/קְצֵ֥ה גְבוּל מִצְרַ֖יִם וְ/עַד קָצֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/021.yaml
  text: As for the people[a], he moved them to the cities, from one end of the territory of Egypt to the other.
translation:
  language: hi
  text: और लोगों को उसने मिस्र के पूरे क्षेत्र में, एक छोर से दूसरे छोर तक, नगरों में स्थानांतरित कर दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उन्हें नगरों में पहुँचा दिया।” कुछ अनुवाद एक भिन्न पाठ-समझ के आधार पर कहते हैं कि यूसुफ ने लोगों को दास बना दिया; पर यहाँ का इब्रानी पाठ अधिक सीधे उनके स्थानांतरण की बात करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: लोगों
  rationale: यह शब्द मिस्र की उस समूची जनसंख्या के लिए सामूहिक रूप से प्रयुक्त है जो यूसुफ की नीति से प्रभावित हुई; ‘लोगों’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: הֶעֱבִיר אֹתוֹ
  choice: उसने … स्थानांतरित कर दिया
  rationale: עבר के हिफ़ील रूप का यहाँ अर्थ किसी को एक स्थान से दूसरे स्थान पर पहुँचाना या स्थानांतरित करना है। सामूहिक एकवचन ‘लोग’ के लिए हिन्दी में ‘लोगों को’ स्वाभाविक है।
- source_word: לֶעָרִים
  choice: नगरों में
  rationale: ל को यहाँ गंतव्यसूचक समझना सबसे उपयुक्त है। ‘नगरों में’ लोगों के वहाँ बसाए या पहुँचाए जाने का भाव स्पष्ट करता है, बिना ‘एक नगर से दूसरे नगर’ का अर्थ जोड़े।
- source_word: מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ
  choice: मिस्र के पूरे क्षेत्र में, एक छोर से दूसरे छोर तक
  rationale: यह पदबंध मिस्र के भूभाग की संपूर्ण सीमा-विस्तार को व्यक्त करता है। हिन्दी क्रम में ‘पूरे क्षेत्र में’ जोड़ने से ‘एक छोर से दूसरे छोर तक’ का व्यापक भौगोलिक आशय स्पष्ट और स्वाभाविक रहता है।
theological_decisions:
- issue: मिस्र की जनता के प्रति यूसुफ की कार्रवाई का अर्थ
  choice: उसने लोगों को नगरों में स्थानांतरित किया
  alternative: उसने लोगों को दास बना दिया; अथवा उन्हें एक नगर से दूसरे नगर में भेजा
  rationale: मसोरेटिक इब्रानी पाठ הֶעֱבִיר ... לֶעָרִים सीधे तौर पर लोगों के स्थानांतरण की बात करता है। दास बनाए जाने का अर्थ इस पद के वर्तमान इब्रानी शब्दों में स्पष्ट नहीं है, और ‘एक नगर से दूसरे नगर’ भी आवश्यक रूप से व्यक्त नहीं होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘स्थानांतरित’ प्रशासनिक संदर्भ में सटीक है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सरल रखा गया है।
