  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ֧/מָּה נָמ֣וּת לְ/עֵינֶ֗י/ךָ גַּם אֲנַ֨חְנוּ֙ גַּ֣ם אַדְמָתֵ֔/נוּ קְנֵֽה אֹתָ֥/נוּ וְ/אֶת אַדְמָתֵ֖/נוּ בַּ/לָּ֑חֶם וְ/נִֽהְיֶ֞ה אֲנַ֤חְנוּ וְ/אַדְמָתֵ֨/נוּ֙ עֲבָדִ֣ים לְ/פַרְעֹ֔ה וְ/תֶן זֶ֗רַע וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת וְ/הָ/אֲדָמָ֖ה לֹ֥א תֵשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/019.yaml
  text: Why should we die before your eyes[a], both we and our land? Buy us and our land for bread, and we and our land will be servants to Pharaoh. Give seed, so that we may live and not die[e][d][c][b], and the land may not become desolate.
translation:
  language: hi
  text: हम और हमारी भूमि दोनों आपकी आँखों के सामने क्यों मरें?[a] आप रोटी के बदले हमें और हमारी भूमि को मोल ले लीजिए। तब हम और हमारी भूमि फ़िरौन के दास हो जाएँगे। हमें बीज दीजिए, ताकि हम जीवित रहें, मरें नहीं, और भूमि उजाड़ न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपके देखते-देखते।”
    reason: इब्रानी मुहावरे לְעֵינֶיךָ का वैकल्पिक स्वाभाविक अनुवाद।
lexical_decisions:
- source_word: לָמָּה נָמוּת
  choice: क्यों मरें
  rationale: यह अकाल के बीच की गई आग्रहपूर्ण अलंकारिक विनती है; हिन्दी में संभावनार्थक रूप इसका भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְעֵינֶיךָ
  choice: आपकी आँखों के सामने
  rationale: इब्रानी मुहावरे की दृश्यात्मक तीव्रता बनाए रखता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: גַּם אֲנַחְנוּ גַּם אַדְמָתֵנוּ
  choice: हम और हमारी भूमि—दोनों
  rationale: युग्मित גַּם ... גַּם को सहज हिन्दी में व्यक्त करते हुए लोगों और भूमि, दोनों पर समान बल देता है।
- source_word: קְנֵה אֹתָנוּ וְאֶת אַדְמָתֵנוּ
  choice: हमें और हमारी भूमि को मोल ले लीजिए
  rationale: कנה यहाँ अकाल की परिस्थिति में व्यावसायिक अधिग्रहण बताता है; आदरसूचक विनती के अनुरूप 'मोल ले लीजिए' स्वाभाविक है।
- source_word: בַּלָּחֶם
  choice: रोटी के बदले
  rationale: ב मूल्य या विनिमय का संकेत देता है; 'रोटी' मूल के ठोस शब्द को रखती है, जबकि 'के बदले' लेन-देन स्पष्ट करता है।
- source_word: וְנִהְיֶה
  choice: हो जाएँगे
  rationale: आज्ञार्थक क्रिया के बाद यह प्रस्तावित खरीद का परिणाम व्यक्त करता है।
- source_word: עֲבָדִים
  choice: दास
  rationale: आर्थिक-वैधानिक संदर्भ में स्वतंत्रता खोकर फ़िरौन के अधीन होने की स्थिति प्रमुख है; 'दास' इसे 'सेवक' से अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: וְתֶן זֶרַע
  choice: हमें बीज दीजिए
  rationale: मूल में प्राप्तकर्ता प्रसंग से निहित है; हिन्दी में 'हमें' जोड़ना अर्थ बदले बिना वाक्य को स्वाभाविक और स्पष्ट बनाता है।
- source_word: וְהָאֲדָמָה לֹא תֵשָׁם
  choice: भूमि उजाड़ न हो
  rationale: שמם के निर्जन या अनुपजाऊ हो जाने के भाव को संक्षिप्त, सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: עֲבָדִים में अधीनता की प्रकृति
  choice: दास
  alternative: सेवक
  rationale: यहाँ लोग भोजन के बदले स्वयं और अपनी भूमि को फ़िरौन के लिए बेचने का प्रस्ताव रखते हैं, इसलिए बंधुआ आर्थिक अधीनता को छिपाना उचित नहीं; फिर भी पद उससे आगे की किसी विशिष्ट दास-व्यवस्था का विवरण नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानसूचक संबोधन के साथ विनती का स्वर। भाषा साधारण पाठकों के लिए स्पष्ट और गरिमापूर्ण रखी गई है। 'रोटी', 'बीज', 'भूमि' और 'दास' जैसे ठोस शब्द मूल के कृषि और आर्थिक संदर्भ को बनाए रखते हैं।
