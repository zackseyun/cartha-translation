base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/024.yaml
  text: And at the harvest[a], you shall give a fifth to Pharaoh, and four-fifths shall be yours for seed for the field, for your food, for those in your households, and for food for your little ones.
translation:
  language: hi
  text: और जब उपज होगी, तब तुम उसका पाँचवाँ भाग फ़िरौन को देना; बाकी चार-पाँचवाँ भाग[a] तुम्हारा होगा—खेत में बोने के बीज के लिए, तुम्हारे भोजन के लिए, तुम्हारे घरों में रहनेवालों के लिए और तुम्हारे बाल-बच्चों के खाने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “चार हाथ” है; यह एक मुहावरा है जिसका अर्थ शेष चार भाग, अर्थात चार-पाँचवाँ भाग, है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּתְּבוּאֹת
  choice: जब उपज होगी
  rationale: תְּבוּאָה उपज या पैदावार को दर्शाता है। ב־ को इस प्रशासनिक संदर्भ में समयसूचक रूप में लेकर यह सहज हिंदी में फसल से प्राप्त उपज के समय को व्यक्त करता है।
- source_word: וּנְתַתֶּם חֲמִישִׁית לְפַרְעֹה
  choice: तुम उसका पाँचवाँ भाग फ़िरौन को देना
  rationale: חֲמִישִׁית का अर्थ पाँचवाँ भाग है; 'उसका' उपज की ओर स्पष्ट संकेत करता है और आज्ञार्थक व्यवस्था को स्वाभाविक हिंदी में रखता है।
- source_word: וְאַרְבַּע הַיָּדֹת
  choice: बाकी चार-पाँचवाँ भाग
  rationale: '''चार हाथ/भाग'' का इब्रानी मुहावरा पाँच में से शेष चार भागों को दर्शाता है। अर्थानुसार ''चार-पाँचवाँ भाग'' हिंदी में स्पष्ट है; ''बाकी'' पिछले पाँचवें भाग से इसका संबंध दिखाता है।'
- source_word: יִהְיֶה לָכֶם
  choice: तुम्हारा होगा
  rationale: यह शेष उपज के अधिकार और उपयोग हेतु आवंटन को संक्षिप्त, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְזֶרַע הַשָּׂדֶה
  choice: खेत में बोने के बीज के लिए
  rationale: यहाँ לְ उद्देश्य बताता है और वाक्यांश अगली बुवाई के लिए बचाए गए बीज को संदर्भित करता है।
- source_word: וּלְאָכְלְכֶם
  choice: तुम्हारे भोजन के लिए
  rationale: אכל से बना रूप यहाँ खाने या भोजन के उपयोग को दर्शाता है; यह सूची में सहज संज्ञात्मक अभिव्यक्ति है।
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  choice: तुम्हारे घरों में रहनेवालों के लिए
  rationale: सापेक्ष वाक्यांश घरों में मौजूद लोगों को संदर्भित करता है। 'रहनेवालों' से व्यक्ति-संदर्भ स्पष्ट होता है, बिना किसी खास घरेलू श्रेणी को जोड़ने के।
- source_word: וְלֶאֱכֹל לְטַפְּכֶם
  choice: तुम्हारे बाल-बच्चों के खाने के लिए
  rationale: טַף छोटे बच्चों और आश्रित बालकों के सामूहिक अर्थ में आता है। 'बाल-बच्चे' साधारण, आत्मीय और व्यापक आधुनिक हिंदी है।
