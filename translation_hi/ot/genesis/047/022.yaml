  text: רַ֛ק אַדְמַ֥ת הַ/כֹּהֲנִ֖ים לֹ֣א קָנָ֑ה כִּי֩ חֹ֨ק לַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת פַּרְעֹ֗ה וְ/אָֽכְל֤וּ אֶת חֻקָּ/ם֙ אֲשֶׁ֨ר נָתַ֤ן לָ/הֶם֙ פַּרְעֹ֔ה עַל כֵּ֕ן לֹ֥א מָכְר֖וּ אֶת אַדְמָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/022.yaml
  text: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
translation:
  language: hi
  text: केवल याजकों की भूमि उसने नहीं खरीदी, क्योंकि फ़िरौन की ओर से याजकों के लिए भोजन का एक निर्धारित भाग था, और वे फ़िरौन के दिए हुए उसी भाग को खाते थे। इसलिए उन्होंने अपनी भूमि नहीं बेची।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: केवल
  rationale: यह पिछले कथन के एक अपवाद को चिह्नित करता है और इब्रानी के सीमित करने वाले बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אַדְמַת הַכֹּהֲנִים
  choice: याजकों की भूमि
  rationale: यह याजकों के स्वामित्व वाली भूमि को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קָנָה
  choice: खरीदी
  rationale: अकाल और भूमि के लेन-देन के प्रसंग में इसका सीधा अर्थ खरीदना है।
- source_word: חֹק / חֻקָּם
  choice: निर्धारित भोजन-भाग / उसी भाग
  rationale: यहाँ शब्द अमूर्त विधि से अधिक फ़िरौन द्वारा नियत जीविका-प्रावधान को दर्शाता है; 'भोजन-भाग' आगे के 'खाते थे' से भी स्वाभाविक रूप से जुड़ता है।
- source_word: מֵאֵת פַּרְעֹה
  choice: फ़िरौन की ओर से
  rationale: यह प्रावधान के स्रोत को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְאָכְלוּ אֶת חֻקָּם
  choice: वे उसी भाग से भोजन करते थे
  rationale: इब्रानी के खाने के ठोस भाव को रखता है, पर हिन्दी में अस्वाभाविक 'भाग को खाते थे' से बचता है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: पूर्ववर्ती कारण से निकलने वाले परिणाम को स्पष्ट करता है।
- source_word: מָכְרוּ אֶת אַדְמָתָם
  choice: उन्होंने अपनी भूमि नहीं बेची
  rationale: व्यापारिक क्रिया और स्वामित्व, दोनों को सरल व स्पष्ट हिन्दी में सुरक्षित रखता है।
