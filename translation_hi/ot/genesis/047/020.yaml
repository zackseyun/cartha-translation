base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/020.yaml
  text: So Joseph bought all the land of Egypt for Pharaoh[a], because every Egyptian sold his field, for the famine was severe upon them[b]; and the land became Pharaoh’s.
translation:
  language: hi
  text: यूसुफ़ ने फ़िरौन के लिए मिस्र की सारी भूमि मोल ले ली[a], क्योंकि हर मिस्री ने अपना खेत बेच दिया था; क्योंकि अकाल उन पर बहुत भारी था[b]। इस प्रकार भूमि फ़िरौन की हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिस्र की सारी भूमि फ़िरौन के लिए प्राप्त कर ली।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अकाल उन पर प्रबल था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: मोल ले ली
  rationale: קנה यहाँ बिक्री के प्रसंग में धन देकर संपत्ति प्राप्त करने को दर्शाता है; ‘मोल ले ली’ स्वाभाविक हिंदी में इस व्यावसायिक अर्थ को स्पष्ट रखता है।
- source_word: אַדְמַת מִצְרַיִם
  choice: मिस्र की सारी भूमि
  rationale: संपत्ति और स्वामित्व के संदर्भ में אַדְמָה का अर्थ केवल मिट्टी नहीं, बल्कि भूमि है।
- source_word: לְפַרְעֹה
  choice: फ़िरौन के लिए
  rationale: לְ यहाँ उस व्यक्ति को सूचित करता है जिसके लिए और जिसके स्वामित्व हेतु यूसुफ़ ने भूमि खरीदी।
- source_word: מִצְרַיִם אִישׁ שָׂדֵהוּ
  choice: हर मिस्री ने अपना खेत
  rationale: सामूहिक ‘मिस्रियों’ के साथ אִישׁ और एकवचन ‘उसका खेत’ का प्रयोग वितरणात्मक है; ‘हर मिस्री ने अपना खेत’ इसे सहज हिंदी में व्यक्त करता है।
- source_word: חָזַק עֲלֵהֶם הָרָעָב
  choice: अकाल का प्रकोप मिस्रियों पर बहुत भारी था
  rationale: חזק का मूल भाव ‘बलवान/प्रबल होना’ है। अकाल के साथ ‘प्रकोप ... बहुत भारी था’ उसकी तीव्रता और लोगों पर उसके दबाव, दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַתְּהִי הָאָרֶץ לְפַרְעֹה
  choice: भूमि फ़िरौन की हो गई
  rationale: यह वाक्य भूमि के स्वामित्व में आए परिणामकारी परिवर्तन को संक्षेप और स्पष्ट रूप से बताता है।
