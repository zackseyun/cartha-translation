id: GEN.47.17
reference: Genesis 47:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ אֶת מִקְנֵי/הֶם֮ אֶל יוֹסֵף֒ וַ/יִּתֵּ֣ן לָ/הֶם֩ יוֹסֵ֨ף לֶ֜חֶם בַּ/סּוּסִ֗ים וּ/בְ/מִקְנֵ֥ה הַ/צֹּ֛אן וּ/בְ/מִקְנֵ֥ה הַ/בָּקָ֖ר וּ/בַ/חֲמֹרִ֑ים וַ/יְנַהֲלֵ֤/ם בַּ/לֶּ֨חֶם֙ בְּ/כָל מִקְנֵ/הֶ֔ם בַּ/שָּׁנָ֖ה הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/017.yaml
  text: So they brought their livestock to Joseph[a], and Joseph gave them bread in exchange for the horses, the flocks, the herds, and the donkeys[b]; and he provided for them with bread in exchange for all their livestock during that year.
translation:
  language: hi
  text: तब वे अपने पशु यूसुफ के पास ले आए, और यूसुफ ने घोड़ों, भेड़-बकरियों के झुंडों, गाय-बैलों के झुंडों और गधों के बदले उन्हें रोटी दी। इस प्रकार उस वर्ष उसने उनके सभी पशुओं के बदले रोटी देकर उनका भरण-पोषण किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “उसने रोटी के द्वारा उनका मार्गदर्शन किया।” इब्रानी क्रिया का अर्थ “ले चलना, मार्गदर्शन करना या सँभालना” हो सकता है; यहाँ संभवतः अकाल के दौरान उनका पालन-पोषण करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵיהֶם / מִקְנֵהֶם
  choice: अपने पशु / उनके सभी पशुओं
  rationale: यह शब्द अर्जित या पाले हुए घरेलू पशुओं के लिए व्यापक सामूहिक पद है; हिंदी में ‘पशु’ प्रसंग के अनुसार स्वाभाविक और पर्याप्त व्यापक है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: शब्द का मूल अर्थ ‘रोटी’ है, यद्यपि यह व्यापक अर्थ में भोजन भी दर्शा सकता है। अकाल के प्रसंग में ‘रोटी’ अनाज-आधारित जीवन-निर्वाह को स्वाभाविक रूप से व्यक्त करती है और पद में इसकी पुनरावृत्ति बनाए रखती है।
- source_word: בַּסּוּסִים
  choice: घोड़ों के बदले
  rationale: यहाँ ב विनिमय में दी गई वस्तु को सूचित करता है; ‘के बदले’ लेन-देन का आशय स्पष्ट करता है।
- source_word: מִקְנֵה הַצֹּאן
  choice: भेड़-बकरियों के झुंडों
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, का सामूहिक पद है; केवल ‘भेड़ें’ कहना इसे अनावश्यक रूप से संकरा कर देता।
- source_word: מִקְנֵה הַבָּקָר
  choice: गाय-बैलों के झुंडों
  rationale: בָּקָר मुख्यतः गोवंश को दर्शाता है। ‘गाय-बैल’ आधुनिक हिंदी में इस सामूहिक वर्ग को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: חֲמֹרִים
  choice: गधों
  rationale: यह सीधा, स्पष्ट और आधुनिक हिंदी समतुल्य है।
- source_word: וַיְנַהֲלֵם
  choice: उनका भरण-पोषण किया
  rationale: נהל का मूल अर्थ नेतृत्व करना या संभालना हो सकता है, पर यहाँ ‘रोटी देकर’ के साथ अकाल में लोगों को सँभालने और जीविका देने का भाव है। ‘भरण-पोषण किया’ उस प्रसंगगत अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בַּלֶּחֶם
  choice: रोटी देकर
  rationale: पूर्वसर्ग साधन को सूचित करता है; ‘रोटी देकर’ हिंदी में स्वाभाविक रूप से बताता है कि यूसुफ ने किस प्रकार उनका पालन किया।
- source_word: בְּכָל מִקְנֵהֶם
  choice: उनके सभी पशुओं के बदले
  rationale: यह पूरे विनिमय का सार है। ‘के बदले’ पशुओं और लोगों के लिए दी गई रोटी के बीच विनिमय-संबंध को स्पष्ट करता है।
- source_word: בַּשָּׁנָה הַהִוא
  choice: उस वर्ष
  rationale: यह व्यवस्था जिस समयावधि में चली, उसे संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: וַיְנַהֲלֵם में ‘ले जाने/मार्गदर्शन करने’ और ‘पालन करने’ के बीच अर्थगत तनाव
  choice: उसने ... उनका भरण-पोषण किया
  alternative: उसने रोटी देकर उन्हें सँभाला/चलाया
  rationale: आर्थिक और अकाल-संबंधी प्रसंग में लोगों को रोटी देकर जीवित रखना प्रमुख आशय है, पर क्रिया का शाब्दिक ‘ले जाना/सँभालना’ अर्थ वास्तविक है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पशु-वर्गों को स्पष्ट करने के लिए ‘भेड़-बकरियाँ’ और ‘गाय-बैल’ जैसे प्रचलित सामूहिक पद चुने गए हैं। मुख्य पाठ में विनिमय और जीवन-निर्वाह दोनों भाव स्पष्ट हैं, जबकि נהל की वास्तविक शब्दार्थगत व्यापकता पादटिप्पणी में सुरक्षित है।
