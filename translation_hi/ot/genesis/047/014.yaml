base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/014.yaml
  text: And Joseph gathered up all the silver found in the land of Egypt and in the land of Canaan for the grain that they were buying[b][a], and Joseph brought the silver into Pharaoh’s house.
translation:
  language: hi
  text: और यूसुफ ने मिस्र देश और कनान देश में पाई जानेवाली सारी चाँदी[a] उस अनाज के बदले इकट्ठा कर ली जिसे लोग खरीद रहे थे; और यूसुफ उस चाँदी को फ़िरौन के भवन[b] में ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारा धन।” इब्रानी में शाब्दिक रूप से “सारी चाँदी” है; यहाँ चाँदी भुगतान के माध्यम के रूप में प्रयुक्त हुई है।
    reason: lexical_alternative
  - marker: b
    text: “फ़िरौन का भवन” केवल राजनिवास ही नहीं, बल्कि फ़िरौन के राजघराने या राजकोष को भी सूचित कर सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְלַקֵּט
  choice: इकट्ठा कर लिया
  rationale: לקט का अर्थ बटोरना या इकट्ठा करना है; यह अनेक लेन-देन से चाँदी संचित होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל הַכֶּסֶף
  choice: सारा चाँदी
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ है और प्रसंग में वही भुगतान का माध्यम है; ठोस धातु-संज्ञा को मुख्य पाठ में रखा गया है।
- source_word: הַנִּמְצָא
  choice: पाया जानेवाला
  rationale: यह מצא का निफ़अल कृदन्त है और दोनों देशों में उपलब्ध या मौजूद चाँदी को सूचित करता है।
- source_word: בְאֶרֶץ מִצְרַיִם וּבְאֶרֶץ כְּנַעַן
  choice: मिस्र देश और कनान देश में
  rationale: ‘देश’ को दोनों स्थान-नामों के साथ रखकर इब्रानी की भौगोलिक समानांतरता सुरक्षित की गई है।
- source_word: בַּשֶּׁבֶר
  choice: उस अनाज के बदले
  rationale: यूसुफ-वृत्तान्त में שֶׁבֶר अकाल के समय बेचा जानेवाला अनाज है; ב यहाँ मूल्य-विनिमय का संबंध व्यक्त करता है।
- source_word: אֲשֶׁר הֵם שֹׁבְרִים
  choice: जिसे लोग खरीद रहे थे
  rationale: इस प्रसंग में שבר का अर्थ अनाज खरीदना है और कृदन्त जारी क्रिया दर्शाता है। इब्रानी सर्वनाम का संदर्भ सामान्य खरीदारों से है, इसलिए आधुनिक हिन्दी में ‘लोग’ स्पष्ट और स्वाभाविक है।
- source_word: וַיָּבֵא ... בֵּיתָה פַרְעֹה
  choice: फ़िरौन के भवन में ले आया
  rationale: दिशासूचक ה स्थान के भीतर गति दिखाता है। ‘भवन’ इब्रानी ‘घर’ का गरिमापूर्ण रूप है, जबकि पादटिप्पणी इसके व्यापक राजकीय अर्थ को स्पष्ट करती है।
