base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/010.yaml
  text: Then Jacob blessed Pharaoh and went out from Pharaoh’s presence[a].
translation:
  language: hi
  text: तब याकूब ने फ़िरौन को आशीर्वाद दिया और फ़िरौन के सामने से निकल गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फ़िरौन का अभिवादन किया” अथवा “फ़िरौन से विदा ली”; इब्रानी क्रिया का सामान्य अर्थ “आशीर्वाद देना” है, पर राजा से औपचारिक भेंट के प्रसंग में इसका भाव अभिवादन या विदाई से भी मिल सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: आशीर्वाद दिया
  rationale: ברך का सामान्य और यहाँ निकटवर्ती संदर्भ (पद 7 और 10) के अनुरूप अर्थ ‘आशीर्वाद देना’ है। राजकीय भेंट के प्रसंग में इसमें औपचारिक अभिवादन या विदाई का भाव भी हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: हिन्दी बाइबल परंपरा में इस इब्रानी व्यक्तिगत नाम का प्रचलित रूप।
- source_word: אֶת
  choice: '[अनूदित नहीं]'
  rationale: यह निश्चित कर्म का इब्रानी चिह्न है; हिन्दी में इसका अलग शब्दगत समकक्ष आवश्यक नहीं।
- source_word: פַּרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के शासक की उपाधि का हिन्दी में प्रचलित रूप।
- source_word: וַיֵּצֵא
  choice: निकल गया
  rationale: יצא का मूल भाव बाहर जाने या निकलने का है; यहाँ यह राजकीय भेंट समाप्त कर वहाँ से चले जाने की ठोस गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִלִּפְנֵי
  choice: फ़िरौन के सामने से
  rationale: यह मूल इब्रानी मुहावरे ‘के सामने से’ को सहज हिन्दी में बनाए रखता है और फ़िरौन की उपस्थिति से प्रस्थान का अर्थ देता है।
