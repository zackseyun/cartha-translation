base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/030.yaml
  text: When I lie down with my fathers[a], carry me out of Egypt and bury me in their burial place.” And he said[c][b], “I will do as you have said.”
translation:
  language: hi
  text: जब मैं अपने पुरखाओं के साथ लेट जाऊँ[a], तब मुझे मिस्र से बाहर ले जाकर उनके दफन-स्थान[b] में दफनाना।” उसने कहा, “जैसा आपने कहा है, मैं वैसा ही करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “और मैं अपने पुरखाओं के साथ लेट जाऊँ।” यह इब्रानी मुहावरा मृत्यु और दफन से जुड़ा है।
    reason: lexical_alternative
  - marker: b
    text: या “उनकी कब्र में” अथवा “उनके मकबरे में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַבְתִּי
  choice: जब मैं ... सो जाऊँ
  rationale: शाब्दिक चित्र ‘लेटने/सोने’ का है और प्रसंग में यह मृत्यु तथा दफन से जुड़ा प्रचलित मुहावरा है। ‘मर जाऊँ’ कहने के बजाय मूल बिंब सुरक्षित रखा गया है; וְ को प्रसंगानुसार कालवाचक ‘जब’ के रूप में व्यक्त किया गया है।
- source_word: עִם אֲבֹתַי
  choice: अपने पुरखाओं के साथ
  rationale: אֲבֹתַי यहाँ पूर्वजों को दर्शाता है। आधुनिक हिंदी में ‘पुरखे’ पारिवारिक संबंध और मृत्यु-संबंधी मुहावरे, दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: וּנְשָׂאתַנִי
  choice: मुझे ... बाहर ले जाकर
  rationale: נשא यहाँ मृत देह को उठाकर/ले जाने के अर्थ में है। हिंदी वाक्य में ‘ले जाकर’ मिस्र से निकाले जाने और दफनाने की संयुक्त गति को सहज ढंग से व्यक्त करता है।
- source_word: מִמִּצְרַיִם
  choice: मिस्र से बाहर
  rationale: מן अलगाव और बाहर निकाले जाने का बोध देता है; ‘मिस्र से बाहर’ अनुरोध की दिशा स्पष्ट करता है।
- source_word: וּקְבַרְתַּנִי
  choice: मुझे ... दफना देना
  rationale: קבר का सीधा अर्थ दफनाना है। ‘देना’ अनुरोध के संदर्भ में स्वाभाविक हिंदी है।
- source_word: בִּקְבֻרָתָם
  choice: उनके कब्रिस्तान में
  rationale: קְבֻרָה यहाँ दफनाने की जगह/समाधि-स्थल को सूचित करता है। ‘कब्रिस्तान’ सामान्य हिंदी में स्थान का अर्थ स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
- source_word: וַיֹּאמַר
  choice: उसने कहा
  rationale: मानक कथात्मक क्रिया; हिंदी में अनावश्यक संयोजक के बिना प्रवाह स्वाभाविक है।
- source_word: אָנֹכִי אֶעֱשֶׂה
  choice: मैं वैसा ही करूँगा
  rationale: स्वतंत्र सर्वनाम אָנֹכִי उत्तर की व्यक्तिगत दृढ़ता पर हल्का बल देता है; ‘मैं’ और ‘वैसा ही’ उस आश्वासन को स्वाभाविक हिंदी में व्यक्त करते हैं।
- source_word: כִדְבָרֶךָ
  choice: जैसा आपने कहा है
  rationale: शाब्दिक अर्थ ‘आपके वचन के अनुसार’ है। आदरसूचक ‘आपने’ पुत्र द्वारा वृद्ध पिता को दिए उत्तर के लिए वर्तमान मानक हिंदी में उपयुक्त है।
