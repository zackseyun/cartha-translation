source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל הָ/עָ֔ם הֵן֩ קָנִ֨יתִי אֶתְ/כֶ֥ם הַ/יּ֛וֹם וְ/אֶת אַדְמַתְ/כֶ֖ם לְ/פַרְעֹ֑ה הֵֽא לָ/כֶ֣ם זֶ֔רַע וּ/זְרַעְתֶּ֖ם אֶת הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/023.yaml
  text: Then Joseph said to the people[a], “Look, today I have bought you and your land for Pharaoh. Here is seed for you, and you shall sow the land.”
translation:
  language: hi
  text: तब यूसुफ़ ने लोगों से कहा, “देखो, आज मैंने तुम्हें और तुम्हारी भूमि को फ़िरौन के लिए खरीद लिया है। यह रहा तुम्हारे लिए बीज; इसे भूमि में बोओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָעָם
  choice: लोगों
  rationale: यहाँ मिस्र की सामूहिक जनता अभिप्रेत है; ‘लोगों’ सरल और स्वाभाविक सम्बोधन है।
- source_word: הֵן
  choice: देखो
  rationale: यह कण जोर देकर घोषणा की ओर ध्यान खींचता है; ‘देखो’ उसके संकेतात्मक बल को बनाए रखता है।
- source_word: קָנִיתִי
  choice: मोल ले लिया है
  rationale: קנה का सामान्य अर्थ खरीदना अथवा अधिकार में लेना है। अकाल के आर्थिक-सामाजिक लेनदेन में ‘मोल ले लिया’ खरीद और स्वामित्व-हस्तांतरण दोनों को स्पष्ट करता है।
- source_word: אֶתְכֶם
  choice: तुम्हें
  rationale: प्रत्यक्ष कर्म लोगों को स्वयं फ़िरौन के अधिकार/सेवा में आने वाले व्यक्तियों के रूप में निर्दिष्ट करता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: लेनदेन के वर्तमान दिन को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אַדְמַתְכֶם
  choice: तुम्हारी भूमि
  rationale: यहाँ אדמה से लोगों की खेती योग्य ज़मीन अथवा भूमि-सम्पत्ति अभिप्रेत है।
- source_word: לְפַרְעֹה
  choice: फ़िरौन के लिए
  rationale: लामेद बताता है कि यूसुफ़ यह अधिग्रहण फ़िरौन की ओर से और उसके स्वामित्व के लिए कर रहा है।
- source_word: הֵא
  choice: यह लो
  rationale: यह प्रस्तुत वस्तु की ओर संकेत करने वाला कण है; बीज देते समय ‘यह लो’ आधुनिक हिन्दी में जीवंत और स्वाभाविक है।
- source_word: זֶרַע
  choice: बीज
  rationale: यह बोआई के लिए दिए जाने वाले बीज को दर्शाता है, जिसका प्रयोजन अगले क्रियापद से स्पष्ट है।
- source_word: וּזְרַעְתֶּם
  choice: अब तुम ... बीज बोना
  rationale: वाव से जुड़ा पूर्णरूप यहाँ आगे दिए गए निर्देश का कार्य करता है। ‘अब ... बोना’ आदेशात्मक भाव और क्रियाक्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָאֲדָמָה
  choice: भूमि में
  rationale: यह खेती की जाने वाली ज़मीन है। हिन्दी में बीज ‘भूमि में’ बोना अधिक स्वाभाविक है, जबकि अर्थ मूल के अनुरूप रहता है।
theological_decisions:
- issue: लोगों को ‘खरीदने’ की कानूनी-सामाजिक अभिव्यक्ति
  choice: मैंने तुम्हें ... मोल ले लिया है
  alternative: मैंने तुम्हें ... अपने अधिकार में ले लिया है
  rationale: मूल קנה खरीदने और अधिकार में लेने दोनों का अर्थ दे सकता है। निकटवर्ती प्रसंग में धन, पशु और भूमि के बदले लेनदेन होने के कारण खरीद का सीधा अर्थ प्रमुख है; अनुवाद इस कठोर सामाजिक वास्तविकता को नरम नहीं करता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। प्रत्यक्ष कथन में ‘देखो’ और ‘यह लो’ बोलचाल की स्वाभाविकता देते हैं, जबकि ‘भूमि’ और ‘फ़िरौन’ बाइबिलीय कथन के सम्मानपूर्ण स्तर को बनाए रखते हैं।
