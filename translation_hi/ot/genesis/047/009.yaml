reference: Genesis 47:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל פַּרְעֹ֔ה יְמֵי֙ שְׁנֵ֣י מְגוּרַ֔/י שְׁלֹשִׁ֥ים וּ/מְאַ֖ת שָׁנָ֑ה מְעַ֣ט וְ/רָעִ֗ים הָיוּ֙ יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י וְ/לֹ֣א הִשִּׂ֗יגוּ אֶת יְמֵי֙ שְׁנֵי֙ חַיֵּ֣י אֲבֹתַ֔/י בִּ/ימֵ֖י מְגוּרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/009.yaml
  text: And Jacob said to Pharaoh[a], “The days of the years of my sojourning are one hundred thirty years. Few and evil have been the days of the years of my life[b], and they have not attained to the days of the years of the lives of my fathers in the days of their sojourning.”
translation:
  language: hi
  text: और याकूब ने फ़िरौन से कहा, “मेरे परदेशी निवास के वर्ष एक सौ तीस हैं। मेरे जीवन के दिन और वर्ष थोड़े और दुःखभरे रहे हैं, और वे मेरे पूर्वजों के परदेशी निवास के दिनों में उनके जीवन के दिन और वर्षों तक नहीं पहुँचे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְגוּרַי / מְגוּרֵיהֶם
  choice: मेरे परदेशी होकर रहने / वे परदेशी होकर रहे थे
  rationale: यह पद अस्थायी निवासी अथवा परदेशी के रूप में रहने को दर्शाता है। यह अनुवाद कुलपिताओं की ऐतिहासिक परदेशी स्थिति बनाए रखता है और ‘तीर्थयात्रा’ जैसी आध्यात्मिक व्याख्या नहीं जोड़ता।
- source_word: יְמֵי שְׁנֵי
  choice: वर्षों के दिन
  rationale: इब्रानी की जानबूझकर की गई ‘दिन-वर्ष’ पुनरुक्ति को हिंदी में बनाए रखता है, यद्यपि वाक्य को समझने योग्य रखने के लिए संबंधसूचक रचना अपनाई गई है।
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: एक सौ तीस वर्ष
  rationale: आधुनिक मानक हिंदी में संख्या की स्वाभाविक अभिव्यक्ति।
- source_word: מְעַט וְרָעִים
  choice: थोड़े और दुःख भरे
  rationale: מְעַט जीवनकाल की तुलनात्मक अल्पता बताता है; רָעִים यहाँ नैतिक बुराई के बजाय विपत्ति और कष्ट से भरे जीवनानुभव का वर्णन करता है।
- source_word: חַיַּי / חַיֵּי אֲבֹתַי
  choice: मेरे जीवन / मेरे पूर्वजों के जीवन
  rationale: संदर्भ में ये पद जीवन अथवा जीवनकाल को सूचित करते हैं। ‘पूर्वज’ आधुनिक हिंदी में स्पष्ट है और यहाँ अब्राहम तथा इसहाक जैसे पितरों को समेटता है।
- source_word: הִשִּׂיגוּ
  choice: तक नहीं पहुँचे
  rationale: क्रिया के ‘पहुँचना/जा पहुँचना’ अर्थ और याकूब के जीवनकाल के अपने पूर्वजों से कम होने की तुलना को सुरक्षित रखता है।
- source_word: הָיוּ
  choice: रहे हैं
  rationale: याकूब अपने अब तक के जीवन का सार दे रहा है; हिंदी पूर्ण पक्ष इस वर्तमान-संबद्ध पुनरावलोकन को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: कुलपिताओं का परदेशी निवासी के रूप में आत्मवर्णन
  choice: परदेशी होकर रहना
  alternative: तीर्थयात्रा करना
  rationale: मूल शब्द भूमि में अस्थायी अथवा परदेशी निवासी के रूप में रहने पर बल देता है; मुख्य पाठ में बाद की आध्यात्मिक ‘तीर्थयात्रा’ धारणा आरोपित नहीं की गई।
- issue: רָעִים का आशय
  choice: दुःख भरे
  alternative: बुरे
  rationale: संदर्भ याकूब के दिनों की नैतिक दुष्टता नहीं, बल्कि उनके कष्टपूर्ण स्वरूप को बताता है। ‘दुःख भरे’ मूल की नकारात्मक तीव्रता को सामान्य हिंदी में स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक मानक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। मूल इब्रानी की गंभीर ‘दिनों के वर्ष’ शैली को यथासंभव बचाया गया है, पर हिंदी में अत्यधिक कृत्रिम पुनरुक्ति से बचने के लिए अंतिम उपवाक्य को डैश द्वारा स्पष्ट किया गया है।
