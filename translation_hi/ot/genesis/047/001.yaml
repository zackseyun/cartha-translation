source:
  edition: WLC
  text: וַ/יָּבֹ֣א יוֹסֵף֮ וַ/יַּגֵּ֣ד לְ/פַרְעֹה֒ וַ/יֹּ֗אמֶר אָבִ֨/י וְ/אַחַ֜/י וְ/צֹאנָ֤/ם וּ/בְקָרָ/ם֙ וְ/כָל אֲשֶׁ֣ר לָ/הֶ֔ם בָּ֖אוּ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנָּ֖/ם בְּ/אֶ֥רֶץ גֹּֽשֶׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/001.yaml
  text: Then Joseph went in and told Pharaoh[a], “My father and my brothers, with their flocks and their herds and all that they have, have come from the land of Canaan; and behold[c][b], they are in the land of Goshen.”
translation:
  language: hi
  text: तब यूसुफ ने फ़िरौन के पास जाकर उसे बताया, “मेरे पिता और मेरे भाई अपनी भेड़-बकरियों, गाय-बैलों और अपनी सारी संपत्ति के साथ कनान देश से आ गए हैं; और देखिए, वे गोशेन प्रदेश में हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: के पास जाकर
  rationale: בוא का अर्थ आना, जाना या प्रवेश करना हो सकता है। राजदरबार के प्रसंग में यह अभिव्यक्ति स्वाभाविक रूप से बताती है कि यूसुफ फ़िरौन की उपस्थिति में गया।
- source_word: וַיַּגֵּד לְפַרְעֹה וַיֹּאמֶר
  choice: फ़िरौन के पास जाकर उसे बताया
  rationale: दो क्रमिक इब्रानी क्रियाएँ सूचना देने और फिर कथन आरंभ करने को व्यक्त करती हैं। हिन्दी में एक ही स्वाभाविक वाक्यांश पुनरुक्ति से बचते हुए दोनों का आशय देता है।
- source_word: וְצֹאנָם וּבְקָרָם
  choice: अपनी भेड़-बकरियों, गाय-बैलों
  rationale: צאן छोटे पालतू पशुओं, विशेषकर भेड़-बकरियों, और בקר बड़े मवेशियों को दर्शाता है। यह चयन दोनों वर्गों का भेद सामान्य हिन्दी में स्पष्ट रखता है।
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: अपनी सारी संपत्ति
  rationale: शाब्दिक अर्थ ‘जो कुछ उनका है’ है; ‘सारी संपत्ति’ संदर्भ में स्वाभाविक और व्यापक है।
- source_word: בָּאוּ מֵאֶרֶץ כְּנָעַן
  choice: कनान देश से आ गए हैं
  rationale: इब्रानी पूर्ण क्रिया हाल में पूरी हुई यात्रा और उसके वर्तमान परिणाम—उनके अब यहाँ होने—दोनों को व्यक्त कर सकती है। हिन्दी का ‘आ गए हैं’ इसे सहज रूप से संप्रेषित करता है।
- source_word: וְהִנָּם
  choice: और देखिए, वे
  rationale: הנה ध्यान वर्तमान स्थिति की ओर खींचता है। फ़िरौन को संबोधित करते हुए आदरसूचक ‘देखिए’ इसका संकेतात्मक बल बनाए रखता है।
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: गोशेन प्रदेश में
  rationale: אֶרֶץ यहाँ गोशेन नामक भौगोलिक क्षेत्र को सूचित करता है; ‘प्रदेश’ आधुनिक हिन्दी में ‘भूमि’ की अपेक्षा अधिक स्वाभाविक है।
