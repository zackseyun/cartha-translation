translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। फ़िरौन के प्रति प्रत्यक्ष संबोधन में आदरसूचक ‘देखिए’ रखा गया है। इब्रानी कथात्मक पुनरुक्ति को अर्थ खोए बिना स्वाभाविक हिन्दी में समेटा गया है।
