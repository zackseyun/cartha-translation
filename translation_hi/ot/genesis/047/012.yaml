  text: וַ/יְכַלְכֵּ֤ל יוֹסֵף֙ אֶת אָבִ֣י/ו וְ/אֶת אֶחָ֔י/ו וְ/אֵ֖ת כָּל בֵּ֣ית אָבִ֑י/ו לֶ֖חֶם לְ/פִ֥י הַ/טָּֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/012.yaml
  text: And Joseph provided his father[a], his brothers, and all his father's household with food[b], according to the number of their little ones.
translation:
  language: hi
  text: और यूसुफ अपने पिता, अपने भाइयों और अपने पिता के सारे घराने को उनके बाल-बच्चों की संख्या के अनुसार भोजन[a] देता रहा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “रोटी”; यहाँ यह शब्द व्यापक अर्थ में भोजन या खाद्य-सामग्री को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बाल-बच्चों के मुँह के अनुसार”; यह मुहावरा उनकी संख्या या उनकी आवश्यकताओं के अनुपात में देने का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלְכֵּל
  choice: भरण-पोषण करता रहा
  rationale: पिएल रूप यहाँ अकाल के समय सामग्री देकर लगातार संभालने या जीविका चलाने का भाव व्यक्त करता है। ‘करता रहा’ इस जारी व्यवस्था को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: לֶחֶם
  choice: भोजन
  rationale: शब्द का मूल अर्थ ‘रोटी’ है, पर इस अकाल-संदर्भ में इसका अर्थ व्यापक खाद्य-सामग्री है; इसलिए मुख्य पाठ में ‘भोजन’ अधिक स्वाभाविक है और शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: כָּל בֵּית אָבִיו
  choice: अपने पिता के पूरे घराने
  rationale: यहाँ ‘घर’ भवन नहीं, बल्कि पिता से संबंधित पूरा पारिवारिक समुदाय है। ‘घराना’ इस सामाजिक इकाई को स्पष्ट करता है।
- source_word: לְפִי
  choice: की संख्या के अनुसार
  rationale: इस पदबंध का शाब्दिक रूप ‘के मुँह के अनुसार’ है, पर मुहावरे में यह मात्रा, अनुपात या गिनती के अनुसार वितरण बताता है।
- source_word: הַטָּף
  choice: उनके बाल-बच्चों
  rationale: यह शब्द परिवार के छोटे बच्चों या आश्रित बालकों को सूचित करता है। ‘बाल-बच्चे’ आधुनिक हिन्दी में स्वाभाविक पारिवारिक अभिव्यक्ति है।
- source_word: אָבִיו ... אֶחָיו
  choice: अपने पिता, अपने भाइयों
  rationale: दोनों संबंधवाचक शब्दों का सीधा और संदर्भानुकूल अनुवाद किया गया है; यहाँ ‘भाई’ यूसुफ के पुरुष सहोदरों को सूचित करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भरण-पोषण करता रहा’ क्रिया की निरंतरता को और ‘घराना’ पारिवारिक समुदाय को व्यक्त करता है। संख्या और आवश्यकता के बीच हिब्रू मुहावरे की संभावित अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
