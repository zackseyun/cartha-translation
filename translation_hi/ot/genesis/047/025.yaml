  yaml_path: translation/ot/genesis/047/025.yaml
  text: And they said[a], “You have kept us alive. May we find favor in the eyes of my lord, and we will be servants to Pharaoh.”
translation:
  language: hi
  text: उन्होंने कहा, “आपने हमें जीवित रखा है। मेरे स्वामी की दृष्टि में हम पर कृपा हो, और हम फ़िरौन के दास होंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: उन्होंने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाते हुए प्रत्यक्ष कथन आरम्भ करता है; आधुनिक हिन्दी में ‘उन्होंने कहा’ स्वाभाविक है।
- source_word: הֶחֱיִתָנוּ
  choice: आपने हमें जीवित रखा है
  rationale: חיה के हिफ़ील रूप का कारणवाचक अर्थ ‘जीवित रखना’ है; यह आध्यात्मिक या सैनिक उद्धार का अतिरिक्त भाव जोड़े बिना मूल अर्थ देता है।
- source_word: נִמְצָא חֵן
  choice: हम अनुग्रह पाएँ
  rationale: यहाँ अपूर्ण रूप विनम्र इच्छा या निवेदन व्यक्त करता है। ‘पाएँ’ उस भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּעֵינֵי אֲדֹנִי
  choice: मेरे स्वामी की दृष्टि में
  rationale: यह कृपा प्राप्त करने का हिब्रानी मुहावरा है। ‘दृष्टि में’ मुहावरे की छवि को सुरक्षित रखता है और एकवचन प्रत्यय को ‘मेरे स्वामी’ से व्यक्त करता है।
- source_word: וְהָיִינוּ
  choice: और हम ... होंगे
  rationale: संदर्भ में यह उनकी परिणामी प्रतिबद्धता बताता है; हिन्दी का भविष्यकाल इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲבָדִים לְפַרְעֹה
  choice: फ़िरौन के दास
  rationale: इस आर्थिक प्रसंग में עֲבָדִים बँधी हुई अधीन सेवा को दर्शाता है। ‘दास’ इस स्थिति को ‘सेवक’ की अपेक्षा अधिक ठीक रूप से बनाए रखता है।
