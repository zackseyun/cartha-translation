  text: וַ/יֵּ֧שֶׁב יִשְׂרָאֵ֛ל בְּ/אֶ֥רֶץ מִצְרַ֖יִם בְּ/אֶ֣רֶץ גֹּ֑שֶׁן וַ/יֵּאָחֲז֣וּ בָ֔/הּ וַ/יִּפְר֥וּ וַ/יִּרְבּ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/027.yaml
  text: So Israel settled in the land of Egypt[a], in the land of Goshen, and they gained possessions in it and were fruitful and multiplied greatly.
translation:
  language: hi
  text: इस्राएल मिस्र देश में, गोशेन प्रदेश में, बस गया। उन्होंने वहाँ संपत्ति प्राप्त की[a], और वे फले-फूले और बहुत बढ़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘उन्होंने वहाँ अधिकार प्राप्त किया’ या ‘वे वहाँ दृढ़ता से स्थापित हो गए’ भी हो सकता है। इब्रानी क्रिया किसी भूभाग में हिस्सा या अधिकार पाने अथवा वहाँ स्थायी रूप से स्थापित होने का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: बस गया
  rationale: ישׁב यहाँ केवल रहने नहीं, बल्कि स्थायी रूप से बसने का भाव देता है। एकवचन रूप को बनाए रखने के लिए ‘बस गया’ चुना गया है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ में ‘इस्राएल’ नाम है, ‘याकूब’ या ‘इस्राएली’ नहीं। इसे बनाए रखने से कुलपिता और उसके परिवार के प्रतिनिधिक संबंध का भाव सुरक्षित रहता है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश
  rationale: इब्रानी पदबंध में ‘देश/भूमि’ स्पष्ट रूप से है; ‘मिस्र देश’ आधुनिक हिन्दी में स्वाभाविक रहते हुए क्षेत्रीय बल को बनाए रखता है।
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: गोशेन प्रदेश
  rationale: गोशेन मिस्र के भीतर एक निर्धारित भूभाग है। ‘प्रदेश’ इब्रानी אֶרֶץ का संदर्भानुकूल और स्वाभाविक हिन्दी रूप है।
- source_word: וַיֵּאָחֲזוּ בָהּ
  choice: उन्होंने वहाँ भूमि-जायदाद प्राप्त की
  rationale: अर्थ यहाँ उस देश में भू-संपत्ति या स्थायी अधिकार प्राप्त करने की ओर संकेत करता है। क्रिया की व्यापक अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיִּפְרוּ
  choice: फले-फूले
  rationale: यह अभिव्यक्ति उत्पत्ति में बार-बार आने वाले फलवन्त होने के आशीष-विषय को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: וַיִּרְבּוּ מְאֹד
  choice: बहुत बढ़ गए
  rationale: רבה और מְאֹד मिलकर संख्या में अत्यधिक वृद्धि व्यक्त करते हैं। ‘बहुत बढ़ गए’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ‘इस्राएल’ का प्रतिनिधिक एकवचन और उसके बाद बहुवचन
  choice: आरम्भ में ‘इस्राएल ... बस गया’ और आगे ‘उन्होंने ... वे’ रखा गया है।
  alternative: पूरे वाक्य में ‘इस्राएली’ अथवा ‘याकूब और उसका परिवार’ कहना।
  rationale: इब्रानी पाठ एकवचन ‘इस्राएल’ से आरम्भ होकर उसके घराने के लिए बहुवचन क्रियाओं पर जाता है। यह परिवर्तन कुलपिता के अपने वंश/परिवार का प्रतिनिधि होने की अर्थपूर्ण अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘फले-फूले’ उत्पत्ति की आशीष-संबंधी शब्दावली की प्रतिध्वनि बनाए रखता है; एकवचन से बहुवचन का मूल-पाठीय बदलाव जानबूझकर सुरक्षित रखा गया है।
