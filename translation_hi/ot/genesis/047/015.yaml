source:
  edition: WLC
  text: וַ/יִּתֹּ֣ם הַ/כֶּ֗סֶף מֵ/אֶ֣רֶץ מִצְרַיִם֮ וּ/מֵ/אֶ֣רֶץ כְּנַעַן֒ וַ/יָּבֹאוּ֩ כָל מִצְרַ֨יִם אֶל יוֹסֵ֤ף לֵ/אמֹר֙ הָֽבָ/ה לָּ֣/נוּ לֶ֔חֶם וְ/לָ֥/מָּה נָמ֖וּת נֶגְדֶּ֑/ךָ כִּ֥י אָפֵ֖ס כָּֽסֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/015.yaml
  text: When the money from the land of Egypt and from the land of Canaan was gone[a], all the Egyptians came to Joseph, saying, "Give us bread[c][b]. Why should we die before you? For the money is gone."
translation:
  language: hi
  text: जब मिस्र देश और कनान देश का सारा पैसा समाप्त हो गया[a], तब सभी मिस्री[c] यूसुफ के पास आकर कहने लगे, “हमें रोटी[b] दीजिए। हम आपके सामने क्यों मरें? क्योंकि पैसा समाप्त हो गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चाँदी समाप्त हो गई”; इब्रानी शब्द כֶּסֶף का अर्थ “चाँदी” या “पैसा” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “रोटी” अकाल के संदर्भ में व्यापक रूप से भोजन को भी दर्शा सकती है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “सारा मिस्र यूसुफ के पास आया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֹּם
  choice: समाप्त हो गया
  rationale: תמם यहाँ किसी उपलब्ध भंडार के चुक जाने को व्यक्त करता है। ‘समाप्त हो गया’ स्वाभाविक हिन्दी है और आरम्भ तथा अन्त में प्रयुक्त संबंधित कथनों की पुनरावृत्ति बनाए रखता है।
- source_word: הַכֶּסֶף / כָּסֶף
  choice: पैसा
  rationale: כֶּסֶף का अर्थ ‘चाँदी’ या ‘पैसा’ हो सकता है। अकाल के दौरान अनाज खरीदने के संदर्भ में ‘पैसा’ अभिप्रेत अर्थ को स्पष्ट करता है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: מֵאֶרֶץ מִצְרַיִם וּמֵאֶרֶץ כְּנַעַן
  choice: मिस्र देश और कनान देश का सारा पैसा
  rationale: מן स्रोत या किसी स्थान से वस्तु के समाप्त हो जाने का भाव देता है। हिन्दी में ‘देश का सारा पैसा समाप्त हो गया’ इस आशय को ‘देश से पैसा समाप्त हुआ’ की अपेक्षा अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיָּבֹאוּ כָל מִצְרַיִם
  choice: तब सभी मिस्री ... आकर
  rationale: इब्रानी का शाब्दिक रूप ‘सारा मिस्र आया’ है, पर सामूहिक संज्ञा यहाँ मिस्रवासियों को दर्शाती है। ‘सभी मिस्री’ आधुनिक हिन्दी में स्पष्ट है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: לֵאמֹר
  choice: कहने लगे
  rationale: यह प्रत्यक्ष कथन का परिचय देता है। ‘आकर कहने लगे’ हिन्दी में कथात्मक प्रवाह को स्वाभाविक रखता है।
- source_word: הָבָה לָּנוּ לֶחֶם
  choice: हमें रोटी दीजिए
  rationale: הָבָה לָּנוּ देने की प्रबल विनती है। संबोधन का आदरपूर्ण बहुवचन ‘दीजिए’ सामाजिक प्रसंग में स्वाभाविक है। לֶחֶם का मूल अर्थ ‘रोटी’ रखा गया है, जबकि व्यापक अर्थ ‘भोजन’ पादटिप्पणी में बताया गया है।
- source_word: וְלָמָּה נָמוּת נֶגְדֶּךָ
  choice: हम आपके सामने क्यों मरें?
  rationale: नֶגְדֶּךָ का अर्थ ‘तुम्हारे सामने/तुम्हारी उपस्थिति में’ है। ‘आपके सामने’ मूल की प्रत्यक्षता और विनती का भाव बनाए रखता है, बिना ‘आँखों के सामने’ जैसे निहित विस्तार को मुख्य पाठ में जोड़ने के।
- source_word: כִּי אָפֵס כָּסֶף
  choice: क्योंकि पैसा समाप्त हो गया है
  rationale: אָפֵס यहाँ धन के न रह जाने को दर्शाता है। ‘समाप्त हो गया है’ कारण को स्पष्ट करता और आरम्भिक कथन की प्रतिध्वनि बनाए रखता है।
