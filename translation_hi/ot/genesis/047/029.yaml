review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the approach of Israel’s death, the request involving the oath gesture, the appeal for hesed ve’emet, and the plea not to be buried in Egypt. However, “यदि मुझ पर तेरी कृपा हुई हो” shifts the Hebrew conventional formula from Jacob’s finding favor with Yosef to Yosef’s favor resting upon Jacob. A small revision preserves the direction and idiomatic force more closely.
  naturalness: The Hindi is generally clear, modern, and appropriately dignified. “यदि मैं तेरी दृष्टि में अनुग्रह पाया हूँ” is a familiar, natural biblical-register Hindi rendering that better represents the source expression without sounding unduly archaic. The rest of the wording is fluent.
  terminology: “इस्राएल,” “योसेफ़,” “मिस्र,” and “दफ़न” are suitable. “अटल प्रेम और विश्वासयोग्यता” communicates the loyal and dependable force of חֶסֶד וֶאֱמֶת without imposing a doctrinal interpretation. The cultural footnote appropriately explains, rather than replaces, the concrete oath gesture.
  issues:
  - severity: medium
    issue: The favor formula reverses the source expression’s perspective.
    rationale: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ literally means “if I have found favor in your eyes.” “यदि मुझ पर तेरी कृपा हुई हो” can mean “if your grace has come upon me,” which is close in sense but does not retain the idiom’s direction. “यदि मैं तेरी दृष्टि में अनुग्रह पाया हूँ” is more precise and natural in this register.
  - severity: low
    issue: Footnote b’s proposed alternative “करुणा और सच्चाई” weakens the loyal-obligational sense of חֶסֶד.
    rationale: “करुणा” may suggest pity or compassion, whereas the context calls for dependable loyal kindness. “निष्ठावान प्रेम और सच्चाई” is a closer alternative.
