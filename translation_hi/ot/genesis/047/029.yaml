  text: וַ/יִּקְרְב֣וּ יְמֵֽי יִשְׂרָאֵ֘ל לָ/מוּת֒ וַ/יִּקְרָ֣א לִ/בְנ֣/וֹ לְ/יוֹסֵ֗ף וַ/יֹּ֤אמֶר ל/וֹ֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֣חַת יְרֵכִ֑/י וְ/עָשִׂ֤יתָ עִמָּדִ/י֙ חֶ֣סֶד וֶ/אֱמֶ֔ת אַל נָ֥א תִקְבְּרֵ֖/נִי בְּ/מִצְרָֽיִם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/029.yaml
  text: When the days of Israel drew near for him to die[a], he called his son Yosef and said to him, “If now I have found favor in your eyes, please put your hand under my thigh, and deal with me in steadfast love and faithfulness[b]. Please do not bury me in Egypt.”
translation:
  language: hi
  text: जब इस्राएल के मरने का समय निकट आया, तब उसने अपने पुत्र योसेफ़ को बुलाकर कहा, “यदि मैं तेरी दृष्टि में अनुग्रह पाया हूँ, तो कृपया अपना हाथ मेरी जाँघ के नीचे रख[a] और मेरे प्रति अटल प्रेम और विश्वासयोग्यता दिखा[b]। कृपया मुझे मिस्र में दफ़न न करना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपना हाथ मेरी जाँघ के नीचे रख” कुलपिताओं के वृत्तांतों में गंभीर शपथ लेने की एक रीति की ओर संकेत करता है; उत्पत्ति 24:2 से तुलना करें।
    reason: cultural_note
  - marker: b
    text: या “मेरे प्रति निष्ठावान प्रेम और सच्चाई दिखा।” इब्रानी पदबंध חֶסֶד וֶאֱמֶת में निष्ठावान, स्थिर प्रेम और भरोसेमंद सच्चाई का संयुक्त भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי יִשְׂרָאֵל לָמוּת
  choice: जब इस्राएल के मरने का समय निकट आया
  rationale: इब्रानी मुहावरे में इस्राएल के ‘दिनों’ के मरने के लिए निकट आने की बात है। शाब्दिक हिन्दी अस्पष्ट होती, इसलिए उसके आशय को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ में ‘याकूब’ नहीं, ‘इस्राएल’ नाम है; उसी नाम को बनाए रखा गया है।
- source_word: לִבְנוֹ לְיוֹסֵף
  choice: अपने पुत्र योसेफ़ को
  rationale: संबंध और नाम दोनों स्पष्ट रखे गए हैं; ‘योसेफ़’ इब्रानी नाम के निकट देवनागरी लिप्यंतरण है।
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: यदि मुझ पर तेरी कृपा हुई हो
  rationale: यह विनम्र निवेदन का इब्रानी मुहावरा है। हिन्दी में ‘तेरी आँखों में अनुग्रह पाया हो’ कृत्रिम लगता; चुना हुआ रूप अर्थ और विनम्रता दोनों रखता है।
- source_word: שִׂים נָא יָדְךָ תַּחַת יְרֵכִי
  choice: कृपया अपना हाथ मेरी जाँघ के नीचे रख
  rationale: नָא की विनयपूर्ण शक्ति ‘कृपया’ से व्यक्त की गई है और सांस्कृतिक रूप से विशिष्ट शपथ-संकेत को मूल की तरह ठोस रूप में रखा गया है।
- source_word: וְעָשִׂיתָ עִמָּדִי חֶסֶד וֶאֱמֶת
  choice: मेरे प्रति अटल प्रेम और विश्वासयोग्यता दिखा
  rationale: חֶסֶד में निष्ठावान और स्थिर प्रेम का भाव है, जबकि אֱמֶת यहाँ भरोसेमंद सच्चाई अथवा विश्वासयोग्यता को सूचित करता है। यह रूप जोड़ी के संबंधपरक और दायित्वपूर्ण दोनों पहलुओं को सहज हिन्दी में रखता है।
- source_word: אַל נָא תִקְבְּרֵנִי בְּמִצְרָיִם
  choice: कृपया मुझे मिस्र में दफ़न न करना
  rationale: निषेध के साथ נָא एक विनम्र किंतु गंभीर निवेदन बनाता है। ‘दफ़न न करना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת का अर्थ
  choice: अटल प्रेम और विश्वासयोग्यता
  alternative: करुणा और सच्चाई; निष्ठावान प्रेम और सच्चाई
  rationale: इस पारिवारिक शपथ के प्रसंग में यह युग्म केवल भावना नहीं, बल्कि निष्ठापूर्ण और भरोसेमंद आचरण माँगता है। मुख्य पाठ में अर्थ को स्वाभाविक रखा गया है और वास्तविक शाब्दिक विस्तार पादटिप्पणी में बताया गया है।
- issue: ‘हाथ जाँघ के नीचे’ रखने की रीति
  choice: मुख्य पाठ में ठोस अभिव्यक्ति को बनाए रखकर पादटिप्पणी में समझाना
  alternative: इसे केवल ‘मुझसे शपथ खा’ कहकर भावानुवाद करना
  rationale: मूल कथन शपथ की सांस्कृतिक रीति को दृश्य रूप में प्रस्तुत करता है। उसे हटाने से मूल की विशिष्टता खो जाती, इसलिए व्याख्या पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु पारिवारिक संबोधन के अनुरूप एकवचन ‘तेरी/रख/करना’ रखा गया है। शैली गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘दफ़न’ प्रचलित आधुनिक शब्द है; सांस्कृतिक शपथ-संकेत को सरल बनाने के बजाय पादटिप्पणी से स्पष्ट किया गया है।
