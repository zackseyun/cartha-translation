base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/004.yaml
  text: They said to Pharaoh[a], “We have come to sojourn in the land, because there is no pasture for the flocks that belong to your servants, for the famine is severe in the land of Canaan. And now, please let your servants dwell in the land of Goshen.”
translation:
  language: hi
  text: उन्होंने फ़िरौन से कहा, “हम इस देश में परदेशी बनकर रहने आए हैं[a], क्योंकि आपके सेवकों की भेड़-बकरियों के लिए कोई चरागाह नहीं है; कनान देश में अकाल बहुत भयंकर है। और अब, कृपया अपने सेवकों को गोशेन प्रदेश में रहने दीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुछ समय के लिए विदेशी निवासी बनकर रहने आए हैं।”
    reason: לָגוּר में अस्थायी निवास और विदेशी निवासी के रूप में रहने—दोनों का भाव हो सकता है; वैकल्पिक अनुवाद इस संयुक्त अर्थ को स्पष्ट करता है।
lexical_decisions:
- source_word: לָגוּר
  choice: परदेशी बनकर रहने
  rationale: यह क्रिया किसी स्थान में विदेशी अथवा अस्थायी निवासी के रूप में रहने का भाव रखती है; यह अनुवाद केवल सामान्य रूप से ‘रहने’ या स्थायी रूप से ‘बसने’ की अपेक्षा उस भाव को बेहतर सुरक्षित रखता है।
- source_word: בָּאָרֶץ
  choice: इस देश में
  rationale: यहाँ אֶרֶץ मिस्र के भूभाग अथवा देश को सूचित करता है; प्रसंग के कारण हिन्दी में ‘इस देश में’ स्वाभाविक और स्पष्ट है।
- source_word: מִרְעֶה
  choice: चरागाह
  rationale: संज्ञा पशुओं के चरने की जगह को दर्शाती है; ‘चरागाह’ इसका संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: לַצֹּאן
  choice: भेड़-बकरियों के लिए
  rationale: צֹאן सामूहिक रूप से छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, को दर्शाता है; हिन्दी में ‘भेड़-बकरियाँ’ इस अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: אֲשֶׁר לַעֲבָדֶיךָ
  choice: आपके सेवकों की
  rationale: यह पदबंध स्वामित्व बताता है और फ़िरौन के सामने विनम्र आत्म-संबोधन को बनाए रखता है।
- source_word: כָבֵד הָרָעָב
  choice: अकाल बहुत भयंकर है
  rationale: כָבֵד का मूल भाव ‘भारी’ है, पर अकाल के साथ यह उसकी प्रचंडता या गंभीरता बताता है; ‘बहुत भयंकर’ आधुनिक हिन्दी में यही अर्थ स्वाभाविक रूप से देता है।
- source_word: יֵשְׁבוּ נָא
  choice: कृपया ... रहने दीजिए
  rationale: आज्ञार्थक/निवेदनात्मक रूप के साथ נָא विनम्र प्रार्थना व्यक्त करता है; ‘कृपया ... रहने दीजिए’ उस विनय को स्वाभाविक हिन्दी में रखता है और स्थायी बसावट का अनावश्यक संकेत नहीं देता।
- source_word: עֲבָדֶיךָ
  choice: आपके सेवकों
  rationale: यहाँ दरबारी प्रसंग में वक्ता स्वयं को फ़िरौन के अधीन विनम्रता से प्रस्तुत करते हैं; इसलिए ‘सेवकों’ उपयुक्त है, जबकि ‘दासों’ से बंधुआ स्थिति पर अनावश्यक बल पड़ सकता है।
- source_word: אֶרֶץ גֹּשֶׁן
  choice: गोशेन प्रदेश
  rationale: यह भौगोलिक क्षेत्र का स्पष्ट और स्वाभाविक हिन्दी नाम है; ‘प्रदेश’ इब्रानी में व्यक्त भूभाग के भाव को बनाए रखता है।
