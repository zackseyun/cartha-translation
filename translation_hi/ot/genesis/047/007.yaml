base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/007.yaml
  text: Then Joseph brought in Jacob his father and presented him before Pharaoh[b][a], and Jacob blessed Pharaoh.
translation:
  language: hi
  text: तब यूसुफ अपने पिता याकूब को भीतर ले आया और उसे फ़िरौन के सामने उपस्थित किया[a], और याकूब ने फ़िरौन को आशीर्वाद दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसे फ़िरौन के सामने खड़ा किया।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “आशीर्वाद दिया” केवल शिष्ट अभिवादन नहीं, बल्कि औपचारिक रूप से बोले गए आशीर्वाद को भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: भीतर ले आया
  rationale: בוא के हिफ़ील रूप में किसी को आने देने या ले आने का कारक भाव है। राज-दरबार के प्रसंग में ‘भीतर ले आया’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָבִיו
  choice: अपने पिता
  rationale: तीसरे पुरुष एकवचन पुल्लिंग प्रत्यय यूसुफ की ओर संकेत करता है। हिन्दी में कर्ता यूसुफ के साथ ‘अपने पिता’ स्वाभाविक और असंदिग्ध है।
- source_word: וַיַּעֲמִדֵהוּ לִפְנֵי
  choice: उसे … के सामने उपस्थित किया
  rationale: עמד के हिफ़ील का शाब्दिक अर्थ ‘उसे खड़ा किया’ है; राजकीय भेंट के संदर्भ में ‘उपस्थित किया’ औपचारिक प्रस्तुति का भाव स्वाभाविक रूप से देता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: לִפְנֵי פַרְעֹה
  choice: फ़िरौन के सामने
  rationale: לִפְנֵי का सामान्य अर्थ ‘के सामने/की उपस्थिति में’ है। ‘फ़िरौन के सामने’ संक्षिप्त और सहज है।
- source_word: וַיְבָרֶךְ
  choice: आशीर्वाद दिया
  rationale: ברך का सामान्य अर्थ ‘आशीर्वाद देना’ है। इसे केवल शिष्ट अभिवादन में कमज़ोर न करके मूल पाठ का आश्चर्य और धर्मवैचारिक तनाव बनाए रखा गया है।
- source_word: פַרְעֹה
  choice: फ़िरौन
  rationale: मिस्र के राजा की उपाधि के लिए प्रचलित मानक हिन्दी रूप।
- source_word: וַ
  choice: तब / और
  rationale: क्रमिक वाव कथा को आगे बढ़ाता है। आरंभ में ‘तब’ और अगले खंड में ‘और’ आधुनिक हिन्दी में क्रम और वाक्य-संबंध दोनों स्पष्ट रखते हैं।
theological_decisions:
- issue: फ़िरौन के प्रति याकूब की क्रिया का अर्थ
  choice: याकूब ने वास्तव में फ़िरौन को आशीर्वाद दिया
  alternative: याकूब ने केवल शिष्टतापूर्वक फ़िरौन का अभिवादन किया
  rationale: ברך को उसके सामान्य अर्थ ‘आशीर्वाद देना’ में लेना सबसे सीधा है। इस प्रकार कुलपिता द्वारा महान राजा को आशीर्वाद देने का पाठगत तनाव बना रहता है; संभावित अभिवादन-संबंधी छाया को मुख्य अनुवाद पर हावी नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘उपस्थित किया’ राजकीय भेंट का औपचारिक प्रसंग व्यक्त करता है; ‘आशीर्वाद दिया’ मूल क्रिया का स्पष्ट अर्थ और उसका धर्मवैचारिक तनाव बनाए रखता है।
