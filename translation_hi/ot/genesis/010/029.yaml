  text: Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: hi
  text: ओपीर, हवीला और योबाब। ये सभी योक्तान के पुत्र[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वंशज।” वंशावलियों में हिब्रू शब्द “पुत्र” कभी-कभी अधिक व्यापक अर्थ रख सकता है, पर यहाँ इसका सबसे स्वाभाविक संकेत अभी-अभी गिनाए गए पुत्रों की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: और (केवल अंतिम नाम से पहले); कर्म-चिह्न का अलग अनुवाद नहीं
  rationale: बार-बार आया אֵת पिछले पद से जारी वंशावली-सूची में प्रत्येक नाम को प्रत्यक्ष कर्म के रूप में चिह्नित करता है। हिन्दी में इसका अलग शब्द नहीं रखा जाता; सूची को अल्पविराम और अंतिम नाम से पहले ‘और’ द्वारा स्वाभाविक बनाया गया है।
- source_word: אוֹפִר
  choice: ओपीर
  rationale: व्यक्तिवाचक नाम का मूल हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: חֲוִילָה
  choice: हवीला
  rationale: व्यक्तिवाचक नाम का मूल हिब्रू रूप के निकट देवनागरी लिप्यंतरण।
- source_word: יוֹבָב
  choice: योबाब
  rationale: व्यक्तिवाचक नाम का मूल हिब्रू रूप के निकट देवनागरी लिप्यंतरण।
- source_word: כָּל אֵלֶּה
  choice: ये सभी
  rationale: सूची का सार प्रस्तुत करने वाले हिब्रू पदबंध का संक्षिप्त और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: בְּנֵי
  choice: पुत्र
  rationale: वंशावली में यह शब्द कभी व्यापक अर्थ में ‘वंशज’ हो सकता है, पर यहाँ अभी-अभी गिनाए गए पुरुष नामों के लिए ‘पुत्र’ सबसे स्वाभाविक और निकट अर्थ है।
- source_word: יָקְטָן
  choice: योक्तान
  rationale: व्यक्तिवाचक नाम का हिब्रू व्यंजन-रूप के निकट देवनागरी लिप्यंतरण।
theological_decisions:
- issue: בְּנֵי का वंशावलीगत विस्तार
  choice: मुख्य पाठ में ‘पुत्र’
  alternative: ‘वंशज’
  rationale: तात्कालिक संदर्भ सीधे नामित पुरुष संतानों की सूची है, इसलिए संकीर्ण अर्थ मुख्य पाठ में उचित है; हिब्रू शब्द की संभावित व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली। नाम मूल हिब्रू के निकट लिप्यंतरित हैं; वाक्य-क्रम हिन्दी की स्वाभाविक अभिव्यक्ति के अनुसार रखा गया है।
