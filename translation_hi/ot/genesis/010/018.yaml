  yaml_path: translation/ot/genesis/010/018.yaml
  text: and the Arvadites[a], the Zemarites, and the Hamathites. Afterward the clans of the Canaanites were scattered.
translation:
  language: hi
  text: और अरवदी, समारी और हमाती लोग। इसके बाद कनानियों[a] के कुल तितर-बितर हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में “कनानी”। हिब्रू में एकवचन जातिवाचक शब्द पूरे कनानी जनसमूह के लिए सामूहिक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְוָדִי
  choice: अरवदी लोग
  rationale: यह एकवचन जातिवाचक रूप है, पर राष्ट्रों की सूची में सामूहिक रूप से अरवद के लोगों को दर्शाता है; हिंदी में ‘लोग’ जोड़ने से अर्थ स्वाभाविक और स्पष्ट होता है।
- source_word: הַצְּמָרִי
  choice: समारी
  rationale: आस-पास के जातिवाचक नामों की तरह यह भी समार से जुड़े जनसमूह का सामूहिक नाम है।
- source_word: הַחֲמָתִי
  choice: हमाती
  rationale: यह हमात से जुड़े लोगों का सामूहिक जातिवाचक नाम है; प्रचलित हिंदी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: וְאַחַר
  choice: इसके बाद
  rationale: यह सूचीबद्ध जनसमूहों के बाद घटित फैलाव का समयक्रम स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: נָפֹצוּ
  choice: तितर-बितर हो गए
  rationale: निफ़अल रूप बिखरने या अलग-अलग फैल जाने की परिणामी अवस्था बताता है; यह अनुवाद उस भाव को बनाए रखता है।
- source_word: מִשְׁפְּחוֹת
  choice: कुल
  rationale: वंशावली और जातीय संदर्भ में यह केवल छोटे परिवारों के बजाय व्यापक रिश्तेदारी-आधारित समूहों को दर्शाता है; हिंदी में ‘कुल’ इस संदर्भ के अनुकूल है।
- source_word: הַכְּנַעֲנִי
  choice: कनानियों
  rationale: हिब्रू रूप व्याकरणतः एकवचन जातिवाचक है, किंतु यहाँ पूरे कनानी जनसमूह के लिए सामूहिक अर्थ में प्रयुक्त हुआ है; हिंदी बहुवचन अर्थ स्पष्ट करता है।
