  text: וּ/בְנֵ֖י חָ֑ם כּ֥וּשׁ וּ/מִצְרַ֖יִם וּ/פ֥וּט וּ/כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/006.yaml
  text: 'And the sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: hi
  text: 'और हाम के पुत्र ये थे: कूश, मिस्राइम[a], पूत[b] और कनान।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी नाम “मिस्राइम” है; अनेक अनुवाद इसे “मिस्र” लिखते हैं। इस वंशावली में इसे किसी पूर्वज के व्यक्तिगत नाम के रूप में रखा गया है।
    reason: alternative_reading
  - marker: b
    text: “पूत” को कुछ पुराने अनुवादों में “फूत” भी लिखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: और ... के पुत्र ये थे
  rationale: वाव को वंशावली की निरंतरता दिखाने के लिए “और” से व्यक्त किया गया है। संबंधवाचक बहुवचन בְנֵי का औपचारिक और स्वाभाविक हिन्दी रूप “के पुत्र” रखा गया है; सूची आरम्भ करने के लिए “ये थे” जोड़ा गया है।
- source_word: חָם
  choice: हाम
  rationale: इब्रानी व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: כּוּשׁ
  choice: कूश
  rationale: इब्रानी नाम का निकट और हिन्दी में प्रचलित लिप्यंतरण।
- source_word: וּ/מִצְרַיִם
  choice: मिस्राइम[a]
  rationale: यहाँ वंशावली में पूर्वज के नाम के रूप में प्रयुक्त होने के कारण इसे देशवाचक “मिस्र” में बदलने के बजाय व्यक्तिनाम के रूप में लिप्यंतरित किया गया है।
- source_word: וּ/פוּט
  choice: पूत[b]
  rationale: इब्रानी פּוּט का ध्वन्यात्मक हिन्दी लिप्यंतरण; वैकल्पिक पारंपरिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: וּ/כְנָעַן
  choice: और कनान
  rationale: मानक हिन्दी बाइबलीय नाम “कनान” रखा गया है और सूची की अंतिम इकाई से पहले इब्रानी संयोजक को “और” से व्यक्त किया गया है।
