  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये शेम के पुत्र हैं—उनके कुलों के अनुसार, उनकी भाषाओं के अनुसार, उनके देशों में, और उनके राष्ट्रों के अनुसार।” इब्रानी में कुलों, भाषाओं और राष्ट्रों के साथ वर्गीकरणसूचक उपसर्ग की पुनरावृत्ति है; ‘देशों में’ स्थानसूचक है।
