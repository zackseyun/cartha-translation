  rationale: इब्रानी का क्रियारहित परिचयात्मक वाक्य हिन्दी में स्वाभाविक रूप से ‘हैं’ के साथ दिया गया है। ‘पुत्र’ वंशावली की औपचारिक और पुरुष-वंश केंद्रित अभिव्यक्ति को बनाए रखता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: अपने-अपने कुलों ... के अनुसार
  rationale: मִשְׁפָּחָה यहाँ जनजातीय-वंशावली इकाइयों को दर्शाता है; ‘कुल’ आधुनिक हिन्दी में संक्षिप्त और उपयुक्त है। לְ को वर्गीकरण सूचक ‘के अनुसार’ से व्यक्त किया गया है।
- source_word: לִלְשֹׁנֹתָם
  choice: भाषाओं ... के अनुसार
  rationale: לָשׁוֹן का शाब्दिक अर्थ ‘जीभ’ हो सकता है, पर राष्ट्र-सारणी के इस प्रसंग में इसका आशय भाषाओं से है।
- source_word: בְאַרְצֹתָם
  choice: देशों
  rationale: אֶרֶץ का बहुवचन यहाँ विभिन्न समुदायों के भौगोलिक भूभागों को सूचित करता है। ‘देश’ सामान्य हिन्दी में स्वाभाविक है और यहाँ आधुनिक राष्ट्र-राज्य का तकनीकी अर्थ आवश्यक नहीं बनाता।
- source_word: לְגוֹיֵהֶם
  choice: जातियों ... के अनुसार
  rationale: גּוֹי का अर्थ जनसमुदाय अथवा राष्ट्र है। प्राचीन जातीय समुदायों के संदर्भ में ‘जातियाँ’ सहज है; इसे आधुनिक जाति-व्यवस्था के तकनीकी अर्थ में नहीं लिया गया है।
