translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण भौगोलिक वर्णन। ‘से लेकर ... तक’ सीमा-विस्तार को सहज बनाता है, जबकि ‘की ओर’ בֹּאֲכָה की दिशात्मकता को बनाए रखता है।
