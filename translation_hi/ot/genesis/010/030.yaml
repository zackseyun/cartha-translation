  text: And their settlement was from Mesha as you go toward Sephar[a], the hill country of the east.
translation:
  language: hi
  text: उनका निवास मेशा से सफार की दिशा में, पूर्व के पहाड़ी प्रदेश तक था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: यह क्रिया पिछले वर्णन से वाक्य को जोड़ते हुए उनके निवास-क्षेत्र की स्थिति बताती है; हिंदी में वाक्यांत का ‘था’ स्वाभाविक और मूल के निकट है।
- source_word: מוֹשָׁבָם
  choice: उनका निवास
  rationale: यह शब्द रहने की जगह अथवा बसे हुए क्षेत्र को दर्शाता है। ‘निवास’ आधुनिक, गरिमापूर्ण और सामूहिक भौगोलिक संदर्भ के अनुकूल है।
- source_word: מִמֵּשָׁא
  choice: मेशा से
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण किया गया है और מִן उपसर्ग को ‘से’ द्वारा व्यक्त किया गया है।
- source_word: בֹּאֲכָה
  choice: की ओर
  rationale: यह भौगोलिक दिशा बताने वाला मुहावरा है। ‘की ओर’ गंतव्य की दिशा को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: סְפָרָה
  choice: सफार
  rationale: स्थान-नाम סְפָר का स्रोत-आधारित देवनागरी लिप्यंतरण है; दिशासूचक ה को अलग नामांश न बनाकर ‘की ओर’ में व्यक्त किया गया है।
- source_word: הַר
  choice: पहाड़ी प्रदेश
  rationale: भौगोलिक सीमा-वर्णन में הַר किसी एक पर्वत के साथ-साथ पर्वतीय या पहाड़ी क्षेत्र का भी संकेत कर सकता है; ‘पहाड़ी प्रदेश’ इस क्षेत्रीय अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: הַקֶּדֶם
  choice: पूर्व के
  rationale: קֶדֶם यहाँ पूर्वी दिशा या पूर्वी भूभाग को सूचित करता है; ‘पूर्व के पहाड़ी प्रदेश’ मूल संबंध को बनाए रखता है।
