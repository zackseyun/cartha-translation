source:
  edition: WLC
  text: בְּנֵ֥י שֵׁ֖ם עֵילָ֣ם וְ/אַשּׁ֑וּר וְ/אַרְפַּכְשַׁ֖ד וְ/ל֥וּד וַֽ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/022.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud[b], and Aram.'
translation:
  language: hi
  text: 'शेम के पुत्र थे: एलाम, अश्शूर[a], अर्पक्षद[b], लूद और अराम[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अश्शूर और अराम नाम बाद में क्रमशः अश्शूर के लोगों/प्रदेश और अरामी लोगों/प्रदेश से भी जुड़े हैं।
    reason: cultural_note
  - marker: b
    text: इब्रानी नाम ‘अर्पक्षद’ है; यूनानी से प्रभावित परंपरागत रूप में इसे कभी-कभी ‘अर्फक्सद’ लिखा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह בֵּן का बहुवचन संबंधवाचक रूप है। वंशावली के संदर्भ में ‘पुत्र’ इब्रानी की पुरुष-वंशीय संरचना को सीधे बनाए रखता है; ‘वंशज’ अपेक्षाकृत अधिक व्याख्यात्मक होता।
- source_word: שֵׁם
  choice: शेम
  rationale: व्यक्तिवाचक नाम का इब्रानी-आधारित, हिंदी में प्रचलित लिप्यंतरण।
- source_word: עֵילָם
  choice: एलाम
  rationale: वंशावली में व्यक्तिवाचक नाम के रूप में प्रयुक्त इब्रानी नाम का सहज हिंदी लिप्यंतरण।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: इब्रानी नाम के द्वित्व व्यंजन को दर्शाता है और ‘असीरिया’ जैसे बाद के भौगोलिक पर्याय से बचता है।
- source_word: אַרְפַּכְשַׁד
  choice: अर्पक्षद
  rationale: इब्रानी व्यंजन-रूप के निकट हिंदी लिप्यंतरण; यूनानी-प्रभावित पारंपरिक रूप के बजाय मूल पाठ को प्राथमिकता।
- source_word: לוּד
  choice: लूद
  rationale: यहाँ एकवचन व्यक्तिवाचक नाम है; दीर्घ ऊ ध्वनि को बनाए रखा गया है।
- source_word: אֲרָם
  choice: अराम
  rationale: मूल इब्रानी नाम को रखा गया है; ‘सीरिया’ बाद का भौगोलिक नाम है और यहाँ की वंशावली-संरचना को धुंधला कर सकता है।
theological_decisions:
- issue: वंशावली के नामों का व्यक्ति अथवा उनसे जुड़े जनसमूह/प्रदेश के रूप में अर्थ
  choice: मुख्य पाठ में सभी को पुत्रों के व्यक्तिवाचक नामों के रूप में रखा गया
  alternative: अश्शूर को असीरिया और अराम को सीरिया कहना
  rationale: इब्रानी वाक्य सीधे ‘शेम के पुत्र’ कहकर नामों की सूची देता है। उनसे जुड़े बाद के लोगों और क्षेत्रों का संबंध संभव है, पर उसे मुख्य पाठ में निश्चित भौगोलिक अर्थ बनाना स्रोत से आगे जाना होगा।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण वंशावली-शैली। ‘थे’ जोड़कर हिंदी वाक्य को स्वाभाविक बनाया गया है। नाम इब्रानी स्रोत के निकट रखे गए हैं; फुटनोट संकेत मुख्य पाठ में उपस्थित हैं।
