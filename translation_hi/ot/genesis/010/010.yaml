    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי רֵאשִׁית מַמְלַכְתּוֹ
  choice: उसके राज्य का आरम्भ ... से हुआ
  rationale: यह स्वाभाविक हिन्दी में राज्य के आरम्भिक क्षेत्र या केन्द्रों को व्यक्त करता है और רֵאשִׁית के ‘आरम्भ’ अर्थ को बनाए रखता है; इसे ‘राजधानी’ या ‘मुख्य भाग’ कहकर अधिक निश्चित नहीं करता।
- source_word: בָּבֶל
  choice: बाबेल
  rationale: इब्रानी स्थान-नाम का लिप्यंतरण है और उत्पत्ति 11 के साथ साहित्यिक संबंध बनाए रखता है; ‘बेबीलोन’ वैकल्पिक प्रचलित नाम है।
- source_word: אֶרֶךְ
  choice: एरेख
  rationale: मसोरा-पाठ में आए इब्रानी नाम का निकट देवनागरी लिप्यंतरण; इसकी पहचान प्राचीन उरुक से की जाती है।
- source_word: אַכַּד
  choice: अक्कद
  rationale: इब्रानी नाम का स्पष्ट हिन्दी लिप्यंतरण और ऐतिहासिक रूप ‘Akkad’ के अनुरूप प्रचलित वर्तनी।
- source_word: כַלְנֵה
  choice: कलने
  rationale: मसोरा-पाठ כַלְנֵה का निकट देवनागरी लिप्यंतरण; पाठ में किसी वैकल्पिक स्थान-नाम को नहीं अपनाया गया।
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: शिनार देश में
  rationale: भौगोलिक पदबंध का संक्षिप्त, स्वाभाविक हिन्दी रूप, जिसमें אֶרֶץ का ‘देश/भूमि’ अर्थ सुरक्षित है।
