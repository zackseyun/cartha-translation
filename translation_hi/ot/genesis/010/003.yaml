lexical_decisions:
- source_word: וּ/בְנֵי
  choice: और ... के पुत्र
  rationale: निर्मित बहुवचन ‘पुत्र’ वंशावली के संबंध को स्वाभाविक और सटीक ढंग से व्यक्त करता है; आरंभिक संयोजक וּ को ‘और’ से सुरक्षित रखा गया है।
- source_word: גֹּמֶר
  choice: गोमेर
  rationale: व्यक्तिवाचक नाम का आधुनिक मानक हिन्दी में स्रोत-आधारित लिप्यंतरण।
- source_word: אַשְׁכֲּנַז
  choice: अश्कनज
  rationale: व्यक्तिवाचक वंश-नाम का लिप्यंतरण; इसका अर्थानुवाद नहीं किया गया।
- source_word: וְ/רִיפַת
  choice: रीपत
  rationale: WLC/मसोरेटिक पाठ के רִיפַת को मुख्य पाठ में रखा गया है; समानांतर वंशावली का भिन्न रूप पादटिप्पणी में दिया गया है।
- source_word: וְ/תֹגַרְמָה
  choice: तोगर्मा
  rationale: व्यक्तिवाचक नाम का स्रोत उच्चारण के निकट देवनागरी लिप्यंतरण।
