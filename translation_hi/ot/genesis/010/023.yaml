lexical_decisions:
- source_word: וּבְנֵי
  choice: के पुत्र
  rationale: वंशावली के सूत्र में रचनात्मक बहुवचन का सीधा और स्वाभाविक हिन्दी रूप; आरम्भिक संयोजक וּ को अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: אֲרָם
  choice: अराम
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: עוּץ
  choice: ऊस
  rationale: इब्रानी नाम עוּץ का हिन्दी में ध्वन्यात्मक लिप्यंतरण।
- source_word: חוּל
  choice: हूल
  rationale: इब्रानी व्यक्तिवाचक नाम का सीधा हिन्दी लिप्यंतरण।
- source_word: גֶתֶר
  choice: गेतेर
  rationale: इब्रानी व्यक्तिवाचक नाम का ध्वन्यात्मक हिन्दी लिप्यंतरण।
- source_word: מַשׁ
  choice: मश
  rationale: WLC/मसोरेटी पाठ में आए नाम का सीधा लिप्यंतरण; 1 इतिहास 1:17 के भिन्न पाठ को पाद-टिप्पणी में रखा गया है।
