  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली रखी गई है। पाद-टिप्पणी का चिह्न संबंधित नाम “मश” के बाद रखा गया है, क्योंकि पाठांतर उसी नाम से जुड़ा है।
