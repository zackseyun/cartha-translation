  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली रखी गई है। नामों का अनुवाद या जातीय-भौगोलिक निर्धारण करने के बजाय उनका देवनागरी लिप्यंतरण किया गया है। ‘थे’ जोड़ने से हिंदी वाक्य स्वाभाविक बनता है, जबकि मूल की सूचीबद्ध संरचना बनी रहती है।
