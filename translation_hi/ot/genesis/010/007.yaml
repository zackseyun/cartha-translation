  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְנֵ֣י כ֔וּשׁ סְבָא֙ וַֽ/חֲוִילָ֔ה וְ/סַבְתָּ֥ה וְ/רַעְמָ֖ה וְ/סַבְתְּכָ֑א וּ/בְנֵ֥י רַעְמָ֖ה שְׁבָ֥א וּ/דְדָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/007.yaml
  text: 'And the sons of Cush: Seba[a], Havilah, Sabtah, Raamah, and Sabteca[b]. And the sons of Raamah: Sheba and Dedan.'
translation:
  language: hi
  text: 'कूश के पुत्र[a] थे: सबा, हवीला, सबता, रामाह और सबतका[b]। रामाह के पुत्र थे: शेबा और ददान।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वंशावलियों में इब्रानी अभिव्यक्ति ‘के पुत्र’ केवल सीधे जैविक पुत्रों के लिए नहीं, बल्कि वंशजों या किसी कुल अथवा जनसमूह की उत्पत्ति के लिए भी प्रयुक्त हो सकती है।
    reason: cultural_note
  - marker: b
    text: इस पद के कई नाम केवल व्यक्तियों के ही नहीं, बल्कि लोगों, क्षेत्रों या उन पूर्वजों के भी सूचक हो सकते हैं जिनके नाम पर कोई जनसमूह जाना गया।
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: के पुत्र थे
  rationale: בְּנֵי का सीधा अर्थ ‘पुत्र’ है; वंशावली में यह वंशजों अथवा उनसे निकले समुदायों को भी सूचित कर सकता है। आरंभिक וּ का संबंध पिछले पद से है, पर हिंदी में पद को स्वाभाविक स्वतंत्र वाक्य बनाने के लिए अलग से ‘और’ नहीं रखा गया।
- source_word: כּוּשׁ
  choice: कूश
  rationale: इब्रानी व्यक्तिवाचक नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: סְבָא
  choice: सबा
  rationale: नाम का ध्वन्यात्मक हिंदी लिप्यंतरण; इसे किसी निश्चित जाति या भूभाग के रूप में व्याख्यायित नहीं किया गया।
- source_word: חֲוִילָה
  choice: हवीला
  rationale: इब्रानी नाम का प्रचलित और सुबोध हिंदी रूप।
- source_word: סַבְתָּה
  choice: सबता
  rationale: इब्रानी व्यंजन और स्वर-रूप के निकट हिंदी लिप्यंतरण।
- source_word: רַעְמָה
  choice: रामाह
  rationale: नाम का हिंदी लिप्यंतरण; अंतिम ה को दर्शाने के लिए ‘ह’ रखा गया।
- source_word: סַבְתְּכָא
  choice: सबतका
  rationale: इब्रानी नाम का निकट और पढ़ने योग्य हिंदी लिप्यंतरण।
- source_word: וּבְנֵי רַעְמָה
  choice: रामाह के पुत्र थे
  rationale: दोहराई गई वंशावली-संरचना को स्पष्ट रखा गया; ‘वंशज’ संभव है, पर मूल के ‘पुत्र’ को मुख्य पाठ में सुरक्षित रखा गया।
- source_word: שְׁבָא
  choice: शेबा
  rationale: שְׁבָא को סְבָא (‘सबा’) से अलग दिखाने वाला ध्वन्यात्मक लिप्यंतरण।
- source_word: דְדָן
  choice: ददान
  rationale: इब्रानी नाम का सीधा हिंदी लिप्यंतरण।
theological_decisions: []
