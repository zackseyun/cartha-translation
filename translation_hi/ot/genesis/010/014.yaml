source:
  edition: WLC
  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/014.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: hi
  text: और पत्रूसी, कस्लूही—वहीं से पलिश्ती निकले[a]—और कप्तोरी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वहाँ से पलिश्ती निकले।” इस कथन को ठीक पहले बताए गए कस्लूहियों से जोड़कर समझा जा सकता है।
    reason: मूल इब्रानी के स्थानवाचक शब्द और उसके संभावित पूर्वपद की अस्पष्टता बताने के लिए।
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: पत्रूसी
  rationale: यह पत्रोस से बना एक जाति-नाम है; हिन्दी में बाइबिलीय नामों की प्रचलित शैली के अनुसार इसका लिप्यंतरण किया गया है।
- source_word: כַּסְלֻחִים
  choice: कस्लूही
  rationale: इस जाति की बाहरी ऐतिहासिक पहचान अनिश्चित है, इसलिए अर्थ का अनुमान लगाने के बजाय इब्रानी रूप का निकट लिप्यंतरण रखा गया है।
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: वहीं से ... निकले
  rationale: यह इब्रानी के स्थानवाचक מִשָּׁם (‘वहाँ से’) और गति-सूचक יָצְאוּ (‘निकले’) को स्वाभाविक हिन्दी में सुरक्षित रखता है तथा किसी एक पूर्वपद से संबंध को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्ती
  rationale: यह इस जाति-नाम का हिन्दी बाइबिलीय परंपरा में सुबोध और प्रचलित लिप्यंतरण है।
- source_word: כַּפְתֹּרִים
  choice: कप्तोरी
  rationale: कप्तोर से संबंधित जाति-नाम को हिन्दी में जातिवाचक रूप के रूप में लिप्यंतरित किया गया है।
- source_word: וְאֶת
  choice: और
  rationale: वंशावली की सूची में बार-बार आए संयोजक और कर्म-सूचक चिह्न को शब्दशः दोहराने के बजाय हिन्दी में ‘और’ से सूची के सदस्यों को जोड़ा गया है।
theological_decisions:
- issue: ‘वहाँ से पलिश्ती निकले’ उपवाक्य का पूर्वपद
  choice: मुख्य पाठ में ‘वहीं से पलिश्ती निकले’ रखकर इब्रानी का स्थानवाचक भाव और उसकी संभावित अस्पष्टता सुरक्षित रखी गई है।
  alternative: ‘जिनसे पलिश्ती निकले’ कहकर उपवाक्य को स्पष्ट रूप से कस्लूहियों से जोड़ना।
  rationale: तत्काल पूर्वपद होने के कारण कस्लूहियों से संबंध सबसे स्वाभाविक है, पर इब्रानी में ‘जिनसे’ नहीं बल्कि ‘वहाँ से’ है। इसलिए मुख्य पाठ अधिक औपचारिक रूप रखता है और पादटिप्पणी संभावित संबंध स्पष्ट करती है।
translation_notes:
  register: भाषा संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिन्दी की है। जाति-नामों का अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है। डैश वंशावली की सूची के भीतर दिए गए उत्पत्ति-संबंधी कथन को स्पष्ट करते हैं।
