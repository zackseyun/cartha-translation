  yaml_path: translation/ot/genesis/010/013.yaml
  text: And Mizraim fathered the Ludim[a], the Anamim, the Lehabim[b], and the Naphtuhim.
translation:
  language: hi
  text: और मिस्रैम लूदीम, अनामीम, लहाबीम[b] और नप्तूहीम का पिता हुआ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने जन्म दिया” या “उससे वंश निकला।” हिब्रू क्रिया वंशावली में संतान या वंशज उत्पन्न करने के लिए प्रयुक्त सामान्य शब्द है।
    reason: lexical_alternative
  - marker: b
    text: ये जाति-समूहों के लिप्यंतरित नाम हैं; इन्हें अनुमानित स्थानों या बाद की जातीय पहचानों के नामों से नहीं बदला गया है।
    reason: cultural_note
lexical_decisions:
- source_word: מִצְרַיִם
  choice: मिस्रैम
  rationale: जातियों की वंशावली में यह नाम एक मूलपुरुष के रूप में आया है; इसलिए इसे ‘मिस्र’ न बनाकर हिब्रू नाम के निकट लिप्यंतरित किया गया है।
- source_word: יָלַד
  choice: से ... उत्पन्न हुए
  rationale: हिब्रू का सामान्य वंशावली-संबंधी क्रियापद है। यहाँ नाम बहुवचन जाति-समूहों के हैं, इसलिए स्वाभाविक हिन्दी में वंशोद्भव व्यक्त करने वाला यह प्रयोग चुना गया है।
- source_word: לוּדִים
  choice: लूदी
  rationale: इसे किसी अनुमानित स्थान या बाद की जातीय पहचान से न जोड़कर हिब्रू जाति-समूह के नाम के रूप में लिप्यंतरित किया गया है।
- source_word: עֲנָמִים
  choice: अनामी
  rationale: हिब्रू बहुवचन जाति-समूह के नाम को हिन्दी में स्वाभाविक जातिनाम के रूप में प्रस्तुत किया गया है।
- source_word: לְהָבִים
  choice: लहाबी
  rationale: अनिश्चित ऐतिहासिक पहचान थोपे बिना हिब्रू रूप के निकट जातिनाम रखा गया है।
- source_word: נַפְתֻּחִים
  choice: नप्तूही
  rationale: वंशावली में आए जाति-समूह के नाम को हिब्रू उच्चारण के निकट हिन्दी रूप दिया गया है।
- source_word: אֶת
  choice: अलग से अनूदित नहीं
  rationale: यह निश्चित कर्म-सूचक चिह्न है; हिन्दी वाक्य-विन्यास में इसका स्वतंत्र शब्दगत समकक्ष आवश्यक नहीं है।
- source_word: וְ
  choice: और
  rationale: सूची के पदों को जोड़ने वाला सामान्य समुच्चयबोधक।
theological_decisions:
- issue: वंशावली में יָלַד का आशय
  choice: ‘से ... उत्पन्न हुए’ द्वारा वंशज अथवा जाति-समूहों की उत्पत्ति व्यक्त की गई
  alternative: ‘जन्म दिया’ या ‘का पिता हुआ’
  rationale: मूल में वंशगत संबंध स्पष्ट है, पर प्रत्येक नाम को तत्काल जैविक पुत्र मानने की अपेक्षा जाति-समूहों के उद्भव की गुंजाइश बनी रहती है।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण हिन्दी। बहुवचन हिब्रू जातिनामों को हिन्दी में स्वाभाविक ‘-ी’ जातिनामों के रूप में रखा गया है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न उपस्थित हैं।
