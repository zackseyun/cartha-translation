base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/025.yaml
  text: 'And to Eber two sons were born: the name of the one was Peleg[a], for in his days the earth was divided, and his brother''s name was Joktan.'
translation:
  language: hi
  text: और एबेर के दो पुत्र उत्पन्न हुए। एक का नाम पेलेग था, क्योंकि उसके दिनों में पृथ्वी[a] विभाजित हुई; और उसके भाई का नाम योक्तान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देश’ अथवा ‘भूमि’। इब्रानी शब्द का अर्थ ‘पृथ्वी’ भी हो सकता है और ‘देश’ या ‘भूमि’ भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֵבֶר
  choice: और एबेर के
  rationale: संयोजक וּ और संबंधसूचक לְ अगले वंशावली-विवरण को जोड़ते हैं; हिंदी में ‘और एबेर के’ स्वाभाविक रूप से वही संबंध व्यक्त करता है।
- source_word: יֻלַּד שְׁנֵי בָנִים
  choice: दो पुत्र उत्पन्न हुए
  rationale: ילד का पुअल रूप यहाँ निष्क्रिय अर्थ ‘उत्पन्न हुए’ देता है; बहुवचन ‘दो पुत्र’ को यथावत रखा गया है।
- source_word: שֵׁם הָאֶחָד
  choice: एक का नाम
  rationale: शाब्दिक ‘उस एक का नाम’ को सहज आधुनिक हिंदी में ‘एक का नाम’ किया गया है; इसे ‘पहले का नाम’ नहीं बनाया गया, क्योंकि मूल पाठ क्रम-संख्या स्पष्ट नहीं करता।
- source_word: פֶּלֶג
  choice: पेलेग
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: כִּי בְיָמָיו
  choice: क्योंकि उसके दिनों में
  rationale: כִּי नामकरण का कारण बताता है और בְיָמָיו का समय-सूचक मुहावरा ‘उसके दिनों में’ के रूप में सुरक्षित है।
- source_word: נִפְלְגָה
  choice: बाँटी गई
  rationale: פלג के निफ़अल रूप का निष्क्रिय अर्थ ‘विभाजित/बाँटी गई’ है। ‘बाँटी गई’ नाम पेलेग से जुड़े विभाजन के भाव को स्पष्ट और सहज हिंदी में रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: उत्पत्ति 10 में जातियों के व्यापक वर्णन के संदर्भ में ‘पृथ्वी’ उपयुक्त है; ‘देश/भूमि’ की वास्तविक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- source_word: וְשֵׁם אָחִיו יָקְטָן
  choice: और उसके भाई का नाम योक्तान था
  rationale: मूल की संबंधवाचक संरचना को स्वाभाविक हिंदी शब्दक्रम में व्यक्त किया गया है।
theological_decisions:
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: पृथ्वी
  alternative: देश या भूमि
  rationale: जातियों की वंशावली के व्यापक संदर्भ में ‘पृथ्वी’ संभवतः अभिप्रेत है, पर इब्रानी אֶרֶץ पूरे संसार के साथ-साथ किसी देश या भूभाग को भी सूचित कर सकता है। इसलिए मुख्य पाठ किसी विशिष्ट ऐतिहासिक प्रक्रिया को परिभाषित नहीं करता और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण वंशावली-शैली अपनाई गई है। ‘उत्पन्न हुए’ निष्क्रिय इब्रानी रूप को बचाता है, और विरामचिह्न दोनों पुत्रों के विवरण को स्पष्ट करते हैं।
