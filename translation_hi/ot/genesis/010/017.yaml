  rationale: वंशावली की सूची में וְ अगली इकाई जोड़ता है, जबकि אֶת प्रत्यक्ष कर्म का चिह्न है और हिंदी में अलग से व्यक्त नहीं किया जाता।
- source_word: הַחִוִּי
  choice: हिव्वी
