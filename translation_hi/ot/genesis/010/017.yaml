- source_word: הָעַרְקִי
  choice: अरकी
  rationale: यह अरका से जुड़े लोगों का जातिनाम है। ‘अरकी’ नाम-सदृश स्वरूप और सूची की समानांतर रचना को बनाए रखता है।
- source_word: הַסִּינִי
  choice: सीनी
  rationale: यह एक जातीय अथवा कुलगत पदनाम है। ‘सीनी’ मूल नाम का स्वरूप बनाए रखते हुए आसपास के जातिनामों के अनुरूप है।
