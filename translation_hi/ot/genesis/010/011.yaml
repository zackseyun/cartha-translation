id: GEN.10.11
reference: Genesis 10:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִן הָ/אָ֥רֶץ הַ/הִ֖וא יָצָ֣א אַשּׁ֑וּר וַ/יִּ֨בֶן֙ אֶת נִ֣ינְוֵ֔ה וְ/אֶת רְחֹבֹ֥ת עִ֖יר וְ/אֶת כָּֽלַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/011.yaml
  text: From that land Asshur went out and built Nineveh[a], Rehoboth-Ir, and Calah.
translation:
  language: hi
  text: उस देश से अश्शूर निकला और उसने नीनवे[a], रहोबोत-ईर और कालह को बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस देश से वह अश्शूर देश में गया और उसने नीनवे, रहोबोत-ईर और कालह को बनाया।” इस पठन में पिछले पद का निम्रोद कर्ता है और אַשּׁוּר व्यक्ति अश्शूर नहीं, बल्कि अश्शूर देश है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הָאָרֶץ הַהִוא
  choice: उस देश से
  rationale: מִן स्रोत या प्रस्थान-बिंदु को दर्शाता है, और אֶרֶץ यहाँ मिट्टी नहीं बल्कि भू-क्षेत्र है।
- source_word: יָצָא
  choice: निकला
  rationale: יצא का सामान्य अर्थ बाहर जाना या निकलना है; प्रसंग में यह पिछले उल्लिखित देश से प्रस्थान व्यक्त करता है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: यह नाम व्यक्ति अश्शूर अथवा क्षेत्र अश्शूर/असीरिया, दोनों का बोध करा सकता है। मुख्य पाठ में निकटतम व्याकरणिक पठन के अनुसार इसे कर्ता और व्यक्ति का नाम माना गया है।
- source_word: וַיִּבֶן
  choice: बनाया
  rationale: בנה का सीधा अर्थ बनाना या निर्माण करना है। नगरों के संदर्भ में स्वाभाविक आधुनिक हिन्दी के लिए ‘बनाया’ चुना गया; ‘बसाया’ अधिक व्याख्यात्मक होता।
- source_word: נִינְוֵה
  choice: नीनवे
  rationale: स्थान-नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: רְחֹבֹת עִיר
  choice: रहोबोत-ईर
  rationale: बार-बार आए אֶת से चिह्नित नगरों की सूची में इसे संयुक्त स्थान-नाम मानना सर्वाधिक उपयुक्त है, यद्यपि शब्दशः ‘नगर के चौक’ जैसा अर्थ संभव है।
- source_word: כָּלַח
  choice: कालह
  rationale: स्थान-नाम का स्रोत-ध्वनि के निकट हिन्दी लिप्यंतरण।
theological_decisions:
- issue: אַשּׁוּר का कर्ता और अर्थ
  choice: 'अश्शूर कर्ता है: ‘अश्शूर निकला’'
  alternative: 'पिछले पद का निम्रोद निहित कर्ता है: ‘वह उस देश से अश्शूर देश में गया’'
  rationale: इब्रानी में אַשּׁוּר व्यक्ति अश्शूर अथवा क्षेत्र अश्शूर/असीरिया हो सकता है। तत्काल वाक्य-विन्यास में क्रिया के बाद आया यह पद स्वाभाविक रूप से स्पष्ट कर्ता पढ़ा जा सकता है; फिर भी क्षेत्रवाची पठन वास्तविक और प्राचीन अस्पष्टता है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। व्यक्तिवाची तथा स्थानवाची नामों का देवनागरी लिप्यंतरण किया गया है। ‘उसने’ जोड़कर हिन्दी में संयुक्त क्रियाओं का कर्ता स्पष्ट किया गया है; इससे मूल का अर्थ नहीं बदला।
