  footnotes:
  - marker: a
    text: ये ‘जातियों की तालिका’ में आए व्यक्तिवाचक नाम हैं; अलग-अलग परम्पराओं में इनकी वर्तनी के रूप थोड़े भिन्न हो सकते हैं, पर इनके अर्थ में कोई भेद नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אֶת
  choice: और
  rationale: אֵת यहाँ वंशावली की सूची में प्रत्येक नाम से पहले आया प्रत्यक्ष कर्म-चिह्न है, जिसका हिन्दी में अलग अनुवाद आवश्यक नहीं है; וְ को स्वाभाविक सूची-संयोजन के लिए ‘और’ से व्यक्त किया गया है।
- source_word: הֲדוֹרָם
  choice: हदोराम
  rationale: यह वंशावली में आया व्यक्तिवाचक नाम है; इसका अर्थानुवाद करने के बजाय इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: אוּזָל
  choice: ऊज़ाल
  rationale: व्यक्तिवाचक नाम का इब्रानी रूप के निकट देवनागरी लिप्यंतरण किया गया है; आरम्भिक दीर्घ ऊ और ज़ ध्वनि को स्पष्ट रखा गया है।
- source_word: דִּקְלָה
  choice: दिक्ला
  rationale: यह व्यक्तिवाचक नाम है; इब्रानी व्यंजन-रूप और उच्चारण को ध्यान में रखकर ‘दिक्ला’ लिप्यंतरित किया गया है।
