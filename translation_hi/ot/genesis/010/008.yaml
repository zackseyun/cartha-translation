id: GEN.10.8
reference: Genesis 10:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְרֹ֑ד ה֣וּא הֵחֵ֔ל לִֽ/הְי֥וֹת גִּבֹּ֖ר בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/008.yaml
  text: And Cush fathered Nimrod[d][c][b][a]; he began to be a mighty man on the earth.
translation:
  language: hi
  text: और कूश से निम्रोद उत्पन्न हुआ; वह पृथ्वी पर एक पराक्रमी पुरुष बनने लगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पराक्रमी पुरुष’ का अनुवाद ‘बलवान व्यक्ति,’ ‘वीर’ या ‘योद्धा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पृथ्वी पर’ का अनुवाद ‘देश में’ या ‘भूमि पर’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכ֖וּשׁ
  choice: और कूश
  rationale: וְ वंशावली को आगे जोड़ने वाला सामान्य संयोजक है; कूश व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण है।
- source_word: יָלַ֣ד
  choice: से ... उत्पन्न हुआ
  rationale: वंशावली में ילד पिता द्वारा संतान उत्पन्न करने को व्यक्त करता है। हिन्दी की स्वाभाविक वंशावली शैली में ‘कूश से निम्रोद उत्पन्न हुआ’ पुरुष वंश-संबंध को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: נִמְרֹ֑ד
  choice: निम्रोद
  rationale: व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
- source_word: ה֣וּא
  choice: वह
  rationale: स्वतंत्र सर्वनाम निम्रोद को फिर से वाक्य का विषय बनाता है; हिन्दी में ‘वह’ इस पुनरारंभ को सहजता से रखता है।
- source_word: הֵחֵ֔ל לִֽהְי֥וֹת
  choice: बनने लगा
  rationale: इस रचना का सीधा अर्थ ‘होना आरम्भ किया’ है। ‘बनने लगा’ आधुनिक हिन्दी में स्वाभाविक है और ‘सबसे पहला था’ जैसी अतिरिक्त प्राथमिकता नहीं जोड़ता।
- source_word: גִּבֹּ֖ר
  choice: एक पराक्रमी पुरुष
  rationale: גִּבּוֹר बलवान, वीर या योद्धा-सदृश व्यक्ति को सूचित कर सकता है। ‘पराक्रमी पुरुष’ इसकी व्यापकता बनाए रखता है और अर्थ को केवल सैनिक भूमिका तक सीमित नहीं करता।
- source_word: בָּאָֽרֶץ
  choice: पृथ्वी पर
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है। उत्पत्ति 10 के विश्वव्यापी जाति-वर्णन में ‘पृथ्वी’ उपयुक्त है, और בְּ के लिए हिन्दी में ‘पर’ स्वाभाविक मुहावरा है।
theological_decisions:
- issue: הֵחֵל לִהְיוֹת का बल
  choice: बनने लगा
  alternative: सबसे पहला पराक्रमी पुरुष बना
  rationale: हिब्रू स्पष्ट रूप से आरम्भ होने का भाव देता है, पर अनिवार्यतः ऐतिहासिक प्राथमिकता नहीं। इसलिए पाठ की अस्पष्टता को किसी विशिष्ट व्याख्या से नहीं भरा गया।
- issue: אֶרֶץ का विस्तार
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: जातियों की इस व्यापक वंशावली में विश्वव्यापी अर्थ अधिक संभावित है, फिर भी हिब्रू शब्द क्षेत्रीय ‘भूमि’ भी दर्शा सकता है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: גִּבּוֹר का आशय
  choice: पराक्रमी पुरुष
  alternative: वीर या योद्धा
  rationale: संदर्भ शक्ति और असाधारण सामर्थ्य दर्शाता है, पर यहाँ शब्द को केवल युद्ध-कौशल तक सीमित करना आवश्यक नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वंशावली शैली अपनाई गई है। ‘उत्पन्न हुआ’ बोलचाल के ‘जन्मा’ से अधिक औपचारिक है, जबकि ‘बनने लगा’ हिब्रू के आरम्भसूचक भाव को स्वाभाविक हिन्दी में रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
