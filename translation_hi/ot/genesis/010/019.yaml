language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יְהִ֞י גְּב֤וּל הַֽ/כְּנַעֲנִי֙ מִ/צִּידֹ֔ן בֹּאֲ/כָ֥ה גְרָ֖רָ/ה עַד עַזָּ֑ה בֹּאֲ/כָ֞ה סְדֹ֧מָ/ה וַ/עֲמֹרָ֛ה וְ/אַדְמָ֥ה וּ/צְבֹיִ֖ם עַד לָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/019.yaml
  text: And the border of the Canaanites was from Sidon[a], as you go toward Gerar, as far as Gaza; and as you go toward Sodom and Gomorrah and Admah and Zeboiim, as far as Lasha.
translation:
  language: hi
  text: और कनानियों की सीमा सीदोन से, गरार की ओर जाते हुए गाज़ा तक, और सदोम, अमोरा, अदमा और सबोयीम की ओर जाते हुए लाशा[a] तक थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लेशा।”
    reason: स्थान-नाम के वैकल्पिक लिप्यंतरण को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וַיְהִי
  choice: और ... थी
  rationale: वाव-क्रमिक रूप यहाँ भौगोलिक वर्णन को आगे बढ़ाता है; हिन्दी में स्वाभाविक भूतकालीन संबंधसूचक वाक्य इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: גְּבוּל
  choice: सीमा
  rationale: इस भौगोलिक प्रसंग में यह कनानी भूभाग की सीमारेखा या विस्तार को दर्शाता है; आधुनिक हिन्दी में ‘सीमा’ सर्वाधिक स्वाभाविक है।
- source_word: הַכְּנַעֲנִי
  choice: कनानियों
  rationale: इब्रानी में जातिवाचक शब्द रूपतः एकवचन है, पर यहाँ पूरे जनसमूह के लिए सामूहिक अर्थ में प्रयुक्त हुआ है; इसलिए हिन्दी बहुवचन स्वाभाविक है।
- source_word: מִצִּידֹן
  choice: सीदोन से
  rationale: מִן सीमा के आरंभ-बिंदु को चिह्नित करता है; ‘सीदोन’ स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण है।
- source_word: בֹּאֲכָה
  choice: की ओर जाते हुए
  rationale: सीमा-वर्णनों में यह मुहावरा किसी स्थान की दिशा में बढ़ने या जाने का भाव देता है; यह अनुवाद उस गतिशील और दिशात्मक अर्थ को बनाए रखता है।
- source_word: גְרָרָה
  choice: गरार
  rationale: दिशासूचक हे को ‘की ओर’ में व्यक्त किया गया है और स्थान-नाम को हिन्दी में लिप्यंतरित किया गया है।
- source_word: עַד
  choice: तक
  rationale: यह सीमा के अंतिम विस्तार-बिंदु को दर्शाता है; हिन्दी में ‘तक’ संक्षिप्त और स्पष्ट है।
- source_word: עַזָּה
  choice: गाज़ा
  rationale: स्थान-नाम का आधुनिक हिन्दी में प्रचलित रूप अपनाया गया है।
- source_word: סְדֹמָה וַעֲמֹרָה וְאַדְמָה וּצְבֹיִם
  choice: सदोम, अमोरा, अदमा और सबोयीम
  rationale: सीमा की दिशा बताने वाले स्थान-नामों को स्रोत के क्रम में हिन्दी लिपि में रखा गया है।
- source_word: לָשַׁע
  choice: लाशा
  rationale: यह रूप इब्रानी स्वरांकन को निकटता से दर्शाता है; वैकल्पिक ‘लेशा’ को पाठ-टिप्पणी में सुरक्षित रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दो बार आए सीमा-वर्णन के दिशात्मक मुहावरे को समान रूप से ‘की ओर जाते हुए’ अनूदित किया गया है, और सभी स्थान-नाम स्रोत के क्रम में रखे गए हैं।
