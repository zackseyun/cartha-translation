  text: and the Jebusites[a], and the Amorites, and the Girgashites.
translation:
  language: hi
  text: और यबूसी[a], एमोरी और गिर्गाशी लोगों को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में जाति-सूचक नाम एकवचन रूप में हैं—‘यबूसी’, ‘एमोरी’ और ‘गिर्गाशी’—लेकिन इस वंश-सूची में वे सामूहिक रूप से इन जनसमूहों को दर्शाते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: यबूसी लोगों
  rationale: इब्रानी में निश्चित लेख के साथ एकवचन जातिवाचक रूप है, पर उत्पत्ति 10 की वंश-सूची में यह पूरे जनसमूह के लिए सामूहिक अर्थ में प्रयुक्त हुआ है; इसलिए हिन्दी में ‘लोगों’ से यह अर्थ स्वाभाविक और स्पष्ट होता है।
- source_word: הָאֱמֹרִי
  choice: एमोरी
  rationale: यह एकवचन जातिवाचक रूप यहाँ सामूहिक जनसमूह को दर्शाता है। पहले पद के ‘लोगों’ का अर्थ सूची के शेष नामों पर भी लागू होता है, जिससे अनावश्यक पुनरावृत्ति से बचते हुए हिन्दी स्वाभाविक रहती है।
- source_word: הַגִּרְגָּשִׁי
  choice: गिर्गाशी
  rationale: इब्रानी एकवचन जातिवाचक रूप सामूहिक रूप से गिर्गाशी जनसमूह का उल्लेख करता है; हिन्दी सूची में ‘लोगों’ को अंतिम नाम के बाद रखकर भी कहा जा सकता था, पर आरंभिक नाम के साथ रखना कारक-संबंध और सामूहिक अर्थ को आरंभ से स्पष्ट करता है।
- source_word: וְאֶת / וְאֵת
  choice: और … को
  rationale: וְ सूची को पिछले पद से जोड़ता है और אֵת निश्चित कर्म का चिह्न है। हिन्दी में संयोजक के लिए ‘और’ तथा जारी कर्म-संबंध के लिए सूची के अंत में ‘को’ स्वाभाविक समतुल्य हैं।
