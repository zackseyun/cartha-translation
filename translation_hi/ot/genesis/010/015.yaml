- source_word: וְ/אֶת
  choice: और
  rationale: संयोजक दूसरे वंशज को जोड़ता है; कर्म-चिह्न का पृथक अनुवाद आवश्यक नहीं है।
- source_word: חֵת
  choice: हेत
  rationale: मूल पाठ केवल व्यक्ति का नाम देता है, इसलिए मुख्य पाठ में व्याख्यात्मक विस्तार किए बिना उसका लिप्यंतरण किया गया है।
