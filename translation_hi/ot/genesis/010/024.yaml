    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: अर्पक्षद
  rationale: इब्रानी नाम אַרְפַּכְשַׁד का देवनागरी लिप्यंतरण; आरंभिक וְ का संबंध पिछले प्रसंग से है और स्वतंत्र पद के स्वाभाविक हिन्दी वाक्य में अलग से व्यक्त करना आवश्यक नहीं।
- source_word: יָלַד
  choice: का पिता हुआ
  rationale: पुरुष कर्ता वाली वंशावली में יָלַד पितृत्व-संबंध बताता है। ‘का पिता हुआ’ आधुनिक हिन्दी में स्वाभाविक है और प्राचीन या असहज ‘उत्पन्न किया’ से बचता है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का चिह्न है; हिन्दी में इसकी भूमिका वाक्य-संरचना से व्यक्त होती है।
- source_word: שָׁלַח / שֶׁלַח
  choice: शेलह
  rationale: पद में आए इब्रानी नाम के व्यंजन और स्वर-रूप के निकट देवनागरी लिप्यंतरण को चुना गया है।
- source_word: וְ/שֶׁלַח
  choice: और शेलह
  rationale: וְ को ‘और’ से व्यक्त किया गया है और नाम को पहली बार के समान रखा गया है।
- source_word: עֵבֶר
  choice: एबेर
  rationale: इब्रानी עֵבֶר का सरल देवनागरी लिप्यंतरण; आरंभिक अयिन के लिए हिन्दी में अलग सामान्य ध्वनि-चिह्न न होने के कारण स्वर से आरंभ किया गया है।
