reference: Genesis 10:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֽוּא הָיָ֥ה גִבֹּֽר צַ֖יִד לִ/פְנֵ֣י יְהוָ֑ה עַל כֵּן֙ יֵֽאָמַ֔ר כְּ/נִמְרֹ֛ד גִּבּ֥וֹר צַ֖יִד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/009.yaml
  text: He was a mighty hunter before Yahweh; therefore it is said[a], “Like Nimrod, a mighty hunter before Yahweh.”
translation:
  language: hi
  text: वह यहोवा के सामने एक पराक्रमी शिकारी था; इसलिए कहा जाता है[a], “निम्रोद के समान, यहोवा के सामने एक पराक्रमी शिकारी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “यहोवा का विरोध करते हुए,” यदि व्यापक प्रसंग के आधार पर इस पदबंध को विरोधी अर्थ में समझा जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: גִבֹּר צַיִד
  choice: पराक्रमी शिकारी
  rationale: यह संयुक्त अभिव्यक्ति असाधारण शिकार-कौशल और सामर्थ्य रखने वाले व्यक्ति का वर्णन करती है। ‘पराक्रमी शिकारी’ अर्थ को संक्षिप्त, स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: मूल पदबंध का प्राथमिक स्थानिक-संबंधपरक अर्थ ‘के सामने/की उपस्थिति में’ है। मुख्य पाठ में यही अपेक्षाकृत शाब्दिक और अर्थगत रूप से खुला अनुवाद रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह परमेश्वर के व्यक्तिवाचक नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत करता है, न कि उसे किसी उपाधि से बदलता है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह सूत्र आगे आने वाली लोकोक्ति के कारण या आधार को बताता है; ‘इसलिए’ आधुनिक हिन्दी में सहज है।
- source_word: יֵאָמַר
  choice: कहा जाता है
  rationale: निफ़अल रूप यहाँ लोकोक्ति प्रस्तुत करने वाला अवैयक्तिक कर्मवाच्य है; ‘कहा जाता है’ इसे ठीक व्यक्त करता है।
- source_word: כְּנִמְרֹד
  choice: निम्रोद के समान
  rationale: उपसर्ग כְּ तुलना दर्शाता है; ‘के समान’ लोकोक्तिपरक उद्धरण में स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: निम्रोद के संबंध में לִפְנֵי יְהוָה का आशय
  choice: यहोवा के सामने
  alternative: यहोवा का विरोध करते हुए
  rationale: इब्रानी पदबंध का सामान्य अर्थ ‘यहोवा के सामने’ है, पर व्यापक प्रसंग में इसे विरोधी भाव में समझने की संभावना भी मानी गई है। मुख्य पाठ मूल की अस्पष्टता बनाए रखता है और अधिक व्याख्यात्मक विकल्प को पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और लोकोक्तिपरक रूप अपनाया गया है। ‘पराक्रमी’ सामर्थ्य और असाधारण दक्षता दोनों का संकेत देता है; ‘यहोवा के सामने’ मूल की अर्थगत अनिश्चितता को अनावश्यक रूप से हल नहीं करता।
