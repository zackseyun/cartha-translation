source:
  edition: WLC
  text: אֵ֣לֶּה מִשְׁפְּחֹ֧ת בְּנֵי נֹ֛חַ לְ/תוֹלְדֹתָ֖/ם בְּ/גוֹיֵ/הֶ֑ם וּ/מֵ/אֵ֜לֶּה נִפְרְד֧וּ הַ/גּוֹיִ֛ם בָּ/אָ֖רֶץ אַחַ֥ר הַ/מַּבּֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/032.yaml
  text: These are the families of the sons of Noah[a], according to their generations, by their nations[c][b]; and from these the nations were separated on the earth after the flood.
translation:
  language: hi
  text: ये नूह के पुत्रों के कुल[a] हैं, उनकी वंशावलियों और उनके राष्ट्रों के अनुसार; और जलप्रलय के बाद इनसे पृथ्वी पर राष्ट्र अलग हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परिवार”।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: कुल
  rationale: यह शब्द रक्त-संबंध पर आधारित पारिवारिक समूहों को दर्शाता है। हिन्दी में ‘कुल’ वंशावली-संबंधी संदर्भ में स्वाभाविक और संक्षिप्त है; ‘परिवार’ भी संभव है।
- source_word: לְתוֹלְדֹתָם
  choice: उनकी वंशावलियों के अनुसार
  rationale: תּוֹלְדוֹת यहाँ पीढ़ियों, वंशजों अथवा वंशावली-क्रम का बोध करा सकता है। अध्याय के समापन-सार में ‘वंशावलियों’ से सूची की वंशगत संरचना स्पष्ट होती है।
- source_word: בְּגוֹיֵהֶם
  choice: उनके राष्ट्रों में
  rationale: בְּ का सीधा साहचर्य/क्षेत्रगत भाव ‘में’ से सुरक्षित रहता है, और גוֹיֵהֶם को राष्ट्रीय जनसमूहों के रूप में व्यक्त किया गया है।
- source_word: וּמֵאֵלֶּה
  choice: और इन्हीं से
  rationale: וּ तथा מֵ का संयुक्त अर्थ पिछले वर्णन से जोड़ते हुए उद्गम को दर्शाता है; ‘इन्हीं’ बलयुक्त संकेत को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִפְרְדוּ
  choice: अलग-अलग हो गए
  rationale: פרד के निफ़अल रूप में अलग होने या विभक्त होने का भाव है। यह हिन्दी प्रयोग किसी बाहरी कर्ता को अनावश्यक रूप से नहीं जोड़ता और परिणामगत फैलाव को भी संभव रहने देता है।
- source_word: הַגּוֹיִם
  choice: राष्ट्र
  rationale: संदर्भ नूह के पुत्रों से निकले अलग-अलग राष्ट्रीय जनसमूहों का है; ‘राष्ट्र’ המקור की मानक और प्रसंगानुकूल समानता है।
- source_word: בָּאָרֶץ
  choice: पृथ्वी पर
  rationale: उत्पत्ति 10 के विश्वव्यापी राष्ट्र-सार के संदर्भ में אֶרֶץ का व्यापक अर्थ ‘पृथ्वी’ उपयुक्त है।
- source_word: אַחַר הַמַּבּוּל
  choice: जलप्रलय के बाद
  rationale: यह समय-सूचक पद पिछले प्रलय-वृत्तांत की ओर संकेत करता है; ‘जलप्रलय’ आधुनिक हिन्दी में स्पष्ट और स्थापित शब्द है।
theological_decisions:
- issue: प्रलय के बाद אֶרֶץ का क्षेत्रगत विस्तार
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: राष्ट्रों की तालिका समस्त नूहवंशी जनसमूहों के वितरण का सार देती है, इसलिए व्यापक अर्थ रखा गया है; इसे किसी एक स्थानीय भूभाग तक सीमित नहीं किया गया।
- issue: נִפְרְדוּ में अलगाव और फैलाव का संबंध
  choice: अलग-अलग हो गए
  alternative: बँट गए / फैल गए
  rationale: मूल क्रिया के अलग होने के भाव को प्राथमिकता दी गई है, जबकि ‘फैल गए’ केवल परिणाम को प्रमुख बनाता और ‘बाँटे गए’ किसी बाहरी कर्ता का संकेत दे सकता था।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज गद्य। ‘कुल’ और ‘वंशावलियों’ से वंशगत सारांश का स्वर बना रहता है; वाक्य-रचना मूल के दो भागों और उनके पारस्परिक संबंध को सुरक्षित रखती है।
