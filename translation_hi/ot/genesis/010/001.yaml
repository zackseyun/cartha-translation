source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת בְּנֵי נֹ֔חַ שֵׁ֖ם חָ֣ם וָ/יָ֑פֶת וַ/יִּוָּלְד֥וּ לָ/הֶ֛ם בָּנִ֖ים אַחַ֥ר הַ/מַּבּֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/001.yaml
  text: 'These are the generations of the sons of Noah: Shem[a], Ham, and Japheth. And sons were born to them after the flood.'
translation:
  language: hi
  text: 'नूह के पुत्रों की वंशावली[a] यह है: शेम, हाम और येपेत। और जलप्रलय के बाद उनके पुत्र हुए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नूह के पुत्रों की संतति।” यहाँ “वंशावली” के लिए अनूदित इब्रानी शब्द व्यापक रूप से किसी व्यक्ति की वंश-परंपरा या उससे आगे निकलने वाले वृत्तांत को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: यह है
  rationale: यह अभिव्यक्ति नए खंड का परिचय देती है; हिन्दी में वाक्य के अंत में ‘यह है’ स्वाभाविक और गरिमापूर्ण है। अलग कालसूचक शब्द जोड़ना आवश्यक नहीं है।
- source_word: תּוֹלְדֹת
  choice: वंशावली
  rationale: उत्पत्ति की आवर्ती शीर्षक-सूत्रात्मक संज्ञा को हिन्दी में संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है; इसके व्यापक अर्थ की जानकारी पादटिप्पणी में दी गई है।
- source_word: בְּנֵי נֹחַ
  choice: नूह के पुत्रों
  rationale: इब्रानी संबंधवाची पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: שֵׁם חָם וָיָפֶת
  choice: शेम, हाम और येपेत
  rationale: व्यक्तिनामों का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וַיִּוָּלְדוּ לָהֶם בָּנִים
  choice: उनके पुत्र उत्पन्न हुए
  rationale: निफ़ाल क्रिया के निष्क्रिय/अकर्मक भाव तथा לָהֶם के संबंध/अधिकार भाव को सहज हिन्दी में सुरक्षित रखता है।
- source_word: אַחַר הַמַּבּוּל
  choice: जलप्रलय के बाद
  rationale: מַבּוּל के लिए उत्पत्ति-वृत्तांत में प्रचलित और स्पष्ट हिन्दी पद ‘जलप्रलय’ चुना गया है।
theological_decisions:
- issue: उत्पत्ति के सूत्र תּוֹלְדֹת का अनुवाद
  choice: वंशावली
  alternative: वृत्तांत; वंशज
  rationale: ‘वंशावली’ वंश से निकलने वाली पीढ़ियों का भाव रखती है और शीर्षक के रूप में स्वाभाविक है, पर मूल पद का अर्थ केवल नाम-सूची तक सीमित नहीं किया जाना चाहिए; इसलिए व्यापक विकल्प पादटिप्पणी में रखा गया है।
- issue: लिंगविशिष्ट בָּנִים
  choice: पुत्र
  alternative: संतान
  rationale: मूल शब्द पुल्लिंग बहुवचन है और आगे की वंश-सूची पुरुष वंशजों को नाम देती है; ‘संतान’ इस विशेषता को अस्पष्ट कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; शीर्षक-सूत्र की गरिमा बनाए रखते हुए वाक्यरचना सहज रखी गई है। ‘जलप्रलय’ सामान्य बाइबलीय शब्दावली के अनुरूप है, और नाम इब्रानी के निकट लिप्यंतरित हैं।
