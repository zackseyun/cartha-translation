base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/020.yaml
  text: These are the sons of Ham[a], by their clans, by their languages, in their lands[b], by their nations.
translation:
  language: hi
  text: ये हाम के पुत्र हैं—अपने कुलों के अनुसार, अपनी भाषाओं के अनुसार, अपने देशों में, अपने राष्ट्रों के अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये हैं
  rationale: यह संकेतवाचक पद सारांशात्मक पहचान प्रस्तुत करता है; हिन्दी में ‘ये ... हैं’ स्वाभाविक है।
- source_word: בְנֵי חָם
  choice: हाम के वंशज
  rationale: शाब्दिक अर्थ ‘हाम के पुत्र’ है, पर उत्पत्ति 10 की वंशावली और यहाँ संक्षिप्त किए गए व्यापक समूहों के संदर्भ में ‘वंशज’ आशय अधिक स्पष्ट करता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: अपने-अपने कुलों ... के अनुसार
  rationale: לְ यहाँ समूहों के आधार पर वर्गीकरण व्यक्त करता है; מִשְׁפָּחָה के लिए ‘कुल’ व्यापक रिश्तेदारी-समूह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִלְשֹׁנֹתָם
  choice: भाषाओं ... के अनुसार
  rationale: לָשׁוֹן का शाब्दिक अर्थ ‘जीभ’ भी है, पर यहाँ इसका प्रचलित अर्थ ‘भाषा’ है।
- source_word: בְאַרְצֹתָם
  choice: देशों ... के अनुसार
  rationale: אֶרֶץ यहाँ उन भूभागों को दर्शाता है जहाँ समूह बसे थे; ‘देश’ आधुनिक राष्ट्र-राज्य को अनिवार्यतः सूचित किए बिना सहज हिन्दी देता है।
- source_word: בְגוֹיֵהֶם
  choice: जातियों के अनुसार
  rationale: גּוֹי सामाजिक-जनसमूह अथवा राष्ट्र को दर्शाता है। इस सारांश-सूत्र में בְ को वर्गीकरणात्मक ढंग से व्यक्त किया गया है; ‘जातियाँ’ यहाँ peoples के अर्थ में है।
theological_decisions:
- issue: בְגוֹיֵהֶם में स्थानवाचक और वर्गीकरणात्मक अर्थ के बीच अस्पष्टता
  choice: जातियों के अनुसार
  alternative: अपनी-अपनी जातियों में
  rationale: पद की समानांतर सूची समूहों के आधार पर वर्गीकरण का संकेत देती है, यद्यपि בְ का स्थानवाचक अर्थ भी संभव है। चुनाव किसी धार्मिक सिद्धान्त को निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। सूची में बार-बार ‘अपने-अपने’ और ‘के अनुसार’ दोहराने के बजाय उन्हें साझा संरचना के रूप में रखा गया है। ‘जाति’ का प्रयोग यहाँ जातीय जनसमूह के अर्थ में है, सामाजिक वर्ण या जाति-व्यवस्था के अर्थ में नहीं।
