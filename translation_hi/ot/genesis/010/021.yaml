base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/021.yaml
  text: And to Shem also[a], the father of all the sons of Eber, the brother of Japheth the elder, children were born.
translation:
  language: hi
  text: शेम के भी संतानें हुईं; वह एबेर के सभी पुत्रों का पूर्वज और येपेत का बड़ा भाई था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह बड़े येपेत का भाई था।” इब्रानी विशेषण ‘बड़ा’ शेम या येपेत, दोनों में से किसी के साथ जुड़ सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁם ... יֻלַּד גַּם הוּא
  choice: शेम के भी सन्तानें उत्पन्न हुईं
  rationale: इब्रानी निष्क्रिय वंशावली-वाक्य में निहित सन्तान को हिन्दी में स्पष्ट बहुवचन के रूप में व्यक्त किया गया है; ‘भी’ गַּם הוּא का योगात्मक बल बनाए रखता है।
- source_word: אֲבִי כָּל בְּנֵי עֵבֶר
  choice: एबेर के सब पुत्रों का पूर्वज
  rationale: אָב यहाँ वंशमूल या पूर्वज के अर्थ में है। ‘पूर्वज’ आधुनिक हिन्दी में वास्तविक वंशावली-संबंध को ‘पिता’ की अपेक्षा अधिक स्पष्ट करता है, जबकि ‘पुत्रों’ से בְּנֵי की औपचारिकता बनी रहती है।
- source_word: אֲחִי יֶפֶת הַגָּדוֹל
  choice: येपेत का बड़ा भाई
  rationale: मुख्य पाठ में הַגָּדוֹל को शेम से संबद्ध मानकर आयु में बड़ा व्यक्त किया गया है। इब्रानी में इसका येपेत से संबद्ध होना भी व्याकरणतः संभव है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: הַגָּדוֹל का शेम अथवा येपेत से संबंध
  choice: 'शेम को बड़ा माना: ‘येपेत का बड़ा भाई’'
  alternative: ‘बड़े येपेत का भाई’ अर्थात येपेत बड़ा था
  rationale: इब्रानी वाक्य-विन्यास दोनों संबंधों की अनुमति देता है। मुख्य पाठ एक स्वाभाविक संभावना अपनाता है, पर वास्तविक संदिग्धता को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘उत्पन्न हुईं’ वंशावली की औपचारिक शैली रखता है; नामों के रूप ‘शेम’, ‘एबेर’ और ‘येपेत’ स्रोत के निकट हैं।
