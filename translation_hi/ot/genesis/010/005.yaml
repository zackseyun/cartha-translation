id: GEN.10.5
reference: Genesis 10:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מֵ֠/אֵלֶּה נִפְרְד֞וּ אִיֵּ֤י הַ/גּוֹיִם֙ בְּ/אַרְצֹתָ֔/ם אִ֖ישׁ לִ/לְשֹׁנ֑/וֹ לְ/מִשְׁפְּחֹתָ֖/ם בְּ/גוֹיֵ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/005.yaml
  text: From these the coastlands of the nations were separated in their lands[a], each according to his language, by their clans[c][b], in their nations.
translation:
  language: hi
  text: इन्हीं से जातियों के समुद्र-तटीय प्रदेश[a] अपने-अपने देशों में अलग हुए—हर एक अपनी भाषा के अनुसार[b], अपने-अपने कुलों के अनुसार, अपनी-अपनी जातियों में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जातियों के द्वीप’। इब्रानी शब्द द्वीपों या समुद्र-तटीय प्रदेशों, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘हर पुरुष अपनी भाषा के अनुसार’; यह वितरणात्मक अभिव्यक्ति है, जिसका अर्थ ‘हर एक अपनी भाषा के अनुसार’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: इन्हीं से
  rationale: מִן स्रोत या उद्गम बताता है और אֵלֶּה पहले बताए गए वंशजों की ओर संकेत करता है; बलयुक्त ‘इन्हीं से’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִפְרְדוּ
  choice: अलग हुए
  rationale: פרד के निफ़अल रूप में अलग होने या विभाजित होने का भाव है। ‘अलग हुए’ निष्क्रिय और आत्मवाचक दोनों संभावनाओं को अनावश्यक रूप से सीमित नहीं करता।
- source_word: אִיֵּי הַגּוֹיִם
  choice: जातियों के समुद्र-तटीय प्रदेश
  rationale: אִיִּים द्वीपों के साथ समुद्र-तटीय क्षेत्रों को भी सूचित कर सकता है। यहाँ भौगोलिक और जातीय सूची के संदर्भ में ‘समुद्र-तटीय प्रदेश’ उपयुक्त है, जबकि पादटिप्पणी ‘द्वीप’ की वास्तविक वैकल्पिक संभावना सुरक्षित रखती है।
- source_word: בְּאַרְצֹתָם
  choice: अपने-अपने देशों में
  rationale: אֶרֶץ यहाँ समूहों के भूभाग या देश को सूचित करता है। पुनरुक्त ‘अपने-अपने’ वितरणात्मक भाव को स्पष्ट और सहज बनाता है।
- source_word: אִישׁ לִלְשֹׁנוֹ
  choice: हर एक अपनी भाषा के अनुसार
  rationale: शाब्दिक ‘मनुष्य अपनी भाषा के अनुसार’ यहाँ वितरणात्मक मुहावरा है; ‘हर एक’ उसी अर्थ को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: अपने-अपने कुलों के अनुसार
  rationale: מִשְׁפָּחָה इस वंशावली-संदर्भ में केवल छोटे परिवार के बजाय विस्तृत कुल या वंश-समूह को दर्शाता है।
- source_word: בְּגוֹיֵהֶם
  choice: अपनी-अपनी जातियों में
  rationale: גּוֹי यहाँ जातीय जनसमूह या राष्ट्र को दर्शाता है। ‘जातियों में’ मूल पूर्वसर्ग और अंतिम वर्गीकरण को बनाए रखता है।
theological_decisions:
- issue: אִיֵּי הַגּוֹיִם का संकेत भूभागों की ओर है या समुद्री क्षेत्रों के लोगों की ओर
  choice: 'मुख्य पाठ में भौगोलिक अर्थ: ‘जातियों के समुद्र-तटीय प्रदेश’'
  alternative: ‘समुद्र-तटीय प्रदेशों के लोग’
  rationale: व्याकरणतः स्पष्ट संज्ञा אִיֵּי का सामान्य अर्थ द्वीप/तटीय प्रदेश है; लोगों को प्रत्यक्ष विषय बनाना व्याख्यात्मक स्पष्टता तो देता है, पर मूल की भौगोलिक अभिव्यक्ति को बदल देता है। इसलिए मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘अपने-अपने/अपनी-अपनी’ से पद के वितरणात्मक ढाँचे को स्पष्ट किया गया है। ‘कुल’ वंशावली के संदर्भ में ‘परिवार’ से अधिक उपयुक्त है; ‘जाति’ यहाँ आधुनिक सामाजिक जाति-व्यवस्था नहीं, जनसमूह/राष्ट्र के अर्थ में प्रयुक्त है।
