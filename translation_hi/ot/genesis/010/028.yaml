  yaml_path: translation/ot/genesis/010/028.yaml
  text: and Obal[a], and Abimael, and Sheba.
translation:
  language: hi
  text: और ओबाल, और अबीमाएल, और शबा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: और
  rationale: וְ का अर्थ ‘और’ है। אֶת निश्चित प्रत्यक्ष कर्म को चिह्नित करता है, पर हिन्दी में इसका अलग शब्दगत समकक्ष आवश्यक नहीं है। वंशावली की लय और इब्रानी में प्रत्येक नाम से पहले की पुनरावृत्ति को दर्शाने के लिए हर नाम से पहले ‘और’ रखा गया है।
- source_word: עוֹבָל
  choice: ओबाल
  rationale: यह व्यक्तिवाचक नाम है; इसका अर्थानुवाद न करके इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: אֲבִימָאֵל
  choice: अबीमाएल
  rationale: यह व्यक्तिवाचक नाम है; नाम के आंतरिक अर्थ का अनुवाद करने के बजाय उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: שְׁבָא
  choice: शबा
  rationale: यह व्यक्तिवाचक नाम है। आरंभिक שׁ को ‘श’ और स्वरक्रम को संक्षिप्त, प्रचलित बाइबलीय हिन्दी रूप ‘शबा’ से व्यक्त किया गया है।
