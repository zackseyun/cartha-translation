base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/012.yaml
  text: and Resen[a], between Nineveh and Calah[b]; that is the great city.
translation:
  language: hi
  text: और रेसेन को, जो नीनवे और कालह[a] के बीच है; वही बड़ा नगर है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कालह’ नाम का एक वैकल्पिक अश्शूरी रूप ‘कल्हू’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘वही बड़ा नगर है’ से विशेष रूप से रेसेन का, या नीनवे और कालह के बीच फैले व्यापक नगरीय क्षेत्र का संकेत हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: और ... को भी
  rationale: संयोजक וְ और कर्मचिह्न אֵת नगरों की सूची में एक और कर्म जोड़ते हैं; हिंदी में ‘और ... को भी’ इस क्रम और वाक्यगत संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רֶסֶן
  choice: रेसेन
  rationale: यह स्थानवाचक नाम है, इसलिए इसका अनुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: בֵּין ... וּבֵין
  choice: '... और ... के बीच'
  rationale: यह सहसंबंधी पूर्वसर्गीय रचना दो स्थानों के बीच रेसेन की स्थिति बताती है।
- source_word: נִינְוֵה
  choice: नीनवे
  rationale: हिब्रू स्थान-नाम का हिंदी में प्रचलित बाइबलीय रूप रखा गया है।
- source_word: כָּלַח
  choice: कालह
  rationale: हिब्रू नाम का निकट देवनागरी लिप्यंतरण है; अश्शूरी रूप ‘कल्हू’ को पाठ में आरोपित नहीं किया गया।
- source_word: הִוא
  choice: वही
  rationale: स्वतंत्र सर्वनाम यहाँ पुनरुक्त/संयोजक भूमिका निभाता है; ‘वही’ अंतिम उपवाक्य की संकेतात्मक शक्ति को बनाए रखता है, पर उसके पूर्वपद को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: הָעִיר הַגְּדֹלָה
  choice: बड़ा नगर
  rationale: גדול आकार और महत्त्व दोनों का बोध करा सकता है; ‘बड़ा नगर’ आधुनिक हिंदी में स्वाभाविक है और मूल की अर्थ-सीमा को खुला रखता है।
theological_decisions:
- issue: ‘वही बड़ा नगर है’ का संदर्भ
  choice: मुख्य पाठ में संदर्भ को अनिर्णीत रखा गया है।
  alternative: यह विशेष रूप से रेसेन को, अथवा नीनवे से कालह तक के व्यापक नगरीय क्षेत्र को सूचित कर सकता है।
  rationale: हिब्रू वाक्य-विन्यास अंतिम कथन के सटीक पूर्वपद को निश्चित नहीं करता; इसलिए अनुवाद व्याख्यात्मक विस्तार से किसी एक मत को नहीं चुनता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। स्थान-नामों के प्रचलित हिंदी बाइबलीय रूप अपनाए गए हैं। अर्धविराम अंतिम कथन को अलग दिखाता है, जबकि ‘वही’ मूल पाठ की संदर्भगत अस्पष्टता बनाए रखता है।
