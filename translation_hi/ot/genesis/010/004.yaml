  yaml_path: translation/ot/genesis/010/004.yaml
  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Dodanim.'
translation:
  language: hi
  text: 'और यावान के पुत्र थे: एलीशा, तर्शीश, कित्तीम और दोदानीम[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों और 1 इतिहास 1:7 में ‘दोदानीम’ के स्थान पर ‘रोदानीम’ है।
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: और ... के पुत्र थे
  rationale: वंशावली की इब्रानी अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप; ‘वंशज’ सम्भव है, पर मूल के ‘पुत्र’ को अधिक स्पष्टता से सुरक्षित नहीं रखता।
- source_word: יָוָן
  choice: यावान
  rationale: व्यक्तिवाचक नाम का मूल उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: אֱלִישָׁה
  choice: एलीशा
  rationale: राष्ट्र-सारणी में आए नाम/स्थाननाम का सुबोध देवनागरी लिप्यंतरण।
- source_word: וְ/תַרְשִׁישׁ
  choice: तर्शीश
  rationale: नाम को अनूदित करने के बजाय इब्रानी रूप के निकट लिप्यंतरित किया गया है।
- source_word: כִּתִּים
  choice: कित्तीम
  rationale: जाति अथवा स्थान-सूचक बहुवचन नाम का इब्रानी रूप के निकट लिप्यंतरण।
- source_word: וְ/דֹדָנִים
  choice: दोदानीम
  rationale: मुख्य पाठ WLC/मसोरेटी पाठ के דֹדָנִים का अनुसरण करता है; ‘रोदानीम’ पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
