  naturalness: The proposed revision is fluent modern standard Hindi. “उन्हें अच्छी तरह पकाएँ” is idiomatic in the context of brickmaking, and “के बदले” clearly preserves the functional-substitution parallelism.
  terminology: “बिटुमेन” precisely represents חֵמָר; the footnote supplies an accessible explanation. “गारा” appropriately renders חֹמֶר in this construction context. No doctrinal terminology is involved.
