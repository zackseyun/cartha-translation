  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ הָ֚בָ/ה נִלְבְּנָ֣ה לְבֵנִ֔ים וְ/נִשְׂרְפָ֖ה לִ/שְׂרֵפָ֑ה וַ/תְּהִ֨י לָ/הֶ֤ם הַ/לְּבֵנָה֙ לְ/אָ֔בֶן וְ/הַ֣/חֵמָ֔ר הָיָ֥ה לָ/הֶ֖ם לַ/חֹֽמֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/003.yaml
  text: And each man said to his neighbor[a], “Come, let us make bricks and burn them thoroughly.” And the brick served them for stone[b], and the bitumen served them for mortar.
translation:
  language: hi
  text: और उन्होंने एक-दूसरे से कहा, “आओ, हम ईंटें बनाएँ और उन्हें अच्छी तरह पकाएँ।” पत्थर के बदले उन्होंने ईंटों का इस्तेमाल किया, और गारे के बदले बिटुमेन[a] का।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बिटुमेन” प्राकृतिक डामर या तारकोल-जैसा पदार्थ है, जिसका निर्माण में उपयोग किया जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: वे एक-दूसरे से कहने लगे
  rationale: इब्रानी वितरणात्मक मुहावरे का स्वाभाविक आधुनिक हिन्दी रूप; इससे परस्पर बातचीत का अर्थ स्पष्ट रहता है।
- source_word: הָבָה
  choice: आओ
  rationale: यह सामूहिक प्रोत्साहन देने वाला अव्यय है; ‘आओ’ संक्षिप्त, स्वाभाविक और वर्तमान हिन्दी में उपयुक्त है।
- source_word: נִלְבְּנָה לְבֵנִים
  choice: हम ईंटें बनाएँ
  rationale: संज्ञा ‘ईंट’ से बने इब्रानी क्रियापद का सहज और ठीक अर्थ।
- source_word: וְנִשְׂרְפָה לִשְׂרֵפָה
  choice: उन्हें अच्छी तरह पकाएँ
  rationale: सजातीय क्रिया-संज्ञा की तीव्रता को ‘अच्छी तरह’ व्यक्त करता है; ईंटों के संदर्भ में हिन्दी में ‘पकाना’ ‘जलाना’ से अधिक स्वाभाविक है।
- source_word: וַתְּהִי לָהֶם הַלְּבֵנָה לְאָבֶן
  choice: पत्थर के बदले वे ईंट इस्तेमाल करते थे
  rationale: היה + ל की कार्यात्मक प्रतिस्थापन की भावना को स्पष्ट, प्राकृतिक हिन्दी में व्यक्त करता है।
- source_word: הַחֵמָר
  choice: डामर
  rationale: यहाँ शब्द निर्माण में प्रयुक्त प्राकृतिक बिटुमेन या तारकोल-जैसे पदार्थ को दर्शाता है; ‘डामर’ सामान्य पाठक के लिए सुबोध है।
- source_word: לַחֹמֶר
  choice: गारे के बदले
  rationale: निर्माण-संदर्भ में חֹמֶר जोड़ने वाले गारे की भूमिका बताता है; वाक्य पत्थर/ईंट और गारा/डामर के समानांतर प्रतिस्थापन को बनाए रखता है।
