  yaml_path: translation/ot/genesis/011/030.yaml
  text: Sarai was barren[a]; she had no child.
translation:
  language: hi
  text: सारै बाँझ थी[a]; उसकी कोई संतान नहीं थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और सारै बाँझ थी; उसकी कोई औलाद नहीं थी।”
    reason: शुरुआती संयोजक और וָלָד के निकटार्थी अनुवाद को दर्शाने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: וַתְּהִי
  choice: थी
  rationale: वाव-क्रमयुक्त היה यहाँ कथा में सारै की अवस्था बताता है। हिन्दी में अलग आरंभिक संयोजक जोड़े बिना ‘थी’ स्वाभाविक रूप से यह अर्थ व्यक्त करता है।
- source_word: שָׂרַי
  choice: सारै
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: עֲקָרָה
  choice: बाँझ
  rationale: यह स्त्री की संतान उत्पन्न करने में असमर्थता बताने वाला संक्षिप्त और सामान्य हिन्दी शब्द है; अगला उपवाक्य इसे स्पष्ट करता है।
- source_word: אֵין לָהּ
  choice: उसकी कोई ... नहीं थी
  rationale: हिब्रू अस्तित्ववाचक निषेध और संबंधसूचक प्रत्यय को स्वाभाविक हिन्दी अधिकार-वाक्य में व्यक्त किया गया है।
- source_word: וָלָד
  choice: संतान
  rationale: यहाँ शब्द का अर्थ जन्मी हुई संतान है। ‘संतान’ हिन्दी में सहज है और लिंग को अनावश्यक रूप से निर्धारित नहीं करता।
