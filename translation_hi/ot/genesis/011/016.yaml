lexical_decisions:
- source_word: וַיְחִי
  choice: का हुआ
  rationale: वंशावली के इस सूत्र में חיה अगले वर्णित जन्म तक पहुँची आयु बताता है। हिंदी में ‘चौंतीस वर्ष का हुआ’ स्वाभाविक ढंग से वही अर्थ व्यक्त करता है।
- source_word: עֵבֶר
  choice: एबेर
  rationale: इब्रानी नाम עֵבֶר का निकट और प्रचलित देवनागरी लिप्यंतरण।
- source_word: אַרְבַּע וּשְׁלֹשִׁים שָׁנָה
  choice: चौंतीस वर्ष
  rationale: इब्रानी में संख्या का क्रम शाब्दिक रूप से ‘चार और तीस’ है; आधुनिक हिंदी में ठीक संख्या ‘चौंतीस वर्ष’ स्वाभाविक है।
- source_word: וַיּוֹלֶד
  choice: उससे ... उत्पन्न हुआ
  rationale: पुरुष कर्ता के साथ वंशावली में ילד संतान उत्पन्न करने अर्थात पिता बनने का बोध देता है। यह हिंदी अभिव्यक्ति अर्थ को स्पष्ट, गरिमापूर्ण और सहज रखती है।
- source_word: אֶת
  choice: अलग से अनूदित नहीं
  rationale: यह इब्रानी का निश्चित कर्म-सूचक चिह्न है; हिंदी वाक्य-विन्यास में इसके लिए अलग शब्द आवश्यक नहीं।
- source_word: פָּלֶג
  choice: पेलेग
  rationale: इब्रानी פָּלֶג का निकट देवनागरी लिप्यंतरण।
