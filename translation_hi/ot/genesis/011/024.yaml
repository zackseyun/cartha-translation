- source_word: וַיְחִי
  choice: उनतीस वर्ष का हुआ
  rationale: वंशावली के इस सूत्र में חיה आयु की उस अवधि को बताता है जिसके बाद अगली घटना हुई; स्वाभाविक हिन्दी में इसे आयु के साथ व्यक्त किया गया है।
- source_word: נָחוֹר
  choice: नाहोर
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: תֵּשַׁע וְעֶשְׂרִים שָׁנָה
  choice: उनतीस वर्ष
  rationale: इब्रानी में संख्या का क्रम शाब्दिक रूप से ‘नौ और बीस’ है; आधुनिक हिन्दी में स्वाभाविक क्रम ‘उनतीस’ है।
- source_word: וַיּוֹלֶד
  choice: जन्म दिया
  rationale: हिफ़ील रूप वंशावली में पुरुष के संतान उत्पन्न करने को दर्शाता है; ‘उसने ... को जन्म दिया’ आधुनिक हिन्दी बाइबलीय वंशावलियों में स्पष्ट और सहज है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: निश्चित कर्मसूचक चिह्न का हिन्दी में स्वतंत्र शब्दगत समकक्ष नहीं है; अर्थ सामान्य वाक्य-विन्यास से व्यक्त है।
- source_word: תָּרַח
  choice: तेरह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण; इसे संख्या ‘तेरह’ से अलग समझाने के लिए वाक्य-संदर्भ पर्याप्त है।
