  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: हुआ
  rationale: वंशावली के इस सूत्र में חיה आयु तक जीवित रहने को व्यक्त करता है; हिंदी में ‘तीस वर्ष का हुआ’ स्वाभाविक रूप से यही अर्थ देता है।
- source_word: פֶלֶג
  choice: पेलेग
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण रखा गया है।
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: तीस वर्ष का
  rationale: इब्रानी में शाब्दिक रूप से ‘तीस वर्ष’ है, पर यहाँ यह आयु बताता है; हिंदी में ‘तीस वर्ष का’ स्पष्ट और स्वाभाविक है।
- source_word: וַיּוֹלֶד
  choice: उससे ... उत्पन्न हुआ
  rationale: ילד का हिफ़ील रूप वंशावली में संतान उत्पन्न करने का पुरुष-केंद्रित अर्थ देता है। ‘उससे ... उत्पन्न हुआ’ आधुनिक, गरिमापूर्ण हिंदी है और ‘जन्म दिया’ से पैदा होने वाली मातृ-संबंधी अस्वाभाविकता से बचता है।
- source_word: אֶת
  choice: '[अनूदित नहीं]'
  rationale: यह निश्चित प्रत्यक्ष कर्म का चिह्न है और हिंदी में इसका अलग शब्दगत समकक्ष आवश्यक नहीं है।
- source_word: רְעוּ
  choice: रेऊ
  rationale: इब्रानी नाम רְעוּ का ध्वन्यात्मक हिंदी लिप्यंतरण है।
