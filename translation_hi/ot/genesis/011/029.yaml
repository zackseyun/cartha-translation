base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/029.yaml
  text: Abram and Nahor took wives for themselves. The name of Abram’s wife was Sarai[a], and the name of Nahor’s wife was Milcah, the daughter of Haran, the father of Milcah and of Iscah.
translation:
  language: hi
  text: अब्राम और नाहोर ने अपने-अपने लिए पत्नियाँ लीं[a]। अब्राम की पत्नी का नाम सारै था, और नाहोर की पत्नी का नाम मिल्का था। मिल्का हारान की बेटी थी, और हारान मिल्का और यिस्का का पिता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार अनुवाद: “अब्राम और नाहोर ने विवाह किया।” इब्रानी में शाब्दिक रूप से “अपने लिए पत्नियाँ लीं” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लीं
  rationale: לקח का मूल अर्थ ‘लेना’ है। विवाह के इस प्रसंग में ‘पत्नियाँ लीं’ इब्रानी मुहावरे को सुरक्षित रखता है और हिंदी में समझने योग्य है; अधिक सहज विकल्प ‘विवाह किया’ पादटिप्पणी में दिया गया है।
- source_word: לָהֶם
  choice: अपने-अपने लिए
  rationale: यह रूप दोनों पुरुषों के व्यक्तिगत/वितरणात्मक संबंध को स्पष्ट करता है—प्रत्येक ने अपने लिए पत्नी ली।
- source_word: נָשִׁים
  choice: पत्नियाँ
  rationale: शब्द का अर्थ ‘स्त्रियाँ’ भी हो सकता है, पर विवाह-संदर्भ में ‘पत्नियाँ’ अपेक्षित अर्थ है।
- source_word: שֵׁם אֵשֶׁת
  choice: पत्नी का नाम
  rationale: इब्रानी की ‘पत्नी का नाम’ वाली संरचना और उसकी पुनरावृत्ति को हिंदी में स्वाभाविक ढंग से बनाए रखा गया है।
- source_word: שָׂרָי
  choice: सारै
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण।
- source_word: מִלְכָּה
  choice: मिल्का
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण।
- source_word: בַּת
  choice: बेटी
  rationale: प्रत्यक्ष पारिवारिक संबंध के लिए सामान्य आधुनिक हिंदी शब्द।
- source_word: הָרָן
  choice: हारान
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: אֲבִי
  choice: पिता
  rationale: निकट वंशावली-संदर्भ में אב का सीधा अर्थ ‘पिता’ उपयुक्त है।
- source_word: יִסְכָּה
  choice: यिस्का
  rationale: इब्रानी नाम का स्रोत-सन्निकट देवनागरी लिप्यंतरण।
