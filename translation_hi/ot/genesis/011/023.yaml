  text: וַ/יְחִ֣י שְׂר֗וּג אַחֲרֵ֛י הוֹלִיד֥/וֹ אֶת נָח֖וֹר מָאתַ֣יִם שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/023.yaml
  text: And Serug lived two hundred years after he fathered Nahor, and he fathered sons and daughters.
translation:
  language: hi
  text: और नाहोर का पिता बनने के बाद सरूग दो सौ वर्ष जीवित रहा, और उसके बेटे-बेटियाँ हुईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के इस सूत्र में חיה जीवन की अवधि बताता है; ‘जीवित रहा’ स्वाभाविक आधुनिक हिन्दी है और ‘के बाद’ के साथ ठीक बैठता है।
- source_word: שְׂרוּג
  choice: सरूग
  rationale: इब्रानी नाम का देवनागरी में प्रचलित और स्रोत-सन्निकट लिप्यंतरण।
- source_word: אַחֲרֵי
  choice: के बाद
  rationale: यह कालगत उत्तरवर्तिता व्यक्त करने वाला स्वाभाविक हिन्दी रूप है।
- source_word: הוֹלִידוֹ
  choice: को जन्म देने
  rationale: हिफ़ील ילד वंशावली में पुरुष को संतान का जनक बताता है; हिन्दी में ‘को जन्म देने’ पारंपरिक वंशावली-प्रयोग है, यद्यपि सामान्य प्रयोग में यह मातृ-जन्म का बोध भी करा सकता है।
- source_word: נָחוֹר
  choice: नाहोर
  rationale: इब्रानी नाम का देवनागरी में प्रचलित लिप्यंतरण।
- source_word: מָאתַיִם שָׁנָה
  choice: दो सौ वर्ष
  rationale: अवधि को ठीक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: उसके और भी बेटे-बेटियाँ हुईं
  rationale: शाब्दिक पितृ-कारक भाव को स्वाभाविक हिन्दी वंशावली-शैली में व्यक्त करता है और दोनों लिंगों का स्पष्ट उल्लेख बनाए रखता है; ‘और भी’ कथन के संदर्भगत अर्थ को दर्शाता है कि नाहोर के अतिरिक्त अन्य संतानें हुईं।
