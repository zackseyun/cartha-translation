- from: और नाहोर को जन्म देने के बाद सरूग दो सौ वर्ष जीवित रहा, और उसके और भी बेटे-बेटियाँ हुईं।
  to: और नाहोर का पिता बनने के बाद सरूग दो सौ वर्ष जीवित रहा, और उसके बेटे-बेटियाँ हुईं।
  rationale: The revision corrects the gendered genealogical sense of הוֹלִידוֹ by rendering Serug as becoming Nahor’s father. It retains the Hebrew temporal sequence, the two-hundred-year duration, and the explicit mention of male and female offspring in natural modern Hindi.
