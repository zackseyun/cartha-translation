lexical_decisions:
- source_word: וַיְחִי
  choice: जब ... हुआ
  rationale: वंशावली के इस आयु-सूत्र में חיה का अर्थ किसी निश्चित आयु तक जीवित रहने का है; हिंदी में अगले खंड के साथ ‘जब ... वर्ष का हुआ’ स्वाभाविक और स्पष्ट है।
- source_word: שְׂרוּג
  choice: सरूग
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: तीस वर्ष का
  rationale: हिब्रू का शाब्दिक रूप ‘तीस वर्ष’ है, किंतु यहाँ आयु अभिप्रेत है; आधुनिक हिंदी में ‘तीस वर्ष का’ स्वाभाविक है।
- source_word: וַיּוֹלֶד
  choice: उसने ... को जन्म दिया
  rationale: ילד के हिफ़ील रूप का वंशावली-संबंधी अर्थ संतान उत्पन्न करना है। पुरुष कर्ता के साथ ‘जन्म दिया’ हिंदी बाइबलीय वंशावलियों में सुबोध है और जैविक प्रसव का दावा नहीं करता।
- source_word: אֶת
  choice: को
  rationale: हिब्रू निश्चित कर्म-चिह्न को हिंदी की कर्मोत्तर विभक्ति ‘को’ से वाक्य-संरचना में व्यक्त किया गया है।
- source_word: נָחוֹר
  choice: नाहोर
  rationale: व्यक्तिवाचक नाम का हिब्रू स्वर-रूप के निकट देवनागरी लिप्यंतरण।
