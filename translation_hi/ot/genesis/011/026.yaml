  text: Terah lived seventy years and fathered Abram[a], Nahor, and Haran.
translation:
  language: hi
  text: तेरह सत्तर वर्ष का हुआ और अब्राम[a], नाहोर और हारान का पिता बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शब्दशः, “का पिता हुआ।” इब्रानी वंशावली में प्रयुक्त क्रिया से यह आवश्यक नहीं होता कि पुत्र ठीक इसी क्रम में जन्मे हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: सत्तर वर्ष का हुआ
  rationale: वंशावली के इस प्रयोग में חיה बताई गई आयु तक पहुँचने को व्यक्त करता है। हिंदी में ‘सत्तर वर्ष का हुआ’ स्वाभाविक है और आयु-संबंधी अर्थ स्पष्ट रखता है।
- source_word: שִׁבְעִים שָׁנָה
  choice: सत्तर वर्ष
  rationale: इब्रानी में शब्दशः ‘सत्तर वर्ष’ है; हिंदी वाक्य-विन्यास में ‘का हुआ’ के साथ यह आयु को सहज रूप से व्यक्त करता है।
- source_word: וַיּוֹלֶד
  choice: पिता बना
  rationale: वंशावली में ילד का यह रूप जन्म देने की क्रिया पर नहीं, पुरुष के पिता बनने पर केंद्रित है। ‘पिता बना’ आधुनिक, स्पष्ट और ‘उत्पन्न किया’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: אֶת ... אֶת ... וְאֶת
  choice: अब्राम, नाहोर और हारान
  rationale: बार-बार आया कर्म-सूचक चिह्न प्रत्येक नाम को अलग चिह्नित करता है; हिंदी में स्वाभाविक सूची अल्पविराम और अंतिम ‘और’ से व्यक्त होती है।
- source_word: אַבְרָם
  choice: अब्राम
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: נָחוֹר
  choice: नाहोर
  rationale: व्यक्तिनाम का स्रोत-ध्वनि के निकट और हिंदी बाइबलीय परंपरा में परिचित लिप्यंतरण।
- source_word: הָרָן
  choice: हारान
  rationale: व्यक्तिनाम का स्रोत-ध्वनि के निकट लिप्यंतरण; आरंभिक ה नाम का अंग है, अलग निश्चित उपपद नहीं।
theological_decisions:
- issue: वंशावली का क्रम और आयु का आशय
  choice: 'पद को सीधे वंशावली-सूचना के रूप में रखा गया है: तेरह सत्तर वर्ष का हुआ और इन तीनों का पिता बना; सूची को अनिवार्य जन्मक्रम नहीं माना गया।'
  alternative: नामों को कठोर जन्मक्रम मानना, या यह स्पष्ट जोड़ना कि सत्तर वर्ष की आयु में तेरह के पुत्र होने आरंभ हुए।
  rationale: इब्रानी पाठ तीनों पुत्रों के नाम देता है, पर अपने आप यह निर्धारित नहीं करता कि वे इसी क्रम में जन्मे, एक साथ जन्मे, अथवा सभी ठीक उसी आयु में जन्मे। अनुवाद बाद के कालक्रम से कोई सामंजस्य आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण वंशावली-शैली। ‘जन्म दिया’ से बचा गया है क्योंकि कर्ता पुरुष है; ‘पिता बना’ स्रोत के आशय को स्वाभाविक हिंदी में रखता है।
