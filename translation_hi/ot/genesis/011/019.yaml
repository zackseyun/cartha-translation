translation:
  language: hi
  text: और पेलेग रेऊ को जन्म देने के बाद दो सौ नौ वर्ष जीवित रहा, और उसने बेटे-बेटियों को जन्म दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के इस सूत्र में חיה नामित पुत्र के जन्म के बाद की जीवन-अवधि बताता है; ‘जीवित रहा’ स्वाभाविक और सटीक हिन्दी है।
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת רְעוּ
  choice: रेऊ को जन्म देने के बाद
  rationale: אַחֲרֵי समयगत उत्तरकाल दर्शाता है और ילד का हिफ़ील रूप पुरुष कर्ता द्वारा संतान उत्पन्न करने को व्यक्त करता है; हिन्दी में ‘को जन्म देने के बाद’ स्पष्ट और सहज है।
- source_word: תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: दो सौ नौ वर्ष
  rationale: हिब्रू में संख्या का क्रम ‘नौ और दो सौ’ है; आधुनिक हिन्दी की स्वाभाविक संख्या-रचना के अनुसार इसे ‘दो सौ नौ’ किया गया है।
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: उसके और भी बेटे-बेटियाँ हुईं
  rationale: हिब्रू स्पष्ट रूप से पुत्रों और पुत्रियों दोनों का उल्लेख करता है। हिन्दी का यह वंशावली-वाक्यांश पितृत्व का आशय स्वाभाविक ढंग से रखता है; ‘और भी’ नामित पुत्र रेऊ के अतिरिक्त संतानों का भाव स्पष्ट करता है।
