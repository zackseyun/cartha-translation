base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/015.yaml
  text: And Shelah lived 403 years after he fathered Eber[a], and he fathered sons and daughters.
translation:
  language: hi
  text: एबेर का पिता बनने के बाद शेलह चार सौ तीन वर्ष जीवित रहा, और उसके और भी बेटे-बेटियाँ हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के इस सूत्र में חיה जीवन की अवधि बताता है; ‘जीवित रहा’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: שֶׁלַח
  choice: शेलह
  rationale: यह रूप इब्रानी नाम שֶׁלַח के उच्चारण के निकट है।
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת עֵבֶר
  choice: एबेर का पिता बनने के बाद
  rationale: हिफ़ील रूप הוֹלִיד पुरुष वंशावली में संतान का पिता बनने का अर्थ देता है। यह हिन्दी में स्वाभाविक है और पुरुष के लिए असहज ‘जन्म देने’ से बचता है।
- source_word: עֵבֶר
  choice: एबेर
  rationale: यह लिप्यंतरण इब्रानी עֵבֶר के स्वर और व्यंजन-रूप को निकटता से दर्शाता है।
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: चार सौ तीन वर्ष
  rationale: इब्रानी पदबंध का शाब्दिक क्रम ‘तीन वर्ष और चार सौ वर्ष’ है, पर उसका सामान्य संख्यात्मक अर्थ 403 वर्ष है; हिन्दी में प्रचलित संख्या-क्रम अपनाया गया है।
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: और उसके और भी बेटे-बेटियाँ हुए
  rationale: इब्रानी में पुरुष कर्ता के साथ ילד का अर्थ संतान उत्पन्न करना या उनका पिता होना है। हिन्दी में यह वाक्यांश स्वाभाविक रूप से वही वंशावली-संबंध व्यक्त करता है और ‘बेटे-बेटियाँ’ दोनों को स्पष्ट रखता है।
