id: GEN.11.6
reference: Genesis 11:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה הֵ֣ן עַ֤ם אֶחָד֙ וְ/שָׂפָ֤ה אַחַת֙ לְ/כֻלָּ֔/ם וְ/זֶ֖ה הַחִלָּ֣/ם לַ/עֲשׂ֑וֹת וְ/עַתָּה֙ לֹֽא יִבָּצֵ֣ר מֵ/הֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/006.yaml
  text: And Yahweh said[a], "Behold, they are one people, and they all have one language, and this is what they have begun to do. And now nothing that they plan to do will be withheld from them."
translation:
  language: hi
  text: और याहवे ने कहा, “देखो, ये एक ही लोग हैं और इन सबकी भाषा एक ही है। उन्होंने यह काम अभी शुरू ही किया है। अब वे जो कुछ भी करने की योजना बनाएँगे, वह उनकी पहुँच से बाहर नहीं रहेगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उनके लिए असंभव नहीं होगा”; अथवा, “उसे उनसे रोका नहीं जा सकेगा।”
    reason: בצר के निफ़ाल रूप में अप्राप्य या असंभव होने और रोके जाने—दोनों अर्थ-संभावनाएँ हैं।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में निकट लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: הֵן
  choice: देखो
  rationale: यह दैवी अवलोकन की ओर ध्यान खींचने वाला स्वाभाविक और वर्तमान हिन्दी प्रयोग है।
- source_word: עַם אֶחָד
  choice: एक ही जाति
  rationale: यहाँ עַם एक जनसमुदाय को सूचित करता है; ‘जाति’ को राजनीतिक राष्ट्र के सीमित अर्थ में नहीं, एक लोगों के समूह के अर्थ में लिया गया है। ‘ही’ उनकी एकता पर बल देता है।
- source_word: וְשָׂפָה אַחַת לְכֻלָּם
  choice: इन सबकी भाषा एक ही है
  rationale: שָׂפָה का शाब्दिक अर्थ ‘होंठ’ है, पर यहाँ उसका मुहावरेदार अर्थ भाषा है; לְכֻלָּם का सामूहिक बल ‘इन सबकी’ से व्यक्त हुआ है।
- source_word: וְזֶה הַחִלָּם לַעֲשׂוֹת
  choice: यह तो उनके काम की शुरुआत है
  rationale: חלל का हिफ़ील रूप यहाँ आरम्भ करने को दर्शाता है। हिन्दी वाक्य वर्तमान कार्य को आगे होने वाले काम के आरम्भिक चरण के रूप में प्रस्तुत करता है, बिना अनावश्यक विवरण जोड़े।
- source_word: לֹא יִבָּצֵר מֵהֶם
  choice: उनकी पहुँच से बाहर नहीं रहेगा
  rationale: בצר के निफ़ाल रूप में ‘रोक दिया जाना’, ‘दुर्गम होना’ अथवा ‘असंभव होना’ जैसे अर्थ संभव हैं। चुना गया वाक्यांश क्षमता और अप्राप्यता—दोनों की छाया को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כֹּל אֲשֶׁר יָזְמוּ לַעֲשׂוֹת
  choice: वे जो कुछ भी करने की योजना बनाएँगे
  rationale: יזם सोचकर योजना बनाने या ठानने को दर्शाता है; यह अनुवाद भावी योजनाबद्ध कार्यों के व्यापक दायरे को स्पष्ट रखता है।
theological_decisions:
- issue: एकजुट मानवता की क्षमता के विषय में कथन का दायरा
  choice: कथन को इस कथा की परिस्थिति में एक भाषा और साझा उद्देश्य से जुड़ी मानवीय क्षमता के रूप में रखा गया है।
  alternative: इसे मनुष्य की निरपेक्ष सामर्थ्य, अतिशयोक्ति, या परमेश्वर द्वारा कुछ न रोके जाने का स्पष्ट सिद्धान्त माना जाए।
  rationale: इब्रानी कथन कथानक के भीतर सशक्त है, पर वह न तो उनके कार्य का अनुमोदन करता है और न मनुष्य को सर्वशक्तिमान घोषित करता है। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ ध्यानाकर्षक הֵן का स्वाभाविक रूप है; वाक्य-विन्यास में इब्रानी की प्रगति—अवलोकन, आरम्भ और परिणाम—सुरक्षित है।
