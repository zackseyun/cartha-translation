  yaml_path: translation/ot/genesis/011/010.yaml
  text: These are the generations of Shem. Shem was one hundred years old[a], and he fathered Arpachshad two years after the flood.
translation:
  language: hi
  text: शेम की वंशावली इस प्रकार है। शेम सौ वर्ष का था, जब जलप्रलय के दो वर्ष बाद वह अर्पक्षद[a] का पिता बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ अनुवादों में इस नाम का रूप ‘अर्फक्षद’ मिलता है; यह इब्रानी के बजाय यूनानी रूप पर आधारित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: वंशावली इस प्रकार है
  rationale: उत्पत्ति में यह एक आवर्ती वंश-सूत्र है। यह हिंदी में स्वाभाविक ढंग से उस वंश-विवरण का परिचय देता है जो आगे आता है।
- source_word: שֵׁם
  choice: शेम
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: בֶּן מְאַת שָׁנָה
  choice: सौ वर्ष का था
  rationale: इब्रानी आयु-सूचक मुहावरे, जिसका शाब्दिक रूप ‘सौ वर्ष का पुत्र’ है, का स्वाभाविक हिंदी रूप।
- source_word: וַיּוֹלֶד
  choice: पिता बना
  rationale: हिफ़ील रूप वंशावली में संतान उत्पन्न करने या पिता बनने को दर्शाता है; यह आधुनिक हिंदी में स्वाभाविक और पुरुष की वंशगत भूमिका के अनुरूप है।
- source_word: אַרְפַּכְשָׁד
  choice: अर्पक्षद
  rationale: इब्रानी नाम का सीधा देवनागरी लिप्यंतरण; यूनानी-आधारित पारंपरिक रूप को पादटिप्पणी में रखा गया है।
- source_word: שְׁנָתַיִם
  choice: दो वर्ष
  rationale: ‘वर्ष’ का द्विवचन रूप सीधे दो वर्ष दर्शाता है।
- source_word: אַחַר הַמַּבּוּל
  choice: जलप्रलय के ... बाद
  rationale: निश्चित पदबंध नूह के समय के प्रसिद्ध जलप्रलय की ओर संकेत करता है; ‘जलप्रलय’ हिंदी बाइबलीय संदर्भ में स्पष्ट और गरिमापूर्ण है।
