translation:
  language: hi
  text: और रऊ सरूग का पिता बनने के बाद दो सौ सात वर्ष जीवित रहा, और उसके बेटे और बेटियाँ हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के इस सूत्र में חיה का स्वाभाविक और गरिमापूर्ण हिन्दी रूप ‘जीवित रहा’ है।
- source_word: רְעוּ
  choice: रू
  rationale: इब्रानी नाम רְעוּ का निकट देवनागरी लिप्यंतरण ‘रू’ है।
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שְׂרוּג
  choice: सरूग का पिता बनने के बाद
  rationale: हिफ़ील ילד यहाँ पुरुष कर्ता के संबंध में संतान उत्पन्न करने का अर्थ देता है; ‘पिता बनने’ से आशय आधुनिक हिन्दी में सहज और स्पष्ट रहता है। שְׂרוּג को ‘सरूग’ लिप्यंतरित किया गया है।
- source_word: שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: दो सौ सात वर्ष
  rationale: इब्रानी संख्या-क्रम को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: उसके और भी बेटे-बेटियाँ हुए
  rationale: इब्रानी में पुत्र और पुत्रियाँ दोनों स्पष्ट हैं। हिन्दी वंशावली शैली में ‘उसके ... हुए’ स्वाभाविक है, और ‘और भी’ संदर्भगत रूप से बताता है कि सरूग के अतिरिक्त अन्य संतानें हुईं।
