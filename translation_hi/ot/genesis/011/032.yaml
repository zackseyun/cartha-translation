  yaml_path: translation/ot/genesis/011/032.yaml
  text: The days of Terah were two hundred and five years, and Terah died in Haran.
translation:
  language: hi
  text: तेरह की कुल आयु दो सौ पाँच वर्ष हुई। फिर तेरह की मृत्यु हारान में हुई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי תֶרַח
  choice: तेरह की कुल आयु ... हुई
  rationale: शाब्दिक रूप ‘तेरह के दिन’ इब्रानी में जीवनकाल का मुहावरा है। आधुनिक हिन्दी में ‘कुल आयु’ उसी अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: תֶרַח
  choice: तेरह
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण किया गया है।
- source_word: חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה
  choice: दो सौ पाँच वर्ष
  rationale: इब्रानी में संख्या का क्रम ‘पाँच और दो सौ’ है; हिन्दी में इसे प्रचलित संख्या-क्रम में रखा गया है।
- source_word: וַיָּמָת
  choice: की मृत्यु ... हुई
  rationale: मूल क्रिया का सीधा अर्थ ‘मरना’ है। ‘मृत्यु हुई’ गरिमापूर्ण, स्पष्ट और बिना अनावश्यक व्यंजना के स्वाभाविक हिन्दी है।
- source_word: בְּחָרָן
  choice: हारान में
  rationale: स्थान-सूचक בְּ का यहाँ स्वाभाविक हिन्दी समतुल्य ‘में’ है।
