lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: और अरपक्षद
  rationale: संयोजक וְ वंशावली की क्रमबद्ध कड़ी को बनाए रखता है। नाम אַרְפַּכְשַׁד को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: חַי חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  choice: पैंतीस वर्ष का हुआ
  rationale: हिब्रू का शाब्दिक क्रम ‘पाँच और तीस वर्ष’ है; आधुनिक मानक हिन्दी में आयु बताने का स्वाभाविक रूप ‘पैंतीस वर्ष का हुआ’ है।
- source_word: וַ/יּוֹלֶד
  choice: उसने … को जन्म दिया
  rationale: हिफ़ील रूप यहाँ वंशावली में पुरुष के संतान उत्पन्न करने का बोध देता है। हिन्दी में ‘जन्म दिया’ सहज है, यद्यपि सामान्य प्रयोग में यह कभी-कभी माता के प्रसव के लिए भी आता है; कर्ता ‘उसने’ और वंशावली का संदर्भ अर्थ स्पष्ट करते हैं।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का चिह्न है; हिन्दी में इसका कार्य ‘को’ और वाक्य-रचना से व्यक्त होता है।
- source_word: שָׁלַח
  choice: शेलह
  rationale: मसोरेटी हिब्रू שָׁלַח का निकट देवनागरी लिप्यंतरण ‘शेलह’ है।
