  text: הָ֚בָ/ה נֵֽרְדָ֔ה וְ/נָבְלָ֥ה שָׁ֖ם שְׂפָתָ֑/ם אֲשֶׁר֙ לֹ֣א יִשְׁמְע֔וּ אִ֖ישׁ שְׂפַ֥ת רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/007.yaml
  text: Come, let us go down there and confuse their language, so that one man will not understand the language of his neighbor.
translation:
  language: hi
  text: आओ, हम नीचे उतरें और वहाँ उनकी भाषा को ऐसी गड़बड़ा दें कि कोई व्यक्ति अपने साथी की भाषा न समझ सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: आओ
  rationale: यह परामर्श या सामूहिक आह्वान का स्वाभाविक हिन्दी रूप है।
- source_word: נֵרְדָה
  choice: हम नीचे उतरें
  rationale: हिब्रू के प्रथम पुरुष बहुवचन प्रेरणार्थक भाव को स्पष्ट रूप से बनाए रखता है।
- source_word: וְנָבְלָה
  choice: और ... ऐसी गड़बड़ी डाल दें
  rationale: मूल क्रिया यहाँ भाषा को इस प्रकार अस्त-व्यस्त करने का भाव देती है कि लोग परस्पर समझ न सकें; यह हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: שְׂפָתָם
  choice: उनकी भाषा
  rationale: शाब्दिक अर्थ 'उनके होंठ' है, पर इस प्रसंग में 'भाषा' अभिप्रेत है।
- source_word: אִישׁ שְׂפַת רֵעֵהוּ
  choice: कोई भी अपने साथी की भाषा
  rationale: हिब्रू मुहावरे का अर्थ एक व्यक्ति द्वारा दूसरे की भाषा समझना है; 'साथी' רֵעַ के संबंधपरक, गैर-लिंग-विशिष्ट आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय वक्तव्य में प्रथम पुरुष बहुवचन
  choice: हम नीचे उतरें
  alternative: मैं नीचे उतरूँ
  rationale: मूल पाठ का बहुवचन बिना किसी विशिष्ट त्रित्ववादी, स्वर्गीय सभा-संबंधी, या आलंकारिक व्याख्या को आरोपित किए सुरक्षित रखा गया है।
- issue: भाषा की गड़बड़ी का उद्देश्य
  choice: कि कोई भी अपने साथी की भाषा न समझ सके
  alternative: जिससे वे एक-दूसरे की बात न समझें
  rationale: उद्देश्यसूचक אֲשֶׁר לֹא और मूल के व्यक्ति-से-साथी संबंध को यथासंभव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमामय किंतु सामान्य पाठक के लिए सहज। मूल की सामूहिक आज्ञार्थक शैली और बहुवचन को सुरक्षित रखा गया है।
