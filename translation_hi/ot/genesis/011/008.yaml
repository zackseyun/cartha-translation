source:
  edition: WLC
  text: וַ/יָּ֨פֶץ יְהוָ֥ה אֹתָ֛/ם מִ/שָּׁ֖ם עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַֽ/יַּחְדְּל֖וּ לִ/בְנֹ֥ת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/008.yaml
  text: So Yahweh scattered them from there over the face of all the earth[a], and they stopped building the city.
translation:
  language: hi
  text: इस प्रकार याहवे ने उन्हें वहाँ से सारी पृथ्वी पर[a] तितर-बितर कर दिया, और उन्होंने नगर बनाना छोड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सारी पृथ्वी के मुख पर”; अर्थात “सारी पृथ्वी में” या “पूरी पृथ्वी पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: तितर-बितर कर दिया
  rationale: פוץ का causative अर्थ लोगों को अलग-अलग स्थानों में बिखेर देना है। ‘तितर-बितर कर दिया’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में दण्डात्मक भाव को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: यह बाबेल के उसी स्थान की ओर संकेत करने वाला सीधा और स्वाभाविक स्थानवाचक अनुवाद है।
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: इब्रानी मुहावरे का शाब्दिक रूप ‘सारी पृथ्वी के मुख पर’ है। मुख्य पाठ में ‘सारी पृथ्वी पर’ स्पष्ट और स्वाभाविक हिन्दी है; मूल बिंब पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיַּחְדְּלוּ
  choice: छोड़ दिया
  rationale: חדל यहाँ किसी चल रहे कार्य को बन्द कर देने का अर्थ देता है। ‘बनाना छोड़ दिया’ हिन्दी में सहज प्रयोग है।
- source_word: לִבְנֹת
  choice: बनाना
  rationale: इब्रानी infinitive construct को हिन्दी में ‘छोड़ दिया’ के साथ स्वाभाविक क्रियार्थक रूप ‘बनाना’ से व्यक्त किया गया है।
- source_word: הָעִיר
  choice: नगर
  rationale: यह निकटवर्ती प्रसंग में निर्माणाधीन निश्चित नगर का उल्लेख करता है। ‘नगर’ dignified किंतु सामान्य आधुनिक हिन्दी शब्द है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में उपाधि नहीं, व्यक्तिगत ईश्वरीय नाम है; इसलिए उसे ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। आधुनिक मानक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप को चुना गया, जबकि ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापूर्ण लिप्यंतरण है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप। इब्रानी वाक्यक्रम और कारण-परिणाम की गति को यथासंभव बनाए रखते हुए कठिन मुहावरे को मुख्य पाठ में स्वाभाविक बनाया गया है।
