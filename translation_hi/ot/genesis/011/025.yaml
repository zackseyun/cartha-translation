base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/025.yaml
  text: Nahor lived one hundred nineteen years after he fathered Terah, and he fathered sons and daughters.
translation:
  language: hi
  text: तेरह का पिता बनने के बाद नाहोर एक सौ उन्नीस वर्ष जीवित रहा, और वह बेटों और बेटियों का पिता बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: और जीवित रहा
  rationale: वंशावली के इस सूत्र में क्रिया जन्म के बाद जारी जीवन-अवधि बताती है; ‘और जीवित रहा’ इस निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־תֶּרַח
  choice: तेरह के जन्म के बाद
  rationale: हिब्रू पदबंध तेरह को जन्म देने के बाद की अवधि बताता है। हिन्दी में ‘तेरह के जन्म के बाद’ स्वाभाविक है और अर्थ को स्पष्ट रखता है।
- source_word: תֶּרַח
  choice: तेरह
  rationale: नाम का रूप हिब्रू उच्चारण के निकट और हिन्दी पाठकों के लिए सरल रखा गया है।
- source_word: תְּשַׁע עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה
  choice: एक सौ उन्नीस वर्ष
  rationale: हिब्रू में संख्या उन्नीस और सौ के क्रम में है; सामान्य हिन्दी संख्या-क्रम में इसे ‘एक सौ उन्नीस’ कहा जाता है।
- source_word: וַיּוֹלֶד
  choice: उसके और भी ... हुईं
  rationale: यहाँ ילד पुरुष कर्ता के संदर्भ में संतान उत्पन्न होने का वंशावली-सूत्र है। शाब्दिक ‘उसने जन्म दिया’ हिन्दी में अनुचित होगा; ‘उसके ... हुईं’ स्वाभाविक रूप से पितृत्व व्यक्त करता है। ‘और भी’ अनाम संतानों के आगे जन्म लेने का आशय स्पष्ट करता है, बिना उनकी संख्या निर्धारित किए।
- source_word: בָּנִים וּבָנוֹת
  choice: बेटे-बेटियाँ
  rationale: मूल पाठ पुत्रों और पुत्रियों दोनों को अलग-अलग नाम देता है; ‘बेटे-बेटियाँ’ उस विशिष्टता को सहज आधुनिक हिन्दी में बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण वंशावली-शैली वाला वाक्य। ‘और जीवित रहा’ तथा ‘और भी बेटे-बेटियाँ हुईं’ से हिब्रू सूत्र की क्रमिकता बनी रहती है; कोई पादटिप्पणी आवश्यक नहीं है।
