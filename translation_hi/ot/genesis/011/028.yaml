  text: וַ/יָּ֣מָת הָרָ֔ן עַל פְּנֵ֖י תֶּ֣רַח אָבִ֑י/ו בְּ/אֶ֥רֶץ מוֹלַדְתּ֖/וֹ בְּ/א֥וּר כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/028.yaml
  text: And Haran died in the presence of Terah his father[a], in the land of his birth, in Ur of the Chaldeans.
translation:
  language: hi
  text: और हारान अपने पिता तेरह के सामने[a], अपनी जन्मभूमि में, कसदियों के ऊर में मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पिता तेरह के जीते-जी,” अर्थात् जब उसका पिता अभी जीवित था। इब्रानी मुहावरे का शाब्दिक अर्थ “के मुख के ऊपर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: מות के वय्यिक्तोल रूप में बीती हुई कथात्मक घटना सीधे व्यक्त होती है; हिन्दी में ‘मर गया’ इसका स्वाभाविक समतुल्य है।
- source_word: עַל־פְּנֵי
  choice: के सामने
  rationale: यह इब्रानी मुहावरे की ठोस छवि को बनाए रखता है और ‘उपस्थिति में/जीते-जी’ के सम्भावित अर्थों को अनावश्यक रूप से एक ही अर्थ में सीमित नहीं करता।
- source_word: תֶּרַח אָבִיו
  choice: अपने पिता तेरह
  rationale: यह तेरह को हारान के पिता के रूप में स्पष्ट करता है और आधुनिक हिन्दी में स्वाभाविक शब्दक्रम अपनाता है।
- source_word: בְּאֶרֶץ מוֹלַדְתּוֹ
  choice: अपनी जन्मभूमि में
  rationale: מוֹלֶדֶת जन्मस्थान अथवा पैतृक/मूल भूमि को सूचित करता है; ‘जन्मभूमि’ संक्षिप्त, स्वाभाविक और अर्थानुकूल है।
- source_word: בְּאוּר כַּשְׂדִּים
  choice: कसदियों के ऊर में
  rationale: אוּר स्थान-नाम है और כַּשְׂדִּים जातिनाम; यह प्रचलित हिन्दी बाइबलीय स्थान-संज्ञा को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: עַל־פְּנֵי का आशय
  choice: मुख्य पाठ में ‘के सामने’
  alternative: ‘अपने पिता तेरह के जीते-जी’ अथवा ‘अपने पिता तेरह से पहले’
  rationale: मूल मुहावरा उपस्थिति और कालगत पूर्वता—दोनों की ओर संकेत कर सकता है। मुख्य पाठ ठोस अभिव्यक्ति रखता है और पादटिप्पणी सम्भावित कालगत अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक गद्य। ‘के सामने’ मूल मुहावरे की अस्पष्टता बचाता है; पादटिप्पणी उसका सम्भावित कालगत अर्थ स्पष्ट करती है।
