  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת תֶּ֔רַח תֶּ֚רַח הוֹלִ֣יד אֶת אַבְרָ֔ם אֶת נָח֖וֹר וְ/אֶת הָרָ֑ן וְ/הָרָ֖ן הוֹלִ֥יד אֶת לֽוֹט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/027.yaml
  text: 'These are the generations of Terah: Terah fathered Abram, Nahor, and Haran; and Haran fathered Lot.'
translation:
  language: hi
  text: 'तेरह की वंशावली यह है: तेरह अब्राम, नाहोर और हारान का पिता बना; और हारान लूत का पिता बना।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: यह है
  rationale: यह अभिव्यक्ति नए वंश-वृत्तांत का परिचय देती है। आरंभिक וְ को अलग से ‘और’ कहना आधुनिक हिन्दी में अनावश्यक और असहज होता; वाक्य की परिचयात्मक रचना उसके प्रवचन-संबंधी कार्य को व्यक्त करती है।
- source_word: תּוֹלְדֹת
  choice: वंशावली
  rationale: उत्पत्ति में यह बार-बार आने वाला संरचनात्मक पद है, जो किसी व्यक्ति से आगे बढ़ने वाली वंश-रेखा और उससे जुड़े वृत्तांत का परिचय देता है। ‘वंशावली’ हिन्दी में संक्षिप्त, परिचित और प्रसंगानुकूल है, यद्यपि मूल शब्द का दायरा केवल नामों की सूची से व्यापक हो सकता है।
- source_word: תֶּרַח
  choice: तेरह
  rationale: इब्रानी नाम תֶּרַח का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: הוֹלִיד
  choice: पिता बना
  rationale: वंशावली के प्रसंग में हिफ़ील क्रिया का अर्थ संतान उत्पन्न करना अथवा किसी का पिता होना है। ‘पिता बना’ आधुनिक हिन्दी में स्वाभाविक है और पुरुष के लिए असहज लग सकने वाले ‘जन्म दिया’ से बचते हुए संबंध को स्पष्ट करता है।
- source_word: אַבְרָם נָחוֹר הָרָן לוֹט
  choice: अब्राम, नाहोर, हारान, लूत
  rationale: व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
theological_decisions: []
