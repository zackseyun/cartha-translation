  language: hi
  text: और रऊ बत्तीस वर्ष का हुआ, तब वह सरूग का पिता बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: का हुआ
  rationale: वंशावली के इस सूत्र में חיה बताई गई आयु तक जीवित रहने को व्यक्त करता है; हिंदी में आयु के साथ ‘बत्तीस वर्ष का हुआ’ स्वाभाविक और अर्थ-सटीक है।
- source_word: רְעוּ
  choice: रऊ
  rationale: इब्रानी उच्चारण rəʿû को निकटता से दर्शाने वाला सरल देवनागरी लिप्यंतरण।
- source_word: שְׁתַּיִם וּשְׁלֹשִׁים שָׁנָה
  choice: बत्तीस वर्ष
  rationale: इब्रानी ‘दो और तीस वर्ष’ का आधुनिक हिंदी में स्वाभाविक संख्यात्मक क्रम।
- source_word: וַיּוֹלֶד
  choice: उससे ... उत्पन्न हुआ
  rationale: हिफ़ील रूप वंशावली में संतान उत्पन्न करने का अर्थ देता है। यह हिंदी अभिव्यक्ति पुरुष के पिता बनने का भाव स्पष्ट करती है और पुरातन ‘जना’ से अधिक स्वाभाविक है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित प्रत्यक्ष कर्म का चिह्न है; हिंदी में इसका पृथक शाब्दिक समकक्ष आवश्यक नहीं।
- source_word: שְׂרוּג
  choice: सरूग
  rationale: इब्रानी śərûḡ का सरल और स्रोत-समीप देवनागरी लिप्यंतरण।
