lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के इस सूत्र में क्रिया जन्म के बाद शेष जीवनकाल को बताती है; ‘जीवित रहा’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: אַרְפַּכְשַׁד
  choice: अर्पक्षद
  rationale: यह रूप इब्रानी नाम के व्यंजनों को निकटता से देवनागरी में प्रस्तुत करता है।
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שֶׁלַח
  choice: शेलह को जन्म देने के बाद
  rationale: हिफ़ील रूप पुरुष कर्ता के संतान उत्पन्न करने का बोध देता है; हिन्दी में पिता के विषय में ‘जन्म देने’ का प्रयोग वंशावली-संदर्भ में सहज है।
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 वर्ष
  rationale: इब्रानी संख्या-क्रम का अर्थ ठीक रखते हुए आधुनिक हिन्दी में स्वाभाविक अंक-रूप अपनाया गया है।
- source_word: וַיּוֹלֶד
  choice: उससे ... उत्पन्न हुए
  rationale: यह पुरुष कर्ता से संतानों की उत्पत्ति को स्पष्ट करता है और दूसरे ‘जन्म देने’ की असहज पुनरावृत्ति से बचता है।
- source_word: בָּנִים וּבָנוֹת
  choice: बेटे-बेटियाँ
  rationale: मूल पाठ में पुत्र और पुत्रियाँ दोनों अलग-अलग उल्लिखित हैं; यह बोलचाल में सुबोध और फिर भी गरिमापूर्ण है।
