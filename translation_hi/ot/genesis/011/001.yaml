  rationale: यहाँ היה का रूप कथा की आरम्भिक स्थिति प्रस्तुत करता है। आधुनिक हिन्दी में वाक्य के अंत का ‘थी’ इस स्थितिवाचक अर्थ को स्वाभाविक ढंग से व्यक्त करता है; अलग से ‘और ऐसा हुआ’ कहना अनावश्यक और बोझिल होता।
- source_word: כָל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: אָרֶץ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है। बाबेल के व्यापक मानव-संदर्भ में ‘सारी पृथ्वी’ उपयुक्त है; ‘पर’ हिन्दी में भाषा के सार्वत्रिक प्रचलन को सहज रूप देता है।
- source_word: שָׂפָה אֶחָת
  choice: एक ही भाषा
  rationale: שָׂפָה का शाब्दिक अर्थ ‘होंठ’ है, पर इस मुहावरे में यह भाषा या बोली को दर्शाता है। ‘एक ही’ אֶחָת से व्यक्त एकरूपता पर स्वाभाविक हिन्दी में बल देता है।
- source_word: וּדְבָרִים אֲחָדִים
  choice: और एक ही शब्दावली
  rationale: דְּבָרִים का मूल अर्थ ‘शब्द/बातें’ है और אֲחָדִים यहाँ समानता या एकरूपता दर्शाता है। ‘एक ही शब्दावली’ पहले पद ‘भाषा’ की अनावश्यक पुनरावृत्ति से बचते हुए साझा शब्दों या अभिव्यक्ति के सम्भावित अर्थ को बनाए रखता है।
