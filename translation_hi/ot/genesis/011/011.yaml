translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण वंशावली शैली। मूल पाठ की क्रमबद्धता और स्पष्ट लैंगिक पदों को बनाए रखते हुए कृत्रिम पुनरुक्ति से बचने के लिए दूसरे ילד को स्वाभाविक हिन्दी में व्यक्त किया गया है।
