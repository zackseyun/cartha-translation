  text: וַֽ/יְחִי שֵׁ֗ם אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת אַרְפַּכְשָׁ֔ד חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/011.yaml
  text: And Shem lived five hundred years after he fathered Arpachshad, and he fathered sons and daughters.
translation:
  language: hi
  text: अरपक्षद का पिता बनने के बाद शेम पाँच सौ वर्ष जीवित रहा, और उसके और भी बेटे-बेटियाँ हुईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के संदर्भ में חיה की यह क्रिया बताती है कि शेम बताई गई अवधि तक आगे जीवित रहा।
- source_word: שֵׁם
  choice: शेम
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת אַרְפַּכְשָׁד
  choice: अरपक्षद का पिता बनने के बाद
  rationale: हिफ़इल ילד पुरुष कर्ता के साथ जन्म देने में पिता की भूमिका व्यक्त करता है; यह हिन्दी में स्वाभाविक और स्पष्ट है। अरपक्षद नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: पाँच सौ वर्ष
  rationale: अवधि बताने वाली इब्रानी संख्या का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: और उसके और भी बेटे-बेटियाँ हुईं
  rationale: इब्रानी पाठ बेटे और बेटियाँ दोनों को स्पष्ट करता है। हिन्दी की स्वाभाविक वंशावली शैली में यह वाक्य पिता बनने का अर्थ बनाए रखता है; 'और भी' पूर्वोक्त अरपक्षद के अतिरिक्त अन्य संतानों का संकेत स्पष्ट करता है।
