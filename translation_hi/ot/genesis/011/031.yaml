source:
  edition: WLC
  text: וַ/יִּקַּ֨ח תֶּ֜רַח אֶת אַבְרָ֣ם בְּנ֗/וֹ וְ/אֶת ל֤וֹט בֶּן הָרָן֙ בֶּן בְּנ֔/וֹ וְ/אֵת֙ שָׂרַ֣י כַּלָּת֔/וֹ אֵ֖שֶׁת אַבְרָ֣ם בְּנ֑/וֹ וַ/יֵּצְא֨וּ אִתָּ֜/ם מֵ/א֣וּר כַּשְׂדִּ֗ים לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֥אוּ עַד חָרָ֖ן וַ/יֵּ֥שְׁבוּ שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/031.yaml
  text: Terah took Abram his son[a], Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they set out together from Ur of the Chaldeans to go to the land of Canaan[c][b]. But when they came as far as Haran, they settled there.
translation:
  language: hi
  text: तेरह ने अपने बेटे अब्राम, हारान के बेटे लूत—जो उसका पोता था[a]—और अपनी बहू सारै, जो उसके बेटे अब्राम की पत्नी थी, को साथ लिया। वे कसदियों के ऊर से कनान देश जाने के लिए उनके साथ निकल पड़े[b]। वे हारान तक आए और वहीं बस गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “हारान का बेटा, उसके बेटे का बेटा”; अर्थात लूत तेरह का पोता था।'
    reason: lexical_alternative
  - marker: b
    text: 'या भावार्थ: “वे सब साथ निकल पड़े।” इब्रानी में शाब्दिक रूप से “वे उनके साथ निकल पड़े” है।'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: साथ लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है; यात्रा के प्रसंग में ‘साथ लिया’ स्वाभाविक हिन्दी है और परिवार के सदस्यों को लेकर प्रस्थान करने का भाव व्यक्त करता है।
- source_word: לוֹט בֶּן הָרָן בֶּן בְּנוֹ
  choice: हारान के बेटे लूत—जो उसका पोता था
  rationale: इब्रानी पदबंध शाब्दिक रूप से ‘हारान का बेटा, उसके बेटे का बेटा’ कहता है। ‘पोता’ सम्बन्ध स्पष्ट करता है, जबकि हारान के बेटे की पहचान भी बनाए रखता है।
- source_word: כַּלָּתוֹ
  choice: अपनी बहू
  rationale: כַּלָּה यहाँ तेरह की पुत्रवधू को सूचित करता है; आधुनिक हिन्दी में ‘बहू’ सहज और सटीक है।
- source_word: אֵשֶׁת אַבְרָם בְּנוֹ
  choice: जो उसके बेटे अब्राम की पत्नी थी
  rationale: यह समानाधिकरण सारै का पारिवारिक सम्बन्ध स्पष्ट करता है और इब्रानी सूचना को स्वाभाविक हिन्दी में रखता है।
- source_word: וַיֵּצְאוּ אִתָּם
  choice: वे … उनके साथ निकल पड़े
  rationale: मसोरेटिक पाठ में क्रिया बहुवचन ‘वे निकले’ और सर्वनाम ‘उनके साथ’ है। इसकी असहज, सम्भवतः अतिव्यापी संदर्भ-रचना को मुख्य पाठ में सुरक्षित रखा गया है; पाठान्तर/भावार्थ फुटनोट में दिया गया है।
- source_word: מֵאוּר כַּשְׂדִּים
  choice: कसदियों के ऊर से
  rationale: स्थाननाम और जातिसूचक पद का प्रचलित, समकालीन हिन्दी रूप।
- source_word: לָלֶכֶת אַרְצָה כְּנַעַן
  choice: कनान देश जाने के लिए
  rationale: क्रियार्थक रूप और दिशासूचक प्रत्यय उद्देश्य तथा गन्तव्य व्यक्त करते हैं।
- source_word: וַיָּבֹאוּ עַד חָרָן
  choice: वे हारान तक आए
  rationale: עַד का ‘तक’ अर्थ सुरक्षित रहता है; यह केवल गन्तव्य पर पहुँचने से अधिक मूल संरचना के निकट है।
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: वहीं बस गए
  rationale: ישׁב प्रवास/निवास के इस प्रसंग में बसने या रहने को दर्शाता है; ‘बस गए’ यात्रा-वृत्तान्त में स्वाभाविक है।
theological_decisions:
- issue: וַיֵּצְאוּ אִתָּם में बहुवचन कर्ता और ‘उनके साथ’ का असहज सम्बन्ध
  choice: मुख्य पाठ में ‘वे … उनके साथ निकल पड़े’ रखकर मसोरेटिक पाठ की वास्तविक कठिनाई सुरक्षित की गई।
  alternative: ‘वे सब साथ निकल पड़े’
  rationale: भावार्थ विकल्प अधिक सहज है, पर वह मूल में मौजूद सर्वनामगत तनाव को चुपचाप मिटा देता है। इसलिए उसे फुटनोट में रखा गया है।
- issue: अन्तिम वाक्य में प्रतिकूलतासूचक अर्थ
  choice: सरल क्रमसूचक ‘वे … आए और … बस गए’
  alternative: ‘लेकिन जब वे … पहुँचे, तो … बस गए’
  rationale: इब्रानी में सामान्य וַ क्रम है; कनान पहुँचने के इरादे और हारान में बसने के बीच निहित विरोध को हिन्दी में स्पष्ट ‘लेकिन’ जोड़कर बढ़ाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; भाषा सरल किंतु गरिमापूर्ण रखी गई है। ‘बहू’, ‘साथ लिया’, ‘निकल पड़े’ और ‘बस गए’ सामान्य पाठक के लिए स्वाभाविक हैं। नामों के रूप ‘तेरह’, ‘अब्राम’, ‘हारान’, ‘लूत’, ‘सारै’, ‘कनान’ और ‘ऊर’ अपनाए गए हैं।
