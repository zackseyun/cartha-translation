id: GEN.11.4
reference: Genesis 11:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ הָ֣בָ/ה נִבְנֶה לָּ֣/נוּ עִ֗יר וּ/מִגְדָּל֙ וְ/רֹאשׁ֣/וֹ בַ/שָּׁמַ֔יִם וְ/נַֽעֲשֶׂה לָּ֖/נוּ שֵׁ֑ם פֶּן נָפ֖וּץ עַל פְּנֵ֥י כָל הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/004.yaml
  text: And they said[a], “Come, let us build for ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves[b], lest we be scattered over the face of the whole earth.”
translation:
  language: hi
  text: और उन्होंने कहा, “आओ, हम अपने लिए एक नगर और एक मीनार बनाएँ, जिसका सिरा आकाश में हो[a]; और हम अपने लिए एक नाम बनाएँ[b], कहीं ऐसा न हो कि हम सारी पृथ्वी पर तितर-बितर हो जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “जिसका सिर आकाशों में हो।” इसका अर्थ “जिसका सिरा आकाश तक पहुँचे” भी समझा जा सकता है।'
    reason: इब्रानी की सजीव स्थानवाचक अभिव्यक्ति और उसके स्वाभाविक अर्थ—दोनों को दिखाने के लिए।
  - marker: b
    text: अर्थात, अपने लिए प्रतिष्ठा स्थापित करें।
    reason: ‘नाम बनाएँ’ इब्रानी मुहावरे को निकटता से रखता है; टिप्पणी उसका अभिप्राय स्पष्ट करती है।
lexical_decisions:
- source_word: הָבָה
  choice: आओ
  rationale: यह मिलकर कार्य करने का आह्वान करने वाला उद्गार है; ‘आओ’ आधुनिक हिन्दी में इसके प्रोत्साहनात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נִבְנֶה לָּנוּ
  choice: हम अपने लिए ... बनाएँ
  rationale: प्रथम पुरुष बहुवचन का रूप साझा संकल्प या आग्रह व्यक्त करता है; לָּנוּ को ‘अपने लिए’ कहना उसके हितार्थक-आत्मवाचक भाव को स्पष्ट रखता है।
- source_word: עִיר וּמִגְדָּל
  choice: एक नगर और एक मीनार
  rationale: दोनों संज्ञाओं के सामान्य अर्थ क्रमशः ‘नगर’ और ‘मीनार’ हैं; प्रसंग मीनार के किसी विशेष सैनिक उपयोग को निर्दिष्ट नहीं करता।
- source_word: וְרֹאשׁוֹ בַשָּׁמַיִם
  choice: जिसका सिरा आकाश में हो
  rationale: रֹאשׁ का शाब्दिक अर्थ ‘सिर’ और यहाँ ‘सिरा/चोटी’ है। अनुवाद इब्रानी के स्थानवाचक कथन को रखता है और ‘आकाश तक पहुँचे’ जैसा क्रियात्मक भाव नहीं जोड़ता।
- source_word: וְנַעֲשֶׂה לָּנוּ שֵׁם
  choice: हम अपने लिए एक नाम बनाएँ
  rationale: यह इब्रानी मुहावरे की साहित्यिक छवि को बनाए रखता है और साथ ही प्रतिष्ठा स्थापित करने का आशय हिन्दी में समझने योग्य रहता है।
- source_word: פֶּן נָפוּץ
  choice: कहीं ऐसा न हो कि हम ... तितर-बितर हो जाएँ
  rationale: פֶּן आशंकित या टाले जाने वाले परिणाम का परिचय देता है। ‘कहीं ऐसा न हो’ आधुनिक हिन्दी में स्वाभाविक है, और ‘तितर-बितर हो जाएँ’ फैलाकर अलग कर दिए जाने या बिखर जाने के भाव को जानबूझकर खुला रखता है।
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: आदिकालीन कथा के व्यापक मानव-संदर्भ में הָאָרֶץ स्थानीय भूभाग के बजाय पृथ्वी को सूचित करता है; हिन्दी में ‘सारी पृथ्वी पर’ मुहावरे का सहज और संक्षिप्त रूप है।
theological_decisions:
- issue: बाबेल की कथा में הָאָרֶץ का विस्तार
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: उत्पत्ति 11 के आदिकालीन और समस्त मानवता से जुड़े प्रसंग में कथानक लोगों के पूरे बसे हुए संसार में फैलने की बात करता है, न कि केवल किसी स्थानीय भूभाग की।
- issue: נָפוּץ में कर्तृवाच्य अथवा कर्मवाच्य का भाव
  choice: तितर-बितर हो जाएँ
  alternative: हमें तितर-बितर कर दिया जाए
  rationale: इब्रानी रूप स्वयं कर्मवाच्य नहीं है, यद्यपि प्रसंग बाहरी बिखराव की आशंका भी जगा सकता है। चुना हुआ हिन्दी रूप कारण या कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नगर’, ‘मीनार’, ‘आकाश’ और ‘पृथ्वी’ जैसे परिचित शब्द चुने गए हैं। वाक्य की पुनरावृत्त संकल्पात्मक लय—‘हम ... बनाएँ’—मूल पाठ के सामूहिक आग्रह को बनाए रखती है।
