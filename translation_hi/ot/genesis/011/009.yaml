source:
  edition: WLC
  text: עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ בָּבֶ֔ל כִּי שָׁ֛ם בָּלַ֥ל יְהוָ֖ה שְׂפַ֣ת כָּל הָ/אָ֑רֶץ וּ/מִ/שָּׁם֙ הֱפִיצָ֣/ם יְהוָ֔ה עַל פְּנֵ֖י כָּל הָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/009.yaml
  text: Therefore its name was called Babel[a], because there Yahweh confused the language of all the earth, and from there Yahweh scattered them over the face of all the earth.
translation:
  language: hi
  text: इस कारण उसका नाम बाबेल[a] रखा गया, क्योंकि वहाँ याहवे ने सारी पृथ्वी की भाषा को गड़बड़ा दिया, और वहीं से याहवे ने उन्हें सारी पृथ्वी पर तितर-बितर कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बाबेल” नाम की ध्वनि इब्रानी क्रिया बालाल से मिलती है, जिसका अर्थ “मिलाना” या “गड़बड़ाना” है; इसी शब्द-साम्य से इस पद में नाम की व्याख्या की गई है।
    reason: मूल इब्रानी के शब्दालंकार को स्पष्ट करना, जिसे हिंदी मुख्य पाठ में पूरी तरह बनाए रखना संभव नहीं है।
lexical_decisions:
- source_word: עַל כֵּן
  choice: इस कारण
  rationale: यह नामकरण का कारण बताने वाला निष्कर्षसूचक पद है; ‘इस कारण’ आधुनिक हिंदी में स्वाभाविक है और इब्रानी की कारणात्मक शक्ति बनाए रखता है।
- source_word: קָרָא שְׁמָהּ
  choice: उसका नाम … रखा गया
  rationale: इब्रानी मुहावरा शाब्दिक रूप से ‘उसने उसका नाम पुकारा’ है। हिंदी का कर्मवाच्य नामकरण को स्वाभाविक ढंग से व्यक्त करता है और अनिर्दिष्ट कर्ता जोड़ने से बचता है।
- source_word: בָּבֶל
  choice: बाबेल
  rationale: स्थान के नाम का लिप्यंतरण किया गया है। בלל के साथ ध्वनि-साम्य हिंदी में सीधे व्यक्त नहीं होता, इसलिए इसकी व्याख्या पादटिप्पणी में दी गई है।
- source_word: כִּי שָׁם
  choice: क्योंकि वहाँ
  rationale: यह नामकरण का कारण और उसका स्थान स्पष्ट करता है।
- source_word: בָּלַל
  choice: गड़बड़ी डाल दी
  rationale: क्रिया का मूल भाव मिलाना या अस्त-व्यस्त करना है; यहाँ परिणामतः भाषा/वाणी का परस्पर अबोध हो जाना अभिप्रेत है। ‘गड़बड़ी डाल दी’ इस सक्रिय कारणात्मक अर्थ को सहज हिंदी में रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: שְׂפַת כָּל הָאָרֶץ
  choice: सारी पृथ्वी की भाषा
  rationale: שָׂפָה का शाब्दिक अर्थ ‘होंठ’ है, पर यहाँ यह भाषा या वाणी का मुहावरा है। ‘भाषा’ प्रसंग में स्पष्ट और स्वाभाविक है।
- source_word: וּמִשָּׁם
  choice: और वहीं से
  rationale: यह उसी स्थान की ओर फिर संकेत करता है जहाँ भाषा में गड़बड़ी डाली गई थी; ‘वहीं’ उस संबंध को स्पष्ट रखता है।
- source_word: הֱפִיצָם
  choice: उन्हें … तितर-बितर कर दिया
  rationale: हिफ़ील रूप लोगों को भौगोलिक रूप से फैला देने का कारणात्मक अर्थ देता है; ‘तितर-बितर कर दिया’ हिंदी में इसे स्पष्ट करता है।
- source_word: עַל פְּנֵי כָּל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: इब्रानी का शाब्दिक मुहावरा ‘सारी पृथ्वी के मुख पर’ है। हिंदी में ‘सारी पृथ्वी पर’ वही व्यापक भौगोलिक अर्थ स्वाभाविक रूप से देता है और पद में पृथ्वी की पुनरावृत्ति बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम प्रत्यक्ष रूप से आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। इब्रानी मुहावरों को अर्थानुकूल हिंदी में रखा गया है, नाम-संबंधी शब्दालंकार को पादटिप्पणी में संरक्षित किया गया है।
