  text: And Eber lived after he fathered Peleg four hundred and thirty years[a], and he fathered sons and daughters.
translation:
  language: hi
  text: पेलेग का पिता बनने के बाद एबेर चार सौ तीस वर्ष जीवित रहा, और वह बेटों और बेटियों का पिता बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: वंशावली के इस सूत्र में חיה जीवन की अवधि बताता है; ‘जीवित रहा’ स्वाभाविक हिन्दी है और जन्म के बाद जारी जीवन को स्पष्ट करता है।
- source_word: עֵבֶר
  choice: एबेर
  rationale: हिब्रू व्यक्तिगत नाम עֵבֶר का निकट और प्रचलित देवनागरी लिप्यंतरण।
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג
  choice: पेलेग का पिता बनने के बाद
  rationale: हिफ़ील הוֹלִיד वंशावली में संतान उत्पन्न करने या पिता बनने का अर्थ देता है। यह रूप आधुनिक हिन्दी में स्वाभाविक है और पुरुष के लिए भ्रामक ‘जन्म देने’ से बचता है।
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: चार सौ तीस वर्ष
  rationale: हिब्रू में संख्या का क्रम ‘तीस और चार सौ’ है; हिन्दी में कुल अवधि स्वाभाविक क्रम से ‘चार सौ तीस’ कही जाती है।
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: उसके बेटे-बेटियाँ हुए
  rationale: यह स्वाभाविक हिन्दी में वंश-वृद्धि व्यक्त करता है और मूल में स्पष्ट दोनों वर्गों—बेटों और बेटियों—को बनाए रखता है।
theological_decisions: []
