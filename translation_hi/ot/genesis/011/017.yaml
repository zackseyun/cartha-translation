  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वंशावली की संक्षिप्त शैली बनाए रखते हुए ऐसे शाब्दिक प्रयोग से बचा गया है जो हिन्दी में पुरुष के स्वयं प्रसव करने का आभास दे सकता था।
