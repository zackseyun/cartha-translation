  text: וַ/יֵּ֣רֶד יְהוָ֔ה לִ/רְאֹ֥ת אֶת הָ/עִ֖יר וְ/אֶת הַ/מִּגְדָּ֑ל אֲשֶׁ֥ר בָּנ֖וּ בְּנֵ֥י הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/005.yaml
  text: Then Yahweh came down to see the city and the tower that the sons of man had built[a].
translation:
  language: hi
  text: तब याहवे उस नगर और उस मीनार को देखने के लिए नीचे उतरा, जिन्हें मनुष्यों ने बनाया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, शाब्दिक रूप से, ‘मनुष्य के पुत्रों ने’—इब्रानी वाक्यांश यहाँ सामूहिक रूप से मानव प्राणियों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: नीचे उतरा
  rationale: यह ירד के ठोस अर्थ ‘नीचे उतरना’ को बनाए रखता है और मानवरूपी वर्णन को अमूर्त नहीं करता।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का आधुनिक हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: לִרְאֹת
  choice: देखने के लिए
  rationale: यह ראה के सीधे अर्थ को रखता है; ‘जाँचने’ जैसा अनावश्यक अर्थ नहीं जोड़ता।
- source_word: הָעִיר
  choice: उस नगर
  rationale: עִיר का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; निश्चित उपपद को प्रसंगानुसार ‘उस’ से व्यक्त किया गया है।
- source_word: הַמִּגְדָּל
  choice: उस मीनार
  rationale: מִגְדָּל का मानक हिन्दी अर्थ; निश्चितता को ‘उस’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר בָּנוּ
  choice: जिन्हें … ने बनाया था
  rationale: सम्बन्धवाचक उपवाक्य और पूर्वकालिक निर्माण को स्वाभाविक हिन्दी में व्यक्त करता है। बहुवचन ‘जिन्हें’ नगर और मीनार दोनों की ओर संकेत करता है।
- source_word: בְּנֵי הָאָדָם
  choice: मनुष्य के पुत्रों
  rationale: शाब्दिक रूप को सुरक्षित रखते हुए मानवजाति-सामूहिक अर्थ की वास्तविक व्यापकता पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: यहवे के नीचे उतरने का मानवरूपी वर्णन
  choice: ठोस अभिव्यक्ति ‘नीचे उतरा’ को बनाए रखा गया।
  alternative: ‘नीचे देखा’ या ‘ध्यान दिया’
  rationale: इब्रानी कथा परमेश्वर के कार्य को मानवरूपी भाषा में प्रस्तुत करती है; इसे अमूर्त करने से साहित्यिक और धर्मवैचारिक तनाव घट जाता।
- issue: בְּנֵי הָאָדָם का प्रतिनिधिक अर्थ
  choice: मुख्य पाठ में ‘मनुष्य के पुत्रों’
  alternative: ‘मनुष्यों’ या ‘मानवजाति’
  rationale: मुख्य पाठ इब्रानी की पुरुषवाची संरचना को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि वाक्यांश सामूहिक रूप से मानव प्राणियों को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नगर’ और ‘मीनार’ सामान्य हिन्दी पाठक के लिए स्पष्ट हैं। ‘मनुष्य के पुत्रों’ की स्रोत-सदृश अभिव्यक्ति कुछ औपचारिक है, इसलिए उसका सामूहिक अर्थ पादटिप्पणी में दिया गया है।
