  choice: शेलह
  rationale: इब्रानी שֶׁלַח का देवनागरी में निकट और स्पष्ट लिप्यंतरण; परंपरागत रूपों को मूल पाठ पर वरीयता नहीं दी गई।
- source_word: חַי
  choice: जीवित रहा
  rationale: वंशावली के सूत्र में यह क्रिया अगली घटना से पहले की आयु बताती है; हिन्दी में ‘तीस वर्ष जीवित रहा, तब’ स्वाभाविक रूप से यही संबंध व्यक्त करता है।
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: तीस वर्ष
  rationale: मूल की अवधि/आयु-सूचक अभिव्यक्ति को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया।
- source_word: וַ/יּוֹלֶד
  choice: उसने ... को जन्म दिया
  rationale: हिफ़ील रूप का वंशावली-संबंधी अर्थ व्यक्त करता है। आधुनिक हिन्दी में यह पिता के विषय में भी प्रचलित है और ‘उत्पन्न किया’ की अपेक्षा अधिक सहज है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का चिह्न है; हिन्दी में इसका कार्य ‘को’ से व्यक्त होता है।
- source_word: עֵבֶר
  choice: एबेर
  rationale: इब्रानी עֵבֶר का सीधा देवनागरी लिप्यंतरण; ‘हेबेर’ जैसी परंपरागत मध्यस्थ वर्तनी से बचा गया।
