id: GEN.35.1
reference: Genesis 35:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶֽל יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית אֵ֖ל וְ/שֶׁב שָׁ֑ם וַ/עֲשֵׂה שָׁ֣ם מִזְבֵּ֔חַ לָ/אֵל֙ הַ/נִּרְאֶ֣ה אֵלֶ֔י/ךָ בְּ/בָרְחֲ/ךָ֔ מִ/פְּנֵ֖י עֵשָׂ֥ו אָחִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/001.yaml
  text: Then God said to Jacob[a], “Arise, go up to Bethel and dwell there, and make there an altar to the God who appeared to you when you fled from the presence of Esau your brother.”
translation:
  language: hi
  text: तब परमेश्वर ने याकूब से कहा, “उठ, बेतेल जा और वहीं रह। वहाँ उस परमेश्वर के लिए एक वेदी बना, जो तुझे उस समय दिखाई दिया था जब तू अपने भाई एसाव से बचकर भागा था।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “तेरे भाई एसाव के सामने/उपस्थिति से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम का स्वाभाविक संकेत देता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ क्रिया एकवचन है और प्रसंग इस्राएल के एक परमेश्वर की ओर संकेत करता है; हिन्दी बाइबिलीय प्रयोग में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: קוּם עֲלֵה
  choice: उठ, ... जा
  rationale: दोनों आदेशों को अलग रखा गया है। बेतेल की ओर ऊँचाई का भाव עֲלֵה में है, पर ‘बेतेल को चढ़ जा’ आधुनिक हिन्दी में अस्वाभाविक है; ‘जा’ लक्ष्यगत गति को स्पष्ट करता है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: स्थापित स्थान-नाम का लिप्यंतरण किया गया है, अर्थानुवाद ‘परमेश्वर का घर’ नहीं।
- source_word: וְשֶׁב שָׁם
  choice: और वहीं रह
  rationale: ישב यहाँ निवास करने अथवा ठहरने का आदेश देता है; ‘वहीं रह’ सहज आधुनिक हिन्दी है और स्थान पर बल बनाए रखता है।
- source_word: וַעֲשֵׂה שָׁם מִזְבֵּחַ
  choice: वहाँ ... एक वेदी बना
  rationale: עשה का मूल अर्थ ‘बनाना/करना’ है; वेदी के साथ ‘बना’ स्वाभाविक है और इब्रानी के निकट भी।
- source_word: לָאֵל הַנִּרְאֶה אֵלֶיךָ
  choice: उस परमेश्वर के लिए ... जो तुझे ... दिखाई दिया था
  rationale: ל समर्पण/उद्देश्य व्यक्त करता है और संबंधवाचक उपवाक्य परमेश्वर की पहचान बताता है। Niphal रूप को हिन्दी में स्वाभाविक ‘दिखाई दिया’ से व्यक्त किया गया है।
- source_word: בְּבָרְחֲךָ
  choice: उस समय ... जब तू ... भागा था
  rationale: ב सहित infinitive construct समयगत परिस्थिति बताता है; यह रूप हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מִפְּנֵי עֵשָׂו אָחִיךָ
  choice: अपने भाई एसाव के सामने से
  rationale: מִפְּנֵי के ‘मुख/सामने/उपस्थिति से’ वाले चित्र को हिन्दी में ‘सामने से’ द्वारा बनाए रखा गया है; इसका आशय एसाव से बचकर भागना है।
theological_decisions:
- issue: אֱלֹהִים का संदर्भ
  choice: एक परमेश्वर के लिए ‘परमेश्वर’
  alternative: देवताओं
  rationale: एकवचन क्रिया और कथात्मक प्रसंग स्पष्ट करते हैं कि वक्ता और वेदी का अभिप्रेत इस्राएल का परमेश्वर है, बहुवचन देवता नहीं।
- issue: בֵּית אֵל का प्रस्तुतीकरण
  choice: स्थान-नाम ‘बेतेल’
  alternative: ‘परमेश्वर का घर’ के रूप में अर्थानुवाद
  rationale: यहाँ शब्द एक स्थापित भौगोलिक नाम के रूप में प्रयुक्त है; अर्थानुवाद से स्थान-नाम की पहचान धुंधली हो सकती है।
- issue: ‘उस परमेश्वर’ में पहचानसूचक बल
  choice: संबंधवाचक वाक्य के साथ ‘उस परमेश्वर’
  alternative: केवल ‘परमेश्वर’
  rationale: इब्रानी निश्चित लेख और अगले संबंधवाचक वाक्य के पहचानसूचक बल को हिन्दी में सुरक्षित रखा गया है; इससे किसी अलग देवता का संकेत नहीं, बल्कि पहले प्रकट हुए परमेश्वर की पहचान होती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज शैली। परमेश्वर द्वारा याकूब को सीधे संबोधन में एकवचन निकटता-सूचक ‘तू/तुझे’ रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘सामने से भागा’ इब्रानी मुहावरे की छवि और प्रसंगगत अर्थ दोनों को पर्याप्त रूप से व्यक्त करता है।
