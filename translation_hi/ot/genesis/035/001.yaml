review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the speaker, commands, Bethel, residence, altar, and the identifying clause concerning the God who appeared to Jacob. However, “अपने भाई एसाव के सामने से भागा था” is not idiomatic Hindi for fleeing from someone and can suggest fleeing from a position in front of Esau rather than fleeing away from him. The source idiom מִפְּנֵי is best rendered in the text as “एसाव से बचकर,” with its literal imagery preserved in a note.
  naturalness: The register is generally clear, dignified modern Hindi. “बेतेल को जा” is understandable, though “बेतेल जा” is more idiomatic standard Hindi. The revised wording retains the directional command without forcing an unnatural literal equivalent for “go up.”
  terminology: “परमेश्वर,” “बेतेल,” “वेदी,” “याकूब,” and “एसाव” are appropriate and consistent. “उस परमेश्वर” properly conveys the identifying force of the Hebrew article plus participial clause. A footnote is appropriate for the Hebrew idiom behind the smoother Hindi rendering of מִפְּנֵי.
  issues:
  - severity: medium
    issue: “अपने भाई एसाव के सामने से भागा था” is misleading and unnatural.
    rationale: In modern Hindi, “X के सामने से भागना” normally describes movement away from a location in front of X, not flight away from X. The Hebrew means that Jacob fled from Esau’s presence/away from Esau. A natural contextual rendering with a literal note preserves both sense and source imagery.
  - severity: low
    issue: “बेतेल को जा” is less idiomatic than “बेतेल जा.”
    rationale: The latter is standard contemporary Hindi for movement to a named destination. Hindi cannot naturally preserve the Hebrew ascent nuance here without a cumbersome expression.
