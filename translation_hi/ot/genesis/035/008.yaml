base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
translation:
  language: hi
  text: रिबका की धाय दबोरा मर गई, और उसे बेतेल से नीचे, उस बलूत के वृक्ष[a] के तले दफनाया गया। तब उसने उसका नाम अल्लोन-बाकूत[b] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द אַלּוֹן बलूत या तारपीन वृक्ष को दर्शा सकता है; वृक्ष की ठीक जाति निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: अल्लोन-बाकूत का संभावित अर्थ ‘रोने का बलूत का वृक्ष’ है; यदि אַלּוֹן को ‘तारपीन वृक्ष’ माना जाए, तो अर्थ ‘रोने का तारपीन वृक्ष’ होगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵינֶקֶת
  choice: धाय
  rationale: यह संज्ञा बच्चे को दूध पिलाने और उसकी देखभाल करनेवाली स्त्री को दर्शाती है। ‘धाय’ संक्षिप्त और प्रसंगानुकूल है तथा रिबका के साथ उसके लंबे संबंध की संभावना को खुला रखता है।
- source_word: מִתַּחַת לְבֵית אֵל
  choice: बेतेल से नीचे
  rationale: यह स्थान को बेतेल की अपेक्षा नीचे दर्शाता है; इसे बिना आधार किसी निश्चित दिशा, जैसे दक्षिण, में नहीं बदला गया।
- source_word: תַּחַת הָאַלּוֹן
  choice: उस बाँज वृक्ष के तले
  rationale: תַּחַת का स्थानवाचक अर्थ ‘के तले’ है। אַלּוֹן को मुख्य पाठ में प्रचलित अर्थ ‘बाँज वृक्ष’ दिया गया है, जबकि वृक्ष की जाति की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: तब उसने उसका नाम ... रखा
  rationale: इब्रानी क्रिया कर्तृवाच्य, पुल्लिंग एकवचन है, पर कर्ता स्पष्ट रूप से बताया नहीं गया। ‘उसने’ उसी निहित कर्ता को बनाए रखता है, और ‘उसका’ वृक्ष अथवा उस स्थान के संदर्भ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אַלּוֹן בָּכוּת
  choice: अल्लोन-बाकूत
  rationale: मुख्य पाठ में स्थान-नाम का लिप्यंतरण किया गया है; उसका संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַתִּקָּבֵר
  choice: उसे ... दफनाया गया
  rationale: निफ़अल रूप स्वाभाविक रूप से कर्मवाच्य है; यह अनिर्दिष्ट दफनानेवालों को पाठ में नहीं जोड़ता।
- source_word: וַתָּמָת
  choice: मर गई
  rationale: इब्रानी क्रिया मृत्यु को सीधे व्यक्त करती है; हिंदी में ‘मर गई’ उसी स्पष्टता को स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: नाम रखनेवाले निहित कर्ता की पहचान
  choice: ‘उसने’ द्वारा निहित पुल्लिंग एकवचन कर्ता को रखा गया, पर उसका नाम नहीं जोड़ा गया।
  alternative: स्पष्ट रूप से ‘याकूब ने’ कहना, अथवा कर्मवाच्य ‘उसका नाम रखा गया’ कहना।
  rationale: मूल पाठ में कर्ता व्याकरणतः पुल्लिंग एकवचन है, किंतु इस पद में उसका नाम नहीं है। ‘उसने’ रूपगत सूचना बचाता है और पहचान को अतिरिक्त रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धाय’ संबंध को संक्षेप में व्यक्त करता है; स्थान और वृक्ष के लिए सामान्य हिंदी वाक्य-विन्यास अपनाया गया है। नाम का लिप्यंतरण किया गया है और अर्थ को पादटिप्पणी में रखा गया है।
