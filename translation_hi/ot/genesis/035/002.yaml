source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל בֵּית֔/וֹ וְ/אֶ֖ל כָּל אֲשֶׁ֣ר עִמּ֑/וֹ הָסִ֜רוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/תֹכְ/כֶ֔ם וְ/הִֽטַּהֲר֔וּ וְ/הַחֲלִ֖יפוּ שִׂמְלֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/002.yaml
  text: Then Jacob said to his household and to all who were with him[a], “Put away the foreign gods that are among you, purify yourselves[b], and change your clothes.”
translation:
  language: hi
  text: तब याकूब ने अपने घराने और उन सब लोगों से जो उसके साथ थे कहा, “तुम्हारे बीच जो पराए देवता[a] हैं, उन्हें दूर कर दो, अपने आप को शुद्ध करो[b] और अपने वस्त्र बदलो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विदेशी देवता,” “अजनबी देवता” अथवा “परदेशी के देवता।”
    reason: lexical_alternative
  - marker: b
    text: “अपने आप को शुद्ध करो” परमेश्वर के पास जाने की तैयारी में की जाने वाली अनुष्ठानिक शुद्धि की ओर संकेत कर सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: अपने घराने
  rationale: शाब्दिक अर्थ ‘उसका घर’ है, पर यहाँ भौतिक भवन नहीं बल्कि याकूब के घरेलू समुदाय के लोग अभिप्रेत हैं; ‘घराना’ इस सामाजिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל אֲשֶׁר עִמּוֹ
  choice: उन सब लोगों से जो उसके साथ थे
  rationale: संदर्भ में यह वाक्यांश याकूब के साथ उपस्थित लोगों को दर्शाता है; ‘लोगों’ जोड़ने से हिन्दी में आशय स्पष्ट होता है, बिना दायरा अनावश्यक रूप से सीमित किए।
- source_word: הָסִרוּ
  choice: दूर कर दो
  rationale: आज्ञार्थक क्रिया अपने बीच अथवा अधिकार में रखी वस्तुओं को हटा देने का आदेश देती है। ‘दूर कर दो’ आदेश की शक्ति और व्यापकता दोनों बनाए रखता है।
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: पराए देवता
  rationale: यह पद परदेशियों से संबद्ध अथवा इस समुदाय के परमेश्वर से भिन्न देवताओं को सूचित करता है। ‘पराए देवता’ आधुनिक हिन्दी में संक्षिप्त है और ‘विदेशी देवता’ की संभावित केवल भौगोलिक ध्वनि से बचता है।
- source_word: בְּתֹכְכֶם
  choice: तुम्हारे बीच
  rationale: शाब्दिक अर्थ ‘तुम्हारे मध्य’ है। यह मूर्तियों के भौतिक अधिकार और समुदाय में उनकी उपस्थिति—दोनों की संभावना खुली रखता है।
- source_word: וְהִטַּהֲרוּ
  choice: अपने आप को शुद्ध करो
  rationale: हित्पाएल रूप आत्मवाचक आदेश है। यह अनुष्ठानिक या धार्मिक शुद्धि की संभावित छाया को बनाए रखता है, पर उसकी विधि नहीं बताता।
- source_word: וְהַחֲלִיפוּ
  choice: बदलो
  rationale: वस्त्रों के साथ यह क्रिया बदलने अथवा दूसरे वस्त्र धारण करने का अर्थ देती है; ‘बदलो’ सहज और सटीक हिन्दी है।
- source_word: שִׂמְלֹתֵיכֶם
  choice: अपने वस्त्र
  rationale: यह शब्द पहनावे, विशेषकर बाहरी कपड़ों, को दर्शाता है। ‘वस्त्र’ गरिमापूर्ण, प्रचलित और प्रसंग के धार्मिक स्वर के अनुकूल है।
theological_decisions:
- issue: शुद्धि की आज्ञा का स्वरूप
  choice: ‘अपने आप को शुद्ध करो’ कहकर संभावित अनुष्ठानिक और वाचागत शुद्धि का संकेत सुरक्षित रखा गया है।
  alternative: ‘अपने आप को साफ करो’, जो सामान्य शारीरिक स्वच्छता पर अधिक बल दे सकता है।
  rationale: मूर्तियों को हटाने और परमेश्वर के पास जाने की तैयारी के संदर्भ में धार्मिक शुद्धि संभव है, किंतु पद किसी विशिष्ट संस्कार या विधि का वर्णन नहीं करता; इसलिए अनुवाद उससे अधिक निश्चित नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘घराना’, ‘पराए देवता’ और ‘अपने आप को शुद्ध करो’ सामान्य पाठक के लिए स्पष्ट रहते हुए मूल इब्रानी की सामाजिक, धार्मिक और संभावित अनुष्ठानिक अर्थ-छायाओं को सुरक्षित रखते हैं।
