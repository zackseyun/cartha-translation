base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/013.yaml
  text: Then God went up from him in the place where he had spoken with him[a].
translation:
  language: hi
  text: तब परमेश्वर उस स्थान पर, जहाँ उसने याकूब से बात की थी, याकूब के ऊपर से ऊपर उठ गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘याकूब से ऊपर चला गया।’ इब्रानी में परमेश्वर के इस मिलन से विदा होने को ऊपर की ओर गति के रूप में व्यक्त किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ऊपर उठ गया
  rationale: क़ाल क्रिया עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है। ‘ऊपर उठ गया’ परमेश्वर के प्रस्थान में निहित ऊर्ध्व दिशा को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: מֵעָלָיו
  choice: उसके पास से
  rationale: इस पदबंध का शाब्दिक बोध ‘उसके ऊपर से’ हो सकता है, पर यहाँ वह हिन्दी में अनावश्यक शारीरिक निकटता का आभास देगा। ‘उसके पास से’ याकूब से परमेश्वर के प्रस्थान को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ क्रिया एकवचन है और कथा-संदर्भ इस्राएल के एक परमेश्वर की ओर संकेत करता है; इसलिए हिन्दी बाइबलीय गद्य में ‘परमेश्वर’ उपयुक्त है।
- source_word: בַּמָּקוֹם
  choice: उस स्थान पर
  rationale: בְּ स्थानसूचक है और מקום के साथ हिन्दी में ‘स्थान पर’ स्वाभाविक है। निश्चित पदबंध को ‘उस स्थान’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר
  choice: जहाँ
  rationale: स्थान को पूर्वपद मानने वाले संबंधवाचक उपवाक्य में ‘जहाँ’ सहज और अर्थसंगत हिन्दी है।
- source_word: דִּבֶּר אִתּוֹ
  choice: उसने याकूब से बात की थी
  rationale: דבר पिएल के साथ אֵת का अर्थ ‘के साथ/से बात करना’ है। हिन्दी में ‘से बात की थी’ स्वाभाविक है; पूर्ण पूर्वकाल यह स्पष्ट करता है कि बातचीत ऊपर उठ जाने से पहले हुई थी। सर्वनाम की संभावित अस्पष्टता दूर करने के लिए संदर्भगत व्यक्ति ‘याकूब’ का नाम रखा गया है।
theological_decisions:
- issue: परमेश्वर के प्रस्थान का मानवरूपी और स्थानगत वर्णन
  choice: ‘उसके पास से ऊपर उठ गया’ द्वारा ऊपर की ओर गति को बनाए रखना
  alternative: ‘उसके पास से चला गया’ या ‘वहाँ से विदा हुआ’
  rationale: इब्रानी पाठ सामान्य आरोहण-सूचक क्रिया का प्रयोग करता है। स्थानगत भाषा को बनाए रखना ईश-दर्शन की कथात्मक छवि की रक्षा करता है और परमेश्वर की उपस्थिति के विषय में पाठ से आगे कोई दार्शनिक निष्कर्ष नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। वाक्य-विन्यास को हिन्दी के अनुरूप किया गया है, जबकि इब्रानी की ऊर्ध्वगामी छवि और स्थानगत भाषा सुरक्षित रखी गई है।
