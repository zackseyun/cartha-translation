  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּ/רְבֵ֔ה גּ֛וֹי וּ/קְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑/ךָּ וּ/מְלָכִ֖ים מֵ/חֲלָצֶ֥י/ךָ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/011.yaml
  text: And God said to him[a], “I am God Almighty. Be fruitful and multiply. A nation and an assembly of nations shall come from you[c][b], and kings shall come from your loins.”
translation:
  language: hi
  text: तब परमेश्वर ने उससे कहा, “मैं सर्वशक्तिमान परमेश्वर[a] हूँ। फलवन्त हो और बहुत बढ़ो। तुझसे एक राष्ट्र और राष्ट्रों का एक समुदाय[b] उत्पन्न होगा, और तेरी देह से[c] राजा निकलेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “एल शद्दाय”; परंपरागत अनुवाद “सर्वशक्तिमान परमेश्वर” है।'
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “राष्ट्रों की एक सभा” या “राष्ट्रों का एक समूह” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “तेरी कमर से”; यह अपनी देह से उत्पन्न होने वाले वंशजों के लिए इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया और कथा-संदर्भ में यह बहुवचन रूप इस्राएल के एक परमेश्वर के लिए प्रयुक्त उपाधि है।
- source_word: אֵל שַׁדַּי
  choice: सर्वशक्तिमान परमेश्वर
  rationale: यह ईश्वरीय उपाधि है। इसका अर्थपूर्ण और हिन्दी में प्रचलित अनुवाद मूल की गंभीर आत्म-पहचान को बनाए रखता है; मूल इब्रानी रूप पाद-टिप्पणी में दिया गया है।
- source_word: פְּרֵה וּרְבֵה
  choice: फलवन्त हो और बढ़ता जा
  rationale: दोनों क्रियाएँ पुल्लिंग एकवचन आज्ञार्थक हैं और सृष्टि तथा पूर्वजों की आशीष के परिचित सूत्र को प्रतिध्वनित करती हैं। यह हिन्दी में स्वाभाविक रहते हुए दोनों क्रियाओं को अलग-अलग व्यक्त करता है।
- source_word: גּוֹי
  choice: जाति
  rationale: पूर्वजों से जुड़ी प्रतिज्ञा के संदर्भ में यह एक संगठित जन-समुदाय या राष्ट्र को दर्शाता है; ‘जाति’ यहाँ पारंपरिक बाइबलीय और व्यापक जनसमूह का अर्थ देती है।
- source_word: קְהַל גּוֹיִם
  choice: जातियों का एक समुदाय
  rationale: קהל एक एकत्र समूह, सभा या समुदाय को सूचित करता है। ‘समुदाय’ आधुनिक हिन्दी में सहज है और शब्द की सामूहिकता बनाए रखता है।
- source_word: יִהְיֶה מִמֶּךָּ
  choice: तुझसे ... उत्पन्न होगा
  rationale: शाब्दिक अर्थ ‘तुझसे होगा’ है; वंशगत संदर्भ में ‘उत्पन्न होगा’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: מְלָכִים
  choice: राजा
  rationale: यह संज्ञा सीधे तौर पर अनेक राजाओं को दर्शाती है; हिन्दी में संख्या क्रिया ‘निकलेंगे’ से स्पष्ट है।
- source_word: מֵחֲלָצֶיךָ
  choice: तेरी ही देह से
  rationale: इब्रानी मुहावरा अपनी शारीरिक संतान और वंश को दर्शाता है। ‘देह से’ उस शारीरिक वंशगत अर्थ को स्वाभाविक हिन्दी में रखता है, जबकि शाब्दिक बिंब पाद-टिप्पणी में सुरक्षित है।
- source_word: יֵצֵאוּ
  choice: निकलेंगे
  rationale: वंश के संदर्भ में यह किसी से उत्पन्न होने या निकलने का भाव देता है और मूल क्रिया के ठोस बिंब को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֵל שַׁדַּי का अनुवाद
  choice: सर्वशक्तिमान परमेश्वर
  alternative: एल शद्दाय
  rationale: नाम की तरह केवल लिप्यंतरण करने के बजाय उपाधि का अर्थ अनूदित किया गया है। पारंपरिक अर्थ रखा गया है, पर मूल रूप पाद-टिप्पणी में देकर शब्दार्थ संबंधी अनिश्चितता को छिपाया नहीं गया।
- issue: वंशगत प्रतिज्ञा में शारीरिक बिंब की मात्रा
  choice: तेरी ही देह से राजा निकलेंगे
  alternative: तेरी कमर से राजा निकलेंगे
  rationale: यह अनुवाद वास्तविक शारीरिक वंश के अर्थ को बनाए रखता है, पर आधुनिक हिन्दी में भ्रामक या अत्यधिक अस्वाभाविक शाब्दिकता से बचता है। मूल मुहावरा पाद-टिप्पणी में दिया गया है।
- issue: קְהַל גּוֹיִם की सामूहिक संज्ञा
  choice: जातियों का एक समुदाय
  alternative: जातियों की एक सभा
  rationale: मूल शब्द एक एकत्र समूह, सभा या समुदाय—इन अर्थों की गुंजाइश रखता है। मुख्य पाठ में सहज ‘समुदाय’ चुना गया है और वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और प्रत्यक्ष शैली रखी गई है। परमेश्वर द्वारा याकूब को एकवचन संबोधन के अनुरूप ‘तुझसे/तेरी’ और आज्ञार्थक रूप ‘हो/जा’ प्रयुक्त हुए हैं। ‘फलवन्त’ बाइबलीय आशीष-सूत्र की पहचान बनाए रखता है, जबकि शेष वाक्यरचना सामान्य आधुनिक पाठक के लिए स्वाभाविक रखी गई है।
