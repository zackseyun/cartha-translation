base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/010.yaml
  text: And God said to him[a], “Your name is Jacob. Your name will no longer be called Jacob, but Israel will be your name.” So he called his name Israel.
translation:
  language: hi
  text: परमेश्वर ने उससे कहा, “तुम्हारा नाम याकूब है। अब से तुम्हारा नाम याकूब नहीं कहलाएगा, बल्कि तुम्हारा नाम इस्राएल होगा।” और उसने उसका नाम इस्राएल रखा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “और उसने उसे इस्राएल कहा।” इब्रानी में अधिक शाब्दिक रूप से: “और उसने उसका नाम इस्राएल कहा।”'
    reason: मूल इब्रानी नामकरण-सूत्र का अधिक शाब्दिक विकल्प और उसका स्वाभाविक हिन्दी रूप बताने के लिए।
lexical_decisions:
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया और प्रसंग से यहाँ इस्राएल के एकमात्र परमेश्वर का उल्लेख है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: שִׁמְךָ יַעֲקֹב
  choice: तेरा नाम याकूब है
  rationale: मूल के सीधे नाम-विधान को सरल और स्वाभाविक हिन्दी में रखा गया है।
- source_word: לֹא יִקָּרֵא שִׁמְךָ עוֹד יַעֲקֹב
