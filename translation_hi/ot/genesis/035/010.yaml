  rationale: ‘अब से ... नहीं’ नकार के साथ עוֹד का भाव व्यक्त करता है, जबकि ‘कहलाएगा’ निफ़अल के कर्मवाच्य नामकरण-अर्थ को सुरक्षित रखता है।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यहाँ यह रचना पुराने नाम के स्थान पर नए नाम का स्पष्ट विरोध और प्रतिस्थापन व्यक्त करती है।
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: तेरा नाम इस्राएल होगा
  rationale: अर्थ को स्पष्ट और स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त किया गया है।
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ יִשְׂרָאֵל
  choice: और उसने उसका नाम इस्राएल रखा
  rationale: ‘नाम रखा’ हिन्दी में नामकरण का स्वाभाविक मुहावरा है; संयोजक ‘और’ मूल के साधारण וַ־ को निकटता से दर्शाता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
theological_decisions:
- issue: क्या नाम बदलने की घोषणा को ऐसा बनाया जाए कि बाद के वर्णन में ‘याकूब’ नाम के प्रयोग से उसका सामंजस्य स्वतः हो जाए
  choice: अब से तेरा नाम याकूब नहीं कहलाएगा, बल्कि तेरा नाम इस्राएल होगा
  alternative: अब से मुख्यतः तेरा नाम इस्राएल होगा
  rationale: मूल पाठ औपचारिक और प्रबल नाम-परिवर्तन की घोषणा करता है। बाद में ‘याकूब’ नाम का प्रयोग जारी रहने के कारण इस कथन को नरम करना या उसका सामंजस्य समझाकर जोड़ना पाठ की वास्तविक तनावपूर्णता को मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज भाषा रखी गई है। सम्बोधन में ‘तेरा’ चुना गया है, क्योंकि ईश्वरीय प्रत्यक्ष वचन में यह स्वाभाविक एकवचन रूप है और मूल के द्वितीय पुरुष एकवचन से मेल खाता है।
