base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/027.yaml
  text: And Jacob came to Isaac his father at Mamre[a], Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.
translation:
  language: hi
  text: तब याकूब मम्रे में अपने पिता इसहाक के पास आया, अर्थात् किर्यत-अरबा—यानी हेब्रोन—जहाँ अब्राहम और इसहाक परदेशियों के रूप में रहते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא आगमन का सामान्य कथात्मक क्रियापद है; इसहाक के स्थान की ओर याकूब के पहुँचने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל יִצְחָק אָבִיו
  choice: अपने पिता इसहाक के पास
  rationale: दिशासूचक אֶל और संबंधसूचक प्रत्यय को स्पष्ट तथा सहज हिन्दी क्रम में रखा गया है।
- source_word: מַמְרֵא
  choice: मम्रे
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: קִרְיַת הָאַרְבַּע
  choice: किर्यत-अरबा
  rationale: मूल स्थान-नाम को अनूदित करने के बजाय लिप्यंतरित किया गया है, क्योंकि अगला वाक्यांश उसकी पहचान हेब्रोन से करता है।
- source_word: הִוא חֶבְרוֹן
  choice: जो हेब्रोन है
  rationale: स्त्रीलिंग सर्वनाम הִוא किर्यत-अरबा की पहचान हेब्रोन के रूप में करता है; हिन्दी में संबंधवाचक व्याख्या स्वाभाविक है।
- source_word: גָּר
  choice: परदेशी होकर रहते थे
  rationale: גור केवल ‘रहना’ नहीं, बल्कि किसी स्थान में गैर-स्थायी निवासी या परदेशी के रूप में बसने का भाव रखता है; इस अर्थ-सूक्ष्मता को सामान्य आधुनिक हिन्दी में स्पष्ट किया गया है।
