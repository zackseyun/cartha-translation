  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। स्थान-नामों को प्रचलित बाइबलीय हिन्दी रूपों में रखा गया है। मूल के גור की अस्थायी/परदेशी निवास की अर्थ-सूक्ष्मता मुख्य पाठ में ही व्यक्त की गई है, इसलिए पादटिप्पणी आवश्यक नहीं मानी गई।
