base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/012.yaml
  text: And the land that I gave to Abraham and to Isaac[a], I will give to you[b]; and to your offspring after you I will give the land.
translation:
  language: hi
  text: और जो देश मैंने अब्राहम और इसहाक को दिया[a], उसे मैं तुझे दूँगा; और तेरे बाद तेरी सन्तान[b] को मैं वह देश दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दे चुका हूँ।”
    reason: lexical_alternative
  - marker: b
    text: मूल शब्द सामूहिक एकवचन है; इसका अनुवाद “वंश” या “वंशजों” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: देश
  rationale: पितृपुरुषों से की गई प्रतिज्ञा के संदर्भ में אֶרֶץ किसी निश्चित भूभाग को दर्शाता है। आधुनिक हिन्दी में ‘देश’ यहाँ स्वाभाविक और स्पष्ट है।
- source_word: אֲשֶׁר
  choice: जो
  rationale: यह सम्बन्धवाचक उपवाक्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נָתַתִּי
  choice: मैंने ... दिया था
  rationale: हिब्रू पूर्ण क्रिया परमेश्वर द्वारा अब्राहम और इसहाक को पहले दिए गए अनुदान की ओर संकेत करती है। ‘दिया था’ आगामी ‘दूँगा’ के साथ उसका कालगत भेद बनाए रखता है।
- source_word: לְאַבְרָהָם וּלְיִצְחָק
  choice: अब्राहम और इसहाक को
  rationale: दोनों पितृपुरुषों को दिए गए अनुदान को स्पष्ट और सहज हिन्दी में व्यक्त किया गया है; हिन्दी में ‘को’ का एक बार प्रयोग दोनों नामों पर स्वाभाविक रूप से लागू होता है।
- source_word: לְךָ אֶתְּנֶנָּה
  choice: उसे मैं तुझे दूँगा
  rationale: स्त्रीलिंग एकवचन प्रत्यय पहले आए ‘देश’ की ओर लौटता है। ‘उसे’ इस सन्दर्भ को स्पष्ट रखता है और ‘तुझे’ एकवचन निकट सम्बोधन को बनाए रखता है।
- source_word: זַרְעֲךָ
  choice: तेरे वंश
  rationale: זֶרַע सामूहिक एकवचन है। ‘वंश’ हिन्दी में उसकी सामूहिकता को बनाए रखता है और ‘बीज’ की अपेक्षा इस वंशावली-सन्दर्भ में अधिक स्वाभाविक है।
- source_word: אַחֲרֶיךָ
  choice: तेरे बाद
  rationale: मूल के कालगत और उत्तराधिकार-सूचक अर्थ को सीधे बनाए रखता है।
- source_word: אֶתֵּן אֶת הָאָרֶץ
  choice: मैं यह देश दूँगा
  rationale: मूल में ‘दूँगा’ और ‘देश’ की पुनरावृत्ति को बनाए रखा गया है। दूसरी बार ‘यह’ उसी प्रतिज्ञात देश को स्वाभाविक हिन्दी में इंगित करता है।
theological_decisions:
- issue: पितृपुरुषों को देश दिए जाने की भूतकालीन घोषणा और याकूब तथा उसके वंश को भविष्य में दिए जाने की प्रतिज्ञा का सम्बन्ध
  choice: נָתַתִּי को ‘दिया था’ और आगे की क्रियाओं को ‘दूँगा’ के रूप में प्रस्तुत किया गया है।
  alternative: נָתַתִּי को ‘दे चुका हूँ’ कहना, जिससे पूर्व अनुदान की वर्तमान वैधता पर अधिक बल पड़े।
  rationale: मूल पाठ पहले किए गए दिव्य अनुदान और उसके भावी साकार होने को साथ रखता है। अनुवाद इस कालगत और धर्मवैचारिक तनाव को मिटाता नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुझे/तेरे’ एकवचन सम्बोधन मूल के व्याकरण और बाइबिलीय कथन-शैली को बनाए रखते हैं।
