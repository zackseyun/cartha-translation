id: GEN.35.14
reference: Genesis 35:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּצֵּ֨ב יַעֲקֹ֜ב מַצֵּבָ֗ה בַּ/מָּק֛וֹם אֲשֶׁר דִּבֶּ֥ר אִתּ֖/וֹ מַצֶּ֣בֶת אָ֑בֶן וַ/יַּסֵּ֤ךְ עָלֶ֨י/הָ֙ נֶ֔סֶךְ וַ/יִּצֹ֥ק עָלֶ֖י/הָ שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/014.yaml
  text: And Jacob set up a pillar in the place where he had spoken with him[a], a pillar of stone; and he poured out a drink offering on it[b], and he poured oil on it.
translation:
  language: hi
  text: तब याकूब ने उस स्थान पर, जहाँ परमेश्वर ने उससे बात की थी, पत्थर का एक स्तंभ स्थापित किया। उसने उस पर पेय-भेंट[a] उड़ेली और उस पर तेल डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् तरल पदार्थ की भेंट, जो उँडेलकर चढ़ाई जाती थी।
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: खड़ा किया
  rationale: हिफ़ील रूप किसी वस्तु को सीधा खड़ा करने का बोध देता है; यह हिन्दी में स्वाभाविक और ठोस क्रिया है।
- source_word: מַצֵּבָה / מַצֶּבֶת אָבֶן
  choice: पत्थर का एक खम्भा
  rationale: यह खड़े किए गए पत्थर या स्मारक-स्तम्भ को दर्शाता है। 'पत्थर का खम्भा' मूल में दी गई सामग्री को स्पष्ट रखते हुए सामान्य पाठक के लिए सहज है।
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: जहाँ उसने उससे बात की थी
  rationale: मूल में कर्ता और कर्म सर्वनामों के रूप में ही हैं; संदर्भ उन्हें स्पष्ट करता है। हिन्दी में भी सर्वनाम बनाए रखकर मूल की अभिव्यक्ति और संभावित अस्पष्टता सुरक्षित रखी गई है।
- source_word: וַיַּסֵּךְ ... נֶסֶךְ
  choice: अर्घ उँडेला
  rationale: क्रिया और संज्ञा मिलकर धार्मिक भेंट के रूप में तरल पदार्थ उँडेलने को व्यक्त करते हैं। 'अर्घ' संक्षिप्त हिन्दी धार्मिक शब्द है; पादटिप्पणी इसका अर्थ खोलती है।
- source_word: וַיִּצֹק ... שָׁמֶן
  choice: तेल भी उँडेला
  rationale: मूल केवल 'तेल' कहता है, इसलिए 'जैतून का तेल' नहीं जोड़ा गया। 'भी' समानांतर दूसरी क्रिया को स्वाभाविक हिन्दी में जोड़ता है।
theological_decisions:
- issue: खम्भे और चढ़ाई गई वस्तुओं के धार्मिक कार्य का स्वरूप
  choice: घटनाओं को केवल खम्भा खड़ा करने, अर्घ उँडेलने और तेल उँडेलने के रूप में वर्णित किया गया है।
  alternative: इसे स्पष्ट रूप से खम्भे का अभिषेक, पवित्रीकरण या ईश्वरीय भेंट घोषित करना।
  rationale: पद इन क्रियाओं का धार्मिक महत्त्व स्पष्ट नहीं करता; व्याख्यात्मक उद्देश्य जोड़ने से मूल की धार्मिक खुली हुई अर्थ-सीमा संकुचित हो जाती।
- issue: बात करने वाले की पहचान
  choice: मूल के अनुरूप 'उसने उससे' रखा गया है।
  alternative: संदर्भ के आधार पर 'परमेश्वर ने उससे' लिखना।
  rationale: संदर्भ में कर्ता परमेश्वर है, फिर भी इब्रानी वाक्य में नाम दोहराया नहीं गया; सर्वनामों को बनाए रखने से स्रोत की संरचना और अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। 'खम्भा खड़ा किया' सामान्य पाठक के लिए सहज है। अपेक्षाकृत कम प्रचलित धार्मिक शब्द 'अर्घ' को पादटिप्पणी में स्पष्ट किया गया है।
