  edition: WLC
  text: וַ/יִּסְעוּ֙ מִ/בֵּ֣ית אֵ֔ל וַֽ/יְהִי ע֥וֹד כִּבְרַת הָ/אָ֖רֶץ לָ/ב֣וֹא אֶפְרָ֑תָה וַ/תֵּ֥לֶד רָחֵ֖ל וַ/תְּקַ֥שׁ בְּ/לִדְתָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/016.yaml
  text: Then they journeyed from Bethel[a], and when there was still some distance to go before reaching Ephrath, Rachel gave birth, and she had difficulty in childbirth.
translation:
  language: hi
  text: फिर वे बेतेल से आगे चले। जब एप्रात[a] पहुँचने में अभी कुछ दूरी बाकी थी, तब राहेल ने बच्चे को जन्म दिया, और उसे प्रसव में कठिनाई हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एप्राता’।
    reason: स्थान-नाम אֶפְרָתָה के वैकल्पिक लिप्यंतरण को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וַיִּסְעוּ מִבֵּית אֵל
  choice: वे बेतेल से आगे चले
  rationale: נסע यात्रा के लिए पड़ाव छोड़कर आगे बढ़ने को व्यक्त करता है। ‘आगे चले’ आधुनिक हिन्दी में सहज है और प्रसंगगत यात्रा को स्पष्ट रखता है।
- source_word: וַיְהִי עוֹד כִּבְרַת הָאָרֶץ
  choice: अभी कुछ दूरी बाकी थी
  rationale: दुर्लभ पद כִּבְרַת הָאָרֶץ किसी निश्चित माप के बजाय शेष दूरी का संकेत देता है; इसलिए अनिश्चितता बनाए रखने के लिए ‘कुछ दूरी’ चुना गया है।
- source_word: לָבוֹא אֶפְרָתָה
  choice: एप्रात पहुँचने में
  rationale: לָבוֹא गंतव्य तक पहुँचने की दिशा बताता है। शेष दूरी वाले वाक्यांश के साथ यह हिन्दी में स्वाभाविक रूप से जुड़ता है।
- source_word: אֶפְרָתָה
  choice: एप्रात
  rationale: स्थान-नाम का संक्षिप्त और प्रचलित लिप्यंतरण चुना गया है; मूल रूप के अधिक निकट ‘एप्राता’ को पाठ-टिप्पणी में रखा गया है।
- source_word: וַתֵּלֶד רָחֵל
  choice: राहेल ने बच्चे को जन्म दिया
  rationale: Qal क्रिया ילד स्त्री कर्ता के साथ जन्म देने का अर्थ रखती है। हिन्दी में कर्म के बिना ‘जन्म दिया’ अधूरा लगता है, इसलिए निहित अर्थ ‘बच्चे को’ स्पष्ट किया गया है।
- source_word: וַתְּקַשׁ בְּלִדְתָּהּ
  choice: उसका प्रसव बहुत कठिन था
  rationale: קשה यहाँ प्रसव की गंभीर कठिनाई बताता है। यह रूप प्राकृतिक, गरिमापूर्ण हिन्दी में उसी कठिनाई को व्यक्त करता है, बिना अतिरिक्त चिकित्सकीय विवरण जोड़े।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल और गरिमापूर्ण रखी गई है। विरल दूरी-सूचक मुहावरे को किसी निश्चित माप में नहीं बदला गया। उपलब्ध अंग्रेज़ी परामर्श-पाठ में टिप्पणी-चिह्न बेतेल के बाद था, पर टिप्पणी एप्रात के वैकल्पिक रूप से संबंधित है; इसलिए चिह्न को संबंधित नाम के साथ रखा गया है।
