id: GEN.35.22
reference: Genesis 35:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁכֹּ֤ן יִשְׂרָאֵל֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יֵּ֣לֶךְ רְאוּבֵ֔ן וַ/יִּשְׁכַּב֙ אֶת בִּלְהָה֙ פִּילֶ֣גֶשׁ אָבִ֔י/ו וַ/יִּשְׁמַ֖ע יִשְׂרָאֵ֑ל וַ/יִּֽהְי֥וּ בְנֵֽי יַעֲקֹ֖ב שְׁנֵ֥ים עָשָֽׂר־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/022.yaml
  text: And it happened[a], while Israel was dwelling in that land, that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it[b]. Now the sons of Jacob were twelve.
translation:
  language: hi
  text: जब इस्राएल उस देश में रह रहा था, तब ऐसा हुआ कि रूबेन ने जाकर अपने पिता की उपपत्नी बिल्हा के साथ सहवास किया, और इस्राएल ने यह बात सुन ली[a]। अब याकूब के पुत्र बारह थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में केवल ‘और इस्राएल ने सुना’ है। कर्म नहीं बताया गया है; संदर्भ से आशय रूबेन के कार्य की बात सुनना है।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शब्दशः: ‘और याकूब के पुत्र बारह थे।’ यह वाक्य संभवतः आगे आने वाली पुत्रों की सूची की भूमिका है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בִּשְׁכֹּן
  choice: जब ... रह रहा था, तब ऐसा हुआ
  rationale: ב के साथ infinitive construct पृष्ठभूमि में चल रही स्थिति का समय बताता है; यह हिंदी वाक्य-विन्यास कथात्मक विकास और जारी निवास—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּאָרֶץ הַהִוא
  choice: उस देश में
  rationale: यहाँ אֶרֶץ स्थानीय भूभाग या देश को दर्शाता है, पूरी पृथ्वी को नहीं।
- source_word: וַיֵּלֶךְ
  choice: जाकर
  rationale: इब्रानी में रूबेन के ‘जाने’ को अलग क्रिया के रूप में रखा गया है; हिंदी का संयुक्त क्रिया-विन्यास इसे संक्षेप में सुरक्षित रखता है।
- source_word: וַיִּשְׁכַּב אֶת
  choice: के साथ सहवास किया
  rationale: व्यक्ति के साथ שׁכב यौन संबंध का प्रचलित इब्रानी मुहावरा है। ‘सहवास किया’ आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है तथा केवल ‘सोया’ से उत्पन्न संभावित अस्पष्टता से बचता है।
- source_word: פִּילֶגֶשׁ
  choice: उपपत्नी
  rationale: यह प्राचीन परिवार में मान्य किंतु पत्नी से निम्न वैवाहिक दर्जे वाली स्त्री के लिए हिंदी का संक्षिप्त और स्थापित शब्द है।
- source_word: וַיִּשְׁמַע יִשְׂרָאֵל
  choice: और इस्राएल ने यह बात सुन ली
  rationale: मूल में कर्म व्यक्त नहीं है, पर संदर्भ रूबेन के कार्य की ओर स्पष्ट संकेत करता है। स्वाभाविक हिंदी के लिए ‘यह बात’ जोड़ा गया है और इसे पादटिप्पणी में बताया गया है।
- source_word: וַיִּהְיוּ בְנֵי יַעֲקֹב שְׁנֵים עָשָׂר
  choice: अब याकूब के पुत्र बारह थे
  rationale: यह कथन अगले पदों में पुत्रों की सूची की ओर संक्रमण करता है; ‘अब’ हिंदी में इस विमर्शगत मोड़ को स्वाभाविक रूप से दर्शाता है।
theological_decisions:
- issue: यौन क्रिया के मुहावरे को न तो अस्पष्ट बनाना, न अनावश्यक रूप से विस्तार देना
  choice: सहवास किया
  alternative: के साथ सोया; यौन संबंध बनाए
  rationale: ‘सहवास किया’ अपराध की गंभीरता और कथन की स्पष्टता बनाए रखता है, पर मूल से अधिक चिकित्सकीय या वर्णनात्मक नहीं बनता।
- issue: इस्राएल के सुनने के बाद उसकी प्रतिक्रिया के विषय में मौन
  choice: केवल यह कहना कि उसने बात सुन ली
  alternative: उसके क्रोध, न्यायिक कार्रवाई या निष्क्रियता का संकेत जोड़ना
  rationale: इब्रानी पाठ केवल उसके सुनने की सूचना देता है; कोई प्रतिक्रिया जोड़ना पाठ से परे धार्मिक या नैतिक निष्कर्ष थोपना होगा।
- issue: अंतिम उपवाक्य को सूची की ओर संक्रमण मानना
  choice: अब याकूब के पुत्र बारह थे
  alternative: और याकूब के पुत्र बारह थे
  rationale: ‘अब’ संभावित संक्रमण को व्यक्त करता है, पर कथन को इस्राएल की चुप्पी से जोड़कर कोई अतिरिक्त धार्मिक अर्थ नहीं देता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है—सुगम, सीधी और गरिमापूर्ण। नामों के लिए प्रचलित बाइबलीय रूप ‘इस्राएल’, ‘रूबेन’, ‘बिल्हा’ और ‘याकूब’ रखे गए हैं। ‘उपपत्नी’ ऐतिहासिक सामाजिक दर्जे को संक्षेप में व्यक्त करता है; ‘सहवास किया’ यौन आशय को स्पष्ट रखते हुए अशिष्ट या अनावश्यक रूप से नैदानिक भाषा से बचता है।
