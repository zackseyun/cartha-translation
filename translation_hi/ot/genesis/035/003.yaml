id: GEN.35.3
reference: Genesis 35:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָק֥וּמָה וְ/נַעֲלֶ֖ה בֵּֽית אֵ֑ל וְ/אֶֽעֱשֶׂה שָּׁ֣ם מִזְבֵּ֗חַ לָ/אֵ֞ל הָ/עֹנֶ֤ה אֹתִ/י֙ בְּ/י֣וֹם צָֽרָתִ֔/י וַ/יְהִי֙ עִמָּדִ֔/י בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/003.yaml
  text: Let us rise and go up to Bethel[a], and there I will make an altar to the God who answered me in the day of my distress and was with me on the way that I went.
translation:
  language: hi
  text: “आओ, हम उठें और बेतेल चलें। वहाँ मैं उस परमेश्वर के लिए एक वेदी बनाऊँगा, जिसने मेरे संकट के दिन मुझे उत्तर दिया[a] और जिस मार्ग पर मैं चला, उस पर मेरे साथ रहा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मुझे उत्तर देता है”; इब्रानी कृदंत परमेश्वर के सामान्य या निरंतर कार्य का भी वर्णन कर सकता है।
    reason: इब्रानी הָעֹנֶה में विशिष्ट बीते उत्तर और सामान्य/निरंतर उत्तर देने के बीच कालगत अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: וְנָקוּמָה
  choice: आओ, हम उठें
  rationale: प्रथम पुरुष बहुवचन का यह इच्छासूचक रूप सामूहिक आग्रह व्यक्त करता है। ‘आओ, हम उठें’ उसके आह्वान और तत्परता, दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: וְנַעֲלֶה
  choice: और बेतेल चलें
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है, पर गंतव्य के साथ आधुनिक हिन्दी में ‘बेतेल चलें’ अधिक सहज है। प्रसंग में यात्रा का भाव स्पष्ट रहता है, जबकि ‘ऊपर जाएँ’ यहाँ अनावश्यक रूप से अस्वाभाविक लगता।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: यह स्थान-नाम है, इसलिए इसके अर्थ ‘परमेश्वर का घर’ का अनुवाद करने के बजाय प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: וְאֶעֱשֶׂה שָּׁם מִזְבֵּחַ
  choice: वहाँ मैं ... एक वेदी बनाऊँगा
  rationale: עשה का व्यापक अर्थ ‘बनाना/करना’ है। ‘वेदी बनाऊँगा’ इब्रानी के निकट रहते हुए हिन्दी में स्वाभाविक है।
- source_word: לָאֵל
  choice: उस परमेश्वर के लिए
  rationale: ל समर्पण अथवा जिसके लिए वेदी बनाई जा रही है उसे दर्शाता है। संकेतवाचक ‘उस’ आगे आने वाले संबंधवाचक उपवाक्य से पहचाने गए परमेश्वर की विशिष्टता प्रकट करता है।
- source_word: הָעֹנֶה אֹתִי
  choice: जिसने ... मुझे उत्तर दिया
  rationale: इब्रानी कृदंत किसी विशिष्ट बीती प्रतिक्रिया अथवा परमेश्वर के सामान्य/निरंतर गुण, दोनों की ओर संकेत कर सकता है। प्रसंग में याकूब अपने पिछले संकट को याद कर रहा है, इसलिए मुख्य पाठ में भूतकाल रखा गया और व्यापक विकल्प पादटिप्पणी में दिया गया है।
- source_word: בְּיוֹם צָרָתִי
  choice: मेरे संकट के दिन
  rationale: यह צָרָה की विपत्ति और व्याकुलता का भाव तथा ‘के दिन’ की इब्रानी अभिव्यक्ति, दोनों को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: וַיְהִי עִמָּדִי
  choice: मेरे साथ रहा
  rationale: सरल भूतकाल परमेश्वर की पिछली यात्रा में याकूब के साथ उपस्थिति को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתִּי
  choice: जिस मार्ग पर मैं चला, उस पर
  rationale: यह דרך और הלך की ठोस यात्रा-छवि को बनाए रखता है और हिन्दी संबंधवाचक-सहसंबंधी रचना में स्वाभाविक है।
theological_decisions:
- issue: याकूब के कथन में אֵל का निर्देश
  choice: उस परमेश्वर
  alternative: परमेश्वर
  rationale: इब्रानी में पदबंध निश्चित है और उसके बाद परमेश्वर को उसके याकूब के प्रति किए कार्यों से पहचाना गया है। ‘उस परमेश्वर’ यह विशिष्टता रखता है, बिना पाठ से आगे कोई सिद्धान्त जोड़ने के।
- issue: הָעֹנֶה कृदंत का कालगत बल
  choice: जिसने मुझे उत्तर दिया
  alternative: जो मुझे उत्तर देता है
  rationale: निकट प्रसंग किसी पिछले संकट में मिले उत्तर को स्मरण करता है, इसलिए भूतकाल मुख्य पाठ में उपयुक्त है। फिर भी कृदंत परमेश्वर के सामान्य या निरंतर उत्तर देने वाले स्वरूप का बोध करा सकता है; इस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आओ, हम उठें’ में मूल आग्रह का बल है; ‘वेदी’, ‘संकट’ और ‘मार्ग’ जैसे शब्द धार्मिक प्रसंग के अनुकूल होते हुए भी व्यापक रूप से बोधगम्य हैं।
