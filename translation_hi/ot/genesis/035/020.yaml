  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּצֵּ֧ב יַעֲקֹ֛ב מַצֵּבָ֖ה עַל קְבֻרָתָ֑/הּ הִ֛וא מַצֶּ֥בֶת קְבֻֽרַת רָחֵ֖ל עַד הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/020.yaml
  text: And Jacob set up a pillar over her grave[a]. It is the pillar of Rachel’s grave to this day.
translation:
  language: hi
  text: और याकूब ने उसकी कब्र पर एक खम्भा खड़ा किया। वही राहेल की कब्र का खम्भा आज तक बना हुआ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: खड़ा किया
  rationale: हिफ़ील क्रिया यहाँ किसी खड़ी शिला या खम्भे को स्थापित करने का बोध कराती है; ‘खड़ा किया’ आधुनिक हिन्दी में स्वाभाविक और ठोस है।
- source_word: מַצֵּבָה
  choice: खम्भा
  rationale: यह संज्ञा खड़ी की गई शिला या स्तम्भ को दर्शाती है। ‘खम्भा’ मूल ठोस बिम्ब को बनाए रखता है, जबकि ‘स्मारक’ उद्देश्य को अधिक स्पष्ट करके अर्थ की व्याख्या कर देता।
- source_word: עַל
  choice: पर
  rationale: कब्र के सापेक्ष खम्भे की स्थिति व्यक्त करने के लिए ‘पर’ संक्षिप्त और स्वाभाविक है।
- source_word: קְבֻרָתָהּ
  choice: उसकी कब्र
  rationale: प्रत्यय स्त्रीलिंग एकवचन है और निकटवर्ती प्रसंग में राहेल की ओर संकेत करता है; ‘कब्र’ सामान्य और सीधा हिन्दी शब्द है।
- source_word: הִוא
  choice: वही
  rationale: स्त्रीलिंग सर्वनाम पहले उल्लिखित מַצֵּבָה की पहचान कराता है। हिन्दी में ‘वही’ इस पुनःपहचान और निरन्तरता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַצֶּבֶת קְבֻרַת רָחֵל
  choice: राहेल की कब्र का खम्भा
  rationale: यह चयन इब्रानी समास-श्रृंखला के सम्बन्ध को स्पष्ट रखता है और इसे ‘कब्र का चिह्न’ कहकर अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: עַד הַיּוֹם
  choice: आज तक बना हुआ है
  rationale: मुहावरा वर्णनकर्ता के समय तक बने रहने का संकेत देता है। ‘आज तक बना हुआ है’ हिन्दी में इस निरन्तर अस्तित्व को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions: []
