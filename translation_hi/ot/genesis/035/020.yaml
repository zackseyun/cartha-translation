  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘खम्भा’ को ‘स्मारक-शिला’ की अपेक्षा चुना गया है ताकि मूल का ठोस बिम्ब और संभावित कार्यगत अस्पष्टता बनी रहे।
