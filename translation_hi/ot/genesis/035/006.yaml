    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: पहुँचा
  rationale: בוא का यह कथात्मक रूप गंतव्य तक आने या पहुँचने को व्यक्त करता है; आधुनिक हिन्दी में ‘पहुँचा’ यहाँ स्वाभाविक और सटीक है।
- source_word: לוּזָה
  choice: लूज़ नगर में
  rationale: स्थानवाचक नाम לוּז के साथ दिशासूचक ה गमन को दर्शाता है। हिन्दी में इसे ‘लूज़ ... में पहुँचा’ से व्यक्त किया गया; ‘नगर’ स्पष्ट करता है कि यह स्थान का नाम है।
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: कनान देश के ... नगर
  rationale: इब्रानी संबंधवाचक उपवाक्य लूज़ की भौगोलिक स्थिति बताता है। हिन्दी में विशेषणात्मक संरचना अधिक सहज है और वही सूचना सुरक्षित रखती है।
- source_word: הִוא בֵּית אֵל
  choice: जो बेतेल है
  rationale: स्त्रीलिंग सर्वनाम הִוא लूज़ की पहचान बेतेल के रूप में कराता है। सरल संबंधवाचक वाक्यांश मूल की पहचान-सूचक संरचना बनाए रखता है।
- source_word: הוּא וְכָל הָעָם אֲשֶׁר עִמּוֹ
  choice: वह और उसके साथ के सभी लोग
  rationale: הוּא याकूब को पुनः उठाकर उसके साथ आए पूरे समूह को जोड़ता है। यह हिन्दी रूप उस पुनरुक्त, सहवर्ती बल को संक्षेप और स्वाभाविक ढंग से रखता है।
