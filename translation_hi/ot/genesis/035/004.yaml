source:
  edition: WLC
  text: וַ/יִּתְּנ֣וּ אֶֽל יַעֲקֹ֗ב אֵ֣ת כָּל אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/יָדָ֔/ם וְ/אֶת הַ/נְּזָמִ֖ים אֲשֶׁ֣ר בְּ/אָזְנֵי/הֶ֑ם וַ/יִּטְמֹ֤ן אֹתָ/ם֙ יַעֲקֹ֔ב תַּ֥חַת הָ/אֵלָ֖ה אֲשֶׁ֥ר עִם שְׁכֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/004.yaml
  text: So they gave Jacob all the foreign gods that were in their hands[a], and the rings that were in their ears[b], and Jacob hid them under the terebinth that was near Shechem.
translation:
  language: hi
  text: तब उन्होंने अपने हाथों में रखे हुए सारे पराए देवता और वे छल्ले[a] जो उनके कानों में थे, याकूब को दे दिए। याकूब ने उन्हें शकेम के पास बुतुम (टेरेबिन्थ) के पेड़[b] के नीचे छिपा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कुंडल”; इब्रानी शब्द विभिन्न अंगों में पहने जाने वाले छल्लों के लिए प्रयुक्त हो सकता है, पर यहाँ अगला पदबंध स्पष्ट करता है कि वे कानों में थे।
    reason: lexical_alternative
  - marker: b
    text: या “बलूत का पेड़”; इब्रानी शब्द संभवतः अधिक विशेष रूप से बुतुम, अर्थात टेरेबिन्थ, वृक्ष को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ אֶל־יַעֲקֹב
  choice: तब उन्होंने ... याकूब को दे दिए
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ क्रमिकता को स्वाभाविक हिन्दी में व्यक्त करता है। אֶל יַעֲקֹב अप्रत्यक्ष कर्म को चिह्नित करता है।
- source_word: כָּל אֱלֹהֵי הַנֵּכָר
  choice: सब पराए देवता
  rationale: यह पदबंध इस्राएल के परमेश्वर से भिन्न देवताओं या उनकी मूर्तियों की ओर संकेत करता है। ‘पराए देवता’ स्पष्ट और पारंपरिक अर्थ को बनाए रखता है।
- source_word: אֲשֶׁר בְּיָדָם
  choice: जो उनके हाथों में थे
  rationale: यह इब्रानी की ठोस अभिव्यक्ति को बनाए रखता है; प्रसंग में इसका अर्थ उनके पास या अधिकार में होना भी हो सकता है।
- source_word: הַנְּזָמִים אֲשֶׁר בְּאָזְנֵיהֶם
  choice: वे छल्ले जो उनके कानों में थे
  rationale: נְזָמִים अलग-अलग अंगों में पहने जाने वाले छल्लों को दर्शा सकता है, जबकि अगला पदबंध यहाँ कानों में होने की बात स्पष्ट करता है। ‘छल्ले’ इस संरचना और शब्दगत व्यापकता को सुरक्षित रखता है।
- source_word: וַיִּטְמֹן אֹתָם
  choice: उन्हें ... छिपा दिया
  rationale: טמן का अर्थ छिपाना, गाड़ना या गुप्त रखना हो सकता है। ‘छिपा दिया’ क्रिया की व्यापकता को बनाए रखता है और अनावश्यक रूप से यह निश्चित नहीं करता कि वस्तुएँ गाड़ी गई थीं।
- source_word: תַּחַת הָאֵלָה
  choice: बुतुम वृक्ष के नीचे
  rationale: אֵלָה प्रायः टेरेबिन्थ अर्थात बुतुम वृक्ष को दर्शाता है; यह ‘बांज’ की अपेक्षा वनस्पति की दृष्टि से अधिक सटीक है।
- source_word: אֲשֶׁר עִם שְׁכֶם
  choice: शकेम के पास
  rationale: स्थाननाम के साथ עִם निकटता व्यक्त कर सकता है; ‘के पास’ स्वाभाविक हिन्दी में वही स्थान-संबंध देता है।
theological_decisions:
- issue: सौंपे और छिपाए गए छल्लों का धार्मिक महत्व
  choice: पाठ पराए देवताओं और कानों में पहने छल्लों का अलग-अलग उल्लेख करता है, पर छल्लों के धार्मिक महत्व को निश्चित नहीं करता।
  alternative: छल्लों को या तो केवल आभूषण अथवा स्वयं ताबीज़ी या मूर्तिपूजक वस्तुएँ मानना।
  rationale: इब्रानी पाठ यह नहीं बताता कि छल्ले अपने आप में मूर्तिपूजक थे या पूर्व धार्मिक आचरण से जुड़े सामान्य आभूषण; इसलिए अनुवाद इस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘बुतुम वृक्ष’ अपेक्षाकृत कम परिचित किंतु स्रोत की दृष्टि से सटीक पद है, इसलिए पादटिप्पणी में परिचित विकल्प और स्पष्टीकरण दिया गया है।
