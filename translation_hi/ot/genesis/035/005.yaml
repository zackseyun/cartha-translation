id: GEN.35.5
reference: Genesis 35:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּסָּ֑עוּ וַ/יְהִ֣י חִתַּ֣ת אֱלֹהִ֗ים עַל הֶֽ/עָרִים֙ אֲשֶׁר֙ סְבִיבֹ֣תֵי/הֶ֔ם וְ/לֹ֣א רָֽדְפ֔וּ אַחֲרֵ֖י בְּנֵ֥י יַעֲקֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/005.yaml
  text: Then they set out[a], and a terror from God fell on the cities that were around them, so that they did not pursue the sons of Jacob.
translation:
  language: hi
  text: तब वे चल पड़े। उनके आसपास के नगरों पर परमेश्वर की ओर से भय छा गया[a], इसलिए उन्होंने याकूब के पुत्रों का पीछा नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “परमेश्वर का भय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעוּ
  choice: तब वे चल पड़े
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, और यात्रा के प्रसंग में ‘चल पड़े’ נסע का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: וַיְהִי חִתַּת אֱלֹהִים עַל
  choice: परमेश्वर की ओर से भय छा गया
  rationale: היה का घटनात्मक भाव और עַל की छवि हिन्दी में ‘छा गया’ से स्वाभाविक रूप से व्यक्त होती है। ‘परमेश्वर की ओर से’ इस भय के सम्भावित स्रोत को दर्शाता है, जबकि शाब्दिक संरचना पादटिप्पणी में सुरक्षित है।
- source_word: הֶעָרִים אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: उनके आसपास के नगरों पर
  rationale: यह निकटवर्ती नगरों को स्पष्ट और संक्षिप्त आधुनिक हिन्दी में पहचानता है।
- source_word: וְלֹא רָדְפוּ אַחֲרֵי
  choice: इसलिए उन्होंने … का पीछा नहीं किया
  rationale: यह पिछले उपवाक्य में आए भय के परिणाम को स्वाभाविक हिन्दी में स्पष्ट करता है; רדף אחרי का मुहावरा ‘पीछा करना’ है।
- source_word: בְּנֵי יַעֲקֹב
  choice: याकूब के पुत्रों
  rationale: इब्रानी पद स्पष्टतः पुल्लिंग बहुवचन है और कथा में याकूब के पुरुष वंशजों को सूचित करता है; ‘पुत्रों’ इस अर्थ को बनाए रखता है।
theological_decisions:
- issue: חִתַּת אֱלֹהִים की रचना और अर्थ
  choice: परमेश्वर की ओर से भय
  alternative: परमेश्वर का भय; बहुत बड़ा भय
  rationale: समास का सबसे प्रसंगानुकूल अर्थ परमेश्वर से उत्पन्न भय है, जो यहाँ दैवी सुरक्षा के अनुरूप है। फिर भी ‘परमेश्वर का भय’ उसकी अधिक शाब्दिक और अस्पष्ट संरचना है, इसलिए उसे पादटिप्पणी में रखा गया है। केवल तीव्रतासूचक अर्थ ‘बहुत बड़ा भय’ सम्भव है, पर वह यहाँ दैवी कर्तृत्व को कम स्पष्ट करता है।
- issue: בְּנֵי יַעֲקֹב का लिंग-सूचक अर्थ
  choice: याकूब के पुत्रों
  alternative: याकूब की सन्तान
  rationale: मूल पाठ पुरुष वंशजों का स्पष्ट उल्लेख करता है; इसलिए लिंग-निरपेक्ष रूप नहीं अपनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘चल पड़े’, ‘भय छा गया’ और ‘पीछा नहीं किया’ स्वाभाविक हिन्दी मुहावरे हैं; मूल की वास्तविक समासगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
