id: GEN.35.18
reference: Genesis 35:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/צֵ֤את נַפְשָׁ/הּ֙ כִּ֣י מֵ֔תָה וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן אוֹנִ֑י וְ/אָבִ֖י/ו קָֽרָא ל֥/וֹ בִנְיָמִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
translation:
  language: hi
  text: जब उसके प्राण निकल रहे थे—क्योंकि वह मर रही थी—तब उसने उसका नाम बेन-ओनी[a] रखा; पर उसके पिता ने उसका नाम बिन्यामीन[b] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बेन-ओनी का संभावित अर्थ ‘मेरे दुःख का पुत्र’ या ‘मेरे कष्ट का पुत्र’ है।
    reason: lexical_alternative
  - marker: b
    text: बिन्यामीन का संभावित अर्थ ‘दाहिने हाथ का पुत्र’ है; कुछ इसे ‘दक्षिण का पुत्र’ समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת נַפְשָׁהּ
  choice: जब उसके प्राण निकल रहे थे
  rationale: נֶפֶשׁ यहाँ मृत्यु के प्रसंग में जीवन अथवा प्राण को दर्शाता है। हिंदी का स्वाभाविक मुहावरा ‘प्राण निकलना’ मूल की अभिव्यक्ति को बनाए रखता है, पर आत्मा के स्वरूप पर अनावश्यक तकनीकी दावा नहीं करता। ב के साथ क्रिया का infinitive construct समय-सूचक रूप में प्रस्तुत किया गया है।
- source_word: כִּי מֵתָה
  choice: क्योंकि वह मर रही थी
  rationale: यह उपवाक्य पिछली अभिव्यक्ति की व्याख्या करता है। पूर्ण क्रिया-रूप के बावजूद प्रसंग नाम रखने के साथ चल रही मृत्यु-प्रक्रिया को दिखाता है, इसलिए अपूर्ण वर्तमान ‘मर रही थी’ कथा-प्रवाह के अनुकूल है।
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: उसने उसका नाम … रखा
  rationale: ‘नाम रखना’ आधुनिक हिंदी में नामकरण का स्वाभाविक और गरिमापूर्ण रूप है तथा पिता द्वारा किए गए नामकरण के साथ समानांतरता बनाए रखता है।
- source_word: בֶּן אוֹנִי
  choice: बेन-ओनी
  rationale: व्यक्तिनाम को मुख्य पाठ में लिप्यंतरित किया गया है। कथा में उसके अर्थ का महत्त्व होने के कारण संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: וְאָבִיו קָרָא לוֹ
  choice: पर उसके पिता ने उसका नाम … रखा
  rationale: ו को यहाँ विरोधसूचक ‘पर’ के रूप में प्रस्तुत किया गया है, क्योंकि पिता का रखा नाम माता के रखे नाम से भिन्न है।
- source_word: בִנְיָמִין
  choice: बिन्यामीन
  rationale: इब्रानी व्यक्तिनाम का निकट देवनागरी लिप्यंतरण रखा गया है। उसकी संभावित व्युत्पत्तियाँ पादटिप्पणी में दी गई हैं ताकि मूल की अर्थगत अनिश्चितता बनी रहे।
theological_decisions:
- issue: मृत्यु के संदर्भ में נֶפֶשׁ का मानव-स्वरूप संबंधी अर्थ
  choice: मुख्य पाठ में ‘प्राण’
  alternative: ‘आत्मा’ अथवा ‘जीवन’
  rationale: यह इब्रानी शब्द जीवित प्राणी, जीवन या प्राण को दर्शा सकता है; यहाँ ‘प्राण निकलना’ मृत्यु के दृश्य को स्वाभाविक हिंदी में व्यक्त करता है और अमूर्त आत्मा के शरीर से अलग होने के विषय में मूल से अधिक निश्चित धर्मवैज्ञानिक कथन नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है। ‘प्राण निकलना’ सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण है। नाम इब्रानी उच्चारण के निकट देवनागरी में रखे गए हैं और उनकी अनिश्चित व्युत्पत्तियाँ पादटिप्पणियों में सुरक्षित हैं।
