base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/029.yaml
  text: Then Isaac breathed his last and died[a], and was gathered to his people, old and full of days. And Esau and Jacob, his sons, buried him.
translation:
  language: hi
  text: तब इसहाक ने प्राण त्यागे और मर गया, और वह अपने लोगों में जा मिला[a]। वह वृद्ध और पूर्णायु था। उसके पुत्र एसाव और याकूब ने उसे दफ़नाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पूर्वजों/कुटुम्बियों में जा मिला।” यह इब्रानी का पारंपरिक मृत्यु-सूत्र है और केवल शारीरिक रूप से दफ़नाए जाने से अधिक का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: ने प्राण त्यागे
  rationale: मृत्यु-वृत्तांत में यह क्रिया जीवन के समाप्त होने को व्यक्त करती है। ‘प्राण त्यागे’ स्वाभाविक हिन्दी है और इसके बाद आने वाले स्पष्ट ‘मर गया’ से शब्दगत भेद बनाए रखती है।
- source_word: וַיָּמָת
  choice: मर गया
  rationale: מות मरने के लिए सामान्य और स्पष्ट क्रिया है; इसे सीधे रूप में रखा गया है।
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: अपने लोगों में जा मिला
  rationale: यह इब्रानी का पारंपरिक मृत्यु-सूत्र है। यह अनुवाद ‘अपने लोगों’ को बनाए रखते हुए स्वाभाविक हिन्दी देता है और इसे केवल दफ़नाए जाने या परलोक में पूर्वजों से मिलने तक सीमित नहीं करता।
- source_word: זָקֵן
  choice: बूढ़ा
  rationale: आयु की अवस्था का सीधा और सामान्य हिन्दी वर्णन।
- source_word: וּשְׂבַע יָמִים
  choice: आयु से परिपूर्ण
  rationale: शाब्दिक अर्थ ‘दिनों से तृप्त/भरा हुआ’ है। ‘आयु से परिपूर्ण’ मूल मुहावरे की साहित्यिक गरिमा और पूर्ण जीवन का भाव बनाए रखता है।
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: ने उसे दफ़नाया
  rationale: קבר का स्पष्ट और प्रचलित हिन्दी समानार्थक।
- source_word: עֵשָׂו וְיַעֲקֹב בָּנָיו
  choice: उसके पुत्र एसाव और याकूब
  rationale: सम्बन्ध और दोनों कर्ताओं को आधुनिक हिन्दी की स्वाभाविक शब्द-व्यवस्था में स्पष्ट करता है।
theological_decisions:
- issue: मृत्यु-सूत्र ‘अपने लोगों में जा मिला’ का अर्थ
  choice: सूत्र को इस प्रकार रखा गया है कि उसका पारिवारिक और सम्भावित परलोक-संबंधी संकेत बना रहे, पर उसका अर्थ निश्चित न किया जाए।
  alternative: इसे केवल कुल की कब्र में दफ़नाया जाना या मृत्यु के बाद पूर्वजों से मिलना मानना।
  rationale: इब्रानी सूत्र स्वयं अस्पष्ट है और शारीरिक दफ़न से अधिक का संकेत दे सकता है; अनुवाद में इस धर्मवैचारिक तनाव को सुलझाना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण मृत्यु-वृत्तांत। ‘प्राण त्यागे और मर गया’ मूल की दो क्रमिक क्रियाओं को बनाए रखता है; ‘आयु से परिपूर्ण’ मूल मुहावरे की साहित्यिक बनावट को अत्यधिक शाब्दिक हुए बिना सुरक्षित रखता है।
