  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א יַעֲקֹ֜ב אֶת שֵׁ֣ם הַ/מָּק֗וֹם אֲשֶׁר֩ דִּבֶּ֨ר אִתּ֥/וֹ שָׁ֛ם אֱלֹהִ֖ים בֵּֽית אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/015.yaml
  text: And Jacob called the name of the place where God had spoken with him there[b][a], Bethel.
translation:
  language: hi
  text: परमेश्वर ने जिस स्थान पर याकूब से बात की थी, याकूब ने उस स्थान का नाम बेतेल[a] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेतेल’ का अर्थ है ‘परमेश्वर का घर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: नाम ... रखा
  rationale: हिन्दी में किसी स्थान को नाम देने के लिए ‘नाम रखना’ स्वाभाविक मुहावरा है और इब्रानी ‘नाम पुकारा’ का अर्थ ठीक व्यक्त करता है।
- source_word: הַמָּקוֹם
  choice: उस स्थान
  rationale: निश्चित स्थान को दर्शाता है और सम्बन्धवाचक वाक्य के साथ स्वाभाविक हिन्दी रचना बनाता है।
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ שָׁם אֱלֹהִים
  choice: परमेश्वर ने जिस स्थान पर याकूब से बात की थी
  rationale: ‘जिस स्थान पर ... उस स्थान’ की सहसम्बन्धी हिन्दी रचना אֲשֶׁר और שָׁם दोनों के स्थानवाचक भाव को बिना अस्वाभाविक दोहराव के व्यक्त करती है। ‘याकूब से’ सर्वनाम का सन्दर्भ स्पष्ट रखता है; पूर्णभूत ‘की थी’ नाम रखने से पहले हुई घटना को दर्शाता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ क्रिया और कथा-सन्दर्भ एकवचन में इस्राएल के परमेश्वर की ओर संकेत करते हैं; आधुनिक हिन्दी बाइबल-शैली में ‘परमेश्वर’ स्पष्ट और प्रतिष्ठित रूप है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: स्थान-नाम को अनुवाद करने के बजाय प्रचलित हिन्दी लिप्यन्तरण में रखा गया है; उसका शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: אֱלֹהִים का वचन और सन्दर्भ
  choice: परमेश्वर
  alternative: देवता
  rationale: वाक्य-विन्यास और याकूब की कथा में सन्दर्भ एक ही परमेश्वर का है; बहुवचन अनुवाद प्रसंग को गलत रूप देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जिस स्थान पर ... उस स्थान’ से मूल के स्थानवाचक सम्बन्ध और שָׁם का भाव सुरक्षित रहता है, जबकि हिन्दी में अनावश्यक ‘वहाँ’ जोड़ने की अस्वाभाविकता से बचा गया है।
