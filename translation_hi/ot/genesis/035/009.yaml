  yaml_path: translation/ot/genesis/035/009.yaml
  text: God appeared to Jacob again when he came from Paddan-aram[a], and he blessed him.
translation:
  language: hi
  text: जब याकूब पद्दन-अराम से आया, तब परमेश्वर फिर उसे दिखाई दिया[a] और उसने उसे आशीष दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर ने फिर अपने आपको याकूब को प्रकट किया।” इब्रानी क्रिया का अर्थ दिखाई देना या अपने आपको दिखाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: दिखाई दिया
  rationale: ראה के निफ़अल रूप का यहाँ अर्थ प्रत्यक्ष होने या अपने आपको दिखाने से है। ‘दिखाई दिया’ सहज आधुनिक हिन्दी में वास्तविक ईश्वरीय प्रकटन को व्यक्त करता है, पर उसके माध्यम को निर्धारित नहीं करता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: क्रिया का एकवचन रूप और कथा-संदर्भ बताते हैं कि यहाँ एकमात्र परमेश्वर का उल्लेख है।
- source_word: עוֹד
  choice: फिर
  rationale: यह क्रिया पहले हुए ईश्वरीय प्रकटन की पुनरावृत्ति बताती है; ‘फिर’ हिन्दी में इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּבֹאוֹ
  choice: जब ... आया
  rationale: בְּ के साथ प्रत्यययुक्त क्रियार्थक संज्ञा यहाँ कालवाचक है। ‘जब ... आया’ अर्थ को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: מִפַּדַּן אֲרָם
  choice: पद्दन-अराम से
  rationale: यह स्थान-नाम लिप्यंतरित किया गया है और उपसर्ग מִן को ‘से’ द्वारा व्यक्त किया गया है।
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: और उसने उसे आशीष दी
  rationale: पिअेल में ברך का अर्थ ‘आशीष देना’ है। कर्ता और कर्म दोनों को व्यक्त करने से मूल वाक्य की संबंध-रचना स्पष्ट रहती है।
theological_decisions:
- issue: ईश्वरीय प्रकटन का स्वरूप
  choice: परमेश्वर फिर उसे दिखाई दिया
  alternative: परमेश्वर ने फिर अपने आपको याकूब पर प्रकट किया
  rationale: मूल पाठ एक वास्तविक ईश्वरीय प्रकटन बताता है, पर यह नहीं बताता कि वह किस माध्यम से हुआ। मुख्य अनुवाद इस तनाव को बनाए रखता है और इसे केवल दर्शन, स्वप्न या अमूर्त प्रकाशन नहीं ठहराता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पद्दन-अराम’ स्थान-नाम के रूप में लिप्यंतरित है। वाक्य को स्वाभाविक हिन्दी कालवाचक क्रम में रखा गया है, जबकि मूल पाठ का अर्थ और ईश्वरीय प्रकटन की अनिर्दिष्ट प्रकृति सुरक्षित है।
