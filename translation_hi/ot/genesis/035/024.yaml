- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह בֵּן का संबंधसूचक बहुवचन रूप है और यहाँ वंशावली की सूची आरम्भ करता है। दोनों नाम पुरुष संतानों के हैं, इसलिए ‘पुत्र’ सटीक और स्वाभाविक है।
