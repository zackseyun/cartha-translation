  text: וּ/בְנֵ֥י זִלְפָּ֛ה שִׁפְחַ֥ת לֵאָ֖ה גָּ֣ד וְ/אָשֵׁ֑ר אֵ֚לֶּה בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁ֥ר יֻלַּד ל֖/וֹ בְּ/פַדַּ֥ן אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/026.yaml
  text: 'And the sons of Zilpah[a], Leah’s servant: Gad and Asher[b]. These are the sons of Jacob who were born to him in Paddan-aram.'
translation:
  language: hi
  text: 'और लिआ की दासी जिल्पा के पुत्र: गाद और आशेर। ये याकूब के पुत्र हैं, जो उसके यहाँ पद्दन-अराम में जन्मे थे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पद 16–18 के अनुसार बिन्यामीन का जन्म कनान में हुआ था। इसलिए यहाँ “पद्दन-अराम में” कहा जाना याकूब के अरामी प्रवास से जुड़े उसके घराने के पुत्रों का सामान्य सार प्रतीत होता है, न कि बिन्यामीन के जन्मस्थान का सटीक वर्णन।
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי זִלְפָּה
  choice: और जिल्पा के पुत्र
  rationale: בְנֵי का अर्थ यहाँ वंशावली के संदर्भ में स्पष्ट रूप से ‘पुत्र’ है; नाम זִלְפָּה को प्रचलित हिन्दी रूप ‘जिल्पा’ में लिप्यंतरित किया गया है।
- source_word: שִׁפְחַת לֵאָה
  choice: लिआ की दासी
  rationale: שִׁפְחָה स्त्री सेविका अथवा दासी की अधीन सामाजिक स्थिति दर्शाता है। ‘दासी’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और स्रोत के सामाजिक अर्थ को ‘सेविका’ की अपेक्षा अधिक स्पष्ट रूप से बनाए रखता है।
- source_word: גָּד וְאָשֵׁר
  choice: गाद और आशेर
  rationale: व्यक्तिनामों का स्रोत-आधारित हिन्दी लिप्यंतरण किया गया है।
- source_word: אֵלֶּה בְּנֵי יַעֲקֹב
  choice: ये याकूब के पुत्र हैं
  rationale: हिब्रू का प्रदर्शनवाचक सार-वाक्य हिन्दी में स्वाभाविक रूप से प्रस्तुत किया गया है और בְּנֵי की पुरुष-संतान संबंधी विशिष्टता रखी गई है।
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: जो उसके लिए उत्पन्न हुए थे
  rationale: युफ़्फ़ाल रूप יֻלַּד निष्क्रिय है और לוֹ याकूब के संदर्भ में ‘उसके लिए/उसके यहाँ’ का भाव देता है। इस अनपेक्षित एकवचन क्रियारूप को सहज हिन्दी बहुवचन में प्रस्तुत किया गया है, बिना किसी माता को कर्ता बनाए।
- source_word: בְּפַדַּן אֲרָם
  choice: पद्दन-अराम में
  rationale: स्थाननाम को अर्थानुवाद करने के बजाय लिप्यंतरित किया गया है; संयुक्त नाम को योजक चिह्न सहित रखा गया है।
theological_decisions:
- issue: पद्दन-अराम में जन्मे पुत्रों के सार-वाक्य में बिन्यामीन का समावेश
  choice: मुख्य पाठ में हिब्रू के व्यापक सार-वाक्य को ज्यों का त्यों रखा और कठिनाई को पादटिप्पणी में बताया
  alternative: वाक्य को इस प्रकार सीमित करना कि बिन्यामीन स्पष्ट रूप से बाहर हो जाए
  rationale: उत्पत्ति 35:16–18 के अनुसार बिन्यामीन का जन्म कनान में हुआ, फिर भी वर्तमान पद सभी सूचीबद्ध पुत्रों पर व्यापक कथन करता है। अनुवाद में स्रोत के तनाव को मिटाना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दासी’ सामाजिक अधीनता को बनाए रखता है; ‘स्त्री दास’ जैसे अधिक कठोर किंतु अस्वाभाविक पद से बचा गया है। पद के खंडात्मक सूची-विन्यास को अर्धविराम या पूर्ण वाक्य बनाने के बजाय द्विबिंदु से सुरक्षित रखा गया है।
