  yaml_path: translation/ot/genesis/035/017.yaml
  text: And when her labor was hard[a], the midwife said to her, “Do not fear[b], for this also is a son for you.”
translation:
  language: hi
  text: जब उसे प्रसव में बहुत कठिनाई हो रही थी, तब दाई ने उससे कहा, “मत डर, क्योंकि तुझे यह भी एक बेटा हुआ है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְהַקְשֹׁתָהּ בְלִדְתָּהּ
  choice: जब उसे प्रसव में बहुत कठिनाई हो रही थी
  rationale: यह वाक्यांश प्रसव के समय की गंभीर कठिनाई बताता है। हिंदी में यह रूप स्वाभाविक है और मूल के कालगत तथा तीव्रता-संबंधी अर्थ को बनाए रखता है।
- source_word: הַמְיַלֶּדֶת
  choice: दाई
  rationale: यह प्रसव में सहायता करने वाली स्त्री के लिए प्रचलित, सटीक और सामान्य हिंदी शब्द है।
- source_word: אַל תִּירְאִי
  choice: मत डर
  rationale: स्त्रीलिंग एकवचन को संबोधित सीधे निषेध का सहज हिंदी रूप; प्रसंग की तात्कालिक सांत्वना को व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह न डरने का कारण प्रस्तुत करता है।
- source_word: גַּם זֶה
  choice: यह भी
  rationale: मूल के संकेतवाचक और समावेशी बल को बिना ‘एक और’ जैसी अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: לָךְ בֵּן
  choice: तेरे लिए एक बेटा है
  rationale: हिब्रू की दैटिव संरचना को निकटता से रखता है और हिंदी में समझने योग्य है; ‘एक’ हिंदी वाक्य-विन्यास में अनिश्चित संज्ञा को सहज बनाता है।
theological_decisions:
- issue: גַּם זֶה לָךְ בֵּן में ‘גם’ का संबंध
  choice: यह भी तेरे लिए एक बेटा है
  alternative: तुझे भी एक बेटा हुआ है
  rationale: चुना हुआ रूप ‘भी’ को संकेतवाचक ‘यह’ से जोड़ता है, जो शब्दक्रम और निकट संदर्भ के अधिक अनुरूप है; वैकल्पिक रूप ‘भी’ को माता से जोड़ सकता है और अर्थ का बल बदल देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। संवाद में ‘मत डर’ और ‘तेरे’ का प्रयोग निकट व्यक्तिगत संबोधन तथा मूल के स्त्रीलिंग एकवचन रूप के अनुरूप है।
