  to: जब उसे प्रसव में बहुत कठिनाई हो रही थी, तब दाई ने उससे कहा, “मत डर, क्योंकि तुझे यह भी एक बेटा हुआ है।”
  rationale: The revision changes only the final possessive/birth expression to idiomatic Hindi. It preserves the Hebrew’s reassurance, the reference to the child as “this one also,” and the fact that the child is a son, without replacing the demonstrative with the more interpretive “एक और।”
