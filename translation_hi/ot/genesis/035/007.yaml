  text: וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ וַ/יִּקְרָא֙ לַ/מָּק֔וֹם אֵ֖ל בֵּֽית אֵ֑ל כִּ֣י שָׁ֗ם נִגְל֤וּ אֵלָי/ו֙ הָֽ/אֱלֹהִ֔ים בְּ/בָרְח֖/וֹ מִ/פְּנֵ֥י אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/007.yaml
  text: There he built an altar and called the place El-bethel[a], because there God had revealed himself to him when he fled from his brother.
translation:
  language: hi
  text: वहाँ उसने एक वेदी बनाई और उस स्थान का नाम एल-बेतेल[a] रखा, क्योंकि जब वह अपने भाई से भागा था, तब वहीं परमेश्वर ने अपने आपको उसके सामने प्रकट किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एल-बेतेल का अर्थ संभवतः ‘बेतेल का परमेश्वर’ है।
    reason: नाम के इब्रानी अर्थ का संभावित विकल्प बताना
lexical_decisions:
- source_word: וַיִּבֶן
  choice: उसने…बनाई
  rationale: בנה के सामान्य कथात्मक अर्थ ‘बनाना’ को स्वाभाविक हिन्दी में रखा गया है; स्त्रीलिंग क्रिया ‘वेदी’ के अनुसार है।
- source_word: מִזְבֵּחַ
  choice: एक वेदी
  rationale: बलि चढ़ाने के स्थान के लिए प्रचलित और स्पष्ट हिन्दी शब्द ‘वेदी’ उपयुक्त है।
- source_word: וַיִּקְרָא לַמָּקוֹם
  choice: उस स्थान का नाम…रखा
  rationale: नामकरण के प्रसंग में यह आधुनिक हिन्दी का स्वाभाविक रूप है और इब्रानी अर्थ को स्पष्ट रखता है।
- source_word: אֵל בֵּית אֵל
  choice: एल-बेतेल
  rationale: यहाँ यह उस स्थान को दिया गया नाम है, इसलिए मुख्य पाठ में लिप्यंतरण रखा गया है; इसका संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह नाम रखने का कारण प्रस्तुत करता है।
- source_word: נִגְלוּ הָאֱלֹהִים
  choice: परमेश्वर ने अपने आपको…प्रकट किया था
  rationale: निफ़अल रूप में ईश्वरीय आत्म-प्रकटीकरण का भाव है। प्रसंग एक परमेश्वर की ओर संकेत करता है, इसलिए हिन्दी में एकवचन रखा गया है।
- source_word: בְּבָרְחוֹ מִפְּנֵי אָחִיו
  choice: जब वह अपने भाई से भागा था
  rationale: कालवाचक infinitive construction और מִפְּנֵי के पलायन-संबंधी अर्थ को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: אֱלֹהִים के साथ बहुवचन क्रिया נִגְלוּ
  choice: 'एकवचन: ‘परमेश्वर ने अपने आपको उसके सामने प्रकट किया था’'
  alternative: रूप की दृष्टि से बहुवचन अनुवाद, जिससे ‘देवताओं’ का अर्थ निकल सकता है
  rationale: इब्रानी में संज्ञा और क्रिया दोनों बहुवचन रूप में हैं, पर इस कथानक और बेतेल की पूर्व घटना में अभिप्रेत सत्ता इस्राएल का एक परमेश्वर है। हिन्दी में व्याकरणिक बहुवचन रखने से अनचाहा बहुदेववादी अर्थ निकलता; इसलिए अभिप्रेत संदर्भ के अनुसार एकवचन किया गया है।
- issue: אֵל בֵּית אֵל का अनुवाद या लिप्यंतरण
  choice: मुख्य पाठ में ‘एल-बेतेल’
  alternative: ‘बेतेल का परमेश्वर’
  rationale: वाक्य में यह याकूब द्वारा स्थान को दिया गया नाम है। इसलिए नाम को लिप्यंतरित किया गया है, जबकि उसका संभावित अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उस स्थान का नाम…रखा’ हिन्दी में नामकरण का स्वाभाविक मुहावरा है; ‘अपने आपको उसके सामने प्रकट किया’ आत्म-प्रकटीकरण का भाव बनाए रखता है।
