lexical_decisions:
- source_word: וַתָּמָת
  choice: मृत्यु हो गई
  rationale: מות का सीधा अर्थ शारीरिक मृत्यु है। यह स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी है तथा व्यंजना से बचती है।
- source_word: רָחֵל
  choice: राहेल
  rationale: हिब्रू व्यक्तिगत नाम का हिन्दी बाइबल परंपरा के अनुरूप लिप्यंतरण।
- source_word: וַתִּקָּבֵר
  choice: उसे ... दफ़नाया गया
  rationale: קבר का निफ़अल रूप कर्मवाच्य है। हिब्रू में 'वहाँ' स्पष्ट रूप से नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: בְּדֶרֶךְ
  choice: के मार्ग में
  rationale: यह पद यात्रा-पथ पर स्थित स्थान को सूचित करता है; 'के मार्ग में' संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: אֶפְרָתָה
  choice: एप्रात
  rationale: गंतव्य-सूचक अंतिम ה के साथ स्थान-नाम का संक्षिप्त पारंपरिक रूप; पूर्ण रूप 'एप्राता' पाद-टिप्पणी में सुरक्षित है।
- source_word: הִוא
  choice: अर्थात्
  rationale: स्त्रीलिंग सर्वनाम यहाँ समानाधिकरण में एप्रात की पहचान बेतलेहेम के रूप में कराता है। कोष्ठक सहित 'अर्थात्' इस व्याख्यात्मक कार्य को सहज हिन्दी में व्यक्त करता है।
- source_word: בֵּית לָחֶם
  choice: बेतलेहेम
  rationale: हिब्रू स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
