  yaml_path: translation/ot/genesis/035/021.yaml
  text: Then Israel journeyed on and pitched his tent beyond Migdal-eder[a].
translation:
  language: hi
  text: फिर इस्राएल आगे चला और उसने मिग्दल-एदेर[a] के पार अपना तंबू खड़ा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मिग्दल-एदेर का अर्थ है ‘झुंड की मीनार।’
    reason: स्थान-नाम के मूल इब्रानी अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּסַּע
  choice: आगे चला
  rationale: נסע का कथात्मक रूप पड़ाव उठाकर आगे की यात्रा करने को दर्शाता है; ‘आगे चला’ क्रम और गति दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: इब्रानी पाठ में यहाँ ‘इस्राएल’ नाम है; इसलिए इसे ‘याकूब’ से नहीं बदला गया।
- source_word: וַיֵּט
  choice: खड़ा किया
  rationale: तंबू के साथ נטה का मुहावरेदार अर्थ तंबू लगाना या खड़ा करना है।
- source_word: אָהֳלֹה
  choice: अपना तंबू
  rationale: אֹהֶל के साथ तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय है; हिन्दी में समान कर्ता के संदर्भ में ‘अपना तंबू’ स्वाभाविक है।
- source_word: מֵהָלְאָה
  choice: के पार
  rationale: यह क्रियाविशेषण किसी स्थल-चिह्न से और आगे या उसके पार की स्थिति बताता है।
- source_word: לְמִגְדַּל עֵדֶר
  choice: मिग्दल-एदेर
  rationale: यहाँ पदबंध स्थान-नाम के रूप में प्रयुक्त है, इसलिए उसका लिप्यंतरण किया गया है; शाब्दिक अर्थ पाद-टिप्पणी में दिया गया है।
