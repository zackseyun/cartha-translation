  text: וְ/עַתָּה֙ יִשְׂרָאֵ֔ל מָ֚ה יְהוָ֣ה אֱלֹהֶ֔י/ךָ שֹׁאֵ֖ל מֵ/עִמָּ֑/ךְ כִּ֣י אִם לְ֠/יִרְאָה אֶת יְהוָ֨ה אֱלֹהֶ֜י/ךָ לָ/לֶ֤כֶת בְּ/כָל דְּרָכָי/ו֙ וּ/לְ/אַהֲבָ֣ה אֹת֔/וֹ וְ/לַֽ/עֲבֹד֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/012.yaml
  text: And now[a], Israel, what does Yahweh your God ask of you, except to fear Yahweh your God, to walk in all his ways, to love him[c][b], and to serve Yahweh your God with all your heart and with all your soul?
translation:
  language: hi
  text: और अब, हे इस्राएल, याहवे तुम्हारा परमेश्वर तुमसे क्या माँगता[a] है? केवल यह कि तुम याहवे अपने परमेश्वर का भय मानो[b], उसके सभी मार्गों पर चलो, उससे प्रेम करो, और अपने सारे मन और अपने सारे प्राण[c] से याहवे अपने परमेश्वर की सेवा करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुमसे क्या अपेक्षा करता है”; इब्रानी क्रिया ऐसी माँग भी जता सकती है जिसमें दायित्व निहित हो।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भय मानना” श्रद्धा, विस्मय और आज्ञाकारी निष्ठा को भी समेटे हुए है।
    reason: lexical_alternative
  - marker: c
    text: या “अपने सारे जीवन” अथवा “अपने संपूर्ण अस्तित्व से”; इब्रानी शब्द नेफेश का अर्थ संदर्भ के अनुसार प्राण, जीवन या स्वयं व्यक्ति हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक ו और उपदेश में नए निष्कर्ष की ओर ले जाने वाले עַתָּה, दोनों की शक्ति को बनाए रखता है।
- source_word: מָה ... שֹׁאֵל מֵעִמָּךְ
  choice: तुमसे क्या माँगता है
  rationale: שׁאל עם מן/מעם का अर्थ माँगना और संदर्भानुसार अपेक्षा करना भी हो सकता है; ‘माँगता’ प्रश्नात्मक शैली को स्वाभाविक रखते हुए दायित्व की छाया को टिप्पणी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय उस इस्राएल को संबोधित करता है जिसे सामूहिक रूप से एक व्यक्ति माना गया है; आधुनिक हिन्दी में ‘तुम्हारा’ सहज है।
- source_word: כִּי אִם
  choice: केवल यह कि
  rationale: यह पदबंध यहाँ प्रश्न के उत्तर में माँगी गई बातों को सीमित और स्पष्ट करता है; हिन्दी में यह रूप ‘except/only that’ की शक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְיִרְאָה
  choice: भय मानो
  rationale: ירא के भय, श्रद्धा, विस्मय और आज्ञाकारी निष्ठा के व्यापक अर्थ को ‘भय मानना’ बनाए रखता है; केवल ‘आदर करना’ इसकी तीव्रता घटा देता।
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: उसके सभी मार्गों पर चलो
  rationale: नैतिक जीवन के लिए प्रयुक्त इब्रानी ‘चलने’ के रूपक को स्पष्ट और प्रचलित हिन्दी में सुरक्षित रखा गया है।
- source_word: וּלְאַהֲבָה אֹתוֹ
  choice: उससे प्रेम करो
  rationale: सीधा और स्वाभाविक अनुवाद, जो याहवे के प्रति वाचागत और भावात्मक निष्ठा व्यक्त करता है।
- source_word: וְלַעֲבֹד
  choice: सेवा करो
  rationale: עבד में आराधना सम्मिलित हो सकती है, पर ‘सेवा’ इसे केवल उपासना-विधि तक सीमित किए बिना आज्ञाकारिता और समर्पण की व्यापकता रखती है।
- source_word: בְּכָל לְבָבְךָ
  choice: अपने सारे मन से
  rationale: לֵבָב इच्छा, विचार और भीतरी व्यक्ति का केंद्र है; आधुनिक हिन्दी में ‘मन’ इस प्रयोग में ‘हृदय’ से अधिक सहज और पर्याप्त व्यापक है।
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: अपने सारे प्राण से
  rationale: נֶפֶשׁ जीवन, प्राण, व्यक्ति या संपूर्ण अस्तित्व का बोध करा सकता है; ‘प्राण’ पारंपरिक प्रतिध्वनि और जीवन-समर्पण दोनों को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: वाचा के संदर्भ में ירא की शक्ति
  choice: भय मानो
  alternative: श्रद्धा रखो
  rationale: यहाँ भय में श्रद्धा और विस्मय के साथ आज्ञाकारिता भी निहित है। ‘भय’ मूल की धर्मवैचारिक कसावट को बनाए रखता है और उसे केवल सम्मान तक सीमित नहीं करता।
- issue: נֶפֶשׁ का मानव-स्वरूप संबंधी अर्थ
  choice: प्राण
  alternative: जीवन / संपूर्ण अस्तित्व
  rationale: पाठ किसी तकनीकी द्वैतवादी मानव-विज्ञान को स्पष्ट नहीं करता। ‘प्राण’ मूल की अर्थ-व्याप्ति को खुला रखता है, और टिप्पणी जीवन/स्व का विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। सामूहिक इस्राएल को मूल में एकवचन संबोधन के अनुरूप हिन्दी में ‘तुम’ कहा गया है। समानांतर आज्ञाओं को हिन्दी में स्पष्ट विधिलिंग रूप देकर मूल प्रश्न की एकता और सूची की लय सुरक्षित रखी गई है।
