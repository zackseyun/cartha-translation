base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/020.yaml
  text: You shall fear Yahweh your God[a]; him you shall serve, to him you shall cling[b], and by his name you shall swear.
translation:
  language: hi
  text: तुम अपने परमेश्वर यहोवा का भय मानना; उसी की सेवा करना, उसी से जुड़े रहना[a], और उसके नाम से शपथ खाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसी को दृढ़ता से थामे रहना।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक रूप को स्वाभाविक हिन्दी में ‘अपने परमेश्वर’ कहा गया है।
- source_word: תִּירָא
  choice: भय मानना
  rationale: यह वाचा के संदर्भ में श्रद्धामिश्रित भय को दर्शाता है; ‘भय मानना’ मूल अर्थ का भार बनाए रखता है और केवल सम्मान तक इसे सीमित नहीं करता।
- source_word: אֹתוֹ תַעֲבֹד
  choice: उसी की सेवा करना
  rationale: आरम्भ में आए कर्मवाचक सर्वनाम का जोर ‘उसी’ से सुरक्षित रखा गया है; עבד का मूल अर्थ ‘सेवा करना’ है, जिसमें यहाँ उपासना का भाव भी निहित है।
- source_word: וּבוֹ תִדְבָּק
  choice: उसी से लिपटे रहना
  rationale: דבק निकटता से जुड़े रहने और वाचा की निष्ठा का सजीव बिंब देता है; ‘लिपटे रहना’ उस संबंधपरक बल को बनाए रखता है।
- source_word: וּבִשְׁמוֹ תִּשָּׁבֵעַ
  choice: उसी के नाम की शपथ खाना
  rationale: हिब्रू मुहावरा किसी के नाम से शपथ लेने को दर्शाता है; ‘नाम की शपथ खाना’ हिन्दी का स्वाभाविक और कानूनी-वाचागत प्रयोग है।
theological_decisions:
- issue: वाचागत आदेशों के रूप में हिब्रू अपूर्ण क्रियाएँ
  choice: ‘भय मानना… सेवा करना… लिपटे रहना… शपथ खाना’ की आज्ञार्थक अनंत क्रिया-श्रृंखला
  alternative: ‘भय मान… सेवा कर… लिपटा रह… शपथ खा’ अथवा भविष्यकालीन ‘तू… करेगा’
  rationale: हिब्रू अपूर्ण रूप यहाँ वाचा-संबंधी आदेश देते हैं। हिन्दी में यह रचना विधिक-उपदेशात्मक लय और आदेश की निरंतरता को स्वाभाविक रूप से व्यक्त करती है।
- issue: תִּירָא में भय और श्रद्धा का संबंध
  choice: ‘भय मानना’
  alternative: ‘श्रद्धा रखना’ या ‘आदर करना’
  rationale: मूल क्रिया वास्तविक भय और श्रद्धापूर्ण विस्मय दोनों का तनाव रखती है; केवल ‘आदर’ कहने से उसका अर्थ अनावश्यक रूप से नरम हो जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधे संबोधन वाला वाचागत निर्देश। ‘उसी’ की पुनरावृत्ति हिब्रू में यहोवा पर दिए गए विशेष जोर को सुरक्षित रखती है।
