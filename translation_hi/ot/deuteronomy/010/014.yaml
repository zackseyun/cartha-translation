  edition: WLC
  text: הֵ֚ן לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/שָּׁמַ֖יִם וּ/שְׁמֵ֣י הַ/שָּׁמָ֑יִם הָ/אָ֖רֶץ וְ/כָל אֲשֶׁר בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/014.yaml
  text: Behold[a], to Yahweh your God belong the heavens, even the highest heavens, the earth, and all that is in it.
translation:
  language: hi
  text: देखो, आकाश, यहाँ तक कि सबसे ऊँचे आकाश[a], पृथ्वी और जो कुछ उसमें है, सब तुम्हारे परमेश्वर याहवे के हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आकाश और आकाशों के आकाश।”
    reason: मूल हिब्रू की तीव्रतासूचक रचना को सुरक्षित रखना।
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने और कथन पर बल देने वाला अव्यय है। ‘देखो’ इसकी गंभीर, उद्घोषणात्मक शक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर यहोवा के हैं
  rationale: לַ यहाँ स्वामित्व प्रकट करता है; हिन्दी में ‘के हैं’ उस संबंध को स्पष्ट और सहज रूप से व्यक्त करता है। אֱלֹהֶיךָ का एकवचन संबोधन ‘तुम्हारे परमेश्वर’ रखा गया है।
- source_word: הַשָּׁמַיִם
  choice: आकाश
  rationale: हिब्रू रूप बहुवचन है, पर आधुनिक हिन्दी में ब्रह्मांडीय विस्तार के लिए ‘आकाश’ स्वाभाविक सामूहिक संज्ञा है।
- source_word: וּשְׁמֵי הַשָּׁמָיִם
  choice: वरन् सबसे ऊँचे आकाश
  rationale: शाब्दिक ‘आकाशों के आकाश’ एक तीव्रतासूचक/श्रेष्ठतासूचक रचना है। मुख्य पाठ में उसका स्पष्ट अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: आकाश के समानांतर और उसमें की सब वस्तुओं के उल्लेख के कारण यहाँ किसी सीमित देश के बजाय समूची पृथ्वी अभिप्रेत है।
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: तथा जो कुछ उसमें है, सब
  rationale: यह पृथ्वी की समस्त सामग्री को समेटता है। ‘उसमें’ בָּהּ के निकट है, और ‘सब’ वाक्य के स्वामित्व-विधान को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से इसे सामान्य पदवी ‘प्रभु’ में नहीं बदला गया और व्यक्तिगत नाम का स्वरूप सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर किंतु सहज शैली। पद का स्वामित्व-विधान अन्त में रखकर हिन्दी वाक्य-क्रम स्वाभाविक बनाया गया है; ‘वरन्’ दूसरे पद को पहले का विस्तार और तीव्रता दिखाता है।
