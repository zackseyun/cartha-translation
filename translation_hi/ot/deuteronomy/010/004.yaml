  text: וַ/יִּכְתֹּ֨ב עַֽל הַ/לֻּחֹ֜ת כַּ/מִּכְתָּ֣ב הָ/רִאשׁ֗וֹן אֵ֚ת עֲשֶׂ֣רֶת הַ/דְּבָרִ֔ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה אֲלֵי/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֣וֹם הַ/קָּהָ֑ל וַ/יִּתְּנֵ֥/ם יְהוָ֖ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/004.yaml
  text: And he wrote on the tablets[a], like the first writing, the Ten Words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly; and Yahweh gave them to me.
translation:
  language: hi
  text: और उसने पटियाओं पर पहले लेख के समान वे दस वचन[a] लिखे, जो यहोवा ने सभा के दिन पर्वत पर आग के बीच से तुम से कहे थे; और यहोवा ने उन्हें मुझे दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत रूप से इन ‘दस वचनों’ को ‘दस आज्ञाएँ’ कहा जाता है। इब्रानी में अक्षरशः: ‘दस वचन।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: और उसने ... लिखे
  rationale: כתב का सामान्य अर्थ ‘लिखना’ है। पत्थर की पटियाओं के संदर्भ में ‘अंकित किए’ संभव है, पर ‘लिखे’ आगे आने वाले מִכְתָּב (‘लेख’) से शब्दगत संबंध बनाए रखता है।
- source_word: הַלֻּחֹת
  choice: पटियाओं
  rationale: वाचा के संदर्भ में לֻחֹת लेखन की पटियाओं को दर्शाता है। इस पद में ‘पत्थर’ स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: כַּמִּכְתָּב הָרִאשׁוֹן
  choice: पहले लेख के समान
  rationale: उपसर्ग כ तुलना (‘के समान’) व्यक्त करता है और מִכְתָּב लिखित सामग्री अथवा लेख को दर्शाता है। यह अनुवाद पहली पटियाओं के लेख से तुलना को सुरक्षित रखता है।
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: वे दस वचन
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘दस वचन/बातें’ है। ‘दस वचन’ स्रोत की अभिव्यक्ति को बनाए रखता है; प्रचलित ‘दस आज्ञाएँ’ पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: जिन्हें यहोवा ने ... तुमसे कहा था
  rationale: संबंधवाचक उपवाक्य उन वचनों की ओर लौटता है जो लिखे जाने से पहले कहे गए थे; ‘कहा था’ इस पूर्वकालिक संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בָּהָר
  choice: पर्वत पर
  rationale: यहाँ בְּ स्थान को दर्शाता है; सीनै/होरेब पर प्रकाशन के संदर्भ में ‘पर्वत पर’ स्वाभाविक है।
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: आग के बीच से
  rationale: यह वाक्यांश इस बात पर बल देता है कि वाणी आग के भीतर से निकली; हिन्दी मुहावरा स्रोत की सजीव छवि बनाए रखता है।
- source_word: בְּיוֹם הַקָּהָל
  choice: सभा के दिन
  rationale: קָהָל इस्राएल की एकत्र सभा को दर्शाता है। ‘सभा के दिन’ संक्षिप्त, स्वाभाविक और मूल संरचना के निकट है।
- source_word: וַיִּתְּנֵם יְהוָה אֵלָי
  choice: और यहोवा ने वे पटियाएँ मुझे दे दीं
  rationale: ‘उन्हें’ का व्याकरणिक संकेत संदर्भ में पटियाओं की ओर है। हिन्दी में संभावित अस्पष्टता से बचने के लिए संज्ञा दोहराई गई, जबकि נתן का सीधा अर्थ ‘देना’ रखा गया।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है, इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ अधिक व्यापक रूप से पहचाना और समझा जाता है; ‘याहवे’ अधिक निकट लिप्यंतरण माना जा सकता है।
- issue: עֲשֶׂרֶת הַדְּבָרִים का निरूपण
  choice: दस वचन
  alternative: दस आज्ञाएँ
  rationale: मूल पदबंध अक्षरशः ‘दस वचन’ कहता है। पारंपरिक और अर्थ-संगत ‘दस आज्ञाएँ’ को मुख्य पाठ में थोपने के बजाय पादटिप्पणी में रखा गया है, जिससे स्रोत की शब्दावली और उसका विधिक संदर्भ दोनों उपलब्ध रहें।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वाक्य की इब्रानी कथात्मक गति सुरक्षित है। ‘पटियाएँ,’ ‘लेख,’ ‘वचन,’ और ‘सभा’ जैसे परिचित शब्द चुने गए हैं; अनावश्यक संस्कृतनिष्ठता और संप्रदायगत शब्दावली से बचा गया है।
