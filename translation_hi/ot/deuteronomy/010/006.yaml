  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל נָֽסְע֛וּ מִ/בְּאֵרֹ֥ת בְּנֵי יַעֲקָ֖ן מוֹסֵרָ֑ה שָׁ֣ם מֵ֤ת אַהֲרֹן֙ וַ/יִּקָּבֵ֣ר שָׁ֔ם וַ/יְכַהֵ֛ן אֶלְעָזָ֥ר בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/006.yaml
  text: The sons of Israel journeyed from Beeroth Bene-jaakan to Moserah[a]. There Aaron died, and there he was buried[b]; and Eleazar his son served as priest in his place.
translation:
  language: hi
  text: इस्राएल के पुत्र बेएरोत-बने-याकान से मोसेरा[a] के लिए चल पड़े। वहाँ हारून की मृत्यु हुई और वहीं उसे दफ़नाया गया; और उसका पुत्र एलिआज़ार उसके स्थान पर[b] याजक के रूप में सेवा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेएरोत-बने-याकान’ का शाब्दिक अर्थ ‘याकान के पुत्रों के कुएँ’ समझा जा सकता है; यहाँ इसे स्थान-नाम मानकर लिप्यंतरित किया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसके बाद याजक के रूप में सेवा की।’ इब्रानी में शाब्दिक रूप से ‘उसके स्थान पर’ है, जो उत्तराधिकार का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: इब्रानी वंश-सूचक राष्ट्रीय अभिव्यक्ति को सुरक्षित रखता है; आरंभिक ו को अलग से ‘और’ कहना हिन्दी में इस प्रसंगांतर के लिए आवश्यक नहीं।
- source_word: נָסְעוּ
  choice: चल पड़े
  rationale: यात्रा-संदर्भ में נסע पड़ाव छोड़कर आगे बढ़ने को दर्शाता है; ‘चल पड़े’ सहज आधुनिक हिन्दी में इस भाव को व्यक्त करता है।
- source_word: מִבְּאֵרֹת בְּנֵי יַעֲקָן
  choice: बेएरोत-बने-याकान से
  rationale: इसे मरुभूमि के स्थान-नाम के रूप में लिप्यंतरित किया गया है, जबकि מִ का अर्थ ‘से’ स्पष्ट रखा गया है।
- source_word: מוֹסֵרָה
  choice: मोसेरा के लिए
  rationale: गमन-वाक्य में बिना व्यक्त पूर्वसर्ग के भी यह गंतव्य है; हिन्दी में ‘के लिए’ गंतव्य को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: שָׁם ... שָׁם
  choice: वहाँ ... वहीं
  rationale: इब्रानी की स्थान-सूचक पुनरावृत्ति और दूसरे प्रयोग के बल को हिन्दी में बनाए रखता है।
- source_word: וַיִּקָּבֵר
  choice: उसे दफ़नाया गया
  rationale: निफ़अल रूप का कर्मवाच्य अर्थ सुरक्षित है; किसी अनुलिखित कर्ता को नहीं जोड़ा गया।
- source_word: וַיְכַהֵן
  choice: याजक के रूप में सेवा करने लगा
  rationale: क्रिया כהן याजकीय कार्य करने को बताती है; ‘करने लगा’ हारून के बाद आरंभ हुई सेवा को प्रसंगानुकूल व्यक्त करता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: शाब्दिक स्थानापन्नता और उत्तराधिकार—दोनों भावों को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: एलिआज़ार की याजकीय उत्तराधिकारिता
  choice: उसके स्थान पर याजक के रूप में सेवा करने लगा
  alternative: उसके बाद याजक के रूप में सेवा करने लगा
  rationale: תַּחְתָּיו का अधिक सीधा अर्थ ‘उसके स्थान पर’ है; इससे उत्तराधिकार स्पष्ट होता है, पर पद से अधिक कोई धार्मिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। स्थान-नामों को देवनागरी में लिप्यंतरित किया गया है; इब्रानी की स्थान-सूचक पुनरावृत्ति बनाए रखी गई है।
