language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אַ֤עַשׂ אֲרוֹן֙ עֲצֵ֣י שִׁטִּ֔ים וָ/אֶפְסֹ֛ל שְׁנֵי לֻחֹ֥ת אֲבָנִ֖ים כָּ/רִאשֹׁנִ֑ים וָ/אַ֣עַל הָ/הָ֔רָ/ה וּ/שְׁנֵ֥י הַ/לֻּחֹ֖ת בְּ/יָדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/003.yaml
  text: So I made an ark of acacia wood and cut two stone tablets like the first ones[a], and I went up the mountain with the two tablets in my hand.
translation:
  language: hi
  text: इसलिए मैंने बबूल की लकड़ी का एक संदूक बनाया और पहले जैसी पत्थर की दो पटियाएँ तराशी[a]। फिर उन दोनों पटियाओं को हाथ में लेकर मैं पर्वत पर चढ़ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पत्थर की दो पटियाएँ पहले वाली पटियाओं के समान काटकर बनाईं।”
    reason: פסל में पत्थर को काटने और आकार देने—दोनों का भाव हो सकता है; मुख्य पाठ में ‘तराशी’ है और पाद-टिप्पणी अधिक स्पष्ट शाब्दिक विकल्प देती है।
lexical_decisions:
- source_word: וָאַעַשׂ
  choice: मैंने ... बनाया
  rationale: עשה का सीधा और स्वाभाविक अर्थ ‘बनाना’ है; यह क्रियाओं के क्रम को स्पष्ट रखता है।
- source_word: אֲרוֹן
  choice: संदूक
  rationale: אֲרוֹן मूलतः पेटी या संदूक को दर्शाता है। इस स्थल पर ‘संदूक’ आधुनिक हिन्दी में वस्तु का रूप स्पष्ट करता है और प्रसंग की पवित्रता में कोई अतिरिक्त उपाधि नहीं जोड़ता।
- source_word: עֲצֵי שִׁטִּים
  choice: बबूल की लकड़ी
  rationale: यह शिट्टीम/अकेशिया वर्ग की लकड़ी है; ‘बबूल की लकड़ी’ हिन्दी पाठकों के लिए प्रचलित और सहज वनस्पति-संबंधी अभिव्यक्ति है।
- source_word: וָאֶפְסֹל
  choice: तराशी
  rationale: פסל यहाँ पत्थर काटकर और आकार देकर पटियाएँ बनाने को सूचित करता है। ‘तराशी’ इस हस्तकारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֻחֹת אֲבָנִים
  choice: पत्थर की दो पटियाएँ
  rationale: यह पत्थर से बनी लेखन-पट्टिकाओं को दर्शाता है; ‘पटियाएँ’ आधुनिक और सुबोध हिन्दी है।
- source_word: כָּרִאשֹׁנִים
  choice: पहले जैसी
  rationale: तुलनात्मक כ और רִאשֹׁנִים पहले वाली पटियाओं से समानता बताते हैं; हिन्दी में ‘पहले जैसी’ संक्षिप्त और स्वाभाविक है।
- source_word: וָאַעַל הָהָרָה
  choice: मैं पर्वत पर चढ़ गया
  rationale: עלה और दिशासूचक रूप הָהָרָה ऊपर पर्वत पर जाने की गति व्यक्त करते हैं; ‘चढ़ गया’ इसे स्पष्ट करता है।
- source_word: בְּיָדִי
  choice: हाथ में लेकर
  rationale: इब्रानी में ‘मेरे हाथ में’ एकवचन है। हिन्दी का ‘हाथ में लेकर’ उसी भाव को स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: वाचा की पटियाओं के पवित्र पात्र का नाम
  choice: संदूक
  alternative: वाचा का सन्दूक / पवित्र सन्दूक
  rationale: मूल शब्द אֲרוֹן सामान्यतः संदूक या पेटी है। इस पद में विशेषण मूल पाठ में नहीं है, इसलिए ‘संदूक’ वस्तु को ठीक-ठीक बताता है और अतिरिक्त धार्मिक पदवी नहीं जोड़ता; प्रसंग उसका विशिष्ट उपयोग स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘इसलिए’ पिछले कथन से निष्कर्षात्मक संबंध दिखाता है। क्रियाओं का क्रम इब्रानी वृत्तांत के अनुसार सुरक्षित है; अंतिम वाक्य को स्वाभाविक हिन्दी के लिए पुनर्गठित किया गया है।
