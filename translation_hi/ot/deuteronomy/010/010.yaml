source:
  edition: WLC
  text: וְ/אָנֹכִ֞י עָמַ֣דְתִּי בָ/הָ֗ר כַּ/יָּמִים֙ הָ/רִ֣אשֹׁנִ֔ים אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וַ/יִּשְׁמַ֨ע יְהוָ֜ה אֵלַ֗/י גַּ֚ם בַּ/פַּ֣עַם הַ/הִ֔וא לֹא אָבָ֥ה יְהוָ֖ה הַשְׁחִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/010.yaml
  text: As for me[a], I stood on the mountain as at the first time, forty days and forty nights, and Yahweh listened to me that time also; Yahweh was not willing to destroy you.
translation:
  language: hi
  text: मैं पहले दिनों की तरह चालीस दिन और चालीस रात पर्वत पर ठहरा रहा। उस समय भी याहवे ने मेरी सुनी[a]; याहवे तुम्हें नष्ट नहीं करना चाहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी बात सुनी।” इब्रानी क्रिया का अर्थ केवल सुनना या अनुकूलता से सुनना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम से मूसा पर हल्का बल पड़ता है। हिन्दी में अलग से ‘जहाँ तक मेरी बात है’ कहना अस्वाभाविक रूप से भारी होता; स्पष्ट ‘मैं’ प्रसंग में पर्याप्त है।
- source_word: עָמַדְתִּי
  choice: ठहरा रहा
  rationale: मूल क्रिया का सामान्य अर्थ ‘खड़ा होना’ है, पर चालीस दिन और रात पहाड़ पर उपस्थिति के इस प्रसंग में यह बने रहने या ठहरे रहने का भाव देती है; ‘खड़ा रहा’ अनचाहे शारीरिक मुद्रा का अर्थ देता।
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: पहली बार की तरह
  rationale: शाब्दिक ‘पहले दिनों के समान’ पहले चालीस-दिवसीय अवसर की ओर संकेत करता है। ‘पहली बार की तरह’ आधुनिक हिन्दी में वही तुलना स्पष्ट करता है।
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: चालीस दिन और चालीस रात
  rationale: अवधि के सूत्र का सीधा और स्वाभाविक अनुवाद।
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: याहवे ने मेरी सुनी
  rationale: שׁמע के साथ אֶל यहाँ केवल ध्वनि सुनने से अधिक, अनुकूलतापूर्वक ध्यान देने का भाव रख सकता है। हिन्दी मुहावरा ‘मेरी सुनी’ इस प्रत्युत्तरकारी अर्थ को संक्षेप में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: उस बार भी
  rationale: यह पदबंध उसी अवसर पर पहले की तरह मिले अनुकूल प्रत्युत्तर को दिखाता है; ‘उस बार भी’ सहज और सटीक है।
- source_word: לֹא אָבָה
  choice: तैयार नहीं हुआ
  rationale: क्रिया इच्छा या सहमति न होने को व्यक्त करती है। यह चयन उसके इच्छात्मक भाव को सुरक्षित रखता है।
- source_word: הַשְׁחִיתֶךָ
  choice: तुम्हें नष्ट करने
  rationale: हिफ़ील रूप इस प्रसंग में इस्राएल पर आने वाले विनाशकारी न्याय को स्पष्ट रूप से व्यक्त करता है। एकवचन ‘तुम्हें’ सामूहिक इस्राएल को संबोधित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: וַיִּשְׁמַע יְהוָה אֵלַי में ईश्वरीय प्रत्युत्तर का भाव
  choice: याहवे ने मेरी सुनी
  alternative: याहवे ने मेरी बात सुनी
  rationale: प्रसंग मूसा की मध्यस्थता का है। ‘मेरी सुनी’ सुनने और अनुकूल उत्तर देने, दोनों की संभावना बनाए रखता है, पर प्रार्थना के फल के बारे में पाठ से आगे कोई सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लम्बी इब्रानी समन्वयी रचना को हिन्दी में दो वाक्यों में बाँटा गया है, जबकि क्रम और तर्क सुरक्षित हैं। ‘खड़ा रहा’ के शाब्दिक लेकिन भ्रामक मुद्रा-संकेत से बचकर प्रसंगानुकूल ‘ठहरा रहा’ चुना गया है।
