  text: וּ/מַלְתֶּ֕ם אֵ֖ת עָרְלַ֣ת לְבַבְ/כֶ֑ם וְ/עָ֨רְפְּ/כֶ֔ם לֹ֥א תַקְשׁ֖וּ עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/016.yaml
  text: So circumcise the foreskin of your heart[c][b][a], and do not stiffen your neck any longer.
translation:
  language: hi
  text: इसलिए अपने हृदय के अग्रचर्म का खतना करो[a][b], और अब और अपनी गर्दन न अकड़ाओ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अपने हृदय के अग्रचर्म का खतना करो।” आरंभिक संयोजक को केवल जोड़ने वाला भी समझा जा सकता है, यद्यपि प्रसंग निष्कर्षसूचक अर्थ “इसलिए” का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में रूपक शाब्दिक रूप से “तुम्हारे हृदय का अग्रचर्म” है—परमेश्वर के प्रति भीतरी प्रतिरोध को दूर करने का चित्र।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, “अपनी गर्दन को अब और कठोर न करो”; अर्थात अब और हठीले न बनो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְתֶּם
  choice: इसलिए ... खतना करो
  rationale: संयोजक וּ को पिछले प्रसंग से निकलने वाले निष्कर्ष के रूप में लिया गया है। पूर्ण क्रिया यहाँ आदेशात्मक बल रखती है; हिंदी में स्पष्ट आज्ञार्थ स्वाभाविक है।
- source_word: עָרְלַת לְבַבְכֶם
  choice: अपने हृदय की खलड़ी
  rationale: ठोस इब्रानी रूपक ‘तुम्हारे हृदय की खलड़ी’ को सुरक्षित रखा गया है। ‘खलड़ी’ खतना से जुड़ी देहगत छवि को व्यक्त करती है और इसे केवल ‘हठ’ जैसे व्याख्यात्मक अर्थ में नहीं बदलती।
- source_word: לְבַבְכֶם
  choice: अपने हृदय
  rationale: לֵבָב मनुष्य के भीतरी व्यक्तित्व, इच्छा और समझ को समेटता है। ‘हृदय’ हिंदी में मानक और इस रूपक के लिए पर्याप्त रूप से स्पष्ट समतुल्य है।
- source_word: וְעָרְפְּכֶם
  choice: अपनी गर्दन
  rationale: עֹרֶף गर्दन या गुद्दी को दर्शाता है। हिंदी में हठ के मुहावरे के साथ ‘गर्दन’ स्वाभाविक है।
- source_word: לֹא תַקְשׁוּ עוֹד
  choice: फिर कभी हठ करके ... न अकड़ाओ
  rationale: हिफ़ील क्रिया गर्दन को कठोर या अकड़ी हुई करने का बिंब देती है। ‘गर्दन अकड़ाना’ हिंदी का स्वाभाविक मुहावरा है; ‘हठ करके’ अर्थ को सामान्य पाठक के लिए स्पष्ट करता है, और ‘फिर कभी ... न’ עוֹד सहित निषेध का बल व्यक्त करता है।
theological_decisions:
- issue: भीतरी खतने की वाचागत रूपक-भाषा
  choice: ‘अपने हृदय की खलड़ी का खतना करो’ रूपक को स्पष्ट रूप से बनाए रखना
  alternative: ‘अपने हृदय को शुद्ध करो’ अथवा ‘अपने हृदय का हठ दूर करो’
  rationale: मूल पाठ बाहरी वाचागत चिह्न को भीतरी नैतिक प्रत्युत्तर से जोड़ता है। रूपक को बनाए रखने से बाहरी चिह्न और भीतरी आज्ञाकारिता का तनाव सुरक्षित रहता है तथा किसी संकीर्ण doctrinal व्याख्या को पाठ में नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘खतना’ और ‘खलड़ी’ मूल की ठोस वाचागत छवि बनाए रखते हैं; ‘गर्दन अकड़ाना’ परिचित हिंदी मुहावरा है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
