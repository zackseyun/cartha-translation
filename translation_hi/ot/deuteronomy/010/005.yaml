source:
  edition: WLC
  text: וָ/אֵ֗פֶן וָֽ/אֵרֵד֙ מִן הָ/הָ֔ר וָֽ/אָשִׂם֙ אֶת הַ/לֻּחֹ֔ת בָּ/אָר֖וֹן אֲשֶׁ֣ר עָשִׂ֑יתִי וַ/יִּ֣הְיוּ שָׁ֔ם כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/005.yaml
  text: Then I turned and came down from the mountain[a], and I put the tablets in the ark that I had made; and they are there, just as Yahweh commanded me.
translation:
  language: hi
  text: तब मैं मुड़ा और पहाड़ से नीचे उतरा। मैंने पटियाओं को उस संदूक में रख दिया, जिस संदूक को मैंने बनाया था; और वे वहीं रहीं[a], जैसा यहवे ने मुझे आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “और वे वहाँ थीं”; इन शब्दों का यह अर्थ भी हो सकता है कि वे बोलने के समय तक वहीं रहीं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: तब मैं मुड़ा
  rationale: פנה का मूल अर्थ ‘मुड़ना’ है; ‘तब’ क्रमिक कथन को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וָאֵרֵד מִן הָהָר
  choice: पहाड़ से नीचे उतरा
  rationale: ירד नीचे जाने या उतरने को दर्शाता है; निश्चित पद הָהָר के अनुसार ‘पहाड़’ रखा गया है।
- source_word: וָאָשִׂם אֶת הַלֻּחֹת
  choice: मैंने पटियाओं को ... रख दिया
  rationale: שׂים के लिए ‘रख दिया’ सहज है और संदूक के भीतर रखने की पूर्ण क्रिया व्यक्त करता है; לֻחֹת को प्रसंगानुकूल ‘पटियाएँ’ कहा गया है, बिना इस पद में अनुपस्थित ‘पत्थर’ जोड़ने के।
- source_word: בָּאָרוֹן
  choice: संदूक में
  rationale: אָרוֹן का सामान्य अर्थ संदूक है; यह हिंदी में वस्तु का स्वरूप स्पष्ट रखता है और अनावश्यक रूप से किसी विशेष पारंपरिक पदावली पर निर्भर नहीं होता।
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: जिसे मैंने बनाया था
  rationale: सापेक्ष उपवाक्य संदूक को विशेषित करता है; ‘बनाया था’ पूर्ववर्ती क्रिया को स्वाभाविक हिंदी कालक्रम में रखता है।
- source_word: וַיִּהְיוּ שָׁם
  choice: और वे वहीं रहीं
  rationale: היה और שׁם का संयोजन वहाँ स्थित रहने का भाव दे सकता है। ‘वहीं रहीं’ वर्तमान कथन-समय तक बने रहने की संभावित ध्वनि रखता है, जबकि शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: כַּאֲשֶׁר צִוַּנִי
  choice: ठीक जैसा ... ने मुझे आज्ञा दी थी
  rationale: כַּאֲשֶׁר अनुरूपता को दर्शाता है; ‘ठीक जैसा’ उस बल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से प्रतिस्थापित करने के बजाय आधुनिक हिंदी में निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘यहवे’ उसका निकट हिंदी लिप्यंतरण है और नाम को किसी उपाधि में नहीं बदलता।
- issue: וַיִּהְיוּ שָׁם में स्थिति या निरंतरता
  choice: वे वहीं रहीं
  alternative: वे वहाँ थीं
  rationale: मुख्य पाठ निरंतर वहाँ बने रहने की संभावित ध्वनि व्यक्त करता है, पर इब्रानी रूप केवल ‘वहाँ थीं’ भी समझा जा सकता है; इस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘पटियाएँ’ और ‘संदूक’ सामान्य पाठक के लिए स्पष्ट हैं; वाक्य-विन्यास मूल इब्रानी के क्रम को यथासंभव बनाए रखते हुए स्वाभाविक हिंदी में रखा गया है।
