base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/021.yaml
  text: He is your praise[a], and he is your God[b], who has done for you these great and awe-inspiring things that your eyes have seen.
translation:
  language: hi
  text: वह तुम्हारी स्तुति है[a], और वह तुम्हारा परमेश्वर है, जिसने तुम्हारे लिए ये महान और भय तथा विस्मय उत्पन्न करने वाले कार्य किए हैं, जिन्हें तुम्हारी आँखों ने देखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह है जिसकी तुम स्तुति करते हो” अथवा “वह तुम्हारा गौरव है।” इब्रानी में शाब्दिक रूप से, “वह तुम्हारी स्तुति है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְהִלָּתְךָ
  choice: तुम्हारी स्तुति
  rationale: इब्रानी की संक्षिप्त विधेयात्मक अभिव्यक्ति को बनाए रखता है। इससे परमेश्वर के इस्राएल की स्तुति का विषय और आधार—दोनों होने का अर्थ खुला रहता है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: वाचा-संबंधी संबोधन का मानक और सीधा अनुवाद; एकवचन संबोधन सामूहिक इस्राएल को लक्ष्य करता है।
- source_word: עָשָׂה אִתְּךָ
  choice: तुम्हारे लिए ... किए हैं
  rationale: इस प्रसंग में मुहावरे का हितकारी अर्थ स्वाभाविक हिंदी में व्यक्त करता है—ये कार्य इस्राएल की ओर से और उसके हित में किए गए।
- source_word: הַגְּדֹלֹת
  choice: महान ... काम
  rationale: विशेषण यहाँ संज्ञात्मक रूप में प्रयुक्त है; ‘महान काम’ अर्थ की व्यापकता बनाए रखता है और इसे केवल सामर्थ्य तक सीमित नहीं करता।
- source_word: הַנּוֹרָאוֹת
  choice: भय-विस्मय जगानेवाले काम
  rationale: मूल शब्द में भय, श्रद्धा और विस्मय उत्पन्न करने की संयुक्त छाया है। यह पद केवल आतंक का अर्थ दिए बिना उसकी गंभीरता बनाए रखता है।
- source_word: הָאֵלֶּה
  choice: ये
  rationale: प्रत्यक्षदर्शी अनुभव से जुड़े पहले उल्लिखित कार्यों की निकटता और तात्कालिकता को बनाए रखता है।
- source_word: רָאוּ עֵינֶיךָ
  choice: जिन्हें तुम्हारी आँखों ने देखा है
  rationale: इब्रानी की सजीव प्रत्यक्षदर्शी अभिव्यक्ति और उसके प्रमाणात्मक बल को सुरक्षित रखता है।
- source_word: הוּא ... וְהוּא
  choice: वह ... और वह ... उसी ने
  rationale: सर्वनाम की पुनरावृत्ति से मूल का बलाघात बना रहता है, जबकि ‘केवल वही’ जैसी स्पष्ट विशिष्टता नहीं जोड़ी जाती।
theological_decisions:
- issue: הוּא תְהִלָּתְךָ का विधेयात्मक अर्थ
  choice: वह तुम्हारी स्तुति है
  alternative: वह है जिसकी तुम स्तुति करते हो; वह तुम्हारा गौरव है
  rationale: 'चुना हुआ पाठ मूल की काव्यात्मक संक्षिप्तता और अर्थगत तनाव को बनाए रखता है: परमेश्वर स्तुति का विषय भी है और उसका आधार भी।'
- issue: הַנּוֹרָאוֹת की अर्थ-छाया
  choice: भय-विस्मय जगानेवाले काम
  alternative: भयानक काम; आतंकित करनेवाले काम; विस्मयकारी काम
  rationale: मूल में भय और श्रद्धामय विस्मय दोनों संभव हैं। चुना हुआ रूप न तो इसे केवल विनाशकारी आतंक बनाता है, न भय की गंभीरता को मिटाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, सहज किंतु गरिमापूर्ण है। ‘तुम्हारी स्तुति’ मूल की असामान्य पर अर्थपूर्ण अभिव्यक्ति को जानबूझकर सुरक्षित रखता है। ‘भय-विस्मय जगानेवाले’ श्रद्धा और भय की संयुक्त अर्थ-छाया को सामान्य पाठक के लिए स्पष्ट करता है।
