base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/007.yaml
  text: From there they set out for Gudgodah[a], and from Gudgodah to Jotbathah, a land of streams of water.
translation:
  language: hi
  text: वहाँ से वे गुदगोदा की ओर रवाना हुए, और गुदगोदा से योतबाता पहुँचे, जो जलधाराओं वाला प्रदेश था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जलमार्गों वाला प्रदेश” अथवा “पानी की वादियों वाला प्रदेश।” हिब्रू पद बहती धाराओं, जलमार्गों या वादियों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: पूर्ववर्ती पड़ाव से प्रस्थान का स्थानिक क्रम स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त होता है।
- source_word: נָסְעוּ
  choice: रवाना हुए
  rationale: जंगल की यात्रा के प्रसंग में נסע का अर्थ डेरा उठाकर आगे चल पड़ना है; ‘रवाना हुए’ इस प्रस्थान-भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: הַגֻּדְגֹּדָה
  choice: गुदगोदा के लिए
  rationale: स्थान-नाम का लिप्यंतरण किया गया है; अंत का दिशासूचक ה उस स्थान की ओर यात्रा को दर्शाता है, जिसे ‘के लिए’ व्यक्त करता है।
- source_word: וּמִן הַגֻּדְגֺּדָה
  choice: और गुदगोदा से
  rationale: सरल संयोजक और अपादान-संबंध को बिना अतिरिक्त कालक्रम जोड़े सुरक्षित रखा गया है।
- source_word: יָטְבָתָה
  choice: योतबाता पहुँचे
  rationale: स्थान-नाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है; दिशासूचक रूप और निहित गति-भाव को स्वाभाविक हिन्दी में ‘पहुँचे’ से व्यक्त किया गया है।
- source_word: אֶרֶץ
  choice: प्रदेश
  rationale: यहाँ शब्द योतबाता का भौगोलिक वर्णन करता है; ‘प्रदेश’ आधुनिक हिन्दी में ‘देश’ की राजनीतिक ध्वनि से बचते हुए उपयुक्त है।
- source_word: נַחֲלֵי מָיִם
  choice: जलधाराओं वाला
  rationale: नַחַל बहती धारा, नाला या वादी के जलमार्ग को सूचित कर सकता है। ‘जलधाराओं वाला’ स्पष्ट, स्वाभाविक है और बहते पानी के मार्गों का मूल बिंब बनाए रखता है।
