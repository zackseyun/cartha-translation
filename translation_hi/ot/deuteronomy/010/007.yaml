  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यात्रा-वृत्तांत की संक्षिप्त शैली सुरक्षित है। स्थान-नाम हिब्रू रूपों के निकट देवनागरी में दिए गए हैं, और अर्थ-संबंधी पाद-टिप्पणी उसी वाक्यांश पर लगाई गई है जिससे वह संबंधित है।
