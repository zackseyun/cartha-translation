base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/018.yaml
  text: He executes justice for the fatherless and the widow[a], and loves the sojourner[c][b], giving him food and clothing.
translation:
  language: hi
  text: वह अनाथ[a] और विधवा को न्याय दिलाता है, और परदेशी[b] से प्रेम करता है और उसे भोजन[c] और वस्त्र देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का आशय विशेष रूप से पिता से वंचित व्यक्ति से है; अनुवाद ‘पितृहीन’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ऐसा गैर-स्थानीय व्यक्ति जो समुदाय में रह रहा हो, केवल राह चलता अजनबी नहीं।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘रोटी’; यहाँ इसका अर्थ जीवन-निर्वाह के लिए भोजन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפַּט
  choice: न्याय दिलाता है
  rationale: यह इब्रानी पदबंध असहाय लोगों के न्यायोचित अधिकार की रक्षा और उनके लिए न्याय करने का भाव रखता है। स्वाभाविक आधुनिक हिन्दी में ‘न्याय दिलाता है’ इसी सक्रिय न्यायिक अर्थ को व्यक्त करता है।
- source_word: יָתוֹם
  choice: अनाथ
  rationale: इब्रानी शब्द विशेषतः पिता से वंचित व्यक्ति को सूचित करता है; हिन्दी में ‘अनाथ’ इस सामाजिक रूप से असुरक्षित वर्ग का सहज और प्रचलित नाम है।
- source_word: אַלְמָנָה
  choice: विधवा
  rationale: यह मूल शब्द का सटीक और मानक हिन्दी रूप है।
- source_word: אֹהֵב
  choice: प्रेम करता है
  rationale: यह परमेश्वर की सक्रिय और स्थायी अनुरक्ति को सीधे व्यक्त करता है, उसे केवल भावना या केवल सहायता तक सीमित नहीं करता।
- source_word: גֵּר
  choice: तुम्हारे बीच रहनेवाला परदेशी
  rationale: גֵּר किसी राह चलते अजनबी के बजाय इस्राएल के बीच रहनेवाले गैर-स्थानीय व्यक्ति को दर्शाता है। यह पदबंध उसके निवास और परदेशी स्थिति दोनों को स्पष्ट करता है।
- source_word: לָתֶת לוֹ
  choice: उसे … देता है
  rationale: उद्देश्यसूचक इन्फिनिटिव यहाँ प्रेम की ठोस अभिव्यक्ति बताता है; हिन्दी में समन्वित क्रिया के रूप में अनुवाद सहज है।
- source_word: לֶחֶם
  choice: भोजन
  rationale: शाब्दिक अर्थ ‘रोटी’ है, पर वस्त्र के साथ यह जीवन-निर्वाह के भोजन को व्यापक रूप से दर्शाता है।
- source_word: שִׂמְלָה
  choice: वस्त्र
  rationale: यह कपड़े अथवा पहनावे के लिए सामान्य शब्द है; ‘वस्त्र’ गरिमापूर्ण और स्पष्ट हिन्दी है।
theological_decisions:
- issue: असुरक्षित लोगों के प्रति परमेश्वर की चिंता
  choice: न्यायिक कार्य, प्रेम और भौतिक सहायता—तीनों को स्पष्ट रूप से बनाए रखा गया है।
  alternative: केवल कानूनी पक्ष या केवल भावनात्मक करुणा पर बल देना।
  rationale: मूल पाठ परमेश्वर को न्याय करनेवाला और प्रेम करनेवाला दोनों बताता है तथा उस प्रेम को भोजन और वस्त्र देने में मूर्त करता है; अनुवाद इस तनाव और समग्रता को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। ‘तुम्हारे बीच’ प्रसंगगत समुदाय को स्पष्ट करता है और גֵּר की निवासी स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
