  text: וַ/אֲהַבְתֶּ֖ם אֶת הַ/גֵּ֑ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/019.yaml
  text: So love the foreigner[a], because you were foreigners in the land of Egypt.
translation:
  language: hi
  text: इसलिए परदेशी[a] से प्रेम करो, क्योंकि तुम मिस्र देश में परदेशी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परदेश में रहनेवाला,” “निवासी विदेशी,” अथवा “अजनबी।” इब्रानी शब्द गेर ऐसे गैर-स्थानीय व्यक्ति को दर्शाता है जो इस्राएल के बीच रहता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲהַבְתֶּם
  choice: इसलिए ... प्रेम रखो
  rationale: אהב का अर्थ ‘प्रेम करना’ है। आरम्भिक ו पिछले पद में परदेशी के प्रति परमेश्वर के प्रेम से निष्कर्षात्मक संबंध जोड़ता है; आधुनिक हिन्दी में ‘इसलिए’ उस संबंध और आज्ञार्थक बल दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַ/גֵּר
  choice: परदेशी
  rationale: גֵּר उस गैर-स्थानीय व्यक्ति को दर्शाता है जो इस्राएल के बीच निवास करता था और सामाजिक रूप से असुरक्षित हो सकता था। ‘परदेशी’ आधुनिक हिन्दी में बाहरी मूल और स्थानीय निवास—दोनों का संकेत दे सकता है, जबकि ‘अजनबी’ केवल अपरिचित व्यक्ति समझा जा सकता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आज्ञा का कारण प्रस्तुत करता है; ‘क्योंकि’ समकालीन हिन्दी में स्पष्ट और स्वाभाविक कारणसूचक है।
- source_word: גֵרִים
  choice: परदेशी
  rationale: यह גֵּר का बहुवचन है। पहले प्रयोग के समान ‘परदेशी’ रखने से मूल की शब्दगत एकता बनी रहती है; हिन्दी में संख्या क्रिया ‘थे’ और संदर्भ से स्पष्ट है।
- source_word: הֱיִיתֶם
  choice: तुम भी ... थे
  rationale: 'היה यहाँ भूतकालीन अवस्था बताता है। ‘भी’ मूल में अलग शब्द नहीं है, पर तुलना को हिन्दी में स्पष्ट और स्वाभाविक बनाता है: जिनसे प्रेम करना है, इस्राएली स्वयं भी वैसी स्थिति में रहे थे।'
- source_word: בְּ/אֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: אֶרֶץ को ‘देश’ के रूप में बनाए रखा गया है; यह इब्रानी अभिव्यक्ति को सुरक्षित रखते हुए स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: वाचा-संबंधी व्यवस्था में सामाजिक पहचान का शब्द גֵּר
  choice: परदेशी
  alternative: प्रवासी निवासी; विदेश से आकर बसा व्यक्ति; अजनबी
  rationale: पद इस्राएल की अपनी ऐतिहासिक असुरक्षा को बाहरी मूल के बीच-निवासी लोगों से प्रेम करने का आधार बनाता है। ‘परदेशी’ इस संबंध को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है तथा आधुनिक कानूनी श्रेणियाँ आरोपित नहीं करता। पादटिप्पणी स्पष्ट करती है कि आशय केवल राहगीर या अपरिचित व्यक्ति से नहीं है।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘प्रेम रखो’ नैतिक आज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है। ‘परदेशी’ की संभावित व्यापकता को पादटिप्पणी में सीमांकित किया गया है, ताकि इसे केवल अजनबी या थोड़े समय के यात्री के अर्थ में न पढ़ा जाए।
