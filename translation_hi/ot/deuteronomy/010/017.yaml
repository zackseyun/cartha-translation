id: DEU.10.17
reference: Deuteronomy 10:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֚וּא אֱלֹהֵ֣י הָֽ/אֱלֹהִ֔ים וַ/אֲדֹנֵ֖י הָ/אֲדֹנִ֑ים הָ/אֵ֨ל הַ/גָּדֹ֤ל הַ/גִּבֹּר֙ וְ/הַ/נּוֹרָ֔א אֲשֶׁר֙ לֹא יִשָּׂ֣א פָנִ֔ים וְ/לֹ֥א יִקַּ֖ח שֹֽׁחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/017.yaml
  text: For Yahweh your God is God of gods and Lord of lords[a], the great, mighty, and awesome God, who shows no partiality and takes no bribe.
translation:
  language: hi
  text: क्योंकि याहवे तुम्हारा परमेश्वर देवताओं का परमेश्वर और प्रभुओं का प्रभु है—वही महान, सामर्थी और भययोग्य[a] परमेश्वर है, जो किसी का पक्ष नहीं करता और घूस नहीं लेता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “विस्मयकारी”; इब्रानी शब्द का अर्थ है ऐसा जो श्रद्धामिश्रित भय उत्पन्न करे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण प्रस्तुत करता है; ‘क्योंकि’ इब्रानी के कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय इस्राएल को संबोधित करता है, जबकि संदर्भ में संज्ञा का अर्थ एकवचन है।
- source_word: אֱלֹהֵי הָאֱלֹהִים
  choice: देवताओं का परमेश्वर
  rationale: इब्रानी संबंध-श्रृंखला को सुरक्षित रखते हुए सर्वोच्चता का कथन व्यक्त किया गया है, बिना अन्य देवताओं के अस्तित्व-संबंधी प्रश्न को अनावश्यक रूप से तय किए।
- source_word: וַאֲדֹנֵי הָאֲדֹנִים
  choice: और प्रभुओं का प्रभु
  rationale: समानांतर इब्रानी उपाधि और उसकी गंभीर लय को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָאֵל הַגָּדֹל הַגִּבֹּר וְהַנּוֹרָא
  choice: वही महान, सामर्थी और भययोग्य परमेश्वर
  rationale: उपाधियों की क्रमबद्धता को रखा गया है। ‘भययोग्य’ आतंक मात्र नहीं, बल्कि श्रद्धामिश्रित भय जगाने वाले अर्थ को व्यक्त करता है। ‘वही’ हिन्दी में समानाधिकरण को स्पष्ट करता है।
- source_word: אֲשֶׁר לֹא יִשָּׂא פָנִים
  choice: जो किसी का पक्ष नहीं करता
  rationale: शाब्दिक मुहावरे ‘चेहरा नहीं उठाता’ का आशय पक्षपात न करना है; हिन्दी में अर्थगत मुहावरे से इसे स्पष्ट किया गया है।
- source_word: וְלֹא יִקַּח שֹׁחַד
  choice: और घूस नहीं लेता
  rationale: कानूनी और नैतिक बल को संक्षिप्त, सामान्य आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘देवताओं का परमेश्वर और प्रभुओं का प्रभु’ से जुड़े अस्तित्व-संबंधी निहितार्थ
  choice: इब्रानी सर्वोच्चता-सूत्र को ‘देवताओं का परमेश्वर और प्रभुओं का प्रभु’ के रूप में बनाए रखना
  alternative: सब देवताओं और प्रभुओं से सर्वोच्च परमेश्वर और प्रभु
  rationale: मूल संबंध-श्रृंखलाएँ याहवे की अद्वितीय सर्वोच्चता घोषित करती हैं, पर स्वयं इस वाक्य में अन्य ‘देवताओं’ की सत्ता का दार्शनिक विवेचन नहीं करतीं; इसलिए उसे अनुवाद में नहीं जोड़ा गया।
- issue: यְהוָה का निरूपण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से प्रतिस्थापित न करके हिन्दी में सीधा लिप्यंतरण चुना गया है।
- issue: וְהַנּוֹרָא में भय और विस्मय का संबंध
  choice: भययोग्य
  alternative: विस्मयकारी; भयावह
  rationale: शब्द उस परमेश्वर को दर्शाता है जो श्रद्धामिश्रित भय उत्पन्न करता है। ‘भयावह’ अनावश्यक रूप से नकारात्मक है, जबकि केवल ‘विस्मयकारी’ भय के तत्व को कमजोर कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘परमेश्वर’, ‘प्रभु’, ‘सामर्थी’ और ‘भययोग्य’ पद पद्य की औपचारिक उपाधि-श्रृंखला और धार्मिक गंभीरता को बनाए रखते हैं।
