source:
  edition: WLC
  text: וְ/אֶכְתֹּב֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֣ר שִׁבַּ֑רְתָּ וְ/שַׂמְתָּ֖/ם בָּ/אָרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/002.yaml
  text: And I will write on the tablets the words that were on the first tablets[a], which you broke, and you shall put them in the ark.
translation:
  language: hi
  text: और मैं उन पटियाओं पर वे वचन[a] लिखूँगा जो उन पहली पटियाओं पर थे, जिन्हें तुमने तोड़ दिया था; और तुम उन्हें सन्दूक में रख देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आज्ञाएँ”; इब्रानी में “वचन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶכְתֹּב
  choice: और मैं...लिखूँगा
  rationale: संयोजक के साथ प्रथम पुरुष एकवचन अपूर्ण क्रिया यहाँ परमेश्वर के भावी कार्य को व्यक्त करती है; यह हिन्दी में स्वाभाविक भविष्यकाल है।
- source_word: הַלֻּחֹת
  choice: पटियाओं
  rationale: לוח का आशय लेख अंकित करने वाली पटियाओं से है। इसी पद में 'पत्थर' नहीं दोहराया गया है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: הַדְּבָרִים
  choice: वचन
  rationale: דבר यहाँ पटियाओं पर लिखे वाचा-वचनों को दर्शाता है। 'वचन' मूल के निकट रहता है और इसे सीधे 'आज्ञाएँ' कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: אֲשֶׁר הָיוּ
  choice: जो...थे
  rationale: यह היה के साथ आया सामान्य सम्बन्धवाचक उपवाक्य है और आधुनिक हिन्दी में सहज है।
- source_word: הָרִאשֹׁנִים
  choice: पहली
  rationale: यह विशेषण पहले वाले जोड़े को नई पटियाओं से अलग करता है; 'पहली' स्पष्ट और स्वाभाविक है।
- source_word: שִׁבַּרְתָּ
  choice: तुमने तोड़ दिया था
  rationale: यह שבר का पिएल पूर्ण, द्वितीय पुरुष पुल्लिंग एकवचन रूप है। हिन्दी का पूर्ण भूतकाल वर्तमान कथन से पहले हुई घटना को स्पष्ट करता है।
- source_word: וְשַׂמְתָּם
  choice: और तुम उन्हें...रखना
  rationale: שים रखने या स्थापित करने की सामान्य क्रिया है। हिन्दी में निर्देश के लिए 'रखना' स्वाभाविक है; 'उन्हें' का सन्दर्भ पटियाओं से है।
- source_word: בָּאָרוֹן
  choice: सन्दूक में
  rationale: ארון यहाँ निकटवर्ती प्रसंग में बनवाए गए पवित्र सन्दूक को दर्शाता है। 'सन्दूक' साधारण आधुनिक हिन्दी में वस्तु का रूप स्पष्ट करता है और प्रसंग में उसका पवित्र स्वरूप बना रहता है।
theological_decisions:
- issue: וְשַׂמְתָּם में बहुवचन सर्वनाम का सन्दर्भ
  choice: '''उन्हें'' से पटियाएँ अभिप्रेत हैं।'
  alternative: '''उन्हें'' से पटियाओं पर लिखे वचन या आज्ञाएँ अभिप्रेत हो सकते हैं।'
  rationale: पुल्लिंग बहुवचन प्रत्यय व्याकरण की दृष्टि से निकट के दोनों बहुवचन संज्ञा-पदों की ओर संकेत कर सकता है, पर सन्दूक में भौतिक रूप से रखने की क्रिया और व्यवस्थाविवरण 10:1-5 का प्रसंग पटियाओं को अभिप्रेत ठहराता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'पटियाएँ', 'वचन' और 'सन्दूक' जैसे परिचित बाइबिलीय शब्दों का प्रयोग किया गया है; वाक्य-संरचना मूल इब्रानी के क्रम और सम्बन्धों को पर्याप्त निकटता से सुरक्षित रखती है।
