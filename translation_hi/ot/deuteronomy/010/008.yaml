  text: בָּ/עֵ֣ת הַ/הִ֗וא הִבְדִּ֤יל יְהוָה֙ אֶת שֵׁ֣בֶט הַ/לֵּוִ֔י לָ/שֵׂ֖את אֶת אֲר֣וֹן בְּרִית יְהוָ֑ה לַ/עֲמֹד֩ לִ/פְנֵ֨י יְהוָ֤ה לְ/שָֽׁרְת/וֹ֙ וּ/לְ/בָרֵ֣ךְ בִּ/שְׁמ֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/008.yaml
  text: At that time Yahweh set apart the tribe of Levi to carry the ark of the covenant of Yahweh, to stand before Yahweh to minister to him, and to bless in his name, to this day.
translation:
  language: hi
  text: उस समय याहवे ने लेवी के गोत्र को अलग ठहराया कि वह याहवे की वाचा का सन्दूक उठाकर ले चले, याहवे के सामने खड़ा होकर उसकी सेवा करे और उसके नाम से आशीर्वाद दे—आज तक।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִבְדִּיל
  choice: अलग ठहराया
  rationale: यह क्रिया किसी विशिष्ट दायित्व के लिए पृथक नियुक्त किए जाने को दर्शाती है; ‘अलग ठहराया’ आधुनिक हिन्दी में इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परम्परा में प्रचलित व्यक्तिगत नाम ‘यहोवा’ के द्वारा चतुरक्षरीय ईश-नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत किया गया है।
- source_word: שֵׁבֶט הַלֵּוִי
  choice: लेवी गोत्र
  rationale: इब्रानी संबंध-पदबंध का संक्षिप्त और स्वाभाविक हिन्दी रूप, जिसमें जनजातीय पूर्वज का नाम सुरक्षित रहता है।
- source_word: לָשֵׂאת
  choice: उठाए
  rationale: सन्दूक को वहन करने के दायित्व के लिए ‘उठाना’ सामान्य और स्पष्ट हिन्दी है; प्रसंग में इसमें लेकर चलना भी निहित है।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: यहोवा की वाचा का सन्दूक
  rationale: पूरी इब्रानी संबंध-श्रृंखला और ‘वाचा’ की स्पष्टता को स्वाभाविक हिन्दी शब्दक्रम में सुरक्षित रखता है।
- source_word: לַעֲמֹד לִפְנֵי יְהוָה
  choice: यहोवा के सामने खड़ा होकर
  rationale: मूल के ‘सामने खड़ा होना’ रूपक को बनाए रखता है और अगले सेवा-सूचक उद्देश्य से सहज रूप से जोड़ता है।
- source_word: לְשָׁרְתוֹ
  choice: उसकी सेवा करे
  rationale: क्रिया के पवित्र सेवा-सन्दर्भ को व्यक्त करता है, पर बाद की किसी विशिष्ट धार्मिक पद-व्यवस्था को आरोपित नहीं करता।
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: और उसके नाम से आशीर्वाद दे
  rationale: यह रूप ईश्वरीय अधिकार के अधीन आशीर्वाद देने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: जैसा वह आज तक करता आया है
  rationale: ‘आज तक’ निरन्तरता व्यक्त करता है; हिन्दी में अंतिम वाक्यांश को स्पष्ट बनाने हेतु निहित निरन्तर दायित्व को क्रियात्मक रूप दिया गया है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है, इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप को चुना गया; स्वरांकन की ऐतिहासिक अनिश्चितता के कारण ‘याहवे’ भी सम्भव लिप्यन्तरण है।
- issue: לַעֲמֹד ... לְשָׁרְתוֹ में लेवी की उपासना-संबंधी भूमिका
  choice: यहोवा के सामने खड़ा होकर उसकी सेवा करे
  alternative: यहोवा के सामने उपस्थित रहकर उसकी पवित्र सेवा करे
  rationale: चुना हुआ रूप मूल मुहावरे और सेवा के आशय को बनाए रखता है, किंतु पाठ से आगे बढ़कर किसी बाद की सम्प्रदायगत पुरोहितीय संरचना को नहीं जोड़ता।
- issue: अंतिम वाक्यांश עַד הַיּוֹם הַזֶּה का संबंध
  choice: लेवी गोत्र के उल्लिखित दायित्वों की निरन्तरता
  alternative: शाब्दिक रूप से केवल ‘आज तक’
  rationale: इब्रानी में वाक्यांश संक्षिप्त है और पूरी नियुक्ति की वर्तमान निरन्तरता बताता है। हिन्दी में ‘करता आया है’ जोड़ना इसी निहित संबंध को स्पष्ट करता है, किसी नए ऐतिहासिक दावे को नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘वाचा’, ‘सन्दूक’, ‘गोत्र’ और ‘आशीर्वाद’ जैसे स्थापित बाइबलीय शब्द सामान्य धार्मिक पाठक के लिए पहचाने जाने योग्य हैं। किसी फुटनोट की आवश्यकता नहीं समझी गई।
