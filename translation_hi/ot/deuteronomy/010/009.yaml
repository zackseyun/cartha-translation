source:
  edition: WLC
  text: עַל כֵּ֞ן לֹֽא הָיָ֧ה לְ/לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/009.yaml
  text: Therefore Levi has no portion or inheritance with his brothers[a]; Yahweh is his inheritance[b], just as Yahweh your God spoke to him.
translation:
  language: hi
  text: इसलिए लेवी के लिए अपने भाइयों के साथ कोई भाग या विरासत नहीं है[a]; यहोवा ही उसकी विरासत है[b], जैसा तुम्हारे परमेश्वर यहोवा ने उसे कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘अपने भाइयों के साथ’ है। एकवचन ‘लेवी’ यहाँ लेवी के गोत्र को दर्शाता है, जिसकी तुलना इस्राएल के अन्य गोत्रों से की गई है।
    reason: cultural_note
  - marker: b
    text: या, ‘यहोवा ही उसका भाग है।’ इब्रानी में ‘विरासत’ वाला शब्द दोबारा आया है, जिससे इस बात पर बल पड़ता है कि लेवी का हिस्सा भूमि नहीं, बल्कि स्वयं यहोवा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पद पिछले प्रसंग से निकला निष्कर्ष बताता है; ‘इसलिए’ उस तार्किक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְלֵוִי
  choice: लेवी का
  rationale: मूल पाठ का एकवचन नाम बनाए रखा गया है; यहाँ लेवी अपने गोत्र का प्रतिनिधित्व करता है।
- source_word: חֵלֶק וְנַחֲלָה
  choice: भाग या विरासत
  rationale: दोनों अलग संज्ञाओं को बनाए रखते हुए भूमि के बँटवारे में हिस्से और पैतृक अधिकार का भाव व्यक्त किया गया है।
- source_word: עִם אֶחָיו
  choice: अपने भाइयों के साथ
  rationale: मूल के पुल्लिंग बहुवचन संबंध-सूचक पद का सीधा अनुवाद है; संदर्भ में इससे इस्राएल के अन्य गोत्र अभिप्रेत हैं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: הוּא נַחֲלָתוֹ
  choice: ही उसकी विरासत है
  rationale: ‘विरासत’ की पुनरावृत्ति मूल पाठ की शब्दगत कड़ी और भूमि के बदले स्वयं यहोवा के लेवी की विरासत होने के विरोधाभास को सुरक्षित रखती है; ‘ही’ הוּא की बलात्मक भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: ठीक जैसा ... ने ... कहा था
  rationale: क्रिया का अर्थ ‘कहा/बोला’ है, स्पष्टतः ‘प्रतिज्ञा की’ नहीं; हिन्दी में पूर्व कथन की ओर संकेत के लिए ‘कहा था’ स्वाभाविक है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: मूल के द्वितीय पुरुष एकवचन और वाचा-संबंधी संबोधन को बनाए रखता है।
- source_word: לוֹ
  choice: उससे
  rationale: इब्रानी सर्वनाम एकवचन है और लेवी की ओर संकेत करता है; ‘उससे कहा था’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे आया है; ‘यहोवा’ उसे उपाधि से प्रतिस्थापित किए बिना हिन्दी पाठक के लिए पहचाने जाने योग्य रूप में रखता है।
- issue: लेवी का एकवचन में गोत्र-प्रतिनिधि होना
  choice: लेवी
  alternative: लेवी का गोत्र
  rationale: मूल का एकवचन नाम सुरक्षित रखा गया है, जबकि पाद-टिप्पणी उसके सामूहिक गोत्रीय अर्थ को स्पष्ट करती है।
- issue: אֶחָיו में लिंगयुक्त संबंध-सूचक शब्द
  choice: अपने भाइयों के साथ
  alternative: अपने सह-इस्राएलियों के साथ
  rationale: मूल के ‘उसके भाइयों’ को अनावश्यक रूप से तटस्थ नहीं किया गया; गोत्रीय आशय पाद-टिप्पणी में दिया गया है।
- issue: यहोवा का लेवी की विरासत होना
  choice: यहोवा ही उसकी विरासत है
  alternative: यहोवा ही उसका भाग है
  rationale: 'נַחֲלָה की पुनरावृत्ति बनाए रखने से पाठ का धर्मवैचारिक तनाव स्पष्ट रहता है: लेवी को भूमि की विरासत नहीं, बल्कि स्वयं यहोवा विरासत के रूप में मिलता है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए स्पष्ट रखी गई है। ‘भाग’ और ‘विरासत’ दोनों शब्द मूल की दो संज्ञाओं को अलग रखते हैं। वाक्य-संरचना स्रोत के निकट है, पर हिन्दी में स्वाभाविक प्रवाह के लिए संबंध-चिह्न और ‘कहा था’ का प्रयोग किया गया है।
