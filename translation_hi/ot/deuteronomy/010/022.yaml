source:
  edition: WLC
  text: בְּ/שִׁבְעִ֣ים נֶ֔פֶשׁ יָרְד֥וּ אֲבֹתֶ֖י/ךָ מִצְרָ֑יְמָ/הּ וְ/עַתָּ֗ה שָֽׂמְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/022.yaml
  text: Your fathers went down to Egypt with seventy persons[c][b][a], and now Yahweh your God has made you as numerous as the stars of the heavens.
translation:
  language: hi
  text: तेरे पुरखे सत्तर जन होकर मिस्र गए थे, और अब तेरे परमेश्वर याहवे ने तुझे आकाश के तारों के समान असंख्य कर दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּשִׁבְעִים נֶפֶשׁ
  choice: सत्तर जन होकर
  rationale: נֶפֶשׁ यहाँ व्यक्तियों की गणना के लिए प्रयुक्त है। ‘जन’ आधुनिक हिन्दी में स्वाभाविक है और ‘प्राण/आत्मा’ से पैदा होने वाली भ्रामक धारणा से बचाता है; בְ को साथ/परिस्थिति के अर्थ में ‘होकर’ व्यक्त किया गया है।
- source_word: יָרְדוּ
  choice: गए थे
  rationale: ירד का मूल अर्थ ‘नीचे जाना’ है, पर हिन्दी में मिस्र की यात्रा के लिए ‘नीचे गए’ अस्वाभाविक और अनावश्यक रूप से भौगोलिक लगेगा। ‘गए थे’ कथन का स्वाभाविक भूतकाल व्यक्त करता है।
- source_word: אֲבֹתֶיךָ
  choice: तेरे पुरखे
  rationale: शब्द का शाब्दिक अर्थ ‘तेरे पिता’ है, पर यहाँ आशय पूर्वजों से है। ‘पुरखे’ पुरुषवाची पैतृक संदर्भ को बनाए रखते हुए हिन्दी में ‘पिता’ के संभावित निकटस्थ अर्थ से बचाता है।
- source_word: מִצְרָיְמָה
  choice: मिस्र
  rationale: दिशासूचक प्रत्यय मिस्र की ओर गति बताता है; हिन्दी क्रिया ‘मिस्र गए’ में लक्ष्य स्वाभाविक रूप से स्पष्ट है।
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक तथा कालवाचक क्रियाविशेषण को सीधे रखते हुए आरम्भिक छोटी संख्या और वर्तमान बहुलता का विरोध उभरता है।
- source_word: שָׂמְךָ
  choice: तुझे ... कर दिया है
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है, पर इस परिणामसूचक संदर्भ में ‘कर दिया है’ स्वाभाविक हिन्दी है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण ‘यहवे’ से प्रस्तुत किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तेरे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबंध को ‘तेरे’ से रखा गया है; ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक और गरिमापूर्ण है।
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: आकाश के तारों के समान असंख्य
  rationale: उपमा और לָרֹב की बहुतायत—दोनों को एक स्वाभाविक हिन्दी पदबंध में व्यक्त किया गया है। ‘असंख्य’ यहाँ गणितीय निरपेक्षता नहीं, अत्यधिक बहुलता का भाव देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘यहवे’ स्रोत के संभावित उच्चारण का हिन्दी में निकट लिप्यंतरण है।
- issue: אֲבֹתֶיךָ का लिंग और संदर्भ
  choice: तेरे पुरखे
  alternative: तेरे पिता / तेरे पूर्वज
  rationale: ‘पुरखे’ मूल के पुरुषवाची पैतृक शब्द और ऐतिहासिक पूर्वज-संदर्भ दोनों को स्वाभाविक हिन्दी में बनाए रखता है; ‘पूर्वज’ अधिक लिंग-निरपेक्ष और ‘पिता’ यहाँ अस्पष्ट हो सकता है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी; एकवचन संबोधन के अनुरूप ‘तेरे/तुझे’ रखा गया है। वाक्य में कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि प्रमुख अर्थगत बारीकियाँ मुख्य पाठ में स्वाभाविक रूप से व्यक्त हैं।
