source:
  edition: WLC
  text: בָּ/עֵ֨ת הַ/הִ֜וא אָמַ֧ר יְהוָ֣ה אֵלַ֗/י פְּסָל לְ/ךָ֞ שְׁנֵֽי לֻוחֹ֤ת אֲבָנִים֙ כָּ/רִ֣אשֹׁנִ֔ים וַ/עֲלֵ֥ה אֵלַ֖/י הָ/הָ֑רָ/ה וְ/עָשִׂ֥יתָ לְּ/ךָ֖ אֲר֥וֹן עֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/001.yaml
  text: At that time Yahweh said to me[a], ‘Carve for yourself two stone tablets like the first ones, and come up to me on the mountain[b], and make for yourself a wooden ark.’
translation:
  language: hi
  text: उस समय याहवे ने मुझसे कहा, “अपने लिए पहली पत्थर की पटियाओं जैसी दो पत्थर की पटियाएँ तराश, और पहाड़ पर मेरे पास चढ़कर आ, और अपने लिए लकड़ी का एक संदूक बना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: उस समय
  rationale: यह स्वाभाविक आधुनिक हिन्दी में कथा की समय-संबंधी पृष्ठभूमि बताता है और हिब्रू संकेतवाचक भाव को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: פְּסָל
  choice: तराश
  rationale: पत्थर की पटियाएँ आकार देने के संदर्भ में यह स्पष्ट और स्वाभाविक हिन्दी क्रिया है।
- source_word: לְךָ
  choice: अपने लिए
  rationale: हिब्रू के हितार्थक अथवा आत्मवाचक बल को व्यक्त करता है।
- source_word: שְׁנֵי לֻוחֹת אֲבָנִים כָּרִאשֹׁנִים
  choice: पहली पटियाओं जैसी पत्थर की दो पटियाएँ
  rationale: यह नई पटियाओं की तुलना पहले वाली पटियाओं से स्पष्ट करता है और हिन्दी में संदर्भ को सहज रखता है।
- source_word: וַעֲלֵה אֵלַי הָהָרָה
  choice: फिर पहाड़ पर मेरे पास चढ़ आ
  rationale: चढ़ने की गति, पहाड़ को गंतव्य और परमेश्वर के पास आने—तीनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲרוֹן עֵץ
  choice: लकड़ी का एक संदूक
  rationale: अֲרוֹן का मूल अर्थ संदूक या पेटी है; इस पद में 'वाचा का संदूक' जोड़ना स्रोत से अधिक विशिष्ट होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। 'याहवे' उसे उपाधि में बदले बिना आधुनिक हिन्दी में प्रस्तुत करता है।
- issue: אֲרוֹן को धार्मिक पारिभाषिक शब्द बनाना
  choice: संदूक
  alternative: वाचा का संदूक
  rationale: संदर्भ से इसका पवित्र प्रयोजन स्पष्ट हो सकता है, पर इस पद में 'वाचा का' शब्द नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। प्रत्यक्ष कथन में एकवचन आज्ञार्थक शैली अपनाई गई है। किसी पंथ-विशेष की शब्दावली नहीं जोड़ी गई।
