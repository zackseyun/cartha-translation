source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י ק֛וּם לֵ֥ךְ לְ/מַסַּ֖ע לִ/פְנֵ֣י הָ/עָ֑ם וְ/יָבֹ֨אוּ֙ וְ/יִֽרְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/011.yaml
  text: And Yahweh said to me[a], “Arise, go before the people for the journey[c][b], so that they may go in and take possession of the land that I swore to their fathers to give to them.”
translation:
  language: hi
  text: और याहवे ने मुझसे कहा, “उठ, यात्रा के लिए लोगों के आगे चल पड़[a], ताकि वे उस देश में प्रवेश करें और उस पर अधिकार कर लें[b], जिसे देने की शपथ मैंने उनके पुरखों[c] से खाई थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लोगों के सामने चलकर कूच कर।”
    reason: לִפְנֵי का अर्थ ‘सामने’ या ‘आगे’ हो सकता है, और לְמַסַּע यात्रा अथवा कूच को सूचित करता है।
  - marker: b
    text: या “वे देश में जाकर उसे अपने अधिकार में लें।”
    reason: दो इब्रानी क्रियाओं को एक अधिक संक्षिप्त हिन्दी अभिव्यक्ति में भी कहा जा सकता है।
  - marker: c
    text: शाब्दिक अर्थ “उनके पिताओं”; यहाँ आशय उनके पुरखों या कुलपिताओं से है।
    reason: मूल पुल्लिंग वंशगत संज्ञा के शाब्दिक रूप और सन्दर्भगत अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: קוּם לֵךְ לְמַסַּע לִפְנֵי הָעָם
  choice: उठ, लोगों के आगे-आगे यात्रा पर निकल
  rationale: आज्ञार्थक क्रियाओं और यात्रा के भाव को स्वाभाविक हिन्दी में रखा गया है; ‘आगे-आगे’ स्थान और अगुवाई, दोनों की सम्भावना बनाए रखता है।
- source_word: וְיָבֹאוּ וְיִרְשׁוּ
  choice: ताकि वे उस देश में जाकर उस पर अधिकार कर लें
  rationale: दोनों क्रियाओं—देश में प्रवेश करना और उसे अपने अधिकार में लेना—को स्पष्ट रखते हुए उद्देश्य/परिणाम का सम्बन्ध व्यक्त किया गया है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: सन्दर्भ में यह प्रतिज्ञा किए गए भूभाग की ओर संकेत करता है; हिन्दी में ‘उस देश’ स्वाभाविक और विशिष्ट है।
- source_word: נִשְׁבַּעְתִּי
  choice: शपथ मैंने ... खाई थी
  rationale: इब्रानी शपथ-वाचक क्रिया का गम्भीर वाचा-संबंधी भाव सामान्य आधुनिक हिन्दी में सुरक्षित है।
- source_word: לַאֲבֹתָם
  choice: उनके पुरखों
  rationale: यह ऐतिहासिक रूप से इस्राएल के पूर्व पुरुषों, विशेषतः कुलपिताओं, का संकेत है; ‘पुरखे’ स्रोत के पुल्लिंग और वंशगत अर्थ को सहज हिन्दी में रखता है।
- source_word: לָתֵת לָהֶם
  choice: जिसे देने की
  rationale: देश को उन्हीं वंशजों को देने का आशय हिन्दी वाक्य-संरचना में संक्षिप्त और स्पष्ट रूप से व्यक्त होता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है; ‘याहवे’ उसे उपाधि में बदले बिना दर्शाता है।
- issue: לַאֲבֹתָם में पुरुष-विशिष्ट वंशगत उल्लेख
  choice: उनके पुरखों
  alternative: उनके पूर्वजों; उनके पिताओं
  rationale: ‘पुरखे’ मूल के पुल्लिंग बहुवचन को स्वाभाविक हिन्दी में बनाए रखता है और यहाँ कुलपिताओं की ऐतिहासिक ओर संकेत करता है।
- issue: וְיָבֹאוּ וְיִרְשׁוּ का सम्बन्ध
  choice: ताकि वे ... जाकर ... अधिकार कर लें
  alternative: और वे ... जाकर ... अधिकार करेंगे
  rationale: आज्ञा के बाद आने वाली क्रियाओं को उद्देश्य/परिणाम के रूप में समझा गया है, पर पादटिप्पणी में अधिक संक्षिप्त वैकल्पिक अभिव्यक्ति दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आगे-आगे यात्रा पर निकल’ अगुवाई और वास्तविक प्रस्थान दोनों भावों को बनाए रखता है; ‘पुरखे’ सामान्य पाठक के लिए ‘पिताओं’ से अधिक स्वाभाविक है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
