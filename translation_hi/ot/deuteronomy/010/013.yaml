  text: לִ/שְׁמֹ֞ר אֶת מִצְוֺ֤ת יְהוָה֙ וְ/אֶת חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְ/ט֖וֹב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/013.yaml
  text: to keep the commandments of Yahweh and his statutes that I am commanding you today for your good?[a]
translation:
  language: hi
  text: और याहवे की आज्ञाओं और उसकी विधियों का पालन करना, जिन्हें मैं आज तुम्हें दे रहा हूँ—तुम्हारी भलाई के लिए?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आज्ञाओं की रक्षा करना” अथवा “आज्ञाओं को मानना।”
    reason: לִשְׁמֹר के अर्थ-क्षेत्र में पालन करना, मानना और सावधानी से सुरक्षित रखना शामिल हैं।
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: पालन करना
  rationale: לִשְׁמֹר यहाँ पिछले पद में बताई गई अपेक्षा की विषय-वस्तु को आगे बढ़ाता है। ‘पालन करना’ आधुनिक हिन्दी में वाचा-संबंधी आज्ञाकारिता का स्वाभाविक और स्पष्ट बोध कराता है।
- source_word: מִצְוֺת
  choice: आज्ञाओं
  rationale: यह बहुवचन रचना याहवे द्वारा दिए गए बाध्यकारी निर्देशों को दर्शाती है; ‘आज्ञाएँ’ व्यवस्थाविवरण के कानूनी और वाचा-संबंधी भाव को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: חֻקֹּתָיו
  choice: उसकी विधियों
  rationale: חֻקִּים निर्धारित कानूनी विधान या नियमों को सूचित करता है। ‘विधियाँ’ ‘आज्ञाओं’ के साथ स्वाभाविक रहते हुए इसका विधिक भाव सुरक्षित रखता है।
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: जिनकी आज मैं तुम्हें आज्ञा दे रहा हूँ
  rationale: संबंधवाचक उपवाक्य आज्ञाओं और विधियों दोनों से जुड़ता है। वर्तमान प्रगतिशील रूप मְצַוֶּה और ‘आज’ की तात्कालिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְטוֹב לָךְ
  choice: तुम्हारी ही भलाई के लिए
  rationale: यह पदबंध लाभकारी उद्देश्य या परिणाम बताता है। ‘ही’ हिन्दी में इस बात पर स्वाभाविक बल देता है कि ये आदेश संबोधित जन की भलाई के लिए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: לְטוֹב לָךְ में आज्ञाओं का प्रयोजन
  choice: तुम्हारी ही भलाई के लिए
  alternative: तुम्हारे लाभ के लिए; तुम्हारे कल्याण के लिए
  rationale: अनुवाद आज्ञाओं को इस्राएल की भलाई से जोड़ता है, पर यह तय नहीं करता कि पदबंध केवल निकटतम उपवाक्य को विशेषित करता है या पिछले पद से चली आ रही पूरी अपेक्षा को।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पिछले वाक्य की निरंतरता है, इसलिए आरंभ में ‘और’ तथा अंत में प्रश्नचिह्न रखा गया है। ‘आज्ञाएँ’ और ‘विधियाँ’ व्यवस्थाविवरण के वाचा-संबंधी कानूनी स्वर को बनाए रखते हैं।
