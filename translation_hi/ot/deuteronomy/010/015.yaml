source:
  edition: WLC
  text: רַ֧ק בַּ/אֲבֹתֶ֛י/ךָ חָשַׁ֥ק יְהוָ֖ה לְ/אַהֲבָ֣ה אוֹתָ֑/ם וַ/יִּבְחַ֞ר בְּ/זַרְעָ֣/ם אַחֲרֵי/הֶ֗ם בָּ/כֶ֛ם מִ/כָּל הָ/עַמִּ֖ים כַּ/יּ֥וֹם הַ/זֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/015.yaml
  text: Yet Yahweh set his affection on your fathers[a], to love them, and he chose their offspring after them—you—from all the peoples, as it is this day.
translation:
  language: hi
  text: फिर भी, यहोवा ने तुम्हारे पुरखाओं ही से लगाव रखा[a] और उनसे प्रेम किया, और उनके बाद उनकी संतान को—अर्थात् तुम्हें—सब जातियों में से चुन लिया, जैसा आज है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “केवल तुम्हारे पुरखाओं से प्रेम करने में यहोवा ने आनन्द लिया।”
    reason: רַק के सीमितकारी बल और חָשַׁק के ‘आनन्द लेना/प्रसन्न होना’ वाले वैकल्पिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: רַק
  choice: फिर भी
  rationale: पिछले कथन के साथ विरोधात्मक और बलात्मक संबंध व्यक्त करता है; यह परमेश्वर के सार्वभौमिक अधिकार के बावजूद उसके विशेष चुनाव को सामने लाता है।
- source_word: בַּאֲבֹתֶיךָ חָשַׁק
  choice: तुम्हारे पुरखाओं ही ... उन पर अपना मन लगाया
  rationale: חָשַׁק का अर्थ गहरा लगाव या अनुराग रखना है; ‘अपना मन लगाया’ आधुनिक और स्वाभाविक हिन्दी में इच्छापूर्ण स्नेह का भाव रखता है। ‘ही’ רַק के सीमितकारी बल को भी सुनाई देता है।
- source_word: לְאַהֲבָה אֹתָם
  choice: उनसे प्रेम करने के लिए
  rationale: लामेद सहित infinitive को उद्देश्य/परिणाम की निकटता के साथ सीधे रूप में रखता है और אהב के प्रेम-संबंधी अर्थ को स्पष्ट बनाए रखता है।
- source_word: וַיִּבְחַר
  choice: चुन लिया
  rationale: בחר के दिव्य चुनाव-संबंधी सामान्य और स्पष्ट अर्थ को बिना नरम किए व्यक्त करता है।
- source_word: בְּזַרְעָם אַחֲרֵיהֶם
  choice: उनके बाद उनके वंश को
  rationale: זֶרַע यहाँ सामूहिक संतति को दर्शाता है; ‘वंश’ हिन्दी में इस राष्ट्रीय और पीढ़ीगत अर्थ को संक्षेप में व्यक्त करता है।
- source_word: בָּכֶם
  choice: अर्थात तुमको
  rationale: यह पदबंध वर्तमान श्रोताओं को पूर्वजों के वंश के रूप में समानाधिकरण से पहचानता है; ‘अर्थात’ उस संबंध को स्पष्ट करता है।
- source_word: מִכָּל הָעַמִּים
  choice: सब जातियों में से
  rationale: עמים का आशय लोगों के समुदायों से है; ‘जातियों’ बाइबलीय हिन्दी में ‘peoples’ का स्वाभाविक रूप है और מן के चयनात्मक भाव को ‘में से’ रखता है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा आज है
  rationale: यह इब्रानी मुहावरा वर्तमान, प्रत्यक्ष स्थिति को कथन की पुष्टि के रूप में दिखाता है; चुना गया रूप संक्षिप्त और आधुनिक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
theological_decisions:
- issue: दिव्य चुनाव की भाषा
  choice: यहोवा के स्नेह, प्रेम और चुनाव को स्पष्ट रूप से बनाए रखना
  alternative: इसे केवल ऐतिहासिक पसंद कहना या किसी बाद की विशिष्ट चुनाव-सिद्धान्त प्रणाली के अनुसार विस्तार देना
  rationale: इब्रानी पाठ स्वयं लगाव, प्रेम और चुनाव—तीनों को कहता है। अनुवाद इनके बल को न घटाता है, न इनके ऊपर कोई बाद की व्यवस्थित धर्मवैज्ञानिक व्याख्या आरोपित करता है।
- issue: רַק का विरोधात्मक अथवा सीमितकारी बल
  choice: मुख्य पाठ में ‘फिर भी’ और ‘ही’ के द्वारा दोनों पहलुओं को व्यक्त करना
  alternative: केवल ‘सिर्फ’ से आरम्भ करना
  rationale: रַק पिछले पद के सार्वभौमिक स्वामित्व के साथ आश्चर्यजनक विरोध भी बनाता है और पुरखाओं पर विशेष अनुराग को सीमितकारी बल भी देता है; हिन्दी में संयुक्त अभिव्यक्ति दोनों तनावों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘पुरखा’, ‘वंश’, ‘जातियाँ’ और ‘चुन लिया’ बाइबलीय संदर्भ में स्वाभाविक हैं; अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
