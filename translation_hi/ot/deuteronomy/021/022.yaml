  text: וְ/כִֽי יִהְיֶ֣ה בְ/אִ֗ישׁ חֵ֛טְא מִשְׁפַּט מָ֖וֶת וְ/הוּמָ֑ת וְ/תָלִ֥יתָ אֹת֖/וֹ עַל עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/022.yaml
  text: And if in a man there is a sin deserving death[a], and he is put to death, and you hang him on a tree[b],
translation:
  language: hi
  text: और यदि किसी पुरुष ने ऐसा पाप किया हो जो मृत्यु-दण्ड के योग्य हो[a], और उसे मृत्युदण्ड दिया जाए, और तुम उसे पेड़ पर लटका दो[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मृत्यु-दण्ड पाने योग्य” अथवा “मृत्यु-दण्ड के अधीन।” इब्रानी पद का शाब्दिक रूप लगभग “मृत्यु के न्याय/निर्णय का पाप [या अपराध]” है।
    reason: lexical_alternative
  - marker: b
    text: या, “लकड़ी के खम्भे पर।” इब्रानी में शाब्दिक रूप से “पेड़ पर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: और यदि
  rationale: संयोजक וְ और शर्तसूचक כִּי दोनों को रखते हुए विधिक प्रसंग की शर्त आरम्भ करता है।
- source_word: יִהְיֶה בְ/אִישׁ חֵטְא
  choice: किसी पुरुष ने ऐसा पाप किया हो
  rationale: शाब्दिक इब्रानी मुहावरा ‘किसी पुरुष में पाप हो’ हिन्दी में अस्वाभाविक है; यह रूप उसी विधिक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और אִישׁ का पुल्लिंग संकेत बनाए रखता है।
- source_word: מִשְׁפַּט מָוֶת
  choice: मृत्यु-दण्ड के योग्य
  rationale: यह पद शाब्दिक रूप से ‘मृत्यु का न्याय/निर्णय’ जैसा है; चुना हुआ रूप अपराध की मृत्युदण्डनीयता बताता है, पर पादटिप्पणी में दण्डादेश वाला सम्भव अर्थ सुरक्षित है।
- source_word: וְ/הוּמָת
  choice: और उसे मार डाला जाए
  rationale: מות का होफ़ाल रूप निष्क्रिय कारक अर्थ देता है। यह न्यायिक सन्दर्भ में स्पष्ट है और ‘हत्या’ जैसा अनुचित आशय नहीं लाता।
- source_word: וְ/תָלִיתָ אֹת/וֹ
  choice: और तुम उसे ... लटका दो
  rationale: תלה का मूल अर्थ लटकाना है; द्वितीय पुरुष एकवचन को हिन्दी के सामान्य विधिक ‘तुम’ से व्यक्त किया गया है।
- source_word: עַל עֵץ
  choice: किसी पेड़ पर
  rationale: עֵץ का सीधा अर्थ ‘पेड़’ या ‘लकड़ी’ है। ‘पेड़’ मूल बिम्ब और बाद के शास्त्रीय अन्तर्पाठ को सुरक्षित रखता है; ‘खम्भा’ सम्भव किन्तु अधिक विशिष्ट है।
theological_decisions:
- issue: विधिक विषय का लिंग
  choice: किसी पुरुष
  alternative: किसी व्यक्ति
  rationale: אִישׁ यहाँ पुल्लिंग एकवचन विधिक विषय है; इसलिए मूल का लिंग-संकेत बनाए रखा गया है।
- issue: מִשְׁפַּט מָוֶת की अर्थ-सीमा
  choice: मृत्यु-दण्ड के योग्य
  alternative: जिसे मृत्यु-दण्ड की सज़ा सुनाई गई हो
  rationale: इब्रानी पद अपराध की मृत्युदण्डनीयता अथवा मृत्यु के न्यायिक निर्णय—दोनों की ओर संकेत कर सकता है। मुख्य पाठ पहला स्वाभाविक अर्थ देता है और पादटिप्पणी दूसरा सुरक्षित रखती है।
- issue: עַל עֵץ का अनुवाद
  choice: पेड़ पर
  alternative: खम्भे पर
  rationale: मूल शब्द को व्यापक रखते हुए किसी विशेष दण्ड-उपकरण की पुनर्रचना आरोपित नहीं की गई।
translation_notes:
  register: आधुनिक, गरिमापूर्ण विधिक हिन्दी अपनाई गई है। ‘मृत्युदण्ड’ की अपेक्षा अधिक पठनीय संयुक्त रूप ‘मृत्यु-दण्ड’ रखा गया है। वाक्य अगले पद में जारी रहने के कारण अन्त में अल्पविराम रखा गया है।
