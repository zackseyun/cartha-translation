  yaml_path: translation/ot/deuteronomy/021/006.yaml
  text: And all the elders of that city nearest to the slain man shall wash their hands over the heifer whose neck was broken in the wadi[a][b].
translation:
  language: hi
  text: और उस नगर के सभी बुज़ुर्ग, जो मारे गए व्यक्ति के सबसे निकट हैं, उस बछिया के ऊपर अपने हाथ धोएँ जिसकी गर्दन उस घाटी[a] में तोड़ी गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नदी की सूखी तलहटी में” अथवा “खड्ड में।” इब्रानी शब्द जलधारा से जुड़ी घाटी या मौसमी नदी-पात्र को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: और ... सभी
  rationale: संयोजक वाव विधि के क्रम को आगे बढ़ाता है और כֹל पूरे समूह को सम्मिलित करता है।
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: उस नगर के ... पुरनिए
  rationale: यह पद नगर के नागरिक अगुवों को दर्शाता है; ‘पुरनिए’ बाइबलीय संदर्भ में प्रचलित, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है।
- source_word: הַקְּרֹבִים אֶל הֶחָלָל
  choice: जो मारे गए व्यक्ति के सबसे निकट हैं
  rationale: קָרוֹב ... אֶל भौगोलिक निकटता व्यक्त करता है और חָלָל हिंसा से मारे गए व्यक्ति को; यह अनुवाद हत्या के संदर्भ को स्पष्ट रखता है।
- source_word: יִרְחֲצוּ אֶת יְדֵיהֶם
  choice: अपने हाथ धोएँ
  rationale: यहाँ अपूर्ण क्रिया विधिक निर्देश की आज्ञार्थक/निर्देशात्मक शक्ति रखती है; हिंदी में ‘धोएँ’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל
  choice: के ऊपर
  rationale: अनुष्ठान के समय हाथ धोने की स्थिति बछिया के ऊपर है; ‘के ऊपर’ मूल संबंध को सीधे बनाए रखता है।
- source_word: הָעֶגְלָה
  choice: बछिया
  rationale: עֶגְלָה कम उम्र की मादा गौ को दर्शाता है, जिसका स्वाभाविक हिंदी समतुल्य ‘बछिया’ है।
- source_word: הָעֲרוּפָה
  choice: जिसकी गरदन ... तोड़ी गई थी
  rationale: ערף इस अनुष्ठान में सामान्य वध के बजाय गरदन तोड़े जाने को सूचित करता है; यह अनुवाद सिर काटे जाने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: בַנָּחַל
  choice: उस घाटी में
  rationale: נַחַל जलधारा से जुड़ी घाटी, खड्ड या मौसमी नदी-पात्र को दर्शा सकता है। मुख्य पाठ में स्वाभाविक ‘घाटी’ रखा गया है और अर्थ-सीमा पादटिप्पणी में दी गई है।
