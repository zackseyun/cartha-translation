language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי יִמָּצֵ֣א חָלָ֗ל בָּ/אֲדָמָה֙ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֤ן לְ/ךָ֙ לְ/רִשְׁתָּ֔/הּ נֹפֵ֖ל בַּ/שָּׂדֶ֑ה לֹ֥א נוֹדַ֖ע מִ֥י הִכָּֽה/וּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/001.yaml
  text: If a slain man is found in the land that Yahweh your God is giving you to possess[a], lying in the open field, and it is not known who struck him,
translation:
  language: hi
  text: यदि उस देश में, जिसे याहवे, तुम्हारा परमेश्वर, तुम्हें अधिकार में लेने के लिए दे रहा है, एक मारा गया आदमी खुले मैदान में पड़ा हुआ मिले और यह पता न हो कि उसे किसने मारा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यह पद एक शर्त पर लागू होने वाले नियम का आरम्भ करता है; आधुनिक हिन्दी की कानूनी शैली में ‘यदि’ स्वाभाविक है, जबकि ‘जब’ भी सम्भव है।
- source_word: יִמָּצֵא
  choice: पड़ा मिले
  rationale: निफ़अल रूप का अर्थ ‘पाया जाए’ है; नֹפֵל के साथ ‘पड़ा मिले’ हिन्दी में शरीर की अवस्था और पाए जाने—दोनों को सहज रूप से व्यक्त करता है।
- source_word: חָלָל
  choice: मारा गया पुरुष
  rationale: यह शब्द केवल शव नहीं, बल्कि हिंसा से मारे गए व्यक्ति को सूचित करता है। ‘पुरुष’ इब्रानी के व्याकरणिक पुल्लिंग एकवचन को बनाए रखता है।
- source_word: בָּאֲדָמָה
  choice: उस देश में
  rationale: आगे आने वाला अधिकार में लेने का उपवाक्य दिखाता है कि यहाँ אֲדָמָה का आशय मिट्टी या धरती की सतह नहीं, बल्कि इस्राएल को दिया जाने वाला देश है।
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ לְרִשְׁתָּהּ
  choice: जिसे तुम्हारा परमेश्वर याहवे तुम्हें अधिकार में लेने के लिए दे रहा है
  rationale: यह अनुवाद वर्तमान कृदन्त ‘दे रहा है’ और उद्देश्यसूचक infinitive ‘अधिकार में लेने के लिए’ को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: נֹפֵל בַּשָּׂדֶה
  choice: खुले मैदान में पड़ा
  rationale: शाब्दिक ‘गिरा हुआ’ की अपेक्षा ‘पड़ा’ मृत शरीर की अवस्था को हिन्दी में अधिक स्पष्ट करता है; ‘खुला मैदान’ आबादी से बाहर के स्थल का भाव देता है।
- source_word: לֹא נוֹדַע
  choice: यह पता न हो
  rationale: इब्रानी के निर्वैयक्तिक निफ़अल को आधुनिक हिन्दी के स्वाभाविक निर्वैयक्तिक वाक्यांश से व्यक्त किया गया है।
- source_word: מִי הִכָּהוּ
  choice: उसे किसने मारा
  rationale: נכה का मूल अर्थ प्रहार करना/मारना है। हिन्दी में ‘मारा’ इस प्रसंग में हत्या का अर्थ ग्रहण करता है, फिर भी क्रिया की सामान्य अर्थ-सीमा को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा का विशिष्ट नाम है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है और उसे किसी उपाधि में नहीं बदलता।
- issue: חָלָל में लिंग-सूचना
  choice: मारा गया पुरुष
  alternative: मारा गया व्यक्ति
  rationale: मूल इब्रानी व्याकरणिक रूप से पुल्लिंग एकवचन है। मुख्य पाठ इसे सुरक्षित रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि विधान को सामान्य अज्ञात हत्या के प्रसंग के रूप में भी समझा जा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की शर्तसूचक संरचना और अगले पद में जारी रहने वाला अपूर्ण वाक्य मूल के अनुरूप बनाए रखे गए हैं।
