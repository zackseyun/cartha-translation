  choice: मारे गए व्यक्ति के सबसे निकट जो नगर हो
  rationale: חָלָל का आशय मारे गए व्यक्ति से है; निकटता का प्रसंगगत सर्वोच्च भाव भी सुरक्षित रखा गया है।
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: उस नगर के पुरनिए
  rationale: नगर के मान्य नागरिक अगुओं के लिए शास्त्रीय गरिमा वाला और हिन्दी बाइबलीय पाठकों को परिचित पद।
- source_word: עֶגְלַת בָּקָר
  choice: गाय-बैलों में से एक … बछिया
  rationale: עֶגְלָה युवा मादा गोवंश है और בָּקָר व्यापक गोपशु-समूह को सूचित करता है; हिन्दी वाक्य में दोनों बातें स्पष्ट रहती हैं।
- source_word: אֲשֶׁר לֹא עֻבַּד בָּהּ
  choice: जिससे कभी काम न लिया गया हो
  rationale: 'निष्क्रिय क्रिया का साधनार्थक भाव सुरक्षित है: उस पशु को श्रम के साधन के रूप में कभी उपयोग नहीं किया गया।'
- source_word: אֲשֶׁר לֹא מָשְׁכָה בְּעֹל
  choice: जिसने कभी जुए में न खींचा हो
  rationale: משך के वास्तविक ‘खींचने’ के अर्थ को रखता है और बताता है कि पशु पहले भार खींचने के काम में नहीं लगाया गया था।
