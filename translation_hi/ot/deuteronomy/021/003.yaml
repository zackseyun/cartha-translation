base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/003.yaml
  text: And it shall be that the city nearest to the slain man[c][b][a], the elders of that city shall take a heifer from the herd that has not been worked with and has not pulled in a yoke.
translation:
  language: hi
  text: तब ऐसा हो कि मारे गए व्यक्ति[a] के सबसे निकट के नगर के बुज़ुर्ग मवेशियों में से एक ऐसी बछिया[b] लें, जिससे कभी काम न लिया गया हो और जिसे जुए में लगाकर कभी नहीं खींची गई हो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मारे हुए जन” अथवा “शव।” इब्रानी शब्द उस व्यक्ति को सूचित करता है जिसे मार डाला गया हो।
    reason: lexical_alternative
  - marker: b
    text: या केवल “एक बछिया।” इब्रानी पद अधिक स्पष्ट रूप से गोवंश में से एक युवा मादा पशु को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “जिसने जुए में नहीं खींचा,” अर्थात जिसे पहले भार खींचने के काम में नहीं लगाया गया था।
    reason: lexical_alternative
