source:
  edition: WLC
  text: כִּֽי תִהְיֶ֨יןָ לְ/אִ֜ישׁ שְׁתֵּ֣י נָשִׁ֗ים הָ/אַחַ֤ת אֲהוּבָה֙ וְ/הָ/אַחַ֣ת שְׂנוּאָ֔ה וְ/יָֽלְדוּ ל֣/וֹ בָנִ֔ים הָ/אֲהוּבָ֖ה וְ/הַ/שְּׂנוּאָ֑ה וְ/הָיָ֛ה הַ/בֵּ֥ן הַ/בְּכ֖וֹר לַ/שְּׂנִיאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/015.yaml
  text: If a man has two wives[a], one loved and the other unloved, and both the loved and the unloved have borne him sons, and the firstborn son belongs to the unloved wife,
translation:
  language: hi
  text: यदि किसी पुरुष की दो पत्नियाँ हों—एक प्रिय और दूसरी अप्रिय[a]—और दोनों पत्नियों, प्रिय और अप्रिय, ने उसके लिए पुत्रों को जन्म दिया हो, और ज्येष्ठ पुत्र अप्रिय पत्नी का हो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिससे घृणा की जाती हो।” हिब्रू शब्द का अधिक प्रबल अर्थ “घृणा की गई” भी हो सकता है, पर यहाँ संभवतः प्रिय पत्नी के विपरीत उस पत्नी का संकेत है जिसे प्रेम या पक्षपात नहीं मिलता।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यह विधिक परिस्थिति की शर्त प्रस्तुत करता है; आधुनिक हिन्दी की शर्तपरक कानूनी शैली में ‘यदि’ स्वाभाविक है।
- source_word: תִהְיֶיןָ לְאִישׁ שְׁתֵּי נָשִׁים
  choice: किसी पुरुष की दो पत्नियाँ हों
  rationale: हिब्रू की अस्तित्व-संबंधी रचना का स्वाभाविक हिन्दी रूप है और נָשִׁים यहाँ वैवाहिक संदर्भ में ‘पत्नियाँ’ है।
- source_word: הָאַחַת אֲהוּבָה
  choice: एक प्रिय
  rationale: אֲהוּבָה का अर्थ ‘प्रेम की गई’ है; ‘प्रिय’ संक्षिप्त, स्वाभाविक और संबंधपरक विरोध को स्पष्ट रखता है।
- source_word: וְהָאַחַת שְׂנוּאָה
  choice: दूसरी अप्रिय
  rationale: שְׂנוּאָה का प्रबल अर्थ ‘घृणा की गई’ हो सकता है, पर इस पारिवारिक-विधिक विरोध में यह प्रेम या पक्षपात न पाने वाली पत्नी को भी सूचित करता है; ‘अप्रिय’ अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
- source_word: וְיָלְדוּ לוֹ בָנִים
  choice: दोनों ने उससे पुत्रों को जन्म दिया हो
  rationale: בָנִים विशिष्ट रूप से ‘पुत्रों’ को दर्शाता है। ‘उससे ... जन्म दिया’ मातृत्व और उस पुरुष के पितृत्व का संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהָיָה הַבֵּן הַבְּכוֹר
  choice: और पहिलौठा पुत्र ... हो
  rationale: यह विधिक मामले की निर्णायक परिस्थिति आगे रखता है; ‘पहिलौठा’ उत्तराधिकार-संबंधी अर्थ को सटीक रखता है।
- source_word: לַשְּׂנִיאָה
  choice: अप्रिय पत्नी का
  rationale: लामेद यहाँ संबंध, विशेषकर मातृत्व, बताता है; ‘पत्नी का’ हिन्दी में इसे स्पष्ट और सहज बनाता है।
theological_decisions:
- issue: वैवाहिक संदर्भ में שְׂנוּאָה का अनुवाद
  choice: अप्रिय
  alternative: घृणित / कम प्रिय
  rationale: मूल शब्द वास्तविक घृणा का प्रबल भाव रख सकता है, किंतु प्रिय पत्नी के साथ इस विधिक तुलना में वह उपेक्षित या प्रेम न पाने वाली पत्नी की स्थिति भी बता सकता है। ‘अप्रिय’ विरोध को बनाए रखता है, जबकि पादटिप्पणी अधिक प्रबल अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज किंतु गरिमापूर्ण विधिक शैली अपनाई गई है। वाक्य को अगले पद में जारी रहने वाली शर्त के अनुरूप अल्पविराम पर समाप्त किया गया है।
