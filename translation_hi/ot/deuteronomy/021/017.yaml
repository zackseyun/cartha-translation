source:
  edition: WLC
  text: כִּי֩ אֶת הַ/בְּכֹ֨ר בֶּן הַ/שְּׂנוּאָ֜ה יַכִּ֗יר לָ֤/תֶת ל/וֹ֙ פִּ֣י שְׁנַ֔יִם בְּ/כֹ֥ל אֲשֶׁר יִמָּצֵ֖א ל֑/וֹ כִּי הוּא֙ רֵאשִׁ֣ית אֹנ֔/וֹ ל֖/וֹ מִשְׁפַּ֥ט הַ/בְּכֹרָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/017.yaml
  text: But he shall acknowledge the firstborn[a], the son of the unloved wife, by giving him a double portion of all that is found to belong to him, for he is the firstfruits of his vigor[c][b]; the right of the firstborn belongs to him.
translation:
  language: hi
  text: परन्तु वह उस पहलौठे को—जो कम-प्रिय पत्नी का पुत्र है[a]—मान्यता दे और अपनी सारी सम्पत्ति में से उसे दुगुना भाग दे[b], क्योंकि वह उसकी शक्ति की पहली उपज है[c]। पहलौठे का अधिकार उसी का है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस पत्नी का पुत्र जिससे वह घृणा करता है।” हिब्रू शब्द का अर्थ “कम-प्रिय पत्नी” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “दो का मुँह”; अर्थात उत्तराधिकार में दो हिस्से।
    reason: lexical_alternative
  - marker: c
    text: या “उसकी शक्ति की पहली उपज।” यह अभिव्यक्ति पिता की जनन-शक्ति से उत्पन्न पहली संतान को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכִּיר
  choice: स्वीकार करे
  rationale: हिफ़ील रूप यहाँ वास्तविक पहलौठे की वैधानिक हैसियत को मान्यता देने का अर्थ रखता है; ‘स्वीकार करे’ आधुनिक हिन्दी में इस कानूनी भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַבְּכֹר
  choice: पहलौठे
  rationale: यह जन्मक्रम के साथ उससे जुड़े उत्तराधिकार के विशेष दर्जे को भी बनाए रखने वाला प्रचलित बाइबिलीय-कानूनी शब्द है।
- source_word: בֶּן הַשְּׂנוּאָה
  choice: अप्रिय पत्नी का पुत्र
  rationale: שְׂנוּאָה का शाब्दिक अर्थ ‘घृणा की गई’ हो सकता है, पर प्रेम की गई पत्नी के साथ तुलना में यहाँ कम प्रिय अथवा प्रेम से वंचित पत्नी का भाव अधिक सम्भावित है। ‘अप्रिय’ तुलना को बनाए रखता है और अनावश्यक रूप से तीव्र घृणा का भाव नहीं थोपता।
- source_word: לָתֶת לוֹ פִּי שְׁנַיִם
  choice: उसे दुगुना भाग दे
  rationale: ‘दो का मुँह’ हिब्रू मुहावरा उत्तराधिकार में अन्य पुत्रों की तुलना में दो हिस्से देने को सूचित करता है; ‘दुगुना भाग’ इसका स्पष्ट और स्वाभाविक हिन्दी समतुल्य है।
- source_word: בְּכֹל אֲשֶׁר יִמָּצֵא לוֹ
  choice: अपनी सारी सम्पत्ति में से
  rationale: शाब्दिक अर्थ ‘जो कुछ उसके पास पाया जाए’ है और सन्दर्भ पिता की मिल्कियत अथवा उत्तराधिकार-सम्पदा का है; हिन्दी में यह रूप आशय को स्पष्ट करता है।
- source_word: רֵאשִׁית אֹנוֹ
  choice: उसके पौरुष का प्रथम फल
  rationale: यह अभिव्यक्ति पिता की जनन-शक्ति की पहली उपज को रूपकात्मक ढंग से बताती है। ‘पौरुष का प्रथम फल’ मूल के शक्ति और प्रथम उपज—दोनों भावों को बनाए रखता है।
- source_word: מִשְׁפַּט הַבְּכֹרָה
  choice: पहलौठे का अधिकार
  rationale: מִשְׁפַּט यहाँ पहलौठे की वैधानिक पात्रता अथवा उसका नियत हक़ बताता है; यह हिन्दी रूप संक्षिप्त और स्पष्ट है।
- source_word: כִּי ... כִּי
  choice: परन्तु ... क्योंकि
  rationale: पहला כִּי पिछले पद में निषिद्ध पक्षपात के विपरीत आदेश प्रस्तुत करता है, जबकि दूसरा उसका कारण देता है।
theological_decisions:
- issue: वैवाहिक सम्बन्ध में שְׂנוּאָה की तीव्रता
  choice: अप्रिय पत्नी
  alternative: घृणा की गई पत्नी; कम प्रिय पत्नी
  rationale: कानूनी सन्दर्भ और प्रेम की गई पत्नी से तुलना को देखते हुए शब्द सम्बन्धगत अरुचि अथवा कम अनुग्रह को व्यक्त कर सकता है। मुख्य पाठ में ‘अप्रिय’ इस तनाव को संक्षेप में रखता है, जबकि पादटिप्पणी अधिक शाब्दिक सम्भावना को सुरक्षित रखती है।
- issue: רֵאשִׁית אֹנוֹ में जनन-शक्ति का रूपक
  choice: उसके पौरुष का प्रथम फल
  alternative: उसकी शक्ति का आरम्भ; उसके बल की पहली उपज
  rationale: वाक्यांश पहलौठे को पिता की जनन-सामर्थ्य की पहली संतान बताता है। रूपक को बनाए रखा गया है, बिना इसे किसी अतिरिक्त धर्मसैद्धान्तिक दावे में बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कानूनी शैली अपनाई गई है। ‘पहलौठा’ और ‘दुगुना भाग’ जैसे परिचित बाइबिलीय पद रखे गए हैं; कठिन हिब्रू मुहावरों और वैकल्पिक अर्थों को पादटिप्पणियों में स्पष्ट किया गया है।
