  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण विधिक-वर्णनात्मक स्तर रखा गया है। ‘तुम’ मूल के द्वितीय पुरुष पुल्लिंग एकवचन को स्वाभाविक सामूहिक संबोधन के रूप में व्यक्त करता है।
