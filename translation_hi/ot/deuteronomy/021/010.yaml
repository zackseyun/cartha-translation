  text: When you go out to war against your enemies[a], and Yahweh your God gives them into your hand, and you take them captive[b],
translation:
  language: hi
  text: जब तुम अपने शत्रुओं के विरुद्ध युद्ध करने जाओ, और तुम्हारा परमेश्वर याहवे उन्हें[a] तुम्हारे हाथ में दे दे, और तुम उनमें से लोगों को बंदी बना लो[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘उसे तुम्हारे हाथ में दे दे’ है; एकवचन प्रत्यय संभवतः शत्रु-सेना को सामूहिक रूप में दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘और तुम उनमें से बंदी पकड़ लो।’ इब्रानी में ‘बंदी बनाना’ की क्रिया और उसी मूल से बनी संज्ञा साथ प्रयुक्त हुई हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ यह शब्द विधिक परिस्थिति का आरंभ करता है; आधुनिक हिन्दी में ‘जब’ प्रसंग के अनुकूल और स्वाभाविक है।
- source_word: תֵצֵא לַמִּלְחָמָה
  choice: युद्ध करने जाओ
  rationale: यह इब्रानी सैन्य मुहावरे का स्वाभाविक हिन्दी रूप है और बाहर जाकर युद्ध करने का भाव बनाए रखता है।
- source_word: עַל אֹיְבֶיךָ
  choice: अपने शत्रुओं से
  rationale: शत्रुतापूर्ण कार्रवाई के प्रसंग में עַל का हिन्दी मुहावरेदार रूप ‘से युद्ध करना’ है।
- source_word: וּנְתָנוֹ
  choice: उन्हें … कर दे
  rationale: इब्रानी प्रत्यय व्याकरणतः एकवचन है, पर बहुवचन ‘शत्रुओं’ को सामूहिक रूप में दर्शाता है; हिन्दी में बहुवचन अधिक स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित वाचागत अभिव्यक्ति का सीधा और स्वाभाविक अनुवाद।
- source_word: בְּיָדֶךָ
  choice: तुम्हारे हाथ में
  rationale: स्रोत का चित्रात्मक मुहावरा सुरक्षित रहता है और हिन्दी में अधिकार में दिए जाने का अर्थ समझ में आता है।
- source_word: וְשָׁבִיתָ שִׁבְיוֹ
  choice: तुम उनके बंदियों को बंदी बना लो
  rationale: क्रिया और उसी मूल से बने संज्ञा-पद की इब्रानी पुनरुक्ति को यथासंभव दर्शाता है तथा अर्थ स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी के सामान्य बाइबलीय प्रयोग में ‘यहोवा’ अधिक पहचाना और सहज है, जबकि इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: विजय में परमेश्वर की भूमिका
  choice: यहोवा उन्हें तुम्हारे हाथ में कर दे
  alternative: यहोवा तुम्हें उन पर विजय दे
  rationale: स्रोत की सीधी कर्तृता और ‘हाथ में देना’ वाली छवि सुरक्षित रखी गई है; व्याख्यात्मक ‘विजय’ नहीं जोड़ा गया।
