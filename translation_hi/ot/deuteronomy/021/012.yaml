  text: וַ/הֲבֵאתָ֖/הּ אֶל תּ֣וֹךְ בֵּיתֶ֑/ךָ וְ/גִלְּחָה֙ אֶת רֹאשָׁ֔/הּ וְ/עָשְׂתָ֖ה אֶת צִפָּרְנֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/012.yaml
  text: then you shall bring her into your house[a], and she shall shave her head and trim her nails.
translation:
  language: hi
  text: तब तुम उसे अपने घर के भीतर ले आना। वह अपना सिर मुँड़ाए और अपने नाखून काटे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने नाखून बढ़ने दे।” इब्रानी में शाब्दिक रूप से “वह अपने नाखून करे” है; यह मुहावरा विवादित है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲבֵאתָהּ
  choice: तब तुम उसे … ले आना
  rationale: हिफ़इल रूप और वाव कानूनी निर्देशों के क्रम में अगला अपेक्षित कार्य बताते हैं। ‘तब’ क्रम को और ‘ले आना’ क्रिया के प्रेरणार्थक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל תּוֹךְ בֵּיתֶךָ
  choice: अपने घर के भीतर
  rationale: תּוֹךְ घर के अंदरूनी भाग को सूचित करता है। ‘घर के भीतर’ मूल की स्थानवाचक स्पष्टता रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְגִלְּחָה אֶת רֹאשָׁהּ
  choice: वह अपना सिर मुँड़ाए
  rationale: גלח का सामान्य अर्थ बाल मूँड़ना है। हिन्दी में ‘सिर मुँड़ाना’ इस क्रिया का सहज और सटीक प्रयोग है; इसमें ‘पूरा’ या ‘साफ़’ जोड़कर मूल से अधिक नहीं कहा गया।
- source_word: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: अपने नाखून काटे
  rationale: शाब्दिक रूप से यह वाक्यांश ‘अपने नाखून करे’ है और इसका आशय विवादित है। मुख्य पाठ में ‘नाखून काटे’ एक प्रचलित और स्वाभाविक व्याख्या है, जबकि दूसरी प्रमुख सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ की अर्थगत अस्पष्टता
  choice: मुख्य पाठ में स्त्री को अपने नाखून काटने का निर्देश
  alternative: स्त्री अपने नाखून बढ़ने दे
  rationale: इब्रानी अभिव्यक्ति अक्षरशः ‘अपने नाखून करे/बनाए’ कहती है और मुहावरे का निश्चित आशय स्पष्ट नहीं है। पठनीय मुख्य पाठ के साथ वैकल्पिक अर्थ को पादटिप्पणी में देना मूल की वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी निर्देश के अनुरूप है। ‘ले आना’ आज्ञार्थक विधान को कठोर या पुरातन बनाए बिना व्यक्त करता है। स्त्री के लिए सम्मानसूचक बहुवचन न लेकर मूल के एकवचन को स्पष्ट रखा गया है।
