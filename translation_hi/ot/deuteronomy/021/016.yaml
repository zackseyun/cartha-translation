source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/יוֹם֙ הַנְחִיל֣/וֹ אֶת בָּנָ֔י/ו אֵ֥ת אֲשֶׁר יִהְיֶ֖ה ל֑/וֹ לֹ֣א יוּכַ֗ל לְ/בַכֵּר֙ אֶת בֶּן הָ֣/אֲהוּבָ֔ה עַל פְּנֵ֥י בֶן הַ/שְּׂנוּאָ֖ה הַ/בְּכֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/016.yaml
  text: And on the day he gives his sons as an inheritance what belongs to him[a], he may not treat the son of the loved wife as firstborn over the son of the hated wife, who is the firstborn.
translation:
  language: hi
  text: जिस दिन वह अपने पुत्रों को अपनी संपत्ति का उत्तराधिकारी बनाए, उस दिन वह जिस पत्नी से प्रेम करता है उसके पुत्र को उस पत्नी के पुत्र के स्थान पर, जिससे वह घृणा करता है[a] और जो ज्येष्ठ पुत्र है, ज्येष्ठ पुत्र का दर्जा नहीं दे सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस पत्नी से वह प्रेम नहीं करता” अथवा “जिससे वह कम प्रेम करता है।” इब्रानी में शाब्दिक विरोध “प्रेम की गई” और “घृणा की गई” के बीच है, पर पारिवारिक-कानूनी संदर्भ में दूसरा पद सक्रिय घृणा के बजाय तुलनात्मक रूप से कम प्रेम या कम पक्षपात को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: जिस दिन ... उस दिन
  rationale: यह कानूनी परिस्थिति को प्रस्तुत करने वाला कालवाचक सूत्र है। दोहराया हुआ हिंदी ढाँचा वाक्य को स्पष्ट और स्वाभाविक रखता है।
- source_word: הַנְחִילוֹ אֶת בָּנָיו אֵת אֲשֶׁר יִהְיֶה לוֹ
  choice: वह अपने पुत्रों को उस सारी संपत्ति का उत्तराधिकारी बनाए जो उसकी है
  rationale: הנחיל का हिफ़ील रूप किसी को उत्तराधिकार दिलाने या उत्तराधिकारी बनाने का भाव देता है, और אֵת אֲשֶׁר יִהְיֶה לוֹ उस व्यक्ति की संपत्ति को सूचित करता है। यह हिंदी अभिव्यक्ति दोनों तत्वों को स्पष्ट रखती है।
- source_word: לֹא יוּכַל
  choice: नहीं ... सकता
  rationale: कानूनी संदर्भ में यह केवल शारीरिक असमर्थता नहीं, बल्कि अधिकार न होने या निषेध का भाव व्यक्त करता है। पूरे वाक्य में हिंदी का यह रूप उसी कानूनी सीमा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְבַכֵּר
  choice: पहलौठा ... ठहरा सकता
  rationale: क्रिया का अर्थ किसी को पहलौठे का दर्जा या अधिकार देना है। 'पहलौठा ठहराना' मूल की संक्षिप्त कानूनी अभिव्यक्ति को बनाए रखता है।
- source_word: בֶּן הָאֲהוּבָה
  choice: जिस पत्नी से प्रेम करता है उसके पुत्र
  rationale: הָאֲהוּבָה का शाब्दिक अर्थ 'प्रेम की गई' है। पिछले पद के बहुपत्नी-विवाह वाले संदर्भ के कारण 'पत्नी' स्पष्ट रूप से व्यक्त किया गया है।
- source_word: עַל פְּנֵי
  choice: से बढ़कर
  rationale: यहाँ वाक्यांश वरीयता या दूसरे के ऊपर प्राथमिकता देने को दर्शाता है।
- source_word: בֶּן הַשְּׂנוּאָה
  choice: जिस पत्नी से वह घृणा करता है उसके पुत्र
  rationale: שְׂנוּאָה का मूल अर्थ 'घृणा की गई' है। मुख्य पाठ में इसकी प्रबलता सुरक्षित रखी गई है, जबकि पारिवारिक-कानूनी संदर्भ में संभव तुलनात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַבְּכֹר
  choice: पुत्र ही पहलौठा है
  rationale: अंतिम पद स्पष्ट करता है कि घृणा की गई पत्नी का पुत्र वास्तविक पहलौठा है। 'ही' इस पहचान को हिंदी में स्पष्ट करता है, बिना कोई नया अधिकार-विवरण जोड़े।
theological_decisions:
- issue: दो पत्नियों के प्रति प्रेम और घृणा का संबंधात्मक विरोध
  choice: मुख्य पाठ में 'प्रेम करता है' और 'घृणा करता है' का प्रबल विरोध बनाए रखा गया
  alternative: '''प्रिय'' और ''अप्रिय'' अथवा ''कम प्रेम की गई'''
  rationale: इब्रानी पाठ सशक्त विलोम शब्दों का प्रयोग करता है; इसलिए मुख्य पाठ में उसे बिना आवश्यकता नरम नहीं किया गया। फिर भी इस प्रकार के पारिवारिक-कानूनी संदर्भ में 'घृणा' तुलनात्मक रूप से कम प्रेम या कम पक्षपात को भी दर्शा सकती है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है और कानूनी गरिमा बनाए रखती है। 'पहलौठा' बाइबलीय उत्तराधिकार-संदर्भ में प्रचलित तथा साधारण पाठक के लिए समझने योग्य है। वाक्य की लंबाई मूल कानूनी संरचना के अनुरूप है, पर 'जिस दिन ... उस दिन' से संबंध स्पष्ट किया गया है।
