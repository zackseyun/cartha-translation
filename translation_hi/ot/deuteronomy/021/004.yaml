  text: וְ/הוֹרִ֡דוּ זִקְנֵי֩ הָ/עִ֨יר הַ/הִ֤וא אֶת הָֽ/עֶגְלָה֙ אֶל נַ֣חַל אֵיתָ֔ן אֲשֶׁ֛ר לֹא יֵעָבֵ֥ד בּ֖/וֹ וְ/לֹ֣א יִזָּרֵ֑עַ וְ/עָֽרְפוּ שָׁ֥ם אֶת הָ/עֶגְלָ֖ה בַּ/נָּֽחַל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/004.yaml
  text: Then the elders of that city shall bring the heifer down to a perennial wadi[a], which is neither worked nor sown, and there in the wadi they shall break the heifer’s neck.
translation:
  language: hi
  text: तब उस नगर के बुज़ुर्ग उस बछिया को नीचे एक सदानीरा घाटी में ले जाएँ[a], जिसकी भूमि न जोती गई हो और न उसमें बीज बोया गया हो; और वहीं उस घाटी में वे उस बछिया की गरदन तोड़ दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक स्थायी घाटी में” अथवा “एक दुर्गम घाटी में।” इब्रानी पद נַחַל אֵיתָן का अर्थ संभवतः ऐसी घाटी या नाले से है जिसमें जलप्रवाह स्थायी हो; पर विशेषण का अर्थ दृढ़ या दुर्गम भी लिया गया है।
    reason: नַחַל אֵיתָן के भौगोलिक और विशेषणात्मक अर्थ की वास्तविक शाब्दिक अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהוֹרִדוּ
  choice: नीचे ... ले जाएँ
  rationale: हिफ़ील रूप का कारक अर्थ और घाटी की ओर नीचे जाने की गति, दोनों व्यक्त होते हैं।
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: उस नगर के पुरनिए
  rationale: यह नगर के मान्य वरिष्ठ प्रतिनिधियों को दर्शाता है और विधिक प्रसंग के अनुकूल है।
- source_word: הָעֶגְלָה
  choice: बछिया
  rationale: यह शब्द कम आयु की मादा गाय के लिए है; हिंदी में ‘बछिया’ सटीक और सहज है।
- source_word: אֶל נַחַל אֵיתָן
  choice: ऐसी घाटी में ... जहाँ बारहमासी जलधारा बहती हो
  rationale: נַחַל घाटी, नाला या जलधारा वाले खड्ड को और אֵיתָן यहाँ स्थायी अथवा निरंतरता को सूचित कर सकता है। यह चयन भू-आकृति और बारहमासी जल, दोनों को सामान्य हिंदी में स्पष्ट करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר לֹא יֵעָבֵד בּוֹ
  choice: जहाँ न खेती की गई हो
  rationale: निफ़ाल रूप यहाँ भूमि के जोते या कृषि के लिए काम में लाए जाने का भाव देता है; अगली क्रिया ‘बीज बोना’ इस कृषि-संदर्भ की पुष्टि करती है।
- source_word: וְלֹא יִזָּרֵעַ
  choice: न बीज बोया गया हो
  rationale: निष्क्रिय रूप और कृषि संबंधी ‘बोने’ का विशिष्ट अर्थ सुरक्षित है।
- source_word: וְעָרְפוּ
  choice: गरदन तोड़ दें
  rationale: इस अनुष्ठानिक प्रसंग में क्रिया पशु की गरदन तोड़ने की विशिष्ट क्रिया बताती है, सामान्य वध नहीं।
- source_word: שָׁם ... בַּנָּחַל
  choice: वहीं उस घाटी में
  rationale: स्थानसूचक पुनरुक्ति को स्वाभाविक हिंदी में बनाए रखता है।
theological_decisions: []
