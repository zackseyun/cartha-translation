base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/007.yaml
  text: Then they shall answer and say[a], ‘Our hands did not shed this blood[b], and our eyes did not see it.’
translation:
  language: hi
  text: तब वे उत्तर देकर कहें, “हमारे हाथों ने यह लहू नहीं बहाया[a], और हमारी आँखों ने इसे नहीं देखा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “यह लहू।” “लहू बहाना” हत्या की जिम्मेदारी से इनकार करने वाला कानूनी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “हमने इसे होते नहीं देखा।” मूल में शाब्दिक रूप से “हमारी आँखों ने नहीं देखा” है, जो प्रत्यक्षदर्शी ज्ञान से इनकार करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ וְאָמְרוּ
  choice: तब वे उत्तर देकर कहें
  rationale: दोनों इब्रानी क्रियाओं—‘उत्तर देना’ और ‘कहना’—को बनाए रखते हुए वाव के प्रक्रियात्मक क्रम को स्वाभाविक हिन्दी में ‘तब’ से व्यक्त किया गया है।
- source_word: יָדֵינוּ
  choice: हमारे हाथों ने
  rationale: मूल का ठोस शारीरिक-अंग वाला प्रयोग सुरक्षित रखा गया है; यहाँ ‘हाथ’ हत्या में प्रत्यक्ष भागीदारी और उत्तरदायित्व को सूचित करते हैं।
- source_word: לֹא שפכה אֶת־הַדָּם הַזֶּה
  choice: यह लहू नहीं बहाया
  rationale: ‘लहू बहाना’ हत्या के लिए स्वाभाविक और गरिमापूर्ण हिन्दी मुहावरा है। ‘यह लहू’ मूल के ठोस कानूनी कथन को सुरक्षित रखता है, उसे स्पष्ट करके ‘इस मनुष्य की हत्या’ नहीं बनाता।
- source_word: וְעֵינֵינוּ לֹא רָאוּ
  choice: और हमारी आँखों ने इसे नहीं देखा
  rationale: मूल का ‘हमारी आँखों’ वाला ठोस प्रयोग बनाए रखा गया है। स्पष्ट हिन्दी वाक्य के लिए ‘इसे’ जोड़ा गया है, जिसका संकेत प्रसंग में हुई हत्या की ओर है।
theological_decisions:
- issue: हत्या में उत्तरदायित्व और प्रत्यक्षदर्शी ज्ञान के बीच भेद
  choice: 'दोनों निषेधों को अलग और शाब्दिक रूप से ठोस रखा गया है: हाथों ने लहू नहीं बहाया, आँखों ने नहीं देखा।'
  alternative: भावार्थ में केवल यह कहना कि ‘हम न इसके दोषी हैं, न इसके गवाह।’
  rationale: मूल पाठ प्रत्यक्ष भागीदारी और देखने के ज्ञान को दो समानांतर देह-अंग रूपकों से अलग-अलग व्यक्त करता है; भावार्थ इनकी साहित्यिक और कानूनी शक्ति घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और औपचारिक कानूनी-घोषणात्मक स्वर रखा गया है। ‘लहू’ ने ‘खून’ की अपेक्षा बाइबलीय गरिमा बनाए रखते हुए सामान्य पाठक के लिए बोधगम्यता भी सुरक्षित रखी है।
