base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/020.yaml
  text: Then they shall say to the elders of his city[a], ‘This son of ours is stubborn and rebellious; he does not listen to our voice; he is a glutton and a drunkard.’
translation:
  language: hi
  text: तब वे उसके नगर के पुरनियों से कहें, ‘हमारा यह बेटा हठी और विद्रोही है; वह हमारी बात नहीं मानता[a]; वह पेटू और पियक्कड़ है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह हमारी आवाज़ नहीं सुनता।” हिब्रू में “आवाज़ सुनना” ध्यान देने या आज्ञा मानने के अर्थ में भी आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: तब वे ... कहें
  rationale: संयोजक सहित क्रिया विधिक प्रक्रिया के अगले चरण को व्यक्त करती है; ‘तब ... कहें’ आधुनिक हिन्दी में क्रम और निर्देशात्मक भाव दोनों स्पष्ट करता है।
- source_word: זִקְנֵי עִירוֹ
  choice: उसके नगर के पुरनियों
  rationale: ‘पुरनिये’ नगर के मान्य अगुवों अथवा शासकीय निकाय को दर्शाता है; ‘नगर’ עִיר का स्वाभाविक विधिक-प्रशासनिक अनुवाद है।
- source_word: בְּנֵנוּ זֶה
  choice: हमारा यह बेटा
  rationale: यह पदक्रम संकेतवाचक बल और माता-पिता द्वारा पुत्र की स्पष्ट पहचान को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: סוֹרֵר
  choice: हठी
  rationale: यह शब्द लगातार न मानने और अपनी राह पर अड़े रहने का भाव देता है; ‘हठी’ संक्षिप्त तथा सामान्य हिन्दी है।
- source_word: וּמֹרֶה
  choice: विद्रोही
  rationale: यह सक्रिय अवज्ञा और विरोध को व्यक्त करता है तथा ‘हठी’ के साथ मूल के आरोपात्मक युग्म को बनाए रखता है।
- source_word: אֵינֶנּוּ שֹׁמֵעַ בְּקֹלֵנוּ
  choice: वह हमारी बात नहीं मानता
  rationale: हिब्रू मुहावरे का शाब्दिक अर्थ ‘हमारी आवाज़ नहीं सुनता’ है, पर इस प्रसंग में सुनने का अर्थ ध्यान देकर आज्ञा मानना है; ‘बात नहीं मानता’ आधुनिक हिन्दी में यही मुहावरेदार अर्थ देता है।
- source_word: זוֹלֵל
  choice: पेटू
  rationale: ‘पियक्कड़’ के साथ प्रयुक्त होने पर यह अत्यधिक खाने के आदी व्यक्ति को दर्शाता है; ‘पेटू’ इस आरोप को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְסֹבֵא
  choice: पियक्कड़
  rationale: यह मदिरा पीने के अभ्यस्त व्यक्ति का भाव रखता है; ‘पियक्कड़’ आधुनिक सामान्य हिन्दी में habitual sense को स्पष्ट करता है।
