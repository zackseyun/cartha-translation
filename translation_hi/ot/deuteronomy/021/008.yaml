source:
  edition: WLC
  text: כַּפֵּר֩ לְ/עַמְּ/ךָ֨ יִשְׂרָאֵ֤ל אֲשֶׁר פָּדִ֨יתָ֙ יְהוָ֔ה וְ/אַל תִּתֵּן֙ דָּ֣ם נָקִ֔י בְּ/קֶ֖רֶב עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וְ/נִכַּפֵּ֥ר לָ/הֶ֖ם הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/008.yaml
  text: Make atonement for your people Israel[a], whom you redeemed, O Yahweh, and do not let innocent blood remain among your people Israel. Then the bloodguilt will be atoned for them.
translation:
  language: hi
  text: “हे याहवे, अपनी प्रजा इस्राएल के लिए प्रायश्चित कर, जिसे तूने छुड़ाया है। अपनी प्रजा इस्राएल के बीच निर्दोष के बहाए गए खून का दोष न रहने दे। तब उनके लिए उस रक्तपात के दोष का प्रायश्चित हो जाएगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और उनके लिए उस खून का प्रायश्चित हो जाएगा।” यहाँ “खून” हत्या से उत्पन्न दोष या उत्तरदायित्व के लिए प्रयुक्त न्यायिक अभिव्यक्ति है।'
    reason: मूल इब्रानी में ‘खून’ कहा गया है; मुख्य पाठ प्रसंगानुसार उसके न्यायिक आशय को स्पष्ट करता है।
lexical_decisions:
- source_word: כַּפֵּר
  choice: प्रायश्चित कर
  rationale: כפר के आज्ञार्थक रूप का यहाँ बलिदान-संबंधी और न्यायिक अर्थ है। ‘प्रायश्चित कर’ इस अर्थ को स्वाभाविक और पारंपरिक हिन्दी में सुरक्षित रखता है।
- source_word: לְעַמְּךָ יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल के लिए
  rationale: לְ लाभार्थी को सूचित करता है; यह अनुवाद वाचा-संबंधी संबोधन और इस्राएल की पहचान दोनों बनाए रखता है।
- source_word: אֲשֶׁר פָּדִיתָ
  choice: जिसे तूने छुड़ाया है
  rationale: פדה में दासता या संकट से छुड़ाने का भाव है। ‘छुड़ाया’ सामान्य आधुनिक हिन्दी में स्पष्ट है और उद्धार के ऐतिहासिक संदर्भ को बनाए रखता है।
- source_word: יְהוָה
  choice: हे याहवे
  rationale: प्रत्यक्ष संबोधन में ‘हे’ स्वाभाविक है और ‘याहवे’ इब्रानी परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय उसका लिप्यंतरण करता है।
- source_word: וְאַל תִּתֵּן דָּם נָקִי בְּקֶרֶב
  choice: बीच निर्दोष के खून का दोष न रहने दे
  rationale: נתן का शाब्दिक अर्थ ‘देना/रखना’ है, पर इस न्यायिक प्रसंग में प्रार्थना यह है कि निर्दोष की हत्या से उत्पन्न दोष समुदाय में न ठहरे। यह अभिव्यक्ति हिन्दी में उस आशय को स्पष्ट करती है।
- source_word: דָּם נָקִי
  choice: निर्दोष के खून
  rationale: यह इब्रानी न्यायिक पद निर्दोष व्यक्ति के बहाए गए खून को दर्शाता है; हिन्दी में ‘निर्दोष के खून’ उसी संबंध को स्पष्ट रखता है।
- source_word: וְנִכַּפֵּר לָהֶם הַדָּם
  choice: तब उस खून के दोष का उनके लिए प्रायश्चित हो जाएगा
  rationale: נכפר निष्क्रिय/परिणामसूचक है। प्रसंग में ‘खून’ हत्या से उत्पन्न सामुदायिक उत्तरदायित्व का द्योतक है; मुख्य पाठ इसे स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत इब्रानी नाम को उपाधि में बदलने के बजाय लिप्यंतरित किया गया है; इससे मूल पाठ का नामात्मक स्वरूप बना रहता है।
- issue: अंतिम खंड में הַדָּם का न्यायिक अर्थ
  choice: उस खून के दोष
  alternative: उस खून
  rationale: अनसुलझी हत्या के इस प्रसंग में ‘खून’ उस रक्तपात से उत्पन्न उत्तरदायित्व को भी व्यक्त करता है। मुख्य पाठ में यह अर्थ स्पष्ट किया गया है, पर शाब्दिक अस्पष्टता पादटिप्पणी में दी गई है।
- issue: प्रायश्चित का कर्ता और परिणाम
  choice: प्रायश्चित हो जाएगा
  alternative: क्षमा कर दी जाएगी
  rationale: נכפר के निष्क्रिय रूप और כפר की प्रायश्चित-संबंधी शब्दावली को सुरक्षित रखा गया है; इसे केवल ‘क्षमा’ कहकर संकुचित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक है। एकवचन संबोधन के लिए ‘तू/अपनी’ मूल इब्रानी के निकट और हिन्दी बाइबलीय प्रार्थना-शैली में स्वाभाविक है। न्यायिक पदावली को समझने योग्य बनाने के साथ मूल की प्रायश्चित-संबंधी तनाव और अंतिम खंड की शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
