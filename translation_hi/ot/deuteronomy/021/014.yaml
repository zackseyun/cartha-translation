source:
  edition: WLC
  text: וְ/הָיָ֞ה אִם לֹ֧א חָפַ֣צְתָּ בָּ֗/הּ וְ/שִׁלַּחְתָּ/הּ֙ לְ/נַפְשָׁ֔/הּ וּ/מָכֹ֥ר לֹא תִמְכְּרֶ֖/נָּה בַּ/כָּ֑סֶף לֹא תִתְעַמֵּ֣ר בָּ֔/הּ תַּ֖חַת אֲשֶׁ֥ר עִנִּיתָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/014.yaml
  text: But if it happens that you do not delight in her[a], then you shall let her go where she wishes; you must certainly not sell her for money. You must not treat her as merchandise[c][b], because you have humiliated her.
translation:
  language: hi
  text: लेकिन यदि तुम उसे न चाहो, तो उसे अपनी इच्छा से जाने देना[a]। तुम उसे पैसे के लिए किसी भी तरह न बेचना। उसके साथ व्यापार की वस्तु जैसा व्यवहार न करना[b], क्योंकि तुमने उसे अपमानित किया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “उसे उसके अपने लिए भेज देना”; अर्थात उसे स्वतंत्र कर देना।'
    reason: lexical_alternative
  - marker: b
    text: या, “अपने लाभ के लिए उसका शोषण न करना।” यहाँ प्रयुक्त हिब्रू क्रिया दुर्लभ है और संभवतः किसी व्यक्ति को आर्थिक उपयोग की वस्तु बनाने का भाव रखती है।
    reason: lexical_alternative
  - marker: c
    text: या, “क्योंकि तुमने उसका यौन उत्पीड़न किया है।” हिब्रू क्रिया संदर्भ के अनुसार दुःख देने, अपमानित करने या यौन उत्पीड़न करने का अर्थ दे सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: लेकिन यदि
  rationale: यह पिछले विधान से जुड़ी हुई एक विपरीत संभावित स्थिति प्रस्तुत करता है; आधुनिक हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: לֹא חָפַצְתָּ בָּהּ
  choice: तुम उससे प्रसन्न न रहो
  rationale: חפץ इच्छा, रुचि या प्रसन्नता का भाव रखता है। यह चयन भावात्मक अर्थ को बनाए रखता है और मूल में स्पष्ट न होने पर भी केवल यौन इच्छा तक अर्थ को सीमित नहीं करता।
- source_word: וְשִׁלַּחְתָּהּ לְנַפְשָׁהּ
  choice: उसे अपनी इच्छा से जाने देना
  rationale: शाब्दिक भाव 'उसे उसके अपने लिए भेज देना' है, जिसका आशय उसे स्वतंत्र कर देना और उसके अपने निर्णय पर छोड़ना है।
- source_word: וּמָכֹר לֹא תִמְכְּרֶנָּה בַּכָּסֶף
  choice: तुम उसे पैसे के लिए किसी भी तरह न बेचना
  rationale: क्रिया के साथ infinitive absolute निषेध पर बल देता है; 'किसी भी तरह न' उस प्रबल निषेध को स्वाभाविक हिन्दी में व्यक्त करता है। כסף यहाँ चाँदी के बजाय सामान्य अर्थ में पैसा है।
- source_word: לֹא תִתְעַמֵּר בָּהּ
  choice: उसके साथ माल जैसा व्यवहार न करना
  rationale: दुर्लभ क्रिया का संदर्भ आर्थिक या प्रभुतापूर्ण शोषण से है और यह बेचने के निषेध के समानांतर आती है। यह अनुवाद स्त्री को व्यापार की वस्तु बनाने के भाव को सामने रखता है।
- source_word: תַּחַת אֲשֶׁר
  choice: क्योंकि
  rationale: यह अगले उपवाक्य को निषेध का कारण बनाता है; हिन्दी में 'क्योंकि' सबसे स्वाभाविक कारणसूचक रूप है।
- source_word: עִנִּיתָהּ
  choice: तुमने उसे अपमानित किया है
  rationale: पिएल रूप दुःख देने, दीन करने, अपमानित करने अथवा संदर्भानुसार यौन उल्लंघन का अर्थ दे सकता है। मुख्य पाठ में 'अपमानित' नैतिक आघात को व्यक्त करते हुए मूल की अर्थ-व्याप्ति को अनावश्यक रूप से संकीर्ण नहीं करता।
theological_decisions:
- issue: बंदी स्त्री के संबंध में इस विधान का नैतिक बल
  choice: पुरुष को स्त्री को स्वतंत्र छोड़ने का आदेश और उसे बेचने या आर्थिक वस्तु बनाने का निषेध स्पष्ट रखा गया है; साथ ही बाध्यकारी संदर्भ को हल्का नहीं किया गया।
  alternative: मुख्य पाठ में इसे केवल सहमति से हुआ विवाह-विच्छेद बताना, अथवा עִנִּיתָהּ का अनुवाद निश्चित रूप से 'बलात्कार किया' करना।
  rationale: पद स्वयं पुरुष की शक्ति को सीमित करता और स्त्री के साथ हुए अपमान या उत्पीड़न को निषेध का आधार बनाता है। अनुवाद को न तो इस कठोर संदर्भ को छिपाना चाहिए, न हिब्रू से अधिक विशिष्ट कानूनी निष्कर्ष मुख्य पाठ में जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और विधिक-आदेशात्मक स्वर रखा गया है। 'तुम' निकटवर्ती एकवचन संबोधन के अनुरूप है। अस्पष्ट हिब्रू पदों के वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित रखे गए हैं।
