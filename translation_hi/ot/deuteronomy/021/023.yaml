  text: לֹא תָלִ֨ין נִבְלָת֜/וֹ עַל הָ/עֵ֗ץ כִּֽי קָב֤וֹר תִּקְבְּרֶ֨/נּוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי קִלְלַ֥ת אֱלֹהִ֖ים תָּל֑וּי וְ/לֹ֤א תְטַמֵּא֙ אֶת אַדְמָ֣תְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/023.yaml
  text: His corpse shall not remain all night on the tree[a], but you shall surely bury him that same day, for a hanged man is under God's curse; and you shall not defile your land that Yahweh your God is giving you as an inheritance.
translation:
  language: hi
  text: उसकी लाश पेड़ पर रात भर न रहे, बल्कि तुम उसी दिन उसे अवश्य दफन कर देना, क्योंकि जो लटकाया गया है वह परमेश्वर के शाप के अधीन[a] है; और तुम अपनी भूमि को अशुद्ध न करना, जिसे तुम्हारा परमेश्वर यहोवा तुम्हें विरासत के रूप में दे रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि जो लटकाया गया है वह परमेश्वर से शापित है”; अथवा, “क्योंकि लटकाना परमेश्वर का अपमान है।” इब्रानी वाक्यांश संक्षिप्त है और उसके एक से अधिक अर्थ संभव हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: תָלִין
  choice: रात भर लटकी न रहे
  rationale: क्रिया का अर्थ रात बिताना या रात भर रहना है। प्रसंग में लाश के पेड़ पर रात भर बने रहने का निषेध है; हिंदी में क्रिया को स्वाभाविक बनाने के लिए 'लटकी' जोड़ा गया है।
- source_word: נִבְלָתוֹ
  choice: उसकी लाश
  rationale: नְבֵלָה मृत शरीर या शव को सूचित करता है। 'लाश' साधारण आधुनिक हिंदी में स्पष्ट और सटीक है।
- source_word: עַל הָעֵץ
  choice: पेड़ पर
  rationale: עֵץ का सामान्य अर्थ पेड़ या लकड़ी है। 'पेड़' मूल शब्दावली तथा बाद की बाइबिलीय प्रतिध्वनि को बनाए रखता है।
- source_word: קָבוֹר תִּקְבְּרֶנּוּ
  choice: उसे अवश्य गाड़ देना
  rationale: धातु के infinitive absolute और finite verb का मेल आज्ञा पर बल देता है। 'अवश्य' उस बल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: यह दफन उसी दिन, रात होने से पहले, किए जाने की समय-सीमा को सहज हिंदी में व्यक्त करता है।
- source_word: קִלְלַת אֱלֹהִים
  choice: परमेश्वर के शाप के अधीन
  rationale: संक्षिप्त इब्रानी पदबंध में संबंध अस्पष्ट है। मुख्य पाठ में यह चुनाव उस व्यक्ति की स्थिति को परमेश्वर के शाप के अधीन बताता है, बिना यह कहे कि लटकाना ही शाप देने की क्रिया है। अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: תָּלוּי
  choice: जो लटकाया गया है
  rationale: निष्क्रिय कृदंत का अर्थ लटकाया हुआ व्यक्ति है। यह हिंदी में लिंग-विशेष को अनावश्यक रूप से जोड़े बिना मूल के एकवचन भाव को व्यक्त करता है।
- source_word: תְטַמֵּא
  choice: अशुद्ध न करना
  rationale: טמא भूमि के संदर्भ में धार्मिक और नैतिक अशुद्धता दोनों का भाव रखता है। 'अशुद्ध करना' इस व्यापकता को सुरक्षित रखता है।
- source_word: אַדְמָתְךָ
  choice: अपनी भूमि
  rationale: वाचा और विरासत के प्रसंग में אֲדָמָה के लिए 'भूमि' सबसे उपयुक्त है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबिलीय प्रयोग में प्रचलित रूप 'यहोवा' व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: נַחֲלָה
  choice: विरासत के रूप में
  rationale: נַחֲלָה उत्तराधिकार में प्राप्त स्थायी संपत्ति को सूचित करता है; यह वाचा के अंतर्गत भूमि-दान का भाव बनाए रखता है।
theological_decisions:
- issue: כִּי קִלְלַת אֱלֹהִים תָּלוּי का अर्थ
  choice: जो लटकाया गया है वह परमेश्वर के शाप के अधीन है
  alternative: जो लटकाया गया है वह परमेश्वर से शापित है; अथवा लटकाना परमेश्वर का अपमान है
  rationale: इब्रानी रचना अत्यंत संक्षिप्त है और אֱלֹהִים के संबंध को एक से अधिक प्रकार से समझा जा सकता है। मुख्य पाठ प्रसंगानुकूल अर्थ देता है कि लटकाया हुआ अपराधी दिव्य शाप के चिह्न के अधीन है; पादटिप्पणी अन्य वास्तविक संभावनाओं को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कानूनी आज्ञा का बल 'अवश्य' से व्यक्त हुआ है। 'लाश' अधिक औपचारिक 'मृतदेह' की तुलना में सहज है, फिर भी मूल के स्पष्ट मृत-शरीर संबंधी अर्थ को बनाए रखता है।
