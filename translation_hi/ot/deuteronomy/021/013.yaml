  text: וְ/הֵסִ֩ירָה֩ אֶת שִׂמְלַ֨ת שִׁבְיָ֜/הּ מֵ/עָלֶ֗י/הָ וְ/יָֽשְׁבָה֙ בְּ/בֵיתֶ֔/ךָ וּ/בָֽכְתָ֛ה אֶת אָבִ֥י/הָ וְ/אֶת אִמָּ֖/הּ יֶ֣רַח יָמִ֑ים וְ/אַ֨חַר כֵּ֜ן תָּב֤וֹא אֵלֶ֨י/הָ֙ וּ/בְעַלְתָּ֔/הּ וְ/הָיְתָ֥ה לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/013.yaml
  text: She shall remove the clothing of her captivity from herself and remain in your house[a], and mourn her father and her mother for a month of days. After that you may go in to her and be her husband, and she shall be your wife.
translation:
  language: hi
  text: वह अपनी बंदी अवस्था के वस्त्र उतार दे[a] और तुम्हारे घर में रहे। वह पूरे एक महीने तक अपने पिता और अपनी माता के लिए रोए। उसके बाद तुम उसके पास जा सकते हो और उसके पति बन सकते हो, और वह तुम्हारी पत्नी हो जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी बंदी अवस्था का वस्त्र’; या ‘वे कपड़े जो उसने पकड़े जाते समय पहन रखे थे।’
    reason: שִׂמְלַת שִׁבְיָהּ का संबंधवाचक प्रयोग एकवचन सामूहिक अर्थ, बंदी अवस्था से जुड़े पहनावे, या पकड़े जाते समय पहने कपड़ों की ओर संकेत कर सकता है।
lexical_decisions:
- source_word: וְהֵסִירָה
  choice: वह ... उतार दे
  rationale: हिफ़ील रूप यहाँ शरीर पर पहने वस्त्र को हटा देने का निर्देश देता है; हिन्दी में वस्त्र के साथ ‘उतार दे’ स्वाभाविक और स्पष्ट है।
- source_word: שִׂמְלַת שִׁבְיָהּ
  choice: अपनी बँधुआई के वस्त्र
  rationale: इब्रानी का शाब्दिक संबंध ‘उसकी बँधुआई का वस्त्र’ है। यह अनुवाद उन वस्त्रों और उसकी बंदी अवस्था के संबंध को बनाए रखता है, बिना यह निश्चित किए कि वे पकड़ते समय पहने हुए वस्त्र ही थे।
- source_word: מֵעָלֶיהָ
  choice: उतार दे
  rationale: शाब्दिक अर्थ ‘अपने ऊपर से’ है; हिन्दी क्रिया ‘उतारना’ में यह भाव स्वाभाविक रूप से समाहित है।
- source_word: וְיָשְׁבָה בְּבֵיתֶךָ
  choice: तुम्हारे घर में रहे
  rationale: ישב का अर्थ बैठना, बसना या रहना हो सकता है; इस कानूनी संदर्भ में ‘रहे’ सबसे स्वाभाविक है।
- source_word: וּבָכְתָה אֶת אָבִיהָ וְאֶת אִמָּהּ
  choice: अपने पिता और अपनी माता के लिए रोए
  rationale: בכה का मूल अर्थ ‘रोना’ है। ‘के लिए रोए’ शोक के भाव को व्यक्त करता है और क्रिया को ‘शोक मनाना’ बनाकर उससे अधिक व्याख्यात्मक नहीं होता।
- source_word: יֶרַח יָמִים
  choice: पूरे एक महीने तक
  rationale: शाब्दिक मुहावरा ‘दिनों का एक महीना’ है, जिसका आशय एक पूर्ण महीने की अवधि है। आधुनिक हिन्दी में ‘पूरे एक महीने तक’ वही बल स्वाभाविक ढंग से देता है।
- source_word: וְאַחַר כֵּן
  choice: उसके बाद
  rationale: समय-क्रम का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: תָּבֹא אֵלֶיהָ
  choice: तुम उसके पास जा सकते हो
  rationale: इब्रानी मुहावरा यौन संबंध की ओर संकेत करता है। ‘उसके पास जाना’ उस व्यंजना को बनाए रखता है; ‘सकते हो’ कानूनी अनुमति के संदर्भ को व्यक्त करता है।
- source_word: וּבְעַלְתָּהּ
  choice: उसके पति बन सकते हो
  rationale: בעל यहाँ पति की भूमिका ग्रहण करने का अर्थ देता है। यह अनुवाद वैवाहिक अर्थ को स्पष्ट रखता है और स्वामित्व का भ्रामक भाव नहीं लाता।
- source_word: וְהָיְתָה לְךָ לְאִשָּׁה
  choice: वह तुम्हारी पत्नी हो जाएगी
  rationale: यह प्रचलित वैवाहिक सूत्र है; ‘हो जाएगी’ परिणामी वैवाहिक स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: युद्ध-बंदी स्त्री से विवाह के कठिन विधान में यौन और वैवाहिक भाषा
  choice: ‘उसके पास जा सकते हो’, ‘उसके पति बन सकते हो’ और ‘वह तुम्हारी पत्नी हो जाएगी’ को अलग-अलग रखा गया है।
  alternative: सभी पदों को केवल ‘उससे विवाह कर सकते हो’ कहना, अथवा यौन क्रिया को अधिक स्पष्ट और कठोर शब्दों में लिखना।
  rationale: मूल पाठ यौन-समीपता, पति बनने और पत्नी की वैधानिक स्थिति को संबंधित किन्तु अलग अभिव्यक्तियों में रखता है। हिन्दी अनुवाद इस तनाव को न तो रोमानी बनाता है, न मूल से अधिक कठोर निष्कर्ष जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कानूनी-वर्णनात्मक स्तर रखा गया है। संबोधन में ‘तुम’ मूल के एकवचन दूसरे पुरुष के अनुरूप है। ‘बँधुआई’ बंदी अवस्था को व्यक्त करती है, जबकि पादटिप्पणी वस्त्र-वाक्यांश की वास्तविक शाब्दिक अनिश्चितता सुरक्षित रखती है।
