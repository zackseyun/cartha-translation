translation:
  language: hi
  text: तब तुम्हारे बुज़ुर्ग और तुम्हारे न्यायाधीश बाहर निकलें और उस मारे गए व्यक्ति के आसपास के नगरों तक की दूरी नापें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: तब ... बाहर जाकर
  rationale: वाव + पूर्ण क्रिया यहाँ विधिक प्रक्रिया का अगला क्रम बताती है; ‘तब’ उस क्रम को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘बाहर जाकर’ मूल क्रिया को बनाए रखता है।
- source_word: זְקֵנֶיךָ
  choice: तुम्हारे पुरनिये
  rationale: यह इस्राएल को एकवचन सामुदायिक संबोधन में कहे गए ‘तुम्हारे प्राचीन/अगुवे’ हैं। ‘पुरनिये’ न्यायिक-सामुदायिक पद का परिचित और गरिमापूर्ण हिन्दी रूप है।
- source_word: וְשֹׁפְטֶיךָ
  choice: और तुम्हारे न्यायी
  rationale: שׁפט से बना यह बहुवचन न्यायिक अधिकार रखने वालों को दर्शाता है; ‘न्यायी’ पदनाम को सीधे व्यक्त करता है।
- source_word: וּמָדְדוּ אֶל הֶעָרִים
  choice: नगरों तक की दूरी नापें
  rationale: मूलतः ‘नगरों तक नापें’; स्वाभाविक हिन्दी में मापी जाने वाली दूरी को स्पष्ट करना अर्थ को बदले बिना क्रिया और उसके गंतव्य-संबंध को व्यक्त करता है।
- source_word: אֲשֶׁר סְבִיבֹת
  choice: के चारों ओर के
  rationale: यह उन आसपास स्थित नगरों की पहचान कराता है जो मारे गए व्यक्ति के स्थान के चारों ओर हैं।
- source_word: הֶחָלָל
  choice: मारे गए व्यक्ति
  rationale: חָלָל का अर्थ हिंसक रूप से मारा गया व्यक्ति है। ‘व्यक्ति’ लिंग को अनावश्यक रूप से निश्चित नहीं करता और ‘हत्या किया गया’ कहकर कानूनी निष्कर्ष पहले से नहीं ठहराता।
