base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/005.yaml
  text: And the priests[a], the sons of Levi, shall come forward, for Yahweh your God has chosen them to minister to him and to bless in the name of Yahweh, and by their word every dispute and every injury shall be settled.
translation:
  language: hi
  text: तब याजक, अर्थात् लेवी के पुत्र, आगे आएँ, क्योंकि तुम्हारे परमेश्वर याहवे ने उन्हें उसकी सेवा करने और याहवे के नाम से आशीर्वाद देने के लिए चुना है; और उनके कथन के अनुसार हर विवाद और हर चोट[a] के मामले का निर्णय होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रहार,” “पीड़ा” अथवा “विपत्ति।” इब्रानी शब्द का अर्थ “चोट” से अधिक व्यापक है, पर इस कानूनी संदर्भ में संभवतः शारीरिक हानि से जुड़े मामलों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְּשׁוּ
  choice: आगे आएँ
  rationale: निफ़ाल क्रिया यहाँ कानूनी-अनुष्ठानिक प्रक्रिया में याजकों के औपचारिक रूप से सामने आने को व्यक्त करती है।
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: याजक, अर्थात् लेवी के पुत्र
  rationale: इब्रानी समानाधिकरण को स्पष्ट रखा गया है; ‘पुत्र’ वंशगत पहचान को भी बनाए रखता है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर याहवे
  rationale: वाचा-सूचक नाम יְהוָה को ‘याहवे’ और संबोधन के एकवचन रूप को ‘तुम्हारे’ से व्यक्त किया गया है।
- source_word: לְשָׁרְתוֹ
  choice: अपनी सेवा करने
  rationale: שרת याजकीय संदर्भ में परमेश्वर की पवित्र सेवा को दर्शाता है; हिंदी में ‘सेवा करना’ स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: וּלְבָרֵךְ בְּשֵׁם יְהוָה
  choice: याहवे के नाम से आशीर्वाद देने
  rationale: यह याहवे के नाम और अधिकार के अंतर्गत याजकीय आशीर्वाद देने को सीधे व्यक्त करता है।
- source_word: וְעַל פִּיהֶם
  choice: उनके कथन के अनुसार
  rationale: शाब्दिक ‘उनके मुँह पर’ एक मुहावरा है, जिसका अर्थ उनके अधिकारपूर्ण कथन या निर्णय के अनुसार है; अनुवाद वाणी-संबंधी तत्व को बनाए रखता है।
- source_word: כָּל רִיב
  choice: हर विवाद
  rationale: רִיב कानूनी विवाद, मुक़दमे या झगड़े को सूचित कर सकता है; ‘विवाद’ इस दायरे को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: וְכָל נָגַע
  choice: हर चोट
  rationale: נֶגַע का अर्थ प्रहार, चोट, पीड़ा या विपत्ति तक विस्तृत हो सकता है। इस कानूनी संदर्भ में ‘चोट’ संभावित शारीरिक हानि को दर्शाती है, पर अत्यधिक संकीर्ण ‘हमला’ से बचती है।
- source_word: יִהְיֶה
  choice: का निर्णय होगा
  rationale: मूल क्रिया केवल ‘होगा’ है, पर कानूनी संदर्भ में निहित न्यायिक परिणाम को सहज हिंदी में स्पष्ट करने के लिए ‘निर्णय होगा’ कहा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: याजकों के कथन की न्यायिक भूमिका
  choice: उनके कथन के अनुसार ... निर्णय होगा
  alternative: उनके अधिकार से ... निपटाया जाएगा
  rationale: यह अनुवाद उनके अधिकारपूर्ण निर्णय को व्यक्त करता है, पर यह दावा नहीं करता कि वे स्वतंत्र रूप से अंतिम दैवी अधिकार के स्रोत हैं; मूल मुहावरे की वाणी-संबंधी विशेषता भी बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज लेकिन गरिमापूर्ण कानूनी-अनुष्ठानिक शैली अपनाई गई है। एकवचन संबोधन ‘तुम्हारे’ रखा गया है। वाक्य-संरचना मूल के कारणसूचक और अधिकारसूचक संबंधों को स्पष्ट रखती है।
