  text: כִּֽי יִהְיֶ֣ה לְ/אִ֗ישׁ בֵּ֚ן סוֹרֵ֣ר וּ/מוֹרֶ֔ה אֵינֶ֣/נּוּ שֹׁמֵ֔עַ בְּ/ק֥וֹל אָבִ֖י/ו וּ/בְ/ק֣וֹל אִמּ֑/וֹ וְ/יסְּר֣וּ אֹת֔/וֹ וְ/לֹ֥א יִשְׁמַ֖ע אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/018.yaml
  text: If a man has a stubborn and rebellious son who does not listen to the voice of his father or to the voice of his mother[a], and though they discipline him, he does not listen to them[d][c][b],
translation:
  language: hi
  text: यदि किसी पुरुष का हठी और विद्रोही पुत्र हो, जो अपने पिता की बात और अपनी माता की बात न माने,[a] और वे उसे अनुशासित करें, फिर भी वह उनकी न माने,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने पिता की आवाज़ और अपनी माता की आवाज़ न सुने।” यहाँ “आवाज़ सुनना” अधिकारपूर्ण निर्देश को मानने का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: इसे “और वे उसे अनुशासित करें, और वह उनकी न माने” भी अनुवाद किया जा सकता है। मूल इब्रानी संयोजक सामान्यतः “और” है, पर प्रसंग “फिर भी” का भाव भी व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यह शब्द यहाँ शर्त के रूप में दिए गए विधिक प्रसंग का आरम्भ करता है। ‘यदि’ आधुनिक हिन्दी में स्वाभाविक है; ‘जब’ भी सम्भव है।
- source_word: יִהְיֶה לְאִישׁ
  choice: किसी पुरुष का ... पुत्र हो
  rationale: इब्रानी में ‘किसी पुरुष के लिए पुत्र हो’ जैसी स्वामित्व-सूचक रचना है; हिन्दी में यह रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֵּן
  choice: पुत्र
  rationale: मूल शब्द विशेष रूप से पुरुष संतान को सूचित करता है, इसलिए लिंग-विशिष्ट अर्थ रखा गया है।
- source_word: סוֹרֵר וּמוֹרֶה
  choice: हठी और विद्रोही
  rationale: दोनों शब्द लगातार न मानने और अधिकार के विरुद्ध सक्रिय प्रतिरोध को व्यक्त करते हैं; युग्म का बल बनाए रखा गया है।
- source_word: אֵינֶנּוּ שֹׁמֵעַ
  choice: न माने
  rationale: שׁמע का मूल अर्थ सुनना है, पर इस अधिकार-संबंधी प्रसंग में इसका आशय बात मानना या आज्ञा का पालन करना है। सहज हिन्दी में ‘बात न माने’ यह भाव स्पष्ट करता है।
- source_word: בְּקוֹל אָבִיו וּבְקוֹל אִמּוֹ
  choice: अपने पिता की बात और अपनी माता की बात
  rationale: शाब्दिक रूप ‘अपने पिता की आवाज़ और अपनी माता की आवाज़’ है; यहाँ ‘आवाज़’ अधिकारपूर्ण निर्देश का मुहावरा है। ‘बात’ स्रोत के भाव और हिन्दी की स्वाभाविकता दोनों को रखता है।
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: और वे उसे अनुशासित करें
  rationale: יסר सुधारने के उद्देश्य से दी गई शिक्षा या ताड़ना को दर्शाता है, केवल दंडात्मक हिंसा को नहीं। ‘अनुशासित करें’ इसकी व्यापक सुधारात्मक शक्ति रखता है।
- source_word: וְלֹא יִשְׁמַע אֲלֵיהֶם
  choice: फिर भी वह उनकी न माने
  rationale: दूसरी बार आया שׁמע पहली अस्वीकृति को दोहराता है। ‘फिर भी’ प्रसंग में निहित रियायती संबंध स्पष्ट करता है, जबकि मूल संयोजक सामान्य ‘और’ भी हो सकता है।
