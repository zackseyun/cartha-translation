  edition: WLC
  text: וְ/רָאִיתָ֙ בַּ/שִּׁבְיָ֔ה אֵ֖שֶׁת יְפַת תֹּ֑אַר וְ/חָשַׁקְתָּ֣ בָ֔/הּ וְ/לָקַחְתָּ֥ לְ/ךָ֖ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/011.yaml
  text: and you see among the captives a woman beautiful in form[a], and you desire her and take her for yourself as a wife[b],
translation:
  language: hi
  text: और बंदियों में तुम्हें सुन्दर रूप की कोई स्त्री दिखाई दे[a], और तुम उसे चाहो और उसे अपने लिए पत्नी के रूप में ले लो[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुन्दर रूपवाली स्त्री।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ है, “उसे अपने लिए पत्नी के रूप में ले लो”; यह उससे विवाह करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָ בַּשִּׁבְיָה
  choice: और बंदियों में यदि तुम्हें ... दिखाई दे
  rationale: व्यवस्थाविवरण 21 के विधिक प्रसंग में क्रियाओं की शृंखला शर्तसूचक है। ‘बंदियों में’ युद्ध में पकड़े गए लोगों के समूह के बीच होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵשֶׁת יְפַת תֹּאַר
  choice: कोई सुन्दर रूपवाली स्त्री
  rationale: यह पद स्त्री के बाहरी रूप या स्वरूप की सुन्दरता बताता है। ‘सुन्दर रूपवाली’ मूल के शारीरिक रूप पर बल को बनाए रखते हुए सहज हिन्दी है।
- source_word: וְחָשַׁקְתָּ בָהּ
  choice: और तुम उसे चाहने लगो
  rationale: חָשַׁק प्रबल इच्छा या आसक्ति व्यक्त करता है। ‘चाहने लगो’ इसे केवल सामान्य आकर्षण तक सीमित किए बिना आधुनिक हिन्दी में स्वाभाविक रखता है।
- source_word: וְלָקַחְתָּ לְךָ לְאִשָּׁה
  choice: और उसे अपने लिए पत्नी के रूप में ले लो
  rationale: यह इब्रानी का विवाह-संबंधी मुहावरा है, जिसका शाब्दिक ढाँचा ‘अपने लिए पत्नी के रूप में लेना’ है। अनुवाद उस ढाँचे और לְךָ के आत्मसंबंधी भाव को बनाए रखता है।
theological_decisions:
- issue: नैतिक रूप से कठिन युद्धकालीन विधिक प्रसंग को न तो नरम करना, न उसमें ऐसा मूल्यांकन जोड़ना जो पद में स्पष्ट नहीं है
  choice: इच्छा करने और पत्नी के रूप में लेने के सीधे विधिक वर्णन को बनाए रखना
  alternative: ‘उसे अपनी पत्नी चुन लो’ कहकर भाषा को नरम करना, अथवा सहमति, बलप्रयोग या नैतिक अनुमोदन का स्पष्ट उल्लेख जोड़ना
  rationale: मूल पद पुरुष की इच्छा और स्त्री को पत्नी के रूप में लेने का सीधा वर्णन करता है। अनुवाद न इसे शिष्टोक्ति से ढकता है, न मूल में अनुपस्थित नैतिक निष्कर्ष जोड़ता है; इस प्रकार पाठ का नैतिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। विधिक शर्त को स्पष्ट करने के लिए ‘यदि’ जोड़ा गया है, जो प्रसंग में इब्रानी क्रिया-शृंखला के शर्तसूचक कार्य को व्यक्त करता है।
