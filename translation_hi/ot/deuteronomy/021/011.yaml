  source_fidelity: The draft accurately identifies the captives, physical beauty, desire, and taking as a wife. However, ‘चाहने लगो’ adds an ingressive sense (‘begin to desire’) not expressed by וְחָשַׁקְתָּ. Also, the explicit ‘यदि’ is supplied from the wider legal context rather than stated in this verse’s Hebrew sequence; it is not necessary in the Hindi rendering.
  naturalness: ‘सुन्दर रूप की कोई स्त्री’ is clear, modern, and more idiomatic than ‘सुन्दर रूपवाली स्त्री’ while retaining the emphasis on outward appearance. ‘तुम उसे चाहो’ is natural in the legal/conditional sequence and avoids adding aspect.
  terminology: ‘बंदियों,’ ‘पत्नी,’ and ‘अपने लिए ... ले लो’ appropriately preserve the legal and marital terminology. The wording does not soften the difficult scenario or introduce evaluative material.
  issues:
  - severity: medium
    issue: ‘चाहने लगो’ adds an ingressive nuance.
    rationale: The Hebrew חָשַׁקְתָּ means ‘you desire/set your desire on’; it does not specifically mean that the desire begins at that point. ‘तुम उसे चाहो’ is closer and idiomatic.
  - severity: low
    issue: The supplied ‘यदि’ is not represented by a word in this verse.
    rationale: The wider casuistic context supports a conditional sense, but the Hebrew verse itself begins ‘and you see.’ Omitting ‘यदि’ follows the source wording more closely while allowing the surrounding legal context to supply the condition.
  revised_text: और बंदियों में तुम्हें सुन्दर रूप की कोई स्त्री दिखाई दे[a], और तुम उसे चाहो और उसे अपने लिए पत्नी के रूप में ले लो[b],
