base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/009.yaml
  text: So you shall purge the innocent blood from your midst[a], because you shall do what is right in the eyes of Yahweh.
translation:
  language: hi
  text: इस तरह तुम अपने बीच से निर्दोष का खून दूर कर दोगे[a], क्योंकि तुम वही करोगे जो यहोवा की दृष्टि में सही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने बीच से निर्दोष का खून हटा दोगे।” इब्रानी मुहावरा उस निर्दोष व्यक्ति के बहाए गए खून के कारण समुदाय पर बने रहने वाले दायित्व को भी सूचित कर सकता है, यदि उसका प्रायश्चित न हुआ हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: इस प्रकार तुम
  rationale: संयोजक और स्वतंत्र सर्वनाम पिछले विधान का निष्कर्ष बताते हुए संबोधन पर बल देते हैं; आधुनिक हिन्दी में ‘इस प्रकार तुम’ इस प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תְּבַעֵר
  choice: दूर करोगे
  rationale: व्यवस्थाविवरण के विधिक संदर्भ में पिएल रूप समुदाय के बीच से दोष या बुराई मिटाने का अर्थ देता है।
- source_word: הַ/דָּם הַ/נָּקִי
  choice: निर्दोष के खून का दोष
  rationale: शाब्दिक अर्थ ‘निर्दोष खून’ है, पर संदर्भ में निर्दोष व्यक्ति के बहाए गए और प्रायश्चितरहित खून से उत्पन्न सामुदायिक दायित्व निहित है; ‘खून का दोष’ उस विधिक-मौलिक आशय को स्पष्ट रखते हुए रक्त की छवि भी बचाता है।
- source_word: מִ/קִּרְבֶּךָ
  choice: अपने बीच से
  rationale: यह समुदाय के भीतर से हटाने का वाचा-विधिक मुहावरा है; ‘अपने बीच से’ स्वाभाविक और सटीक हिन्दी है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ अव्यय पहले कथन का आधार प्रस्तुत करता है, इसलिए कारणसूचक अनुवाद रखा गया है।
- source_word: תַעֲשֶׂה
  choice: करोगे
  rationale: अपूर्ण क्रिया विधिक निर्देश के संदर्भ में भावी-आदेशात्मक बल रखती है; हिन्दी का सामान्य भविष्यत् रूप इस प्रसंग में वही बल ग्रहण करता है।
- source_word: הַ/יָּשָׁר
  choice: जो ... सही है
  rationale: विशेषण यहाँ संज्ञावत् प्रयुक्त है; ‘जो सही है’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּ/עֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: यह ईश्वरीय मूल्यांकन का इब्रानी मुहावरा है; ‘दृष्टि में’ अर्थ और रूपक दोनों को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय वाचा-नाम सीधे आया है। हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से इसे उपाधि में बदले बिना व्यक्तिगत नाम के रूप में रखा गया है।
- issue: הַדָּם הַנָּקִי में खून और दायित्व का संबंध
  choice: निर्दोष के खून का दोष
  alternative: निर्दोष खून
  rationale: संदर्भ अनसुलझी हत्या के बाद समुदाय पर बने रहने वाले रक्त-दोष को दूर करने का है। मुख्य पाठ में दायित्व स्पष्ट किया गया है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प और मुहावरे की अर्थ-सीमा सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन सामुदायिक संबोधन ‘तुम’ से सुरक्षित है। विधिक गंभीरता बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
