source:
  edition: WLC
  text: וּ֠/רְגָמֻ/הוּ כָּל אַנְשֵׁ֨י עִיר֤/וֹ בָֽ/אֲבָנִים֙ וָ/מֵ֔ת וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּ֑/ךָ וְ/כָל יִשְׂרָאֵ֖ל יִשְׁמְע֥וּ וְ/יִרָֽאוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/021.yaml
  text: Then all the men of his city shall stone him with stones[a], and he shall die. So you shall purge the evil from your midst, and all Israel shall hear and fear.
translation:
  language: hi
  text: तब उसके नगर के सब पुरुष उसे पत्थरों से मार डालें। इस प्रकार तुम अपने बीच से बुराई को दूर करोगे, और सारा इस्राएल सुनेगा और भय खाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְגָמֻהוּ ... בָאֲבָנִים וָמֵת
  choice: उसे पत्थरों से मार डालें
  rationale: רגם और בָאֲבָנִים न्यायिक संदर्भ में पत्थरवाह द्वारा मृत्युदंड को बताते हैं; संयुक्त हिंदी अभिव्यक्ति स्वाभाविक है और וָמֵת के मृत्यु-परिणाम को भी स्पष्ट रखती है।
- source_word: כָּל אַנְשֵׁי עִירוֹ
  choice: उसके नगर के सब पुरुष
  rationale: אַנְשֵׁי यहाँ स्पष्ट रूप से पुरुषवाचक है; ‘पुरुष’ मूल की लिंग-सटीकता को बनाए रखता है, जबकि ‘नगर’ עִיר का गरिमापूर्ण और सहज रूप है।
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: तुम अपने बीच से बुराई को दूर करोगे
  rationale: व्यवस्थाविवरण के न्यायिक सूत्र में בער का अर्थ शाब्दिक रूप से जलाना नहीं, बल्कि समुदाय से बुराई हटाना है। ‘दूर करना’ आधुनिक हिंदी में स्वाभाविक रहते हुए सूत्र का नैतिक-न्यायिक बल रखता है।
- source_word: יִשְׁמְעוּ וְיִרָאוּ
  choice: यह सुनकर डरेगा
  rationale: दोनों क्रियाओं का क्रम सुरक्षित है। हिंदी में ‘यह’ घटना-संदर्भ को सहजता से व्यक्त करता है, और सामूहिक एकवचन ‘सारा इस्राएल ... डरेगा’ स्वाभाविक है।
theological_decisions:
- issue: नगर के न्यायिक कर्ताओं का लिंग-सूचक वर्णन
  choice: उसके नगर के सब पुरुष
  alternative: उसके नगर के सब लोग
  rationale: मूल पद אַנְשֵׁי पुरुषवाचक है। इसे ‘लोग’ बनाकर सामान्यीकृत नहीं किया गया, पर इससे पाठ के बाहर कोई व्यापक लिंग-संबंधी सिद्धांत भी नहीं निकाला गया।
- issue: व्यवस्थाविवरण का बुराई हटाने का सूत्र
  choice: अपने बीच से बुराई को दूर करोगे
  alternative: अपने बीच से उस दुष्ट को मिटा दोगे
  rationale: הָרָע को अमूर्त ‘बुराई’ रखना मूल की वास्तविक व्याकरणिक और अर्थगत गुंजाइश बचाता है; इसे अनिवार्य रूप से व्यक्ति-सूचक ‘दुष्ट’ नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिंदी; न्यायिक प्रसंग के अनुरूप गंभीर और गरिमापूर्ण, पर सामान्य पाठक के लिए सहज। मूल के पुरुषवाचक नागरिक पद और व्यवस्थाविवरणीय सूत्र को बनाए रखते हुए अनावश्यक संस्कृतनिष्ठता से बचा गया है।
