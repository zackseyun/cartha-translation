  edition: WLC
  text: וְ/תָ֥פְשׂוּ ב֖/וֹ אָבִ֣י/ו וְ/אִמּ֑/וֹ וְ/הוֹצִ֧יאוּ אֹת֛/וֹ אֶל זִקְנֵ֥י עִיר֖/וֹ וְ/אֶל שַׁ֥עַר מְקֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/019.yaml
  text: then his father and his mother shall seize him and bring him out to the elders of his city and to the gate of his place[a][b].
translation:
  language: hi
  text: तब उसका पिता और उसकी माता उसे पकड़ें और उसे बाहर उसके नगर के पुरनियों के पास और उसके स्थान के फाटक पर ले जाएँ[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नगर का फाटक वह सार्वजनिक स्थान था जहाँ स्थानीय पुरनिये कानूनी मामलों की सुनवाई करते थे।
    reason: cultural_note
  - marker: b
    text: या “उसकी बस्ती के फाटक पर।” इब्रानी में शाब्दिक अर्थ है, “उसके स्थान के फाटक पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפְשׂוּ בוֹ
  choice: उसे पकड़ें
  rationale: תפשׂ के साथ ב किसी को शारीरिक रूप से दृढ़ता से पकड़ने का भाव देता है। ‘उसे पकड़ें’ आधुनिक हिन्दी में स्वाभाविक है और कानूनी कार्रवाई की दृढ़ता बनाए रखता है।
- source_word: אָבִיו וְאִמּוֹ
  choice: उसका पिता और उसकी माता
  rationale: इब्रानी में दोनों माता-पिता अलग-अलग संबंधवाचक प्रत्ययों के साथ स्पष्ट रूप से उल्लिखित हैं; पूरा रूप औपचारिक कानूनी शैली और दोनों की संयुक्त कार्रवाई को सुरक्षित रखता है।
- source_word: וְהוֹצִיאוּ אֹתוֹ
  choice: उसे ... ले जाएँ
  rationale: हिफ़ील रूप का अर्थ बाहर निकालना अथवा बाहर ले जाना है। प्रसंग में घर से सार्वजनिक न्याय-स्थल तक ले जाना अभिप्रेत है; हिन्दी में ‘ले जाएँ’ स्वाभाविक रूप से यह गति व्यक्त करता है।
- source_word: אֶל זִקְנֵי עִירוֹ
  choice: उसके नगर के पुरनियों के पास
  rationale: यह स्थानीय नागरिक अगुओं अथवा न्याय करने वाले प्राचीनों के लिए प्रचलित पद है। ‘पुरनियों’ बाइबलीय कानूनी पद को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: וְאֶל שַׁעַר מְקֹמוֹ
  choice: अर्थात उसके स्थान के फाटक पर
  rationale: कानूनी संदर्भ में फाटक सार्वजनिक न्याय-स्थल है। ‘उसके स्थान’ इब्रानी מְקֹמוֹ की शाब्दिक अस्पष्टता को बनाए रखता है; ‘अर्थात’ हिन्दी में समान गंतव्य—पुरनियों के बैठने के फाटक—को स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी अपनाई गई है। कानूनी प्रसंग के लिए ‘पुरनियों’ और ‘फाटक’ जैसे स्थापित बाइबलीय पद रखे गए हैं, जबकि मूल के ‘उसके स्थान’ को पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
