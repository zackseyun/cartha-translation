base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/009.yaml
  text: You shall not yield to him or listen to him[a], and your eye shall not pity him, and you shall not spare[c][b], and you shall not conceal him.
translation:
  language: hi
  text: तुम न तो उसकी बात मानना[a], न उसकी न सुनना; उस पर तुम्हारी आँख तरस न खाए[b]; न उसे बख्शना, और न उसे छिपाना[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उससे सहमत होना” अथवा “उसके आगे झुकना।” इब्रानी क्रिया राज़ी होने, सहमत होने या किसी के आग्रह के आगे झुकने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उस पर तुम्हारी आँख तरस न खाए”—यह दयाभरी दृष्टि न रखने का इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: c
    text: या, “उस पर परदा न डालना”—अर्थात उसे अथवा उसके अपराध को न छिपाना।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאבֶה לוֹ
  choice: उसकी बात मानना
  rationale: आבה का अर्थ राज़ी होना, सहमत होना या किसी के आग्रह के आगे झुकना हो सकता है। इस प्रसंग में ‘उसकी बात मानना’ बहकावे को स्वीकार न करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִשְׁמַע אֵלָיו
  choice: उसकी सुनना
  rationale: שׁמע के साथ אֶל यहाँ केवल ध्वनि सुनने के बजाय ध्यान देकर सुनने या बात पर कान देने का अर्थ देता है। ‘उसकी सुनना’ इस अर्थ को आज्ञापालन तक सीमित किए बिना बनाए रखता है।
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: उस पर तुम्हारी आँख तरस न खाए
  rationale: חוּס और ‘आँख’ की स्पष्ट इब्रानी छवि को बनाए रखते हुए यह वाक्य दयाभरी दृष्टि या तरस का अर्थ स्वाभाविक हिन्दी में देता है।
- source_word: תַחְמֹל
  choice: उसे छोड़ना
  rationale: חמל का अर्थ दया करना या छोड़ देना/बचा लेना हो सकता है। पिछले ‘तरस’ से भेद रखते हुए ‘उसे छोड़ना’ न्यायिक प्रसंग में अपराधी को दंड से बचा देने का संचयी भाव व्यक्त करता है।
- source_word: תְכַסֶּה עָלָיו
  choice: उसे छिपाना
  rationale: Piel में כסה यहाँ ढकने, छिपाने या किसी के लिए पर्दा डालने का भाव देता है। ‘उसे छिपाना’ व्यक्ति को बचाने अथवा उसके अपराध को प्रकट न करने की वास्तविक अस्पष्टता को पर्याप्त रूप से खुला रखता है।
theological_decisions:
- issue: धर्मत्याग के लिए बहकाने वाले के विषय में कठोर वाचा-न्यायिक भाषा
  choice: सभी प्रत्यक्ष निषेधों और उनकी क्रमिक तीव्रता को बिना नरम किए सुरक्षित रखा गया है।
  alternative: इसे केवल भावनात्मक दूरी या सामान्य असहमति के रूप में ढीला करके कहना।
  rationale: मूल पद सुनने वाले को बहकाने वाले की बात मानने, उसकी सुनने, उस पर तरस खाने, उसे छोड़ने और उसे छिपाने से रोकता है। अनुवाद इस कठोर कानूनी-वाचागत स्वर को न तो कम करता है, न किसी संप्रदायगत व्याख्या से बढ़ाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर और प्रत्यक्ष कानूनी स्वर रखा गया है। ‘न तो…न…; …न…; न…और न…’ की रचना मूल के बार-बार आने वाले निषेधों का संचयी बल बनाए रखती है। सर्वनाम एकवचन पुल्लिंग हैं, जैसा कि इब्रानी पाठ में है।
