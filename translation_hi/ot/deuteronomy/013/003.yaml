base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/003.yaml
  text: and the sign or the wonder comes to pass[a], about which he spoke to you, saying, ‘Let us go after other gods, which you have not known[c][b], and let us serve them,’
translation:
  language: hi
  text: 'और वह चिह्न या अद्भुत घटना[a], जिसके विषय में उसने तुमसे कहा था, घटित हो जाए: “आओ, हम दूसरे देवताओं के पीछे चलें—जिन्हें तुम नहीं जानते[b]—और उनकी सेवा करें[c],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “चिह्न और अद्भुत घटना”; यह युग्म “चिह्न या अद्भुत घटना” के अर्थ में भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिनसे तुम परिचित नहीं हो।”
    reason: lexical_alternative
  - marker: c
    text: या, “और उनकी उपासना करें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: घटित हो जाए
  rationale: क्रिया का मूल अर्थ ‘आना’ है, पर भविष्यवाणी किए गए चिह्न या अद्भुत घटना के संदर्भ में इसका आशय उसके सचमुच घटित होने से है।
- source_word: הָאוֹת וְהַמּוֹפֵת
  choice: चिह्न या अद्भुत घटना
  rationale: दोनों संज्ञाएँ इब्रानी में ‘और’ से जुड़ी हैं, किंतु यह युग्म चमत्कारिक प्रमाण की वैकल्पिक श्रेणियों को भी व्यक्त कर सकता है। हिंदी में ‘चिह्न या अद्भुत घटना’ स्वाभाविक है; शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: जिसके विषय में उसने तुमसे कहा था
  rationale: यह संबंधवाचक उपवाक्य और श्रोता की ओर संबोधित कथन—दोनों को स्पष्ट, स्वाभाविक हिंदी में बनाए रखता है।
- source_word: נֵלְכָה אַחֲרֵי
  choice: आओ, हम … के पीछे चलें
  rationale: सहभागिता का आह्वान व्यक्त करने वाले रूप और ‘पीछे चलने’ की इब्रानी छवि को बनाए रखते हुए धार्मिक निष्ठा का भाव प्रकट करता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: व्यवस्थाविवरण में प्रयुक्त वाचा-संबंधी अभिव्यक्ति का सीधा और प्रचलित हिंदी अनुवाद है।
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: जिन्हें तुम नहीं जानते थे
  rationale: ‘जानना’ मूल क्रिया के अर्थ को सुरक्षित रखता है और परिचय अथवा मान्यता के संभावित भाव को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְנָעָבְדֵם
  choice: और उनकी सेवा करें
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है और यहाँ धार्मिक सेवा निहित है। ‘सेवा’ व्यापक वाचा-संबंधी अर्थ को बनाए रखती है; ‘उपासना’ संदर्भानुकूल विकल्प है।
theological_decisions:
- issue: दूसरे देवताओं के विषय में ‘जानने’ की भाषा
  choice: जिन्हें तुम नहीं जानते थे
  alternative: जिनसे तुम परिचित नहीं थे
  rationale: मुख्य पाठ इब्रानी के ‘जानना’ को बनाए रखता है और न तो इन देवताओं की वास्तविकता को मान लेता है, न उनके अस्तित्व के प्रश्न का सिद्धांतगत समाधान आरोपित करता है।
- issue: עבד का धार्मिक अर्थ
  choice: उनकी सेवा करें
  alternative: उनकी उपासना करें
  rationale: ‘सेवा’ इब्रानी शब्द का व्यापक अर्थ सुरक्षित रखती है, जबकि संदर्भ में उसका धार्मिक और उपासनात्मक आशय स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल किंतु गरिमापूर्ण रूप अपनाया गया है। ‘आओ, हम … चलें’ सामूहिक आग्रह को स्वाभाविक बनाता है। ‘के पीछे चलें’ इब्रानी रूपक को सुरक्षित रखता है, और विराम-चिह्न उद्धृत प्रलोभन की संरचना स्पष्ट करते हैं।
