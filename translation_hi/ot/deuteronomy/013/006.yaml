base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/006.yaml
  text: But that prophet[a], or that dreamer of dreams, shall be put to death, because he has spoken rebellion against Yahweh your God, who brought you out from the land of Egypt and redeemed you from the house of slavery, to drive you from the way in which Yahweh your God commanded you to walk[b]. So you shall purge the evil from your midst.
translation:
  language: hi
  text: परन्तु वह नबी या वह स्वप्न देखनेवाला मार डाला जाए, क्योंकि उसने तुम्हारे परमेश्वर यहवे के विरुद्ध विद्रोह की बात[a] कही है—उस यहवे के विरुद्ध जो तुम्हें मिस्र देश से निकाल लाया और गुलामी के घर[b] से तुम्हें छुड़ाया—ताकि वह तुम्हें उस मार्ग से भटका दे जिस पर चलने की आज्ञा तुम्हारे परमेश्वर यहवे ने तुम्हें दी है। इस प्रकार तुम अपने बीच से उस बुराई को दूर कर देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मत्याग की बात।” इब्रानी अभिव्यक्ति परमेश्वर के प्रति वाचा की निष्ठा से फिर जाने को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “दासों का घर”; अर्थात गुलामी का स्थान।
    reason: literal_rendering
lexical_decisions:
- source_word: וְהַנָּבִיא הַהוּא אוֹ חֹלֵם הַחֲלוֹם הַהוּא
  choice: परन्तु वह नबी या वह स्वप्न देखनेवाला
  rationale: आरम्भिक וְ को पिछले प्रसंग के प्रतिकूल/निष्कर्षात्मक संबंध के कारण ‘परन्तु’ कहा गया है। दोनों व्यक्तियों पर लगे הַהוּא का संकेत ‘वह’ द्वारा रखा गया है; ‘स्वप्न देखनेवाला’ हिन्दी में स्वाभाविक है।
- source_word: יוּמָת
  choice: मार डाला जाए
  rationale: מות का होफ़अल रूप न्यायिक रूप से मृत्यु दिए जाने का निष्क्रिय अर्थ देता है, केवल स्वाभाविक मृत्यु का नहीं।
- source_word: כִּי דִבֶּר סָרָה
  choice: क्योंकि उसने … विद्रोह की बात कही है
  rationale: סָרָה वाचा की निष्ठा से विमुखता, विद्रोह या धर्मत्याग को दर्शाता है। ‘विद्रोह की बात’ मूल की संज्ञात्मक रचना और उसके गंभीर अर्थ को बनाए रखती है।
- source_word: עַל יְהוָה אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर यहवे के विरुद्ध
  rationale: इस विरोधी प्रसंग में עַל का अर्थ ‘के विरुद्ध’ है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहवे’ से व्यक्त किया गया है।
- source_word: הַמּוֹצִיא אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: जो तुम्हें मिस्र देश से निकाल लाया
  rationale: यह निर्गमन की प्रचलित मूल-भाषायी अभिव्यक्ति है; हिन्दी में ‘निकाल लाया’ उद्धारकारी क्रिया और गति दोनों को स्पष्ट करता है।
- source_word: וְהַפֹּדְךָ מִבֵּית עֲבָדִים
  choice: और गुलामी के घर से तुम्हें छुड़ाया
  rationale: פדה का अर्थ छुड़ाना/मोल देकर मुक्त करना है। בֵּית עֲבָדִים का ठोस रूपक बनाए रखते हुए ‘गुलामी का घर’ आधुनिक हिन्दी में ‘दासों का घर’ से अधिक स्वाभाविक है।
- source_word: לְהַדִּיחֲךָ מִן הַדֶּרֶךְ
  choice: ताकि वह तुम्हें उस मार्ग से भटका दे
  rationale: נדח का हिफ़इल किसी को मार्ग से दूर करने या बहकाने का अर्थ देता है। ‘मार्ग’ व्यवस्थाविवरण की आचरण-संबंधी वाचा-छवि को सुरक्षित रखता है।
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ לָלֶכֶת בָּהּ
  choice: जिस पर चलने की आज्ञा तुम्हारे परमेश्वर यहवे ने तुम्हें दी है
  rationale: ‘मार्ग पर चलना’ मूल के व्यवहार और जीवन-चाल संबंधी रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: इस प्रकार तुम अपने बीच से उस बुराई को मिटा देना
  rationale: व्यवस्थाविवरण के कानूनी सूत्र में בער निर्णायक रूप से दूर करने का अर्थ रखता है। ‘उस बुराई’ निकट प्रसंग की दुष्टता को दर्शाता है और हिन्दी में सूत्र का बल बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में टेट्राग्रामटन व्यक्तिगत वाचा-नाम के रूप में आया है; ‘यहवे’ उसे किसी उपाधि में बदले बिना प्रस्तुत करता है।
- issue: סָרָה का वाचा-संबंधी अर्थ
  choice: विद्रोह की बात
  alternative: धर्मत्याग की बात
  rationale: शब्द में परमेश्वर के प्रति वाचा-निष्ठा से विमुख होने का अर्थ है। मुख्य पाठ में ‘विद्रोह’ स्पष्ट आधुनिक हिन्दी है, जबकि पादटिप्पणी ‘धर्मत्याग’ की निकट वैकल्पिक छाया सुरक्षित रखती है।
- issue: הָרָע का संदर्भ
  choice: उस बुराई
  alternative: उस बुरे व्यक्ति को
  rationale: हिब्रू रूप ‘बुराई’ अथवा प्रसंगानुसार उसके कर्ता की ओर संकेत कर सकता है। मुख्य पाठ अधिक औपचारिक और व्यापक ‘उस बुराई’ रखता है और व्यक्ति-केंद्रित अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी चेतावनी के अनुरूप रखी गई है। ‘मार्ग पर चलना’, ‘गुलामी का घर’ और ‘अपने बीच से … मिटा देना’ जैसी मूल छवियाँ यथासंभव सुरक्षित हैं। हिन्दी का ‘तुम’ एकवचन और बहुवचन दोनों संदर्भों में चल सकता है, इसलिए हिब्रू में सामूहिक बहुवचन से प्रतिनिधिक एकवचन की पारी को अस्वाभाविक बनाए बिना खुला रखा गया है।
