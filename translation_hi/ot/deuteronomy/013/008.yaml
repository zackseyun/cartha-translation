  text: מֵ/אֱלֹהֵ֣י הָֽ/עַמִּ֗ים אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם הַ/קְּרֹבִ֣ים אֵלֶ֔י/ךָ א֖וֹ הָ/רְחֹקִ֣ים מִמֶּ֑/ךָּ מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/008.yaml
  text: from the gods of the peoples that are around you[a], whether near to you or far from you, from one end of the earth to the other end of the earth—
translation:
  language: hi
  text: तुम्हारे चारों ओर रहनेवाले लोगों के देवताओं में से—चाहे वे तुम्हारे निकट हों या तुमसे दूर—पृथ्वी के एक छोर से पृथ्वी के दूसरे छोर तक[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देश के एक छोर से देश के दूसरे छोर तक।’ इब्रानी אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֱלֹהֵי הָעַמִּים
  choice: लोगों के देवताओं में से
  rationale: מִן यहाँ उस समूह या स्रोत को सूचित करता है जिससे प्रलोभन में उल्लिखित देवता संबंधित हैं। ‘लोगों’ से עַמִּים का जातीय-समुदायवाचक बहुवचन सहज हिन्दी में बना रहता है।
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: तुम्हारे चारों ओर रहनेवाले
  rationale: यह संबंधवाचक खंड आसपास के लोगों का स्थान बताता है; ‘रहनेवाले’ हिन्दी में स्वाभाविक रूप से निहित स्थानिक अर्थ स्पष्ट करता है।
- source_word: הַקְּרֹבִים אֵלֶיךָ אוֹ הָרְחֹקִים מִמֶּךָּ
  choice: चाहे वे तुम्हारे निकट हों या तुमसे दूर
  rationale: ‘निकट’ और ‘दूर’ मूल के संतुलित विरोध को बनाए रखते हैं; ‘चाहे…या’ विकल्पात्मक संरचना को स्वाभाविक हिन्दी देती है।
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: पृथ्वी के एक छोर से पृथ्वी के दूसरे छोर तक
  rationale: यह व्यापक भौगोलिक विस्तार बताने वाला मुहावरा है। दोनों बार ‘पृथ्वी’ दोहराकर इब्रानी संरचना और उसकी अलंकारिक व्यापकता सुरक्षित रखी गई है।
theological_decisions:
- issue: הָאָרֶץ का भौगोलिक दायरा
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ दोनों हो सकता है। यहाँ ‘एक छोर से दूसरे छोर तक’ वाली सूत्रात्मक अभिव्यक्ति व्यापकतम क्षेत्र की ओर संकेत करती है, इसलिए मुख्य पाठ में ‘पृथ्वी’ रखा गया है; वास्तविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यह पद पिछले वाक्य का जारी अंश है, इसलिए आरंभ और अंत की अपूर्ण वाक्य-संरचना तथा अंतिम डैश बनाए गए हैं।
