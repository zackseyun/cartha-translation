base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/015.yaml
  text: and you shall investigate[a], and search out, and inquire thoroughly; and behold, if it is true and certain that this abomination has been done in your midst,
translation:
  language: hi
  text: तब तुम छानबीन करना, जाँच-पड़ताल करना और अच्छी तरह पूछताछ करना। और देखो, यदि यह बात सत्य और प्रमाणित सिद्ध हो कि यह घृणित काम तुम्हारे बीच किया गया है,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि सूचना सत्य हो और बात प्रमाणित हो जाए।”
    reason: अֱमֶת नָכוֹן הַדָּבָר के न्यायिक पुष्टि-सूत्र का एक स्वाभाविक वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וְדָרַשְׁתָּ
  choice: छानबीन करना
  rationale: कानूनी संदर्भ में यह क्रिया किसी सूचना की व्यवस्थित जाँच करने का भाव रखती है; ‘छानबीन’ आधुनिक और सहज है।
- source_word: וְחָקַרְתָּ
  choice: जाँच-पड़ताल करना
  rationale: यह सावधानी से खोजने और परखने के भाव को आगे बढ़ाती है तथा पहली क्रिया के साथ संचयी न्यायिक प्रक्रिया दर्शाती है।
- source_word: וְשָׁאַלְתָּ הֵיטֵב
  choice: अच्छी तरह पूछताछ करना
  rationale: שאל के पूछने/पूछताछ करने और הֵיטֵב के ‘भली-भाँति’ अर्थ, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और यदि ... निकले
  rationale: यहाँ הנה जाँच के फलस्वरूप सामने आई स्थिति का संकेत देता है; हिन्दी की शर्तसूचक कानूनी रचना में ‘यदि ... निकले’ उसका कार्य स्वाभाविक रूप से निभाता है।
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: यह बात सच और पक्की निकले
  rationale: यह पुष्टि-सूत्र सूचना की सत्यता और उसके स्थापित हो जाने, दोनों को बनाए रखता है।
- source_word: נֶעֶשְׂתָה
  choice: किया गया है
  rationale: निफ़अल रूप के कर्मवाच्य अर्थ को स्पष्ट रखता है और जाँच के समय तक घटित कार्य को दर्शाता है।
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: यह घिनौना काम
  rationale: תועבה की तीव्र नैतिक और वाचायी निंदा को सामान्य आधुनिक हिन्दी में व्यक्त करता है; ‘काम’ इस प्रसंग में घटित कृत्य को स्पष्ट करता है।
- source_word: בְּקִרְבֶּךָ
  choice: तुम्हारे बीच
  rationale: समुदाय के भीतर घटना घटने के भाव का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: न्यायिक सत्यापन का सूत्र
  choice: जाँच की क्रमिक प्रक्रिया के बाद ‘यदि यह बात सच और पक्की निकले’
  alternative: यदि सूचना सच हो और बात प्रमाणित हो जाए
  rationale: इब्रानी पाठ जाँच-संबंधी तीन क्रियाओं को जोड़कर फिर सत्य और निश्चितता का सूत्र देता है। चुना गया रूप इस कानूनी गंभीरता को सहज हिन्दी में बनाए रखता है और अपुष्ट आरोप को तथ्य मान लेने से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। जाँच-संबंधी तीनों इब्रानी क्रियाओं की संचयी शक्ति बनाए रखी गई है। पद अगले पद में पूरी होने वाली शर्तसूचक वाक्य-रचना है, इसलिए अंत में अल्पविराम रखा गया है।
