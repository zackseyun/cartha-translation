  text: הַכֵּ֣ה תַכֶּ֗ה אֶת יֹֽשְׁבֵ֛י הָ/עִ֥יר ה/הוא לְ/פִי חָ֑רֶב הַחֲרֵ֨ם אֹתָ֧/הּ וְ/אֶת כָּל אֲשֶׁר בָּ֛/הּ וְ/אֶת בְּהֶמְתָּ֖/הּ לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/016.yaml
  text: You shall surely strike the inhabitants of that city with the edge of the sword[a], devoting it to destruction, along with all that is in it and its livestock[b], with the edge of the sword.
translation:
  language: hi
  text: तुम उस नगर के निवासियों को तलवार की धार से अवश्य मार डालना। उस नगर को, उसमें जो कुछ है उसे और उसके पालतू पशुओं को, विनाश के लिए समर्पित करके[a] तलवार की धार से नष्ट कर देना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का अर्थ किसी वस्तु को अपरिवर्तनीय रूप से विनाश के लिए समर्पित करना, या उसे ‘प्रतिबंध के अधीन’ करना है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘तलवार के मुँह से’; यह इब्रानी मुहावरा तलवार की धार से मारने या नष्ट करने का अर्थ देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה תַכֶּה
  choice: अवश्य मार डालना
  rationale: क्रिया के साथ उसी धातु का अनंत रूप आदेश को अत्यंत बल देता है। ‘अवश्य’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है; तलवार के संदर्भ में ‘मार डालना’ घातक अर्थ को स्पष्ट रखता है।
- source_word: יֹשְׁבֵי הָעִיר הַהוּא
  choice: उस नगर के निवासी
  rationale: प्रतिभागी रूप का अर्थ वहाँ रहने वाले लोग है; ‘निवासी’ आधुनिक मानक हिन्दी में संक्षिप्त और सहज है।
- source_word: לְפִי חָרֶב
  choice: तलवार की धार से
  rationale: इब्रानी मुहावरे का शाब्दिक चित्र ‘तलवार के मुँह से’ है। ‘तलवार की धार से’ हिन्दी में स्वाभाविक रहते हुए ठोस चित्र को बनाए रखता है।
- source_word: הַחֲרֵם
  choice: पूरी तरह विनाश के लिए अर्पित कर देना
  rationale: हिफ़ील रूप किसी वस्तु को अपरिवर्तनीय रूप से विनाश हेतु अलग या समर्पित करने का धार्मिक-न्यायिक भाव रखता है। यह अनुवाद केवल ‘नष्ट करना’ कहने की अपेक्षा उस तकनीकी भाव को अधिक सुरक्षित रखता है।
- source_word: אֹתָהּ
  choice: उस नगर को
  rationale: स्त्रीलिंग एकवचन सर्वनाम का पूर्वपद ‘नगर’ है; हिन्दी में संज्ञा दोहराने से संदर्भ स्पष्ट और स्वाभाविक रहता है।
- source_word: וְאֶת כָּל אֲשֶׁר בָּהּ
  choice: उसमें जो कुछ है
  rationale: यह वाक्यांश आदेश के दायरे को नगर की समस्त सामग्री तक बढ़ाता है और हिन्दी में मूल की व्यापकता बनाए रखता है।
- source_word: בְּהֶמְתָּהּ
  choice: उसके पशु
  rationale: בְּהֵמָה सामूहिक रूप से पालतू या घरेलू पशुओं को दर्शा सकता है। ‘पशु’ किसी एक प्रजाति तक अर्थ को सीमित नहीं करता।
- source_word: לְפִי חָרֶב
  choice: तलवार की धार से
  rationale: मूल पाठ में इस मुहावरे की पुनरावृत्ति है; अनुवाद में भी उसे बनाए रखा गया है ताकि बल और दायरा सुरक्षित रहें।
theological_decisions:
- issue: युद्ध और न्याय के प्रसंग में חרם का अनुवाद
  choice: पूरी तरह विनाश के लिए अर्पित कर देना
  alternative: सर्वथा नष्ट कर देना; प्रतिबंध के अधीन कर देना
  rationale: यह क्रिया केवल सैन्य विनाश नहीं, बल्कि किसी वस्तु को अपरिवर्तनीय रूप से विनाश के लिए समर्पित करने का धार्मिक भाव भी रखती है। चुना हुआ रूप इस तनाव को बिना अपारदर्शी पारिभाषिक शब्दावली के बनाए रखता है।
- issue: कठोर न्यायादेश की भाषा
  choice: आदेश की पूरी कठोरता को बिना नरम किए बनाए रखना
  alternative: पराजित करना या सामान्य रूप से नष्ट करना
  rationale: इब्रानी पाठ घातक और सर्वग्रासी आदेश देता है। उसे हल्का करना स्रोत में निहित गंभीरता को बदल देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, प्रत्यक्ष और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। मूल की पुनरावृत्ति, आदेश का बल और חרם का धार्मिक-विनाशकारी तनाव सुरक्षित रखा गया है।
