  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹר֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לַ/עֲשׂוֹת֙ הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/019.yaml
  text: if you listen to the voice of Yahweh your God, to keep all his commandments that I am commanding you today, to do what is right in the eyes of Yahweh your God.
translation:
  language: hi
  text: यदि[a] तुम अपने परमेश्वर याहवे की वाणी सुनोगे, उसकी सभी आज्ञाओं का पालन करोगे जिन्हें मैं आज तुम्हें दे रहा हूँ, और वह करोगे जो तुम्हारे परमेश्वर याहवे की दृष्टि में सही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: क्योंकि'
    reason: כִּי प्रसंगानुसार शर्तसूचक ‘यदि’ या कारणसूचक ‘क्योंकि’ हो सकता है; पिछले पद से इसका सटीक संबंध कुछ हद तक अस्पष्ट है।
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यहाँ यह अव्यय पिछले कथन से जुड़ी शर्त प्रस्तुत करता है। ‘यदि’ उस संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है; ‘क्योंकि’ भी व्याकरणतः संभव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
- source_word: תִשְׁמַע בְּקוֹל
  choice: वाणी सुनोगे
  rationale: यह इब्रानी मुहावरा ध्यानपूर्वक सुनने और उसके अनुसार चलने—दोनों का भाव रखता है। ‘वाणी सुनोगे’ श्रवण-रूपक और आज्ञाकारिता की अंतर्निहित भावना दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: לִשְׁמֹר אֶת כָּל מִצְוֺתָיו
  choice: उसकी उन सभी आज्ञाओं का पालन करोगे
  rationale: שׁמר का आशय आज्ञाओं को सावधानी से मानना है। हिन्दी में ‘पालन करना’ इस वाचागत और विधिक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: जिन्हें मैं आज तुम्हें दे रहा हूँ
  rationale: वर्तमान कृदंत चालू वचन-क्रिया को दिखाता है। हिन्दी में आज्ञा ‘देना’ स्वाभाविक है और ‘दे रहा हूँ’ उस अपूर्ण/वर्तमान बल को रखता है।
- source_word: לַעֲשׂוֹת הַיָּשָׁר בְּעֵינֵי
  choice: वही करोगे जो ... की दृष्टि में सही है
  rationale: यह नैतिक मूल्यांकन का इब्रानी मुहावरा है। ‘की दृष्टि में सही’ उसका रूपक और अर्थ दोनों सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: सुनने और आज्ञापालन का संबंध
  choice: ‘वाणी सुनोगे’ के बाद आज्ञाओं के पालन को अलग किंतु संबद्ध क्रिया के रूप में रखना
  alternative: ‘आज्ञा मानोगे’
  rationale: केवल ‘आज्ञा मानना’ अर्थ को स्पष्ट तो करता, पर मूल का वाणी-संबंधी रूपक मिटा देता। वर्तमान रूप सुनने से आज्ञापालन तक के संबंध को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन संबोधन के लिए ‘तुम’ प्रयोग हुआ है। मूल के आश्रित infinitive-वाक्यांशों को हिन्दी में समानांतर भविष्यत् क्रियाओं के रूप में व्यक्त किया गया है, जिससे शर्त और आज्ञापालन का संबंध स्पष्ट रहता है।
