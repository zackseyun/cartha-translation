base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/004.yaml
  text: You shall not listen to the words of that prophet or to that dreamer of dreams[a], for Yahweh your God is testing you[b], to know whether you love Yahweh your God with all your heart and with all your soul.
translation:
  language: hi
  text: तुम उस नबी या उस स्वप्न देखने वाले की बातों पर ध्यान न देना, क्योंकि याहवे, तुम्हारा परमेश्वर, तुम्हारी परीक्षा ले रहा है, यह जानने के लिए कि तुम अपने परमेश्वर याहवे से अपने सारे हृदय और अपने सारे प्राण[a] से प्रेम करते हो या नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “प्राण” का अर्थ “जीवन,” “स्वयं” या “सम्पूर्ण अस्तित्व” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִשְׁמַע אֶל
  choice: बातों पर ध्यान न देना
  rationale: שׁמע אֶל में सुनने के साथ मानने या ध्यान देने का भाव है। यह रूप हिंदी में निषेध की आज्ञात्मक शक्ति और आज्ञापालन-संबंधी अर्थ दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דִּבְרֵי הַנָּבִיא הַהוּא אוֹ אֶל חוֹלֵם הַחֲלוֹם הַהוּא
  choice: उस नबी या उस स्वप्न देखनेवाले की बातों
  rationale: दोनों व्यक्तियों के साथ आए संकेतवाचक भाव को ‘उस’ से रखा गया है। חוֹלֵם הַחֲלוֹם के सजातीय शब्द-प्रयोग को शब्दशः दोहराने के बजाय सहज हिंदी ‘स्वप्न देखनेवाला’ अपनाया गया है।
- source_word: מְנַסֶּה
  choice: परीक्षा ले रहा है
  rationale: पिएल रूप यहाँ जाँचने या परखने की चल रही क्रिया बताता है; ‘परीक्षा ले रहा है’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לָדַעַת
  choice: ताकि यह जाने
  rationale: मूल के उद्देश्यसूचक ‘जानने के लिए’ और उसके मानव-सदृश कथन को बिना व्याख्यात्मक रूप से नरम किए सुरक्षित रखा गया है।
- source_word: הֲיִשְׁכֶם אֹהֲבִים
  choice: प्रेम करते हो या नहीं
  rationale: प्रश्नवाचक कण और कृदंत के जारी अवस्था-संबंधी भाव को हिंदी के स्वाभाविक वर्तमान काल में व्यक्त किया गया है।
- source_word: בְּכָל לְבַבְכֶם
  choice: अपने सारे हृदय से
  rationale: לֵבָב के अंतःकरण, इच्छा और विचार के व्यापक भाव को पारंपरिक तथा अंतर्पाठीय रूप से पहचाने जाने योग्य ‘हृदय’ से व्यक्त किया गया है।
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: और अपने सारे प्राण से
  rationale: נֶפֶשׁ के जीवन, स्वयं और प्राण के अर्थक्षेत्र में ‘प्राण’ हिंदी की वाचा-संबंधी भाषा और अंतर्पाठीय संबंध बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसका अधिक प्रत्यक्ष लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: परमेश्वर का परीक्षा लेना ‘ताकि जाने’
  choice: मानव-सदृश कथन को यथावत रखना
  alternative: ‘ताकि प्रकट करे’ या ‘ताकि तुम्हें दिखाए’
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘जानने के लिए’ कहता है। इसे ‘प्रकट करने’ में बदलना एक धर्मवैचारिक समाधान को पाठ में जोड़ देता।
- issue: נֶפֶשׁ का अर्थक्षेत्र
  choice: प्राण
  alternative: जीवन / सम्पूर्ण अस्तित्व
  rationale: ‘प्राण’ व्यवस्थाविवरण की वाचा-संबंधी उक्ति की अंतर्पाठीय पहचान बनाए रखता है, जबकि पादटिप्पणी व्यापक अर्थक्षेत्र बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। निषेध को ‘ध्यान न देना’ से स्पष्ट किया गया है; वाचा-संबंधी ‘हृदय’ और ‘प्राण’ को अंतर्पाठीय निरंतरता के लिए बनाए रखा गया है।
