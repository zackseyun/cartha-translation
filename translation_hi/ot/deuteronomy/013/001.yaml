reference: Deuteronomy 13:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵ֣ת כָּל הַ/דָּבָ֗ר אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם אֹת֥/וֹ תִשְׁמְר֖וּ לַ/עֲשׂ֑וֹת לֹא תֹסֵ֣ף עָלָ֔י/ו וְ/לֹ֥א תִגְרַ֖ע מִמֶּֽ/נּוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/001.yaml
  text: Every word that I am commanding you[a], you shall be careful to do. You shall not add to it[b], and you shall not take away from it.
translation:
  language: hi
  text: जो कुछ मैं तुम्हें आज्ञा दे रहा हूँ, उस सबका पालन करने में सावधानी रखना। उसमें न कुछ जोड़ना और न उसमें से कुछ घटाना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ बाइबल परंपराओं में यह पद व्यवस्थाविवरण 12:32 गिना जाता है।
    reason: versification
lexical_decisions:
- source_word: כָּל הַדָּבָר
  choice: जो कुछ … उस सबका
  rationale: यह स्वाभाविक हिन्दी में इब्रानी के सामूहिक एकवचन ‘सारा वचन/पूरी बात’ का व्यापक अर्थ व्यक्त करता है और इसे केवल अलग-अलग शब्दों तक सीमित नहीं करता।
- source_word: מְצַוֶּה
  choice: आज्ञा दे रहा हूँ
  rationale: वर्तमान कृदंत के जारी अथवा तत्काल निर्देश के भाव को आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תִשְׁמְרוּ לַעֲשׂוֹת
  choice: पालन करने में सावधानी रखना
  rationale: שׁמר और उद्देश्यसूचक क्रिया के मुहावरे में सतर्कता तथा वास्तविक पालन, दोनों निहित हैं।
- source_word: לֹא תֹסֵף עָלָיו
  choice: उसमें न कुछ जोड़ना
  rationale: आज्ञा में किसी बात को बढ़ाने की मनाही को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: וְלֹא תִגְרַע מִמֶּנּוּ
  choice: न उसमें से कुछ घटाना
  rationale: גרע के घटाने या कम करने के अर्थ और निषेधात्मक बल को सीधे बनाए रखता है।
- source_word: אָנֹכִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम से व्यक्त वक्ता को हिन्दी में सामान्य, किंतु स्पष्ट रूप से रखा गया है; अनावश्यक ‘मैं स्वयं’ नहीं जोड़ा गया।
theological_decisions:
- issue: ‘वचन’ का सामूहिक एकवचन और आज्ञाओं का समग्र आशय
  choice: ‘जो कुछ … उस सबका’
  alternative: ‘हर एक वचन’ अथवा ‘सारे वचन’
  rationale: इब्रानी דָּבָר एकवचन है, पर כָּל के साथ समग्र निर्देश को सूचित करता है। चुना हुआ रूप संख्या को कृत्रिम ढंग से उभारने के बजाय पूरे आदेश के भाव को सुरक्षित रखता है।
- issue: पद-संख्या और आगे के अनुच्छेद से संबंध
  choice: इस पद को अपने आप में पूर्ण निर्देश के रूप में अनूदित किया गया है
  alternative: इसे अगले पद की झूठे भविष्यवक्ता संबंधी सामग्री के साथ मिला देना
  rationale: मसोरेटिक पाठ में यह पूर्ण निषेधाज्ञा है; अलग पद-संख्या की परंपरा की सूचना केवल पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘आज्ञा दे रहा हूँ’ वर्तमान निर्देश का भाव देता है; ‘पालन करने में सावधानी रखना’ सतर्क आज्ञाकारिता व्यक्त करता है। मुख्य पाठ में अनावश्यक तकनीकी शब्दावली से बचा गया है।
