  text: כִּ֤י הָרֹג֙ תַּֽהַרְגֶ֔/נּוּ יָֽדְ/ךָ֛ תִּֽהְיֶה בּ֥/וֹ בָ/רִֽאשׁוֹנָ֖ה לַ/הֲמִית֑/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/010.yaml
  text: For you must surely put him to death; your hand shall be first against him to put him to death[a], and afterward the hand of all the people.
translation:
  language: hi
  text: क्योंकि तुम उसे निश्चय ही मार डालना[a]; उसे मार डालने में सबसे पहले तुम्हारा हाथ उसके विरुद्ध हो, और बाद में सब लोगों का हाथ भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम उसे अवश्य मार डालना।” इब्रानी में जोर देने के लिए infinitive absolute के साथ finite verb का प्रयोग हुआ है।
    reason: इब्रानी के जोरदार क्रिया-प्रयोग का वैकल्पिक अनुवाद और व्याकरणिक स्पष्टीकरण।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय पिछले आदेश का आधार या कारण प्रस्तुत करता है और पद का तार्किक संबंध बनाए रखता है।
- source_word: הָרֹג תַּהַרְגֶנּוּ
  choice: तुम उसे निश्चय ही मार डालना
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute आदेश की प्रबलता और निश्चितता व्यक्त करता है; यह हिन्दी प्रयोग उस बल को स्वाभाविक ढंग से बनाए रखता है।
- source_word: יָדְךָ
  choice: तुम्हारा हाथ
  rationale: मूल पाठ की ठोस कानूनी छवि और आगे आने वाले 'सब लोगों का हाथ' के समानांतर को सुरक्षित रखता है।
- source_word: תִּהְיֶה בּוֹ בָרִאשׁוֹנָה
  choice: सबसे पहले तुम्हारा हाथ उस पर उठे
  rationale: दण्ड लागू करने में पहले भाग लेने का भाव स्वाभाविक हिन्दी में व्यक्त होता है, जबकि 'हाथ' की मूल छवि भी बनी रहती है।
- source_word: לַהֲמִיתוֹ
  choice: उसे मार डालने के लिए
  rationale: מות के हिफ़ील रूप का अर्थ किसी को मृत्यु देना है; प्रसंग में यह न्यायिक मृत्युदण्ड को स्पष्ट रूप से व्यक्त करता है।
- source_word: וְיַד כָּל הָעָם בָּאַחֲרֹנָה
  choice: और उसके बाद सब लोगों का हाथ
  rationale: '''तुम्हारा हाथ'' के साथ मूल समानांतर संरचना और सामुदायिक सहभागिता दोनों सुरक्षित रहते हैं।'
theological_decisions:
- issue: न्यायिक मृत्युदण्ड की भाषा को न नरम करना, न अनावश्यक रूप से कठोर बनाना
  choice: मार डालना
  alternative: मृत्युदण्ड देना
  rationale: '''मार डालना'' मूल की सीधी क्रियात्मक भाषा और उसके प्रबल आदेश को बनाए रखता है; व्यापक प्रसंग इसे न्यायिक कार्यवाही के रूप में निर्धारित करता है।'
- issue: आरोप लगाने वाले व्यक्ति की पहली सहभागिता
  choice: सबसे पहले तुम्हारा हाथ उस पर उठे
  alternative: उसे मारने में तुम पहले हो
  rationale: यह मूल पाठ के 'हाथ' रूपक और कार्यवाही के क्रम दोनों को सुरक्षित रखता है, बिना निष्पादन की विधि को इस पद में स्पष्ट रूप से जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। 'हाथ' की पुनरावृत्ति मूल इब्रानी के कानूनी चित्र और समानांतरता को बनाए रखती है।
