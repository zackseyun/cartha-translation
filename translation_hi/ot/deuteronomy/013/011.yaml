language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/סְקַלְתּ֥/וֹ בָ/אֲבָנִ֖ים וָ/מֵ֑ת כִּ֣י בִקֵּ֗שׁ לְ/הַדִּֽיחֲ/ךָ֙ מֵ/עַל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/011.yaml
  text: You shall stone him with stones[a], and he shall die, because he sought to drive you away from Yahweh your God, who brought you out from the land of Egypt[b], out of the house of slavery.
translation:
  language: hi
  text: तुम उसे पत्थरों से मार डालना, क्योंकि उसने तुम्हें तुम्हारे परमेश्वर यहोवा से दूर करने की कोशिश की—उसी यहोवा से, जो तुम्हें मिस्र देश से, दासता के घर से निकाल लाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दासता का घर” मिस्र में इस्राएल की गुलामी और वहाँ से उसके छुटकारे को याद दिलाने वाला वाचा-संबंधी कथन है।
    reason: cultural_note
lexical_decisions:
- source_word: וּסְקַלְתּוֹ בָאֲבָנִים וָמֵת
  choice: तुम उसे पत्थरों से मार डालना
  rationale: इब्रानी में शाब्दिक क्रम ‘उसे पत्थरों से मारना, और वह मर जाए’ है। स्वाभाविक आधुनिक हिन्दी में ‘पत्थरों से मार डालना’ साधन, न्यायिक आदेश और मृत्यु के परिणाम—तीनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: כִּי בִקֵּשׁ
  choice: क्योंकि उसने ... कोशिश की
  rationale: כִּי दण्ड का कारण बताता है और בִקֵּשׁ यहाँ जानबूझकर किए गए प्रयास को सूचित करता है; ‘कोशिश की’ सामान्य हिन्दी में इस भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְהַדִּיחֲךָ מֵעַל
  choice: तुम्हें ... से दूर करने
  rationale: נדח का हिफ़ील रूप किसी को निष्ठा से भटकाने या दूर कर देने का कारण बनने का भाव रखता है। ‘दूर करने’ इसकी शक्ति को बनाए रखता है और अस्पष्टता को किसी एक विशेष तरीके—बहकाना या बलपूर्वक हटाना—तक सीमित नहीं करता।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर यहोवा
  rationale: यहोवा व्यक्तिगत वाचा-नाम को सीधे प्रस्तुत करता है; ‘तुम्हारे परमेश्वर’ मूल के संबंधपरक और वाचागत भाव को बनाए रखता है।
- source_word: הַמּוֹצִיאֲךָ
  choice: जो तुम्हें ... निकाल लाया
  rationale: कर्तृवाचक कृदन्त यहाँ यहोवा की ऐतिहासिक उद्धारकारी क्रिया का वर्णन करता है; हिन्दी में पूर्ण भूतकाल स्वाभाविक है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: यह मूल भौगोलिक अभिव्यक्ति का स्पष्ट और सामान्य हिन्दी रूप है।
- source_word: מִבֵּית עֲבָדִים
  choice: दासता के घर से
  rationale: यह वाचागत सूत्र का निकट अनुवाद है और मिस्र को दास बनाए रखने वाली जगह के रूप में चित्रित करने वाला ‘घर’ रूपक सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार अक्षरों वाला व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के लिए प्रचलित प्रत्यक्ष नाम ‘यहोवा’ उसे किसी उपाधि से बदले बिना सुरक्षित रखता है।
- issue: לְהַדִּיחֲךָ מֵעַל में वाचा से विमुख करने का भाव
  choice: तुम्हें तुम्हारे परमेश्वर यहोवा से दूर करने की कोशिश की
  alternative: तुम्हें यहोवा से भटकाने/बहकाकर दूर करने की कोशिश की
  rationale: यह चयन वाचा-निष्ठा से अलग कराने का अर्थ रखता है, पर क्रिया को केवल छल, प्रलोभन या बल के किसी एक अर्थ तक सीमित नहीं करता।
- issue: दण्ड-वाक्य में मृत्यु के परिणाम की अभिव्यक्ति
  choice: पत्थरों से मार डालना
  alternative: पत्थरों से मारना, और वह मर जाए
  rationale: संक्षिप्त हिन्दी अभिव्यक्ति मूल के न्यायिक आदेश और निश्चित घातक परिणाम दोनों को रखती है, बिना मृत्यु को अलग धार्मिक अवधारणा के रूप में व्याख्यायित किए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी। कानूनी आदेश के लिए ‘मार डालना’ स्पष्ट है; ‘दूर करने की कोशिश’ मूल क्रिया की व्यापकता बनाए रखती है। मुख्य पाठ में फुटनोट चिह्न [a] सम्मिलित है।
