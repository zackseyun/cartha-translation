source:
  edition: WLC
  text: וְ/לֹֽא יִדְבַּ֧ק בְּ/יָדְ/ךָ֛ מְא֖וּמָה מִן הַ/חֵ֑רֶם לְמַעַן֩ יָשׁ֨וּב יְהוָ֜ה מֵ/חֲר֣וֹן אַפּ֗/וֹ וְ/נָֽתַן לְ/ךָ֤ רַחֲמִים֙ וְ/רִֽחַמְ/ךָ֣ וְ/הִרְבֶּ֔/ךָ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/018.yaml
  text: And nothing from what is devoted to destruction shall cling to your hand[a], so that Yahweh may turn from the fierceness of his anger and show you mercy, and have compassion on you, and multiply you[b], just as he swore to your fathers.
translation:
  language: hi
  text: विनाश के लिए समर्पित वस्तुओं में से कुछ भी तेरे हाथ में न रहे[a], जिससे याहवे अपने भड़के हुए क्रोध से फिर जाए[b], तुझे दया प्रदान करे, तुझ पर करुणा करे और तुझे बढ़ाए, जैसा उसने तेरे पितरों को शपथ देकर वचन दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक पारंपरिक रूप में, “समर्पित वस्तुओं में से कुछ भी” या “विनाश के लिए ठहराई गई वस्तुओं में से कुछ भी।” इब्रानी חֵרֶם उस वस्तु को दर्शाता है जो परमेश्वर को अपरिवर्तनीय रूप से समर्पित हो, प्रायः विनाश के लिए।
    reason: lexical_alternative
  - marker: b
    text: शब्दशः, “उसकी नाक की जलन से”; यह तीव्र क्रोध के लिए इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: יִדְבַּק בְּיָדְךָ
  choice: तेरे हाथ में लगा न रहे
  rationale: דבק के चिपकने या लगे रहने के ठोस बिंब को रखते हुए यह इब्रानी मुहावरे में किसी वस्तु को अपने अधिकार में बनाए रखने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְאוּמָה מִן הַחֵרֶם
  choice: विनाश के लिए अर्पित की गई किसी भी वस्तु में से कुछ भी
  rationale: नकार के साथ מְאוּמָה पूर्ण निषेध व्यक्त करता है। חֵרֶם ऐसी वस्तु है जो परमेश्वर को अपरिवर्तनीय रूप से समर्पित हो और इस प्रसंग में नाश के लिए ठहराई गई हो; चुना हुआ रूप आधुनिक पाठक के लिए इसे स्पष्ट करता है।
- source_word: יָשׁוּב ... מֵחֲרוֹן אַפּוֹ
  choice: अपने भड़के हुए क्रोध से फिर जाए
  rationale: שׁוב מן का अर्थ किसी दशा से फिरना है। חֲרוֹן אַף तीव्र, जलते हुए क्रोध का मुहावरा है; 'भड़का हुआ क्रोध' उसके बल को बनाए रखता है।
- source_word: וְנָתַן לְךָ רַחֲמִים
  choice: तुझे दया प्रदान करे
  rationale: נתן के मूल 'देना/प्रदान करना' भाव और רַחֲמִים के दया अथवा अनुकम्पा के अर्थ को बनाए रखता है, साथ ही अगले समानार्थी क्रियापद से भेद भी रहने देता है।
- source_word: וְרִחַמְךָ
  choice: तुझ पर करुणा करे
  rationale: רחם का क्रियात्मक अर्थ करुणा करना है। यह पिछली संज्ञा 'दया' के साथ इब्रानी की निकट-समानार्थी तीव्रता को बनाए रखता है।
- source_word: וְהִרְבֶּךָ
  choice: तुझे बढ़ाए
  rationale: רבה का हिफ़ील रूप संख्या में बढ़ाने का अर्थ देता है। 'तुझे बढ़ाए' पितरों से की गई वाचा की प्रतिज्ञा की प्रतिध्वनि बनाए रखते हुए स्वाभाविक है।
- source_word: כַּאֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: जैसा उसने तेरे पितरों से शपथ खाई थी
  rationale: אבות यहाँ वाचा से जुड़े पुरुष पितरों को सूचित करता है; 'पितरों' से वह विशिष्टता बनी रहती है और शपथ का पारंपरिक, गरिमापूर्ण मुहावरा भी स्वाभाविक रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है; उसका लिप्यंतरण उपाधि से प्रतिस्थापित किए बिना स्रोत की विशिष्टता बनाए रखता है।
- issue: חֵרֶם का वाचागत और युद्ध-संदर्भित अर्थ
  choice: विनाश के लिए अर्पित की गई वस्तु
  alternative: बहिष्कृत वस्तु / नाश की भेंट / प्रतिबंध के अधीन वस्तु
  rationale: यह शब्द परमेश्वर को अपरिवर्तनीय रूप से समर्पित वस्तु को सूचित करता है, जो इस प्रसंग में विनाश के लिए है। चुना हुआ रूप न तो अवधारणा को अस्पष्ट बनाता है, न उससे अधिक कोई साम्प्रदायिक व्याख्या जोड़ता है।
- issue: ईश्वरीय क्रोध की देहात्मक इब्रानी अभिव्यक्ति
  choice: अपने भड़के हुए क्रोध से फिर जाए
  alternative: अपनी नाक की जलन से फिर जाए
  rationale: मूल मुहावरे का आशय तीव्र क्रोध है। हिन्दी में उसके भाव और व्यक्तिगत-वाचागत बल को सुरक्षित रखा गया है, जबकि अनुपयुक्त शब्दशः देहात्मकता से बचा गया है।
- issue: אֲבֹתֶיךָ की लिंग-विशिष्टता
  choice: तेरे पितरों
  alternative: तेरे पूर्वजों
  rationale: यहाँ संकेत वाचा की प्रतिज्ञा पाने वाले पितरों की ओर है; इसलिए सामान्य 'पूर्वजों' के बजाय स्रोत की पुरुष-वाचक विशिष्टता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। पद के एकवचन संबोधन के अनुरूप ‘तेरे/तुझे/तुझ’ का लगातार प्रयोग हुआ है। ‘पितरों’ और ‘शपथ खाई’ से वाचा-संबंधी गंभीरता बनी रहती है; कठिन חֵרֶם पद को मुख्य पाठ में स्पष्ट और पादटिप्पणी में अधिक शाब्दिक विकल्पों सहित प्रस्तुत किया गया है।
