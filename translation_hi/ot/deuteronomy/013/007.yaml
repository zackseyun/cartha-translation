source:
  edition: WLC
  text: כִּ֣י יְסִֽיתְ/ךָ֡ אָחִ֣י/ךָ בֶן אִ֠מֶּ/ךָ אֽוֹ בִנְ/ךָ֨ אֽוֹ בִתְּ/ךָ֜ א֣וֹ אֵ֣שֶׁת חֵיקֶ֗/ךָ א֧וֹ רֵֽעֲ/ךָ֛ אֲשֶׁ֥ר כְּ/נַפְשְׁ/ךָ֖ בַּ/סֵּ֣תֶר לֵ/אמֹ֑ר נֵֽלְכָ֗ה וְ/נַֽעַבְדָה֙ אֱלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתָּ אַתָּ֖ה וַ/אֲבֹתֶֽי/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/007.yaml
  text: If your brother[a], the son of your mother, or your son or your daughter, or the wife of your embrace, or your friend who is like your own soul, secretly entices you, saying[b], ‘Let us go and serve other gods’—gods that neither you nor your fathers have known—
translation:
  language: hi
  text: यदि तुम्हारा भाई—तुम्हारी माँ का बेटा—या तुम्हारा बेटा या बेटी, या तुम्हारी बाँहों में रहने वाली पत्नी[a], या तुम्हारा वह मित्र जो तुम्हें अपने प्राण के समान प्रिय है[b], गुप्त रूप से तुम्हें यह कहकर बहकाए, ‘चलो, हम दूसरे देवताओं की सेवा करें’—जिन्हें न तुमने जाना, न तुम्हारे पूर्वजों ने—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारी छाती/गोद की पत्नी”; यह अत्यंत घनिष्ठ पत्नी के लिए इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तुम्हारा मित्र जो तुम्हारे प्राण के समान है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסִיתְךָ
  choice: तुम्हें बहकाए
  rationale: हिफ़ील रूप किसी को किसी काम की ओर फुसलाने, उकसाने या बहकाने का अर्थ देता है। यहाँ नकारात्मक धार्मिक प्रसंग में ‘बहकाए’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: אָחִיךָ בֶן אִמֶּךָ
  choice: तुम्हारा भाई—तुम्हारी माँ का बेटा
  rationale: इब्रानी समानाधिकरण को बनाए रखकर निकट रक्त-संबंध पर दिया गया बल सुरक्षित रखा गया है।
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: तुम्हारी अंकशायिनी पत्नी
  rationale: חֵיק का मूल बिंब गोद, छाती या घनिष्ठ आलिंगन का है। ‘अंकशायिनी पत्नी’ इस अंतरंग वैवाहिक मुहावरे को संक्षिप्त और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ
  choice: तुम्हारा वह मित्र जो तुम्हें अपने प्राण के समान प्रिय है
  rationale: נֶפֶשׁ यहाँ गहरे निजी लगाव को व्यक्त करता है। हिन्दी में ‘अपने प्राण के समान प्रिय’ निकटता की तीव्रता को स्वाभाविक रूप से व्यक्त करता है, जबकि शाब्दिक विकल्प की सूचना पादटिप्पणी में दी गई है।
- source_word: בַּסֵּתֶר
  choice: तुमसे छिपकर
  rationale: इसका अर्थ ‘गुप्त रूप से’ है। ‘तुमसे छिपकर’ निजी और गुप्त ढंग से किए गए प्रलोभन को सहज हिन्दी में व्यक्त करता है।
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: चलो, हम ... सेवा करें
  rationale: दोनों cohortative रूप सम्मिलित होने का आग्रह व्यक्त करते हैं। अनुवाद गति और धार्मिक सेवा, दोनों भावों को बनाए रखता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: אֲחֵרִים का सीधा अर्थ ‘दूसरे’ है; ‘पराए’ या ‘विदेशी’ स्रोत से अधिक व्याख्यात्मक होते।
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: जिन्हें न तुमने जाना, न तुम्हारे पुरखाओं ने
  rationale: ‘जानना’ धार्मिक या संबंधपरक परिचय की स्रोतगत व्यापकता बनाए रखता है। ‘न...न...’ हिन्दी में दोनों कर्ताओं पर निषेध स्पष्ट करता है।
theological_decisions:
- issue: निकट संबंधों के मुहावरों की तीव्रता
  choice: माँ का बेटा, अंकशायिनी पत्नी, और प्राण के समान प्रिय मित्र जैसे स्रोतगत बिंबों को बनाए रखा गया।
  alternative: सगा भाई, प्रिय पत्नी, और सबसे घनिष्ठ मित्र जैसे अधिक सामान्य पद।
  rationale: पद का प्रभाव इस बात पर निर्भर है कि बहकाने वाला अत्यंत निकट संबंधी भी हो सकता है; सामान्यीकरण इस अलंकारिक और नैतिक तनाव को कम कर देता।
- issue: עבד का देवताओं के संबंध में अर्थ
  choice: सेवा करें
  alternative: आराधना करें
  rationale: עבד में आराधना सम्मिलित हो सकती है, पर इसका अर्थ धार्मिक सेवा से अधिक व्यापक है। ‘सेवा’ स्रोत की अर्थ-सीमा को अनावश्यक रूप से संकीर्ण नहीं करती।
- issue: אֱלֹהִים के लिए हिन्दी पद
  choice: देवताओं
  alternative: ईश्वरों
  rationale: बहुवचन में ‘दूसरे देवता’ आधुनिक हिन्दी में स्वाभाविक है और इस्राएल से बाहर पूजे जाने वाले कथित देवताओं के लिए स्रोत के सामान्य पद को बनाए रखता है; यह उनके वास्तविक दैवी अस्तित्व पर कोई अतिरिक्त निर्णय नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-अनुकूल रूप। निकट संबंधों की क्रमिक सूची और पद के अंत का अधूरा वाक्य-विन्यास बनाए रखा गया है, क्योंकि विचार अगले पद में पूरा होता है। ‘अंकशायिनी’ अपेक्षाकृत साहित्यिक है, इसलिए अर्थ स्पष्ट करने हेतु पादटिप्पणी दी गई है।
