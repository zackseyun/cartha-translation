source:
  edition: WLC
  text: אַחֲרֵ֨י יְהוָ֧ה אֱלֹהֵי/כֶ֛ם תֵּלֵ֖כוּ וְ/אֹת֣/וֹ תִירָ֑אוּ וְ/אֶת מִצְוֺתָ֤י/ו תִּשְׁמֹ֨רוּ֙ וּ/בְ/קֹל֣/וֹ תִשְׁמָ֔עוּ וְ/אֹת֥/וֹ תַעֲבֹ֖דוּ וּ/ב֥/וֹ תִדְבָּקֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/005.yaml
  text: You shall walk after Yahweh your God and fear him[a], and keep his commandments and listen to his voice, and serve him[c][b], and cling to him.
translation:
  language: hi
  text: तुम अपने परमेश्वर याहवे के पीछे चलो,[a] उसका भय मानो, उसकी आज्ञाओं का पालन करो, उसकी वाणी सुनो,[b] उसकी सेवा करो और उससे लिपटे रहो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने परमेश्वर याहवे का अनुसरण करो।’ इब्रानी में शाब्दिक रूप से, ‘अपने परमेश्वर याहवे के पीछे चलो।’
    reason: इब्रानी मुहावरे का शाब्दिक रूप और स्वाभाविक वैकल्पिक अनुवाद
  - marker: b
    text: ‘उसकी वाणी सुनो’ में उसकी बात मानने या उसकी आज्ञा का पालन करने का भाव भी हो सकता है।
    reason: शाब्दिक अभिव्यक्ति में निहित अर्थ
  - marker: c
    text: या, ‘उससे दृढ़ता से जुड़े रहो।’
    reason: शब्दार्थ का वैकल्पिक रूप
lexical_decisions:
- source_word: אַחֲרֵי יְהוָה אֱלֹהֵיכֶם תֵּלֵכוּ
  choice: अपने परमेश्वर यहोवा के पीछे चलना
  rationale: इब्रानी मुहावरे ‘के पीछे चलना’ को बनाए रखता है; इसका भाव निष्ठापूर्वक अनुसरण करना है। आज्ञात्मक क्रम को स्वाभाविक हिन्दी में क्रियार्थक रूपों से व्यक्त किया गया है।
- source_word: תִירָאוּ
  choice: भय मानना
  rationale: परमेश्वर के प्रति भय, श्रद्धा और विस्मय के वाचा-संबंधी भार को बिना केवल ‘आदर’ तक सीमित किए व्यक्त करता है।
- source_word: מִצְוֺתָיו תִּשְׁמֹרוּ
  choice: उसकी आज्ञाओं का पालन करना
  rationale: שׁמר का मूल भाव संभालकर रखना है, पर आज्ञाओं के साथ आधुनिक हिन्दी में ‘पालन करना’ स्पष्ट और स्वाभाविक है।
- source_word: וּבְקֹלוֹ תִשְׁמָעוּ
  choice: उसकी वाणी सुनना
  rationale: स्रोत की अभिव्यक्ति ‘उसकी वाणी सुनना’ को सुरक्षित रखता है, जबकि प्रसंग में निहित आज्ञापालन का भाव खुला रहता है।
- source_word: תַעֲבֹדוּ
  choice: उसकी सेवा करना
  rationale: עבד के व्यापक अर्थ को रखता है, जिसमें उपासना और वाचा-संबंधी सेवा दोनों सम्मिलित हो सकते हैं।
- source_word: תִדְבָּקוּן
  choice: उसी से लिपटे रहना
  rationale: דבק की घनिष्ठ लगाव और दृढ़ निष्ठा की सजीव छवि को आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित रूप से परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदले बिना प्रस्तुत करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: दोनों रूप चतुरक्षरीय नाम को व्यक्त करते हैं; ‘यहोवा’ सामान्य हिन्दी पाठक के लिए अधिक परिचित है और नाम को ‘प्रभु’ जैसे पद से प्रतिस्थापित नहीं करता।
- issue: שׁמע בְּקוֹל में सुनने और आज्ञा मानने का संबंध
  choice: उसकी वाणी सुनना
  alternative: उसकी वाणी मानना / उसकी आज्ञा मानना
  rationale: मुख्य पाठ स्रोत की श्रवण-छवि को बनाए रखता है; आज्ञापालन का निहित भाव पादटिप्पणी में बताया गया है, ताकि अर्थ को अनावश्यक रूप से एक ही व्याख्या तक सीमित न किया जाए।
- issue: עבד का सेवा अथवा उपासना अर्थ
  choice: सेवा करना
  alternative: उपासना करना
  rationale: ‘सेवा’ मूल शब्द के व्यापक क्षेत्र को सुरक्षित रखती है; केवल ‘उपासना’ कहने से उसका वाचा-संबंधी आज्ञाकारिता का पक्ष संकरा हो सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर क्रियाओं की लय बनाए रखने के लिए ‘चलना… मानना… पालन करना… सुनना… सेवा करना… लिपटे रहना’ का क्रम अपनाया गया है।
