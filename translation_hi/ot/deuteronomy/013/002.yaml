  yaml_path: translation/ot/deuteronomy/013/002.yaml
  text: If a prophet or a dreamer of dreams arises among you and gives you a sign or a wonder,[a]
translation:
  language: hi
  text: यदि तुम्हारे बीच कोई भविष्यद्वक्ता या स्वप्न देखनेवाला उठ खड़ा हो और तुम्हें कोई चिन्ह या अद्भुत घटना दिखाए,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कोई चिन्ह या शकुन दिखाए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यहाँ कानूनी प्रसंग में यह शब्द एक संभावित स्थिति की शर्त आरम्भ करता है, इसलिए ‘यदि’ उपयुक्त है।
- source_word: יָקוּם
  choice: उठ खड़ा हो
  rationale: यह समुदाय के भीतर ऐसे व्यक्ति के सामने आने या उभरने को व्यक्त करता है और मूल क्रिया की छवि भी बनाए रखता है।
- source_word: בְּקִרְבְּךָ
  choice: तुम्हारे बीच
  rationale: यह समुदाय के मध्य या भीतर होने का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: נָבִיא
  choice: भविष्यद्वक्ता
  rationale: यह נָבִיא का मानक, व्यापक रूप से समझा जाने वाला हिन्दी अनुवाद है।
- source_word: חֹלֵם חֲלוֹם
  choice: स्वप्न देखनेवाला
  rationale: हिब्रू के कृदंत और सजातीय संज्ञा वाले मुहावरे का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे भविष्यद्वक्ता के समान ठहराए।
- source_word: וְנָתַן אֵלֶיךָ
  choice: और तुम्हें ... बताए
  rationale: सशर्त क्रम में यह आगामी क्रिया व्यक्त करता है। चिन्ह या अद्भुत घटना के विषय में प्रस्ताव या घोषणा के भाव को ‘बताए’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אוֹת
  choice: चिन्ह
  rationale: यह प्रमाण या पुष्टि देने वाले संकेत का मानक अनुवाद है।
- source_word: מוֹפֵת
  choice: अद्भुत घटना
  rationale: यह किसी विस्मयकारी घटना या शकुनसूचक चमत्कार का भाव देता है, पर उसकी वास्तविक अलौकिकता पहले से तय नहीं करता।
theological_decisions:
- issue: भविष्यद्वक्ता या स्वप्न देखनेवाले द्वारा दिए गए चिन्ह की प्रकृति
  choice: ‘चिन्ह या अद्भुत घटना’ कहकर घटना की वास्तविकता और स्रोत को अनिर्णीत रखा गया है।
  alternative: ‘चमत्कारी चिन्ह’ या ‘चिन्ह अथवा शकुन’
  rationale: पद स्वयं यह निर्धारित नहीं करता कि घटना सचमुच अलौकिक है, छलपूर्ण है, या केवल दावा की गई है; इसलिए अनुवाद इस धार्मिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल और गरिमापूर्ण रूप अपनाया गया है। एकवचन सम्बोधन का सामुदायिक अर्थ ‘तुम्हारे बीच’ और ‘तुम्हें’ से स्वाभाविक ढंग से व्यक्त हुआ है।
