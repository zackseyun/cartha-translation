base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/012.yaml
  text: And all Israel shall hear and fear[a], and they shall not again do this evil thing in your midst.
translation:
  language: hi
  text: और सारा इस्राएल सुनेगा और डरेगा, और फिर तेरे बीच[a] ऐसा बुरा काम नहीं करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे बीच।” इब्रानी में इस्राएल को एक सामूहिक इकाई मानकर एकवचन में संबोधित किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: और सारा इस्राएल
  rationale: כָּל के साथ ‘इस्राएल’ पूरी वाचा-प्रजा को सामूहिक रूप से दर्शाता है; ‘सारा इस्राएल’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יִשְׁמְעוּ וְיִרָאוּן
  choice: सुनेगा और डरेगा
  rationale: दोनों क्रियाएँ कानूनी प्रसंग में भावी परिणाम और दंड से उत्पन्न भय को व्यक्त करती हैं। हिन्दी में ‘सारा इस्राएल’ को एक सामूहिक इकाई मानकर एकवचन क्रियाएँ स्वाभाविक हैं।
- source_word: וְלֹא יוֹסִפוּ לַעֲשׂוֹת
  choice: और फिर ... नहीं करेगा
  rationale: יסף के हिफ़ील रूप के साथ क्रियार्थक संज्ञा यहाँ किसी काम को दोबारा न करने का अर्थ देती है; ‘फिर ... नहीं करेगा’ इस इब्रानी मुहावरे का सहज हिन्दी रूप है।
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: ऐसा बुरा काम
  rationale: דָּבָר यहाँ पहले बताए गए दुष्कर्म को सूचित करता है। ‘ऐसा बुरा काम’ हिन्दी में प्रसंग-सापेक्ष और स्वाभाविक है।
- source_word: בְּקִרְבֶּךָ
  choice: तेरे बीच
  rationale: इब्रानी प्रत्यय पुल्लिंग एकवचन है और इस्राएल को एक सामूहिक इकाई के रूप में संबोधित करता है; ‘तेरे बीच’ उस रूप को सुरक्षित रखता है।
theological_decisions:
- issue: वाचा-समुदाय के लिए अंतिम एकवचन संबोधन
  choice: तेरे बीच
  alternative: तुम्हारे बीच
  rationale: व्यवस्थाविवरण में इस्राएल को एक प्रजा मानकर एकवचन में संबोधित करना सामान्य है। मूल पाठ के इस सामूहिक एकवचन को बनाए रखा गया है, जबकि विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। कानूनी चेतावनी का स्वर बना रहता है, पर अप्रचलित या अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
