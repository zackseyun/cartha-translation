  text: וְ/אֶת כָּל שְׁלָלָ֗/הּ תִּקְבֹּץ֮ אֶל תּ֣וֹךְ רְחֹבָ/הּ֒ וְ/שָׂרַפְתָּ֨ בָ/אֵ֜שׁ אֶת הָ/עִ֤יר וְ/אֶת כָּל שְׁלָלָ/הּ֙ כָּלִ֔יל לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ וְ/הָיְתָה֙ תֵּ֣ל עוֹלָ֔ם לֹ֥א תִבָּנֶ֖ה עֽוֹד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/017.yaml
  text: You shall gather all its spoil into the middle of its open square[a], and you shall burn the city and all its spoil with fire as a whole offering to Yahweh your God. It shall remain a perpetual ruin mound[b]; it shall not be rebuilt again.
translation:
  language: hi
  text: तुम उसकी सारी लूट उसके खुले चौक के बीच इकट्ठा कर लेना। फिर उस नगर और उसकी सारी लूट को अपने परमेश्वर यहोवा के लिए पूर्ण अर्पण के रूप में आग में जला देना[a]। वह सदा के लिए खंडहरों का टीला बना रहेगा[b]; उसे फिर कभी नहीं बसाया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने परमेश्वर यहोवा के लिए पूरी तरह आग में जला देना।” इब्रानी शब्द का अर्थ ‘पूरी तरह’ भी हो सकता है और परमेश्वर को पूर्णतः अर्पित करके भस्म करने का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “सदा का टीला,” अर्थात खंडहरों का स्थायी ढेर।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלָלָהּ
  choice: उसकी लूट का सारा माल
  rationale: שָׁלָל युद्ध में लूटे गए माल को दर्शाता है। ‘लूट का माल’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: תִּקְבֹּץ
  choice: इकट्ठा करना
  rationale: कानूनी निर्देश के प्रसंग में हिन्दी का निर्देशात्मक क्रियारूप मूल के आदेशात्मक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל תּוֹךְ רְחֹבָהּ
  choice: उसके खुले चौक के बीच में
  rationale: רְחוֹב नगर के चौड़े सार्वजनिक खुले स्थान को सूचित करता है; इसलिए केवल ‘सड़क’ की अपेक्षा ‘खुला चौक’ अधिक सटीक है।
- source_word: וְשָׂרַפְתָּ בָאֵשׁ
  choice: आग में जला देना
  rationale: यह अभिव्यक्ति आग द्वारा पूर्ण विनाश का सीधा निर्देश देती है और हिन्दी में सहज है।
- source_word: כָּלִיל
  choice: सम्पूर्ण अर्पण के रूप में
  rationale: यह शब्द ‘पूरी तरह’ का क्रियाविशेषणात्मक अर्थ रख सकता है, पर לַיהוָה के साथ इसमें परमेश्वर को पूर्णतः समर्पित करके भस्म करने का धार्मिक भाव भी है। मुख्य पाठ उस भाव को बनाए रखता है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל समर्पण को और יהוה परमेश्वर के व्यक्तिगत नाम को सूचित करता है; ‘यहोवा के लिए’ दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: תֵּל עוֹלָם
  choice: सदा के लिए खंडहरों का टीला
  rationale: תֵּל मिट्टी या खंडहरों के ढेर/टीले की ठोस छवि देता है और עוֹלָם उसकी स्थायी दशा बताता है।
- source_word: לֹא תִבָּנֶה עוֹד
  choice: उस नगर को फिर कभी न बनाया जाए
  rationale: निफ़अल रूप पुनर्निर्माण के निषेध या अपेक्षित स्थायी परिणाम को व्यक्त करता है; यह हिन्दी रूप उस कानूनी निषेध को बनाए रखता है।
theological_decisions:
- issue: כָּלִיל का धार्मिक अथवा क्रियाविशेषणात्मक अर्थ
  choice: ‘सम्पूर्ण अर्पण के रूप में’—विनाश को यहोवा के लिए पूर्ण समर्पण के रूप में व्यक्त किया गया है।
  alternative: ‘यहोवा अपने परमेश्वर के लिए पूरी तरह आग में जला देना।’
  rationale: כָּלִיל में पूर्णता और धार्मिक समर्पण दोनों की सम्भावना है। मुख्य पाठ धार्मिक अनुगूँज को रखता है, पर इसे तकनीकी पशु-बलि का नाम नहीं बनाता; पादटिप्पणी वास्तविक वैकल्पिक अर्थ सुरक्षित रखती है।
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है। हिन्दी पाठ में ‘यहोवा’ उस नाम को प्रत्यक्ष रखता है और ‘अपने परमेश्वर’ के साथ स्वाभाविक रूप से जुड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रूप रखा गया है। ‘लूट का माल,’ ‘खुला चौक’ और ‘खंडहरों का टीला’ ठोस मूल चित्रों को बनाए रखते हैं। आदेशों के लिए ‘इकट्ठा करना’ और ‘जला देना’ का स्वाभाविक निर्देशात्मक ढाँचा अपनाया गया है।
