id: DEU.13.14
reference: Deuteronomy 13:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יָצְא֞וּ אֲנָשִׁ֤ים בְּנֵֽי בְלִיַּ֨עַל֙ מִ/קִּרְבֶּ֔/ךָ וַ/יַּדִּ֛יחוּ אֶת יֹשְׁבֵ֥י עִירָ֖/ם לֵ/אמֹ֑ר נֵלְכָ֗ה וְ/נַעַבְדָ֛ה אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹא יְדַעְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/014.yaml
  text: Certain worthless men have gone out from among you and have led the inhabitants of their city astray[a], saying, ‘Let us go and serve other gods,’ which you have not known.
translation:
  language: hi
  text: तुम्हारे बीच से कुछ निकम्मे आदमी[a] निकल आए हैं और उन्होंने अपने नगर के निवासियों को यह कहकर भटका दिया है, ‘आओ, हम जाकर दूसरे देवताओं की सेवा करें,’ जिन्हें तुम नहीं जानते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से ‘निकम्मेपन के पुत्र’; परंपरागत अनुवाद: ‘बेलियाल के पुत्र।’'
    reason: मूल मुहावरे का शाब्दिक रूप और परंपरागत विकल्प सुरक्षित रखना, साथ ही मुख्य पाठ में बाद की व्यक्तिवाचक व्याख्या आरोपित न करना।
lexical_decisions:
- source_word: יָצְאוּ
  choice: निकल आए हैं
  rationale: काल-संदर्भ में यह किसी सुनी हुई सूचना की विषयवस्तु है; हिन्दी में पूर्ण वर्तमान इस उभरकर सामने आने की घटना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: निकम्मे लोग
  rationale: पूरा पद नैतिक रूप से भ्रष्ट और समाज-विरोधी पुरुषों के लिए एक इब्रानी मुहावरा है। ‘लोग’ हिन्दी में स्वाभाविक है और संदर्भ में समूह को स्पष्ट करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: מִקִּרְבְּךָ
  choice: तुम्हारे बीच से
  rationale: यह उनके वाचा-समुदाय के भीतर से निकलने पर बल देता है।
- source_word: וַיַּדִּיחוּ
  choice: भटका दिया है
  rationale: हिफ़ील रूप दूसरों को सही निष्ठा से दूर करके धर्मत्याग की ओर ले जाने का कारण बनना व्यक्त करता है।
- source_word: יֹשְׁבֵי עִירָם
  choice: अपने नगर के निवासियों
  rationale: עִירָם का अर्थ ‘उनका नगर’ है; हिन्दी में कर्ता से संबंध दिखाने के लिए ‘अपने नगर’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: לֵאמֹר
  choice: यह कहकर
  rationale: यह आगे आने वाले प्रत्यक्ष कथन का परिचय देता है और भटकाने के साधन को भी सहज हिन्दी में जोड़ता है।
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: आओ, हम जाकर ... सेवा करें
  rationale: दोनों cohortative रूप सामूहिक आग्रह व्यक्त करते हैं। ‘सेवा करें’ עבד के व्यापक धार्मिक और वाचागत अर्थ को बनाए रखता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह व्यवस्थाविवरण में प्रयुक्त मानक पद का सीधा और स्वाभाविक अनुवाद है।
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: जिन्हें तुम नहीं जानते
  rationale: ‘जानते’ मूल ידע को बनाए रखता है, जिसमें केवल जानकारी नहीं बल्कि पहचानी हुई या संबंधगत परिचितता भी निहित हो सकती है; हिन्दी संबंधवाचक ‘जिन्हें’ देवताओं को व्यक्तिवाचक आराध्य के रूप में स्वाभाविक ढंग से संदर्भित करता है।
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל का अर्थ
  choice: निकम्मे लोग
  alternative: बेलियाल के पुत्र / दुष्ट लोग
  rationale: यहाँ यह नैतिक रूप से भ्रष्ट या कानून-विरोधी व्यक्तियों के लिए मुहावरा है, किसी दुष्ट अलौकिक सत्ता के नाम का आवश्यक उल्लेख नहीं। इसलिए बाद की ‘बेलियाल’ संबंधी धारणाएँ पाठ में नहीं जोड़ी गईं।
- issue: אֲשֶׁר לֹא יְדַעְתֶּם में ‘जानना’
  choice: जिन्हें तुम नहीं जानते
  alternative: जिनसे तुम परिचित नहीं हो
  rationale: सीधा अनुवाद मूल की अर्थगत व्यापकता और संभावित वाचागत तनाव बनाए रखता है; इसे केवल बौद्धिक जानकारी या औपचारिक संबंध तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। सामूहिक आग्रह के लिए ‘आओ, हम...’ और धार्मिक עבד के लिए ‘सेवा करें’ रखा गया है। सर्वनामों में मूल के बहुवचन को हिन्दी के स्वाभाविक ‘तुम’ से व्यक्त किया गया है।
