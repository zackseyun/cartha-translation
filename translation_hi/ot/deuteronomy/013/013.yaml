base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/013.yaml
  text: If you hear it said in one of your cities that Yahweh your God is giving you to dwell there[a], saying[b],
translation:
  language: hi
  text: यदि[a] तुम्हें तुम्हारे किसी नगर के बारे में—जिसे याहवे, तुम्हारा परमेश्वर, तुम्हें वहाँ बसने के लिए दे रहा है[b]—यह सुनने में आए कि,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब”; कानूनी प्रसंगों में इब्रानी संयोजक शर्त या समय—दोनों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “वहाँ रहने के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: व्यवस्थाविवरण के इस कानूनी प्रसंग में यह संयोजक एक संभावित स्थिति प्रस्तुत करता है; इसलिए ‘यदि’ उपयुक्त है, यद्यपि ‘जब’ भी संभव है।
- source_word: תִשְׁמַע
  choice: तुम्हें ... सुनने में आए
  rationale: यहाँ क्रिया किसी समाचार या सूचना के मिलने को व्यक्त करती है। यह हिंदी प्रयोग स्वाभाविक है और आगे आने वाली कथन-वस्तु की ओर संकेत करता है।
- source_word: בְּאַחַת עָרֶיךָ
  choice: तुम्हारे किसी नगर में
  rationale: עִיר का अर्थ नगर या बस्ती हो सकता है; ‘नगर’ आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर यहवे
  rationale: संबंधसूचक पदबंध का सीधा संबोधन सुरक्षित रखा गया है और יהוה को उपाधि से बदलने के बजाय व्यक्तिगत नाम ‘यहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: נֹתֵן לְךָ
  choice: तुम्हें ... दे रहा है
  rationale: वर्तमान कृदंत परमेश्वर के चल रहे दान को व्यक्त करता है; प्रगतिशील हिंदी रूप उस पक्ष को सुरक्षित रखता है।
- source_word: לָשֶׁבֶת שָׁם
  choice: वहाँ बसने के लिए
  rationale: ישׁב यहाँ उस नगर को दिए जाने का उद्देश्य बताता है। ‘बसने’ में वहाँ निवास स्थापित करने का भाव है; ‘रहने’ भी संभव है।
- source_word: לֵאמֹר
  choice: कि
  rationale: यह पद अगले वचन में आने वाली सूचना की विषय-वस्तु का परिचय देता है। हिंदी में ‘यह सुनने में आए कि’ स्रोत के कथन-सूचक कार्य को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘यहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी अपनाई गई है। लंबे संबंधवाचक उपवाक्य को डैश से अलग किया गया है ताकि वाक्य स्पष्ट रहे। वचन अगले पद में जारी रहता है, इसलिए अंत में ‘कि,’ रखा गया है।
