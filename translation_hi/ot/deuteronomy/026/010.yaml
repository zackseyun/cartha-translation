  text: וְ/עַתָּ֗ה הִנֵּ֤ה הֵבֵ֨אתִי֙ אֶת רֵאשִׁית֙ פְּרִ֣י הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לִּ֖/י יְהוָ֑ה וְ/הִנַּחְתּ֗/וֹ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הִֽשְׁתַּחֲוִ֔יתָ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/010.yaml
  text: And now[a], behold, I have brought the firstfruits of the ground that you, O Yahweh, have given me[b]. Then you shall set it down before Yahweh your God and bow down before Yahweh your God.
translation:
  language: hi
  text: “और अब देखिए, मैं भूमि की उपज का पहला भाग[a] ले आया हूँ, जो हे याहवे, आपने मुझे दी है।” तब तुम उसे अपने परमेश्वर याहवे के सामने रख देना और अपने परमेश्वर याहवे के सामने दंडवत करो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि की पहली उपज” अथवा “भूमि की उपज का प्रथम फल।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया विशेष रूप से शरीर झुकाने या भूमि पर गिरकर प्रणाम करने को दर्शाती है; “आराधना करना” इसका अधिक व्यापक, अर्थ-व्याख्यात्मक अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: यह कथन को पहले किए गए विश्वास-वर्णन से वर्तमान भेंट-अर्पण की क्रिया की ओर जोड़ता है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह प्रस्तुत भेंट की ओर ध्यान खींचने वाला संकेतसूचक शब्द है; आधुनिक हिन्दी में स्वाभाविक रहते हुए इसका बल बनाए रखता है।
- source_word: הֵבֵאתִי
  choice: ले आया हूँ
  rationale: प्रथम पुरुष एकवचन का पूर्ण क्रियारूप भेंट को लाने की पूरी हो चुकी क्रिया बताता है।
- source_word: רֵאשִׁית פְּרִי הָאֲדָמָה
  choice: भूमि की उपज का पहला भाग
  rationale: रֵאשִׁית और פְּרִי के संबंध को स्पष्ट रखता है और कृषि-उपज के आरम्भिक अथवा प्रथम अंश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָאֲדָמָה
  choice: भूमि
  rationale: संदर्भ में खेती की जमीन और उससे निकली उपज अभिप्रेत है; ‘भूमि’ साधारण और गरिमापूर्ण हिन्दी है।
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: जो ... आपने मुझे दी है
  rationale: सापेक्ष उपवाक्य को बनाए रखकर स्वीकार करता है कि उपज याहवे की दी हुई है। परमेश्वर को संबोधित करने के कारण आदरसूचक ‘आपने’ प्रयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: וְהִנַּחְתּוֹ
  choice: तब तुम उसे ... रख देना
  rationale: विधिक संदर्भ में यह क्रियारूप आगे किए जाने वाले निर्देश को व्यक्त करता है; ‘रख देना’ भेंट को सामने रखने की ठोस क्रिया दिखाता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: परमेश्वर की उपस्थिति में भेंट रखने और झुकने, दोनों का सीधा स्थानिक तथा उपासना-संबंधी भाव सुरक्षित रहता है।
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: दंडवत करना
  rationale: यह शब्द शरीर झुकाकर अथवा भूमि पर गिरकर आदर प्रकट करने की क्रिया बताता है; व्यापक अर्थ वाले केवल ‘आराधना करना’ की अपेक्षा शारीरिक भाव को अधिक स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और वाचा-संबंधी नाम को उपाधि में नहीं बदलता।
- issue: וְהִשְׁתַּחֲוִיתָ में शारीरिक क्रिया और आराधना का संबंध
  choice: दंडवत करना
  alternative: आराधना करना; झुकना
  rationale: संदर्भ में यह क्रिया आराधना का अंग है, फिर भी इब्रानी शब्द विशेष रूप से शरीर झुकाने या भूमि पर गिरने की क्रिया व्यक्त करता है। अनुवाद उस ठोस क्रिया को बनाए रखता है और व्यापक धार्मिक अर्थ को अनावश्यक रूप से आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। उद्धरण-चिह्न प्रथम पुरुष में बोले जाने वाले अनुष्ठानिक कथन को उसके बाद आने वाले दूसरे पुरुष के निर्देश से अलग करते हैं। परमेश्वर को सीधे संबोधित करते समय ‘आपने’ और विधिक निर्देश में इस्राएली उपासक के लिए ‘तुम’ रखा गया है।
