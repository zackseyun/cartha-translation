  text: וְ/אָמַרְתָּ֡ לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בִּעַ֧רְתִּי הַ/קֹּ֣דֶשׁ מִן הַ/בַּ֗יִת וְ/גַ֨ם נְתַתִּ֤י/ו לַ/לֵּוִי֙ וְ/לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָ/אַלְמָנָ֔ה כְּ/כָל מִצְוָתְ/ךָ֖ אֲשֶׁ֣ר צִוִּיתָ֑/נִי לֹֽא עָבַ֥רְתִּי מִ/מִּצְוֺתֶ֖י/ךָ וְ/לֹ֥א שָׁכָֽחְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/013.yaml
  text: Then you shall say before Yahweh your God[a], ‘I have removed the holy portion from the house, and I have also given it to the Levite, the sojourner, the fatherless, and the widow, according to all your commandment that you commanded me. I have not transgressed your commandments[c][b], nor have I forgotten them.’
translation:
  language: hi
  text: तब तुम अपने परमेश्वर यहवे के सामने यह कहना, ‘मैंने पवित्र अंश को घर से निकाल दिया है और उसे लेवी, परदेशी[a], अनाथ और विधवा को भी दे दिया है, तुम्हारी सारी आज्ञा के अनुसार जो तुमने मुझे दी है। मैंने तुम्हारी आज्ञाओं का उल्लंघन नहीं किया और न उन्हें भूला हूँ।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात इस्राएलियों के बीच रहने वाला विदेशी निवासी।
    reason: גֵּר का आशय केवल थोड़े समय के यात्री से नहीं, समुदाय के बीच रहने वाले गैर-इस्राएली निवासी से है।
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: तब तुम ... कहना
  rationale: वाव-संयुक्त पूर्ण क्रिया अनुष्ठान की क्रमिक प्रक्रिया को आगे बढ़ाती है; ‘तब’ इस क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहवे के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने/उपस्थिति में’ है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहवे’ से व्यक्त किया गया है।
- source_word: בִּעַרְתִּי הַקֹּדֶשׁ מִן הַבַּיִת
  choice: मैंने पवित्र अंश को घर से निकाल दिया है
  rationale: इस प्रसंग में בער जलाने के बजाय अलग रखे दशमांश को घर से हटा देने का बोध देता है; הַקֹּדֶשׁ वितरण के लिए समर्पित पवित्र अंश है।
- source_word: וְגַם נְתַתִּיו
  choice: और उसे ... भी दे दिया है
  rationale: प्रत्यय पहले उल्लिखित पवित्र अंश की ओर संकेत करता है; ‘भी’ גם के योगात्मक बल को रखता है।
- source_word: לַלֵּוִי
  choice: लेवी
  rationale: मूल पाठ सामाजिक वर्ग ‘लेवी’ कहता है, विशेष रूप से याजक नहीं।
- source_word: לַגֵּר
  choice: परदेशी
  rationale: גֵּר इस्राएल के बीच रहने वाले गैर-इस्राएली निवासी को दर्शाता है; संक्षिप्त मुख्य पाठ के साथ पादटिप्पणी इसका सामाजिक आशय स्पष्ट करती है।
- source_word: לַיָּתוֹם
  choice: अनाथ
  rationale: यָתוֹם उस असुरक्षित संतान-वर्ग का सामान्य हिन्दी रूप है जिसे विधवा और परदेशी के साथ व्यवस्था में संरक्षण मिलता है।
- source_word: כְּכָל מִצְוָתְךָ אֲשֶׁר צִוִּיתָנִי
  choice: ठीक उस सारी आज्ञा के अनुसार जो तुमने मुझे दी थी
  rationale: एकवचन מִצְוָה यहाँ सामूहिक अर्थ रखता है; ‘सारी आज्ञा’ उसकी व्याकरणिक संख्या और व्यापकता दोनों बनाए रखता है। क्रिया की शब्दगत पुनरावृत्ति को अस्वाभाविक हिन्दी से बचाने के लिए ‘आज्ञा ... दी’ किया गया है।
- source_word: לֹא עָבַרְתִּי מִמִּצְוֺתֶיךָ
  choice: मैंने तुम्हारी आज्ञाओं का उल्लंघन नहीं किया
  rationale: עבר מן यहाँ सीमा लाँघने अथवा आज्ञा तोड़ने का अर्थ देता है; ‘उल्लंघन’ औपचारिक और स्पष्ट है।
- source_word: וְלֹא שָׁכָחְתִּי
  choice: और न उन्हें भूला हूँ
  rationale: कर्म का संकेत पूर्ववर्ती बहुवचन ‘आज्ञाओं’ की ओर है; हिन्दी में ‘उन्हें’ इसे स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहवे’ नाम को पदवी में बदलने के बजाय उसकी विशिष्टता बनाए रखता है।
- issue: הַקֹּדֶשׁ का संदर्भगत अर्थ
  choice: पवित्र अंश
  alternative: पवित्र वस्तु; पवित्र भाग
  rationale: शाब्दिक अर्थ ‘पवित्र वस्तु’ हो सकता है, पर इस प्रसंग में यह अलग रखे गए दशमांश अथवा उपज के अंश को सूचित करता है। ‘पवित्र अंश’ संदर्भ स्पष्ट करता है, बिना उसे केवल धन या किसी एक प्रकार की उपज तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। परमेश्वर को संबोधित घोषणा में निकटवर्ती एकवचन ‘तुम’ मूल के द्वितीय पुरुष एकवचन प्रत्ययों को सुरक्षित रखता है। मुख्य पाठ में केवल एक पादटिप्पणी-चिह्न [a] है और वही पादटिप्पणी सूची में दिया गया है।
