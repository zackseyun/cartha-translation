  text: וְ/לָקַחְתָּ֞ מֵ/רֵאשִׁ֣ית כָּל פְּרִ֣י הָ/אֲדָמָ֗ה אֲשֶׁ֨ר תָּבִ֧יא מֵֽ/אַרְצְ/ךָ֛ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לָ֖/ךְ וְ/שַׂמְתָּ֣ בַ/טֶּ֑נֶא וְ/הָֽלַכְתָּ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/002.yaml
  text: you shall take some of the firstfruits of all the fruit of the ground that you bring in from your land[a], which Yahweh your God is giving you, and put it in a basket[b], and go to the place that Yahweh your God will choose to make his name dwell there.
translation:
  language: hi
  text: तुम्हारा परमेश्वर याहवे तुम्हें जो भूमि दे रहा है, उस भूमि से जो सारी उपज तुम लाओगे, उसके पहले फलों में से कुछ लेना[a], उसे एक टोकरी में रखना, और उस स्थान पर जाना जिसे तुम्हारा परमेश्वर याहवे अपना नाम वहाँ बसाने के लिए चुनेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “भूमि की सारी उपज के पहले फलों में से।”'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “अपना नाम वहाँ बसाने के लिए।” यह व्यवस्थाविवरण का विशिष्ट प्रयोग है, जो उस स्थान को दर्शाता है जिसे याहवे अपनी आराधनापूर्ण उपस्थिति के लिए चुनता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: लेना
  rationale: कानूनी निर्देश की शृंखला में संयोजक सहित पूर्ण क्रिया आज्ञार्थक भाव रखती है; हिंदी में ‘लेना’ स्वाभाविक निर्देशात्मक बल देता है।
- source_word: מֵרֵאשִׁית כָּל פְּרִי הָאֲדָמָה
  choice: जो भी उपज ... उसकी पहली उपज में से कुछ
  rationale: מִן के साथ רֵאשִׁית पहली उपज के एक अंश को सूचित करता है। यह अनुवाद सारे पहले फलों को लेने का अर्थ नहीं देता और कृषि-उपज की व्यापकता बनाए रखता है।
- source_word: אֲשֶׁר תָּבִיא מֵאַרְצְךָ
  choice: उसमें से तुम जो भी उपज लाओगे
  rationale: בוא का हिफ़ील रूप उपज को भूमि से लाने का भाव रखता है; ‘लाओगे’ इस गति-संबंधी अर्थ को ‘काटोगे’ जैसे अधिक व्याख्यात्मक शब्द के बिना सुरक्षित रखता है।
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: तुम्हारा परमेश्वर याहवे तुम्हें जो भूमि दे रहा है
  rationale: सहभागी रूप נֹתֵן के जारी दान के भाव को ‘दे रहा है’ व्यक्त करता है और संबंधवाचक उपवाक्य को उसके निकटतम पूर्वपद ‘भूमि’ से स्पष्ट रूप से जोड़ता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत दिव्य नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וְשַׂמְתָּ בַטֶּנֶא
  choice: उसे एक टोकरी में रखना
  rationale: טֶנֶא उपज ढोने की टोकरी है; ‘उसे’ एकत्रित पहली उपज को सामूहिक रूप से संदर्भित करता है।
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: और उस स्थान पर जाना
  rationale: यह अगला क्रमिक निर्देश है; ‘स्थान’ व्यवस्थाविवरण के चुने हुए आराधना-स्थल की भाषा को बनाए रखता है।
- source_word: אֲשֶׁר יִבְחַר
  choice: जिसे ... चुनेगा
  rationale: अपूर्ण क्रिया मूसा के कथन के समय की दृष्टि से भविष्य में होने वाले चुनाव को व्यक्त करती है।
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: अपना नाम वहाँ बसाने के लिए
  rationale: שכן का हिफ़ील रूप कारणवाचक है। ‘नाम वहाँ बसाना’ मूल धार्मिक मुहावरे को सुरक्षित रखता है और उसे केवल स्वामित्व या नामकरण में समतल नहीं करता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का सीधे प्रयोग करता है; ‘याहवे’ उसे उपाधि से बदलने के बजाय हिंदी लिपि में प्रस्तुत करता है।
- issue: पवित्रस्थान-सूत्र לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: अपना नाम वहाँ बसाने के लिए
  alternative: अपना नाम वहाँ रखने के लिए
  rationale: चुना हुआ पाठ व्यवस्थाविवरण के ‘नाम के वास’ वाले मुहावरे और इस धार्मिक तनाव को बनाए रखता है कि परमेश्वर का नाम वहाँ बसता है, बिना यह कहे कि परमेश्वर स्वयं स्थान में सीमित है।
translation_notes:
  register: आधुनिक मानक हिंदी में सम्मानपूर्ण और सामान्य पाठक के लिए सहज निर्देशात्मक शैली रखी गई है। लंबी इब्रानी वाक्य-संरचना को हिंदी के स्वाभाविक संबंधवाचक क्रम में ढाला गया है, जबकि भूमि के दान, पहली उपज और चुने हुए स्थान के मुख्य संबंध सुरक्षित हैं।
