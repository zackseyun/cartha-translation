  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֶת יְהוָ֥ה הֶאֱמַ֖רְתָּ הַ/יּ֑וֹם לִ/הְיוֹת֩ לְ/ךָ֨ לֵֽ/אלֹהִ֜ים וְ/לָ/לֶ֣כֶת בִּ/דְרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר חֻקָּ֧י/ו וּ/מִצְוֺתָ֛י/ו וּ/מִשְׁפָּטָ֖י/ו וְ/לִ/שְׁמֹ֥עַ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/017.yaml
  text: Today you have declared Yahweh to be your God[a], and that you will walk in his ways, keep his statutes, his commandments, and his judgments[c][b], and obey his voice.
translation:
  language: hi
  text: आज तुमने यहोवा को अपना परमेश्वर मानकर घोषणा की है कि तुम उसके मार्गों पर चलोगे, उसकी विधियों, आज्ञाओं और न्याय-विधियों का पालन करोगे, और उसकी वाणी सुनोगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसकी वाणी सुनोगे” का अर्थ इस प्रसंग में उसकी बात मानना और उसकी आज्ञा का पालन करना भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ व्यक्तिगत दिव्य नाम को शीर्षक से बदलने के बजाय सुरक्षित रखता है।
- source_word: הֶאֱמַרְתָּ
  choice: मानकर घोषणा की है
  rationale: यह असामान्य हिफ़ील रूप औपचारिक वाचिक स्वीकार या अभिपुष्टि दर्शाता है; यह चयन केवल ‘कहा’ से अधिक गंभीर वाचा-संबंधी भाव व्यक्त करता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: समयगत बल को सहज आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: अपना परमेश्वर
  rationale: वाचा-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, अर्थात यहोवा को अपने परमेश्वर के रूप में स्वीकार करना।
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: उसके मार्गों पर चलोगे
  rationale: इब्रानी के ‘मार्गों पर चलना’ रूपक और उसके वाचा-संबंधी नैतिक अर्थ, दोनों को सुरक्षित रखता है।
- source_word: חֻקָּיו
  choice: उसकी विधियों
  rationale: חֻקִּים के स्थापित कानूनी-वाचा संबंधी अर्थ को स्पष्ट आधुनिक हिन्दी में रखता है।
- source_word: מִצְוֺתָיו
  choice: आज्ञाओं
  rationale: औपचारिक कानूनी और वाचा-संबंधी भाव बनाए रखता है।
- source_word: מִשְׁפָּטָיו
  choice: न्याय-विधियों
  rationale: यह शब्द न्यायिक निर्णयों या नियत कानूनी नियमों को सूचित कर सकता है; ‘न्याय-विधियाँ’ इसे ‘विधियों’ और ‘आज्ञाओं’ में पूरी तरह विलीन नहीं होने देता।
- source_word: וְלִשְׁמֹעַ בְּקֹלוֹ
  choice: उसकी वाणी सुनोगे
  rationale: शाब्दिक ‘उसकी वाणी सुनना’ सुरक्षित रहता है, जबकि प्रसंग में आज्ञापालन का निहितार्थ बना रहता है।
theological_decisions:
- issue: वाचा की औपचारिक घोषणा और इस्राएल की प्रतिबद्धता
  choice: पद को यहोवा को अपना परमेश्वर स्वीकार करने की औपचारिक घोषणा के रूप में प्रस्तुत किया गया है, जिसके साथ उसके मार्गों पर चलने और उसकी आज्ञाओं का पालन करने की प्रतिबद्धता जुड़ी है।
  alternative: इन्फिनिटिवों की शृंखला को अधिक शब्दशः रखते हुए वाक्य-संबंध को कम स्पष्ट किया जा सकता था।
  rationale: הֶאֱמַרְתָּ की औपचारिक शक्ति और उसके बाद आने वाले इन्फिनिटिव वाचा-संबंधी स्वीकार तथा दायित्वों को जोड़ते हैं; अनुवाद इसे स्पष्ट करता है, पर अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: ‘वाणी सुनना’ में श्रवण और आज्ञापालन का संबंध
  choice: मुख्य पाठ में ‘वाणी सुनोगे’ रखा गया है और आज्ञापालन का प्रसंगगत अर्थ पादटिप्पणी में बताया गया है।
  alternative: ‘उसकी वाणी मानोगे’ या ‘उसकी आज्ञा मानोगे।’
  rationale: इब्रानी अभिव्यक्ति की प्रतिमा और उसकी अर्थगत व्यापकता सुरक्षित रहती है; केवल आज्ञापालन अर्थ चुनकर वास्तविक सूक्ष्मता को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘मार्गों पर चलना’ जैसे मूल वाचा-संबंधी रूपक को बनाए रखा गया है; कानूनी पदों के बीच यथासंभव भेद रखा गया है।
