source:
  edition: WLC
  text: הַשְׁקִיפָ/ה֩ מִ/מְּע֨וֹן קָדְשְׁ/ךָ֜ מִן הַ/שָּׁמַ֗יִם וּ/בָרֵ֤ךְ אֶֽת עַמְּ/ךָ֙ אֶת יִשְׂרָאֵ֔ל וְ/אֵת֙ הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תָּה לָ֑/נוּ כַּ/אֲשֶׁ֤ר נִשְׁבַּ֨עְתָּ֙ לַ/אֲבֹתֵ֔י/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/015.yaml
  text: Look down from your holy dwelling[a], from heaven, and bless your people Israel and the land that you have given us, as you swore to our fathers, a land flowing with milk and honey.
translation:
  language: hi
  text: स्वर्ग में अपने पवित्र निवास से नीचे दृष्टि कर और अपनी प्रजा इस्राएल को तथा उस भूमि को आशीष दे जो तूने हमें दी है, जैसा तूने हमारे पितरों[a] से शपथ खाई थी—वह देश जिसमें दूध और मधु की धाराएँ बहती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे पूर्वजों।” शाब्दिक अर्थ, “हमारे पितरों”; यहाँ विशेष रूप से कुलपिताओं का संकेत है।
    reason: मूल के पुल्लिंग वाचा-सूत्र को मुख्य पाठ में सुरक्षित रखते हुए उसका व्यापक आधुनिक विकल्प स्पष्ट करने के लिए।
lexical_decisions:
- source_word: הַשְׁקִיפָה
  choice: नीचे दृष्टि कर
  rationale: आज्ञार्थक क्रिया ऊपर स्थित स्थान से ध्यानपूर्वक नीचे देखने का भाव देती है; अगले पदबंध 'स्वर्ग से' के साथ यह अर्थ स्पष्ट और स्वाभाविक है।
- source_word: מִמְּעוֹן קָדְשְׁךָ
  choice: अपने पवित्र निवास से
  rationale: מָעוֹן निवास-स्थान को और קָדְשְׁךָ उसकी पवित्रता को व्यक्त करता है; यह हिन्दी में गरिमामय तथा सुबोध है।
- source_word: מִן הַשָּׁמַיִם
  choice: स्वर्ग से
  rationale: हिब्रू शब्द रूपतः बहुवचन है, पर इस स्थानवाचक प्रयोग में हिन्दी का एकवचन 'स्वर्ग' स्वाभाविक अर्थ देता है।
- source_word: וּבָרֵךְ
  choice: आशीष दे
  rationale: ברך के आज्ञार्थक रूप का पारदर्शी और प्रचलित बाइबलीय हिन्दी अनुवाद।
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल को
  rationale: समानाधिकरण संरचना 'प्रजा' की पहचान इस्राएल के रूप में करती है और वाचा-संबंधी अपनापन बनाए रखती है।
- source_word: הָאֲדָמָה
  choice: भूमि
  rationale: अन्न के पहिले फल के प्रसंग में אֲדָמָה उपजाऊ भूमि/मिट्टी का संकेत दे सकता है, पर यहाँ दी गई प्रतिज्ञात भूमि संदर्भित है; 'भूमि' उस अर्थ को स्वाभाविक रखते हुए आगे के אֶרֶץ के 'देश' से शब्दगत भेद भी बनाए रखता है।
- source_word: אֲשֶׁר נָתַתָּה לָנוּ
  choice: जो तूने हमें दी है
  rationale: पूर्ण क्रिया पहले दिए जा चुके वरदान और उसकी वर्तमान प्रासंगिकता दोनों को व्यक्त करती है।
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ
  choice: जैसा तूने हमारे पूर्वजों से शपथ खाई थी
  rationale: אָבוֹת का शाब्दिक अर्थ 'पिता' है, किंतु इस वाचा-सूत्र में यह पिछली पीढ़ियों, विशेषकर कुलपिताओं, को संदर्भित करता है; आधुनिक हिन्दी में 'पूर्वजों' से अभिप्राय अधिक स्पष्ट है।
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: वह देश जिसमें दूध और मधु की धाराएँ बहती हैं
  rationale: यह समृद्धि और उर्वरता का हिब्रू मुहावरा है; हिन्दी अभिव्यक्ति मूल की प्रवाहमान छवि को स्पष्ट रूप से सुरक्षित रखती है।
theological_decisions:
- issue: לַאֲבֹתֵינוּ का वाचा-सूत्र में अनुवाद
  choice: हमारे पूर्वजों
  alternative: हमारे पितरों
  rationale: मूल शब्द पुल्लिंग 'पिताओं' का है और विशेष रूप से कुलपिताओं की ओर संकेत कर सकता है। मुख्य पाठ में 'पूर्वजों' सामान्य आधुनिक हिन्दी में वंशगत अर्थ स्पष्ट करता है; पादटिप्पणी शाब्दिक और विशिष्ट विकल्प सुरक्षित रखती है।
- issue: परमेश्वर के पवित्र निवास और स्वर्ग का संबंध
  choice: अपने पवित्र निवास से, स्वर्ग से
  alternative: स्वर्ग में अपने पवित्र निवास से
  rationale: दोनों מִן पदबंधों को अलग रखकर मूल की समानाधिकरणात्मक संरचना और संभावित सूक्ष्म तनाव सुरक्षित रखा गया है; उन्हें पूरी तरह एक पदबंध में विलीन नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, श्रद्धापूर्ण एकवचन संबोधन 'तू', और प्रार्थना के अनुरूप गरिमामय किंतु सामान्य पाठकों के लिए सुबोध शैली। 'भूमि' और 'देश' द्वारा אֲדָמָה तथा אֶרֶץ का सीमित शब्दगत भेद रखा गया है।
