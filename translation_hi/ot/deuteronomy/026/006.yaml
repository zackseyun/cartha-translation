  text: וַ/יָּרֵ֧עוּ אֹתָ֛/נוּ הַ/מִּצְרִ֖ים וַ/יְעַנּ֑וּ/נוּ וַ/יִּתְּנ֥וּ עָלֵ֖י/נוּ עֲבֹדָ֥ה קָשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/006.yaml
  text: And the Egyptians treated us badly and afflicted us[c][b][a], and laid hard labor on us.
translation:
  language: hi
  text: और मिस्रियों ने हमारे साथ बुरा व्यवहार किया और हमें सताया, और हम पर कठोर श्रम लाद दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֵעוּ אֹתָנוּ
  choice: हमारे साथ बुरा व्यवहार किया
  rationale: רעע के हिफ़ील रूप में हानि पहुँचाने या बुरा बर्ताव करने का भाव है। यह सहज आधुनिक हिन्दी में उस हानिकारक व्यवहार को व्यक्त करता है, बिना हिंसा का ऐसा विशेष अर्थ जोड़े जो क्रिया में स्वयं स्पष्ट नहीं है।
- source_word: הַמִּצְרִים
  choice: मिस्रियों
  rationale: यह निश्चित जातीय/राष्ट्रीय पद मिस्र के उन लोगों को दर्शाता है जिन्होंने इस्राएलियों पर अत्याचार किया। हिन्दी में कारक-चिह्न ‘ने’ के साथ ‘मिस्रियों’ स्वाभाविक रूप है।
- source_word: וַיְעַנּוּנוּ
  choice: हमें सताया
  rationale: ענה के पिएल रूप में दुःख देने, सताने, दबाने या अपमानित करने की अर्थ-सीमा है। ‘सताया’ पहले खंड के ‘बुरा व्यवहार किया’ से भिन्न रहते हुए थोपी गई पीड़ा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּתְּנוּ עָלֵינוּ
  choice: हम पर … लाद दी
  rationale: נתן על का मुहावरा किसी पर कुछ रखने या थोपने को दर्शाता है। ‘लाद दी’ बोझ के बिंब और जबरन आरोपित काम—दोनों को प्रभावी ढंग से व्यक्त करता है।
- source_word: עֲבֹדָה קָשָׁה
  choice: कठोर मेहनत
  rationale: עֲבֹדָה काम/सेवा/श्रम और קָשָׁה कठोर या कठिन को दर्शाता है। ‘कठोर मेहनत’ सामान्य आधुनिक हिन्दी में बोझिल और निर्दयतापूर्वक थोपे गए काम का भाव देता है।
theological_decisions:
- issue: उत्पीड़न बताने वाली क्रमिक क्रियाओं को अलग-अलग बनाए रखना
  choice: 'तीन अलग अभिव्यक्तियाँ रखी गईं: ‘बुरा व्यवहार किया,’ ‘सताया,’ और ‘कठोर मेहनत लाद दी।’'
  alternative: पहली दो क्रियाओं को उत्पीड़न के एक ही विचार में मिला देना, या हर खंड में अधिक स्पष्ट दासता-संबंधी शब्दावली जोड़ना।
  rationale: इब्रानी में संबंधित किंतु अलग-अलग क्रियाओं का क्रम है। उन्हें अलग रखना स्रोत की वाक्पटु प्रगति को सुरक्षित करता है और शब्दों से परे कोई अतिरिक्त ऐतिहासिक या धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण है। ‘सताया’ तथा ‘लाद दी’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि मूल के उत्पीड़न और बोझ के बिंब को बनाए रखते हैं।
