source:
  edition: WLC
  text: וְ/שָׂמַחְתָּ֣ בְ/כָל הַ/טּ֗וֹב אֲשֶׁ֧ר נָֽתַן לְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/לְ/בֵיתֶ֑/ךָ אַתָּה֙ וְ/הַ/לֵּוִ֔י וְ/הַ/גֵּ֖ר אֲשֶׁ֥ר בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/011.yaml
  text: And you shall rejoice in all the good that Yahweh your God has given to you and to your household—you[a], and the Levite, and the sojourner who is among you.
translation:
  language: hi
  text: और तुम उस सारी भलाई के कारण आनन्द मनाओ जो याहवे तुम्हारे परमेश्वर ने तुम्हें और तुम्हारे घराने को दी है—तुम, लेवी और तुम्हारे बीच रहने वाला परदेशी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ऐसा गैर-इस्राएली निवासी जो इस्राएलियों के बीच रहकर उनके समाज के संरक्षण में होता था।
    reason: גֵּר के कानूनी-सामाजिक अर्थ को स्पष्ट करना, जिसे केवल ‘परदेशी’ शब्द पूरी तरह व्यक्त नहीं करता।
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: और तुम ... आनन्द मनाना
  rationale: निर्देशात्मक प्रसंग में यह क्रिया आज्ञार्थक भाव रखती है। ‘आनन्द मनाना’ भावनात्मक प्रसन्नता और उत्सवी सहभागिता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּכָל הַטּוֹב
  choice: उस सारी भलाई के कारण
  rationale: यहाँ בְּ उस आधार या कारण को बताता है जिस पर आनन्द किया जाता है। ‘सारी भलाई’ मूल के सामूहिक और व्यापक अर्थ को बनाए रखती है।
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: जो ... ने तुम्हें ... दी है
  rationale: पूर्ण की गई देन का वर्तमान फल इस अनुष्ठानिक प्रसंग में बना हुआ है; हिन्दी पूर्णकाल इसे सहज रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू के व्यक्तिगत ईश्वरीय नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: वाचा-संबंधी सामान्य पदबंध और एकवचन संबंधसूचक प्रत्यय दोनों सुरक्षित हैं।
- source_word: וּלְבֵיתֶךָ
  choice: और तुम्हारे घराने को
  rationale: यहाँ בַּיִת केवल भवन नहीं, बल्कि परिवार और आश्रितों सहित सामाजिक गृह-इकाई को सूचित करता है।
- source_word: אַתָּה
  choice: तुम
  rationale: हिब्रू में स्पष्ट सर्वनाम बल देता है और आनन्द में सम्मिलित लोगों की सूची आरम्भ करता है; इसलिए इसे रखा गया है।
- source_word: הַלֵּוִי
  choice: लेवीय
  rationale: यह लेवी गोत्र के सदस्य के लिए प्रचलित और सटीक हिन्दी पद है।
- source_word: הַגֵּר
  choice: परदेशी
  rationale: यह ऐसा गैर-इस्राएली निवासी है जो इस्राएली समाज के बीच रहकर उसके संरक्षण में होता था। सरल मुख्य पाठ के लिए ‘परदेशी’ चुना गया और कानूनी-सामाजिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אֲשֶׁר בְּקִרְבֶּךָ
  choice: तुम्हारे बीच रहने वाला
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और समुदाय के भीतर उस व्यक्ति की वास्तविक उपस्थिति को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसका सीधा और व्यापक रूप से स्वीकृत ध्वन्यात्मक लिप्यंतरण है; ‘प्रभु’ नाम को उपाधि में बदल देता, जबकि ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा दर्शाता है।
- issue: आनन्द में सम्मिलित लोगों की व्याकरणिक पहचान
  choice: ‘तुम, लेवीय और ... परदेशी’ को आनन्द मनाने वालों की सूची के रूप में रखना
  alternative: इन सबको ‘घराने’ की व्याख्या मानना
  rationale: स्पष्ट אַתָּה और उसके बाद जुड़े संज्ञापद मुख्य क्रिया के सहभागी कर्ताओं पर बल देते हैं। विराम-चिह्न से संबंध स्पष्ट किया गया है, बिना उन्हें अनिवार्यतः ‘घराने’ में समाहित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन ‘तुम’ मूल के संबोधन को सुरक्षित रखता है। ‘आनन्द मनाना’ उत्सवी संदर्भ के अनुकूल है। पादटिप्पणी-चिह्न उसी शब्द के बाद रखा गया है जिसकी व्याख्या वह करता है।
