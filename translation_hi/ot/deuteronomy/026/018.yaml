  text: וַֽ/יהוָ֞ה הֶאֱמִֽירְ/ךָ֣ הַ/יּ֗וֹם לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/לִ/שְׁמֹ֖ר כָּל מִצְוֺתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/018.yaml
  text: And Yahweh has declared today that you are to be his treasured people[a], as he promised you[b], and that you are to keep all his commandments.
translation:
  language: hi
  text: और आज यहोवा ने तुम्हें अपने लिए एक बहुमूल्य प्रजा बनने और उसकी सारी आज्ञाओं का पालन करने के लिए घोषित किया है, जैसा उसने तुमसे कहा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या “जैसा उसने तुमसे प्रतिज्ञा की थी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट नाम יהוה को पारंपरिक हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है, ताकि नाम और सामान्य उपाधि के बीच भेद बना रहे।
- source_word: הֶאֱמִירְךָ
  choice: तुम्हारे विषय में घोषणा की है
  rationale: व्यवस्थाविवरण 26:17–18 में यह दुर्लभ हिफ़ील रूप औपचारिक वाचा-संबंधी घोषणा का भाव रखता है। यह अनुवाद उस विधिवत घोषणा को व्यक्त करता है, पर ‘चुना’ जैसा अधिक व्याख्यात्मक अर्थ नहीं जोड़ता।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह आधुनिक और स्वाभाविक हिन्दी है तथा घोषणा की तत्काल वाचागत प्रासंगिकता बनाए रखती है।
- source_word: לִהְיוֹת לוֹ
  choice: उसके लिए ... होगे
  rationale: यह infinitive construction घोषणा के परिणाम अथवा निर्धारित स्थिति को व्यक्त करता है। हिन्दी में भविष्यसूचक ‘होगे’ इस वाक्य-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְעַם סְגֻלָּה
  choice: एक बहुमूल्य प्रजा
  rationale: עַם का सामूहिक अर्थ ‘प्रजा’ से और סְגֻלָּה का मूल्यवान निजी निधि/सम्पत्ति का भाव ‘बहुमूल्य’ से व्यक्त होता है। वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: जैसा उसने तुमसे कहा था
  rationale: דבר का मूल अर्थ ‘कहना/बोलना’ सुरक्षित रखा गया है। संदर्भ में प्रतिज्ञा का भाव सम्भव है, पर उसे मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: וְלִשְׁמֹר
  choice: और ... पालन करोगे
  rationale: आज्ञाओं के साथ שׁמר का अर्थ उन्हें मानना और उनका पालन करना है। समन्वित infinitive को हिन्दी में समान भविष्यसूचक रचना से जोड़ा गया है।
- source_word: כָּל מִצְוֺתָיו
  choice: उसके सभी आदेशों
  rationale: ‘आदेश’ आधुनिक हिन्दी में स्पष्ट है और वाचागत निर्देशों का बल बनाए रखता है।
theological_decisions:
- issue: הֶאֱמִיר का वाचागत बल
  choice: औपचारिक घोषणा
  alternative: चुन लेना या विशेष रूप से अलग करना
  rationale: दुर्लभ क्रिया यहाँ वाचा के भीतर परमेश्वर की विधिवत घोषणा बताती है। ‘घोषणा’ पाठ के कथन से आगे बढ़कर चुनाव-सिद्धान्त को स्पष्ट रूप से आरोपित नहीं करती।
- issue: דִּבֶּר का अर्थ
  choice: कहा था
  alternative: प्रतिज्ञा की थी
  rationale: वाचा-संदर्भ में प्रतिज्ञा निहित हो सकती है, पर इब्रानी क्रिया का सीधा अर्थ ‘बोला/कहा’ है। मुख्य पाठ इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
- issue: לִהְיוֹת और וְלִשְׁמֹר का वाक्यगत सम्बन्ध
  choice: दोनों को घोषणा के समन्वित परिणाम/दायित्व के रूप में व्यक्त किया
  alternative: केवल प्रजा होने को घोषणा और आज्ञापालन को अलग आदेश मानना
  rationale: दोनों infinitive रूप समन्वित हैं; हिन्दी में ‘होगे ... और ... पालन करोगे’ उनकी निकट व्याकरणिक समानता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वाचागत शैली अपनाई गई है। ‘प्रजा’ सामूहिक पहचान को स्पष्ट करता है; ‘बहुमूल्य’ सामान्य पाठक के लिए सहज है। परमेश्वर के नाम के लिए ‘यहोवा’ रखा गया है।
