base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/005.yaml
  text: And you shall answer and say before Yahweh your God[a], ‘My father was a perishing Aramean, and he went down to Egypt and sojourned there, few in number; and there he became a great, mighty, and numerous nation.’
translation:
  language: hi
  text: 'तब तुम अपने परमेश्वर यहोवा के सामने उत्तर में यह कहना: ‘मेरा पिता एक भटकता हुआ अरामी था[a]; वह मिस्र को उतर गया और वहाँ थोड़े लोगों के साथ परदेशी के रूप में रहा। वहाँ वह एक बड़ा, शक्तिशाली और बहुत-से लोगों वाला राष्ट्र बन गया।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा पिता एक नाश होता हुआ अरामी था।” इब्रानी कृदंत का अर्थ “भटकता हुआ” और “नाश होता हुआ” दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנִיתָ וְאָמַרְתָּ
  choice: उत्तर देकर कहना
  rationale: दोनों इब्रानी क्रियाओं को एक स्वाभाविक हिन्दी संयुक्त अभिव्यक्ति में रखा गया है, जो विधिवत उत्तर या स्वीकारोक्ति का भाव बनाए रखती है।
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा के सामने
  rationale: לִפְנֵי का स्थानगत और उपासना-संबंधी अर्थ ‘के सामने’ से स्पष्ट होता है; יהוה को परियोजना की नाम-आधारित परंपरा के अनुसार ‘यहोवा’ किया गया है।
- source_word: אֲרַמִּי אֹבֵד
  choice: एक भटकता हुआ अरामी
  rationale: अֹבֵד कृदंत का ‘भटकता हुआ’ अर्थ पूर्वज के प्रवास और आगे मिस्र जाने के संदर्भ में सहज है। ‘नाश होने पर था’ भी संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אָבִי
  choice: मेरा पिता
  rationale: शाब्दिक, एकवचन और प्रतिनिधिक अभिव्यक्ति को बनाए रखा गया है; ‘पूर्वज’ अधिक व्याख्यात्मक होता।
- source_word: וַיֵּרֶד מִצְרַיְמָה
  choice: वह मिस्र को उतर गया
  rationale: ‘उतर गया’ मिस्र की ओर यात्रा के पारंपरिक इब्रानी दिशासूचक मुहावरे को बनाए रखता है।
- source_word: וַיָּגָר שָׁם
  choice: वहाँ परदेशी के रूप में रहा
  rationale: גור केवल ठहरने नहीं, बल्कि निवासी परदेशी के रूप में रहने का अर्थ देता है; वर्तमान हिन्दी में यह ‘प्रवास किया’ से अधिक स्पष्ट है।
- source_word: בִּמְתֵי מְעָט
  choice: उस समय उसके साथ थोड़े ही लोग थे
  rationale: इब्रानी मुहावरे का आशय छोटे समूह से है। यह हिन्दी रूप संख्या की अल्पता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיְהִי שָׁם לְגוֹי גָּדוֹל עָצוּם וָרָב
  choice: वहाँ वह एक बड़ा, शक्तिशाली और बहुसंख्यक राष्ट्र बन गया
  rationale: एकवचन पूर्वज के अपने वंशजों में राष्ट्र बनने की प्रतिनिधिक भाषा को बनाए रखते हुए तीनों विशेषणों का संचयी बल सुरक्षित रखा गया है।
theological_decisions:
- issue: אֲרַמִּי אֹבֵד אָבִי की व्याख्या
  choice: मेरा पिता एक भटकता हुआ अरामी था
  alternative: मेरा पिता एक नाश होता हुआ अरामी था; एक अरामी ने मेरे पिता का नाश करना चाहा
  rationale: मसोरेटिक स्वरांकन के अनुसार ‘अरामी’ और कृदंत ‘भटकता हुआ/नाश होता हुआ’ ‘मेरे पिता’ का वर्णन करते हैं। प्रवास के संदर्भ में ‘भटकता हुआ’ मुख्य पाठ में स्वाभाविक है, पर कृदंत में निहित ‘नाश होने’ की वास्तविक संभावना पादटिप्पणी में रखी गई है। ‘एक अरामी ने नाश करना चाहा’ अधिक व्याख्यात्मक रचना है और इब्रानी वाक्य-विन्यास से सीधे आवश्यक नहीं होती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक उपासना में पढ़े जाने योग्य रखी गई है। ‘उत्तर देकर कहना’ विधिवत स्वीकारोक्ति का स्वर देता है; ‘परदेशी के रूप में रहा’ दुर्लभ या पुरातन ‘परदेश में बसा’ जैसे रूपों की अपेक्षा अर्थ को अधिक स्पष्ट करता है।
