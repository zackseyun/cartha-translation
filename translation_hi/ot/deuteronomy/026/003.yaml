base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/003.yaml
  text: And you shall go to the priest who is in office in those days and say to him[c][b][a], ‘Today I declare to Yahweh your God that I have come into the land that Yahweh swore to our fathers to give to us.’
translation:
  language: hi
  text: फिर तुम उन दिनों सेवा कर रहे याजक के पास जाकर उससे कहना[a], ‘आज मैं तुम्हारे परमेश्वर यहोवा के समक्ष यह घोषणा करता हूँ[b] कि मैं उस देश में आ गया हूँ, जिसे हमारे पुरखों को देने की शपथ यहोवा ने खाई थी[c]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “उस याजक के पास, जो उन दिनों होगा”; अर्थात उस समय सेवा कर रहा याजक।'
    reason: lexical_alternative
  - marker: b
    text: 'या: “आज मैंने ... घोषणा की है।” इब्रानी क्रियारूप संभवतः निष्पादक है—वक्ता यह बात कहने के द्वारा ही घोषणा करता है।'
    reason: lexical_alternative
  - marker: c
    text: 'या: “हमारे पूर्वजों को।” इब्रानी में पुल्लिंग शब्द है और इस संदर्भ में संभवतः विशेष रूप से इस्राएल के कुलपिताओं की ओर संकेत करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: फिर तुम ... के पास जाकर
  rationale: בוא का अर्थ दृष्टिकोण के अनुसार ‘आना’, ‘जाना’ या ‘प्रवेश करना’ हो सकता है। याजक की ओर जाने के इस निर्देश में ‘के पास जाकर’ स्वाभाविक हिन्दी है और निर्देशों की क्रमिकता भी बनाए रखता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: उपासना और व्यवस्था-संबंधी संदर्भ में כֹּהֵן का मानक हिन्दी रूप।
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: उन दिनों सेवा कर रहे
  rationale: शाब्दिक अर्थ ‘जो उन दिनों होगा’ है; संदर्भ में इसका आशय उस समय याजकीय सेवा करने वाले व्यक्ति से है। यह रूप पद या कार्यालय की आधुनिक प्रशासनिक धारणा थोपे बिना भाव स्पष्ट करता है।
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: उससे कहना
  rationale: प्रत्यक्ष कथन का स्वाभाविक हिन्दी परिचय, जिसमें इब्रानी निर्देशात्मक बल सुरक्षित है।
- source_word: הִגַּדְתִּי הַיּוֹם
  choice: आज मैं ... यह घोषणा करता हूँ
  rationale: इब्रानी पूर्ण रूप यहाँ संभवतः निष्पादक है—वक्ता इन्हीं शब्दों को बोलकर घोषणा करता है। हिन्दी वर्तमानकाल इस प्रयोग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर यहोवा के सामने
  rationale: ל का यहाँ घोषणा के संबोधन/प्राप्तकर्ता का भाव है। ‘के सामने’ हिन्दी में औपचारिक घोषणा का स्वाभाविक ढंग है। ‘तुम्हारे’ का एकवचन रूप याजक को संबोधित मूल पाठ के अनुरूप रखा गया है।
- source_word: כִּי בָאתִי אֶל הָאָרֶץ
  choice: कि मैं उस देश में आ गया हूँ
  rationale: पूर्ण हुई आमद और उसकी वर्तमान प्रासंगिकता व्यक्त होती है; אֶל को गति और प्रवेश के संदर्भ में ‘में’ से स्वाभाविक रूप दिया गया है।
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: जिसे ... देने की शपथ यहोवा ने ... खाई थी
  rationale: हिन्दी वाक्य-विन्यास में उद्देश्य को शपथ के साथ जोड़ते हुए इब्रानी वाचा-संबंधी शपथ की भाषा सुरक्षित रखी गई है।
- source_word: לַאֲבֹתֵינוּ
  choice: हमारे पुरखों से
  rationale: אָבוֹת का पुल्लिंग और पूर्वज-संबंधी भाव ‘पुरखों’ में स्वाभाविक, वर्तमान हिन्दी में बना रहता है; संदर्भ में यह विशेषतः कुलपिताओं की ओर संकेत कर सकता है।
- source_word: לָתֶת לָנוּ
  choice: हमें देने
  rationale: भूमि को परमेश्वर के दिए हुए वरदान के रूप में प्रस्तुत करने वाला उद्देश्य और परोक्ष कर्म दोनों सुरक्षित हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। हिन्दी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को मुख्य पाठ में रखा गया है, न कि उसे केवल ‘प्रभु’ से बदला गया है।
- issue: ‘हमारे पुरखों’ का संदर्भ
  choice: हमारे पुरखों
  alternative: हमारे पूर्वजों / हमारे पिताओं
  rationale: मूल का पुल्लिंग बहुवचन सुरक्षित रखते हुए सामान्य पाठक के लिए स्वाभाविक शब्द चुना गया है। व्यवस्थाविवरण के वाचा-संदर्भ में यह कुलपिताओं को विशेष रूप से सूचित कर सकता है, पर मुख्य पाठ उस संदर्भ को आवश्यकता से अधिक संकीर्ण नहीं करता।
- issue: הִגַּדְתִּי का काल और वाक्-कार्य
  choice: मैं ... घोषणा करता हूँ
  alternative: मैंने ... घोषणा की है
  rationale: 'पूर्ण क्रिया को निष्पादक कथन समझना संदर्भ के अनुकूल है: उपासक यह वाक्य कहकर ही घोषणा करता है। विकल्प की वास्तविक व्याकरणिक संभावना पादटिप्पणी में रखी गई है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘याजक’, ‘शपथ’ और ‘घोषणा’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं, जबकि वाक्य-विन्यास सामान्य आधुनिक हिन्दी के अनुरूप है।
