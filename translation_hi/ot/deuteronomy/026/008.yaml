  text: וַ/יּוֹצִאֵ֤/נוּ יְהוָה֙ מִ/מִּצְרַ֔יִם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְרֹ֣עַ נְטוּיָ֔ה וּ/בְ/מֹרָ֖א גָּדֹ֑ל וּ/בְ/אֹת֖וֹת וּ/בְ/מֹפְתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/008.yaml
  text: And Yahweh brought us out of Egypt with a strong hand and an outstretched arm[a], and with great terror, and with signs and wonders.
translation:
  language: hi
  text: और याहवे हमें मिस्र से शक्तिशाली हाथ और फैली हुई भुजा के द्वारा, बड़े आतंक[a] के साथ, तथा चिन्हों और अद्भुत कार्यों के द्वारा बाहर ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महान विस्मय के साथ” अथवा “विस्मय उत्पन्न करने वाले महान कार्यों के द्वारा।” इब्रानी शब्द भय, आतंक, विस्मय, या भय/विस्मय उत्पन्न करने वाले प्रदर्शन का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנוּ
  choice: हमें…बाहर ले आया
  rationale: יצא का हिफ़ील रूप किसी को बाहर निकालने या ले आने का भाव देता है। यह प्रयोग निर्गमन की घटना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: מִמִּצְרַיִם
  choice: मिस्र से
  rationale: מִן स्रोत या प्रस्थान-बिंदु बताता है; ‘बाहर ले आया’ के साथ ‘मिस्र से’ स्वाभाविक और सटीक है।
- source_word: בְּיָד חֲזָקָה
  choice: बलवन्त हाथ से
  rationale: यह परमेश्वर की सामर्थ्यपूर्ण कार्रवाई का इब्रानी मुहावरा है। ‘बलवन्त हाथ’ मूल बिंब और विशेषण की शक्ति बनाए रखता है।
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: और बढ़ाई हुई भुजा से
  rationale: शाब्दिक बिंब को सुरक्षित रखते हुए यह परमेश्वर की सक्रिय शक्ति को व्यक्त करता है।
- source_word: וּבְמֹרָא גָּדֹל
  choice: बड़े आतंक के साथ
  rationale: מוֹרָא भय, आतंक अथवा विस्मय उत्पन्न करने वाले प्रदर्शन को सूचित कर सकता है। मुख्य पाठ में ‘आतंक’ निर्गमन के न्यायकारी प्रसंग की तीव्रता रखता है, और पादटिप्पणी वास्तविक अर्थ-विस्तार बताती है।
- source_word: וּבְאֹתוֹת
  choice: और चिन्हों
  rationale: אוֹתוֹת का सीधा अर्थ ‘चिन्ह’ है; अलौकिकता प्रसंग से स्पष्ट है, इसलिए अतिरिक्त विशेषण आवश्यक नहीं।
- source_word: וּבְמֹפְתִים
  choice: और अद्भुत कामों
  rationale: מוֹפְתִים असाधारण, चमत्कारपूर्ण प्रदर्शनों को दर्शाता है। ‘अद्भुत काम’ आधुनिक हिन्दी में स्पष्ट है और ‘चिन्हों’ से इसका भेद भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम प्रत्यक्ष है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी पाठकों में परिचित ‘यहोवा’ रूप में रखा गया है।
- issue: निर्गमन-सूत्र में מוֹרָא का अर्थ
  choice: बड़ा आतंक
  alternative: बड़ा विस्मय; विस्मयकारी महान कार्य
  rationale: शब्द भय या आतंक के साथ विस्मय उत्पन्न करने वाले प्रदर्शन का भाव भी रख सकता है। मुख्य अनुवाद न्याय और विपत्तियों की भयावहता को सामने रखता है, जबकि पादटिप्पणी अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘बलवन्त हाथ’ और ‘बढ़ाई हुई भुजा’ जैसे मूल इब्रानी बिंब सुरक्षित हैं; समानांतर साधन-सूचक पदों को हिन्दी में स्वाभाविक ढंग से जोड़ा गया है।
