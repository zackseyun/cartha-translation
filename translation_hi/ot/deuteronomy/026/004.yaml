  yaml_path: translation/ot/deuteronomy/026/004.yaml
  text: Then the priest shall take the basket from your hand and set it before the altar of Yahweh your God[a].
translation:
  language: hi
  text: तब याजक तुम्हारे हाथ से टोकरी लेगा और उसे तुम्हारे परमेश्वर याहवे[a] की वेदी के सामने रखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘YHWH’; पारंपरिक रूप से ‘यहोवा’ अनुवादित किया जाता है।'
    reason: मूल ईश्वरीय नाम और उसके पारंपरिक हिंदी रूप को स्पष्ट करना।
lexical_decisions:
- source_word: וְלָקַח
  choice: तब ... लेकर
  rationale: अनुष्ठानिक निर्देशों के क्रम में संयोजक वाव और पूर्ण क्रिया अगला अपेक्षित कार्य बताते हैं; हिंदी में ‘तब ... लेकर’ इस क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: निश्चित एकवचन संज्ञा उस अनुष्ठान को संपन्न करने वाले याजक को सूचित करती है।
- source_word: הַטֶּנֶא
  choice: टोकरी
  rationale: טֶנֶא यहाँ पहले फल रखने की टोकरी है; ‘टोकरी’ इसका सरल और प्रचलित हिंदी अर्थ है।
- source_word: מִיָּדֶךָ
  choice: तुम्हारे हाथ से
  rationale: यह भेंट चढ़ाने वाले के हाथ से याजक को वस्तु दिए जाने का ठोस चित्र सुरक्षित रखता है।
- source_word: וְהִנִּיחוֹ
  choice: उसे ... रखे
  rationale: नוח के हिफ़ील रूप का यहाँ अर्थ किसी वस्तु को किसी स्थान पर रखना है; कर्मवाचक प्रत्यय टोकरी की ओर संकेत करता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: वेदी के संबंध में इसका स्थानसूचक अर्थ ‘सामने’ है; यह आधुनिक हिंदी में स्वाभाविक है।
- source_word: מִזְבַּח
  choice: वेदी
  rationale: बलि अथवा भेंट चढ़ाने की वेदी के लिए मानक हिंदी शब्द।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबल परंपरा में टेट्राग्राम YHWH के व्यक्तिगत नाम का परिचित लिप्यंतरण ‘यहोवा’ है; इसे केवल उपाधि से नहीं बदला गया।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को बनाए रखते हुए वाचा-संबंधी प्रत्यक्ष संबोधन व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम YHWH है। हिंदी पाठकों के लिए प्रचलित नामरूप ‘यहोवा’ रखा गया है, जबकि पादटिप्पणी मूल इब्रानी रूप स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण है। विधिक-अनुष्ठानिक क्रम को ‘तब ... लेकर ... रखे’ से स्वाभाविक हिंदी में व्यक्त किया गया है; एकवचन ‘तुम्हारे’ संबोधन और ठोस ‘हाथ से’ रूपक को सुरक्षित रखा गया है।
