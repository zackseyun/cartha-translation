reference: Deuteronomy 26:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי תָב֣וֹא אֶל הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֥בְתָּ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/001.yaml
  text: And when you come into the land that Yahweh your God is giving you as an inheritance[a], and you take possession of it and live in it[b],
translation:
  language: hi
  text: और जब तुम उस देश में प्रवेश करोगे जिसे याहवे, तुम्हारा परमेश्वर, तुम्हें विरासत के रूप में दे रहा है, और तुम उस पर अधिकार करोगे और उसमें बसोगे,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और जब
  rationale: यह इब्रानी सूत्र भविष्य की परिस्थिति का परिचय देता है। आधुनिक हिन्दी में “और जब” इसके कालसूचक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תָבֹוא אֶל הָאָרֶץ
  choice: उस देश में प्रवेश करो
  rationale: בוא के साथ אֶל यहाँ किसी देश के भीतर जाने को दर्शाता है; “प्रवेश करो” आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; हिन्दी में प्रचलित प्रतिलेखन “यहोवा” नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: एकवचन संबोधन और वाचाई संबंध दोनों सुरक्षित रहते हैं।
- source_word: נֹתֵן לְךָ
  choice: तुम्हें ... दे रहा है
  rationale: वर्तमान कृदंत ongoing अथवा निकट भविष्य में निश्चित रूप से घटने वाली देन को व्यक्त करता है; यह रूप उसकी तात्कालिकता बनाए रखता है।
- source_word: נַחֲלָה
  choice: विरासत के रूप में
  rationale: यह शब्द आवंटित पैतृक संपत्ति अथवा विरासत को सूचित करता है और देश के वाचाई वरदान का भाव बनाए रखता है।
- source_word: וִירִשְׁתָּהּ
  choice: उस पर अधिकार कर लो
  rationale: देश के प्रसंग में ירשׁ का सक्रिय अर्थ उसे अपने अधिकार में लेना है; यह अनुवाद पहले आए “विरासत” के साथ अनावश्यक पुनरुक्ति से बचता है।
- source_word: וְיָשַׁבְתָּ בָּהּ
  choice: उसमें बस जाओ
  rationale: ישׁב यहाँ स्थायी निवास स्थापित करने का अर्थ देता है; “बस जाओ” सामान्य आधुनिक हिन्दी में इस भाव को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का व्यक्तिगत ईश्वरीय नाम बनाए रखा गया है, उसे “प्रभु” जैसी उपाधि से नहीं बदला गया। “यहोवा” सामान्य हिन्दी बाइबलीय प्रयोग में अधिक पहचाना जाने वाला प्रतिलेखन है।
- issue: देश का वरदान और इस्राएल द्वारा उस पर अधिकार
  choice: परमेश्वर की देन और लोगों के अधिकार करने की क्रिया को अलग-अलग रखा गया
  alternative: दोनों को केवल देश प्राप्त करने के एक कथन में मिला देना
  rationale: इब्रानी पाठ प्रवेश, परमेश्वर की देन, अधिकार करने और बसने का क्रम प्रस्तुत करता है। इसे बनाए रखने से ईश्वरीय वरदान और मानवीय अधिग्रहण दोनों स्पष्ट रहते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन पुल्लिंग संबोधन के लिए “तुम” प्रयुक्त है। यह पद अगले वाक्य से जुड़ा हुआ है, इसलिए अंत में अल्पविराम रखा गया है।
