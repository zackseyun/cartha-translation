  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/נִּצְעַ֕ק אֶל יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתֵ֑י/נוּ וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת קֹלֵ֔/נוּ וַ/יַּ֧רְא אֶת עָנְיֵ֛/נוּ וְ/אֶת עֲמָלֵ֖/נוּ וְ/אֶת לַחֲצֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/007.yaml
  text: Then we cried out to Yahweh[a], the God of our fathers, and Yahweh heard our voice and saw our affliction, our labor[b], and our oppression.
translation:
  language: hi
  text: तब हमने अपने पूर्वजों के परमेश्वर यहवे को पुकारा, और यहवे ने हमारी आवाज़ सुनी और हमारा दुःख, हमारा कठिन परिश्रम और हमारा उत्पीड़न देखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: हमने ... पुकारा
  rationale: צעק संकट में सहायता के लिए की गई तीव्र पुकार को व्यक्त करता है; हिंदी में ‘पुकारा’ इस आशय को स्वाभाविक रूप से पहुँचाता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को उपाधि से बदलने के बजाय हिंदी में निकट लिप्यंतरण के रूप में रखा गया है।
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: अपने पूर्वजों के परमेश्वर
  rationale: यह वाक्य इस्राएल के पितरों के परमेश्वर के रूप में यहवे की वाचागत पहचान बताता है; ‘पूर्वजों’ से आधुनिक हिंदी में सामूहिक ऐतिहासिक संबंध स्पष्ट रहता है।
- source_word: וַיִּשְׁמַע ... אֶת קֹלֵנוּ
  choice: हमारी आवाज़ सुनी
  rationale: मूल का शाब्दिक बिंब सुरक्षित है और हिंदी में इसका अर्थ उनकी विनती सुनना भी स्वाभाविक रूप से समझा जाता है।
- source_word: וַיַּרְא
  choice: देखा
  rationale: सरल क्रिया मूल के अर्थ और परमेश्वर के ध्यान देने की अंतर्निहित गंभीरता को बिना विस्तार जोड़े बनाए रखती है।
- source_word: עָנְיֵנוּ
  choice: हमारा दुःख
  rationale: עֳנִי दीनता, कष्ट या दुर्दशा को दर्शाता है; ‘दुःख’ सामान्य पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: עֲמָלֵנוּ
  choice: हमारा कठिन परिश्रम
  rationale: עָמָל श्रम के साथ उसकी कष्टदायक और बोझिल प्रकृति को भी व्यक्त कर सकता है; ‘कठिन परिश्रम’ मिस्र में थोपी गई मेहनत को स्पष्ट करता और आसपास के पदों से अलग रखता है।
- source_word: לַחֲצֵנוּ
  choice: हमारा उत्पीड़न
  rationale: לַחַץ दमनकारी दबाव या उत्पीड़न को दर्शाता है; निर्गमन के प्रसंग में ‘उत्पीड़न’ सटीक है।
theological_decisions:
- issue: वाचा-नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल इब्रानी पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना आधुनिक हिंदी लिपि में प्रस्तुत करता है।
- issue: אֲבֹתֵינוּ का सामूहिक संदर्भ
  choice: हमारे पूर्वजों
  alternative: हमारे पितरों
  rationale: यह पद इस्राएल के कुलपिताओं की ओर संकेत करता है। ‘पूर्वजों’ का चुनाव उस ऐतिहासिक-वाचागत संबंध को बनाए रखते हुए आज के सामान्य पाठक के लिए सहज है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और वाचिक पाठ के अनुकूल रखी गई है। समानांतर तीन संज्ञाओं—दुःख, कठिन परिश्रम, उत्पीड़न—का भेद सुरक्षित रखा गया है।
