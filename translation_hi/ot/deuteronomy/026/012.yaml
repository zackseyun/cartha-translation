  text: כִּ֣י תְכַלֶּ֞ה לַ֠/עְשֵׂר אֶת כָּל מַעְשַׂ֧ר תְּבוּאָתְ/ךָ֛ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ת שְׁנַ֣ת הַֽ/מַּעֲשֵׂ֑ר וְ/נָתַתָּ֣ה לַ/לֵּוִ֗י לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָֽ/אַלְמָנָ֔ה וְ/אָכְל֥וּ בִ/שְׁעָרֶ֖י/ךָ וְ/שָׂבֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/012.yaml
  text: When you have finished tithing all the tithe of your produce in the third year[a], the year of the tithe, then you shall give it to the Levite, the sojourner, the fatherless, and the widow, and they shall eat within your gates and be satisfied.
translation:
  language: hi
  text: जब तुम तीसरे वर्ष में, अर्थात् दशमांश के वर्ष में, अपनी उपज का पूरा दशमांश अलग कर चुके हो, तब उसे लेवीय, परदेशी, अनाथ और विधवा को देना, और वे तुम्हारे नगरों[a] में खाएँ और तृप्त हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे फाटकों के भीतर”; अर्थात् तुम्हारे नगरों या बस्तियों में।
    reason: हिब्रू मुहावरे का शाब्दिक रूप और उसका प्रसंगगत अर्थ दोनों सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: כִּי תְכַלֶּה לַעְשֵׂר
  choice: जब तुम...पूरा दशमांश अलग कर चुके हो
  rationale: כִּי यहाँ कालसूचक है और תְכַלֶּה कार्य की पूर्णता बताता है। לַעְשֵׂר को 'दशमांश अलग करना' कहना आधुनिक हिन्दी में स्वाभाविक रहते हुए दशमांश की क्रिया को स्पष्ट करता है।
- source_word: כָּל מַעְשַׂר תְּבוּאָתְךָ
  choice: अपनी उपज का पूरा दशमांश
  rationale: כָּל यहाँ दशमांश की पूरी मात्रा पर बल देता है; תְּבוּאָה भूमि की कृषि-उपज को दर्शाता है।
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁת שְׁנַת הַמַּעֲשֵׂר
  choice: तीसरे वर्ष में, अर्थात् दशमांश के वर्ष में
  rationale: दूसरा पदबंध तीसरे वर्ष की व्याख्या करता है; 'अर्थात्' हिन्दी में इस संबंध को स्पष्ट और सहज बनाता है।
- source_word: לַלֵּוִי לַגֵּר לַיָּתוֹם וְלָאַלְמָנָה
  choice: लेवीय, परदेशी, अनाथ और विधवा को
  rationale: विशिष्ट सामाजिक-वाचा संबंधी वर्गों को सामान्यीकृत किए बिना रखा गया है। גֵּר के लिए 'परदेशी' ऐसा गैर-इस्राएली निवासी सूचित करता है जो समुदाय के बीच रहता है; יָתוֹם का प्रचलित और स्वाभाविक हिन्दी रूप 'अनाथ' है।
- source_word: וְאָכְלוּ בִשְׁעָרֶיךָ וְשָׂבֵעוּ
  choice: ताकि वे तुम्हारे नगरों में खाएँ और तृप्त हों
  rationale: अनुक्रम का आशय लाभार्थियों के भोजन और तृप्ति से है। בִשְׁעָרֶיךָ का शाब्दिक अर्थ 'तुम्हारे फाटकों के भीतर' है, पर व्यवस्थाविवरण के नगर-संदर्भ में यह स्थानीय बस्तियों/नगरों का मुहावरा है।
theological_decisions:
- issue: दशमांश के निर्दिष्ट लाभार्थी
  choice: लेवीय, परदेशी, अनाथ और विधवा—चारों ठोस श्रेणियाँ बनाए रखी गईं
  alternative: जरूरतमंद लोग अथवा आधुनिक सामाजिक वर्गों में व्यापक व्याख्या
  rationale: मूल विधान विशेष वाचा-सामाजिक लाभार्थियों को नाम से बताता है; व्यापक परिभाषा कानूनी और धर्मवैचारिक बनावट को बदल देती।
- issue: בִשְׁעָרֶיךָ का शाब्दिक या मुहावरेदार अनुवाद
  choice: मुख्य पाठ में 'तुम्हारे नगरों में'
  alternative: तुम्हारे फाटकों के भीतर
  rationale: यहाँ 'फाटक' पूरे नगर/स्थानीय बस्ती के लिए लक्षणा है। आधुनिक हिन्दी में मुहावरे का अर्थ मुख्य पाठ में देना अधिक बोधगम्य है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- issue: वाक्य के अंतिम खंड का संबंध
  choice: '''ताकि'' द्वारा देने के व्यावहारिक उद्देश्य को व्यक्त किया'
  alternative: और वे...खाएँगे
  rationale: हिब्रू में संयोजक क्रम बना रहता है; प्रसंग में परिणाम/उद्देश्य निहित है। हिन्दी में 'ताकि' स्वाभाविक है और यह कोई अतिरिक्त धर्मसिद्धान्त आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। 'दशमांश', 'लेवीय' और 'तृप्त' जैसे स्थापित बाइबलीय शब्द रखे गए हैं; वाक्य-संरचना को हिन्दी के स्वाभाविक क्रम में ढाला गया है।
