reference: Deuteronomy 26:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְבִאֵ֖/נוּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יִּתֶּן לָ֨/נוּ֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/009.yaml
  text: And he brought us to this place and gave us this land[b][a], a land flowing with milk and honey.
translation:
  language: hi
  text: वह हमें इस स्थान पर ले आया और उसने हमें यह देश दिया—एक ऐसा देश, जहाँ दूध और शहद[b] की धाराएँ बहती हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “दूध और शहद से भरपूर देश”; इब्रानी मुहावरा उर्वरता और प्रचुरता का चित्र प्रस्तुत करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “शहद” में कुछ संदर्भों में खजूर जैसे फलों का गाढ़ा मीठा रस भी शामिल हो सकता है, केवल मधुमक्खियों का शहद ही नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִאֵנוּ
  choice: वह हमें ... ले आया
  rationale: בוא के हिफ़ील रूप में गंतव्य तक पहुँचाने का कारक भाव है। ‘ले आया’ इस भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: इस स्थान पर
  rationale: אֶל गंतव्य की ओर गति बताता है और הַמָּקוֹם הַזֶּה का सीधा अर्थ ‘यह स्थान’ है। हिन्दी में ‘इस स्थान पर ले आया’ स्वाभाविक है।
- source_word: וַיִּתֶּן לָנוּ
  choice: और उसने हमें ... दिया
  rationale: נתן के साथ ל recipient को दर्शाता है। ‘हमें दिया’ सरल और सीधा अनुवाद है; कर्ता-सर्वनाम दोहराने से हिन्दी वाक्य स्पष्ट रहता है।
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: यह देश
  rationale: यहाँ אֶרֶץ उस विशिष्ट भूभाग को सूचित करता है जो इस्राएल को दिया गया। इस संदर्भ में ‘देश’ साधारण हिन्दी पाठक के लिए ‘भूमि’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: एक ऐसा देश, जहाँ दूध और शहद की धाराएँ बहती हैं
  rationale: זָבַת का प्रवाहित होने वाला सजीव बिंब बनाए रखते हुए हिन्दी में ‘धाराएँ बहती हैं’ उर्वरता और प्रचुरता का भाव स्वाभाविक रूप से पहुँचाता है।
- source_word: דְבָשׁ
  choice: शहद
  rationale: דְבָשׁ का सामान्य अर्थ शहद है। आधुनिक हिन्दी में ‘शहद’ स्पष्ट और सर्वसुलभ है; खजूर जैसे फलों के गाढ़े रस की संभावित अर्थ-व्याप्ति पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ऐतिहासिक विश्वास-घोषणा में दिव्य कर्ता का उल्लेख
  choice: ‘वह’ सर्वनाम बनाए रखा गया
  alternative: ‘यहोवा हमें इस स्थान पर ले आया’
  rationale: इस पद के इब्रानी पाठ में कर्ता का नाम स्पष्ट रूप से नहीं आया, बल्कि पूर्ववर्ती संदर्भ से समझा जाता है। ‘वह’ मूल पाठ की संदर्भगत निरंतरता बनाए रखता है और पद में दिव्य नाम नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दूध और शहद की धाराएँ बहती हैं’ मूल इब्रानी बिंब को बनाए रखता है, जबकि पादटिप्पणी उसके मुहावरेदार अर्थ को स्पष्ट करती है।
