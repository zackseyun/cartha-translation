  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּֽ/לְ/תִתְּ/ךָ֣ עֶלְי֗וֹן עַ֤ל כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר עָשָׂ֔ה לִ/תְהִלָּ֖ה וּ/לְ/שֵׁ֣ם וּ/לְ/תִפְאָ֑רֶת וְ/לִֽ/הְיֹתְ/ךָ֧ עַם קָדֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ כַּ/אֲשֶׁ֥ר דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/019.yaml
  text: and to set you high above all the nations that he has made[a], for praise and for name and for beauty, and for you to be a holy people to Yahweh your God[c][b], as he has spoken.
translation:
  language: hi
  text: और वह तुम्हें अपनी बनाई हुई सब जातियों से ऊँचा ठहराएगा—प्रशंसा, यश[a] और शोभा[b] के लिए—और तुम अपने परमेश्वर यहोवा की पवित्र प्रजा होगे, जैसा उसने कहा है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “नाम”; यहाँ अर्थ प्रसिद्धि या यश है।
    reason: lexical_alternative
  - marker: b
    text: या “वैभव” अथवा “महिमा।”
    reason: lexical_alternative
  - marker: c
    text: या “जैसा उसने प्रतिज्ञा की है”; शाब्दिक रूप से “जैसा उसने कहा है।”
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְתִתְּךָ עֶלְיוֹן עַל כָּל הַגּוֹיִם אֲשֶׁר עָשָׂה
  choice: और वह तुम्हें अपनी बनाई हुई सब जातियों से ऊँचा ठहराएगा
  rationale: נתן के उद्देश्य/परिणामसूचक प्रयोग और עֶלְיוֹן עַל की तुलनात्मक ऊँचाई को स्वाभाविक हिन्दी में व्यक्त करता है। सम्बन्धवाचक उपवाक्य को 'अपनी बनाई हुई' से संक्षिप्त और स्पष्ट रखा गया है।
- source_word: לִתְהִלָּה
  choice: प्रशंसा के लिए
  rationale: תְּהִלָּה का मूल भाव 'प्रशंसा' है और לְ उद्देश्य अथवा परिणाम बताता है।
- source_word: וּלְשֵׁם
  choice: यश के लिए
  rationale: इस सन्दर्भ में שֵׁם का अर्थ केवल शाब्दिक 'नाम' नहीं, बल्कि प्रसिद्धि या प्रतिष्ठा है; 'यश' हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: וּלְתִפְאָרֶת
  choice: शोभा के लिए
  rationale: תִּפְאֶרֶת में शोभा, वैभव और महिमा का अर्थक्षेत्र है। 'शोभा' इसके सौन्दर्यात्मक पक्ष को बनाए रखती है और त्रिक को अनावश्यक रूप से समानार्थी नहीं बनाती।
- source_word: וְלִהְיֹתְךָ עַם קָדֹשׁ
  choice: और तुम ... पवित्र प्रजा होगे
  rationale: इब्रानी उद्देश्यसूचक infinitive को हिन्दी में भविष्यसूचक परिणाम के रूप में स्वाभाविक ढंग से व्यक्त किया गया है; עַם के लिए covenantal संदर्भ में 'प्रजा' उपयुक्त है।
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा की
  rationale: לְ के सम्बन्ध/अधिकार भाव को हिन्दी के सम्बन्धकारक 'की' से स्पष्ट किया गया है। יהוה को उसके व्यक्तिगत नाम 'यहोवा' से प्रस्तुत किया गया है।
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: जैसा उसने कहा है
  rationale: דבר का प्रत्यक्ष अर्थ 'कहा/बोला' है। यह वाक्य स्वाभाविक हिन्दी है और 'प्रतिज्ञा की' जैसा व्याख्यात्मक विस्तार मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: अन्तिम उपवाक्य को स्पष्ट रूप से प्रतिज्ञासूचक बनाना
  choice: जैसा उसने कहा है
  alternative: जैसा उसने प्रतिज्ञा की है
  rationale: इब्रानी क्रिया केवल बोलने या कहने को व्यक्त करती है। वाचा का प्रसंग प्रतिज्ञा का संकेत देता है, पर मुख्य पाठ में उस संकेत को अनिवार्य अर्थ नहीं बनाया गया।
- issue: יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: यहाँ परमेश्वर का व्यक्तिगत वाचा-नाम है; 'यहोवा' नाम और 'अपने परमेश्वर' पद के बीच का भेद सुरक्षित रखता है।
- issue: इस्राएल को जातियों से ऊँचा ठहराने का स्वरूप
  choice: पाठ के उद्देश्यसूचक पदों—प्रशंसा, यश और शोभा—को बिना अतिरिक्त व्याख्या के रखा गया
  alternative: राजनीतिक या आध्यात्मिक सर्वोच्चता को स्पष्ट करना
  rationale: मूल पाठ ऊँचा किए जाने की घोषणा करता है, पर उसके स्वरूप को इनसे आगे परिभाषित नहीं करता; अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। वाक्य की इब्रानी उद्देश्य-श्रृंखला को हिन्दी में भविष्यसूचक मुख्य क्रियाओं और डैश से स्पष्ट किया गया है। 'जातियाँ', 'पवित्र प्रजा' और 'यहोवा' जैसे परिचित बाइबलीय शब्द बनाए रखे गए हैं।
