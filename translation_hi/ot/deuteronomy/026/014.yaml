base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/014.yaml
  text: I have not eaten any of it while in mourning[a], and I have not removed any of it while unclean, and I have not given any of it for the dead. I have obeyed the voice of Yahweh my God[c][b]; I have done according to all that you commanded me.
translation:
  language: hi
  text: मैंने शोक की अवस्था में उसमें से कुछ नहीं खाया[a], न अपनी अशुद्ध अवस्था में उसमें से कुछ हटाया[b], और न उसमें से कुछ मृतक के लिए दिया[c]। मैंने अपने परमेश्वर याहवे की वाणी मानी है; मैंने वह सब किया है जिसकी आज्ञा तूने मुझे दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने शोक में,’ ‘दुःख में,’ अथवा ‘क्लेश में।’
    reason: lexical_alternative
  - marker: b
    text: या ‘उसमें से कुछ जलाया’ अथवा ‘उसमें से कुछ दूर किया।’ इब्रानी क्रिया जलाने या हटाने—दोनों अर्थों में प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: c
    text: या ‘किसी मृत व्यक्ति के लिए’ अथवा ‘मृतक से संबंधित किसी काम के लिए’; यहाँ ठीक किस निषिद्ध उपयोग की बात है, यह स्पष्ट नहीं किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹנִי
  choice: शोक की अवस्था में
  rationale: אֹנִי दुःख, शोक या क्लेश का बोध करा सकता है। इस धार्मिक-विधिक प्रसंग में यह शोक की दशा में पवित्र अंश खाने की ओर संकेत करता है; हिन्दी अभिव्यक्ति स्वाभाविक रहते हुए इस अर्थ को बनाए रखती है।
- source_word: בִעַרְתִּי מִמֶּנּוּ
  choice: उसमें से कुछ हटाया
  rationale: पिएल रूप בִעַרְתִּי का अर्थ जलाना, नष्ट करना या हटा देना हो सकता है। 'हटाया' किसी एक तरीके को अनावश्यक रूप से निश्चित किए बिना व्यापक अर्थ सुरक्षित रखता है।
- source_word: בְּטָמֵא
  choice: अशुद्ध अवस्था में
  rationale: यह धार्मिक रीति से अशुद्ध होने की दशा को व्यक्त करता है। यह रूप सामान्य पाठक के लिए स्पष्ट है और विधिक संदर्भ भी बनाए रखता है।
- source_word: לְמֵת
  choice: मृतक के लिए
  rationale: इब्रानी वाक्यांश संक्षिप्त है और ठीक किस प्रकार के निषिद्ध उपयोग की बात है, यह नहीं बताता। यह अनुवाद अर्थ को अंत्येष्टि-भेंट, शव-संबंधी अशुद्धता या किसी अन्य विशिष्ट प्रथा तक सीमित नहीं करता।
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: वाणी मानी है
  rationale: यह इब्रानी मुहावरा केवल सुनने के बजाय आज्ञापालन का अर्थ देता है। 'वाणी मानी है' मूल की 'वाणी' वाली छवि और आज्ञापालन, दोनों को रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में निकट ध्वन्यात्मक लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: כְּכֹל אֲשֶׁר צִוִּיתָנִי
  choice: वह सब किया है जिसकी आज्ञा तूने मुझे दी थी
  rationale: यह आज्ञा के पूर्ण पालन को स्पष्ट, स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘मृतक के लिए’ कहे गए निषिद्ध उपयोग का स्वरूप
  choice: व्यापक अभिव्यक्ति ‘मृतक के लिए’ बनाए रखना
  alternative: अंत्येष्टि-विधियों के लिए; किसी शव के कारण; किसी मृत व्यक्ति को
  rationale: मूल पाठ उस उपयोग या प्रथा को स्पष्ट रूप से परिभाषित नहीं करता। व्यापक अनुवाद मूल की अस्पष्टता बनाए रखता है और किसी विशेष धार्मिक व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल विधिक-घोषणात्मक शैली रखी गई है। परमेश्वर को सीधे संबोधन में एकवचन ‘तू’ मूल इब्रानी की निकटता और बाइबलीय प्रार्थना-भाषा को दर्शाता है। समानांतर नकारात्मक वाक्यखंडों और अंतिम आज्ञापालन-घोषणा की संरचना सुरक्षित रखी गई है।
