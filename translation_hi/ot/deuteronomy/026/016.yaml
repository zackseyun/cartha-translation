base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/016.yaml
  text: This day Yahweh your God commands you to do these statutes and judgments[c][b][a]; and you shall keep and do them with all your heart and with all your soul.
translation:
  language: hi
  text: आज तुम्हारा परमेश्वर यहोवा तुम्हें इन विधियों और नियमों का पालन करने की आज्ञा देता है; और तुम अपने पूरे मन और अपने पूरे प्राण[a] से उन्हें मानना और उनका पालन करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्राण’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘जीवन’, ‘स्वयं’ या ‘समूचा अस्तित्व’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: आज
  rationale: यह पदबंध वर्तमान दिन पर बल देता है। आधुनिक हिन्दी में ‘आज’ स्वाभाविक और सटीक है; ‘आज के दिन’ अनावश्यक रूप से भारी होता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन को बनाए रखते हुए वाचा-संबंध की सीधी अभिव्यक्ति करता है।
- source_word: מְצַוְּךָ
  choice: तुम्हें ... आज्ञा देता है
  rationale: हिब्रू कृदंत की वर्तमान और तात्कालिक शक्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לַעֲשׂוֹת
  choice: पालन करने
  rationale: कानूनी-वाचा के प्रसंग में विधियों को ‘करना’ हिन्दी में अस्वाभाविक है; ‘पालन करना’ עשה की क्रियान्वयन-संबंधी शक्ति को स्पष्ट करता है।
- source_word: הַחֻקִּים
  choice: विधियों
  rationale: חֻקִּים के निर्धारित वैधानिक प्रावधानों का भाव देता है और अगले शब्द से भेद बनाए रखता है।
- source_word: הַמִּשְׁפָּטִים
  choice: नियमों
  rationale: מִשְׁפָּטִים के बाध्यकारी कानूनी नियमों/निर्णयों का पठनीय हिन्दी रूप है; ‘न्यायों’ यहाँ अस्पष्ट और अस्वाभाविक होता।
- source_word: וְשָׁמַרְתָּ וְעָשִׂיתָ אֹתָם
  choice: उनका ध्यान रखकर उनका पालन करना
  rationale: שמר और עשה की दोहरी आज्ञा को मिटाए बिना स्वाभाविक हिन्दी में सावधानीपूर्वक ध्यान रखने और क्रियान्वित करने का भाव देता है।
- source_word: בְּכָל לְבָבְךָ
  choice: अपने सारे मन से
  rationale: לֵבָב में विचार, इच्छा और भीतरी संकल्प सम्मिलित हैं; आधुनिक हिन्दी में ‘मन’ इस व्यापक भीतरी पक्ष को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: अपने सारे प्राण से
  rationale: נֶפֶשׁ की पारंपरिक वाचा-संबंधी अभिव्यक्ति को रखता है, जबकि पादटिप्पणी उसके ‘जीवन/समूचे अस्तित्व’ वाले व्यापक अर्थ को स्पष्ट करती है।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है; उसे केवल उपाधि ‘प्रभु’ से बदलने पर यह भेद खो जाता।
- issue: द्वितीय पुरुष एकवचन का सामूहिक संबोधन
  choice: तुम्हारा/तुम्हें/अपने
  alternative: तुम लोगों का/आपका अथवा ‘इस्राएल’ जोड़ना
  rationale: हिब्रू इस्राएल को सामूहिक रूप से एकवचन में संबोधित करता है। हिन्दी एकवचन रूप इस वाचा-संबंधी प्रत्यक्षता को बिना व्याख्यात्मक विस्तार के बनाए रखते हैं।
- issue: וְ से जुड़ी अगली आज्ञा का संबंध
  choice: इसलिए
  alternative: और
  rationale: वाक्य-संदर्भ में दूसरी आज्ञा पहली से निष्कर्षात्मक रूप से जुड़ती है; ‘इसलिए’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि साधारण ‘और’ भी संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज वाचा-कानूनी रजिस्टर अपनाया गया है। संबोधन एकवचन रखा गया है। ‘विधियाँ’ और ‘नियम’ निकटवर्ती हिब्रू कानूनी पदों का भेद यथासंभव बनाए रखते हैं।
