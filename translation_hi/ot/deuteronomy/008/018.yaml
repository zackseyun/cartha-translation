base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/018.yaml
  text: But you shall remember Yahweh your God[a], for it is he who gives you power to gain wealth, so that he may establish his covenant that he swore to your fathers[c][b], as it is this day.
translation:
  language: hi
  text: परन्तु तुम अपने परमेश्वर याहवे को स्मरण रखना, क्योंकि वही तुम्हें धन अर्जित करने की सामर्थ्य देता है[a], ताकि वह अपनी वाचा को स्थापित करे, जिसकी शपथ उसने तुम्हारे पितरों[b] से खाई थी—जैसा आज है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संपन्नता अथवा सफलता प्राप्त करने की सामर्थ्य।”
    reason: חָיִל और पूरे इब्रानी मुहावरे का अर्थ केवल धन तक सीमित न होकर साधन-संपन्नता या सफलता भी हो सकता है।
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “तुम्हारे पिता”; यहाँ वाचा से जुड़े पितृपुरुष अभिप्रेत हैं।
    reason: अֲבֹתֶיךָ के पुरुषवाचक रूप और उसके विशिष्ट वाचागत संदर्भ को स्पष्ट करना।
  - marker: c
    text: इब्रानी मुहावरा शाब्दिक रूप से “जैसा इस दिन” है; आशय है, “जैसा आज विद्यमान या स्पष्ट है।”
    reason: मुहावरे के शाब्दिक रूप और उसके प्रसंगगत वर्तमान-सत्यापन के अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: परन्तु तुम ... स्मरण रखना
  rationale: पिछले पद में आत्मश्रेय की चेतावनी के विपरीत प्रवाह को ‘परन्तु’ व्यक्त करता है; निर्देशात्मक प्रसंग में क्रिया का बल आज्ञा/दृढ़ आग्रह का है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा
  rationale: व्यक्तिगत दिव्य नाम और वाचागत ‘अपने परमेश्वर’ दोनों को स्पष्ट तथा स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: כִּי הוּא הַנֹּתֵן לְךָ כֹּחַ
  choice: क्योंकि वही तुम्हें ... सामर्थ्य देता है
  rationale: ‘वही’ स्वतंत्र सर्वनाम הוּא का जोर सुरक्षित रखता है; कृदन्त परमेश्वर के निरन्तर/विशिष्ट रूप से देने को दर्शाता है।
- source_word: לַעֲשׂוֹת חָיִל
  choice: धन अर्जित करने
  rationale: निकटवर्ती पद 17 के आर्थिक प्रसंग में यह मुहावरा धन-संपत्ति प्राप्त करने की क्षमता को दर्शाता है; ‘अर्जित’ आधुनिक और स्वाभाविक है।
- source_word: לְמַעַן הָקִים אֶת־בְּרִיתוֹ
  choice: ताकि वह अपनी ... वाचा को स्थापित करे
  rationale: לְמַעַן उद्देश्य बताता है और הָקִים वाचा को इतिहास में प्रभावी/दृढ़ रूप से कायम करने का भाव देता है।
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: जिसकी शपथ उसने तुम्हारे पूर्वजों से खाई थी
  rationale: यह वाचा के पितृपुरुषों की ओर संकेत करता है; हिन्दी में ‘पूर्वजों’ से अभिप्राय स्वाभाविक और स्पष्ट है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा आज प्रत्यक्ष है
  rationale: शाब्दिक ‘इस दिन के समान’ के बजाय प्रचलित व्यवस्थाविवरणीय मुहावरे का वर्तमान, दिखाई देने वाला प्रमाण व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी बाइबलीय परम्परा में ‘यहोवा’ व्यक्तिगत नाम के रूप में व्यापक और सहज है; इसे ‘प्रभु’ उपाधि से नहीं बदला गया।
- issue: חָיִל का प्रसंगगत अर्थ
  choice: धन
  alternative: सफलता / संपन्नता
  rationale: पद 17 में संपत्ति को अपनी शक्ति से पाने के दावे का सीधा प्रत्युत्तर होने के कारण आर्थिक अर्थ प्रधान है, यद्यपि शब्द का अर्थ अधिक व्यापक हो सकता है।
- issue: הָקִים का वाचागत अर्थ
  choice: स्थापित करे
  alternative: दृढ़ करे / पूरा करे
  rationale: ‘स्थापित’ वाचा को ऐतिहासिक रूप से प्रभावी करने का भाव रखता है, बिना यह कहे कि वाचा पहले अस्तित्व में नहीं थी।
- issue: אֲבֹתֶיךָ का संदर्भ
  choice: पूर्वजों
  alternative: पितरों / पितृपुरुषों
  rationale: संदर्भ विशेषतः वाचा के पितृपुरुषों का है; मुख्य पाठ में ‘पूर्वजों’ सामान्य पाठक के लिए स्वाभाविक है और पादटिप्पणी विशिष्टता स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। ‘स्मरण रखना’, ‘सामर्थ्य’, ‘वाचा’ और ‘स्थापित’ बाइबलीय गंभीरता रखते हैं, जबकि वाक्य-विन्यास समकालीन और स्पष्ट है।
