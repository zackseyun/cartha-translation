source:
  edition: WLC
  text: וְ/אָכַלְתָּ֖ וְ/שָׂבָ֑עְתָּ וּ/בֵֽרַכְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ עַל הָ/אָ֥רֶץ הַ/טֹּבָ֖ה אֲשֶׁ֥ר נָֽתַן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/010.yaml
  text: And you shall eat and be satisfied[a], and you shall bless Yahweh your God for the good land that he has given you.
translation:
  language: hi
  text: तुम खाओगे और तृप्त होगे, और उस अच्छे देश के लिए, जो उसने तुम्हें दिया है, तुम अपने परमेश्वर याहवे को धन्य कहोगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धन्यवाद दोगे” अथवा “स्तुति करोगे।” इब्रानी में शब्दशः “आशीष दोगे” है—यह कृतज्ञता से परमेश्वर के विषय में भला कहने का बाइबलीय मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: तुम खाओगे
  rationale: संयोजक वाव के साथ क़ाल पूर्ण 2 पुं. एक. इस वाचा-संबंधी उपदेश में भावी/परिणामी क्रम व्यक्त करता है। यह अनुवाद कथन के निर्देशात्मक स्वर को बनाए रखता है।
- source_word: וְשָׂבָעְתָּ
  choice: तृप्त होगे
  rationale: क्रिया का अर्थ भरपेट होने या पर्याप्त पाकर संतुष्ट होने से है; ‘तृप्त’ शारीरिक पूर्णता और संतोष दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּבֵרַכְתָּ
  choice: धन्य कहोगे
  rationale: परमेश्वर को कर्म के रूप में लेकर ברך का अर्थ उसके विषय में भला कहना, उसकी स्तुति करना और कृतज्ञता व्यक्त करना है। ‘धन्य कहोगे’ इब्रानी बाइबलीय मुहावरे को बनाए रखते हुए हिंदी में ‘आशीष दोगे’ से अधिक स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम का हिंदी लिप्यंतरण है; इसे किसी उपाधि से बदलने के बजाय मूल पाठ में दिए गए वाचा-नाम के रूप में रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: 2 पुं. एक. प्रत्यय संबंध और वाचा-संबंधी अपनत्व बताता है; हिंदी वाक्य में ‘अपने’ कर्ता के साथ इसका संबंध स्पष्ट और स्वाभाविक करता है।
- source_word: עַל
  choice: के लिए
  rationale: यहाँ על उस कारण या अवसर को प्रस्तुत करता है जिसके कारण याहवे को धन्य कहा जाता है।
- source_word: הָאָרֶץ הַטֹּבָה
  choice: उस अच्छे देश
  rationale: सीधा अनुवाद वाचा में दिए गए देश की भलाई के व्यापक अर्थ को बनाए रखता है और उसे केवल उपजाऊ या मनोहर होने तक सीमित नहीं करता।
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: जो उसने तुम्हें दिया है
  rationale: संबंधवाचक उपवाक्य में देने वाला स्पष्टतः परमेश्वर है। हिंदी का पूर्ण वर्तमान उस दिए हुए उपहार की बनी हुई प्रासंगिकता व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘यहोवा प्रभु’ जैसी पारंपरिक अभिव्यक्ति
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी लिप्यंतरण है और नाम को उपाधि से नहीं बदलता।
- issue: परमेश्वर के लिए ברך का अर्थ
  choice: धन्य कहोगे
  alternative: धन्यवाद दोगे अथवा स्तुति करोगे
  rationale: इब्रानी मुहावरा कृतज्ञता और स्तुति दोनों को समेट सकता है। ‘धन्य कहोगे’ उसकी व्यापकता और बाइबलीय तनाव को बनाए रखता है; संकुचित अर्थों को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। मूल की समन्वयी वाक्य-रचना को बनाए रखा गया है; कोई स्पष्ट ‘जब…तब’ जोड़कर संबंध को आवश्यकता से अधिक निश्चित नहीं किया गया।
