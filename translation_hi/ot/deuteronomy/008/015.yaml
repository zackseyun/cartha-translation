base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/015.yaml
  text: who led you through the great and fearsome wilderness[a], with fiery serpents and scorpions and thirsty ground where there was no water; who brought out water for you from the flinty rock[b],
translation:
  language: hi
  text: जो तुम्हें उस विशाल और भयावह निर्जन प्रदेश में से ले चला, जहाँ दाहक साँप[a], बिच्छू और पानी से रहित सूखा प्रदेश[b] था; और जिसने तुम्हारे लिए चकमक की चट्टान से पानी निकाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विषैले साँप।’ इब्रानी अभिव्यक्ति सम्भवतः ऐसे साँपों को बताती है जिनके काटने से तेज जलन होती थी।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘प्यास’ या ‘प्यासा प्रदेश’; यह शब्द पानी से रहित झुलसी हुई शुष्कता को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹלִיכֲךָ
  choice: जो तुम्हें ... ले चला
  rationale: हिफ़ील कृदंत बड़े वाक्य में यहोवा के बीते कार्य का वर्णन करता है; हिन्दी में सम्बन्धवाचक उपवाक्य स्वाभाविक है।
- source_word: בַּמִּדְבָּר הַגָּדֹל וְהַנּוֹרָא
  choice: उस विशाल और भयावह जंगल में से
  rationale: מִדְבָּר निर्जन वन्य/मरुस्थलीय क्षेत्र है; ‘जंगल’ सामान्य हिन्दी बाइबलीय प्रयोग में निर्जन प्रदेश का बोध कराता है, जबकि ‘में से’ यात्रा के आर-पार ले जाने को व्यक्त करता है। ‘विशाल और भयावह’ दोनों विशेषणों को बनाए रखता है।
- source_word: נָחָשׁ שָׂרָף
  choice: दाहक साँप
  rationale: שָׂרָף का मूल भाव जलाना है और सम्भवतः काटने से होने वाली जलन की ओर संकेत करता है। ‘दाहक’ इस चित्र को बनाए रखता है; सम्भावित अर्थ ‘विषैले साँप’ पादटिप्पणी में दिया गया है।
- source_word: וְעַקְרָב
  choice: बिच्छू
  rationale: यह सीधा और प्रचलित हिन्दी समतुल्य है; यहाँ एकवचन रूप जातिवाचक/सामूहिक अर्थ में स्वाभाविक है।
- source_word: וְצִמָּאוֹן אֲשֶׁר אֵין מָיִם
  choice: पानी से रहित सूखा प्रदेश
  rationale: צִמָּאוֹן प्यास अथवा झुलसी हुई शुष्कता को दर्शाता है। साथ का वाक्यांश ‘जहाँ पानी नहीं’ पर्यावरणगत अर्थ को बल देता है, इसलिए सहज हिन्दी में ‘सूखा प्रदेश’ चुना गया है।
- source_word: הַמּוֹצִיא לְךָ מַיִם
  choice: जिसने तुम्हारे लिए ... पानी निकाला
  rationale: יצא का हिफ़ील कृदंत पानी को बाहर निकालने के कारणात्मक और ठोस चित्र को सुरक्षित रखता है।
- source_word: מִצּוּר הַחַלָּמִישׁ
  choice: चकमक की चट्टान से
  rationale: צוּר चट्टान और חַלָּמִישׁ चकमक अथवा अत्यन्त कठोर पत्थर को दर्शाता है; यह पदबंध दोनों अर्थों को संक्षेप में रखता है।
theological_decisions:
- issue: जंगल के संकटों का स्वरूप
  choice: साँप, बिच्छू और जलहीन शुष्क प्रदेश को इस्राएल की यात्रा के वास्तविक संकटों के रूप में प्रस्तुत किया गया है।
  alternative: इन संकटों को रूपक मानना या सामान्य रूप से केवल ‘खतरों’ कहना।
  rationale: इब्रानी पाठ ऐतिहासिक जंगल-यात्रा में परमेश्वर की अगुवाई और प्रबन्ध को ठोस चित्रों में स्मरण कराता है; अनुवाद उनमें कोई अतिरिक्त प्रतीकात्मक अर्थ नहीं जोड़ता।
- issue: נָחָשׁ שָׂרָף का आशय
  choice: ‘दाहक साँप’ द्वारा जलने/जलन का मूल चित्र सुरक्षित रखा गया है।
  alternative: ‘विषैले साँप’, जो सम्भवतः उनके काटने के प्रभाव को स्पष्ट करता है।
  rationale: पाठ यह निश्चित नहीं करता कि विशेषण साँप की आकृति, उसके विष या काटने से होने वाली जलन को बताता है; इसलिए मुख्य पाठ और पादटिप्पणी मिलकर इस वास्तविक अस्पष्टता को बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद अपने पूर्ववर्ती वाक्य से व्याकरणिक रूप से जुड़ा है, इसलिए आरम्भ में ‘जो’ रखा गया है। ‘दाहक’ और ‘चकमक’ जैसे शब्द मूल बिंबों को बचाते हैं, जबकि पादटिप्पणियाँ कम परिचित अर्थों को स्पष्ट करती हैं।
