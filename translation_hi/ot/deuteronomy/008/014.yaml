  yaml_path: translation/ot/deuteronomy/008/014.yaml
  text: then your heart is lifted up[a], and you forget Yahweh your God, who brought you from the land of Egypt, from the house of servants.
translation:
  language: hi
  text: तब तुम्हारा मन घमंड से फूल जाएगा, और तुम याहवे, अपने परमेश्वर को भूल जाओगे, जो तुम्हें मिस्र देश से, दासों के घर से[a] निकाल लाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दासता के घर से” अथवा “गुलामी के घर से।” इब्रानी में शाब्दिक अर्थ है, “दासों के घर से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָם לְבָבֶךָ
  choice: तब तुम्हारा मन घमंड से फूल जाएगा
  rationale: रום का ऊँचा होने का रूपक यहाँ अहंकार सूचित करता है। हिंदी में ‘मन घमंड से फूल जाएगा’ इस रूपक और चेतावनी के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְשָׁכַחְתָּ
  choice: और तुम ... भूल जाओगे
  rationale: यह पूर्ण क्रिया आसपास की शर्त-परिणाम शृंखला को आगे बढ़ाती है; हिंदी भविष्यकाल उस चेतावनी को स्पष्ट और स्वाभाविक बनाता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय का संबंधसूचक अर्थ स्वाभाविक हिंदी में ‘अपने परमेश्वर’ से व्यक्त होता है।
- source_word: הַמּוֹצִיאֲךָ
  choice: जो तुम्हें ... निकाल लाया था
  rationale: संज्ञात्मक कृदंत यहवे को निर्गमन के कार्य द्वारा पहचानता है; संबंधवाचक उपवाक्य हिंदी में स्वाभाविक है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: यह मूल के ‘मिस्र की भूमि से’ का संक्षिप्त, औपचारिक और सहज हिंदी समतुल्य है।
- source_word: מִבֵּית עֲבָדִים
  choice: दासों के घर से
  rationale: עֲבָדִים बहुवचन ठोस संज्ञा ‘दास’ है; इसलिए अमूर्त ‘दासता’ के बजाय मूल की ठोस अभिव्यक्ति रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: वचन में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। ‘यहवे’ उसे उपाधि से प्रतिस्थापित किए बिना आधुनिक हिंदी में प्रस्तुत करता है।
- issue: מִבֵּית עֲבָדִים की ठोस अथवा अमूर्त अभिव्यक्ति
  choice: दासों के घर से
  alternative: दासता के घर से; गुलामी के घर से
  rationale: मूल में बहुवचन ‘दास’ है। ठोस अनुवाद इस्राएल की बंधुआ स्थिति को बनाए रखता है, यद्यपि अमूर्त हिंदी विकल्प अधिक मुहावरेदार हो सकते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रूप। ‘मन घमंड से फूल जाएगा’ मूल रूपक के अहंकारी आशय को स्वाभाविक हिंदी में रखता है; ईश्वरीय नाम ‘यहवे’ के रूप में लिप्यंतरित है।
