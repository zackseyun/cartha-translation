  edition: WLC
  text: אֶ֗רֶץ אֲשֶׁ֨ר לֹ֤א בְ/מִסְכֵּנֻת֙ תֹּֽאכַל בָּ֣/הּ לֶ֔חֶם לֹֽא תֶחְסַ֥ר כֹּ֖ל בָּ֑/הּ אֶ֚רֶץ אֲשֶׁ֣ר אֲבָנֶ֣י/הָ בַרְזֶ֔ל וּ/מֵ/הֲרָרֶ֖י/הָ תַּחְצֹ֥ב נְחֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/009.yaml
  text: a land in which you will not eat bread in poverty[a], in which you will lack nothing; a land whose stones are iron[b], and from whose hills you will quarry copper.
translation:
  language: hi
  text: एक ऐसा देश, जहाँ तुम दरिद्रता में रोटी नहीं खाओगे[a] और जहाँ तुम्हें किसी चीज़ की कमी नहीं होगी; ऐसा देश, जिसके पत्थर लोहे के हैं और जिसकी पहाड़ियों से तुम ताँबा खोद निकालोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अभाव में’ अथवा ‘तंगी में’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ ‘ताँबा’ या ‘काँसा’ हो सकता है; यहाँ ‘ताँबा’ अधिक उपयुक्त है, क्योंकि पद में पहाड़ियों से निकाले जाने वाले प्राकृतिक पदार्थ की बात है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְמִסְכֵּנֻת
  choice: दरिद्रता में
  rationale: यह संज्ञा गरीबी, अभाव या दीन दशा को व्यक्त करती है। ‘दरिद्रता में’ मूल की परिस्थितिजन्य अभिव्यक्ति को बनाए रखता है और अगली उपवाक्य की ‘कमी’ वाली बात को अनावश्यक रूप से दोहराता नहीं।
- source_word: לֶחֶם
  choice: रोटी
  rationale: मूल शब्द का प्राथमिक और ठोस अर्थ ‘रोटी’ है; प्रसंग में इसका व्यापक संकेत भोजन की ओर हो सकता है, पर अनुवाद में ठोस बिंब सुरक्षित रखा गया है।
- source_word: תֶחְסַר כֹּל
  choice: तुम्हें किसी चीज़ की कमी नहीं होगी
  rationale: यह स्वाभाविक आधुनिक हिन्दी में पूर्ण पर्याप्तता व्यक्त करता है और כֹּל के समग्र बल को बनाए रखता है।
- source_word: אֲבָנֶיהָ בַרְזֶל
  choice: जिसके पत्थर लोहा हैं
  rationale: इब्रानी की संक्षिप्त और सजीव कथन-शैली—‘उसके पत्थर लोहा [हैं]’—को सुरक्षित रखा गया है; सम्भावित आशय लौहयुक्त पत्थर या अयस्क है।
- source_word: תַּחְצֹב
  choice: खोद निकालोगे
  rationale: क्रिया का अर्थ काटकर या खोदकर निकालना है। पहाड़ियों से धातु निकालने के प्रसंग में यह सामान्य पाठक के लिए ‘उत्खनन करोगे’ की अपेक्षा अधिक सहज है।
- source_word: נְחֹשֶׁת
  choice: ताँबा
  rationale: शब्द ताँबे या काँसे का द्योतक हो सकता है। यहाँ पहाड़ियों से प्राकृतिक पदार्थ निकालने की बात है, इसलिए मिश्रधातु काँसे के बजाय ताँबा अधिक उपयुक्त है।
