  yaml_path: translation/ot/deuteronomy/008/004.yaml
  text: Your clothing did not wear out on you[a], and your foot did not swell[b], these forty years.
translation:
  language: hi
  text: इन चालीस वर्षों में तुम्हारे तन पर तुम्हारा वस्त्र पुराना नहीं हुआ[a], और तुम्हारा पैर नहीं सूजा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा पहनावा तुम्हारे तन पर जीर्ण नहीं हुआ।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारा पैर नहीं फूला”; कुछ लोग इस क्रिया को विशेष रूप से छाले पड़ने के अर्थ में समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְלָתְךָ
  choice: तुम्हारा वस्त्र
  rationale: שִׂמְלָה किसी पहनावे, विशेषकर बाहरी वस्त्र, को दर्शाता है। एकवचन ‘वस्त्र’ इब्रानी रूप को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בָלְתָה
  choice: न ... घिसा
  rationale: בלה का अर्थ पुराना या इस्तेमाल से जीर्ण होना है। वस्त्र के संदर्भ में ‘घिसा’ संक्षिप्त और सहज हिन्दी है।
- source_word: מֵעָלֶיךָ
  choice: तुम्हारे तन पर
  rationale: शाब्दिक भाव ‘तुम्हारे ऊपर से/ऊपर’ है। ‘तुम्हारे तन पर’ स्पष्ट करता है कि वस्त्र पहने रहने पर भी नहीं घिसा, और अनावश्यक रूप से उसके उतरने का अर्थ नहीं देता।
- source_word: וְרַגְלְךָ
  choice: और न तुम्हारा पैर
  rationale: इब्रानी में ‘पैर’ एकवचन है; हिन्दी में इसे सहज रूप से बनाए रखा गया है।
- source_word: בָצֵקָה
  choice: सूजा
  rationale: इस दुर्लभ क्रिया का पारंपरिक और संदर्भानुकूल अर्थ फूलना या सूजना है। ‘छाला पड़ा’ संभव व्याख्या है, पर शब्दार्थ की दृष्टि से कम निश्चित है।
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: इन चालीस वर्षों में
  rationale: अवधि बताने वाले इब्रानी मुहावरे का स्वाभाविक आधुनिक हिन्दी रूप है; यह पूरे चालीस वर्षों के दौरान निरंतर स्थिति व्यक्त करता है।
