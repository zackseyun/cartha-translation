source:
  edition: WLC
  text: כָּל הַ/מִּצְוָ֗ה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם תִּשְׁמְר֣וּ/ן לַ/עֲשׂ֑וֹת לְמַ֨עַן תִּֽחְי֜וּ/ן וּ/רְבִיתֶ֗ם וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/001.yaml
  text: You shall carefully keep every commandment that I am commanding you today[c][b][a], so that you may live and multiply and enter and possess the land that Yahweh swore to your fathers.
translation:
  language: hi
  text: आज मैं तुम्हें जो सारी आज्ञाएँ दे रहा हूँ, उनका सावधानी से पालन करो,[a] ताकि तुम जीवित रहो, संख्या में बढ़ो, और उस देश में प्रवेश करके उस पर अधिकार में लो[b] जिसे देने की शपथ याहवे ने तुम्हारे पितरों से खाई थी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पूरी आज्ञा।” इब्रानी में एकवचन शब्द सामूहिक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या “उसे विरासत में पाओ।” इब्रानी क्रिया का अर्थ संदर्भ के अनुसार विरासत में पाना या अधिकार में लेना हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “तुम्हारे पिताओं”; यहाँ आशय इस्राएल के पितृपुरुषों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַמִּצְוָה
  choice: सारी आज्ञाएँ
  rationale: इब्रानी में संज्ञा एकवचन होते हुए भी सामूहिक अर्थ रखती है। स्वाभाविक हिन्दी में बहुवचन ‘सारी आज्ञाएँ’ आदेशों की समग्रता स्पष्ट करता है; शाब्दिक विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: מְצַוְּךָ
  choice: मैं तुम्हें ... दे रहा हूँ
  rationale: कृदन्त वर्तमान और तात्कालिक क्रिया का भाव देता है। ‘आज्ञाएँ दे रहा हूँ’ आधुनिक हिन्दी में स्वाभाविक है। इब्रानी में यहाँ ‘तुम्हें’ एकवचन है, जबकि आसपास की क्रियाएँ बहुवचन हैं; हिन्दी रूप इस सामूहिक संबोधन को अनावश्यक रूप से नहीं सुलझाता।
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: उनका पालन करने में सावधान रहना
  rationale: שׁמר और ‘करने’ वाले पूरक पद, दोनों को मिलाकर ध्यानपूर्वक व्यवहार में लाने का अर्थ है। यह रूप केवल याद रखने के बजाय वास्तविक आज्ञापालन स्पष्ट करता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम का संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִּחְיוּן
  choice: तुम जीवित रहो
  rationale: मूल क्रिया का सीधा अर्थ जीवन बनाए रखना अथवा जीवित रहना है।
- source_word: וּרְבִיתֶם
  choice: संख्या में बढ़ो
  rationale: רבה यहाँ जनसंख्या में अनेक होने को दर्शाता है; ‘संख्या में बढ़ना’ आधुनिक पाठक के लिए ‘फलो-फूलो’ से अधिक सटीक है।
- source_word: וּבָאתֶם
  choice: प्रवेश करके
  rationale: प्रतिज्ञात देश में जाने के प्रसंग में ‘प्रवेश करना’ स्वाभाविक और स्पष्ट है।
- source_word: וִירִשְׁתֶּם
  choice: उस पर अधिकार कर लो
  rationale: ירשׁ का अर्थ इस प्रसंग में देश को विरासत में पाना अथवा उसे अपने अधिकार में लेना हो सकता है। मुख्य पाठ में ‘अधिकार कर लो’ संदर्भगत क्रियाशीलता को व्यक्त करता है और विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: व्यवस्थाविवरण में यह प्रतिज्ञात भूभाग को सूचित करता है। हिन्दी में ‘देश’ यहाँ स्वाभाविक है और निश्चित संदर्भ को ‘उस’ स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित व्यक्तिगत नाम ‘यहोवा’ मूल चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: נִשְׁבַּע
  choice: शपथ ... खाई थी
  rationale: निफ़अल रूप का अर्थ शपथ खाना है। हिन्दी मुहावरे में ‘शपथ खाना’ वाचा-संबंधी गंभीरता बनाए रखता है।
- source_word: לַאֲבֹתֵיכֶם
  choice: तुम्हारे पूर्वजों से
  rationale: शाब्दिक अर्थ ‘तुम्हारे पिताओं से’ है, पर यहाँ इस्राएल के कुलपिताओं/पूर्वजों का ऐतिहासिक संदर्भ है। ‘पूर्वजों’ से आशय स्वाभाविक हिन्दी में स्पष्ट होता है और शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। हिन्दी पाठकों में सुस्थापित ‘यहोवा’ नाम को बनाए रखता है; ‘प्रभु’ जैसी उपाधि से इसे प्रतिस्थापित नहीं किया गया।
- issue: כָּל הַמִּצְוָה की सामूहिक एकवचनता
  choice: सारी आज्ञाएँ
  alternative: पूरी आज्ञा
  rationale: मूल की व्याकरणिक एकवचनता सामूहिक है और पूरे आदेश-संग्रह की ओर संकेत कर सकती है। मुख्य पाठ में सहज हिन्दी चुनी गई है, जबकि वास्तविक वैकल्पिक पठन पाद-टिप्पणी में सुरक्षित है।
- issue: וִירִשְׁתֶּם में अधिकार और विरासत का तनाव
  choice: उस पर अधिकार कर लो
  alternative: उसे विरासत में पाओ
  rationale: क्रिया दोनों अर्थ-क्षेत्र रखती है। संदर्भ में भूमि में प्रवेश और उसे अपने अधिकार में लेना प्रमुख है, पर विरासत का संभावित भाव पाद-टिप्पणी में दिया गया है।
- issue: אֲבֹתֵיכֶם का संबंध-सूचक अर्थ
  choice: तुम्हारे पूर्वजों
  alternative: तुम्हारे पिताओं
  rationale: इस पद का संदर्भ इस्राएल के पितृपुरुषों से है। आधुनिक हिन्दी में ‘पूर्वज’ आशय को साफ करता है, जबकि मूल का पुल्लिंग शाब्दिक रूप पाद-टिप्पणी में दर्ज है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। वाक्य में मूसा का सामूहिक संबोधन, आज्ञापालन की सावधानी, उद्देश्य-परिणाम की शृंखला और भूमि-संबंधी वाचा का स्वर सुरक्षित है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
