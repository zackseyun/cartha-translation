  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁכֹ֤חַ תִּשְׁכַּח֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָֽלַכְתָּ֗ אַחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/עֲבַדְתָּ֖/ם וְ/הִשְׁתַּחֲוִ֣יתָ לָ/הֶ֑ם הַעִדֹ֤תִי בָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵדֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/019.yaml
  text: And if you indeed forget Yahweh your God and go after other gods and serve them and bow down to them[a], I testify against you today that you will surely perish.
translation:
  language: hi
  text: यदि तुम अपने परमेश्वर याहवे को सचमुच भूल जाओ[a], दूसरे देवताओं के पीछे चलो, उनकी सेवा करो और उनके आगे दण्डवत् करो, तो मैं आज तुम्हारे विरुद्ध गवाही देता हूँ कि तुम निश्चय ही नष्ट हो जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “भूलते हुए तुम भूल जाओ”—यह बलसूचक रचना है, जिसका अर्थ “सचमुच” या “निश्चय ही भूल जाओ” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: यदि ... तो
  rationale: यह शर्त के रूप में दी गई चेतावनी है। हिन्दी में ‘यदि ... तो’ स्वाभाविक रूप से इसकी शर्त और परिणाम को स्पष्ट करता है।
- source_word: שָׁכֹחַ תִּשְׁכַּח
  choice: सचमुच भूल जाओ
  rationale: क्रिया के साथ infinitive absolute भूलने की क्रिया पर बल देता है; ‘सचमुच’ उस बल को व्यक्त करता है, पर ‘पूरी तरह’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि में बदले बिना उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट रखता है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष प्रत्यय और वाचा-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है; कर्ता के संदर्भ में ‘अपने’ अधिक सहज है।
- source_word: וְהָלַכְתָּ אַחֲרֵי
  choice: के पीछे चलो
  rationale: यह निष्ठा और अनुसरण के इब्रानी मुहावरे को स्पष्ट रखते हुए उसकी गति-संबंधी छवि भी बचाता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: अर्थ सीधे ‘अन्य/दूसरे देवता’ है; ‘विदेशी’ कहना अनावश्यक व्याख्या जोड़ता।
- source_word: וַעֲבַדְתָּם
  choice: उनकी सेवा करो
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है। अगली क्रिया दण्डवत् करने को अलग से व्यक्त करती है, इसलिए दोनों क्रियाओं का भेद रखा गया है।
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: उनके आगे दण्डवत् करो
  rationale: यह क्रिया झुकने या भूमि तक झुककर सम्मान और उपासना करने का भाव रखती है; ‘दण्डवत् करना’ उसके शारीरिक और धार्मिक दोनों पहलुओं को व्यक्त करता है।
- source_word: הַעִדֹתִי בָכֶם הַיּוֹם
  choice: मैं आज तुम्हारे विरुद्ध गवाही देता हूँ
  rationale: वाक्यांश का न्यायिक और वाचा-संबंधी बल ‘गवाही देता हूँ’ तथा ‘विरुद्ध’ से बना रहता है; केवल ‘चेतावनी देता हूँ’ अपेक्षाकृत कमजोर होता।
- source_word: כִּי אָבֹד תֹּאבֵדוּן
  choice: कि तुम निश्चय ही नष्ट हो जाओगे
  rationale: infinitive absolute और finite verb का मेल परिणाम की दृढ़ निश्चितता पर बल देता है; ‘निश्चय ही’ वही बल प्रकट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: עבד और השתחוה के उपासना-संबंधी भेद को बनाए रखना
  choice: सेवा करो और ... दण्डवत् करो
  alternative: दोनों को ‘उपासना करो’ से व्यक्त करना
  rationale: मूल पाठ दो अलग क्रियाएँ रखता है—सेवा और झुककर सम्मान/उपासना। उन्हें एक ही शब्द में मिला देने से चेतावनी की संचयी तीव्रता घटती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए स्पष्ट रखी गई है। ‘दण्डवत्’ उपासना में पूर्णतः झुकने का परिचित और सटीक धार्मिक शब्द है। इब्रानी में आरम्भिक संबोधन एकवचन से बाद में बहुवचन की ओर जाता है; हिन्दी ‘तुम/तुम्हारे’ सामूहिक संबोधन में इस बदलाव को अस्वाभाविक विस्तार के बिना समेटता है।
