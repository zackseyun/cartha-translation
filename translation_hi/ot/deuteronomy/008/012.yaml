    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह पद पिछले संदर्भ पर निर्भर चेतावनी-वाक्य आरम्भ करता है। यह प्रयोग आधुनिक हिन्दी में निषेधात्मक आशंका और सावधानी, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תֹּאכַל וְשָׂבָעְתָּ
  choice: तुम खाकर तृप्त हो जाओ
  rationale: क्रियाओं का क्रम भावी समृद्धि की चेतावनी-परिस्थिति दिखाता है। ‘खाकर तृप्त हो जाओ’ शारीरिक रूप से भर जाने और संतुष्ट होने के अर्थ को संक्षेप में बनाए रखता है।
- source_word: וּבָתִּים טוֹבִים
  choice: अच्छे-अच्छे घर
  rationale: טוֹבִים गुणवत्ता और सुख-सुविधा वाले घरों को सूचित करता है। हिन्दी में ‘अच्छे-अच्छे घर’ बहुवचन और समृद्धि के भाव को सहज ढंग से व्यक्त करता है, बिना विलासिता का अतिरिक्त अर्थ जोड़े।
- source_word: תִּבְנֶה וְיָשָׁבְתָּ
  choice: बनाकर उनमें रहने लगो
  rationale: इब्रानी क्रम घर बनाने और फिर उनमें निवास करने को व्यक्त करता है। ‘उनमें’ सन्दर्भ से स्पष्ट पूरक है और स्वाभाविक हिन्दी के लिए आवश्यक है; ‘रहने लगो’ भावी अवस्था में प्रवेश का भाव देता है।
