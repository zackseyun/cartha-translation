  text: और तुम्हारे गाय-बैल[a] और भेड़-बकरियाँ बढ़ जाएँ, और तुम्हारे पास चाँदी और सोना बढ़ जाए, और जो कुछ तुम्हारा है वह सब बढ़ जाए[b]—
  philosophy: optimal-equivalence
  footnotes:
