    text: या, ‘तुम्हारे मवेशी।’ इब्रानी शब्द בקר विशेष रूप से गोवंशीय पालतू पशुओं का सामूहिक उल्लेख करता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘और तुम्हारे पास जो कुछ है वह सब बढ़ जाए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְקָרְךָ
  choice: और तुम्हारे गाय-बैल
  rationale: בקר विशेष रूप से गोवंशीय पालतू पशुओं का सामूहिक बोध कराता है। ‘गाय-बैल’ आधुनिक हिन्दी में इसे स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: וְצֹאנְךָ
  choice: और भेड़-बकरियाँ
  rationale: צאן छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, के लिए सामूहिक शब्द है; हिन्दी में ‘भेड़-बकरियाँ’ उसका स्वाभाविक समतुल्य है।
- source_word: יִרְבְּיוּן
  choice: बढ़ जाएँ
  rationale: רבה यहाँ पशुओं की संख्या बढ़ने को दर्शाता है। बहुवचन कर्ता के साथ ‘बढ़ जाएँ’ स्वाभाविक है।
- source_word: וְכֶסֶף וְזָהָב
  choice: और चाँदी और सोना
  rationale: मूल पाठ दोनों बहुमूल्य धातुओं का सीधे उल्लेख करता है; स्वामित्व का भाव अगले לָךְ से व्यक्त होता है।
- source_word: יִרְבֶּה לָךְ
  choice: तुम्हारे पास ... बढ़ जाए
  rationale: ‘तुम्हारे पास’ दत्तिव לָךְ में निहित प्राप्ति अथवा स्वामित्व के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְכֹל אֲשֶׁר לְךָ
  choice: और जो कुछ तुम्हारा है वह सब
  rationale: यह पदबंध व्यक्ति की समस्त संपत्ति का सार प्रस्तुत करता है और मूल की संबंधवाचक बनावट को बनाए रखता है।
- source_word: יִרְבֶּה
  choice: बढ़ जाए
  rationale: रבה का व्यापक अर्थ यहाँ समस्त संपत्ति की वृद्धि है; ‘बढ़ जाए’ पशुओं से आगे की वस्तुओं पर भी सहजता से लागू होता है।
