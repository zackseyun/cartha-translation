base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/002.yaml
  text: And you shall remember all the way that Yahweh your God has led you these forty years in the wilderness[a], in order to humble you, to test you, to know what was in your heart, whether you would keep his commandments or not.
translation:
  language: hi
  text: और उस पूरे मार्ग को याद रखना, जिस पर तुम्हारा परमेश्वर यहोवा तुम्हें इन चालीस वर्षों के दौरान निर्जन प्रदेश में ले चलता रहा, ताकि वह तुम्हें नम्र करे, तुम्हारी परीक्षा ले, और जाने कि तुम्हारे हृदय में क्या था—तुम उसकी आज्ञाओं को मानोगे या नहीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रकट करे कि तुम्हारे हृदय में क्या था।” इब्रानी में शाब्दिक रूप से “जाने कि तुम्हारे हृदय में क्या था” है; यही अभिव्यक्ति मुख्य पाठ में रखी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: और ... याद रखना
  rationale: संयोजक वाव के साथ पूर्ण क्रिया यहाँ उपदेशात्मक, आज्ञार्थक भाव रखती है; आधुनिक हिन्दी में ‘याद रखना’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל הַדֶּרֶךְ
  choice: उस पूरे मार्ग को
  rationale: यह केवल सड़क नहीं, जंगल की समूची यात्रा और अनुभव-क्रम को सूचित करता है; ‘पूरा मार्ग’ मूल रूपक को बनाए रखता है।
- source_word: הֹלִיכֲךָ
  choice: तुम्हें ... चलाता रहा
  rationale: हिफ़ील रूप का कारक भाव सुरक्षित रहता है और चालीस वर्षों तक जारी अगुवाई व्यक्त होती है; ‘ले चलता रहा’ भी सम्भव है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम का हिन्दी में प्रचलित लिप्यंतरण, किसी उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: सम्बन्धसूचक रूप वाचा-संबंध की भाषा को सुरक्षित रखता है।
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: इन चालीस वर्षों में
  rationale: अवधि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: ‘जंगल’ हिन्दी बाइबलीय प्रयोग में निर्जन वनप्रदेश के व्यापक अर्थ को व्यक्त करता है; आधुनिक पाठक के लिए ‘निर्जन प्रदेश’ भी सम्भव है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: उद्देश्य-सूचक संबंध को संक्षिप्त और स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: עַנֹּתְךָ
  choice: तुम्हें दीन करे
  rationale: संदर्भ में कठिनाई द्वारा नीचे लाने या नम्र करने का भाव है; ‘दीन करे’ पीड़ा और विनम्रता, दोनों की गुंजाइश रखता है।
- source_word: לְנַסֹּתְךָ
  choice: तुम्हारी परीक्षा ले
  rationale: נסה के जाँचने या परखने के मूल्यांकनात्मक भाव का स्पष्ट आधुनिक हिन्दी रूप।
- source_word: לָדַעַת
  choice: जाने
  rationale: मूल में ‘जानना’ ही है; इसे ‘प्रकट करे’ बनाकर मानवाकारी धर्मवैज्ञानिक तनाव को हल नहीं किया गया।
- source_word: אֶת אֲשֶׁר בִּלְבָבְךָ
  choice: तुम्हारे हृदय में क्या था
  rationale: ‘हृदय’ यहाँ विचार, इच्छा और आंतरिक अभिप्राय सहित भीतरी व्यक्ति को सूचित करता है।
- source_word: הֲתִשְׁמֹר מצותו אִם־לֹא
  choice: तुम उसकी आज्ञाओं को मानोगे या नहीं
  rationale: שׁמר का अर्थ केवल स्मरण नहीं, आज्ञाओं का पालन करना है; सामूहिक संज्ञा का हिन्दी में स्वाभाविक बहुवचन रखा गया है।
theological_decisions:
- issue: ‘जाने कि तुम्हारे हृदय में क्या था’ में परमेश्वर के बारे में मानवाकारी भाषा
  choice: मूल के सीधे ‘जाने’ को बनाए रखा
  alternative: ‘प्रकट करे कि तुम्हारे हृदय में क्या था’
  rationale: इब्रानी पाठ ידע, ‘जानना’, कहता है। अनुवाद इसे सर्वज्ञता के प्रश्न के अनुरूप चुपचाप पुनर्व्याख्यायित नहीं करता, बल्कि मूल का धर्मवैज्ञानिक तनाव सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन ‘तुम’ मूल के सामूहिक एकवचन को दर्शाता है। मुख्य पाठ में उद्देश्य-सूचक क्रियाओं की श्रृंखला और मूल की मानवाकारी भाषा सुरक्षित है।
