  text: הַ/מַּֽאֲכִ֨לְ/ךָ֥ מָן֙ בַּ/מִּדְבָּ֔ר אֲשֶׁ֥ר לֹא יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן עַנֹּֽתְ/ךָ֗ וּ/לְמַ֨עַן֙ נַסֹּתֶ֔/ךָ לְ/הֵיטִֽבְ/ךָ֖ בְּ/אַחֲרִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/016.yaml
  text: who fed you manna in the wilderness[a], which your fathers had not known, in order to humble you and in order to test you[b], to do you good in the end.
translation:
  language: hi
  text: जिसने जंगल में तुम्हें मन्ना खिलाया, जिसे तुम्हारे पूर्वज नहीं जानते थे, ताकि तुम्हें दीन करे और तुम्हें परखे, और अन्त में तुम्हारा भला करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּאֲכִלְךָ
  choice: जिसने तुम्हें खिलाया
  rationale: अכל के हिफ़ील कृदन्त और द्वितीय पुरुष एकवचन प्रत्यय का स्वाभाविक हिन्दी रूप; यह पिछले पद में परमेश्वर के वर्णन को आगे बढ़ाता है और कारणवाचक अर्थ बनाए रखता है।
- source_word: מָן
  choice: मन्ना
  rationale: जंगल में दिए गए विशिष्ट भोजन के लिए हिन्दी बाइबलीय परम्परा में प्रचलित लिप्यन्तरण।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन अथवा मरुस्थलीय प्रदेश को दर्शाता है; ‘जंगल’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक है, यद्यपि इसका आशय वन होना आवश्यक नहीं।
- source_word: אֲשֶׁר לֹא יָדְעוּן אֲבֹתֶיךָ
  choice: जिसे तुम्हारे पूर्वज नहीं जानते थे
  rationale: सम्बन्धवाचक उपवाक्य मन्ना को विशेषित करता है और उसके उनके लिए अपरिचित होने को व्यक्त करता है।
- source_word: אֲבֹתֶיךָ
  choice: तुम्हारे पूर्वज
  rationale: शाब्दिक अर्थ ‘तुम्हारे पिता’ है, पर यहाँ बहुवचन वंशगत सन्दर्भ में ‘पूर्वज’ साधारण आधुनिक हिन्दी में अभिप्रेत अर्थ अधिक स्पष्ट करता है।
- source_word: לְמַעַן עַנֹּתְךָ
  choice: ताकि वह तुम्हें दीन करे
  rationale: לְמַעַן उद्देश्य बताता है; ענה के पिएल में दीन करने और कष्ट देने दोनों की अर्थ-छाया है। सन्दर्भ में शिक्षाप्रद विनम्रता प्रमुख है।
- source_word: וּלְמַעַן נַסֹּתֶךָ
  choice: और तुम्हें परखे
  rationale: נסה का अर्थ जाँचने अथवा परखने का है; ‘परखे’ covenantal परीक्षण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְהֵיטִבְךָ
  choice: तुम्हारा भला करे
  rationale: יטב के हिफ़ील का अर्थ किसी के साथ भलाई करना अथवा उसे लाभ पहुँचाना है; यह वाक्यांश व्यक्तिगत कर्म-सम्बन्ध बनाए रखता है।
- source_word: בְּאַחֲרִיתֶךָ
  choice: अन्त में
  rationale: אַחֲרִית यहाँ बाद के परिणाम अथवा अन्ततः होने वाली दशा को दर्शाता है। प्रत्यय व्यक्तिगत हित की ओर संकेत करता है, जो ‘तुम्हारा भला’ में पहले ही स्पष्ट है।
theological_decisions:
- issue: जंगल के कष्ट और परीक्षा का उद्देश्य
  choice: दीन करना और परखना परमेश्वर के उद्देश्य के रूप में रखे गए हैं, जिनका अन्तिम लक्ष्य इस्राएल का भला है।
  alternative: इन्हें केवल दण्डात्मक अनुशासन के रूप में समझना।
  rationale: दो उद्देश्यवाचक खण्डों के बाद לְהֵיטִבְךָ בְּאַחֲרִיתֶךָ आता है। इसलिए अनुवाद कठोर अनुभव और हितकारी लक्ष्य—दोनों को बिना तनाव मिटाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप। एकवचन ‘तुम्हें/तुम्हारा’ सामूहिक इस्राएल को सम्बोधित करने वाले इब्रानी द्वितीय पुरुष पुल्लिंग एकवचन को बनाए रखता है। ‘दीन करे’ को ‘नम्र बनाए’ पर वरीयता दी गई है ताकि ענה में निहित कठिनाई की अर्थ-छाया पूरी तरह लुप्त न हो।
