source:
  edition: WLC
  text: וְ/יָדַעְתָּ֖ עִם לְבָבֶ֑/ךָ כִּ֗י כַּ/אֲשֶׁ֨ר יְיַסֵּ֥ר אִישׁ֙ אֶת בְּנ֔/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מְיַסְּרֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/005.yaml
  text: So know in your heart that[a], just as a man disciplines his son, Yahweh your God disciplines you.
translation:
  language: hi
  text: इसलिए अपने मन में जान लो कि जैसे कोई पुरुष अपने पुत्र को अनुशासित करता है, वैसे ही याहवे, तुम्हारा परमेश्वर, तुम्हें अनुशासित करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: इसलिए ... जान लो
  rationale: संयोजक सहित पूर्ण क्रिया यहाँ पिछले प्रसंग से निकलने वाले निष्कर्ष और आग्रह का भाव देती है; ‘इसलिए ... जान लो’ आधुनिक हिन्दी में उस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עִם לְבָבֶךָ
  choice: अपने मन में
  rationale: इब्रानी मुहावरा भीतरी पहचान या दृढ़ बोध को दर्शाता है; हिन्दी में ‘अपने मन में’ इसका स्वाभाविक समतुल्य है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषयवस्तु प्रस्तुत करता है जिसे जानना है, इसलिए हिन्दी का ‘कि’ उपयुक्त है।
- source_word: כַּאֲשֶׁר
  choice: जैसे ... वैसे ही
  rationale: मानवीय और ईश्वरीय अनुशासन के बीच स्पष्ट तुलना को हिन्दी की स्वाभाविक तुलनात्मक रचना से व्यक्त किया गया है।
- source_word: יְיַסֵּר / מְיַסְּרֶךָּ
  choice: अनुशासित करता है
  rationale: יסר में सुधारात्मक दंड और चरित्र-निर्माणकारी शिक्षा दोनों सम्मिलित हो सकते हैं। दोनों स्थानों पर एक ही अभिव्यक्ति रखकर इब्रानी पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: मूल में स्पष्ट रूप से पुल्लिंग ‘पुरुष’ है; इसे ‘पिता’ बनाकर संबंध को मूल से अधिक स्पष्ट नहीं किया गया।
- source_word: בְּנוֹ
  choice: अपने पुत्र को
  rationale: मूल शब्द विशेष रूप से ‘पुत्र’ कहता है, सामान्य ‘संतान’ नहीं।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: यह प्रत्यय सहित वाचा-संबंधी पद का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय अनुशासन का स्वरूप
  choice: अनुशासित करता है
  alternative: ताड़ना देता है / सुधारता है / शिक्षा देता है
  rationale: ‘अनुशासित करता है’ दंडात्मक सुधार और निर्माणकारी प्रशिक्षण, दोनों संभावनाओं को खुला रखता है; यह न तो अर्थ को केवल दंड तक सीमित करता है, न उसे मात्र शिक्षा तक नरम करता है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रचलित विद्वत्तापूर्ण उच्चारण के निकट लिप्यंतरित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जैसे ... वैसे ही’ तुलना को स्पष्ट करता है, और ‘अनुशासित’ मूल क्रिया के व्यापक अर्थ को सुरक्षित रखता है।
