source:
  edition: WLC
  text: וְ/אָמַרְתָּ֖ בִּ/לְבָבֶ֑/ךָ כֹּחִ/י֙ וְ/עֹ֣צֶם יָדִ֔/י עָ֥שָׂה לִ֖/י אֶת הַ/חַ֥יִל הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/017.yaml
  text: and you say in your heart[a], ‘My power and the strength of my hand have gotten me this wealth,’
translation:
  language: hi
  text: और तुम अपने मन में कहोगे, ‘मेरी शक्ति और मेरे हाथ के बल ने मेरे लिए यह धन-संपत्ति जुटाई है।’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह समृद्धि।” इब्रानी शब्द חַיִל प्रसंग के अनुसार धन-संपत्ति, संसाधन, शक्ति या सामर्थ्य का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: और तुम ... कहोगे
  rationale: संयोजक वाव के साथ काल रूप इस चेतावनी के प्रसंग में भावी सम्भावना व्यक्त करता है; हिन्दी में ‘कहोगे’ स्वाभाविक और सीधा है।
- source_word: בִּלְבָבֶךָ
  choice: अपने मन में
  rationale: यह भीतरी सोच या स्वयं से कही गई बात का मुहावरा है। ‘मन में’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इब्रानी रूपक का भाव बनाए रखता है।
- source_word: כֹּחִי
  choice: मेरी शक्ति
  rationale: כֹּחַ सामर्थ्य, शक्ति या क्षमता को सूचित करता है; ‘शक्ति’ व्यक्तिगत योग्यता के दावे को स्पष्ट करता है।
- source_word: וְעֹצֶם יָדִי
  choice: और मेरे हाथ के बल
  rationale: עֹצֶם यहाँ बल या सामर्थ्य है और ‘हाथ’ व्यक्तिगत प्रयास तथा क्षमता की ठोस इब्रानी छवि रखता है।
- source_word: עָשָׂה לִי
  choice: मेरे लिए ... जुटाई है
  rationale: शाब्दिक अर्थ ‘मेरे लिए बनाया’ है, पर धन-संपत्ति के साथ प्रसंगगत अर्थ उसे अर्जित या एकत्र करना है; ‘जुटाई है’ आत्म-अर्जन के दावे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַחַיִל הַזֶּה
  choice: यह धन-संपत्ति
  rationale: व्यवस्थाविवरण 8 में भौतिक बहुतायत के प्रसंग के कारण חַיִל का धन-संसाधन संबंधी अर्थ प्रमुख है; ‘धन-संपत्ति’ सामान्य पाठक के लिए स्पष्ट है, जबकि अन्य सम्भव अर्थ पाद-टिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: वाचा-संबंधी चेतावनी में חַיִל का अर्थ
  choice: धन-संपत्ति
  alternative: समृद्धि; सामर्थ्य; संसाधन
  rationale: निकटवर्ती प्रसंग भोजन, घर, पशुधन, चाँदी और सोने की बढ़ोतरी का है, इसलिए यहाँ भौतिक संपन्नता मुख्य आशय है। फिर भी शब्द की व्यापक अर्थ-सीमा को पाद-टिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘हाथ के बल’ मूल की ठोस छवि रखता है और ‘धन-संपत्ति जुटाई’ प्रसंगगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
