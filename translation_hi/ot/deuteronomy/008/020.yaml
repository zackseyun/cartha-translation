  text: כַּ/גּוֹיִ֗ם אֲשֶׁ֤ר יְהוָה֙ מַאֲבִ֣יד מִ/פְּנֵי/כֶ֔ם כֵּ֖ן תֹאבֵד֑וּ/ן עֵ֚קֶב לֹ֣א תִשְׁמְע֔וּ/ן בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/020.yaml
  text: Like the nations that Yahweh is destroying before you[a], so you will perish, because you did not listen to the voice of Yahweh your God.
translation:
  language: hi
  text: जैसे उन जातियों को यहोवा तुम्हारे सामने से नष्ट कर रहा है, वैसे ही तुम भी नष्ट हो जाओगे, क्योंकि तुम अपने परमेश्वर यहोवा की वाणी नहीं सुनोगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने परमेश्वर यहोवा की आज्ञा नहीं मानोगे।” हिब्रू मुहावरे का शाब्दिक अर्थ “अपने परमेश्वर यहोवा की वाणी नहीं सुनोगे” है और इसमें प्रायः आज्ञापालन का भाव होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּגּוֹיִם
  choice: जैसे उन जातियों को
  rationale: כְּ तुलना व्यक्त करता है और גּוֹיִם प्रसंग में देश की जातियों को सूचित करता है; हिंदी में सहसंबंधी रचना ‘जैसे… वैसे ही…’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: מַאֲבִיד
  choice: नष्ट कर रहा है
  rationale: אבד का हिफ़ील कृदंत कारणवाचक तथा जारी/आसन्न विनाश का भाव देता है।
- source_word: מִפְּנֵיכֶם
  choice: तुम्हारे सामने से
  rationale: मूल का शाब्दिक भाव ‘तुम्हारे सामने से’ है, जिसमें आगे बढ़ते इस्राएल के सामने से जातियों को हटाया जाना निहित है।
- source_word: כֵּן תֹאבֵדוּן
  choice: वैसे ही तुम भी नष्ट हो जाओगे
  rationale: כֵּן आरंभिक तुलना का उत्तर देता है; Qal रूप תֹאבֵדוּן स्वयं नष्ट हो जाने को बताता है। ‘नष्ट’ पहले खंड के אבד से शब्दगत संबंध भी बनाए रखता है।
- source_word: עֵקֶב
  choice: क्योंकि
  rationale: यह आनेवाले न्याय का कारण प्रस्तुत करता है; ‘क्योंकि’ स्पष्ट और स्वाभाविक आधुनिक हिंदी है।
- source_word: לֹא תִשְׁמְעוּן בְּקוֹל
  choice: वाणी नहीं सुनी
  rationale: शाब्दिक मुहावरा ‘वाणी सुनना’ है और प्रसंग में आज्ञापालन का अर्थ भी समेटे हुए है; मुख्य पाठ में चित्रात्मक वाचा-संबंधी भाषा सुरक्षित रखी गई है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: यहोवा के साथ यह एकवचन में इस्राएल के परमेश्वर को सूचित करता है; ‘अपने’ हिंदी वाक्य में संबंध को स्वाभाविक बनाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत वाचा-नाम को उपाधि में बदलने के बजाय हिंदी पाठकों के लिए परिचित लिप्यंतरण रखा गया है।
- issue: שׁמע בקול को ‘आज्ञा मानना’ या ‘वाणी सुनना’ कहना
  choice: वाणी नहीं सुनी
  alternative: आज्ञा नहीं मानी
  rationale: मूल मुहावरे में सुनने और आज्ञापालन दोनों का भाव है। मुख्य पाठ शाब्दिक वाचा-संबंधी रूपक को रखता है और पाद-टिप्पणी उसका व्यवहारगत अर्थ स्पष्ट करती है।
- issue: לֹא תִשְׁמְעוּן का कालगत रूप
  choice: नहीं सुनी
  alternative: नहीं सुनोगे
  rationale: עֵקֶב के साथ चेतावनी-सूत्र में यह अवज्ञा को विनाश का आधार बताता है; हिंदी में भूतकाल कारणात्मक कथन को स्वाभाविक रूप से व्यक्त करता है, यद्यपि हिब्रू रूप अपूर्ण है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गंभीर और वाचा-संबंधी स्वर रखा गया है। ‘जातियाँ’, ‘नष्ट’ और ‘वाणी’ जैसे शब्द सामान्य पाठकों के लिए बोधगम्य रहते हुए मूल की पुनरावृत्ति और रूपक को बनाए रखते हैं।
