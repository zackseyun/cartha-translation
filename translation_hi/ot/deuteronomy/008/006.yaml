- from: इसलिए[a] तुम अपने परमेश्वर याहवे की आज्ञाओं का पालन करना, उसके मार्गों पर चलते हुए और उसका भय मानते हुए[b]।
  to: इसलिए[a] तुम अपने परमेश्वर याहवे की आज्ञाओं का पालन करो, उसके मार्गों पर चलकर और उसका भय मानकर[b]।
  rationale: The revision makes only grammatical and syntactic improvements. It replaces the non-finite directive “पालन करना” with the natural imperative “पालन करो” and uses conjunctive forms to express the source infinitives as the means or outworking of obedience. The inferential conjunction, singular address, divine name, covenantal terminology, and the unsoftened fear language are retained. Footnote anchors remain attached to the relevant expressions.
