source:
  edition: WLC
  text: וְ/שָׁ֣מַרְתָּ֔ אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו וּ/לְ/יִרְאָ֥ה אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/006.yaml
  text: So you shall keep the commandments of Yahweh your God[b][a], by walking in his ways and by fearing him.
translation:
  language: hi
  text: इसलिए[a] तुम अपने परमेश्वर याहवे की आज्ञाओं का पालन करो, उसके मार्गों पर चलकर और उसका भय मानकर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तुम…पालन करो।” इब्रानी संयोजक सामान्य जोड़ भी व्यक्त कर सकता है, हालाँकि यहाँ पिछला प्रसंग परिणामसूचक अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: “उसका भय मानना” परमेश्वर के प्रति श्रद्धा से भरे भय को दर्शाता है; इसका अनुवाद “उसके प्रति श्रद्धा रखते हुए” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: इसलिए तुम…पालन करना
  rationale: שׁמר का वाचा-संबंधी अर्थ आज्ञाओं को मानना या उनका पालन करना है। पूर्वसर्गीय וְ को पिछले प्रसंग से निकलने वाले निष्कर्ष के रूप में ‘इसलिए’ किया गया है; हिन्दी में ‘पालन करना’ एक स्वाभाविक निर्देशात्मक रूप है।
- source_word: מִצְוֺת
  choice: आज्ञाओं
  rationale: बहुवचन מִצְוֺת परमेश्वर द्वारा दी गई बाध्यकारी आज्ञाओं को दर्शाता है; ‘आज्ञाओं’ से इसका विधिक और वाचा-संबंधी भाव बना रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; इसलिए किसी उपाधि से बदलने के बजाय उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय का अर्थ ‘तुम्हारा परमेश्वर’ है; हिन्दी में कर्ता ‘तुम’ के साथ ‘अपने परमेश्वर’ अधिक स्वाभाविक है और वही संबंध व्यक्त करता है।
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: उसके मार्गों पर चलते हुए
  rationale: הלך और דרך का रूपक आचरण या परमेश्वर द्वारा ठहराए गए जीवन-पथ को दर्शाता है। ‘मार्गों पर चलना’ हिन्दी में इस बाइबिलीय रूपक को स्पष्ट रूप से बनाए रखता है; कृदंत मुख्य आज्ञा के पालन की रीति बताता है।
- source_word: וּלְיִרְאָה אֹתוֹ
  choice: और उसका भय मानते हुए
  rationale: ירא में भय का वास्तविक शाब्दिक बल है, जो परमेश्वर के संदर्भ में श्रद्धायुक्त भय को व्यक्त करता है। ‘भय मानना’ इस तनाव को केवल ‘आदर करना’ बनाकर हल्का नहीं करता।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: पाठ में उपाधि नहीं, चार-अक्षरी व्यक्तिगत नाम है। ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी लिप्यंतरण है और नाम को नाम ही रहने देता है।
- issue: परमेश्वर का ‘भय मानने’ का अर्थ
  choice: उसका भय मानते हुए
  alternative: उसका आदर करते हुए
  rationale: वाचा के प्रसंग में यह श्रद्धायुक्त भय है, फिर भी मूल क्रिया के भय-संबंधी अर्थ और धर्मवैचारिक तनाव को मुख्य पाठ में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। एकवचन ‘तुम’ इब्रानी के द्वितीय पुरुष पुल्लिंग एकवचन को दर्शाता है। ‘मार्गों पर चलना’ मूल रूपक को बनाए रखता है, और दोनों ‘…ते हुए’ पद आज्ञाओं के पालन की रीति स्पष्ट करते हैं।
