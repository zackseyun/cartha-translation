  text: וַֽ/יְעַנְּ/ךָ֮ וַ/יַּרְעִבֶ/ךָ֒ וַ/יַּֽאֲכִֽלְ/ךָ֤ אֶת הַ/מָּן֙ אֲשֶׁ֣ר לֹא יָדַ֔עְתָּ וְ/לֹ֥א יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן הוֹדִֽעֲ/ךָ֗ כִּ֠י לֹ֣א עַל הַ/לֶּ֤חֶם לְ/בַדּ/וֹ֙ יִחְיֶ֣ה הָֽ/אָדָ֔ם כִּ֛י עַל כָּל מוֹצָ֥א פִֽי יְהוָ֖ה יִחְיֶ֥ה הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/003.yaml
  text: And he humbled you and let you hunger and fed you the manna[a], which you had not known, nor had your fathers known, so that he might make you know that man does not live by bread alone[b], but man lives by every word that comes from the mouth of Yahweh.
translation:
  language: hi
  text: उसने तुझे दीन किया, तुझे भूखा रखा और तुझे वह मन्ना खिलाया जिसे न तू जानता था, न तेरे पूर्वज जानते थे। उसने ऐसा तुझे यह समझाने के लिए किया कि मनुष्य केवल रोटी से जीवित नहीं रहता, बल्कि मनुष्य याहवे के मुँह से निकलने वाले हर वचन[a] से जीवित रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के मुँह से निकलने वाली हर चीज़।” हिब्रू अभिव्यक्ति केवल बोले गए “वचन” से कुछ अधिक व्यापक हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַנְּךָ
  choice: उसने तुझे दीन किया
  rationale: पिएल रूप यहाँ दुःख देने अथवा नम्र-दीन करने का भाव रख सकता है। जंगल में अनुशासन और शिक्षा के संदर्भ में “दीन किया” व्यक्ति को नीचा किए जाने का भाव रखता है, पर शारीरिक पीड़ा को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: וַיַּרְעִבֶךָ
  choice: तुझे भूखा रहने दिया
  rationale: हिफ़ील की कारकता और परमेश्वर की सक्रिय भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּאֲכִלְךָ אֶת־הַמָּן
  choice: तुझे वह मन्ना खिलाया
  rationale: कारक क्रिया אכל का सहज हिन्दी रूप “खिलाया” है; “वह” हिब्रू के निश्चित उपपद को स्वाभाविक ढंग से दर्शाता है।
- source_word: אֲשֶׁר לֹא יָדַעְתָּ וְלֹא יָדְעוּן אֲבֹתֶיךָ
  choice: जिससे न तू परिचित था और न तेरे पूर्वज
  rationale: ידע यहाँ केवल बौद्धिक जानकारी नहीं, बल्कि पहले से परिचित या अनुभवी होने को दर्शाता है।
- source_word: לְמַעַן הוֹדִעֲךָ
  choice: इसलिए किया कि वह तुझे यह समझाए
  rationale: कारक रूप “जानने योग्य बनाना” का भाव देता है; वर्तमान हिन्दी में “समझाए” इसके शिक्षात्मक उद्देश्य को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ शब्द पूरी मानवजाति के प्रतिनिधि अर्थ में है। “मनुष्य” आधुनिक हिन्दी में स्वाभाविक है और पुरुषों तक अर्थ को सीमित नहीं करता।
- source_word: הַלֶּחֶם לְבַדּוֹ
  choice: केवल रोटी से
  rationale: विरोधात्मक कथन का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: כָּל־מוֹצָא פִי יְהוָה
  choice: याहवे के मुँह से निकलने वाले हर वचन
  rationale: מוֹצָא का शाब्दिक भाव “जो निकलता है” है। संदर्भ में “वचन” उचित और स्पष्ट है, जबकि व्यापक शाब्दिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू के व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: יִחְיֶה הָאָדָם ... יִחְיֶה הָאָדָם
  choice: मनुष्य ... जीवित नहीं रहता, बल्कि मनुष्य ... जीवित रहता है
  rationale: हिब्रू में दोहराए गए कर्ता और संतुलित वाक्य-विन्यास को हिन्दी में भी बनाए रखा गया है।
theological_decisions:
- issue: प्रतिनिधि अर्थ वाले הָאָדָם का अनुवाद
  choice: मनुष्य
  alternative: मानवजाति / व्यक्ति
  rationale: कथन सभी मनुष्यों के विषय में है। “मनुष्य” स्रोत के प्रतिनिधि एकवचन और सार्वभौमिक अर्थ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- issue: מוֹצָא פִי יְהוָה का अर्थ
  choice: याहवे के मुँह से निकलने वाला हर वचन
  alternative: याहवे के मुँह से निकलने वाली हर चीज़
  rationale: हिब्रू अभिव्यक्ति “निकलने वाली हर चीज़” जितनी व्यापक हो सकती है, पर प्रसंग में परमेश्वर की कही बात, आज्ञा या घोषणा का अर्थ प्रमुख है। मुख्य पाठ में स्पष्ट “वचन” रखा गया है और व्यापक संभावना पादटिप्पणी में दी गई है।
- issue: दुःख देने और दीन करने के बीच ענה का अर्थ
  choice: दीन किया
  alternative: कष्ट दिया
  rationale: जंगल की भूख में कष्ट निहित है, फिर भी पद का घोषित उद्देश्य इस्राएल को निर्भरता सिखाना है। “दीन किया” इस अनुशासनात्मक उद्देश्य को रखता है, बिना यह मान लिए कि अर्थ केवल शारीरिक पीड़ा है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एक व्यक्ति के रूप में इस्राएल को किए गए संबोधन के लिए “तू/तुझे/तेरे” का प्रयोग मूल के एकवचन को बनाए रखता है। “याहवे” को व्यक्तिगत ईश्वरीय नाम के रूप में रखा गया है।
