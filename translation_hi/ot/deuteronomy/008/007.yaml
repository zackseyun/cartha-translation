id: DEU.8.7
reference: Deuteronomy 8:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֶ֔י/ךָ מְבִֽיאֲ/ךָ֖ אֶל אֶ֣רֶץ טוֹבָ֑ה אֶ֚רֶץ נַ֣חֲלֵי מָ֔יִם עֲיָנֹת֙ וּ/תְהֹמֹ֔ת יֹצְאִ֥ים בַּ/בִּקְעָ֖ה וּ/בָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/007.yaml
  text: For Yahweh your God is bringing you into a good land[a], a land of streams of water, springs[c][b], and depths flowing out in the valley and in the hill country.
translation:
  language: hi
  text: क्योंकि तुम्हारा परमेश्वर याहवे तुम्हें एक अच्छी भूमि में ले जा रहा है—ऐसी भूमि जहाँ जल की धाराएँ, सोते और गहरे जल हैं, जो घाटी और पहाड़ी प्रदेश में फूट निकलते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन वाले वाचा-संबंधी संबोधन को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מְבִיאֲךָ
  choice: तुम्हें ... ले जा रहा है
  rationale: कृदंत से प्रकट वर्तमान तथा निकटस्थ प्रक्रिया की जीवंतता को बनाए रखता है।
- source_word: אֶל־אֶרֶץ טוֹבָה
  choice: एक अच्छे देश में
  rationale: गति और गंतव्य दोनों को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘अच्छे’ के अर्थ का विस्तार किए।
- source_word: אֶרֶץ נַחֲלֵי מָיִם
  choice: ऐसा देश जहाँ जलधाराएँ ... हैं
  rationale: נַחֲלֵי מָיִם जल से भरी धाराओं या जलमार्गों को सूचित करता है; ‘जलधाराएँ’ संक्षिप्त, स्पष्ट और प्राकृतिक है।
- source_word: עֲיָנֹת
  choice: सोते
  rationale: प्राकृतिक रूप से भूमि से निकलने वाले जलस्रोत के लिए सामान्य और प्रसंगानुकूल हिन्दी शब्द।
- source_word: וּתְהֹמֹת
  choice: गहरे जल
  rationale: यह बहुवचन शब्द गहराइयों अथवा भूमिगत गहरे जल को सूचित कर सकता है; ‘गहरे जल’ अस्पष्ट जलवैज्ञानिक चित्र को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יֹצְאִים
  choice: बह निकलते हैं
  rationale: जल के स्रोत से बाहर आने और प्रवाहित होने की छवि को मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: בַּבִּקְעָה
  choice: घाटियों में
  rationale: בִּקְעָה चौड़ी घाटी या मैदान को सूचित कर सकता है; स्थलाकृतिक सामूहिक अर्थ में ‘घाटियों’ स्वाभाविक है।
- source_word: וּבָהָר
  choice: और पहाड़ी प्रदेश में
  rationale: एकवचन הָר यहाँ सामूहिक रूप से ऊँचे भूभाग को सूचित कर सकता है; ‘पहाड़ी प्रदेश’ उस स्थलाकृतिक अर्थ को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। हिन्दी पाठकों के बीच प्रतिष्ठित लिप्यंतरण ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदलने के बजाय सुरक्षित रखता है; उच्चारण के अधिक समीपी विकल्प ‘याहवे’ को भी स्वीकार्य वैकल्पिक लिप्यंतरण माना जा सकता है।
- issue: תְהֹמֹת के जलवैज्ञानिक आशय की अनिश्चितता
  choice: गहरे जल
  alternative: गहराइयाँ
  rationale: शब्द गहरे अथवा भूमिगत जलस्रोतों की ओर संकेत कर सकता है। ‘गहरे जल’ प्रसंग में समझने योग्य है, पर उनकी सटीक प्रकृति को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल पर गरिमापूर्ण शैली। पद के स्थलाकृतिक काव्यात्मक चित्र को स्वाभाविक वाक्य-विन्यास में रखा गया है। ‘तुम्हारा/तुम्हें’ मूल के पुरुषवाचक एकवचन संबोधन को दर्शाता है।
