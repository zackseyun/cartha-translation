id: DEU.8.11
reference: Deuteronomy 8:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְ/בִלְתִּ֨י שְׁמֹ֤ר מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/011.yaml
  text: Be careful lest you forget Yahweh your God by failing to keep his commandments and his judgments and his statutes[b][a], which I am commanding you today.
translation:
  language: hi
  text: सावधान रहो, कहीं ऐसा न हो कि तुम याहवे, अपने परमेश्वर को उसकी आज्ञाओं, नियमों और विधियों का पालन न करके भूल जाओ, जिनका पालन करने की आज मैं तुम्हें आज्ञा दे रहा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: सावधान रहना
  rationale: निफ़अल आज्ञार्थक चेतावनी-सूत्र का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; इसमें स्वयं पर निगरानी रखने का भाव बना रहता है।
- source_word: פֶּן תִּשְׁכַּח
  choice: कहीं ऐसा न हो कि तुम ... भूल जाओ
  rationale: פֶּן से आरम्भ नकारात्मक चेतावनी को वर्तमान हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर याहवे
  rationale: याहवे को उपाधि से बदलने के बजाय इब्रानी व्यक्तिगत नाम का लिप्यंतरण रखा गया है; אֱלֹהֶיךָ का वाचिक एकवचन ‘तुम्हारे परमेश्वर’ है।
- source_word: לְבִלְתִּי שְׁמֹר
  choice: और ... का पालन न करो[a]
  rationale: मुख्य पाठ में यह सहज हिन्दी चेतावनी बनती है। इब्रानी infinitive-निर्माण भूलने और आज्ञा न मानने के संबंध को अधिक निकटता से जोड़ सकता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: מִצְוֺתָיו וּמִשְׁפָּטָיו וְחֻקֹּתָיו
  choice: उसकी आज्ञाओं, नियमों और विधियों
  rationale: 'तीनों वाचा-संबंधी कानूनी पदों का भेद सरल आधुनिक हिन्दी में बनाए रखा गया है: מִצְוָה ‘आज्ञा’, מִשְׁפָּט ‘नियम’, और חֹק ‘विधि’।'
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: जिन्हें मानने की आज मैं तुम्हें आज्ञा दे रहा हूँ
  rationale: इब्रानी कृदंत की वर्तमानकालीन तात्कालिकता और הַיּוֹם के बल को बनाए रखते हुए हिन्दी में संबंध स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: भूलने और आज्ञा न मानने का संबंध
  choice: मुख्य पाठ में संयुक्त चेतावनी; पादटिप्पणी में साधन/प्रकटीकरण का अर्थ
  alternative: ‘उसकी ... का पालन न करके अपने परमेश्वर याहवे को भूल जाओ’
  rationale: לְבִלְתִּי שְׁמֹר को भूलने की रीति या उसके ठोस प्रकटीकरण के रूप में समझा जा सकता है। सहज हिन्दी रखते हुए यह अर्थ पादटिप्पणी में संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन संबोधन ‘तुम’ रखा गया है। भाषा सरल, गंभीर और वाचा-संबंधी कानूनी पदावली के अनुरूप है; अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
