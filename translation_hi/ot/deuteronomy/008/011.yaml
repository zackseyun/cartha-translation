- from: सावधान रहना, कहीं ऐसा न हो कि तुम अपने परमेश्वर याहवे को भूल जाओ और उसकी आज्ञाओं, नियमों और विधियों का पालन न करो[a], जिन्हें मानने की आज मैं तुम्हें आज्ञा दे रहा हूँ।
  to: सावधान रहो, कहीं ऐसा न हो कि तुम याहवे, अपने परमेश्वर को उसकी आज्ञाओं, नियमों और विधियों का पालन न करके भूल जाओ, जिनका पालन करने की आज मैं तुम्हें आज्ञा दे रहा हूँ।
  rationale: The revision moves the non-keeping phrase into a dependent participial construction, preserving its source-language connection with forgetting. It also improves the natural Hindi placement of the divine name. No footnote is needed because the main text can express the construction clearly without overclaiming a disputed nuance.
