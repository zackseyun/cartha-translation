  text: You shall make tassels for yourself on the four corners of your covering with which you cover yourself[a][b].
translation:
  language: hi
  text: अपने आवरण के चारों कोनों पर अपने लिए लटकनें[a] बनाना, जिससे तुम अपने को ढकते हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बटी हुई डोरियाँ” अथवा “झालरें।”
    reason: lexical_alternative
  - marker: b
    text: “आवरण” के लिए इब्रानी में “तुम्हारा आवरण”; इसका अनुवाद “तुम्हारा वस्त्र” या “तुम्हारी चादर” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִלִים
  choice: लटकनें
  rationale: यह शब्द वस्त्र के कोनों पर लगाई जाने वाली लटकती डोरियों या झालरों को सूचित करता है। ‘लटकनें’ सहज आधुनिक हिन्दी है; ‘बटी हुई डोरियाँ’ शब्द की बनावट को अधिक स्पष्ट करती है और ‘झालरें’ पारंपरिक विकल्प है।
- source_word: תַּעֲשֶׂה לָּךְ
  choice: अपने लिए ... बनाना
  rationale: व्यवस्थाविवरण की आज्ञात्मक शैली में अपूर्ण क्रिया का स्वाभाविक हिन्दी रूप ‘बनाना’ है, और לָּךְ का व्यक्तिगत हितभाव ‘अपने लिए’ से सुरक्षित रहता है।
- source_word: עַל אַרְבַּע כַּנְפוֹת
  choice: उसके चारों कोनों पर
  rationale: वस्त्र के संदर्भ में כָּנָף का अर्थ ‘पंख’ नहीं, कपड़े का छोर या कोना है। ‘चारों कोनों’ से अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: כְּסוּתְךָ
  choice: ओढ़ने
  rationale: संज्ञा किसी ऐसी वस्तु को दर्शाती है जिससे व्यक्ति स्वयं को ढकता है। ‘ओढ़ना’ हिन्दी में इस कार्य को स्वाभाविक रूप से व्यक्त करता है, पर मूल शब्द ‘वस्त्र’ या विशेषतः ‘चादर’ तक सीमित नहीं है।
- source_word: אֲשֶׁר תְּכַסֶּה בָּהּ
  choice: जिस ... से तुम अपने को ढकते हो
  rationale: यह संबंधवाचक उपवाक्य ओढ़ने के उपयोग को बताता है। ‘अपने को ढकते हो’ मूल क्रिया כסה का अर्थ सुरक्षित रखता है और वस्त्र का प्रकार अनावश्यक रूप से निश्चित नहीं करता।
