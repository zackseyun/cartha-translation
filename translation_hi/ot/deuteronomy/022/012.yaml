  register: आज्ञा को आधुनिक, गरिमापूर्ण और सहज हिन्दी में रखा गया है। ‘बनाना’ विधिक निर्देश की संक्षिप्त शैली बनाए रखता है। मूल इब्रानी में आवरण के प्रकार की अस्पष्टता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
