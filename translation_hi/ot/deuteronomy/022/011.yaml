lexical_decisions:
- source_word: לֹא תִלְבַּשׁ
  choice: तुम ... न पहनना
  rationale: व्यवस्थागत निषेध को आधुनिक, सहज और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: שַׁעַטְנֵז
  choice: ऐसा कपड़ा ... जिसमें ... एक साथ मिले हों
  rationale: यह दुर्लभ शब्द निषिद्ध मिश्रित वस्त्र को सूचित करता है; अगले पदबंध में उसके घटक ऊन और सन बताए गए हैं। अर्थ खोलकर कहना लिप्यंतरण की अपेक्षा अधिक बोधगम्य है।
- source_word: צֶמֶר
  choice: ऊन
  rationale: वस्त्र-संदर्भ में इसका सामान्य और सीधा अर्थ।
- source_word: וּפִשְׁתִּים
  choice: और सन के रेशे
  rationale: हिब्रू शब्द सन अथवा उससे बने लिनन को सूचित कर सकता है। 'सन के रेशे' मूल पदार्थ को बनाए रखते हुए आधुनिक पाठक के लिए वस्त्र-मिश्रण स्पष्ट करता है।
- source_word: יַחְדָּו
  choice: एक साथ मिले हों
  rationale: दोनों पदार्थों के एक ही वस्त्र में संयुक्त या मिश्रित होने का आशय स्वाभाविक हिंदी में स्पष्ट करता है।
