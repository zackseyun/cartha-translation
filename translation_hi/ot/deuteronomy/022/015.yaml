  text: then the young woman’s father and her mother shall take and bring out the evidence of the young woman’s virginity to the elders of the city at the gate[a].
translation:
  language: hi
  text: तब उस युवती के माता-पिता उसकी कुँवारी होने का प्रमाण लेकर नगर के फाटक पर बुज़ुर्गों के पास जाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “युवती के कुँवारेपन के चिह्न”; यह उसकी कुँवारी होने के प्रमाण या चिह्नों के लिए प्रयुक्त एक मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: लेकर ... जाएँ
  rationale: कानूनी क्रम में यह क्रिया निर्देशात्मक बल रखती है। अगली क्रिया के साथ संयुक्त हिंदी अभिव्यक्ति मूल की प्रक्रिया—वस्तु लेना और अधिकारियों के सामने ले जाना—को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: אֲבִי הַנַּעַר וְאִמָּהּ
  choice: उस युवती के पिता और उसकी माता
  rationale: נַעֲרָה विवाह-योग्य आयु की युवती को दर्शाता है; ‘युवती’ आधुनिक और गरिमापूर्ण है तथा ‘लड़की’ की संभावित बाल-संबंधी ध्वनि से बचता है।
- source_word: וְהוֹצִיאוּ
  choice: लेकर ... जाएँ
  rationale: יצא का हिफ़ील यहाँ प्रमाण को बाहर लाकर औपचारिक रूप से अधिकारियों के समक्ष प्रस्तुत करने का भाव देता है; हिंदी में गंतव्य के साथ ‘लेकर ... जाएँ’ इस क्रिया को सहजता से व्यक्त करता है।
- source_word: אֶת בְּתוּלֵי הַנַּעַר
  choice: उसकी कुँवारी होने का प्रमाण
  rationale: शाब्दिक बहुवचन ‘युवती की कुँवारियाँ’ इस कानूनी प्रसंग में कुँवारेपन के चिह्न अथवा साक्ष्य का मुहावरा है। ‘प्रमाण’ आधुनिक पाठक के लिए कानूनी आशय स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: אֶל זִקְנֵי הָעִיר
  choice: नगर के पुरनियों के पास
  rationale: אֶל अधिकारियों की ओर जाने का संकेत करता है। ‘पुरनिये’ बाइबलीय न्यायिक-सामुदायिक पद को हिंदी में संक्षिप्त और प्रतिष्ठित रूप से व्यक्त करता है।
- source_word: הַשַּׁעְרָה
  choice: नगर के फाटक पर
  rationale: दिशासूचक प्रत्यय गति की ओर संकेत कर सकता है, पर प्रसंग में फाटक न्याय का स्थान है। ‘फाटक पर’ हिंदी में उस कार्यात्मक स्थान को स्वाभाविक रूप से बताता है।
