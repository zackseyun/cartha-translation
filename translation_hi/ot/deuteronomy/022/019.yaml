base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/019.yaml
  text: Then they shall fine him one hundred shekels of silver and give them to the father of the young woman[a], because he has brought a bad name upon a virgin of Israel. And she shall be his wife; he may not send her away all his days.
translation:
  language: hi
  text: तब वे उस पर चाँदी के सौ शेकेल का जुर्माना लगाएँ और वह रकम युवती के पिता को दें, क्योंकि उसने इस्राएल की एक कुँवारी को बदनाम किया है। वह उसकी पत्नी रहेगी; वह जीवन भर उसे अपने से दूर नहीं भेज सकेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वह उसे तलाक नहीं दे सकेगा।’ इब्रानी में शाब्दिक अभिव्यक्ति ‘उसे भेज देना’ है, जो वैवाहिक कानून में पत्नी को तलाक देने के लिए प्रयुक्त हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְשׁוּ
  choice: उस पर ... जुर्माना लगाएँ
  rationale: इस कानूनी प्रसंग में क्रिया सामान्य दंड नहीं, बल्कि आर्थिक दंड लगाने को सूचित करती है।
- source_word: מֵאָה כֶסֶף
  choice: चाँदी के सौ शेकेल
  rationale: इब्रानी में शाब्दिक रूप से ‘सौ चाँदी’ है; आर्थिक-कानूनी संदर्भ में भार की इकाई ‘शेकेल’ निहित है, इसलिए अर्थ स्पष्ट करने हेतु इसे जोड़ा गया है।
- source_word: לַאֲבִי הַנַּעֲרָה
  choice: युवती के पिता को
  rationale: נַעֲרָה विवाह योग्य आयु की युवती को दर्शाता है; ‘युवती’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: כִּי הוֹצִיא שֵׁם רָע
  choice: क्योंकि उसने ... को बदनाम किया है
  rationale: शाब्दिक मुहावरा ‘बुरा नाम निकालना’ है। हिन्दी में ‘बदनाम करना’ उसी आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: עַל בְּתוּלַת יִשְׂרָאֵל
  choice: इस्राएल की एक कुँवारी को
  rationale: בְּתוּלָה इस आरोप के कानूनी संदर्भ में कुँवारी स्त्री को दर्शाता है; ‘इस्राएल की’ वाचा-समुदाय से उसका संबंध बनाए रखता है।
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: वह उसकी पत्नी रहेगी
  rationale: विवाह पहले ही हो चुका है; इस कानूनी परिणाम में उसके पत्नी बने रहने की स्थायी स्थिति अभिप्रेत है।
- source_word: לֹא יוּכַל
  choice: नहीं ... सकेगा
  rationale: यह मात्र शारीरिक असमर्थता नहीं, कानूनी निषेध अथवा अधिकार के अभाव को व्यक्त करता है।
- source_word: לְשַׁלְּחָהּ
  choice: उसे अपने से दूर ... भेज सकेगा
  rationale: मुख्य पाठ इब्रानी के ‘भेज देना’ वाले रूपक को बनाए रखता है, जबकि वैवाहिक कानून में इसका आशय तलाक देना हो सकता है।
- source_word: כָּל יָמָיו
  choice: जीवन भर
  rationale: इब्रानी मुहावरे ‘उसके सारे दिन’ का स्वाभाविक हिन्दी अर्थ आजीवन अवधि है।
theological_decisions:
- issue: वैवाहिक संबंध समाप्त करने का कानूनी मुहावरा
  choice: उसे अपने से दूर नहीं भेज सकेगा
  alternative: उसे तलाक नहीं दे सकेगा
  rationale: मुख्य पाठ स्रोत के ‘भेज देना’ वाले मुहावरे और उसकी व्यापक छवि को सुरक्षित रखता है; पादटिप्पणी कानूनी संदर्भ में उसके अधिक स्पष्ट अर्थ ‘तलाक देना’ को दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कानूनी शैली रखी गई है। ‘जुर्माना’, ‘युवती’ और ‘जीवन भर’ सामान्य पाठकों के लिए सहज हैं; ‘शेकेल’ प्राचीन भार-मुद्रा संबंधी सांस्कृतिक पद के रूप में सुरक्षित है।
