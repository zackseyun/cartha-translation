source:
  edition: WLC
  text: ו/ל/נער לֹא תַעֲשֶׂ֣ה דָבָ֔ר אֵ֥ין ל/נער חֵ֣טְא מָ֑וֶת כִּ֡י כַּ/אֲשֶׁר֩ יָק֨וּם אִ֤ישׁ עַל רֵעֵ֨/הוּ֙ וּ/רְצָח֣/וֹ נֶ֔פֶשׁ כֵּ֖ן הַ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/026.yaml
  text: But to the young woman you shall do nothing[a]; the young woman has committed no sin deserving death[b]. For this case is like when a man rises against his neighbor and murders him.
translation:
  language: hi
  text: परन्तु उस युवती के साथ तुम कुछ भी न करना; उस युवती में मृत्यु-दण्ड के योग्य कोई दोष नहीं है। क्योंकि यह मामला वैसा ही है जैसे कोई पुरुष अपने पड़ोसी के विरुद्ध उठ खड़ा हो और उसकी हत्या कर दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַנַּעַר
  choice: परन्तु उस युवती के साथ
  rationale: पूर्ववर्ती पद में पुरुष को दिए गए दण्ड से विरोध दिखाने के लिए וְ को ‘परन्तु’ कहा गया है। इस कानूनी प्रसंग में נַעַר का आशय पहले उल्लिखित मंगेतर युवती से है।
- source_word: לֹא תַעֲשֶׂה דָבָר
  choice: कुछ न करना
  rationale: यह दण्डात्मक कार्रवाई का पूर्ण निषेध है। ‘उस युवती के साथ’ को पहले रखने से हिन्दी में स्वाभाविक कानूनी निर्देश बनता है।
- source_word: אֵין לַנַּעַר חֵטְא מָוֶת
  choice: उस युवती ने ऐसा कोई पाप नहीं किया जो मृत्यु-दण्ड के योग्य हो
  rationale: शाब्दिक अर्थ ‘युवती के लिए मृत्यु का पाप नहीं’ है; यहाँ मुहावरा मृत्यु-दण्ड योग्य दोष के अभाव को व्यक्त करता है।
- source_word: כַּאֲשֶׁר יָקוּם אִישׁ עַל רֵעֵהוּ
  choice: जैसे कोई पुरुष अपने पड़ोसी पर चढ़ आए
  rationale: तुलनात्मक संरचना और आक्रमण की सजीव भाषा दोनों सुरक्षित रखी गई हैं; רֵעַ के लिए कानूनी पारस्परिक प्रसंग में ‘पड़ोसी’ उपयुक्त है।
- source_word: וּרְצָחוֹ נֶפֶשׁ
  choice: और उसकी हत्या कर दे
  rationale: רצח अनुचित/आपराधिक वध को दर्शाता है, इसलिए ‘हत्या’ केवल ‘मार डालने’ से अधिक सटीक है। कर्मसूचक प्रत्यय पड़ोसी की ओर संकेत करता है; נֶפֶשׁ का भाव हिन्दी मुहावरे में समाहित है।
- source_word: כֵּן הַדָּבָר הַזֶּה
  choice: यह मामला वैसा ही है
  rationale: न्यायिक प्रसंग में דָּבָר का अर्थ ‘मामला’ है; यह वाक्यांश हत्या के उदाहरण से कानूनी समानता स्थापित करता है।
theological_decisions:
- issue: युवती की निर्दोषता का स्वरूप
  choice: युवती पर ऐसा कोई दोष नहीं है जो मृत्यु-दण्ड योग्य हो।
  alternative: यह कथन किसी कानूनी सीमा के बिना उसकी पूर्ण नैतिक निर्दोषता घोषित करता है।
  rationale: חֵטְא מָוֶת इस व्यवस्था-संबंधी प्रसंग में न्यायिक अर्थ रखता है। अनुवाद उसी कानूनी बल को स्पष्ट करता है, पर पाठ से परे कोई व्यापक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कानूनी शैली अपनाई गई है। ‘मृत्यु-दण्ड’ न्यायिक अर्थ स्पष्ट करता है; ‘पड़ोसी पर चढ़ आए’ मूल की सजीव अभिव्यक्ति को बनाए रखता है।
