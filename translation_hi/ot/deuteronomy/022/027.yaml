  yaml_path: translation/ot/deuteronomy/022/027.yaml
  text: For he found her in the field[a]; the betrothed young woman cried out[b], but there was no one to rescue her.
translation:
  language: hi
  text: क्योंकि उस पुरुष ने उसे खुले मैदान में पाया था[a]; उस मंगेतर युवती ने पुकार लगाई, पर उसे बचाने वाला कोई नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देहात में।’ इब्रानी पद ऐसी खुली, ग्रामीण जगह की ओर संकेत करता है जहाँ आसपास सहायता मिलने की संभावना कम थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कानूनी निर्णय का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַשָּׂדֶה
  choice: खुले मैदान में
  rationale: यह ऐसी ग्रामीण और अपेक्षाकृत एकांत जगह को दर्शाता है जहाँ सहायता उपलब्ध न थी। केवल ‘खेत’ कहने से खेती की भूमि का अनावश्यक संकीर्ण अर्थ निकल सकता है।
- source_word: מְצָאָהּ
  choice: उस पुरुष ने उसे ... पाया था
  rationale: מצא का सामान्य अर्थ ‘पाना’ है। कर्ता को ‘उस पुरुष’ कहने से पिछले संदर्भ का पुरुष स्पष्ट रहता है, जबकि क्रिया मूल के निकट रहती है।
- source_word: צָעֲקָה
  choice: पुकार लगाई
  rationale: צעק संकट में सहायता के लिए पुकारने को व्यक्त करता है। यह ‘चीखी’ से कम संकीर्ण और ‘सहायता के लिए पुकारा’ से कम व्याख्यात्मक है।
- source_word: הנער
  choice: युवती
  rationale: व्यंजनात्मक रूप के बावजूद संदर्भ और स्त्रीलिंग संबंध-सूचक रूप स्त्री को स्पष्ट करते हैं। ‘युवती’ आधुनिक, सम्मानपूर्ण और आयु की दृष्टि से उपयुक्त है।
- source_word: הַמְאֹרָשָׂה
  choice: मंगेतर
  rationale: यह विवाह के लिए औपचारिक रूप से वचनबद्ध स्त्री को दर्शाता है। आधुनिक हिन्दी में ‘मंगेतर’ सहज है और केवल सामान्य प्रेम-संबंध नहीं, विवाह-निश्चय का भाव देता है।
- source_word: וְאֵין מוֹשִׁיעַ לָהּ
  choice: पर उसे बचाने वाला कोई नहीं था
  rationale: यह किसी सहायक या छुड़ाने वाले के अभाव को बताता है। ‘पर’ प्रसंगगत विरोध को स्वाभाविक बनाता है और ‘बचाने वाला’ तत्काल शारीरिक संकट का अर्थ स्पष्ट रखता है।
theological_decisions:
- issue: הַמְאֹרָשָׂה की कानूनी-सामाजिक स्थिति
  choice: मंगेतर
  alternative: जिसका विवाह तय हो चुका था
  rationale: ‘मंगेतर’ प्राचीन व्यवस्था में विवाह के लिए औपचारिक वचनबद्धता को संक्षेप और स्वाभाविक हिन्दी में रखता है, बिना बाद की किसी पंथगत धारणा को जोड़ने के।
- issue: הנער का लिंग-सापेक्ष अनुवाद
  choice: युवती
  alternative: लड़की
  rationale: संदर्भ में स्त्रीलिंग स्पष्ट है। ‘युवती’ गरिमापूर्ण आधुनिक हिन्दी है और ‘लड़की’ से उत्पन्न संभावित बाल्यावस्था का संकेत नहीं देती।
- issue: וְ का संबंध
  choice: पर
  alternative: और
  rationale: मूल संयोजक सामान्य है, पर यहाँ युवती के पुकारने और सहायता न मिलने के बीच विरोधात्मक संबंध निहित है। ‘पर’ अर्थ को स्पष्ट करता है, कारण या दोष के बारे में कोई अतिरिक्त दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। कानूनी प्रसंग की गंभीरता बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ या पुरातन शब्दावली से बचा गया है।
