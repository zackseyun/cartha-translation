id: DEU.22.14
reference: Deuteronomy 22:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שָׂ֥ם לָ/הּ֙ עֲלִילֹ֣ת דְּבָרִ֔ים וְ/הוֹצִ֥יא עָלֶ֖י/הָ שֵׁ֣ם רָ֑ע וְ/אָמַ֗ר אֶת הָ/אִשָּׁ֤ה הַ/זֹּאת֙ לָקַ֔חְתִּי וָ/אֶקְרַ֣ב אֵלֶ֔י/הָ וְ/לֹא מָצָ֥אתִי לָ֖/הּ בְּתוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/014.yaml
  text: and he charges her with false accusations and brings a bad name upon her[a], saying, ‘I took this woman, and when I came near to her[d][c][b], I did not find evidence of virginity in her.’
translation:
  language: hi
  text: और वह उस पर अपमानजनक आरोप लगाए[a], उसे बदनाम करे[b] और कहे, “मैंने इस स्त्री से विवाह किया, पर जब मैं उसके पास गया[c], तो मुझे उसके कुँवारी होने का प्रमाण नहीं मिला[d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झूठे आरोप” अथवा “लांछनकारी बातें।” इब्रानी अभिव्यक्ति मानहानि करनेवाले आरोपों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “उस पर बुरा नाम निकाले”; अर्थात उसकी बदनामी करे।'
    reason: lexical_alternative
  - marker: c
    text: “उसके पास गया” यौन संबंध के लिए प्रयुक्त एक शिष्ट इब्रानी संकेत है।
    reason: lexical_alternative
  - marker: d
    text: 'शाब्दिक अर्थ: “मुझे उसके लिए कौमार्य नहीं मिला।” यहाँ आशय कौमार्य के प्रमाण या चिह्नों से है; आगे के पद इसे स्पष्ट करते हैं।'
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׂם לָהּ עֲלִילֹת דְּבָרִים
  choice: वह उस पर अपमानजनक आरोप लगाए
  rationale: यह इब्रानी मुहावरा किसी पर आरोप मढ़ने या उसके विरुद्ध लांछनकारी बातें कहने को दर्शाता है। “अपमानजनक आरोप” कानूनी और मानहानिकारक संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि आरोपों के झूठे सिद्ध होने की बात को मुख्य पाठ में समय से पहले निश्चित नहीं करता।
- source_word: וְהוֹצִיא עָלֶיהָ שֵׁם רָע
  choice: उसे बदनाम करे
  rationale: शाब्दिक अर्थ “उस पर बुरा नाम निकाले” है; हिन्दी में “उसे बदनाम करे” इसी मुहावरे का स्पष्ट और स्वाभाविक अर्थ देता है।
- source_word: הָאִשָּׁה הַזֹּאת לָקַחְתִּי
  choice: मैंने इस स्त्री से विवाह किया
  rationale: विवाह के संदर्भ में לקח का अर्थ पत्नी के रूप में ग्रहण करना है। “विवाह किया” आधुनिक हिन्दी में आशय स्पष्ट करता है और “इस स्त्री” की दूरी सूचक अभिव्यक्ति बनाए रखता है।
- source_word: וָאֶקְרַב אֵלֶיהָ
  choice: जब मैं उसके पास गया
  rationale: यह यौन संबंध के लिए प्रयुक्त शिष्ट इब्रानी संकेतात्मक अभिव्यक्ति है। हिन्दी रूप भी उसी संयत और संकेतात्मक शैली को बनाए रखता है।
- source_word: וְלֹא מָצָאתִי לָהּ בְּתוּלִים
  choice: मुझे उसके कुँवारी होने का प्रमाण नहीं मिला
  rationale: बहुवचन בְּתוּלִים इस कानूनी प्रसंग में कौमार्य के चिह्न या प्रमाण की ओर संकेत करता है, जैसा अगले पदों में स्पष्ट होता है। यह रूप शाब्दिक अस्वाभाविकता से बचते हुए संदर्भगत अर्थ देता है।
theological_decisions:
- issue: आरोपों को मुख्य पाठ में स्पष्टतः “झूठा” कहना
  choice: मुख्य पाठ में “अपमानजनक आरोप”
  alternative: “झूठे आरोप”
  rationale: पूरे प्रसंग में आरोप झूठे सिद्ध हो सकते हैं, पर עֲלִילֹת דְּבָרִים अपने आप में हर स्थिति में स्पष्ट रूप से “झूठे” नहीं कहता। इसलिए मूल की कानूनी प्रक्रिया और संभावित तनाव को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, कानूनी प्रसंग के अनुरूप गंभीर किंतु सामान्य पाठक के लिए सहज रखी गई है। यौन संबंध के उल्लेख में मूल पाठ की संकेतात्मक शिष्टता बनाए रखी गई है; “कुँवारी होने का प्रमाण” अपेक्षाकृत सहज हिन्दी में संदर्भगत कानूनी अर्थ व्यक्त करता है।
