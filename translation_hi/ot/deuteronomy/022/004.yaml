    issue: Ambiguous antecedent in ‘तुम अवश्य उसके साथ मिलकर उसे उठाना।’
    rationale: The Hebrew עִמּוֹ (‘with him’) refers to the owner/brother, while the implicit object is the fallen animal. In Hindi, the adjacent pronouns ‘उसके’ and ‘उसे’ can leave both referents unclear. Repeating ‘अपने भाई’ preserves the source sense explicitly.
  revised_text: तुम अपने भाई के गधे या बैल को रास्ते में गिरा हुआ देखकर उसकी अनदेखी न करना; उसे अपने भाई के साथ मिलकर अवश्य उठाना।
