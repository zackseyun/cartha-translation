  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹא תִרְאֶה֩ אֶת חֲמ֨וֹר אָחִ֜י/ךָ א֤וֹ שׁוֹר/וֹ֙ נֹפְלִ֣ים בַּ/דֶּ֔רֶךְ וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָקֵ֥ם תָּקִ֖ים עִמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/004.yaml
  text: You shall not see your brother’s donkey or his ox fallen on the road and ignore them[a]; you must surely lift them up with him.
translation:
  language: hi
  text: तुम अपने भाई के गधे या बैल को रास्ते में गिरा हुआ देखकर उसकी अनदेखी न करना; उसे अपने भाई के साथ मिलकर अवश्य उठाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ
  choice: अपने भाई के
  rationale: शाब्दिक अर्थ ‘तुम्हारे भाई का’ है। व्यवस्थाविवरण की वाचा-संबंधी विधियों में यह प्रायः समुदाय के साथी सदस्य को सूचित करता है; ‘भाई’ मूल की पारिवारिक-सामुदायिक शक्ति बनाए रखता है।
- source_word: חֲמוֹר
  choice: गधे
  rationale: यह आधुनिक हिन्दी में इस घरेलू भारवाही पशु का सामान्य और स्पष्ट नाम है।
- source_word: שׁוֹרוֹ
  choice: बैल
  rationale: विधिक और कृषि-संदर्भ में שׁוֹר के लिए ‘बैल’ स्वाभाविक है और काम में लगाए जाने वाले पशु का भाव देता है।
- source_word: נֹפְלִים
  choice: गिरा हुआ
  rationale: नפל का कृदन्त पशुओं की गिरी पड़ी अवस्था बताता है। हिन्दी में संयुक्त एकवचन क्रिया ‘गधे या बैल’ के वैकल्पिक विन्यास के अनुरूप स्वाभाविक है।
- source_word: בַּדֶּרֶךְ
  choice: रास्ते में
  rationale: स्थान को साधारण आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: उसकी अनदेखी न करना
  rationale: עלם का हित्पएल यहाँ जानबूझकर ध्यान न देने या उपेक्षा करने का मुहावरेदार अर्थ रखता है। हिन्दी का एकवचन सर्वनाम वैकल्पिक ‘गधे या बैल’ को स्वाभाविक रूप से संदर्भित करता है।
- source_word: הָקֵם תָּקִים
  choice: तुम अवश्य ... उठाना
  rationale: इनफिनिटिव एब्सोल्यूट और सीमित क्रिया का मेल आज्ञा पर बल देता है; ‘अवश्य’ उस तीव्रता को व्यक्त करता है और ‘उठाना’ मूल क्रिया का सीधा अर्थ बनाए रखता है।
- source_word: עִמּוֹ
  choice: उसके साथ मिलकर
  rationale: इब्रानी में स्पष्टतः ‘उसके साथ’ है, अर्थात पशु के स्वामी के साथ सहयोग करके उठाना। ‘मिलकर’ हिन्दी में इस सहकारी भाव को स्वाभाविक बनाता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में dignified किंतु सहज विधिक शैली रखी गई है। ‘भाई’ को ‘संगी इस्राएली’ बनाकर व्याख्यात्मक रूप से सीमित नहीं किया गया। ‘उसके साथ मिलकर’ मूल के עִמּוֹ को मुख्य पाठ में ही स्पष्ट रखता है, इसलिए पादटिप्पणी आवश्यक नहीं है।
