  text: לֹא תִזְרַ֥ע כַּרְמְ/ךָ֖ כִּלְאָ֑יִם פֶּן תִּקְדַּ֗שׁ הַֽ/מְלֵאָ֤ה הַ/זֶּ֨רַע֙ אֲשֶׁ֣ר תִּזְרָ֔ע וּ/תְבוּאַ֖ת הַ/כָּֽרֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/009.yaml
  text: You shall not sow your vineyard with two kinds of seed[a], lest the whole yield be forfeited—the seed that you sow and the produce of the vineyard.
translation:
  language: hi
  text: तुम अपनी दाख की बारी में दो प्रकार के बीज न बोना, नहीं तो सारी उपज—जो बीज तुम बोओगे और दाख की बारी की उपज—साधारण उपयोग के लिए वर्जित हो जाएगी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “पवित्र अथवा समर्पित हो जाएगी”—अर्थात अलग कर दी जाएगी और फिर साधारण उपयोग में नहीं लाई जा सकेगी।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְרַע
  choice: न बोना
  rationale: זרע का मूल कृषि-अर्थ बीज बोना है; निषेधात्मक विधान को आधुनिक, स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: כַּרְמְךָ
  choice: अपनी दाख की बारी में
  rationale: כרם के लिए ‘दाख की बारी’ मानक और आम पाठक के लिए स्पष्ट हिन्दी पद है।
- source_word: כִּלְאָיִם
  choice: दो प्रकार के बीज
  rationale: द्विवचन रूप כִּלְאָיִם निषिद्ध मिश्रण को सूचित करता है; ‘दो प्रकार के बीज’ स्रोत की रूपात्मक विशिष्टता और प्रसंग दोनों को स्पष्ट रखता है।
- source_word: פֶּן
  choice: नहीं तो
  rationale: פן अनचाहे परिणाम की चेतावनी देता है; ‘नहीं तो’ आधुनिक हिन्दी में स्वाभाविक और विधिक चेतावनी के अनुकूल है।
- source_word: תִּקְדַּשׁ
  choice: साधारण उपयोग के लिए वर्जित हो जाएगी
  rationale: קדש का शाब्दिक अर्थ पवित्र/अलग किया जाना है। इस दंडात्मक कृषि-विधान में अभिप्राय उपज का सामान्य उपयोग से अलग या निषिद्ध हो जाना है; मुख्य पाठ अर्थ स्पष्ट करता है और शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: הַמְלֵאָה
  choice: उसकी सारी उपज
  rationale: הַמְלֵאָה यहाँ खेत या दाख की बारी की पूर्ण उपज को सूचित करता है; ‘सारी उपज’ सहज और प्रसंगानुकूल है।
- source_word: הַזֶּרַע אֲשֶׁר תִּזְרָע וּתְבוּאַת הַכָּרֶם
  choice: तुम्हारे बोए हुए बीज की उपज और दाख की बारी की उपज, दोनों
  rationale: वाक्य के दोनों प्रभावित घटकों को स्पष्ट किया गया है। पहली संज्ञा को प्रसंगानुसार उपज के अर्थ में समझना ‘सारी उपज’ से उसका संबंध स्पष्ट करता है, जबकि दोनों का भेद बना रहता है।
theological_decisions:
- issue: निषिद्ध मिश्रण के संदर्भ में תִּקְדַּשׁ का अर्थ
  choice: साधारण उपयोग के लिए वर्जित हो जाएगी
  alternative: पवित्र/समर्पित हो जाएगी
  rationale: शाब्दिक अर्थ ‘पवित्र या अलग किया जाना’ है, पर यहाँ यह सकारात्मक आध्यात्मिक प्रशंसा नहीं, बल्कि निषिद्ध मिश्रण के कारण उपज के सामान्य उपयोग से हट जाने की चेतावनी है। मुख्य पाठ कानूनी परिणाम स्पष्ट करता है और पादटिप्पणी वास्तविक शाब्दिक तनाव बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज विधिक शैली। ‘तुम ... न बोना’ आज्ञार्थक निषेध को स्वाभाविक रूप से व्यक्त करता है। ‘दाख की बारी’ पारंपरिक रूप से परिचित है, जबकि कठिन धार्मिक-कानूनी क्रिया का अर्थ मुख्य पाठ में स्पष्ट और उसका शाब्दिक रूप पादटिप्पणी में संरक्षित है।
