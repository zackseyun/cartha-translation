base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/007.yaml
  text: You must surely let the mother go[a], but you may take the young for yourself[c][b], so that it may go well for you and you may prolong your days.
translation:
  language: hi
  text: तुम माँ पक्षी को अवश्य छोड़ देना,[a] पर उसके बच्चों को अपने लिए ले सकते हो,[b] ताकि तुम्हारा भला हो और तुम दीर्घायु हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: और अधिक शाब्दिक रूप में, “तुम माँ को निश्चय ही छोड़ देना।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “पुत्रों”; पक्षी के घोंसले के संदर्भ में इसका अर्थ उसके बच्चे या संतान है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלֵּחַ תְּשַׁלַּח
  choice: अवश्य छोड़ देना
  rationale: धातु के infinitive absolute और finite verb का मेल आज्ञा पर विशेष बल देता है। ‘अवश्य छोड़ देना’ इस बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָאֵם
  choice: माता
  rationale: निकटवर्ती संदर्भ पक्षी के घोंसले का है; इसलिए ‘माता’ पर्याप्त है और मूल इब्रानी के निकट रहता है।
- source_word: הַבָּנִים
  choice: बच्चों
  rationale: शाब्दिक अर्थ ‘पुत्र/सन्तान’ है, पर पक्षी के घोंसले के संदर्भ में इसका आशय उसकी सन्तान से है। ‘बच्चों’ सरल है और पिछले पद में उल्लिखित बच्चों अथवा अंडों के संदर्भ को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: תִּקַּח לָךְ
  choice: अपने लिए ले सकते हो
  rationale: आज्ञा के बाद यह क्रियारूप संदर्भ में अनुमति व्यक्त करता है; ‘अपने लिए’ לָךְ को सुरक्षित रखता है।
- source_word: לְמַעַן יִיטַב לָךְ
  choice: ताकि तुम्हारा भला हो
  rationale: यह प्रचलित उद्देश्य/परिणाम-सूचक वाचा-संबंधी वाक्यांश है। यह रूप आधुनिक हिन्दी में स्पष्ट और मूल भाव के निकट है।
- source_word: וְהַאֲרַכְתָּ יָמִים
  choice: और तुम दीर्घायु हो
  rationale: शाब्दिक रूप ‘और तुम दिनों को लम्बा करो’ है; हिन्दी में ‘दीर्घायु हो’ उसी मुहावरे का स्वाभाविक अर्थ देता है और לְמַעַן के अधीन उद्देश्य/परिणाम को बनाए रखता है।
theological_decisions:
- issue: प्रतिज्ञात परिणाम का स्वरूप
  choice: आज्ञापालन से जुड़ी वाचा-संबंधी आशीष/परिणाम के रूप में ‘ताकि तुम्हारा भला हो और तुम दीर्घायु हो’
  alternative: हर व्यक्ति के लिए दीर्घ जीवन की कठोर, बिना शर्त गारंटी
  rationale: इब्रानी उद्देश्य/परिणाम-सूचक सूत्र आज्ञापालन से जुड़ी आशीष बताता है, पर अनुवाद को उससे आगे बढ़कर हर व्यक्तिगत मामले की यांत्रिक गारंटी नहीं बनाना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन संबोधन के लिए ‘तुम’ प्रयुक्त है। मुख्य पाठ में इब्रानी की बलयुक्त आज्ञा, अनुमति और उद्देश्य/परिणाम का संबंध सुरक्षित रखा गया है।
