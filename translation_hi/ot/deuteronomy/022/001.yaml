id: DEU.22.1
reference: Deuteronomy 22:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא תִרְאֶה֩ אֶת שׁ֨וֹר אָחִ֜י/ךָ א֤וֹ אֶת שֵׂי/וֹ֙ נִדָּחִ֔ים וְ/הִתְעַלַּמְתָּ֖ מֵ/הֶ֑ם הָשֵׁ֥ב תְּשִׁיבֵ֖/ם לְ/אָחִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/001.yaml
  text: You shall not see your brother’s ox or his sheep driven away and ignore them; you must certainly return them to your brother.
translation:
  language: hi
  text: तुम अपने भाई के बैल या उसकी भेड़ को भटका हुआ देखकर उनकी अनदेखी न करना; तुम उन्हें अवश्य अपने भाई के पास लौटा देना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָחִיךָ
  choice: अपने भाई
  rationale: व्यवस्थाविवरण की वाचा-समुदाय संबंधी भाषा को बनाए रखता है; यहाँ इसे सामान्यीकृत कर केवल ‘पड़ोसी’ कहना मूल के पारिवारिक रूपक को मिटा देगा।
- source_word: שֵׂיוֹ
  choice: उसकी भेड़
  rationale: שֶׂה छोटे पशु, विशेषतः भेड़ या बकरी, का द्योतक हो सकता है। संदर्भ और पारंपरिक जोड़ी ‘बैल और भेड़’ के अनुसार ‘भेड़’ स्वाभाविक है, जबकि व्यापक पशु-संज्ञा अनावश्यक रूप से अस्पष्ट होगी।
- source_word: נִדָּחִים
  choice: भटका हुआ
  rationale: נדח का अर्थ खदेड़ा गया, दूर जा पड़ा या भटक गया हो सकता है। पशुओं के संदर्भ में ‘भटका हुआ’ कारण तय किए बिना उनकी अपने स्थान से दूर होने की दशा व्यक्त करता है। हिंदी में संयुक्त कर्ता के बाद विधेय को स्वाभाविक रखने के लिए एकवचन-सदृश रूप प्रयुक्त है।
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: उनकी अनदेखी न करना
  rationale: हित्पएल रूप जानबूझकर आँख फेर लेने या ध्यान न देने का भाव देता है; ‘अनदेखी करना’ आधुनिक हिंदी में इसे स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: הָשֵׁב תְּשִׁיבֵם
  choice: तुम उन्हें अवश्य ... लौटा देना
  rationale: एक ही धातु के infinitive absolute और finite verb का मेल आदेश पर बल देता है। ‘अवश्य’ उस जोर को स्वाभाविक हिंदी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘भाई’ की सामाजिक सीमा
  choice: मूल रूपक ‘अपने भाई’ को बनाए रखा गया
  alternative: ‘अपने पड़ोसी’ या ‘अपने देशवासी’
  rationale: पद स्वयं אָחִיךָ कहता है। इसकी सामुदायिक सीमा की व्याख्या किए बिना मूल संबोधन को रखना धर्मवैचारिक तनाव और पाठ की भाषा दोनों सुरक्षित रखता है।
- issue: निद्दाहिम में क्रिया की कारकता
  choice: ‘भटका हुआ’
  alternative: ‘खदेड़ा हुआ’ या ‘दूर चला गया’
  rationale: हिब्रू रूप पशु के दूर हो जाने की दशा बताता है, पर यह आवश्यक नहीं कि किसी बाहरी कर्ता ने उसे खदेड़ा हो। अनुवाद उस अनिश्चितता को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सीधा निषेधात्मक आदेश और गरिमापूर्ण किंतु सामान्य शब्दावली। ‘न करना’ और ‘लौटा देना’ तोराही निर्देश की बोलचाल-सुलभ दृढ़ता रखते हैं; किसी संप्रदायगत विस्तार को नहीं जोड़ा गया।
