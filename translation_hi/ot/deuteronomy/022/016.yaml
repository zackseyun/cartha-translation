base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/016.yaml
  text: And the young woman’s father shall say to the elders[a], ‘I gave my daughter to this man as a wife, and he hates her.’
translation:
  language: hi
  text: तब उस युवती का पिता बुज़ुर्गों से कहेगा, “मैंने अपनी बेटी का विवाह इस पुरुष से किया, और वह उससे घृणा करता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַר
  choice: तब ... कहेगा
  rationale: विधिक प्रकरण की कार्यविधि में यह क्रिया अगले निर्धारित कदम को व्यक्त करती है; इसलिए भविष्यसूचक ‘कहेगा’ स्वाभाविक है।
- source_word: אֲבִי הַנַּעַר
  choice: उस युवती का पिता
  rationale: संदर्भ विवाह योग्य आयु की युवती का है; ‘युवती’ आधुनिक और सम्मानपूर्ण है।
- source_word: הַזְּקֵנִים
  choice: पुरनियों
  rationale: यह केवल वृद्ध पुरुषों को नहीं, बल्कि नगर के मान्य नागरिक-न्यायिक अगुओं को सूचित करता है; ‘पुरनिये’ बाइबलीय विधिक संदर्भ में इस पद को संक्षेप में व्यक्त करता है।
- source_word: אֶת בִּתִּי
  choice: अपनी बेटी
  rationale: प्रत्यक्ष कथन में בִּתִּי का स्वाभाविक हिन्दी रूप ‘अपनी बेटी’ है; אֶת का पृथक अनुवाद नहीं होता।
- source_word: נָתַתִּי
  choice: विवाह ... किया था
  rationale: इस विवाह-सूत्र में ‘देना’ बेटी को पत्नी के रूप में दिए जाने को दर्शाता है; आधुनिक हिन्दी में ‘विवाह किया’ आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לָאִישׁ הַזֶּה
  choice: इस पुरुष से
  rationale: אִישׁ का मूल अर्थ ‘पुरुष’ है और ‘इस’ आरोपित पति की ओर संकेत करता है। हिन्दी विवाह-प्रयोग के कारण ‘से’ स्वाभाविक है।
- source_word: לְאִשָּׁה
  choice: विवाह
  rationale: ‘पत्नी के रूप में’ के विवाह-संबंधी अर्थ को हिन्दी में ‘विवाह करना’ स्वाभाविक रूप से समेटता है।
- source_word: וַיִּשְׂנָאֶהָ
  choice: पर अब वह उससे घृणा करता है
  rationale: שׂנא स्पष्ट रूप से ‘घृणा करना’ है। पूर्व घटना और वर्तमान दशा का विरोध हिन्दी में ‘पर अब’ से सहज रूप में सामने आता है, यद्यपि ‘अब’ संदर्भगत है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध विधिक-वर्णनात्मक रूप। ‘पुरनियों’ पद संस्थागत अर्थ बनाए रखता है; प्रत्यक्ष कथन सहज हिन्दी वाक्य-विन्यास में है।
