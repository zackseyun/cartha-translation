language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י יִהְיֶה֙ נער בְתוּלָ֔ה מְאֹרָשָׂ֖ה לְ/אִ֑ישׁ וּ/מְצָאָ֥/הּ אִ֛ישׁ בָּ/עִ֖יר וְ/שָׁכַ֥ב עִמָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/023.yaml
  text: If there is a young woman[a], a virgin, pledged to a man, and another man finds her in the city and lies with her,
translation:
  language: hi
  text: यदि कोई कुँवारी युवती किसी पुरुष से विधिवत् मंगनी की हुई हो[a], और कोई पुरुष उसे नगर में पाए और उसके साथ सोए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् किसी पुरुष से औपचारिक, कानूनी रूप से बाध्यकारी विवाह-वचन में बँधी हुई।
    reason: मְאֹרָשָׂה के औपचारिक और बाध्यकारी विवाह-वचन के अर्थ को स्पष्ट करता है; आधुनिक ‘मंगनी’ के अपेक्षाकृत अनौपचारिक अर्थ से बचाता है।
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: यदि कोई ... हो
  rationale: यह वाक्यांश यहाँ विधि-संबंधी काल्पनिक स्थिति प्रस्तुत करता है; आधुनिक हिन्दी में ‘यदि ... हो’ उसका स्वाभाविक रूप है।
- source_word: נער בְתוּלָה
  choice: कुँवारी युवती
  rationale: व्यंजन-पाठ में נער है, पर मातृलेख और प्रसंग स्त्रीलिंग ‘युवती’ की ओर संकेत करते हैं; בְתוּלָה को स्पष्ट रूप से ‘कुँवारी’ रखा गया है।
- source_word: מְאֹרָשָׂה לְאִישׁ
  choice: किसी पुरुष से मँगनी की हुई
  rationale: यह औपचारिक और कानूनी रूप से बाध्यकारी विवाह-वचन को दर्शाता है। ‘मँगनी की हुई’ सामान्य आधुनिक हिन्दी में बोधगम्य है, यद्यपि प्राचीन व्यवस्था आधुनिक मँगनी से अधिक बाध्यकारी थी।
- source_word: וּמְצָאָהּ אִישׁ
  choice: और कोई पुरुष उसे ... पाकर
  rationale: इब्रानी में केवल ‘एक/कोई पुरुष’ है। हिन्दी में संबंधसूचक ‘कोई पुरुष’ उस व्यक्ति को पहले उल्लिखित मंगेतर से अलग समझने देता है, बिना ‘दूसरा’ शब्द जोड़े।
- source_word: בָּעִיר
  choice: नगर में
  rationale: स्थान विधिक प्रसंग में महत्त्वपूर्ण है; ‘नगर’ עִיר का सटीक और स्वाभाविक हिन्दी रूप है।
- source_word: וְשָׁכַב עִמָּהּ
  choice: उसके साथ सोए
  rationale: यह मूल के यौन-संबंधसूचक शिष्टोक्ति को बनाए रखता है और इस पद में बलप्रयोग या सहमति का अर्थ नहीं जोड़ता।
theological_decisions:
- issue: क्या इस पद में यौन कृत्य को स्पष्टतः बलपूर्वक बताया जाए
  choice: ‘उसके साथ सोए’—तटस्थ शिष्टोक्ति
  alternative: ‘उसके साथ बलात्कार करे’ अथवा ‘उसे विवश करके उसके साथ सोए’
  rationale: इस पद के शब्द स्वयं बलप्रयोग को निर्दिष्ट नहीं करते। अतः निकटवर्ती पदों से निष्कर्ष लेकर उसे यहाँ जोड़ना मूल की अस्पष्टता और विधिक तनाव को मिटा देगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘कुँवारी युवती’ कानूनी विवरण को स्पष्ट रखता है; ‘मँगनी की हुई’ प्रचलित भाषा है, और ‘उसके साथ सोए’ मूल की शिष्टोक्ति तथा अस्पष्टता को सुरक्षित रखता है। अंग्रेज़ी परामर्श-पाठ में दिया [a] चिह्न उसके अपने पाठ में ‘young woman’ के बाद है, जबकि उसकी टिप्पणी वास्तव में betrothal से जुड़ी प्रतीत होती है; इसलिए हिन्दी मुख्य पाठ में कोई भ्रामक पादटिप्पणी-चिह्न नहीं जोड़ा गया।
