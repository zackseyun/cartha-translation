  text: וְֽ/אִם בַּ/שָּׂדֶ֞ה יִמְצָ֣א הָ/אִ֗ישׁ אֶת ה/נער הַ/מְאֹ֣רָשָׂ֔ה וְ/הֶחֱזִֽיק בָּ֥/הּ הָ/אִ֖ישׁ וְ/שָׁכַ֣ב עִמָּ֑/הּ וּ/מֵ֗ת הָ/אִ֛ישׁ אֲשֶׁר שָׁכַ֥ב עִמָּ֖/הּ לְ/בַדּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/025.yaml
  text: But if in the open field the man finds the young woman who is betrothed[a], and the man seizes her and lies with her, then only the man who lay with her shall die.
translation:
  language: hi
  text: परन्तु यदि खुले मैदान में वह पुरुष उस युवती को पाए जिसकी मंगनी हो चुकी है, और वह पुरुष उसे बलपूर्वक पकड़कर उसके साथ सोए, तो केवल वही पुरुष जो उसके साथ सोए, मार डाला जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले कानूनी प्रसंग के विपरीत परिस्थिति प्रस्तुत करता है; इसलिए केवल ‘यदि’ की अपेक्षा ‘परन्तु यदि’ संदर्भगत विरोध को स्पष्ट करता है।
- source_word: בַּשָּׂדֶה
  choice: खुले मैदान में
  rationale: שׂדה का मूल अर्थ ‘मैदान/खेत’ है; ‘खुले मैदान’ से उस निर्जन बाहरी स्थान का संकेत मिलता है जो आसपास के नियम में कानूनी भेद के लिए महत्त्वपूर्ण है।
- source_word: הַנַּעַר הַמְאֹרָשָׂה
  choice: वह युवती ... जिसकी मंगनी हो चुकी है
  rationale: נער के स्त्री-संदर्भ को आधुनिक हिन्दी में ‘युवती’ और ארשׂ की कानूनी रूप से वचनबद्ध स्थिति को ‘मंगनी हो चुकी है’ से स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: וְהֶחֱזִיק בָּהּ
  choice: उसे बलपूर्वक पकड़कर
  rationale: חזק के हिफ़ील रूप और ב के साथ प्रयोग में बल लगाकर पकड़ने या काबू करने का भाव है। ‘बलपूर्वक पकड़कर’ क्रिया की जबरदस्ती को व्यक्त करता है, पर मूल क्रिया से आगे बढ़कर सीधे ‘बलात्कार करे’ नहीं कहता।
- source_word: וְשָׁכַב עִמָּהּ
  choice: उसके साथ सोए
  rationale: यह यौन-संबंध के लिए मानक इब्रानी मुहावरा है; हिन्दी में यह गरिमापूर्ण और समझने योग्य समतुल्य अभिव्यक्ति है।
- source_word: וּמֵת ... לְבַדּוֹ
  choice: केवल वही पुरुष ... मार डाला जाए
  rationale: कानूनी संदर्भ में मृत्यु-दंड का आदेश है और לבדו स्पष्ट करता है कि दंड केवल पुरुष पर लागू होगा, युवती पर नहीं। कर्मवाच्य ‘मार डाला जाए’ न्यायिक कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या यौन हिंसा को मुख्य पाठ में सीधे ‘बलात्कार’ कहकर स्पष्ट किया जाए
  choice: ‘बलपूर्वक पकड़कर उसके साथ सोए’
  alternative: ‘उसके साथ बलात्कार करे’ या ‘उसे विवश करके उसके साथ सोए’
  rationale: संदर्भ निःसंदेह असहमति और हिंसा का है, पर यहाँ प्रयुक्त חזק का शाब्दिक बल ‘पकड़ना/काबू करना’ है, न कि अपने आप में ‘बलात्कार करना’। चुना हुआ पाठ बलप्रयोग स्पष्ट करता है और साथ ही मूल की शब्दगत सीमा बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कानूनी शैली। ‘परन्तु’, ‘युवती’ और ‘मार डाला जाए’ पाठ को गंभीर रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सहज है। कोई पादटिप्पणी आवश्यक नहीं रखी गई, क्योंकि ‘बलपूर्वक पकड़कर’ मुख्य पाठ में ही חזק का जबरदस्ती वाला भाव पर्याप्त रूप से स्पष्ट करता है।
