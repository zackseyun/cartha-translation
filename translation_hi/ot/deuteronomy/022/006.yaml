  text: כִּ֣י יִקָּרֵ֣א קַן צִפּ֣וֹר לְ/פָנֶ֡י/ךָ בַּ/דֶּ֜רֶךְ בְּ/כָל עֵ֣ץ א֣וֹ עַל הָ/אָ֗רֶץ אֶפְרֹחִים֙ א֣וֹ בֵיצִ֔ים וְ/הָ/אֵ֤ם רֹבֶ֨צֶת֙ עַל הָֽ/אֶפְרֹחִ֔ים א֖וֹ עַל הַ/בֵּיצִ֑ים לֹא תִקַּ֥ח הָ/אֵ֖ם עַל הַ/בָּנִֽים־׀־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/006.yaml
  text: If a bird’s nest happens to be before you on the way[a], in any tree or on the ground, with young ones or eggs, and the mother is sitting on the young ones or on the eggs[b], you shall not take the mother along with the young.
translation:
  language: hi
  text: यदि रास्ते में तुम्हें किसी पेड़ पर या भूमि पर किसी पक्षी का घोंसला संयोग से मिल जाए[a], और उसमें बच्चे या अंडे हों, तथा माँ उन बच्चों या अंडों पर बैठी हो, तो माँ को बच्चों समेत न लेना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तुम्हें किसी पक्षी का घोंसला मिल जाए।” इब्रानी क्रिया जानबूझकर खोजने के बजाय संयोग से मिल जाने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “माँ को बच्चों के ऊपर [न लेना]।” यहाँ यह मुहावरा माँ को उसकी संतति के साथ ले लेने का अर्थ देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यह प्रसंगाधारित व्यवस्था की शर्त आरम्भ करता है; आधुनिक हिन्दी में ‘यदि’ कानूनी शर्त को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִקָּרֵא
  choice: संयोग से ... आ जाए
  rationale: קרא के निफ़अल रूप से जानबूझकर खोजने के बजाय आकस्मिक रूप से सामने पड़ने का भाव निकलता है।
- source_word: קַן צִפּוֹר
  choice: किसी पक्षी का घोंसला
  rationale: सम्बन्धवाचक इब्रानी पदबंध का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: לְפָנֶיךָ בַּדֶּרֶךְ
  choice: रास्ते में ... तुम्हारे सामने
  rationale: स्थान और यात्रा—दोनों भाव सुरक्षित रहते हैं; ‘रास्ता’ केवल पक्की सड़क तक सीमित नहीं है।
- source_word: בְּכָל עֵץ אוֹ עַל הָאָרֶץ
  choice: किसी पेड़ पर या भूमि पर
  rationale: घोंसले के स्थान को स्वाभाविक हिन्दी में व्यक्त करता है; הָאָרֶץ यहाँ ठोस रूप से धरती/भूमि को सूचित करता है।
- source_word: אֶפְרֹחִים
  choice: बच्चे
  rationale: पक्षी के छोटे बच्चों के लिए सामान्य और सहज शब्द है; यह उनकी प्रजाति या विकास-अवस्था को अनावश्यक रूप से सीमित नहीं करता।
- source_word: בֵיצִים
  choice: अंडे
  rationale: प्रत्यक्ष और असंदिग्ध समतुल्य।
- source_word: וְהָאֵם
  choice: माँ
  rationale: मूल पाठ केवल ‘माँ’ कहता है; पक्षी का सन्दर्भ पहले से स्पष्ट है।
- source_word: רֹבֶצֶת
  choice: बैठी हो
  rationale: अंडों या बच्चों पर स्थित माँ-पक्षी का स्वाभाविक हिन्दी वर्णन; ‘से रही हो’ मूल से अधिक विशिष्ट होता।
- source_word: לֹא תִקַּח
  choice: न लेना
  rationale: शर्तवाचक वाक्य में निषेध की विधिक शक्ति को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: הָאֵם עַל הַבָּנִים
  choice: बच्चों के साथ माँ को
  rationale: यहाँ עַל को स्थानसूचक ‘ऊपर’ के बजाय साथ ले जाने के अर्थ वाले मुहावरे के रूप में समझना प्रसंगानुकूल है; शब्दक्रम माँ को लेने की मनाही पर बल बनाए रखता है।
