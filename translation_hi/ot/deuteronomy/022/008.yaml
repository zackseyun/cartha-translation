  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י תִבְנֶה֙ בַּ֣יִת חָדָ֔שׁ וְ/עָשִׂ֥יתָ מַעֲקֶ֖ה לְ/גַגֶּ֑/ךָ וְ/לֹֽא תָשִׂ֤ים דָּמִים֙ בְּ/בֵיתֶ֔/ךָ כִּֽי יִפֹּ֥ל הַ/נֹּפֵ֖ל מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/008.yaml
  text: When you build a new house[a], you shall make a parapet for your roof, so that you do not bring bloodguilt on your house if someone falls from it.
translation:
  language: hi
  text: जब तुम नया घर बनाओ, तो अपने नए घर की छत के चारों ओर मुंडेर बनाना, ताकि यदि कोई वहाँ से गिर जाए, तो तुम अपने घर पर रक्तदोष न लाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ यह शब्द कारण नहीं, बल्कि व्यवस्था में एक परिस्थिति प्रस्तुत करता है; इसलिए ‘जब’ स्वाभाविक और सटीक है।
- source_word: תִבְנֶה בַּיִת חָדָשׁ
  choice: तुम नया घर बनाओ
  rationale: क्रिया, कर्म और विशेषण को आधुनिक हिंदी के स्वाभाविक क्रम में रखा गया है।
- source_word: וְעָשִׂיתָ
  choice: तब ... बनाना
  rationale: इस कानूनी प्रसंग में वाव-सहित पूर्ण क्रिया आज्ञार्थक दायित्व व्यक्त करती है; ‘बनाना’ हिंदी में स्पष्ट निर्देश देता है।
- source_word: מַעֲקֶה
  choice: मुंडेर
  rationale: यह सपाट छत के किनारे बनाई जाने वाली सुरक्षात्मक दीवार या घेराबंदी को दर्शाता है। ‘मुंडेर’ सामान्य हिंदी में संक्षिप्त और परिचित है।
- source_word: לְגַגֶּךָ
  choice: उसकी छत के चारों ओर
  rationale: इब्रानी में शाब्दिक रूप से ‘तुम्हारी छत के लिए’ है; हिंदी में अवरोध की वास्तविक स्थिति स्पष्ट करने हेतु ‘चारों ओर’ स्वाभाविक है।
- source_word: וְלֹא תָשִׂים דָּמִים בְּבֵיתֶךָ
  choice: तुम अपने घर पर खून का दोष न लाओ
  rationale: ‘खून रखना’ इब्रानी मुहावरा है, जिसका आशय रोकी जा सकने वाली मृत्यु के लिए उत्तरदायित्व या रक्त-दोष लाना है। ‘खून का दोष’ कानूनी-नैतिक अर्थ को सहज हिंदी में सुरक्षित रखता है।
- source_word: כִּי יִפֹּל הַנֹּפֵל
  choice: यदि कोई ... गिर जाए
  rationale: इब्रानी की पुनरुक्तिपूर्ण अभिव्यक्ति एक अनिश्चित संभावित व्यक्ति और परिस्थिति को बताती है; हिंदी में ‘यदि कोई गिर जाए’ इसका स्वाभाविक रूप है।
- source_word: מִמֶּנּוּ
  choice: वहाँ से
  rationale: सर्वनाम का निकटतम व्यावहारिक संकेत छत/घर की ऊँची संरचना की ओर है। ‘वहाँ से’ हिंदी में संदर्भ को स्पष्ट रखता है, बिना मूल से अधिक निश्चितता थोपे।
theological_decisions:
- issue: कानूनी प्रसंग में דָּמִים का अर्थ
  choice: खून का दोष
  alternative: रक्तपात; खून बहाने का दोष
  rationale: पद केवल भौतिक रक्तपात नहीं, बल्कि रोकी जा सकने वाली मृत्यु के लिए कानूनी और नैतिक उत्तरदायित्व की बात करता है। ‘खून का दोष’ इस अर्थ को बिना अतिरिक्त सैद्धांतिक व्याख्या के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। कानूनी निर्देश का बल ‘बनाना’ और उद्देश्य का संबंध ‘ताकि’ से व्यक्त किया गया है; ‘खून का दोष’ मूल के कानूनी-नैतिक तनाव को सुरक्षित रखता है।
