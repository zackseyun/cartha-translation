review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the unknown person as the owner ('your brother') and the item as the lost property. However, 'ढूँढ़ता हुआ न आए' adds an arrival/motion element not present in דָּרַשׁ ('seek, inquire after, claim'). 'न रहता हो' also tends to specify residence, whereas the Hebrew states that the brother is not near.
  naturalness: The proposed revision is concise, idiomatic modern standard Hindi and retains an appropriately formal legal register. Removing the repeated noun 'वस्तु' also avoids implying that the lost property cannot be an animal.
  terminology: ‘तुम्हारा भाई’ appropriately preserves the Hebrew kinship term, with the cultural scope explained in note a. ‘लौटा देना’ is clear legal-restorative Hindi for the final command.
  issues:
  - severity: medium
    issue: ‘जब तक तुम्हारा भाई उसे ढूँढ़ता हुआ न आए’ adds ‘comes/arrives.’
    rationale: The Hebrew says only ‘until your brother seeks/inquires after it’; it does not express arrival. The added action narrows and expands the source sense.
  - severity: low
    issue: ‘तुम्हारे निकट न रहता हो’ can imply that the owner does not reside nearby.
    rationale: קָרוֹב אֵלֶיךָ expresses present physical proximity. ‘तुम्हारे निकट न हो’ preserves this without making residence explicit.
  - severity: low
    issue: ‘उस वस्तु’ may unnecessarily restrict the referent to an inanimate object.
    rationale: The immediately preceding context includes lost animals as well as other lost property. The pronoun ‘उसे’ preserves the source’s contextual breadth.
  revised_text: परन्तु यदि तुम्हारा भाई तुम्हारे निकट न हो[a], और तुम उसे न जानते हो[b], तो उसे अपने घर ले आना; वह तुम्हारे पास तब तक रहे, जब तक तुम्हारा भाई उसे ढूँढ़े; फिर उसे लौटा देना।
