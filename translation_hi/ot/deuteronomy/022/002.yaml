language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִם לֹ֨א קָר֥וֹב אָחִ֛י/ךָ אֵלֶ֖י/ךָ וְ/לֹ֣א יְדַעְתּ֑/וֹ וַ/אֲסַפְתּ/וֹ֙ אֶל תּ֣וֹךְ בֵּיתֶ֔/ךָ וְ/הָיָ֣ה עִמְּ/ךָ֗ עַ֣ד דְּרֹ֤שׁ אָחִ֨י/ךָ֙ אֹת֔/וֹ וַ/הֲשֵׁבֹת֖/וֹ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/002.yaml
  text: But if your brother is not near you[a], and you do not know him, then you shall bring it into your house, and it shall remain with you until your brother seeks it[c][b]; then you shall restore it to him.
translation:
  language: hi
  text: परन्तु यदि तुम्हारा भाई तुम्हारे निकट न हो[a], और तुम उसे न जानते हो[b], तो उसे अपने घर ले आना; वह तुम्हारे पास तब तक रहे, जब तक तुम्हारा भाई उसे ढूँढ़े; फिर उसे लौटा देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भाई” से आशय केवल सगा भाई नहीं, बल्कि संभवतः इस्राएली वाचा-समुदाय का कोई साथी सदस्य भी है।
    reason: cultural_note
  - marker: b
    text: अर्थात् तुम यह नहीं जानते कि उसका मालिक कौन है; शाब्दिक रूप से, “तुम उसे नहीं जानते हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: तुम्हारा भाई
  rationale: इब्रानी के संबंधसूचक शब्द को यथावत रखा गया है; इस व्यवस्थागत संदर्भ में इसका अर्थ केवल सगा भाई नहीं, बल्कि वाचा-समुदाय का साथी सदस्य भी हो सकता है।
- source_word: קָרוֹב אֵלֶיךָ
  choice: तुम्हारे निकट न रहता हो
  rationale: वाक्यांश भौतिक निकटता बताता है। हिंदी में यह रूप उस स्थिति को स्वाभाविक ढंग से व्यक्त करता है जिसमें मालिक पास में नहीं रहता।
- source_word: וְלֹא יְדַעְתּוֹ
  choice: तुम उसे न जानते हो
  rationale: पुल्लिंग एकवचन प्रत्यय का शाब्दिक संबंध ‘भाई’ से है। संदर्भ में आशय है कि पाने वाला मालिक को नहीं जानता; इस निहितार्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ
  choice: उस वस्तु को अपने घर ले आना
  rationale: आज्ञा खोई हुई चीज़ या पशु को अपने संरक्षण में घर लाने की है। ‘उस वस्तु’ पिछले पद की विभिन्न खोई हुई संपत्तियों को समेटता है।
- source_word: וְהָיָה עִמְּךָ
  choice: वह तुम्हारे पास तब तक रहे
  rationale: शाब्दिक ‘तुम्हारे साथ हो’ का प्रसंगानुकूल स्थायी भाव ‘तुम्हारे पास रहे’ से स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: עַד דְּרֹשׁ אָחִיךָ אֹתוֹ
  choice: जब तक तुम्हारा भाई उसे ढूँढ़ता हुआ न आए
  rationale: דרש यहाँ खोई संपत्ति को खोजने, उसके विषय में पूछताछ करने या उस पर दावा करने का भाव रखता है। यह हिंदी अभिव्यक्ति उस खोज को सहज रूप देती है, बिना दावे के कानूनी भाव को अनावश्यक रूप से निश्चित किए।
- source_word: וַהֲשֵׁבֹתוֹ לוֹ
  choice: तुम उसे वह वस्तु लौटा देना
  rationale: שוב का हिफ़ील रूप वस्तु को उसके मालिक के पास वापस पहुँचाने का निर्देश देता है; ‘लौटा देना’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ‘भाई’ का सामाजिक दायरा
  choice: मुख्य पाठ में ‘तुम्हारा भाई’ रखा गया
  alternative: ‘तुम्हारा साथी इस्राएली’
  rationale: मूल की नातेदारी वाली भाषा सुरक्षित रखी गई है, जबकि पादटिप्पणी बताती है कि व्यवस्थाविवरण में इसका प्रयोग व्यापक वाचा-समुदाय के सदस्य के लिए हो सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सरल व्यवस्थागत शैली अपनाई गई है। ‘परन्तु’, ‘निकट’ और ‘लौटा देना’ औपचारिकता तथा सहज बोध के बीच संतुलन रखते हैं। सर्वनामों की संभावित अस्पष्टता घटाने के लिए दो स्थानों पर ‘वस्तु’ स्पष्ट किया गया है।
