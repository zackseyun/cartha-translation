  to: परन्तु यदि तुम्हारा भाई तुम्हारे निकट न हो[a], और तुम उसे न जानते हो[b], तो उसे अपने घर ले आना; वह तुम्हारे पास तब तक रहे, जब तक तुम्हारा भाई उसे ढूँढ़े; फिर उसे लौटा देना।
