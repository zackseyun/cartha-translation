source:
  edition: WLC
  text: וְ/הִנֵּה ה֡וּא שָׂם֩ עֲלִילֹ֨ת דְּבָרִ֜ים לֵ/אמֹ֗ר לֹֽא מָצָ֤אתִי לְ/בִתְּ/ךָ֙ בְּתוּלִ֔ים וְ/אֵ֖לֶּה בְּתוּלֵ֣י בִתִּ֑/י וּ/פָֽרְשׂוּ֙ הַ/שִּׂמְלָ֔ה לִ/פְנֵ֖י זִקְנֵ֥י הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/017.yaml
  text: and look[a], he has charged her with slanderous words, saying, “I did not find your daughter a virgin.” But these are the proofs of my daughter’s virginity[c][b]. And they shall spread out the garment before the elders of the city.
translation:
  language: hi
  text: और देखो, उसने उस पर यह लांछन लगाया है कि, ‘मैंने तुम्हारी बेटी को कुँवारी नहीं पाया।’[a] पर ये मेरी बेटी के कुँवारी होने के चिह्न हैं।[b] और वे उस वस्त्र[c] को नगर के बुज़ुर्गों के सामने फैला देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मैंने तुम्हारी बेटी के लिए कुँवारेपन नहीं पाए।” यह एक मुहावरा है, जिसका अर्थ है कि वह दावा करता है कि बेटी कुँवारी नहीं थी।
    reason: lexical_alternative
  - marker: b
    text: या “मेरी बेटी के कुँवारी होने के प्रमाण।”
    reason: lexical_alternative
  - marker: c
    text: यह उस कपड़े/वस्त्र को सूचित करता है जो इस कानूनी मामले में साक्ष्य के रूप में प्रस्तुत किया जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह कथन की ओर ध्यान खींचने वाला संवाद-सूचक है; ‘देखो’ उसके संकेतात्मक बल को आधुनिक और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שָׂם עֲלִילֹת דְּבָרִים
  choice: उस पर बदनामी के आरोप लगाए हैं
  rationale: यह मुहावरा किसी पर अपमानजनक अथवा झूठे आरोप मढ़ने का भाव रखता है। ‘बदनामी के आरोप’ न्यायिक और मानहानिकारक दोनों पहलुओं को व्यक्त करता है; ‘उस पर’ प्रसंग से स्पष्ट बेटी के लिए जोड़ा गया है।
- source_word: לֹא מָצָאתִי לְבִתְּךָ בְּתוּלִים
  choice: मुझे तुम्हारी बेटी के कुँवारी होने का प्रमाण नहीं मिला
  rationale: इब्रानी में ‘तुम्हारी बेटी के लिए कुँवारेपन नहीं पाए’ जैसा बहुवचन मुहावरा है। कानूनी प्रसंग में ‘प्रमाण’ आरोप का आशय स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप और संभावित अर्थ बनाए रखती है।
- source_word: וְאֵלֶּה בְּתוּלֵי בִתִּי
  choice: पर ये मेरी बेटी के कुँवारी होने के प्रमाण हैं
  rationale: बहुवचन בְּתוּלִים यहाँ कुँवारेपन से जुड़े चिह्नों अथवा साक्ष्य को दर्शाता है। ‘प्रमाण’ न्यायिक प्रसंग में सहज है; ‘पर’ पिता के प्रतिवाद को स्पष्ट करता है।
- source_word: וּפָרְשׂוּ
  choice: तब वे ... फैलाएँ
  rationale: क्रिया अगली विधिक कार्रवाई बताती है। ‘फैलाएँ’ निर्देशात्मक भाव रखता है और ‘तब’ घटनाक्रम को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: הַשִּׂמְלָה
  choice: वस्त्र
  rationale: शब्द वस्त्र अथवा कपड़े के लिए प्रयुक्त हो सकता है। ‘वस्त्र’ मूल की व्यापकता बनाए रखता है और वस्तु को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: לִפְנֵי זִקְנֵי הָעִיר
  choice: नगर के पुरनियों के सामने
  rationale: यह नागरिक न्यायाधिकारियों के समक्ष साक्ष्य प्रस्तुत करने का मानक वाक्यांश है। ‘पुरनिये’ हिन्दी बाइबलीय प्रयोग में समुदाय के वरिष्ठ अगुओं को दर्शाता है।
theological_decisions:
- issue: בְּתוּלִים का अर्थ—कुँवारापन या उसके भौतिक चिह्न
  choice: मुख्य पाठ में ‘कुँवारी होने का प्रमाण/प्रमाण हैं’
  alternative: ‘कुँवारापन’ अथवा ‘कुँवारेपन के चिह्न’
  rationale: कानूनी प्रसंग और आगे वस्त्र फैलाने की क्रिया साक्ष्य की ओर संकेत करते हैं, पर मूल बहुवचन की अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है; पाठ यह तय नहीं करता कि प्रमाण की आधुनिक चिकित्सकीय व्याख्या क्या हो।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और न्यायिक प्रसंग के अनुकूल रखी गई है। ‘कुँवारी’ सामान्य आधुनिक हिन्दी है; ‘पुरनिये’ नागरिक वरिष्ठ अगुओं के पारंपरिक बाइबलीय पद के रूप में रखा गया है। आरोप और कथित प्रमाण के बीच तनाव को बिना आधुनिक चिकित्सकीय निष्कर्ष थोपे सुरक्षित रखा गया है।
