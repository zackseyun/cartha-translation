lexical_decisions:
- source_word: וְלָקְחוּ
  choice: पकड़कर
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर इस न्यायिक प्रसंग में अधिकारियों द्वारा व्यक्ति को अपने अधिकार में लेने का भाव है; ‘पकड़कर’ आधुनिक हिन्दी में स्वाभाविक है और ‘गिरफ़्तार’ जितना विशिष्ट नहीं।
- source_word: זִקְנֵי
  choice: पुरनिए
  rationale: यह शब्द केवल वृद्ध पुरुषों को नहीं, बल्कि नगर के मान्य सामुदायिक-न्यायिक अगुओं को दर्शाता है; बाइबिलीय हिन्दी में ‘पुरनिए’ इस संस्थागत भूमिका को व्यक्त करता है।
- source_word: הָעִיר הַהִוא
  choice: उस नगर के
  rationale: ‘उस नगर’ मूल पाठ के संकेतवाचक הַהִוא और स्थानीय न्यायिक क्षेत्र, दोनों को बनाए रखता है।
- source_word: הָאִישׁ
  choice: उस पुरुष को
  rationale: אִישׁ का सीधा अर्थ ‘पुरुष’ है। पिछले प्रसंग में वही पति अभिप्रेत है, पर मूल पद यहाँ पति के लिए विशिष्ट शब्द नहीं रखता।
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: उसे दण्ड दें
  rationale: יסר अनुशासनात्मक सुधार, ताड़ना या दण्ड के व्यापक अर्थ में आता है। ‘दण्ड दें’ कानूनी प्रसंग में स्वाभाविक है, जबकि दण्ड का रूप अनावश्यक रूप से निश्चित नहीं करता।
