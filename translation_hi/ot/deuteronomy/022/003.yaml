  text: וְ/כֵ֧ן תַּעֲשֶׂ֣ה לַ/חֲמֹר֗/וֹ וְ/כֵ֣ן תַּעֲשֶׂה֮ לְ/שִׂמְלָת/וֹ֒ וְ/כֵ֣ן תַּעֲשֶׂ֜ה לְ/כָל אֲבֵדַ֥ת אָחִ֛י/ךָ אֲשֶׁר תֹּאבַ֥ד מִמֶּ֖/נּוּ וּ/מְצָאתָ֑/הּ לֹ֥א תוּכַ֖ל לְ/הִתְעַלֵּֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/003.yaml
  text: And so you shall do with his donkey[a], and so you shall do with his cloak, and so you shall do with any lost thing of your brother that is lost from him and you find it; you may not ignore it.
translation:
  language: hi
  text: और उसके गधे के लिए भी ऐसा ही करना; उसके वस्त्र के लिए भी ऐसा ही करना; और तुम्हारे भाई की किसी भी खोई हुई वस्तु के लिए भी ऐसा ही करना, जो उससे खो जाए और तुम्हें मिल जाए। तुम उसे अनदेखा नहीं कर सकते।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “तुम अपने को छिपा नहीं सकते”; अर्थात्, “तुम ऐसा दिखावा नहीं कर सकते कि तुमने उस पर ध्यान नहीं दिया।”
    reason: לְהִתְעַלֵּם के आत्मवाचक मुहावरे और उसके अधिक शाब्दिक चित्र को सुरक्षित रखना।
lexical_decisions:
- source_word: וְכֵן תַּעֲשֶׂה
  choice: और ... के साथ भी ऐसा ही करना
  rationale: पिछले पद के निर्देश को आगे बढ़ाने वाली पुनरावृत्त कानूनी अभिव्यक्ति है। हिंदी में आज्ञार्थक ‘करना’ विधिक निर्देश को स्वाभाविक और दृढ़ रूप में व्यक्त करता है।
- source_word: לַחֲמֹרוֹ
  choice: उसके गधे के साथ
  rationale: पूर्ववर्ती प्रसंग में भाई के खोए पशु की ओर संकेत है; ‘के साथ’ वस्तु के विषय में वही कार्रवाई करने का स्वाभाविक हिंदी रूप है।
- source_word: לְשִׂמְלָתוֹ
  choice: उसके वस्त्र के साथ
  rationale: שִׂמְלָה पहनने के वस्त्र, प्रायः बाहरी वस्त्र, को दर्शाता है। ‘वस्त्र’ मूल की कुछ व्यापकता बनाए रखता है और आधुनिक हिंदी में गरिमापूर्ण है।
- source_word: לְכָל אֲבֵדַת אָחִיךָ
  choice: तुम्हारे भाई की कोई भी वस्तु
  rationale: यह विशिष्ट उदाहरणों से आगे हर खोई वस्तु तक नियम को विस्तृत करता है। ‘भाई’ मूल के पुल्लिंग संबंधसूचक और वाचा-समुदाय की सामाजिक भाषा को बनाए रखता है।
- source_word: אֲשֶׁר תֹּאבַד מִמֶּנּוּ
  choice: जो उससे खो जाए
  rationale: हिब्रू में वस्तु के खो जाने की घटना व्यक्त है, न कि भाई को स्पष्ट कर्ता बनाकर ‘जिसे वह खो दे’; हिंदी रूप उसी अनिर्दिष्ट कर्तृत्व को सुरक्षित रखता है।
- source_word: וּמְצָאתָהּ
  choice: और तुम्हें मिल जाए
  rationale: हिंदी में किसी खोई वस्तु के प्राप्त होने का यह स्वाभाविक रूप है और क्रमिक घटना को स्पष्ट रखता है।
- source_word: לֹא תוּכַל לְהִתְעַלֵּם
  choice: तुम उसे अनदेखा नहीं कर सकते
  rationale: कानूनी प्रसंग में यह केवल शारीरिक असमर्थता नहीं, जिम्मेदारी से आँख चुराने की मनाही व्यक्त करता है। ‘अनदेखा नहीं कर सकते’ मूल के सामर्थ्य-सूचक रूप और निषेध, दोनों को स्वाभाविक हिंदी में बनाए रखता है।
theological_decisions:
- issue: אָחִיךָ का वाचा-सामुदायिक अर्थ
  choice: तुम्हारे भाई
  alternative: तुम्हारे साथी इस्राएली / तुम्हारे स्वजन
  rationale: मूल पाठ एकवचन पुल्लिंग संबंधसूचक ‘भाई’ कहता है। इसे सामान्यीकृत करने के बजाय स्रोत की सामाजिक और वाचा-संबंधी भाषा सुरक्षित रखी गई है।
- issue: לֹא תוּכַל לְהִתְעַלֵּם का विधिक बल
  choice: तुम उसे अनदेखा नहीं कर सकते
  alternative: तुम अपने को छिपा नहीं सकते / तुम्हें ऐसा दिखावा नहीं करना कि तुमने उसे देखा ही नहीं
  rationale: हिब्रू मुहावरे में स्वयं को छिपाने या जानबूझकर ध्यान न देने का चित्र है। मुख्य पाठ में स्वाभाविक निषेध रखा गया है और अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी; विधिक पुनरावृत्ति को बनाए रखते हुए वाक्य को साधारण पाठक के लिए स्पष्ट रखा गया है। ‘वस्त्र’ गरिमापूर्ण और पर्याप्त व्यापक है; ‘अनदेखा नहीं कर सकते’ निषेध तथा मूल के ‘सकना’ रूप दोनों को व्यक्त करता है।
