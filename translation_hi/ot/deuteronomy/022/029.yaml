base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/029.yaml
  text: Then the man who lay with her shall give fifty shekels of silver to the young woman's father[a], and she shall become his wife because he has violated her[b]. He may not send her away all his days.
translation:
  language: hi
  text: तब जिस पुरुष ने उसके साथ संभोग किया हो, वह उस युवती के पिता को चाँदी के पचास शेकेल देगा, और वह उसकी पत्नी हो जाएगी, क्योंकि उसने उसका यौन अपमान किया है[a]। वह जीवन भर उसे त्याग नहीं सकता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी क्रिया का अधिक शाब्दिक अनुवाद ‘उसे अपमानित किया’ या ‘उसे नीचा किया’ हो सकता है। इस संदर्भ में यह उसके साथ किए गए यौन अपमान को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘त्यागना’ पत्नी को छोड़ देने या उसे तलाक देने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: तब ... दे
  rationale: व्यवस्था-संबंधी क्रम में यह क्रिया अगले अनिवार्य विधान को सामने लाती है; ‘तब’ क्रम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: הַשֹּׁכֵב עִמָּהּ
  choice: उसके साथ सोनेवाला
  rationale: यह पुरुष को उसके यौन कृत्य के आधार पर पहचाननेवाली कृदन्तीय रचना है। हिन्दी में यह संयत, स्पष्ट और कानूनी शैली के अनुकूल है।
- source_word: לַאֲבִי הַנַּעֲרָ
  choice: उस युवती के पिता को
  rationale: נַעֲרָה विवाह-योग्य आयु की लड़की या युवती को सूचित करता है; ‘युवती’ आधुनिक हिन्दी में स्वाभाविक है और उसे बालिका बताने का अनावश्यक संकेत नहीं देता।
- source_word: חֲמִשִּׁים כָּסֶף
  choice: चाँदी के पचास शेकेल
  rationale: इब्रानी में शाब्दिक रूप से ‘पचास चाँदी’ है, पर आर्थिक-कानूनी संदर्भ में यह चाँदी के भार की मानक इकाई को दर्शाता है; इसलिए ‘शेकेल’ की पूर्ति अर्थ स्पष्ट करती है।
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: वह उसकी पत्नी हो जाए
  rationale: यह परिणामी वैवाहिक स्थिति बताता है। ‘पत्नी हो जाए’ भविष्यगत परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है और स्वामित्व का अनावश्यक भाव नहीं जोड़ता।
- source_word: תַּחַת אֲשֶׁר
  choice: क्योंकि
  rationale: यहाँ यह पदबंध विधान का कारण प्रस्तुत करता है; ‘क्योंकि’ उसका संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
- source_word: עִנָּהּ
  choice: उसका मान भंग किया था
  rationale: पिएल रूप यहाँ स्त्री के साथ किए गए अपमानजनक यौन व्यवहार को दर्शाता है। ‘मान भंग किया’ कृत्य की गंभीरता और अपमान दोनों को रखता है, पर इस पद में उपस्थित शब्दावली से अधिक विशिष्ट दावा नहीं करता।
- source_word: לֹא יוּכַל שַׁלְּחָהּ
  choice: उसे त्याग नहीं सकता
  rationale: शाब्दिक अर्थ ‘उसे भेज नहीं सकता’ है, पर वैवाहिक-कानूनी संदर्भ में आशय पत्नी को छोड़ने या तलाक देने से है। ‘त्याग नहीं सकता’ स्रोत की अभिव्यक्ति और संदर्भगत अर्थ के बीच संतुलन रखता है।
- source_word: כָּל יָמָיו
  choice: जीवन भर
  rationale: शाब्दिक मुहावरा ‘उसके सब दिन’ है, जिसका स्वाभाविक हिन्दी अर्थ ‘जीवन भर’ है।
theological_decisions:
- issue: यौन अपमान सूचित करनेवाली क्रिया עִנָּהּ को न तो हल्का करना और न तत्काल पद की शब्दावली से अधिक विशिष्ट बनाना
  choice: उसका मान भंग किया था
  alternative: उसके साथ बलात्कार किया था; उसे अपमानित किया था; उसे दीन किया था
  rationale: आस-पास का विधान गंभीर यौन अपराध से संबंधित है, पर इस उपवाक्य में ענה प्रयुक्त है। ‘बलात्कार’ व्यापक संदर्भ की एक व्याख्या को सीधे पाठ में निश्चित कर देगा, जबकि केवल ‘अपमानित’ आधुनिक पाठक के लिए यौन आशय को बहुत हल्का या अस्पष्ट कर सकता है। ‘मान भंग’ दोनों पक्षों को संभालता है, और पादटिप्पणी शाब्दिक तथा संदर्भगत अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संयत और विधिक गरिमा वाली रखी गई है। ‘शेकेल’ प्राचीन भार-मुद्रा संबंधी इकाई के रूप में रखा गया है। यौन कृत्य के वर्णन में न तो बोलचाल की अशिष्टता अपनाई गई है, न अपराध की गंभीरता को कम किया गया है।
