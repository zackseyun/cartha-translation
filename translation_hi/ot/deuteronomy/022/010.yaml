base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/010.yaml
  text: You shall not plow with an ox and a donkey together[a].
translation:
  language: hi
  text: तुम बैल और गधे को एक साथ लगाकर हल न चलाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַחֲרֹשׁ
  choice: हल न चलाना
  rationale: निषेध के साथ द्वितीय पुरुष एकवचन अपूर्ण क्रिया व्यवस्थाविवरण की कानूनी शिक्षा में सीधी मनाही व्यक्त करती है। हिंदी में ‘न चलाना’ स्वाभाविक होते हुए आज्ञात्मक-कानूनी बल बनाए रखता है।
- source_word: בְּשׁוֹר
  choice: बैल
  rationale: שׁוֹר यहाँ जुताई में लगाए जाने वाले गोवंशीय पशु को दर्शाता है; कृषि-संदर्भ में ‘बैल’ सबसे स्पष्ट और स्वाभाविक हिंदी शब्द है।
- source_word: וּבַחֲמֹר
  choice: और गधे को
  rationale: חֲמוֹר का सामान्य आधुनिक हिंदी समतुल्य ‘गधा’ है। परसर्ग ‘को’ संयुक्त क्रिया-विन्यास में दोनों पशुओं को जुताई के साधन के रूप में स्पष्ट करता है।
- source_word: יַחְדָּו
  choice: एक साथ जोतकर
  rationale: क्रियाविशेषण दोनों पशुओं को एक ही जुए अथवा दल में लगाकर जुताई करने का भाव देता है। ‘एक साथ जोतकर’ हिंदी में इस व्यावहारिक अर्थ को सीधे स्पष्ट करता है।
theological_decisions:
- issue: वाचा-व्यवस्था में निषेध का बल
  choice: 'सीधी कानूनी मनाही: ‘हल न चलाना’'
  alternative: ‘हल मत चलाना’
  rationale: ‘न चलाना’ आधुनिक हिंदी में विधिक निर्देश का गरिमापूर्ण स्वर बनाए रखता है, जबकि ‘मत चलाना’ अधिक बोलचाल का प्रत्यक्ष आदेश होता। पद में कोई अलग संप्रदायगत अर्थ जोड़ना आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और विधिक निर्देश के अनुरूप। ‘बैल और गधे को एक साथ जोतकर’ मूल के कृषि-संदर्भ और दोनों पशुओं के संयुक्त उपयोग को स्वाभाविक हिंदी में व्यक्त करता है।
