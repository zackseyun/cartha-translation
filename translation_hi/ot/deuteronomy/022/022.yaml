base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/022.yaml
  text: If a man is found lying with a woman married to a husband[a], then both of them shall die—the man who lay with the woman, and the woman[b]. So you shall purge the evil from Israel.
translation:
  language: hi
  text: यदि कोई पुरुष किसी विवाहित स्त्री के साथ यौन-संबंध करते हुए पाया जाए,[a] तो वे दोनों मरें[b]—वह पुरुष जो उस स्त्री के साथ यौन-संबंध कर रहा था, और वह स्त्री भी। इस प्रकार तुम इस्राएल में से बुराई को दूर कर देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पति वाली स्त्री”; अर्थात, “विवाहित स्त्री।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मरें” कानून में निर्धारित मृत्यु-दंड को व्यक्त करता है; इसका अनुवाद “उन दोनों को मृत्यु-दंड दिया जाए” भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא
  choice: पाया जाए
  rationale: निफ़अल रूप यहाँ किसी कृत्य के प्रकट या पकड़े जाने को दर्शाता है; कानूनी प्रसंग में ‘पाया जाए’ सीधा और स्वाभाविक है।
- source_word: שֹׁכֵב עִם
  choice: के साथ लेटा हुआ
  rationale: यह इब्रानी मुहावरा यौन-संबंध को सूचित करता है। हिंदी में इसे यथासंभव प्रत्यक्ष रूप से रखते हुए मूल की संयत कानूनी भाषा और मुहावरे को सुरक्षित रखा गया है।
- source_word: בְעֻלַת בַּעַל
  choice: ऐसी स्त्री...जो किसी दूसरे पुरुष की पत्नी है
  rationale: यह वाक्यांश स्त्री के वैवाहिक बंधन पर बल देता है। ‘किसी दूसरे पुरुष की पत्नी’ हिंदी में स्वाभाविक है और प्रसंग में व्यभिचार का आशय स्पष्ट करता है, जबकि स्वामित्व का भ्रामक भाव नहीं जोड़ता।
- source_word: וּמֵתוּ גַּם שְׁנֵיהֶם
  choice: तो वे दोनों मरें
  rationale: कानूनी प्रसंग में यह निर्धारित दंड बताता है। ‘मरें’ मूल के कथन के निकट है; न्यायिक मृत्युदंड का आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הָאִישׁ הַשֹּׁכֵב עִם הָאִשָּׁה
  choice: वह पुरुष जो उस स्त्री के साथ लेटा था
  rationale: संबंधवाचक उपवाक्य कानूनी स्पष्टता बनाए रखता है और संबंधित पुरुष की पहचान उसी कृत्य से करता है।
- source_word: וְהָאִשָּׁה
  choice: और वह स्त्री भी
  rationale: मूल की पुनरुक्ति को साझा दायित्व की स्पष्टता के लिए रखा गया है; ‘भी’ दोनों पर लागू विधान को स्वाभाविक हिंदी में उभारता है।
- source_word: וּבִעַרְתָּ הָרָע
  choice: इस प्रकार तुम...बुराई को दूर कर देना
  rationale: व्यवस्थाविवरण के आवर्ती कानूनी सूत्र में בער का अर्थ समुदाय में से बुराई हटाना है। ‘दूर कर देना’ आधुनिक हिंदी में स्पष्ट और गंभीर है।
- source_word: מִיִּשְׂרָאֵל
  choice: इस्राएल में से
  rationale: यह बुराई को वाचा-समुदाय के भीतर से हटाने का भाव ठीक प्रकार व्यक्त करता है।
theological_decisions:
- issue: בְעֻלַת בַּעַל में वैवाहिक स्थिति का निरूपण
  choice: ऐसी स्त्री...जो किसी दूसरे पुरुष की पत्नी है
  alternative: विवाहित स्त्री
  rationale: मुख्य पाठ वैवाहिक बंधन और पति-संबंध को दिखाई देता रखता है, पर ऐसा स्वामित्व-सूचक शब्द नहीं अपनाता जो आधुनिक पाठक को भटका सकता हो। ‘दूसरे’ शब्द से पुरुष के अपने विवाहेतर संबंध का प्रसंग स्वाभाविक रूप से स्पष्ट होता है।
- issue: दंड को मृत्यु अथवा स्पष्ट मृत्युदंड के रूप में व्यक्त करना
  choice: वे दोनों मरें
  alternative: उन दोनों को मृत्युदंड दिया जाए
  rationale: मूल शब्दशः उनके मरने की बात कहता है, जबकि कानूनी संदर्भ न्यायिक मृत्युदंड सूचित करता है। मुख्य पाठ स्रोत के निकट रहता है और पादटिप्पणी न्यायिक अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, संयत और कानूनी गरिमा वाली रखी गई है। मूल के यौन-संबंध संबंधी मुहावरे तथा दंड-विधान की संक्षिप्तता को बनाए रखते हुए कठिन बिंदुओं को पादटिप्पणियों में स्पष्ट किया गया है।
