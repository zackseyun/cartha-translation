  edition: WLC
  text: לֹא יִהְיֶ֤ה כְלִי גֶ֨בֶר֙ עַל אִשָּׁ֔ה וְ/לֹא יִלְבַּ֥שׁ גֶּ֖בֶר שִׂמְלַ֣ת אִשָּׁ֑ה כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל עֹ֥שֵׂה אֵֽלֶּה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/005.yaml
  text: A woman shall not wear a man's article[a], and a man shall not put on a woman's garment, for everyone who does these things is an abomination to Yahweh your God.
translation:
  language: hi
  text: किसी स्त्री पर पुरुष की कोई वस्तु[a] न हो, और कोई पुरुष स्त्री का वस्त्र न पहने, क्योंकि जो कोई ऐसे काम करता है, वह तुम्हारे परमेश्वर यहोवा के लिए घृणित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुरुष का वस्त्र।” पहले खंड का इब्रानी शब्द दूसरे खंड में आए “वस्त्र” के विशिष्ट शब्द से अधिक व्यापक है और किसी वस्तु, उपकरण या साज-सामान को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי גֶבֶר
  choice: पुरुष की कोई वस्तु
  rationale: כְלִי का अर्थ केवल वस्त्र नहीं, बल्कि वस्तु, उपकरण या साज-सामान भी हो सकता है। दूसरे खंड में वस्त्र के लिए विशिष्ट शब्द שִׂמְלָה आया है, इसलिए दोनों शब्दों का भेद बनाए रखा गया है।
- source_word: עַל אִשָּׁה
  choice: किसी स्त्री पर ... न हो
  rationale: मूल की 'स्त्री पर होना' संरचना को स्वाभाविक हिंदी में रखते हुए जानबूझकर केवल 'पहनना' तक सीमित नहीं किया गया, क्योंकि כְלִי का दायरा व्यापक है।
- source_word: יִלְבַּשׁ
  choice: न पहने
  rationale: क्रिया का सामान्य अर्थ वस्त्र पहनना है; हिंदी में 'पहने' स्पष्ट और स्वाभाविक है।
- source_word: שִׂמְלַת אִשָּׁה
  choice: स्त्री का वस्त्र
  rationale: שִׂמְלָה किसी वस्त्र या बाहरी परिधान को दर्शाता है। 'वस्त्र' इसकी विशिष्टता को पहले खंड के व्यापक 'वस्तु' से अलग रखता है।
- source_word: גֶּבֶר / אִשָּׁה
  choice: पुरुष / स्त्री
  rationale: मूल पाठ में पुरुष और स्त्री का स्पष्ट विरोध है; लिंग-निरपेक्ष शब्द उस भेद को मिटा देते।
- source_word: תוֹעֲבַת יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर यहोवा की दृष्टि में घृणित
  rationale: תוֹעֵבָה की प्रबल नैतिक और वाचा-संबंधी अप्रियता को 'घृणित' स्वाभाविक आधुनिक हिंदी में व्यक्त करता है; परमेश्वर का नाम 'यहोवा' रूप में रखा गया है।
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: जो कोई ऐसे काम करता है
  rationale: सहभागी रूप और כָּל के सामान्य तथा सर्वसमावेशी भाव को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: पहले निषेध में כְלִי גבר का दायरा
  choice: इसे व्यापक रूप में 'पुरुष की कोई वस्तु' अनूदित किया गया है।
  alternative: इसे संकीर्ण करके 'पुरुष का वस्त्र' या विशेष करके 'पुरुष का हथियार/साज-सामान' कहना।
  rationale: כְלִי व्यापक शब्द है, जबकि दूसरे खंड में वस्त्र के लिए विशिष्ट שִׂמְלָה है। अनुवाद यह निर्धारित नहीं करता कि निषेध केवल कपड़ों तक सीमित है या अन्य पुरुष-संबद्ध वस्तुओं को भी समेटता है।
- issue: पुरुष और स्त्री संबंधी भाषा
  choice: '''पुरुष'' और ''स्त्री'' का स्पष्ट भेद बनाए रखा गया है।'
  alternative: लिंग-निरपेक्ष 'व्यक्ति' जैसे शब्दों का प्रयोग।
  rationale: मूल इब्रानी में दोनों लिंग स्पष्ट रूप से आमने-सामने रखे गए हैं; उस तनाव और विशिष्टता को बनाए रखना आवश्यक है।
- issue: תוֹעֵבָה का कथन
  choice: व्यक्ति को 'यहोवा की दृष्टि में घृणित' कहा गया है।
  alternative: केवल कार्यों को 'घृणित काम' कहना।
  rationale: व्याकरण में כָּל עֹשֵׂה אֵלֶּה, अर्थात ऐसे काम करने वाला प्रत्येक व्यक्ति, תוֹעֲבַת יְהוָה का विधेय है; इसलिए मूल की तीक्ष्ण अभिव्यक्ति को नरम नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। पहले खंड की थोड़ी असामान्य संरचना मूल की व्यापक और संदिग्ध शब्दावली को सुरक्षित रखने के लिए चुनी गई है; पादटिप्पणी अधिक संकीर्ण वस्त्र-संबंधी संभावना बताती है।
