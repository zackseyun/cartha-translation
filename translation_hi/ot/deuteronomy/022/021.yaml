  yaml_path: translation/ot/deuteronomy/022/021.yaml
  text: Then they shall bring out the young woman to the entrance of her father's house[a], and the men of her city shall stone her with stones, and she shall die, because she has committed an outrageous act in Israel by prostituting herself in her father's house[c][b]. So you shall purge the evil from your midst.
translation:
  language: hi
  text: तब वे उस युवती को उसके पिता के घर के द्वार पर ले जाएँ, और उसके नगर के पुरुष उसे पत्थरों से मार डालें, और वह मर जाए; क्योंकि उसने अपने पिता के घर में वेश्या-जैसा आचरण करके इस्राएल में एक घोर निंदनीय काम किया है।[a][b] इस प्रकार तू अपने बीच से बुराई को दूर कर देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘घोर निंदनीय काम’ का अनुवाद ‘लज्जाजनक काम’ या ‘घृणित कृत्य’ भी हो सकता है। इब्रानी शब्द नैतिक रूप से स्तब्ध कर देने वाले, अपमानजनक कृत्य को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘वेश्या-जैसा आचरण करके’ का अनुवाद ‘अवैध यौन आचरण करके’ भी हो सकता है। इब्रानी क्रिया का शाब्दिक संबंध वेश्यावृत्ति से है, पर इसका प्रयोग अधिक व्यापक यौन अनैतिकता के लिए भी होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: उस युवती
  rationale: व्यंजनात्मक पाठ में रूप נַעַר है, पर संदर्भ स्त्री का है। ‘युवती’ आधुनिक हिन्दी में स्वाभाविक है और उसकी युवावस्था को व्यक्त करता है।
- source_word: פֶּתַח בֵּית אָבִיהָ
  choice: उसके पिता के घर के प्रवेश-द्वार पर
  rationale: פֶּתַח किसी भवन के खुलने के स्थान या प्रवेश को दर्शाता है; यह अनुवाद ठोस स्थान-सूचना और ‘पिता के घर’ की पुनरावृत्ति दोनों बनाए रखता है।
- source_word: וּסְקָלוּהָ ... בָּאֲבָנִים
  choice: उसे पत्थरों से मारें
  rationale: हिन्दी में यह स्वाभाविक रूप से पत्थर मारकर मृत्युदंड देने का अर्थ देता है और मूल में दिए साधन ‘पत्थरों से’ को स्पष्ट रखता है।
- source_word: אַנְשֵׁי עִירָהּ
  choice: उसके नगर के पुरुष
  rationale: אַנְשֵׁי का लिंग-सूचक अर्थ बनाए रखा गया है; इसे सामान्य ‘लोग’ नहीं किया गया।
- source_word: נְבָלָה
  choice: एक घोर निंदनीय काम
  rationale: यह शब्द केवल मूर्खता नहीं, बल्कि समुदाय को स्तब्ध करने वाले नैतिक रूप से घृणित और अपमानजनक कृत्य को सूचित करता है।
- source_word: לִזְנוֹת
  choice: वेश्यावृत्ति करके
  rationale: यह मूल क्रिया की वेश्यावृत्ति/व्यभिचार से जुड़ी तीखी छवि को बनाए रखता है; संदर्भ में इसका व्यापक आशय अवैध यौन आचरण भी हो सकता है।
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: इस प्रकार तू अपने बीच से बुराई को दूर कर देना
  rationale: यह व्यवस्थाविवरण की आवर्ती न्यायिक विधि का अर्थ स्वाभाविक हिन्दी में रखता है; एकवचन ‘तू’ मूल के सामूहिक इस्राएल को संबोधित पुल्लिंग एकवचन को दर्शाता है।
theological_decisions:
- issue: यौन-अपराध संबंधी भाषा की तीव्रता और अर्थ-सीमा
  choice: मुख्य पाठ में ‘वेश्यावृत्ति करके’ रखा गया है।
  alternative: ‘यौन अनैतिकता करके’ या ‘व्यभिचार करके’
  rationale: זנה की तीखी वेश्यावृत्ति-संबंधी छवि को नरम नहीं किया गया, पर पादटिप्पणी में स्वीकार किया गया है कि यहाँ शब्द व्यापक अवैध यौन आचरण का भी बोध करा सकता है।
- issue: नगर के दंड-निष्पादकों का लिंग
  choice: ‘उसके नगर के पुरुष’
  alternative: ‘उसके नगर के लोग’
  rationale: मूल के אַנְשֵׁי को लिंग-निरपेक्ष बनाकर उसकी व्याकरणिक विशेषता मिटाई नहीं गई।
- issue: נְבָלָה का नैतिक-न्यायिक बल
  choice: ‘एक घोर निंदनीय काम’
  alternative: ‘मूर्खता’, ‘लज्जाजनक काम’ या ‘घृणित काम’
  rationale: यह चयन उस शब्द की सामुदायिक, नैतिक और न्यायिक गंभीरता व्यक्त करता है, पर कोई बाद की पारिभाषिक धर्मशास्त्रीय श्रेणी नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण न्यायिक हिन्दी अपनाई गई है। मूल की कठोरता को न तो नरम किया गया है, न उससे अधिक सनसनीखेज बनाया गया है। ‘तू’ आवर्ती व्यवस्थाविवरणीय विधि में सामूहिक इस्राएल को संबोधित मूल एकवचन को सुरक्षित रखता है।
