source:
  edition: WLC
  text: כִּֽי יִמְצָ֣א אִ֗ישׁ נער בְתוּלָה֙ אֲשֶׁ֣ר לֹא אֹרָ֔שָׂה וּ/תְפָשָׂ֖/הּ וְ/שָׁכַ֣ב עִמָּ֑/הּ וְ/נִמְצָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/028.yaml
  text: If a man finds a young woman[a], a virgin who is not engaged, and seizes her and lies with her, and they are discovered[b],
translation:
  language: hi
  text: यदि कोई पुरुष किसी कुँवारी युवती को पाए, जिसकी मंगनी[a] न हुई हो, और उसे पकड़ ले[b] और उसके साथ सोए, और उनका पता चल जाए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो विवाह के लिए वाग्दत्त न हुई हो।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का अर्थ “पकड़ना,” “जकड़ना” या “थाम लेना” हो सकता है। कुछ व्याख्याकार यहाँ इसे बलात्कार का संकेत मानते हैं; अन्य मानते हैं कि इसका कानूनी आशय व्यापक प्रसंग से निर्धारित किया जाना चाहिए, केवल इस क्रिया से नहीं।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यह एक शर्तपरक कानूनी प्रकरण का आरम्भ करता है; आधुनिक हिन्दी की विधिक शैली में ‘यदि’ स्वाभाविक है।
- source_word: יִמְצָא
  choice: पाए
  rationale: मूल क्रिया का सामान्य अर्थ ‘पाना’ या ‘मिलना’ है; यहाँ ‘पाए’ सीधा और प्रसंगानुकूल है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: मूल में पुल्लिंग एकवचन संज्ञा है; ‘कोई पुरुष’ शर्तपरक वाक्य में स्वाभाविक हिन्दी है।
- source_word: נער בְתוּלָה
  choice: किसी कुँवारी युवती
  rationale: यह पदबंध युवावस्था और कुँवारेपन—दोनों को व्यक्त करता है। ‘कुँवारी युवती’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: जिसकी मंगनी न हुई हो
  rationale: यह उस युवती को दर्शाता है जो विवाह के लिए विधिवत वाग्दत्त नहीं हुई। ‘मंगनी’ साधारण हिन्दी पाठक के लिए सहज है, जबकि प्राचीन कानूनी अर्थ पर पादटिप्पणी ध्यान दिलाती है।
- source_word: וּתְפָשָׂהּ
  choice: और उसे पकड़ ले
  rationale: תפשׂ का अर्थ पकड़ना, थामना या अधिकार में लेना हो सकता है। ‘पकड़ ले’ शारीरिक क्रिया को बनाए रखता है, पर मुख्य पाठ में उससे अधिक विशिष्ट कानूनी निष्कर्ष नहीं जोड़ता।
- source_word: וְשָׁכַב עִמָּהּ
  choice: और उसके साथ सोए
  rationale: यह यौन-संबंध के लिए प्रयुक्त इब्रानी मुहावरा है। हिन्दी में ‘उसके साथ सोए’ उसी मुहावरे को स्पष्ट और संयत ढंग से बनाए रखता है।
- source_word: וְנִמְצָאוּ
  choice: और वे पकड़े जाएँ
  rationale: मूल में निष्क्रिय बहुवचन है और आशय घटना के प्रकट हो जाने से है। ‘वे पकड़े जाएँ’ बहुवचन और निष्क्रियता दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: क्या मुख्य पाठ में इस कृत्य के लिए सीधे ‘बलात्कार’ जैसा व्याख्यात्मक शब्द रखा जाए
  choice: ‘उसे पकड़ ले और उसके साथ सोए’ के रूप में मूल की अलग-अलग क्रियाओं को बनाए रखा गया है।
  alternative: ‘उसके साथ बलात्कार करे’ अथवा नरम अर्थ में ‘उसे ले ले’
  rationale: תפשׂ में पकड़ने या अधिकार में लेने का भाव है, पर अकेली यह क्रिया पूरे कानूनी और नैतिक प्रश्न को एक ही आधुनिक शब्द में निर्णायक रूप से परिभाषित नहीं करती। इसलिए मूल की शारीरिक क्रिया को स्पष्ट रखा गया है और व्याख्यात्मक तनाव को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कानूनी शैली। ‘कुँवारी युवती,’ ‘मंगनी’ और ‘पकड़ ले’ सामान्य पाठक के लिए सहज हैं। वाक्य अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
