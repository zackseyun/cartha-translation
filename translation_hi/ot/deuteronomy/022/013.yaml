lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यहाँ यह शब्द शर्त पर आधारित कानूनी प्रसंग आरम्भ करता है; आधुनिक हिन्दी में ‘यदि’ इस भूमिका को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: कोई पुरुष किसी स्त्री से विवाह करे
  rationale: शाब्दिक अर्थ ‘एक पुरुष एक पत्नी ले’ है, पर हिन्दी में वह अस्वाभाविक और वस्तुकरण करने वाला सुनाई देता है। विवाह के संदर्भ में לקח का स्वाभाविक अर्थ ‘विवाह करना’ है; אִשָּׁה को यहाँ ‘स्त्री’ कहना हिन्दी वाक्य-विन्यास में स्पष्ट है।
- source_word: וּבָא אֵלֶיהָ
  choice: उसके पास जाए
  rationale: यह इब्रानी का शालीन मुहावरा है जो वैवाहिक यौन-संबंध को सूचित करता है। मुख्य पाठ में संकेतात्मक भाषा रखी गई है और पादटिप्पणी अर्थ स्पष्ट करती है।
- source_word: וּשְׂנֵאָהּ
  choice: और फिर उससे घृणा करने लगे
  rationale: שׂנא का मूल अर्थ ‘घृणा करना’ है। ‘फिर’ घटनाक्रम को और ‘करने लगे’ हिन्दी में उत्पन्न हुई वैवाहिक शत्रुता को स्वाभाविक रूप से व्यक्त करता है।
