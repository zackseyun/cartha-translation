  text: וְ/הוֹצֵאתֶ֨ם אֶת שְׁנֵי/הֶ֜ם אֶל שַׁ֣עַר הָ/עִ֣יר הַ/הִ֗וא וּ/סְקַלְתֶּ֨ם אֹתָ֥/ם בָּ/אֲבָנִים֮ וָ/מֵתוּ֒ אֶת ה/נער עַל דְּבַר֙ אֲשֶׁ֣ר לֹא צָעֲקָ֣ה בָ/עִ֔יר וְ/אֶ֨ת הָ/אִ֔ישׁ עַל דְּבַ֥ר אֲשֶׁר עִנָּ֖ה אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/024.yaml
  text: 'then you shall bring both of them out to the gate of that city[a], and you shall stone them with stones, and they shall die: the young woman because she did not cry out in the city, and the man because he violated his neighbor’s wife[c][b]. So you shall purge the evil from your midst.'
translation:
  language: hi
  text: तब तुम उन दोनों को निकालकर उस नगर के फाटक तक ले आना और उन्हें पत्थरों से मारना, और वे मर जाएँ—युवती को इसलिए कि उसने नगर में पुकार नहीं लगाई, और उस पुरुष को इसलिए कि उसने अपने पड़ोसी की पत्नी के साथ यौन दुर्व्यवहार किया। इस प्रकार तुम अपने बीच से बुराई को मिटा देना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹצֵאתֶם
  choice: तुम ... ले आना
  rationale: 'יצא के हिफ़ील रूप का कारक भाव व्यक्त होता है: दोनों को नगर के फाटक पर बाहर ले आना। हिंदी में यह विधिक आदेश के रूप में स्वाभाविक है।'
- source_word: שְׁנֵיהֶם
  choice: उन दोनों को
  rationale: द्विवचन-सदृश स्पष्ट अभिव्यक्ति दोनों संबंधित व्यक्तियों को समान रूप से निर्दिष्ट करती है।
- source_word: שַׁעַר הָעִיר הַהִוא
  choice: उस नगर के फाटक पर
  rationale: मूल पाठ की स्थान-सूचक अभिव्यक्ति रखी गई है; प्राचीन नगर में फाटक न्याय और सार्वजनिक निर्णय का स्थान भी था।
- source_word: וּסְקַלְתֶּם אֹתָם בָּאֲבָנִים
  choice: उन्हें पत्थरों से मारना
  rationale: मूल में पत्थरों का स्पष्ट उल्लेख है। हिंदी में यह वाक्यांश क्रिया और साधन दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וָמֵתוּ
  choice: और वे मर जाएँ
  rationale: वाव के साथ आए क्रियात्मक परिणाम को सीधे रखा गया है; इसे केवल उद्देश्य बताने वाले ‘ताकि’ से नहीं बाँधा गया।
- source_word: הנער
  choice: युवती
  rationale: व्यंजनात्मक लेखन अपेक्षाकृत अस्पष्ट है, पर आगे स्त्रीलिंग क्रिया צָעֲקָה स्पष्ट करती है कि स्त्री अभिप्रेत है। ‘युवती’ आधुनिक और आयु के विषय में ‘लड़की’ से कम भ्रामक है।
- source_word: עַל דְּבַר אֲשֶׁר לֹא צָעֲקָה בָעִיר
  choice: इसलिए कि नगर में होते हुए भी उसने पुकार नहीं लगाई
  rationale: עַל דְּבַר का कारणसूचक अर्थ स्पष्ट किया गया है। ‘नगर में होते हुए भी’ स्थान और कथित कानूनी आधार के संबंध को स्वाभाविक हिंदी में दिखाता है।
- source_word: עִנָּה
  choice: यौन दुर्व्यवहार किया
  rationale: इस यौन-विधिक संदर्भ में क्रिया अपमानित करने अथवा पीड़ित करने वाले यौन आचरण को दर्शाती है। यह चयन गंभीरता बताता है, पर आधुनिक कानूनी शब्द ‘बलात्कार’ को वहाँ नहीं थोपता जहाँ इस क्रिया का अर्थक्षेत्र व्यापक है।
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: अपने पड़ोसी की पत्नी
  rationale: संबंध-सूचक इब्रानी पदबंध का सहज और सटीक हिंदी रूप।
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: इस प्रकार तुम अपने बीच से बुराई को मिटा देना
  rationale: व्यवस्थाविवरण के आवर्ती न्यायिक सूत्र का बल बनाए रखते हुए वर्तमान हिंदी में स्वाभाविक अभिव्यक्ति चुनी गई है।
theological_decisions:
- issue: युवती के दोष के लिए पाठ में दिया गया कानूनी आधार
  choice: नगर में होते हुए भी उसने पुकार नहीं लगाई
  alternative: नगर में सहायता के लिए न पुकारने के कारण
  rationale: अनुवाद पद का अपना तर्क ज्यों का त्यों रखता है और उससे आगे सहमति, दोष या व्यापक नैतिक सिद्धांतों के बारे में कोई निष्कर्ष नहीं जोड़ता।
- issue: यौन-विधिक संदर्भ में עִנָּה का अनुवाद
  choice: यौन दुर्व्यवहार किया
  alternative: अपमानित किया; पीड़ित किया; बलात्कार किया
  rationale: चुना हुआ रूप यौन संदर्भ और अपमान/पीड़ा की गंभीरता को स्पष्ट करता है, जबकि ‘बलात्कार’ जैसी अधिक संकीर्ण आधुनिक कानूनी श्रेणी से मूल की अर्थगत व्यापकता को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी, देवनागरी, और गरिमापूर्ण विधिक शैली अपनाई गई है। वाक्यरचना सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल के कठोर दंड-विधान और उसके बताए कारण को नरम या विस्तृत किए बिना प्रस्तुत किया गया है; फुटनोट चिह्न संबंधित शब्दों के ठीक बाद रखे गए हैं।
