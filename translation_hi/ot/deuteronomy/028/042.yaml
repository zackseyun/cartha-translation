- source_word: כָּל עֵצְךָ
  choice: तेरे सब पेड़ों
  rationale: כָּל पूरे समूह को समेटता है, और कृषि-संदर्भ में עֵץ का स्वाभाविक अर्थ ‘पेड़’ है।
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: और तेरी भूमि की उपज
  rationale: פְרִי यहाँ भूमि से मिलने वाले फल या पैदावार को दर्शाता है; आधुनिक हिन्दी में ‘भूमि की उपज’ व्यापक कृषि-अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְיָרֵשׁ
  choice: अधिकार कर लेगा
  rationale: ירשׁ का मूल भाव अधिकार में लेना या कब्ज़ा करना है। कीट को कर्ता रखते हुए यह अनुवाद विनाश का संकेत देता है, पर क्रिया को केवल ‘खा जाएगा’ तक सीमित नहीं करता।
- source_word: הַצְּלָצַל
  choice: झींगुर
  rationale: इस दुर्लभ इब्रानी कीट-नाम की सटीक पहचान अनिश्चित है। ‘झींगुर’ एक संभावित विशिष्ट अर्थ है; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
