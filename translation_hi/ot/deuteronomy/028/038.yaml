  text: זֶ֥רַע רַ֖ב תּוֹצִ֣יא הַ/שָּׂדֶ֑ה וּ/מְעַ֣ט תֶּאֱסֹ֔ף כִּ֥י יַחְסְלֶ֖/נּוּ הָ/אַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/038.yaml
  text: You will carry much seed out to the field[a], but you will gather in little, because the locust will consume it.
translation:
  language: hi
  text: तुम बहुत-सा बीज खेत में ले जाओगे[a], पर थोड़ा ही बटोरोगे, क्योंकि टिड्डियाँ उसे चट कर जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम खेत में बहुत-सा बीज बोओगे, पर थोड़ी ही फसल काटोगे।” इब्रानी में अधिक शाब्दिक रूप से “बहुत-सा बीज खेत में ले जाओगे” और “थोड़ा बटोरोगे” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע רַב
  choice: बहुत-सा बीज
  rationale: זֶרַע बोने के बीज को और רַב उसकी बड़ी मात्रा को दर्शाता है। यह चुनाव ठोस कृषि-बिंब और मात्रा के विरोध को बनाए रखता है।
- source_word: תּוֹצִיא
  choice: ले जाओगे
  rationale: יצא के हिफ़ील रूप का मूल अर्थ बाहर ले जाना/निकालना है। प्रसंग में बीज बोने के लिए खेत तक ले जाने की क्रिया है; ‘ले जाओगे’ मूल बिंब को ‘बोओगे’ की अपेक्षा अधिक सीधे सुरक्षित रखता है।
- source_word: הַשָּׂדֶה
  choice: खेत में
  rationale: שׂדה का सामान्य अर्थ खेत अथवा खेती की भूमि है। हिंदी में इस क्रिया और प्रसंग के साथ ‘खेत में’ स्वाभाविक है।
- source_word: וּמְעַט תֶּאֱסֹף
  choice: पर थोड़ा ही बटोरोगे
  rationale: אסף का अर्थ इकट्ठा करना या बटोरना है। ‘बटोरोगे’ कटनी के प्रसंग को सहज रूप से व्यक्त करते हुए मूल क्रिया को बनाए रखता है; ‘थोड़ा ही’ बहुत-से बीज के साथ तीखा विरोध दिखाता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי कम उपज का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिंदी में स्पष्ट कारण-सूचक है।
- source_word: יַחְסְלֶנּוּ
  choice: उसे चट कर जाएँगी
  rationale: חסל पूरी तरह खा डालने या समाप्त कर देने का प्रबल भाव रखता है। टिड्डियों के संदर्भ में ‘चट कर जाएँगी’ स्वाभाविक और प्रभावशाली हिंदी है; ‘उसे’ बीज/उपज की ओर संकेत करता है।
- source_word: הָאַרְבֶּה
  choice: टिड्डियाँ
  rationale: אַרְבֶּה टिड्डी का मानक शब्द है और यहाँ एकवचन रूप सामूहिक अर्थ रख सकता है। हिंदी में बहुवचन ‘टिड्डियाँ’ इस सामूहिक कृषि-विनाश को सबसे स्वाभाविक ढंग से व्यक्त करता है।
