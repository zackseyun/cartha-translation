  text: Blessed shall you be in the city[a], and blessed shall you be in the field.
translation:
  language: hi
  text: तुम नगर में धन्य रहोगे, और खेत में धन्य रहोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: आशीषित
  rationale: ברך का निष्क्रिय कृदन्त वाचाई आशीष की घोषणा करता है। ‘आशीषित’ इस अर्थ को ‘भाग्यशाली’ जैसे केवल सौभाग्य-सूचक शब्द से अधिक ठीक ढंग से बनाए रखता है।
- source_word: אַתָּה
  choice: तुम
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन सर्वनाम यहाँ इस्राएल को सामूहिक वाचा-सम्बोध्य के रूप में एकवचन में सम्बोधित करता है; आधुनिक हिन्दी में ‘तुम’ स्वाभाविक और स्पष्ट है।
- source_word: בָּעִיר
  choice: नगर में
  rationale: בְּ और עִיר स्थान बताते हैं। ‘नगर में’ शहरी जीवन-क्षेत्र को खेत के विपरीत सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וּבָרוּךְ
  choice: और ... भी आशीषित
  rationale: संयोजक और दोहराए गए विधेय को रखा गया है ताकि इब्रानी की संतुलित समानान्तरता बनी रहे; हिन्दी में ‘भी’ इस समावेशी संतुलन को स्वाभाविक बनाता है।
- source_word: בַּשָּׂדֶה
  choice: खेत में
  rationale: שׂדה खेत, खुला ग्रामीण क्षेत्र या कृषि-भूमि दर्शा सकता है। ‘खेत में’ नगर के साथ ठोस कृषि-संबंधी विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: क्रियारहित आशीष-वाक्य का काल और बल
  choice: तुम ... आशीषित रहोगे
  alternative: तुम ... आशीषित हो
  rationale: इब्रानी में स्पष्ट क्रिया नहीं है, इसलिए वर्तमानकालीन घोषणा भी व्याकरणतः सम्भव है। फिर भी व्यवस्थाविवरण 28 की शर्ताधीन वाचा-आशीषों के प्रसंग में ‘रहोगे’ प्रतिज्ञात्मक/भावी बल को स्वाभाविक हिन्दी में व्यक्त करता है; वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और वाचा-संबंधी भाषा। ‘नगर’ और ‘खेत’ मूल की शहरी–कृषि समानान्तरता रखते हैं, जबकि ‘रहोगे’ प्रसंग के प्रतिज्ञात्मक बल को व्यक्त करता है।
