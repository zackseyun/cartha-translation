  text: אֵלֶּה֩ דִבְרֵ֨י הַ/בְּרִ֜ית אֲֽשֶׁר צִוָּ֧ה יְהוָ֣ה אֶת מֹשֶׁ֗ה לִ/כְרֹ֛ת אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ מוֹאָ֑ב מִ/לְּ/בַ֣ד הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת אִתָּ֖/ם בְּ/חֹרֵֽב־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/069.yaml
  text: These are the words of the covenant that Yahweh commanded Moses to make with the sons of Israel in the land of Moab[a], besides the covenant that he made with them at Horeb.
translation:
  language: hi
  text: ये उस वाचा के वचन हैं जिसे याहवे ने मूसा को मोआब देश में इस्राएल के पुत्रों के साथ करने की आज्ञा दी थी[a], उस वाचा के अतिरिक्त जो उसने होरेब में उनके साथ की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “वाचा काटने की आज्ञा दी थी” और आगे, “जो उसने उनके साथ काटी थी”; यह वाचा करने का इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה דִבְרֵי הַבְּרִית
  choice: ये उस वाचा के वचन हैं
  rationale: शीर्षक-सदृश आरंभ को बनाए रखते हुए דִבְרֵי का सीधा और गरिमापूर्ण अनुवाद ‘वचन’ किया गया है; ‘शर्तें’ संभव है, पर वह अर्थ को अधिक कानूनी रूप से सीमित कर देता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचा-नाम की प्रचलित लिप्यंतरण-परंपरा को रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לִכְרֹת ... הַבְּרִית / כָּרַת
  choice: वाचा ... बाँधने / वाचा ... बाँधी
  rationale: शाब्दिक अर्थ ‘काटना’ है, पर यह वाचा स्थापित करने का इब्रानी मुहावरा है। हिन्दी का स्वाभाविक समानार्थी मुहावरा ‘वाचा बाँधना’ मुख्य पाठ में प्रयुक्त हुआ है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह पदबंध सामूहिक रूप से इस्राएल की प्रजा को सूचित करता है। आधुनिक हिन्दी में ‘इस्राएलियों’ स्वाभाविक और समावेशी है; शाब्दिक ‘इस्राएल के पुत्रों’ यहाँ अनावश्यक रूप से केवल पुरुषों का संकेत दे सकता है।
- source_word: בְּאֶרֶץ מוֹאָב
  choice: मोआब देश में
  rationale: भौगोलिक औपचारिकता और אֶרֶץ दोनों को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: מִלְּבַד
  choice: के अतिरिक्त
  rationale: यह मोआब की वाचा को होरेब में बाँधी गई वाचा से अलग रखते हुए उसके अतिरिक्त बताता है; हिन्दी में ‘के अतिरिक्त’ इस संबंध को स्पष्ट करता है।
- source_word: בְּחֹרֵב
  choice: होरेब में
  rationale: मूल स्थान-नाम होरेब को सीनै से समरूप करके नहीं बदला गया; हिन्दी स्थानवाचक प्रयोग में ‘में’ स्वाभाविक है।
theological_decisions:
- issue: मोआब की वाचा और होरेब की वाचा का संबंध
  choice: ‘यह उस वाचा के अतिरिक्त थी’
  alternative: ‘यह उस वाचा से अलग थी’
  rationale: מִלְּבַד भिन्नता के साथ अतिरिक्तता व्यक्त करता है। अनुवाद दो वाचाओं के धर्मवैज्ञानिक संबंध को आगे परिभाषित नहीं करता।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: संदर्भ में यह पूरे वाचा-समुदाय का जातीय-सामूहिक नाम है। हिन्दी में शाब्दिक पुल्लिंग रूप से पैदा होने वाली अनपेक्षित सीमा से बचते हुए सामूहिक अर्थ सुरक्षित रखा गया है।
- issue: दिव्य नाम יְהוָה
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत दिव्य नाम को उपाधि ‘प्रभु’ से नहीं बदला गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय पाठकों में अधिक पहचाना जाने वाला रूप है, यद्यपि ‘याहवे’ ध्वन्यात्मक पुनर्निर्माण के अधिक निकट माना जाता है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। लंबे इब्रानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, पर उसका तर्क-संबंध सुरक्षित है। ‘वाचा’, ‘यहोवा’ और ‘होरेब’ जैसे स्थापित बाइबलीय पद बनाए रखे गए हैं।
