base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/061.yaml
  text: Also every sickness and every affliction that is not written in the book of this law[a], Yahweh will bring upon you until you are destroyed.
translation:
  language: hi
  text: इसके अतिरिक्त, हर बीमारी और हर विपत्ति[a] जो इस व्यवस्था की पुस्तक में लिखी न हो, याहवे तुम पर लाएगा, जब तक कि तुम नष्ट न हो जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हर महामारी’; इब्रानी शब्द का अर्थ प्रहार, महामारी, या विपत्ति हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: इसके अतिरिक्त
  rationale: यह पहले दी गई शाप-सूची में एक और बात जोड़ता है; यह पद के योगात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל חֳלִי
  choice: हर बीमारी
  rationale: חֳלִי सामान्य रूप से रोग या अस्वस्थता को दर्शाता है; ‘बीमारी’ सहज और व्यापक हिन्दी शब्द है।
- source_word: וְכָל מַכָּה
  choice: और हर विपत्ति
  rationale: מַכָּה का अर्थ प्रहार, घाव, महामारी या प्रहार-सदृश विपत्ति हो सकता है। ‘विपत्ति’ प्रसंग में इसकी व्यापक दंडात्मक अर्थ-सीमा बनाए रखती है।
- source_word: אֲשֶׁר לֹא כָתוּב
  choice: जो ... नहीं लिखी है
  rationale: इब्रानी के संबंधवाचक उपवाक्य और निष्क्रिय भाव को स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֹּאת
  choice: इस व्यवस्था की पुस्तक में
  rationale: סֵפֶר को ‘पुस्तक’ और תּוֹרָה को इस वाचा-संदर्भ में ‘व्यवस्था’ कहना दस्तावेज़ के भाव को स्पष्ट रखता है।
- source_word: יַעְלֵם ... עָלֶיךָ
  choice: तुम पर लाएगा
  rationale: עלה के हिफ़ील रूप और עַל का संयुक्त अर्थ किसी विपत्ति को किसी पर लाना है; हिन्दी में यही स्वाभाविक मुहावरा है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: עַד הִשָּׁמְדָךְ
  choice: जब तक कि तुम नष्ट न हो जाओ
  rationale: यह दंड की अंतिम सीमा को व्यक्त करता है और इब्रानी के कठोर परिणाम को बिना बढ़ाए स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का व्यक्तिगत नाम है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप से नाम को नाम के रूप में रखा गया है, ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: מַכָּה की दंडात्मक अर्थ-सीमा
  choice: विपत्ति
  alternative: महामारी
  rationale: यह शब्द केवल संक्रामक रोग तक सीमित नहीं है; ‘विपत्ति’ प्रहार, महामारी और दंडात्मक संकट की व्यापक संभावना को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गंभीर और गरिमापूर्ण शैली रखी गई है। एकवचन ‘तुम’ मूल इब्रानी के एकवचन संबोधन को बनाए रखता है।
