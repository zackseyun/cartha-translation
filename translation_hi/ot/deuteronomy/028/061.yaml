  terminology: ‘बीमारी,’ ‘विपत्ति,’ ‘व्यवस्था की पुस्तक,’ and ‘नष्ट’ are suitable modern-Hindi renderings. The note should state the lexical range without the unnatural, circular phrase ‘प्रहार-सदृश विपत्ति.’
