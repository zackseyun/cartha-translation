  text: וְ/אָכַלְתָּ֣ פְרִֽי בִטְנְ/ךָ֗ בְּשַׂ֤ר בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁר יָצִ֥יק לְ/ךָ֖ אֹיְבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/053.yaml
  text: And you will eat the fruit of your womb[a], the flesh of your sons and daughters whom Yahweh your God has given you[b], in the siege and in the distress with which your enemy will oppress you.
translation:
  language: hi
  text: और तू अपने गर्भ का फल[a]—अपने बेटों और बेटियों का मांस—खाएगा, जिन्हें यहोवा, तेरे परमेश्वर, ने तुझे दिया है। ऐसा उस घेराबंदी और संकट में होगा जो तेरा शत्रु तुझ पर लाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, तेरी देह से उत्पन्न संतान; इब्रानी में शाब्दिक रूप से “तेरे गर्भ का फल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: और तू ... खाएगा
  rationale: शाप-संदर्भ में संयोजक सहित पूर्ण क्रिया भविष्यसूचक अर्थ देती है; एकवचन संबोधन और चेतावनी की सीधी शक्ति सुरक्षित रखी गई है।
- source_word: פְרִי בִטְנְךָ
  choice: अपने गर्भ का फल
  rationale: इब्रानी रूपक को औपचारिक और गंभीर हिन्दी में बनाए रखता है; संदर्भ में इसका आशय संतान है।
- source_word: בְּשַׂר בָּנֶיךָ וּבְנֹתֶיךָ
  choice: अपने बेटों और बेटियों का मांस
  rationale: मूल पाठ की कठोर मानवीय-मांस संबंधी भाषा तथा बेटे-बेटियाँ, दोनों का स्पष्ट उल्लेख सुरक्षित है।
- source_word: אֲשֶׁר נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: जिन्हें तेरे परमेश्वर यहोवा ने तुझे दिया है
  rationale: संतानों के परमेश्वर से मिले उपहार होने की विडंबनापूर्ण और धर्मवैज्ञानिक तीव्रता को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले दिव्य नाम को हिन्दी में प्रचलित नामरूप से प्रस्तुत किया गया है, न कि उपाधि से बदला गया है।
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: उस घेराबंदी और संकट में
  rationale: दोनों निकटवर्ती किंतु भिन्न संज्ञाओं—सैन्य घेराबंदी और उससे उत्पन्न अत्यंत कठिन दशा—को अलग-अलग बनाए रखता है।
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיְבֶךָ
  choice: जिनसे तेरा शत्रु तुझे दबाएगा
  rationale: हिफ़ील क्रिया के दबाव, संकुचन और उत्पीड़न के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; बहुवचन 'जिनसे' निकटवर्ती दोनों परिस्थितियों से संबंध स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी पाठकों के बीच प्रतिष्ठित देवनागरी रूप 'यहोवा' नाम को नाम ही रहने देता है; 'प्रभु' करने से मूल की नामात्मक विशिष्टता मिट जाती।
- issue: वाचा के शाप में संतान-भक्षण की कठोरता
  choice: मूल की स्पष्ट और भयावह भाषा को बनाए रखना
  alternative: इसे केवल अकाल या अत्यधिक भूख के सामान्य कथन के रूप में नरम करना
  rationale: पद स्पष्टतः बेटों और बेटियों का मांस खाने की बात कहता है; धर्मवैज्ञानिक असुविधा के कारण इसे शिष्ट या रूपकात्मक बनाना मूल तनाव को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, वाचा-संबंधी और सीधा एकवचन संबोधन रखा गया है। 'तू/तेरे/तुझे' मूल के 2ms रूप को दर्शाते हैं और यहाँ अपमानसूचक नहीं, बल्कि सामूहिक इस्राएल से सीधा संबोधन हैं। विरामचिह्नों से 'गर्भ का फल' की व्याख्या 'बेटों और बेटियों का मांस' के रूप में स्पष्ट की गई है।
