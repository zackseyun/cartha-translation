  text: וּ/בַ/גּוֹיִ֤ם הָ/הֵם֙ לֹ֣א תַרְגִּ֔יעַ וְ/לֹא יִהְיֶ֥ה מָנ֖וֹחַ לְ/כַף רַגְלֶ֑/ךָ וְ/נָתַן֩ יְהוָ֨ה לְ/ךָ֥ שָׁם֙ לֵ֣ב רַגָּ֔ז וְ/כִלְי֥וֹן עֵינַ֖יִם וְ/דַֽאֲב֥וֹן נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/065.yaml
  text: And among those nations you will find no rest[a], and there will be no resting place for the sole of your foot; and there Yahweh will give you a trembling heart, failing eyes[c][b], and anguish of soul.
translation:
  language: hi
  text: और उन जातियों के बीच तुम्हें चैन नहीं मिलेगा[a], और तुम्हारे पाँव के तलवे के लिए कोई विश्राम-स्थान नहीं होगा। वहाँ यहोवा तुम्हें काँपता हुआ हृदय, क्षीण होती आँखें[b] और प्राण की व्यथा[c] देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम निश्चिंत नहीं रहोगे।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “आँखों का क्षय” अथवा “आँखों का चुक जाना।”
    reason: lexical_alternative
  - marker: c
    text: या, “मन की पीड़ा” अथवा “प्राण का शोक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַרְגִּיעַ
  choice: तुम्हें चैन नहीं मिलेगा
  rationale: हिफ़ील रूप यहाँ स्थिर होने या विश्राम पाने का भाव देता है। ‘चैन नहीं मिलेगा’ निर्वासन के प्रसंग में स्वाभाविक आधुनिक हिन्दी है और बेचैनी के भाव को व्यक्त करता है।
- source_word: מָנוֹחַ
  choice: टिकने की जगह
  rationale: यह संज्ञा विश्राम अथवा विश्राम-स्थान दोनों बता सकती है। ‘पाँव के तलवे’ के साथ स्थानवाचक अर्थ अधिक उपयुक्त है।
- source_word: לְכַף רַגְלֶךָ
  choice: तुम्हारे पाँव के तलवे को
  rationale: כַּף רֶגֶל पाँव के निचले भाग, अर्थात तलवे, को स्पष्ट रूप से दर्शाता है; हिन्दी में यह सटीक और बोधगम्य है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है। हिन्दी के प्रचलित बाइबलीय लिप्यंतरण ‘यहोवा’ से इसे किसी उपाधि में बदले बिना सुरक्षित रखा गया है।
- source_word: לֵב רַגָּז
  choice: काँपता हुआ हृदय
  rationale: रग्गाज़ काँपने, व्याकुलता और भीतरी हलचल का भाव रखता है। यह चयन मूल की सजीव शारीरिक-भावात्मक छवि बनाए रखता है।
- source_word: כִּלְיוֹן עֵינַיִם
  choice: धुँधली पड़ती आँखें
  rationale: यह पद आँखों के क्षीण होने या निष्फल प्रतीक्षा से चुक जाने की छवि देता है। ‘धुँधली पड़ती’ हिन्दी में प्रक्रिया और निराशा दोनों का स्वाभाविक संकेत देता है; शाब्दिक विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: דַּאֲבוֹן נָפֶשׁ
  choice: मन की पीड़ा
  rationale: דַּאֲבוֹן गहरी पीड़ा या शोक है और נֶפֶשׁ यहाँ व्यक्ति के भीतरी जीवन को दर्शाता है। ‘मन की पीड़ा’ सामान्य आधुनिक हिन्दी में स्वाभाविक है, जबकि ‘प्राण की पीड़ा’ विकल्प के रूप में दर्ज है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का चतुरक्षरीय व्यक्तिगत नाम शीर्षक ‘प्रभु’ से नहीं बदला गया। ‘यहोवा’ हिन्दी पाठकों के बीच स्थापित लिप्यंतरण है; ‘याहवे’ अधिक संभावित प्राचीन उच्चारण को दर्शाने वाला वैकल्पिक लिप्यंतरण है।
- issue: נֶפֶשׁ का अर्थ
  choice: मन
  alternative: प्राण
  rationale: इस पदबंध में यह केवल किसी पृथक आध्यात्मिक तत्व की तकनीकी संज्ञा नहीं, बल्कि पीड़ित भीतरी व्यक्ति को दर्शाता है। ‘मन’ वर्तमान हिन्दी में अर्थ स्पष्ट करता है, पर ‘प्राण’ मूल की व्यापकता को अधिक शाब्दिक रूप से रख सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। दूसरे पुरुष एकवचन ‘तुम’ मूल के सामूहिक इस्राएल-संबोधन को बनाए रखता है। समानांतर वाक्य-विन्यास और दण्ड-वचन की तीव्रता सुरक्षित रखी गई है।
