  text: אִם לֹ֨א תִשְׁמֹ֜ר לַ/עֲשׂ֗וֹת אֶת כָּל דִּבְרֵי֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את הַ/כְּתוּבִ֖ים בַּ/סֵּ֣פֶר הַ/זֶּ֑ה לְ֠/יִרְאָה אֶת הַ/שֵּׁ֞ם הַ/נִּכְבָּ֤ד וְ/הַ/נּוֹרָא֙ הַ/זֶּ֔ה אֵ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/058.yaml
  text: If you are not careful to do all the words of this law that are written in this book[c][b][a], to fear this glorious and awesome name—Yahweh your God—
translation:
  language: hi
  text: यदि तुम इस व्यवस्था की उन सब बातों का, जो इस पुस्तक[a] में लिखी हैं, पालन करने और इस महिमामय और भयप्रद नाम का—यहवे, तुम्हारे परमेश्वर का—भय मानने में सावधान नहीं रहोगे,[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लिपटे हुए ग्रंथ में।”
    reason: ספר प्राचीन संदर्भ में पुस्तक के बजाय लिपटे हुए ग्रंथ को भी सूचित कर सकता है।
  - marker: b
    text: हिब्रू में YHWH; पारंपरिक रूप से “प्रभु” अनूदित किया जाता है।
    reason: ईश्वरीय नाम के हिब्रू रूप और पारंपरिक प्रतिपादन की जानकारी देना।
  - marker: c
    text: “भय मानना” में श्रद्धा, विस्मय और भय—तीनों का भाव शामिल हो सकता है।
    reason: ירא के व्यापक अर्थ-क्षेत्र को स्पष्ट करना और केवल आतंक या केवल आदर की संकीर्ण व्याख्या से बचना।
lexical_decisions:
- source_word: תִשְׁמֹר לַעֲשׂוֹת
  choice: सावधानी से नहीं मानोगे
  rationale: שׁמר और עשׂה का संयुक्त वाक्यांश ध्यानपूर्वक पालन करने और व्यवहार में लाने का भाव देता है; हिंदी में ‘सावधानी से मानना’ दोनों पक्षों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: इस व्यवस्था की उन सब बातों को
  rationale: דברי का ‘बातों/वचनों’ वाला अर्थ बनाए रखा गया है, जबकि תורה को इस वाचा-संबंधी विधिक संदर्भ में ‘व्यवस्था’ कहना उपयुक्त है।
- source_word: הַכְּתוּבִים בַּסֵּפֶר הַזֶּה
  choice: जो इस पुस्तक में लिखी हैं
  rationale: हिब्रू के लिखित होने के स्पष्ट भाव को रखा गया है; ספר के लिए आधुनिक हिंदी में ‘पुस्तक’ सहज है, जबकि ‘ग्रंथ-पट’ की संभावना पादटिप्पणी में दी गई है।
- source_word: לְיִרְאָה
  choice: भय मानोगे
  rationale: यहाँ ירא में श्रद्धा और वास्तविक भय दोनों निहित हैं। ‘भय मानना’ हिंदी का स्वाभाविक बाइबलीय प्रयोग है और अर्थ को केवल आदर तक सीमित नहीं करता।
- source_word: הַשֵּׁם הַנִּכְבָּד וְהַנּוֹרָא
  choice: इस महिमामय और भययोग्य नाम
  rationale: נכבד की महिमा/गौरव और נורא के विस्मय तथा भय उत्पन्न करने वाले भाव को साथ रखा गया है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर यहवे
  rationale: द्वितीय पुरुष एकवचन संबंध को सीधे रखा गया है और יהוה को उपाधि से बदलने के बजाय हिंदी में प्रचलित निकट लिप्यंतरण ‘यहवे’ दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है; पाठक-सहायता के लिए पादटिप्पणी में YHWH और पारंपरिक रूप का उल्लेख है।
- issue: ירא को केवल श्रद्धा के रूप में नरम करना या भय बनाए रखना
  choice: भय मानना
  alternative: श्रद्धा करना
  rationale: हिब्रू शब्द में श्रद्धापूर्ण विस्मय और भय दोनों का तनाव है। मुख्य पाठ में ‘भय’ रखकर इसे हल्का नहीं किया गया; पादटिप्पणी व्यापक अर्थ स्पष्ट करती है।
- issue: नाम और यहवे तुम्हारे परमेश्वर के बीच संबंध
  choice: अर्थात् तुम्हारे परमेश्वर यहवे
  alternative: इस नाम, तुम्हारे परमेश्वर यहवे
  rationale: हिब्रू में अंतिम पदबंध उस ‘नाम’ की पहचान कराता है। ‘अर्थात्’ हिंदी में इस समानाधिकरण को स्पष्ट करता है, बिना नाम और परमेश्वर को अलग वस्तुएँ बनाए।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य अगले पद में जारी रहने वाली शर्त का पूर्वार्ध है, इसलिए अंत में अल्पविराम रखा गया है। सर्वनाम एकवचन ‘तुम’ मूल के 2ms रूप के अनुरूप है।
