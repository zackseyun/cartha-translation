source:
  edition: WLC
  text: וְ/הָיִ֜יתָ מְמַשֵּׁ֣שׁ בַּֽ/צָּהֳרַ֗יִם כַּ/אֲשֶׁ֨ר יְמַשֵּׁ֤שׁ הָ/עִוֵּר֙ בָּ/אֲפֵלָ֔ה וְ/לֹ֥א תַצְלִ֖יחַ אֶת דְּרָכֶ֑י/ךָ וְ/הָיִ֜יתָ אַ֣ךְ עָשׁ֧וּק וְ/גָז֛וּל כָּל הַ/יָּמִ֖ים וְ/אֵ֥ין מוֹשִֽׁיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/029.yaml
  text: And you will grope at noon as the blind gropes in the darkness[a], and you will not prosper in your ways; and you will be only oppressed and robbed all the days[c][b], with no one to save you.
translation:
  language: hi
  text: तुम दोपहर में ऐसे टटोलते रहोगे जैसे अंधा अँधेरे में टटोलता है[a], और तुम अपने कामों में सफल नहीं होगे[b]; तुम हर समय केवल अत्याचार सहते और लूटे जाते रहोगे, और तुम्हें बचाने वाला कोई न होगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हाथों से टटोलकर खोजता है”; इब्रानी क्रिया न देख पाने के कारण स्पर्श से खोजने को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: या “तुम अपने मार्गों में सफल नहीं होगे।”
    reason: lexical_alternative
  - marker: c
    text: या “तुम्हें छुड़ाने वाला कोई न होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמַשֵּׁשׁ / יְמַשֵּׁשׁ
  choice: टटोलते फिरोगे / टटोलता है
  rationale: यह क्रिया न देख पाने के कारण स्पर्श से रास्ता या वस्तु खोजने को बताती है। ‘टटोलना’ हिंदी में इस शारीरिक क्रिया और उससे व्यक्त दिशाहीनता—दोनों को स्वाभाविक रूप से रखता है।
- source_word: בַּצָּהֳרַיִם
  choice: दोपहर में
  rationale: यह दिन के सबसे उजले समय को सूचित करता है और अँधेरे के साथ तीखा विरोध बनाए रखता है।
- source_word: הָעִוֵּר
  choice: अंधा
  rationale: हिब्रू में यह पुल्लिंग एकवचन विशेषण संज्ञा के रूप में प्रयुक्त है। ‘अंधा’ उसके प्रतिनिधिक एकवचन और उपमा की संक्षिप्तता को बनाए रखता है।
- source_word: בָּאֲפֵלָה
  choice: अँधेरे में
  rationale: यह ‘दोपहर’ के विपरीत स्पष्ट और स्वाभाविक हिंदी अभिव्यक्ति है।
- source_word: תַצְלִיחַ אֶת דְּרָכֶיךָ
  choice: अपने किसी भी काम में सफल नहीं होगे
  rationale: शाब्दिक ‘अपने मार्गों को सफल न करोगे’ हिंदी में अस्वाभाविक है। संदर्भ में ‘मार्ग’ जीवन के कार्यों और प्रयासों को दर्शाता है; यह रूप उसी व्यापक असफलता को स्पष्ट करता है।
- source_word: אַךְ
  choice: केवल
  rationale: यह व्यक्ति की दशा को अत्याचार और लूट तक सीमित करने वाला बल देता है।
- source_word: עָשׁוּק וְגָזוּל
  choice: अत्याचार सहते और लूटे जाते
  rationale: दोनों निष्क्रिय कृदंत लगातार उत्पीड़ित और लूटे जाने की दशा बताते हैं; हिंदी में यह क्रियात्मक रूप स्वाभाविक और स्पष्ट है।
- source_word: כָּל הַיָּמִים
  choice: हर समय
  rationale: शाब्दिक अर्थ ‘सारे दिन’ है, पर यहाँ निरंतरता अभिप्रेत है। ‘हर समय’ आधुनिक हिंदी में उसी सतत दशा को सहज रूप से व्यक्त करता है।
- source_word: וְאֵין מוֹשִׁיעַ
  choice: तुम्हें बचाने वाला कोई न होगा
  rationale: यह किसी भी छुड़ाने या बचाने वाले के अभाव को बताता है और मूल के व्यक्तिगत प्रभाव को बनाए रखता है।
theological_decisions:
- issue: गैर-मसीहाई वाचा-शाप के संदर्भ में מוֹשִׁיעַ का अनुवाद
  choice: बचाने वाला
  alternative: छुड़ाने वाला / उद्धारकर्ता
  rationale: यहाँ शब्द सामान्य संकट से बचाने या छुड़ाने वाले को दर्शाता है। ‘बचाने वाला’ बाद की विकसित पदवी या विशिष्ट मसीहाई अर्थ आरोपित किए बिना मूल अर्थ रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और प्रत्यक्ष भविष्यकाल रखा गया है। ‘टटोलते फिरोगे’ मूल की निरंतर और दिशाहीन क्रिया को व्यक्त करता है। लंबे हिब्रू वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है, जबकि क्रम, विरोध और शाप की बढ़ती तीव्रता सुरक्षित रखी गई है।
