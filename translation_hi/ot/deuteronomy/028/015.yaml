source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם לֹ֤א תִשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/בָ֧אוּ עָלֶ֛י/ךָ כָּל הַ/קְּלָל֥וֹת הָ/אֵ֖לֶּה וְ/הִשִּׂיגֽוּ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/015.yaml
  text: But if you do not listen to the voice of Yahweh your God[a], to keep and to do all his commandments and his statutes that I am commanding you today[b], then all these curses will come upon you and overtake you.
translation:
  language: hi
  text: लेकिन यदि तुम अपने परमेश्वर यहोवा की वाणी नहीं सुनोगे[a], और उसकी उन सभी आज्ञाओं और विधियों को नहीं मानोगे और उनका पालन नहीं करोगे, जिनकी मैं आज तुम्हें आज्ञा दे रहा हूँ[b], तो ये सभी शाप तुम पर आ पड़ेंगे और तुम्हें जा पकड़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से, “वाणी नहीं सुनोगे।” इब्रानी मुहावरे में सुनने के साथ आज्ञा मानने का भाव भी निहित है; अन्य अनुवाद: “आज्ञा नहीं मानोगे।”'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “मानने और करने के लिए।” ये दो क्रियाएँ आज्ञाओं को मानने और उन्हें व्यवहार में पूरा करने का भाव व्यक्त करती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם לֹא
  choice: लेकिन यदि ... तो
  rationale: यह पद पिछले आशीष-वचन के विपरीत शर्त और उसके परिणाम को प्रस्तुत करता है; आधुनिक हिन्दी में ‘लेकिन यदि ... तो’ इस प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִשְׁמַע בְּקוֹל
  choice: वाणी नहीं सुनोगे
  rationale: मूल इब्रानी मुहावरे की श्रवण-संबंधी छवि को बनाए रखता है, जबकि प्रसंग में आज्ञापालन का अर्थ भी निहित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप से परमेश्वर के व्यक्तिगत वाचा-नाम को व्यक्त करता है, न कि उसे किसी उपाधि से बदलता है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन के वाचागत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: मानकर उनका पालन
  rationale: दोनों इब्रानी क्रियाओं—सावधानी से थामे/माने रखना और व्यवहार में करना—का भेद सुबोध हिन्दी में यथासंभव बनाए रखता है, बिना मूल में अनुपस्थित ‘सावधानीपूर्वक’ जोड़ने के।
- source_word: כָּל מִצְוֺתָיו וְחֻקֹּתָיו
  choice: उसकी सभी आज्ञाओं और विधियों
  rationale: आज्ञा और विधि की अलग कानूनी-वाचागत शब्दावली को सुरक्षित रखता है।
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: जिन्हें मैं आज तुम्हें दे रहा हूँ
  rationale: वर्तमान आदेश की तात्कालिकता को सहज आधुनिक हिन्दी में व्यक्त करता है; यहाँ ‘दे रहा हूँ’ आज्ञाएँ देने के अर्थ में है।
- source_word: וּבָאוּ עָלֶיךָ
  choice: तुम पर आ पड़ेंगे
  rationale: किसी विपत्ति के व्यक्ति पर घटित होने के इब्रानी मुहावरे को स्वाभाविक और सशक्त हिन्दी में व्यक्त करता है।
- source_word: כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: ये सभी शाप
  rationale: वाचा के उल्लंघन के फलस्वरूप आने वाले अभिशापों का सीधा अर्थ सुरक्षित रखता है।
- source_word: וְהִשִּׂיגוּךָ
  choice: तुम्हें आ घेरेंगे
  rationale: शापों के पीछा करके जा पकड़ने की सजीव छवि को हिन्दी में स्वाभाविक रूप देता है; ‘तुम्हें जा पकड़ेंगे’ भी संभव है।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: दोनों रूप दिव्य नाम के लिप्यंतरण हैं। आधुनिक हिन्दी बाइबलीय पाठकों में अधिक पहचाने जाने वाले ‘यहोवा’ को चुना गया है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: सुनने और आज्ञापालन के संबंध का निरूपण
  choice: वाणी नहीं सुनोगे, और ... मानकर उनका पालन नहीं करोगे
  alternative: आज्ञा नहीं मानोगे
  rationale: मूल पाठ की ‘वाणी सुनने’ की वाचागत छवि और ‘मानने/करने’ की दोहरी अभिव्यक्ति दोनों को बनाए रखा गया है, ताकि अर्थ को केवल एक अमूर्त क्रिया में न समेटा जाए।
- issue: शापों की पीछा करने वाली छवि
  choice: आ पड़ेंगे और ... आ घेरेंगे
  alternative: आएँगे और तुम्हें जा पकड़ेंगे
  rationale: मूल में शाप सक्रिय रूप से व्यक्ति तक पहुँचते और उसे पकड़ लेते हैं। चुना हुआ पाठ इस भयावह सक्रियता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तुम’ मूल इब्रानी के सामूहिक एकवचन संबोधन को दर्शाता है। ‘आज्ञाओं’ और ‘विधियों’ का कानूनी-वाचागत भेद तथा सुनने, मानने और करने की क्रमिकता सुरक्षित रखी गई है।
