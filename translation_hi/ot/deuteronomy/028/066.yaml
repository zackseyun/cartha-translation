  yaml_path: translation/ot/deuteronomy/028/066.yaml
  text: Your life will hang in doubt before you[a]; you will fear night and day[b], and you will have no assurance of your life.
translation:
  language: hi
  text: तुम्हारा जीवन तुम्हारे सामने अधर में लटका रहेगा[a]; तुम रात-दिन डरते रहोगे, और तुम्हें अपने जीवित रहने का भरोसा नहीं होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा जीवन तुम्हारे सामने लटका रहेगा”; इब्रानी में जीवन के असुरक्षित ढंग से लटके होने का चित्र है, जो जीवित बचने की निरंतर अनिश्चितता व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֶּיךָ
  choice: तुम्हारा जीवन
  rationale: रूप बहुवचन है, पर यहाँ इब्रानी मुहावरे में व्यक्ति के जीवन अथवा उसके जीवित बने रहने का बोध है; हिन्दी में एकवचन स्वाभाविक है।
- source_word: תְּלֻאִים
  choice: अधर में लटका रहेगा
  rationale: यह תלה, ‘लटकाना’, से बना है। ‘अधर में लटका’ मूल दृश्यात्मक रूपक के साथ जीवन की असुरक्षा और अनिश्चितता भी व्यक्त करता है।
- source_word: לְךָ מִנֶּגֶד
  choice: तुम्हारे सामने
  rationale: वाक्यांश का स्थानिक अर्थ ‘तुम्हारे सामने’ है और यह लगातार आँखों के सामने उपस्थित संकट का चित्र बनाए रखता है।
- source_word: וּפָחַדְתָּ
  choice: डरते रहोगे
  rationale: פחד भय या आतंक को दर्शाता है; सतत काल-सूचक ‘रात-दिन’ के साथ हिन्दी में ‘डरते रहोगे’ निरंतर भय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לַיְלָה וְיוֹמָם
  choice: रात-दिन
  rationale: मूल क्रम ‘रात और दिन’ रखा गया है; हिन्दी का ‘रात-दिन’ निरंतरता को संक्षेप और सहज रूप से व्यक्त करता है।
- source_word: לֹא תַאֲמִין בְּחַיֶּיךָ
  choice: तुम्हें अपने जीवित रहने का भरोसा नहीं होगा
  rationale: אמן का हिफ़ील रूप यहाँ विश्वास, भरोसे या निश्चितता का अर्थ देता है। प्रसंग धार्मिक विश्वास का नहीं, अपने जीवन के बचे रहने के विषय में आश्वस्त न होने का है।
