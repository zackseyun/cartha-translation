  text: Cursed are you in the city[a], and cursed are you in the field.
translation:
  language: hi
  text: तुम नगर में शापित हो[a], और खेत में भी शापित हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम नगर में शाप के अधीन हो।” यही भाव दूसरी पंक्ति में भी है।
    reason: ‘शापित’ के लिए इब्रानी covenant-curse घोषणा का निकटार्थक वैकल्पिक हिन्दी प्रयोग।
lexical_decisions:
- source_word: אָרוּר
  choice: शापित होगे
  rationale: यह निष्क्रिय कृदन्त वाचा के दण्ड की घोषित अवस्था व्यक्त करता है। हिन्दी में भविष्यसूचक प्रसंग और स्वाभाविक अभिव्यक्ति के लिए ‘शापित होगे’ उपयुक्त है, यद्यपि इब्रानी में स्पष्ट भविष्यकालीन क्रिया नहीं है।
- source_word: אַתָּה
  choice: तुम
  rationale: स्पष्ट द्वितीय पुरुष एकवचन सर्वनाम को हिन्दी में ‘तुम’ से रखा गया है; यह इस पूरे संबोधन के एकवचन रूप के अनुरूप है।
- source_word: בָּעִיר
  choice: नगर में
  rationale: בְּ स्थान सूचित करता है और עִיר का सीधा, गरिमापूर्ण आधुनिक हिन्दी रूप ‘नगर’ है।
- source_word: וְ
  choice: और ... भी
  rationale: सरल संयोजक को ‘और’ से रखा गया है; दूसरी समानांतर स्थिति की संचयी व्यापकता स्वाभाविक हिन्दी में ‘भी’ से स्पष्ट होती है।
- source_word: בַּשָּׂדֶה
  choice: खेत में
  rationale: שָׂדֶה यहाँ कृषि-क्षेत्र को दर्शाता है। ‘खेत’ नगर के विपरीत ग्रामीण कार्यक्षेत्र का ठोस अर्थ बनाए रखता है।
theological_decisions:
- issue: वाचा के शाप की घोषणा और उसका कालगत रूप
  choice: दोनों खण्डों में ‘तुम शापित होगे’
  alternative: ‘नगर में तुम शापित हो’ अथवा ‘तुम पर शाप है’
  rationale: इब्रानी रचना क्रियारहित विधेयात्मक घोषणा है, इच्छा या प्रार्थना नहीं। हिन्दी में व्यवस्थाविवरण 28 की आने वाले परिणामों वाली शर्तात्मक सूची के भीतर ‘होगे’ दण्ड की निश्चित घोषणा को स्वाभाविक ढंग से व्यक्त करता है; पादटिप्पणी अधिक शाब्दिक अवस्थात्मक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। ‘नगर’ और ‘खेत’ मूल के स्थानगत समानांतर को बनाए रखते हैं। ‘भी’ सहज हिन्दी में दोनों क्षेत्रों को समेटने वाली समानांतरता उभारता है।
