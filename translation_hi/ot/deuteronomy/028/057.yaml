base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/057.yaml
  text: and toward her afterbirth that comes out from between her legs[a], and toward her children whom she bears, because she will eat them secretly, in the lack of everything[c][b], during the siege and distress with which your enemy will oppress you within your gates.
translation:
  language: hi
  text: और अपनी उस अपरा की ओर, जो उसकी टाँगों के बीच से निकलती है[a], और अपने उन बच्चों की ओर, जिन्हें वह जन्म देगी; क्योंकि वह हर चीज़ के अभाव में[b] उन्हें छिपकर खा जाएगी—उस घेराबंदी और संकट में, जिनसे तुम्हारा शत्रु तुम्हें तुम्हारे नगरों में[c] कठोरता से तंग करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘प्लेसेंटा।’ इब्रानी शब्द उस अपरा को सूचित करता है जो प्रसव के समय बच्चे के बाद निकलती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘हर चीज़ के अभाव के कारण।’ यह वाक्यांश घेराबंदी के दौरान अत्यन्त और सर्वव्यापी अभाव को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘तुम्हारे फाटकों के भीतर।’ इसका अर्थ घिरे हुए नगरों या बस्तियों के भीतर है, केवल फाटक की संरचना के भीतर नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְיָתָהּ
  choice: अपनी उस अपरा
  rationale: यह शब्द प्रसव के साथ निकलने वाली अपरा अथवा खेड़ी को सूचित करता है। ‘अपरा’ शारीरिक अर्थ को ठीक रखता है; पादटिप्पणी इसे सामान्य भाषा में स्पष्ट करती है।
- source_word: הַיּוֹצֵת מִבֵּין רַגְלֶיהָ
  choice: जो उसकी टाँगों के बीच से निकलती है
  rationale: प्रत्यक्ष शारीरिक वर्णन को बिना नरम किए रखा गया है। इस प्रसंग में רַגְלַיִם का स्वाभाविक हिन्दी अर्थ ‘टाँगें’ है, न कि केवल ‘पाँव’।
- source_word: וּבְבָנֶיהָ אֲשֶׁר תֵּלֵד
  choice: और अपने उन बच्चों पर जिन्हें वह जन्म देगी
  rationale: בָּנִים यहाँ केवल पुत्रों के बजाय संतान के व्यापक अर्थ में है; ‘बच्चों’ से वह अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: כִּי תֹאכְלֵם
  choice: क्योंकि ... वह उन्हें ... खा जाएगी
  rationale: כִּי कारण बताता है और אכל साधारण तथा स्पष्ट क्रिया ‘खाना’ है। भयावह कथन को व्यंजना द्वारा हल्का नहीं किया गया।
- source_word: בְּחֹסֶר כֹּל
  choice: सब कुछ की कमी में
  rationale: इब्रानी पूर्वसर्ग और सर्वव्यापी अभाव की धारणा को निकटता से रखा गया है; इसका आशय घेराबंदी में पूर्ण वंचना है।
- source_word: בַּסָּתֶר
  choice: छिपकर
  rationale: यह क्रियाविशेषण गुप्त रूप से किए जाने का भाव देता है; ‘छिपकर’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: घेराबंदी और संकट के समय
  rationale: 'दोनों समानांतर संज्ञाओं को अलग रखा गया है: מָצוֹר सैन्य घेराबंदी और מָצוֹק दबावजन्य संकट को दर्शाता है।'
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: जिनसे तुम्हारा शत्रु ... तुम्हें बुरी तरह दबाएगा
  rationale: צוּק के हिफ़ील रूप में कठोर दबाव डालने और तंग करने का भाव है। ‘बुरी तरह दबाएगा’ घेराबंदी के उस दबाव को बनाए रखता है।
- source_word: בִּשְׁעָרֶיךָ
  choice: तुम्हारे फाटकों के भीतर
  rationale: शाब्दिक फाटक-चित्र को रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि यह फाटक मात्र नहीं बल्कि उनसे सुरक्षित नगरों का संकेत है।
theological_decisions:
- issue: आरंभिक וּבְ־ पदबंध का पिछले पद पर निर्भर होना
  choice: पद को ‘और ... पर’ से जारी रखा गया
  alternative: इसे स्वतंत्र वाक्य बनाकर निहित क्रिया जोड़ना
  rationale: इब्रानी में यह पद पिछले पद के उस कथन को आगे बढ़ाता है जिसमें स्त्री की दृष्टि या मनोवृत्ति का लक्ष्य बताया गया है। स्वतंत्र वाक्य बनाने से स्रोत में निहित निरंतरता छिप जाती।
- issue: תֹאכְלֵם में बहुवचन कर्म का विस्तार
  choice: ‘उन्हें’ को अस्पष्ट ही रखा गया
  alternative: केवल ‘बच्चों को’ कहना
  rationale: व्याकरणतः बहुवचन सर्वनाम निकटवर्ती बच्चों के साथ-साथ पहले उल्लिखित अपरा सहित सूची को समेट सकता है। हिन्दी में ‘उन्हें’ स्रोत की इस तनावपूर्ण अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रत्यक्ष रखी गई है। प्रसंग की भयावहता को नरम नहीं किया गया। ‘अपरा’ अपेक्षाकृत शारीरिक शब्द है, इसलिए सामान्य पाठक के लिए पादटिप्पणी दी गई है। पद पिछले पद की वाक्य-रचना को आगे बढ़ाता है, अतः आरंभ में ‘और ... पर’ स्वाभाविक रूप से अधीन पदबंध बना रहता है।
