base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/064.yaml
  text: And Yahweh will scatter you among all the peoples[a], from one end of the earth to the other end of the earth[b], and there you will serve other gods that neither you nor your fathers have known—wood and stone.
translation:
  language: hi
  text: याहवे तुझे सब जातियों के बीच तितर-बितर कर देगा—पृथ्वी के एक छोर से लेकर दूसरे छोर तक[a]। वहाँ तू दूसरे देवताओं की सेवा करेगा, जिन्हें न तूने जाना, न तेरे पूर्वजों ने—लकड़ी और पत्थर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश के एक छोर से लेकर दूसरे छोर तक।” इब्रानी אֶרֶץ का अर्थ “देश” या “पृथ्वी” दोनों हो सकता है; यहाँ सब जातियों के बीच बिखेरे जाने के कारण “पृथ्वी” को मुख्य पाठ में रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: “लकड़ी और पत्थर” से आशय इन पदार्थों से बनाई गई देवमूर्तियों से है।
    reason: cultural_note
lexical_decisions:
- source_word: וֶהֱפִיצְךָ
  choice: तुझे तितर-बितर कर देगा
  rationale: פוץ के हिफ़ील रूप में किसी को बिखेर देने या विभिन्न स्थानों में फैला देने का भाव है। ‘तितर-बितर कर देगा’ वाचा के शाप के संदर्भ में स्वाभाविक और स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण के रूप में रखा गया है।
- source_word: בְּכָל הָעַמִּים
  choice: सब जातियों के बीच
  rationale: עַמִּים अलग-अलग जनसमुदायों को दर्शाता है। आधुनिक हिन्दी में ‘सब जातियों के बीच’ इस बहुवचन और निर्वासन के संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: पृथ्वी के एक छोर से लेकर दूसरे छोर तक
  rationale: यह समूचे भौगोलिक विस्तार का सूचक मुहावरा है। ‘पृथ्वी’ व्यापक बिखराव के संदर्भ के अनुकूल है; אֶרֶץ की ‘देश’ वाली सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וְעָבַדְתָּ
  choice: तू ... सेवा करेगा
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है और देवताओं के साथ यह आराधनापूर्ण अधीनता का अर्थ देता है। ‘सेवा करेगा’ मूल क्रिया की व्यापकता बनाए रखता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह इस्राएल के परमेश्वर के अतिरिक्त देवताओं के लिए प्रयुक्त सीधी वाचाई अभिव्यक्ति है।
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: जिन्हें न तूने जाना था, न तेरे पुरखों ने
  rationale: यह वाक्यांश ידע के ‘जानना’ अर्थ को बनाए रखते हुए व्यक्ति और उसके पूर्वजों—दोनों के निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֵץ וָאָבֶן
  choice: लकड़ी और पत्थर
  rationale: मूल में ये संज्ञाएँ ‘दूसरे देवताओं’ के बाद व्याख्यात्मक समानाधिकरण में हैं। डैश मूल की संक्षिप्त, तीखी अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना हिन्दी लिपि में प्रस्तुत करता है।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: पृथ्वी
  alternative: देश
  rationale: אֶרֶץ दोनों अर्थ दे सकता है। ‘सब जातियों के बीच’ बिखेरे जाने का निकट संदर्भ व्यापक ‘पृथ्वी’ अर्थ का समर्थन करता है, पर वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में दी गई है।
- issue: दूसरे देवताओं की सेवा का स्वरूप
  choice: सेवा करेगा
  alternative: पूजा करेगा
  rationale: ‘सेवा’ עבד का सीधा अर्थ बनाए रखती है और देवताओं के संदर्भ में पूजा तथा निष्ठा का भाव स्वतः प्रकट होता है; ‘पूजा’ अर्थ को कुछ अधिक संकीर्ण कर देती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। इब्रानी का संबोधन एकवचन है, इसलिए ‘तुझे/तू/तेरे’ प्रयुक्त हुए हैं। मुख्य पाठ में समानाधिकरण और शाप-वाणी की तीव्रता बनाए रखने के लिए डैश का उपयोग किया गया है।
