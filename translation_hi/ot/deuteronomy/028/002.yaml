base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/002.yaml
  text: And all these blessings will come upon you and overtake you[a], if you obey the voice of Yahweh your God.
translation:
  language: hi
  text: और ये सभी आशीषें तुम पर आएँगी और तुम्हें आ पकड़ेंगी, यदि[b] तुम अपने परमेश्वर याहवे की वाणी मानोगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने परमेश्वर याहवे की वाणी सुनोगे।” इब्रानी मुहावरे में सुनने के साथ आज्ञाकारी उत्तर देने का भाव भी है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी कण का अनुवाद यहाँ “क्योंकि” या “जब” भी हो सकता है; प्रसंग में “यदि” शर्त का भाव व्यक्त करता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: तुम पर आएँगी
  rationale: क्रिया और עַל का सीधा, स्वाभाविक अनुवाद; इस आशीष-संदर्भ में पूर्ण रूप भावी परिणाम व्यक्त करता है।
- source_word: כָּל הַבְּרָכוֹת הָאֵלֶּה
  choice: ये सभी आशीषें
  rationale: परिमाण और संकेतवाचक पद दोनों को स्पष्ट रखते हुए वाचा-संबंधी संदर्भ के अनुकूल है।
- source_word: וְהִשִּׂיגֻךָ
  choice: और तुम्हें आ पकड़ेंगी
  rationale: हिफ़ील रूप में किसी तक पहुँचकर उसे पकड़ लेने का सजीव भाव है; यह केवल ‘पहुँचेंगी’ से अधिक पूर्ण रूप से मूल बिंब को रखता है।
- source_word: כִּי
  choice: यदि
  rationale: व्यवस्थाविवरण 28:1–2 की शर्त और उसके फल के संदर्भ में इसका शर्तसूचक अर्थ सबसे स्वाभाविक है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: תִשְׁמַע בְּקוֹל
  choice: वाणी मानोगे
  rationale: यह इब्रानी मुहावरा केवल सुनने नहीं, सुनकर आज्ञाकारी उत्तर देने का भाव रखता है; ‘वाणी’ मूल अभिव्यक्ति को बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन के संबंधसूचक प्रत्यय को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है; ‘याहवे’ उसका निकट लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: שׁמע בְּקוֹל का वाचाई अर्थ
  choice: वाणी मानोगे
  alternative: वाणी सुनोगे
  rationale: मुहावरे में आज्ञाकारी सुनने का भाव निहित है; विकल्प को पादटिप्पणी में देकर मूल अभिव्यक्ति की अर्थ-व्याप्ति बनाए रखी गई है।
- issue: כִּי का संबंध
  choice: यदि
  alternative: क्योंकि; जब
  rationale: आस-पास का अनुच्छेद इसे आशीष की शर्त के रूप में पढ़ने का समर्थन करता है, पर कण के अन्य सम्भव अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। एकवचन ‘तुम’ मूल पाठ में इस्राएल को एक सामूहिक इकाई के रूप में किए गए संबोधन को बनाए रखता है।
