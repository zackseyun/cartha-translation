  text: בָּנֶ֨י/ךָ וּ/בְנֹתֶ֜י/ךָ נְתֻנִ֨ים לְ/עַ֤ם אַחֵר֙ וְ/עֵינֶ֣י/ךָ רֹא֔וֹת וְ/כָל֥וֹת אֲלֵי/הֶ֖ם כָּל הַ/יּ֑וֹם וְ/אֵ֥ין לְ/אֵ֖ל יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/032.yaml
  text: Your sons and your daughters will be given to another people[a], while your eyes look on and fail with longing for them all day long, but your hand will be powerless.
translation:
  language: hi
  text: तुम्हारे बेटे और तुम्हारी बेटियाँ दूसरे लोगों को सौंप दिए जाएँगे; तुम्हारी आँखें उन्हें देखती रहेंगी और दिन भर उनके लिए तरसते-तरसते क्षीण होती जाएँगी, पर तुम्हारे हाथ में कोई सामर्थ्य न होगी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, «यह तुम्हारे वश में न होगा।» इब्रानी मुहावरे का शाब्दिक अर्थ है कि तुम्हारे हाथ में कोई शक्ति नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: तुम्हारे बेटे और तुम्हारी बेटियाँ
  rationale: इब्रानी पाठ पुत्रों और पुत्रियों, दोनों का स्पष्ट उल्लेख करता है; इसलिए सामान्य शब्द ‘बच्चे’ के बजाय दोनों को अलग-अलग रखा गया है।
- source_word: נְתֻנִים לְעַם אַחֵר
  choice: दूसरे लोगों को सौंप दिए जाएँगे
  rationale: भविष्यसूचक शाप के संदर्भ में कर्मवाच्य कृदन्त को भविष्यकाल में व्यक्त किया गया है। ‘सौंप दिए जाएँगे’ प्रतिकूल अधिकार में दिए जाने का भाव स्वाभाविक हिन्दी में बताता है; עַם को ‘लोग’ कहा गया है, ‘राष्ट्र’ नहीं।
- source_word: וְעֵינֶיךָ רֹאוֹת וְכָלוֹת אֲלֵיהֶם
  choice: तुम्हारी आँखें ... उन्हें देख पाने की लालसा में राह देखते-देखते क्षीण हो जाएँगी
  rationale: रचना असहाय होकर देखते रहने और बच्चों के लिए तरसते हुए आँखों के चुक जाने की संयुक्त छवि प्रस्तुत करती है। हिन्दी मुहावरा ‘राह देखते-देखते’ उस दीर्घ, निष्फल प्रतीक्षा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह मूल के निरन्तर कालगत भाव का सहज आधुनिक हिन्दी रूप है।
- source_word: וְאֵין לְאֵל יָדֶךָ
  choice: तुम्हारे हाथ में कोई सामर्थ्य न होगी
  rationale: यह इब्रानी मुहावरा किसी देवता का उल्लेख नहीं, बल्कि कार्य करने की शक्ति या क्षमता न होने को दर्शाता है। ‘हाथ में सामर्थ्य’ मूल की शारीरिक छवि भी बनाए रखता है।
theological_decisions:
- issue: וְאֵין לְאֵל יָדֶךָ में אֵל का अर्थ
  choice: तुम्हारे हाथ में कोई सामर्थ्य न होगी
  alternative: यह तुम्हारे वश में न होगा
  rationale: यहाँ אֵל को ‘ईश्वर’ समझना भ्रामक होगा; पूरी अभिव्यक्ति असमर्थता का मुहावरा है। चुना हुआ रूप अर्थ स्पष्ट करते हुए ‘हाथ’ की मूल छवि बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष और सामान्य पाठक के लिए सुबोध शैली। एकवचन सम्बोधित व्यक्ति के लिए ‘तुम्हारे’ रखा गया है। मूल की कठोरता और माता-पिता की असहाय लालसा को नरम नहीं किया गया।
