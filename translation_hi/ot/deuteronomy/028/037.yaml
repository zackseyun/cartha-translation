  text: וְ/הָיִ֣יתָ לְ/שַׁמָּ֔ה לְ/מָשָׁ֖ל וְ/לִ/שְׁנִינָ֑ה בְּ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁר יְנַהֶגְ/ךָ֥ יְהוָ֖ה שָֽׁמָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/037.yaml
  text: And you shall become an object of horror[a], a proverb[c][b], and a taunt among all the peoples where Yahweh will drive you.
translation:
  language: hi
  text: और याहवे तुम्हें जिन सभी लोगों के बीच हाँककर ले जाएगा, उनके बीच तुम भय का विषय[a], एक कहावत और एक ताना[b] बन जाओगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘विस्मय का विषय’। इब्रानी शब्द ऐसी उजड़ी या दारुण दशा का बोध करा सकता है जिसे देखकर भय या विस्मय हो।
    reason: lexical_alternative
  - marker: b
    text: ‘कहावत’ और ‘ताना’ के लिए ‘उपहास की कहावत’ या ‘बदनामी का नाम’ भी कहा जा सकता है; इब्रानी में सार्वजनिक उपहास को व्यक्त करने वाले दो अलग, पर संबंधित शब्द हैं।
    reason: lexical_alternative
  - marker: c
    text: या, ‘ले जाएगा’। इब्रानी क्रिया का अर्थ ‘ले जाना’ या ‘अगुवाई करना’ भी हो सकता है; यहाँ श्राप और निर्वासन के संदर्भ में ‘हाँककर ले जाएगा’ बाध्यकारी भाव को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: तुम ... बन जाओगे
  rationale: श्रापों की इस शृंखला में रूप का भावी और परिणामसूचक बल है; ‘बन जाओगे’ उस परिणामी दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְשַׁמָּה
  choice: भयावह दृश्य
  rationale: यह शब्द न्याय के प्रसंग में ऐसी उजड़ी या दारुण दशा को सूचित करता है जिसे देखकर भय अथवा विस्मय हो; ‘भयावह दृश्य’ व्यक्ति के दूसरों की प्रतिक्रिया का विषय बनने का भाव स्पष्ट करता है।
- source_word: לְמָשָׁל
  choice: कहावत
  rationale: מָשָׁל का सीधा अर्थ ‘कहावत’ है; यहाँ उसका नकारात्मक भाव श्राप के प्रसंग और साथ आए ‘ताना’ से स्पष्ट होता है।
- source_word: וְלִשְׁנִינָה
  choice: ताना
  rationale: שְׁנִינָה किसी चुभती, उपहासपूर्ण उक्ति को दर्शाता है; ‘ताना’ इसे מָשָׁל से अलग रखते हुए शत्रुतापूर्ण वाणी का भाव व्यक्त करता है।
- source_word: בְּכֹל הָעַמִּים
  choice: उन सबके बीच
  rationale: संज्ञा का अर्थ ‘लोग/जनसमुदाय’ है। पूर्ववर्ती ‘जिन-जिन लोगों’ के साथ सर्वनामात्मक पुनरुक्ति आधुनिक हिन्दी में अधिक स्वाभाविक है और ‘सब लोगों के बीच’ का अर्थ बनाए रखती है।
- source_word: אֲשֶׁר יְנַהֶגְךָ
  choice: जिन-जिन लोगों के बीच ... तुम्हें हाँककर ले जाएगा
  rationale: נהג में ‘ले जाना’ और ‘हाँकना’ दोनों अर्थ संभव हैं। निर्वासन के बाध्यकारी श्राप-संदर्भ में ‘हाँककर ले जाएगा’ बलपूर्वक हटाए जाने का भाव व्यक्त करता है; सम्बन्धवाचक खंड को हिन्दी के अनुरूप आगे रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से।
- source_word: שָׁמָּה
  choice: के बीच
  rationale: स्थानवाचक ‘वहाँ’ का अर्थ सम्बन्धवाचक ‘जिन-जिन लोगों के बीच’ में स्वाभाविक रूप से समाहित है; अलग से ‘वहाँ’ जोड़ना हिन्दी में अनावश्यक पुनरुक्ति होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय पाठकों में पहचाना जाने वाला उसका लिप्यंतरण है और नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: निर्वासन में परमेश्वर की क्रिया का बल
  choice: हाँककर ले जाएगा
  alternative: ले जाएगा / अगुवाई करेगा
  rationale: נהג अपने आप में ‘ले जाना’ भी कह सकता है, पर व्यवस्थाविवरण 28 के श्राप और जबरन बिखराव के संदर्भ में बाध्यता का भाव प्रमुख है। फिर भी वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। हिन्दी की स्वाभाविक वाक्य-रचना के लिए सम्बन्धवाचक खंड आगे रखा गया है। ‘कहावत’ और ‘ताना’ को अलग रखकर मूल के दो संबंधित किंतु भिन्न पदों का अंतर बचाया गया है।
