base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/035.yaml
  text: Yahweh will strike you with severe boils on the knees and on the legs[a], from which you cannot be healed, from the sole of your foot to the crown of your head.
translation:
  language: hi
  text: याहवे तुम्हारे घुटनों और टाँगों[a] पर भयंकर फोड़ों से तुम्हें पीड़ित करेगा, जिनसे तुम ठीक नहीं हो सकोगे—तुम्हारे पाँव के तलवे से लेकर तुम्हारे सिर की चोटी तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पिंडलियों’; इब्रानी शब्द विशेष रूप से घुटने के नीचे की टाँग को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: तुम्हें मारेगा
  rationale: हिफ़िल रूप נכה यहाँ सीधे प्रहार या विपत्ति पहुँचाने का भाव रखता है। ‘तुम्हें मारेगा’ आधुनिक हिन्दी में इसकी प्रबलता और परमेश्वर द्वारा दिए जाने वाले दंड की प्रत्यक्षता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בִּשְׁחִין רָע
  choice: भयंकर फोड़े
  rationale: שְׁחִין सूजी हुई त्वचा के फोड़े या घाव को दर्शाता है और यहाँ एकवचन का सामूहिक अर्थ है; רָע उसकी गंभीरता बताता है।
- source_word: עַל הַבִּרְכַּיִם
  choice: घुटनों पर
  rationale: यह अंग-सूचक पद का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וְעַל הַשֹּׁקַיִם
  choice: और टाँगों पर
  rationale: שׁוֹק विशेषतः घुटने के नीचे के भाग को सूचित कर सकता है। सहज मुख्य पाठ के लिए ‘टाँगों’ और अधिक विशिष्ट अर्थ के लिए पादटिप्पणी रखी गई है।
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: जिनसे तुम ठीक नहीं हो सकोगे
  rationale: निष्क्रिय भाव असाध्य दशा पर ध्यान रखता है और इब्रानी संबंधवाचक उपवाक्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִכַּף רַגְלְךָ
  choice: तुम्हारे पाँव के तलवे से
  rationale: पाँव के साथ כַּף का अर्थ तलवा है; हिन्दी में यह सटीक और प्रचलित अभिव्यक्ति है।
- source_word: וְעַד קָדְקֳדֶךָ
  choice: तुम्हारे सिर की चोटी तक
  rationale: קָדְקֹד सिर के सबसे ऊपरी भाग को दर्शाता है और पूरे शरीर में व्याप्त विपत्ति की छवि बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘यहोवा परमेश्वर’ जैसी उपाधि-आधारित परंपरा
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से प्रतिस्थापित न करके स्रोत-पाठ की विशिष्टता सुरक्षित रखी गई है।
- issue: रोग का कर्ता
  choice: याहवे सीधे तुम्हें मारेगा
  alternative: तुम पर फोड़े निकलेंगे
  rationale: इब्रानी वाक्य में याहवे स्पष्ट कर्ता है; निष्क्रिय या अप्रत्यक्ष रचना उस धर्मवैचारिक तनाव को कम कर देती, इसलिए प्रत्यक्ष कर्तृत्व बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उत्पन्न करके तुम्हें मारेगा’ साधनवाचक בְּ को स्पष्ट करता है। अंतिम पदबंध की इब्रानी संबद्धता कुछ संक्षिप्त है; हिन्दी में डैश के द्वारा उसके व्यापक शारीरिक विस्तार को रखा गया है, बिना ‘फैलना’ जैसी अतिरिक्त क्रिया जोड़े।
