  text: a fierce-faced nation[c][b][a], one that shows no regard for the old and shows no favor to the young.
translation:
  language: hi
  text: एक कठोर मुखाकृति वाली जाति[a], जो वृद्ध का कोई लिहाज़ नहीं करेगी[b] और युवा पर कोई कृपा नहीं करेगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मुखाकृति में कठोर जाति।”
    reason: lexical_alternative
  - marker: b
    text: या “वृद्ध का आदर नहीं करेगी।” हिब्रू मुहावरे का शाब्दिक अर्थ है, “वृद्ध के मुख को नहीं उठाएगी।”
    reason: lexical_alternative
  - marker: c
    text: या “युवा पर दया नहीं करेगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹי
  choice: जाति
  rationale: यहाँ यह शब्द एक विदेशी आक्रमणकारी जन-समुदाय या राष्ट्र को दर्शाता है। हिंदी में स्त्रीलिंग क्रियाओं के साथ ‘जाति’ इस संदर्भ में स्वाभाविक और स्पष्ट है।
- source_word: עַז פָּנִים
  choice: उग्र मुखवाली
  rationale: यह चयन मूल अभिव्यक्ति के ‘मुख’ संबंधी बिंब को बनाए रखते हुए उस जाति के कठोर और भयावह स्वभाव को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: אֲשֶׁר
  choice: जो
  rationale: यह संबंधवाचक उपवाक्य आरंभ करता है और वर्णित जाति के स्वभाव को आगे स्पष्ट करता है।
- source_word: לֹא יִשָּׂא פָנִים לְזָקֵן
  choice: वृद्ध का कोई लिहाज़ नहीं करेगी
  rationale: ‘मुख उठाना’ हिब्रू मुहावरा है जिसका अर्थ पक्ष, सम्मान या लिहाज़ करना हो सकता है। वृद्ध के संदर्भ में ‘लिहाज़’ आदर और मान रखने की भावना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: זָקֵן
  choice: वृद्ध
  rationale: एकवचन यहाँ पूरे वर्ग का प्रतिनिधित्व करता है। ‘वृद्ध’ गरिमापूर्ण, संक्षिप्त और लिंग की अनावश्यक विशिष्टता से बचने वाला शब्द है।
- source_word: וְנַעַר
  choice: युवा
  rationale: נַעַר की अर्थ-सीमा बालक से जवान तक है। वृद्ध के साथ विरोधी युग्म में ‘युवा’ व्यापक आयु-वर्ग को उपयुक्त ढंग से व्यक्त करता है।
- source_word: לֹא יָחֹן
  choice: कोई कृपा नहीं करेगी
  rationale: חנן का मूल अर्थ कृपा या अनुग्रह दिखाना है। ‘कृपा नहीं करेगी’ इस अर्थ को बनाए रखता है, जबकि संदर्भ में दया न करने का भाव भी निहित रहता है।
