  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उग्र मुखवाली’ मूल के मुख-संबंधी बिंब को बचाता है; ‘लिहाज़’ सामान्य पाठक के लिए मुहावरे का स्वाभाविक अर्थ देता है। भविष्यकालीन क्रियाएँ व्यवस्थाविवरण 28 की आने वाली वाचा-शाप संबंधी भविष्यवाणी के संदर्भ के अनुरूप हैं।
