  text: וְ/לֹ֣א תָס֗וּר מִ/כָּל הַ/דְּבָרִים֙ אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם יָמִ֣ין וּ/שְׂמֹ֑אול לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/014.yaml
  text: And do not turn aside from any of the words that I am commanding you today[a], to the right or to the left[b], to go after other gods to serve them.
translation:
  language: hi
  text: और जिन बातों की मैं आज तुम्हें आज्ञा देता हूँ, उनमें से किसी से भी दाईं या बाईं ओर न हटना, दूसरे देवताओं के पीछे जाने[a] और उनकी सेवा करने[b] के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दूसरे देवताओं का अनुसरण करने।’ हिब्रू मुहावरे का शाब्दिक अर्थ ‘पीछे जाना’ है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उनकी आराधना करने।’ देवता के संबंध में यह क्रिया धार्मिक सेवा का अर्थ रख सकती है और इसलिए इसमें आराधना का भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָסוּר
  choice: हटना
  rationale: यह क्रिया किसी निर्धारित मार्ग या आदेश से मुड़ने अथवा विचलित होने को व्यक्त करती है। ‘हटना’ आधुनिक हिन्दी में स्वाभाविक है और वाचा की आज्ञाओं से विचलन का भाव बनाए रखता है।
- source_word: מִכָּל הַדְּבָרִים
  choice: किसी भी बात से
  rationale: नकार के साथ מִכָּל का आशय है कि दी गई बातों में से एक से भी न हटा जाए। ‘बात’ דָּבָר का सीधा और सहज समतुल्य है; अगला उपवाक्य स्पष्ट करता है कि ये आज्ञा के रूप में कही गई बातें हैं।
- source_word: מְצַוֶּה
  choice: आज्ञा देता हूँ
  rationale: हिब्रू कृदंत मूसा के वर्तमान संबोधन की निरंतर और तात्कालिक क्रिया व्यक्त करता है। यह हिन्दी प्रयोग उसी वर्तमान बल को स्वाभाविक रूप से रखता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: ‘आज’ आधुनिक हिन्दी का सीधा समतुल्य है और वाचा के वर्तमान संबोधन की तात्कालिकता बनाए रखता है।
- source_word: יָמִין וּשְׂמֹאול
  choice: दाईं ओर ... बाईं ओर
  rationale: यह किसी भी दिशा में निर्धारित मार्ग से विचलित होने का स्थानिक मुहावरा है। दोनों दिशाओं को स्पष्ट रखकर मूल रूपक सुरक्षित किया गया है।
- source_word: לָלֶכֶת אַחֲרֵי
  choice: पीछे चलने
  rationale: यह हिब्रू मुहावरा किसी का अनुसरण करने, विशेषतः धार्मिक निष्ठा में उसके पीछे जाने, का अर्थ देता है। ‘पीछे चलना’ मूल क्रियात्मक बिंब को बनाए रखता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह मूल पदबंध का सीधा अनुवाद है। ‘पराए देवता’ सम्भव है, पर वह यहाँ ‘दूसरे’ की अपेक्षा अधिक व्याख्यात्मक होगा।
- source_word: לְעָבְדָם
  choice: उनकी सेवा करने
  rationale: עבד देवता के संबंध में धार्मिक सेवा और आराधना दोनों का बल रख सकता है। ‘सेवा करना’ अधिक सीधा शाब्दिक समतुल्य है और निष्ठा तथा उपासना-संबंधी सेवा की व्यापकता बनाए रखता है।
theological_decisions:
- issue: वाचा की चेतावनी में अन्य देवताओं का उल्लेख
  choice: दूसरे देवता
  alternative: पराए देवता
  rationale: हिब्रू पाठ व्यवस्थाविवरण की प्रचलित अभिव्यक्ति ‘दूसरे देवताओं’ को रखता है। अनुवाद उनके अस्तित्व-संबंधी धर्मवैज्ञानिक प्रश्न का निर्णय जोड़े बिना पाठ की अपनी वाणी और तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दाईं ओर ... बाईं ओर’ से मूल स्थानिक रूपक और ‘पीछे चलने’ से हिब्रू मुहावरे का बिंब सुरक्षित है। डैश अंतिम उद्देश्य/परिणाम-वाक्यांश को पूर्व निषेध से स्पष्ट रूप से जोड़ता है।
