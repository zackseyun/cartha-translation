review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately reflects the Hebrew structure and key terms: Yahweh as the subject, the addressees'' and their offspring''s afflictions, the intensifying verb from פלא, and the paired descriptions of great/enduring plagues and grievous/enduring sicknesses. ‘वंश’ can denote lineage rather than the people descended from the addressee; ‘वंशजों’ more directly represents זַרְעֶךָ in this context.'
  naturalness: The phrase ‘तुम पर और तुम्हारे वंश पर पड़ने वाली विपत्तियों’ is understandable but cumbersome, especially with ‘वंश पर पड़ने वाली.’ Possessive phrasing with ‘तुम्हारी और तुम्हारे वंशजों की विपत्तियाँ’ is natural Hindi and preserves the source sense. ‘स्थायी’ is more concise and idiomatic than ‘टिके रहने वाली’ while retaining the sense of enduring/persistent.
  terminology: ‘याहवे,’ ‘विपत्तियाँ,’ ‘रोग,’ and ‘भयंकर’ are suitable in modern standard Hindi. ‘स्थायी’ consistently renders both occurrences of the Hebrew term without importing theological interpretation.
  issues:
  - severity: medium
    issue: ‘वंश पर पड़ने वाली विपत्तियाँ’ is idiomatically awkward and may suggest affliction falling on a lineage/dynasty rather than on descendants.
    rationale: The Hebrew זַרְעֶךָ refers collectively to the addressee’s offspring/descendants. ‘वंशजों’ directly conveys this personal collective reference.
  - severity: low
    issue: ‘टिके रहने वाली/वाले’ is wordy and less polished in this elevated prose context.
    rationale: ‘स्थायी’ naturally conveys the contextual sense of firm, enduring, or persistent and can be repeated for both plagues and diseases, as in the Hebrew.
  revised_text: तब याहवे तुम्हारी और तुम्हारे वंशजों की विपत्तियों को असाधारण[a] कर देगा—बड़ी और स्थायी[b] विपत्तियाँ, और भयंकर तथा स्थायी रोग।
  revised_footnotes:
