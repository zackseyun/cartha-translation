language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִפְלָ֤א יְהוָה֙ אֶת מַכֹּ֣תְ/ךָ֔ וְ/אֵ֖ת מַכּ֣וֹת זַרְעֶ֑/ךָ מַכּ֤וֹת גְּדֹלוֹת֙ וְ/נֶ֣אֱמָנ֔וֹת וָ/חֳלָיִ֥ם רָעִ֖ים וְ/נֶאֱמָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/059.yaml
  text: then Yahweh will make your plagues and the plagues of your offspring extraordinary—great and lasting plagues[b][a], and severe and lasting sicknesses.
translation:
  language: hi
  text: तब याहवे तुम्हारी और तुम्हारे वंशजों की विपत्तियों को असाधारण[a] कर देगा—बड़ी और स्थायी[b] विपत्तियाँ, और भयंकर तथा स्थायी रोग।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘विलक्षण।’ इब्रानी क्रिया किसी वस्तु को असाधारण या उल्लेखनीय बनाने का अर्थ दे सकती है; यहाँ यह दंड की असाधारण गंभीरता बताती है।
    reason: lexical_alternative
  - marker: b
    text: ‘स्थायी’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ दृढ़, स्थायी या लगातार बना रहने वाला है। यही शब्द आगे रोगों के लिए भी आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָא
  choice: असाधारण बना देगा
  rationale: हिफ़ील रूप यहाँ विपत्तियों को सामान्य से बढ़कर, विलक्षण या चकित कर देने वाला बनाने का भाव देता है। न्याय के संदर्भ में ‘असाधारण’ इस तीव्रता को व्यक्त करता है, पर सकारात्मक प्रशंसा का भाव नहीं लाता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: מַכֹּתְךָ / מַכּוֹת
  choice: तुम पर ... पड़ने वाली विपत्तियाँ / विपत्तियाँ
  rationale: מכה का अर्थ प्रहार, मार या महामारीजन्य विपत्ति हो सकता है। वाचा के शापों के इस संदर्भ में ‘विपत्तियाँ’ व्यापक दैवी प्रहारों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: זַרְעֶךָ
  choice: तुम्हारा वंश
  rationale: सामूहिक अर्थ वाले זרע को आधुनिक हिंदी में स्वाभाविक रूप से ‘वंश’ कहा गया है।
- source_word: גְּדֹלוֹת
  choice: बड़ी-बड़ी
  rationale: शाब्दिक अर्थ ‘बड़ी’ है; हिंदी में पुनरुक्ति विपत्तियों की विशालता और गंभीरता को सहज ढंग से उभारती है।
- source_word: נֶאֱמָנוֹת / נֶאֱמָנִים
  choice: टिके रहने वाली / टिके रहने वाले
  rationale: אמן से बने इन रूपों का यहाँ अर्थ दृढ़, स्थायी या निरंतर बना रहने वाला है। दोनों प्रयोगों में एक ही अभिव्यक्ति रखकर इब्रानी पुनरावृत्ति सुरक्षित की गई है।
- source_word: חֳלָיִם
  choice: रोग
  rationale: यह बहुवचन संज्ञा रोगों या बीमारियों को दर्शाती है। हिंदी में ‘रोग’ रूप संदर्भानुसार सामूहिक बहुवचन अर्थ देता है।
- source_word: רָעִים
  choice: भयंकर
  rationale: रोगों के संदर्भ में मूल विशेषण का भाव बुरा, हानिकारक या घोर है; ‘भयंकर’ उसकी गंभीरता को सहज आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: वाचा के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में उपस्थित परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- issue: न्याय के संदर्भ में פלא का बल
  choice: असाधारण बना देगा
  alternative: चकित कर देने वाला बना देगा
  rationale: क्रिया विलक्षण या विस्मयकारी बनाने का अर्थ रखती है, किंतु यहाँ उसका संदर्भ दंड है। चुना हुआ रूप उसकी तीव्रता बनाए रखता है और सकारात्मक ‘अद्भुत’ का भ्रामक भाव नहीं देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुम्हारी विपत्तियाँ’ की अपेक्षा ‘तुम पर ... पड़ने वाली विपत्तियाँ’ हिंदी में अधिक स्पष्ट है। स्रोत की समानांतर रचना और ‘टिके रहने’ की पुनरावृत्ति सुरक्षित रखी गई है।
