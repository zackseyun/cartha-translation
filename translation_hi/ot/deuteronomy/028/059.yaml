- from: तब याहवे तुम पर और तुम्हारे वंश पर पड़ने वाली विपत्तियों को असाधारण[a] बना देगा—बड़ी-बड़ी और टिके रहने वाली[b] विपत्तियाँ, और भयंकर तथा टिके रहने वाले रोग।
  to: तब याहवे तुम्हारी और तुम्हारे वंशजों की विपत्तियों को असाधारण[a] कर देगा—बड़ी और स्थायी[b] विपत्तियाँ, और भयंकर तथा स्थायी रोग।
  rationale: Revision improves idiomatic Hindi and clarifies that the reference is to descendants, not merely a lineage. It also uses the concise, register-appropriate ‘स्थायी’ consistently for the repeated Hebrew descriptor. The source’s parallelism, severity, and lexical ambiguity are retained.
