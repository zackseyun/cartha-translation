source:
  edition: WLC
  text: בָּר֧וּךְ פְּרִֽי בִטְנְ/ךָ֛ וּ/פְרִ֥י אַדְמָתְ/ךָ֖ וּ/פְרִ֣י בְהֶמְתֶּ֑/ךָ שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּר֥וֹת צֹאנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/004.yaml
  text: Blessed shall be the fruit of your womb[a], and the fruit of your ground, and the fruit of your livestock—the offspring of your herds and the young of your flocks.
translation:
  language: hi
  text: तुम्हारी कोख का फल, तुम्हारी भूमि की उपज और तुम्हारे पशुओं की संतान—तुम्हारे गाय-बैलों की संतान और तुम्हारी भेड़-बकरियों के बच्चे—आशीषित होंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम दो पदों का अनुवाद यह भी हो सकता है: “तुम्हारे मवेशियों की बढ़ोतरी और तुम्हारे झुंड की संतान।” इब्रानी पदबंध שְׁגַר אֲלָפֶיךָ और עַשְׁתְּרֹת צֹאנֶךָ पशुधन की प्रजनन-वृद्धि के पारंपरिक शब्द हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: आशीषित होंगे
  rationale: वाचा की आशीषों के इस प्रसंग में यह विधेय विशेषण भविष्यसूचक/परिणामसूचक भाव रखता है। वाक्य के अंत में बहुवचन रूप हिंदी में सभी समानांतर पदों पर स्वाभाविक रूप से लागू होता है।
- source_word: פְּרִי
  choice: फल / उपज / संतान
  rationale: हिब्रू में एक ही शब्द तीन बार आकर कोख, भूमि और पशुओं को जोड़ता है। हिंदी में हर स्थान पर ‘फल’ कहना भूमि के साथ तो स्वाभाविक है, पर पशुओं के साथ असहज; इसलिए अर्थानुसार स्वाभाविक शब्द चुने गए, जबकि त्रिक समानांतरता बनाए रखी गई।
- source_word: בִטְנְךָ
  choice: तुम्हारी कोख
  rationale: इस प्रसंग में בטן संतान उत्पन्न करने वाली कोख को दर्शाता है। ‘कोख’ आधुनिक हिंदी में ठोस, सहज और गरिमापूर्ण है।
- source_word: אַדְמָתְךָ
  choice: तुम्हारी भूमि
  rationale: यह खेती की जमीन/मिट्टी को सूचित करता है। ‘भूमि की उपज’ हिंदी में कृषि-संदर्भ का स्वाभाविक पदबंध है और क्षेत्रीय राष्ट्र-भूमि का अनावश्यक विस्तार नहीं करता।
- source_word: בְהֶמְתֶּךָ
  choice: तुम्हारे पशु
  rationale: यह पालतू पशुधन के लिए व्यापक शब्द है। ‘पशु’ सामान्य पाठक के लिए स्पष्ट है; आगे गाय-बैल और भेड़-बकरियाँ इसका स्पष्टीकरण देते हैं।
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: तुम्हारे गाय-बैलों की संतान
  rationale: שׁגר पशुओं से उत्पन्न संतति को और אֲלָפִים बड़े मवेशियों को दर्शाता है। ‘गाय-बैल’ वर्ग को स्पष्ट करता है, जबकि ‘संतान’ प्रजनन-वृद्धि का अर्थ रखता है।
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: तुम्हारी भेड़-बकरियों के बच्चे
  rationale: यह पारंपरिक पशुधन-पदबंध छोटे झुंड-पशुओं की वृद्धि/बच्चों को सूचित करता है। צאן में भेड़ और बकरियाँ दोनों सम्मिलित हो सकती हैं, इसलिए दोनों का उल्लेख किया गया है।
