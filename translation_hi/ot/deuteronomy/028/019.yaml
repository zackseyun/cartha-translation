  yaml_path: translation/ot/deuteronomy/028/019.yaml
  text: Cursed shall you be when you come in[a], and cursed shall you be when you go out.
translation:
  language: hi
  text: तेरे आने पर तू शापित होगा, और तेरे जाने पर तू शापित होगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तेरे आने में ... तेरे जाने में”; यह एक इब्रानी मुहावरा है, जो दैनिक जीवन के पूरे क्रम को समेटता है।
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: शापित
  rationale: यह निष्क्रिय कृदन्त/विशेषण covenantal curse की अवस्था व्यक्त करता है। ‘शापित’ आधुनिक मानक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: אַתָּה
  choice: तू
  rationale: इब्रानी में द्वितीय पुरुष पुल्लिंग एकवचन है। यहाँ इस्राएल को सामूहिक रूप से एकवचन में सीधे संबोधित किया गया है; ‘तू’ उस व्याकरणिक रूप और व्यवस्थाविवरण की वाचा-संबंधी संबोधन-शैली को बनाए रखता है।
- source_word: בְּבֹאֶךָ
  choice: तेरे भीतर आने पर
  rationale: בְּ + בוא के infinitive construct और 2ms प्रत्यय का शाब्दिक अर्थ ‘तेरे भीतर आने में/पर’ है। ‘भीतर आने पर’ स्थानगत दिशा को बनाए रखते हुए हिन्दी में स्पष्ट है।
- source_word: וְ
  choice: और
  rationale: दो समानान्तर खंडों को जोड़ने वाला सामान्य समुच्चयबोधक।
- source_word: בְּצֵאתֶךָ
  choice: तेरे बाहर जाने पर
  rationale: בְּ + יצא के infinitive construct और 2ms प्रत्यय का अर्थ ‘तेरे बाहर जाने में/पर’ है। यह पहले खंड के साथ समानान्तरता और पूरे जीवन-व्यवहार को समेटने वाले मुहावरे को बनाए रखता है।
theological_decisions:
- issue: वाचा के शाप-सूत्र की गंभीरता और इब्रानी के आरंभिक बलाघात को हिन्दी में रखना
  choice: तेरे भीतर आने पर तू शापित होगा, और तेरे बाहर जाने पर तू शापित होगा।
  alternative: जब तू भीतर आएगा, तब शापित होगा; और जब तू बाहर जाएगा, तब शापित होगा।
  rationale: हर खंड में ‘शापित’ का स्पष्ट पुनरावर्तन मूल की औपचारिक समानान्तरता और वाचा-संबंधी गंभीरता को बनाए रखता है। हिन्दी वाक्यक्रम को इतना स्वाभाविक रखा गया है कि भाषा कृत्रिम न लगे।
translation_notes:
  register: आधुनिक मानक हिन्दी, किंतु वाचा-संबंधी घोषणा की गरिमा बनाए रखने वाला संबोधन। ‘तू/तेरे’ मूल के एकवचन प्रत्यक्ष संबोधन को दर्शाता है; इसे अनादर सूचक अर्थ में नहीं लिया जाना चाहिए।
