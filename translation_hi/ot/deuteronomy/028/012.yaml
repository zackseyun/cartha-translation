source:
  edition: WLC
  text: יִפְתַּ֣ח יְהוָ֣ה לְ֠/ךָ אֶת אוֹצָר֨/וֹ הַ/טּ֜וֹב אֶת הַ/שָּׁמַ֗יִם לָ/תֵ֤ת מְטַֽר אַרְצְ/ךָ֙ בְּ/עִתּ֔/וֹ וּ/לְ/בָרֵ֕ךְ אֵ֖ת כָּל מַעֲשֵׂ֣ה יָדֶ֑/ךָ וְ/הִלְוִ֨יתָ֙ גּוֹיִ֣ם רַבִּ֔ים וְ/אַתָּ֖ה לֹ֥א תִלְוֶֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/012.yaml
  text: Yahweh will open to you his good storehouse[a], the heavens, to give the rain of your land in its season and to bless all the work of your hand. You will lend to many nations, but you will not borrow.
translation:
  language: hi
  text: याहवे तुम्हारे लिए अपना उत्तम भंडार, अर्थात् आकाश, खोल देगा, ताकि तुम्हारे देश को ठीक समय पर वर्षा दे और तुम्हारे हाथ के हर काम को आशीष दे। तुम बहुत-से राष्ट्रों को उधार दोगे, पर स्वयं उधार नहीं लोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִפְתַּח
  choice: खोल देगा
  rationale: आशीषों के इस प्रसंग में क़ाल अपूर्ण क्रिया का भावी अर्थ है; यह ठोस रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी वाचा-नाम को सामान्य उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित विद्वतापूर्ण उच्चारण के निकट प्रस्तुत किया गया है।
- source_word: אוֹצָרוֹ הַטּוֹב
  choice: अपना उत्तम भंडार
  rationale: אוֹצָר का अर्थ भंडार या कोष हो सकता है। वर्षा और कृषि के प्रसंग में ‘भंडार’ ठोस और सहज है; הַטּוֹב को ‘उत्तम’ के रूप में स्पष्ट रखा गया है।
- source_word: הַשָּׁמַיִם
  choice: अर्थात् आकाश
  rationale: यह पद पिछले ‘भंडार’ की समानाधिकरण रूप में पहचान कराता है। हिन्दी में ‘आकाश’ वर्षा के प्रसंग में स्वाभाविक है और इब्रानी बहुवचन-रूप को कृत्रिम ढंग से दोहराता नहीं।
- source_word: לָתֵת מְטַר אַרְצְךָ בְּעִתּוֹ
  choice: तुम्हारे देश पर ठीक समय में वर्षा करे
  rationale: शाब्दिक सम्बन्ध ‘तुम्हारे देश की वर्षा’ हिन्दी में अस्वाभाविक हो सकता है; यह रूप देश को मिलने वाली समयोचित वर्षा का मूल अर्थ स्पष्ट रखता है।
- source_word: כָּל מַעֲשֵׂה יָדֶךָ
  choice: तुम्हारे हाथ के हर काम
  rationale: इब्रानी के एकवचन ‘हाथ’ और मनुष्य के परिश्रम को व्यक्त करने वाले उसके ठोस मुहावरे को सुरक्षित रखा गया है।
- source_word: וְהִלְוִיתָ גּוֹיִם רַבִּים
  choice: तुम बहुत-से राष्ट्रों को उधार दोगे
  rationale: हिफ़िल रूप का अर्थ यहाँ उधार देना है। राष्ट्रीय वाचा-संदर्भ में גּוֹיִם के लिए ‘राष्ट्र’ स्पष्ट है और ‘जाति’ से उत्पन्न आधुनिक सामाजिक अस्पष्टता से बचता है।
- source_word: וְאַתָּה לֹא תִלְוֶה
  choice: पर स्वयं उधार नहीं लोगे
  rationale: क़ाल रूप का अर्थ उधार लेना है। ‘पर’ दोनों स्थितियों का विरोध और ‘स्वयं’ इब्रानी के उभरे हुए וְאַתָּה का बल स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ सीधे चतुरक्षरी वाचा-नाम का प्रयोग करता है। ‘याहवे’ नाम को उपाधि में बदले बिना उसका भेद बनाए रखता है; ‘यहोवा’ पारंपरिक विकल्प है, जबकि ‘प्रभु’ मूल में उपस्थित नाम को छिपा देता है।
- issue: भंडार और आकाश का सम्बन्ध
  choice: आकाश को उत्तम भंडार की समानाधिकरण पहचान माना गया है
  alternative: आकाश को भंडार से अलग दूसरी कर्म-संज्ञा मानना
  rationale: אֶת אוֹצָרוֹ הַטּוֹב אֶת הַשָּׁמַיִם में दूसरा पद पहले को स्पष्ट करता है; इसी कारण ‘अर्थात्’ लगाया गया है, बिना किसी अलग दैवी कोष की कल्पना जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण रूप अपनाया गया है। एकवचन संबोधन ‘तुम्हारे/तुम’ से सामूहिक इस्राएल को संबोधित मूल पाठ का रूप बना रहता है। ‘आशीष’ बाइबलीय हिन्दी में परिचित है, जबकि वाक्य-विन्यास को आज के पाठक के लिए सहज रखा गया है।
