id: DEU.28.49
reference: Deuteronomy 28:49
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יִשָּׂ֣א יְהוָה֩ עָלֶ֨י/ךָ גּ֤וֹי מֵ/רָחוֹק֙ מִ/קְצֵ֣ה הָ/אָ֔רֶץ כַּ/אֲשֶׁ֥ר יִדְאֶ֖ה הַ/נָּ֑שֶׁר גּ֕וֹי אֲשֶׁ֥ר לֹא תִשְׁמַ֖ע לְשֹׁנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/049.yaml
  text: Yahweh will raise up against you a nation from far away[a], from the end of the earth[b], as the eagle swoops down—a nation whose language you will not understand.
translation:
  language: hi
  text: याहवे तेरे विरुद्ध बहुत दूर से, पृथ्वी के छोर से, एक राष्ट्र को ले आएगा। वह उकाब[a] की तरह झपटता हुआ आएगा—एक ऐसा राष्ट्र जिसकी भाषा तू नहीं समझेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ ‘उकाब’ या ‘गिद्ध’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जिसकी जीभ तू नहीं सुनेगा”; आशय है कि तू उसकी भाषा नहीं समझेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא ... עָלֶיךָ
  choice: तेरे विरुद्ध ... ले आएगा
  rationale: नשא का मूल अर्थ ‘उठाना/ले जाना’ है, पर עַל के साथ इस प्रसंग में यह किसी राष्ट्र को आक्रमण के लिए किसी के विरुद्ध लाने को व्यक्त करता है। ‘ले आएगा’ आधुनिक हिन्दी में स्वाभाविक है और याहवे की सक्रिय भूमिका बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: גּוֹי
  choice: राष्ट्र
  rationale: यहाँ शब्द एक दूरस्थ विदेशी राजनीतिक-सैन्य समुदाय को दर्शाता है; ‘राष्ट्र’ प्रसंग के अनुकूल है।
- source_word: מֵרָחוֹק מִקְצֵה הָאָרֶץ
  choice: बहुत दूर से, पृथ्वी के छोर से
  rationale: दोनों दूरत्व-सूचक पदों को बनाए रखा गया है। ‘पृथ्वी के छोर’ अत्यधिक दूरी का चित्रात्मक मुहावरा है।
- source_word: כַּאֲשֶׁר יִדְאֶה הַנָּשֶׁר
  choice: उकाब की तरह झपटता हुआ आएगा
  rationale: דאה तेज उड़ान या झपटने की गति बताता है। ‘झपटता हुआ’ गति और आक्रमणकारी भय दोनों व्यक्त करता है; נשר की पक्षी-पहचान की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: לֹא תִשְׁמַע לְשֹׁנוֹ
  choice: जिसकी भाषा तू नहीं समझेगा
  rationale: शाब्दिक रूप ‘उसकी जीभ नहीं सुनेगा’ है, पर שמע और לשון का संयुक्त आशय उस राष्ट्र की बोली न समझ पाना है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है; इसलिए उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: आने वाले राष्ट्र के पीछे ईश्वरीय कर्तृत्व
  choice: याहवे ... राष्ट्र को ले आएगा
  alternative: एक राष्ट्र तेरे विरुद्ध आएगा
  rationale: इब्रानी वाक्य याहवे को क्रिया का स्पष्ट कर्ता बनाता है। अनुवाद इस तनावपूर्ण कथन को नरम किए बिना बनाए रखता है।
translation_notes:
  register: एकवचन सम्बोधन के लिए ‘तेरे/तू’ रखा गया है, क्योंकि मूल में इस्राएल को एक सामूहिक इकाई के रूप में एकवचन में सम्बोधित किया गया है। भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है; ‘पृथ्वी के छोर’ मूल की चित्रात्मक अभिव्यक्ति को सुरक्षित रखता है।
