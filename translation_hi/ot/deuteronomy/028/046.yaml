base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/046.yaml
  text: And they will be on you and on your offspring as a sign and a wonder forever[a][b].
translation:
  language: hi
  text: और वे[b] तुम पर और तुम्हारे वंश[a] पर सदा के लिए चिह्न और आश्चर्य होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारी संतानों पर’; इब्रानी शब्द ‘बीज’ सामूहिक रूप से किसी की संतान या भावी पीढ़ियों को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘वे’ से आशय आस-पास के प्रसंग में बताए गए शापों से है।
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיוּ
  choice: और वे ... बने रहेंगे
  rationale: संयोजक सहित क्रिया यहाँ पहले बताई गई शाप-संबंधी भावी परिणति को आगे बढ़ाती है। ‘बने रहेंगे’ चिह्न के रूप में उनके टिके रहने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְךָ
  choice: तुम पर
  rationale: पूर्ववर्ती शापों के संबोधन पर आ पड़ने और उससे जुड़े रहने का भाव व्यक्त करता है।
- source_word: לְאוֹת
  choice: एक चिह्न
  rationale: אוֹת का सामान्य अर्थ पहचान कराने वाला चिह्न या संकेत है; ‘चिह्न’ गरिमापूर्ण और सुबोध है।
- source_word: וּלְמוֹפֵת
  choice: और एक अद्भुत चिन्ह
  rationale: מוֹפֵת विस्मयकारी चिन्ह, चमत्कार या शकुन का अर्थ दे सकता है। ‘अद्भुत चिन्ह’ यहाँ אוֹת से भेद बनाए रखता है और अनावश्यक रूप से अशुभ शकुन का अर्थ नहीं थोपता।
- source_word: וּבְזַרְעֲךָ
  choice: और तुम्हारे वंश पर
  rationale: זֶרַע सामूहिक रूप से संतान अथवा भावी वंश को दर्शाता है। ‘वंश’ इस पीढ़ीगत और सामूहिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; दोहराए गए בְּ को ‘पर’ से स्पष्ट रखा गया है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: यह वाक्यांश दीर्घस्थायी अथवा निरंतर अवधि बताता है। ‘सदा के लिए’ उसका सामान्य हिन्दी समतुल्य है, बिना उसकी अवधि पर पाठ से आगे कोई दार्शनिक निष्कर्ष जोड़े।
theological_decisions:
- issue: ‘वे’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘वे’ रखा गया है; संदर्भ के अनुसार यह पहले बताए गए शापों की ओर संकेत करता है।
  alternative: मुख्य पाठ में ‘ये शाप’ स्पष्ट कर देना।
  rationale: इब्रानी पद में कर्ता संज्ञा के रूप में दोहराया नहीं गया। सर्वनाम बनाए रखने से मूल की अभिव्यक्ति सुरक्षित रहती है, जबकि पादटिप्पणी संदर्भ स्पष्ट करती है।
- issue: עַד עוֹלָם की अवधि
  choice: ‘सदा के लिए’
  alternative: ‘सभी पीढ़ियों तक’ या ‘निरंतर’
  rationale: इब्रानी अभिव्यक्ति वाचा-संबंधी प्रसंग में स्थायी निरंतरता दर्शाती है। सामान्य समतुल्य रखा गया है, पर इसे पाठ से परे आध्यात्मिक या दार्शनिक अनंतता की व्याख्या नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सर्वसुलभ रूप अपनाया गया है। ‘अद्भुत चिन्ह’ ने पारंपरिक ‘चिह्न और चमत्कार’ जैसी संभावित रूप से घटना-केंद्रित अभिव्यक्ति के बजाय यहाँ शापों के विस्मयकारी प्रमाण/निशान होने का भाव रखा है।
