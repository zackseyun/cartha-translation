  rationale: क्रिया को ‘होंगे’ किया गया है ताकि मूल के साधारण भावी कथन को बिना अतिरिक्त निरंतरता के व्यक्त किया जाए। ‘अद्भुत चिन्ह’ के स्थान पर ‘आश्चर्य’ रखा गया है, जिससे ‘चिह्न और आश्चर्य’ मूल के אוֹת וּלְמוֹפֵת का स्वाभाविक और भेद बनाए रखने वाला समतुल्य बनता है। पादटिप्पणी-चिह्नों को उनके संबंधित शब्दों के निकट रखा गया है।
