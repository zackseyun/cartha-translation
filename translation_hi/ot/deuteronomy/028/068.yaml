  text: וֶֽ/הֱשִֽׁיבְ/ךָ֨ יְהוָ֥ה מִצְרַיִם֮ בָּ/אֳנִיּוֹת֒ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אָמַ֣רְתִּֽי לְ/ךָ֔ לֹא תֹסִ֥יף ע֖וֹד לִ/רְאֹתָ֑/הּ וְ/הִתְמַכַּרְתֶּ֨ם שָׁ֧ם לְ/אֹיְבֶ֛י/ךָ לַ/עֲבָדִ֥ים וְ/לִ/שְׁפָח֖וֹת וְ/אֵ֥ין קֹנֶֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/068.yaml
  text: And Yahweh will bring you back to Egypt in ships[a], by the way of which I said to you, ‘You shall never see it again.’ And there you will offer yourselves for sale to your enemies as male servants and female servants, but there will be no buyer.
translation:
  language: hi
  text: और याहवे तुम्हें जहाज़ों से मिस्र वापस ले जाएगा, उस मार्ग से जिसके विषय में मैंने तुमसे कहा था, ‘तुम उसे फिर कभी नहीं देखोगे।’ वहाँ तुम अपने शत्रुओं के पास दासों और दासियों के रूप में बिकने के लिए अपने आप को पेश करोगे,[a] लेकिन कोई तुम्हें खरीदेगा नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वहाँ तुम अपने शत्रुओं के हाथ दासों और दासियों के रूप में बेच दिए जाओगे।” इब्रानी क्रिया को आत्मवाचक (“बिकने के लिए अपने आप को पेश करना”) अथवा अधिक व्यापक रूप से दासता में पड़ने के अर्थ में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱשִׁיבְךָ
  choice: तुम्हें ... वापस ले जाएगा
  rationale: שוב का हिफ़ील रूप कारणवाचक है; यहोवा लोगों को लौटाता है। ‘वापस ले जाएगा’ स्वाभाविक हिन्दी में इस कारणवाचक अर्थ को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम के प्रचलित हिन्दी लिप्यंतरण को रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: מִצְרַיִם
  choice: मिस्र
  rationale: स्थान-नाम का मानक हिन्दी रूप।
- source_word: בָּאֳנִיּוֹת
  choice: जहाज़ों से
  rationale: ב साधन/यातायात का माध्यम दर्शाता है; आधुनिक हिन्दी में ‘जहाज़ों से’ स्वाभाविक है।
- source_word: בַּדֶּרֶךְ
  choice: उस मार्ग से
  rationale: דרך यहाँ लौटने के मार्ग को सूचित करता है; संकेतवाचक ‘उस’ अगले संबंधवाचक उपवाक्य से इसे सहजता से जोड़ता है।
- source_word: אֲשֶׁר אָמַרְתִּי לְךָ
  choice: जिसके विषय में मैंने तुमसे कहा था
  rationale: यह वाक्यांश ‘मार्ग’ को पहले कही गई बात से जोड़ता है और मूल संबंधवाचक रचना को स्पष्ट हिन्दी में रखता है।
- source_word: לֹא תֹסִיף עוֹד לִרְאֹתָהּ
  choice: तुम उसे फिर कभी नहीं देखोगे
  rationale: יסף और עוד का संयुक्त मुहावरा कार्य के दोबारा न होने पर बल देता है; ‘फिर कभी नहीं’ उसका स्वाभाविक समतुल्य है।
- source_word: וְהִתְמַכַּרְתֶּם
  choice: अपने आप को बेचने को रखोगे
  rationale: हित्पाएल रूप के आत्मवाचक/मध्यवाचक भाव को सुरक्षित रखते हुए यह वाक्यांश बिक्री की पेशकश दर्शाता है, पूर्ण बिक्री नहीं—क्योंकि आगे कोई खरीदार न होने की बात है।
- source_word: לְאֹיְבֶיךָ
  choice: अपने शत्रुओं के हाथ
  rationale: लामेद उस पक्ष को इंगित करता है जिसके अधीन दासता के लिए लोग स्वयं को प्रस्तुत करेंगे; हिन्दी में ‘के हाथ’ इस संबंध को सहजता से व्यक्त करता है।
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: दास और दासियाँ बनने के लिए
  rationale: मूल के पुरुष और स्त्री दासों के युग्म को स्पष्ट, संक्षिप्त और समकालीन हिन्दी में सुरक्षित रखा गया है।
- source_word: וְאֵין קֹנֶה
  choice: लेकिन कोई तुम्हें खरीदेगा नहीं
  rationale: शाब्दिक अर्थ ‘कोई खरीदार नहीं’ है; क्रियात्मक हिन्दी संदर्भ को स्पष्ट करती है और बिक्री की आर्थिक छवि बनाए रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को उपाधि ‘प्रभु’ के स्थान पर रखा गया है, जिससे व्यक्तिगत नाम बना रहता है।
- issue: וְהִתְמַכַּרְתֶּם का आत्मवाचक अथवा व्यापक मध्य/निष्क्रिय अर्थ
  choice: अपने आप को बेचने को रखोगे
  alternative: तुम वहाँ अपने शत्रुओं के हाथ दास-दासियों के रूप में बेच दिए जाओगे
  rationale: हित्पाएल आत्मवाचक अर्थ की अनुमति देता है, पर व्यापक रूप से दासता में पड़ने का भाव भी संभव है। मुख्य पाठ आत्मवाचकता और असफल बिक्री दोनों को सुसंगत रखता है; विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। एकवचन सामूहिक ‘तुम’ को पूरे पद में बनाए रखा गया है। ‘दास और दासियाँ’ मूल के लैंगिक युग्म और कठोर सामाजिक वास्तविकता को स्पष्ट रखता है।
