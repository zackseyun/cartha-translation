base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/060.yaml
  text: And he will bring back upon you all the diseases of Egypt that you dreaded[c][b][a], and they will cling to you.
translation:
  language: hi
  text: और वह मिस्र के सभी रोग[a] फिर से तुम पर ले आएगा, जिनसे तुम डरते थे[b]; और वे तुमसे चिपके रहेंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिस्र की सभी बीमारियाँ।”
    reason: lexical_alternative
  - marker: b
    text: या, “जिनसे तुम भयभीत थे।”
    reason: lexical_alternative
  - marker: c
    text: या, “और वे तुमसे लगे रहेंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: फिर से ले आएगा
  rationale: שׁוב के हिफ़ील रूप का कारक भाव है—‘वापस लाना’ या ‘फिर से ले आना।’ शापों के इस प्रसंग में यह पूर्वकालीन रोगों को फिर से व्यक्ति पर लाने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּךָ
  choice: तुम पर
  rationale: रोग लाने के संदर्भ में בְּךָ का स्वाभाविक हिन्दी रूप ‘तुम पर’ है, जो विपत्ति के आरोपित होने का भाव देता है।
- source_word: כָּל מַדְוֵה מִצְרַיִם
  choice: मिस्र के वे सब रोग
  rationale: מַדְוֶה बीमारी या रोग को दर्शाता है। सामूहिक एकवचन को हिन्दी में ‘सब रोग’ कहना अर्थ और सहजता दोनों बनाए रखता है; ‘वे’ आगे आने वाले संबंधवाचक उपवाक्य से इसे जोड़ता है।
- source_word: אֲשֶׁר יָגֹרְתָּ מִפְּנֵיהֶם
  choice: जिनसे तुम भय खाते थे
  rationale: יגר भयभीत होने या दहशत खाने का भाव रखता है। ‘भय खाते थे’ आधुनिक, गरिमापूर्ण हिन्दी में उस भाव को स्पष्ट रखता है और बहुवचन प्रत्यय को रोगों से जोड़ता है।
- source_word: וְדָבְקוּ בָּךְ
  choice: और वे तुमसे चिपके रहेंगे
  rationale: דבק का अर्थ चिपकना, लगे रहना या लिपटे रहना है। ‘चिपके रहेंगे’ रोगों के लगातार बने रहने की सजीव छवि को सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। एकवचन सामूहिक संज्ञा מַדְוֵה को प्रसंगानुसार बहुवचन ‘रोग’ से व्यक्त किया गया है, इसलिए आगे बहुवचन ‘वे’ रखा गया है। वाक्य की चेतावनीपूर्ण गंभीरता और रोगों के स्थायी रूप से चिपक जाने की मूल छवि बनाए रखी गई है।
