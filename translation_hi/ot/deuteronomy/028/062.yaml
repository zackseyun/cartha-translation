source:
  edition: WLC
  text: וְ/נִשְׁאַרְתֶּם֙ בִּ/מְתֵ֣י מְעָ֔ט תַּ֚חַת אֲשֶׁ֣ר הֱיִיתֶ֔ם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹ֑ב כִּי לֹ֣א שָׁמַ֔עְתָּ בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/062.yaml
  text: And you will be left few in number[a], though you had become as numerous as the stars of the heavens[c][b], because you did not listen to the voice of Yahweh your God.
translation:
  language: hi
  text: और तुम गिनती में बहुत थोड़े बचे रह जाओगे[a], हालाँकि तुम आकाश के तारों के समान बहुत हो गए थे[b], क्योंकि तुमने याहवे, अपने परमेश्वर की वाणी नहीं सुनी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘थोड़े लोग’ है; यह बहुत कम संख्या में रह जाने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘जबकि तुम आकाश के तारों के समान बहुत हो गए थे’ भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: ‘वाणी सुनना’ वाचा-संबंधी अभिव्यक्ति है, जिसमें ‘आज्ञा मानना’ भी निहित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁאַרְתֶּם
  choice: रह जाओगे
  rationale: निफ़अल रूप हानि और न्याय के बाद बचे रह जाने की परिणामी अवस्था बताता है; ‘रह जाओगे’ आधुनिक हिन्दी में स्वाभाविक रूप से यह भाव व्यक्त करता है।
- source_word: בִּמְתֵי מְעָט
  choice: गिनती में बहुत थोड़े
  rationale: यह मुहावरा पुरुषों तक सीमित नहीं, बल्कि संख्या के अत्यन्त कम हो जाने को व्यक्त करता है।
- source_word: תַּחַת אֲשֶׁר
  choice: हालाँकि
  rationale: यहाँ वाक्यांश पहले की बहुतायत और आने वाली अल्पता के बीच विरोधसूचक, रियायती संबंध व्यक्त करता है।
- source_word: הֱיִיתֶם ... כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: तुम आकाश के तारों जितनी बड़ी संख्या में हो गए थे
  rationale: यह अनुवाद प्राप्त हो चुकी बहुसंख्या और तारों वाली वाचा-संबंधी उपमा, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: क्योंकि तुमने ... की वाणी नहीं सुनी
  rationale: ‘वाणी सुनना’ मूल की शब्द-छवि और व्यवस्थाविवरण की वाचा-संबंधी भाषा को सुरक्षित रखता है, जबकि प्रसंग में आज्ञा न मानने का निहितार्थ भी बना रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: यह प्रचलित वाचा-संबंधी संबोधन है; ‘अपने’ हिन्दी में संबोधित समुदाय और उसके परमेश्वर के संबंध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: बहुवचन संबोधन से सामूहिक एकवचन की ओर इब्रानी बदलाव
  choice: हिन्दी के स्वाभाविक ‘तुम’ संबोधन को बनाए रखा
  alternative: संख्या-परिवर्तन को व्याख्यात्मक शब्दों से स्पष्ट करना
  rationale: इब्रानी में पहले बहुवचन और फिर שָׁמַעְתָּ में सामूहिक एकवचन है। हिन्दी ‘तुम’ समुदाय को सामूहिक रूप से संबोधित कर सकता है; अतिरिक्त शब्द जोड़ना मूल से अधिक व्याख्या करता।
- issue: ‘वाणी सुनना’ और ‘आज्ञा मानना’ का संबंध
  choice: वाणी नहीं सुनी
  alternative: आज्ञा नहीं मानी
  rationale: שׁמע בקול में आज्ञापालन का स्पष्ट निहितार्थ है, पर मूल की श्रवण-वाणी वाली वाचा-संबंधी छवि को बनाए रखने से अर्थगत तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गिनती में बहुत थोड़े’ मूल मुहावरे का संख्यात्मक बल स्पष्ट करता है; ‘वाणी नहीं सुनी’ मूल की धार्मिक-वाचा संबंधी शब्दावली को बिना समतल किए सुरक्षित रखता है।
