base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/022.yaml
  text: Yahweh will strike you with wasting disease[a], with fever, with inflammation, with burning heat, with the sword, with blight, and with mildew[b]; and they will pursue you until you perish.
translation:
  language: hi
  text: याहवे तुम्हें क्षीण कर देनेवाली बीमारी[a], ज्वर, सूजन, झुलसा देनेवाली गर्मी, तलवार, फसल के झुलसने और फफूँदी से प्रहार करेगा; और ये सब[b] तुम्हारा पीछा करते रहेंगे, जब तक कि तुम नष्ट न हो जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘क्षय करनेवाली बीमारी’; इब्रानी शब्द ऐसी दुर्बलकारी बीमारी को दर्शाता है जिससे शरीर क्षीण होता जाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘और वे तुम्हारा पीछा करेंगे’; इब्रानी क्रिया बहुवचन है और ऊपर बताई गई विपत्तियों तथा आपदाओं की ओर संकेत करती है।
    reason: grammatical_clarification
lexical_decisions:
- source_word: יַכְּכָה
  choice: तुम्हें … से मारेंगे
  rationale: नכה के हिफ़ील रूप का सीधा दंडात्मक अर्थ ‘मारना/प्रहार करना’ है। हिंदी वाक्य में साधनों की सूची को स्वाभाविक ढंग से समेटने के लिए क्रिया सूची के अंत में रखी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: שַׁחֶפֶת
  choice: क्षीण कर देनेवाली बीमारी
  rationale: यह दुर्बल और क्षीण कर देनेवाले रोग को सूचित करता है; ‘तपेदिक’ अनावश्यक रूप से चिकित्सकीय अर्थ को सीमित कर देगा।
- source_word: קַדַּחַת
  choice: ज्वर
  rationale: यह ज्वरयुक्त बीमारी का स्पष्ट और प्रचलित हिंदी पर्याय है।
- source_word: דַלֶּקֶת
  choice: सूजन
  rationale: शब्द जलन या प्रदाह से संबंधित है; साधारण पाठक के लिए ‘सूजन’ स्वाभाविक है और निकटवर्ती ज्वर तथा गर्मी से अलग अर्थ रखता है।
- source_word: חַרְחֻר
  choice: झुलसा देनेवाली गर्मी
  rationale: यह दुर्लभ शब्द संभवतः तीखी, दहकती गर्मी या जलानेवाले ज्वर का बोध कराता है; अनिश्चितता को किसी खास रोग में सीमित नहीं किया गया।
- source_word: חֶרֶב
  choice: तलवार
  rationale: मूल अर्थ ‘तलवार’ है और संदर्भ में हिंसक मृत्यु अथवा युद्ध तक व्यापक हो सकता है; मूर्त शब्द को बनाए रखा गया है।
- source_word: שִׁדָּפוֹן
  choice: फसल का झुलसना
  rationale: यह झुलसानेवाली दशाओं से फसल के नष्ट होने को सूचित करता है; हिंदी में वर्णनात्मक रूप अधिक स्पष्ट है।
- source_word: יֵרָקוֹן
  choice: फफूँदी
  rationale: कृषि-संदर्भ में यह वनस्पति को लगनेवाली फफूँदी अथवा पीलेपन के रोग को दर्शाता है; ‘फफूँदी’ पाठ में स्वाभाविक और संदर्भानुकूल है।
- source_word: וּרְדָפוּךָ
  choice: और ये सब तुम्हारा पीछा करते रहेंगे
  rationale: इब्रानी क्रिया बहुवचन है और पहले गिनाई गई विपत्तियों की ओर लौटती है; ‘ये सब’ उस व्याकरणिक संबंध को स्पष्ट करता है।
- source_word: עַד אָבְדֶךָ
  choice: जब तक कि तुम नष्ट न हो जाओ
  rationale: אבד यहाँ विनाश या मिट जाने तक पहुँचने का अर्थ देता है; सीधा द्वितीय-पुरुष संबोधन सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का सीधे प्रयोग करता है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: विपत्तियों का पीछा करना
  choice: बहुवचन ‘ये सब … पीछा करते रहेंगे’
  alternative: एकवचन या भाववाचक ‘वह तुम्हारा पीछा करेगी’
  rationale: मूल की बहुवचन क्रिया विपत्तियों और आपदाओं को कर्ता के रूप में प्रस्तुत करती है; इस सजीव और दंडात्मक चित्र को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। रोगों और कृषि-विपत्तियों की सूची में अनावश्यक चिकित्सकीय या वनस्पति-विज्ञान संबंधी विशिष्टता से बचते हुए मूल की पुनरावृत्ति और तीव्रता सुरक्षित रखी गई है।
