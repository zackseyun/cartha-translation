base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/040.yaml
  text: You will have olive trees throughout all your territory[a], but you will not anoint yourself with oil, because your olives will fall off.
translation:
  language: hi
  text: तेरे सारे प्रदेश में जैतून के पेड़ होंगे, पर तू अपने शरीर पर तेल नहीं लगाएगा, क्योंकि तेरे जैतून के फल झड़ जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֵיתִים
  choice: जैतून के पेड़
  rationale: संज्ञा फल या पेड़ दोनों को सूचित कर सकती है; पूरे क्षेत्र में उनके होने का कथन यहाँ पेड़ों की ओर संकेत करता है।
- source_word: יִהְיוּ לְךָ
  choice: होंगे
  rationale: हिन्दी में संबंधसूचक 'तेरे' के साथ यह अधिकार/उपलब्धता के इब्रानी मुहावरे को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּכָל גְּבוּלֶךָ
  choice: तेरे सारे क्षेत्र में
  rationale: גְּבוּל सीमा के साथ-साथ सीमाओं के भीतर के भूभाग को भी दर्शाता है; इस संदर्भ में 'क्षेत्र' पूरे देश-भाग का स्पष्ट अर्थ देता है।
- source_word: וְשֶׁמֶן לֹא תָסוּךְ
  choice: पर तू अपने शरीर पर तेल नहीं लगाएगा
  rationale: סוך का अर्थ शरीर पर तेल लगाना या मलना है। 'अपने शरीर पर' जोड़ने से सामान्य प्राचीन व्यवहार स्पष्ट होता है और धार्मिक अभिषेक का अनावश्यक भाव नहीं आता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह तेल न लगा पाने का कारण प्रस्तुत करता है।
- source_word: יִשַּׁל זֵיתֶךָ
  choice: तेरे जैतून के फल झड़ जाएँगे
  rationale: יִשַּׁל समय से पहले गिरने या झड़ने को व्यक्त करता है, और सामूहिक एकवचन זֵיתֶךָ यहाँ जैतून की उपज/फल को दर्शाता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और प्रत्यक्ष शैली। व्यवस्थाविवरण के एकवचन संबोधन को बनाए रखने के लिए 'तेरे/तू' का प्रयोग किया गया है। 'तेल लगाना' को सामान्य शारीरिक व्यवहार के रूप में स्पष्ट किया गया है, न कि अनुष्ठानिक अभिषेक के रूप में।
