  text: יוֹלֵ֨ךְ יְהוָ֜ה אֹֽתְ/ךָ֗ וְ/אֶֽת מַלְכְּ/ךָ֙ אֲשֶׁ֣ר תָּקִ֣ים עָלֶ֔י/ךָ אֶל גּ֕וֹי אֲשֶׁ֥ר לֹא יָדַ֖עְתָּ אַתָּ֣ה וַ/אֲבֹתֶ֑י/ךָ וְ/עָבַ֥דְתָּ שָּׁ֛ם אֱלֹהִ֥ים אֲחֵרִ֖ים עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/036.yaml
  text: Yahweh will bring you and the king whom you set over yourself to a nation that neither you nor your fathers have known[a], and there you will serve other gods[b], wood and stone.
translation:
  language: hi
  text: याहवे तुम्हें और उस राजा को, जिसे तुम अपने ऊपर नियुक्त करोगे, एक ऐसे राष्ट्र में ले जाएगा जिसे न तुमने और न तुम्हारे पुरखों ने जाना है। वहाँ तुम लकड़ी और पत्थर के दूसरे देवताओं की सेवा करोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹלֵךְ
  choice: ले जाएगा
  rationale: הלך का हिफ़ील रूप यहाँ किसी को जाने के लिए विवश करने अथवा कहीं ले जाने का अर्थ देता है। शाप और निर्वासन के प्रसंग में ‘ले जाएगा’ स्वाभाविक है और मूल से अधिक विवरण नहीं जोड़ता।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को उपाधि से बदलने के बजाय देवनागरी में ‘याहवे’ रूप में लिप्यंतरित किया गया है।
- source_word: מַלְכְּךָ אֲשֶׁר תָּקִים עָלֶיךָ
  choice: उस राजा को, जिसे तुम अपने ऊपर नियुक्त करोगे
  rationale: קום का हिफ़ील यहाँ शासक को स्थापित या नियुक्त करने को दर्शाता है; ‘अपने ऊपर नियुक्त करोगे’ हिब्रू संरचना עָלֶיךָ और भविष्यसूचक संदर्भ दोनों को स्पष्ट रखता है।
- source_word: גּוֹי
  choice: राष्ट्र
  rationale: גוי किसी राष्ट्र अथवा जनसमूह को दर्शाता है; विदेशी राजनीतिक समुदाय के इस संदर्भ में ‘राष्ट्र’ उपयुक्त है।
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: जिसे न तुमने जाना है, न तुम्हारे पुरखाओं ने
  rationale: दोनों पक्षों की उस राष्ट्र से अनभिज्ञता को समानांतर हिंदी वाक्य-विन्यास में रखा गया है। ‘पुरखा’ यहाँ पैतृक पूर्वजों के लिए स्वाभाविक और स्रोत के पुरुषवाची रूप के अनुरूप है।
- source_word: וְעָבַדְתָּ שָׁם
  choice: वहाँ तुम ... सेवा करोगे
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है और देवताओं के साथ प्रयुक्त होने पर धार्मिक उपासना-संबंधी सेवा को व्यक्त करता है; ‘सेवा’ उस शाब्दिक संबंध को बनाए रखती है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह मानक वाचागत अभिव्यक्ति का सीधा अनुवाद है; ‘विदेशी देवता’ कहना अनावश्यक व्याख्या जोड़ता।
- source_word: עֵץ וָאָבֶן
  choice: लकड़ी और पत्थर की बनी मूर्तियों
  rationale: हिब्रू में ‘लकड़ी और पत्थर’ समानाधिकरण द्वारा उन देवताओं के भौतिक रूप पर तिरस्कारपूर्ण बल देता है। हिंदी में ‘बनी मूर्तियों’ जोड़ने से आशय स्वाभाविक और स्पष्ट होता है, बिना उन्हें वास्तविक देवता मानने का संकेत दिए।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; उसका लिप्यंतरण नाम और उपाधि के बीच का अंतर सुरक्षित रखता है।
- issue: אֱלֹהִים אֲחֵרִים के बाद עֵץ וָאָבֶן का संबंध
  choice: दूसरे देवताओं की—लकड़ी और पत्थर की बनी मूर्तियों की—सेवा
  alternative: दूसरे देवताओं, लकड़ी और पत्थर, की सेवा
  rationale: स्रोत की समानाधिकरण संरचना मूर्तियों के पदार्थ को बताती है। हिंदी में व्याख्यात्मक पुनरुक्ति से देवताओं और उनकी लकड़ी-पत्थर की प्रतिमाओं का अभिप्रेत संबंध स्पष्ट होता है, जबकि ‘दूसरे देवता’ की वाचागत भाषा भी बनी रहती है।
- issue: עבד का धार्मिक अर्थ
  choice: सेवा करोगे
  alternative: पूजा करोगे
  rationale: देवताओं के संदर्भ में पूजा अभिप्रेत है, पर ‘सेवा’ मूल क्रिया के व्यापक अर्थ और धार्मिक अधीनता के तनाव को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। एकवचन संबोधन ‘तुम’ इस पद के सामूहिक इस्राएली संबोधन में हिब्रू के व्याकरणिक एकवचन को दर्शाता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई; इसलिए मुख्य पाठ में भी कोई पादटिप्पणी-चिह्न नहीं है।
