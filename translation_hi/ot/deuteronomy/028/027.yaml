base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/027.yaml
  text: Yahweh will strike you with the boils of Egypt[a], and with tumors, and with scabs, and with itch, from which you cannot be healed.
translation:
  language: hi
  text: याहवे तुम्हें मिस्र के फोड़ों, गाँठों[a], पपड़ीदार चर्मरोग और खुजली से पीड़ित करेगा, जिनसे तुम चंगे नहीं हो सकोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अर्श’; इब्रानी शब्द का ठीक अर्थ अनिश्चित है और संभवतः गुदा-प्रदेश की सूजन को विशेष रूप से दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: तुम्हें ... से मारेगा
  rationale: נכה का हिफ़ील रूप सीधे प्रहार या विपत्ति पहुँचाने का भाव रखता है। रोगों की सूची के साथ ‘से मारेगा’ आधुनिक हिन्दी में इस कारणात्मक बल को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בִּשְׁחִין מִצְרַיִם
  choice: मिस्र के फोड़ों
  rationale: שְׁחִין सूजे हुए फोड़े या त्वचा पर उभरे घाव को दर्शाता है; हिन्दी में रोग-श्रेणी के लिए बहुवचन स्वाभाविक है और ‘मिस्र के’ मूल संबंध को बनाए रखता है।
- source_word: וּבְעפלים
  choice: गाँठों
  rationale: यह दुर्लभ शब्द अनिश्चित है और सूजी हुई गाँठों अथवा अर्श का संकेत दे सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और अधिक विशिष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: וּבַגָּרָב
  choice: पपड़ीयुक्त चर्मरोग
  rationale: גָּרָב पपड़ी पड़ने वाले त्वचा-रोग को सूचित करता है। यह चयन केवल ‘पपड़ी’ की अपेक्षा रोग का आशय अधिक स्पष्ट करता है, बिना आधुनिक चिकित्सकीय निदान थोपे।
- source_word: וּבֶחָרֶס
  choice: खुजली
  rationale: חֶרֶס यहाँ खुजली पैदा करने वाली त्वचा-दशा का द्योतक है; ‘खुजली’ सहज और अनिर्दिष्ट हिन्दी समतुल्य है।
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: जिनसे तुम चंगे न हो सकोगे
  rationale: निफ़अल रूप के कर्मवाच्य ‘चंगा किया जाना/चंगा होना’ तथा असमर्थता, दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है। बहुवचन ‘जिनसे’ पूरी रोग-सूची की ओर संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: व्यक्तिगत वाचा-नाम को नाम के रूप में सुरक्षित रखा गया है; उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: विपत्ति में ईश्वरीय कर्तृत्व
  choice: याहवे ... मारेगा
  alternative: याहवे ... से पीड़ित करेगा
  rationale: मूल में याहवे स्पष्ट कर्ता है और נכה का बल प्रहार करने का है। अनुवाद उस प्रत्यक्ष कर्तृत्व को नरम या अस्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। रोग-संबंधी दुर्लभ शब्दों को अत्यधिक आधुनिक चिकित्सकीय नाम देने से बचते हुए ठोस हिन्दी में व्यक्त किया गया है। ‘चंगे’ का प्रयोग बाइबलीय हिन्दी में परिचित है, फिर भी सामान्य पाठक के लिए स्पष्ट है।
