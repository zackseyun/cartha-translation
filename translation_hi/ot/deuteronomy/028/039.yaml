  yaml_path: translation/ot/deuteronomy/028/039.yaml
  text: You will plant vineyards and cultivate them[a], but you will not drink the wine or gather it, because the worm will eat it.
translation:
  language: hi
  text: तू अंगूर के बाग लगाएगा और उनकी खेती करेगा, पर उनका दाखमधु न पीएगा और न उसका संचय करेगा[a], क्योंकि कीड़ा उसे खा जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इकट्ठा करेगा।” इब्रानी क्रिया का अर्थ इकट्ठा करना, बटोरना या जमा करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָמִים
  choice: अंगूर के बाग
  rationale: बहुवचन संज्ञा का सामान्य कृषि-संदर्भ में स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: תִּטַּע
  choice: तू ... लगाएगा
  rationale: क़ाल अपूर्ण, द्वितीय पुरुष एकवचन; शापों की भावी शृंखला के अनुरूप सामान्य भविष्यकाल।
- source_word: וְעָבָדְתָּ
  choice: उनकी देखभाल करेगा
  rationale: कृषि-संदर्भ में עבד का अर्थ भूमि या बाग को जोतना-सँभालना है; आधुनिक हिन्दी में यह सहज है और निहित कर्म को स्पष्ट करता है।
- source_word: יַיִן
  choice: उनका दाखमधु
  rationale: अंगूर के बागों से मिलने वाले दाखमधु का संकेत; 'उनका' संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: וְלֹא תֶאֱגֹר
  choice: न ही उनकी उपज बटोर पाएगा
  rationale: אגר में बटोरने, इकट्ठा करने या जमा करने का अर्थ संभव है। संदर्भ में दाखमधु को सीधे 'बटोरना' असहज होने के कारण निहित उपज को स्पष्ट किया गया है; 'पाएगा' परिणामस्वरूप असमर्थता व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: विफल उपज का कारण प्रस्तुत करता है।
- source_word: תֹאכְלֶנּוּ
  choice: उसे खा जाएगा
  rationale: मूल क्रिया का सीधा अर्थ सुरक्षित है; सर्वनाम बाग की उपज की ओर संकेत करता है।
- source_word: הַתֹּלָעַת
  choice: कीड़ा
  rationale: यह शब्द कृमि या लार्वा-जैसे विनाशकारी जीव के लिए व्यापक पद है; किसी खास प्रजाति को अनावश्यक रूप से निश्चित नहीं किया गया।
