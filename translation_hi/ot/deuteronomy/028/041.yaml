  yaml_path: translation/ot/deuteronomy/028/041.yaml
  text: You will father sons and daughters[a], but they will not remain yours[b], because they will go into captivity.
translation:
  language: hi
  text: तुम पुत्र और पुत्रियाँ उत्पन्न करोगे, पर वे तुम्हारे पास नहीं रहेंगे[a], क्योंकि वे बंदी बनकर चले जाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “वे तुम्हारे नहीं होंगे।”
    reason: lexical_alternative
  - marker: b
    text: या “वे निर्वासन में चले जाएँगे।” इब्रानी शब्द विशेष रूप से बंदी अवस्था को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים וּבָנוֹת
  choice: पुत्र और पुत्रियाँ
  rationale: इब्रानी में नर और नारी संतान का स्पष्ट युग्म है; इसे सामान्य ‘संतान’ में समेटने के बजाय दोनों को व्यक्त किया गया है।
- source_word: תּוֹלִיד
  choice: उत्पन्न करोगे
  rationale: यह ילד का हिफ़ील, द्वितीय पुरुष पुल्लिंग एकवचन रूप है। ‘उत्पन्न करोगे’ उसके जननार्थक भाव को बनाए रखता है और आधुनिक हिंदी में गरिमापूर्ण है।
- source_word: וְלֹא יִהְיוּ לָךְ
  choice: पर वे तुम्हारे पास नहीं रहेंगे
  rationale: शाब्दिक अर्थ ‘वे तुम्हारे लिए/तुम्हारे नहीं होंगे’ है। संदर्भ में निर्वासन के कारण उनसे वंचित हो जाने का भाव है; ‘तुम्हारे पास नहीं रहेंगे’ इसे स्वाभाविक हिंदी में व्यक्त करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पूर्व कथन का कारण बताता है; ‘क्योंकि’ आधुनिक हिंदी में स्पष्ट कारणसूचक संयोजक है।
- source_word: יֵלְכוּ
  choice: चले जाएँगे
  rationale: הלך का क़ाल रूप सक्रिय ‘जाना’ व्यक्त करता है। अनुवाद में ‘ले जाए जाएँगे’ जैसा कर्मवाच्य नहीं अपनाया गया, क्योंकि वह क्रिया में निहित नहीं है।
- source_word: בַּשֶּׁבִי
  choice: बंदी बनकर
  rationale: שֶׁבִי युद्धजनित बंदी अवस्था या बंधुआई को सूचित करता है। ‘बंदी बनकर चले जाएँगे’ आधुनिक हिंदी में स्वाभाविक है और केवल व्यापक ‘निर्वासन’ कहने की अपेक्षा मूल शब्द की विशिष्टता बनाए रखता है।
