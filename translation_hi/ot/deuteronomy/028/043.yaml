  yaml_path: translation/ot/deuteronomy/028/043.yaml
  text: The foreigner who is among you will rise higher and higher above you[a], and you will go down lower and lower.
translation:
  language: hi
  text: तुम्हारे बीच रहने वाला परदेशी[a] तुमसे ऊँचा-से-ऊँचा उठता जाएगा, और तुम नीचे-से-नीचे गिरते जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निवासी परदेशी।” इब्रानी शब्द גֵּר उस गैर-इस्राएली व्यक्ति को दर्शाता है जो इस्राएलियों के बीच रहता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֵּר
  choice: परदेशी
  rationale: यह शब्द इस्राएल के बीच रहने वाले गैर-इस्राएली व्यक्ति को दर्शाता है। ‘परदेशी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है; मुख्य पाठ में ‘रहने वाला’ जोड़ने से उसके निवासी होने का भाव बना रहता है।
- source_word: אֲשֶׁר בְּקִרְבְּךָ
  choice: तुम्हारे बीच रहने वाला
  rationale: यह पदबंध उस परदेशी की समुदाय के भीतर उपस्थिति बताता है। यह हिन्दी अभिव्यक्ति केवल अस्थायी निकटता के बजाय उसके बीच निवास करने का भाव सहज रूप से देती है।
- source_word: יַעֲלֶה עָלֶיךָ
  choice: तुमसे ऊँचा ... उठता जाएगा
  rationale: यहाँ ऊपर चढ़ना तुलनात्मक सामाजिक, राजनीतिक या आर्थिक उन्नति का व्यापक रूपक है। ‘तुमसे ऊँचा उठना’ तुलना और स्थिति-पलट दोनों को सुरक्षित रखता है।
- source_word: מַעְלָה מָּעְלָה
  choice: ऊँचा, और ऊँचा
  rationale: दोहराव लगातार बढ़ती उन्नति पर बल देता है। हिन्दी में यह रूप मूल की पुनरुक्ति और तीव्रता बनाए रखता है।
- source_word: וְאַתָּה
  choice: और तुम
  rationale: सरल संयोजक को बनाए रखते हुए प्रसंगगत विरोध अगले खंड से स्वयं स्पष्ट होता है।
- source_word: תֵרֵד
  choice: गिरते जाओगे
  rationale: ירד, עלה का विपरीत है और यहाँ पद या दशा के नीचे जाने का रूपक है। ‘गिरते जाओगे’ आधुनिक हिन्दी में निरंतर अवनति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מַטָּה מָּטָּה
  choice: नीचे, और नीचे
  rationale: यह पुनरुक्ति क्रमशः बढ़ती गिरावट और अपमान को व्यक्त करती तथा ऊपर उठने वाले पहले खंड के समानांतर रहती है।
theological_decisions:
- issue: शाप के प्रसंग में सामाजिक-वाचा संबंधी स्थिति का उलट जाना
  choice: 'पद को व्यापक स्थिति-पलट के रूप में रखा गया है: समुदाय में रहने वाला गैर-इस्राएली इस्राएल से ऊपर उठता है और इस्राएल नीचे गिरता जाता है।'
  alternative: इसे केवल आर्थिक उन्नति-अवनति या केवल राजनीतिक प्रभुत्व तक सीमित करना।
  rationale: मूल इब्रानी में ऊपर उठने और नीचे जाने की छवि जानबूझकर व्यापक है। अनुवाद इसे किसी एक क्षेत्र तक सीमित न करके मूल की अर्थगत व्यापकता और तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ऊँचा, और ऊँचा’ तथा ‘नीचे, और नीचे’ मूल इब्रानी की बलपूर्ण पुनरुक्ति और समानांतर संरचना को सुनाई देते हुए सुरक्षित रखते हैं।
