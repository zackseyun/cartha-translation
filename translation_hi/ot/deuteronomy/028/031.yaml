source:
  edition: WLC
  text: שׁוֹרְ/ךָ֞ טָב֣וּחַ לְ/עֵינֶ֗י/ךָ וְ/לֹ֣א תֹאכַל֮ מִמֶּ/נּוּ֒ חֲמֹֽרְ/ךָ֙ גָּז֣וּל מִ/לְּ/פָנֶ֔י/ךָ וְ/לֹ֥א יָשׁ֖וּב לָ֑/ךְ צֹֽאנְ/ךָ֙ נְתֻנ֣וֹת לְ/אֹיְבֶ֔י/ךָ וְ/אֵ֥ין לְ/ךָ֖ מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/031.yaml
  text: Your ox will be slaughtered before your eyes[a], but you will not eat any of it; your donkey will be seized from before you and will not be returned to you; your flock will be given to your enemies[b], and there will be no one to save you.
translation:
  language: hi
  text: तेरा बैल तेरी आँखों के सामने वध किया जाएगा, पर तू उसमें से कुछ भी नहीं खाएगा; तेरा गधा तेरे सामने से लूट लिया जाएगा[a] और तुझे वापस नहीं मिलेगा; तेरी भेड़-बकरियाँ तेरे शत्रुओं को दे दी जाएँगी, और तुझे बचानेवाला कोई नहीं होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चुरा लिया जाएगा’; इब्रानी शब्द में बलपूर्वक छीनने या लूटने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तेरा कोई छुड़ानेवाला नहीं होगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרְךָ
  choice: तेरा बैल
  rationale: שׁוֹר यहाँ एक गोवंशीय कामकाजी पशु को सूचित करता है। आधुनिक हिन्दी में एकवचन संदर्भ के लिए ‘बैल’ स्वाभाविक और सटीक है।
- source_word: טָבוּחַ
  choice: वध किया जाएगा
  rationale: טבח का निष्क्रिय कृदन्त पशु को काटे या बलि किए जाने के बजाय सामान्यतः भोजन के लिए मार डालने का भाव रखता है। शापों की भावी घटना के अनुरूप भविष्यकाल रखा गया है।
- source_word: לְעֵינֶיךָ
  choice: तेरी आँखों के सामने
  rationale: यह मुहावरा घटना के संबोधित व्यक्ति की उपस्थिति में खुलेआम होने और उसकी विवशता को उभारता है।
- source_word: מִמֶּנּוּ
  choice: उसमें से कुछ भी
  rationale: מן के साथ सर्वनामिक प्रत्यय का शाब्दिक अर्थ ‘उसमें से’ है; ‘कुछ भी नहीं’ यह स्पष्ट करता है कि मालिक को मारे गए पशु का कोई भाग खाने को नहीं मिलेगा।
- source_word: חֲמֹרְךָ
  choice: तेरा गधा
  rationale: यह आधुनिक मानक हिन्दी में חֲמוֹר का सीधा और सहज पर्याय है।
- source_word: גָּזוּל
  choice: लूट लिया जाएगा
  rationale: גזל बलपूर्वक छीनने या लूटने को व्यक्त करता है। ‘लूट लिया जाएगा’ साधारण चोरी की अपेक्षा हिंसक अधिकार-हरण का भाव अधिक स्पष्ट रखता है।
- source_word: מִלְּפָנֶיךָ
  choice: तेरे सामने से
  rationale: शाब्दिक अर्थ ‘तेरे मुख/उपस्थिति के सामने से’ है; यह अनुवाद पशु को मालिक की आँखों के सामने से ले जाए जाने की सजीवता बनाए रखता है।
- source_word: יָשׁוּב לָךְ
  choice: तुझे वापस नहीं मिलेगा
  rationale: इब्रानी में क्रिया सक्रिय रूप से ‘तेरे पास नहीं लौटेगा’ है। हिन्दी में लूटे गए पशु के संदर्भ में ‘वापस नहीं मिलेगा’ स्वाभाविक है और पुनःप्राप्ति न होने का आशय स्पष्ट करता है।
- source_word: צֹאנְךָ
  choice: तेरी भेड़-बकरियाँ
  rationale: צֹאן छोटे पालतू पशुओं के झुंड, विशेषतः भेड़ों और बकरियों, दोनों को समेट सकता है। ‘भेड़-बकरियाँ’ इस व्यापकता को ‘भेड़ें’ से बेहतर सुरक्षित रखता है।
- source_word: נְתֻנוֹת
  choice: दे दी जाएँगी
  rationale: נתן का निष्क्रिय कृदन्त है। स्त्रीलिंग बहुवचन हिन्दी रूप ‘भेड़-बकरियाँ’ के साथ ‘दे दी जाएँगी’ स्वाभाविक है और शत्रुओं के अधिकार में सौंपे जाने का भाव देता है।
- source_word: לְאֹיְבֶיךָ
  choice: तेरे शत्रुओं को
  rationale: אֹיֵב का यह सीधा, प्रतिष्ठित और आधुनिक हिन्दी पर्याय है।
- source_word: וְאֵין לְךָ מוֹשִׁיעַ
  choice: और तुझे बचानेवाला कोई नहीं होगा
  rationale: מוֹשִׁיעַ ישׁע धातु से बना कर्तृवाचक रूप है, अर्थात बचाने या छुड़ाने वाला। यह हिन्दी रूप किसी मानवीय उद्धारकर्ता की अनुपस्थिति को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: अंतिम उपवाक्य में उद्धार-संबंधी शब्दावली
  choice: तुझे बचानेवाला कोई नहीं होगा
  alternative: तेरा कोई छुड़ानेवाला नहीं होगा
  rationale: ישׁע मूल बचाने या छुड़ाने का अर्थ रखता है। इस वाचा-शाप के प्रसंग में बात तत्काल संकट से रक्षा या छुटकारे की है, अनिवार्यतः अनन्त उद्धार की नहीं। ‘बचानेवाला’ मूल अर्थ को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। मूल के एकवचन अनौपचारिक संबोधन को ‘तेरा/तू/तुझे’ से लगातार सुरक्षित रखा गया है। अर्धविराम मूल पद की तीन समानांतर विपत्तियों को स्पष्ट करते हैं।
