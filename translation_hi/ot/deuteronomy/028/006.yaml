  text: בָּר֥וּךְ אַתָּ֖ה בְּ/בֹאֶ֑/ךָ וּ/בָר֥וּךְ אַתָּ֖ה בְּ/צֵאתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/006.yaml
  text: Blessed shall you be when you come in[b][a], and blessed shall you be when you go out.
translation:
  language: hi
  text: भीतर आते समय तुम[a] धन्य होगे, और बाहर जाते समय तुम धन्य होगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘तुम’ एकवचन है; इस्राएल को एक सामूहिक प्रजा के रूप में एकवचन में सम्बोधित किया गया है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, ‘अपने भीतर आने में ... अपने बाहर जाने में।’ यह युग्म सम्भवतः जीवन और गतिविधियों के पूरे क्रम को समेटने वाला कथन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य होगे
  rationale: यह ברך का निष्क्रिय कृदन्त है, जो वाचा की आशीष के प्रसंग में विधेय रूप में आया है। ‘धन्य होगे’ आगामी वाचा-परिणाम का भाव व्यक्त करता है और आशीर्वचन की गरिमा बनाए रखता है।
- source_word: אַתָּה
  choice: तुम
  rationale: मूल में द्वितीय पुरुष पुल्लिंग एकवचन है और इस्राएल को सामूहिक जनता के रूप में एकवचन में सम्बोधित किया गया है। आधुनिक हिन्दी में ‘तुम’ स्वाभाविक और गरिमापूर्ण है; एकवचन का तथ्य पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: בְּבֹאֶךָ
  choice: भीतर आते समय
  rationale: यह ב उपसर्ग, בוא के infinitive construct और द्वितीय पुरुष एकवचन प्रत्यय से बना है। ‘भीतर आते समय’ प्रवेश की परिस्थिति को स्वाभाविक हिन्दी में व्यक्त करते हुए मूल बिम्ब को बनाए रखता है।
- source_word: וּבָרוּךְ
  choice: और ... धन्य होगे
  rationale: संयोजक के साथ आशीष-सूत्र की पुनरावृत्ति हुई है। हिन्दी में पूरी विधेय रचना दोहराने से मूल का समानान्तर संतुलन बना रहता है।
- source_word: בְּצֵאתֶךָ
  choice: बाहर जाते समय
  rationale: यह ב उपसर्ग, יצא के infinitive construct और द्वितीय पुरुष एकवचन प्रत्यय से बना है। यह चयन वास्तविक बाहर जाने के अर्थ को रखता है और ‘भीतर आना/बाहर जाना’ युग्म के व्यापक मुहावरेदार अर्थ के लिए भी स्थान छोड़ता है।
theological_decisions:
- issue: इस्राएल को प्रतिनिधिक एकवचन में सम्बोधन
  choice: ‘तुम’ को बनाए रखा गया है और उसे बहुवचन या व्याख्यात्मक रूप में विस्तृत नहीं किया गया।
  alternative: ‘तुम सब’ अथवा ‘इस्राएल’ कहकर सामूहिक अर्थ को मुख्य पाठ में स्पष्ट करना।
  rationale: इब्रानी में द्वितीय पुरुष पुल्लिंग एकवचन है। यह वाचा के अन्तर्गत इस्राएल को एक इकाई के रूप में सम्बोधित करने का सामान्य ढंग है; ‘तुम’ मूल की व्याकरणिक और धर्मवैचारिक खुलावट को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण आशीर्वचन-शैली अपनाई गई है। ‘भीतर आते समय/बाहर जाते समय’ मूल समानान्तरता और व्यापक मुहावरेदार संकेत—दोनों को बनाए रखता है।
