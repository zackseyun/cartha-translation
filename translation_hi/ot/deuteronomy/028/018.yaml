base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/018.yaml
  text: Cursed shall be the fruit of your womb[a], and the fruit of your ground[b], the offspring of your herds and the young of your flocks.
translation:
  language: hi
  text: तेरे गर्भ का फल और तेरी भूमि की उपज, तेरे गोवंश की संतान और तेरी भेड़-बकरियों के बच्चे शापित होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: शापित होंगे
  rationale: यह वाचा के शाप की घोषणात्मक शैली है; बहुवचन कर्ताओं के साथ भविष्यसूचक हिन्दी रूप स्वाभाविक है।
- source_word: פְּרִי בִטְנְךָ
  choice: तेरे गर्भ का फल
  rationale: संतान के लिए प्रयुक्त इब्रानी रूपक को स्पष्ट और प्रतिष्ठित हिन्दी में बनाए रखता है।
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: तेरी भूमि की उपज
  rationale: अדמה कृषि-भूमि या मिट्टी को सूचित करता है; 'उपज' हिन्दी में उसके फलित उत्पादन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: तेरे गाय-बैलों की संतान
  rationale: यह पद गोवंश से उत्पन्न बच्चों या वृद्धि को सूचित करता है; 'गाय-बैल' पशु-वर्ग को और 'संतान' उसकी पैदावार को स्पष्ट करता है।
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: तेरी भेड़-बकरियों के बच्चे
  rationale: यह छोटे पालतू पशुओं की नई पैदावार को सूचित करता है; शब्द-साम्य के कारण किसी देवी के नाम का भ्रामक संकेत नहीं दिया गया।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, घोषणात्मक और सामान्य पाठक के लिए सहज शैली। इब्रानी के संतति-विषयक समानांतर भाव को रखा गया है, जबकि भूमि के संदर्भ में अप्राकृतिक 'फल' के बजाय स्वाभाविक 'उपज' चुना गया है।
