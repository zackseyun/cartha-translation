review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the four Hebrew curse targets: progeny, agricultural produce, the young/increase of cattle, and the young/increase of small livestock. However, “गाय-बैलों की संतान” is imprecise: bulls/oxen (बैल) do not naturally serve as the source of offspring in Hindi, while the Hebrew term denotes bovine livestock collectively.'
  naturalness: The sentence is clear, appropriately grave, and natural in modern standard Hindi. Replacing “गाय-बैलों की संतान” with “गोवंश की संतान” removes an awkward biological implication while retaining the specific bovine reference.
  terminology: “गर्भ का फल,” “भूमि की उपज,” and “भेड़-बकरियों के बच्चे” suitably convey the Hebrew imagery and livestock categories. “गोवंश” is a precise collective for the cattle reference and does not add interpretation.
  issues:
  - severity: medium
    issue: “तेरे गाय-बैलों की संतान”
    rationale: This phrasing is awkward and partly inaccurate in Hindi because “बैल” normally means a castrated male bovine and is not a progenitor. The Hebrew שְׁגַר אֲלָפֶיךָ refers collectively to the offspring/increase of cattle.
  revised_text: तेरे गर्भ का फल और तेरी भूमि की उपज, तेरे गोवंश की संतान और तेरी भेड़-बकरियों के बच्चे शापित होंगे।
