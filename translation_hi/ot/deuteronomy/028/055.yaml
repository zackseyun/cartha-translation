base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/055.yaml
  text: so that he will not give to any of them any of the flesh of his sons that he is eating[a], because he has nothing left[b], in the siege and in the distress with which your enemy will oppress you within all your gates.
translation:
  language: hi
  text: वह अपने बेटों[a] के मांस में से, जो वह खा रहा होगा, उनमें से किसी को भी कुछ नहीं देगा, क्योंकि उसके पास कुछ भी नहीं बचा होगा—उस घेराबंदी और संकट में, जिनके द्वारा तुम्हारा शत्रु तुम्हें तुम्हारे सभी नगरों[b] में तंग करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उसके बेटे’ है; यहाँ सामान्य अर्थ वाला ‘बच्चे’ नहीं, बल्कि पुल्लिंग शब्द प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘तुम्हारे सभी फाटकों में’। इब्रानी में ‘फाटक’ वहाँ रहने वाले समुदाय या नगर के लिए भी प्रयुक्त हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: מִתֵּת לְאַחַד מֵהֶם
  choice: वह उनमें से किसी को भी ... कुछ नहीं देगा
  rationale: מִן के साथ נתן का infinitive पिछले पद से जुड़कर रोक रखने या न देने का भाव व्यक्त करता है। ‘किसी को भी’ לְאַחַד מֵהֶם के वितरणात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִבְּשַׂר בָּנָיו
  choice: अपने बेटों के उस मांस में से कुछ
  rationale: בָּשָׂר के ठोस और भयावह अर्थ ‘मांस’ को बनाए रखा गया है; בָּנָיו विशेष रूप से ‘उसके बेटे’ है, इसलिए इसे सामान्य ‘बच्चे’ नहीं किया गया।
- source_word: אֲשֶׁר יֹאכֵל
  choice: जिसे वह खा रहा होगा
  rationale: अपूर्ण क्रिया घेराबंदी के भावी दृश्य में जारी क्रिया को सजीव रूप से दिखाती है; हिन्दी का ‘खा रहा होगा’ भावी और प्रगतिशील दोनों पक्षों को व्यक्त करता है।
- source_word: מִבְּלִי הִשְׁאִיר לוֹ כֹּל
  choice: क्योंकि उसके लिए कुछ भी नहीं बचा होगा
  rationale: वाक्यांश पूर्ण अभाव का कारण बताता है। ‘उसके लिए’ לוֹ को बनाए रखता है और ‘कुछ भी नहीं’ כֹּל के निषेधगत व्यापक अर्थ को व्यक्त करता है।
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: घेराबंदी और संकट के कारण
  rationale: מָצוֹר सैन्य घेराबंदी और מָצוֹק अत्यंत तंगी या संकट को सूचित करता है। सन्दर्भ में בְ साधन या परिस्थिति का भाव रखता है, जिसे ‘के कारण’ स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: जिनसे तुम्हारा शत्रु ... तुम्हें दबाएगा
  rationale: צוּק का हिफ़ील रूप दबाव डालने और तंग करने का अर्थ देता है। ‘दबाएगा’ घेराबंदी के ठोस दबाव को बनाए रखता है।
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: तुम्हारे सभी फाटकों के भीतर
  rationale: मुख्य पाठ में शाब्दिक ‘फाटक’ रखकर इब्रानी बिंब को सुरक्षित किया गया है; इसका नगरों के लिए लाक्षणिक प्रयोग पाद-टिप्पणी में स्पष्ट है।
