base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/025.yaml
  text: Yahweh will give you over as defeated before your enemies. You will go out against them by one way[a], and by seven ways you will flee before them, and you will become a horror to all the kingdoms of the earth.
translation:
  language: hi
  text: याहवे तुम्हें तुम्हारे शत्रुओं के सामने पराजित अवस्था में सौंप देगा। तुम एक मार्ग से उन पर चढ़ाई करने निकलोगे, पर उनके सामने से सात मार्गों से भागोगे। तुम पृथ्वी के सभी राज्यों के लिए भय का विषय बन जाओगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भयावह वस्तु” या “दहशत का पात्र।” इब्रानी शब्द ऐसी वस्तु या दशा का भी संकेत कर सकता है जो लोगों में भय या दहशत पैदा करे।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּנְךָ נִגָּף
  choice: तुम्हें...पराजित करके उनके हाथ में सौंप देगा
  rationale: נתן का मूल भाव ‘देना/सौंपना’ है और נִגָּף युद्ध में पराजित अवस्था बताता है। संयुक्त हिन्दी अभिव्यक्ति शाप के प्रसंग में शत्रु के वश में सौंपे जाने का स्वाभाविक अर्थ देती है। ‘उनके हाथ में’ हिन्दी में इस भाव को स्पष्ट करने वाला मुहावरा है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; उसे किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: לִפְנֵי אֹיְבֶיךָ
  choice: तुम्हारे शत्रुओं के सामने
  rationale: यह युद्ध के प्रसंग में शत्रुओं के सामने पराजित होने का भाव रखता है और मूल की स्थानवाचक छवि भी बनाए रखता है।
- source_word: בְּדֶרֶךְ אֶחָד תֵּצֵא אֵלָיו
  choice: एक मार्ग से उन पर चढ़ाई करने निकलोगे
  rationale: יצא + אל का यहाँ सैनिक अर्थ है—शत्रु के विरुद्ध निकलना। ‘चढ़ाई करने’ से यह प्रसंग आधुनिक हिन्दी में स्पष्ट होता है, और ‘एक मार्ग’ अगली पंक्ति के ‘सात मार्गों’ के साथ समानांतरता रखता है।
- source_word: וּבְשִׁבְעָה דְרָכִים תָּנוּס לְפָנָיו
  choice: उनके सामने से सात मार्गों से भागोगे
  rationale: मूल की एक मार्ग बनाम सात मार्गों की ठोस छवि सुरक्षित रखी गई है; यह संगठित प्रस्थान के विपरीत पूरी तरह तितर-बितर होकर भागने को दर्शाती है। एकवचन प्रत्यय को सामूहिक पूर्वपद ‘शत्रुओं’ के अनुसार स्वाभाविक हिन्दी बहुवचन में व्यक्त किया गया है।
- source_word: וְהָיִיתָ לְזַעֲוָה
  choice: आतंक का कारण बन जाओगे
  rationale: זַעֲוָה भय, दहशत अथवा ऐसी वस्तु/दशा को सूचित कर सकता है जिसे देखकर लोग भयभीत हों। यह चयन इस कारक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: पृथ्वी के सभी राज्यों के लिए
  rationale: यह वाचा के शाप का व्यापक, अंतरराष्ट्रीय प्रभाव व्यक्त करता है; यहाँ הָאָרֶץ को केवल इस्राएल की भूमि तक सीमित करना आवश्यक नहीं है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना और किसी संप्रदायगत व्याख्या को जोड़े बिना प्रस्तुत करता है।
- issue: לְזַעֲוָה में शाप की सार्वजनिक भयावहता
  choice: आतंक का कारण
  alternative: दहशत का पात्र / भयावह दृश्य
  rationale: यह अभिव्यक्ति इस तनाव को बनाए रखती है कि इस्राएल स्वयं भयभीत भी होगा और अन्य राज्यों के लिए भय उत्पन्न करने वाला उदाहरण भी बनेगा; अधिक विशिष्ट वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘एक मार्ग’ और ‘सात मार्गों’ की इब्रानी समानांतर छवि को जानबूझकर सुरक्षित रखा गया है। शत्रु के लिए मूल के सामूहिक एकवचन प्रत्यय को हिन्दी में पूर्वपद ‘शत्रुओं’ के अनुरूप बहुवचन में व्यक्त किया गया है।
