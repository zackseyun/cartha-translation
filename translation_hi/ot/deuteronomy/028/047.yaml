  terminology: “यहोवा,” “परमेश्वर,” and “सेवा” appropriately preserve the name and the broad covenantal sense of עבד. “प्रसन्न मन” suitably conveys the idiomatic sense of טוּב לֵבָב without merely duplicating “आनन्द.”
