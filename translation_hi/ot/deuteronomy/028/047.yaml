source:
  edition: WLC
  text: תַּ֗חַת אֲשֶׁ֤ר לֹא עָבַ֨דְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/שִׂמְחָ֖ה וּ/בְ/ט֣וּב לֵבָ֑ב מֵ/רֹ֖ב כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/047.yaml
  text: because you did not serve Yahweh your God with joy and with gladness of heart[a], because of the abundance of all things[b],
translation:
  language: hi
  text: क्योंकि तुमने अपने परमेश्वर यहोवा की सेवा आनन्द और प्रसन्न मन से नहीं की, सब कुछ की प्रचुरता के कारण[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब कुछ की प्रचुरता में” या “जब तुम्हारे पास सब कुछ की प्रचुरता थी।” इब्रानी पदबंध प्रचुर प्रबन्ध के सम्बन्ध को संक्षेप में व्यक्त करता है; सन्दर्भ में यह भी अर्थ हो सकता है कि इतनी प्रचुरता के बीच भी तुमने यहोवा की सेवा आनन्द से नहीं की।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: क्योंकि
  rationale: यह पद वाचा के शाप का कारण बताता है; इसलिए इस इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप ‘क्योंकि’ है।
- source_word: עָבַדְתָּ
  choice: सेवा नहीं की
  rationale: परमेश्वर के सम्बन्ध में यह क्रिया आराधना तक सीमित नहीं, बल्कि वाचा के अनुसार भक्ति और आज्ञापालन सहित व्यापक सेवा को व्यक्त करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; हिन्दी में प्रचलित रूप ‘यहोवा’ रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को ‘अपने’ द्वारा स्वाभाविक हिन्दी में व्यक्त किया गया है; सम्बोधन सामूहिक इस्राएल से एकवचन में है।
- source_word: בְּשִׂמְחָה
  choice: आनन्द से
  rationale: यह सेवा करने की रीति बताता है और שִׂמְחָה के स्पष्ट अर्थ ‘आनन्द’ को सीधे व्यक्त करता है।
- source_word: וּבְטוּב לֵבָב
  choice: और प्रसन्न मन से
  rationale: शाब्दिक रूप ‘मन की भलाई’ है, पर इस मुहावरे में आन्तरिक प्रसन्नता और मन की अच्छी दशा निहित है। ‘प्रसन्न मन’ आधुनिक हिन्दी में स्वाभाविक है और पहले पदांश की केवल पुनरावृत्ति नहीं करता।
- source_word: מֵרֹב כֹּל
  choice: सब कुछ बहुतायत में होते हुए भी
  rationale: पूर्वसर्ग מן और ‘सब कुछ की बहुतायत’ का प्रसंगगत बल यह है कि इस्राएल ने प्रचुर प्रबन्ध के बावजूद सेवा नहीं की। यह रूप कारण का भ्रामक अर्थ देने के बजाय रियायती परिस्थिति स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा-नाम प्रत्यक्ष रूप से आया है। हिन्दी पाठकों में पहचाने जाने वाले ‘यहोवा’ से व्यक्तिगत नाम सुरक्षित रहता है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: עבד में वाचागत सेवा का विस्तार
  choice: सेवा करना
  alternative: आराधना करना
  rationale: ‘सेवा’ आराधना, निष्ठा और आज्ञापालन के व्यापक अर्थ को बनाए रखती है; ‘आराधना’ अर्थ को अनावश्यक रूप से संकीर्ण कर सकती है।
- issue: מֵרֹב כֹּל का सम्बन्ध
  choice: प्रचुरता के बावजूद सेवा न करना
  alternative: प्रचुरता के कारण सेवा न करना
  rationale: सन्दर्भ में दोष यह है कि प्रचुर आशीष मिलने पर भी इस्राएल ने आनन्द से सेवा नहीं की। हिन्दी में ‘होते हुए भी’ इस सम्बन्ध को स्पष्ट करता है, यद्यपि इब्रानी संरचना संक्षिप्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप अपनाया गया है। पद अगले वाक्य से व्याकरणिक रूप से जुड़ा है, इसलिए अन्त में अल्पविराम रखा गया है। ‘तुमने’ मूल के द्वितीय पुरुष पुल्लिंग एकवचन सम्बोधन को दर्शाता है।
