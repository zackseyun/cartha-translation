source:
  edition: WLC
  text: יִתֵּ֨ן יְהוָ֤ה אֶת אֹיְבֶ֨י/ךָ֙ הַ/קָּמִ֣ים עָלֶ֔י/ךָ נִגָּפִ֖ים לְ/פָנֶ֑י/ךָ בְּ/דֶ֤רֶךְ אֶחָד֙ יֵצְא֣וּ אֵלֶ֔י/ךָ וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים יָנ֥וּסוּ לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/007.yaml
  text: Yahweh will give your enemies who rise up against you defeated before you[a]. By one way they will come out against you[b], and by seven ways they will flee before you.
translation:
  language: hi
  text: याहवे तुम्हारे विरुद्ध उठने वाले तुम्हारे शत्रुओं को तुम्हारे सामने पराजित कर देगा।[a] वे एक मार्ग से तुम्हारे विरुद्ध निकलेंगे,[b] और सात मार्गों से तुम्हारे सामने भागेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे तुम्हारे विरुद्ध उठने वाले तुम्हारे शत्रुओं को पराजित अवस्था में तुम्हारे हाथों में सौंप देगा।”
    reason: יִתֵּן का शाब्दिक अर्थ ‘देगा’ है और सैन्य प्रसंग में इसका अर्थ ‘सौंप देगा’ भी हो सकता है।
  - marker: b
    text: इब्रानी में “एक मार्ग से ... सात मार्गों से”; यह एकजुट होकर आने, पर बिखरकर अनेक दिशाओं में भागने का चित्र है।
    reason: मूल रूपक और उसके सैन्य आशय को स्पष्ट करना।
lexical_decisions:
- source_word: יִתֵּן
  choice: कर देगा
  rationale: נתן का मूल अर्थ ‘देना’ है, पर इस सैन्य परिणामसूचक रचना में ‘पराजित कर देगा’ स्वाभाविक हिन्दी में शत्रुओं को पराजय की दशा में सौंप दिए जाने का भाव व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू चतुरक्षरीय व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण, किसी उपाधि से प्रतिस्थापित किए बिना।
- source_word: אֹיְבֶיךָ
  choice: तुम्हारे शत्रुओं
  rationale: बहुवचन संज्ञा और द्वितीय पुरुष एकवचन प्रत्यय का सीधा, स्वाभाविक अनुवाद।
- source_word: הַקָּמִים עָלֶיךָ
  choice: तुम्हारे विरुद्ध उठनेवाले
  rationale: קום עם על की शत्रुतापूर्ण मुहावरेदार शक्ति को बनाए रखता है और इसे किसी खास प्रकार के हमले तक सीमित नहीं करता।
- source_word: נִגָּפִים לְפָנֶיךָ
  choice: तुम्हारे सामने पराजित
  rationale: निफ़अल कृदंत पराजित या मार खाए होने की दशा बताता है; ‘पराजित’ सैन्य आशय को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בְּדֶרֶךְ אֶחָד
  choice: एक मार्ग से
  rationale: דרך के ठोस बिंब और आगे के ‘सात मार्गों’ के साथ विरोधी समानांतरता को सुरक्षित रखता है।
- source_word: יֵצְאוּ אֵלֶיךָ
  choice: तुम्हारे विरुद्ध निकलेंगे
  rationale: युद्ध-संदर्भ में יצא אל का अर्थ किसी के विरुद्ध अभियान के लिए निकलना है।
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: पर ... सात मार्गों से
  rationale: ‘एक’ और ‘सात’ का स्पष्ट विरोध तथा बिखरकर पलायन करने का मूल चित्र दोनों बने रहते हैं।
- source_word: יָנוּסוּ
  choice: भागेंगे
  rationale: नוס भय या पराजय में पलायन का सामान्य क्रिया-पद है; ‘भागेंगे’ आधुनिक हिन्दी में सीधा और सशक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से बदले बिना लिप्यंतरित करता है और पाठ में उपस्थित नाम को स्पष्ट रखता है।
- issue: पराजय में ईश्वरीय कर्तृत्व
  choice: याहवे ... पराजित कर देगा
  alternative: याहवे ... पराजित अवस्था में तुम्हारे हाथ कर देगा
  rationale: पहला रूप स्वाभाविक हिन्दी में ईश्वर को परिणाम का कर्ता बनाए रखता है; अधिक शाब्दिक ‘देना/हाथ कर देना’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है, ताकि मूल की सैन्य-सौंपने वाली संभावित छाया न मिटे।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और जनसुलभ शैली। ‘शत्रु’, ‘विरुद्ध’ और ‘पराजित’ औपचारिकता बनाए रखते हैं, जबकि वाक्यरचना सहज है। पद के एकवचन ‘तुम’ को हिन्दी में ‘तुम्हारे’ द्वारा बनाए रखा गया है।
