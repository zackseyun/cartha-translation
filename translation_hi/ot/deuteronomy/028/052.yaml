source:
  edition: WLC
  text: וְ/הֵצַ֨ר לְ/ךָ֜ בְּ/כָל שְׁעָרֶ֗י/ךָ עַ֣ד רֶ֤דֶת חֹמֹתֶ֨י/ךָ֙ הַ/גְּבֹה֣וֹת וְ/הַ/בְּצֻר֔וֹת אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בָּ/הֵ֖ן בְּ/כָל אַרְצֶ֑/ךָ וְ/הֵצַ֤ר לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ בְּ/כָ֨ל אַרְצְ/ךָ֔ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/052.yaml
  text: And he will besiege you in all your gates until your high and fortified walls, in which you trust, come down throughout all your land; and he will besiege you in all your gates throughout all your land that Yahweh your God has given you.
translation:
  language: hi
  text: और वह तुम्हारे सभी फाटकों की घेराबंदी करेगा, जब तक तुम्हारी ऊँची और किलेबंद दीवारें, जिन पर तुम भरोसा रखते हो, तुम्हारे पूरे देश में ढह न जाएँ; और वह तुम्हारे सभी फाटकों की घेराबंदी तुम्हारे उस पूरे देश में करेगा, जिसे याहवे, तुम्हारे परमेश्वर, ने तुम्हें दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵצַר
  choice: घेरकर रखेगा
  rationale: צור के हिफ़ील रूप का यहाँ फाटकों और शहरपनाहों से जुड़ा सैनिक संदर्भ है; इसलिए सामान्य ‘संकट में डालेगा’ के बजाय नगर की घेराबंदी का अर्थ व्यक्त किया गया है। दोनों occurrences में एकरूपता रखी गई है।
- source_word: שְׁעָרֶיךָ
  choice: तुम्हारे सभी फाटक
  rationale: शाब्दिक ‘फाटक’ को रखा गया है। यह नगरों का लक्षणालंकार भी हो सकता है, पर ठोस घेराबंदी-चित्र को बनाए रखना उचित है।
- source_word: עַד רֶדֶת
  choice: जब तक ... ढह न जाएँ
  rationale: ירד का मूल भाव ‘नीचे आना’ है; शहरपनाहों के संदर्भ में स्वाभाविक हिन्दी ‘ढह जाना’ उसी परिणति को स्पष्ट करती है।
- source_word: חֹמֹתֶיךָ
  choice: तुम्हारी ... शहरपनाहें
  rationale: חומה नगर को घेरने वाली रक्षात्मक दीवार है; ‘शहरपनाह’ आधुनिक हिन्दी में अपेक्षाकृत विशिष्ट और संक्षिप्त सैनिक अर्थ देता है।
- source_word: הַגְּבֹהוֹת וְהַבְּצֻרוֹת
  choice: ऊँची और किलेबंद
  rationale: दोनों विशेषण सुरक्षित रखे गए हैं; בָּצוּר यहाँ सुदृढ़ रक्षात्मक निर्माण का बोध कराता है।
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בָּהֵן
  choice: जिन पर तुम भरोसा रखते हो
  rationale: בטח + ב का आशय किसी सुरक्षा-साधन पर निर्भर या आश्वस्त होना है; हिन्दी में दीवारों के साथ ‘जिन पर’ स्वाभाविक है।
- source_word: בְּכָל אַרְצֶךָ
  choice: तुम्हारे देश भर में
  rationale: בְּכָל का व्यापक और वितरणात्मक अर्थ ‘देश भर में’ से सहज रूप में व्यक्त होता है।
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: जिसे तुम्हारे परमेश्वर यहवे ने तुम्हें दिया है
  rationale: पूर्ण क्रिया को वर्तमान प्रासंगिकता सहित ‘दिया है’ कहा गया है और ईश्वरीय नाम को शीर्षक से नहीं बदला गया।
- source_word: יְהוָה
  choice: यहवे
  rationale: टेट्राग्रामटन को हिन्दी देवनागरी में उसके व्यक्तिगत वाचा-नाम के लिप्यंतरण ‘यहवे’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से उपस्थित है। ‘यहवे’ उसे उपाधि में बदले बिना हिन्दी में लिप्यंतरित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शहरपनाह’ घेराबंदी के संदर्भ में ‘दीवार’ से अधिक सटीक है। इब्रानी का एकवचन संबोधन पूरे पद में ‘तुम’ के रूप में बनाए रखा गया है।
