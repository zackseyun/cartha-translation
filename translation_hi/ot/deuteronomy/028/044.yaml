id: DEU.28.44
reference: Deuteronomy 28:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֣וּא יַלְוְ/ךָ֔ וְ/אַתָּ֖ה לֹ֣א תַלְוֶ֑/נּוּ ה֚וּא יִהְיֶ֣ה לְ/רֹ֔אשׁ וְ/אַתָּ֖ה תִּֽהְיֶ֥ה לְ/זָנָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/044.yaml
  text: He will lend to you[a], but you will not lend to him; he will be the head[b], and you will be the tail.
translation:
  language: hi
  text: वह तुम्हें उधार देगा[a], पर तुम उसे उधार नहीं दोगे। वह सिर होगा, और तुम पूँछ होगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् पिछले पद में बताया गया परदेशी।
    reason: cross_reference
lexical_decisions:
- source_word: יַלְוְךָ / תַלְוֶנּוּ (לוה, Hiphil)
  choice: तुम्हें उधार देगा / उसे उधार नहीं दोगे
  rationale: हिफ़ील रूप यहाँ ऋण देने को व्यक्त करता है। समानांतर खंड ऋणदाता और ऋणी के बीच आर्थिक निर्भरता तथा स्थिति के उलटने को स्पष्ट करते हैं।
- source_word: הוּא
  choice: वह
  rationale: यह एकवचन पुल्लिंग सर्वनाम पिछले पद में आए परदेशी को सूचित करता है; हिन्दी में ‘वह’ मूल की सर्वनामात्मक शैली और एकवचन दोनों बनाए रखता है।
- source_word: לְרֹאשׁ
  choice: सिर
  rationale: यह प्रधानता या प्रभुत्व का रूपक है। ‘सिर’ मूल बिंब को सुरक्षित रखता है और इसी अध्याय की पहले की भाषा के उलटाव को प्रतिध्वनित करता है।
- source_word: לְזָנָב
  choice: पूँछ
  rationale: यह ‘सिर’ के विपरीत अधीन स्थिति का सजीव रूपक है; सीधा हिन्दी समतुल्य मूल विरोध को बनाए रखता है।
- source_word: יִהְיֶה / תִּהְיֶה
  choice: होगा / होगे
  rationale: यहाँ היה भविष्य में परिणामी स्थिति बताता है। ये रूप आधुनिक हिन्दी में स्वाभाविक हैं और बनने की प्रक्रिया को अनावश्यक रूप से नहीं जोड़ते।
- source_word: וְאַתָּה
  choice: पर तुम / और तुम
  rationale: दोहराया गया सर्वनाम तीखा विरोध उभारता है। पहले खंड में ‘पर’ विरोध को स्पष्ट करता है और दूसरे में ‘और’ समानांतर संरचना को सहज रखता है।
theological_decisions:
- issue: एकवचन पुल्लिंग संदर्भ
  choice: ‘वह’ और ‘तुम’ के एकवचन रूप बनाए रखना
  alternative: मुख्य पाठ में ‘परदेशी’ संज्ञा दोहराना अथवा बहुवचन ‘वे’ का प्रयोग करना
  rationale: इब्रानी में संदर्भ व्याकरणतः एकवचन पुल्लिंग है और पिछले पद के परदेशी का प्रतिनिधिक उल्लेख करता है। एकवचन मूल की संरचना को सुरक्षित रखता है; संदर्भ की स्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उधार देना’ आर्थिक अर्थ को साफ़ व्यक्त करता है, जबकि ‘सिर’ और ‘पूँछ’ के मूल इब्रानी रूपक ज्यों के त्यों सुरक्षित हैं।
