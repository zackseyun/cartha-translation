source:
  edition: WLC
  text: וּ/בָ֨אוּ עָלֶ֜י/ךָ כָּל הַ/קְּלָל֣וֹת הָ/אֵ֗לֶּה וּ/רְדָפ֨וּ/ךָ֙ וְ/הִשִּׂיג֔וּ/ךָ עַ֖ד הִשָּֽׁמְדָ֑/ךְ כִּי לֹ֣א שָׁמַ֗עְתָּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/045.yaml
  text: And all these curses will come upon you and pursue you and overtake you[a], until you are destroyed, because you did not listen to the voice of Yahweh your God, to keep his commandments and his statutes that he commanded you.
translation:
  language: hi
  text: और ये सभी शाप तुम पर आएँगे, तुम्हारा पीछा करेंगे और तुम्हें आ पकड़ेंगे, जब तक कि तुम नष्ट न हो जाओ; क्योंकि तुमने अपने परमेश्वर यहवे की वाणी नहीं सुनी—उनकी आज्ञाओं और विधियों का पालन करने के लिए, जिन्हें मानने की आज्ञा उन्होंने तुम्हें दी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तुमने अपने परमेश्वर यहवे की आज्ञा नहीं मानी और उनकी आज्ञाओं और विधियों का पालन नहीं किया, जिन्हें मानने की आज्ञा उन्होंने तुम्हें दी थी।” इब्रानी में शाब्दिक रूप से “वाणी नहीं सुनी” है।
    reason: שׁמע בקול के मुहावरेदार ‘आज्ञा मानना’ अर्थ और मूल की शाब्दिक श्रवणात्मक छवि, दोनों को सामने रखना।
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: ये सभी शाप तुम पर आएँगे
  rationale: वाचा की चेतावनी के संदर्भ में क्रिया भविष्य का परिणाम व्यक्त करती है। ‘तुम पर आएँगे’ עַל की दिशात्मक और प्रतिकूल शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּרְדָפוּךָ וְהִשִּׂיגוּךָ
  choice: तुम्हारा पीछा करेंगे और तुम्हें आ पकड़ेंगे
  rationale: 'दोनों क्रमिक क्रियाओं की सजीव छवि सुरक्षित है: शाप पीछा करते हैं और अंततः व्यक्ति को पकड़ लेते हैं।'
- source_word: עַד הִשָּׁמְדָךְ
  choice: जब तक कि तुम नष्ट न हो जाओ
  rationale: यह अनन्त क्रियारूप विनाश को घटनाक्रम के अंतिम बिंदु के रूप में प्रस्तुत करता है; हिन्दी का अकर्मक/परिणामसूचक रूप किसी ऐसे कर्ता को स्पष्ट नहीं करता जिसे इब्रानी ने स्पष्ट नहीं किया।
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: क्योंकि तुमने ... की वाणी नहीं सुनी
  rationale: שׁמע בקול में आज्ञापालन का भाव है, फिर भी ‘वाणी सुनना’ मूल की श्रवणात्मक और वाचागत छवि को सुरक्षित रखता है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहवे
  rationale: व्यक्तिगत वाचा-नाम יהוה को ‘यहवे’ के रूप में लिप्यंतरित किया गया है और אֱלֹהֶיךָ को स्वाभाविक हिन्दी संबंध के साथ रखा गया है।
- source_word: לִשְׁמֹר מִצְוֺתָיו וְחֻקֹּתָיו
  choice: उनकी ... आज्ञाओं और विधियों का पालन करने के लिए
  rationale: לִשְׁמֹר को उद्देश्य/व्यावहारिक आशय के रूप में रखा गया है। ‘आज्ञाएँ’ और ‘विधियाँ’ दोनों कानूनी पदों का भेद बनाए रखते हैं।
- source_word: אֲשֶׁר צִוָּךְ
  choice: जिन्हें उन्होंने तुम्हें दिया था
  rationale: हिन्दी में आज्ञाओं और विधियों को ‘देना’ स्वाभाविक है और उनके ईश्वरीय स्रोत को स्पष्ट रखता है; ‘आज्ञा दी थीं’ संभव है, पर निकटस्थ ‘आज्ञाओं’ के साथ अनावश्यक पुनरुक्ति होती।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम प्रत्यक्ष है। ‘यहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: שָׁמַע בְּקוֹל में सुनने और आज्ञापालन का संबंध
  choice: वाणी नहीं सुनी—... पालन करने के लिए
  alternative: आज्ञा नहीं मानी
  rationale: मुख्य पाठ मूल की ‘वाणी सुनने’ वाली छवि रखता है और अगले वाक्यांश में उसके आज्ञापालन-संबंधी आशय को व्यक्त करता है। पादटिप्पणी स्वाभाविक गतिशील विकल्प देती है।
- issue: לִשְׁמֹר का संबंध
  choice: पालन करने के लिए
  alternative: पालन करके
  rationale: इब्रानी अनन्त क्रियारूप उद्देश्य, आशय या सुनने की व्यावहारिक अभिव्यक्ति सूचित कर सकता है। मुख्य पाठ अधिक औपचारिक ‘करने के लिए’ रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शाप’, ‘वाणी’, ‘आज्ञाएँ’ और ‘विधियाँ’ व्यवस्थाविवरण के वाचागत-कानूनी स्वर को बनाए रखते हैं। सर्वनाम एकवचन ‘तुम’ है, जैसा कि इब्रानी 2ms रूपों में है।
