  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य होगा
  rationale: यह बरख़ क्रिया का कर्मवाच्य कृदंत है, जो यहाँ वाचा की आशीषों की घोषणात्मक शृंखला में विधेय के रूप में प्रयुक्त हुआ है। ‘धन्य होगा’ इसके भविष्याभिमुख घोषणात्मक बल को बनाए रखता है और इसे कामना नहीं बनाता।
- source_word: טַנְאֲךָ
  choice: तुम्हारी टोकरी
  rationale: טֶנֶא उपज आदि ढोने के लिए प्रयुक्त टोकरी को दर्शाता है। ‘टोकरी’ स्वाभाविक और पर्याप्त रूप से सटीक है; ‘फलों की टोकरी’ कहना मूल से अधिक विशिष्ट होगा।
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: और आटा गूँधने का पात्र
  rationale: מִשְׁאֶרֶת आटा तैयार करने और गूँधने में प्रयुक्त बर्तन को दर्शाता है। ‘आटा गूँधने का पात्र’ आधुनिक हिन्दी में स्पष्ट है और पात्र के कटोरा या कठौती होने को अनावश्यक रूप से निश्चित नहीं करता।
