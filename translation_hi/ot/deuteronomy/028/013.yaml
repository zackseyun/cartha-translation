source:
  edition: WLC
  text: וּ/נְתָֽנְ/ךָ֨ יְהוָ֤ה לְ/רֹאשׁ֙ וְ/לֹ֣א לְ/זָנָ֔ב וְ/הָיִ֨יתָ֙ רַ֣ק לְ/מַ֔עְלָ/ה וְ/לֹ֥א תִהְיֶ֖ה לְ/מָ֑טָּה כִּֽי תִשְׁמַ֞ע אֶל מִצְוֺ֣ת יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם לִ/שְׁמֹ֥ר וְ/לַ/עֲשֽׂוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/013.yaml
  text: And Yahweh will make you the head and not the tail[a], and you will be only above, and you will not be beneath, if you listen to the commandments of Yahweh your God that I am commanding you today, to keep and to do them.
translation:
  language: hi
  text: और यहोवा तुम्हें सिर बनाएगा, पूँछ नहीं; तुम केवल ऊपर रहोगे, नीचे नहीं—यदि तुम अपने परमेश्वर यहोवा की उन आज्ञाओं को सुनोगे[a], जिन्हें मैं आज तुम्हें मानने और पूरा करने की आज्ञा दे रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आज्ञा मानोगे।” इब्रानी में शाब्दिक रूप से “सुनोगे” है, पर वाचा के इस प्रसंग में इसका भाव आज्ञा मानकर चलना भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנְךָ יְהוָה
  choice: यहोवा तुम्हें ... बनाएगा
  rationale: נתן का मूल अर्थ ‘देना/रखना/ठहराना’ है, पर विधेय ‘सिर’ के साथ यहाँ किसी पद या स्थिति में स्थापित करने का कारक भाव है; ‘बनाएगा’ स्वाभाविक हिन्दी में इसे स्पष्ट रखता है।
- source_word: לְרֹאשׁ וְלֹא לְזָנָב
  choice: सिर बनाएगा, पूँछ नहीं
  rationale: ‘सिर’ और ‘पूँछ’ के मूल रूपक तथा प्रमुख और निम्न स्थिति के विरोध को बिना सपाट व्याख्या में बदले सुरक्षित रखा गया है।
- source_word: וְהָיִיתָ רַק לְמַעְלָה וְלֹא תִהְיֶה לְמָטָּה
  choice: तुम केवल ऊपर रहोगे, नीचे नहीं
  rationale: רק की अनन्यता ‘केवल’ से और למעלה/למטה के स्थान-संबंधी तथा प्रतिष्ठा-सूचक विरोध को ‘ऊपर/नीचे’ से सुरक्षित रखा गया है।
- source_word: כִּי תִשְׁמַע אֶל
  choice: यदि तुम ... सुनोगे
  rationale: כִּי आशीष की शर्त प्रस्तुत करता है, इसलिए ‘यदि’; שמע אל का शाब्दिक श्रवण-रूप ‘सुनोगे’ रखा गया है, जबकि प्रसंग में आज्ञापालन का भाव पाद-टिप्पणी में बताया गया है।
- source_word: מִצְוֺת יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा की ... आज्ञाओं
  rationale: वाचा-संबंधी संबोधन और बहुवचन ‘आज्ञाओं’ को स्वाभाविक हिन्दी पदक्रम में रखा गया है; יהוה को व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: जिन्हें मैं आज तुम्हें ... की आज्ञा दे रहा हूँ
  rationale: कृदंत के वर्तमान, जारी संबोधन का भाव ‘दे रहा हूँ’ से और व्यवस्थाविवरण में महत्त्वपूर्ण ‘आज’ को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: मानने और पूरा करने
  rationale: दोनों क्रियाओं को अलग रखा गया है। हिन्दी में आज्ञाओं के साथ ‘मानना’ सावधानी से पालन करने और ‘पूरा करना’ उन्हें व्यवहार में करने का स्वाभाविक भाव देता है।
theological_decisions:
- issue: כִּי द्वारा प्रस्तुत वाचा-संबंधी शर्त
  choice: यदि तुम ... सुनोगे
  alternative: क्योंकि तुम ... सुनोगे
  rationale: अध्याय के आशीष-वचन में यह कथन प्रतिज्ञा की शर्त बताता है। ‘यदि’ उस वाचा-संबंधी तर्क को बनाए रखता है और पाठ से आगे जाकर किसी विशिष्ट कारण-कार्य धर्मशास्त्र को आरोपित नहीं करता।
- issue: שמע אל में सुनने और आज्ञापालन का संबंध
  choice: मुख्य पाठ में ‘सुनोगे’, पाद-टिप्पणी में ‘आज्ञा मानोगे’
  alternative: मुख्य पाठ में केवल ‘आज्ञा मानोगे’
  rationale: इससे इब्रानी का श्रवण-रूपक सुरक्षित रहता है और साथ ही वाचा के प्रसंग में निहित आज्ञाकारी सुनने का अर्थ पाठक को बताया जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। समानांतर विरोध—‘सिर/पूँछ’ और ‘ऊपर/नीचे’—को संक्षिप्त, काव्यात्मक रूप में सुरक्षित रखा गया है।
