source:
  edition: WLC
  text: וְ/עָבַדְתָּ֣ אֶת אֹיְבֶ֗י/ךָ אֲשֶׁ֨ר יְשַׁלְּחֶ֤/נּוּ יְהוָה֙ בָּ֔/ךְ בְּ/רָעָ֧ב וּ/בְ/צָמָ֛א וּ/בְ/עֵירֹ֖ם וּ/בְ/חֹ֣סֶר כֹּ֑ל וְ/נָתַ֞ן עֹ֤ל בַּרְזֶל֙ עַל צַוָּארֶ֔/ךָ עַ֥ד הִשְׁמִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/048.yaml
  text: And you shall serve your enemies[a], whom Yahweh will send against you, in hunger and in thirst and in nakedness and in lack of everything[b]; and he will put an iron yoke on your neck until he has destroyed you.
translation:
  language: hi
  text: और तुम भूख, प्यास, नंगेपन और हर वस्तु के अभाव में अपने उन शत्रुओं की सेवा करोगे जिन्हें याहवे तुम्हारे विरुद्ध भेजेगा। वह तुम्हारी गर्दन पर लोहे का जूआ रखेगा, जब तक कि वह तुम्हें नष्ट न कर दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी को इस अर्थ में भी समझा जा सकता है कि शत्रु ही लोहे का जूआ रखेगा और तुम्हें नष्ट करेगा। मुख्य पाठ में पिछले खंड के कर्ता याहवे को ही आगे भी कर्ता माना गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַדְתָּ
  choice: तुम ... सेवा करोगे
  rationale: यहाँ עבד उपासना नहीं, बल्कि शत्रुओं के अधीन बाध्य सेवा को दर्शाता है। भविष्यकालीन रूप वाचा के शाप की भविष्यसूचक घोषणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֹיְבֶיךָ
  choice: अपने ... शत्रुओं
  rationale: אֹיֵב का सीधा अर्थ शत्रु या विरोधी है; ‘शत्रुओं’ से सम्बन्ध और बहुवचन दोनों स्पष्ट रहते हैं।
- source_word: אֲשֶׁר יְשַׁלְּחֶנּוּ יְהוָה בָּךְ
  choice: जिन्हें याहवे तुम्हारे विरुद्ध भेजेगा
  rationale: בָּךְ यहाँ शत्रुतापूर्ण दिशा या कार्रवाई बताता है; ‘तुम्हारे विरुद्ध’ आधुनिक हिन्दी में इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम को पदवी से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: בְּרָעָב וּבְצָמָא וּבְעֵירֹם וּבְחֹסֶר כֹּל
  choice: भूख, प्यास, नंगेपन और हर वस्तु के अभाव में
  rationale: समानान्तर בְּ-रूप सेवा की दयनीय दशाएँ बताते हैं। ‘नंगेपन’ वस्त्रहीनता की तीव्रता और ‘हर वस्तु के अभाव’ חֹסֶר כֹּל की व्यापकता बनाए रखते हैं।
- source_word: וְנָתַן עֹל בַּרְזֶל עַל צַוָּארֶךָ
  choice: वह तुम्हारी गर्दन पर लोहे का जूआ रखेगा
  rationale: ‘लोहे का जूआ’ कठोर दासता के ठोस रूपक को सुरक्षित रखता है और हिन्दी में स्वाभाविक है।
- source_word: עַד הִשְׁמִידוֹ אֹתָךְ
  choice: जब तक कि वह तुम्हें नष्ट न कर दे
  rationale: שׁמד का हिफ़ील रूप पूर्ण विनाश का कठोर भाव रखता है; हिन्दी संरचना सीमा और परिणति दोनों को व्यक्त करती है।
theological_decisions:
- issue: וְנָתַן और הִשְׁמִידוֹ के कर्ता की पहचान
  choice: मुख्य पाठ में याहवे को पहले खंड से जारी कर्ता माना गया है।
  alternative: 'शत्रु अथवा शत्रु-राष्ट्र को कर्ता माना जा सकता है: ‘वे/वह ... रखेंगे/रखेगा ... नष्ट कर देंगे/देगा।’'
  rationale: निकटतम स्पष्ट एकवचन कर्ता יְהוָה है और आगे के एकवचन क्रियारूप उसके साथ सहज रूप से चलते हैं। फिर भी इब्रानी में व्यक्त सर्वनाम न होने के कारण शत्रु को कर्ता समझना व्याकरणतः सम्भव है; इसलिए यह वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित रखी गई है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उस नाम को पदवी में बदले बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। अभावों की क्रमिक सूची और ‘लोहे का जूआ’ रूपक की कठोरता को बिना नरम किए सुरक्षित रखा गया है।
