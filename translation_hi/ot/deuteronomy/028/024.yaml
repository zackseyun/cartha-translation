base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/024.yaml
  text: Yahweh will make the rain of your land dust and powder[a]; from the heavens it will come down on you until you are destroyed.
translation:
  language: hi
  text: याहवे तुम्हारी भूमि की वर्षा को धूल और मिट्टी[a] बना देगा; वह आकाश से तुम पर बरसेगी, जब तक कि तुम नष्ट न हो जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बारीक धूल और सूखी मिट्टी।’ इब्रानी में सूखे कणों के लिए दो निकटार्थक शब्द हैं, जो वर्षा के स्थान पर सूखे और विनाश की छवि को तीव्र करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: יִתֵּן
  choice: बना देगा
  rationale: क्रिया का मूल अर्थ ‘देना’ है, पर इस प्रसंग में वह वर्षा को धूल-मिट्टी बना देने के परिणामसूचक अर्थ में प्रयुक्त है।
- source_word: מְטַר אַרְצְךָ
  choice: तुम्हारे देश की वर्षा
  rationale: इब्रानी संबंध-रचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אָבָק וְעָפָר
  choice: धूल और मिट्टी
  rationale: दो निकटार्थक शब्दों को अलग रखते हुए सूखे कणों और भूमि की विनाशकारी छवि सुरक्षित रखी गई है।
- source_word: מִן הַשָּׁמַיִם
  choice: आकाश से
  rationale: इब्रानी बहुवचन-रूप का हिन्दी में स्वाभाविक अर्थ ‘आकाश से’ है; ‘आकाशों से’ यहाँ असहज होता।
- source_word: יֵרֵד עָלֶיךָ
  choice: तुम पर ... बरसती रहेगी
  rationale: शाब्दिक ‘उतरेगी’ की अपेक्षा वर्षा और धूल-मिट्टी के प्रसंग में यह स्वाभाविक है तथा निरंतर विपत्ति की छवि स्पष्ट करता है।
- source_word: עַד הִשָּׁמְדָךְ
  choice: जब तक तुम नष्ट न हो जाओ
  rationale: संक्षिप्त इब्रानी infinitive construction का परिणाम बिना किसी अनुल्लिखित कर्ता को जोड़कर स्पष्ट किया गया है।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत नाम को सुरक्षित रखा गया है; उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: विनाश का कर्ता
  choice: निष्क्रिय वाक्यांश—‘तुम नष्ट न हो जाओ’
  alternative: ‘जब तक वह तुम्हें नष्ट न कर दे’
  rationale: अंतिम इब्रानी पदबंध विनाश का परिणाम बताता है, पर इस उपवाक्य में कर्ता को स्पष्ट नहीं करता; इसलिए अनावश्यक रूप से स्पष्ट कर्ता नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बरसती रहेगी’ वर्षा के उलटकर धूल-मिट्टी बन जाने की काव्यात्मक विडंबना को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
