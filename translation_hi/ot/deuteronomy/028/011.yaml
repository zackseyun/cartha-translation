source:
  edition: WLC
  text: וְ/הוֹתִֽרְ/ךָ֤ יְהוָה֙ לְ/טוֹבָ֔ה בִּ/פְרִ֧י בִטְנְ/ךָ֛ וּ/בִ/פְרִ֥י בְהַמְתְּ/ךָ֖ וּ/בִ/פְרִ֣י אַדְמָתֶ֑/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/011.yaml
  text: And Yahweh will make you abound in prosperity[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground[c][b], on the land that Yahweh swore to your fathers to give you.
translation:
  language: hi
  text: और याहवे तुम्हें बहुतायत से समृद्ध करेगा[a]—तुम्हारी संतान में[b], तुम्हारे पशुओं की संतति में, और तुम्हारी भूमि की उपज में[c]—उस देश में जिसे तुम्हें देने की शपथ याहवे ने तुम्हारे पूर्वजों से खाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी भलाई के लिए तुम्हें बहुतायत देगा,” अथवा “तुम्हारा कल्याण करेगा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तुम्हारे गर्भ के फल में”; अर्थात तुम्हारी संतान में।
    reason: lexical_alternative
  - marker: c
    text: या, “तुम्हारी मिट्टी की पैदावार में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִרְךָ
  choice: तुम्हें समृद्धि से भर देगा
  rationale: יתר के हिफ़ील रूप में कारणवाचक भाव और बहुतायत/अधिशेष का अर्थ है। यह अभिव्यक्ति परमेश्वर द्वारा लाभकारी प्रचुरता दिए जाने का भाव स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: לְטוֹבָה
  choice: समृद्धि से
  rationale: शाब्दिक अर्थ ‘भलाई के लिए’ है; आशीष के इस प्रसंग में यह कल्याणकारी बहुतायत को सूचित करता है। वैकल्पिक अर्थ फुटनोट में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בִּפְרִי בִטְנְךָ
  choice: तुम्हारी संतान में
  rationale: शाब्दिक मुहावरा ‘तुम्हारे गर्भ के फल में’ है। आधुनिक हिन्दी में ‘संतान’ उसका स्पष्ट और स्वाभाविक अर्थ देता है; मूल बिंब फुटनोट में सुरक्षित है।
- source_word: וּבִפְרִי בְהַמְתְּךָ
  choice: तुम्हारे पशुओं की संतति में
  rationale: यह पालतू पशुओं से होने वाली वृद्धि को सूचित करता है। ‘पशुओं की संतति’ हिन्दी में स्पष्ट है और जनन/वृद्धि का भाव बनाए रखता है।
- source_word: וּבִפְרִי אַדְמָתֶךָ
  choice: तुम्हारी भूमि की उपज में
  rationale: אדמה यहाँ खेती की मिट्टी/भूमि को दर्शाता है और פרי उसकी पैदावार को। ‘भूमि की उपज’ स्वाभाविक कृषि-संबंधी हिन्दी है।
- source_word: עַל הָאֲדָמָה
  choice: उस देश में
  rationale: यहाँ वही प्रतिज्ञात भूभाग अभिप्रेत है जहाँ आशीष पूरी होगी। हिन्दी में स्थान के लिए ‘देश में’ प्रसंगानुकूल है।
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: जिसे तुम्हें देने की शपथ यहोवा ने तुम्हारे पूर्वजों से खाई थी
  rationale: यह संबंधवाचक उपवाक्य देश को विशेषित करता है और पूर्वजों से की गई शपथ तथा वर्तमान संबोधित व्यक्ति को देश दिए जाने—दोनों को बनाए रखता है।
theological_decisions:
- issue: वाचा के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। हिन्दी पाठकों के लिए प्रचलित और पहचाना हुआ लिप्यंतरण ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: ‘गर्भ के फल’ मुहावरे को पाठ में शाब्दिक रखना या अर्थ स्पष्ट करना
  choice: मुख्य पाठ में ‘संतान’, फुटनोट में शाब्दिक रूप
  alternative: तुम्हारे गर्भ का फल
  rationale: ‘संतान’ सामान्य आधुनिक हिन्दी में तत्काल स्पष्ट है। शाब्दिक बिंब और मूल की अर्थगत बनावट को फुटनोट में सुरक्षित रखा गया है, जिससे व्याख्यात्मक जानकारी नहीं खोती।
- issue: לְטוֹבָה के व्यापक अर्थ को कैसे व्यक्त किया जाए
  choice: मुख्य पाठ में ‘समृद्धि’, फुटनोट में ‘भलाई/कल्याण’
  alternative: तुम्हारी भलाई के लिए
  rationale: आगे संतान, पशुधन और उपज की ठोस आशीषें होने के कारण ‘समृद्धि’ प्रसंगानुकूल है; फिर भी इब्रानी पद का व्यापक ‘भलाई/कल्याण’ अर्थ फुटनोट में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। एकवचन ‘तुम’ मूल के एकवचन संबोधन को दर्शाता है। समानांतर तीन क्षेत्रों को डैशों के भीतर रखा गया है ताकि आशीष की सूची स्पष्ट रहे।
