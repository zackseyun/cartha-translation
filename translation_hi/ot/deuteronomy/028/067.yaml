base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/067.yaml
  text: In the morning you will say[a], “If only it were evening!” and in the evening you will say, “If only it were morning!” because of the dread of your heart that you will dread[b], and because of the sight your eyes will see.
translation:
  language: hi
  text: सुबह तुम कहोगे[a], “काश शाम हो जाती!” और शाम को तुम कहोगे, “काश सुबह हो जाती!”—तुम्हारे मन के उस भय के कारण जिससे तुम भयभीत होगे[b], और उस दृश्य के कारण जिसे तुम्हारी आँखें देखेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक इब्रानी: “कौन शाम/सुबह देगा?” यह तीव्र इच्छा व्यक्त करने वाला मुहावरा है; इसलिए “काश शाम/सुबह हो जाती!”'
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारे मन में छाए भय के कारण ...”; इब्रानी में ‘भय’ और ‘भयभीत होना’ एक ही मूल शब्द से जुड़े हैं।
    reason: lexical_alternative
