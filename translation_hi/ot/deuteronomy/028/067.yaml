  register: आधुनिक मानक हिन्दी; शैली सहज किंतु गरिमापूर्ण है। एकवचन पुल्लिंग संबोधन को ‘तुम’ से व्यक्त किया गया है। इब्रानी समानांतरता, भय की पुनरुक्ति और आँखों से देखने की सजीवता को प्राकृतिक हिन्दी की सीमा में सुरक्षित रखा गया है।
