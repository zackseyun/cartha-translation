- source_word: תֹּאמַר
  choice: तुम कहोगे
  rationale: इस शाप-वर्णन में क़ाल अपूर्ण 2 पुल्लिंग एकवचन भविष्यवाणी व्यक्त करता है।
- source_word: מִי יִתֵּן
  choice: काश ... हो जाती
  rationale: यह शाब्दिक प्रश्न नहीं, तीव्र इच्छा व्यक्त करने वाला इब्रानी मुहावरा है।
- source_word: עֶרֶב / בֹּקֶר
  choice: शाम / सुबह
  rationale: दोनों कालवाचक संज्ञाओं के विरोधी समानांतर को सहज हिन्दी में बनाए रखता है।
- source_word: מִפַּחַד לְבָבְךָ אֲשֶׁר תִּפְחָד
  choice: उस भय के कारण जिससे तुम्हारा मन भयभीत होगा
  rationale: מִן का कारणवाचक अर्थ रखता है और संज्ञा तथा क्रिया की इब्रानी पुनरुक्ति को हिन्दी में यथासंभव सुरक्षित रखता है; לֵבָב यहाँ आंतरिक मन को सूचित करता है।
- source_word: וּמִמַּרְאֵה עֵינֶיךָ אֲשֶׁר תִּרְאֶה
  choice: और उन दृश्यों के कारण जिन्हें तुम्हारी आँखें देखेंगी
  rationale: מַרְאֶה को भयावह दिखाई देने वाली बातों के अर्थ में बहुवचन 'दृश्यों' से स्वाभाविक रूप देता है और आँखों की सजीव अभिव्यक्ति बनाए रखता है।
