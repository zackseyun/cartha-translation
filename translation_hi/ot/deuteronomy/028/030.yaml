source:
  edition: WLC
  text: אִשָּׁ֣ה תְאָרֵ֗שׂ וְ/אִ֤ישׁ אַחֵר֙ ישגל/נה בַּ֥יִת תִּבְנֶ֖ה וְ/לֹא תֵשֵׁ֣ב בּ֑/וֹ כֶּ֥רֶם תִּטַּ֖ע וְ/לֹ֥א תְחַלְּלֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/030.yaml
  text: You will become engaged to a wife[a], but another man will lie with her; you will build a house, but you will not live in it; you will plant a vineyard[c][b], but you will not begin to use its fruit.
translation:
  language: hi
  text: तुम एक स्त्री से मंगनी करोगे[a], पर कोई दूसरा पुरुष उसके साथ संभोग करेगा[b]; तुम घर बनाओगे, पर उसमें नहीं रहोगे; तुम अंगूर की बारी लगाओगे, पर उसके फल का उपभोग आरम्भ नहीं करोगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'और अधिक औपचारिक रूप में: “तुम एक स्त्री से विवाह की प्रतिज्ञा करोगे।”'
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी क्रिया यौन सम्बन्ध के लिए एक कठोर और भोंडा शब्द है। इसका अनुवाद “उसका बलात्कार करेगा” भी किया गया है, पर क्रिया का यह रूप अपने आप में बल प्रयोग को स्पष्ट रूप से निश्चित नहीं करता।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप में, “उसे अपवित्र अर्थात् सामान्य उपयोग के लिए नहीं करोगे।” यह अंगूर की बारी के फल को सामान्य उपभोग में लाना आरम्भ करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאָרֵשׂ אִשָּׁה
  choice: एक स्त्री से मंगनी करोगे
  rationale: यह पदबंध विवाह से पहले की औपचारिक प्रतिज्ञा को दर्शाता है। आधुनिक हिन्दी में ‘मंगनी करना’ स्वाभाविक और स्पष्ट है; ‘विवाह करना’ चरणों के भेद को मिटा देता।
- source_word: אִישׁ אַחֵר
  choice: कोई दूसरा पुरुष
  rationale: यह सम्बोधित व्यक्ति के विपरीत एक अन्य पुरुष को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ישגלנה
  choice: उसके साथ संभोग करेगा
  rationale: मूल क्रिया यौन सम्बन्ध के लिए कठोर और स्पष्ट शब्द है। ‘संभोग करेगा’ यौन कृत्य को अस्पष्ट नहीं बनाता, पर क्रिया के इस रूप से बलपूर्वक किए जाने की बात स्वतः निश्चित भी नहीं करता।
- source_word: תֵשֵׁב בּוֹ
  choice: उसमें नहीं रहोगे
  rationale: घर के सन्दर्भ में ישב का अर्थ उसमें निवास करना है; ‘रहना’ आधुनिक हिन्दी का सहज रूप है।
- source_word: כֶּרֶם
  choice: अंगूर की बारी
  rationale: यह כרם का प्रचलित, स्पष्ट हिन्दी अर्थ है और केवल किसी सामान्य बगीचे के बजाय अंगूर उगाने की जगह को बताता है।
- source_word: תְחַלְּלֶנּוּ
  choice: उसके फल का उपभोग आरम्भ नहीं करोगे
  rationale: इस सन्दर्भ में क्रिया अंगूर की बारी की उपज को सामान्य उपयोग में लाना आरम्भ करने का पारिभाषिक भाव रखती है। यह अनुवाद अस्पष्ट शाब्दिक ‘अपवित्र करना’ से अधिक बोधगम्य है।
theological_decisions:
- issue: ישגלנה में बल प्रयोग का प्रश्न
  choice: मुख्य पाठ में यौन कृत्य को स्पष्ट रखा गया, पर बल प्रयोग को निश्चित नहीं किया गया
  alternative: ‘उसका बलात्कार करेगा’ अथवा ‘उसे भ्रष्ट करेगा’
  rationale: क्रिया कठोर और अशिष्ट यौन शब्द है, किन्तु इसका यह रूप अपने आप में बल प्रयोग को निर्विवाद रूप से व्यक्त नहीं करता। इसलिए अर्थ की कठोरता बनाए रखते हुए सम्भावित हिंसा को न तो नकारा गया है, न पाठ में जोड़कर निश्चित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानान्तर वाक्य-रचना से मूल पद की तीन विपत्तियों का क्रम सुरक्षित है। यौन क्रिया को अनावश्यक शिष्टोक्ति से नहीं ढका गया, फिर भी हिन्दी में अश्लीलता से बचते हुए उसकी कठोर स्पष्टता बनाए रखी गई है।
