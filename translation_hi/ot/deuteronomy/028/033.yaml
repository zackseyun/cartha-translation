base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/033.yaml
  text: A people whom you have not known will eat the fruit of your land and all your labor[b][a], and you will be only oppressed and crushed all your days.
translation:
  language: hi
  text: एक ऐसी जाति, जिसे तू नहीं जानता, तेरी भूमि की उपज[a] और तेरे सारे परिश्रम की उपज[b] खा जाएगी; और तू जीवन भर केवल उत्पीड़ित और कुचला हुआ रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तेरी भूमि का फल।”
    reason: lexical_alternative
  - marker: b
    text: या “तेरा सारा परिश्रम।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי אַדְמָתְךָ
  choice: तेरी भूमि की उपज
  rationale: शाब्दिक चित्र ‘तेरी भूमि का फल’ है; कृषि-संदर्भ में ‘उपज’ आधुनिक हिन्दी में अधिक स्वाभाविक है और भूमि से मिलने वाली पैदावार के व्यापक अर्थ को बनाए रखता है।
- source_word: יְגִיעֲךָ
  choice: तेरी सारी मेहनत की कमाई
  rationale: यह संज्ञा मेहनत, परिश्रम अथवा उससे प्राप्त फल को सूचित कर सकती है। ‘खा जाएगी’ के साथ ‘मेहनत की कमाई’ स्वाभाविक है और आशय स्पष्ट करती है कि दूसरे लोग उसके परिश्रम से प्राप्त वस्तुएँ भोगेंगे।
- source_word: יֹאכַל
  choice: खा जाएगी
  rationale: स्रोत के सामान्य क्रिया-रूप ‘खाना’ को बनाए रखा गया है; सामूहिक एकवचन ‘जाति’ के अनुसार क्रिया एकवचन स्त्रीलिंग है।
- source_word: עַם
  choice: एक ऐसी जाति
  rationale: यह एकवचन सामूहिक संज्ञा किसी पराए जनसमूह को दर्शाती है। ‘जाति’ यहाँ सामाजिक जाति-वर्ग नहीं, बल्कि ‘लोगों/राष्ट्र’ के अर्थ में प्रयुक्त बाइबिलीय हिन्दी है और एकवचन रूप बनाए रखती है।
- source_word: אֲשֶׁר לֹא יָדָעְתָּ
  choice: जिसे तू नहीं जानता
  rationale: यह अनजान विदेशी जनसमूह का संकेत देता है। हिन्दी वर्तमान रूप स्रोत के पूर्व-अपरिचय और मौजूदा अनजानपन दोनों को सहज रूप से व्यक्त करता है।
- source_word: רַק
  choice: बस
  rationale: यह अनवरत और निरपवाद दशा पर बल देता है। ‘बस’ सहज आधुनिक हिन्दी में ‘केवल’ का वही बल देता है।
- source_word: עָשׁוּק
  choice: सताया जाता
  rationale: निष्क्रिय रूप अन्याय, शोषण अथवा अत्याचार सहने की दशा बताता है। ‘सताया जाता’ साधारण पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: רָצוּץ
  choice: कुचला जाता
  rationale: यह टूट जाने या दबाकर चूर किए जाने का प्रबल चित्र रखता है; ‘कुचला’ उस तीव्रता को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: כָּל הַיָּמִים
  choice: जीवन भर
  rationale: शाब्दिक ‘सारे दिन’ यहाँ लगातार अथवा जीवनपर्यंत दशा का मुहावरा है। ‘जीवन भर’ आधुनिक हिन्दी में उसका स्वाभाविक अर्थ देता है।
