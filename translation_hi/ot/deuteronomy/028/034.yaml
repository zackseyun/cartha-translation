  register: आधुनिक मानक हिन्दी; सरल, गंभीर और प्रत्यक्ष शैली। मूल में ‘देखने/दृश्य’ की पुनरुक्ति का भाव ‘आँखें देखेंगी’ और ‘देखकर’ द्वारा सुरक्षित रखा गया है, जबकि अत्यधिक कृत्रिम शब्दक्रम से बचा गया है।
