  text: וְ/הָיִ֖יתָ מְשֻׁגָּ֑ע מִ/מַּרְאֵ֥ה עֵינֶ֖י/ךָ אֲשֶׁ֥ר תִּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/034.yaml
  text: And you will be driven mad by the sight your eyes see[a].
translation:
  language: hi
  text: और जो कुछ तुम्हारी आँखें देखेंगी, उसे देखकर तुम पागल हो जाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: और ... तुम ... हो जाओगे
  rationale: श्रापों की इस शृंखला में संयोजक सहित पूर्ण क्रिया भविष्य के परिणाम को व्यक्त करती है; ‘हो जाओगे’ परिवर्तन और परिणाम—दोनों को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: מְשֻׁגָּע
  choice: पागल
  rationale: यह שׁגע से बना रूप विक्षिप्त हो जाने की दशा बताता है। ‘पागल हो जाओगे’ आधुनिक सामान्य हिन्दी में स्वाभाविक है और परिणामात्मक भाव बनाए रखता है।
- source_word: מִמַּרְאֵה
  choice: उसे देखकर
  rationale: यहाँ מִן कारण दर्शाता है—दिखाई देने वाला दृश्य विक्षिप्तता का कारण होगा। ‘उसे देखकर’ इस कारणात्मक संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: עֵינֶיךָ
  choice: तुम्हारी आँखें
  rationale: मूल की ठोस, दृश्येंद्रिय-संबंधी अभिव्यक्ति को बनाए रखा गया है।
- source_word: אֲשֶׁר תִּרְאֶה
  choice: जो कुछ ... देखेंगी
  rationale: सापेक्ष उपवाक्य उस दृश्य को स्पष्ट करता है जिसे संबोधित व्यक्ति देखेगा। हिन्दी में आँखों के साथ बहुवचन स्त्रीलिंग क्रिया स्वाभाविक है; ‘जो कुछ’ भयावह दृश्यों की अनिर्दिष्ट व्यापकता बनाए रखता है।
theological_decisions: []
