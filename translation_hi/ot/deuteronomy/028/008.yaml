source:
  edition: WLC
  text: יְצַ֨ו יְהוָ֤ה אִתְּ/ךָ֙ אֶת הַ/בְּרָכָ֔ה בַּ/אֲסָמֶ֕י/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֣ח יָדֶ֑/ךָ וּ/בֵ֣רַכְ/ךָ֔ בָּ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/008.yaml
  text: Yahweh will command the blessing on you in your storehouses and in all the work of your hand[c][b][a], and he will bless you in the land that Yahweh your God is giving you.
translation:
  language: hi
  text: याहवे तेरे भंडारों[a] में और तेरे हाथ के हर काम[b] में आशीष की आज्ञा देगा, और उस देश में तुझे आशीष देगा जिसे याहवे तेरा परमेश्वर तुझे दे रहा है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरे अन्न-भंडारों में’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘तेरे हाथ के हर भेजे जाने में’; यह तेरे सभी कामों या उपक्रमों के लिए एक मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या ‘तुझे देता है’ अथवा ‘तुझे देगा’। यहाँ प्रयुक्त इब्रानी कृदंत का अनुवाद एक से अधिक प्रकार से किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְצַו
  choice: आज्ञा देगा
  rationale: पिएल रूप का सामान्य अर्थ ‘आज्ञा देना’ है। यह आशीष को नियुक्त करने की इब्रानी अभिव्यक्ति की सजीवता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: אִתְּךָ אֶת־הַבְּרָכָה
  choice: पर आशीष की आज्ञा देगा
  rationale: צוה के साथ यह रचना आशीष को संबोधित व्यक्ति और उसके कामों पर नियुक्त किए जाने का भाव देती है; हिंदी में ‘पर ... की आज्ञा देगा’ मूल बिंब को सुरक्षित रखता है।
- source_word: בַּאֲסָמֶיךָ
  choice: तेरे भंडारों
  rationale: אָסָם अनाज अथवा उपज रखने के भंडार को दर्शाता है। ‘भंडार’ व्यापक, स्वाभाविक और आधुनिक हिंदी शब्द है।
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: और तेरे हाथ के हर काम
  rationale: शाब्दिक बिंब ‘हाथ को भेजना/लगाना’ है और यह सभी कामों या उपक्रमों का मुहावरा है। ‘हाथ के हर काम’ बिंब तथा अर्थ दोनों बनाए रखता है।
- source_word: וּבֵרַכְךָ
  choice: और ... तुझे आशीष देगा
  rationale: वाव-संयुक्त पूर्ण क्रिया पूर्ववर्ती भविष्यकालीन भाव को आगे बढ़ाती है; कर्ता याहवे ही रहता है।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: व्यवस्थाविवरण में यह वाचा के अंतर्गत दिए जाने वाले विशिष्ट देश को सूचित करता है; ‘उस देश’ हिंदी में निश्चितता और वाचागत संदर्भ दोनों व्यक्त करता है।
- source_word: נֹתֵן לָךְ
  choice: तुझे दे रहा है
  rationale: इब्रानी कृदंत जारी अथवा निकटवर्ती क्रिया का भाव दे सकता है। ‘दे रहा है’ उसकी पक्षगत सजीवता को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: व्यक्तिगत वाचा-नाम को शीर्षक से प्रतिस्थापित किए बिना लिप्यंतरित किया गया है; इससे पाठ में नाम और उपाधि का भेद बना रहता है।
- issue: הָאָרֶץ की वाचागत बारीकी
  choice: उस देश में
  alternative: धरती में अथवा देश में
  rationale: संदर्भ इस्राएल को दिए जा रहे विशिष्ट देश का है। ‘उस देश’ यह संकेत सुरक्षित रखता है, पर पाठ में ‘प्रतिज्ञात देश’ जैसी व्याख्यात्मक वृद्धि नहीं करता।
- issue: आशीष को ‘आज्ञा देने’ की अभिव्यक्ति
  choice: आशीष की आज्ञा देगा
  alternative: आशीष भेजेगा अथवा आशीष ठहराएगा
  rationale: मूल पाठ की असामान्य किंतु प्रभावशाली अभिव्यक्ति को सहज बनाने के नाम पर हटाया नहीं गया; यह परमेश्वर के अधिकारपूर्वक आशीष नियुक्त करने का भाव रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। एकवचन संबोधन के लिए ‘तू/तेरा’ के पारंपरिक बाइबलीय रूप को रखा गया है, पर वाक्य-विन्यास को स्वाभाविक बनाया गया है। मूल के ‘आशीष की आज्ञा’ और ‘हाथ के काम’ जैसे ठोस बिंब सुरक्षित रखे गए हैं।
