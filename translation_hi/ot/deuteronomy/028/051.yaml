language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ֠/אָכַל פְּרִ֨י בְהֶמְתְּ/ךָ֥ וּ/פְרִֽי אַדְמָתְ/ךָ֮ עַ֣ד הִשָּֽׁמְדָ/ךְ֒ אֲשֶׁ֨ר לֹֽא יַשְׁאִ֜יר לְ/ךָ֗ דָּגָן֙ תִּיר֣וֹשׁ וְ/יִצְהָ֔ר שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּרֹ֣ת צֹאנֶ֑/ךָ עַ֥ד הַאֲבִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/051.yaml
  text: It will consume the offspring of your livestock and the produce of your land until you are destroyed; it will leave you no grain[a], new wine, or oil, no calves of your herd or lambs of your flock, until it has destroyed you.
translation:
  language: hi
  text: वह तुम्हारे पशुओं की सन्तान और तुम्हारी भूमि की उपज को तब तक खा जाएगा, जब तक तुम नष्ट न हो जाओ। वह तुम्हारे लिए अनाज, नया दाखरस या तेल, और तुम्हारे गाय-बैलों के बछड़े या तुम्हारी भेड़-बकरियों के बच्चे[a] नहीं छोड़ेगा, जब तक वह तुम्हें नाश न कर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी भेड़-बकरियों की बढ़ोतरी।” इब्रानी अभिव्यक्ति झुंड की प्रजनन-वृद्धि या उससे होने वाली बढ़ोतरी को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: खाता रहेगा
  rationale: मूल क्रिया का अर्थ ‘खाना’ है; इस शाप के प्रसंग में निरन्तर संसाधन-क्षय और आक्रमणकारी राष्ट्र की कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פְּרִי בְהֶמְתְּךָ
  choice: तुम्हारे पशुओं की सन्तान
  rationale: पशुओं के साथ פְּרִי रूपक रूप में उनकी सन्तान को दर्शाता है, और בְּהֵמָה घरेलू पशुओं का व्यापक शब्द है।
- source_word: וּפְרִי אַדְמָתְךָ
  choice: तुम्हारी भूमि की उपज
  rationale: यह पद कृषि से मिलने वाली पैदावार को सूचित करता है; ‘भूमि की उपज’ सहज और सटीक है।
- source_word: עַד הִשָּׁמְדָךְ
  choice: जब तक तुम नष्ट न हो जाओ
  rationale: प्रत्यययुक्त क्रियारूप भक्षण की चरम परिणति को निष्क्रिय अर्थ में व्यक्त करता है।
- source_word: אֲשֶׁר לֹא יַשְׁאִיר לְךָ
  choice: वह तुम्हारे लिए ... नहीं छोड़ेगा
  rationale: सम्बन्धवाचक उपवाक्य आक्रमणकारी के द्वारा पूर्ण अभाव उत्पन्न करने की कार्रवाई को आगे बढ़ाता है।
- source_word: דָּגָן
  choice: अनाज
  rationale: यह सामान्य रूप से अन्न अथवा धान्य की फसल को दर्शाता है।
- source_word: תִּירוֹשׁ
  choice: नया दाखरस
  rationale: यह ताजा उत्पादित दाखरस या नई मदिरा को सूचित करता है; ‘नया दाखरस’ मूल की विशिष्टता बनाए रखता है।
- source_word: יִצְהָר
  choice: तेल
  rationale: अनाज और दाखरस की पारम्परिक त्रयी में इसका संकेत जैतून के तेल की ओर है; हिन्दी में ‘तेल’ पर्याप्त और प्रचलित है।
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: तुम्हारे गोधन के बछड़े
  rationale: שְׁגַר मवेशियों से उत्पन्न बच्चों को और אֲלָפִים बड़े पालतू मवेशियों को दर्शाता है; ‘गोधन के बछड़े’ स्वाभाविक हिन्दी है।
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: तुम्हारी भेड़-बकरियों के बच्चे[a]
  rationale: इस दुर्लभ अभिव्यक्ति का आशय झुंड की प्रजनन-वृद्धि या उससे उत्पन्न बच्चों से है। मुख्य पाठ अर्थ को सहज रूप में देता है और व्यापक विकल्प पादटिप्पणी में रखा गया है।
- source_word: עַד הַאֲבִידוֹ אֹתָךְ
  choice: जब तक वह तुम्हें नाश न कर दे
  rationale: אבד का हिफ़ईल रूप कारणात्मक है—‘नाश कर देना’—और अन्तिम परिणाम को व्यक्त करता है।
theological_decisions:
- issue: एकवचन कर्ता की पहचान
  choice: ‘वह’ द्वारा पिछले पद के आक्रमणकारी राष्ट्र का संकेत बनाए रखा गया है
  alternative: कर्त्ता को स्पष्ट करते हुए ‘वह राष्ट्र’ दोहराना
  rationale: इब्रानी में कर्त्ता निहित एकवचन है और पिछले सन्दर्भ से समझा जाता है; सर्वनाम मूल की पाठगत संगति और कुछ हद तक उसकी अन्तर्निहितता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गम्भीर किन्तु सामान्य पाठक के लिए सुबोध रखी गई है। ‘दाखरस’ और ‘गोधन’ कृषि-सांस्कृतिक सन्दर्भ में संक्षिप्त तथा परिचित शब्द हैं।
