base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/026.yaml
  text: Your carcass will become food for every bird of the sky and for the beasts of the earth[c][b][a], and there will be no one to frighten them away.
translation:
  language: hi
  text: तेरी लाश आकाश के सब पक्षियों और धरती के पशुओं का आहार बन जाएगी[a], और उन्हें डराकर भगाने वाला कोई न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लाश’ के लिए प्रयुक्त इब्रानी शब्द में इस न्याय-प्रसंग में अपमान और अनादर का कठोर भाव है। आकाश के पक्षियों और धरती के पशुओं का उल्लेख देह के पूरी तरह असुरक्षित और बेइज़्ज़त पड़े रहने पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: बन जाएगी
  rationale: शापों के इस प्रसंग में यह आगामी परिणाम व्यक्त करता है; לְמַאֲכָל के साथ ‘आहार बन जाएगी’ स्वाभाविक हिन्दी है।
- source_word: נִבְלָתְךָ
  choice: तेरी लाश
  rationale: यह मृत देह के लिए प्रयुक्त शब्द है और यहाँ अपमानजनक न्याय का कठोर भाव रखता है; ‘लाश’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से तीखा है।
- source_word: לְמַאֲכָל
  choice: आहार
  rationale: इसका अर्थ भोजन या खाई जाने वाली वस्तु है; ‘आहार बन जाएगी’ परिणामसूचक रचना को स्पष्ट रखता है।
- source_word: לְכָל עוֹף הַשָּׁמַיִם
  choice: आकाश के सब पक्षियों
  rationale: עוֹף सामूहिक अर्थ में उड़ने वाले जीवों को सूचित करता है; प्रसंग में ‘पक्षियों’ स्वाभाविक है और ‘आकाश’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: और धरती के पशुओं
  rationale: בְּהֵמָה यहाँ सामूहिक रूप से स्थल के पशुओं को दर्शाता है; यह आकाश और धरती की मूल जोड़ी भी बनाए रखता है।
- source_word: וְאֵין מַחֲרִיד
  choice: और उन्हें डराकर भगाने वाला कोई न होगा
  rationale: हिफ़ील कृदंत किसी को भयभीत करने का भाव देता है; प्रसंग से निहित पक्षियों और पशुओं को हिन्दी में स्पष्ट करना वाक्य को सहज बनाता है।
