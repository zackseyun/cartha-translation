source:
  edition: WLC
  text: וְ֠/הָיָה כַּ/אֲשֶׁר שָׂ֨שׂ יְהוָ֜ה עֲלֵי/כֶ֗ם לְ/הֵיטִ֣יב אֶתְ/כֶם֮ וּ/לְ/הַרְבּ֣וֹת אֶתְ/כֶם֒ כֵּ֣ן יָשִׂ֤ישׂ יְהוָה֙ עֲלֵי/כֶ֔ם לְ/הַאֲבִ֥יד אֶתְ/כֶ֖ם וּ/לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וְ/נִסַּחְתֶּם֙ מֵ/עַ֣ל הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/063.yaml
  text: And it shall be that[a], just as Yahweh rejoiced over you to do you good and to multiply you, so Yahweh will rejoice over you to destroy you and to wipe you out[b]; and you will be torn away from upon the land that you are entering there to possess it.
translation:
  language: hi
  text: और ऐसा होगा कि जैसे याहवे ने तुम्हारा भला करने और तुम्हारी संख्या बढ़ाने में आनन्द किया था, वैसे ही याहवे तुम्हें नष्ट करने और मिटा देने में आनन्द करेगा। और तुम उस भूमि पर से उखाड़ दिए जाओगे[a], जिसे अपने अधिकार में लेने के लिए तुम[b] वहाँ प्रवेश कर रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस क्रिया का अर्थ ‘बलपूर्वक हटा दिए जाओगे’ भी हो सकता है। ‘उखाड़ दिए जाओगे’ भूमि से पूरी तरह अलग कर दिए जाने की छवि व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ इब्रानी में ‘तुम’ एकवचन है; इस्राएल को एक ही प्रजा मानकर संबोधित किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा कि
  rationale: यह भविष्य में आने वाले परिणाम का परिचय देता है और आधुनिक हिन्दी में स्वाभाविक रहते हुए इब्रानी सूत्र की औपचारिकता बनाए रखता है।
- source_word: שָׂשׂ / יָשִׂישׂ
  choice: आनन्दित हुआ था / आनन्दित होगा
  rationale: दोनों रूपों के लिए एक ही हिन्दी मूल रखकर आशीष और न्याय के बीच जानबूझकर बनाई गई अलंकारिक समानता सुरक्षित रखी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परियोजना की नीति के अनुसार परमेश्वर के वाचा-नाम का लिप्यंतरण किया गया है।
- source_word: לְהֵיטִיב אֶתְכֶם
  choice: तुम्हारा भला करने
  rationale: यह व्यापक वाचागत भलाई को व्यक्त करता है और इसे केवल आर्थिक समृद्धि तक सीमित नहीं करता।
- source_word: וּלְהַרְבּוֹת אֶתְכֶם
  choice: तुम्हारी संख्या बढ़ाने
  rationale: इब्रानी में लोगों को बहुगुणित करने के भाव को साधारण हिन्दी में स्पष्ट करता है।
- source_word: לְהַאֲבִיד אֶתְכֶם וּלְהַשְׁמִיד אֶתְכֶם
  choice: तुम्हें नष्ट करने और मिटा देने
  rationale: दो निकटार्थक किन्तु अलग तीव्र क्रियाओं को अलग हिन्दी अभिव्यक्तियों से रखा गया है; दूसरी अभिव्यक्ति पूर्ण विनाश की कठोरता बनाए रखती है।
- source_word: וְנִסַּחְתֶּם מֵעַל הָאֲדָמָה
  choice: तुम उस भूमि पर से उखाड़ दिए जाओगे
  rationale: निष्क्रिय रूप, बलपूर्वक हटाए जाने की छवि और מֵעַל के ‘पर से’ भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: जिसका अधिकार लेने के लिए तू वहाँ प्रवेश कर रहा है
  rationale: ‘तू’ से इब्रानी के एकवचन संबोधन को, ‘वहाँ’ से दिशासूचक क्रियाविशेषण को और ‘जिसका अधिकार’ से स्त्रीलिंग वस्तु-प्रत्यय को व्यक्त किया गया है।
theological_decisions:
- issue: न्याय करते समय याहवे का आनन्दित होना
  choice: ‘याहवे ... आनन्दित होगा’ को स्पष्ट रूप से बनाए रखा गया है।
  alternative: ‘याहवे तुम्हारा नाश करेगा’ कहकर आनन्द के उल्लेख को नरम करना या हटा देना।
  rationale: इब्रानी पाठ भलाई करने में आनन्द और विनाश करने में आनन्द के बीच सीधी समानता स्थापित करता है। कठिन धर्मवैज्ञानिक तनाव को अनुवाद में हल्का नहीं किया गया।
- issue: बहुवचन से सामूहिक एकवचन संबोधन की ओर परिवर्तन
  choice: आरम्भ में बहुवचन ‘तुम्हारा/तुम्हें’ और अन्तिम उपवाक्य में एकवचन ‘तू’ रखा गया है।
  alternative: पूरे पद में केवल बहुवचन ‘तुम’ रखना।
  rationale: स्रोत पाठ अन्तिम उपवाक्य में इस्राएल को एक सामूहिक प्रजा मानकर एकवचन में संबोधित करता है; हिन्दी में यह भेद दिखाया जा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आनन्दित’ दोनों समानांतर खंडों में दोहराया गया है। आरम्भिक बहुवचन और अन्तिम सामूहिक एकवचन का जानबूझकर किया गया परिवर्तन हिन्दी में स्पष्ट रखा गया है।
