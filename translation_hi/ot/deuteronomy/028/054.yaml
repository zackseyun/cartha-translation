  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बैर की दृष्टि’ इब्रानी के आँख-संबंधी मुहावरे को बचाती है, जबकि पादटिप्पणी उसके व्यापक अर्थ को स्पष्ट करती है। ‘छाती से लगी पत्नी’ आत्मीय मूल रूपक को अत्यधिक संस्कृतनिष्ठ शब्दावली के बिना व्यक्त करती है।
