base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/054.yaml
  text: The man who is tender among you and very delicate—his eye will be hostile toward his brother[a], toward the wife of his bosom[b], and toward the rest of his children whom he has left.
translation:
  language: hi
  text: तुम्हारे बीच का वह पुरुष, जो कोमल और अत्यंत सुख-सुविधा में पला हुआ है, अपने भाई, अपनी छाती से लगी पत्नी, और अपने उन बचे हुए बच्चों को बैर की दृष्टि से देखेगा[a], जो उसके पास बचे होंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक इब्रानी मुहावरा है, “उसकी आँख बुरी होगी।” इसका भाव शत्रुता, कृपणता, या किसी को कुछ देने से कुढ़ते हुए इनकार करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिन्हें वह छोड़ देगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִישׁ
  choice: पुरुष
  rationale: यह संज्ञा एकवचन पुल्लिंग है और अगले पद में स्त्री के समानांतर यहाँ विशेष रूप से पुरुष का उल्लेख करती है।
- source_word: הָרַךְ
  choice: कोमल
  rationale: मूल विशेषण नरमी और कोमलता का बोध कराता है; घेराबंदी में आगे वर्णित क्रूर आचरण के साथ इसका तीखा विरोध है।
- source_word: וְהֶעָנֹג מְאֹד
  choice: अत्यंत ... सुख-सुविधा में पला हुआ
  rationale: यह अभिव्यक्ति ऐश और आराम के अभ्यस्त, नाज़ुक व्यक्ति को दर्शाती है। आधुनिक हिन्दी में यह भाव केवल ‘नाज़ुक’ कहने से अधिक स्पष्ट और स्वाभाविक है।
- source_word: תֵּרַע עֵינוֹ
  choice: बैर की दृष्टि से देखेगा
  rationale: शाब्दिक इब्रानी मुहावरा ‘उसकी आँख बुरी होगी’ शत्रुता, कृपणता और बाँटने से इनकार का भाव रखता है। चुना हुआ रूप हिन्दी में स्वाभाविक रहते हुए उस दृष्टि-रूपक को बनाए रखता है।
- source_word: בְאָחִיו
  choice: अपने भाई
  rationale: אָח का सामान्य और प्रसंगानुकूल अर्थ ‘भाई’ है; इसे व्यापक ‘कुटुम्बी’ बनाना अनावश्यक होगा।
- source_word: אֵשֶׁת חֵיקוֹ
  choice: अपनी छाती से लगी पत्नी
  rationale: חֵיק छाती या गोद का बिंब है और सबसे निकट, प्रिय पत्नी की आत्मीयता व्यक्त करता है। यह रूपक को आधुनिक, समझने योग्य हिन्दी में बनाए रखता है।
- source_word: יֶתֶר בָּנָיו
  choice: अपने शेष बचे बच्चों
  rationale: בנים यहाँ संतानों के लिए समावेशी रूप से प्रयुक्त हो सकता है; יֶתֶר शेष बचे हुओं को सूचित करता है।
- source_word: אֲשֶׁר יוֹתִיר
  choice: जो उसके पास बचे होंगे
  rationale: יתר का हिफ़ील रूप किसी को शेष छोड़ने या शेष रहने देने का अर्थ देता है। यहाँ घेराबंदी के बाद उसके पास बची संतानों का भाव है, पर कर्तृवाचक वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
