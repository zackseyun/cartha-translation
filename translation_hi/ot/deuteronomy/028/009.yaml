source:
  edition: WLC
  text: יְקִֽימְ/ךָ֨ יְהוָ֥ה ל/וֹ֙ לְ/עַ֣ם קָד֔וֹשׁ כַּ/אֲשֶׁ֖ר נִֽשְׁבַּֽע לָ֑/ךְ כִּ֣י תִשְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָלַכְתָּ֖ בִּ/דְרָכָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/009.yaml
  text: Yahweh will establish you for himself as a holy people[a], just as he swore to you, if you keep the commandments of Yahweh your God and walk in his ways.
translation:
  language: hi
  text: यदि[a] तुम अपने परमेश्वर यहोवा की आज्ञाओं का पालन करोगे और उसके मार्गों पर चलोगे, तो यहोवा तुम्हें अपने लिए एक पवित्र प्रजा के रूप में स्थापित करेगा—जैसा उसने तुमसे शपथ खाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तुम अपने परमेश्वर यहोवा की आज्ञाओं का पालन करते हो और उसके मार्गों पर चलते हो।” इब्रानी संयोजक कारणसूचक भी हो सकता है, यद्यपि यहाँ का संदर्भ “यदि” का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְקִימְךָ
  choice: तुम्हें ... स्थापित करेगा
  rationale: קום के हिफ़ईल रूप का अर्थ यहाँ शारीरिक रूप से उठाना नहीं, बल्कि वाचा के संबंध में किसी स्थिति में दृढ़तापूर्वक ठहराना है।
- source_word: לּוֹ
  choice: अपने लिए
  rationale: 'यह संबंध और अधिकार का भाव व्यक्त करता है: प्रजा यहोवा की अपनी ठहरती है।'
- source_word: לְעַם קָדוֹשׁ
  choice: एक पवित्र प्रजा के रूप में
  rationale: यह परिणामी वाचागत पहचान को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: כַּאֲשֶׁר נִשְׁבַּע לָךְ
  choice: जैसा उसने तुमसे शपथ खाई है
  rationale: यह पूर्व में की गई शपथ के साथ प्रतिज्ञा का सीधा संबंध बनाए रखता है।
- source_word: כִּי
  choice: यदि ... तो
  rationale: आशीष और शाप के व्यापक संदर्भ में संयोजक को शर्तसूचक समझना अधिक उपयुक्त है; हिन्दी में वाक्य को स्पष्ट और स्वाभाविक बनाने के लिए शर्त पहले रखी गई है।
- source_word: תִשְׁמֹר אֶת מִצְוֺת
  choice: आज्ञाओं का पालन करोगे
  rationale: שׁמר का आज्ञाओं के साथ अर्थ उनका पालन करना है; यह आधुनिक हिन्दी में स्वाभाविक है और विधिक-वाचागत भाव बनाए रखता है।
- source_word: וְהָלַכְתָּ בִּדְרָכָיו
  choice: और उसके मार्गों पर चलोगे
  rationale: आचरण के लिए प्रयुक्त मूल इब्रानी रूपक को हिन्दी में स्पष्ट रहते हुए सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचागत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: यह संबोधित समुदाय के साथ परमेश्वर के वाचागत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आशीष-वाक्य में शर्त का बल
  choice: כִּי को ‘यदि’ मानकर आज्ञापालन को स्थापना से जुड़ी वास्तविक वाचागत शर्त के रूप में प्रस्तुत किया गया है।
  alternative: इसे कारणसूचक मानकर ‘क्योंकि तुम ... पालन करते हो’ भी समझा जा सकता है।
  rationale: व्यवस्थाविवरण 28 की आशीष-शाप संरचना शर्तसूचक अर्थ का समर्थन करती है, फिर भी इब्रानी संयोजक की कारणसूचक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘पवित्र प्रजा’ की पहचान
  choice: इस पद को यहोवा द्वारा इस्राएल को अपने लिए वाचागत रूप से स्थापित करने की प्रतिज्ञा के रूप में रखा गया है।
  alternative: ‘पवित्र’ को केवल व्यक्तिगत नैतिक सिद्धता का कथन समझना।
  rationale: לְעַם קָדוֹשׁ सामूहिक और संबंधपरक पहचान व्यक्त करता है; अनुवाद इससे आगे कोई सांप्रदायिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। ‘प्रजा,’ ‘शपथ,’ और ‘स्थापित’ वाचागत औपचारिकता बनाए रखते हैं; ‘मार्गों पर चलना’ मूल रूपक को सुरक्षित रखता है।
