source:
  edition: WLC
  text: וְ/רָאוּ֙ כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֛י שֵׁ֥ם יְהוָ֖ה נִקְרָ֣א עָלֶ֑י/ךָ וְ/יָֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/010.yaml
  text: Then all the peoples of the earth will see that the name of Yahweh is called upon you[a], and they will fear you.
translation:
  language: hi
  text: तब पृथ्वी के सब लोग देखेंगे कि याहवे का नाम तुम्हारे ऊपर पुकारा जाता है[a], और वे तुमसे डरेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम याहवे के नाम से कहलाते हो।” इब्रानी मुहावरे का शाब्दिक अर्थ है कि याहवे का नाम तुम्हारे “ऊपर पुकारा जाता है”; इससे वाचा-संबंधी पहचान और याहवे से जुड़े होने का भाव प्रकट होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: तब ... देखेंगे
  rationale: आशीषों की इस शृंखला में संयोजक सहित पूर्ण क्रिया भावी परिणाम व्यक्त करती है; ‘तब’ पूर्ववर्ती प्रतिज्ञाओं से परिणामात्मक संबंध को स्वाभाविक हिंदी में दिखाता है।
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: पृथ्वी के सब लोग
  rationale: עַמֵּי विभिन्न जनसमूहों को सूचित करता है और अंतरराष्ट्रीय संदर्भ में הָאָרֶץ का व्यापक अर्थ ‘पृथ्वी’ उपयुक्त है।
- source_word: שֵׁם יְהוָה
  choice: यहोवा का नाम
  rationale: इब्रानी संबंध-विन्यास को सहज हिंदी में रखा गया है और वाचा के व्यक्तिगत ईश्वरीय नाम को ‘यहोवा’ से व्यक्त किया गया है।
- source_word: נִקְרָא עָלֶיךָ
  choice: तुम्हारे ऊपर पुकारा जाता है
  rationale: यह चयन निष्क्रिय क्रिया और עַל (‘ऊपर’) की मूल छवि को बनाए रखता है; मुहावरा वाचा-संबंधी पहचान और यहोवा से संबद्ध होने का भाव रखता है।
- source_word: וְיָרְאוּ מִמֶּךָּ
  choice: और वे तुमसे डरेंगे
  rationale: ירא यहाँ यहोवा की प्रकट कृपा और अधिकार के कारण उत्पन्न भय को दर्शाता है; ‘डरेंगे’ भय और विस्मय की व्यापकता को बिना अनावश्यक व्याख्या के बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। आधुनिक हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को किसी उपाधि में बदलने के बजाय उसकी व्यक्तिगत-वाचाई प्रकृति बनाए रखता है।
- issue: נִקְרָא עָלֶיךָ मुहावरे का आशय
  choice: यहोवा का नाम तुम्हारे ऊपर पुकारा जाता है
  alternative: तुम यहोवा के नाम से कहलाते हो
  rationale: मुख्य पाठ इब्रानी की ‘नाम ... ऊपर पुकारा जाना’ वाली छवि और उसकी वास्तविक अस्पष्टता को बचाता है; पादटिप्पणी स्वामित्व और वाचा-संबंधी पहचान के अधिक व्याख्यात्मक विकल्प को बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। सामूहिक इस्राएल को संबोधित एकवचन ‘तुम’ बनाए रखा गया है। मुख्य पाठ में इब्रानी मुहावरे की छवि सुरक्षित है और पादटिप्पणी उसका सहज वैकल्पिक अर्थ देती है।
