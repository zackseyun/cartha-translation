source:
  edition: WLC
  text: הָ/רַכָּ֨ה בְ/ךָ֜ וְ/הָ/עֲנֻגָּ֗ה אֲשֶׁ֨ר לֹא נִסְּתָ֤ה כַף רַגְלָ/הּ֙ הַצֵּ֣ג עַל הָ/אָ֔רֶץ מֵ/הִתְעַנֵּ֖ג וּ/מֵ/רֹ֑ךְ תֵּרַ֤ע עֵינָ/הּ֙ בְּ/אִ֣ישׁ חֵיקָ֔/הּ וּ/בִ/בְנָ֖/הּ וּ/בְ/בִתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/056.yaml
  text: The tender and delicate woman among you[a], who has not ventured to set the sole of her foot on the ground because of delicacy and tenderness, her eye will be evil toward the husband of her embrace[b], and toward her son and her daughter—
translation:
  language: hi
  text: तुम्हारे बीच की कोमल और सुकुमार स्त्री, जिसने अपनी सुकुमारता और कोमलता के कारण अपने पाँव का तलवा धरती पर रखने का साहस भी नहीं किया, वह अपने पति[b] के प्रति, और अपने बेटे और बेटी के प्रति बुरी दृष्टि रखेगी[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरा ‘उसकी आँख बुरी होगी’ का अर्थ है कि वह उनके प्रति वैरभाव या स्वार्थपूर्ण कृपणता रखेगी।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उसके वक्ष/गोद का पुरुष’ या ‘उसके आलिंगन का पति’; यह उसके पति के लिए निकटता व्यक्त करने वाला संबोधन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַכָּה
  choice: कोमल
  rationale: स्त्रीलिंग विशेषण רַכָּה नरमी और कोमलता व्यक्त करता है; ‘कोमल’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सन्निकट है।
- source_word: וְהָעֲנֻגָּה
  choice: सुकुमार
  rationale: עֲנֻגָּה ऐसी नाज़ुक या लाड़-प्यार में पली अवस्था बताता है जो कठिनाई सहने की अभ्यस्त नहीं; ‘सुकुमार’ गरिमापूर्ण ढंग से यह भाव रखता है।
- source_word: אֲשֶׁר לֹא נִסְּתָה כַף רַגְלָהּ הַצֵּג עַל הָאָרֶץ
  choice: जिसने ... अपने पाँव का तलवा धरती पर रखने का साहस तक नहीं किया
  rationale: नकार सहित נִסְּתָה यहाँ प्रयत्न या साहस करने का भाव दे सकता है। ‘साहस तक नहीं किया’ उसकी चरम सुकुमारता को व्यक्त करते हुए मूल बिंब बनाए रखता है।
- source_word: מֵהִתְעַנֵּג וּמֵרֹךְ
  choice: अपनी सुकुमारता और कोमलता के कारण
  rationale: מִן वाले दोनों पद यहाँ कारण बताते हैं और आरंभ के युग्म को प्रतिध्वनित करते हैं।
- source_word: תֵּרַע עֵינָהּ
  choice: उसकी नज़र ... पर बुरी हो जाएगी
  rationale: मूल का सजीव इब्रानी मुहावरा बनाए रखा गया है; इसका आशय वैर, कठोरता या स्वार्थवश किसी वस्तु को न देना हो सकता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: בְּאִישׁ חֵיקָהּ
  choice: अपने हृदय से लगे पति पर
  rationale: शाब्दिक रूप से यह ‘उसकी गोद/वक्ष का पुरुष’ है। हिन्दी में ‘हृदय से लगा पति’ वैवाहिक निकटता को स्वाभाविक ढंग से व्यक्त करता है और केवल ‘पति’ कहकर बिंब को समतल नहीं करता।
- source_word: וּבִבְנָהּ וּבְבִתָּהּ
  choice: और अपने बेटे और बेटी पर
  rationale: मूल पाठ बेटे और बेटी को अलग-अलग नाम देता है; इसलिए सामान्यीकृत ‘बच्चों’ के बजाय दोनों को रखा गया है।
theological_decisions:
- issue: ‘बुरी नज़र’ वाले मुहावरे का आशय
  choice: मुहावरे को मुख्य पाठ में बनाए रखकर उसके संभावित अर्थ पादटिप्पणी में दिए गए हैं।
  alternative: सीधे ‘वह उनसे बैर रखेगी’ या ‘वह उन्हें देने से इनकार करेगी’ कहना।
  rationale: संदर्भ स्वार्थपूर्ण रोक और वैरभाव दोनों का संकेत दे सकता है; किसी एक अर्थ को मुख्य पाठ में चुनना मूल की अर्थगत व्यापकता को अनावश्यक रूप से सीमित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘कोमल और सुकुमार’ मूल के समानार्थी युग्म को बनाए रखता है। वाक्य के अंत का दीर्घ विराम-चिह्न अगले पद में वाक्य जारी रहने को दर्शाता है।
