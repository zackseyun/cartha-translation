base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/023.yaml
  text: And the heavens above your head shall be bronze[a], and the earth beneath you iron.
translation:
  language: hi
  text: और तुम्हारे सिर के ऊपर का आकाश काँसे का हो जाएगा, और तुम्हारे नीचे की धरती लोहे की हो जाएगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ
  choice: हो जाएगा
  rationale: श्राप के इस संदर्भ में संयोजक के साथ पूर्ण क्रिया भविष्यसूचक अर्थ रखती है; हिंदी में ‘हो जाएगा’ उस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁמֶיךָ אֲשֶׁר עַל רֹאשְׁךָ
  choice: तुम्हारे सिर के ऊपर का आकाश
  rationale: שָׁמַיִם यहाँ मौसम और वर्षा से जुड़े आकाश को सूचित करता है। यह वाक्यांश संबंधवाचक संरचना और ऊर्ध्वाधर चित्र को सहज हिंदी में बनाए रखता है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: शब्द ताँबा या काँसा दोनों को सूचित कर सकता है। लोहे के साथ कठोर धातु के रूपक में ‘काँसा’ स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְהָאָרֶץ אֲשֶׁר תַּחְתֶּיךָ
  choice: और तुम्हारे नीचे की धरती
  rationale: आकाश के समानांतर विरोध और ‘नीचे’ के स्थानबोध को रखते हुए ‘धरती’ यहाँ स्वाभाविक हिंदी है।
- source_word: בַּרְזֶל
  choice: लोहा
  rationale: यह धातु-संज्ञा का मानक हिंदी अनुवाद है और कठोर, अनुपजाऊ धरती के रूपक को बनाए रखता है।
theological_decisions:
- issue: श्राप के रूपक का आशय
  choice: ‘काँसा’ और ‘लोहा’ की धातु-संबंधी छवि को मुख्य पाठ में अक्षुण्ण रखना
  alternative: इसे सूखे आकाश और कठोर, अनुपजाऊ धरती के रूप में स्पष्ट करके कहना
  rationale: इब्रानी पाठ स्वयं तीव्र रूपक देता है; सूखे और कठोरता का निहित अर्थ समझाकर जोड़ना मुख्य पाठ में अनावश्यक व्याख्या होती।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गंभीर और वाचा के श्राप के अनुरूप गरिमापूर्ण शैली। समानांतर संरचना तथा ऊपर/नीचे की छवि सुरक्षित रखी गई है।
