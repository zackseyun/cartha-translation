  text: יְשַׁלַּ֣ח יְהוָ֣ה בְּ֠/ךָ אֶת הַ/מְּאֵרָ֤ה אֶת הַ/מְּהוּמָה֙ וְ/אֶת הַ/מִּגְעֶ֔רֶת בְּ/כָל מִשְׁלַ֥ח יָדְ/ךָ֖ אֲשֶׁ֣ר תַּעֲשֶׂ֑ה עַ֣ד הִשָּֽׁמֶדְ/ךָ֤ וְ/עַד אֲבָדְ/ךָ֙ מַהֵ֔ר מִ/פְּנֵ֛י רֹ֥עַ מַֽעֲלָלֶ֖י/ךָ אֲשֶׁ֥ר עֲזַבְתָּֽ/נִי׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/020.yaml
  text: Yahweh will send on you the curse[a], the confusion, and the rebuke in every undertaking of your hand that you do, until you are destroyed and until you perish quickly, because of the evil of your deeds by which you have forsaken me.
translation:
  language: hi
  text: याहवे तुम पर शाप, अव्यवस्था और फटकार भेजेगा—तुम्हारे हर उस काम में जिस पर तुम हाथ लगाओगे[a]—जब तक कि तुम्हारा नाश न हो जाए और तुम शीघ्र नष्ट न हो जाओ, तुम्हारे बुरे कर्मों के कारण, जिनके द्वारा तुमने मुझे छोड़ दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “तुम्हारे हाथ के हर फैलाव में”; अर्थात् हर उस काम में जिसे तुम करने के लिए हाथ बढ़ाते हो।'
    reason: इब्रानी मुहावरे का शाब्दिक रूप और उसका आशय बताने के लिए।
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: भेजेगा
  rationale: पिएल रूप यहाँ याहवे की प्रत्यक्ष और सक्रिय भूमिका व्यक्त करता है; ‘भेजेगा’ स्वाभाविक हिंदी में इसी कर्तृत्व को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; उसे उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: הַמְּאֵרָה
  choice: शाप
  rationale: यह वाचा के उल्लंघन के फलस्वरूप आने वाले ठोस दंड को सूचित करता है; ‘शाप’ इसका स्पष्ट और प्रचलित हिंदी पर्याय है।
- source_word: הַמְּהוּמָה
  choice: अव्यवस्था
  rationale: यह शब्द भ्रम, घबराहट और उथल-पुथल के व्यापक अर्थ रख सकता है। ‘अव्यवस्था’ व्यक्ति के सभी कामों को बाधित करने वाले व्यापक उपद्रव को व्यक्त करती है।
- source_word: הַמִּגְעֶרֶת
  choice: फटकार
  rationale: גער से बना यह संज्ञा-रूप कठोर, विशेषकर ईश्वरीय, डाँट या धमकी का बोध कराता है; ‘फटकार’ न्यायिक गंभीरता बनाए रखती है।
- source_word: בְּכָל מִשְׁלַח יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: तुम जिस-जिस काम में हाथ लगाओगे, उसमें
  rationale: हाथ बढ़ाने या लगाने का इब्रानी मुहावरा हर आरंभ किए गए काम को सूचित करता है। हिंदी का ‘काम में हाथ लगाना’ मूल बिंब और अर्थ दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: עַד הִשָּׁמֶדְךָ וְעַד אֲבָדְךָ מַהֵר
  choice: जब तक तुम्हारा नाश न हो जाए और तुम शीघ्र मिट न जाओ
  rationale: दो समानांतर क्रियाओं का कुछ भेद रखते हुए उनकी तीव्रता और शीघ्र परिणाम को व्यक्त किया गया है।
- source_word: מִפְּנֵי רֹעַ מַעֲלָלֶיךָ אֲשֶׁר עֲזַבְתָּנִי
  choice: तुम्हारे बुरे कामों के कारण ... जिनके द्वारा तुमने मुझे छोड़ दिया है
  rationale: מִפְּנֵי का कारणवाचक अर्थ और बुरे कर्मों तथा याहवे को छोड़ने के बीच इब्रानी संबंध दोनों स्पष्ट रखे गए हैं।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम स्पष्ट रूप से आया है। लिप्यंतरण उसका नामात्मक स्वरूप बनाए रखता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: वाचा-दंड में परमेश्वर की प्रत्यक्ष भूमिका
  choice: याहवे ... भेजेगा
  alternative: शाप अपने आप आ पड़ेगा
  rationale: इब्रानी वाक्य में याहवे क्रिया का स्पष्ट कर्ता है; इसलिए दंड को अवैयक्तिक घटना नहीं बनाया गया।
- issue: אֲשֶׁר का संबंध
  choice: बुरे कामों को याहवे छोड़ने का माध्यम बताने वाला संबंधवाचक उपवाक्य
  alternative: ‘क्योंकि तुमने मुझे छोड़ दिया है’ के रूप में स्वतंत्र कारणवाचक व्याख्या
  rationale: संबंधवाचक रचना मूल की व्याकरणिक निकटता और उसके नैतिक-धार्मिक तनाव को बनाए रखती है, यद्यपि स्वतंत्र कारणवाचक अर्थ भी प्रसंग में संभव है।
- issue: दंडों की निरंतर प्रभावशीलता
  choice: ‘इनमें ये तुम्हारा पीछा नहीं छोड़ेंगे’ द्वारा लक्ष्य तक जारी प्रभाव
  alternative: हर उपक्रम में केवल ‘भेजेगा’ दोहराना
  rationale: इब्रानी में ‘भेजेगा’ का प्रभाव विनाश तक पहुँचता है। हिंदी में यह वाक्यांश उस निरंतरता को स्वाभाविक ढंग से स्पष्ट करता है, बिना कर्ता या अंतिम परिणाम बदले।
translation_notes:
  register: आधुनिक मानक हिंदी का गंभीर किंतु सहज रूप अपनाया गया है। ‘याहवे’ व्यक्तिगत ईश्वरीय नाम के रूप में रखा गया है। ‘काम में हाथ लगाना’ सामान्य हिंदी मुहावरा है और मूल इब्रानी के हाथ वाले बिंब को भी सुरक्षित रखता है।
