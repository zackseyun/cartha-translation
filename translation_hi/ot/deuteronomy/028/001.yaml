source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/נְתָ֨נְ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עֶלְי֔וֹן עַ֖ל כָּל גּוֹיֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/001.yaml
  text: And it shall be[a], if you diligently obey the voice of Yahweh your God, being careful to do all his commandments that I am commanding you today, then Yahweh your God will set you high above all the nations of the earth.
translation:
  language: hi
  text: यदि तुम अपने परमेश्वर यहोवा की वाणी को ध्यान से सुनोगे[a] और उसकी उन सभी आज्ञाओं का सावधानी से पालन करोगे, जिनकी मैं आज तुम्हें आज्ञा देता हूँ, तो तुम्हारा परमेश्वर यहोवा तुम्हें पृथ्वी की सभी जातियों से ऊँचा स्थान देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “यदि सुनते हुए तुम सुनोगे”; यह ध्यान से सुनने और उसके अनुसार आज्ञा मानने पर बल देने वाला मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: यदि...तो
  rationale: हिब्रू में यह पद की शर्त और उसके परिणाम का सूत्र आरम्भ करता है। हिन्दी में स्वाभाविक ‘यदि...तो’ उसी संबंध और भावी परिणाम को स्पष्ट करता है।
- source_word: אִם שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: वाणी ध्यान से सुनकर उसका पालन करोगे
  rationale: इनफिनिटिव एब्सोल्यूट और सीमित क्रिया का मेल सुनने पर बल देता है, जबकि वाचा के प्रसंग में सुनना आज्ञापालन को समाहित करता है। यह अनुवाद दोनों पहलुओं को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के वाचागत निज नाम का प्रचलित और पहचाना जाने वाला लिप्यंतरण।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन के सीधे संबंधसूचक रूप और वाचागत संबोधन को सुरक्षित रखता है।
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: सावधानी से मानोगे
  rationale: दोनों क्रियार्थक रूप सतर्कता से ध्यान रखने और व्यवहार में पूरा करने का संयुक्त भाव देते हैं; हिन्दी में ‘सावधानी से मानना’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל מִצְוֺתָיו
  choice: उसकी उन सभी आज्ञाओं
  rationale: ‘आज्ञाओं’ से वाचा और व्यवस्था का विधिक-धार्मिक स्तर बना रहता है; ‘सभी’ व्यापकता को सुरक्षित रखता है।
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: जिन्हें मैं आज तुम्हें दे रहा हूँ
  rationale: प्रतिभागी रूप के वर्तमान संबोधन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּנְתָנְךָ ... עֶלְיוֹן
  choice: तुम्हें ... ऊँचा स्थान देगा
  rationale: यहाँ נתן किसी वस्तु को देने के बजाय ऊँचे पद पर स्थापित करने का अर्थ रखता है। ‘ऊँचा स्थान देगा’ तुलना और प्रतिष्ठा दोनों स्पष्ट करता है।
- source_word: עַל כָּל גּוֹיֵי הָאָרֶץ
  choice: पृथ्वी की सभी जातियों से
  rationale: עַל के तुलनात्मक अर्थ को हिन्दी के ‘से’ द्वारा स्वाभाविक ढंग से व्यक्त किया गया है; यहाँ הָאָרֶץ का व्यापक अर्थ ‘पृथ्वी’ उपयुक्त है।
theological_decisions:
- issue: परमेश्वर के निज नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का निज नाम शीर्षक से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबल-पाठकों में ‘यहोवा’ अधिक पहचाना जाने वाला रूप है, यद्यपि ‘याहवे’ ध्वन्यात्मक पुनर्निर्माण के अधिक निकट माना जाता है।
- issue: שָׁמוֹעַ תִּשְׁמַע בְּקוֹל में सुनने और आज्ञापालन का संबंध
  choice: वाणी ध्यान से सुनकर उसका पालन करोगे
  alternative: पूरी लगन से आज्ञा मानोगे
  rationale: चुना हुआ रूप वाचागत आज्ञापालन का आशय स्पष्ट करते हुए मूल के ‘सुनना’ और ‘वाणी’ दोनों बिंबों को बचाता है; इसे केवल श्रवण या केवल अमूर्त आज्ञापालन तक सीमित नहीं करता।
- issue: ऊँचे स्थान की वाचागत प्रतिज्ञा
  choice: पृथ्वी की सभी जातियों से ऊँचा स्थान देगा
  alternative: पृथ्वी की सभी जातियों के ऊपर सर्वोच्च ठहराएगा
  rationale: עֶלְיוֹן यहाँ परमेश्वर की उपाधि नहीं, इस्राएल की तुलनात्मक स्थिति बताता है। ‘ऊँचा स्थान’ अतिशयोक्तिपूर्ण सार्वभौम प्रभुत्व जोड़े बिना मूल तुलना रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वाणी’, ‘आज्ञाएँ’ और ‘यहोवा’ वाचा-संबंधी शब्दावली को बनाए रखते हैं, जबकि वाक्य-विन्यास हिन्दी के स्वाभाविक ‘यदि...तो’ ढाँचे का अनुसरण करता है।
