base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/028.yaml
  text: Yahweh will strike you with madness and blindness and confusion of heart[a].
translation:
  language: hi
  text: याहवे तुम्हें पागलपन, अंधापन और मन के भ्रम[a] से पीड़ित करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हृदय का भ्रम’; ‘मन की किंकर्तव्यविमूढ़ता’ या ‘मन की घबराहट’ भी संभव है।
    reason: תִּמָּהוֹן के ‘भ्रमित/स्तब्ध’ होने के अर्थ और לֵבָב के शाब्दिक ‘हृदय’ तथा संदर्भानुकूल ‘मन’ दोनों को दर्शाता है।
lexical_decisions:
- source_word: יַכְּכָה
  choice: तुम्हें … से आघात पहुँचाएगा
  rationale: נכה के हिफ़ील रूप में प्रहार करने या विपत्ति से चोट पहुँचाने का प्रबल भाव है। ‘आघात पहुँचाएगा’ आधुनिक हिन्दी में इस शाप-वचन की तीव्रता बनाए रखता है और ‘मारेगा’ से उत्पन्न ‘जान से मार डालना’ की संभावित गलतफहमी से बचाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम יהוה है; इसलिए किसी उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण ‘याहवे’ रखा गया है।
- source_word: בְּשִׁגָּעוֹן
  choice: पागलपन
  rationale: שִׁגָּעוֹן मानसिक विक्षिप्तता या पागलपन को दर्शाता है। ‘पागलपन’ सीधा, स्पष्ट और सामान्य आधुनिक हिन्दी शब्द है।
- source_word: וּבְעִוָּרוֹן
  choice: अंधेपन
  rationale: עִוָּרוֹן का सीधा अर्थ अंधापन है। इसे मानसिक अंधेपन के रूप में विस्तार नहीं दिया गया, क्योंकि मूल पाठ ऐसा स्पष्ट नहीं करता।
- source_word: וּבְתִמְהוֹן לֵבָב
  choice: मन की उलझन
  rationale: תִּמְהוֹן विस्मयजनित उलझन, घबराहट या किंकर्तव्यविमूढ़ता व्यक्त कर सकता है, और לֵבָב यहाँ अंतर्मन तथा विचार-शक्ति को सूचित करता है। ‘मन की उलझन’ आधुनिक हिन्दी में स्वाभाविक रहते हुए भाव को सुरक्षित रखता है।
- source_word: לֵבָב
  choice: मन
  rationale: बाइबिलीय इब्रानी में לֵבָב केवल भावनात्मक ‘हृदय’ नहीं, बल्कि सोचने और निर्णय करने वाले अंतर्मन को भी दर्शाता है। इस प्रसंग में ‘मन’ हिन्दी पाठक के लिए अधिक स्वाभाविक और अर्थ-स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल पाठ उपाधि नहीं बल्कि चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम देता है। ‘याहवे’ उस नाम का व्यापक रूप से स्वीकृत ध्वन्यात्मक लिप्यंतरण है और पाठ में नाम तथा उपाधि के अंतर को बनाए रखता है।
- issue: לֵבָב को ‘मन’ या ‘हृदय’ कहना
  choice: मन
  alternative: हृदय
  rationale: इस अभिशाप में मानसिक दिशाहीनता का संदर्भ है। ‘मन’ इब्रानी शब्द के बौद्धिक-अंतःकरण संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी ‘हृदय’ वाले अधिक शाब्दिक विकल्प को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘आघात पहुँचाएगा’ वाचा के शाप की तीव्रता बनाए रखता है; ‘मन की उलझन’ सामान्य पाठक के लिए स्वाभाविक है, और अधिक शाब्दिक ‘हृदय’ पादटिप्पणी में सुरक्षित है।
