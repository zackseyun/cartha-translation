  text: יַדְבֵּ֧ק יְהוָ֛ה בְּ/ךָ֖ אֶת הַ/דָּ֑בֶר עַ֚ד כַּלֹּת֣/וֹ אֹֽתְ/ךָ֔ מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/021.yaml
  text: Yahweh will make the plague cling to you until he has wiped you out from the land that you are entering to possess[a][b].
translation:
  language: hi
  text: याहवे महामारी[a] को तुमसे चिपका देगा, जब तक कि वह तुम्हें उस देश से मिटा न दे[b] जिसे तुम अपने अधिकार में लेने के लिए जा रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मरी।” इब्रानी शब्द न्याय के रूप में आने वाले घातक महामारी-रोग को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जब तक महामारी तुम्हें मिटा न दे,” यदि इस उपवाक्य का निहित कर्ता महामारी को माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: יַדְבֵּק
  choice: ऐसा चिपका देगा ... पीछा नहीं छोड़ेगी
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘चिपका देना’ है। हिंदी में विस्तृत वाक्य-विन्यास महामारी के लगातार लगे रहने की सजीव छवि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का हिंदी लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: בְּךָ
  choice: तुमसे
  rationale: דבק के साथ यह निकटता से चिपके रहने का संबंध बताता है; ‘तुमसे चिपका’ स्वाभाविक हिंदी है।
- source_word: הַדָּבֶר
  choice: महामारी
  rationale: वाचा के शाप के संदर्भ में यह शब्द घातक संक्रामक रोग अथवा मरी को दर्शाता है। ‘महामारी’ आधुनिक पाठक के लिए स्पष्ट और गंभीर है।
- source_word: עַד כַּלֹּתוֹ אֹתְךָ
  choice: जब तक वह तुम्हें ... मिटा न दे
  rationale: כלה यहाँ पूरी तरह समाप्त या नष्ट कर देने का भाव रखता है। ‘मिटा देना’ इस समग्र विनाश को सहज हिंदी में व्यक्त करता है; ‘वह’ का निकटतम मुख्य कर्ता याहवे समझा जा सकता है, जबकि वैकल्पिक कर्ता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מֵעַל הָאֲדָמָה
  choice: उस देश से
  rationale: यद्यपि אֲדָמָה का अर्थ भूमि या मिट्टी भी हो सकता है, अधिकार में लेने के प्रसंग में यह प्रतिज्ञात भूभाग को सूचित करता है।
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: जिस पर ... तुम जा रहे हो
  rationale: בוא और שמה का संयुक्त भाव उस स्थान में शीघ्र प्रवेश करने का है; हिंदी में अधिकार के उद्देश्य के साथ यह रचना स्वाभाविक है।
- source_word: לְרִשְׁתָּהּ
  choice: अधिकार करने के लिए
  rationale: व्यवस्थाविवरण में ירש प्रायः देश को अपने अधिकार में लेने का अर्थ रखता है।
theological_decisions:
- issue: वाचा के शाप में דֶּבֶר का अर्थ
  choice: महामारी
  alternative: मरी; घातक रोग
  rationale: यह चुनाव न्यायस्वरूप आने वाले व्यापक और घातक रोग को स्पष्ट करता है, पर इब्रानी शब्द को किसी एक आधुनिक रोग तक सीमित नहीं करता।
- issue: כַּלֹּתוֹ का निहित कर्ता
  choice: ‘वह’—मुख्य वाक्य के कर्ता याहवे की ओर स्वाभाविक संकेत
  alternative: 'महामारी को कर्ता मानना: ‘जब तक महामारी तुम्हें मिटा न दे’'
  rationale: मुख्य वाक्य का कर्ता याहवे होने के कारण वही सबसे स्वाभाविक निहित कर्ता है; फिर भी इब्रानी रचना महामारी को कर्ता मानने की संभावना देती है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘चिपका देगा’ मूल की सजीव कारणवाचक छवि बचाता है; ‘पीछा नहीं छोड़ेगी’ हिंदी में उसके निरंतर बने रहने को स्वाभाविक रूप से स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
