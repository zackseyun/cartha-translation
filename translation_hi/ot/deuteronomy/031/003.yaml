base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/003.yaml
  text: Yahweh your God himself is crossing over before you[a]. He himself will destroy these nations from before you, and you will dispossess them. Joshua himself is crossing over before you[b], just as Yahweh has spoken.
translation:
  language: hi
  text: याहवे, तुम्हारा परमेश्वर, स्वयं तुम्हारे आगे-आगे पार जा रहा है[a]। वह स्वयं इन जातियों को तुम्हारे सामने से नष्ट कर देगा, और तुम उन्हें बेदखल करोगे[b]। यहोशू स्वयं तुम्हारे आगे-आगे पार जा रहा है, जैसा याहवे ने कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे आगे-आगे चलता है” अथवा “तुम्हारे आगे-आगे पार जाएगा।” इब्रानी कृदन्त वर्तमान में जारी, निकट भविष्य के, या निश्चित भावी कार्य को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम उन पर अथवा उनकी भूमि पर अधिकार करोगे।” इब्रानी क्रिया में प्रायः पहले से बसे लोगों को बेदखल करके अधिकार लेने का भाव होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय और वाचागत संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הוּא
  choice: स्वयं / वही
  rationale: 'स्वतंत्र सर्वनाम का बल बनाए रखा गया है: पहले वाक्य में ‘स्वयं’ और अगले वाक्य में उसी कर्ता पर बल देने के लिए ‘वही’; यहोशू के साथ फिर ‘स्वयं’।'
- source_word: עֹבֵר לְפָנֶיךָ
  choice: तुम्हारे आगे पार जानेवाला है
  rationale: यह वाक्यांश आगे चलने और यरदन पार करने—दोनों संदर्भगत भावों को बनाए रखता है; कृदन्त निकट या निश्चित भावी कार्य सूचित कर सकता है।
- source_word: יַשְׁמִיד
  choice: नष्ट कर देगा
  rationale: हिफ़ील रूप के कारक विनाश के प्रबल अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: इन जातियों
  rationale: कनान के जातीय-राजनीतिक समुदायों के लिए ‘जातियाँ’ सामान्य और संदर्भानुकूल हिन्दी है।
- source_word: מִלְּפָנֶיךָ
  choice: तुम्हारे सामने से
  rationale: इसमें इस्राएल के मार्ग से हटाए जाने का स्थानिक भाव स्पष्ट और स्वाभाविक रहता है।
- source_word: וִירִשְׁתָּם
  choice: तुम उन्हें बेदखल करोगे
  rationale: विजय-संदर्भ में ירשׁ का अर्थ पहले से बसे लोगों को हटाकर अधिकार लेना है; प्रत्यक्ष कर्म ‘उन्हें’ भी सुरक्षित रखा गया है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: जैसा याहवे ने कहा है
  rationale: דִּבֶּר के सामान्य अर्थ ‘कहा/बोला’ को रखा गया है; ‘प्रतिज्ञा की’ जैसा व्याख्यात्मक विस्तार नहीं जोड़ा गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसका लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: याहवे और यहोशू की कार्यकारी भूमिका पर बल
  choice: दोनों के साथ मूल का बल सुरक्षित रखा गया
  alternative: साधारण सर्वनाम लगाकर बल को समतल करना
  rationale: पद ईश्वरीय और मानवीय कार्य-भूमिकाओं को साथ रखता है। ‘स्वयं’ इस अलंकारिक बल को बचाता है, बिना दोनों भूमिकाओं को प्रतिस्पर्धी बनाए।
- issue: וִירִשְׁתָּם में अधिकार और बेदखली का संबंध
  choice: तुम उन्हें बेदखल करोगे
  alternative: तुम उन पर/उनकी भूमि पर अधिकार करोगे
  rationale: प्रत्यक्ष कर्म जातियाँ हैं और विजय-संदर्भ में क्रिया बेदखल करके अधिकार लेने का अर्थ देती है; मुख्य पाठ में इसे संक्षेप में रखा और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पार जानेवाला है’ से इब्रानी कृदन्त की निकटता/निश्चितता तथा नदी पार करने का प्रसंग दोनों बने रहते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
