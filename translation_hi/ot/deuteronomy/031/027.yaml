source:
  edition: WLC
  text: כִּ֣י אָנֹכִ֤י יָדַ֨עְתִּי֙ אֶֽת מֶרְיְ/ךָ֔ וְ/אֶֽת עָרְפְּ/ךָ֖ הַ/קָּשֶׁ֑ה הֵ֣ן בְּ/עוֹדֶ/נִּי֩ חַ֨י עִמָּ/כֶ֜ם הַ/יּ֗וֹם מַמְרִ֤ים הֱיִתֶם֙ עִם יְהֹוָ֔ה וְ/אַ֖ף כִּי אַחֲרֵ֥י מוֹתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/027.yaml
  text: For I know your rebellion and your stiff neck[a]. Look, while I am still alive with you today, you have been rebellious against Yahweh[b]; and how much more after my death!
translation:
  language: hi
  text: क्योंकि मैं तुम्हारे विद्रोह और तुम्हारी अकड़ी हुई गर्दन[a] को जानता हूँ। देखो, आज जब मैं तुम्हारे साथ जीवित हूँ, तब भी तुम याहवे के विरुद्ध विद्रोही रहे हो; मेरी मृत्यु के बाद तो तुम कितना अधिक विद्रोह करोगे!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से “तुम्हारी अकड़ी हुई गर्दन”; यह हठ या ढीठपन का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרְיְךָ
  choice: तुम्हारे विद्रोह
  rationale: संज्ञा-रूप और वाचा के प्रति प्रतिरोध का भाव सुरक्षित रखता है।
- source_word: עָרְפְּךָ הַקָּשֶׁה
  choice: तुम्हारी अकड़ी हुई गर्दन
  rationale: हठ के लिए प्रयुक्त मूल इब्रानी रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הֵן
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले कथन-कण का आधुनिक और स्पष्ट हिन्दी समतुल्य है।
- source_word: בְּעוֹדֶנִּי חַי
  choice: जब मैं ... जीवित हूँ
  rationale: मूसा के अभी उनके बीच जीवित रहने की कालगत स्थिति स्पष्ट करता है।
- source_word: מַמְרִים הֱיִתֶם
  choice: तुम ... विद्रोही रहे हो
  rationale: היה के साथ कृदंत द्वारा व्यक्त निरंतर आचरण या अवस्था को दर्शाता है।
- source_word: עִם יְהוָה
  choice: यहोवा के विरुद्ध
  rationale: עִם का मूल अर्थ सामान्यतः 'साथ' है, पर विद्रोह के प्रसंग में यहाँ विरोध का संबंध अभिप्रेत है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित प्रतिलेखन द्वारा प्रस्तुत करता है, पदवी से प्रतिस्थापित नहीं करता।
- source_word: וְאַף כִּי
  choice: तो ... कितना अधिक
  rationale: वर्तमान स्थिति से भविष्य की अधिक प्रबल संभावना तक जाने वाले अलंकारिक निष्कर्ष को व्यक्त करता है।
- source_word: אַחֲרֵי מוֹתִי
  choice: मेरी मृत्यु के बाद
  rationale: मूल की संज्ञात्मक कालवाचक रचना का सीधा और गरिमापूर्ण अनुवाद है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को पदवी 'प्रभु' से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले रूप में रखा गया है।
- issue: עִם יְהוָה में संबंध का अर्थ
  choice: यहोवा के विरुद्ध
  alternative: यहोवा के साथ
  rationale: क्रिया-संबंधी भाव 'विद्रोही होना' यहाँ विरोध की माँग करता है; शाब्दिक 'साथ' हिन्दी में आशय अस्पष्ट या भ्रामक कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गरिमापूर्ण किंतु सहज है। मूल का गर्दन-वाला रूपक रखा गया है और उसकी व्याख्या पादटिप्पणी में दी गई है। अंतिम अलंकारिक तुलना को हिन्दी में पूर्ण वाक्य बनाने के लिए निहित क्रिया 'विद्रोह करोगे' स्पष्ट की गई है।
