source:
  edition: WLC
  text: חִזְק֣וּ וְ/אִמְצ֔וּ אַל תִּֽירְא֥וּ וְ/אַל תַּעַרְצ֖וּ מִ/פְּנֵי/הֶ֑ם כִּ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ ה֚וּא הַ/הֹלֵ֣ךְ עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֥א יַעַזְבֶֽ/ךָּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/006.yaml
  text: Be strong and courageous[a]. Do not fear or be terrified because of them, for Yahweh your God is the one who goes with you[b]; he will not fail you or forsake you.
translation:
  language: hi
  text: मज़बूत और साहसी बनो। उनसे भयभीत मत हो और न आतंकित हो, क्योंकि याहवे, तुम्हारा परमेश्वर, स्वयं तुम्हारे साथ चलता है; वह तुम्हें असहाय नहीं छोड़ेगा और न त्यागेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह तुम्हें ढीला न छोड़ेगा” या “तुम पर से अपनी पकड़ न छोड़ेगा”; भाव यह है कि वह तुम्हें सहारे के बिना नहीं छोड़ेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: मज़बूत और साहसी बनो
  rationale: दोनों बहुवचन आज्ञार्थक क्रियाओं का स्वाभाविक हिंदी युग्म; पहली सामर्थ्य और दूसरी दृढ़ साहस पर बल देती है।
- source_word: אַל תִּירְאוּ וְאַל תַּעַרְצוּ
  choice: मत डरो और न आतंकित हो
  rationale: दो निषेधों के बीच तीव्रता का अंतर रखा गया है; ערץ साधारण भय से अधिक प्रबल आतंक व्यक्त करता है।
- source_word: מִפְּנֵיהֶם
  choice: उनसे
  rationale: शाब्दिक अर्थ 'उनके सामने/उनकी उपस्थिति के कारण' है; इस संदर्भ में 'उनसे' संक्षिप्त और स्वाभाविक है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर यहोवा
  rationale: वाचा-संबंधी पदबंध को सीधे रखा गया है और יהוה को उपाधि से बदलने के बजाय व्यक्तिगत नाम 'यहोवा' से व्यक्त किया गया है।
- source_word: הוּא הַהֹלֵךְ עִמָּךְ
  choice: स्वयं तुम्हारे साथ चलता है
  rationale: הוּא और कृदंत की बलाघाती संरचना को 'स्वयं' द्वारा दिखाया गया है; वर्तमान आश्वासन का स्वाभाविक हिंदी रूप रखा गया है।
- source_word: לֹא יַרְפְּךָ
  choice: वह न तुम्हें असहाय छोड़ेगा
  rationale: रפה के हिफ़ील रूप में पकड़ ढीली करने या सहारा छोड़ देने का भाव है। यह अनुवाद अगले עזב से भेद रखते हुए आशय स्पष्ट करता है।
- source_word: וְלֹא יַעַזְבֶךָ
  choice: और न त्यागेगा
  rationale: עזב के छोड़ने या त्यागने के वाचा-संबंधी गंभीर भाव को संक्षिप्त रूप में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। हिंदी में व्यापक रूप से पहचाने जाने वाले नामरूप 'यहोवा' को रखा गया है, उसे 'प्रभु' जैसी उपाधि से नहीं बदला गया।
- issue: יַרְפְּךָ और יַעַזְבֶךָ के दोहरे आश्वासन का भेद
  choice: न तुम्हें असहाय छोड़ेगा और न त्यागेगा
  alternative: न तुम्हारा साथ छोड़ेगा और न तुम्हें त्यागेगा
  rationale: पहले पद में सहारा न छोड़ने और दूसरे में परित्याग न करने का भेद सुरक्षित है; दोनों को एक ही अर्थ में समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी, बहुवचन संबोधन और गरिमापूर्ण किंतु सामान्य-पाठक के लिए सहज शैली। 'आतंकित' दूसरे भय-सूचक क्रियापद की अधिक तीव्रता बनाए रखता है।
