    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: और जब
  rationale: यह रूप कथा में अगले घटनाक्रम की ओर संक्रमण कराता है; हिन्दी में आगे आने वाले कालवाचक उपवाक्य के साथ ‘और जब’ स्वाभाविक है।
- source_word: כְּכַלּוֹת מֹשֶׁה לִכְתֹּב
  choice: मूसा ... लिख चुका
  rationale: כ के साथ כלה का infinitive construct कार्य पूरा होने का समय बताता है। ‘लिख चुका’ पूर्णता और अगले पद से जुड़ने वाले अधूरे कालवाचक वाक्य—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: דִּבְרֵי
  choice: वचनों को
  rationale: लिखित विधिक सामग्री के संदर्भ में דבר के बहुवचन को ‘वचन’ कहना अर्थ और गरिमा दोनों बनाए रखता है।
- source_word: הַתּוֹרָה הַזֹּאת
  choice: इस व्यवस्था के
  rationale: व्यवस्थाविवरण के वाचा-विधिक संदर्भ में תורה के लिए ‘व्यवस्था’ प्रचलित और स्पष्ट है; संकेतवाचक הַזֹּאת को ‘इस’ से रखा गया है।
- source_word: עַל סֵפֶר
  choice: एक पुस्तक में
  rationale: शाब्दिक रूप से लेख किसी लिखित दस्तावेज़ पर अंकित होने की बात है। आधुनिक हिन्दी में ‘पुस्तक में’ स्वाभाविक है, जबकि पादटिप्पणी स्पष्ट करती है कि ספר आधुनिक जिल्दबंद पुस्तक तक सीमित नहीं है।
- source_word: עַד תֻּמָּם
  choice: अंत तक
  rationale: मुहावरा लिखने की पूर्णता को व्यक्त करता है और प्रत्यय का संबंध पूर्ववर्ती बहुवचन ‘वचनों’ से है। हिन्दी का ‘अंत तक लिख चुका’ संक्षिप्त और स्वाभाविक रूप से बताता है कि पूरा पाठ लिखा गया।
