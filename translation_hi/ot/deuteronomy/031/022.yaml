  source_fidelity: The draft accurately renders Moses, writing, the song, and teaching it to Israel. However, ‘उसी दिन’ can mean ‘that very/same day’ and adds a degree of identity/emphasis not required by בַּיּוֹם הַהוּא, which is more directly ‘on that day.’
