  text: So Moses wrote this song on that day and taught it to the sons of Israel[a].
translation:
  language: hi
  text: मूसा ने उस दिन यह गीत लिखा और इसे इस्राएलियों[a] को सिखाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘इस्राएल के पुत्रों’; यह इस्राएल की प्रजा के लिए प्रयुक्त एक मानक सामूहिक पद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: लिखा
  rationale: כתב के काल का सीधा कथात्मक अर्थ ‘लिखना’ है; ‘लिखा’ सहज और सटीक हिन्दी है।
- source_word: הַשִּׁירָה הַזֹּאת
  choice: यह गीत
  rationale: שִׁירָה यहाँ गीत को सूचित करता है और आसपास के साहित्यिक संदर्भ से मेल खाता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: यह प्रचलित कालवाचक पद है; प्रसंग में ‘उसी दिन’ स्वाभाविक हिन्दी है और निर्दिष्ट दिन की ओर संकेत बनाए रखता है।
- source_word: וַיְלַמְּדָהּ
  choice: इसे ... सिखाया
  rationale: למד के पिएल रूप का अर्थ ‘सिखाना’ है; स्त्रीलिंग प्रत्यय का पूर्वपद ‘गीत’ है, जिसे हिन्दी में ‘इसे’ द्वारा स्पष्ट रखा गया है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह इस्राएल की वाचा-सम्बन्धी प्रजा के लिए मानक सामूहिक पद है। आधुनिक हिन्दी में ‘इस्राएलियों’ उसका स्वाभाविक अर्थ देता है; शाब्दिक रूप ‘इस्राएल के पुत्रों’ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का लिंगयुक्त सामूहिक पद
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: इब्रानी पद का रूप शाब्दिकतः ‘इस्राएल के पुत्र’ है, पर यह पूरे इस्राएली समुदाय का मानक वाचा-सम्बन्धी नाम है। मुख्य पाठ में स्वाभाविक सामूहिक हिन्दी रखी गई है और मूल रूप पादटिप्पणी में बताया गया है, जिससे न तो आशय संकुचित होता है, न स्रोत-रूप छिपता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरम्भिक וַ को कथात्मक क्रम दिखाने के लिए ‘तब’ से व्यक्त किया गया है। ‘इस्राएलियों’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी मूल इब्रानी अभिव्यक्ति को स्पष्ट करती है।
