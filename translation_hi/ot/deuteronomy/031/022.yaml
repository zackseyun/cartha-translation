  terminology: ‘मूसा,’ ‘गीत,’ and ‘इस्राएलियों’ are appropriate. The footnote responsibly preserves the literal Hebrew expression ‘इस्राएल के पुत्रों’ while allowing a natural Hindi rendering in the text.
