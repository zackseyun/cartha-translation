    issue: ‘उसी दिन’ is slightly over-specific for בַּיּוֹם הַהוּא.
    rationale: The Hebrew demonstrative temporal expression means ‘on that day.’ While ‘उसी दिन’ is often possible in context, it can suggest ‘that same day’ more explicitly than the source requires. ‘उस दिन’ retains the temporal reference without adding this nuance.
