base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/025.yaml
  text: Moses commanded the Levites who carried the ark of the covenant of Yahweh[a], saying,
translation:
  language: hi
  text: 'मूसा ने याहवे की वाचा का संदूक उठानेवाले लेवियों को आज्ञा दी:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: क्रिया צוה यहाँ स्पष्ट आदेश देने का भाव व्यक्त करती है; आधुनिक मानक हिन्दी में ‘आज्ञा दी’ स्वाभाविक और सटीक है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: यह לוי के निश्चित बहुवचन का हिन्दी में प्रचलित और सटीक जातीय/सेवकीय नाम है।
- source_word: נֹשְׂאֵי
  choice: उठानेवाले
  rationale: נשא का कृदन्त लेवियों का विशेषण है और संदूक को उठाकर ले जाने की उनकी भूमिका बताता है; ‘उठानेवाले’ कृदन्तीय रूप को बनाए रखता है।
- source_word: אֲרוֹן
  choice: संदूक
  rationale: वाचा और पवित्रस्थान के प्रसंग में यह पवित्र वाचा-संदूक को दर्शाता है; हिन्दी बाइबलीय प्रयोग में ‘संदूक’ स्पष्ट और प्रतिष्ठित है।
- source_word: בְּרִית
  choice: वाचा का
  rationale: सम्बन्धवाचक संरचना ‘वाचा का संदूक’ मूल की construct chain को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए व्यक्तिगत ईश्वरीय नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जानेवाले लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: לֵאמֹר
  choice: 'यह आज्ञा दी:'
  rationale: यह रूप अगले पद में आने वाले प्रत्यक्ष कथन का परिचय देता है; हिन्दी में ‘यह आज्ञा दी:’ मूल के आदेश और कथन-परिचय दोनों को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। ‘यहोवा’ आधुनिक हिन्दी के सामान्य बाइबलीय पाठक के लिए पहचाना हुआ नाम है और इसे ‘प्रभु’ में बदलकर मूल का नाम-संबंधी भेद मिटाता नहीं। ‘याहवे’ स्रोत-रूप के अधिक निकट माना जाता है, पर हिन्दी में कम सामान्य है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उठानेवाले’ मूल कृदन्त की पद-सदृश वर्णनात्मक शक्ति को सुरक्षित रखता है। अन्त में द्विबिंदु अगले पद के प्रत्यक्ष कथन की ओर संकेत करता है।
