source:
  edition: WLC
  text: וַֽ/יהוָ֞ה ה֣וּא הַ/הֹלֵ֣ךְ לְ/פָנֶ֗י/ךָ ה֚וּא יִהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַֽעַזְבֶ֑/ךָּ לֹ֥א תִירָ֖א וְ/לֹ֥א תֵחָֽת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/008.yaml
  text: And Yahweh himself is the one going before you[a]. He himself will be with you; he will not fail you or forsake you. Do not fear or be dismayed.
translation:
  language: hi
  text: याहवे स्वयं तुम्हारे आगे चलने वाला है। वही तुम्हारे साथ रहेगा। वह तुम्हें गिरने नहीं देगा[a] और न तुम्हें त्यागेगा। मत डरो और हिम्मत मत हारो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह तुम्हें ढीला नहीं छोड़ेगा।”
    reason: רפה के हिफ़ील रूप में ‘ढीला छोड़ना’, ‘गिरने देना’ अथवा सहायता का सहारा न देना जैसे निकटवर्ती अर्थ संभव हैं।
lexical_decisions:
- source_word: וַיהוָה
  choice: याहवे
  rationale: इब्रानी मूल में परमेश्वर का निज नाम יהוה है; उसका लिप्यंतरण covenant name को स्पष्ट रखता है।
- source_word: הוּא
  choice: स्वयं / वही
  rationale: दोनों स्थानों पर स्वतंत्र सर्वनाम बलसूचक है; हिंदी में पहले ‘स्वयं’ और फिर ‘वही’ उस बल को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: הַהֹלֵךְ לְפָנֶיךָ
  choice: तुम्हारे आगे चलनेवाला है
  rationale: कृदंत चल रहे अथवा विशेषतापूर्ण कार्य का भाव देता है; यह रूप मार्गदर्शन और सुरक्षा के लिए आगे जाने का भाव बनाए रखता है।
- source_word: יִהְיֶה עִמָּךְ
  choice: तुम्हारे साथ रहेगा
  rationale: यह परमेश्वर की सतत उपस्थिति का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: לֹא יַרְפְּךָ
  choice: तुम्हें असहाय नहीं छोड़ेगा
  rationale: רפה के हिफ़ील रूप में पकड़ ढीली करने, गिरने देने या सहायता से वंचित करने का भाव हो सकता है। यह चयन अगले עזב से कुछ भेद रखते हुए आश्वासन को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: और न तुम्हें त्यागेगा
  rationale: עזב का अर्थ छोड़ देना या त्याग देना है; ‘त्यागेगा’ पद की गंभीरता और पहले क्रियापद से भेद बनाए रखता है।
- source_word: לֹא תִירָא
  choice: मत डरो
  rationale: यहाँ अपूर्ण क्रिया निषेधात्मक प्रोत्साहन का कार्य करती है; ‘मत डरो’ आधुनिक हिंदी में सीधा और स्वाभाविक है।
- source_word: וְלֹא תֵחָת
  choice: और हिम्मत मत हारो
  rationale: חתת के निफ़ाल में भय से टूट जाने, निरुत्साहित होने या घबरा जाने का भाव है; ‘हिम्मत मत हारो’ पहले निषेध की अनावश्यक पुनरावृत्ति से बचते हुए इसे सामान्य हिंदी में व्यक्त करता है।
theological_decisions:
- issue: יהוה परमेश्वर के निज नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में टेट्राग्राम יהוה सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और इसे केवल उपाधि में बदलने से बचाता है।
- issue: לֹא יַרְפְּךָ और לֹא יַעַזְבֶךָּ के बीच संबंध
  choice: ‘असहाय नहीं छोड़ेगा’ और ‘त्यागेगा नहीं’ के रूप में दो संबंधित पर अलग आश्वासन
  alternative: दोनों को लगभग समानार्थी ‘साथ नहीं छोड़ेगा और न त्यागेगा’ कहना
  rationale: मूल में दो अलग क्रियाएँ हैं। अनुवाद उनकी समानता को स्वीकार करते हुए רפה में न गिरने देने या सहायता न हटाने की छाया को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। एकवचन पुल्लिंग संबोधन को हिंदी के सामान्य ‘तुम’ से व्यक्त किया गया है; बलसूचक הוּא को ‘स्वयं’ और ‘वही’ से सुरक्षित रखा गया है।
