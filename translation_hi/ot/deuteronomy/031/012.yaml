source:
  edition: WLC
  text: הַקְהֵ֣ל אֶת הָ/עָ֗ם הָֽ/אֲנָשִׁ֤ים וְ/הַ/נָּשִׁים֙ וְ/הַ/טַּ֔ף וְ/גֵרְ/ךָ֖ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ לְמַ֨עַן יִשְׁמְע֜וּ וּ/לְמַ֣עַן יִלְמְד֗וּ וְ/יָֽרְאוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/שָֽׁמְר֣וּ לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/012.yaml
  text: Assemble the people—the men[a], the women, the little children, and the sojourner within your gates—so that they may hear, and so that they may learn and fear Yahweh your God[d][c][b], and be careful to do all the words of this law.
translation:
  language: hi
  text: लोगों को इकट्ठा करो—पुरुषों, स्त्रियों, छोटे बच्चों और तुम्हारे नगरों में रहने वाले परदेशी को[a][b]—ताकि वे सुनें, सीखें और तुम्हारे परमेश्वर यहवे का भय मानें[c], और इस व्यवस्था की सभी बातों का सावधानी से पालन करें[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘तुम्हारे फाटकों के भीतर’; यह मुहावरा तुम्हारे नगरों या समुदाय के भीतर रहनेवालों को सूचित करता है।
    reason: cultural_note
  - marker: b
    text: '‘परदेशी’ उस गैर-इस्राएली निवासी को सूचित करता है जो इस्राएलियों के बीच रहता था। विकल्प: ‘प्रवासी निवासी।’'
    reason: lexical_alternative
  - marker: c
    text: या, ‘तुम्हारे परमेश्वर यहवे के प्रति श्रद्धापूर्ण भय रखें।’ इब्रानी क्रिया में भय, श्रद्धा और आज्ञाकारी विस्मय के भाव सम्मिलित हैं।
    reason: lexical_alternative
  - marker: d
    text: ‘व्यवस्था’ के लिए प्रयुक्त इब्रानी शब्द ‘तोराह’ का अर्थ ‘शिक्षा’ या ‘निर्देश’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהֵל אֶת־הָעָם
  choice: लोगों को इकट्ठा करो
  rationale: हिफ़ील आज्ञार्थक क्रिया लोगों को एक सभा के रूप में एकत्र करने की आज्ञा देती है। ‘इकट्ठा करो’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים וְהַטַּף
  choice: पुरुषों, स्त्रियों, छोटे बच्चों
  rationale: मूल पाठ में तीनों समूह स्पष्ट रूप से गिनाए गए हैं। טַף प्रायः छोटे बच्चों या आश्रित बालकों को सूचित करता है, इसलिए ‘छोटे बच्चों’ चुना गया है।
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: तुम्हारे नगरों में रहनेवाले परदेशी को
  rationale: גֵר इस्राएल के बीच रहनेवाले गैर-स्थानीय निवासी को सूचित करता है। ‘तुम्हारे फाटकों के भीतर’ नगर या समुदाय के भीतर रहने का सामी मुहावरा है; मुख्य पाठ में उसका स्वाभाविक हिन्दी अर्थ दिया गया है।
- source_word: לְמַעַן יִשְׁמְעוּ וּלְמַעַן יִלְמְדוּ
  choice: ताकि वे सुनें और सीखें
  rationale: दोनों उद्देश्यवाचक खंडों का क्रम और संचयी भाव रखा गया है। ‘सुनें’ व्यवस्थाविवरण में वाचा-संबंधी सुनने की प्रमुख शब्दावली को भी बनाए रखता है।
- source_word: וְיָרְאוּ אֶת־יְהוָה אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर यहवे का भय मानें
  rationale: ירא में वास्तविक भय के साथ श्रद्धा, विस्मय और आज्ञाकारिता का भाव भी है। ‘भय मानें’ मूल अर्थ और उसकी धार्मिक गंभीरता को खुला रखता है। יְהוָה को व्यक्तिगत वाचा-नाम ‘यहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: וְשָׁמְרוּ לַעֲשׂוֹת
  choice: सावधानी से पालन करें
  rationale: שמר और क्रियार्थक रूप का संयोजन ध्यानपूर्वक मानने और कार्य में उतारने का भाव देता है। यह हिन्दी में स्वाभाविक रूप से ‘सावधानी से पालन करें’ है।
- source_word: כָּל־דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: इस व्यवस्था की सभी बातों
  rationale: דִּבְרֵי के ‘बातों/वचनों’ वाले ठोस भाव को बनाए रखा गया है। תּוֹרָה का अर्थ ‘शिक्षा’ भी हो सकता है, पर यहाँ वाचा-संबंधी विधान के संदर्भ में ‘व्यवस्था’ उपयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘यहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: ירא में भय और श्रद्धा का संबंध
  choice: भय मानें
  alternative: श्रद्धा रखें; श्रद्धापूर्वक भय मानें
  rationale: सिर्फ ‘श्रद्धा रखें’ कहने से मूल क्रिया का भय-संबंधी तनाव दब सकता है। ‘भय मानें’ मूल को निकटता से रखता है; पादटिप्पणी उसके श्रद्धा और आज्ञाकारी विस्मय के आयाम को स्पष्ट करती है।
- issue: सभा के समूहों की स्पष्ट गणना
  choice: पुरुषों, स्त्रियों, छोटे बच्चों
  alternative: सभी लोगों को
  rationale: मूल पाठ समुदाय को केवल सामूहिक शब्द में सीमित नहीं रखता, बल्कि पुरुषों, स्त्रियों और छोटे बच्चों को स्पष्ट रूप से गिनाता है; अनुवाद में यह समावेशी गणना सुरक्षित रखी गई है।
- issue: תּוֹרָה का संदर्भगत अर्थ
  choice: व्यवस्था
  alternative: शिक्षा; निर्देश
  rationale: शब्द का अर्थ व्यापक रूप से शिक्षा या निर्देश हो सकता है, किंतु इस वाचा-पाठ और सार्वजनिक पठन के प्रसंग में ‘व्यवस्था’ स्वाभाविक है। विकल्प पादटिप्पणी में दिया गया है ताकि अर्थ-क्षेत्र संकुचित न हो।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, सार्वजनिक पाठ के योग्य और गरिमापूर्ण रखी गई है। वाक्य में मूल की स्पष्ट समूह-सूची और उद्देश्य-क्रम सुरक्षित हैं, जबकि ‘फाटकों के भीतर’ जैसे सामी मुहावरे का अर्थ मुख्य पाठ में स्वाभाविक हिन्दी में दिया गया है।
