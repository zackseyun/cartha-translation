base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/007.yaml
  text: Then Moses called Joshua and said to him in the sight of all Israel[a], “Be strong and courageous, because you will go with this people into the land that Yahweh swore to their fathers to give them[b], and you will give it to them as an inheritance.”
translation:
  language: hi
  text: तब मूसा ने यहोशू को बुलाया और सारे इस्राएल के सामने उससे कहा, “दृढ़ और साहसी बनो, क्योंकि तुम इस प्रजा के साथ[a] उस देश में जाओगे, जिसे उन्हें देने की शपथ याहवे ने उनके पिताओं[b] से खाई थी; और तुम उन्हें वह देश विरासत में दिलाओगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम इस प्रजा को उस देश में ले जाओगे।” इब्रानी वाक्यांश का अर्थ यहोशू का प्रजा के साथ जाना या उसका प्रजा को भीतर ले जाना—दोनों हो सकता है। मुख्य पाठ पहले अर्थ को रखता है; अगले खंड में वह उन्हें देश विरासत में दिलाने की सक्रिय भूमिका निभाता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “उनके पिताओं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाया
  rationale: कथा के इस प्रसंग में קרא का स्वाभाविक अर्थ बुलाना है; यह हिन्दी में सहज है और अनावश्यक रूप से औपचारिक पद-नियुक्ति का भाव नहीं जोड़ता।
- source_word: לִיהוֹשֻׁעַ
  choice: यहोशू
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  choice: सारे इस्राएल के सामने
  rationale: शाब्दिक रूप से ‘सारे इस्राएल की आँखों के सामने’; चुना हुआ रूप सार्वजनिक और प्रत्यक्ष अवसर का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲזַק וֶאֱמָץ
  choice: दृढ़ और साहसी बने रहो
  rationale: दोनों आज्ञार्थक क्रियाएँ नेतृत्व के लिए स्थिरता, शक्ति और साहस का आह्वान करती हैं। ‘बने रहो’ इस प्रोत्साहन को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह मूसा के प्रोत्साहन का कारण प्रस्तुत करता है।
- source_word: תָּבוֹא אֶת הָעָם הַזֶּה
  choice: तुम इस प्रजा के साथ ... जाओगे
  rationale: בוא के साथ את־העם को यहाँ यहोशू के लोगों के साथ प्रवेश करने के अर्थ में समझा गया है। ‘ले जाओगे’ भी सम्भव है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: इस प्रसंग में הארץ प्रतिज्ञात भूभाग को सूचित करता है; ‘देश’ सामान्य आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: נִשְׁבַּע יְהוָה
  choice: शपथ यहोवा ने ... खाई थी
  rationale: निफ़अल שׁבע शपथ खाने को व्यक्त करता है; हिन्दी वाक्य-विन्यास के अनुसार शब्दक्रम स्वाभाविक बनाया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ द्वारा इब्रानी परमेश्वर-नाम को शीर्षक से प्रतिस्थापित किए बिना व्यक्त किया गया है।
- source_word: לַאֲבֹתָם
  choice: उनके पुरखाओं
  rationale: ‘पुरखा’ पुरुषवाची पारिवारिक-सामुदायिक शब्द है, जो यहाँ पूर्वज पिताओं का भाव सहज हिन्दी में देता है; अधिक शाब्दिक रूप पादटिप्पणी में है।
- source_word: לָתֵת לָהֶם
  choice: जिसे देने
  rationale: यह शपथ की विषयवस्तु बताने वाली सीधी infinitive रचना है। प्राप्तकर्ताओं का संकेत प्रसंग और ‘उनके पुरखाओं’ से स्पष्ट है।
- source_word: תַּנְחִילֶנָּה אֹתָם
  choice: तुम उन्हें वह देश विरासत में दिलाओगे
  rationale: नחל का हिफ़इल रूप किसी को विरासत का अधिकारी बनाने या विरासत दिलाने का अर्थ देता है। यह अनुवाद सक्रिय नेतृत्व और विरासत—दोनों भावों को स्पष्ट रखता है।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में निजी वाचा-नाम है, इसलिए उसे ‘प्रभु’ जैसे शीर्षक से नहीं बदला गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में अधिक परिचित नामरूप है।
- issue: תָּבוֹא אֶת הָעָם में यहोशू की भूमिका
  choice: तुम इस प्रजा के साथ ... जाओगे
  alternative: तुम इस प्रजा को ... ले जाओगे
  rationale: इब्रानी रचना यहोशू के प्रजा के साथ प्रवेश करने और उसके उन्हें भीतर ले जाने—दोनों अर्थों की अनुमति देती है। मुख्य पाठ निकटतर अकर्मक अर्थ रखता है और दूसरे अर्थ को पादटिप्पणी में सुरक्षित करता है; अगला खंड उसकी सक्रिय नेतृत्व-भूमिका स्पष्ट करता है।
- issue: אֲבֹתָם का लिंग और वंशगत अर्थ
  choice: उनके पुरखाओं
  alternative: उनके पूर्वजों / उनके पिताओं
  rationale: मूल का पुरुषवाची संबंधसूचक भाव ‘पुरखाओं’ से सुरक्षित रहता है, जबकि पादटिप्पणी शाब्दिक रूप बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सार्वजनिक संबोधन के अनुरूप गरिमापूर्ण और सहज रखी गई है। ‘प्रजा’, ‘शपथ’ और ‘विरासत’ वाचा तथा भूमि के प्रसंग को स्पष्ट रखते हैं। सभी पादटिप्पणी-चिह्न सम्बद्ध पदबंधों के तुरंत बाद दिए गए हैं।
