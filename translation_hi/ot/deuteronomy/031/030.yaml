  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘वचन’ मूल पाठ की औपचारिक अभिव्यक्ति को बचाता है, और पादटिप्पणी עַד תֻּמָּם की वास्तविक व्याकरणिक/अर्थगत अस्पष्टता को दर्ज करती है।
