  yaml_path: translation/ot/deuteronomy/031/030.yaml
  text: Then Moses spoke the words of this song in the hearing of all the assembly of Israel[a], until they were finished.
translation:
  language: hi
  text: तब मूसा ने इस्राएल की सारी सभा को इस गीत के वचन सुनाए, जब तक वे समाप्त न हो गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक उसने उन्हें समाप्त न कर लिया”—अर्थात् जब तक मूसा ने गीत के सभी वचन कहना समाप्त न कर दिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब मूसा ने ... कहे
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम दिखाता है। ‘कहे’ का संबंध ‘वचन’ से स्वाभाविक रूप से बैठता है।
- source_word: בְּאָזְנֵי
  choice: को सुनाते हुए
  rationale: शाब्दिक अर्थ ‘कानों में’ है, पर यहाँ आशय ऐसी घोषणा से है जिसे पूरी सभा सुने। यह हिन्दी प्रयोग अर्थ को स्वाभाविक और स्पष्ट रखता है।
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: इस्राएल की सारी सभा
  rationale: קהל एकत्र समुदाय या सभा को दर्शाता है। ‘सभा’ आधुनिक, गरिमापूर्ण और गैर-सांप्रदायिक शब्द है; ‘सारी’ כָּל के व्यापक अर्थ को व्यक्त करता है।
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: इस गीत के वचन
  rationale: इब्रानी में केवल ‘गीत’ नहीं, बल्कि स्पष्टतः ‘इस गीत के वचन’ हैं; इसलिए ‘वचन’ बनाए रखा गया है।
- source_word: עַד תֻּמָּם
  choice: जब तक वे पूरे न हो गए
  rationale: पुल्लिंग बहुवचन प्रत्यय का सबसे स्वाभाविक पूर्वपद ‘वचन’ है। निष्क्रिय भाव इब्रानी रूप को सुरक्षित रखता है, यद्यपि कर्तृवाच्य अर्थ भी संभव है।
