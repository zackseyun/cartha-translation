  text: וּ/בְנֵי/הֶ֞ם אֲשֶׁ֣ר לֹֽא יָדְע֗וּ יִשְׁמְעוּ֙ וְ/לָ֣מְד֔וּ לְ/יִרְאָ֖ה אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם כָּל הַ/יָּמִ֗ים אֲשֶׁ֨ר אַתֶּ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/013.yaml
  text: And their children[a], who have not known[c][b], shall hear and learn to fear Yahweh your God all the days that you live on the land that you are crossing the Jordan to possess.
translation:
  language: hi
  text: और उनके बच्चे[a], जो अब तक नहीं जानते[b], सुनेंगे और तुम्हारे परमेश्वर याहवे[c] का भय मानना सीखेंगे, जब तक तुम उस देश में जीवित रहोगे जिसे अपने अधिकार में लेने[d] के लिए तुम यरदन पार कर रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके पुत्र।” हिब्रू शब्द विशेष रूप से पुत्रों या व्यापक रूप से बच्चों और वंशजों का उल्लेख कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल हिब्रू में यह नहीं बताया गया कि वे किसे या क्या नहीं जानते; आशय अब तक प्राप्त न हुए ज्ञान या अनुभव से हो सकता है।
    reason: ambiguity_preservation
  - marker: c
    text: 'हिब्रू: YHWH; परंपरागत रूप से “प्रभु” और कभी-कभी “यहोवा” लिखा जाता है।'
    reason: alternative_reading
  - marker: d
    text: या “उसे उत्तराधिकार में पाने।” हिब्रू क्रिया में अधिकार लेने और उत्तराधिकार पाने, दोनों की अर्थ-छाया हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: और उनके बच्चे
  rationale: בנים का अर्थ विशेष रूप से ‘पुत्र’ भी हो सकता है, पर इस वाचा-संबंधी शिक्षा के संदर्भ में यह अगली पीढ़ी को व्यापक रूप से दर्शाता है।
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: जिन्होंने अब तक नहीं जाना है
  rationale: पूर्ण क्रिया पूर्व ज्ञान या अनुभव के अभाव की ओर संकेत करती है। मूल में कर्म नहीं बताया गया है, इसलिए अनुवाद भी यह अस्पष्टता बनाए रखता है।
- source_word: יִשְׁמְעוּ וְלָמְדוּ
  choice: सुनेंगे ... सीखेंगे
  rationale: दोनों क्रियाएँ अपेक्षित भावी परिणाम को क्रम में व्यक्त करती हैं; हिन्दी में भविष्यकाल स्वाभाविक है।
- source_word: לְיִרְאָה
  choice: का भय मानना
  rationale: व्यवस्थाविवरण में ירא परमेश्वर के प्रति वाचा-संबंधी भय और श्रद्धा दोनों का भार रखता है; ‘भय मानना’ इस धार्मिक अर्थ को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम YHWH को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: उन सभी दिनों में ... जब तक तुम ... जीवित रहोगे
  rationale: यह जीवन-भर की अवधि को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है और ‘सभी दिनों’ की हिब्रू अभिव्यक्ति भी बनाए रखता है।
- source_word: עַל הָאֲדָמָה
  choice: उस देश में
  rationale: यहाँ אֲדָמָה मिट्टी मात्र नहीं, इस्राएल के निवास का भू-प्रदेश है; हिन्दी में ‘देश में’ स्वाभाविक है।
- source_word: לְרִשְׁתָּהּ
  choice: जिसे अपने अधिकार में लेने
  rationale: ירשׁ प्रतिज्ञात देश को उत्तराधिकार में पाने और उस पर अधिकार करने, दोनों अर्थ-छायाएँ रखता है; मुख्य पाठ में ‘अधिकार में लेने’ से प्रवेश और अधिग्रहण का प्रसंग स्पष्ट रहता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ पारंपरिक प्रतिस्थापन है, जबकि ‘यहोवा’ दूसरा प्रचलित लिप्यंतरण है।
- issue: בנים का दायरा
  choice: बच्चे
  alternative: पुत्र
  rationale: इस प्रसंग में वाचा की शिक्षा अगली पीढ़ी के लिए है; अतः व्यापक अर्थ ‘बच्चे’ उचित है, जबकि शाब्दिक पुरुषवाची विकल्प को पादटिप्पणी में रखा गया है।
- issue: לְרִשְׁתָּהּ में अधिकार और उत्तराधिकार की अर्थ-छाया
  choice: अपने अधिकार में लेने
  alternative: उत्तराधिकार में पाने
  rationale: व्यवस्थाविवरण में ירשׁ प्रतिज्ञा के उत्तराधिकार तथा वास्तविक अधिकार-ग्रहण दोनों को व्यक्त कर सकता है। मुख्य पाठ अधिकार-ग्रहण को रखता है और वैकल्पिक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। बहुवचन ‘तुम’ इस्राएल को किए गए प्रत्यक्ष वाचा-संबंधी संबोधन को बनाए रखता है। लंबे हिब्रू वाक्य को हिन्दी की स्पष्टता के लिए दो वाक्यों में बाँटा गया है; दूसरे वाक्य का ‘ऐसा’ सुनने और सीखने की क्रियाओं को जीवन-भर जारी रखने से जोड़ता है।
