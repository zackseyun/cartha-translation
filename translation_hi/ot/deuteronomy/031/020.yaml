  text: כִּֽי אֲבִיאֶ֜/נּוּ אֶֽל הָ/אֲדָמָ֣ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֹתָ֗י/ו זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ וְ/אָכַ֥ל וְ/שָׂבַ֖ע וְ/דָשֵׁ֑ן וּ/פָנָ֞ה אֶל אֱלֹהִ֤ים אֲחֵרִים֙ וַ/עֲבָד֔וּ/ם וְ/נִ֣אֲצ֔וּ/נִי וְ/הֵפֵ֖ר אֶת בְּרִיתִֽ/י־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/020.yaml
  text: For when I bring him into the land that I swore to his fathers[a], a land flowing with milk and honey, and he eats and is satisfied and grows fat, then he will turn to other gods and serve them[b], and spurn me and break my covenant.
translation:
  language: hi
  text: क्योंकि जब मैं उसे उस देश में ले आऊँगा, जिसकी मैंने उसके पूर्वजों से शपथ खाकर प्रतिज्ञा की थी[a]—उस देश में जहाँ दूध और मधु की धाराएँ बहती हैं—और वह खाकर तृप्त हो जाएगा और मोटा हो जाएगा, तब वह दूसरे देवताओं की ओर मुड़ेगा, और वे उनकी सेवा करेंगे तथा मेरा तिरस्कार करेंगे[b], और वह मेरी वाचा तोड़ देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इस्राएल के लिए पहले सामूहिक एकवचन (‘उसे … वह’) आता है। फिर ‘वे उनकी सेवा करेंगे’ और ‘वे मेरा तिरस्कार करेंगे’ में बहुवचन है, और ‘वह मेरी वाचा तोड़ देगा’ में फिर एकवचन आता है।
    reason: स्रोत में संख्या-परिवर्तन और इस्राएल के सामूहिक संदर्भ को स्पष्ट करना।
  - marker: b
    text: ‘तिरस्कार करेंगे’ का अनुवाद ‘अपमानित करेंगे’ या ‘ठुकराएँगे’ भी हो सकता है।
    reason: נָאַץ में अवमानना, तिरस्कार और अस्वीकार का भाव है; हिंदी में एक से अधिक निकट विकल्प संभव हैं।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि जब
  rationale: यह पिछले कथन का कारण भी प्रस्तुत करता है और आगामी परिस्थिति का समय भी बताता है; ‘क्योंकि जब’ दोनों भावों को स्वाभाविक हिंदी में रखता है।
- source_word: אֲבִיאֶנּוּ
  choice: मैं उसे ... ले आऊँगा
  rationale: हिफ़ील रूप में प्रथम पुरुष एकवचन कर्ता और तृतीय पुरुष पुल्लिंग एकवचन कर्म है; ‘उसे’ सामूहिक एकवचन इस्राएल को दर्शाता है।
- source_word: הָאֲדָמָה
  choice: देश
  rationale: यहाँ भौगोलिक और वाचागत संदर्भ में प्रतिज्ञात देश अभिप्रेत है, केवल मिट्टी या भूमि नहीं।
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתָיו
  choice: जिसके विषय में मैंने उसके पूर्वजों से शपथ खाई थी
  rationale: ‘उसके’ सामूहिक एकवचन को बनाए रखता है। हिंदी में ‘पूर्वजों से शपथ खाना’ शपथ के प्राप्तकर्ताओं को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: जहाँ दूध और मधु की धाराएँ बहती हैं
  rationale: समृद्धि के ठोस इब्रानी मुहावरे को अर्थपूर्ण, परिचित और स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: וְאָכַל וְשָׂבַע וְדָשֵׁן
  choice: वह खाकर तृप्त हो जाएगा और मोटा हो जाएगा
  rationale: भविष्य की क्रमिक क्रियाओं को व्यक्त करता है और דשן की समृद्धि से उपजी शारीरिक मोटाई की तीखी उपमा को नरम नहीं करता।
- source_word: וּפָנָה אֶל אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं की ओर फिरेगा
  rationale: धार्मिक निष्ठा के दूसरी ओर मुड़ने की मूल छवि रखता है; ‘मूर्तिपूजा करेगा’ जैसा व्याख्यात्मक शब्द नहीं जोड़ता।
- source_word: וַעֲבָדוּם
  choice: उनकी सेवा करेगा
  rationale: עבד के सेवा और धार्मिक उपासना दोनों से जुड़े वाचागत अर्थ को सुरक्षित रखता है। व्यंजनात्मक लेखन बहुवचन प्रत्यय दिखाता है, जबकि क्रिया का रूप एकवचन पढ़ा जा सकता है।
- source_word: וְנִאֲצוּנִי
  choice: वे मेरा तिरस्कार करेंगे
  rationale: व्यंजनात्मक रूप बहुवचन कर्ता दर्शाता है और נאץ में निहित अवमानना को ‘तिरस्कार’ स्पष्ट रूप से व्यक्त करता है।
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  choice: मेरी वाचा तोड़ देंगे
  rationale: वाचा को भंग करने की मूल कानूनी-वाचागत भाषा को हिंदी में सीधे व्यक्त करता है; व्यंजनात्मक रूप एकवचन हो सकता है, पर निकटवर्ती बहुवचन कर्ता के साथ हिंदी में बहुवचन स्वाभाविक है।
theological_decisions:
- issue: इस्राएल के लिए सामूहिक एकवचन से बहुवचन की ओर बदलाव
  choice: आरंभ में ‘उसे/वह’ रखा गया है, फिर व्यंजनात्मक इब्रानी के बहुवचन प्रत्यय और क्रिया के अनुरूप ‘उनकी/वे’ किया गया है।
  alternative: पूरे पद में या तो केवल बहुवचन ‘उन्हें/वे’ अथवा केवल एकवचन ‘उसे/वह’ रखना।
  rationale: इब्रानी इस्राएल को एक समुदाय और उसके अनेक सदस्यों—दोनों रूपों में प्रस्तुत करता है। संख्या-परिवर्तन को पूरी तरह समतल कर देना स्रोत की वास्तविक बनावट और तनाव को मिटा देता।
- issue: वाव-क्रम में क्रिया-संख्या की पाठगत असमानता
  choice: ‘वे मेरा तिरस्कार करेंगे और मेरी वाचा तोड़ देंगे’ द्वारा बहुवचन को हिंदी में प्रवाहपूर्ण रखा गया है, जबकि टिप्पणी में व्यंजनात्मक रूपों की असमानता बताई गई है।
  alternative: ‘वह ... उनकी सेवा करेगा, वे मेरा तिरस्कार करेंगे, और वह मेरी वाचा तोड़ेगा’ जैसी अत्यंत शाब्दिक संख्या-अदला-बदली।
  rationale: WLC के लिखित व्यंजन और मासोरेटी संकेतों में संख्या संबंधी जटिलता है। मुख्य पाठ को समझने योग्य रखते हुए पादटिप्पणी वास्तविक सामूहिक एकवचन/बहुवचन बदलाव को उजागर करती है, किसी धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं करती।
- issue: अन्य देवताओं के प्रति वाचा-भंग की भाषा
  choice: ‘दूसरे देवताओं की ओर फिरेगा और उनकी सेवा करेगा’
  alternative: ‘मूर्तिपूजा करेगा’ या ‘धर्मत्याग करेगा’
  rationale: मूल पाठ विशिष्ट क्रियाओं—मुड़ना और सेवा करना—का वर्णन करता है। धर्मत्याग या मूर्तिपूजा उनका निहितार्थ है, पर अनुवाद में व्याख्यात्मक लेबल जोड़ना आवश्यक नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘वाचा’ बाइबिलीय-संधिगत अर्थ को संक्षेप में रखता है; ‘मोटा हो जाएगा’ मूल की जानबूझकर तीखी समृद्धि-उपमा को सुरक्षित रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में सम्मिलित हैं।
