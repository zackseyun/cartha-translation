  text: And the LORD will give them over to you, and you shall do to them according to all the commandment that I have commanded you.
translation:
  language: hi
  text: और यहोवा उन्हें तुम्हारे वश में कर देगा, और तुम उनके साथ वैसा ही करना जैसा मैंने तुम्हें पूरी आज्ञा में करने की आज्ञा दी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתָנָם ... לִפְנֵיכֶם
  choice: उन्हें तुम्हारे हाथ में कर देगा
  rationale: शाब्दिक रूप से ‘उन्हें तुम्हारे सामने कर देगा’; इस युद्ध-संदर्भ में यह उन्हें इस्राएल के अधिकार में सौंपने का स्वाभाविक हिंदी मुहावरा है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य हिंदी बाइबलीय रूप में प्रस्तुत किया गया है।
- source_word: כְּכָל הַמִּצְוָה
  choice: उस सारी आज्ञा के अनुसार
  rationale: एकवचन सामूहिक संज्ञा ‘आज्ञा’ और כְּכָל का समग्र भाव सुरक्षित रहता है।
- source_word: צִוִּיתִי אֶתְכֶם
  choice: मैंने तुम्हें दी है
  rationale: हिंदी में ‘आज्ञा देना’ स्वाभाविक है; पूर्ण क्रिया का वर्तमान-संबद्ध प्रभाव ‘दी है’ से व्यक्त होता है।
theological_decisions:
- issue: युद्ध-संदर्भ में राष्ट्रों का सौंपा जाना
  choice: यहोवा उन्हें तुम्हारे हाथ में कर देगा
  alternative: यहोवा उन्हें तुम्हारे सामने कर देगा
  rationale: ‘हाथ में कर देगा’ संदर्भगत आशय स्पष्ट करता है, पर विजय के तरीके या सीमा के विषय में पाठ से अधिक धर्मवैज्ञानिक विवरण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘करना’ का प्रयोग मूसा के निर्देशात्मक वाक्य का बल बनाए रखता है।
