  text: וַ/יְצַ֞ו אֶת יְהוֹשֻׁ֣עַ בִּן נ֗וּן וַ/יֹּאמֶר֮ חֲזַ֣ק וֶֽ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבִיא֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣עְתִּי לָ/הֶ֑ם וְ/אָנֹכִ֖י אֶֽהְיֶ֥ה עִמָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/023.yaml
  text: And he commanded Joshua son of Nun and said[a], “Be strong and courageous, for you will bring the sons of Israel into the land that I swore to them, and I will be with you.”
translation:
  language: hi
  text: और उसने नून के पुत्र यहोशू को आज्ञा दी और कहा, “दृढ़ और साहसी बनो, क्योंकि तुम इस्राएल के पुत्रों[a] को उस देश में ले जाओगे, जिसकी मैंने उन्हें शपथ दी थी; और मैं तुम्हारे साथ रहूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली” अथवा “इस्राएल के लोग।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: शाब्दिक पारिवारिक अभिव्यक्ति और उसके सहज सामूहिक हिन्दी विकल्प बताने के लिए।
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: पिएल रूप का सीधा अर्थ ‘आज्ञा देना’ या गंभीर दायित्व सौंपना है; ‘आज्ञा दी’ आधुनिक हिन्दी में स्पष्ट है और नियुक्ति के प्रसंग के अनुकूल है।
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: नून के पुत्र यहोशू
  rationale: यह हिन्दी में स्वाभाविक वंशसूचक संरचना है और दोनों व्यक्तिनामों को प्रचलित बाइबलीय रूप में रखती है।
- source_word: חֲזַק וֶאֱמָץ
  choice: दृढ़ और साहसी बनो
  rationale: यह युग्म सामर्थ्य के साथ मनोबल और साहस का आह्वान करता है; ‘दृढ़ और साहसी’ दोनों पक्षों को सहज हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह प्रोत्साहन का कारण प्रस्तुत करता है, इसलिए कारणवाचक ‘क्योंकि’ उपयुक्त है।
- source_word: תָּבִיא
  choice: ले जाओगे
  rationale: हिफ़ील रूप का अर्थ किसी को भीतर लाना या पहुँचाना है; देश के साथ हिन्दी में ‘देश में ले जाओगे’ स्वाभाविक और कारणवाचक अर्थ के निकट है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह मूल की पारिवारिक और वाचागत अभिव्यक्ति को बनाए रखता है; अधिक सहज सामूहिक विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: वाचा में प्रतिज्ञात भूभाग के लिए ‘देश’ आधुनिक हिन्दी में स्वाभाविक है; संकेतवाचक ‘उस’ निश्चित पदबंध को व्यक्त करता है।
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם
  choice: जिसे उन्हें देने की शपथ मैंने खाई थी
  rationale: इब्रानी में ‘देने’ का भाव प्रसंग से निहित है। हिन्दी में केवल ‘जिसकी शपथ उनसे खाई’ अस्वाभाविक और अस्पष्ट होता; यह रूप निहित आशय को स्पष्ट करते हुए शपथ की प्रतिज्ञा को बनाए रखता है।
- source_word: וְאָנֹכִי אֶהְיֶה עִמָּךְ
  choice: और मैं तुम्हारे साथ रहूँगा
  rationale: यह पहचाना जाने वाला दिव्य प्रतिज्ञा-वाक्य है। स्वतंत्र सर्वनाम אָנֹכִי का बल हिन्दी के स्पष्ट ‘मैं’ से पर्याप्त रूप में संप्रेषित होता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मुख्य पाठ मूल की पुरुषवाचक पारिवारिक अभिव्यक्ति और उसके वाचागत रंग को सुरक्षित रखता है, जबकि सामूहिक अर्थ के सहज विकल्प पादटिप्पणी में स्पष्ट किए गए हैं।
- issue: וַיְצַו और וַיֹּאמֶר का निहित कर्ता
  choice: उसने ... आज्ञा दी और कहा
  alternative: यहोवा ने ... आज्ञा दी और कहा
  rationale: इस पद में कर्ता तृतीय पुरुष एकवचन के रूप में निहित है और निकटवर्ती प्रसंग से पहचाना जाता है। ‘यहोवा’ को स्पष्ट रूप से जोड़ने के बजाय सर्वनाम रखना मूल की कथात्मक संरचना और उसकी निहितता को सुरक्षित रखता है।
- issue: शपथ-वाक्य में निहित ‘देना’
  choice: जिसे उन्हें देने की शपथ मैंने खाई थी
  alternative: जिस देश के विषय में मैंने उनसे शपथ खाई थी
  rationale: मूल इब्रानी में ‘देना’ व्यक्त नहीं है, किंतु प्रतिज्ञा के प्रसंग और לָהֶם से यह अर्थ निहित है। मुख्य पाठ ने समझने योग्य हिन्दी के लिए इसे स्पष्ट किया है, बिना प्रतिज्ञात देश की पहचान या शपथ के आशय को बदलने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दृढ़ और साहसी बनो’ आदेशात्मक प्रोत्साहन की गंभीरता बनाए रखता है। वाक्य की आरंभिक पुनरुक्त संयोजक संरचना (‘आज्ञा दी और कहा’) मूल कथन-शैली के निकट रखी गई है।
