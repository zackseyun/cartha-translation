  yaml_path: translation/ot/deuteronomy/031/011.yaml
  text: when all Israel comes to appear before Yahweh your God at the place that he will choose[a], you shall read this law before all Israel in their hearing.
translation:
  language: hi
  text: जब समस्त इस्राएल उस स्थान पर, जिसे वह चुनेगा, तुम्हारे परमेश्वर याहवे के सामने उपस्थित होने के लिए आए[a], तब तुम इस व्यवस्था को समस्त इस्राएल के सामने उनके सुनते हुए पढ़ना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘तुम्हारे परमेश्वर याहवे का मुख देखने’; यह उसकी उपस्थिति में हाज़िर होने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא כָל יִשְׂרָאֵל
  choice: जब समस्त इस्राएल ... आए
  rationale: בְּ के साथ infinitive construct यहाँ समयवाचक उपवाक्य बनाता है। ‘जब ... आए’ आधुनिक हिन्दी में स्वाभाविक है और सामूहिक ‘समस्त इस्राएल’ को बनाए रखता है।
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: के सामने उपस्थित होने
  rationale: शाब्दिक अर्थ ‘मुख देखने’ का है, पर तीर्थ और उपासना के संदर्भ में यह परमेश्वर की उपस्थिति में हाज़िर होने का मुहावरा है। मुख्य पाठ में अर्थ स्पष्ट किया गया और शाब्दिक रूप पाद-टिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को बनाए रखा गया है; मूसा वाचा-समुदाय इस्राएल को सामूहिक एकवचन में संबोधित करता है।
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: उस स्थान पर, जिसे वह चुनेगा
  rationale: यह व्यवस्थाविवरण में परमेश्वर द्वारा चुने जाने वाले उपासना-स्थान की धारणा और क्रिया के भविष्यगत बल को सुरक्षित रखता है।
- source_word: תִּקְרָא
  choice: पढ़ना
  rationale: व्यवस्था को विषय बनाकर קרא यहाँ सार्वजनिक रूप से ऊँचे स्वर में पढ़ने को सूचित करता है; ‘उन्हें सुनाकर’ श्रव्य सार्वजनिक पाठ को स्पष्ट करता है।
- source_word: הַתּוֹרָה הַזֹּאת
  choice: यह व्यवस्था
  rationale: इस प्रसंग में תּוֹרָה वाचा-संबंधी विधि/शिक्षा के लिखित निकाय की ओर संकेत करती है। ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में परिचित और प्रसंगानुकूल है।
- source_word: נֶגֶד כָּל־יִשְׂרָאֵל
  choice: समस्त इस्राएल के सामने
  rationale: यह एकत्रित समुदाय की उपस्थिति में सार्वजनिक प्रस्तुति को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּאָזְנֵיהֶם
  choice: उन्हें सुनाकर
  rationale: शाब्दिक ‘उनके कानों में’ हिन्दी में अस्वाभाविक होता; यह रूप पाठ के श्रव्य होने का आशय स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मुख्य पाठ में उपाधि ‘प्रभु’ रखने के बजाय व्यक्तिगत वाचा-नाम को संरक्षित किया गया। आधुनिक हिन्दी पाठकों में परिचित लिप्यंतरण ‘यहोवा’ चुना गया; ‘याहवे’ मूल उच्चारण का एक प्रचलित वैकल्पिक पुनर्निर्माण है।
- issue: לֵרָאוֹת אֶת־פְּנֵי का आशय
  choice: के सामने उपस्थित होने
  alternative: का मुख देखने
  rationale: उपासना-यात्रा के संदर्भ में वाक्यांश परमेश्वर की उपस्थिति में हाज़िर होने का मुहावरा है। मुख्य पाठ भ्रामक दृश्यार्थ से बचता है, जबकि शाब्दिक संरचना पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘समस्त इस्राएल’, ‘व्यवस्था’ और ‘उपस्थित होने’ जैसे रूप मूल की औपचारिकता रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
