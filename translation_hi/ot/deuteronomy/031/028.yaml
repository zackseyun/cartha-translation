base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/028.yaml
  text: Gather to me all the elders of your tribes and your officers[a], that I may speak these words in their hearing and call heaven and earth to witness against them.
translation:
  language: hi
  text: “तुम्हारे गोत्रों के सभी बुज़ुर्गों और तुम्हारे अधिकारियों को मेरे पास इकट्ठा करो, ताकि मैं उनके सुनने में ये वचन कहूँ और आकाश और पृथ्वी[क] को उनके विरुद्ध साक्षी ठहराऊँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “स्वर्ग और पृथ्वी।” इब्रानी अभिव्यक्ति व्यवस्थाविवरण में वाचा के साक्षियों का एक प्रचलित सूत्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהִילוּ
  choice: इकट्ठा करो
  rationale: हिफ़िल बहुवचन आज्ञार्थक का प्रेरणार्थक भाव है—सम्बोधित लोगों को अगुओं को एकत्र करने का आदेश दिया गया है। यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: पूर्वसर्ग और प्रथम पुरुष प्रत्यय का सीधा अर्थ ‘मेरे पास’ है; यह ‘मेरे सामने’ की अपेक्षा मूल शब्दावली के अधिक निकट है।
- source_word: זִקְנֵי שִׁבְטֵיכֶם
  choice: अपने गोत्रों के सभी पुरनियों
  rationale: सम्बन्धवाची रचना गोत्रों से जुड़े वरिष्ठ अगुओं को दर्शाती है। ‘पुरनिये’ बाइबलीय पद की गरिमा और नेतृत्वगत अर्थ को बनाए रखता है।
- source_word: שֹׁטְרֵיכֶם
  choice: अपने अधिकारियों
  rationale: व्यवस्थाविवरण के प्रशासनिक सन्दर्भ में यह अधीनस्थ पदाधिकारियों या अगुओं का व्यापक पद है; ‘लेखक’ अनावश्यक रूप से संकीर्ण होगा।
- source_word: וַאֲדַבְּרָה
  choice: ताकि मैं ... कहूँ
  rationale: कोहोर्टेटिव रूप सभा बुलाने के बाद मूसा के अभिप्रेत कार्य को व्यक्त करता है; ‘ताकि’ उद्देश्य-सम्बन्ध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: בְּאָזְנֵיהֶם
  choice: उनके सुनते हुए
  rationale: शाब्दिक ‘उनके कानों में’ का आशय उनकी श्रवण-उपस्थिति में बोलना है; चुना हुआ रूप हिन्दी में सहज है।
- source_word: אֵת הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें
  rationale: דְּבָרִים यहाँ बोले जाने वाले कथनों को सूचित करता है। हिन्दी में ‘ये बातें कहूँ’ स्वाभाविक है और भाषण-सन्दर्भ बनाए रखता है।
- source_word: וְאָעִידָה בָּם
  choice: उनके विरुद्ध ... को साक्षी ठहराऊँ
  rationale: हिफ़िल रूप और בָּם मिलकर वाचा-संबंधी न्यायिक साक्ष्य का भाव देते हैं; यह अनुवाद उस कानूनी और गंभीर अर्थ को बनाए रखता है।
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: यह व्यवस्थाविवरण का प्रचलित वाचा-साक्षी सूत्र है। ‘आकाश और पृथ्वी’ आधुनिक हिन्दी में स्वाभाविक और गंभीर है।
theological_decisions:
- issue: वाचा-संबंधी साक्षी सूत्र
  choice: उनके विरुद्ध आकाश और पृथ्वी को साक्षी ठहराऊँ
  alternative: आकाश और पृथ्वी को उनके विरुद्ध साक्षी बनाऊँ
  rationale: चुना हुआ पाठ आकाश और पृथ्वी को इस्राएल की जवाबदेही के ब्रह्मांडीय साक्षी के रूप में प्रस्तुत करता है और मूल की न्यायिक-वाचागत छवि को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक घोषणा के अनुकूल शैली। ‘पुरनियों’ से पारंपरिक बाइबलीय नेतृत्व-पद बना रहता है, जबकि शेष वाक्य-विन्यास साधारण पाठक के लिए स्पष्ट और स्वाभाविक है।
