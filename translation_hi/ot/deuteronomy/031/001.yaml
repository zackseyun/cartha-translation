base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/001.yaml
  text: Then Moses went and spoke these words to all Israel[a].
translation:
  language: hi
  text: तब मूसा गया और उसने ये बातें सारे इस्राएल से कहीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मूसा गया और उसने ये बातें सारे इस्राएल से कहीं।” आरंभिक संयोजक का अधिक शब्दानुरूप अनुवाद “और” किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: הלך का सामान्य कथात्मक अर्थ ‘जाना’ है। गंतव्य न बताए जाने पर भी मूल क्रिया का सीधा अर्थ बनाए रखा गया है; ‘आगे बढ़ा’ जैसी व्याख्यात्मक अभिव्यक्ति नहीं अपनाई गई।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और सहज नामरूप।
- source_word: וַיְדַבֵּר
  choice: कहीं
  rationale: पिएल דבר यहाँ बोलने को व्यक्त करता है। हिन्दी में ‘बातें ... कहीं’ स्वाभाविक है और את הדברים के साथ क्रिया-संबंध स्पष्ट रखता है।
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें
  rationale: דברים का प्रसंगानुकूल स्वाभाविक हिन्दी रूप ‘बातें’ है। यह आगे कही जाने वाली विशिष्ट वाणी की ओर संकेत बनाए रखता है; ‘संदेश’ अनावश्यक रूप से अर्थ को संकुचित करता।
- source_word: אֶל
  choice: से
  rationale: कहने/बोलने के श्रोता को आधुनिक हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया जाता है, यद्यपि इब्रानी संबंधवाचक शब्द का मूल भाव ‘की ओर/को’ है।
- source_word: כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल
  rationale: राष्ट्रीय समुदाय के सामूहिक अर्थ को बनाए रखने के लिए ‘इस्राएलियों’ के बजाय ‘इस्राएल’ रखा गया है। ‘सारे’ आधुनिक हिन्दी में כָּל का सहज रूप है।
- source_word: וַ
  choice: तब
  rationale: आरंभिक waw कथानक को आगे बढ़ाता है। ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक ढंग से व्यक्त करता है; अधिक रूपात्मक विकल्प ‘और’ है।
