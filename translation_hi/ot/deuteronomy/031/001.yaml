  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘ये बातें ... कहीं’ हिन्दी की स्वाभाविक पदावली है, जबकि ‘सारे इस्राएल’ मूल के सामूहिक राष्ट्रीय बोध को सुरक्षित रखता है।
