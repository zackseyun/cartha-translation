  text: כִּ֣י יָדַ֗עְתִּי אַחֲרֵ֤י מוֹתִ/י֙ כִּֽי הַשְׁחֵ֣ת תַּשְׁחִת֔וּ/ן וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְ/כֶ֑ם וְ/קָרָ֨את אֶתְ/כֶ֤ם הָֽ/רָעָה֙ בְּ/אַחֲרִ֣ית הַ/יָּמִ֔ים כִּֽי תַעֲשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה לְ/הַכְעִיס֖/וֹ בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/029.yaml
  text: For I know that after my death you will surely act corruptly and turn aside from the way that I commanded you[a], and evil will befall you in the latter days, because you will do what is evil in the eyes of Yahweh[c][b], provoking him to anger by the work of your hands.
translation:
  language: hi
  text: क्योंकि मैं जानता हूँ कि मेरी मृत्यु के बाद तुम निश्चय ही भ्रष्ट आचरण करोगे[a] और उस मार्ग से हट जाओगे जिस पर चलने की आज्ञा मैंने तुम्हें दी है। आने वाले दिनों में[c] विपत्ति[b] तुम पर आ पड़ेगी, क्योंकि तुम वह करोगे जो यहोवा की दृष्टि में बुरा है और अपने हाथों के कामों से उसे क्रोध दिलाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “तुम निश्चय ही अपने आपको भ्रष्ट कर लोगे” या “तुम पूरी तरह भ्रष्ट हो जाओगे” भी हो सकता है। इब्रानी में ‘भ्रष्ट करना’ क्रिया को दोहराकर बल दिया गया है और यहाँ उसका अर्थ आत्मवाचक या अकर्मक हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ यहाँ “बुराई,” “विनाश” या “संकट” भी हो सकता है; यह नैतिक बुराई के साथ-साथ हानिकारक विपत्ति को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “दिनों के अन्त में”; इसका अर्थ “बाद के दिनों में” या “अन्तिम दिनों में” भी हो सकता है। यह भविष्य की ओर संकेत करता है, पर प्रसंग के अनुसार इसका अंत-कालीन भार अलग हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָדַעְתִּי
  choice: क्योंकि मैं जानता हूँ
  rationale: כִּי पिछले कथन का कारण प्रस्तुत करता है और יָדַעְתִּי मूसा के दृढ़ ज्ञान को व्यक्त करता है।
- source_word: אַחֲרֵי מוֹתִי
  choice: मेरी मृत्यु के बाद
  rationale: इब्रानी संज्ञात्मक रचना को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: הַשְׁחֵת תַּשְׁחִתוּן
  choice: तुम निश्चय ही भ्रष्ट आचरण करोगे
  rationale: क्रिया के साथ infinitive absolute की पुनरुक्ति तीव्रता और निश्चितता व्यक्त करती है; कर्म के अभाव में ‘भ्रष्ट आचरण’ नैतिक अर्थ को बिना अनावश्यक रूप से सकर्मक बनाए व्यक्त करता है।
- source_word: וְסַרְתֶּם מִן־הַדֶּרֶךְ
  choice: और उस मार्ग से हट जाओगे
  rationale: वाचा-संबंधी रूपक में आज्ञापित जीवन-पद्धति से विचलन का निकट और स्वाभाविक अनुवाद।
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: जिस पर चलने की आज्ञा मैंने तुम्हें दी है
  rationale: ‘मार्ग’ के हिन्दी मुहावरे को स्पष्ट करता है; ‘चलने’ का भाव प्रसंग में निहित है, जबकि आज्ञा देनेवाला मूसा ही बना रहता है।
- source_word: וְקָרָאת אֶתְכֶם הָרָעָה
  choice: विपत्ति तुम पर आ पड़ेगी
  rationale: קרא + רעה की रचना किसी हानिकारक घटना के किसी पर घटने को दर्शाती है; ‘विपत्ति’ यहाँ हिन्दी में ‘बुराई’ से अधिक स्वाभाविक है।
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: आनेवाले दिनों में
  rationale: वाक्यांश के भविष्याभिमुख अर्थ को व्यक्त करता है, पर किसी संकीर्ण अंत-कालीन व्याख्या को आरोपित नहीं करता।
- source_word: כִּי תַעֲשׂוּ אֶת־הָרַע
  choice: क्योंकि तुम वह करोगे जो ... बुरा है
  rationale: नैतिक मूल्यांकन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: इब्रानी मुहावरे का अर्थ है यहोवा के मूल्यांकन के अनुसार; हिन्दी में ‘दृष्टि में’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्राम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि से।
- source_word: לְהַכְעִיסוֹ
  choice: उसे क्रोध दिलाओगे
  rationale: हिफ़ील रूप के कारक अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: अपने हाथों के बनाए हुए कामों से
  rationale: मूल के ठोस रूपक को बनाए रखता है और प्रसंग में मानव-निर्मित कृतियों की ओर संकेत को खुला छोड़ता है।
theological_decisions:
- issue: הַשְׁחֵת תַּשְׁחִתוּן का वाच्य और नैतिक आशय
  choice: भ्रष्ट आचरण करोगे
  alternative: अपने आपको भ्रष्ट कर लोगे / पूरी तरह भ्रष्ट हो जाओगे
  rationale: इब्रानी हिफ़ील यहाँ आत्मवाचक या अकर्मक रूप में समझा जा सकता है। मुख्य पाठ नैतिक भ्रष्ट आचरण और तीव्रता को रखता है, जबकि पादटिप्पणी वास्तविक व्याकरणिक विकल्प बताती है।
- issue: בְּאַחֲרִית הַיָּמִים का कालगत आशय
  choice: आनेवाले दिनों में
  alternative: अन्तिम दिनों में
  rationale: वाक्यांश भविष्याभिमुख है और कभी अंत-कालीन भार रख सकता है; इस प्रसंग में व्यापक अर्थ को मुख्य पाठ में रखा गया है और अधिक विशिष्ट विकल्प पादटिप्पणी में।
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी बाइबल-पाठकों में व्यापक रूप से पहचाना जाता है; ‘याहवे’ अधिक प्रत्यक्ष लिप्यंतरण का विकल्प है।
- issue: מַעֲשֵׂה יְדֵיכֶם की पहचान
  choice: अपने हाथों के बनाए हुए कामों से
  alternative: अपनी करतूतों से / अपनी बनाई हुई मूर्तियों से
  rationale: मूल अभिव्यक्ति जानबूझकर व्यापक है। उसे केवल मूर्तियों या सामान्य कर्मों तक सीमित करने के बजाय ठोस रूपक और संभावित मूर्तिपूजक संकेत दोनों सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए सुबोध रूप। ‘मार्ग से हटना,’ ‘दृष्टि में बुरा’ और ‘हाथों के बनाए हुए काम’ जैसे मूल बिंब सुरक्षित रखे गए हैं। मुख्य पाठ में तीनों पादटिप्पणी-चिह्न [a], [b], [c] उपस्थित हैं।
