base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/010.yaml
  text: And Moses commanded them[a], saying, “At the end of every seven years, at the appointed time of the year of release[c][b], at the Feast of Booths,”
translation:
  language: hi
  text: 'मूसा ने उन्हें आज्ञा देकर कहा: “हर सात वर्ष के अंत में[a], ऋण-मुक्ति के वर्ष के नियत समय पर, झोंपड़ियों का पर्व[c] में,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “सात वर्षों के अंत में।” प्रसंग बताता है कि यह सात-सात वर्ष बाद दोहराया जाने वाला चक्र है।'
    reason: lexical_alternative
  - marker: c
    text: इस पर्व को “सुक्कोत” या परम्परागत रूप से “मण्डपों का पर्व” भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: यह आज्ञा दी
  rationale: צוה में आदेश देने का स्पष्ट भाव है; यह हिन्दी में स्वाभाविक रहते हुए उसके निर्देशात्मक बल को बनाए रखता है।
- source_word: אוֹתָם
  choice: उन्हें
  rationale: यह पुल्लिंग बहुवचन कर्मवाचक सर्वनाम है, जिसका सन्दर्भ आस-पास के पदों से मिलता है।
- source_word: לֵאמֹר
  choice: 'यह ... दी:'
  rationale: प्रत्यक्ष कथन आरम्भ कराने वाले इब्रानी प्रयोग को हिन्दी में स्वाभाविक रूप से कथनसूचक द्विबिन्दु द्वारा व्यक्त किया गया है।
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: हर सात वर्ष के अन्त में
  rationale: מִקֵּץ का अर्थ ‘अन्त में’ है; विधिक पंचांग के प्रसंग में ‘हर’ सात-वर्षीय चक्र की पुनरावृत्ति स्पष्ट करता है, जबकि अधिक शब्दशः विकल्प पादटिप्पणी में रखा गया है।
- source_word: בְּמוֹעֵד
  choice: नियत समय पर
  rationale: מוֹעֵד किसी ठहराए हुए समय या अवसर को दर्शाता है; ‘नियत समय’ सटीक और सहज है।
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: ऋण-मुक्ति का वर्ष
  rationale: שְׁמִטָּה सातवें वर्ष में देनदारियों को छोड़ देने की व्यवस्था को दर्शाता है। व्यवस्थाविवरण के प्रसंग में ‘ऋण-मुक्ति’ अर्थ को सामान्य पाठक के लिए स्पष्ट करता है, और पारम्परिक नाम पादटिप्पणी में दिया गया है।
- source_word: בְּחַג הַסֻּכּוֹת
  choice: झोंपड़ियों के पर्व में
  rationale: חַג ‘पर्व’ और סֻכּוֹת अस्थायी ‘झोंपड़ियों’ को दर्शाता है; यह अनुवाद इब्रानी बिम्ब को स्पष्ट बनाए रखता है।
