source:
  edition: WLC
  text: וְ/אָנֹכִ֗י הַסְתֵּ֨ר אַסְתִּ֤יר פָּנַ/י֙ בַּ/יּ֣וֹם הַ/ה֔וּא עַ֥ל כָּל הָ/רָעָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה כִּ֣י פָנָ֔ה אֶל אֱלֹהִ֖ים אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/018.yaml
  text: And I myself will surely hide my face on that day because of all the evil that he has done[a], because he has turned to other gods.
translation:
  language: hi
  text: और मैं स्वयं उस दिन अपना मुख[a] अवश्य छिपा लूँगा, उस सारी बुराई के कारण जो उसने की है, क्योंकि वह दूसरे देवताओं की ओर मुड़ गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी उपस्थिति”; इब्रानी में शाब्दिक रूप से “मेरा मुख” है। यह मुहावरा ईश्वरीय अनुग्रह या उपस्थिति के हट जाने का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: और मैं स्वयं
  rationale: אָנֹכִי का स्पष्ट कर्तृवाचक बल ‘मैं स्वयं’ से सुरक्षित रहता है; וְ को प्रसंगानुसार संयोजक ‘और’ रखा गया है।
- source_word: הַסְתֵּר אַסְתִּיר
  choice: अवश्य छिपा लूँगा
  rationale: धातु के infinitive absolute और उसी धातु के finite verb का मेल क्रिया पर बल देता है; ‘अवश्य’ आधुनिक हिन्दी में इस निश्चयात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פָּנַי
  choice: अपना मुख
  rationale: शाब्दिक अर्थ ‘मेरा मुख’ है। हिन्दी में कर्ता ‘मैं’ के साथ ‘अपना मुख’ अधिक स्वाभाविक है और ईश्वरीय अनुग्रह या उपस्थिति के हटने की व्याख्या मुख्य पाठ में आरोपित नहीं करता।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह कालवाचक पद और संकेतवाचक बल दोनों को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל כָּל הָרָעָה
  choice: उस सारी बुराई के कारण
  rationale: עַל यहाँ कारण या आधार बताता है; הָרָעָה प्रसंग में नैतिक बुराई को सूचित करता है, केवल विपत्ति को नहीं।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो उसने की है
  rationale: क्रिया पुल्लिंग एकवचन है। इस्राएल को सामूहिक रूप से एक व्यक्ति मानकर किए गए उल्लेख को बहुवचन में समतल किए बिना सुरक्षित रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अगले कथन को कारण के रूप में प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में संबंध को स्पष्ट रखता है।
- source_word: פָנָה אֶל
  choice: की ओर मुड़ गया है
  rationale: यह दिशा बदलने के साथ निष्ठा या भक्ति में मुड़ने का भाव भी रखता है; अनुवाद उस भाव को बनाए रखता है, पर अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह यहोवा के अतिरिक्त अन्य देवताओं के लिए प्रयुक्त सीधा पद है; ‘दूसरे देवता’ मूल के सबसे निकट और सामान्य हिन्दी है।
theological_decisions:
- issue: ईश्वर द्वारा अपना मुख छिपाने का मानवरूपी कथन
  choice: मुख्य पाठ में ‘अपना मुख ... छिपा लूँगा’ बनाए रखना
  alternative: ‘अपनी उपस्थिति हटा लूँगा’ या ‘उससे विमुख हो जाऊँगा’
  rationale: इब्रानी का ठोस रूपक ईश्वरीय अनुग्रह या उपस्थिति के हटने का संकेत दे सकता है, पर मुख्य पाठ में उसे किसी एक व्याख्या में सीमित नहीं किया गया है।
- issue: इस्राएल के लिए एकवचन संदर्भ
  choice: ‘उसने ... वह’ के द्वारा एकवचन बनाए रखना
  alternative: ‘उन्होंने ... वे’ के द्वारा सामूहिक बहुवचन
  rationale: मूल की दोनों क्रियाएँ पुल्लिंग एकवचन हैं और इस्राएल को एक सामूहिक व्यक्ति के रूप में प्रस्तुत करती हैं; हिन्दी में भी इसे सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर वचन की गंभीरता बनाए रखने के लिए ‘मुख’ चुना गया है। ‘अवश्य’ मूल की बलाघाती रचना को सहज ढंग से व्यक्त करता है। एकवचन सामूहिक संदर्भ जानबूझकर सुरक्षित रखा गया है।
