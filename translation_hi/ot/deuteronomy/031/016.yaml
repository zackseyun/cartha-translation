base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/016.yaml
  text: And Yahweh said to Moses[a], “Behold, you are about to lie down with your fathers. Then this people will rise up and prostitute themselves after the foreign gods of the land into whose midst they are entering[b]. They will forsake me and break my covenant that I made with them.”
translation:
  language: hi
  text: याहवे ने मूसा से कहा, “देख, तू अपने पुरखाओं के साथ सोने जा रहा है। तब ये लोग उठ खड़े होंगे और उस देश के पराए देवताओं के पीछे वेश्यावृत्ति करेंगे[a], जिस देश के बीच वे प्रवेश करने जा रहे हैं[b]। वे मुझे त्याग देंगे और मेरी उस वाचा को तोड़ देंगे, जो मैंने उनके साथ बाँधी थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक भाव है, “पराए देवताओं के पीछे वेश्या का काम करेंगे।” यहाँ यौन बेवफाई को मूर्तिपूजा के द्वारा वाचा से विश्वासघात के रूपक के रूप में प्रयोग किया गया है।
    reason: lexical_alternative
  - marker: b
    text: इस वाक्यांश और “उनके साथ” के लिए इब्रानी में एकवचन रूप हैं; वहाँ इस्राएल की प्रजा के लिए सामूहिक एकवचन का प्रयोग हुआ है। हिन्दी में अर्थ स्पष्ट करने के लिए बहुवचन रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: הִנְּךָ שֹׁכֵב עִם אֲבֹתֶיךָ
  choice: देख, अब तू अपने पुरखाओं के साथ सो जानेवाला है
  rationale: मृत्यु के लिए प्रयुक्त इब्रानी मुहावरे और उसकी निकटता, दोनों को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: וְקָם
  choice: तब ये लोग उठेंगे
  rationale: क्रिया का भावी क्रम सुरक्षित है; इसे विद्रोह के अर्थ में अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: וְזָנָה אַחֲרֵי
  choice: पीछे वेश्या की तरह चलेंगे
  rationale: मूर्तिपूजा के लिए प्रयुक्त तीखे यौन और वाचागत रूपक को स्पष्ट किन्तु सुबोध हिन्दी में बनाए रखा गया है।
- source_word: אֱלֹהֵי נֵכַר הָאָרֶץ
  choice: उस देश के पराए देवताओं
  rationale: נֵכַר की पराएपन की धारणा और देवताओं का उस देश से संबंध, दोनों व्यक्त होते हैं।
- source_word: אֲשֶׁר הוּא בָא שָׁמָּה בְּקִרְבּוֹ
  choice: जिस देश के बीच वे प्रवेश करने जा रहे हैं
  rationale: इब्रानी के सामूहिक एकवचन को हिन्दी में स्पष्ट बहुवचन से व्यक्त करते हुए देश के बीच प्रवेश करने का भाव सुरक्षित रखा गया है।
- source_word: וַעֲזָבַנִי
  choice: वे मुझे त्याग देंगे
  rationale: वाचा-संबंधी गंभीरता को सहज और वजनदार हिन्दी में व्यक्त करता है।
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  choice: मेरी उस वाचा को तोड़ देंगे
  rationale: वाचा का उल्लंघन करने के अर्थ को हिन्दी के स्वाभाविक मुहावरे में रखा गया है।
- source_word: אֲשֶׁר כָּרַתִּי אִתּוֹ
  choice: जो मैंने उनके साथ बाँधी थी
  rationale: כרת ברית के अर्थ को हिन्दी के प्रचलित ‘वाचा बाँधना’ से व्यक्त किया गया और सामूहिक एकवचन का संदर्भ बहुवचन में स्पष्ट किया गया।
theological_decisions:
- issue: मूर्तिपूजा के लिए यौन रूपक
  choice: वेश्या की तरह चलेंगे
  alternative: विश्वासघात करेंगे; आध्यात्मिक व्यभिचार करेंगे
  rationale: मूल पाठ की जानबूझकर तीखी वाचागत बेवफाई की छवि को सामान्य ‘विश्वासघात’ में हल्का नहीं किया गया और ‘आध्यात्मिक’ जैसा व्याख्यात्मक शब्द नहीं जोड़ा गया।
- issue: इस्राएल के लिए सामूहिक एकवचन
  choice: आधुनिक हिन्दी में बहुवचन—‘वे’, ‘उनके’
  alternative: मूल के रूप के अनुसार एकवचन—‘वह’, ‘उसके’
  rationale: संदर्भ वही सामूहिक प्रजा है; बहुवचन हिन्दी में भ्रम टालता है और मूल का आशय नहीं बदलता।
- issue: मृत्यु का पितरों के साथ सोना
  choice: मुहावरे को बनाए रखा गया
  alternative: तू मरनेवाला है
  rationale: मूल की मृत्यु-संबंधी छवि को व्याख्यात्मक रूप से सपाट करने के बजाय संरक्षित किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरपूर्ण और सामान्य पाठक के लिए सुबोध। मूसा को संबोधन में मूल के एकवचन के अनुरूप ‘तू’ रखा गया है; ‘पुरखाओं के साथ सो जाना’, ‘वाचा बाँधना’ और वेश्यावृत्ति का रूपक मूल की गंभीरता तथा बिंब को सुरक्षित रखते हैं।
