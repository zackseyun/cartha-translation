source:
  edition: WLC
  text: וַ/יֵּרָ֧א יְהוָ֛ה בָּ/אֹ֖הֶל בְּ/עַמּ֣וּד עָנָ֑ן וַ/יַּעֲמֹ֛ד עַמּ֥וּד הֶ/עָנָ֖ן עַל פֶּ֥תַח הָ/אֹֽהֶל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/015.yaml
  text: And Yahweh appeared in the tent in a pillar of cloud[b][a], and the pillar of cloud stood at the entrance of the tent.
translation:
  language: hi
  text: और यहोवा तम्बू में बादल के एक खम्भे में दिखाई दिए, और बादल का खम्भा तम्बू के द्वार पर खड़ा हो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרָא
  choice: दिखाई दिए
  rationale: निफ़अल रूप यहाँ दृश्य प्रकट होने को व्यक्त करता है। ‘दिखाई दिए’ सहज हिन्दी है और प्रकाशन की रीति को अनावश्यक रूप से नहीं समझाता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय सुरक्षित रखता है।
- source_word: בָּאֹהֶל
  choice: तम्बू के भीतर
  rationale: אֹהֶל का सीधा अर्थ ‘तम्बू’ है। प्रसंग में यह मिलापवाले तम्बू को सूचित करता है, पर मूल पद केवल ‘तम्बू’ कहता है; ‘के भीतर’ स्थानगत अर्थ स्पष्ट करता है।
- source_word: בְּעַמּוּד עָנָן
  choice: बादल के एक खम्भे में
  rationale: यह पदबंध यहोवा के दिखाई देने के माध्यम अथवा ढंग को बताता है। अनिश्चित रचना के कारण ‘एक’ उचित है और ‘में’ इब्रानी पूर्वसर्ग को निकटता से रखता है।
- source_word: וַיַּעֲמֹד
  choice: खड़ा हो गया
  rationale: עמד का यहाँ ठोस और स्वाभाविक अर्थ ‘खड़ा होना’ है।
- source_word: עַמּוּד הֶעָנָן
  choice: बादल का खम्भा
  rationale: यह पहले उल्लिखित दृश्य बादल-स्तम्भ को निश्चित रूप में दोहराता है।
- source_word: עַל פֶּתַח הָאֹהֶל
  choice: तम्बू के द्वार पर
  rationale: द्वार जैसे स्थानगत संज्ञा के साथ עַל यहाँ ‘पर/के पास’ की स्थिति बताता है। ‘द्वार पर’ स्वाभाविक हिन्दी है और ‘ऊपर’ की अपेक्षा दृश्य के अनुकूल है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में परिचित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- issue: ईश्वरीय प्रकटन का वर्णन
  choice: बादल के एक खम्भे में तम्बू के भीतर दिखाई दिए
  alternative: तम्बू के पास बादल के खम्भे के रूप में दिखाई दिए
  rationale: चुना हुआ पाठ दृश्य और स्थानबद्ध प्रकटन तथा बादल के खम्भे की रहस्यमय छवि को बनाए रखता है; वह यह नहीं ठहराता कि यहोवा स्वयं खम्भा थे।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रजिस्टर। ‘खम्भा’ और ‘तम्बू’ सामान्य पाठक के लिए परिचित रूप हैं। किसी व्याख्यात्मक पूँजीकरण या ‘मिलापवाला तम्बू’ जैसी प्रसंगगत पूर्ति को मुख्य पाठ में नहीं जोड़ा गया।
