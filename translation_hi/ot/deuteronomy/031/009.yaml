  text: וַ/יִּכְתֹּ֣ב מֹשֶׁה֮ אֶת הַ/תּוֹרָ֣ה הַ/זֹּאת֒ וַֽ/יִּתְּנָ֗/הּ אֶל הַ/כֹּהֲנִים֙ בְּנֵ֣י לֵוִ֔י הַ/נֹּ֣שְׂאִ֔ים אֶת אֲר֖וֹן בְּרִ֣ית יְהוָ֑ה וְ/אֶל כָּל זִקְנֵ֖י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/009.yaml
  text: So Moses wrote this law and gave it to the priests[a], the sons of Levi, who carry the ark of the covenant of Yahweh[c][b], and to all the elders of Israel.
translation:
  language: hi
  text: मूसा ने इस व्यवस्था[a] को लिखकर उसे याजकों—लेवी के पुत्रों[b], जो याहवे[c] की वाचा का संदूक उठाने वाले थे—और इस्राएल के सभी प्राचीनों को दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस शिक्षा,” “इस निर्देश” अथवा “इस तोराह”।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “लेवी के पुत्रों”; इसे “लेवीवंशी” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी: YHWH; परंपरागत रूप से “यहोवा” या “प्रभु” अनूदित।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: लिखकर
  rationale: כתב का सीधा अर्थ ‘लिखना’ है। संयुक्त क्रिया-विन्यास ‘लिखकर ... दे दिया’ इब्रानी कथाक्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַתּוֹרָה הַזֹּאת
  choice: इस व्यवस्था
  rationale: תּוֹרָה का अर्थ ‘व्यवस्था’ या ‘शिक्षा/निर्देश’ हो सकता है। व्यवस्थाविवरण के इस वाचागत संदर्भ में ‘व्यवस्था’ स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיִּתְּנָהּ
  choice: उसे ... दे दिया
  rationale: स्त्रीलिंग प्रत्यय का संकेत הַתּוֹרָה की ओर है। ‘उसे दे दिया’ सरल और सटीक हिन्दी है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: כֹּהֲנִים के लिए ‘याजक’ प्रचलित और अर्थ-सटीक बाइबलीय हिन्दी शब्द है।
- source_word: בְּנֵי לֵוִי
  choice: लेवी के पुत्रों
  rationale: यह इब्रानी पद का पारदर्शी रूप है और याजकों के साथ उसके समानाधिकरण संबंध को बनाए रखता है। ‘लेवीवंशी’ अधिक संक्षिप्त विकल्प है।
- source_word: הַנֹּשְׂאִים
  choice: जो ... संदूक उठाते थे
  rationale: נשׂא का अर्थ यहाँ संदूक को उठाना/ले जाना है। संबंधवाचक उपवाक्य कृदंत के वर्णनात्मक भाव को सहज हिन्दी में रखता है।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: याहवे की वाचा का संदूक
  rationale: 'यह रचना इब्रानी संबंध-श्रृंखला को स्पष्ट हिन्दी में व्यक्त करती है: संदूक, जो याहवे की वाचा से संबद्ध है।'
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम YHWH को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी पुरनियों
  rationale: ‘पुरनिये’ इस्राएल के मान्य वरिष्ठ अगुओं के लिए स्थापित हिन्दी बाइबलीय पद है; ‘सभी’ כָּל की व्यापकता व्यक्त करता है।
theological_decisions:
- issue: इस संदर्भ में תּוֹרָה का अर्थ-क्षेत्र
  choice: व्यवस्था
  alternative: शिक्षा; निर्देश; तोराह
  rationale: यहाँ मूसा द्वारा लिखकर सौंपे गए वाचागत विधान का उल्लेख है। ‘व्यवस्था’ इस संदर्भ के कानूनी-वाचागत पक्ष को व्यक्त करती है, पर मूल शब्द का शिक्षात्मक अर्थ पादटिप्पणी में खुला रखा गया है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है; पारंपरिक विकल्प पादटिप्पणी में दिए गए हैं।
- issue: בְּנֵי לֵוִי और याजकों का संबंध
  choice: याजकों—लेवी के पुत्रों
  alternative: लेवीवंशी याजकों
  rationale: समानाधिकरणीय रचना को बनाए रखने से पाठ इन याजकों की पहचान ‘लेवी के पुत्रों’ के रूप में करता है, बिना इसे सभी लेवियों के विषय में व्यापक कथन बनाए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है, पर वाचागत और संस्थागत शब्दों के लिए गरिमापूर्ण बाइबलीय पदावली—‘व्यवस्था,’ ‘याजक,’ ‘वाचा,’ ‘पुरनिये’—का प्रयोग किया गया है। वाक्य का मूल समन्वय और समानाधिकरण डैशों द्वारा स्पष्ट किया गया है।
