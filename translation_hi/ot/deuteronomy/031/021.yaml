  text: וְ֠/הָיָה כִּֽי תִמְצֶ֨אןָ אֹת֜/וֹ רָע֣וֹת רַבּוֹת֮ וְ/צָרוֹת֒ וְ֠/עָנְתָה הַ/שִּׁירָ֨ה הַ/זֹּ֤את לְ/פָנָי/ו֙ לְ/עֵ֔ד כִּ֛י לֹ֥א תִשָּׁכַ֖ח מִ/פִּ֣י זַרְע֑/וֹ כִּ֧י יָדַ֣עְתִּי אֶת יִצְר֗/וֹ אֲשֶׁ֨ר ה֤וּא עֹשֶׂה֙ הַ/יּ֔וֹם בְּ/טֶ֣רֶם אֲבִיאֶ֔/נּוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר נִשְׁבָּֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/021.yaml
  text: And when many evils and troubles come upon him[a], this song will answer before him as a witness, for it will not be forgotten from the mouth of his offspring; for I know his inclination, what he is doing today[d][c][b], before I bring him into the land that I swore to give.
translation:
  language: hi
  text: और जब उस पर बहुत-सी विपत्तियाँ और संकट आ पड़ेंगे[a], तब यह गीत उसके सामने[b] साक्षी बनकर उत्तर देगी, क्योंकि यह उसके वंशजों के मुँह से भुलाया नहीं जाएगा। क्योंकि मैं उसकी प्रवृत्ति[c] को जानता हूँ—और यह भी कि वह आज क्या कर रहा है—इससे पहले कि मैं उसे उस देश में ले जाऊँ, जिसके विषय में मैंने शपथ खाई थी[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे आ घेरेंगे” अथवा “उसे आ पकड़ेंगे।”
    reason: lexical_alternative
  - marker: b
    text: “उसके सामने” का अर्थ इस साक्ष्यात्मक संदर्भ में अधिक प्रबल रूप से “उसके विरुद्ध” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी शब्द का अर्थ उसकी भीतरी “प्रवृत्ति,” “मंशा” या “कल्पना” हो सकता है। आगे की इब्रानी रचना को अधिक शाब्दिक रूप में “जिसे/जो वह आज कर रहा है” कहा जा सकता है; उसका संबंध ‘प्रवृत्ति’ और इस्राएल के वर्तमान आचरण, दोनों से समझा गया है।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी में केवल “जिसके विषय में मैंने शपथ खाई थी” है; संदर्भ के अनुसार “जिसे देने की मैंने शपथ खाई थी” भी अनुवाद किया जा सकता है।
    reason: textual_clarity
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और जब
  rationale: यह भावी परिस्थिति की स्वाभाविक काल-सूचक भूमिका है; आधुनिक हिन्दी में सहज है और इब्रानी की अनावश्यक जड़ता से बचती है।
- source_word: תִמְצֶאןָ אֹתוֹ
  choice: उस पर ... आ पड़ेंगे
  rationale: यहाँ विपत्तियों और संकटों के किसी को आ घेरने या उस पर आ पड़ने का भाव है।
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: बहुत-सी विपत्तियाँ और संकट
  rationale: רָעוֹת यहाँ नैतिक बुराइयों से अधिक हानिकारक घटनाओं या विपत्तियों को सूचित करता है; צָרוֹת के लिए 'संकट' स्वाभाविक है।
- source_word: וְעָנְתָה
  choice: उत्तर देगा
  rationale: ענה के मूल 'उत्तर देना' रूपक को सुरक्षित रखता है; अगले पदांश में साक्षी की भूमिका स्पष्ट हो जाती है।
- source_word: לְפָנָיו לְעֵד
  choice: उसके सामने साक्षी बनकर
  rationale: לְפָנָיו का स्थानगत अर्थ 'उसके सामने' सुरक्षित है, जबकि לְעֵד गीत की साक्ष्यात्मक भूमिका बताता है।
- source_word: לֹא תִשָּׁכַח מִפִּי זַרְעוֹ
  choice: यह उसके वंशजों के मुँह से भुलाया नहीं जाएगा
  rationale: इब्रानी के मौखिक स्मरण और पाठ की छवि को बनाए रखते हुए זרע के सामूहिक अर्थ को 'वंशजों' से स्पष्ट किया गया है।
- source_word: יִצְרוֹ
  choice: उसकी ... प्रवृत्ति
  rationale: יֵצֶר व्यक्ति की भीतरी बनावट, झुकाव या अभिप्राय को दर्शा सकता है; 'प्रवृत्ति' नैतिक-इच्छात्मक भार रखती है, पर बाद की किसी विशिष्ट धर्मवैज्ञानिक प्रणाली को आरोपित नहीं करती।
- source_word: אֲשֶׁר הוּא עֹשֶׂה הַיּוֹם
  choice: जो आज ही उसके भीतर काम कर रही है
  rationale: व्याकरणतः संबंधवाचक उपवाक्य का निकटतम पूर्वपद יִצְרוֹ है। शाब्दिक 'जिसे वह आज कर रहा है' कठिन और संदिग्ध हिन्दी होगी; यह रूप भीतरी प्रवृत्ति की वर्तमान सक्रियता व्यक्त करता है, जबकि टिप्पणी में विकल्प सुरक्षित है।
- source_word: אֲשֶׁר נִשְׁבָּעְתִּי
  choice: जिसके विषय में मैंने शपथ खाई थी
  rationale: संरक्षित WLC पाठ में शपथ की प्रतिज्ञा का कर्म स्पष्ट नहीं है। 'जिसके विषय में' देश से संबंध बनाए रखता है और मुख्य पाठ में अनुपस्थित 'देने' को नहीं जोड़ता।
theological_decisions:
- issue: יִצְרוֹ में मानवीय भीतरी झुकाव और परमेश्वर के पूर्वज्ञान का संबंध
  choice: उसकी उस प्रवृत्ति को जानता हूँ जो आज ही उसके भीतर काम कर रही है
  alternative: उसकी मंशा जानता हूँ—जो वह आज कर रहा है
  rationale: मुख्य पाठ भीतरी disposition को व्यक्त करता है, पर इसे किसी बाद की सिद्धान्तगत श्रेणी में नहीं बदलता। यह परमेश्वर के ज्ञान और इस्राएल की वर्तमान नैतिक दशा के बीच मूल पाठ का तनाव बनाए रखता है।
- issue: לְפָנָיו में साक्षी का रुख
  choice: उसके सामने
  alternative: उसके विरुद्ध
  rationale: संदर्भ में साक्ष्य प्रतिकूल हो सकता है, फिर भी לְפָנָיו का प्रत्यक्ष अर्थ 'उसके सामने' है। 'विरुद्ध' को टिप्पणी में संभावित प्रासंगिक अर्थ के रूप में रखा गया है।
- issue: अपूर्ण प्रतिज्ञा-वाक्य אֲשֶׁר נִשְׁבָּעְתִּי
  choice: जिसके विषय में मैंने शपथ खाई थी
  alternative: जिसे देने की मैंने शपथ खाई थी
  rationale: संदर्भ में देश देने की प्रतिज्ञा निहित है, पर WLC के उपलब्ध पाठ में 'देना' नहीं है। मुख्य पाठ स्रोत की अपूर्णता/संक्षिप्तता को सहज हिन्दी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। एकवचन पुल्लिंग सर्वनाम मूल पाठ में सामूहिक इस्राएल को दर्शाते हैं। 'साक्षी बनकर उत्तर देगा' मूल क्रिया की उत्तर देने वाली छवि और गीत की न्यायिक भूमिका दोनों को बनाए रखता है।
