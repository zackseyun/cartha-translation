  yaml_path: translation/ot/deuteronomy/031/004.yaml
  text: And the LORD will do to them just as he did to Sihon and Og, the kings of the Amorites, and to their land, when he destroyed them.
translation:
  language: hi
  text: और यहोवा उनके साथ वैसा ही करेगा जैसा उसने एमोरियों के राजाओं, सीहोन और ओग, तथा उनके देश के साथ किया था, जिन्हें उसने नष्ट कर दिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को प्रचलित और स्पष्ट हिन्दी रूप में रखा गया है।
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: वैसा ही करेगा जैसा उसने ... किया था
  rationale: तुलना की इब्रानी संरचना और भविष्यकाल तथा पूर्व घटना के संबंध को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: הִשְׁמִיד
  choice: विनाश कर दिया था
  rationale: हिफ़ील क्रिया के पूर्णतः नष्ट कर देने के कारक और निर्णायक भाव को व्यक्त करता है।
- source_word: הָאֱמֹרִי
  choice: एमोरियों
  rationale: जातिनाम का आधुनिक हिन्दी बाइबलीय लिप्यंतरण बहुवचन संदर्भ के अनुसार किया गया है।
theological_decisions:
- issue: अंतिम संबंधवाचक उपवाक्य אֲשֶׁר הִשְׁמִיד אֹתָם का संबंध और कालगत भाव
  choice: जब उसने उनका विनाश कर दिया था
  alternative: जिनका उसने विनाश कर दिया था
  rationale: אֲשֶׁר यहाँ संदर्भ में उस अवसर/घटना का भाव दे सकता है; 'जब' सीहोन, ओग और उनके देश के साथ किए गए कार्य को विनाश की घटना से जोड़ता है, बिना 'उनका' के संभावित संदर्भ को अनावश्यक रूप से सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य में मूल इब्रानी की तुलना, नामों का क्रम और विनाश का स्पष्ट कथन सुरक्षित है।
