base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/017.yaml
  text: Then my anger will burn against them on that day[a], and I will forsake them and hide my face from them, and they will be devoured, and many evils and troubles will find them. And he will say on that day[b], ‘Is it not because my God is not among me that these evils have found me?’
translation:
  language: hi
  text: तब उस दिन मेरा क्रोध उनके विरुद्ध भड़क उठेगा, और मैं उन्हें त्याग दूँगा और उनसे अपना मुख छिपा लूँगा। वे भस्म किए जाएँगे[a], और बहुत-सी विपत्तियाँ और मुसीबतें उन्हें आ घेरेंगी। उस दिन वह कहेगा, ‘क्या ये विपत्तियाँ मुझ पर इसीलिए नहीं आईं कि मेरा परमेश्वर मेरे बीच में नहीं है?’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह/यह खाने के लिए होगा।” हिब्रू अभिव्यक्ति संक्षिप्त है और विनाश के लिए असुरक्षित हो जाने या भस्म किए जाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में, “मेरा परमेश्वर मेरे भीतर/मेरे बीच में नहीं है।” यहाँ एकवचन भाषा इस्राएल को एक व्यक्ति के रूप में बोलते हुए प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: मेरा क्रोध ... भड़क उठेगा
  rationale: हिब्रू मुहावरे में क्रोध के जलने की छवि है; ‘भड़क उठेगा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसकी तीव्रता और रूपक को बनाए रखता है।
- source_word: בּוֹ
  choice: उनके विरुद्ध
  rationale: रूप एकवचन है, पर संदर्भ में इस्राएल सामूहिक रूप से अभिप्रेत है; वर्णनात्मक खंड में हिन्दी का बहुवचन अधिक स्वाभाविक है।
- source_word: וַעֲזַבְתִּים
  choice: मैं उन्हें त्याग दूँगा
  rationale: ‘त्यागना’ वाचा-संबंधी परित्याग की गंभीरता व्यक्त करता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: וְהִסְתַּרְתִּי פָנַי מֵהֶם
  choice: उनसे अपना मुख छिपा लूँगा
  rationale: यह परमेश्वर के न्याय और संबंधगत दूरी का महत्वपूर्ण हिब्रू बिंब है; इसे परिभाषित करने के बजाय यथावत रखा गया है।
- source_word: וְהָיָה לֶאֱכֹל
  choice: वे भक्षण का शिकार हो जाएँगे
  rationale: शाब्दिक अभिव्यक्ति ‘खाए जाने के लिए होगा’ संक्षिप्त और संदिग्ध है। हिन्दी में यह चयन विनाश के लिए असुरक्षित हो जाने का भाव देता है, पर भक्षक को निर्दिष्ट नहीं करता।
- source_word: וּמְצָאֻהוּ
  choice: उन्हें आ घेरेंगी
  rationale: मूल क्रिया का अर्थ ‘पाना/आ मिलना’ है; विपत्तियों के कर्ता होने पर ‘आ घेरना’ हिन्दी में स्वाभाविक है और अचानक आ पड़ने का प्रसंगगत भाव रखता है।
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: बहुत-सी विपत्तियाँ और मुसीबतें
  rationale: रָעוֹת यहाँ नैतिक बुराइयों से अधिक अनिष्ट या विपत्तियों को सूचित करता है, जबकि צָרוֹת संकट और मुसीबतें हैं; दोनों शब्दों का भेद रखा गया है।
- source_word: וְאָמַר
  choice: वह कहेगा
  rationale: हिब्रू एकवचन इस्राएल को एक सामूहिक व्यक्ति के रूप में प्रस्तुत करता है; उद्धृत आत्मस्वीकृति में इस व्यक्तिकरण को सुरक्षित रखा गया है।
- source_word: הֲלֹא עַל כִּי
  choice: क्या ... इसीलिए नहीं
  rationale: यह कारण बताने वाला आलंकारिक प्रश्न है; चयन उसका प्रश्नात्मक बल बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: אֵין אֱלֹהַי בְּקִרְבִּי
  choice: मेरा परमेश्वर मेरे बीच में नहीं है
  rationale: ‘मेरे बीच में’ मूल के प्रथम-पुरुष एकवचन और इस्राएल के सामूहिक व्यक्तिकरण को बनाए रखता है, भले ही हिन्दी में इसकी असामान्यता जानबूझकर बनी रहती है।
- source_word: מְצָאוּנִי
  choice: मुझ पर ... आईं
  rationale: हिन्दी में विपत्तियों के विषय में ‘मुझ पर आईं’ स्वाभाविक है; पूर्ण क्रिया उद्धरण के समय तक घट चुके परिणाम को व्यक्त करती है।
theological_decisions:
- issue: इस्राएल के लिए सामूहिक एकवचन और बहुवचन
  choice: वर्णन में बहुवचन ‘उन्हें/वे’, पर इस्राएल की वाणी में एकवचन ‘वह/मुझ/मेरा’
  alternative: पूरे पद में केवल एकवचन या केवल बहुवचन रखना
  rationale: मूल पाठ इस्राएल को एक जाति और एक व्यक्तिकृत वक्ता—दोनों रूपों में रखता है। हिन्दी की स्वाभाविकता के लिए वर्णन में बहुवचन और उद्धरण की विशेष अलंकारिकता के लिए एकवचन रखा गया है।
- issue: परमेश्वर के मुख छिपाने का अर्थ
  choice: ‘अपना मुख छिपा लूँगा’ मुहावरे को बनाए रखना
  alternative: ‘उनसे दूर हो जाऊँगा’ या ‘अपनी उपस्थिति हटा लूँगा’
  rationale: मूल बिंब न्याय, अनुपलब्धता और संबंधगत दूरी के बीच का धार्मिक तनाव रखता है; व्याख्यात्मक विकल्प उसे एक ही अर्थ में सीमित कर देंगे।
- issue: אֵין אֱלֹהַי בְּקִרְבִּי में ईश्वरीय अनुपस्थिति
  choice: इस्राएल की अनुभूत स्वीकारोक्ति के रूप में शाब्दिक निकटता से प्रस्तुत करना
  alternative: इसे ‘परमेश्वर ने मेरी सहायता छोड़ दी है’ के रूप में समझाकर लिखना
  rationale: पाठ स्वयं अनुपस्थिति के स्वरूप को विस्तार से नहीं समझाता; इसलिए कथन को सहायता, अनुग्रह या वास्तविक उपस्थिति की किसी एक व्यवस्थित व्याख्या में नहीं बाँधा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सार्वजनिक-पाठ योग्य शैली अपनाई गई है। ‘मुख छिपाना’ जैसे प्रमुख हिब्रू बिंब सुरक्षित रखे गए हैं। ‘भक्षण का शिकार’ कुछ औपचारिक है, पर मूल की संक्षिप्तता और अस्पष्टता को बिना भक्षक जोड़े व्यक्त करता है।
