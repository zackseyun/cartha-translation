source:
  edition: WLC
  text: וְ/עַתָּ֗ה כִּתְב֤וּ לָ/כֶם֙ אֶת הַ/שִּׁירָ֣ה הַ/זֹּ֔את וְ/לַמְּדָ֥/הּ אֶת בְּנֵי יִשְׂרָאֵ֖ל שִׂימָ֣/הּ בְּ/פִי/הֶ֑ם לְמַ֨עַן תִּהְיֶה לִּ֜/י הַ/שִּׁירָ֥ה הַ/זֹּ֛את לְ/עֵ֖ד בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/019.yaml
  text: And now[a], write this song for yourselves, and teach it to the sons of Israel; put it in their mouths[b], so that this song may be a witness for me against the sons of Israel.
translation:
  language: hi
  text: और अब तुम अपने लिए यह गीत लिखो और इसे इस्राएल के पुत्रों[a] को सिखाओ; इसे उनके मुँह में रखो, ताकि यह गीत इस्राएल के पुत्रों के विरुद्ध[b] मेरे लिए गवाह बने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘इस्राएली’ या ‘इस्राएल की संतान’; इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है। यही पद इस आयत में आगे फिर आया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘के बीच’। इब्रानी पूर्वसर्ग का अधिक शाब्दिक अर्थ ‘में/के बीच’ हो सकता है, पर यहाँ प्रसंग संभवतः गीत के उनके विरुद्ध गवाह होने का है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: संयोजक וְ और कालवाचक עַתָּה को रखते हुए प्रसंगगत निष्कर्ष और तात्कालिकता व्यक्त करता है; हिन्दी में केवल ‘और अब’ की अपेक्षा ‘इसलिए अब’ यहाँ अधिक स्वाभाविक है।
- source_word: כִּתְבוּ לָכֶם
  choice: तुम अपने लिए ... लिखो
  rationale: बहुवचन आज्ञार्थ और לָכֶם के हित/आत्मसंबंधी भाव, दोनों को व्यक्त करता है।
- source_word: הַשִּׁירָה הַזֹּאת
  choice: यह गीत
  rationale: שִׁירָה का सीधा और प्रसंगानुकूल अर्थ ‘गीत’ है, यद्यपि इसकी रचना काव्यात्मक है।
- source_word: וְלַמְּדָהּ
  choice: और इसे ... सिखाओ
  rationale: स्त्रीलिंग प्रत्यय का संबंध ‘गीत’ से है; हिन्दी में उसका स्वाभाविक सर्वनाम ‘इसे’ है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी की शाब्दिक वाचा-संबंधी पहचान को सुरक्षित रखता है; आधुनिक पाठक के लिए समावेशी आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: שִׂימָהּ בְּפִיהֶם
  choice: इसे उनके मुँह में रखो
  rationale: गीत को याद कराकर बोलने/गाने योग्य बनाने की ठोस इब्रानी उपमा को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: उद्देश्य का स्वाभाविक और सटीक आधुनिक हिन्दी सूचक है।
- source_word: תִּהְיֶה לִּי לְעֵד
  choice: मेरे लिए गवाह ठहरे
  rationale: गीत की परमेश्वर की ओर से साक्षी की भूमिका व्यक्त करता है और לִּי को ‘मेरे लिए’ के रूप में सुरक्षित रखता है।
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के विरुद्ध
  rationale: वाचा-विवाद और निकटवर्ती चेतावनी के संदर्भ में בְּ का विरोधात्मक अर्थ उपयुक्त है; ‘के बीच’ की वास्तविक संभावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल की संतान
  rationale: मुख्य पाठ इब्रानी के स्पष्ट रूप को बनाए रखता है, पर पादटिप्पणी बताती है कि संबोधन समूचे इस्राएली समुदाय के लिए है।
- issue: गवाह वाले उपवाक्य में בִּבְנֵי יִשְׂרָאֵל का बल
  choice: इस्राएल के पुत्रों के विरुद्ध
  alternative: इस्राएल के पुत्रों के बीच
  rationale: वाचा के न्यायिक संदर्भ में गीत का कार्य इस्राएल के उल्लंघन पर उसके विरुद्ध साक्षी होना है; फिर भी संबंधबोधक उपसर्ग का अधिक स्थानवाचक पाठ वास्तविक संभावना है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। इब्रानी की ठोस उपमा ‘मुँह में रखो’ और ‘मेरे लिए गवाह’ की संरचना सुरक्षित रखी गई है। बहुवचन आज्ञाओं के लिए स्पष्ट ‘तुम’ जोड़ा गया है।
