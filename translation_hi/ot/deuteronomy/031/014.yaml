reference: Deuteronomy 31:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הֵ֣ן קָרְב֣וּ יָמֶי/ךָ֮ לָ/מוּת֒ קְרָ֣א אֶת יְהוֹשֻׁ֗עַ וְ/הִֽתְיַצְּב֛וּ בְּ/אֹ֥הֶל מוֹעֵ֖ד וַ/אֲצַוֶּ֑/נּוּ וַ/יֵּ֤לֶךְ מֹשֶׁה֙ וִֽ/יהוֹשֻׁ֔עַ וַ/יִּֽתְיַצְּב֖וּ בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/014.yaml
  text: And Yahweh said to Moses[a], “Behold, your days are drawing near for you to die. Call Joshua, and present yourselves in the tent of meeting, that I may command him.” So Moses and Joshua went and presented themselves in the tent of meeting.
translation:
  language: hi
  text: तब यहोवा ने मूसा से कहा, “देख, तेरे मरने के दिन निकट आ गए हैं। यहोशू को बुला, और तुम दोनों मिलापवाले तम्बू में उपस्थित हो जाओ, ताकि मैं उसे आदेश दूँ[a]।” तब मूसा और यहोशू गए और मिलापवाले तम्बू में उपस्थित हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे दायित्व सौंपूँ।” इब्रानी क्रिया का अर्थ आदेश देना या औपचारिक दायित्व सौंपना हो सकता है; यहाँ प्रसंग यहोशू को आगे की जिम्मेदारी देने से जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: הֵן
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला अव्यय है; ‘देख’ आधुनिक, सहज हिन्दी में उसका बल बनाए रखता है।
- source_word: קָרְבוּ יָמֶיךָ לָמוּת
  choice: तेरे मरने के दिन निकट आ गए हैं
  rationale: इब्रानी मुहावरे में ‘तेरे दिन’ और मरने का भाव दोनों सुरक्षित रहते हैं, जबकि वाक्य स्वाभाविक हिन्दी में समझ आता है।
- source_word: קְרָא אֶת יְהוֹשֻׁעַ
  choice: यहोशू को बुला
  rationale: सरल आज्ञार्थक क्रिया को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: וְהִתְיַצְּבוּ
  choice: तुम दोनों ... उपस्थित हो जाओ
  rationale: द्विवचन-सदृश संदर्भगत बहुवचन का आशय स्पष्ट करते हुए औपचारिक रूप से सामने उपस्थित होने का भाव व्यक्त किया गया है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तम्बू में
  rationale: यह उपासना-स्थान के पारंपरिक और व्यापक रूप से समझे जाने वाले हिन्दी नाम को सुरक्षित रखता है तथा בְ का स्थानवाचक अर्थ देता है।
- source_word: וַאֲצַוֶּנּוּ
  choice: ताकि मैं उसे आदेश दूँ
  rationale: צוה का मूल अर्थ ‘आदेश देना/दायित्व सौंपना’ है। मुख्य पाठ में निकटतम सामान्य अर्थ रखा गया है और नियुक्ति-संदर्भ की सम्भावित छाया पादटिप्पणी में दी गई है।
- source_word: וַיֵּלֶךְ מֹשֶׁה וִיהוֹשֻׁעַ
  choice: तब मूसा और यहोशू गए
  rationale: कथात्मक क्रम को सहज हिन्दी में ‘तब’ द्वारा व्यक्त किया गया है।
- source_word: וַיִּתְיַצְּבוּ
  choice: उपस्थित हुए
  rationale: पहले आए उसी इब्रानी मूल की संगति बनाए रखते हुए औपचारिक उपस्थिति का अर्थ रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; इसलिए उपाधि ‘प्रभु’ के स्थान पर हिन्दी में प्रचलित नाम-रूप रखा गया है।
- issue: यहोशू के संबंध में צוה की अर्थ-छाया
  choice: उसे आदेश दूँ
  alternative: उसे दायित्व सौंपूँ; उसे नियुक्त करूँ
  rationale: क्रिया के सीधे अर्थ को मुख्य पाठ में रखा गया है। प्रसंग औपचारिक दायित्व या नियुक्ति की ओर संकेत कर सकता है, पर उसे मुख्य पाठ में अनिवार्य अर्थ बनाकर अस्पष्टता समाप्त नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूसा से एकवचन निकट संबोधन के कारण ‘तेरे’ और ‘बुला’ का प्रयोग है; दोनों व्यक्तियों के लिए ‘तुम दोनों’ अर्थ को स्पष्ट करता है।
