  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם בֶּן מֵאָה֩ וְ/עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ הַ/יּ֔וֹם לֹא אוּכַ֥ל ע֖וֹד לָ/צֵ֣את וְ/לָ/ב֑וֹא וַֽ/יהוָה֙ אָמַ֣ר אֵלַ֔/י לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/002.yaml
  text: And he said to them[a], “I am one hundred twenty years old today. I can no longer go out and come in, and Yahweh has said to me, ‘You shall not cross this Jordan.’”
translation:
  language: hi
  text: और उसने उनसे कहा, “आज मैं एक सौ बीस वर्ष का हूँ। अब मैं बाहर जाने और भीतर आने में समर्थ नहीं हूँ[a], और याहवे ने मुझसे कहा है, ‘तू इस यरदन को पार नहीं करेगा।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “बाहर जाना और भीतर आना” है। यह मुहावरा सामान्य गतिविधि या लोगों का नेतृत्व करने—दोनों में से किसी का उल्लेख कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: और उसने उनसे कहा
  rationale: यह रूप इब्रानी कथात्मक प्रवाह और बहुवचन अप्रत्यक्ष कर्म ‘उनसे’ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: आज मैं एक सौ बीस वर्ष का हूँ
  rationale: इब्रानी आयु-वाचक मुहावरे ‘... वर्ष का पुत्र’ को अर्थानुकूल आधुनिक हिन्दी में व्यक्त किया गया है; ‘आज’ की कालगत प्रमुखता और אָנֹכִי का स्पष्ट प्रथम पुरुष भी सुरक्षित है।
- source_word: לֹא אוּכַל עוֹד
  choice: अब मैं ... में समर्थ नहीं हूँ
  rationale: יכל क्षमता और עוֹד अब आगे वैसी क्षमता न रहने का भाव व्यक्त करते हैं। ‘अब ... समर्थ नहीं हूँ’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: לָצֵאת וְלָבוֹא
  choice: बाहर जाने और भीतर आने
  rationale: शाब्दिक मुहावरे को रखा गया है, क्योंकि यह सामान्य गतिविधि अथवा लोगों का नेतृत्व करने—दोनों की ओर संकेत कर सकता है; मुख्य पाठ किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיהוָה
  choice: और यहोवा
  rationale: चार अक्षरों वाले ईश्वरीय नाम יהוה को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, न कि सामान्य उपाधि से।
- source_word: אָמַר אֵלַי
  choice: ने मुझसे कहा है
  rationale: पूर्ण क्रिया को वर्तमान प्रभाव वाले पूर्व कथन के रूप में ‘कहा है’ से व्यक्त किया गया है।
- source_word: לֹא תַעֲבֹר אֶת הַיַּרְדֵּן הַזֶּה
  choice: तू इस यरदन को पार नहीं करेगा
  rationale: ‘इस’ मूल के संकेतवाचक बल को सुरक्षित रखता है। भविष्यकालीन निषेधात्मक कथन परमेश्वर की रोक और निश्चित घोषणा—दोनों का बल वहन कर सकता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नामरूप है और इसे केवल उपाधि ‘प्रभु’ में बदलकर नाम की विशिष्टता नहीं मिटाता।
- issue: לֹא תַעֲבֹר में निषेध और घोषणा का संबंध
  choice: तू इस यरदन को पार नहीं करेगा
  alternative: तू इस यरदन को पार न करना; तू इस यरदन को पार नहीं कर पाएगा
  rationale: हिन्दी भविष्यकाल मूल कथन को केवल आज्ञा या केवल असमर्थता तक सीमित किए बिना ईश्वरीय रोक और निश्चित परिणाम के तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। प्रत्यक्ष ईश्वरीय संबोधन में ‘तू’ रखा गया है, जो एकवचन इब्रानी रूप और पारंपरिक बाइबलीय प्रत्यक्ष वचन के अनुरूप है। मुहावरे की वास्तविक अर्थगत अस्पष्टता फुटनोट सहित सुरक्षित रखी गई है।
