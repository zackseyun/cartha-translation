  text: לָקֹ֗חַ אֵ֣ת סֵ֤פֶר הַ/תּוֹרָה֙ הַ/זֶּ֔ה וְ/שַׂמְתֶּ֣ם אֹת֔/וֹ מִ/צַּ֛ד אֲר֥וֹן בְּרִית יְהוָ֖ה אֱלֹהֵי/כֶ֑ם וְ/הָֽיָה שָׁ֥ם בְּ/ךָ֖ לְ/עֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/026.yaml
  text: Take this Book of the Law and place it beside the ark of the covenant of Yahweh your God[b][a], and let it remain there as a witness against you.
translation:
  language: hi
  text: “व्यवस्था की इस पुस्तक[a] को लो और इसे तुम्हारे परमेश्वर यहोवा की वाचा के संदूक के बगल में रख दो। यह वहाँ तुम्हारे विरुद्ध साक्षी के रूप में रहे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्यवस्था के इस ग्रंथपत्र को।” इब्रानी शब्द סֵפֶר किसी लिखित दस्तावेज़ या लिपटे हुए ग्रंथपत्र को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात, यदि लोग वाचा तोड़ें, तो यह पुस्तक उनके विरुद्ध साक्ष्य देगी।
    reason: cultural_note
lexical_decisions:
- source_word: לָקֹחַ
  choice: लो
  rationale: यह काल रूप में क्रिया का साधारण रूप है, पर यहाँ आज्ञार्थक बल रखता है; ‘लो’ संक्षिप्त और स्वाभाविक है।
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: व्यवस्था की इस पुस्तक
  rationale: סֵפֶר लिखित दस्तावेज़ या पुस्तक/पुस्तकाकार लपेटे हुए ग्रंथ को सूचित कर सकता है; תּוֹרָה इस प्रसंग में वाचा-संबंधी व्यवस्था और शिक्षा को सूचित करती है।
- source_word: וְשַׂמְתֶּם אֹתוֹ
  choice: और इसे ... रख दो
  rationale: שׂים किसी वस्तु को किसी स्थान पर रखने की ठोस क्रिया है; हिंदी में ‘रख दो’ आज्ञा के क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִצַּד
  choice: के पास
  rationale: मूल पदबंध संदूक के पार्श्व में स्थान बताता है, उसके भीतर नहीं; ‘के पास’ सहज हिंदी है, जबकि पादटिप्पणी में ‘बगल में’ से स्थान अधिक स्पष्ट किया गया है।
- source_word: אֲרוֹן בְּרִית
  choice: वाचा के संदूक
  rationale: इब्रानी संबंध-रचना को प्रचलित और स्पष्ट हिंदी पदबंध में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिंदी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर
  rationale: बहुवचन संबोधनयुक्त संबंधसूचक रूप का सीधा हिंदी अनुवाद है।
- source_word: וְהָיָה שָׁם
  choice: यह वहाँ ... बनी रहे
  rationale: शाब्दिक अर्थ ‘और वह वहाँ होगा’ है; संदर्भ में रखे जाने के बाद स्थायी उपस्थिति अभिप्रेत है, जिसे ‘बनी रहे’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּךָ לְעֵד
  choice: तुम्हारे विरुद्ध गवाह
  rationale: व्यवस्थाविवरण की वाचाई और न्यायिक पृष्ठभूमि में לְעֵד בְּ का अर्थ आरोपकारी साक्ष्य है; एकवचन प्रत्यय सामूहिक इस्राएल को संबोधित करता है।
theological_decisions:
- issue: पुस्तक की गवाही का कार्य
  choice: पुस्तक को इस्राएल के विरुद्ध वाचाई और न्यायिक गवाह के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल स्मारक या तटस्थ गवाही मानना।
  rationale: לְעֵד בְּךָ और निकटवर्ती संदर्भ में लोगों की भावी अवज्ञा की चर्चा आरोपकारी अर्थ का समर्थन करती है; पादटिप्पणी इस निहितार्थ को स्पष्ट करती है, पर मुख्य पाठ से आगे कोई सांप्रदायिक निष्कर्ष नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण आज्ञार्थक शैली अपनाई गई है। ‘व्यवस्था’, ‘वाचा’ और ‘संदूक’ जैसे स्थापित बाइबलीय शब्द संदर्भ की विधिक-वाचाई प्रकृति बनाए रखते हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
