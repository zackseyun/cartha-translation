  text: then[a], if the wicked man deserves to be beaten, the judge shall make him lie down and have him beaten before him, according to his wickedness, by number.
translation:
  language: hi
  text: तब यदि दोषी व्यक्ति दंड पाने के योग्य हो, तो न्यायाधीश उसे लिटवाए और अपने सामने उसके अपराध के अनुपात में गिनी हुई संख्या के अनुसार उसे कोड़े लगवाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּן הַכּוֹת
  choice: मार खाने योग्य
  rationale: यह इब्रानी मुहावरा शाब्दिक रूप से ‘मार का पुत्र’ है और न्यायिक संदर्भ में शारीरिक दंड का पात्र या अधिकारी होने का भाव देता है।
- source_word: הָרָשָׁע
  choice: दोषी व्यक्ति
  rationale: इस न्यायिक संदर्भ में विशेषण संज्ञा के रूप में उस व्यक्ति को सूचित करता है जिसे दोषी ठहराया गया है; ‘दोषी व्यक्ति’ आधुनिक हिन्दी में कानूनी आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהִפִּילוֹ
  choice: उसे लिटवाए
  rationale: נפל के हिफ़ईल रूप का अर्थ यहाँ दंड पाने वाले को नीचे लिटवाना है; प्रेरणार्थक हिन्दी न्यायी की आदेशात्मक भूमिका भी व्यक्त करती है।
- source_word: הַשֹּׁפֵט
  choice: न्यायी
  rationale: यह न्यायिक अधिकारी के लिए मानक, गरिमापूर्ण हिन्दी शब्द है।
- source_word: וְהִכָּהוּ
  choice: पिटवाए
  rationale: इब्रानी क्रिया मारने या प्रहार करने को दर्शाती है। प्रसंग में न्यायी की निगरानी में दंड दिए जाने के कारण हिन्दी का प्रेरणार्थक रूप स्वाभाविक है, यद्यपि व्याकरणिक कर्ता न्यायी ही बना रहता है।
- source_word: לְפָנָיו
  choice: अपने सामने
  rationale: यह न्यायी की उपस्थिति और निगरानी में दंड दिए जाने को निकट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּדֵי רִשְׁעָתוֹ
  choice: उसके अपराध के अनुपात में
  rationale: वाक्यांश अपराध और दंड के बीच उचित अनुपात बताता है। यह कानूनी संदर्भ में ‘उसकी दुष्टता के अनुसार’ से अधिक स्पष्ट और स्वाभाविक है।
- source_word: בְּמִסְפָּר
  choice: गिनकर
  rationale: संक्षिप्त इब्रानी पद गिनी हुई संख्या में प्रहार किए जाने का संकेत देता है; ‘गिनकर’ उस प्रक्रिया को सहज हिन्दी में रखता है और वैकल्पिक औपचारिक अर्थ पादटिप्पणी में दिया गया है।
