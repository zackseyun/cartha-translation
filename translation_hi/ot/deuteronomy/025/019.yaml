source:
  edition: WLC
  text: וְ/הָיָ֡ה בְּ/הָנִ֣יחַ יְהוָ֣ה אֱלֹהֶ֣י/ךָ לְ֠/ךָ מִ/כָּל אֹ֨יְבֶ֜י/ךָ מִ/סָּבִ֗יב בָּ/אָ֨רֶץ֙ אֲשֶׁ֣ר יְהוָֽה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֤ נַחֲלָה֙ לְ/רִשְׁתָּ֔/הּ תִּמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹ֖א תִּשְׁכָּֽח׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/019.yaml
  text: And when Yahweh your God gives you rest from all your enemies around you[a], in the land that Yahweh your God is giving you as an inheritance to possess, you shall blot out the remembrance of Amalek from under heaven. Do not forget.
translation:
  language: hi
  text: और जब याहवे तुम्हारा परमेश्वर तुम्हें तुम्हारे चारों ओर के सब शत्रुओं से विश्राम दे, तब उस देश में जिसे याहवे तुम्हारा परमेश्वर तुम्हें विरासत के रूप में दे रहा है, ताकि तुम उस पर अधिकार करो, आकाश के नीचे से अमालेक की स्मृति[a] मिटा देना। भूलना मत।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अमालेक का स्मरण।”
    reason: זֵכֶר स्मृति, याद या स्मरण का भाव व्यक्त कर सकता है।
lexical_decisions:
- source_word: וְהָיָה בְּהָנִיחַ
  choice: और जब ... विश्राम दे, तब
  rationale: भविष्य की परिस्थिति और उसके परिणामस्वरूप आने वाली आज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है; हिफ़ील रूप का कारक भाव ‘विश्राम दे’ में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: מִכָּל אֹיְבֶיךָ מִסָּבִיב
  choice: तुम्हारे चारों ओर के सब शत्रुओं से
  rationale: ‘सब’ द्वारा समग्रता और ‘चारों ओर’ द्वारा स्थानिक भाव दोनों सुरक्षित रहते हैं।
- source_word: נַחֲלָה
  choice: विरासत के रूप में
  rationale: यह वाचा के अंतर्गत दिए गए देश के लिए प्रयुक्त उत्तराधिकार-संबंधी भाव को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: לְרִשְׁתָּהּ
  choice: अधिकार करने के लिए
  rationale: यहाँ ירשׁ का अर्थ देश पर अधिकार प्राप्त करके उसे अपने अधीन रखना है; हिन्दी में यह ‘विरासत’ की अनावश्यक पुनरावृत्ति से भी बचाता है।
- source_word: תִּמְחֶה
  choice: मिटा देना
  rationale: מחה के पोंछकर मिटा देने या पूर्णतः समाप्त कर देने के प्रबल आज्ञार्थक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: זֵכֶר
  choice: स्मृति
  rationale: यह किसी व्यक्ति या समुदाय की बची हुई याद अथवा स्मरण को सूचित करता है; अधिक व्याख्यात्मक ‘नामोनिशान’ नहीं अपनाया गया।
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: आकाश के नीचे से
  rationale: इब्रानी मुहावरे की छवि और व्यापकता को सीधे सुरक्षित रखता है।
- source_word: לֹא תִּשְׁכָּח
  choice: भूलना मत
  rationale: छोटी, सीधी और बलपूर्ण निषेधाज्ञा मूल की समापन-शक्ति को बनाए रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि में बदले बिना अपेक्षाकृत निकट लिप्यंतरण देता है।
- issue: זֵכֶר का आशय
  choice: अमालेक की स्मृति
  alternative: अमालेक का स्मरण
  rationale: पाठ स्मृति या स्मरण के मिटाए जाने की बात करता है। ‘वंश’, ‘लोग’ या ‘नामोनिशान’ जैसे अधिक निश्चित अर्थ जोड़कर निहित तनाव को चुपचाप हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। एकवचन संबोधन ‘तुम्हारा/तुम्हें’ मूल के एकवचन रूपों के अनुरूप रखा गया है। अंतिम ‘भूलना मत’ को अलग, संक्षिप्त वाक्य रखकर मूल निषेधाज्ञा का जोर सुरक्षित किया गया है।
