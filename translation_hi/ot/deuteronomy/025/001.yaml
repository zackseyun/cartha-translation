  text: כִּֽי יִהְיֶ֥ה רִיב֙ בֵּ֣ין אֲנָשִׁ֔ים וְ/נִגְּשׁ֥וּ אֶל הַ/מִּשְׁפָּ֖ט וּ/שְׁפָט֑וּ/ם וְ/הִצְדִּ֨יקוּ֙ אֶת הַ/צַּדִּ֔יק וְ/הִרְשִׁ֖יעוּ אֶת הָ/רָשָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/001.yaml
  text: If there is a dispute between men[a], and they come to court, and the judges decide between them, then they shall acquit the righteous and condemn the wicked[c][b],
translation:
  language: hi
  text: यदि पुरुषों के बीच कोई विवाद हो और वे न्यायालय में आएँ, और न्यायाधीश उनका न्याय करें, तो वे जो सही हो उसे निर्दोष ठहराएँ और जो दोषी हो उसे दोषी ठहराएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: यदि ... हो
  rationale: यह विधान किसी संभावित कानूनी स्थिति की शर्त प्रस्तुत करता है; आधुनिक हिन्दी में “यदि ... हो” इसका स्वाभाविक रूप है।
- source_word: רִיב
  choice: विवाद
  rationale: न्यायिक संदर्भ में यह झगड़े अथवा कानूनी विवाद को दर्शाता है; “विवाद” स्पष्ट और गरिमापूर्ण है।
- source_word: בֵּין אֲנָשִׁים
  choice: दो पुरुषों के बीच
  rationale: हिब्रू में बहुवचन “पुरुषों” है; “बीच” के साथ हिन्दी में दो पक्षों का भाव स्वाभाविक रूप से व्यक्त करने के लिए “दो” जोड़ा गया है।
- source_word: וְנִגְּשׁוּ אֶל־הַמִּשְׁפָּט
  choice: और वे न्याय के लिए आएँ
  rationale: शाब्दिक भाव “न्याय के पास आएँ” है, जिसका आशय न्यायिक कार्यवाही के लिए उपस्थित होना है।
- source_word: וּשְׁפָטוּם
  choice: और न्यायी उनका न्याय करें
  rationale: क्रिया सक्रिय बहुवचन है—“वे उनका न्याय करें।” प्रसंग से कर्ता न्याय करने वाले अधिकारी हैं; हिन्दी में स्पष्टता के लिए “न्यायी” व्यक्त किया गया है।
- source_word: וְהִצְדִּיקוּ אֶת־הַצַּדִּיק
  choice: वे निर्दोष को निर्दोष ठहराएँ
  rationale: न्यायालयीन संदर्भ में हिफ़ील क्रिया का अर्थ किसी को सही अथवा निर्दोष घोषित करना है, नैतिक रूप से बदलना नहीं। दोहराव मूल के शब्द-संबंध को बनाए रखता है।
- source_word: וְהִרְשִׁיעוּ אֶת־הָרָשָׁע
  choice: और दोषी को दोषी ठहराएँ
  rationale: न्यायिक संदर्भ में इसका अर्थ दोषी घोषित करना है। यह पिछले खंड के समानांतर कानूनी निर्णय को स्पष्ट करता है।
theological_decisions:
- issue: צדק/רשע का न्यायिक या नैतिक अर्थ
  choice: 'न्यायिक घोषणा: “निर्दोष को निर्दोष ठहराएँ” और “दोषी को दोषी ठहराएँ”'
  alternative: व्यक्तियों के सामान्य नैतिक चरित्र का वर्णन
  rationale: पूरा वाक्य न्यायिक कार्यवाही और निर्णय के विषय में है; अतः ये पद इस मुकदमे में सही और दोषी पक्ष के बारे में न्यायालयीन घोषणा बताते हैं, न कि उनमें नैतिक गुण उत्पन्न किए जाने को।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, औपचारिक और सामान्य पाठक के लिए स्पष्ट कानूनी भाषा रखी गई है। “न्यायी” बाइबलीय गरिमा बनाए रखते हुए निर्णय देने वाले अधिकारियों को स्पष्ट करता है।
