- source_word: בְּדִישׁוֹ
  choice: जब ... अनाज दाँव रहा हो
  rationale: בְּ के साथ דישׁ और एकवचन पुल्लिंग प्रत्यय का शाब्दिक भाव ‘उसके दाँवने के समय’ है। यह चयन कालगत अर्थ को स्वाभाविक हिंदी में व्यक्त करता है और कर्ता के रूप में बैल को बनाए रखता है।
