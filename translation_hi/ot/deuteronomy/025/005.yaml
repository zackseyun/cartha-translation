source:
  edition: WLC
  text: כִּֽי יֵשְׁב֨וּ אַחִ֜ים יַחְדָּ֗ו וּ/מֵ֨ת אַחַ֤ד מֵ/הֶם֙ וּ/בֵ֣ן אֵֽין ל֔/וֹ לֹֽא תִהְיֶ֧ה אֵֽשֶׁת הַ/מֵּ֛ת הַ/ח֖וּצָ/ה לְ/אִ֣ישׁ זָ֑ר יְבָמָ/הּ֙ יָבֹ֣א עָלֶ֔י/הָ וּ/לְקָחָ֥/הּ ל֛/וֹ לְ/אִשָּׁ֖ה וְ/יִבְּמָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/005.yaml
  text: If brothers dwell together[a], and one of them dies and has no son, the wife of the dead man shall not be married outside the family to a stranger[d][c][b]. Her husband's brother shall go in to her and take her as his wife and perform the duty of a brother-in-law to her.
translation:
  language: hi
  text: यदि भाई साथ-साथ रहते हों और उनमें से एक मर जाए और उसका कोई पुत्र न हो[a], तो मृतक की पत्नी परिवार से बाहर किसी पराए पुरुष से विवाह न करे[b]। उसके पति का भाई[c] उसके पास जाए[d], उसे अपनी पत्नी बनाए और उसके प्रति पति के भाई का कर्तव्य निभाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ठीक-ठीक ‘पुत्र’ कहा गया है; कुछ व्याख्याएँ इस कानूनी शर्त को अधिक व्यापक अर्थ में ‘सन्तान’ से जोड़ती हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक भाव है, ‘बाहर किसी पराए पुरुष की न हो’; यहाँ ‘पराया’ उस पुरुष को दर्शाता है जो इस पारिवारिक दायित्व के बाहर है, न कि अनिवार्य रूप से किसी दूसरी जाति का व्यक्ति।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में मृत पति के भाई के लिए एक विशेष संबंध-सूचक शब्द है। इसी से जुड़ा विवाह प्रायः ‘देवर-विवाह’ या ‘लेविराट विवाह’ कहलाता है।
    reason: cultural_note
  - marker: d
    text: ‘उसके पास जाए’ इब्रानी की शिष्टोक्ति है, जिसका आशय यहाँ विवाह के अंतर्गत यौन-संबंध स्थापित करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחִים יַחְדָּו
  choice: भाई साथ-साथ रहते हों
  rationale: אַחִים का सामान्य अर्थ पुरुष सहोदर ‘भाई’ है, और יַחְדָּו साझा निवास या निकट घरेलू संगति को दर्शाता है। ‘साथ-साथ रहते हों’ कानूनी शर्त को स्वाभाविक हिन्दी में रखता है, बिना निवास-व्यवस्था को अनावश्यक रूप से निश्चित किए।
- source_word: וּבֵן אֵין לוֹ
  choice: उसका कोई पुत्र न हो
  rationale: इब्रानी में सामान्य ‘सन्तान’ नहीं, बल्कि स्पष्ट रूप से בֵּן, अर्थात् ‘पुत्र’, है। मुख्य पाठ स्रोत की इसी विशिष्टता को बनाए रखता है।
- source_word: אֵשֶׁת הַמֵּת
  choice: मृतक की पत्नी
  rationale: यह इब्रानी रचना ‘मरे हुए व्यक्ति की पत्नी’ के निकट है और आधुनिक हिन्दी में संक्षिप्त तथा स्वाभाविक है। ‘विधवा’ अर्थतः सही है, पर मूल का शब्दरूप नहीं है।
- source_word: הַחוּצָה לְאִישׁ זָר
  choice: परिवार से बाहर किसी पराए पुरुष की पत्नी
  rationale: הַחוּצָה ‘बाहर’ की दिशा बताता है और זָר उस पारिवारिक दायित्व के घेरे से बाहर के पुरुष को सूचित करता है; यह आवश्यक नहीं कि वह जातीय अर्थ में विदेशी हो। ‘परिवार से बाहर’ कानूनी-सामाजिक विरोध को स्पष्ट करता है।
- source_word: יְבָמָהּ
  choice: उसके पति का भाई
  rationale: यह विशेष संज्ञा मृत पति के उस भाई को दर्शाती है जिस पर यह दायित्व आता है। हिन्दी में ‘देवर’ प्रायः छोटे भाई के लिए समझा जा सकता है, इसलिए ‘पति का भाई’ आयु के बारे में अनावश्यक निष्कर्ष नहीं जोड़ता।
- source_word: יָבֹא עָלֶיהָ
  choice: उसके पास जाए
  rationale: यह इब्रानी का शिष्टोक्ति-प्रयोग है जो वैवाहिक यौन-संबंध को सूचित करता है। मुख्य पाठ में मुहावरे की गरिमा रखी गई है और आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וּלְקָחָהּ לוֹ לְאִשָּׁה
  choice: उसे अपनी पत्नी बनाए
  rationale: शाब्दिक भाव ‘उसे अपने लिए पत्नी के रूप में लेना’ है। चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए वैवाहिक अर्थ को स्पष्ट करता है।
- source_word: וְיִבְּמָהּ
  choice: उसके प्रति पति के भाई का कर्तव्य निभाए
  rationale: यह विशेष क्रिया मृत पुरुष के भाई द्वारा विवाह-संबंधी पारिवारिक दायित्व पूरा करने को दर्शाती है। तकनीकी शब्दावली थोपे बिना कानूनी बल को साधारण हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ‘उसका कोई पुत्र न हो’ की शर्त का दायरा
  choice: मुख्य पाठ में विशिष्ट शब्द ‘पुत्र’ रखा गया है।
  alternative: इसे व्यापक बनाकर ‘उसकी कोई सन्तान न हो’ कहना।
  rationale: मूल इब्रानी में בֵּן ‘पुत्र’ है। ‘सन्तान’ करने से कानून के व्यापक अनुप्रयोग के प्रश्न का अनुवाद में ही निर्णय हो जाएगा; इसलिए वास्तविक शाब्दिक विशिष्टता और व्याख्यात्मक तनाव बनाए रखा गया है।
- issue: पति के भाई से संबंधित विशेष वैवाहिक दायित्व
  choice: मुख्य पाठ में सामान्य संबंधपरक भाषा—‘पति का भाई’ और ‘कर्तव्य निभाए’—का प्रयोग।
  alternative: तकनीकी शब्द ‘लेविराट विवाह’ या केवल ‘देवर-विवाह’ का प्रयोग।
  rationale: मूल की कानूनी धारणा को समझने योग्य हिन्दी में व्यक्त किया गया है। ‘देवर’ आयु-संबंधी अर्थ ला सकता है और विदेशी तकनीकी पद सामान्य पाठक के लिए अस्पष्ट हो सकता है।
- issue: יָבֹא עָלֶיהָ की शिष्टोक्ति
  choice: मुख्य पाठ में ‘उसके पास जाए’, और पादटिप्पणी में यौन-संबंध का आशय स्पष्ट।
  alternative: मुख्य पाठ में सीधे ‘उससे यौन-संबंध बनाए’ कहना।
  rationale: इससे मूल की शिष्टोक्ति और विधिक गरिमा बनी रहती है, पर पादटिप्पणी पाठक से वास्तविक आशय नहीं छिपाती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, विधिक प्रसंग के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘मृतक’, ‘पराया पुरुष’ और ‘कर्तव्य निभाए’ औपचारिकता बनाए रखते हैं; ‘पति का भाई’ से ‘देवर’ के संभावित आयु-संकेत से बचा गया है। सभी पादटिप्पणी-चिह्न संबंधित पद के तुरंत बाद रखे गए हैं।
