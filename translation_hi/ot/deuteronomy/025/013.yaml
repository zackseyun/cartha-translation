lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: तुम्हारी ... में ... न हों
  rationale: इब्रानी अस्तित्ववाचक रचना का स्वाभाविक हिन्दी रूप, जो निषेध की कानूनी शक्ति बनाए रखता है।
- source_word: בְּכִיסְךָ
  choice: तुम्हारी थैली में
  rationale: כִּיס व्यापार में बाट या धन रखने की थैली अथवा छोटी झोली को दर्शाता है; ‘थैली’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: אֶבֶן וָאָבֶן
  choice: अलग-अलग बाट
  rationale: शाब्दिक अर्थ ‘एक पत्थर और एक पत्थर’ है, पर यहाँ पत्थर के बने तौल-बाट अभिप्रेत हैं। ‘अलग-अलग बाट’ व्यापारिक अर्थ और जानबूझकर रखे गए असमान मानकों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: एक बड़ा और एक छोटा
  rationale: यह युग्म दोनों बाटों के विपरीत आकार/मान को स्पष्ट करता और इब्रानी समानांतरता को बनाए रखता है।
