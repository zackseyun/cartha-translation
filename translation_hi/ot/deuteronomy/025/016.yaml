source:
  edition: WLC
  text: כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל עֹ֣שֵׂה אֵ֑לֶּה כֹּ֖ל עֹ֥שֵׂה עָֽוֶל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/016.yaml
  text: For everyone who does these things[a], everyone who does injustice, is an abomination to Yahweh your God.
translation:
  language: hi
  text: क्योंकि हर व्यक्ति जो ये काम करता है—हर व्यक्ति जो अन्याय[a] करता है—तुम्हारे परमेश्वर याहवे की दृष्टि में घृणित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गलत काम” अथवा “अधर्म।” इब्रानी עָוֶל अन्याय, गलत काम या अधर्म को दर्शा सकता है; यहाँ इसका संबंध विशेष रूप से बेईमान लेन-देन से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले निषेध का कारण बताता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: תוֹעֲבַת
  choice: घृणित
  rationale: यह संज्ञा परमेश्वर की दृष्टि में अत्यंत निंदनीय और अस्वीकार्य वस्तु या व्यक्ति को दर्शाती है। हिंदी में विधेय विशेषण ‘घृणित है’ अर्थ की तीव्रता को स्वाभाविक ढंग से रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी लिपि में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को ‘तुम्हारे’ से व्यक्त किया गया है और वाचा-सूचक संबोधन की संरचना सुरक्षित रखी गई है।
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: ये काम करने वाला हर व्यक्ति
  rationale: सहभागी कृदंत एक सामान्य वर्ग बताता है; यह रूप כָּל की व्यापकता और אֵלֶּה के पिछले संदर्भ को स्पष्ट रखता है।
- source_word: כֹּל עֹשֵׂה עָוֶל
  choice: अन्याय करने वाला हर व्यक्ति
  rationale: עָוֶל का अर्थ अन्याय, गलत काम या अधर्म हो सकता है। बेईमान बाट और माप के इस संदर्भ में ‘अन्याय’ सामाजिक और नैतिक दोष को उपयुक्त रूप से व्यक्त करता है; दोहराया गया ‘करने वाला हर व्यक्ति’ इब्रानी समानांतरता को भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना आधुनिक हिंदी में प्रचलित विद्वत्तापूर्ण लिप्यंतरण के रूप में रखता है।
- issue: दो सहभागी पदबंधों का संबंध
  choice: दोनों पदबंधों को डैश से समानाधिकरण में रखना
  alternative: ‘अर्थात’ जोड़कर दूसरे पदबंध को स्पष्ट व्याख्या बनाना
  rationale: इब्रानी में कोई स्पष्ट संयोजक या व्याख्यात्मक शब्द नहीं है। डैश निकट संबंध और जोरदार पुनरुक्ति दिखाता है, पर संबंध को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। इब्रानी की दोहरावपूर्ण समानांतर संरचना को हिंदी में दोनों बार ‘करने वाला हर व्यक्ति’ कहकर सुरक्षित रखा गया है; डैश वाक्य को पठनीय बनाते हैं।
