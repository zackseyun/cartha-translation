source:
  edition: WLC
  text: אֲשֶׁ֨ר קָֽרְ/ךָ֜ בַּ/דֶּ֗רֶךְ וַ/יְזַנֵּ֤ב בְּ/ךָ֙ כָּל הַ/נֶּחֱשָׁלִ֣ים אַֽחַרֶ֔י/ךָ וְ/אַתָּ֖ה עָיֵ֣ף וְ/יָגֵ֑עַ וְ/לֹ֥א יָרֵ֖א אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/018.yaml
  text: how he met you on the way and attacked all the stragglers behind you, when you were weary and worn out; and he did not fear God.
translation:
  language: hi
  text: कि मार्ग में वह तुमसे कैसे मिला और जब तुम थके-माँदे थे, तब उसने तुम्हारे पीछे रह गए सभी दुर्बल लोगों पर धावा बोला; और वह परमेश्वर का भय नहीं मानता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְךָ
  choice: तुमसे आ भिड़ा
  rationale: यह क्रिया मार्ग में सामना होने को व्यक्त करती है; प्रसंग में यह आकस्मिक भेंट नहीं, शत्रुतापूर्ण मुठभेड़ है।
- source_word: וַיְזַנֵּב בְּךָ
  choice: तुम्हारे ... लोगों पर पीछे से हमला किया
  rationale: मूल क्रिया पीछे या छोर पर प्रहार करने की छवि रखती है। यह अनिवार्य रूप से मार डालने को नहीं कहती, इसलिए ‘हमला किया’ चुना गया।
- source_word: הַנֶּחֱשָׁלִים
  choice: निर्बल लोगों
  rationale: शब्द उन लोगों को सूचित करता है जो दुर्बल होकर पीछे छूट गए थे; ‘निर्बल’ इस कारण को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: עָיֵף וְיָגֵעַ
  choice: थके-माँदे
  rationale: दोनों निकटार्थक शब्द मिलकर अत्यधिक शारीरिक थकावट बताते हैं; हिन्दी का युग्म अर्थ और लय दोनों बनाए रखता है।
- source_word: וְלֹא יָרֵא אֱלֹהִים
  choice: उसने परमेश्वर का भय नहीं माना
  rationale: ‘भय मानना’ यहाँ परमेश्वर के प्रति नैतिक-सम्मानपूर्ण संकोच और जवाबदेही को व्यक्त करता है, केवल डर को नहीं।
theological_decisions:
- issue: अंतिम उपवाक्य ‘उसने परमेश्वर का भय नहीं माना’ का कर्ता
  choice: अमालेक को कर्ता माना गया
  alternative: इस्राएल को कर्ता मानना
  rationale: निकटतम एकवचन कर्ता और पूरे वाक्य का शत्रु-केंद्रित वर्णन अमालेक की ओर संकेत करता है, यद्यपि इब्रानी में सर्वनाम व्यक्त नहीं है।
- issue: וַיְזַנֵּב में मृत्यु को स्पष्ट करना
  choice: ‘हमला किया’
  alternative: ‘मार डाला’ या ‘काट डाला’
  rationale: मूल क्रिया पीछे से प्रहार या पीछे के दल को निशाना बनाने पर बल देती है और स्वयं मृत्यु को स्पष्ट रूप से नहीं बताती।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘कि कैसे’ पिछले पद के ‘याद रखो’ से इस आश्रित वाक्य का संबंध बनाए रखता है।
