translation:
  language: hi
  text: तू उसका हाथ[a] काट डालना; तेरी आँख उस पर तरस न खाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी हथेली।” इब्रानी शब्द का अर्थ विशेष रूप से हथेली भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “तेरी आँख उसे न बख्शे।” इब्रानी मुहावरा शाब्दिक रूप से आँख का उल्लेख करके दया या करुणा न दिखाने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַצֹּתָה
  choice: काट डालना
  rationale: קצץ का अर्थ किसी अंग को काटकर अलग करना है। ‘काट डालना’ आधुनिक हिन्दी में स्वाभाविक रहते हुए आज्ञा की कठोरता और ठोस अर्थ को बनाए रखता है।
- source_word: אֶת
  choice: '[कर्म-चिह्न, अनूदित नहीं]'
  rationale: यह निश्चित प्रत्यक्ष कर्म को चिह्नित करता है; हिन्दी में इसका अलग शब्द आवश्यक नहीं है।
- source_word: כַּפָּהּ
  choice: उसका हाथ
  rationale: כַּף का अर्थ ‘हथेली’ या व्यापक अर्थ में ‘हाथ’ हो सकता है। इस दंड-विधान में ‘हाथ’ अधिक स्वाभाविक है; ‘हथेली’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לֹא
  choice: न … न
  rationale: हिन्दी निषेधात्मक आज्ञा की स्वाभाविक रचना में इसका भाव ‘न खाए’ से व्यक्त होता है।
- source_word: תָחוֹס
  choice: तरस न खाए
  rationale: חוס में दया करना, तरस खाना अथवा छोड़ देना सम्मिलित हो सकता है। आँख के साथ ‘तरस न खाए’ हिन्दी का स्वाभाविक मुहावरा है और करुणा न दिखाने का भाव रखता है।
- source_word: עֵינֶךָ
  choice: तेरी आँख
  rationale: मूल इब्रानी के सजीव कानूनी मुहावरे को सामान्य ‘तू’ में बदलने के बजाय अक्षुण्ण रखा गया है।
theological_decisions:
- issue: दंड-विधान की प्रत्यक्षता
  choice: ‘उसका हाथ काट डालना’ और ‘तेरी आँख … तरस न खाए’ की ठोस भाषा बनाए रखी गई है।
  alternative: ‘उस पर कोई दया न करना’ जैसे अधिक भावानुवादी रूप से दंड और मुहावरे को समेट देना।
  rationale: यह इस्राएल की व्यवस्था में प्रत्यक्ष कानूनी आज्ञा है। मूल की कठोरता को नरम करना या इसके शाब्दिक दंड को किसी अन्य अर्थ में बदलना स्रोत-पाठ से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण कानूनी स्वर। व्यवस्थाविवरण की एकवचन संबोधन-शैली के अनुरूप ‘तू/तेरी’ रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदों के तुरंत बाद दिए गए हैं।
