reference: Deuteronomy 25:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֶ֣בֶן שְׁלֵמָ֤ה וָ/צֶ֨דֶק֙ יִֽהְיֶה לָּ֔/ךְ אֵיפָ֧ה שְׁלֵמָ֛ה וָ/צֶ֖דֶק יִֽהְיֶה לָּ֑/ךְ לְמַ֨עַן֙ יַאֲרִ֣יכוּ יָמֶ֔י/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/015.yaml
  text: You shall have a full and just weight; you shall have a full and just ephah[a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: hi
  text: तुम्हारे पास पूरा और सही बाट[a] हो, और तुम्हारे पास पूरा और सही एपा[b] हो, ताकि उस भूमि पर तुम्हारे दिन लंबे हों जिसे याहवे, तुम्हारा परमेश्वर, तुम्हें दे रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘पत्थर’; यहाँ व्यापार में तौलने के लिए इस्तेमाल होने वाला पत्थर का बाट।
    reason: मूल शब्द की ठोस छवि और संदर्भगत अर्थ दोनों बताने के लिए।
  - marker: b
    text: एपा सूखी वस्तुओं को नापने की एक प्राचीन इकाई थी।
    reason: अपरिचित प्राचीन माप को सामान्य पाठक के लिए स्पष्ट करने के लिए।
lexical_decisions:
- source_word: אֶבֶן
  choice: बाट
  rationale: मूल अर्थ ‘पत्थर’ है, पर व्यापारिक संदर्भ में यह तौलने के लिए प्रयुक्त मानक पत्थर, अर्थात बाट, को दर्शाता है। ‘बाट’ हिन्दी में ठोस वस्तु और उसके व्यापारिक कार्य—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁלֵמָה
  choice: पूरा
  rationale: यह शब्द पूर्णता और किसी कमी के न होने का भाव देता है। बाट और माप के साथ ‘पूरा’ कम नाप-तौल न करने की बात स्पष्ट करता है।
- source_word: וָצֶדֶק
  choice: और सही
  rationale: व्यापारिक संदर्भ में צדק उचित, निष्पक्ष और मानक के अनुरूप होने का बोध देता है। ‘सही’ सामान्य पाठक के लिए सहज है और केवल तकनीकी शुद्धता तक सीमित हुए बिना ईमानदार नाप-तौल का संकेत देता है।
- source_word: יִהְיֶה לָּךְ
  choice: तुम्हारे पास … हो
  rationale: शाब्दिक संरचना ‘तुम्हारे लिए/पास हो’ कानूनी अपेक्षा व्यक्त करती है। हिन्दी में यह रूप स्वाभाविक रहते हुए निर्देश का बल बनाए रखता है।
- source_word: אֵיפָה
  choice: एपा
  rationale: यह सूखी वस्तुओं को नापने की एक विशिष्ट प्राचीन इकाई है। इसका सटीक आधुनिक हिन्दी समतुल्य नहीं होने के कारण लिप्यंतरण रखा गया और पादटिप्पणी में अर्थ स्पष्ट किया गया है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह आज्ञापालन और उसके उद्देश्य अथवा परिणाम के बीच संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יַאֲרִיכוּ יָמֶיךָ
  choice: तुम्हारे दिन लंबे हों
  rationale: यह हिन्दी में समझ आने योग्य रहते हुए इब्रानी मुहावरे में दिनों के लंबे किए जाने की छवि को सुरक्षित रखता है।
- source_word: עַל הָאֲדָמָה
  choice: उस भूमि पर
  rationale: व्यवस्थाविवरण के संदर्भ में אֲדָמָה प्रतिज्ञात भूमि की ओर संकेत करता है। ‘भूमि पर’ על के निकट है और हिन्दी में सहज है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में उसके प्रचलित विद्वत्तापरक उच्चारण के निकट रूप में रखा गया है।
- source_word: נֹתֵן לָךְ
  choice: तुम्हें दे रहा है
  rationale: वर्तमान कृदंत देने की चल रही अथवा निकटस्थ क्रिया को प्रस्तुत करता है; यह रूप उसके पक्षगत भाव को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट वाचा-नाम सीधे आया है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है और उसे किसी उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। कानूनी निर्देश का स्वर ‘हो’ से व्यक्त किया गया है। समानांतर इब्रानी संरचना को ‘तुम्हारे पास पूरा और सही… हो’ की पुनरावृत्ति द्वारा बनाए रखा गया है।
