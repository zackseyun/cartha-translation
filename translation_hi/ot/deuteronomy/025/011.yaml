base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/011.yaml
  text: If men are fighting together[a], a man and his brother, and the wife of one comes near to rescue her husband from the hand of the one striking him, and she reaches out her hand and seizes his genitals[d][c][b],
translation:
  language: hi
  text: यदि[c] पुरुष आपस में लड़ रहे हों—एक पुरुष और उसका भाई[a]—और उनमें से एक की पत्नी अपने पति को उस पर प्रहार करनेवाले के हाथ से छुड़ाने के लिए पास आए, और अपना हाथ बढ़ाकर उस प्रहार करनेवाले पुरुष के गुप्तांगों को पकड़ ले,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘भाई’ का अर्थ सगा भाई ही नहीं, बल्कि साथी इस्राएली या स्वजातीय पुरुष भी हो सकता है।
    reason: cultural_note
  - marker: c
    text: या, ‘जब।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यह व्यवस्था में एक संभावित परिस्थिति प्रस्तुत करता है; आधुनिक हिन्दी की कानूनी शैली में ‘यदि’ स्वाभाविक है, जबकि ‘जब’ भी सम्भव है।
- source_word: יִנָּצוּ אֲנָשִׁים יַחְדָּו
  choice: पुरुष आपस में लड़ रहे हों
  rationale: निफ़अल क्रिया यहाँ शारीरिक संघर्ष बताती है; ‘आपस में’ पारस्परिकता और יַחְדָּו का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ וְאָחִיו
  choice: एक पुरुष और उसका भाई
  rationale: मूल की संरचना और ‘भाई’ की सामाजिक-वाचा संबंधी भाषा को बनाए रखा गया है; टिप्पणी में इसके व्यापक अर्थ को स्पष्ट किया गया है।
- source_word: וְקָרְבָה
  choice: पास आए
  rationale: क्रिया के साधारण स्थानगत अर्थ को सहज और निकट रूप में व्यक्त करता है।
- source_word: אֵשֶׁת הָאֶחָד
  choice: उनमें से एक की पत्नी
  rationale: हिन्दी में यह मूल आशय को ‘एक की पत्नी’ की अपेक्षा अधिक स्पष्ट और स्वाभाविक ढंग से बताता है।
- source_word: לְהַצִּיל אֶת אִישָׁהּ
  choice: अपने पति को ... छुड़ाने के लिए
  rationale: यह तत्काल शारीरिक संकट से बचाने का अर्थ देता है; אִישָׁהּ वैवाहिक प्रसंग में ‘उसका पति’ है।
- source_word: מִיַּד מַכֵּהוּ
  choice: उस पर प्रहार करनेवाले के हाथ से
  rationale: ‘हाथ से’ की मूल ठोस छवि रखी गई है और מַכֵּהוּ को ‘उस पर प्रहार करनेवाला’ कहा गया है, जिससे संबंध स्पष्ट रहता है।
- source_word: וְשָׁלְחָה יָדָהּ
  choice: अपना हाथ बढ़ाकर
  rationale: हाथ फैलाने की इब्रानी अभिव्यक्ति का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: וְהֶחֱזִיקָה
  choice: पकड़ ले
  rationale: यह दृढ़तापूर्वक थामने की क्रिया को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בִּמְבֻשָׁיו
  choice: उस पुरुष के गुप्तांग
  rationale: यह पुरुष के निजी अंगों के लिए प्रयुक्त शिष्टोक्ति है; ‘उस पुरुष के’ कहने से हिन्दी में संकेत हमलावर की ओर स्पष्ट रहता है।
