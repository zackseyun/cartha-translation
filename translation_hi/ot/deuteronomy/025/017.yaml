  text: זָכ֕וֹר אֵ֛ת אֲשֶׁר עָשָׂ֥ה לְ/ךָ֖ עֲמָלֵ֑ק בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֥ם מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/017.yaml
  text: Remember what Amalek did to you on the way when you came out from Egypt:[a]
translation:
  language: hi
  text: याद रखो कि जब तुम मिस्र से निकल रहे थे, तब मार्ग में अमालेक ने तुम्हारे साथ क्या किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָכוֹר
  choice: याद रखो
  rationale: זכר का काल सामान्य, एकवचन पुल्लिंग आज्ञार्थक रूप है। ‘याद रखो’ आधुनिक हिन्दी में स्वाभाविक सीधी आज्ञा है और स्मरण बनाए रखने का बल व्यक्त करता है।
- source_word: אֵת אֲשֶׁר
  choice: क्या
  rationale: कर्मसूचक אֵת और सम्बन्धवाचक אֲשֶׁר मिलकर स्मरण की विषयवस्तु बताते हैं; हिन्दी में ‘क्या’ स्वाभाविक है।
- source_word: עָשָׂה לְךָ
  choice: तुम्हारे साथ क्या किया
  rationale: עשה के साथ לְךָ यहाँ इस्राएल की ओर लक्षित शत्रुतापूर्ण कार्य बताता है। हिन्दी में ‘तुम्हारे साथ ... किया’ स्वाभाविक है और प्रसंग को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: עֲמָלֵק
  choice: अमालेक
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण। यहाँ यह अमालेक जाति को सामूहिक रूप में भी सूचित कर सकता है; मूल की यही संक्षिप्तता रखी गई है।
- source_word: בַּדֶּרֶךְ
  choice: मार्ग में
  rationale: דרך के पहले ב यात्रा के दौरान या रास्ते में होने का भाव देता है। ‘मार्ग में’ संक्षिप्त, गरिमापूर्ण और सुबोध है।
- source_word: בְּצֵאתְכֶם
  choice: जब तुम ... निकल रहे थे
  rationale: ב के साथ יצא का infinitive construct कालगत परिस्थिति बताता है। ‘निकल रहे थे’ उस यात्रा-प्रक्रिया का भाव सुरक्षित रखता है और बहुवचन सम्बोधन को ‘तुम’ से स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִמִּצְרָיִם
  choice: मिस्र से
  rationale: מן स्रोत या प्रस्थान-बिन्दु बताता है। ‘मिस्र से निकल रहे थे’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को पूरा व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘याद रखो’ मूल के एकवचन आज्ञार्थक सम्बोधन को बनाए रखता है, जबकि ‘निकल रहे थे’ में ‘तुम’ समुदाय के बहुवचन प्रत्यय को स्वाभाविक रूप से दर्शाता है। वाक्यक्रम हिन्दी की सहजता के लिए बदला गया है, पर मूल की सभी अर्थगत इकाइयाँ सुरक्षित हैं।
