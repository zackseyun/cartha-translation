source:
  edition: WLC
  text: וְ/הָיָ֗ה הַ/בְּכוֹר֙ אֲשֶׁ֣ר תֵּלֵ֔ד יָק֕וּם עַל שֵׁ֥ם אָחִ֖י/ו הַ/מֵּ֑ת וְ/לֹֽא יִמָּחֶ֥ה שְׁמ֖/וֹ מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/006.yaml
  text: And it shall be that the firstborn whom she bears shall rise up in the name of his dead brother[a], so that his name may not be blotted out from Israel.
translation:
  language: hi
  text: और ऐसा होगा कि वह जो पहिलौठा पुत्र जनेगी, वह उस मरे हुए भाई का नाम आगे चलाएगा[a], ताकि उस मरे हुए भाई का नाम इस्राएल में से न मिटे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उस मरे हुए भाई के नाम पर खड़ा होगा।” अर्थात वह इस्राएल में उस भाई के वंश और पारिवारिक स्थान को बनाए रखेगा; इसका यह अर्थ आवश्यक नहीं कि उसे वही व्यक्तिगत नाम दिया जाए।
    reason: इब्रानी मुहावरे का शाब्दिक रूप और उसका कानूनी-सामाजिक आशय स्पष्ट करने के लिए।
lexical_decisions:
- source_word: הַבְּכוֹר
  choice: पहिलौठा पुत्र
  rationale: संज्ञा पुल्लिंग है और इस व्यवस्था में स्त्री से जन्मे पहले पुत्र को सूचित करती है। ‘पहिलौठा पुत्र’ कानूनी और पारिवारिक महत्त्व को स्पष्ट रखता है।
- source_word: תֵּלֵד
  choice: जो ... वह जनेगी
  rationale: स्त्रीलिंग एकवचन क्रिया का कर्ता विधवा है। ‘जनेगी’ संक्षिप्त, स्वाभाविक और मातृ-कर्ता को स्पष्ट रखने वाला रूप है।
- source_word: יָקוּם עַל שֵׁם
  choice: नाम आगे चलाएगा
  rationale: शाब्दिक मुहावरा ‘नाम पर खड़ा होगा’ हिंदी में अस्पष्ट और अस्वाभाविक है। प्रसंग में इसका आशय मृत भाई के नाम, वंश और पारिवारिक स्थान को जारी रखना है; चुना हुआ रूप इस कानूनी-सामाजिक अर्थ को सहज हिंदी में व्यक्त करता है।
- source_word: אָחִיו הַמֵּת
  choice: मरे हुए भाई
  rationale: यह सीधा और सामान्य आधुनिक हिंदी रूप है। संबंध प्रसंग से उस मृत भाई की ओर संकेत करता है जिसकी विधवा से देवर-विवाह किया जा रहा है।
- source_word: יִמָּחֶה
  choice: न मिटे
  rationale: נפעל रूप नाम के मिटा दिए जाने या लुप्त हो जाने का भाव रखता है। ‘न मिटे’ हिंदी में नाम और स्मृति दोनों के लिए स्वाभाविक है तथा मूल रूपक बचाता है।
- source_word: מִיִּשְׂרָאֵל
  choice: इस्राएल में से
  rationale: מן समुदाय के भीतर से हट जाने या लुप्त हो जाने को सूचित करता है; ‘इस्राएल में से’ इस पृथक्करण-अर्थ को सीधे व्यक्त करता है।
theological_decisions:
- issue: יָקוּם עַל שֵׁם אָחִיו הַמֵּת में देवर-विवाह संबंधी सूत्र का अर्थ
  choice: पुत्र मृत भाई का नाम, वंश और पारिवारिक स्थान आगे चलाएगा।
  alternative: पुत्र को मृत भाई का वही व्यक्तिगत नाम दिया जाएगा।
  rationale: इस कानूनी प्रसंग में इब्रानी मुहावरा केवल नामकरण नहीं, बल्कि मृत पुरुष की वंश-रेखा, उत्तराधिकार-संबंधी स्थान और स्मृति को इस्राएल में बनाए रखने की ओर संकेत करता है। फिर भी शाब्दिक रूप और संभावित तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पहिलौठा पुत्र’ व्यवस्था का पुरुष-संतान संबंधी पक्ष स्पष्ट करता है; ‘नाम आगे चलाएगा’ शाब्दिक मुहावरे की कठिनता को अर्थ-संगत हिंदी में व्यक्त करता है।
