  text: וְ/נִגְּשָׁ֨ה יְבִמְתּ֣/וֹ אֵלָי/ו֮ לְ/עֵינֵ֣י הַ/זְּקֵנִים֒ וְ/חָלְצָ֤ה נַעֲל/וֹ֙ מֵ/עַ֣ל רַגְל֔/וֹ וְ/יָרְקָ֖ה בְּ/פָנָ֑י/ו וְ/עָֽנְתָה֙ וְ/אָ֣מְרָ֔ה כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר לֹא יִבְנֶ֖ה אֶת בֵּ֥ית אָחִֽי/ו־־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/009.yaml
  text: then his brother’s widow shall come near to him in the sight of the elders[a], remove his sandal from on his foot, spit in his face, and answer and say[b], ‘This is what shall be done to the man who will not build up his brother’s house.’
translation:
  language: hi
  text: तब उसके भाई की विधवा बुज़ुर्गों की उपस्थिति में उस आदमी के पास आए, उसके पैर से उसकी जूती उतारे, उसके चेहरे पर थूके[a], और उत्तर देकर कहे, “जो पुरुष अपने भाई का घराना नहीं बसाता, उसके साथ ऐसा ही किया जाएगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सामने थूके।” कुछ व्याख्याकार इब्रानी को उस पुरुष के चेहरे पर सीधे थूकने के बजाय उसके सामने थूकना समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: “अपने भाई का घराना बसाना” लेवीरेट प्रथा के विवाह द्वारा अपने मृत भाई के वंश और परिवार को आगे बढ़ाने को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: יְבִמְתּוֹ
  choice: उसके भाई की विधवा
  rationale: लेवीरेट विवाह के इस प्रसंग में यह केवल सामान्य ‘भाभी’ या ‘देवरानी’ नहीं, बल्कि मृत भाई की विधवा है; यह अभिव्यक्ति संबंध और कानूनी परिस्थिति दोनों स्पष्ट करती है।
- source_word: לְעֵינֵי הַזְּקֵנִים
  choice: बुज़ुर्गों के सामने
  rationale: शाब्दिक अर्थ ‘बुज़ुर्गों की आँखों के सामने’ है। हिंदी में यह चयन उस सार्वजनिक और साक्षी-युक्त कार्रवाई को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְחָלְצָה נַעֲלוֹ מֵעַל רַגְלוֹ
  choice: उसके पैर से उसकी जूती उतारे
  rationale: חָלַץ यहाँ पाँव से पहनावा उतारने को बताता है। इब्रानी में ‘जूती’ एकवचन है, इसलिए हिंदी में भी एकवचन रखा गया है।
- source_word: וְיָרְקָה בְּפָנָיו
  choice: उसके मुँह पर थूके
  rationale: בְּפָנָיו का सीधा अर्थ व्यक्ति के मुँह या चेहरे पर थूकना हो सकता है और यह अपमान की रस्म के अनुरूप है। ‘उसके सामने’ की वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְעָנְתָה וְאָמְרָה
  choice: उत्तर देकर कहे
  rationale: यह इब्रानी की औपचारिक कथात्मक-कानूनी अभिव्यक्ति है। हिंदी वाक्य को सहज रखते हुए दोनों क्रियाओं का भाव बनाए रखा गया है।
- source_word: כָּכָה יֵעָשֶׂה
  choice: उसके साथ ऐसा ही किया जाएगा
  rationale: यह प्रदर्शनात्मक घोषणा का स्वाभाविक आधुनिक हिंदी रूप है और मूल के कर्मवाच्य तथा कानूनी बल को बनाए रखता है।
- source_word: לָאִישׁ
  choice: जो पुरुष
  rationale: मूल में संज्ञा एकवचन पुल्लिंग है और इस व्यवस्था में निर्दिष्ट पुरुष संबंधी को दर्शाती है; इसलिए लिंग-सटीक अभिव्यक्ति रखी गई है।
- source_word: לֹא יִבְנֶה אֶת בֵּית אָחִיו
  choice: अपने भाई का घराना नहीं बसाता
  rationale: ‘घर बनाना’ यहाँ वंश और परिवार को आगे बढ़ाने का रूपक है। ‘घराना बसाना’ हिंदी में रूपक को बनाए रखते हुए आशय को पर्याप्त स्पष्ट करता है।
theological_decisions:
- issue: בְּפָנָיו में अपमान की क्रिया को प्रत्यक्ष मानना या नरम अर्थ में लेना
  choice: उसके मुँह पर थूके
  alternative: उसके सामने थूके
  rationale: मुख्य पाठ इब्रानी के सीधे और स्वाभाविक अर्थ को अपनाता है, जबकि संबंधबोधक अभिव्यक्ति की वैकल्पिक व्याख्या पादटिप्पणी में दी गई है। यह सिद्धांतगत निर्णय नहीं, बल्कि शब्दार्थ और प्रसंग का निर्णय है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। कानूनी प्रसंग की औपचारिकता के लिए ‘उत्तर देकर कहे’ और कर्मवाच्य घोषणा को बनाए रखा गया है; अनावश्यक पुरातन शब्दावली से बचा गया है।
