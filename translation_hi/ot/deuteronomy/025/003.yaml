  text: אַרְבָּעִ֥ים יַכֶּ֖/נּוּ לֹ֣א יֹסִ֑יף פֶּן יֹסִ֨יף לְ/הַכֹּת֤/וֹ עַל אֵ֨לֶּה֙ מַכָּ֣ה רַבָּ֔ה וְ/נִקְלָ֥ה אָחִ֖י/ךָ לְ/עֵינֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/003.yaml
  text: He may strike him forty times[a], but no more[b], lest he go on to strike him with many more blows than these and your brother be degraded before your eyes.
translation:
  language: hi
  text: उसे चालीस बार मारा जा सकता है,[a] पर इससे अधिक नहीं; कहीं ऐसा न हो कि इनसे अधिक बहुत प्रहार करके तुम्हारा भाई तुम्हारी आँखों के सामने अपमानित हो जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चालीस प्रहार’ अथवा ‘चालीस कोड़े।’ इब्रानी पाठ संख्या चालीस बताता है; यहाँ प्रहार का साधन या प्रत्येक प्रहार का ठीक रूप नहीं बताया गया है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘तुम्हारा भाई’ वाचा-समुदाय के एक साथी सदस्य को दर्शाता है। व्यवस्था दंड को सीमित करती है, ताकि उसे तुच्छ न ठहराया जाए।
    reason: cultural_note
lexical_decisions:
- source_word: אַרְבָּעִים יַכֶּנּוּ
  choice: उसे चालीस कोड़े मारे जा सकते हैं
  rationale: इब्रानी में संख्या चालीस स्पष्ट है, पर प्रहार का साधन नहीं बताया गया। न्यायिक अनुमति और अधिकतम सीमा को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: לֹא יֹסִיף
  choice: इससे अधिक नहीं
  rationale: יסף का मूल भाव ‘और जोड़ना’ है; यहाँ निर्धारित संख्या से आगे न बढ़ने का निषेध है।
- source_word: פֶּן יֹסִיף לְהַכֹּתוֹ
  choice: कहीं ऐसा न हो कि ... मारने से
  rationale: פֶּן चेतावनीपूर्ण नकारात्मक परिणाम प्रस्तुत करता है और יסף के साथ क्रिया जारी रखने अथवा बढ़ाने का भाव आता है।
- source_word: עַל אֵלֶּה מַכָּה רַבָּה
  choice: इनसे अधिक, बहुत-से कोड़े
  rationale: शाब्दिक संरचना ‘इनके ऊपर/परे एक बड़ी अथवा बहुत मार’ है। हिन्दी में यह निर्धारित संख्या से अधिक प्रहारों की बहुलता को स्पष्ट करता है।
- source_word: וְנִקְלָה
  choice: अपमानित हो जाए
  rationale: קלה के निफ़अल रूप में तुच्छ, नीचा या अनादृत ठहराए जाने का भाव है; ‘अपमानित’ व्यक्ति की सार्वजनिक गरिमा के हनन को सहज हिन्दी में व्यक्त करता है।
- source_word: אָחִיךָ
  choice: तुम्हारा भाई
  rationale: मूल पाठ का पारिवारिक और वाचा-समुदाय संबंधी संबोधन बनाए रखा गया है।
- source_word: לְעֵינֶיךָ
  choice: तुम्हारी आँखों के सामने
  rationale: इब्रानी मुहावरे का सीधा और स्वाभाविक हिन्दी रूप, जो खुले रूप से होने वाले अपमान पर बल देता है।
theological_decisions:
- issue: कानूनी प्रसंग में वाचा-समुदाय के सदस्य का संबोधन
  choice: तुम्हारा भाई
  alternative: तुम्हारा साथी इस्राएली
  rationale: ‘भाई’ बनाए रखने से यह नैतिक बल सुरक्षित रहता है कि दंडित व्यक्ति कठोर दंड के बाद भी समुदाय का अपना सदस्य है और उसे तुच्छ नहीं समझा जाना चाहिए।
- issue: चालीस प्रहारों की कानूनी शक्ति
  choice: चालीस तक की अनुमति, उससे अधिक का स्पष्ट निषेध
  alternative: ठीक चालीस प्रहार करना अनिवार्य है
  rationale: निकटवर्ती कानूनी संदर्भ और לֹא יֹסִיף सीमा पर बल देते हैं। हिन्दी ‘मारे जा सकते हैं’ इसे अधिकतम सीमा के रूप में प्रस्तुत करती है, न कि हर मामले में चालीस की अनिवार्यता के रूप में।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘कोड़े’ न्यायिक शारीरिक दंड के प्रसंग में स्वाभाविक है, जबकि पादटिप्पणी यह स्पष्ट करती है कि मूल पाठ साधन को निर्दिष्ट नहीं करता। मुख्य वाक्य में सीमा, चेतावनी और भाई की गरिमा—तीनों को सुरक्षित रखा गया है।
