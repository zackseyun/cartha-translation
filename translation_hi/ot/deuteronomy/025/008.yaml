translation_notes:
  register: आधुनिक मानक हिंदी में कानूनी-आख्यानात्मक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। ‘पुरनिए’ पारंपरिक बाइबली नागरिक पदनाम के रूप में रखा गया है; शेष वाक्य-विन्यास वर्तमान हिंदी के अनुरूप है।
