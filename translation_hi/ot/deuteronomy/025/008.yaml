  text: Then the elders of his city shall call him and speak to him[a], and if he stands and says, “I do not desire to take her,”
translation:
  language: hi
  text: तब उसके नगर के बुज़ुर्ग उसे बुलाएँ और उससे बात करें। यदि वह अड़ा रहे और कहे, “मैं उससे विवाह करने की इच्छा नहीं रखता,”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसे लेना।” स्त्री के संबंध में यह विवाह करने का एक प्रचलित मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְאוּ
  choice: बुलाएँ
  rationale: कानूनी निर्देश के क्रम में यह रूप अपेक्षित प्रक्रिया व्यक्त करता है; हिंदी में ‘बुलाएँ’ स्वाभाविक और निर्देशात्मक है।
- source_word: זִקְנֵי עִירוֹ
  choice: उसके नगर के पुरनिए
  rationale: यह नगर के मान्य नागरिक अगुवों को दर्शाता है। ‘पुरनिए’ बाइबली संदर्भ में परिचित, संक्षिप्त और गरिमापूर्ण पद है।
- source_word: וְדִבְּרוּ אֵלָיו
  choice: उससे बात करें
  rationale: इब्रानी पदबंध उसे सीधे संबोधित करके समझाने या बात करने को दर्शाता है; ‘उससे बात करें’ अर्थ को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: וְעָמַד
  choice: यदि वह अड़ा रहे
  rationale: शाब्दिक अर्थ ‘और वह खड़ा रहे’ है, किंतु इस कानूनी संदर्भ में यह पुरनियों से बात होने के बाद भी अपने निर्णय पर कायम रहने को सूचित करता है। ‘अड़ा रहे’ उस प्रासंगिक भाव को स्वाभाविक हिंदी में देता है।
- source_word: לֹא חָפַצְתִּי
  choice: मैं ... नहीं चाहता
  rationale: חפץ इच्छा, अभिलाषा या तत्परता व्यक्त करता है। आधुनिक हिंदी में ‘नहीं चाहता’ स्पष्ट और सहज है।
- source_word: לְקַחְתָּהּ
  choice: उसे पत्नी के रूप में अपनाना
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर स्त्री के संबंध में इस प्रसंग में यह विवाह करके पत्नी बनाने का प्रचलित मुहावरा है। हिंदी में केवल ‘उसे लेना’ अस्पष्ट और अप्राकृतिक होगा; चुना गया रूप वैवाहिक आशय स्पष्ट करता है।
