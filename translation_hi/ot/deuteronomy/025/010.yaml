- source_word: בֵּית
  choice: घराना
  rationale: यहाँ בֵּית केवल भवन नहीं, बल्कि परिवार या वंश को सूचित करता है; हिन्दी में ‘घराना’ इस सामुदायिक अपमान-सूचक नाम को संक्षेप में व्यक्त करता है।
- source_word: חֲלוּץ הַנָּעַל
  choice: जूती उतरवाए हुए का
  rationale: यह संक्षिप्त इब्रानी पदबंध उस व्यक्ति को सूचित करता है जिसकी जूती विधि के अनुसार उतारी गई। ‘उतरवाए हुए’ कर्मवाच्य भाव और अनुष्ठानिक अपमान दोनों को बचाता है।
- source_word: הַנָּעַל
  choice: जूती
  rationale: नָעַל प्राचीन पादत्राण को दर्शाता है। ‘जूती’ सामान्य आधुनिक हिन्दी में बोधगम्य है और प्रसंग में जूते की अपेक्षा अधिक उपयुक्त है।
