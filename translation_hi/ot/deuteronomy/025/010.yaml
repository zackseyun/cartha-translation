  choice: कहलाएगा
  rationale: निफ़अल रूप यहाँ सार्वजनिक नामकरण का निष्क्रिय भाव देता है; ‘कहलाएगा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए विधिक घोषणा का भाव बनाए रखता है।
- source_word: שְׁמוֹ
  choice: उसका नाम
