  yaml_path: translation/ot/deuteronomy/025/014.yaml
  text: You shall not have in your house an ephah and an ephah[a], a large and a small.
translation:
  language: hi
  text: तुम्हारे घर में दो एपा न हों—एक बड़ा और एक छोटा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: न हों
  rationale: नकारयुक्त अपूर्ण क्रिया और संबंधसूचक לְךָ यहाँ किसी वस्तु को रखने पर कानूनी निषेध व्यक्त करते हैं। हिंदी में ‘न हों’ इस निषेध को स्वाभाविक और संक्षिप्त रूप से प्रकट करता है।
- source_word: בְּבֵיתְךָ
  choice: तुम्हारे घर में
  rationale: בַּיִת का मूल अर्थ ‘घर’ है; प्रसंग में माप रखने का भौतिक स्थान अभिप्रेत है, इसलिए ‘घर’ उपयुक्त है।
- source_word: אֵיפָה וְאֵיפָה
  choice: दो प्रकार के एपा
  rationale: शाब्दिक पुनरुक्ति ‘एपा और एपा’ अलग-अलग मान वाले दो एपा-मापों को सूचित करती है। ‘दो प्रकार के एपा’ आधुनिक हिंदी में आशय स्पष्ट करता है, जबकि प्राचीन इकाई का नाम सुरक्षित रखता है।
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: एक बड़ा और एक छोटा
  rationale: ये स्त्रीलिंग विशेषण एपा के दो भिन्न परिमाण बताते हैं। ‘एक बड़ा और एक छोटा’ कानूनी कथन की संक्षिप्तता और विरोध को बनाए रखता है।
