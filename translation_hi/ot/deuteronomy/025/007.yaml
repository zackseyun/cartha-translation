base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/007.yaml
  text: But if the man does not want to take his brother’s widow[a], then his brother’s widow shall go up to the gate, to the elders, and say, ‘My brother-in-law refuses to raise up a name for his brother in Israel[b]; he is not willing to perform the duty of a brother-in-law to me.’
translation:
  language: hi
  text: परन्तु यदि वह पुरुष अपने भाई की विधवा से विवाह नहीं करना चाहता, तो उसके भाई की विधवा नगर के फाटक पर बुज़ुर्गों के पास जाए और कहे, “मेरे पति का भाई इस्राएल में अपने भाई का नाम बनाए रखने से इनकार करता है[a]; वह मेरे प्रति पति के भाई का कर्तव्य निभाने को तैयार नहीं है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने भाई के लिए इस्राएल में नाम खड़ा करने से।” इसका आशय मृत भाई के वंश और पारिवारिक नाम को कायम रखना है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में यहाँ एक तकनीकी क्रिया है, जिसका अर्थ मृत भाई की विधवा से विवाह करके पति के भाई का दायित्व पूरा करना है।
    reason: cultural_note
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: नहीं करना चाहता
  rationale: חפץ यहाँ इच्छा और तत्परता को व्यक्त करता है। कानूनी संदर्भ में यह सहज आधुनिक हिन्दी है और निर्णय की स्वैच्छिकता बनाए रखता है।
- source_word: לָקַחַת אֶת יְבִמְתּוֹ
  choice: अपने भाई की विधवा से विवाह करना
  rationale: לָקַחַת का शाब्दिक अर्थ ‘लेना’ है, पर विवाह-संदर्भ और יְבִמְתּוֹ के तकनीकी अर्थ के कारण हिन्दी में ‘विवाह करना’ आशय को अधिक स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है। ‘भाई की विधवा’ सामान्य ‘भाभी’ की अपेक्षा इस विशिष्ट कानूनी संबंध को ठीक से बताता है।
- source_word: וְעָלְתָה ... הַשַּׁעְרָה
  choice: नगर-द्वार पर ... जाकर
  rationale: हिब्रू में शाब्दिक रूप से ‘द्वार की ओर ऊपर जाए’ है। हिन्दी में ‘जाकर’ स्वाभाविक है; ‘नगर-द्वार’ उस सार्वजनिक न्यायिक स्थल को स्पष्ट करता है जहाँ पुरनिये बैठते थे।
- source_word: הַזְּקֵנִים
  choice: पुरनियों
  rationale: यह केवल अधिक आयु वाले लोगों को नहीं, बल्कि स्थानीय मान्य अधिकारियों को सूचित करता है। ‘पुरनिये’ हिन्दी बाइबलीय प्रयोग में इस नागरिक भूमिका को संक्षेप में व्यक्त करता है।
- source_word: מֵאֵין
  choice: इनकार करता है
  rationale: यह रूप अस्वीकार या अनिच्छा का प्रबल भाव रखता है; औपचारिक शिकायत में ‘इनकार करता है’ उपयुक्त है।
- source_word: לְהָקִים לְאָחִיו שֵׁם בְּיִשְׂרָאֵל
  choice: इस्राएल में अपने भाई का नाम बनाए रखने
  rationale: हिब्रू मुहावरा शाब्दिक रूप से भाई के लिए ‘नाम खड़ा करने’ की बात करता है। ‘नाम बनाए रखने’ मृत भाई के वंश और सामाजिक-पारिवारिक अस्तित्व को कायम रखने का आशय स्पष्ट करते हुए मुहावरे की छवि को निकटता से सुरक्षित रखता है।
- source_word: לֹא אָבָה
  choice: तैयार नहीं है
  rationale: אבה सहमति या इच्छा को व्यक्त करता है। यह अनुवाद पहले आए ‘इनकार करता है’ से अलग शब्दावली रखते हुए मूल की दोहरी अभिव्यक्ति को बनाए रखता है।
- source_word: יַבְּמִי
  choice: मेरे प्रति पति के भाई का कर्तव्य निभाने
  rationale: יבם देवर-विवाह संबंधी दायित्व पूरा करने का तकनीकी क्रियापद है। हिन्दी में केवल ‘देवर’ कहने से छोटे भाई का अर्थ सीमित हो सकता है, इसलिए ‘पति के भाई’ से मूल का अधिक व्यापक संबंध सुरक्षित रहता है।
theological_decisions:
- issue: देवर-विवाह संबंधी तकनीकी शब्दावली
  choice: मुख्य पाठ में ‘भाई की विधवा’, ‘पति का भाई’ और ‘पति के भाई का कर्तव्य’ जैसी स्पष्ट संबंधपरक भाषा
  alternative: ‘देवर-विवाह’ अथवा केवल ‘देवर का धर्म’ जैसे पारंपरिक तकनीकी पद
  rationale: मूल पद किसी भी ऐसे भाई पर लागू हो सकता है जो यह पारिवारिक दायित्व निभाए, जबकि आधुनिक हिन्दी में ‘देवर’ प्रायः पति के छोटे भाई तक सीमित समझा जाता है। स्पष्ट संबंधपरक भाषा संस्था का अर्थ बताती है, पर किसी सांप्रदायिक व्याख्या को नहीं जोड़ती।
- issue: ‘नाम खड़ा करने’ के मुहावरे का अर्थ
  choice: मुख्य पाठ में ‘नाम बनाए रखने’, और शाब्दिक रूप पादटिप्पणी में
  alternative: मुख्य पाठ में शाब्दिक ‘नाम खड़ा करने’
  rationale: यह मुहावरा मृत भाई के नाम और वंश को जारी रखने की कानूनी-पारिवारिक धारणा व्यक्त करता है। चुना हुआ रूप अर्थ स्पष्ट करता है, जबकि पादटिप्पणी स्रोत की रूपकात्मक भाषा सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। कानूनी परिवेश के लिए ‘नगर-द्वार’ और ‘पुरनिये’ प्रयुक्त हैं। ‘देवर’ की आयु-विशिष्ट आधुनिक धारणा से बचने हेतु ‘पति का भाई’ कहा गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदों के तुरंत बाद दिए गए हैं।
