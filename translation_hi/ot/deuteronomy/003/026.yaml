source:
  edition: WLC
  text: וַ/יִּתְעַבֵּ֨ר יְהוָ֥ה בִּ/י֙ לְמַ֣עַנְ/כֶ֔ם וְ/לֹ֥א שָׁמַ֖ע אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ רַב לָ֔/ךְ אַל תּ֗וֹסֶף דַּבֵּ֥ר אֵלַ֛/י ע֖וֹד בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/026.yaml
  text: But Yahweh was angry with me because of you and did not listen to me[a], and Yahweh said to me, “Enough from you[b]; do not speak to me again about this matter.”
translation:
  language: hi
  text: लेकिन तुम्हारे कारण याहवे मुझ पर क्रोधित हुआ और उसने मेरी बात नहीं सुनी। याहवे ने मुझसे कहा, “बस, बहुत हुआ![a] इस विषय में फिर मुझसे बात मत करना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “तेरे लिए बहुत है”; यह कड़ाई से रोक देने वाला मुहावरा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעַבֵּר יְהוָה בִּי
  choice: यहोवा मुझ पर क्रोधित हुआ
  rationale: यहाँ התעבר का हित्वअेल रूप यहोवा के किसी व्यक्ति पर क्रोधित होने को व्यक्त करता है। ‘मुझ पर क्रोधित हुआ’ स्वाभाविक और मूल मुहावरे के अनुरूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לְמַעַנְכֶם
  choice: तुम्हारे कारण
  rationale: प्रसंग में यह पद कारण या उत्तरदायित्व का संकेत देता है; ‘तुम्हारे कारण’ सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וְלֹא שָׁמַע אֵלָי
  choice: और उसने मेरी नहीं सुनी
  rationale: שׁמע אֶל यहाँ किसी की विनती सुनने या मानने के अर्थ में है। ‘मेरी नहीं सुनी’ हिन्दी में दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רַב לָךְ
  choice: बस, बहुत हुआ!
  rationale: शाब्दिक रूप ‘तेरे लिए बहुत’ एक तीखा, संक्षिप्त रोकने वाला मुहावरा है। ‘बस, बहुत हुआ!’ उसकी कठोरता और संवादात्मक बल को सुरक्षित रखता है।
- source_word: אַל תּוֹסֶף דַּבֵּר אֵלַי עוֹד
  choice: फिर मुझसे बात मत करना
  rationale: יסף के साथ क्रिया और עוֹד पुनरावृत्ति या आगे जारी रखने का निषेध बताते हैं; हिन्दी में ‘फिर ... मत करना’ इसका स्पष्ट स्वाभाविक रूप है।
- source_word: בַּדָּבָר הַזֶּה
  choice: इस विषय में
  rationale: דבר यहाँ किसी वस्तु के बजाय चर्चा के मुद्दे को दर्शाता है; ‘इस विषय में’ आधुनिक हिन्दी में उपयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में निजी वाचा-नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में पहचाने जाने योग्य ‘यहोवा’ नाम को रखा गया है, न कि उसे ‘प्रभु’ जैसी उपाधि से बदला गया।
- issue: לְמַעַנְכֶם में लोगों की भूमिका
  choice: तुम्हारे कारण
  alternative: तुम्हारे निमित्त / तुम्हारे संबंध में
  rationale: यह रूप मूसा के कथन में कारण का सामान्य अर्थ देता है। अनुवाद आरोप की सीमा या परमेश्वर के न्याय के विषय में मूल से आगे कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर के उत्तर की तीक्ष्णता दिखाने के लिए संक्षिप्त वाक्य और विस्मयादिबोधक चिह्न रखा गया है।
