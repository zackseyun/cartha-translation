translation:
  language: hi
  text: ये सभी ऊँची शहरपनाह, दोहरे किवाड़ों और अर्गलों वाले किलेबंद नगर थे; इनके अलावा खुले देहात की बहुत-सी बस्तियाँ[a] भी थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘खुले देश की बस्तियाँ’ अथवा ‘बिना शहरपनाह के नगर।’ इब्रानी में इन बस्तियों को अभी वर्णित किलेबंद नगरों के विपरीत रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֻרוֹת
  choice: गढ़वाले
  rationale: यह विशेषण आक्रमण से बचाव के लिए दृढ़ किए गए नगरों को बताता है। ‘गढ़वाले नगर’ आधुनिक हिन्दी में स्वाभाविक है और सैनिक संदर्भ को स्पष्ट रखता है।
- source_word: חוֹמָה גְבֹהָה
  choice: ऊँची शहरपनाह
  rationale: इब्रानी में संज्ञा और विशेषण दोनों एकवचन हैं। ‘ऊँची शहरपनाह’ उस रूप को बनाए रखते हुए नगर की रक्षात्मक दीवार का स्पष्ट बोध कराता है।
- source_word: דְּלָתַיִם
  choice: दोहरे किवाड़ों
  rationale: द्विवचन रूप प्रवेश-द्वार के दो पल्लों की ओर संकेत करता है। ‘दोहरे किवाड़’ केवल सामान्य ‘फाटक’ की अपेक्षा इस रूपगत विशेषता को बेहतर सुरक्षित रखता है।
- source_word: וּבְרִיחַ
  choice: और बेड़ों से
  rationale: בְּרִיחַ द्वार को भीतर से रोकने वाली आड़ी मजबूत पट्टी है। हिन्दी में ‘बेड़ा’ किवाड़ रोकने की ऐसी अर्गला के लिए उपयुक्त है; बहुवचन अनेक नगरों के संदर्भ में स्वाभाविक है।
- source_word: לְבַד
  choice: इनके अलावा
  rationale: यह गढ़वाले नगरों के अतिरिक्त दूसरे प्रकार की बस्तियों को जोड़ता है। ‘इनके अलावा’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: מֵעָרֵי הַפְּרָזִי
  choice: खुले देहात के नगर
  rationale: यह पद किलेबंदी से रहित खुले क्षेत्र की बस्तियों को गढ़वाले नगरों के विपरीत रखता है। मुख्य पाठ में स्रोत की ‘खुले क्षेत्र’ वाली छवि रखी गई है और वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: הַרְבֵּה מְאֹד
  choice: बहुत बड़ी संख्या में
  rationale: यह अत्यधिक बहुलता व्यक्त करता है। चुना हुआ वाक्यांश आधुनिक हिन्दी में उस बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל אֵלֶּה עָרִים
  choice: ये सभी ... नगर थे
  rationale: हिन्दी में आवश्यक योजक क्रिया जोड़कर इब्रानी के आरंभिक बल ‘ये सभी’ को सुरक्षित रखा गया है।
