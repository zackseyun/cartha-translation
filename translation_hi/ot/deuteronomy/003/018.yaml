base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/018.yaml
  text: And I commanded you at that time[a], saying, ‘Yahweh your God has given you this land to possess. You shall cross over armed before your brothers[c][b], the sons of Israel—all the men of valor.’
translation:
  language: hi
  text: 'और उस समय मैंने तुम्हें यह आज्ञा दी: “तुम्हारे परमेश्वर याहवे ने यह देश तुम्हें अधिकार में लेने के लिए दिया है। तुम सब वीर योद्धा[c] हथियारबंद होकर[b] अपने भाइयों—इस्राएल के पुत्रों[a]—के आगे पार जाओ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् “अपने साथी इस्राएलियों।” इब्रानी में शाब्दिक रूप से “अपने भाइयों, इस्राएल के पुत्रों” है।
    reason: lexical_alternative
  - marker: b
    text: या “युद्ध के लिए सुसज्जित होकर।”
    reason: lexical_alternative
  - marker: c
    text: “वीर योद्धा” से आशय युद्ध करने में समर्थ पुरुषों से है, केवल साहसी स्वभाव वाले लोगों से नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲצַו אֶתְכֶם
  choice: मैंने तुम्हें यह आज्ञा दी
  rationale: यह सीधा और स्वाभाविक हिन्दी रूप है तथा צוה की आदेश देने की शक्ति को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: נָתַן לָכֶם אֶת הָאָרֶץ הַזֹּאת לְרִשְׁתָּהּ
  choice: यह देश तुम्हें अधिकार में लेने के लिए दिया है
  rationale: पूर्ण क्रिया के वर्तमान-प्रासंगिक परिणाम और ירשׁ के भूमि पर अधिकार पाने/रखने के अर्थ दोनों को व्यक्त करता है।
- source_word: חֲלוּצִים
  choice: हथियार बाँधकर
  rationale: सैन्य अभियान के लिए सुसज्जित और तैयार होकर आगे बढ़ने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: לִפְנֵי אֲחֵיכֶם
  choice: अपने भाइयों ... के आगे
  rationale: לִפְנֵי का सैन्य-संचलन संबंधी अर्थ ‘आगे’ है; ‘भाइयों’ से मूल की संबंधपरक पुरुषवाची भाषा सुरक्षित रहती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल पद का औपचारिक रूप सुरक्षित रखा गया है; पादटिप्पणी उसके प्रसंगगत अर्थ को स्पष्ट करती है।
- source_word: כָּל בְּנֵי חָיִל
  choice: तुम सब वीर योद्धा
  rationale: यह पद युद्ध करने में समर्थ पुरुषों को सूचित करता है, केवल आंतरिक साहस रखने वालों को नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: אֲחֵיכֶם / בְּנֵי יִשְׂרָאֵל / בְּנֵי חָיִל की पुरुषवाची भाषा
  choice: अपने भाइयों—इस्राएल के पुत्रों—... सब वीर योद्धा
  alternative: अपने साथी इस्राएलियों ... सभी लड़ने योग्य लोगों
  rationale: यह सैन्य प्रसंग है और मूल में स्पष्ट पुरुषवाची पद हैं। मुख्य पाठ उन्हें बनाए रखता है, जबकि पादटिप्पणी संबंधपरक अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष आज्ञा के लिए ‘पार जाओ’ प्रयुक्त हुआ है। मुख्य पाठ में मूल इब्रानी की सैन्य और संबंधपरक शब्दावली सुरक्षित है, जबकि संभावित अर्थ-विकल्प पादटिप्पणियों में दिए गए हैं।
