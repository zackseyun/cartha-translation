  text: Only your wives[a], your little ones, and your livestock—I know that you have much livestock—shall remain in your towns that I have given you[b],
translation:
  language: hi
  text: तुम्हारी पत्नियाँ[a], तुम्हारे बाल-बच्चे और तुम्हारे मवेशी ही—मैं जानता हूँ कि तुम्हारे पास बहुत मवेशी हैं—तुम्हारे नगरों[b] में रहें जिन्हें मैंने तुम्हें दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बाल-बच्चे’ के स्थान पर ‘छोटे बच्चे’ या ‘आश्रित जन’ भी हो सकता है। इब्रानी शब्द छोटे बच्चों अथवा आश्रितों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘नगरों’ के स्थान पर ‘बस्तियाँ’ भी पढ़ा जा सकता है। इब्रानी शब्द विभिन्न आकार की बस्तियों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: केवल
  rationale: यह पिछले आदेश के अपवाद को स्पष्ट करता है और इब्रानी के प्रतिबंधात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נְשֵׁיכֶם
  choice: तुम्हारी पत्नियाँ
  rationale: इस घरेलू संदर्भ में शब्द का अभिप्राय सामान्यतः स्त्रियाँ नहीं, बल्कि योद्धाओं की पत्नियाँ है।
- source_word: טַפְּכֶם
  choice: तुम्हारे बाल-बच्चे
  rationale: यह छोटे बच्चों और परिवार के आश्रित नन्हे सदस्यों का बोध कराता है; ‘बाल-बच्चे’ आधुनिक हिन्दी में सहज और व्यापक है।
- source_word: מִקְנֵיכֶם / מִקְנֶה רַב
  choice: तुम्हारे मवेशी / बहुत मवेशी
  rationale: यह शब्द केवल गाय-बैलों तक सीमित नहीं, बल्कि पालतू पशुधन के लिए व्यापक पद है; पुनरावृत्ति इब्रानी पाठ के अनुरूप रखी गई है।
- source_word: יָדַעְתִּי כִּי
  choice: मैं जानता हूँ कि
  rationale: वक्ता के प्रत्यक्ष कथन और अपवाद के व्याख्यात्मक आधार को सरलता से सुरक्षित रखता है।
- source_word: יֵשְׁבוּ
  choice: रहें
  rationale: मूल क्रिया बैठने या बसने का अर्थ दे सकती है, पर यहाँ युद्ध के लिए जानेवालों के विपरीत पीछे रहने का प्रसंग है।
- source_word: בְּעָרֵיכֶם
  choice: तुम्हारे नगरों में
  rationale: עִיר विभिन्न आकार की बस्तियों को सूचित कर सकता है; ‘नगर’ गरिमापूर्ण और स्वाभाविक हिन्दी है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: जिन्हें मैंने तुम्हें दिया है
  rationale: पूर्ण हो चुके दान और उसके वर्तमान परिणाम—उन नगरों पर उनका अधिकार—दोनों को व्यक्त करता है।
