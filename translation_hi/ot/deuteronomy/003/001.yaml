  text: Then we turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet us, he and all his people, for battle at Edrei.
translation:
  language: hi
  text: तब हम मुड़े और बाशान के मार्ग से ऊपर गए।[a] तब बाशान का राजा ओग अपनी सारी प्रजा के साथ एद्रेई में युद्ध करने के लिए हमसे मिलने निकला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाशान की ओर जाने वाले मार्ग पर।” इब्रानी में शाब्दिक रूप से “बाशान का मार्ग” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: तब हम मुड़े
  rationale: पנה के मुड़ने के मूल अर्थ और कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַנַּעַל
  choice: ऊपर गए
  rationale: עלה की आरोहण अथवा ऊँचाई की ओर जाने की दिशात्मक बारीकी को बनाए रखता है।
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: बाशान के मार्ग से
  rationale: इब्रानी संबंध-रचना को अपेक्षाकृत निकटता से रखता है और मार्ग के बाशान की ओर अथवा उसके क्षेत्र से होकर जाने की संभावित अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: וַיֵּצֵא
  choice: निकला
  rationale: יצא का सीधा अर्थ देता है; सैन्य संदर्भ स्पष्ट होने पर भी 'चढ़ाई की' जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: बाशान का राजा ओग
  rationale: संबंध-रचना और व्यक्तिनाम को स्वाभाविक हिन्दी क्रम में प्रस्तुत करता है।
- source_word: לִקְרָאתֵנוּ
  choice: हमारा सामना करने
  rationale: मिलने के लिए आगे आने का भाव रखता है और युद्ध के संदर्भ में हिन्दी में स्वाभाविक है, जबकि शत्रुता का उद्देश्य अगली पदावली से स्पष्ट होता है।
- source_word: הוּא וְכָל־עַמּוֹ
  choice: अपनी सारी प्रजा के साथ
  rationale: עם के व्यापक अर्थ 'लोग/प्रजा' को बनाए रखता है और उसे अनावश्यक रूप से केवल सेना नहीं बनाता।
- source_word: לַמִּלְחָמָה
  choice: युद्ध करने के लिए
  rationale: इस विशिष्ट सैन्य मुठभेड़ में מלחמה का प्रयोजन स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶדְרֶעִי
  choice: एद्रेई में
  rationale: स्थाननाम का लिप्यंतरण करता है और बिना व्यक्त पूर्वसर्ग वाले इब्रानी स्थानवाचक प्रयोग को हिन्दी में स्थान के रूप में स्पष्ट करता है।
