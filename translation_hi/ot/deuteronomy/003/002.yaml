language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/002.yaml
  text: And Yahweh said to me, “Do not fear him, for I have given him, all his people, and his land into your hand; and you shall do to him just as you did to Sihon king of the Amorites, who lived in Heshbon.”
translation:
  language: hi
  text: तब यहोवा ने मुझसे कहा, “उससे मत डर, क्योंकि मैंने उसे, उसकी सारी प्रजा और उसके देश को तेरे हाथ में कर दिया है। तू उसके साथ वैसा ही करना जैसा तूने हेशबोन में रहनेवाले एमोरियों के राजा सीहोन के साथ किया था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित प्रतिलेखन द्वारा सुरक्षित रखा गया है।
- source_word: אַל תִּירָא אֹתוֹ
  choice: उससे मत डर
  rationale: नकारात्मक आज्ञा और उसके स्पष्ट कर्म को स्वाभाविक आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: בְיָדְךָ נָתַתִּי
  choice: मैंने ... तेरे हाथ में कर दिया है
  rationale: पूर्ण किए हुए दैवी सौंपे जाने का भाव और ‘हाथ’ की इब्रानी सत्ता-संबंधी छवि दोनों बनाए रखता है।
- source_word: כָּל עַמּוֹ
  choice: उसकी सारी प्रजा
  rationale: עַם को केवल सेना तक सीमित न करके राजा के अधीन समस्त जनसमुदाय के अर्थ में लिया गया है।
- source_word: וְעָשִׂיתָ לּוֹ
  choice: तू उसके साथ ... करना
  rationale: व्यापक क्रिया עשה को अनावश्यक रूप से अधिक विशिष्ट किए बिना हिन्दी में स्वाभाविक बनाया गया है; तुलना अगली उपवाक्य में उसका आशय स्पष्ट करती है।
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: हेशबोन में रहनेवाले
  rationale: निवास सूचित करने वाले कृदन्त का सहज आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में आए विशिष्ट ईश्वरीय नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। हिन्दी पाठकों में सुस्थापित ‘यहोवा’ रूप चुना गया, जबकि ‘याहवे’ स्रोत-उच्चारण के अधिक निकट वैकल्पिक प्रतिलेखन है।
- issue: युद्ध से पहले नָתַתִּי का पूर्ण पक्ष
  choice: कर दिया है
  alternative: कर दूँगा
  rationale: भविष्यकालीन प्रतिज्ञा बनाकर कालगत तनाव मिटाने के बजाय मूल के पूर्ण रूप को ऐसी संपन्न दैवी क्रिया के रूप में रखा गया है जिसका परिणाम वर्तमान है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूसा को एकवचन संबोधन के कारण ‘तेरे/तू’ रखा गया है। ‘देश’ אֶרֶץ के क्षेत्रीय अर्थ को व्यक्त करता है; वाक्य-विन्यास को हिन्दी प्रवाह के अनुसार व्यवस्थित किया गया है।
