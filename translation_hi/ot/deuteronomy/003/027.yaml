base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/027.yaml
  text: Go up to the top of Pisgah[a], and lift up your eyes westward and northward and southward and eastward, and see with your eyes[b]; for you shall not cross this Jordan.
translation:
  language: hi
  text: पिसगा की चोटी पर चढ़ जा और अपनी आँखें उठाकर पश्चिम, उत्तर, दक्षिण और पूर्व की ओर देख; अपनी आँखों से देख, क्योंकि तू इस यरदन[b] को पार नहीं करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या ‘इस यरदन नदी को।’ इब्रानी में केवल ‘इस यरदन’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: चढ़ जा
  rationale: עלה का एकवचन पुल्लिंग आज्ञार्थक रूप ऊँचाई की ओर जाने की सीधी आज्ञा देता है; ‘चढ़ जा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: पिसगा की चोटी
  rationale: רֹאשׁ यहाँ किसी पर्वतीय स्थान के शीर्ष को दर्शाता है और הַפִּסְגָּה भौगोलिक नाम पिसगा को; ‘चोटी’ सहज और सटीक है।
- source_word: וְשָׂא עֵינֶיךָ
  choice: अपनी आँखें उठाकर
  rationale: इब्रानी मुहावरे में दृष्टि को किसी दिशा में लगाने का भाव है; यह अनुवाद उसके साहित्यिक रूप और ‘आँखें’ की पुनरावृत्ति दोनों को बनाए रखता है।
- source_word: יָמָּה
  choice: पश्चिम
  rationale: शाब्दिक अर्थ ‘समुद्र की ओर’ है, पर इस्राएली भौगोलिक प्रयोग में यह पश्चिम दिशा का परंपरागत संकेत है।
- source_word: וְצָפֹנָה וְתֵימָנָה וּמִזְרָחָה
  choice: उत्तर, दक्षिण और पूर्व की ओर
  rationale: तीनों दिशासूचक रूपों को स्पष्ट, समानांतर और स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: अपनी आँखों से देख
  rationale: मूल में ‘आँखें’ की जानबूझकर की गई पुनरावृत्ति जोर देती है कि मूसा देश को स्वयं देखेगा; इसे संक्षिप्त नहीं किया गया।
- source_word: כִּי לֹא תַעֲבֹר
  choice: क्योंकि तू ... पार नहीं करेगा
  rationale: כִּי यहाँ पहले आदेश का कारण बताता है; עבר यरदन के संदर्भ में ‘पार करना’ है।
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: इस यरदन को
  rationale: הַזֶּה के निकट-संकेत को ‘इस’ से सुरक्षित रखा गया है; मूल में ‘नदी’ शब्द नहीं है।
theological_decisions:
- issue: मूसा का यरदन पार न करना
  choice: निश्चित भविष्यवचन ‘पार नहीं करेगा’
  alternative: आज्ञार्थक निषेध ‘पार मत करना’
  rationale: לֹא תַעֲבֹר यहाँ आज्ञा नहीं, मूसा के भविष्य के विषय में निश्चित कथन है; अनुवाद इस व्याकरणिक और कथात्मक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। परमेश्वर द्वारा मूसा को एकवचन संबोधन होने के कारण ‘तू’ और ‘जा/देख’ रखा गया है। दिशाओं की शृंखला तथा ‘आँखें’ की जोरदार पुनरावृत्ति को सुरक्षित रखा गया है।
