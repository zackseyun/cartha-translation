  text: So we stayed in the valley opposite Beth-peor[a].
translation:
  language: hi
  text: इस प्रकार हम बेत-पोर के सामने की घाटी में ठहरे रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֵּשֶׁב
  choice: इस प्रकार हम...ठहरे रहे
  rationale: ישׁב के वाव-क्रमागत अपूर्ण, प्रथम पुरुष बहुवचन रूप से बीते हुए कथात्मक कार्य का बोध होता है। संदर्भ में ‘ठहरे रहे’ किसी स्थान पर टिके रहने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘इस प्रकार’ वाव के प्रसंगगत परिणाम/कथात्मक संबंध को दर्शाता है।
- source_word: בַּגָּיְא
  choice: घाटी में
  rationale: גַּיְא घाटी, खड्ड या सँकरी घाटी का सूचक हो सकता है। ‘घाटी’ अर्थ को अनावश्यक रूप से सीमित किए बिना सामान्य और सहज भौगोलिक शब्द है।
- source_word: מוּל
  choice: के सामने
  rationale: מוּל किसी स्थान के सम्मुख या विपरीत दिशा में होने का स्थानिक संबंध बताता है। ‘के सामने’ आधुनिक हिन्दी में स्थान-नाम के साथ स्वाभाविक है और मूल की संभावित व्यापकता बनाए रखता है।
- source_word: בֵּית פְּעוֹר
  choice: बेत-पोर
  rationale: यह स्थान-नाम है, इसलिए इसका अर्थानुवाद न करके हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
