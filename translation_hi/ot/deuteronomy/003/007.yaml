base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/007.yaml
  text: But all the livestock and the spoil of the cities we took as plunder for ourselves[a].
translation:
  language: hi
  text: परन्तु सारे पशुधन और नगरों की लूट हमने अपने लिए ले ली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל
  choice: परन्तु सारे
  rationale: वाव पिछले पद में लोगों के विनाश के विपरीत बचाए गए पशुधन और माल की ओर संकेत करता है; इसलिए संदर्भ में हल्का विरोध दिखाने के लिए ‘परन्तु’ और כָּל की समग्रता के लिए ‘सारे’ उपयुक्त हैं।
- source_word: הַ/בְּהֵמָה
  choice: पशुधन
  rationale: यहाँ בְּהֵמָה नगरवासियों के पालतू पशुओं को दर्शाता है; ‘पशुधन’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: וּ/שְׁלַל הֶ/עָרִים
  choice: और नगरों की लूट को
  rationale: שָׁלָל युद्ध में छीना गया माल है और इसका הֶעָרִים के साथ संबंध सीधे ‘नगरों की लूट’ से व्यक्त होता है।
- source_word: בַּזּוֹנוּ
  choice: हमने ... लूट लिया
  rationale: בזז का अर्थ युद्ध में लूटना या लूट के रूप में लेना है; हिन्दी में यही क्रिया स्पष्ट और स्वाभाविक ढंग से सैन्य संदर्भ को व्यक्त करती है।
- source_word: לָֽ/נוּ
  choice: अपने लिए
  rationale: לָנוּ लाभार्थी को दर्शाता है; ‘अपने लिए’ बताता है कि इस्राएलियों ने वह माल अपने अधिकार में रखने के लिए लिया।
