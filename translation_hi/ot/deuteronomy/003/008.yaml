  text: וַ/נִּקַּ֞ח בָּ/עֵ֤ת הַ/הִוא֙ אֶת הָ/אָ֔רֶץ מִ/יַּ֗ד שְׁנֵי֙ מַלְכֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן מִ/נַּ֥חַל אַרְנֹ֖ן עַד הַ֥ר חֶרְמֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/008.yaml
  text: And at that time we took the land from the hand of the two kings of the Amorites who were beyond the Jordan[a], from the Wadi Arnon as far as Mount Hermon.
translation:
  language: hi
  text: उस समय हमने यरदन के पार के एमोरियों के दोनों राजाओं के हाथ से वह देश ले लिया—अर्नोन की घाटी[a] से लेकर हेर्मोन पर्वत तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अर्नोन की जलधारा’ अथवा ‘अर्नोन नदी’; इब्रानी शब्द נחל किसी बरसाती जलधारा, उसके तल या घाटी के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּקַּח
  choice: हमने ... ले लिया
  rationale: לקח का सामान्य अर्थ ‘लेना’ है; यहाँ यह भूभाग पर अधिकार करने का वर्णन करता है। ‘ले लिया’ स्वाभाविक है और क्रिया में अनावश्यक सैन्य रंग नहीं जोड़ता।
- source_word: בָּעֵת הַהִוא
  choice: उस समय
  rationale: यह मानक कालवाचक अभिव्यक्ति है; आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: הָאָרֶץ
  choice: वह देश
  rationale: यहाँ אֶרֶץ पृथ्वी नहीं, पहले से संदर्भित निश्चित भूभाग है। ‘वह देश’ हिन्दी में उस संदर्भ और निश्चितता को स्पष्ट करता है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: हिब्रू का शाब्दिक मुहावरा अधिकार या नियंत्रण से लेने का भाव देता है और हिन्दी में भी सुबोध है।
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: एमोरियों के दोनों राजाओं
  rationale: यह हिब्रू रचना को निकटता से व्यक्त करता है और दोनों विशिष्ट राजाओं का संकेत देता है।
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार रहनेवाले
  rationale: सम्बन्धवाचक पदबंध दोनों राजाओं का भौगोलिक परिचय देता है। ‘रहनेवाले’ हिन्दी में आवश्यक सम्बन्ध स्पष्ट करता है, बिना दिशा को अधिक विशिष्ट बनाए।
- source_word: מִנַּחַל אַרְנֹן
  choice: अर्नोन की घाटी से
  rationale: נחל घाटी, बरसाती जलधारा या नदी-तल को सूचित कर सकता है। मुख्य पाठ में ‘घाटी’ सामान्य पाठक के लिए सहज है; वैकल्पिक भौगोलिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: עַד הַר חֶרְמוֹן
  choice: हेर्मोन पर्वत तक
  rationale: עַד भूभाग की सीमा बताता है; ‘तक’ हिन्दी में इसे संक्षेप और स्पष्टता से व्यक्त करता है।
