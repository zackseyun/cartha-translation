source:
  edition: WLC
  text: אֲדֹנָ֣/י יְהוִ֗ה אַתָּ֤ה הַֽחִלּ֨וֹתָ֙ לְ/הַרְא֣וֹת אֶֽת עַבְדְּ/ךָ֔ אֶ֨ת גָּדְלְ/ךָ֔ וְ/אֶת יָדְ/ךָ֖ הַ/חֲזָקָ֑ה אֲשֶׁ֤ר מִי אֵל֙ בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֔רֶץ אֲשֶׁר יַעֲשֶׂ֥ה כְ/מַעֲשֶׂ֖י/ךָ וְ/כִ/גְבוּרֹתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/024.yaml
  text: O Lord Yahweh[a], you have begun to show your servant your greatness and your strong hand. For what god is there in heaven or on earth who can do deeds like your deeds and mighty acts like yours?
translation:
  language: hi
  text: “हे प्रभु यहोवा,[a] आपने अपने सेवक को अपनी महानता और अपना शक्तिशाली हाथ दिखाना आरम्भ किया है। क्योंकि स्वर्ग में अथवा पृथ्वी पर ऐसा कौन-सा देवता है, जो आपके कार्यों जैसे कार्य और आपके पराक्रमों जैसे पराक्रम कर सके?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘अदोनाय YHWH’; वैकल्पिक लिप्यंतरण: ‘हे प्रभु याहवे।’ ‘यहोवा’ हिन्दी बाइबलीय परम्परा में प्रचलित रूप है।'
    reason: दिव्य उपाधि और व्यक्तिगत नाम के मेल तथा नाम के वैकल्पिक लिप्यंतरण को स्पष्ट करना।
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: हे प्रभु यहोवा
  rationale: אֲדֹנָי को ‘प्रभु’ और दिव्य नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से अलग-अलग व्यक्त किया गया है; सम्बोधन ‘हे’ प्रार्थना के स्वाभाविक हिन्दी रूप को दर्शाता है।
- source_word: הַחִלּוֹתָ לְהַרְאוֹת
  choice: दिखाना आरम्भ किया है
  rationale: हिफ़ील रूपों का अर्थ ‘दिखाना शुरू करना’ है। पूर्ण क्रिया के वर्तमान तक प्रासंगिक परिणाम को हिन्दी पूर्णकाल ‘किया है’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַבְדְּךָ
  choice: अपने दास को
  rationale: ईश्वर से प्रार्थनापूर्ण अधीनता के इस प्रसंग में ‘दास’ वाचा-संबंधी सेवा और अधीनता दोनों को संक्षेप में व्यक्त करता है।
- source_word: גָּדְלְךָ
  choice: अपनी महानता
  rationale: यह मूल संज्ञा के ‘महानता’ अर्थ का सीधा और स्वाभाविक अनुवाद है।
- source_word: יָדְךָ הַחֲזָקָה
  choice: अपना बलवन्त हाथ
  rationale: हिब्रू के ठोस रूपक को बनाए रखते हुए חֲזָקָה की शक्ति-सूचक विशेषता व्यक्त की गई है।
- source_word: מִי אֵל
  choice: ऐसा कौन-सा देवता है
  rationale: यह तुलनात्मक आलंकारिक प्रश्न है; ‘देवता’ यहाँ किसी भी कथित दैवी प्रतिद्वन्द्वी को सूचित करता है, न कि उसकी वास्तविक समानता को स्वीकार करता है।
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: आकाश में या पृथ्वी पर
  rationale: मूल में संयोजक ‘और’ है, पर नकारात्मक आशय वाले आलंकारिक प्रश्न में हिन्दी ‘या’ समस्त संभावित क्षेत्र का स्वाभाविक बोध कराता है।
- source_word: יַעֲשֶׂה
  choice: कर सके
  rationale: अपूर्ण क्रिया इस आलंकारिक तुलना में क्षमता या सम्भावना का भाव रखती है, जिसे ‘सके’ स्पष्ट करता है।
- source_word: כְמַעֲשֶׂיךָ וְכִגְבוּרֹתֶיךָ
  choice: आपके कामों और आपके जैसे सामर्थ्य के काम
  rationale: दो समानान्तर पदों—सामान्य ‘काम’ और शक्ति के विशेष प्रदर्शनों—का भेद बनाए रखने के लिए दूसरे को ‘सामर्थ्य के काम’ कहा गया है।
theological_decisions:
- issue: אֲדֹנָי יהוה में दिव्य नाम का अनुवाद
  choice: हे प्रभु यहोवा
  alternative: हे प्रभु याहवे; हे परमेश्वर प्रभु
  rationale: पाठ में उपाधि और व्यक्तिगत दिव्य नाम दोनों हैं। ‘प्रभु यहोवा’ दोनों को अलग रखता है और हिन्दी बाइबलीय प्रयोग में पहचाना जाता है; पादटिप्पणी ‘याहवे’ को मूल उच्चारण के निकट विकल्प के रूप में देती है।
- issue: ‘कौन-सा देवता’ वाले प्रश्न का धर्मवैज्ञानिक बल
  choice: आलंकारिक तुलना को यथावत रखा गया
  alternative: आपके समान कोई परमेश्वर नहीं है
  rationale: स्पष्ट निषेध अर्थ की व्याख्या तो करता, पर मूल के प्रश्नात्मक रूप और उसकी काव्यात्मक तीव्रता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनापूर्ण, गरिमामय शैली रखी गई है। ईश्वर के लिए आदरसूचक ‘आप’ का प्रयोग है। हिब्रू के ‘बलवन्त हाथ’ रूपक और आलंकारिक प्रश्न को सुरक्षित रखा गया है।
