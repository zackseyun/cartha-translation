  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘एमोरी’ एकवचन है, पर यहाँ वह पूरी जाति के लिए सामूहिक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידֹנִים
  choice: सीदोनी लोग
  rationale: यह सीदोन के लोगों के लिए प्रयुक्त बहुवचन जातिवाचक संज्ञा है। आधुनिक हिन्दी में समुदाय का अर्थ स्पष्ट करने के लिए ‘लोग’ जोड़ा गया है।
- source_word: יִקְרְאוּ
  choice: कहते हैं
  rationale: קרא के साथ ל यहाँ नाम देने या किसी नाम से पुकारने का भाव व्यक्त करता है; ‘कहते हैं’ इस वाक्य-विन्यास में स्वाभाविक हिन्दी है।
- source_word: לְחֶרְמוֹן
  choice: हेर्मोन
  rationale: यह स्थान का व्यक्तिवाचक नाम है। मूल इब्रानी में इस पद पर ‘पर्वत’ शब्द नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: שִׂרְיֹן
  choice: सिर्योन
  rationale: यह हेर्मोन के लिए सीदोनियों का नाम है; इसका अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
- source_word: וְהָאֱמֹרִי
  choice: और एमोरी लोग
  rationale: इब्रानी रूप व्याकरण की दृष्टि से एकवचन है, पर यहाँ जाति के लिए सामूहिक अर्थ में प्रयुक्त हुआ है और बहुवचन क्रिया के साथ आता है; इसलिए हिन्दी में ‘एमोरी लोग’ रखा गया है।
- source_word: יִקְרְאוּ לוֹ
  choice: उसे ... कहते हैं
  rationale: सर्वनाम का संकेत हेर्मोन की ओर है। यह अभिव्यक्ति नामकरण का अर्थ स्वाभाविक हिन्दी में देती है।
- source_word: שְׂנִיר
  choice: सनीर
  rationale: यह हेर्मोन के लिए एमोरियों का नाम है; इसे व्यक्तिवाचक नाम के रूप में लिप्यंतरित किया गया है।
