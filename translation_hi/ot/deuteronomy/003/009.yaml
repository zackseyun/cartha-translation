  text: सीदोनी लोग हेर्मोन[a] को सिर्योन कहते हैं, और एमोरी लोग[b] उसे सनीर कहते हैं—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हेर्मोन पर्वत’; यहाँ इब्रानी पाठ में केवल ‘हेर्मोन’ है।
