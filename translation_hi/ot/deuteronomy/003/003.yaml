source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֱלֹהֵ֜י/נוּ בְּ/יָדֵ֗/נוּ גַּ֛ם אֶת ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן וְ/אֶת כָּל עַמּ֑/וֹ וַ/נַּכֵּ֕/הוּ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/003.yaml
  text: So Yahweh our God also gave into our hand Og king of Bashan[a], and all his people, and we struck him down until he had no survivor left.
translation:
  language: hi
  text: हमारे परमेश्वर यहोवा ने बाशान के राजा ओग और उसकी सारी प्रजा को भी हमारे हाथ में कर दिया, और हमने उसे ऐसा मार गिराया कि उसके लिए कोई भी जीवित न बचा[क]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: 'या, अधिक शाब्दिक: “उसके लिए कोई जीवित शेष न रहा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַיִּתֵּן ... בְּיָדֵנוּ
  choice: हमारे हाथ में कर दिया
  rationale: यह स्वाभाविक हिन्दी में हिब्रू सैन्य मुहावरे और परमेश्वर द्वारा शत्रु को इस्राएल के अधिकार में देने का भाव सुरक्षित रखता है।
- source_word: גַּם
  choice: भी
  rationale: यह पिछले प्रसंग में सीहोन की पराजय के साथ ओग की पराजय को जोड़ने वाला योगात्मक अर्थ व्यक्त करता है।
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: बाशान के राजा ओग
  rationale: नाम, राजकीय पद और क्षेत्र का स्पष्ट तथा स्वाभाविक हिन्दी क्रम।
- source_word: כָּל עַמּוֹ
  choice: उसकी सारी प्रजा
  rationale: עַם का अर्थ ‘लोग/प्रजा’ है और यह ‘सेना’ से अधिक व्यापक है; राजा के संदर्भ में ‘प्रजा’ स्वाभाविक है।
- source_word: וַנַּכֵּהוּ
  choice: हमने उन्हें ... मार गिराया
  rationale: युद्ध के संदर्भ में נכה के हिंसक और निर्णायक अर्थ को व्यक्त करता है। हिन्दी में बहुवचन ‘उन्हें’ निकटवर्ती ओग और उसकी सारी प्रजा को सामूहिक रूप से संदर्भित करता है।
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: कि उसका कोई भी जीवित न बचा
  rationale: हिब्रू के परिणामसूचक वाक्यांश को सहज आधुनिक हिन्दी में व्यक्त करते हुए पूर्ण विनाश का कठोर भाव बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को ‘प्रभु’ जैसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में रखा गया है; हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है।
- issue: पराजय की व्यापकता
  choice: उसका कोई भी जीवित न बचा
  alternative: उसके लिए कोई जीवित शेष न रहा
  rationale: मूल पाठ के सर्वनाशकारी युद्ध-वर्णन को बिना नरम किए या अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े स्पष्ट हिन्दी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हमारे हाथ में कर दिया’ स्रोत के मुहावरे को हिन्दी में स्वाभाविक रूप से सुरक्षित रखता है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
