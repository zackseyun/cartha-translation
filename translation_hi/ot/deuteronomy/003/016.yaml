base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/016.yaml
  text: And to the Reubenites and to the Gadites I gave from Gilead as far as the Arnon Valley[a], the middle of the valley as a border, and as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: hi
  text: और रूबेनियों और गादियों को मैंने गिलाद से लेकर अर्नोन की घाटी[a] तक का क्षेत्र दिया—घाटी का मध्य भाग सीमा था—और यब्बोक की घाटी[b] तक, जो अम्मोनियों की सीमा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द נחל का अर्थ धारा, बरसाती नाला या उससे जुड़ी घाटी हो सकता है। यहाँ अगला वाक्यांश घाटी के मध्य भाग को सीमा बताता है, इसलिए ‘घाटी’ अनुवाद किया गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द נחל का अनुवाद ‘धारा’, ‘नाला’ या ‘घाटी’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרֻאוּבֵנִי
  choice: रूबेनियों को
  rationale: यह जातिवाचक रूप रूबेन के वंश अथवा गोत्र के लोगों को दर्शाता है; आधुनिक हिन्दी में ‘रूबेनियों’ संक्षिप्त और स्वाभाविक है।
- source_word: לַגָּדִי
  choice: गादियों को
  rationale: जातिवाचक रूप गाद के गोत्र के लोगों को दर्शाता है; ‘गादियों’ हिन्दी में सामूहिक आशय स्पष्ट करता है।
- source_word: נָתַתִּי
  choice: मैंने ... दिया
  rationale: साधारण क्रिया נתן का सीधा अर्थ ‘देना’ है; यह भूमि के आवंटन के प्रसंग में भी सहज है।
- source_word: מִן הַגִּלְעָד
  choice: गिलाद से
  rationale: यह दिए गए भूभाग के विस्तार का आरम्भ-बिंदु बताता है।
- source_word: עַד נַחַל אַרְנֹן
  choice: अर्नोन की घाटी तक
  rationale: נחל धारा, बरसाती नाला अथवा उससे जुड़ी घाटी हो सकता है; अगले वाक्यांश में उसके बीच को सीमा कहे जाने के कारण ‘घाटी’ उपयुक्त है।
- source_word: תּוֹךְ הַנַּחַל וּגְבֻל
  choice: घाटी के बीच को सीमा मानकर
  rationale: यह घाटी के मध्य को सीमा-रेखा के रूप में स्पष्ट करता है और खंडित इब्रानी संरचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַד יַבֹּק הַנַּחַל
  choice: यब्बोक की घाटी तक
  rationale: נחל के स्थलाकृतिक अर्थ को पहले प्रयोग के अनुरूप ‘घाटी’ रखा गया है।
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: जो अम्मोनियों की सीमा है
  rationale: शाब्दिक ‘अम्मोन के पुत्र’ एक जातीय संबंधसूचक अभिव्यक्ति है; आधुनिक हिन्दी में ‘अम्मोनियों’ उसका स्वाभाविक समतुल्य है।
