  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। सीमा-विवरण को स्पष्ट करने के लिए डैश का प्रयोग किया गया है, जबकि मूल पाठ की भौगोलिक अस्पष्टता को पादटिप्पणियों में सुरक्षित रखा गया है।
