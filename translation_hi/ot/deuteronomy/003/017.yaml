  text: also the Arabah[a], with the Jordan as its border, from Kinnereth as far as the Sea of the Arabah, the Salt Sea[b], below the slopes of Pisgah on the east.
translation:
  language: hi
  text: और अराबा भी, जिसकी सीमा यरदन थी—किन्नेरेत[a] से अराबा के सागर, अर्थात् खारे सागर[b], तक, पिसगा की ढलानों के नीचे, पूर्व की ओर तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘किन्नेरेथ’ भी लिखा जाता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् मृत सागर।
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: अराबा
  rationale: सीमा-विवरण में यह सामान्य ‘मैदान’ के बजाय यरदन भ्रंश-घाटी का भौगोलिक नाम है।
- source_word: הַיַּרְדֵּן
  choice: यरदन
  rationale: मानक भौगोलिक नाम रखा गया; नदी होना प्रसंग से स्पष्ट है।
- source_word: גְבֻל
  choice: जिसकी सीमा ... थी
  rationale: इब्रानी की संक्षिप्त सूची-वाक्यरचना में सीमा का संबंध आधुनिक हिन्दी में स्वाभाविक रूप से स्पष्ट किया गया है।
- source_word: מִכִּנֶּרֶת
  choice: किन्नेरेत से
  rationale: मूल में केवल स्थान-नाम है; झील या क्षेत्र को स्पष्ट करके अर्थ सीमित नहीं किया गया।
- source_word: יָם הָעֲרָבָה
  choice: अराबा का सागर
  rationale: अगले समानाधिकरण ‘खारा सागर’ से पहले इब्रानी भौगोलिक पदनाम को निकटता से सुरक्षित रखा गया है।
- source_word: יָם הַמֶּלַח
  choice: खारा सागर
  rationale: ‘मृत सागर’ आधुनिक परिचित नाम है, पर मूल अभिव्यक्ति का अर्थ ‘नमक/खारेपन का सागर’ है; प्राकृतिक हिन्दी में ‘खारा सागर’ चुना गया।
- source_word: תַּחַת
  choice: नीचे
  rationale: स्थलाकृतिक संबंध को बिना किसी अतिरिक्त दिशात्मक व्याख्या के व्यक्त करता है।
- source_word: אַשְׁדֹּת
  choice: ढलानों
  rationale: इस भौगोलिक प्रसंग में पर्वतीय ढलानों या उतराइयों का संकेत है।
- source_word: הַפִּסְגָּה
  choice: पिसगा
  rationale: इसे भौगोलिक व्यक्तिवाचक नाम मानकर लिप्यंतरित किया गया है।
- source_word: מִזְרָחָה
  choice: पूर्व में
  rationale: दिशा-सूचक क्रियाविशेषण को सहज हिन्दी में रखा गया है, जबकि वाक्य में उसका स्थलाकृतिक संबंध सुरक्षित है।
