  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יֶ֨תֶר הַ/גִּלְעָ֤ד וְ/כָל הַ/בָּשָׁן֙ מַמְלֶ֣כֶת ע֔וֹג נָתַ֕תִּי לַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה כֹּ֣ל חֶ֤בֶל הָֽ/אַרְגֹּב֙ לְ/כָל הַ/בָּשָׁ֔ן הַ/ה֥וּא יִקָּרֵ֖א אֶ֥רֶץ רְפָאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/013.yaml
  text: And the rest of Gilead[a], and all Bashan, the kingdom of Og, I gave to the half-tribe of Manasseh—all the region of Argob, that is, all Bashan. That is called the land of the Rephaim.
translation:
  language: hi
  text: 'और गिलाद का बचा हुआ भाग तथा सारा बाशान—ओग का राज्य—मैंने मनश्शे के आधे गोत्र को दे दिया: अर्गोब का सारा प्रदेश, अर्थात् सारा बाशान। वह रफाइयों[a] का देश कहलाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या पारंपरिक रूप से, “विशालकाय लोगों का देश।” “रफाई” इस क्षेत्र से जुड़े एक प्राचीन जनसमूह का इब्रानी नाम है।
    reason: रफाइयों के जातिनाम और उसके पारंपरिक व्याख्यात्मक अनुवाद—‘विशालकाय लोग’—दोनों को पाठक के सामने रखना।
lexical_decisions:
- source_word: יֶתֶר הַגִּלְעָד
  choice: गिलाद का बचा हुआ भाग
  rationale: यह पहले दिए गए हिस्से के बाद शेष गिलाद को दर्शाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כָל הַבָּשָׁן מַמְלֶכֶת עוֹג
  choice: ओग का राज्य, सारा बाशान
  rationale: मूल के समानाधिकरण संबंध को बनाए रखते हुए स्पष्ट करता है कि सारा बाशान ओग का राज्य था।
- source_word: נָתַתִּי
  choice: मैंने ... दे दिया
  rationale: भूमि के बँटवारे के संदर्भ में सामान्य अर्थ को और प्रथम पुरुष कथन को सुरक्षित रखता है।
- source_word: לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र को
  rationale: इस्राएली गोत्र के उस आधे भाग का स्पष्ट और प्रचलित हिन्दी निरूपण है जिसे यरदन के पूर्व भूमि मिली थी।
- source_word: כֹּל חֶבֶל הָאַרְגֹּב
  choice: अर्गोब का पूरा इलाका
  rationale: חֶבֶל यहाँ रस्सी नहीं, एक भूभाग या जिला है; ‘इलाका’ साधारण पाठक के लिए सहज है।
- source_word: לְכָל הַבָּשָׁן
  choice: अर्थात सारा बाशान
  rationale: इसे पूर्ववर्ती अर्गोब क्षेत्र की व्याख्यात्मक पुनर्पहचान के रूप में प्रस्तुत किया गया है; मूल संबंध में कुछ व्याकरणिक संक्षिप्तता बनी हुई है।
- source_word: יִקָּרֵא
  choice: कहलाता है
  rationale: निफ़अल अपूर्ण रूप यहाँ प्रचलित भौगोलिक नाम को व्यक्त कर सकता है; वर्तमानकालीन हिन्दी इस नामकरण को सीधे दर्शाती है।
- source_word: אֶרֶץ רְפָאִים
  choice: रफाइयों का देश
  rationale: רְפָאִים को व्याख्यात्मक रूप से ‘दैत्य’ बनाने के बजाय प्राचीन जनसमूह के नाम के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: רְפָאִים को जनसमूह के नाम के रूप में रखना या ‘दैत्य/विशालकाय लोग’ अनुवाद करना
  choice: रफाइयों का देश
  alternative: विशालकाय लोगों का देश
  rationale: इस पद में यह शब्द जातीय अथवा क्षेत्रीय नाम की तरह प्रयुक्त है। लिप्यंतरण मूल की पारदर्शिता और संभावित अर्थगत तनाव को बनाए रखता है; पारंपरिक व्याख्या पादटिप्पणी में दी गई है।
- issue: יִקָּרֵא का कालगत निरूपण
  choice: कहलाता है
  alternative: कहलाता था
  rationale: हिब्रू अपूर्ण निष्क्रिय रूप किसी प्रचलित नाम को सूचित कर सकता है। ‘कहलाता है’ मूल रूप को सीधे दर्शाता है, यद्यपि कथात्मक भूतकाल भी संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। स्थानों और जातिनामों का हिन्दी बाइबिलीय रूप अपनाया गया है। पादटिप्पणी चिह्न उसी शब्द के बाद रखा गया है जिसकी वैकल्पिक व्याख्या दी गई है।
