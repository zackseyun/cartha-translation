base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/006.yaml
  text: And we devoted them to destruction[a], just as we had done to Sihon king of Heshbon, utterly destroying every city—men, women, and little ones.
translation:
  language: hi
  text: और हमने उन्हें विनाश के लिए समर्पित कर दिया[a], जैसा हमने हेशबोन के राजा सीहोन के साथ किया था; हमने हर नगर के पुरुषों, स्त्रियों और छोटे बच्चों को पूरी तरह नष्ट कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमने उन्हें पूर्ण विनाश के अधीन कर दिया”; इब्रानी क्रिया חרם किसी व्यक्ति या वस्तु को विनाश के लिए समर्पित करने का तकनीकी शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּחֲרֵם
  choice: हमने उन्हें विनाश के लिए अर्पित कर दिया
  rationale: हिफ़ील रूप में חרם किसी व्यक्ति या वस्तु को विनाश के लिए समर्पित करने का तकनीकी भाव रखता है। यह अनुवाद केवल ‘नष्ट कर दिया’ की अपेक्षा उस विशेष अर्थ को अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: כַּאֲשֶׁר עָשִׂינוּ לְסִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: जैसा हमने हेशबोन के राजा सीहोन के साथ किया था
  rationale: यह तुलना पहले हो चुकी कार्रवाई की ओर संकेत करती है। לְ के संबंध को स्वाभाविक हिन्दी में ‘के साथ’ से व्यक्त किया गया है।
- source_word: הַחֲרֵם
  choice: पूरी तरह नष्ट कर दिया
  rationale: इन्फ़िनिटिव एब्सोल्यूट पूर्ववर्ती חרם की कार्रवाई को स्पष्ट और तीव्र करता है; हिन्दी में यह वाक्यांश उसके सम्पूर्णता-सूचक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל עִיר
  choice: हर नगर
  rationale: עיר का अर्थ नगर या शहर है; इस प्रसंग में ‘हर नगर’ सहज और मानक है।
- source_word: מְתִם
  choice: पुरुषों
  rationale: यहाँ यह संज्ञा स्त्रियों और छोटे बच्चों से अलग पुरुष व्यक्तियों को दर्शाती है; अतः इसे अलग पद के रूप में रखा गया है, ‘आबाद नगर’ जैसे विशेषण में नहीं बदला गया।
- source_word: הַנָּשִׁים
  choice: स्त्रियों
  rationale: मूल शब्द का सीधा और स्वाभाविक हिन्दी प्रतिरूप।
- source_word: וְהַטָּף
  choice: और छोटे बच्चों
  rationale: טף छोटे बच्चों या आश्रित बालकों को सूचित करता है। ‘छोटे बच्चे’ व्यापक ‘बच्चे’ की तुलना में आयु-संबंधी भाव को अधिक स्पष्ट रखता है।
theological_decisions:
- issue: युद्ध और न्याय के प्रसंग में חרם का अनुवाद
  choice: मुख्य उपवाक्य में ‘विनाश के लिए अर्पित कर दिया’ और उसके व्याख्यात्मक तीव्र रूप में ‘पूरी तरह नष्ट कर दिया’
  alternative: ‘उनका सर्वथा नाश कर दिया’ अथवा ‘उन्हें प्रतिबंध के अधीन कर दिया’
  rationale: मूल पाठ एक तकनीकी समर्पण-विनाश की धारणा और वास्तविक सम्पूर्ण विनाश—दोनों व्यक्त करता है। चुना हुआ रूप न तो इसकी कठोरता को नरम करता है और न तकनीकी अर्थ को साधारण विनाश में पूरी तरह विलीन करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक गद्य। ‘समेत’ से नगरों में उपस्थित तीनों वर्गों को स्पष्ट रूप से कार्रवाई के अंतर्गत रखा गया है; डैश मूल की सूची की तीव्रता बनाए रखता है।
