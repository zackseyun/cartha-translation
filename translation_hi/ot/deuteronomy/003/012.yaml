base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/012.yaml
  text: And we took possession of this land at that time[a], from Aroer, which is on the Valley of the Arnon, and half the hill country of Gilead with its cities[b]; I gave it to the Reubenites and the Gadites.
translation:
  language: hi
  text: उस समय हमने इस भूमि पर अधिकार कर लिया—अर्नोन की घाटी पर स्थित अरोएर से लेकर गिलाद के पहाड़ी प्रदेश के आधे भाग और उसके नगरों तक।[a][b] मैंने यह प्रदेश रूबेनियों और गादियों को दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अर्नोन की वाडी के पास स्थित अरोएर से।” इब्रानी शब्द נַחַל घाटी, खड्ड, या मौसमी जलधारा वाले नाले के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “गिलाद पर्वत के आधे भाग और उसके नगरों तक।” इब्रानी शब्द הַר किसी एक पर्वत या व्यापक पहाड़ी प्रदेश, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַשְׁנוּ
  choice: हमने ... पर अधिकार कर लिया
  rationale: विजय और भू-अधिग्रहण के इस संदर्भ में क्रिया सक्रिय रूप से किसी भूभाग को अपने अधिकार में लेने का भाव देती है; केवल ‘विरासत में पाया’ कहना उपयुक्त नहीं।
- source_word: הָאָרֶץ הַזֹּאת
  choice: इस देश
  rationale: यहाँ אֶרֶץ जीते हुए भूभाग को सूचित करता है। आधुनिक हिन्दी में ‘देश’ स्वाभाविक है और प्रसंग में राजनीतिक राष्ट्र के बजाय क्षेत्र का अर्थ स्पष्ट रहता है।
- source_word: בָּעֵת הַהִוא
  choice: उस समय
  rationale: इब्रानी कालवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מֵעֲרֹעֵר אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: अर्नोन की घाटी के किनारे बसे अरोएर से
  rationale: עַל स्थान-संबंध को व्यक्त करता है और נַחַל सूखी या मौसमी जलधारा वाली घाटी/खड्ड का सूचक हो सकता है। ‘किनारे बसे’ हिन्दी में नगर की भौगोलिक स्थिति सहज रूप से बताता है।
- source_word: וַחֲצִי הַר הַגִּלְעָד
  choice: गिलाद के पहाड़ी प्रदेश के आधे भाग
  rationale: क्षेत्र-विभाजन के संदर्भ में הַר संभवतः किसी एक पर्वत की अपेक्षा पर्वतीय भूभाग को दर्शाता है। ‘पहाड़ी प्रदेश’ इस क्षेत्रीय अर्थ को स्पष्ट रखता है।
- source_word: וְעָרָיו
  choice: और उसके नगरों
  rationale: सर्वनामिक प्रत्यय गिलाद के पहाड़ी प्रदेश की ओर संकेत करता है। सीमा-वर्णन में ‘उसके नगरों तक’ स्वाभाविक हिन्दी है।
- source_word: נָתַתִּי
  choice: मैंने यह प्रदेश ... दे दिया
  rationale: मूल पाठ के प्रथम पुरुष बहुवचन से प्रथम पुरुष एकवचन में परिवर्तन को सुरक्षित रखा गया है। स्पष्टता के लिए कर्म के रूप में ‘यह प्रदेश’ दोहराया गया है।
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: रूबेनियों और गादियों को
  rationale: एकवचन जातिवाचक रूप यहाँ सामूहिक रूप से दोनों गोत्र-समुदायों को दर्शाते हैं; हिन्दी बहुवचन यही अर्थ स्वाभाविक ढंग से देता है।
