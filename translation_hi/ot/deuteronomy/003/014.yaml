base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/014.yaml
  text: Jair son of Manasseh took all the region of Argob[a], as far as the border of the Geshurites and the Maacathites, and he called them, that is, Bashan, Havvoth-jair[b], to this day.
translation:
  language: hi
  text: मनश्शे के पुत्र याईर ने अरगोब का सारा क्षेत्र गशूरी और माकाती लोगों की सीमा तक ले लिया, और उसने उन्हें अपने नाम पर हव्वोत-याईर कहा[a][b]; आज तक उनका यही नाम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्य-विन्यास बहुत संक्षिप्त और कठिन है। अधिक शाब्दिक रूप में: “उसने उन्हें अपने नाम पर, बाशान—हव्वोत-याईर—कहा।” यहाँ “बाशान” का “हव्वोत-याईर” और बहुवचन “उन्हें” के साथ संबंध अलग-अलग प्रकार से समझा जाता है।'
    reason: alternative_reading
  - marker: b
    text: “हव्वोत-याईर” का सम्भावित अर्थ “याईर के गाँव” या “याईर की तम्बू-बस्तियाँ” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבֶל
  choice: क्षेत्र
  rationale: भौगोलिक प्रसंग में यह किसी निश्चित भूभाग या इलाके को दर्शाता है; ‘क्षेत्र’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: אַרְגֹּב
  choice: अरगोब
  rationale: स्थानवाचक नाम होने के कारण हिन्दी ध्वन्यात्मक रूप में लिप्यंतरित किया गया है।
- source_word: עַד גְּבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: गशूरी और माकाती लोगों की सीमा तक
  rationale: גְּבוּל का मूल अर्थ सीमा है और जातिवाचक रूपों को हिन्दी में समुदायों के रूप में व्यक्त करना स्वाभाविक है।
- source_word: לָקַח
  choice: अपने अधिकार में ले लिया
  rationale: भूमि के संदर्भ में केवल ‘ले लिया’ की अपेक्षा यह अभिव्यक्ति अधिग्रहण का आशय अधिक स्पष्ट करती है, बिना विजय का कोई अतिरिक्त विवरण जोड़े।
- source_word: וַיִּקְרָא אֹתָם
  choice: उसने ... उन स्थानों को ... कहा
  rationale: इब्रानी कर्म-प्रत्यय बहुवचन है। हिन्दी में अस्पष्ट ‘उन्हें’ के स्थान पर ‘उन स्थानों को’ कहकर बहुवचन सुरक्षित रखा गया है और भौगोलिक संदर्भ स्पष्ट किया गया है।
- source_word: עַל שְׁמוֹ
  choice: अपने नाम पर
  rationale: यह मुहावरा अपने नाम के आधार पर किसी का नाम रखने को दर्शाता है; हिन्दी में यही स्वाभाविक समतुल्य है।
- source_word: אֶת הַבָּשָׁן
  choice: बाशान के उन स्थानों को
  rationale: इब्रानी वाक्य-विन्यास संक्षिप्त और कठिन है। मुख्य पाठ में बाशान को उन बहुवचन स्थानों के भौगोलिक क्षेत्र के रूप में समझा गया है; दूसरी सम्भावना पादटिप्पणी में रखी गई है।
- source_word: חַוֺּת יָאִיר
  choice: हव्वोत-याईर
  rationale: यह स्थान-नाम के रूप में प्रयुक्त है, इसलिए मुख्य पाठ में लिप्यंतरण रखा गया है; इसके सम्भावित शाब्दिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक उनका यही नाम है
  rationale: यह कथावाचक के समय तक नाम के बने रहने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
