source:
  edition: WLC
  text: וְ/צַ֥ו אֶת יְהוֹשֻׁ֖עַ וְ/חַזְּקֵ֣/הוּ וְ/אַמְּצֵ֑/הוּ כִּי ה֣וּא יַעֲבֹ֗ר לִ/פְנֵי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/הוּא֙ יַנְחִ֣יל אוֹתָ֔/ם אֶת הָ/אָ֖רֶץ אֲשֶׁ֥ר תִּרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/028.yaml
  text: But commission Joshua[a], and strengthen him and encourage him, for he will cross over before this people[c][b], and he will cause them to inherit the land that you will see.
translation:
  language: hi
  text: परन्तु यहोशू को दायित्व सौंप[a], और उसे दृढ़ कर तथा उसका साहस बढ़ा[b], क्योंकि वही इस प्रजा के आगे पार जाएगा और वही उन्हें उस देश का अधिकारी बनाएगा[c] जिसे तू देखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोशू को आज्ञा दे” अथवा “यहोशू को निर्देश दे।” इब्रानी क्रिया औपचारिक रूप से नेतृत्व का दायित्व सौंपने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “उसे दृढ़ कर और उसे साहसी बना।”'
    reason: lexical_alternative
  - marker: c
    text: 'या “वही उन्हें वह देश विरासत में दिलाएगा।” इब्रानी क्रिया कारणार्थक है: यहोशू वह माध्यम होगा जिसके द्वारा प्रजा अपनी विरासत पाएगी।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַו
  choice: दायित्व सौंप
  rationale: पिएल आज्ञार्थक यहाँ यहोशू को औपचारिक रूप से नेतृत्व का भार सौंपने का भाव रखता है। यह अभिव्यक्ति साधारण आदेश से अधिक आधिकारिक नियुक्ति को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: יְהוֹשֻׁעַ
  choice: यहोशू
  rationale: हिन्दी बाइबलीय परम्परा में प्रचलित और पहचाना जाने वाला नाम-रूप।
- source_word: וְחַזְּקֵהוּ
  choice: उसे दृढ़ कर
  rationale: חזק के पिएल रूप का अर्थ दृढ़ अथवा बलवान करना है; ‘दृढ़ कर’ संक्षिप्त और स्वाभाविक है।
- source_word: וְאַמְּצֵהוּ
  choice: उसका साहस बढ़ा
  rationale: חזק के साथ प्रयुक्त אמץ दृढ़-साहसी बनाने का पूरक भाव देता है; यह हिन्दी में दोनों क्रियाओं का अंतर बनाए रखता है।
- source_word: כִּי הוּא יַעֲבֹר
  choice: क्योंकि वही ... पार जाएगा
  rationale: עבר यरदन पार करने के प्रसंग में ‘पार जाना’ है। ‘वही’ दोहराए गए הוּא के बलाघात को व्यक्त करता है।
- source_word: לִפְנֵי הָעָם הַזֶּה
  choice: इस प्रजा के आगे
  rationale: לִפְנֵי स्थानगत ‘आगे’ और नेतृत्व—दोनों का संकेत दे सकता है; अनुवाद इस अर्थ-विस्तार को खुला रखता है।
- source_word: וְהוּא יַנְחִיל אוֹתָם
  choice: वही उन्हें ... का अधिकारी बनाएगा
  rationale: 'נחל का हिफ़ील रूप कारणार्थक है: यहोशू के द्वारा लोग विरासतस्वरूप देश के अधिकारी होंगे। हिन्दी में ‘अधिकारी बनाएगा’ कारणार्थकता को स्वाभाविक ढंग से रखता है।'
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: व्यवस्थाविवरण के प्रसंग में इससे प्रतिज्ञात देश अभिप्रेत है; सम्बन्धवाचक उपवाक्य के साथ ‘उस देश’ स्वाभाविक हिन्दी है।
- source_word: אֲשֶׁר תִּרְאֶה
  choice: जिसे तू देखेगा
  rationale: अपूर्ण क्रिया यहाँ मूसा द्वारा आगे देश को देखे जाने की भविष्यकालीन घटना बताती है। एकवचन सम्बोधन ‘तू’ मूल व्याकरण को बनाए रखता है।
theological_decisions:
- issue: यहोशू की भूमिका और देश की विरासत
  choice: उन्हें उस देश का अधिकारी बनाएगा
  alternative: उन्हें वह देश विरासत में देगा
  rationale: कारणार्थक क्रिया यहोशू को वह माध्यम दिखाती है जिसके द्वारा प्रजा देश की अधिकारी होगी; यह न तो परमेश्वर के अंतिम दाता होने को नकारती है, न यहोशू की कार्यकारी भूमिका को मिटाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। ‘प्रजा’ सामूहिक הָעָם के लिए और ‘देश’ הָאָרֶץ के लिए चुना गया है। मूल के एकवचन सम्बोधन को ‘तू’ से बनाए रखा गया है; दो बार आए הוּא का बल ‘वही’ की पुनरावृत्ति से व्यक्त किया गया है।
