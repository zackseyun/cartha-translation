  yaml_path: translation/ot/deuteronomy/003/023.yaml
  text: And I pleaded with Yahweh at that time[a], saying,
translation:
  language: hi
  text: उस समय मैंने यहोवा[a] से विनती की और कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “YHWH”; परंपरागत हिन्दी रूप “यहोवा”; वैकल्पिक लिप्यंतरण “याहवे।”'
    reason: ईश्वरीय नाम के प्रचलित हिन्दी रूप और वैकल्पिक विद्वतापूर्ण लिप्यंतरण को स्पष्ट करना।
lexical_decisions:
- source_word: וָאֶתְחַנַּן
  choice: मैंने विनती की
  rationale: חנן के हित्पअेल रूप में कृपा या दया पाने के लिए गंभीर और नम्र अनुरोध का भाव है। ‘विनती की’ आधुनिक हिन्दी में स्वाभाविक है और अनुरोध की तीव्रता बनाए रखता है। वाव-संयुक्त क्रिया को कथात्मक भूतकाल में व्यक्त किया गया है।
- source_word: אֶל
  choice: से
  rationale: विनती करने की क्रिया के साथ आधुनिक हिन्दी में ‘से विनती करना’ स्वाभाविक प्रयोग है और निवेदन की दिशा यहोवा की ओर होने का अर्थ सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। हिन्दी बाइबलीय परंपरा में प्रचलित और सामान्य पाठकों के लिए पहचाना जाने वाला रूप ‘यहोवा’ चुना गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בָּעֵת הַהִוא
  choice: उस समय
  rationale: यह काल-सूचक पदबंध का स्वाभाविक हिन्दी रूप है और मूल की तरह समय को अधिक विशिष्ट किए बिना प्रसंग से जोड़ता है।
- source_word: לֵאמֹר
  choice: और कहा
  rationale: प्रत्यक्ष कथन आरम्भ कराने वाले इब्रानी सूत्र को हिन्दी की स्वाभाविक कथात्मक शैली में ‘और कहा’ से व्यक्त किया गया है; अगला पद उसी कथन को प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। हिन्दी में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को नाम के रूप में बनाए रखता है। सम्भावित उच्चारण ‘याहवे’ को पादटिप्पणी में देकर उच्चारण-संबंधी अनिश्चितता और वैकल्पिक परंपरा को पारदर्शी रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विनती की’ गंभीर प्रार्थना का भाव देता है, जबकि ‘और कहा’ अगले पद में आने वाले प्रत्यक्ष कथन से स्वाभाविक संबंध बनाता है।
