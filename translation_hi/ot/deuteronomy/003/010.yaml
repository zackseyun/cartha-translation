lexical_decisions:
- source_word: כֹּל עָרֵי הַמִּישֹׁר
  choice: समतल पठार के सभी नगर
  rationale: מִישׁוֹר यहाँ यरदन के पूर्व के समतल ऊँचे भूभाग को सूचित करता है। ‘समतल पठार’ इस स्थलाकृतिक अर्थ को साधारण ‘मैदान’ से अधिक स्पष्ट रखता है।
- source_word: וְכָל הַגִּלְעָד וְכָל הַבָּשָׁן
  choice: सारा गिलाद और सारा बाशान
  rationale: כֹּל का क्षेत्रवाचक नामों के साथ स्वाभाविक हिन्दी रूप ‘सारा’ है; स्थान-नामों का देवनागरी लिप्यंतरण किया गया है।
- source_word: עַד סַלְכָה וְאֶדְרֶעִי
  choice: सल्का और एद्रेई तक
  rationale: עַד भौगोलिक विस्तार की सीमा बताता है; हिन्दी में ‘तक’ संक्षिप्त और स्वाभाविक है।
- source_word: עָרֵי מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: अर्थात बाशान में ओग के राज्य के नगर
  rationale: इब्रानी पदबंध पूर्ववर्ती सूची का समानाधिकरण में स्पष्टीकरण करता है। ‘अर्थात’ इस संबंध को स्पष्ट करता है, जबकि בַּבָּשָׁן का स्थानवाचक अर्थ ‘बाशान में’ रखा गया है।
