base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/021.yaml
  text: And I commanded Joshua at that time[a], saying, ‘Your eyes have seen all that Yahweh your God did to these two kings; so Yahweh will do to all the kingdoms through which you are passing.’
translation:
  language: hi
  text: 'उस समय मैंने यहोशू को यह आज्ञा दी: “तुम्हारी आँखों ने वह सब देखा है जो तुम्हारे परमेश्वर याहवे ने इन दोनों राजाओं के साथ किया। याहवे उन सभी राज्यों के साथ भी ऐसा ही करेगा, जिनकी ओर तुम पार जा रहे हो[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में अधिक शाब्दिक रूप से, “जहाँ/उस ओर तुम पार जा रहे हो।” यहाँ ‘वहाँ/उस ओर’ गंतव्य सूचित करता है। भाव के अनुसार इसे “जिनमें प्रवेश करने के लिए तुम पार जा रहे हो” भी समझा जा सकता है।
    reason: गंतव्यवाची שָׁמָּה और עבר के संयोजन को हिन्दी में एक साथ शाब्दिक तथा सहज रूप से व्यक्त करना कठिन है।
lexical_decisions:
- source_word: וְאֶת יְהוֹשׁוּעַ צִוֵּיתִי
  choice: मैंने यहोशू को यह आज्ञा दी
  rationale: צוה अधिकारपूर्वक आदेश देने को दर्शाता है; ‘आज्ञा दी’ आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सीधा है।
- source_word: בָּעֵת הַהִוא
  choice: उस समय
  rationale: यह मानक कालवाचक पदबंध का सहज हिन्दी रूप है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष उद्धरण के द्वारा व्यक्त
  rationale: हिन्दी में ‘यह कहते हुए’ जोड़ना अनावश्यक रूप से बोझिल होता; द्विबिंदु और उद्धरण-चिह्न वही संवाद-आरंभ का कार्य करते हैं।
- source_word: עֵינֶיךָ הָרֹאֹת
  choice: तुम्हारी आँखों ने ... देखा है
  rationale: इससे हिब्रू की प्रत्यक्षदर्शी और बलाघाती अभिव्यक्ति बनी रहती है; केवल ‘तुमने देखा है’ कहने से उसका vivid बल घट जाता।
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה
  choice: वह सब ... जो ... किया
  rationale: यह समग्रता व्यक्त करने वाले उपवाक्य का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर याहवे
  rationale: याहवे वाचा-संबंधी व्यक्तिगत नाम को प्रत्यक्ष रूप से दर्शाता है; אֱלֹהֵיכֶם रूपतः बहुवचन प्रत्यय वाला है, पर यहाँ एक परमेश्वर का उल्लेख करता है। ‘तुम्हारे’ हिन्दी में संबोधित व्यक्ति और उसके समुदाय, दोनों से संबंध बनाए रख सकता है।
- source_word: לִשְׁנֵי הַמְּלָכִים הָאֵלֶּה
  choice: इन दोनों राजाओं के साथ
  rationale: ל प्रभावित लक्ष्य को सूचित करता है। हिन्दी में ‘के साथ किया’ निकट अर्थ रखता है और संदर्भ से विरोधी कार्रवाई स्पष्ट रहती है।
- source_word: כֵּן יַעֲשֶׂה יְהוָה
  choice: याहवे ... भी ऐसा ही करेगा
  rationale: כֵּן पहले किए गए कार्य और भविष्य में होने वाले कार्य के बीच समानता स्थापित करता है; ‘ऐसा ही’ उस तुलना को साफ रखता है।
- source_word: לְכָל הַמַּמְלָכוֹת
  choice: उन सभी राज्यों के साथ
  rationale: यह सभी आगामी राज्यों को प्रभावित लक्ष्य के रूप में प्रस्तुत करता है, बिना ‘विरुद्ध’ जोड़कर निहित शत्रुता को मूल से अधिक स्पष्ट किए।
- source_word: אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה
  choice: जिनकी ओर तुम पार जा रहे हो
  rationale: इसमें एकवचन संबोधन और עבר का ‘पार जाना’ भाव सुरक्षित है। ‘की ओर’ गंतव्यवाची שָׁמָּה को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम प्रत्यक्ष है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में रखता है; ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा है।
- issue: आगामी राज्यों के प्रति याहवे की कार्रवाई
  choice: ‘उनके साथ भी ऐसा ही करेगा’—तुलना को मूल की तरह संदर्भाधीन रखा गया
  alternative: ‘उनका भी नाश करेगा’ या ‘उनके विरुद्ध भी ऐसा करेगा’
  rationale: सन्दर्भ में सैन्य पराजय निहित है, लेकिन इस पद में क्रिया सामान्य ‘करना’ है। विशिष्ट परिणाम जोड़ना मूल की संक्षिप्तता और तनाव को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। प्रत्यक्षदर्शी बल के लिए ‘तुम्हारी आँखों ने’ सुरक्षित रखा गया है। उद्धरण-आरंभ में हिन्दी की स्वाभाविक शैली अपनाई गई है और अंतिम गंतव्यवाची पदबंध की कठिनाई पाद-टिप्पणी में बताई गई है।
