base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/004.yaml
  text: 'And we captured all his cities at that time; there was not a city that we did not take from them: sixty cities[a], all the region of Argob, the kingdom of Og in Bashan.'
translation:
  language: hi
  text: उस समय हमने उसके सभी नगरों पर अधिकार कर लिया। ऐसा एक भी नगर नहीं था जिसे हमने उनसे[a] न लिया हो—कुल साठ नगर, अरगोब का पूरा क्षेत्र, जो बाशान में ओग का राज्य था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ‘उनसे’ बहुवचन है; संभवतः इसका संकेत ओग की प्रजा या उसकी सेना की ओर है, केवल ओग की ओर नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: हमने … पर अधिकार कर लिया
  rationale: לכד युद्ध में किसी स्थान को जीतकर अपने अधिकार में लेने को दर्शाता है; यह हिंदी प्रयोग सैन्य संदर्भ को स्पष्ट और स्वाभाविक रखता है।
- source_word: כָּל עָרָיו
  choice: उसके सभी नगरों
  rationale: עיר का अर्थ नगर या शहर हो सकता है; यहाँ ‘नगर’ सहज है और एकवचन प्रत्यय ओग की ओर संकेत करता है।
- source_word: בָּעֵת הַהִוא
  choice: उस समय
  rationale: यह सामान्य कालवाचक पदबंध का संक्षिप्त और स्वाभाविक आधुनिक हिंदी रूप है।
- source_word: לֹא הָיְתָה קִרְיָה אֲשֶׁר לֹא לָקַחְנוּ מֵאִתָּם
  choice: ऐसा एक भी नगर नहीं था जिसे हमने उनसे न लिया हो
  rationale: यह इब्रानी की बलपूर्ण नकारात्मक सापेक्ष संरचना को स्पष्ट हिंदी में बनाए रखता है।
- source_word: מֵאִתָּם
  choice: उनसे
  rationale: इब्रानी प्रत्यय बहुवचन है; इसलिए इसे एकवचन ‘उससे’ बनाकर अर्थ को सहज नहीं किया गया।
- source_word: שִׁשִּׁים עִיר
  choice: कुल साठ नगर
  rationale: संख्या और संज्ञा का सीधा अनुवाद है; ‘कुल’ पूर्ववर्ती समग्र दावे से संबंध को हिंदी में स्वाभाविक बनाता है।
- source_word: כָּל חֶבֶל אַרְגֹּב
  choice: अरगोब का पूरा क्षेत्र
  rationale: חבל यहाँ भूभाग या प्रशासनिक क्षेत्र के अर्थ में है; ‘क्षेत्र’ वर्तमान हिंदी में स्पष्ट है।
- source_word: מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: जो बाशान में ओग का राज्य था
  rationale: यह पद अरगोब के पूरे क्षेत्र को बाशान स्थित ओग के राज्य के रूप में पहचानता है; संबंध को हिंदी में स्पष्ट करने के लिए सापेक्ष उपवाक्य रखा गया है।
