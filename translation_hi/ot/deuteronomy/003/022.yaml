  text: לֹ֖א תְִּירָא֑וּ/ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/022.yaml
  text: Do not fear them[a], for Yahweh your God is the one who fights for you.
translation:
  language: hi
  text: तुम उनसे मत डरो[a], क्योंकि तुम्हारा परमेश्वर याहवे स्वयं तुम्हारे लिए लड़ता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम उनसे भयभीत मत हो।”
    reason: ‘डरना’ और ‘भयभीत होना’ दोनों ירא के अर्थ को व्यक्त करते हैं; मुख्य पाठ में अधिक सहज बोलचाल की अभिव्यक्ति रखी गई है।
lexical_decisions:
- source_word: לֹא תִּירָאוּם
  choice: तुम उनसे मत डरो
  rationale: निषेध के साथ द्वितीय पुरुष बहुवचन और तृतीय पुरुष बहुवचन कर्म-प्रत्यय को स्वाभाविक आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह निषेध का कारण प्रस्तुत करता है; ‘क्योंकि’ इस कारणसूचक संबंध को सहज रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम YHWH को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: इस संदर्भ में אֱלֹהִים इस्राएल के एकमात्र परमेश्वर को सूचित करता है और प्रत्यय संबोधित समुदाय के बहुवचन को दर्शाता है।
- source_word: הוּא
  choice: स्वयं
  rationale: स्वतंत्र सर्वनाम के बलाघात को स्वाभाविक हिन्दी में ‘स्वयं’ द्वारा व्यक्त किया गया है।
- source_word: הַנִּלְחָם לָכֶם
  choice: तुम्हारे लिए लड़ता है
  rationale: कृदंत निरंतर या विशिष्ट रूप से किए जाने वाले कार्य का आश्वासन देता है, और לָכֶם उनके पक्ष अथवा हित में लड़ने को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: הוּא का बलाघात
  choice: स्वयं
  alternative: वही है जो
  rationale: दोनों रचनाएँ इस बात पर बल देती हैं कि लड़ने वाला परमेश्वर ही है; ‘स्वयं’ हिन्दी में संक्षिप्त, स्पष्ट और स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। बहुवचन संबोधन ‘तुम’ से स्पष्ट किया गया है और मूल के बलाघात को ‘स्वयं’ द्वारा सुरक्षित रखा गया है।
