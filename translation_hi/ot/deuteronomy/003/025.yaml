  yaml_path: translation/ot/deuteronomy/003/025.yaml
  text: Please let me cross over and see the good land that is beyond the Jordan[a], this good hill country and Lebanon.
translation:
  language: hi
  text: कृपा करके मुझे पार जाने दे और यरदन के पार उस अच्छे देश को—इस अच्छे पहाड़ी प्रदेश[a] और लबानोन को—देखने दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस अच्छे पहाड़।” इब्रानी शब्द किसी एक पहाड़ या यरदन के पश्चिम के पहाड़ी प्रदेश, दोनों में से किसी को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה נָּא
  choice: कृपा करके मुझे उस पार जाने दे
  rationale: कोहोर्टेटिव क्रिया विनती और इच्छा व्यक्त करती है, जबकि נָּא अनुरोध को नम्र बनाता है। यह हिंदी प्रयोग उस विनतीपूर्ण भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאֶרְאֶה
  choice: और ... देखने दे
  rationale: दूसरा कोहोर्टेटिव पार जाने के साथ जुड़ी हुई इच्छा और उद्देश्य को व्यक्त करता है; हिंदी में ‘देखने दे’ समान विनतीपूर्ण बल बनाए रखता है।
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: उस अच्छे देश
  rationale: व्यवस्थाविवरण के भूक्षेत्रीय संदर्भ में אֶרֶץ के लिए ‘देश’ स्वाभाविक है और प्रतिज्ञात भूभाग की धारणा को बनाए रखता है।
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार के
  rationale: यह वक्ता के वर्तमान स्थान से नदी के दूसरी ओर स्थित भूभाग को सूचित करता है। ‘के पार’ संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: הָהָר הַטּוֹב הַזֶּה
  choice: इस अच्छे पहाड़ी प्रदेश
  rationale: הָר एक पहाड़ या सामूहिक अर्थ में पर्वतीय भूभाग, दोनों को सूचित कर सकता है। संदर्भ में क्षेत्रीय अर्थ अधिक संभावित है, पर वैकल्पिक एकवचन अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְהַלְּבָנוֹן
  choice: और लबानोन
  rationale: स्थान-नाम को हिंदी लिप्यंतरण में रखा गया है; यह उस उत्तरी पर्वतीय क्षेत्र को सूचित करता है जिसे मूसा देखना चाहता था।
theological_decisions:
- issue: הָהָר का भौगोलिक अर्थ—एक पहाड़ या पहाड़ी प्रदेश
  choice: मुख्य पाठ में ‘इस अच्छे पहाड़ी प्रदेश’
  alternative: ‘इस अच्छे पहाड़’
  rationale: इब्रानी एकवचन सामूहिक रूप से पर्वतीय प्रदेश का बोध करा सकता है। देश के वर्णन और लबानोन के साथ इसके संबंध को देखते हुए क्षेत्रीय अर्थ अधिक संभावित है, किंतु पाठ किसी एक पहाड़ की संभावना को पूरी तरह समाप्त नहीं करता; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कृपा करके’ विनती का भाव देता है, और संबोधन के एकवचन को ‘दे’ से बनाए रखा गया है। दीर्घ वाक्य में देश के स्पष्टीकरण को स्पष्ट करने के लिए डैश लगाए गए हैं।
