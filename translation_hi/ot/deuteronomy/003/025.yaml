    issue: Redundant spatial expression
    rationale: The wording ‘मुझे उस पार जाने दे और यरदन के पार...’ repeats essentially the same directional idea. The Hebrew first asks to cross over and then identifies the land as beyond the Jordan; Hindi can retain both clauses without repeating ‘उस पार.’
