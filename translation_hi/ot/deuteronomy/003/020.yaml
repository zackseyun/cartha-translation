  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔ם אֶת הָ/אָ֕רֶץ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֵי/כֶ֛ם נֹתֵ֥ן לָ/הֶ֖ם בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/שַׁבְתֶּ֗ם אִ֚ישׁ לִֽ/ירֻשָּׁת֔/וֹ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/020.yaml
  text: until Yahweh gives rest to your brothers as to you[a], and they also take possession of the land that Yahweh your God is giving them beyond the Jordan[c][b]. Then each of you may return to his possession that I have given you.
translation:
  language: hi
  text: जब तक याहवे तुम्हारे भाइयों को भी तुम्हारे समान विश्राम न दे[a] और वे भी उस देश पर अधिकार न कर लें जिसे याहवे, तुम्हारा परमेश्वर, उन्हें यरदन के उस पार[b] दे रहा है, तब तुममें से हर एक अपनी उस भूमि-संपत्ति[c] में लौट आना जो मैंने तुम्हें दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे साथी इस्राएलियों को भी तुम्हारे समान विश्राम न दे।” इब्रानी में शाब्दिक रूप से “तुम्हारे भाइयों” है।
    reason: lexical_alternative
  - marker: b
    text: या, “यरदन के पार।” यह पदबंध वक्ता के स्थान के सापेक्ष है; मूसा यरदन के पूर्व में था और यहाँ नदी के पश्चिम की भूमि की बात कर रहा था।
    reason: geographical_clarification
  - marker: c
    text: या, “अपनी उस विरासत में मिली भूमि।” इब्रानी शब्द उत्तराधिकार अथवा आवंटन में मिली संपत्ति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: विश्राम दे
  rationale: हिफ़ील रूप यहाँ सुरक्षा और स्थिरता का विश्राम प्रदान करने को व्यक्त करता है; ‘विश्राम दे’ व्यवस्थाविवरण की भूमि में सुरक्षित बसने की प्रमुख धारणा को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: לַאֲחֵיכֶם
  choice: तुम्हारे भाइयों को
  rationale: इब्रानी में पुल्लिंग संबंधवाचक संज्ञा है, जो यहाँ इस्राएल के साथी सदस्यों के लिए प्रतिनिधिक रूप से प्रयुक्त हुई है; व्यापक आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כָכֶם
  choice: तुम्हारे समान
  rationale: इब्रानी तुलना संक्षिप्त है; यह अनुवाद उसी समान विश्राम की तुलना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְיָרְשׁוּ
  choice: अधिकार कर लें
  rationale: ירשׁ भूमि-संदर्भ में उसे अपने अधिकार में लेने या उस पर कब्ज़ा स्थापित करने का अर्थ देता है; यह केवल निष्क्रिय उत्तराधिकार पाने से अधिक सक्रिय है।
- source_word: נֹתֵן
  choice: दे रहा है
  rationale: वर्तमान कृदंत परमेश्वर के दान को जारी और निश्चित कार्य के रूप में प्रस्तुत करता है।
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के उस पार
  rationale: यह स्थान-सापेक्ष पदबंध है और वक्ता के यरदन के पूर्व में होने की दृष्टि से पश्चिमी भूभाग को इंगित करता है।
- source_word: וְשַׁבְתֶּם
  choice: तब ... लौट आना
  rationale: संयोजक रूप पहले बताए गए दायित्व के पूरा होने के बाद अगला चरण बताता है; हिन्दी आज्ञार्थक शैली प्रसंग में मूसा के निर्देश को सहज रूप से आगे बढ़ाती है।
- source_word: אִישׁ
  choice: तुममें से हर एक
  rationale: शाब्दिक अर्थ ‘पुरुष’ है, पर यहाँ इसका मुख्य कार्य वितरणात्मक है; सम्बोधित योद्धाओं में से प्रत्येक का भाव स्पष्ट किया गया है।
- source_word: לִירֻשָּׁתוֹ
  choice: अपनी उस संपत्ति में
  rationale: יְרֻשָּׁה उत्तराधिकार में मिली अथवा आवंटित भूमि-संपत्ति को दर्शाता है; ‘संपत्ति’ ठोस भूमि-अधिकार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נָתַתִּי לָכֶם
  choice: जो मैंने तुम्हें दी है
  rationale: पूर्ण क्रिया मूसा द्वारा पहले किए गए भूमि-आवंटन को वर्तमान प्रासंगिकता के साथ व्यक्त करती है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: לַאֲחֵיכֶם में लिंग और सामुदायिक आशय
  choice: भाइयों
  alternative: साथी इस्राएलियों
  rationale: मुख्य पाठ इब्रानी के पुल्लिंग संबंधवाचक रूप को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि प्रसंग में यह व्यापक इस्राएली समुदाय के सदस्यों को सूचित करता है।
- issue: וְשַׁבְתֶּם का निर्देशात्मक अथवा अनुमतिमूलक बल
  choice: लौट आना
  alternative: लौट सकते हो
  rationale: इब्रानी रूप क्रमिक लौटने की क्रिया बताता है, पर व्याकरण स्वयं स्पष्ट रूप से अनुमति को चिह्नित नहीं करता; इसलिए मुख्य पाठ निर्देशात्मक क्रम को रखता है और अनुमतिमूलक अर्थ थोपता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। ‘देश पर अधिकार करना’, ‘विश्राम देना’ और ‘संपत्ति’ जैसे पद भूमि, सुरक्षा और आवंटन की मूल इब्रानी धारणाओं को सामान्य पाठक के लिए स्पष्ट रखते हैं।
