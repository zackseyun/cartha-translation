base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/011.yaml
  text: For only Og king of Bashan was left of the remnant of the Rephaim[a]. Look, his bed was a bed of iron. Is it not in Rabbah of the Ammonites? Its length was nine cubits and its width four cubits[b], by the cubit of a man.
translation:
  language: hi
  text: क्योंकि रपाईम के बचे हुए लोगों में से केवल बाशान का राजा ओग ही रह गया था। देखो, उसका पलंग लोहे का पलंग था। क्या वह अम्मोनियों के रब्बा में नहीं है? उसकी लंबाई नौ हाथ और चौड़ाई चार हाथ थी—मनुष्य के हाथ की माप के अनुसार[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, “साधारण हाथ की माप के अनुसार” अथवा “प्रचलित हाथ की माप के अनुसार।” इब्रानी का शाब्दिक अर्थ है, “मनुष्य के हाथ की माप के अनुसार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: केवल ... ही
  rationale: इब्रानी के एकमात्रता-सूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִשְׁאַר מִיֶּתֶר
  choice: बचे हुए लोगों में से ... रह गया था
  rationale: ओग के उस शेष समूह में अकेला रह जाने का भाव स्पष्ट और सहज हिन्दी में रखता है।
- source_word: הָרְפָאִים
  choice: रपाइयों
  rationale: इसे व्याख्यात्मक रूप से ‘दैत्य’ कहने के बजाय प्राचीन जनसमूह का नाम मानकर लिप्यंतरित किया गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: उल्लिखित वस्तु की ओर ध्यान खींचने वाले इब्रानी संकेत का आधुनिक और गरिमापूर्ण हिन्दी रूप।
- source_word: עַרְשׂוֹ ... עֶרֶשׂ
  choice: उसका पलंग ... पलंग था
  rationale: मूल की संज्ञा-पुनरावृत्ति को बनाए रखता है; प्रसंग में ‘पलंग’ सर्वाधिक स्वाभाविक अर्थ है।
- source_word: בַּרְזֶל
  choice: लोहा
  rationale: वस्तु की सामग्री का सीधा अर्थ; हिन्दी वाक्य में विशेषणीय रूप ‘लोहे का’ प्रयुक्त है।
- source_word: הֲלֹה הִוא
  choice: क्या वह ... नहीं है?
  rationale: ज्ञात वस्तु और स्थान की ओर संकेत करने वाले मूल आलंकारिक प्रश्न को सुरक्षित रखता है।
- source_word: בְּרַבַּת בְּנֵי עַמּוֹן
  choice: अम्मोनियों के रब्बा नगर में
  rationale: स्थान-नाम को सुरक्षित रखते हुए ‘अम्मोन के पुत्रों’ को स्वाभाविक जातिनाम ‘अम्मोनी’ से व्यक्त करता है; ‘नगर’ पाठक को रब्बा की पहचान समझने में मदद करता है।
- source_word: תֵּשַׁע אַמּוֹת ... וְאַרְבַּע אַמּוֹת
  choice: नौ हाथ ... चार हाथ
  rationale: प्राचीन माप को आधुनिक इकाई में अनुमानतः बदलने के बजाय हिन्दी में प्रचलित बाइबलीय माप ‘हाथ’ के रूप में सुरक्षित रखता है।
- source_word: בְּאַמַּת אִישׁ
  choice: मनुष्य के हाथ के अनुसार
  rationale: मूल अभिव्यक्ति को निकटता से रखता है और ‘साधारण हाथ’ वाली सम्भावित व्याख्या को पादटिप्पणी में देता है।
theological_decisions:
- issue: הָרְפָאִים को जनसमूह के नाम के रूप में रखा जाए या ‘दैत्य’ के रूप में अनूदित किया जाए
  choice: रपाइयों
  alternative: विशालकाय लोग; दैत्य
  rationale: मूल पद पुराने नियम में एक ज्ञात जनसमूह अथवा श्रेणी का नाम है। प्रसंग असाधारण कद का संकेत देता है, पर मुख्य पाठ में ‘दैत्य’ रखने से व्याख्या अनुवाद में समा जाती; इसलिए नाम सुरक्षित रखा गया है।
- issue: עֶרֶשׂ का अर्थ पलंग है या शव-शय्या/ताबूत
  choice: पलंग
  alternative: शय्या; शव-शय्या; ताबूत
  rationale: यहाँ दिए गए आयाम ओग के असाधारण आकार के प्रमाण के रूप में सबसे सहज रूप से पलंग से सम्बद्ध हैं। मूल शब्द के अधिक विशिष्ट अंत्येष्टि-संबंधी अर्थ की माँग प्रसंग नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘केवल ... ही’ से मूल का बल, ‘देखो’ से ध्यानाकर्षण, और आलंकारिक प्रश्न ज्यों का त्यों रखा गया है। प्राचीन माप के लिए ‘हाथ’ रखा गया है; अनुमानित मीटरी परिवर्तन नहीं किया गया।
