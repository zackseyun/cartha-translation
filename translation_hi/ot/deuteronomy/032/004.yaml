source:
  edition: WLC
  text: הַ/צּוּר֙ תָּמִ֣ים פָּעֳל֔/וֹ כִּ֥י כָל דְּרָכָ֖י/ו מִשְׁפָּ֑ט אֵ֤ל אֱמוּנָה֙ וְ/אֵ֣ין עָ֔וֶל צַדִּ֥יק וְ/יָשָׁ֖ר הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/004.yaml
  text: The Rock—his work is perfect[a], for all his ways are justice. He is a God of faithfulness and without injustice[c][b], righteous and upright is he.
translation:
  language: hi
  text: वह चट्टान है—उसका कार्य निष्कलंक[a] है, क्योंकि उसके सभी मार्ग न्यायपूर्ण हैं। वह विश्वासयोग्य परमेश्वर है; उसमें कोई अन्याय नहीं[b]। वह धर्मी और सीधा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निष्कलंक’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘पूर्ण,’ ‘संपूर्ण,’ या ‘निर्दोष’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अन्याय’ के लिए प्रयुक्त इब्रानी शब्द नैतिक बुराई, कुटिलता या अधर्म का अर्थ भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצּוּר
  choice: चट्टान
  rationale: यह मूसा के गीत में परमेश्वर के लिए प्रयुक्त उपाधि-रूपक है। ‘चट्टान’ मूल बिंब और उसकी दृढ़ता-सुरक्षा की अर्थछाया बनाए रखता है।
- source_word: תָּמִים
  choice: सिद्ध
  rationale: यह परमेश्वर के काम की पूर्णता, अखंडता और निर्दोषता बताता है; काव्यात्मक और गरिमापूर्ण हिन्दी में ‘सिद्ध’ संक्षिप्त तथा स्वाभाविक है।
- source_word: פָּעֳלוֹ
  choice: उसका काम
  rationale: एकवचन संज्ञा परमेश्वर के समस्त कार्य को सामूहिक रूप में दर्शाती है; ‘काम’ नाममूलक रूप को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का आधार प्रस्तुत करता है और आधुनिक हिन्दी में स्पष्ट कारणसूचक संयोजक है।
- source_word: כָל־דְּרָכָיו
  choice: उसके सभी मार्ग
  rationale: यह परमेश्वर के आचरण और व्यवहार के लिए प्रयुक्त इब्रानी रूपक को सुरक्षित रखता है।
- source_word: מִשְׁפָּט
  choice: न्यायपूर्ण
  rationale: यहाँ विधेय के रूप में परमेश्वर के सभी मार्गों को न्याय के अनुरूप बताता है। हिन्दी में ‘मार्ग न्यायपूर्ण हैं’ स्वाभाविक है, जबकि संज्ञात्मक ‘न्याय हैं’ कम स्वाभाविक होता।
- source_word: אֵל אֱמוּנָה
  choice: विश्वासयोग्य परमेश्वर
  rationale: אֱמוּנָה यहाँ विश्वसनीयता और निष्ठा का गुण बताता है। विशेषणात्मक हिन्दी मूल के ‘निष्ठा के परमेश्वर’ की अपेक्षा अधिक सहज है।
- source_word: וְאֵין עָוֶל
  choice: उसमें कोई अन्याय नहीं
  rationale: यह परमेश्वर में नैतिक बुराई, टेढ़ेपन या अन्याय का निषेध करता है और इब्रानी अस्तित्ववाचक रचना का स्पष्ट हिन्दी रूप है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह परमेश्वर की नैतिक और न्यायसंगत धार्मिकता को व्यक्त करने वाला स्थापित हिन्दी शब्द है।
- source_word: וְיָשָׁר
  choice: सीधा
  rationale: मूल शब्द नैतिक सीधेपन और खराई का बिंब रखता है; ‘सीधा’ उस ठोस रूपक को बनाए रखता है।
- source_word: הוּא
  choice: वह ... है
  rationale: हिन्दी में कर्ता को अंतिम विशेषण-वाक्य में स्पष्ट रखते हुए स्वाभाविक वाक्य-विन्यास अपनाया गया है।
theological_decisions:
- issue: הַצּוּר में परमेश्वर की उपाधि और रूपक
  choice: ‘वह चट्टान है’
  alternative: ‘चट्टान’ अथवा ‘वह शिला है’
  rationale: निश्चित पद और प्रसंग इसे इस्राएल के परमेश्वर की रूपकात्मक उपाधि बनाते हैं। हिन्दी में बड़े अक्षरों से उपाधि चिह्नित नहीं की जा सकती, इसलिए ‘वह ... है’ से संदर्भ स्पष्ट किया गया है और रूपक भी सुरक्षित है।
- issue: אֱמוּנָה को परमेश्वर के गुण के रूप में समझना
  choice: ‘विश्वासयोग्य परमेश्वर’
  alternative: ‘निष्ठावान परमेश्वर’ या ‘सत्य का परमेश्वर’
  rationale: प्रसंग परमेश्वर की भरोसेमंदी और स्थिर निष्ठा पर बल देता है। ‘विश्वासयोग्य’ इस अर्थ को व्यक्त करता है, बिना इसे केवल तथ्यात्मक सत्य तक सीमित किए।
- issue: מִשְׁפָּט का विधेयार्थ
  choice: ‘उसके सभी मार्ग न्यायपूर्ण हैं’
  alternative: ‘उसके सभी मार्ग न्याय हैं’ या ‘उसके सभी मार्ग उचित निर्णय हैं’
  rationale: मूल शब्द में न्याय, न्यायिक निर्णय और विधिसंगत उचितता की अर्थ-सीमा है। मुख्य पाठ में प्राकृतिक हिन्दी चुनी गई है; विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक गद्य। ‘चट्टान’, ‘मार्ग’, ‘धर्मी’ और ‘सीधा’ मूल गीत के ठोस समानांतर बिंबों को बनाए रखते हैं; वाक्य-विन्यास साधारण पाठक के लिए स्पष्ट रखा गया है।
