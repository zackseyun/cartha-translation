  text: יִמְצָאֵ֨/הוּ֙ בְּ/אֶ֣רֶץ מִדְבָּ֔ר וּ/בְ/תֹ֖הוּ יְלֵ֣ל יְשִׁמֹ֑ן יְסֹֽבְבֶ֨/נְהוּ֙ יְב֣וֹנְנֵ֔/הוּ יִצְּרֶ֖/נְהוּ כְּ/אִישׁ֥וֹן עֵינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/010.yaml
  text: He found him in a desert land[a], and in the howling waste of the wilderness; he surrounded him, he cared for him[b], he guarded him like the pupil of his eye.
translation:
  language: hi
  text: उसने उसे मरुभूमि के देश में, और निर्जन प्रदेश के हाहाकार-भरे उजाड़ में पाया। उसने उसे चारों ओर से घेरा, उसकी सुधि ली[a], और अपनी आँख की पुतली के समान उसकी रक्षा की[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “उसे समझ प्रदान की” या “उस पर ध्यान दिया” भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: 'परंपरागत भावानुवाद: “अपनी आँख के तारे के समान।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְצָאֵהוּ
  choice: उसने उसे ... पाया
  rationale: מצא का सामान्य अर्थ ‘पाना’ है। काव्यात्मक अतीत-वर्णन में हिन्दी का पूर्ण भूतकाल स्वाभाविक है और एकवचन सामूहिक रूप को बनाए रखता है।
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: मरुभूमि में, उजाड़ देश में
  rationale: מִדְבָּר की निर्जनता और אֶרֶץ के ‘देश/भूमि’ भाव को स्वाभाविक हिन्दी काव्यात्मक विन्यास में व्यक्त किया गया है।
- source_word: וּבְתֹהוּ יְלֵל יְשִׁמֹן
  choice: जहाँ निर्जन वन में चीखती आवाज़ें गूँजती थीं
  rationale: कठिन और संक्षिप्त इब्रानी पदबंध में תֹהוּ की उजाड़ता, יְלֵל का चीखना/हाहाकार और יְשִׁמֹן का निर्जन वन-प्रदेश सम्मिलित हैं। हिन्दी में दृश्य और ध्वनि दोनों को स्पष्ट रखते हुए इसे स्वाभाविक बनाया गया है।
- source_word: יְסֹבְבֶנְהוּ
  choice: उसने उसे चारों ओर से सँभाला
  rationale: סבב का मूल चित्र चारों ओर घेरने का है; ‘चारों ओर से सँभाला’ उस ठोस चित्र के साथ प्रसंगगत रक्षात्मक देखभाल को सहज हिन्दी में व्यक्त करता है।
- source_word: יְבֹונְנֵהוּ
  choice: उसकी सुधि ली
  rationale: בין/בונן यहाँ समझने, ध्यान देने अथवा समझ प्रदान करने का अर्थ दे सकता है। ‘सुधि ली’ ध्यानपूर्ण परवाह को व्यक्त करता है और बौद्धिक अर्थ को अनिवार्य नहीं बनाता; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יִצְּרֶנְהוּ
  choice: उसकी रक्षा की
  rationale: נצר का अर्थ रक्षा करना, सुरक्षित रखना है; अगले नेत्र-संबंधी उपमान के साथ ‘रक्षा की’ स्पष्ट और स्वाभाविक है।
- source_word: כְּאִישׁוֹן עֵינוֹ
  choice: अपनी आँख की पुतली के समान
  rationale: אִישׁוֹן आँख की पुतली को सूचित करता है। यह हिन्दी में पारदर्शी है और इब्रानी के शारीरिक बिंब को बनाए रखता है।
theological_decisions:
- issue: पुल्लिंग एकवचन सर्वनामों का संदर्भ
  choice: इस्राएल/याकूब को सामूहिक एकवचन के रूप में ‘उसे/उसकी’ से व्यक्त किया गया है।
  alternative: बहुवचन ‘उन्हें/उनकी’, अथवा केवल व्यक्ति याकूब का संदर्भ
  rationale: व्यवस्थाविवरण 32 के व्यापक प्रसंग में लोग सामूहिक एकवचन में चित्रित हैं। स्रोत की व्याकरणिक और काव्यात्मक व्यक्ति-कल्पना को हिन्दी में बनाए रखा गया है।
- issue: יְבֹונְנֵהוּ का अर्थ
  choice: उसकी सुधि ली
  alternative: उसे समझ दी / उसे समझाया / उस पर ध्यान दिया
  rationale: क्रियाओं की इस शृंखला में ध्यानपूर्ण देखभाल का अर्थ उपयुक्त है, पर इब्रानी में समझ देने का अर्थ भी संभव है; अतः उसे पादटिप्पणी में रखा गया है और अस्पष्टता को पूर्णतः समाप्त नहीं किया गया।
- issue: יְסֹבְבֶנְהוּ में घेरने और संरक्षण का संबंध
  choice: चारों ओर से सँभाला
  alternative: उसे चारों ओर से घेर लिया
  rationale: शाब्दिक चित्र चारों ओर घेरने का है, पर हिन्दी में ‘घेर लिया’ शत्रुतापूर्ण लग सकता है। ‘चारों ओर से सँभाला’ प्रसंगगत संरक्षण को व्यक्त करते हुए परिधि के बिंब को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली। ‘मरुभूमि’, ‘निर्जन वन’ और ‘सुधि ली’ जैसे पद पद्य की ऊँचाई बनाए रखते हैं, जबकि वाक्य-विन्यास आधुनिक और स्पष्ट है। सभी एकवचन सर्वनाम स्रोत के सामूहिक एकवचन को बनाए रखते हैं।
