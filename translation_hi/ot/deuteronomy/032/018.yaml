  yaml_path: translation/ot/deuteronomy/032/018.yaml
  text: You neglected the Rock who fathered you[c][b][a], and forgot the God who gave you birth.
translation:
  language: hi
  text: 'उस चट्टान की, जिसने तुम्हें जन्म दिया, तुमने उपेक्षा की[a][b],

    और उस परमेश्वर को भूल गए जिसने तुम्हें जन्म दिया[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उस चट्टान की, जो तुम्हारा जनक है’; इब्रानी क्रिया में पिता होने या उत्पन्न करने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: ‘उपेक्षा की’ के लिए प्रयुक्त इब्रानी क्रिया कठिन है; इसका अनुवाद ‘भूल गए’ या ‘उसकी सुधि न रखी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘जो तुम्हें अस्तित्व में लाया’; इब्रानी में प्रसव और जन्म का बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּר
  choice: चट्टान
  rationale: यह शब्द शाब्दिक रूप से ‘चट्टान’ है और व्यवस्थाविवरण 32 में इस्राएल के परमेश्वर के लिए एक अर्थपूर्ण उपाधि है। हिंदी में इसे रूपक को स्पष्ट किए बिना उसी ठोस बिंब के साथ रखा गया है।
- source_word: יְלָדְךָ
  choice: तुम्हारे जनक
  rationale: काल धातु ילד यहाँ उत्पन्न करने या पिता बनने का भाव दे सकती है। ‘जनक’ पैतृक बिंब को संक्षिप्त और गरिमापूर्ण ढंग से सुरक्षित रखता है।
- source_word: תֶּשִׁי
  choice: तुमने उपेक्षा की
  rationale: यह क्रिया पाठ और अर्थ की दृष्टि से कठिन है। समानांतर ‘भूल गए’ के साथ ‘उपेक्षा की’ दोषपूर्ण अनदेखी का भाव व्यक्त करती है और दोनों काव्य-पंक्तियों को एक ही शब्द में नहीं मिला देती।
- source_word: וַתִּשְׁכַּח
  choice: और ... भूल गए
  rationale: क्रिया आरोप को आगे बढ़ाती है और इसका सामान्य अर्थ ‘भूलना’ है। हिंदी वाक्य-विन्यास के लिए कर्म को क्रिया से पहले रखा गया है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: संदर्भ में यह इस्राएल के परमेश्वर को सूचित करता है। आधुनिक हिंदी बाइबलीय प्रयोग में ‘परमेश्वर’ स्वाभाविक और स्पष्ट है।
- source_word: מְחֹלְלֶךָ
  choice: जिसने तुम्हें जन्म दिया
  rationale: חול की यह क्रियारूप-परंपरा प्रसव और जन्म देने का बिंब व्यक्त कर सकती है। यह अनुवाद उस मातृवत जन्म-बिंब को सरल आधुनिक हिंदी में बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के लिए पैतृक और मातृवत बिंब
  choice: मुख्य पाठ में ‘जनक’ और ‘जिसने तुम्हें जन्म दिया’ दोनों को रखा गया है।
  alternative: दोनों को सामान्य सृष्टि-भाषा, जैसे ‘जिसने तुम्हें बनाया’ या ‘रचा’, में बदलना।
  rationale: इब्रानी पाठ चट्टान को जन्मदाता/जनक कहने और परमेश्वर के लिए प्रसव-जन्म का बिंब रखने के बीच का तनाव बनाए रखता है। सामान्य सृष्टि-भाषा उस जानबूझकर रखे गए काव्यात्मक तनाव को कम कर देती।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और गरिमापूर्ण रखी गई है। डैशयुक्त समानाधिकरण ‘तुम्हारे जनक—उस चट्टान—’ मूल के संक्षिप्त रूपक और पैतृक बिंब दोनों को सुरक्षित रखता है; दूसरी पंक्ति का सहज क्रम इब्रानी समानांतरता को हिंदी में स्पष्ट बनाता है।
