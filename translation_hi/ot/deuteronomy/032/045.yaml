  text: जब मूसा सारे इस्राएल से ये सभी वचन कह चुका था,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַל
  choice: कह चुका
  rationale: כלה के वय्यिक्तोल रूप में कार्य की समाप्ति व्यक्त होती है। לְדַבֵּר के साथ मिलकर हिंदी का स्वाभाविक पूर्णतासूचक प्रयोग ‘कह चुका’ बनता है।
- source_word: לְדַבֵּר
  choice: कह
  rationale: כלה के साथ इसका अर्थ ‘बोलना समाप्त करना’ है। यहाँ ‘कह चुका’ आधुनिक हिंदी में सहज और अर्थ-संगत है।
- source_word: אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ये सभी वचन
  rationale: דברים यहाँ पहले कही गई वाणी को सूचित करता है। ‘वचन’ मूल के ‘शब्दों’ संबंधी औपचारिक भाव को बनाए रखता है और इस प्रसंग में dignified, प्रचलित हिंदी है।
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल से
  rationale: इब्रानी में इस्राएल सामूहिक वाचक संज्ञा है। ‘सारे इस्राएल’ उस वाचाई सामूहिक पद को ‘इस्राएलियों’ में विस्तार किए बिना सुरक्षित रखता है; ‘से’ हिंदी में संबोधित समुदाय के सामने कही गई बात को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिंदी बाइबल परंपरा और आधुनिक प्रचलन के अनुसार नाम का मानक रूप।
