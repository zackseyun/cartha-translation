  yaml_path: translation/ot/deuteronomy/032/028.yaml
  text: For they are a nation devoid of counsel, and there is no understanding in them.
translation:
  language: hi
  text: क्योंकि वे ऐसी जाति हैं जो युक्तियों से रहित है, और उनमें विवेक नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिंदी में ‘क्योंकि’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גּוֹי
  choice: जाति
  rationale: यह एक सामूहिक जनसमुदाय को सूचित करता है; व्यवस्थाविवरण के संदर्भ में ‘जाति’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אֹבַד עֵצוֹת
  choice: जिसमें समझ-बूझ की कोई सलाह नहीं
  rationale: हिब्रू पदबंध का भाव ऐसी जाति से है जो उचित परामर्श या विवेकपूर्ण योजना से वंचित है; यह अनुवाद उसके मुहावरेदार अर्थ को स्पष्ट हिंदी में रखता है।
- source_word: הֵמָּה
  choice: वे ऐसी जाति हैं
  rationale: स्वतंत्र सर्वनाम के बलाघात और नामवाचक वाक्य के विधेयात्मक भाव को हिंदी की स्वाभाविक संरचना में व्यक्त किया गया है।
- source_word: וְאֵין
  choice: और ... नहीं है
  rationale: अस्तित्वसूचक निषेध को हिंदी में सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּהֶם
  choice: उनमें
  rationale: यह उस जाति के भीतर किसी गुण के अभाव को दर्शाता है।
- source_word: תְּבוּנָה
  choice: विवेक
  rationale: यह केवल जानकारी नहीं, बल्कि समझने और सही भेद करने की क्षमता को सूचित करता है; ‘विवेक’ हिब्रू ज्ञान-साहित्य की शब्दावली के अनुरूप है।
