base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/040.yaml
  text: For I lift up my hand to heaven and say[a], ‘As I live forever,’
translation:
  language: hi
  text: क्योंकि मैं अपना हाथ आकाश की ओर उठाकर कहता हूँ[a], “मैं सदा जीवित हूँ,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “मैं अपना हाथ आकाश की ओर उठाता हूँ और कहता हूँ, ‘मैं सदा जीवित हूँ।’” हाथ उठाना यहाँ शपथ की मुद्रा है।'
    reason: शाब्दिक विकल्प और शपथ-सदृश मुहावरे का स्पष्टीकरण
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का गंभीर आधार प्रस्तुत करता है; यहाँ कारणसूचक अर्थ प्रसंग के अनुकूल है।
- source_word: אֶשָּׂא ... יָדִי
  choice: मैं अपना हाथ ... उठाकर
  rationale: हाथ उठाना शपथ की ठोस मुद्रा है; कृदंतयुक्त हिंदी वाक्य अगले कथन से इसे स्वाभाविक रूप से जोड़ता है।
- source_word: אֶל שָׁמַיִם
  choice: आकाश की ओर
  rationale: दिशा को स्पष्ट और स्वाभाविक आधुनिक हिंदी में व्यक्त करता है; שָׁמַיִם का प्रसंगानुकूल सामूहिक अर्थ 'आकाश' है।
- source_word: וְאָמַרְתִּי
  choice: कहता हूँ
  rationale: वाव + क़ातल यहाँ शपथ की भावी/निष्पादक क्रमवाचक क्रिया है; हिंदी वर्तमान काल प्रत्यक्ष और गंभीर कथन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חַי אָנֹכִי
  choice: मैं ... जीवित हूँ
  rationale: मूल के स्पष्ट कथन को बनाए रखता है; हाथ उठाने का प्रसंग इसके शपथ-सदृश बल को संकेतित करता है, बिना उसे मुख्य पाठ में अतिरिक्त शब्दों से खोलने के।
- source_word: לְעֹלָם
  choice: सदा
  rationale: अनंत और निरंतर अवधि को संक्षिप्त, प्रतिष्ठित और सामान्य आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की आत्म-शपथ के बल और मूल कथन के बीच संतुलन
  choice: मैं सदा जीवित हूँ
  alternative: जैसा कि मैं सदा जीवित हूँ / मेरे सदा जीवित रहने की शपथ
  rationale: इब्रानी पद का शाब्दिक रूप 'मैं सदा जीवित हूँ' है, जबकि उठे हुए हाथ का प्रसंग इसे शपथ का बल देता है। मुख्य पाठ मूल संरचना और संभावित द्विअर्थता बचाता है; पादटिप्पणी शपथ-सदृश अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण है। 'आकाश की ओर हाथ उठाना' मूल चित्र को सुरक्षित रखता है और पादटिप्पणी उसके शपथ-संबंधी बल को बताती है।
