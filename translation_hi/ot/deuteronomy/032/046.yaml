base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/046.yaml
  text: And he said to them[a], “Set your heart on all the words that I am testifying to you today, which you shall command your sons to keep[b], to do all the words of this law.”
translation:
  language: hi
  text: उसने उनसे कहा, “उन सभी वचनों पर अपना मन लगाओ, जिनकी गवाही मैं आज तुम्हारे बीच दे रहा हूँ,[a] ताकि तुम अपने पुत्रों को आज्ञा दो कि वे इस व्यवस्था के सभी वचनों का पालन करें और उन पर चलें।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं आज तुम्हें चेतावनी दे रहा हूँ,” अथवा “मैं आज तुम्हारे विरुद्ध साक्षी दे रहा हूँ।” इब्रानी क्रिया वाचा के संदर्भ में गवाही देने के साथ चेतावनी या न्यायिक साक्ष्य का भाव भी रख सकती है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “तुम्हारे पुत्रों”; यहाँ यह अगली पीढ़ी को अधिक व्यापक रूप से भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂימוּ לְבַבְכֶם
  choice: उन पर अपना मन लगाओ
  rationale: इब्रानी मुहावरे में हृदय ध्यान, इच्छा और दृढ़ संकल्प का केंद्र है। आधुनिक हिन्दी में ‘अपना मन लगाओ’ इस भाव को स्वाभाविक रूप से व्यक्त करता है, जबकि शाब्दिक ‘अपना हृदय रखो’ अस्वाभाविक होगा।
- source_word: הַדְּבָרִים / דִּבְרֵי
  choice: वचन / वचनों
  rationale: यहाँ דָּבָר मूसा द्वारा बोले गए वाचा-संबंधी निर्देशों को दर्शाता है। ‘वचन’ आरंभ और अंत में इब्रानी पुनरावृत्ति को बनाए रखता है।
- source_word: מֵעִיד בָּכֶם הַיּוֹם
  choice: जिनकी गवाही मैं आज तुम्हारे बीच दे रहा हूँ
  rationale: हिफ़िल क्रिया में गवाही देने, सचेत करने और न्यायिक रूप से साक्षी ठहराने के अर्थ समाहित हो सकते हैं। ‘गवाही ... तुम्हारे बीच’ सार्वजनिक सामुदायिक प्रसंग और בָּכֶם को दर्शाता है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: אֲשֶׁר תְּצַוֻּם
  choice: ताकि तुम ... आज्ञा दो
  rationale: 'संदर्भ में संबंधवाचक अव्यय और अपूर्ण क्रिया उद्देश्य का भाव देते हैं: इस्राएल को इन वचनों पर मन लगाना है ताकि अगली पीढ़ी को उनका पालन करने की आज्ञा दे।'
- source_word: בְּנֵיכֶם
  choice: अपने पुत्रों
  rationale: इब्रानी संज्ञा स्पष्ट रूप से पुल्लिंग बहुवचन ‘तुम्हारे पुत्र’ है। मुख्य पाठ स्रोत की लैंगिक अभिव्यक्ति को रखता है; व्यापक पीढ़ीगत अर्थ पादटिप्पणी में बताया गया है।
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: पालन करें और उन्हें पूरा करें
  rationale: दोनों क्रियार्थक रूप सावधानी से मानने और व्यवहार में करने पर बल देते हैं। हिन्दी में यह युग्म दोनों पहलुओं को स्पष्ट और स्वाभाविक रखता है।
- source_word: הַתּוֹרָה הַזֹּאת
  choice: इस व्यवस्था
  rationale: תּוֹרָה का व्यापक अर्थ ‘शिक्षा’ हो सकता है, पर व्यवस्थाविवरण के वाचा-संदर्भ में ‘व्यवस्था’ स्थापित और उपयुक्त हिन्दी पद है।
theological_decisions:
- issue: מֵעִיד בָּכֶם में गवाही, चेतावनी और न्यायिक बल
  choice: गवाही मैं आज तुम्हारे बीच दे रहा हूँ
  alternative: मैं आज तुम्हें चेतावनी दे रहा हूँ; मैं आज तुम्हारे विरुद्ध साक्षी ठहरा रहा हूँ
  rationale: मुख्य पाठ औपचारिक गवाही और सामुदायिक परिवेश को रखता है, पर क्रिया के चेतावनीपूर्ण तथा न्यायिक बल को निर्णायक रूप से समाप्त नहीं करता; वे पादटिप्पणी में दिए गए हैं।
- issue: בְּנֵיכֶם का लैंगिक और पीढ़ीगत संदर्भ
  choice: अपने पुत्रों
  alternative: अपने बच्चों / अगली पीढ़ी को
  rationale: स्रोत में स्पष्ट पुल्लिंग बहुवचन को मुख्य पाठ में रखा गया है, जबकि प्रसंग में उसके व्यापक प्रतिनिधिक अर्थ को पादटिप्पणी में स्वीकार किया गया है।
- issue: אֲשֶׁר תְּצַוֻּם का संबंधवाचक अथवा उद्देश्यात्मक बल
  choice: ताकि तुम ... आज्ञा दो
  alternative: जिन्हें मानने की आज्ञा तुम ... दोगे
  rationale: प्रसंग हृदय लगाने और अगली पीढ़ी को सिखाने के बीच उद्देश्य-संबंध दर्शाता है। ‘ताकि’ इस प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि इब्रानी रूप संबंधवाचक ढंग से भी अनूदित हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सार्वजनिक वाचा-भाषण के अनुरूप। ‘व्यवस्था,’ ‘वचन,’ और ‘गवाही’ जैसे परिचित बाइबलीय पद रखे गए हैं, पर वाक्य-विन्यास को सामान्य पाठक के लिए स्वाभाविक बनाया गया है। दोनों पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
