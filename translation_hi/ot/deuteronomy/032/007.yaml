  register: भाषा आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण रखी गई है। एकवचन संबोधन और आज्ञार्थक प्रवाह सुरक्षित हैं। दूसरे खंड में ‘पूछो’ की पूर्ति हिन्दी की स्पष्टता के लिए दोहराई गई है; इससे मूल के समानांतर आशय में परिवर्तन नहीं होता।
