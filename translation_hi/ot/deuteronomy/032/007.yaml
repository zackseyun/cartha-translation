source:
  edition: WLC
  text: זְכֹר֙ יְמ֣וֹת עוֹלָ֔ם בִּ֖ינוּ שְׁנ֣וֹת דּוֹר וָ/ד֑וֹר שְׁאַ֤ל אָבִ֨י/ךָ֙ וְ/יַגֵּ֔דְ/ךָ זְקֵנֶ֖י/ךָ וְ/יֹ֥אמְרוּ לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/007.yaml
  text: Remember the days of old[a]; consider the years of generation after generation. Ask your father, and he will tell you, your elders[b], and they will say to you.
translation:
  language: hi
  text: प्राचीन दिनों को स्मरण करो; पीढ़ी-दर-पीढ़ी के वर्षों पर विचार करो। अपने पिता से पूछो, और वह तुम्हें बताएगा; तुम्हारे बुज़ुर्ग तुमसे कहेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זְכֹר
  choice: स्मरण करो
  rationale: यह זכר का काल आज्ञार्थक रूप है। ‘स्मरण करो’ सीधी आज्ञा और पद की गरिमा दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְמוֹת עוֹלָם
  choice: प्राचीन दिनों
  rationale: इस रचना का आशय बहुत पुराने समय के दिनों से है; ‘प्राचीन दिनों’ मूल मुहावरे के निकट और आधुनिक हिन्दी में स्पष्ट है।
- source_word: בִּינוּ
  choice: विचार करो
  rationale: בין यहाँ इतिहास पर समझ-बूझ के साथ ध्यान देने का आह्वान करता है। ‘विचार करो’ समानांतर आज्ञा के रूप में सहज है और किसी निश्चित निष्कर्ष को पाठ में नहीं जोड़ता।
- source_word: שְׁנוֹת דּוֹר וָדֹר
  choice: पीढ़ी-दर-पीढ़ी के वर्षों
  rationale: शाब्दिक रचना ‘पीढ़ी और पीढ़ी के वर्ष’ क्रमागत पीढ़ियों का मुहावरा है। ‘पीढ़ी-दर-पीढ़ी’ उसका वितरणात्मक बल बनाए रखता है।
- source_word: שְׁאַל
  choice: पूछो
  rationale: שאל की सीधी आज्ञा के लिए ‘पूछो’ सबसे स्वाभाविक और पर्याप्त हिन्दी रूप है।
- source_word: אָבִיךָ
  choice: अपने पिता
  rationale: एकवचन संज्ञा का सामान्य अर्थ ‘तुम्हारा पिता’ है। व्यापक अर्थ में पूर्वज की संभावना होते हुए भी मुख्य पाठ में सीधा शाब्दिक अर्थ रखा गया है।
- source_word: וְיַגֵּדְךָ
  choice: और वह तुम्हें बताएगा
  rationale: נגד का हिफ़ील रूप बताने या ज्ञात कराने का भाव देता है; ‘बताएगा’ स्वाभाविक हिन्दी है।
- source_word: זְקֵנֶיךָ
  choice: अपने पुरनियों
  rationale: यह केवल अधिक आयु वाले पुरुषों के बजाय समुदाय के वृद्ध और अनुभवी जनों को सूचित करता है। ‘पुरनियों’ बाइबली गरिमा और सामाजिक भूमिका दोनों व्यक्त करता है।
- source_word: וְיֹאמְרוּ לָךְ
  choice: और वे तुमसे कहेंगे
  rationale: אמר के सामान्य अर्थ ‘कहना’ को रखकर पिछले ‘बताएगा’ से मूल की हल्की क्रियात्मक भिन्नता सुरक्षित रहती है।
