base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/013.yaml
  text: He made him ride on the heights of the land[a], and he ate the produce of the field; he made him suck honey from the rock[c][b], and oil from the flinty rock.
translation:
  language: hi
  text: उसने उसे देश की ऊँचाइयों पर सवार कराया[a], और उसने खेत की उपज खाई[b]; उसने उसे चट्टान से मधु और चकमक चट्टान से तेल चुसाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी की ऊँचाइयों पर।” यहाँ सम्भवतः ऊँचा और उपजाऊ भूभाग अभिप्रेत है, न कि उपासना के ‘ऊँचे स्थान’।
    reason: lexical_alternative
  - marker: b
    text: या, “खेत की पैदावार।”
    reason: lexical_alternative
  - marker: c
    text: या, “उसने उसे चट्टान के मधु से पोसा।” इब्रानी क्रिया का शाब्दिक अर्थ है “चुसाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְכִּבֵהוּ
  choice: उसने उसे ... सवारी कराई
  rationale: हिफ़ील रूप की कारणवाचक शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עַל במותי אָרֶץ
  choice: देश की ऊँची जगहों पर
  rationale: यहाँ अभिव्यक्ति भू-आकृतिक ऊँचाइयों की ओर संकेत करती है; ‘ऊँचे स्थान’ उपासना-स्थलों का अनचाहा संकेत दे सकता है।
- source_word: וַיֹּאכַל תְּנוּבֹת שָׂדָי
  choice: और उसने खेत की उपज खाई
  rationale: क्रिया के सीधे अर्थ ‘खाया’ और सामूहिक एकवचन ‘खेत’ को सुरक्षित रखता है; תנובות का स्वाभाविक अर्थ ‘उपज’ है।
- source_word: וַיֵּנִקֵהוּ
  choice: उसने उसे ... चुसाया
  rationale: ינק के हिफ़ील का शाब्दिक कारणवाचक बिंब सुरक्षित रहता है, जिसमें असंभव-से स्रोत से सीधे पोषण मिलने की कविता है।
- source_word: דְבַשׁ מִסֶּלַע
  choice: चट्टान से मधु
  rationale: דבש के लिए ‘मधु’ और סלע के लिए ‘चट्टान’ काव्यात्मक किंतु सहज हिन्दी देते हैं।
- source_word: וְשֶׁמֶן מֵחַלְמִישׁ צוּר
  choice: और चकमक चट्टान से तेल
  rationale: ‘चकमक चट्टान’ חלמישׁ צור की कठोर, अनुपजाऊ शिला का बिंब बनाए रखती है; मूल में जैतून स्पष्ट न होने से केवल ‘तेल’ रखा गया है।
theological_decisions:
- issue: पूरे पद में तीसरे पुरुष एकवचन सर्वनामों के संदर्भ
  choice: मुख्य पाठ में ‘उसने’ और ‘उसे’ जैसे इब्रानी सर्वनाम बनाए रखे गए हैं
  alternative: कर्ता को ‘यहोवा’ और कर्म को ‘इस्राएल’ या ‘याकूब’ कहकर स्पष्ट करना
  rationale: निकटवर्ती प्रसंग संदर्भ स्पष्ट करता है, पर स्वयं पद सर्वनामों का प्रयोग करता है। उन्हें बनाए रखने से इब्रानी कथन-प्रवाह सुरक्षित रहता है और व्याख्यात्मक पहचान पाठ में नहीं जोड़ी जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमामय, काव्यात्मक और सामान्य पाठक के लिए स्पष्ट रूप। ‘मधु’ और ‘चकमक चट्टान’ मूल की काव्यात्मक समानांतरता तथा असम्भव स्रोत से भरपूर पोषण के बिंब को बनाए रखते हैं। सभी पदगत सर्वनाम जानबूझकर अस्पष्ट ही रखे गए हैं।
