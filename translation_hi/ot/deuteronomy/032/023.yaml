lexical_decisions:
- source_word: אַסְפֶּה
  choice: विपत्तियाँ पर विपत्तियाँ डालूँगा
  rationale: हिफ़ील रूप यहाँ विपत्तियों को एक के ऊपर एक बढ़ाते जाने का भाव देता है। हिंदी की यह अभिव्यक्ति संचय और तीव्रता दोनों को स्वाभाविक ढंग से प्रकट करती है।
- source_word: עָלֵימוֹ
  choice: उन पर
  rationale: עַל के साथ बहुवचन प्रत्यय उन लोगों पर विपत्तियाँ आने का लक्ष्यसूचक भाव व्यक्त करता है।
- source_word: רָעוֹת
  choice: विपत्तियाँ
  rationale: इस न्याय-संदर्भ में शब्द नैतिक बुराई नहीं, बल्कि हानि पहुँचाने वाली आपदाओं अथवा दंडात्मक विपत्तियों को दर्शाता है।
- source_word: חִצַּי
  choice: अपने तीर
  rationale: मूल का युद्ध-संबंधी रूपक सीधे और स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: אֲכַלֶּה
  choice: चला-चलाकर समाप्त कर दूँगा
  rationale: पिएल रूप तीरों को पूरी तरह खर्च कर देने का भाव देता है। हिंदी में यह प्रयोग तीर चलाने की क्रिया और उनके समाप्त हो जाने, दोनों को स्पष्ट करता है।
- source_word: בָּם
  choice: उन पर
  rationale: यहाँ בְּ तीरों के लक्ष्य को सूचित करता है; हिंदी में ‘उन पर’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय न्याय के संदर्भ में רָעוֹת का अनुवाद
  choice: विपत्तियाँ
  alternative: बुराइयाँ; आपदाएँ
  rationale: ‘विपत्तियाँ’ न्याय की कठोरता को बनाए रखता है, पर ऐसा संकेत नहीं देता कि परमेश्वर नैतिक बुराई करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी। ‘विपत्तियाँ पर विपत्तियाँ’ मूल के संचयी बल को उभारता है, जबकि ‘चला-चलाकर समाप्त कर दूँगा’ तीरों को पूर्णतः खर्च करने की युद्ध-छवि सुरक्षित रखता है।
