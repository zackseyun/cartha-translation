source:
  edition: WLC
  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְדַבֵּ֛ר אֶת כָּל דִּבְרֵ֥י הַ/שִּׁירָֽה הַ/זֹּ֖את בְּ/אָזְנֵ֣י הָ/עָ֑ם ה֖וּא וְ/הוֹשֵׁ֥עַ בִּן נֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/044.yaml
  text: Then Moses came and spoke all the words of this song in the hearing of the people[a], he and Hoshea son of Nun.
translation:
  language: hi
  text: तब मूसा आया और उसने इस गीत के सारे वचन लोगों को सुनाए; उसके साथ नून का पुत्र होशे भी था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ नाम ‘होशे’ है; अन्य स्थानों पर यही व्यक्ति सामान्यतः ‘यहोशू’ कहलाता है (देखें गिनती 13:16)।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का सामान्य कथात्मक अर्थ ‘आना’ है; यह बिना दिशा को अधिक स्पष्ट किए दृश्य के परिवर्तन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיְדַבֵּר אֶת כָּל דִּבְרֵי
  choice: सारे वचन … सुनाए
  rationale: शाब्दिक अर्थ ‘सारे वचन बोले’ है। हिंदी में सार्वजनिक मौखिक पाठ के संदर्भ में ‘सारे वचन … सुनाए’ स्वाभाविक है और कथन की पूर्णता बनाए रखता है।
- source_word: הַשִּׁירָה הַזֹּאת
  choice: इस गीत
  rationale: שׁירה यहाँ मूसा के गीत को सूचित करता है; ‘गीत’ निकटवर्ती साहित्यिक संदर्भ के अनुरूप है।
- source_word: בְּאָזְנֵי הָעָם
  choice: लोगों को सुनाए
  rationale: इब्रानी मुहावरे का शाब्दिक रूप ‘लोगों के कानों में’ है। हिंदी में ‘लोगों को सुनाए’ उसके सार्वजनिक और मौखिक अर्थ को सहज रूप में व्यक्त करता है।
- source_word: הוּא וְהוֹשֵׁעַ
  choice: उसने और … होशे ने
  rationale: स्वतंत्र सर्वनाम הוּא को बनाए रखकर दोनों कर्ताओं—मूसा और होशे—की स्पष्ट पहचान दी गई है, यद्यपि हिंदी व्याकरण के लिए क्रियात्मक संरचना दोहराई गई है।
- source_word: הוֹשֵׁעַ
  choice: होशे
  rationale: मसोरेटिक पाठ में यहाँ नाम ‘होशे’ है, न कि अधिक परिचित ‘यहोशू’; इसलिए मूल पाठ के नामरूप को रखा गया है।
- source_word: בִּן נוּן
  choice: नून के पुत्र
  rationale: यह मानक पितृनाम-सूचक रचना है; ‘नून के पुत्र’ आधुनिक हिंदी में स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: मूसा के साथी के नाम को ‘होशे’ या अधिक परिचित ‘यहोशू’ के रूप में देना
  choice: होशे
  alternative: यहोशू
  rationale: इस पद के इब्रानी पाठ में स्पष्टतः הוֹשֵׁעַ है। इसलिए अधिक परिचित नाम से सामंजस्य बैठाने के बजाय स्रोत-पाठ के नामरूप का अनुवर्तन किया गया है; टिप्पणी पाठक को नाम के दूसरे रूप से परिचित कराती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सार्वजनिक पाठ के योग्य और सहज रखी गई है। ‘वचन’ गीत की मौखिक, औपचारिक अभिव्यक्ति को बनाए रखता है; ‘लोगों को सुनाए’ इब्रानी मुहावरे का स्वाभाविक हिंदी रूप है।
