  text: מְזֵ֥י רָעָ֛ב וּ/לְחֻ֥מֵי רֶ֖שֶׁף וְ/קֶ֣טֶב מְרִירִ֑י וְ/שֶׁן בְּהֵמוֹת֙ אֲשַׁלַּח בָּ֔/ם עִם חֲמַ֖ת זֹחֲלֵ֥י עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/024.yaml
  text: wasted by famine[a], consumed by plague and bitter destruction; I will send against them the fangs of beasts[c][b], with the venom of things that crawl in the dust.
translation:
  language: hi
  text: 'वे अकाल से क्षीण हो जाएँगे,

    महामारी और कड़वे विनाश से भस्म हो जाएँगे;

    मैं उनके विरुद्ध पशुओं के दाँत भेजूँगा,

    और धूल पर रेंगनेवाले जीवों का विष भी भेजूँगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְזֵי רָעָב
  choice: भूख से सूख जाएँगे
  rationale: מְזֵי का भाव क्षीण, दुबला या चुक जाने का है। यहाँ רָעָב को केवल अकाल की बाहरी परिस्थिति के बजाय भूख के प्रत्यक्ष प्रभाव के रूप में लेना काव्यात्मक वाक्यांश को स्वाभाविक रखता है।
- source_word: לְחֻמֵי רֶשֶׁף
  choice: महामारी ... से भस्म हो जाएँगे
  rationale: दुर्लभ לְחֻמֵי में खा जाने या भस्म कर देने का निष्क्रिय भाव है; רֶשֶׁף यहाँ दाहकारी महामारी अथवा विपत्ति को सूचित करता है। 'भस्म' उसके दाह और संहार दोनों को व्यक्त करता है।
- source_word: קֶטֶב מְרִירִי
  choice: कड़वा विनाश
  rationale: קֶטֶב घातक विनाश या संहारकारी विपत्ति है और מְרִירִי शाब्दिक रूप से 'कड़वा' है। यह रूप मूल काव्यचित्र को रखता और רֶשֶׁף के साथ अनावश्यक समानार्थक दोहराव से बचता है।
- source_word: שֶׁן בְּהֵמוֹת
  choice: हिंसक पशुओं के दाँत
  rationale: שֶׁן का मूल अर्थ दाँत है और בְּהֵמוֹת व्यापक रूप से पशुओं को दर्शाता है। संदर्भ में उनका आक्रमणकारी स्वरूप स्पष्ट करने के लिए 'हिंसक' स्वाभाविक है, जबकि 'दाँत' मूल शब्द से अधिक निकट है।
- source_word: אֲשַׁלַּח בָּם
  choice: मैं उनके विरुद्ध ... छोड़ूँगा
  rationale: यह प्रयोग न्याय के साधन को उन पर या उनके विरुद्ध भेजने का भाव देता है। हिंदी में पशुओं के संदर्भ में 'छोड़ूँगा' उस आक्रामक क्रिया को सहजता से व्यक्त करता है।
- source_word: חֲמַת זֹחֲלֵי עָפָר
  choice: धूल पर रेंगनेवाले जीवों का विष
  rationale: रेंगनेवाले जीवों के साथ חֲמַת का अर्थ क्रोध के बजाय विष है। זֹחֲלֵי עָפָר व्यापक अभिव्यक्ति है, इसलिए इसे केवल साँपों तक सीमित नहीं किया गया।
theological_decisions:
- issue: רֶשֶׁף की संभावित पौराणिक पृष्ठभूमि
  choice: इसे सामान्य संज्ञा 'महामारी' के रूप में अनूदित किया गया।
  alternative: रेशेफ़ को व्यक्तिवाचक नाम मानना, या 'दाहक ज्वर' कहना।
  rationale: तात्कालिक संदर्भ वाचा-संबंधी दंडों की काव्यात्मक सूची है और व्यक्तिवाचक नाम आवश्यक नहीं करता। सामान्य संज्ञा साहित्यिक कार्य को स्पष्ट रखती है, जबकि संभावित प्राचीन संबद्धता को मत-सिद्धांत में नहीं बदला जाता।
- issue: זֹחֲלֵי עָפָר का विस्तार
  choice: सभी 'धूल पर रेंगनेवाले जीव'।
  alternative: केवल साँप।
  rationale: इब्रानी पद साँपों को शामिल कर सकता है, पर उनसे अधिक व्यापक है; इसलिए अनुवाद ने उस वास्तविक अस्पष्टता को संकुचित नहीं किया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय काव्यात्मक शैली रखी गई है। समानांतर पंक्तियाँ मूल कविता की गति को दर्शाती हैं। 'कड़वा विनाश' जानबूझकर कुछ काव्यात्मक है, ताकि מְרִירִי का ठोस रूपक बना रहे।
