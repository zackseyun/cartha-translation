source:
  edition: WLC
  text: עַל֩ אֲשֶׁ֨ר מְעַלְתֶּ֜ם בִּ֗/י בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִ֑ן עַ֣ל אֲשֶׁ֤ר לֹֽא קִדַּשְׁתֶּם֙ אוֹתִ֔/י בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/051.yaml
  text: because you acted unfaithfully against me among the sons of Israel at the waters of Meribath-kadesh[a], in the wilderness of Zin[c][b], because you did not treat me as holy among the sons of Israel.
translation:
  language: hi
  text: क्योंकि तुमने सीन के निर्जन प्रदेश में, मरीबा-कादेश[a] के जल के पास, इस्राएलियों के बीच मेरे प्रति विश्वासघात किया था; क्योंकि तुमने इस्राएलियों के बीच मुझे पवित्र नहीं ठहराया था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मरीबा-कादेश’ का अनुवाद ‘कादेश का मरीबा’ या अधिक शाब्दिक रूप में ‘कादेश के झगड़े के जल’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘मुझे पवित्र नहीं ठहराया’ का अर्थ ‘मेरी पवित्रता प्रकट नहीं की’ या ‘मुझे पवित्र मानकर आदर नहीं दिया’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַלְתֶּם בִּי
  choice: मेरे प्रति विश्वासघात किया
  rationale: מעל विश्वास या निष्ठा भंग करने का बोध कराता है; בִּי उस पक्ष को सूचित करता है जिसके विरुद्ध अपराध हुआ। यह हिंदी प्रयोग वाचा-संबंधी गंभीरता और नैतिक उल्लंघन दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के बीच
  rationale: यह मानक जातिनाम का स्वाभाविक हिंदी रूप है और בְּתוֹךְ का अर्थ ‘के बीच’ स्पष्ट रखता है। दोनों बार एक ही रूप रखकर मूल की पुनरावृत्ति सुरक्षित की गई है।
- source_word: בְּמֵי מְרִיבַת קָדֵשׁ
  choice: कादेश के मरीबा के जल के पास
  rationale: निर्माण-संबंध को ‘कादेश के मरीबा’ के रूप में रखा गया है और מֵי का प्रत्यक्ष अर्थ ‘जल’ सुरक्षित है। इससे स्थाननाम का स्वरूप बना रहता है, जबकि ‘झगड़े के जल’ वाला शब्दार्थ पादटिप्पणी में दिया गया है।
- source_word: מִדְבַּר צִן
  choice: सीन के निर्जन प्रदेश में
  rationale: מִדְבָּר अनिवार्यतः केवल रेतीला मरुस्थल नहीं, बल्कि विरल आबादी वाला उजाड़ क्षेत्र भी हो सकता है। ‘निर्जन प्रदेश’ आधुनिक हिंदी में स्पष्ट है और भौगोलिक अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: לֹא קִדַּשְׁתֶּם אֹתִי
  choice: मुझे पवित्र नहीं ठहराया
  rationale: पिएल क्रिया यहाँ लोगों के सामने परमेश्वर को पवित्र मानने और उसकी पवित्रता प्रकट करने के सार्वजनिक अर्थ को वहन करती है। यह रूप मूल की धार्मिक शब्दावली तथा अर्थगत तनाव को बनाए रखता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का जातिनाम-संबंधी अनुवाद
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: इस संदर्भ में यह पूरे जातीय समुदाय के लिए प्रचलित इब्रानी पद है। ‘इस्राएली’ आधुनिक हिंदी में इसी अर्थ को स्वाभाविक और समावेशी ढंग से देता है; शाब्दिक ‘पुत्रों’ से केवल पुरुषों का भ्रामक संकेत मिल सकता है।
- issue: קִדַּשְׁתֶּם אֹתִי में परमेश्वर को पवित्र ठहराने का अर्थ
  choice: मुझे पवित्र नहीं ठहराया
  alternative: मेरी पवित्रता प्रकट नहीं की / मुझे पवित्र मानकर आदर नहीं दिया
  rationale: वाक्य परमेश्वर में पवित्रता उत्पन्न करने की बात नहीं करता, बल्कि इस्राएल के सामने उसकी पवित्रता को मानने और प्रदर्शित करने की बात करता है। मुख्य पाठ मूल की संक्षिप्त अभिव्यक्ति रखता है और पादटिप्पणी आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिंदी अपनाई गई है। लंबे कारणवाचक वाक्य को मूल के अनुरूप एक वाक्य रखा गया है; स्थानों का क्रम हिंदी की स्वाभाविक संरचना के अनुसार व्यवस्थित है। ‘इस्राएलियों के बीच’ की पुनरावृत्ति मूल पाठ के सार्वजनिक संदर्भ और बल को सुरक्षित रखती है।
