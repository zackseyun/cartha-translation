base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/026.yaml
  text: I said[a], ‘I would scatter them[b]; I would make their memory cease from mankind,’
translation:
  language: hi
  text: मैंने कहा, “मैं उन्हें तितर-बितर कर दूँगा[a]; मनुष्यों के बीच से[b] उनकी स्मृति मिटा दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं उन्हें उड़ा दूँगा / चारों ओर बिखेर दूँगा।” यहाँ प्रयुक्त हिब्रू क्रिया दुर्लभ और कठिन है; कुछ लोग इसका अर्थ उन्हें कोनों में खदेड़ देना या दृष्टि से हटा देना समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “मनुष्य में से”; इसका अनुवाद “मानवजाति में से” या “नश्वर मनुष्यों के बीच से” भी हो सकता है। हिब्रू में मनुष्यों के लिए सामूहिक एकवचन शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: मैंने कहा
  rationale: यह אָמַר का काल पूर्ण, प्रथम पुरुष एकवचन रूप है और परमेश्वर के घोषित विचार या संकल्प को प्रस्तुत करता है। सीधा अर्थ ‘मैंने कहा’ है।
- source_word: אַפְאֵיהֶם
  choice: मैं उन्हें तितर-बितर कर दूँगा
  rationale: यह एक दुर्लभ और कठिन रूप है, जिसे सामान्यतः बिखेरने, दूर उड़ा देने या कोनों में हटा देने के अर्थ में समझा जाता है। ‘तितर-बितर कर दूँगा’ संदर्भ में स्पष्ट है, पर पादटिप्पणी में अनिश्चितता सुरक्षित रखी गई है।
- source_word: אַשְׁבִּיתָה
  choice: मिटा दूँगा
  rationale: שבת के हिफ़ईल रूप का मूल भाव किसी वस्तु को समाप्त या बंद कर देना है। ‘स्मृति’ के साथ हिंदी में ‘स्मृति मिटा दूँगा’ स्वाभाविक रूप से उसके बने रहने का अंत व्यक्त करता है।
- source_word: מֵאֱנוֹשׁ
  choice: मनुष्यों के बीच से
  rationale: אֱנוֹשׁ यहाँ मानवजाति के लिए सामूहिक एकवचन है और नश्वर मानव का भाव भी रख सकता है। ‘मनुष्यों के बीच से’ सार्वजनिक मानवीय स्मरण के क्षेत्र को सहज हिंदी में व्यक्त करता है।
- source_word: זִכְרָם
  choice: उनकी स्मृति
  rationale: זֵכֶר का अर्थ स्मृति या स्मरण है। ‘उनकी स्मृति’ मूल अर्थ को संक्षेप और स्पष्टता से रखता है।
theological_decisions:
- issue: काव्य में परमेश्वर का कथन और दंड का घोषित संकल्प
  choice: ‘मैंने कहा’ के बाद भविष्यसूचक संकल्प—‘कर दूँगा’ और ‘मिटा दूँगा’
  alternative: ‘मैं उन्हें तितर-बितर कर देता; उनकी स्मृति मिटा देता’
  rationale: हिब्रू रूप घोषित इरादे को व्यक्त करते हैं। हिंदी में उद्धृत वाणी के भीतर भविष्यकाल उस संकल्प को स्वाभाविक ढंग से रखता है; अगली आयत द्वारा उसके क्रियान्वयन पर आने वाली योग्यता को इस आयत में पहले से नहीं मिलाया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘तितर-बितर’ दुर्लभ हिब्रू क्रिया का स्पष्ट मुख्य-पाठीय रूप है, जबकि उसकी वास्तविक शब्दार्थगत अनिश्चितता पादटिप्पणी में दी गई है।
