base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/029.yaml
  text: If only they were wise[a], they would understand this; they would discern their end.
translation:
  language: hi
  text: काश वे बुद्धिमान होते! वे इस बात को समझते और अपने अंत[a] को पहचानते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने अंतिम परिणाम” अथवा “अपने भविष्य।” इब्रानी शब्द किसी के अंतिम परिणाम या आगे होने वाली दशा का उल्लेख कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּ
  choice: काश
  rationale: यह कण साधारण शर्त नहीं, बल्कि इच्छा और खेद व्यक्त करता है; आधुनिक हिन्दी में ‘काश’ इसके भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חָכְמ֖וּ
  choice: वे बुद्धिमान होते
  rationale: חכם यहाँ बुद्धि रखने या उसका प्रयोग करने का भाव देता है; ‘काश’ के साथ यह हिन्दी में स्वाभाविक संभाव्य रूप है।
- source_word: יַשְׂכִּ֣ילוּ
  choice: वे ... समझते
  rationale: שׂכל का हिफ़ील रूप समझने, सूझ प्राप्त करने या बुद्धिमानी से काम करने का अर्थ दे सकता है; समानांतर क्रिया के साथ यहाँ बोध का अर्थ उपयुक्त है।
- source_word: זֹ֑את
  choice: इस बात को
  rationale: एकवचन संकेतवाचक का रूप बनाए रखते हुए ‘इस बात’ निकटवर्ती शिक्षा या वास्तविकता की ओर संकेत करता है।
- source_word: יָבִ֖ינוּ
  choice: पहचान लेते
  rationale: בין विवेक से समझने या भेद पहचानने का भाव देता है; यह चयन पहली क्रिया ‘समझते’ से भिन्नता रखते हुए काव्यात्मक समानांतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְאַחֲרִיתָם
  choice: अपने अंत को
  rationale: אַחֲרִית किसी के अंतिम परिणाम, बाद की दशा या भविष्य को सूचित कर सकता है; ‘अंत’ संक्षिप्त है और प्रसंग की चेतावनी को बनाए रखता है।
theological_decisions:
- issue: אַחֲרִיתָם का प्रसंगगत अर्थ
  choice: अपने अंत
  alternative: अपने अंतिम परिणाम / अपने भविष्य
  rationale: ‘अंत’ न्याय और परिणाम की गंभीरता को बनाए रखता है, पर पाद-टिप्पणी यह स्पष्ट करती है कि इब्रानी शब्द केवल मृत्यु नहीं, आगे होने वाले परिणाम या भविष्य का भी बोध करा सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। विस्मयादिबोधक चिह्न ‘काश’ में निहित इच्छा और विलाप को स्पष्ट करता है; दूसरी पंक्ति का प्रवाह इब्रानी काव्य की समानांतरता को बनाए रखता है।
