base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/041.yaml
  text: when I sharpen the lightning of my sword, and my hand takes hold of judgment, I will return vengeance on my adversaries, and I will repay those who hate me.
translation:
  language: hi
  text: 'जब मैं अपनी बिजली-सी चमकती तलवार को पैना करूँगा,

    और मेरा हाथ न्याय को थाम लेगा,

    तब मैं अपने शत्रुओं से बदला लूँगा,

    और जो मुझसे घृणा करते हैं, उन्हें प्रतिफल दूँगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: जब
  rationale: यहाँ शर्तसूचक ‘यदि’ से अधिक आगामी निश्चित कार्रवाई की कालगत भूमिका है; इसलिए काव्य-संदर्भ में स्वाभाविक ‘जब’ चुना गया।
- source_word: בְּרַק חַרְבִּי
  choice: अपनी तलवार की बिजली
  rationale: 'शाब्दिक और सजीव रूपक को बनाए रखता है: तलवार की चमक बिजली के समान चित्रित है।'
- source_word: וְתֹאחֵז בְּמִשְׁפָּט יָדִי
  choice: और मेरा हाथ न्याय को थाम लेगा
  rationale: ‘हाथ’ को कर्ता और ‘न्याय’ को पकड़ी जाने वाली वस्तु रखने से मूल काव्यात्मक मानवीकरण सुरक्षित रहता है।
- source_word: אָשִׁיב נָקָם
  choice: बदला लूँगा
  rationale: हिब्रू मुहावरे का स्वाभाविक हिन्दी रूप; इसका अर्थ न्यायोचित प्रतिशोध देना है।
- source_word: אֲשַׁלֵּם
  choice: प्रतिफल दूँगा
  rationale: मूल क्रिया का आशय किए के अनुरूप चुका देना है; ‘प्रतिफल’ दंडात्मक संदर्भ को रखते हुए अनावश्यक विस्तार नहीं करता।
theological_decisions:
- issue: ईश्वरीय प्रतिशोध और न्याय का संबंध
  choice: ‘बदला लूँगा’ और ‘न्याय को थाम लेगा’ दोनों को स्पष्ट रखा गया
  alternative: ‘दंड दूँगा’ कहकर प्रतिशोध की भाषा को नरम करना
  rationale: मूल पाठ ईश्वर के न्याय और प्रतिशोध दोनों की तनावपूर्ण भाषा रखता है; अनुवाद इसे किसी विशिष्ट धर्मवैज्ञानिक प्रणाली में विलीन नहीं करता।
- issue: אִם का अर्थ
  choice: ‘जब’
  alternative: ‘यदि’
  rationale: संदर्भ आगामी न्यायिक कार्रवाई को कालगत ढंग से प्रस्तुत करता है; फिर भी मूल शब्द सामान्यतः शर्तसूचक हो सकता है। इस पद में ‘जब’ अधिक स्वाभाविक और संदर्भानुकूल है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। पंक्ति-विभाजन हिब्रू समानांतरता को स्पष्ट करता है; दुर्लभ या अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
