source:
  edition: WLC
  text: הַרְנִ֤ינוּ גוֹיִם֙ עַמּ֔/וֹ כִּ֥י דַם עֲבָדָ֖י/ו יִקּ֑וֹם וְ/נָקָם֙ יָשִׁ֣יב לְ/צָרָ֔י/ו וְ/כִפֶּ֥ר אַדְמָת֖/וֹ עַמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/043.yaml
  text: Rejoice[a], O nations, with his people, for he will avenge the blood of his servants; he will repay vengeance on his adversaries[d][c][b], and he will make atonement for his land and his people.
translation:
  language: hi
  text: हे जातियो, उसके लोगों के साथ आनन्द मनाओ[a], क्योंकि वह अपने सेवकों के खून का बदला लेगा; वह अपने विरोधियों को प्रतिशोध का फल देगा, और अपनी भूमि और अपने लोगों के लिए प्रायश्चित करेगा[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे जातियो, उसके लोगों के साथ आनन्द से गाओ।” इब्रानी आज्ञा में उल्लास से पुकारने या गाने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह अपनी भूमि और अपने लोगों को शुद्ध करेगा।” यहाँ प्रयुक्त इब्रानी क्रिया प्रायश्चित करने के साथ-साथ शुद्ध करने या दोष मिटाने पर भी बल दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी सेप्टुआजिन्त और मृतसागर की एक पाण्डुलिपि में इस पद का अधिक लम्बा रूप सुरक्षित है। उसमें आकाश और दिव्य प्राणियों से आनन्द मनाने तथा जातियों से उसे दण्डवत करने के अतिरिक्त आह्वान भी हैं। मुख्य पाठ यहाँ मसोरेटिक इब्रानी पाठ का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: आनन्द मनाओ
  rationale: बहुवचन आज्ञार्थक क्रिया उल्लासपूर्ण पुकार या आनन्द-गान व्यक्त कर सकती है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और श्रव्य भाव पादटिप्पणी में दिया गया है।
- source_word: גוֹיִם
  choice: जातियो
  rationale: यहाँ सामूहिक रूप से इस्राएल से बाहर की जातियों का संबोधन है। ‘जातियाँ’ आधुनिक हिन्दी में इस अंतरराष्ट्रीय अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַמּוֹ
  choice: उसके लोगों के साथ
  rationale: मसोरेटिक पाठ का वाक्य-विन्यास संक्षिप्त है। ‘के साथ’ जोड़ना इस सम्भावित अर्थ को स्पष्ट करता है कि जातियाँ परमेश्वर के लोगों के साथ आनन्द मनाएँ।
- source_word: דַם עֲבָדָיו
  choice: अपने सेवकों के खून
  rationale: עבד दास अथवा सेवक हो सकता है। यहाँ परमेश्वर से उनके संबंध और उनके बहाए गए खून पर बल होने के कारण ‘सेवक’ उपयुक्त है; ‘खून’ इस काव्यात्मक न्याय-संदर्भ में सहज और प्रभावी है।
- source_word: יִקּוֹם
  choice: बदला लेगा
  rationale: खून का बदला लेने के मुहावरे में נקם का प्रतिशोधात्मक न्यायार्थ स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: וְנָקָם יָשִׁיב לְצָרָיו
  choice: अपने विरोधियों को प्रतिशोध का फल देगा
  rationale: यह रूप ‘प्रतिशोध’ को लुप्त नहीं होने देता और ישיב के लौटाने अथवा प्रतिफल देने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְכִפֶּר
  choice: प्रायश्चित करेगा
  rationale: כפר के प्रायश्चित्तकारी अर्थ को बनाए रखा गया है, जबकि शुद्ध करने का सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אַדְמָתוֹ עַמּוֹ
  choice: अपनी भूमि और अपने लोगों के लिए
  rationale: अन्तिम दो पदों को समन्वित रूप में लिया गया है। ‘भूमि’ אדמה के राष्ट्रीय-वाचा संबंधी संदर्भ में उपयुक्त है।
theological_decisions:
- issue: आरम्भिक पंक्ति में जातियों और ‘उसके लोगों’ का संबंध
  choice: जातियों को उसके लोगों के साथ आनन्द मनाने का आह्वान
  alternative: जातियाँ उसके लोगों की प्रशंसा करें; अथवा दीर्घ यूनानी/मृतसागर-पाण्डुलिपि पाठ के अनुसार विस्तारित आह्वान
  rationale: दिए गए मसोरेटिक पाठ का वाक्य-विन्यास संक्षिप्त और कुछ हद तक अस्पष्ट है। ‘के साथ’ सबसे सम्भावित संबंध को सहज हिन्दी में व्यक्त करता है, पर पादटिप्पणी पाठगत भिन्नता बताती है।
- issue: अन्तिम खंड में כפר का अर्थ
  choice: भूमि और लोगों के लिए प्रायश्चित करना
  alternative: भूमि और लोगों को शुद्ध अथवा दोषमुक्त करना
  rationale: मुख्य पाठ में क्रिया का प्रायश्चित्तकारी धार्मिक भार सुरक्षित है; शुद्धिकरण का निकटवर्ती अर्थ पादटिप्पणी में दिया गया है ताकि अर्थगत तनाव बना रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘हे जातियो’ काव्यात्मक संबोधन को बनाए रखता है; ‘बदला’, ‘प्रतिशोध’ और ‘प्रायश्चित’ मूल के न्याय तथा धार्मिक भार को बिना सांप्रदायिक व्याख्या जोड़े व्यक्त करते हैं।
