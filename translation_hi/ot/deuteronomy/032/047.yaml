  text: כִּ֠י לֹֽא דָבָ֨ר רֵ֥ק הוּא֙ מִ/כֶּ֔ם כִּי ה֖וּא חַיֵּי/כֶ֑ם וּ/בַ/דָּבָ֣ר הַ/זֶּ֗ה תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/047.yaml
  text: For it is not an empty word for you[a], but it is your life[c][b], and by this word you will prolong your days on the land that you are crossing the Jordan to possess.
translation:
  language: hi
  text: क्योंकि यह तुम्हारे लिए कोई खोखली बात नहीं है[a], बल्कि यही तुम्हारा जीवन है[b]; और इसी वचन के द्वारा तुम उस भूमि पर बहुत दिनों तक जीवित रहोगे, जिस पर अधिकार करने के लिए तुम यरदन पार जा रहे हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह तुम्हारे लिए कोई तुच्छ बात नहीं है” अथवा “कोई व्यर्थ बात नहीं है।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “तुम्हारे जीवन”; बहुवचन रूप यहाँ अमूर्त एकवचन ‘जीवन’ के अर्थ में प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में “वहाँ उसे अधिकार में लेने के लिए”; इसका अनुवाद “उसे विरासत में पाने के लिए” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר רֵק
  choice: खोखली बात
  rationale: यह पद अभी कहे गए वचन/उपदेश की ओर संकेत करता है। ‘खोखली बात’ רֵק के खाली, निष्फल या महत्वहीन होने के भाव को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: מִכֶּם
  choice: तुम्हारे लिए
  rationale: यहाँ מן संबंधसूचक मुहावरे में ‘तुम्हारे लिए/तुम्हारी दृष्टि में’ का अर्थ देता है, न कि साधारणतः ‘तुमसे’।
- source_word: חַיֵּיכֶם
  choice: तुम्हारा जीवन
  rationale: हिब्रू रूप व्याकरणतः बहुवचन है, पर חַיִּים प्रायः अमूर्त एकवचन ‘जीवन’ के अर्थ में आता है।
- source_word: וּבַדָּבָר הַזֶּה
  choice: इसी वचन के द्वारा
  rationale: ב instrumental है और जीवन की अवधि बढ़ने का माध्यम बताता है। ‘वचन’ पहले आए דָבָר को दोहराता और वाचा-संबंधी कथन की निरंतरता रखता है।
- source_word: תַּאֲרִיכוּ יָמִים
  choice: बहुत दिनों तक जीवित रहोगे
  rationale: शाब्दिक चित्र ‘अपने दिन लम्बे करोगे’ है; आधुनिक हिन्दी में यह अर्थ स्वाभाविक रूप से दीर्घ जीवन को व्यक्त करता है।
- source_word: עַל הָאֲדָמָה
  choice: उस भूमि पर
  rationale: व्यवस्थाविवरण के संदर्भ में אֲדָמָה प्रतिज्ञात भूभाग को सूचित करती है; ‘भूमि पर’ क्षेत्रीय और वाचा-संबंधी बल बनाए रखता है।
- source_word: עֹבְרִים אֶת־הַיַּרְדֵּן
  choice: यरदन पार जा रहे हो
  rationale: कृदन्त मूसा के दृष्टिकोण से निकट भविष्य की, मानो आरम्भ होती हुई, यात्रा को व्यक्त करता है।
- source_word: שָׁמָּה לְרִשְׁתָּהּ
  choice: जिस पर अधिकार करने के लिए
  rationale: ירשׁ में भूमि को विरासत में पाने और उस पर अधिकार लेने, दोनों का भाव हो सकता है। मुख्य पाठ में ‘अधिकार करने’ से लक्ष्य स्पष्ट रहता है।
theological_decisions:
- issue: आज्ञापालन, जीवन और वाचा का संबंध
  choice: परमेश्वर का दिया हुआ वचन इस्राएल के जीवन और उस भूमि में दीर्घकाल तक बने रहने का साधन बताया गया है।
  alternative: इसे व्यवस्था के महत्त्व की केवल आलंकारिक प्रशंसा माना जाए, जिसमें वाचा-संबंधी परिणाम निहित न हो।
  rationale: ‘यही तुम्हारा जीवन है’ और ‘इसी वचन के द्वारा... बहुत दिनों तक जीवित रहोगे’ समानांतर कथन हैं और जीवन तथा भूमि में दीर्घ निवास को वचन से जोड़ते हैं। अनुवाद इस संबंध को रखता है, पर बाद की धर्मसैद्धांतिक श्रेणियाँ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘खोखली बात’ मूल रूपक को रखती है; ‘बहुत दिनों तक जीवित रहोगे’ शाब्दिक हिब्रू मुहावरे की अपेक्षा अधिक स्वाभाविक हिन्दी है। सर्वनाम बहुवचन ‘तुम’ इस्राएली समुदाय को संबोधन दर्शाता है।
