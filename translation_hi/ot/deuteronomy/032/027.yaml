language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לוּלֵ֗י כַּ֤עַס אוֹיֵב֙ אָג֔וּר פֶּֽן יְנַכְּר֖וּ צָרֵ֑י/מוֹ פֶּן יֹֽאמְרוּ֙ יָדֵ֣י/נוּ רָ֔מָה וְ/לֹ֥א יְהוָ֖ה פָּעַ֥ל כָּל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/027.yaml
  text: Were it not that I feared the provocation of the enemy[a], lest their adversaries should misunderstand, lest they should say, ‘Our hand is exalted[c][b], and Yahweh has not done all this.’
translation:
  language: hi
  text: 'यदि मुझे शत्रु के उकसावे का भय न होता,[a]

    कहीं ऐसा न हो कि उनके विरोधी इसका गलत अर्थ लगाएँ,[b]

    कहीं वे यह न कहें, ‘हमारा हाथ ऊँचा है,[c]

    और यह सब याहवे ने नहीं किया।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि मुझे शत्रु के उकसावे से डर न होता।”
    reason: lexical_alternative
  - marker: b
    text: “गलत अर्थ लगाएँ” के लिए प्रयुक्त इब्रानी क्रिया कठिन है; इसका अर्थ “गलत आँकें” या इस्राएल के पतन के वास्तविक कारण को “न पहचानें” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “हमारा हाथ ऊँचा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵי
  choice: यदि ... न होता
  rationale: यह न्याय के वर्णन में एक अपवादसूचक शर्त प्रस्तुत करता है; आधुनिक हिन्दी में यह संरचना स्वाभाविक और स्पष्ट है।
- source_word: כַּעַס אוֹיֵב
  choice: शत्रु के उकसावे
  rationale: כַּעַס यहाँ शत्रु की उद्दंड प्रतिक्रिया या उस provocation को सूचित करता है जो उसकी डींग से उत्पन्न होगी; ‘उकसावा’ इस प्रसंग को व्यक्त करता है।
- source_word: אָגוּר
  choice: मुझे ... भय होता
  rationale: इब्रानी के प्रथम पुरुष भय-सूचक क्रिया-रूप को बनाए रखा गया है; इसे ‘चिंता’ कहकर नरम नहीं किया गया।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: दोहराया गया अव्यय आशंका और निवारण का भाव देता है; हिन्दी में यह स्वाभाविक समतुल्य है।
- source_word: יְנַכְּרוּ
  choice: इसे गलत समझें
  rationale: यह कठिन क्रिया प्रसंग में इस्राएल के पतन के वास्तविक कारण का गलत अर्थ लगाने को सूचित करती है; अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: צָרֵימוֹ
  choice: उनके विरोधी
  rationale: यह शत्रुतापूर्ण विरोधियों को सूचित करता है और बहुवचन क्रिया के अनुरूप है।
- source_word: יָדֵינוּ רָמָה
  choice: हमारा हाथ ऊँचा है
  rationale: मूल रूपक का निकट, बोधगम्य अनुवाद है; विजय और आत्मश्लाघा दोनों का संकेत बना रहता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी पदवी से प्रतिस्थापित नहीं किया गया।
- source_word: פָּעַל כָּל זֹאת
  choice: यह सब ... ने नहीं किया
  rationale: क्रिया के ‘करना/घटित करना’ अर्थ को सीधा रखा गया है और शत्रु द्वारा परमेश्वर की भूमिका के इनकार को स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत दिव्य नाम को पदवी ‘प्रभु’ से नहीं बदला गया; आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाने जाने योग्य ‘यहोवा’ चुना गया।
- issue: परमेश्वर के विषय में ‘भय’ की मानव-सदृश अभिव्यक्ति
  choice: मुझे ... भय होता
  alternative: मुझे चिंता होती
  rationale: मूल की स्पष्ट भय-सूचक भाषा और उसका धर्मवैचारिक तनाव सुरक्षित रखा गया है; प्रसंग बताता है कि आशय शत्रु की गलत व्याख्या की आशंका है, सामर्थ्य की कमी नहीं।
- issue: शत्रुओं द्वारा परिणाम का कारण गलत समझना
  choice: इसे गलत समझें
  alternative: इसे गलत आँकें
  rationale: मुख्य पाठ में प्रसंगगत अर्थ दिया गया है, पर कठिन इब्रानी क्रिया के संभावित अर्थ पादटिप्पणी में बताए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। काव्यात्मक पंक्ति-विन्यास, दोहराए गए आशंका-सूचक उपवाक्य और ‘हाथ ऊँचा’ रूपक सुरक्षित हैं।
