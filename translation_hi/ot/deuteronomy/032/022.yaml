language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי אֵשׁ֙ קָדְחָ֣ה בְ/אַפִּ֔/י וַ/תִּיקַ֖ד עַד שְׁא֣וֹל תַּחְתִּ֑ית וַ/תֹּ֤אכַל אֶ֨רֶץ֙ וִֽ/יבֻלָ֔/הּ וַ/תְּלַהֵ֖ט מוֹסְדֵ֥י הָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/022.yaml
  text: For a fire has been kindled in my anger[a], and it burns to the depths of Sheol; it devours the earth and its produce, and sets ablaze the foundations of the mountains.
translation:
  language: hi
  text: क्योंकि मेरे क्रोध में आग भड़क उठी है, और वह शीओल की गहराइयों तक जलती है[a]; वह पृथ्वी और उसकी उपज को भस्म करती है, और पहाड़ों की नींवों को धधका देती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में, “शीओल, जो सबसे गहरा/निचला है।” वैकल्पिक रूप से, “सबसे निचले शीओल तक” या “कब्र की गहराइयों तक।” ‘शीओल’ मृतकों के लोक के लिए प्रयुक्त इब्रानी शब्द है।
    reason: שְׁאוֹל תַּחְתִּית की शब्दगत अस्पष्टता और ‘शीओल’ की वैचारिक व्यापकता को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले न्याय-वचन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संयोजक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵשׁ קָדְחָה
  choice: आग भड़क उठी है
  rationale: क्रिया आग के प्रज्वलित या भड़कने का भाव देती है; यह पूर्ण क्रिया के परिणामी पक्ष को भी बनाए रखता है।
- source_word: בְאַפִּי
  choice: मेरे क्रोध में
  rationale: אַף का शाब्दिक अर्थ नाक हो सकता है, पर यहाँ यह क्रोध का स्थापित इब्रानी मुहावरा है।
- source_word: וַתִּיקַד
  choice: वह ... जलती जाती है
  rationale: आग की जारी क्रिया और उसके अत्यन्त नीचे तक पहुँचने की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַד שְׁאוֹל תַּחְתִּית
  choice: अधोलोक की गहराइयों तक
  rationale: שְׁאוֹל मृतकों के लोक को सूचित करता है; ‘अधोलोक’ उसका अर्थ संप्रेषित करता है, जबकि תַּחְתִּית की निम्नतम/गहनता की धारणा ‘गहराइयों’ में बनी रहती है।
- source_word: וַתֹּאכַל
  choice: भस्म करती है
  rationale: आग द्वारा ‘खा जाने’ के रूपक को हिन्दी में सजीव और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶרֶץ
  choice: पृथ्वी
  rationale: अधोलोक और पहाड़ों की नींवों वाले व्यापक काव्यात्मक परिप्रेक्ष्य में ‘पृथ्वी’ उचित है; ‘देश’ अनावश्यक रूप से स्थानीय अर्थ दे सकता है।
- source_word: יְבֻלָהּ
  choice: उसकी उपज
  rationale: पृथ्वी से उत्पन्न होने वाली पैदावार के व्यापक अर्थ को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַתְּלַהֵט
  choice: धधका देती है
  rationale: क्रिया की तीव्र तथा कारक अग्नि-छवि को बनाए रखता है।
- source_word: מוֹסְדֵי הָרִים
  choice: पहाड़ों की नींवों
  rationale: पहाड़ों के सबसे गहरे आधारों की ठोस काव्यात्मक छवि को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; शीओल; नरक
  rationale: यहाँ इब्रानी शब्द मृतकों के लोक को सूचित करता है। ‘अधोलोक’ अर्थ को सामान्य हिन्दी पाठक तक पहुँचाता है, पर इसे बाद की विशिष्ट ‘नरक’ संबंधी धर्मशास्त्रीय अवधारणा से नहीं मिलाता। पादटिप्पणी ‘शीओल’ और ‘कब्र’ की सम्भावनाएँ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘भड़क उठी’, ‘भस्म करती’ और ‘धधका देती’ मूल की तीव्र अग्नि-छवि को सहज हिन्दी में बनाए रखते हैं; ‘अधोलोक’ के साथ पादटिप्पणी मूल शब्द की धर्मशास्त्रीय अस्पष्टता को सुरक्षित करती है।
