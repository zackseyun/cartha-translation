  yaml_path: translation/ot/deuteronomy/032/001.yaml
  text: Give ear[a], O heavens, and I will speak; and let the earth hear the words of my mouth.
translation:
  language: hi
  text: 'हे आकाश, ध्यान से सुनो[a], और मैं बोलूँगा;

    और पृथ्वी मेरे मुँह के शब्द सुने।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कान लगाओ।” इब्रानी में ध्यानपूर्वक सुनने की ऊँची काव्यात्मक आज्ञा है; आगे “पृथ्वी ... सुने” में इच्छासूचक आह्वान है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: ध्यान से सुनो
  rationale: हिफ़ील आज्ञार्थक रूप केवल सुनने नहीं, बल्कि ध्यानपूर्वक कान लगाने का आह्वान करता है। यह आधुनिक हिन्दी में स्वाभाविक रहते हुए काव्यात्मक गंभीरता बनाए रखता है।
- source_word: הַשָּׁמַיִם
  choice: हे आकाश
  rationale: שָׁמַיִם रूप की दृष्टि से बहुवचन है, किंतु हिन्दी में समूचे आकाशमंडल को संबोधित करने के लिए एकवचन ‘आकाश’ अधिक स्वाभाविक है; ‘हे’ प्रत्यक्ष काव्यात्मक संबोधन को स्पष्ट करता है।
- source_word: וַאֲדַבֵּרָה
  choice: और मैं बोलूँगा
  rationale: कोहोर्टेटिव रूप वक्ता के संकल्प या अभिप्राय को व्यक्त करता है। यह अनुवाद उस भाव और समानांतर काव्य-गति को बनाए रखता है।
- source_word: וְתִשְׁמַע
  choice: और ... सुने
  rationale: अपूर्णकालिक/जसिव रूप यहाँ आकाश को दी गई आज्ञा के समानांतर इच्छासूचक आह्वान है। हिन्दी का ‘सुने’ इस भाव को बिना उसे साधारण भविष्यवाणी बनाए व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: आकाश–पृथ्वी की विश्वव्यापी जोड़ी में ‘पृथ्वी’ उपयुक्त है, न कि सीमित अर्थ वाला ‘देश’ या ‘भूमि’।
- source_word: אִמְרֵי
  choice: बातें
  rationale: यह मुख से कहे गए वचनों या कथनों को दर्शाता है। ‘बातें’ आधुनिक हिन्दी में सहज है और अगले पदबंध ‘मेरे मुँह की’ के साथ स्वाभाविक बैठता है।
- source_word: פִי
  choice: मेरे मुँह की
  rationale: मूल के ठोस काव्यात्मक पदबंध ‘मेरे मुँह की बातें’ को संक्षिप्त व्याख्यात्मक रूप ‘जो मैं कहूँ’ में बदलने के बजाय सुरक्षित रखा गया है।
theological_decisions:
- issue: आकाश और पृथ्वी को संबोधन का दायरा
  choice: साक्षी के समान समूचे जगत को गंभीर काव्यात्मक आह्वान
  alternative: सभी श्रोताओं के लिए केवल अलंकारिक पुकार
  rationale: मूल पाठ आकाश और पृथ्वी को औपचारिक काव्यात्मक समानांतरता में पुकारता है, जो वाचा और भविष्यवाणी संबंधी प्रसंगों में साक्षी-सदृश गंभीरता रखती है। मुख्य पाठ इस संकेत को बनाए रखता है, पर ‘साक्षी’ शब्द जोड़कर उसकी व्याख्या निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। ‘हे आकाश’ और ‘पृथ्वी ... सुने’ मूल के विश्वव्यापी संबोधन तथा समानांतरता को रखते हैं; अत्यधिक संस्कृतनिष्ठ ‘श्रवण करो’ से बचा गया है।
