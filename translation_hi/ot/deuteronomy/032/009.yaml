  text: כִּ֛י חֵ֥לֶק יְהֹוָ֖ה עַמּ֑/וֹ יַעֲקֹ֖ב חֶ֥בֶל נַחֲלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/009.yaml
  text: For Yahweh’s portion is his people[a], Jacob the share of his inheritance.
translation:
  language: hi
  text: 'क्योंकि याहवे का भाग उसकी प्रजा है;

    याकूब उसकी विरासत का हिस्सा[a] है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी विरासत को नापने की डोरी’ अथवा ‘उसकी विरासत में बाँटकर मिला भाग।’ इब्रानी חֶבֶל का शाब्दिक अर्थ नापने की रस्सी हो सकता है और विस्तार से वह नापकर बाँटे गए हिस्से को भी दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֵלֶק
  choice: भाग
  rationale: यह किसी को मिले भाग या हिस्से को दर्शाता है और पद की विरासत-विषयक समानांतरता बनाए रखता है।
- source_word: יְהֹוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को लिप्यंतरित करके सुरक्षित रखा गया है।
- source_word: עַמּוֹ
  choice: उसकी प्रजा
  rationale: यह वाचा के संबंध में याहवे से जुड़ी सामूहिक प्रजा को व्यक्त करता है; ‘प्रजा’ आधुनिक हिन्दी में गरिमापूर्ण और सहज है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: मूल पाठ के पितृपुरुष-संबंधी नाम को ज्यों का त्यों रखा गया है; इसे व्याख्यात्मक रूप से ‘इस्राएल’ नहीं बनाया गया।
- source_word: חֶבֶל
  choice: हिस्सा
  rationale: शब्द का मूल अर्थ नापने की रस्सी हो सकता है और उससे किसी को नापकर मिला भाग भी; संदर्भ में ‘हिस्सा’ समानांतरता और विस्तारित अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נַחֲלָתוֹ
  choice: उसकी विरासत
  rationale: यह विरासत में प्राप्त स्थायी अधिकार या संपत्ति का बिंब बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में विशिष्ट ईश्वरीय नाम है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय प्रत्यक्ष रूप में प्रस्तुत करता है।
- issue: יַעֲקֹב को सामूहिक अर्थ में प्रस्तुत करना
  choice: याकूब
  alternative: इस्राएल
  rationale: यहाँ नाम पूरी वाचा-प्रजा को सूचित करता है, फिर भी मूल काव्यात्मक शब्दावली और समानांतरता बचाने के लिए ‘याकूब’ रखा गया है।
- issue: חֶבֶל की बहुअर्थक विरासत-छवि
  choice: हिस्सा
  alternative: नापने की डोरी / बाँटकर मिला भाग
  rationale: मुख्य पाठ में संदर्भानुकूल अर्थ दिया गया है, जबकि शब्द की ठोस छवि और वैकल्पिक विस्तारित अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो समानांतर काव्य-पंक्तियाँ और ‘भाग/हिस्सा’ की पुनरुक्त विरासत-छवि सुरक्षित हैं; अर्धविराम दोनों कथनों का घनिष्ठ संबंध दिखाता है।
