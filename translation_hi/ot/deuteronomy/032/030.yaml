id: DEU.32.30
reference: Deuteronomy 32:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵיכָ֞ה יִרְדֹּ֤ף אֶחָד֙ אֶ֔לֶף וּ/שְׁנַ֖יִם יָנִ֣יסוּ רְבָבָ֑ה אִם לֹא֙ כִּי צוּרָ֣/ם מְכָרָ֔/ם וַֽ/יהוָ֖ה הִסְגִּירָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/030.yaml
  text: How could one pursue a thousand[a], and two put ten thousand to flight, unless their Rock had sold them, and Yahweh had given them up?
translation:
  language: hi
  text: 'भला एक जन हज़ार का पीछा कैसे कर सकता था,

    और दो जन दस हज़ार को कैसे भगा सकते थे,

    सिवाय इसके कि उनकी चट्टान ने उन्हें बेच दिया था

    और याहवे ने उन्हें सौंप दिया था[a]?


    [a] या, “उन्हें दूसरों के हाथ कर दिया था।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें दूसरों के हाथ कर दिया था।”
    reason: הִסְגִּירָם का वैकल्पिक अर्थ ‘किसी दूसरे के अधिकार में/हाथ कर देना’ है।
lexical_decisions:
- source_word: אֵיכָה
  choice: कैसे कर सकता था
  rationale: यह विस्मय और असंभवता व्यक्त करने वाला आलंकारिक प्रश्न है; यह प्रयोग उस भाव को स्वाभाविक आधुनिक हिन्दी में सामने लाता है।
- source_word: יִרְדֹּף
  choice: पीछा कर सकता था
  rationale: רדף का सामान्य सैन्य अर्थ ‘पीछा करना’ है; सम्भावनार्थक रूप प्रश्न की विस्मयात्मक शक्ति को व्यक्त करता है।
- source_word: אֶחָד אֶלֶף
  choice: एक जन हज़ार का
  rationale: मूल पाठ में एक योद्धा और हज़ार लोगों के बीच का असाधारण अनुपात ज्यों का त्यों रखा गया है।
- source_word: וּשְׁנַיִם
  choice: और दो जन
  rationale: समानांतर पंक्ति के सरल समन्वय और मानवीय कर्ता को स्पष्ट रूप में सुरक्षित रखता है।
- source_word: יָנִיסוּ
  choice: भगा सकते थे
  rationale: נוּס के हिफ़ील रूप का कारणवाचक अर्थ ‘भागने पर विवश करना’ है; ‘भगाना’ इसका संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: רְבָבָה
  choice: दस हज़ार
  rationale: यहाँ निश्चित संख्यात्मक अर्थ उपयुक्त है और आधुनिक पाठक के लिए ‘असंख्य’ जैसे सामान्यीकरण से अधिक सटीक है।
- source_word: אִם לֹא כִּי
  choice: यदि ... न ... होता
  rationale: यह असम्भव दिखने वाली सैन्य पराजय का एकमात्र कारण प्रस्तुत करता है; हिन्दी की प्रतिकल्पनात्मक शर्त मूल के अर्थ को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: צוּרָם
  choice: उनकी चट्टान
  rationale: व्यवस्थाविवरण 32 में ‘चट्टान’ इस्राएल के परमेश्वर के लिए प्रयुक्त रूपकात्मक उपाधि है; रूपक को समझाकर बदलने के बजाय सुरक्षित रखा गया है।
- source_word: מְכָרָם
  choice: उन्हें बेच न दिया होता
  rationale: מכר का सीधा अर्थ ‘बेचना’ है और न्याय के प्रसंग में यह शत्रु के हाथ कर देने का रूपक है; अनुवाद उस कठोर रूपक को बनाए रखता है।
- source_word: וַיהוָה
  choice: और याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम יהוה है; उसे उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: הִסְגִּירָם
  choice: उन्हें सौंप न दिया होता
  rationale: यहाँ סגר का हिफ़ील किसी को दूसरे के अधिकार में सौंप देने का अर्थ रखता है; ‘सौंप देना’ स्पष्ट है और मूल में अनुल्लिखित शत्रुओं को मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ वाचा-नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: צוּר को ईश्वरीय उपाधि/रूपक के रूप में रखना
  choice: उनकी चट्टान
  alternative: उनका परमेश्वर; उनका रक्षक
  rationale: गीत के निकटवर्ती प्रसंग में ‘चट्टान’ परमेश्वर के लिए बार-बार प्रयुक्त विशिष्ट रूपक है। इसे बनाए रखने से मूल की काव्यात्मक और धर्मवैचारिक धार बनी रहती है।
- issue: पराजय में परमेश्वर की सक्रिय न्यायकारी भूमिका
  choice: बेच न दिया होता ... सौंप न दिया होता
  alternative: उन्हें पराजित होने न दिया होता
  rationale: मूल दोनों क्रियाओं द्वारा परमेश्वर की सक्रिय कार्रवाई व्यक्त करता है। उसे केवल अनुमति देने की भाषा में नरम करना मूल के धर्मवैचारिक तनाव को घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक समानांतरता के अनुकूल रखी गई है। ‘एक जन/दो जन’ सामान्य पाठक के लिए स्पष्ट है और पद की लय भी बचाता है। ‘चट्टान’ तथा ‘बेचना’ जैसे मूल रूपकों को व्याख्यात्मक पदों से नहीं बदला गया।
