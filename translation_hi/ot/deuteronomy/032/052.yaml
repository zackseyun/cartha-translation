base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/052.yaml
  text: For you shall see the land from a distance[a], but you shall not go there[b], into the land that I am giving to the sons of Israel.
translation:
  language: hi
  text: क्योंकि तुम उस देश को दूर से देखोगे[a], पर उस देश में प्रवेश नहीं करोगे, जिसे मैं इस्राएल के पुत्रों[b] को दे रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सामने से” अथवा “दूसरी ओर से”; इब्रानी पद बताता है कि मूसा देश को देखेगा, लेकिन उसमें प्रवेश नहीं करेगा।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों” है; यह पद पूरे इस्राएली समुदाय के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִנֶּגֶד
  choice: दूर से
  rationale: यह पद सामने अथवा दूसरी ओर रहकर देखने का भाव देता है—मूसा देश को देखेगा, पर उसमें प्रवेश नहीं करेगा। ‘दूर से’ आधुनिक हिन्दी में इस आशय को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: תִּרְאֶה
  choice: देखोगे
  rationale: द्वितीय पुरुष एकवचन अपूर्ण क्रिया यहाँ भविष्यवाचक है और मूसा से किए गए परमेश्वर के गंभीर कथन को व्यक्त करती है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: संदर्भ में אֶרֶץ उस विशिष्ट देश को सूचित करता है जिसे परमेश्वर इस्राएल को दे रहा है; ‘देश’ हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: וְשָׁמָּה לֹא תָבֹא אֶל הָאָרֶץ
  choice: पर उस देश में प्रवेश नहीं करोगे
  rationale: בוא और אֶל का संयुक्त भाव गंतव्य के भीतर जाने का है। ‘प्रवेश नहीं करोगे’ अनावश्यक पुनरुक्ति के बिना निषिद्ध प्रवेश को स्पष्ट करता है।
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: जिसे मैं ... दे रहा हूँ
  rationale: वर्तमान कृदंत נֹתֵן परमेश्वर के निकट अथवा प्रगतिशील दान को व्यक्त करता है; ‘दे रहा हूँ’ इस पक्ष को बनाए रखता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों को
  rationale: यह इब्रानी के व्याकरणिक रूप और पारंपरिक वाचा-संबंधी राष्ट्रीय पदनाम को निकटता से बनाए रखता है, यद्यपि संदर्भ पूरे इस्राएली समुदाय का है।
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל का लिंगयुक्त वाचा-संबंधी पदनाम
  choice: इस्राएल के पुत्रों
  alternative: इस्राएल की संतान; इस्राएली लोग
  rationale: मूल पाठ में व्याकरणिक रूप पुल्लिंग बहुवचन है और यह पूरे वाचा-समुदाय का प्रचलित राष्ट्रीय पदनाम है। मुख्य पाठ में मूल रूप को बनाए रखा गया है और पादटिप्पणी में उसके सामूहिक आशय को स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर किंतु सहज शैली अपनाई गई है। मूसा को संबोधित एकवचन के लिए सम्मानरहित ‘तू’ के स्थान पर सामान्य आधुनिक ‘तुम’ प्रयोग किया गया है। वाक्य विन्यास हिन्दी की स्वाभाविकता के अनुसार रखा गया है, जबकि मूल पाठ का भविष्यवाचक निषेध और देश दिए जाने की प्रगतिशील अभिव्यक्ति सुरक्षित है।
