base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/002.yaml
  text: May my teaching fall like the rain[a]; may my speech drip like the dew, like showers upon the tender grass[b], and like abundant rain upon the green plants.
translation:
  language: hi
  text: 'मेरी शिक्षा वर्षा के समान बरसे[a],

    मेरी वाणी ओस के समान टपके;

    कोमल घास पर फुहारों के समान[b],

    और हरी वनस्पति पर भरपूर वर्षा के समान।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बूंद-बूंद गिरे” अथवा “झरे”; इब्रानी क्रिया मेरी शिक्षा को वर्षा की तरह नीचे उतरते हुए चित्रित करती है।
    reason: lexical_alternative
  - marker: b
    text: “फुहारों” के लिए प्रयुक्त इब्रानी शब्द दुर्लभ है; इसका अर्थ हल्की वर्षा या वर्षा की बूंदें भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרֹף
  choice: बरसे
  rationale: यह क्रिया बूंदों के रूप में नीचे उतरने का चित्र प्रस्तुत करती है। वर्षा की उपमा के साथ ‘बरसे’ स्वाभाविक हिंदी है और काव्यात्मक बिंब बनाए रखता है।
- source_word: לִקְחִי
  choice: मेरी शिक्षा
  rationale: לֶקַח यहाँ सीखी हुई बात मात्र नहीं, बल्कि दी जाने वाली शिक्षा या उपदेश को दर्शाता है।
- source_word: תִּזַּל
  choice: टपके
  rationale: נזל बहने या बूंद-बूंद टपकने का अर्थ दे सकता है। ओस की उपमा के साथ ‘टपके’ कोमल नमी का बिंब सुरक्षित रखता है।
- source_word: אִמְרָתִי
  choice: मेरी वाणी
  rationale: यह शब्द कथन, उक्ति या वचन को दर्शाता है। ‘वाणी’ काव्यात्मक संदर्भ में स्वाभाविक है और ‘मेरी शिक्षा’ के समानांतर बोली गई बात को व्यक्त करता है।
- source_word: שְׂעִירִם
  choice: फुहारों
  rationale: यह दुर्लभ और अर्थ की दृष्टि से विवादित शब्द संदर्भ में हल्की वर्षा, फुहारों या वर्षा की बूंदों को सूचित करता है। ‘फुहारों’ से हल्की वर्षा का बिंब स्पष्ट रहता है।
- source_word: דֶשֶׁא
  choice: कोमल घास
  rationale: דֶשֶׁא नई उगी हुई हरियाली या ताजी घास को दर्शाता है। ‘कोमल घास’ उस नाजुक नई वृद्धि का भाव व्यक्त करता है।
- source_word: רְבִיבִים
  choice: भरपूर वर्षा
  rationale: यह शब्द प्रचुर वर्षा या घनी बौछारों को दर्शाता है। ‘भरपूर वर्षा’ हल्की फुहारों से अधिक प्रचुर नमी की ओर काव्यात्मक प्रगति को बनाए रखता है।
- source_word: עֵשֶׂב
  choice: हरी वनस्पति
  rationale: עֵשֶׂב केवल घास नहीं, बल्कि व्यापक रूप से उगने वाले पौधों या वनस्पति को दर्शाता है। ‘हरी वनस्पति’ पहले प्रयुक्त ‘घास’ से इसे अलग रखते हुए सहज हिंदी देती है।
