base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/025.yaml
  text: Outside[a], the sword will bereave; and in the inner rooms, terror—both young man and virgin[b], nursing child together with gray-haired man.
translation:
  language: hi
  text: बाहर तलवार लोगों को शोकाकुल करेगी, और कमरों के भीतर[a] आतंक होगा—जवान और कुँवारी[b] दोनों, दूध-पीता बच्चा और सफेद बालों वाला पुरुष भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और कमरों से आतंक”; इब्रानी में बाहर के खतरे और घर के भीतर के आतंक का विरोध है।
    reason: lexical_alternative
  - marker: b
    text: “कुँवारी” के लिए इब्रानी शब्द בְּתוּלָה (बतूला) है, जो किसी अविवाहित युवती को बताता है और प्रायः उसके कौमार्य का भाव भी रखता है; “युवती” एक संभव अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ
  choice: बाहर
  rationale: यह संक्षिप्त और स्वाभाविक रूप अगले पदबंध में आए भीतरी कमरों के साथ स्पष्ट स्थानगत विरोध बनाए रखता है।
- source_word: תְּשַׁכֶּל
  choice: लोगों को अपनों से वंचित करेगी
  rationale: पिएल रूप का अर्थ संतानहीन करना या शोकित करके प्रियजनों से वंचित करना है। हिन्दी में केवल ‘संतानहीन करेगी’ सूची में आए सभी आयु-वर्गों पर अस्वाभाविक ढंग से सीमित प्रतीत होता; चुना हुआ रूप युद्ध में तलवार से होने वाले वियोग और मूल की व्यक्तिवाचक शक्ति को स्पष्ट रखता है।
- source_word: חֶרֶב
  choice: तलवार
  rationale: युद्ध और मृत्यु की परिचित, व्यक्तिवाचक छवि को सीधे बनाए रखता है।
- source_word: וּמֵחֲדָרִים
  choice: और भीतरी कमरों में
  rationale: मूल में מִן का शाब्दिक अर्थ ‘से’ है, पर यहाँ बाहर और घर के भीतर का स्थानगत विरोध अभिप्रेत है। ‘भीतरी कमरों में’ आधुनिक हिन्दी में स्वाभाविक है; शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֵימָה
  choice: आतंक
  rationale: यह प्रबल भय को संक्षिप्त, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: גַּם בָּחוּר גַּם בְּתוּלָה
  choice: जवान और कुँवारी दोनों
  rationale: दोनों समानांतर גַּם का बल ‘दोनों’ से व्यक्त होता है। ‘कुँवारी’ בְּתוּלָה की अविवाहित युवती और प्रायः निहित कौमार्य की विशिष्टता को बनाए रखता है।
- source_word: יוֹנֵק
  choice: दूध-पीता बच्चा
  rationale: कृदंत का जीवंत अर्थ सुरक्षित रखते हुए यह ‘शिशु’ से अधिक चित्रात्मक और सामान्य पाठक के लिए सहज है।
- source_word: עִם אִישׁ שֵׂיבָה
  choice: और पके बालों वाला पुरुष भी
  rationale: यह שֵׂיבָה के धूसर या सफेद बालों वाले वृद्ध पुरुष के ठोस चित्र को बनाए रखता है और ‘भी’ से सूची की समावेशी समानांतरता व्यक्त करता है।
