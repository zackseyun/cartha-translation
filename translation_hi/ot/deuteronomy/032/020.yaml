source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַסְתִּ֤ירָה פָנַ/י֙ מֵ/הֶ֔ם אֶרְאֶ֖ה מָ֣ה אַחֲרִיתָ֑/ם כִּ֣י ד֤וֹר תַּהְפֻּכֹת֙ הֵ֔מָּה בָּנִ֖ים לֹא אֵמֻ֥ן בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/020.yaml
  text: And he said[a], “I will hide my face from them; I will see what their end will be, for they are a perverse generation[b], children in whom there is no faithfulness.”
translation:
  language: hi
  text: और उसने कहा, “मैं उनसे अपना मुख छिपा लूँगा; मैं देखूँगा कि उनका अंत क्या होगा। क्योंकि वे टेढ़ी और विकृत पीढ़ी[a] हैं, ऐसी सन्तान जिनमें निष्ठा नहीं है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विकृतियों की पीढ़ी।” इब्रानी पदबंध का शाब्दिक अर्थ “विकृतियों/टेढ़ेपन की पीढ़ी” है।
    reason: lexical_alternative
  - marker: b
    text: या “जिनमें भरोसेमंदी नहीं है” अथवा “जिनमें विश्वासयोग्यता नहीं है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְתִּירָה פָנַי מֵהֶם
  choice: मैं उनसे अपना मुख छिपा लूँगा
  rationale: ‘मुख छिपाना’ इब्रानी वाचा-संबंधी मुहावरे को बनाए रखता है, जिसमें अनुग्रह या उपस्थिति हटा लेने का भाव है; इसे केवल ‘उनसे दूर हो जाऊँगा’ कहकर सपाट नहीं किया गया।
- source_word: אֶרְאֶה מָה אַחֲרִיתָם
  choice: मैं देखूँगा कि उनका अन्त क्या होगा
  rationale: אַחֲרִית का अर्थ अन्त, भावी दशा या परिणाम हो सकता है। ‘अन्त’ मूल की संक्षिप्तता और गंभीरता को सुरक्षित रखता है।
- source_word: דּוֹר תַּהְפֻּכֹת
  choice: विकृतियों से भरी पीढ़ी
  rationale: תַּהְפֻּכֹת बहुवचन संज्ञा है और नैतिक विकृतियों, टेढ़ेपन या उलटावों को सूचित करती है। यह हिन्दी प्रयोग मूल के बहुवचन का बल रखते हुए स्वाभाविक भी है।
- source_word: בָּנִים
  choice: बच्चे
  rationale: यहाँ शब्द का आशय लोगों से परमेश्वर की सन्तान के रूप में है; ‘बच्चे’ सामान्य और लिंग-समावेशी अर्थ को व्यक्त करता है।
- source_word: לֹא אֵמֻן בָּם
  choice: जिनमें विश्वासयोग्यता नहीं है
  rationale: אֵמֻן विश्वसनीयता, निष्ठा या भरोसेमंदी को सूचित करता है। ‘विश्वासयोग्यता’ यहाँ केवल मानसिक विश्वास नहीं, बल्कि सम्बन्धपरक और वाचा-संबंधी भरोसेमंदी व्यक्त करती है।
theological_decisions:
- issue: परमेश्वर के ‘मुख’ का मानवरूपी वाचा-संबंधी मुहावरा
  choice: मैं उनसे अपना मुख छिपा लूँगा
  alternative: मैं उनसे मुँह फेर लूँगा / मैं उनसे दूर हो जाऊँगा
  rationale: मूल मुहावरे को रखने से परमेश्वर के अनुग्रह या उपस्थिति के हटने का धार्मिक भार और पाठ का तनाव सुरक्षित रहता है, जबकि उसके ढंग की अतिरिक्त व्याख्या नहीं की जाती।
- issue: אֵמֻן का अर्थ
  choice: विश्वासयोग्यता
  alternative: निष्ठा / भरोसेमंदी
  rationale: सन्दर्भ में दोष अमूर्त ‘विश्वास’ की कमी से अधिक सम्बन्धपरक और वाचा-संबंधी अविश्वसनीयता का है; फिर भी वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मुख छिपाना’ और ‘अन्त’ जैसे बाइबलीय पद मूल की औपचारिक तथा वाचा-संबंधी गूँज बनाए रखते हैं; कठिन इब्रानी बहुवचन को मुख्य पाठ में स्वाभाविक हिन्दी और पादटिप्पणी में अधिक शाब्दिक रूप दिया गया है।
