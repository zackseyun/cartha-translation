base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/019.yaml
  text: And Yahweh saw and rejected them, provoked to anger by his sons and daughters[a].
translation:
  language: hi
  text: याहवे ने देखा और अपने बेटे-बेटियों के उकसाने से क्रोधित होकर उन्हें ठुकरा दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनका तिरस्कार किया।” इब्रानी क्रिया में अपमानपूर्वक ठुकराने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के वाचा-संबंधी व्यक्तिगत नाम को प्रचलित हिंदी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: וַיַּרְא
  choice: ने यह देखा
  rationale: ראה के सामान्य अर्थ ‘देखना’ को स्वाभाविक हिंदी में रखा गया है; ‘यह’ पूर्ववर्ती प्रसंग की ओर संकेत करता है।
- source_word: וַיִּנְאָץ
  choice: उन्हें ठुकरा दिया
  rationale: נאץ में केवल अस्वीकार करने से अधिक, तिरस्कार के साथ ठुकराने का भाव हो सकता है। हिंदी में ‘ठुकरा दिया’ इस संबंध-विच्छेद और कठोर प्रतिक्रिया को स्वाभाविक रूप से व्यक्त करता है। कर्म इब्रानी में निहित है और प्रसंग के आधार पर ‘उन्हें’ के रूप में स्पष्ट किया गया है।
- source_word: מִכַּעַס
  choice: के कारण क्रोधित होकर
  rationale: כעס क्रोध उत्पन्न करने वाली उत्तेजना या खीझ को व्यक्त करता है और מִן यहाँ कारण बताता है। यह वाक्यांश हिंदी में कारण और याहवे के क्रोध, दोनों को स्पष्ट तथा सहज रूप में रखता है।
- source_word: בָּנָיו וּבְנֹתָיו
  choice: अपने बेटे-बेटियों
  rationale: इब्रानी पाठ पुत्रों और पुत्रियों, दोनों का स्पष्ट उल्लेख करता है। ‘बेटे-बेटियों’ उसी लैंगिक विशिष्टता को संक्षिप्त और स्वाभाविक आधुनिक हिंदी में सुरक्षित रखता है।
theological_decisions:
- issue: וַיִּנְאָץ का निहित कर्म
  choice: प्रसंगानुसार इस्राएल/उसके लोगों को ‘उन्हें’ के रूप में स्पष्ट करना
  alternative: 'कर्म को अनकहा छोड़ना: ‘याहवे ने देखा और ठुकरा दिया’'
  rationale: हिंदी में ‘ठुकराना’ के साथ कर्म अपेक्षित है और निकटवर्ती प्रसंग स्पष्ट करता है कि आशय उन्हीं लोगों से है। इससे कोई नया धर्मवैज्ञानिक दावा नहीं जोड़ा जाता।
- issue: परमेश्वर के क्रोध और अस्वीकार की अभिव्यक्ति
  choice: ‘क्रोधित होकर’ और ‘ठुकरा दिया’
  alternative: अधिक तीव्र ‘उनसे घृणा की’ अथवा अपेक्षाकृत निर्बल ‘उन्हें स्वीकार नहीं किया’
  rationale: चुनी हुई भाषा वाचा-विरोधी आचरण पर वास्तविक ईश्वरीय क्रोध और न्याय को न तो नरम करती है, न उपलब्ध शब्दार्थ से आगे बढ़ाकर अतिरंजित करती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और पाठयोग्य रूप अपनाया गया है। ‘अपने’ से बेटे-बेटियों का संबंध याहवे से स्पष्ट होता है, जबकि वाक्य की कारणात्मक संरचना और ईश्वरीय प्रतिक्रिया सुरक्षित रहती है।
