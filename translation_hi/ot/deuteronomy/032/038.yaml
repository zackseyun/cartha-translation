  yaml_path: translation/ot/deuteronomy/032/038.yaml
  text: who ate the fat of their sacrifices and drank the wine of their drink offerings—let them rise up and help you; let them be your shelter.
translation:
  language: hi
  text: जो उनके बलिदानों की चरबी खाते और उनकी पेय-भेंटों का दाखमधु पीते हैं—वे उठें और तुम्हारी सहायता करें; वह तुम्हारे लिए आश्रय हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵלֶב זְבָחֵימוֹ
  choice: उनके बलिदानों की चरबी
  rationale: ‘חֵלֶב’ का मूल अर्थ चरबी है और ‘זְבָחֵימוֹ’ उनके बलिदानों को सूचित करता है; व्यंग्यात्मक संदर्भ को बिना विस्तार दिए सीधे रखा गया है।
- source_word: יֵין נְסִיכָם
  choice: उनके अर्घों का दाखमधु
  rationale: ‘נֶסֶךְ’ उंडेली जाने वाली पेय-भेंट है; ‘अर्घ’ संक्षिप्त और उपासना-संदर्भ के अनुकूल है, जबकि ‘दाखमधु’ יֵין को स्पष्ट करता है।
- source_word: סִתְרָה
  choice: शरण
  rationale: यह संज्ञा छिपने या संरक्षण के स्थान को दर्शाती है; यहाँ ‘शरण’ स्वाभाविक हिंदी में सुरक्षा देने वाले आश्रय का भाव रखता है।
theological_decisions:
- issue: झूठे देवताओं के लिए बहुवचन आदेश
  choice: वे उठें और तुम्हारी सहायता करें
  alternative: उसे उठकर तुम्हारी सहायता करने दो
  rationale: क्रियाएँ יָקוּמוּ और יַעְזְרֻכֶם बहुवचन हैं और पूर्ववर्ती संदर्भ कथित देवताओं की ओर संकेत करता है; इसलिए बहुवचन बनाए रखा गया है।
- issue: अंतिम वाक्य में व्यंग्य और कर्ता
  choice: वे ही तुम्हारे लिए शरण बनें
  alternative: वे तुम्हें आश्रय दें
  rationale: मूल का יְהִי रूप व्याकरणतः एकवचन है, यद्यपि अर्थगत संदर्भ बहुवचन देवताओं का है; हिंदी में अर्थ-संगति हेतु बहुवचन रखा गया और ‘ही’ ने चुनौतीपूर्ण व्यंग्य को स्वाभाविक ढंग से उभारा, बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के।
translation_notes:
  register: आधुनिक मानक हिंदी, काव्यात्मक और गरिमामय शैली। पद की व्यंग्यात्मक चुनौती सुरक्षित रखी गई है। ‘अर्घ’ सामान्य पाठक के लिए कुछ औपचारिक है, पर बलिदान और उपासना के प्रसंग में सटीक तथा संक्षिप्त है।
