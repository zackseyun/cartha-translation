base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/021.yaml
  text: They made me jealous with what is not a god[a]; they provoked me to anger with their idols. So I will make them jealous with those who are not a people[c][b]; I will provoke them to anger with a foolish nation.
translation:
  language: hi
  text: 'उन्होंने उस चीज़ से, जो ईश्वर नहीं है, मुझमें ईर्ष्या जगाई;

    उनकी व्यर्थ वस्तुओं[a] से मुझे क्रोधित किया।

    इसलिए मैं भी ऐसे लोगों के द्वारा, जो प्रजा नहीं हैं[b], उनमें ईर्ष्या जगाऊँगा;

    एक मूर्ख राष्ट्र[c] के द्वारा उन्हें क्रोधित करूँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी मूर्तियों” अथवा “उनकी खोखली/निरर्थक वस्तुओं”; इब्रानी शब्द का अर्थ वाष्प, खोखलापन या व्यर्थता हो सकता है और इस संदर्भ में मूर्तियों का भी संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “एक न-प्रजा के द्वारा”; यह अभिव्यक्ति “जो ईश्वर नहीं है” के साथ जानबूझकर समानांतर है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ “मूर्ख” मुख्यतः नैतिक और आत्मिक विवेकहीनता बताता है, केवल बुद्धि की कमी नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: קִנְאוּנִי / אַקְנִיאֵם
  choice: मुझमें जलन भड़काई / उनमें जलन भड़काऊँगा
  rationale: दोनों सम्बद्ध क्रियाओं की पारस्परिक समरूपता बनाए रखी गई है। ‘जलन भड़काना’ यहाँ ईर्ष्या अथवा प्रबल स्पर्धात्मक रोष जगाने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּלֹא אֵל
  choice: उस चीज़ से, जो ईश्वर नहीं है
  rationale: यह अनुवाद सच्चे ईश्वर के विपरीत किसी ऐसी पूजित वस्तु का स्पष्ट निषेध करता है जो वास्तव में ईश्वर नहीं, और इब्रानी की तीखी अभिव्यक्ति को बनाए रखता है।
- source_word: כִּעֲסוּנִי / אַכְעִיסֵם
  choice: मुझे क्रोधित किया / उन्हें क्रोधित करूँगा
  rationale: कारक अर्थ और पद की प्रतिशोधात्मक समानांतर रचना दोनों को सीधी, वर्तमान हिन्दी में रखा गया है।
- source_word: בְּהַבְלֵיהֶם
  choice: अपनी व्यर्थ वस्तुओं
  rationale: הבל का मूल भाव वाष्प, खोखलापन और व्यर्थता है; सन्दर्भ में ये मूर्तियाँ अथवा झूठे देवता हैं। मुख्य पाठ मूल बिंब को बचाता है और पादटिप्पणी सन्दर्भ स्पष्ट करती है।
- source_word: בְּלֹא עָם
  choice: ऐसे लोगों के द्वारा, जो कोई प्रजा नहीं हैं
  rationale: ‘जो ईश्वर नहीं है’ के साथ जानबूझकर बनाए गए ‘न-प्रजा’ समानांतर को यथासम्भव सुरक्षित रखते हुए हिन्दी में बोधगम्य बनाया गया है।
- source_word: בְּגוֹי נָבָל
  choice: एक मूर्ख राष्ट्र
  rationale: נבל केवल कम बुद्धि नहीं, बल्कि नैतिक और आत्मिक विवेकहीनता भी बताता है; ‘मूर्ख’ प्रत्यक्ष अर्थ को रखता है और पादटिप्पणी उसका आशय सीमित करती है।
theological_decisions:
- issue: ‘जो कोई प्रजा नहीं हैं’ और ‘मूर्ख राष्ट्र’ का सन्दर्भ
  choice: मुख्य पाठ में किसी विशिष्ट ऐतिहासिक राष्ट्र या समुदाय की पहचान नहीं की गई।
  alternative: इसे किसी खास गैर-इस्राएली राष्ट्र अथवा समस्त गैर-यहूदियों के रूप में स्पष्ट करना।
  rationale: इब्रानी पद राष्ट्र का नाम नहीं बताता। सामान्य अभिव्यक्ति मूल की धार्मिक और न्याय-संबंधी तनावपूर्ण अस्पष्टता को बिना बाद की व्याख्या आरोपित किए बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। काव्यात्मक चार-पंक्ति समानांतरता तथा ‘उन्होंने… इसलिए मैं भी…’ की न्यायात्मक पारस्परिकता सुरक्षित है। ‘प्रजा’ और ‘राष्ट्र’ से עם तथा גוי का भेद यथासम्भव व्यक्त किया गया है।
