  text: הֲ לַ/יְהוָה֙ תִּגְמְלוּ זֹ֔את עַ֥ם נָבָ֖ל וְ/לֹ֣א חָכָ֑ם הֲ/לוֹא הוּא֙ אָבִ֣י/ךָ קָּנֶ֔/ךָ ה֥וּא עָֽשְׂ/ךָ֖ וַֽ/יְכֹנְנֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/006.yaml
  text: Is this how you repay Yahweh[a], O foolish and unwise people? Is he not your Father, who created you? He made you and established you.
translation:
  language: hi
  text: 'हे मूर्ख और विवेकहीन प्रजा,


    क्या तुम याहवे को ऐसा प्रतिदान देते हो?


    क्या वह तुम्हारा पिता नहीं है,


    जिसने तुम्हें अपना किया[a]?


    उसी ने तुम्हें बनाया और स्थापित किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जिसने तुम्हें उत्पन्न किया’ अथवा ‘जिसने तुम्हें मोल लिया।’ इब्रानी क्रिया का अर्थ प्राप्त करना, अधिकार में रखना, मोल लेना, या कुछ संदर्भों में उत्पन्न करना हो सकता है।
    reason: कנה की वास्तविक शब्दार्थगत बहुअर्थकता को सुरक्षित रखना।
lexical_decisions:
- source_word: תִּגְמְלוּ זֹאת
  choice: इसी तरह बदला देते हो
  rationale: गמל का आशय किसी के व्यवहार के प्रत्युत्तर में उसे वैसा प्रतिफल देना है। धिक्कारपूर्ण आलंकारिक प्रश्न में ‘बदला देते हो’ स्वाभाविक हिन्दी में अनुचित प्रत्युत्तर का भाव व्यक्त करता है; ‘इसी तरह’ זֹאת के रीति-सूचक बल को स्पष्ट करता है।
- source_word: עַם נָבָל וְלֹא חָכָם
  choice: हे मूर्ख और विवेकहीन प्रजा
  rationale: נָבָל केवल बौद्धिक कमी नहीं, बल्कि नैतिक मूर्खता का भी बोध कराता है। ‘मूर्ख’ उस अर्थ को बनाए रखता है और ‘विवेकहीन’ לֹא חָכָם का स्वाभाविक हिन्दी रूप है। ‘हे’ प्रत्यक्ष संबोधन को दर्शाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: אָבִיךָ
  choice: तुम्हारा पिता
  rationale: इब्रानी पाठ परमेश्वर को इस्राएल का पिता कहता है। हिन्दी में ‘पिता’ संबंधपरक और वाचा-संबंधी कथन को सीधे बनाए रखता है।
- source_word: קָּנֶךָ
  choice: जिसने तुम्हें अपना बनाया
  rationale: קנה के अर्थ-क्षेत्र में प्राप्त करना, अधिकार में लेना, मोल लेना और कुछ संदर्भों में उत्पन्न करना शामिल हैं। ‘अपना बनाया’ परमेश्वर द्वारा इस्राएल को अपनी प्रजा बनाने का भाव देता है और अगले ‘बनाया’ से कुछ शब्दार्थगत भेद भी रखता है।
- source_word: עָשְׂךָ
  choice: तुम्हें बनाया
  rationale: עשה यहाँ परमेश्वर द्वारा इस्राएल को बनाने या प्रजा के रूप में गढ़ने का सीधा बोध देता है।
- source_word: וַיְכֹנְנֶךָ
  choice: स्थापित किया
  rationale: כון यहाँ स्थिर करने, सुदृढ़ करने या व्यवस्थित रूप से स्थापित करने का अर्थ देता है। ‘स्थापित किया’ इस सामूहिक संदर्भ में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर और इस्राएल के संबंध में קנה का अर्थ
  choice: जिसने तुम्हें अपना बनाया
  alternative: जिसने तुम्हें उत्पन्न किया; जिसने तुम्हें मोल लिया; जिसने तुम्हें प्राप्त किया
  rationale: मूल क्रिया कई अर्थ ग्रहण कर सकती है। अगले दो उपवाक्यों में ‘बनाया’ और ‘स्थापित किया’ आने के कारण मुख्य पाठ में ऐसा रूप चुना गया है जो परमेश्वर के अधिकार और इस्राएल के उसके अपने होने को व्यक्त करे, जबकि महत्वपूर्ण वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- issue: परमेश्वर का पितृत्व
  choice: तुम्हारा पिता
  alternative: तुम्हारा जनक
  rationale: पाठ स्वयं परमेश्वर को इस्राएल का पिता कहता है। ‘पिता’ मूल संबंधपरक भाषा को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। पद्यात्मक समानांतरता के लिए पंक्ति-विभाजन किया गया है। सामूहिक ‘प्रजा’ को संबोधित करते हुए पूरे पद में प्रचलित ‘तुम’ रूप रखा गया है।
