  text: उसी दिन ही याहवे[a] ने मूसा से कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: “YHWH,” अर्थात “याहवे”; परंपरागत रूप से इसका अनुवाद “प्रभु” किया जाता है। अन्य प्रचलित रूप “यहोवा” है।'
    reason: परमेश्वर के नाम के वैकल्पिक पारंपरिक रूपों और अनुवाद से पाठक को अवगत कराना।
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: यह कथानक को आगे बढ़ाने वाला सामान्य कथन-क्रिया रूप है। हिन्दी में अगले לֵאמֹר के साथ इसे स्वाभाविक रूप से एक ही वाक्यांश में समेटकर “ने…कहा” करना सहज और अर्थनिष्ठ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम יהוה को उपाधि से बदलने के बजाय उसके प्रचलित उच्चारणानुसार लिप्यंतरित किया गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: बोलने की क्रिया के साथ אֶל सम्बोधित व्यक्ति को दर्शाता है; आधुनिक हिन्दी में “मूसा से” स्वाभाविक प्रयोग है।
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: उसी दिन
  rationale: यह मुहावरा ठीक उसी दिन होने पर बल देता है। “उसी दिन” आधुनिक हिन्दी में इस बल को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह आगे आने वाले प्रत्यक्ष कथन की भूमिका बाँधने वाला इब्रानी सूत्र है। हिन्दी में इसे अलग से “यह कहते हुए” कहने के बजाय मुख्य क्रिया “कहा” में समाहित करना अधिक स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम יהוה है। “याहवे” उसका लिप्यंतरण है और इसे केवल उपाधि “प्रभु” से प्रतिस्थापित नहीं करता; उच्चारण की परंपरागत अनिश्चितता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली रखी गई है। इब्रानी के दोहरे वाणी-सूत्र וַיְדַבֵּר…לֵאמֹר को हिन्दी के स्वाभाविक “ने…कहा” में समेटा गया है।
