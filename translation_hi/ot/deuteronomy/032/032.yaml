  edition: WLC
  text: כִּֽי מִ/גֶּ֤פֶן סְדֹם֙ גַּפְנָ֔/ם וּ/מִ/שַּׁדְמֹ֖ת עֲמֹרָ֑ה עֲנָבֵ֨/מוֹ֙ עִנְּבֵי ר֔וֹשׁ אַשְׁכְּלֹ֥ת מְרֹרֹ֖ת לָֽ/מוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/032.yaml
  text: For their vine is from the vine of Sodom, and from the fields of Gomorrah; their grapes are grapes of poison, their clusters are bitter to them.
translation:
  language: hi
  text: 'क्योंकि उनकी दाखलता सदोम की दाखलता से है,

    और अमोरा के खेतों से;

    उनके अंगूर विष के अंगूर हैं,

    और उनके गुच्छे उनके लिए कड़वे हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֶּפֶן / גַּפְנָם
  choice: दाखलता / उनकी दाखलता
  rationale: यहाँ रूपक में फल देने वाली बेल का उल्लेख है; ‘दाखलता’ आधुनिक हिन्दी बाइबलीय भाषा में सटीक और सहज है।
- source_word: שַׁדְמוֹת
  choice: खेतों
  rationale: शब्द कृषि-भूमि या खेतों को दर्शाता है; ‘खेतों’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: רֹאשׁ
  choice: विषैले
  rationale: इस प्रसंग में यह किसी विषैले या कड़वे पदार्थ/पौधे का बोध कराता है। अंगूरों के गुण के रूप में ‘विषैले’ मूल अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְרֹרֹת לָמוֹ
  choice: उनके लिए कड़वे हैं
  rationale: לָמוֹ को स्पष्ट रूप से सुरक्षित रखते हुए विशेषण का विधेयात्मक अनुवाद किया गया है; इससे मूल का ‘उनके लिए/उनको’ भाव नहीं मिटता।
theological_decisions:
- issue: दाखलता, अंगूर और गुच्छों के रूपक की पहचान
  choice: रूपक को बिना व्याख्यात्मक विस्तार के यथावत रखा
  alternative: इसे लोगों के भ्रष्ट चरित्र या कर्मों के रूप में स्पष्ट करना
  rationale: पद स्वयं काव्यात्मक रूपक प्रस्तुत करता है; निहित आशय को मुख्य पाठ में खोलना मूल की साहित्यिक और धर्मवैचारिक बहुअर्थकता को सीमित कर देता।
- issue: לָמוֹ का संबंध
  choice: ‘उनके लिए’ को कड़वे गुच्छों के साथ बनाए रखा
  alternative: सिर्फ ‘उनके गुच्छे कड़वे हैं’
  rationale: मसोराई पाठ में उपस्थित सर्वनामिक तत्व को व्यक्त करना अधिक औपचारिक रूप से निष्ठावान है, यद्यपि हिन्दी में यह कुछ असामान्य लग सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। समानांतर पंक्तियों और कृषि-रूपक को सुरक्षित रखा गया है; किसी संप्रदायगत व्याख्या को नहीं जोड़ा गया।
