base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/017.yaml
  text: They sacrificed to demons[a], not God, to gods they had not known, new ones that had recently come[c][b], whom your fathers had not feared.
translation:
  language: hi
  text: उन्होंने दुष्टात्माओं को बलिदान चढ़ाए[a], परमेश्वर को नहीं—उन देवताओं को जिन्हें वे नहीं जानते थे, नए देवताओं को जो हाल ही में आए थे और जिनसे तुम्हारे पुरखे नहीं डरते थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो ईश्वर नहीं थे।” इब्रानी पद को इस अर्थ में भी समझा जा सकता है कि ये प्राणी सचमुच ईश्वर नहीं थे; संदर्भ उन्हें इस्राएल के सच्चे परमेश्वर के विपरीत रखता है।
    reason: lexical_alternative
  - marker: c
    text: या, “जिनके सामने तुम्हारे पुरखे काँपे नहीं थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ
  choice: उन्होंने बलिदान चढ़ाए
  rationale: זבח का अर्थ बलि देना या चढ़ाना है। यह हिन्दी में स्वाभाविक है और उपासना-संबंधी भाव बनाए रखता है।
- source_word: לַשֵּׁדִים
  choice: दुष्टात्माओं के लिए
  rationale: שֵׁדִים अलौकिक हानिकर प्राणियों को सूचित करता है। ‘दुष्टात्माएँ’ आधुनिक हिन्दी पाठकों के लिए स्पष्ट और स्वाभाविक समतुल्य है।
- source_word: לֹא אֱלֹהַ
  choice: परमेश्वर के लिए नहीं
  rationale: संदर्भ इस्राएल के सच्चे परमेश्वर और झूठे उपास्य देवताओं के बीच विरोध रखता है। हिन्दी में ‘परमेश्वर’ इस विशिष्ट संदर्भ को स्पष्ट करता है।
- source_word: אֱלֹהִים
  choice: देवताओं
  rationale: यहाँ बहुवचन रूप पिछले ‘दुष्टात्माओं’ को उपास्य देवताओं के रूप में पहचानता है; अतः ‘देवताओं’ मूल की पुनरुक्ति और तनाव दोनों बचाता है।
- source_word: לֹא יְדָעוּם
  choice: जिन्हें वे नहीं जानते थे
  rationale: ידע का सीधा अर्थ ‘जानना’ है। हिन्दी में भूतकालीन संदर्भ के भीतर यह वाक्य स्वाभाविक है और ‘मान्यता देना’ जैसी व्याख्या नहीं जोड़ता।
- source_word: חֲדָשִׁים
  choice: नए देवता
  rationale: विशेषण मूल में संज्ञा के रूप में प्रयुक्त है। हिन्दी में केवल ‘नए’ अस्पष्ट हो सकता था, इसलिए पूर्ववर्ती संज्ञा को दोहराकर आशय स्पष्ट किया गया है।
- source_word: מִקָּרֹב בָּאוּ
  choice: जो हाल ही में आए थे
  rationale: यह पदबंध यहाँ स्थानिक निकटता से अधिक हाल के आगमन या परिचय का भाव देता है।
- source_word: לֹא שְׂעָרוּם
  choice: जिनसे ... भयभीत नहीं हुए थे
  rationale: שער/שׂער यहाँ भय या थरथराने का अर्थ देता है। ‘भयभीत नहीं हुए’ स्वाभाविक रहते हुए उस भाव को बनाए रखता है।
- source_word: אֲבֹתֵיכֶם
  choice: तुम्हारे पुरखे
  rationale: यह पितृ-पूर्वजों को संबोधित करता है। ‘पुरखे’ आधुनिक हिन्दी में सामूहिक पुरुष पूर्वजों के लिए सहज और सटीक है।
theological_decisions:
- issue: ‘दुष्टात्माओं’ और ‘देवताओं’ का परस्पर संबंध
  choice: 'दोनों पदों को क्रम से रखा गया: ‘दुष्टात्माओं ... ऐसे देवताओं’'
  alternative: पुनरुक्ति हटाकर केवल ‘दुष्टात्माओं’ या ‘देवताओं’ का प्रयोग
  rationale: इब्रानी पाठ बलिदान के पात्रों को שֵׁדִים और אֱלֹהִים दोनों कहता है, फिर भी उन्हें परमेश्वर से अलग रखता है। दोनों पद बनाए रखने से मूल का धार्मिक विवाद और तनाव सुरक्षित रहता है।
- issue: לֹא אֱלֹהַ में सच्चे परमेश्वर और झूठे उपास्यों का विरोध
  choice: ‘परमेश्वर के लिए नहीं’
  alternative: ‘किसी ईश्वर के लिए नहीं’ या ‘जो देवता नहीं थे’
  rationale: संदर्भ का मुख्य विरोध इस्राएल के परमेश्वर और नए देवताओं के बीच है। फिर भी पाठ उनकी सत्ता के स्वरूप की विस्तृत व्यवस्थित व्याख्या नहीं करता, इसलिए अनावश्यक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘बलिदान चढ़ाए’, ‘परमेश्वर’, ‘देवता’ और ‘पुरखे’ सामान्य पाठकों के लिए परिचित हैं। मूल की पदावली और पुनरुक्ति को बचाते हुए हिन्दी प्रवाह के लिए ‘नए देवता’ स्पष्ट किया गया है।
