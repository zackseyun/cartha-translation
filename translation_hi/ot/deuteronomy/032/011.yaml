  text: כְּ/נֶ֨שֶׁר֙ יָעִ֣יר קִנּ֔/וֹ עַל גּוֹזָלָ֖י/ו יְרַחֵ֑ף יִפְרֹ֤שׂ כְּנָפָי/ו֙ יִקָּחֵ֔/הוּ יִשָּׂאֵ֖/הוּ עַל אֶבְרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/011.yaml
  text: Like an eagle that stirs up its nest[a], that hovers over its young, he spreads out his wings, takes him[c][b], and carries him on his pinions.
translation:
  language: hi
  text: जैसे उकाब[a] अपने घोंसले को झकझोरता है, अपने बच्चों के ऊपर मँडराता[b] है, अपने पंख फैलाता है, उसे उठा लेता है और अपने परों[c] पर ले चलता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गिद्ध”; इब्रानी शब्द נֶשֶׁר किसी बड़े मुर्दाखोर पक्षी या उकाब-जैसे शिकारी पक्षी को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने बच्चों के ऊपर पंख फड़फड़ाता हुआ” अथवा “उनके ऊपर सेता हुआ।”
    reason: lexical_alternative
  - marker: c
    text: यहाँ “परों” से विशेषतः उड़ान में काम आने वाले बड़े पंख अभिप्रेत हो सकते हैं; सामान्य अर्थ “पंखों” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּנֶשֶׁר
  choice: जैसे उकाब
  rationale: נֶשֶׁר किसी बड़े शिकारी या मुर्दाखोर पक्षी को सूचित कर सकता है। ‘उकाब’ पारंपरिक गरुड़-जैसी छवि और यहाँ की सामर्थ्यपूर्ण, रक्षक उपमा को स्वाभाविक हिन्दी में बनाए रखता है; ‘गिद्ध’ को पादटिप्पणी में रखा गया है।
- source_word: יָעִיר קִנּוֹ
  choice: अपने घोंसले को जगाता है
  rationale: עור के हिफ़ील रूप का मूल भाव जगाना या सक्रिय करना है। ‘जगाता है’ रूपक की सजीवता और स्रोत की क्रिया को सुरक्षित रखता है।
- source_word: עַל גּוֹזָלָיו יְרַחֵף
  choice: अपने बच्चों के ऊपर मँडराता है
  rationale: רחף मँडराने या पंख फड़फड़ाते हुए ऊपर रहने की गति व्यक्त करता है। ‘बच्चों’ से पक्षी के शावकों का अर्थ साधारण पाठक के लिए स्पष्ट रहता है।
- source_word: יִפְרֹשׂ כְּנָפָיו
  choice: वह अपने पंख फैलाता
  rationale: प्रसार या फैलाव की सीधी क्रिया को व्यक्त करता है और अगले समानांतर क्रियापदों से काव्यात्मक रूप से जुड़ता है।
- source_word: יִקָּחֵהוּ
  choice: उसे उठा लेता
  rationale: לקח सामान्यतः ‘लेना’ है; इस उड़ान-संबंधी दृश्य में ‘उठा लेता’ स्वाभाविक है और एकवचन कर्म-प्रत्यय को ‘उसे’ के रूप में बनाए रखता है।
- source_word: יִשָּׂאֵהוּ
  choice: उसे ... ढोता है
  rationale: נשא यहाँ भार उठाकर ले जाने का भाव देता है। ‘ढोता है’ पंखों पर वहन करने की ठोस छवि रखता है।
- source_word: עַל אֶבְרָתוֹ
  choice: अपने परों पर
  rationale: אֶבְרָה पंखों या विशेषतः उड़ान-पंखों को सूचित करता है। ‘पर’ हिन्दी में काव्यात्मक और सहज है तथा पहले आए ‘पंख’ से कुछ शब्दगत भेद बनाए रखता है।
theological_decisions:
- issue: उपमा में कर्ता और सर्वनाम का संबंध
  choice: पक्षी के लिए पुल्लिंग ‘वह/अपने’ बनाए रखना, पर पद में ‘यहोवा’ को स्पष्ट रूप से न जोड़ना
  alternative: दूसरे अर्धांश में सीधे ‘यहोवा’ कहना, या निर्जीव/तटस्थ पक्षी-सूचक शैली अपनाना
  rationale: इब्रानी में सभी क्रियाएँ पुल्लिंग एकवचन हैं और व्यापक संदर्भ में उपमा यहोवा की देखभाल का वर्णन करती है। फिर भी इस पद में नाम स्पष्ट नहीं है; अतः ‘वह’ काव्यात्मक संकेत और वास्तविक अस्पष्टता दोनों को सुरक्षित रखता है।
- issue: एकवचन कर्म-प्रत्यय का आशय
  choice: ‘उसे’ द्वारा एकवचन बनाए रखना
  alternative: ‘उन्हें’ कहकर सभी बच्चों या सामूहिक इस्राएल को स्पष्ट करना
  rationale: יִקָּחֵהוּ और יִשָּׂאֵהוּ में पुल्लिंग एकवचन कर्म-प्रत्यय है। ‘उसे’ किसी एक बच्चे अथवा उपमा के प्रयोग में इस्राएल—दोनों संभावनाओं को बिना निर्णय थोपे खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल काव्यात्मक शैली रखी गई है। ‘उकाब’ बाइबलीय उपमा के लिए प्रचलित और संक्षिप्त है। ‘वैसे ही’ जोड़कर हिन्दी में उपमा की दो धाराओं को स्पष्ट किया गया है, जबकि ‘वह’ के संदर्भ को जानबूझकर अप्रकट रखा गया है।
