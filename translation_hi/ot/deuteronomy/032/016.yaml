base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/016.yaml
  text: They made him jealous with strangers[a]; with abominations they provoked him to anger.
translation:
  language: hi
  text: 'परायों[a] से उन्होंने उसमें ईर्ष्या जगाई;

    घृणित वस्तुओं से उन्होंने उसे क्रोधित किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पराये देवताओं” अथवा “विदेशी देवताओं” से; इब्रानी में शाब्दिक रूप से “परायों/विदेशियों” कहा गया है।
    reason: मूल शब्द की शाब्दिक अस्पष्टता और प्रसंगगत मूर्तिपूजक अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: יַקְנִאֻהוּ
  choice: उन्होंने उसे जलन दिलाई
  rationale: קנא के हिफ़ील रूप और तृतीय पुरुष एकवचन कर्म को कारणवाचक ढंग से व्यक्त करता है। यह वाचा-संबंधी मानवीय भाव-भाषा को बनाए रखता है।
- source_word: בְּזָרִים
  choice: परायों के द्वारा
  rationale: זָרִים का शाब्दिक अर्थ ‘पराये/विदेशी जन या वस्तुएँ’ है। मूल में ‘देवता’ स्पष्ट नहीं है, इसलिए मुख्य पाठ उसकी अस्पष्टता बनाए रखता है; प्रसंगगत अर्थ पादटिप्पणी में दिया गया है।
- source_word: בְּתוֹעֵבֹת
  choice: घृणित वस्तुओं के द्वारा
  rationale: תּוֹעֵבָה उन वस्तुओं या आचरणों को दर्शाता है जो अत्यंत घृणास्पद हैं, और यहाँ मूर्तिपूजा का प्रसंग है। आधुनिक हिन्दी में यह ‘घृणित कामों’ से कम व्याख्यात्मक और ‘घृणितताओं’ से अधिक स्वाभाविक है।
- source_word: יַכְעִיסֻהוּ
  choice: उन्होंने उसे क्रोध दिलाया
  rationale: כעס का हिफ़ील रूप क्रोध उत्पन्न करने का कारणवाचक भाव देता है और पहले खंड की समानांतर रचना को सुरक्षित रखता है।
theological_decisions:
- issue: क्या זָרִים में निहित मूर्तिपूजक आराध्य को स्पष्ट रूप से ‘देवता’ कहा जाए
  choice: मुख्य पाठ में शाब्दिक ‘परायों’ रखा गया
  alternative: पराये देवताओं / विदेशी देवताओं
  rationale: व्यवस्थाविवरण 32 का प्रसंग विदेशी देवताओं की ओर संकेत करता है, पर इस पद के इब्रानी पाठ में ‘देवता’ शब्द नहीं है। इसलिए मूल की अस्पष्टता मुख्य पाठ में रखी गई और प्रसंगगत विकल्प पादटिप्पणी में बताया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य शैली। दोनों काव्य-पंक्तियों में कारणवाचक समानांतरता बनाए रखी गई है। ‘परायों’ कुछ असामान्य सुनाई देता है, किंतु यह मूल की जानबूझकर खुली अभिव्यक्ति को सुरक्षित रखता है।
