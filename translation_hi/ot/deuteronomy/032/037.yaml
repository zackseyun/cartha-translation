  text: וְ/אָמַ֖ר אֵ֣י אֱלֹהֵ֑י/מוֹ צ֖וּר חָסָ֥יוּ בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/037.yaml
  text: And he will say[a], ‘Where are their gods, the rock in which they took refuge?’
translation:
  language: hi
  text: और वह कहेगा, “कहाँ हैं उनके देवता—वह चट्टान जिसमें उन्होंने शरण ली थी?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “वह चट्टान—उन्होंने उसमें शरण ली थी।” इब्रानी में “उसमें” एकवचन है और “चट्टान” ‘उनके देवता’ के समानाधिकरण में है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: और वह कहेगा
  rationale: काव्यात्मक प्रसंग में संयोजक सहित यह रूप आगे होने वाली वाणी को दर्शाता है। “और” इब्रानी संयोजक को बनाए रखता है।
- source_word: אֵי
  choice: कहाँ हैं
  rationale: प्रश्नवाचक अव्यय का अर्थ “कहाँ?” है; “उनके देवता” के बहुवचन भाव के अनुसार हिन्दी में “हैं” स्वाभाविक है।
- source_word: אֱלֹהֵימוֹ
  choice: उनके देवता
  rationale: यह אֱלֹהִים का संबंधरूप है, जिस पर अन्य पुरुष बहुवचन स्वामित्व-प्रत्यय लगा है; यहाँ आशय उन देवताओं से है जिन पर उन्होंने भरोसा किया था।
- source_word: צוּר
  choice: वह चट्टान
  rationale: शाब्दिक अर्थ “चट्टान” है। यहाँ यह “उनके देवता” का व्यंग्यात्मक, समानाधिकरणात्मक वर्णन है; सामान्य रूप में लिखने से इसे इसी गीत में याहवे के लिए प्रयुक्त उपाधि से अलग रखा जाता है।
- source_word: חָסָיוּ
  choice: उन्होंने शरण ली थी
  rationale: חסה का मूल भाव शरण लेना या आश्रय पाना है। “शरण ली” सुरक्षा की ठोस रूपक-छवि को बनाए रखता है।
- source_word: בּוֹ
  choice: जिसमें
  rationale: पूर्वसर्ग के साथ एकवचन पुल्लिंग प्रत्यय निकटवर्ती एकवचन “चट्टान” की ओर संकेत करता है। हिन्दी में “जिसमें” इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: वक्ता का संदर्भ और क्रिया का काल
  choice: पंक्ति को याहवे की आगे कही जाने वाली व्यंग्यपूर्ण चुनौती के रूप में “और वह कहेगा” अनूदित किया गया है।
  alternative: “और उसने कहा” अथवा “तब कोई कहेगा”
  rationale: व्यवस्थाविवरण 32:36–38 के प्रवाह में सबसे स्वाभाविक अर्थ यह है कि याहवे बताएगा कि वह न्याय करते और झूठे देवताओं की असमर्थता प्रकट करते समय क्या कहेगा। फिर भी यह अर्थ केवल क्रियारूप से नहीं, काव्यात्मक प्रसंग से निर्धारित होता है।
- issue: “चट्टान” का रूप
  choice: सामान्य संज्ञा “चट्टान”
  alternative: ईश्वरीय उपाधि के रूप में “चट्टान” को विशेष रूप देना
  rationale: इस पद में निकट संदर्भ “उनके देवता” है, न कि याहवे। सामान्य संज्ञा विडंबना को सुरक्षित रखती और झूठे देवताओं को सच्ची ईश्वरीय उपाधि देने से बचाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दीर्घ विराम-चिह्न “देवता” और “चट्टान” के समानाधिकरण तथा व्यंग्यात्मक पहचान को स्पष्ट करता है, जबकि इब्रानी के बहुवचन “देवता” और एकवचन “चट्टान/उसमें” के तनाव को फुटनोट में सुरक्षित रखा गया है।
