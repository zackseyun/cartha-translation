base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/050.yaml
  text: and die on the mountain that you are ascending[a], and be gathered to your people, just as Aaron your brother died on Mount Hor and was gathered to his people.
translation:
  language: hi
  text: और उस पहाड़ पर मर जाओ जिस पर तुम चढ़ रहे हो, और अपने लोगों में जा मिलो[a], ठीक जैसे तुम्हारा भाई हारून होर पहाड़ पर मरा और अपने लोगों में जा मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पूर्वजों में जा मिलो।” इब्रानी मुहावरे का शाब्दिक अर्थ “अपने लोगों के पास इकट्ठे किए जाओ” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֻת
  choice: और ... तुम्हारी मृत्यु हो
  rationale: מות का काल आज्ञार्थक/विध्यर्थक रूप मूसा को सीधे संबोधित करता है। हिंदी में ‘तुम्हारी मृत्यु हो’ इस गंभीर दैवी आदेश को स्वाभाविक रूप से व्यक्त करता है; केवल ‘मर जाओ’ अनावश्यक रूप से कठोर सुनाई दे सकता है।
- source_word: בָּהָר אֲשֶׁר אַתָּה עֹלֶה שָׁמָּה
  choice: जिस पहाड़ पर तुम चढ़ रहे हो, उसी पर
  rationale: עלה की ऊपर की ओर गति ‘चढ़ रहे हो’ में बनी रहती है। שָׁמָּה का लक्ष्यसूचक बल हिंदी में सहसंबंधी ‘उसी पर’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: וְהֵאָסֵף אֶל עַמֶּיךָ
  choice: और तुम अपने लोगों में जा मिलो
  rationale: निफ़अल אסף और ‘अपने लोगों’ के मृत्यु-संबंधी मुहावरे को समझने योग्य हिंदी में रखा गया है। ‘जा मिलो’ मृत्यु से पहले जा चुकने और अपने जनों से जुड़ने का भाव रखता है, पर इसे केवल दफ़नाए जाने तक सीमित नहीं करता।
- source_word: כַּאֲשֶׁר
  choice: ठीक जैसे
  rationale: हारून की मृत्यु के साथ स्पष्ट तुलना को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: אַהֲרֹן אָחִיךָ
  choice: तुम्हारा भाई हारून
  rationale: यह हिंदी की स्वाभाविक पद-रचना है और संबंध को स्पष्ट रखती है।
- source_word: בְּהֹר הָהָר
  choice: होर पहाड़ पर
  rationale: स्थाननाम הֹר और הָהָר को हिंदी की प्रचलित नाम-रचना में प्रस्तुत किया गया है।
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: और अपने लोगों में जा मिला
  rationale: मूसा और हारून के लिए एक ही इब्रानी मृत्यु-मुहावरे का समानांतर अनुवाद रखा गया है।
theological_decisions:
- issue: אסף אל־עמיו मृत्यु-मुहावरे का अर्थ
  choice: मुख्य पाठ में ‘अपने लोगों में जा मिलो/जा मिला’
  alternative: ‘अपने पूर्वजों में जा मिलो/जा मिला’
  rationale: इब्रानी में עם का मूल अर्थ ‘लोग/जन’ है। वाक्यांश मृत्यु का मुहावरा है, किंतु उसे केवल पूर्वजों या पारिवारिक कब्र में दफ़नाए जाने के अर्थ तक सीमित करना स्रोत की संभावित व्यापकता और धर्मवैचारिक तनाव को घटा देता।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। ‘मृत्यु हो’ दैवी आदेश की गंभीरता रखता है, जबकि ‘अपने लोगों में जा मिलो’ इब्रानी मुहावरे को समझने योग्य बनाते हुए उसकी व्याख्यात्मक खुलावट बचाता है।
