  text: Their wine is the venom of serpents[b][a], the cruel poison of cobras.
translation:
  language: hi
  text: 'उनका दाखमधु साँपों[a] का विष है,

    और नागों[b] का निर्मम ज़हर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द अन्य संदर्भों में विशाल जलीय जीव या दैत्याकार सरीसृप को भी दर्शा सकता है; यहाँ विषैले साँपों के साथ समानांतर प्रयोग साँप-सदृश अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘विषैले साँपों का’; इब्रानी में एक घातक विषैले साँप का नाम है, जिसकी ठीक प्रजाति निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: विष
  rationale: सर्प-संदर्भ में यह शब्द ‘क्रोध’ या ‘ताप’ नहीं, बल्कि विष को दर्शाता है; हिंदी में ‘विष’ काव्यात्मक और स्वाभाविक है।
- source_word: תַּנִּינִם
  choice: बड़े साँपों
  rationale: इस शब्द का अर्थ अन्य संदर्भों में विशाल जलीय जीव या अजगर-जैसा प्राणी हो सकता है, पर यहाँ विषैले साँपों के समानांतर होने के कारण साँप-सदृश अर्थ उपयुक्त है। ‘बड़े’ उसके विशाल और भयावह स्वरूप को कुछ हद तक बनाए रखता है।
- source_word: יֵינָם
  choice: उनका दाखमधु
  rationale: यह सीधा संबंधवाचक रूप है। ‘दाखमधु’ काव्यात्मक प्रसंग में अंगूर से बनी मदिरा को स्पष्ट करता है।
- source_word: וְרֹאשׁ
  choice: ज़हर
  rationale: यहाँ शब्द का अर्थ शाब्दिक ‘सिर’ नहीं, बल्कि कड़वा अथवा विषैला पदार्थ है। पहले चरण के ‘विष’ के साथ अनावश्यक पुनरावृत्ति से बचने के लिए ‘ज़हर’ चुना गया है।
- source_word: פְּתָנִים
  choice: नागों
  rationale: यह किसी घातक विषैले साँप को दर्शाता है, जिसकी ठीक प्रजाति अनिश्चित है। ‘नाग’ आधुनिक हिंदी में सजीव और स्वाभाविक है, पर प्रजातिगत अनिश्चितता को पादटिप्पणी में रखा गया है।
- source_word: אַכְזָר
  choice: निर्मम
  rationale: विशेषण विष के प्राणघातक, दया-रहित प्रभाव का मानवीकरण करता है। ‘निर्मम’ इस काव्यात्मक तीव्रता को स्वाभाविक हिंदी में व्यक्त करता है।
