source:
  edition: WLC
  text: כִּ֛י שֵׁ֥ם יְהוָ֖ה אֶקְרָ֑א הָב֥וּ גֹ֖דֶל לֵ/אלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/003.yaml
  text: For I will proclaim the name of Yahweh[a]; ascribe greatness to our God.
translation:
  language: hi
  text: 'क्योंकि मैं याहवे[a] के नाम की घोषणा करूँगा;

    तुम हमारे परमेश्वर को महान ठहराओ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में: ‘YHWH’ (יהוה); परंपरागत रूप से ‘प्रभु’ अनूदित। ‘यहोवा’ भी इसका एक प्रचलित हिन्दी रूप है।'
    reason: ईश्वरीय नाम के मूल रूप और परंपरागत वैकल्पिक प्रस्तुतियों की जानकारी देना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद गीत में आगे दिए गए आह्वान का आधार बताता है; ‘क्योंकि’ इसके कारणसूचक संबंध को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: שֵׁם
  choice: नाम
  rationale: मूल ठोस संज्ञा को सुरक्षित रखा गया है। प्रसंग में इसमें याहवे की प्रकट पहचान और प्रतिष्ठा भी निहित है, पर उसे व्याख्यात्मक भावार्थ से नहीं बदला गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में उसके प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: אֶקְרָא
  choice: मैं ... घोषणा करूँगा
  rationale: यहाँ קרא गीत में ईश्वरीय नाम को सार्वजनिक रूप से घोषित करने का भाव देता है; ‘घोषणा करना’ केवल पुकारने या आह्वान करने की अपेक्षा प्रसंग के अधिक अनुकूल है।
- source_word: הָבוּ גֹדֶל
  choice: महान ठहराओ
  rationale: बहुवचन आज्ञा श्रोताओं को परमेश्वर की महानता स्वीकार और घोषित करने के लिए बुलाती है। यह स्वाभाविक हिन्दी में उस भाव को रखता है, बिना यह संकेत दिए कि मनुष्य वास्तव में परमेश्वर को महान बनाते हैं।
- source_word: לֵאלֹהֵינוּ
  choice: हमारे परमेश्वर को
  rationale: ‘हमारे’ प्रथम पुरुष बहुवचन प्रत्यय को सुरक्षित रखता है और לְ के लक्ष्यभाव को ‘को’ द्वारा व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना सुरक्षित रखता है; पाठकों की परिचित वैकल्पिक परंपराएँ पादटिप्पणी में बताई गई हैं।
- issue: הָבוּ גֹדֶל में मनुष्यों द्वारा परमेश्वर को ‘महानता देने’ का आशय
  choice: महान ठहराओ
  alternative: महानता दो; महानता का बखान करो
  rationale: यह चयन परमेश्वर की अंतर्निहित महानता को स्वीकार और घोषित करने का आशय व्यक्त करता है, न कि यह कि मनुष्य उसमें महानता जोड़ते हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता के लिए पद को दो पंक्तियों में रखा गया है। ‘तुम’ बहुवचन आज्ञा का भाव स्पष्ट करता है; कोई सांप्रदायिक शब्दावली नहीं जोड़ी गई।
