  terminology: “याहवे” consistently renders יהוה and the note responsibly identifies YHWH and traditional “प्रभु” rendering while mentioning “यहोवा” as a familiar alternative. “परमेश्वर” appropriately renders אֱלֹהֵינוּ here. “महान ठहराओ” communicates acknowledging/ascribing divine greatness without importing a doctrinal gloss.
