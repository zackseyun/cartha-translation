  source_fidelity: 'The translation accurately reflects the Hebrew: כִּי is rendered causally as “क्योंकि”; אֶקְרָא as a future first-person public declaration; “याहवे” preserves the Tetragrammaton; and the plural imperative הָבוּ גֹדֶל לֵאלֹהֵינוּ is conveyed by “तुम हमारे परमेश्वर को महान ठहराओ।” The Hebrew’s poetic two-line structure is retained.'
