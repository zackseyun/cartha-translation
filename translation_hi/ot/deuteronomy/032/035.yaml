base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/035.yaml
  text: Vengeance is mine[a], and recompense, at the time when their foot slips; for the day of their disaster is near[d][c][b], and what is prepared for them hastens.
translation:
  language: hi
  text: 'प्रतिशोध और प्रतिफल देना मेरा अधिकार है[a][d],


    उस समय जब उनका पैर फिसलेगा[b];


    क्योंकि उनकी विपत्ति का दिन निकट है,


    और जो कुछ उनके लिए तैयार है, वह तेज़ी से आ रहा है[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रतिफल’ का अनुवाद ‘बदला चुकाना’ अथवा ‘किए का प्रतिफल देना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जब उनका पैर डगमगाएगा’ अथवा ‘जब उनका पैर साथ छोड़ देगा।’
    reason: lexical_alternative
  - marker: c
    text: या ‘उनके लिए ठहराई हुई बातें तेज़ी से निकट आ रही हैं’; इब्रानी वाक्यांश बहुत संक्षिप्त है।
    reason: lexical_alternative
  - marker: d
    text: इस कथन को रोमियों 12:19 में उद्धृत किया गया है और इब्रानियों 10:30 में इसकी प्रतिध्वनि मिलती है।
    reason: cross_reference
lexical_decisions:
- source_word: לִי נָקָם וְשִׁלֵּם
  choice: प्रतिशोध लेना और बदला चुकाना मेरा काम है
  rationale: לִי परमेश्वर के अधिकार और दायित्व को व्यक्त करता है। हिंदी में ‘मेरा काम है’ स्वाभाविक ढंग से यह भाव देता है कि न्यायोचित प्रतिशोध और बदला चुकाना उसी का अधिकार है; यह न तो उसे केवल अमूर्त ‘न्याय’ बनाता है, न निजी वैरभाव।
- source_word: לְעֵת תָּמוּט רַגְלָם
  choice: उस समय जब उनका पैर फिसलेगा
  rationale: सामूहिक एकवचन ‘उनका पैर’ मूल बिंब को बनाए रखता है; ‘फिसलेगा’ आसन्न पतन को सरल और सजीव हिंदी में व्यक्त करता है।
- source_word: כִּי קָרוֹב יוֹם אֵידָם
  choice: क्योंकि उनकी विपत्ति का दिन निकट है
  rationale: כִּי का कारणसूचक अर्थ ‘क्योंकि’ से स्पष्ट होता है। אֵיד के लिए ‘विपत्ति’ गंभीर, सहज और विनाशकारी संकट के अर्थ के अनुकूल है।
- source_word: וְחָשׁ עֲתִדֹת לָמוֹ
  choice: और जो कुछ उनके लिए तैयार है, वह तेज़ी से आ रहा है
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ हद तक खुला है। ‘जो कुछ ... तैयार है’ उसके ठोस किंतु अनिर्दिष्ट भाव को बचाता है, और ‘तेज़ी से आ रहा है’ आसन्नता को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय प्रतिशोध का स्वरूप
  choice: ‘प्रतिशोध लेना और बदला चुकाना मेरा काम है’ के द्वारा न्याय करने का अधिकार परमेश्वर के पास रखा गया है।
  alternative: ‘न्याय मेरा है’ अथवा ‘मैं बदला लूँगा’
  rationale: पहला विकल्प मूल के प्रतिशोध-संबंधी भार को कम कर देता, जबकि दूसरा निजी वैरभाव का आभास दे सकता था। चुना हुआ पाठ न्यायोचित दंड और परमेश्वर के विशेषाधिकार, दोनों को बनाए रखता है।
- issue: עֲתִדֹת לָמוֹ की संक्षिप्तता
  choice: ‘जो कुछ उनके लिए तैयार है’
  alternative: ‘उनका विनाश’ अथवा ‘उनके लिए ठहराई हुई बातें’
  rationale: मूल यह स्पष्ट नहीं करता कि तैयार वस्तुएँ ठीक-ठीक क्या हैं। चुना हुआ रूप इस अस्पष्टता को सुरक्षित रखता है और प्रसंग में आसन्न न्याय का संकेत देता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर काव्यात्मक लहजा रखा गया है। ‘मेरा काम है’ सामान्य पाठक के लिए स्वाभाविक है और साथ ही परमेश्वर के विशिष्ट न्यायाधिकार को स्पष्ट करता है। पंक्ति-विन्यास इब्रानी काव्य की समानांतर गति और आसन्न विपत्ति की क्रमिक तीव्रता को उभारता है।
