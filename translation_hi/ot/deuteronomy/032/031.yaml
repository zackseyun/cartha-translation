  text: כִּ֛י לֹ֥א כְ/צוּרֵ֖/נוּ צוּרָ֑/ם וְ/אֹיְבֵ֖י/נוּ פְּלִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/031.yaml
  text: For their rock is not like our Rock[a], and our enemies are judges.
translation:
  language: hi
  text: क्योंकि हमारी चट्टान के समान उनकी चट्टान नहीं है,[a] और हमारे शत्रु न्यायाधीश हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “उनकी चट्टान हमारी चट्टान के समान नहीं है—यहाँ तक कि हमारे शत्रु भी ऐसा निर्णय करते हैं।” इब्रानी शब्द פְּלִילִים का शाब्दिक अर्थ “न्यायाधीश” या “निर्णायक” है, जिससे इस पंक्ति में न्यायिक भाव आता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; गीत के तर्क-प्रवाह में ‘क्योंकि’ स्वाभाविक है।
- source_word: כְצוּרֵנוּ צוּרָם
  choice: उनकी चट्टान हमारी चट्टान के समान नहीं है
  rationale: दोनों स्थानों पर एक ही इब्रानी संज्ञा צוּר है। ‘चट्टान’ रूपक को बनाए रखती है और इस्राएल के परमेश्वर तथा शत्रुओं के भरोसे के आधार के बीच जानबूझकर किए गए विरोध को सुरक्षित रखती है।
- source_word: וְאֹיְבֵינוּ
  choice: और हमारे शत्रु ही
  rationale: וְ का सीधा संयोजक बल ‘और’ से व्यक्त होता है। ‘ही’ इस अलंकारिक बात को उभारता है कि विरोधी स्वयं इस निर्णय के साक्षी अथवा निर्णायक हैं।
- source_word: פְּלִילִים
  choice: न्यायाधीश हैं
  rationale: बहुवचन संज्ञा का मूल अर्थ ‘न्यायाधीश/निर्णायक’ है। संज्ञात्मक रूप बनाए रखने से पंक्ति का न्यायिक भाव और मूल की संक्षिप्तता सुरक्षित रहती है।
theological_decisions:
- issue: צוּר को रूपक के रूप में रखना या उसका व्याख्यात्मक अर्थ देना
  choice: दोनों बार ‘चट्टान’
  alternative: रक्षक, शरणस्थान, सामर्थ्य
  rationale: मूल पाठ एक ही शब्द को इस्राएल के परमेश्वर और अन्य जातियों के भरोसे के आधार के लिए प्रयोग करके तीखा विरोध रचता है। रूपक को बनाए रखना किसी एक व्याख्या को पाठ में आरोपित नहीं करता।
- issue: פְּלִילִים को पदनाम मानना या क्रियात्मक कथन
  choice: ‘न्यायाधीश हैं’
  alternative: ‘निर्णय करते हैं’ या ‘गवाही देते हैं’
  rationale: मूल में संज्ञा है, इसलिए मुख्य पाठ में उसके औपचारिक न्यायिक अर्थ को रखा गया है; प्रसंगगत क्रियात्मक अर्थ पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चट्टान’ का दोहराव मूल के शब्दालंकार और धार्मिक तनाव को बनाए रखता है; देवनागरी में बड़े अक्षरों का भेद न होने के कारण दोनों संदर्भों को समान रूप में लिखा गया है।
