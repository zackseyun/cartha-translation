  text: רְא֣וּ עַתָּ֗ה כִּ֣י אֲנִ֤י אֲנִי֙ ה֔וּא וְ/אֵ֥ין אֱלֹהִ֖ים עִמָּ/דִ֑י אֲנִ֧י אָמִ֣ית וַ/אֲחַיֶּ֗ה מָחַ֨צְתִּי֙ וַ/אֲנִ֣י אֶרְפָּ֔א וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּֽיל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/039.yaml
  text: See now that I[a], even I, am he, and there is no god beside me. I put to death and I make alive; I have wounded, and I will heal[e][d][c][b]; and there is no one who can deliver from my hand.
translation:
  language: hi
  text: 'अब देखो कि मैं, हाँ मैं, वही हूँ[e],

    और मेरे सिवा कोई देवता नहीं है।[a]

    मैं मार डालता हूँ[b] और जीवित करता हूँ;

    मैंने घायल किया है[c], और मैं ही चंगा करूँगा;

    और मेरे हाथ से कोई किसी को छुड़ा नहीं सकता।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे साथ कोई देवता नहीं है।” यहाँ इब्रानी संबंधबोधक शब्द का अर्थ प्रसंग में “मेरे सिवा” या “मेरे साथ” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मैं मारता हूँ।”
    reason: lexical_alternative
  - marker: c
    text: या “मैंने कुचल दिया है,” अथवा “मैंने चूर कर दिया है।” इब्रानी क्रिया साधारण घायल करने से अधिक प्रबल हो सकती है।
    reason: lexical_alternative
  - marker: d
    text: “मेरे हाथ से” किसी के अधिकार या शक्ति से छूटने का इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: e
    text: या “मैं ही वह हूँ।” इब्रानी में “मैं” दो बार आकर विशेष जोर देता है।
    reason: translation_note
lexical_decisions:
- source_word: רְאוּ עַתָּה
  choice: अब देखो
  rationale: बहुवचन आज्ञार्थक और समयवाचक क्रियाविशेषण को सीधे तथा स्वाभाविक ढंग से व्यक्त करता है; यह श्रोताओं को सत्य पहचानने के लिए बुलाता है।
- source_word: כִּי אֲנִי אֲנִי הוּא
  choice: कि मैं—मैं ही वह हूँ
  rationale: डैश और दूसरे ‘मैं’ के साथ ‘ही’ इब्रानी में दोहराए गए सर्वनाम का जोर बनाए रखते हैं, पर ‘केवल’ जोड़कर अगले उपवाक्य की विशिष्टता को समय से पहले स्पष्ट नहीं करते।
- source_word: וְאֵין אֱלֹהִים עִמָּדִי
  choice: और मेरे सिवा कोई देवता नहीं है
  rationale: यहाँ עִם संग-साथ या बराबर खड़े होने के भाव में है। ‘मेरे सिवा’ प्रसंग में किसी अन्य देवता के अस्तित्व को नकारने वाला स्वाभाविक हिन्दी रूप है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אָמִית
  choice: मैं मार डालता हूँ
  rationale: מות के हिफ़ील रूप का कारक अर्थ स्पष्ट करता है और काव्यात्मक गंभीरता के साथ आधुनिक हिन्दी में सहज है।
- source_word: וַאֲחַיֶּה
  choice: और जीवित करता हूँ
  rationale: चाहे जीवन देने या फिर जीवित करने का भाव हो, यह रूप मृत्यु और जीवन के समानांतर विरोध को निकटता से बनाए रखता है।
- source_word: מָחַצְתִּי
  choice: मैंने घायल किया है
  rationale: क्रिया कुचलने या चूर करने तक का प्रबल अर्थ रख सकती है, पर चंगा करने के समानांतर ‘घायल किया’ मूल विरोध को बिना अनावश्यक अतिशयोक्ति के व्यक्त करता है।
- source_word: וַאֲנִי אֶרְפָּא
  choice: और मैं ही चंगा करूँगा
  rationale: अपूर्ण क्रिया को इस क्रम में भविष्यकाल के रूप में लिया गया है। व्यक्त सर्वनाम אֲנִי का जोर ‘मैं ही’ से दिखाया गया है।
- source_word: וְאֵין מִיָּדִי מַצִּיל
  choice: और कोई मेरे हाथ से छुड़ा नहीं सकता
  rationale: अस्तित्व-निषेध और उद्धार करने वाले कृदंत का आशय स्वाभाविक हिन्दी में व्यक्त होता है, जबकि ‘मेरे हाथ से’ मूल शक्ति और अधिकार के मुहावरे को सुरक्षित रखता है।
theological_decisions:
- issue: अन्य देवताओं के संबंध में परमेश्वर की अनन्यता
  choice: ‘मेरे सिवा कोई देवता नहीं है’ के रूप में स्पष्ट अनन्यता
  alternative: ‘मेरे साथ कोई ईश्वर नहीं है,’ अर्थात कोई सहयोगी या सहभागी देवता नहीं
  rationale: निकटवर्ती प्रसंग और कथन की संरचना प्रबल अनन्यता का समर्थन करते हैं। अनुवाद बाद की दार्शनिक शब्दावली नहीं जोड़ता, फिर भी किसी प्रतिद्वंद्वी देवता के लिए स्थान नहीं छोड़ता।
- issue: ‘मैं वही हूँ’ का संभावित अंतरपाठीय और धर्मवैज्ञानिक भार
  choice: ‘मैं—मैं ही वह हूँ’ के रूप में सरल कथन और सर्वनाम का जोर बनाए रखना
  alternative: ‘मैं ही एकमात्र हूँ’ या इसे किसी विस्तृत धर्मसैद्धांतिक सूत्र के रूप में प्रस्तुत करना
  rationale: वाक्यांश का धर्मवैज्ञानिक महत्व है, पर मूल से आगे बढ़कर उसका अर्थ नहीं खोला गया। दोहरे אֲנִי को स्वाभाविक हिन्दी में प्रत्यक्ष रखा गया है।
- issue: मारने और जीवित करने में दैवी कर्तृत्व
  choice: दोनों क्रियाओं को एक ही वक्ता की प्रत्यक्ष क्रिया के रूप में बनाए रखना
  alternative: ‘मैं मरने देता हूँ और जीवन देता हूँ,’ जिससे प्रत्यक्ष कर्तृत्व नरम पड़ सकता है
  rationale: इब्रानी दोनों क्रियाओं में वक्ता के कर्तृत्व को स्पष्ट और तनावपूर्ण ढंग से समानांतर रखती है; अनुवाद इसे धर्मवैज्ञानिक सुविधा के लिए नरम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण काव्यात्मक गद्य रखा गया है। समानांतर पंक्तियाँ मूल कविता की लय और मृत्यु/जीवन तथा घायल करने/चंगा करने के तनाव को उभारती हैं। ‘देवता’ सामान्य संज्ञा के रूप में प्रतिद्वंद्वी deity को दर्शाता है; किसी सम्प्रदाय-विशेष की शब्दावली नहीं जोड़ी गई।
