source:
  edition: WLC
  text: אַשְׁכִּ֤יר חִצַּ/י֙ מִ/דָּ֔ם וְ/חַרְבִּ֖/י תֹּאכַ֣ל בָּשָׂ֑ר מִ/דַּ֤ם חָלָל֙ וְ/שִׁבְיָ֔ה מֵ/רֹ֖אשׁ פַּרְע֥וֹת אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/042.yaml
  text: I will make my arrows drunk with blood[a], and my sword will devour flesh— with the blood of the slain and the captives, from the heads of the enemy leaders.
translation:
  language: hi
  text: 'मैं अपने तीरों को लहू से मतवाला कर दूँगा,

    और मेरी तलवार मांस खाएगी—

    मारे गए लोगों और बंदियों के लहू से,

    शत्रु के अगुओं के सिरों से।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह इब्रानी पदबंध कठिन है, विशेषकर दुर्लभ शब्द פַּרְעוֹת। अधिक शाब्दिक अनुवाद संभव है: “शत्रु के खुले (या लंबे) बालों वाले सिरों से”; एक अन्य अर्थ है: “शत्रु के अगुओं के सिर से।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁכִּיר
  choice: मतवाला कर दूँगा
  rationale: 'यह שׁכר के हिफ़ील रूप का सजीव रूपक बनाए रखता है: तीर मानो लहू पीकर मतवाले हो जाते हैं। ‘भिगो दूँगा’ अर्थ को सरल करता, पर मूल काव्यात्मक चित्र को कम कर देता।'
- source_word: חִצַּי
  choice: अपने तीरों को
  rationale: חֵץ के बहुवचन और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: מִדָּם
  choice: लहू से
  rationale: ‘मतवाला करना’ के बाद מִן यहाँ कारण या भराव का भाव देता है; हिन्दी में ‘लहू से’ स्वाभाविक है। ‘लहू’ युद्धगीत के काव्यात्मक और गंभीर लहजे के अनुकूल है।
- source_word: וְחַרְבִּי
  choice: और मेरी तलवार
  rationale: मूल के सीधे संबंधसूचक विन्यास को सुरक्षित रखता है।
- source_word: תֹּאכַל בָּשָׂר
  choice: मांस निगल जाएगी
  rationale: शाब्दिक ‘मांस खाएगी’ के रूपक को बनाए रखते हुए ‘निगल जाएगी’ तलवार की हिंसक, सर्वग्रासी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִדַּם חָלָל
  choice: मारे गए लोगों ... के लहू से
  rationale: חָלָל युद्ध में मारे गए व्यक्ति को सूचित करता है; बहुवचन भाव को हिन्दी में स्पष्ट किया गया है।
- source_word: וְשִׁבְיָה
  choice: और बंदियों
  rationale: युद्ध के संदर्भ में अमूर्त ‘बंदी अवस्था’ की अपेक्षा लोगों के लिए ‘बंदी’ अधिक संभावित और स्वाभाविक है। इसे ‘लहू’ के साथ संयुक्त संबंध में रखा गया है।
- source_word: מֵרֹאשׁ פַּרְעוֹת אוֹיֵב
  choice: और शत्रु के अगुओं के सिरों से
  rationale: पदबंध कठिन है। ‘अगुए’ पठनीय हिन्दी में प्राचीन व्याख्यात्मक परंपरा और संभावित नेतृत्वार्थ को व्यक्त करता है, जबकि ‘सिरों’ की ठोस युद्ध-छवि सुरक्षित रहती है। दुर्लभ פַּרְעוֹת का बालों से संबंधित अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: מֵרֹאשׁ פַּרְעוֹת אוֹיֵב का अर्थ
  choice: शत्रु के अगुओं के सिरों से
  alternative: शत्रु के खुले/लंबे बालों वाले योद्धाओं के सिरों से
  rationale: यह मुख्यतः शब्दार्थ और वाक्य-विन्यास की समस्या है, कोई सिद्धान्तगत विवाद नहीं। मुख्य पाठ पठनीय नेतृत्वार्थ देता है, पर दुर्लभ פַּרְעוֹת की वास्तविक अनिश्चितता को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और काव्यात्मक रखी गई है। ‘मतवाला’ और ‘लहू’ मूल युद्धगीत की तीव्र रूपकात्मकता को सुरक्षित रखते हैं। पंक्ति-विभाजन इब्रानी काव्य के समानांतर विन्यास को स्पष्ट करता है; कठिन अंतिम पदबंध की अनिश्चितता पादटिप्पणी में दी गई है।
