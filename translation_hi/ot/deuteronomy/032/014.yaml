source:
  edition: WLC
  text: חֶמְאַ֨ת בָּקָ֜ר וַ/חֲלֵ֣ב צֹ֗אן עִם חֵ֨לֶב כָּרִ֜ים וְ/אֵילִ֤ים בְּנֵֽי בָשָׁן֙ וְ/עַתּוּדִ֔ים עִם חֵ֖לֶב כִּלְי֣וֹת חִטָּ֑ה וְ/דַם עֵנָ֖ב תִּשְׁתֶּה חָֽמֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/014.yaml
  text: curds from the herd[a], and milk from the flock, with the fat of lambs, and rams, the offspring of Bashan, and goats, with the choicest wheat; and you drank foaming wine[b], the blood of grapes.
translation:
  language: hi
  text: गाय-बैलों का दही और भेड़-बकरियों का दूध, मेमनों की चरबी, बाशान में पले हुए मेढ़ों और बकरों की चरबी, और उत्तम से उत्तम गेहूँ; और तुमने झागदार दाखमधु, अंगूरों का लहू, पिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶמְאַת בָּקָר
  choice: गाय-बैलों के दही
  rationale: חֶמְאָה किसी गाढ़े दुग्ध-पदार्थ—दही, मलाई या मक्खन—को सूचित कर सकता है। आधुनिक हिन्दी में 'दही' pastoral food image को स्वाभाविक रूप से व्यक्त करता है; בָּקָר सामूहिक रूप से गोवंश है।
- source_word: חֲלֵב צֹאן
  choice: भेड़-बकरियों के दूध
  rationale: צֹאן छोटे पालतू पशुओं, विशेषतः भेड़-बकरियों, का सामूहिक शब्द है। हिन्दी में दोनों को स्पष्ट करना 'झुंड के दूध' से अधिक सहज है।
- source_word: חֵלֶב כָּרִים
  choice: मेमनों की चरबी
  rationale: חֵלֶב का ठोस अर्थ 'चरबी' है और כָּרִים युवा या पुष्ट भेड़ों को दर्शाता है। समृद्धि की मूर्त भोजन-संबंधी छवि बनाए रखी गई है।
- source_word: אֵילִים בְּנֵי בָשָׁן
  choice: बाशान में पले मेढ़े
  rationale: शाब्दिक रूप 'बाशान के पुत्र मेढ़े' है; यह बाशान में उत्पन्न या पले उत्तम पशुओं का मुहावरा है। हिन्दी में 'बाशान में पले' अर्थ और काव्यगत भव्यता दोनों बचाता है।
- source_word: עַתּוּדִים
  choice: बकरे
  rationale: यह शब्द सामान्यतः नर बकरों को सूचित करता है, इसलिए हिन्दी में लिंग को स्पष्ट रखा गया है।
- source_word: חֵלֶב כִּלְיוֹת חִטָּה
  choice: उत्तम से उत्तम गेहूँ
  rationale: शाब्दिक छवि 'गेहूँ की किडनियों की चरबी' हिन्दी में दुर्बोध होगी। यह इब्रानी मुहावरा सबसे भरे-पूरे और उत्तम गेहूँ को दर्शाता है, जिसे स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: דַם עֵנָב
  choice: अंगूरों का लहू
  rationale: अंगूर के रस या दाखमधु के लिए प्रयुक्त सजीव काव्यात्मक रूपक को बनाए रखा गया है। 'लहू' कविता में 'खून' से अधिक गरिमामय है।
- source_word: חָמֶר
  choice: झागदार दाखमधु
  rationale: यह मदिरा के लिए दुर्लभ शब्द है और संभवतः उसके लाल, गाढ़े या खमीर से उठते स्वरूप का बोध कराता है। मुख्य पाठ में 'झागदार' रखा गया और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: תִּשְׁתֶּה
  choice: तुमने ... पिया
  rationale: द्वितीय पुरुष एकवचन अपूर्ण क्रिया यहाँ गीत में बीती हुई परमेश्वर-प्रदत्त समृद्धि का वर्णन करती है; हिन्दी का सामान्य भूतकाल प्रसंगानुकूल है।
theological_decisions:
- issue: समृद्धि की काव्यात्मक सूची का अर्थ
  choice: पशुधन, अन्न और दाखमधु की ठोस छवियाँ बनाए रखी गईं।
  alternative: इन्हें अमूर्त रूप से 'बहुतायत' या 'वाचा की आशीष' कहना।
  rationale: पद स्वयं परमेश्वर की व्यवस्था को मूर्त कृषि और पशुपालन संबंधी पदार्थों में चित्रित करता है; अनुवाद में उससे आगे कोई सांप्रदायिक या रूपकात्मक अर्थ नहीं जोड़ा गया।
- issue: דַם עֵנָב और חָמֶר का संबंध
  choice: '''अंगूरों का लहू'' को ''झागदार दाखमधु'' के समानाधिकरण में रखा गया।'
  alternative: '''अंगूरों के लहू से बना दाखमधु'' कहना।'
  rationale: इब्रानी क्रम दोनों अभिव्यक्तियों को काव्यात्मक रूप से साथ रखता है और निर्माण-संबंध स्पष्ट नहीं करता; समानाधिकरण मूल की संक्षिप्तता और तनाव बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और काव्यात्मक रखी गई है। 'गाय-बैल', 'भेड़-बकरियाँ', 'मेढ़े' और 'बकरे' सामान्य पाठक के लिए स्पष्ट पशुधन-शब्द हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
