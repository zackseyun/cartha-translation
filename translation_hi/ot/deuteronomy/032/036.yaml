source:
  edition: WLC
  text: כִּֽי יָדִ֤ין יְהוָה֙ עַמּ֔/וֹ וְ/עַל עֲבָדָ֖י/ו יִתְנֶחָ֑ם כִּ֤י יִרְאֶה֙ כִּי אָ֣זְלַת יָ֔ד וְ/אֶ֖פֶס עָצ֥וּר וְ/עָזֽוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/036.yaml
  text: For Yahweh will vindicate his people and will have compassion on his servants[a], when he sees that their strength is gone, and there is none left[d][c][b], bond or free.
translation:
  language: hi
  text: क्योंकि याहवे अपने लोगों के पक्ष में न्याय करेगा[a] और अपने सेवकों पर दया करेगा[b], जब वह देखेगा कि उनका सामर्थ्य समाप्त हो चुका है[c] और न कोई बँधा हुआ, न कोई छोड़ा हुआ बचा है[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने लोगों का न्याय करेगा।” यहाँ प्रसंग उनके पक्ष में न्याय किए जाने की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने सेवकों के विषय में अपना मन बदलेगा।” इब्रानी क्रिया दया से द्रवित होने या अपने निश्चय से फिरने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ, “हाथ जाता रहा”; यह शक्ति या सामर्थ्य चुक जाने का मुहावरा है।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी में “बँधा हुआ और छोड़ा हुआ।” इस कठिन युग्म का अर्थ संभवतः “दास और स्वतंत्र,” अथवा व्यापक रूप से “कोई भी व्यक्ति,” है।
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: न्याय करके उन्हें न्याय दिलाएगा
  rationale: क्रिया में ‘न्याय करना’ और प्रसंगानुसार अपने लोगों के पक्ष में न्याय करना—दोनों भाव हैं। यह रूप न्यायिक अर्थ को बनाए रखते हुए अनुकूल निर्णय का संकेत देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि से बदला गया है।
- source_word: וְעַל עֲבָדָיו יִתְנֶחָם
  choice: और अपने सेवकों पर दया करेगा
  rationale: יִתְנֶחָם यहाँ द्रवित होने, दया करने या अपने पूर्व निश्चय से फिरने का भाव दे सकता है; असहायता वाला प्रसंग ‘दया करेगा’ का समर्थन करता है, जबकि विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: כִּי יִרְאֶה
  choice: जब वह देखेगा
  rationale: כִּי के कालगत और कारणगत संबंध में से यहाँ स्वाभाविक हिन्दी में कालगत-परिस्थितिजन्य अर्थ व्यक्त किया गया है।
- source_word: אָזְלַת יָד
  choice: उनकी शक्ति जाती रही
  rationale: शाब्दिक ‘हाथ जाता रहा’ शक्ति अथवा सामर्थ्य चुक जाने का मुहावरा है।
- source_word: וְאֶפֶס עָצוּר וְעָזוּב
  choice: बँधा हुआ हो या खुला छोड़ा हुआ—कोई भी शेष नहीं रहा
  rationale: कठिन इब्रानी युग्म को अपेक्षाकृत निकट रूप में रखा गया है और उसका संभावित समावेशी आशय पाद-टिप्पणी में स्पष्ट किया गया है; निश्चित रूप से ‘दास या स्वतंत्र’ ठहराकर मूल की अस्पष्टता समाप्त नहीं की गई।
theological_decisions:
- issue: יָדִין में परमेश्वर के न्याय की दिशा
  choice: अपने लोगों का न्याय करके उन्हें न्याय दिलाना
  alternative: अपने लोगों को दोषी ठहराकर दण्ड देना
  rationale: समानांतर दया और लोगों की पूरी असहायता का उल्लेख उनके पक्ष में न्यायिक हस्तक्षेप का समर्थन करता है; फिर भी ‘न्याय’ का मूल न्यायिक तनाव अनुवाद और पाद-टिप्पणी में सुरक्षित है।
- issue: יִתְנֶחָם का भाव
  choice: दया करेगा
  alternative: अपने सेवकों के विषय में पछताएगा/अपना निश्चय बदलेगा
  rationale: प्रसंग दयापूर्ण प्रतिक्रिया का समर्थन करता है, पर इब्रानी क्रिया में ‘मन बदलने/तरस खाने’ की अर्थ-सीमा होने के कारण विकल्प को पाद-टिप्पणी में दर्ज किया गया है।
- issue: עָצוּר וְעָזוּב की पहचान
  choice: मूल चित्र को ‘बँधा हुआ या खुला छोड़ा हुआ’ के रूप में बनाए रखना
  alternative: दास या स्वतंत्र; अथवा सब प्रकार के लोग
  rationale: युग्म का सटीक मुहावरेदार आशय विवादित है। पाठ में उसकी ठोस छवि और पाद-टिप्पणी में संभावित अर्थ देकर कृत्रिम निश्चितता से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘न्याय करके उन्हें न्याय दिलाएगा’ कुछ विस्तार के साथ मूल क्रिया के न्यायिक और पक्षसमर्थक दोनों आयाम बचाता है। अंतिम कठिन युग्म को पाठ में अति-व्याख्यायित न करके पाद-टिप्पणी में उसके प्रमुख विकल्प दिए गए हैं।
