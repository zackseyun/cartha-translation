source:
  edition: WLC
  text: שִׁחֵ֥ת ל֛/וֹ לֹ֖א בָּנָ֣י/ו מוּמָ֑/ם דּ֥וֹר עִקֵּ֖שׁ וּ/פְתַלְתֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/005.yaml
  text: They have acted corruptly toward him[a]; they are not his children, because of their defect[b]. They are a crooked and twisted generation.
translation:
  language: hi
  text: उन्होंने उसके प्रति भ्रष्ट व्यवहार किया है[a]; अपने दोष के कारण वे उसकी संतान नहीं हैं। वे टेढ़ी और कुटिल पीढ़ी हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ कठिन और अत्यंत संक्षिप्त है। पहले वाक्यांश का अर्थ यह भी हो सकता है, “उन्होंने अपने आपको भ्रष्ट कर लिया है”; और अगले वाक्यांश का अनुवाद “उनका कलंक” या “उनका दोष” भी किया जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “कुटिल और टेढ़ी पीढ़ी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁחֵת
  choice: भ्रष्ट आचरण किया है
  rationale: पिएल रूप भ्रष्ट अथवा विनाशकारी आचरण को व्यक्त करता है। यह अनुवाद क्रियात्मक अर्थ बनाए रखता है और अनिश्चित आत्मवाचक अर्थ को मुख्य पाठ में नहीं थोपता।
- source_word: לוֹ
  choice: उसके प्रति
  rationale: לְ प्रत्यय सहित इस संक्षिप्त वाक्यांश में संबंध अस्पष्ट है। ‘उसके प्रति’ परमेश्वर से संबंध बनाए रखता है, पर इसे केवल हितकारी या विरोधी अर्थ में सीमित नहीं करता।
- source_word: לֹא בָּנָיו
  choice: वे उसकी संतान नहीं हैं
  rationale: इब्रानी वाक्य क्रियारहित और अत्यंत संक्षिप्त है। हिन्दी में स्वाभाविकता के लिए ‘वे ... हैं’ जोड़ा गया है; ‘अब उसकी संतान नहीं’ कहने से वह कालगत भाव आ जाता जो मूल में स्पष्ट नहीं है।
- source_word: מוּמָם
  choice: अपने दोष के कारण
  rationale: מוּם दोष या कलंक को दर्शाता है। वाक्य-संबंध अत्यंत संक्षिप्त होने के कारण ‘के कारण’ जोड़ा गया है, पर ‘दोष’ की नैतिक रूपकात्मकता बनाए रखी गई है।
- source_word: דּוֹר
  choice: पीढ़ी
  rationale: काव्यात्मक और वाचा-संबंधी संदर्भ में यह मानक, स्पष्ट और अर्थ-सटीक हिन्दी शब्द है।
- source_word: עִקֵּשׁ
  choice: टेढ़ी
  rationale: यह शब्द मुड़े हुए अथवा नैतिक रूप से कुटिल होने का ठोस बिंब रखता है; ‘टेढ़ी’ उस बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּפְתַלְתֹּל
  choice: विकृत
  rationale: यह दुर्लभ विशेषण नैतिक टेढ़ेपन को तीव्र करता है। ‘विकृत’ पहले विशेषण से भिन्न रहते हुए उसके अर्थ को सुदृढ़ करता है।
theological_decisions:
- issue: क्या לֹא בָּנָיו वाचा-संबंधी पुत्रत्व खोने की बात कहता है या संतान होने का सीधा निषेध करता है
  choice: वे उसकी संतान नहीं हैं
  alternative: वे अब उसकी संतान नहीं हैं; वे उसके योग्य संतान नहीं हैं
  rationale: मूल पाठ बिना किसी स्पष्ट कालगत चिह्न के कठोर निषेध करता है। अनुवाद उसकी गंभीरता और धर्मवैज्ञानिक तनाव को बनाए रखता है, पर वाचा की स्थिति के विषय में उससे आगे निष्कर्ष नहीं जोड़ता।
- issue: पहले काव्यखंड की अत्यंत संक्षिप्त वाक्य-रचना
  choice: उन्होंने उसके प्रति भ्रष्ट आचरण किया है; अपने दोष के कारण वे उसकी संतान नहीं हैं
  alternative: उन्होंने अपने आपको भ्रष्ट कर लिया है; वे उसकी संतान नहीं हैं; उनका कलंक उन्हीं का है
  rationale: मसोरा-निर्दिष्ट पाठ का वाक्य-विन्यास कठिन है। मुख्य पाठ एक सुसंगत सम्भावित अर्थ देता है, जबकि वास्तविक आत्मवाचक और वाक्य-संबंधी अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और काव्यात्मक शैली रखी गई है। ‘संतान’ लिंग-समावेशी है और בָּנָיו के सामूहिक आशय के अनुकूल है। ‘टेढ़ी और विकृत’ समानार्थी होते हुए भी दोनों इब्रानी विशेषणों की तीव्रता और भिन्नता बनाए रखते हैं।
