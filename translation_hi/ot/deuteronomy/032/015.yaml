base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/015.yaml
  text: But Jeshurun grew fat and kicked; you grew fat[a], thick, and sleek. Then he forsook God who made him and treated with contempt the Rock of his salvation.
translation:
  language: hi
  text: पर यशुरून मोटा हुआ और लात मारी; तू मोटा हुआ, भारी-भरकम हुआ, और चर्बी से ढक गया[a]। तब उसने उस परमेश्वर को छोड़ दिया जिसने उसे बनाया था, और अपने उद्धार की चट्टान का तिरस्कार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “तू फूल गया।” इब्रानी शब्द दुर्लभ है और उसका ठीक भाव अनिश्चित है, पर अति-पोषण का अर्थ स्पष्ट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׁרוּן
  choice: यशुरून
  rationale: इस्राएल के लिए प्रयुक्त इस काव्यात्मक नाम/उपाधि का लिप्यंतरण मूल की ध्वनि और अर्थगत खुलापन बनाए रखता है।
- source_word: וַיִּשְׁמַן / שָׁמַנְתָּ
  choice: मोटा होकर / मोटा हो गया
  rationale: मूल शारीरिक बिंब समृद्धि से उपजी आत्मतुष्टि को व्यक्त करता है; उसे केवल ‘समृद्ध हुआ’ कहकर सपाट नहीं किया गया।
- source_word: וַיִּבְעָט
  choice: लात मारने लगा
  rationale: यह पेट भरे और उद्दंड पशु का सजीव रूपक है; ‘विद्रोह किया’ की अपेक्षा मूल चित्र को सुरक्षित रखता है।
- source_word: עָבִיתָ
  choice: भारी-भरकम
  rationale: अति-पोषण और स्थूलता के बिंब को स्वाभाविक आधुनिक हिन्दी में तीव्र करता है।
- source_word: כָּשִׂיתָ
  choice: चिकना हो गया
  rationale: दुर्लभ शब्द सम्भवतः अत्यधिक मोटे, पुष्ट या चर्बी से ढके होने का बिंब आगे बढ़ाता है; अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: וַיִּטֹּשׁ
  choice: छोड़ दिया
  rationale: आधुनिक और स्पष्ट हिन्दी में त्यागने तथा निष्ठाहीन होने का भाव व्यक्त करता है।
- source_word: אֱלוֹהַ עָשָׂהוּ
  choice: अपने बनानेवाले परमेश्वर
  rationale: परमेश्वर को इस्राएल का रचयिता बताने वाले सम्बन्ध को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: וַיְנַבֵּל
  choice: तिरस्कार किया
  rationale: क्रिया में किसी को तुच्छ या अपमान योग्य मानने का सक्रिय भाव है, जिसे ‘तिरस्कार किया’ सहजता से व्यक्त करता है।
- source_word: צוּר
  choice: चट्टान
  rationale: व्यवस्थाविवरण 32 में परमेश्वर के लिए बार-बार आने वाला दृढ़ता और रक्षा का रूपक सुरक्षित रखा गया है।
- source_word: יְשׁוּעָתוֹ
  choice: अपने उद्धार
  rationale: दैवी छुटकारे के अर्थ और धर्मवैचारिक भार को बनाए रखता है।
theological_decisions:
- issue: तीसरे पुरुष से दूसरे पुरुष और फिर तीसरे पुरुष में बदलाव
  choice: ‘यशुरून ... लगा; तू ... हो गया ... उसने ... छोड़ दिया’ के रूप में बदलाव सुरक्षित रखा
  alternative: सभी वाक्यांशों को तीसरे पुरुष में एकरूप करना
  rationale: मूल इब्रानी वर्णन से सीधे अभियोग और फिर वर्णन की ओर लौटती है; यह बदलाव काव्यात्मक और वाग्मितापूर्ण प्रभाव का अंग है।
- issue: צוּר का दैवी रूपक
  choice: ‘अपने उद्धार की चट्टान’
  alternative: व्याख्यात्मक रूप से ‘अपने उद्धारकर्ता परमेश्वर’
  rationale: ‘चट्टान’ गीत का प्रमुख दैवी रूपक है; उसे व्याख्या में बदलने के बजाय मूल तनाव और चित्रात्मकता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक पर स्पष्ट शैली अपनाई गई है। ‘यशुरून’ को नाम के रूप में रखा गया, शारीरिक बिंबों को नरम नहीं किया गया, और पुरुष-वचन का अचानक बदलाव मूल के अनुसार सुरक्षित रखा गया है।
