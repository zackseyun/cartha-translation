id: DEU.32.49
reference: Deuteronomy 32:49
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֲלֵ֡ה אֶל הַר֩ הָ/עֲבָרִ֨ים הַ/זֶּ֜ה הַר נְב֗וֹ אֲשֶׁר֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וּ/רְאֵה֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֨ר אֲנִ֥י נֹתֵ֛ן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לַ/אֲחֻזָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/049.yaml
  text: Go up to this mountain of the Abarim[a], Mount Nebo, which is in the land of Moab, opposite Jericho, and see the land of Canaan[c][b], which I am giving to the sons of Israel as a possession.
translation:
  language: hi
  text: मोआब देश में यरीहो के सामने स्थित अबारीम के इस पर्वत पर, अर्थात् नबो पर्वत पर, चढ़ जा। कनान देश को देख, जिसे मैं इस्राएलियों[a] को उनकी संपत्ति[b] के रूप में दे रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल इब्रानी में: “इस्राएल के पुत्रों।”'
    reason: मूल पद की शाब्दिक बनावट बताने के लिए।
  - marker: b
    text: या “अधिकार की भूमि”; इस इब्रानी शब्द का अर्थ अधिकार में मिली संपत्ति या भू-भाग है।
    reason: भू-संपत्ति संबंधी शब्द की अर्थ-सीमा स्पष्ट करने के लिए।
lexical_decisions:
- source_word: עֲלֵה
  choice: चढ़ जा
  rationale: यह עלה का पुल्लिंग एकवचन आज्ञार्थक रूप है। ‘चढ़ जा’ दिशा और प्रत्यक्ष आज्ञा—दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַר הָעֲבָרִים הַזֶּה הַר נְבוֹ
  choice: अबारीम के इस पर्वत पर, अर्थात् नबो पर्वत पर
  rationale: ‘अबारीम’ भौगोलिक नाम है और ‘नबो पर्वत’ उसी पर्वत की समानाधिकरण पहचान है। ‘अर्थात्’ हिन्दी में इस संबंध को स्पष्ट करता है, बिना दोनों को अलग पर्वत बनाए।
- source_word: אֲשֶׁר בְּאֶרֶץ מוֹאָב אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: मोआब देश में यरीहो के सामने स्थित
  rationale: दोनों संबंधवाचक उपवाक्यों को सहज हिन्दी में संयुक्त किया गया है। भौगोलिक प्रयोग में עַל־פְּנֵי का अर्थ ‘के सामने/सम्मुख’ है।
- source_word: וּרְאֵה אֶת אֶרֶץ כְּנַעַן
  choice: कनान देश को देख
  rationale: ראה की सरल आज्ञा और कर्म ‘कनान देश’ को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: जिसे मैं ... दे रहा हूँ
  rationale: सर्वनाम אֲנִי के बल और वर्तमान कृदंत נֹתֵן की जारी अथवा आसन्न दान-क्रिया को ‘मैं ... दे रहा हूँ’ सुरक्षित रखता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह रूढ़ जातीय पद है। आधुनिक हिन्दी में ‘इस्राएलियों’ पूरे समुदाय को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לַאֲחֻזָּה
  choice: उनकी संपत्ति के रूप में
  rationale: אֲחֻזָּה स्थायी अधिकार में मिली संपत्ति, विशेषकर भूमि, को दर्शाता है। ‘संपत्ति’ इस अर्थ को स्पष्ट रखता है, जबकि ‘विरासत’ की अतिरिक्त वंशानुगत छाया को मुख्य पाठ में अनिवार्य नहीं बनाता।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל को शाब्दिक रूप में रखा जाए या जातीय समुदाय के नाम के रूप में
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: इस प्रसंग में यह पूरे वाचा-समुदाय का रूढ़ नाम है, न कि केवल प्रत्यक्ष पुरुष संतानों का उल्लेख। स्वाभाविक हिन्दी के लिए जातीय रूप मुख्य पाठ में है और मूल की शाब्दिक बनावट पादटिप्पणी में सुरक्षित है।
- issue: אֲחֻזָּה का अर्थ ‘संपत्ति’ या ‘विरासत’
  choice: संपत्ति
  alternative: विरासत
  rationale: यह संज्ञा अधिकार में प्राप्त भू-संपत्ति या स्थायी भू-धारण को प्रमुखता से व्यक्त करती है। ‘विरासत’ संभव है, पर इस पद में वंशानुगत अर्थ को आवश्यक रूप से स्पष्ट नहीं किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर की मूसा को दी गई एकवचन आज्ञा को ‘चढ़ जा’ और ‘देख’ से प्रत्यक्ष रखा गया है। भौगोलिक नाम प्रचलित हिन्दी रूपों—अबारीम, नबो, मोआब, यरीहो और कनान—में लिप्यंतरित हैं।
