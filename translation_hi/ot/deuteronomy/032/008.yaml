  text: בְּ/הַנְחֵ֤ל עֶלְיוֹן֙ גּוֹיִ֔ם בְּ/הַפְרִיד֖/וֹ בְּנֵ֣י אָדָ֑ם יַצֵּב֙ גְּבֻלֹ֣ת עַמִּ֔ים לְ/מִסְפַּ֖ר בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/008.yaml
  text: When the Most High gave the nations their inheritance[a], when he separated the sons of man[b], he fixed the boundaries of the peoples according to the number of the sons of Israel.
translation:
  language: hi
  text: जब परमप्रधान ने जातियों को उनकी विरासत बाँटी, जब उसने मनुष्यों[a] को अलग किया, तब उसने लोगों की सीमाएँ इस्राएल के पुत्रों[b] की संख्या के अनुसार निश्चित कीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्य के पुत्रों”; यह इब्रानी अभिव्यक्ति मनुष्यों या समस्त मानवजाति के लिए प्रयुक्त होती है।
    reason: lexical_alternative
  - marker: b
    text: मृत सागर चर्मपत्रों के कुछ पाठों में “परमेश्वर के पुत्रों” पाठ मिलता है; सेप्टुआजिन्त में “परमेश्वर के स्वर्गदूतों” पाठ मिलता है। ये पाठ मसोरेटिक पाठ के “इस्राएल के पुत्रों” से भिन्न हैं।
    reason: textual_variant
lexical_decisions:
- source_word: בְּ/הַנְחֵל
  choice: जब ... ने ... उनका भाग दिया
  rationale: हिफ़ील infinitive construct और בְּ मिलकर कालवाचक उपवाक्य बनाते हैं। यहाँ जातियों को उनका निर्धारित भाग या विरासत देने का भाव है; आधुनिक हिन्दी में ‘उनका भाग दिया’ स्वाभाविक और संदर्भानुकूल है।
- source_word: עֶלְיוֹן
  choice: परमप्रधान
  rationale: यह परमेश्वर की उपाधि है। ‘परमप्रधान’ उसका ऊँचा, काव्यात्मक और परिचित हिन्दी रूप है।
- source_word: גּוֹיִם
  choice: जातियों
  rationale: यहाँ संसार की विभिन्न जातियों या राष्ट्रों का उल्लेख है, न कि बाद के धार्मिक अर्थ में केवल ‘अन्यजातियों’ का।
- source_word: בְּ/הַפְרִיד/וֹ
  choice: जब उसने ... को अलग-अलग किया
  rationale: दूसरा कालवाचक infinitive construct है। ‘अलग-अलग किया’ मानव समुदायों के विभाजन का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: בְּנֵי אָדָם
  choice: मनुष्यों
  rationale: शाब्दिक अर्थ ‘आदम के पुत्र/मनुष्य के पुत्र’ है, पर यह इब्रानी मुहावरा समस्त मानवजाति को दर्शाता है। मुख्य पाठ में ‘मनुष्यों’ से अर्थ सहज रहता है और पादटिप्पणी शाब्दिक रूप बताती है।
- source_word: יַצֵּב
  choice: ठहराईं
  rationale: हिफ़ील रूप दृढ़तापूर्वक निर्धारित या स्थापित करने का भाव देता है। सीमाओं के साथ ‘ठहराईं’ गरिमापूर्ण और स्वाभाविक है।
- source_word: גְּבֻלֹת עַמִּים
  choice: लोगों की सीमाएँ
  rationale: ‘सीमाएँ’ भूभागों के निर्धारण को व्यक्त करता है; עַמִּים के लिए ‘लोगों’ से पहले आए ‘जातियों’ की अनावश्यक पुनरावृत्ति बचती है।
- source_word: לְ/מִסְפַּר
  choice: की गिनती के अनुसार
  rationale: यह पद संख्या के अनुरूपता-संबंध को व्यक्त करता है। ‘गिनती के अनुसार’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: प्रदत्त WLC पाठ का शाब्दिक अर्थ सुरक्षित रखा गया है। महत्त्वपूर्ण पाठांतर पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: अंतिम पदबंध का पाठांतर
  choice: इस्राएल के पुत्रों
  alternative: परमेश्वर के पुत्रों; परमेश्वर के स्वर्गदूतों
  rationale: प्रदत्त WLC मसोरेटिक पाठ में בְּנֵי יִשְׂרָאֵל है, इसलिए मुख्य पाठ उसी का अनुसरण करता है। मृत सागर चर्मपत्रों और सेप्टुआजिन्त से समर्थित भिन्न पाठ व्याख्या पर गहरा प्रभाव डालता है, इसलिए उसे पादटिप्पणी में स्पष्ट रखा गया है।
- issue: בְּנֵי אָדָם का मानवशास्त्रीय मुहावरा
  choice: मनुष्यों
  alternative: मनुष्य के पुत्रों; आदम के पुत्रों
  rationale: यहाँ इब्रानी बहुवचन पदबंध प्रतिनिधिक रूप से मानवजाति को दर्शाता है। स्वाभाविक आधुनिक हिन्दी के लिए अर्थ मुख्य पाठ में दिया गया है, जबकि शाब्दिक बनावट पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में काव्यात्मक गरिमा बनाए रखती है। ‘परमप्रधान’, ‘भाग’ और ‘सीमाएँ ठहराईं’ जैसे पद सामान्य पाठक के लिए बोधगम्य हैं। इब्रानी मुहावरे को मुख्य पाठ में स्वाभाविक किया गया है और उसका शाब्दिक रूप पादटिप्पणी में रखा गया है।
