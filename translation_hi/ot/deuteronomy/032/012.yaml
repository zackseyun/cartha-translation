lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בָּדָד
  choice: ही अकेला
  rationale: यह क्रियाविशेषण बताता है कि याहवे ने बिना किसी अन्य की सहायता या संगति के यह कार्य किया; ‘ही अकेला’ इस विशेष बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַנְחֶנּוּ
  choice: उसे ले चला
  rationale: हिफ़ील रूप यहाँ अगुवाई करने या मार्ग दिखाने का अर्थ देता है। एकवचन पुल्लिंग कर्म-प्रत्यय को ‘उसे’ से सुरक्षित रखा गया है; निकटवर्ती संदर्भ में यह इस्राएल/याकूब को सामूहिक रूप से दर्शाता है।
- source_word: וְאֵין עִמּוֹ
  choice: और उसके साथ ... न था
  rationale: अस्तित्ववाचक निषेध और संगति-सूचक संबंध को सहज हिन्दी वाक्य-विन्यास में व्यक्त किया गया है।
- source_word: אֵל נֵכָר
  choice: पराया देवता
  rationale: यह इस्राएल के परमेश्वर से भिन्न, बाहरी देवता को दर्शाता है। ‘पराया देवता’ आधुनिक हिन्दी में स्पष्ट है और मूर्तिपूजा-विरोधी भाव बनाए रखता है।
theological_decisions:
- issue: ‘उसे’ और ‘उसके’ में एकवचन सर्वनाम का संदर्भ
  choice: इब्रानी के एकवचन पुल्लिंग सर्वनाम को बनाए रखा गया है; यह संदर्भ में इस्राएल/याकूब के सामूहिक व्यक्तित्व को सूचित करता है।
  alternative: राष्ट्र के बहुवचन अर्थ को स्पष्ट करने के लिए ‘उन्हें/उनके’ कहना।
  rationale: मूल पाठ व्याकरणिक रूप से एकवचन है और निकटवर्ती गीत में याकूब/इस्राएल को एक सामूहिक व्यक्ति के रूप में प्रस्तुत करता है; बहुवचन करने से यह साहित्यिक विशेषता मिट जाती।
translation_notes:
