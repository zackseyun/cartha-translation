source:
  edition: WLC
  text: הֲ/לֹא ה֖וּא כָּמֻ֣ס עִמָּ/דִ֑י חָתֻ֖ם בְּ/אוֹצְרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/034.yaml
  text: Is it not laid up with me[b][a], sealed in my storehouses?
translation:
  language: hi
  text: क्या यह मेरे पास संचित नहीं है,[a] मेरे भंडारों में मुहरबंद नहीं है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे पास छिपा हुआ’।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे कोषों में’।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं है
  rationale: यह ऐसी आलंकारिक प्रश्न-रचना है जिसमें सकारात्मक उत्तर अपेक्षित है; हिन्दी में ‘क्या ... नहीं है’ इसके प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: הוּא
  choice: यह
  rationale: इब्रानी सर्वनाम पुल्लिंग एकवचन है, पर यहाँ वह पिछली बात का समाहारात्मक संकेत करता है। ‘यह’ किसी पुरुषवाचक संदर्भ को अनावश्यक रूप से निश्चित किए बिना संकेतात्मक अस्पष्टता बनाए रखता है।
- source_word: כָּמֻס
  choice: संचित
  rationale: निष्क्रिय कृदन्त किसी वस्तु के छिपाकर अथवा सुरक्षित रखे जाने का भाव देता है। ‘संचित’ भंडारण के अगले बिंब से स्वाभाविक रूप से जुड़ता है; ‘छिपा हुआ’ भी संभव है।
- source_word: עִמָּדִי
  choice: मेरे पास
  rationale: यह पद सीधे तौर पर ‘मेरे साथ/मेरे पास’ का भाव देता है और परमेश्वर की अभिरक्षा या अधिकार को बिना विस्तार किए व्यक्त करता है।
- source_word: חָתֻם
  choice: मुहरबंद
  rationale: निष्क्रिय कृदन्त किसी वस्तु के मुहर लगाकर सुरक्षित किए जाने को दर्शाता है; ‘मुहरबंद’ आधुनिक हिन्दी में संक्षिप्त और सटीक है।
- source_word: בְּאוֹצְרֹתָי
  choice: मेरे भंडारों में
  rationale: बहुवचन संज्ञा संग्रह या सुरक्षित रखने के स्थानों को सूचित करती है। ‘भंडारों’ से धन-संपत्ति तक सीमित अर्थ लिए बिना भंडारण का बिंब बना रहता है।
theological_decisions:
- issue: संचित और मुहरबंद वस्तु का संदर्भ
  choice: ‘यह’—पिछली कही हुई बात का संकेत, जिसका ठीक पूर्वपद अनिश्चित रहने दिया गया है
  alternative: ‘वह’ किसी शत्रु राष्ट्र या व्यक्तिवाची विषय के लिए; अथवा पिछली धमकियों का अधिक स्पष्ट सार
  rationale: इब्रानी הוּא व्याकरणतः पुल्लिंग एकवचन है, किंतु प्रसंग में किसी पूर्ववर्ती विषय या बात का समाहारात्मक संकेत हो सकता है। ‘यह’ अपराध के लेखे या सुरक्षित रखे न्याय में से किसी एक को अंतिम रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज काव्यात्मक गद्य। समानांतर पद-रचना रखी गई है और भंडारण तथा मुहर के मूल बिंब सुरक्षित हैं।
