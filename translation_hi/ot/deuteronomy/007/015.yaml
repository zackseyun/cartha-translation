source:
  edition: WLC
  text: וְ/הֵסִ֧יר יְהוָ֛ה מִמְּ/ךָ֖ כָּל חֹ֑לִי וְ/כָל מַדְוֵי֩ מִצְרַ֨יִם הָ/רָעִ֜ים אֲשֶׁ֣ר יָדַ֗עְתָּ לֹ֤א יְשִׂימָ/ם֙ בָּ֔/ךְ וּ/נְתָנָ֖/ם בְּ/כָל שֹׂנְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/015.yaml
  text: And Yahweh will remove from you all sickness[a], and none of the evil diseases of Egypt that you have known[b] will he put on you; instead, he will put them on all who hate you.
translation:
  language: hi
  text: याहवे तुमसे हर बीमारी दूर कर देगा। मिस्र के जिन हानिकारक रोगों[a] को तुम जानते हो[b], उन्हें वह तुम पर नहीं डालेगा; बल्कि उन्हें उन सब पर डालेगा जो तुमसे घृणा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बुरे रोगों’ अथवा ‘कष्टदायक रोगों’। इब्रानी विशेषण का अर्थ बुरा, अहितकर, हानिकारक या कष्टदायक हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जिनका तुमने अनुभव किया है’। यहाँ ‘जानना’ अनुभव से परिचित होने का भाव रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵסִיר
  choice: दूर कर देगा
  rationale: हिफ़ील रूप किसी वस्तु को हटाने या दूर करने का कारण बनने का भाव देता है; यह हिंदी में स्वाभाविक रूप से उस कारक अर्थ को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִמְּךָ
  choice: तुमसे
  rationale: מן के साथ द्वितीय पुरुष एकवचन प्रत्यय अलगाव का भाव देता है; ‘तुमसे’ हटाने की क्रिया के साथ सीधा और स्वाभाविक है।
- source_word: כָּל חֹלִי
  choice: हर बीमारी
  rationale: חֹלִי बीमारी या रोग को दर्शाता है। ‘हर बीमारी’ एकवचन सामूहिक अभिव्यक्ति को सहज हिंदी में रखता है।
- source_word: מַדְוֵי מִצְרַיִם הָרָעִים
  choice: मिस्र के ... भयंकर रोगों
  rationale: מַדְוֶה रोग है और הָרָעִים का अर्थ बुरा, हानिकारक या कष्टदायक हो सकता है। रोगों के संदर्भ में ‘भयंकर’ स्वाभाविक है और उनकी गंभीर, अहितकर प्रकृति व्यक्त करता है; अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: אֲשֶׁר יָדַעְתָּ
  choice: जिन ... को तुमने जाना है
  rationale: ידע सामान्य ज्ञान के साथ अनुभवजन्य परिचय भी व्यक्त कर सकता है। ‘जाना है’ मूल शब्दावली और उसकी संभावित व्यापकता बनाए रखता है।
- source_word: לֹא יְשִׂימָם בָּךְ
  choice: उनमें से किसी को भी वह तुम पर नहीं डालेगा
  rationale: שים के साथ ב किसी पर कुछ रखने या डालने को दर्शाता है। हिंदी में ‘किसी को भी ... नहीं’ पूर्ण निषेध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וּנְתָנָם
  choice: बल्कि वह उन्हें ... डालेगा
  rationale: נתן का मूल अर्थ देना है, पर रोग किसी पर आने के संदर्भ में ‘डालना’ स्वाभाविक है। ‘बल्कि’ पिछले निषेध और इसके विपरीत परिणाम के बीच संबंध स्पष्ट करता है।
- source_word: בְּכָל שֹׂנְאֶיךָ
  choice: उन सब पर ... जो तुमसे घृणा करते हैं
  rationale: सहभागी रूप का सटीक अर्थ ‘तुमसे घृणा करनेवाले’ है; इसे व्यापक ‘शत्रु’ में नहीं बदला गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: मिस्र के रोगों से रक्षा की प्रतिज्ञा का स्वरूप
  choice: वाचा के प्रसंग में बीमारी और मिस्र के रोगों से ठोस रक्षा की प्रतिज्ञा
  alternative: हर परिस्थिति में प्रत्येक व्यक्ति को सभी रोगों से सार्वकालिक प्रतिरक्षा; केवल रूपकात्मक विपत्ति
  rationale: इब्रानी पाठ शारीरिक बीमारी और मिस्र के रोगों की ठोस भाषा बोलता है, पर यह पद स्वयं इस प्रतिज्ञा को हर व्यक्ति और हर समय के लिए निरपेक्ष सिद्धांत नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमामय किंतु सामान्य पाठक के लिए सहज रखी गई है। पूरे पद में ‘तुम’ एकवचन है, जैसा इब्रानी प्रत्ययों में है। वाक्यक्रम हिंदी की स्वाभाविकता के अनुसार है, जबकि निषेध, विरोध और रोगों को ‘किसी पर डालने’ की मूल छवि सुरक्षित रखी गई है।
