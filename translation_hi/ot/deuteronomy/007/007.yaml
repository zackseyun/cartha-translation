source:
  edition: WLC
  text: לֹ֣א מֵֽ/רֻבְּ/כֶ֞ם מִ/כָּל הָֽ/עַמִּ֗ים חָשַׁ֧ק יְהוָ֛ה בָּ/כֶ֖ם וַ/יִּבְחַ֣ר בָּ/כֶ֑ם כִּֽי אַתֶּ֥ם הַ/מְעַ֖ט מִ/כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/007.yaml
  text: It was not because you were more numerous than all the peoples that Yahweh set his affection on you and chose you[a], for you were the fewest of all the peoples.
translation:
  language: hi
  text: याहवे ने तुम पर स्नेह इसलिए नहीं रखा और तुम्हें नहीं चुना कि तुम सभी जातियों से अधिक संख्या में थे,[a] क्योंकि तुम तो सभी जातियों में सबसे कम संख्या में थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमसे प्रेम किया।” इब्रानी क्रिया गहरे लगाव, अनुराग या स्नेहपूर्ण जुड़ाव का भाव व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֻבְּכֶם מִכָּל הָעַמִּים
  choice: कि तुम सब जातियों से अधिक संख्या में थे
  rationale: यहाँ מִן तुलना प्रकट करता है और רֹב संख्यात्मक बहुलता को; यह हिंदी रूप निषेध के साथ कारण और तुलना दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִכָּל הָעַמִּים
  choice: सब जातियों से / सब जातियों में
  rationale: עַמִּים यहाँ विभिन्न जनसमूहों के लिए है। आधुनिक हिंदी में ‘जातियाँ’ इस सामूहिक-जातीय अर्थ को ‘राष्ट्रों’ से अधिक सहजता से व्यक्त करता है।
- source_word: חָשַׁק
  choice: लगाव रखा
  rationale: क्रिया प्रबल अनुराग, आसक्ति या स्नेहपूर्वक किसी से जुड़ने का भाव रखती है। ‘लगाव रखा’ इस संबंधपरक बल को सहज हिंदी में बचाता है; ‘प्रेम किया’ भी संभव है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: וַיִּבְחַר
  choice: चुना
  rationale: בחר का सीधा अर्थ ‘चुनना’ है; इससे वाचा-संबंधी चुनाव की भाषा सुरक्षित रहती है, पर बाद की धर्मवैज्ञानिक व्याख्या नहीं जोड़ी जाती।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले निषेध की व्याख्या प्रस्तुत करता है; ‘क्योंकि’ हिंदी में इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: הַמְעַט מִכָּל הָעַמִּים
  choice: सब जातियों में सबसे कम संख्या में
  rationale: पदबंध इस्राएल की संख्यात्मक अल्पता बताता है। ‘सबसे कम संख्या में’ आरंभिक बहुलता-विषयक तुलना को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में व्यक्तिगत वाचा-नाम स्पष्ट रूप से है; इसलिए नाम का लिप्यंतरण किया गया है, उसे उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: परमेश्वर के चुनाव का संभावित सिद्धांतगत अतिपाठ
  choice: तुमसे लगाव रखकर तुम्हें ... चुना
  alternative: तुमसे प्रेम करके तुम्हें ... चुन लिया
  rationale: मूल कथन इस्राएल के प्रति याहवे के अनुराग और चुनाव को उसकी संख्या से अलग करता है। अनुवाद इतना ही कहता है और किसी बाद की व्यवस्थित धर्मवैज्ञानिक श्रेणी को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘अधिक संख्या में’ और ‘सबसे कम संख्या में’ से पद का संख्यात्मक विरोध स्पष्ट रखा गया है।
