  text: וְ/גַם֙ אֶת הַ/צִּרְעָ֔ה יְשַׁלַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ בָּ֑/ם עַד אֲבֹ֗ד הַ/נִּשְׁאָרִ֛ים וְ/הַ/נִּסְתָּרִ֖ים מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/020.yaml
  text: Moreover[b][a], Yahweh your God will send the hornet among them until even those who remain and those who hide themselves from before you perish.
translation:
  language: hi
  text: इसके अतिरिक्त[b], यहोवा, तुम्हारा परमेश्वर, उनके बीच बर्रों[a] को भेजेगा, जब तक कि जो बचे रह गए हैं और जो तुमसे छिपे हैं, वे नष्ट न हो जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “आतंक” अथवा “घबराहट”; कुछ लोग “बर्रों” को वास्तविक कीटों के बजाय परमेश्वर द्वारा भेजे गए भय का आलंकारिक वर्णन समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “और इसके अतिरिक्त।”
    reason: previous_rendering
lexical_decisions:
- source_word: וְגַם
  choice: इसके अतिरिक्त
  rationale: यह अभिव्यक्ति पिछले कथन से जोड़ते हुए अतिरिक्त और बलात्मक अर्थ देती है; आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הַצִּרְעָה
  choice: बर्रों
  rationale: मूल शब्द एकवचन और निश्चित है, पर जातिवाचक/समूहवाचक अर्थ रख सकता है; हिन्दी में ‘बर्रों’ इस भेजे जाने वाले डंक मारने वाले कीट-समूह को स्वाभाविक रूप से व्यक्त करता है। आतंक या घबराहट का आलंकारिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יְשַׁלַּח
  choice: भेजेगा
  rationale: यह यहोवा द्वारा सक्रिय रूप से इस साधन को शत्रुओं के बीच भेजने की क्रिया को स्पष्ट रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के निज नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन के अधिकारसूचक रूप और वाचा-संबंधी संबोधन को सीधे बनाए रखता है।
- source_word: בָּם
  choice: उनके बीच
  rationale: 'पूर्वसर्ग का स्थानगत भाव सुरक्षित रहता है: बर्रे शत्रुओं के बीच भेजे जाते हैं।'
- source_word: עַד אֲבֹד
  choice: जब तक ... नष्ट न हो जाएँ
  rationale: यह क्रिया के अंतिम परिणाम को दर्शाता है और विनाश की विधि को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: הַנִּשְׁאָרִים
  choice: बचे हुए
  rationale: पहले के न्याय या संघर्ष के बाद शेष रह गए लोगों का सीधा और प्रसंगानुकूल अर्थ देता है।
- source_word: וְהַנִּסְתָּרִים
  choice: और छिपे हुए लोग
  rationale: निफ़अल कृदन्त के रूप को अपेक्षाकृत निकटता से रखता है और उन शत्रुओं को सूचित करता है जो छिपे हुए हैं।
- source_word: מִפָּנֶיךָ
  choice: तुम्हारे सामने से
  rationale: ‘तुम्हारे मुख/उपस्थिति से’ के इब्रानी मुहावरे और इस्राएल के आगे बढ़ने से बचने के भाव को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के निज नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: निज नाम को सामान्य उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया; हिन्दी पाठकों में परिचित लिप्यंतरण ‘यहोवा’ चुना गया है।
- issue: הַצִּרְעָה का शाब्दिक या आलंकारिक अर्थ
  choice: मुख्य पाठ में शाब्दिक ‘बर्रे’
  alternative: परमेश्वर द्वारा भेजा गया आतंक या घबराहट
  rationale: शब्द का प्रत्यक्ष कोशीय अर्थ डंक मारने वाला कीट है। सम्भव आलंकारिक अर्थ को निर्णायक रूप से नकारे बिना पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘इसके अतिरिक्त’ वְגַם के जोड़ और बल को स्वाभाविक हिन्दी में व्यक्त करता है। ‘बर्रों’ जातिवाचक बहुवचन के रूप में प्रयोग हुआ है; शाब्दिक और आलंकारिक सम्भावनाओं के बीच तनाव पादटिप्पणी द्वारा सुरक्षित है।
