id: DEU.7.22
reference: Deuteronomy 7:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָשַׁל֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛ל מִ/פָּנֶ֖י/ךָ מְעַ֣ט מְעָ֑ט לֹ֤א תוּכַל֙ כַּלֹּתָ֣/ם מַהֵ֔ר פֶּן תִּרְבֶּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/022.yaml
  text: And Yahweh your God will drive out these nations before you little by little[a]. You will not be able to finish them off quickly[b], lest the wild animals become too numerous against you.
translation:
  language: hi
  text: तुम्हारा परमेश्वर याहवे इन जातियों को तुम्हारे सामने से थोड़ा-थोड़ा करके निकाल देगा[a]। तुम उन्हें शीघ्र पूरी तरह नष्ट नहीं कर सकोगे, नहीं तो जंगली जानवर[b] तुम्हारे विरुद्ध बहुत बढ़ जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन जातियों को तुम्हारे सामने से थोड़ा-थोड़ा करके बेदखल करेगा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “खुले मैदान के पशु।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשַׁל
  choice: निकाल देगा
  rationale: यहाँ क्रिया का अर्थ इन जातियों को देश से हटाना या बेदखल करना है। ‘निकाल देगा’ सहज आधुनिक हिन्दी है; अधिक औपचारिक ‘बेदखल करेगा’ को पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: הַגּוֹיִם הָאֵל
  choice: इन जातियों
  rationale: संदर्भ कनानी जनसमूहों का है। ‘जातियों’ आधुनिक हिन्दी बाइबलीय प्रयोग में राष्ट्रों/जनसमूहों दोनों का बोध करा सकता है और निकटवाची संकेत ‘इन’ को बनाए रखता है।
- source_word: מִפָּנֶיךָ
  choice: तुम्हारे सामने से
  rationale: यह स्थानिक मुहावरा इस्राएल के मार्ग या उपस्थिति से हटाए जाने को व्यक्त करता है।
- source_word: מְעַט מְעָט
  choice: थोड़ा-थोड़ा करके
  rationale: इब्रानी की पुनरुक्ति और क्रमिकता दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: לֹא תוּכַל
  choice: नहीं कर सकोगे
  rationale: यह आगामी परिस्थिति में सामर्थ्य या अनुमति-सदृश सीमा नहीं, वास्तविक असमर्थता व्यक्त करता है।
- source_word: כַּלֹּתָם
  choice: उन्हें ... पूरी तरह नष्ट
  rationale: כלה यहाँ किसी प्रक्रिया को पूर्ण अंत तक पहुँचाने का अर्थ देता है। ‘पूरी तरह नष्ट’ पूर्णता के भाव को स्पष्ट रखता है और बोलचाल के ‘काम तमाम करना’ से अधिक गरिमापूर्ण है।
- source_word: מַהֵר
  choice: शीघ्र
  rationale: यह गति की क्रियाविशेषणीय धारणा को संक्षिप्त, स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: פֶּן
  choice: नहीं तो
  rationale: यह चेतावनीपूर्ण संभावित परिणाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תִּרְבֶּה
  choice: बहुत बढ़ जाएँगे
  rationale: क्रिया संख्या में वृद्धि बताती है; ‘बहुत’ उस खतरनाक अधिकता को व्यक्त करता है जो संदर्भ में निहित है।
- source_word: חַיַּת הַשָּׂדֶה
  choice: जंगली जानवर
  rationale: शाब्दिक अर्थ ‘मैदान के जीव/पशु’ है, पर संदर्भ में पालतू पशुओं के विपरीत वन्य जीव अभिप्रेत हैं। शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: עָלֶיךָ
  choice: तुम्हारे विरुद्ध
  rationale: यहाँ उपसर्ग इस्राएल पर पड़ने वाले प्रतिकूल और खतरनाक प्रभाव को दर्शाता है; ‘विरुद्ध’ उस तनाव को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि से नहीं बदलता।
- issue: כַּלֹּתָם में विनाश की पूर्णता
  choice: पूरी तरह नष्ट करना
  alternative: उनका अंत कर देना; उनका सफाया करना
  rationale: मूल क्रिया पूर्ण अंत का भाव रखती है। अनुवाद इसे कम नहीं करता, पर अत्यधिक बोलचाल या अतिरिक्त सैन्य शब्दावली भी नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, स्पष्ट और गरिमापूर्ण रखी गई है। एकवचन सामूहिक संबोधन के अनुरूप ‘तुम्हारा/तुम्हारे/सकोगे’ प्रयुक्त हैं। इब्रानी पुनरुक्ति ‘थोड़ा-थोड़ा’ सुरक्षित है और कारणात्मक चेतावनी को ‘नहीं तो’ से स्वाभाविक बनाया गया है।
