  edition: WLC
  text: וּ/מְשַׁלֵּ֧ם לְ/שֹׂנְאָ֛י/ו אֶל פָּנָ֖י/ו לְ/הַאֲבִיד֑/וֹ לֹ֤א יְאַחֵר֙ לְ/שֹׂ֣נְא֔/וֹ אֶל פָּנָ֖י/ו יְשַׁלֶּם לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/010.yaml
  text: and repays those who hate him to their face[a], to destroy them. He does not delay with the one who hates him; he will repay him to his face.
translation:
  language: hi
  text: और जो उससे घृणा करते हैं, उन्हें वह उनके सामने ही दण्ड देता है, ताकि उनका नाश करे। जो उससे घृणा करता है, उसे दण्ड देने में वह देर नहीं करता; वह उसके सामने ही उसे दण्ड देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמְשַׁלֵּם
  choice: और ... बदला देता है
  rationale: पिएल रूप यहाँ किए हुए का प्रतिफल लौटाने या बदला चुकाने का अर्थ रखता है। यह चयन न्यायपूर्ण प्रत्युत्तर की धार को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: לְשֹׂנְאָיו
  choice: जो उससे घृणा करते हैं
  rationale: कृदन्त उन लोगों को सूचित करता है जिनका रवैया उसके प्रति घृणा का है; यह ‘उसके शत्रु’ से अधिक सटीक है।
- source_word: אֶל־פָּנָיו
  choice: उनके मुँह पर
  rationale: इब्रानी मुहावरे की प्रत्यक्षता और व्यक्तिगत प्रत्युत्तर को सुरक्षित रखा गया है। पहली बार बहुवचन संदर्भ के अनुसार ‘उनके’ और दूसरी बार एकवचन के अनुसार ‘उसके’ रखा गया है।
- source_word: לְהַאֲבִידוֹ
  choice: ताकि उनका नाश कर दे
  rationale: हिफ़ील infinitive प्रतिदान के उद्देश्य या परिणाम को व्यक्त करता है। ‘नाश कर दे’ ईश्वरीय कर्तृत्व और विनाश की प्रबलता को स्पष्ट रखता है।
- source_word: לֹא יְאַחֵר
  choice: वह देर नहीं करता
  rationale: पिएल क्रिया का अर्थ विलंब करना है। सामान्य covenantal कथन के लिए वर्तमानकालीन हिन्दी स्वाभाविक है।
- source_word: לְשֹׂנְאוֹ
  choice: जो उससे घृणा करता है, उसके विषय में
  rationale: לְ को सम्बन्धसूचक रूप में प्रस्तुत किया गया है; इससे हिन्दी में वाक्य स्पष्ट रहता है और एकवचन की ओर मूल पाठ का बदलाव सुरक्षित रहता है।
- source_word: יְשַׁלֶּם לוֹ
  choice: वह ... उसे बदला देगा
  rationale: आरम्भिक क्रिया से शाब्दिक सम्बन्ध बनाए रखा गया है और दूसरी पंक्ति का एकवचन केन्द्र सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय न्याय की भाषा
  choice: परमेश्वर स्वयं उससे घृणा करने वालों को सीधे बदला देता और उनका नाश करता है
  alternative: इसे केवल कर्मों के सामान्य या अप्रत्यक्ष परिणाम के रूप में कहना
  rationale: इब्रानी पाठ में परमेश्वर प्रतिदान और नाश का प्रत्यक्ष कर्ता है। अनुवाद इस तनावपूर्ण व्यक्तिगत कर्तृत्व को नरम नहीं करता।
- issue: बहुवचन से एकवचन की ओर बदलाव
  choice: पहले ‘जो ... करते हैं/उनके’, फिर ‘जो ... करता है/उसके/उसे’
  alternative: दोनों वाक्यांशों को समान रूप से बहुवचन करना
  rationale: मूल पाठ का व्याकरणिक बदलाव प्रत्येक घृणा करने वाले पर न्याय के व्यक्तिगत लागू होने को उभारता है; इसे संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी और सामान्य पाठक के लिए बोधगम्य शैली। ‘मुँह पर’ मूल मुहावरे की तीव्रता रखता है; पादटिप्पणी उसके सम्भव स्थानवाचक अर्थ स्पष्ट करती है।
