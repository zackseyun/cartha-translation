id: DEU.7.3
reference: Deuteronomy 7:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹ֥א תִתְחַתֵּ֖ן בָּ֑/ם בִּתְּ/ךָ֙ לֹא תִתֵּ֣ן לִ/בְנ֔/וֹ וּ/בִתּ֖/וֹ לֹא תִקַּ֥ח לִ/בְנֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/003.yaml
  text: 'And you shall not intermarry with them: you shall not give your daughter to his son[a], and you shall not take his daughter for your son.'
translation:
  language: hi
  text: और तुम उनके साथ वैवाहिक संबंध न जोड़ना। अपनी बेटी उसके बेटे को न देना, और उसकी बेटी अपने बेटे के लिए न लेना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִתְחַתֵּן
  choice: वैवाहिक संबंध जोड़ना
  rationale: हित्पएल रूप यहाँ पहले उल्लिखित जातियों के साथ परस्पर विवाह-संबंध स्थापित करने को व्यक्त करता है। यह हिन्दी में स्वाभाविक है और केवल ‘विवाह करना’ की अपेक्षा सामाजिक-पारिवारिक गठजोड़ का भाव अधिक स्पष्ट रखता है।
- source_word: בָּם
  choice: उनके साथ
  rationale: पूर्वसर्ग ב और बहुवचन प्रत्यय पहले उल्लिखित लोगों की ओर संकेत करते हैं; विवाह-संबंध के प्रसंग में ‘उनके साथ’ स्वाभाविक हिन्दी है।
- source_word: בִּתְּךָ
  choice: अपनी बेटी
  rationale: एकवचन संज्ञा और द्वितीय पुरुष एकवचन प्रत्यय का सीधा, लिंग-सटीक अनुवाद।
- source_word: תִתֵּן
  choice: देना
  rationale: इब्रानी क्रिया का मूल अर्थ ‘देना’ है; विवाह का प्रसंग अर्थ को स्पष्ट करता है, इसलिए अतिरिक्त व्याख्यात्मक शब्द आवश्यक नहीं।
- source_word: לִבְנוֹ
  choice: उसके बेटे को
  rationale: ל अप्रत्यक्ष कर्म को चिह्नित करता है; ‘उसके बेटे को’ इस वाक्य में सीधा और स्वाभाविक है।
- source_word: וּבִתּוֹ
  choice: और उसकी बेटी
  rationale: संयोजक तथा तृतीय पुरुष एकवचन प्रत्यय सहित संज्ञा का सीधा अनुवाद।
- source_word: תִקַּח
  choice: लेना
  rationale: क्रिया का मूल अर्थ ‘लेना’ है। विवाह-संदर्भ को बनाए रखते हुए स्रोत की संक्षिप्त अभिव्यक्ति संरक्षित की गई है।
- source_word: לִבְנֶךָ
  choice: अपने बेटे के लिए
  rationale: ל द्वारा व्यक्त संबंध के लिए हिन्दी विवाह-प्रयोग में ‘अपने बेटे के लिए’ स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: निषेध का दायरा
  choice: ‘उनके साथ’ कहकर निषेध को पिछले प्रसंग में उल्लिखित जातियों से संबद्ध रखा गया है।
  alternative: इसे सभी विदेशी लोगों से विवाह का सार्वभौमिक निषेध बनाना, या वाचा-संदर्भ से अलग केवल जातीय निषेध के रूप में प्रस्तुत करना।
  rationale: पद स्वयं सर्वनाम ‘उनके’ का प्रयोग करता है, जो पहले नामित लोगों की ओर लौटता है। अगले पद का कारण यहाँ जोड़कर दायरा न विस्तृत किया गया है, न संकुचित।
- issue: लिंग-सूचक पारिवारिक शब्द
  choice: ‘बेटी’ और ‘बेटा’ को एकवचन में बनाए रखा गया है।
  alternative: ‘संतान’ जैसे लिंग-निरपेक्ष सामूहिक शब्द का प्रयोग।
  rationale: इब्रानी प्रतिनिधिक कानूनी विधान में लिंग-सूचक एकवचन संबंधवाचक शब्द रखता है; अनुवाद उन्हें अस्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कानूनी-उपदेशात्मक स्वर। ‘वैवाहिक संबंध जोड़ना’ पारस्परिक विवाह-गठजोड़ का भाव देता है; शेष दो उपवाक्यों में मूल की समानांतर संरचना और ‘देना/लेना’ बनाए रखे गए हैं।
