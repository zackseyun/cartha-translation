source:
  edition: WLC
  text: וְ/אָכַלְתָּ֣ אֶת כָּל הָֽ/עַמִּ֗ים אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ לֹא תָחֹ֥ס עֵֽינְ/ךָ֖ עֲלֵי/הֶ֑ם וְ/לֹ֤א תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי מוֹקֵ֥שׁ ה֖וּא לָֽ/ךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/016.yaml
  text: And you shall consume all the peoples whom Yahweh your God is giving to you[a]. Your eye shall not spare them, and you shall not serve their gods[c][b], for that would be a snare to you.
translation:
  language: hi
  text: और जिन सब लोगों को तुम्हारा परमेश्वर यहोवा तुम्हें दे रहा है, उन्हें तुम नष्ट कर देना।[a] उन पर तुम्हारी आँख तरस न खाए,[b] और तुम उनके देवताओं की सेवा न करना, क्योंकि वह तुम्हारे लिए फंदा होगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “खा जाना” या “निगल जाना”; यहाँ यह पूर्ण रूप से पराजित या नष्ट करने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “तुम्हारी आँख उन पर तरस न खाए”; अर्थात उन पर दया करके उन्हें छोड़ न देना।
    reason: lexical_alternative
  - marker: c
    text: “वह” का सबसे निकट संकेत उनके देवताओं की सेवा करने की ओर है; पर यह उनके देवताओं या मूर्तिपूजा की पूरी परिस्थिति की ओर भी संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: पूरी तरह नष्ट कर देना
  rationale: अर्थ मूलतः ‘खाना/खा जाना’ है, पर युद्ध के इस प्रसंग में यह पूर्ण पराजय और विनाश का मुहावरा है। सहज हिन्दी के लिए अर्थ स्पष्ट किया गया, जबकि पादटिप्पणी में मूल बिंब सुरक्षित है।
- source_word: כָּל הָעַמִּים
  choice: सब लोगों
  rationale: עַמִּים अलग-अलग जनसमूहों को दर्शाता है। ‘लोगों’ आधुनिक हिन्दी में स्वाभाविक है और बहुवचन समूहों का व्यापक अर्थ रखता है।
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: जिन ... को तुम्हारा परमेश्वर यहोवा तुम्हारे हाथ में दे रहा है
  rationale: नֹתֵן का वर्तमान/निकट भविष्यगत पक्ष ‘दे रहा है’ से व्यक्त होता है। केवल ‘तुम्हें दे रहा है’ की अपेक्षा ‘तुम्हारे हाथ में’ युद्ध-संदर्भ में स्वाभाविक हिन्दी है, यद्यपि ‘हाथ’ मूल में स्पष्ट नहीं है। यְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: לֹא תָחֹס עֵינְךָ עֲלֵיהֶם
  choice: तुम्हारी आँख उन पर तरस न खाए
  rationale: यह अनुकंपा करके छोड़ देने का इब्रानी मुहावरा है। हिन्दी में ‘आँख ... तरस न खाए’ मूल की ठोस छवि और निषेध दोनों को बनाए रखता है।
- source_word: וְלֹא תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: तुम उनके देवताओं की सेवा न करना
  rationale: עבד का अर्थ यहाँ देवताओं की आराधनापूर्ण सेवा और निष्ठा है। ‘सेवा करना’ मूल शब्द के व्यापक वाच्यार्थ को ‘पूजा करना’ से अधिक निकटता से सुरक्षित रखता है।
- source_word: כִּי מוֹקֵשׁ הוּא לָךְ
  choice: क्योंकि वह तुम्हारे लिए फंदा होगा
  rationale: מוֹקֵשׁ शिकार के फंदे को दर्शाता है। ‘वह’ इब्रानी सर्वनाम की संदर्भगत अस्पष्टता को बनाए रखता है; इसका सबसे निकट संभावित संदर्भ उनके देवताओं की सेवा करना है।
theological_decisions:
- issue: הוּא (‘वह’) का संदर्भ
  choice: सर्वनाम को ‘वह’ के रूप में अस्पष्ट रखा गया है।
  alternative: इसे स्पष्ट करके ‘ऐसा करना तुम्हारे लिए फंदा होगा’ कहना, जिससे संदर्भ केवल उनके देवताओं की सेवा करने तक सीमित हो जाता।
  rationale: निकटतम विचार उनके देवताओं की सेवा करना है, पर इब्रानी सर्वनाम व्यापक रूप से देवताओं, मूर्तिपूजक सेवा या पूरी परिस्थिति की ओर भी संकेत कर सकता है। अनुवाद इस वास्तविक अस्पष्टता को नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और आज्ञात्मक स्वर रखा गया है। युद्ध-संबंधी मुहावरे का अर्थ मुख्य पाठ में स्पष्ट किया गया है और मूल ‘खाने’ का बिंब पादटिप्पणी में सुरक्षित रखा गया है। ‘यहोवा’ नाम का प्रयोग יְהוָה के लिए किया गया है।
