source:
  edition: WLC
  text: לֹ֥א תַעֲרֹ֖ץ מִ/פְּנֵי/הֶ֑ם כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/קִרְבֶּ֔/ךָ אֵ֥ל גָּד֖וֹל וְ/נוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/021.yaml
  text: Do not dread them[a], for Yahweh your God is in your midst[c][b], a great and fearsome God.
translation:
  language: hi
  text: तुम उनसे भयभीत मत होना,[a] क्योंकि तुम्हारा परमेश्वर याहवे तुम्हारे बीच में है—वह महान और भययोग्य परमेश्वर है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके कारण भयभीत मत होना।”
    reason: lexical_alternative
  - marker: b
    text: “भययोग्य” का अर्थ ऐसा भी हो सकता है जो श्रद्धामिश्रित भय और विस्मय उत्पन्न करे।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲרֹץ מִפְּנֵיהֶם
  choice: तुम उनसे आतंकित मत होना
  rationale: क्रिया ערץ भय से आतंकित होने का प्रबल भाव रखती है। ‘आतंकित मत होना’ इस तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; מִפְּנֵיהֶם का कारण/सामना-सूचक बल ‘उनसे’ में समाहित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: वाचा-संबंधी संबोधन और एकवचन अधिकारवाचक प्रत्यय दोनों स्पष्ट रूप से सुरक्षित हैं।
- source_word: בְּקִרְבְּךָ
  choice: तुम्हारे बीच में
  rationale: यह समुदाय के मध्य परमेश्वर की उपस्थिति बताता है। यह अनुवाद ‘तुम्हारे भीतर’ से उत्पन्न हो सकने वाले केवल आंतरिक या व्यक्तिगत अर्थ से बचता है।
- source_word: אֵל גָּדוֹל
  choice: महान ... परमेश्वर
  rationale: אֵל को परमेश्वर के लिए संज्ञा और גָּדוֹל को उसके विशेषण ‘महान’ के रूप में रखा गया है। हिन्दी की स्वाभाविक शब्द-रचना के लिए विशेषण पहले आया है।
- source_word: וְנוֹרָא
  choice: भययोग्य
  rationale: נוֹרָא ऐसे व्यक्ति को दर्शाता है जो भय और श्रद्धामिश्रित विस्मय उत्पन्न करता है। ‘भययोग्य’ इस धार्मिक भार को ‘भयानक’ की अपेक्षा अधिक संतुलित ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का निरूपण
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम प्रत्यक्ष रूप से है। हिन्दी पाठकों में सुविदित लिप्यंतरण ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है; ‘याहवे’ अधिक ध्वन्यात्मक वैकल्पिक लिप्यंतरण है।
- issue: נוֹרָא में भय और विस्मय का संबंध
  choice: भययोग्य
  alternative: विस्मयकारी
  rationale: संदर्भ में इस शब्द का आशय केवल प्रशंसा या आश्चर्य नहीं, बल्कि परमेश्वर से उत्पन्न श्रद्धामिश्रित भय भी है। ‘भययोग्य’ उस तनाव को बनाए रखता है; पादटिप्पणी वैकल्पिक पहलू बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामुदायिक संबोधन रखा गया है। एकवचन ‘तुम’ मूल इब्रानी के एकवचन संबोधन को सुरक्षित रखता है। ‘तुम्हारे बीच में’ सामान्य पाठक के लिए स्वाभाविक है, और अंतिम खंड में दीर्घ विराम appositional बल को स्पष्ट करता है।
