  edition: WLC
  text: וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה אֱלֹהֶ֖י/ךָ ה֣וּא הָֽ/אֱלֹהִ֑ים הָ/אֵל֙ הַֽ/נֶּאֱמָ֔ן שֹׁמֵ֧ר הַ/בְּרִ֣ית וְ/הַ/חֶ֗סֶד לְ/אֹהֲבָ֛י/ו וּ/לְ/שֹׁמְרֵ֥י מצות/ו לְ/אֶ֥לֶף דּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/009.yaml
  text: Know[a], therefore, that Yahweh your God, he is God, the faithful God, keeping the covenant and the steadfast love for those who love him and for those who keep his commandments[d][c][b], to a thousand generations.
translation:
  language: hi
  text: इसलिए जान लो[a] कि तुम्हारा परमेश्वर यहोवा ही परमेश्वर है—वह विश्वासयोग्य परमेश्वर है, जो उससे प्रेम करनेवालों और उसकी आज्ञाओं को माननेवालों के लिए हज़ार पीढ़ियों तक[c][d] वाचा और अटल प्रेम[b] बनाए रखता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और जान लो” अथवा “अतः जान लो”; इब्रानी संयोजक पिछले कथन की साधारण निरंतरता या उससे निकला निष्कर्ष, दोनों दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी חֶסֶד; इसका अर्थ वाचागत निष्ठा, करुणा या कृपालु प्रेम भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “एक हज़ार पीढ़ियों के लिए”; यह अभिव्यक्ति अत्यंत लंबे समय तक बनी रहनेवाली वाचागत विश्वासयोग्यता दर्शाती है।
    reason: lexical_alternative
  - marker: d
    text: 'इसे इस प्रकार भी जोड़ा जा सकता है: “उससे प्रेम करनेवालों और उसकी आज्ञाओं को माननेवालों के लिए, हज़ार पीढ़ियों तक।”'
    reason: syntactic_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: इसलिए जान लो
  rationale: पूर्ण क्रियारूप यहाँ संदर्भ में निर्देशात्मक बल रखता है; आरंभिक וְ को पिछले कथन से निष्कर्षसूचक संबंध दिखाने के लिए ‘इसलिए’ कहा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: הוּא הָאֱלֹהִים
  choice: ही परमेश्वर है
  rationale: הוּא के बलाघात और निश्चित पदबंध की अनन्यता को स्वाभाविक हिन्दी में ‘ही’ व्यक्त करता है।
- source_word: הַנֶּאֱמָן
  choice: विश्वासयोग्य
  rationale: यह शब्द दृढ़ता, भरोसेमंदी और विशेषतः वाचा के प्रति निष्ठा बताता है।
- source_word: שֹׁמֵר הַבְּרִית
  choice: वाचा ... बनाए रखता है
  rationale: कृदंत परमेश्वर के निरंतर कार्य को दर्शाता है; ‘बनाए रखता है’ हिन्दी में वाचा की सतत रक्षा और निर्वाह दोनों को व्यक्त करता है।
- source_word: הַחֶסֶד
  choice: अटल प्रेम
  rationale: חֶסֶד में प्रेम, करुणा और वाचागत निष्ठा के संयुक्त भाव हैं; ‘अटल प्रेम’ इसकी स्थिरता और स्नेह को संक्षेप में रखता है।
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֹתָו
  choice: उससे प्रेम करनेवालों और उसकी आज्ञाओं को माननेवालों के लिए
  rationale: לְ को लाभार्थी अर्थ में ‘के लिए’ कहा गया है; दोनों समानांतर कृदंत समूह सुरक्षित हैं।
- source_word: לְאֶלֶף דּוֹר
  choice: हज़ार पीढ़ियों तक
  rationale: अवधि और अत्यंत दीर्घ वाचागत निष्ठा को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की वाचागत निष्ठा और मनुष्य के प्रेम तथा आज्ञापालन का संबंध
  choice: वाचा और अटल प्रेम उन लोगों के लिए बनाए रखना जो उससे प्रेम करते और उसकी आज्ञाएँ मानते हैं
  alternative: उनसे वाचा और करुणा निभाना जो उससे प्रेम करते हैं
  rationale: पद स्वयं חֶסֶד को वाचा के साथ जोड़ता और उसके लाभार्थियों को प्रेम तथा आज्ञापालन द्वारा वर्णित करता है। अनुवाद इस वाचागत संबंध को न तो शिथिल करता है, न किसी बाद की धर्मवैज्ञानिक व्यवस्था में ढालता है।
- issue: לְאֶלֶף דּוֹר का वाक्यगत संबंध
  choice: हज़ार पीढ़ियों तक परमेश्वर द्वारा वाचा और अटल प्रेम बनाए रखने की अवधि
  alternative: हज़ारवीं पीढ़ी तक आज्ञाएँ माननेवालों का वर्णन
  rationale: इब्रानी पदक्रम में हल्की वाक्यगत अस्पष्टता संभव है, पर स्वाभाविक अर्थ परमेश्वर की वाचागत निष्ठा की दीर्घ अवधि है; वैकल्पिक लगाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज धार्मिक गद्य। ‘वाचा’, ‘विश्वासयोग्य’ और ‘आज्ञाएँ’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं; ‘ही’ मूल के बलाघात को स्वाभाविक रूप से व्यक्त करता है।
