base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/019.yaml
  text: the great trials that your eyes saw[a], and the signs, and the wonders, and the mighty hand[b], and the outstretched arm by which Yahweh your God brought you out—so Yahweh your God will do to all the peoples of whom you are afraid.
translation:
  language: hi
  text: वे बड़ी परीक्षाएँ जिन्हें तुमने अपनी आँखों से देखा था[a], वे चिन्ह, वे अद्भुत काम, वह शक्तिशाली हाथ और वह फैली हुई भुजा, जिसके द्वारा तुम्हारा परमेश्वर याहवे तुम्हें बाहर निकाल लाया था—वैसा ही तुम्हारा परमेश्वर याहवे उन सब जातियों के साथ भी करेगा, जिनसे तुम डरते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बड़ी कसौटियाँ।’ इब्रानी शब्द कठिन परीक्षाओं या परखने वाले कार्यों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסֹּת הַגְּדֹלֹת
  choice: बड़ी परीक्षाएँ
  rationale: מַסּוֹת का अर्थ कठिन परीक्षाएँ या कसौटियाँ हो सकता है। मिस्र में देखे गए परमेश्वर के कठोर परखने वाले कार्यों के संदर्भ में ‘बड़ी परीक्षाएँ’ स्वाभाविक है और पाप के प्रलोभन का अनुचित अर्थ नहीं देता।
- source_word: רָאוּ עֵינֶיךָ
  choice: तुमने अपनी आँखों से देखा था
  rationale: इब्रानी में ‘तुम्हारी आँखों’ का स्पष्ट उल्लेख प्रत्यक्ष अनुभव पर बल देता है; हिंदी का ‘अपनी आँखों से’ वही जोर स्वाभाविक ढंग से रखता है।
- source_word: הָאֹתֹת
  choice: चिन्ह
  rationale: אוֹת के लिए ‘चिन्ह’ स्पष्ट और प्रचलित समतुल्य है तथा परमेश्वर के अर्थपूर्ण कार्यों का भाव बनाए रखता है।
- source_word: הַמֹּפְתִים
  choice: अद्भुत काम
  rationale: מוֹפֵת विस्मय उत्पन्न करने वाले असाधारण कार्य को सूचित करता है। ‘अद्भुत काम’ आधुनिक हिंदी में सहज है और ‘चमत्कार’ की अपेक्षा स्रोत को अनावश्यक रूप से अधिक निर्दिष्ट नहीं करता।
- source_word: הַיָּד הַחֲזָקָה
  choice: सामर्थी हाथ
  rationale: यह परमेश्वर की शक्तिशाली कार्रवाई का रूपक है। ‘सामर्थी हाथ’ रूपक और गरिमामय बाइबलीय अभिव्यक्ति दोनों को सुरक्षित रखता है।
- source_word: הַזְּרֹעַ הַנְּטוּיָה
  choice: बढ़ाई हुई भुजा
  rationale: शाब्दिक रूपक को बनाए रखते हुए यह सक्रिय सामर्थ्य, उद्धार और न्याय का भाव व्यक्त करता है।
- source_word: אֲשֶׁר הוֹצִאֲךָ
  choice: जिनके द्वारा ... तुम्हें बाहर निकाल लाया था
  rationale: बहुवचन ‘जिनके’ को ‘सामर्थी हाथ’ और ‘बढ़ाई हुई भुजा’ दोनों से जोड़कर इब्रानी संबंधवाचक वाक्य की संभावित साधनात्मकता रखी गई है; ‘बाहर निकाल लाया’ निर्गमन के संदर्भ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिंदी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: כֵּן יַעֲשֶׂה
  choice: वैसा ही ... करेगा
  rationale: यह पूर्ववर्णित उद्धार और न्याय के कार्यों से स्पष्ट तुलना व्यक्त करता है।
- source_word: לְכָל הָעַמִּים
  choice: उन सब जातियों के साथ
  rationale: עַמִּים का अर्थ जनसमूह या जातियाँ है। इस प्रसंग में ‘सब जातियों के साथ करेगा’ हिंदी में स्वाभाविक है और प्रभावित कर्म को व्यक्त करता है।
- source_word: אֲשֶׁר אַתָּה יָרֵא מִפְּנֵיהֶם
  choice: जिनसे तुम डरते हो
  rationale: ‘उनके सामने/कारण डरना’ वाली इब्रानी अभिव्यक्ति का हिंदी में स्वाभाविक अर्थ ‘जिनसे तुम डरते हो’ है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा-नाम प्रत्यक्ष है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। आधुनिक हिंदी बाइबल-पाठकों में ‘यहोवा’ अधिक पहचाना जाने वाला देवनागरी रूप है; ‘याहवे’ विद्वत्तापरक वैकल्पिक लिप्यंतरण है।
- issue: मिस्र के कार्यों को ‘परीक्षाएँ’ कहना
  choice: बड़ी परीक्षाएँ
  alternative: बड़ी कसौटियाँ
  rationale: מַסּוֹת में परीक्षा/परख का तनाव सुरक्षित रखा गया है और इसे केवल चमत्कार या विपत्ति बनाकर अर्थ सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय किंतु सुबोध शैली रखी गई है। वचन के प्रत्यक्ष संबोधन के अनुरूप एकवचन ‘तुम’ का प्रयोग हुआ है। ‘चिन्ह’, ‘सामर्थी हाथ’ और ‘बढ़ाई हुई भुजा’ जैसे प्रमुख इब्रानी रूपक सुरक्षित रखे गए हैं।
