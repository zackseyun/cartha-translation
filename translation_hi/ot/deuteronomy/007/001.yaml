  to: जब याहवे, तुम्हारा परमेश्वर, तुम्हें उस देश में ले आएगा, जिसमें तुम उस देश पर अधिकार करने के लिए प्रवेश कर रहे हो, और तुम्हारे सामने से बहुत-से राष्ट्रों को निकाल देगा[a]—हित्ती, गिर्गाशी, एमोरी, कनानी, परिज्जी, हिव्वी और यबूसी—तो वे सात राष्ट्र तुमसे बड़े और अधिक शक्तिशाली हैं[b],
