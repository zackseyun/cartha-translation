  text: כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָשַׁ֣ל גּֽוֹיִם רַבִּ֣ים מִ/פָּנֶ֡י/ךָ הַֽ/חִתִּי֩ וְ/הַ/גִּרְגָּשִׁ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֗י וְ/הַֽ/חִוִּי֙ וְ/הַ/יְבוּסִ֔י שִׁבְעָ֣ה גוֹיִ֔ם רַבִּ֥ים וַ/עֲצוּמִ֖ים מִמֶּֽ/ךָּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/001.yaml
  text: When Yahweh your God brings you into the land that you are entering to possess[a], and drives out before you many nations—the Hittites, the Girgashites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—seven nations greater and mightier than you[b],
translation:
  language: hi
  text: जब याहवे, तुम्हारा परमेश्वर, तुम्हें उस देश में ले आएगा, जिसमें तुम उस देश पर अधिकार करने के लिए प्रवेश कर रहे हो, और तुम्हारे सामने से बहुत-से राष्ट्रों को निकाल देगा[a]—हित्ती, गिर्गाशी, एमोरी, कनानी, परिज्जी, हिव्वी और यबूसी—तो वे सात राष्ट्र तुमसे बड़े और अधिक शक्तिशाली हैं[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे सामने से बहुत-से राष्ट्रों को बेदखल कर देगा।”
    reason: וְנָשַׁל के ‘निकाल देने’ के साथ भूमि के अधिकार से वंचित करने का अर्थ भी हो सकता है।
  - marker: b
    text: या, “जो संख्या में तुमसे अधिक और तुमसे शक्तिशाली हैं।”
    reason: रַבִּים का अर्थ ‘बड़े’ के साथ-साथ ‘संख्या में अधिक’ भी हो सकता है।
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ כִּי आगे आने वाली आज्ञाओं की परिस्थिति बताता है; इसलिए कालवाचक ‘जब’ प्रसंग के अनुकूल है।
- source_word: יְבִיאֲךָ
  choice: तुम्हें ... में ले जाए
  rationale: בוא के हिफ़ील रूप का कारक भाव स्वाभाविक हिन्दी में ‘किसी स्थान में ले जाना’ से व्यक्त होता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित पद का सीधा और स्वाभाविक अनुवाद।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: व्यवस्थाविवरण में यह इस्राएल को मिलने वाले निश्चित भूभाग को दर्शाता है; हिन्दी में ‘उस देश’ संदर्भ को स्पष्ट और सहज रखता है।
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: जिसमें तुम ... प्रवेश कर रहे हो
  rationale: इब्रानी अभिव्यक्ति इस्राएल के निकट भविष्य में होने वाले प्रवेश को चित्रित करती है; ‘वहाँ’ को अलग से रखना हिन्दी में अनावश्यक होता।
- source_word: לְרִשְׁתָּהּ
  choice: अधिकार करने के लिए
  rationale: ירשׁ यहाँ भूमि को अपने अधिकार में लेने का सक्रिय अर्थ देता है; ‘विरासत में पाने’ से विजय-संदर्भ का यह पक्ष कम स्पष्ट होता।
- source_word: וְנָשַׁל
  choice: निकाल दे
  rationale: क्रिया का अर्थ लोगों को भूमि से हटाना या बेदखल करना है; ‘निकाल दे’ सामान्य हिन्दी में स्वाभाविक है, जबकि ‘बेदखल कर दे’ को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: גּוֹיִם רַבִּים
  choice: बहुत-से राष्ट्रों
  rationale: यह पद कनान में रहने वाले अलग-अलग जातीय-राष्ट्रीय समूहों को दर्शाता है।
- source_word: מִפָּנֶיךָ
  choice: तुम्हारे सामने से
  rationale: यह इब्रानी मुहावरा किसी की उपस्थिति या मार्ग से हटाए जाने को व्यक्त करता है।
- source_word: הַחִתִּי ... הַיְבוּסִי
  choice: हित्ती, गिर्गाशी, एमोरी, कनानी, परिज्जी, हिव्वी और यबूसी
  rationale: एकवचन सामूहिक जातिवाचक नामों के प्रचलित हिन्दी बाइबलीय लिप्यंतरण दिए गए हैं।
- source_word: שִׁבְעָה גוֹיִם
  choice: ये सात राष्ट्र
  rationale: यह पहले गिनाए गए सात समूहों का सारात्मक पुनर्निर्देश है।
- source_word: רַבִּים וַעֲצוּמִים מִמֶּךָּ
  choice: तुमसे बड़े और अधिक शक्तिशाली
  rationale: तुलनात्मक अर्थ को बनाए रखते हुए רַבִּים की ‘बड़े’ और ‘संख्या में अधिक’ वाली अर्थ-सीमा में से मुख्य पाठ में व्यापक ‘बड़े’ रखा गया है और दूसरा अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल में विशिष्ट वाचा-नाम सीधे उपस्थित है; ‘याहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और उसे केवल उपाधि में नहीं बदलता।
- issue: भूमि प्राप्त करने में ירשׁ का अर्थ
  choice: अधिकार करना
  alternative: विरासत में पाना
  rationale: इस पद के विजय और भूमि-अधिग्रहण के प्रसंग में सक्रिय अधिकार ग्रहण करने का भाव प्रमुख है, पर मूल धातु में विरासत/उत्तराधिकार की अर्थ-छाया भी संभव है।
- issue: कनानी राष्ट्रों को हटाने में וְנָשַׁל की अभिव्यक्ति
  choice: निकाल दे
  alternative: बेदखल कर दे
  rationale: दोनों विकल्प मूल के हटाने और भूमि से वंचित करने के भाव को व्यक्त करते हैं; मुख्य पाठ में अधिक सामान्य भाषा चुनी गई है, बिना कर्ता—याहवे—को अस्पष्ट किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। जाति-नामों को सूची के रूप में तथा दोनों ओर दीर्घ विराम-चिह्न लगाकर मूल की सारात्मक संरचना बचाई गई है। पद अगले वाक्यांश में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
