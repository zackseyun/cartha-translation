source:
  edition: WLC
  text: וּ/נְתָנָ֞/ם יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ וְ/הִכִּיתָ֑/ם הַחֲרֵ֤ם תַּחֲרִים֙ אֹתָ֔/ם לֹא תִכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית וְ/לֹ֥א תְחָנֵּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/002.yaml
  text: And when Yahweh your God gives them over to you before you[a], and you strike them down, you shall utterly devote them to destruction[b]. You shall make no covenant with them and show them no favor.
translation:
  language: hi
  text: और जब याहवे, तुम्हारा परमेश्वर, उन्हें तुम्हारे हवाले कर दे और तुम उन्हें मार गिराओ, तब तुम उन्हें विनाश के लिए पूरी तरह समर्पित कर देना[a]। तुम उनके साथ कोई वाचा न बाँधना और उन पर कोई कृपा न करना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें पूर्णतः प्रतिबंध के अधीन कर देना।” इब्रानी में חרם धातु का तीव्रतासूचक प्रयोग है, जो उन्हें विनाश के लिए पूरी तरह समर्पित करने का भाव व्यक्त करता है।
    reason: חרם के तकनीकी ‘प्रतिबंध/समर्पण’ भाव और तीव्रतासूचक रचना को स्पष्ट करना।
  - marker: b
    text: या, “उन पर कोई दया न करना।”
    reason: חנן का प्रसंगानुकूल वैकल्पिक अर्थ देना।
lexical_decisions:
- source_word: וּנְתָנָם ... לְפָנֶיךָ
  choice: उन्हें तुम्हारे हवाले कर दे
  rationale: सैन्य प्रसंग में נתן और לְפָנֶיךָ का संयुक्त भाव शत्रुओं को इस्राएल के अधिकार में सौंपना है। यह स्वाभाविक हिन्दी में दैवी कर्तृत्व बनाए रखता है, बिना मूल में अनुपस्थित ‘हाथ’ जोड़ने के।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה का हिन्दी लिप्यंतरण किया गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וְהִכִּיתָם
  choice: तुम उन्हें मार गिराओ
  rationale: युद्ध के प्रसंग में נכה केवल पराजित करने से अधिक प्रबल, प्राणघातक प्रहार का अर्थ दे सकता है। ‘मार गिराओ’ आधुनिक और स्पष्ट है।
- source_word: הַחֲרֵם תַּחֲרִים אֹתָם
  choice: तुम उन्हें विनाश के लिए पूरी तरह समर्पित कर देना
  rationale: एक ही धातु חרם के क्रियार्थक संज्ञा और क्रिया के साथ आने से पूर्णता और तीव्रता व्यक्त होती है। यह चयन साधारण विनाश से आगे, विनाश के लिए पूर्णतः अलग कर दिए जाने का धार्मिक भाव भी सुरक्षित रखता है।
- source_word: לֹא תִכְרֹת לָהֶם בְּרִית
  choice: तुम उनके साथ कोई वाचा न बाँधना
  rationale: כרת ברית का शाब्दिक मुहावरा ‘वाचा काटना’ है; हिन्दी में ‘वाचा बाँधना’ उसी औपचारिक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְלֹא תְחָנֵּם
  choice: उन पर कोई कृपा न करना
  rationale: חנן का मूल भाव कृपा या अनुग्रह दिखाना है। ‘कृपा न करना’ इस व्यापक अर्थ को रखता है; प्रसंगानुसार ‘दया न करना’ भी संभव है और पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: पवित्र युद्ध के प्रसंग में חרם का अनुवाद
  choice: विनाश के लिए पूरी तरह समर्पित कर देना
  alternative: उनका पूरी तरह नाश कर देना; उन्हें पूर्णतः प्रतिबंध के अधीन कर देना
  rationale: मुख्य पाठ में חרם के सम्पूर्ण विनाश और धार्मिक समर्पण—दोनों पहलुओं को रखा गया है, ताकि इसे केवल सामान्य सैन्य हत्या तक सीमित न किया जाए।
- issue: תְחָנֵּם का अर्थ
  choice: उन पर कोई कृपा न करना
  alternative: उन पर कोई दया न करना
  rationale: शब्द का मूल अर्थ कृपा/अनुग्रह दिखाना है, जबकि इस प्रसंग में दया का भाव भी संभव है। मुख्य पाठ व्यापक शाब्दिक अर्थ रखता है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘याहवे’ व्यक्तिगत ईश्वरीय नाम का लिप्यंतरण है; ‘वाचा’ बाइबलीय औपचारिक संबंध के लिए प्रचलित शब्द है। आज्ञार्थक वाक्यों में ‘कर देना/न बाँधना’ का प्रयोग मूसा द्वारा इस्राएल को दिए जा रहे निर्देशों के स्वाभाविक हिन्दी स्वर को बनाए रखता है।
