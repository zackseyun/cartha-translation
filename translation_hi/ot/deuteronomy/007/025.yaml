  text: פְּסִילֵ֥י אֱלֹהֵי/הֶ֖ם תִּשְׂרְפ֣וּ/ן בָּ/אֵ֑שׁ לֹֽא תַחְמֹד֩ כֶּ֨סֶף וְ/זָהָ֤ב עֲלֵי/הֶם֙ וְ/לָקַחְתָּ֣ לָ֔/ךְ פֶּ֚ן תִּוָּקֵ֣שׁ בּ֔/וֹ כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/025.yaml
  text: You shall burn the carved images of their gods with fire[a]. You shall not covet the silver or gold that is on them and take it for yourself, lest you be ensnared by it[b], for it is an abomination to Yahweh your God.
translation:
  language: hi
  text: उनके देवताओं की खुदी हुई मूर्तियों को आग में जला देना। उन पर चढ़ी हुई चाँदी और चढ़ा हुआ सोना का लालच न करना और न उसे अपने लिए लेना, कहीं ऐसा न हो कि उसके कारण तुम फंदे में फँस जाओ[a], क्योंकि वह तुम्हारे परमेश्वर यहोवा के लिए घृणित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके कारण तुम जाल में फँस जाओ।” मूल इब्रानी क्रिया फंदे या जाल में पकड़े जाने का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּסִילֵי
  choice: खुदी हुई मूर्तियाँ
  rationale: यह संज्ञा काटकर या खोदकर बनाई गई प्रतिमा को दर्शाती है। यह चयन ठोस अर्थ बनाए रखता है और केवल व्याख्यात्मक ‘मूरतें’ या ‘मूर्तिपूजक प्रतिमाएँ’ कहने से बचता है।
- source_word: אֱלֹהֵיהֶם
  choice: उनके देवता
  rationale: बहुवचन संबंधवाचक रूप का स्वाभाविक हिन्दी अनुवाद।
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: आग में जला देना
  rationale: क्रिया और साधन/स्थानसूचक पदबंध दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לֹא תַחְמֹד
  choice: लालच न करना
  rationale: חמד यहाँ आकर्षक वस्तु को पाने की अनुचित इच्छा दर्शाता है; ‘लालच करना’ सामान्य पाठक के लिए स्वाभाविक और निषेध के संदर्भ में उपयुक्त है।
- source_word: כֶּסֶף וְזָהָב עֲלֵיהֶם
  choice: उन पर चढ़े हुए चाँदी और सोने
  rationale: עֲלֵיהֶם धातु के मूर्तियों पर लगे या मढ़े होने को दर्शाता है। ‘चढ़े हुए’ संबंध स्पष्ट करता है, जबकि ‘और’ मूल इब्रानी संयोजक को सुरक्षित रखता है।
- source_word: וְלָקַחְתָּ לָךְ
  choice: न उसे अपने लिए लेना
  rationale: לָךְ में निहित अपने लाभ के लिए लेने का भाव स्पष्ट होता है; एकवचन ‘उसे’ बहुमूल्य धातु को सामूहिक रूप में ग्रहण करता है।
- source_word: פֶּן תִּוָּקֵשׁ בּוֹ
  choice: कहीं ऐसा न हो कि उसके कारण तुम फंदे में फँस जाओ
  rationale: निफ़ाल रूप पकड़े या फँसाए जाने का अर्थ देता है। ‘फंदे में फँसना’ मूल रूपक को स्वाभाविक हिन्दी में बनाए रखता है; ‘उसके कारण’ सर्वनाम के साधन/कारण भाव को व्यक्त करता है।
- source_word: תּוֹעֲבַת
  choice: घृणित
  rationale: यह शब्द परमेश्वर की दृष्टि में अत्यंत अप्रिय और निंदनीय वस्तु को दर्शाता है। ‘घृणित’ आधुनिक हिन्दी में गंभीरता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: अंतिम सर्वनाम הוּא का संदर्भ
  choice: ‘वह’ कहकर संदर्भ को खुला रखा गया है—निकट संदर्भ में निषिद्ध बहुमूल्य धातु/मूर्ति-संबंधी वस्तु अभिप्रेत है।
  alternative: इसे विशेष रूप से मूर्ति, धातु, या उसे लेने के कार्य का स्पष्ट संदर्भ मानना।
  rationale: इब्रानी व्याकरण पूरे मूर्ति-संबंधी निषिद्ध पदार्थ या प्रसंग को समेट सकता है। अनुवाद किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और आज्ञात्मक है। इस पद में इस्राएल को सामूहिक रूप से संबोधित करने के कारण ‘तुम’ रखा गया है। मुख्य पाठ का [a] चिह्न संबंधित वैकल्पिक अभिव्यक्ति से जोड़ा गया है।
