base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/018.yaml
  text: You shall not fear them[a]; you shall surely remember what Yahweh your God did to Pharaoh and to all Egypt.
translation:
  language: hi
  text: तुम उनसे मत डरना। अवश्य याद रखना[a] कि तुम्हारे परमेश्वर याहवे ने फ़िरौन और समूचे मिस्र के साथ क्या किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “याद रखना, तुम याद रखोगे”—यह बलसूचक रचना है, जिसका अर्थ “अवश्य याद रखना” या “अच्छी तरह याद रखना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִירָא מֵהֶם
  choice: तुम उनसे मत डरना
  rationale: לֹא के साथ अपूर्ण क्रिया यहाँ निषेधात्मक आदेश व्यक्त करती है। ‘मत डरना’ आधुनिक हिंदी में स्वाभाविक और स्पष्ट है; ‘उनसे’ भय के लक्ष्य को ठीक प्रकार प्रकट करता है।
- source_word: זָכֹר תִּזְכֹּר
  choice: अवश्य याद रखना
  rationale: क्रियार्थक संज्ञा और अपूर्ण क्रिया का यह संयोजन स्मरण करने पर विशेष बल देता है। ‘अवश्य’ उस बल को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: क्या किया था
  rationale: यह इब्रानी संबंधवाचक रचना हिंदी में स्वाभाविक रूप से ‘क्या किया था’ बनती है; पूर्ण क्रिया बीते हुए ऐतिहासिक कार्य की ओर संकेत करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी लिपि में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: दूसरे पुरुष एकवचन संबोधन इस्राएल को एक सामूहिक वाचा-समुदाय के रूप में संबोधित करता है। आधुनिक हिंदी में ‘तुम्हारे’ इस सामूहिक संबोधन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְפַרְעֹה וּלְכָל מִצְרָיִם
  choice: फ़िरौन और समूचे मिस्र के साथ
  rationale: עשה के साथ ל प्रभावित पक्ष को सूचित करता है। ‘के साथ क्या किया’ हिंदी में मुहावरेदार है, और ‘समूचे मिस्र’ मूल के सामूहिक भौगोलिक-राष्ट्रीय अर्थ को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: दूसरे पुरुष एकवचन का हिंदी रूप
  choice: तुम/तुम्हारे
  alternative: तू/तेरा; आप/आपके
  rationale: इब्रानी व्याकरणिक रूप एकवचन है, पर संदर्भ में पूरे इस्राएल को सामूहिक इकाई के रूप में संबोधित किया गया है। ‘तुम’ आधुनिक मानक हिंदी में गरिमापूर्ण, सुबोध और सामूहिक संबोधन के लिए उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और निर्देशात्मक लहजा रखा गया है। छोटे वाक्यों से निषेध और स्मरण की आज्ञा का बल स्पष्ट होता है; ईश्वरीय नाम को ‘याहवे’ लिखा गया है।
