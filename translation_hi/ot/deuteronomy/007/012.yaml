base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/012.yaml
  text: And because you listen to these judgments[a], and keep and do them[c][b], Yahweh your God will keep for you the covenant and the steadfast love that he swore to your fathers.
translation:
  language: hi
  text: और ऐसा होगा कि तुम इन न्याय-विधियों[a] को सुनोगे, उनका पालन करोगे और उन्हें पूरा करोगे, तो याहवे तुम्हारा परमेश्वर तुम्हारे लिए उस वाचा और अटल प्रेम[b] को निभाएगा, जिनकी शपथ उसने तुम्हारे पितरों[c] से खाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इन नियमों” अथवा “इन विधानों”।
    reason: lexical_alternative
  - marker: b
    text: “अटल प्रेम” इब्रानी शब्द ख़ेसेद का अनुवाद है, जिसमें प्रेम के साथ निष्ठा और वाचा के प्रति दृढ़ प्रतिबद्धता का भाव भी है; इसका अनुवाद “वाचागत निष्ठा” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “तुम्हारे पूर्वजों”; इब्रानी में शाब्दिक रूप से “तुम्हारे पितरों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה עֵקֶב
  choice: और ऐसा होगा कि ... तो
  rationale: यह संरचना आगे कही गई आज्ञाकारिता और उसके परिणाम के बीच संबंध व्यक्त करती है। आधुनिक हिन्दी में ‘कि ... तो’ इस संबंध को स्वाभाविक ढंग से स्पष्ट करता है, जबकि मूल की परिणामसूचकता बनी रहती है।
- source_word: תִּשְׁמְעוּן
  choice: सुनोगे
  rationale: שׁמע में सुनने के साथ अनुकूल प्रतिक्रिया का भाव हो सकता है। आगे ‘पालन’ और ‘पूरा करना’ अलग से आने के कारण ‘सुनोगे’ मूल की श्रवण-संबंधी छवि और तीनों क्रियाओं को बनाए रखता है।
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: इन न्याय-विधियों
  rationale: מִשְׁפָּטִים कानूनी निर्णयों, नियमों या विधानों को सूचित करता है। ‘न्याय-विधियाँ’ इसके न्यायिक और विधिक दोनों पहलुओं को संक्षेप में बनाए रखता है।
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם אֹתָם
  choice: उनका पालन करोगे और उन्हें पूरा करोगे
  rationale: मूल में ‘रखना/सावधानी से मानना’ और ‘करना’ दो अलग क्रियाएँ हैं। हिन्दी में यह युग्म दोनों को अलग रखता है और अनावश्यक रूप से एक ही क्रिया में नहीं समेटता।
- source_word: וְשָׁמַר
  choice: निभाएगा
  rationale: यहाँ शाब्दिक ‘रखेगा’ की अपेक्षा ‘वाचा ... निभाएगा’ स्वाभाविक हिन्दी है और परमेश्वर द्वारा वाचा को कायम रखने का अर्थ देता है। साथ ही इस क्रिया का इस्राएल के ‘पालन’ से अर्थगत सामंजस्य बना रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: यह एकवचन संबोधन और वाचागत संबंध को सीधे व्यक्त करता है।
- source_word: לְךָ
  choice: तुम्हारे लिए
  rationale: यह पूर्वसर्ग उस व्यक्ति/समुदाय को लाभार्थी के रूप में चिह्नित करता है, जिसके लिए याहवे वाचा निभाएगा।
- source_word: הַבְּרִית
  choice: वाचा
  rationale: בְּרִית के लिए स्थापित और अर्थ-सटीक हिन्दी धर्मग्रंथीय शब्द, जो पारस्परिक प्रतिज्ञाबद्ध संबंध को व्यक्त करता है।
- source_word: הַחֶסֶד
  choice: अटल प्रेम
  rationale: חֶסֶד में प्रेम, निष्ठा और वाचागत दृढ़ता का संयुक्त भाव है। ‘अटल प्रेम’ इसे केवल कानूनी निष्ठा या केवल दया तक सीमित किए बिना सुबोध हिन्दी देता है।
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: जिसकी शपथ उसने ... खाई थी
  rationale: נשבע शपथ खाने को सूचित करता है। हिन्दी मुहावरे में यह प्रतिज्ञा की गंभीरता स्पष्ट रूप से बनाए रखता है।
- source_word: לַאֲבֹתֶיךָ
  choice: तुम्हारे पितरों से
  rationale: मूल में पुरुषवाचक बहुवचन ‘पिता/पूर्वज’ है और संदर्भ कुलपिताओं की ओर संकेत करता है। ‘पितरों’ से यह विशिष्टता तथा ऐतिहासिक संदर्भ बना रहता है।
theological_decisions:
- issue: वाचा के संदर्भ में חֶסֶד का अनुवाद
  choice: अटल प्रेम
  alternative: वाचागत निष्ठा; करुणामय निष्ठा; दया
  rationale: यह पद परमेश्वर के प्रेम और उसकी प्रतिज्ञाबद्ध निष्ठा दोनों को साथ रखता है। ‘अटल प्रेम’ इस संबंधपरक और स्थायी आयाम को बनाए रखता है; पादटिप्पणी इसकी वाचागत गहराई स्पष्ट करती है।
- issue: לַאֲבֹתֶיךָ में लिंग-विशिष्ट ऐतिहासिक संदर्भ
  choice: तुम्हारे पितरों से
  alternative: तुम्हारे पूर्वजों से
  rationale: इब्रानी पाठ विशेष रूप से ‘पिताओं’ का बहुवचन प्रयोग करता है और व्यवस्था-विवरण के संदर्भ में कुलपिताओं की ओर संकेत करता है। सामान्यीकृत ‘पूर्वजों’ के बजाय इसे मुख्य पाठ में बनाए रखा गया है।
- issue: आज्ञाकारिता और वाचा-पालन के बीच संबंध
  choice: ‘कि ... तो’ द्वारा परिणामसूचक संबंध
  alternative: ‘क्योंकि’ द्वारा सीधा कारणसूचक संबंध
  rationale: עֵקֶב आज्ञाओं को सुनने और मानने के परिणाम को सामने लाता है। हिन्दी की ‘कि ... तो’ संरचना संबंध को स्पष्ट करती है, पर इसे उद्धार कमाने या परमेश्वर की कृपा को मात्र लेन-देन बनाने जैसी अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं देती।
