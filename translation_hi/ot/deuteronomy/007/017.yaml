  yaml_path: translation/ot/deuteronomy/007/017.yaml
  text: If you say in your heart[a], ‘These nations are more numerous than I; how can I dispossess them?’
translation:
  language: hi
  text: यदि तुम अपने मन में कहो, ‘ये राष्ट्र मुझसे संख्या में अधिक हैं; मैं इन्हें कैसे बेदखल कर सकूँगा?’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें निकाल दूँ।” इब्रानी क्रिया में उन्हें भूमि के अधिकार या कब्ज़े से वंचित करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यहाँ यह अगले पद के आश्वासन से पहले एक संभावित शर्त प्रस्तुत करता है; इसलिए ‘यदि’ उपयुक्त है।
- source_word: תֹאמַר בִּלְבָבְךָ
  choice: तुम अपने मन में कहो
  rationale: यह अनकहे आंतरिक विचार या स्वयं से कही बात का इब्रानी मुहावरा है। ‘अपने मन में कहना’ मूल बिंब और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: רַבִּים הַגּוֹיִם הָאֵלֶּה מִמֶּנִּי
  choice: ये जातियाँ मुझसे अधिक संख्या में हैं
  rationale: מִמֶּנִּי तुलना प्रकट करता है और एकवचन संबोधित व्यक्ति को बनाए रखता है। ‘जातियाँ’ व्यवस्थाविवरण के इस भू-राजनीतिक प्रसंग में स्वाभाविक है।
- source_word: אֵיכָה אוּכַל
  choice: मैं ... कैसे ... सकूँगा
  rationale: यह सामर्थ्य के विषय में प्रश्न है; हिन्दी में ‘कैसे ... सकूँगा’ भावी विजय की संभावना पर उठे संशय को सहजता से व्यक्त करता है।
- source_word: לְהוֹרִישָׁם
  choice: उन्हें उनकी भूमि से बेदखल कर सकूँगा
  rationale: ירש का हिफ़ील रूप यहाँ उन्हें भूमि का अधिकार/कब्ज़ा खोने के लिए बाध्य करने का अर्थ देता है। ‘भूमि से बेदखल करना’ इस स्वामित्व-संबंधी अर्थ को सामान्य ‘निकालना’ से अधिक स्पष्ट रखता है।
