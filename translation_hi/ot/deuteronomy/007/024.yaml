  text: וְ/נָתַ֤ן מַלְכֵי/הֶם֙ בְּ/יָדֶ֔/ךָ וְ/הַאֲבַדְתָּ֣ אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ בְּ/פָנֶ֔י/ךָ עַ֥ד הִשְׁמִֽדְ/ךָ֖ אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/024.yaml
  text: And he will give their kings into your hand[a], and you shall make their name perish from under heaven. No man will stand before you until you have destroyed them.
translation:
  language: hi
  text: वह उनके राजाओं को तुम्हारे हाथ में दे देगा, और तुम आकाश के नीचे से उनका नाम मिटा दोगे। जब तक तुम उनका सर्वनाश नहीं कर दोगे, तब तक कोई भी मनुष्य[a] तुम्हारे सामने टिक नहीं सकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “कोई भी व्यक्ति तुम्हारे सामने टिक नहीं सकेगा।” इब्रानी में “मनुष्य” (אִישׁ) व्याकरणिक रूप से पुल्लिंग एकवचन है, पर यहाँ प्रतिनिधिक सामान्य अर्थ में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: वह ... कर देगा
  rationale: संयोजक वाव के साथ पूर्ण क्रिया यहाँ प्रतिज्ञा के भावी क्रम को आगे बढ़ाती है; कर्ता पुल्लिंग एकवचन है और संदर्भ में यहोवा की ओर संकेत करता है।
- source_word: מַלְכֵיהֶם
  choice: उनके राजाओं
  rationale: बहुवचन संबंध-रचना और तृतीय पुरुष बहुवचन प्रत्यय का सीधा अर्थ ‘उनके राजा’ है।
- source_word: בְּיָדֶךָ
  choice: तुम्हारे हाथ में
  rationale: यह इब्रानी मुहावरा किसी को दूसरे के अधिकार में सौंपने का बोध देता है; हिंदी में ‘हाथ में कर देना’ मूल बिंब और अर्थ दोनों बनाए रखता है।
- source_word: וְהַאֲבַדְתָּ אֶת שְׁמָם
  choice: तुम ... उनका नाम मिटा दोगे
  rationale: אבד का हिफ़ील रूप कारणवाचक है और उसका कर्म ‘उनका नाम’ है। ‘नाम मिटा देना’ स्मृति और अस्तित्व के पूर्ण लोप को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: आकाश के नीचे से
  rationale: यह संसार में मानव अस्तित्व के क्षेत्र से पूर्णतः हटा दिए जाने का इब्रानी मुहावरा है; अनुवाद मूल चित्र को सुरक्षित रखता है।
- source_word: לֹא יִתְיַצֵּב אִישׁ
  choice: कोई भी पुरुष ... टिक नहीं सकेगा
  rationale: התיצב का अर्थ डटकर खड़ा होना या प्रतिरोध में टिकना है। אִישׁ पुल्लिंग एकवचन है, जिसका यहाँ प्रतिनिधिक सामान्य अर्थ है; ‘पुरुष’ मूल रूप को रखता है और ‘टिक नहीं सकेगा’ युद्ध-संदर्भ का बल व्यक्त करता है।
- source_word: בְּפָנֶיךָ
  choice: तुम्हारे सामने
  rationale: मुहावरे का शाब्दिक अर्थ ‘तुम्हारे सामने’ है और इस संदर्भ में विरोध में खड़े होने का भाव भी स्पष्ट रहता है।
- source_word: עַד הִשְׁמִדְךָ אֹתָם
  choice: जब तक तुम उनका सर्वनाश न कर दो
  rationale: עַד के बाद प्रत्यययुक्त क्रियार्थक संज्ञा अंतिम सीमा बताती है। שׁמד व्यवस्थाविवरण के युद्ध-संदर्भ में पूर्ण विनाश का प्रबल अर्थ रखता है, जिसे ‘सर्वनाश’ सुरक्षित रखता है।
theological_decisions:
- issue: אִישׁ का प्रतिनिधिक पुल्लिंग एकवचन
  choice: कोई भी पुरुष तुम्हारे सामने टिक नहीं सकेगा
  alternative: कोई भी व्यक्ति तुम्हारे सामने टिक नहीं सकेगा
  rationale: मूल पाठ पुल्लिंग एकवचन אִישׁ का प्रयोग सामान्य प्रतिनिधिक अर्थ में करता है। मुख्य पाठ में व्याकरणिक रूप बनाए रखा गया है, जबकि पादटिप्पणी उसके समावेशी आशय को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हाथ में’, ‘आकाश के नीचे’ और ‘नाम मिटा देना’ जैसे मूल इब्रानी बिंब सुरक्षित हैं; ‘टिक नहीं सकेगा’ सैन्य प्रतिरोध का स्वाभाविक हिंदी भाव देता है।
