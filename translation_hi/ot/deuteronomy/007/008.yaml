base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/008.yaml
  text: but because Yahweh loves you and because he is keeping the oath that he swore to your fathers[a], Yahweh brought you out with a mighty hand and redeemed you from the house of servants[b], from the hand of Pharaoh king of Egypt.
translation:
  language: hi
  text: बल्कि इसलिए कि याहवे तुमसे प्रेम करता है और इसलिए कि वह उस शपथ को निभाता है जो उसने तुम्हारे पुरखों से खाई थी, याहवे ने शक्तिशाली हाथ से तुम्हें बाहर निकाला[a] और दासता के घर से, अर्थात् मिस्र के राजा फ़िरौन के हाथ से, तुम्हें छुड़ाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मज़बूत हाथ से”; यह याहवे के शक्तिशाली उद्धार-कार्य का प्रचलित बिंब है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “दासों के घर से।” इसका अर्थ दासता का स्थान या बंधन-क्षेत्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: बल्कि इसलिए कि
  rationale: यह पद पिछले पद के निषेध के विपरीत वास्तविक कारण बताता है; यह अनुवाद विरोध और कारण, दोनों को व्यक्त करता है।
- source_word: מֵאַהֲבַת יְהוָה אֶתְכֶם
  choice: इसलिए कि याहवे तुमसे प्रेम करता है
  rationale: कारणसूचक रचना को स्वाभाविक हिन्दी क्रियात्मक वाक्य में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: וּמִשָּׁמְרוֹ אֶת הַשְּׁבֻעָה
  choice: और उस शपथ को निभाता है
  rationale: यह याहवे द्वारा अपनी शपथ का निष्ठापूर्वक पालन व्यक्त करता है; वर्तमान काल जारी वाचा-निष्ठा को बनाए रखता है।
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵיכֶם
  choice: जो उसने तुम्हारे पुरखों से खाई थी
  rationale: ‘पुरखों’ से कुलपिताओं का ऐतिहासिक संकेत और पुल्लिंग संदर्भ बना रहता है; हिन्दी में शपथ ‘खाना’ स्वाभाविक मुहावरा है।
- source_word: הוֹצִיא
  choice: बाहर निकाला
  rationale: निर्गमन की मानक क्रिया और मूल के कारक अर्थ को सीधे व्यक्त करता है।
- source_word: בְּיָד חֲזָקָה
  choice: सामर्थी हाथ से
  rationale: हिब्रू के ‘हाथ’ वाले बिंब को रखते हुए परमेश्वर के शक्तिशाली उद्धार-कार्य को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וַיִּפְדְּךָ
  choice: तुम्हें छुड़ाया
  rationale: दासत्व से मूल्य देकर अथवा अधिकार से मुक्त करने के פדה के अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: מִבֵּית עֲבָדִים
  choice: दासों के घर से
  rationale: हिब्रू के ठोस और शाब्दिक बिंब ‘दासों का घर’ को सुरक्षित रखता है, जहाँ मिस्र दासत्व का क्षेत्र है।
- source_word: מִיַּד פַּרְעֹה
  choice: फ़िरौन के हाथ से
  rationale: मूल के ‘हाथ’ बिंब को बनाए रखता है, जिसका अर्थ यहाँ फ़िरौन की सत्ता या अधिकार है।
- source_word: מֶלֶךְ מִצְרָיִם
  choice: मिस्र के राजा
  rationale: उपाधि का सीधा और स्वाभाविक हिन्दी अनुवाद है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में निजी वाचा-नाम है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: אֲבֹתֵיכֶם में वाचा-संबंधी पूर्वज
  choice: तुम्हारे पुरखे
  alternative: तुम्हारे पूर्वज / तुम्हारे पिता
  rationale: ‘पुरखे’ आधुनिक पाठक के लिए समझने योग्य है और कुलपिताओं के पुरुष-संदर्भ को सामान्य ‘पूर्वज’ की अपेक्षा अधिक स्पष्ट रखता है।
- issue: עֲבָדִים में बंधुआ स्थिति
  choice: दास
  alternative: सेवक / दासत्व
  rationale: मिस्र में इस्राएल की जबरन दासता संदर्भ का केंद्र है; ‘सेवक’ उस कठोर वास्तविकता को कम कर देगा।
- issue: פדה का उद्धार-संबंधी अर्थ
  choice: छुड़ाया
  alternative: छुटकारा दिया / मोल लेकर छुड़ाया
  rationale: ‘छुड़ाया’ दासता और फ़िरौन की सत्ता से वास्तविक मुक्ति व्यक्त करता है, जबकि मूल इस पद में किसी स्पष्ट भुगतान का उल्लेख नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘याहवे’, ‘पुरखे’, ‘शपथ’, ‘सामर्थी हाथ’ और ‘दासों का घर’ मूल के वाचा-संबंधी तथा ठोस बिंबों को सुरक्षित रखते हैं। डैश फ़िरौन के हाथ को दासों के घर की व्याख्यात्मक समानांतर अभिव्यक्ति के रूप में स्पष्ट करता है।
