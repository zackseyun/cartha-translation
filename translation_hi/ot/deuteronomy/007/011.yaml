  text: וְ/שָׁמַרְתָּ֨ אֶת הַ/מִּצְוָ֜ה וְ/אֶת הַֽ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֗ים אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם לַ/עֲשׂוֹתָֽ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/011.yaml
  text: So you shall keep the commandment and the statutes and the judgments that I am commanding you today[b][a], to do them.
translation:
  language: hi
  text: इसलिए[a] तुम उस आज्ञा, उन विधियों और उन न्याय-विधानों[b] का पालन करो, जिन्हें मैं आज तुम्हें पूरा करने की आज्ञा दे रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और तुम पालन करो” अथवा “अतः तुम पालन करो”; इब्रानी संयोजक पिछले वाक्यों से साधारण संबंध भी दिखा सकता है और उनसे निकला निष्कर्ष भी।
    reason: lexical_alternative
  - marker: b
    text: “न्याय-विधानों” का अनुवाद “नियमों” या “न्यायादेशों” के रूप में भी किया जा सकता है; इब्रानी शब्द कानूनी निर्णयों या निर्धारित विधानों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: इसलिए तुम … का पालन करना
  rationale: שׁמר का वाचा और व्यवस्था-संबंधी अर्थ ‘पालन करना’ है। आरंभिक וְ को पिछले कथन से निकलने वाले निष्कर्ष के रूप में ‘इसलिए’ किया गया है; इसकी व्यापक अर्थ-संभावना पादटिप्पणी में दी गई है।
- source_word: הַמִּצְוָה
  choice: उस आज्ञा
  rationale: इब्रानी एकवचन को एकवचन रखा गया है और इसके संकेतवाचक रूप को हिंदी में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: הַחֻקִּים
  choice: उन विधियों
  rationale: חֻקִּים के स्थापित वैधानिक अर्थ को ‘विधियों’ से व्यक्त किया गया है और इसे निकटवर्ती कानूनी पदों से अलग रखा गया है।
- source_word: הַמִּשְׁפָּטִים
  choice: उन नियमों
  rationale: מִשְׁפָּטִים यहाँ निर्धारित कानूनी नियमों या न्यायिक विधानों को सूचित करता है। आधुनिक हिंदी में ‘नियम’ सहज है; अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: जिनके विषय में मैं आज तुम्हें आज्ञा दे रहा हूँ
  rationale: सहभागी क्रिया מְצַוֶּה की वर्तमान और तत्काल क्रिया को ‘आज्ञा दे रहा हूँ’ से तथा व्यवस्थाविवरण की बलयुक्त הַיּוֹם को ‘आज’ से बनाए रखा गया है।
- source_word: לַעֲשׂוֹתָם
  choice: कि तुम उन्हें पूरा करो
  rationale: עשה के ठोस आज्ञापालन-सूचक भाव को ‘पूरा करो’ से व्यक्त किया गया है; ‘उन्हें’ का बहुवचन प्रत्यय भी स्पष्ट रखा गया है।
theological_decisions:
- issue: वाचा-व्यवस्था के तीन पदों को अलग-अलग व्यक्त करना
  choice: आज्ञा, विधियाँ और नियम
  alternative: आदेश, विधि-विधान और न्यायादेश
  rationale: मूल पाठ के परस्पर संबंधित किंतु अलग कानूनी पदों को एक सामान्य शब्द में मिलाने के बजाय तीन अलग हिंदी पदों से व्यक्त किया गया है। इससे पाठ की वाचागत और वैधानिक बनावट बनी रहती है, बिना किसी सांप्रदायिक व्याख्या को आरोपित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, पर व्यवस्था और वाचा के प्रसंग के अनुरूप गरिमापूर्ण वैधानिक शैली रखी गई है। ‘पालन करना’ हिंदी में निर्देशात्मक प्रयोग है और इब्रानी कथन की आज्ञात्मक बाध्यता को स्वाभाविक रूप से व्यक्त करता है।
