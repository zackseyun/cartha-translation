  edition: WLC
  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/ךָ֞ בָּחַ֣ר יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/006.yaml
  text: For you are a holy people to Yahweh your God. Yahweh your God has chosen you to be a treasured people for himself[a], from all the peoples who are on the face of the earth.
translation:
  language: hi
  text: क्योंकि तुम अपने परमेश्वर यहवे के लिए एक पवित्र प्रजा हो। तुम्हारे परमेश्वर यहवे ने पृथ्वी पर के सभी लोगों में से तुम्हें चुना है कि तुम उसकी अपनी बहुमूल्य प्रजा[a] हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी अपनी बहुमूल्य संपत्ति।” इब्रानी में शाब्दिक रूप से “विशेष संपत्ति की प्रजा” है, जिसमें प्रजा और विशेष रूप से संजोई हुई संपत्ति—दोनों भाव जुड़े हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आदेश का आधार बताता है; हिन्दी में ‘क्योंकि’ इसके व्याख्यात्मक कारण-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַם קָדוֹשׁ
  choice: एक पवित्र प्रजा
  rationale: यह पदबंध ऐसी प्रजा को दर्शाता है जो परमेश्वर के लिए अलग ठहराई गई है; ‘पवित्र प्रजा’ सहज हिन्दी में इसकी वाचा-संबंधी और धार्मिक गंभीरता बनाए रखता है।
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहवे के लिए
  rationale: ל संबंध और समर्पित होने का भाव देता है। ‘के लिए’ हिन्दी में इब्रानी संरचना और परमेश्वर से विशिष्ट संबंध, दोनों को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी वाचा-नाम יהוה को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘यहवे’ से प्रस्तुत किया गया है।
- source_word: בְּךָ בָּחַר
  choice: तुम्हें चुना है
  rationale: בחר चुनाव को व्यक्त करता है; पूर्ण वर्तमान रूप पूर्व चुनाव के वर्तमान परिणाम को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לִהְיוֹת לוֹ
  choice: कि तुम उसकी अपनी ... हो
  rationale: यह उद्देश्य और स्वामित्व दोनों व्यक्त करता है। ‘उसकी अपनी’ לו के विशेष संबंध और अपनाए जाने के भाव को सहज हिन्दी में सामने लाता है।
- source_word: לְעַם סְגֻלָּה
  choice: बहुमूल्य प्रजा
  rationale: עַם स्पष्टतः ‘प्रजा/लोग’ है और סְגֻלָּה विशेष रूप से संजोई हुई मूल्यवान संपत्ति का भाव रखता है। ‘बहुमूल्य प्रजा’ दोनों तत्वों को संक्षेप में सुरक्षित रखता है।
- source_word: מִכֹּל הָעַמִּים
  choice: सब लोगों में से
  rationale: מן + כל यहाँ अनेक लोगों के बीच से चुनाव दर्शाता है; ‘में से’ तुलनात्मक श्रेष्ठता जोड़े बिना चयन का अर्थ स्पष्ट करता है।
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: धरती पर के
  rationale: यह पृथ्वी पर रहने वाले सभी लोगों के लिए प्रचलित इब्रानी मुहावरा है। संक्षिप्त हिन्दी रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा-नाम सीधे आया है। ‘यहवे’ नाम को नाम के रूप में सुरक्षित रखता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: מִכֹּל הָעַמִּים में इस्राएल के चुनाव का आशय
  choice: सब लोगों में से
  alternative: सब लोगों से बढ़कर
  rationale: इब्रानी वाक्यांश लोगों के बीच से परमेश्वर के चुनाव को बताता है, लेकिन अपने आप में उनकी अंतर्निहित श्रेष्ठता का तुलनात्मक दावा आवश्यक नहीं बनाता।
- issue: סְגֻלָּה में प्रजा और संपत्ति की संयुक्त धारणा
  choice: बहुमूल्य प्रजा
  alternative: निजी बहुमूल्य संपत्ति
  rationale: मुख्य पाठ में स्पष्ट संज्ञा עַם को बनाए रखते हुए विशेष मूल्य और स्वामित्व का भाव दिया गया है; संपत्ति वाला वैकल्पिक आयाम पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। ‘प्रजा’ वाचा-संबंधी सामूहिक अर्थ को रखता है; ‘सब लोगों में से’ चुनाव को व्यक्त करता है, श्रेष्ठता का अतिरिक्त अर्थ नहीं जोड़ता।
