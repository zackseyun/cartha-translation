reference: Deuteronomy 7:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בָּר֥וּךְ תִּֽהְיֶ֖ה מִ/כָּל הָ/עַמִּ֑ים לֹא יִהְיֶ֥ה בְ/ךָ֛ עָקָ֥ר וַֽ/עֲקָרָ֖ה וּ/בִ/בְהֶמְתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/014.yaml
  text: You will be blessed above all peoples[a]; there will not be among you a barren man or woman[b], or among your livestock.
translation:
  language: hi
  text: तुम सब जातियों से बढ़कर धन्य होगे[a]। तुम्हारे बीच न कोई बाँझ पुरुष होगा, न बाँझ स्त्री[b], और न तुम्हारे पशुओं में कोई बाँझ होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब जातियों की अपेक्षा अधिक धन्य।” यहाँ इब्रानी पूर्वसर्ग तुलना का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में यहाँ पुल्लिंग और स्त्रीलिंग दोनों रूप स्पष्ट रूप से हैं: “बाँझ पुरुष और बाँझ स्त्री।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ תִּהְיֶה
  choice: तुम ... आशीष पाओगे
  rationale: ברך का निष्क्रिय कृदन्त और היה का अपूर्ण रूप आशीषित अवस्था की भावी वाचा-संबंधी प्रतिज्ञा व्यक्त करते हैं। आधुनिक हिन्दी में यह प्रयोग स्वाभाविक और स्पष्ट है।
- source_word: מִכָּל הָעַמִּים
  choice: सब जातियों से बढ़कर
  rationale: यहाँ מן तुलना व्यक्त करता है। 'से बढ़कर' तुलना को स्पष्ट रखता है, बिना यह अर्थ देने के कि इस्राएल उन जातियों में से अलग किया जाएगा।
- source_word: לֹא יִהְיֶה בְךָ
  choice: तुम्हारे बीच न कोई ... होगा
  rationale: היה के साथ בְּ समुदाय के भीतर किसी के न होने का भाव देता है। सामूहिक रूप से सम्बोधित इस्राएल के लिए 'तुम्हारे बीच' स्वाभाविक हिन्दी है।
- source_word: עָקָר וַעֲקָרָה
  choice: न कोई बाँझ पुरुष ... न बाँझ स्त्री
  rationale: मूल पाठ में पुल्लिंग और स्त्रीलिंग दोनों रूप स्पष्ट हैं। हिन्दी में दोनों को अलग-अलग कहना इस भेद को सुरक्षित रखता है। 'बाँझ' सामान्य पाठक के लिए परिचित है, यद्यपि पुरुष के लिए इसका प्रयोग अपेक्षाकृत कम होता है।
- source_word: וּבִבְהֶמְתֶּךָ
  choice: और न तुम्हारे पशुओं में कोई बाँझ होगा
  rationale: בְּהֵמָה यहाँ पालतू पशुओं का सामूहिक बोध कराता है। हिन्दी में विधेय को पूरा दोहराने से यह स्पष्ट होता है कि बाँझपन का निषेध पशुओं पर भी लागू है।
theological_decisions:
- issue: वाचा की आशीष में पुरुष और स्त्री के बाँझपन का उल्लेख
  choice: पुल्लिंग और स्त्रीलिंग दोनों को 'बाँझ पुरुष' और 'बाँझ स्त्री' के रूप में स्पष्ट रखा गया
  alternative: '''कोई बाँझ न होगा'' जैसे लिंग-निरपेक्ष सामान्यीकरण'
  rationale: इब्रानी जानबूझकर दोनों व्याकरणिक लिंगों का प्रयोग करता है; उन्हें सामान्य पद में समेटना स्रोत की विशिष्टता घटा देता।
- issue: इस्राएल को सामूहिक एकवचन में सम्बोधन
  choice: हिन्दी के सामान्य 'तुम/तुम्हारे' रूप रखे गए
  alternative: '''तुम लोग'' या ''तुम सब'' जोड़कर बहुवचन को स्पष्ट करना'
  rationale: मूल में सम्बोधन व्याकरणिक रूप से एकवचन, पर अर्थ में सामूहिक है। हिन्दी 'तुम' इस द्वैधता को सहज रूप से वहन कर सकता है।
- issue: अन्य जातियों की तुलना में आशीष
  choice: '''सब जातियों से बढ़कर'''
  alternative: '''सब जातियों के ऊपर'' या ''सब जातियों से अधिक'''
  rationale: तुलनात्मक מן को सुरक्षित रखते हुए 'से बढ़कर' स्वाभाविक हिन्दी देता है और पदानुक्रम संबंधी अनावश्यक विस्तार से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'जातियाँ', 'आशीष' और 'बाँझ' बाइबलीय सन्दर्भ में परिचित शब्द हैं। वाक्य को हिन्दी की स्वाभाविक निषेधात्मक समानांतर रचना में रखा गया है।
