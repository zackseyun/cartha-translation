base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/013.yaml
  text: He will love you[a], bless you, and multiply you. He will bless the fruit of your womb and the fruit of your ground—your grain, your new wine, and your oil, the offspring of your herds and the young of your flock—in the land that he swore to your fathers to give you.
translation:
  language: hi
  text: वह तुमसे प्रेम करेगा, तुम्हें आशीष देगा और तुम्हारी संख्या बढ़ाएगा। वह तुम्हारी कोख के फल और तुम्हारी भूमि की उपज को—तुम्हारे अनाज, नए दाखमधु और तेल को, तथा तुम्हारे गाय-बैलों की संतति और भेड़-बकरियों के बच्चों को—उस देश में आशीष देगा, जिसे तुम्हें देने का शपथपूर्वक वादा उसने तुम्हारे पुरखाओं[a] से किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूर्वजों।” इब्रानी में शाब्दिक रूप से “पिताओं” है।
    reason: मूल के पुल्लिंग रूप और स्वाभाविक लिंग-निरपेक्ष हिन्दी विकल्प, दोनों को दिखाने के लिए।
lexical_decisions:
- source_word: וַאֲהֵבְךָ
  choice: वह तुमसे प्रेम करेगा
  rationale: संदर्भ में यह वाचा से जुड़ी भावी आशीषों की शृंखला को आगे बढ़ाता है; ‘प्रेम’ मूल क्रिया के सीधे और संबंधपरक अर्थ को बनाए रखता है।
- source_word: וּבֵרַכְךָ
  choice: तुम्हें आशीष देगा
  rationale: वाचा के प्रसंग में ברך का स्वाभाविक और प्रचलित हिन्दी रूप।
- source_word: וְהִרְבֶּךָ
  choice: तुम्हारी संख्या बढ़ाएगा
  rationale: शाब्दिक ‘तुम्हें बढ़ाएगा’ की अपेक्षा आधुनिक हिन्दी में स्वाभाविक रहते हुए जन-वृद्धि का आशय स्पष्ट करता है।
- source_word: פְּרִי בִטְנְךָ
  choice: तुम्हारी कोख का फल
  rationale: संतान के लिए प्रयुक्त मूल ठोस रूपक को सुरक्षित रखता है।
- source_word: פְרִי אַדְמָתֶךָ
  choice: तुम्हारी भूमि की उपज
  rationale: कृषि-संदर्भ में अर्थ स्पष्ट और स्वाभाविक है; हिन्दी में ‘भूमि का फल’ की कृत्रिमता से बचता है।
- source_word: דְּגָנְךָ
  choice: तुम्हारा अनाज
  rationale: धान्य और अन्य अन्न-उपज के लिए स्पष्ट आधुनिक हिन्दी शब्द।
- source_word: תִירֹשְׁךָ
  choice: तुम्हारा नया दाखमधु
  rationale: ताज़ा उत्पादित दाखरस या नई मदिरा के विशिष्ट कृषि-अर्थ को बनाए रखता है।
- source_word: יִצְהָרֶךָ
  choice: तुम्हारा तेल
  rationale: यह सामान्यतः जैतून के तेल की ओर संकेत करता है, पर मूल में जैतून स्पष्ट न होने के कारण मुख्य पाठ में केवल ‘तेल’ रखा गया है।
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: तुम्हारे गाय-बैलों की संतति
  rationale: बड़े पालतू पशुओं से उत्पन्न बच्चों का आशय स्पष्ट करता है और बहुवचन पशुधन को समेटता है।
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: तुम्हारी भेड़-बकरियों के बच्चे
  rationale: असामान्य संज्ञा को इस सहप्रयोग में छोटे पालतू पशुओं की संतति के अर्थ में प्रस्तुत करता है, बिना इसे किसी देवता के नाम के रूप में आयात किए।
- source_word: עַל הָאֲדָמָה
  choice: जिस देश में
  rationale: यहाँ אֲדָמָה प्रतिज्ञात भूभाग को सूचित करती है; हिन्दी में स्थानसूचक ‘देश में’ स्वाभाविक है।
- source_word: לַאֲבֹתֶיךָ
  choice: तुम्हारे पुरखाओं से
  rationale: मूल के पुल्लिंग बहुवचन ‘पिताओं’ का अर्थ सुरक्षित रखते हुए ‘पुरखा’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
theological_decisions:
- issue: לַאֲבֹתֶיךָ में पुल्लिंग ‘पिताओं’ का अनुवाद
  choice: तुम्हारे पुरखाओं से
  alternative: तुम्हारे पूर्वजों से
  rationale: ‘पुरखाओं’ से मूल का पुरुषवाची रूप और वाचा की पैतृक शृंखला बनी रहती है; ‘पूर्वजों’ अधिक लिंग-निरपेक्ष और सहज विकल्प है, इसलिए उसे पाद-टिप्पणी में दिया गया है।
- issue: וַאֲהֵבְךָ का कालगत बल
  choice: वह तुमसे प्रेम करेगा
  alternative: उसने तुमसे प्रेम किया
  rationale: व्यवस्थाविवरण 7:12–13 में आज्ञापालन के प्रत्युत्तर में आने वाली आशीषों की शृंखला भावी अर्थ का समर्थन करती है, यद्यपि इब्रानी रूप को अकेले देखने पर भूतकालीन पाठ संभव लग सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कृषि और पशुधन की ठोस शब्दावली सुरक्षित है; वाक्य-विन्यास को हिन्दी की स्वाभाविकता के लिए पुनर्गठित किया गया है, जबकि आशीषों की पूरी सूची और प्रतिज्ञात देश से उनका संबंध यथावत है।
