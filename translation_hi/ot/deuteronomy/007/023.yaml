  text: וּ/נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/פָנֶ֑י/ךָ וְ/הָמָ/ם֙ מְהוּמָ֣ה גְדֹלָ֔ה עַ֖ד הִשָּׁמְדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/023.yaml
  text: But Yahweh your God will give them over to you and throw them into great confusion until they are destroyed[a][b].
translation:
  language: hi
  text: परन्तु याहवे, तुम्हारा परमेश्वर, उन्हें तुम्हारे वश में कर देगा[a] और उन्हें बड़ी घबराहट में डाल देगा[b], जब तक वे नष्ट न हो जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘तुम्हारे सामने।’ यहाँ इसका भाव शत्रुओं को तुम्हारे अधिकार में कर देना है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘बड़ी अफरा-तफरी’ या ‘घोर आतंक’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם ... לְפָנֶיךָ
  choice: उन्हें तुम्हारे वश में कर देगा
  rationale: शाब्दिक रूप से यह वाक्यांश ‘उन्हें तुम्हारे सामने देगा’ है, पर युद्ध के प्रसंग में נתן के साथ לְפָנֶיךָ शत्रुओं को किसी के अधिकार में सौंपने का भाव व्यक्त करता है। ‘तुम्हारे वश में कर देगा’ आधुनिक हिन्दी में इसी अर्थ को स्वाभाविक रूप से प्रकट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; इसलिए किसी उपाधि से बदलने के बजाय इसका हिन्दी लिप्यंतरण ‘याहवे’ रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: यह אֱלֹהִים के साथ द्वितीय पुरुष एकवचन पुल्लिंग प्रत्यय है और सीधे ‘तुम्हारा परमेश्वर’ का अर्थ देता है।
- source_word: וְהָמָם מְהוּמָה גְדֹלָה
  choice: उन्हें भारी घबराहट में डाल देगा
  rationale: क्रिया המם युद्ध में आतंकित, व्याकुल या अस्त-व्यस्त कर देने का भाव रखती है, और संज्ञा מְהוּמָה घबराहट, अफरा-तफरी या कोलाहल सूचित कर सकती है। यह अनुवाद कारक भाव और युद्धजनित अव्यवस्था दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: עַד הִשָּׁמְדָם
  choice: जब तक वे नष्ट न हो जाएँ
  rationale: עַד के बाद שׁמד का प्रत्यययुक्त क्रियार्थक रूप कार्रवाई की अंतिम सीमा बताता है। यह चयन मूल के परिणामसूचक और कर्मवाच्य भाव को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम יהוה प्रत्यक्ष रूप से आया है। ‘याहवे’ नाम को एक उपाधि से प्रतिस्थापित नहीं करता और मूल की पहचान को सुरक्षित रखता है।
- issue: नाश में परमेश्वर की सक्रिय भूमिका
  choice: याहवे उन्हें वश में करेगा और घबराहट में डालेगा, जब तक वे नष्ट न हों
  alternative: ऐसा निष्क्रिय अनुवाद जिसमें परमेश्वर की भूमिका अस्पष्ट हो
  rationale: दोनों क्रियाओं का कर्ता मूल पाठ में याहवे है। अनुवाद इस स्पष्ट कर्तृत्व को बनाए रखता है, पर अंतिम पदबंध के कर्मवाच्य भाव ‘वे नष्ट न हो जाएँ’ को उससे अधिक विशिष्ट नहीं बनाता जितना मूल पाठ करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम्हारे वश में’ युद्ध-संदर्भ के मुहावरे को स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है। ‘भारी घबराहट’ सामान्य पाठक के लिए बोधगम्य है और मूल शब्दों में निहित आतंक तथा अव्यवस्था की अर्थ-सीमा को खुला रखती है।
