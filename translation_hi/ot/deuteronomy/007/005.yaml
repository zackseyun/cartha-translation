source:
  edition: WLC
  text: כִּֽי אִם כֹּ֤ה תַעֲשׂוּ֙ לָ/הֶ֔ם מִזְבְּחֹתֵי/הֶ֣ם תִּתֹּ֔צוּ וּ/מַצֵּבֹתָ֖/ם תְּשַׁבֵּ֑רוּ וַ/אֲשֵֽׁירֵ/הֶם֙ תְּגַדֵּע֔וּ/ן וּ/פְסִילֵי/הֶ֖ם תִּשְׂרְפ֥וּ/ן בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/005.yaml
  text: 'But this is what you shall do to them: you shall tear down their altars[a], shatter their pillars, cut down their Asherah poles[c][b], and burn their carved images with fire.'
translation:
  language: hi
  text: 'पर तुम उनके साथ ऐसा करो: उनकी वेदियों को ढा दो, उनके पूजा-स्तम्भों[a] को चकनाचूर कर दो, उनके अशेरा-स्तम्भों[b] को काट गिराओ, और उनकी तराशी हुई मूर्तियों[c] को आग में जला दो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उपासना के लिए खड़े किए गए पवित्र पत्थर या स्तम्भ।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में बहुवचन ‘अशेरीम’; ये देवी अशेरा से जुड़ी उपासना-वस्तुएँ थीं, सम्भवतः लकड़ी के खम्भे या वृक्ष।
    reason: cultural_note
  - marker: c
    text: या “खुदी हुई मूर्तियाँ”; इब्रानी शब्द विशेष रूप से काटकर या तराशकर बनाई गई मूर्ति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם כֹּה תַעֲשׂוּ לָהֶם
  choice: परन्तु तुम उनके साथ यह करना
  rationale: כִּי אִם पिछले कथन के विपरीत ठोस निर्देश प्रस्तुत करता है, और כֹּה आगे आने वाले कार्यों की ओर संकेत करता है। यह हिन्दी में आदेशात्मक बल और संकेत—दोनों को स्वाभाविक रूप से रखता है।
- source_word: מִזְבְּחֹתֵיהֶם תִּתֹּצוּ
  choice: उनकी वेदियों को ढा देना
  rationale: נתץ किसी निर्मित वस्तु को गिरा देने या ध्वस्त करने का बोध देता है; वेदियों के संदर्भ में ‘ढा देना’ सहज और सटीक है।
- source_word: מַצֵּבֹתָם תְּשַׁבֵּרוּ
  choice: उनके पूजा-स्तम्भों को चकनाचूर कर देना
  rationale: מַצֵּבָה यहाँ उपासना में प्रयुक्त खड़े पत्थर या स्तम्भ को दर्शाता है। ‘पूजा-स्तम्भ’ संदर्भ स्पष्ट करता है, और Piel תְּשַׁבֵּרוּ की प्रबलता ‘चकनाचूर’ से व्यक्त होती है।
- source_word: אֲשֵׁירֵיהֶם תְּגַדֵּעוּן
  choice: उनके अशेरा-स्तम्भों को काट गिराना
  rationale: אֲשֵׁרִים अशेरा से जुड़े उपासना-विषय थे, सम्भवतः लकड़ी के खम्भे या वृक्षाकार वस्तुएँ। ‘काट गिराना’ גדע की क्रिया और वस्तु की सम्भावित लकड़ी की प्रकृति से मेल खाता है।
- source_word: פְסִילֵיהֶם
  choice: उनकी खुदी हुई मूर्तियों
  rationale: פֶּסֶל तराशकर या खोदकर बनाई गई प्रतिमा को दर्शाता है। ‘खुदी हुई मूर्तियाँ’ सामान्य ‘मूर्तियों’ की अपेक्षा मूल शब्द की निर्माण-विधि को सुरक्षित रखता है।
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: आग में जला देना
  rationale: यह पद आग द्वारा पूर्णतः जला देने का स्पष्ट आदेश देता है। ‘आग में जला देना’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल की स्पष्टता बनाए रखता है।
theological_decisions:
- issue: אֲשֵׁרִים को सामान्य मूर्ति मानना या अशेरा से जुड़ी विशिष्ट उपासना-वस्तु
  choice: अशेरा-स्तम्भ
  alternative: अशेरा की उपासना-वस्तुएँ; अशेरा-वृक्ष
  rationale: मूल पाठ कनानी उपासना की अलग-अलग वस्तुओं की सूची देता है। विशिष्ट नाम रखने से इसे सामान्य ‘मूर्ति’ में विलीन नहीं किया गया; वस्तु का ठीक रूप अनिश्चित होने के कारण पादटिप्पणी में यह अनिश्चितता बताई गई है।
- issue: विनाश के आदेश की तीव्रता
  choice: ढा देना, चकनाचूर कर देना, काट गिराना, जला देना
  alternative: हटा देना या नष्ट कर देना जैसे सामान्यीकृत क्रियापद
  rationale: इब्रानी पाठ अलग-अलग सशक्त और ठोस क्रियाएँ प्रयोग करता है। अनुवाद उनकी तीव्रता बनाए रखता है, पर पाठ से बाहर कोई धार्मिक औचित्य नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और आदेशात्मक है। ‘परन्तु’ औपचारिक विरोध को, जबकि ‘यह करना’ स्पष्ट निर्देश को व्यक्त करता है। सांस्कृतिक शब्द ‘अशेरा’ को लिप्यंतरित रखकर पादटिप्पणी में समझाया गया है।
