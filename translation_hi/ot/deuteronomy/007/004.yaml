source:
  edition: WLC
  text: כִּֽי יָסִ֤יר אֶת בִּנְ/ךָ֙ מֵֽ/אַחֲרַ֔/י וְ/עָבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וְ/הִשְׁמִידְ/ךָ֖ מַהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/004.yaml
  text: For he will turn your son away from following me[a], and they will serve other gods; then the anger of Yahweh will burn against you[c][b], and he will quickly destroy you.
translation:
  language: hi
  text: क्योंकि वह तुम्हारे बेटे को मेरे पीछे चलने से भटका देगा[a], और वे दूसरे देवताओं की सेवा करेंगे[b]। तब याहवे[c] का क्रोध तुम लोगों के विरुद्ध भड़क उठेगा, और वह शीघ्र ही तुम्हारा विनाश कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘मेरे पीछे से’; यह इब्रानी मुहावरा यहाँ ‘मेरा अनुसरण करने से’ के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में ‘तुम्हारे बेटे’ एकवचन है, पर ‘वे सेवा करेंगे’ बहुवचन है। यह परिवर्तन चेतावनी को उससे उत्पन्न परिवार या समुदाय तक व्यापक कर सकता है। वैकल्पिक अर्थ: ‘और वह दूसरे देवताओं की सेवा करेगा।’'
    reason: alternative_reading
  - marker: c
    text: ‘याहवे’ इब्रानी व्यक्तिगत नाम YHWH का लिप्यंतरण है; इसे परंपरागत रूप से ‘यहोवा’ या ‘प्रभु’ भी लिखा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में दिए गए निषेध का कारण बताता है और इब्रानी के व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יָסִיר
  choice: फेर देगा
  rationale: 'सूर धातु का हिफ़ील रूप यहाँ कारणवाचक है: वह व्यक्ति बेटे को याहवे का अनुसरण करने से हटा देगा।'
- source_word: בִּנְךָ
  choice: तेरे बेटे को
  rationale: इब्रानी पाठ पुल्लिंग एकवचन है और पिछले पद में उल्लिखित ‘तेरे बेटे’ से सीधे जुड़ता है; इसलिए इसे सामान्यीकृत करके ‘सन्तान’ नहीं किया गया।
- source_word: מֵאַחֲרַי
  choice: मेरे पीछे चलने से
  rationale: शाब्दिक ‘मेरे पीछे से’ एक इब्रानी मुहावरा है, जिसका आशय किसी का अनुसरण करना छोड़ देना है। यह हिन्दी उस मुहावरे का स्वाभाविक अर्थ देती है।
- source_word: וְעָבְדוּ
  choice: और वे ... सेवा करेंगे
  rationale: क्रिया बहुवचन है। अनुवाद एकवचन ‘बेटे’ से बहुवचन ‘वे’ की मूल पाठ में मौजूद अर्थपूर्ण संख्या-परिवर्तन को सुरक्षित रखता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह सीधा और प्रचलित अनुवाद है, जो याहवे के प्रति अनन्य निष्ठा के विपरीत अन्य देवताओं की उपासना को व्यक्त करता है।
- source_word: וְחָרָה אַף יְהוָה
  choice: तब याहवे का क्रोध ... भड़क उठेगा
  rationale: इब्रानी मुहावरे में क्रोध के जलने का सजीव रूपक है। ‘भड़क उठेगा’ उसे स्वाभाविक हिन्दी में बनाए रखता है, और ‘तब’ परिणाम का संबंध स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम YHWH को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: בָּכֶם
  choice: तुम सब पर
  rationale: क्रोध के मुहावरे के साथ पूर्वसर्ग उसके लक्ष्य को दर्शाता है। बहुवचन प्रत्यय को ‘तुम सब’ द्वारा स्पष्ट रखा गया है।
- source_word: וְהִשְׁמִידְךָ
  choice: वह ... तेरा विनाश कर देगा
  rationale: हिफ़ील रूप प्रबल विनाश का बोध देता है। ‘विनाश कर देगा’ गंभीर, स्पष्ट और गरिमापूर्ण है; एकवचन ‘तेरा’ मूल पाठ की संख्या को भी बनाए रखता है।
- source_word: מַהֵר
  choice: शीघ्र ही
  rationale: यह न्याय के तेजी से आने की चेतावनी देता है; ‘शीघ्र ही’ वर्तमान हिन्दी में स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: चेतावनी में एकवचन और बहुवचन सर्वनामों का संदर्भ
  choice: ‘तेरे बेटे’ के बाद मूल पाठ के बहुवचन ‘वे सेवा करेंगे’ को बनाए रखा गया है; इसी प्रकार ‘तुम सब पर’ और फिर ‘तेरा विनाश’ द्वारा संबोधन की संख्या में परिवर्तन सुरक्षित रखा गया है।
  alternative: सभी सर्वनामों को एकवचन करके केवल एक बेटे पर लागू करना, या सभी को बहुवचन करके पूरे समुदाय पर लागू करना।
  rationale: इब्रानी पाठ जानबूझकर या प्रतिनिधिक सामूहिक संबोधन के कारण संख्या बदलता है। किसी एक व्याख्या को थोपने के बजाय अनुवाद उस तनाव को पाठक के सामने रहने देता है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत नाम को एक उपाधि में बदलने के बजाय उसका लिप्यंतरण मूल पाठ की विशिष्टता को बनाए रखता है; पादटिप्पणी पाठकों को अन्य परिचित रूपों से अवगत कराती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘तेरे/तेरा’ प्राचीन सामूहिक संबोधन और मूल के एकवचन को व्यक्त करता है, जबकि ‘तुम सब’ इब्रानी बहुवचन को स्पष्ट करता है। संख्या में यह असामान्य परिवर्तन जानबूझकर सुरक्षित रखा गया है।
