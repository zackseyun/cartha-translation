source:
  edition: WLC
  text: וְ/לֹא תָבִ֤יא תֽוֹעֵבָה֙ אֶל בֵּיתֶ֔/ךָ וְ/הָיִ֥יתָ חֵ֖רֶם כָּמֹ֑/הוּ שַׁקֵּ֧ץ תְּשַׁקְּצֶ֛/נּוּ וְ/תַעֵ֥ב תְּֽתַעֲבֶ֖/נּוּ כִּי חֵ֥רֶם הֽוּא־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/026.yaml
  text: And you shall not bring an abomination into your house[a], or you will become devoted to destruction like it. You shall utterly detest it and utterly abhor it, for it is devoted to destruction.
translation:
  language: hi
  text: तुम कोई घृणित वस्तु अपने घर में न लाना, नहीं तो तुम भी उसके समान विनाश के लिए समर्पित हो जाओगे। उसे पूरी तरह घृणित मानना और उससे पूरी तरह घृणा करना, क्योंकि वह विनाश के लिए समर्पित है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “प्रतिबंध के अधीन”; परंपरागत अनुवाद: “शापित।” इब्रानी शब्द उस वस्तु को दर्शाता है जो परमेश्वर के न्याय के अधीन विनाश के लिए अलग कर दी गई हो।'
    reason: חֵרֶם के वैकल्पिक और परंपरागत अनुवाद स्पष्ट करना।
lexical_decisions:
- source_word: תָבִיא
  choice: लाना
  rationale: בוא के हिफ़ील रूप का अर्थ यहाँ किसी वस्तु को घर के भीतर ले आना है; ‘लाना’ सीधा और स्वाभाविक निषेध व्यक्त करता है।
- source_word: תּוֹעֵבָה
  choice: घृणित वस्तु
  rationale: संदर्भ में यह मूर्तिपूजा से जुड़ी ऐसी ठोस वस्तु है जो धार्मिक और नैतिक रूप से घृणित मानी गई है; ‘घृणित वस्तु’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: בֵּיתֶךָ
  choice: अपने घर में
  rationale: शाब्दिक ‘तेरा घर’ यहाँ घरेलू स्थान को सूचित करता है; हिन्दी वाक्य में ‘अपने घर में’ स्वाभाविक है।
- source_word: וְהָיִיתָ חֵרֶם כָּמֹהוּ
  choice: नहीं तो तुम भी उसके समान विनाश के लिए समर्पित हो जाओगे
  rationale: वाव का परिणामसूचक बल ‘नहीं तो’ से व्यक्त होता है। חֵרֶם को केवल ‘शापित’ न कहकर ईश्वरीय न्याय के अधीन विनाश हेतु अलग किए जाने का भाव सुरक्षित रखा गया है।
- source_word: שַׁקֵּץ תְּשַׁקְּצֶנּוּ
  choice: उससे पूरी तरह घृणा करना
  rationale: क्रिया के साथ infinitive absolute आदेश को प्रबल बनाता है; ‘पूरी तरह’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְתַעֵב תְּתַעֲבֶנּוּ
  choice: और उसे सर्वथा तुच्छ जानना
  rationale: दूसरी प्रबलित क्रिया पहली के समानार्थी होते हुए भी अलग भाव रखती है; ‘सर्वथा तुच्छ जानना’ इस युग्म को बिना अनावश्यक दोहराव के बनाए रखता है।
- source_word: כִּי חֵרֶם הוּא
  choice: क्योंकि वह विनाश के लिए समर्पित है
  rationale: कारणवाचक उपवाक्य पहले आए חֵרֶם को दोहराता है; उसी हिन्दी पदबंध की पुनरावृत्ति स्रोत का शब्द-संबंध बनाए रखती है।
theological_decisions:
- issue: वाचा-न्याय के संदर्भ में חֵרֶם का अनुवाद
  choice: विनाश के लिए समर्पित
  alternative: प्रतिबंधित; शापित; सत्यानाश के लिए ठहराया हुआ
  rationale: חֵרֶם ऐसी वस्तु या व्यक्ति की स्थिति बताता है जिसे ईश्वरीय न्याय के अधीन विनाश के लिए अलग कर दिया गया है। ‘विनाश के लिए समर्पित’ इस वैधानिक-धार्मिक अर्थ को केवल शाप या सामाजिक निषेध तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा, गंभीर और आज्ञात्मक लहजा। ‘घृणित वस्तु’ ठोस मूर्तिपूजक वस्तु को स्पष्ट करता है, जबकि ‘विनाश के लिए समर्पित’ प्रमुख वाचा-संबंधी पद का अर्थ बनाए रखता है। footnote marker को उस अंतिम कथन के बाद रखा गया है जहाँ प्रमुख शब्द फिर आता है।
