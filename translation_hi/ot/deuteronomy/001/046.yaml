lexical_decisions:
- source_word: וַתֵּשְׁבוּ
  choice: इसलिए तुम ... ठहरे रहे
  rationale: ישׁב के इस रूप में किसी स्थान पर बने रहने का भाव है। संदर्भ में लंबे पड़ाव के लिए ‘ठहरे रहे’ स्वाभाविक है; ‘इसलिए’ पिछले प्रसंग के परिणामसूचक क्रम को व्यक्त करता है।
- source_word: בְקָדֵשׁ
  choice: कादेश में
  rationale: स्थानवाचक בְּ का स्वाभाविक हिन्दी रूप ‘में’ है; कादेश नाम का लिप्यंतरण किया गया है।
- source_word: יָמִים רַבִּים
  choice: बहुत दिनों तक
  rationale: यह ‘बहुत दिन’ का सीधा अर्थ रखता है और हिन्दी में अवधि बताने के लिए ‘तक’ सहित स्वाभाविक है।
- source_word: כַּיָּמִים אֲשֶׁר יְשַׁבְתֶּם
  choice: उतने दिनों तक, जितने दिनों तक तुम वहाँ ठहरे थे
  rationale: כְּ के तुलनात्मक अर्थ और मूल की संक्षिप्त, कुछ अस्पष्ट अभिव्यक्ति को हिन्दी की ‘उतने... जितने...’ रचना से व्यक्त किया गया है। ‘वहाँ’ कादेश की संदर्भगत पुनरुक्ति स्पष्ट करता है, पर मूल में प्रत्यक्ष नहीं है।
