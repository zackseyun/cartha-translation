base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/038.yaml
  text: Joshua son of Nun[a], who stands before you—he will go in there. Strengthen him, for he will cause Israel to inherit it.
translation:
  language: hi
  text: नून का पुत्र यहोशू, जो तुम्हारे सामने खड़ा है, वही वहाँ प्रवेश करेगा। उसे दृढ़ करो, क्योंकि वही इस्राएल को उस देश का अधिकारी बनाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वही उस देश को विरासत के रूप में इस्राएल को देगा’; अथवा ‘वही उसे इस्राएल को बाँटेगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: नून का पुत्र यहोशू
  rationale: व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं और इब्रानी पितृनाम-सूचक रचना को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: הָעֹמֵד לְפָנֶיךָ
  choice: जो तुम्हारे सामने खड़ा है
  rationale: यह अनुवाद कृदन्तीय वाक्यांश और उसके प्रत्यक्ष स्थान-संबंधी बिंब को सुरक्षित रखता है; ‘जो तुम्हारी सेवा करता है’ सम्भव अर्थ है, पर अधिक व्याख्यात्मक होता।
- source_word: הוּא יָבֹא שָׁמָּה
  choice: वही वहाँ प्रवेश करेगा
  rationale: בוא और दिशासूचक שָׁמָּה यहाँ पहले उल्लिखित देश के भीतर जाने का भाव देते हैं। ‘वही’ से बलसूचक הוּא भी व्यक्त होता है।
- source_word: אֹתוֹ חַזֵּק
  choice: उसे दृढ़ करो
  rationale: חזק के आज्ञार्थक रूप में बल देने, हौसला बढ़ाने और समर्थ करने का व्यापक भाव है; ‘दृढ़ करो’ इस विस्तार को संक्षेप में बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पिछली आज्ञा का कारण प्रस्तुत करता है।
- source_word: הוּא יַנְחִלֶנָּה אֶת יִשְׂרָאֵל
  choice: वही इस्राएल को उस देश का अधिकारी बनाएगा
  rationale: נחל के हिफ़ील रूप का कारणात्मक अर्थ ‘उत्तराधिकार/विरासत का अधिकारी बनाना’ है। स्त्रीलिंग प्रत्यय का संदर्भ प्रसंग में प्रतिज्ञात देश है, जिसे हिन्दी में स्पष्ट किया गया है।
theological_decisions:
- issue: יַנְחִלֶנָּה में स्त्रीलिंग कर्म-प्रत्यय का संदर्भ
  choice: प्रत्यय को पहले उल्लिखित प्रतिज्ञात देश के संदर्भ में ‘उस देश’ के रूप में स्पष्ट किया गया है।
  alternative: इसे अधिक शाब्दिक किंतु हिन्दी में कम स्पष्ट रूप से ‘वह इस्राएल को उसका अधिकारी बनाएगा’ कहा जा सकता है।
  rationale: निकटवर्ती प्रसंग देश में प्रवेश और उस पर अधिकार पाने का है। ‘उस देश’ जोड़ना इब्रानी सर्वनाम का निहित संदर्भ स्पष्ट करता है, कोई नया धर्मवैज्ञानिक दावा नहीं जोड़ता।
- issue: יַנְחִלֶנָּה की कारणात्मक क्रिया का स्वरूप
  choice: इस्राएल को देश का अधिकारी बनाना
  alternative: देश को विरासत के रूप में इस्राएल को देना या इस्राएल में बाँटना
  rationale: हिफ़ील रूप इन निकटवर्ती अर्थों को वहन कर सकता है। मुख्य पाठ कारणात्मक संरचना को सुरक्षित रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। मूसा के लिए एकवचन संदर्भ को हिन्दी की स्वाभाविक आदरसूचक ‘तुम्हारे’ से व्यक्त किया गया है।
