  text: Yahweh our God spoke to us at Horeb[a], saying[b], “You have stayed at this mountain long enough.”
translation:
  language: hi
  text: हमारे परमेश्वर याहवे ने होरेब में हमसे कहा, “तुम इस पहाड़ पर काफी समय से ठहरे हुए हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “बस, अब इस पहाड़ पर और मत रहो।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: बहुवचन-रूप वाले शब्द का यहाँ इस्राएल के एक परमेश्वर के लिए एकवचन अर्थ है; प्रथम पुरुष बहुवचन प्रत्यय से ‘हमारे’ आता है।
- source_word: דִּבֶּר אֵלֵינוּ
  choice: हमसे कहा
  rationale: शाब्दिक अर्थ ‘हमसे बोला’ है; प्रत्यक्ष कथन से पहले आधुनिक स्वाभाविक हिन्दी में ‘हमसे कहा’ वही अर्थ स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּחֹרֵב
  choice: होरेब में
  rationale: בְּ का प्रयोग स्थानसूचक है और मूल पाठ के स्थान-नाम होरेब को सीनै से प्रतिस्थापित नहीं किया गया।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष कथन के उद्धरण-चिह्न
  rationale: यह कथन आरम्भ कराने वाला इब्रानी सूत्र है; हिन्दी में ‘कहा’ और उसके बाद प्रत्यक्ष उद्धरण इसके कार्य को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: רַב לָכֶם שֶׁבֶת
  choice: तुम ... बहुत समय तक रह चुके हो
  rationale: मुहावरे का आशय है कि वहाँ रहने की अवधि पर्याप्त हो चुकी है; हिन्दी में यह रूप संदर्भगत अर्थ को स्वाभाविक ढंग से देता है।
- source_word: בָּהָר הַזֶּה
  choice: इस पहाड़ पर
  rationale: הַר का सामान्य अर्थ ‘पहाड़’ है और निवास अथवा पड़ाव के संदर्भ में हिन्दी ‘पर’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में प्रयुक्त व्यक्तिगत वाचा-नाम को सुरक्षित रखते हुए उसका देवनागरी लिप्यंतरण किया गया है, उपाधि से प्रतिस्थापन नहीं।
- issue: רַב לָכֶם שֶׁבֶת की आज्ञात्मक अथवा पूर्ण-अवधि संबंधी सूक्ष्मता
  choice: तुम इस पहाड़ पर बहुत समय तक रह चुके हो
  alternative: बस, अब इस पहाड़ पर और मत रहो
  rationale: मुख्य पाठ अवधि पर्याप्त हो चुकने का अर्थ रखता है और आगे बढ़ने का निहित आदेश अगले संदर्भ के लिए छोड़ता है; अधिक स्पष्ट आज्ञात्मक अर्थ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। मूल पाठ के ‘होरेब’ नाम को यथावत रखा गया है; उसे ‘सीनै’ से नहीं मिलाया गया। अंग्रेज़ी परामर्श-पाठ की होरेब-संबंधी सूचना यहाँ अलग पादटिप्पणी नहीं बनाई गई, क्योंकि ‘होरेब’ मुख्य पाठ में स्पष्ट है और प्रस्तावित क्रॉस-संदर्भ अनुवादगत अस्पष्टता नहीं है।
