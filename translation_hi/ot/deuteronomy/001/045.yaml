source:
  edition: WLC
  text: וַ/תָּשֻׁ֥בוּ וַ/תִּבְכּ֖וּ לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא שָׁמַ֤ע יְהוָה֙ בְּ/קֹ֣לְ/כֶ֔ם וְ/לֹ֥א הֶאֱזִ֖ין אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/045.yaml
  text: Then you returned and wept before Yahweh[a], but Yahweh did not listen to your voice or pay attention to you.
translation:
  language: hi
  text: तब तुम लौटे और याहवे के सामने रोए, पर याहवे ने न तुम्हारी आवाज़ सुनी, न तुम्हारी ओर कान लगाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी अनुवाद किया जा सकता है: “याहवे ने तुम्हारी आवाज़ नहीं सुनी और न तुम्हारी ओर कान लगाया।” इब्रानी में सुनने से संबंधित दो निकट-समानांतर क्रियाएँ हैं, जो इस बात पर बल देती हैं कि याहवे ने उनकी पुकार पर ध्यान नहीं दिया।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: तब तुम लौटे
  rationale: שׁוּב का सामान्य अर्थ ‘लौटना/वापस मुड़ना’ है। प्रसंग में असफल आक्रमण के बाद लौटना अभिप्रेत है, और ‘तब’ कथानक की क्रमिकता व्यक्त करता है।
- source_word: וַתִּבְכּוּ
  choice: और ... रोए
  rationale: בכה का अर्थ ‘रोना/विलाप करना’ है। ‘रोए’ स्वाभाविक और गंभीर है तथा मूल में न दी गई अतिरिक्त तीव्रता नहीं जोड़ता।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने/की उपस्थिति में’ है। ‘के सामने’ सहज हिंदी में उपस्थिति और प्रार्थनापूर्ण विनती, दोनों का संदर्भ बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम יהוה है; इसलिए उसे किसी उपाधि से बदलने के बजाय हिंदी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: וְלֹא שָׁמַע יְהוָה בְּקֹלְכֶם
  choice: पर याहवे ने न तुम्हारी आवाज़ सुनी
  rationale: שׁמע בְּקוֹל में सुनने के साथ ध्यान देने या स्वीकार करने की अर्थ-छाया हो सकती है। ‘आवाज़ सुनी’ मूल रूपक को बनाए रखता है; ‘पर’ प्रसंग में अपेक्षा-विरोध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְלֹא הֶאֱזִין אֲלֵיכֶם
  choice: न तुम्हारी ओर कान लगाया
  rationale: האזין का अर्थ ध्यान से सुनना या कान लगाना है। यह चयन पहले सुननेवाले क्रिया-पद के साथ मूल की निकट-समानांतर रचना और बल को सुरक्षित रखता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल इब्रानी पाठ में व्यक्तिगत वाचा-नाम יהוה सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि में बदलने से बचाता है।
- issue: याहवे के न सुनने का आशय
  choice: सुनने से संबंधित दोनों इब्रानी क्रियाओं को समानांतर रूप में रखा गया
  alternative: ‘याहवे ने उनकी विनती स्वीकार नहीं की’
  rationale: मूल पाठ शारीरिक रूप से सुन न सकने की बात नहीं, बल्कि विनती पर ध्यान न देने या उसका उत्तर न देने की बात कहता है। फिर भी मुख्य पाठ में मूल का श्रवण-रूपक रखा गया है और उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘तुम’ बहुवचन इस्राएली समुदाय को संबोधित करता है। ‘कान लगाया’ परिचित हिंदी मुहावरा है और इब्रानी समानांतरता को बनाए रखता है।
