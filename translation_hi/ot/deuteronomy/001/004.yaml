base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/004.yaml
  text: after he had struck down Sihon king of the Amorites[a], who lived in Heshbon, and Og king of Bashan, who lived in Ashtaroth at Edrei.
translation:
  language: hi
  text: एमोरियों के राजा सीहोन को, जो हेशबोन में रहता था, और बाशान के राजा ओग को, जो अश्तारोत में, एद्रेई में रहता था,[a] उसके द्वारा उन्हें मार गिराए जाने के बाद।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे संभवतः ‘जो अश्तारोत और एद्रेई में रहता था’ भी समझा जा सकता है। इब्रानी में दोनों स्थानों से पहले ‘में’ आया है, पर उनके बीच का ठीक संबंध स्पष्ट नहीं है।
    reason: दो स्थान-नामों वाली संकुचित इब्रानी रचना की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
