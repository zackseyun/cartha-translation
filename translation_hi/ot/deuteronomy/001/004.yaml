- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: जो हेशबोन में रहता था
  rationale: יָשַׁב यहाँ निवास का अर्थ देता है; ‘रहता था’ आधुनिक, सहज हिन्दी है।
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: बाशान के राजा ओग
  rationale: निर्माण-संबंध को सामान्य हिन्दी ‘बाशान के राजा’ से व्यक्त किया गया और नाम का लिप्यंतरण किया गया है।
- source_word: אֲשֶׁר יוֹשֵׁב בְּעַשְׁתָּרֹת בְּאֶדְרֶעִי
  choice: जो अश्तारोत में, एद्रेई में रहता था
  rationale: दोनों स्थान-नामों से पहले आए בְּ को ‘में’ से दिखाया गया है। अल्पविराम संकुचित इब्रानी रचना को बनाए रखता है और दोनों स्थानों का सटीक पारस्परिक संबंध तय नहीं करता।
