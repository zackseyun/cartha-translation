  text: וַ/יֵּצֵ֨א הָ/אֱמֹרִ֜י הַ/יֹּשֵׁ֨ב בָּ/הָ֤ר הַ/הוּא֙ לִ/קְרַאתְ/כֶ֔ם וַ/יִּרְדְּפ֣וּ אֶתְ/כֶ֔ם כַּ/אֲשֶׁ֥ר תַּעֲשֶׂ֖ינָה הַ/דְּבֹרִ֑ים וַֽ/יַּכְּת֥וּ אֶתְ/כֶ֛ם בְּ/שֵׂעִ֖יר עַד חָרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/044.yaml
  text: Then the Amorites who lived in that hill country came out to meet you and pursued you as bees do[b][a], and they struck you down in Seir as far as Hormah.
translation:
  language: hi
  text: तब उस पहाड़ी प्रदेश में रहनेवाले एमोरी लोग[a] तुम्हारा सामना करने निकल आए। उन्होंने मधुमक्खियों की तरह तुम्हारा पीछा किया और सेईर में होर्मा तक तुम्हें परास्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एमोरी जन’; इब्रानी में शब्द एकवचन है, पर इसका प्रयोग एमोरी समुदाय के लिए सामूहिक रूप से हुआ है, जैसा कि आगे आनेवाली बहुवचन क्रियाओं से स्पष्ट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकल आए
  rationale: कथात्मक संदर्भ में יצא का अर्थ बाहर निकलना है; शत्रुओं के इस्राएल की ओर आने के कारण ‘निकल आए’ स्वाभाविक है।
- source_word: הָאֱמֹרִי
  choice: एमोरी
  rationale: रूप की दृष्टि से इब्रानी शब्द एकवचन है, पर आगे की बहुवचन क्रियाएँ इसे एमोरी समुदाय के सामूहिक उल्लेख के रूप में स्पष्ट करती हैं। हिंदी में ‘एमोरी’ जातिनाम के रूप में संख्या की कठोर पहचान किए बिना यह सामूहिक अर्थ दे सकता है।
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: उस पहाड़ी प्रदेश में रहनेवाले
  rationale: הַר यहाँ केवल एक पर्वत के बजाय व्यापक पर्वतीय क्षेत्र का बोध करा सकता है; प्रसंग में ‘पहाड़ी प्रदेश’ अधिक स्वाभाविक है। सहभागी रूप स्थायी निवास का संकेत देता है।
- source_word: לִקְרַאתְכֶם
  choice: तुम्हारा सामना करने
  rationale: לקראת का मूल भाव सामने आने या मिलने का है; युद्ध के प्रसंग में ‘सामना करने’ शत्रुतापूर्ण मुठभेड़ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַיִּרְדְּפוּ אֶתְכֶם
  choice: उन्होंने ... तुम्हारा पीछा किया
  rationale: רדף सैन्य संदर्भ में पीछा करने के लिए सामान्य क्रिया है।
- source_word: כַּאֲשֶׁר תַּעֲשֶׂינָה הַדְּבֹרִים
  choice: मधुमक्खियों की तरह
  rationale: शाब्दिक रूप ‘जैसा मधुमक्खियाँ करती हैं’ है; हिंदी में संक्षिप्त उपमा वही सजीव और लोकोक्तिपरक अर्थ स्वाभाविक रूप से व्यक्त करती है।
- source_word: וַיַּכְּתוּ אֶתְכֶם
  choice: तुम्हें मार गिराया
  rationale: כתת का हिफ़ील रूप प्रबल प्रहार करके परास्त करने का भाव देता है; ‘मार गिराया’ हिंसक सैन्य पराजय को स्पष्ट करता है, बिना ‘कुचल डाला’ जैसी अधिक तीव्र व्याख्या थोपे।
- source_word: בְּשֵׂעִיר
  choice: सेईर में
  rationale: ב स्थान अथवा क्षेत्र सूचित करता है; ‘में’ इसका सीधा और संदर्भानुकूल रूप है।
- source_word: עַד חָרְמָה
  choice: होर्मा तक
  rationale: עד पीछा और पराजय की भौगोलिक सीमा बताता है; हिंदी में ‘तक’ स्वाभाविक है।
