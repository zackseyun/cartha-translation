- from: लेकिन तुम ऊपर जाने को तैयार नहीं हुए और तुमने अपने परमेश्वर यहोवा की आज्ञा का विरोध किया।
  to: लेकिन तुम ऊपर जाने को राज़ी नहीं हुए और तुमने अपने परमेश्वर याहवे की आज्ञा के विरुद्ध विद्रोह किया।
