reference: Deuteronomy 1:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹ֥א אֲבִיתֶ֖ם לַ/עֲלֹ֑ת וַ/תַּמְר֕וּ אֶת פִּ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/026.yaml
  text: But you were not willing to go up[a], and you rebelled against the command of Yahweh your God.
translation:
  language: hi
  text: लेकिन तुम ऊपर जाने को राज़ी नहीं हुए और तुमने अपने परमेश्वर याहवे की आज्ञा के विरुद्ध विद्रोह किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא אֲבִיתֶם
  choice: लेकिन तुम ... तैयार नहीं हुए
  rationale: संयोजन प्रसंग में विरोध दिखाता है, और नकार सहित אבה इच्छा या सहमति न होने का भाव देता है। यह अनुवाद उस स्वैच्छिक अस्वीकार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַעֲלֹת
  choice: ऊपर जाने को
  rationale: עלה का मूल दिशात्मक अर्थ ‘ऊपर जाना’ है; इस रूप में प्रतिज्ञात देश की ओर चढ़ने का भाव बना रहता है।
- source_word: וַתַּמְרוּ
  choice: विरोध किया
  rationale: מרה अधिकार के विरुद्ध विद्रोह या अवज्ञापूर्ण प्रतिरोध को दर्शाता है। ‘विरोध किया’ सामान्य हिन्दी में स्पष्ट है और अगले पदबंध के साथ स्वाभाविक बैठता है।
- source_word: אֶת־פִּי
  choice: आज्ञा का
  rationale: शाब्दिक अर्थ ‘मुख’ है, पर ‘किसी के मुख का विरोध करना’ इब्रानी मुहावरा उसकी कही हुई आज्ञा की अवज्ञा या उसका प्रतिरोध करने के अर्थ में है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय का अर्थ ‘तुम्हारा/अपने’ है और יהוה के साथ אֱלֹהִים एकवचन अर्थ ‘परमेश्वर’ रखता है। हिन्दी वाक्य में ‘अपने’ कर्ता से संबंध को सहज बनाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में सुविदित ‘यहोवा’ नाम को नाम ही रहने देता है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: אֶת־פִּי मुहावरे का अर्थ
  choice: आज्ञा का विरोध किया
  alternative: मुख का विरोध किया
  rationale: शाब्दिक ‘मुख’ हिन्दी में अर्थ अस्पष्ट कर देता। यहाँ आशय परमेश्वर के बोले हुए आदेश के विरुद्ध विद्रोह से है; अनुवाद उसी अधिकार और अवज्ञा को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पठन में सहज रखी गई है। ‘ऊपर जाने’ से मूल का भौगोलिक दिशाबोध और ‘तैयार नहीं हुए’ से इच्छा-संबंधी सूक्ष्मता सुरक्षित है।
