source:
  edition: WLC
  text: וַ/יִּיטַ֥ב בְּ/עֵינַ֖/י הַ/דָּבָ֑ר וָ/אֶקַּ֤ח מִ/כֶּם֙ שְׁנֵ֣ים עָשָׂ֣ר אֲנָשִׁ֔ים אִ֥ישׁ אֶחָ֖ד לַ/שָּֽׁבֶט׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/023.yaml
  text: And the matter seemed good in my eyes[a], so I took from among you twelve men, one man for each tribe.
translation:
  language: hi
  text: यह बात मुझे अच्छी लगी,[a] इसलिए मैंने तुममें से बारह पुरुषों को लिया—हर गोत्र से एक पुरुष।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह प्रस्ताव मुझे पसन्द आया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב בְּעֵינַי
  choice: मुझे अच्छी लगी
  rationale: यह स्वाभाविक हिन्दी में इब्रानी मुहावरे का अर्थ व्यक्त करता है कि प्रस्ताव मूसा को उचित और स्वीकार्य लगा; शाब्दिक ‘मेरी आँखों में अच्छी लगी’ हिन्दी में अस्वाभाविक होता।
- source_word: הַדָּבָר
  choice: यह बात
  rationale: संदर्भ में यह पहले रखे गए सुझाव को बताता है। ‘बात’ व्यापक अर्थ बनाए रखता है और ‘प्रस्ताव’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: וָאֶקַּח
  choice: मैंने ... लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है। प्रसंग में चयन निहित है, पर ‘लिया’ स्रोत की अभिव्यक्ति के निकट रहते हुए हिन्दी में स्पष्ट है।
- source_word: מִכֶּם
  choice: तुममें से
  rationale: यह समूह के भीतर से लिए जाने का भाव सहज और ठीक प्रकार से व्यक्त करता है।
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: बारह पुरुषों
  rationale: मूल पदबंध स्पष्ट रूप से बारह पुरुषों को दर्शाता है; लिंग-विशिष्ट अर्थ सुरक्षित रखा गया है।
- source_word: אִישׁ אֶחָד לַשָּׁבֶט
  choice: हर गोत्र से एक पुरुष
  rationale: यह वितरणात्मक अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है कि प्रत्येक गोत्र से एक प्रतिनिधि लिया गया।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘गोत्र’ बाइबलीय इस्राएली जनजातीय इकाई के लिए प्रचलित पद है। मुख्य पाठ में व्यापक ‘बात’ रखा गया है और अधिक संदर्भपरक ‘प्रस्ताव’ पादटिप्पणी में दिया गया है।
