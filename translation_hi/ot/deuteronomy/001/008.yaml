source:
  edition: WLC
  text: רְאֵ֛ה נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם אֶת הָ/אָ֑רֶץ בֹּ֚אוּ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֣ר נִשְׁבַּ֣ע יְ֠הוָה לַ/אֲבֹ֨תֵי/כֶ֜ם לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לָ/תֵ֣ת לָ/הֶ֔ם וּ/לְ/זַרְעָ֖/ם אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/008.yaml
  text: See[a], I have set the land before you. Go in and take possession of the land that Yahweh swore to your fathers—to Abraham, to Isaac[d][c][b], and to Jacob—to give to them and to their offspring after them.
translation:
  language: hi
  text: देखो[a], मैंने देश तुम्हारे सामने रख दिया है। उसमें जाओ और उस देश को अपने अधिकार में ले लो[b], जिसे याहवे ने तुम्हारे पिताओं[c]—अब्राहम, इसहाक और याकूब—को देने की शपथ खाई थी, उन्हें और उनके बाद उनके वंश[d] को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘देख’ की आज्ञा एकवचन में है; पूरे इस्राएल को एक समुदाय मानकर संबोधित किया गया है। इसका अनुवाद ‘ध्यान दो’ भी किया जा सकता है।
    reason: व्याकरणिक और शाब्दिक विकल्प
  - marker: b
    text: इस इब्रानी क्रिया का अर्थ ‘अधिकार में लेना,’ ‘कब्ज़े में लेना,’ या ‘विरासत में पाना’ भी हो सकता है।
    reason: शाब्दिक विकल्प
  - marker: c
    text: शाब्दिक रूप से ‘तुम्हारे पिताओं’; यहाँ इससे विशेष रूप से अब्राहम, इसहाक और याकूब अभिप्रेत हैं।
    reason: मूल की लिंग-सूचना और संदर्भ
  - marker: d
    text: शाब्दिक रूप से ‘उनके बाद उनके बीज’; ‘बीज’ यहाँ सामूहिक अर्थ में उनकी संतान या वंश को दर्शाता है।
    reason: शाब्दिक विकल्प
lexical_decisions:
- source_word: רְאֵה
  choice: देखो
  rationale: यह एकवचन आज्ञार्थक रूप है, जो सामूहिक रूप से इस्राएल का ध्यान खींचता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है; एकवचन की विशेषता पाद-टिप्पणी में स्पष्ट की गई है।
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: मैंने ... तुम्हारे सामने रख दिया है
  rationale: נתן का मूल अर्थ ‘देना’ है, पर לִפְנֵי के साथ यहाँ देश को लोगों के सामने उपलब्ध कराने का भाव है। पूर्ण वर्तमान परिणाम को ‘रख दिया है’ व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: यह देश / उस देश
  rationale: संदर्भ में אֶרֶץ प्रतिज्ञात भूभाग को सूचित करता है। हिन्दी में ‘देश’ स्वाभाविक है और निकटवर्ती संकेत के साथ निश्चित संदर्भ बनाए रखता है।
- source_word: בֹּאוּ
  choice: जाओ
  rationale: बहुवचन आज्ञा लोगों को देश की ओर बढ़ने के लिए कहती है। वक्ता और श्रोताओं की स्थिति के अनुसार हिन्दी में ‘जाओ’ स्वाभाविक दिशात्मक अभिव्यक्ति है।
- source_word: וּרְשׁוּ
  choice: अधिकार कर लो
  rationale: ירשׁ यहाँ सक्रिय रूप से देश को अपने अधिकार में लेने का भाव देता है; इसमें प्राप्त विरासत का अर्थ भी संभव है, जिसे पाद-टिप्पणी सुरक्षित रखती है।
- source_word: נִשְׁבַּע יְהוָה
  choice: याहवे ने ... देने की शपथ खाई थी
  rationale: ईश्वरीय नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है। पूर्वकालिक प्रतिज्ञा के लिए ‘शपथ खाई थी’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לַאֲבֹתֵיכֶם
  choice: तुम्हारे पूर्वजों
  rationale: तत्काल आगे अब्राहम, इसहाक और याकूब नामित हैं। ‘पूर्वज’ आधुनिक पाठक के लिए ‘पितरों’ से अधिक सहज है, जबकि मूल के शाब्दिक पुरुषवाची रूप को पाद-टिप्पणी में बताया गया है।
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: अब्राहम, इसहाक और याकूब
  rationale: तीनों नाम प्रतिज्ञा के विशिष्ट प्राप्तकर्ताओं के रूप में स्पष्ट रखे गए हैं। हिन्दी वाक्य-विन्यास में प्रत्येक नाम से पहले ‘को’ दोहराना अनावश्यक और असहज होता।
- source_word: לָתֵת לָהֶם וּלְזַרְעָם אַחֲרֵיהֶם
  choice: उनको और उनके बाद उनके वंश को देने
  rationale: זֶרַע सामूहिक एकवचन है। ‘वंश’ उसकी सामूहिकता और पीढ़ीगत निरंतरता बनाए रखता है; ‘बीज’ आधुनिक हिन्दी में इस अर्थ में अस्पष्ट होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और नाम को किसी उपाधि में नहीं बदलता।
- issue: אֲבֹתֵיכֶם का लिंग और संबंध
  choice: तुम्हारे पूर्वजों
  alternative: तुम्हारे पितरों
  rationale: मूल शब्द का शाब्दिक अर्थ ‘तुम्हारे पिता’ है और अगले पदांश में तीन पुरुष पूर्वजों के नाम इसे विशिष्ट बनाते हैं। मुख्य पाठ में सहज आधुनिक हिन्दी चुनी गई है, और पुरुषवाची शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- issue: ירשׁ में अधिकार और विरासत का संबंध
  choice: अधिकार कर लो
  alternative: विरासत में लो / अपने अधिकार में ले लो
  rationale: इस प्रसंग में आज्ञा सक्रिय प्रवेश और अधिकार ग्रहण करने की है, पर क्रिया में विरासत पाने का अर्थ भी हो सकता है; इसलिए वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पितरों’ जैसे अपेक्षाकृत धार्मिक-पारिभाषिक शब्द के स्थान पर ‘पूर्वजों’ का प्रयोग किया गया है, जबकि मूल की सूक्ष्मता पाद-टिप्पणी में दी गई है। आज्ञाओं की सीधी शक्ति तथा प्रतिज्ञा और अधिकार-ग्रहण के बीच का तनाव बनाए रखा गया है।
