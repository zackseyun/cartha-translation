  text: Yet in this matter you did not believe in Yahweh your God[a].
translation:
  language: hi
  text: फिर भी इस मामले में तुम अपने परमेश्वर यहोवा पर विश्वास नहीं करते थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने परमेश्वर यहोवा पर भरोसा नहीं करते थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/דָּבָר הַ/זֶּה
  choice: फिर भी इस मामले में
  rationale: דָּבָר यहाँ किसी कथन के बजाय अभी वर्णित घटना या विषय को दर्शाता है। प्रसंग में וּ हल्का विरोध सूचित करता है, इसलिए स्वाभाविक हिन्दी में ‘फिर भी’ उपयुक्त है।
- source_word: אֵינְ/כֶם מַאֲמִינִם
  choice: तुम ... विश्वास नहीं करते थे
  rationale: निषेध के साथ हिफ़ील कृदंत उस समय लोगों की बनी हुई अविश्वासी मनोदशा को व्यक्त करता है; हिन्दी का अपूर्ण भूतकाल इस निरंतर रुख को स्वाभाविक ढंग से रखता है।
- source_word: בַּ/יהוָה
  choice: यहोवा पर
  rationale: אמן के साथ ב विश्वास या भरोसे के व्यक्ति को चिह्नित करता है। ‘पर विश्वास करना’ मूल संरचना और प्रसंगगत अर्थ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है। परमेश्वर के व्यक्तिगत नाम को ‘यहोवा’ रखा गया है।
- source_word: אֱלֹהֵי/כֶם
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय का संबंध ‘अपने परमेश्वर’ से स्वाभाविक हिन्दी में स्पष्ट होता है और वाचा-संबंधी बल बना रहता है।
theological_decisions:
- issue: אמן + ב का अर्थ
  choice: अपने परमेश्वर यहोवा पर विश्वास नहीं करते थे
  alternative: अपने परमेश्वर यहोवा पर भरोसा नहीं करते थे
  rationale: इब्रानी प्रयोग में विश्वास और भरोसा दोनों भाव संभव हैं। मुख्य पाठ में ‘विश्वास’ मूल धातु के सामान्य अर्थ को बनाए रखता है, जबकि पादटिप्पणी में ‘भरोसा’ इस प्रसंग के संबंधपरक भाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फिर भी’ मूसा की फटकार का विरोधात्मक बल देता है, और ‘करते थे’ लोगों की उस समय जारी मनोदशा को व्यक्त करता है।
