source:
  edition: WLC
  text: יְהוָ֞ה אֱלֹהֵ֣י אֲבֽוֹתֵ/כֶ֗ם יֹסֵ֧ף עֲלֵי/כֶ֛ם כָּ/כֶ֖ם אֶ֣לֶף פְּעָמִ֑ים וִ/יבָרֵ֣ךְ אֶתְ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/011.yaml
  text: May Yahweh[a], the God of your fathers, make you a thousand times as many as you are, and bless you[b], just as he has promised you.
translation:
  language: hi
  text: याहवे, तुम्हारे पितरों[a] का परमेश्वर, तुम्हारी संख्या को तुम्हारी वर्तमान संख्या से हजार गुना बढ़ाए और तुम्हें आशीष दे, जैसा उसने तुमसे कहा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पूर्वजों।’ इब्रानी में शाब्दिक रूप से ‘पितरों’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जैसा उसने तुमसे प्रतिज्ञा की है।’ इब्रानी में शाब्दिक रूप से ‘जैसा उसने तुमसे कहा है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में निकट ध्वन्यात्मक रूप में रखा गया है।
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: तुम्हारे पितरों का परमेश्वर
  rationale: यह रचना शाब्दिक रूप से ‘तुम्हारे पितरों का परमेश्वर’ है और इस्राएल के कुलपिताओं से वाचागत संबंध को सुरक्षित रखती है।
- source_word: יֹסֵף עֲלֵיכֶם כָּכֶם אֶלֶף פְּעָמִים
  choice: तुम्हें, तुम अभी जितने हो उससे हजार गुना बढ़ाए
  rationale: इच्छा अथवा आशीर्वाद व्यक्त करने वाले क्रियारूप और वर्तमान जनसंख्या के हजार गुना होने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וִיבָרֵךְ אֶתְכֶם
  choice: और तुम्हें आशीष दे
  rationale: संयोजित क्रिया पहले व्यक्त आशीर्वाद की कामना को आगे बढ़ाती है।
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: जैसा उसने तुमसे कहा है
  rationale: דבר के व्यापक मूल अर्थ ‘कहना/बोलना’ को बनाए रखा गया है; ‘प्रतिज्ञा की’ संदर्भतः संभव है, पर अधिक व्याख्यात्मक है।
theological_decisions:
- issue: वाचागत नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है; इसलिए उसे किसी उपाधि से नहीं बदला गया।
- issue: אֲבֹתֵיכֶם में पूर्वज-संबंधी भाषा
  choice: तुम्हारे पितरों
  alternative: तुम्हारे पूर्वजों
  rationale: मूल का पुल्लिंग और कुलपिताओं से जुड़ा ऐतिहासिक-वाचागत मुहावरा सुरक्षित रखा गया है, जबकि व्यापक अर्थ को पादटिप्पणी में बताया गया है।
- issue: דִּבֶּר का संदर्भगत अर्थ
  choice: कहा है
  alternative: प्रतिज्ञा की है
  rationale: मूल क्रिया स्वयं सामान्यतः ‘कहना/बोलना’ है। प्रसंग में प्रतिज्ञा का भाव संभव है, लेकिन मुख्य पाठ में उसे अनिवार्य नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुम अभी जितने हो उससे हजार गुना’ मूल तुलना को स्पष्ट करता है; ‘पितरों’ और ‘कहा है’ मूल की शब्दावली तथा उसकी अर्थगत खुलावट बनाए रखते हैं।
