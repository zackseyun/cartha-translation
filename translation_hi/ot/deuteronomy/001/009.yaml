  text: And I said to you at that time, saying, ‘I am not able to bear you by myself.’
translation:
  language: hi
  text: उस समय मैंने तुमसे यह कहा था, “मैं अकेला तुम लोगों का भार नहीं उठा सकता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵאמֹר
  choice: यह कहा था
  rationale: इब्रानी के ‘कहते हुए/यह कहते हुए’ को हिन्दी में अनावश्यक पुनरुक्ति से बचाते हुए ‘यह कहा था’ द्वारा स्पष्ट और स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: לְבַדִּי
  choice: मैं अकेला
  rationale: वक्ता द्वारा बिना दूसरों की सहायता के कार्य करने की असमर्थता को सीधे व्यक्त करता है।
- source_word: שְׂאֵת אֶתְכֶם
  choice: तुम लोगों का भार ... उठा सकता
  rationale: मूल क्रिया का अर्थ ‘उठाना/ढोना/वहन करना’ है; प्रसंग में समुदाय की अगुवाई और उसकी जिम्मेदारियाँ उठाने का रूपक हिन्दी में ‘भार उठाना’ से सुरक्षित रहता है।
