  text: וּ/בַ/מִּדְבָּר֙ אֲשֶׁ֣ר רָאִ֔יתָ אֲשֶׁ֤ר נְשָׂאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֥ר יִשָּׂא אִ֖ישׁ אֶת בְּנ֑/וֹ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הֲלַכְתֶּ֔ם עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/031.yaml
  text: and in the wilderness[a], where you saw that Yahweh your God carried you, just as a man carries his son[b], all along the way that you traveled until you came to this place.
translation:
  language: hi
  text: और जंगल[a] में भी, जहाँ तुमने देखा कि तुम्हारे परमेश्वर याहवे ने तुम्हें उस पूरे मार्ग में उठाकर ले चला, जिस पर चलते हुए तुम इस स्थान तक आए—जैसे कोई पुरुष अपने बेटे[b] को उठाकर ले चलता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रेगिस्तान’ अथवा ‘निर्जन प्रदेश’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘जैसे कोई पुरुष अपने बेटे को उठाकर ले चलता है’; इसे अधिक सामान्य रूप में ‘जैसे कोई व्यक्ति किसी बच्चे को उठाकर ले चलता है’ भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמִּדְבָּר
  choice: और जंगल में
  rationale: מִדְבָּר यहाँ इस्राएल के निर्जन, अनबसे यात्रा-क्षेत्र को दर्शाता है। ‘जंगल’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है; ‘रेगिस्तान’ सम्भव विकल्प है।
- source_word: אֲשֶׁר רָאִיתָ
  choice: तुमने देखा कि
  rationale: इब्रानी सम्बन्धवाचक रचना को सहज हिन्दी कथन में बदला गया है; इससे प्रत्यक्ष अनुभव पर बल बना रहता है।
- source_word: נְשָׂאֲךָ
  choice: तुम्हें ... उठाए रखा
  rationale: נשא का मूल अर्थ उठाना/ढोना है। निरन्तर यात्रा के प्रसंग और आगे आने वाली उपमा के कारण ‘उठाए रखा’ लगातार संरक्षण और वहन दोनों को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यन्तरण में रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: वाचा-संबंधी सम्बोधन का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: כַּאֲשֶׁר יִשָּׂא אִישׁ אֶת־בְּנוֹ
  choice: जैसे कोई पुरुष अपने बेटे को उठाए रखता है
  rationale: אִישׁ और בְּנוֹ की स्पष्ट पुरुषवाचक छवि सुरक्षित रखी गई है; ‘पिता’ कहना मूल से अधिक विशिष्ट होता।
- source_word: בְּכָל־הַדֶּרֶךְ
  choice: उस पूरे मार्ग पर
  rationale: पूरी यात्रा के दौरान परमेश्वर के निरन्तर वहन को व्यक्त करता है।
- source_word: אֲשֶׁר הֲלַכְתֶּם ... עַד־הַמָּקוֹם הַזֶּה
  choice: जिस पर तुम चलते हुए इस स्थान तक आए
  rationale: הלך को यात्रा के प्रसंग में ‘चलते हुए’ और गन्तव्य-वाक्यांश को ‘इस स्थान तक आए’ कहना आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यन्तरण है और उसे केवल उपाधि में नहीं बदलता।
- issue: उपमा की पुरुषवाचक पारिवारिक छवि
  choice: कोई पुरुष अपने बेटे को
  alternative: कोई व्यक्ति अपने बच्चे को / कोई पिता अपने बेटे को
  rationale: मूल में ‘पुरुष’ और ‘उसका बेटा’ स्पष्ट हैं। इन्हें लिंग-निरपेक्ष नहीं किया गया, और ‘पुरुष’ को ‘पिता’ बनाकर अर्थ को अनावश्यक रूप से अधिक निश्चित भी नहीं किया गया।
- issue: परमेश्वर द्वारा उठाए रखने की छवि
  choice: उठाए रखा
  alternative: सम्भाला / ढोया
  rationale: वहन की मूर्त उपमा को बनाए रखा गया है, ताकि संरक्षण का अर्थ मूल चित्र के भीतर से उभरे, उसके स्थान पर व्याख्यात्मक शब्द न रख दिया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘उठाए रखा’ और ‘उस पूरे मार्ग पर’ मिलकर पूरी यात्रा के दौरान निरन्तर वहन का भाव देते हैं। ‘तुम’ सामूहिक इस्राएल के सम्बोधन के रूप में प्रयुक्त है और हिन्दी में एकवचन-सामूहिक तथा बहुवचन के बीच मूल पाठ के हल्के बदलाव को अनावश्यक रूप से कठोर नहीं बनाता।
