base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/001.yaml
  text: These are the words that Moses spoke to all Israel beyond the Jordan[a], in the wilderness, in the Arabah opposite Suph, between Paran, Tophel, Laban, Hazeroth[d][c][b], and Dizahab.
translation:
  language: hi
  text: ये वे वचन हैं जो मूसा ने यरदन के पार[a], निर्जन प्रदेश में, अराबा[b] में, सूफ़[c] के सामने, पारान और तोफ़ेल, लाबान, हसेरोत और दीज़ाहाब के बीच समस्त इस्राएल से बोले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “यरदन के उस पार” भी किया जा सकता है। इब्रानी अभिव्यक्ति का अर्थ भौगोलिक दृष्टिकोण के अनुसार समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: “अराबा” दरार-घाटी अथवा मैदानी क्षेत्र का भौगोलिक नाम है; परंपरागत रूप से इसका अनुवाद “मैदान” भी किया गया है।
    reason: cultural_note
  - marker: c
    text: इब्रानी में “सूफ़” है। कुछ इसे स्थान-नाम मानते हैं और कुछ इसे “सरकंडों के समुद्र” से जोड़ते हैं, पर यहाँ “समुद्र” शब्द नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: ये वे वचन हैं
  rationale: आरंभिक प्रस्तुतिकरण की शक्ति को स्वाभाविक हिन्दी में बनाए रखता है। דְּבָרִים यहाँ मूसा के बोले हुए संदेश को दर्शाता है, इसलिए ‘वचन’ उपयुक्त है।
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה אֶל כָּל יִשְׂרָאֵל
  choice: जो मूसा ने ... समस्त इस्राएल से कहे
  rationale: हिन्दी में किसी समुदाय को संबोधित करके बोलने के लिए ‘से कहे’ स्वाभाविक है; ‘समस्त इस्राएल’ כָּל की समग्रता को व्यक्त करता है।
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार
  rationale: यह भौगोलिक अभिव्यक्ति स्रोत में दृष्टिकोण को पूर्णतः निश्चित नहीं करती; ‘के पार’ वही लचीलापन बनाए रखता है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר आवश्यक रूप से रेतीला मरुस्थल नहीं, बल्कि कम आबादी वाला वन्य/निर्जन क्षेत्र है। ‘निर्जन प्रदेश’ आधुनिक हिन्दी में इस अर्थ को स्पष्ट करता है।
- source_word: בָּעֲרָבָה
  choice: अराबा में
  rationale: यह सामान्य ‘मैदान’ से अधिक एक विशिष्ट भौगोलिक क्षेत्र का संकेत दे सकता है, इसलिए नाम का लिप्यंतरण रखा गया है।
- source_word: מוֹל סוּף
  choice: सूफ़ के सामने
  rationale: מוֹל का अर्थ ‘सामने/सम्मुख’ है। סוּף को स्थान-नाम माना गया है; पाठ में ‘समुद्र’ शब्द नहीं जोड़ा गया।
- source_word: בֵּין פָּארָן וּבֵין תֹּפֶל וְלָבָן וַחֲצֵרֹת וְדִי זָהָב
  choice: पारान, तोफ़ेल, लाबान, हसेरोत और दीज़ाहाब के बीच
  rationale: सभी स्थान-नाम सुरक्षित रखते हुए हिन्दी में स्वाभाविक सूची बनाई गई है। ‘के बीच’ स्रोत के בֵּין को व्यक्त करता है।
- source_word: דִי זָהָב
  choice: दीज़ाहाब
  rationale: इसे शाब्दिक रूप से ‘बहुत सोना’ न करके स्थान-नाम के रूप में लिप्यंतरित किया गया है।
