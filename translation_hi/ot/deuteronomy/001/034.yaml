base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/034.yaml
  text: And Yahweh heard the sound of your words[a], and he was angry and swore, saying,
translation:
  language: hi
  text: और याहवे ने तुम्हारी बातों का स्वर[a] सुना; वह क्रोधित हुआ और उसने शपथ खाकर कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे शब्दों की आवाज़।”
    reason: इब्रानी קוֹל דִּבְרֵיכֶם की असामान्य किंतु अर्थपूर्ण अभिव्यक्ति को स्पष्ट करता है।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ का प्रयोग किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: וַיִּשְׁמַע
  choice: सुनी
  rationale: इस कथात्मक प्रसंग में שׁמע का सीधा अर्थ ‘सुनना’ है; यहाँ ‘ध्यान दिया’ कहने से मूल से अधिक ग्रहणशीलता का भाव आ सकता है।
- source_word: אֶת קוֹל דִּבְרֵיכֶם
  choice: तुम्हारी बातों की आवाज़
  rationale: यह अनुवाद קוֹל (‘आवाज़/ध्वनि’) और דִּבְרֵיכֶם (‘तुम्हारी बातें/वचन’) दोनों को व्यक्त करता है और इब्रानी अभिव्यक्ति की मूर्तता बनाए रखता है।
- source_word: וַיִּקְצֹף
  choice: वह क्रोधित हुआ
  rationale: קצף तीव्र अप्रसन्नता या क्रोध व्यक्त करता है; ‘क्रोधित हुआ’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: וַיִּשָּׁבַע
  choice: उसने शपथ खाकर
  rationale: שׁבע के निफ़अल रूप का अर्थ ‘शपथ खाना’ है; अगली पंक्ति में शपथ की विषयवस्तु आने के कारण यह स्वाभाविक है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: प्रत्यक्ष कथन का परिचय देने वाले לֵאמֹר को हिन्दी में ‘कहा’ से स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों के लिए सुस्थापित रूप ‘यहोवा’ नाम को उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है; ‘याहवे’ अधिक ध्वन्यात्मक विकल्प है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘बातों की आवाज़’ जानबूझकर कुछ हद तक मूलनिष्ठ रखा गया है, और पादटिप्पणी में अधिक शाब्दिक रूप दिया गया है।
