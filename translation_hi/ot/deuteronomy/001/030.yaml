base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/030.yaml
  text: Yahweh your God[a], who goes before you, will himself fight for you, just as he did for you in Egypt before your eyes.
translation:
  language: hi
  text: याहवे, तुम्हारा परमेश्वर, जो तुम्हारे आगे-आगे चलता है, वही तुम्हारे लिए लड़ेगा, ठीक वैसे ही जैसे उसने मिस्र में तुम्हारी आँखों के सामने तुम्हारे लिए किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “तुम्हारे साथ किया।” यहाँ यह वाक्यांश मिस्र में इस्राएल की ओर से याहवे के किए हुए कार्यों की ओर संकेत करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर याहवे
  rationale: व्यक्तिगत दिव्य नाम יְהוָה को ‘याहवे’ के रूप में रखा गया है और אֱלֹהֵיכֶם का एकवचन अर्थ ‘तुम्हारा परमेश्वर’ है। हिंदी में यह क्रम स्वाभाविक है और नाम तथा उपाधि दोनों को स्पष्ट रखता है।
- source_word: הַהֹלֵךְ לִפְנֵיכֶם
  choice: जो तुम्हारे आगे-आगे चलता है
  rationale: कृदंत निरंतर अथवा विशिष्ट कार्य को व्यक्त करता है। ‘आगे-आगे चलता है’ दिव्य अगुवाई का भाव सहज आधुनिक हिंदी में देता है।
- source_word: הוּא
  choice: वही
  rationale: स्वतंत्र सर्वनाम का बल सुरक्षित रखते हुए ‘वही’ स्पष्ट करता है कि स्वयं याहवे उनके लिए लड़ेंगे।
- source_word: יִלָּחֵם לָכֶם
  choice: तुम्हारे लिए लड़ेगा
  rationale: לחם का निफ़अल रूप यहाँ किसी की ओर से युद्ध करने का अर्थ देता है; ‘तुम्हारे लिए लड़ेगा’ सीधा और स्वाभाविक अनुवाद है।
- source_word: כְּכֹל אֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह पदबंध पहले किए गए दिव्य कार्य से तुलना प्रस्तुत करता है; चुना हुआ रूप तुलना और उसके बल दोनों को व्यक्त करता है।
- source_word: עָשָׂה אִתְּכֶם
  choice: तुम्हारे लिए किया था
  rationale: शाब्दिक ‘तुम्हारे साथ किया’ हिंदी में अस्पष्ट या नकारात्मक सुनाई दे सकता है। प्रसंग मिस्र में इस्राएल की ओर से किए गए कार्यों का है, इसलिए मुख्य पाठ में ‘तुम्हारे लिए’ रखा गया और शाब्दिक रूप पादटिप्पणी में सुरक्षित किया गया है।
- source_word: בְּמִצְרַיִם לְעֵינֵיכֶם
  choice: मिस्र में तुम्हारी आँखों के सामने
  rationale: स्थान और प्रत्यक्ष साक्षी होने के इब्रानी मुहावरे दोनों को स्पष्ट तथा निकट रूप में व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसका प्रचलित ध्वन्यंतरण है और किसी उपाधि से नाम को प्रतिस्थापित नहीं करता।
- issue: इस्राएल की ओर से परमेश्वर के युद्ध करने पर הוּא का बल
  choice: वही तुम्हारे लिए लड़ेगा
  alternative: वह तुम्हारे लिए लड़ेगा; वह स्वयं तुम्हारे लिए लड़ेगा
  rationale: ‘वही’ स्वतंत्र सर्वनाम के जोर को संक्षेप और स्वाभाविक हिंदी में बनाए रखता है, बिना यह व्याख्या जोड़े कि परमेश्वर किस साधन से लड़ेंगे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन संबोधन को ‘तुम्हारा/तुम्हारे’ से लगातार व्यक्त किया गया है; ‘आगे-आगे’ अगुवाई का सजीव भाव देता है और ‘वही’ मूल सर्वनाम का जोर बनाए रखता है।
