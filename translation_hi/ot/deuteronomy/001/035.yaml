  text: Not one man among these men of this evil generation shall see the good land that I swore to give to your fathers—[a]
translation:
  language: hi
  text: इस बुरी पीढ़ी के इन पुरुषों में से एक भी उस अच्छे देश को नहीं देखेगा, जिसे तुम्हारे पुरखाओं को देने की मैंने शपथ खाई थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे पूर्वजों को।” इब्रानी में “तुम्हारे पिताओं को।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: एक भी ... नहीं देखेगा
  rationale: यहाँ אִם साधारण शर्त नहीं, बल्कि शपथ-सूचक निषेध का भाग है; हिंदी में emphatic negative को स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: יִרְאֶה
  choice: देखेगा
  rationale: मूल अर्थ ‘देखना’ है; प्रसंग में देश में प्रवेश करने और उसका अनुभव करने से वंचित रहना निहित है, पर उसे पाठ में विस्तार से नहीं जोड़ा गया।
- source_word: אִישׁ בָּאֲנָשִׁים הָאֵלֶּה
  choice: इन पुरुषों में से एक भी
  rationale: एकवचन אִישׁ और अंशवाचक בָּאֲנָשִׁים का बल बनाए रखते हुए यह वाक्यांश प्रत्येक पुरुष के निषेध को स्पष्ट करता है।
- source_word: הַדּוֹר הָרָע הַזֶּה
  choice: इस बुरी पीढ़ी
  rationale: רַע का यहाँ नैतिक नकारात्मक अर्थ है। ‘बुरी पीढ़ी’ आधुनिक हिंदी में सहज और स्पष्ट है।
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: उस अच्छे देश
  rationale: ‘अच्छा देश’ मूल के निकट है; ‘उस’ हिंदी में निर्दिष्ट प्रतिज्ञात देश को स्वाभाविक ढंग से इंगित करता है।
- source_word: נִשְׁבַּעְתִּי
  choice: मैंने शपथ खाई थी
  rationale: निफ़अल रूप का शपथ लेने वाला अर्थ स्पष्ट करता है; पूर्णभूत ‘थी’ पूर्व में की गई प्रतिज्ञा को हिंदी में स्वाभाविक बनाता है।
- source_word: לָתֵת
  choice: देने
  rationale: נתן का सीधा और सामान्य अर्थ सुरक्षित रखा गया है।
- source_word: לַאֲבֹתֵיכֶם
  choice: तुम्हारे पुरखाओं को
  rationale: אָבוֹת का यहाँ पितृपूर्वजों से संबंध है। ‘पुरखा’ आधुनिक हिंदी में पूर्वज पुरुषों का स्वाभाविक और स्रोत-संगत संकेत देता है।
theological_decisions:
- issue: לַאֲבֹתֵיכֶם का अनुवाद
  choice: तुम्हारे पुरखाओं को
  alternative: तुम्हारे पूर्वजों को / तुम्हारे पितरों को
  rationale: मूल शब्द पुल्लिंग बहुवचन ‘पिताओं’ का है और इस संदर्भ में इस्राएल के पितृपूर्वजों को सूचित करता है। ‘पुरखा’ इस लिंग-संदर्भ को बनाए रखते हुए सामान्य आधुनिक पाठक के लिए ‘पितरों’ से अधिक सहज है; व्यापक अर्थ पादटिप्पणी में दिया गया है।
- issue: ‘देखेगा’ का प्रसंगगत आशय
  choice: मूल क्रिया ‘देखेगा’ को बनाए रखना
  alternative: उस देश में प्रवेश करेगा / उसे पाएगा
  rationale: प्रसंग में देश में प्रवेश और उसका उपभोग न करना निहित है, किंतु मूल पाठ केवल ‘देखना’ कहता है। अनुवाद उस अर्थगत तनाव को विस्तार द्वारा समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सहज रखी गई है। ‘पुरखा’ स्रोत के पुल्लिंग पितृपूर्वज-संदर्भ को बनाए रखता है, जबकि पादटिप्पणी व्यापक विकल्प स्पष्ट करती है।
