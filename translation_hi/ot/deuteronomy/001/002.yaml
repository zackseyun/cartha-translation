  yaml_path: translation/ot/deuteronomy/001/002.yaml
  text: It is eleven days from Horeb by the way of Mount Seir to Kadesh-barnea[a][b].
translation:
  language: hi
  text: होरेब से सेईर पर्वत के मार्ग से कादेश-बर्नेआ तक ग्यारह दिन की यात्रा है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘ग्यारह दिन’। इब्रानी मुहावरा इस मार्ग से होरेब और कादेश-बर्नेआ के बीच की यात्रा में लगने वाला समय बताता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ इब्रानी पाठ में ‘होरेब’ नाम है; इसे प्रायः सीनै से संबद्ध माना जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַד עָשָׂר יוֹם
  choice: ग्यारह दिन की यात्रा
  rationale: इब्रानी पदबंध शाब्दिक रूप से ‘ग्यारह दिन’ कहता है, पर यहाँ मार्ग की दूरी को यात्रा में लगने वाले समय से व्यक्त करता है। हिंदी में ‘ग्यारह दिन की यात्रा’ इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: מֵחֹרֵב
  choice: होरेब से
  rationale: חֹרֵב स्थान-नाम ‘होरेब’ है; मूल पाठ में ‘सीनै’ नहीं है, इसलिए उसी नाम का लिप्यंतरण रखा गया है।
- source_word: דֶּרֶךְ
  choice: के मार्ग से
  rationale: דֶּרֶךְ का अर्थ ‘मार्ग/रास्ता’ है और यहाँ सेईर पर्वत से होकर जाने वाले यात्रा-मार्ग को सूचित करता है।
- source_word: הַר שֵׂעִיר
  choice: सेईर पर्वत
  rationale: הַר שֵׂעִיר का संक्षिप्त, प्रचलित भौगोलिक रूप ‘सेईर पर्वत’ है; הַר पहाड़ या पर्वतीय क्षेत्र भी सूचित कर सकता है।
- source_word: עַד
  choice: तक
  rationale: भौगोलिक संदर्भ में עַד मार्ग के अंतिम स्थान को दर्शाता है; हिंदी में ‘तक’ स्वाभाविक है।
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: कादेश-बर्नेआ
  rationale: यह संयुक्त स्थान-नाम है; स्पष्टता और परंपरागत पहचान के लिए लिप्यंतरण तथा योजक-चिह्न रखा गया है।
