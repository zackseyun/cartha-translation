  yaml_path: translation/ot/deuteronomy/001/018.yaml
  text: And at that time I commanded you all the things that you should do[a].
translation:
  language: hi
  text: और उस समय मैंने तुम्हें वे सभी काम[a] करने की आज्ञा दी जो तुम्हें करने थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे सभी बातें,” “वे सभी मामले,” अथवा “वे सभी वचन”; इब्रानी शब्द דְּבָרִים बोली गई शिक्षाओं तथा किए जाने वाले मामलों या कामों—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: मैंने…आज्ञा दी
  rationale: צוה अधिकारपूर्वक आदेश देने या निर्देश देने को व्यक्त करता है। ‘आज्ञा दी’ उसके अधिकारपूर्ण भाव को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: אֶתְכֶם
  choice: तुम्हें
  rationale: यह द्वितीय पुरुष बहुवचन है। इस प्रसंग में ‘तुम्हें’ इस्राएल समुदाय को सामूहिक रूप से संबोधित करता है और हिन्दी में स्वाभाविक है।
- source_word: בָּעֵת הַהִוא
  choice: उस समय
  rationale: यह सामान्य कालवाचक पदबंध है; ‘उस समय’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: אֵת כָּל הַדְּבָרִים
  choice: वे सभी काम
  rationale: דְּבָרִים का अर्थ ‘वचन’, ‘बातें’, ‘मामले’ या प्रसंगानुसार किए जाने वाले ‘काम’ हो सकता है। यहाँ תַּעֲשׂוּן के साथ ‘काम’ व्यावहारिक आशय को सहज रूप से व्यक्त करता है, जबकि पादटिप्पणी मूल की व्यापकता सुरक्षित रखती है।
- source_word: אֲשֶׁר תַּעֲשׂוּן
  choice: जो तुम्हें करने थे
  rationale: עשה का अपूर्ण रूप आज्ञा के बाद अपेक्षित अथवा बाध्यकारी कार्य को दर्शाता है। ‘करने थे’ इस निर्देशात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे अनावश्यक रूप से अधिक कठोर बनाए।
