  text: וַ/תֵּרָגְנ֤וּ בְ/אָהֳלֵי/כֶם֙ וַ/תֹּ֣אמְר֔וּ בְּ/שִׂנְאַ֤ת יְהוָה֙ אֹתָ֔/נוּ הוֹצִיאָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַשְׁמִידֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/027.yaml
  text: And you grumbled in your tents and said[a], ‘Because Yahweh hates us, he brought us out of the land of Egypt to give us into the hand of the Amorites[b], to destroy us.’
translation:
  language: hi
  text: तुम अपने तंबुओं में कुड़कुड़ाने लगे और बोले, “याहवे हमसे घृणा करता है[a], इसीलिए वह हमें मिस्र देश से निकाल लाया कि हमें एमोरियों के हाथ में सौंपकर हमारा नाश करवाए[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे की हमसे घृणा के कारण।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हमें एमोरियों के हाथ में सौंपने के लिए”; अर्थात उनके अधिकार में सौंपने के लिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרָגְנוּ
  choice: तुम ... कुड़कुड़ाए
  rationale: रגן असंतोष में धीमे स्वर से शिकायत करने का भाव देता है। ‘कुड़कुड़ाए’ आधुनिक और स्वाभाविक हिंदी में इस नकारात्मक भाव को व्यक्त करता है।
- source_word: בְאָהֳלֵיכֶם
  choice: अपने तंबुओं में
  rationale: यह सीधा स्थानवाचक पद है; ‘तंबुओं’ से जंगल-यात्रा का ठोस परिवेश बना रहता है।
- source_word: בְּשִׂנְאַת יְהוָה אֹתָנוּ
  choice: याहवे हमसे घृणा करता है, इसीलिए
  rationale: शाब्दिक रचना ‘याहवे की हमसे घृणा में’ है, पर यहाँ בְּ के साथ भाववाचक संज्ञा कारण बताती है। हिंदी में आरोप को स्वाभाविक रूप से स्पष्ट किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: הוֹצִיאָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: वह हमें मिस्र देश से निकाल लाया
  rationale: यह निर्गमन की क्रिया और ‘मिस्र देश’ दोनों को स्पष्ट, स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: हमें एमोरियों के हाथ में सौंप दे
  rationale: ‘किसी के हाथ में देना’ उसके अधिकार में सौंपने का हिब्रू मुहावरा है; हिंदी में ‘हाथ में सौंप दे’ अर्थ और बिंब दोनों बनाए रखता है।
- source_word: הָאֱמֹרִי
  choice: एमोरियों
  rationale: हिब्रू में रूप एकवचन है, किंतु यहाँ जाति के लिए सामूहिक अर्थ में प्रयुक्त हुआ है; हिंदी बहुवचन स्वाभाविक है।
- source_word: לְהַשְׁמִידֵנוּ
  choice: हमारा नाश कर दे
  rationale: हिफ़िल रूप पूर्ण विनाश कराने का प्रबल भाव रखता है। ‘हमारा नाश कर दे’ सशक्त, प्रतिष्ठित और सहज हिंदी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: याहवे की घृणा संबंधी कथन
  choice: इस्राएलियों के आरोप के रूप में सीधा कथन
  alternative: याहवे की हमसे घृणा के कारण
  rationale: पद लोगों की शिकायत उद्धृत करता है, कथन की सत्यता पर कथावाचक की मुहर नहीं लगाता। प्रत्यक्ष वचन इस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सहज किंतु गरिमापूर्ण रखी गई है। ‘कुड़कुड़ाए’ दबे स्वर की असंतुष्ट शिकायत व्यक्त करता है, जबकि ‘नाश’ पद की गंभीरता बनाए रखता है। उद्धरण-चिह्नों से स्पष्ट है कि घृणा का दावा लोगों का आरोप है।
