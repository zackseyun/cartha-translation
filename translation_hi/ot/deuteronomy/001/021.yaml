id: DEU.1.21
reference: Deuteronomy 1:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רְ֠אֵה נָתַ֨ן יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ אֶת הָ/אָ֑רֶץ עֲלֵ֣ה רֵ֗שׁ כַּ/אֲשֶׁר֩ דִּבֶּ֨ר יְהוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֨י/ךָ֙ לָ֔/ךְ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/021.yaml
  text: See[a], Yahweh your God has set the land before you. Go up, take possession, just as Yahweh, the God of your fathers, has spoken to you. Do not fear or be dismayed.
translation:
  language: hi
  text: देख, यहोवा, तेरे परमेश्वर ने देश को तेरे सामने रख दिया है। ऊपर जा और उस पर अधिकार कर, जैसा यहोवा, तेरे पितरों के परमेश्वर ने तुझसे कहा है। मत डर और विचलित मत हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאֵה
  choice: देख
  rationale: ראה का एकवचन आज्ञार्थक रूप ध्यान आकर्षित करता है। ‘देख’ सीधा, स्वाभाविक और स्रोत की संबोधन-शक्ति के अनुरूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल-परंपरा में परमेश्वर के वाचा-नाम के लिए प्रचलित और पहचाना जाने वाला लिप्यंतरण; इसे पदवी से नहीं बदला गया।
- source_word: אֱלֹהֶיךָ
  choice: तेरे परमेश्वर
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय को ‘तेरे’ से रखा गया है; पूरे पद का संबोधन इस्राएल से सामूहिक एकवचन में है।
- source_word: נָתַן ... לְפָנֶיךָ
  choice: तेरे सामने रख दिया है
  rationale: यह मुहावरा देश को प्रवेश और अधिकार के लिए सामने प्रस्तुत किए जाने को व्यक्त करता है; पूर्ण क्रिया के परिणामकारी भाव को ‘रख दिया है’ से दर्शाया गया है।
- source_word: הָאָרֶץ
  choice: यह देश
  rationale: संदर्भ में निश्चित भूमि अर्थात प्रतिज्ञात देश अभिप्रेत है। हिन्दी में भू-राजनीतिक और वाचागत संदर्भ के लिए ‘देश’ स्वाभाविक है; ‘यह’ उसकी संदर्भगत निश्चितता स्पष्ट करता है।
- source_word: עֲלֵה
  choice: ऊपर जा
  rationale: आज्ञार्थक क्रिया चढ़कर अथवा आगे बढ़कर देश में प्रवेश करने को कहती है। ‘ऊपर जा’ भौगोलिक दिशा और मूल क्रिया दोनों को बनाए रखता है।
- source_word: רֵשׁ
  choice: उस पर अधिकार कर
  rationale: ירשׁ यहाँ सक्रिय रूप से प्रवेश करके कब्जा/अधिकार ग्रहण करने का अर्थ देता है। ‘अधिकार कर’ दैवी देन और मानवीय कार्रवाई, दोनों के तनाव को बनाए रखता है।
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: जैसा ... ने ... कहा है
  rationale: דבר का मूल अर्थ ‘कहा/बोला’ है; ‘प्रतिज्ञा की’ अर्थगत रूप से संभव होने पर भी मूल में स्पष्ट नहीं, इसलिए उसे पाठ में नहीं जोड़ा गया।
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: तेरे पूर्वजों के परमेश्वर
  rationale: אָבוֹת का इस वाचा-सूत्र में आशय पिछली पितृ-पीढ़ियों से है। आधुनिक हिन्दी में ‘पूर्वजों’ अर्थ को स्वाभाविक और समावेशी ढंग से व्यक्त करता है, बिना किसी विशिष्ट कुलपुरुष तक अर्थ सीमित किए।
- source_word: אַל תִּירָא
  choice: मत डर
  rationale: सीधा निषेध; आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और प्रभावपूर्ण।
- source_word: וְאַל תֵּחָת
  choice: और हताश मत हो
  rationale: חתת यहाँ भीतर से टूटने, साहस खोने या भय से दब जाने का भाव देता है। ‘हताश मत हो’ पहले निषेध ‘मत डर’ से भेद भी रखता है और सहज हिन्दी है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा-नाम स्पष्ट रूप से उपस्थित है, इसलिए इसे ‘प्रभु’ जैसी पदवी से प्रतिस्थापित नहीं किया गया। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ को चुना गया।
- issue: אֱלֹהֵי אֲבֹתֶיךָ में वाचा-सूत्र
  choice: तेरे पूर्वजों के परमेश्वर
  alternative: तेरे पितरों के परमेश्वर
  rationale: ‘पितरों’ स्रोत के पुल्लिंग बहुवचन को अधिक रूपात्मक रूप से रखता है, पर आधुनिक सामान्य हिन्दी में यह कम सहज और कभी-कभी मृत पूर्वजों के धार्मिक अर्थ से जुड़ा सुनाई देता है। ‘पूर्वजों’ वाचा की पिछली पीढ़ियों का आशय स्पष्ट रखता है।
- issue: देश का दिया जाना और उस पर अधिकार करना
  choice: ‘सामने रख दिया है’ तथा ‘अधिकार कर’ दोनों बनाए रखे गए
  alternative: केवल ‘तुझे दे दिया है; जाकर ले ले’
  rationale: पद दैवी प्रदान और इस्राएल की आज्ञापालनपूर्ण कार्रवाई को साथ रखता है। अनुवाद ने किसी एक पक्ष को दूसरे में विलीन नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन निकट संबोधन (‘तेरे/तुझसे’) के साथ, क्योंकि सभी इब्रानी प्रत्यय और आज्ञाएँ द्वितीय पुरुष पुल्लिंग एकवचन हैं और इस्राएल को सामूहिक एकवचन के रूप में संबोधित करती हैं। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है।
