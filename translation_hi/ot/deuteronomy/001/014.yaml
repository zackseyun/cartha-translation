id: DEU.1.14
reference: Deuteronomy 1:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/תַּעֲנ֖וּ אֹתִ֑/י וַ/תֹּ֣אמְר֔וּ טֽוֹב הַ/דָּבָ֥ר אֲשֶׁר דִּבַּ֖רְתָּ לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/014.yaml
  text: And you answered me and said[a], ‘The thing that you have spoken is good for us to do.’
translation:
  language: hi
  text: तब तुमने मुझे उत्तर दिया और कहा, “जो बात तुमने कही है, उसे करना अच्छा है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने जो प्रस्ताव रखा है, उसे पूरा करना अच्छा है।”
    reason: ‘बात’ (דבר) सन्दर्भ में ‘प्रस्ताव’ और ‘करना’ (עשה) ‘पूरा करना’ या ‘कार्यान्वित करना’ भी हो सकता है।
lexical_decisions:
- source_word: וַתַּעֲנוּ
  choice: तुमने…उत्तर दिया
  rationale: ענה का यहाँ अर्थ पहले कही गई बात के प्रत्युत्तर में ‘उत्तर देना’ है; यह इब्रानी कथात्मक क्रम को बनाए रखता है।
- source_word: אֹתִי
  choice: मुझे
  rationale: प्रत्यक्ष कर्मचिह्न के साथ प्रथम पुरुष एकवचन प्रत्यय का सीधा हिन्दी रूप।
- source_word: וַתֹּאמְרוּ
  choice: और कहा
  rationale: אמר उत्तर की विषयवस्तु प्रस्तुत करता है। दोनों समन्वित क्रियाओं को अलग रखते हुए इब्रानी की ‘उत्तर दिया और कहा’ संरचना सुरक्षित रखी गई है।
- source_word: טוֹב
  choice: अच्छा
  rationale: यह प्रस्ताव का सकारात्मक मूल्यांकन करता है; ‘अच्छा’ सीधा और कम व्याख्यात्मक पर्याय है।
- source_word: הַדָּבָר
  choice: बात
  rationale: דבר के अर्थों में ‘बात’, ‘विषय’ और ‘वचन’ आते हैं। यहाँ यह मूसा के अभी बताए प्रस्ताव को सूचित करता है; ‘बात’ आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से पर्याप्त खुला है।
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: जो…तुमने कही है
  rationale: सम्बन्धवाचक אֲשֶׁר और पूर्ण क्रिया דִּבַּרְתָּ को ऐसे प्रस्तुत किया गया है कि पहले कही गई बात और उसकी वर्तमान प्रासंगिकता दोनों व्यक्त हों। हिन्दी में ‘बात’ के अनुसार स्त्रीलिंग ‘कही’ आया है।
- source_word: לַעֲשׂוֹת
  choice: उसे करना
  rationale: עשה का infinitive प्रस्ताव को कार्यान्वित करने का भाव देता है। ‘उसे करना’ संक्षिप्त, सीधा और हिन्दी में स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। बहुवचन ‘तुम’ प्रसंग के सामूहिक सम्बोधन को व्यक्त करता है। मुख्य पाठ इब्रानी की दो क्रियाओं—‘उत्तर दिया और कहा’—को सुरक्षित रखता है; आरम्भिक וַ का स्वाभाविक कथात्मक रूप ‘तब’ किया गया है।
