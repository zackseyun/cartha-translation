  text: הַ/הֹלֵ֨ךְ לִ/פְנֵי/כֶ֜ם בַּ/דֶּ֗רֶךְ לָ/ת֥וּר לָ/כֶ֛ם מָק֖וֹם לַֽ/חֲנֹֽתְ/כֶ֑ם בָּ/אֵ֣שׁ לַ֗יְלָה לַ/רְאֹֽתְ/כֶם֙ בַּ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ בָ֔/הּ וּ/בֶ/עָנָ֖ן יוֹמָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/033.yaml
  text: who went before you on the way to search out a place for you to camp[a], in fire by night to show you the way in which you should go[b], and in the cloud by day.
translation:
  language: hi
  text: जो मार्ग में तुम्हारे आगे-आगे चलता था, तुम्हारे डेरा डालने के लिए जगह खोजने के लिए; वह रात को आग में तुम्हें वह मार्ग दिखाता था जिस पर तुम्हें चलना था[b], और दिन को बादल में भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: शाब्दिक रूप से, “तुम्हें वह मार्ग दिखाने के लिए जिस पर तुम चलोगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹלֵךְ
  choice: जो ... आगे-आगे चलता था
  rationale: कर्ता पिछले पद में आए यहोवा हैं। कर्तृवाचक कृदन्त को भूतकालीन वर्णन के अनुरूप अनुवाद किया गया है, जबकि इस पद की पिछले पद पर वाक्यगत निर्भरता बनाए रखी गई है।
- source_word: לִפְנֵיכֶם
  choice: तुम्हारे आगे-आगे
  rationale: यह स्थानवाचक मुहावरा अगुवे के रूप में लोगों से आगे चलने का भाव देता है; दोहराव वाला ‘आगे-आगे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּדֶּרֶךְ
  choice: मार्ग में
  rationale: यहाँ דֶּרֶךְ यात्रा के रास्ते को दर्शाता है। ‘मार्ग में’ संक्षिप्त, गरिमापूर्ण और स्रोत की संरचना के निकट है।
- source_word: לָתוּר
  choice: खोजे
  rationale: क्रिया उपयुक्त स्थान का पता लगाने या छानबीन करने का भाव देती है। ‘खोजे’ सामान्य पाठक के लिए सहज है और अनावश्यक सैनिक अर्थ नहीं जोड़ता।
- source_word: מָקוֹם לַחֲנֹתְכֶם
  choice: तुम्हारे डेरा डालने के लिए जगह
  rationale: उद्देश्यसूचक रचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: בָּאֵשׁ לַיְלָה
  choice: रात को आग में
  rationale: ‘आग में’ स्रोत के בְּ संबंध को बनाए रखता है और जंगल की यात्रा में परमेश्वर के आग में प्रकट होकर मार्गदर्शन करने की ओर संकेत करता है, बिना मुख्य पाठ में ‘खम्भा’ जोड़ने के।
- source_word: לַרְאֹתְכֶם
  choice: तुम्हें ... दिखाता था
  rationale: ראה का हिफ़ील रूप कारणवाचक है; प्रसंग में ‘दिखाना’ इसका सहज हिन्दी समतुल्य है।
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: वह मार्ग ... जिस पर तुम्हें चलना था
  rationale: यह उस रास्ते की पहचान कराता है जिस पर लोगों को आगे जाना था। ‘चलना था’ यहाँ नियत या निर्देशित मार्ग का भाव रखता है, मात्र नैतिक बाध्यता का नहीं।
- source_word: וּבֶעָנָן יוֹמָם
  choice: और दिन को बादल में
  rationale: ‘बादल में’ रात के ‘आग में’ के समानान्तर है। प्रसंग परिचित दिव्य मार्गदर्शन की ओर संकेत करता है; हिन्दी में यहाँ बिना निश्चयवाचक उपपद के भी निश्चित संदर्भ स्पष्ट है।
theological_decisions:
- issue: कर्ता की पहचान पिछले पद के ‘यहोवा’ के रूप में
  choice: पद को ‘जो’ से आरम्भ करके पिछले पद से उसका वाक्यगत संबंध बनाए रखा गया।
  alternative: स्पष्टता के लिए ‘यहोवा, जो...’ जोड़ना।
  rationale: इब्रानी पाठ में इस पद के भीतर कर्ता का नाम दोहराया नहीं गया है। ‘जो’ से आरम्भ करने पर मूल की निर्भर संरचना और संदर्भगत पहचान दोनों सुरक्षित रहती हैं।
- issue: आग और बादल का स्वरूप
  choice: ‘आग में’ और ‘बादल में’ रखा गया।
  alternative: ‘आग के खम्भे में’ और ‘बादल के खम्भे में’ कहना।
  rationale: खम्भे की धारणा व्यापक प्रसंग में है, पर इस पद में עַמּוּד शब्द नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण रूप अपनाया गया है। ‘डेरा डालना’, ‘मार्ग’ और ‘आगे-आगे’ सामान्य पाठकों के लिए बोधगम्य हैं। पद की पिछले पद पर निर्भरता जानबूझकर बनाए रखी गई है; आग और बादल के बारे में मूल से अधिक विवरण नहीं जोड़ा गया।
