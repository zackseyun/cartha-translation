  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּפְנוּ֙ וַ/יַּעֲל֣וּ הָ/הָ֔רָ/ה וַ/יָּבֹ֖אוּ עַד נַ֣חַל אֶשְׁכֹּ֑ל וַֽ/יְרַגְּל֖וּ אֹתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/024.yaml
  text: So they turned and went up into the hill country[a], and came as far as the Valley of Eshcol, and spied it out.
translation:
  language: hi
  text: तब वे मुड़े और पहाड़ी प्रदेश में चढ़ गए। वे एश्कोल की घाटी[a] तक पहुँचे और उस देश की जासूसी की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एश्कोल का नाला” अथवा “एश्कोल की जलधारा”; इब्रानी शब्द ऐसी घाटी को भी दर्शा सकता है जिसमें मौसमी जलधारा बहती हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: वे मुड़े
  rationale: פנה का सामान्य कथात्मक अर्थ ‘मुड़ना’ है; यह आगे की दिशा बदलकर पहाड़ी प्रदेश की ओर जाने को सीधे व्यक्त करता है।
- source_word: וַיַּעֲלוּ
  choice: चढ़ गए
  rationale: עלה ऊँचाई की ओर जाने को दर्शाता है; ‘चढ़ गए’ आधुनिक हिन्दी में स्वाभाविक है और भू-भाग में आरोहण का भाव रखता है।
- source_word: הָהָרָה
  choice: पहाड़ी प्रदेश में
  rationale: दिशासूचक प्रत्यय गति की दिशा बताता है और הָהָר इस प्रसंग में किसी एक पहाड़ के बजाय पहाड़ी भू-भाग को सूचित करता है।
- source_word: וַיָּבֹאוּ עַד
  choice: तक पहुँचे
  rationale: בוא के साथ עַד किसी स्थान तक पहुँचने की सीमा को व्यक्त करता है; ‘तक पहुँचे’ इस सूक्ष्मता को संक्षेप और स्वाभाविक रूप से रखता है।
- source_word: נַחַל אֶשְׁכֹּל
  choice: एश्कोल की घाटी
  rationale: נחל घाटी, नाला या मौसमी जलधारा वाली घाटी को सूचित कर सकता है। मुख्य पाठ में ‘घाटी’ सहज है और अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: וַיְרַגְּלוּ
  choice: जासूसी की
  rationale: पिएल रूप में רגל केवल निरीक्षण नहीं, बल्कि गुप्त रूप से भेद लेने या टोह लेने का भाव रखता है; ‘जासूसी की’ इस विशिष्ट अर्थ को बनाए रखता है।
- source_word: אֹתָהּ
  choice: उस देश की
  rationale: स्त्रीलिंग एकवचन सर्वनाम का संदर्भ प्रसंग में उस भूमि या क्षेत्र से है। हिन्दी में केवल ‘उसकी’ अस्पष्ट होता, इसलिए अंतर्निहित संदर्भ ‘देश’ को स्पष्ट किया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथात्मक क्रियाओं को सरल भूतकाल में प्रस्तुत किया गया है; स्थलाकृतिक और जासूसी-संबंधी अर्थों को स्रोत के निकट रखा गया है।
