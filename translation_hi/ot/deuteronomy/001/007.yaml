source:
  edition: WLC
  text: פְּנ֣וּ וּ/סְע֣וּ לָ/כֶ֗ם וּ/בֹ֨אוּ הַ֥ר הָֽ/אֱמֹרִי֮ וְ/אֶל כָּל שְׁכֵנָי/ו֒ בָּ/עֲרָבָ֥ה בָ/הָ֛ר וּ/בַ/שְּׁפֵלָ֥ה וּ/בַ/נֶּ֖גֶב וּ/בְ/ח֣וֹף הַ/יָּ֑ם אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ/לְּבָנ֔וֹן עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/007.yaml
  text: Turn and set out for yourselves[a], and go to the hill country of the Amorites and to all their neighbors in the Arabah, in the hill country, in the lowland, in the Negev, and on the coast of the sea—the land of the Canaanites—and Lebanon, as far as the great river, the Euphrates River.
translation:
  language: hi
  text: मुड़ो और कूच करो। अमोरियों के पहाड़ी प्रदेश और उसके आस-पास के सभी इलाकों में जाओ—अरावा में, पहाड़ी प्रदेश में, शफेला[a] में, नेगेव में और समुद्र तट पर—और कनानियों के देश तथा लबानोन में, महानद अर्थात फ़रात नदी तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निचले पहाड़ी क्षेत्र में”; शफेला पश्चिमी तलहटी और निचले भूभाग का नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ וּסְעוּ לָכֶם
  choice: मुड़ो और कूच करो
  rationale: दोनों आज्ञार्थक क्रियाओं को अलग रखते हुए दिशा बदलने और पड़ाव से प्रस्थान करने का भाव व्यक्त किया गया है। לָכֶם यहाँ मुहावरेदार नैतिक कारक है; हिन्दी में ‘अपने लिए’ जोड़ना अस्वाभाविक और भ्रामक होता।
- source_word: וּבֹאוּ
  choice: में जाओ
  rationale: गंतव्य की ओर बढ़ने की आज्ञा के रूप में בוא का स्वाभाविक हिन्दी रूप ‘जाओ’ है।
- source_word: הַר הָאֱמֹרִי
  choice: अमोरियों का पहाड़ी प्रदेश
  rationale: הַר यहाँ किसी एक पहाड़ के बजाय विस्तृत ऊँचे भूभाग को दर्शाता है; जातिवाचक एकवचन को हिन्दी में सामूहिक बहुवचन से व्यक्त किया गया है।
- source_word: שְׁכֵנָיו
  choice: उसके आस-पास के सभी इलाके
  rationale: शाब्दिक रूप ‘उसके पड़ोसी’ है, पर इस भौगोलिक संदर्भ में निकटवर्ती क्षेत्रों का आशय अधिक स्वाभाविक और स्पष्ट है।
- source_word: בָּעֲרָבָה
  choice: अरावा में
  rationale: यह यरदन की दरार-घाटी से जुड़ा भौगोलिक नाम है, इसलिए सामान्य ‘मैदान’ के बजाय नाम का लिप्यंतरण रखा गया है।
- source_word: בָהָר
  choice: पहाड़ी प्रदेश में
  rationale: यहाँ भी הַר ऊँचे पहाड़ी भूभाग का क्षेत्रीय अर्थ रखता है।
- source_word: וּבַשְּׁפֵלָה
  choice: शफेला में
  rationale: विशिष्ट पश्चिमी निचले पहाड़ी/तलहटी क्षेत्र के नाम को पाठ में बनाए रखा गया है और उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וּבַנֶּגֶב
  choice: नेगेव में
  rationale: भौगोलिक क्षेत्रों की सूची में נֶגֶב विशिष्ट दक्षिणी प्रदेश को सूचित करता है, केवल सामान्य दिशा ‘दक्षिण’ को नहीं।
- source_word: וּבְחוֹף הַיָּם
  choice: समुद्र तट पर
  rationale: חוֹף का सरल और सटीक आधुनिक हिन्दी रूप ‘तट’ है।
- source_word: אֶרֶץ הַכְּנַעֲנִי
  choice: कनानियों के देश
  rationale: इब्रानी जातिवाचक एकवचन सामूहिक है; हिन्दी में बहुवचन ‘कनानियों’ से यह अर्थ स्वाभाविक रूप में आता है।
- source_word: וְהַלְּבָנוֹן
  choice: तथा लबानोन
  rationale: स्थान-नाम को प्रचलित हिन्दी बाइबलीय रूप में रखा गया है; इब्रानी निश्चित उपपद का हिन्दी में अलग अनुवाद आवश्यक नहीं।
- source_word: עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: महानद अर्थात फ़रात नदी तक
  rationale: पहले वर्णनात्मक पद ‘महानद’ और फिर स्पष्ट करने वाले नाम ‘फ़रात नदी’—दोनों को सुरक्षित रखा गया है।
