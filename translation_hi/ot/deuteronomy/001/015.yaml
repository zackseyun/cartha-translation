source:
  edition: WLC
  text: וָ/אֶקַּ֞ח אֶת רָאשֵׁ֣י שִׁבְטֵי/כֶ֗ם אֲנָשִׁ֤ים חֲכָמִים֙ וִֽ/ידֻעִ֔ים וָ/אֶתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עֲלֵי/כֶ֑ם שָׂרֵ֨י אֲלָפִ֜ים וְ/שָׂרֵ֣י מֵא֗וֹת וְ/שָׂרֵ֤י חֲמִשִּׁים֙ וְ/שָׂרֵ֣י עֲשָׂרֹ֔ת וְ/שֹׁטְרִ֖ים לְ/שִׁבְטֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/015.yaml
  text: 'So I took the heads of your tribes[a], wise and knowledgeable men, and appointed them as heads over you: commanders of thousands, commanders of hundreds, commanders of fifties, commanders of tens, and officers for your tribes.'
translation:
  language: hi
  text: 'तब मैंने तुम्हारे गोत्रों के मुखियाओं को—जो बुद्धिमान और जानकार[a] पुरुष थे—चुना और उन्हें तुम्हारे ऊपर प्रधान नियुक्त किया: हज़ारों के अधिकारी, सैकड़ों के अधिकारी, पचासों के अधिकारी, दहाइयों के अधिकारी और तुम्हारे गोत्रों के प्रशासकीय अधिकारी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जाने-माने”; इब्रानी शब्द का अर्थ ऐसे पुरुष भी हो सकता है जिन्हें लोग जानते या पहचानते हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: तब मैंने ... चुना
  rationale: वाव-क्रमबोधक कथा को आगे बढ़ाता है। לקח का मूल अर्थ ‘लेना’ है, पर चयन और नियुक्ति के इस प्रसंग में स्वाभाविक हिन्दी ‘चुना’ अभिप्रेत क्रिया को स्पष्ट करती है।
- source_word: רָאשֵׁי שִׁבְטֵיכֶם
  choice: तुम्हारे गोत्रों के मुखियाओं
  rationale: רֹאשׁ सामाजिक इकाई के शीर्षस्थ अगुवों को दर्शाता है। ‘मुखिया’ हिन्दी में पद और गोत्रीय नेतृत्व दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲנָשִׁים חֲכָמִים
  choice: बुद्धिमान ... पुरुष
  rationale: אֲנָשִׁים यहाँ पुरुषों को सूचित करता है और חֲכָמִים नेतृत्व तथा न्याय के लिए व्यावहारिक बुद्धि को; इसलिए लिंग और गुण दोनों स्पष्ट रखे गए हैं।
- source_word: וִידֻעִים
  choice: जानकार
  rationale: यह रूप ज्ञान या पहचाने जाने—दोनों अर्थ दे सकता है। प्रसंग में योग्यता और विवेक का अर्थ अधिक संभावित है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וָאֶתֵּן אֹתָם רָאשִׁים עֲלֵיכֶם
  choice: उन्हें तुम्हारे ऊपर प्रधान नियुक्त किया
  rationale: נתן यहाँ किसी पद पर ठहराने या नियुक्त करने का अर्थ देता है। ‘प्रधान’ רָאשִׁים की नेतृत्व-संबंधी छवि को बनाए रखता है।
- source_word: שָׂרֵי
  choice: अधिकारी
  rationale: שַׂר अधिकारयुक्त नेतृत्व-पद को दर्शाता है। यहाँ संगठन सैन्य भी हो सकता है और प्रशासनिक भी; ‘अधिकारी’ इस अस्पष्टता को ‘सेनापति’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: אֲלָפִים ... מֵאוֹת ... חֲמִשִּׁים ... עֲשָׂרֹת
  choice: हज़ारों ... सैकड़ों ... पचासों ... दस-दस
  rationale: क्रमबद्ध इकाइयों को यथासंभव शाब्दिक रूप में रखा गया है। ‘दस-दस’ आधुनिक हिन्दी में दस की इकाइयों को ‘दसों’ से अधिक स्पष्ट करता है।
- source_word: וְשֹׁטְרִים
  choice: प्रशासकीय अधिकारी
  rationale: שֹׁטֵר अधीनस्थ प्रशासनिक, अभिलेखीय या क्रियान्वयन-संबंधी पदाधिकारी हो सकता है। ‘प्रशासकीय अधिकारी’ इसे पहले आए सामान्य ‘अधिकारी’ से अलग और अर्थपूर्ण बनाता है।
- source_word: לְשִׁבְטֵיכֶם
  choice: तुम्हारे गोत्रों के
  rationale: ל यहाँ गोत्रीय संगठन से संबद्ध नियुक्ति बताता है; हिन्दी संबंधकारक इस संबंध को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
