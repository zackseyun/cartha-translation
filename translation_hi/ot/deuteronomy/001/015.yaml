  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘गोत्र’, ‘मुखिया’ और ‘प्रधान’ बाइबिलीय-सामुदायिक प्रशासन के प्रसंग के अनुकूल हैं। सैन्य बनाम नागरिक प्रशासन की संभावित अस्पष्टता के कारण שָׂרֵי के लिए संकीर्ण ‘सेनापति’ के बजाय ‘अधिकारी’ चुना गया है।
