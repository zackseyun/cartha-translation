  yaml_path: translation/ot/deuteronomy/001/005.yaml
  text: 'Beyond the Jordan[a], in the land of Moab, Moses began to explain this law[b], saying:'
translation:
  language: hi
  text: 'यरदन के पार[a], मोआब देश में, मूसा ने इस व्यवस्था[b] को समझाना शुरू किया, यह कहते हुए:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यरदन के दूसरी ओर।” इब्रानी अभिव्यक्ति भौगोलिक दृष्टिकोण पर निर्भर है और उस क्षेत्र को यरदन के दूसरी ओर स्थित बताती है।
    reason: lexical_alternative
  - marker: b
    text: या “इस शिक्षा” या “इस निर्देश।” इब्रानी शब्द तोराह का अर्थ “व्यवस्था” और अधिक व्यापक रूप में “शिक्षा” या “निर्देश” हो सकता है। यहाँ वाचा और विधि के संदर्भ के कारण “व्यवस्था” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार
  rationale: यह इब्रानी भौगोलिक अभिव्यक्ति वक्ता की दृष्टि से यरदन के दूसरी ओर के क्षेत्र को बताती है। ‘यरदन के पार’ स्वाभाविक और संक्षिप्त है, जबकि दृष्टिकोण-सापेक्षता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּאֶרֶץ מוֹאָב
  choice: मोआब देश में
  rationale: אֶרֶץ यहाँ भौगोलिक-राजनीतिक अर्थ में ‘देश’ या ‘प्रदेश’ है; ‘मोआब देश’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: הוֹאִיל
  choice: लगा
  rationale: בֵּאֵר के साथ यह क्रिया किसी कार्य को आरम्भ करने या हाथ में लेने का भाव देती है। ‘समझाने लगा’ आधुनिक हिन्दी में इस संयुक्त भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֵּאֵר
  choice: समझाने
  rationale: यह क्रिया किसी बात को स्पष्ट करने या उसका विवेचन करने का अर्थ देती है। ‘समझाने’ साधारण पाठक के लिए सहज है और अर्थ को तकनीकी बनाए बिना सुरक्षित रखता है।
- source_word: הַתּוֹרָה הַזֹּאת
  choice: इस व्यवस्था
  rationale: תּוֹרָה का अर्थ शिक्षा या निर्देश भी हो सकता है, पर यहाँ वाचा-संबंधी विधिक संदर्भ में ‘व्यवस्था’ उसके नियमात्मक बल को व्यक्त करती है। व्यापक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: לֵאמֹר
  choice: 'उसने कहा:'
  rationale: यह आगे आने वाले कथन का परिचय देने वाला मानक इब्रानी सूत्र है। अलग हिन्दी वाक्य के रूप में ‘उसने कहा:’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: वाचा के संदर्भ में תּוֹרָה का अनुवाद
  choice: इस व्यवस्था
  alternative: इस शिक्षा
  rationale: यह पद मूसा द्वारा वाचा के नियमों के विवेचन की भूमिका बाँधता है। ‘व्यवस्था’ विधिक-वाचागत आयाम बनाए रखती है, जबकि ‘शिक्षा’ का व्यापक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है; यह किसी संप्रदाय-विशेष की व्याख्या नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘समझाने लगा’ הוֹאִיל और בֵּאֵר के संयुक्त भाव को स्वाभाविक हिन्दी में व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
