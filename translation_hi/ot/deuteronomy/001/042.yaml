source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֱמֹ֤ר לָ/הֶם֙ לֹ֤א תַֽעֲלוּ֙ וְ/לֹא תִלָּ֣חֲמ֔וּ כִּ֥י אֵינֶ֖/נִּי בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּֽגְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/042.yaml
  text: 'And Yahweh said to me[a], ‘Tell them: Do not go up or fight, for I am not among you[b], lest you be struck down before your enemies.’'
translation:
  language: hi
  text: तब याहवे ने मुझसे कहा, “उनसे कहो, ‘ऊपर मत जाओ और युद्ध मत करो, क्योंकि मैं तुम्हारे साथ नहीं हूँ[a]; नहीं तो तुम अपने शत्रुओं के सामने पराजित हो जाओगे[b]।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मैं तुम्हारे बीच में नहीं हूँ।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम अपने शत्रुओं के सामने मार गिराए जाओगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के वाचा-नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप में रखा गया है।
- source_word: וַיֹּאמֶר ... אֵלַי
  choice: तब ... ने मुझसे कहा
  rationale: कथात्मक וַ का प्रसंगानुकूल प्रवाह ‘तब’ से और אֵלַי का स्वाभाविक हिन्दी रूप ‘मुझसे’ से व्यक्त होता है।
- source_word: אֱמֹר לָהֶם
  choice: उनसे कहो
  rationale: आज्ञार्थक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: לֹא תַעֲלוּ
  choice: ऊपर मत जाओ
  rationale: עלה के भौगोलिक और सैनिक संदर्भ में ‘ऊपर जाना’ मूल अर्थ को स्पष्ट रूप से बनाए रखता है।
- source_word: וְלֹא תִלָּחֲמוּ
  choice: और युद्ध मत करो
  rationale: Niphal रूप यहाँ युद्ध करने या लड़ने का अर्थ देता है; ‘युद्ध मत करो’ गरिमापूर्ण और स्पष्ट है।
- source_word: כִּי אֵינֶנִּי בְּקִרְבְּכֶם
  choice: क्योंकि मैं तुम्हारे साथ नहीं हूँ
  rationale: यह स्वाभाविक हिन्दी में याहवे की अनुपस्थित सहायक उपस्थिति को व्यक्त करता है; अधिक शाब्दिक स्थान-सूचक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וְלֹא תִּנָּגְפוּ
  choice: नहीं तो ... पराजित हो जाओगे
  rationale: संदर्भ में यह निषेध मानने पर हार से बचने की चेतावनी है। हिन्दी का ‘नहीं तो’ इस आशय को स्पष्ट करता है और נגף के सैनिक पराजय वाले अर्थ को बनाए रखता है।
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: अपने शत्रुओं के सामने
  rationale: हिब्रू मुहावरे का निकट और हिन्दी में बोधगम्य रूप, जो युद्ध में शत्रुओं के सम्मुख हार को दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-नाम स्पष्ट रूप से है। ‘याहवे’ उसे उपाधि में बदले बिना और किसी संप्रदायगत व्याख्या को जोड़े बिना प्रस्तुत करता है।
- issue: וְלֹא תִּנָּגְפוּ का वाक्यगत बल
  choice: 'चेतावनी के परिणाम के रूप में: ‘नहीं तो तुम ... पराजित हो जाओगे’'
  alternative: 'अधिक शब्दानुसार: ‘और तुम ... न मारे जाओ’'
  rationale: प्रसंग के अनुसार ऊपर जाने और लड़ने पर पराजय होगी। केवल भविष्यकालीन नकार हिन्दी में उलटा अर्थ दे सकता था, मानो पराजय न होने का आश्वासन दिया जा रहा हो।
- issue: בְּקִרְבְּכֶם में ईश्वरीय उपस्थिति
  choice: मुख्य पाठ में ‘तुम्हारे साथ’, शाब्दिक रूप पादटिप्पणी में
  alternative: तुम्हारे बीच में
  rationale: ‘साथ’ आधुनिक हिन्दी में प्रसंगगत उपस्थिति और सहायता को सहजता से व्यक्त करता है, जबकि पादटिप्पणी मूल के स्थान-सूचक रूप को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन के भीतर आदेश को एकहरे उद्धरण-चिह्नों में रखा गया है। ‘ऊपर मत जाओ’ मूल की भौगोलिक दिशा को बनाए रखता है, और ‘नहीं तो’ अंतिम खंड को स्वाभाविक हिन्दी चेतावनी के रूप में प्रस्तुत करता है।
