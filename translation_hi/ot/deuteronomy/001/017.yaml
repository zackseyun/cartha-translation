source:
  edition: WLC
  text: לֹֽא תַכִּ֨ירוּ פָנִ֜ים בַּ/מִּשְׁפָּ֗ט כַּ/קָּטֹ֤ן כַּ/גָּדֹל֙ תִּשְׁמָע֔וּ/ן לֹ֤א תָג֨וּרוּ֙ מִ/פְּנֵי אִ֔ישׁ כִּ֥י הַ/מִּשְׁפָּ֖ט לֵ/אלֹהִ֣ים ה֑וּא וְ/הַ/דָּבָר֙ אֲשֶׁ֣ר יִקְשֶׁ֣ה מִ/כֶּ֔ם תַּקְרִב֥וּ/ן אֵלַ֖/י וּ/שְׁמַעְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/017.yaml
  text: You shall not show partiality in judgment[a]; you shall hear the small and the great alike. You shall not be intimidated by any man, for the judgment belongs to God. And the matter that is too difficult for you, you shall bring to me[b], and I will hear it.
translation:
  language: hi
  text: न्याय करते समय किसी का पक्ष न लेना[a]। छोटे और बड़े, दोनों की बात समान रूप से सुनना। किसी मनुष्य से भयभीत न होना, क्योंकि न्याय परमेश्वर का है। जो मामला तुम्हारे लिए बहुत कठिन हो, उसे मेरे पास लाना, और मैं उसे सुनूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “न्याय में चेहरों को न पहचानना”; यह पक्षपात न करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכִּירוּ פָנִים
  choice: किसी का पक्ष न लेना
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘चेहरों को पहचानना’ है, पर न्यायिक संदर्भ में इसका अर्थ पक्षपात करना है। हिंदी में ‘किसी का पक्ष लेना’ स्वाभाविक और स्पष्ट है।
- source_word: בַּמִּשְׁפָּט
  choice: न्याय करते समय
  rationale: यहाँ מִשְׁפָּט अमूर्त न्याय मात्र नहीं, बल्कि न्यायिक निर्णय की प्रक्रिया को दर्शाता है।
- source_word: כַּקָּטֹן כַּגָּדֹל תִּשְׁמָעוּן
  choice: छोटे और बड़े, दोनों की बात समान रूप से सुनना
  rationale: ‘छोटे और बड़े’ सामाजिक हैसियत के भेद को बनाए रखता है; ‘दोनों की बात समान रूप से’ न्यायिक सुनवाई और निष्पक्षता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לֹא תָגוּרוּ מִפְּנֵי אִישׁ
  choice: किसी मनुष्य से भयभीत न होना
  rationale: क्रिया न्याय करते समय किसी व्यक्ति के भय से पीछे हटने का भाव रखती है। ‘भयभीत’ मूल अर्थ को सीधे रखता है और ‘मनुष्य’ इब्रानी के सामान्यवाची पुल्लिंग एकवचन को दर्शाता है।
- source_word: כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא
  choice: क्योंकि न्याय परमेश्वर का है
  rationale: यह संक्षिप्त रूप न्याय पर परमेश्वर के अधिकार की मूल प्रतिज्ञप्ति को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: הַדָּבָר אֲשֶׁר יִקְשֶׁה מִכֶּם
  choice: जो मामला तुम्हारे लिए बहुत कठिन हो
  rationale: कानूनी संदर्भ में דָּבָר का अर्थ ‘मामला’ है और יִקְשֶׁה מִכֶּם न्यायाधीशों की निर्णय करने की कठिनाई दर्शाता है।
- source_word: תַּקְרִבוּן אֵלַי
  choice: उसे मेरे पास लाना
  rationale: हिफ़ील रूप का अर्थ किसी विषय को निकट लाना या प्रस्तुत करना है; ‘मेरे पास लाना’ सहज हिंदी है।
- source_word: וּשְׁמַעְתִּיו
  choice: और मैं उसे सुनूँगा
  rationale: सर्वनाम का स्वाभाविक पूर्वपद ‘मामला’ है। ‘सुनूँगा’ पहले प्रयुक्त न्यायिक सुनवाई की भाषा को बनाए रखता है और ‘निर्णय करूँगा’ जैसी अतिरिक्त व्याख्या से बचता है।
theological_decisions:
- issue: ‘न्याय परमेश्वर का है’ में न्यायिक अधिकार का आधार
  choice: कथन को सीधे इस रूप में रखा गया है कि न्याय परमेश्वर का है।
  alternative: इसे यह कहकर समझाना कि परमेश्वर न्यायियों का न्याय करेगा, या कि केवल दिव्य व्यवस्था ही न्याय है।
  rationale: इब्रानी वाक्य परमेश्वर और न्याय के संबंध को संक्षेप और व्यापकता के साथ कहता है। अनुवाद किसी एक विस्तृत धर्मवैज्ञानिक अर्थ को थोपे बिना उसी तनाव को बनाए रखता है।
- issue: सामान्यवाची אִישׁ का निरूपण
  choice: किसी मनुष्य से
  alternative: किसी से
  rationale: ‘मनुष्य’ मूल के पुल्लिंग एकवचन शब्द को दर्शाते हुए संदर्भ में सामान्यवाची अर्थ रखता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आदेशों में ‘न लेना/सुनना/न होना/लाना’ का प्रयोग मूसा द्वारा न्यायियों को दिए गए निर्देशों की प्रवाहपूर्ण हिंदी शैली के लिए किया गया है।
