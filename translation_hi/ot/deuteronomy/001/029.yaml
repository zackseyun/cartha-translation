  language: hi
  text: तब मैंने तुमसे कहा, “उनसे आतंकित मत हो और उनसे मत डरो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעַרְצוּן
  choice: आतंकित हो
  rationale: यह क्रिया प्रबल भय या दहशत में पड़ने का भाव व्यक्त करती है; ‘आतंकित होना’ अगले सामान्य ‘डरना’ से इसकी तीव्रता का अंतर बनाए रखता है।
- source_word: תִירְאוּן
  choice: डरो
  rationale: सामान्य भय के लिए स्वाभाविक और सीधा हिन्दी पद।
- source_word: מֵהֶם
  choice: उनसे
  rationale: हिब्रू संबंधसूचक उपसर्ग מִן यहाँ भय के लक्ष्य/कारण को दर्शाता है; हिन्दी में ‘उनसे’ स्वाभाविक है और दोनों निषेधों पर लागू किया गया है।
