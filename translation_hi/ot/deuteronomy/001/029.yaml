  register: सरल, वर्तमान और गरिमापूर्ण हिन्दी। हिब्रू के दो निकटार्थक भय-सूचक क्रियापदों का अंतर ‘आतंकित’ और ‘डरो’ द्वारा बनाए रखा गया है। संबोधन बहुवचन है, जिसे हिन्दी ‘तुम’ स्वाभाविक रूप से व्यक्त करता है।
