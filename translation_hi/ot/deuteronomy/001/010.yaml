base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/010.yaml
  text: Yahweh your God has multiplied you[a], and behold, today you are as numerous as the stars of the heavens.
translation:
  language: hi
  text: याहवे तुम्हारे परमेश्वर ने तुम्हारी संख्या बढ़ाई है, और देखो, आज तुम आकाश के तारों के समान असंख्य हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर
  rationale: वाचा के संदर्भ में אֱלֹהִים एकवचन अर्थ में है और द्वितीय पुरुष बहुवचन प्रत्यय को ‘तुम्हारे’ से व्यक्त किया गया है।
- source_word: הִרְבָּה אֶתְכֶם
  choice: तुम्हारी संख्या बढ़ाई है
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘बहुसंख्यक करना/संख्या बढ़ाना’ है; हिंदी में यह प्रयोग स्वाभाविक और स्पष्ट है।
- source_word: וְהִנְכֶם
  choice: और देखो
  rationale: ध्यान आकर्षित करने वाले हिब्रू संकेतक का आलंकारिक बल बनाए रखा गया है।
- source_word: הַיּוֹם
  choice: आज
  rationale: हिब्रू कालवाचक क्रियाविशेषण का सीधा और स्वाभाविक आधुनिक हिंदी रूप।
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: आकाश के तारों के समान
  rationale: तुलनात्मक अव्यय और संबंधसूचक रचना को स्वाभाविक हिंदी में निकटता से व्यक्त करता है।
- source_word: לָרֹב
  choice: असंख्य
  rationale: यह पदबंध बहुत बड़ी संख्या या बहुलता को व्यक्त करता है; ‘असंख्य’ तुलना के भीतर संक्षिप्त और मुहावरेदार है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। ‘तुम’ बहुवचन सामुदायिक संबोधन है। मूल की तुलना और वर्तमान स्थिति पर दिए गए बल को बनाए रखा गया है।
