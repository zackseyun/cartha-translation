language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/נִּסַּ֣ע מֵ/חֹרֵ֗ב וַ/נֵּ֡לֶךְ אֵ֣ת כָּל הַ/מִּדְבָּ֣ר הַ/גָּדוֹל֩ וְ/הַ/נּוֹרָ֨א הַ/ה֜וּא אֲשֶׁ֣ר רְאִיתֶ֗ם דֶּ֚רֶךְ הַ֣ר הָֽ/אֱמֹרִ֔י כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֹתָ֑/נוּ וַ/נָּבֹ֕א עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/019.yaml
  text: Then we set out from Horeb and went through all that great and fearsome wilderness that you saw on the way to the hill country of the Amorites[a], just as Yahweh our God commanded us, and we came as far as Kadesh-barnea.
translation:
  language: hi
  text: तब हम होरेब से कूच कर उस सारे विशाल और भयावह[a] निर्जन प्रदेश से होकर चले, जिसे तुमने एमोरियों के पहाड़ी प्रदेश की ओर जाने वाले मार्ग पर देखा था, जैसा कि हमारे परमेश्वर याहवे ने हमें आज्ञा दी थी; और हम कादेश-बर्नेआ तक पहुँचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘विशाल और आतंक जगाने वाला।’ इब्रानी विशेषण का अर्थ भय, विस्मय या आतंक उत्पन्न करने वाला हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּסַּע מֵחֹרֵב
  choice: हम होरेब से कूच करके
  rationale: נסע का मूल भाव पड़ाव उठाकर यात्रा आरम्भ करना है; ‘कूच करके’ इसे संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַנֵּלֶךְ אֵת כָּל הַמִּדְבָּר
  choice: उस पूरे ... वीराने से होकर गए
  rationale: הלך के साथ चिह्नित क्षेत्र को पार करने का भाव है। ‘से होकर गए’ हिंदी में स्वाभाविक है, और ‘वीराना’ מִדְבָּר के निर्जन वन्य प्रदेश को व्यक्त करता है।
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: विशाल और भयावह
  rationale: גָּדוֹל यहाँ क्षेत्र की विशालता बताता है, जबकि נוֹרָא भय, विस्मय अथवा आतंक उत्पन्न करने वाला होने का भाव रखता है।
- source_word: אֲשֶׁר רְאִיתֶם
  choice: जिसे तुमने ... देखा था
  rationale: संबंधवाचक उपवाक्य श्रोताओं के अपने प्रत्यक्ष अनुभव की ओर संकेत करता है।
- source_word: דֶּרֶךְ הַר הָאֱמֹרִי
  choice: एमोरियों के पहाड़ी प्रदेश की ओर जाने वाले मार्ग पर
  rationale: הַר यहाँ एक अकेले पर्वत के बजाय पहाड़ी भूभाग का सामूहिक अर्थ देता है; דֶּרֶךְ उस दिशा में जाने वाले मार्ग को सूचित करता है।
- source_word: כַּאֲשֶׁר צִוָּה ... אֹתָנוּ
  choice: ने हमें जैसी आज्ञा दी थी, ठीक वैसा ही हमने किया
  rationale: हिब्रू में आज्ञा के अनुरूप यात्रा किए जाने का भाव है। हिंदी में स्पष्टता और सहज प्रवाह के लिए निहित क्रिया को ‘हमने किया’ के रूप में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी लिपि में लिप्यंतरित किया गया है।
- source_word: וַנָּבֹא עַד קָדֵשׁ בַּרְנֵעַ
  choice: और हम कादेश-बर्नेआ तक पहुँचे
  rationale: בוא עם עד गंतव्य तक पहुँचने को व्यक्त करता है; स्थान-नाम का लिप्यंतरण किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका निकट हिंदी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: आज्ञा और यात्रा के संबंध को व्यक्त करना
  choice: हमारे परमेश्वर याहवे ने हमें जैसी आज्ञा दी थी, ठीक वैसा ही हमने किया
  alternative: जैसी आज्ञा हमारे परमेश्वर याहवे ने हमें दी थी
  rationale: मूल में यात्रा का आज्ञा के ठीक अनुरूप होना अभिप्रेत है। हिंदी में निहित संबंध स्पष्ट किया गया है, पर आज्ञा की विषयवस्तु में कोई अतिरिक्त बात नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘कूच’, ‘वीराना’ और ‘पहाड़ी प्रदेश’ सामान्य पाठक के लिए बोधगम्य हैं तथा यात्रा-वृत्तांत के भौगोलिक स्वर को बनाए रखते हैं।
