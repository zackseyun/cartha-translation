- from: तब हम होरेब से कूच करके उस पूरे विशाल और भयावह[a] वीराने से होकर गए, जिसे तुमने एमोरियों के पहाड़ी प्रदेश की ओर जाने वाले मार्ग पर देखा था। हमारे परमेश्वर याहवे ने हमें जैसी आज्ञा दी थी, ठीक वैसा ही हमने किया, और हम कादेश-बर्नेआ तक पहुँचे।
  to: तब हम होरेब से कूच कर उस सारे विशाल और भयावह[a] निर्जन प्रदेश से होकर चले, जिसे तुमने एमोरियों के पहाड़ी प्रदेश की ओर जाने वाले मार्ग पर देखा था, जैसा कि हमारे परमेश्वर याहवे ने हमें आज्ञा दी थी; और हम कादेश-बर्नेआ तक पहुँचे।
  rationale: Revision restores the Hebrew syntax by making Yahweh's command govern the journey rather than adding an independent statement that “we did so.” It also replaces “वीराना” with the more contextually precise “निर्जन प्रदेश,” while retaining the source's scope, route reference, proper names, and footnote ambiguity.
