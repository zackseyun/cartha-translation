base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/040.yaml
  text: But as for you[a], turn yourselves around and set out for the wilderness by the way of the Red Sea.
translation:
  language: hi
  text: परन्तु तुम मुड़कर लाल सागर[a] के मार्ग से जंगल की ओर कूच करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “सरकंडों का सागर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: परन्तु तुम
  rationale: स्वतंत्र सर्वनाम के साथ संयोजक पिछले न्यायादेश के विपरीत इन लोगों को बल देकर संबोधित करता है; ‘परन्तु तुम’ इस विरोध और बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פְּנוּ לָכֶם
  choice: मुड़कर
  rationale: यह पदबंध दिशा बदलने की आज्ञा देता है। हिन्दी का ‘मुड़कर’ इस ठोस क्रिया को स्वाभाविक रूप से व्यक्त करता है; לָכֶם का आत्मसंबंधी बल हिन्दी में अलग ‘अपने-आप’ जोड़ने पर अस्वाभाविक होता।
- source_word: וּ/סְעוּ
  choice: कूच करो
  rationale: נסע प्रायः पड़ाव उठाकर आगे यात्रा आरम्भ करने को दर्शाता है; ‘कूच करो’ सामूहिक यात्रा की आज्ञा के लिए संक्षिप्त और गरिमापूर्ण है।
- source_word: הַמִּדְבָּרָה
  choice: जंगल की ओर
  rationale: दिशासूचक ה गति की दिशा बताता है, आवश्यक रूप से भीतर प्रवेश नहीं; ‘की ओर’ इस अर्थ को सुरक्षित रखता है। बाइबलीय प्रसंग में ‘जंगल’ निर्जन वनप्रदेश के प्रचलित हिन्दी अर्थ में है।
- source_word: דֶּרֶךְ
  choice: के मार्ग से
  rationale: यह यात्रा का रास्ता या मार्ग बताता है; ‘के मार्ग से’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: יַם סוּף
  choice: लाल सागर
  rationale: यह पारंपरिक और व्यापक रूप से पहचाना जाने वाला भौगोलिक नाम है; अधिक शाब्दिक ‘सरकंडों का सागर’ पादटिप्पणी में दिया गया है ताकि हिब्रू की शब्दगत पारदर्शिता बनी रहे।
