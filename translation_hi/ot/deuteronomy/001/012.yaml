  yaml_path: translation/ot/deuteronomy/001/012.yaml
  text: How can I alone bear your trouble[a], your burden, and your disputes?
translation:
  language: hi
  text: मैं अकेला तुम्हारी परेशानी, तुम्हारा बोझ और तुम्हारे आपसी विवाद[a] कैसे उठा सकता हूँ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे झगड़े” अथवा “तुम्हारे मुकदमे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: कैसे ... सकता हूँ
  rationale: यह विस्मय और असमर्थता व्यक्त करने वाला आलंकारिक प्रश्न है; आधुनिक हिन्दी में ‘कैसे ... सकता हूँ’ इसका बल स्वाभाविक रूप से प्रकट करता है।
- source_word: אֶשָּׂא
  choice: उठा सकता हूँ
  rationale: נשׂא यहाँ लोगों से जुड़ी कठिन जिम्मेदारियों को वहन करने के अर्थ में है; ‘उठाना’ आगे आए ‘बोझ’ के साथ स्वाभाविक हिन्दी प्रयोग है।
- source_word: לְבַדִּי
  choice: मैं अकेला
  rationale: यह मूसा के अकेले इन जिम्मेदारियों को सँभाल न सकने पर दिए गए बल को बनाए रखता है।
- source_word: טָרְחֲכֶם
  choice: तुम्हारी परेशानी
  rationale: טֹרַח थकाने वाली कठिनाई या झंझट को दर्शाता है; ‘परेशानी’ अगले शब्द ‘बोझ’ से भेद भी बनाए रखती है।
- source_word: מַשַּׂאֲכֶם
  choice: तुम्हारा बोझ
  rationale: מַשָּׂא का मूल भाव भार या बोझ है; यहाँ यह अमूर्त जिम्मेदारी के लिए स्वाभाविक और स्पष्ट है।
- source_word: רִיבְכֶם
  choice: तुम्हारे आपसी विवाद
  rationale: רִיב में झगड़े, विवाद और न्यायिक मामले—सभी का भाव हो सकता है। ‘आपसी विवाद’ प्रसंग में लोगों के बीच के मतभेद को स्पष्ट करता है, जबकि पादटिप्पणी कानूनी अर्थ को सुरक्षित रखती है।
theological_decisions: []
