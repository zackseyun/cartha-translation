source:
  edition: WLC
  text: וָ/אֹמַ֖ר אֲלֵ/כֶ֑ם בָּאתֶם֙ עַד הַ֣ר הָ/אֱמֹרִ֔י אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/020.yaml
  text: And I said to you[a], “You have come to the hill country of the Amorites, which Yahweh our God is giving us.”
translation:
  language: hi
  text: और मैंने तुमसे कहा, “तुम अमोरियों के पहाड़ी प्रदेश[a] में आ पहुँचे हो, जिसे याहवे, हमारे परमेश्वर, हमें दे रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अमोरियों का पर्वत।” इब्रानी शब्द किसी एक पर्वत या अधिक व्यापक पहाड़ी प्रदेश—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר אֲלֵכֶם
  choice: और मैंने तुमसे कहा
  rationale: वय्यिक्तोल क्रमिक कथानक को आगे बढ़ाता है; ‘और’ मूल संयोजकता रखता है। אֲלֵכֶם बहुवचन है, जिसे प्रसंग में स्वाभाविक हिन्दी ‘तुमसे’ व्यक्त करती है।
- source_word: בָּאתֶם עַד
  choice: तुम ... तक आ पहुँचे हो
  rationale: पूर्ण क्रिया वर्तमान स्थिति से जुड़ी हुई पूर्णता बताती है, और עַד पहुँचे हुए गंतव्य की सीमा दर्शाता है। ‘आ पहुँचे हो’ दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַר הָאֱמֹרִי
  choice: अमोरियों के पहाड़ी प्रदेश
  rationale: הַר यहाँ एक अकेले पर्वत के बजाय पहाड़ी भूभाग को सूचित कर सकता है; सामूहिक जातिवाचक रूप को हिन्दी में बहुवचन ‘अमोरियों’ से स्पष्ट किया गया है। वास्तविक शाब्दिक विकल्प फुटनोट में रखा गया है।
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: हमारे परमेश्वर यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम יְהוָה को हिन्दी के प्रचलित बाइबलीय लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है; אֱלֹהֵינוּ का सीधा अर्थ ‘हमारे परमेश्वर’ है। हिन्दी में यह शब्दक्रम स्वाभाविक और स्पष्ट है।
- source_word: נֹתֵן לָנוּ
  choice: हमें दे रहे हैं
  rationale: कृदन्त जारी या निकटवर्ती दान को दर्शाता है। आदरसूचक एकवचन परमेश्वर के लिए हिन्दी में बहुवचन क्रियारूप ‘दे रहे हैं’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, चार-अक्षरीय व्यक्तिगत नाम है। हिन्दी बाइबल-पाठकों के लिए स्थापित और पहचाना जाने वाला रूप ‘यहोवा’ नाम को नाम के रूप में ही सुरक्षित रखता है; ‘याहवे’ अधिक अकादमिक पुनर्निर्मित उच्चारण है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘आ पहुँचे हो’ आगमन की पूर्णता और वर्तमान प्रासंगिकता रखता है। ‘पहाड़ी प्रदेश’ भौगोलिक अर्थ को स्पष्ट करता है, जबकि फुटनोट मूल की वास्तविक द्विअर्थकता सुरक्षित रखता है।
