  text: וַ/יִּקְח֤וּ בְ/יָדָ/ם֙ מִ/פְּרִ֣י הָ/אָ֔רֶץ וַ/יּוֹרִ֖דוּ אֵלֵ֑י/נוּ וַ/יָּשִׁ֨בוּ אֹתָ֤/נוּ דָבָר֙ וַ/יֹּ֣אמְר֔וּ טוֹבָ֣ה הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/025.yaml
  text: And they took in their hands some of the fruit of the land and brought it down to us[a], and they brought us back word and said, “The land that Yahweh our God is giving to us is good.”
translation:
  language: hi
  text: उन्होंने उस देश के कुछ फल अपने हाथों में लिए और उन्हें नीचे हमारे पास ले आए। फिर वे हमारे पास लौटकर समाचार लाए और कहा, “जिस देश को हमारा परमेश्वर याहवे हमें दे रहे हैं, वह अच्छा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ בְיָדָם
  choice: उन्होंने ... अपने हाथों में लिया
  rationale: לקח का सामान्य कथात्मक अर्थ ‘लेना’ है; בְיָדָם की ठोस अभिव्यक्ति को बनाए रखने के लिए ‘अपने हाथों में’ रखा गया है।
- source_word: מִפְּרִי הָאָרֶץ
  choice: उस देश के फलों में से कुछ
  rationale: מִן यहाँ अंशसूचक है और कुल उपज में से लिए गए नमूने को व्यक्त करता है। सामूहिक ‘फल’ की अपेक्षा हिन्दी में ‘फलों’ अधिक स्वाभाविक है।
- source_word: וַיּוֹרִדוּ אֵלֵינוּ
  choice: उसे नीचे हमारे पास ले आए
  rationale: ירד के हिफ़ील रूप का दिशात्मक अर्थ ‘नीचे लाना’ सुरक्षित रखा गया है; एकवचन ‘उसे’ पूरे फल-नमूने को सामूहिक रूप से संदर्भित करता है।
- source_word: וַיָּשִׁבוּ אֹתָנוּ דָבָר
  choice: उन्होंने हमें समाचार दिया
  rationale: שוב + דבר लौटकर सूचना देने का मुहावरा है। शाब्दिक संरचना हिन्दी में अस्वाभाविक होती, इसलिए अर्थ को स्वाभाविक ‘समाचार दिया’ से व्यक्त किया गया है; अधिक शाब्दिक विकल्प पादटिप्पणी में है।
- source_word: טוֹבָה הָאָרֶץ
  choice: वह देश अच्छा है
  rationale: טוֹבָה भूमि का व्यापक सकारात्मक मूल्यांकन है; ‘अच्छा’ इसका सीधा और सहज हिन्दी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और सामान्य पाठकों के लिए पहचाना जाने वाला देवनागरी रूप, जो परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य उपाधि से अलग रखता है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: यह मानक वाचागत अभिव्यक्ति का सीधा हिन्दी अनुवाद है।
- source_word: נֹתֵן לָנוּ
  choice: हमें दे रहे हैं
  rationale: वर्तमान कृदंत जारी अथवा निकट निश्चित दान को दर्शाता है। परमेश्वर के लिए हिन्दी का आदरसूचक बहुवचन ‘दे रहे हैं’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी के सामान्य बाइबलीय पाठकों में अधिक परिचित रूप है; ‘याहवे’ संभावित विद्वत्तापरक लिप्यंतरण है।
- issue: נֹתֵן की कालगत छाया
  choice: दे रहे हैं
  alternative: देता है / देनेवाला है
  rationale: कृदंत को वर्तमान में चल रहे अथवा निश्चित रूप से संपन्न हो रहे ईश्वरीय अनुदान के रूप में रखा गया है, बिना यह तय किए कि अधिकार की प्रक्रिया किस चरण में है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘देश’ इस प्रसंग में הָאָרֶץ के लिए सामान्य और बोधगम्य है। वाक्य को हिन्दी में स्वाभाविक प्रवाह के लिए दो वाक्यों में बाँटा गया है, जबकि हिब्रू घटनाक्रम और सभी अर्थगत घटक सुरक्षित हैं।
