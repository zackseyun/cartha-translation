base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/028.yaml
  text: Where are we going up? Our brothers have melted our hearts[a], saying, ‘The people are greater and taller than we are; the cities are great and fortified up to the heavens; and besides[c][b], we saw the sons of the Anakim there.’
translation:
  language: hi
  text: हम कहाँ जा रहे हैं? हमारे भाइयों ने यह कहकर हमारे हृदयों को पिघला दिया है[a], ‘वे लोग हमसे अधिक विशाल और लंबे हैं; नगर बड़े हैं और आकाश तक किलेबंद हैं[b]; और हमने वहाँ अनाक के वंशजों[c] को भी देखा है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “हमारे हृदयों को पिघला दिया है”; अर्थात हमारा साहस तोड़ दिया है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में, “आकाश में किलेबंद”; यह अत्यंत ऊँची किलेबंदी के लिए अतिशयोक्तिपूर्ण अभिव्यक्ति है।
    reason: cultural_note
  - marker: c
    text: या “अनाकी लोग” अथवा “अनाक की संतान”।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה אֲנַחְנוּ עֹלִים
  choice: हम कहाँ जा रहे हैं?
  rationale: प्रश्न गंतव्य के विषय में है। עלה का शाब्दिक अर्थ ‘ऊपर जाना’ है, पर यहाँ देश की ओर यात्रा के लिए प्रयुक्त हिब्रू गति-वाचक मुहावरा है; सहज हिन्दी में ‘कहाँ जा रहे हैं’ अर्थ स्पष्ट करता है।
- source_word: אַחֵינוּ
  choice: हमारे भाइयों
  rationale: पुल्लिंग बहुवचन और इस्राएली सहोदरों के लिए प्रयुक्त मूल संबोधन को सुरक्षित रखता है।
- source_word: הֵמַסּוּ אֶת־לְבָבֵנוּ
  choice: हमारे हृदय पिघला दिए हैं
  rationale: साहस टूटने की सजीव हिब्रू छवि को बनाए रखता है; अर्थ फुटनोट में स्पष्ट किया गया है।
- source_word: עַם גָּדוֹל וָרָם מִמֶּנּוּ
  choice: वे लोग हमसे अधिक विशाल और लंबे हैं
  rationale: גָּדוֹל आकार/विशालता और רָם ऊँचे कद को व्यक्त करता है; दोनों तुलनात्मक विशेषताएँ रखी गई हैं।
- source_word: עָרִים גְּדֹלֹת וּבְצוּרֹת בַּשָּׁמָיִם
  choice: उनके नगर बड़े हैं और उनकी किलेबंदी आकाश तक पहुँची हुई है
  rationale: बड़े नगर और अत्यंत ऊँची दृढ़ किलेबंदी—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करते हुए मूल अतिशयोक्तिपूर्ण आकाश-छवि सुरक्षित रखी गई है।
- source_word: וְגַם
  choice: और ... भी
  rationale: भय बढ़ाने वाले एक अतिरिक्त विवरण का संचयी बल स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי עֲנָקִים
  choice: अनाक के वंशजों
  rationale: शाब्दिक ‘पुत्रों’ की अपेक्षा वंशगत समुदाय का आशय आधुनिक पाठक के लिए स्पष्ट करता है, बिना उनके कद या स्वरूप के बारे में अतिरिक्त व्याख्या जोड़े।
- source_word: רָאִינוּ שָׁם
  choice: हमने वहाँ ... देखा है
  rationale: भाइयों की वर्तमान निराशा पर पूर्व दर्शन के बने हुए प्रभाव को स्वाभाविक हिन्दी पूर्ण भूत रूप में व्यक्त करता है।
