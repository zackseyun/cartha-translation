translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। प्रत्यक्ष कथन की भयभीत, बढ़ती हुई लय को अर्धविरामों और ‘और ... भी’ से बनाए रखा गया है। मूल की ‘हृदय पिघलने’ और ‘आकाश’ तक किलेबंदी की छवियाँ सपाट अर्थ में बदले बिना सुरक्षित हैं।
