source:
  edition: WLC
  text: זֽוּלָתִ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ ה֣וּא יִרְאֶ֔/נָּה וְ/לֽ/וֹ אֶתֵּ֧ן אֶת הָ/אָ֛רֶץ אֲשֶׁ֥ר דָּֽרַךְ בָּ֖/הּ וּ/לְ/בָנָ֑י/ו יַ֕עַן אֲשֶׁ֥ר מִלֵּ֖א אַחֲרֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/036.yaml
  text: except Caleb son of Jephunneh; he shall see it[a], and to him I will give the land on which he has walked, and to his sons, because he has fully followed Yahweh.
translation:
  language: hi
  text: यपुन्ने के पुत्र कालेब को छोड़कर कोई नहीं; वही उस भूमि को देखेगा। जिस भूमि पर उसने पाँव रखा है, वह भूमि मैं उसे और उसके पुत्रों[a] को दूँगा, क्योंकि उसने याहवे का पूरी तरह अनुसरण किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके बच्चे” अथवा “उसके वंशज”; इब्रानी में “उसके पुत्र” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֽוּלָתִי
  choice: ही इसका अपवाद है
  rationale: यह पहले बताए गए न्याय से कालेब को अलग करता है। हिन्दी में यह वाक्य-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: यपुन्ने का पुत्र कालेब
  rationale: व्यक्तिनामों का मानक हिन्दी लिप्यंतरण किया गया है और इब्रानी संबंध-रचना को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: יִרְאֶנָּה
  choice: वह उस देश को देखेगा
  rationale: स्त्रीलिंग कर्म-प्रत्यय का संदर्भ पिछले पद के 'देश' से है; हिन्दी में संदर्भ को स्पष्ट करने के लिए उसे व्यक्त किया गया है।
- source_word: וְלוֹ אֶתֵּן
  choice: उसे मैं उसको ... दूँगा
  rationale: इब्रानी में प्राप्तकर्ता पर दिए गए बल को 'उसको' द्वारा बनाए रखा गया है, जबकि वाक्य-विन्यास हिन्दी के अनुरूप है।
- source_word: הָאָרֶץ
  choice: देश / भूमि
  rationale: पहले उल्लेख में 'देश' प्रतिज्ञात भूभाग को स्वाभाविक रूप से दर्शाता है; अगले खंड में 'भूमि' ठोस स्थान और उस पर पाँव रखने की छवि के अनुकूल है।
- source_word: אֲשֶׁר דָּרַךְ בָּהּ
  choice: जिस भूमि पर उसने पाँव रखा है
  rationale: דָּרַךְ की चलने या पाँव रखने की ठोस छवि को सहज आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: וּלְבָנָיו
  choice: और उसके पुत्रों
  rationale: इब्रानी में स्पष्ट रूप से पुल्लिंग बहुवचन 'पुत्र' है; संभावित व्यापक वंशगत अर्थ को पादटिप्पणी में दिया गया है।
- source_word: יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: यह प्रतिज्ञा का कारण बताने वाला स्वाभाविक और संक्षिप्त हिन्दी संयोजक है।
- source_word: מִלֵּא אַחֲרֵי יְהוָה
  choice: पूरी निष्ठा से यहोवा के पीछे चला है
  rationale: शाब्दिक मुहावरे 'पीछे पूरा करना' का आशय पूर्ण या हार्दिक अनुसरण है। यह अनुवाद 'पीछे चलने' की मूल छवि और संपूर्ण निष्ठा, दोनों को रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबिल परंपरा में व्यापक रूप से पहचाना जाने वाला दैवी नाम है और मूल पाठ में उपस्थित व्यक्तिगत वाचा-नाम को सामान्य उपाधि से नहीं बदलता।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत दैवी नाम को प्रत्यक्ष नाम के रूप में रखा गया है। आधुनिक हिन्दी पाठकों में 'यहोवा' अधिक परिचित है; 'याहवे' एक मान्य वैकल्पिक लिप्यंतरण है।
- issue: בָּנָיו का दायरा
  choice: उसके पुत्रों
  alternative: उसकी सन्तान / उसके वंशजों
  rationale: मूल शब्द का प्रत्यक्ष रूप पुल्लिंग बहुवचन है, इसलिए मुख्य पाठ में 'पुत्रों' रखा गया है। उत्तराधिकार के संदर्भ में व्यापक वंशगत अर्थ संभव है, जिसे पादटिप्पणी स्वीकार करती है।
- issue: מִלֵּא אַחֲרֵי का आशय
  choice: पूरी निष्ठा से ... के पीछे चला
  alternative: पूरी तरह ... का अनुसरण किया
  rationale: पहला रूप इब्रानी की स्थानिक 'पीछे' वाली छवि को बचाते हुए सम्पूर्ण समर्पण का भाव स्पष्ट करता है; विकल्प अधिक व्याख्यात्मक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। न्यायात्मक अपवाद और प्रतिज्ञा का स्वर सुरक्षित है; 'पाँव रखा' मूल की ठोस छवि को बनाए रखता है।
