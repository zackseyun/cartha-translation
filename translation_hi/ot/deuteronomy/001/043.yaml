  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֲדַבֵּ֥ר אֲלֵי/כֶ֖ם וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּמְרוּ֙ אֶת פִּ֣י יְהוָ֔ה וַ/תָּזִ֖דוּ וַ/תַּעֲל֥וּ הָ/הָֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/043.yaml
  text: So I spoke to you[a], but you did not listen; you rebelled against the mouth of Yahweh, acted presumptuously, and went up into the hill country.
translation:
  language: hi
  text: तब मैंने तुमसे कहा, पर तुमने नहीं सुना। तुमने याहवे की आज्ञा का विरोध किया[a], धृष्टता की और पहाड़ी प्रदेश में चढ़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “याहवे के मुँह का विरोध किया”; अर्थात् याहवे ने जो आज्ञा दी थी, उसका विरोध किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: तब मैंने तुमसे कहा
  rationale: דבר का पिएल रूप ‘कहना/बोलना’ है। आरम्भिक वाव पिछले कथन से घटनाक्रम जोड़ता है, जिसे स्वाभाविक हिन्दी में ‘तब’ से व्यक्त किया गया है। אֲלֵיכֶם बहुवचन ‘तुमसे’ है; हिन्दी में इसका बहुवचन सन्दर्भ से स्पष्ट है।
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: पर तुमने नहीं सुना
  rationale: שׁמע में सुनने और आज्ञा मानने दोनों की अर्थ-छाया हो सकती है। यहाँ मूसा के कहने के साथ सीधा विरोध होने के कारण ‘नहीं सुना’ मूल की अस्पष्टता बनाए रखता है; अगला खण्ड विद्रोह को अलग से बताता है।
- source_word: וַתַּמְרוּ אֶת־פִּי יְהוָה
  choice: तुमने याहवे की आज्ञा का विरोध किया[a]
  rationale: מרה अधिकार के विरुद्ध विद्रोह या अवज्ञा को दर्शाता है। ‘मुँह’ के शाब्दिक इब्रानी मुहावरे का आशय याहवे द्वारा दी गई आज्ञा है; मुख्य पाठ में अर्थ स्पष्ट किया गया और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: וַתָּזִדוּ
  choice: धृष्टता की
  rationale: זיד यहाँ अभिमानपूर्वक, उद्दण्ड या दुस्साहसपूर्ण ढंग से काम करने का भाव देता है। ‘धृष्टता की’ इस नैतिक अर्थ को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַתַּעֲלוּ הָהָרָה
  choice: पहाड़ी प्रदेश में चढ़ गए
  rationale: עלה ऊपर जाने या चढ़ने का सामान्य क्रिया-पद है, और הָהָרָה का दिशासूचक रूप पर्वतीय भूभाग की ओर गति बताता है। सन्दर्भ में ‘पहाड़ी प्रदेश’ किसी एक पहाड़ के बजाय उस ऊँचे क्षेत्र को दर्शाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना हिन्दी लिपि में प्रस्तुत करता है।
- issue: אֶת־פִּי יְהוָה का मुहावरा
  choice: याहवे की आज्ञा का विरोध किया
  alternative: याहवे के मुँह का विरोध किया
  rationale: शाब्दिक ‘मुँह’ यहाँ उसके मुख से निकली आज्ञा का इब्रानी मुहावरा है। स्पष्ट हिन्दी के लिए मुख्य पाठ में आशय दिया गया है, जबकि पादटिप्पणी मूल रूप सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दूसरे पुरुष बहुवचन को हिन्दी के स्वाभाविक ‘तुम’ रूप से व्यक्त किया गया है। वाक्य-विन्यास में क्रमिक क्रियाओं और मूल पाठ की तीव्रता को बनाए रखा गया है।
