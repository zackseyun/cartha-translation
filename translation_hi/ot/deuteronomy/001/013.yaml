id: DEU.1.13
reference: Deuteronomy 1:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָב֣וּ לָ֠/כֶם אֲנָשִׁ֨ים חֲכָמִ֧ים וּ/נְבֹנִ֛ים וִ/ידֻעִ֖ים לְ/שִׁבְטֵי/כֶ֑ם וַ/אֲשִׂימֵ֖/ם בְּ/רָאשֵׁי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/013.yaml
  text: Choose for yourselves wise[a], discerning, and well-known men from your tribes[b], and I will appoint them as your heads.
translation:
  language: hi
  text: अपने गोत्रों में से बुद्धिमान, समझ-बूझ रखनेवाले और जाने-माने पुरुषों को अपने लिए चुन लो; तब मैं उन्हें तुम्हारे मुखिया[a] नियुक्त करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “सिर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: अपने लिए चुन लो
  rationale: यहाँ आज्ञार्थक क्रिया का आशय योग्य व्यक्तियों को प्रस्तुत करने अथवा चुनने से है; प्रसंगानुसार ‘चुन लो’ स्वाभाविक है, और לָכֶם का अपने हित में चयन करने का भाव ‘अपने लिए’ से व्यक्त होता है।
- source_word: אֲנָשִׁים
  choice: पुरुषों
  rationale: इब्रानी संज्ञा स्पष्ट रूप से पुल्लिंग बहुवचन है और इस प्रसंग में गोत्रीय नेतृत्व के लिए चुने जानेवाले पुरुषों को सूचित करती है।
- source_word: חֲכָמִים
  choice: बुद्धिमान
  rationale: नेतृत्व और न्याय के प्रसंग में यह व्यावहारिक बुद्धि और उचित निर्णय-क्षमता को सूचित करता है।
- source_word: וּנְבֹנִים
  choice: समझ-बूझ रखनेवाले
  rationale: בין से बना यह शब्द सूक्ष्म समझ और विवेकपूर्ण निर्णय पर बल देता है; यह हिंदी में सहज और स्पष्ट अभिव्यक्ति है।
- source_word: וִידֻעִים
  choice: जाने-माने
  rationale: निष्क्रिय कृदंत का भाव ऐसे व्यक्तियों का है जिन्हें समुदाय जानता और मान्यता देता हो, अर्थात जिनकी प्रतिष्ठा स्थापित हो।
- source_word: לְשִׁבְטֵיכֶם
  choice: अपने गोत्रों में से
  rationale: प्रसंग में गोत्र उन व्यक्तियों के चयन का स्रोत हैं; ‘में से’ इस संबंध को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: וַאֲשִׂימֵם
  choice: तब मैं उन्हें ... नियुक्त करूँगा
  rationale: लोगों के चयन के बाद मूसा की परिणामी आधिकारिक कार्रवाई व्यक्त होती है; ‘नियुक्त करूँगा’ पदस्थापन का अर्थ देता है।
- source_word: בְּרָאשֵׁיכֶם
  choice: तुम्हारे मुखिया
  rationale: רֹאשׁ का शाब्दिक अर्थ ‘सिर’ है, पर यहाँ यह नेतृत्व का रूपक है; ‘मुखिया’ उसी रूपक और पद दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: אֲנָשִׁים का लिंग-सूचक नेतृत्व-संदर्भ
  choice: पुरुषों
  alternative: लोगों / व्यक्तियों
  rationale: मूल पाठ स्पष्ट रूप से पुल्लिंग बहुवचन प्रयोग करता है और तत्कालीन गोत्रीय पदाधिकारियों के चयन की बात करता है; इसलिए लिंग को तटस्थ नहीं किया गया।
- issue: चयन और नियुक्ति के बीच भूमिका-विभाजन
  choice: लोग चुनते हैं; मूसा नियुक्त करता है
  alternative: मूसा स्वयं चुनकर नियुक्त करता है
  rationale: הָבוּ לָכֶם लोगों को चयन/प्रस्तुति की आज्ञा देता है, जबकि וַאֲשִׂימֵם मूसा की बाद की नियुक्ति बताता है; अनुवाद इस तनाव और क्रम को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘समझ-बूझ रखनेवाले’ बोलचाल की स्पष्टता और न्यायिक विवेक दोनों व्यक्त करता है; ‘मुखिया’ मूल के नेतृत्व-रूपक को बनाए रखता है।
