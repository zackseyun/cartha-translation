  text: וַ/יְהִי֙ בְּ/אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/עַשְׁתֵּֽי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ דִּבֶּ֤ר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ אֲלֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/003.yaml
  text: And it happened in the fortieth year[a], in the eleventh month, on the first day of the month[b], that Moses spoke to the sons of Israel according to all that Yahweh had commanded him to them.
translation:
  language: hi
  text: चालीसवें वर्ष के ग्यारहवें महीने के पहले दिन मूसा ने इस्राएलियों से वे सारी बातें कहीं जिनकी आज्ञा यहोवा ने उसे उनके लिए दी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध का शाब्दिक अर्थ “उसे उनकी ओर/उनके संबंध में आज्ञा दी” भी हो सकता है; रचना संक्षिप्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[अलग से अनूदित नहीं]'
  rationale: यहाँ कथात्मक सूत्र मुख्यतः समय-निर्धारण प्रस्तुत करता है। स्वाभाविक हिन्दी में सीधे काल-सूचक वाक्य से आरम्भ करना इसके प्रवचनात्मक कार्य को पर्याप्त रूप से व्यक्त करता है।
- source_word: בְּאַרְבָּעִים שָׁנָה
  choice: चालीसवें वर्ष
  rationale: इस तिथि-सूचक रचना में मूल संख्या क्रमवाचक अर्थ रखती है; हिन्दी में यही स्वाभाविक रूप है।
- source_word: בְּעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: ग्यारहवें महीने
  rationale: इब्रानी रचना यहाँ महीने की क्रम-संख्या बताती है।
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: पहले दिन
  rationale: यह मानक तिथि-सूचक पद है; प्रसंग में 'महीने के पहले दिन' स्पष्ट और स्वाभाविक है।
- source_word: דִּבֶּר
  choice: कहा
  rationale: इस प्रसंग में דבר का सामान्य व व्यापक अर्थ है; 'कहा' सहज हिन्दी है और वाणी के प्रकार को अनावश्यक रूप से सीमित नहीं करता।
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों से
  rationale: शाब्दिक रूप 'इस्राएल के पुत्रों' है, पर सामूहिक जातीय संबोधन के लिए 'इस्राएलियों' आधुनिक हिन्दी में अधिक स्वाभाविक और समावेशी है।
- source_word: כְּכֹל אֲשֶׁר
  choice: वह सब
  rationale: כְּ conformity का भाव देता है, पर हिन्दी में 'वह सब कहा जो...' उसी अर्थ को स्वाभाविक रूप से संप्रेषित करता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: पूर्ण भूतकाल यह स्पष्ट करता है कि यहोवा की आज्ञा मूसा के बोलने से पहले दी गई थी।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण 'यहोवा' रखा गया है।
- source_word: אֹתוֹ אֲלֵהֶם
  choice: उसे उनके लिए
  rationale: संक्षिप्त इब्रानी रचना शाब्दिक रूप से 'उसे, उनकी ओर/उनसे' है। 'उनके लिए' आज्ञा में निहित संदेश के लक्ष्य को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है; इसलिए उसे सामान्य उपाधि 'प्रभु' से प्रतिस्थापित नहीं किया गया।
- issue: אֹתוֹ אֲלֵהֶם की संक्षिप्त और कुछ अस्पष्ट रचना
  choice: उसे उनके लिए आज्ञा दी थी
  alternative: उसे उनसे कहने की आज्ञा दी थी
  rationale: '''उनके लिए'' मूल की लक्ष्य/संबंध-सूचक अस्पष्टता को अपेक्षाकृत सुरक्षित रखता है; विकल्प अर्थ स्पष्ट करता, पर मूल में निहित ''कहने'' को जोड़ देता।'
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। तिथि को हिन्दी के स्वाभाविक क्रम में रखा गया है। पद में कोई फुटनोट आवश्यक नहीं समझा गया।
