base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/041.yaml
  text: Then you answered and said to me[a], ‘We have sinned against Yahweh. We ourselves will go up and fight, according to all that Yahweh our God commanded us.’ Then each man strapped on his weapons of war[b], and you presumptuously set out to go up into the hill country.
translation:
  language: hi
  text: तब तुमने मुझे उत्तर दिया, “हमने याहवे के विरुद्ध पाप किया है। हम ऊपर जाकर लड़ेंगे, ठीक उस सब के अनुसार जिसकी आज्ञा हमारे परमेश्वर याहवे ने हमें दी है।” तब हर एक ने अपने युद्ध के हथियार कस लिए, और तुमने पहाड़ी प्रदेश में चढ़ने का दुस्साहस किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दुर्लभ इब्रानी क्रिया का अर्थ अति-आत्मविश्वास या उतावलेपन से कदम उठाना हो सकता है; “तुम उतावली से चढ़ने लगे” भी अनुवादित किया जा सकता है। शाब्दिक रूप से “पर्वत” है; यहाँ इससे व्यापक पहाड़ी प्रदेश का बोध हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנוּ וַתֹּאמְרוּ אֵלַי
  choice: तब तुमने मुझे उत्तर दिया
  rationale: ענה और אמר का संयुक्त प्रयोग मूसा को दिए गए प्रत्युत्तर का परिचय देता है; हिन्दी में ‘उत्तर दिया’ स्वाभाविक और संक्षिप्त है।
- source_word: חָטָאנוּ לַיהוָה
  choice: हमने याहवे के विरुद्ध पाप किया है
  rationale: חטא के साथ ל यहाँ उस व्यक्ति को चिह्नित करता है जिसके विरुद्ध अपराध हुआ; ‘के विरुद्ध पाप किया’ स्वाभाविक हिन्दी है।
- source_word: נַעֲלֶה וְנִלְחַמְנוּ
  choice: हम ऊपर जाकर लड़ेंगे
  rationale: עלה की ऊपर की ओर गति और לחם के युद्ध करने के अर्थ, दोनों को स्पष्ट और सहज रूप में रखा गया है।
- source_word: כְּכֹל אֲשֶׁר צִוָּנוּ
  choice: ठीक उस सब के अनुसार जिसकी आज्ञा ... ने हमें दी है
  rationale: ככל אשר आज्ञा की संपूर्णता और उसके अनुरूप कार्य करने के दावे को व्यक्त करता है।
- source_word: וַתַּחְגְּרוּ אִישׁ אֶת כְּלֵי מִלְחַמְתּוֹ
  choice: तुममें से हर पुरुष ने अपने युद्ध के हथियार बाँध लिए
  rationale: חגר हथियार या युद्ध-सामग्री को शरीर पर बाँधने का बोध देता है; distributive אִישׁ को ‘हर पुरुष’ से व्यक्त किया गया है।
- source_word: וַתָּהִינוּ
  choice: तुम दुस्साहस करके ... निकल पड़े
  rationale: यह दुर्लभ क्रिया प्रसंग में उतावले, अति-आत्मविश्वासी और अनधिकृत कदम का नकारात्मक भाव देती है; ‘दुस्साहस करके’ उस भाव को बनाए रखता है।
- source_word: לַעֲלֹת הָהָרָה
  choice: पहाड़ी प्रदेश पर चढ़ने निकल पड़े
  rationale: दिशासूचक रूप ऊपर की ओर जाने को बताता है और הָהָר इस प्रसंग में किसी एक पर्वत के बजाय व्यापक पहाड़ी भूभाग का संकेत दे सकता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है।
- issue: וַתָּהִינוּ में इस्राएल के चढ़ने का नैतिक भाव
  choice: दुस्साहस करके ... निकल पड़े
  alternative: उतावली से चढ़ गए / चढ़ने को तैयार हो गए
  rationale: निकटवर्ती प्रसंग इस कार्य को परमेश्वर की चेतावनी के विरुद्ध अति-आत्मविश्वासी कदम बताता है। अनुवाद नकारात्मक भाव रखता है, जबकि दुर्लभ क्रिया की अनिश्चितता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष कथन में इस्राएल की स्वीकारोक्ति और उसके तुरंत बाद किए गए दुस्साहसी कार्य के बीच का तनाव सुरक्षित है। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनसे वे संबंधित हैं।
