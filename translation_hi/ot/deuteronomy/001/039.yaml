id: DEU.1.39
reference: Deuteronomy 1:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/טַפְּ/כֶם֩ אֲשֶׁ֨ר אֲמַרְתֶּ֜ם לָ/בַ֣ז יִהְיֶ֗ה וּ֠/בְנֵי/כֶם אֲשֶׁ֨ר לֹא יָדְע֤וּ הַ/יּוֹם֙ ט֣וֹב וָ/רָ֔ע הֵ֖מָּה יָבֹ֣אוּ שָׁ֑מָּ/ה וְ/לָ/הֶ֣ם אֶתְּנֶ֔/נָּה וְ/הֵ֖ם יִירָשֽׁוּ/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/039.yaml
  text: And your little ones[a], whom you said would become plunder, and your children, who today do not know good or evil—they shall go in there, and I will give it to them[c][b], and they shall possess it.
translation:
  language: hi
  text: और तुम्हारे छोटे बच्चे, जिनके विषय में तुमने कहा था, ‘वे लूट बन जाएँगे,’[a] और तुम्हारे बेटे, जो आज भले-बुरे की समझ नहीं रखते[b]—वे वहाँ प्रवेश करेंगे। मैं वह देश उन्हें दूँगा, और वे उस पर अधिकार करेंगे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वे शत्रुओं का शिकार बन जाएँगे’ अथवा ‘वे लूट का माल बन जाएँगे।’
    reason: lexical_alternative
  - marker: b
    text: ‘भले-बुरे की समझ नहीं रखते’ अपरिपक्व विवेक को व्यक्त करने वाला हिब्रू मुहावरा है।
    reason: cultural_note
  - marker: c
    text: या, ‘वे उसे उत्तराधिकार में पाएँगे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: तुम्हारे छोटे बच्चे
  rationale: טַף छोटे बच्चों अथवा आश्रित बाल-बच्चों को दर्शाता है। ‘छोटे बच्चे’ उनकी असहायता और वयस्क पीढ़ी से उनके भेद को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לָבַז יִהְיֶה
  choice: वे लूट बन जाएँगे
  rationale: בַּז युद्ध में शत्रु द्वारा ले जाई गई लूट को दर्शाता है। यह अनुवाद इस्राएलियों की आशंका को निकटता से बनाए रखता है।
- source_word: בְנֵיכֶם
  choice: तुम्हारे बेटे
  rationale: בְנֵיכֶם का रूप स्पष्ट रूप से पुल्लिंग बहुवचन है। ‘बेटे’ स्रोत की लैंगिक अभिव्यक्ति बनाए रखता है, यद्यपि प्रसंग का व्यापक संकेत अगली पीढ़ी की ओर है।
- source_word: לֹא יָדְעוּ הַיּוֹם טוֹב וָרָע
  choice: जो आज भले-बुरे की समझ नहीं रखते
  rationale: शाब्दिक ‘भले और बुरे को नहीं जानते’ हिन्दी में अस्वाभाविक या अत्यधिक निरपेक्ष लग सकता है। ‘समझ नहीं रखते’ अपरिपक्व विवेक के हिब्रू भाव को स्पष्ट करता है, बिना किसी उत्तरदायित्व-सिद्धान्त का निर्णय किए।
- source_word: שָׁמָּה
  choice: वहाँ प्रवेश करेंगे
  rationale: गमनसूचक क्रिया के साथ שָׁמָּה पहले उल्लिखित देश के भीतर जाने को दर्शाता है। ‘वहाँ प्रवेश करेंगे’ हिन्दी में इस दिशा और प्रवेश दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶתְּנֶנָּה
  choice: मैं वह देश उन्हें दूँगा
  rationale: स्त्रीलिंग कर्म-प्रत्यय पहले उल्लिखित देश को संदर्भित करता है। हिन्दी में संदर्भ स्पष्ट रखने के लिए ‘वह देश’ व्यक्त किया गया है।
- source_word: יִירָשׁוּהָ
  choice: वे उस पर अधिकार करेंगे
  rationale: ירשׁ इस प्रसंग में प्रतिज्ञात देश को प्राप्त करके अपने अधिकार में लेने का भाव देता है। ‘अधिकार करेंगे’ इस अर्थ को संक्षेप और स्वाभाविक रूप में व्यक्त करता है; ‘उत्तराधिकार में पाएँगे’ भी संभव है।
theological_decisions:
- issue: ‘भले-बुरे की समझ नहीं रखते’ में अगली पीढ़ी की नैतिक दशा
  choice: इसे अपरिपक्व विवेक का वर्णन माना गया है, पर किसी निश्चित धार्मिक उत्तरदायित्व-सिद्धान्त के रूप में नहीं।
  alternative: इसे वाचा-संबंधी अनुत्तरदायित्व या पूर्ण नैतिक निर्दोषता का कथन मानना।
  rationale: हिब्रू मुहावरा वयस्क निर्णय-क्षमता के अभाव को व्यक्त कर सकता है, पर यह पद अपने आप उत्तरदायित्व की आयु अथवा पूर्ण निर्दोषता के विषय में बाद की धर्मवैज्ञानिक बहसों का निर्णय नहीं करता।
- issue: יִירָשׁוּהָ में अधिकार और उत्तराधिकार का संबंध
  choice: मुख्य पाठ में ‘उस पर अधिकार करेंगे’ रखा गया और ‘उत्तराधिकार में पाएँगे’ को पाद-टिप्पणी में दिया गया।
  alternative: मुख्य पाठ में केवल ‘उत्तराधिकार में पाएँगे’ रखना।
  rationale: क्रिया में प्राप्त करने, अधिकार में लेने और उत्तराधिकार के परस्पर जुड़े भाव हैं। मुख्य पाठ भूमि पर वास्तविक अधिकार को व्यक्त करता है, जबकि पाद-टिप्पणी वाचागत उत्तराधिकार की संभावित छाया सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘छोटे बच्चे’ और ‘बेटे’ स्रोत में आए दो अलग पदों का भेद बनाए रखते हैं। ‘वह देश’ संदर्भ से स्पष्ट निहित कर्म को हिन्दी पाठक के लिए खुलकर बताता है। उद्धरण और दीर्घ विराम वाक्य की जटिल संरचना को पठनीय बनाते हैं।
