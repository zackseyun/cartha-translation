source:
  edition: WLC
  text: וָ/אֲצַוֶּה֙ אֶת שֹׁ֣פְטֵי/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר שָׁמֹ֤עַ בֵּין אֲחֵי/כֶם֙ וּ/שְׁפַטְתֶּ֣ם צֶ֔דֶק בֵּֽין אִ֥ישׁ וּ/בֵין אָחִ֖י/ו וּ/בֵ֥ין גֵּרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/016.yaml
  text: And at that time I commanded your judges[a], saying, ‘Hear the cases between your brothers[c][b], and judge righteously between a man and his brother or the resident foreigner with him.’
translation:
  language: hi
  text: 'उस समय मैंने तुम्हारे न्यायियों को आज्ञा दी: “अपने भाइयों के बीच के मामले सुनो और किसी व्यक्ति तथा उसके भाई या उसके साथ रहने वाले परदेशी के बीच न्यायपूर्वक निर्णय करो।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “न्यायपूर्वक” का अनुवाद “धार्मिकता से” भी हो सकता है। हिब्रू शब्द צֶדֶק न्याय और धार्मिकता—दोनों का भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: मैंने ... आज्ञा दी
  rationale: क्रिया צוה अधिकारपूर्वक आदेश देने को व्यक्त करती है; ‘आज्ञा दी’ हिन्दी में सीधा और प्रसंगानुकूल है।
- source_word: שֹׁפְטֵיכֶם
  choice: तुम्हारे न्यायियों
  rationale: यह संज्ञा कानूनी विवादों का निर्णय करने के लिए नियुक्त व्यक्तियों को दर्शाती है; ‘न्यायी’ स्पष्ट और बाइबिलीय गरिमा वाला आधुनिक हिन्दी शब्द है।
- source_word: שָׁמֹעַ בֵּין אֲחֵיכֶם
  choice: अपने भाइयों के बीच के मुकदमे सुनो
  rationale: שׁמע यहाँ न्यायिक सुनवाई का बोध देता है। ‘मुकदमे सुनो’ प्रसंग को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि ‘भाइयों’ से मूल का वाचा-समुदाय संबंधी भाषिक रूप बना रहता है।
- source_word: וּשְׁפַטְתֶּם צֶדֶק
  choice: निष्पक्षता से ... न्याय करो
  rationale: צֶדֶק न्यायिक संदर्भ में उचित और धर्मसम्मत निर्णय का बोध देता है। ‘निष्पक्षता से न्याय करो’ आधुनिक हिन्दी में न्यायिक आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֵּין אִישׁ וּבֵין אָחִיו
  choice: हर व्यक्ति का न्याय उसके भाई ... के साथ
  rationale: हिब्रू की एक पुरुष और उसके भाई वाली ठोस, संबंधपरक अभिव्यक्ति को हिन्दी में अर्थपूर्ण और सहज रूप दिया गया है।
- source_word: גֵּרוֹ
  choice: उसके साथ रहनेवाले परदेशी
  rationale: גֵּר किसी ऐसे गैर-इस्राएली निवासी को दर्शाता है जो समुदाय के बीच रहता और उसकी कानूनी सुरक्षा में होता है। ‘साथ रहनेवाला परदेशी’ उसके विदेशी और निवासी—दोनों पहलुओं को व्यक्त करता है।
theological_decisions:
- issue: אֲחֵיכֶם और אָחִיו में लिंगसूचक वाचा-समुदाय की भाषा
  choice: भाइयों / उसके भाई
  alternative: संगी इस्राएलियों / पड़ोसी
  rationale: मूल में प्रयुक्त पुरुषवाची संबंध-सूचक भाषा को बनाए रखने से इस्राएल को भाईचारे के समुदाय के रूप में प्रस्तुत करने वाला रूपक सुरक्षित रहता है; इसका आशय केवल पुरुषों तक सीमित करना नहीं है।
- issue: न्यायिक संदर्भ में צֶדֶק
  choice: निष्पक्षता से न्याय करो
  alternative: धार्मिकता से न्याय करो / न्यायपूर्वक निर्णय करो
  rationale: यह शब्द न्याय और धार्मिकता दोनों का अर्थ-क्षेत्र रखता है। यहाँ अदालत-सदृश प्रसंग में ‘निष्पक्षता’ स्वाभाविक है, जबकि पादटिप्पणी नैतिक-धार्मिक आयाम सुरक्षित रखती है।
- issue: אָחִיו और גֵּרוֹ के बीच संबंध
  choice: उसके भाई या उसके साथ रहनेवाले परदेशी के साथ
  alternative: उसके भाई और उसके परदेशी के बीच
  rationale: 'हिब्रू समांतर पक्षों को रखता है: विवाद किसी इस्राएली भाई के साथ हो या उससे संबद्ध निवासी परदेशी के साथ। ‘या’ हिन्दी में इस वैकल्पिक संबंध को स्पष्ट करता है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘न्यायी’, ‘मुकदमे’ और ‘परदेशी’ न्यायिक तथा वाचा-समुदाय के प्रसंग को स्पष्ट रखते हैं। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
