  text: וַ/תִּקְרְב֣וּ/ן אֵלַ/י֮ כֻּלְּ/כֶם֒ וַ/תֹּאמְר֗וּ נִשְׁלְחָ֤ה אֲנָשִׁים֙ לְ/פָנֵ֔י/נוּ וְ/יַחְפְּרוּ לָ֖/נוּ אֶת הָ/אָ֑רֶץ וְ/יָשִׁ֤בוּ אֹתָ֨/נוּ֙ דָּבָ֔ר אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר נַעֲלֶה בָּ֔/הּ וְ/אֵת֙ הֶֽ/עָרִ֔ים אֲשֶׁ֥ר נָבֹ֖א אֲלֵי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/022.yaml
  text: Then all of you came near to me and said[a], ‘Let us send men ahead of us, so that they may explore the land for us and bring us back word of the way by which we should go up into it[b], and of the cities into which we shall come.’
translation:
  language: hi
  text: तब तुम सब मेरे पास आए और बोले, “हम अपने आगे पुरुषों को भेजें, ताकि वे हमारे लिए उस देश का पता लगाएँ[a] और लौटकर हमें बताएँ कि हमें किस मार्ग से उसमें चढ़कर जाना है[b] और किन नगरों में प्रवेश करना है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारे लिए उस देश की छानबीन करें।” इब्रानी क्रिया खोजने, जाँचने या पता लगाने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “जिस मार्ग से हम उसमें चढ़ें।” “चढ़कर जाना” देश में प्रवेश करने के लिए प्रयुक्त सामान्य बाइबिलीय मुहावरे को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם
  choice: तब तुम सब मेरे पास आए
  rationale: क़रब का अर्थ निकट आना या पास आना है; ‘तुम सब’ כֻּלְּכֶם के बलाघात को स्वाभाविक हिन्दी में रखता है।
- source_word: נִשְׁלְחָה אֲנָשִׁים
  choice: हम ... कुछ पुरुषों को भेजें
  rationale: कोहोर्टेटिव रूप सामूहिक प्रस्ताव व्यक्त करता है। אֲנָשִׁים यहाँ चुने जाने वाले वयस्क पुरुषों के लिए है; ‘कुछ’ हिन्दी में अनिश्चित संख्या को स्वाभाविक बनाता है।
- source_word: לְפָנֵינוּ
  choice: अपने आगे
  rationale: शाब्दिक ‘हमारे सामने’ के बजाय यह आगे भेजे जाने की गति और उद्देश्य को सहज हिन्दी में व्यक्त करता है।
- source_word: וְיַחְפְּרוּ לָנוּ אֶת הָאָרֶץ
  choice: हमारे लिए उस देश का पता लगाएँ
  rationale: חפר यहाँ भूमि की खोजबीन या जाँच करने को दर्शाता है। ‘पता लगाएँ’ आधुनिक और स्पष्ट है तथा गुप्तचरी का भाव अनावश्यक रूप से नहीं जोड़ता।
- source_word: וְיָשִׁבוּ אֹתָנוּ דָּבָר
  choice: लौटकर हमें बताएँ
  rationale: हिब्रू मुहावरा किसी बात या समाचार को वापस लाने का है; हिन्दी में यह स्वाभाविक रूप से प्रतिवेदन देने का अर्थ व्यक्त करता है।
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר נַעֲלֶה בָּהּ
  choice: हमें किस मार्ग से वहाँ चढ़कर जाना है
  rationale: ‘मार्ग’ דֶּרֶךְ को और ‘चढ़कर जाना’ עלה के आरोहण-संबंधी बाइबिलीय प्रयोग को बनाए रखता है। प्रश्नवाचक विन्यास माँगी गई जानकारी को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וְאֵת הֶעָרִים אֲשֶׁר נָבֹא אֲלֵיהֶן
  choice: और किन नगरों में प्रवेश करना है
  rationale: यह उन नगरों के विषय में माँगी गई जानकारी को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है जिनमें इस्राएली जाने वाले हैं।
