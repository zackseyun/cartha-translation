  yaml_path: translation/ot/deuteronomy/001/037.yaml
  text: Yahweh was angry with me also because of you[a], saying[b], 'You also shall not enter there.'
translation:
  language: hi
  text: तुम्हारे कारण याहवे मुझ पर भी क्रोधित हुआ[a] और उसने कहा[b], “तुम भी वहाँ प्रवेश नहीं करोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे कारण याहवे मुझसे भी क्रोधित हुआ।”
    reason: क्रोध के लक्ष्य को व्यक्त करने वाले בִּי का हिन्दी में वैकल्पिक स्वाभाविक रूप।
  - marker: b
    text: गिनती 20:12 से तुलना करें, जहाँ मूसा का देश में प्रवेश न करना मरीबा में उसकी अपनी विफलता से जुड़ा है; यहाँ व्यवस्थाविवरण इस मामले में लोगों की भूमिका पर बल देता है।
    reason: संबंधित पदों के बीच धर्मशास्त्रीय तनाव को मिटाए बिना पाठक के सामने रखता है।
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: दोनों occurrences में यह योग और बल को व्यक्त करता है; आधुनिक हिन्दी में ‘भी’ स्वाभाविक है।
- source_word: בִּי הִתְאַנַּף
  choice: मुझ पर क्रोधित हुआ
  rationale: क्रोध के लक्ष्य को सूचित करने वाले בִּי और Hitpael क्रिया के अर्थ को स्पष्ट, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है, उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בִּגְלַלְכֶם
  choice: तुम्हारे कारण
  rationale: यह वाक्यांश कारण या प्रसंग को व्यक्त करता है; ‘तुम्हारे कारण’ सीधा और स्वाभाविक अनुवाद है।
- source_word: לֵאמֹר
  choice: और उसने कहा
  rationale: यह आगे आने वाले ईश्वरीय कथन का परिचय देता है; हिन्दी में स्वतंत्र क्रिया के रूप में यह अधिक स्वाभाविक है।
- source_word: גַּם אַתָּה
  choice: तुम भी
  rationale: एकवचन ‘तुम’ मूसा को संबोधित करता है और ‘भी’ उसके समावेश पर बल बनाए रखता है।
- source_word: לֹא תָבֹא שָׁם
  choice: वहाँ प्रवेश नहीं करोगे
  rationale: भूमि में जाने के संदर्भ में בוא का प्रसंगगत अर्थ ‘प्रवेश करना’ है; שָׁם का स्थानवाचक बल ‘वहाँ’ से सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी के सामान्य बाइबलीय प्रयोग में ‘यहोवा’ पहचानने योग्य लिप्यंतरण है और मूल के व्यक्तिगत नाम को उपाधि से नहीं बदलता।
- issue: मूसा के निष्कासन में लोगों की भूमिका
  choice: पद के अनुसार यहोवा का क्रोध ‘तुम्हारे कारण’ बताया गया है
  alternative: गिनती 20 के आधार पर मुख्य पाठ में मूसा की अपनी विफलता को स्पष्ट करना
  rationale: व्यवस्थाविवरण के इस पद का कारणात्मक कथन ज्यों का त्यों रखा गया है; व्यापक धर्मशास्त्रीय तनाव को मुख्य पाठ में सामंजस्य बैठाकर समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। वाक्य-क्रम को हिन्दी की स्वाभाविकता के अनुसार रखा गया है, जबकि दोनों ‘भी’, कारणात्मक वाक्यांश और प्रत्यक्ष कथन सुरक्षित हैं।
