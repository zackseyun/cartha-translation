source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֗ם אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם לְמַ֣עַן תַּשְׂכִּ֔ילוּ אֵ֖ת כָּל אֲשֶׁ֥ר תַּעֲשֽׂוּ/ן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/008.yaml
  text: So keep the words of this covenant and do them[a], so that you may act wisely in all that you do.
translation:
  language: hi
  text: इसलिए इस वाचा की बातों का पालन करो और उन्हें पूरा करो, ताकि तुम जो कुछ करो उसमें समझ-बूझ से काम लो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम जो कुछ करो उसमें सफल हो।”
    reason: תַּשְׂכִּילוּ का अर्थ बुद्धिमानी से काम करना या सफल होना हो सकता है।
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: इसलिए … पालन करो
  rationale: שׁמר का वाचा-संबंधी अर्थ उसके आदेशों या बातों को मानना और उनका पालन करना है। आरंभिक ו को पिछले संदर्भ से निष्कर्षात्मक संबंध दिखाने के लिए ‘इसलिए’ से व्यक्त किया गया है।
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: इस वाचा की बातों
  rationale: דִּבְרֵי का शाब्दिक संबंध वाचा के कथनों या निर्धारित बातों से है। ‘बातों’ सहज हिन्दी है और ‘शर्तों’ की अपेक्षा मूल रूप के अधिक निकट रहती है।
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: उन्हें पूरा करो
  rationale: बहुवचन ‘उन्हें’ का संबंध ‘बातों’ से रखा गया है। हिन्दी में ‘उन्हें करो’ अस्वाभाविक है; ‘पूरा करो’ आज्ञाओं या निर्धारित बातों को व्यवहार में लाने का अर्थ स्वाभाविक रूप से देता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणामी अभिप्राय प्रकट करता है; ‘ताकि’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: תַּשְׂכִּילוּ
  choice: समझ-बूझ से काम लो
  rationale: שׂכל के हिफ़ील रूप में बुद्धिमानी से व्यवहार करने और फलतः सफल होने—दोनों का अर्थक्षेत्र है। मुख्य पाठ में ‘समझ-बूझ से काम लो’ क्रियात्मक अर्थ को सीधे व्यक्त करता है; सफलता का अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֵת כָּל אֲשֶׁר תַּעֲשׂוּן
  choice: अपने हर काम में
  rationale: यह उस व्यापक क्षेत्र को दर्शाता है जिसमें इस्राएल को समझदारी से काम लेना है। ‘अपने हर काम में’ כָּל की समग्रता को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: תַּשְׂכִּילוּ में बुद्धिमानी और सफलता का संबंध
  choice: मुख्य पाठ में ‘समझ-बूझ से काम लो’
  alternative: ‘अपने हर काम में सफल हो’
  rationale: हिब्रू क्रिया बुद्धिमानी से कार्य करने और उससे जुड़ी सफलता—दोनों अर्थ दे सकती है। मुख्य पाठ क्रिया के व्यवहारगत पक्ष को रखता है और पादटिप्पणी परिणामगत अर्थ को सुरक्षित रखती है, जिससे वाचा की आशीष को न तो मिटाया जाता है, न आधुनिक ‘समृद्धि’ की धारणा से अनावश्यक रूप से जोड़ा जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वाचा’ बाइबलीय covenant के लिए स्थापित धार्मिक शब्द है। आदेशों के बहुवचन संदर्भ को ‘उन्हें’ द्वारा स्पष्ट रूप से सुरक्षित रखा गया है।
