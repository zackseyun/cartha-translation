source:
  edition: WLC
  text: וְ/הִבְדִּיל֤/וֹ יְהוָה֙ לְ/רָעָ֔ה מִ/כֹּ֖ל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹל֙ אָל֣וֹת הַ/בְּרִ֔ית הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/020.yaml
  text: And Yahweh will single him out from all the tribes of Israel for disaster[a], according to all the curses of the covenant written in this book of the law.
translation:
  language: hi
  text: और यहोवा उसे इस्राएल के सभी गोत्रों में से विपत्ति के लिए अलग करेगा, इस व्यवस्था की पुस्तक में लिखी हुई वाचा के सभी शापों[a] के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वाचा के शपथ-शापों।’ इब्रानी शब्द शपथ के द्वारा लागू किए गए वाचा-संबंधी शापों का विशेष अर्थ भी रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדִּילוֹ
  choice: उसे ... अलग करके ... ठहराएगा
  rationale: בדל के हिफ़ील रूप में किसी व्यक्ति को समुदाय से अलग करने का कारणात्मक भाव है। दण्ड के इस प्रसंग में संयुक्त अभिव्यक्ति अलग किए जाने और विपत्ति के लिए नियत किए जाने—दोनों को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לְרָעָה
  choice: विपत्ति के लिए
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, बल्कि वाचा-भंग के फलस्वरूप आने वाली हानि और विनाशकारी दण्ड को सूचित करता है।
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी गोत्रों में से
  rationale: מִן बड़े समुदाय के बीच से अलग किए जाने को दर्शाता है; ‘में से’ इस सम्बन्ध को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: כְּכֹל
  choice: ठीक ... सभी ... के अनुसार
  rationale: כְּ दण्ड और लिखित वाचा-शापों के बीच अनुरूपता व्यक्त करता है; ‘ठीक ... के अनुसार’ इस बल को बनाए रखता है।
- source_word: אָלֹות הַבְּרִית
  choice: वाचा के ... सभी शापों
  rationale: אָלָה वाचा के प्रसंग में शपथ के साथ लगाए गए शापों को सूचित कर सकता है। मुख्य पाठ में ‘शाप’ स्पष्ट है और वाचा-संबंधी संदर्भ मूल अर्थ को पर्याप्त रूप से सँभालता है।
- source_word: הַכְּתוּבָה
  choice: जो ... लिखे हैं
  rationale: स्त्रीलिंग एकवचन कृदन्त व्याकरणतः सामूहिक ‘वाचा’ से जुड़ा हो सकता है, पर अर्थतः पुस्तक में लिखे वाचा-शापों को निर्दिष्ट करता है; हिन्दी में बहुवचन सम्बन्धवाक्य अधिक स्वाभाविक है।
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: इस व्यवस्था की पुस्तक में
  rationale: סֵפֶר को ‘पुस्तक’ और תּוֹרָה को इस वाचा-संबंधी विधि-संग्रह के संदर्भ में ‘व्यवस्था’ कहना हिन्दी बाइबलीय प्रयोग में स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; उसे उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले नाम ‘यहोवा’ से रखा गया है।
- issue: לְרָעָה में न्याय का स्वरूप
  choice: विपत्ति के लिए
  alternative: बुराई के लिए
  rationale: संदर्भ वाचा के शाप और दण्ड का है। ‘विपत्ति’ न्यायजनित विनाश को व्यक्त करती है, जबकि ‘बुराई’ हिन्दी में नैतिक दुष्टता का भ्रामक संकेत दे सकती है।
- issue: אָלֹות का वाचा-संबंधी अर्थ
  choice: शापों
  alternative: शपथ-शापों
  rationale: शब्द में शपथ द्वारा आहूत शापों का विशेष भाव संभव है, पर ‘वाचा के शाप’ मुख्य पाठ में अर्थ को स्पष्ट और पठनीय रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी लिपि और गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज वाक्य-विन्यास अपनाया गया है। ‘गोत्र’, ‘वाचा’ और ‘व्यवस्था’ जैसे स्थापित बाइबलीय पद संदर्भगत सटीकता के लिए रखे गए हैं।
