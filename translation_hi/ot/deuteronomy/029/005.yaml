source:
  edition: WLC
  text: לֶ֚חֶם לֹ֣א אֲכַלְתֶּ֔ם וְ/יַ֥יִן וְ/שֵׁכָ֖ר לֹ֣א שְׁתִיתֶ֑ם לְמַ֨עַן֙ תֵּֽדְע֔וּ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/005.yaml
  text: You did not eat bread[a], and you did not drink wine or strong drink, so that you might know that I am Yahweh your God.
translation:
  language: hi
  text: तुमने न रोटी खाई और न दाखमधु या मादक पेय[a] पिया, ताकि तुम जानो कि मैं याहवे, तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ व्यापक रूप से कोई किण्वित मादक पेय है; यह आवश्यक नहीं कि किसी एक विशेष प्रकार के पेय को दर्शाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: रोटी
  rationale: मूल अर्थ ‘रोटी’ है। यहाँ इसे सामान्य ‘भोजन’ के रूप में विस्तृत करने के बजाय इब्रानी की ठोस अभिव्यक्ति बनाए रखी गई है।
- source_word: אֲכַלְתֶּם
  choice: तुमने न ... खाई
  rationale: इब्रानी पूर्ण क्रिया यहाँ बीते हुए मरुभूमि-अनुभव का सार देती है; सरल भूतकाल आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: यह अंगूर से बने मद्य के लिए प्रचलित बाइबलीय हिन्दी शब्द है और अगले व्यापक मद्यवाचक शब्द से भेद बनाए रखता है।
- source_word: שֵׁכָר
  choice: मादक पेय
  rationale: यह शब्द दाखमधु से अलग अन्य किण्वित, नशीले पेयों को व्यापक रूप से दर्शाता है; ‘बीयर’ अनावश्यक रूप से संकीर्ण होता।
- source_word: שְׁתִיתֶם
  choice: न ... पिया
  rationale: सरल भूतकाल प्रसंग के पुनरावलोकन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: उद्देश्य अथवा अभिप्रेत परिणाम को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תֵּדְעוּ
  choice: तुम जानो
  rationale: लְמַעַן के बाद यह अभिप्रेत परिणाम को व्यक्त करता है; हिन्दी में ‘ताकि तुम जानो’ सहज और अर्थनिष्ठ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन संबंधसूचक रचना और वाचा-संबंध को सीधे व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसका निकट प्रचलित लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: לְמַעַן में उद्देश्य और परिणाम का संबंध
  choice: ताकि तुम जानो
  alternative: जिससे तुम जान सको
  rationale: इब्रानी वाक्य उद्देश्य या अभिप्रेत परिणाम, दोनों की छाया रख सकता है। ‘ताकि’ इस संबंध को बनाए रखता है और किसी कठोर कारणात्मक व्याख्या को नहीं थोपता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। बहुवचन ‘तुम’ को हिन्दी की स्वाभाविक सामूहिक संबोधन-रीति में रखा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी का चिह्न ‘bread’ के बाद था, पर उसकी सामग्री שֵׁכָר से संबंधित है; इसलिए हिन्दी मुख्य पाठ में चिह्न ‘मादक पेय’ के बाद रखा गया है।
