base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/026.yaml
  text: So the anger of Yahweh burned against that land, to bring upon it every curse written in this book.
translation:
  language: hi
  text: इसलिए उस देश के विरुद्ध यहोवा का क्रोध भड़क उठा, ताकि वह उस पर इस पुस्तक में लिखा हुआ हर शाप लाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: क्रोध भड़क उठा
  rationale: यह इब्रानी मुहावरे की जलने या भड़कने की सजीव छवि बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: בָּאָרֶץ הַהִוא
  choice: उस देश के विरुद्ध
  rationale: यहाँ ב क्रोध के लक्ष्य को सूचित करता है; न्याय के प्रसंग में 'के विरुद्ध' इस दिशा को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְהָבִיא עָלֶיהָ
  choice: उस पर ... ला दिया
  rationale: इन शब्दों में क्रोध के फल या परिणामस्वरूप दण्ड के देश पर आने का भाव है; हिन्दी वाक्य में कर्ता को स्पष्ट करने के लिए 'उसने' जोड़ा गया है।
- source_word: כָּל הַקְּלָלָה
  choice: हर शाप
  rationale: एकवचन संज्ञा यहाँ समष्टिगत अर्थ रखती है; 'हर शाप' पूर्णता को सहज हिन्दी में व्यक्त करता है।
- source_word: הַכְּתוּבָה
  choice: लिखा हुआ
  rationale: यह निष्क्रिय कृदन्त का सीधा अर्थ है और लिखित वाचा-दस्तावेज़ के न्यायिक भाव को बनाए रखता है।
- source_word: בַּסֵּפֶר הַזֶּה
  choice: इस पुस्तक में
  rationale: סֵפֶר पुस्तक, पत्र या लपेटे हुए ग्रन्थ को सूचित कर सकता है; इस प्रसंग में 'पुस्तक' सबसे सुलभ और मानक विकल्प है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबल-परंपरा में व्यापक रूप से पहचाने जाने वाले 'यहोवा' को रखा गया है, न कि उसे 'प्रभु' जैसी उपाधि से बदला गया है; 'याहवे' अधिक समीपस्थ वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। 'क्रोध भड़क उठा' मूल मुहावरे की तीव्रता और अग्नि-संबंधी छवि को बनाए रखता है; वाक्य-विन्यास हिन्दी की स्वाभाविकता के लिए हल्का पुनर्गठित है।
