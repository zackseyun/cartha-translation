  yaml_path: translation/ot/deuteronomy/029/010.yaml
  text: your little ones[a], your wives, and the sojourner who is in the midst of your camp, from the one who chops your wood to the one who draws your water[b],
translation:
  language: hi
  text: तुम्हारे छोटे बच्चे[a], तुम्हारी पत्नियाँ, और तुम्हारे शिविर के बीच रहने वाला परदेशी[b]—तुम्हारी लकड़ी काटने वाले से लेकर तुम्हारा पानी निकालने वाले तक—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे बाल-बच्चे।” इब्रानी शब्द טַף विशेष रूप से छोटे बच्चों या आश्रितों के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात समुदाय के बीच रहने वाला विदेशी निवासी। इब्रानी शब्द גֵּר केवल किसी राहगीर या अपरिचित व्यक्ति को नहीं दर्शाता।
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: तुम्हारे छोटे बच्चे
  rationale: טַף विशेष रूप से छोटे बच्चों अथवा आश्रित बालकों को सूचित करता है; ‘छोटे बच्चे’ इसका ठोस और स्वाभाविक हिन्दी रूप है।
- source_word: נְשֵׁיכֶם
  choice: तुम्हारी पत्नियाँ
  rationale: वाचा-सभा के इस प्रसंग में संबंधसूचक बहुवचन का स्वाभाविक अर्थ ‘पत्नियाँ’ है।
- source_word: וְגֵרְךָ
  choice: और ... परदेशी
  rationale: גֵּר समुदाय के भीतर रहने वाले विदेशी निवासी को सूचित करता है, केवल राहगीर या अपरिचित को नहीं; एकवचन सामूहिक रूप बनाए रखा गया है।
- source_word: אֲשֶׁר בְּקֶרֶב מַחֲנֶיךָ
  choice: तुम्हारे शिविर के बीच रहने वाला
  rationale: यह रूप אֲשֶׁר को स्पष्ट करता है और शिविर के भीतर समुदाय के बीच निवास करने का स्थानिक भाव सुरक्षित रखता है।
- source_word: מֵחֹטֵב עֵצֶיךָ
  choice: तुम्हारे लिए लकड़ी काटने वाले से
  rationale: कृदन्त का कर्तृवाचक बल रखा गया है; हिन्दी में ‘तुम्हारे लिए’ स्वामित्व के बजाय सेवा-संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַד שֹׁאֵב מֵימֶיךָ
  choice: तुम्हारे लिए पानी भरने वाले तक
  rationale: שֹׁאֵב का अर्थ कुएँ आदि से पानी निकालना या भरना है; ‘से लेकर ... तक’ מִן־עַד की विस्तार-संरचना को स्पष्ट करता है।
theological_decisions:
- issue: वाचा-सभा का सामाजिक विस्तार
  choice: सूची में छोटे बच्चे, पत्नियाँ, समुदाय में रहने वाला परदेशी और निम्न-प्रतिष्ठित श्रम करने वाले सभी सम्मिलित हैं।
  alternative: इसे केवल जातीय इस्राएलियों की सूची या श्रमिकों को रूपक मानकर पढ़ना।
  rationale: इब्रानी पाठ वास्तविक सामाजिक समूहों और कार्यों की समावेशी गणना करता है; अनुवाद इस विस्तार को संकुचित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पिछले वाक्य की सूची का अंश है, इसलिए अंत में पूर्णविराम के बजाय विराम-चिह्न रखा गया है। ‘परदेशी’ के सामाजिक-कानूनी अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
