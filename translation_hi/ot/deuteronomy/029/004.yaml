source:
  edition: WLC
  text: וָ/אוֹלֵ֥ךְ אֶתְ/כֶ֛ם אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לֹֽא בָל֤וּ שַׂלְמֹֽתֵי/כֶם֙ מֵ/עֲלֵי/כֶ֔ם וְ/נַֽעַלְ/ךָ֥ לֹֽא בָלְתָ֖ה מֵ/עַ֥ל רַגְלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/004.yaml
  text: And I led you forty years in the wilderness; your clothes did not wear out on you[a], and your sandal did not wear out on your foot.
translation:
  language: hi
  text: और मैं तुम्हें चालीस वर्ष तक मरुभूमि में लिए चला; तुम्हारे कपड़े तुम्हारे ऊपर रहते हुए नहीं घिसे, और तेरी चप्पल तेरे पाँव पर नहीं घिसी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאוֹלֵךְ
  choice: मैं ... लिए चला
  rationale: הלך के हिफ़ील रूप का कारक भाव है, अर्थात चलाना या आगे ले जाना। प्रसंग में यह परमेश्वर द्वारा इस्राएल को वीराने से होकर ले चलने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּמִּדְבָּר
  choice: वीराने में
  rationale: מִדְבָּר निर्जन और शुष्क भूभाग को दर्शाता है। ‘वीराना’ आधुनिक हिन्दी में बोधगम्य है और केवल रेतीले ‘रेगिस्तान’ तक अर्थ को सीमित नहीं करता।
- source_word: בָּלוּ / בָלְתָה
  choice: पुराने नहीं हुए / पुरानी नहीं हुई
  rationale: בלה यहाँ लगातार उपयोग से कपड़ों और चप्पल के जर्जर या अनुपयोगी हो जाने का बोध देता है। ‘पुराना होना’ सहज हिन्दी है; नकार के साथ आशय है कि वे घिसकर खराब नहीं हुए।
- source_word: שַׂלְמֹתֵיכֶם
  choice: तुम्हारे कपड़े
  rationale: यह बहुवचन सामान्य रूप से पहने जाने वाले वस्त्रों को दर्शाता है। ‘कपड़े’ साधारण आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
- source_word: מֵעֲלֵיכֶם
  choice: तुम्हारे शरीर पर
  rationale: शाब्दिक भाव ‘तुम्हारे ऊपर से’ है। कपड़ों के पहने हुए रहते हुए पुराने न होने की तस्वीर स्पष्ट करने के लिए ‘तुम्हारे शरीर पर’ स्वाभाविक हिन्दी है।
- source_word: נַעַלְךָ
  choice: तेरी चप्पल
  rationale: נַעַל प्राचीन पादत्राण को दर्शाता है; ‘चप्पल’ ‘जूते’ की अपेक्षा ऐतिहासिक वस्तु के अधिक निकट है। एकवचन और दूसरे पुरुष एकवचन को स्रोत के संख्या-परिवर्तन सहित रखा गया है।
- source_word: מֵעַל רַגְלֶךָ
  choice: तेरे पाँव में
  rationale: शाब्दिक संरचना ‘तेरे पाँव के ऊपर से’ है। हिन्दी में पहनी हुई चप्पल के लिए ‘पाँव में’ स्वाभाविक है और मूल चित्र को बनाए रखता है।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष तक
  rationale: अवधि को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; ‘तक’ निरंतर अवधि का भाव देता है।
theological_decisions:
- issue: बहुवचन संबोधन (‘तुम्हें/तुम्हारे कपड़े’) से एकवचन (‘तेरी चप्पल/तेरे पाँव’) में परिवर्तन
  choice: अंतिम उपवाक्य में एकवचन बनाए रखा गया
  alternative: 'सुगमता के लिए बहुवचन करना: ‘तुम्हारी चप्पलें तुम्हारे पाँवों में पुरानी नहीं हुईं’'
  rationale: इब्रानी पाठ जानबूझकर या व्याकरणिक रूप से बहुवचन से एकवचन में बदलता है। यह इस्राएल को सामूहिक एकता के रूप में संबोधित कर सकता है या प्रत्येक व्यक्ति पर लागू होने वाला वितरणात्मक एकवचन हो सकता है। अनिश्चितता को मिटाए बिना मूल रूप सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तुम्हें/तुम्हारे’ से ‘तेरी/तेरे’ का परिवर्तन हिन्दी में कुछ असामान्य लग सकता है, पर मूल इब्रानी की वास्तविक संख्या-भिन्नता और उसकी व्याख्यात्मक अनिश्चितता सुरक्षित रखने के लिए इसे पाठ और पादटिप्पणी दोनों में रखा गया है।
