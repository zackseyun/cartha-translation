  yaml_path: translation/ot/deuteronomy/029/016.yaml
  text: and you saw their detestable things and their idols[a], wood and stone, silver and gold[c][b], that were among them—
translation:
  language: hi
  text: और तुमने उनकी घृणित वस्तुएँ और उनकी मूर्तियाँ[a] देखीं—लकड़ी और पत्थर, चाँदी और सोना—जो उनके पास थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मूर्तियाँ” के लिए प्रयुक्त इब्रानी शब्द अत्यन्त तिरस्कारपूर्ण है; उसमें सम्भवतः “गोबर-सरीखी मूर्तियाँ” जैसा रूखा भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: और तुमने ... देखीं
  rationale: यह ראה का काल रूप, द्वितीय पुरुष बहुवचन है और मूसा के पिछले अनुभव के स्मरण को आगे बढ़ाता है; हिन्दी में सामान्य भूतकाल स्वाभाविक है।
- source_word: שִׁקּוּצֵיהֶם
  choice: उनकी घृणित वस्तुएँ
  rationale: यह शब्द विशेषतः मूर्तिपूजक वस्तुओं के प्रति तीव्र घृणा व्यक्त करता है; यह चयन अर्थ की तीव्रता और दोनों संज्ञाओं का भेद बनाए रखता है।
- source_word: גִּלֻּלֵיהֶם
  choice: उनकी मूर्तियाँ[a]
  rationale: सन्दर्भ में इसका स्पष्ट आशय उपासना की मूर्तियों से है, पर मूल शब्द अत्यन्त तिरस्कारपूर्ण है; उस अतिरिक्त भाव को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: עֵץ וָאֶבֶן כֶּסֶף וְזָהָב
  choice: लकड़ी और पत्थर, चाँदी और सोना
  rationale: इन पदार्थवाचक संज्ञाओं को मूल की संक्षिप्त समानाधिकरणात्मक सूची के रूप में रखा गया है; डैश हिन्दी में इनका मूर्तियों से सम्बन्ध स्पष्ट करते हैं।
- source_word: אֲשֶׁר עִמָּהֶם
  choice: जो उनके बीच थीं
  rationale: עִם का यहाँ उपस्थिति/संगति का अर्थ है। 'उनके बीच' पिछले पद में उल्लिखित जातियों के मध्य इन वस्तुओं की उपस्थिति बताता है, बिना स्वामित्व को अनिवार्य ठहराए।
theological_decisions:
- issue: मूर्तिपूजा के लिए प्रयुक्त दो तिरस्कारपूर्ण शब्दों का अनुवाद
  choice: मुख्य पाठ में ‘घृणित वस्तुएँ’ और ‘मूर्तियाँ’ को अलग-अलग रखा गया
  alternative: ‘घिनौनी वस्तुएँ और घृणित मूर्तियाँ’ अथवा अधिक रूखा ‘गोबर-सरीखी मूर्तियाँ’
  rationale: मूल में दो भिन्न शब्द हैं। मुख्य पाठ अर्थ को स्पष्ट और गरिमापूर्ण रखता है, जबकि दूसरे शब्द का अधिक तीखा, सम्भवतः भद्दा तिरस्कार पाद-टिप्पणी में बताया गया है।
- issue: אֲשֶׁר עִמָּהֶם सम्बन्धवाचक उपवाक्य का संकेत
  choice: ‘जो उनके बीच थीं’ द्वारा आसपास की जातियों की ओर संकेत
  alternative: ‘जो उनके पास थीं’ या ‘जो उनकी थीं’
  rationale: पिछले पद के सन्दर्भ में सर्वनाम उन जातियों की ओर लौटता है जिनके देशों से इस्राएली गुज़रे थे। ‘बीच’ उपस्थिति बताता है और स्वामित्व की अपेक्षा मूल की व्यापकता बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली अपनाई गई है। बहुवचन स्त्रीलिंग क्रिया ‘देखीं/थीं’ निकटवर्ती संयुक्त संज्ञाओं ‘वस्तुएँ और मूर्तियाँ’ से मेल खाती है। डैश पदार्थों की सूची को समानाधिकरण के रूप में स्पष्ट करते हैं और पद को पूर्ण हिन्दी वाक्य के रूप में पठनीय बनाते हैं।
