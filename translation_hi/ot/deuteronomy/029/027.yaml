source:
  edition: WLC
  text: וַ/יִּתְּשֵׁ֤/ם יְהוָה֙ מֵ/עַ֣ל אַדְמָתָ֔/ם בְּ/אַ֥ף וּ/בְ/חֵמָ֖ה וּ/בְ/קֶ֣צֶף גָּד֑וֹל וַ/יַּשְׁלִכֵ֛/ם אֶל אֶ֥רֶץ אַחֶ֖רֶת כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/027.yaml
  text: So Yahweh uprooted them from their land in anger[a], fury, and great wrath, and cast them into another land[b], as it is this day.
translation:
  language: hi
  text: इसलिए याहवे ने उन्हें उनकी भूमि से क्रोध, प्रचंड रोष और बड़े कोप में उखाड़ दिया[a], और उन्हें दूसरे देश में जा फेंका, जैसा कि आज है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जड़ से निकाल दिया’ अथवा ‘बलपूर्वक निकाल दिया’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘इस दिन के समान’; अर्थात यह स्थिति आज भी प्रत्यक्ष है।
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּתְּשֵׁם
  choice: उन्हें…उखाड़ दिया
  rationale: נתשׁ बलपूर्वक जड़ से निकालने या भूमि से हटाने का चित्र प्रस्तुत करता है। ‘उखाड़ दिया’ इस रूपक और निर्वासन की कठोरता दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מֵעַל אַדְמָתָם
  choice: उनकी भूमि से
  rationale: यहाँ אֲדָמָה उस भूमि को सूचित करता है जिससे लोग न्याय के फलस्वरूप निकाले गए; ‘भूमि’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: בְּאַף וּבְחֵמָה וּבְקֶצֶף גָּדוֹל
  choice: क्रोध, प्रचंड रोष और बड़े कोप में
  rationale: तीन निकटार्थी शब्दों के संचय और अंतिम विशेषण ‘बड़े’ को बनाए रखते हुए हिन्दी में उनकी तीव्रता व्यक्त की गई है।
- source_word: וַיַּשְׁלִכֵם
  choice: उन्हें…जा फेंका
  rationale: שׁלך का मूल भाव फेंकना है। ‘जा फेंका’ बलपूर्वक निर्वासन को स्वाभाविक और सशक्त हिन्दी में व्यक्त करता है।
- source_word: אֶל אֶרֶץ אַחֶרֶת
  choice: एक दूसरे देश में
  rationale: यह वाक्यांश किसी अन्य भूभाग में निर्वासन की दिशा और गंतव्य बताता है; हिन्दी में ‘देश’ इस राजनीतिक-भौगोलिक प्रसंग में सहज है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा आज है
  rationale: इस इब्रानी सूत्र का आशय वर्तमान समय में दिखाई देने वाली दशा है; अनुवाद संक्षिप्त रहते हुए उसके प्रत्यक्ष वर्तमान परिणाम को रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: ईश्वरीय कोप के तीन शब्दों का संचय
  choice: क्रोध, प्रचंड रोष और बड़े कोप
  alternative: बहुत भयंकर क्रोध
  rationale: मूल की अलंकारिक तीव्रता और निकटार्थी शब्दों के जानबूझकर किए गए संचय को एक सामान्य पद में समेटा नहीं गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उखाड़ दिया’ भूमि और निर्वासन के मूल रूपक को बनाए रखता है; डैश अंतिम इब्रानी सूत्र को परिणामसूचक ढंग से जोड़ता है।
