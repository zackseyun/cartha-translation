source:
  edition: WLC
  text: לְ/עָבְרְ/ךָ֗ בִּ/בְרִ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/בְ/אָלָת֑/וֹ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כֹּרֵ֥ת עִמְּ/ךָ֖ הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/011.yaml
  text: so that you may enter into the covenant of Yahweh your God[a], and into his oath[b], which Yahweh your God is making with you today.
translation:
  language: hi
  text: ताकि तुम अपने परमेश्वर याहवे की उस वाचा और शपथ[a] में प्रवेश करो, जिस वाचा और शपथ को तुम्हारा परमेश्वर याहवे आज तुम्हारे साथ कर रहा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी शाप-सहित शपथ”; इब्रानी शब्द ऐसी शपथ को भी दर्शा सकता है जिसमें वाचा तोड़ने के दंड या शाप शामिल हों।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “आज तुम्हारे साथ काट रहा है”; यह वाचा करने के लिए प्रयुक्त एक इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: לְעָבְרְךָ
  choice: ताकि तुम…में प्रवेश करो
  rationale: לְ के साथ infinitive construct यहाँ पहले वर्णित सभा के उद्देश्य या परिणाम को व्यक्त करता है। वाचा के संदर्भ में עבר का भाव शाब्दिक रूप से पार करना नहीं, बल्कि वाचा के बंधन में प्रवेश करना है।
- source_word: בִּבְרִית
  choice: वाचा…में
  rationale: בְּרִית के लिए स्थापित और गरिमापूर्ण हिन्दी शब्द ‘वाचा’ चुना गया है; בְּ को ‘में’ के रूप में रखना ‘प्रवेश करो’ के साथ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय का सीधा संबंधसूचक अनुवाद है।
- source_word: וּבְאָלָתוֹ
  choice: और उसकी शपथ
  rationale: אָלָה शपथ को दर्शाता है, पर इसमें वाचा के दंड या शाप का भाव भी हो सकता है। मुख्य पाठ में व्यापक और सहज ‘शपथ’ रखा गया है तथा दूसरा भाव पादटिप्पणी में सुरक्षित है।
- source_word: כֹּרֵת
  choice: बाँध रहा है
  rationale: כרת ברית का शाब्दिक अर्थ ‘वाचा काटना’ है, पर यह वाचा करने का इब्रानी मुहावरा है। हिन्दी में ‘वाचा बाँधना’ स्वाभाविक और अर्थपूर्ण है; वर्तमान कृदंत का तत्काल चल रही विधि वाला भाव ‘रहा है’ से व्यक्त होता है।
- source_word: עִמְּךָ
  choice: तुम्हारे साथ
  rationale: עם और द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय का स्वाभाविक हिन्दी रूप।
- source_word: הַיּוֹם
  choice: आज
  rationale: आधुनिक हिन्दी में समय-सूचक पद का सीधा और स्वाभाविक अनुवाद।
theological_decisions:
- issue: याहवे के वाचा-नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में יְהוָה व्यक्तिगत नाम है; उसे उपाधि से बदलने के बजाय लिप्यंतरित करने से वाचा-संबंधी संदर्भ सुरक्षित रहता है।
- issue: אָלָה में शपथ और शाप के संयुक्त भाव को व्यक्त करना
  choice: मुख्य पाठ में ‘शपथ’, पादटिप्पणी में शाप-दंड का भाव
  alternative: मुख्य पाठ में ‘शाप’ या ‘शाप-सहित शपथ’
  rationale: शब्द केवल सामान्य शपथ नहीं, उसके उल्लंघन पर लागू वाचा-दंड भी सूचित कर सकता है। मुख्य पाठ में किसी एक संकुचित अर्थ को थोपे बिना व्यापक अर्थ रखा गया और वास्तविक अर्थगत तनाव पादटिप्पणी में बताया गया।
- issue: כרת ברית के मुहावरे का रूप
  choice: वाचा बाँध रहा है
  alternative: वाचा काट रहा है
  rationale: शाब्दिक ‘काटना’ आधुनिक हिन्दी पाठक के लिए अस्पष्ट होगा। ‘वाचा बाँधना’ हिन्दी में वाचा स्थापित करने का स्वाभाविक समतुल्य है, जबकि शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘वाचा’, ‘शपथ’ और ‘याहवे’ जैसे प्रमुख धार्मिक शब्दों को गरिमापूर्ण किंतु सामान्य पाठक के लिए समझने योग्य रखा गया है। संबोधन मूल के पुल्लिंग एकवचन के अनुसार ‘तुम’ है। पादटिप्पणी-चिह्न संबंधित शब्द और मुहावरे के तुरंत बाद रखे गए हैं।
