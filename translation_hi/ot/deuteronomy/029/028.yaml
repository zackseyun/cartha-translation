source:
  edition: WLC
  text: הַ֨/נִּסְתָּרֹ֔ת לַ/יהוָ֖ה אֱלֹהֵ֑י/נוּ וְ/הַ/נִּגְלֹ֞ת לָ֤ׄ/נׄוּׄ וּׄ/לְׄ/בָׄנֵׄ֨יׄ/נׄוּׄ֙ עַד עוֹלָ֔ם לַ/עֲשׂ֕וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/028.yaml
  text: The hidden things belong to Yahweh our God[a], but the revealed things belong to us and to our children forever[b], so that we may do all the words of this law.
translation:
  language: hi
  text: छिपी हुई बातें[a] यहोवा हमारे परमेश्वर की हैं, पर प्रकट की हुई बातें सदा के लिए हमारी और हमारे बच्चों की हैं, ताकि हम इस व्यवस्था[b] की सारी बातों का पालन करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गुप्त बातें’।
    reason: lexical_alternative
  - marker: b
    text: ‘व्यवस्था’ का अनुवाद ‘शिक्षा’ या ‘निर्देश’ भी हो सकता है; व्यवस्थाविवरण में यह मूसा द्वारा इस्राएल के सामने रखी गई वाचा-संबंधी शिक्षा को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּסְתָּרֹת
  choice: छिपी हुई बातें
  rationale: यह סתר के कर्मवाच्य कृदंत का संज्ञा के रूप में प्रयोग है। ‘छिपी हुई बातें’ उन विषयों का स्वाभाविक और सटीक बोध कराता है जो मनुष्यों के ज्ञान से छिपे हैं।
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: यहोवा हमारे परमेश्वर की हैं
  rationale: לְ यहाँ अधिकार या संबंध व्यक्त करता है। יהוה को उसके नाम ‘यहोवा’ से और אֱלֹהֵינוּ को स्वाभाविक वाचा-संबंधी पद ‘हमारे परमेश्वर’ से प्रस्तुत किया गया है।
- source_word: וְהַנִּגְלֹת
  choice: पर प्रकट की हुई बातें
  rationale: גלה के कर्मवाच्य कृदंत को पहले पद के समानांतर रखा गया है। וְ को विरोधसूचक ‘पर’ से व्यक्त करने पर छिपी और प्रकट बातों का मूल अंतर स्पष्ट रहता है।
- source_word: לָנוּ וּלְבָנֵינוּ
  choice: हमारी और हमारे बच्चों की हैं
  rationale: पहले खंड से ‘हैं’ का भाव यहाँ भी लागू है। בנים इस वाचा-संबंधी संदर्भ में केवल पुत्रों के बजाय अगली पीढ़ियों, अर्थात बच्चों, को समाविष्ट करता है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: यह स्थायी और निरंतर अवधि का प्रचलित इब्रानी मुहावरा है; ‘सदा के लिए’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: לַעֲשׂוֹת אֶת כָּל דִּבְרֵי
  choice: ताकि हम … की सारी बातों का पालन करें
  rationale: לַעֲשׂוֹת उद्देश्य व्यक्त करता है। ‘पालन करें’ वाचा की कही हुई बातों को व्यवहार में लाने का आशय स्वाभाविक हिंदी में व्यक्त करता है, जबकि ‘सारी बातों’ से כָּל דִּבְרֵי की व्यापकता बनी रहती है।
- source_word: הַתּוֹרָה הַזֹּאת
  choice: इस व्यवस्था
  rationale: תּוֹרָה का अर्थ शिक्षा या निर्देश भी हो सकता है, किंतु व्यवस्थाविवरण के वाचा-संबंधी संदर्भ में ‘व्यवस्था’ परिचित और उपयुक्त है।
theological_decisions:
- issue: छिपी और प्रकट बातों का दायरा
  choice: पद को उन बातों के सामान्य विरोध के रूप में रखा गया है जो परमेश्वर के अधिकार में छिपी हैं और जो इस्राएल को आज्ञापालन के लिए प्रकट की गई हैं।
  alternative: इसे या तो सभी ईश्वरीय रहस्यों पर लागू एक व्यापक ज्ञान-सिद्धांत, या केवल निकटवर्ती वाचा की आशीषों और शापों तक सीमित कथन माना जा सकता है।
  rationale: इब्रानी पाठ स्वयं इन दोनों वर्गों की पूरी सीमा निर्धारित नहीं करता। अनुवाद तत्काल वाचा-संदर्भ को बनाए रखते हुए इस अस्पष्टता को खुला छोड़ता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सामूहिक वाचा-संदर्भ के अनुकूल रखी गई है। समानांतर वाक्य-विन्यास और छिपी तथा प्रकट बातों का विरोध सुरक्षित है।
