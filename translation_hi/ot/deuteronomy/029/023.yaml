source:
  edition: WLC
  text: וְ/אָֽמְרוּ֙ כָּל הַ/גּוֹיִ֔ם עַל מֶ֨ה עָשָׂ֧ה יְהוָ֛ה כָּ֖כָה לָ/אָ֣רֶץ הַ/זֹּ֑את מֶ֥ה חֳרִ֛י הָ/אַ֥ף הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/023.yaml
  text: And all the nations will say[a], ‘Why has Yahweh done thus to this land? Why this great burning anger?’
translation:
  language: hi
  text: और सब राष्ट्र कहेंगे, “याहवे ने इस देश के साथ ऐसा क्यों किया? इस बड़े भड़कते हुए क्रोध का कारण क्या है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: और ... कहेंगे
  rationale: संयोजक वाव को ‘और’ से रखा गया है; वाचा-संबंधी इस भविष्यसूचक प्रसंग में पूर्ण क्रिया का स्वाभाविक हिन्दी रूप भविष्यकाल है।
- source_word: כָּל הַגּוֹיִם
  choice: सब राष्ट्र
  rationale: यह पद इस्राएल की दशा देखनेवाले विदेशी जनसमूहों को सामूहिक रूप से सूचित करता है; ‘राष्ट्र’ उसका प्रचलित और प्रसंगानुकूल रूप है।
- source_word: עַל מֶה
  choice: क्यों
  rationale: यह इब्रानी मुहावरा कारण पूछता है; आधुनिक हिन्दी में ‘क्यों’ संक्षिप्त और स्वाभाविक है।
- source_word: עָשָׂה יְהוָה כָּכָה לָאָרֶץ הַזֹּאת
  choice: याहवे ने इस देश के साथ ऐसा क्यों किया
  rationale: ככה का ‘ऐसा’ और ארץ का वाचा-भूमि के संदर्भ में ‘देश’ किया गया है; हिन्दी में ‘देश के साथ ऐसा करना’ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: מֶה חֳרִי הָאַף הַגָּדוֹל הַזֶּה
  choice: यह इतना भड़कता हुआ बड़ा क्रोध क्यों
  rationale: חֳרִי की ताप/दाह की सजीव छवि ‘भड़कता हुआ’ से बची रहती है; גָּדוֹל का बल ‘बड़ा’ से और זֶה का संकेत ‘यह’ से रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में वाचा-नाम सीधे आया है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है और किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: क्रोध की ताप-संबंधी रूपक-भाषा
  choice: भड़कता हुआ बड़ा क्रोध
  alternative: इतना भयंकर क्रोध; क्रोध की इतनी बड़ी ज्वाला
  rationale: मूल के חֳרִי (‘ताप/जलन’) और אַף (‘क्रोध’) दोनों को एक स्वाभाविक हिन्दी वाक्यांश में व्यक्त किया गया है, बिना रूपक को पूरी तरह सपाट किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। प्रश्नों की प्रत्यक्ष और विस्मययुक्त तीव्रता बनाए रखी गई है।
