base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/006.yaml
  text: When you came to this place[a], Sihon king of Heshbon and Og king of Bashan came out to meet us in battle[b], and we struck them down.
translation:
  language: hi
  text: जब तुम इस स्थान पर आए,[a] तब हेशबोन का राजा सीहोन और बाशान का राजा ओग हमसे युद्ध करने के लिए निकले, और हमने उन्हें पराजित कर दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तुम इस स्थान पर आए।” इब्रानी कथात्मक रूप साधारण क्रम या कालगत संबंध—दोनों व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और हमने उन्हें मारा।” इस इब्रानी क्रिया का प्रयोग युद्ध में पराजित करने के अर्थ में भी होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאוּ
  choice: जब तुम ... आए, तब
  rationale: बोא के द्वितीय पुरुष बहुवचन कथात्मक रूप को अगले घटनाक्रम से स्वाभाविक कालगत संबंध में रखता है; साधारण समन्वय ‘और तुम आए’ भी संभव है।
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: इस स्थान पर
  rationale: מָקוֹם का सीधा अर्थ ‘स्थान’ है; אֶל के साथ हिंदी में ‘इस स्थान पर आए’ स्वाभाविक है।
- source_word: וַיֵּצֵא
  choice: निकले
  rationale: יצא का मूल भाव बाहर निकलना है; यह अनावश्यक रूप से ‘कूच किया’ जैसा विशिष्ट सैन्य अर्थ नहीं जोड़ता।
- source_word: סִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: हेशबोन का राजा सीहोन
  rationale: राजकीय उपाधि और नाम को स्वाभाविक हिंदी क्रम में रखा गया है।
- source_word: וְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: और बाशान का राजा ओग
  rationale: पूर्ववर्ती उपाधि के समानांतर, स्वाभाविक हिंदी रचना।
- source_word: לִקְרָאתֵנוּ לַמִּלְחָמָה
  choice: युद्ध करने के लिए हमारा सामना करने
  rationale: לִקְרָאתֵנוּ का सामना/भेंट की ओर आने का भाव और לַמִּלְחָמָה का युद्ध-संदर्भ दोनों स्पष्ट रखे गए हैं।
- source_word: וַנַּכֵּם
  choice: और हमने उन्हें पराजित कर दिया
  rationale: נכה का शाब्दिक भाव ‘मारा’ है, पर सैन्य संदर्भ में यह निर्णायक पराजय सूचित कर सकता है; फुटनोट शाब्दिक विकल्प सुरक्षित रखता है।
