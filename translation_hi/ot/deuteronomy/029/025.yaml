base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/025.yaml
  text: and they went and served other gods and bowed down to them[a], gods whom they had not known and whom he had not allotted to them.
translation:
  language: hi
  text: और वे जाकर दूसरे देवताओं की सेवा की और उनके आगे दण्डवत् हुए—ऐसे देवता जिन्हें वे नहीं जानते थे और जिन्हें उसने उनके लिए निर्धारित नहीं किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जो उनके लिए निर्धारित नहीं किए गए थे।” इब्रानी में एकवचन कर्ता निहित है; सम्भवतः उसका संकेत परमेश्वर की ओर है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: वे जाकर
  rationale: הלך का मूल अर्थ ‘जाना/चलना’ है। ‘जाकर’ इब्रानी क्रियाक्रम को स्वाभाविक हिन्दी में बनाए रखता है और इसे केवल रूपक के रूप में नहीं समझाता।
- source_word: וַיַּעַבְדוּ
  choice: सेवा करने लगे
  rationale: עבד का सामान्य अर्थ ‘सेवा करना’ है। अगली क्रिया स्पष्ट रूप से दण्डवत् होने को बताती है, इसलिए दोनों क्रियाओं का भेद सुरक्षित रखा गया है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह אֲחֵרִים का सीधा अर्थ है और यहाँ ‘पराए देवताओं’ की अपेक्षा मूल शब्द के अधिक निकट है।
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: उनके आगे दण्डवत् हुए
  rationale: שׁחה झुकने या भूमि पर गिरकर प्रणाम करने का शारीरिक चित्र देता है। ‘दण्डवत् हुए’ उस चित्र को बनाए रखता है और इसे केवल सामान्य ‘आराधना की’ में नहीं मिला देता।
- source_word: אֱלֹהִים אֲשֶׁר לֹא יְדָעוּם
  choice: ऐसे देवता जिन्हें वे नहीं जानते थे
  rationale: ידע यहाँ केवल जानकारी रखने से अधिक परिचय या संबंध का भाव दे सकता है। हिन्दी वाक्य इस व्यापक अर्थ को खुला रखता है।
- source_word: וְלֹא חָלַק לָהֶם
  choice: और जिन्हें उसने उनके लिए नियत नहीं किया था
  rationale: חלק का अर्थ बाँटना, भाग देना या नियत करना है। ‘नियत किया’ इस प्रसंग में सहज है; एकवचन क्रिया के निहित कर्ता को ‘उसने’ के रूप में रखा गया है।
theological_decisions:
- issue: חָלַק की एकवचन क्रिया का निहित कर्ता
  choice: ‘उसने’—अर्थात प्रसंगानुसार परमेश्वर—को निहित कर्ता माना गया है।
  alternative: ‘जो उनके लिए नियत नहीं किए गए थे,’ जहाँ कथन को कर्मवाच्य ढंग से व्यक्त किया जाता है।
  rationale: इब्रानी में कर्ता स्पष्ट रूप से नहीं लिखा है और क्रिया तीसरे पुरुष एकवचन में है। प्रसंग और व्यवस्थाविवरण में दैवी विभाजन/नियतन की भाषा के आधार पर परमेश्वर सबसे स्वाभाविक निहित कर्ता है, पर वैकल्पिक व्याकरणिक अभिव्यक्ति को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। ‘सेवा’ और ‘दण्डवत्’ मूल की अलग-अलग क्रियाओं को अलग रखते हैं। निहित कर्ता की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
