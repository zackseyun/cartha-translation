  register: आधुनिक मानक हिन्दी, प्रत्यक्ष बहुवचन संबोधन और गरिमापूर्ण कथात्मक शैली। इब्रानी की क्रियात्मक पुनरावृत्ति को अर्थ और बल बनाए रखने के लिए हिन्दी में भी रखा गया है।
