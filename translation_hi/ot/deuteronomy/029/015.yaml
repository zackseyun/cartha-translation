base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/015.yaml
  text: For you know how we lived in the land of Egypt[a], and how we passed through the midst of the nations through which you passed.
translation:
  language: hi
  text: क्योंकि तुम जानते हो कि हम मिस्र देश में कैसे रहे और उन जातियों के बीच से कैसे गुज़रे[क], जिनके बीच से तुम गुज़रे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “और उन जातियों के बीच हम जिन अनुभवों से गुज़रे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְדַעְתֶּם
  choice: तुम जानते हो
  rationale: इब्रानी पूर्ण रूप यहाँ बीते अनुभव पर आधारित वर्तमान ज्ञान को व्यक्त करता है।
- source_word: אֵת אֲשֶׁר יָשַׁבְנוּ
  choice: हम ... कैसे रहे
  rationale: शाब्दिक संरचना हिन्दी में अस्वाभाविक होगी; ‘कैसे रहे’ ज्ञात परिस्थिति और अनुभव को सहज ढंग से व्यक्त करता है।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: ‘मिस्र देश’ इब्रानी के ‘मिस्र की भूमि/देश’ को संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: וְאֵת אֲשֶׁר עָבַרְנוּ
  choice: और ... कैसे होकर निकले
  rationale: עבר के गमन-अर्थ को बनाए रखते हुए सन्दर्भानुकूल हिन्दी दी गई है; इसे किसी कठिनाई को सहने के अर्थ में नहीं बदला गया।
- source_word: בְּקֶרֶב הַגּוֹיִם
  choice: उन जातियों के बीच से
  rationale: בקרב का अर्थ ‘बीच में/बीच से’ और הַגּוֹיִם का अर्थ यहाँ राजनीतिक-जातीय समुदाय हैं; ‘जातियाँ’ बाद के ‘गैर-यहूदी’ अर्थ को आयात नहीं करता।
- source_word: אֲשֶׁר עֲבַרְתֶּם
  choice: जिनके बीच से तुम निकले थे
  rationale: सापेक्ष उपवाक्य को स्पष्ट रखते हुए עבר की पुनरावृत्ति सुरक्षित रखी गई है; ‘थे’ श्रोताओं की पहले पूरी हुई यात्रा दिखाता है।
theological_decisions: []
