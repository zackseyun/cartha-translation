language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹֽא נָתַן֩ יְהוָ֨ה לָ/כֶ֥ם לֵב֙ לָ/דַ֔עַת וְ/עֵינַ֥יִם לִ/רְא֖וֹת וְ/אָזְנַ֣יִם לִ/שְׁמֹ֑עַ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/003.yaml
  text: But Yahweh has not given you a heart to know[a], or eyes to see, or ears to hear, to this day.
translation:
  language: hi
  text: परन्तु आज तक यहोवा ने तुम्हें जानने वाला हृदय, देखने वाली आँखें और सुनने वाले कान नहीं दिए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא
  choice: परन्तु ... नहीं
  rationale: यह संयोजक पिछले पदों में इस्राएल द्वारा देखे गए महान कार्यों और यहाँ कही गई भीतरी समझ की कमी के बीच विरोध प्रकट करता है; आधुनिक हिन्दी में ‘परन्तु’ इस संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: נָתַן
  choice: नहीं दिए हैं
  rationale: हिब्रू पूर्ण क्रिया उस स्थिति को बताती है जो वर्तमान समय-सीमा तक बनी हुई है; हिन्दी पूर्ण वर्तमान ‘नहीं दिए हैं’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: לֵב לָדַעַת
  choice: जानने वाला हृदय
  rationale: ‘हृदय’ हिब्रू मानव-विज्ञान की व्यापक धारणा—समझ, बोध और भीतरी प्रवृत्ति—को बनाए रखता है; ‘जानने वाला’ ידע का सीधा अर्थ और स्रोत की मूर्त छवि सुरक्षित रखता है।
- source_word: וְעֵינַיִם לִרְאוֹת
  choice: देखने वाली आँखें
  rationale: यह स्रोत के समानांतर और प्रत्यक्ष बिंब को सहज हिन्दी में बनाए रखता है।
- source_word: וְאָזְנַיִם לִשְׁמֹעַ
  choice: सुनने वाले कान
  rationale: यह हिब्रू समानांतरता तथा ग्रहणशील सुनने के बाइबलीय मुहावरे को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज के दिन तक
  rationale: यह समय-सूचक पद का निकट और स्वाभाविक हिन्दी रूप है तथा उस अवस्था के कथन के वर्तमान दिन तक बने रहने को व्यक्त करता है।
theological_decisions:
- issue: इस्राएल की समझ की कमी में परमेश्वर की भूमिका
  choice: पद को सीधे इस प्रकार रखा गया है कि यहोवा ने उस दिन तक जानने वाला हृदय, देखने वाली आँखें और सुनने वाले कान नहीं दिए हैं।
  alternative: इसे केवल इस्राएल की अपनी विफलता या परमेश्वर द्वारा मात्र अनुमति दिए जाने के अर्थ में समझाना।
  rationale: हिब्रू पाठ ‘न देने’ का कर्ता स्पष्टतः यहोवा को बनाता है। अनुवाद इस कथन को नरम नहीं करता, पर परमेश्वर की प्रभुता और मानवीय उत्तरदायित्व के संबंध पर पाठ से आगे बढ़कर कोई व्यवस्थित धर्मवैज्ञानिक निष्कर्ष भी नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जानने वाला हृदय, देखने वाली आँखें और सुनने वाले कान’ की त्रिक समानांतरता स्रोत की काव्यात्मक तथा धर्मवैज्ञानिक तीव्रता को बनाए रखती है।
