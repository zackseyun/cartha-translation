base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/013.yaml
  text: And it is not with you alone that I am making this covenant and this oath[b][a],
translation:
  language: hi
  text: और मैं यह वाचा[a] और यह शपथ[b] केवल तुम्हारे साथ ही नहीं बाँध रहा हूँ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “यह वाचा काट रहा हूँ।” “वाचा बाँधना” उसी इब्रानी वाचागत मुहावरे का स्वाभाविक हिन्दी रूप है।
    reason: lexical_alternative
  - marker: b
    text: या, “और यह शाप।” इब्रानी शब्द स्वयं शपथ अथवा उस शपथ से जुड़े शाप-दंड को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא
  choice: और ... नहीं
  rationale: संयोजक और निषेध को स्वाभाविक हिन्दी वाक्य-विन्यास में रखते हुए पिछले प्रसंग से विरोधात्मक संबंध बनाए रखा गया है।
- source_word: אִתְּכֶם לְבַדְּכֶם
  choice: केवल तुम्हारे साथ ही नहीं
  rationale: यह पदबंध विशिष्टता का निषेध करता है—वाचा केवल उपस्थित श्रोताओं तक सीमित नहीं है। 'केवल...ही नहीं' आधुनिक हिन्दी में इस बल को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָנֹכִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम का बल हिन्दी में स्पष्ट 'मैं' और वाक्य-विन्यास से पर्याप्त रूप से व्यक्त होता है।
- source_word: כֹּרֵת
  choice: बाँध रहा हूँ
  rationale: इब्रानी में शाब्दिक अर्थ 'वाचा काटना' है, पर हिन्दी में 'वाचा बाँधना' अर्थपूर्ण और प्रचलित वाचागत मुहावरा है। कृदंत की चल रही क्रिया को 'रहा हूँ' से व्यक्त किया गया है।
- source_word: הַבְּרִית הַזֹּאת
  choice: यह वाचा
  rationale: व्यवस्थाविवरण के विधिक और धर्मवैचारिक संदर्भ में 'वाचा' मूल शब्द की गंभीरता और पारिभाषिक अर्थ को बनाए रखता है।
- source_word: וְאֶת הָאָלָה הַזֹּאת
  choice: और यह शपथ
  rationale: אָלָה शपथ को, विशेषकर उससे जुड़ी शाप-दंड की प्रतिज्ञा सहित, सूचित कर सकता है। मुख्य पाठ में 'शपथ' वाचा की पुष्टि के कार्य को स्पष्ट करता है; 'शाप' को पादटिप्पणी में वास्तविक विकल्प के रूप में रखा गया है।
theological_decisions:
- issue: वाचा के संदर्भ में אָלָה का अनुवाद
  choice: शपथ
  alternative: शाप
  rationale: '''शपथ'' वाचा की विधिवत पुष्टि को प्रमुखता देता है, जबकि ''शाप'' उस शपथ से जुड़े आत्म-दंडात्मक परिणाम पर बल देता है। मूल शब्द दोनों आयाम समेट सकता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'वाचा बाँधना' हिन्दी का स्वाभाविक धार्मिक-विधिक मुहावरा है; अल्पविराम अगले पद से वाक्य के जारी रहने को दर्शाता है।
