  edition: WLC
  text: וְ/הָיָ֡ה בְּ/שָׁמְע/וֹ֩ אֶת דִּבְרֵ֨י הָֽ/אָלָ֜ה הַ/זֹּ֗את וְ/הִתְבָּרֵ֨ךְ בִּ/לְבָב֤/וֹ לֵ/אמֹר֙ שָׁל֣וֹם יִֽהְיֶה לִּ֔/י כִּ֛י בִּ/שְׁרִר֥וּת לִבִּ֖/י אֵלֵ֑ךְ לְמַ֛עַן סְפ֥וֹת הָ/רָוָ֖ה אֶת הַ/צְּמֵאָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/018.yaml
  text: and when he hears the words of this oath[a], he blesses himself in his heart, saying, ‘I will have peace[b], though I walk in the stubbornness of my heart’—so as to sweep away the well-watered with the thirsty.
translation:
  language: hi
  text: और जब वह इस शपथ[a] की बातें सुने और अपने मन में अपने को यह कहकर धन्य माने, ‘मैं कुशल से रहूँगा, भले ही मैं अपने हृदय की हठ पर चलता रहूँ,’—ताकि वह तृप्त को प्यासे के साथ मिटा दे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस शाप की।’ इब्रानी शब्द ऐसी शपथ को भी सूचित कर सकता है जिसके साथ शाप जुड़ा हो।
    reason: alternative_reading
  - marker: b
    text: इस कठिन इब्रानी मुहावरे का अर्थ संभवतः ‘सिंचित भूमि को सूखी भूमि के साथ मिटा देना,’ अर्थात सबको समान रूप से नष्ट कर देना, है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  choice: शपथ
  rationale: यह शब्द ऐसी शपथ को सूचित कर सकता है जिसके साथ शाप या दंड जुड़ा हो। मुख्य पाठ में ‘शपथ’ वाचा-संबंधी घोषणा को स्वाभाविक रूप से व्यक्त करता है; ‘शाप’ को पादटिप्पणी में रखा गया है।
- source_word: וְהִתְבָּרֵךְ בִּלְבָבוֹ
  choice: अपने मन में अपने को … धन्य माने
  rationale: हिथ्पएल रूप की आत्मवाचकता और व्यक्ति के झूठे आत्म-आश्वासन की विडंबना दोनों सुरक्षित रहती हैं।
- source_word: שָׁלוֹם יִהְיֶה לִּי
  choice: मेरा कुशल ही होगा
  rationale: שָׁלוֹם में शांति, कल्याण और सुरक्षा का व्यापक भाव है। ‘कुशल’ इस संदर्भ में केवल बाहरी शांति तक अर्थ को सीमित नहीं करता।
- source_word: שְׁרִרוּת לִבִּי
  choice: अपने हृदय की हठ
  rationale: यह अभिव्यक्ति कठोर और स्वेच्छाचारी मनोवृत्ति को दर्शाती है; ‘हठ’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: כִּי
  choice: भले ही
  rationale: 'आत्म-आश्वासन के भीतर यह कथन रियायती भाव में समझा जाता है: व्यक्ति हठ पर चलते रहने के बावजूद कुशल की कल्पना करता है।'
- source_word: לְמַעַן
  choice: तो इसका परिणाम यह होगा कि
  rationale: यहाँ प्रयोजन अथवा परिणामी फल का संबंध हो सकता है। हिन्दी में यह रूप व्यक्ति की घोषित मंशा के रूप में विनाश को प्रस्तुत किए बिना परिणाम का भाव स्पष्ट करता है।
- source_word: סְפוֹת
  choice: मिटा दिया जाएगा
  rationale: इस संदर्भ में धातु का विनाशकारी अर्थ उपयुक्त है। कर्मवाच्य हिन्दी वाक्य कठिन इब्रानी मुहावरे को जोड़े रखता है और आत्म-आश्वस्त व्यक्ति को अनिवार्य रूप से विनाश का सचेत कर्ता नहीं बनाता।
- source_word: הָרָוָה אֶת־הַצְּמֵאָה
  choice: तृप्त को प्यासे के साथ
  rationale: यह कठिन और संभवतः लोकोक्तिपरक युग्म है। विशेषणों को संज्ञात्मक रूप में रखकर इब्रानी बिंब और उसकी अस्पष्टता बचाई गई है; भूमि-संबंधी व्याख्या पादटिप्पणी में दी गई है।
theological_decisions:
- issue: הָאָלָה में वाचा की शपथ और शाप का संबंध
  choice: मुख्य पाठ में ‘शपथ’
  alternative: ‘शाप’
  rationale: शब्द शाप-सहित शपथ को व्यक्त कर सकता है। ‘शपथ’ तत्काल वाचा-संदर्भ को बनाए रखता है, जबकि पादटिप्पणी दंडात्मक अर्थ को स्पष्ट करती है।
- issue: הָרָוָה אֶת־הַצְּמֵאָה के कठिन मुहावरे की व्याख्या
  choice: ‘तृप्त को प्यासे के साथ’ के रूप में बिंब सुरक्षित रखना
  alternative: ‘सिंचित भूमि को सूखी भूमि के साथ’ अथवा ‘सबको समान रूप से नष्ट करना’
  rationale: मूल वाक्यांश वास्तव में अस्पष्ट है। मुख्य पाठ किसी एक व्याख्या को अंतिम नहीं बनाता और पादटिप्पणी संभावित भूमि-संबंधी अर्थ बताती है।
- issue: לְמַעַן का प्रयोजन अथवा परिणाम
  choice: परिणामसूचक अनुवाद
  alternative: ‘ताकि’
  rationale: ‘ताकि’ हिन्दी में उस व्यक्ति की सचेत विनाशकारी मंशा का आभास दे सकता है। परिणामसूचक भाषा मूल के प्रयोजन/परिणाम संबंध को रखते हुए ऐसा अनावश्यक निष्कर्ष नहीं थोपती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘कुशल’, ‘हृदय की हठ’ और ‘अपने को धन्य माने’ सामान्य पाठक के लिए बोधगम्य हैं तथा वाचा-संबंधी गंभीरता बनाए रखते हैं। पादटिप्पणी [b] को उसी कठिन अंतिम मुहावरे पर रखा गया है जिससे वह वास्तव में संबंधित है।
