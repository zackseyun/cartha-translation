id: DEU.29.24
reference: Deuteronomy 29:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֲשֶׁר֙ כָּרַ֣ת עִמָּ֔/ם בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/024.yaml
  text: Then they will say[a], ‘Because they forsook the covenant of Yahweh, the God of their fathers, which he made with them when he brought them out of the land of Egypt.’
translation:
  language: hi
  text: तब वे कहेंगे, “इसलिए कि उन्होंने यहोवा, अपने पितरों के परमेश्वर, की वाचा को त्याग दिया, जो उसने उनके साथ उस समय बाँधी थी जब वह उन्हें मिस्र देश से निकाल लाया था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: तब वे कहेंगे
  rationale: संदर्भ में यह पहले पूछे गए प्रश्न के उत्तर को आगे बढ़ाता है; ‘तब’ प्रवाह और ‘कहेंगे’ भावी अर्थ को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: עַל אֲשֶׁר
  choice: इसलिए कि
  rationale: यह भूमि की दुर्दशा का कारण प्रस्तुत करता है और हिन्दी में उत्तर के रूप में सहज है।
- source_word: עָזְבוּ
  choice: त्याग दिया
  rationale: यह केवल छोड़कर चले जाने के बजाय जानबूझकर की गई वाचा-विमुखता को व्यक्त करता है।
- source_word: בְּרִית
  choice: वाचा
  rationale: यह परमेश्वर और इस्राएल के बीच बंधनकारी संबंध के लिए प्रचलित और अर्थपूर्ण बाइबलीय शब्द है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: अपने पूर्वजों के परमेश्वर
  rationale: यह संबंधवाचक पदबंध को स्पष्ट रखता है; ‘पूर्वज’ आधुनिक हिन्दी में पैतृक वंश के व्यापक संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר כָּרַת עִמָּם
  choice: जो उसने उनके साथ ... बाँधी थी
  rationale: इब्रानी मुहावरा शाब्दिक रूप से वाचा ‘काटने’ का है; हिन्दी में वाचा ‘बाँधना’ स्वाभाविक है और मूल की बंधनकारी धारणा भी बनाए रखता है।
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: उस समय ... जब वह उन्हें ... निकाल लाया था
  rationale: बेथ सहित क्रियार्थक संज्ञा यहाँ समय बताती है; यह रूप उस कालगत संबंध को स्पष्ट और सहज बनाता है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: यह इब्रानी के पूर्ण पदबंध को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; इसलिए उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में परिचित नामरूप दिया गया है।
- issue: אֱלֹהֵי אֲבֹתָם में पैतृक अभिव्यक्ति
  choice: अपने पूर्वजों के परमेश्वर
  alternative: अपने पितरों के परमेश्वर
  rationale: ‘पूर्वज’ वर्तमान सामान्य हिन्दी में अधिक स्पष्ट है और यहाँ अभिप्रेत पैतृक/वंशगत संबंध को बिना अनावश्यक पुरातनता के व्यक्त करता है।
- issue: वाचा बाँधने वाले कर्ता का संकेत
  choice: जो उसने उनके साथ ... बाँधी थी
  alternative: जो यहोवा ने उनके साथ ... बाँधी थी
  rationale: इब्रानी संबंधवाचक उपवाक्य में कर्ता क्रिया में निहित है; एकवचन सर्वनाम ‘उसने’ निकटतम एकवचन ‘यहोवा’ की ओर लौटता है और मूल संरचना को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘त्याग दिया’ वाचा से जानबूझकर विमुख होने का भाव देता है; ‘वाचा बाँधी’ हिन्दी में स्वाभाविक धार्मिक मुहावरा है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
