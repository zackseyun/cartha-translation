language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְמַ֣עַן הָקִֽים אֹתְ/ךָ֩ הַ/יּ֨וֹם ל֜/וֹ לְ/עָ֗ם וְ/ה֤וּא יִֽהְיֶה לְּ/ךָ֙ לֵֽ/אלֹהִ֔ים כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/כַ/אֲשֶׁ֤ר נִשְׁבַּע֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/012.yaml
  text: so that today he may establish you as a people for himself[a], and he himself may be your God, just as he spoke to you and as he swore to your fathers, to Abraham, to Isaac[b], and to Jacob.
translation:
  language: hi
  text: ताकि वह आज तुम्हें अपनी प्रजा के रूप में स्थापित करे[a] और स्वयं तुम्हारा परमेश्वर हो, जैसा उसने तुमसे कहा था और जैसा उसने तुम्हारे पुरखों[b]—अब्राहम, इसहाक और याकूब—से शपथ खाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “अपने लिए एक प्रजा के रूप में स्थापित करे।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “तुम्हारे पिता”; यहाँ इसका अर्थ अब्राहम, इसहाक और याकूब जैसे पितृपुरुष हैं।
    reason: cultural_note
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम का परिचय देता है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक रूप से इसका प्रयोजनसूचक बल बनाए रखता है।
- source_word: הָקִים
  choice: स्थापित करे
  rationale: हिफ़ील रूप यहाँ वाचा के संबंध में किसी को एक निश्चित स्थिति में दृढ़तापूर्वक ठहराने का भाव देता है; ‘स्थापित करे’ इस अर्थ को सुरक्षित रखता है।
- source_word: אֹתְךָ
  choice: तुम्हें
  rationale: एकवचन संबोधन सामूहिक रूप से इस्राएल के लिए है; हिन्दी में ‘तुम्हें’ इस सामूहिक संबोधन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह वर्तमान वाचा-क्षण को सूचित करता है; ‘आज’ स्पष्ट और आधुनिक है।
- source_word: לוֹ לְעָם
  choice: अपनी प्रजा के रूप में
  rationale: यह वाचा से जुड़ी पारस्परिक संबद्धता व्यक्त करता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और अधिक शाब्दिक क्रम को पादटिप्पणी में दिया गया है।
- source_word: וְהוּא יִהְיֶה לְךָ לֵאלֹהִים
  choice: और स्वयं तुम्हारा परमेश्वर हो
  rationale: ‘स्वयं’ וְהוּא के बल को व्यक्त करता है, जबकि ‘तुम्हारा परमेश्वर हो’ वाचा-सूत्र की हिन्दी में स्वाभाविक अभिव्यक्ति है।
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: जैसा उसने तुमसे कहा था
  rationale: דבר का सामान्य अर्थ ‘कहा/बात की’ है। ‘कहा था’ अगले शपथ-सूचक क्रियापद से भेद बनाए रखता है और यहाँ अनावश्यक रूप से ‘प्रतिज्ञा की’ नहीं जोड़ता।
- source_word: וְכַאֲשֶׁר נִשְׁבַּע
  choice: और जैसा उसने ... शपथ खाई थी
  rationale: נשבע स्पष्ट रूप से शपथ खाने को सूचित करता है; हिन्दी में यह सटीक और प्रचलित अभिव्यक्ति है।
- source_word: לַאֲבֹתֶיךָ
  choice: तुम्हारे पुरखों
  rationale: संज्ञा पुल्लिंग बहुवचन है और तत्काल आगे अब्राहम, इसहाक और याकूब के लिए प्रयुक्त हुई है। ‘पुरखों’ आधुनिक हिन्दी में समझने योग्य है और पितृपुरुषों का संकेत बनाए रखता है।
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: अब्राहम, इसहाक और याकूब से
  rationale: नामों के प्रचलित हिन्दी रूप रखे गए हैं। हिन्दी में संबंधबोधक ‘से’ को सूची के अंत में रखना स्वाभाविक है।
theological_decisions:
- issue: वाचा-सूत्र का शब्दांकन
  choice: अपनी प्रजा ... तुम्हारा परमेश्वर
  alternative: अपने लिए एक प्रजा ... तुम्हारे लिए परमेश्वर
  rationale: चुना गया रूप पारस्परिक वाचा-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है; पादटिप्पणी לוֹ לְעָם के अधिक शाब्दिक रूप को सुरक्षित रखती है।
- issue: לַאֲבֹתֶיךָ में पुरुषवाची संदर्भ
  choice: तुम्हारे पुरखों
  alternative: तुम्हारे पूर्वजों
  rationale: अगले ही शब्द अब्राहम, इसहाक और याकूब को निर्दिष्ट करते हैं, इसलिए यहाँ सामान्य पूर्वज नहीं बल्कि नामित पितृपुरुष अभिप्रेत हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन ‘तुम’ का रूप सामूहिक इस्राएल को संबोधित करता है। वाक्य की वाचा-संबंधी गंभीरता बनाए रखते हुए अत्यधिक शाब्दिक और अस्वाभाविक हिन्दी से बचा गया है।
