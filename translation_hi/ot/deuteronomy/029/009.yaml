source:
  edition: WLC
  text: אַתֶּ֨ם נִצָּבִ֤ים הַ/יּוֹם֙ כֻּלְּ/כֶ֔ם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵי/כֶ֑ם רָאשֵׁי/כֶ֣ם שִׁבְטֵי/כֶ֗ם זִקְנֵי/כֶם֙ וְ/שֹׁ֣טְרֵי/כֶ֔ם כֹּ֖ל אִ֥ישׁ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/009.yaml
  text: 'You are standing today[a], all of you, before Yahweh your God: your heads, your tribes, your elders[b], and your officers—all the men of Israel.'
translation:
  language: hi
  text: आज तुम सब अपने परमेश्वर याहवे के सामने खड़े हो—तुम्हारे प्रधान, तुम्हारे गोत्र[a], तुम्हारे बुज़ुर्ग और तुम्हारे अधिकारी—इस्राएल का हर पुरुष[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन शब्दों को “तुम्हारे गोत्रों के प्रधान” भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “इस्राएल का हर पुरुष” है; यह प्रत्येक पुरुष को समेटने वाला वितरणात्मक प्रयोग है।
    reason: lexical_clarification
lexical_decisions:
- source_word: נִצָּבִים
  choice: खड़े हो
  rationale: निफ़अल कृदन्त सभा के इस समय परमेश्वर के सामने उपस्थित होकर खड़े होने की स्थिति दिखाता है; ‘खड़े हो’ हिन्दी में इसका स्वाभाविक और दृश्यात्मक रूप है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह समय पर दिए गए स्पष्ट बल को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: כֻּלְּכֶם
  choice: तुम सब
  rationale: द्वितीय पुरुष बहुवचन के साथ पूरे समुदाय पर दिए गए सामूहिक बल को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: परमेश्वर की उपस्थिति में वाचा-सभा के खड़े होने का सीधा और प्रचलित हिन्दी रूप।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर
  rationale: संबंधसूचक प्रत्यय सहित पद का सीधा अनुवाद, जो वाचा-संबंध को स्पष्ट रखता है।
- source_word: רָאשֵׁיכֶם
  choice: तुम्हारे प्रधान
  rationale: शाब्दिक ‘तुम्हारे सिर’ हिन्दी में भ्रामक होता; यहाँ रूपक रूप से समुदाय के प्रमुख या अगुवे अभिप्रेत हैं, इसलिए ‘प्रधान’ अर्थ को स्पष्ट रखते हुए औपचारिक गरिमा बनाए रखता है।
- source_word: שִׁבְטֵיכֶם
  choice: तुम्हारे गोत्र
  rationale: पद का सामान्य शब्दार्थ ‘गोत्र’ है। इसे सूची के स्वतंत्र अंग के रूप में रखा गया है, जबकि ‘तुम्हारे गोत्रों के प्रधान’ वाली सम्भव संरचना पादटिप्पणी में दी गई है।
- source_word: זִקְנֵיכֶם
  choice: तुम्हारे पुरनिये
  rationale: यह इस्राएली समुदाय के मान्य वरिष्ठ अगुवों के पद को दर्शाता है; ‘पुरनिये’ हिन्दी बाइबलीय प्रयोग में परिचित और यहाँ पदसूचक है।
- source_word: שֹׁטְרֵיכֶם
  choice: तुम्हारे अधिकारी
  rationale: व्यवस्थाविवरण के प्रशासनिक प्रसंग में यह पद नियुक्त पदाधिकारियों को सूचित करता है; ‘अधिकारी’ उनके कार्य को अनावश्यक रूप से सीमित नहीं करता।
- source_word: כֹּל אִישׁ יִשְׂרָאֵל
  choice: इस्राएल का हर पुरुष
  rationale: एकवचन אִישׁ के वितरणात्मक प्रयोग और उसके पुरुष-वाचक रूप दोनों को सुरक्षित रखता है; अगले पद में सभा के अन्य सदस्यों का पृथक उल्लेख इस चयन का समर्थन करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और वाचा-नाम को प्रत्यक्ष रखता है।
- issue: כֹּל אִישׁ יִשְׂרָאֵל में लिंग-सूचक भाषा
  choice: इस्राएल का हर पुरुष
  alternative: सारा इस्राएल; इस्राएल का हर व्यक्ति
  rationale: אִישׁ का पुरुष-वाचक और वितरणात्मक स्वरूप जानबूझकर बनाए रखा गया है। व्यापक वाचा-सभा में स्त्रियों और बच्चों की उपस्थिति को अगले पद में स्पष्ट किया गया है, इसलिए यहाँ भाषा को लिंग-निरपेक्ष करना मूल की संरचना को धुँधला करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली रखी गई है। ‘प्रधान’, ‘गोत्र’, ‘पुरनिये’ और ‘अधिकारी’ इस्राएल की औपचारिक वाचा-सभा की सामाजिक संरचना को स्पष्ट करते हैं। मूल की सूचीगत बनावट और ‘तुम सब’ से ‘हर पुरुष’ तक का सामूहिक-वितरणात्मक तनाव सुरक्षित रखा गया है।
