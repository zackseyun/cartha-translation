  yaml_path: translation/ot/deuteronomy/029/002.yaml
  text: the great trials that your eyes saw[a], those great signs and wonders.
translation:
  language: hi
  text: वे बड़े-बड़े परीक्षण, जिन्हें तुम्हारी आँखों ने देखा[a]—वे बड़े-बड़े चिह्न और अद्भुत कार्य।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे बड़ी-बड़ी परीक्षाएँ।’ यहाँ अर्थ परखने या जाँचने का है, पाप के लिए प्रलोभन देने का नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסּוֹת הַגְּדֹלֹת
  choice: बड़े-बड़े परीक्षण
  rationale: מַסּוֹת यहाँ परीक्षा या परख की घटनाओं को दर्शाता है, न कि पाप के लिए प्रलोभन को। हिंदी में ‘परीक्षण’ इस अर्थ को स्पष्ट रखता है; ‘बड़े-बड़े’ हिब्रू बहुवचन विशेषण के बल और घटनाओं की महत्ता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: जिन्हें तुम्हारी आँखों ने देखा
  rationale: हिब्रू में ‘तुम्हारी आँखों ने देखा’ प्रत्यक्ष साक्षी होने पर जोर देने वाला मुहावरा है। इसे केवल ‘तुमने देखा’ करने के बजाय स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: הָאֹתֹת
  choice: चिह्न
  rationale: אוֹת का सामान्य और प्रसंगानुकूल अर्थ ‘चिह्न’ है, अर्थात परमेश्वर के कार्यों की ओर संकेत करने वाली घटनाएँ।
- source_word: וְהַמֹּפְתִים
  choice: और अद्भुत काम
  rationale: מוֹפֵת असाधारण, विस्मयकारी कार्य को दर्शाता है और אוֹת के साथ प्रचलित युग्म बनाता है। ‘अद्भुत काम’ आधुनिक हिंदी में स्पष्ट है और ‘चमत्कार’ की अपेक्षा शब्द के आशय को अनावश्यक रूप से सीमित नहीं करता।
- source_word: הַגְּדֹלִים הָהֵם
  choice: वे बड़े-बड़े
  rationale: הָהֵם का संकेतात्मक बल ‘वे’ से रखा गया है, जबकि הַגְּדֹלִים की महत्ता ‘बड़े-बड़े’ से व्यक्त की गई है।
theological_decisions:
- issue: הַמַּסּוֹת का अर्थ
  choice: परीक्षण
  alternative: परीक्षाएँ; प्रलोभन
  rationale: प्रसंग में अर्थ जाँचने या परखने वाली महान घटनाओं का है। आधुनिक हिंदी में ‘प्रलोभन’ पाप की ओर उकसाने का भाव देता है, जो यहाँ अभिप्रेत नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और मौखिक पाठ के अनुकूल शैली। खंड की अपूर्ण वाक्य-संरचना सुरक्षित रखी गई है, क्योंकि उपलब्ध हिब्रू पाठ व्यवस्थाविवरण 29:2 के लंबे वाक्य का अंश है।
