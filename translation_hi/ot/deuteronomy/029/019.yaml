source:
  edition: WLC
  text: לֹא יֹאבֶ֣ה יְהוָה֮ סְלֹ֣חַֽ ל/וֹ֒ כִּ֣י אָ֠ז יֶעְשַׁ֨ן אַף יְהוָ֤ה וְ/קִנְאָת/וֹ֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/רָ֤בְצָה בּ/וֹ֙ כָּל הָ֣/אָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֣פֶר הַ/זֶּ֑ה וּ/מָחָ֤ה יְהוָה֙ אֶת שְׁמ֔/וֹ מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/019.yaml
  text: Yahweh will not be willing to forgive him[a], for then the anger of Yahweh and his jealousy will burn against that man, and every curse written in this book will settle on him, and Yahweh will blot out his name from under heaven.
translation:
  language: hi
  text: याहवे उसे क्षमा करने को तैयार नहीं होगा, क्योंकि तब याहवे का क्रोध और उसकी ईर्ष्या उस मनुष्य के विरुद्ध भड़क उठेंगे। इस पुस्तक में लिखा हुआ हर शाप[a] उस पर आ टिकेगा, और याहवे उसका नाम आकाश के नीचे से मिटा देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हर शपथ-शाप’; इब्रानी शब्द वाचा की शपथ के साथ बुलाए गए शाप को भी दर्शा सकता है, केवल सामान्य शाप को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאבֶה
  choice: तैयार नहीं होगा
  rationale: यह क्रिया सामर्थ्य नहीं, इच्छा या सहमति व्यक्त करती है। ‘तैयार नहीं होगा’ आधुनिक हिन्दी में इसके इच्छात्मक भाव को स्वाभाविक ढंग से रखता है।
- source_word: סְלֹחַ לוֹ
  choice: उसे क्षमा करने
  rationale: סלח वाचा-संबंधी प्रसंग में क्षमा या अपराध-मोचन को दर्शाता है; ‘क्षमा करना’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: כִּי אָז
  choice: क्योंकि तब
  rationale: यह पद कारणात्मक और कालगत दोनों संबंध व्यक्त करता है; ‘क्योंकि तब’ दोनों पहलुओं को सुरक्षित रखता है।
- source_word: יֶעְשַׁן אַף יְהוָה
  choice: याहवे का क्रोध ... भड़क उठेंगे
  rationale: इब्रानी मुहावरे में क्रोध के ‘धुआँ देने’ का सजीव चित्र है। शाब्दिक हिन्दी अस्वाभाविक होती, इसलिए ‘भड़क उठना’ उसी प्रज्वलित क्रोध की छवि को सहज भाषा में व्यक्त करता है।
- source_word: קִנְאָתוֹ
  choice: उसकी ईर्ष्या
  rationale: קנאה यहाँ वाचा के प्रति परमेश्वर की ईर्ष्यापूर्ण तत्परता को दर्शाता है। ‘ईर्ष्या’ सीधा शब्दार्थ है और पाठ की धर्मवैचारिक तीव्रता को नरम नहीं करता।
- source_word: בָּאִישׁ הַהוּא
  choice: उस मनुष्य के विरुद्ध
  rationale: क्रोध के प्रसंग में ב को ‘के विरुद्ध’ कहना स्वाभाविक है; ‘उस मनुष्य’ इब्रानी के पुल्लिंग एकवचन को बनाए रखता है।
- source_word: וְרָבְצָה בוֹ
  choice: उस पर आ टिकेगा
  rationale: רבץ का मूल भाव लेटने, बैठने या स्थिर होकर रहने का है। ‘आ टिकेगा’ शाप के उस पर आकर बने रहने की छवि सुरक्षित रखता है।
- source_word: כָּל הָאָלָה
  choice: हर शाप
  rationale: मुख्य पाठ में ‘हर शाप’ स्पष्ट और सहज है; אָלָה में निहित वाचा की शपथ से जुड़े शाप का पहलू पादटिप्पणी में दिया गया है।
- source_word: הַכְּתוּבָה בַּסֵּפֶר הַזֶּה
  choice: इस पुस्तक में लिखा हुआ
  rationale: סֵפֶר का अर्थ पुस्तक या ग्रंथ-पत्र हो सकता है। ‘पुस्तक’ आधुनिक पाठक के लिए स्वाभाविक है और आशय स्पष्ट रखता है।
- source_word: וּמָחָה ... אֶת שְׁמוֹ
  choice: उसका नाम ... मिटा देगा
  rationale: नाम मिटाना स्मृति, पहचान या वंश-परंपरा के लोप का इब्रानी मुहावरा है; हिन्दी में भी यह रूप सजीव और बोधगम्य है।
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: आकाश के नीचे से
  rationale: यह पृथ्वी पर से पूर्णतः हटा दिए जाने की पारंपरिक इब्रानी अभिव्यक्ति है; हिन्दी रूप मूल बिंब को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: मानवरूपी न्याय-चित्रण
  choice: क्रोध और ईर्ष्या के ‘भड़क उठने’ की अग्निमय छवि रखी गई है।
  alternative: क्रोध और ईर्ष्या धुआँ देंगे
  rationale: मूल में क्रोध के धुआँ देने का अत्यंत सजीव मुहावरा है। शाब्दिक रूप हिन्दी में भ्रामक या अस्वाभाविक होता; ‘भड़क उठेंगे’ उस तीव्र न्याय-चित्र को बनाए रखता है।
- issue: परमेश्वर की קנאה
  choice: ईर्ष्या
  alternative: उत्साह या जोश
  rationale: ‘ईर्ष्या’ मूल शब्द का सीधा अर्थ और वाचा में अनन्य निष्ठा की माँग से उत्पन्न तनाव सुरक्षित रखता है; इसे केवल सामान्य ‘उत्साह’ कहने से भाव हल्का पड़ता।
- issue: पुल्लिंग एकवचन संदर्भ
  choice: उस मनुष्य
  alternative: उस व्यक्ति
  rationale: मूल पाठ व्याकरणतः पुल्लिंग एकवचन में उस वाचा-भंजक को निर्दिष्ट करता है; अनावश्यक रूप से लिंग-निरपेक्ष नहीं किया गया।
- issue: वाचा के शाप की शब्दावली
  choice: मुख्य पाठ में ‘हर शाप’, पादटिप्पणी में शपथ-शाप का अर्थ
  alternative: मुख्य पाठ में ‘हर शपथ-शाप’
  rationale: ‘शाप’ सामान्य पाठक के लिए स्पष्ट है, जबकि אָלָה का औपचारिक वाचा-शपथ संबंधी अर्थ पादटिप्पणी द्वारा सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याहवे’ नाम का लिप्यंतरण अपनाया गया है। मूल की कठोर न्याय-भाषा, पुल्लिंग एकवचन और ईर्ष्या संबंधी धर्मवैचारिक तनाव को नरम नहीं किया गया।
