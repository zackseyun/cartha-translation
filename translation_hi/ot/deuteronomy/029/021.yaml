source:
  edition: WLC
  text: וְ/אָמַ֞ר הַ/דּ֣וֹר הָֽ/אַחֲר֗וֹן בְּנֵי/כֶם֙ אֲשֶׁ֤ר יָק֨וּמוּ֙ מֵ/אַ֣חֲרֵי/כֶ֔ם וְ/הַ֨/נָּכְרִ֔י אֲשֶׁ֥ר יָבֹ֖א מֵ/אֶ֣רֶץ רְחוֹקָ֑ה וְ֠/רָאוּ אֶת מַכּ֞וֹת הָ/אָ֤רֶץ הַ/הִוא֙ וְ/אֶת תַּ֣חֲלֻאֶ֔י/הָ אֲשֶׁר חִלָּ֥ה יְהוָ֖ה בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/021.yaml
  text: 'And the generation to come—your children who rise up after you—and the foreigner who comes from a distant land will say[c][b][a], when they see the plagues of that land and its sicknesses with which Yahweh has afflicted it:'
translation:
  language: hi
  text: तब आने वाली पीढ़ी—तुम्हारे वंशज, जो तुम्हारे बाद उठ खड़े होंगे—और दूर देश से आने वाला परदेशी, उस देश पर पड़ी विपत्तियाँ और उसके वे रोग देखकर, जिनसे याहवे ने उसे पीड़ित किया है, कहेंगे:[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आने वाली पीढ़ी’ का अनुवाद ‘बाद की पीढ़ी’ भी हो सकता है; इसका अर्थ अनिवार्यतः इतिहास की अंतिम पीढ़ी नहीं है।
    reason: lexical_alternative
  - marker: b
    text: ‘रोग’ का अनुवाद ‘बीमारियाँ’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “जिनसे याहवे ने उसमें बीमारी उत्पन्न की है,” अथवा “जिनसे याहवे ने उसमें पीड़ा पहुँचाई है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: कहेंगे
  rationale: इब्रानी क्रिया व्याकरणतः एकवचन है, क्योंकि उसका निकटवर्ती सामूहिक कर्ता 'पीढ़ी' है; आगे 'पीढ़ी' और 'परदेशी' संयुक्त रूप से आते हैं। स्वाभाविक हिन्दी में समग्र बहुवचन संदर्भ के लिए 'कहेंगे' उपयुक्त है।
- source_word: הַדּוֹר הָאַחֲרוֹן
  choice: आने वाली पीढ़ी
  rationale: यह वर्तमान श्रोताओं के बाद की भावी पीढ़ी को सूचित करता है, अनिवार्यतः इतिहास की अंतिम पीढ़ी को नहीं।
- source_word: בְּנֵיכֶם אֲשֶׁר יָקֻמוּ מֵאַחֲרֵיכֶם
  choice: तुम्हारे वंशज, जो तुम्हारे बाद उठ खड़े होंगे
  rationale: בנים यहाँ उत्तरवर्ती संतान या वंशजों के व्यापक अर्थ में है; 'वंशज' भावी पीढ़ी के संदर्भ को स्पष्ट रखता है, और 'उठ खड़े होंगे' יָקֻמוּ की छवि बचाता है।
- source_word: וְהַנָּכְרִי
  choice: और ... परदेशी
  rationale: נכרי इस्राएल के बाहर के विदेशी व्यक्ति को दर्शाता है; 'परदेशी' आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: दूर देश से आया
  rationale: मूल के भौगोलिक दूरी-बोध को सहज हिन्दी में व्यक्त करता है।
- source_word: וְרָאוּ
  choice: देखकर
  rationale: वाव-संयुक्त रूप यहाँ भावी कथन से पहले की परिस्थिति बताता है; हिन्दी कृदंत 'देखकर' क्रम और संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מַכּוֹת
  choice: विपत्तियाँ
  rationale: מכות का मूल अर्थ प्रहार है और प्रसंग में दंडात्मक आपदाएँ अभिप्रेत हैं; भूमि पर 'पड़ी विपत्तियाँ' दृश्य विनाश को सहज रूप से व्यक्त करता है।
- source_word: תַּחֲלֻאֶיהָ
  choice: उसके ... रोग
  rationale: बहुवचन संज्ञा रोगों या बीमारियों को दर्शाती है और भूमि को रोगग्रस्त बताने वाला मूल रूपक बनाए रखती है।
- source_word: חִלָּה
  choice: पीड़ित किया है
  rationale: पिएल रूप का अर्थ 'बीमार करना' या 'पीड़ित करना' हो सकता है। 'पीड़ित किया' कारक और दंडात्मक अर्थ रखता है, जबकि शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित व्यक्तिगत नाम 'यहोवा' टेट्राग्राम को किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: בָּהּ
  choice: उसे
  rationale: सर्वनाम का पूर्वपद 'देश/भूमि' है। हिन्दी में 'उसे पीड़ित किया' स्वाभाविक है; मूल का अधिक शाब्दिक स्थानवाचक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। हिन्दी पाठकों के बीच सुस्थापित रूप 'यहोवा' नाम को 'प्रभु' जैसी उपाधि से नहीं बदलता; ध्वन्यात्मक पुनर्निर्माण 'याहवे' भी संभव है।
- issue: בְּנֵיכֶם का दायरा
  choice: तुम्हारे वंशज
  alternative: तुम्हारे बेटे / तुम्हारी संतान
  rationale: इस सामूहिक भावी-पीढ़ी के संदर्भ में शब्द केवल पुरुष संतानों तक सीमित नहीं है। 'वंशज' कालगत और वंशगत अर्थ को स्पष्ट रखता है।
- issue: הַדּוֹר הָאַחֲרוֹן का कालगत अर्थ
  choice: आने वाली पीढ़ी
  alternative: बाद की पीढ़ी / अंतिम पीढ़ी
  rationale: אַחֲרוֹן यहाँ वर्तमान पीढ़ी के बाद आने वाली पीढ़ी को दर्शाता है; इसे अनिवार्य रूप से युगांत की 'अंतिम पीढ़ी' कहना पाठ से अधिक निश्चितता जोड़ देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। वाक्य अगले पद में आने वाले कथन की भूमिका है, इसलिए अंत में विसर्ग लगाया गया है। मूल की भूमि-रोग रूपक-छवि को 'देश पर पड़ी विपत्तियाँ' और 'उसके रोग' द्वारा बनाए रखा गया है।
