  yaml_path: translation/ot/deuteronomy/029/007.yaml
  text: and we took their land and gave it as an inheritance to the Reubenites[a], the Gadites, and the half-tribe of the Manassites.
translation:
  language: hi
  text: और हमने उनका देश ले लिया और उसे रूबेनियों, गादियों और मनश्शे के आधे गोत्र को विरासत के रूप में दे दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּקַּח
  choice: और हमने ... ले लिया
  rationale: לקח का सामान्य आख्यानात्मक अर्थ ‘लेना’ है। सैनिक प्रसंग होने पर भी ‘कब्ज़ा कर लिया’ मूल क्रिया से अधिक प्रबल होता।
- source_word: אַרְצָם
  choice: उनका देश
  rationale: אֶרֶץ यहाँ पिछले प्रसंग में पराजित राजाओं के अधीन भूभाग को दर्शाता है; हिंदी में ‘देश’ इस प्रादेशिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַנִּתְּנָהּ
  choice: और उसे ... दे दिया
  rationale: נתן का सीधा अर्थ ‘देना’ है; स्त्रीलिंग प्रत्यय का संकेत हिंदी में ‘उसे’ से देश की ओर लौटता है।
- source_word: לְנַחֲלָה
  choice: विरासत के रूप में
  rationale: נַחֲלָה बाँटी गई पैतृक/विरासती संपत्ति को दर्शाता है और भूमि-वितरण का वाचाई भाव बनाए रखता है।
- source_word: לָראוּבֵנִי וְלַגָּדִי
  choice: रूबेनियों, गादियों
  rationale: एकवचन जातिवाचक रूप सामूहिक रूप से संबंधित गोत्रों के लोगों को दर्शाते हैं; हिंदी में बहुवचन जातिनाम अधिक स्वाभाविक है।
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: और मनश्शे के आधे गोत्र को
  rationale: חֲצִי שֵׁבֶט का अर्थ ‘आधा गोत्र’ है। הַמְנַשִּׁי जातिवाचक रूप है, पर हिंदी में ‘मनश्शे के आधे गोत्र’ कहना स्पष्ट और मुहावरेदार है।
