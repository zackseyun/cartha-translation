  verdict: revise
  source_fidelity: The draft accurately conveys the land’s sulfur-and-salt desolation, its lack of cultivation and vegetation, the comparison with the overthrow of the four cities, and Yahweh’s anger and wrath. The future-oriented Hindi is defensible in this curse context. However, the opening apposition is somewhat unclear in Hindi, and the audit-trail footnote on “sulfur/brimstone” has no corresponding Hindi anchor.
  naturalness: Most of the Hindi is modern and suitably grave. “गंधक और नमक, जली हुई उजाड़ भूमि होगी” is syntactically compressed and can momentarily suggest that sulfur and salt themselves are the land. A clearer appositional formulation preserves the Hebrew’s compressed list while reading naturally.
  terminology: “गंधक,” “वनस्पति,” “सदोम,” “अमोरा,” “अदमा,” “सबोयीम,” “यहवे,” “क्रोध,” and “प्रकोप” are appropriate. “उलट दिया था” preserves the lexical image of הפך and appropriately treats the overthrow of the cities as a prior event.
  issues:
  - severity: medium
    issue: The source/audit lexical footnote lacks a Hindi footnote anchor.
    rationale: The English POB audit trail marks the sulfur term with a lexical-alternative note. The Hindi text should retain an anchor and a localized note, even though modern Hindi normally uses the same word, “गंधक,” where English distinguishes “sulfur” from traditional “brimstone.”
  - severity: low
    issue: The first clause is grammatically and semantically cramped.
    rationale: Recasting it as a sulfur-and-salt-covered, burning wasteland makes the relation of the materials to the land clear without changing the image of catastrophic sterility.
  revised_text: उसकी सारी भूमि गंधक और नमक[a] से ढकी हुई, जलती हुई उजाड़ भूमि हो जाएगी। उसमें न बोआई होगी, न वह कुछ उपजाएगी, और न उसमें कोई वनस्पति उगेगी। वह सदोम और अमोरा, अदमा और सबोयीम के विनाश के समान होगी, जिन्हें यहवे ने अपने क्रोध और प्रकोप में उलट दिया था।
