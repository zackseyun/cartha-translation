language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גָּפְרִ֣ית וָ/מֶלַח֮ שְׂרֵפָ֣ה כָל אַרְצָ/הּ֒ לֹ֤א תִזָּרַע֙ וְ/לֹ֣א תַצְמִ֔חַ וְ/לֹֽא יַעֲלֶ֥ה בָ֖/הּ כָּל עֵ֑שֶׂב כְּֽ/מַהְפֵּכַ֞ת סְדֹ֤ם וַ/עֲמֹרָה֙ אַדְמָ֣ה ו/צביים אֲשֶׁר֙ הָפַ֣ךְ יְהוָ֔ה בְּ/אַפּ֖/וֹ וּ/בַ/חֲמָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/022.yaml
  text: Sulfur and salt[a], a burning waste, are all its land; it is not sown, and it does not sprout, and no grass grows in it, like the overthrow of Sodom and Gomorrah, Admah and Zeboiim, which Yahweh overthrew in his anger and in his wrath.
translation:
  language: hi
  text: उसकी सारी भूमि गंधक और नमक[a] से ढकी हुई, जलती हुई उजाड़ भूमि हो जाएगी। उसमें न बोआई होगी, न वह कुछ उपजाएगी, और न उसमें कोई वनस्पति उगेगी। वह सदोम और अमोरा, अदमा और सबोयीम के विनाश के समान होगी, जिन्हें यहवे ने अपने क्रोध और प्रकोप में उलट दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गंधक और नमक, दहन।” “गंधक” उस पदार्थ का आधुनिक हिन्दी नाम है; परंपरागत अंग्रेज़ी अनुवादों में इसे “ब्रिमस्टोन” भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּפְרִית וָמֶלַח
  choice: गंधक और नमक
  rationale: दोनों पदार्थों का सीधा और आधुनिक हिन्दी रूप; उनका युग्म भूमि की उजाड़ और अनुपजाऊ दशा व्यक्त करता है।
- source_word: שְׂרֵפָה כָל אַרְצָהּ
  choice: उसकी सारी भूमि ... जली हुई उजाड़ भूमि होगी
  rationale: שְׂרֵפָה में जलने अथवा जली हुई दशा का भाव है। हिन्दी में ‘जली हुई उजाड़ भूमि’ अग्नि और उसके विनाशकारी परिणाम दोनों को स्वाभाविक रूप से व्यक्त करता है। भविष्यसूचक संदर्भ के कारण जोड़ा गया ‘होगी’ उपयुक्त है।
- source_word: לֹא תִזָּרַע
  choice: उसमें न बीज बोया जाएगा
  rationale: निफ़अल अपूर्ण रूप को निष्क्रिय भविष्य के रूप में रखा गया है; ‘उसमें’ हिन्दी में भूमि के साथ स्वाभाविक है।
- source_word: וְלֹא תַצְמִחַ
  choice: न वह कुछ उपजाएगी
  rationale: हिफ़ईल रूप भूमि के कुछ उत्पन्न न करने को दर्शाता है; ‘कुछ’ हिन्दी में निरपेक्ष निषेध को सहज बनाता है।
- source_word: וְלֹא יַעֲלֶה בָהּ כָּל עֵשֶׂב
  choice: और न उसमें कोई वनस्पति उगेगी
  rationale: עֵשֶׂב यहाँ घास तक सीमित न होकर सामान्य पादप-वृद्धि को सूचित कर सकता है; ‘वनस्पति’ इस व्यापक अर्थ को सुरक्षित रखता है।
- source_word: כְּמַהְפֵּכַת
  choice: विनाश जैसा
  rationale: मूल संज्ञा का शाब्दिक भाव ‘उलट देना’ है, पर नगरों के संदर्भ में ‘विनाश’ स्वाभाविक हिन्दी है; आगे ‘उलट दिया’ रखकर मूल धातु की छवि बचाई गई है।
- source_word: סְדֹם וַעֲמֹרָה אַדְמָה וּצְבֹיִים
  choice: सदोम और अमोरा, अदमा और सबोयीम
  rationale: स्थान-नामों को प्रचलित हिन्दी बाइबलीय रूपों के निकट लिप्यंतरित किया गया है।
- source_word: יְהוָה
  choice: यहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित निकट लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: בְּאַפּוֹ וּבַחֲמָתוֹ
  choice: अपने क्रोध और प्रकोप में
  rationale: दो समानांतर शब्दों की तीव्रता और भेद बनाए रखने के लिए दो गंभीर किन्तु सहज हिन्दी पद चुने गए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी नाम है; ‘यहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है और किसी अतिरिक्त सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: विनाश में ईश्वरीय क्रोध की अभिव्यक्ति
  choice: अपने क्रोध और प्रकोप में
  alternative: अपने रोष और जलजलाहट में
  rationale: मूल के दो तीव्र क्रोध-सूचक पदों को अलग रखते हुए गरिमापूर्ण आधुनिक हिन्दी दी गई है; भाषा को न नरम किया गया है, न मानवीय शारीरिक मुहावरे को अनावश्यक रूप से शब्दशः बनाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। मूल की क्रमिक निषेध-रचना तथा दंड की कठोरता सुरक्षित रखी गई है। भविष्यसूचक संदर्भ के अनुरूप क्रियाएँ भविष्यकाल में हैं।
