source:
  edition: WLC
  text: כִּי֩ אֶת אֲשֶׁ֨ר יֶשְׁנ֜/וֹ פֹּ֗ה עִמָּ֨/נוּ֙ עֹמֵ֣ד הַ/יּ֔וֹם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אֵ֨ת אֲשֶׁ֥ר אֵינֶ֛/נּוּ פֹּ֖ה עִמָּ֥/נוּ הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/014.yaml
  text: but with whoever is standing here with us today before Yahweh our God[a], and with whoever is not here with us today.
translation:
  language: hi
  text: बल्कि हर उस व्यक्ति के साथ भी जो आज यहाँ हमारे साथ हमारे परमेश्वर याहवे के सामने खड़ा है, और हर उस व्यक्ति के साथ भी जो आज यहाँ हमारे साथ नहीं है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जो आज यहाँ हमारे साथ नहीं है’ से आशय सभा में अनुपस्थित इस्राएली, आने वाली पीढ़ियाँ, या दोनों हो सकते हैं।
    reason: मूल पाठ संदर्भित समूह को स्पष्ट रूप से सीमित नहीं करता।
lexical_decisions:
- source_word: כִּי
  choice: बल्कि
  rationale: यह पिछले पद के ‘केवल तुम्हारे साथ नहीं’ का विरोधात्मक विस्तार है; इसलिए कारणसूचक ‘क्योंकि’ के बजाय ‘बल्कि’ प्रसंग के अनुकूल है।
- source_word: אֶת אֲשֶׁר
  choice: उसके साथ भी जो
  rationale: ‘साथ’ पिछले पद की वाचा बाँधने की क्रिया से पूरा किया गया है। एकवचन रूप को बनाए रखते हुए यह अभिव्यक्ति प्रत्येक सम्मिलित व्यक्ति पर बात लागू करती है।
- source_word: יֶשְׁנוֹ פֹּה עִמָּנוּ
  choice: आज यहाँ हमारे साथ ... है
  rationale: ישׁ की उपस्थितिवाचक भावना और פֹּה עִמָּנוּ की सभा में भौतिक उपस्थिति—दोनों को सहज हिन्दी में व्यक्त किया गया है।
- source_word: עֹמֵד
  choice: खड़ा है
  rationale: मूल के ठोस अर्थ और परमेश्वर के सामने एकत्र सभा के दृश्य को सुरक्षित रखा गया है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: स्थान और वाचा-संबंधी उपस्थिति, दोनों के लिए स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: हमारे परमेश्वर याहवे
  rationale: प्रत्यययुक्त אֱלֹהֵינוּ का सीधा अनुवाद किया गया है और परमेश्वर के विशिष्ट नाम को ‘याहवे’ के रूप में रखा गया है।
- source_word: וְאֵת אֲשֶׁר אֵינֶנּוּ פֹּה עִמָּנוּ הַיּוֹם
  choice: और उसके साथ भी जो आज यहाँ हमारे साथ नहीं है
  rationale: पहले खंड के समानांतर संरचना तथा अस्तित्व/उपस्थिति के निषेध को बनाए रखा गया है; ‘अनुपस्थित’ जैसा अधिक व्याख्यात्मक शब्द नहीं जोड़ा गया।
- source_word: הַיּוֹם
  choice: आज
  rationale: दोनों खंडों में मूल की पुनरावृत्ति सुरक्षित रखते हुए वर्तमान हिन्दी का सहज कालसूचक शब्द चुना गया है।
theological_decisions:
- issue: ‘जो आज यहाँ हमारे साथ नहीं है’ का आशय
  choice: वाक्य को व्यापक और अनिर्धारित रखा गया है।
  alternative: इसे केवल सभा से अनुपस्थित इस्राएलियों, केवल भावी पीढ़ियों, अथवा दोनों के लिए स्पष्ट करना।
  rationale: इब्रानी पाठ स्वयं यह निश्चित नहीं करता कि संकेत अनुपस्थित समकालीन लोगों की ओर है, भावी पीढ़ियों की ओर, या दोनों की ओर; अनुवाद इस अर्थगत खुलेपन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पिछले वाक्य को आगे बढ़ाता है, इसलिए आरंभ में ‘बल्कि’ और दोनों खंडों में ‘भी’ से समावेश का बल व्यक्त किया गया है।
