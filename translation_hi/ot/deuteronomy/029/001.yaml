base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/001.yaml
  text: And Moses called all Israel and said to them[a], “You have seen all that Yahweh did before your eyes in the land of Egypt, to Pharaoh and to all his servants and to all his land.”
translation:
  language: hi
  text: मूसा ने सारे इस्राएल को बुलाया और उनसे कहा, “तुमने अपनी आँखों के सामने वह सब देखा है जो याहवे ने मिस्र देश में फ़िरौन, उसके सभी सेवकों और उसके सारे देश के साथ किया।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फ़िरौन, उसके सभी सेवकों और उसके सारे देश के विरुद्ध किया।” हिब्रू पूर्वसर्ग को संदर्भ में इस प्रकार भी समझा जा सकता है, क्योंकि मिस्र में याहवे के कार्य उन पर न्याय के कार्य थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाया
  rationale: सभा के लिए लोगों को बुलाने के अर्थ में यह स्वाभाविक और सीधा हिन्दी प्रयोग है।
- source_word: כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल
  rationale: यह वाचा-समुदाय के सामूहिक संबोधन को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: רְאִיתֶם
  choice: तुमने ... देखा है
  rationale: हिब्रू पूर्ण क्रिया प्रत्यक्ष अनुभव और उसकी वर्तमान प्रासंगिकता को व्यक्त करती है; हिन्दी पूर्ण वर्तमान इसे स्वाभाविक ढंग से बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित रूप से परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय नाम के रूप में सुरक्षित रखा गया है।
- source_word: לְעֵינֵיכֶם
  choice: अपनी आँखों के सामने
  rationale: यह प्रत्यक्ष और सार्वजनिक रूप से देखे जाने पर बल देने वाले हिब्रू मुहावरे की जीवंतता बनाए रखता है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में
  rationale: मूल में आए 'देश' को रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: फ़िरौन, उसके सभी सेवकों और उसके सारे देश के साथ
  rationale: '''के साथ किया'' हिन्दी में प्रभावित पक्षों को स्वाभाविक रूप से दर्शाता है और मूल पूर्वसर्ग ל को अनिवार्य रूप से विरोधात्मक ठहराए बिना उसकी व्यापकता बनाए रखता है।'
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी में 'यहोवा' व्यापक रूप से पहचाना जाने वाला नाम-रूप है और इसे 'प्रभु' जैसे शीर्षक से प्रतिस्थापित नहीं करता।
- issue: फ़िरौन और मिस्र के प्रति किए गए कार्यों का संबंध
  choice: के साथ किया
  alternative: के विरुद्ध किया
  rationale: संदर्भ में न्याय का भाव स्पष्ट है, पर हिब्रू ל स्वयं केवल प्रभावित लक्ष्य को चिह्नित कर सकता है। मुख्य पाठ अपेक्षाकृत खुला अर्थ रखता है और विरोधात्मक अर्थ को पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। प्रत्यक्ष संबोधन और हिब्रू की पुनरुक्त व्यापकता को बनाए रखा गया है।
