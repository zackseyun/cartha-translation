source:
  edition: WLC
  text: פֶּן יֵ֣שׁ בָּ֠/כֶם אִ֣ישׁ אוֹ אִשָּׁ֞ה א֧וֹ מִשְׁפָּחָ֣ה אוֹ שֵׁ֗בֶט אֲשֶׁר֩ לְבָב֨/וֹ פֹנֶ֤ה הַ/יּוֹם֙ מֵ/עִם֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ לָ/לֶ֣כֶת לַ/עֲבֹ֔ד אֶת אֱלֹהֵ֖י הַ/גּוֹיִ֣ם הָ/הֵ֑ם פֶּן יֵ֣שׁ בָּ/כֶ֗ם שֹׁ֛רֶשׁ פֹּרֶ֥ה רֹ֖אשׁ וְ/לַעֲנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/017.yaml
  text: lest there be among you a man or a woman[a], or a clan or a tribe, whose heart is turning away today from Yahweh our God to go and serve the gods of those nations; lest there be among you a root bearing poisonous fruit and wormwood.
translation:
  language: hi
  text: कहीं ऐसा न हो कि तुम्हारे बीच कोई पुरुष या स्त्री, कोई कुल या जनजाति हो, जिसका मन आज हमारे परमेश्वर याहवे से फिर रहा हो और जो उन राष्ट्रों के देवताओं की सेवा करने जाए; कहीं ऐसा न हो कि तुम्हारे बीच ऐसी जड़ हो जो विष[a] और नागदौना उपजाती हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कड़वा विष।” इब्रानी शब्द רֹאשׁ किसी विषैले या अत्यन्त कड़वे पदार्थ अथवा पौधे का संकेत दे सकता है; परम्परागत रूप से इसका अनुवाद “पित्त” भी किया गया है।
    reason: रֹאשׁ का सटीक अभिप्राय अनिश्चित है; पादटिप्पणी मुख्य शाब्दिक विकल्पों को सुरक्षित रखती है।
lexical_decisions:
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह चेतावनी में किसी संभावित खतरे का परिचय देता है और हिन्दी में निषेधात्मक आशंका को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: कोई पुरुष या स्त्री
  rationale: इब्रानी में स्पष्ट पुरुष–स्त्री युग्म को सामान्य ‘व्यक्ति’ में समेटे बिना सुरक्षित रखा गया है।
- source_word: מִשְׁפָּחָה אוֹ שֵׁבֶט
  choice: कोई कुल या गोत्र
  rationale: ‘कुल’ विस्तृत नातेदारी-समूह और ‘गोत्र’ इस्राएल की जनजातीय इकाई को संक्षिप्त, परिचित हिन्दी में व्यक्त करते हैं।
- source_word: לְבָבוֹ פֹנֶה
  choice: जिसका मन ... फिर रहा हो
  rationale: वर्तमान कृदन्त आरम्भ हो रही या जारी विमुखता का संकेत देता है; ‘फिर रहा हो’ उस गतिशीलता को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम का लिप्यंतरण किया गया है।
- source_word: לָלֶכֶת לַעֲבֹד
  choice: सेवा करने जाए
  rationale: गमन और उद्देश्य के इब्रानी मुहावरे को सहज हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהֵי הַגּוֹיִם הָהֵם
  choice: उन राष्ट्रों के देवताओं
  rationale: גּוֹיִם यहाँ आसपास के लोगों की सामूहिक राजनीतिक-सामाजिक इकाइयों को दर्शाता है; ‘राष्ट्रों’ मूल भेद को बनाए रखता है।
- source_word: שֹׁרֶשׁ פֹּרֶה רֹאשׁ וְלַעֲנָה
  choice: ऐसी जड़ ... जो विष और नागदौना उपजाती हो
  rationale: छिपे हुए विनाशकारी स्रोत की जड़-संबंधी उपमा को बनाए रखते हुए दोनों कड़वे/हानिकारक उत्पादों को स्पष्ट किया गया है; רֹאשׁ की lexical अनिश्चितता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: हृदय के फिरने की प्रक्रिया
  choice: मन ... फिर रहा हो
  alternative: मन फिर जाए
  rationale: इब्रानी कृदन्त संभावित रूप से आरम्भ हो चुकी या जारी विमुखता की तनावपूर्ण स्थिति व्यक्त करता है; इसे केवल पूर्ण हो चुकी घटना नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के योग्य रखी गई है। ‘कहीं ऐसा न हो कि’ की पुनरावृत्ति मूल की दोहरी चेतावनी को बनाए रखती है। ‘नागदौना’ अपेक्षाकृत विशिष्ट वनस्पति-शब्द है, पर ‘wormwood’ के लिए प्रचलित और सटीक हिन्दी समतुल्य होने के कारण रखा गया है।
