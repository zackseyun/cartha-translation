source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לִ/שְׁמֹ֣עַ אֶל בִּלְעָ֔ם וַ/יַּהֲפֹךְ֩ יְהוָ֨ה אֱלֹהֶ֧י/ךָ לְּ/ךָ֛ אֶת הַ/קְּלָלָ֖ה לִ/בְרָכָ֑ה כִּ֥י אֲהֵֽבְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/006.yaml
  text: But Yahweh your God was not willing to listen to Balaam, and Yahweh your God turned the curse into a blessing for you, because Yahweh your God loved you.
translation:
  language: hi
  text: लेकिन तुम्हारा परमेश्वर याहवे बिलाम की बात सुनने को तैयार नहीं हुआ; और तुम्हारे परमेश्वर याहवे ने तुम्हारे लिए उस शाप को आशीष में बदल दिया, क्योंकि तुम्हारा परमेश्वर याहवे तुमसे प्रेम करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבָה
  choice: तैयार नहीं हुआ
  rationale: यह क्रिया इच्छा या सहमति न होने को व्यक्त करती है; यह पदबंध आधुनिक हिन्दी में स्वाभाविक रूप से उसके इच्छात्मक भाव को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: यह एकवचन द्वितीय पुरुष प्रत्यय सहित संबंधसूचक रूप का सीधा और स्वाभाविक अनुवाद है।
- source_word: לִשְׁמֹעַ אֶל
  choice: की बात सुनने
  rationale: इस मुहावरे में किसी की बात स्वीकार करने या उसकी सुनने का भाव है; ‘बात सुनना’ हिन्दी में वही अर्थ स्वाभाविक ढंग से देता है, बिना परिणाम को अधिक स्पष्ट किए।
- source_word: בִּלְעָם
  choice: बिलाम
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय लिप्यंतरण।
- source_word: וַיַּהֲפֹךְ
  choice: बदल दिया
  rationale: הפך यहाँ एक अवस्था को दूसरी में परिवर्तित करने का अर्थ देता है; ‘शाप को आशीष में बदल दिया’ सहज हिन्दी है।
- source_word: הַקְּלָלָה
  choice: उस शाप को
  rationale: निश्चित उपपद संदर्भ में पहले से ज्ञात या अभिप्रेत शाप की ओर संकेत करता है; हिन्दी में ‘उस शाप’ यह निश्चितता स्पष्ट करता है।
- source_word: לִבְרָכָה
  choice: आशीष में
  rationale: लामेद परिवर्तन के परिणाम को चिह्नित करता है; ‘में’ हिन्दी में ‘शाप को आशीष में बदलना’ की स्वाभाविक रचना है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह यहोवा के कार्य का कारण प्रस्तुत करता है और आधुनिक हिन्दी में कारण-संबंध स्पष्ट रखता है।
- source_word: אֲהֵבְךָ
  choice: तुमसे प्रेम करता था
  rationale: मूल क्रिया प्रेम को सीधे व्यक्त करती है। हिन्दी का अपूर्ण भूतकाल यहाँ निरंतर या आधारभूत प्रेम को स्वाभाविक रूप से दर्शाता है, न कि केवल एक क्षणिक घटना को।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम स्पष्ट रूप से उपस्थित है। हिन्दी पाठकों के लिए सुस्थापित ‘यहोवा’ नाम को रखा गया है, ‘प्रभु’ जैसी उपाधि से उसे प्रतिस्थापित नहीं किया गया।
- issue: परमेश्वर के प्रेम का कालगत भाव
  choice: तुमसे प्रेम करता था
  alternative: उसने तुमसे प्रेम किया
  rationale: इब्रानी पूर्ण क्रिया भूतकालीन कारण बताती है, पर प्रेम को केवल एक बार की घटना मानना आवश्यक नहीं। हिन्दी का यह रूप कथा के भूतकाल और प्रेम की स्थायी पृष्ठभूमि दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन संबोधन के कारण ‘तुम्हारा/तुमसे’ प्रयोग हुआ है। अर्धविराम मूल वाक्य के विरोध और उसके बाद हुए ईश्वरीय परिवर्तन के बीच संबंध को स्पष्ट करता है।
