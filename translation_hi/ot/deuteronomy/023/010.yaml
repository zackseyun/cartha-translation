  text: כִּֽי תֵצֵ֥א מַחֲנֶ֖ה עַל אֹיְבֶ֑י/ךָ וְ/נִ֨שְׁמַרְתָּ֔ מִ/כֹּ֖ל דָּבָ֥ר רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/010.yaml
  text: When you go out as an army against your enemies[a], then keep yourself from every evil thing.
translation:
  language: hi
  text: जब तुम्हारी छावनी तुम्हारे शत्रुओं के विरुद्ध निकलती है, तब हर बुरी बात से अपने को बचाए रखना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ כִּי उस परिस्थिति का परिचय देता है जिसमें आगे की आज्ञा लागू होती है; विधिक-निर्देशात्मक संदर्भ में ‘जब’ स्वाभाविक है।
- source_word: תֵצֵא מַחֲנֶה
  choice: तुम सेना बनाकर ... निकलो
  rationale: תֵצֵא का सीधा अर्थ ‘तुम निकलो’ है, जबकि מַחֲנֶה यहाँ सैन्य दल या संगठित सेना के भाव में है। यह हिंदी प्रयोग सैन्य संदर्भ स्पष्ट करता है, पर क्रिया में अनावश्यक विस्तार नहीं जोड़ता।
- source_word: עַל אֹיְבֶיךָ
  choice: अपने शत्रुओं के विरुद्ध
  rationale: सैन्य संदर्भ में עַל विरोधसूचक है, और אֹיְבֶיךָ का अर्थ ‘तुम्हारे शत्रु’ है।
- source_word: וְנִשְׁמַרְתָּ
  choice: तब ... अपने आपको बचाए रखना
  rationale: निफ़अल रूप यहाँ आत्मवाचक सावधानी या रक्षा का भाव देता है। ‘अपने आपको बचाए रखना’ आज्ञात्मक क्रम और आत्मवाचकता दोनों को व्यक्त करता है।
- source_word: מִכֹּל דָּבָר רָע
  choice: किसी भी बुरी बात से
  rationale: מִכֹּל अलगाव या बचाव का भाव और व्यापक वितरण व्यक्त करता है। דָּבָר רָע का दायरा व्यापक है; ‘बुरी बात’ इसे केवल किसी वस्तु, वचन या अनुष्ठानिक अशुद्धता तक सीमित नहीं करता।
theological_decisions:
- issue: छावनी-पवित्रता संबंधी व्यवस्था में דָּבָר רָע का दायरा
  choice: ‘किसी भी बुरी बात’ के रूप में व्यापक रखा गया
  alternative: ‘किसी भी अशुद्ध बात’ या ‘किसी भी अनुचित बात’
  rationale: निकटवर्ती संदर्भ में अनुष्ठानिक अशुद्धता सम्मिलित है, पर इब्रानी पद स्वयं उससे अधिक व्यापक हो सकता है। इसलिए अनुवाद किसी एक नैतिक या अनुष्ठानिक अर्थ को निर्णायक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘सेना बनाकर’ सैन्य दल के रूप में निकलने का भाव देता है; ‘बुरी बात’ मूल की व्यापकता और संदर्भगत अस्पष्टता बनाए रखता है।
