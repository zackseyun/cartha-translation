  text: וְ/כִ֥י תֶחְדַּ֖ל לִ/נְדֹּ֑ר לֹֽא יִהְיֶ֥ה בְ/ךָ֖ חֵֽטְא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/023.yaml
  text: But if you refrain from making a vow[a], there will be no sin in you.
translation:
  language: hi
  text: लेकिन यदि तुम मन्नत न मानो, तो तुम पर कोई पाप नहीं होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम पर कोई दोष नहीं होगा।”
    reason: हिब्रानी חֵטְא का अर्थ ‘पाप’ के साथ ‘दोष’ या नैतिक-कानूनी अपराध भी हो सकता है।
lexical_decisions:
- source_word: וְ/כִי
  choice: लेकिन यदि
  rationale: यह पद पिछले पद में मन्नत पूरी करने की बाध्यता के विपरीत एक शर्त रखता है; इसलिए ‘लेकिन यदि’ विरोध और शर्त दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תֶחְדַּל
  choice: दूर रहो
  rationale: חדל का अर्थ रुकना या किसी काम से विरत रहना है। यहाँ आशय पहले से चल रहे काम को रोकना नहीं, बल्कि मन्नत मानने से परहेज़ करना है।
- source_word: לִ/נְדֹּר
  choice: मन्नत मानने से
  rationale: נדר यहाँ मन्नत या प्रतिज्ञा करने को दर्शाता है। धार्मिक संदर्भ में ‘मन्नत मानना’ सामान्य हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: לֹא יִהְיֶה
  choice: नहीं होगा
  rationale: नकार सहित היה यहाँ भावी परिणाम बताता है; हिंदी में ‘नहीं होगा’ उसका सीधा और सहज रूप है।
- source_word: בְ/ךָ
  choice: तुम पर
  rationale: शाब्दिक रूप ‘तुममें’ है, पर पाप या दोष की जवाबदेही के इस कानूनी-नैतिक मुहावरे में ‘तुम पर’ स्वाभाविक हिंदी है और आशय को ठीक रखता है।
- source_word: חֵטְא
  choice: पाप
  rationale: חֵטְא पाप और उससे उत्पन्न दोष—दोनों का बोध करा सकता है। संदर्भ में मुख्य बात यह है कि मन्नत न मानना पाप नहीं है, इसलिए मुख्य पाठ में ‘पाप’ उपयुक्त है।
theological_decisions:
- issue: मन्नत न मानने की नैतिक स्थिति
  choice: मन्नत मानने से दूर रहना अपने आप में पाप नहीं है।
  alternative: यहाँ मुख्य बल पाप की अपेक्षा दोष या दायित्व न होने पर है।
  rationale: חֵטְא में ‘पाप’ और ‘दोष’ दोनों अर्थछायाएँ संभव हैं। पिछले पद के साथ विरोध यह स्पष्ट करता है कि दोष मन्नत न मानने में नहीं, बल्कि मानी हुई मन्नत पूरी न करने में है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन्नत मानना’ धार्मिक प्रतिज्ञा के लिए प्रचलित हिंदी है; ‘तुम पर कोई पाप नहीं होगा’ स्रोत के कानूनी-नैतिक मुहावरे को स्वाभाविक हिंदी में व्यक्त करता है।
