source:
  edition: WLC
  text: לֹא תָבִיא֩ אֶתְנַ֨ן זוֹנָ֜ה וּ/מְחִ֣יר כֶּ֗לֶב בֵּ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/כָל נֶ֑דֶר כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ גַּם שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/019.yaml
  text: You shall not bring the wages of a prostitute or the price of a dog into the house of Yahweh your God for any vow[a], because both of them are an abomination to Yahweh your God.
translation:
  language: hi
  text: तुम किसी वेश्या की कमाई या कुत्ते का दाम[a] किसी भी मन्नत के लिए अपने परमेश्वर याहवे के भवन में न लाना, क्योंकि ये दोनों तुम्हारे परमेश्वर याहवे के लिए घृणित हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “पुरुष वेश्या की कमाई,” यदि यहाँ “कुत्ता” पुरुष देवालय-वेश्या के लिए प्रयुक्त अपमानजनक शब्द है।
    reason: वैकल्पिक अर्थ
lexical_decisions:
- source_word: תָבִיא
  choice: लाना
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को किसी स्थान के भीतर लाना है। निषेधात्मक वाक्य में ‘न लाना’ स्वाभाविक और ठोस है।
- source_word: אֶתְנַן זוֹנָה
  choice: किसी वेश्या की कमाई
  rationale: אֶתְנַן यौन सेवा के बदले मिले भुगतान को और זוֹנָה वेश्या को दर्शाता है। ‘कमाई’ आधुनिक हिन्दी में स्पष्ट है और भुगतान के स्रोत को बनाए रखती है।
- source_word: מְחִיר כֶּלֶב
  choice: कुत्ते का दाम
  rationale: מְחִיר का सामान्य अर्थ ‘दाम’ और כֶּלֶב का शाब्दिक अर्थ ‘कुत्ता’ है। विवादित रूपकात्मक अर्थ को मुख्य पाठ में आरोपित करने के बजाय पादटिप्पणी में दिया गया है।
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहवे के भवन
  rationale: בֵּית को ‘भवन’ कहना स्रोत के ‘घर/भवन’ रूपक को सुरक्षित रखता है और ‘मन्दिर’ जैसी अधिक विशिष्ट व्याख्या से बचता है। יְהוָה को वाचा-संबंधी नाम ‘यहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: לְכָל נֶדֶר
  choice: किसी भी मन्नत के लिए
  rationale: यह पदबंध ऐसी राशि लाने के उद्देश्य या अवसर को बताता है। ‘मन्नत’ נֶדֶר के धार्मिक प्रतिज्ञा-संबंधी अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त करती है।
- source_word: תוֹעֲבַת
  choice: घृणित
  rationale: यह शब्द परमेश्वर की दृष्टि में अत्यन्त आपत्तिजनक या विकर्षक वस्तु के लिए प्रयुक्त होता है। ‘घृणित’ इसकी प्रबल नैतिक-धार्मिक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גַּם שְׁנֵיהֶם
  choice: ये दोनों
  rationale: यह वाक्यांश पहले बताई गई दोनों वस्तुओं को स्पष्ट रूप से निषेध में सम्मिलित करता है।
theological_decisions:
- issue: מְחִיר כֶּלֶב में כֶּלֶב का अर्थ
  choice: मुख्य पाठ में शाब्दिक ‘कुत्ता’
  alternative: ‘पुरुष वेश्या’ अथवा विशेष रूप से ‘देवालय से जुड़ा पुरुष वेश्या’
  rationale: इब्रानी शब्द का प्रत्यक्ष अर्थ ‘कुत्ता’ है, जबकि पुरुष वेश्या वाला अर्थ विवादित है। इसलिए वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है, मुख्य पाठ में निश्चित व्याख्या नहीं बनाई गई।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘यहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और नाम को पदवी में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य कानूनी निषेध की गरिमा और सीधेपन को बनाए रखता है। एकवचन इब्रानी संबोधन को हिन्दी में स्वाभाविक सामान्य संबोधन ‘तुम/तुम्हारे’ से व्यक्त किया गया है। ‘भवन’ स्रोत के בית को सुरक्षित रखता है, जबकि ‘यहवे’ ईश्वरीय नाम को प्रत्यक्ष रूप में प्रस्तुत करता है।
