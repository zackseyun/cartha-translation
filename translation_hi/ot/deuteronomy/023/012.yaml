  yaml_path: translation/ot/deuteronomy/023/012.yaml
  text: And toward evening he shall wash himself with water[b][a], and when the sun sets he may come into the midst of the camp.
translation:
  language: hi
  text: और साँझ होने पर वह पानी से स्नान करे; और सूर्य अस्त होने पर वह छावनी के भीतर आ सकता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה לִפְנוֹת עֶרֶב
  choice: और साँझ होने पर
  rationale: वाव + היה यहाँ विधिक निर्देश को आगे बढ़ाता है, और לִפְנוֹת עֶרֶב दिन के साँझ की ओर मुड़ने का समय बताता है। आधुनिक हिन्दी में यह स्वाभाविक और क्रमसूचक है।
- source_word: יִרְחַץ בַּמָּיִם
  choice: वह पानी से स्नान करे
  rationale: רחץ इस शुद्धि-संबंधी प्रसंग में शरीर धोने को दर्शाता है। ‘स्नान करे’ सामान्य हिन्दी में पूरे शरीर को पानी से धोने का स्पष्ट भाव देता है।
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: और सूर्य अस्त होने पर
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ सूर्य के ‘अंदर आने’ से जुड़ा है, पर उसका प्रचलित आशय सूर्यास्त है। हिन्दी में ‘सूर्य अस्त होने पर’ वही अर्थ गरिमापूर्ण और स्पष्ट ढंग से देता है।
- source_word: יָבֹא
  choice: आ सकता है
  rationale: इस विधिक संदर्भ में अपूर्ण क्रिया शुद्धि और सूर्यास्त के बाद छावनी में फिर प्रवेश की अनुमति व्यक्त करती है, केवल भविष्य की घटना नहीं।
- source_word: אֶל תּוֹךְ הַמַּחֲנֶה
  choice: छावनी के भीतर
  rationale: תּוֹךְ छावनी के अंदरूनी भाग में प्रवेश का बोध कराता है। ‘छावनी के भीतर’ इस सूक्ष्मता को स्वाभाविक हिन्दी में बनाए रखता है।
