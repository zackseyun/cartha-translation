  text: כִּֽי יִהְיֶ֤ה בְ/ךָ֙ אִ֔ישׁ אֲשֶׁ֛ר לֹא יִהְיֶ֥ה טָה֖וֹר מִ/קְּרֵה לָ֑יְלָה וְ/יָצָא֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה לֹ֥א יָבֹ֖א אֶל תּ֥וֹךְ הַֽ/מַּחֲנֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/011.yaml
  text: If there is among you a man who is not clean because of a nocturnal emission[a], he shall go outside the camp; he shall not come into the midst of the camp.
translation:
  language: hi
  text: यदि तुम्हारे बीच कोई पुरुष रात्रिकालीन वीर्यस्राव[a] के कारण शुद्ध न हो, तो वह छावनी के बाहर चला जाए; वह छावनी के भीतर न आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “रात की घटना” है; यह रात्रि में होने वाले वीर्यस्राव के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: इस कानूनी प्रसंग में यह एक संभावित स्थिति प्रस्तुत करता है; इसलिए शर्तसूचक ‘यदि’ उपयुक्त है।
- source_word: יִהְיֶה בְךָ אִישׁ
  choice: तुम्हारे बीच कोई पुरुष
  rationale: अस्तित्वसूचक भाव और समुदाय के बीच होने का अर्थ सुरक्षित रहता है; यहाँ वर्णित शारीरिक स्थिति के कारण ‘पुरुष’ सटीक है।
- source_word: אֲשֶׁר לֹא יִהְיֶה טָהוֹר
  choice: शुद्ध न हो
  rationale: यह अनुष्ठानिक शुद्धता की अवस्था बताता है, नैतिक दोष नहीं। ‘अशुद्ध हो’ भी संभव है, पर नकारात्मक मूल संरचना को सुरक्षित रखा गया है।
- source_word: מִקְּרֵה לָיְלָה
  choice: रात के वीर्यस्राव
  rationale: शाब्दिक अर्थ ‘रात की घटना’ है, पर प्रसंग में यह रात में होने वाले वीर्यस्राव का संकेत देने वाला मुहावरा है। स्पष्ट, सहज और सटीक हिन्दी चुनी गई है।
- source_word: וְיָצָא אֶל מִחוּץ לַמַּחֲנֶה
  choice: तो वह छावनी के बाहर चला जाए
  rationale: कानूनी निर्देश और छावनी की सीमा से बाहर जाने की गति दोनों व्यक्त होते हैं।
- source_word: לֹא יָבֹא אֶל תּוֹךְ הַמַּחֲנֶה
  choice: वह छावनी के भीतर न आए
  rationale: תּוֹךְ के भीतरी भाग के भाव को ‘भीतर’ सुरक्षित रखता है और हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: इस पद में अशुद्धता का स्वरूप
  choice: इसे शारीरिक कारण से उत्पन्न अनुष्ठानिक अशुद्धता की अवस्था के रूप में प्रस्तुत किया गया है।
  alternative: इसे नैतिक दोष या पाप का संकेत मानना।
  rationale: प्रसंग छावनी की पवित्रता और शारीरिक अशुद्धता के नियमों से संबंधित है; पाठ इस घटना को नैतिक अपराध नहीं कहता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कानूनी शैली रखी गई है। ‘छावनी’, ‘शुद्ध’ और ‘भीतर’ जैसे परिचित शब्द मूल के सामुदायिक, अनुष्ठानिक और स्थान-संबंधी भावों को सुरक्षित रखते हैं।
