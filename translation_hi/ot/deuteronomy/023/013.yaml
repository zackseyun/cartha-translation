    reason: lexical_alternative
lexical_decisions:
- source_word: יָד
  choice: जगह
  rationale: शब्द का सामान्य अर्थ ‘हाथ’ है, पर यहाँ वाक्य-संदर्भ में यह छावनी से बाहर नियत स्थान के लिए प्रयुक्त मुहावरा जान पड़ता है। ‘जगह’ आधुनिक हिन्दी में स्वाभाविक है और अगले उपवाक्य के ‘वहाँ’ से स्पष्ट रूप से जुड़ता है।
- source_word: תִּהְיֶה לְךָ
  choice: तुम्हारे लिए ... होनी चाहिए
  rationale: היה + לְ की रचना किसी के लिए किसी वस्तु या व्यवस्था के होने को व्यक्त करती है। विधिक निर्देश के संदर्भ में ‘होनी चाहिए’ उसके आदेशात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह पदबंध छावनी की सीमा से बाहर का स्थान सीधे बताता है।
- source_word: וְיָצָאתָ
  choice: और तुम ... जाया करना
  rationale: יצא का मूल अर्थ ‘बाहर जाना’ है। प्रसंग में यह एक बार की घटना नहीं, आवश्यकता पड़ने पर पालन किए जाने वाले निर्देश को दर्शाता है; ‘जाया करना’ हिन्दी में यह आवर्ती निर्देश स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁמָּה
  choice: वहाँ
  rationale: दिशासूचक क्रियाविशेषण पहले बताई गई नियत जगह की ओर संकेत करता है।
- source_word: חוּץ
  choice: बाहर
  rationale: अंत का חוּץ बाहर जाने पर फिर बल देता है। हिन्दी में इसे बनाए रखने से इब्रानी की पुनरुक्ति और निर्देश का जोर सुरक्षित रहता है।
