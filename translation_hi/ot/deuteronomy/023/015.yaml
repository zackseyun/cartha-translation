  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ מִתְהַלֵּ֣ךְ בְּ/קֶ֣רֶב מַחֲנֶ֗/ךָ לְ/הַצִּֽילְ/ךָ֙ וְ/לָ/תֵ֤ת אֹיְבֶ֨י/ךָ֙ לְ/פָנֶ֔י/ךָ וְ/הָיָ֥ה מַחֲנֶ֖י/ךָ קָד֑וֹשׁ וְ/לֹֽא יִרְאֶ֤ה בְ/ךָ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/שָׁ֖ב מֵ/אַחֲרֶֽי/ךָ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/015.yaml
  text: For Yahweh your God walks in the midst of your camp to deliver you and to give your enemies before you[a]. Therefore your camp must be holy[c][b], so that he may not see in you anything indecent and turn away from you.
translation:
  language: hi
  text: क्योंकि तुम्हारा परमेश्वर यहोवा तुम्हें बचाने और तुम्हारे शत्रुओं को तुम्हारे हाथ में कर देने के लिए तुम्हारी छावनी के बीच चलता-फिरता है। इसलिए तुम्हारी छावनी पवित्र रहे, ताकि वह तुम्हारे बीच कोई अशोभनीय बात[a] न देखे और तुम्हारे पीछे से लौट न जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई लज्जाजनक अथवा अशुद्ध करने वाली बात।” हिब्रू अभिव्यक्ति व्यापक है; इसका अर्थ केवल नग्नता नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुमसे दूर न हो जाए।” शाब्दिक रूप से, “तुम्हारे पीछे से लौट जाए”; इसमें यहोवा के छावनी के साथ रहना छोड़ देने का चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित रूप; मूल पाठ के व्यक्तिगत वाचा-नाम को सामान्य उपाधि में नहीं बदलता।
- source_word: מִתְהַלֵּךְ
  choice: चलता-फिरता है
  rationale: हित्पाएल रूप छावनी के भीतर सक्रिय आवागमन और उपस्थिति का चित्र देता है; ठोस मानवरूपी भाषा सुरक्षित रखी गई है।
- source_word: בְּקֶרֶב מַחֲנֶךָ
  choice: तुम्हारी छावनी के बीच
  rationale: בקרב की मध्यस्थ/आंतरिक उपस्थिति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְהַצִּילְךָ
  choice: तुम्हें बचाने
  rationale: सैन्य प्रसंग में रक्षा और संकट से छुड़ाने का अर्थ सहज रूप से देता है।
- source_word: וְלָתֵת אֹיְבֶיךָ לְפָנֶיךָ
  choice: तुम्हारे शत्रुओं को तुम्हारे हाथ में कर देने
  rationale: शाब्दिक 'तुम्हारे सामने देने' के बजाय हिब्रू मुहावरे का आशय—शत्रुओं को अधिकार में सौंपना—स्पष्ट और स्वाभाविक हिन्दी में दिया गया है।
- source_word: וְהָיָה מַחֲנֶיךָ קָדוֹשׁ
  choice: इसलिए तुम्हारी छावनी पवित्र रहे
  rationale: संदर्भ में यह केवल भविष्यवाणी नहीं, यहोवा की निकट उपस्थिति पर आधारित अपेक्षा/आज्ञा है; 'रहे' उसका निर्देशात्मक बल व्यक्त करता है।
- source_word: עֶרְוַת דָּבָר
  choice: कोई अशोभनीय बात
  rationale: यह व्यापक हिब्रू अभिव्यक्ति है, जो केवल नग्नता तक सीमित नहीं बल्कि लज्जाजनक या अशुद्ध करने वाली बात को भी समेट सकती है।
- source_word: וְשָׁב מֵאַחֲרֶיךָ
  choice: तुम्हारे पीछे से लौट न जाए
  rationale: सिर्फ 'तुमसे दूर न हो जाए' कहने की अपेक्षा मूल की स्थानिक छवि—सेना के साथ पीछे उपस्थित यहोवा का लौट जाना—बचाई गई है।
theological_decisions:
- issue: यहोवा की उपस्थिति का मानवरूपी वर्णन
  choice: '''छावनी के बीच चलता-फिरता है'' की ठोस भाषा बनाए रखना'
  alternative: '''तुम्हारी छावनी में उपस्थित रहता है'''
  rationale: मूल पाठ चलने की मूर्त भाषा द्वारा परमेश्वर की निकटता और उससे उत्पन्न पवित्रता की माँग पर बल देता है; अनुवाद इस छवि को किसी शारीरिकता-संबंधी निष्कर्ष के बिना सुरक्षित रखता है।
- issue: छावनी की पवित्रता वाले खंड का बल
  choice: '''तुम्हारी छावनी पवित्र रहे'''
  alternative: '''तुम्हारी छावनी पवित्र होगी'''
  rationale: 'प्रसंग में खंड निर्देशात्मक है: यहोवा की उपस्थिति के कारण छावनी को पवित्र रखना आवश्यक है।'
- issue: यहोवा के लौट जाने की छवि
  choice: '''तुम्हारे पीछे से लौट न जाए'''
  alternative: '''तुमसे दूर न हो जाए'''
  rationale: मूल की असहज किंतु अर्थपूर्ण सैन्य-यात्रा की छवि सुरक्षित रहती है और यह नहीं जोड़ा जाता कि यहोवा लोगों का 'अनुसरण' कर रहा था।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन सामूहिक संबोधन ('तुम्हारा/तुम्हें') और गरिमापूर्ण किंतु सहज वाक्य-विन्यास। 'यहोवा' हिन्दी बाइबल परंपरा के अनुरूप रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
