id: DEU.23.17
reference: Deuteronomy 23:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עִמְּ/ךָ֞ יֵשֵׁ֣ב בְּ/קִרְבְּ/ךָ֗ בַּ/מָּק֧וֹם אֲשֶׁר יִבְחַ֛ר בְּ/אַחַ֥ד שְׁעָרֶ֖י/ךָ בַּ/טּ֣וֹב ל֑/וֹ לֹ֖א תּוֹנֶֽ/נּוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/017.yaml
  text: He shall live with you[a], in your midst, in the place that he chooses within one of your gates, wherever it is good for him[b]; you shall not oppress him.
translation:
  language: hi
  text: वह तुम्हारे साथ[a], तुम्हारे बीच, तुम्हारे फाटकों में से किसी एक के भीतर[b], उस स्थान पर रहे जिसे वह चुन ले—जहाँ उसके लिए अच्छा हो। तुम उस पर अत्याचार न करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे साथ बसे।”
    reason: lexical_alternative
  - marker: b
    text: “फाटकों में से किसी एक के भीतर” इब्रानी मुहावरा है, जिसका आशय तुम्हारे किसी नगर या समुदाय में बसने से है।
    reason: cultural_note
lexical_decisions:
- source_word: יֵשֵׁב
  choice: रहे
  rationale: यह क्रिया बैठने, ठहरने या निवास करने का अर्थ दे सकती है। इस कानूनी प्रसंग में “रहे” स्थायी अथवा निरंतर निवास की अनुमति को सहज हिन्दी में व्यक्त करता है।
- source_word: עִמְּךָ
  choice: तुम्हारे साथ
  rationale: यह मूल पूर्वसर्ग का सीधा अर्थ है; अगला पद समुदाय के भीतर होने का भाव अलग से व्यक्त करता है।
- source_word: בְּקִרְבְּךָ
  choice: तुम्हारे बीच
  rationale: यह समुदाय के भीतर रहने का भाव स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: उस स्थान पर ... जिसे वह चुन ले
  rationale: चुनने वाला वही शरण लेने वाला व्यक्ति है। अनुवाद उसकी अपनी पसंद के कानूनी अधिकार को बिना विस्तार किए सुरक्षित रखता है।
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: तुम्हारे फाटकों में से किसी एक के भीतर
  rationale: “फाटक” मूल इब्रानी बिंब को बनाए रखता है; यहाँ यह नगर अथवा स्थानीय बस्ती के लिए लक्षणा है, जिसे पाद-टिप्पणी स्पष्ट करती है।
- source_word: בַּטּוֹב לוֹ
  choice: जहाँ उसके लिए अच्छा हो
  rationale: यह इब्रानी के असामान्य किंतु अर्थपूर्ण शब्द-विन्यास के निकट है और केवल व्यक्तिगत पसंद तथा वास्तविक हित के बीच की संभावित अर्थ-व्याप्ति को खुला रखता है।
- source_word: לֹא תּוֹנֶנּוּ
  choice: तुम उस पर अत्याचार न करना
  rationale: कानूनी प्रसंग में यह क्रिया निर्बल व्यक्ति को दबाने, उसका शोषण करने या उसके साथ अन्याय करने की प्रबल मनाही व्यक्त करती है।
theological_decisions:
- issue: पुल्लिंग एकवचन रूपों का संदर्भ
  choice: पिछले पद में आए भागे हुए दास को व्याकरणिक रूप से एकवचन पुरुष मानकर “वह/उसके/उस पर” रखा गया है।
  alternative: अनिर्दिष्ट व्यक्ति के लिए लिंग-निरपेक्ष बहुवचन अथवा “वह व्यक्ति” का प्रयोग।
  rationale: इब्रानी में सभी संबद्ध रूप पुल्लिंग एकवचन हैं। हिन्दी में एकवचन सर्वनाम स्वाभाविक हैं और स्रोत का व्याकरणिक रूप बनाए रखते हैं, बिना उससे अतिरिक्त धर्मशास्त्रीय निष्कर्ष निकाले।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और कानूनी निर्देश के अनुरूप है। “न करना” निषेध की सीधी, प्रचलित शैली रखता है। “फाटक” स्रोत-बिंब को सुरक्षित रखता है, जबकि पाद-टिप्पणी आधुनिक पाठक के लिए उसके सामुदायिक अर्थ को स्पष्ट करती है।
