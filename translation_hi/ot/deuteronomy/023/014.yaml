  text: וְ/יָתֵ֛ד תִּהְיֶ֥ה לְ/ךָ֖ עַל אֲזֵנֶ֑/ךָ וְ/הָיָה֙ בְּ/שִׁבְתְּ/ךָ֣ ח֔וּץ וְ/חָפַרְתָּ֣ה בָ֔/הּ וְ/שַׁבְתָּ֖ וְ/כִסִּ֥יתָ אֶת צֵאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/014.yaml
  text: And you shall have a peg among your equipment[a], and when you sit down outside[c][b], you shall dig with it and turn back and cover your excrement.
translation:
  language: hi
  text: और अपने साज-सामान[b] में एक खूंटी[a] रखो। जब तुम बाहर बैठो[c], तब उससे खोदना; फिर मुड़कर अपने मल को ढक देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खूँटा’; कुछ लोग प्रसंग के आधार पर इसे खोदने का औज़ार या छोटी कुदाली समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘तुम्हारे कान पर।’ यहाँ यह इब्रानी मुहावरा सम्भवतः साथ रखे साज-सामान को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में ‘जब तुम बाहर बैठो’ है; यह शौच करने के लिए प्रयुक्त शिष्ट संकेत है।
    reason: cultural_note
lexical_decisions:
- source_word: יָתֵד
  choice: खूंटी
  rationale: यह संज्ञा सामान्यतः खूंटी या खूँटा दर्शाती है। यहाँ उससे खोदने का काम लिया जाता है; ‘खूंटी’ मूल शब्द की ठोस छवि बचाती है, जबकि अगला वाक्य उसका उपयोग स्पष्ट करता है।
- source_word: עַל אֲזֵנֶךָ
  choice: तुम्हारे सामान में
  rationale: אֲזֵן का शाब्दिक अर्थ ‘कान’ है, पर यहाँ अभिव्यक्ति सैनिक के साथ रखे साज-सामान की ओर संकेत करती प्रतीत होती है। शाब्दिक अनुवाद हिन्दी में अर्थहीन होगा, इसलिए प्रसंगानुकूल अर्थ दिया गया है और मूल रूप पादटिप्पणी में रखा गया है।
- source_word: בְּשִׁבְתְּךָ חוּץ
  choice: जब तुम बाहर बैठो
  rationale: इब्रानी में शाब्दिक रूप से ‘तुम्हारे बाहर बैठने पर’ है। यह शौच करने के लिए बाहर जाने का शिष्ट संकेत है; हिन्दी अनुवाद उसी व्यंजना को बनाए रखता है।
- source_word: וְחָפַרְתָּה בָהּ
  choice: तब उससे खोदना
  rationale: स्त्रीलिंग सर्वनाम יָתֵד की ओर लौटता है। ‘उससे खोदना’ संक्षिप्त और सटीक है; ‘गड्ढा’ अर्थ में निहित है, पर मूल में स्पष्ट रूप से नहीं है।
- source_word: וְשַׁבְתָּ
  choice: फिर मुड़कर
  rationale: שׁוב यहाँ खोदने के बाद मल ढकने के लिए वापस मुड़ने की क्रिया बताता है। ‘फिर मुड़कर’ हिन्दी में क्रियाओं का क्रम स्वाभाविक रूप से प्रकट करता है।
- source_word: צֵאָתֶךָ
  choice: अपने मल को
  rationale: यह शब्द मानव-विसर्जित पदार्थ को दर्शाता है। ‘मल’ आधुनिक मानक हिन्दी में सटीक, सहज और कानूनी निर्देश के अनुकूल शालीन शब्द है।
