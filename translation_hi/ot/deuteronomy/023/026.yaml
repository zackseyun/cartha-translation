base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/026.yaml
  text: When you come into your neighbor’s standing grain[a], you may pluck heads with your hand[b], but you shall not put a sickle to your neighbor’s standing grain.
translation:
  language: hi
  text: जब तुम अपने पड़ोसी की खड़ी फसल[a] में जाओ, तो अपने हाथ से बालियाँ तोड़ सकते हो; लेकिन अपने पड़ोसी की खड़ी फसल पर हँसिया न चलाना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खड़ा अनाज’। इब्रानी शब्द खेत में अभी तक न काटे गए अनाज को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: ‘हँसिया न उठाना’ या ‘न लहराना’; यहाँ आशय हँसिए से फसल काटने का है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: जब तुम ... में जाओ
  rationale: כִּי यहाँ व्यवस्था लागू होने की परिस्थिति प्रस्तुत करता है; आधुनिक हिन्दी में ‘जब’ इस प्रसंगगत अर्थ को स्वाभाविक ढंग से व्यक्त करता है। בוא का अर्थ यहाँ किसी स्थान में जाना या प्रवेश करना है।
- source_word: בְּקָמַת רֵעֶךָ
  choice: अपने पड़ोसी की खड़ी फसल में
  rationale: קָמָה खेत में अभी खड़े, न काटे गए अनाज को दर्शाता है। ‘खड़ी फसल’ हिन्दी में इसी कृषि-अवस्था का स्वाभाविक और सटीक संकेत देती है; רֵעַ के लिए विधिक-सामुदायिक संदर्भ में ‘पड़ोसी’ उपयुक्त है।
- source_word: וְקָטַפְתָּ
  choice: तोड़ सकते हो
  rationale: रूपतः यह साधारण क्रिया है, पर इस विधिक विरोध में हाथ से बालें तोड़ने की अनुमति व्यक्त होती है, आदेश नहीं। इसलिए ‘सकते हो’ निहित अनुमतिपरक बल स्पष्ट करता है।
- source_word: מְלִילֹת
  choice: बालें
  rationale: यह शब्द अनाज के दाने धारण करने वाली बालियों/बालों को सूचित करता है। आधुनिक हिन्दी के कृषि-संदर्भ में ‘बालें’ संक्षिप्त और स्पष्ट है।
- source_word: בְּיָדֶךָ
  choice: अपने हाथ से
  rationale: यह अनुमत तरीके को सीमित करता है—केवल हाथ से तोड़ना। हिन्दी में ‘अपने हाथ से’ मूल अभिव्यक्ति के निकट और सहज है।
- source_word: וְחֶרְמֵשׁ לֹא תָנִיף
  choice: लेकिन ... हँसिया न चलाना
  rationale: וְ यहाँ हाथ से तोड़ने की अनुमति और औजार से कटाई की मनाही के बीच विरोध दर्शाता है। נוף के हिफ़ील रूप में उठाने, हिलाने या चलाने का भाव है; हँसिए के साथ ‘हँसिया चलाना’ हिन्दी का स्वाभाविक प्रयोग है और वास्तविक कटाई की मनाही स्पष्ट करता है।
- source_word: עַל קָמַת רֵעֶךָ
  choice: अपने पड़ोसी की खड़ी फसल पर
  rationale: עַל को ‘पर’ से रखकर हँसिए को खड़ी फसल पर लगाने या चलाने का संबंध व्यक्त किया गया है और मूल की पुनरावृत्ति भी सुरक्षित रखी गई है।
