id: DEU.23.8
reference: Deuteronomy 23:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא תְתַעֵ֣ב אֲדֹמִ֔י כִּ֥י אָחִ֖י/ךָ ה֑וּא לֹא תְתַעֵ֣ב מִצְרִ֔י כִּי גֵ֖ר הָיִ֥יתָ בְ/אַרְצֽ/וֹ־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/008.yaml
  text: You shall not abhor an Edomite[a], for he is your brother. You shall not abhor an Egyptian[c][b], for you were a sojourner in his land.
translation:
  language: hi
  text: तू किसी एदोमी से घृणा न करना[a], क्योंकि वह तेरा भाई है[b]। तू किसी मिस्री से घृणा न करना, क्योंकि तू उसके देश में परदेशी था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘घिन न करना’ अथवा ‘घृणित न समझना।’ यही शब्द इस पद में दोनों बार आया है।
    reason: lexical_alternative
  - marker: b
    text: ‘तेरा भाई’ एदोम के साथ इस्राएल की नातेदारी की ओर संकेत करता है; एदोम एसाव का वंश था।
    reason: cross_reference
  - marker: c
    text: या ‘निवासी विदेशी’। यहाँ उस व्यक्ति का भाव है जो अपने मूल देश या कुल से बाहर दूसरे लोगों के बीच रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְתַעֵב
  choice: घृणा न करना
  rationale: पिएल रूप किसी व्यक्ति को घृणित मानने या उससे तीव्र घृणा करने का भाव देता है। आधुनिक हिन्दी में ‘घृणा न करना’ इस प्रबल भाव को स्वाभाविक ढंग से व्यक्त करता है; दोनों समानांतर निषेधों में इसकी पुनरावृत्ति भी रखी गई है।
- source_word: אֲדֹמִי
  choice: एदोमी
  rationale: एदोम जाति के एक सदस्य के लिए मानक जातिवाचक रूप; इब्रानी के प्रतिनिधिक एकवचन को बनाए रखता है।
- source_word: אָחִיךָ
  choice: तेरा भाई
  rationale: मूल पारिवारिक शब्द को यथावत रखा गया है। यह इस्राएल और एसाव के वंशज एदोम के बीच नातेदारी की ऐतिहासिक पृष्ठभूमि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: מִצְרִי
  choice: मिस्री
  rationale: मिस्र के व्यक्ति के लिए प्रचलित हिन्दी जातिवाचक रूप और इब्रानी के प्रतिनिधिक एकवचन के अनुरूप।
- source_word: גֵר
  choice: परदेशी
  rationale: यह शब्द अपने मूल कुल या देश से बाहर दूसरे लोगों के बीच रहने वाले व्यक्ति को सूचित करता है। ‘परदेशी’ सामान्य हिन्दी पाठक के लिए सहज है और केवल पर्यटक या अल्पकालिक यात्री का अर्थ नहीं देता।
- source_word: בְאַרְצוֹ
  choice: उसके देश में
  rationale: एकवचन प्रत्यय को बनाए रखते हुए मिस्री व्यक्ति को मिस्र का प्रतिनिधि मानने वाली इब्रानी अभिव्यक्ति को सुरक्षित रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दोनों आदेशों के आधार या कारण को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: राष्ट्रीय समूहों के लिए प्रतिनिधिक एकवचन
  choice: ‘किसी एदोमी’, ‘किसी मिस्री’, ‘वह’ और ‘उसके देश’ के रूप में एकवचन बनाए रखा गया।
  alternative: 'शैलीगत सहजता के लिए बहुवचन करना: ‘एदोमियों ... मिस्रियों ... उनके देश’।'
  rationale: इब्रानी व्यवस्था-संबंधी शैली में जातिवाचक एकवचन पूरे समुदाय के किसी भी सदस्य का प्रतिनिधित्व करता है। हिन्दी में ‘किसी’ जोड़ने से यह अर्थ स्पष्ट और स्वाभाविक होता है, जबकि मूल का व्यक्तिगत बल भी बना रहता है।
- issue: एदोम के साथ नातेदारी की भाषा
  choice: शाब्दिक रूप ‘तेरा भाई’ रखा गया।
  alternative: व्याख्यात्मक रूप ‘तेरा संबंधी’ या ‘तेरा भाई-बन्धु’।
  rationale: पाठ निषेध का आधार इस्राएल और एदोम के पारिवारिक संबंध में रखता है। ‘भाई’ इस धर्मवैधानिक-ऐतिहासिक तनाव को व्याख्या में विलीन किए बिना सुरक्षित रखता है।
- issue: मिस्र में इस्राएल के निवास का वर्णन
  choice: ‘परदेशी था’ रखा गया।
  alternative: ‘निवासी विदेशी था’ या ‘प्रवासी होकर रहता था’।
  rationale: मूल גֵר आश्रित विदेशी निवासी की सामाजिक स्थिति का संकेत दे सकता है, पर पद स्वयं उसका पूरा कानूनी विवरण नहीं खोलता। ‘परदेशी’ अर्थ को संक्षिप्त रखता है और अनावश्यक विशिष्टीकरण से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन संबोधन ‘तू’ रखा गया है, क्योंकि इब्रानी आदेश एकवचन में इस्राएल को संबोधित करता है। भाषा सरल, गरिमापूर्ण और विधिक निर्देश के अनुरूप है। जातिवाचक एकवचन को हिन्दी में स्वाभाविक बनाने के लिए ‘किसी’ जोड़ा गया है।
