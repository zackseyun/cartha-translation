source:
  edition: WLC
  text: בָּנִ֛ים אֲשֶׁר יִוָּלְד֥וּ לָ/הֶ֖ם דּ֣וֹר שְׁלִישִׁ֑י יָבֹ֥א לָ/הֶ֖ם בִּ/קְהַ֥ל יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/009.yaml
  text: Children born to them in the third generation may enter the assembly of Yahweh[a][b].
translation:
  language: hi
  text: उनके यहाँ तीसरी पीढ़ी में जन्मी संतानें[a] यहोवा की सभा में प्रवेश कर सकती हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘पुत्र’; इस कानूनी-वंशावली संदर्भ में इसका आशय अधिक व्यापक रूप से संतान या वंशजों से है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘तीसरी पीढ़ी प्रवेश करेगी।’ इब्रानी का अधिक औपचारिक अनुवाद ऐसा हो सकता है, पर संदर्भ में भाव यह है कि तीसरी पीढ़ी से प्रवेश की अनुमति है।
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: बच्चे
  rationale: शाब्दिक अर्थ ‘पुत्र’ है, पर इस वंशावली-संबंधी कानूनी संदर्भ में यह संतान को व्यापक रूप से सूचित करता है; ‘बच्चे’ स्वाभाविक और संदर्भानुकूल है।
- source_word: אֲשֶׁר יִוָּלְדוּ לָהֶם
  choice: उनसे उत्पन्न
  rationale: यह प्रयोग उनके वंश में जन्म लेने का अर्थ देता है; ‘उनसे उत्पन्न’ संक्षिप्त, स्वाभाविक और वंशावली-संदर्भ के अनुकूल है।
- source_word: דּוֹר שְׁלִישִׁי
  choice: तीसरी पीढ़ी में
  rationale: यह उस पीढ़ीगत बिंदु को व्यक्त करता है जहाँ से सभा में प्रवेश संभव होता है।
- source_word: יָבֹא
  choice: प्रवेश कर सकते हैं
  rationale: क्रिया का मूल अर्थ ‘आना/प्रवेश करना’ है। कानूनी संदर्भ में यह अनुमति का भाव रखती है, जिसे आधुनिक हिन्दी में ‘प्रवेश कर सकते हैं’ स्पष्ट करता है।
- source_word: בִּקְהַל יְהוָה
  choice: यहोवा की सभा में
  rationale: קהל वाचा-समुदाय की एकत्र सभा को सूचित करता है; ‘सभा’ आधुनिक हिन्दी में स्वाभाविक है। יְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है; हिन्दी में प्रचलित नामरूप ‘यहोवा’ शीर्षक ‘प्रभु’ से इसका भेद बनाए रखता है।
- issue: कानूनी-वंशावली संदर्भ में בָּנִים का दायरा
  choice: बच्चे
  alternative: पुत्र
  rationale: इब्रानी रूप पुल्लिंग बहुवचन है, किंतु यहाँ वह वंश की संतानों को सामूहिक रूप से सूचित करता है; मुख्य पाठ में व्यापक संदर्भगत अर्थ रखा गया और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: יָבֹא का विधिक भाव
  choice: प्रवेश कर सकते हैं
  alternative: प्रवेश करेंगे
  rationale: रूप को भविष्यवाणी की तरह समझना संभव है, पर व्यवस्था-संबंधी संदर्भ में इसका आशय तीसरी पीढ़ी से प्रवेश की अनुमति है; वैकल्पिक अधिक औपचारिक अनुवाद पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कानूनी-वंशावली संदर्भ के अनुरूप भाषा रखी गई है। ईश्वरीय नाम के लिए प्रचलित हिन्दी रूप ‘यहोवा’ अपनाया गया है; वास्तविक इब्रानी अस्पष्टता पादटिप्पणी में सुरक्षित है।
