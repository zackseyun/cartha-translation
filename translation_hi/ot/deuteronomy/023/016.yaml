source:
  edition: WLC
  text: לֹא תַסְגִּ֥יר עֶ֖בֶד אֶל אֲדֹנָ֑י/ו אֲשֶׁר יִנָּצֵ֥ל אֵלֶ֖י/ךָ מֵ/עִ֥ם אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/016.yaml
  text: You shall not hand over to his master a servant who has escaped from his master to you[a].
translation:
  language: hi
  text: तुम किसी ऐसे दास को उसके स्वामी के हवाले न करना, जो अपने स्वामी के पास से भागकर तुम्हारे पास आया हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेवक।” इब्रानी शब्द का अर्थ “दास” या “सेवक” हो सकता है, पर यहाँ स्वामी के अधीन बँधी हुई स्थिति इस व्यवस्था का मुख्य विषय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסְגִּיר
  choice: हाथ न सौंपना
  rationale: हिफ़ील रूप यहाँ किसी व्यक्ति को दूसरे के अधिकार में सौंप देने का अर्थ देता है। यह हिंदी में स्वाभाविक है और कानूनी बल बनाए रखता है।
- source_word: עֶבֶד
  choice: दास
  rationale: स्वामी के अधीन बँधी हुई सामाजिक स्थिति इस व्यवस्था का केंद्र है; इसलिए केवल सेवक की अपेक्षा दास अधिक सटीक है।
- source_word: אֶל אֲדֹנָיו
  choice: उसके स्वामी के हाथ
  rationale: इस सामाजिक-कानूनी संदर्भ में אָדוֹן व्यक्ति के स्वामी को दर्शाता है; 'के हाथ सौंपना' लक्ष्य और नियंत्रण दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֲשֶׁר יִנָּצֵל
  choice: जो ... भागकर ... आया हो
  rationale: निफ़ाल יִנָּצֵל में बच निकलने या छुड़ाए जाने की अर्थ-संभावना है; यहाँ स्वामी के पास से आने के संदर्भ में 'भागकर आया हो' सबसे स्वाभाविक प्रसंगगत अर्थ है।
- source_word: אֵלֶיךָ
  choice: तुम्हारे पास
  rationale: אֶל की दिशात्मकता को हिंदी में 'तुम्हारे पास आया' स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵעִם אֲדֹנָיו
  choice: अपने स्वामी के पास से
  rationale: מֵעִם स्वामी की संगति या अधिकार-क्षेत्र से अलग होने को दर्शाता है; यह हिंदी रूप उस संबंध-विच्छेद को बनाए रखता है।
theological_decisions:
- issue: עֶבֶד की सामाजिक स्थिति
  choice: दास
  alternative: सेवक
  rationale: पद ऐसे व्यक्ति की बात करता है जो स्वामी के अधीन था, वहाँ से भागा और जिसे लौटाने से मना किया गया है। अतः बँधी हुई अधीनता को स्पष्ट करने वाला 'दास' स्रोत के सामाजिक-कानूनी तनाव को अधिक ठीक रखता है।
- issue: יִנָּצֵל का अर्थ
  choice: भागकर ... आया हो
  alternative: बचकर आया हो / छुड़ाया गया हो
  rationale: निफ़ाल रूप दोनों अर्थों की गुंजाइश रख सकता है, पर स्वामी के पास से दास के आने और उसे वापस न सौंपने के संदर्भ में स्वयं भाग निकलना प्रमुख प्रसंगगत अर्थ है। वैकल्पिक अर्थ को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन एकवचन 'तुम' रखा गया है। भाषा विधिक और गरिमापूर्ण है, पर सामान्य पाठक के लिए सहज है। 'दास' सामाजिक अधीनता को स्पष्ट करता है और 'हाथ सौंपना' निषिद्ध प्रत्यर्पण का बल बनाए रखता है।
