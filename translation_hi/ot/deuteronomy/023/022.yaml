source:
  edition: WLC
  text: כִּֽי תִדֹּ֥ר נֶ֨דֶר֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א תְאַחֵ֖ר לְ/שַׁלְּמ֑/וֹ כִּֽי דָּרֹ֨שׁ יִדְרְשֶׁ֜/נּוּ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מֵֽ/עִמָּ֔/ךְ וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/022.yaml
  text: But if you make a vow to Yahweh your God[a], you shall not delay in paying it, for Yahweh your God will surely require it from you, and it will be sin in you.
translation:
  language: hi
  text: पर यदि तुम अपने परमेश्वर याहवे के लिए कोई मन्नत मानो, तो उसे पूरा करने में देर न करना, क्योंकि तुम्हारा परमेश्वर याहवे उसे तुमसे निश्चय ही माँगेगा, और तुम पर पाप होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “और तुममें पाप होगा।”'
    reason: मूल हिब्रू की असामान्य संरचना और संभावित शाब्दिक अनुवाद को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: पर यदि
  rationale: यहाँ כִּי पिछले पद के संदर्भ में शर्त के साथ हल्का विरोध भी व्यक्त करता है; इसलिए ‘पर यदि’ स्वाभाविक है।
- source_word: תִדֹּר נֶדֶר
  choice: कोई मन्नत मानो
  rationale: सजातीय क्रिया-संज्ञा का हिन्दी मुहावरेदार रूप ‘मन्नत मानना’ है।
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा के लिए
  rationale: לְ मन्नत के संबोधन/समर्पण को दिखाता है और יהוה को व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: לֹא תְאַחֵר לְשַׁלְּמוֹ
  choice: उसे पूरा करने में देर न करना
  rationale: שלם मन्नत के संदर्भ में प्रतिज्ञात बात को चुकाने या पूरा करने का अर्थ देता है; ‘पूरा करना’ विभिन्न प्रकार की मन्नतों पर स्वाभाविक रूप से लागू होता है।
- source_word: דָּרֹשׁ יִדְרְשֶׁנּוּ
  choice: निश्चय ही ... उसका हिसाब लेगा
  rationale: क्रियार्थक संज्ञा और सीमित क्रिया का मेल तीव्र निश्चय व्यक्त करता है; ‘निश्चय ही’ बल को सुरक्षित रखता है और ‘हिसाब लेगा’ दायित्व माँगे जाने का सहज कानूनी भाव देता है।
- source_word: מֵעִמָּךְ
  choice: तुमसे
  rationale: यह मन्नत पूरी करने वाले व्यक्ति से दायित्व माँगे जाने को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהָיָה בְךָ חֵטְא
  choice: और तुम पाप के दोषी ठहरोगे
  rationale: हिब्रू का शाब्दिक रूप ‘और तुममें पाप होगा’ है; मुख्य पाठ में उसका मुहावरेदार आशय दिया गया है और शाब्दिक संरचना पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है; ‘याहवे’ संभावित उच्चारण को अधिक निकट से दर्शाता है, पर उच्चारण पूर्णतः निश्चित नहीं है।
- issue: וְהָיָה בְךָ חֵטְא में पाप और दोष का संबंध
  choice: तुम पाप के दोषी ठहरोगे
  alternative: तुममें पाप होगा
  rationale: मुख्य पाठ हिन्दी में परिणामस्वरूप दोष को स्पष्ट करता है, जबकि पाद-टिप्पणी मूल की संक्षिप्त और कुछ हद तक असामान्य अभिव्यक्ति को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कानूनी निर्देश का गंभीर किंतु सहज स्वर। ‘मन्नत मानना’ और ‘पूरा करना’ सामान्य पाठक के लिए स्वाभाविक हैं। सर्वनाम एकवचन ‘तुम’ मूल के एकवचन संबोधन को बनाए रखता है।
