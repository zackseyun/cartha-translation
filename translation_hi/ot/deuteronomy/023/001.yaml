base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/001.yaml
  text: A man shall not take his father’s wife[b][a], nor uncover his father’s skirt.
translation:
  language: hi
  text: कोई पुरुष अपने पिता की पत्नी को न ले[a] और अपने पिता के वस्त्र का किनारा न उघाड़े।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पिता की पत्नी से विवाह न करे।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने पिता के वस्त्र का किनारा न उघाड़े।” यह एक यौन शिष्टोक्ति है; अर्थ हो सकता है, “अपने पिता की नग्नता न उघाड़े” या “अपने पिता के विवाह-संबंध का उल्लंघन न करे।”
    reason: alternative_reading
lexical_decisions:
- source_word: יִקַּח
  choice: अपने लिए न ले
  rationale: לָקַח का मूल अर्थ ‘लेना’ है और ‘पत्नी’ के साथ यह विवाह करके पत्नी बनाने का अर्थ दे सकता है। ‘अपने लिए ले’ इस वैवाहिक आशय को सुनने देता है, पर मुख्य पाठ में सीधे ‘विवाह करे’ कहकर अर्थ को आवश्यकता से अधिक सीमित नहीं करता।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: एकवचन पुल्लिंग संज्ञा को विधिक निषेध के स्वाभाविक आधुनिक हिन्दी रूप ‘कोई पुरुष ... न’ में रखा गया है।
- source_word: אֵשֶׁת אָבִיו
  choice: अपने पिता की पत्नी
  rationale: यह इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक अनुवाद है। ‘सौतेली माँ’ कहने से संबंध अनावश्यक रूप से संकुचित हो जाता।
- source_word: יְגַלֶּה
  choice: उघाड़े
  rationale: גלה का मूल भाव ढका हुआ खोलना या उघाड़ना है। ‘उघाड़े’ रूपक और उसके शिष्टोक्तिपूर्ण स्वर को बनाए रखता है।
- source_word: כְּנַף
  choice: वस्त्र का छोर
  rationale: כָּנָף का अर्थ ‘पंख, किनारा, छोर’ होता है और वस्त्र के संदर्भ में उसका किनारा या पल्ला सूचित कर सकता है। ‘वस्त्र का छोर’ आधुनिक हिन्दी में समझने योग्य है और मूल रूपक को बनाए रखता है; ‘नग्नता’ उसके प्रसंगगत आशय को सीधे मुख्य पाठ में डाल देता।
theological_decisions:
- issue: क्या यौन शिष्टोक्ति को मुख्य पाठ में स्पष्ट कर दिया जाए
  choice: ‘अपने पिता के वस्त्र का छोर उघाड़े’ रूपक को मुख्य पाठ में बनाए रखना
  alternative: ‘अपने पिता की नग्नता उघाड़े’ अथवा ‘अपने पिता के विवाह-सम्बन्ध का उल्लंघन करे’
  rationale: मूल पाठ सामान्य ‘नग्नता उघाड़ने’ वाला सूत्र नहीं, बल्कि כְּנַף के साथ एक विशिष्ट शिष्टोक्तिपूर्ण रूपक प्रयोग करता है। रूपक को बनाए रखना वास्तविक भाषिक तनाव की रक्षा करता है; उसका यौन और वैवाहिक आशय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक निषेध के अनुरूप रखी गई है। ‘अपने लिए न ले’ वैवाहिक संकेत को बनाए रखते हुए לָקַח की व्यापकता बचाता है। ‘वस्त्र का छोर’ अत्यधिक अस्पष्ट ‘ओढ़ना’ और आधुनिक हिन्दी में स्त्री-वस्त्र से अधिक जुड़ने वाले ‘आँचल’ से बचते हुए मूल כְּנַף की ठोस छवि प्रस्तुत करता है।
