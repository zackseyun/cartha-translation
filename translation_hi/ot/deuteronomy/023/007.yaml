  text: You shall not seek their peace or their prosperity all your days forever[a].
translation:
  language: hi
  text: तुम अपने जीवन भर उनकी शांति या समृद्धि की खोज कभी मत करना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके कल्याण और उनकी भलाई।” इब्रानी शब्द केवल राजनीतिक शांति या आर्थिक समृद्धि से अधिक व्यापक हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִדְרֹשׁ
  choice: खोज न करना
  rationale: דרש का मूल अर्थ ‘खोजना’ या ‘पूछताछ करना’ है। अमूर्त कर्मों के साथ ‘खोज करना’ यहाँ स्वाभाविक रहते हुए इब्रानी की सक्रिय अभिव्यक्ति को बनाए रखता है।
- source_word: שְׁלֹמָם
  choice: उनके शान्ति-कल्याण
  rationale: שָׁלוֹם केवल राजनीतिक शान्ति नहीं, बल्कि कुशलता और समग्र कल्याण को भी समेटता है। संयुक्त अभिव्यक्ति इस व्यापकता को स्पष्ट करती है और अगले शब्द से भेद बनाए रखती है।
- source_word: טֹבָתָם
  choice: समृद्धि
  rationale: טוֹבָה यहाँ भलाई, लाभ या अच्छी दशा को सूचित करता है। ‘समृद्धि’ दूसरे समुदाय के फलने-फूलने के भाव को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: כָּל יָמֶיךָ
  choice: अपने जीवन भर
  rationale: शाब्दिक ‘अपने सब दिनों’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और पूरे जीवन की अवधि व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: עוֹלָם निषेध की स्थायी अवधि पर बल देता है। ‘सदा’ संक्षिप्त और प्रतिष्ठित हिन्दी है तथा ‘जीवन भर’ के साथ स्रोत की बलाघाती पुनरुक्ति बनाए रखता है।
theological_decisions:
- issue: ‘अपने जीवन भर’ और ‘सदा’ के बीच दिखाई देने वाली पुनरुक्ति
  choice: दोनों काल-सूचक अभिव्यक्तियाँ बनाए रखी गईं
  alternative: केवल ‘जब तक तुम जीवित रहो’ अथवा ‘जीवन भर’ कहना
  rationale: इब्रानी כָּל יָמֶיךָ और לְעוֹלָם को साथ रखकर निषेध की अवधि पर जोर देता है; उसे सरल बनाकर एक ही पद में समेटना स्रोत की बलाघात को घटा देगा।
- issue: שָׁלוֹם की व्यापकता
  choice: ‘शान्ति-कल्याण’
  alternative: केवल ‘शान्ति’ या केवल ‘कल्याण’
  rationale: यह शब्द बाहरी शान्ति के साथ कुशलता और समग्र भलाई भी व्यक्त कर सकता है। संयुक्त हिन्दी पद इस अर्थ-तनाव को किसी एक संकुचित अर्थ में नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन संबोधन ‘तुम’ रखा गया है। शैली निर्देशात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘शान्ति-कल्याण’ शालोम की व्यापकता बचाता है, जबकि ‘समृद्धि’ समानार्थक दोहराव से बचाती है।
