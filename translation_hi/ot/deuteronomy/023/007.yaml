- from: तुम अपने जीवन भर सदा उनके शान्ति-कल्याण और समृद्धि की खोज न करना।[a]
  to: तुम अपने जीवन भर उनकी शांति या समृद्धि की खोज कभी मत करना।[a]
  rationale: The revised text replaces the unnatural, interpretively expanded compound “शान्ति-कल्याण” with “शांति,” preserving the Hebrew noun as a distinct counterpart to “समृद्धि.” “कभी” together with “अपने जीवन भर” naturally conveys the emphatic ongoing prohibition expressed by “all your days forever,” without the unnatural Hindi stacking “जीवन भर सदा.” The lexical alternative is retained in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:54:22Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the prohibition, the paired objects, and the emphatic enduring duration. However, “शान्ति-कल्याण” adds a combined explanatory sense where the Hebrew has the distinct noun שְׁלוֹם; the supplied footnote is the appropriate place to indicate its broader semantic range. The revised wording keeps the two objects distinct and renders both duration expressions through an idiomatic emphatic Hindi construction.
  naturalness: '“उनके शान्ति-कल्याण” is not idiomatic Hindi: the possessive agreement is faulty with the feminine noun phrase, and the hyphenated compound sounds manufactured. “तुम ... की खोज न करना” is also less natural than the standard prohibitive “मत करना.” The revision is clear, modern, and retains the formal biblical register.'
  terminology: Use “शांति” for שְׁלוֹם and “समृद्धि” for טוֹבָה in the main text. “शांति” remains appropriately broad in Hindi, while the footnote preserves the possible senses “कल्याण” and “भलाई” without conflating them in the verse itself.
  issues:
  - severity: medium
    issue: The expression “उनके शान्ति-कल्याण” is grammatically and idiomatically defective.
    rationale: With a feminine object phrase, the possessive should be “उनकी”; more importantly, “शान्ति-कल्याण” fuses a Hebrew word with its possible semantic extension and obscures the source’s distinct pairing of שְׁלוֹם and טוֹבָה.
  - severity: low
    issue: The prohibitive construction “खोज न करना” is stiff in modern Hindi.
    rationale: “खोज मत करना” is the natural modern negative imperative and retains the force of the Hebrew prohibition.
  - severity: low
    issue: The temporal phrase order is awkward.
    rationale: Placing “अपने जीवन भर, सदा” after “तुम” disrupts the sentence. The revision places the durative emphasis naturally while retaining its cumulative force.
