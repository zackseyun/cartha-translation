base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/021.yaml
  text: You may charge interest to a foreigner[a], but to your brother you shall not charge interest[b], so that Yahweh your God may bless you in all the work of your hand in the land that you are entering to possess.
translation:
  language: hi
  text: तुम परदेशी से ब्याज वसूल सकते हो[a], पर अपने भाई से ब्याज नहीं वसूलोगे[b], ताकि तुम्हारा परमेश्वर याहवे उस देश में, जिसे अपने अधिकार में लेने के लिए तुम प्रवेश कर रहे हो, तुम्हारे हाथ के हर काम में तुम्हें आशीष दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘परदेशी को ब्याज पर उधार दे सकते हो’ अथवा ‘परदेशी से ब्याज लगा सकते हो।’
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘भाई’ का अर्थ इस्राएली समुदाय का साथी सदस्य है; हिब्रू में पारिवारिक शब्द ही प्रयुक्त हुआ है।
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּכְרִי
  choice: परदेशी से
  rationale: נָכְרִי उस विदेशी या बाहरी व्यक्ति को दर्शाता है जो इस्राएली समुदाय का सदस्य नहीं है। ‘परदेशी’ आधुनिक हिन्दी में स्पष्ट है और ‘अपने भाई’ के साथ मूल सामाजिक-विधिक विरोध बनाए रखता है।
- source_word: תַשִּׁיךְ / לֹא תַשִּׁיךְ
  choice: ब्याज ले सकते हो / ब्याज न लेना
  rationale: इस ऋण-विधि में נשׁך का हिफ़ील रूप ऋण पर ब्याज लगाने या वसूलने को दर्शाता है। ‘ब्याज लेना’ सहज हिन्दी है और ‘सूदखोरी’ जैसे नैतिक रूप से अधिक आरोपित शब्द से बचता है।
- source_word: אָחִיךָ
  choice: अपने भाई
  rationale: मूल में शाब्दिक पारिवारिक पद ‘तुम्हारा भाई’ है। वाचा-विधि के इस संदर्भ में इसका आशय साथी इस्राएली से है; मुख्य पाठ में मूल रूपक रखा गया है और टिप्पणी में उसका सामाजिक अर्थ स्पष्ट किया गया है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम प्रस्तुत करता है; ‘ताकि’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर यहोवा ... तुम्हें आशीष दे
  rationale: उद्देश्य-वाक्य में क्रिया का भाव ‘आशीष दे’ से सुरक्षित रहता है। יְהוָה को व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: तुम्हारे हाथ के हर काम में
  rationale: यह वाक्यांश व्यक्ति के सभी कामों या उपक्रमों का मुहावरा है। हिन्दी रूप मूल की ‘हाथ’ वाली छवि को बनाए रखते हुए समझने योग्य है।
- source_word: עַל הָאָרֶץ
  choice: उस देश में
  rationale: यहाँ עַל का स्थानगत अर्थ हिन्दी में स्वाभाविक रूप से ‘देश में’ व्यक्त होता है। निश्चित पद के कारण ‘उस देश’ आगामी प्रतिज्ञात भूभाग की ओर संकेत करता है।
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: जिस पर अधिकार करने के लिए तुम प्रवेश कर रहे हो
  rationale: בוא आगामी प्रवेश और ירשׁ अधिकार/कब्ज़ा प्राप्त करने को व्यक्त करता है। यह अनुवाद उद्देश्य को स्पष्ट रखता है और अनावश्यक रूप से ‘विरासत’ का अर्थ नहीं थोपता।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम सीधे उपस्थित है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को ‘प्रभु’ उपाधि से बदलने के बजाय सुरक्षित रखता है।
- issue: ‘भाई’ की वाचाई-सामुदायिक सीमा
  choice: मुख्य पाठ में ‘अपने भाई’, टिप्पणी में ‘साथी इस्राएली’
  alternative: मुख्य पाठ में ही ‘साथी इस्राएली’
  rationale: मूल का पारिवारिक और वाचाई रूपक बचाना आवश्यक है, पर आधुनिक पाठक को यह भी बताना चाहिए कि इस विधिक संदर्भ में संकेत इस्राएली समुदाय के साथी सदस्य की ओर है।
- issue: परदेशी से ब्याज लेने की क्रिया का स्वर
  choice: अनुमति के रूप में ‘ले सकते हो’
  alternative: आदेश-सदृश ‘ब्याज लेना’
  rationale: हिब्रू अपूर्ण क्रिया विधिक अनुमति या मान्य व्यवहार व्यक्त कर सकती है। संदर्भगत विरोध के अनुसार इसे बाध्यकारी आदेश न बनाकर अनुमति के रूप में रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक वाक्य का स्पष्ट निषेध–अनुमति विरोध बनाए रखा गया है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘तुम’ से हिब्रू के एकवचन संबोधन को सुरक्षित रखा गया है।
