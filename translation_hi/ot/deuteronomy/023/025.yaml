  text: כִּ֤י תָבֹא֙ בְּ/כֶ֣רֶם רֵעֶ֔/ךָ וְ/אָכַלְתָּ֧ עֲנָבִ֛ים כְּ/נַפְשְׁ/ךָ֖ שָׂבְעֶ֑/ךָ וְ/אֶֽל כֶּלְיְ/ךָ֖ לֹ֥א תִתֵּֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/025.yaml
  text: When you enter your neighbor’s vineyard[a], you may eat grapes as your appetite desires, until you are satisfied[c][b], but you shall not put any into your container.
translation:
  language: hi
  text: जब तुम अपने पड़ोसी की दाखबारी में जाओ,[a] तो जी भरकर अंगूर खा सकते हो;[b] पर अपने किसी पात्र में अंगूर न रखना।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यदि तुम अपने पड़ोसी की दाखबारी में जाओ।” इब्रानी शब्द समय अथवा शर्त—दोनों प्रकार का उपवाक्य आरम्भ कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “अपनी इच्छा के अनुसार, अपनी तृप्ति तक”; अर्थात अपनी भूख या इच्छा के अनुसार तृप्त होने तक।
    reason: lexical_alternative
  - marker: c
    text: “पात्र” के लिए प्रयुक्त इब्रानी शब्द व्यापक है; इससे पात्र या बर्तन का कोई विशेष प्रकार निश्चित नहीं होता।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: जब तुम…जाओ
  rationale: כִּי यहाँ कारण नहीं, बल्कि परिस्थिति बताने वाला उपवाक्य आरम्भ करता है; व्यवस्थापरक संदर्भ में ‘जब’ स्वाभाविक है, जबकि ‘यदि’ भी सम्भव है। בוא के साथ स्थानवाचक ב दाखबारी में प्रवेश करने का भाव देता है; सहज हिन्दी में ‘दाखबारी में जाओ’ उपयुक्त है।
- source_word: בְּכֶרֶם רֵעֶךָ
  choice: अपने पड़ोसी की दाखबारी में
  rationale: כֶּרֶם अंगूर की बारी को और רֵעַ यहाँ पड़ोसी अथवा साथी मनुष्य को सूचित करता है। ‘दाखबारी’ संक्षिप्त, प्रतिष्ठित और अर्थविशिष्ट हिन्दी शब्द है।
- source_word: וְאָכַלְתָּ עֲנָבִים
  choice: तो…अंगूर खा सकते हो
  rationale: इस कानूनी प्रसंग में क्रिया अनुमति व्यक्त करती है, इसलिए ‘खा सकते हो’ केवल भविष्यवाणी या आज्ञा की अपेक्षा अभिप्रेत अधिकार को अधिक स्पष्ट करता है।
- source_word: כְּנַפְשְׁךָ שָׂבְעֶךָ
  choice: जी भरकर
  rationale: शाब्दिक संरचना ‘अपनी इच्छा/भूख के अनुसार, अपनी तृप्ति तक’ है। हिन्दी मुहावरा ‘जी भरकर’ इच्छा और तृप्ति तक खाने—दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאֶל כֶּלְיְךָ לֹא תִתֵּן
  choice: पर अपने किसी पात्र में अंगूर न रखना
  rationale: כְּלִי व्यापक शब्द है, जिसका अर्थ पात्र, बर्तन या सामान हो सकता है; ‘पात्र’ उसकी अनिर्दिष्टता बनाए रखता है। נתן यहाँ ‘रखना/डालना’ है, और पूर्ववर्ती ‘अंगूर’ को हिन्दी में स्पष्टतः दोहराया गया है।
