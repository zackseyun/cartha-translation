translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जी भरकर’ मूल इब्रानी मुहावरे को सामान्य हिन्दी में संक्षेप से व्यक्त करता है। ‘दाखबारी’ और ‘पात्र’ मूल की अर्थविशिष्टता तथा व्यापकता को बनाए रखते हैं।
