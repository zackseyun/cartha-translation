source:
  edition: WLC
  text: לֹֽא יָבֹ֧א עַמּוֹנִ֛י וּ/מוֹאָבִ֖י בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָבֹ֥א לָ/הֶ֛ם בִּ/קְהַ֥ל יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/004.yaml
  text: No Ammonite or Moabite may enter the assembly of Yahweh[a]; even to the tenth generation[b], none of them may enter the assembly of Yahweh forever.
translation:
  language: hi
  text: कोई अम्मोनी या मोआबी यहोवा की सभा[a] में प्रवेश न पाए; दसवीं पीढ़ी तक भी[b] उनमें से कोई यहोवा की सभा में सदा तक प्रवेश न पाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा की मंडली।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में “दसवीं पीढ़ी तक” और “सदा तक”—दोनों अभिव्यक्तियाँ हैं; इसलिए अनुवाद स्थायी निषेध के बल को बनाए रखते हुए किसी एक को दूसरी में नहीं समेटता।
    reason: cultural_note
lexical_decisions:
- source_word: יָבֹא
  choice: प्रवेश न पाए
  rationale: לֹא के साथ अपूर्ण क्रिया कानूनी निषेध या अपात्रता व्यक्त करती है। ‘प्रवेश न पाए’ आधुनिक हिन्दी में अनुमति न होने का भाव स्वाभाविक रूप से देता है।
- source_word: עַמּוֹנִי וּמוֹאָבִי
  choice: अम्मोनी या मोआबी
  rationale: ये जातिवाचक शब्द हैं; हिन्दी बाइबलीय प्रयोग में ‘अम्मोनी’ और ‘मोआबी’ स्पष्ट तथा प्रचलित रूप हैं। संयोजक וּ को इस निषेध के वितरणात्मक अर्थ के अनुसार ‘या’ से व्यक्त किया गया है।
- source_word: קְהַל יְהוָה
  choice: यहोवा की सभा
  rationale: קָהָל यहाँ औपचारिक रूप से एकत्र वाचा-समुदाय को सूचित करता है; ‘सभा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है। יְהוָה को व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: दसवीं पीढ़ी तक भी
  rationale: यह वाक्यांश निषेध की अवधि पर बल देता है। यह रूप मूल के ‘भी’ और पीढ़ी-संबंधी अभिव्यक्ति दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: לָהֶם
  choice: उनमें से कोई
  rationale: सर्वनाम उन जातियों से संबंधित व्यक्ति या वंशज की ओर संकेत करता है। दोहराए गए יָבֹא के निहित कर्ता के साथ ‘उनमें से कोई’ हिन्दी में अर्थ स्पष्ट करता है, बिना संबंध की सीमा को अनावश्यक रूप से तय किए।
- source_word: עַד עוֹלָם
  choice: सदा तक
  rationale: यह दीर्घस्थायी निषेध व्यक्त करता है। ‘सदा तक’ मूल की कालगत अभिव्यक्ति को बनाए रखता है और दसवीं पीढ़ी वाले वाक्यांश के साथ मौजूद तनाव को नहीं मिटाता।
theological_decisions:
- issue: ‘दसवीं पीढ़ी तक’ और ‘सदा तक’ का संबंध
  choice: दोनों कालगत अभिव्यक्तियों को मुख्य पाठ में बनाए रखा गया है।
  alternative: ‘दसवीं पीढ़ी’ को केवल ‘कभी नहीं’ का मुहावरा मानना, या ‘सदा तक’ को गौण करके एक ही अवधि में समेट देना।
  rationale: इब्रानी पाठ दोनों अभिव्यक्तियाँ देता है। अनुवाद उनके बीच के संभावित तनाव को व्याख्या द्वारा समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में कानूनी और गरिमापूर्ण शैली रखी गई है। वाक्य को सामान्य पाठक के लिए सहज बनाया गया है, पर मूल की पुनरावृत्ति और दोनों कालगत अभिव्यक्तियाँ सुरक्षित हैं।
