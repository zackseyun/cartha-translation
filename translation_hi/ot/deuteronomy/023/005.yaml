language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַל דְּבַ֞ר אֲשֶׁ֨ר לֹא קִדְּמ֤וּ אֶתְ/כֶם֙ בַּ/לֶּ֣חֶם וּ/בַ/מַּ֔יִם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁר֩ שָׂכַ֨ר עָלֶ֜י/ךָ אֶת בִּלְעָ֣ם בֶּן בְּע֗וֹר מִ/פְּת֛וֹר אֲרַ֥ם נַהֲרַ֖יִם לְ/קַֽלְלֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/005.yaml
  text: because they did not meet you with bread and water on the way when you came out from Egypt[a], and because he hired Balaam son of Beor from Pethor of Aram-naharaim against you to curse you.
translation:
  language: hi
  text: क्योंकि जब तुम मिस्र से निकले, तब मार्ग में वे रोटी और पानी लेकर तुमसे मिलने नहीं आए; और क्योंकि उसने तुम्हें शाप देने के लिए अराम-नहरैम[a] के पतोर से बओर के पुत्र बिलाम को तुम्हारे विरुद्ध भाड़े पर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अराम-नहरैम की पारंपरिक पहचान मेसोपोटामिया से की जाती है; इस नाम का शाब्दिक अर्थ ‘दो नदियों का अराम’ है।
    reason: cultural_note
lexical_decisions:
- source_word: עַל דְּבַר
  choice: क्योंकि
  rationale: यह पद पिछले निषेध का कारण बताता है; ‘क्योंकि’ हिन्दी में इसके कारणवाचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: קִדְּמוּ אֶתְכֶם
  choice: वे ... तुमसे मिलने नहीं आए
  rationale: यहाँ क्रिया का अर्थ आगे बढ़कर मिलने या आवश्यक सामग्री के साथ अगवानी करने से है। ‘स्वागत नहीं किया’ मूल से कुछ अधिक व्याख्यात्मक होता।
- source_word: בַּלֶּחֶם וּבַמַּיִם
  choice: रोटी और पानी लेकर
  rationale: मूल के ठोस शब्द ‘रोटी’ और ‘पानी’ सुरक्षित रखे गए हैं; ‘लेकर’ हिन्दी में मिलने आने के प्रसंग को सहज बनाता है।
- source_word: בַּדֶּרֶךְ
  choice: मार्ग में
  rationale: स्थानवाचक पदबंध का संक्षिप्त, प्रतिष्ठित और स्वाभाविक हिन्दी रूप।
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: जब तुम मिस्र से निकले
  rationale: पूर्वसर्गयुक्त infinitive construct यहाँ समय बताता है; यह रूप निर्गमन के संकेत को स्पष्ट रखता है।
- source_word: וַאֲשֶׁר
  choice: और क्योंकि
  rationale: यह पहले कारण के समानांतर दूसरा कारण प्रस्तुत करता है।
- source_word: שָׂכַר עָלֶיךָ
  choice: तुम्हारे विरुद्ध भाड़े पर लिया
  rationale: שׂכר का अर्थ भाड़े पर लेना है और עַל यहाँ विरोधी दिशा व्यक्त करता है। एकवचन कर्ता ‘उसने’ मूल के व्याकरणिक बदलाव को सुरक्षित रखता है।
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: बओर के पुत्र बिलाम
  rationale: व्यक्तिनामों का हिन्दी लिप्यंतरण किया गया है और पितृनाम-संबंध स्पष्ट रखा गया है।
- source_word: מִפְּתֹר אֲרַם נַהֲרַיִם
  choice: अराम-नहरैम के पतोर से
  rationale: दोनों स्थाननामों को लिप्यंतरित करने से मूल क्षेत्रीय नाम सुरक्षित रहता है; ‘मेसोपोटामिया’ जैसी पारंपरिक पहचान को मुख्य पाठ में नहीं मिलाया गया।
- source_word: לְקַלְלֶךָּ
  choice: तुम्हें शाप देने के लिए
  rationale: उद्देश्यवाचक infinitive का सीधा और स्वाभाविक हिन्दी अनुवाद।
theological_decisions:
- issue: बहुवचन कर्ता से एकवचन कर्ता की ओर बदलाव
  choice: ‘वे ... नहीं आए’ और फिर ‘उसने ... भाड़े पर लिया’
  alternative: दोनों खंडों में बहुवचन ‘उन्होंने’
  rationale: इब्रानी पाठ पहले बहुवचन קִדְּמוּ और फिर एकवचन שָׂכַר प्रयोग करता है। संभावित सामूहिक/प्रतिनिधिक संदर्भ की अस्पष्टता को समान बनाकर मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वाक्य पिछले पद से जुड़े कारणवाचक खंड के रूप में आरम्भ होता है। ‘रोटी और पानी’ की ठोस अभिव्यक्ति तथा मूल का बहुवचन से एकवचन की ओर व्याकरणिक बदलाव सुरक्षित रखा गया है।
