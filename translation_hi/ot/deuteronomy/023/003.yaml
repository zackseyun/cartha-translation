  text: לֹא יָבֹ֥א מַמְזֵ֖ר בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָ֥בֹא ל֖/וֹ בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/003.yaml
  text: No one of illegitimate birth may enter the assembly of Yahweh; even to the tenth generation[a], none of his descendants may enter the assembly of Yahweh.
translation:
  language: hi
  text: अवैध जन्म का कोई व्यक्ति[a] यहोवा की सभा में प्रवेश न करे; उसकी संतति दसवीं पीढ़ी तक भी यहोवा की सभा में प्रवेश न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द מַמְזֵר का सटीक आशय निश्चित नहीं है। इसका अर्थ निषिद्ध संबंध से उत्पन्न या किसी अन्य कारण से जन्म-स्थिति के आधार पर समुदाय से बहिष्कृत व्यक्ति हो सकता है। पारंपरिक अनुवादों में इसके लिए अधिक अपमानजनक शब्द भी प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְזֵר
  choice: अवैध जन्म का व्यक्ति
  rationale: यह शब्द अस्पष्ट जन्म-स्थिति या निषिद्ध संबंध से उत्पन्न व्यक्ति की सामाजिक-कानूनी श्रेणी दर्शाता है। यह अनुवाद अपमानजनक आधुनिक शब्दावली से बचते हुए मूल श्रेणी को व्यक्त करता है; इसकी सटीक सीमा पर अनिश्चितता फुटनोट में सुरक्षित रखी गई है।
- source_word: יָבֹא
  choice: प्रवेश न करे
  rationale: क्रिया का मूल अर्थ ‘आना/प्रवेश करना’ है। कानूनी निषेध में ‘प्रवेश न करे’ स्वाभाविक और मूल के निकट है।
- source_word: קְהַל יְהוָה
  choice: यहोवा की सभा
  rationale: קהל के लिए ‘सभा’ एकत्रित वाचा-समुदाय का व्यापक अर्थ बनाए रखता है; יְהוָה को परियोजना की रीति के अनुसार ‘यहोवा’ कहा गया है।
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: दसवीं पीढ़ी तक ... भी
  rationale: यह पदबंध निषेध की पीढ़ीगत सीमा या व्यापकता बताता है। ‘तक’ और ‘भी’ मिलकर हिब्रू के बल को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: לֹא יָבֹא לוֹ
  choice: उसका कोई वंशज ... प्रवेश न करे
  rationale: לוֹ का शाब्दिक अर्थ ‘उसके लिए/उससे संबंधित’ है। पीढ़ी के उल्लेख के संदर्भ में वंश-परंपरा अभिप्रेत है; ‘कोई वंशज’ हिन्दी में इसे स्पष्ट करता है, जबकि मूल का निषेध बना रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय वाचा-नाम सीधे प्रयुक्त है। हिन्दी में परिचित नामरूप ‘यहोवा’ उसे सामान्य उपाधि ‘प्रभु’ से अलग रखते हुए व्यक्त करता है।
- issue: קְהַל יְהוָה की प्रकृति
  choice: यहोवा की सभा
  alternative: यहोवा की मंडली
  rationale: ‘सभा’ मूल शब्द की सामुदायिक और संभवतः सार्वजनिक-कानूनी व्यापकता को बिना यह तय किए बनाए रखती है कि निषेध धार्मिक उपासना, नागरिक सहभागिता, या दोनों में से किस पर लागू है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कानूनी शैली रखी गई है। ‘अवैध जन्म’ आज कुछ संदर्भों में कठोर लग सकता है, इसलिए फुटनोट मूल शब्द की अनिश्चितता स्पष्ट करता है और व्यक्ति पर अनावश्यक कलंक लगाने से बचता है।
