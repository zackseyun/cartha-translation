base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/024.yaml
  text: You shall keep what has gone out from your lips and do it[a], according to what you vowed to Yahweh your God as a freewill offering[b], which you spoke with your mouth.
translation:
  language: hi
  text: तुम्हारे होंठों से जो निकला है[a], उसका पालन करो और उसे पूरा करो—ठीक वैसा ही जैसा तुमने अपने परमेश्वर याहवे के नाम स्वेच्छा-भेंट की मन्नत मानी थी, जिसे तुमने अपने मुँह से कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे होंठों का उच्चारण” अथवा “तुम्हारे होंठों से निकलने वाली बात।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא שְׂפָתֶיךָ
  choice: तुम्हारे होंठों से जो निकला है
  rationale: यह अनुवाद מוֹצָא की ‘निकलने/बाहर आने वाली बात’ की ठोस इब्रानी छवि को बनाए रखता है और प्रसंग में मुँह से कही गई मन्नत की ओर संकेत करता है।
- source_word: תִּשְׁמֹר וְעָשִׂיתָ
  choice: उसका पालन करना और उसे पूरा करना
  rationale: שׁמר यहाँ कही हुई प्रतिज्ञा के प्रति निष्ठावान रहने और עשׂה उसे कार्यरूप देने का आदेश देता है। हिंदी में ‘पालन करना’ और ‘पूरा करना’ इस भेद को स्वाभाविक ढंग से व्यक्त करते हैं।
- source_word: כַּאֲשֶׁר נָדַרְתָּ
  choice: ठीक वैसा ही जैसा तुमने ... मन्नत मानी थी
  rationale: यह वाक्यांश इस बात पर बल देता है कि व्यक्ति अपनी मन्नत को उसी के कहे हुए स्वरूप के अनुसार पूरा करे। ‘मन्नत मानना’ आधुनिक हिंदी में נדר का सहज और सटीक धार्मिक प्रयोग है।
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर याहवे के लिए
  rationale: יהוה को उसके व्यक्तिवाचक वाचा-नाम के रूप में ‘याहवे’ लिखा गया है; לְ को इस प्रसंग में ‘के लिए’ से स्वाभाविक रूप दिया गया है।
- source_word: נְדָבָה
  choice: स्वेच्छा-भेंट
  rationale: यह शब्द ऐसी भेंट को दर्शाता है जो स्वेच्छा से दी जाती है। ‘स्वेच्छा-भेंट’ संक्षिप्त है और भेंट के धार्मिक संदर्भ को बनाए रखता है।
- source_word: אֲשֶׁר דִּבַּרְתָּ בְּפִיךָ
  choice: जिसे तुमने अपने मुँह से कहा था
  rationale: मूल पाठ मन्नत के मौखिक रूप पर दोबारा बल देता है। ‘अपने मुँह से’ को बनाए रखने से यह जानबूझकर की गई पुनरुक्ति लुप्त नहीं होती।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिवाचक नाम יהוה सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय वाचा-नाम के रूप में प्रस्तुत करता है।
- issue: נְדָבָה का मन्नत से संबंध
  choice: स्वेच्छा-भेंट के रूप में मन्नत
  alternative: स्वेच्छा से मानी गई मन्नत
  rationale: נְדָבָה संज्ञा के रूप में स्वेच्छा-भेंट को सूचित कर सकता है, जबकि वाक्य में स्वैच्छिक भाव भी संभव है। मुख्य पाठ में भेंट-संबंधी अर्थ रखा गया है और पादटिप्पणी में वैकल्पिक अर्थ बताया गया है, जिससे मूल की संभावित अर्थ-व्याप्ति बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘होंठों से जो निकला’ और ‘अपने मुँह से’ जैसी ठोस इब्रानी अभिव्यक्तियों को जानबूझकर बनाए रखा गया है; साथ ही आदेशात्मक रूप को हिंदी में स्वाभाविक विधिसूचक infinitive संरचना से व्यक्त किया गया है।
