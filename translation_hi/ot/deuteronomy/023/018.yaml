id: DEU.23.18
reference: Deuteronomy 23:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹא תִהְיֶ֥ה קְדֵשָׁ֖ה מִ/בְּנ֣וֹת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה קָדֵ֖שׁ מִ/בְּנֵ֥י יִשְׂרָאֵל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/018.yaml
  text: There shall not be a cult prostitute from the daughters of Israel[a], and there shall not be a cult prostitute from the sons of Israel.
translation:
  language: hi
  text: इस्राएल की बेटियों में से कोई भी पूजा-संबंधी वेश्यावृत्ति करने वाली स्त्री न हो[a], और इस्राएल के बेटों में से कोई भी पूजा-संबंधी वेश्यावृत्ति करने वाला पुरुष न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन इब्रानी शब्दों का अधिक शाब्दिक अर्थ ‘समर्पित स्त्री’ और ‘समर्पित पुरुष’ है। यहाँ इन्हें परंपरागत रूप से मूर्तिपूजक धार्मिक अनुष्ठानों से जुड़ी यौन सेवा के लिए प्रयुक्त तकनीकी शब्द माना जाता है; इसलिए अनुवाद में ‘पूजा-संबंधी वेश्यावृत्ति’ कहा गया है। ‘मंदिर की वेश्यावृत्ति’ भी संभव अनुवाद है, पर मूल पाठ किसी विशेष स्थान को स्पष्ट नहीं करता।
    reason: शाब्दिक विकल्प और तकनीकी धार्मिक अर्थ की व्याख्या
lexical_decisions:
- source_word: קְדֵשָׁה
  choice: पूजा-संबंधी वेश्यावृत्ति करने वाली स्त्री
  rationale: यह स्त्रीलिंग तकनीकी संज्ञा है। संदर्भ में इसे मूर्तिपूजक धार्मिक अनुष्ठानों से जुड़ी अवैध यौन सेवा के अर्थ में समझना उचित है। ‘देवदासी’ भारतीय धार्मिक-सांस्कृतिक संस्था का अनचाहा संकेत देता, और ‘मंदिर की वेश्या’ स्थान को आवश्यकता से अधिक निश्चित कर देता।
- source_word: קָדֵשׁ
  choice: पूजा-संबंधी वेश्यावृत्ति करने वाला पुरुष
  rationale: यह קְדֵשָׁה का पुल्लिंग समानांतर है। वर्णनात्मक हिंदी अनुवाद धार्मिक और यौन—दोनों पहलुओं को स्पष्ट रखते हुए स्त्री-पुरुष की समानांतर रचना बचाता है।
- source_word: לֹא תִהְיֶה / וְלֹא יִהְיֶה
  choice: कोई भी ... न हो / कोई भी ... न हो
  rationale: यह कानूनी निषेध को स्वाभाविक, गरिमापूर्ण आधुनिक हिंदी में व्यक्त करता है और दोनों उपवाक्यों की समानांतर बनावट बनाए रखता है।
- source_word: מִבְּנוֹת יִשְׂרָאֵל / מִבְּנֵי יִשְׂרָאֵל
  choice: इस्राएल की बेटियों में से / इस्राएल के बेटों में से
  rationale: ‘में से’ इब्रानी מִן को स्वाभाविक हिंदी में व्यक्त करता है तथा ‘बेटियों/बेटों’ की जानबूझकर रखी गई पारिवारिक-राष्ट्रीय समरूपता को सुरक्षित रखता है।
theological_decisions:
- issue: קְדֵשָׁה और קָדֵשׁ का आशय
  choice: मूर्तिपूजक धार्मिक अनुष्ठानों से जुड़ी स्त्री और पुरुष की वेश्यावृत्ति
  alternative: पूजा के लिए समर्पित स्त्री और पुरुष; अथवा सामान्यतः यौन अनैतिकता करने वाले व्यक्ति
  rationale: इन शब्दों की जड़ का संबंध ‘पवित्र/अलग ठहराए जाने’ से है, पर इस निषेधात्मक संदर्भ में परंपरागत और शब्दकोशीय समझ इन्हें अवैध पंथीय यौन सेवा से जोड़ती है। मुख्य पाठ उस संदर्भगत अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक अर्थ और व्याख्यात्मक तनाव को छिपाती नहीं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और कानूनी निषेध के अनुरूप गरिमापूर्ण रखी गई है। भारतीय संदर्भ में विशिष्ट और संभावित रूप से भ्रामक शब्द ‘देवदासी’ से बचा गया है। वर्णनात्मक पद कुछ लंबा है, पर स्त्री और पुरुष दोनों के समानांतर निषेध तथा धार्मिक संदर्भ को बिना सांप्रदायिक अर्थ आरोपित किए स्पष्ट करता है।
