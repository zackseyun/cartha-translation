  naturalness: The Hindi is clear, modern, and suitably formal for legal material. The descriptive expressions are somewhat long, but this is a justified tradeoff for clarity and for avoiding culturally misleading labels such as “देवदासी.” The parallel clauses read naturally.
  terminology: “पूजा-संबंधी वेश्यावृत्ति करने वाली स्त्री/…वाला पुरुष” communicates both the cultic and sexual dimensions and maintains the masculine/feminine parallel. The footnote responsibly identifies the more literal lexical sense and notes that “मंदिर” would over-specify the setting.
