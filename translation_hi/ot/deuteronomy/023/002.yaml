source:
  edition: WLC
  text: לֹֽא יָבֹ֧א פְצֽוּעַ דַּכָּ֛א וּ/כְר֥וּת שָׁפְכָ֖ה בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/002.yaml
  text: No man with crushed testicles or a severed penis may enter the assembly of Yahweh[a][b].
translation:
  language: hi
  text: जिस पुरुष के अंडकोष कुचले गए हों या जिसका लिंग काट दिया गया हो, वह यहोवा की सभा में प्रवेश न करे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दानुरूप: “जिसके अंडकोष कुचलकर घायल किए गए हों या जिसका पुरुष-अंग काट दिया गया हो, वह यहोवा की सभा में प्रवेश न करे।”'
    reason: lexical_alternative
  - marker: b
    text: “यहोवा की सभा” से आशय इस्राएल के वाचा-समुदाय में औपचारिक सहभागिता हो सकता है; इस निषेध का सटीक दायरा विवादित है।
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹא
  choice: प्रवेश न करे
  rationale: בוא का मूल अर्थ ‘आना/प्रवेश करना’ है। निषेधात्मक कानूनी संदर्भ में ‘प्रवेश न करे’ स्वाभाविक और स्पष्ट है।
- source_word: פְצוּעַ דַּכָּא
  choice: जिस पुरुष के अंडकोष कुचले गए हों
  rationale: यह पदबंध कुचलने से पुरुष के यौनांग, विशेषतः अंडकोष, को हुई क्षति बताता है; इसलिए अस्पष्ट शिष्टोक्ति के बजाय शारीरिक रूप से स्पष्ट शब्द चुना गया है।
- source_word: וּכְרוּת שָׁפְכָה
  choice: या जिसका लिंग काट दिया गया हो
  rationale: यह पदबंध पुरुष-जननांग के काट दिए जाने को दर्शाता है। ‘लिंग’ आधुनिक हिन्दी में सीधा और शारीरिक रूप से सटीक है; ‘या’ दोनों स्थितियों को अलग विकल्पों के रूप में रखता है।
- source_word: בִּקְהַל
  choice: सभा में
  rationale: קהל एकत्र समुदाय या सभा को सूचित करता है। ‘सभा’ वाचा-संबंधी कानूनी संदर्भ में पारदर्शी है और अर्थ का दायरा अनावश्यक रूप से सीमित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिवाचक दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לֹא
  choice: न करे
  rationale: हिब्रू निषेध को हिन्दी कानूनी शैली में स्पष्ट आज्ञार्थक निषेध के रूप में व्यक्त किया गया है।
- source_word: implicit male referent of the participial phrases
  choice: पुरुष
  rationale: दोनों अवस्थाएँ विशेष रूप से पुरुष-जननांग की चोट से संबंधित हैं, इसलिए ‘पुरुष’ संदर्भ के लिंग को सटीक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘यहोवा की सभा’ से बहिष्कार का स्वरूप
  choice: वाक्यांश को सीधे ‘यहोवा की सभा’ के रूप में रखा गया और उसके सटीक सामाजिक, उपासना-संबंधी या कानूनी दायरे को मुख्य पाठ में निर्धारित नहीं किया गया।
  alternative: इसे केवल औपचारिक उपासना, नागरिक सदस्यता अथवा विवाह-योग्यता से संबंधित निषेध मानना।
  rationale: स्वयं हिब्रू पद इस सभा की सदस्यता और निषेध के पूरे व्यावहारिक या धर्मवैज्ञानिक दायरे को परिभाषित नहीं करता; अतः अनिश्चितता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु स्पष्ट कानूनी शैली अपनाई गई है। शारीरिक अवस्थाओं के लिए अस्पष्ट या पुरातन शिष्टोक्तियों के बजाय सामान्यतः समझ में आने वाले सटीक शब्द रखे गए हैं।
