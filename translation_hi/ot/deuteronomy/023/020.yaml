base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/020.yaml
  text: You shall not charge your brother interest on money[a], interest on food[c][b], or interest on anything that is lent at interest.
translation:
  language: hi
  text: तुम अपने भाई से धन पर ब्याज, भोजन पर ब्याज, या किसी भी ऐसी वस्तु पर ब्याज मत लेना जिस पर ब्याज लिया जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַשִּׁיךְ
  choice: ब्याज लेना
  rationale: हिफ़ील रूप यहाँ ऋण देने वाले द्वारा ब्याज लगाने या वसूलने का अर्थ देता है। आधुनिक हिन्दी में ‘ब्याज लेना’ स्वाभाविक और स्पष्ट है।
- source_word: לְאָחִיךָ
  choice: अपने भाई से
  rationale: मूल शब्द का शाब्दिक अर्थ ‘अपने भाई’ है और यहाँ वाचा-समुदाय के सह-सदस्य का पारिवारिक भाव रखता है; इसे अधिक व्याख्यात्मक ‘संगी इस्राएली’ में नहीं बदला गया।
- source_word: נֶשֶׁךְ
  choice: ब्याज
  rationale: यह ऋण पर लिए जाने वाले ब्याज का सामान्य शब्द है; ‘सूद’ कुछ पाठकों के लिए अनुचित या अत्यधिक ब्याज का संकुचित अर्थ दे सकता है।
- source_word: כֶּסֶף
  choice: रुपये
  rationale: शाब्दिक अर्थ ‘चाँदी’ है, पर कानूनी-आर्थिक संदर्भ में इसका आशय धन से है। ‘रुपये’ सामान्य हिन्दी में ऋणस्वरूप धन को सहज रूप से व्यक्त करता है।
- source_word: אֹכֶל
  choice: भोजन
  rationale: यह व्यापक रूप से खाने की वस्तुओं को दर्शाता है; ‘भोजन’ वर्तमान मानक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: כָּל דָּבָר
  choice: किसी ऐसी वस्तु
  rationale: वाक्यांश निषेध का विस्तार धन और भोजन से आगे सभी ब्याजयोग्य वस्तुओं तक करता है।
- source_word: אֲשֶׁר יִשָּׁךְ
  choice: जिस पर ब्याज लिया जा सकता है
  rationale: यह सम्बन्धवाचक उपवाक्य ऐसी वस्तु या ऋण को बताता है जिस पर ब्याज लगाया जाता है; हिन्दी में यह रूप मूल की व्यापक और कुछ हद तक सामान्य अभिव्यक्ति को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; कानूनी निषेध की सीधी और गरिमापूर्ण शैली। ‘भाई’ को मूल के पारिवारिक-वाचागत स्वर को बनाए रखने के लिए रखा गया है। समानांतर सूची को ‘न तो… न… और न…’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
