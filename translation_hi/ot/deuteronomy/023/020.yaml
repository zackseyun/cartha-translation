revisions:
- from: तुम अपने भाई से न तो रुपये पर ब्याज लेना, न भोजन पर ब्याज, और न किसी ऐसी वस्तु पर ब्याज लेना जिस पर ब्याज लिया जा सकता है।
  to: तुम अपने भाई से धन पर ब्याज, भोजन पर ब्याज, या किसी भी ऐसी वस्तु पर ब्याज मत लेना जिस पर ब्याज लिया जाता है।
  rationale: The revision supplies an idiomatic Hindi negative imperative, replaces the anachronistically specific “रुपये” with the broader “धन,” and renders the final relative clause as an established interest-bearing lending practice. It retains the literal “भाई,” the repeated legal term “ब्याज,” and the comprehensive scope of the Hebrew.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:54:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly understands the prohibition as addressed to the lender and retains the threefold scope: money, food, and any other item subject to interest. However, “रुपये” is overly specific for כֶּסֶף, which denotes money/wealth (literally silver), not the modern Indian currency. The final relative clause is also better rendered as an actual lending/charging practice rather than mere potentiality (“लिया जा सकता है”).'
  naturalness: The construction “तुम ... ब्याज लेना” lacks the required prohibitive form in Hindi. “ब्याज मत लेना” is direct, idiomatic, and appropriately legal in register. The revised wording maintains the source’s emphatic repetition naturally.
  terminology: “ब्याज” is the appropriate modern term for נֶשֶׁךְ. “भाई” properly preserves the literal familial-covenantal expression without adding an interpretive ethnic qualifier. “धन” is preferable to “रुपये” for the broad economic sense of כֶּסֶף.
  issues:
  - severity: medium
    issue: The Hindi prohibition is grammatically incomplete.
    rationale: “तुम ... लेना” is infinitival and does not express the Hebrew negative command. Hindi requires “मत लेना” (or an equivalent prohibitive form).
  - severity: medium
    issue: “रुपये” narrows the meaning of כֶּסֶף.
    rationale: The Hebrew refers to silver/money generally; naming rupees introduces a specific modern currency not present in the source.
  - severity: low
    issue: “जिस पर ब्याज लिया जा सकता है” expresses possibility rather than the source’s description of something lent/charged at interest.
    rationale: “जिस पर ब्याज लिया जाता है” more closely reflects the legal-economic category while remaining natural Hindi.
  revised_text: तुम अपने भाई से धन पर ब्याज, भोजन पर ब्याज, या किसी भी ऐसी वस्तु पर ब्याज मत लेना जिस पर ब्याज लिया जाता है।
  revised_footnotes: []
