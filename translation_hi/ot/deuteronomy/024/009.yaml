source:
  edition: WLC
  text: זָכ֕וֹר אֵ֧ת אֲשֶׁר עָשָׂ֛ה יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/מִרְיָ֑ם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֥ם מִ/מִּצְרָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/009.yaml
  text: Remember what Yahweh your God did to Miriam on the way when you were coming out of Egypt[a][b].
translation:
  language: hi
  text: याद रखो कि तुम्हारे परमेश्वर यहवे ने मरियम के साथ क्या किया, जब तुम मिस्र से निकलते समय मार्ग में थे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे परमेश्वर यहवे ने मरियम के साथ क्या किया था।”
    reason: क्रिया עָשָׂה को हिन्दी में संदर्भानुसार पूर्ण भूतकाल ‘किया था’ से भी व्यक्त किया जा सकता है।
  - marker: b
    text: अर्थात मिस्र से निर्गमन के बाद इस्राएल की यात्रा के दौरान; गिनती 12:1–15 देखें।
    reason: यह टिप्पणी ऐतिहासिक प्रसंग और सम्बद्ध वृत्तांत का संदर्भ देती है।
lexical_decisions:
- source_word: זָכוֹר
  choice: याद रखो
  rationale: यह זכר का एकवचन पुल्लिंग काल आदेश है। ‘याद रखो’ सीधी आज्ञा और वाचा-संबंधी स्मरण के भाव को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֵת אֲשֶׁר
  choice: क्या
  rationale: कर्म-चिह्न और सम्बन्धवाचक पद स्मरण की विषयवस्तु प्रस्तुत करते हैं; ‘क्या ... किया’ हिन्दी में स्वाभाविक है।
- source_word: עָשָׂה
  choice: किया था
  rationale: עשה यहाँ यहवे द्वारा मरियम के संबंध में किए गए कार्य को बताता है। हिन्दी के प्रसंग में ‘किया था’ स्मरण की आज्ञा से पहले घटित घटना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार अक्षरों वाले परमेश्वर के निज नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण ‘यहवे’ से प्रस्तुत किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित यह वाचा-संबंधी पद है; हिन्दी में इसका सीधा अनुवाद ‘तुम्हारे परमेश्वर’ है।
- source_word: לְמִרְיָם
  choice: मरियम के साथ
  rationale: עשה के साथ ל प्रभावित व्यक्ति को सूचित कर सकता है। ‘मरियम के साथ क्या किया’ मूल की व्यापकता को बनाए रखता है और ‘विरुद्ध’ जैसा अधिक निर्णायक अर्थ नहीं जोड़ता।
- source_word: בַּדֶּרֶךְ
  choice: मार्ग में
  rationale: इसका शाब्दिक अर्थ ‘रास्ते/मार्ग में’ है; ‘मार्ग में’ यात्रा के प्रसंग में संक्षिप्त और गरिमापूर्ण हिन्दी है।
- source_word: בְּצֵאתְכֶם
  choice: जब तुम ... निकल रहे थे
  rationale: पूर्वसर्ग सहित क्रियार्थक संज्ञा और बहुवचन प्रत्यय का कालवाचक अर्थ है। ‘जब तुम ... निकल रहे थे’ निर्गमन की प्रक्रियात्मक छाया बनाए रखता है।
- source_word: מִמִּצְרַיִם
  choice: मिस्र से
  rationale: מן स्रोत अथवा प्रस्थान-बिंदु बताता है; ‘मिस्र से निकल रहे थे’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निज नाम स्पष्ट रूप से आया है। ‘यहवे’ उसे उपाधि से प्रतिस्थापित किए बिना और किसी सांप्रदायिक व्याख्या को जोड़े बिना निकटता से प्रस्तुत करता है।
- issue: यहवे ने मरियम के संबंध में क्या किया
  choice: मरियम के साथ क्या किया था
  alternative: मरियम के विरुद्ध क्या किया था
  rationale: לְמִרְיָם प्रभावित व्यक्ति को सूचित करता है, पर अपने आप में ‘विरुद्ध’ अनिवार्य नहीं करता। चुना हुआ रूप मूल की अर्थगत व्यापकता और प्रसंग का तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्पष्ट और गरिमापूर्ण शैली। सामूहिक ‘तुम’ मूल में आदेश के व्याकरणिक एकवचन और बाद के बहुवचन यात्रा-संदर्भ को हिन्दी की स्वाभाविक अस्पष्टता में समेटता है।
