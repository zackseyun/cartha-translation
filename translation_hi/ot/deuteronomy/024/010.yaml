  text: כִּֽי תַשֶּׁ֥ה בְ/רֵֽעֲ/ךָ מַשַּׁ֣את מְא֑וּמָה לֹא תָבֹ֥א אֶל בֵּית֖/וֹ לַ/עֲבֹ֥ט עֲבֹטֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/010.yaml
  text: When you lend your neighbor anything[a], you shall not go into his house to take his pledge.
translation:
  language: hi
  text: जब तुम अपने पड़ोसी को कुछ भी उधार दो[a], तो उसकी गिरवी की वस्तु लेने के लिए उसके घर में प्रवेश न करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम अपने पड़ोसी को कुछ भी उधार दो, तो उसकी गिरवी रखी वस्तु लेने के लिए उसके घर में प्रवेश न करना।”
    reason: כִּי का सशर्त अर्थ ‘यदि’ भी हो सकता है, और עֲבֹטוֹ को ‘उसकी गिरवी रखी वस्तु’ कहा जा सकता है।
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ यह शब्द विधिक परिस्थिति का परिचय देता है; ‘जब’ स्वाभाविक है, जबकि ‘यदि’ भी संभव है।
- source_word: תַשֶּׁה ... מַשַּׁאת מְאוּמָה
  choice: कुछ भी उधार दो
  rationale: हिफ़ील क्रिया और संबद्ध संज्ञा का संयुक्त अर्थ किसी भी प्रकार की वस्तु या राशि उधार देने का है; हिंदी में यह संक्षिप्त और स्वाभाविक है।
- source_word: בְרֵעֲךָ
  choice: अपने पड़ोसी को
  rationale: רֵעַ समुदाय के किसी साथी या निकटवर्ती व्यक्ति को सूचित करता है; ‘पड़ोसी’ परिचित और प्रसंगानुकूल है।
- source_word: לֹא תָבֹא אֶל בֵּיתוֹ
  choice: उसके घर में प्रवेश न करना
  rationale: לֹא के साथ अपूर्ण क्रिया यहाँ स्पष्ट विधिक निषेध व्यक्त करती है।
- source_word: לַעֲבֹט עֲבֹטוֹ
  choice: उसकी गिरवी की वस्तु लेने के लिए
  rationale: עבט से आशय ऋण की जमानत के रूप में रखी वस्तु लेने से है; ‘गिरवी की वस्तु’ आधुनिक हिंदी में अर्थ स्पष्ट रखता है और ‘छीनना’ जैसी अतिरिक्त कठोरता नहीं जोड़ता।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट विधिक हिंदी। ‘प्रवेश न करना’ निषेध की गंभीरता बनाए रखता है; ‘गिरवी की वस्तु’ तकनीकी अर्थ को सहज रूप में व्यक्त करता है।
