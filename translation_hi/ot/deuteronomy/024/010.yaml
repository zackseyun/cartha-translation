review_pass:
  verdict: approve
  source_fidelity: ‘जब’ appropriately conveys כִּי as the introduction to a case-law situation, while the footnote preserves the viable conditional sense ‘यदि’. ‘अपने पड़ोसी को कुछ भी उधार दो’ communicates the lending/credit sense of תַשֶּה with מַשַּׁאת מְאוּמָה. The prohibition on entering the debtor’s house in order to take the pledged security is retained without added force.
  naturalness: The wording is clear, idiomatic modern Hindi with a suitably formal legal register. ‘उसकी गिरवी की वस्तु’ is readily understandable as the pledged item, and ‘प्रवेश न करना’ fits the instructional style.
  terminology: ‘पड़ोसी’ suitably renders רֵעַ in this context. ‘गिरवी की वस्तु’ accurately expresses the collateral/pledge sense of עֲבֹטוֹ and does not imply forcible seizure.
