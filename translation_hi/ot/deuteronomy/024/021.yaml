  yaml_path: translation/ot/deuteronomy/024/021.yaml
  text: When you harvest the grapes of your vineyard[a], you shall not go over it again after yourself; it shall be for the sojourner, the fatherless[c][b], and the widow.
translation:
  language: hi
  text: जब तुम अपनी दाखबारी के अंगूर तोड़ो, तो उसकी बीनाई फिर से मत करना[a]; वे परदेशी निवासी[b], अनाथ[c] और विधवा के लिए होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाद में उसकी बीनाई मत करना’ अथवा ‘उसे फिर से मत छाँटना।’ इब्रानी क्रिया पहली तुड़ाई के बाद रह गई उपज लेने के लिए दूसरी बार बीनने को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: ‘परदेशी निवासी’ से आशय इस्राएल के बीच रहने वाले गैर-स्थानीय व्यक्ति से है; इसे ‘निवासी परदेशी’ भी कहा जा सकता है।
    reason: cultural_note
  - marker: c
    text: या ‘पितृहीन।’ इब्रानी शब्द अनेक संदर्भों में विशेष रूप से पिता से वंचित व्यक्ति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ यह शब्द व्यवस्था में अपेक्षित परिस्थिति प्रस्तुत करता है; आधुनिक हिन्दी में ‘जब’ स्वाभाविक है।
- source_word: תִבְצֹר
  choice: अंगूर तोड़ो
  rationale: בצר विशेष रूप से दाखबारी से अंगूर इकट्ठा करने को बताता है; ‘अंगूर तोड़ना’ इसका सहज और सटीक हिन्दी रूप है।
- source_word: כַּרְמְךָ
  choice: अपनी दाखबारी
  rationale: כֶּרֶם के लिए ‘दाखबारी’ प्रचलित और संक्षिप्त हिन्दी पर्याय है।
- source_word: לֹא תְעוֹלֵל אַחֲרֶיךָ
  choice: बचे हुए अंगूर चुनने के लिए वहाँ दोबारा मत जाना
  rationale: कृषि-संदर्भ में עולל पहली तुड़ाई के बाद रह गए अंगूर बीनने या दूसरी बार छाँटने को दर्शाता है। यह वाक्यांश אַחֲרֶיךָ के ‘अपने बाद/पीछे’ वाले भाव को स्वाभाविक हिन्दी में दूसरी बार जाने के रूप में व्यक्त करता है।
- source_word: לַגֵּר
  choice: परदेशी निवासी
  rationale: גֵּר इस्राएलियों के बीच रहने वाले गैर-स्थानीय व्यक्ति को दर्शाता है; ‘परदेशी निवासी’ केवल बाहर से आए यात्री के बजाय उसके निवासी होने का सामाजिक-कानूनी भाव भी रखता है।
- source_word: לַיָּתוֹם
  choice: अनाथ
  rationale: יָתוֹם के लिए आधुनिक हिन्दी में ‘अनाथ’ सबसे सहज है; ‘पितृहीन’ का अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְלָאַלְמָנָה
  choice: और विधवा
  rationale: אַלְמָנָה का सीधा और स्वाभाविक हिन्दी अर्थ ‘विधवा’ है।
- source_word: יִהְיֶה
  choice: के लिए होंगे
  rationale: यहाँ क्रिया बचे हुए अंगूरों को इन असुरक्षित समूहों के लिए छोड़े जाने का अधिकार-संबंध व्यक्त करती है; बहुवचन ‘होंगे’ हिन्दी में निकटतम स्पष्ट संदर्भ ‘अंगूर’ से मेल खाता है।
