  text: הָשֵׁב֩ תָּשִׁ֨יב ל֤/וֹ אֶֽת הַ/עֲבוֹט֙ כְּ/בֹ֣א הַ/שֶּׁ֔מֶשׁ וְ/שָׁכַ֥ב בְּ/שַׂלְמָת֖/וֹ וּ/בֵֽרֲכֶ֑/ךָּ וּ/לְ/ךָ֙ תִּהְיֶ֣ה צְדָקָ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/013.yaml
  text: You must surely return the pledge to him at sunset[a], so that he may lie down in his cloak and bless you[b]; and it will be righteousness for you before Yahweh your God.
translation:
  language: hi
  text: सूरज ढलते समय वह गिरवी की वस्तु उसे अवश्य लौटा देना[a], ताकि वह अपने ओढ़ने के वस्त्र में सो सके और तुम्हें आशीष दे; और यह तुम्हारे परमेश्वर यहवे के सामने तुम्हारे लिए धार्मिकता होगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गिरवी”; अर्थात ऋण के बदले सुरक्षा के रूप में ली गई वस्तु।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “यह तुम्हारे लिए धार्मिकता होगी”; या “यह तुम्हारे लिए धार्मिकता गिनी जाएगी” अथवा “यह तुम्हारा धार्मिक कार्य होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב תָּשִׁיב
  choice: अवश्य लौटा देना
  rationale: धातु के infinitive absolute और finite verb का मेल आज्ञा पर विशेष बल देता है; ‘अवश्य’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַעֲבוֹט
  choice: गिरवी की वस्तु
  rationale: यह ऋण की सुरक्षा के रूप में रखी गई वस्तु को दर्शाता है। ‘गिरवी की वस्तु’ सामान्य पाठक के लिए स्पष्ट है और केवल वस्त्र तक अर्थ को सीमित नहीं करता।
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: सूरज ढलते समय
  rationale: शाब्दिक मुहावरा ‘सूरज के आने पर’ सूर्यास्त को सूचित करता है; यह हिन्दी में उसका सहज समतुल्य है।
- source_word: וְשָׁכַב
  choice: ताकि वह ... सो सके
  rationale: संदर्भ में यह गिरवी लौटाने के उद्देश्य अथवा परिणाम को व्यक्त करता है; ‘सो सके’ केवल लेटने की अपेक्षा प्रसंगगत आशय को स्पष्ट करता है।
- source_word: בְּשַׂלְמָתוֹ
  choice: अपना ओढ़ना ओढ़कर
  rationale: שַׂלְמָה बाहरी वस्त्र है जो रात में ओढ़ने के काम आता था। ‘ओढ़ना’ उसके प्रसंगगत उपयोग को सामान्य हिन्दी में स्पष्ट करता है।
- source_word: וּבֵרֲכֶךָּ
  choice: और तुम्हें आशीष दे
  rationale: क्रिया का कर्ता वह जरूरतमंद व्यक्ति है; उद्देश्यसूचक रचना के साथ ‘दे’ स्वाभाविक रूप से जुड़ता है।
- source_word: וּלְךָ תִּהְיֶה צְדָקָה
  choice: यह तुम्हारे लिए ... धार्मिकता मानी जाएगी
  rationale: צְדָקָה परमेश्वर के सामने सही ठहरने वाले कार्य या धार्मिकता को सूचित करती है। ‘मानी जाएगी’ सम्भावित मूल्यांकनात्मक भाव बताता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर यहवे के सामने
  rationale: לִפְנֵי का संबंधपरक अर्थ ‘के सामने’ है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘यहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिप्यंतरण में सुरक्षित रखता है।
- issue: צְדָקָה का न्यायात्मक अथवा नैतिक भाव
  choice: धार्मिकता मानी जाएगी
  alternative: तुम्हारे लिए धार्मिकता होगी; तुम्हारा धर्म का काम होगा
  rationale: पद परमेश्वर के सामने कार्य के मूल्यांकन और उस कार्य की नैतिक धार्मिकता—दोनों की ओर संकेत कर सकता है। मुख्य पाठ में सुबोध मूल्यांकनात्मक रूप रखा गया है और पादटिप्पणी में अधिक शाब्दिक तथा कर्म-केंद्रित विकल्प दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण कानूनी-उपदेशात्मक स्वर। संबोधन एकवचन ‘तुम’ में रखा गया है। ‘गिरवी की वस्तु’ और ‘ओढ़ना’ से प्राचीन सामाजिक प्रसंग स्पष्ट होता है, जबकि मूल की धार्मिकता-संबंधी अर्थगत व्यापकता पादटिप्पणी में सुरक्षित है।
