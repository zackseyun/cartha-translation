source:
  edition: WLC
  text: לֹא תַעֲשֹׁ֥ק שָׂכִ֖יר עָנִ֣י וְ/אֶבְי֑וֹן מֵ/אַחֶ֕י/ךָ א֧וֹ מִ/גֵּרְ/ךָ֛ אֲשֶׁ֥ר בְּ/אַרְצְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/014.yaml
  text: You shall not oppress a hired worker who is poor and needy[a], whether one of your brothers or one of your sojourners who is in your land[b], within your gates.
translation:
  language: hi
  text: तुम किसी गरीब और ज़रूरतमंद मज़दूर का शोषण न करना[a], चाहे वह तुम्हारे भाइयों में से हो या तुम्हारे देश में, तुम्हारे नगरों में रहनेवाला कोई परदेशी हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उससे धोखा न करना” अथवा “उसका अनुचित लाभ न उठाना”; इब्रानी क्रिया में आर्थिक उत्पीड़न भी शामिल है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “तुम्हारे फाटकों के भीतर”; यह इब्रानी मुहावरा तुम्हारे नगरों या तुम्हारे समुदाय के अधिकार-क्षेत्र में रहने को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: शोषण न करना
  rationale: עָשַׁק आर्थिक संदर्भ में दबाने, अनुचित लाभ उठाने या देय मज़दूरी रोकने तक को समेटता है। ‘शोषण’ आधुनिक हिन्दी में इस व्यापक नैतिक और आर्थिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׂכִיר
  choice: मज़दूर
  rationale: यह शब्द मज़दूरी पर रखे गए कामगार को दर्शाता है। प्रसंग में ‘मज़दूर’ सहज और स्पष्ट है; ‘नौकर’ अनावश्यक रूप से घरेलू सेवा का अर्थ दे सकता है।
- source_word: עָנִי וְאֶבְיוֹן
  choice: गरीब और ज़रूरतमंद
  rationale: दोनों विशेषण आर्थिक असुरक्षा पर बल देते हैं। हिन्दी में यह जोड़ी दोहरे वर्णन को बनाए रखते हुए स्वाभाविक है।
- source_word: מֵאַחֶיךָ
  choice: तुम्हारे भाइयों में से
  rationale: शाब्दिक संबंधसूचक भाषा को बनाए रखा गया है; व्यवस्थाविवरण के वाचा-संबंधी संदर्भ में यह इस्राएली सहसमुदाय के सदस्य को सूचित करता है।
- source_word: מִגֵּרְךָ
  choice: तुम्हारे ... परदेशियों में से
  rationale: גֵּר उस गैर-स्थानीय व्यक्ति की सामाजिक-कानूनी श्रेणी है जो इस्राएली समुदाय के बीच निवास करता है। ‘परदेशी’ आधुनिक हिन्दी में समझने योग्य है और आधुनिक नागरिकता-कानून की श्रेणियाँ आरोपित नहीं करता।
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: तुम्हारे देश में ... रहनेवाले
  rationale: एकवचन संबंधवाचक वाक्यांश निकटतम संज्ञा גֵּר को विशेषित करता है। हिन्दी वाक्य-विन्यास में वर्गसूचक बहुवचन ‘परदेशियों’ के साथ ‘रहनेवाले’ स्वाभाविक है।
- source_word: בִּשְׁעָרֶיךָ
  choice: तुम्हारे नगरों में
  rationale: शाब्दिक अर्थ ‘तुम्हारे फाटकों में’ है, पर यह नगरों अथवा स्थानीय सामुदायिक अधिकार-क्षेत्र के लिए प्रचलित इब्रानी मुहावरा है। हिन्दी में आशय को स्पष्ट करने के लिए ‘नगरों में’ चुना गया है।
theological_decisions:
- issue: वाचा की व्यवस्था में אַחֶיךָ का संबंधसूचक अर्थ
  choice: तुम्हारे भाइयों में से
  alternative: तुम्हारे साथी इस्राएलियों में से
  rationale: मूल की पुरुषवाची संबंधसूचक भाषा और वाचा-संबंधी निकटता को बनाए रखा गया है, बिना उसके सामुदायिक आशय को किसी निजी धर्मवैज्ञानिक निष्कर्ष में बदलने के।
- issue: גֵּר की सामाजिक-कानूनी पहचान
  choice: परदेशियों
  alternative: निवासी विदेशियों
  rationale: यह शब्द समुदाय के बीच रहनेवाले संरक्षित बाहरी निवासी को दर्शाता है। ‘परदेशी’ बाइबिलीय श्रेणी को आधुनिक आप्रवासन-कानून की तकनीकी शब्दावली से बाँधने से बचता है।
- issue: בִּשְׁעָרֶיךָ का मुहावरेदार अर्थ
  choice: तुम्हारे नगरों में
  alternative: तुम्हारे फाटकों के भीतर
  rationale: यहाँ फाटक केवल भौतिक प्रवेश-द्वार नहीं, नगर और उसके अधिकार-क्षेत्र का संकेत है। मुख्य पाठ में अर्थ स्पष्ट किया गया और शाब्दिक चित्र पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और कानूनी-उपदेशात्मक स्वर रखा गया है। ‘मज़दूर’ और ‘शोषण’ सामान्य पाठक के लिए सहज हैं। ‘भाइयों’ मूल की वाचा-संबंधी भाषा को सुरक्षित रखता है, जबकि ‘परदेशी’ आधुनिक कानूनी श्रेणियाँ आरोपित किए बिना निवासी बाहरी व्यक्ति का अर्थ देता है।
