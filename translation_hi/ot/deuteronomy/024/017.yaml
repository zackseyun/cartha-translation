base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/017.yaml
  text: You shall not pervert the justice due to a sojourner or an orphan[a], nor take a widow’s garment as a pledge.
translation:
  language: hi
  text: तुम अपने बीच रहनेवाले परदेशी[a] या अनाथ के न्याय को न बिगाड़ना, और न किसी विधवा का वस्त्र गिरवी लेना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निवासी विदेशी’ अथवा ‘प्रवासी’। इब्रानी शब्द ऐसे गैर-स्थानीय व्यक्ति को दर्शाता है जो इस्राएलियों के बीच रहकर सामाजिक और कानूनी संरक्षण पाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַטֶּה
  choice: न बिगाड़ना
  rationale: हिफ़ील रूप यहाँ न्याय को मोड़ने या विकृत करने के न्यायिक अर्थ में है। ‘न्याय को न बिगाड़ना’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: מִשְׁפַּט
  choice: के न्याय
  rationale: यह शब्द न्याय, न्यायिक निर्णय या उचित कानूनी अधिकार को सूचित कर सकता है। ‘के न्याय’ संक्षिप्त रहते हुए उस व्यक्ति को मिलनेवाले उचित न्याय का भाव रखता है।
- source_word: גֵּר
  choice: अपने बीच रहनेवाला परदेशी
  rationale: यह केवल राह चलते विदेशी को नहीं, बल्कि इस्राएलियों के बीच रहनेवाले गैर-इस्राएली निवासी को दर्शाता है। विस्तृत पदबंध आधुनिक पाठक के लिए सामाजिक-कानूनी श्रेणी को स्पष्ट करता है।
- source_word: יָתוֹם
  choice: अनाथ
  rationale: यह उस बच्चे को दर्शाता है जो विशेषतः पिता की सुरक्षा से वंचित है। ‘अनाथ’ आधुनिक हिन्दी का सहज और सम्मानपूर्ण शब्द है।
- source_word: תַחֲבֹל
  choice: गिरवी रखना
  rationale: ऋण-संबंधी इस कानूनी प्रसंग में क्रिया का अर्थ किसी वस्तु को जमानत के रूप में लेना है। ‘गिरवी रखना’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: בֶּגֶד
  choice: वस्त्र
  rationale: इब्रानी शब्द सामान्य रूप से कपड़े या पहनावे को दर्शाता है; ‘वस्त्र’ किसी विशेष प्रकार के बाहरी कपड़े को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אַלְמָנָה
  choice: विधवा
  rationale: मूल शब्द विधवा स्त्री को दर्शाता है। ‘किसी विधवा का’ हिन्दी में स्वाभाविक ढंग से उसके वस्त्र और उसकी संरक्षित सामाजिक स्थिति दोनों को व्यक्त करता है।
theological_decisions:
- issue: גֵּר से सूचित संरक्षित सामाजिक वर्ग
  choice: अपने बीच रहनेवाला परदेशी
  alternative: विदेशी; प्रवासी; अजनबी
  rationale: पद उस गैर-स्थानीय व्यक्ति की कानूनी सुरक्षा की बात करता है जो इस्राएल के समाज में निवास करता था। यह अनुवाद उसे सामान्य विदेशी या अपरिचित व्यक्ति तक सीमित किए बिना उस निवासी स्थिति को सामने लाता है।
- issue: גֵּר יָתוֹם के बीच संयोजक का अभाव
  choice: परदेशी या अनाथ
  alternative: परदेशी और अनाथ; परदेशी अनाथ
  rationale: मसोराई पाठ में दोनों संज्ञाओं के बीच संयोजक नहीं है। सन्दर्भ में दो दुर्बल वर्गों की सूची समझना सबसे स्वाभाविक है; हिन्दी में ‘या’ निषेध के विस्तार को दोनों पर लागू करता है, जबकि ‘परदेशी अनाथ’ अनाथ को परदेशी का विशेषण समझे जाने का जोखिम पैदा करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘न्याय को बिगाड़ना’ और ‘गिरवी रखना’ कानूनी आशय को सहज हिन्दी में व्यक्त करते हैं; גֵּר की विशिष्ट सामाजिक स्थिति मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित है।
