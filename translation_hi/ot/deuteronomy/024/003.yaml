base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/003.yaml
  text: and the latter man hates her[a], and writes her a certificate of divorce, and puts it into her hand, and sends her out of his house, or if the latter man dies[c][b], who took her as his wife—
translation:
  language: hi
  text: और वह दूसरा पुरुष उससे घृणा करे[a], और उसके लिए तलाक़-पत्र[b] लिखकर उसके हाथ में दे दे और उसे अपने घर से भेज दे, या यदि वह दूसरा पुरुष, जिसने उसे अपने लिए पत्नी के रूप में लिया था[c], मर जाए—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उससे घृणा की।” इब्रानी पूर्ण क्रिया को इस कानूनी घटनाक्रम में साधारण भूतकाल के रूप में भी समझा जा सकता है; मुख्य अर्थ उसके प्रति घृणा रखना है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “संबंध-विच्छेद का दस्तावेज़।” यह विवाह को औपचारिक रूप से समाप्त करने वाला लिखित पत्र था।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में, “जिसने उसे अपने लिए पत्नी के रूप में लिया था,” अर्थात जिसने उससे विवाह किया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂנֵאָהּ
  choice: उससे घृणा करने लगे
  rationale: שׂנא का मूल अर्थ ‘घृणा करना’ है। ‘करने लगे’ इस कानूनी घटनाक्रम में उत्पन्न हुई शत्रुता को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि क्रिया की तीव्रता को ‘नापसंद’ कहकर कम नहीं करता।
- source_word: הָאִישׁ הָאַחֲרוֹן
  choice: वह दूसरा पुरुष
  rationale: אַחֲרוֹן यहाँ पहले पुरुष के विपरीत बाद वाले, अर्थात दूसरे पुरुष को सूचित करता है। हिन्दी में ‘दूसरा पुरुष’ कानूनी संदर्भ को स्पष्ट और सहज रखता है।
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: उसके लिए तलाक़-पत्र लिखकर
  rationale: סֵפֶר כְּרִיתֻת विवाह-विच्छेद के औपचारिक लिखित दस्तावेज़ को दर्शाता है। ‘तलाक़-पत्र’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: וְנָתַן בְּיָדָהּ
  choice: उसके हाथ में दे दे
  rationale: यह अनुवाद दस्तावेज़ सौंपने की ठोस कानूनी क्रिया और मूल के ‘हाथ में’ वाक्यांश दोनों को बनाए रखता है।
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: उसे अपने घर से विदा कर दे
  rationale: שׁלח यहाँ पत्नी को घर से भेज देने के तलाक़-संबंधी कार्य को व्यक्त करता है। ‘विदा कर दे’ गरिमापूर्ण और स्वाभाविक है तथा מִבֵּיתוֹ को स्पष्ट रखता है।
- source_word: אוֹ כִי יָמוּת
  choice: या यदि ... मर जाए
  rationale: यह कानूनी मामले की वैकल्पिक शर्त है; इसलिए ‘या यदि’ हिन्दी में इसकी शर्तात्मक संरचना को ठीक से व्यक्त करता है।
- source_word: אֲשֶׁר לְקָחָהּ לוֹ לְאִשָּׁה
  choice: जिसने उसे अपनी पत्नी बनाया था
  rationale: לקח ... לְאִשָּׁה विवाह करने का इब्रानी मुहावरा है। चुना हुआ रूप विवाह का अर्थ स्पष्ट करता है और हिन्दी में मूल की संरचना का कुछ अंश भी बनाए रखता है।
