base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/005.yaml
  text: When a man takes a new wife[a], he shall not go out with the army, nor shall any duty be imposed on him. He shall be free for his household for one year[d][c][b], and he shall make his wife whom he has taken rejoice.
translation:
  language: hi
  text: जब कोई पुरुष नई पत्नी से विवाह करे, तब वह सेना के साथ न निकले[a], और न उस पर कोई काम सौंपा जाए[b]। वह एक वर्ष तक अपने घर-परिवार के लिए स्वतंत्र रहे[c] और अपनी उस पत्नी को प्रसन्न करे, जिससे उसने विवाह किया है[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह युद्ध के लिए न निकले।” इब्रानी में शाब्दिक रूप से “सेना के साथ न निकले” है, जिसमें केवल प्रत्यक्ष युद्ध ही नहीं, व्यापक सैनिक सेवा भी सम्मिलित हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “न उस पर कोई दायित्व डाला जाए।” इब्रानी अभिव्यक्ति केवल सैनिक काम से अधिक व्यापक हो सकती है।
    reason: alternative_reading
  - marker: c
    text: या, “वह एक वर्ष तक अपने घर में छूट पर रहे।” इब्रानी वाक्यांश घर-परिवार के लिए उसकी उपलब्धता अथवा घर पर उसके रहने—दोनों पर बल दे सकता है।
    reason: lexical_alternative
  - marker: d
    text: या, “अपनी उस पत्नी को आनंदित करे, जिससे उसने विवाह किया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यह व्यवस्था में एक सामान्य परिस्थिति प्रस्तुत करता है; आधुनिक हिन्दी की कानूनी शैली में ‘जब’ स्वाभाविक है।
- source_word: יִקַּח אִישׁ אִשָּׁה חֲדָשָׁה
  choice: कोई पुरुष नई पत्नी से विवाह करे
  rationale: לָקַח אִשָּׁה विवाह करने का प्रचलित इब्रानी मुहावरा है। ‘नई पत्नी’ हाल में हुए विवाह को व्यक्त करता है।
- source_word: לֹא יֵצֵא בַּצָּבָא
  choice: वह सेना के साथ न निकले
  rationale: यह अनुवाद इब्रानी बिंब को बनाए रखता है और अर्थ को केवल प्रत्यक्ष युद्ध तक सीमित नहीं करता।
- source_word: וְלֹא יַעֲבֹר עָלָיו לְכָל דָּבָר
  choice: न उस पर कोई काम सौंपा जाए
  rationale: वाक्यांश किसी भी काम, दायित्व या नियुक्त सेवा के उस पर लगाए जाने को रोकता है; ‘काम’ मूल की व्यापकता बनाए रखता है।
- source_word: נָקִי יִהְיֶה לְבֵיתוֹ
  choice: अपने घर-परिवार के लिए दायित्वों से मुक्त रहे
  rationale: נָקִי यहाँ बाध्यता से मुक्त होने का भाव रखता है, और בַּיִת केवल भवन नहीं बल्कि घर-परिवार भी दर्शाता है।
- source_word: שָׁנָה אֶחָת
  choice: एक वर्ष तक
  rationale: निर्धारित अवधि को सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: וְשִׂמַּח אֶת אִשְׁתּוֹ
  choice: अपनी ... पत्नी को आनंदित करे
  rationale: שׂמח का पिएल रूप कारणवाचक है; इसलिए केवल साथ में प्रसन्न रहने के बजाय पत्नी को आनंदित करने का भाव रखा गया है।
- source_word: אֲשֶׁר לָקָח
  choice: जिससे उसने विवाह किया है
  rationale: हिन्दी में वैवाहिक आशय स्वाभाविक और स्पष्ट बनता है; शाब्दिक ‘जिसे उसने लिया’ अनावश्यक रूप से कठोर और अस्पष्ट होता।
