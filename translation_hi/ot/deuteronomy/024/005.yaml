  register: भाषा आधुनिक मानक हिन्दी में, विधिक निर्देश के अनुरूप गरिमापूर्ण और सहज रखी गई है। ‘घर-परिवार’ से בַּיִת का घरेलू-सामुदायिक अर्थ और ‘दायित्वों से मुक्त’ से נָקִי का प्रसंगगत भाव स्पष्ट किया गया है।
