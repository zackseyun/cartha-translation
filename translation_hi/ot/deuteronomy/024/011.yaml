- source_word: וְהָאִישׁ
  choice: और जिस आदमी
  rationale: אִישׁ यहाँ इस विधिक उदाहरण में पुरुष ऋणी को सूचित करता है; ‘आदमी’ मूल के लिंग-संदर्भ को बनाए रखते हुए सामान्य हिन्दी है।
- source_word: אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
  choice: जिस आदमी को तुम उधार दे रहे हो
  rationale: נשה लेनदार द्वारा उधार देने या सामने वाले के ऋणी होने—दोनों दृष्टियों से संबंध व्यक्त कर सकता है। मुख्य पाठ में लेनदार की क्रिया रखी गई है और दूसरा संभव अर्थ पादटिप्पणी में दिया गया है।
- source_word: יוֹצִיא אֵלֶיךָ
  choice: तुम्हारे पास बाहर ले आए
  rationale: יצא के हिफ़ील रूप का कारणवाचक अर्थ ‘बाहर लाना’ है और אֵלֶיךָ दिशा को ‘तुम्हारे पास’ से व्यक्त किया गया है।
- source_word: הָעֲבוֹט
  choice: गिरवी की वस्तु
  rationale: עֲבוֹט ऋण की सुरक्षा के लिए रखी जाने वाली वस्तु है। ‘गिरवी की वस्तु’ सामान्य पाठक के लिए स्पष्ट है और केवल अमूर्त ‘गिरवी’ की अपेक्षा वस्तुगत अर्थ को उभारता है।
- source_word: הַחוּצָה
  choice: बाहर
  rationale: दिशासूचक रूप घर के भीतर से बाहर की ओर गति बताता है; हिन्दी में ‘बाहर ले आए’ इसे स्वाभाविक ढंग से व्यक्त करता है।
