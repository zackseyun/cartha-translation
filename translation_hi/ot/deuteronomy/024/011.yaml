  text: You shall stand outside[a], and the man to whom you are making the loan shall bring the pledge out to you.
translation:
  language: hi
  text: तुम बाहर खड़े रहो, और जिस आदमी को तुम उधार दे रहे हो, वह गिरवी की वस्तु बाहर तुम्हारे पास ले आए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो आदमी तुम्हारा ऋणी है, वह गिरवी की वस्तु बाहर तुम्हारे पास ले आए।” इब्रानी अभिव्यक्ति में लेनदार के उधार देने या ऋणी के ऋणी होने—दोनों में से किसी पक्ष पर बल हो सकता है।
    reason: lexical_alternative
