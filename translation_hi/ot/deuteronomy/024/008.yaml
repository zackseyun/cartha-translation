source:
  edition: WLC
  text: הִשָּׁ֧מֶר בְּ/נֶֽגַע הַ/צָּרַ֛עַת לִ/שְׁמֹ֥ר מְאֹ֖ד וְ/לַ/עֲשׂ֑וֹת כְּ/כֹל֩ אֲשֶׁר יוֹר֨וּ אֶתְ/כֶ֜ם הַ/כֹּהֲנִ֧ים הַ/לְוִיִּ֛ם כַּ/אֲשֶׁ֥ר צִוִּיתִ֖/ם תִּשְׁמְר֥וּ לַ/עֲשֽׂוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/008.yaml
  text: Be careful in the case of an outbreak of skin disease[a], to observe very carefully and to do according to all that the Levitical priests instruct you; as I have commanded them, so you shall be careful to do.
translation:
  language: hi
  text: चर्मरोग के प्रकोप[a] के मामले में सावधान रहो। लेवीय याजक तुम्हें जो कुछ निर्देश दें, उन सब के अनुसार बहुत सावधानी से मानना और करना। जैसा मैंने उन्हें आज्ञा दी है, वैसा ही ध्यान से मानना और करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत अनुवाद ‘कोढ़’ है। इब्रानी शब्द तोरा में कई प्रकार की त्वचा-संबंधी दशाओं के लिए प्रयुक्त होता है; यह केवल आधुनिक हैन्सन रोग को नहीं दर्शाता।
    reason: शब्दार्थ के पारंपरिक विकल्प और व्यापक इब्रानी अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: सावधान रहो
  rationale: निफ़ाल आज्ञार्थक यहाँ चेतावनी और सतर्कता का भाव देता है। ‘सावधान रहो’ आधुनिक हिन्दी में स्वाभाविक है और आज्ञार्थक बल बनाए रखता है।
- source_word: בְּנֶגַע הַצָּרַעַת
  choice: चर्मरोग के प्रकोप के मामले में
  rationale: נֶגַע किसी घाव, चिह्न, प्रकोप या पीड़ा को सूचित कर सकता है, और व्यवस्था में צָרַעַת आधुनिक हैन्सन रोग से अधिक व्यापक श्रेणी है। यह पदबंध चिकित्सकीय अति-विशिष्टता से बचते हुए प्रसंग का भाव देता है।
- source_word: לִשְׁמֹר מְאֹד וְלַעֲשׂוֹת
  choice: बहुत ध्यान से मानना और करना
  rationale: מְאֹד की प्रबलता को ‘बहुत ध्यान से’ व्यक्त करता है और שׁמר तथा עשׂה—निर्देश को मानने और व्यवहार में लाने—दोनों को बनाए रखता है।
- source_word: כְּכֹל אֲשֶׁר יוֹרוּ אֶתְכֶם
  choice: जो कुछ निर्देश दें
  rationale: ירה का हिफ़ील रूप यहाँ याजकीय कानूनी मार्गदर्शन देना है। ‘निर्देश दें’ इस अधिकारपूर्ण व्यावहारिक मार्गदर्शन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: लेवीय याजक
  rationale: यह व्यवस्थाविवरण में लेवी से संबंधित याजकों का प्रचलित पदनाम है; इसे दो अलग समूहों के रूप में नहीं प्रस्तुत किया गया है।
- source_word: כַּאֲשֶׁר צִוִּיתִם תִּשְׁמְרוּ לַעֲשׂוֹת
  choice: जैसा मैंने उन्हें आज्ञा दी है, वैसा ही करने में सावधानी रखना
  rationale: तुलनात्मक כַּאֲשֶׁר का ‘जैसा…वैसा’ संबंध स्पष्ट रहता है, याजकों के लिए बहुवचन कर्म-प्रत्यय ‘उन्हें’ सुरक्षित है, और अंतिम שׁמר־לעשׂות की दोहराई गई सावधानी भी व्यक्त होती है।
theological_decisions:
- issue: צָרַעַת का अर्थ
  choice: चर्मरोग
  alternative: कोढ़
  rationale: तोरा में यह शब्द आधुनिक हैन्सन रोग तक सीमित नहीं है, बल्कि अनेक प्रकार की अनुष्ठानिक अशुद्धि से जुड़ी दशाओं के लिए आता है। ‘चर्मरोग’ इस व्यापकता को अधिक ठीक रखता है; पारंपरिक विकल्प पादटिप्पणी में दिया गया है।
- issue: הַכֹּהֲנִים הַלְוִיִּם की पहचान
  choice: लेवीय याजक
  alternative: याजक, अर्थात् लेवी
  rationale: यह व्यवस्थाविवरण का एक संयुक्त पदनाम समझा गया है, जो लेवी से संबंधित याजकों को दर्शाता है; यह किसी अलग सांप्रदायिक याजक-व्यवस्था का दावा नहीं करता।
- issue: वचन में एकवचन और बहुवचन का परिवर्तन
  choice: हिन्दी में सामूहिक संबोधन के लिए ‘तुम’ के रूपों का प्रयोग
  alternative: एकवचन और बहुवचन को अस्वाभाविक रूप से अलग-अलग दिखाना
  rationale: इब्रानी आरंभ में एकवचन आज्ञा और आगे बहुवचन संबोधन का प्रयोग करके इस्राएल को सामूहिक रूप से संबोधित करती है। आधुनिक हिन्दी में ‘तुम’ दोनों स्तरों को सहज रूप से समेटता है और अर्थगत परिवर्तन को नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और निर्देशात्मक स्वर रखा गया है। लंबे इब्रानी वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है, जबकि सावधानी, याजकीय निर्देश और आज्ञापालन की क्रमिक संरचना सुरक्षित रखी गई है।
