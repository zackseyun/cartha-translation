source:
  edition: WLC
  text: לֹא יַחֲבֹ֥ל רֵחַ֖יִם וָ/רָ֑כֶב כִּי נֶ֖פֶשׁ ה֥וּא חֹבֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/006.yaml
  text: No one shall take a pair of millstones[a], or even the upper millstone, as a pledge, for he would be taking a life as a pledge.
translation:
  language: hi
  text: कोई भी चक्की के दोनों पाटों को, यहाँ तक कि उसके ऊपरी पाट को भी, गिरवी न ले; क्योंकि वह किसी का जीवन ही गिरवी लेता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחֲבֹל / חֹבֵל
  choice: गिरवी रखे / गिरवी रखना
  rationale: ऋण की जमानत के रूप में कोई वस्तु लेने के कानूनी अर्थ को सरल आधुनिक हिन्दी में व्यक्त करता है और मूल की पुनरावृत्ति भी बनाए रखता है।
- source_word: רֵחַיִם
  choice: चक्की के दोनों पाट
  rationale: द्विवचन रूप चक्की के पाटों की जोड़ी को सूचित करता है; हिन्दी में यह अभिव्यक्ति स्पष्ट और स्वाभाविक है।
- source_word: וָרָכֶב
  choice: यहाँ तक कि उसके ऊपरी पाट को भी
  rationale: רָכֶב यहाँ घूमने वाले ऊपरी पाट का द्योतक है। ‘यहाँ तक कि ... भी’ यह कानूनी बल प्रकट करता है कि पूरी चक्की तो दूर, उसका एक अनिवार्य पाट भी गिरवी न लिया जाए।
- source_word: כִּי
  choice: क्योंकि
  rationale: निषेध का नैतिक और व्यावहारिक कारण प्रस्तुत करता है।
- source_word: נֶפֶשׁ
  choice: जीवन
  rationale: यहाँ शब्द अमूर्त ‘आत्मा’ के बजाय जीवन-निर्वाह से जुड़े ठोस जीवन को सूचित करता है। चक्की दैनिक भोजन तैयार करने का आवश्यक साधन थी; इसलिए उसे लेना मानो जीवन को ही गिरवी रखना था। विकल्प ‘जीविका’ पादटिप्पणी में रखा गया है।
- source_word: הוּא
  choice: ऐसा करना
  rationale: हिब्रू सर्वनाम का आशय गिरवी लेने की उक्त क्रिया से है। हिन्दी में ‘ऐसा करना’ संबंध को स्पष्ट करता है, बिना मूल भाव बदले।
theological_decisions:
- issue: कानूनी-सामाजिक प्रसंग में נֶפֶשׁ का अर्थ
  choice: जीवन
  alternative: जीविका; प्राण; व्यक्ति
  rationale: प्रसंग उस उपकरण को गिरवी लेने से रोकता है जिस पर दैनिक भोजन और जीवन-निर्वाह निर्भर था। ‘जीवन’ मूल की तीव्रता और व्यापकता बनाए रखता है, जबकि ‘जीविका’ संभावित संदर्भगत अर्थ के रूप में पादटिप्पणी में दिया गया है; ‘आत्मा’ इस प्रसंग में अनावश्यक आध्यात्मिक अर्थ पैदा कर सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चक्की के दोनों पाट’ सामान्य पाठक के लिए प्राचीन हाथ-चक्की की रचना स्पष्ट करता है। निषेध को सामान्य विधान के रूप में ‘कोई भी ... न रखे’ कहा गया है।
