language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי יִקַּ֥ח אִ֛ישׁ אִשָּׁ֖ה וּ/בְעָלָ֑/הּ וְ/הָיָ֞ה אִם לֹ֧א תִמְצָא חֵ֣ן בְּ/עֵינָ֗י/ו כִּי מָ֤צָא בָ/הּ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/001.yaml
  text: If a man takes a wife and marries her[a], and it happens that she does not find favor in his eyes because he has found in her some indecency, and he writes her a certificate of divorce, puts it into her hand, and sends her out of his house,
translation:
  language: hi
  text: यदि कोई पुरुष किसी स्त्री से विवाह करे और उसका पति बने, और फिर ऐसा हो कि वह उसकी दृष्टि में अनुग्रह न पाए, क्योंकि उसने उसमें कोई अशोभनीय बात[a] पाई हो, और वह उसके लिए तलाक़ का पत्र लिखकर उसके हाथ में दे और उसे अपने घर से भेज दे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लज्जाजनक बात” अथवा “अशोभनीय विषय।” इब्रानी पदबंध जानबूझकर अनिश्चित है और उसकी एक से अधिक व्याख्याएँ की गई हैं।
    reason: मूल पदबंध עֶרְוַת דָּבָר की अर्थगत अस्पष्टता तथा प्रमुख अनुवाद-विकल्प सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यहाँ यह शब्द कारण नहीं, बल्कि विधिक उदाहरण की शर्त आरंभ करता है; ‘यदि’ हिंदी में इस अपूर्ण पूर्वपक्ष को स्पष्ट रखता है।
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: कोई पुरुष किसी स्त्री को पत्नी बनाए
  rationale: यह इब्रानी मुहावरे ‘पत्नी लेना’ का स्वाभाविक आधुनिक हिंदी रूप है और विवाह के संदर्भ को स्पष्ट करता है।
- source_word: וּבְעָלָהּ
  choice: और उससे वैवाहिक संबंध स्थापित करे
  rationale: क्रिया पति के रूप में वैवाहिक संबंध में आने को व्यक्त करती है। यह अनुवाद स्वामित्व का भ्रामक भाव लाए बिना स्रोत के उस अलग तत्व को बनाए रखता है जो पत्नी बनाने के बाद आता है।
- source_word: וְהָיָה
  choice: और फिर ऐसा हो
  rationale: यह विधिक परिस्थिति को अगले चरण में ले जाने वाला सूत्र है; हिंदी में यह सशर्त घटनाक्रम को स्वाभाविक ढंग से आगे बढ़ाता है।
- source_word: לֹא תִמְצָא חֵן בְּעֵינָיו
  choice: वह उसकी दृष्टि में अनुग्रह न पाए
  rationale: यह स्रोत के ‘उसकी आँखों में अनुग्रह पाना’ मुहावरे के निकट रहते हुए अर्थ को समझने योग्य रखता है।
- source_word: כִּי מָצָא בָהּ
  choice: क्योंकि उसने उसमें ... पाई है
  rationale: यह उपवाक्य विधिक परिदृश्य में बताए गए कारण को व्यक्त करता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्पष्ट करता है।
- source_word: עֶרְוַת דָּבָר
  choice: कोई अशोभनीय बात
  rationale: यह कठिन और अनिश्चित पदबंध किसी लज्जाजनक या अनुचित बात की ओर संकेत करता है, पर उसका ठीक स्वरूप निर्दिष्ट नहीं करता। चुना गया रूप इसी अस्पष्टता को बनाए रखता है।
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: वह उसके लिए तलाक़ का पत्र लिखे
  rationale: यह विवाह-विच्छेद का औपचारिक लिखित दस्तावेज़ है; ‘तलाक़ का पत्र’ आधुनिक हिंदी में स्पष्ट और संक्षिप्त है।
- source_word: וְנָתַן בְּיָדָהּ
  choice: उसके हाथ में दे
  rationale: यह दस्तावेज़ सौंपने की ठोस विधिक क्रिया को स्रोत के निकट रूप में व्यक्त करता है।
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: उसे अपने घर से विदा कर दे
  rationale: यह स्त्री को घर से भेज देने और वैवाहिक संबंध से मुक्त करने, दोनों संदर्भों के अनुकूल स्वाभाविक तथा गरिमापूर्ण हिंदी है।
theological_decisions:
- issue: क्या पद को तलाक़ देने की आज्ञा माना जाए या विधिक उदाहरण की आरंभिक शर्त
  choice: इसे सशर्त विधिक परिस्थिति के आरंभ के रूप में अनूदित किया गया है, तलाक़ की आज्ञा के रूप में नहीं।
  alternative: इसे इस अर्थ में पढ़ा जा सकता है मानो कुछ परिस्थितियों में पुरुष को तलाक़ देने का निर्देश दिया जा रहा हो।
  rationale: व्यवस्थाविवरण 24:1–4 की वाक्य-रचना में पद 1 से आरंभ हुआ पूर्वपक्ष आगे के पदों तक चलता है और मुख्य विधिक निषेध बाद में आता है। इसलिए अनुवाद लंबी सशर्त संरचना और अंत का अल्पविराम बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण विधिक-कथात्मक शैली अपनाई गई है। वाक्य को स्वतंत्र आदेश न बनाकर अगले पदों तक चलने वाली शर्त के रूप में रखा गया है। ‘तलाक़’ सामान्य आधुनिक हिंदी में व्यापक रूप से समझा जाने वाला विधिक शब्द है; अरबी-फ़ारसी मूल होने पर भी यहाँ सांप्रदायिक अर्थ अभिप्रेत नहीं है।
