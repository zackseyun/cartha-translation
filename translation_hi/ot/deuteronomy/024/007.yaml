  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי יִמָּצֵ֣א אִ֗ישׁ גֹּנֵ֨ב נֶ֤פֶשׁ מֵ/אֶחָי/ו֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הִתְעַמֶּר בּ֖/וֹ וּ/מְכָר֑/וֹ וּ/מֵת֙ הַ/גַּנָּ֣ב הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/007.yaml
  text: If a man is found kidnapping one of his brothers from the sons of Israel[a], and he enslaves him and sells him, then that kidnapper shall die[c][b]. So you shall purge the evil from your midst.
translation:
  language: hi
  text: यदि कोई पुरुष इस्राएलियों में से अपने किसी भाई का अपहरण करता हुआ पाया जाए, और उसे दास बनाकर बेच दे, तो वह अपहरणकर्ता मार डाला जाए। इस प्रकार तुम अपने बीच से बुराई को दूर कर देना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִמָּצֵא
  choice: पकड़ा जाए
  rationale: निफ़अल रूप का निष्क्रिय कानूनी अर्थ ‘पाया/पकड़ा जाए’ है; अपहरण के संदर्भ में ‘पकड़ा जाए’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: इब्रानी एकवचन पुल्लिंग रूप को बनाए रखता है और विधिक शर्त की भाषा में स्वाभाविक है।
- source_word: גֹּנֵב נֶפֶשׁ
  choice: अपहरण करते हुए
  rationale: शाब्दिक अर्थ ‘किसी प्राणी/व्यक्ति को चुराना’ है; इस कानूनी संदर्भ में ‘अपहरण’ उसका स्पष्ट आधुनिक समतुल्य है।
- source_word: מֵאֶחָיו מִבְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों में से अपने किसी भाई का
  rationale: ‘भाई’ की सामुदायिक और वाचागत आत्मीयता सुरक्षित रहती है, जबकि ‘इस्राएलियों में से’ स्पष्ट करता है कि आशय केवल सगा भाई नहीं, बल्कि इस्राएली समुदाय का साथी सदस्य है।
- source_word: וְהִתְעַמֶּר בּוֹ
  choice: उसे दास बनाकर
  rationale: यह दुर्लभ क्रिया इस संदर्भ में अपहृत व्यक्ति को अपने लाभ के लिए दास/संपत्ति की तरह बरतने का भाव देती है; बिक्री के साथ क्रमबद्ध ‘दास बनाकर’ संक्षिप्त और स्पष्ट है।
- source_word: וּמְכָרוֹ
  choice: बेच दे
  rationale: मूल क्रिया और उसके पुरुषवाचक कर्म-प्रत्यय का सीधा, स्वाभाविक अनुवाद है।
- source_word: וּמֵת הַגַּנָּב הַהוּא
  choice: वह अपहरणकर्ता मार डाला जाए
  rationale: इब्रानी का कानूनी मृत्यु-दंड सूत्र है; ‘अपहरणकर्ता’ सामान्य चोर से भेद करते हुए पूर्व अपराध का संदर्भ स्पष्ट करता है।
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: इस प्रकार तुम अपने बीच से बुराई को दूर करना
  rationale: व्यवस्थाविवरण के आवर्ती न्यायिक सूत्र को सहज हिन्दी में रखता है और आदेश की शक्ति बनाए रखता है।
theological_decisions:
- issue: वाचागत भाईचारे की भाषा
  choice: मुख्य पाठ में ‘अपने किसी भाई’ रखा गया
  alternative: ‘किसी साथी इस्राएली’
  rationale: ‘भाई’ मूल की पारिवारिक-सामुदायिक अभिव्यक्ति सुरक्षित रखता है; साथ का वाक्यांश उसके व्यापक इस्राएली संदर्भ को स्पष्ट करता है।
- issue: וְהִתְעַמֶּר בּוֹ में शोषण/दासत्व का अर्थ
  choice: ‘उसे दास बनाकर’
  alternative: ‘उससे अपने लाभ के लिए काम ले’ या ‘उसके साथ स्वामी जैसा व्यवहार करे’
  rationale: क्रिया की कुछ शब्दार्थगत अनिश्चितता है, पर अपहरण और बिक्री का निकट संदर्भ व्यक्ति को संपत्ति या दास की तरह अधीन करने की ओर संकेत करता है; यह अनुवाद उस गंभीरता को नरम नहीं करता।
- issue: मृत्यु-दंड का विधिक विधान
  choice: ‘मार डाला जाए’
  alternative: ‘मर जाए’
  rationale: मूल का अर्थ यहाँ अपराधी की स्वाभाविक मृत्यु नहीं, न्यायिक मृत्यु-दंड है; हिन्दी निष्क्रिय विधिक रूप इसे स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। विधिक शर्त और आदेश का स्वर रखा गया है। ‘इस्राएलियों’ और ‘भाई’ का संयोजन मूल की राष्ट्रीय तथा पारिवारिक दोनों परतें सुरक्षित रखता है।
