  yaml_path: translation/ot/deuteronomy/024/012.yaml
  text: And if he is a poor man[a], you shall not sleep with his pledge.
translation:
  language: hi
  text: और यदि वह गरीब आदमी है, तो उसकी गिरवी रखी वस्तु अपने पास रखकर रात न बिताना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: यह पिछले पद की व्यवस्था को एक शर्त के साथ आगे बढ़ाता है; ‘और यदि’ संयोजक ו और शर्त दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אִישׁ עָנִי הוּא
  choice: वह गरीब आदमी है
  rationale: אִישׁ पुल्लिंग एकवचन ‘आदमी’ है और עָנִי यहाँ आर्थिक अभाव को बताता है; הוּא से व्यक्ति की दशा पर दिया गया बल सुरक्षित रहता है।
- source_word: לֹא תִשְׁכַּב
  choice: रात न बिताना
  rationale: क्रिया का मूल अर्थ ‘लेटना/सोना’ है, पर इस ऋण-विधि के संदर्भ में आशय रात भर गिरवी की वस्तु अपने पास रखने से है। ‘रात न बिताना’ उस समयगत आशय को स्पष्ट और स्वाभाविक बनाता है।
- source_word: בַּעֲבֹטוֹ
  choice: उसकी गिरवी रखी वस्तु अपने पास रखकर
  rationale: עֲבוֹט ऋण की सुरक्षा के लिए ली गई वस्तु है। उपसर्ग בְּ यहाँ उस वस्तु को अपने कब्जे में रखते हुए रात बिताने का भाव देता है; यह अनुवाद हिन्दी में उस कानूनी आशय को स्पष्ट करता है।
