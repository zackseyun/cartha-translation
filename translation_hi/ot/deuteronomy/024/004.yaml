source:
  edition: WLC
  text: לֹא יוּכַ֣ל בַּעְלָ֣/הּ הָ/רִאשׁ֣וֹן אֲשֶֽׁר שִׁ֠לְּחָ/הּ לָ/שׁ֨וּב לְ/קַחְתָּ֜/הּ לִ/הְי֧וֹת ל֣/וֹ לְ/אִשָּׁ֗ה אַחֲרֵי֙ אֲשֶׁ֣ר הֻטַּמָּ֔אָה כִּֽי תוֹעֵבָ֥ה הִ֖וא לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹ֤א תַחֲטִיא֙ אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/004.yaml
  text: her first husband[a], who sent her away, may not take her again to be his wife after she has been defiled, for that is an abomination before Yahweh; and you shall not bring sin upon the land that Yahweh your God is giving you as an inheritance.
translation:
  language: hi
  text: उसका पहला पति, जिसने उसे विदा कर दिया था, उसके अपवित्र हो जाने के बाद[a] लौटकर उसे फिर से अपनी पत्नी के रूप में ग्रहण नहीं कर सकता, क्योंकि ऐसा करना याहवे के सामने घृणित है। इस प्रकार तुम उस देश पर पाप न लाना जिसे याहवे, तुम्हारा परमेश्वर, तुम्हें विरासत में दे रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके अशुद्ध हो जाने के बाद” अथवा “उसके अशुद्ध कर दिए जाने के बाद।” इब्रानी में यह नहीं बताया गया कि यह अपवित्रता ठीक किस प्रकार की है।
    reason: मूल इब्रानी की शब्दार्थगत और व्याख्यात्मक अनिश्चितता को सुरक्षित रखना।
lexical_decisions:
- source_word: בַּעְלָהּ הָרִאשׁוֹן
  choice: उसका पहला पति
  rationale: वैवाहिक प्रसंग में בַּעַל का अर्थ ‘पति’ है; ‘पहला’ बाद के पति के साथ कानूनी अंतर बनाए रखता है।
- source_word: שִׁלְּחָהּ
  choice: उसे विदा कर दिया था
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘भेज देना’ है और यहाँ तलाक का संदर्भ है; ‘विदा कर दिया’ उस शब्दावली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לָשׁוּב לְקַחְתָּהּ לִהְיוֹת לוֹ לְאִשָּׁה
  choice: उसे फिर से अपनी पत्नी बनाने के लिए नहीं ले सकता
  rationale: यह पुनः ग्रहण करके पत्नी बनाने, अर्थात पुनर्विवाह, की मनाही को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַחֲרֵי אֲשֶׁר הֻטַּמָּאָה
  choice: उसके अपवित्र हो जाने के बाद
  rationale: टמא के निष्पन्न कर्मवाच्य भाव को रखते हुए यह वाक्यांश अपवित्रता की ठीक प्रकृति या कारण को निर्धारित नहीं करता।
- source_word: תוֹעֵבָה הִוא לִפְנֵי יְהוָה
  choice: ऐसा करना याहवे के सामने घृणित है
  rationale: ‘घृणित’ वाचा-संबंधी नैतिक गंभीरता व्यक्त करता है और ‘याहवे के सामने’ मूल स्थानवाचक अभिव्यक्ति के निकट है।
- source_word: וְלֹא תַחֲטִיא אֶת הָאָרֶץ
  choice: उस देश को पाप में न डालना
  rationale: हिफ़ील रूप के ‘पाप का कारण बनाना/पाप में डालना’ भाव को सहज हिन्दी में व्यक्त करता है, बिना भूमि के दोष की प्रकृति को अधिक विशिष्ट बनाए।
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: तुम्हें विरासत में दे रहा है
  rationale: नחלה के वाचा और भूमि-संबंधी ‘विरासत’ भाव को आधुनिक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: दूसरे विवाह के बाद स्त्री के ‘अपवित्र’ होने का आशय
  choice: ‘अपवित्र हो जाने’ की व्यापक अभिव्यक्ति को बनाए रखना
  alternative: इसे केवल धार्मिक अशुद्धता, यौन अपवित्रता, या दूसरे विवाह से उत्पन्न कानूनी अयोग्यता के रूप में स्पष्ट करना
  rationale: इब्रानी पाठ טמא के कर्मवाच्य रूप का प्रयोग करता है, पर इस पद में अपवित्रता की सटीक प्रकृति नहीं बताता; इसलिए अनुवाद इस तनाव को खुला रखता है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट ईश्वरीय नाम है; ‘याहवे’ उसका सीधा लिप्यंतरण प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में कानूनी गंभीरता और सामान्य पठनीयता का संतुलन रखा गया है। एकवचन पुरुष-संबोधन ‘तुम’ और भूमि के लिए ‘देश’ का प्रयोग संदर्भानुकूल है। पद-टिप्पणी का संकेत संबंधित धारणा के बजाय वाक्य के अंत में रखा गया है ताकि मुख्य पाठ का प्रवाह सहज रहे।
