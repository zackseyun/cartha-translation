id: DEU.24.18
reference: Deuteronomy 24:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/שָּׁ֑ם עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לַ/עֲשׂ֔וֹת אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/018.yaml
  text: And remember that you were a servant in Egypt, and Yahweh your God redeemed you from there; therefore I am commanding you to do this.
translation:
  language: hi
  text: और याद रख कि तू मिस्र में दास था, और वहाँ से तेरे परमेश्वर यहोवा ने तुझे छुड़ाया था; इसलिए मैं तुझे ऐसा करने की आज्ञा देता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: और याद रख
  rationale: संदर्भ में संयोजक सहित यह रूप निर्देश का कार्य करता है। ‘और’ सरल संबंध बनाए रखता है और ‘याद रख’ स्वाभाविक हिंदी आज्ञार्थ है।
- source_word: כִּי
  choice: कि
  rationale: यह उस तथ्य का परिचय देता है जिसे इस्राएल को याद रखना है; कारणसूचक ‘क्योंकि’ की अपेक्षा विषयवाचक ‘कि’ अधिक उपयुक्त है।
- source_word: עֶבֶד
  choice: दास
  rationale: मिस्र में बंधुआ और पराधीन स्थिति यहाँ प्रमुख है। ‘सेवक’ उसका बल घटा देता; ‘दास’ आधुनिक हिंदी में गरिमापूर्ण और पर्याप्त स्पष्ट है।
- source_word: וַיִּפְדְּךָ
  choice: तुझे छुड़ाया था
  rationale: פדה का अर्थ बंधन से छुड़ाना या मूल्य देकर मुक्त करना है। हिंदी में ‘छुड़ाया’ मुक्ति के भाव को स्वाभाविक रूप से व्यक्त करता है; ‘छुटकारा दिया’ भी संभव है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से नहीं बदला गया। ‘यहोवा’ हिंदी बाइबलीय प्रयोग में परिचित देवनागरी रूप है।
- source_word: אֱלֹהֶיךָ
  choice: तेरे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबंध को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: यह मिस्र की ओर संकेत करने वाला सीधा स्थानवाचक पद है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: इस्राएल की मुक्ति से निकलने वाले नैतिक निष्कर्ष को स्पष्ट और समकालीन हिंदी में व्यक्त करता है।
- source_word: אָנֹכִי מְצַוְּךָ
  choice: मैं तुझे ... आज्ञा देता हूँ
  rationale: स्पष्ट सर्वनाम और कृदंत वर्तमान तथा कुछ बलयुक्त आदेश व्यक्त करते हैं; हिंदी का वर्तमानकालीन वाक्य स्वाभाविक समतुल्य है।
- source_word: לַעֲשׂוֹת אֶת־הַדָּבָר הַזֶּה
  choice: ऐसा करने
  rationale: यह पद ठीक पहले दिए गए विधान की ओर लौटता है। ‘ऐसा करने’ आधुनिक हिंदी में स्वाभाविक है और ‘इस बात को करने’ जैसी असहज शब्दशः अभिव्यक्ति से बचता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। हिंदी पाठकों में प्रचलित नामरूप ‘यहोवा’ चुना गया; ‘याहवे’ अधिक ध्वन्यात्मक विकल्प है।
- issue: मिस्र में इस्राएल की स्थिति के लिए עֶבֶד
  choice: दास
  alternative: सेवक; गुलाम
  rationale: पद में बंधन और पराधीनता नैतिक तर्क का आधार हैं। ‘दास’ इस अर्थ को बनाए रखता है, जबकि ‘सेवक’ उसे नरम कर सकता है और ‘गुलाम’ अपेक्षाकृत बोलचाल का है।
- issue: פדה की मुक्तिकारी धारणा
  choice: छुड़ाया था
  alternative: छुटकारा दिया था; मोल देकर छुड़ाया था
  rationale: ‘छुड़ाया’ दासत्व से मुक्ति को स्पष्ट रखता है, पर मूल में मूल्य चुकाने का ढंग यहाँ स्पष्ट नहीं किया गया; इसलिए ‘मोल देकर’ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। मूसा द्वारा इस्राएल को एकवचन में संबोधित करने के कारण ‘तू/तेरे/तुझे’ रखा गया है। वाक्य का कारणात्मक प्रवाह और स्मरण से आज्ञापालन तक का संबंध सुरक्षित है।
