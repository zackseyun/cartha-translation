review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the exhortative force of וְזָכַרְתָּ, Israel's former status as slaves in Egypt, the inferential force of עַל־כֵּן, and the ongoing authoritative sense of אָנֹכִי מְצַוְּךָ. However, ‘यह बात पूरी करने’ does not naturally render לַעֲשׂוֹת אֶת־הַדָּבָר הַזֶּה; ‘पूरी करना’ normally takes an obligation, task, or promise and is awkward with ‘बात’ here.
  naturalness: ‘इस बात को करने’ is idiomatic modern standard Hindi and retains the broad reference to the preceding instruction without over-specifying it as a command.
  terminology: ‘दास’ appropriately conveys עֶבֶד in the Egyptian context. ‘मिस्र देश’ is acceptable and suitably formal. The revised wording retains ‘बात’ as the broad equivalent of דָּבָר.
  issues:
  - severity: medium
    issue: 'Awkward verb-object collocation: ‘यह बात पूरी करने’'
    rationale: The Hebrew uses the broad verb ‘do’ with ‘this matter/thing.’ In Hindi, ‘बात पूरी करना’ is not a natural expression in this legal context and can suggest finishing a statement rather than carrying out an instruction.
  revised_text: और याद रखना कि तुम मिस्र देश में दास थे; इसलिए मैं तुम्हें इस बात को करने की आज्ञा दे रहा हूँ।
