translation:
  language: hi
  text: और याद रखना कि तुम मिस्र देश में दास थे; इसलिए मैं तुम्हें इस बात को करने की आज्ञा दे रहा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: और याद रखना
  rationale: कानूनी संदर्भ में यह रूप आज्ञा/उपदेश का बल रखता है; ‘और’ पिछले निर्देश से संबंध बनाए रखता है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषय-वस्तु प्रस्तुत करता है जिसे याद रखना है।
- source_word: עֶבֶד
  choice: दास
  rationale: मिस्र के संदर्भ में यह साधारण सेवा नहीं, बंधुआ दासता की स्थिति को व्यक्त करता है।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: इब्रानी के ‘मिस्र की भूमि में’ का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: अतीत की दासता और वर्तमान आज्ञा के बीच निष्कर्षात्मक संबंध स्पष्ट करता है।
- source_word: אָנֹכִי מְצַוְּךָ
  choice: मैं तुम्हें ... आज्ञा दे रहा हूँ
  rationale: स्वतंत्र सर्वनाम और कृदन्तीय रूप के वर्तमान, अधिकारपूर्ण बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַעֲשׂוֹת
  choice: पूरी करने
  rationale: इस संदर्भ में पहले दिए गए निर्देश को व्यवहार में लाने का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: यह बात
  rationale: דבר की व्यापकता बनाए रखते हुए पूर्ववर्ती निर्देश की ओर संकेत करता है; ‘आज्ञा’ कहने से अर्थ अनावश्यक रूप से संकरा हो सकता है।
