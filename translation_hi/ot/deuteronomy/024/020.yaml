base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/020.yaml
  text: When you beat your olive tree[a], you shall not go over it again; it shall be for the sojourner, for the fatherless[c][b], and for the widow.
translation:
  language: hi
  text: जब तुम अपने जैतून के पेड़ को पीटो, तब उसके बचे हुए फल लेने के लिए दोबारा मत जाना[a]; वे परदेशी[b], अनाथ[c] और विधवा के लिए रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पीछे [पेड़ को] फिर से न झाड़ना”; अर्थात पहली बार पेड़ पीटने के बाद बचे जैतून लेने के लिए दूसरी बार न जाना।
    reason: lexical_alternative
  - marker: b
    text: “परदेशी” से आशय इस्राएलियों के बीच रहने वाले गैर-स्थानीय निवासी से है।
    reason: cultural_note
  - marker: c
    text: हिब्रू शब्द का अर्थ “पितृहीन” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: इस विधिक प्रसंग में यह किसी सामान्य परिस्थिति को प्रस्तुत करता है; इसलिए समयसूचक ‘जब’ स्वाभाविक है।
- source_word: תַחְבֹּט
  choice: पीटो
  rationale: क्रिया जैतून गिराने के लिए पेड़ या उसकी डालियों को पीटने की कृषि-क्रिया बताती है।
- source_word: זֵיתְךָ
  choice: अपने जैतून के पेड़
  rationale: זַיִת फल या पेड़ दोनों को सूचित कर सकता है, पर यहाँ पीटने की क्रिया से पेड़ अभिप्रेत है।
- source_word: לֹא תְפָאֵר אַחֲרֶיךָ
  choice: उसके बचे हुए फल लेने के लिए दोबारा मत जाना
  rationale: दुर्लभ क्रिया का यहाँ आशय पहली बार जैतून गिराने के बाद शेष फल लेने हेतु पेड़ पर फिर से हाथ न चलाना है। अनुवाद अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
- source_word: לַגֵּר
  choice: परदेशी
  rationale: यह इस्राएल के बीच रहने वाले गैर-स्थानीय निवासी को दर्शाता है; प्रचलित हिंदी ‘परदेशी’ संक्षिप्त और समझने योग्य है, तथा उसका कानूनी-सामाजिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לַיָּתוֹם
  choice: अनाथ
  rationale: יָתוֹם सामाजिक रूप से असुरक्षित, विशेषतः पितृहीन बच्चे को दर्शाता है; आधुनिक हिंदी में ‘अनाथ’ सबसे स्वाभाविक है।
- source_word: וְלָאַלְמָנָה
  choice: विधवा
  rationale: אַلְמָנָה का मानक और स्पष्ट हिंदी समतुल्य।
- source_word: יִהְיֶה
  choice: वे … के लिए रहें
  rationale: एकवचन हिब्रू क्रिया शेष उपज को इन लोगों के लिए निर्धारित करती है; हिंदी में ‘वे’ निकटवर्ती ‘फल’ के साथ स्वाभाविक सामंजस्य रखता है।
