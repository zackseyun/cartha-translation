base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/019.yaml
  text: When you reap your harvest in your field and forget a sheaf in the field[a], you shall not go back to take it. It shall be for the sojourner, the fatherless, and the widow[b], so that Yahweh your God may bless you in all the work of your hands.
translation:
  language: hi
  text: जब तुम अपने खेत में अपनी फसल काटो और खेत में अनाज का एक पूला भूल जाओ, तो उसे लेने के लिए वापस मत जाना। वह परदेशी[a], अनाथ[b] और विधवा के लिए रहे, ताकि याहवे, तुम्हारा परमेश्वर, तुम्हारे हाथों के हर काम में तुम्हें आशीष दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रवासी” अथवा “परदेशी निवासी।” इब्रानी शब्द ऐसे गैर-स्थानीय व्यक्ति को दर्शाता है जो इस्राएलियों के बीच रहता था।
    reason: lexical_alternative
  - marker: b
    text: या, “पितृहीन”।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תִקְצֹר קְצִירְךָ
  choice: जब तुम अपनी फसल काटो
  rationale: כִּי यहाँ परिस्थितिजन्य व्यवस्था आरम्भ करता है; आधुनिक हिन्दी में ‘जब’ इस विधिक प्रसंग को स्वाभाविक रूप से व्यक्त करता है। ‘फसल काटो’ कटाई की कृषि-छवि बनाए रखता है।
- source_word: עֹמֶר
  choice: अनाज का एक पूला
  rationale: यहाँ शब्द सूखे माप ‘ओमेर’ के लिए नहीं, बल्कि कटे हुए अनाज के बँधे पूले के लिए है। ‘अनाज का एक पूला’ अर्थ को स्पष्ट और प्रसंगानुकूल रखता है।
- source_word: לֹא תָשׁוּב לְקַחְתּוֹ
  choice: उसे लेने के लिए वापस मत जाना
  rationale: यह निषेध लौटने और छूटी हुई वस्तु को उठा लेने—दोनों भावों को सरल आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: לַגֵּר
  choice: परदेशी
  rationale: גֵּר इस्राएल के बीच रहने वाले गैर-स्थानीय निवासी की सामाजिक-विधिक श्रेणी है। ‘परदेशी’ सामान्य पाठक के लिए सुबोध है; अधिक विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: לַיָּתוֹם
  choice: अनाथ
  rationale: ‘अनाथ’ आधुनिक हिन्दी में स्वाभाविक और व्यापक रूप से समझा जाने वाला शब्द है; हिब्रू में सम्भव अधिक विशिष्ट अर्थ ‘पितृहीन’ पादटिप्पणी में सुरक्षित है।
- source_word: יִהְיֶה
  choice: वह ... के लिए रहे
  rationale: यह वाक्यांश पूले को असहाय लोगों के लिए छोड़ देने की व्यवस्था बताता है, बिना स्वामित्व-हस्तांतरण का अनावश्यक तकनीकी अर्थ जोड़े।
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: ताकि ... तुम्हें आशीष दे
  rationale: לְמַעַן के उद्देश्य अथवा अपेक्षित परिणाम के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: גֵּר की सामाजिक-विधिक पहचान
  choice: परदेशी
  alternative: प्रवासी; परदेशी निवासी; अजनबी
  rationale: यह केवल अनजान व्यक्ति नहीं, बल्कि समुदाय के बीच रहने वाला गैर-स्थानीय निवासी है। मुख्य पाठ में सुबोध ‘परदेशी’ रखा गया और उसकी विधिक-सामाजिक बारीकी पादटिप्पणी में स्पष्ट की गई।
- issue: יָתוֹם का दायरा
  choice: अनाथ
  alternative: पितृहीन
  rationale: हिब्रू शब्द विशेषतः पिता-विहीन असुरक्षित बालक को सूचित कर सकता है। सामान्य हिन्दी के लिए ‘अनाथ’ चुना गया, जबकि ‘पितृहीन’ को पादटिप्पणी में वैकल्पिक अर्थ के रूप में रखा गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। विधिक आदेश के लिए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए ‘मत जाना’ प्रयोग किया गया है। मूल की पुनरावृत्ति ‘खेत’ तथा असुरक्षित लोगों की त्रयी को बनाए रखा गया है।
