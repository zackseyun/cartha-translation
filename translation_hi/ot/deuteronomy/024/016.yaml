id: DEU.24.16
reference: Deuteronomy 24:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא יוּמְת֤וּ אָבוֹת֙ עַל בָּנִ֔ים וּ/בָנִ֖ים לֹא יוּמְת֣וּ עַל אָב֑וֹת אִ֥יש בְּ/חֶטְא֖/וֹ יוּמָֽתוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/016.yaml
  text: Fathers shall not be put to death for sons[a], and sons shall not be put to death for fathers[b]; each man shall be put to death for his own sin.
translation:
  language: hi
  text: पुत्रों के कारण पिताओं को मृत्युदंड न दिया जाए, और पिताओं के कारण पुत्रों को मृत्युदंड न दिया जाए; हर एक को उसके अपने पाप के कारण मृत्युदंड दिया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוּמְתוּ / יוּמָתוּ
  choice: मृत्युदंड दिया जाए
  rationale: מות के होफ़अल रूप का अर्थ किसी को मरवा दिया जाना है। इस कानूनी संदर्भ में ‘मृत्युदंड दिया जाए’ न्यायिक दंड को स्पष्ट करता है; केवल ‘मर जाए’ मूल की कारक-कर्मवाच्य शक्ति खो देता।
- source_word: אָבוֹת
  choice: पिताओं
  rationale: इब्रानी संज्ञा विशेष रूप से ‘पिता’ कहती है, सामान्य ‘माता-पिता’ नहीं; इससे मूल का पारिवारिक समानांतर बना रहता है।
- source_word: בָּנִים
  choice: पुत्रों
  rationale: शब्द का शाब्दिक अर्थ ‘पुत्र’ है। यहाँ इसी रूप को रखना मूल की लैंगिक और पारिवारिक शब्दावली को सुरक्षित रखता है।
- source_word: עַל
  choice: के कारण
  rationale: इस विधिक प्रसंग में עַל उस आधार या कारण को बताता है जिसके कारण दंड दिया जाए; ‘के कारण’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אִישׁ
  choice: हर एक
  rationale: אִישׁ यहाँ वितरणात्मक है और प्रत्येक व्यक्ति की निजी जवाबदेही व्यक्त करता है। ‘हर एक’ स्वाभाविक हिन्दी में इस बल को बनाए रखता है, जबकि अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: בְּחֶטְאוֹ
  choice: उसके अपने पाप के कारण
  rationale: בְּ यहाँ दंड के आधार को और प्रत्यय ‘उसके’ को व्यक्त करता है। ‘अपने’ जोड़ने से पहली दो धाराओं के विपरीत व्यक्तिगत अपराध का बल साफ होता है।
theological_decisions:
- issue: मृत्युदंड में व्यक्तिगत दायित्व
  choice: न्यायिक मृत्युदंड किसी व्यक्ति के अपने पाप के आधार पर ही दिया जाए, पिता और पुत्र एक-दूसरे के पाप के लिए दंडित न हों।
  alternative: इसे पीढ़ियों में पाप के सभी प्रकार के परिणामों पर लागू व्यापक कथन मानना।
  rationale: מות के बार-बार आए होफ़अल रूप न्यायिक रूप से मृत्यु दिए जाने की बात करते हैं। पद व्यक्तिगत उत्तरदायित्व का सिद्धांत देता है, पर अनुवाद को उसके प्रत्यक्ष विधिक दायरे से आगे नहीं बढ़ाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक आदेश के लिए ‘न दिया जाए/दिया जाए’ का प्रयोग। भाषा dignified किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल के ‘पिता/पुत्र’ को सुरक्षित रखा गया है; कोई पादटिप्पणी आवश्यक नहीं मानी गई।
