  text: בְּ/יוֹמ/וֹ֩ תִתֵּ֨ן שְׂכָר֜/וֹ וְֽ/לֹא תָב֧וֹא עָלָ֣י/ו הַ/שֶּׁ֗מֶשׁ כִּ֤י עָנִי֙ ה֔וּא וְ/אֵלָ֕י/ו ה֥וּא נֹשֵׂ֖א אֶת נַפְשׁ֑/וֹ וְ/לֹֽא יִקְרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/015.yaml
  text: You shall give him his wages on his day[a], and the sun shall not go down on it, because he is poor and sets his life on it, so that he does not cry out against you to Yahweh, and it becomes sin in you.
translation:
  language: hi
  text: उसकी मजदूरी उसी दिन दे देना—उस मजदूरी पर सूरज न डूबने पाए—क्योंकि वह गरीब है और उसी पर उसका प्राण टिका है।[a] ऐसा न हो कि वह तुम्हारे विरुद्ध याहवे की दोहाई दे और तुम पर पाप ठहरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू का शाब्दिक भाव है, “वह अपना प्राण उसी की ओर उठाए हुए है।” यह मुहावरा बताता है कि जीवन-निर्वाह के लिए वह उस मजदूरी पर अत्यंत निर्भर है।
    reason: हिब्रू मुहावरे की मूल छवि और उसके आशय, दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: בְּיוֹמוֹ
  choice: उसी दिन
  rationale: शाब्दिक अर्थ ‘उसके दिन’ है; इस श्रम-कानून के संदर्भ में स्वाभाविक हिन्दी ‘उसी दिन’ तत्काल भुगतान की मांग स्पष्ट करती है।
- source_word: שְׂכָרוֹ
  choice: उसकी मजदूरी
  rationale: यह कमाए हुए पारिश्रमिक को दर्शाता है; श्रमिक के संदर्भ में ‘मजदूरी’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ
  choice: उस मजदूरी पर सूर्य न डूबने पाए
  rationale: हिब्रू के सूर्य-संबंधी रूपक और भुगतान की सूर्यास्त-सीमा को बनाए रखता है; ‘उस मजदूरी’ कहने से हिन्दी में संकेत स्पष्ट होता है।
- source_word: כִּי עָנִי הוּא
  choice: क्योंकि वह गरीब है
  rationale: यहाँ עָנִי आर्थिक रूप से असुरक्षित व्यक्ति को सूचित करता है; ‘गरीब’ सीधा और सामान्य आधुनिक शब्द है।
- source_word: וְאֵלָיו הוּא נֹשֵׂא אֶת נַפְשׁוֹ
  choice: और उसी पर उसका प्राण टिका है
  rationale: ‘प्राण टिका होना’ मजदूरी पर उसकी अत्यावश्यक निर्भरता व्यक्त करता है और נֶפֶשׁ तथा נשׂא की मूल छवि का कुछ अंश भी बचाए रखता है।
- source_word: וְלֹא יִקְרָא עָלֶיךָ אֶל יְהוָה
  choice: ऐसा न हो कि वह तुम्हारे विरुद्ध याहवे को पुकारे
  rationale: चेतावनी के आशय और उत्पीड़ित मजदूर द्वारा परमेश्वर से न्याय की गुहार, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: וְהָיָה בְךָ חֵטְא
  choice: और यह तुम्हारे लिए पाप ठहरे
  rationale: हिब्रू के ‘तुम्हारे लिए/तुममें पाप होना’ को अनावश्यक रूप से किसी तकनीकी दोष-सिद्धि में बदले बिना स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: यह पद चतुरक्षरीय व्यक्तिगत नाम का प्रयोग करता है; ‘याहवे’ उसका सीधा हिन्दी लिप्यंतरण है और किसी उपाधि को उसके स्थान पर नहीं रखता।
- issue: וְהָיָה בְךָ חֵטְא में पाप और दोष का संबंध
  choice: यह तुम्हारे लिए पाप ठहरे
  alternative: तुम दोषी ठहरो
  rationale: मूल पाठ स्पष्ट रूप से ‘पाप’ कहता है; केवल न्यायिक ‘दोष’ कहने से संभावित धार्मिक-मौतिक व्यापकता संकुचित हो सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और आदेशात्मक विधान-रजिस्टर अपनाया गया है। संबोधन के लिए ‘तुम’ रखा गया है, जो आधुनिक पाठक के लिए स्वाभाविक है; मूल हिब्रू का संबोधन एकवचन है।
