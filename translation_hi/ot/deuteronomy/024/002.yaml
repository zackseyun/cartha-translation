  text: and she leaves his house and goes and becomes another man's wife,[a]
translation:
  language: hi
  text: और वह उसके घर से निकलकर चली जाए और किसी दूसरे पुरुष की पत्नी बन जाए,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “किसी दूसरे पुरुष की हो जाए।” इस प्रसंग में इब्रानी मुहावरे का अर्थ है कि वह किसी दूसरे पुरुष से विवाह कर ले।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצְאָה מִבֵּיתוֹ
  choice: और वह उसके घर से निकलकर
  rationale: יצא מן का अर्थ किसी स्थान से बाहर निकलना है। ‘घर से निकलकर’ इब्रानी के स्थान-वियोग को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהָלְכָה
  choice: चली जाए
  rationale: הלך यहाँ कानूनी प्रसंग की अगली क्रमिक क्रिया बताता है। ‘चली जाए’ अनावश्यक रूप से चलने के ढंग पर बल दिए बिना आगे जाने का भाव देता है।
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: और किसी दूसरे पुरुष की पत्नी बन जाए
  rationale: היה לְ यहाँ नए वैवाहिक संबंध में आने का भाव रखता है। मूल में ‘पत्नी’ शब्द व्यक्त नहीं है, पर प्रसंगगत इब्रानी मुहावरे को हिन्दी में समझने योग्य बनाने के लिए इसे मुख्य पाठ में स्पष्ट किया गया है।
theological_decisions:
- issue: לְאִישׁ אַחֵר में वैवाहिक संबंध की स्पष्टता
  choice: किसी दूसरे पुरुष की पत्नी बन जाए
  alternative: किसी दूसरे पुरुष की हो जाए
  rationale: प्रसंग पुनर्विवाह का है। ‘पत्नी बन जाए’ अर्थ स्पष्ट करता है, जबकि पादटिप्पणी मूल की अधिक शाब्दिक अभिव्यक्ति सुरक्षित रखती है; इससे कोई अतिरिक्त साम्प्रदायिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक क्रम को स्वाभाविक ढंग से रखा गया है। ‘पुरुष’ गरिमापूर्ण और सामान्य शब्द है; वाक्य पिछले पद से जुड़ी शर्त-श्रृंखला होने के कारण ‘और’ से आरम्भ होता है।
