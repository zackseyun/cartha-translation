source:
  edition: WLC
  text: לֹא תִזְבַּח֩ לַ/יהוָ֨ה אֱלֹהֶ֜י/ךָ שׁ֣וֹר וָ/שֶׂ֗ה אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם כֹּ֖ל דָּבָ֣ר רָ֑ע כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/001.yaml
  text: You shall not sacrifice to Yahweh your God an ox or a sheep that has in it a blemish[a], any bad thing, for that is an abomination to Yahweh your God.
translation:
  language: hi
  text: तुम अपने परमेश्वर यहोवा के लिए ऐसा बैल या भेड़ या बकरी[a] बलिदान न चढ़ाना, जिसमें कोई दोष—कोई भी बुरी बात—हो; क्योंकि वह तुम्हारे परमेश्वर यहोवा के लिए घृणित वस्तु है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी שֶׂה छोटे झुंड-पशु के लिए व्यापक शब्द है और भेड़ या बकरी, दोनों में से किसी को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  choice: बलि न करना
  rationale: बलिदान-संबंधी प्रसंग में זבח केवल वध करना नहीं, बल्कि पशु को बलि के रूप में चढ़ाना दर्शाता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ समर्पण अथवा अर्पण का लक्ष्य बताता है; यְהוָה को हिन्दी में प्रचलित नामरूप 'यहोवा' से व्यक्त किया गया है।
- source_word: שׁוֹר
  choice: बैल
  rationale: यह एक गोवंशीय पशु का सामान्य एकवचन है; 'बैल' सहज हिन्दी है और 'साँड़' जैसी अनावश्यक लैंगिक विशिष्टता से बचता है।
- source_word: שֶׂה
  choice: भेड़-बकरी
  rationale: यह इब्रानी शब्द छोटे पालतू झुंड के एक पशु के लिए है और भेड़ अथवा बकरी दोनों को सूचित कर सकता है; संयुक्त हिन्दी पद उसके अर्थ-विस्तार को मुख्य पाठ में सुरक्षित रखता है।
- source_word: מוּם
  choice: दोष
  rationale: बलि के लिए अयोग्य ठहराने वाली शारीरिक त्रुटि के लिए 'दोष' स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: כֹּל דָּבָר רָע
  choice: किसी भी प्रकार की बुरी खामी
  rationale: शाब्दिक अर्थ 'कोई भी बुरी बात/वस्तु' है; यहाँ यह 'दोष' को समानाधिकरण में विस्तार देता है। 'बुरी खामी' मूल की तीव्रता और प्रसंगगत अर्थ दोनों रखती है।
- source_word: תוֹעֲבַת
  choice: घृणित
  rationale: यह शब्द परमेश्वर के सामने अत्यंत अप्रिय और अस्वीकार्य वस्तु को दर्शाता है; 'घृणित' इसकी प्रबलता को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का नाम सीधे प्रयुक्त है। उसे 'प्रभु' से प्रतिस्थापित न करके हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले 'यहोवा' रूप में रखा गया है; 'याहवे' सम्भव वैकल्पिक लिप्यंतरण है।
- issue: כֹּל דָּבָר רָע का दोष से संबंध
  choice: दोष की व्याख्या करने वाला समानाधिकरण
  alternative: दोष से अलग कोई भी बुरी बात
  rationale: वाक्य-विन्यास में यह पद מוּם के बाद आकर उसके आशय का विस्तार करता प्रतीत होता है, पर मूल की व्यापकता बनाए रखने के लिए इसे केवल 'गंभीर दोष' तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा निषेधात्मक विधान। 'बलि न करना', 'दोष' और 'घृणित' सामान्य पाठक के लिए स्पष्ट रहते हुए विधिक-धार्मिक गरिमा बनाए रखते हैं। मुख्य पाठ में 'भेड़-बकरी' स्रोत शब्द की वास्तविक व्यापकता प्रकट करता है; पादटिप्पणी उसे स्पष्ट करती है।
