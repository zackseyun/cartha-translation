source:
  edition: WLC
  text: וְ/לֹ֤א יַרְבֶּה לּ/וֹ֙ נָשִׁ֔ים וְ/לֹ֥א יָס֖וּר לְבָב֑/וֹ וְ/כֶ֣סֶף וְ/זָהָ֔ב לֹ֥א יַרְבֶּה לּ֖/וֹ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/017.yaml
  text: And he shall not multiply wives for himself[a], lest his heart turn away; and he shall not greatly multiply silver and gold for himself.
translation:
  language: hi
  text: और वह अपने लिए बहुत-सी पत्नियाँ न रखे, कहीं ऐसा न हो कि उसका मन फिर जाए[a]; और वह अपने लिए चाँदी और सोना बहुत अधिक जमा न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी को इस प्रकार भी समझा जा सकता है: “और उसका मन न फिर जाए।” इस स्थिति में यह पिछले निषेध की चेतावनी या उसके कारण को बताने के बजाय एक समानांतर निषेध होगा।'
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְבֶּה
  choice: बहुत-सी ... न रखे / बहुत अधिक जमा न करे
  rationale: हिफ़ील रूप यहाँ संख्या या संचय को अत्यधिक बढ़ाने का भाव देता है। पत्नियों के साथ ‘बहुत-सी ... रखना’ और धन के साथ ‘बहुत अधिक जमा करना’ आधुनिक हिन्दी में स्वाभाविक हैं तथा दोनों निषेधों में अति का भाव बनाए रखते हैं।
- source_word: נָשִׁים
  choice: पत्नियाँ
  rationale: राजा से संबंधित इस वैधानिक प्रसंग में इसका अर्थ वैवाहिक स्त्रियाँ है, सामान्यतः स्त्रियाँ नहीं।
- source_word: יָסוּר
  choice: फिर जाए
  rationale: סור के मुड़ने या हट जाने के रूपक को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है; मूल में न दिए गए लक्ष्य, जैसे ‘यहोवा से’, को नहीं जोड़ता।
- source_word: לְבָבוֹ
  choice: उसका मन
  rationale: हिन्दी में ‘मन फिर जाना’ इच्छा, निष्ठा और आंतरिक रुझान के बदलने का स्वाभाविक मुहावरा है और यहाँ हृदय के इब्रानी भाव को स्पष्ट करता है।
- source_word: כֶּסֶף וְזָהָב
  choice: चाँदी और सोना
  rationale: दोनों ठोस संज्ञाओं और उनकी पारंपरिक जोड़ी को ज्यों का त्यों बनाए रखता है।
- source_word: מְאֹד
  choice: बहुत अधिक
  rationale: तीव्रता और अत्यधिक संचय के निषेध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא ... וְלֹא ... לֹא
  choice: न रखे ... कहीं ऐसा न हो कि ... न करे
  rationale: कानूनी निषेधों के बीच मध्य खंड को संभावित चेतावनी/परिणाम के रूप में व्यक्त करता है, जबकि वैकल्पिक समन्वयी पाठ को पादटिप्पणी में सुरक्षित रखता है।
theological_decisions:
- issue: बहुत-सी पत्नियाँ रखने और मन फिर जाने के बीच संबंध
  choice: 'मध्य खंड को पहले निषेध के संभावित परिणाम की चेतावनी के रूप में प्रस्तुत किया गया: ‘कहीं ऐसा न हो कि उसका मन फिर जाए।’'
  alternative: ‘और उसका मन न फिर जाए’—एक समानांतर निषेध के रूप में।
  rationale: इब्रानी वाक्य-विन्यास चेतावनी/परिणाम तथा समन्वयी निषेध, दोनों की संभावना देता है। मुख्य पाठ में प्रसंगानुकूल चेतावनी रखी गई है और वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में दी गई है; मन किससे फिरेगा, यह जोड़कर पाठ को संकीर्ण नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट कानूनी स्वर। ‘मन फिर जाए’ स्वाभाविक हिन्दी मुहावरा है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में रखा गया है।
