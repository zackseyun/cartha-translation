source:
  edition: WLC
  text: לְ/בִלְתִּ֤י רוּם לְבָב/וֹ֙ מֵֽ/אֶחָ֔י/ו וּ/לְ/בִלְתִּ֛י ס֥וּר מִן הַ/מִּצְוָ֖ה יָמִ֣ין וּ/שְׂמֹ֑אול לְמַעַן֩ יַאֲרִ֨יךְ יָמִ֧ים עַל מַמְלַכְתּ֛/וֹ ה֥וּא וּ/בָנָ֖י/ו בְּ/קֶ֥רֶב יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/020.yaml
  text: so that his heart may not be lifted up above his brothers[a], and so that he may not turn aside from the commandment to the right or to the left, in order that he may prolong his days in his kingdom, he and his sons, in the midst of Israel.
translation:
  language: hi
  text: जिससे उसका मन अपने भाइयों[a] से ऊपर न उठे और वह आज्ञा से दाईं या बाईं ओर न हटे, ताकि वह और उसके पुत्र इस्राएल के बीच अपने राज्य पर बहुत दिनों तक बने रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने साथी इस्राएलियों।” इब्रानी में “अपने भाइयों” है—यह वाचा-समुदाय की पारिवारिक भाषा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי רוּם לְבָבוֹ
  choice: जिससे उसका मन ... ऊँचा न हो
  rationale: यह प्रयोजन/निवारण को व्यक्त करता है और हृदय के घमंड से ऊँचा होने के इब्रानी मुहावरे को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: מֵאֶחָיו
  choice: अपने भाइयों से
  rationale: शाब्दिक संबंध ‘उसके भाइयों से/ऊपर’ है; ‘भाइयों’ से वाचा-समुदाय की पारिवारिक भाषा सुरक्षित रहती है।
- source_word: סוּר מִן הַמִּצְוָה יָמִין וּשְׂמֹאול
  choice: आज्ञा से न दाएँ मुड़े, न बाएँ
  rationale: आज्ञापालन से किसी भी दिशा में विचलित होने का मूल रूपक और एकवचन ‘आज्ञा’ दोनों सुरक्षित हैं।
- source_word: לְמַעַן יַאֲרִיךְ יָמִים
  choice: ताकि ... बहुत दिनों तक बने रहें
  rationale: इब्रानी ‘दिन लम्बे करना’ यहाँ राजकीय स्थायित्व का परिणाम बताता है; हिन्दी में ‘बहुत दिनों तक’ अर्थ को स्वाभाविक रूप से संप्रेषित करता है।
- source_word: עַל מַמְלַכְתּוֹ
  choice: अपने राज्य पर
  rationale: עַל के साथ מַמְלָכָה राजकीय शासन/राजत्व पर बने रहने को सूचित करता है; ‘राज्य पर’ मूल संबंध को ‘राज्य में’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: הוּא וּבָנָיו
  choice: वह और उसके पुत्र
  rationale: ‘पुत्र’ मूल के स्पष्ट पुल्लिंग बहुवचन और राजवंशीय उत्तराधिकार को सुरक्षित रखता है।
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: इस्राएल के बीच
  rationale: समुदाय के मध्य राजकीय निरंतरता के इब्रानी स्थानवाचक मुहावरे को निकट और सुबोध हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: राजकीय व्यवस्था में लिंगयुक्त पारिवारिक भाषा
  choice: भाइयों
  alternative: संगी इस्राएलियों
  rationale: मूल में ‘भाइयों’ है और यह वाचा-समुदाय की पारिवारिक भाषा है; व्यापक सामुदायिक संकेत को पादटिप्पणी स्पष्ट करती है, मुख्य पाठ उसे निरपेक्ष नहीं बनाता।
- issue: राजवंशीय प्रतिज्ञा का शब्दांकन
  choice: वह और उसके पुत्र
  alternative: वह और उसके वंशज
  rationale: मूल विशेष रूप से ‘पुत्रों’ का उल्लेख करता है; ‘वंशज’ अर्थ का विस्तार कर देता।
- issue: राज्य की दीर्घता—राजा या राजा और पुत्रों के साथ क्रियात्मक मेल
  choice: वह और उसके पुत्र ... बहुत दिनों तक बने रहें
  alternative: वह अपने राज्य में अपने और अपने पुत्रों के दिन लम्बे करे
  rationale: इब्रानी एकवचन क्रिया के बाद ‘वह और उसके पुत्र’ आता है, जिससे वाक्य-संबंध में कुछ तनाव है। हिन्दी में बहुवचन क्रिया वाक्य को बोधगम्य बनाती है और राजवंशीय निरंतरता को व्यक्त करती है, बिना इसे व्यक्तिगत दीर्घायु मात्र तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य-पाठक-सुलभ रूप रखा गया है। ‘मन ऊँचा होना’ और ‘दाएँ-बाएँ मुड़ना’ जैसे बाइबलीय रूपक स्वाभाविक हिन्दी में सुरक्षित रखे गए हैं।
