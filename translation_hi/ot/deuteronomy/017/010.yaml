source:
  edition: WLC
  text: וְ/עָשִׂ֗יתָ עַל פִּ֤י הַ/דָּבָר֙ אֲשֶׁ֣ר יַגִּ֣ידֽוּ לְ/ךָ֔ מִן הַ/מָּק֣וֹם הַ/ה֔וּא אֲשֶׁ֖ר יִבְחַ֣ר יְהוָ֑ה וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת כְּ/כֹ֖ל אֲשֶׁ֥ר יוֹרֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/010.yaml
  text: You shall act according to the word that they declare to you from that place which Yahweh will choose[a], and you shall be careful to do according to all that they instruct you.
translation:
  language: hi
  text: तुम उस निर्णय[a] के अनुसार कार्य करना जो वे तुम्हें उस स्थान से बताएँगे जिसे याहवे चुनेगा; और वे तुम्हें जो कुछ निर्देश दें, उसके अनुसार सब कुछ करने में सावधान रहना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस वचन के अनुसार।” इब्रानी दावार (דָּבָר) का अर्थ “वचन,” “मामला,” या न्यायिक संदर्भ में “निर्णय” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ עַל פִּי הַדָּבָר
  choice: जो निर्णय...उसी के अनुसार कार्य करना
  rationale: עשה के कानूनी निर्देशात्मक बल को ‘कार्य करना’ व्यक्त करता है। עַל־פִּי הַדָּבָר न्यायिक संदर्भ में घोषित निर्णय के अनुसार आचरण को दर्शाता है।
- source_word: יַגִּידוּ לְךָ
  choice: वे तुम्हें...सुनाएँ
  rationale: नגד के हिफ़ील रूप में औपचारिक रूप से बताने या घोषित करने का भाव है; न्यायिक निर्णय के लिए ‘सुनाएँ’ स्वाभाविक हिंदी है।
- source_word: מִן הַמָּקוֹם הַהוּא אֲשֶׁר יִבְחַר יְהוָה
  choice: उस स्थान से...जिसे यहोवा चुनेगा
  rationale: मूल के स्थान-सूचक वाक्यांश और व्यवस्थाविवरण के भविष्याभिमुख יבחר को बनाए रखता है; יְהוָה को व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: सावधानी से पालन करना
  rationale: שׁמר + infinitive सावधान और निष्ठापूर्ण अनुपालन बताता है; हिंदी में ‘सावधानी से पालन करना’ स्पष्ट और स्वाभाविक है।
- source_word: כְּכֹל אֲשֶׁר יוֹרוּךָ
  choice: जो कुछ वे तुम्हें निर्देश दें, उस सबका
  rationale: כְּכֹל व्यापक अनुरूपता व्यक्त करता है और ירה का हिफ़ील यहाँ अधिकारपूर्ण कानूनी निर्देश को दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है, इसलिए उपाधि ‘प्रभु’ के स्थान पर हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- issue: דָּבָר का न्यायिक अर्थ
  choice: निर्णय
  alternative: वचन
  rationale: निकटवर्ती प्रसंग कठिन न्यायिक मामले और अधिकृत निर्णय का है। फिर भी शब्द का व्यापक अर्थ ‘वचन/बात’ हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का स्पष्ट, गरिमापूर्ण और विधिक-निर्देशात्मक रूप। एकवचन संबोधन को ‘तुम’ से रखा गया है। मुख्य पाठ में स्वाभाविक हिंदी के लिए ‘निर्णय’ चुना गया और मूल की शब्दगत व्यापकता पादटिप्पणी में दी गई है।
