source:
  edition: WLC
  text: עַל פִּ֣י שְׁנַ֣יִם עֵדִ֗ים א֛וֹ שְׁלֹשָׁ֥ה עֵדִ֖ים יוּמַ֣ת הַ/מֵּ֑ת לֹ֣א יוּמַ֔ת עַל פִּ֖י עֵ֥ד אֶחָֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/006.yaml
  text: On the testimony of two witnesses or three witnesses[a], the one to die shall be put to death[b]; he shall not be put to death on the testimony of one witness.
translation:
  language: hi
  text: दो गवाहों या तीन गवाहों की गवाही पर[a] मृत्युदण्ड के योग्य व्यक्ति को मृत्युदण्ड दिया जाए[b]; केवल एक गवाह की गवाही पर उसे मृत्युदण्ड न दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘दो गवाहों या तीन गवाहों के मुँह पर।’ यह इब्रानी मुहावरा विधिक गवाही या साक्ष्य को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘जिसे मृत्युदण्ड दिया जाना है’; अर्थात वह व्यक्ति जो मृत्युदण्ड का पात्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: की गवाही पर
  rationale: शाब्दिक अर्थ ‘के मुँह पर’ है, पर यह न्यायिक साक्ष्य के लिए इब्रानी मुहावरा है। ‘की गवाही पर’ आधुनिक हिन्दी में स्वाभाविक और विधिक अर्थ में स्पष्ट है।
- source_word: שְׁנַיִם עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: दो गवाहों या तीन गवाहों
  rationale: इब्रानी में दोनों संख्याओं के साथ ‘गवाह’ दोहराया गया है। हिन्दी में यह पुनरावृत्ति मूल की औपचारिक कानूनी शैली को बनाए रखती है।
- source_word: יוּמַת
  choice: मार डाला जाए
  rationale: מות का होफ़अल रूप कारक-निष्क्रिय है और न्यायिक रूप से प्राणदण्ड दिए जाने को व्यक्त करता है, केवल मरने को नहीं।
- source_word: הַמֵּת
  choice: मृत्युदण्ड के योग्य व्यक्ति
  rationale: संज्ञीकृत कृदन्त यहाँ उस अभियुक्त को सूचित करता है जो प्राणदण्ड का पात्र ठहरता है, न कि पहले से मृत व्यक्ति को। यह हिन्दी रूप अर्थ स्पष्ट करता है, यद्यपि इब्रानी की संक्षिप्तता को थोड़ा खोलता है।
- source_word: לֹא יוּמַת
  choice: उसे न मारा जाए
  rationale: उसी निष्क्रिय क्रिया के निषेध को हिन्दी के स्वाभाविक विधिक निषेध में व्यक्त किया गया है।
- source_word: עֵד אֶחָד
  choice: केवल एक गवाह
  rationale: ‘एक गवाह’ मूल का सीधा अर्थ है; ‘केवल’ जोड़ने से हिन्दी में एकमात्र गवाह के अपर्याप्त होने का निषेध स्वाभाविक रूप से स्पष्ट होता है।
theological_decisions:
- issue: प्राणदण्ड संबंधी व्यवस्था में הַמֵּת का संदर्भ और बल
  choice: यह उस व्यक्ति को सूचित करता है जो मृत्युदण्ड के योग्य है।
  alternative: ‘जिसे मरना है’ या ‘मृत व्यक्ति’
  rationale: पद प्राणदण्ड लागू करने के लिए आवश्यक साक्ष्य का मानदण्ड देता है। ‘मृत व्यक्ति’ प्रसंग से मेल नहीं खाता; ‘जिसे मरना है’ मूल की अनिश्चित संक्षिप्तता के निकट है, पर हिन्दी में भाग्य-निर्धारण जैसा लग सकता है। ‘मृत्युदण्ड के योग्य व्यक्ति’ न्यायिक संदर्भ स्पष्ट करता है, बिना यह कहे कि दण्ड पहले ही दिया जा चुका है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक शैली रखी गई है। ‘गवाही पर’ न्यायिक मुहावरे को स्वाभाविक बनाता है; ‘मार डाला जाए’ निष्क्रिय न्यायिक क्रिया को स्पष्ट करता है। मूल की पुनरावृत्ति ‘दो गवाहों या तीन गवाहों’ में सुरक्षित है।
