source:
  edition: WLC
  text: כִּֽי תָבֹ֣א אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֣בְתָּה בָּ֑/הּ וְ/אָמַרְתָּ֗ אָשִׂ֤ימָה עָלַ/י֙ מֶ֔לֶךְ כְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר סְבִיבֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/014.yaml
  text: When you come into the land that Yahweh your God is giving you[a], and you take possession of it and live in it, and you say, “I will set a king over myself, like all the nations that are around me,”
translation:
  language: hi
  text: जब तुम उस देश में पहुँचो जिसे तुम्हारा परमेश्वर याहवे तुम्हें दे रहा है, और उस पर अधिकार करके उसमें बस जाओ, और कहो, “मैं अपने ऊपर एक राजा नियुक्त करूँगा[a], अपने चारों ओर के सब राष्ट्रों की तरह,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपने ऊपर एक राजा ठहराऊँगा।” इब्रानी में शाब्दिक रूप से, “मैं अपने ऊपर एक राजा रखूँगा।”
    reason: שׂים के ‘रखना/स्थापित करना’ अर्थ और עָלַי (‘मेरे ऊपर’) की संरचना को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: जब तुम…पहुँचो
  rationale: यहाँ כִּי भावी परिस्थिति का कालवाचक उपवाक्य आरम्भ करता है। ‘जब’ अपेक्षित भावी स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘पहुँचो’ देश में आने/प्रवेश करने का भाव देता है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: व्यवस्थाविवरण के प्रसंग में यह इस्राएल को दिए जाने वाले निश्चित देश को दर्शाता है। ‘उस देश’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; इसलिए इसे किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: यह दूसरे पुरुष एकवचन प्रत्यय के साथ सीधा वाचाई सम्बोधन है।
- source_word: נֹתֵן לָךְ
  choice: तुम्हें दे रहा है
  rationale: वर्तमान कृदन्त परमेश्वर के जारी अथवा निकट भविष्य में सुनिश्चित कार्य का भाव रखता है; ‘दे रहा है’ उस पक्ष को बनाए रखता है।
- source_word: וִירִשְׁתָּהּ
  choice: उस पर अधिकार करके
  rationale: भूमि के प्रसंग में ירשׁ का अर्थ उसे अपने अधिकार में लेना है। यह अनुवाद आधुनिक पाठक के लिए ‘उत्तराधिकार पाने’ की सम्भावित भ्रामक धारणा से बचता है।
- source_word: וְיָשַׁבְתָּה בָּהּ
  choice: उसमें बस जाओ
  rationale: ישׁב यहाँ स्थायी रूप से बसने और रहने को दर्शाता है; ‘बस जाओ’ दोनों भावों को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאָמַרְתָּ
  choice: और कहो
  rationale: यह कानूनी-भावी परिदृश्य में अगली क्रमिक क्रिया है और दूसरे पुरुष एकवचन सम्बोधन को बनाए रखता है।
- source_word: אָשִׂימָה עָלַי מֶלֶךְ
  choice: मैं अपने ऊपर एक राजा नियुक्त करूँगा
  rationale: שׂים का अर्थ रखना, ठहराना या नियुक्त करना हो सकता है। ‘नियुक्त करूँगा’ राजकीय पद स्थापित करने का अर्थ स्पष्ट करता है, जबकि ‘अपने ऊपर’ עָלַי की आत्म-सन्दर्भी संरचना बनाए रखता है।
- source_word: כְּכָל הַגּוֹיִם אֲשֶׁר סְבִיבֹתָי
  choice: अपने चारों ओर के सब राष्ट्रों की तरह
  rationale: यह पड़ोसी राष्ट्रों से तुलना करता है। ‘राष्ट्रों’ से बाद के धार्मिक अर्थ वाला ‘अन्यजातियों’ शब्द नहीं आता, और उद्धृत वक्ता का प्रथम-पुरुष दृष्टिकोण सुरक्षित रहता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल इब्रानी में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रचलित विद्वत्तापूर्ण उच्चारण के अनुसार प्रस्तुत करता है।
- issue: राजा की माँग का भाव
  choice: कथन को बिना नैतिक टिप्पणी के भावी इच्छा के रूप में रखना
  alternative: इसे यहीं स्पष्ट रूप से आज्ञा, अनुमति या निन्दा के रूप में प्रस्तुत करना
  rationale: इस पद में लोग केवल यह कहते हैं कि वे आसपास के राष्ट्रों की तरह राजा नियुक्त करेंगे। पाठ की अनुमति और तनाव अगले पदों तथा व्यापक प्रसंग में विकसित होते हैं; इसलिए यहाँ कोई अतिरिक्त धार्मिक निर्णय नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण और सहज शैली अपनाई गई है। ‘तुम’ मूल के दूसरे पुरुष एकवचन सामूहिक सम्बोधन को बनाए रखता है। वाक्य को अगले पद से जुड़ने वाली मूल अपूर्ण संरचना के अनुसार अल्पविराम पर समाप्त किया गया है।
