base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/012.yaml
  text: But the man who acts presumptuously by not listening to the priest who stands there to minister before Yahweh your God[a], or to the judge—that man shall die[c][b]. So you shall purge the evil from Israel.
translation:
  language: hi
  text: परन्तु जो पुरुष उद्दंडता से उस याजक की बात मानने से इनकार करे, जो वहाँ तुम्हारे परमेश्वर यहोवा की सेवा करने के लिए उपस्थित रहता है, या न्यायाधीश की बात मानने से इनकार करे—वह पुरुष मार डाला जाए। इस प्रकार तुम इस्राएल में से बुराई को दूर करोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאִישׁ
  choice: परन्तु जो पुरुष
  rationale: वाव पिछले न्यायिक निर्देश से संबंध जोड़ता है और यहाँ उल्लंघन करने वाले व्यक्ति की ओर विरोधात्मक मोड़ लाता है। אִישׁ के एकवचन पुल्लिंग रूप को ‘पुरुष’ से सुरक्षित रखा गया है।
- source_word: יַעֲשֶׂה בְזָדוֹן
  choice: ढिठाई से काम करते हुए
  rationale: यह पदबंध जानबूझकर किए गए उद्दंड और चुनौतीपूर्ण आचरण को दर्शाता है, न कि अनजाने में हुई चूक को। ‘ढिठाई’ साधारण आधुनिक हिन्दी में इस कानूनी-नैतिक बल को व्यक्त करती है।
- source_word: לְבִלְתִּי שְׁמֹעַ
  choice: बात सुनने से इनकार करे
  rationale: שׁמע का मूल बिंब ‘सुनना’ रखा गया है, जबकि ‘इनकार’ न्यायिक प्रसंग में न मानने की जानबूझकर प्रवृत्ति स्पष्ट करता है।
- source_word: הָעֹמֵד לְשָׁרֶת שָׁם
  choice: जो वहाँ ... सेवा करने के लिए खड़ा रहता है
  rationale: सहभागी रूप याजक की स्थापित आधिकारिक भूमिका बताता है। ‘सेवा’ उपासना-संबंधी कार्य के लिए स्वाभाविक हिन्दी है और ‘वहाँ’ मूल पाठ के स्थान-संकेत को रखता है।
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर यहोवा की
  rationale: שרת के कर्म को हिन्दी में संबंधकारक रचना ‘की सेवा’ से स्वाभाविक रूप दिया गया है। व्यक्तिगत दिव्य नाम को ‘यहोवा’ के प्रचलित हिन्दी लिप्यंतरण से व्यक्त किया गया है।
- source_word: אוֹ אֶל הַשֹּׁפֵט
  choice: या न्यायी की बात
  rationale: שֹׁפֵט न्यायिक अधिकारी है; ‘न्यायी’ बाइबलीय हिन्दी में परिचित और अर्थ की दृष्टि से स्पष्ट है। समानांतर वाक्य में ‘बात ... से इनकार करे’ की पूर्ति दोहराकर दोनों अधिकारियों को समान रूप से जोड़ा गया है।
- source_word: וּמֵת הָאִישׁ הַהוּא
  choice: वह पुरुष मार डाला जाए
  rationale: कानूनी प्रसंग में यह मृत्यु-दंड का परिणाम है। ‘मार डाला जाए’ केवल स्वाभाविक मृत्यु के संभावित अर्थ से बचाकर दंडादेश को स्पष्ट करता है।
- source_word: וּבִעַרְתָּ הָרָע מִיִּשְׂרָאֵל
  choice: इस प्रकार तुम इस्राएल में से बुराई को दूर करोगे
  rationale: यह व्यवस्थाविवरण का सूत्रबद्ध सामुदायिक शुद्धि-वाक्य है। ‘दूर करोगे’ आधुनिक हिन्दी में स्वाभाविक है और מן द्वारा सूचित समुदाय में से निष्कासन को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी पाठकों में स्थापित ‘यहोवा’ उसका पहचाना हुआ लिप्यंतरण है; शीर्षक ‘प्रभु’ रखने से नाम और उपाधि का भेद मिट जाता।
- issue: अपराधी के पुल्लिंग एकवचन का रूप
  choice: जो पुरुष ... वह पुरुष
  alternative: जो व्यक्ति / जो कोई
  rationale: मूल में אִישׁ और הָאִישׁ הַהוּא स्पष्ट रूप से पुल्लिंग एकवचन हैं। इसलिए स्रोत का व्याकरणिक रूप बनाए रखा गया है, बिना इस कानूनी सूत्र के अनुप्रयोग पर कोई अतिरिक्त धार्मिक निष्कर्ष आरोपित किए।
- issue: וּמֵת में दंड का स्वरूप
  choice: मार डाला जाए
  alternative: मर जाए / अवश्य मरे
  rationale: आसपास का न्यायिक संदर्भ प्राधिकृत मृत्यु-दंड की ओर संकेत करता है। हिन्दी में ‘मर जाए’ आकस्मिक या स्वाभाविक मृत्यु समझी जा सकती है, इसलिए विधिक आशय को स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘परन्तु’, ‘याजक’, ‘न्यायी’ और ‘इस्राएल’ जैसे परिचित बाइबलीय पद बनाए गए हैं; अत्यधिक संस्कृतनिष्ठ ‘धृष्टतापूर्वक’ के स्थान पर सहज ‘ढिठाई से’ चुना गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
