  text: then you shall bring out to your gates that man or that woman who did this evil thing[a], that man or that woman, and you shall stone them with stones[b], and they shall die.
translation:
  language: hi
  text: तब उस पुरुष या उस स्त्री को, जिसने यह बुरा काम[a] किया है, अपने फाटकों तक बाहर ले आना—उस पुरुष या उस स्त्री को—और उन्हें पत्थरों से मारना, और वे मर जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह बुरा मामला।” इब्रानी शब्द का अर्थ “काम,” “बात” या विधिक प्रसंग में “मामला” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: तब ... बाहर ले आना
  rationale: वाव-संयुक्त पूर्ण क्रिया यहाँ विधिक प्रक्रिया के अगले चरण को बताती है। ‘तब’ क्रम को और ‘बाहर ले आना’ मूल क्रिया की ठोस छवि को बनाए रखता है।
- source_word: הָאִישׁ ... הָאִשָּׁה
  choice: उस पुरुष या उस स्त्री
  rationale: मूल पाठ पुरुष और स्त्री दोनों को स्पष्ट रूप से और दो बार नाम देता है; हिन्दी में भी इस लैंगिक तथा विधिक विशिष्टता को बनाए रखा गया है।
- source_word: אֲשֶׁר עָשׂוּ
  choice: जिसने ... किया हो
  rationale: ‘जिसने’ विकल्पवाची एकवचन ‘पुरुष या स्त्री’ के साथ स्वाभाविक हिन्दी है; ‘किया हो’ आरोप सिद्ध होने के बाद की विधिक स्थिति के अनुकूल है।
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: यह बुरा काम
  rationale: דָּבָר का अर्थ ‘बात/मामला/काम’ हो सकता है। इस प्रसंग में ‘बुरा काम’ सहज है, जबकि ‘बुरा मामला’ विधिक विकल्प के रूप में पादटिप्पणी में दिया गया है।
- source_word: אֶל שְׁעָרֶיךָ
  choice: अपने नगर के फाटक पर
  rationale: ‘फाटक’ मूल की ठोस सांस्कृतिक छवि रखता है। हिन्दी में एक नगर के सार्वजनिक न्याय-स्थल के लिए एकवचन स्वाभाविक है; इब्रानी बहुवचन अलग-अलग नगरों के फाटकों को सामूहिक रूप से संबोधित करता है।
- source_word: וּסְקַלְתָּם בָּאֲבָנִים
  choice: उन्हें पत्थरों से मारना
  rationale: इब्रानी में साधन ‘पत्थरों से’ स्पष्ट है और बहुवचन कर्म-प्रत्यय भी सुरक्षित रखा गया है; ‘मार डालना’ न कहकर अगली परिणामसूचक उपवाक्य को स्वतंत्र रखा गया है।
- source_word: וָמֵתוּ
  choice: और वे मर जाएँ
  rationale: यह पत्थरवाह के परिणामी मृत्यु-वाक्य को अलग बनाए रखता है और मूल के बहुवचन रूप को अनावश्यक रूप से एकवचन नहीं करता।
theological_decisions:
- issue: विधिक कथन में पुरुष और स्त्री का स्पष्ट उल्लेख
  choice: उस पुरुष या उस स्त्री
  alternative: उस व्यक्ति को
  rationale: मूल पाठ दोनों लिंगों को स्पष्ट रूप से नाम देता है; लिंग-निरपेक्ष ‘व्यक्ति’ उस जोर को मिटा देता।
- issue: नगर के फाटक का न्यायिक अर्थ
  choice: अपने नगर के फाटक पर
  alternative: सार्वजनिक न्याय-स्थान पर
  rationale: मुख्य पाठ में प्राचीन इस्राएली सांस्कृतिक छवि रखी गई है; उसके न्यायिक कार्य की व्याख्या पादटिप्पणी में है, ताकि अनुवाद व्याख्यात्मक प्रतिस्थापन न बने।
- issue: विकल्पवाची एकवचन के बाद इब्रानी बहुवचन सर्वनाम
  choice: उन्हें ... वे
  alternative: उसे ... वह
  rationale: इब्रानी में ‘पुरुष या स्त्री’ के बाद बहुवचन प्रत्यय और क्रिया आते हैं। हिन्दी में कुछ असामान्यता के बावजूद बहुवचन रखकर पाठ के इस व्याकरणिक तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य विधिक हिन्दी अपनाई गई है। संबोधन के इब्रानी एकवचन को हिन्दी में स्वाभाविक सामुदायिक ‘तुम’ के आशय से व्यक्त किया गया है। मूल की पुनरुक्ति ‘उस पुरुष या उस स्त्री को’ डैशों के बीच सुरक्षित रखी गई है; दंड-विधान को न नरम किया गया है, न अधिक तीखा।
