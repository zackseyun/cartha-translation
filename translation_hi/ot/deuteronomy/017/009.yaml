base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/009.yaml
  text: And you shall come to the Levitical priests and to the judge who is in office in those days[a], and you shall inquire, and they shall declare to you the decision in the case.
translation:
  language: hi
  text: तुम लेवीय याजकों और उस न्यायाधीश के पास जाना जो उन दिनों पद पर हो; उनसे पूछना, और वे तुम्हें न्याय का फैसला[a] बताएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “न्याय का वचन।” इब्रानी अभिव्यक्ति प्रामाणिक न्यायिक निर्णय को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: तुम ... के पास जाना
  rationale: संयुक्त कालरूप यहाँ कानूनी निर्देश देता है। हिंदी में ‘जाना’ आज्ञार्थक भाव को स्वाभाविक ढंग से व्यक्त करता है और अधिकृत न्यायालय की ओर जाने का अर्थ बनाए रखता है।
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: लेवीय याजकों
  rationale: यह पदबंध याजकों को लेवी गोत्र से संबद्ध बताता है; यह अनुवाद सभी लेवियों को याजक ठहराए बिना संस्थागत पहचान सुरक्षित रखता है।
- source_word: הַשֹּׁפֵט
  choice: न्यायी
  rationale: यह न्यायिक अधिकारी को सूचित करता है। ‘न्यायी’ बाइबलीय कानूनी संदर्भ में सीधा और गरिमापूर्ण पदनाम है।
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: उन दिनों पद पर रहने वाले
  rationale: वाक्यांश किसी नामित व्यक्ति के बजाय उस समय कार्यरत पदाधिकारी की ओर संकेत करता है। ‘पद पर रहने वाले’ इस संस्थागत आशय को स्पष्ट करता है।
- source_word: וְדָרַשְׁתָּ
  choice: उनसे पूछना
  rationale: न्यायिक संदर्भ में क्रिया अधिकृत निर्णय या मार्गदर्शन जानने के लिए पूछने को दर्शाती है। बहुवचन ‘उनसे’ याजकों और न्यायी दोनों से संबंध स्पष्ट करता है।
- source_word: וְהִגִּידוּ לְךָ
  choice: तब वे तुम्हें ... बताएँगे
  rationale: हिफ़ील रूप औपचारिक रूप से निर्णय बताने की क्रिया व्यक्त करता है। ‘बताएँगे’ आधुनिक हिंदी में स्वाभाविक है, जबकि संदर्भ उसकी प्रामाणिक न्यायिक प्रकृति स्पष्ट करता है।
- source_word: דְּבַר הַמִּשְׁפָּט
  choice: उस मुकदमे का निर्णय
  rationale: शाब्दिक अर्थ ‘न्याय का वचन/मामला’ है, पर इस संदर्भ में यह विचाराधीन मुकदमे में सुनाए गए प्रामाणिक न्यायिक निर्णय को दर्शाता है।
