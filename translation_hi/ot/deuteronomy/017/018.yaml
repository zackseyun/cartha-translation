source:
  edition: WLC
  text: וְ/הָיָ֣ה כְ/שִׁבְתּ֔/וֹ עַ֖ל כִּסֵּ֣א מַמְלַכְתּ֑/וֹ וְ/כָ֨תַב ל֜/וֹ אֶת מִשְׁנֵ֨ה הַ/תּוֹרָ֤ה הַ/זֹּאת֙ עַל סֵ֔פֶר מִ/לִּ/פְנֵ֥י הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/018.yaml
  text: And when he sits on the throne of his kingdom[a], he shall write for himself in a book a copy of this law[b], from before the Levitical priests.
translation:
  language: hi
  text: और जब वह अपने राज्य के सिंहासन पर बैठे, तब वह इस व्यवस्था की एक प्रति अपने लिए एक पुस्तक में लेवीय याजकों के पास से[a] लिखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “लेवीय याजकों के सामने से।” इसका आशय संभवतः याजकों के समक्ष या उनकी अभिरक्षा में रखे किसी अधिकृत पाठ से है। इब्रानी में “याजक, लेवी” भी समझा जा सकता है।
    reason: मूल वाक्यांश की शाब्दिक अस्पष्टता तथा याजकीय अभिरक्षा के संभावित अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהָיָה כְשִׁבְתּוֹ
  choice: और जब वह ... बैठे
  rationale: इब्रानी विधिक परिस्थिति-वाक्य को स्वाभाविक हिंदी कालवाचक उपवाक्य में व्यक्त करता है; संभावित/निर्देशात्मक प्रसंग के कारण ‘बैठे’ उपयुक्त है।
- source_word: עַל כִּסֵּא מַמְלַכְתּוֹ
  choice: अपने राज्य के सिंहासन पर
  rationale: ‘सिंहासन’ की ठोस राजकीय छवि और ‘उसके राज्य’ का संबंध दोनों बनाए रखता है।
- source_word: וְכָתַב לוֹ
  choice: अपने लिए ... लिखे
  rationale: לוֹ को राजा के अपने उपयोग के लिए लाभार्थक अर्थ में लिया गया है और विधिक आदेश को ‘लिखे’ से व्यक्त किया गया है।
- source_word: מִשְׁנֵה הַתּוֹרָה הַזֹּאת
  choice: इस व्यवस्था की एक प्रति
  rationale: מִשְׁנֵה यहाँ प्रतिलिपि को सूचित करता है; תּוֹרָה के विधिक-वाचा संबंधी संदर्भ में ‘व्यवस्था’ स्वाभाविक और पारंपरिक रूप से स्पष्ट है।
- source_word: עַל סֵפֶר
  choice: एक पुस्तक में
  rationale: संदर्भतः लिखित पुस्तक/ग्रंथ-पट का बोध देता है; ‘पुस्तक में’ आधुनिक पाठक के लिए सहज है, जबकि प्राचीन माध्यम पर अनावश्यक निश्चितता नहीं थोपता।
- source_word: מִלִּפְנֵי
  choice: सामने रखी प्रति से
  rationale: शाब्दिक ‘के सामने से’ हिंदी में अस्पष्ट होगा। प्रसंग में याजकों के सामने अथवा उनकी अभिरक्षा में स्थित अधिकृत नमूने से नकल करने का संभावित अर्थ स्पष्ट किया गया है, और उसकी व्याख्यात्मक प्रकृति पादटिप्पणी में बताई गई है।
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: लेवीय याजकों
  rationale: इब्रानी ‘याजक, लेवी’ के संबंध को स्वाभाविक हिंदी में विशेषणात्मक रूप से व्यक्त करता है।
theological_decisions:
- issue: राजकीय नियम में תּוֹרָה का दायरा
  choice: इस व्यवस्था
  alternative: इस शिक्षा; यह तोराह
  rationale: निकट संदर्भ में राजा के लिए निर्धारित वाचा-विधि का लिखित पाठ अभिप्रेत है। ‘व्यवस्था’ कानूनी संदर्भ को व्यक्त करती है, पर इससे व्यापक ग्रंथ-संग्रह के विषय में अतिरिक्त दावा नहीं किया जाता।
- issue: याजकीय अभिरक्षा से संबंधित מִלִּפְנֵי
  choice: लेवीय याजकों के सामने रखी प्रति से
  alternative: लेवीय याजकों के सामने से; लेवीय याजकों की उपस्थिति में
  rationale: संभावित आशय अधिकृत, याजकीय अभिरक्षा में रखे नमूने से प्रतिलिपि बनाना है। मुख्य पाठ को सुबोध रखते हुए पादटिप्पणी में शाब्दिकता और वैकल्पिक समझ सुरक्षित रखी गई है।
- issue: הַכֹּהֲנִים הַלְוִיִּם का संबंध
  choice: लेवीय याजक
  alternative: याजक, अर्थात् लेवी
  rationale: विशेषणात्मक अनुवाद हिंदी में सहज है; अधिक रूपगत विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण विधिक शैली रखी गई है। ‘बैठे ... लिखे’ आदेशात्मक प्रसंग को स्वाभाविक ढंग से व्यक्त करता है। ‘लेवीय याजक’ सामान्य बाइबलीय शब्दावली है; अस्पष्ट स्रोत-वाक्यांश को पादटिप्पणी सहित सुबोध बनाया गया है।
