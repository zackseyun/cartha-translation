id: DEU.17.11
reference: Deuteronomy 17:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַל פִּ֨י הַ/תּוֹרָ֜ה אֲשֶׁ֣ר יוֹר֗וּ/ךָ וְ/עַל הַ/מִּשְׁפָּ֛ט אֲשֶׁר יֹאמְר֥וּ לְ/ךָ֖ תַּעֲשֶׂ֑ה לֹ֣א תָס֗וּר מִן הַ/דָּבָ֛ר אֲשֶׁר יַגִּ֥ידֽוּ לְ/ךָ֖ יָמִ֥ין וּ/שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/011.yaml
  text: According to the instruction that they give you[a], and according to the judgment that they tell you, you shall do; you shall not turn aside from the word that they declare to you[b], to the right or to the left.
translation:
  language: hi
  text: जो शिक्षा वे तुम्हें दें[a] और जो न्याय-निर्णय वे तुम्हें बताएँ, उनके अनुसार करना। जो बात वे तुम्हें घोषित करें[b], उससे दाएँ या बाएँ न हटना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘व्यवस्था’ अथवा ‘निर्देश’; इब्रानी: तोराह।'
    reason: lexical_alternative
  - marker: b
    text: या ‘वचन’, ‘विषय’ अथवा ‘निर्णय’।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: के अनुसार
  rationale: यह इब्रानी विधिक मुहावरा अनुरूपता और पालन को व्यक्त करता है; इसका शाब्दिक अनुवाद ‘मुँह पर’ हिन्दी में अर्थ स्पष्ट नहीं करता।
- source_word: הַתּוֹרָה
  choice: शिक्षा
  rationale: תּוֹרָה का मूल अर्थ शिक्षा या निर्देश है। इस न्यायिक प्रसंग में यह अधिकारियों द्वारा दिए गए बाध्यकारी निर्देश को दर्शाता है और केवल संहिताबद्ध व्यवस्था तक अर्थ को सीमित नहीं करता।
- source_word: אֲשֶׁר יוֹרוּךָ
  choice: वे तुम्हें दें
  rationale: ירה का हिफ़ील रूप यहाँ निर्देश देने के अर्थ में है; ‘शिक्षा दें’ स्वाभाविक हिन्दी है और स्रोत की क्रिया का आशय रखता है।
- source_word: הַמִּשְׁפָּט
  choice: न्याय-निर्णय
  rationale: מִשְׁפָּט यहाँ न्यायिक निर्णय या फ़ैसले को दर्शाता है। ‘न्याय-निर्णय’ औपचारिक विधिक अर्थ स्पष्ट रखता है।
- source_word: אֲשֶׁר יֹאמְרוּ לְךָ
  choice: वे तुम्हें बताएँ
  rationale: אמר सामान्यतः ‘कहना’ है; निर्णय सुनाने के इस प्रसंग में ‘बताएँ’ सहज आधुनिक हिन्दी है।
- source_word: תַּעֲשֶׂה
  choice: करना
  rationale: यहाँ अपूर्ण क्रिया आज्ञार्थक दायित्व व्यक्त करती है। हिन्दी में ‘करना’ प्रत्यक्ष विधिक आदेश के रूप में स्वाभाविक और दृढ़ है।
- source_word: לֹא תָסוּר
  choice: न मुड़ना
  rationale: סור का अर्थ मुड़ना या हटना है। आगे के दिशासूचक मुहावरे के साथ ‘न मुड़ना’ स्रोत की छवि बनाए रखता है।
- source_word: הַדָּבָר
  choice: बात
  rationale: דָּבָר का अर्थ शब्द, बात, विषय या निर्णय हो सकता है। ‘बात’ इसकी व्यापकता और एकवचन अभिव्यक्ति को बनाए रखती है; न्यायिक संदर्भ उसका अधिकारपूर्ण स्वर स्पष्ट करता है।
- source_word: אֲשֶׁר יַגִּידוּ לְךָ
  choice: वे तुम्हें घोषित करें
  rationale: נגד का हिफ़ील रूप बताने, प्रकट करने या घोषित करने का अर्थ देता है। औपचारिक न्यायिक संदर्भ में ‘घोषित करें’ उपयुक्त है और पिछले ‘बताएँ’ से भेद भी रखता है।
- source_word: יָמִין וּשְׂמֹאל
  choice: न दाएँ ... न बाएँ
  rationale: यह किसी भी दिशा में विचलित न होने का स्थिर मुहावरा है। यह हिन्दी रूप मूल की दिशात्मक छवि को स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: याजकीय और न्यायिक अधिकार के प्रति आज्ञापालन की सीमा
  choice: पद को उस विशेष मामले में दिए गए अधिकारपूर्ण निर्देश और न्याय-निर्णय का पालन करने की आज्ञा के रूप में प्रस्तुत किया गया है।
  alternative: इसे बाद की संस्थाओं के लिए असीमित या अचूक धार्मिक अधिकार का व्यापक दावा मानना।
  rationale: संदर्भ इस्राएल की वाचा-संबंधी न्याय-व्यवस्था है। अनुवाद आज्ञापालन की पूरी शक्ति बनाए रखता है, पर इब्रानी पाठ से परे कोई बाद की संस्थागत धारणा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण, स्पष्ट और विधिक स्वर रखा गया है। ‘शिक्षा दें,’ ‘न्याय-निर्णय’ और ‘घोषित करें’ प्रसंग की औपचारिकता बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य पाठकों के लिए सहज है।
