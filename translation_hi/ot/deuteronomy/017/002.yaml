source:
  edition: WLC
  text: כִּֽי יִמָּצֵ֤א בְ/קִרְבְּ/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ אִ֣ישׁ אוֹ אִשָּׁ֗ה אֲשֶׁ֨ר יַעֲשֶׂ֧ה אֶת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לַ/עֲבֹ֥ר בְּרִיתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/002.yaml
  text: If there is found among you[a], within one of your gates that Yahweh your God is giving you, a man or a woman who does what is evil in the eyes of Yahweh your God by transgressing his covenant[b],
translation:
  language: hi
  text: यदि तुम्हारे बीच, तुम्हारे किसी नगर में[a] जिसे तुम्हारा परमेश्वर यहोवा तुम्हें दे रहा है, कोई पुरुष या स्त्री पाया जाए जो उसकी वाचा का उल्लंघन करके[b] तुम्हारे परमेश्वर यहोवा की दृष्टि में बुराई करे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “तुम्हारे किसी फाटक में”; यहाँ “फाटक” से आशय उस नगर के अधिकार-क्षेत्र से है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसकी वाचा तोड़कर” या “उसकी वाचा का भंग करके।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यहाँ यह शर्तयुक्त कानूनी प्रसंग का आरम्भ करता है; हिन्दी में ‘यदि’ स्वाभाविक और सटीक है।
- source_word: יִמָּצֵא
  choice: पाया जाए
  rationale: निफ़अल रूप के कर्मवाच्य और कानूनी शैली की अनिश्चितता को बनाए रखता है।
- source_word: בְּקִרְבְּךָ
  choice: तुम्हारे बीच
  rationale: समुदाय के भीतर उपस्थित होने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: तुम्हारे किसी नगर में
  rationale: शाब्दिक ‘तुम्हारे किसी फाटक में’ यहाँ लक्षणा से फाटक के अधिकार-क्षेत्र वाले नगर को दर्शाता है; मुख्य पाठ में अर्थ स्पष्ट रखा गया और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: जिसे तुम्हारा परमेश्वर यहोवा तुम्हें दे रहा है
  rationale: चल रही सहभागिता का वर्तमान भाव तथा वाचा-सूत्र दोनों बनाए रखता है।
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: कोई पुरुष या स्त्री
  rationale: इब्रानी के स्पष्ट स्त्री-पुरुष युग्म को सुरक्षित रखता है।
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת־הָרַע
  choice: जो ... बुरा काम करके
  rationale: ‘बुराई करना’ की इब्रानी अभिव्यक्ति को वर्तमान हिन्दी में सहज रूप देता है।
- source_word: בְּעֵינֵי יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर यहोवा की दृष्टि में
  rationale: मूल के मूल्यांकनात्मक रूपक को स्वाभाविक हिन्दी मुहावरे में सुरक्षित रखता है।
- source_word: לַעֲבֹר בְּרִיתוֹ
  choice: उसकी वाचा का उल्लंघन करता हो
  rationale: עבר के सीमा लाँघने/वाचा भंग करने के भाव को व्यक्त करता है और अपराध का विशेष स्वरूप अगले पद के लिए खुला रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा व्यक्त करता है, उसे उपाधि से प्रतिस्थापित नहीं करता।
theological_decisions:
- issue: वाचा के उल्लंघन की प्रकृति
  choice: ‘उसकी वाचा का उल्लंघन करता हो’—उल्लंघन को सामान्य वाचागत श्रेणी में रखा गया है।
  alternative: ‘उसकी वाचा तोड़ता हो’ अथवा ‘उसकी वाचा का अतिक्रमण करता हो।’
  rationale: यह पद अभी विशेष अपराध नहीं बताता; अगला पद उसे स्पष्ट करता है। इसलिए अनुवाद किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। एकवचन सम्बोधन ‘तुम्हारे/तुम्हें’ मूल के सामुदायिक एकवचन को दर्शाता है। वाक्य अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
