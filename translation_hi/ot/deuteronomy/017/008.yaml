  text: כִּ֣י יִפָּלֵא֩ מִמְּ/ךָ֨ דָבָ֜ר לַ/מִּשְׁפָּ֗ט בֵּֽין דָּ֨ם לְ/דָ֜ם בֵּֽין דִּ֣ין לְ/דִ֗ין וּ/בֵ֥ין נֶ֨גַע֙ לָ/נֶ֔גַע דִּבְרֵ֥י רִיבֹ֖ת בִּ/שְׁעָרֶ֑י/ךָ וְ/קַמְתָּ֣ וְ/עָלִ֔יתָ אֶל הַ/מָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/008.yaml
  text: If a matter for judgment is too difficult for you—between bloodshed and bloodshed[a], between one legal claim and another, and between one injury and another[d][c][b], matters of dispute within your gates—then you shall arise and go up to the place that Yahweh your God will choose.
translation:
  language: hi
  text: यदि न्याय के लिए कोई मामला तुम्हारे लिए बहुत कठिन हो—रक्तपात के एक मामले और दूसरे के बीच[a], एक कानूनी दावे और दूसरे के बीच[b], या एक चोट और दूसरी के बीच[c]—अर्थात तुम्हारे फाटकों में विवाद के मामले[d], तो उठकर उस स्थान की ओर ऊपर जाओ जिसे तुम्हारा परमेश्वर याहवे चुनेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “खून और खून के बीच।” इसका आशय रक्तपात या रक्तदोष के एक मामले और दूसरे मामले में भेद करने से है; इनमें हत्या के मामले भी सम्मिलित हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “एक कानूनी मामले और दूसरे के बीच।”
    reason: lexical_alternative
  - marker: c
    text: या, “एक प्रकार की पीड़ा और दूसरी के बीच,” अथवा “एक प्रकार के रोग या प्रकोप और दूसरे के बीच।”
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप से, “तुम्हारे फाटकों में।” प्राचीन इस्राएली नगरों के फाटक स्थानीय न्याय किए जाने के सामान्य स्थान थे।
    reason: cultural_note
lexical_decisions:
- source_word: יִפָּלֵא
  choice: बहुत कठिन हो
  rationale: न्यायिक प्रसंग में निफ़अल रूप उस मामले को दर्शाता है जिसका निर्णय स्थानीय न्यायाधिकारी की क्षमता से बाहर हो; यह स्वाभाविक आधुनिक हिन्दी में उसी भाव को व्यक्त करता है।
- source_word: דָבָר לַמִּשְׁפָּט
  choice: किसी मुकदमे का न्याय करना
  rationale: דָבָר व्यापक रूप से ‘मामला’ और לַמִּשְׁפָּט न्यायिक निर्णय को सूचित करता है। हिन्दी में यह संयोजन कानूनी प्रसंग स्पष्ट करता है।
- source_word: בֵּין דָּם לְדָם
  choice: एक प्रकार के खून-खराबे और दूसरे प्रकार के खून-खराबे के बीच
  rationale: मूल का शाब्दिक चित्र ‘खून और खून के बीच’ है; चुना गया रूप रक्तपात या रक्तदोष से जुड़े विभिन्न मामलों का भेद स्पष्ट करता है, पर उसकी ठोस छवि बनाए रखता है।
- source_word: בֵּין דִּין לְדִין
  choice: एक कानूनी दावे और दूसरे के बीच
  rationale: דִּין का अर्थ दावा, मुकदमा या निर्णय हो सकता है। ‘कानूनी दावा’ इस बहुव्यंजक न्यायिक अर्थ का एक स्वाभाविक हिन्दी निरूपण है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: וּבֵין נֶגַע לָנֶגַע
  choice: एक प्रकार की चोट और दूसरी के बीच
  rationale: נֶגַע चोट, आघात, विपत्ति या रोग-सदृश प्रकोप दर्शा सकता है। न्यायिक सूची में ‘चोट’ सबसे सहज है, जबकि व्यापक विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: דִּבְרֵי רִיבֹת
  choice: विवाद के मामले
  rationale: यह पदबंध झगड़े या प्रतिवाद से उत्पन्न न्यायिक मामलों को दर्शाता है; चुना गया रूप वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: בִּשְׁעָרֶיךָ
  choice: तुम्हारे नगरों में
  rationale: शाब्दिक अर्थ ‘तुम्हारे फाटकों में’ है। नगर-द्वार स्थानीय न्याय के स्थान थे, इसलिए मुख्य पाठ में अर्थ-स्पष्ट ‘नगरों में’ और पादटिप्पणी में सांस्कृतिक छवि दी गई है।
- source_word: וְקַמְתָּ וְעָלִיתָ
  choice: तुम उठकर ... जाना
  rationale: दोनों क्रियाएँ निर्णायक प्रस्थान और चुने हुए केंद्रीय स्थान की ओर जाने का निर्देश देती हैं। ‘उठकर जाना’ स्वाभाविक हिन्दी है; गंतव्य की ओर चढ़ने की शाब्दिक छटा पादटिप्पणी में दी गई है।
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: उस स्थान ... जिसे ... चुनेगा
  rationale: यिक़्तोल रूप व्यवस्थाविवरण की आगे की ओर संकेत करने वाली अभिव्यक्ति के अनुरूप भावी चयन दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय व्यक्तिगत नाम को हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी पाठक-समुदाय में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है; यह नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: נֶגַע का न्यायिक अर्थ
  choice: चोट
  alternative: पीड़ा अथवा रोग/प्रकोप
  rationale: प्रसंग स्थानीय विवादों के निर्णय का है, इसलिए शारीरिक चोट उपयुक्त लगती है; फिर भी मूल शब्द का रोग या विपत्ति संबंधी विस्तार निश्चित रूप से नकारा नहीं जा सकता, अतः विकल्प पादटिप्पणी में है।
