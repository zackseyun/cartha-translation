  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שׂ֣וֹם תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ מִ/קֶּ֣רֶב אַחֶ֗י/ךָ תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ לֹ֣א תוּכַ֗ל לָ/תֵ֤ת עָלֶ֨י/ךָ֙ אִ֣ישׁ נָכְרִ֔י אֲשֶׁ֥ר לֹֽא אָחִ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/015.yaml
  text: You shall surely set over yourself a king whom Yahweh your God chooses[a]. From among your brothers you shall set a king over yourself; you may not put over yourself a foreigner[b], one who is not your brother.
translation:
  language: hi
  text: तुम अपने ऊपर उस व्यक्ति को राजा अवश्य ठहराना जिसे तुम्हारा परमेश्वर यहोवा चुने। अपने भाइयों में से ही किसी को अपने ऊपर राजा ठहराना; तुम अपने ऊपर किसी परदेशी[a] को, जो तुम्हारा भाई नहीं है, राजा ठहराने की अनुमति नहीं रखते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परदेशी” से आशय उस व्यक्ति से है जो इस्राएली समुदाय का सदस्य नहीं है; इब्रानी में शाब्दिक रूप से, “एक परदेशी पुरुष, जो तुम्हारा भाई नहीं है।”
    reason: शाब्दिक रूप और वाचा-संबंधी अर्थ स्पष्ट करना
lexical_decisions:
- source_word: שׂוֹם תָּשִׂים
  choice: अवश्य ठहराना
  rationale: इनफिनिटिव ऐब्सल्यूट और इम्परफेक्ट का मेल आज्ञा पर बल देता है; ‘अवश्य’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָלֶיךָ
  choice: अपने ऊपर
  rationale: एकवचन सम्बोधन सामूहिक इस्राएल को संबोधित करता है और राजा को अपने ऊपर नियुक्त करने का भाव बनाए रखता है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: पद और पुरुषवाचक संज्ञा का सीधा, प्रचलित हिन्दी रूप।
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: जिसे तुम्हारा परमेश्वर यहोवा चुने
  rationale: सम्बन्धवाचक उपवाक्य राजा की पहचान परमेश्वर द्वारा चुने गए व्यक्ति के रूप में करता है; विधिक निर्देश में ‘चुने’ उपयुक्त है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: מִקֶּרֶב אַחֶיךָ
  choice: अपने भाइयों में से ही
  rationale: ‘बीच में से’ के भाव को स्वाभाविक हिन्दी में व्यक्त करते हुए मूल की वाचा-संबंधी रिश्तेदारी की भाषा और प्रतिबंधात्मक बल रखा गया है।
- source_word: לֹא תוּכַל לָתֵת
  choice: ठहरा नहीं सकते
  rationale: शाब्दिक रूप ‘तुम समर्थ नहीं हो’ है, पर विधिक संदर्भ में यह निषेध व्यक्त करता है; हिन्दी में यह रूप दोनों छायाएँ बनाए रखता है।
- source_word: אִישׁ נָכְרִי
  choice: किसी परदेशी को
  rationale: यह स्वाभाविक आधुनिक हिन्दी है और ऐसे बाहरी व्यक्ति का अर्थ देता है जो इस्राएली समुदाय का सदस्य नहीं है।
- source_word: אֲשֶׁר לֹא אָחִיךָ הוּא
  choice: जो तुम्हारा भाई नहीं है
  rationale: व्याख्यात्मक उपवाक्य की रिश्तेदारी-आधारित शब्दावली को सीधे सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि से बदलने के बजाय उसका लिप्यंतरण करता है।
- issue: אַחֶיךָ / אָחִיךָ की लिंगयुक्त रिश्तेदारी भाषा
  choice: भाइयों / भाई
  alternative: अपने लोगों / अपने देशवासी
  rationale: मूल की पुरुषवाचक रिश्तेदारी भाषा को रखा गया है; संदर्भ में इसका आशय इस्राएली समुदाय के सदस्य से है, जिसे पादटिप्पणी स्पष्ट करती है।
- issue: לֹא תוּכַל का विधिक बल
  choice: ठहरा नहीं सकते
  alternative: ठहराना नहीं / ठहराने की अनुमति नहीं है
  rationale: यह रूप मूल की ‘समर्थ न होना’ वाली अभिव्यक्ति को रखते हुए प्रसंगगत निषेध भी संप्रेषित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट विधिक शैली अपनाई गई है। ‘ठहराना’ को नियुक्ति के अर्थ में लगातार रखा गया है और एकवचन ‘तुम’ सामूहिक इस्राएल के मूल सम्बोधन को दर्शाता है।
