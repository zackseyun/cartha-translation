  text: וְ/הָיְתָ֣ה עִמּ֔/וֹ וְ/קָ֥רָא ב֖/וֹ כָּל יְמֵ֣י חַיָּ֑י/ו לְמַ֣עַן יִלְמַ֗ד לְ/יִרְאָה֙ אֶת יְהוָ֣ה אֱלֹהָ֔י/ו לִ֠/שְׁמֹר אֶֽת כָּל דִּבְרֵ֞י הַ/תּוֹרָ֥ה הַ/זֹּ֛את וְ/אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה לַ/עֲשֹׂתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/019.yaml
  text: And it shall be with him[a], and he shall read in it all the days of his life, so that he may learn to fear Yahweh his God, to keep all the words of this law and these statutes[c][b], to do them.
translation:
  language: hi
  text: वह प्रति उसके पास रहे, और वह जीवन भर उसमें पढ़ता रहे, ताकि वह अपने परमेश्वर यहोवा[a] का भय मानना और इस व्यवस्था की सारी बातों तथा इन विधियों को मानना और उन पर चलना सीखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ईश्वरीय नाम יהוה का उच्चारण संभवतः “याहवे” था; हिन्दी बाइबल परंपरा में इसे प्रायः “यहोवा” या “प्रभु” लिखा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיְתָה עִמּוֹ
  choice: वह प्रति उसके पास रहे
  rationale: स्त्रीलिंग क्रिया पिछले पद में उल्लिखित व्यवस्था की प्रति की ओर संकेत करती है। स्पष्टता के लिए निहित संज्ञा ‘प्रति’ दोहराई गई है; ‘उसके पास रहे’ निरंतर उपलब्धता और साथ होने का भाव देता है।
- source_word: וְקָרָא בוֹ
  choice: और वह ... उसमें पढ़ता रहे
  rationale: בּוֹ का शाब्दिक स्थानीय भाव ‘उसमें’ सुरक्षित रखा गया है। अपूर्ण क्रिया और ‘जीवन भर’ के संदर्भ में ‘पढ़ता रहे’ नियमित, निरंतर अभ्यास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל יְמֵי חַיָּיו
  choice: जीवन भर
  rationale: यह मानक हिन्दी मुहावरा सम्पूर्ण जीवनकाल का वही अर्थ संक्षेप और स्वाभाविकता से देता है।
- source_word: לְמַעַן יִלְמַד
  choice: ताकि ... सीखे
  rationale: לְמַעַן उद्देश्य व्यक्त करता है; हिन्दी में ‘ताकि’ इसका सहज समतुल्य है।
- source_word: לְיִרְאָה אֶת יְהוָה אֱלֹהָיו
  choice: अपने परमेश्वर यहोवा का भय मानना
  rationale: ‘भय मानना’ ירא के भय, श्रद्धामय विस्मय और आज्ञाकारी अधीनता के व्यापक वाचाई भाव को खुला रखता है। ‘अपने’ सम्बन्धसूचक प्रत्यय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित और पहचाना जाने वाला व्यक्तिगत नाम-रूप चुना गया है; इसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- source_word: לִשְׁמֹר
  choice: पालन करना
  rationale: विधिक और वाचाई संदर्भ में שׁמר का अर्थ निर्देशों को मानना और व्यवहार में निभाना है; ‘पालन करना’ आधुनिक हिन्दी में सर्वाधिक स्वाभाविक है।
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: इस व्यवस्था की सारी बातें
  rationale: תּוֹרָה को इस विधिक संदर्भ में ‘व्यवस्था’ और דִּבְרֵי को ‘बातें’ कहा गया है, जिससे मूल की व्यापक अभिव्यक्ति बनी रहती है।
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: इन विधियों
  rationale: חֻקִּים के निर्धारित कानूनी प्रावधानों के अर्थ को ‘विधियाँ’ स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: לַעֲשֹׂתָם
  choice: पालन करना
  rationale: शाब्दिक ‘उन्हें करना’ हिन्दी में असहज है। पूर्ववर्ती לִשְׁמֹר और अंतिम לַעֲשֹׂתָם मिलकर सावधानी से मानने और व्यवहार में उतारने का संयुक्त उद्देश्य बताते हैं; एक स्वाभाविक क्रियापद में इसे समेटा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के लिए स्थापित ‘यहोवा’ रूप नाम की विशिष्टता बनाए रखता है; [a] में ‘याहवे’ उच्चारण और ‘प्रभु’ परंपरा बताई गई है।
- issue: वाचाई संदर्भ में ירא का अर्थ
  choice: भय मानना
  alternative: श्रद्धा रखना
  rationale: केवल ‘श्रद्धा’ कहने से वास्तविक भय और विस्मय का पहलू कम हो सकता है। ‘भय मानना’ मूल की धार्मिक और नैतिक गंभीरता तथा उसकी अर्थगत व्यापकता को बनाए रखता है।
- issue: לִשְׁמֹר ... לַעֲשֹׂתָם की द्विस्तरीय अभिव्यक्ति
  choice: ‘पालन करना’ में समेकित
  alternative: ‘मानना और उन पर चलना’
  rationale: मूल में ‘रखना/मानना’ और ‘करना’ दोनों हैं। हिन्दी में शब्दशः पुनरुक्ति बोझिल होती; ‘पालन करना’ दोनों को स्वाभाविक रूप से समेटता है, हालांकि विकल्प अधिक औपचारिक रूप से दोनों क्रियाओं को अलग रख सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘प्रति’ पिछले पद के स्पष्ट संदर्भ को बनाए रखता है। वाक्य की लंबी इब्रानी उद्देश्य-रचना को हिन्दी में एक प्रवाहमान वाक्य के रूप में रखा गया है।
