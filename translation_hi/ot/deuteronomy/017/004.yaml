source:
  edition: WLC
  text: וְ/הֻֽגַּד לְ/ךָ֖ וְ/שָׁמָ֑עְתָּ וְ/דָרַשְׁתָּ֣ הֵיטֵ֔ב וְ/הִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַ/דָּבָ֔ר נֶעֶשְׂתָ֛ה הַ/תּוֹעֵבָ֥ה הַ/זֹּ֖את בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/004.yaml
  text: and it is reported to you[a], and you hear of it, and you investigate thoroughly, and behold, it is true and certain that this abomination has been done in Israel,
translation:
  language: hi
  text: और तुम्हें इसकी सूचना दी जाए और तुम इसके विषय में सुनो, तो भली-भाँति जाँच-पड़ताल करना; और देखो, यह बात सच्ची और पक्की है[a] कि यह घृणित काम इस्राएल में किया गया है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह बात सच्ची और स्थापित है।”
    reason: नָכוֹן का अर्थ ‘पक्का’ या ‘स्थापित’ हो सकता है; न्यायिक संदर्भ में यह मामले के पुष्ट होने का भाव देता है।
lexical_decisions:
- source_word: וְהֻגַּד לְךָ
  choice: और तुम्हें इसकी सूचना दी जाए
  rationale: हुफ़अल रूप सूचना के संबोधित व्यक्ति तक निष्क्रिय रूप से पहुँचाए जाने को व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक रहते हुए उस निष्क्रिय भाव को बनाए रखता है।
- source_word: וְשָׁמָעְתָּ
  choice: और तुम इसके विषय में सुनो
  rationale: שׁמע का मूल अर्थ ‘सुनना’ है; ‘इसके विषय में’ पिछले कथन से निहित विषय को स्पष्ट करता है, नया आशय नहीं जोड़ता।
- source_word: וְדָרַשְׁתָּ הֵיטֵב
  choice: तो अच्छी तरह जाँच-पड़ताल करना
  rationale: न्यायिक प्रसंग में דרש सावधानी से जाँच करने का भाव रखता है और הֵיטֵב उसकी गहनता पर बल देता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह जाँच से सामने आए परिणाम की ओर गंभीरतापूर्वक ध्यान खींचने वाले इब्रानी संकेतक को बनाए रखता है।
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: यह बात सच और पक्की है
  rationale: यह न्यायिक पुष्टि के दोनों पहलुओं—सत्यता और दृढ़तापूर्वक स्थापित होने—को सहज हिन्दी में अलग-अलग बनाए रखता है।
- source_word: נֶעֶשְׂתָה
  choice: किया गया है
  rationale: निष्क्रिय रूप स्थापित करता है कि वह कार्य वास्तव में घटित हो चुका है; हिन्दी का पूर्ण वर्तमान जाँच के वर्तमान परिणाम से उसका संबंध दिखाता है।
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: यह घिनौना काम
  rationale: ‘घिनौना’ תּוֹעֵבָה की तीव्र नैतिक और वाचा-संबंधी निंदा को सामान्य आधुनिक हिन्दी में स्पष्ट रखता है; ‘काम’ यहाँ किए गए निंदनीय कृत्य को दर्शाता है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: यह अपराध को इस्राएल के समुदाय के भीतर घटित बताता है और मूल स्थान-सूचक वाक्यांश को सीधे रूप में प्रस्तुत करता है।
theological_decisions:
- issue: न्यायिक पुष्टि-सूत्र אֱמֶת נָכוֹן הַדָּבָר का अनुवाद
  choice: यह बात सच और पक्की है
  alternative: यह बात सच्ची और प्रमाणित है
  rationale: चुना हुआ पाठ सत्यता और मामले के दृढ़ रूप से स्थापित होने, दोनों को बनाए रखता है। वैकल्पिक पाठ נָכוֹן के न्यायिक ‘प्रमाणित/स्थापित’ भाव को अधिक स्पष्ट करता है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: תּוֹעֵבָה की तीव्रता
  choice: घिनौना काम
  alternative: घृणित काम
  rationale: यह अनुवाद व्यवस्थाविवरण में शब्द की प्रबल नैतिक निंदा को बिना किसी अतिरिक्त सांप्रदायिक व्याख्या के व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और न्यायिक प्रसंग के अनुरूप गरिमापूर्ण रखी गई है। एकवचन संबोधन ‘तुम’ को बनाए रखा गया है। वाक्य अगले पद की ओर बढ़ने वाली मूल अपूर्ण संरचना के कारण अल्पविराम पर समाप्त होता है।
