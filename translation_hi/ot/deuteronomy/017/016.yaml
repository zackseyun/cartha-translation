language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רַק֮ לֹא יַרְבֶּה לּ֣/וֹ סוּסִים֒ וְ/לֹֽא יָשִׁ֤יב אֶת הָ/עָם֙ מִצְרַ֔יְמָ/ה לְמַ֖עַן הַרְבּ֣וֹת ס֑וּס וַֽ/יהוָה֙ אָמַ֣ר לָ/כֶ֔ם לֹ֣א תֹסִפ֗וּ/ן לָ/שׁ֛וּב בַּ/דֶּ֥רֶךְ הַ/זֶּ֖ה עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/016.yaml
  text: Only[a], he must not multiply horses for himself, nor cause the people to return to Egypt in order to multiply horses, since Yahweh has said to you[c][b], ‘You must never return again by this way.’
translation:
  language: hi
  text: केवल वह अपने लिए घोड़ों की संख्या बहुत न बढ़ाए,[a] और घोड़ों की संख्या बढ़ाने के लिए लोगों को मिस्र न लौटाए,[b] क्योंकि याहवे ने तुम लोगों से कहा है, “तुम फिर कभी इस मार्ग से न लौटना।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह अपने लिए घोड़े बहुत न बढ़ाए।” इब्रानी क्रिया का अर्थ बहुत करना या संख्या बढ़ाना है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी क्रिया कारक रूप में है: राजा लोगों को मिस्र लौटने के लिए बाध्य या प्रेरित न करे।'
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “तुम इस मार्ग से लौटने को फिर न बढ़ाना।” यह इब्रानी मुहावरा है, जिसका अर्थ है कि तुम इस मार्ग से फिर कभी न लौटो।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: परन्तु
  rationale: यहाँ यह शब्द राजा के आचरण पर लगाए गए सीमितकारी अपवाद को प्रस्तुत करता है; हिन्दी में वाक्य-संबंध के लिए ‘परन्तु’ स्वाभाविक है।
- source_word: יַרְבֶּה לּוֹ סוּסִים
  choice: वह अपने लिए बहुत-से घोड़े न रखे
  rationale: רבה का अर्थ संख्या बढ़ाना या बहुत करना है। ‘बहुत-से घोड़े न रखे’ आधुनिक हिन्दी में स्वाभाविक है और לּוֹ के आत्महितार्थ भाव को बनाए रखता है।
- source_word: וְלֹא יָשִׁיב אֶת הָעָם מִצְרַיְמָה
  choice: लोगों को मिस्र न लौटाए
  rationale: שוב का हिफ़ील रूप कारक है; राजा को लोगों की मिस्र-वापसी कराने से रोका गया है।
- source_word: לְמַעַן הַרְבּוֹת סוּס
  choice: अधिक घोड़े पाने के उद्देश्य से
  rationale: לְמַעַן उद्देश्य प्रकट करता है। सन्दर्भ में घोड़ों की संख्या बढ़ाना व्यापार या प्राप्ति से जुड़ा है; यह हिन्दी में अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: וַיהוָה
  choice: यहोवा
  rationale: इब्रानी पाठ में वाचा का व्यक्तिगत नाम יהוה है; उसका नामरूप ‘यहोवा’ रखा गया है, न कि सामान्य उपाधि।
- source_word: לֹא תֹסִפוּן לָשׁוּב
  choice: तुम फिर कभी ... न लौटना
  rationale: יסף के साथ क्रिया का यह प्रयोग किसी काम को दोबारा करने की मनाही व्यक्त करता है; ‘फिर कभी न लौटना’ उसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: בַּדֶּרֶךְ הַזֶּה
  choice: इस मार्ग से
  rationale: דֶּרֶךְ यहाँ यात्रा के मार्ग या रास्ते को दर्शाता है; ‘इस मार्ग से’ हिन्दी में सहज है।
- source_word: עוֹד
  choice: फिर कभी
  rationale: यह पुनरावृत्ति की मनाही को बल देता है और निषेध के साथ ‘फिर कभी’ के रूप में स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों में परिचित नामरूप ‘यहोवा’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: मिस्र लौटाने की मनाही का कर्ता
  choice: राजा लोगों को न लौटाए
  alternative: लोग मिस्र न लौटें
  rationale: हिफ़ील क्रियारूप स्पष्टतः कारक है, इसलिए राजा पर लोगों की वापसी कराने की मनाही को बनाए रखा गया है; साथ ही उद्धृत आज्ञा में बहुवचन ‘तुम’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। राजकीय निषेध के लिए ‘न रखे/न लौटाए’ और प्रत्यक्ष उद्धरण में सामूहिक आज्ञा के लिए ‘तुम लोगों’ का प्रयोग किया गया है।
