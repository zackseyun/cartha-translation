  source_fidelity: ‘परन्तु’ does not adequately convey the restrictive force of רַק; ‘केवल’ does. The first prohibition should retain the sense of increasing/multiplying horses, and the purpose clause should preserve that same lexical idea rather than shift to merely acquiring horses. The causative force of the prohibition on causing the people to return to Egypt is retained.
