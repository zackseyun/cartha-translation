    issue: रַק is rendered ‘परन्तु’.
    rationale: रַק introduces a limiting qualification (‘only’), not simply an adversative contrast. ‘केवल’ preserves the source force.
  - severity: medium
    issue: The two occurrences of רבה are rendered with different and partly weakened senses.
    rationale: ‘बहुत-से घोड़े न रखे’ and ‘अधिक घोड़े पाने’ do not clearly preserve the repeated idea of increasing/multiplying horses. The Hebrew deliberately repeats the root.
  - severity: medium
    issue: The draft uses ‘यहोवा’ despite the supplied POB decision specifying Yahweh.
    rationale: For consistency with the audit trail’s stated rendering of יהוה, Hindi should use ‘याहवे’.
  - severity: low
