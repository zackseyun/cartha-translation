source:
  edition: WLC
  text: יַ֣ד הָ/עֵדִ֞ים תִּֽהְיֶה בּ֤/וֹ בָ/רִאשֹׁנָה֙ לַ/הֲמִית֔/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/007.yaml
  text: The hand of the witnesses shall be first against him to put him to death[a], and afterward the hand of all the people[b]. So you shall purge the evil from your midst.
translation:
  language: hi
  text: उसे मार डालने के लिए सबसे पहले गवाहों का हाथ उस पर उठे[a], और उसके बाद सब लोगों का हाथ। इस प्रकार तू अपने बीच से[b] बुराई को दूर कर देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “गवाहों का हाथ ... और सब लोगों का हाथ।” यह कानूनी मुहावरा बताता है कि दंड को कार्यान्वित करने की पहली जिम्मेदारी गवाहों की थी।
    reason: cultural_note
  - marker: b
    text: या, “अपने लोगों में से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד
  choice: हाथ
  rationale: इब्रानी का एकवचन ‘हाथ’ बनाए रखा गया है। यहाँ यह दंड को कार्यान्वित करने की जिम्मेदारी और भागीदारी का कानूनी मुहावरा है।
- source_word: הָעֵדִים
  choice: गवाहों
  rationale: यह शब्द न्यायिक गवाहों को दर्शाता है, केवल आरोप लगाने वालों को नहीं।
- source_word: בּוֹ
  choice: उस पर
  rationale: ‘हाथ उस पर पड़े’ स्वाभाविक हिन्दी मुहावरा है और दंडात्मक कार्रवाई को व्यक्त करता है।
- source_word: בָרִאשֹׁנָה
  choice: सबसे पहले
  rationale: यह कार्रवाई के क्रम में गवाहों की प्राथमिकता स्पष्ट करता है।
- source_word: לַהֲמִיתוֹ
  choice: उसे मार डालने के लिए
  rationale: मूल क्रिया का अर्थ मृत्यु का कारण बनना है; न्यायिक संदर्भ में यह स्पष्ट और सहज हिन्दी है।
- source_word: וְיַד כָּל הָעָם
  choice: और उसके बाद सब लोगों का हाथ
  rationale: इब्रानी की समानांतर रचना और सामुदायिक भागीदारी को बनाए रखते हुए कार्रवाई का क्रम स्पष्ट किया गया है।
- source_word: בָאַחֲרֹנָה
  choice: उसके बाद
  rationale: यह ‘सबसे पहले’ के अनुरूप अगले चरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבִעַרְתָּ
  choice: दूर कर देना
  rationale: व्यवस्थाविवरण के कानूनी सूत्र में क्रिया का आशय समुदाय से बुराई हटाना है, न कि उसे सचमुच जलाना।
- source_word: הָרָע
  choice: बुराई
  rationale: यह सूत्र अपराधी व्यक्ति तक सीमित न होकर समुदाय में उपस्थित बुराई को व्यापक रूप से व्यक्त करता है।
- source_word: מִקִּרְבֶּךָ
  choice: अपने बीच से
  rationale: यह वाचा-समुदाय के भीतर से हटाने का भाव स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: व्यवस्थाविवरण के कानूनी सूत्र וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ का अनुवाद
  choice: इस प्रकार तू अपने बीच से बुराई को दूर कर देना
  alternative: इस प्रकार तू अपने बीच से बुरे व्यक्ति को दूर कर देना
  rationale: इब्रानी में ‘बुराई’ है और सूत्र का आशय किसी व्यक्ति की पहचान मात्र से व्यापक है। चुना हुआ पाठ न्यायपूर्ण दंड के द्वारा समुदाय से बुराई हटाने के कानूनी और धार्मिक बल को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। मूल इब्रानी के एकवचन संबोधन के अनुरूप ‘तू’ रखा गया है। ‘हाथ उस पर पड़े’ से मूल कानूनी मुहावरा हिन्दी में स्वाभाविक ढंग से व्यक्त होता है।
