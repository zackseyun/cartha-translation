  yaml_path: translation/ot/deuteronomy/017/013.yaml
  text: And all the people shall hear and fear[a], and shall not act presumptuously again.
translation:
  language: hi
  text: और सब लोग सुनेंगे और डरेंगे, और फिर कभी धृष्टता से काम नहीं करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘फिर कभी ढिठाई से ऐसा काम नहीं करेंगे’ अथवा ‘फिर कभी उद्दण्डता से व्यवहार नहीं करेंगे।’ इब्रानी क्रिया जानबूझकर की गई अभिमानी और उद्दण्ड अवज्ञा का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָעָם
  choice: तब सब लोग
  rationale: הָעָם का सीधा अर्थ ‘सब लोग’ है; प्रसंग से इस्राएली समुदाय स्पष्ट है, इसलिए ‘इस्राएल’ जोड़ना आवश्यक नहीं। आरंभिक וְ को हिन्दी कानूनी कथन में स्वाभाविक परिणाम-सूचक ‘तब’ से व्यक्त किया गया है।
- source_word: יִשְׁמְעוּ
  choice: सुनेंगे
  rationale: שמע का यहाँ सामान्य अर्थ ‘सुनना’ है—लोग इस न्यायिक दण्ड के विषय में सुनेंगे।
- source_word: וְיִרָאוּ
  choice: और डरेंगे
  rationale: मूल पाठ भय का कोई स्पष्ट कर्म नहीं बताता। ‘डरेंगे’ उसी संक्षिप्तता और अर्थगत खुलेपन को बनाए रखता है।
- source_word: וְלֹא יְזִידוּן
  choice: और ... धृष्टता नहीं करेंगे
  rationale: זיד का हिफ़ईल रूप जानबूझकर की गई अभिमानी, उद्दण्ड अवज्ञा को व्यक्त करता है। आधुनिक हिन्दी में ‘धृष्टता करना’ इस कानूनी प्रसंग में संक्षिप्त और स्वाभाविक है।
- source_word: עוֹד
  choice: फिर कभी
  rationale: עוֹד यहाँ भविष्य में ऐसे आचरण की पुनरावृत्ति न होने का भाव देता है; ‘फिर कभी’ इसे सहज हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: न्याय के कारण उत्पन्न भय का स्वरूप
  choice: ‘डरेंगे’—भय का कर्म अनिर्दिष्ट रखा गया
  alternative: ‘यहोवा से डरेंगे’ अथवा ‘दण्ड से डरेंगे’
  rationale: इब्रानी पाठ यह स्पष्ट नहीं करता कि भय परमेश्वर का है, न्यायिक दण्ड का है, या दोनों का। अनुवाद इस अर्थगत और धर्मवैचारिक खुलेपन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘धृष्टता’ कानूनी प्रसंग की गंभीरता तथा जानबूझकर की गई उद्दण्ड अवज्ञा—दोनों को संक्षेप में व्यक्त करती है।
