base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/003.yaml
  text: and goes and serves other gods and bows down to them[a], or to the sun or to the moon or to all the host of heaven, which I have not commanded[b],
translation:
  language: hi
  text: और वह जाकर दूसरे देवताओं की सेवा करे और उन्हें दण्डवत् करे, या सूर्य को, चन्द्रमा को, या आकाश की सारी सेना को[a]—जिसकी आज्ञा मैंने नहीं दी[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आकाश की सारी सेना’ से आकाशीय पिंडों का पूरा समूह अभिप्रेत हो सकता है; कुछ प्रसंगों में यह अभिव्यक्ति स्वर्गीय प्राणियों का भाव भी जगा सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘जिसकी आज्ञा मैंने नहीं दी’ विशेष रूप से ‘आकाश की सारी सेना’ से जुड़ सकता है, या अधिक व्यापक रूप से दूसरे देवताओं की सेवा और उन्हें दण्डवत् करने की पूरी क्रिया से।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: और वह जाकर
  rationale: विधिक शर्त की जारी क्रिया को हिन्दी में स्वाभाविक रूप से व्यक्त करता है और पिछले पद से वाक्य का संबंध बनाए रखता है।
- source_word: וַיַּעֲבֹד
  choice: सेवा करे
  rationale: ईश्वरीय वस्तु के साथ עבד उपासना-संबंधी सेवा को दर्शाता है; ‘सेवा करे’ मूल शब्द का भाव बचाता है, जबकि अगली क्रिया उपासना की शारीरिक मुद्रा स्पष्ट करती है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह ‘अन्य देवताओं’ का सीधा अर्थ देता है और ‘विदेशी’ जैसा अनुल्लिखित जातीय अर्थ नहीं जोड़ता।
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: उन्हें दण्डवत करे
  rationale: यह झुककर प्रणाम करने की शारीरिक क्रिया को स्पष्ट रखता है और उसे सामान्य ‘उपासना’ में विलीन नहीं करता।
- source_word: וְלַשֶּׁמֶשׁ א֣וֹ לַיָּרֵחַ א֛וֹ לְכָל צְבָ֥א הַשָּׁמַיִם
  choice: चाहे सूर्य को, चन्द्रमा को, या आकाश के समस्त गण को
  rationale: אוֹ...אוֹ की विकल्पसूचक सूची को स्वाभाविक हिन्दी में व्यक्त करता है। ‘गण’ צבא की सामूहिकता बनाए रखता है, बिना उसे केवल तारों या केवल स्वर्गीय प्राणियों तक सीमित किए।
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: जिसकी आज्ञा मैंने नहीं दी
  rationale: ‘आज्ञा नहीं दी’ मूल कथन के निकट है और उसे अधिक स्पष्ट ‘मना किया’ में नहीं बदलता। निकटवर्ती पद से इसका व्याकरणिक संबंध रखते हुए व्यापक संदर्भ की सम्भावना पादटिप्पणी में सुरक्षित की गई है।
theological_decisions:
- issue: अन्तिम सम्बन्धवाचक उपवाक्य אֲשֶׁר לֹא צִוִּיתִי का विस्तार
  choice: मुख्य पाठ में इसे निकटवर्ती ‘आकाश के समस्त गण’ के बाद ‘जिसकी आज्ञा मैंने नहीं दी’ रखा गया है।
  alternative: यह उपवाक्य दूसरे देवताओं की सेवा और उन्हें दण्डवत करने की पूरी क्रिया का सार भी हो सकता है।
  rationale: इब्रानी में उपवाक्य निकटतम संज्ञा-समूह से जुड़ सकता है, पर पूरे मूर्तिपूजक आचरण को भी अस्वीकार कर सकता है। मुख्य पाठ और पादटिप्पणी मिलकर इस वास्तविक अस्पष्टता को बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, विधिक प्रसंग के अनुरूप गम्भीर किन्तु सामान्य पाठक के लिए सुबोध रखी गई है। ‘दण्डवत’ उपासना की शारीरिक मुद्रा को संक्षेप में व्यक्त करता है; विराम-चिह्न विकल्पों की सूची और अन्तिम उपवाक्य को स्पष्ट करते हैं।
