  yaml_path: translation/ot/deuteronomy/015/023.yaml
  text: Only[a], you shall not eat its blood; you shall pour it out on the ground like water.
translation:
  language: hi
  text: परन्तु उसका लहू मत खाना; उसे पानी की तरह भूमि पर उँडेल देना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: केवल
  rationale: यह पिछले पद में दी गई अनुमति पर स्पष्ट प्रतिबंध लगाता है; ‘केवल’ उसके सीमित करने वाले बल को संक्षेप में बनाए रखता है।
- source_word: אֶת דָּמוֹ
  choice: उसका लहू
  rationale: प्रत्यय उस पशु की ओर संकेत करता है। ‘उसका लहू’ स्वाभाविक और मूल के अनुरूप है; ‘जीवन-रक्त’ अनावश्यक व्याख्या जोड़ता।
- source_word: לֹא תֹאכֵל
  choice: न खाना
  rationale: व्यवस्था-संबंधी निषेध को आधुनिक, सहज हिंदी में आज्ञार्थक रूप से व्यक्त करता है।
- source_word: עַל הָאָרֶץ
  choice: भूमि पर
  rationale: इस ठोस प्रसंग में रक्त को धरती/ज़मीन पर बहाने का अर्थ देता है; ‘भूमि’ गरिमापूर्ण और स्पष्ट है।
- source_word: תִּשְׁפְּכֶנּוּ
  choice: उसे … उँडेल देना
  rationale: क्रिया का अर्थ बहाना या उँडेलना है। ‘उँडेल देना’ जानबूझकर भूमि पर डालने की क्रिया को स्वाभाविक रूप में व्यक्त करता है।
- source_word: כַּמָּיִם
  choice: पानी के समान
  rationale: मूल उपमा को सीधे और स्पष्ट रूप में सुरक्षित रखता है।
theological_decisions:
- issue: आहार-विधान में लहू का व्यवहार
  choice: पशु का लहू न खाने और उसे भूमि पर उँडेलने की आज्ञा को सीधे प्रस्तुत किया गया है।
  alternative: ‘जीवन-रक्त’ जैसे शब्द से लहू और जीवन के संबंध को इस पद में ही स्पष्ट करना।
  rationale: व्यापक पंचग्रंथ लहू को जीवन से जोड़ता है, पर यह पद स्वयं वह कारण नहीं बताता; इसलिए अनुवाद में अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। एकवचन संबोधन को हिंदी के आज्ञार्थक रूप में स्वाभाविक रखा गया है।
