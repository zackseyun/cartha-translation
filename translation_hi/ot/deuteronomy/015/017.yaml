source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ אֶת הַ/מַּרְצֵ֗עַ וְ/נָתַתָּ֤ה בְ/אָזְנ/וֹ֙ וּ/בַ/דֶּ֔לֶת וְ/הָיָ֥ה לְ/ךָ֖ עֶ֣בֶד עוֹלָ֑ם וְ/אַ֥ף לַ/אֲמָתְ/ךָ֖ תַּעֲשֶׂה כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/017.yaml
  text: then you shall take the awl and put it through his ear and into the door[a], and he shall be your servant permanently. And you shall do the same for your female servant.
translation:
  language: hi
  text: तब तू सूआ लेकर उसे उसके कान में से द्वार तक घोंपना; और वह स्थायी रूप से[a] तेरा दास रहेगा। तेरी दासी के साथ भी ऐसा ही करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सदा के लिए”; इस कानूनी संदर्भ में हिब्रू का अर्थ “जीवन भर” भी हो सकता है।
    reason: עוֹלָם के दीर्घस्थायी अर्थ और उसके संभावित ‘जीवन भर’ के कानूनी अर्थ को बिना किसी एक व्याख्या को थोपे सुरक्षित रखता है।
lexical_decisions:
- source_word: הַמַּרְצֵעַ
  choice: सूआ
  rationale: यह नुकीले छेदने वाले औज़ार का सटीक और प्रचलित हिन्दी नाम है।
- source_word: וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת
  choice: उसके कान में और द्वार में छेद करना
  rationale: हिब्रू की दोहरे בְ तथा संयोजक וְ वाली रचना को बनाए रखते हुए अनुष्ठानिक क्रिया को स्वाभाविक हिन्दी में स्पष्ट करता है; कान को द्वार से लगाकर छेदना प्रसंग से समझ में आता है।
- source_word: עֶבֶד
  choice: दास
  rationale: यहाँ विधिक रूप से बँधी हुई सामाजिक स्थिति प्रमुख है; ‘सेवक’ उसकी कठोरता को अनावश्यक रूप से हल्का कर सकता है।
- source_word: עוֹלָם
  choice: सदा के लिए
  rationale: यह दीर्घस्थायी और अपरिवर्तनीय विधिक स्थिति व्यक्त करता है; इस प्रसंग में इसका आशय अनिवार्यतः दार्शनिक अनंतता नहीं है।
- source_word: אֲמָתְךָ
  choice: तेरी दासी
  rationale: स्त्री की समान बँधी हुई स्थिति के लिए हिन्दी का पारंपरिक और स्पष्ट शब्द; निकटवर्ती ‘दास’ के साथ संगत है।
- source_word: וְאַף ... תַּעֲשֶׂה כֵּן
  choice: अपनी दासी के साथ भी ऐसा ही करना
  rationale: וְאַף की योगात्मक शक्ति ‘भी’ से और תעשה כן का अर्थ स्वाभाविक हिन्दी मुहावरे से व्यक्त होता है।
theological_decisions:
- issue: इस्राएली दासत्व-विधि में עֶבֶד और אָמָה का अनुवाद
  choice: दास / दासी
  alternative: सेवक / सेविका
  rationale: पद एक विधिक रीति द्वारा स्थायी बंधन स्वीकार करने की बात करता है। ‘दास/दासी’ सामाजिक-विधिक बल को सुरक्षित रखते हैं, बिना इसे आधुनिक दास-प्रथा के हर रूप के पूर्णतः समान घोषित किए।
- issue: עוֹלָם की अवधि
  choice: सदा के लिए
  alternative: जीवन भर / स्थायी रूप से
  rationale: हिब्रू का सामान्य दीर्घकालिक बल बनाए रखा गया है, जबकि इसे दार्शनिक अनंतता के रूप में स्पष्टतः परिभाषित नहीं किया गया। प्रसंगगत ‘जीवन भर’ एक सम्भव व्याख्यात्मक विकल्प है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक शैली रखी गई है। व्यवस्थाविवरण के एकवचन संबोधन को ‘तू/तेरा’ से बनाए रखा गया है। वाक्य को अत्यधिक तकनीकी बनाने के बजाय मूल क्रिया और बँधी हुई स्थिति स्पष्ट रखी गई है।
