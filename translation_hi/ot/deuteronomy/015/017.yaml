review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the awl ritual, bonded status, and corresponding treatment of the female slave. However, “उसके कान में और द्वार में छेद करना” makes the ear and door sound like two separate things to be pierced, rather than expressing that the awl is driven through the ear into the door. “सदा के लिए” can suggest unqualified eternity; in this legal setting עוֹלָם is better conveyed as enduring/permanent status, with its possible ‘for life’ sense noted.
  naturalness: The singular legal address “तू/तेरा” and the formal register are natural for this context. The revised wording makes the physical action intelligible in modern Hindi without unnecessary paraphrase.
  terminology: “सूआ,” “दास,” and “दासी” are suitable, consistent renderings. “स्थायी रूप से” avoids making a metaphysical claim for עוֹלָם while retaining its enduring legal force.
  issues:
  - severity: medium
    issue: The ritual action is phrased as two separate piercings.
    rationale: “कान में और द्वार में छेद करना” does not clearly indicate that the awl passes through the ear into the door, which is the force of the Hebrew construction in context.
  - severity: medium
    issue: “सदा के लिए” may overstate עוֹלָם in this legal context.
    rationale: The term denotes an enduring status, plausibly for life in the legal-social frame, rather than necessarily absolute eternity. A contextual footnote preserves the lexical alternative.
  revised_text: तब तू सूआ लेकर उसे उसके कान में से द्वार तक घोंपना; और वह स्थायी रूप से[a] तेरा दास रहेगा। तेरी दासी के साथ भी ऐसा ही करना।
