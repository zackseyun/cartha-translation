  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/זֶה֮ דְּבַ֣ר הַ/שְּׁמִטָּה֒ שָׁמ֗וֹט כָּל בַּ֨עַל֙ מַשֵּׁ֣ה יָד֔/וֹ אֲשֶׁ֥ר יַשֶּׁ֖ה בְּ/רֵעֵ֑/הוּ לֹֽא יִגֹּ֤שׂ אֶת רֵעֵ֨/הוּ֙ וְ/אֶת אָחִ֔י/ו כִּֽי קָרָ֥א שְׁמִטָּ֖ה לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/002.yaml
  text: 'And this is the matter of the release: every creditor shall release what his hand has lent to his neighbor[a]. He shall not press his neighbor or his brother[b], because a release to Yahweh has been proclaimed.'
translation:
  language: hi
  text: 'ऋण-मुक्ति का नियम यह है: हर लेनदार अपने पड़ोसी को दिया हुआ ऋण छोड़ दे[a]। वह अपने पड़ोसी या अपने भाई[b] से उसे चुकाने की माँग न करे, क्योंकि याहवे के लिए ऋण-मुक्ति की घोषणा की गई है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ऋण-मुक्ति’ के लिए इब्रानी शब्द शमित्ता है, जिसका मूल भाव ‘छोड़ देना’ है; इसका अनुवाद ‘ऋण-क्षमा’ या ‘ऋण-दावा छोड़ना’ भी किया जा सकता है। यहाँ यह सब्त-वर्ष में ऋण की वसूली छोड़ने की विधिक व्यवस्था को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘भाई’ का अर्थ वाचा-समुदाय का साथी सदस्य है; इसे अधिक व्याख्यात्मक रूप में ‘संगी इस्राएली’ भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר הַשְּׁמִטָּה
  choice: ऋण-मुक्ति का नियम
  rationale: यहाँ דְּבַר किसी साधारण ‘बात’ के बजाय आगे बताए जा रहे विधिक प्रावधान को सूचित करता है; शְׁמִטָּה का संदर्भ ऋण के दावे को छोड़ने से है।
- source_word: הַשְּׁמִטָּה / שְׁמִטָּה
  choice: ऋण-मुक्ति
  rationale: संदर्भ में यह सब्त-वर्ष के दौरान ऋण-दावे को छोड़ देने की व्यवस्था है। ‘ऋण-मुक्ति’ आधुनिक हिन्दी में स्पष्ट है और केवल सामान्य ‘छुटकारे’ से अधिक सटीक है।
- source_word: שָׁמוֹט
  choice: छोड़ दे
  rationale: इनफिनिटिव एब्सोल्यूट आदेश को बल देता है। हिन्दी में ‘छोड़ दे’ उस अनिवार्य विधिक निर्देश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל בַּעַל מַשֵּׁה יָדוֹ
  choice: हर लेनदार
  rationale: यह इब्रानी पदबंध ऋण-दावे के धारक को दर्शाता है। ‘लेनदार’ उसकी विधिक-आर्थिक भूमिका को सहज और संक्षिप्त रूप में व्यक्त करता है।
- source_word: אֲשֶׁר יַשֶּׁה בְּרֵעֵהוּ
  choice: अपने पड़ोसी को दिया हुआ ऋण
  rationale: हिफ़ील क्रिया उधार देने का भाव रखती है। हिन्दी में संज्ञात्मक वाक्यांश प्रसंग और कर्म को स्पष्ट करता है।
- source_word: לֹא יִגֹּשׂ
  choice: उसे चुकाने की माँग न करे
  rationale: क्रिया का अर्थ देनदार पर भुगतान के लिए दबाव डालना अथवा वसूली माँगना है। यह अनुवाद उस आर्थिक आशय को स्पष्ट करता है, बिना वसूली की कोई खास पद्धति जोड़ने के।
- source_word: רֵעֵהוּ
  choice: पड़ोसी
  rationale: רֵעַ के सामाजिक-सामुदायिक अर्थ के लिए ‘पड़ोसी’ पारंपरिक, सुबोध और पर्याप्त रूप से व्यापक हिन्दी शब्द है।
- source_word: אָחִיו
  choice: भाई
  rationale: मूल पाठ में पुल्लिंग एकवचन ‘भाई’ है। मुख्य पाठ में इसे बनाए रखने से स्रोत की शब्दावली और वाचा-समुदाय का संबंध सुरक्षित रहता है।
- source_word: כִּי קָרָא
  choice: क्योंकि ... घोषणा की गई है
  rationale: इब्रानी में कर्ता अनिर्दिष्ट है और पूर्ण क्रिया सार्वजनिक घोषणा का भाव देती है; हिन्दी कर्मवाच्य इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: לְ संबंध अथवा समर्पण का भाव दे सकता है। ‘के लिए’ मूल की गुंजाइश बनाए रखता है और ऋण-मुक्ति को याहवे से संबंधित घोषित व्यवस्था बताता है।
- source_word: יהוה
  choice: याहवे
  rationale: चार-अक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट देवनागरी रूप में रखा गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ नाम और उपाधि के भेद को सुरक्षित रखता है तथा उसे ‘प्रभु’ में विलीन नहीं करता।
- issue: אָחִיו का सामुदायिक आशय
  choice: भाई
  alternative: संगी इस्राएली; स्वजातीय
  rationale: शाब्दिक ‘भाई’ को मुख्य पाठ में बनाए रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि विधिक प्रसंग में इसका आशय वाचा-समुदाय के साथी सदस्य से है। इससे न तो मूल का पुरुषवाची रूप मिटता है, न उसका व्यापक सामुदायिक आशय खोता है।
- issue: שְׁמִטָּה की अवधि और प्रभाव
  choice: ऋण-मुक्ति
  alternative: ऋण-स्थगन; ऋण-रद्दीकरण
  rationale: शब्द मूलतः ‘छोड़ देने’ को व्यक्त करता है। मुख्य पाठ स्थायी रद्दीकरण बनाम सीमित स्थगन के प्रश्न को अतिरिक्त शब्दों से निर्णीत नहीं करता; पादटिप्पणी वैकल्पिक शब्दावली बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लेनदार’, ‘ऋण-मुक्ति’ और ‘चुकाने की माँग’ विधिक-आर्थिक प्रसंग को स्पष्ट करते हैं, जबकि ‘भाई’ और ‘याहवे’ स्रोत-पाठ की प्रमुख शब्दावली को बनाए रखते हैं।
