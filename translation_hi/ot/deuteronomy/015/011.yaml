base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/011.yaml
  text: For the poor will never cease from the midst of the land[a]; therefore I am commanding you, saying, ‘You must surely open your hand to your brother, to your afflicted one[b], and to your poor one in your land.’
translation:
  language: hi
  text: 'क्योंकि देश में ज़रूरतमंद कभी समाप्त नहीं होंगे। इसलिए मैं तुझे आज्ञा देता हूँ: “तू अपने देश में अपने भाई[a], अपने दीन-दुखी व्यक्ति[b] और अपने ज़रूरतमंद व्यक्ति के लिए अपना हाथ अवश्य खोलना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने साथी इस्राएली।” इब्रानी में “अपने भाई” है; यह वाचा-समुदाय के सदस्य के लिए पारिवारिक भाषा है और यहाँ प्रतिनिधिक अर्थ रखती है।
    reason: lexical_alternative
  - marker: b
    text: “दीन-दुखी व्यक्ति” के लिए प्रयुक्त इब्रानी शब्द किसी गरीब, दबे हुए या दुःख उठाने वाले व्यक्ति को सूचित कर सकता है; “गरीब” या “ज़रूरतमंद” भी सम्भव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आदेश का कारण बताता है और इब्रानी के व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא יֶחְדַּל אֶבְיוֹן
  choice: दरिद्रों का होना कभी समाप्त नहीं होगा
  rationale: नकार सहित अपूर्ण क्रिया निरंतर भविष्य की वास्तविकता व्यक्त करती है। אֶבְיוֹן यहाँ जातिवाचक एकवचन है; हिन्दी में बहुवचन भाव को इस वाक्य-विन्यास से स्वाभाविक रूप दिया गया है।
- source_word: מִקֶּרֶב הָאָרֶץ
  choice: देश में
  rationale: इस व्यवस्थाविवरणीय प्रसंग में הָאָרֶץ से वाचा का देश अभिप्रेत है। हिन्दी में ‘देश के बीच से’ अस्वाभाविक होता, इसलिए आशय को ‘देश में’ कहा गया है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: पहले कथन से निकलने वाले निष्कर्ष और आदेश का स्पष्ट तार्किक संबंध व्यक्त करता है।
- source_word: אָנֹכִי מְצַוְּךָ לֵאמֹר
  choice: मैं तुझे यह आज्ञा देता हूँ
  rationale: वर्तमान और प्रत्यक्ष आदेश का बल सुरक्षित है; לֵאמֹר को हिन्दी में द्विबिंदु से आरम्भ होने वाले प्रत्यक्ष कथन द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: פָּתֹחַ תִּפְתַּח אֶת־יָדְךָ
  choice: अपना हाथ अवश्य खोलना
  rationale: धातु के अनंत रूप और सीमित क्रिया की पुनरुक्ति आदेश को प्रबल बनाती है; ‘अवश्य’ उस बल को व्यक्त करता है और ‘हाथ खोलना’ उदारता का मूल रूपक बनाए रखता है।
- source_word: לְאָחִיךָ
  choice: अपने भाई
  rationale: ‘भाई’ इब्रानी के पुल्लिंग एकवचन और वाचागत पारिवारिक भाषा को सुरक्षित रखता है। प्रसंग में इसका प्रतिनिधिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לַעֲנִיֶּךָ
  choice: अपने दीन
  rationale: עָנִי निर्धनता के साथ दीनता, दबे होने या दुःख उठाने का भाव भी रख सकता है। ‘दीन’ निकटवर्ती אֶבְיוֹן से इसका कुछ भेद बनाए रखता है।
- source_word: וּלְאֶבְיֹנְךָ
  choice: और अपने दरिद्र
  rationale: אֶבְיוֹן का प्रमुख सामाजिक-आर्थिक भाव ‘दरिद्र’ से व्यक्त होता है और पद के आरम्भ में आए उसी इब्रानी शब्द से संबंध भी बना रहता है।
- source_word: בְּאַרְצֶךָ
  choice: अपने देश में
  rationale: आदेश को इस्राएल के वाचा-देश के ठोस सामाजिक संदर्भ में रखता है; ‘पृथ्वी’ अर्थ को अनावश्यक रूप से व्यापक कर देता।
theological_decisions:
- issue: वाचागत पारिवारिक संबोधन का प्रतिनिधिक अर्थ
  choice: अपने भाई
  alternative: अपने साथी इस्राएली
  rationale: मूल पाठ का पुल्लिंग एकवचन और ‘भाई’ की वाचागत आत्मीयता सुरक्षित रखी गई है। इसका व्यापक प्रतिनिधिक आशय पादटिप्पणी में बताया गया है, मुख्य पाठ में समतल नहीं किया गया।
- issue: הָאָרֶץ और אַרְצֶךָ का दायरा
  choice: देश / अपने देश में
  alternative: पृथ्वी / अपने देश में
  rationale: व्यवस्थाविवरण के निकट प्रसंग में संकेत इस्राएल को दिए गए देश की ओर है, न कि अमूर्त रूप से समस्त पृथ्वी की ओर।
- issue: עָנִי और אֶבְיוֹן के बीच अर्थगत संबंध
  choice: दीन और दरिद्र
  alternative: गरीब और ज़रूरतमंद
  rationale: दोनों शब्दों के अर्थ एक-दूसरे पर चढ़ते हैं, फिर भी עָנִי में दीनता या पीड़ा और אֶבְיוֹן में अभाव का विशेष भाव हो सकता है। अलग हिन्दी शब्द इस संभावित भेद को बिना कठोर बनाए सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। एकवचन संबोधन ‘तू/तुझे’ मूल इब्रानी के प्रत्यक्ष, व्यक्तिगत वाचागत संबोधन को दर्शाता है। ‘हाथ खोलना’ मूल रूपक को बनाए रखता है; उसके आदेशात्मक बल को ‘अवश्य’ से व्यक्त किया गया है।
