id: DEU.15.22
reference: Deuteronomy 15:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בִּ/שְׁעָרֶ֖י/ךָ תֹּאכֲלֶ֑/נּוּ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יַחְדָּ֔ו כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/022.yaml
  text: You may eat it within your gates[a]; the unclean and the clean alike may eat it[b], as the gazelle and the deer.
translation:
  language: hi
  text: तुम उसे अपने नगरों में[a] खा सकते हो; अशुद्ध और शुद्ध व्यक्ति दोनों उसे[b] वैसे ही खा सकते हैं जैसे चिकारे और हिरन को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने फाटकों के भीतर”; यह इब्रानी मुहावरा अपने नगरों या स्थानीय बस्तियों के भीतर का अर्थ देता है।
    reason: cultural_note
  - marker: b
    text: अर्थात अनुष्ठानिक रूप से अशुद्ध और अनुष्ठानिक रूप से शुद्ध, दोनों व्यक्ति उसे खा सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁעָרֶיךָ
  choice: अपने नगरों में
  rationale: शाब्दिक अर्थ ‘अपने फाटकों के भीतर’ है, पर इब्रानी में यह नगर अथवा स्थानीय बस्ती के क्षेत्र के लिए प्रयुक्त मुहावरा है; आधुनिक हिन्दी में ‘अपने नगरों में’ उसका स्वाभाविक अर्थ देता है।
- source_word: תֹּאכֲלֶנּוּ
  choice: तुम उसे ... खा सकते हो
  rationale: द्वितीय पुरुष एकवचन क्रिया और तृतीय पुरुष एकवचन कर्म पूर्ववर्ती पशु की ओर संकेत करते हैं; प्रसंग में विधान अनुमति देता है, इसलिए ‘खा सकते हो’ उपयुक्त है।
- source_word: הַטָּמֵא
  choice: अशुद्ध व्यक्ति
  rationale: यह नैतिक बुराई नहीं, अनुष्ठानिक स्थिति बताता है; ‘व्यक्ति’ जोड़ने से हिन्दी में स्पष्ट होता है कि बात खाने वाले मनुष्य की है।
- source_word: וְהַטָּהוֹר
  choice: शुद्ध व्यक्ति
  rationale: यह הַטָּמֵא के साथ अनुष्ठानिक स्थिति का विपरीत युग्म बनाता है; ‘शुद्ध व्यक्ति’ संक्षिप्त और स्पष्ट है।
- source_word: יַחְדָּו
  choice: दोनों
  rationale: यहाँ आशय है कि शुद्ध और अशुद्ध दोनों वर्ग समान रूप से खा सकते हैं; ‘दोनों’ हिन्दी में इसे स्वाभाविक ढंग से व्यक्त करता है, बिना यह संकेत दिए कि वे अनिवार्यतः एक साथ खाएँ।
- source_word: כַּצְּבִי
  choice: जैसे चिकारे को
  rationale: צְבִי सामान्यतः गज़ेल-प्रजाति के वन्य पशु को दर्शाता है; भारतीय हिन्दी में ‘चिकारा’ अधिक परिचित और सटीक नाम है।
- source_word: וְכָאַיָּל
  choice: और हिरन को
  rationale: אַיָּל हिरन, कभी विशेषतः नर हिरन, को दर्शाता है; ‘हिरन’ आधुनिक हिन्दी में स्पष्ट सामान्य पद है।
theological_decisions:
- issue: शुद्ध और अशुद्ध लोगों के खाने की अनुमति
  choice: अनुष्ठानिक रूप से अशुद्ध और शुद्ध दोनों व्यक्तियों को समान अनुमति
  alternative: मांस स्वयं शुद्ध अथवा अशुद्ध है
  rationale: व्याकरण में הַטָּמֵא और הַטָּהוֹר संज्ञा-सदृश विशेषण हैं और निकटवर्ती व्यवस्थाविवरण 12:15, 22 के समान प्रयोग में खाने वाले व्यक्तियों की अनुष्ठानिक दशा बताते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; आज्ञात्मक कठोरता के बजाय प्रसंगानुसार अनुमति व्यक्त की गई है। ‘नगरों’ से इब्रानी मुहावरे का अर्थ मुख्य पाठ में स्पष्ट किया गया है, जबकि पादटिप्पणी उसका शाब्दिक बिंब सुरक्षित रखती है। तुलना को स्वाभाविक हिन्दी में ‘जैसे ... को’ से व्यक्त किया गया है।
