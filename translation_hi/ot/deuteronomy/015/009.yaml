source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֡ פֶּן יִהְיֶ֣ה דָבָר֩ עִם לְבָבְ/ךָ֨ בְלִיַּ֜עַל לֵ/אמֹ֗ר קָֽרְבָ֣ה שְׁנַֽת הַ/שֶּׁבַע֮ שְׁנַ֣ת הַ/שְּׁמִטָּה֒ וְ/רָעָ֣ה עֵֽינְ/ךָ֗ בְּ/אָחִ֨י/ךָ֙ הָֽ/אֶבְי֔וֹן וְ/לֹ֥א תִתֵּ֖ן ל֑/וֹ וְ/קָרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/009.yaml
  text: Be careful lest there be in your heart a wicked thought[a], saying, ‘The seventh year, the year of release, is near,’ and your eye be evil toward your poor brother and you give him nothing; then he may cry out against you to Yahweh[c][b], and it will be sin in you.
translation:
  language: hi
  text: 'सावधान रहना कि तुम्हारे मन में यह दुष्ट विचार न आए: ‘सातवाँ वर्ष, ऋण-मुक्ति का वर्ष[a], निकट है,’ और तुम अपने निर्धन भाई[b] के प्रति अनुदार हो जाओ[c] और उसे कुछ न दो। तब वह याहवेह से तुम्हारे विरुद्ध दुहाई देगा, और तुम पाप के दोषी होगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ऋण छोड़ने का वर्ष’ अथवा ‘ऋण-रद्दीकरण का वर्ष।’
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘भाई’ से आशय वाचा-समुदाय के साथी सदस्य से है; केवल सगा भाई होना आवश्यक नहीं।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, ‘तुम्हारी आँख अपने निर्धन भाई के प्रति बुरी हो’—यह कृपण या अनुदार होकर ज़रूरतमंद को देने से कतराने का इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: सावधान रहना
  rationale: निफ़अल आज्ञार्थक के आत्म-संबंधी चेतावनी भाव को सहज और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: דָבָר עִם לְבָבְךָ בְלִיַּעַל
  choice: तुम्हारे मन में यह दुष्ट विचार
  rationale: दָבָר का मूल अर्थ व्यापक है, पर ‘मन’ और आगे आने वाले ‘कहने’ के संदर्भ में यह भीतर के विचार या इरादे को दर्शाता है; בְלִיַּעַל यहाँ व्यक्तिवाचक नाम नहीं, बल्कि नैतिक रूप से दुष्ट या निकृष्ट होने का विशेषणात्मक भाव रखता है।
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: ऋण-मुक्ति का वर्ष
  rationale: व्यवस्थाविवरण 15 के प्रसंग में שְׁמִטָּה सातवें वर्ष में ऋण छोड़ने या रद्द करने को सूचित करता है। ‘ऋण-मुक्ति’ सामान्य पाठक के लिए प्रसंग को स्पष्ट रखते हुए मूल के ‘छोड़ने’ के भाव को संप्रेषित करता है।
- source_word: וְרָעָה עֵינְךָ
  choice: तुम ... बुरी नज़र से देखो
  rationale: मूल के ‘आँख बुरी होना’ मुहावरे की छवि को यथासंभव बनाए रखता है, जबकि हिन्दी में कृपण और अनुदार दृष्टि का अर्थ समझने योग्य रहता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: בְּאָחִיךָ הָאֶבְיוֹן
  choice: अपने निर्धन भाई को
  rationale: אָחִיךָ की पारिवारिक-वाचा संबंधी भाषा को ‘भाई’ से सुरक्षित रखा गया है; אֶבְיוֹן के अभावग्रस्त अर्थ के लिए ‘निर्धन’ स्वाभाविक है।
- source_word: וְלֹא תִתֵּן לוֹ
  choice: और उसे कुछ न दो
  rationale: नकारात्मक क्रिया के व्यावहारिक परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है, बिना प्रसंग में दी जाने वाली वस्तु को अनावश्यक रूप से सीमित किए।
- source_word: וְקָרָא עָלֶיךָ אֶל יְהוָה
  choice: तब वह तुम्हारे विरुद्ध याहवे को पुकारेगा
  rationale: עָלֶיךָ में शिकायत या न्यायिक अपील का ‘विरुद्ध’ भाव है। क्रिया-क्रम को संभाव्यता में बदलने के बजाय उसके परिणामी बल को भविष्यकाल से रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: וְהָיָה בְךָ חֵטְא
  choice: और तुम पाप के दोषी होगे
  rationale: शाब्दिक ‘तुममें पाप होगा’ का आशय अपराध या पाप का दायित्व उस व्यक्ति पर आना है; हिन्दी में ‘पाप के दोषी’ इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत दिव्य नाम सीधे आया है। उसे सामान्य उपाधि से बदलने के बजाय नाम के रूप में रखा गया है; ‘याहवे’ प्रचलित विद्वत्तापूर्ण पुनर्निर्माण का हिन्दी रूप है।
- issue: ‘बुरी आँख’ मुहावरे को रखना या उसका अर्थ खोलना
  choice: मुख्य पाठ में ‘बुरी नज़र से देखो’ और पादटिप्पणी में शाब्दिक रूप
  alternative: उसके प्रति कृपण बनो; उसे अनुदारता से देखो
  rationale: यह चयन इब्रानी साहित्यिक छवि को बनाए रखता है, साथ ही हिन्दी पाठक को गलत अर्थ लेने से बचाने के लिए मुहावरे का आशय पादटिप्पणी में स्पष्ट करता है।
- issue: אָחִיךָ में ‘भाई’ का दायरा
  choice: निर्धन भाई
  alternative: निर्धन स्वजातीय; निर्धन साथी इस्राएली
  rationale: मूल का एकवचन पुल्लिंग पारिवारिक शब्द सुरक्षित रखा गया है। प्रसंग में इसका दायरा केवल सगा भाई नहीं, वाचा-समुदाय का सदस्य भी हो सकता है, जिसे पादटिप्पणी स्पष्ट करती है।
- issue: שְׁמִטָּה की प्रसंगगत व्याख्या
  choice: ऋण-मुक्ति
  alternative: छोड़ने का वर्ष; ऋण-रद्दीकरण का वर्ष
  rationale: अध्याय का निकट संदर्भ ऋण छोड़ने का है। फिर भी मूल संज्ञा के ‘छोड़ने/मुक्त करने’ के व्यापक भाव को पादटिप्पणी में विकल्पों सहित सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संबोधन एकवचन और गरिमापूर्ण चेतावनी-शैली में है। वाक्य-विन्यास को पठनीय बनाया गया है, पर मूल की आंतरिक विचार-वाणी, ‘बुरी आँख’ की छवि, वाचा-संबंधी ‘भाई’ और पाप-दोष के नैतिक परिणाम को सुरक्षित रखा गया है।
