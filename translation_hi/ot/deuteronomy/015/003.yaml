  text: אֶת הַ/נָּכְרִ֖י תִּגֹּ֑שׂ וַ/אֲשֶׁ֨ר יִהְיֶ֥ה לְ/ךָ֛ אֶת אָחִ֖י/ךָ תַּשְׁמֵ֥ט יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/003.yaml
  text: You may press a foreigner for payment[c][b][a], but whatever of yours is with your brother your hand shall release.
translation:
  language: hi
  text: परदेशी से तुम ऋण चुकाने की माँग कर सकते हो[a], लेकिन तुम्हारा जो कुछ तुम्हारे भाई[b] के पास हो, उस पर अपना हाथ ढीला कर देना[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परदेशी से तुम भुगतान वसूल कर सकते हो।” इब्रानी क्रिया ऋण के प्रसंग में भुगतान की माँग करने या वसूली के लिए दबाव डालने को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाई” से आशय इस्राएली वाचा-समुदाय के साथी सदस्य से है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, “अपना हाथ ढीला कर देना।” यह इब्रानी मुहावरा ऋण-मुक्ति के वर्ष में अपने दावे को छोड़ देने या ऋण माफ़ करने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: परदेशी
  rationale: इस कानूनी प्रसंग में यह शब्द इस्राएली वाचा-समुदाय से बाहर के विदेशी व्यक्ति को दर्शाता है। ‘परदेशी’ आधुनिक हिन्दी में स्वाभाविक है और सामाजिक-कानूनी भेद को बनाए रखता है।
- source_word: תִּגֹּשׂ
  choice: ऋण चुकाने की माँग कर सकते हो
  rationale: ऋण-वसूली के प्रसंग में נגשׂ का अर्थ देनदार से भुगतान की माँग करना या उस पर वसूली के लिए दबाव डालना है। यह रूप कानूनी आशय को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: וַאֲשֶׁר יִהְיֶה לְךָ
  choice: तुम्हारा जो कुछ हो
  rationale: इब्रानी की व्यापक, अनिर्दिष्ट अभिव्यक्ति को बनाए रखा गया है; प्रसंग में इसका संकेत भाई पर बकाया ऋण या उससे जुड़े दावे की ओर है।
- source_word: אָחִיךָ
  choice: तुम्हारे भाई
  rationale: मूल का पारिवारिक और वाचागत रूपक सुरक्षित रखा गया है। व्यवस्था-विवरण के कानूनी प्रसंग में इसका सामाजिक दायरा साथी इस्राएली तक है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: תַּשְׁמֵט יָדֶךָ
  choice: उस पर से तुम्हें अपना हाथ हटा लेना है
  rationale: שׁמט और ‘हाथ’ से बने ठोस इब्रानी मुहावरे को हिन्दी में यथासंभव सुरक्षित रखते हुए ऋण-विमोचन के प्रसंग में दावा छोड़ने का भाव व्यक्त किया गया है।
theological_decisions:
- issue: ‘तुम्हारे भाई’ का कानूनी और वाचागत दायरा
  choice: मुख्य पाठ में शाब्दिक वाचागत संबोधन ‘तुम्हारे भाई’ रखा गया है।
  alternative: तुम्हारे साथी इस्राएली
  rationale: पद परदेशी और इस्राएली वाचा-समुदाय के सदस्य के बीच भेद करता है। ‘भाई’ मूल रूपक और उसकी धर्मवैधानिक गूँज को सुरक्षित रखता है, जबकि सामाजिक दायरा पादटिप्पणी में बताया जा सकता है।
- issue: ‘अपना हाथ हटा लेना’ का आशय
  choice: मुख्य पाठ में हाथ का इब्रानी बिंब बनाए रखा गया है और पादटिप्पणी में इसे ऋण-दावा छोड़ने के रूप में समझाया गया है।
  alternative: अपना दावा छोड़ देना
  rationale: सीधा अर्थ पाठक के लिए अधिक स्पष्ट होता, पर मूल का ठोस मुहावरा मिट जाता। चयनित रूप बिंब और कानूनी आशय दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कानूनी संदर्भ स्पष्ट करने के लिए ‘ऋण चुकाने की माँग’ कहा गया है, जबकि ‘भाई’ और ‘हाथ’ के मूल इब्रानी बिंबों को मुख्य पाठ में सुरक्षित रखा गया है।
