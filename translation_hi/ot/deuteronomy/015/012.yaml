base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/012.yaml
  text: If your brother[a], a Hebrew man or a Hebrew woman, is sold to you and serves you six years, then in the seventh year you shall send him out free from you.
translation:
  language: hi
  text: यदि तुम्हारा भाई—अर्थात् कोई इब्री पुरुष या इब्री स्त्री—तुम्हें बेचा जाए और वह छह वर्ष तक तुम्हारी सेवा करे, तो सातवें वर्ष उसे स्वतंत्र करके अपने पास से भेज देना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्री में “उसे भेज देना” पुल्लिंग एकवचन रूप में है। पहले “इब्री पुरुष या इब्री स्त्री” कहा गया है; इसलिए यह नियम दोनों पर लागू होता है।
    reason: मूल भाषा के पुल्लिंग एकवचन व्याकरणिक रूप और पुरुष तथा स्त्री दोनों पर नियम के लागू होने को स्पष्ट करना।
lexical_decisions:
- source_word: יִמָּכֵר
  choice: बेचा जाए
  rationale: निफ़अल रूप के कर्मवाच्य अर्थ को बनाए रखता है और यह तय नहीं करता कि बिक्री किस प्रकार हुई।
- source_word: אָחִיךָ
  choice: तुम्हारा कोई भाई
  rationale: मूल के पारिवारिक और वाचागत संबंध-सूचक शब्द को सुरक्षित रखता है; आगे पुरुष या स्त्री दोनों का स्पष्ट उल्लेख है।
- source_word: הָעִבְרִי ... הָעִבְרִיָּה
  choice: कोई इब्री पुरुष या इब्री स्त्री
  rationale: मूल में जातीय पहचान और लिंग दोनों स्पष्ट हैं; यहाँ दास के लिए सामान्य संज्ञा नहीं है।
- source_word: וַעֲבָדְךָ
  choice: तुम्हारी सेवा करे
  rationale: עבד के व्यापक सेवा/श्रम संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שֵׁשׁ שָׁנִים
  choice: छः वर्ष
  rationale: संख्या और अवधि का सीधा अनुवाद।
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: तो सातवें वर्ष
  rationale: छः वर्षों की सेवा के बाद आने वाले विधिक क्रम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: תְּשַׁלְּחֶנּוּ
  choice: उसे ... विदा कर देना
  rationale: שלח की ‘भेजना/विदा करना’ छवि को रखता है; हिन्दी का ‘उसे’ पुरुष और स्त्री दोनों के लिए समान रूप से प्रयुक्त हो सकता है।
- source_word: חָפְשִׁי
  choice: स्वतंत्र करके
  rationale: मुक्त व्यक्ति की स्थिति को स्पष्ट और मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: מֵעִמָּךְ
  choice: अपने यहाँ से
  rationale: शाब्दिक ‘अपने पास से’ के आशय—अपने घराने अथवा सेवा से जाने देना—को स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: पुरुष और स्त्री दोनों के उल्लेख के बाद पुल्लिंग एकवचन रूप
  choice: मुख्य पाठ में ‘उसे’ रखा गया है और पादटिप्पणी में मूल का पुल्लिंग एकवचन रूप स्पष्ट किया गया है।
  alternative: ‘उस पुरुष या स्त्री को’ कहकर संदर्भ को मुख्य पाठ में पूरी तरह स्पष्ट करना।
  rationale: हिब्रू दोनों लिंगों को स्पष्ट रूप से सम्मिलित करता है, फिर व्याकरणिक रूप से पुल्लिंग एकवचन का प्रयोग करता है। हिन्दी ‘उसे’ स्रोत की एकवचनता बनाए रखते हुए किसी भी लिंग का बोध करा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक आदेश के लिए गरिमापूर्ण किंतु सरल शैली। ‘इब्री’ बाइबलीय जातीय पद के रूप में रखा गया है। ‘बेचा जाए’ स्रोत के कर्मवाच्य रूप को और ‘स्वतंत्र करके विदा कर देना’ मुक्ति तथा भेजे जाने—दोनों भावों को सुरक्षित रखता है।
