  yaml_path: translation/ot/deuteronomy/015/005.yaml
  text: if only you carefully listen to the voice of the LORD your God, being careful to do all this commandment that I am commanding you today.
translation:
  language: hi
  text: तभी, जब तुम अपने परमेश्वर यहोवा की वाणी ध्यान से सुनो और इस पूरी आज्ञा का पालन करने में सावधान रहो, जो मैं आज तुम्हें दे रहा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק אִם
  choice: बस यदि
  rationale: यह पद पिछले कथन की शर्त को प्रबल ढंग से व्यक्त करता है; ‘बस यदि’ उस सीमित और बलयुक्त शर्त को बनाए रखता है।
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: ध्यान से सुनो
  rationale: इब्रानी क्रिया की पुनरुक्ति सुनने की तीव्रता और निष्ठा पर बल देती है; स्वाभाविक हिन्दी में ‘ध्यान से सुनो’ यही बल व्यक्त करता है।
- source_word: בְּקוֹל יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा की वाणी
  rationale: ‘वाणी’ קוֹל का सीधा और गरिमापूर्ण रूप है; दिव्य नाम יהוה को प्रचलित हिन्दी बाइबलीय रूप ‘यहोवा’ में रखा गया है।
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: करने में सावधानी बरतो
  rationale: दोनों infinitives आज्ञा को चौकसी से व्यवहार में लाने का भाव देते हैं; यह रूप ‘पालन’ कहकर ‘करने’ के स्पष्ट अर्थ को विस्थापित नहीं करता।
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: इस सारी आज्ञा
  rationale: מִצְוָה एकवचन है, जबकि כָּל उसकी सम्पूर्णता पर बल देता है; इसलिए एकवचन ‘आज्ञा’ और ‘सारी’ दोनों रखे गए हैं।
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: जो मैं आज तुम्हें दे रहा हूँ
  rationale: हिन्दी में ‘आज्ञा देना’ स्वाभाविक है; निकटवर्ती ‘आज्ञा’ के कारण केवल ‘दे रहा हूँ’ अर्थ को स्पष्ट और प्रवाहपूर्ण रखता है।
theological_decisions:
- issue: יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है; ‘यहोवा’ नाम और सामान्य उपाधि के बीच का भेद बनाए रखता है तथा हिन्दी पाठकों के लिए परिचित है।
- issue: शर्त की शक्ति
  choice: बस यदि
  alternative: यदि केवल
  rationale: रַק אִם की बलयुक्त शर्त को असामान्य या अत्यधिक शब्दशः हिन्दी के बिना सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल। एकवचन सम्बोधन ‘तुम/तुम्हें’ मूल इब्रानी के एकवचन रूप को दर्शाता है।
