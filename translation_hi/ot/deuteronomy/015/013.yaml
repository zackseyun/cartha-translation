  register: आधुनिक मानक हिंदी; विधिक आदेश का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रूप। इब्रानी की पुनरावृत्ति और ‘जब/यदि’ की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
