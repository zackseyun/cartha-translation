source:
  edition: WLC
  text: וְ/כִֽי תְשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵֽ/עִמָּ֑/ךְ לֹ֥א תְשַׁלְּחֶ֖/נּוּ רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/013.yaml
  text: And when you send him away free from you[a], you shall not send him away empty-handed.
translation:
  language: hi
  text: और जब तुम उसे अपने यहाँ से स्वतंत्र करके विदा करो[a], तब उसे खाली हाथ विदा न करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और यदि तुम उसे अपने यहाँ से स्वतंत्र करके विदा करो।” इब्रानी संयोजक का अर्थ शर्तसूचक (‘यदि’) या समयसूचक (‘जब’) हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִֽי
  choice: और जब
  rationale: यह संयोजन शर्त (‘यदि’) या समय (‘जब’) का भाव दे सकता है। इस विधिक प्रसंग में अपेक्षित भावी अवसर के लिए ‘और जब’ स्वाभाविक है; वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: תְשַׁלְּחֶנּוּ
  choice: उसे ... विदा करो / उसे ... विदा न करना
  rationale: पिएल रूप का अर्थ भेज देना या विदा करना है। दोनों बार ‘विदा’ रखकर इब्रानी पुनरावृत्ति सुरक्षित की गई है।
- source_word: חָפְשִׁי
  choice: स्वतंत्र करके
  rationale: विशेषण का अर्थ दासत्व के विपरीत ‘स्वतंत्र’ है। हिंदी वाक्य में ‘स्वतंत्र करके विदा करो’ मुक्ति का भाव स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵעִמָּךְ
  choice: अपने यहाँ से
  rationale: शाब्दिक भाव ‘अपने पास से’ है। ‘अपने यहाँ से’ आधुनिक हिंदी में स्वाभाविक है और ‘अपनी सेवा से’ जैसा व्याख्यात्मक विस्तार नहीं जोड़ता।
- source_word: לֹא תְשַׁלְּחֶנּוּ
  choice: उसे ... विदा न करना
  rationale: निषेधात्मक अपूर्ण क्रिया का विधिक बल हिंदी में ‘न करना’ से स्पष्ट और गरिमापूर्ण ढंग से व्यक्त होता है।
- source_word: רֵיקָם
  choice: खाली हाथ
  rationale: यह क्रियाविशेषण ‘खाली’ अथवा ‘खाली हाथ’ का अर्थ देता है। मुक्ति के समय साधन दिए जाने के प्रसंग में ‘खाली हाथ’ प्रचलित और सटीक हिंदी मुहावरा है।
theological_decisions: []
