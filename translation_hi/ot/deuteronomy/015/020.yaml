base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/020.yaml
  text: You and your household shall eat it before Yahweh your God year by year in the place that Yahweh will choose[a].
translation:
  language: hi
  text: तुम और तुम्हारा घराना प्रति वर्ष उस स्थान पर, जिसे यहोवा चुनेगा, अपने परमेश्वर यहोवा के सामने उसे खाया करना[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने परमेश्वर यहोवा की उपस्थिति में।’
    reason: लִפְנֵי का वैकल्पिक, समान रूप से संभव मुहावरेदार अर्थ।
lexical_decisions:
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह पदबंध ‘के सामने’ या ‘की उपस्थिति में’ का अर्थ देता है; यहाँ ‘के सामने’ स्वाभाविक और संक्षिप्त है तथा उपासना-संबंधी उपस्थिति का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित इसका सीधा अर्थ ‘तुम्हारा परमेश्वर’ है; वाक्य में ‘तुम... अपने परमेश्वर’ अधिक स्वाभाविक हिन्दी है।
- source_word: תֹאכֲלֶנּוּ
  choice: उसे खाना
  rationale: अपूर्ण क्रिया का यहाँ विधिक-निर्देशात्मक बल है और पुल्लिंग एकवचन कर्म-प्रत्यय पिछले संदर्भ के पहिलौठे पशु की ओर संकेत करता है। ‘खाना’ हिन्दी के निर्देशात्मक विधान में स्वाभाविक है और अत्यधिक कठोर आज्ञार्थ नहीं जोड़ता।
- source_word: שָׁנָה בְּשָׁנָה
  choice: प्रति वर्ष
  rationale: यह वितरणात्मक इब्रानी मुहावरा हर वर्ष दोहराए जाने वाले पालन को दर्शाता है; ‘प्रति वर्ष’ वर्तमान मानक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: उस स्थान पर, जिसे यहोवा चुनेगा
  rationale: यह व्यवस्थाविवरण में चुने हुए उपासना-स्थान की मानक अभिव्यक्ति है; ‘चुनेगा’ मूल के भावी/अपूर्ण क्रियारूप को बनाए रखता है।
- source_word: אַתָּה וּבֵיתֶךָ
  choice: तुम और तुम्हारा घराना
  rationale: यहाँ בַּיִת भवन नहीं, व्यक्ति के घरेलू समुदाय को दर्शाता है; ‘घराना’ इस कानूनी-सामाजिक अर्थ को ‘घर’ से अधिक स्पष्टता से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। ‘यहोवा’ हिन्दी पाठकों के लिए पहचाना हुआ लिप्यंतरण है और नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: לִפְנֵי में ईश्वरीय उपस्थिति का भाव
  choice: अपने परमेश्वर यहोवा के सामने
  alternative: अपने परमेश्वर यहोवा की उपस्थिति में
  rationale: ‘के सामने’ मूल मुहावरे के स्थानिक और संबंधपरक दोनों पहलुओं को खुला रखता है; ‘उपस्थिति में’ संभव व्याख्या है, पर उसे मुख्य पाठ में रखकर अर्थ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और विधिक-निर्देशात्मक स्वर रखा गया है। पदक्रम को स्वाभाविक हिन्दी के अनुसार बदला गया है, पर वार्षिकता, चुने हुए स्थान, परमेश्वर की उपस्थिति और पूरे घराने की सहभागिता—सभी मूल घटक सुरक्षित हैं।
