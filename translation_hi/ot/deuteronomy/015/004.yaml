  text: אֶ֕פֶס כִּ֛י לֹ֥א יִֽהְיֶה בְּ/ךָ֖ אֶבְי֑וֹן כִּֽי בָרֵ֤ךְ יְבָֽרֶכְ/ךָ֙ יְהוָ֔ה בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹֽתֵן לְ/ךָ֥ נַחֲלָ֖ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/004.yaml
  text: However[a], there should be no poor among you, because Yahweh will surely bless you in the land that Yahweh your God is giving you as an inheritance to possess,
translation:
  language: hi
  text: फिर भी[a], तुम्हारे बीच कोई गरीब न हो, क्योंकि यहोवा तुम्हें निश्चय ही उस देश में आशीष देगा जिसे तुम्हारा परमेश्वर यहोवा तुम्हें विरासत के रूप में, उस पर अधिकार करने के लिए, दे रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भिक इब्रानी शब्द का अनुवाद ‘तौभी’, ‘केवल इतना कि’ या ‘इसके सिवा’ भी हो सकता है; यह पिछले निर्देश पर एक सीमा या योग्यता प्रकट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס
  choice: फिर भी
  rationale: यह पिछले ऋण-मुक्ति निर्देश को सीमित या योग्य ठहराने वाला कथन आरम्भ करता है; ‘फिर भी’ इस विचार-मोड़ को सहज हिन्दी में व्यक्त करता है।
- source_word: אֶבְיוֹן
  choice: दरिद्र
  rationale: आर्थिक अभाव में पड़े व्यक्ति का बोध कराता है; ‘दरिद्र’ गरिमापूर्ण और अर्थ की दृष्टि से पर्याप्त व्यापक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दूसरा כִּי इस अपेक्षा का कारण बताता है—यहोवा की सुनिश्चित आशीष।
- source_word: בָרֵךְ יְבָרֶכְךָ
  choice: तुम्हें निश्चय ही आशीष देगा
  rationale: धातु के infinitive absolute और finite verb का संयोजन क्रिया पर बल देता है; ‘निश्चय ही’ उस बल को बिना अतिरिक्त अर्थ जोड़े सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रत्यक्ष नामरूप ‘यहोवा’ चतुर्वर्णीय ईश-नाम को किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: נֹתֵן
  choice: दे रहा है
  rationale: कृदन्त प्रतिज्ञात भूमि देने की वर्तमान/आसन्न प्रक्रिया को दर्शाता है।
- source_word: נַחֲלָה
  choice: विरासत
  rationale: यह वाचा के अंतर्गत बाँटी गई भूमि के कानूनी और धर्मवैचारिक भाव को बनाए रखता है।
- source_word: לְרִשְׁתָּהּ
  choice: अधिकार में लेने के लिए
  rationale: ירשׁ भूमि को प्राप्त करके उस पर अधिकार करने का भाव रखता है; यह पद ‘विरासत’ के साथ अनावश्यक पुनरुक्ति से बचते हुए उस क्रियात्मक पक्ष को व्यक्त करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी पाठकों के लिए सुस्थापित ‘यहोवा’ नाम को सीधे रखता है, उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता; ‘याहवे’ अधिक निकट वैकल्पिक लिप्यंतरण है।
- issue: ‘कोई दरिद्र न हो’ का विधानात्मक या भविष्यसूचक स्वर
  choice: ‘न हो’—अपेक्षा/आदर्श को खुला रखा गया
  alternative: ‘न होगा’—निश्चित भविष्यवाणी
  rationale: לֹא יִהְיֶה रूप भविष्य अथवा आदेशात्मक अपेक्षा दोनों का संकेत दे सकता है। निकटवर्ती व्यवस्था और आगे की शर्तों को देखते हुए हिन्दी में ‘न हो’ मूल तनाव को बिना पूर्ण भविष्यवाणी में बदल दिए बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। एकवचन संबोधन ‘तुम्हारे/तुम्हें’ मूल के सामूहिक इस्राएल-संबोधन को स्वाभाविक हिन्दी में बनाए रखता है।
