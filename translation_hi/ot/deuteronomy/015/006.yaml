base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/006.yaml
  text: For Yahweh your God has blessed you just as he promised you[a], and you will lend to many nations, but you will not borrow; and you will rule over many nations, but they will not rule over you.
translation:
  language: hi
  text: क्योंकि तुम्हारे परमेश्वर याहवे ने तुम्हें आशीष दी है, जैसा उसने तुमसे वादा किया था[a]। तुम बहुत-से राष्ट्रों को उधार दोगे, पर स्वयं उधार नहीं लोगे; तुम बहुत-से राष्ट्रों पर शासन करोगे, पर वे तुम पर शासन नहीं करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसा उसने तुमसे कहा था।” इब्रानी में शाब्दिक रूप से “कहा” है, लेकिन वाचा के इस संदर्भ में इसका भाव वादा करने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम का देवनागरी लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: בֵּרַכְךָ
  choice: ने तुम्हें आशीष दी है
  rationale: पूर्ण रूप और वर्तमान परिणाम—दोनों को व्यक्त करने के लिए हिन्दी पूर्ण वर्तमान का प्रयोग किया गया है।
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: जैसा उसने तुमसे वादा किया था
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘कहा’ है, पर वाचा के इस संदर्भ में वह पहले दिए गए आश्वासन या वादे की ओर संकेत करती है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְהַעֲבַטְתָּ
  choice: तुम ... उधार दोगे
  rationale: हिफ़ील रूप यहाँ दूसरों को ऋण देने का अर्थ रखता है; यह सहज हिन्दी में स्पष्ट है।
- source_word: גּוֹיִם רַבִּים
  choice: बहुत-से राष्ट्रों
  rationale: आर्थिक और राजनीतिक संदर्भ में ‘राष्ट्र’ उपयुक्त है और ‘जाति’ से उत्पन्न आधुनिक सामाजिक अस्पष्टता से बचाता है।
- source_word: לֹא תַעֲבֹט
  choice: उधार नहीं लोगे
  rationale: यह पहले प्रयुक्त ‘उधार दोगे’ के साथ मूल पाठ का सीधा विरोध बनाए रखता है।
- source_word: וּמָשַׁלְתָּ
  choice: शासन करोगे
  rationale: यह राष्ट्रीय संदर्भ में शासन या प्रभुत्व रखने के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּבְךָ לֹא יִמְשֹׁלוּ
  choice: वे तुम पर शासन नहीं करेंगे
  rationale: ‘वे’ का संबंध पहले आए बहुत-से राष्ट्रों से स्पष्ट रखा गया है।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी लिप्यंतरण है और नाम को किसी उपाधि से नहीं बदलता।
- issue: דִּבֶּר לָךְ में कथन और वादे का संबंध
  choice: तुमसे वादा किया था
  alternative: तुमसे कहा था
  rationale: वाचा के संदर्भ में कथन प्रतिज्ञा का बल रखता है, फिर भी मूल की शाब्दिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘राष्ट्र’ आर्थिक-राजनीतिक संदर्भ को स्पष्ट करता है; समानांतर वाक्य-रचना मूल पद के उधार देने/लेने और शासन करने/शासित होने के विरोध को सुरक्षित रखती है।
