source:
  edition: WLC
  text: כִּֽי יִהְיֶה֩ בְ/ךָ֨ אֶבְי֜וֹן מֵ/אַחַ֤ד אַחֶ֨י/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ בְּ/אַ֨רְצְ/ךָ֔ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹ֧א תְאַמֵּ֣ץ אֶת לְבָבְ/ךָ֗ וְ/לֹ֤א תִקְפֹּץ֙ אֶת יָ֣דְ/ךָ֔ מֵ/אָחִ֖י/ךָ הָ/אֶבְיֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/007.yaml
  text: If there is a poor man among you[a], one of your brothers, within one of your gates in your land that Yahweh your God is giving you[b], you shall not harden your heart or shut your hand against your poor brother.
translation:
  language: hi
  text: यदि तुम्हारे बीच, तुम्हारे भाइयों में से कोई निर्धन हो—तुम्हारे देश के किसी नगर में[a], जिसे यहोवा, तुम्हारा परमेश्वर, तुम्हें दे रहा है—तो तुम अपने निर्धन भाई के प्रति न तो अपना हृदय कठोर करना और न अपनी मुट्ठी बंद करना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “तुम्हारे किसी फाटक के भीतर”; यहाँ “फाटक” नगर या बस्ती को दर्शाता है।'
    reason: lexical_alternative
  - marker: b
    text: “भाइयों” और “भाई” से आशय यहाँ वाचा-समुदाय के साथी सदस्यों से है।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: यदि ... हो
  rationale: यह विधिक शर्त प्रस्तुत करता है; सामान्य परिस्थिति के लिए आधुनिक हिन्दी में ‘यदि ... हो’ स्वाभाविक है।
- source_word: אֶבְיוֹן
  choice: निर्धन
  rationale: यह शब्द आर्थिक अभाव और आवश्यकता में पड़े व्यक्ति को दर्शाता है; ‘निर्धन’ गरिमापूर्ण और स्पष्ट है।
- source_word: מֵאַחַד אַחֶיךָ / מֵאָחִיךָ הָאֶבְיוֹן
  choice: तुम्हारे भाइयों में से कोई / अपने निर्धन भाई के प्रति
  rationale: मूल का पारिवारिक वाचा-समुदाय संबंधी रूपक बनाए रखा गया है।
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: तुम्हारे ... किसी नगर में
  rationale: शाब्दिक अर्थ ‘तुम्हारे किसी फाटक के भीतर’ है, पर यहाँ फाटक लक्षणा से नगर या बस्ती को दर्शाता है; अर्थ मुख्य पाठ में और मूल बिंब पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम-रूप ‘यहोवा’ मूल के ईश्वरीय नाम को शीर्षक से अलग रखता है।
- source_word: נֹתֵן לָךְ
  choice: तुम्हें दे रहा है
  rationale: हिब्रू कृदंत दान की जारी या सामने उपस्थित क्रिया को व्यक्त करता है।
- source_word: לֹא תְאַמֵּץ אֶת לְבָבְךָ
  choice: अपना हृदय कठोर न करना
  rationale: मूल मुहावरे और उसके नैतिक बल दोनों को सुरक्षित रखता है।
- source_word: וְלֹא תִקְפֹּץ אֶת יָדְךָ
  choice: अपनी मुट्ठी बंद न करना
  rationale: हाथ समेटकर सहायता रोकने के ठोस बिंब को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: אַחֶיךָ / אָחִיךָ की वाचा-समुदाय संबंधी पारिवारिक भाषा
  choice: भाइयों / भाई
  alternative: अपने लोगों में से / साथी इस्राएली
  rationale: मूल पाठ आर्थिक दायित्व को पारिवारिक संबंध के रूप में प्रस्तुत करता है; व्यापक व्याख्यात्मक पदों से इसे बदलने के बजाय वही तनाव और निकटता रखी गई है।
- issue: ईश्वरीय नाम יְהוָה
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: व्यक्तिगत नाम को शीर्षक ‘प्रभु’ से प्रतिस्थापित नहीं किया गया; ‘यहोवा’ सामान्य हिन्दी पाठक के लिए परिचित नाम-रूप है।
- issue: दूसरे पुरुष एकवचन आज्ञा का रूप
  choice: तुम ... न करना
  alternative: तू ... मत करना / तुम ... नहीं करोगे
  rationale: ‘तुम’ आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध है, जबकि निषेधात्मक अनंत-रूप व्यवस्था की सीधी आज्ञा व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज विधिक शैली। ‘नगर’ से आशय स्पष्ट किया गया है, जबकि ‘हृदय कठोर करना’ और ‘मुट्ठी बंद करना’ जैसे मूल बिंब बनाए रखे गए हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
