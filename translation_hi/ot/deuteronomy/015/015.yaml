source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ עַל כֵּ֞ן אָנֹכִ֧י מְצַוְּ/ךָ֛ אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/015.yaml
  text: And you shall remember that you were a servant in the land of Egypt[a], and Yahweh your God redeemed you[c][b]; therefore I am commanding you this today.
translation:
  language: hi
  text: और स्मरण रखना कि तू मिस्र देश में दास था, और तेरे परमेश्वर यहोवा ने तुझे छुड़ाया था[a]; इसलिए मैं आज तुझे यह आज्ञा दे रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छुड़ौती देकर मुक्त किया था।” मूल इब्रानी क्रिया बंधन से छुड़ाने या मूल्य देकर मुक्त करने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: और याद रखो
  rationale: कानूनी और वाचा-संबंधी प्रसंग में यह रूप आज्ञार्थक बल रखता है; आधुनिक हिन्दी में ‘याद रखो’ स्वाभाविक और स्पष्ट है।
- source_word: עֶבֶד
  choice: दास
  rationale: मिस्र की बंधुआ और उत्पीड़क अवस्था यहाँ प्रमुख है। ‘दास’ उस सामाजिक स्थिति को व्यक्त करता है और ‘सेवक’ की अपेक्षा अधिक उपयुक्त है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में
  rationale: मूल के ‘मिस्र देश में’ वाले ठोस ऐतिहासिक वाक्यांश को बनाए रखता है।
- source_word: וַיִּפְדְּךָ
  choice: तुम्हें छुड़ाया था
  rationale: פדה का अर्थ दासत्व या बंधन से छुड़ाना अथवा मूल्य देकर मुक्त करना है। ‘छुड़ाया’ सामान्य हिन्दी में स्पष्ट है, जबकि पादटिप्पणी ‘छुड़ौती देकर मुक्त किया’ की अर्थछाया बताती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है; हिन्दी बाइबलीय परंपरा में ‘यहोवा’ व्यापक रूप से पहचाना जाता है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: पूर्व उद्धार और वर्तमान आज्ञा के बीच स्पष्ट निष्कर्ष-संबंध व्यक्त करता है।
- source_word: אָנֹכִי מְצַוְּךָ
  choice: मैं तुम्हें ... आज्ञा दे रहा हूँ
  rationale: स्पष्ट सर्वनाम और कृदंत की वर्तमान, बलयुक्त आज्ञात्मक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: यह आज्ञा
  rationale: דבר शाब्दिक रूप से ‘यह बात/विषय’ है, पर निकट प्रसंग में दी जा रही विधि को सूचित करता है; ‘यह आज्ञा’ हिन्दी में स्वाभाविक है और संदर्भ स्पष्ट करता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: समय-सूचक शब्द का सीधा, वर्तमान हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में विशिष्ट ईश्वरीय नाम है, इसलिए ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी पाठकों और हिन्दी बाइबलीय परंपरा में अधिक परिचित रूप है; ‘याहवे’ संभावित विद्वत्तापरक लिप्यंतरण है।
- issue: मिस्र में עֶבֶד की सामाजिक स्थिति
  choice: दास
  alternative: सेवक
  rationale: यहाँ इस्राएल की उत्पीड़क बंधुआ अवस्था स्मरण कराई गई है; ‘दास’ उस नैतिक और ऐतिहासिक भार को ‘सेवक’ से बेहतर बनाए रखता है।
- issue: פדה की उद्धार-संबंधी अर्थछाया
  choice: छुड़ाया था
  alternative: छुड़ौती देकर मुक्त किया था
  rationale: मुख्य पाठ में सहज हिन्दी रखी गई है, जबकि मूल क्रिया में बंधन से मूल्य देकर छुड़ाने की संभावित अर्थछाया पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली है। पूरे पद में इब्रानी का ‘तुम’ एकवचन है; हिन्दी में इसका स्वाभाविक सामुदायिक एकवचन रूप रखा गया है।
