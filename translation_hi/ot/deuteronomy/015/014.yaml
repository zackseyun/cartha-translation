  yaml_path: translation/ot/deuteronomy/015/014.yaml
  text: You shall surely furnish him from your flock[a], from your threshing floor, and from your winepress; from what Yahweh your God has blessed you with, you shall give to him.
translation:
  language: hi
  text: तू उसे अपनी भेड़-बकरियों, अपने खलिहान और अपने दाखरस के कोल्हू में से भरपूर देना[a]। याहवे, तेरे परमेश्वर ने तुझे जिससे आशीष दी है, उसमें से उसे देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसे उदारता से देना।’ इब्रानी में बलयुक्त क्रियारूप है, जिसका अर्थ मुक्त करते समय उसे पर्याप्त रूप से प्रदान करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֲנֵיק תַּעֲנִיק
  choice: अवश्य देना
  rationale: धातु ענק के हिफ़ील रूप और क्रिया के साथ आए infinitive absolute की बलवत्ता को सरल, स्वाभाविक हिन्दी में व्यक्त करता है। उदारतापूर्वक या भरपूर देने का निहितार्थ पादटिप्पणी में सुरक्षित रखा गया है, ताकि मुख्य पाठ मात्रा को आवश्यकता से अधिक निश्चित न करे।
- source_word: מִצֹּאנְךָ
  choice: अपनी भेड़-बकरियों में से
  rationale: צאן छोटे पालतू पशुओं—विशेषकर भेड़ों और बकरियों—का सामूहिक पद है; हिन्दी में दोनों का स्पष्ट उल्लेख सामान्य पाठक के लिए अर्थ खोलता है।
- source_word: וּמִגָּרְנְךָ
  choice: अपने खलिहान में से
  rationale: גֹּרֶן का ठोस चित्र ‘खलिहान’ के रूप में रखा गया है; यहाँ वह वहाँ एकत्र अनाज की उपज के लिए लक्षणा भी है।
- source_word: וּמִיִּקְבֶךָ
  choice: अपने दाखरस के कोल्हू में से
  rationale: יֶקֶב दाख या दाखरस निकालने के कोल्हू अथवा कुंड को दर्शाता है। ‘दाखरस का कोल्हू’ कृषि-संबंधी मूल बिंब को बनाए रखता है।
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: याहवे तेरे परमेश्वर ने तुझे जिन वस्तुओं से आशीष दी है
  rationale: सम्बन्धवाचक उपवाक्य को स्वाभाविक हिन्दी में इस प्रकार रखा गया है कि दिया जाने वाला अंश परमेश्वर से मिली उपज और समृद्धि में से आता हुआ स्पष्ट हो।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: תִּתֶּן לוֹ
  choice: उसे देना
  rationale: अंतिम स्पष्ट आज्ञा को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है, जो पहले बलयुक्त आदेश को पुनः पुष्ट करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: दान की मात्रा और बलवत्ता
  choice: मुख्य पाठ में ‘अवश्य देना’, और भरपूर प्रावधान का अर्थ पादटिप्पणी में
  alternative: ‘भरपूर देना’ या ‘उदारता से देना’
  rationale: इब्रानी रचना आज्ञा पर स्पष्ट बल देती है, जबकि क्रिया उदार या पर्याप्त प्रावधान का भाव भी दे सकती है। यह प्रस्तुति बलवत्ता को पाठ में रखती और मात्रा-संबंधी सम्भावना को बिना कठोर किए पादटिप्पणी में सुरक्षित करती है।
translation_notes:
  register: एक व्यक्ति को संबोधित करने वाले इब्रानी एकवचन के अनुरूप ‘तू/तेरे’ रखा गया है। भाषा आधुनिक, गरिमापूर्ण और ग्रामीण कृषि-बिंबों के प्रति यथासंभव औपचारिक रूप से निष्ठावान है।
