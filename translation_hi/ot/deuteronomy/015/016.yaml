  text: וְ/הָיָה֙ כִּֽי יֹאמַ֣ר אֵלֶ֔י/ךָ לֹ֥א אֵצֵ֖א מֵ/עִמָּ֑/ךְ כִּ֤י אֲהֵֽבְ/ךָ֙ וְ/אֶת בֵּיתֶ֔/ךָ כִּי ט֥וֹב ל֖/וֹ עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/016.yaml
  text: And if he says to you[a], ‘I will not go out from you,’ because he loves you and your household, because it is good for him with you[b],
translation:
  language: hi
  text: और यदि वह तुमसे कहे[a], ‘मैं तुम्हें छोड़कर नहीं जाऊँगा,’ क्योंकि वह तुमसे और तुम्हारे घराने[b] से प्रेम करता है, क्योंकि तुम्हारे साथ उसका भला होता है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, ‘मैं तुमसे अलग होकर नहीं जाऊँगा’ या इस प्रसंग में, ‘मैं तुमसे मुक्त होकर नहीं जाऊँगा।’ इब्रानी में साथ रहने की स्थिति से निकलने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: ‘घराना’ यहाँ केवल भवन नहीं, बल्कि स्वामी के परिवार और घरेलू समुदाय के अर्थ में है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और यदि
  rationale: विधिक प्रसंग में यह सूत्र एक संभावित स्थिति आरम्भ करता है; ‘और यदि’ स्वाभाविक रहते हुए मूल की क्रमबद्धता बनाए रखता है।
- source_word: יֹאמַר אֵלֶיךָ
  choice: वह तुमसे कहे
  rationale: इस विधिक स्थिति में अपूर्ण क्रिया संभाव्यता व्यक्त करती है; हिंदी का संभावनार्थक ‘कहे’ उपयुक्त है।
- source_word: לֹא אֵצֵא מֵעִמָּךְ
  choice: मैं तुम्हें छोड़कर नहीं जाऊँगा
  rationale: יָצָא का मूल बिंब ‘बाहर जाना’ है, पर מֵעִמָּךְ साथ से अलग होने का भाव देता है। हिंदी में यह रूप संबंधपरक अर्थ और दास के मुक्त होकर चले जाने, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּי אֲהֵבְךָ וְאֶת־בֵּיתֶךָ
  choice: क्योंकि वह तुमसे और तुम्हारे घराने से प्रेम करता है
  rationale: בַּיִת यहाँ केवल भवन नहीं, बल्कि स्वामी के परिवार और घरेलू समुदाय को सूचित करता है; इसलिए ‘घराना’ चुना गया है।
- source_word: כִּי טוֹב לוֹ עִמָּךְ
  choice: और तुम्हारे साथ उसका भला होता है
  rationale: यह निकटवर्ती कारण को जारी रखता है और मूल के व्यापक ‘उसके लिए अच्छा है’ को किसी विशेष प्रकार की समृद्धि तक सीमित नहीं करता। हिंदी में पुनरुक्त ‘क्योंकि’ की अपेक्षा ‘और’ कारणों की स्वाभाविक श्रृंखला बनाता है।
