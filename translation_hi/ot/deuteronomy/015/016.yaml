  register: आधुनिक मानक हिंदी; विधिक प्रसंग के अनुरूप गरिमामय किंतु सरल भाषा। ‘घराना’ सामाजिक-घरेलू इकाई को व्यक्त करता है। पद अगले विधान से जुड़ता है, इसलिए अंत में अल्पविराम रखा गया है।
