base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/010.yaml
  text: You shall surely give to him[a], and your heart shall not be troubled when you give to him[c][b], because on account of this thing Yahweh your God will bless you in all your work and in every undertaking of your hand.
translation:
  language: hi
  text: तू उसे अवश्य देना, और उसे देते समय तेरा मन बुरा न माने,[a] क्योंकि इसी बात के कारण याहवे तेरा परमेश्वर तेरे हर काम में और तेरे हाथ के हर उपक्रम में तुझे आशीष देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा मन दुखी न हो” अथवा “तेरे मन में अनिच्छा या रोष न हो।”
    reason: मूल इब्रानी वाक्यांश देते समय मन की भीतरी अप्रसन्नता, दुःख या अनिच्छा के निकट अर्थ व्यक्त कर सकता है।
lexical_decisions:
- source_word: נָתוֹן תִּתֵּן
  choice: तू उसे अवश्य देना
  rationale: क्रिया के साथ उसी धातु का infinitive absolute आज्ञा पर बल देता है। ‘अवश्य देना’ इस जोर को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘उदारता से’ जैसी अतिरिक्त व्याख्या जोड़े।
- source_word: וְלֹא יֵרַע לְבָבְךָ
  choice: तेरे मन में खेद न हो
  rationale: यह वाक्यांश देते समय होने वाली भीतरी अप्रसन्नता, अनिच्छा या मन के दुखने को व्यक्त करता है। ‘खेद न हो’ मूल की भावात्मक व्यापकता बनाए रखता है; संभावित अर्थों को पादटिप्पणी में दिया गया है।
- source_word: בְּתִתְּךָ לוֹ
  choice: उसे देते समय
  rationale: ב के साथ infinitive construct यहाँ कालगत/परिस्थितिजन्य अर्थ देता है; ‘देते समय’ सहज हिन्दी है।
- source_word: כִּי בִּגְלַל הַדָּבָר הַזֶּה
  choice: क्योंकि इसी बात के कारण
  rationale: בגלל कारण सूचित करता है और הדבר הזה उक्त दान के कार्य की ओर संकेत करता है। ‘इसी बात के कारण’ निकट और स्वाभाविक अनुवाद है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम YHWH को उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण ‘याहवे’ रखा गया है।
- source_word: בְּכָל מַעֲשֶׂךָ
  choice: तेरे हर काम में
  rationale: מַעֲשֶׂה किए या बनाए गए कामों के लिए व्यापक शब्द है; ‘हर काम’ प्रसंग में सहज और पर्याप्त व्यापक है।
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: हर उस कार्य में, जिसमें तू हाथ लगाएगा
  rationale: शाब्दिक चित्र ‘हाथ भेजने’ का है और अर्थ उन सभी कार्यों या उपक्रमों से है जिन्हें व्यक्ति हाथ में लेता है। हिन्दी मुहावरा अर्थ और हाथ की छवि दोनों बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम प्रत्यक्ष रूप से आया है। ‘याहवे’ उसे उपाधि में बदले बिना लिप्यंतरित करता है; स्वरांकन की ऐतिहासिक अनिश्चितता के कारण अन्य रूप संभव हैं।
- issue: एकवचन पुल्लिंग प्राप्तकर्ता
  choice: उसे
  alternative: ज़रूरतमंद व्यक्ति को
  rationale: לוֹ व्याकरणतः पुल्लिंग एकवचन है और पिछले प्रसंग के अभावग्रस्त भाई की ओर संकेत करता है। हिन्दी ‘उसे’ मूल की संख्या को बनाए रखता है।
- issue: आशीष और मानवीय कार्य के बीच कारण-संबंध
  choice: इसी बात के कारण ... आशीष देगा
  alternative: इसलिए ... आशीष देगा
  rationale: בגלל स्पष्ट कारण-संबंध व्यक्त करता है। अनुवाद उस तनाव को बनाए रखता है और इसे न तो यांत्रिक प्रतिफल में बदलता है, न कारण-संबंध को कमजोर करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। व्यवस्थाविवरण के वाचा-संबंधी प्रत्यक्ष संबोधन को बनाए रखने के लिए एकवचन ‘तू/तेरा’ प्रयुक्त है। ‘याहवे’ को परमेश्वर के नाम के लिप्यंतरण के रूप में रखा गया है।
