source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֨ה ב֜/וֹ מ֗וּם פִּסֵּ֨חַ֙ א֣וֹ עִוֵּ֔ר כֹּ֖ל מ֣וּם רָ֑ע לֹ֣א תִזְבָּחֶ֔/נּוּ לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/021.yaml
  text: But if it has a defect—being lame or blind[a], any bad defect—you shall not sacrifice it to Yahweh your God.
translation:
  language: hi
  text: परन्तु यदि उसमें कोई दोष हो—लँगड़ापन, अंधापन, या कोई अन्य बुरा दोष—तो उसे याहवे, अपने परमेश्वर के लिए बलि न चढ़ाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: परन्तु यदि
  rationale: यह पिछले निर्देश के विपरीत स्थिति प्रस्तुत करने वाली शर्त है; इसलिए ‘परन्तु यदि’ संबंध और शर्त दोनों को व्यक्त करता है।
- source_word: יִהְיֶה בּוֹ מוּם
  choice: उसमें कोई दोष हो
  rationale: इब्रानी का अस्तित्वसूचक वाक्यांश हिन्दी में इसी रूप में स्वाभाविक और अर्थनिष्ठ है; ‘दोष’ बलि के लिए अयोग्य करने वाली शारीरिक कमी को व्यक्त करता है।
- source_word: פִּסֵּחַ
  choice: लँगड़ा
  rationale: यह चलने-फिरने में शारीरिक बाधा वाले पशु का सीधा और प्रचलित हिन्दी वर्णन है।
- source_word: עִוֵּר
  choice: अंधा
  rationale: यह मूल शारीरिक विशेषण का स्वाभाविक हिन्दी समतुल्य है।
- source_word: כֹּל מוּם רָע
  choice: कोई भी बुरा दोष
  rationale: ‘बुरा’ रָע की स्पष्टता को बनाए रखता है और उसे बिना संकेत दिए केवल ‘गंभीर’ या ‘अस्वीकार्य’ में नहीं बदलता; पादटिप्पणी प्रसंगगत आशय स्पष्ट करती है।
- source_word: לֹא תִזְבָּחֶנּוּ
  choice: तुम उसे ... बलि न चढ़ाना
  rationale: निषेधात्मक कानूनी निर्देश को वर्तमान, स्वाभाविक हिन्दी में व्यक्त करता है; ‘उसे’ कर्म-प्रत्यय को और ‘बलि चढ़ाना’ धार्मिक बलिदान के कार्य को सुरक्षित रखता है।
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर याहवे को
  rationale: लַ का बलि के प्राप्तकर्ता की ओर संकेत हिन्दी ‘को’ से व्यक्त होता है; वाचा का निजी सम्बोधन ‘अपने परमेश्वर’ और दिव्य नाम ‘याहवे’ के रूप में सुरक्षित है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट दिव्य नाम है; उसे उपाधि में बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- issue: כֹּל מוּם רָע में רָע का अर्थ
  choice: बुरा दोष
  alternative: गंभीर दोष
  rationale: शाब्दिक अर्थ और उसकी असहज लेकिन महत्वपूर्ण तीव्रता को मुख्य पाठ में बनाए रखा गया है; यहाँ नैतिक बुराई नहीं, बलि के लिए अनुपयुक्त शारीरिक दोष अभिप्रेत है, जिसे पादटिप्पणी स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। एकवचन सम्बोधन ‘तुम’ और कानूनी निषेध ‘न चढ़ाना’ मूल की सीधी वाचा-संबंधी शैली को बनाए रखते हैं।
