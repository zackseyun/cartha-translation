  edition: WLC
  text: כָּֽל הַ/בְּכ֡וֹר אֲשֶׁר֩ יִוָּלֵ֨ד בִּ/בְקָרְ/ךָ֤ וּ/בְ/צֹֽאנְ/ךָ֙ הַ/זָּכָ֔ר תַּקְדִּ֖ישׁ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֤א תַעֲבֹד֙ בִּ/בְכֹ֣ר שׁוֹרֶ֔/ךָ וְ/לֹ֥א תָגֹ֖ז בְּכ֥וֹר צֹאנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/019.yaml
  text: Every firstborn male that is born among your herd and among your flock you shall consecrate to Yahweh your God[a]. You shall not work with the firstborn of your ox[b], nor shear the firstborn of your flock.
translation:
  language: hi
  text: तुम्हारे गाय-बैलों और भेड़-बकरियों में जो भी नर पहलौठा जन्मे, हर एक को तुम अपने परमेश्वर यहवे के लिए पवित्र ठहराना। अपने बैल के पहलौठे से कोई काम न लेना और अपनी भेड़-बकरियों के पहलौठे को न कतरना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַבְּכוֹר ... הַזָּכָר
  choice: जितने भी पहलौठे नर जन्में, उनमें से हर एक
  rationale: כָּל के वितरणात्मक अर्थ और एकवचन הַבְּכוֹר को स्वाभाविक हिन्दी में व्यक्त करता है; הַזָּכָר स्पष्ट करता है कि आज्ञा नर पशुओं के विषय में है।
- source_word: בִּבְקָרְךָ וּבְצֹאנְךָ
  choice: तुम्हारे गाय-बैलों और भेड़-बकरियों में
  rationale: בקר बड़े पालतू पशुओं और צאן छोटे पालतू झुंड—भेड़ और बकरियों—को दर्शाता है; यह रूप आधुनिक हिन्दी में दोनों वर्गों को स्पष्ट रखता है।
- source_word: תַּקְדִּישׁ
  choice: पवित्र ठहराना
  rationale: קדש के हिफ़ील रूप का अर्थ परमेश्वर के लिए अलग करके पवित्र करना है; यह सामान्य पाठक के लिए 'अभिषेक करना' से अधिक स्पष्ट है।
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहवे के लिए
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम יהוה को 'यहवे' के रूप में रखा गया है और समर्पण का अर्थ 'के लिए' से व्यक्त हुआ है।
- source_word: לֹא תַעֲבֹד בִּבְכֹר שׁוֹרֶךָ
  choice: अपने बैल के पहलौठे से कोई काम न लेना
  rationale: עבד עם ב यहाँ पशु को श्रम में लगाने का निषेध करता है; हिन्दी में 'काम लेना' इस प्रयोजनार्थक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְלֹא תָגֹז בְּכוֹר צֹאנֶךָ
  choice: अपनी भेड़-बकरियों के पहलौठे का ऊन न कतरना
  rationale: גזז का अर्थ ऊन कतरना है। צאן को केवल भेड़ तक सीमित न करते हुए व्यापक पशु-वर्ग बनाए रखा गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ वाचा का व्यक्तिगत नाम सीधे आया है। 'यहवे' उसे नाम के रूप में सुरक्षित रखता है, जबकि 'प्रभु' मूल नाम को उपाधि में बदल देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। विधिक आज्ञा का बल बनाए रखने के लिए 'पवित्र ठहराना' और निषेधों में 'न लेना/न कतरना' प्रयोग हुआ है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
