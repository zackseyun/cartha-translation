  text: לֹא יִקְשֶׁ֣ה בְ/עֵינֶ֗/ךָ בְּ/שַׁלֵּֽחֲ/ךָ֙ אֹת֤/וֹ חָפְשִׁי֙ מֵֽ/עִמָּ֔/ךְ כִּ֗י מִשְׁנֶה֙ שְׂכַ֣ר שָׂכִ֔יר עֲבָֽדְ/ךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּ/בֵֽרַכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל אֲשֶׁ֥ר תַּעֲשֶֽׂה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/018.yaml
  text: It shall not seem hard to you when you send him away free from you[a], because for six years he has served you for double the wages of a hired worker; and Yahweh your God will bless you in all that you do.
translation:
  language: hi
  text: जब तू उसे अपने पास से स्वतंत्र करके विदा करे, तो यह तुझे भारी न लगे, क्योंकि उसने छह वर्ष तक तेरी सेवा की है, जो किराए के मजदूर की मजदूरी से दुगुनी के बराबर है[a]; और याहवे तेरा परमेश्वर तेरे हर काम में तुझे आशीष देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उसने छह वर्ष तक तेरी सेवा की है, जिसका मूल्य किराए के मजदूर की मजदूरी से दुगुना है।” इब्रानी अभिव्यक्ति उसकी छह वर्ष की सेवा के मूल्य की तुलना किराए के मजदूर की मजदूरी से करती है।
    reason: मִשְׁנֶה שְׂכַר שָׂכִיר की संक्षिप्त तुलनात्मक रचना में सेवा और उसकी मजदूरी/मूल्य के संबंध को स्पष्ट करता है, बिना मूल की संक्षिप्तता से उत्पन्न वैकल्पिक वाक्य-संबंध को मिटाए।
lexical_decisions:
- source_word: יִקְשֶׁה בְעֵינֶיךָ
  choice: यह बात तुझे कठिन न लगे
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘तेरी आँखों में कठिन न हो’ है; चुना हुआ रूप उसके बोझिल या आपत्तिजनक लगने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי מֵעִמָּךְ
  choice: जब तू उसे अपने यहाँ से स्वतंत्र करके विदा करे
  rationale: यह समय-सूचक रचना और कानूनी मुक्ति, दोनों को व्यक्त करती है। ‘अपने यहाँ से’ מֵעִמָּךְ के संबंधपरक भाव को बिना ‘घर’ या ‘सेवा’ जोड़कर संकीर्ण किए सुरक्षित रखता है।
- source_word: מִשְׁנֶה שְׂכַר שָׂכִיר
  choice: किराए के मजदूर की दुगुनी मजदूरी के बराबर
  rationale: מִשְׁנֶה का अर्थ दुगुना और שְׂכַר שָׂכִיר का अर्थ किराए पर काम करने वाले मजदूर की मजदूरी है। ‘के बराबर’ सेवा के तुलनात्मक मूल्य को स्पष्ट करता है, जबकि पाठ की संक्षिप्तता के कारण विकल्प पादटिप्पणी में रखा गया है।
- source_word: עֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: उसने छः वर्ष तक तेरी सेवा करके ... काम किया है
  rationale: क्रियात्मक रूप ‘उसने तेरी सेवा की’ को बनाए रखता है और बंधुआ स्थिति को अनावश्यक रूप से संज्ञा द्वारा दोहराता नहीं; वह स्थिति निकटवर्ती व्यवस्था से स्पष्ट है।
- source_word: וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: और याहवे तेरा परमेश्वर ... तुझे आशीष देगा
  rationale: संयोजित पूर्ण क्रिया यहाँ भविष्यसूचक प्रतिज्ञा व्यक्त करती है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: בְּכֹל אֲשֶׁר תַּעֲשֶׂה
  choice: तेरे हर काम में
  rationale: यह संक्षिप्त और स्वाभाविक हिन्दी में व्यक्ति के सभी कार्यों या उपक्रमों का व्यापक अर्थ देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; ‘याहवे’ प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: עבד-संदर्भ में बंधुआ स्थिति को स्पष्ट संज्ञा से व्यक्त करना
  choice: उसने ... तेरी सेवा ... की है
  alternative: तेरे दास ने ... सेवा की है
  rationale: इस पद का रूप क्रियात्मक है और जोर दी गई सेवा के मूल्य पर है। आसपास की व्यवस्था उसकी बंधुआ स्थिति स्पष्ट करती है, इसलिए यहाँ ‘दास’ जोड़ना आवश्यक नहीं।
- issue: मजदूरी की तुलना का आशय
  choice: सेवा द्वारा किए गए काम का मूल्य दुगुनी मजदूरी के बराबर
  alternative: वह किराए के मजदूर की दुगुनी मजदूरी के योग्य रहा
  rationale: इब्रानी वाक्यांश अत्यंत संक्षिप्त है और तुलना को अलग-अलग ढंग से जोड़ा जा सकता है। मुख्य पाठ संदर्भानुकूल मूल्य-तुलना देता है, पर पादटिप्पणी दूसरे संभावित संबंध को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। व्यवस्थाविवरण के एकवचन संबोधन के अनुरूप ‘तू/तेरा’ प्रयोग हुआ है। ‘किराए का मजदूर’ आधुनिक पाठक के लिए स्पष्ट है और वेतनभोगी अस्थायी श्रमिक का भेद बनाए रखता है।
