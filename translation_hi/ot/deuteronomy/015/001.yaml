translation:
  language: hi
  text: हर सात वर्ष के अंत में तुम ऋण-मुक्ति करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקֵּץ
  choice: के अंत में
  rationale: यह מִן + קֵץ का कालवाचक प्रयोग है। ‘के अंत में’ सात-वर्षीय अवधि की समाप्ति को स्वाभाविक हिन्दी में व्यक्त करता है, बिना समय-बिंदु को आवश्यकता से अधिक निश्चित किए।
- source_word: שֶׁבַע שָׁנִים
  choice: हर सात वर्ष
  rationale: शाब्दिक अर्थ ‘सात वर्ष’ है; व्यवस्थागत प्रसंग में चक्र की पुनरावृत्ति निहित है, इसलिए ‘हर सात वर्ष’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: תַּעֲשֶׂה
  choice: घोषणा करना
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ है; यहाँ वह שְׁמִטָּה नामक विधिक व्यवस्था को लागू करने का आदेश देता है। हिन्दी में ‘ऋण-मुक्ति की घोषणा करना’ इस आदेश को सहज ढंग से व्यक्त करता है।
- source_word: שְׁמִטָּה
  choice: ऋण-मुक्ति
  rationale: यह शब्द मूलतः छोड़ देने या मुक्त कर देने को दर्शाता है और निकटवर्ती प्रसंग में ऋण संबंधी मुक्ति के लिए प्रयुक्त है। ‘ऋण-मुक्ति’ आधुनिक पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी व्यापक वैकल्पिक अर्थ सुरक्षित रखती है।
