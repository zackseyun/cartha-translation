base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/008.yaml
  text: Instead[a], you must open your hand to him and surely lend him enough for whatever he lacks.
translation:
  language: hi
  text: बल्कि[a] उसके लिए अपना हाथ खोलो और उसकी आवश्यकता पूरी करने के लिए उसे पर्याप्त उधार दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में, “खोलो, तुम अवश्य खोलोगे ... उधार दो, तुम अवश्य उधार दोगे”—दोहराया हुआ क्रियारूप निर्देश पर जोर देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: बल्कि
  rationale: पिछले पद में कठोर मन रखने और सहायता से इनकार करने की मनाही के विपरीत यह सकारात्मक आज्ञा रखी गई है; इसलिए यहाँ कारणसूचक अर्थ के बजाय विरोधसूचक ‘बल्कि’ स्वाभाविक है।
- source_word: פָתֹחַ תִּפְתַּח
  choice: पूरी तरह खोलना
  rationale: इनफिनिटिव ऐब्सोल्यूट और अपूर्ण क्रिया का मेल आज्ञा पर बल देता है। ‘अपना हाथ खोलना’ इब्रानी उदारता-रूपक को बनाए रखता है, और ‘पूरी तरह’ उसकी प्रबलता व्यक्त करता है।
- source_word: יָדְךָ
  choice: अपना हाथ
  rationale: शाब्दिक ‘हाथ’ उदार सहायता का ठोस और हिंदी में समझ में आने वाला रूपक बनाए रखता है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: पूर्वसर्ग जरूरतमंद व्यक्ति को खुले हाथ से किए जाने वाले कार्य के लाभार्थी के रूप में दिखाता है।
- source_word: וְהַעֲבֵט תַּעֲבִיטֶנּוּ
  choice: उसे अवश्य ... उधार देना
  rationale: עבט का हिफ़ील रूप उधार देने का अर्थ रखता है और दोहराया हुआ क्रियारूप आज्ञा की निश्चितता तथा प्रबलता बताता है; ‘अवश्य’ इसे स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: דֵּי
  choice: इतना
  rationale: यह शब्द पर्याप्त मात्रा को सूचित करता है; आगे के आवश्यकता-सूचक वाक्यांश के साथ ‘इतना’ स्वाभाविक रूप से ‘जितना पर्याप्त हो’ का अर्थ देता है।
- source_word: מַחְסֹרוֹ
  choice: उसकी घटी पूरी करने के लिए
  rationale: מַחְסוֹר अभाव या कमी को दर्शाता है। यह अनुवाद उस अभाव की पूर्ति का आशय स्पष्ट करते हुए मूल विचार बनाए रखता है।
- source_word: אֲשֶׁר יֶחְסַר לוֹ
  choice: जितने की उसे आवश्यकता हो
  rationale: सापेक्ष उपवाक्य जरूरत की सीमा बताता है; यह हिंदी अभिव्यक्ति उसके वास्तविक अभाव के अनुसार पर्याप्त उधार देने का खुला दायरा सुरक्षित रखती है।
theological_decisions:
- issue: सहायता का स्वरूप
  choice: ‘उधार देना’ को स्पष्ट रूप से बनाए रखा गया
  alternative: सामान्य रूप से ‘देना’ या ‘सहायता करना’
  rationale: मूल में עבט का causative रूप ऋण देने को निर्दिष्ट करता है; इसे सामान्य दान में बदलना पद के आर्थिक और वाचा-संबंधी तनाव को मिटा देता।
- issue: आवश्यकता की मात्रा
  choice: उधार उसकी वास्तविक घटी और आवश्यकता के अनुरूप है
  alternative: असीम या मनमानी उदारता का आदेश
  rationale: דֵּי और अभाव-संबंधी शब्द पर्याप्तता को वास्तविक कमी से जोड़ते हैं; अनुवाद न तो दायित्व घटाता है, न मूल से आगे जाकर असीम मात्रा निर्धारित करता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप रखा गया है। ‘अपना हाथ खोलना’ मूल इब्रानी रूपक को सुरक्षित रखता है; ‘पूरी तरह’ और ‘अवश्य’ दोनों प्रबल क्रियारूपों का जोर व्यक्त करते हैं। मुख्य पाठ में [a] चिह्न सम्मिलित है।
