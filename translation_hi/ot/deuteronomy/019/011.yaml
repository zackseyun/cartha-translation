id: DEU.19.11
reference: Deuteronomy 19:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֥ה אִישׁ֙ שֹׂנֵ֣א לְ/רֵעֵ֔/הוּ וְ/אָ֤רַב ל/וֹ֙ וְ/קָ֣ם עָלָ֔י/ו וְ/הִכָּ֥ה/וּ נֶ֖פֶשׁ וָ/מֵ֑ת וְ/נָ֕ס אֶל אַחַ֖ת הֶ/עָרִ֥ים הָ/אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/011.yaml
  text: But if there is a man who hates his neighbor[a], and lies in wait for him, and rises up against him, and strikes him so that he dies, and he flees to one of these cities,
translation:
  language: hi
  text: लेकिन यदि कोई व्यक्ति अपने पड़ोसी से बैर रखता हो, उसकी घात में बैठा हो, उस पर आक्रमण करे और उसे ऐसा घातक प्रहार करे कि वह मर जाए, और इन नगरों में से किसी एक में भाग जाए,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: लेकिन यदि
  rationale: यह पिछले प्रसंग में अनजाने में हुई हत्या के विपरीत एक शर्तपूर्ण मामला प्रस्तुत करता है; इसलिए विरोध और शर्त दोनों व्यक्त किए गए हैं।
- source_word: יִהְיֶה אִישׁ
  choice: कोई व्यक्ति ... हो
  rationale: हिन्दी के विधिक उदाहरण में यह स्वाभाविक अस्तित्वसूचक रचना है; 'व्यक्ति' प्रतिनिधि मामले को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: שֹׂנֵא לְרֵעֵהוּ
  choice: अपने पड़ोसी से बैर रखता हो
  rationale: שֹׂנֵא स्थायी शत्रुता या घृणा दर्शाता है और רֵעַ यहाँ सामाजिक-विधिक अर्थ में पड़ोसी अथवा साथी मनुष्य है। 'बैर रखना' हत्या की पूर्वस्थित शत्रुता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאָרַב לוֹ
  choice: उसकी घात में बैठा हो
  rationale: क्रिया योजनाबद्ध ढंग से छिपकर अवसर की प्रतीक्षा करने का भाव देती है और जानबूझकर किए गए हमले को सूचित करती है।
- source_word: וְקָם עָלָיו
  choice: उस पर टूट पड़े
  rationale: शाब्दिक 'उसके विरुद्ध उठे' का आशय यहाँ शत्रुतापूर्ण आक्रमण है; चुना हुआ पदबंध आधुनिक हिन्दी में उसी सक्रिय हिंसा को स्पष्ट करता है।
- source_word: וְהִכָּהוּ נֶפֶשׁ וָמֵת
  choice: उसे ऐसा घातक प्रहार करे कि वह मर जाए
  rationale: נֶפֶשׁ के साथ הכה प्राणघातक प्रहार का मुहावरा है, और וָמֵת उसके वास्तविक परिणाम को बताता है। अनुवाद प्रहार और मृत्यु दोनों को बनाए रखता है।
- source_word: וְנָס אֶל אַחַת הֶעָרִים הָאֵל
  choice: और फिर इन नगरों में से किसी एक में भाग जाए
  rationale: भागना और निकट संकेतवाचक 'इन' सुरक्षित नगरों के तात्कालिक प्रसंग को बनाए रखते हैं; 'फिर' घटनाक्रम को सहज हिन्दी में जोड़ता है।
theological_decisions:
- issue: जानबूझकर की गई हत्या और अनजाने वध के बीच विधिक भेद
  choice: बैर, घात, आक्रमण और घातक प्रहार की पूरी क्रमिकता बनाए रखी गई है।
  alternative: इसे केवल 'उसकी हत्या कर दे' कहकर संक्षिप्त करना।
  rationale: इब्रानी पाठ पूर्वनियोजन और हिंसक कृत्य को अलग-अलग चरणों में रखता है। उसी क्रम को सुरक्षित रखना बिना अतिरिक्त विधिक या संप्रदायगत व्याख्या जोड़े जानबूझकर हत्या का स्वरूप स्पष्ट करता है।
- issue: וְהִכָּהוּ נֶפֶשׁ וָמֵת में प्रहार और मृत्यु का संबंध
  choice: ऐसा घातक प्रहार करे कि वह मर जाए
  alternative: उसे प्राण पर मारे और वह मर जाए
  rationale: शाब्दिक संरचना हिन्दी में अस्वाभाविक और अस्पष्ट होती। चुना हुआ रूप मुहावरे के प्राणघातक अर्थ तथा अगले क्रियापद में बताई वास्तविक मृत्यु, दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज विधिक-वर्णनात्मक रजिस्टर अपनाया गया है। वाक्य अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि प्राणघातक प्रहार का इब्रानी मुहावरा मुख्य पाठ में स्पष्ट रूप से व्यक्त हो गया है।
