  text: וְ/לֹ֤א יִשָּׁפֵךְ֙ דָּ֣ם נָקִ֔י בְּ/קֶ֣רֶב אַרְצְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וְ/הָיָ֥ה עָלֶ֖י/ךָ דָּמִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/010.yaml
  text: so that innocent blood may not be shed in the midst of your land that Yahweh your God is giving you as an inheritance[a], and bloodguilt would be upon you.
translation:
  language: hi
  text: ताकि तुम्हारे उस देश में, जिसे तुम्हारा परमेश्वर याहवे तुम्हें विरासत के रूप में दे रहा है, निर्दोष का खून न बहाया जाए और तुम पर रक्तदोष न हो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, शाब्दिक: “तुम पर खून हो”; यह इब्रानी मुहावरा निर्दोष रक्त बहाए जाने की कानूनी जवाबदेही, अर्थात् रक्तदोष, को दर्शाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁפֵךְ
  choice: न बहाया जाए
  rationale: שׁפך के निफ़अल रूप का निष्क्रिय अर्थ यहाँ रक्त बहाए जाने को व्यक्त करता है; हत्या-विधि के संदर्भ में यह स्वाभाविक हिंदी है।
- source_word: דָּם נָקִי
  choice: निर्दोष का खून
  rationale: यह कानूनी-नैतिक पदबंध ऐसे व्यक्ति के रक्त को सूचित करता है जो मृत्यु का दोषी नहीं; हिंदी में यह अर्थ 'निर्दोष का खून' से स्पष्ट और सहज रहता है।
- source_word: בְּקֶרֶב אַרְצְךָ
  choice: तुम्हारे देश में
  rationale: קֶרֶב का मूल भाव 'बीच/भीतर' है; हिंदी में 'देश में' उसी स्थानगत अर्थ को बिना अस्वाभाविक कठोरता के व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णी व्यक्तिगत नाम को हिंदी में प्रचलित लिप्यंतरण 'यहोवा' से प्रस्तुत किया गया है, न कि किसी उपाधि से।
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: तुम्हें विरासत के रूप में दे रहा है
  rationale: नֹתֵן का जारी वर्तमान भाव और נַחֲלָה का पैतृक/विरासती अधिकार दोनों इस वाक्यांश में सुरक्षित हैं।
- source_word: וְהָיָה עָלֶיךָ דָּמִים
  choice: और तुम पर खून का दोष न आए
  rationale: कानूनी संदर्भ में बहुवचन דָּמִים रक्तपात की जवाबदेही या दोष को दर्शाता है; 'तुम पर ... दोष आए' עַל की दायित्व-वाचक संरचना को स्वाभाविक हिंदी में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। हिंदी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला लिप्यंतरण 'यहोवा' नाम को उपाधि से बदलने के बजाय सुरक्षित रखता है।
- issue: וְהָיָה के परिणामसूचक भाव और निषेध का दायरा
  choice: और तुम पर खून का दोष न आए
  alternative: और तुम पर खून का दोष आएगा
  rationale: आरंभिक וְלֹא और उद्देश्यसूचक संदर्भ में अंतिम खंड को उसी रोके जाने वाले परिणाम के रूप में पढ़ना हिंदी में प्रसंगानुकूल है। फिर भी हिब्रू समन्वय को कारण-परिणाम की अतिरिक्त व्याख्या से नहीं बढ़ाया गया।
translation_notes:
  register: आधुनिक मानक हिंदी; विधिक और गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज। एकवचन संबोधन को 'तुम्हारे/तुम्हें/तुम' से बनाए रखा गया है।
