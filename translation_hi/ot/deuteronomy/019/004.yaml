source:
  edition: WLC
  text: וְ/זֶה֙ דְּבַ֣ר הָ/רֹצֵ֔חַ אֲשֶׁר יָנ֥וּס שָׁ֖מָּ/ה וָ/חָ֑י אֲשֶׁ֨ר יַכֶּ֤ה אֶת רֵעֵ֨/הוּ֙ בִּ/בְלִי דַ֔עַת וְ/ה֛וּא לֹא שֹׂנֵ֥א ל֖/וֹ מִ/תְּמֹ֥ל שִׁלְשֹֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/004.yaml
  text: 'This is the provision for the manslayer who may flee there and live: when he strikes his neighbor without intent[a], and he did not hate him in times past.'
translation:
  language: hi
  text: 'जान लेने वाले के विषय में यह नियम है—जो वहाँ भागकर जाए और जीवित रहे: अर्थात् वह व्यक्ति जो अपने पड़ोसी पर अनजाने में प्रहार करे और पहले से[a] उससे बैर न रखता हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बीते कल और परसों से।” यह मुहावरा “पहले से” या “पूर्व समय में” के अर्थ में है।
    reason: इब्रानी मुहावरे का शाब्दिक रूप और उसका आशय दोनों सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: דְּבַר הָרֹצֵחַ
  choice: जान लेनेवाले के विषय में यह नियम
  rationale: कानूनी संदर्भ में דְּבַר किसी मामले को नियंत्रित करनेवाले नियम या प्रावधान को दर्शाता है। הָרֹצֵחַ यहाँ जान लेनेवाले व्यक्ति के लिए व्यापक पद है; ‘हत्यारा’ जानबूझकर हत्या करने का अर्थ दे सकता है, इसलिए उससे बचा गया है।
- source_word: יָנוּס שָׁמָּה וָחָי
  choice: वहाँ भागकर जाए और जीवित रहे
  rationale: इब्रानी क्रियाक्रम शरणनगर की ओर भागने और उसके फलस्वरूप जीवित रहने को व्यक्त करता है। यह अनिवार्य आज्ञा की अपेक्षा उस पात्र व्यक्ति का वर्णन है।
- source_word: יַכֶּה אֶת רֵעֵהוּ
  choice: अपने पड़ोसी को ... मारा हो
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ है। हिन्दी ‘मारना’ यहाँ प्रहार और प्राण लेने—दोनों की संदर्भगत गुंजाइश बनाए रखता है, जबकि पूरे अनुच्छेद से मृत्यु का परिणाम स्पष्ट होता है।
- source_word: בִּבְלִי דַעַת
  choice: अनजाने में
  rationale: शाब्दिक अर्थ ‘ज्ञान के बिना’ है; इस न्यायिक संदर्भ में ‘अनजाने में’ सहज हिन्दी में जानकारी और अभिप्राय के अभाव को व्यक्त करता है।
- source_word: לֹא שֹׂנֵא לוֹ
  choice: उससे बैर न रखता हो
  rationale: निषेध के साथ कृदंत पहले से चली आ रही शत्रुतापूर्ण मनोवृत्ति के अभाव को बताता है। ‘बैर रखना’ आधुनिक हिन्दी में इस स्थायी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: पहले से
  rationale: यह इब्रानी मुहावरा पूर्व समय या पहले से चली आ रही दशा को दर्शाता है। सहज पाठ में ‘पहले से’ रखा गया है और शाब्दिक चित्र फुटनोट में सुरक्षित है।
theological_decisions:
- issue: הָרֹצֵחַ में नैतिक दोष का स्तर
  choice: जान लेनेवाला
  alternative: हत्यारा
  rationale: पद इस प्रसंग में मृत्यु का कारण बने व्यक्ति को दर्शाता है, पर पद 4 स्वयं अनजाने कृत्य और पुराने बैर के अभाव को निर्दिष्ट करता है। ‘हत्यारा’ जानबूझकर किए गए अपराध का निर्णय पहले ही सुना देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और कानूनी प्रसंग के अनुरूप गरिमापूर्ण रखी गई है। ‘हत्यारा’ जैसे दोष पहले से निर्धारित करनेवाले शब्द से बचते हुए ‘जान लेनेवाला’ चुना गया है। मुख्य पाठ में फुटनोट चिह्न [a] संबंधित मुहावरे के ठीक बाद रखा गया है।
