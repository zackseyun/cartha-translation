source:
  edition: WLC
  text: לֹ֤א תַסִּיג֙ גְּב֣וּל רֵֽעֲ/ךָ֔ אֲשֶׁ֥ר גָּבְל֖וּ רִאשֹׁנִ֑ים בְּ/נַחֲלָֽתְ/ךָ֙ אֲשֶׁ֣ר תִּנְחַ֔ל בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/014.yaml
  text: You shall not move your neighbor’s boundary marker[a], which the former generations set, in your inheritance that you will inherit in the land that Yahweh your God is giving you to possess.
translation:
  language: hi
  text: तुम अपने पड़ोसी का सीमा-चिह्न[a] न खिसकाना, जिसे पूर्वजों ने तुम्हारी उस विरासत में निर्धारित किया था जो तुम्हें उस देश में विरासत के रूप में मिलेगी, जिसे तुम्हारा परमेश्वर याहवे तुम्हें अपने अधिकार में लेने के लिए दे रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सीमा-रेखा।” इब्रानी शब्द संपत्ति की सीमा को दर्शाता है, जो किसी सीमा-चिह्न द्वारा निर्धारित होती थी।
    reason: शाब्दिक विकल्प; इब्रानी גְּבוּל सीमा और उसे दर्शाने वाले ठोस चिह्न, दोनों के संदर्भ में प्रयुक्त हो सकता है।
lexical_decisions:
- source_word: תַסִּיג
  choice: न खिसकाना
  rationale: हिफ़िल रूप यहाँ सीमा को पीछे सरकाकर पड़ोसी की भूमि पर अतिक्रमण करने को दर्शाता है। ‘खिसकाना’ वस्तु को हटाए बिना उसकी जगह बदलने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: גְּבוּל
  choice: सीमा का चिह्न
  rationale: इस संपत्ति-कानून के संदर्भ में शब्द उस चिह्न को सूचित करता है जिससे भूमि की सीमा निर्धारित होती थी; यह केवल अमूर्त ‘सीमा’ से अधिक स्पष्ट है।
- source_word: רֵעֲךָ
  choice: अपने पड़ोसी की
  rationale: कानूनी-सामुदायिक संदर्भ में רֵעַ निकटवर्ती भू-स्वामी अथवा समुदाय के दूसरे सदस्य को दर्शाता है; ‘पड़ोसी’ यहाँ सहज और सटीक है।
- source_word: גָּבְלוּ
  choice: ठहराया था
  rationale: क्रिया सीमा निर्धारित या स्थापित करने का भाव देती है। ‘ठहराया था’ पहले किए गए स्थायी सीमांकन को व्यक्त करता है।
- source_word: רִאשֹׁנִים
  choice: पहले के लोगों ने
  rationale: मूल का विशेषण संज्ञा के रूप में उन पूर्ववर्तियों को सूचित करता है जिन्होंने आरंभिक सीमाएँ निर्धारित की थीं। ‘पहले के लोग’ ‘पूर्वजों’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: בְּנַחֲלָתְךָ
  choice: तुम्हारी उस विरासत में
  rationale: ‘विरासत’ नחלाह के कानूनी और वाचा-संबंधी भूमि-अंश के अर्थ को बनाए रखती है।
- source_word: תִּנְחַל
  choice: जो तुम्हें ... मिलेगी
  rationale: हिब्रू क्रिया विरासत के रूप में प्राप्त होने का भाव रखती है। हिंदी में ‘विरासत’ के साथ ‘विरासत में पाओगे’ की पुनरुक्ति से बचते हुए भविष्य का अर्थ स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी पाठकों में प्रचलित देवनागरी रूप ‘यहोवा’ के द्वारा चतुरक्षरीय व्यक्तिगत ईश-नाम को किसी उपाधि से बदले बिना रखा गया है।
- source_word: נֹתֵן לְךָ
  choice: तुम्हें ... दे रहा है
  rationale: वर्तमान कृदंत परमेश्वर की चल रही अथवा निश्चित दान-क्रिया को दर्शाता है; ‘दे रहा है’ उसके पक्ष को सहज हिंदी में रखता है।
- source_word: לְרִשְׁתָּהּ
  choice: अधिकार में लेने के लिए
  rationale: ירשׁ का यह रूप देश पर अधिकार प्राप्त कर उसे अपने अधीन रखने का अर्थ देता है; ‘अधिकार में लेना’ केवल वहाँ रहने से अधिक पूर्ण अर्थ व्यक्त करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया; हिंदी में व्यापक रूप से पहचाना जाने वाला नामरूप ‘यहोवा’ रखा गया है, जबकि ‘याहवे’ अधिक निकट वैकल्पिक लिप्यंतरण है।
- issue: नַחֲלָה और ירשׁ की भूमि-विषयक भाषा
  choice: विरासत; अधिकार में लेना
  alternative: जायदाद; कब्ज़ा करना
  rationale: चुने हुए शब्द भूमि के वैधानिक-वाचा संबंधी दान और प्राप्ति को बनाए रखते हैं, पर ‘कब्ज़ा’ से पैदा होने वाले अवैध बलपूर्वक अधिग्रहण के आधुनिक संकेत से बचते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कानूनी-उपदेशात्मक स्वर रखा गया है। एकवचन ‘तुम’ मूल के एकवचन संबोधन को दर्शाता है। वाक्य-विन्यास को हिंदी में स्वाभाविक बनाया गया है, जबकि ‘विरासत,’ देश का दान, और उसे अधिकार में लेने की वाचा-संबंधी शब्दावली सुरक्षित रखी गई है।
