  text: וְ/אִם יַרְחִ֞יב יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת גְּבֻ֣לְ/ךָ֔ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶ֑י/ךָ וְ/נָ֤תַן לְ/ךָ֙ אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר דִּבֶּ֖ר לָ/תֵ֥ת לַ/אֲבֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/008.yaml
  text: And if Yahweh your God enlarges your territory[a], as he swore to your fathers, and gives you all the land that he promised to give to your fathers,
translation:
  language: hi
  text: और यदि याहवे, तुम्हारा परमेश्वर, तुम्हारी सीमा बढ़ाए, जैसा उसने तुम्हारे पुरखाओं[a] से शपथपूर्वक वचन किया था, और तुम्हें वह सारा देश दे, जिसे उसने तुम्हारे पुरखाओं को देने की बात कही थी,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पूर्वजों”; इस पद में “पुरखाओं” के दोनों प्रयोगों के लिए। इब्रानी में शाब्दिक अर्थ “पिताओं” है और संकेत इस्राएल के कुलपिताओं की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: यह संयोजन पिछली कानूनी शिक्षा से संबंध बनाए रखते हुए शर्त प्रस्तुत करता है।
- source_word: יַרְחִיב
  choice: बढ़ाए
  rationale: हिफ़ील रूप का अर्थ चौड़ा या विस्तृत करना है; सीमा के विस्तार के लिए ‘बढ़ाए’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक रूप का सीधा और प्रचलित अनुवाद।
- source_word: גְּבֻלְךָ
  choice: तुम्हारी सीमा
  rationale: גְּבוּל सीमा, भू-भाग या क्षेत्र को सूचित कर सकता है; ‘सीमा बढ़ाए’ यहाँ भू-भाग के विस्तार को सहज रूप से व्यक्त करता है।
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: जैसा उसने ... से शपथ खाई थी
  rationale: यह पूर्वजों से की गई शपथ की ओर संकेत करता है; हिन्दी में पूर्ण भूतकाल प्रसंगगत पूर्वता को स्पष्ट करता है।
- source_word: לַאֲבֹתֶיךָ
  choice: तुम्हारे पुरखाओं से
  rationale: אָבוֹת का मूल पुरुषवाचक पारिवारिक भाव सुरक्षित रहता है और वाचा के कुलपिताओं की ओर संकेत होता है; शपथ के साथ हिन्दी में ‘से’ स्वाभाविक है।
- source_word: וְנָתַן לְךָ
  choice: और तुम्हें ... दे
  rationale: वाव सहित पूर्ण क्रिया भविष्याभिमुख शर्त का अगला भाग है; ‘यदि ... बढ़ाए ... और ... दे’ हिन्दी में उसी शर्त को स्वाभाविक ढंग से जारी रखता है।
- source_word: כָּל הָאָרֶץ
  choice: वह सारा देश
  rationale: यहाँ אֶרֶץ पृथ्वी नहीं, इस्राएल से प्रतिज्ञा किए गए देश को दर्शाता है।
- source_word: אֲשֶׁר דִּבֶּר לָתֵת
  choice: जिसे देने की बात उसने ... से कही थी
  rationale: यह अनुवाद דִּבֶּר के ‘कहा/बोला’ अर्थ को बनाए रखता है और वाचा की प्रतिज्ञा का आशय भी स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַאֲבֹתֶיךָ
  choice: तुम्हारे पुरखाओं से
  rationale: इब्रानी पुनरावृत्ति को वाचा की निरंतरता के लिए हिन्दी में भी दोहराया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है; ‘याहवे’ उसका व्यापक रूप से मान्य लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: אבות को पुरुषवाचक ‘पुरखाओं’ या व्यापक ‘पूर्वजों’ के रूप में देना
  choice: पुरखाओं
  alternative: पूर्वजों
  rationale: मूल में शाब्दिक रूप से ‘पिता’ का बहुवचन है और यहाँ इस्राएल के कुलपिताओं की ओर संकेत है। ‘पुरखाओं’ इस पुरुषवाचक ऐतिहासिक संदर्भ को स्वाभाविक हिन्दी में बनाए रखता है; ‘पूर्वजों’ संभावित व्यापक विकल्प है।
- issue: דִּבֶּר को ‘प्रतिज्ञा की’ या ‘कहा’ के रूप में देना
  choice: देने की बात ... कही थी
  alternative: देने की प्रतिज्ञा की थी
  rationale: वाचा का प्रसंग प्रतिज्ञा का भाव देता है, पर क्रिया का प्रत्यक्ष अर्थ ‘कहा/बोला’ है। मुख्य पाठ दोनों के बीच का तनाव बनाए रखता है और आवश्यकता से अधिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। पद अगले पद तक चलने वाली शर्त का आरंभ है, इसलिए अंत में अल्पविराम रखा गया है। एकवचन ‘तुम्हारा/तुम्हें’ इब्रानी के सामूहिक एकवचन को सुरक्षित रखता है।
