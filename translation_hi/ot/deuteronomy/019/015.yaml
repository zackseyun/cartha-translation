source:
  edition: WLC
  text: לֹֽא יָקוּם֩ עֵ֨ד אֶחָ֜ד בְּ/אִ֗ישׁ לְ/כָל עָוֺן֙ וּ/לְ/כָל חַטָּ֔את בְּ/כָל חֵ֖טְא אֲשֶׁ֣ר יֶֽחֱטָ֑א עַל פִּ֣י שְׁנֵ֣י עֵדִ֗ים א֛וֹ עַל פִּ֥י שְׁלֹשָֽׁה עֵדִ֖ים יָק֥וּם דָּבָֽר־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/015.yaml
  text: A single witness shall not stand against a man for any iniquity or for any sin[a], in connection with any sin that he commits[c][b]; on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand.
translation:
  language: hi
  text: किसी व्यक्ति के विरुद्ध किसी भी दोष या किसी भी पाप के संबंध में—किसी भी ऐसे पाप के संबंध में जो उसने किया हो—एक गवाह पर्याप्त नहीं होगा। दो गवाहों की गवाही पर या तीन गवाहों की गवाही पर कोई मामला स्थापित होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “एक गवाह ... खड़ा न होगा; दो गवाहों के मुँह पर या तीन गवाहों के मुँह पर कोई बात खड़ी होगी।” इब्रानी में दोनों स्थानों पर एक ही क्रिया है, जिसका कानूनी आशय किसी बात का मान्य या स्थापित होना है।'
    reason: मूल इब्रानी मुहावरे (‘के मुँह पर’) तथा יָקוּם ... יָקוּם की कानूनी समानांतरता को दर्शाने के लिए।
lexical_decisions:
- source_word: יָקוּם ... יָקוּם
  choice: गवाही मान्य नहीं होगी ... मामला प्रमाणित होगा
  rationale: קום का कानूनी अर्थ वैध ठहरना या स्थापित होना है। हिन्दी में दोनों स्थानों पर एक ही क्रिया रखना अस्वाभाविक बनता; इसलिए पहले खंड में गवाही के लिए ‘मान्य’ और दूसरे में मामले के लिए ‘प्रमाणित’ रखा गया, जबकि कानूनी समानांतरता अर्थतः बनी रहती है।
- source_word: עֵד אֶחָד
  choice: केवल एक गवाह
  rationale: यह अकेले गवाह की अपर्याप्तता को स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּאִישׁ
  choice: किसी व्यक्ति के विरुद्ध
  rationale: कानूनी प्रसंग में בְּ विरोध में दी गई गवाही दर्शाता है। אִישׁ पुल्लिंग एकवचन है, पर यहाँ प्रतिनिधिक और सामान्य कानूनी अर्थ रखता है; ‘व्यक्ति’ उस व्यापक दायरे को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: לְכָל עָוֺן וּלְכָל חַטָּאת
  choice: किसी भी अधर्म या किसी भी पाप के विषय में
  rationale: ‘अधर्म’ עָוֺן के नैतिक-कानूनी भार को और ‘पाप’ חַטָּאת को अलग शब्दों में सुरक्षित रखता है।
- source_word: בְּכָל חֵטְא אֲשֶׁר יֶחֱטָא
  choice: उसके किए किसी भी पाप के संबंध में
  rationale: मूल की व्यापकता और חטא की पुनरावृत्ति को बनाए रखते हुए ‘जिस पाप को वह पाप करे’ जैसी अस्वाभाविक हिन्दी से बचता है।
- source_word: עַל פִּי
  choice: की गवाही पर
  rationale: शाब्दिक अर्थ ‘के मुँह पर’ है, पर कानूनी मुहावरे में इसका आशय गवाही को प्रमाण का आधार बनाना है।
- source_word: דָּבָר
  choice: मामला
  rationale: न्यायिक संदर्भ में דָּבָר विचाराधीन विषय या मुकदमे को दर्शाता है; ‘मामला’ आधुनिक हिन्दी में स्पष्ट और पर्याप्त रूप से व्यापक है।
theological_decisions:
- issue: אִישׁ में प्रतिनिधिक पुल्लिंग भाषा
  choice: किसी व्यक्ति
  alternative: किसी पुरुष
  rationale: यह विधान सामान्य न्यायिक सिद्धांत देता है। हिन्दी में ‘किसी पुरुष’ अनावश्यक रूप से केवल पुरुषों तक सीमित समझा जा सकता है, जबकि स्रोत का पुल्लिंग एकवचन प्रतिनिधिक कानूनी प्रयोग है।
- issue: यָקוּם की कानूनी समानांतरता
  choice: गवाही मान्य नहीं होगी ... मामला प्रमाणित होगा
  alternative: एक गवाह नहीं ठहरेगा ... बात ठहरेगी
  rationale: शाब्दिक ‘ठहरना’ पुनरावृत्ति को अधिक दिखाता है, पर आधुनिक हिन्दी में कानूनी आशय अस्पष्ट है। चुना गया रूप गवाही की अमान्यता और मामले की स्थापना के बीच मूल तनाव और संबंध स्पष्ट करता है।
translation_notes:
  register: आधुनिक, गरिमामय और सामान्य पाठक के लिए स्पष्ट न्यायिक हिन्दी। मूल के तीन पाप-संबंधी पदों की संचयी व्यापकता को यथासंभव बनाए रखा गया है; अनावश्यक सांप्रदायिक शब्दावली से बचा गया है।
