source:
  edition: WLC
  text: פֶּן יִרְדֹּף֩ גֹּאֵ֨ל הַ/דָּ֜ם אַחֲרֵ֣י הָ/רֹצֵ֗חַ כִּי יֵחַם֮ לְבָב/וֹ֒ וְ/הִשִּׂיג֛/וֹ כִּֽי יִרְבֶּ֥ה הַ/דֶּ֖רֶךְ וְ/הִכָּ֣ה/וּ נָ֑פֶשׁ וְ/ל/וֹ֙ אֵ֣ין מִשְׁפַּט מָ֔וֶת כִּ֠י לֹ֣א שֹׂנֵ֥א ה֛וּא ל֖/וֹ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/006.yaml
  text: otherwise the avenger of blood may pursue the manslayer[a], because his heart is hot, and overtake him because the way is long, and strike him dead, though he did not deserve the death penalty[b], since he had not hated him previously.
translation:
  language: hi
  text: ऐसा न हो कि खून का बदला लेनेवाला उस व्यक्ति का पीछा करे जिसने किसी को मार डाला था, क्योंकि उसका मन क्रोध से भड़का हुआ हो, और रास्ता लंबा होने के कारण उसे जा पकड़े और जान से मार डाले; जबकि उसके लिए मृत्यु-दंड का विधान नहीं था, क्योंकि वह पहले से उससे बैर नहीं रखता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: ऐसा न हो कि
  rationale: यह नगरों को निकट रखने के निवारक उद्देश्य को व्यक्त करता है और चेतावनी का बल बनाए रखता है।
- source_word: גֹּאֵל הַדָּם
  choice: खून का बदला लेनेवाला
  rationale: यह मृतक के निकट संबंधी की उस विधिक-पारिवारिक भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है जो रक्तपात का प्रतिशोध लेता था।
- source_word: הָרֹצֵחַ
  choice: मारनेवाला
  rationale: यहाँ व्यक्ति ने बिना पहले से बैर रखे किसी को मारा है; इसलिए ‘हत्यारा’ जानबूझकर हत्या करने का ऐसा अर्थ दे सकता है जो प्रसंग में अनुचित होगा।
- source_word: כִּי יֵחַם לְבָבוֹ
  choice: क्रोध से उसका मन भड़का होने के कारण
  rationale: इब्रानी में हृदय के गरम होने का मुहावरा तीव्र, भड़के हुए क्रोध को दर्शाता है; हिन्दी रूप अर्थ और सजीवता दोनों रखता है।
- source_word: וְהִשִּׂיגוֹ
  choice: उसे जा पकड़े
  rationale: पीछा करके उस तक पहुँच जाने का स्वाभाविक हिन्दी वर्णन।
- source_word: כִּי יִרְבֶּה הַדֶּרֶךְ
  choice: क्योंकि रास्ता लंबा है
  rationale: मूल के यात्रा-संबंधी ठोस चित्र और कारणात्मक संबंध को बनाए रखता है।
- source_word: וְהִכָּהוּ נָפֶשׁ
  choice: उसे जान से मार डाले
  rationale: मूल का अर्थ प्राणघातक प्रहार करके मार डालना है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וְלוֹ אֵין מִשְׁפַּט מָוֶת
  choice: उस पर मृत्यु-दंड लागू नहीं होता था
  rationale: यह कानूनी आशय स्पष्ट करता है कि वह वैधानिक रूप से मृत्यु-दंड के अधीन नहीं था, बिना केवल भावनात्मक ‘योग्यता’ की भाषा अपनाए।
- source_word: כִּי לֹא שֹׂנֵא הוּא לוֹ
  choice: क्योंकि वह ... उससे बैर नहीं रखता था
  rationale: पहले से शत्रुता का अभाव आकस्मिक वध और दुर्भावनापूर्ण हत्या के बीच कानूनी भेद का आधार है।
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: पहले से
  rationale: यह इब्रानी काल-सूचक मुहावरे का स्वाभाविक आधुनिक हिन्दी अर्थ देता है।
theological_decisions:
- issue: अनजाने में मारनेवाले की मृत्यु-दंड संबंधी स्थिति
  choice: उस पर मृत्यु-दंड लागू नहीं होता था
  alternative: वह मृत्यु-दंड के योग्य नहीं था
  rationale: चुना हुआ रूप מִשְׁפַּט के विधिक अर्थ को प्रमुख रखता है और नैतिक पात्रता के बारे में मूल से अधिक व्यापक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मारनेवाला’ प्रसंग के कानूनी भेद को सुरक्षित रखता है, जबकि ‘खून का बदला लेनेवाला’ पारिवारिक प्रतिशोध की विशिष्ट भूमिका को सामान्य पाठक के लिए समझने योग्य बनाता है।
