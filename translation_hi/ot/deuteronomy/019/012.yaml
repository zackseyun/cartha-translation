  yaml_path: translation/ot/deuteronomy/019/012.yaml
  text: then the elders of his city shall send and take him from there and hand him over to the avenger of blood[a], and he shall die.
translation:
  language: hi
  text: तब उसके नगर के बुज़ुर्ग भेजकर उसे वहाँ से ले आएँ और उसे खून का बदला लेनेवाले[a] के हाथ में सौंप दें, और वह मर जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खून का प्रतिशोध लेनेवाला।” हिब्रू पद גֹּאֵל הַדָּם उस व्यक्ति के लिए एक पारिभाषिक कानूनी अभिव्यक्ति है, जिसे बहाए गए खून का बदला लेने का दायित्व था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלְחוּ
  choice: लोगों को भेजकर
  rationale: कानूनी प्रसंग में यह रूप आदेशात्मक भाव रखता है; अगले क्रियापद के साथ स्वाभाविक हिन्दी में संयुक्त क्रिया के रूप में अनूदित है।
- source_word: זִקְנֵי עִירוֹ
  choice: उसके नगर के पुरनिए
  rationale: यह नगर के मान्य वरिष्ठ अगुओं को दर्शाता है; ‘पुरनिए’ बाइबलीय कानूनी संदर्भ में गरिमापूर्ण और समझने योग्य शब्द है।
- source_word: וְלָקְחוּ אֹתוֹ מִשָּׁם
  choice: उसे वहाँ से मँगवाएँ
  rationale: לקח का मूल भाव ‘लेना’ है; भेजने के बाद वहाँ से बुलाकर ले आने का आशय आधुनिक हिन्दी में ‘मँगवाएँ’ से स्वाभाविक रूप में व्यक्त होता है, बिना अनावश्यक हिंसक बल जोड़े।
- source_word: וְנָתְנוּ אֹתוֹ בְּיַד
  choice: उसे ... के हाथ में सौंप दें
  rationale: हिब्रू मुहावरा किसी व्यक्ति के अधिकार में दे देने को व्यक्त करता है; हिन्दी में ‘के हाथ में सौंप दें’ अर्थ और चित्रात्मकता दोनों बनाए रखता है।
- source_word: גֹּאֵל הַדָּם
  choice: खून का बदला लेनेवाले
  rationale: यह बहाए गए खून का बदला लेने के लिए उत्तरदायी व्यक्ति का पारिभाषिक कानूनी पद है। अनुवाद भूमिका को स्पष्ट रखता है और स्रोत की रक्त-संबंधी भाषा को बचाता है।
- source_word: וָמֵת
  choice: और वह मार डाला जाए
  rationale: यह सौंपे जाने के बाद निर्धारित कानूनी परिणाम बताता है। कर्मवाच्य हिन्दी में प्रसंगानुकूल है और यह स्पष्ट करता है कि अभिप्राय केवल स्वाभाविक मृत्यु नहीं है।
