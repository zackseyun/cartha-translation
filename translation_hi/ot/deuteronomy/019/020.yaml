  text: וְ/הַ/נִּשְׁאָרִ֖ים יִשְׁמְע֣וּ וְ/יִרָ֑אוּ וְ/לֹֽא יֹסִ֨פוּ לַ/עֲשׂ֜וֹת ע֗וֹד כַּ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה בְּ/קִרְבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/020.yaml
  text: And those who remain shall hear and fear[c][b][a], and shall never again do such an evil thing in your midst.
translation:
  language: hi
  text: और जो बाकी हैं वे सुनेंगे और डरेंगे, और फिर कभी तुम्हारे बीच ऐसा बुरा काम नहीं करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנִּשְׁאָרִים
  choice: जो बाकी हैं
  rationale: निफ़ाल कृदंत का अर्थ दंड के बाद शेष रहने वाले लोग है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יִשְׁמְעוּ
  choice: यह सुनेंगे
  rationale: मूल अर्थ ‘सुनना’ है; हिन्दी में ‘यह’ पूर्ववर्ती घटना की सूचना मिलने का आशय स्वाभाविक रूप से स्पष्ट करता है।
- source_word: וְיִרָאוּ
  choice: और डरेंगे
  rationale: दंड को सुनकर उत्पन्न भय और उसके निवारक प्रभाव को सीधे बनाए रखता है।
- source_word: וְלֹא יֹסִפוּ לַעֲשׂוֹת עוֹד
  choice: और फिर कभी ... नहीं करेंगे
  rationale: יסף तथा עוד के संयुक्त अर्थ ‘दोबारा न करना’ को मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: ऐसा बुरा काम
  rationale: כ की तुलनात्मक शक्ति और דבר के प्रसंगगत अर्थ ‘काम/कृत्य’ दोनों को स्पष्ट व स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּקִרְבֶּךָ
  choice: तुम्हारे बीच
  rationale: समुदाय के भीतर का अर्थ रखता है और एकवचन संबोधन द्वारा इस्राएल को सामूहिक इकाई के रूप में संबोधित करना भी सुरक्षित रखता है।
theological_decisions:
- issue: בְּקִרְבֶּךָ में संबोधन की वचन-संख्या
  choice: ‘तुम्हारे बीच’ के द्वारा एकवचन सामूहिक संबोधन बनाए रखना
  alternative: ‘तुम लोगों के बीच’ कहकर बहुवचन को स्पष्ट करना
  rationale: इब्रानी प्रत्यय द्वितीय पुरुष पुल्लिंग एकवचन है और इस्राएल को सामूहिक रूप से संबोधित करता है; हिन्दी का ‘तुम्हारे’ इस रूप को स्वाभाविक ढंग से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; न्यायिक और वाचा-संबंधी गंभीरता को बनाए रखते हुए सहज, स्पष्ट और सामान्य पाठकों के लिए बोधगम्य भाषा।
