  text: Therefore I am commanding you[a], saying, ‘You shall set apart three cities for yourself.’
translation:
  language: hi
  text: 'इसलिए मैं तुझे यह आज्ञा देता हूँ: ‘तू अपने लिए तीन नगर अलग ठहराना।’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू अपने लिए तीन नगर निर्धारित करना।” इब्रानी क्रिया का अर्थ “अलग करना,” “अलग ठहराना,” अथवा इस संदर्भ में “निर्धारित करना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पद पिछले निर्देश से निष्कर्ष निकालता है; ‘इसलिए’ उसके तार्किक संबंध को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָנֹכִי מְצַוְּךָ
  choice: मैं तुझे यह आज्ञा देता हूँ
  rationale: स्वतंत्र सर्वनाम אָנֹכִי वक्ता पर हल्का बल देता है, जबकि participial מְצַוְּךָ वर्तमान निर्देश को व्यक्त करता है। आधुनिक हिंदी में यह वाक्यांश प्रत्यक्ष और गरिमापूर्ण है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह infinitive आदेश की विषय-वस्तु का परिचय देता है। हिंदी में उद्धरण से पहले कोलन रखना ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक है और वही कार्य करता है।
- source_word: שָׁלֹשׁ עָרִים
  choice: तीन नगर
  rationale: संख्या और संज्ञा का सीधा, संदर्भानुकूल अनुवाद।
- source_word: תַּבְדִּיל
  choice: अलग ठहराना
  rationale: בדל के हिफ़ील रूप में अलग करने या किसी विशेष उद्देश्य के लिए अलग निर्धारित करने का भाव है। ‘अलग ठहराना’ शाब्दिक पृथक्करण और आधिकारिक निर्धारण, दोनों को बनाए रखता है।
- source_word: לָךְ
  choice: अपने लिए
  rationale: द्वितीय पुरुष एकवचन प्रत्यय लाभ अथवा उपयोग के भाव को व्यक्त करता है; ‘अपने लिए’ इसे स्पष्ट रखते हुए सामूहिक इस्राएल को किए गए एकवचन संबोधन को सुरक्षित रखता है।
theological_decisions:
- issue: वाचा की व्यवस्था में द्वितीय पुरुष पुल्लिंग एकवचन संबोधन
  choice: ‘तू/तुझे/अपने’ के एकवचन रूप बनाए रखे गए हैं।
  alternative: सामूहिक श्रोताओं को स्पष्ट करने के लिए बहुवचन ‘तुम’ प्रयोग करना।
  rationale: इब्रानी वाचा-संबंधी निर्देश में इस्राएल को प्रायः एकवचन में संबोधित किया जाता है। एकवचन बनाए रखने से मूल की वक्तृता सुरक्षित रहती है और कोई व्याख्यात्मक बहुवचन आरोपित नहीं होता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कानूनी-उपदेशात्मक स्वर रखा गया है। ‘नगर’ बाइबलीय भूगोल में स्वाभाविक है। उद्धरण का आदेशात्मक रूप ‘अलग ठहराना’ हिंदी में विधिक निर्देश की शैली को दर्शाता है।
