base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/001.yaml
  text: When Yahweh your God cuts off the nations whose land Yahweh your God is giving you[a], and you dispossess them and dwell in their cities and houses,
translation:
  language: hi
  text: जब याहवे तुम्हारा परमेश्वर उन जातियों को हटा देगा[a], जिनका देश याहवे तुम्हारा परमेश्वर तुम्हें दे रहा है, और तुम उन्हें बेदखल करके उनके नगरों और घरों में बस जाओगे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नष्ट कर देगा” अथवा “मिटा देगा”; इब्रानी में शाब्दिक अर्थ “काटकर अलग कर देगा” है।
    reason: יַכְרִית के ठोस इब्रानी मुहावरे तथा हटाने और विनाश, दोनों संभावित अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ आगामी आज्ञाओं की अपेक्षित परिस्थिति का परिचय है; इसलिए कालवाचक ‘जब’ स्वाभाविक है, केवल संभाव्य ‘यदि’ नहीं।
- source_word: יַכְרִית
  choice: मिटा देगा
  rationale: हिफ़ील रूप का अर्थ इन जातियों को हटा देना या उनका अंत कर देना है। ‘मिटा देगा’ आधुनिक हिन्दी में स्पष्ट है; शाब्दिक बिंब पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन पुल्लिंग प्रत्यय को ठीक उसी वचन में रखा गया है।
- source_word: הַגּוֹיִם
  choice: जातियों
  rationale: इस संदर्भ में यह देश में रहने वाले अलग-अलग जनसमुदायों को सूचित करता है; ‘जातियाँ’ सहज और प्रचलित बाइबलीय हिन्दी है।
- source_word: נֹתֵן לְךָ אֶת אַרְצָם
  choice: जिनका देश ... तुम्हें दे रहा है
  rationale: कृदंत की वर्तमान/निश्चित क्रिया और ‘उनका देश’ के संबंध को स्वाभाविक हिन्दी संबंधवाचक वाक्य में सुरक्षित रखा गया है।
- source_word: וִירִשְׁתָּם
  choice: तुम उन्हें बेदखल करके
  rationale: यहाँ कर्म व्यक्ति हैं, इसलिए क्रिया का आशय उन जातियों को उनके अधिकार-स्थान से हटाना है, न कि उनका ‘उत्तराधिकार पाना’।
- source_word: וְיָשַׁבְתָּ
  choice: बस जाओगे
  rationale: क्रिया यहाँ नगरों और घरों में निवास स्थापित करने को दर्शाती है; ‘बस जाना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְעָרֵיהֶם וּבְבָתֵּיהֶם
  choice: उनके नगरों और घरों में
  rationale: दोनों संज्ञाओं पर लागू संबंध और अधिकरण को हिन्दी में संक्षेप तथा स्पष्टता से रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में व्यक्तिगत चतुरक्षरीय नाम है। ‘याहवे’ उसे उपाधि में बदले बिना प्रचलित विद्वत्तापूर्ण उच्चारण के अनुसार प्रस्तुत करता है।
- issue: יַכְרִית में विनाश की सीमा
  choice: मिटा देगा, साथ में शाब्दिक विकल्प की पादटिप्पणी
  alternative: नष्ट कर देगा / काटकर अलग कर देगा
  rationale: क्रिया हटाने, उन्मूलन या विनाश का भाव रख सकती है। मुख्य पाठ में सहज हिन्दी चुनी गई है, पर पादटिप्पणी मूल मुहावरे और अर्थ-सीमा को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
