  edition: WLC
  text: וַ/אֲשֶׁר֩ יָבֹ֨א אֶת רֵעֵ֥/הוּ בַ/יַּעַר֮ לַ/חְטֹ֣ב עֵצִים֒ וְ/נִדְּחָ֨ה יָד֤/וֹ בַ/גַּרְזֶן֙ לִ/כְרֹ֣ת הָ/עֵ֔ץ וְ/נָשַׁ֤ל הַ/בַּרְזֶל֙ מִן הָ/עֵ֔ץ וּ/מָצָ֥א אֶת רֵעֵ֖/הוּ וָ/מֵ֑ת ה֗וּא יָנ֛וּס אֶל אַחַ֥ת הֶ/עָרִים הָ/אֵ֖לֶּה וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/005.yaml
  text: But if a man goes with his neighbor into the forest to cut wood[a], and his hand swings the axe to cut down the tree, and the iron head slips from the handle and strikes his neighbor so that he dies, he may flee to one of these cities and live.
translation:
  language: hi
  text: पर यदि कोई अपने पड़ोसी के साथ लकड़ी काटने के लिए जंगल में जाए, और पेड़ काटने के लिए उसका हाथ कुल्हाड़ी चलाए, और कुल्हाड़ी का लोहे का फल उसके लकड़ी के हत्थे से निकलकर उसके पड़ोसी को लगे, जिससे वह मर जाए, तो वह इन नगरों में से किसी एक में भाग जाए और जीवित रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: पर यदि कोई
  rationale: यह पिछले कानूनी प्रसंग को आगे बढ़ाते हुए एक शर्तयुक्त उदाहरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘पर यदि कोई’ स्वाभाविक और स्पष्ट है।
- source_word: רֵעֵהוּ
  choice: अपने पड़ोसी
  rationale: कानूनी प्रसंग में यह शब्द घनिष्ठ मित्र तक सीमित नहीं, बल्कि साथ के व्यक्ति या सामाजिक सहचर को दर्शाता है; ‘पड़ोसी’ इस व्यापक अर्थ को बनाए रखता है।
- source_word: לַחְטֹב עֵצִים
  choice: लकड़ियाँ काटने के लिए
  rationale: यह सामान्य रूप से लकड़ी काटने के काम को व्यक्त करता है; बहुवचन ‘लकड़ियाँ’ हिन्दी में गतिविधि को सहज ढंग से बताता है।
- source_word: וְנִדְּחָה יָדוֹ בַגַּרְזֶן
  choice: कुल्हाड़ी चलाते समय
  rationale: शाब्दिक हाथ-गतिवाचक अभिव्यक्ति हिन्दी में अस्वाभाविक होती; यह चयन कुल्हाड़ी के प्रहार की गति को स्पष्ट और स्वाभाविक रूप में व्यक्त करता है।
- source_word: לִכְרֹת הָעֵץ
  choice: पेड़ काटने के लिए
  rationale: इस प्रसंग में כרת पेड़ को काटने या गिराने की क्रिया है; ‘पेड़ काटने’ का सामान्य हिन्दी प्रयोग पर्याप्त स्पष्ट है।
- source_word: וְנָשַׁל הַבַּרְזֶל מִן הָעֵץ
  choice: लोहे का फल लकड़ी के डंडे से निकल जाए
  rationale: ‘लोहा’ कुल्हाड़ी के फल और ‘लकड़ी’ उसके डंडे के लिए लक्षणा है। मुख्य पाठ में आशय स्पष्ट किया गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וּמָצָא אֶת רֵעֵהוּ
  choice: और उसके पड़ोसी को लगे
  rationale: מצא का मूल भाव ‘पाना/जा पहुँचना’ है, पर प्रहार के इस प्रसंग में इसका अर्थ किसी को लगना है; हिन्दी में ‘लगे’ आकस्मिक चोट को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וָמֵת
  choice: जिससे वह मर जाए
  rationale: परिणामसूचक अनुवाद यह स्पष्ट करता है कि कुल्हाड़ी लगने से पड़ोसी की मृत्यु होती है।
- source_word: הוּא יָנוּס ... וָחָי
  choice: वह ... भाग जाए और जीवित रहे
  rationale: यह कानूनी प्रावधान के भीतर आश्रय-नगर की ओर भागने और जीवित बचने की अनुमति/व्यवस्था व्यक्त करता है; हिन्दी का संभावनार्थक-विधिक रूप मूल के भाव को बिना अनावश्यक विस्तार के बनाए रखता है।
theological_decisions:
- issue: आश्रय-नगर की ओर भागने वाले व्यक्ति के अधिकार या दायित्व का भाव
  choice: ‘भाग जाए और जीवित रहे’
  alternative: ‘भाग सकता है और जीवित रह सकता है’
  rationale: मूल के अपूर्ण क्रियारूप कानूनी प्रसंग में भविष्य, अनुमति या निर्देश का रंग रख सकते हैं। चुना हुआ हिन्दी रूप इस तनाव को बनाए रखता है और इसे केवल वैकल्पिक अनुमति के रूप में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और विधिक प्रसंग के अनुरूप गरिमापूर्ण रखी गई है। तकनीकी ‘हत्था’ के बजाय सर्वसुलभ ‘लकड़ी का डंडा’ और ‘कुल्हाड़ी का फल’ प्रयोग किया गया है।
