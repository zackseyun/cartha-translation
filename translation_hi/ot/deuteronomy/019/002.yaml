  text: You shall set apart three cities for yourself within your land that Yahweh your God is giving you to possess[a].
translation:
  language: hi
  text: तू उस देश के भीतर, जिसे याहवे, तेरा परमेश्वर, तुझे अपने अधिकार में लेने के लिए[a] दे रहा है, अपने लिए तीन नगर अलग ठहराना।
  philosophy: optimal-equivalence
  footnotes:
