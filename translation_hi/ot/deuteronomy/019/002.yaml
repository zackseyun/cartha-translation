    text: या, “विरासत में पाने के लिए।” इब्रानी क्रिया भूमि दिए जाने के संदर्भ में “अपने अधिकार में लेना” या “विरासत में पाना,” दोनों अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ עָרִים
  choice: तीन नगर
  rationale: עִיר नगर या शहर को सूचित करता है; विधिक प्रसंग और शरण-नगरों के संदर्भ में ‘नगर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: תַּבְדִּיל
  choice: अलग ठहराना
  rationale: בדל के हिफ़ील रूप में अलग करने और किसी विशेष उद्देश्य के लिए निर्धारित करने, दोनों का भाव है; ‘अलग ठहराना’ इन दोनों पहलुओं को बनाए रखता है।
- source_word: לָךְ
  choice: अपने लिए
  rationale: यह लाभार्थक अर्थ वाला संबंधसूचक रूप है; ‘अपने लिए’ उसके आत्मवाचक-लाभार्थक भाव को स्पष्ट रखता है।
- source_word: בְּתוֹךְ אַרְצְךָ
  choice: अपने देश के भीतर
  rationale: בְּתוֹךְ का स्थानवाचक अर्थ ‘बीच में/भीतर’ है; ‘भीतर’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इसे सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित व्यक्तिगत नाम ‘यहोवा’ पद के स्थान पर स्रोत के ईश्वरीय नाम को प्रत्यक्ष रूप से प्रस्तुत करता है।
- source_word: אֱלֹהֶיךָ
  choice: तेरा परमेश्वर
  rationale: एकवचन पुल्लिंग संबोधन के अनुरूप ‘तेरा’; אֱלֹהִים के लिए ‘परमेश्वर’ मानक, स्पष्ट हिन्दी रूप है।
- source_word: נֹתֵן לְךָ
  choice: तुझे ... दे रहा है
  rationale: कृदंत चल रही अथवा आसन्न दान-क्रिया व्यक्त करता है; यह रूप उसके पहलू और प्रतिज्ञात्मक संदर्भ को बनाए रखता है।
- source_word: לְרִשְׁתָּהּ
  choice: अधिकार में लेने के लिए
  rationale: ירשׁ भूमि-अनुदान के संदर्भ में अधिकार प्राप्त करने, कब्ज़ा लेने या उत्तराधिकार पाने का अर्थ दे सकता है; ‘अधिकार में लेने’ से भूमि पर वैध स्वामित्व/अधिकार का भाव सहज हिन्दी में आता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है, इसलिए ‘प्रभु’ जैसे पद से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय पाठकों में व्यापक रूप से पहचाना जाने वाला नामरूप है।
- issue: לְרִשְׁתָּהּ में भूमि-अधिकार का भाव
  choice: अधिकार में लेने के लिए
  alternative: विरासत में पाने के लिए
  rationale: क्रिया भूमि पर अधिकार पाने और उसे विरासत में प्राप्त करने, दोनों अर्थ दे सकती है। मुख्य पाठ में अपेक्षाकृत व्यापक ‘अधिकार में लेने’ को रखा गया है और वास्तविक वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक शैली रखी गई है। प्रसंग में मूसा का इस्राएल से एकवचन संबोधन होने के कारण ‘तू/तेरा/तुझे’ का प्रयोग किया गया है। वाक्य-विन्यास हिन्दी की स्वाभाविकता के लिए हल्का पुनर्गठित है, पर मूल के आदेश, स्थान और भूमि-दान संबंधी आशय सुरक्षित हैं।
