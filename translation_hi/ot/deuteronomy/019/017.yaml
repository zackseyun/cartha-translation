  yaml_path: translation/ot/deuteronomy/019/017.yaml
  text: then the two men who have the dispute shall stand before Yahweh[b][a], before the priests and the judges who are in office in those days.
translation:
  language: hi
  text: तब वे दोनों पुरुष, जिनके बीच विवाद है,[a] यहोवा के सामने, और उन याजकों और न्यायियों के सामने जो उन दिनों पद पर हों, खड़े हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी का अधिक शाब्दिक अर्थ: ‘जिनका विवाद है’; अन्य संभव अनुवाद: ‘जिनका मुकदमा है’ या ‘जो आपस में विवाद कर रहे हैं।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמְדוּ
  choice: तब ... खड़े हों
  rationale: वाव के साथ पूर्ण क्रिया कानूनी प्रक्रिया के अगले चरण को बताती है; ‘तब’ इस क्रम को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘खड़े हों’ विधिक निर्देश का भाव रखता है।
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: वे दोनों पुरुष
  rationale: इब्रानी में संख्या के साथ स्पष्ट रूप से पुल्लिंग बहुवचन संज्ञा है; ‘पुरुष’ मूल के रूप को बनाए रखता है।
- source_word: אֲשֶׁר לָהֶם הָרִיב
  choice: जिनके बीच विवाद है
  rationale: רִיב का अर्थ विवाद, मुकदमा या कानूनी मामला हो सकता है। यह चुनाव इब्रानी संबंध का स्वाभाविक हिन्दी रूप है और बिना आवश्यकता इसे केवल औपचारिक ‘मुकदमा’ तक सीमित नहीं करता।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: व्यक्तिगत वाचा-नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है; ‘के सामने’ दैवी उपस्थिति और न्यायिक उत्तरदायित्व दोनों बनाए रखता है।
- source_word: לִפְנֵי הַכֹּהֲנִים וְהַשֹּׁפְטִים
  choice: याजकों और न्यायियों के सामने
  rationale: दोनों मान्य धार्मिक-न्यायिक पदों को स्पष्ट और समानांतर रूप में रखा गया है। दूसरा ‘के सामने’ हिन्दी में संबंध स्पष्ट करता है।
- source_word: אֲשֶׁר יִהְיוּ בַּיָּמִים הָהֵם
  choice: उन दिनों सेवा करने वाले
  rationale: शाब्दिक रूप ‘जो उन दिनों होंगे’ समकालीन पदाधिकारियों की ओर संकेत करता है। ‘सेवा करने वाले’ उनके सक्रिय पद-कार्य को स्वाभाविक हिन्दी में बताता है, यद्यपि केवल ‘जो उन दिनों हों’ भी संभव है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। उसका अनुवाद पदवी ‘प्रभु’ से न करके हिन्दी में व्यापक रूप से पहचाने जाने वाले नाम ‘यहोवा’ से किया गया है; ‘याहवे’ अधिक ध्वन्यात्मक विकल्प है।
- issue: ‘यहोवा के सामने’ और मानवीय न्यायाधिकारियों के सामने का संबंध
  choice: डैश और ‘अर्थात’ द्वारा मानवीय न्यायालय को यहोवा के सामने उपस्थित होने की ठोस संस्थागत अभिव्यक्ति दिखाना
  alternative: दो स्वतंत्र स्थानों की तरह केवल दो बार ‘के सामने’ कहना
  rationale: पद का समानांतर विधान बताता है कि याजकों और न्यायियों के सामने न्यायिक उपस्थिति ही यहोवा के सामने खड़ा होना है। ‘अर्थात’ इसे स्पष्ट करता है, पर दैवी और मानवीय अधिकार को पूर्णतः एक नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कानूनी शैली रखी गई है। वाक्य को सामान्य पाठक के लिए सहज बनाया गया है, पर ‘विवाद’, ‘याजक’ और ‘न्यायी’ जैसे प्रसंगानुकूल पद सुरक्षित हैं।
