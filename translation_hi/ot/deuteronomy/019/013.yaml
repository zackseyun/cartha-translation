  yaml_path: translation/ot/deuteronomy/019/013.yaml
  text: Your eye shall not pity him[a], but you shall purge the innocent blood from Israel[b], and it shall go well with you.
translation:
  language: hi
  text: तुम्हारी आँख उस पर तरस न खाए[a]। तुम इस्राएल में से निर्दोष के खून का दोष दूर करो[b], और तुम्हारा भला होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम उसे न बख्शना।” इब्रानी मुहावरे में शाब्दिक रूप से आँख का उल्लेख दया या करुणा के स्थान के रूप में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “निर्दोष का खून इस्राएल में से दूर करना”; अर्थात निर्दोष का खून बहाए जाने से इस्राएल के समुदाय पर आया रक्त-दोष दूर करना।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תָחוֹס עֵינְךָ עָלָיו
  choice: तुम्हारी आँख उस पर तरस न खाए
  rationale: इब्रानी मुहावरे में आँख को दया या करुणा का स्थान मानकर कहा गया है। हिंदी में ‘आँख ... तरस न खाए’ स्रोत की छवि और न्यायिक गंभीरता दोनों को बनाए रखता है।
- source_word: וּבִעַרְתָּ
  choice: दूर करना
  rationale: व्यवस्थाविवरण के कानूनी संदर्भ में בער का अर्थ प्रायः समुदाय में से किसी बुराई या दोष को मिटाना अथवा हटा देना है, न कि सचमुच जला देना। ‘दूर करना’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: דַם הַנָּקִי
  choice: निर्दोष के खून का दोष
  rationale: शाब्दिक रूप ‘निर्दोष का खून’ है, पर इस संदर्भ में वाक्य उस निर्दोष-हत्या से समुदाय पर आए रक्त-दोष को दूर करने की बात करता है। ‘खून का दोष’ इब्रानी कानूनी भाव को हिंदी में स्पष्ट करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: מִיִּשְׂרָאֵל
  choice: इस्राएल में से
  rationale: מן समुदाय के भीतर से हटाए जाने का भाव देता है। ‘इस्राएल में से’ इस सामुदायिक दायरे को सीधे व्यक्त करता है।
- source_word: וְטוֹב לָךְ
  choice: तब तुम्हारा भला होगा
  rationale: यह व्यवस्थाविवरण में आज्ञापालन के हितकारी परिणाम को व्यक्त करने वाला प्रचलित वाचा-संबंधी सूत्र है। ‘तब’ प्रसंग में परिणाम का भाव स्वाभाविक रूप से सामने लाता है।
theological_decisions:
- issue: हत्यारे के विषय में आज्ञा का स्वरूप
  choice: यह आज्ञा न्यायिक प्रक्रिया में अनुचित दया न दिखाने और निर्दोष की हत्या से आए सामुदायिक रक्त-दोष को दूर करने की है।
  alternative: इसे निजी बदला लेने की अनुमति के रूप में पढ़ा जा सकता है।
  rationale: व्यवस्थाविवरण 19:11–12 का निकट संदर्भ जानबूझकर हत्या करने वाले व्यक्ति को विधिवत न्याय के लिए सौंपने का है। अनुवाद निजी प्रतिशोध का कोई विचार नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और कानूनी स्वर रखा गया है। एकवचन संबोधन ‘तुम’ के रूप में है। स्रोत की ‘आँख’ वाली छवि बनाए रखी गई है, जबकि ‘खून का दोष’ से प्रसंगगत न्यायिक अर्थ सामान्य पाठक के लिए स्पष्ट किया गया है।
