source:
  edition: WLC
  text: תָּכִ֣ין לְ/ךָ֮ הַ/דֶּרֶךְ֒ וְ/שִׁלַּשְׁתָּ֙ אֶת גְּב֣וּל אַרְצְ/ךָ֔ אֲשֶׁ֥ר יַנְחִֽילְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הָיָ֕ה לָ/נ֥וּס שָׁ֖מָּ/ה כָּל רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/003.yaml
  text: You shall prepare the road for yourself[a], and you shall divide into three parts the territory of your land that Yahweh your God is giving you as an inheritance[b], so that every manslayer may flee there.
translation:
  language: hi
  text: तुम अपने लिए रास्ता तैयार करो और अपने देश के पूरे क्षेत्र को तीन भागों में बाँटो, जिसे तुम्हारा परमेश्वर याहवे तुम्हें विरासत के रूप में दे रहा है, ताकि हर वह व्यक्ति जिसने किसी मनुष्य का वध किया हो[a] वहाँ भाग सके।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हर प्राण लेनेवाला’। यहाँ प्रयुक्त इब्रानी शब्द केवल जानबूझकर हत्या करनेवाले के लिए नहीं, बल्कि व्यापक अर्थ में किसी की जान लेनेवाले के लिए भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘और वह वहाँ भागने के लिए होगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין לְךָ הַדֶּרֶךְ
  choice: तुम अपने लिए रास्ता तैयार करना
  rationale: כּון के हिफ़ील रूप का अर्थ यहाँ रास्ते को तैयार या सुगम बनाना है। לְךָ को ‘अपने लिए’ के रूप में बनाए रखा गया है और דֶּרֶךְ को इस भौगोलिक-कानूनी संदर्भ में ठोस ‘रास्ता’ कहा गया है।
- source_word: וְשִׁלַּשְׁתָּ
  choice: तीन भागों में बाँटना
  rationale: שלש का पिएल रूप क्षेत्र को तीन भागों में व्यवस्थित करने का निर्देश देता है; यह हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: גְּבוּל אַרְצְךָ
  choice: अपने देश का वह पूरा क्षेत्र
  rationale: גְּבוּל केवल सीमा-रेखा नहीं, यहाँ देश के भूभाग या क्षेत्र-विस्तार को सूचित करता है। ‘पूरा क्षेत्र’ इस व्यापक स्थानिक अर्थ को व्यक्त करता है।
- source_word: יַנְחִילְךָ
  choice: तुम्हें विरासत के रूप में दे रहा है
  rationale: נחל का हिफ़ील रूप विरासत दिलाने या विरासत के रूप में देने का भाव रखता है; इस चयन में भूमि के उपहार और विरासत, दोनों पहलू बने रहते हैं।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर याहवे
  rationale: व्यक्तिगत दिव्य नाम יהוה को ‘याहवे’ लिप्यंतरित किया गया है और אֱלֹהֶיךָ को स्वाभाविक हिंदी संबंध के साथ रखा गया है।
- source_word: כָּל רֹצֵחַ
  choice: हर मनुष्य-वध करनेवाला
  rationale: רֹצֵחַ इस शरण-नगर प्रसंग में केवल दोषसिद्ध ‘हत्यारे’ तक सीमित नहीं है; यह ऐसे व्यक्ति को भी समेटता है जिससे अनजाने में किसी की मृत्यु हुई हो। ‘मनुष्य-वध करनेवाला’ कानूनी गंभीरता रखते हुए दोष या मंशा पहले से तय नहीं करता।
- source_word: וְהָיָה לָנוּס שָׁמָּה
  choice: ताकि … वहाँ भाग सके
  rationale: इब्रानी का संक्षिप्त वाक्यांश शाब्दिक रूप से ‘और वह वहाँ भागने के लिए होगा’ है। हिंदी में प्रयोजन का भाव ‘ताकि’ से स्वाभाविक रूप में व्यक्त होता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका पारदर्शी आधुनिक हिंदी लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: רֹצֵחַ में दोष और मंशा का प्रश्न
  choice: मनुष्य-वध करनेवाला
  alternative: हत्यारा / मारनेवाला
  rationale: इस पद में अपने आप यह नहीं कहा गया कि मृत्यु जानबूझकर हुई थी; आगे का संदर्भ अनजाने वध को भी शामिल करता है। इसलिए मुख्य पाठ दोष को पहले से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी निर्देश के अनुरूप रखी गई है। एकवचन संबोधन और आज्ञार्थक शैली सुरक्षित हैं। ‘मनुष्य-वध करनेवाला’ सामान्य बोलचाल से कुछ अधिक औपचारिक है, पर इस विधिक प्रसंग में आवश्यक व्यापकता और निष्पक्षता बनाए रखता है।
