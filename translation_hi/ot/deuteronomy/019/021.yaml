base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/021.yaml
  text: 'Your eye shall not pity: life for life[a], eye for eye, tooth for tooth, hand for hand[b], foot for foot.'
translation:
  language: hi
  text: 'तुम्हारी आँख दया न करे[a]: जीवन के बदले जीवन[b], आँख के बदले आँख, दाँत के बदले दाँत, हाथ के बदले हाथ और पैर के बदले पैर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न बख्शे’ अथवा ‘करुणा न दिखाए।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ נֶפֶשׁ का अर्थ ‘जीवन’ है, बाद के धर्मवैज्ञानिक अर्थ में विशेष रूप से ‘आत्मा’ नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס
  choice: दया न करे
  rationale: חוס का अर्थ किसी पर दया करना अथवा उसे छोड़ देना है। निषेधात्मक कानूनी संदर्भ में ‘दया न करे’ स्पष्ट और स्वाभाविक है तथा עֵינֶךָ के साथ मूल मुहावरे को बनाए रखता है।
- source_word: עֵינֶךָ
  choice: तुम्हारी आँख
  rationale: इब्रानी में ‘आँख’ ही क्रिया का कर्ता है। इसे बनाए रखने से दया के विषय में मूल भाषा का सजीव मुहावरा सुरक्षित रहता है।
- source_word: נֶפֶשׁ
  choice: जीवन
  rationale: नֶפֶשׁ בְּנֶפֶשׁ में आशय जीवन के न्यायिक प्रतिदान से है, बाद के दार्शनिक या धर्मवैज्ञानिक अर्थ में किसी अमूर्त ‘आत्मा’ से नहीं।
- source_word: בְּ
  choice: के बदले
  rationale: इन समानांतर पदों में בְּ प्रतिदान या समतुल्यता व्यक्त करता है। ‘के बदले’ आधुनिक हिन्दी में इस कानूनी संबंध को स्पष्ट करता है।
- source_word: עַיִן
  choice: आँख
  rationale: यह प्रतिदान के सूत्र में शरीर के अंग का सीधा उल्लेख है।
- source_word: שֵׁן
  choice: दाँत
  rationale: यह शरीर के अंग का सटीक और स्वाभाविक हिन्दी रूप है।
- source_word: יָד
  choice: हाथ
  rationale: यह इब्रानी शरीर-अंग पद का सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: רֶגֶל
  choice: पैर
  rationale: इस कानूनी सूत्र में ‘पैर’ רֶגֶל का सामान्य और उपयुक्त हिन्दी रूप है।
theological_decisions:
- issue: ठोस प्रतिदान-सूत्र को बनाए रखना या उसे आनुपातिक न्याय के सामान्य सिद्धांत के रूप में नरम करना
  choice: ‘जीवन के बदले जीवन, आँख के बदले आँख, दाँत के बदले दाँत, हाथ के बदले हाथ और पैर के बदले पैर’ के ठोस सूत्र को बनाए रखा गया।
  alternative: ‘दंड अपराध के अनुपात में हो’ जैसी सामान्य व्याख्या
  rationale: मूल पाठ एक निश्चित न्यायिक सूत्र देता है। उसका सामान्यीकरण करने से उसकी ठोस अभिव्यक्ति, कानूनी कठोरता और तोराह के अन्य अंशों से उसका संबंध धुँधला हो जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण कानूनी शैली रखी गई है। एकवचन इब्रानी संबोधन को हिन्दी के स्वाभाविक आदरसूचक/सामान्य ‘तुम्हारी’ से व्यक्त किया गया है। ‘तुम्हारी आँख’ का मूल मुहावरा जानबूझकर सुरक्षित रखा गया है, और प्रतिदान-सूत्र में समानांतर लय बनाए रखी गई है।
