  yaml_path: translation/ot/deuteronomy/019/016.yaml
  text: If a malicious witness rises up against a man to testify against him of rebellion[b][a],
translation:
  language: hi
  text: यदि कोई दुर्भावनापूर्ण गवाह[a] किसी पुरुष के विरुद्ध खड़ा होकर उस पर विद्रोह[b] का आरोप लगाए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झूठा गवाह।” इब्रानी में शाब्दिक रूप से “हिंसा/अन्याय का गवाह” है, जिसका अर्थ न्यायालय में दुर्भावना से झूठा आरोप लगाने वाला हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “गंभीर गलत काम” अथवा “धर्मत्याग।” इब्रानी शब्द मुड़ जाने, विद्रोह या द्रोह का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यहाँ यह व्यवस्था के शर्तसूचक वाक्य का आरम्भ करता है।
- source_word: יָקוּם
  choice: खड़ा होकर
  rationale: न्यायिक प्रसंग में गवाह के रूप में सामने आने या खड़े होने का भाव है; ठोस इब्रानी बिंब भी बना रहता है।
- source_word: עֵד חָמָס
  choice: दुर्भावनापूर्ण गवाह
  rationale: शाब्दिक अर्थ ‘हिंसा/अन्याय का गवाह’ है; न्यायिक प्रसंग में यह गलत मंशा से दोष लगाने वाले गवाह को सूचित करता है, पर केवल ‘झूठा’ कहना अर्थ को अनावश्यक रूप से सीमित कर सकता है।
- source_word: בְּאִישׁ
  choice: किसी पुरुष के विरुद्ध
  rationale: पूर्वसर्ग आरोप के लक्ष्य को दर्शाता है और אִישׁ का एकवचन पुल्लिंग रूप सुरक्षित रखा गया है।
- source_word: לַעֲנוֹת בּוֹ
  choice: उस पर ... का आरोप लगाए
  rationale: न्यायिक संदर्भ में ענה गवाही देने का अर्थ रखता है; हिंदी में विरोधी गवाही के लिए ‘आरोप लगाए’ अधिक स्वाभाविक है।
- source_word: סָרָה
  choice: विद्रोह
  rationale: शब्द मूलतः मुड़ जाने, उद्दंड विचलन या द्रोह का भाव रखता है। ‘विद्रोह’ इसकी गंभीरता बचाता है, यद्यपि प्रसंग में व्यापक अपराध या गलत आचरण भी अभिप्रेत हो सकता है।
theological_decisions:
- issue: व्यवस्था की प्रतिनिधिक पुल्लिंग भाषा
  choice: किसी पुरुष के विरुद्ध
  alternative: किसी व्यक्ति के विरुद्ध
  rationale: मूल में אִישׁ एकवचन पुल्लिंग है; उसे बनाए रखने से पाठ का रूप सुरक्षित रहता है, बिना यह दावा किए कि सिद्धांत केवल पुरुषों पर लागू है।
- issue: סָרָה के आरोप का स्वरूप
  choice: विद्रोह
  alternative: गलत काम / धर्मत्याग
  rationale: ‘विद्रोह’ गंभीर विचलन का व्यापक अर्थ बनाए रखता है। ‘धर्मत्याग’ धार्मिक अर्थ को जरूरत से अधिक निश्चित करता है, जबकि ‘गलत काम’ मूल की तीव्रता घटा सकता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण न्यायिक हिंदी। वाक्य को अगले पद से जुड़ने वाली शर्त के रूप में अल्पविराम पर छोड़ा गया है।
