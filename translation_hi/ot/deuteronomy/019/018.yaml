base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/018.yaml
  text: And the judges shall investigate thoroughly, and if the witness is a false witness and has testified falsely against his brother,
translation:
  language: hi
  text: न्यायाधीश भली-भाँति जाँच करें; और यदि वह गवाह झूठा गवाह निकले और उसने अपने भाई के विरुद्ध झूठी गवाही दी हो,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרְשׁוּ
  choice: जाँच करें
  rationale: यह क्रिया यहाँ न्यायिक छानबीन या पूछताछ करने का अर्थ देती है; आधुनिक हिन्दी में ‘जाँच करें’ स्वाभाविक और स्पष्ट है।
- source_word: הֵיטֵב
  choice: भली-भाँति
  rationale: 'क्रिया की गहनता और सावधानी को व्यक्त करता है: न्यायी मामले की पूरी तरह जाँच करें।'
- source_word: וְהִנֵּה
  choice: यदि ... निकले
  rationale: इस न्यायिक शर्त के संदर्भ में हिब्रू अभिव्यक्ति जाँच के परिणाम का परिचय देती है। शाब्दिक ‘और देखो’ की अपेक्षा ‘यदि ... निकले’ आधुनिक हिन्दी में स्वाभाविक है और मूल की परिणामसूचक शक्ति बनाए रखता है।
- source_word: עֵד שֶׁקֶר
  choice: झूठा गवाह
  rationale: मूल संज्ञा-समूह का सीधा और प्रचलित न्यायिक अनुवाद।
- source_word: שֶׁקֶר עָנָה
  choice: झूठी गवाही दी हो
  rationale: हिब्रू में शाब्दिक रूप से ‘झूठ बोला/उत्तर दिया’; गवाह के न्यायिक संदर्भ में हिन्दी में ‘झूठी गवाही दी’ अर्थ को ठीक और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְאָחִיו
  choice: अपने भाई के विरुद्ध
  rationale: यहाँ בְ विरोधी गवाही के लक्ष्य को दर्शाता है और אָחִיו वाचा-समुदाय के सह-सदस्य के लिए पारिवारिक भाषा रखता है; इसलिए ‘भाई’ को सामान्यीकृत नहीं किया गया।
theological_decisions:
- issue: אָחִיו में संबंधसूचक वाचा-भाषा
  choice: अपने भाई
  alternative: अपने संगी / दूसरे व्यक्ति
  rationale: ‘भाई’ मूल की सामुदायिक और पारिवारिक भाषा को सुरक्षित रखता है, बिना उसका दायरा व्याख्यात्मक रूप से बढ़ाए या घटाए।
- issue: וְהִנֵּה की प्रस्तुति
  choice: यदि वह गवाह ... निकले
  alternative: और देखो, वह गवाह झूठा गवाह है
  rationale: संदर्भ में यह जाँच से प्रमाणित परिस्थिति को सामने लाता है। ‘यदि ... निकले’ हिन्दी में न्यायिक तर्क को स्पष्ट करता है, पर निष्कर्ष को पहले से निश्चित नहीं मानता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ न्यायिक रजिस्टर। ‘न्यायी’ ने बहुवचन הַשֹּׁפְטִים को संक्षेप में बनाए रखा है। पद अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
