base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/019.yaml
  text: Then you shall do to him just as he intended to do to his brother[a]. So you shall purge the evil from your midst.
translation:
  language: hi
  text: तब तुम उसके साथ वैसा ही करो, जैसा वह अपने भाई[a] के साथ करने का इरादा रखता था। इस प्रकार तुम अपने बीच से बुराई को दूर कर दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने साथी के साथ”; इब्रानी में “अपने भाई के साथ” है, जो इस कानूनी संदर्भ में वाचा-समुदाय के साथी सदस्य के लिए प्रयुक्त शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: तब तुम ... करना
  rationale: यह समुदाय अथवा न्यायाधीशों को संबोधित कानूनी निर्देश है। हिंदी में ‘करना’ इस विधिक आज्ञा को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है; वाव को प्रसंगानुसार ‘तब’ से व्यक्त किया गया है।
- source_word: לוֹ
  choice: उसके साथ
  rationale: यह संदर्भ में झूठे साक्षी की ओर संकेत करता है। हिंदी मुहावरे में दंडात्मक व्यवहार के लिए ‘उसके साथ ... करना’ स्वाभाविक है।
- source_word: כַּאֲשֶׁר
  choice: वैसा ही ... जैसा
  rationale: यह दंड और अभिप्रेत हानि के बीच ठीक अनुरूपता, अर्थात समान प्रतिफल, को स्पष्ट करता है।
- source_word: זָמַם
  choice: योजना बनाई थी
  rationale: क्रिया किसी कार्य को सोचने या रचने का भाव देती है और इस संदर्भ में दुर्भावनापूर्ण योजना को सूचित करती है। ‘योजना बनाई थी’ आशय को व्यक्त करता है, जबकि शत्रुतापूर्ण रंग प्रसंग से स्पष्ट रहता है।
- source_word: לַעֲשׂוֹת
  choice: करने
  rationale: यह זָמַם की पूरक क्रिया है और हिंदी में ‘करने की योजना’ के रूप में स्वाभाविक है।
- source_word: לְאָחִיו
  choice: अपने भाई
  rationale: אָח का मूल अर्थ ‘भाई’ है; इस कानूनी-वाचा संबंधी संदर्भ में यह समुदाय के किसी साथी सदस्य को भी दर्शा सकता है। मुख्य पाठ स्रोत की पुरुषवाचक संज्ञा को बनाए रखता है और व्यापक अर्थ पादटिप्पणी में देता है।
- source_word: וּבִעַרְתָּ
  choice: इस प्रकार ... दूर करना
  rationale: व्यवस्थाविवरण के कानूनी सूत्र में בער का अर्थ शाब्दिक रूप से जलाना नहीं, बल्कि समुदाय से बुराई हटाना है। ‘दूर करना’ आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: הָרָע
  choice: बुराई
  rationale: यह सूत्र नैतिक और सामुदायिक बुराई को दर्शाता है। ‘बुराई’ उसके व्यापक नैतिक भार को सुरक्षित रखता है।
- source_word: מִקִּרְבֶּךָ
  choice: अपने बीच से
  rationale: यह इस्राएली समुदाय के भीतर से बुराई हटाने का वाचा-संबंधी भाव स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: कानूनी संदर्भ में पुरुषवाचक वाचा-संबंधी शब्द אָחִיו
  choice: अपने भाई
  alternative: अपने साथी / अपने साथी इस्राएली
  rationale: इब्रानी रूप पुरुषवाचक एकवचन है, पर इस कानूनी संदर्भ में समुदाय के किसी साथी सदस्य का प्रतिनिधिक अर्थ रख सकता है। मुख्य पाठ ‘भाई’ को बनाए रखता है और अर्थ की व्यापकता को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण कानूनी शैली अपनाई गई है। ‘तुम ... करना’ सामुदायिक निर्देश का बल रखता है; ‘दूर करना’ शाब्दिक दहन का गलत संकेत दिए बिना व्यवस्थाविवरण के सूत्रार्थ को व्यक्त करता है।
