source:
  edition: WLC
  text: כִּֽי תִשְׁמֹר֩ אֶת כָּל הַ/מִּצְוָ֨ה הַ/זֹּ֜את לַ/עֲשֹׂתָ֗/הּ אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ וְ/לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו כָּל הַ/יָּמִ֑ים וְ/יָסַפְתָּ֨ לְ/ךָ֥ עוֹד֙ שָׁלֹ֣שׁ עָרִ֔ים עַ֖ל הַ/שָּׁלֹ֥שׁ הָ/אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/009.yaml
  text: if you keep all this commandment by doing it[a], which I am commanding you today—to love Yahweh your God and to walk in his ways all your days—then you shall add for yourself three more cities besides these three,
translation:
  language: hi
  text: यदि तुम इस सारी आज्ञा को मानोगे और उस पर चलोगे[a], जिसे मैं आज तुम्हें दे रहा हूँ—कि तुम अपने परमेश्वर यहवे से प्रेम करो और जीवन भर उसके मार्गों पर चलो—तो इन तीन नगरों के अतिरिक्त अपने लिए तीन और नगर ठहराओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘इस सारी आज्ञा’ एकवचन में है। ‘उस पर चलोगे’ मूल के ‘उसे करने’ के भाव को व्यक्त करता है।
    reason: मूल की एकवचन अभिव्यक्ति और לַעֲשֹׂתָהּ (‘उसे करना’) का स्पष्ट क्रियात्मक अर्थ दर्शाना।
lexical_decisions:
- source_word: כִּי תִשְׁמֹר
  choice: यदि तुम…पालन करोगे
  rationale: כִּי यहाँ शर्त प्रस्तुत करता है और שׁמר का वाचा-संबंधी अर्थ आज्ञा का पालन करना है। अलग से ‘सावधानीपूर्वक’ जोड़ना स्रोत से अधिक स्पष्टता लाता, इसलिए नहीं जोड़ा गया।
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: इस सारी आज्ञा
  rationale: ‘आज्ञा’ को एकवचन रखा गया है और כָּל की समग्रता ‘सारी’ से व्यक्त हुई है।
- source_word: לַעֲשֹׂתָהּ
  choice: का पालन करोगे
  rationale: शाब्दिक अर्थ ‘उसे करना’ है; हिन्दी में आज्ञा के साथ ‘पालन करना’ स्वाभाविक है और व्यावहारिक क्रियान्वयन का भाव सुरक्षित रखता है। इसकी संक्षिप्तता के कारण अलग पुनरुक्ति नहीं की गई।
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: जिसकी आज्ञा मैं आज तुम्हें दे रहा हूँ
  rationale: सहभागी रूप מְצַוֶּה के वर्तमान, जारी वचन-कर्म को ‘दे रहा हूँ’ व्यक्त करता है।
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: अर्थात अपने परमेश्वर यहवे से प्रेम करना
  rationale: दोनों क्रियार्थक रूप आज्ञा की विषय-वस्तु खोलते हैं; ‘अर्थात’ यह संबंध स्पष्ट करता है। יְהוָה को व्यक्तिगत दिव्य नाम ‘यहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: और…उसके मार्गों पर चलना
  rationale: वाचा-संबंधी ‘चलने’ का रूपक बनाए रखा गया है; हिन्दी में मार्ग के साथ ‘पर’ स्वाभाविक है।
- source_word: כָּל הַיָּמִים
  choice: जीवन भर
  rationale: मुहावरे का आशय आजीवन निष्ठा है; ‘जीवन भर’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: וְיָסַפְתָּ לְךָ עוֹד שָׁלֹשׁ עָרִים
  choice: तो…अपने लिए तीन और नगर ठहराना
  rationale: व्यवस्थाविवरण 19:8–9 के विधिक निर्देश में इस रूप का आदेशात्मक परिणाम है। ‘ठहराना’ शरण-नगरों को निर्धारित करने का प्रसंगगत अर्थ स्पष्ट करता है, जबकि ‘तीन और’ יסף और עוֹד का योगात्मक भाव रखता है।
- source_word: עַל הַשָּׁלֹשׁ הָאֵלֶּה
  choice: इन तीन नगरों के अतिरिक्त
  rationale: עַל का यहाँ योगात्मक अर्थ है; ‘के अतिरिक्त’ स्पष्ट और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम सीधे आया है। ‘यहवे’ उसका प्रचलित आधुनिक हिन्दी लिप्यंतरण है; इसे उपाधि से बदलने पर नाम और उपाधि का भेद मिट जाता।
- issue: आज्ञा के एकवचन का संरक्षण
  choice: इस सारी आज्ञा
  alternative: इन सभी आज्ञाओं
  rationale: मूल כָּל הַמִּצְוָה הַזֹּאת व्याकरणतः एकवचन है। बहुवचन करना संभावित सामूहिक अर्थ को स्पष्ट तो करता, पर मूल की वास्तविक एकवचन अभिव्यक्ति मिटा देता।
- issue: וְיָסַפְתָּ का विधिक बल
  choice: ठहराना
  alternative: तुम अपने लिए…और जोड़ोगे
  rationale: शर्त पूरी होने पर नगर निर्धारित करने का निर्देश है। हिन्दी में भविष्यसूचक और आदेशात्मक बल के बीच मूल की संभावित निकटता को प्रसंगानुकूल आदेश से व्यक्त किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाचा-संबंधी ‘मार्गों पर चलना’ रूपक सुरक्षित रखा गया है। पद के अंत में अल्पविराम के बजाय पूर्ण विराम दिया गया है क्योंकि हिन्दी में यह निर्देश पूर्ण वाक्य बनता है।
