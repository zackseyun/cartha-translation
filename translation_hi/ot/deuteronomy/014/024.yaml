source:
  edition: WLC
  text: וְ/כִֽי יִרְבֶּ֨ה מִמְּ/ךָ֜ הַ/דֶּ֗רֶךְ כִּ֣י לֹ֣א תוּכַ֘ל שְׂאֵת/וֹ֒ כִּֽי יִרְחַ֤ק מִמְּ/ךָ֙ הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לָ/שׂ֥וּם שְׁמ֖/וֹ שָׁ֑ם כִּ֥י יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/024.yaml
  text: And if the journey is too long for you[a], so that you are not able to carry it, because the place that Yahweh your God will choose to put his name there is too far from you, when Yahweh your God blesses you,
translation:
  language: hi
  text: और यदि मार्ग तुम्हारे लिए इतना लंबा हो कि तुम उसे ले जा न सको, क्योंकि वह स्थान, जिसे तुम्हारा परमेश्वर यहोवा अपना नाम वहाँ रखने के लिए चुनेगा, तुमसे बहुत दूर हो—जब तुम्हारा परमेश्वर यहोवा तुम्हें आशीष दे—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִי
  choice: और यदि
  rationale: वाव के संयोजक बल और כִּי के शर्तसूचक अर्थ, दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יִרְבֶּה מִמְּךָ הַדֶּרֶךְ
  choice: मार्ग तुम्हारे लिए इतना लंबा हो
  rationale: इब्रानी मुहावरे का आशय ऐसी दूरी से है जो व्यक्ति के लिए व्यावहारिक रूप से बहुत अधिक हो; यह हिन्दी में सहज और अर्थनिष्ठ है।
- source_word: לֹא תוּכַל שְׂאֵתוֹ
  choice: तुम उसे उठा न सको
  rationale: संदर्भ में दशमांश की उपज को शारीरिक रूप से ले जाने की बात है; ‘उठा’ נשא के ठोस अर्थ को व्यक्त करता है।
- source_word: יִרְחַק מִמְּךָ הַמָּקוֹם
  choice: वह स्थान तुमसे बहुत दूर हो
  rationale: רחק के स्थानिक अर्थ और व्यवस्थाविवरण में ‘उस स्थान’ के विशेष महत्व को बनाए रखता है।
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: जिसे तुम्हारा परमेश्वर यहोवा ... चुनेगा
  rationale: इस विधिक प्रसंग में यिक्तोल का भावी संकेत है—उस आराधना-स्थान की ओर जिसे परमेश्वर निर्धारित करेगा।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश-नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से दर्शाता है, न कि उपाधि से।
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: अपना नाम वहाँ रखने के लिए
  rationale: व्यवस्थाविवरण की वाचा-संबंधी मानक अभिव्यक्ति को पारदर्शी और निकट रूप में सुरक्षित रखता है।
- source_word: כִּי יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: जब तुम्हारा परमेश्वर यहोवा तुम्हें आशीष दे
  rationale: यहाँ כִּי उस परिस्थिति को समयसूचक रूप में बता सकता है जिसमें समृद्धि के कारण ढोना कठिन होता है; कारणसूचक अर्थ भी संभव है और पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; इसलिए ‘प्रभु’ जैसी उपाधि के बजाय हिन्दी में परिचित नाम-रूप रखा गया है।
- issue: अंतिम כִּי का संबंध
  choice: समयसूचक—‘जब ... आशीष दे’
  alternative: कारणसूचक—‘क्योंकि ... आशीष देता है’
  rationale: दोनों अर्थ इब्रानी व्याकरण में संभव हैं। समयसूचक पाठ विधि के प्रवाह में समृद्धि से उत्पन्न परिस्थिति को सहजता से बताता है, जबकि कारणसूचक संभावना को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण विधिक-वर्णनात्मक स्तर रखा गया है। वाक्य अगले पद में पूरी होने वाली शर्त का अंग है, इसलिए अंत में डैश और अल्पविराम से उसकी अपूर्णता बनाए रखी गई है।
