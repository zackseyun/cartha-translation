  text: शुतुरमुर्ग[a], बाज़, समुद्री चिल और हर प्रकार का शाहीन[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘याअना की बेटी’ है; यह शुतुरमुर्ग के लिए प्रयुक्त जाति-सूचक मुहावरा है।
    reason: cultural_note
  - marker: b
