    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: शुतुरमुर्ग
  rationale: इब्रानी पद का शाब्दिक रूप ‘याअना की बेटी’ है, पर पशु-पक्षियों की सूची में यह एक जाति-सूचक मुहावरा है और सामान्यतः शुतुरमुर्ग अथवा उससे मिलते-जुलते मरुस्थलीय पक्षी को दर्शाता है।
- source_word: הַתַּחְמָס
  choice: बाज़
  rationale: पक्षी की सटीक पहचान अनिश्चित है। संदर्भ में शिकारी पक्षी का सामान्य और सहज नाम ‘बाज़’ चुना गया है; उल्लू आदि विकल्प टिप्पणी में सुरक्षित रखे गए हैं।
- source_word: הַשָּׁחַף
  choice: समुद्री चिल
  rationale: आधुनिक शब्दकोशीय आकलन इसे गल या उसी प्रकार के समुद्री पक्षी से जोड़ता है। ‘समुद्री चिल’ साधारण हिन्दी पाठक के लिए ‘गल’ की अपेक्षा अधिक स्पष्ट है।
- source_word: הַנֵּץ
  choice: शाहीन
  rationale: यह किसी शिकारी पक्षी, विशेषतः बाज़ या फाल्कन वर्ग, को दर्शाता है। इसी पद में תַּחְמָס के लिए प्रयुक्त ‘बाज़’ से अंतर बनाए रखने हेतु ‘शाहीन’ चुना गया है, बिना सटीक प्रजाति का दावा किए।
- source_word: לְמִינֵהוּ
  choice: हर प्रकार का
  rationale: यह इब्रानी वर्गीकरण-सूत्र उस पक्षी और उससे संबंधित विभिन्न जातियों या प्रकारों को समेटता है। हिन्दी में ‘हर प्रकार का’ स्वाभाविक और अर्थ-संगत है।
