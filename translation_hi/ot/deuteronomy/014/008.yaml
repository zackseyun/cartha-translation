  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֥ה הוּא֙ וְ/לֹ֣א גֵרָ֔ה טָמֵ֥א ה֖וּא לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֥א תִגָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/008.yaml
  text: And the pig[a], because it has a split hoof but does not chew the cud, is unclean for you. You shall not eat any of its flesh[b], and you shall not touch its carcass.
translation:
  language: hi
  text: और सूअर—क्योंकि उसका खुर फटा हुआ तो है, पर वह जुगाली नहीं करता—तुम्हारे लिए अशुद्ध है। तुम उनका मांस न खाना और उनके शवों को न छूना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल हिब्रू में “सूअर” एकवचन है, लेकिन “उनका मांस” और “उनके शवों” में बहुवचन प्रत्यय हैं; संभवतः सूअर को एक पूरी जाति के रूप में देखा गया है।
    reason: textual_grammar
lexical_decisions:
- source_word: הַחֲזִיר
  choice: सूअर
  rationale: आधुनिक मानक हिन्दी में इस पशु के लिए स्पष्ट, सामान्य और स्वाभाविक शब्द।
- source_word: מַפְרִיס פַּרְסָה
  choice: उसका खुर चिरा हुआ है
  rationale: खुर के विभाजित होने की शारीरिक विशेषता को सहज हिन्दी में व्यक्त करता है।
- source_word: גֵרָה
  choice: जुगाली
  rationale: इस आहार-विधि के संदर्भ में प्रचलित और सटीक हिन्दी पद; לֹא גֵרָה को क्रियात्मक रूप में ‘जुगाली नहीं करता’ कहा गया है।
- source_word: טָמֵא
  choice: अशुद्ध
  rationale: तोरा की आहार-संबंधी विधि में निर्धारित धार्मिक-विधिक स्थिति को दर्शाता है, नैतिक बुराई का अर्थ नहीं जोड़ता।
- source_word: מִבְּשָׂרָם
  choice: उनका मांस
  rationale: מִן के निषेधात्मक संदर्भ में समावेशी अर्थ रखते हुए और मूल के बहुवचन प्रत्यय को सुरक्षित रखते हुए अनुवाद किया गया है।
- source_word: נִבְלָתָם
  choice: उनकी लोथों
  rationale: मरे हुए पशुओं के शरीर के लिए सटीक हिन्दी शब्द और मूल के बहुवचन प्रत्यय का संरक्षण।
- source_word: תִגָּעוּ
  choice: न छूना
  rationale: प्रत्यक्ष निषेध को बिना विस्तार या नरमी के स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: तोरा की आहार-विधि में अशुद्धता का स्वरूप
  choice: טָמֵא का अनुवाद ‘अशुद्ध’ किया गया है, बिना किसी बाद की धर्मवैचारिक व्याख्या को जोड़े।
  alternative: अपवित्र
  rationale: पद धार्मिक-विधिक और आहार-संबंधी श्रेणी बताता है; यह अपने आप में नैतिक दुष्टता का दावा नहीं करता।
- issue: लोथों को छूने के निषेध का बल
  choice: प्रत्यक्ष आज्ञा ‘न छूना’
  alternative: हाथ न लगाना / संपर्क में न आना
  rationale: נגע का सीधा अर्थ ‘छूना’ है; चुना हुआ रूप आज्ञा के बल और दायरे को सुरक्षित रखता है।
- issue: एकवचन पशु के बाद बहुवचन प्रत्यय
  choice: ‘उनका मांस’ और ‘उनकी लोथों’ द्वारा मूल के बहुवचन को बनाए रखा गया है।
  alternative: ‘उसका मांस’ और ‘उसकी लोथ’
  rationale: हिब्रू में सूअर एकवचन है, पर दोनों बाद के संज्ञा-रूपों में बहुवचन प्रत्यय है। इसे केवल शैलीगत असंगति मानकर एकवचन कर देना स्रोत की वास्तविक व्याकरणिक तनाव को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘खुर चिरा हुआ’ और ‘जुगाली’ परिचित अभिव्यक्तियाँ हैं। मूल के एकवचन से बहुवचन में परिवर्तन को मुख्य पाठ में सुरक्षित रखकर पादटिप्पणी में स्पष्ट किया गया है।
