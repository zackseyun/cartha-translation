  text: בָּנִ֣ים אַתֶּ֔ם לַֽ/יהוָ֖ה אֱלֹהֵי/כֶ֑ם לֹ֣א תִתְגֹּֽדְד֗וּ וְ/לֹֽא תָשִׂ֧ימוּ קָרְחָ֛ה בֵּ֥ין עֵינֵי/כֶ֖ם לָ/מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/001.yaml
  text: You are sons of Yahweh your God[a]. Do not cut yourselves[b], and do not make a bald spot between your eyes for the dead.
translation:
  language: hi
  text: तुम अपने परमेश्वर यहोवा के पुत्र हो। किसी मृतक के लिए न तो अपने आप को काटो और न अपनी आँखों के बीच[a] गंजा स्थान बनाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “आँखों के बीच”; आशय माथे के क्षेत्र से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים
  choice: पुत्र
  rationale: इब्रानी संज्ञा व्याकरण की दृष्टि से पुल्लिंग बहुवचन है। covenantal पहचान के कथन में ‘पुत्र’ स्रोत-रूप को सुरक्षित रखता है; समावेशी अर्थ ‘सन्तान’ भी सम्भव है।
- source_word: לַיהוָה
  choice: यहोवा के
  rationale: यहाँ ל संबंध अथवा अधिकार को व्यक्त करता है; ‘यहोवा के पुत्र’ स्वाभाविक हिन्दी में वाचा-संबंध को स्पष्ट करता है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय सहित पद का अर्थ ‘तुम्हारे परमेश्वर’ है; पूरे वाक्य में ‘अपने परमेश्वर’ स्वाभाविक हिन्दी है।
- source_word: תִתְגֹּדְדוּ
  choice: अपने शरीर को न काटना
  rationale: प्रतिबिंबात्मक क्रिया शोक-संबंधी आत्म-क्षति या चीरने-काटने को दर्शाती है। ‘अपने शरीर को काटना’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: קָרְחָה
  choice: गंजा स्थान
  rationale: यह संज्ञा बाल हटाकर बनाए गए गंजे चकत्ते या स्थान को दर्शाती है; ‘गंजा स्थान’ ठोस चित्र को बनाए रखता है।
- source_word: בֵּין עֵינֵיכֶם
  choice: अपनी आँखों के बीच
  rationale: यह इब्रानी पद का औपचारिक रूप है। शारीरिक संकेत माथे के क्षेत्र की ओर है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לָמֵת
  choice: किसी मृतक के लिए
  rationale: यह मृत्यु के कारण किए जाने वाले शोकाचार को इंगित करता है। एकवचन ‘मृतक’ स्रोत के एकवचन रूप को बनाए रखता है।
theological_decisions:
- issue: वाचा-समुदाय की लिंगसूचक पहचान
  choice: पुत्र
  alternative: सन्तान
  rationale: स्रोत में पुल्लिंग बहुवचन בָּנִים है, इसलिए मुख्य पाठ में उसका रूप सुरक्षित रखा गया है। इसका उद्देश्य समुदाय की स्त्रियों को बाहर करना नहीं, बल्कि इब्रानी शब्दावली को प्रतिबिंबित करना है।
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: पाठ में परमेश्वर का विशिष्ट वाचा-नाम है। हिन्दी के परिचित बाइबलीय रूप ‘यहोवा’ से नाम को सामान्य उपाधि ‘प्रभु’ में बदलने से बचाया गया है; ‘याहवे’ अधिक प्रत्यक्ष लिप्यंतरण है।
- issue: निषिद्ध शोकाचार का दायरा
  choice: मृतक के लिए शरीर काटना और माथे पर गंजा स्थान बनाना
  alternative: सामान्य रूप से शरीर काटने और गंजापन करने का निषेध
  rationale: वाक्य के अंत का לָמֵת दोनों निषेधों को मृत्यु-शोक के प्रसंग से जोड़ सकता है। हिन्दी वाक्य में ‘किसी मृतक के लिए’ पहले रखकर यह संबंध स्पष्ट किया गया है, बिना किसी विशेष गैर-इस्राएली पंथ का नाम जोड़े।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुत्र’ और ‘आँखों के बीच’ जैसे स्रोत-सन्निकट पद बनाए रखते हुए आवश्यक शारीरिक स्पष्टीकरण पादटिप्पणी में दिया गया है।
