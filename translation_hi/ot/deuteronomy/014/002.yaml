review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the explanatory force of כִּי, holiness, Yahweh's election, selection from among all peoples, and the earth-wide scope. A small revision better expresses סְגֻלָּה as a specially valued/possessed people and makes the purpose clause more idiomatic in Hindi.
  naturalness: The draft is generally clear and dignified. “उसकी बहुमूल्य प्रजा बनो” is understandable, but “उसकी विशेष प्रजा हो” is more natural in modern Hindi and avoids the somewhat commercial sense of “बहुमूल्य.” “पृथ्वी पर की सभी जातियों” is also more direct than “पृथ्वी भर की सब जातियों.”
  terminology: “पवित्र प्रजा,” “यहोवा,” and “जातियों में से” are appropriate. “विशेष प्रजा” with a footnote for “विशेष संपत्ति” preserves the valued-possession nuance of סְגֻלָּה without losing the explicit word עַם (“people”).
  issues:
  - severity: low
    issue: The main-text rendering “बहुमूल्य प्रजा” only partially represents the possession/treasured-property nuance of סְגֻלָּה.
    rationale: It can mean merely a valuable people. “विशेष प्रजा,” supported by a lexical footnote giving “विशेष संपत्ति,” better retains the covenantal possession sense while remaining natural Hindi.
  - severity: low
    issue: The wording of the purpose clause is slightly less idiomatic than necessary.
    rationale: With the completed election expressed by “चुन लिया है,” “कि तुम उसकी विशेष प्रजा हो” reads smoothly and conveys the intended status without adding a change-of-state implication.
  revised_text: क्योंकि तुम अपने परमेश्वर यहोवा के लिए एक पवित्र प्रजा हो, और यहोवा ने पृथ्वी पर की सभी जातियों में से तुम्हें चुन लिया है कि तुम उसकी विशेष प्रजा[a] हो।
  revised_footnotes:
  - marker: a
    text: या, “उसकी विशेष संपत्ति।” हिब्रू शब्द סְגֻלָּה ऐसी संपत्ति को दर्शाता है जिसे विशेष रूप से मूल्यवान माना जाता है।
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s covenantal election language and its non-comparative “from among all peoples” sense. It improves the modern-Hindi flow and more clearly preserves the lexical range of סְגֻלָּה through the text-plus-footnote combination, without imposing theological conclusions beyond the verse.
