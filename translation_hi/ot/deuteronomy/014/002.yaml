source:
  edition: WLC
  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ וּ/בְ/ךָ֞ בָּחַ֣ר יְהוָ֗ה לִֽ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/002.yaml
  text: For you are a holy people to Yahweh your God[a], and Yahweh has chosen you to be a treasured people for himself out of all the peoples who are on the face of the earth.
translation:
  language: hi
  text: क्योंकि तुम अपने परमेश्वर यहोवा के लिए एक पवित्र प्रजा हो, और यहोवा ने पृथ्वी पर की सभी जातियों में से तुम्हें चुन लिया है कि तुम उसकी विशेष प्रजा[a] हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी विशेष संपत्ति।” हिब्रू शब्द סְגֻלָּה ऐसी संपत्ति को दर्शाता है जिसे विशेष रूप से मूल्यवान माना जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले निषेध का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַם קָדוֹשׁ
  choice: एक पवित्र प्रजा
  rationale: यह वाचा-समुदाय को परमेश्वर के लिए अलग ठहराए गए समुदाय के रूप में दर्शाता है; ‘पवित्र प्रजा’ अर्थ और गरिमा दोनों बनाए रखता है।
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा के लिए
  rationale: ל संबंध और समर्पित होने का भाव रखता है; ‘के लिए’ हिन्दी में इस वाचाई संबंध को सहजता से व्यक्त करता है।
- source_word: וּבְךָ בָּחַר יְהוָה
  choice: और यहोवा ने ... तुम्हें चुन लिया है
  rationale: בחר ב किसी को चुनने का मुहावरा है। हिन्दी में कर्म को सीधे ‘तुम्हें’ कहना स्वाभाविक है; पूर्ण क्रिया के वर्तमान वाचाई परिणाम को ‘चुन लिया है’ व्यक्त करता है।
- source_word: לִהְיוֹת לוֹ
  choice: कि तुम उसकी ... बनो
  rationale: यह चुनाव के उद्देश्य अथवा परिणाम को व्यक्त करता है; हिन्दी में ‘कि ... बनो’ स्वाभाविक और अर्थ-संगत है।
- source_word: לְעַם סְגֻלָּה
  choice: बहुमूल्य प्रजा
  rationale: סְגֻלָּה किसी विशेष रूप से मूल्यवान निजी संपत्ति को सूचित करता है। चूँकि עַם स्पष्ट रूप से उपस्थित है, ‘बहुमूल्य प्रजा’ दोनों तत्वों को संक्षेप और सहज ढंग से रखता है।
- source_word: מִכֹּל הָעַמִּים
  choice: सब जातियों में से
  rationale: מן यहाँ बड़े समूह के बीच से चुनाव बताता है, न कि अनिवार्य रूप से श्रेष्ठता; ‘में से’ यही चयनात्मक अर्थ स्पष्ट करता है।
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: पृथ्वी भर की
  rationale: यह पृथ्वी पर रहने वाली सभी जातियों के लिए हिब्रू मुहावरा है; ‘पृथ्वी भर की’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत वाचाई नाम को उपाधि में बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: इस्राएल के चुनाव का स्वरूप
  choice: पद को वाचाई संबंध, परमेश्वर के चुनाव और उसकी बहुमूल्य प्रजा होने के रूप में प्रस्तुत किया गया है।
  alternative: מִכֹּל का अनुवाद ‘सब जातियों से बढ़कर’ करके तुलनात्मक श्रेष्ठता पर बल देना।
  rationale: हिब्रू पाठ पृथ्वी की सभी जातियों में से इस्राएल के चुने जाने की बात करता है। ‘में से’ चुनाव को सुरक्षित रखता है, पर जातीय श्रेष्ठता या बाद की किसी धर्मवैज्ञानिक प्रणाली को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वाचाई भाषा रखी गई है। ‘प्रजा’ सामुदायिक और संबंधपरक भाव देता है; ‘जातियों में से’ मूल पाठ के चयनात्मक अर्थ को बिना अतिरिक्त श्रेष्ठतावादी संकेत के सुरक्षित रखता है।
