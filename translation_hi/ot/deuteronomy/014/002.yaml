revisions:
- from: क्योंकि तुम अपने परमेश्वर यहोवा के लिए एक पवित्र प्रजा हो, और यहोवा ने पृथ्वी भर की सब जातियों में से तुम्हें चुन लिया है कि तुम उसकी बहुमूल्य प्रजा[a] बनो।
  to: क्योंकि तुम अपने परमेश्वर यहोवा के लिए एक पवित्र प्रजा हो, और यहोवा ने पृथ्वी पर की सभी जातियों में से तुम्हें चुन लिया है कि तुम उसकी विशेष प्रजा[a] हो।
  rationale: The revision retains the source’s covenantal election language and its non-comparative “from among all peoples” sense. It improves the modern-Hindi flow and more clearly preserves the lexical range of סְגֻלָּה through the text-plus-footnote combination, without imposing theological conclusions beyond the verse.
