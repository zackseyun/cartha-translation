  yaml_path: translation/ot/deuteronomy/014/022.yaml
  text: You shall surely tithe all the produce of your seed that comes out of the field[a], year by year.
translation:
  language: hi
  text: तुम्हारे बोए हुए बीज से होने वाली सारी उपज में से, जो खेत से निकलती है, वर्ष-दर-वर्ष दशमांश अवश्य देना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक भावानुवाद में: “हर वर्ष तुम्हारे खेत में होने वाली सारी उपज का दशमांश अवश्य देना।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשֵּׂר תְּעַשֵּׂר
  choice: दशमांश अवश्य देना
  rationale: इब्रानी में क्रिया के साथ उसी धातु का infinitive absolute आज्ञा को बल देता है। हिंदी में ‘अवश्य’ उस जोर को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: תְּבוּאַת
  choice: उपज
  rationale: यह शब्द खेत से प्राप्त कृषि-उत्पादन या पैदावार को व्यापक रूप से दर्शाता है; ‘उपज’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: זַרְעֶךָ
  choice: अपने बीज
  rationale: मूल रूपक को बनाए रखने के लिए ‘बीज’ रखा गया है। संदर्भ में इसका अर्थ बोए हुए बीज से होने वाली कृषि-उपज है।
- source_word: הַיֹּצֵא הַשָּׂדֶה
  choice: जो खेत से निकलती है
  rationale: यह इब्रानी कृदंत-वाक्यांश का निकट और हिंदी में बोधगम्य रूप है; अधिक गतिशील अनुवाद ‘जो खेत उपजाता है’ भी संभव है।
- source_word: שָׁנָה שָׁנָה
  choice: वर्ष-प्रतिवर्ष
  rationale: शब्द की पुनरावृत्ति नियमित वार्षिक क्रम बताती है। ‘वर्ष-प्रतिवर्ष’ इस वितरणात्मक बल को संक्षेप में बनाए रखता है।
