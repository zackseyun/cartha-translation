translation:
  language: hi
  text: तुम कोई भी घृणित वस्तु मत खाना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई भी घिनौनी वस्तु।” इब्रानी शब्द ऐसी वस्तु के लिए है जिसे घृणित या निंदनीय माना जाता है; यहाँ यह आगे दी गई निषिद्ध भोजनों की सूची का परिचय देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאכַל
  choice: न खाना
  rationale: לֹא के साथ द्वितीय पुरुष एकवचन अपूर्ण क्रिया यहाँ व्यवस्था-संबंधी सीधा निषेध व्यक्त करती है। हिंदी में ‘न खाना’ इस आज्ञात्मक बल को स्वाभाविक और स्पष्ट रूप से रखता है।
- source_word: כָּל
  choice: कोई भी
  rationale: निषेध के अंतर्गत एकवचन संज्ञा के साथ כָּל का व्यापक अर्थ हिंदी में स्वाभाविक रूप से ‘कोई भी’ से व्यक्त होता है।
- source_word: תּוֹעֵבָה
  choice: घृणित वस्तु
  rationale: यह शब्द ऐसी वस्तु को बताता है जो घिनौनी, निंदनीय या निषिद्ध मानी जाती है। यहाँ आगे आने वाले निषिद्ध भोजनों की सूची का परिचय है; ‘घृणित वस्तु’ इसके प्रबल नकारात्मक अर्थ को बनाए रखता है, पर इसे केवल स्वाद या स्वच्छता तक सीमित नहीं करता।
theological_decisions:
- issue: वाचा की व्यवस्था में निषेध का बल
  choice: 'सीधा आदेशात्मक निषेध: ‘तुम कोई भी घृणित वस्तु न खाना।’'
  alternative: 'सामान्य कथन: ‘तुम कोई भी घृणित वस्तु नहीं खाते।’'
  rationale: इस कानूनी प्रसंग में לֹא के साथ अपूर्ण क्रिया भविष्यवाणी या सामान्य आदत नहीं, बल्कि बाध्यकारी निषेध व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और प्रत्यक्ष विधिक शैली। एकवचन संबोधन ‘तुम’ इब्रानी द्वितीय पुरुष पुल्लिंग एकवचन के अनुरूप है।
