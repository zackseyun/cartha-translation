source:
  edition: WLC
  text: מִ/קְצֵ֣ה שָׁלֹ֣שׁ שָׁנִ֗ים תּוֹצִיא֙ אֶת כָּל מַעְשַׂר֙ תְּבוּאָ֣תְ/ךָ֔ בַּ/שָּׁנָ֖ה הַ/הִ֑וא וְ/הִנַּחְתָּ֖ בִּ/שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/028.yaml
  text: At the end of every three years[b][a], you shall bring out all the tithe of your produce in that year and lay it up within your gates.
translation:
  language: hi
  text: हर तीन वर्ष के अंत में[a] तुम उस वर्ष की अपनी उपज का पूरा दशमांश निकालकर अपने नगरों में[b] रख देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रत्येक तीसरे वर्ष के अंत में।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘अपने फाटकों के भीतर’; यहाँ इसका अर्थ अपने स्थानीय नगरों या बस्तियों में है।
    reason: cultural_note
lexical_decisions:
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: हर तीन वर्ष के अंत में
  rationale: यह समय की उस सीमा को व्यक्त करता है जिस पर यह बार-बार होने वाली व्यवस्था लागू होती है। ‘हर’ से त्रैवार्षिक पुनरावृत्ति स्वाभाविक हिन्दी में स्पष्ट होती है, जबकि ‘प्रत्येक तीसरे वर्ष’ को पादटिप्पणी में वैकल्पिक रूप में रखा गया है।
- source_word: תּוֹצִיא
  choice: निकालकर
  rationale: हिफ़ील रूप का मूल भाव किसी वस्तु को बाहर निकालना है। यह दशमांश को अपने सामान्य भंडार या अधिकार से अलग करने की ठोस क्रिया को बनाए रखता है।
- source_word: כָּל מַעְשַׂר
  choice: पूरा दशमांश
  rationale: כָּל यहाँ निर्धारित दसवें अंश की संपूर्ण मात्रा पर बल देता है; ‘पूरा दशमांश’ इस व्यापकता को सहज हिन्दी में व्यक्त करता है।
- source_word: תְּבוּאָתְךָ
  choice: अपनी उपज
  rationale: תְּבוּאָה भूमि से प्राप्त कृषि-उत्पादन के लिए व्यापक शब्द है। ‘उपज’ इसे केवल अनाज या किसी एक फसल तक सीमित नहीं करता।
- source_word: בַּשָּׁנָה הַהִוא
  choice: उस वर्ष की
  rationale: यह संबंधित वर्ष में हुई उपज और उससे निकाले जाने वाले दशमांश को निर्दिष्ट करता है। हिन्दी में संबंधकारक रचना अर्थ को स्वाभाविक और स्पष्ट बनाती है।
- source_word: וְהִנַּחְתָּ
  choice: रख देना
  rationale: कारक रूप का भाव किसी वस्तु को निर्धारित स्थान पर रख छोड़ना या जमा करना है। ‘रख देना’ आज की सामान्य हिन्दी में सरल है और संदर्भ की भंडारण-संबंधी क्रिया को बनाए रखता है।
- source_word: בִּשְׁעָרֶיךָ
  choice: अपने नगरों में
  rationale: शाब्दिक अर्थ ‘अपने फाटकों के भीतर’ है, पर प्राचीन इब्रानी प्रयोग में ‘फाटक’ नगर अथवा स्थानीय अधिकार-क्षेत्र का संकेत करता है। मुख्य पाठ में आशय दिया गया है और मूल बिंब पादटिप्पणी में सुरक्षित है।
