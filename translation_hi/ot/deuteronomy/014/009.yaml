  yaml_path: translation/ot/deuteronomy/014/009.yaml
  text: 'You may eat this from all that are in the waters: everything that has fins and scales you may eat.'
translation:
  language: hi
  text: 'जल में रहनेवाले जीवों में से तुम यह खा सकते हो: जिनके पंख और शल्क हों, उन सबको तुम खा सकते हो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמָּיִם
  choice: जल में रहनेवाले जीवों में से
  rationale: शाब्दिक अर्थ ‘जल में’ है; संदर्भ में खाने योग्य जलीय जीव अभिप्रेत हैं, इसलिए हिन्दी में वाक्य को स्वाभाविक और स्पष्ट बनाया गया है।
- source_word: סְנַפִּיר
  choice: पंख
  rationale: जलीय जीवों के संदर्भ में यह तैरने वाले पंख (fins) को दर्शाता है; सामान्य हिन्दी में ‘पंख’ सहज है।
- source_word: קַשְׂקֶשֶׂת
  choice: शल्क
  rationale: मछली के शरीर पर पाए जाने वाले scales के लिए सटीक और मानक हिन्दी शब्द।
- source_word: תֹּאכְלוּ
  choice: तुम खा सकते हो
  rationale: व्यवस्था में अनुमति व्यक्त करने वाले इस रूप को स्वाभाविक हिन्दी में ‘खा सकते हो’ से प्रस्तुत किया गया है।
