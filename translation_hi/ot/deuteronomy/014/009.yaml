  register: आधुनिक मानक हिन्दी; विधिक निर्देश का सीधा, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘यह’ की पुनरावृत्ति के बजाय बहुवचन ‘इन्हें’ संदर्भगत जलीय जीवों से स्वाभाविक रूप से जुड़ता है।
