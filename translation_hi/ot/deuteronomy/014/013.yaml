lexical_decisions:
- source_word: הָרָאָה
  choice: लाल चील
  rationale: इस पक्षी की ठीक पहचान अनिश्चित है; आधुनिक कोशों में इसे प्रायः चील की एक किस्म, विशेषतः लाल चील, माना गया है।
- source_word: הָאַיָּה
  choice: बाज़
  rationale: यह किसी शिकारी पक्षी का नाम है और प्रायः बाज़ समझा जाता है; यह अनुवाद सूची के पास-पास आए पक्षीनामों में भेद भी बनाए रखता है।
- source_word: הַדַּיָּה
  choice: चील
  rationale: इस शिकारी पक्षी को सामान्यतः चील माना जाता है, यद्यपि इसकी सटीक प्रजाति और הָאַיָּה से इसका भेद निश्चित नहीं है।
- source_word: לְמִינָהּ
  choice: की सब जातियाँ
  rationale: यह सूत्र किसी जीव के प्रकारों या प्रजातियों को समेटता है। सूची के स्वाभाविक हिन्दी रूप में ‘की सब जातियाँ’ उसके वर्गगत अर्थ को स्पष्ट करता है।
- source_word: וְאֶת
  choice: और
  rationale: संयोजक वाव सूची की वस्तुओं को जोड़ता है; कर्म-सूचक אֵת का हिन्दी में अलग अनुवाद आवश्यक नहीं है।
