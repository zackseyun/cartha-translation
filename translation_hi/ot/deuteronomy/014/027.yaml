source:
  edition: WLC
  text: וְ/הַ/לֵּוִ֥י אֲשֶׁר בִּ/שְׁעָרֶ֖י/ךָ לֹ֣א תַֽעַזְבֶ֑/נּוּ כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/027.yaml
  text: And you shall not neglect the Levite who is within your gates[c][b][a], because he has no portion or inheritance with you.
translation:
  language: hi
  text: और अपने नगरों में रहने वाले लेवीय की उपेक्षा न करना,[a][b] क्योंकि तुम्हारे साथ उसका कोई भाग या विरासत नहीं है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे फाटकों के भीतर”; यह इब्रानी मुहावरा नगरों या स्थानीय समुदायों के लिए प्रयुक्त होता है।
    reason: cultural_note
  - marker: b
    text: या, “उसे त्याग न देना” अथवा “उसे बेसहारा न छोड़ना।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात लेवीय को इस्राएल के अन्य गोत्रों के समान भूमि का सामान्य गोत्रीय भाग नहीं मिला था।
    reason: cross_reference
lexical_decisions:
- source_word: וְהַלֵּוִי
  choice: और ... लेवीय
  rationale: निश्चित एकवचन यहाँ लेवी समुदाय के प्रतिनिधि सदस्य को दर्शाता है। ‘लेवीय’ सटीक है; ‘याजक’ जोड़ना मूल से अधिक अर्थ भरना होगा।
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: अपने नगरों में रहने वाले
  rationale: शाब्दिक ‘जो तुम्हारे फाटकों के भीतर है’ एक इब्रानी मुहावरा है, जिसका आशय स्थानीय नगरों या बस्तियों में रहने से है। स्वाभाविक आधुनिक हिन्दी में अर्थ स्पष्ट किया गया है।
- source_word: לֹא תַעַזְבֶנּוּ
  choice: उसकी उपेक्षा न करना
  rationale: עזב का अर्थ छोड़ना, त्यागना या बेसहारा छोड़ देना हो सकता है। यहाँ लेवीय की आर्थिक देखभाल के संदर्भ में ‘उपेक्षा’ व्यावहारिक आशय को स्वाभाविक रूप से व्यक्त करती है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आज्ञा का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: אֵין לוֹ
  choice: उसका कोई ... नहीं है
  rationale: इब्रानी अस्तित्ववाचक रचना का स्वाभाविक हिन्दी रूप।
- source_word: חֵלֶק וְנַחֲלָה
  choice: भाग या विरासत
  rationale: यह युग्म हिस्से और पैतृक/भूमिगत अधिकार को व्यक्त करता है। हिन्दी में ‘भाग या विरासत’ समग्र अभाव को स्वाभाविक ढंग से बताता है और दोनों पदों का भेद बनाए रखता है।
- source_word: עִמָּךְ
  choice: तुम्हारे साथ
  rationale: पूर्वसर्ग का सीधा रूप, जो इस बात को बनाए रखता है कि लेवीय को अन्य इस्राएलियों के समान भूमि का हिस्सा प्राप्त नहीं है।
theological_decisions:
- issue: लेवीय के भाग और विरासत से वंचित होने का स्वरूप
  choice: यह सामान्य इस्राएली गोत्रों के समान भूमि का भाग न मिलने की ओर संकेत करता है, इसलिए समुदाय को उसकी उपेक्षा नहीं करनी है।
  alternative: इसे भूमि-अधिकार के विशेष संदर्भ के बिना केवल सामान्य सामाजिक वंचना माना जाए।
  rationale: व्यवस्थाविवरण के व्यापक संदर्भ में ‘भाग और विरासत’ लेवियों को सामान्य गोत्रीय भू-आवंटन न मिलने की ओर संकेत करता है। मुख्य पाठ संक्षिप्त रहता है और पृष्ठभूमि पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्रोत के कानूनी-उपदेशात्मक स्वर को ‘न करना’ से बनाए रखा गया है। ‘फाटकों’ के शाब्दिक मुहावरे को मुख्य पाठ में स्वाभाविक ‘नगरों’ से व्यक्त कर स्रोत-छवि को पादटिप्पणी में सुरक्षित रखा गया है।
