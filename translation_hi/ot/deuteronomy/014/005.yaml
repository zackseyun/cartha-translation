  text: the deer[a], the gazelle, the roebuck, the wild goat, the ibex, the antelope, and the mountain sheep.
translation:
  language: hi
  text: हिरन[a], चिकारा, हिरन की एक जाति, जंगली बकरा, आइबेक्स, मृग और पहाड़ी भेड़।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में आए कई पशुओं के नामों की पहचान निश्चित नहीं है। ‘हिरन की एक जाति’ रो हिरन, चितकबरा हिरन या लाल हिरन हो सकती है; ‘जंगली बकरा’ आइबेक्स हो सकता है; ‘आइबेक्स’ अडैक्स या जंगली बकरा भी हो सकता है; ‘मृग’ जंगली बैल या विलुप्त आदिम जंगली बैल हो सकता है; और ‘पहाड़ी भेड़’ शामोआ या पहाड़ी बकरा हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּל
  choice: हिरन
  rationale: यह हिरन जाति के पशु को सूचित करता है; आधुनिक हिन्दी में ‘हिरन’ स्वाभाविक और व्यापक रूप से समझा जाने वाला नाम है।
- source_word: צְבִי
  choice: चिकारा
  rationale: इसका सामान्य आधुनिक अभिज्ञान गज़ेल से है; भारतीय हिन्दी पाठक के लिए ‘चिकारा’ निकट और परिचित पशु-नाम है।
- source_word: יַחְמוּר
  choice: बारहसिंगा
  rationale: सटीक प्रजाति अनिश्चित है। ‘बारहसिंगा’ हिरन-जाति के एक पशु का सहज हिन्दी नाम देता है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: אַקּוֹ
  choice: जंगली बकरा
  rationale: संभवतः कोई जंगली बकरी-वंशी पशु, प्रायः आइबेक्स, अभिप्रेत है; ‘जंगली बकरा’ सामान्य पाठक के लिए अधिक स्पष्ट है।
- source_word: דִישֹׁן
  choice: आइबेक्स
  rationale: ठीक अभिज्ञान विवादित है; ‘आइबेक्स’ एक सम्भव पशु-नाम है, पर अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: תְאוֹ
  choice: मृग
  rationale: पशु की पहचान अनिश्चित है। ‘मृग’ किसी वन्य खुरदार पशु का व्यापक, पठनीय नाम है और अत्यधिक विशिष्ट पहचान थोपने से बचता है।
- source_word: זָמֶר
  choice: पहाड़ी भेड़
  rationale: सटीक प्रजाति अज्ञात है; ‘पहाड़ी भेड़’ सम्भावित पशु-प्रकार को सरल आधुनिक हिन्दी में व्यक्त करता है।
