    reason: lexical_alternative
  - marker: c
    text: कुछ पुरानी अनुवाद-परंपराओं में इसे “टिटिहरी” कहा गया है; इब्रानी शब्द से “हुदहुद” की पहचान अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲסִידָה
  choice: सारस
  rationale: यह इस पक्षी-नाम की परंपरागत और सर्वाधिक स्वीकृत पहचान है; फिर भी सटीक प्रजाति अनिश्चित होने के कारण पादटिप्पणी दी गई है।
- source_word: הָאֲנָפָה
  choice: बगुला
  rationale: सटीक पक्षी-प्रजाति अनिश्चित है। 'बगुला' आधुनिक हिन्दी में जल के पास रहने वाले इस व्यापक पक्षी-वर्ग के लिए सहज और प्रचलित शब्द है।
- source_word: לְמִינָהּ
  choice: हर प्रकार का
  rationale: यह सूत्र उस पक्षी की जाति या व्यापक वर्ग के अंतर्गत आने वाले प्रकारों को समेटता है; हिन्दी में संक्षिप्त और स्वाभाविक अभिव्यक्ति है।
- source_word: הַדּוּכִיפַת
  choice: हुदहुद
  rationale: आधुनिक विद्वत्ता सामान्यतः इस दुर्लभ इब्रानी पक्षी-नाम की पहचान hoopoe से करती है, जिसका मानक हिन्दी नाम 'हुदहुद' है।
- source_word: הָעֲטַלֵּף
  choice: चमगादड़
  rationale: इब्रानी शब्द स्पष्ट रूप से चमगादड़ को सूचित करता है; सूची में उड़ने वाले जीवों के बीच रखे जाने के बावजूद सीधा प्राणी-नाम बनाए रखा गया है।
