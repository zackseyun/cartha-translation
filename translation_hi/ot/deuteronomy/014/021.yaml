base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/021.yaml
  text: You shall not eat any carcass[a]. You may give it to the sojourner who is within your gates, and he may eat it; or you may sell it to a foreigner. For you are a holy people to Yahweh your God[e][d][c][b]. You shall not boil a young goat in its mother's milk.
translation:
  language: hi
  text: तुम किसी भी मरे हुए पशु को मत खाना।[a] उसे तुम अपने नगरों में रहनेवाले परदेशी को दे सकते हो और वह उसे खा सकता है, या किसी विदेशी को बेच सकते हो।[b] क्योंकि तुम अपने परमेश्वर यहोवा के लिए पवित्र प्रजा हो। बकरी के बच्चे को उसकी माँ के दूध में मत उबालना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ऐसा पशु जो अपने-आप मर गया हो या जिसका अनुमत रीति से वध न किया गया हो।
    reason: נְבֵלָה के विशिष्ट कानूनी और आहार-संबंधी अर्थ को स्पष्ट करना।
  - marker: b
    text: यहाँ “परदेशी” उस गैर-इस्राएली निवासी के लिए है जो इस्राएली नगरों में रहता था; “विदेशी” उससे अलग, बाहर के विदेशी व्यक्ति को दर्शाता है।
    reason: גֵּר और נָכְרִי के बीच मूल पाठ का सामाजिक-कानूनी भेद सुरक्षित करना।
lexical_decisions:
- source_word: נְבֵלָה
  choice: मरे हुए पशु का मांस
  rationale: यह शब्द ऐसे पशु के शव को सूचित करता है जो अनुमत रीति से वध न किया गया हो, विशेषकर अपने-आप मर गया हो। हिन्दी में यह पद भोजन-संबंधी निषेध को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: גֵּר
  choice: अपने नगरों में रहनेवाला परदेशी
  rationale: גֵּר इस्राएली समुदाय में रहनेवाले गैर-इस्राएली निवासी को दर्शाता है; निवास का उल्लेख अगले पद נָכְרִי से भेद बनाए रखता है।
- source_word: בִּשְׁעָרֶיךָ
  choice: अपने नगरों में
  rationale: शाब्दिक अर्थ 'तेरे फाटकों के भीतर' है, पर यह नगरों अथवा स्थानीय समुदायों में रहने का इब्रानी मुहावरा है।
- source_word: תִּתְּנֶנָּה וַאֲכָלָהּ
  choice: दे सकते हो और वह उसे खा सकता है
  rationale: कानूनी संदर्भ में ये रूप निषेध के विपरीत अनुमत कार्य बताते हैं; हिन्दी में संभावनार्थक रूप अनिवार्य दान का अतिरिक्त भाव आने से रोकता है।
- source_word: נָכְרִי
  choice: विदेशी
  rationale: यह सामान्य बाहरी विदेशी व्यक्ति को दर्शाता है और समुदाय में बसे גֵּר से उसका भेद सुरक्षित रखता है।
- source_word: עַם קָדוֹשׁ
  choice: पवित्र प्रजा
  rationale: यह परमेश्वर के लिए अलग की गई वाचा-समुदाय की स्थिति व्यक्त करनेवाली मानक धार्मिक भाषा है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ल उपसर्ग समर्पण अथवा संबंध व्यक्त करता है, और יהוה को उसके व्यक्तिगत वाचा-नाम 'यहोवा' से प्रस्तुत किया गया है।
- source_word: גְּדִי
  choice: बकरी का बच्चा
  rationale: आधुनिक हिन्दी में यह स्पष्ट और स्वाभाविक है तथा पशु की कम आयु का अर्थ बनाए रखता है।
- source_word: תְבַשֵּׁל
  choice: उबालना
  rationale: क्रिया तरल में पकाने या उबालने को सूचित कर सकती है; दूध के संदर्भ में 'उबालना' ठोस चित्र को सुरक्षित रखता है।
- source_word: בַּחֲלֵב אִמּוֹ
  choice: उसकी माँ के दूध में
  rationale: यह इब्रानी वाक्यांश का स्वाभाविक हिन्दी रूप है और निषेध की ठोस छवि बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबल-परंपरा में परिचित 'यहोवा' नाम को रखा गया है, न कि उसे उपाधि 'प्रभु' से बदलकर मूल का भेद मिटाया गया है।
- issue: मरे पशु को देने अथवा बेचनेवाली कानूनी क्रियाओं का बल
  choice: 'अनुमति: ''दे सकते हो ... बेच सकते हो'''
  alternative: 'आदेश: ''देना ... बेचना'''
  rationale: संदर्भ का मुख्य निषेध इस्राएलियों का उसे खाना है; आगे के कार्य अनुमत निपटान बताते हैं। संभावनार्थक हिन्दी अनिवार्य रूप से देने या बेचने की ऐसी बाध्यता नहीं जोड़ती जिसे संदर्भ स्पष्टतः नहीं माँगता।
translation_notes:
  register: आधुनिक मानक हिन्दी, संबोधन में एकवचन सामूहिक 'तुम', और सरल पर गरिमापूर्ण कानूनी शैली अपनाई गई है। 'फाटकों के भीतर' के शाब्दिक मुहावरे को स्वाभाविक अर्थ 'नगरों में' दिया गया है।
