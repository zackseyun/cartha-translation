  yaml_path: translation/ot/deuteronomy/014/012.yaml
  text: 'And these are the ones that you shall not eat from among them: the eagle[a], the bearded vulture, and the black vulture.'
translation:
  language: hi
  text: 'और इनमें से इन पक्षियों को मत खाना: उकाब[a], दाढ़ी वाला गिद्ध और काला गिद्ध।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में आए इब्रानी पक्षी-नामों की ठीक पहचान निश्चित नहीं है। “उकाब” से किसी बड़े गिद्ध का भी संकेत हो सकता है; “दाढ़ी वाला गिद्ध” को परंपरागत रूप से “हड्डी-तोड़ पक्षी” कहा गया है; और “काला गिद्ध” का अनुवाद कुछ लोग “मछलीमार उकाब” या “समुद्री उकाब” करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: और ... इन पक्षियों
  rationale: इब्रानी में रूप एकवचन (‘और यह’) है, पर यह आगे आने वाली सूची का परिचय देता है; इसलिए स्वाभाविक हिन्दी में बहुवचन सूची-सूचक अभिव्यक्ति अपनाई गई है।
- source_word: אֲשֶׁר לֹא תֹאכְלוּ מֵהֶם
  choice: उनमें से ... तुम न खाना
  rationale: निषेध को सीधे रूप में रखा गया है और מִן का अंशवाचक भाव ‘उनमें से’ द्वारा सुरक्षित किया गया है।
- source_word: הַנֶּשֶׁר
  choice: उकाब
  rationale: यह נֶשֶׁר का प्रचलित और सहज हिन्दी पर्याय है; फिर भी मूल पक्षी की पहचान किसी बड़े गिद्ध से भी हो सकती है, इसलिए अनिश्चितता पाद-टिप्पणी में दी गई है।
- source_word: הַפֶּרֶס
  choice: दाढ़ीवाला गिद्ध
  rationale: आधुनिक पक्षिवैज्ञानिक पहचान के अनुसार यह स्पष्ट और सामान्य पाठक के लिए समझने योग्य नाम है; पारंपरिक ‘हड्डी-तोड़ पक्षी’ कम विशिष्ट है।
- source_word: הָעָזְנִיָּה
  choice: काला गिद्ध
  rationale: यह एक प्रचलित आधुनिक विद्वत्तापूर्ण पहचान है, यद्यपि प्रजाति निश्चित नहीं है; अन्य संभावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
