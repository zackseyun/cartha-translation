  text: You may eat any clean bird[a].
translation:
  language: hi
  text: तुम हर शुद्ध पक्षी को खा सकते हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל
  choice: हर
  rationale: यह शब्द शुद्ध पक्षियों की पूरी श्रेणी को समेटता है। ‘हर’ आधुनिक हिन्दी में व्यापक अनुमति को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: עוֹף
  choice: पक्षी
  rationale: यद्यपि यह इब्रानी शब्द व्यापक अर्थ में उड़नेवाले प्राणियों को भी दर्शा सकता है, निकटवर्ती आहार-विधि के संदर्भ में ‘पक्षी’ सबसे स्पष्ट और स्वाभाविक है।
- source_word: טָהוֹר
  choice: शुद्ध
  rationale: यहाँ यह आहार-विधि की धार्मिक श्रेणी को दर्शाता है, न कि केवल शारीरिक स्वच्छता या सामान्य नैतिक पवित्रता को।
- source_word: תֹּאכֵלוּ
  choice: खा सकते हो
  rationale: निषिद्ध पक्षियों के विपरीत यहाँ क्रिया अनुमति व्यक्त करती है। ‘खा सकते हो’ आधुनिक हिन्दी में इस विधिक अनुमति को सहजता से संप्रेषित करता है।
