  register: आधुनिक मानक हिन्दी में संक्षिप्त, स्पष्ट और गरिमापूर्ण विधान। इब्रानी का सामान्य शब्दक्रम हिन्दी की स्वाभाविक वाक्य-रचना के अनुसार बदला गया है; कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
