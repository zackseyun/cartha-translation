- source_word: כָּל
  choice: हर
  rationale: यह परिमाणवाचक शब्द पूरी श्रेणी को समेटता है। एकवचन ‘पक्षी’ के साथ ‘हर’ आधुनिक हिन्दी में स्वाभाविक रूप से व्यापक अनुमति व्यक्त करता है।
- source_word: צִפּוֹר
  choice: पक्षी
  rationale: यह संज्ञा सामान्यतः पक्षी को दर्शाती है; आहार-संबंधी इस प्रसंग में ‘पक्षी’ स्पष्ट और स्वाभाविक है।
- source_word: טְהֹרָה
  choice: शुद्ध
  rationale: व्यवस्थाविवरण के आहार-संबंधी विधान में यह अनुमत धार्मिक/विधिक श्रेणी का मानक शब्द है; ‘शुद्ध’ उस श्रेणीगत भेद को बनाए रखता है।
- source_word: תֹּאכֵלוּ
  choice: खा सकते हो
  rationale: यहाँ द्वितीय पुरुष बहुवचन अपूर्ण क्रिया विधिक अनुमति व्यक्त करती है। ‘खा सकते हो’ आधुनिक हिन्दी में इसे आज्ञा के बजाय स्पष्ट अनुमति के रूप में बताता है।
