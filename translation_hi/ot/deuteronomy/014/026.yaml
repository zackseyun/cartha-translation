source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה הַ/כֶּ֡סֶף בְּ/כֹל֩ אֲשֶׁר תְּאַוֶּ֨ה נַפְשְׁ/ךָ֜ בַּ/בָּקָ֣ר וּ/בַ/צֹּ֗אן וּ/בַ/יַּ֨יִן֙ וּ/בַ/שֵּׁכָ֔ר וּ/בְ/כֹ֛ל אֲשֶׁ֥ר תִּֽשְׁאָלְ/ךָ֖ נַפְשֶׁ֑/ךָ וְ/אָכַ֣לְתָּ שָּׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׂמַחְתָּ֖ אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/026.yaml
  text: 'and spend the silver on whatever your appetite desires: cattle[a], sheep, wine, strong drink, or whatever your appetite asks for. And you shall eat there before Yahweh your God and rejoice[c][b], you and your household.'
translation:
  language: hi
  text: और उस धन को जिस किसी वस्तु की तुम्हें इच्छा हो—गाय-बैल, भेड़-बकरियाँ, दाखरस, मदिरा[a], या जो कुछ तुम्हारा मन माँगे—उस पर खर्च करना। तब तुम वहाँ अपने परमेश्वर यहवे के सामने खाना और आनन्द मनाना—तुम और तुम्हारा घराना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मदिरा” से आशय दाखरस के अतिरिक्त किसी अन्य मादक पेय से है।
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתָּה הַכֶּסֶף
  choice: उस धन को ... खर्च करना
  rationale: व्यापारिक प्रसंग में शाब्दिक ‘चाँदी देना’ का आशय चाँदी से मिले धन को वस्तुओं पर खर्च करना है; हिन्दी में ‘धन खर्च करना’ स्वाभाविक और स्पष्ट है।
- source_word: תְּאַוֶּה נַפְשְׁךָ / תִּשְׁאָלְךָ נַפְשֶׁךָ
  choice: अपनी इच्छा / जिसकी तुम्हारी भूख माँग करे
  rationale: נֶפֶשׁ यहाँ भोजन-पान की व्यक्तिगत लालसा या भूख को व्यक्त करता है। दोनों इब्रानी अभिव्यक्तियों का अंतर बचाने के लिए पहले को सामान्य ‘इच्छा’ और दूसरे को सजीव ‘भूख माँग करे’ कहा गया है।
- source_word: בַּבָּקָר וּבַצֹּאן
  choice: गाय-बैल, भेड़-बकरियाँ
  rationale: 'दोनों शब्द सामूहिक पशु-वर्ग हैं: בקר बड़े गोपशु और צאן छोटे पालतू पशु, जिनमें भेड़ और बकरियाँ दोनों सम्मिलित हो सकती हैं।'
- source_word: וּבַיַּיִן וּבַשֵּׁכָר
  choice: दाखमधु, मदिरा
  rationale: יין के लिए पारंपरिक और स्पष्ट ‘दाखमधु’ तथा שֵׁכָר के लिए उससे भिन्न नशीले पेय का सामान्य हिन्दी शब्द ‘मदिरा’ रखा गया है।
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहवे के सामने
  rationale: ईश्वरीय नाम יהוה को नाम के रूप में ‘यहवे’ और לִפְנֵי को निकट औपचारिक समतुल्य ‘के सामने’ अनूदित किया गया है।
- source_word: וְשָׂמַחְתָּ אַתָּה וּבֵיתֶךָ
  choice: आनन्द मनाना—तुम और तुम्हारा घराना
  rationale: निर्देशात्मक शैली और सामूहिक उत्सव का भाव बचाते हुए בית का स्वाभाविक सामुदायिक अर्थ ‘घराना’ रखा गया है।
theological_decisions:
- issue: יהוה ईश्वरीय नाम का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का निजी नाम प्रत्यक्ष है; उसे उपाधि में बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- issue: שֵׁכָר में मादक पेय का स्पष्ट उल्लेख
  choice: मदिरा
  alternative: तेज़ पेय; किण्वित पेय
  rationale: पाठ दाखमधु के अतिरिक्त एक अन्य मादक पेय का उल्लेख करता है। इसे धार्मिक कारणों से नरम नहीं किया गया, पर पेय का प्रकार अनिश्चित होने के कारण अधिक विशिष्ट नाम भी नहीं दिया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी। व्यवस्थाविवरण के निर्देशात्मक अनुच्छेद के अनुरूप संयुक्त क्रियाओं में ‘करना/खाना/मनाना’ रखा गया है। ‘चाँदी’ के शाब्दिक रूप के बजाय प्रसंगगत ‘धन’ मुख्य पाठ में दिया गया है; पशु-वर्गों को हिन्दी में समावेशी रूप से व्यक्त किया गया है।
