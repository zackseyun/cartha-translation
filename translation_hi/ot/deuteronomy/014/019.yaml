base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/019.yaml
  text: And every swarming thing of the birds is unclean for you[a]; they shall not be eaten.
translation:
  language: hi
  text: और हर पंखवाला रेंगनेवाला जीव तुम्हारे लिए अशुद्ध है[a]; वे खाए न जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर उड़नेवाला रेंगनेवाला जीव।” इब्रानी पद में שֶׁרֶץ (“रेंगनेवाला या झुंड बनानेवाला छोटा जीव”) और עוֹף (“पंखवाला या उड़नेवाला जीव”) साथ आए हैं; यहाँ सामान्य पक्षियों के बजाय मुख्यतः उड़नेवाले कीट अभिप्रेत जान पड़ते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: और हर
  rationale: וְ इस निषेध को पिछले आहार-विषयक नियमों से जोड़ता है, और כֹל व्यापक वितरणात्मक अर्थ देता है।
- source_word: שֶׁרֶץ הָ/עוֹף
  choice: पंखवाला रेंगनेवाला जीव
  rationale: यह संयुक्त पद छोटे झुंड बनाने या रेंगनेवाले उड़ने वाले जीवों, विशेषकर कीटों, को सूचित करता है। यह अनुवाद עוֹף के पंख/उड़ान के भाव और שֶׁרֶץ की प्राणी-श्रेणी दोनों को बनाए रखता है।
- source_word: טָמֵא
  choice: अशुद्ध
  rationale: यह आहार और अनुष्ठान-संबंधी शुद्धता की मानक वाचा-श्रेणी है।
- source_word: הוּא לָ/כֶם
  choice: तुम्हारे लिए अशुद्ध है
  rationale: לָכֶם इस नियम को इस्राएलियों पर लागू श्रेणी के रूप में व्यक्त करता है; हिन्दी में यह वाक्यांश स्वाभाविक है।
- source_word: לֹא יֵאָכֵלוּ
  choice: वे खाए न जाएँ
  rationale: निफ़अल के कर्मवाच्य और हिब्रू के बहुवचन रूप को बनाए रखते हुए विधिक निषेध व्यक्त किया गया है।
