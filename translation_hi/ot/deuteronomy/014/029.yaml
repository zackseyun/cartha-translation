  text: וּ/בָ֣א הַ/לֵּוִ֡י כִּ֣י אֵֽין ל/וֹ֩ חֵ֨לֶק וְ/נַחֲלָ֜ה עִמָּ֗/ךְ וְ֠/הַ/גֵּר וְ/הַ/יָּת֤וֹם וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/אָכְל֖וּ וְ/שָׂבֵ֑עוּ לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל מַעֲשֵׂ֥ה יָדְ/ךָ֖ אֲשֶׁ֥ר תַּעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/029.yaml
  text: And the Levite shall come[a], because he has no portion or inheritance with you, and the sojourner, the fatherless, and the widow who are within your gates, and they shall eat and be satisfied[b], so that Yahweh your God may bless you in all the work of your hands that you do.
translation:
  language: hi
  text: तब लेवी आए, क्योंकि तुम्हारे बीच उसका कोई हिस्सा या विरासत नहीं है; और तुम्हारे नगरों में रहनेवाला परदेशी[a], अनाथ और विधवा खाएँ और तृप्त हों, ताकि याहवे, तुम्हारा परमेश्वर, तुम्हारे हाथों के हर उस काम में तुम्हें आशीष दे जो तुम करते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘तुम्हारे फाटकों के भीतर।’ यह तुम्हारे नगरों या स्थानीय समुदाय में रहने वालों के लिए इब्रानी मुहावरा है। ‘परदेशी’ से आशय ऐसा गैर-इस्राएली निवासी है जो इस्राएलियों के बीच रहता था।
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: וּבָא הַלֵּוִי
  choice: तब लेवी आए
  rationale: कानूनी-निर्देशात्मक संदर्भ में क्रिया अपेक्षित या निर्देशित भाव रखती है। ‘लेवी’ सामाजिक/गोत्रीय वर्ग को दर्शाता है; पाठ में ‘याजक’ नहीं जोड़ा गया।
- source_word: חֵלֶק וְנַחֲלָה
  choice: भाग या विरासत
  rationale: यह शब्द-युग्म आवंटित हिस्से और पैतृक/भूमिगत विरासत, दोनों आर्थिक अवधारणाओं को बनाए रखता है।
- source_word: הַגֵּר
  choice: रहनेवाला परदेशी
  rationale: גֵּר केवल आगंतुक अजनबी नहीं, बल्कि इस्राएली समुदाय के बीच रहनेवाला गैर-इस्राएली निवासी है। ‘रहनेवाला परदेशी’ यह सामाजिक स्थिति स्पष्ट करता है।
- source_word: הַיָּתוֹם
  choice: अनाथ
  rationale: आधुनिक हिन्दी में ‘अनाथ’ इस असुरक्षित सामाजिक वर्ग का स्वाभाविक और व्यापक रूप से समझा जानेवाला पद है।
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: तुम्हारे नगरों में
  rationale: शाब्दिक ‘तुम्हारे फाटकों के भीतर’ नगर अथवा स्थानीय समुदाय के लिए इब्रानी मुहावरा है; हिन्दी में अर्थ को स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וְאָכְלוּ וְשָׂבֵעוּ
  choice: वे खाएँ और तृप्त हों
  rationale: यह उपलब्ध कराए गए दशमांश का अभिप्रेत परिणाम व्यक्त करता है और पर्याप्त भोजन मिलने का भाव बनाए रखता है।
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: ताकि ... तुम्हें आशीष दे
  rationale: לְמַעַן उद्देश्य अथवा अपेक्षित परिणाम दिखाता है; हिन्दी की संभावनार्थक क्रिया इस संबंध को बिना इसे बिना-शर्त भविष्यवाणी बनाए व्यक्त करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בְּכָל מַעֲשֵׂה יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: तुम्हारे हाथ के हर काम में
  rationale: ‘हाथ का काम’ हिन्दी में मानवीय श्रम और उपक्रम के लिए स्वाभाविक अभिव्यक्ति है; अंतिम संबंधवाचक पद हिन्दी में अनावश्यक पुनरुक्ति होता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, चतुराक्षरी व्यक्तिगत नाम है। हिन्दी बाइबलीय प्रयोग में सुविज्ञ ‘यहोवा’ नामत्व को स्पष्ट रखता है; ‘याहवे’ अधिक निकट लिप्यंतरण का वैकल्पिक रूप है।
- issue: आशीष का उद्देश्य/परिणाम
  choice: ताकि ... आशीष दे
  alternative: जिससे ... आशीष देगा
  rationale: לְמַעַן के बाद अपूर्ण क्रिया उद्देश्य या अपेक्षित परिणाम बताती है, इसलिए इसे निश्चित और बिना-शर्त प्रतिज्ञा के रूप में नहीं प्रस्तुत किया गया।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल के लंबे समन्वित वाक्य को विराम-चिह्नों और दूसरे वाक्य द्वारा स्पष्ट किया गया है। ‘फाटकों के भीतर’ मुहावरे का अर्थ ‘नगरों में’ मुख्य पाठ में दिया गया है; सामाजिक-वैधानिक अर्थ वाले גֵּר के लिए संक्षिप्त पाद-टिप्पणी जोड़ी गई है।
