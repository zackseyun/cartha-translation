- source_word: וְ
  choice: और
  rationale: सूची की अंतिम वस्तुओं को जोड़ने वाला सामान्य समुच्चयबोधक।
- source_word: הַ
  choice: '[अलग से अनूदित नहीं]'
  rationale: इब्रानी निश्चित उपपद है; हिंदी में पक्षियों के जातिवाचक नामों के साथ इसे अलग शब्द से व्यक्त करना स्वाभाविक नहीं है।
