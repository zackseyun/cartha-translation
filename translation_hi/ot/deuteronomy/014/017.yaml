    reason: lexical_alternative
  - marker: c
    text: इब्रानी शब्द किसी अन्य जलपक्षी—जैसे हवासिल या मछलीमार उल्लू—को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּאָת
  choice: हवासिल
  rationale: इस पक्षी की ठीक पहचान अनिश्चित है। ‘हवासिल’ एक प्रचलित पारंपरिक पहचान है और सामान्य हिन्दी में समझ में आती है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: הָרָחָמָה
  choice: मिस्री गिद्ध
  rationale: इब्रानी शब्द सम्भवतः किसी गिद्ध या मांसभक्षी पक्षी को सूचित करता है। ‘मिस्री गिद्ध’ इस पद की व्यापक रूप से मानी गई प्रजातिगत पहचान को आधुनिक हिन्दी में स्पष्ट करता है, पर अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: הַשָּׁלָךְ
  choice: पनकौवा
  rationale: शब्द सम्भवतः मछली खाने वाले जलपक्षी का नाम है। ‘पनकौवा’ कॉर्मोरेंट का स्वाभाविक और प्रचलित हिन्दी नाम है; सटीक पहचान अनिश्चित होने के कारण विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: וְ / וְאֶת
  choice: और / [कर्म-सूचक चिह्न अनूदित नहीं]
  rationale: וְ को सूची के समन्वय के लिए ‘और’ से व्यक्त किया गया है। אֵת का हिन्दी में अलग शाब्दिक समकक्ष आवश्यक नहीं है।
