source:
  edition: WLC
  text: וְ/אָכַלְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּק֣וֹם אֲשֶׁר יִבְחַר֮ לְ/שַׁכֵּ֣ן שְׁמ֣/וֹ שָׁם֒ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ לְמַ֣עַן תִּלְמַ֗ד לְ/יִרְאָ֛ה אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל הַ/יָּמִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/023.yaml
  text: And you shall eat before Yahweh your God[a], in the place that he will choose for his name to dwell there, the tithe of your grain, your new wine, and your oil, and the firstborn of your herd and your flock, so that you may learn to fear Yahweh your God all your days.
translation:
  language: hi
  text: और उस स्थान में, जिसे तुम्हारा परमेश्वर यहोवा अपना नाम वहाँ बसाने के लिए चुनेगा, तुम उसके सामने अपने अनाज, नए दाखरस और तेल का दशमांश तथा अपने गाय-बैलों और भेड़-बकरियों के पहलौठे खाया करो, ताकि तुम जीवन भर अपने परमेश्वर यहोवा का भय मानना सीखो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपना नाम वहाँ बसाने” का अनुवाद “अपना नाम वहाँ बसवाने” या “अपना नाम वहाँ रखने” भी हो सकता है। इब्रानी अभिव्यक्ति चुने हुए पवित्रस्थान में यहोवा के नाम के निवास की छवि बनाए रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: तुम ... खाया करना
  rationale: व्यवस्थापरक संदर्भ में यह रूप निर्देश और निरंतर पालन का भाव देता है; ‘खाया करना’ स्वाभाविक हिन्दी में आवर्ती आज्ञा को व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा के सामने
  rationale: לִפְנֵי का मूल भाव ‘सामने/उपस्थिति में’ है; यह उपासना-संबंधी प्रसंग में स्पष्ट और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित लिप्यंतरण के द्वारा इब्रानी व्यक्तिगत नाम को पदवी से बदले बिना सुरक्षित रखा गया है।
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: जिस स्थान को ... चुनेगा
  rationale: यह व्यवस्थाविवरण के चुने हुए उपासना-स्थान संबंधी भविष्याभिमुख सूत्र को बनाए रखता है।
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: अपने नाम को वहाँ बसाने के लिए
  rationale: हिफ़ील रूप के कारण ‘बसाने’ में ‘निवास कराना’ का भाव सुरक्षित रहता है और इब्रानी नाम-निवास की छवि भी बनी रहती है।
- source_word: מַעְשַׂר
  choice: दशमांश
  rationale: उपज के दसवें भाग के लिए यह स्थापित और सहज हिन्दी शब्द है।
- source_word: דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ
  choice: अपने अनाज, नई दाखमधु और तेल
  rationale: कृषि-उपज की पारंपरिक त्रयी को अलग-अलग रखते हुए תירוש का ‘नई दाखमधु’ वाला विशिष्ट भाव सुरक्षित किया गया है।
- source_word: וּבְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: अपने गाय-बैलों तथा भेड़-बकरियों के पहलौठे
  rationale: בקר और צאן की पशु-श्रेणियों को साधारण पाठक के लिए स्पष्ट किया गया है; ‘पहलौठे’ प्रथम जन्मे पशुओं को ठीक व्यक्त करता है।
- source_word: לְמַעַן תִּלְמַד לְיִרְאָה
  choice: ताकि तुम ... भय मानना सीखो
  rationale: उद्देश्यसूचक לְמַעַן और सीखने की प्रक्रिया दोनों को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: כָּל הַיָּמִים
  choice: जीवन भर
  rationale: शाब्दिक ‘सभी दिनों’ का यहाँ स्वाभाविक हिन्दी समतुल्य है, जो निरंतर आजीवन पालन का भाव देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘प्रभु’ जैसी पदवी से नहीं बदला गया; आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ चुना गया है।
- issue: लְשַׁכֵּן שְׁמוֹ שָׁם में पवित्रस्थान-सूत्र
  choice: अपने नाम को वहाँ बसाने के लिए
  alternative: अपना नाम वहाँ रखने के लिए
  rationale: ‘बसाने’ से हिफ़ील का कारणवाचक स्वर और चुने हुए स्थान में परमेश्वर के नाम के निवास की इब्रानी छवि बनी रहती है, बिना परमेश्वर को उस स्थान तक सीमित बताने के।
- issue: לְיִרְאָה में ‘भय’ का अर्थ
  choice: यहोवा का भय मानना
  alternative: यहोवा के प्रति श्रद्धा रखना
  rationale: ‘भय’ मूल शब्द की गंभीरता और वाचा-संबंधी तनाव को सुरक्षित रखता है; इसे केवल ‘श्रद्धा’ में बदलना अर्थ को संकुचित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘खाया करना’ आवर्ती व्यवस्थापरक निर्देश को व्यक्त करता है; पशु-श्रेणियों को ‘गाय-बैल’ और ‘भेड़-बकरियाँ’ कहकर स्पष्ट किया गया है। मुख्य पाठ में पाद-टिप्पणी चिह्न [a] सम्मिलित है।
