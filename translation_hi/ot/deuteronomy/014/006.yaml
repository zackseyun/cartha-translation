  yaml_path: translation/ot/deuteronomy/014/006.yaml
  text: You may eat any animal that has a split hoof[a], divided into two hoof-parts, and that chews the cud among the animals.
translation:
  language: hi
  text: पशुओं में से हर उस पशु को तुम खा सकते हो जिसके खुर चिरे हुए हों, यानी वे दो भागों में बँटे हुए हों, और जो जुगाली करता हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכָל בְּהֵמָה
  choice: पशुओं में से जिस किसी
  rationale: यह अभिव्यक्ति पशुओं की श्रेणी में प्रत्येक ऐसे पशु का वितरणात्मक अर्थ स्वाभाविक हिन्दी में व्यक्त करती है जो आगे दिए गए लक्षणों को पूरा करता है।
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: जिसके खुर चिरे हुए हों
  rationale: हिब्रू कृदन्त पशु के चिरे खुर होने का ठोस शारीरिक लक्षण बताता है; बहुवचन ‘खुर’ हिन्दी में पशु के खुरों के लिए स्वाभाविक है।
- source_word: וְשֹׁסַעַת שֶׁסַע שְׁתֵּי פְרָסוֹת
  choice: अर्थात् खुर दो भागों में पूरी तरह बँटे हों
  rationale: यह पहले लक्षण को स्पष्ट और प्रबल करते हुए वास्तविक विभाजन को दो खुर-भागों के रूप में बताता है। ‘पूरी तरह’ अलग दरार के जोर को सहज हिन्दी में व्यक्त करता है।
- source_word: מַעֲלַת גֵּרָה
  choice: जो जुगाली करता हो
  rationale: ‘जुगाली करना’ हिन्दी में rumination के लिए प्रचलित, सटीक और सामान्य पाठक के लिए स्पष्ट मुहावरा है।
- source_word: בַּבְּהֵמָה
  choice: पशुओं में से
  rationale: यह योग्यता को विचाराधीन पशु-श्रेणी के भीतर रखता है; वाक्य के आरम्भ में समाहित करना हिन्दी में पुनरुक्ति से बचाता है।
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: उसे तुम खा सकते हो
  rationale: विधिक प्रसंग में यह भोजन की अनुमति व्यक्त करता है, उपभोग की अनिवार्य आज्ञा नहीं। एकवचन कर्म-सर्वनाम ‘उसे’ को स्पष्ट रखा गया है।
