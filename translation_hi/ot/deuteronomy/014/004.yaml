    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַבְּהֵמָה
  choice: जिन पशुओं को ... वे ये हैं
  rationale: इब्रानी में संकेतवाचक और संज्ञा एकवचन हैं, पर वे सामूहिक श्रेणी का परिचय देते हैं; हिन्दी में बहुवचन सूची-परिचय स्वाभाविक है।
- source_word: אֲשֶׁר תֹּאכֵלוּ
  choice: जिन ... को तुम खा सकते हो
  rationale: यह वाक्य अनुमत पशुओं की पहचान कराता है; ‘खा सकते हो’ अनुमति व्यक्त करता है, अनिवार्य आदेश नहीं।
- source_word: שׁוֹר
  choice: गाय-बैल
  rationale: שׁוֹר गोवंश के पशु को सूचित कर सकता है। केवल ‘बैल’ कहने से अर्थ अनावश्यक रूप से नर पशु तक सीमित हो सकता है; ‘गाय-बैल’ आधुनिक हिन्दी में समूची श्रेणी स्पष्ट करता है।
- source_word: שֵׂה כְשָׂבִים
  choice: भेड़
  rationale: שֵׂה छोटे पालतू झुंड-पशु को दर्शाता है और כְשָׂבִים उसे भेड़ की जाति के रूप में स्पष्ट करता है; आयु-विशेष ‘मेमना’ अपेक्षित नहीं है।
- source_word: וְשֵׂה עִזִּים
  choice: और बकरी
  rationale: समानांतर पदबंध में עִזִּים बकरी की जाति स्पष्ट करता है; आयु-विशेष ‘बकरी का बच्चा’ मूल से आवश्यक नहीं है।
