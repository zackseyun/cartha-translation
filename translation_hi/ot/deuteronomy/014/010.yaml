  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֧ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת לֹ֣א תֹאכֵ֑לוּ טָמֵ֥א ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/010.yaml
  text: But anything that does not have fins and scales, you shall not eat; it is unclean for you.
translation:
  language: hi
  text: परन्तु जिस किसी जलचर में पंख और शल्क न हों, उसे तुम मत खाना; वह तुम्हारे लिए अशुद्ध है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: परन्तु जिस किसी जल-जीव
  rationale: וְ प्रसंग में पिछले पद की अनुमति के विपरीत निषेध प्रस्तुत करता है, इसलिए ‘परन्तु’ स्वाभाविक है। כֹל की व्यापकता ‘जिस किसी’ से व्यक्त होती है। संदर्भ जलचर प्राणियों का है; ‘जल-जीव’ हिंदी में आशय स्पष्ट करता है।
- source_word: אֲשֶׁר אֵין לוֹ
  choice: के ... न हों
  rationale: אֵין לוֹ किसी वस्तु के न होने को व्यक्त करता है। बहुवचन ‘पंख और छिलके’ के साथ ‘न हों’ सहज आधुनिक हिंदी है।
- source_word: סְנַפִּיר
  choice: पंख
  rationale: यह मछली के fin को सूचित करता है। आहार-वर्गीकरण के संदर्भ में हिंदी में बहुवचन ‘पंख’ स्वाभाविक है।
- source_word: וְ/קַשְׂקֶשֶׂת
  choice: और छिलके
  rationale: यह मछली की scales को सूचित करता है। सामान्य पाठक के लिए ‘छिलके’ सहज और प्रचलित बाइबलीय शब्द है; वर्गगत नियम के कारण बहुवचन रखा गया है।
- source_word: לֹא תֹאכֵלוּ
  choice: उसे तुम न खाना
  rationale: निषेधात्मक द्वितीय पुरुष बहुवचन को ‘तुम न खाना’ से विधिक किन्तु सुबोध हिंदी में व्यक्त किया गया है। एकवचन ‘उसे’ वर्ग के प्रत्येक जीव पर distributive रूप से लागू होता है।
- source_word: טָמֵא הוּא לָכֶם
  choice: वह तुम्हारे लिए अशुद्ध है
  rationale: ‘अशुद्ध’ धार्मिक-आचार संबंधी श्रेणी को व्यक्त करता है, और ‘तुम्हारे लिए’ לָכֶם के इस्राएल-सापेक्ष संबंध को बनाए रखता है।
theological_decisions:
- issue: טָמֵא का स्वरूप
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: यहाँ शब्द आहार और धार्मिक शुद्धता की विधिक श्रेणी बताता है; ‘अशुद्ध’ नैतिक दोष का अतिरिक्त अर्थ जोड़े बिना उस श्रेणी को अधिक ठीक प्रकार से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य में पहले अनुमति के विपरीत निषेध और फिर धार्मिक-आचार संबंधी स्थिति को मूल क्रम के अनुसार रखा गया है।
