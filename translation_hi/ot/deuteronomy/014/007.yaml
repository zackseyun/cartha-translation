source:
  edition: WLC
  text: אַ֣ךְ אֶת זֶ֞ה לֹ֤א תֹֽאכְלוּ֙ מִ/מַּֽעֲלֵ֣י הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֥י הַ/פַּרְסָ֖ה הַ/שְּׁסוּעָ֑ה אֶֽת הַ֠/גָּמָל וְ/אֶת הָ/אַרְנֶ֨בֶת וְ/אֶת הַ/שָּׁפָ֜ן כִּֽי מַעֲלֵ֧ה גֵרָ֣ה הֵ֗מָּה וּ/פַרְסָה֙ לֹ֣א הִפְרִ֔יסוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/007.yaml
  text: 'However[a], these you shall not eat from among those that chew the cud or from among those that have a divided hoof: the camel, the hare, and the rock badger; because they chew the cud but do not divide the hoof[b]. They are unclean for you.'
translation:
  language: hi
  text: 'परन्तु जुगाली करने वाले या चिरे हुए खुर वाले पशुओं में से इन्हें मत खाना: ऊँट, खरहा[a], और हाइरैक्स[b]। वे जुगाली तो करते हैं, पर उनके खुर चिरे हुए नहीं हैं। वे तुम्हारे लिए अशुद्ध हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खरगोश।’ हिब्रू पशु-नाम से सम्भवतः खरहा अभिप्रेत है, यद्यपि उसकी ठीक प्राणी-पहचान पर मतभेद है।
    reason: lexical_alternative
  - marker: b
    text: या ‘चट्टानी बिज्जू।’ हिब्रू पशु-नाम को सामान्यतः हाइरैक्स माना जाता है, यद्यपि उसकी ठीक प्राणी-पहचान पर कुछ अनिश्चितता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु
  rationale: यह पिछले पद के सामान्य नियम के बाद अपवाद प्रस्तुत करता है; ‘परन्तु’ उसके विरोधात्मक और सीमित करनेवाले बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: जुगाली करनेवाले
  rationale: हिब्रू मुहावरा ऐसे पशुओं के व्यवहार को दर्शाता है जो जुगाली करते हैं; हिन्दी में यह प्रचलित और स्पष्ट अभिव्यक्ति है।
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה הַשְּׁסוּעָה
  choice: चिरे हुए खुरवाले पशुओं में से
  rationale: यह उन पशुओं को दर्शाता है जिनका खुर दो भागों में बँटा होता है। यह रूप सहज हिन्दी में स्रोत की विशेषता को बनाए रखता है।
- source_word: הַגָּמָל
  choice: ऊँट
  rationale: पशु-नाम का सीधा और सर्वमान्य हिन्दी रूप।
- source_word: הָאַרְנֶבֶת
  choice: खरहा
  rationale: यह सम्भावित प्राणी-पहचान ‘hare’ को ‘खरगोश’ से अधिक विशिष्ट रूप में व्यक्त करता है; पहचान की अनिश्चितता और प्रचलित विकल्प को पादटिप्पणी में रखा गया है।
- source_word: הַשָּׁפָן
  choice: चट्टानी बिज्जू
  rationale: यह चट्टानों में रहनेवाले उस छोटे स्तनपायी का समझने योग्य पारंपरिक वर्णन है जिसे प्रायः हाइरैक्स माना जाता है; अधिक तकनीकी नाम पादटिप्पणी में दिया गया है।
- source_word: כִּי מַעֲלֵה גֵרָה הֵמָּה
  choice: वे जुगाली तो करते हैं
  rationale: ‘तो’ अगले विरोधात्मक उपवाक्य के साथ कारणात्मक कथन का स्वाभाविक हिन्दी संतुलन बनाता है।
- source_word: וּפַרְסָה לֹא הִפְרִיסוּ
  choice: पर उनके खुर चिरे हुए नहीं हैं
  rationale: सामान्य और स्थायी पशु-विशेषता को स्वाभाविक वर्तमान काल में व्यक्त करता है और पहले उपवाक्य की शब्दावली से संगति रखता है।
- source_word: טְמֵאִים הֵם לָכֶם
  choice: वे तुम्हारे लिए अशुद्ध हैं
  rationale: ‘अशुद्ध’ आहार-विधि के शुद्धता-वर्ग का व्यापक बाइबलीय शब्द है; ‘तुम्हारे लिए’ हिब्रू के विधिक और वाचा-संबंधी अभिमुखीकरण को बिना अतिरिक्त व्याख्या के बनाए रखता है।
theological_decisions:
- issue: आहार-विधि में अशुद्धता का स्वरूप
  choice: अशुद्ध
  alternative: अनुष्ठानिक रूप से अशुद्ध / धार्मिक रीति से अशुद्ध
  rationale: इस विधिक प्रसंग में טָמֵא शुद्धता की वाचा-संबंधी श्रेणी को व्यक्त करता है। मुख्य पाठ में व्यापक शब्द ‘अशुद्ध’ रखना उचित है; ‘अनुष्ठानिक’ या ‘धार्मिक रीति से’ जोड़ना मूल से अधिक संकीर्ण व्याख्या होगी।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण और विधिक शैली रखी गई है। ‘जुगाली’, ‘चिरे हुए खुर’ और ‘अशुद्ध’ सामान्य पाठक के लिए बोधगम्य हैं। पादटिप्पणी-चिह्न सम्बद्ध पशु-नामों के तुरंत बाद रखे गए हैं।
