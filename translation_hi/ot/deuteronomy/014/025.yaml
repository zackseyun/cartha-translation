  yaml_path: translation/ot/deuteronomy/014/025.yaml
  text: then you shall turn it into silver[a], bind the silver in your hand[b], and go to the place that Yahweh your God will choose.
translation:
  language: hi
  text: तब तुम उसे चाँदी[a] में बदल लेना, उस चाँदी को अपने हाथ में बाँध लेना[b], और उस स्थान पर जाना जिसे तुम्हारा परमेश्वर याहवे चुनेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका चाँदी के बदले विनिमय कर लेना” अथवा “उसे धन में बदल लेना।” इब्रानी में शाब्दिक रूप से “चाँदी” है, जो यहाँ धन के रूप में प्रयुक्त होती थी।
    reason: lexical_alternative
  - marker: b
    text: या, “उस चाँदी को अपने हाथ में लपेटकर सुरक्षित कर लेना,” अर्थात यात्रा के लिए उसे अपने पास सुरक्षित रखना।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה בַּכָּסֶף
  choice: उसे चाँदी में बदल देना
  rationale: यहाँ נָתַן + בְּ का भाव उपज अथवा दशमांश को चाँदी देकर विनिमय करने का है। ‘चाँदी’ मूल शब्द כֶּסֶף की ठोस छवि बनाए रखता है, जबकि प्रसंग में वह धन के रूप में काम करती है।
- source_word: וְצַרְתָּ הַכֶּסֶף בְּיָדְךָ
  choice: उस चाँदी को अपने हाथ में बाँध लेना
  rationale: צָרַר का मूल अर्थ बाँधना, लपेटना या गाँठ में सुरक्षित करना है। यह अनुवाद यात्रा के लिए चाँदी सुरक्षित रखने की ठोस छवि को बनाए रखता है।
- source_word: בְּיָדְךָ
  choice: अपने हाथ में
  rationale: शाब्दिक अर्थ ‘तुम्हारे हाथ में’ है। यह अधिकार या साथ रखने का मुहावरा भी हो सकता है, पर यहाँ चाँदी बाँधने की ठोस छवि उपयुक्त है।
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: उस स्थान को जाना
  rationale: הלך सामान्यतः ‘जाना’ है; विधिक निर्देश के क्रम में यह सीधा और स्वाभाविक है।
- source_word: אֲשֶׁר יִבְחַר
  choice: जिसे ... चुनेगा
  rationale: अपूर्ण क्रिया यहाँ भावी चयन को दर्शाती है; व्यवस्थाविवरण के केंद्रीय उपासना-स्थान संबंधी सूत्र में भविष्यकाल स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित देवनागरी रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत वाचा-नाम को किसी पदवी से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: यह वाचा-संबंधी मानक संबोधन है और व्यक्तिगत नाम के साथ स्वाभाविक हिन्दी बनाता है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिन्दी पाठकों के लिए प्रचलित ‘यहोवा’ नाम को पदवी ‘प्रभु’ से प्रतिस्थापित किए बिना सुरक्षित रखता है; ‘याहवे’ अधिक निकट लिप्यंतरण का विकल्प है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। ‘चाँदी’ तथा ‘हाथ में बाँध लेना’ मूल की ठोस अभिव्यक्तियाँ बनाए रखते हैं; पादटिप्पणियाँ इनके स्वाभाविक अर्थ स्पष्ट करती हैं।
