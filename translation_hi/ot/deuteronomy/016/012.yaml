  text: וְ/זָ֣כַרְתָּ֔ כִּי עֶ֥בֶד הָיִ֖יתָ בְּ/מִצְרָ֑יִם וְ/שָׁמַרְתָּ֣ וְ/עָשִׂ֔יתָ אֶת הַֽ/חֻקִּ֖ים הָ/אֵֽלֶּה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/012.yaml
  text: Remember that you were a servant in Egypt[a], and keep and do these statutes.
translation:
  language: hi
  text: याद रखो कि तुम मिस्र में दास थे[a], और इन विधियों को मानो और उनका पालन करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवक’। इब्रानी עֶבֶד का अर्थ सेवक या दास हो सकता है, पर यहाँ ‘दास’ मिस्र में इस्राएल की बंधुआई को अधिक स्पष्ट रूप से व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: याद रखो
  rationale: निर्देशात्मक प्रसंग में संयोजक वाव के साथ पूर्ण क्रिया आज्ञा-सदृश बल रखती है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: כִּי
  choice: कि
  rationale: यह याद रखने की विषय-वस्तु का परिचय देता है, इसलिए हिन्दी में ‘कि’ उपयुक्त है।
- source_word: עֶבֶד
  choice: दास
  rationale: मिस्र में इस्राएल की बाध्य और उत्पीड़ित स्थिति यहाँ प्रमुख है; ‘दास’ उस बंधन को ‘सेवक’ से अधिक स्पष्ट करता है।
- source_word: הָיִיתָ
  choice: तुम ... थे
  rationale: यह היה का सामान्य भूतकालीन अर्थ है और सामूहिक इस्राएल को एकवचन में संबोधित करता है।
- source_word: בְּמִצְרָיִם
  choice: मिस्र में
  rationale: पूर्वसर्गीय पद का सीधा और स्वाभाविक अनुवाद; मूल में ‘देश’ शब्द नहीं है।
- source_word: וְשָׁמַרְתָּ
  choice: पालन करना
  rationale: वाचा और व्यवस्था के प्रसंग में שׁמר का अर्थ विधियों को सावधानी से मानना या पालन करना है।
- source_word: וְעָשִׂיתָ
  choice: इन्हें मानना
  rationale: שׁמר के साथ यह वास्तविक आचरण पर बल देता है; हिन्दी में ‘पालन करना और इन्हें मानना’ दोनों क्रियाओं की संयुक्त शक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַחֻקִּים
  choice: विधियों
  rationale: חֻקִּים निर्धारित वैधानिक नियमों को दर्शाता है; ‘विधियाँ’ आधुनिक, गरिमापूर्ण और समझने योग्य पद है।
- source_word: הָאֵלֶּה
  choice: इन
  rationale: यह निकटवाची संकेतवाचक है जो ‘विधियों’ को विशेषित करता है।
theological_decisions:
- issue: मिस्र में इस्राएल की स्थिति के लिए עֶבֶד का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: व्यवस्थाविवरण में मिस्र की स्मृति जबरन बंधुआई की है। ‘दास’ उस सामाजिक वास्तविकता को व्यक्त करता है, जबकि पादटिप्पणी मूल शब्द की व्यापक अर्थ-सीमा सुरक्षित रखती है।
- issue: וְשָׁמַרְתָּ וְעָשִׂיתָ के बीच संबंध
  choice: इसलिए इन विधियों का पालन करना और इन्हें मानना
  alternative: और इन विधियों की रक्षा करना और उन्हें करना
  rationale: दोनों हिब्रू क्रियाओं को बनाए रखते हुए हिन्दी की स्वाभाविक कानूनी-अनुदेशात्मक भाषा अपनाई गई है। ‘इसलिए’ स्मरण और आज्ञापालन के प्रसंगगत संबंध को स्पष्ट करता है, पर कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामूहिक संबोधन के लिए सामान्य ‘तुम’, और व्यवस्था-संबंधी प्रसंग के अनुरूप गरिमापूर्ण किंतु सहज शब्दावली। पदांत के आज्ञात्मक प्रवाह को स्वाभाविक हिन्दी में रखा गया है।
