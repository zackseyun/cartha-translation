base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/008.yaml
  text: For six days you shall eat unleavened bread[a], and on the seventh day there shall be a solemn assembly to Yahweh your God; you shall do no work.
translation:
  language: hi
  text: छह दिन तक तुम अखमीरी रोटी खाओ, और सातवें दिन याहवे, तुम्हारे परमेश्वर, के लिए गंभीर सभा[a] हो; तुम कोई काम न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्र सभा’ अथवा ‘समापन-सभा।’ इब्रानी शब्द एक औपचारिक पर्व-सभा को दर्शाता है और संभवतः पर्व के समापन की सभा का भाव भी रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: छह दिन तक
  rationale: यह पदबंध अवधि बताता है; ‘तक’ आधुनिक हिन्दी में इस कालगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תֹּאכַל
  choice: तुम ... खाओ
  rationale: व्यवस्था-संबंधी प्रसंग में अपूर्ण क्रिया निर्देशात्मक है; आज्ञार्थक रूप हिन्दी में उसके विधिक बल को स्पष्ट रखता है।
- source_word: מַצּוֹת
  choice: अखमीरी रोटी
  rationale: फसह के प्रसंग में यह खमीर रहित रोटी का मानक अर्थ है; यह सामान्य हिन्दी पाठक के लिए परिचित और स्पष्ट है।
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: और सातवें दिन
  rationale: सरल वाव को ‘और’ से व्यक्त किया गया है; मूल में विरोधसूचक अर्थ अनिवार्य नहीं है।
- source_word: עֲצֶרֶת
  choice: एक विशेष धर्मसभा
  rationale: यह पर्व से जुड़ी औपचारिक सभा को सूचित करता है। ‘विशेष धर्मसभा’ उसके धार्मिक और नियत स्वरूप को स्वाभाविक हिन्दी में बताता है, जबकि संभावित समापन-संबंधी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर याहवे के लिए
  rationale: लामेद को समर्पण अथवा संबंध के अर्थ में ‘के लिए’ से व्यक्त किया गया है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: לֹא תַעֲשֶׂה מְלָאכָה
  choice: तुम कोई काम न करना
  rationale: यह श्रम पर स्पष्ट निषेध है; यह रूप मूल की निषेधात्मक आज्ञा को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: עֲצֶרֶת के धार्मिक और समापन-संबंधी भाव
  choice: विशेष धर्मसभा
  alternative: गंभीर सभा; समापन-सभा
  rationale: मुख्य पाठ औपचारिक पर्व-सभा के अर्थ को व्यक्त करता है, पर यह निश्चित नहीं करता कि शब्द का प्रमुख बल सभा की गंभीरता पर है या पर्व के समापन पर; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। विधिक निर्देश के लिए सीधे आज्ञार्थक रूपों का प्रयोग हुआ है। पादटिप्पणी का चिह्न उसी शब्द के बाद रखा गया है जिससे वह संबंधित है।
