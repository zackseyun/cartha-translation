language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חַ֤ג שָׁבֻעוֹת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ מִסַּ֛ת נִדְבַ֥ת יָדְ/ךָ֖ אֲשֶׁ֣ר תִּתֵּ֑ן כַּ/אֲשֶׁ֥ר יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/010.yaml
  text: Then you shall celebrate the Feast of Weeks to Yahweh your God with a tribute of a freewill offering from your hand[a], which you shall give according to how Yahweh your God blesses you.
translation:
  language: hi
  text: तब तुम अपने परमेश्वर यहोवा के लिए सप्ताहों का पर्व मनाना और अपने हाथ की स्वेच्छा-भेंट देना, जितनी आशीष तुम्हारा परमेश्वर यहोवा तुम्हें दे, उसके अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: तब तुम ... मनाना
  rationale: पर्व के साथ עשה का अर्थ उसे ‘बनाना’ नहीं, बल्कि मनाना या उसका पालन करना है। प्रसंग में וְ क्रम को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है।
- source_word: חַג שָׁבֻעוֹת
  choice: सप्ताहों का पर्व
  rationale: यह गिने गए सप्ताहों के बाद मनाए जाने वाले पर्व का नाम है; हिन्दी में इसका पारदर्शी और स्थापित रूप रखा गया है।
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा के लिए
  rationale: ל समर्पण या अभिमुखता व्यक्त करता है। वाचा का व्यक्तिगत नाम יְהוָה ‘यहोवा’ के रूप में रखा गया है।
- source_word: מִסַּת נִדְבַת יָדְךָ
  choice: अपने हाथ से स्वेच्छा-भेंट उतनी
  rationale: निस्सत स्वैच्छिक भेंट है और מִסַּת उसकी मात्रा या अनुपात की ओर संकेत करता है। ‘उतनी ... जितनी’ अगली उपवाक्य के साथ इस अनुपात को स्वाभाविक हिन्दी में व्यक्त करता है; ‘अपने हाथ से’ व्यक्तिगत दान के इब्रानी मुहावरे को बनाए रखता है।
- source_word: אֲשֶׁר תִּתֵּן
  choice: देना
  rationale: सम्बन्धवाचक उपवाक्य को हिन्दी कानूनी-निर्देश की स्वाभाविक रचना में मुख्य क्रिया के साथ समाहित किया गया है।
- source_word: כַּאֲשֶׁר יְבָרֶכְךָ
  choice: जितनी आशीष ... तुम्हें दे
  rationale: כַּאֲשֶׁר यहाँ दान और परमेश्वर से मिली आशीष के बीच अनुपात बताता है; ‘उतनी ... जितनी’ इस सम्बन्ध को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नामरूप है और इसे उपाधि ‘प्रभु’ से नहीं बदलता।
- issue: भेंट की स्वैच्छिकता और अनुपात
  choice: स्वेच्छा-भेंट उतनी ... जितनी आशीष
  alternative: निर्धारित कर या अनिवार्य भेंट
  rationale: נִדְבָה भेंट की स्वैच्छिक प्रकृति बताता है, जबकि מִסַּת और כַּאֲשֶׁר उसकी मात्रा को मिली हुई आशीष के अनुपात से जोड़ते हैं; पाठ कोई एक समान निश्चित राशि नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आज्ञार्थक ‘तुम ... मनाना/देना’ का प्रयोग व्यवस्थाविवरण की निर्देशात्मक शैली के अनुरूप है। भाषा सरल और गरिमापूर्ण रखी गई है; ‘उतनी ... जितनी’ से कठिन इब्रानी मात्रात्मक वाक्यांश सहज बनता है।
