  text: וּ/בִשַּׁלְתָּ֙ וְ/אָ֣כַלְתָּ֔ בַּ/מָּק֕וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ וּ/פָנִ֣יתָ בַ/בֹּ֔קֶר וְ/הָלַכְתָּ֖ לְ/אֹהָלֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/007.yaml
  text: And you shall cook it and eat it in the place that the LORD your God will choose for it, and in the morning you shall turn and go to your tents.
translation:
  language: hi
  text: जिस स्थान को तुम्हारा परमेश्वर यहोवा चुनेगा, वहीं तुम उसे पकाओ और खाओ। फिर सुबह लौटकर अपने तंबुओं के पास चले जाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִשַּׁלְתָּ
  choice: पकाना
  rationale: पिएल रूप का सामान्य अर्थ पकाना/भूनना है; व्यवस्थाविवरण 16:7 के संदर्भ में व्यापक ‘पकाना’ स्वाभाविक है और विधि को अनावश्यक रूप से सीमित नहीं करता।
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: जिस स्थान को तुम्हारा परमेश्वर यहोवा चुनेगा, वहीं
  rationale: इब्रानी בּוֹ का स्थानवाचक बल ‘वहीं’ में स्वाभाविक हिंदी से व्यक्त होता है; इसे बलि के लिए ‘उसके लिए’ कहना संभव है, पर वाक्य-संरचना में स्थान इसका अधिक निकट और सहज पूर्वपद है।
- source_word: וּפָנִיתָ
  choice: लौटकर
  rationale: शाब्दिक अर्थ ‘मुड़ना’ है, पर अगले क्रियापद ‘चले जाना’ के साथ यहाँ अपने निवास की ओर वापसी का भाव है; ‘लौटकर ... चले जाना’ आधुनिक हिंदी में सहज है।
- source_word: לְאֹהָלֶיךָ
  choice: अपने तंबुओं को
  rationale: मूल बहुवचन ‘तुम्हारे तंबू’ को बनाए रखा गया है; यह लोगों के अस्थायी निवास अथवा व्यापक घरेलू निवास का संकेत हो सकता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि सामान्य पदवी से।
theological_decisions:
- issue: בּוֹ का संबंध
  choice: 'स्थानवाचक अर्थ: ‘वहीं’'
  alternative: 'बलि-संबंधी अर्थ: ‘उसके लिए’'
  rationale: व्याकरणतः दोनों पर विचार संभव है, किंतु निकटतम पुल्लिंग एकवचन ‘स्थान’ है और ‘उस स्थान में’ का प्रयोग व्यवस्थाविवरण की शैली के अनुरूप है। हिंदी में ‘वहीं’ इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- issue: सुबह प्रस्थान की सीमा
  choice: केवल अगली सुबह लौटने का निर्देश
  alternative: पूरे पर्व के तुरंत समाप्त होने का अर्थ
  rationale: पद केवल सुबह मुड़कर तंबुओं को जाने की बात कहता है; इससे पर्व की अवधि या सभी सहभागियों के तत्काल प्रस्थान पर अतिरिक्त निष्कर्ष नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिंदी; सम्मानपूर्ण किंतु सरल आज्ञार्थक शैली। एकवचन संबोधन को ‘तुम’ से रखा गया है। वाक्यक्रम को हिंदी की स्वाभाविकता के अनुसार बदला गया है, जबकि स्थान, भोजन और सुबह वापसी के सभी मूल तत्त्व सुरक्षित हैं।
