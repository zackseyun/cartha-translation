base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/022.yaml
  text: And you shall not set up for yourself a pillar[a], which Yahweh your God hates.
translation:
  language: hi
  text: और तुम अपने लिए कोई स्तंभ[a] खड़ा न करना, जिससे याहवे, तुम्हारा परमेश्वर, घृणा करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खड़ा किया हुआ पत्थर’ अथवा ‘पूजा में प्रयुक्त स्तंभ।’ इब्रानी शब्द ऐसे खड़े किए गए पत्थर को दर्शाता है जिसका संबंध उपासना से होता था।
    reason: मूल शब्द के भौतिक रूप और उसके उपासना-संबंधी संदर्भ—दोनों को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: תָקִים
  choice: खड़ा न करना
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को खड़ा करना या स्थापित करना है; पत्थर के स्तंभ के लिए ‘खड़ा करना’ स्वाभाविक और स्पष्ट है।
- source_word: לְךָ
  choice: अपने लिए
  rationale: यह व्यक्तिगत संलग्नता अथवा अपने उपयोग के लिए किए गए कार्य का भाव व्यक्त करता है।
- source_word: מַצֵּבָה
  choice: स्तंभ[a]
  rationale: मूल शब्द खड़े किए गए पत्थर या स्मारक-स्तंभ को दर्शाता है और इस संदर्भ में उसका संबंध उपासना से है। मुख्य पाठ में सामान्य शब्द रखकर धार्मिक-सांस्कृतिक अर्थ को पादटिप्पणी में स्पष्ट किया गया है, ताकि मूल से अधिक विशिष्ट अर्थ आरोपित न हो।
- source_word: שָׂנֵא
  choice: घृणा करता है
  rationale: यह क्रिया प्रबल विरोध या घृणा व्यक्त करती है; ‘घृणा करता है’ उसके बल को बिना नरम किए सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिंदी लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: यह एकवचन प्रत्यक्ष संबोधन और वाचिक संबंध—दोनों को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका निकट हिंदी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: מַצֵּבָה का उपासना-संबंधी आशय
  choice: मुख्य पाठ में ‘स्तंभ’, पादटिप्पणी में संदर्भ का स्पष्टीकरण
  alternative: पूजा-स्तंभ; पवित्र स्तंभ; खड़ा पत्थर
  rationale: शब्द स्वयं खड़े किए गए पत्थर/स्तंभ को बताता है, जबकि व्यापक प्रसंग उसका उपासना-संबंधी प्रयोग सूचित करता है। यह चयन मूल की अर्थ-सीमा और संदर्भ दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; प्रत्यक्ष आज्ञात्मक शैली, सरल पर गरिमापूर्ण शब्दावली। ‘जिससे ... घृणा करता है’ हिंदी में स्वाभाविक रूप से इब्रानी संबंधवाचक उपवाक्य को बनाए रखता है।
