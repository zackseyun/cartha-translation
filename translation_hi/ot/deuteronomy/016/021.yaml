  text: לֹֽא תִטַּ֥ע לְ/ךָ֛ אֲשֵׁרָ֖ה כָּל עֵ֑ץ אֵ֗צֶל מִזְבַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ אֲשֶׁ֥ר תַּעֲשֶׂה לָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/021.yaml
  text: You shall not plant for yourself an Asherah of any kind of tree beside the altar of Yahweh your God that you make for yourself[a].
translation:
  language: hi
  text: तुम अपने लिए कोई अशेरा, अर्थात किसी भी प्रकार का वृक्ष, अपने परमेश्वर याहवे की उस वेदी के पास न रोपना जिसे तुम अपने लिए बनाओगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अशेरा का खंभा”; इब्रानी शब्द אֲשֵׁרָה देवी अशेरा से जुड़ी उपासना-वस्तु को भी दर्शा सकता है, केवल देवी को ही नहीं।
    reason: alternative_reading
lexical_decisions:
- source_word: תִטַּע
  choice: लगाना
  rationale: נטע का मूल अर्थ ‘रोपना’ है, पर हिन्दी में वृक्ष और काष्ठ-आधारित उपासना-वस्तु दोनों के संदर्भ में ‘लगाना’ स्वाभाविक है और इब्रानी की वृक्ष-संबंधी छवि भी बनाए रखता है।
- source_word: אֲשֵׁרָה
  choice: अशेरा
  rationale: लिप्यंतरण उस वास्तविक संदिग्धता को सुरक्षित रखता है कि यहाँ देवी अशेरा का नाम है या उससे जुड़ी कोई उपासना-वस्तु। ‘खंभा’ जोड़ने से अर्थ अनावश्यक रूप से सीमित हो जाता।
- source_word: כָּל עֵץ
  choice: किसी भी प्रकार के वृक्ष की
  rationale: शाब्दिक अर्थ ‘कोई/हर वृक्ष’ है। यह रूप अशेरा के साथ वाक्यगत संबंध स्पष्ट करता है और किसी खास वृक्ष-जाति तक निषेध को सीमित नहीं करता।
- source_word: אֵצֶל
  choice: के पास
  rationale: यह निकटता का सामान्य अर्थ देता है; आधुनिक हिन्दी में ‘के पास’ स्वाभाविक और स्पष्ट है।
- source_word: מִזְבַּח
  choice: वेदी
  rationale: מזבח के लिए मानक और संदर्भानुकूल हिन्दी शब्द।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में सीधे लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: दूसरे पुरुष एकवचन संबंधसूचक रूप को हिन्दी निषेधात्मक वाक्य में स्वाभाविक रूप से ‘अपने परमेश्वर’ कहा गया है।
- source_word: אֲשֶׁר תַּעֲשֶׂה לָּךְ
  choice: जिसे तुम अपने लिए बनाओगे
  rationale: עשה के व्यापक अर्थ ‘बनाना’ और לך के हितार्थ/आत्मसंबंधी भाव दोनों को सुरक्षित रखता है; सापेक्ष उपवाक्य भविष्याभिमुख कानूनी निर्देश के रूप में स्वाभाविक है।
theological_decisions:
- issue: अशेरा से देवी अभिप्रेत है या उससे जुड़ी उपासना-वस्तु
  choice: मुख्य पाठ में ‘अशेरा’ का लिप्यंतरण
  alternative: ‘अशेरा का खंभा’ अथवा ‘अशेरा की लकड़ी की प्रतिमा’
  rationale: אֲשֵׁרָה का संदर्भगत अर्थ विवादित है। लिप्यंतरण देवी, उसके प्रतीक और वृक्ष/काष्ठ की उपासना-वस्तु के बीच की अर्थगत एवं धार्मिक अस्पष्टता को अनावश्यक रूप से नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन अनौपचारिक कानूनी संबोधन ‘तुम’ रखा गया है। शैली स्पष्ट, गरिमापूर्ण और स्रोत के निकट है। ‘लगाना’ हिन्दी में ‘रोपना’ से कुछ व्यापक है, जिससे जीवित वृक्ष और काष्ठ-निर्मित उपासना-वस्तु—दोनों की संभावना बनी रहती है।
