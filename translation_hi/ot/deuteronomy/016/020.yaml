  text: צֶ֥דֶק צֶ֖דֶק תִּרְדֹּ֑ף לְמַ֤עַן תִּֽחְיֶה֙ וְ/יָרַשְׁתָּ֣ אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/020.yaml
  text: Justice[a], justice you shall pursue[b], so that you may live and possess the land that Yahweh your God is giving you.
translation:
  language: hi
  text: न्याय[a], न्याय का ही पीछा करना, ताकि तुम जीते रहो और उस देश को अपने अधिकार में लो[b], जिसे याहवे, तुम्हारा परमेश्वर, तुम्हें दे रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धार्मिकता, धार्मिकता।” इब्रानी צֶדֶק में न्याय और धार्मिकता दोनों के अर्थ हो सकते हैं; यहाँ न्यायिक प्रसंग के कारण “न्याय” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या, “विरासत में पाओ।” इब्रानी क्रिया में विरासत पाने और अधिकार में लेने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק צֶדֶק
  choice: न्याय, न्याय ही
  rationale: दोहराव की बलात्मकता को बनाए रखते हुए न्यायिक संदर्भ के अनुरूप ‘न्याय’ चुना गया है। ‘धार्मिकता’ भी शब्द का सम्भव अर्थ है, पर यहाँ न्यायाधीशों, पक्षपात और घूस का संदर्भ सार्वजनिक तथा न्यायिक अर्थ को प्रमुख बनाता है।
- source_word: תִּרְדֹּף
  choice: के पीछे लगे रहना
  rationale: मूल क्रिया का अर्थ पीछा करना या लगन से खोजते रहना है। यह अभिव्यक्ति न्याय के सक्रिय और निरन्तर अनुसरण तथा आदेशात्मक बल—दोनों को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह आज्ञा के उद्देश्य अथवा उसके परिणाम को आगे आने वाले वाक्य से स्पष्ट रूप से जोड़ता है।
- source_word: תִּחְיֶה
  choice: तुम जीवित रहो
  rationale: यह मूल के सीधे अर्थ को बनाए रखता है और वाचा के अधीन जीवन तथा बने रहने की व्यापक सम्भावना को अनावश्यक विस्तार दिए बिना व्यक्त करता है।
- source_word: וְיָרַשְׁתָּ
  choice: अपने अधिकार में लो
  rationale: यहाँ क्रिया देश पर अधिकार पाने और उसे अपने पास रखने का भाव देती है। ‘विरासत में पाओ’ भी सम्भव है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: व्यवस्थाविवरण में यह प्रतिज्ञात देश के लिए प्रयुक्त प्रमुख वाचाई पद है। ‘उस देश’ हिन्दी में निश्चित संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यन्तरित रूप में रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन के वाचाई सम्बोधन को आधुनिक, सम्मानपूर्ण और सामूहिक हिन्दी ‘तुम्हारा’ से व्यक्त किया गया है।
- source_word: נֹתֵן לָךְ
  choice: तुम्हें दे रहा है
  rationale: वर्तमान कृदन्त की जारी और सजीव क्रिया को हिन्दी के अपूर्ण वर्तमान से व्यक्त किया गया है।
theological_decisions:
- issue: न्यायिक संदर्भ में צֶדֶק का अनुवाद
  choice: न्याय
  alternative: धार्मिकता
  rationale: आस-पास का प्रसंग न्यायाधीशों, निष्पक्षता और घूस से सम्बन्धित है, इसलिए न्यायिक-सामाजिक अर्थ प्रमुख है; फिर भी व्यापक नैतिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचाई नाम का प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: द्वितीय पुरुष एकवचन का हिन्दी रूप
  choice: तुम
  alternative: तू; आप
  rationale: इब्रानी में इस्राएल को सामूहिक एकवचन में सम्बोधित किया गया है। आधुनिक मानक हिन्दी में ‘तुम’ इस एकवचन-सामूहिक सम्बोधन को स्पष्ट, सामान्य और गरिमापूर्ण ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और आदेशात्मक स्वर अपनाया गया है। मूल के बलात्मक दोहराव को ‘न्याय, न्याय ही’ से बनाए रखा गया है। ‘तू’ की अपेक्षा ‘तुम’ चुना गया है, क्योंकि यह आज के सामान्य पाठक के लिए अधिक स्वाभाविक है और सामूहिक इस्राएल को दिए गए एकवचन सम्बोधन के अनुकूल भी है।
