base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/017.yaml
  text: Each man shall give according to the gift of his hand[a], according to the blessing of Yahweh your God that he has given you.
translation:
  language: hi
  text: हर पुरुष अपनी सामर्थ्य के अनुसार[a] दे—उस आशीष के अनुसार जो याहवेह, तुम्हारे परमेश्वर, ने तुम्हें दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने हाथ के उपहार के अनुसार”; यह इब्रानी मुहावरा व्यक्ति के पास देने के लिए उपलब्ध साधनों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: हर पुरुष
  rationale: एकवचन संज्ञा यहाँ वितरणात्मक अर्थ रखती है; इसलिए लिंग-सटीक और स्वाभाविक हिन्दी में ‘हर पुरुष’ रखा गया है।
- source_word: כְּמַתְּנַת יָדוֹ
  choice: अपनी सामर्थ्य के अनुसार
  rationale: शाब्दिक रूप ‘उसके हाथ के उपहार के अनुसार’ एक इब्रानी मुहावरा है, जिसका आशय उपलब्ध साधनों या देने की क्षमता के अनुपात से है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: כְּבִרְכַּת
  choice: उस आशीष के अनुसार
  rationale: उपसर्ग כְּ अनुपात या अनुरूपता व्यक्त करता है; ‘के अनुसार’ इसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवेह
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक रूप का सीधा और प्रसंगानुकूल अनुवाद।
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: जो ... ने तुम्हें दी है
  rationale: सम्बन्धवाचक उपवाक्य ‘आशीष’ को विशेषित करता है; हिन्दी पूर्ण वर्तमान प्राप्त आशीष की वर्तमान प्रासंगिकता व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-नाम प्रत्यक्ष है। लिप्यंतरण व्यक्तिगत नाम को सुरक्षित रखता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप। इब्रानी मुहावरे को मुख्य पाठ में अर्थ-स्पष्ट रूप से दिया गया है, जबकि पादटिप्पणी में उसका शाब्दिक बिंब सुरक्षित रखा गया है।
