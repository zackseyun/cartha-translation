  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण कानूनी-नैतिक निर्देश। एकवचन संबोधन के अनुरूप ‘तुम’ और निषेधात्मक ‘न ... लेना’ संरचना रखी गई है। पाद-टिप्पणी चिह्न उन्हीं पदों पर लगाए गए हैं जिनसे वे संबंधित हैं।
