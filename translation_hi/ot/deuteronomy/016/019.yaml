source:
  edition: WLC
  text: לֹא תַטֶּ֣ה מִשְׁפָּ֔ט לֹ֥א תַכִּ֖יר פָּנִ֑ים וְ/לֹא תִקַּ֣ח שֹׁ֔חַד כִּ֣י הַ/שֹּׁ֗חַד יְעַוֵּר֙ עֵינֵ֣י חֲכָמִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/019.yaml
  text: You shall not pervert justice[a]; you shall not show partiality; and you shall not take a bribe[b], for the bribe blinds the eyes of the wise and twists the words of the righteous.
translation:
  language: hi
  text: तुम न्याय को न बिगाड़ना, न किसी का पक्ष लेना[a], और न घूस लेना, क्योंकि घूस बुद्धिमानों की आँखें अंधी कर देती है और धर्मियों की बातों[b] को तोड़-मरोड़ देती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘चेहरे पहचानना’ है; यह पक्षपात करने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या ‘धर्मियों के मामले को।’ इब्रानी शब्द का अर्थ उनकी ‘बातें’ हो सकता है और न्यायिक संदर्भ में उनका ‘मामला’ भी।
    reason: alternative_reading
lexical_decisions:
- source_word: תַטֶּה מִשְׁפָּט
  choice: न्याय को बिगाड़ना
  rationale: हिफ़ील रूप और מִשְׁפָּט का संयोग न्यायिक निर्णय को सही मार्ग से मोड़ने या विकृत करने का भाव देता है। ‘न्याय को बिगाड़ना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: תַכִּיר פָּנִים
  choice: किसी का पक्ष लेना
  rationale: शाब्दिक अर्थ ‘चेहरे पहचानना’ है, पर यह न्याय करते समय पक्षपात या कृपापात्रता दिखाने का इब्रानी मुहावरा है।
- source_word: שֹׁחַד
  choice: घूस
  rationale: कानूनी संदर्भ में यह निर्णय को प्रभावित करने के लिए दिया गया भ्रष्ट भुगतान है; ‘घूस’ उसके नैतिक और न्यायिक बल को स्पष्ट रखता है।
- source_word: יְעַוֵּר עֵינֵי חֲכָמִים
  choice: बुद्धिमानों की आँखें अंधी कर देती है
  rationale: मूल का सजीव रूपक हिन्दी में भी सहज और बोधगम्य है, इसलिए उसे बनाए रखा गया है।
- source_word: חֲכָמִים
  choice: बुद्धिमानों
  rationale: बहुवचन का आशय सामान्य रूप से बुद्धिमान लोगों से है; यह चयन अनावश्यक रूप से केवल पुरुषों तक अर्थ को सीमित नहीं करता।
- source_word: וִיסַלֵּף דִּבְרֵי צַדִּיקִם
  choice: धर्मियों की बातों को तोड़-मरोड़ देती है
  rationale: סלף का भाव मोड़ने या विकृत करने का है। דִּבְרֵי का मूल अर्थ ‘बातें/वचन’ है, जबकि न्यायिक संदर्भ में इससे ‘मामला’ भी अभिप्रेत हो सकता है; मुख्य पाठ निकट अर्थ रखता है और पाद-टिप्पणी वैकल्पिक अर्थ बताती है।
- source_word: צַדִּיקִם
  choice: धर्मियों
  rationale: यह उन लोगों को दर्शा सकता है जो नैतिक या कानूनी रूप से सही पक्ष में हैं। ‘धर्मी’ मूल की व्यापकता बनाए रखता है; ‘निर्दोष’ अर्थ को अधिक संकीर्ण कर देता।
