base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/015.yaml
  text: For seven days you shall celebrate a feast to Yahweh your God in the place that Yahweh will choose[a], because Yahweh your God will bless you in all your produce and in all the work of your hands, and you shall be altogether joyful.
translation:
  language: hi
  text: सात दिन तक तुम अपने परमेश्वर यहोवा के लिए उस स्थान पर पर्व मनाओ जिसे यहोवा चुनेगा, क्योंकि तुम्हारा परमेश्वर यहोवा तुम्हारी सारी उपज और तुम्हारे हाथों के हर काम में तुम्हें आशीष देगा; और तुम पूरी तरह आनन्दित रहोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तुम केवल आनन्दित रहोगे,” अथवा “और तुम निश्चय ही आनन्द मनाओगे।” इब्रानी अभिव्यक्ति भरपूर, निर्मल आनन्द पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּחֹג
  choice: पर्व मनाना
  rationale: क्रिया חָגַג किसी तीर्थ-पर्व को विधिवत मनाने को दर्शाती है; इसलिए केवल सामान्य उत्सव या आनन्द के बजाय ‘पर्व मनाना’ उपयुक्त है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל यहाँ पर्व के समर्पण और अभिमुखता को व्यक्त करता है; ‘के लिए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिवाचक वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: उस स्थान पर जिसे यहोवा चुनेगा
  rationale: यह परमेश्वर द्वारा चुने जाने वाले उपासना-स्थल को निकट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי आज्ञा और आनन्द का कारण प्रस्तुत करता है।
- source_word: יְבָרֶכְךָ
  choice: तुम्हें आशीष देगा
  rationale: यह वाचागत आशीष की मानक भाषा को सुरक्षित रखता है और अर्थ को केवल आर्थिक समृद्धि तक सीमित नहीं करता।
- source_word: תְּבוּאָתְךָ
  choice: तुम्हारी सारी उपज
  rationale: תְּבוּאָה कृषि की पैदावार के व्यापक अर्थ में है; ‘उपज’ इसे केवल अनाज तक सीमित नहीं करती।
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: तुम्हारे हाथों के सारे काम
  rationale: इब्रानी मुहावरे की ठोस छवि को बनाए रखते हुए यह श्रम और उसके फल दोनों को समझने योग्य ढंग से व्यक्त करता है।
- source_word: וְהָיִיתָ אַךְ שָׂמֵחַ
  choice: और तुम पूरी तरह आनन्दित रहोगे
  rationale: וְהָיִיתָ को भविष्यगत परिणाम और אַךְ को प्रबलता के रूप में व्यक्त किया गया है, जबकि वैकल्पिक प्रतिबंधात्मक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: यहाँ मूल पाठ सीधे चतुरक्षरीय वाचा-नाम का प्रयोग करता है। हिन्दी पाठकों के लिए परिचित व्यक्तिवाचक रूप ‘यहोवा’ नाम को उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: अंतिम वाक्यांश וְהָיִיתָ אַךְ שָׂמֵחַ का बल
  choice: और तुम पूरी तरह आनन्दित रहोगे
  alternative: और तुम केवल आनन्दित रहोगे; और तुम निश्चय ही आनन्द मनाओगे
  rationale: אַךְ में प्रतिबंध अथवा प्रबलता दोनों की छाया संभव है। सन्दर्भ में भरपूर, निष्कलंक आनन्द प्रमुख है, पर वास्तविक भाषिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और आज्ञात्मक-वाचागत स्वर रखा गया है। एकवचन ‘तुम’ मूल इब्रानी के एकवचन संबोधन को दर्शाता है। ‘आनन्दित’ धार्मिक-साहित्यिक गरिमा रखते हुए सामान्य पाठक के लिए स्पष्ट है।
