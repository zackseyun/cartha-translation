base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/013.yaml
  text: You shall keep the Feast of Booths for seven days[a], when you gather in from your threshing floor and from your winepress.
translation:
  language: hi
  text: तुम सात दिन तक झोंपड़ियों का पर्व[a] मनाना, जब तुम अपने खलिहान और दाखरस के कुण्ड से उपज इकट्ठी करते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “मण्डपों का पर्व” भी कहा जाता है। इब्रानी शब्द का शाब्दिक अर्थ अस्थायी झोंपड़ियाँ या आश्रय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַסֻּכֹּת
  choice: झोंपड़ियों का पर्व
  rationale: חַג यहाँ विधिवत मनाए जाने वाले पर्व को और סֻכּוֹת अस्थायी झोंपड़ियों या छप्परों को दर्शाता है। यह अनुवाद पारंपरिक नाम से अधिक पारदर्शी है और अस्थायी आश्रयों की ठोस छवि बनाए रखता है।
- source_word: תַּעֲשֶׂה לְךָ
  choice: तुम ... मनाना
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ है, पर חַג के साथ इसका अर्थ पर्व मनाना या उसका पालन करना है। हिंदी का आज्ञार्थक ‘मनाना’ स्वाभाविक ढंग से दायित्व व्यक्त करता है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह अवधि को स्पष्ट और स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: בְּאָסְפְּךָ
  choice: जब तुम ... उपज इकट्ठी कर लो
  rationale: ב के साथ infinitive construct यहाँ समय-संबंध बताता है। ‘जब’ मूल की कालगत व्यापकता रखता है; ‘कर लो’ फसल को भीतर जमा करने की पूर्ण होती क्रिया को सहज हिंदी में दर्शाता है।
- source_word: מִגָּרְנְךָ
  choice: अपने खलिहान ... से उपज
  rationale: גֹּרֶן खलिहान अथवा दँवरी की जगह है और प्रसंग में वहाँ से मिलने वाली अनाज की उपज का लक्षणा द्वारा संकेत करता है। ‘खलिहान’ ठोस कृषि-चित्र बनाए रखता है।
- source_word: וּמִיִּקְבֶךָ
  choice: और दाखरस के कुण्ड से उपज
  rationale: יֶקֶב अंगूर दबाने और रस जमा करने की व्यवस्था के कुण्ड/हौद को सूचित कर सकता है। ‘दाखरस का कुण्ड’ आधुनिक पाठक के लिए अर्थ स्पष्ट रखते हुए ठोस चित्र को बचाता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन संबोधन के लिए ‘तुम’ और विधिक आज्ञा के लिए ‘मनाना’ प्रयुक्त है। कृषि-संबंधी ठोस बिंबों को बनाए रखते हुए ‘उपज’ जोड़ा गया है, क्योंकि खलिहान और दाखरस के कुण्ड से स्वयं स्थान नहीं, उनकी उपज इकट्ठी की जाती है।
