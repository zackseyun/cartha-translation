source:
  edition: WLC
  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שַׁכֵּ֣ן שְׁמ֔/וֹ שָׁ֛ם תִּזְבַּ֥ח אֶת הַ/פֶּ֖סַח בָּ/עָ֑רֶב כְּ/ב֣וֹא הַ/שֶּׁ֔מֶשׁ מוֹעֵ֖ד צֵֽאתְ/ךָ֥ מִ/מִּצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/006.yaml
  text: but only at the place that Yahweh your God will choose for his name to dwell—there you shall sacrifice the Passover in the evening[a], at sunset[c][b], at the appointed time of your departure from Egypt.
translation:
  language: hi
  text: परन्तु केवल उस स्थान पर, जिसे तुम्हारा परमेश्वर यहोवा वहाँ अपना नाम बसाने के लिए चुनेगा[a], वहीं तुम साँझ को, सूर्यास्त के समय, उस नियत समय पर जब तुम मिस्र से निकले थे, फसह का बलिदान चढ़ाना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने नाम के निवास के लिए”; या, “वहाँ अपना नाम रखने के लिए।”
    reason: lexical_alternative
  - marker: b
    text: या, “फसह का वध करना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: परन्तु केवल
  rationale: यह पद पिछले निषेध के विपरीत एक प्रबल प्रतिबंध व्यक्त करता है; यह हिन्दी में अपवाद और बल दोनों को स्वाभाविक रूप से प्रकट करता है।
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: उस स्थान पर, जिसे ... चुनेगा
  rationale: कानूनी प्रसंग में अपूर्ण क्रिया का भावी अर्थ है और वाक्य चुने हुए उपासना-स्थान को निर्दिष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को सुरक्षित रखता है, किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: अपने नाम के निवास के लिए
  rationale: हिब्रू में हिफ़ील रूप है, जिसका अर्थ अपने नाम को बसाना भी हो सकता है; मुख्य पाठ नाम के निवास की मूल उपमा को स्वाभाविक हिन्दी में बनाए रखता है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: תִּזְבַּח אֶת הַפֶּסַח
  choice: फसह का बलिदान चढ़ाना
  rationale: क्रिया बलिदान के लिए पशु-वध को सूचित करती है और यहाँ कर्म फसह है; यह अनुवाद अनुष्ठानिक भाव स्पष्ट करते हुए केवल 'फसह' को पर्व मात्र समझने की सम्भावना घटाता है।
- source_word: בָּעָרֶב כְּבוֹא הַשֶּׁמֶשׁ
  choice: साँझ को, सूर्यास्त के समय
  rationale: दोनों निकटवर्ती काल-सूचक पदों को बनाए रखता है; दूसरा पहले को अधिक ठीक रूप से निर्धारित करता है।
- source_word: מוֹעֵד צֵאתְךָ מִמִּצְרָיִם
  choice: जिस समय तुम मिस्र से निकले थे
  rationale: מוֹעֵד के नियत समय और निर्गमन की ऐतिहासिक घड़ी के सम्बन्ध को सहज हिन्दी में व्यक्त करता है, बिना 'निर्गमन' को ग्रंथ-शीर्षक जैसा तकनीकी शब्द बनाए।
theological_decisions:
- issue: चुने हुए स्थान पर परमेश्वर के नाम का निवास
  choice: अपने नाम के निवास के लिए
  alternative: वहाँ अपने नाम को बसाने के लिए
  rationale: मुख्य पाठ व्यवस्थाविवरण की 'नाम के निवास' वाली भाषा और परमेश्वर की उपस्थिति तथा अतीन्द्रियता के बीच तनाव को सुरक्षित रखता है; वह इसे परमेश्वर के स्वयं किसी स्थान तक सीमित होने के कथन में नहीं बदलता।
- issue: फसह क्रिया का बलिदानी स्वरूप
  choice: फसह का बलिदान चढ़ाना
  alternative: फसह के पशु का वध करना
  rationale: זבח में वध और बलिदान दोनों निहित हैं। प्रसंग उपासना और चुने हुए स्थान का है, इसलिए बलिदानी भाव मुख्य पाठ में उचित है, जबकि अधिक शाब्दिक वध वाला अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-अनुकूल रूप। एकवचन सम्बोधन को ‘तुम्हारा/तुम’ से बनाए रखा गया है। ‘यहोवा’ व्यक्तिगत दिव्य नाम के रूप में और ‘फसह’ प्रचलित बाइबलीय पद के रूप में रखा गया है।
