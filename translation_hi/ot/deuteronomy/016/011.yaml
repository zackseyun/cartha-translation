base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/011.yaml
  text: And you shall rejoice before Yahweh your God—you[a], your son, your daughter, your male servant, your female servant, the Levite who is within your gates, and the sojourner, the fatherless[c][b], and the widow who are among you—at the place that Yahweh your God will choose for his name to dwell there.
translation:
  language: hi
  text: और तुम अपने परमेश्वर यहोवा के सामने आनन्द मनाओ—तुम, तुम्हारा बेटा, तुम्हारी बेटी, तुम्हारा दास, तुम्हारी दासी, तुम्हारे फाटकों के भीतर रहनेवाला लेवी, और तुम्हारे बीच के परदेशी[a], अनाथ[b] और विधवा—उस स्थान पर जिसे तुम्हारा परमेश्वर यहोवा अपने नाम का वहाँ वास कराने के लिए चुनेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निवासी विदेशी’; इब्रानी शब्द ऐसे गैर-इस्राएली व्यक्ति के लिए है जो इस्राएल के सामाजिक विधान के अधीन उनके बीच रहता था।
    reason: lexical_alternative
  - marker: b
    text: या ‘पिताविहीन’।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘वहाँ अपने नाम को वास कराने के लिए।’
    reason: literal_rendering
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: और तुम ... आनन्द मनाना
  rationale: क्रिया שׂמח आनन्दित होने अथवा उत्सवपूर्वक आनन्द मनाने को व्यक्त करती है। व्यवस्था-संबंधी निर्देश के हिन्दी मुहावरे में ‘आनन्द मनाना’ स्वाभाविक और गरिमापूर्ण है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह पदबंध परमेश्वर की उपस्थिति में आराधना और उत्सव मनाने का भाव देता है; ‘के सामने’ संक्षिप्त और स्रोत के निकट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: तुम्हारा दास, तुम्हारी दासी
  rationale: दोनों शब्द आश्रित घरेलू सेवा और बंधुआ सामाजिक स्थिति को सूचित कर सकते हैं। ‘दास/दासी’ लिंगभेद और स्थिति दोनों बनाए रखते हैं तथा आधुनिक हिन्दी बाइबिलीय शैली में सुबोध हैं।
- source_word: בִּשְׁעָרֶיךָ
  choice: तुम्हारे फाटकों के भीतर रहनेवाला
  rationale: शाब्दिक ‘तुम्हारे फाटकों में’ नगर अथवा स्थानीय समुदाय का मुहावरा है। ‘फाटकों के भीतर रहनेवाला’ मूल बिंब को रखते हुए हिन्दी में अर्थ स्पष्ट करता है।
- source_word: וְהַגֵּר
  choice: परदेशी
  rationale: גֵּר किसी ऐसे गैर-स्थानीय व्यक्ति को दर्शाता है जो इस्राएली समुदाय के बीच निवासी के रूप में रहता था। ‘परदेशी’ सहज है; अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְהַיָּתוֹם
  choice: अनाथ
  rationale: יָתוֹם सामाजिक संरक्षण से वंचित, विशेषकर पिताविहीन बालक को सूचित करता है। आधुनिक हिन्दी में ‘अनाथ’ सर्वाधिक स्वाभाविक है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में है।
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: अपने नाम को वहाँ वास कराने के लिए
  rationale: हिफ़ील रूप causative अर्थ रखता है। यह अनुवाद ‘नाम’ के निवास की व्यवस्थाविवरणीय अभिव्यक्ति तथा परमेश्वर की उपस्थिति और पारलौकिकता के बीच तनाव को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है, केवल उपाधि नहीं। हिन्दी पाठकों के लिए स्थापित लिप्यंतरण ‘यहोवा’ नाम को प्रत्यक्ष रखता है।
- issue: עבד/אמה की सामाजिक स्थिति
  choice: दास / दासी
  alternative: सेवक / सेविका
  rationale: सामान्य सेवा के अर्थ की सम्भावना रहते हुए भी घरेलू-कानूनी संदर्भ में बंधुआ आश्रित स्थिति प्रमुख है; ‘दास/दासी’ इसे अनावश्यक रूप से नरम नहीं करता।
- issue: नाम के वास की अभिव्यक्ति לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: अपने नाम को वहाँ वास कराने के लिए
  alternative: अपना नाम वहाँ रखने के लिए
  rationale: ‘वास कराने’ से क्रिया का causative बल और व्यवस्थाविवरण की विशिष्ट धार्मिक अभिव्यक्ति दोनों बने रहते हैं; यह परमेश्वर को केवल भौतिक स्थान में सीमित भी नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु साधारण पाठक के लिए सुबोध रखी गई है। ‘आनन्द मनाना’ उत्सवी संदर्भ को व्यक्त करता है। एकवचन ‘तुम’ मूल इब्रानी व्यवस्था-संबंधी संबोधन को बनाए रखता है।
