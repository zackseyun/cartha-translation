source:
  edition: WLC
  text: וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֥ שְׂאֹ֛ר בְּ/כָל גְּבֻלְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא יָלִ֣ין מִן הַ/בָּשָׂ֗ר אֲשֶׁ֨ר תִּזְבַּ֥ח בָּ/עֶ֛רֶב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן לַ/בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/004.yaml
  text: No leaven is to be seen with you within all your territory for seven days[b][a], and none of the flesh that you sacrifice in the evening on the first day shall remain overnight until morning.
translation:
  language: hi
  text: सात दिन तक तुम्हारे पूरे क्षेत्र में कहीं भी खमीर दिखाई न दे; और जिस मांस[a] को तुम पहले दिन[b] संध्या को बलि चढ़ाओगे, उस मांस में से कुछ भी सुबह तक रात भर न बचा रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मांस’ या ‘शरीर’; इब्रानी शब्द बलिदान के संदर्भ में अक्सर बलि के मांस के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पहले दिन’ से आशय पर्व के आरम्भ में चढ़ाई जाने वाली फसह की बलि हो सकता है, यद्यपि यहाँ इब्रानी पाठ स्पष्ट रूप से ‘फसह का मेम्ना’ नहीं कहता।
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרָאֶה
  choice: दिखाई न दे
  rationale: निफ़अल का कर्मवाच्य अर्थ सुरक्षित रखते हुए निषेध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שְׂאֹר
  choice: खमीर
  rationale: फसह और अखमीरी रोटी के विधिक संदर्भ में यह किण्वन कराने वाले पदार्थ का प्रचलित और समझने योग्य हिन्दी शब्द है।
- source_word: בְּכָל גְּבֻלְךָ
  choice: तुम्हारे पूरे क्षेत्र में कहीं भी
  rationale: גְּבוּל यहाँ केवल सीमा-रेखा नहीं, अधिकार-क्षेत्र को दर्शाता है; यह रूप निषेध की समग्र भौगोलिक व्यापकता स्पष्ट करता है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָלִין
  choice: रात भर ... न रहे
  rationale: לין के रात बिताने अथवा रात भर बचे रहने के अर्थ को भोजन-संबंधी निषेध के प्रसंग में स्पष्ट करता है।
- source_word: מִן הַבָּשָׂר
  choice: मांस में से कुछ भी
  rationale: भागसूचक מִן को हिन्दी में स्वाभाविक रूप से व्यक्त करता है; בָּשָׂר बलि के संदर्भ में मांस को सूचित करता है।
- source_word: אֲשֶׁר תִּזְבַּח
  choice: जिस ... को तुम ... बलि चढ़ाओगे
  rationale: זבח के बलि के लिए वध/अर्पण करने के अनुष्ठानिक अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: בָּעֶרֶב
  choice: संध्या को
  rationale: मूल के कालवाचक पद का संक्षिप्त, गरिमापूर्ण और स्वाभाविक हिन्दी समतुल्य है।
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: पहले दिन
  rationale: मूल में केवल ‘पहले दिन’ है; मुख्य पाठ में ‘पर्व का’ या ‘फसह का’ जोड़कर संदर्भ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: לַבֹּקֶר
  choice: सुबह तक
  rationale: यहाँ ל समय की अंतिम सीमा बताता है; ‘सुबह तक’ हिन्दी में उसका स्पष्ट समतुल्य है।
theological_decisions:
- issue: ‘पहले दिन’ संध्या को बलि किए गए मांस का संदर्भ
  choice: मुख्य पाठ में सामान्य रूप से बलि के मांस का उल्लेख
  alternative: इसे विशेष रूप से फसह के मेम्ने अथवा फसह की बलि का मांस कहना
  rationale: इब्रानी पाठ यहाँ न तो ‘फसह’ कहता है, न ‘मेम्ना’; इसलिए अनुवाद उस बलि की पहचान को निश्चित किए बिना मूल की व्यापकता और व्याख्यात्मक तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, विधिक निषेध के अनुरूप गरिमापूर्ण किंतु सहज रखी गई है। ‘संध्या’ अनुष्ठानिक संदर्भ के अनुकूल है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सीधा रखा गया है।
