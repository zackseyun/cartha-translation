  text: שֹׁפְטִ֣ים וְ/שֹֽׁטְרִ֗ים תִּֽתֶּן לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ לִ/שְׁבָטֶ֑י/ךָ וְ/שָׁפְט֥וּ אֶת הָ/עָ֖ם מִשְׁפַּט צֶֽדֶק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/018.yaml
  text: You shall appoint judges and officers for yourself in all your gates that Yahweh your God is giving you[a], according to your tribes[b], and they shall judge the people with righteous judgment.
translation:
  language: hi
  text: “तुम अपने सब फाटकों पर[a]—जिन्हें तुम्हारा परमेश्वर यहोवा तुम्हें तुम्हारे गोत्रों के अनुसार दे रहा है—न्यायाधीशों और अधिकारियों को नियुक्त करो। वे लोगों का न्याय न्यायपूर्वक करें[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सभी नगरों में”; शाब्दिक रूप से, “अपने सब फाटकों पर।” नगर-फाटक नागरिक और न्यायिक कामकाज के केंद्र हुआ करते थे।
    reason: cultural_note
  - marker: b
    text: या, “न्यायपूर्ण निर्णय करें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטִים
  choice: न्यायियों
  rationale: यह संज्ञा कानूनी विवादों का निर्णय करने वालों को दर्शाती है; ‘न्यायी’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: שֹׁטְרִים
  choice: अधिकारियों
  rationale: यह शब्द न्याय-प्रशासन से जुड़े पदाधिकारियों के लिए है। उनके सटीक कार्य को अनावश्यक रूप से सीमित किए बिना ‘अधिकारी’ संस्थागत अर्थ बनाए रखता है।
- source_word: תִּתֶּן
  choice: नियुक्त करना
  rationale: क्रिया का मूल अर्थ ‘रखना/देना’ है, पर यहाँ लोगों को पद पर स्थापित करने का भाव है; हिन्दी आदेशात्मक शैली में ‘नियुक्त करना’ स्वाभाविक है।
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: अपने सब फाटकों पर
  rationale: मूल पाठ के ‘अपने सब फाटकों में/पर’ रूपक को रखा गया है। प्राचीन नगर-फाटक नागरिक और न्यायिक कार्यों के केंद्र थे; सांस्कृतिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לִשְׁבָטֶיךָ
  choice: तुम्हारे गोत्रों के अनुसार
  rationale: वाक्यांश नियुक्ति-व्यवस्था के गोत्रानुसार वितरण को दर्शाता है; यह अनुवाद ‘के लिए’ और ‘के अनुसार’ के बीच स्रोत की कुछ लचक भी बनाए रखता है।
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: वे लोगों का न्याय ... करें
  rationale: कानूनी प्रसंग में क्रिया का न्यायिक अर्थ स्पष्ट है और ‘न्यायियों’ के साथ उसका शब्द-संबंध भी बना रहता है।
- source_word: מִשְׁפַּט צֶדֶק
  choice: सच्चाई से
  rationale: यह पद न्यायिक निर्णय की नैतिक शुद्धता और उचितता बताता है। ‘सच्चाई से न्याय करें’ सहज हिन्दी में दोनों पहलुओं को व्यक्त करता है; ‘न्यायोचित न्याय’ अधिक शाब्दिक पर अस्वाभाविक होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी पाठकों में स्थापित प्रतिलेखन ‘यहोवा’ नाम को नाम ही रखता है, उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: מִשְׁפַּט צֶדֶק में नैतिक और न्यायिक अर्थ का संबंध
  choice: सच्चाई से न्याय करें
  alternative: न्यायोचित निर्णय दें
  rationale: स्रोत न्यायिक निर्णय और नैतिक उचितता को साथ रखता है। चुना हुआ रूप इस तनाव को किसी विशेष धार्मिक ‘धार्मिकता’ की व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। व्यवस्था-विवरण की आज्ञात्मक वाक्य-रचना के लिए ‘नियुक्त करना’ और ‘करें’ प्रयुक्त हैं। ‘फाटक’ की मूल सांस्कृतिक छवि मुख्य पाठ में रखकर उसका आशय पादटिप्पणी में बताया गया है।
