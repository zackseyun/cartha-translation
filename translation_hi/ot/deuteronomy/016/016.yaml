source:
  edition: WLC
  text: שָׁל֣וֹשׁ פְּעָמִ֣ים בַּ/שָּׁנָ֡ה יֵרָאֶ֨ה כָל זְכוּרְ/ךָ֜ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר יִבְחָ֔ר בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֣ג הַ/סֻּכּ֑וֹת וְ/לֹ֧א יֵרָאֶ֛ה אֶת פְּנֵ֥י יְהוָ֖ה רֵיקָֽם׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/016.yaml
  text: 'Three times a year all your males shall appear before Yahweh your God in the place that he will choose: at the Feast of Unleavened Bread[a], at the Feast of Weeks, and at the Feast of Booths[c][b]. No one shall appear before Yahweh empty-handed.'
translation:
  language: hi
  text: वर्ष में तीन बार तुम्हारे सभी पुरुष उस स्थान पर, जिसे याहवे चुनेगा, याहवे, अपने परमेश्वर, के सामने उपस्थित हों[a]—अख़मीरी रोटी के पर्व पर, सप्ताहों के पर्व पर और झोपड़ियों के पर्व पर[b]। कोई भी याहवे के सामने खाली हाथ उपस्थित न हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “याहवे के सामने दिखाई दें” भी हो सकता है। इब्रानी निफ़ाल क्रिया यहाँ परमेश्वर के सामने स्वयं उपस्थित होने के मुहावरे के रूप में प्रयुक्त हुई है।
    reason: lexical_alternative
  - marker: b
    text: “झोपड़ियों का पर्व” को परंपरागत रूप से “मंडपों का पर्व” भी कहा जाता है।
    reason: alternative_reading
  - marker: c
    text: “खाली हाथ” आने का अर्थ आवश्यक भेंट या उपहार लाए बिना आना है।
    reason: cultural_note
lexical_decisions:
- source_word: יֵרָאֶה
  choice: उपस्थित हों
  rationale: निफ़ाल रूप का शाब्दिक अर्थ ‘दिखाई दें’ या ‘देखे जाएँ’ हो सकता है, पर तीर्थ-पर्वों के इस संदर्भ में यह परमेश्वर के सामने स्वयं उपस्थित होने का मुहावरा है।
- source_word: כָל זְכוּרְךָ
  choice: तुम्हारे सभी पुरुष
  rationale: इब्रानी पद स्पष्ट रूप से पुरुषों को निर्दिष्ट करता है; हिन्दी में यह कानूनी दायित्व का दायरा स्वाभाविक और ठीक रूप से व्यक्त करता है।
- source_word: פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: याहवे तुम्हारे परमेश्वर के सामने
  rationale: ‘मुख के सामने’ वाला इब्रानी मुहावरा किसी की उपस्थिति में आने को दर्शाता है; हिन्दी में ‘के सामने’ इसका स्वाभाविक समतुल्य है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह उपाधि नहीं, इब्रानी चतुरक्षरीय व्यक्तिगत नाम है; ‘याहवे’ उसका प्रचलित लिप्यंतरण है।
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: उस स्थान पर, जिसे याहवे चुनेगा
  rationale: अपूर्ण क्रिया का भविष्याभिमुख बल और व्यवस्थाविवरण में उपासना-स्थान के परमेश्वर द्वारा चुने जाने पर दिया गया जोर सुरक्षित रहता है।
- source_word: חַג הַמַּצּוֹת
  choice: अख़मीरी रोटी का पर्व
  rationale: यह पर्व के इब्रानी नाम का पारदर्शी और आधुनिक हिन्दी में समझ आने वाला रूप है।
- source_word: חַג הַשָּׁבֻעוֹת
  choice: सप्ताहों का पर्व
  rationale: यह मूल इब्रानी नाम का सीधा अनुवाद है और बाद के यूनानी-व्युत्पन्न नाम को पाठ में नहीं लाता।
- source_word: חַג הַסֻּכּוֹת
  choice: झोपड़ियों का पर्व
  rationale: סֻכּוֹת अस्थायी झोपड़ियों या छप्परों को दर्शाता है; यह नाम आधुनिक हिन्दी पाठक के लिए स्पष्ट है।
- source_word: רֵיקָם
  choice: खाली हाथ
  rationale: इस उपासना-संबंधी संदर्भ में इसका आशय भेंट या उपहार के बिना आने से है; ‘खाली हाथ’ हिन्दी का स्वाभाविक मुहावरा है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है। लिप्यंतरण इसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: כָל זְכוּרְךָ में पुरुष-वाचक कानूनी दायित्व
  choice: तुम्हारे सभी पुरुष
  alternative: तुम सभी; तुम्हारे सभी लोग
  rationale: स्रोत पाठ तीर्थ-पर्व में उपस्थित होने का यह दायित्व स्पष्ट रूप से पुरुषों के लिए व्यक्त करता है; लिंग-निरपेक्ष रूप उस दायरे को बदल देता।
- issue: יֵרָאֶה के निफ़ाल रूप की व्याख्या
  choice: उपस्थित हों
  alternative: दिखाई दें; देखे जाएँ
  rationale: संदर्भ में यह परमेश्वर के सम्मुख आने का प्रचलित उपासना-संबंधी मुहावरा है, फिर भी शाब्दिक रूप की वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। पर्वों के नाम मूल इब्रानी के निकट हैं; कानूनी पुरुष-वाचक संदर्भ और क्रिया की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
