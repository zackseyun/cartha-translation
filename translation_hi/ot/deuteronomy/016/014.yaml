source:
  edition: WLC
  text: וְ/שָׂמַחְתָּ֖ בְּ/חַגֶּ֑/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֗י וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/014.yaml
  text: And you shall rejoice in your festival—you and your son and your daughter[a], and your male servant and your female servant, and the Levite, and the sojourner, and the fatherless, and the widow[d][c][b], who are within your gates.
translation:
  language: hi
  text: और तुम अपने पर्व[a] में आनन्द मनाओ—तुम, तुम्हारा बेटा और तुम्हारी बेटी, तुम्हारा दास और तुम्हारी दासी, तथा तुम्हारे नगरों[d] में रहने वाले लेवी, परदेशी[b], अनाथ[c] और विधवा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने उत्सव में।” इब्रानी חַג धार्मिक पर्व, उत्सव या पर्व-भोज को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: '“परदेशी” से आशय उस गैर-इस्राएली निवासी से है जो इस्राएलियों के बीच रहता था; अन्य सम्भव अनुवाद: “निवासी विदेशी।”'
    reason: lexical_alternative
  - marker: c
    text: या, “पितृहीन।” इब्रानी शब्द विशेष रूप से पिता का संरक्षण खोने से उत्पन्न निर्बल सामाजिक स्थिति पर बल दे सकता है।
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप से, “तुम्हारे फाटकों के भीतर।” यह इब्रानी मुहावरा तुम्हारे नगरों या स्थानीय समुदाय में रहने वालों को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: और तुम ... आनन्द मनाना
  rationale: संयुक्त पूर्ण क्रिया इस विधिक-निर्देशात्मक प्रसंग में आज्ञार्थक बल रखती है। हिन्दी का ‘आनन्द मनाना’ उत्सव में सक्रिय सहभागिता और आदेश—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּחַגֶּךָ
  choice: अपने पर्व में
  rationale: חַג तीर्थ-पर्व अथवा धार्मिक उत्सव को दर्शाता है। ‘पर्व’ संक्षिप्त, प्रचलित और इस आराधनात्मक प्रसंग के अनुकूल है; ‘में’ उत्सव में सहभागिता का भाव रखता है।
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: तुम्हारा दास और तुम्हारी दासी
  rationale: עֶבֶד और אָמָה आश्रित अथवा बन्धुआ घरेलू स्थिति को सूचित कर सकते हैं। ‘दास’ और ‘दासी’ सामाजिक अधीनता को ‘नौकर’ की अपेक्षा अधिक स्पष्ट रखते हैं और स्त्री-पुरुष भेद भी सुरक्षित करते हैं।
- source_word: וְהַלֵּוִי
  choice: लेवी
  rationale: यह लेवी गोत्र के सदस्य की मानक संज्ञा है; हिन्दी बाइबलीय प्रयोग में ‘लेवी’ स्वाभाविक है।
- source_word: וְהַגֵּר
  choice: परदेशी
  rationale: גֵּר उस गैर-स्थानीय निवासी को दर्शाता है जो इस्राएलियों के बीच रह रहा हो। ‘परदेशी’ आधुनिक कानूनी आव्रजन श्रेणी थोपे बिना उसकी बाहरी उत्पत्ति और स्थानीय निवास दोनों के लिए पर्याप्त व्यापक है।
- source_word: וְהַיָּתוֹם
  choice: अनाथ
  rationale: यָתוֹם उस संतान की निर्बल सामाजिक स्थिति को दर्शाता है जिसने विशेषतः पिता का संरक्षण खोया हो। आधुनिक हिन्दी में ‘अनाथ’ सबसे स्वाभाविक संज्ञा है; सूक्ष्म अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: जो तुम्हारे नगरों में रहते हैं
  rationale: शाब्दिक ‘तुम्हारे फाटकों के भीतर’ नगरों अथवा स्थानीय समुदाय के अधिकार-क्षेत्र के लिए इब्रानी मुहावरा है। अर्थ-स्पष्ट हिन्दी में ‘तुम्हारे नगरों में’ चुना गया है।
theological_decisions:
- issue: עֶבֶד / אָמָה की सामाजिक स्थिति
  choice: दास / दासी
  alternative: सेवक / सेविका; नौकर / नौकरानी
  rationale: सूची घर के अधीन और सामाजिक रूप से निर्बल सदस्यों को पर्व के आनन्द में सम्मिलित करती है। ‘दास/दासी’ मूल शब्दों की सम्भावित बन्धुआ स्थिति को नरम करके केवल सामान्य सेवा नहीं बना देता।
- issue: גֵּר की सामुदायिक पहचान
  choice: परदेशी
  alternative: प्रवासी; निवासी विदेशी
  rationale: मूल शब्द इस्राएल के बीच रहने वाले गैर-स्थानीय व्यक्ति को नामित करता है। ‘परदेशी’ उसका समावेश दिखाता है, पर आधुनिक नागरिकता या आव्रजन की निश्चित कानूनी श्रेणी नहीं थोपता।
- issue: आज्ञा का बल
  choice: आनन्द मनाना
  alternative: आनन्द मनाओगे; आनन्दित हो
  rationale: यह रूप व्यवस्थाविवरण की निर्देशात्मक शैली में स्पष्ट आज्ञा देता है, जबकि आनन्द को केवल भविष्यवाणी या भावना के रूप में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, एकवचन ‘तुम’ के साथ रखी गई है। वाक्य की सूचीबद्ध लय और समावेशी बल सुरक्षित हैं। ‘आनन्द मनाना’ बोलचाल में समझ आने वाला, पर गरिमापूर्ण आज्ञार्थक प्रयोग है; ‘नगरों’ से प्राचीन फाटक-मुहावरे का आशय स्पष्ट किया गया है।
