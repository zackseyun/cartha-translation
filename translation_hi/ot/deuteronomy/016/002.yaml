  edition: WLC
  text: וְ/זָבַ֥חְתָּ פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ צֹ֣אן וּ/בָקָ֑ר בַּ/מָּקוֹם֙ אֲשֶׁר יִבְחַ֣ר יְהוָ֔ה לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/002.yaml
  text: And you shall sacrifice the Passover to Yahweh your God[a], from the flock and the herd, at the place that Yahweh will choose to make his name dwell there.
translation:
  language: hi
  text: तुम अपने परमेश्वर यहोवा के लिए भेड़-बकरियों और गाय-बैलों में से फसह का बलिदान चढ़ाओ[a], उस स्थान पर जिसे यहोवा अपना नाम वहाँ बसाने के लिए चुनेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘फसह’ के साथ ‘भेड़-बकरियों और गाय-बैलों में से’ कहा गया है। कुछ लोग इसे केवल फसह के बलि-पशु का नहीं, बल्कि फसह और अख़मीरी रोटी के पर्व से जुड़े अन्य बलिदानों का भी उल्लेख समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: बलिदान चढ़ाना
  rationale: זבח यहाँ साधारण वध नहीं, बल्कि धार्मिक बलिदान का वध और अर्पण दर्शाता है। आज्ञात्मक प्रसंग में हिंदी का क्रियार्थक रूप पिछले निर्देश की निरंतरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פֶּסַח
  choice: फसह
  rationale: यह शब्द पर्व, विधि या बलि-पशु को सूचित कर सकता है। ‘फसह’ हिब्रू की संक्षिप्तता और अर्थगत विस्तार को बनाए रखता है; बलिदान का भाव क्रिया से स्पष्ट होता है।
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा के लिए
  rationale: ל समर्पण या अभिमुखता दर्शाता है। ‘के लिए’ हिंदी में स्वाभाविक है और बलिदान के यहोवा को समर्पित होने का अर्थ देता है।
- source_word: צֹאן וּבָקָר
  choice: भेड़-बकरियों और गाय-बैलों में से
  rationale: दोनों सामूहिक संज्ञाएँ छोटे और बड़े पालतू पशुधन को दर्शाती हैं। यह रूप प्रजाति को अनावश्यक रूप से सीमित किए बिना साधारण हिंदी में दोनों वर्ग स्पष्ट करता है; ‘में से’ स्रोत-संबंध को व्यक्त करता है।
- source_word: בַּמָּקוֹם
  choice: उस स्थान पर
  rationale: यह परमेश्वर द्वारा चुने जाने वाले निश्चित उपासना-स्थल को दर्शाता है; ‘स्थान पर’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: जिसे यहोवा ... चुनेगा
  rationale: अपूर्ण क्रिया मूसा के कथन के दृष्टिकोण से भविष्य के चुनाव को दर्शाती है।
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: अपने नाम को वहाँ बसाने के लिए
  rationale: שכן का हिफ़ील रूप कारणवाचक है। ‘नाम को ... बसाना’ परमेश्वर की उपस्थिति और अधिकार से जुड़ी मूल वाचा-संबंधी अभिव्यक्ति को किसी व्याख्यात्मक समानार्थक में समतल नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। हिंदी में व्यापक रूप से पहचाने जाने वाले व्यक्तिवाचक रूप ‘यहोवा’ से इसे सामान्य उपाधि में बदलने से बचाया गया है।
- issue: ‘फसह’ और छोटे-बड़े पशुधन के उल्लेख का संबंध
  choice: मूल की व्यापक पशुधन-संबंधी शब्दावली को मुख्य पाठ में बनाए रखना
  alternative: ‘फसह की बलि और पर्व के अन्य बलिदान’ जैसा व्याख्यात्मक विस्तार
  rationale: צֹאן וּבָקָר का दायरा केवल एक मेमने या बकरी के बच्चे से व्यापक प्रतीत होता है। मुख्य पाठ इस तनाव को सुलझाता नहीं; संभावित पर्व-संबंधी व्यापक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भेड़-बकरियों और गाय-बैलों’ से सामूहिक पशुधन-वर्ग स्वाभाविक हिंदी में व्यक्त हुए हैं। आज्ञा का वाक्य पिछले पद से जुड़ी निरंतरता के अनुरूप क्रियार्थक ‘चढ़ाना’ में रखा गया है।
