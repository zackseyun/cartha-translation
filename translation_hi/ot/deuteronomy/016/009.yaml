  rationale: यह कटाई में प्रयुक्त हँसिए को सूचित करता है; आधुनिक मानक हिंदी में यही सहज और सटीक शब्द है।
- source_word: בַּקָּמָה
  choice: खड़ी फसल पर
  rationale: קָמָה खेत में खड़ी अनाज की फसल को दर्शाता है। ‘हँसिया चलाना’ के साथ ‘पर’ हिंदी में कटाई आरम्भ करने का स्वाभाविक प्रयोग है।
- source_word: תָּחֵל לִסְפֹּר
  choice: गिनना आरम्भ करना
  rationale: Hiphil חלל और ספר के infinitive का संयोजन किसी क्रिया का आरम्भ करने का स्पष्ट निर्देश देता है।
- source_word: שִׁבְעָה שָׁבֻעוֹת
  choice: सात सप्ताह
  rationale: दोहराए गए वाक्यांश को पहले प्रयोग के अनुरूप रखा गया है और पर्व-संबंधी कालगणना का अर्थ स्पष्ट है।
