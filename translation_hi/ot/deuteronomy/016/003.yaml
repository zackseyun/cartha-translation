source:
  edition: WLC
  text: לֹא תֹאכַ֤ל עָלָי/ו֙ חָמֵ֔ץ שִׁבְעַ֥ת יָמִ֛ים תֹּֽאכַל עָלָ֥י/ו מַצּ֖וֹת לֶ֣חֶם עֹ֑נִי כִּ֣י בְ/חִפָּז֗וֹן יָצָ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לְמַ֣עַן תִּזְכֹּר֔ אֶת י֤וֹם צֵֽאתְ/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/003.yaml
  text: You shall not eat leavened bread with it. Seven days you shall eat with it unleavened bread[a], the bread of affliction, because you came out from the land of Egypt in haste, so that you may remember the day of your coming out from the land of Egypt all the days of your life.
translation:
  language: hi
  text: तुम उसके साथ खमीरी रोटी न खाना। सात दिन तक उसके साथ बिना खमीर की रोटी—दुःख की रोटी[a]—खाना, क्योंकि तुम मिस्र देश से जल्दी में निकले थे, ताकि तुम अपने जीवन भर उस दिन को याद रखो, जिस दिन तुम मिस्र देश से निकले थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दीनता की रोटी” अथवा “विपत्ति की रोटी।” इब्रानी पद निर्गमन से जुड़े कष्ट, अभाव या दुःख पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: उसके साथ
  rationale: फसह-बलि के संदर्भ में עַל का भाव साथ में खाए जाने का है; यह अनुवाद स्वाभाविक है और बलि-भोज के संबंध को बनाए रखता है।
- source_word: חָמֵץ
  choice: खमीरी रोटी
  rationale: भोजन के इस संदर्भ में आशय खमीर उठी रोटी से है, न कि केवल खमीर नामक सामग्री से।
- source_word: מַצּוֹת
  choice: अखमीरी रोटी
  rationale: यह पर्व में खाई जाने वाली बिना खमीर की रोटी के लिए प्रचलित, स्पष्ट हिंदी पद है।
- source_word: לֶחֶם עֹנִי
  choice: दुःख की रोटी
  rationale: यह पद कष्ट, दीनता और विपत्ति के अर्थ-क्षेत्र को समेटता है; संक्षिप्त हिंदी अभिव्यक्ति मूल की गंभीरता बनाए रखती है।
- source_word: בְחִפָּזוֹן
  choice: जल्दबाज़ी में
  rationale: यह प्रस्थान की शीघ्रता और हड़बड़ी को बिना अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह मूल के प्रयोजनसूचक भाव को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: תִּזְכֹּר
  choice: याद रखो
  rationale: לְמַעַן के बाद यह अपेक्षित उद्देश्य को व्यक्त करता है; आज्ञात्मक संदर्भ में हिंदी का यह रूप सहज है।
- source_word: יוֹם צֵאתְךָ
  choice: उस दिन को ... जिस दिन तुम ... निकले थे
  rationale: हिंदी में स्वाभाविक संबंधवाचक रचना के द्वारा निर्गमन के विशिष्ट दिन पर मूल का जोर सुरक्षित रहता है।
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: अपने जीवन भर
  rationale: यह आजीवन और निरंतर स्मरण के भाव को संक्षिप्त, स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: निर्गमन-स्मारक के संबंध में לֶחֶם עֹנִי का अर्थ
  choice: दुःख की रोटी
  alternative: दीनता की रोटी; विपत्ति की रोटी
  rationale: यह अनुष्ठानिक भोजन को मिस्र के कष्ट और शीघ्र मुक्ति—दोनों की स्मृति से जोड़ता है, पर अर्थ को केवल आर्थिक गरीबी तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। एकवचन संबोधन को मूल के अनुसार रखा गया है। वाक्य-विन्यास हिंदी की स्वाभाविकता के लिए पुनर्गठित किया गया है, जबकि निषेध, सात दिन, शीघ्र निर्गमन, उद्देश्य और आजीवन स्मरण—सभी तत्व सुरक्षित हैं।
