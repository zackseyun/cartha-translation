base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/005.yaml
  text: You may not sacrifice the Passover in any one of your gates that Yahweh your God is giving you[b][a],
translation:
  language: hi
  text: तुम फसह की बलि[a] अपने किसी भी नगर[b] में न चढ़ाना, जिसे यहोवा, तुम्हारा परमेश्वर, तुम्हें दे रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फसह”; यहाँ इसका अर्थ फसह की बलि अथवा बलि-पशु है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में “अपने किसी भी फाटक में”; ‘फाटक’ यहाँ नगर या बस्ती के लिए प्रयुक्त है।
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: बलि न करना
  rationale: יכולת + धातुरूप यहाँ केवल असमर्थता नहीं, बल्कि व्यवस्था-संबंधी निषेध व्यक्त करता है; हिंदी में निषेधात्मक आज्ञा स्वाभाविक और स्पष्ट है।
- source_word: לִזְבֹּחַ
  choice: बलि करना
  rationale: उपासना-संबंधी प्रसंग में זבח का अर्थ पशु को बलि के रूप में चढ़ाना है; ‘बलि करना’ संक्षिप्त और सामान्य हिंदी है।
- source_word: הַפָּסַח
  choice: फसह-बलि
  rationale: यहाँ क्रिया זבח के कारण פסח से उत्सव की अपेक्षा फसह की बलि/बलि-पशु अभिप्रेत है; मूल पद की अर्थ-सीमा फुटनोट में सुरक्षित रखी गई है।
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: अपनी किसी भी नगरी में
  rationale: व्यवस्थाविवरण में ‘फाटक’ प्रायः लक्षणा से उस नगर या बस्ती को दर्शाता है; हिंदी में ‘नगरी’ अभिप्रेत स्थानीय इकाई को सहज रूप से व्यक्त करती है, जबकि शाब्दिक चित्र फुटनोट में दिया गया है।
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: जिसे तुम्हारा परमेश्वर यहोवा तुम्हें दे रहा है
  rationale: नֹתֵן के कृदन्तीय, जारी अर्थ को ‘दे रहा है’ व्यक्त करता है; יְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से अनूदित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे आया है। हिंदी बाइबल-पाठकों में प्रचलित और पहचाना हुआ रूप ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: הַפָּסַח का आशय
  choice: फसह-बलि
  alternative: फसह / फसह का पशु
  rationale: बलि चढ़ाने की क्रिया इस स्थान पर उत्सव से अधिक उसके बलिदान को सामने लाती है, पर पद की अंतर्निहित अर्थ-व्याप्ति को फुटनोट में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सीधा कानूनी निषेध। एकवचन संबोधन ‘तुम’ से रखा गया है। ‘नगरी’ मूल के ‘फाटक’ की लाक्षणिक स्थानीय इकाई को सहज बनाता है और शाब्दिक रूप फुटनोट में सुरक्षित है।
