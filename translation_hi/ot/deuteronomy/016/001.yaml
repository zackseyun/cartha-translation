source:
  edition: WLC
  text: שָׁמוֹר֙ אֶת חֹ֣דֶשׁ הָ/אָבִ֔יב וְ/עָשִׂ֣יתָ פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּ֞י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֗יב הוֹצִ֨יאֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ מִ/מִּצְרַ֖יִם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/001.yaml
  text: Observe the month of Abib[a], and keep the Passover to Yahweh your God, because in the month of Abib Yahweh your God brought you out from Egypt by night.
translation:
  language: hi
  text: अबीब के महीने[a] का ध्यान रखो और अपने परमेश्वर यहोवा के लिए फसह मनाओ, क्योंकि अबीब के महीने में तुम्हारा परमेश्वर यहोवा तुम्हें रात के समय मिस्र से निकाल लाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अबीब” आरंभिक रूप से पकने वाले अनाज से जुड़े महीने का नाम है; इसका अनुवाद “वसंत का महीना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: ध्यानपूर्वक पालन करना
  rationale: आज्ञार्थक रूप यहाँ पर्व-संबंधी समय-विधान को सावधानी से मानने का निर्देश देता है; यह केवल स्मरण करने का भाव नहीं है। हिंदी में अनुवर्ती आज्ञार्थक क्रियाओं के साथ यह स्वाभाविक आज्ञा बनती है।
- source_word: חֹדֶשׁ הָאָבִיב
  choice: अबीब का महीना
  rationale: אָבִיב आरंभिक पके अनाज की अवस्था और उससे जुड़े ऋतु-काल का बोध करा सकता है, पर इस पर्व-विधान में यह धार्मिक पंचांग के महीने का नाम है; इसलिए नाम को लिप्यंतरित किया गया है।
- source_word: וְעָשִׂיתָ פֶּסַח
  choice: फसह मनाना
  rationale: शाब्दिक अर्थ 'फसह करना/बनाना' है, किंतु यहाँ अभिप्राय पर्व का विधिपूर्वक अनुष्ठान करना है। 'फसह मनाना' आधुनिक हिंदी में स्वाभाविक है और विधिक संदर्भ भी बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל समर्पण या अभिमुखता व्यक्त करता है; पर्व यहोवा के लिए मनाया जाना है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण 'यहोवा' से प्रस्तुत किया गया है।
- source_word: הוֹצִיאֲךָ
  choice: तुम्हें ... निकाल लाया
  rationale: हिफ़ील रूप निर्गमन की प्रचलित अभिव्यक्ति है और सक्रिय रूप से बाहर ले आने का अर्थ देता है।
- source_word: מִמִּצְרַיִם
  choice: मिस्र से
  rationale: निर्गमन के स्थान-स्रोत को सरल और स्पष्ट आधुनिक हिंदी में व्यक्त करता है।
- source_word: לָיְלָה
  choice: रात के समय
  rationale: यह निर्गमन की समय-परिस्थिति बताने वाला क्रियाविशेषणीय प्रयोग है; अनावश्यक रूप से यह तय नहीं किया गया कि पूरी यात्रा रात में संपन्न हुई।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का सीधे प्रयोग करता है। हिंदी पाठक के लिए परिचित 'यहोवा' उस नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: אָבִיב को ऋतु मानना या महीने का नाम
  choice: अबीब को पंचांगीय नाम के रूप में रखना
  alternative: वसंत का महीना
  rationale: पर्व-विधान के इस संदर्भ में पदबंध निर्गमन और फसह से जुड़े निश्चित महीने को बताता है। केवल 'वसंत' कहने से उसकी पंचांगीय विशिष्टता घट जाएगी।
- issue: לָיְלָה का समयगत संबंध
  choice: निर्गमन की घटना को 'रात के समय' बताना
  alternative: रातोंरात / पूरी रात यात्रा करना
  rationale: मूल शब्द रात की समय-परिस्थिति बताता है, पर अपने आप में अवधि या संपूर्ण यात्रा की समय-सीमा निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन संबोधन के अनुरूप 'तुम्हारा/तुम्हें' रखा गया है। संयुक्त आज्ञा को हिंदी में स्वाभाविक बनाने के लिए 'पालन करना ... मनाना' का प्रयोग हुआ है।
