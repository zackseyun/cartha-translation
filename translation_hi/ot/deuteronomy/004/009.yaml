source:
  edition: WLC
  text: רַ֡ק הִשָּׁ֣מֶר לְ/ךָ֩ וּ/שְׁמֹ֨ר נַפְשְׁ/ךָ֜ מְאֹ֗ד פֶּן תִּשְׁכַּ֨ח אֶת הַ/דְּבָרִ֜ים אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וּ/פֶן יָס֨וּרוּ֙ מִ/לְּבָ֣בְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וְ/הוֹדַעְתָּ֥/ם לְ/בָנֶ֖י/ךָ וְ/לִ/בְנֵ֥י בָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/009.yaml
  text: Only guard yourself carefully[a], and keep your soul very carefully, lest you forget the things that your eyes saw and lest they depart from your heart all the days of your life. Make them known to your children and to your children's children[b],
translation:
  language: hi
  text: केवल अपने विषय में चौकस रहना और अपने आपको बहुत संभालकर रखना, कहीं ऐसा न हो कि तुम उन बातों को भूल जाओ जिन्हें तुम्हारी आँखों ने देखा है, और वे तुम्हारे जीवन भर तुम्हारे हृदय[a] से दूर हो जाएँ। उन्हें अपने बच्चों और अपने बच्चों के बच्चों[b] को बताना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘हृदय’; यहाँ इसका अर्थ केवल भावनाएँ नहीं, बल्कि स्मृति, समझ और इच्छा समेत आंतरिक व्यक्तित्व है।
    reason: cultural_note
  - marker: b
    text: या ‘अपने बेटों और अपने बेटों के बेटों।’ इब्रानी के पुल्लिंग बहुवचन शब्द प्रसंग के अनुसार विशेष रूप से बेटों या अधिक व्यापक रूप से बच्चों और वंशजों को सूचित कर सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: बस
  rationale: यह चेतावनी पर प्रबल बल देता है; आधुनिक हिन्दी में ‘बस’ स्वाभाविक ढंग से ‘केवल/सबसे बढ़कर’ का प्रतिबंधात्मक जोर व्यक्त करता है।
- source_word: הִשָּׁמֶר לְךָ וּשְׁמֹר נַפְשְׁךָ מְאֹד
  choice: अपनी चौकसी करना और अपने आप पर बहुत ध्यान रखना
  rationale: दोनों समान आज्ञाओं की पुनरावृत्ति चेतावनी को तीव्र करती है। यहाँ נֶפֶשׁ संपूर्ण व्यक्ति को सूचित करता है; इसलिए ‘प्राण/आत्मा’ की संकीर्ण धारणा आरोपित किए बिना ‘अपने आप’ कहा गया है।
- source_word: פֶּן תִּשְׁכַּח
  choice: कहीं ऐसा न हो कि ... भूल जाओ
  rationale: פֶּן से आने वाली नकारात्मक आशंका और चेतावनी को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: הַדְּבָרִים אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: जो बातें तुम्हारी आँखों ने देखी हैं
  rationale: דְּבָרִים यहाँ दिखाई देने वाली घटनाओं या बातों को सूचित करता है; ‘तुम्हारी आँखों ने’ प्रत्यक्ष साक्ष्य पर इब्रानी बल को बनाए रखता है।
- source_word: וּפֶן יָסוּרוּ מִלְּבָבְךָ
  choice: और वे ... तुम्हारे हृदय से दूर हो जाएँ
  rationale: סור के दूर होने के रूपक और לֵב के आंतरिक व्यक्ति-संबंधी अर्थ को बिना केवल ‘मन’ या ‘स्मृति’ तक सीमित किए रखा गया है।
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: जीवन भर
  rationale: इब्रानी मुहावरे ‘तुम्हारे जीवन के सब दिन’ का संक्षिप्त और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: וְהוֹדַעְתָּם
  choice: उन्हें ... बताना
  rationale: ידע के हिफ़ील रूप का अर्थ ‘ज्ञात कराना’ है; ‘बताना’ हिन्दी में उसी अर्थ का सहज आदेश है और ‘सिखाना’ जैसी अतिरिक्त व्याख्या से बचता है।
- source_word: לְבָנֶיךָ וְלִבְנֵי בָנֶיךָ
  choice: अपने बच्चों और अपने बच्चों के बच्चों को
  rationale: בָּנִים संदर्भ में संतान को व्यापक रूप से सूचित कर सकता है। यह रूप पीढ़ी-दर-पीढ़ी संरचना को भी सुरक्षित रखता है।
theological_decisions:
- issue: נֶפֶשׁ का मानवशास्त्रीय अर्थ
  choice: अपने आप
  alternative: अपने प्राण / अपनी आत्मा
  rationale: इस चेतावनी में נֶפֶשׁ पूरे व्यक्ति या स्वयं को सूचित करता है। ‘अपने आप’ किसी विशिष्ट देह-आत्मा विभाजन को आरोपित किए बिना आज्ञा का आशय देता है।
- issue: לֵב का अर्थ-क्षेत्र
  choice: हृदय
  alternative: मन / स्मृति
  rationale: ‘हृदय’ मूल रूपक और उसकी व्यापकता—स्मृति, समझ, इच्छा तथा आंतरिक जीवन—को बनाए रखता है; केवल ‘मन’ या ‘स्मृति’ कहना अर्थ को संकरा कर देता।
- issue: בָנֶיךָ में व्याकरणिक लिंग
  choice: बच्चों
  alternative: बेटों
  rationale: वाचा-संबंधी स्मृति को अगली पीढ़ियों तक पहुँचाने के इस प्रसंग में पुल्लिंग बहुवचन संतान का व्यापक प्रतिनिधित्व कर सकता है; केवल पुत्रों तक सीमित करना आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। इब्रानी का एकवचन संबोधन हिन्दी के सम्मानजनक और सामान्य ‘तुम’ रूप से व्यक्त किया गया है। चेतावनी की पुनरावृत्ति और ‘हृदय’ का मूल रूपक सुरक्षित हैं।
