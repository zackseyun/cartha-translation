  edition: WLC
  text: א֣וֹ הֲ/נִסָּ֣ה אֱלֹהִ֗ים לָ֠/בוֹא לָ/קַ֨חַת ל֣/וֹ גוֹי֮ מִ/קֶּ֣רֶב גּוֹי֒ בְּ/מַסֹּת֩ בְּ/אֹתֹ֨ת וּ/בְ/מוֹפְתִ֜ים וּ/בְ/מִלְחָמָ֗ה וּ/בְ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/מוֹרָאִ֖ים גְּדֹלִ֑ים כְּ֠/כֹל אֲשֶׁר עָשָׂ֨ה לָ/כֶ֜ם יְהוָ֧ה אֱלֹהֵי/כֶ֛ם בְּ/מִצְרַ֖יִם לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/034.yaml
  text: Or has any god ever attempted to go and take for himself a nation from the midst of another nation[a], by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that Yahweh your God did for you in Egypt before your eyes?
translation:
  language: hi
  text: या क्या कभी किसी देवता ने जाकर अपने लिए एक जाति को दूसरी जाति के बीच से परीक्षाओं, चिन्हों, अद्भुत कामों, युद्ध, शक्तिशाली हाथ, फैलाई हुई भुजा और बड़े भयावह कामों[a] के द्वारा निकाल लेने का प्रयत्न किया है—जैसा तुम्हारे परमेश्वर यहोवा ने मिस्र में तुम्हारी आँखों के सामने तुम्हारे लिए किया?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बड़े विस्मयकारी काम” अथवा “भय उत्पन्न करनेवाले बड़े कृत्य।” इब्रानी अभिव्यक्ति ऐसे कामों की ओर संकेत करती है जो भय और विस्मय उत्पन्न करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִסָּה
  choice: क्या कभी ... प्रयत्न किया है
  rationale: נסה यहाँ ‘परखना’ नहीं, बल्कि किसी कार्य को करने का प्रयत्न करना दर्शाता है। आलंकारिक प्रश्न इस कार्य की अभूतपूर्वता पर बल देता है, संभावित विफलता पर नहीं।
- source_word: אֱלֹהִים
  choice: किसी देवता
  rationale: इस आलंकारिक तुलना में शब्द किसी भी देवता के अर्थ में है; ‘देवता’ इसे आगे आने वाले ‘तुम्हारे परमेश्वर यहोवा’ से स्पष्ट रूप से अलग रखता है।
- source_word: לָבוֹא לָקַחַת
  choice: जाकर ... निकाल लेने
  rationale: दोनों क्रियाएँ उद्देश्यपूर्ण हस्तक्षेप और अपने लिए ग्रहण करने को व्यक्त करती हैं। संदर्भ में लोगों को दूसरी जाति के बीच से बाहर ले आना निहित है, इसलिए ‘निकाल लेने’ स्वाभाविक और अर्थानुकूल है।
- source_word: גּוֹי מִקֶּרֶב גּוֹי
  choice: एक जाति को दूसरी जाति के बीच से
  rationale: यह इब्रानी की प्रभावशाली पुनरुक्ति और एक राजनीतिक समुदाय के भीतर से दूसरे समुदाय को निकालने की छवि बनाए रखता है।
- source_word: בְּמַסֹּת
  choice: परीक्षाओं के द्वारा
  rationale: यह मिस्र में घटित परखने वाले न्यायपूर्ण कृत्यों या घटनाओं को सूचित करता है; आधुनिक हिन्दी में ‘परीक्षाएँ’ इस व्यापक अर्थ को रखता है।
- source_word: בְּאֹתֹת וּבְמוֹפְתִים
  choice: चिन्हों और अद्भुत कामों के द्वारा
  rationale: ‘चिन्ह’ אותות का प्रचलित समतुल्य है और ‘अद्भुत काम’ מופתים के असाधारण, विस्मयकारी चरित्र को सहज हिन्दी में व्यक्त करता है।
- source_word: וּבְמִלְחָמָה
  choice: युद्ध के द्वारा
  rationale: एकवचन संज्ञा को रखते हुए यह निर्गमन में मिस्र पर विजय के युद्धात्मक पक्ष को व्यक्त करता है।
- source_word: וּבְיָד חֲזָקָה
  choice: सामर्थी हाथ के द्वारा
  rationale: निर्गमन से जुड़ी स्थिर देहात्मक छवि को बनाए रखते हुए ‘सामर्थी’ दिव्य शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: बढ़ाई हुई भुजा के द्वारा
  rationale: यह मूल की स्थिर निर्गमन-अभिव्यक्ति और हस्तक्षेप के लिए फैली हुई भुजा की छवि को सुरक्षित रखता है।
- source_word: וּבְמוֹרָאִים גְּדֹלִים
  choice: बड़े भयावह कामों के द्वारा
  rationale: यह उन कृत्यों को दर्शाता है जो भय और विस्मय उत्पन्न करते हैं। ‘कामों’ को जोड़ना हिन्दी में अर्थ स्पष्ट करता है, जबकि वैकल्पिक अर्थ फुटनोट में सुरक्षित है।
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: जैसा ... ने ... किया
  rationale: तुलना को इस्राएल के ऐतिहासिक अनुभव से सीधे जोड़ता है; वाक्य में सूची की समग्रता पहले से स्पष्ट है।
theological_decisions:
- issue: आलंकारिक तुलना में אֱלֹהִים का संदर्भ
  choice: किसी देवता
  alternative: परमेश्वर
  rationale: पहला खंड किसी भी कथित देवता से यहोवा के अद्वितीय छुटकारे के काम की तुलना करता है। ‘किसी देवता’ इस वादात्मक बल को सुरक्षित रखता है।
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला व्यक्तिवाचक रूप है और यहाँ नाम को सामान्य उपाधि ‘परमेश्वर’ से अलग बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की लंबी आलंकारिक प्रश्न-संरचना तथा साधनसूचक क्रम को बनाए रखा गया है; अत्यधिक पुनरावृत्ति से बचने के लिए ‘के द्वारा’ को सूची के अंतिम पद पर व्याकरणतः समेकित रूप में समझा जा सकता है, यद्यपि पाठ में प्रमुख पदों के साथ स्पष्ट किया गया है।
