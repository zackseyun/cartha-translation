id: DEU.4.28
reference: Deuteronomy 4:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/עֲבַדְתֶּם שָׁ֣ם אֱלֹהִ֔ים מַעֲשֵׂ֖ה יְדֵ֣י אָדָ֑ם עֵ֣ץ וָ/אֶ֔בֶן אֲשֶׁ֤ר לֹֽא יִרְאוּ/ן֙ וְ/לֹ֣א יִשְׁמְע֔וּ/ן וְ/לֹ֥א יֹֽאכְל֖וּ/ן וְ/לֹ֥א יְרִיחֻֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/028.yaml
  text: And there you will serve gods[a], the work of human hands, wood and stone, which neither see nor hear nor eat nor smell.
translation:
  language: hi
  text: और वहाँ तुम मनुष्यों के हाथों से बनाए हुए लकड़ी और पत्थर के देवताओं[a] की सेवा करोगे, जो न देखते हैं, न सुनते हैं, न खाते हैं और न सूँघते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देवमूर्तियों।”
    reason: संदर्भगत वैकल्पिक अनुवाद; मूल शब्द का सीधा अर्थ ‘देवता’ है, पर मानव-निर्मित लकड़ी और पत्थर के वर्णन के कारण यहाँ देवमूर्तियाँ अभिप्रेत हैं।
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: तुम सेवा करोगे
  rationale: עבד का अर्थ यहाँ देवताओं की धार्मिक सेवा या उपासना करना है। चेतावनी के भविष्यसूचक संदर्भ में भविष्यकाल स्वाभाविक है।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह आसपास के संदर्भ में निर्वासन के देशों की ओर संकेत करने वाला स्थानवाचक क्रियाविशेषण है।
- source_word: אֱלֹהִים
  choice: देवताओं
  rationale: यहाँ बहुवचन रूप झूठे देवताओं को सूचित करता है। ‘मूर्तियों’ की अपेक्षा ‘देवताओं’ से मूल शब्द का सीधा अर्थ सुरक्षित रहता है; मानव-निर्मित होने की बात अगला वाक्यांश स्पष्ट करता है।
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: मनुष्य के हाथों की बनाई हुई
  rationale: यह पदबंध मानव-निर्माण पर बल देता है। हिंदी में यह रूप अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֵץ וָאֶבֶן
  choice: लकड़ी और पत्थर की वस्तुएँ
  rationale: संदर्भ में ये मूर्तियों की निर्माण-सामग्री हैं। ‘वस्तुएँ’ जोड़ने से हिंदी वाक्य में मानव-निर्मित देवताओं के साथ संबंध स्पष्ट होता है।
- source_word: אֲשֶׁר לֹא יִרְאוּן וְלֹא יִשְׁמְעוּן וְלֹא יֹאכְלוּן וְלֹא יְרִיחֻן
  choice: जो न देखते हैं, न सुनते हैं, न खाते हैं और न सूँघते हैं
  rationale: हर इब्रानी निषेध को अलग रखते हुए मूल की लय और मूर्तियों की निर्जीवता पर किए गए व्यंग्य को सुरक्षित रखा गया है; ‘नहीं कर सकते’ कहकर सामर्थ्य की व्याख्या नहीं जोड़ी गई।
- source_word: יְרִיחֻן
  choice: सूँघते हैं
  rationale: यहाँ हिफ़ील रूप का संदर्भगत अर्थ गंध ग्रहण करना है; ‘सूँघना’ आधुनिक हिंदी में सीधा और सुबोध है।
theological_decisions:
- issue: אֱלֹהִים को झूठे देवताओं या मूर्तियों के रूप में प्रस्तुत करना
  choice: देवताओं
  alternative: मूर्तियों
  rationale: ‘देवताओं’ मूल का शाब्दिक बहुवचन अर्थ बनाए रखता है, जबकि अगले पदबंध से स्पष्ट होता है कि वे मनुष्य के बनाए हुए निर्जीव देवता हैं।
- issue: इंद्रिय-क्रियाओं के निषेध को असमर्थता के रूप में व्यक्त करना
  choice: न देखते हैं, न सुनते हैं, न खाते हैं और न सूँघते हैं
  alternative: न देख सकते हैं, न सुन सकते हैं, न खा सकते हैं और न सूँघ सकते हैं
  rationale: इब्रानी पाठ प्रत्यक्षतः क्रियाओं का निषेध करता है। चुना हुआ रूप मूल संरचना को बनाए रखता है और उसकी निहित असमर्थता को पाठक पर छोड़ता है।
- issue: אָדָם के सामान्य मानवीय अर्थ का अनुवाद
  choice: मनुष्य के हाथों
  alternative: आदमी के हाथों
  rationale: यहाँ אָדָם किसी विशेष पुरुष को नहीं, मानव जाति को सामान्य रूप से सूचित करता है; ‘मनुष्य’ गरिमापूर्ण और सामान्य अर्थ वाला हिंदी रूप है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सरल किंतु गरिमापूर्ण रखी गई है। चार निषेधों की आवृत्ति मूल इब्रानी की लय और निर्जीव देवताओं पर उसके प्रहार को बनाए रखती है।
