  terminology: '''देवताओं'' suitably preserves אֱלֹהִים without prematurely replacing it with the more interpretive ''मूर्तियों.'' ''मनुष्यों के हाथों से बनाए हुए'' naturally conveys the generic human agency of מַעֲשֵׂה יְדֵי אָדָם. The retained footnote supplies the contextual alternative.'
  issues:
