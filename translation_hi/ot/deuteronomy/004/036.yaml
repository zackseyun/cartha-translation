base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/036.yaml
  text: From heaven he made you hear his voice to discipline you[a], and on earth he showed you his great fire[b], and you heard his words from the midst of the fire.
translation:
  language: hi
  text: आकाश से उसने तुम्हें अपनी आवाज़ सुनाई, तुम्हें अनुशासित करने के लिए[a]; और पृथ्वी पर उसने तुम्हें अपनी प्रचंड आग दिखाई, और तुमने आग के बीच से उसके वचन सुने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हें शिक्षा दे” या “तुम्हारी ताड़ना करे”; इब्रानी क्रिया में सुधारात्मक और निर्माणकारी अनुशासन, दोनों के भाव समाए हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  choice: आकाश से
  rationale: यह इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है और आगे के ‘पृथ्वी पर’ के साथ स्थानगत विरोध बनाए रखता है।
- source_word: הִשְׁמִיעֲךָ אֶת קֹלוֹ
  choice: उसने तुम्हें अपनी आवाज़ सुनाई
  rationale: हिफ़ईल का कारणवाचक भाव ‘सुनाई’ में स्वाभाविक और स्पष्ट रूप से व्यक्त होता है; ‘आवाज़’ ईश्वरीय वाणी के श्रव्य रूप को बनाए रखती है।
- source_word: לְיַסְּרֶךָּ
  choice: ताकि वह तुम्हें अनुशासित करे
  rationale: יסר में सुधार, ताड़ना और शिक्षण—इन सबका निर्माणकारी भाव हो सकता है। ‘अनुशासित करे’ इस व्यापकता को अनावश्यक कठोरता के बिना व्यक्त करता है।
- source_word: וְעַל הָאָרֶץ
  choice: और पृथ्वी पर
  rationale: ‘आकाश से’ के साथ ब्रह्मांडीय विरोध को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הֶרְאֲךָ אֶת אִשּׁוֹ הַגְּדוֹלָה
  choice: उसने तुम्हें अपनी बड़ी आग दिखाई
  rationale: कारणवाचक क्रिया का स्वाभाविक हिन्दी रूप ‘दिखाई’ है; ‘बड़ी आग’ मूल के ठोस और प्रबल चित्र को बिना विस्तार के सुरक्षित रखती है।
- source_word: וּדְבָרָיו שָׁמַעְתָּ
  choice: तुमने ... उसके वचन सुने
  rationale: मूल में बहुवचन स्पष्ट है। ‘वचन’ गरिमापूर्ण होते हुए भी आधुनिक धार्मिक हिन्दी में सहज है और व्यक्त कथनों को दर्शाता है।
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: आग के बीच से
  rationale: מִתּוֹךְ के ‘भीतर/मध्य से’ अर्थ को संक्षिप्त, स्वाभाविक और चित्रात्मक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: לְיַסְּרֶךָּ में ईश्वरीय शिक्षण और सुधार का प्रयोजन
  choice: ताकि वह तुम्हें अनुशासित करे
  alternative: ताकि वह तुम्हें शिक्षा दे / तुम्हारी ताड़ना करे
  rationale: मूल क्रिया केवल दंड या केवल बौद्धिक शिक्षा तक सीमित नहीं है। मुख्य पाठ व्यापक निर्माणकारी-सुधारात्मक अर्थ रखता है और पादटिप्पणी वास्तविक विकल्प बताती है।
- issue: ईश्वरीय आत्म-प्रकाशन की ठोस भाषा
  choice: अपनी आवाज़ ... अपनी बड़ी आग ... उसके वचन
  alternative: अमूर्त व्याख्यात्मक भाषा
  rationale: मूल के मानव-सदृश और दृश्य-श्रव्य शब्दों को नरम या अमूर्त किए बिना बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘अनुशासित करे’ के संभावित व्यापक अर्थ को पादटिप्पणी में खोला गया है। ‘आकाश से’ और ‘पृथ्वी पर’ का विरोध तथा ‘आग के बीच से’ की ठोस छवि सुरक्षित रखी गई है।
