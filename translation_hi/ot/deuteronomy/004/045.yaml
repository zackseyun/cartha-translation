revisions:
- from: ये वे साक्षियाँ, विधियाँ और न्याय-विधान हैं, जो मूसा ने इस्राएल के पुत्रों[a] से उस समय कहे, जब वे मिस्र से निकले थे।
  to: ये वे साक्षियाँ, विधियाँ और न्याय-विधान हैं जिन्हें मूसा ने इस्राएल के पुत्रों[a] को उस समय सुनाए, जब वे मिस्र से निकले थे।
  rationale: The revision corrects the recipient relation expressed by Hebrew אֶל and makes the sentence natural in modern Hindi. ‘सुनाए’ is an idiomatic formal rendering for Moses’ communicating these legal stipulations, without adding a doctrinal or overly specific sense. The legal categories and the literal ethnonym are retained.
