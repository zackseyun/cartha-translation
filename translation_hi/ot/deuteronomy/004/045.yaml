review_pass:
  verdict: revise
  source_fidelity: The three legal categories, Moses as speaker, the temporal clause, and the departure from Egypt are retained. However, the draft's ‘इस्राएल के पुत्रों से ... कहे’ does not clearly express the Hebrew recipient marked by אֶל (‘to’); it can instead suggest that Moses spoke with them.
  naturalness: ‘ये वे’ is understandable but slightly stilted here. More importantly, legal categories are not naturally ‘कहे’ to a recipient with ‘से’. ‘सुनाए’ is idiomatic Hindi for communicating such stipulations publicly while retaining the basic speech act.
  terminology: ‘साक्षियाँ,’ ‘विधियाँ,’ and ‘न्याय-विधान’ preserve the distinctions among עֵדוֹת, חֻקִּים, and מִשְׁפָּטִים in a formal modern Hindi register. ‘इस्राएल के पुत्र’ retains the source expression, with idiomatic ethnonym alternatives in the footnote.
  issues:
  - severity: medium
    issue: Recipient construction ‘इस्राएल के पुत्रों से’
    rationale: The Hebrew אֶל בְּנֵי יִשְׂרָאֵל means ‘to the sons of Israel.’ In this Hindi sentence, ‘से’ is ambiguous and does not naturally mark them as the recipients of the legal material. Recasting with ‘को सुनाए’ clearly conveys the relation.
  revised_text: ये वे साक्षियाँ, विधियाँ और न्याय-विधान हैं जिन्हें मूसा ने इस्राएल के पुत्रों[a] को उस समय सुनाए, जब वे मिस्र से निकले थे।
