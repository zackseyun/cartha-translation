lexical_decisions:
- source_word: הָעֵדֹת
  choice: साक्षियाँ
  rationale: यह शब्द वाचा से जुड़ी उन बातों को सूचित करता है जो साक्षी या प्रमाण का काम करती हैं। ‘साक्षियाँ’ मूल शब्द की विशिष्ट अर्थ-छाया को बनाए रखता है और इसे सामान्य ‘आज्ञाओं’ में नहीं मिला देता।
- source_word: הַחֻקִּים
  choice: विधियाँ
  rationale: कानूनी संदर्भ में निर्धारित नियमों या विधानों के लिए यह स्वाभाविक और गरिमापूर्ण हिन्दी शब्द है।
- source_word: הַמִּשְׁפָּטִים
  choice: न्याय-विधान
  rationale: यह न्यायिक निर्णयों और लागू कानूनी नियमों का भाव व्यक्त करता है तथा ‘विधियाँ’ से इस श्रेणी का अंतर भी बनाए रखता है।
- source_word: אֲשֶׁר דִּבֶּר
  choice: जो मूसा ने … से … कहे
  rationale: दבר के साधारण वाणी-संबंधी अर्थ को सुरक्षित रखा गया है; ‘घोषित किए’ जैसे अधिक औपचारिक भाव को अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पद का निकट और पारदर्शी अनुवाद है; यहाँ यह समूचे इस्राएली समुदाय का जातीय-वाचक नाम है। अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: उस समय … जब वे मिस्र से निकले थे
