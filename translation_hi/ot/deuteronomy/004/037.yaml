source:
  edition: WLC
  text: וְ/תַ֗חַת כִּ֤י אָהַב֙ אֶת אֲבֹתֶ֔י/ךָ וַ/יִּבְחַ֥ר בְּ/זַרְע֖/וֹ אַחֲרָ֑י/ו וַ/יּוֹצִֽאֲ/ךָ֧ בְּ/פָנָ֛י/ו בְּ/כֹח֥/וֹ הַ/גָּדֹ֖ל מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/037.yaml
  text: And because he loved your fathers and chose their offspring after them[a], he brought you out of Egypt by his presence[b], by his great power.
translation:
  language: hi
  text: और क्योंकि उसने तुम्हारे पूर्वजों से प्रेम किया और उनके बाद उनके वंश को चुना,[a] इसलिए वह अपनी उपस्थिति से अपने महान सामर्थ्य के द्वारा तुम्हें मिस्र से बाहर ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके बाद उसके वंश को।” इब्रानी में प्रत्यय एकवचन हैं; सम्भवतः “तुम्हारे पूर्वजों” को एक सामूहिक इकाई माना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת כִּי
  choice: और क्योंकि ... इसलिए
  rationale: यह इब्रानी पदबंध कारण बताता है। हिन्दी में ‘क्योंकि ... इसलिए’ कारण और परिणाम का संबंध स्वाभाविक तथा स्पष्ट बनाता है।
- source_word: אָהַב אֶת אֲבֹתֶיךָ
  choice: उसने तुम्हारे पूर्वजों से प्रेम किया
  rationale: ‘पूर्वज’ आधुनिक हिन्दी में अֲבֹתֶיךָ का स्वाभाविक सामूहिक अर्थ देता है; ‘प्रेम किया’ क्रिया का सीधा अनुवाद है।
- source_word: וַיִּבְחַר בְּזַרְעוֹ אַחֲרָיו
  choice: उनके बाद उनके वंश को चुना
  rationale: זֶרַע के सामूहिक अर्थ को ‘वंश’ व्यक्त करता है। इब्रानी प्रत्यय एकवचन हैं, पर निकटवर्ती बहुवचन ‘पूर्वजों’ को सामूहिक रूप से संदर्भित करते हैं; मूल रूप को पादटिप्पणी में रखा गया है।
- source_word: וַיּוֹצִאֲךָ
  choice: तुम्हें ... बाहर ले आया
  rationale: हिफ़ील रूप किसी को बाहर निकालने या ले आने का कारणात्मक अर्थ देता है और निर्गमन की भाषा के अनुरूप है।
- source_word: בְּפָנָיו
  choice: स्वयं अपनी उपस्थिति में
  rationale: शाब्दिक अर्थ ‘अपने मुख के साथ/अपने सामने’ है। प्रसंग में परमेश्वर की निजी और प्रत्यक्ष उपस्थिति का भाव है; ‘स्वयं’ इस बात को स्पष्ट करता है कि वही कार्यकारी है, जबकि पादटिप्पणी शाब्दिक विकल्प बचाती है।
- source_word: בְּכֹחוֹ הַגָּדֹל
  choice: अपने महान सामर्थ्य से
  rationale: כֹּחַ का अर्थ शक्ति या सामर्थ्य है और בְּ यहाँ साधन बताता है। ‘महान सामर्थ्य से’ गरिमापूर्ण तथा सहज हिन्दी है।
- source_word: מִמִּצְרָיִם
  choice: मिस्र से बाहर
  rationale: יצא के कारणात्मक रूप के साथ यह मिस्र से बाहर लाने का स्पष्ट निर्गमन-अर्थ देता है।
theological_decisions:
- issue: ‘उसके बाद उसके वंश’ में सामूहिक-एकवचन प्रत्यय
  choice: उनके बाद उनके वंश
  alternative: उसके बाद उसके वंश
  rationale: इब्रानी में प्रत्यय एकवचन हैं, जबकि पूर्वपद ‘तुम्हारे पूर्वजों’ बहुवचन है और सम्भवतः सामूहिक इकाई माना गया है। मुख्य पाठ में स्वाभाविक हिन्दी बहुवचन रखा गया है, और रूपगत अस्पष्टता पादटिप्पणी में संरक्षित है।
- issue: בְּפָנָיו का अर्थ
  choice: स्वयं अपनी उपस्थिति में
  alternative: अपने मुख के साथ; अपने सामने
  rationale: पदबंध परमेश्वर की अपनी प्रत्यक्ष उपस्थिति को व्यक्त कर सकता है। मुख्य पाठ इस प्रसंगगत भाव को पठनीय हिन्दी में देता है, पर शाब्दिक संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। एकवचन ‘तुम्हारे/तुम्हें’ से इब्रानी के दूसरे पुरुष एकवचन संबोधन को सुरक्षित रखा गया है।
