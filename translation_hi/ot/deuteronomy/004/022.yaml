  text: כִּ֣י אָנֹכִ֥י מֵת֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את אֵינֶ֥/נִּי עֹבֵ֖ר אֶת הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֙ עֹֽבְרִ֔ים וִֽ/ירִשְׁתֶּ֕ם אֶת הָ/אָ֥רֶץ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/022.yaml
  text: For I am dying in this land[a]; I am not crossing the Jordan[b], but you are crossing over and will take possession of this good land.
translation:
  language: hi
  text: क्योंकि मैं इस देश में मरने वाला हूँ[a]; मैं यरदन को पार नहीं करूँगा, परन्तु तुम उसे पार करोगे और इस अच्छे देश पर अधिकार करोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं इस देश में मरूँगा।” इब्रानी कृदन्त निकट भविष्य में होने वाली क्रिया व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “इस अच्छे देश को विरासत में पाओगे।” इब्रानी क्रिया विरासत के रूप में भूमि प्राप्त करने और उस पर अधिकार करने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के कारण को प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָנֹכִי מֵת
  choice: मैं ... मरने वाला हूँ
  rationale: स्वतंत्र सर्वनाम का बल ‘मैं’ और आगे के ‘तुम’ के विरोध से उभरता है; कृदन्त निकट भविष्य में होने वाली मृत्यु दर्शाता है।
- source_word: בָּאָרֶץ הַזֹּאת
  choice: इसी देश में
  rationale: ‘इसी’ वक्ता के वर्तमान स्थान पर बल देता है; ‘देश’ यहाँ यरदन के पूर्व की उस भूमि के लिए स्वाभाविक हिन्दी है जहाँ मूसा की मृत्यु होगी।
- source_word: אֵינֶנִּי עֹבֵר אֶת הַיַּרְדֵּן
  choice: मैं यरदन पार नहीं करूँगा
  rationale: नकार और कृदन्त निकट भविष्य में निश्चित रूप से न होने वाली क्रिया बताते हैं; हिन्दी में भविष्यकाल अधिक स्वाभाविक है। नदी का नाम ‘यरदन’ पर्याप्त स्पष्ट है।
- source_word: וְאַתֶּם עֹבְרִים
  choice: परन्तु तुम पार जाओगे
  rationale: वाव यहाँ मूसा और इस्राएल की विपरीत स्थितियों को जोड़ता है; ‘परन्तु’ उस विरोध को स्पष्ट करता है और भविष्यकाल प्रसंगानुकूल है।
- source_word: וִירִשְׁתֶּם
  choice: अधिकार कर लोगे
  rationale: यरश भूमि को विरासत के रूप में प्राप्त करके उस पर अधिकार स्थापित करने का अर्थ दे सकता है; यह हिन्दी अभिव्यक्ति क्रियाशील अर्थ बनाए रखती है।
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: इस अच्छे देश
  rationale: विशेषण और संकेतवाचक दोनों सुरक्षित रहते हैं; ‘अच्छा देश’ व्यवस्थाविवरण की मूल्यांकनात्मक भाषा को बिना अनावश्यक विशेषीकरण के रखता है।
theological_decisions:
- issue: יִרַשׁ का भूमि-वाचा सम्बन्धी अर्थ
  choice: अधिकार कर लोगे
  alternative: विरासत में पाओगे
  rationale: मूल क्रिया विरासत और अधिकार ग्रहण—दोनों भाव रख सकती है। मुख्य पाठ में भूमि पर अधिकार करने का गतिशील अर्थ रखा गया है और पादटिप्पणी में विरासत का भाव सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। ‘परन्तु’ मूसा और इस्राएल के बीच मूल पाठ का स्पष्ट विरोध बनाए रखता है। निकट भविष्य के इब्रानी कृदन्तों को स्वाभाविक हिन्दी भविष्य और ‘मरने वाला हूँ’ से व्यक्त किया गया है।
