reference: Deuteronomy 4:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִשָּׁמְר֣וּ לָ/כֶ֗ם פֶּֽן תִּשְׁכְּחוּ֙ אֶת בְּרִ֤ית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר כָּרַ֖ת עִמָּ/כֶ֑ם וַ/עֲשִׂיתֶ֨ם לָ/כֶ֥ם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/023.yaml
  text: Watch yourselves[a], lest you forget the covenant of Yahweh your God that he made with you, and make for yourselves a carved image, the likeness of anything that Yahweh your God has commanded you not to make.
translation:
  language: hi
  text: सावधान रहो कि तुम अपने परमेश्वर यहोवा की उस वाचा को न भूल जाओ, जो उसने तुम्हारे साथ बाँधी है, और अपने लिए किसी भी वस्तु के स्वरूप वाली कोई तराशी हुई प्रतिमा न बना लो, जिसे बनाने से तुम्हारे परमेश्वर यहोवा ने तुम्हें मना किया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “जिसकी आज्ञा तुम्हारे परमेश्वर यहोवा ने तुम्हें दी है।” यहाँ निषेध प्रसंग से निहित है; व्यवस्थाविवरण 4:16 से तुलना करें।'
    reason: अंतिम उपवाक्य में निहित नकार और शाब्दिक पाठांतर को दर्ज करना।
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: सावधान रहो
  rationale: निफ़अल आज्ञार्थक और לָכֶם मिलकर स्वयं को सचेत रखने की चेतावनी देते हैं। ‘सावधान रहो’ आधुनिक हिन्दी में स्वाभाविक और गंभीर है।
- source_word: פֶּן תִּשְׁכְּחוּ
  choice: कि तुम ... न भूल जाओ
  rationale: פֶּן आशंकित और निषिद्ध परिणाम प्रस्तुत करता है; हिन्दी में ‘सावधान रहो कि ... न’ इसका स्वाभाविक रूप है।
- source_word: בְּרִית
  choice: वाचा
  rationale: परमेश्वर और इस्राएल के बंधन के लिए ‘वाचा’ स्थापित बाइबलीय शब्द है और साधारण समझौते से अधिक गहरा संबंध व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय व्यक्त करता है।
- source_word: אֲשֶׁר כָּרַת עִמָּכֶם
  choice: जो उसने तुम्हारे साथ बाँधी है
  rationale: כרת ברית का शाब्दिक अर्थ ‘वाचा काटना’ है, पर हिन्दी में ‘वाचा बाँधना’ अर्थ को स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: और अपने लिए ... न बना लो
  rationale: ‘अपने लिए’ לָכֶם के आत्मलाभार्थक बल को बनाए रखता है; ‘बना लो’ चेतावनी के प्रवाह में स्वाभाविक है।
- source_word: פֶּסֶל
  choice: खुदी हुई मूर्ति
  rationale: यह शब्द गढ़ी या तराशी गई प्रतिमा को सूचित करता है। ‘खुदी हुई मूर्ति’ ठोस अर्थ को बनाए रखती है, जबकि केवल ‘मूर्ति’ कुछ विशिष्टता खो देती है।
- source_word: תְּמוּנַת כֹּל
  choice: किसी भी वस्तु के स्वरूप की
  rationale: תְּמוּנָה रूप, समानता या प्रतिरूप को व्यक्त करता है; यह अनुवाद किसी भी दृश्य प्रतिनिधित्व की व्यापकता बनाए रखता है।
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ
  choice: जिसे बनाने से तुम्हारे परमेश्वर यहोवा ने तुम्हें मना किया है
  rationale: मसोराई पाठ में नकार स्पष्ट रूप से नहीं है, किंतु निकट संदर्भ, विशेषकर 4:16, निषेध को अनिवार्य बनाता है। हिन्दी में निषेध स्पष्ट करने से उलटा अर्थ निकलने से बचता है।
theological_decisions:
- issue: अंतिम संबंधवाचक उपवाक्य में निहित निषेध
  choice: ‘जिसे बनाने से ... मना किया है’ के रूप में निषेध स्पष्ट किया गया।
  alternative: ‘जिसकी आज्ञा तुम्हारे परमेश्वर यहोवा ने तुम्हें दी है’ जैसा अधिक रूपात्मक अनुवाद, जिसमें निषेध संदर्भ पर छोड़ दिया जाए।
  rationale: इब्रानी में व्यक्त नकार नहीं है, इसलिए पाठगत स्थिति को पादटिप्पणी में बताया गया है। फिर भी शाब्दिक हिन्दी से यह भ्रामक अर्थ निकल सकता है कि यहोवा ने मूर्ति बनाने की आज्ञा दी थी। व्यवस्थाविवरण 4:16 और पूरे प्रसंग के आधार पर निहित निषेध को मुख्य पाठ में व्यक्त करना अर्थ-समानता के अनुकूल है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर चेतावनी का स्वर रखा गया है। बहुवचन संबोधन ‘तुम’ पूरे वाक्य में स्वाभाविक रूप से बनाए रखा गया है; इब्रानी के अंतिम एकवचन प्रत्यय को हिन्दी में अलग दिखाने से अनावश्यक असंगति आती। ‘यहोवा’ को व्यक्तिगत दिव्य नाम के रूप में रखा गया है।
