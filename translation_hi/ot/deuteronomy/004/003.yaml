reference: Deuteronomy 4:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֵ֛ת אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה בְּ/בַ֣עַל פְּע֑וֹר כִּ֣י כָל הָ/אִ֗ישׁ אֲשֶׁ֤ר הָלַךְ֙ אַחֲרֵ֣י בַֽעַל פְּע֔וֹר הִשְׁמִיד֛/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/קִּרְבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/003.yaml
  text: Your own eyes have seen what Yahweh did at Baal-peor[a], for every man who went after Baal-peor, Yahweh your God destroyed from your midst.
translation:
  language: hi
  text: तुमने अपनी आँखों से देखा है कि याहवे ने बाल-पोर के प्रसंग में क्या किया था; क्योंकि बाल-पोर के पीछे चलने वाले हर पुरुष को[a] याहवे, तुम्हारे परमेश्वर ने तुम्हारे बीच से नष्ट कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् “बाल-पोर का अनुसरण किया।” हिब्रू में शाब्दिक रूप से “बाल-पोर के पीछे चला” है।
    reason: मूल मुहावरे के शाब्दिक बिंब और निष्ठापूर्वक अनुसरण करने के आशय, दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: तुमने अपनी आँखों से देखा है
  rationale: यह स्वाभाविक हिन्दी में मूल की प्रत्यक्षदर्शी होने पर दी गई विशेष बलाघात को सुरक्षित रखता है।
- source_word: עָשָׂה
  choice: क्या किया था
  rationale: यहाँ क्रिया बीती हुई न्याय की घटना की ओर संकेत करती है; ‘बनाया’ अर्थानुकूल नहीं है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּבַעַל פְּעוֹר
  choice: बाल-पोर के मामले में
  rationale: בְּ यहाँ बाल-पोर से जुड़ी घटना या प्रसंग को सूचित करता है। यह हिन्दी अभिव्यक्ति केवल भौगोलिक स्थान का अर्थ थोपे बिना उस प्रसंग को स्पष्ट करती है।
- source_word: כָּל הָאִישׁ
  choice: हर वह पुरुष
  rationale: मूल का पुल्लिंग एकवचन वितरणात्मक है; हिन्दी में यह रूप उसी व्याकरणिक और प्रतिनिधिक बल को बनाए रखता है।
- source_word: הָלַךְ אַחֲרֵי
  choice: के पीछे चला
  rationale: मूल बिंब को बनाए रखते हुए यह मूर्तिपूजक निष्ठा में किसी का अनुसरण करने का भाव व्यक्त करता है।
- source_word: הִשְׁמִידוֹ
  choice: उसे ... नष्ट कर दिया
  rationale: हिफ़ील क्रिया और उसमें निहित एकवचन कर्म को हिन्दी में स्पष्ट रूप से व्यक्त किया गया है।
- source_word: מִקִּרְבֶּךָ
  choice: तुम्हारे बीच से
  rationale: यह वाचा-समुदाय के भीतर से हटाकर नष्ट किए जाने का सामुदायिक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: हिब्रू पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका प्रचलित आधुनिक लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: כָּל הָאִישׁ का लिंग और वितरणात्मक अर्थ
  choice: हर वह पुरुष
  alternative: हर व्यक्ति; हर कोई
  rationale: मूल पाठ स्पष्ट रूप से पुल्लिंग एकवचन का वितरणात्मक प्रयोग करता है; इसलिए उसे लिंग-निरपेक्ष बनाकर मूल की विशिष्टता को मिटाया नहीं गया।
- issue: बाल-पोर का अनुसरण करने का अर्थ
  choice: बाल-पोर के पीछे चला
  alternative: बाल-पोर का अनुसरण किया
  rationale: मुख्य पाठ मूल के गति-संबंधी रूपक को सुरक्षित रखता है, जबकि प्रसंग में यह धार्मिक निष्ठा और मूर्तिपूजा का संकेत देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम’ इब्रानी संबोधन में बहुवचन से सामूहिक एकवचन की ओर होने वाले परिवर्तन को हिन्दी में अनावश्यक रूप से स्पष्ट किए बिना स्वाभाविक ढंग से समेटता है।
