source:
  edition: WLC
  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹׁתֵי/כֶ֑ם כִּ֣י לֹ֤א רְאִיתֶם֙ כָּל תְּמוּנָ֔ה בְּ/י֗וֹם דִּבֶּ֨ר יְהוָ֧ה אֲלֵי/כֶ֛ם בְּ/חֹרֵ֖ב מִ/תּ֥וֹךְ הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/015.yaml
  text: So watch yourselves very carefully[b][a], since you saw no form on the day Yahweh spoke to you at Horeb from the midst of the fire.
translation:
  language: hi
  text: इसलिए अपने आप को बहुत सावधानी से संभालो[a], क्योंकि जिस दिन याहवे ने होरेब में आग के बीच से तुमसे बात की, उस दिन तुमने कोई रूप नहीं देखा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “अपने प्राणों के लिए बहुत सावधान रहो”; यह स्वयं को अत्यन्त सावधानी से संभालने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या “कोई आकृति,” “कोई समानता,” अथवा “कोई प्रतिमा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם
  choice: इसलिए अपने विषय में बहुत सावधान रहो
  rationale: यह पूरा पदबंध स्वयं की अत्यन्त सावधानी से रक्षा करने का मुहावरा है। ‘अपने विषय में बहुत सावधान रहो’ चेतावनी की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; נֶפֶשׁ को यहाँ अलग से ‘आत्मा’ कहना अनावश्यक मानवशास्त्रीय अर्थ जोड़ सकता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह चेतावनी का आधार बताने वाला कारणसूचक संयोजक है।
- source_word: לֹא רְאִיתֶם כָּל תְּמוּנָה
  choice: तुमने कोई रूप नहीं देखा था
  rationale: תְּמוּנָה दृश्य रूप, आकृति या समानता का बोध करा सकता है। ‘रूप’ व्यापक अर्थ बनाए रखता है और इसे केवल मनुष्य-निर्मित प्रतिमा तक सीमित नहीं करता।
- source_word: בְּיוֹם
  choice: जिस दिन ... उस दिन
  rationale: हिब्रू के स्पष्ट कालसूचक पद ‘दिन में/जिस दिन’ को बनाए रखते हुए हिन्दी वाक्य को सहज बनाया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה का हिन्दी लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: בְּחֹרֵב
  choice: होरेब में
  rationale: स्थान को हिन्दी में स्वाभाविक रीति से व्यक्त करता है।
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: आग के बीच से
  rationale: מִתּוֹךְ की स्थानगत विशिष्टता और दृश्यात्मकता को सुरक्षित रखता है।
theological_decisions:
- issue: לְנַפְשֹׁתֵיכֶם में נֶפֶשׁ का मानवशास्त्रीय आशय
  choice: 'मुहावरेदार आत्म-संबोधन: ‘अपने विषय में ... सावधान रहो’'
  alternative: ‘अपनी आत्माओं की बहुत रक्षा करो’
  rationale: सन्दर्भ में यह तन और आत्मा के भेद पर तकनीकी कथन नहीं, बल्कि स्वयं को पूरी सावधानी से बचाने की चेतावनी है।
- issue: होरेब के ईश-प्रकाशन में תְּמוּנָה का अर्थ
  choice: रूप
  alternative: आकृति; समानता; प्रतिमा
  rationale: ‘रूप’ किसी दृश्य स्वरूप के न दिखने की बात कहता है और अगले पदों की मूर्ति-विरोधी दलील के लिए शब्द को समय से पहले केवल निर्मित प्रतिमा के अर्थ में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। चेतावनी का बल बनाए रखने के लिए ‘बहुत सावधान रहो’ और दृश्य ईश-रूप की अनुपस्थिति के लिए व्यापक शब्द ‘रूप’ चुना गया है।
