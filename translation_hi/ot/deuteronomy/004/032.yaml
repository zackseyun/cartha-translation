source:
  edition: WLC
  text: כִּ֣י שְׁאַל נָא֩ לְ/יָמִ֨ים רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ לְ/מִן הַ/יּוֹם֙ אֲשֶׁר֩ בָּרָ֨א אֱלֹהִ֤ים אָדָם֙ עַל הָ/אָ֔רֶץ וּ/לְ/מִ/קְצֵ֥ה הַ/שָּׁמַ֖יִם וְ/עַד קְצֵ֣ה הַ/שָּׁמָ֑יִם הֲ/נִֽהְיָ֗ה כַּ/דָּבָ֤ר הַ/גָּדוֹל֙ הַ/זֶּ֔ה א֖וֹ הֲ/נִשְׁמַ֥ע כָּמֹֽ/הוּ־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/032.yaml
  text: 'For ask now about the former days that were before you[a], from the day when God created man on the earth, and from one end of the heavens to the other end of the heavens: has anything happened like this great thing, or has anything been heard like it?'
translation:
  language: hi
  text: क्योंकि अब उन पुराने दिनों के विषय में पूछो, जो तुमसे पहले बीत चुके हैं—उस दिन से, जब परमेश्वर ने पृथ्वी पर मनुष्य[a] की सृष्टि की, लेकर आकाश के एक छोर से दूसरे छोर तक। क्या इस महान बात के समान कभी कोई बात घटी है, या इसके समान कुछ कभी सुना गया है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मानवजाति’; इब्रानी शब्द אָדָם सृष्टि के प्रसंगों में सम्पूर्ण मानवता का प्रतिनिधित्व कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל נָא
  choice: अब ... पूछो
  rationale: आज्ञार्थक क्रिया के साथ נָא आग्रह और तात्कालिकता जोड़ता है; ‘अब ... पूछो’ आधुनिक हिन्दी में उसका स्वाभाविक बल बनाए रखता है।
- source_word: לְיָמִים רִאשֹׁנִים
  choice: उन पुराने दिनों के विषय में
  rationale: यह पदबंध सुदूर अतीत की ओर संकेत करता है; ‘पुराने दिन’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: जो तुमसे पहले थे
  rationale: यह श्रोता से पहले के समय का सीधा कालगत अर्थ सुरक्षित रखता है।
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּרָא
  choice: उस दिन से जब ... सृजा
  rationale: यह ऐतिहासिक पड़ताल की आरम्भ-सीमा को स्पष्ट करता है और स्रोत की रचना के निकट रहता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में यह एकमात्र सृष्टिकर्ता के लिए प्रयुक्त है; ‘परमेश्वर’ मानक और गरिमापूर्ण हिन्दी रूप है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: सृष्टि-प्रसंग में एकवचन אָדָם मानव जाति का प्रतिनिधि भी हो सकता है। ‘मनुष्य’ स्रोत के एकवचन रूप को रखते हुए हिन्दी में यह व्यापक अर्थ ग्रहण कर सकता है।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: यह स्थानवाचक पदबंध का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: וּלְמִקְצֵה הַשָּׁמַיִם וְעַד קְצֵה הַשָּׁמָיִם
  choice: और आकाश के एक छोर से दूसरे छोर तक पूछो
  rationale: यह समस्त विस्तार व्यक्त करने वाला युग्म है। अन्तर्निहित ‘पूछो’ दोहराने से हिन्दी वाक्य स्पष्ट होता है और खोज के भौगोलिक विस्तार का भाव सुरक्षित रहता है।
- source_word: הֲנִהְיָה
  choice: क्या कभी ... घटी है
  rationale: प्रश्न पूछता है कि ऐसी बात किसी समय घटित हुई है या नहीं; ‘कभी’ निहित सर्वकालिक खोज को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: כַּדָּבָר הַגָּדוֹל הַזֶּה
  choice: इस महान घटना जैसी कोई घटना
  rationale: דבר यहाँ कथन मात्र नहीं, घटित विषय या घटना को दर्शाता है। ‘घटना’ प्रसंगानुकूल है; पुनरावृत्ति हिन्दी में तुलना को स्पष्ट बनाती है।
- source_word: הֲנִשְׁמַע כָּמֹהוּ
  choice: या क्या कभी इसके समान कुछ सुना गया है?
  rationale: निफ़अल रूप किसी बात के सुने या ज्ञात होने को व्यक्त करता है; निष्क्रिय रचना और आलंकारिक प्रश्न दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: सृष्टि-प्रसंग में אָדָם का अर्थ
  choice: मनुष्य
  alternative: मानवजाति; आदम
  rationale: यह पद सृष्टि से आगे के पूरे इतिहास का सर्वेक्षण करता है। ‘मनुष्य’ इब्रानी के एकवचन प्रतिनिधिक रूप को बनाए रखता है, जबकि ‘मानवजाति’ उसका सम्भव सामूहिक अर्थ स्पष्ट करती है। ‘आदम’ सम्भवतः अत्यधिक व्यक्तिवाचक होगा, क्योंकि यहाँ बल पृथ्वी पर मानव-सृष्टि से आरम्भ होने वाले काल पर है। अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली अपनाई गई है। वाक्य की व्यापक ऐतिहासिक और भौगोलिक परिधि बनाए रखने के लिए दीर्घ आलंकारिक प्रश्न सुरक्षित रखा गया है; पठनीयता हेतु विराम-चिह्न और ‘पूछो’ की पुनरावृत्ति जोड़ी गई है।
