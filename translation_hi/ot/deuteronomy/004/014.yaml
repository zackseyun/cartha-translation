source:
  edition: WLC
  text: וְ/אֹתִ֞/י צִוָּ֤ה יְהוָה֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/לַמֵּ֣ד אֶתְ/כֶ֔ם חֻקִּ֖ים וּ/מִשְׁפָּטִ֑ים לַ/עֲשֹׂתְ/כֶ֣ם אֹתָ֔/ם בָּ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/014.yaml
  text: And at that time Yahweh commanded me to teach you statutes and judgments[b][a], so that you might do them in the land that you are crossing over to possess.
translation:
  language: hi
  text: और उस समय याहवे ने मुझे आज्ञा दी कि मैं तुम्हें विधियाँ और न्याय-विधान[a] सिखाऊँ, ताकि तुम उस देश में उनका पालन करो, जिसे अपने अधिकार में लेने[b] के लिए तुम पार जा रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नियम और न्यायादेश।”
    reason: इब्रानी कानूनी पदों חֻקִּים और מִשְׁפָּטִים के वैकल्पिक अर्थ।
  - marker: b
    text: या, “विरासत में प्राप्त करने।”
    reason: इब्रानी क्रिया ירשׁ का अर्थ ‘अधिकार करना’ और ‘विरासत में पाना’ दोनों हो सकता है।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम के प्रचलित विद्वतापूर्ण उच्चारण का देवनागरी लिप्यंतरण; इसे किसी उपाधि से नहीं बदला गया है।
- source_word: צִוָּה
  choice: आज्ञा दी
  rationale: यह क्रिया अधिकारपूर्ण आदेश व्यक्त करती है; वाचा और व्यवस्था के प्रसंग में ‘आज्ञा दी’ स्वाभाविक और सटीक है।
- source_word: לְלַמֵּד
  choice: सिखाऊँ
  rationale: यह मूसा को इस्राएल को व्यवस्था की बातें समझाने और सिखाने के लिए दिए गए दायित्व को व्यक्त करता है।
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: विधियाँ और न्याय-विधान
  rationale: यह जोड़ी दोनों इब्रानी कानूनी पदों के बीच के भेद को यथासंभव बनाए रखती है और आधुनिक हिन्दी में समझने योग्य है।
- source_word: לַעֲשֹׂתְכֶם אֹתָם
  choice: ताकि तुम ... उनका पालन करो
  rationale: शाब्दिक अर्थ ‘तुम्हारे उन्हें करने के लिए’ है; कानूनी आज्ञाओं के संदर्भ में ‘पालन करो’ स्वाभाविक हिन्दी है और उद्देश्य का भाव स्पष्ट रखता है।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: व्यवस्थाविवरण के भौगोलिक और वाचागत संदर्भ में ‘देश’ सहज है; निश्चितता को ‘उस’ से व्यक्त किया गया है।
- source_word: עֹבְרִים שָׁמָּה
  choice: तुम पार जा रहे हो
  rationale: यह वर्तमान कृदंत निकट भविष्य में यरदन पार करके देश में प्रवेश करने की गति को दर्शाता है।
- source_word: לְרִשְׁתָּהּ
  choice: जिस पर अधिकार करने
  rationale: क्रिया का अर्थ देश को अपने अधिकार में लेना या विरासत में पाना हो सकता है; मुख्य पाठ में पहला अर्थ रखा गया और दूसरा पादटिप्पणी में दिया गया है।
- source_word: וְאֹתִי
  choice: और ... मुझे
  rationale: इब्रानी में ‘मुझे’ आगे रखकर हल्का बल या विरोध दिखाया गया है; हिन्दी में ‘और उस समय ... मुझे’ वाक्य को स्वाभाविक रखते हुए इस संबंध को पर्याप्त रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में आए व्यक्तिगत नाम को उपाधि ‘प्रभु’ से बदलने के बजाय लिप्यंतरित किया गया है; ‘याहवे’ संभावित इब्रानी उच्चारण के अधिक निकट है।
- issue: לְרִשְׁתָּהּ में अधिकार और विरासत का अर्थ-संबंध
  choice: अधिकार करने
  alternative: विरासत में पाने
  rationale: इस पद में देश में प्रवेश करके उसे अपने अधिकार में लेने का तात्कालिक भाव प्रमुख है, किंतु वाचा के उपहार का ‘विरासत’ वाला भाव भी शब्द में संभव है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कानूनी पदों के भेद को बनाए रखने के लिए ‘विधियाँ और न्याय-विधान’ चुना गया है; ‘उनका पालन करो’ शाब्दिक ‘उन्हें करो’ की अपेक्षा स्वाभाविक हिन्दी है।
