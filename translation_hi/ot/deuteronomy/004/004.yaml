  text: וְ/אַתֶּם֙ הַ/דְּבֵקִ֔ים בַּ/יהוָ֖ה אֱלֹהֵי/כֶ֑ם חַיִּ֥ים כֻּלְּ/כֶ֖ם הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/004.yaml
  text: But you who hold fast to Yahweh your God are all alive today[a].
translation:
  language: hi
  text: परन्तु तुम, जो अपने परमेश्वर याहवे से दृढ़ता से जुड़े हुए हो[a], आज सब-के-सब जीवित हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “चिपके हुए” या “दृढ़ता से लगे हुए” भी कहा जा सकता है; यह याहवे के प्रति निकट और निष्ठापूर्ण लगाव को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: परन्तु तुम
  rationale: पिछले पद में नष्ट हुए लोगों के विपरीत अब बचे हुए श्रोताओं को संबोधित किया गया है; इसलिए וְ का विरोधसूचक भाव स्वाभाविक हिन्दी में ‘परन्तु’ से व्यक्त किया गया है।
- source_word: הַ/דְּבֵקִים
  choice: जो ... से लिपटे रहे
  rationale: דבק निकटता से चिपके रहने, जुड़े रहने या निष्ठापूर्वक लगे रहने को दर्शाता है। ‘लिपटे रहे’ मूल बिंब और वाचा-संबंधी दृढ़ लगाव दोनों को बनाए रखता है; ‘रहे’ उनके अब तक जीवित होने की पृष्ठभूमि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּ/יהוָה
  choice: याहवे से
  rationale: ב यहाँ लगाव के संबंध को व्यक्त करता है, जिसे हिन्दी में ‘से’ स्वाभाविक रूप से दर्शाता है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: אֱלֹהֵי/כֶם
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय ‘तुम्हारे परमेश्वर’ का अर्थ देता है। हिन्दी में कर्ता के साथ संबंध स्पष्ट और स्वाभाविक बनाने के लिए ‘अपने परमेश्वर’ चुना गया है।
- source_word: חַיִּים
  choice: जीवित हो
  rationale: यह श्रोताओं की वर्तमान दशा बताने वाला विधेय है; ‘जीवित हो’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: כֻּלְּ/כֶם
  choice: सब-के-सब
  rationale: यह बचे हुए पूरे समुदाय पर बल देता है। ‘सब-के-सब’ इस व्यापक और बलयुक्त अर्थ को स्पष्ट करता है।
- source_word: הַ/יּוֹם
  choice: आज
  rationale: कालसूचक अभिव्यक्ति का सरल और वर्तमान हिन्दी रूप ‘आज’ है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका पारदर्शी लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: דבק में निहित वाचा-संबंधी लगाव
  choice: लिपटे रहे
  alternative: दृढ़ता से जुड़े रहे; लगे रहे
  rationale: अनुवाद मूल के निकट लगाव वाले मूर्त बिंब को बनाए रखता है, पर उससे किसी विशिष्ट सम्प्रदायगत उद्धार-सिद्धान्त का निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सब-के-सब’ मूल के जोर को व्यक्त करता है, जबकि ‘लिपटे रहे’ דבק के ठोस बिंब और संबंधपरक अर्थ दोनों को सुरक्षित रखता है।
