  yaml_path: translation/ot/deuteronomy/004/033.yaml
  text: Has any people heard the voice of God speaking from the midst of the fire[a], as you have heard, and lived?
translation:
  language: hi
  text: क्या किसी जाति ने आग के बीच से बोलते हुए परमेश्वर की वाणी सुनी है, जैसे तूने सुनी है और जीवित रहा है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और बच गया है।” इब्रानी क्रिया का सीधा अर्थ “जीवित रहा” है, पर प्रसंग इस बात पर बल देता है कि परमेश्वर को आग में से बोलते सुनने के बाद भी इस्राएल जीवित रहा।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/שָׁמַע
  choice: क्या ... ने ... सुनी है
  rationale: प्रश्नवाचक הֲ और पूर्ण क्रिया यहाँ आलंकारिक प्रश्न बनाते हैं। हिन्दी में ‘क्या ... सुनी है’ अनुभव-संबंधी भाव और प्रश्नरूप दोनों को स्वाभाविक ढंग से रखता है।
- source_word: עָם
  choice: जाति
  rationale: यहाँ עָם एक सामूहिक जनसमुदाय को दर्शाता है जिसकी तुलना इस्राएल से की गई है। ‘जाति’ इस व्यापक राष्ट्रीय-जन अर्थ को संक्षेप में व्यक्त करती है।
- source_word: קוֹל
  choice: वाणी
  rationale: מְדַבֵּר (‘बोलते हुए’) के साथ קוֹל किसी अर्थपूर्ण दैवी कथन की ओर संकेत करता है; ‘वाणी’ हिन्दी में गरिमापूर्ण और स्वाभाविक है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन कृदंत מְדַבֵּר और होरेब की वाचा-संबंधी पृष्ठभूमि एकवचन दैवी संदर्भ की पुष्टि करते हैं।
- source_word: מְדַבֵּר
  choice: बोलते हुए
  rationale: कृदंत सक्रिय रूप से बोलने की जारी क्रिया बताता है; यह रूप उस पहलू को सीधे बनाए रखता है।
- source_word: מִ/תּוֹךְ הָ/אֵשׁ
  choice: आग के बीच से
  rationale: यह अनुवाद स्रोत के स्थानिक चित्र को सुरक्षित रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: כַּ/אֲשֶׁר
  choice: जैसे
  rationale: यह किसी जाति के अनुभव की तुलना इस्राएल के वास्तविक अनुभव से करता है।
- source_word: שָׁמַעְתָּ אַתָּה
  choice: तूने सुनी
  rationale: स्वतंत्र सर्वनाम אַתָּה कर्ता पर बल देता है। निकटवर्ती पदों में मूसा का एकवचन संबोधन है; ‘तूने’ उसे बनाए रखता है।
- source_word: וַ/יֶּחִי
  choice: और जीवित रही
  rationale: חיה का सीधा अर्थ ‘जीवित रहना’ है। स्त्रीलिंग ‘रही’ का संबंध ‘जाति’ से है और वाक्य के निहित आश्चर्य को बिना बढ़ाए रखता है।
theological_decisions:
- issue: प्रत्यक्ष दैवी प्रकाशन के प्रसंग में אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: कोई देवता / देवताओं
  rationale: एकवचन कृदंत और होरेब का प्रसंग इस्राएल के परमेश्वर को संदर्भित करते हैं; इसलिए एकवचन अनुवाद आवश्यक है, पर अतिरिक्त धर्मसैद्धांतिक विस्तार नहीं जोड़ा गया।
- issue: परमेश्वर की वाणी सुनने के बाद मृत्यु से बचने के निहित विरोध को व्यक्त करना
  choice: और जीवित रही
  alternative: और बची रही / फिर भी जीवित रही
  rationale: इब्रानी पाठ साधारण संयोजक से उपवाक्यों को जोड़ता है। ‘फिर भी’ जोड़ना विरोध को मूल पाठ से अधिक स्पष्ट कर देता, जबकि ‘बची रही’ अर्थ की व्याख्या करता; मुख्य पाठ में सीधा अर्थ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तूने’ एकवचन संबोधन और इब्रानी के बलयुक्त אַתָּה को सुरक्षित रखता है। प्रश्नचिह्न फुटनोट-चिह्न से पहले रखा गया है ताकि पूरा वाक्य आलंकारिक प्रश्न के रूप में स्पष्ट रहे।
