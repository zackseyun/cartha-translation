source:
  edition: WLC
  text: וּ/בִקַּשְׁתֶּ֥ם מִ/שָּׁ֛ם אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/מָצָ֑אתָ כִּ֣י תִדְרְשֶׁ֔/נּוּ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/029.yaml
  text: But from there you will seek Yahweh your God[a], and you will find him[b], if you seek him with all your heart and with all your soul.
translation:
  language: hi
  text: पर वहाँ से तुम अपने परमेश्वर याहवे को ढूँढ़ोगे और उसे पाओगे, यदि तुम उसे अपने पूरे मन और अपने पूरे प्राण[a] से खोजोगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्राण’ का अर्थ यहाँ ‘जीवन’ या ‘संपूर्ण अस्तित्व’ भी हो सकता है; इब्रानी נֶפֶשׁ प्रायः पूरे जीवित व्यक्ति को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में पहली क्रिया बहुवचन (‘तुम ढूँढ़ोगे’) है, पर बाद की क्रियाएँ और प्रत्यय एकवचन हैं। यह इस्राएल समुदाय को एक इकाई के रूप में संबोधित करने का ढंग हो सकता है। हिन्दी में स्वाभाविकता के लिए बहुवचन संबोधन रखा गया है।
    reason: textual_grammar
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם מִשָּׁם
  choice: पर वहाँ से तुम लोग ... ढूँढ़ोगे
  rationale: וּ־ को पिछले प्रसंग के विपरीत परिणाम के रूप में ‘पर’ से व्यक्त किया गया है; מִשָּׁם का स्थानवाचक अर्थ ‘वहाँ से’ है। बहुवचन क्रिया को ‘तुम लोग ... ढूँढ़ोगे’ से सुरक्षित रखा गया है।
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर याहवे को
  rationale: याहवे इब्रानी व्यक्तिवाचक वाचा-नाम יְהוָה का सीधा लिप्यंतरण है। संबंधवाचक प्रत्यय का भाव स्वाभाविक हिन्दी ‘अपने परमेश्वर’ में व्यक्त होता है।
- source_word: וּמָצָאתָ
  choice: और तू उसे पा लेगा
  rationale: מצא यहाँ सफलतापूर्वक पाने का अर्थ देता है। हिन्दी में स्पष्टता के लिए ‘उसे’ पिछले कर्म, याहवे, से ग्रहण किया गया है, यद्यपि इस क्रिया के साथ इब्रानी में कर्म-सर्वनाम दोहराया नहीं गया। एकवचन रूप को ‘तू’ से सुरक्षित रखा गया है।
- source_word: כִּי
  choice: यदि
  rationale: यहाँ כִּי पाने की शर्त प्रस्तुत करता है। ‘यदि’ इस शर्त को व्यक्त करता है और ‘जब’ की अपेक्षा परिणाम को अनिवार्य मान लेने से बचता है।
- source_word: תִדְרְשֶׁנּוּ
  choice: तू उसे ... खोजेगा
  rationale: דרש का इस वाचागत संदर्भ में अर्थ परमेश्वर को गंभीरता से खोजना है। कर्म-सर्वनाम को ‘उसे’ से स्पष्ट रूप में व्यक्त किया गया है।
- source_word: בְּכָל לְבָבְךָ
  choice: अपने पूरे मन से
  rationale: לֵבָב विचार, इच्छा और भाव सहित भीतरी व्यक्ति को सूचित करता है; आधुनिक हिन्दी में ‘पूरे मन से’ स्वाभाविक और व्यापक है।
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: अपने पूरे प्राण से
  rationale: נֶפֶשׁ जीवन, जीवित स्व और संपूर्ण अस्तित्व को सूचित कर सकता है। ‘प्राण’ इस वाचागत युग्म की गरिमा और व्यापकता बनाए रखता है; अर्थ-सीमा पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: נֶפֶשׁ का मानवशास्त्रीय अर्थ
  choice: प्राण
  alternative: जीवन / संपूर्ण अस्तित्व
  rationale: यहाँ ‘मन’ के साथ इसका प्रयोग संपूर्ण व्यक्ति की निष्ठा बताता है। ‘प्राण’ पारंपरिक गूँज बनाए रखता है, जबकि पादटिप्पणी अधिक व्यापक अर्थ स्पष्ट करती है।
- issue: दूसरे पुरुष के वचन में परिवर्तन
  choice: बहुवचन ‘तुम लोग’ से एकवचन ‘तू’ की ओर परिवर्तन सुरक्षित रखा गया
  alternative: पूरे पद में बहुवचन ‘तुम’
  rationale: इब्रानी पाठ पहली क्रिया में बहुवचन से आगे की क्रियाओं और प्रत्ययों में एकवचन पर जाता है। इसे समतल करने के बजाय पाठ में रखा और पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘तू’ यहाँ अनादर नहीं, बल्कि इब्रानी के एकवचन संबोधन को सुरक्षित रखने के लिए है। ‘ढूँढ़ना’ और ‘खोजना’ मूल की दो अलग क्रियाओं בקש और דרש के हल्के अंतर को स्वाभाविक हिन्दी में दर्शाते हैं।
