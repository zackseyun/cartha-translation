source:
  edition: WLC
  text: כִּ֚י מִי ג֣וֹי גָּד֔וֹל אֲשֶׁר ל֥/וֹ אֱלֹהִ֖ים קְרֹבִ֣ים אֵלָ֑י/ו כַּ/יהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָּל קָרְאֵ֖/נוּ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/007.yaml
  text: For what great nation is there that has gods so near to it as Yahweh our God is to us whenever we call on him?[a][b]
translation:
  language: hi
  text: क्योंकि ऐसी कौन-सी बड़ी जाति है जिसके देवता उसके इतने निकट हों, जैसे याहवे, हमारा परमेश्वर, जब भी हम उसे पुकारते हैं, हमारे निकट होता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब भी हम उसकी दोहाई देते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण और समर्थन प्रस्तुत करता है; ‘क्योंकि’ उसके तर्कसूचक बल को बनाए रखता है।
- source_word: מִי גוֹי גָּדוֹל
  choice: ऐसी कौन-सी बड़ी जाति है
  rationale: इब्रानी में यह उत्तर की अपेक्षा न रखने वाला आलंकारिक प्रश्न है। ‘कौन-सी बड़ी जाति’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֲשֶׁר לוֹ אֱלֹהִים קְרֹבִים אֵלָיו
  choice: जिसके देवता उसके इतने निकट हों
  rationale: אֱלֹהִים के साथ बहुवचन विशेषण קְרֹבִים अन्य जातियों के देवताओं की ओर संकेत करता है; ‘इतने निकट’ आगे आने वाली तुलना को स्पष्ट करता है।
- source_word: כַּיהוָה אֱלֹהֵינוּ
  choice: जितना हमारे परमेश्वर यहोवा हमारे निकट होता है
  rationale: כַּ तुलना व्यक्त करता है। हिन्दी वाक्य में तुलना पूर्ण और सहज बनाने के लिए ‘हमारे निकट होता है’ स्पष्ट रूप से रखा गया है; יהוה को व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּכָל קָרְאֵנוּ אֵלָיו
  choice: जब भी हम उसे पुकारते हैं
  rationale: בְּכָל के साथ क्रियार्थक रूप हर अवसर की परिस्थिति बताता है। ‘उसे पुकारते हैं’ प्रार्थना या सहायता के लिए पुकारने—दोनों अर्थों की गुंजाइश बनाए रखता है।
theological_decisions:
- issue: पहले אֱלֹהִים का वचन और संदर्भ
  choice: बहुवचन ‘देवता’
  alternative: एकवचन ‘परमेश्वर’ या ‘दैवी प्राणी’
  rationale: निकटवर्ती बहुवचन विशेषण קְרֹבִים और इस्राएल के परमेश्वर से की गई तुलना बहुवचन अर्थ का समर्थन करते हैं। इससे दूसरी जातियों के देवताओं और इस्राएल के निकट रहने वाले यहोवा के बीच आलंकारिक तुलना बनी रहती है।
- issue: יהוה का हिन्दी रूप
  choice: यहोवा
  alternative: याहवे या ‘प्रभु’
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से नाम और उपाधि का भेद सुरक्षित रहता है।
- issue: परमेश्वर की निकटता की तुलना
  choice: ‘हमारे परमेश्वर यहोवा हमारे निकट होता है’
  alternative: ‘हमारा परमेश्वर यहोवा है’
  rationale: मूल में पहले खंड का ‘निकट’ दूसरे खंड में तुलना के द्वारा समझा जाता है। हिन्दी में उसे दोहराने से तुलना स्पष्ट होती है, बिना उसकी धार्मिक धार को बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली अपनाई गई है। ‘जाति’, ‘देवता’, ‘परमेश्वर’ और ‘पुकारना’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; वाक्य को आलंकारिक प्रश्न के रूप में सुरक्षित रखा गया है।
