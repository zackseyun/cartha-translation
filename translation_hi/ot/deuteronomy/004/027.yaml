  text: וְ/הֵפִ֧יץ יְהוָ֛ה אֶתְ/כֶ֖ם בָּ/עַמִּ֑ים וְ/נִשְׁאַרְתֶּם֙ מְתֵ֣י מִסְפָּ֔ר בַּ/גּוֹיִ֕ם אֲשֶׁ֨ר יְנַהֵ֧ג יְהוָ֛ה אֶתְ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/027.yaml
  text: And Yahweh will scatter you among the peoples[a], and you will be left few in number among the nations where Yahweh will drive you.
translation:
  language: hi
  text: याहवे तुम्हें विभिन्न लोगों के बीच तितर-बितर कर देगा, और जिन राष्ट्रों में याहवे तुम्हें हाँककर ले जाएगा[a], वहाँ तुम संख्या में बहुत कम रह जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अगुवाई करके ले जाएगा।” इब्रानी क्रिया का अर्थ “अगुवाई करना/ले चलना” या “हाँककर ले जाना” हो सकता है; यहाँ न्याय और निर्वासन के संदर्भ के कारण “हाँककर ले जाएगा” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵפִיץ
  choice: तितर-बितर कर देगा
  rationale: פוץ के हिफ़ील रूप में किसी को अलग-अलग स्थानों में बिखेर देने का कारक भाव है। यह पद न्याय और निर्वासन के संदर्भ में है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בָּעַמִּים
  choice: देश-देश के लोगों में
  rationale: עַמִּים अलग-अलग जनसमुदायों को सूचित करता है। यह सहज हिन्दी अभिव्यक्ति आगे आए גּוֹיִם (‘राष्ट्रों’) से शब्दार्थगत भेद भी बनाए रखती है।
- source_word: וְנִשְׁאַרְתֶּם
  choice: रह जाओगे
  rationale: निफ़ाल रूप न्याय के बाद बचे रह जाने के परिणाम को व्यक्त करता है; हिन्दी में ‘रह जाओगे’ इस परिणामसूचक भाव को स्वाभाविक ढंग से प्रकट करता है।
- source_word: מְתֵי מִסְפָּר
  choice: गिनती में थोड़े ही
  rationale: इस इब्रानी मुहावरे का अर्थ इतनी कम संख्या में होना है कि आसानी से गिना जा सके। चुनी हुई अभिव्यक्ति अर्थ को स्पष्ट और मुहावरेदार हिन्दी में रखती है।
- source_word: בַּגּוֹיִם
  choice: राष्ट्रों में
  rationale: यहाँ גּוֹיִם विदेशी राष्ट्रों के लिए सामान्य शब्द है; बाद के धार्मिक अर्थ वाला ‘अन्यजातियों’ शब्द अनावश्यक होगा।
- source_word: יְנַהֵג
  choice: हाँककर ले जाएगा
  rationale: נהג का अर्थ ‘ले जाना/अगुवाई करना’ या ‘हाँककर ले जाना’ हो सकता है। न्याय और निर्वासन के प्रसंग में चुना गया रूप बाध्य करके निकाले जाने का भाव व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: שָׁמָּה
  choice: वहाँ
  rationale: स्थानवाचक क्रियाविशेषण का स्पष्ट अर्थ ‘वहाँ’ है; हिन्दी वाक्य-विन्यास में इसे संबंधित उपवाक्य के बाद रखना स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी लिप्यंतरण है और इसे किसी उपाधि से नहीं बदलता।
- issue: निर्वासन में ले जाने के लिए נהג का भाव
  choice: हाँककर ले जाएगा
  alternative: ले जाएगा / अगुवाई करके ले जाएगा
  rationale: क्रिया में दोनों अर्थ संभव हैं। दण्ड और बिखराव के निकट संदर्भ के कारण मुख्य पाठ में बाध्य निर्वासन का भाव चुना गया है, पर वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देश-देश के लोगों’ और ‘राष्ट्रों’ से עַמִּים तथा גּוֹיִם का सीमित शब्दार्थगत भेद सुरक्षित रहता है। वाक्य का क्रम स्वाभाविक हिन्दी के अनुसार बदला गया है, पर मूल के सभी अर्थघटक बनाए रखे गए हैं।
