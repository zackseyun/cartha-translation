  register: भाषा आधुनिक, गरिमापूर्ण और भौगोलिक वर्णन के अनुरूप रखी गई है। पद पिछले वाक्य की सूची का अंतिम संयुक्त खंड है, इसलिए आरंभिक ‘और’ तथा मूल की वाक्यांशात्मक संरचना बनाए रखी गई है। पाद-टिप्पणी का चिह्न उसके वास्तविक विषय ‘अराबा के समुद्र’ के बाद रखा गया है।
