  text: and all the Arabah beyond the Jordan eastward[a], as far as the Sea of the Arabah, below the slopes of Pisgah.
translation:
  language: hi
  text: और यरदन के पार, पूर्व की ओर का सारा अराबा, अराबा के समुद्र[a] तक, पिसगा की ढलानों के नीचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वह जलराशि जिसे सामान्यतः मृत सागर के नाम से जाना जाता है।
    reason: cross_reference
lexical_decisions:
- source_word: וְכָל
  choice: और…सारा
  rationale: संयोजक ‘और’ तथा पूरे भूभाग के समावेश का भाव सुरक्षित रखा गया है।
- source_word: הָעֲרָבָה
  choice: अराबा
  rationale: यहाँ सामान्य ‘मैदान’ के बजाय यरदन की दरार-घाटी से जुड़े भौगोलिक नाम का संकेत है, इसलिए नाम का लिप्यंतरण किया गया है।
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार
  rationale: वक्ता की भौगोलिक दृष्टि से नदी के दूसरी ओर के क्षेत्र को दर्शाने वाला स्वाभाविक और संक्षिप्त हिंदी प्रयोग।
- source_word: מִזְרָחָה
  choice: पूर्व की ओर
  rationale: दिशासूचक क्रियाविशेषण का आधुनिक और सहज हिंदी रूप।
- source_word: יָם הָעֲרָבָה
  choice: अराबा का समुद्र
  rationale: बाद के प्रचलित नाम ‘मृत सागर’ को मूल पाठ में रखने के बजाय इब्रानी पदबंध का निकट अनुवाद किया गया है; पहचान पाद-टिप्पणी में दी गई है।
- source_word: תַּחַת
  choice: नीचे
  rationale: भू-आकृतिक संदर्भ में स्थानगत संबंध को सरल और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אַשְׁדֹּת
  choice: ढलानों
  rationale: भौगोलिक प्रयोग में पहाड़ी उतार या ढलानों का अर्थ यहाँ सर्वाधिक उपयुक्त है।
- source_word: הַפִּסְגָּה
  choice: पिसगा
  rationale: स्थान-नाम का प्रचलित देवनागरी लिप्यंतरण।
