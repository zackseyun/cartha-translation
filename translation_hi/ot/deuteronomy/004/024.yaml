base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/024.yaml
  text: For Yahweh your God is a consuming fire[a], a jealous God.
translation:
  language: hi
  text: क्योंकि यहोवा, तुम्हारा परमेश्वर, भस्म करने वाली आग है; वह ईर्ष्यालु परमेश्वर है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उत्साही परमेश्वर।” इब्रानी शब्द, विशेषकर मूर्तिपूजा के संदर्भ में, अपने लोगों पर यहोवा के वाचा के अंतर्गत अनन्य अधिकार पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद की चेतावनी का कारण बताता है; हिंदी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को ‘तुम्हारा’ से व्यक्त किया गया है, जिससे इस्राएल को सामूहिक रूप से किए गए वाचा-संबंधी संबोधन का रूप बना रहता है।
- source_word: אֵשׁ אֹכְלָה
  choice: भस्म करनेवाली आग
  rationale: यह संज्ञा और कृदंत से बनी सजीव विधेयात्मक उपमा है; यह अनुवाद विनाशकारी रूप से निगल जाने वाली आग की मूल छवि को बनाए रखता है।
- source_word: הוּא
  choice: वह ... है
  rationale: स्वतंत्र सर्वनाम के बल को हिंदी में स्पष्ट पुनरुक्त कर्ता ‘वह’ द्वारा रखा गया है।
- source_word: אֵל קַנָּא
  choice: ईर्ष्यालु परमेश्वर
  rationale: ‘ईर्ष्यालु’ प्रतिद्वंद्वी उपासना को अस्वीकार करने वाले परमेश्वर के अनन्य वाचा-दावे को व्यक्त करता है और मूल की असहज धार्मिक धार को नरम नहीं करता।
theological_decisions:
- issue: परमेश्वर की ईर्ष्या का अनुवाद
  choice: ईर्ष्यालु परमेश्वर
  alternative: अपने अधिकार के लिए अत्यंत उत्साही परमेश्वर
  rationale: मूर्तिपूजा के संदर्भ में इब्रानी शब्द केवल उत्साह नहीं, बल्कि अपने लोगों पर परमेश्वर के अनन्य वाचा-दावे और प्रतिद्वंद्वी उपासना की अस्वीकृति को दर्शाता है। ‘ईर्ष्यालु’ इस तनाव और संबंधपरक बल को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भस्म करनेवाली आग’ बाइबलीय काव्यात्मक छवि को स्वाभाविक हिंदी में बनाए रखता है; डैश इब्रानी הוּא के बल को पठनीय ढंग से उभारता है।
