  text: הַעִידֹתִי֩ בָ/כֶ֨ם הַ/יּ֜וֹם אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ כִּֽי אָבֹ֣ד תֹּאבֵדוּ/ן֮ מַהֵר֒ מֵ/עַ֣ל הָ/אָ֔רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ לֹֽא תַאֲרִיכֻ֤/ן יָמִים֙ עָלֶ֔י/הָ כִּ֥י הִשָּׁמֵ֖ד תִּשָּׁמֵדֽוּ/ן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/026.yaml
  text: I call heaven and earth to witness against you today that you will surely perish quickly from the land that you are crossing the Jordan to possess[a]. You will not prolong your days on it[c][b], for you will surely be destroyed.
translation:
  language: hi
  text: आज मैं आकाश और पृथ्वी को तुम्हारे विरुद्ध साक्षी ठहराता हूँ कि जिस देश पर अधिकार करने के लिए तुम यरदन पार कर रहे हो, उस देश से तुम शीघ्र ही निश्चय ही नष्ट हो जाओगे। तुम उस पर बहुत दिनों तक नहीं रहोगे,[a] क्योंकि तुम निश्चय ही नष्ट कर दिए जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “तुम उस पर अपने दिन लंबे नहीं करोगे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: मैं ... को तुम्हारे विरुद्ध साक्षी ठहराता हूँ
  rationale: हिफ़ील रूप और בָכֶם का न्यायिक तथा प्रतिकूल भाव सुरक्षित रहता है; आधुनिक हिन्दी में यह वाचा-संबंधी साक्ष्य की औपचारिक भाषा के रूप में स्वाभाविक है।
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: यह सृष्टि को साक्षी बनाने वाला वाचा-सूत्र है; हिन्दी में ‘आकाश और पृथ्वी’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אָבֹד תֹּאבֵדוּן מַהֵר
  choice: तुम शीघ्र ही निश्चय नष्ट हो जाओगे
  rationale: क्रिया के साथ infinitive absolute द्वारा दिए गए निश्चितता के बल को ‘निश्चय’ से और מַהֵר को ‘शीघ्र ही’ से व्यक्त किया गया है।
- source_word: מֵעַל הָאָרֶץ
  choice: उस देश में से
  rationale: מֵעַל का मूल भाव देश की सतह से हटा दिए जाने का है; हिन्दी में ‘देश में से नष्ट हो जाना’ निष्कासन/लोप की धमकी को स्पष्ट करता है।
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: जिस देश पर अधिकार करने के लिए तुम यरदन पार कर रहे हो
  rationale: שָׁמָּה की गंतव्य-दिशा और ירשׁ के भूमि-अधिकार संबंधी अर्थ को सहज हिन्दी वाक्य-विन्यास में रखा गया है।
- source_word: לֹא תַאֲרִיכֻן יָמִים עָלֶיהָ
  choice: तुम उस पर बहुत दिनों तक नहीं रहोगे
  rationale: शाब्दिक ‘अपने दिन लम्बे नहीं करोगे’ के मुहावरे का स्वाभाविक हिन्दी अर्थ दिया गया है, जबकि עָלֶיהָ के अनुरूप ‘उस पर’ रखा गया है।
- source_word: הִשָּׁמֵד תִּשָּׁמֵדוּן
  choice: तुम निश्चय ही नष्ट कर दिए जाओगे
  rationale: निफ़ाल की कर्मवाच्य प्रकृति और infinitive absolute की प्रबल निश्चितता दोनों सुरक्षित हैं; ‘सर्वथा’ या ‘समूल’ जैसे सम्भावित अतिशयोक्तिपूर्ण अर्थ नहीं जोड़े गए।
theological_decisions:
- issue: आकाश और पृथ्वी का वाचा-साक्षी होना
  choice: इसे इस्राएल के विरुद्ध साक्षी ठहराने की न्यायिक घोषणा के रूप में प्रस्तुत किया गया
  alternative: ‘मैं आकाश और पृथ्वी की शपथ देकर तुम्हें चेतावनी देता हूँ’
  rationale: मूल क्रिया और בָכֶם वाचा-मुकदमे की साक्ष्य-भाषा का समर्थन करते हैं; ‘शपथ’ या केवल ‘चेतावनी’ कहना कानूनी बल को बदल देता।
- issue: दोहराई गई विनाश की निश्चितता
  choice: पहले ‘निश्चय नष्ट हो जाओगे’ और फिर ‘निश्चय ही नष्ट कर दिए जाओगे’
  alternative: दोनों को ‘तुम पूरी तरह मिटा दिए जाओगे’
  rationale: दोनों हिब्रू रचनाओं का बल रखा गया है, पर ‘समूल विनाश’ जैसी अधिक निरपेक्ष धर्मवैज्ञानिक व्याख्या नहीं थोपी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में बहुवचन ‘तुम’; वाचा और न्याय की गरिमा बनाए रखते हुए अनावश्यक पुरातन शब्दावली से परहेज़। ‘देश’ הָאָרֶץ के प्रतिज्ञात भूभाग-संदर्भ को स्पष्ट करता है।
