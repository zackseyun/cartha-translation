  yaml_path: translation/ot/deuteronomy/004/018.yaml
  text: the form of any creeping thing on the ground[b][a], the form of any fish that is in the waters under the earth.
translation:
  language: hi
  text: धरती पर रेंगने वाले किसी भी जीव की आकृति[a], धरती के नीचे[b] के जल में रहने वाली किसी भी मछली की आकृति।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘समानता’ अथवा ‘प्रतिरूप’; इब्रानी शब्द תַּבְנִית।
    reason: lexical_alternative
  - marker: b
    text: ‘धरती के नीचे’ भूमि के नीचे के जल के लिए प्रयुक्त बाइबिल की परिचित अभिव्यक्ति की प्रतिध्वनि है; निर्गमन 20:4 में प्रतिमा-निषेध की भाषा से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: תַּבְנִית
  choice: आकृति
  rationale: मूर्तिपूजा-विरोधी प्रसंग में यह किसी प्राणी के दृश्य रूप या प्रतिरूप को सूचित करता है। ‘आकृति’ स्वाभाविक है और इसे किसी खास माध्यम की ‘मूर्ति’ तक सीमित नहीं करती।
- source_word: כָּל
  choice: किसी भी
  rationale: एकवचन सामूहिक संज्ञाओं के साथ निषेध की व्यापक, वितरणात्मक शक्ति को आधुनिक हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: רֹמֵשׂ
  choice: रेंगनेवाला जीव
  rationale: यह भूमि की सतह पर सरकने या रेंगनेवाले छोटे जीवों की श्रेणी को दर्शाता है; ‘जीव’ जोड़ने से हिन्दी में अर्थ स्पष्ट और स्वाभाविक होता है।
- source_word: בָּאֲדָמָה
  choice: धरती पर
  rationale: यहाँ אֲדָמָה उस भूमि-सतह को सूचित करता है जिस पर ये जीव चलते हैं; ‘धरती पर’ सामान्य हिन्दी में सहज है।
- source_word: דָּגָה
  choice: मछली
  rationale: इब्रानी संज्ञा सामूहिक अर्थ रख सकती है; ‘किसी भी मछली’ हिन्दी में प्रसंगानुकूल वितरणात्मक अर्थ देती है।
- source_word: אֲשֶׁר בַּמַּיִם
  choice: जल में रहनेवाली
  rationale: सम्बन्धवाचक उपवाक्य को स्पष्ट रखा गया है। ‘जल’ מַיִם का स्वाभाविक सामूहिक हिन्दी रूप है।
- source_word: מִתַּחַת לָאָרֶץ
  choice: धरती के नीचे
  rationale: यह बाइबिल की परिचित स्थानगत अभिव्यक्ति को बनाए रखता है और निर्गमन 20:4 की प्रतिध्वनि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: मूर्तिपूजा के प्रसंग में प्रतिनिधिक रूप का शब्दांकन
  choice: किसी भी ... की आकृति
  alternative: किसी भी ... की समानता / किसी भी ... की प्रतिमा
  rationale: ‘आकृति’ תַּבְנִית के दृश्य या निर्मित प्रतिरूप के अर्थ को व्यक्त करती है, पर उसे किसी विशेष माध्यम की मूर्ति तक सीमित नहीं करती। मूर्तिपूजा-विरोधी बल प्रसंग से आता है; उसे पद में अतिरिक्त रूप से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज वाक्य-विन्यास। इब्रानी की दोहराई हुई ‘आकृति’ संरचना को बनाए रखा गया है। मुख्य पाठ के सभी पादटिप्पणी-चिह्न उपस्थित हैं।
