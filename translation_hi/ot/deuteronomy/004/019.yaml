base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/019.yaml
  text: And beware lest you lift up your eyes to heaven[a], and when you see the sun and the moon and the stars—all the host of heaven—you be drawn away and bow down to them and serve them[b], which Yahweh your God has allotted to all the peoples under all the heavens.
translation:
  language: hi
  text: और सावधान रहना कि कहीं ऐसा न हो कि तुम आकाश की ओर आँखें उठाकर सूर्य, चन्द्रमा और तारों—आकाशीय पिंडों के पूरे समूह—को देखो, और बहककर उनके आगे दण्डवत् करो और उनकी उपासना करो। ये वे हैं जिन्हें यहोवा, तुम्हारे परमेश्वर, ने सारे आकाश के नीचे की सभी जातियों को भाग में दिया है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भाग में दिया है” का अनुवाद “ठहरा दिया है,” “बाँट दिया है,” या “अंश में दिया है” भी हो सकता है। इब्रानी पाठ अपने आप यह नहीं कहता कि यहोवा ने इनकी उपासना को स्वीकृति दी।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “सारे आकाश के नीचे”; यह मुहावरा समस्त संसार का बोध कराता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֶן
  choice: और सावधान रहना कि कहीं
  rationale: यह संयोजन किसी सम्भावित अनुचित परिणाम के विरुद्ध चेतावनी देता है; यह हिन्दी में उसके निषेधात्मक और सावधान करने वाले बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִּשָּׂא עֵינֶיךָ הַשָּׁמַיְמָה
  choice: आकाश की ओर आँखें उठाकर
  rationale: मूल इब्रानी मुहावरे और ऊपर की ओर दृष्टि करने की क्रिया को बनाए रखता है।
- source_word: כֹּל צְבָא הַשָּׁמַיִם
  choice: आकाश की सारी सेना
  rationale: צָבָא का मूल अर्थ सेना या समूह है; प्रसंग में यह सभी खगोलीय पिंडों की व्यवस्थित राशि को दर्शाता है, न कि केवल स्वर्गदूतों को।
- source_word: וְנִדַּחְתָּ
  choice: बहककर
  rationale: निफ़अल रूप यहाँ भटका दिए जाने या मूर्तिपूजा की ओर खिंच जाने का भाव देता है; ‘बहककर’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: उनके आगे दण्डवत् करो
  rationale: शारीरिक रूप से झुकने या भूमि पर गिरकर सम्मान देने की क्रिया को सुरक्षित रखता है, जबकि अगली क्रिया उसके आराधनात्मक अर्थ को स्पष्ट करती है।
- source_word: וַעֲבַדְתָּם
  choice: उनकी उपासना करने लगो
  rationale: עבד का सामान्य अर्थ सेवा करना है, पर इस उपासना-संबंधी प्रसंग में यह देवताओं की धार्मिक सेवा को दर्शाता है; ‘उपासना’ आधुनिक पाठक के लिए अर्थ स्पष्ट करती है।
- source_word: אֲשֶׁר חָלַק
  choice: इन्हें ... बाँट दिया है
  rationale: חלק के बाँटने या भाग ठहराने के अर्थ को बनाए रखता है और अपने आप यह नहीं कहता कि परमेश्वर ने उनकी उपासना स्वीकार की।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: לְכֹל הָעַמִּים
  choice: सब लोगों को
  rationale: עַמִּים के बहुवचन सामूहिक अर्थ को सामान्य और बोधगम्य हिन्दी में व्यक्त करता है।
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: आकाश के नीचे के
  rationale: मूल के ‘सारे आकाशों के नीचे’ मुहावरे को स्वाभाविक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: यहोवा द्वारा खगोलीय पिंडों को सब लोगों में बाँटने का अर्थ
  choice: वाक्य को इस रूप में रखा गया है कि परमेश्वर ने इन्हें सब लोगों को बाँटा है, पर यह नहीं जोड़ा गया कि उसने इनकी उपासना की अनुमति दी।
  alternative: इसे राष्ट्रों को खगोलीय पिंडों की उपासना के लिए सौंप देने अथवा केवल उनके सामान्य उपयोग हेतु नियुक्त करने के रूप में स्पष्ट करना।
  rationale: חלק बाँटने, भाग देने या निर्धारित करने का अर्थ दे सकता है। निकट प्रसंग मूर्तिपूजा को मना करता है, पर इस उपवाक्य में उसके पीछे का पूरा धर्मवैज्ञानिक आशय स्पष्ट नहीं किया गया; इसलिए अनुवाद मूल तनाव और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सामान्य पाठकों के लिए सुबोध रूप। ‘दण्डवत्’ उपासना के शारीरिक संकेत को और ‘उपासना’ धार्मिक सेवा को स्पष्ट करता है। पद में एकवचन सम्बोधन की अंतर्निहित शैली हिन्दी के सामान्य ‘तुम’ रूप में रखी गई है।
