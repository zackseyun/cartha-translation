source:
  edition: WLC
  text: פֶּ֨ן תַּשְׁחִת֔וּ/ן וַ/עֲשִׂיתֶ֥ם לָ/כֶ֛ם פֶּ֖סֶל תְּמוּנַ֣ת כָּל סָ֑מֶל תַּבְנִ֥ית זָכָ֖ר א֥וֹ נְקֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/016.yaml
  text: so that you do not act corruptly and make for yourselves a carved image[a], in the form of any figure, the likeness of male or female—
translation:
  language: hi
  text: कहीं ऐसा न हो कि तुम भ्रष्ट आचरण करो और अपने लिए कोई तराशी हुई मूर्ति[a] बना लो—किसी भी आकृति का रूप, पुरुष या स्त्री का प्रतिरूप।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कहीं ऐसा न हो कि तुम अपने आपको भ्रष्ट करो और अपने लिए कोई तराशी हुई मूर्ति बना लो—किसी भी आकृति का रूप, पुरुष या स्त्री का प्रतिरूप।”
    reason: תַּשְׁחִתוּן के संभावित आत्मवाचक भाव और संज्ञा-समूह की अधिक शाब्दिक रचना को सुरक्षित रखने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह अवांछित परिणाम के प्रति चेतावनी व्यक्त करता है; यह हिंदी में स्वाभाविक रूप से निषेधात्मक आशंका को बनाए रखता है।
- source_word: תַּשְׁחִתוּן
  choice: भ्रष्ट आचरण करके
  rationale: שׁחת के हिफ़ील रूप का यहाँ नैतिक और वाचा-संबंधी बिगाड़ का सक्रिय भाव है; यह अनुवाद उस भाव को बिना केवल आत्म-विनाश तक सीमित किए व्यक्त करता है।
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: अपने लिए ... बना लो
  rationale: לָכֶם का स्वहितार्थक भाव सुरक्षित रखा गया है, जो मनुष्यों द्वारा अपने लिए उपासना की वस्तु बनाने पर बल देता है।
- source_word: פֶּסֶל
  choice: खुदी हुई मूर्ति
  rationale: यह गढ़ी या तराशी गई प्रतिमा को दर्शाता है; आधुनिक हिंदी में यह ‘खुदी हुई प्रतिमा’ की अपेक्षा अधिक स्वाभाविक और ‘मूरत’ जैसे सीमित धार्मिक प्रयोग से अधिक स्पष्ट है।
- source_word: תְּמוּנַת כָּל סָמֶל
  choice: किसी भी आकृति के रूप में
  rationale: इब्रानी के रूप और प्रतिरूप-संबंधी शब्दों की परत को रखा गया है। סָמֶל को ‘मूर्ति’ कहने से פֶּסֶל के साथ अनावश्यक पुनरुक्ति और अर्थ का संकुचन होता; ‘आकृति’ दृश्य प्रतिनिधित्व के व्यापक अर्थ को बनाए रखती है।
- source_word: תַּבְנִית
  choice: समानता में
  rationale: यह नमूने, रूपरेखा या सदृश्यता को बताता है; ‘समानता’ पहले आए ‘रूप’ से भेद रखते हुए पुरुष या स्त्री के प्रतिरूप का भाव देता है।
- source_word: זָכָר אֹו נְקֵבָה
  choice: पुरुष या स्त्री
  rationale: इस प्रसंग में अगली पंक्तियों में पशु-पक्षियों की अलग श्रेणियाँ आती हैं, इसलिए यहाँ मानव नर और नारी के लिए स्वाभाविक हिंदी अभिव्यक्ति चुनी गई है।
theological_decisions:
- issue: मूर्तिपूजा-विरोधी शब्दावली का अनुवाद
  choice: פֶּסֶל के लिए ‘खुदी हुई मूर्ति’ और סָמֶל के लिए ‘आकृति’
  alternative: दोनों के लिए ‘मूर्ति’, अथवा סָמֶל के लिए ‘देवमूर्ति’
  rationale: इब्रानी में परस्पर जुड़े किंतु भिन्न चित्र-शब्दों का संचय है। उन्हें अलग-अलग प्रस्तुत करने से ठोस रूप से बनाई गई मूर्ति और उसके प्रतिनिधित्व—दोनों का भाव रहता है, जबकि ‘देवमूर्ति’ कहना पाठ की अपेक्षा अधिक संकीर्ण व्याख्या जोड़ सकता है।
- issue: תַּשְׁחִתוּן का सक्रिय अथवा आत्मवाचक भाव
  choice: भ्रष्ट आचरण करके
  alternative: अपने आपको भ्रष्ट करके
  rationale: हिफ़ील रूप दोनों भावों की ओर संकेत कर सकता है। मुख्य पाठ सक्रिय नैतिक आचरण को व्यक्त करता है; आत्मवाचक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कहीं ऐसा न हो कि’ चेतावनी के स्वर को स्वाभाविक हिंदी में व्यक्त करता है। ‘मूर्ति’, ‘आकृति’, ‘रूप’ और ‘समानता’ द्वारा मूल के निकटार्थी चित्र-शब्दों की क्रमिकता यथासंभव बनाए रखी गई है।
