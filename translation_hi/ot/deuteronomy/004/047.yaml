base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/047.yaml
  text: and they took possession of his land[a], and the land of Og king of Bashan—the two kings of the Amorites who were beyond the Jordan[b], toward the sunrise.
translation:
  language: hi
  text: और उन्होंने उसके देश और बाशान के राजा ओग के देश पर अधिकार कर लिया। ये अमोरियों के वे दो राजा थे, जो यरदन के पार[a], सूर्योदय की ओर[b] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यरदन की दूसरी ओर।” इब्रानी में यह एक प्रचलित भौगोलिक मुहावरा है; किस ओर को ‘पार’ कहा गया है, यह वर्णन के दृष्टिकोण पर निर्भर करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “सूर्योदय की ओर,” अर्थात पूर्व दिशा में।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: उन्होंने ... पर अधिकार कर लिया
  rationale: विजय और भू-अधिग्रहण के संदर्भ में ירשׁ का अर्थ किसी देश को अपने अधिकार में लेना है। यह अनुवाद केवल ‘उत्तराधिकार में पाना’ का भ्रामक अर्थ दिए बिना विजय के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַרְצוֹ
  choice: उसके देश
  rationale: पुल्लिंग एकवचन प्रत्यय पिछले संदर्भ में आए सीहोन की ओर संकेत करता है। ‘देश’ यहाँ उसके अधीन भूभाग के लिए सहज और सीधा शब्द है।
- source_word: אֶרֶץ עוֹג מֶלֶךְ הַבָּשָׁן
  choice: बाशान के राजा ओग के देश
  rationale: इब्रानी संबंध-शृंखला को स्पष्ट और स्वाभाविक हिन्दी क्रम में रखा गया है तथा אֶרֶץ के लिए पहले खंड के अनुरूप ‘देश’ प्रयुक्त हुआ है।
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: अमोरियों के उन दोनों राजाओं
  rationale: यह पद सीहोन और ओग को सामूहिक रूप से अमोरी राजाओं के रूप में पहचानता है। ‘उन दोनों’ पिछले दोनों राजाओं से संबंध स्पष्ट करता है।
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार
  rationale: यह यरदन के संबंध में प्रयुक्त पारंपरिक भौगोलिक मुहावरा है। ‘पार’ मूल की दृष्टिकोण-सापेक्षता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מִזְרַח שָׁמֶשׁ
  choice: सूर्योदय की ओर
  rationale: यह मूल की ठोस ‘सूर्योदय’ छवि को बनाए रखते हुए पूर्व दिशा का संकेत देता है।
