source:
  edition: WLC
  text: לֹ֣א תֹסִ֗פוּ עַל הַ/דָּבָר֙ אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ לִ/שְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֥ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/002.yaml
  text: You shall not add to the word that I am commanding you[a], nor shall you take away from it, so that you may keep the commandments of Yahweh your God that I am commanding you.
translation:
  language: hi
  text: जिस वचन की मैं तुम्हें आज्ञा दे रहा हूँ, उसमें न तो कुछ जोड़ना और न उसमें से कुछ घटाना, ताकि तुम अपने परमेश्वर याहवे[a] की उन आज्ञाओं का पालन करो जिनकी मैं तुम्हें आज्ञा दे रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: YHWH; परम्परागत रूप से ‘प्रभु’ अनूदित; वैकल्पिक लिप्यंतरण ‘यहोवा’।'
    reason: दिव्य नाम के पारम्परिक अनुवाद और वैकल्पिक लिप्यंतरण की जानकारी देना।
lexical_decisions:
- source_word: תֹסִפוּ עַל
  choice: उसमें ... कुछ जोड़ना
  rationale: हिफ़ील क्रिया יסף के साथ עַל का अर्थ यहाँ किसी बात में कुछ जोड़ना है। यह हिन्दी में स्वाभाविक है और मूल निषेध को स्पष्ट रखता है।
- source_word: הַדָּבָר
  choice: जिस वचन
  rationale: דבר यहाँ मूसा द्वारा कही जा रही आज्ञा की समूची विषयवस्तु को एक इकाई के रूप में दर्शाता है। ‘वचन’ मूल के एकवचन और कथित आदेश—दोनों भावों को बनाए रखता है।
- source_word: מְצַוֶּה
  choice: आज्ञा ... दे रहा हूँ
  rationale: वर्तमान कृदन्त तत्काल चल रही वाणी को दर्शाता है। हिन्दी का प्रगतिशील रूप इस प्रसंग में स्वाभाविक है।
- source_word: תִגְרְעוּ מִמֶּנּוּ
  choice: उसमें से कुछ घटाना
  rationale: גרע का अर्थ घटाना या कम करना है। ‘घटाना’ पहले खंड के ‘जोड़ना’ के साथ स्पष्ट विरोधी जोड़ी बनाता है।
- source_word: לִשְׁמֹר
  choice: ताकि ... पालन करो
  rationale: ל के साथ क्रियार्थक संज्ञा यहाँ उद्देश्य या अपेक्षित परिणाम व्यक्त करती है। ‘ताकि’ उस सम्बन्ध को स्पष्ट करता है, जबकि ‘पालन करो’ covenantal आज्ञाओं के संदर्भ में स्वाभाविक हिन्दी है।
- source_word: מִצְוֺת
  choice: आज्ञाओं
  rationale: बहुवचन מצות के लिए ‘आज्ञाएँ’ वाचा और व्यवस्था के संदर्भ में सटीक, परिचित और गरिमापूर्ण शब्द है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम YHWH को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वत्तापूर्ण लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: YHWH के साथ वाचा-सूत्र में אֱלֹהִים का अर्थ एकवचन है। सम्बन्धसूचक ‘अपने’ हिन्दी वाक्य में ‘तुम्हारे परमेश्वर’ का भाव स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम YHWH है। ‘याहवे’ उसे नाम के रूप में बनाए रखता है; पाठकों को पारम्परिक और वैकल्पिक रूप पादटिप्पणी में बताए गए हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है; शैली सीधी, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। एकवचन ‘वचन’ तथा ‘जोड़ना/घटाना’ की समांतरता मूल इब्रानी संरचना को सुरक्षित रखती है।
