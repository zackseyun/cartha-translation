lexical_decisions:
- source_word: וְזֹאת
  choice: और यह वह
  rationale: संयोजक और संकेतवाचक पद अगले खंड का परिचय देते हैं। यह रूप इब्रानी पाठ से संबंध और प्रस्तुतिकरण—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַתּוֹרָה
  choice: व्यवस्था
  rationale: यहाँ תּוֹרָה मूसा द्वारा प्रस्तुत वाचा-संबंधी विधि और शिक्षा को सूचित करती है। ‘व्यवस्था’ हिन्दी बाइबल की परिचित, संदर्भानुकूल अभिव्यक्ति है; केवल ‘शिक्षा’ कहना इसके विधिक पक्ष को कम कर सकता है।
- source_word: אֲשֶׁר
  choice: जो
  rationale: संबंधवाचक उपवाक्य को आधुनिक हिन्दी में स्वाभाविक ढंग से जोड़ता है।
- source_word: שָׂם
  choice: रखी थी
  rationale: שׂוּם का मूल अर्थ ‘रखना/स्थापित करना’ है। לִפְנֵי के साथ यह लोगों के सामने औपचारिक रूप से प्रस्तुत करने का भाव देता है; स्त्रीलिंग क्रिया ‘व्यवस्था’ से मेल खाती है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह पद यहाँ श्रोताओं के समक्ष व्यवस्था प्रस्तुत किए जाने को व्यक्त करता है और हिन्दी में सहज है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पद का रूपगत रूप से निकट अनुवाद है और उसके पुल्लिंग बहुवचन को सुरक्षित रखता है, यद्यपि संदर्भ में यह पूरे राष्ट्र का सामूहिक नाम है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל में लिंगयुक्त राष्ट्रीय संबोधन
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग; इस्राएल की सन्तान
  rationale: मूल पद पुल्लिंग बहुवचन है, पर वाचा-संबंधी राष्ट्रीय संबोधन के रूप में पूरे समुदाय को सूचित करता है। मुख्य पाठ में उसके रूप को बनाए रखा गया है और अधिक मुहावरेदार सामूहिक विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘व्यवस्था’ परिचित बाइबलीय शब्द है। वाक्य के अंत का द्विबिंदु इसे आगे आने वाले खंड की भूमिका के रूप में चिह्नित करता है।
