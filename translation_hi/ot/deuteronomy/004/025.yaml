source:
  edition: WLC
  text: כִּֽי תוֹלִ֤יד בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים וְ/נוֹשַׁנְתֶּ֖ם בָּ/אָ֑רֶץ וְ/הִשְׁחַתֶּ֗ם וַ/עֲשִׂ֤יתֶם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל וַ/עֲשִׂיתֶ֥ם הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/025.yaml
  text: When you father children and grandchildren[a], and you have grown old in the land, and you act corruptly and make a carved image in the form of anything, and do what is evil in the eyes of Yahweh your God[c][b], provoking him to anger—
translation:
  language: hi
  text: जब तुम्हारे बच्चे और नाती-पोते[a] हो जाएँ, और तुम उस देश में रहते-रहते बूढ़े हो जाओ[b], और भ्रष्ट आचरण करके किसी भी वस्तु के रूप में तराशी हुई प्रतिमा बनाओ[c], और अपने परमेश्वर याहवे की दृष्टि में बुरा काम करके उसे क्रोध दिलाओ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बेटे और बेटों के बेटे।” यहाँ पुल्लिंग वंशज-संज्ञाएँ संभवतः आगे की पीढ़ियों की संतानों के लिए व्यापक अर्थ में प्रयुक्त हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “उस देश में बहुत समय से बसे रहो।” इब्रानी क्रिया बूढ़े हो जाने या लंबे समय से बसे होने पर बल दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: या, “किसी भी वस्तु की समानता में”; अथवा, “किसी भी आकृति में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ यह शब्द आगामी परिस्थिति/समय की शर्त प्रस्तुत करता है, जिसका परिणाम अगले पद में आता है; इसलिए ‘जब’ स्वाभाविक है।
- source_word: תוֹלִיד
  choice: तुम्हारे ... हो जाएँ
  rationale: हिफ़ील रूप संतान उत्पन्न करने का भाव रखता है। हिंदी में ‘तुम्हारे बच्चे ... हो जाएँ’ सहज है और संबोधन का अर्थ बनाए रखता है।
- source_word: בָּנִים וּבְנֵי בָנִים
  choice: बच्चे और नाती-पोते
  rationale: शाब्दिक रूप से ‘बेटे और बेटों के बेटे’; प्रसंग में यह कई पीढ़ियों की संतानों के लिए प्रतिनिधिक प्रयोग है।
- source_word: וְנוֹשַׁנְתֶּם בָּאָרֶץ
  choice: उस देश में रहते-रहते पुराने पड़ जाओ
  rationale: क्रिया पुराने हो जाने और लंबे समय से बसे होने—दोनों भावों को समेटती है; यह हिंदी अभिव्यक्ति उस चित्रात्मकता और अवधि को बनाए रखती है।
- source_word: וְהִשְׁחַתֶּם
  choice: भ्रष्ट आचरण करके
  rationale: यहाँ שׁחת का हिफ़ील वाचा-विरोधी भ्रष्ट व्यवहार को दर्शाता है; अनावश्यक आत्मवाचक अर्थ जोड़े बिना ‘भ्रष्ट आचरण’ स्वाभाविक है।
- source_word: פֶּסֶל
  choice: खुदी हुई मूर्ति
  rationale: यह शब्द तराशकर या खोदकर बनाई गई प्रतिमा को दर्शाता है; ‘मूर्ति’ मात्र की अपेक्षा यह निर्माण-विधि को भी व्यक्त करता है।
- source_word: תְּמוּנַת כֹּל
  choice: किसी भी वस्तु के रूप की
  rationale: यह वाक्यांश किसी भी प्रकार की आकृति या समानता का व्यापक निषेध बताता है।
- source_word: הָרַע בְּעֵינֵי
  choice: की दृष्टि में बुरा काम
  rationale: यह इब्रानी मूल्यांकन-सूचक मुहावरे को हिंदी में स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; उसे उपाधि से बदलने के बजाय हिंदी में प्रचलित निकट लिप्यंतरण दिया गया है।
- source_word: לְהַכְעִיסוֹ
  choice: उसे क्रोध दिलाओ
  rationale: यह प्रयोजन/परिणामसूचक क्रियारूप किसी को क्रोधित करने का कारण बनने का भाव स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘यहवे’ उसे उपाधि में बदले बिना आधुनिक हिंदी में निकटता से लिप्यंतरित करता है।
- issue: בָּנִים וּבְנֵי בָנִים में पुल्लिंग वंशज-शब्दावली
  choice: बच्चे और नाती-पोते
  alternative: बेटे और पोते
  rationale: रूपतः शब्द पुल्लिंग हैं, पर इस वाचा-संबंधी चेतावनी में वे आगे की पीढ़ियों की संतानों का प्रतिनिधिक उल्लेख करते हैं; मुख्य पाठ में व्यापक आशय और पादटिप्पणी में शाब्दिक विकल्प सुरक्षित रखा गया है।
- issue: וְנוֹשַׁנְתֶּם का कालगत और चित्रात्मक तनाव
  choice: रहते-रहते पुराने पड़ जाओ
  alternative: देश में बहुत समय से बस जाओ
  rationale: चुना हुआ रूप पुराने होने और लंबे समय तक बसे रहने, दोनों संभावित भावों को एक साथ सुनाई देता रहने देता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण पर सहज शैली रखी गई है। एकवचन ‘तुम’ से आरंभ होकर समुदाय-सूचक बहुवचन क्रियाओं की मूल इब्रानी अदला-बदली को हिंदी में कृत्रिम रूप से नहीं दोहराया गया; वाक्य को सामूहिक संबोधन के रूप में सहज रखा गया है। पद अगले पद में पूरी होने वाली चेतावनी की भूमिका है, इसलिए अंत में दीर्घ विराम-चिह्न रखा गया है।
