  text: בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בַּ/גַּ֗יְא מ֚וּל בֵּ֣ית פְּע֔וֹר בְּ/אֶ֗רֶץ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן אֲשֶׁ֨ר הִכָּ֤ה מֹשֶׁה֙ וּ/בְנֵֽי יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/046.yaml
  text: beyond the Jordan[a], in the valley opposite Beth-peor, in the land of Sihon king of the Amorites, who lived in Heshbon, whom Moses and the sons of Israel struck down when they came out from Egypt.
translation:
  language: hi
  text: यरदन के पार[a], बेत-पोर के सामने की घाटी में, एमोरियों के राजा सीहोन के देश में, जो हेशबोन में रहता था और जिसे मूसा और इस्राएल के पुत्रों[b] ने मिस्र से निकलते समय मार गिराया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद पिछले वाक्य को आगे बढ़ाता है, जो पद 44 में आरम्भ होता है।
    reason: इस पद का इब्रानी पाठ स्वतंत्र वाक्य नहीं है; हिन्दी में भी इसके वाक्यगत संबंध को स्पष्ट करना आवश्यक है।
  - marker: b
    text: या, “इस्राएलियों ने।” इब्रानी में “इस्राएल के पुत्रों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार
  rationale: यह पदबंध वक्ता के भौगोलिक दृष्टिकोण से यरदन की दूसरी ओर के क्षेत्र को दर्शाता है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: בַּגַּיְא מוּל בֵּית פְּעוֹר
  choice: बेत-पोर के सामने की घाटी में
  rationale: גַּיְא के लिए ‘घाटी’ सामान्य और उपयुक्त भौगोलिक शब्द है, और מוּל स्थानगत आमने-सामने या सामने होने का बोध देता है।
- source_word: בְּאֶרֶץ סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: एमोरियों के राजा सीहोन के देश में
  rationale: अर्थ-संबंध को स्वाभाविक हिन्दी क्रम में रखा गया है और אֶרֶץ का सामान्य अर्थ ‘देश’ लिया गया है।
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: जो हेशबोन में रहता था
  rationale: יוֹשֵׁב यहाँ निवास को व्यक्त करता है; ‘रहता था’ आधुनिक हिन्दी में सहज है।
- source_word: אֲשֶׁר הִכָּה
  choice: जिसे ... मार गिराया था
  rationale: נכה का युद्ध-संदर्भित अर्थ केवल पराजित करने से अधिक प्रबल है; ‘मार गिराया’ प्रहार और घातक विजय दोनों को व्यक्त करता है।
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: और इस्राएल के पुत्रों ने
  rationale: मूल का शाब्दिक पुरुषवाची सामूहिक पदबंध सुरक्षित रखा गया है; अधिक मुहावरेदार सामूहिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: मिस्र से निकलते समय
  rationale: पूर्वसर्गयुक्त infinitive construct की कालगत भूमिका को सहज हिन्दी में व्यक्त करता है और निर्गमन-संदर्भ बनाए रखता है।
theological_decisions:
- issue: וּבְנֵי יִשְׂרָאֵל में लिंगसूचक वाचाई सामूहिक नाम
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल इब्रानी में ‘इस्राएल के पुत्र’ स्पष्टतः पुल्लिंग बहुवचन construct है। मुख्य पाठ में उस रूप को बनाए रखा गया है, जबकि सामूहिक जातीय अर्थ को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। स्थान-नामों का लिप्यंतरण किया गया है। मुख्य पाठ में [a] है; [b] पादटिप्पणी के लिए मुख्य पाठ में चिह्न अपेक्षित होने के कारण ‘इस्राएल के पुत्रों[b]’ होना चाहिए।
