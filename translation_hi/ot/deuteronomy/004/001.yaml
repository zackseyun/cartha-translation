id: DEU.4.1
reference: Deuteronomy 4:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יִשְׂרָאֵ֗ל שְׁמַ֤ע אֶל הַֽ/חֻקִּים֙ וְ/אֶל הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָֽנֹכִ֛י מְלַמֵּ֥ד אֶתְ/כֶ֖ם לַ/עֲשׂ֑וֹת לְמַ֣עַן תִּֽחְי֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֧ר יְהוָ֛ה אֱלֹהֵ֥י אֲבֹתֵי/כֶ֖ם נֹתֵ֥ן לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/001.yaml
  text: And now[a], Israel, listen to the statutes and the judgments that I am teaching you to do, so that you may live and go in and take possession of the land that Yahweh, the God of your fathers[c][b], is giving to you.
translation:
  language: hi
  text: और अब, हे इस्राएल, उन विधियों और न्याय-विधानों[a] को सुन, जिन्हें मैं तुम्हें पालन करने के लिए सिखा रहा हूँ, ताकि तुम जीवित रहो, उस देश में प्रवेश करो और उस पर अधिकार कर लो[b], जिसे याहवे[c], तुम्हारे पुरखाओं का परमेश्वर, तुम्हें दे रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नियमों और न्याय-संबंधी आदेशों।’
    reason: lexical_alternative
  - marker: b
    text: या ‘उसे अपने अधिकार में ले लो’ अथवा ‘उसे विरासत में पाओ।’
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी: ‘YHWH’; परंपरागत रूप से इसका अनुवाद ‘प्रभु’ किया जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: यह पिछले प्रसंग से उपदेश का संबंध बनाए रखते हुए विचार के परिवर्तन को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁמַע
  choice: सुन
  rationale: אֶל के साथ यहाँ ध्यान लगाकर सुनने का सीधा अर्थ है। केवल ‘आज्ञा मान’ कहना निहितार्थ को आवश्यकता से अधिक स्पष्ट कर देता; आगे ‘पालन करने’ से आज्ञाकारिता का भाव प्रकट होता है।
- source_word: הַחֻקִּים
  choice: विधियों
  rationale: व्यवस्था-संबंधी संदर्भ में यह חֻקִּים का स्वाभाविक हिन्दी प्रतिशब्द है और अगले पद से इसका भेद बनाए रखता है।
- source_word: הַמִּשְׁפָּטִים
  choice: न्याय-विधानों
  rationale: यह מִשְׁפָּטִים के कानूनी और न्यायिक भाव को व्यक्त करता है तथा חֻקִּים से शब्दगत भेद बनाए रखता है।
- source_word: מְלַמֵּד
  choice: सिखा रहा हूँ
  rationale: इब्रानी कृदंत इस प्रसंग में मूसा की जारी वर्तमान शिक्षा को दर्शाता है।
- source_word: לַעֲשׂוֹת
  choice: पालन करने के लिए
  rationale: शाब्दिक ‘करने’ का आशय यहाँ दी गई विधियों को व्यवहार में लाना है; ‘पालन करना’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְמַעַן תִּחְיוּ
  choice: ताकि तुम जीवित रहो
  rationale: यह उद्देश्य अथवा अभिप्रेत परिणाम को स्पष्ट करता है और जीवन से जुड़े वाचा-संबंधी कथन को खुला रखता है।
- source_word: וּבָאתֶם
  choice: उस देश में प्रवेश करो
  rationale: संदर्भ में क्रिया प्रतिज्ञात देश के भीतर जाने को बताती है; हिन्दी में कर्म को स्पष्ट करने से वाक्य स्वाभाविक बनता है।
- source_word: וִירִשְׁתֶּם
  choice: उस पर अधिकार कर लो
  rationale: भूमि के संदर्भ में ירשׁ का ठोस अर्थ उसे अपने अधिकार में लेना है; ‘विरासत में पाना’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: यहाँ शब्द प्रतिज्ञात भूभाग को सूचित करता है। हिन्दी में ‘उस देश में प्रवेश’ अधिक स्वाभाविक है, जबकि भूमि-संबंधी अर्थ बना रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम YHWH को लिप्यंतरित रूप में सुरक्षित रखा गया है।
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: तुम्हारे पुरखाओं का परमेश्वर
  rationale: यह पूर्वजों के साथ वाचा का सूत्रवत संबंध बनाए रखता है और आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे सामान्य उपाधि में बदले बिना मूल की विशिष्टता बनाए रखता है।
- issue: לְמַעַן के बाद आने वाली क्रियाओं का संबंध
  choice: जीवित रहने, प्रवेश करने और अधिकार लेने को उद्देश्य/अभिप्रेत परिणाम की एक क्रमिक शृंखला के रूप में प्रस्तुत किया
  alternative: केवल ‘जीवित रहो’ को उद्देश्य मानकर बाद की क्रियाओं को स्वतंत्र परिणाम के रूप में अनूदित करना
  rationale: इब्रानी वाक्य-विन्यास दोनों प्रकार की सूक्ष्मता की अनुमति देता है। हिन्दी में समानांतर क्रियाओं की शृंखला मूल का प्रवाह बनाए रखती है और कारणात्मक संबंध को आवश्यकता से अधिक कठोर नहीं बनाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। एक सामूहिक इकाई के रूप में इस्राएल को संबोधित करने के कारण ‘तुम’ और एकवचन आज्ञार्थ ‘सुन’ का प्रयोग किया गया है; आगे की क्रियाएँ पूरे समुदाय पर लागू हैं। कानूनी शब्द-युग्म का भेद बनाए रखने के लिए ‘विधियों और न्याय-विधानों’ का चयन किया गया है।
