  text: וּ/שְׁמַרְתֶּם֮ וַ/עֲשִׂיתֶם֒ כִּ֣י הִ֤וא חָכְמַתְ/כֶם֙ וּ/בִ֣ינַתְ/כֶ֔ם לְ/עֵינֵ֖י הָ/עַמִּ֑ים אֲשֶׁ֣ר יִשְׁמְע֗וּ/ן אֵ֚ת כָּל הַ/חֻקִּ֣ים הָ/אֵ֔לֶּה וְ/אָמְר֗וּ רַ֚ק עַם חָכָ֣ם וְ/נָב֔וֹן הַ/גּ֥וֹי הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/006.yaml
  text: So keep them and do them[a], for this is your wisdom and your understanding in the sight of the peoples, who will hear all these statutes and say[b], ‘Surely this great nation is a wise and understanding people.’
translation:
  language: hi
  text: इसलिए उन्हें मानो और उनका पालन करो[a], क्योंकि अन्य लोगों की दृष्टि में यही तुम्हारी बुद्धि और समझ होगी। वे इन सब विधियों को सुनकर कहेंगे, “निश्चय ही[b] यह महान राष्ट्र बुद्धिमान और समझदार जनता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्हें संभालकर रखना और करना”; यहाँ भाव है कि इन विधियों को ध्यानपूर्वक मानकर व्यवहार में पूरा किया जाए।
    reason: lexical_alternative
  - marker: b
    text: '“निश्चय ही” के लिए प्रयुक्त इब्रानी शब्द का अधिक शाब्दिक अर्थ “केवल” भी हो सकता है: “केवल यही महान राष्ट्र बुद्धिमान और समझदार जनता है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם
  choice: उन्हें मानना और उनका पालन करना
  rationale: दोनों क्रियाओं का संबंध बनाए रखते हुए पहला आदेशों को ध्यानपूर्वक मानने और दूसरा उन्हें व्यवहार में पूरा करने पर बल देता है। आधुनिक हिन्दी में यह युग्म स्वाभाविक है।
- source_word: כִּי הִוא
  choice: क्योंकि यही
  rationale: स्त्रीलिंग एकवचन सर्वनाम का संकेत पहले कही गई विधियों को मानने और उनका पालन करने की समग्र बात की ओर है; ‘यही’ उस सामूहिक संदर्भ और बल को व्यक्त करता है।
- source_word: חָכְמַתְכֶם וּבִינַתְכֶם
  choice: तुम्हारी बुद्धि और समझ
  rationale: 'दो अलग किंतु संबंधित धारणाओं को बनाए रखता है: व्यावहारिक नैतिक बुद्धि और विवेकपूर्ण समझ।'
- source_word: לְעֵינֵי הָעַמִּים
  choice: देश-देश के लोगों की दृष्टि में
  rationale: इब्रानी मुहावरे के सार्वजनिक और प्रेक्षणीय भाव को स्वाभाविक हिन्दी में व्यक्त करता है। ‘देश-देश के लोग’ עמים को बाद के גוי ‘जाति’ से अलग रखता है।
- source_word: כָּל הַחֻקִּים הָאֵלֶּה
  choice: इन सब विधियों
  rationale: חֻקִּים के वैधानिक अर्थ को ‘विधियाँ’ स्पष्ट और वर्तमान हिन्दी में व्यक्त करता है; ‘नियम’ भी संभव है।
- source_word: רַק
  choice: निश्चय ही
  rationale: यहाँ רַק निष्कर्ष को बल देने वाला विस्मयात्मक प्रयोग प्रतीत होता है। शाब्दिक ‘केवल’ संभव है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: עַם חָכָם וְנָבוֹן
  choice: बुद्धिमान और समझदार लोग
  rationale: पहले आए ‘बुद्धि और समझ’ से शब्दार्थगत संबंध बनाए रखते हुए हिन्दी में जाति के लोगों के लिए स्वाभाविक विधेय देता है।
- source_word: הַגּוֹי הַגָּדוֹל הַזֶּה
  choice: यह महान जाति
  rationale: גוי का सामूहिक राष्ट्रीय अर्थ और विशेषण की महत्ता बिना राष्ट्रीय श्रेष्ठता का अतिरिक्त दावा जोड़े संरक्षित है।
theological_decisions:
- issue: आज्ञापालन और बुद्धि का संबंध
  choice: विधियों को मानना और उनका पालन करना अन्य लोगों के सामने इस्राएल की बुद्धि और समझ के रूप में प्रकट होता है।
  alternative: ‘यही’ केवल विधियों को स्वयं उनकी बुद्धि और समझ बताता है, उनके पालन को नहीं।
  rationale: वाक्यरचना ‘मानना और पालन करना’ को ‘क्योंकि यही तुम्हारी बुद्धि और समझ’ से जोड़ती है। अनुवाद विधियों और आज्ञापालन के निकट संबंध को बनाए रखता है, पर योग्यता या राष्ट्रीय श्रेष्ठता का कोई बाद का धर्मशास्त्रीय निष्कर्ष नहीं जोड़ता।
- issue: רַק का बल
  choice: निश्चय ही
  alternative: केवल
  rationale: संदर्भ में यह लोगों की प्रशंसात्मक उद्घोषणा को बल देता है, फिर भी मूल शब्द का सामान्य सीमाबोधक अर्थ वास्तविक विकल्प है और पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सहज। सामूहिक ‘तुम’ को बनाए रखा गया है। עמים और גוי का भेद क्रमशः ‘देश-देश के लोग’ और ‘जाति’ से दर्शाया गया है।
