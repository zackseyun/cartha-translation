  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। यह पद पिछले वाक्य की निरंतरता में नगरों की सूची है, इसलिए हिन्दी पाठ भी पूर्ण स्वतंत्र वाक्य के बजाय सूचीगत संरचना बनाए रखता है। ‘पठार’ भौगोलिक अर्थ को सीधे व्यक्त करता है, अतः अलग पाठ-टिप्पणी आवश्यक नहीं मानी गई।
