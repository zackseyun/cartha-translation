  yaml_path: translation/ot/deuteronomy/004/043.yaml
  text: Bezer in the wilderness[a], in the land of the tableland, for the Reubenite; and Ramoth in Gilead for the Gadite; and Golan in Bashan for the Manassite.
translation:
  language: hi
  text: रूबेनियों के लिए पठारी देश के वीराने में बेसेर को; गादियों के लिए गिलाद में रामोत को; और मनश्शियों के लिए बाशान में गोलान को।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּצֶר
  choice: बेसेर
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण; इसका अनुवाद नहीं किया गया।
- source_word: בַּמִּדְבָּר
  choice: वीराने में
  rationale: מִדְבָּר निर्जन खुले भूभाग या वनहीन प्रदेश को दर्शाता है; यहाँ आधुनिक और स्वाभाविक हिन्दी में ‘वीराना’ इस भौगोलिक भाव को व्यक्त करता है।
- source_word: בְּאֶרֶץ הַמִּישֹׁר
  choice: पठार के देश में
  rationale: מִישֹׁר समतल अथवा पठारी भूभाग को सूचित करता है; यरदन-पार के ऊँचे समतल प्रदेश के संदर्भ में ‘पठार’ भ्रामक ‘मैदान’ से अधिक सटीक है।
- source_word: לָרֻאוּבֵנִי
  choice: रूबेनियों के लिए
  rationale: एकवचन जातिवाचक रूप यहाँ गोत्र के लोगों के लिए सामूहिक अर्थ रखता है; हिन्दी में बहुवचन स्वाभाविक और स्पष्ट है।
- source_word: רָאמֹת
  choice: रामोत
  rationale: स्थान-नाम का लिप्यंतरण।
- source_word: בַּגִּלְעָד
  choice: गिलाद में
  rationale: क्षेत्रीय नाम को हिन्दी में प्रचलित बाइबलीय रूप में रखा गया।
- source_word: לַגָּדִי
  choice: गादियों के लिए
  rationale: एकवचन जातिवाचक का सामूहिक गोत्रीय अर्थ स्वाभाविक हिन्दी बहुवचन से व्यक्त किया गया।
- source_word: גּוֹלָן
  choice: गोलान
  rationale: स्थान-नाम का लिप्यंतरण।
- source_word: בַּבָּשָׁן
  choice: बाशान में
  rationale: क्षेत्रीय नाम का हिन्दी लिप्यंतरण।
- source_word: לַמְנַשִּׁי
  choice: मनश्शे के लोगों के लिए
  rationale: हिन्दी में ‘मनश्शे के लोगों’ से गोत्रीय संबंध स्पष्ट और सहज ढंग से व्यक्त होता है।
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: को ... को ... और ... को
  rationale: हिब्रू कर्म-सूचकों को हिन्दी के ‘को’ और समन्वित सूची-रचना से दर्शाया गया।
