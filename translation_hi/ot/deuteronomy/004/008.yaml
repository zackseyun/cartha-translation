source:
  edition: WLC
  text: וּ/מִי֙ גּ֣וֹי גָּד֔וֹל אֲשֶׁר ל֛/וֹ חֻקִּ֥ים וּ/מִשְׁפָּטִ֖ים צַדִּיקִ֑ם כְּ/כֹל֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/008.yaml
  text: And what great nation is there that has statutes and judgments as righteous as all this law that I am setting before you today?[a]
translation:
  language: hi
  text: और ऐसा कौन-सा बड़ा राष्ट्र है, जिसके नियम और न्याय-विधान इस सारी व्यवस्था के समान न्यायपूर्ण हों, जिसे मैं आज तुम्हारे सामने रख रहा हूँ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शिक्षा”; इब्रानी तोराह का अर्थ “शिक्षा” भी हो सकता है, यद्यपि यहाँ “नियम और न्याय-विधान” के कारण संदर्भ विशेष रूप से कानूनी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: और ऐसा कौन-सा ... है
  rationale: यह एक आलंकारिक प्रश्न है। גּוֹי के साथ हिंदी में ‘कौन-सा राष्ट्र’ स्वाभाविक है और पिछले कथन से संबंध दिखाने के लिए ‘और’ रखा गया है।
- source_word: גּוֹי גָּדוֹל
  choice: बड़ा राष्ट्र
  rationale: यहाँ גּוֹי एक जातीय-राजनीतिक जनसमुदाय को दर्शाता है; आधुनिक हिंदी में ‘राष्ट्र’ उपयुक्त है।
- source_word: חֻקִּים
  choice: नियम
  rationale: यह निर्धारित कानूनी प्रावधानों का बोध कराता है। ‘नियम’ सामान्य पाठक के लिए स्पष्ट है और अगले पद के ‘न्याय-विधान’ से अलग भी रहता है।
- source_word: וּמִשְׁפָּטִים
  choice: और न्याय-विधान
  rationale: מִשְׁפָּטִים में न्यायिक निर्णयों और कानूनी विधानों का भाव है; ‘न्याय-विधान’ इस कानूनी विशेषता को सुरक्षित रखता है।
- source_word: צַדִּיקִם
  choice: न्यायपूर्ण
  rationale: यह नियमों और न्याय-विधानों के सही और न्यायसंगत होने को बताता है। हिंदी में ‘धर्मी’ यहाँ व्यक्तियों के गुण जैसा लग सकता है, जबकि ‘न्यायपूर्ण’ नैतिक-कानूनी भाव स्पष्ट करता है।
- source_word: כְּכֹל הַתּוֹרָה הַזֹּאת
  choice: इस सारी व्यवस्था के समान
  rationale: כְּכֹל तुलना व्यक्त करता है और הַתּוֹרָה הַזֹּאת संपूर्ण प्रस्तुत व्यवस्था की ओर संकेत करता है। हिंदी वाक्य-विन्यास में विशेषण ‘न्यायपूर्ण’ को तुलना के साथ रखने से मूल अर्थ स्पष्ट रहता है।
- source_word: נֹתֵן לִפְנֵיכֶם
  choice: तुम्हारे सामने रख रहा हूँ
  rationale: शाब्दिक ‘देना’ के बजाय यह हिंदी मुहावरा लोगों के सामने व्यवस्था प्रस्तुत करने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह आधुनिक हिंदी में समय-संबंधी बल को सीधे और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: תּוֹרָה का अनुवाद
  choice: व्यवस्था
  alternative: शिक्षा
  rationale: תּוֹרָה का व्यापक अर्थ ‘शिक्षा’ हो सकता है, पर इस पद में ‘नियम’ और ‘न्याय-विधान’ का निकट संदर्भ कानूनी अर्थ को प्रमुख बनाता है। ‘व्यवस्था’ हिंदी बाइबलीय प्रयोग में इस कानूनी संहिता को स्पष्ट करता है; व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। आलंकारिक प्रश्न और मूल की कानूनी शब्दावली के बीच का भेद बनाए रखा गया है; कठिन शाब्दिक संरचना को स्वाभाविक हिंदी तुलना में बदला गया है।
