translation:
  language: hi
  text: पृथ्वी पर रहने वाले किसी भी पशु की आकृति[a], और आकाश में उड़ने वाले किसी भी पंख वाले पक्षी की आकृति[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आकृति’ के लिए ‘समानता’ या ‘प्रतिरूप’ भी सम्भव है; यहाँ आशय उपासना के लिए बनाई गई किसी जीव की प्रतिकृति से है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से इब्रानी में ‘आकाशों में’ है; इस प्रसंग में इसका अर्थ वह दृश्यमान आकाश है जिसमें पक्षी उड़ते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: आकृति
  rationale: इस प्रसंग में यह उपासना के लिए बनाई जानेवाली किसी जीव की दृश्य प्रतिकृति या रूप को दर्शाता है। ‘आकृति’ दोनों occurrences में स्वाभाविक है और इब्रानी की पुनरावृत्ति बनाए रखता है।
- source_word: כָּל
  choice: किसी भी
  rationale: एकवचन वर्गवाचक संज्ञाओं के साथ निषेध की व्यापकता को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּהֵמָה
  choice: पशु
  rationale: यहाँ पृथ्वी पर रहनेवाले जीवों की व्यापक श्रेणी अभिप्रेत है, केवल पालतू मवेशी नहीं।
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: पृथ्वी पर रहनेवाले
  rationale: जीवों को उनके क्षेत्र के अनुसार बाँटनेवाले प्रसंग में पृथ्वी और आकाश का स्थानगत अंतर स्पष्ट करता है; ‘रहनेवाले’ हिन्दी में संबंधवाचक वाक्यांश को सहज बनाता है।
- source_word: צִפּוֹר כָּנָף
  choice: पंखवाला पक्षी
  rationale: צִפּוֹר को ‘पक्षी’ और כָּנָף की वर्णनात्मक शक्ति को ‘पंखवाला’ के रूप में सुरक्षित रखता है।
- source_word: תָּעוּף
  choice: उड़नेवाले
  rationale: सामान्य वर्ग का वर्णन करनेवाले इब्रानी अपूर्ण क्रियारूप का स्वाभाविक हिन्दी रूप है।
- source_word: בַּשָּׁמַיִם
  choice: आकाश में
  rationale: इब्रानी बहुवचन שָׁמַיִם इस संदर्भ में उस दृश्यमान आकाश को दर्शाता है जिसमें पक्षी उड़ते हैं; हिन्दी में ‘आकाश’ स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: תַּבְנִית का आशय
  choice: आकृति
  alternative: प्रतिमा / समानता
  rationale: शब्द दृश्य रूप या बनाई गई प्रतिकृति को सूचित करता है, पर पद अकेले उसकी वस्तुगत प्रकृति को पूरी तरह निश्चित नहीं करता। ‘आकृति’ मूर्तिपूजा के प्रसंग को बनाए रखती है, बिना किसी विशिष्ट धार्मिक व्याख्या को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्यांश को आसपास के पदों की निषेध-सूची से जुड़ा हुआ मानकर अंत में अल्पविराम रखा गया है। स्रोत की समानांतर रचना और ‘आकृति’ की पुनरावृत्ति सुरक्षित रखी गई है।
