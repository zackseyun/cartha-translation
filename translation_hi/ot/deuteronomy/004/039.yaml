source:
  edition: WLC
  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם וַ/הֲשֵׁבֹתָ֮ אֶל לְבָבֶ/ךָ֒ כִּ֤י יְהוָה֙ ה֣וּא הָֽ/אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת אֵ֖ין עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/039.yaml
  text: So know today[a], and take it to your heart, that Yahweh, he is God in the heavens above and on the earth beneath[b]; there is no other.
translation:
  language: hi
  text: इसलिए आज[a] जान लो और इसे अपने हृदय में उतार लो कि याहवे ही परमेश्वर है, ऊपर आकाश में और नीचे पृथ्वी पर; उसके सिवा कोई और नहीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, ‘इसे अपने हृदय में वापस लाओ’ या ‘हृदय में धारण करो’; यह किसी सत्य को भीतर से स्वीकार करने और अपनाने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या अधिक औपचारिक रूप में, ‘उसके अतिरिक्त कोई नहीं है।’
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: इसलिए आज यह जान लो
  rationale: संदर्भ में संयोजक वाव निष्कर्षसूचक है और पूर्ण क्रिया का बल उपदेशात्मक है; यह रूप वर्तमान आह्वान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ
  choice: इसे अपने हृदय में बसा लो
  rationale: शाब्दिक अर्थ ‘अपने हृदय की ओर लौटा लाना’ है, पर यह मुहावरा किसी सत्य को भीतर स्वीकार कर दृढ़ता से धारण करने का संकेत देता है। ‘हृदय’ मूल बाइबलीय बिंब को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित नामरूप ‘यहोवा’ चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: הוּא הָאֱלֹהִים
  choice: यहोवा ही परमेश्वर है
  rationale: बलाघाती सर्वनाम הוּא को हिन्दी के ‘ही’ से स्वाभाविक और स्पष्ट रूप में व्यक्त किया गया है।
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל־הָאָרֶץ מִתָּחַת
  choice: ऊपर आकाश में और नीचे पृथ्वी पर
  rationale: ऊपर/नीचे और आकाश/पृथ्वी की समग्रतासूचक जोड़ी को संक्षिप्त, आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: אֵין עוֹד
  choice: उसके सिवा कोई और नहीं
  rationale: यह अभिव्यक्ति परमेश्वर की अद्वितीयता के पूर्ण दावे को सहज हिन्दी में व्यक्त करती है, बिना अतिरिक्त धर्मवैज्ञानिक विस्तार के।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: הוּא और אֵין עוֹד में अद्वितीयता का बल
  choice: यहोवा ही परमेश्वर है; उसके सिवा कोई और नहीं
  alternative: यहोवा परमेश्वर है; और कोई नहीं
  rationale: ‘ही’ मूल के बलाघाती सर्वनाम को दर्शाता है और अंतिम वाक्यांश पूर्ण अनन्यता को बनाए रखता है, पर पद से आगे की कोई धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘हृदय में बसा लो’ मूल मुहावरे के आंतरिक स्वीकार और दृढ़ धारण—दोनों भावों को सामान्य हिन्दी में संप्रेषित करता है।
