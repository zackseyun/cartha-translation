  text: לָ/נֻ֨ס שָׁ֜מָּ/ה רוֹצֵ֗חַ אֲשֶׁ֨ר יִרְצַ֤ח אֶת רֵעֵ֨/הוּ֙ בִּ/בְלִי דַ֔עַת וְ/ה֛וּא לֹא שֹׂנֵ֥א ל֖/וֹ מִ/תְּמ֣וֹל שִׁלְשׁ֑וֹם וְ/נָ֗ס אֶל אַחַ֛ת מִן הֶ/עָרִ֥ים הָ/אֵ֖ל וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/042.yaml
  text: so that a manslayer who kills his neighbor unintentionally[a], without knowledge, and was not hating him previously[b], may flee there to one of these cities and live.
translation:
  language: hi
  text: ताकि जो व्यक्ति अनजाने में[a] अपने साथी की जान ले ले और पहले से उससे बैर न रखता हो[b], वह वहाँ इन नगरों में से किसी एक में भाग जाए और जीवित रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “बिना ज्ञान के”; इस कानूनी प्रसंग में आशय है कि किसी की जान अनजाने में, अर्थात बिना इरादे के, गई।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “कल या परसों से”; यह एक इब्रानी मुहावरा है, जिसका अर्थ “पहले से” या “पूर्वकाल से” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֻס שָׁמָּה
  choice: ताकि ... वहाँ ... भाग जाए
  rationale: ल उपसर्गयुक्त infinitive construct यहाँ पिछले पद में नगरों को अलग ठहराने का उद्देश्य बताता है; हिन्दी में उद्देश्यवाचक ‘ताकि’ स्वाभाविक है।
- source_word: רוֹצֵחַ
  choice: हत्यारा
  rationale: यहाँ शब्द उस व्यक्ति के लिए है जिसके हाथ से किसी की मृत्यु हुई है, जबकि आगे का वाक्य उसे जानबूझकर हत्या करने वाला नहीं मानता। ‘हत्यारा’ सामान्य पाठक के लिए सुबोध है और अनजानेपन की अगली शर्त उसके कानूनी अर्थ को सीमित करती है।
- source_word: אֲשֶׁר יִרְצַח אֶת רֵעֵהוּ
  choice: जिसने ... अपने पड़ोसी को मार डाला हो
  rationale: सम्बन्धवाचक उपवाक्य और हत्या की पूर्ण घटना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; רֵעַ का सामान्य समतुल्य ‘पड़ोसी’ रखा गया है।
- source_word: בִּבְלִי דַעַת
  choice: अनजाने में
  rationale: शाब्दिक अर्थ ‘ज्ञान के बिना’ है; इस शरण-नगर संबंधी कानूनी प्रसंग में इसका आशय बिना जाने या बिना इरादे के हुई हत्या है। शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וְהוּא לֹא שֹׂנֵא לוֹ
  choice: जो ... उससे बैर न रखता हो
  rationale: कृदन्त שֹׂנֵא लगातार शत्रुतापूर्ण मनोभाव दर्शाता है। ‘बैर रखना’ हिन्दी में इस स्थायी प्रवृत्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: पहले से
  rationale: यह शाब्दिक रूप से ‘कल या परसों से’ जैसा इब्रानी मुहावरा है, जिसका अर्थ पूर्वकाल से या पहले से है। मुहावरे का शाब्दिक स्वरूप पादटिप्पणी में दिया गया है।
- source_word: אֶל אַחַת מִן הֶעָרִים הָאֵל
  choice: इन नगरों में से किसी एक में
  rationale: हिब्रानी संकेतवाचक ‘इन’ निकट संदर्भ के उन्हीं नगरों की ओर संकेत करता है।
- source_word: וָחָי
  choice: और जीवित रहे
  rationale: यह सफलतापूर्वक शरण लेने का परिणाम बताता है—उस व्यक्ति के जीवन की रक्षा होगी।
theological_decisions:
- issue: רוֹצֵחַ का नैतिक-कानूनी बल
  choice: ‘हत्यारा’ के साथ ‘अनजाने में’ की स्पष्ट योग्यता
  alternative: ‘खूनी’ या ‘मनुष्य-वध करने वाला’
  rationale: पद अपराधपूर्वक हत्या और अनजाने में हुई मृत्यु का भेद बनाए रखता है। किसी विशिष्ट धार्मिक-कानूनी व्याख्या को आरोपित किए बिना व्यापक संज्ञा को प्रसंगगत योग्यता के साथ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कानूनी-वर्णनात्मक शैली। ‘बैर रखना’ बोलचाल में समझ आने योग्य है और मूल के निरंतर वैरभाव को व्यक्त करता है।
