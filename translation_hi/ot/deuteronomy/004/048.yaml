  rationale: यहाँ के इब्रानी रूप שִׂיאֹן को परिचित ‘सिय्योन’ से अलग रखते हुए सीधे लिप्यंतरित किया गया है।
- source_word: הוּא
  choice: अर्थात्
  rationale: यह सर्वनाम यहाँ व्याख्यात्मक समानाधिकरण में सियोन पर्वत की पहचान हेर्मोन के रूप में कराता है।
- source_word: חֶרְמוֹן
  choice: हेर्मोन
  rationale: पर्वत के व्यक्तिवाचक नाम का हिन्दी में निकट लिप्यंतरण किया गया है।
