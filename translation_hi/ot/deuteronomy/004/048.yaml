base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/048.yaml
  text: from Aroer[a], which is on the bank of the Arnon Valley, as far as Mount Sion (that is, Hermon)[b],
translation:
  language: hi
  text: अरोएर से, जो अर्नोन की घाटी के किनारे पर है,[a] सियोन पर्वत तक, अर्थात् हेर्मोन तक,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी נַחַל का अर्थ ‘अर्नोन का नाला’, ‘अर्नोन की खड्ड’ या ‘अर्नोन की घाटी’ भी हो सकता है; यह शब्द अनिवार्य रूप से वर्षभर बहने वाली नदी को नहीं दर्शाता।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘सियोन’ है। व्यवस्थाविवरण 3:9 से तुलना करें, जहाँ सीदोनवासी इसी पर्वत को सिर्योन कहते हैं। यहाँ पाठ स्वयं सियोन की पहचान हेर्मोन के रूप में करता है।
    reason: cross_reference
