  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/צַּ֣ר לְ/ךָ֔ וּ/מְצָא֕וּ/ךָ כֹּ֖ל הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה בְּ/אַחֲרִית֙ הַ/יָּמִ֔ים וְ/שַׁבְתָּ֙ עַד יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׁמַעְתָּ֖ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/030.yaml
  text: When you are in distress[a], and all these things come upon you[b], in the latter days you will return to Yahweh your God and listen to his voice.
translation:
  language: hi
  text: जब तुम संकट में पड़ोगे और ये सब बातें तुम पर आ पड़ेंगी, तब अंतिम दिनों में[a] तुम अपने परमेश्वर यहोवा की ओर लौटोगे और उसकी आवाज़ सुनोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आने वाले दिनों में।’ इब्रानी पदबंध सामान्य रूप से भविष्य के समय का उल्लेख कर सकता है; इसे किसी विशेष अंत-समय व्यवस्था तक सीमित करना आवश्यक नहीं है।
    reason: alternative_reading
  - marker: b
    text: इसे ‘उसकी बात मानोगे’ भी अनुवाद किया जा सकता है, क्योंकि इब्रानी अभिव्यक्ति में प्रायः ध्यान देकर आज्ञा मानने का भाव शामिल होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לְךָ
  choice: जब तुम संकट में पड़ोगे
  rationale: इब्रानी का शाब्दिक भाव ‘तुम्हारे संकट में’ है। हिन्दी में कालगत और परिस्थितिगत अर्थ को स्वाभाविक रूप से व्यक्त करने के लिए यह रूप चुना गया है।
- source_word: וּמְצָאוּךָ כֹּל הַדְּבָרִים הָאֵלֶּה
  choice: और ये सब बातें तुम पर आ पड़ेंगी
  rationale: מצא का मूल अर्थ ‘पाना/ढूँढ़ लेना’ है, पर यहाँ चेतावनी में बताई घटनाएँ कर्ता हैं; ‘तुम पर आ पड़ेंगी’ उनके व्यक्ति तक पहुँचने का भाव स्वाभाविक हिन्दी में रखता है। דְּבָרִים को प्रसंगानुसार ‘बातें’ कहा गया है, जो कथनों के साथ-साथ घटनाओं को भी समेट सकता है।
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: अंतिम दिनों में
  rationale: यह प्रचलित बाइबलीय पदबंध इब्रानी रूपक और उसके धर्मवैचारिक तनाव को बनाए रखता है; पादटिप्पणी स्पष्ट करती है कि इसका अर्थ सामान्यतः आने वाला समय भी हो सकता है।
- source_word: וְשַׁבְתָּ עַד
  choice: तुम ... की ओर लौटोगे
  rationale: שׁוּב के साथ עַד किसी व्यक्ति की ओर लौटने को दर्शाता है। ‘लौटोगे’ संबंध और वाचा के भाव को रखता है, जबकि ‘पश्चाताप करोगे’ मूल क्रिया से अधिक व्याख्या जोड़ता।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा
  rationale: ईश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’ और दूसरे पुरुष एकवचन संबंधसूचक रूप אֱלֹהֶיךָ को ‘अपने परमेश्वर’ के रूप में व्यक्त किया गया है।
- source_word: וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: और उसकी आवाज़ सुनोगे
  rationale: यह अनुवाद इब्रानी के श्रवण-संबंधी रूपक को बनाए रखता है। इस पदबंध में आज्ञापालन का भाव भी निहित हो सकता है, जिसे पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים का कालगत और संभावित युगांत-संबंधी अर्थ
  choice: अंतिम दिनों में
  alternative: आने वाले दिनों में
  rationale: मूल पदबंध भविष्य के किसी काल को व्यापक रूप से सूचित कर सकता है और अनिवार्यतः किसी खास अंत-समय व्यवस्था को निर्धारित नहीं करता। मुख्य पाठ बाइबलीय अभिव्यक्ति रखता है और पादटिप्पणी उसकी व्यापकता बताती है।
- issue: וְשַׁבְתָּ עַד יְהוָה में वाचा-संबंधी वापसी
  choice: अपने परमेश्वर यहोवा की ओर लौटोगे
  alternative: पश्चाताप करके अपने परमेश्वर यहोवा की ओर फिरोगे
  rationale: ‘लौटोगे’ मूल क्रिया के संबंधपरक और वाचा-संबंधी बल को सुरक्षित रखता है, पर ऐसी विकसित पश्चाताप-शब्दावली नहीं जोड़ता जो इस क्रिया में अकेले स्पष्ट नहीं है।
- issue: וְשָׁמַעְתָּ בְּקֹלוֹ में सुनने और आज्ञा मानने का संबंध
  choice: उसकी आवाज़ सुनोगे
  alternative: उसकी बात मानोगे
  rationale: मुख्य पाठ मूल की ‘आवाज़ सुनने’ वाली छवि को रखता है; पादटिप्पणी बताती है कि इब्रानी प्रयोग में आज्ञापालन भी अभिप्रेत हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वाचा-संबंधी शैली रखी गई है। एकवचन संबोधन के लिए ‘तुम’ प्रयोग हुआ है। पादटिप्पणी-चिह्न उन्हीं पदबंधों के बाद लगाए गए हैं जिनकी वैकल्पिक व्याख्या दी गई है।
