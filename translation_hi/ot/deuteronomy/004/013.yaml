source:
  edition: WLC
  text: וַ/יַּגֵּ֨ד לָ/כֶ֜ם אֶת בְּרִית֗/וֹ אֲשֶׁ֨ר צִוָּ֤ה אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת עֲשֶׂ֖רֶת הַ/דְּבָרִ֑ים וַֽ/יִּכְתְּבֵ֔/ם עַל שְׁנֵ֖י לֻח֥וֹת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/013.yaml
  text: And he declared to you his covenant[a], which he commanded you to do, the Ten Words; and he wrote them on two tablets of stone.
translation:
  language: hi
  text: और उसने तुम्हें अपनी वाचा बताई, जिसे करने की आज्ञा उसने तुम्हें दी, अर्थात् दस वचन[a]; और उसने उन्हें पत्थर की दो पटियाओं पर लिख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक अर्थ: “दस वचन”; परंपरागत अनुवाद: “दस आज्ञाएँ।”'
    reason: परंपरागत वैकल्पिक अनुवाद को दर्ज करना और मूल पद की शाब्दिकता स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: घोषित की
  rationale: हिफ़ील रूप का अर्थ ‘बतलाना/प्रकट करना/घोषित करना’ है। ‘घोषित की’ वाचा के औपचारिक प्रसंग को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: בְּרִיתוֹ
  choice: अपनी वाचा
  rationale: ‘वाचा’ बन्धनकारी और सम्बन्धपरक समझौते के लिए बाइबिलीय हिन्दी का स्थापित शब्द है और केवल राजनीतिक संधि का अर्थ नहीं देता।
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם לַעֲשׂוֹת
  choice: जिसका पालन करने की आज्ञा उसने तुम्हें दी
  rationale: לַעֲשׂוֹת का मूल अर्थ ‘करना’ है, पर हिन्दी में वाचा को ‘करना’ अस्वाभाविक होगा; ‘पालन करना’ अपेक्षित क्रियात्मक आज्ञाकारिता को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: दस वचन
  rationale: यह इब्रानी पद का सीधा अर्थ है। ‘दस आज्ञाएँ’ परंपरागत और परिचित अनुवाद है, पर मूल पाठ स्वयं इन्हें ‘वचन’ कहता है।
- source_word: וַיִּכְתְּבֵם
  choice: उसने उन्हें ... लिख दिया
  rationale: כתב सामान्यतः ‘लिखना’ है। पत्थर का माध्यम होने पर भी मूल क्रिया किसी अधिक विशिष्ट ‘उत्कीर्ण करना’ शब्द की माँग नहीं करती।
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: पत्थर की दो पटियाओं
  rationale: यह रचना पत्थर से बनी दो पटियाओं को दर्शाती है; चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: עֲשֶׂרֶת הַדְּבָרִים का अनुवाद
  choice: दस वचन
  alternative: दस आज्ञाएँ
  rationale: मुख्य पाठ में मूल इब्रानी पदनाम को सुरक्षित रखा गया है। परिचित परंपरागत पद ‘दस आज्ञाएँ’ को पाठ पर आरोपित करने के बजाय पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘तुम्हारे सामने’ घोषणा के सार्वजनिक/प्रत्यक्ष भाव को स्वाभाविक बनाता है; ‘अर्थात्’ वाचा और दस वचनों के समानाधिकरण को स्पष्ट करता है।
