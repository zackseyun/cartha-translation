  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। पद 9 से जुड़ी अपूर्ण आरंभिक रचना को स्वतंत्र पाठ में स्पष्ट करने के लिए ‘याद रखो’ जोड़ा गया है। प्रत्यक्ष कथन में सरल आज्ञार्थक और उद्देश्यसूचक रचना अपनाई गई है।
