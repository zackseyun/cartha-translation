base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/010.yaml
  text: the day when you stood before Yahweh your God at Horeb[a], when Yahweh said to me, ‘Assemble the people to me, and I will let them hear my words, so that they may learn to fear me all the days that they live on the earth, and that they may teach their children.’
translation:
  language: hi
  text: उस दिन को, जब तुम होरेब में अपने परमेश्वर यहोवा के सामने खड़े थे, जब यहोवा ने मुझसे कहा था, “लोगों को मेरे पास इकट्ठा करो, और मैं उन्हें अपने वचन सुनाऊँगा, ताकि वे जब तक पृथ्वी[a] पर जीवित रहें, मेरा भय मानना सीखें और अपने बच्चों को सिखाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भूमि पर।” इब्रानी शब्द אֲדָמָה सामान्य रूप से पृथ्वी या भूमि को, और अधिक विशिष्ट संदर्भ में किसी देश को, दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: י֗וֹם אֲשֶׁ֨ר
  choice: उस दिन को याद रखो जब
  rationale: यह पद पिछले पद की ‘भूल न जाना’ वाली आज्ञा से व्याकरणिक रूप से जुड़ा है। हिन्दी में स्वतंत्र पद के रूप में अर्थ स्पष्ट रखने के लिए उस निहित स्मरण-आज्ञा को व्यक्त किया गया है।
- source_word: עָמַדְתָּ לִפְנֵי
  choice: तुम ... के सामने खड़े थे
  rationale: मूल के ठोस दृश्य और परमेश्वर की उपस्थिति में खड़े होने के वाचाई भाव को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचाई नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा व्यक्त किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन के संबंधसूचक भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: בְּחֹרֵב
  choice: होरेब में
  rationale: स्थाननाम के साथ स्वाभाविक हिन्दी प्रयोग है।
- source_word: בֶּאֱמֹר יְהוָה אֵלַי
  choice: तब यहोवा ने मुझसे कहा था
  rationale: समकालिक हिब्रू रचना को प्रसंगानुकूल कथात्मक हिन्दी में व्यक्त करता है।
- source_word: הַקְהֶל לִי אֶת הָעָם
  choice: लोगों को मेरे पास इकट्ठा करो
  rationale: हिफ़ील आज्ञार्थक के सार्वजनिक रूप से एकत्र कराने के भाव और לִי के ‘मेरे पास’ अर्थ को बनाए रखता है।
- source_word: וְאַשְׁמִעֵם אֶת דְּבָרָי
  choice: और मैं उन्हें अपने वचन सुनाऊँगा
  rationale: שמע के कारक रूप ‘सुनवाना’ को स्वाभाविक हिन्दी में व्यक्त करता है और דְּבָרָי के बहुवचन वाचाई कथनों को सामूहिक ‘वचन’ से प्रस्तुत करता है।
- source_word: אֲשֶׁר יִלְמְדוּן לְיִרְאָה אֹתִי
  choice: ताकि वे ... मेरा भय मानना सीखें
  rationale: उद्देश्यसूचक संबंध और ירא के भय, श्रद्धा तथा आज्ञाकारिता से भरे वाचाई तनाव को सुरक्षित रखता है।
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: अपने जीवन-भर
  rationale: मूल के आजीवन अवधि वाले मुहावरे को संक्षिप्त, सहज और पूर्ण हिन्दी में व्यक्त करता है।
- source_word: עַל הָאֲדָמָה
  choice: पृथ्वी पर
  rationale: אֲדָמָה के सामान्य ‘धरती/भूमि’ अर्थ को रखता है, जबकि अधिक विशिष्ट ‘देश’ अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: וְאֶת בְּנֵיהֶם יְלַמֵּדוּן
  choice: और अपने बच्चों को भी यह सिखाएँ
  rationale: בנים यहाँ संतानों को सामान्यतः दर्शाता है; ‘बच्चों’ से आशय अनावश्यक रूप से केवल पुत्रों तक सीमित नहीं होता। ‘यह’ का संकेत भय मानने और परमेश्वर के वचन सीखने की पूर्ववर्ती बात की ओर है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचाई नाम है, इसलिए ‘प्रभु’ जैसी उपाधि से उसका प्रतिस्थापन नहीं किया गया। आधुनिक हिन्दी बाइबल-पाठकों के लिए पहचाने जाने योग्य रूप ‘यहोवा’ चुना गया।
- issue: वाचाई प्रसंग में ירא
  choice: मेरा भय मानना
  alternative: मेरे प्रति श्रद्धा रखना
  rationale: ‘भय’ मूल की गंभीरता तथा श्रद्धा, जवाबदेही और आज्ञाकारिता के तनाव को बनाए रखता है; केवल ‘श्रद्धा’ अर्थ को नरम और संकरा कर सकती है।
- issue: בנים का व्यापक संदर्भ
  choice: बच्चों
  alternative: पुत्रों
  rationale: यहाँ शिक्षा अगली पीढ़ी को देने की बात है, केवल पुरुष संतानों की नहीं; इसलिए प्रसंगगत व्यापक अर्थ चुना गया।
- issue: אֲדָמָה का दायरा
  choice: पृथ्वी
  alternative: देश
  rationale: शब्द सामान्य धरती या किसी विशिष्ट देश, दोनों का संकेत दे सकता है। मुख्य पाठ व्यापक अर्थ रखता है और व्यवस्थाविवरण के देश-संबंधी संभावित अर्थ को पादटिप्पणी में संरक्षित करता है।
