source:
  edition: WLC
  text: וְ/אֶתְ/כֶם֙ לָקַ֣ח יְהוָ֔ה וַ/יּוֹצִ֥א אֶתְ/כֶ֛ם מִ/כּ֥וּר הַ/בַּרְזֶ֖ל מִ/מִּצְרָ֑יִם לִ/הְי֥וֹת ל֛/וֹ לְ/עַ֥ם נַחֲלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/020.yaml
  text: But Yahweh took you and brought you out of the iron furnace[a], out of Egypt, to be for him a people of inheritance, as it is this day.
translation:
  language: hi
  text: परन्तु यहोवा ने तुम्हें लिया और तुम्हें लोहे की भट्ठी में से, मिस्र में से निकाल लाया, ताकि तुम उसके लिए विरासत की प्रजा बनो[a], जैसा आज के दिन है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी अपनी प्रजा’ अथवा ‘उसके अधिकार की प्रजा।’ इब्रानी में शाब्दिक रूप से ‘उसके लिए विरासत की प्रजा’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: वाचा से जुड़े परमेश्वर के विशिष्ट नाम को हिन्दी में प्रचलित और स्पष्ट रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לָקַח
  choice: अपनाया
  rationale: मूल अर्थ ‘लेना’ है, पर इस प्रसंग में इस्राएल को चुनकर अपना बनाने का भाव है; ‘अपनाया’ स्वाभाविक हिन्दी में उस दावे को व्यक्त करता है, बिना इसे केवल चुनाव तक सीमित किए।
- source_word: וַיּוֹצִא אֶתְכֶם
  choice: तुम्हें ... से निकाल लाया
  rationale: हिफ़ील रूप के कारणात्मक भाव और निर्गमन की गति—बाहर ले आने—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: מִכּוּר הַבַּרְזֶל
  choice: लोहे की भट्ठी
  rationale: मिस्र में कठोर उत्पीड़न की मूल रूपकात्मक छवि को ज्यों का त्यों बनाए रखता है।
- source_word: מִמִּצְרָיִם
  choice: अर्थात मिस्र से
  rationale: इब्रानी में मिस्र ‘लोहे की भट्ठी’ की पहचान या व्याख्या करता है; ‘अर्थात’ हिन्दी पाठक के लिए इस संबंध को स्पष्ट करता है।
- source_word: לִהְיוֹת לוֹ לְעַם נַחֲלָה
  choice: ताकि तुम उसके लिए विरासत की प्रजा बनो
  rationale: ‘उसके लिए’, ‘प्रजा’ और ‘विरासत’—तीनों मूल घटकों को सुरक्षित रखता है और अधिकार/अपनत्व की वाचागत भाषा को अत्यधिक व्याख्यायित नहीं करता।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा आज है
  rationale: यह पदबंध वक्ता के वर्तमान समय में इस्राएल की प्रत्यक्ष स्थिति की ओर संकेत करता है; यह संक्षिप्त और आधुनिक हिन्दी है।
theological_decisions:
- issue: לְעַם נַחֲלָה में वाचागत अधिकार और विरासत की भाषा
  choice: उसके लिए विरासत की प्रजा
  alternative: उसकी अपनी प्रजा / उसके अधिकार की प्रजा
  rationale: मुख्य पाठ में असामान्य किंतु अर्थपूर्ण ‘विरासत’ को बनाए रखा गया है, ताकि इस्राएल के यहोवा से विशेष रूप से संबंधित होने का भाव रहे और अर्थ को किसी एक सहज व्याख्या में सीमित न किया जाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘यहोवा’ को दैवी नाम के रूप में रखा गया है। ‘लोहे की भट्ठी’ की रूपकात्मक छवि और ‘विरासत की प्रजा’ की वाचागत अस्पष्टता संरक्षित है।
