source:
  edition: WLC
  text: אַתָּה֙ הָרְאֵ֣תָ לָ/דַ֔עַת כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֥ין ע֖וֹד מִ/לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/035.yaml
  text: You were shown these things so that you might know that Yahweh[a], he is God[b]; there is no other besides him.
translation:
  language: hi
  text: तुम्हें यह सब दिखाया गया, ताकि तुम जान लो कि याहवे[a] ही परमेश्वर है; उसके सिवा और कोई नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ ईश्वरीय नाम יהוה (YHWH) का लिप्यंतरण है; कई अनुवादों में इसे ‘प्रभु’ लिखा जाता है।
    reason: divine_name
lexical_decisions:
- source_word: הָרְאֵתָ
  choice: तुम्हें यह सब दिखाया गया
  rationale: 'होफ़ाल रूप कारणवाचक कर्मवाच्य है: संबोधित इस्राएल ने केवल स्वयं नहीं देखा, बल्कि उसे ये बातें दिखाई गईं। एकवचन संबोधन को स्वाभाविक आधुनिक हिन्दी में सामूहिक ‘तुम्हें’ से व्यक्त किया गया है।'
- source_word: לָדַעַת
  choice: ताकि तुम जान लो
  rationale: ל के साथ क्रियार्थक संज्ञा यहाँ उद्देश्य या अपेक्षित परिणाम बताती है; ‘ताकि’ उस भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: यह कारण नहीं, बल्कि उस ज्ञान की विषय-वस्तु का परिचय देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: הוּא
  choice: वही
  rationale: स्वतंत्र सर्वनाम के बलाघात को हिन्दी में ‘वही’ स्वाभाविक रूप से व्यक्त करता है, बिना अगले उपवाक्य के अनन्यता-दावे को अनावश्यक रूप से इसमें मिला देने के।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: सप्रत्यय संज्ञा यहाँ यहोवा की पहचान सच्चे ईश्वर के रूप में कराती है; हिन्दी बाइबलीय प्रयोग में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אֵין עוֹד מִלְבַדּוֹ
  choice: उसके सिवा और कोई नहीं
  rationale: यह मुहावरा यहोवा के अतिरिक्त किसी अन्य देवता के अस्तित्व का निषेध करता है। चुना हुआ वाक्यांश संक्षिप्त, आधुनिक और स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत नाम का प्रयोग करता है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखना स्रोत-पाठ के भेद को सुरक्षित रखता है।
- issue: הוּא के बलाघात और अनन्यता का संबंध
  choice: यहोवा—वही परमेश्वर है; उसके सिवा और कोई नहीं
  alternative: केवल यहोवा ही परमेश्वर है
  rationale: ‘केवल’ जोड़ने से दोनों इब्रानी उपवाक्यों का बल एक ही वाक्यांश में समा सकता था। चुना हुआ रूप सर्वनाम के बलाघात और अगले स्पष्ट अनन्यता-दावे, दोनों को अलग-अलग बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम्हें’ मूल के सामूहिक एकवचन संबोधन को सामान्य हिन्दी में व्यक्त करता है। दीर्घ विराम-चिह्न ‘—’ स्वतंत्र सर्वनाम הוּא के बलाघात को उभारता है।
