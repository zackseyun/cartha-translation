source:
  edition: WLC
  text: וַֽ/יהוָ֥ה הִתְאַנֶּף בִּ֖/י עַל דִּבְרֵי/כֶ֑ם וַ/יִּשָּׁבַ֗ע לְ/בִלְתִּ֤י עָבְרִ/י֙ אֶת הַ/יַּרְדֵּ֔ן וּ/לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/021.yaml
  text: And Yahweh was angry with me because of you[a], and he swore that I would not cross the Jordan and that I would not enter the good land that Yahweh your God is giving you as an inheritance.
translation:
  language: hi
  text: और यहोवा तुम्हारी बातों के कारण मुझ पर क्रोधित हुआ[a], और उसने शपथ खाई कि मैं यरदन पार नहीं करूँगा और उस अच्छे देश में प्रवेश नहीं करूँगा जिसे तुम्हारा परमेश्वर यहोवा तुम्हें विरासत के रूप में दे रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे कारण।” इब्रानी में शाब्दिक अर्थ है, “तुम्हारी बातों के कारण।”
    reason: मुहावरेदार वैकल्पिक अर्थ को बताते हुए मूल की स्पष्ट शब्दावली सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में परिचित रूप है और मूल पाठ के व्यक्तिगत दिव्य नाम को सामान्य उपाधि में नहीं बदलता।
- source_word: הִתְאַנֶּף בִּי
  choice: मुझ पर क्रोधित हुआ
  rationale: क्रोध व्यक्त करने वाली हिब्रानी क्रिया और בִּי के लक्ष्य-संबंध को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: עַל דִּבְרֵיכֶם
  choice: तुम्हारी बातों के कारण
  rationale: शाब्दिक तत्व ‘तुम्हारी बातें/वचन’ को बनाए रखता है और दोष को केवल सामान्य ‘तुम्हारे कारण’ बनाकर अस्पष्ट नहीं करता।
- source_word: וַיִּשָּׁבַע
  choice: उसने शपथ खाई
  rationale: हिब्रानी शपथ-सूचक क्रिया का सीधा और प्रचलित हिन्दी रूप।
- source_word: לְבִלְתִּי עָבְרִי אֶת הַיַּרְדֵּן
  choice: कि मैं यरदन पार नहीं करूँगा
  rationale: शपथ की विषय-वस्तु और निषेध का बल स्पष्ट तथा स्वाभाविक हिन्दी में देता है।
- source_word: וּלְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: और उस ... देश में प्रवेश नहीं करूँगा
  rationale: בוא אֶל का प्रसंगानुकूल अर्थ ‘प्रवेश करना’ है और यह यरदन पार करने के समानांतर है।
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: उस अच्छे देश
  rationale: ‘अच्छा देश’ मूल विशेषण का सीधा अनुवाद है और उसकी वाचा-संबंधी सकारात्मकता बनाए रखता है।
- source_word: נֹתֵן לְךָ
  choice: तुम्हें ... दे रहा है
  rationale: वर्तमान कृदंत के जारी अथवा आसन्न दान के भाव को सुरक्षित रखता है।
- source_word: נַחֲלָה
  choice: विरासत के रूप में
  rationale: वंशानुगत भाग अथवा प्रदत्त अधिकार के वाचा-संबंधी भाव को आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: मूसा के देश में प्रवेश न करने का इस्राएल की बातों से संबंध
  choice: तुम्हारी बातों के कारण
  alternative: तुम्हारे कारण
  rationale: मूल में דִּבְרֵיכֶם स्पष्टतः ‘तुम्हारी बातें/वचन’ है। इसे बनाए रखने से पद में उपस्थित उत्तरदायित्व का तनाव सुरक्षित रहता है और व्यापक दोष-विवेचन को अनुवाद द्वारा तय नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘यहोवा’ व्यक्तिगत दिव्य नाम को बनाए रखता है। ‘यरदन’ हिन्दी बाइबलीय प्रयोग में प्रचलित भौगोलिक नाम है।
