  text: כִּ֣י אֵ֤ל רַחוּם֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַשְׁחִיתֶ֑/ךָ וְ/לֹ֤א יִשְׁכַּח֙ אֶת בְּרִ֣ית אֲבֹתֶ֔י/ךָ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/031.yaml
  text: For Yahweh your God is a compassionate God[c][b][a]; he will not abandon you or destroy you or forget the covenant of your fathers that he swore to them.
translation:
  language: hi
  text: क्योंकि तुम्हारा परमेश्वर यहोवा दयालु परमेश्वर है[a]; वह न तो तुम्हें छोड़ेगा[b], न तुम्हें नष्ट करेगा, और न तुम्हारे पिताओं[c] के साथ की उस वाचा को भूलेगा, जिसकी शपथ उसने उनसे खाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘करुणामय परमेश्वर’।
    reason: lexical_alternative
  - marker: b
    text: या ‘तुम्हें त्यागेगा’।
    reason: lexical_alternative
  - marker: c
    text: यहाँ इस्राएल के वाचा-संबंधी पिताओं का संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है; हिन्दी में ‘क्योंकि’ इसके कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵל רַחוּם
  choice: दयालु परमेश्वर
  rationale: רַחוּם करुणा और दया का भाव व्यक्त करता है। ‘दयालु’ आधुनिक हिन्दी में सहज और गरिमापूर्ण है; ‘करुणामय’ भी सम्भव है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय प्रचलित हिन्दी रूप ‘यहोवा’ में रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन और वाचागत सम्बन्ध दोनों को सुरक्षित रखता है।
- source_word: לֹא יַרְפְּךָ
  choice: वह न तो तुम्हें छोड़ेगा
  rationale: रूप यहाँ हाथ छोड़ देने, त्याग देने या असहाय छोड़ने का भाव देता है। ‘छोड़ेगा’ स्वाभाविक हिन्दी में इस व्यापक अर्थ को बनाए रखता है।
- source_word: וְלֹא יַשְׁחִיתֶךָ
  choice: न तुम्हें नष्ट करेगा
  rationale: हिफ़ील रूप का सीधा अर्थ नष्ट या बरबाद करना है; प्रसंग में ‘नष्ट करेगा’ उपयुक्त है।
- source_word: וְלֹא יִשְׁכַּח אֶת בְּרִית
  choice: और न ... उस वाचा को भूलेगा
  rationale: ‘भूलना’ मूल की स्पष्ट और धर्मवैज्ञानिक रूप से महत्त्वपूर्ण भाषा को बिना नरम किए सुरक्षित रखता है।
- source_word: אֲבֹתֶיךָ
  choice: तुम्हारे पूर्वजों
  rationale: शाब्दिक अर्थ ‘तुम्हारे पिताओं’ है, पर यहाँ इस्राएल के वाचा-संबंधी पुरखों का उल्लेख है; ‘पूर्वजों’ आधुनिक हिन्दी में स्वाभाविक है और टिप्पणी मूल की लैंगिक विशिष्टता बताती है।
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: जिसकी उसने उनसे शपथ खाई थी
  rationale: נשבע शपथ खाने की औपचारिक भाषा है। सम्बन्धवाचक वाक्य को हिन्दी में स्पष्ट करने के लिए ‘जिसकी’ रखा गया है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का व्यक्तिगत ईश्वरीय नाम बनाए रखा गया है। हिन्दी बाइबलीय प्रयोग में अधिक पहचाना जाने वाला रूप ‘यहोवा’ चुना गया, जबकि ‘याहवे’ अधिक प्रत्यक्ष लिप्यंतरण का विकल्प है।
- issue: אֲבֹתֶיךָ का ऐतिहासिक संकेत
  choice: तुम्हारे पूर्वजों
  alternative: तुम्हारे पिताओं
  rationale: प्रसंग इस्राएल के वाचा-संबंधी पुरखों की ओर संकेत करता है। मुख्य पाठ में स्वाभाविक हिन्दी ‘पूर्वजों’ रखी गई और शाब्दिक रूप पाद-टिप्पणी में दिया गया।
- issue: वाचा और शपथ का सम्बन्ध
  choice: उस वाचा को ... जिसकी उसने उनसे शपथ खाई थी
  alternative: वह वाचा, जिसके विषय में उसने उनसे शपथ खाई थी
  rationale: हिब्रू में सम्बन्धवाचक उपवाक्य वाचा को विशेषित करता है। चुना गया रूप इस सम्बन्ध को संक्षेप में बनाए रखता है, बिना शपथ को वाचा से अलग किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन संबोधन और गरिमापूर्ण किंतु सहज शब्दावली। ईश्वरीय नाम को ‘यहोवा’ रखा गया है। समन्वयी ‘न तो ... न ... और न’ हिब्रू की तीन नकारात्मक प्रतिज्ञाओं को स्पष्ट करता है।
