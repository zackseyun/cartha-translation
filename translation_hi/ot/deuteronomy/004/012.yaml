  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֲלֵי/כֶ֖ם מִ/תּ֣וֹךְ הָ/אֵ֑שׁ ק֤וֹל דְּבָרִים֙ אַתֶּ֣ם שֹׁמְעִ֔ים וּ/תְמוּנָ֛ה אֵינְ/כֶ֥ם רֹאִ֖ים זוּלָתִ֥י קֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/012.yaml
  text: Then Yahweh spoke to you from the midst of the fire[a]. You heard the sound of words[c][b], but saw no form—only a voice.
translation:
  language: hi
  text: तब याहवे ने आग के बीच से[a] तुमसे बात की। तुमने शब्दों की ध्वनि[b] सुनी, पर कोई रूप[c] नहीं देखा—सिर्फ़ एक आवाज़ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आग में से।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “शब्दों की आवाज़”; इसका अनुवाद “वाणी की ध्वनि” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद “आकृति,” “समानता” या “दिखाई देने वाला स्वरूप” भी हो सकता है। इब्रानी इस बात पर बल देता है कि कोई दृश्य प्रतिरूप नहीं देखा गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के वाचागत नाम को उपाधि से बदलने के बजाय उसके प्रचलित आधुनिक हिन्दी लिप्यंतरण में रखा गया है।
- source_word: וַיְדַבֵּר
  choice: बात की
  rationale: דבר का सामान्य अर्थ ‘बोलना’ है; ‘तुमसे बात की’ אֲלֵיכֶם के साथ स्वाभाविक हिन्दी है और सीधे संबोधन को बनाए रखता है।
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: आग के बीच से
  rationale: מִתּוֹךְ आग के भीतर/मध्य से वाणी आने का बिंब देता है; केवल ‘आग से’ कहने की अपेक्षा यह अधिक सटीक है।
- source_word: קוֹל דְּבָרִים
  choice: शब्दों की ध्वनि
  rationale: यह इब्रानी के ‘ध्वनि/आवाज़’ और ‘शब्दों’ दोनों घटकों को सुरक्षित रखता है तथा स्पष्ट करता है कि उन्होंने अर्थयुक्त वाणी सुनी।
- source_word: שֹׁמְעִים
  choice: सुन रहे थे
  rationale: इब्रानी कृदंत उस समय चल रही अनुभूति को दर्शाता है और अगले कृदंत ‘देख रहे थे’ के साथ समानांतर है।
- source_word: תְמוּנָה
  choice: रूप
  rationale: यह किसी दिखाई देने वाली आकृति, समानता या प्रतिरूप को सूचित करता है; ‘रूप’ संक्षिप्त है और अनावश्यक व्याख्या जोड़े बिना व्यापक अर्थ रखता है।
- source_word: אֵינְכֶם רֹאִים
  choice: कोई रूप नहीं देख रहे थे
  rationale: निषेध और कृदंत का स्वाभाविक हिन्दी रूप है तथा सुनने और न देखने के विरोध को बनाए रखता है।
- source_word: זוּלָתִי קוֹל
  choice: केवल आवाज़
  rationale: 'זוּלָתִי अपवाद प्रकट करता है: दृश्य रूप कुछ नहीं था, सुनाई केवल आवाज़ दी; संक्षिप्त खंड मूल की तीव्रता बनाए रखता है।'
theological_decisions:
- issue: परमेश्वर के प्रकट होने में श्रव्य वाणी और दृश्य रूप का विरोध
  choice: वास्तविक रूप से सुनी गई वाणी और किसी भी दृश्य रूप के न दिखने का सीधा विरोध बनाए रखा गया है।
  alternative: ‘तुमने उसकी आवाज़ सुनी, पर उसका कोई दृश्य प्रतिरूप नहीं देखा।’
  rationale: मूल पाठ श्रव्य प्रकाशन की वास्तविकता और दृश्य आकृति की अनुपस्थिति दोनों कहता है। अनुवाद बाद की प्रतिमा-संबंधी धर्मवैज्ञानिक व्याख्या को पद में जोड़े बिना इसी तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शब्दों की ध्वनि’ मूल की असामान्य किंतु अर्थपूर्ण अभिव्यक्ति को बनाए रखती है, जबकि ‘केवल आवाज़’ मूल के संक्षिप्त निष्कर्ष का अनुसरण करता है।
