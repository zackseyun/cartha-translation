source:
  edition: WLC
  text: וַ/תִּקְרְב֥וּ/ן וַ/תַּֽעַמְד֖וּ/ן תַּ֣חַת הָ/הָ֑ר וְ/הָ/הָ֞ר בֹּעֵ֤ר בָּ/אֵשׁ֙ עַד לֵ֣ב הַ/שָּׁמַ֔יִם חֹ֖שֶׁךְ עָנָ֥ן וַ/עֲרָפֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/011.yaml
  text: And you came near and stood at the foot of the mountain[a], while the mountain was burning with fire up to the heart of the heavens—darkness, cloud[b], and thick gloom.
translation:
  language: hi
  text: तुम पास आए और पहाड़ की तलहटी में खड़े हो गए; पहाड़ आकाश की ऊँचाइयों तक[a] आग से धधक रहा था—अँधेरा, बादल और घोर अंधकार[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आकाश के हृदय तक”; अर्थात आकाश के मध्य या उसकी ऊँचाइयों तक।
    reason: इब्रानी मुहावरे की शाब्दिक छवि और अर्थगत विकल्प बताने के लिए।
  - marker: b
    text: इसका अनुवाद “घना अंधकार” या “गहरा अंधकार” भी हो सकता है।
    reason: עֲרָפֶל के अर्थ-क्षेत्र में गहन, ढँक देने वाले अंधकार की अस्पष्टता बनाए रखने के लिए।
lexical_decisions:
- source_word: וַתִּקְרְבוּן
  choice: तुम पास आए
  rationale: קרב के सामान्य अर्थ ‘निकट आना’ को सहज आधुनिक हिन्दी में व्यक्त करता है और पहाड़ की ओर बढ़ने की गति बनाए रखता है।
- source_word: וַתַּעַמְדוּן
  choice: खड़े हो गए
  rationale: עמד के कथात्मक रूप को स्वाभाविक हिन्दी क्रम में व्यक्त करता है।
- source_word: תַּחַת הָהָר
  choice: पहाड़ की तलहटी में
  rationale: תַּחַת का मूल अर्थ ‘नीचे’ है, पर पहाड़ के भौगोलिक संदर्भ में आशय उसके आधार या तलहटी का है; यह चयन हिन्दी में स्थान को स्पष्ट करता है।
- source_word: בֹּעֵר בָּאֵשׁ
  choice: आग से धधक रहा था
  rationale: कृदन्त בֹּעֵר की जारी अवस्था और स्पष्ट בָּאֵשׁ ‘आग से’—दोनों को सजीव तथा स्वाभाविक हिन्दी में रखता है।
- source_word: עַד לֵב הַשָּׁמַיִם
  choice: आकाश की ऊँचाइयों तक
  rationale: शाब्दिक ‘आकाश के हृदय तक’ एक इब्रानी मुहावरा है, जिसका प्रसंगगत भाव आकाश के मध्य अथवा ऊँचे भाग तक पहुँचना है; मुख्य पाठ में अर्थ स्पष्ट रखा गया है और शाब्दिक चित्र पादटिप्पणी में दिया गया है।
- source_word: חֹשֶׁךְ עָנָן וַעֲרָפֶל
  choice: अँधेरा, बादल और घोर अंधकार
  rationale: तीनों अलग-अलग, भयावह ईश-प्रकटनात्मक तत्वों को बनाए रखता है; अंतिम पद की गहन और ढँक देने वाली अस्पष्टता को ‘घोर अंधकार’ व्यक्त करता है।
theological_decisions:
- issue: सीनै पर्वत पर ईश-प्रकटन का चित्रण
  choice: आग, अँधेरे, बादल और घोर अंधकार के ठोस तथा विस्मयकारी चित्रों को बनाए रखा गया है।
  alternative: इन्हें केवल सामान्य मौसम संबंधी दशाओं के रूप में सरल कर देना।
  rationale: मूल पाठ दिव्य प्रकटन की भय-मिश्रित महिमा को परतदार दृश्यावली द्वारा प्रस्तुत करता है; अनुवाद इस प्रभाव को बचाता है, पर कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तलहटी’ भौगोलिक अर्थ स्पष्ट करता है, जबकि ‘धधक रहा था’ दृश्य की तीव्रता बनाए रखता है। मुख्य पाठ के सभी पादटिप्पणी-चिह्न [a], [b] रूप में उपस्थित हैं।
