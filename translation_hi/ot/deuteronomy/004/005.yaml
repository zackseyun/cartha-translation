base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/005.yaml
  text: See[a], I have taught you statutes and judgments, just as Yahweh my God commanded me[c][b], so that you may do so in the midst of the land that you are entering there to possess it.
translation:
  language: hi
  text: देखो, मैंने तुम्हें विधियाँ और न्याय-विधान[a] ठीक वैसे ही सिखाए हैं, जैसे याहवे, मेरे परमेश्वर, ने मुझे आज्ञा दी थी, ताकि तुम उस देश के बीच में[b] उनका पालन करो, जिसमें प्रवेश करने और उस पर अधिकार करने के लिए तुम वहाँ जा रहे हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विधियाँ और न्याय-विधान’ का अनुवाद ‘नियम और न्याय-संबंधी आदेश’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘देश के बीच में’ है; अनेक अनुवाद इसे केवल ‘देश में’ कहते हैं।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद ‘जिस देश में तुम प्रवेश करने वाले हो और उस पर अधिकार करोगे’ या ‘जिसे विरासत में लेने के लिए तुम वहाँ जा रहे हो’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: देखो
  rationale: एकवचन आज्ञार्थक यहाँ श्रोताओं का ध्यान खींचने वाला संवाद-सूचक है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और मूल का सीधा बल बनाए रखता है।
- source_word: לִמַּדְתִּי
  choice: मैंने ... सिखाए हैं
  rationale: पूर्ण रूप मूसा की पूरी की हुई शिक्षा को वर्तमान उपदेश से जोड़ता है; हिन्दी का पूर्ण वर्तमान इस संदर्भ में स्वाभाविक है।
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: विधियाँ और न्याय-विधान
  rationale: 'दोनों कानूनी पदों का भेद रखा गया है: חֻקִּים निर्धारित विधियों को और מִשְׁפָּטִים न्यायिक नियमों अथवा निर्णयों को सूचित करता है।'
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही, जैसे
  rationale: यह मूसा की शिक्षा और परमेश्वर की आज्ञा के बीच अनुरूपता व्यक्त करता है।
- source_word: יְהוָה אֱלֹהָי
  choice: याहवे मेरे परमेश्वर
  rationale: व्यक्तिगत वाचा-नाम को नाम के रूप में रखा गया है और אֱלֹהָי का स्वाभाविक अनुवाद ‘मेरे परमेश्वर’ किया गया है।
- source_word: לַעֲשׂוֹת כֵּן
  choice: ताकि ... तुम उनका पालन करो
  rationale: अनन्त क्रिया को प्रसंगानुसार उद्देश्य के रूप में समझा गया है; ‘उनका’ पूर्वोक्त विधियों और न्याय-विधानों की ओर संकेत करता है और हिन्दी में ‘ऐसा करना’ से अधिक स्पष्ट तथा स्वाभाविक है।
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: उसके बीच
  rationale: בְּקֶרֶב की ‘बीच/मध्य में’ वाली छवि को केवल ‘देश में’ कहकर समतल नहीं किया गया।
- source_word: בָּאִים שָׁמָּה לְרִשְׁתָּהּ
  choice: जिस देश पर अधिकार करने के लिए तुम वहाँ जा रहे हो
  rationale: שָׁמָּה का दिशासूचक भाव ‘वहाँ’ से और ירשׁ का व्यापक भूमि-अधिग्रहण भाव ‘अधिकार करने’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में वाचा का विशिष्ट नाम सीधे प्रयुक्त है; उसका लिप्यंतरण नाम की विशिष्टता बनाए रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता है।
- issue: לַעֲשׂוֹת כֵּן में कर्ता और उद्देश्य
  choice: इस्राएली इन विधियों का पालन करें
  alternative: मूसा को ऐसा करने की आज्ञा मिली
  rationale: निकटवर्ती बहुवचन संबोधन और देश में होने वाली प्रजा की गतिविधि उद्देश्य-पाठ का समर्थन करते हैं, यद्यपि इब्रानी अनन्त क्रिया स्वयं कर्ता को स्पष्ट नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कानूनी शब्दावली में मूल के दो अलग पदों का भेद बचाया गया है। वाक्य को हिन्दी के स्वाभाविक क्रम में रखा गया है, पर ‘वहाँ’ और ‘बीच’ जैसे इब्रानी संकेतों को हटाया नहीं गया।
