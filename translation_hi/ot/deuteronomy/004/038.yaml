source:
  edition: WLC
  text: לְ/הוֹרִ֗ישׁ גּוֹיִ֛ם גְּדֹלִ֧ים וַ/עֲצֻמִ֛ים מִמְּ/ךָ֖ מִ/פָּנֶ֑י/ךָ לַ/הֲבִֽיאֲ/ךָ֗ לָֽ/תֶת לְ/ךָ֧ אֶת אַרְצָ֛/ם נַחֲלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/038.yaml
  text: to drive out before you nations greater and mightier than you[a], to bring you in, to give you their land as an inheritance[b], as it is this day.
translation:
  language: hi
  text: ताकि वह तुम्हारे सामने से तुमसे बड़ी और अधिक शक्तिशाली जातियों को निकाल दे, और तुम्हें भीतर ले आए, और उनकी भूमि तुम्हें विरासत के रूप में दे, जैसा आज है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “आज के दिन के समान”; अर्थात “जैसा आज स्पष्ट दिखाई देता है” या “जैसी स्थिति आज है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרִישׁ
  choice: निकाल दे
  rationale: हिफ़ील में यह क्रिया पहले से बसे लोगों को हटाने अथवा बेदखल करने का भाव रखती है। यहाँ कर्म ‘जातियाँ’ है, इसलिए ‘निकाल दे’ स्वाभाविक है और भूमि किसी दूसरे को मिलने के लिए पूर्व निवासियों के हटाए जाने का आशय बनाए रखता है।
- source_word: גּוֹיִם
  choice: जातियों
  rationale: यहाँ राजनीतिक-सामुदायिक समूहों का उल्लेख है; व्यवस्थाविवरण के संदर्भ में ‘जातियाँ’ स्पष्ट और प्रचलित है।
- source_word: גְּדֹלִים וַעֲצֻמִים מִמְּךָ
  choice: जो तुमसे बड़ी और अधिक शक्तिशाली थीं
  rationale: מִמְּךָ तुलना दर्शाता है। ‘बड़ी’ संख्या अथवा व्यापकता और ‘अधिक शक्तिशाली’ सैन्य-सामर्थ्य का तुलनात्मक भाव व्यक्त करता है। भूतकाल ‘थीं’ हिंदी वाक्य में आज दिखाई देने वाले परिणाम की ओर बढ़ते प्रसंग को स्वाभाविक बनाता है।
- source_word: מִפָּנֶיךָ
  choice: तुम्हारे सामने से
  rationale: स्थानगत इब्रानी मुहावरे को लगभग प्रत्यक्ष रूप में रखता है और उनके इस्राएल के आगे से हटाए जाने का अर्थ स्पष्ट करता है।
- source_word: לַהֲבִיאֲךָ
  choice: तुम्हें भीतर ले आए
  rationale: בוא का कारक रूप यहाँ देश में प्रवेश कराने का भाव देता है। गंतव्य अगली पंक्ति से स्पष्ट है, इसलिए उसे दोहराए बिना ‘भीतर’ पर्याप्त है।
- source_word: לָתֶת לְךָ אֶת אַרְצָם
  choice: उनकी भूमि तुम्हें ... दे
  rationale: मूल वाक्य का सीधा अर्थ सुरक्षित रखते हुए भूमि को परमेश्वर के दिए हुए उपहार के रूप में प्रस्तुत करता है।
- source_word: נַחֲלָה
  choice: विरासत में
  rationale: यह शब्द उत्तराधिकार में मिली स्थायी संपत्ति, विशेषकर वाचा के अंतर्गत मिली भूमि, को दर्शाता है। ‘विरासत में’ आधुनिक हिंदी में स्वाभाविक है और इस अर्थ-भार को बनाए रखता है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा आज है
  rationale: व्यवस्थाविवरण का यह मुहावरा वर्तमान में प्रत्यक्ष परिणाम की ओर संकेत करता है। यह अनुवाद शाब्दिक निकटता और आधुनिक हिंदी की सहजता दोनों रखता है।
theological_decisions:
- issue: נַחֲלָה में वाचा-भूमि की शब्दावली
  choice: विरासत में
  alternative: अधिकार के रूप में
  rationale: ‘विरासत’ भूमि को केवल कब्ज़ा नहीं, बल्कि परमेश्वर से मिली उत्तराधिकार-संपत्ति के रूप में प्रस्तुत करती है और व्यवस्थाविवरण की प्रमुख धारणा को बिना अतिरिक्त व्याख्या के सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। एकवचन संबोधन के लिए ‘तुम’ रखा गया है, क्योंकि मूल में इस्राएल को सामूहिक एकवचन रूप में संबोधित किया गया है।
