base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/040.yaml
  text: So you shall keep his statutes and his commandments that I am commanding you today[a], so that it may go well with you and with your children after you[c][b], and so that you may prolong your days on the land that Yahweh your God is giving you for all your days.
translation:
  language: hi
  text: इसलिए तुम उसकी विधियों और आज्ञाओं का पालन करना, जिन्हें मानने की आज्ञा मैं आज तुम्हें दे रहा हूँ, ताकि तुम्हारा और तुम्हारे बाद तुम्हारे बच्चों[a] का भला हो, और तुम उस भूमि पर, जिसे तुम्हारा परमेश्वर याहवे तुम्हें दे रहा है, अपने जीवन भर लंबे समय तक जीवित रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बच्चों’ का अनुवाद ‘बेटों’ या, इस संदर्भ में अधिक व्यापक रूप से, ‘वंशजों’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: इसलिए तुम ... पालन करना
  rationale: שׁמר का वाचा-संबंधी अर्थ ‘पालन करना’ है। आरंभिक वाव पिछले तर्क से निष्कर्षात्मक संबंध जोड़ता है, इसलिए ‘इसलिए’ स्वाभाविक है; हिंदी का ‘पालन करना’ यहाँ आज्ञार्थक बल रखता है।
- source_word: חֻקָּיו
  choice: उसकी विधियों
  rationale: חֻקִּים निर्धारित विधानों को दर्शाता है। ‘विधियाँ’ आधुनिक और गरिमापूर्ण है तथा מִצְוֹת से भेद बनाए रखता है।
- source_word: מִצְוֺתָיו
  choice: आज्ञाओं
  rationale: מִצְוָה के लिए ‘आज्ञा’ वाचा-संबंधी औपचारिकता बनाए रखती है और सामान्य हिंदी में स्पष्ट है।
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: जिन्हें मानने की आज्ञा मैं आज तुम्हें दे रहा हूँ
  rationale: हिब्रू के ‘जिनकी मैं तुम्हें आज आज्ञा दे रहा हूँ’ को हिंदी में स्वाभाविक बनाने के लिए ‘मानने’ स्पष्ट किया गया है; वर्तमान कृदंत की तात्कालिकता ‘दे रहा हूँ’ में बनी रहती है।
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: ताकि तुम्हारा ... भला हो
  rationale: ייטב לְ कल्याण और कुशलता का मुहावरा है। ‘भला हो’ अर्थ को सहज आधुनिक हिंदी में व्यक्त करता है, किसी विशिष्ट भौतिक समृद्धि तक सीमित नहीं करता।
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: और तुम्हारे बाद तुम्हारे बच्चों का
  rationale: בָּנִים का मूल अर्थ ‘बेटे’ हो सकता है, पर पीढ़ीगत संदर्भ में यह संतान को व्यापक रूप से दर्शाता है। ‘बच्चों’ को पाठ में रखा और विकल्प पादटिप्पणी में बताया गया है।
- source_word: וּלְמַעַן תַּאֲרִיךְ יָמִים
  choice: और तुम ... दीर्घायु हो
  rationale: शाब्दिक चित्र ‘अपने दिन लंबे करना’ है। ‘दीर्घायु हो’ उसी अर्थ का संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिंदी रूप है।
- source_word: עַל הָאֲדָמָה
  choice: उस भूमि पर
  rationale: עַל का निकट रूप ‘पर’ है और אֲדָמָה यहाँ परमेश्वर द्वारा दी जाने वाली भूमि को दर्शाता है, केवल मिट्टी को नहीं।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिंदी देवनागरी में ‘याहवे’ रूप में लिप्यंतरित किया गया है।
- source_word: נֹתֵן לְךָ
  choice: तुम्हें ... दे रहा है
  rationale: वर्तमान कृदंत נֹתֵן की जारी अथवा आसन्न क्रिया को ‘दे रहा है’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל הַיָּמִים
  choice: जीवन भर के लिए
  rationale: वाक्यांश का शाब्दिक अर्थ ‘सारे दिनों के लिए’ है। इस संदर्भ में ‘जीवन भर’ अवधि के भाव को सामान्य हिंदी में स्पष्ट करता है, जबकि पाठ-संबंधी अस्पष्टता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चार-अक्षरी व्यक्तिगत नाम है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है और किसी संप्रदाय-विशिष्ट व्याख्या को नहीं जोड़ता।
- issue: आज्ञापालन और कल्याण का संबंध
  choice: ताकि ... भला हो
  alternative: और तब ... भला होगा
  rationale: अर्थगत उद्देश्य/परिणाम संबंध को रखा गया है, पर इसे यांत्रिक या बिना शर्त समृद्धि की गारंटी के रूप में अधिक निश्चित नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। एकवचन संबोधन के लिए ‘तुम’ रखा गया है, जिससे पुरातन ‘तू’ से बचते हुए निकट और स्पष्ट स्वर बना रहता है। ‘विधियाँ’ और ‘आज्ञाएँ’ द्वारा दो हिब्रू विधिक शब्दों का भेद सुरक्षित है।
