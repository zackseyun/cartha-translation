review_pass:
  verdict: revise
  source_fidelity: The draft conveys the legal terms, the generational well-being clause, the divine name, and the land-gift clause accurately. However, ‘दीर्घायु हो’ renders the result acceptably but weakens the explicit Hiphil expression ‘make your days long/prolong your days’; ‘उस भूमि पर लंबे समय तक जीवित रहो’ better represents the source without unnatural literalism.
  naturalness: The Hindi is generally modern and clear. ‘जिसे ... जीवन भर के लिए दे रहा है’ can sound as though the land is granted only for the recipient’s lifetime, while the Hebrew’s final phrase is more directly tied to the duration of life on the land. Recasting the final purpose clause improves clarity and flow.
  terminology: ‘विधियों,’ ‘आज्ञाओं,’ ‘परमेश्वर,’ and ‘याहवे’ are appropriate and consistent. The footnote for ‘बच्चों’ properly preserves the possible narrower or broader sense of בָּנִים. The duration note should be classified as a lexical alternative rather than source ambiguity.
  issues:
  - severity: medium
    issue: ‘दीर्घायु हो’ does not clearly retain the causative/durative wording of תַּאֲרִיךְ יָמִים.
    rationale: The Hebrew idiom literally expresses making one’s days long. ‘उस भूमि पर लंबे समय तक जीवित रहो’ naturally communicates the intended extended duration.
  - severity: low
    issue: ‘जीवन भर के लिए’ is positioned with the land-giving verb and may imply a lifetime-limited grant.
    rationale: The Hebrew phrase כָּל־הַיָּמִים describes duration and is more clearly rendered in Hindi with the preceding long-life clause.
  - severity: low
    issue: Footnote b labels a lexical rendering issue as ‘source_ambiguity.’
    rationale: The Hebrew phrase is not textually disputed; the question is how idiomatically to express its duration.
  revised_text: इसलिए तुम उसकी विधियों और आज्ञाओं का पालन करना, जिन्हें मानने की आज्ञा मैं आज तुम्हें दे रहा हूँ, ताकि तुम्हारा और तुम्हारे बाद तुम्हारे बच्चों[a] का भला हो, और तुम उस भूमि पर, जिसे तुम्हारा परमेश्वर याहवे तुम्हें दे रहा है, अपने जीवन भर लंबे समय तक जीवित रहो।
