source:
  edition: WLC
  text: וְ/הָיָ֗ה הָ/אִישׁ֙ אֲשֶׁ֤ר לֹֽא יִשְׁמַע֙ אֶל דְּבָרַ֔/י אֲשֶׁ֥ר יְדַבֵּ֖ר בִּ/שְׁמִ֑/י אָנֹכִ֖י אֶדְרֹ֥שׁ מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/019.yaml
  text: And the man who does not listen to my words that he speaks in my name—I myself will require it from him[a].
translation:
  language: hi
  text: और जो मनुष्य मेरे उन वचनों को नहीं सुनेगा, जिन्हें वह मेरे नाम से कहेगा, उससे मैं स्वयं इसका हिसाब लूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसे उत्तरदायी ठहराऊँगा।” इब्रानी में शाब्दिक रूप से, “मैं उससे इसकी माँग करूँगा”; यह उसके वचनों को न सुनने के लिए परमेश्वर के सामने जवाबदेही का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और
  rationale: यह पूर्ववर्ती प्रतिज्ञा के परिणाम को आगे बढ़ाता है; हिंदी में सरल ‘और’ स्वाभाविक रूप से यह संबंध व्यक्त करता है।
- source_word: הָאִישׁ
  choice: जो मनुष्य
  rationale: इब्रानी का एकवचन पुल्लिंग प्रतिनिधिक अर्थ रखता है; ‘जो मनुष्य’ स्रोत-रूप को रखते हुए हिंदी में सहज है।
- source_word: לֹא יִשְׁמַע אֶל
  choice: नहीं सुनेगा
  rationale: यहाँ ‘सुनना’ में ध्यान देने और मानने का भाव निहित है; इसे सीधे ‘आज्ञा मानना’ कहने से अर्थ आवश्यकता से अधिक निश्चित हो जाता।
- source_word: דְּבָרַי
  choice: मेरे उन वचनों को
  rationale: बहुवचन ‘मेरे वचन’ को बनाए रखा गया है; ‘उन’ आगे आने वाले संबंधवाचक उपवाक्य से इसे स्वाभाविक रूप से जोड़ता है।
- source_word: אֲשֶׁר יְדַבֵּר
  choice: जिन्हें वह ... कहेगा
  rationale: संबंधवाचक उपवाक्य भविष्य में उस नबी द्वारा बोले जाने वाले वचनों की ओर संकेत करता है।
- source_word: בִּשְׁמִי
  choice: मेरे नाम से
  rationale: यह शाब्दिक मुहावरा परमेश्वर की ओर से और उसके अधिकार के अधीन बोलने का भाव सुरक्षित रखता है।
- source_word: אָנֹכִי
  choice: मैं स्वयं
  rationale: स्वतंत्र सर्वनाम का जोर हिंदी में ‘मैं स्वयं’ द्वारा स्पष्ट किया गया है।
- source_word: אֶדְרֹשׁ מֵעִמּוֹ
  choice: उससे ... हिसाब लूँगा
  rationale: इस प्रसंग में क्रिया किसी को उत्तरदायी ठहराने का न्यायिक भाव रखती है। ‘हिसाब लूँगा’ आधुनिक हिंदी में स्वाभाविक है और दंड का ठीक स्वरूप निर्धारित नहीं करता।
theological_decisions:
- issue: नबी के वचनों को न सुनने पर परमेश्वर की प्रतिक्रिया का स्वरूप
  choice: उससे मैं स्वयं इसका हिसाब लूँगा
  alternative: मैं स्वयं उससे इसकी माँग करूँगा
  rationale: इब्रानी वाक्य परमेश्वर द्वारा उत्तरदायी ठहराए जाने या न्याय का संकेत देता है, पर दंड का विशिष्ट प्रकार नहीं बताता। चुना हुआ पाठ इस गंभीरता को बनाए रखता है और अनावश्यक सिद्धान्तगत विवरण नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गंभीर किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘वचन’ बाइबलीय गरिमा बनाए रखता है, जबकि ‘हिसाब लूँगा’ उत्तरदायित्व के न्यायिक भाव को स्वाभाविक हिंदी में व्यक्त करता है।
