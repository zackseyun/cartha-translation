source:
  edition: WLC
  text: וְ/כִֽי יָבֹ֨א הַ/לֵּוִ֜י מֵ/אַחַ֤ד שְׁעָרֶ֨י/ךָ֙ מִ/כָּל יִשְׂרָאֵ֔ל אֲשֶׁר ה֖וּא גָּ֣ר שָׁ֑ם וּ/בָא֙ בְּ/כָל אַוַּ֣ת נַפְשׁ֔/וֹ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/006.yaml
  text: And if the Levite comes from one of your gates out of all Israel[a], where he is residing, and comes with all the desire of his soul to the place that Yahweh will choose[b],
translation:
  language: hi
  text: और यदि कोई लेवी समूचे इस्राएल में स्थित तुम्हारे किसी भी नगर[a] से, जहाँ वह रहता हो, आए, और अपने मन की पूरी इच्छा लेकर उस स्थान पर आए जिसे याहवे चुनेगा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘तुम्हारे किसी फाटक से।’ यहाँ ‘फाटक’ से आशय उस नगर या बस्ती से है जिसका वह फाटक था।
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: और यदि
  rationale: यह पद पिछले विधान से जुड़ी हुई एक शर्त प्रस्तुत करता है; ‘और यदि’ संयोजक और शर्त—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַלֵּוִי
  choice: कोई लेवी
  rationale: इब्रानी का निश्चित पदबंध विधिक प्रसंग में प्रतिनिधि व्यक्ति को सूचित करता है। हिन्दी में ‘कोई लेवी’ इस सामान्य, काल्पनिक मामले को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵאַחַד שְׁעָרֶיךָ
  choice: तुम्हारे किसी नगर से
  rationale: शाब्दिक अर्थ ‘तुम्हारे किसी फाटक से’ है, पर यहाँ ‘फाटक’ नगर या नागरिक बस्ती के लिए लक्षणा है। मुख्य पाठ में ‘नगर’ आशय को स्पष्ट और सहज रखता है।
- source_word: מִכָּל יִשְׂרָאֵל
  choice: इस्राएल भर में
  rationale: यह अभिव्यक्ति इस्राएल के समूचे क्षेत्र में स्थित किसी भी नगर से आने का वितरणात्मक भाव देती है।
- source_word: אֲשֶׁר הוּא גָּר שָׁם
  choice: जहाँ वह रह रहा हो
  rationale: גור यहाँ किसी स्थान पर निवास करने का अर्थ देता है। लेवी की भूमिहीन स्थिति को प्रसंग स्पष्ट करता है; ‘परदेशी’ जोड़ना इस अंतर-इस्राएली प्रसंग में अनावश्यक अतिव्याख्या होती।
- source_word: וּבָא
  choice: और ... आए
  rationale: दूसरे ‘आए’ को बनाए रखने से स्रोत में प्रस्थान-स्थान से आने और चुने हुए स्थान तक आने की क्रियात्मक पुनरावृत्ति सुरक्षित रहती है।
- source_word: בְּכָל אַוַּת נַפְשׁוֹ
  choice: अपने मन की पूरी अभिलाषा से
  rationale: यह वाक्यांश व्यक्ति की संपूर्ण आंतरिक इच्छा या लालसा व्यक्त करता है। ‘मन’ आधुनिक हिन्दी में נֶפֶשׁ के इस इच्छात्मक प्रयोग को स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: אֶל הַמָּקוֹם
  choice: उस स्थान पर
  rationale: स्रोत केवल ‘स्थान’ कहता है। केंद्रीय उपासना-स्थल का संदर्भ प्रसंग में निहित है, इसलिए मुख्य पाठ में ‘पवित्रस्थान’ नहीं जोड़ा गया।
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: जिसे याहवे चुनेगा
  rationale: अपूर्ण क्रिया का भाव यहाँ भविष्यसूचक है और व्यवस्थाविवरण में चुने जाने वाले स्थान के प्रचलित सूत्र से मेल खाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: ‘स्थान’ की पहचान
  choice: उस स्थान पर
  alternative: पवित्रस्थान में / उपासना-स्थान पर
  rationale: प्रसंग केंद्रीय उपासना-स्थल की ओर संकेत करता है, पर इब्रानी पाठ यहाँ केवल הַמָּקוֹם (‘स्थान’) कहता है; इसलिए निहित अर्थ को मुख्य पाठ में स्पष्ट संज्ञा बनाकर नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक प्रसंग के अनुरूप रखी गई है। वाक्य अगले पद में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है। ‘कोई लेवी’ प्रतिनिधि विधिक मामले को सहज हिन्दी में व्यक्त करता है; ‘नगर’ लाक्षणिक अर्थ को मुख्य पाठ में स्पष्ट करता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
