language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא יִמָּצֵ֣א בְ/ךָ֔ מַעֲבִ֥יר בְּנֽ/וֹ וּ/בִתּ֖/וֹ בָּ/אֵ֑שׁ קֹסֵ֣ם קְסָמִ֔ים מְעוֹנֵ֥ן וּ/מְנַחֵ֖שׁ וּ/מְכַשֵּֽׁף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/010.yaml
  text: There must not be found among you anyone who makes his son or his daughter pass through the fire[a], one who practices divination, tells fortunes, interprets omens[d][c][b], or practices sorcery.
translation:
  language: hi
  text: तुम्हारे बीच कोई ऐसा व्यक्ति न पाया जाए जो अपने पुत्र या पुत्री को आग में से पार कराए[a], दिव्यज्ञान का अभ्यास करे, भविष्य बताए[b], शकुनों का अर्थ निकाले[c], या जादू-टोना करे[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पुत्र या पुत्री को आग में जलाए,” अथवा “आग में बलि चढ़ाए।” इब्रानी का शाब्दिक अर्थ है, “अपने पुत्र या पुत्री को आग में से पार कराए।”
    reason: alternative_reading
  - marker: b
    text: इस कठिन इब्रानी शब्द का अर्थ “मुहूर्त या समय देखकर फल बताए” भी समझा गया है।
    reason: lexical_alternative
  - marker: c
    text: या “शकुन-विचार करे” अथवा “संकेतों के आधार पर भविष्य बताए।”
    reason: lexical_alternative
  - marker: d
    text: या “तंत्र-मंत्र करे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא בְךָ
  choice: तुम्हारे बीच ... न पाया जाए
  rationale: निषेध के साथ निफ़अल रूप समुदाय के भीतर ऐसी प्रथा की अनुमति न होने का विधान व्यक्त करता है; ‘तुम्हारे बीच’ सामुदायिक संदर्भ में स्वाभाविक हिन्दी है।
- source_word: מַעֲבִיר בְּנוֹ וּבִתּוֹ בָּאֵשׁ
  choice: अपने बेटे या बेटी को आग में से पार कराए
  rationale: हिफ़इल कृदन्त का मूल अर्थ ‘पार कराना’ है। यह अनुवाद अग्नि से जुड़े निषिद्ध बाल-अनुष्ठान को व्यक्त करता है, पर इस पद से आगे बढ़कर उसके सटीक स्वरूप को निर्धारित नहीं करता।
- source_word: קֹסֵם קְסָמִים
  choice: शकुन-विचार करे
  rationale: कृदन्त और सजातीय कर्म का वाक्यांश भविष्य या अज्ञात जानने के लिए शकुन-विधि के अभ्यास को दर्शाता है; ‘शकुन-विचार’ संक्षिप्त और आधुनिक हिन्दी में बोधगम्य है।
- source_word: מְעוֹנֵן
  choice: भविष्य बताए
  rationale: यह कठिन शब्द विभिन्न रूपों में समझा गया है, जिनमें मुहूर्त या समय देखकर फल बताना भी शामिल है। मुख्य पाठ में व्यापक और सहज अर्थ रखा गया है तथा अस्पष्टता पाद-टिप्पणी में बताई गई है।
- source_word: מְנַחֵשׁ
  choice: लक्षणों से शुभ-अशुभ निकाले
  rationale: यह क्रिया संकेतों या लक्षणों के आधार पर शकुन निकालने से जुड़ी है। यह अभिव्यक्ति निकटवर्ती व्यापक शकुन-विचार और भविष्य बताने वाले पदों से कुछ भेद बनाए रखती है।
- source_word: מְכַשֵּׁף
  choice: जादू-टोना करे
  rationale: पिअल कृदन्त जादुई क्रियाओं में लगे व्यक्ति को दर्शाता है। ‘जादू-टोना करे’ साधारण आधुनिक हिन्दी में स्पष्ट है और सूची की क्रियात्मक शैली के अनुरूप है।
theological_decisions:
- issue: बच्चे और आग से जुड़े निषेध का स्वरूप
  choice: इब्रानी मुहावरे के निकट ‘अपने बेटे या बेटी को आग में से पार कराए’ रखा गया।
  alternative: ‘अपने बेटे या बेटी को आग में जलाए’ अथवा ‘आग में बलि चढ़ाए।’
  rationale: संदर्भ बच्चों और आग से जुड़े एक निषिद्ध अनुष्ठान की निन्दा करता है, पर इस पद का इब्रानी वाक्यांश स्वयं उसके हर विवरण को स्पष्ट नहीं करता। इसलिए मुख्य पाठ वास्तविक अस्पष्टता को बनाए रखता है और वैकल्पिक समझ पाद-टिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, विधिक निषेध के अनुरूप गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। निकट अर्थ वाले गूढ़ व्यवहारों के बीच जहाँ संभव हो भेद रखा गया है, जबकि कठिन इब्रानी पदों की अनिश्चितता पाद-टिप्पणियों में सुरक्षित है।
