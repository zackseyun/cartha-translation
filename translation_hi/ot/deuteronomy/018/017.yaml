  yaml_path: translation/ot/deuteronomy/018/017.yaml
  text: And Yahweh said to me[a], ‘They have spoken well.’
translation:
  language: hi
  text: तब याहवे ने मुझसे कहा, “उन्होंने जो कहा, अच्छा कहा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वय्यिक्तोल रूप कथा में अगली घटना को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब ... ने कहा’ स्वाभाविक क्रम व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֵלָי
  choice: मुझसे
  rationale: אֶל के प्रथम पुरुष एकवचन प्रत्यय का अर्थ ‘मुझसे/मेरे पास’ है; बोलने की क्रिया के साथ ‘मुझसे कहा’ स्वाभाविक हिन्दी है।
- source_word: הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ
  choice: उन्होंने जो कहा है, वह ठीक कहा है
  rationale: शाब्दिक संरचना ‘उन्होंने जो कहा, उसे अच्छा किया’ कही जा सकती है, पर यहाँ הֵיטִיבוּ कथन का सकारात्मक मूल्यांकन करता है। चुना हुआ रूप सापेक्ष संरचना को बनाए रखते हुए स्वाभाविक हिन्दी में ‘ठीक कहा’ व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, उपाधि ‘प्रभु’ नहीं। हिन्दी पाठकों में सुविज्ञेय नाम-रूप ‘यहोवा’ रखा गया है; ‘याहवे’ अधिक प्रत्यक्ष आधुनिक लिप्यंतरण है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और कथात्मक। मूल की सापेक्ष रचना तथा कथन के अनुमोदन को सहज हिन्दी में सुरक्षित रखा गया है।
