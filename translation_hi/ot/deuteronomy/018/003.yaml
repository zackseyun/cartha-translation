base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/003.yaml
  text: 'And this shall be the priests’ due from the people[a], from those who sacrifice a sacrifice, whether an ox or a sheep: he shall give to the priest the shoulder, the two cheeks[d][c][b], and the stomach.'
translation:
  language: hi
  text: 'और लोगों से—अर्थात जो बलि चढ़ाते हैं उनसे—याजकों का यह नियत भाग होगा: चाहे कोई बैल या भेड़ की बलि चढ़ाए, वह याजक को अगला पैर[a], दोनों गाल[b], और आमाशय[c] दे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “बाँह”; यहाँ पशु का अगला पैर या कंधे का भाग अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या “जबड़े” या “जबड़ों के भाग।” इब्रानी शब्द द्विवचन में है और मुख्यतः दोनों गालों को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: परंपरागत अनुवादों में “जठर।” इब्रानी शब्द पशु के पेट या आमाशय को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: अधिकार
  rationale: विधिक और उपासना-संबंधी प्रसंग में यह शब्द याजकों को निर्धारित रूप से मिलने वाले वैध भाग को दर्शाता है; इसलिए ‘न्याय’ की अपेक्षा ‘अधिकार’ अधिक स्वाभाविक है।
- source_word: הַכֹּהֲנִים
  choice: याजकों का
  rationale: बहुवचन को बनाए रखते हुए इसे ‘अधिकार’ के साथ संबंधकारक रूप में रखा गया है।
- source_word: מֵאֵת הָעָם מֵאֵת זֹבְחֵי הַזֶּבַח
  choice: लोगों में से जो कोई बलि चढ़ाता है ... उससे
  rationale: दूसरा पद पहले पद के समूह को स्पष्ट करता है—यह अधिकार उन लोगों से है जो बलि चढ़ाते हैं। हिंदी में कृत्रिम ‘बलि की बलि देनेवाले’ से बचते हुए अर्थ स्पष्ट रखा गया है।
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: चाहे बैल हो या भेड़
  rationale: दोनों वैकल्पिक बलि-पशुओं को सहज आधुनिक हिंदी में व्यक्त करता है। שֶׂה कभी व्यापक छोटे पालतू पशु को भी सूचित कर सकता है, पर यहाँ ‘भेड़’ पठनीय और प्रसंगानुकूल है।
- source_word: וְנָתַן
  choice: वह ... दे
  rationale: इब्रानी का एकवचन प्रत्येक बलि चढ़ानेवाले पर अलग-अलग लागू होता है; हिंदी में ‘वह’ उसी वितरणात्मक अर्थ को बनाए रखता है।
- source_word: לַכֹּהֵן
  choice: याजक को
  rationale: इब्रानी के निश्चित रूप के अनुरूप बलि से संबद्ध याजक को संकेत करता है।
- source_word: הַזְּרֹעַ
  choice: अगला पैर
  rationale: शाब्दिक अर्थ ‘बाँह’ है, पर पशु के अंग के लिए यहाँ अगला पैर अथवा कंधे का भाग अभिप्रेत है। ‘अगला पैर’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: הַלְּחָיַיִם
  choice: दोनों जबड़े
  rationale: द्विवचन रूप को ‘दोनों’ से स्पष्ट किया गया है। शब्द गालों अथवा जबड़ों को सूचित कर सकता है; पशु-अंग के संदर्भ में ‘जबड़े’ स्वाभाविक है।
- source_word: הַקֵּבָה
  choice: आमाशय
  rationale: यह पशु के पेट/आमाशय को सूचित करता है। ‘आमाशय’ सटीक, वर्तमान और गरिमापूर्ण हिंदी है।
