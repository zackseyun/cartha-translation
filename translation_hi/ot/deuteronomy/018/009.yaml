  text: כִּ֤י אַתָּה֙ בָּ֣א אֶל הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹֽא תִלְמַ֣ד לַ/עֲשׂ֔וֹת כְּ/תוֹעֲבֹ֖ת הַ/גּוֹיִ֥ם הָ/הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/009.yaml
  text: When you come into the land that Yahweh your God is giving you[a], you shall not learn to do according to the abominations of those nations.
translation:
  language: hi
  text: जब तुम उस देश में प्रवेश करोगे जिसे तुम्हारा परमेश्वर यहोवा तुम्हें दे रहा है, तब उन जातियों के घृणित कामों के अनुसार आचरण करना मत सीखना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन जातियों के घृणित कामों के समान आचरण करना”; इब्रानी संबंधबोधक अव्यय तुलना या अनुरूपता—दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ यह शब्द अगले निषेध की समय-संबंधी परिस्थिति बताता है; आधुनिक हिन्दी में ‘जब’ स्वाभाविक है।
- source_word: בָּא אֶל־הָאָרֶץ
  choice: उस देश में प्रवेश करो
  rationale: संदर्भ में कृदन्त का भाव निकट भविष्य में प्रवेश करने का है; ‘प्रवेश करो’ भूमि के भीतर आने की गति स्पष्ट करता है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर यहोवा
  rationale: व्यक्तिगत दिव्य नाम को ‘यहोवा’ और संबंधसूचक पद को ‘तुम्हारा परमेश्वर’ रूप में रखा गया है।
- source_word: נֹתֵן לָךְ
  choice: तुम्हें दे रहा है
  rationale: कृदन्त परमेश्वर द्वारा चल रही अथवा आसन्न देन को व्यक्त करता है।
- source_word: לֹא תִלְמַד לַעֲשׂוֹת
  choice: करना न सीखना
  rationale: निषेधात्मक अपूर्ण क्रिया और उसके क्रियार्थक पूरक को संक्षिप्त, विधिक किन्तु स्वाभाविक हिन्दी में रखा गया है।
- source_word: כְּתוֹעֲבֹת
  choice: घृणित कामों के अनुसार
  rationale: ‘घृणित काम’ תּוֹעֵבָה की प्रबल नैतिक-धार्मिक निन्दा और बहुवचन के व्यावहारिक आशय को व्यक्त करता है; ‘के अनुसार’ כְ के अनुरूपता-भाव को रखता है।
- source_word: הַגּוֹיִם הָהֵם
  choice: उन जातियों
  rationale: व्यवस्थाविवरण के भौगोलिक-सामुदायिक संदर्भ में ‘जातियाँ’ उपयुक्त है और दूरवाचक संकेत ‘उन’ में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, चतुरक्षरी व्यक्तिगत नाम है। हिन्दी बाइबल-पाठकों में प्रचलित नामरूप ‘यहोवा’ रखते हुए उसे ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: תּוֹעֵבָה की निन्दात्मक तीव्रता
  choice: घृणित काम
  alternative: घिनौने काम / घृणित रीति-रिवाज
  rationale: यह शब्द प्रबल वाचा-संबंधी नैतिक और धार्मिक निन्दा करता है। ‘काम’ अगले पदों में गिनाई जाने वाली प्रथाओं को समेटता है, पर उन्हें समय से पहले किसी एक श्रेणी तक सीमित नहीं करता।
- issue: כְ में तुलना अथवा अनुरूपता
  choice: के अनुसार
  alternative: जैसे
  rationale: मुख्य पाठ में उन जातियों की प्रथाओं के अनुरूप आचरण सीखने का भाव लिया गया है; तुलना का निकट वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठक के लिए सहज। कानूनी निषेध की दृढ़ता ‘न सीखना’ से रखी गई है। ‘देश’ व्यवस्थाविवरण के भूभाग-संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
