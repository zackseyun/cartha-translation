base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/004.yaml
  text: You shall give him the firstfruits of your grain[a], your new wine, and your oil[c][b], and the first of the fleece of your flock.
translation:
  language: hi
  text: तुम अपने अनाज[a], नए दाखमधु[b] और तेल का पहला भाग, और अपनी भेड़-बकरियों की ऊन का पहला भाग[c] उसे देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने अनाज, नए दाखमधु और तेल का पहला भाग।”
    reason: lexical_alternative
  - marker: b
    text: “नया दाखमधु” उस इब्रानी शब्द का अनुवाद है जो प्रायः हाल ही में तैयार हुए दाखमधु के लिए प्रयुक्त होता है।
    reason: cultural_note
  - marker: c
    text: या, “अपनी भेड़-बकरियों की पहली कतराई की ऊन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: पहली उपज
  rationale: यह शब्द आरम्भिक या पहले भाग को दर्शाता है। कृषि-उपज के प्रसंग में ‘पहली उपज’ स्वाभाविक है; ऊन के साथ इसी शब्द को कतराई से प्राप्त पहले भाग के रूप में व्यक्त किया गया है।
- source_word: דָּגָן
  choice: अनाज
  rationale: यह विभिन्न प्रकार की अन्न-उपज के लिए व्यापक शब्द है; आधुनिक हिन्दी में ‘अनाज’ स्पष्ट और स्वाभाविक है।
- source_word: תִּירוֹשׁ
  choice: नई दाखमधु
  rationale: यह सामान्यतः ताज़ा तैयार हुई दाखमधु को सूचित करता है। ‘नई दाखमधु’ मूल शब्द का भेद बनाए रखती है।
- source_word: יִצְהָר
  choice: तेल
  rationale: इस्राएली परिवेश में इससे सामान्यतः जैतून का तेल अभिप्रेत है, पर मूल शब्द केवल तेल कहता है; इसलिए अनावश्यक विशिष्टीकरण नहीं किया गया।
- source_word: גֵּז
  choice: कतरने पर मिली ऊन
  rationale: यह शब्द कतराई अथवा उससे प्राप्त ऊन को दर्शा सकता है। मुख्य पाठ में दोनों पहलुओं को स्वाभाविक हिन्दी में समेटा गया है और विकल्प पादटिप्पणी में रखा गया है।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: यह सामूहिक संज्ञा छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, को समेट सकती है; ‘भेड़-बकरियाँ’ हिन्दी पाठक के लिए इसके दायरे को स्पष्ट रखता है।
- source_word: תִּתֶּן לוֹ
  choice: उसे देना
  rationale: हिब्रू अपूर्ण क्रिया यहाँ विधिक निर्देश व्यक्त करती है। ‘देना’ इस आदेशात्मक विधान-शैली को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: לוֹ (‘उसे’) का संदर्भ
  choice: एकवचन सर्वनाम ‘उसे’ बनाए रखा गया
  alternative: ‘याजक को’ या सामूहिक रूप से ‘याजकों को’
  rationale: निकटवर्ती प्रसंग में प्राप्तकर्ता याजक है, पर पद स्वयं एकवचन सर्वनाम प्रयोग करता है। ‘उसे’ व्याकरणिक रूप और संदर्भगत खुलापन दोनों सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण विधिक शैली रखी गई है। कृषि और पशुपालन संबंधी शब्द सामान्य पाठकों के लिए सहज चुने गए हैं; मूल की पुनरुक्ति और अर्थगत अस्पष्टता को जहाँ आवश्यक था, पादटिप्पणियों में सुरक्षित रखा गया है।
