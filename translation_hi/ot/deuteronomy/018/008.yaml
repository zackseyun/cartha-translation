source:
  edition: WLC
  text: חֵ֥לֶק כְּ/חֵ֖לֶק יֹאכֵ֑לוּ לְ/בַ֥ד מִמְכָּרָ֖י/ו עַל הָ/אָבֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/008.yaml
  text: They shall eat equal portions[a], besides what comes from the sale of his patrimony.
translation:
  language: hi
  text: वे बराबर हिस्से का भोजन करेंगे, इसके अलावा उस लेवी को अपने पैतृक घराने से संबंधित बिक्री या आय से जो कुछ मिलता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अंतिम इब्रानी वाक्यांश कठिन है। इसका अनुवाद यह भी हो सकता है: “इसके अलावा, जो उसे कुल की संपत्ति बेचने से मिलता है।” यह अधिक व्यापक रूप से उसके पैतृक घराने से जुड़ी आय का संकेत भी कर सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק כְּחֵלֶק
  choice: बराबर का भाग
  rationale: शाब्दिक रूप से ‘भाग के समान भाग’; यह मुहावरा समान हिस्से को व्यक्त करता है। ‘बराबर का भाग’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יֹאכֵלוּ
  choice: भोजन में ... पाएँगे
  rationale: क्रिया का मूल अर्थ ‘खाएँगे’ है, पर यहाँ याजकीय भोजन में मिलने वाले हिस्से का उपभोग अभिप्रेत है। यह रूप ठोस भोजन-संदर्भ बनाए रखते हुए हिन्दी में स्पष्ट है।
- source_word: לְבַד
  choice: इसके अलावा
  rationale: यह समान भाग से अलग किसी अतिरिक्त आय या प्राप्ति का संकेत देता है।
- source_word: מִמְכָּרָיו
  choice: जो उसे ... बेचने से मिले
  rationale: शब्द बिक्री, बेची हुई वस्तु, अथवा बिक्री से प्राप्त धन का बोध करा सकता है; वाक्यांश इस संभावित अर्थ को सहज हिन्दी में रखता है।
- source_word: עַל הָאָבוֹת
  choice: अपनी पैतृक संपत्ति
  rationale: शाब्दिक वाक्यांश ‘पितरों/पूर्वजों पर’ संक्षिप्त और कठिन है। संदर्भ में इसे वंश या पैतृक घराने से जुड़ी संपत्ति के रूप में समझना संभावित है, पर अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: अंतिम वाक्यांश מִמְכָּרָיו עַל הָאָבוֹת की व्याख्या
  choice: पैतृक संपत्ति की बिक्री से मिलने वाली निजी प्राप्ति, जो समान याजकीय भाग के अतिरिक्त है
  alternative: अपने कुल या पैतृक घराने से जुड़ी अन्य आय; अथवा कुल की संपत्ति बेचने से मिली रकम
  rationale: इब्रानी रचना अत्यंत संक्षिप्त और व्याकरण की दृष्टि से कठिन है। मुख्य पाठ में संदर्भानुकूल संभावित अर्थ दिया गया है, जबकि पादटिप्पणी व्यापक अनिश्चितता बनाए रखती है और किसी विशिष्ट धर्मसैद्धांतिक निष्कर्ष को नहीं जोड़ती।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। ‘बराबर का भाग’ समान वितरण को व्यक्त करता है; ‘भोजन में’ मूल क्रिया ‘खाना’ के ठोस संदर्भ को बनाए रखता है। अंतिम कठिन वाक्यांश की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
