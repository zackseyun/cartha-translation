  yaml_path: translation/ot/deuteronomy/018/002.yaml
  text: He shall have no inheritance among his brothers[a]; Yahweh is his inheritance[b], as he spoke to him.
translation:
  language: hi
  text: और उसके भाइयों[a] के बीच उसकी कोई विरासत न होगी; यहोवा ही उसकी विरासत है, जैसा उसने उससे कहा था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके संबंधियों।’ इब्रानी में शाब्दिक रूप से ‘उसके भाइयों’ है; यहाँ आशय उसके साथी इस्राएलियों से, विशेषकर अन्य गोत्रों से है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जैसा उसने उससे बात की थी।’ इब्रानी क्रिया का सामान्य अर्थ ‘बोलना/कहना’ है। प्रसंग में ‘जैसा उसने उससे प्रतिज्ञा की थी’ संभव है, पर वह अधिक व्याख्यात्मक होगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה / נַחֲלָתוֹ
  choice: विरासत / विरासत का भाग
  rationale: व्यवस्थाविवरण में यह शब्द भूमि के पैतृक आवंटन को दर्शाता है। पहले खंड में स्वाभाविक हिन्दी के लिए ‘विरासत का भाग’ और दूसरे में रूपक की संक्षिप्तता के लिए ‘विरासत’ रखा गया है; दोनों प्रयोग मूल की पुनरावृत्ति और भूमि-संबंधी तथा वाचागत अर्थों को बनाए रखते हैं।
- source_word: בְּקֶרֶב
  choice: के बीच
  rationale: यह अपने समुदाय या संबंधियों के मध्य होने का स्वाभाविक हिन्दी मुहावरा है।
- source_word: אֶחָיו
  choice: अपने भाइयों
  rationale: मूल इब्रानी पुल्लिंग बहुवचन में ‘उसके भाई’ कहता है; प्रसंग में इससे उसके साथी इस्राएली, विशेषकर अन्य गोत्र, अभिप्रेत हैं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: הוּא
  choice: ही
  rationale: 'स्वतंत्र सर्वनाम का बल हिन्दी में ‘ही’ से स्वाभाविक रूप से व्यक्त होता है: यहोवा ही उसकी विरासत है।'
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: जैसा उसने उससे कहा था
  rationale: דִּבֶּר सामान्यतः ‘बोलना/कहना’ है। ‘कहा था’ स्वाभाविक हिन्दी है और ‘प्रतिज्ञा की’ जैसे अधिक व्याख्यात्मक अर्थ को पाठ में नहीं जोड़ता।
theological_decisions:
- issue: एकवचन सर्वनामों (‘उसका’, ‘उसकी’, ‘उससे’) का संदर्भ
  choice: एकवचन को बनाए रखा गया है, जो लेवी/लेवीय याजक का सामूहिक या प्रतिनिधिक उल्लेख हो सकता है।
  alternative: इसे केवल पूर्वज लेवी या प्रत्येक व्यक्तिगत याजक का स्पष्ट उल्लेख मानकर विस्तार करना।
  rationale: इब्रानी में सामूहिक समुदाय के लिए प्रतिनिधिक एकवचन सामान्य है। स्रोत-रूप बनाए रखने से किसी एक संकीर्ण संदर्भ को अनावश्यक रूप से निश्चित नहीं किया जाता।
- issue: ‘यहोवा ही उसकी विरासत है’ का स्वरूप
  choice: वाचागत-रूपक कथन को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘भूमि के बदले यहोवा उसका आवंटित भाग है’ जैसा स्पष्टीकरण जोड़ना।
  rationale: मूल पाठ स्वयं यहोवा को उसकी विरासत कहता है; यही संक्षिप्तता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज स्तर रखा गया है। ‘विरासत’ प्रमुख शब्द की पुनरावृत्ति को यथासंभव सुरक्षित रखता है; पहले प्रयोग में ‘का भाग’ जोड़कर भूमि-आवंटन का अर्थ स्वाभाविक किया गया है। मुख्य पाठ में दोनों पाद-टिप्पणी चिह्न [a], [b] उपस्थित हैं।
