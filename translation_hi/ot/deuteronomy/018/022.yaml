source:
  edition: WLC
  text: אֲשֶׁר֩ יְדַבֵּ֨ר הַ/נָּבִ֜יא בְּ/שֵׁ֣ם יְהוָ֗ה וְ/לֹֽא יִהְיֶ֤ה הַ/דָּבָר֙ וְ/לֹ֣א יָב֔וֹא ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָ֑ה בְּ/זָדוֹן֙ דִּבְּר֣/וֹ הַ/נָּבִ֔יא לֹ֥א תָג֖וּר מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/022.yaml
  text: When the prophet speaks in the name of Yahweh[a], and the matter does not happen or come about, that is the matter that Yahweh has not spoken. The prophet has spoken it presumptuously[c][b]; you shall not fear him.
translation:
  language: hi
  text: जब कोई भविष्यद्वक्ता याहवे के नाम से कोई बात कहे, और वह बात न घटे, न पूरी हो[a], तो यही वह बात है जिसे याहवे ने नहीं कहा। भविष्यद्वक्ता ने उसे धृष्टतापूर्वक कहा है[b]; उससे मत डरना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बात’ के लिए प्रयुक्त इब्रानी शब्द דָּבָר का अर्थ ‘वचन’, ‘विषय’ या बताई गई ‘घटना’ भी हो सकता है; यहाँ कथन और उसके पूरा होने—दोनों का भाव उपस्थित है।
    reason: lexical_alternative
  - marker: b
    text: ‘धृष्टतापूर्वक’ का अर्थ है कि भविष्यद्वक्ता ने याहवे का अधिकार पाए बिना जानबूझकर उद्दंडता से यह बात कही।
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר יְדַבֵּר הַנָּבִיא
  choice: जब कोई भविष्यद्वक्ता ... कहे
  rationale: इब्रानी निश्चित पदबंध ‘वह भविष्यद्वक्ता’ यहाँ व्यवस्था के एक प्रतिनिधि मामले को प्रस्तुत करता है। स्वाभाविक हिन्दी में इसका सामान्य अर्थ ‘कोई भविष्यद्वक्ता’ से स्पष्ट होता है, जबकि विधिक शर्त ‘जब ... कहे’ से बनी रहती है।
- source_word: בְּשֵׁם יְהוָה
  choice: याहवे के नाम से
  rationale: यह दावा की गई ईश्वरीय सत्ता के अधीन बोलने का सूत्र है। याहवे व्यक्तिगत नाम יהוה का हिन्दी लिप्यंतरण है।
- source_word: הַדָּבָר
  choice: बात
  rationale: דָּבָר कथित वचन, उसके विषय और बताई गई घटना—इन सबकी ओर संकेत कर सकता है। हिन्दी ‘बात’ इस अर्थ-विस्तार और पद की पुनरावृत्ति को सहज रूप से बनाए रखती है।
- source_word: וְלֹא יִהְיֶה הַדָּבָר וְלֹא יָבוֹא
  choice: और वह बात न घटे, न पूरी हो
  rationale: दोनों इब्रानी क्रियाओं को अलग रखते हुए यह अनुवाद भविष्यवाणी के घटित अथवा सिद्ध न होने का स्वाभाविक हिन्दी रूप देता है।
- source_word: הוּא הַדָּבָר אֲשֶׁר לֹא דִבְּרוֹ יְהוָה
  choice: तो वह वही बात है जिसे याहवे ने नहीं कहा
  rationale: ‘वही’ इब्रानी सर्वनाम הוּא के पहचान और बल देने वाले कार्य को दर्शाता है; ‘जिसे’ पूर्ववर्ती ‘बात’ से संबंध स्पष्ट करता है।
- source_word: בְּזָדוֹן דִּבְּרוֹ הַנָּבִיא
  choice: भविष्यद्वक्ता ने उसे अपनी धृष्टता से कहा है
  rationale: זָדוֹן में अधिकार के बिना जानबूझकर और उद्दंडतापूर्वक बोलने का भाव है। ‘अपनी धृष्टता से’ इस नैतिक भाव को व्यक्त करता है और ‘उसे’ वस्तु-प्रत्यय को बनाए रखता है।
- source_word: לֹא תָגוּר מִמֶּנּוּ
  choice: उससे मत डरना
  rationale: यह संक्षिप्त और स्वाभाविक हिन्दी निषेध है, जो उस भविष्यद्वक्ता से भयभीत या आतंकित न होने की विधिक आज्ञा को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसे शीर्षक से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित करता है।
- issue: भविष्यद्वाणी की कसौटी का दायरा
  choice: इस पद को दावे की गई भविष्यवाणी के पूरा न होने की पाठगत कसौटी तक सीमित रखा गया है।
  alternative: हर प्रकार की भविष्यद्वाणी के विषय में एक विस्तृत धर्मसैद्धांतिक नियम जोड़ना
  rationale: इब्रानी पद केवल उस कथन की चर्चा करता है जो याहवे के नाम से कहा गया, पर घटित नहीं हुआ। अनुवाद इस सीमा से आगे कोई संप्रदायगत निष्कर्ष नहीं जोड़ता।
- issue: בְּזָדוֹן में दोष का स्वरूप
  choice: अपनी धृष्टता से
  alternative: अनजाने में; केवल भूल से
  rationale: शब्द में उद्दंड, स्वेच्छाचारी और अधिकार-विहीन साहस का भाव है; इसलिए साधारण मानवीय भूल का अर्थ देना अपर्याप्त होता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, विधिक और गरिमापूर्ण रखी गई है। ‘न घटे, न पूरी हो’ इब्रानी की दोहरी अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है। ‘भविष्यद्वक्ता’ प्रचलित बाइबिलीय पद है, जबकि बाकी वाक्यरचना सामान्य पाठक के लिए सीधी रखी गई है।
