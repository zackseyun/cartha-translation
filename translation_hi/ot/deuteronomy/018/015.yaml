source:
  edition: WLC
  text: נָבִ֨יא מִ/קִּרְבְּ/ךָ֤ מֵ/אַחֶ֨י/ךָ֙ כָּמֹ֔/נִי יָקִ֥ים לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֵלָ֖י/ו תִּשְׁמָעֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/015.yaml
  text: Yahweh your God will raise up for you a prophet like me from among you[a], from your brothers[b]; you must listen to him.
translation:
  language: hi
  text: तुम्हारा परमेश्वर यहोवा तुम्हारे बीच से, तुम्हारे भाइयों में से, मेरे समान एक भविष्यद्वक्ता तुम्हारे लिए खड़ा करेगा; तुम उसकी बात अवश्य सुनना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भाइयों” के लिए प्रयुक्त इब्रानी पुल्लिंग संबंध-सूचक शब्द यहाँ सामान्यतः इस्राएल समुदाय के सदस्यों को दर्शाता है। नए नियम में इस पद को मसीह पर लागू किया गया है; पर इब्रानी पाठ यहाँ केवल “मेरे समान एक भविष्यद्वक्ता” कहता है।
    reason: lexical_alternative; cross_reference
lexical_decisions:
- source_word: נָבִיא
  choice: एक भविष्यद्वक्ता
  rationale: इब्रानी में अनिश्चित एकवचन है। यह पद परमेश्वर की ओर से बोलने वाले व्यक्ति को दर्शाता है, पर मुख्य पाठ में उसकी पहचान को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: מִקִּרְבְּךָ
  choice: तुम्हारे बीच से
  rationale: यह शाब्दिक अर्थ के निकट और स्वाभाविक हिन्दी है तथा बताता है कि भविष्यद्वक्ता इस्राएल समुदाय के भीतर से आएगा।
- source_word: מֵאַחֶיךָ
  choice: तुम्हारे भाइयों में से
  rationale: मूल में पुल्लिंग बहुवचन संबंध-सूचक शब्द है, जो यहाँ इस्राएल समुदाय के सदस्यों को व्यापक रूप से दर्शाता है। 'भाइयों' मूल रूप को बनाए रखता है।
- source_word: כָּמֹנִי
  choice: मेरे समान
  rationale: यह मूसा के साथ सीधे किए गए तुलनात्मक संबंध को स्पष्ट और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: יָקִים לְךָ
  choice: तुम्हारे लिए खड़ा करेगा
  rationale: קום के हिफ़ील रूप में किसी को उत्पन्न या नियुक्त करने का भाव है। 'खड़ा करेगा' मूल क्रियात्मक बिंब और לְךָ के हितार्थक अर्थ दोनों को बनाए रखता है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम יהוה को 'यहोवा' से स्पष्ट रूप में प्रस्तुत किया गया है; हिन्दी में यह पदक्रम स्वाभाविक है।
- source_word: אֵלָיו תִּשְׁמָעוּן
  choice: तुम उसकी बात अवश्य सुनना
  rationale: שׁמע में सुनने, ध्यान देने और मानने का अर्थक्षेत्र है। 'बात अवश्य सुनना' आदेशात्मक बल और वाणी पर ध्यान देने का आशय रखता है, बिना इसे केवल 'आज्ञा मानना' बनाकर अर्थ को संकरा किए।
theological_decisions:
- issue: '''मेरे समान एक भविष्यद्वक्ता'' की संभावित मसीही विशिष्टता'
  choice: मुख्य पाठ में मूल का अनिश्चित एकवचन—'मेरे समान एक भविष्यद्वक्ता'—रखा गया है।
  alternative: '''उस भविष्यद्वक्ता'' जैसे स्पष्टतः मसीही अनुवाद, अथवा केवल सामूहिक भविष्यद्वक्ता-संस्था का अर्थ'
  rationale: इब्रानी पद स्वयं बाद की मसीही पहचान को स्पष्ट रूप से वाक्य में नहीं जोड़ता। इसलिए तत्काल अर्थ की वास्तविक खुली संभावना सुरक्षित रखी गई है; नए नियम में इसके प्रयोग की सूचना पादटिप्पणी में दी गई है।
- issue: אָח के प्रतिनिधिक सामुदायिक अर्थ का अनुवाद
  choice: मुख्य पाठ में 'भाइयों' रखा गया है और उसके व्यापक इस्राएली संदर्भ को पादटिप्पणी में स्पष्ट किया गया है।
  alternative: '''संगी इस्राएलियों'' या ''भाई-बहनों'' जैसे व्याख्यात्मक रूप'
  rationale: यह चयन मूल के पुल्लिंग संबंध-सूचक रूप को सुरक्षित रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि संदर्भ सामान्यतः इस्राएल समुदाय के सदस्यों का है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। 'भविष्यद्वक्ता' बाइबलीय परंपरा में परिचित है। आदेशात्मक बल के लिए 'अवश्य सुनना' रखा गया है। दो निकटवर्ती स्रोत-वाक्यांशों—'तुम्हारे बीच से' और 'तुम्हारे भाइयों में से'—को मूल की पुनरुक्ति और बल सहित बनाए रखा गया है।
