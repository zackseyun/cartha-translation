source:
  edition: WLC
  text: כִּ֣י הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה אֲשֶׁ֤ר אַתָּה֙ יוֹרֵ֣שׁ אוֹתָ֔/ם אֶל מְעֹנְנִ֥ים וְ/אֶל קֹסְמִ֖ים יִשְׁמָ֑עוּ וְ/אַתָּ֕ה לֹ֣א כֵ֔ן נָ֛תַן לְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/014.yaml
  text: For these nations[a], which you are dispossessing, listen to soothsayers and diviners; but as for you[c][b], Yahweh your God has not allowed you to do this.
translation:
  language: hi
  text: क्योंकि ये जातियाँ, जिन्हें तुम बेदखल कर रहे हो[a], शकुन देखनेवालों[b] और भविष्य बतानेवालों की सुनती हैं; लेकिन तुम्हें याहवे, तुम्हारे परमेश्वर ने ऐसा नहीं दिया है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जिन्हें तुम निकाल रहे हो’ अथवा ‘जिनके देश पर तुम अधिकार कर रहे हो’; इब्रानी क्रिया में पहले से बसे लोगों को बेदखल करना और उनके देश पर अधिकार करना—दोनों भाव हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘शकुन देखनेवाले’ उस समय शकुनों या लक्षणों को देखकर भावी बात जानने का दावा करनेवालों के लिए प्रयुक्त शब्द का अनुवाद है।
    reason: cultural_note
  - marker: c
    text: इब्रानी का शाब्दिक रूप है, ‘लेकिन तुम—ऐसा नहीं; याहवे, तुम्हारे परमेश्वर ने तुम्हें दिया।’ कर्म निहित है; अर्थात ऐसी प्रथाएँ इस्राएल को मार्गदर्शन के साधन के रूप में नहीं दी गईं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले निषेधों का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: ये जातियाँ
  rationale: यहाँ आशय देश में रहनेवाले गैर-इस्राएली जनसमुदायों से है; ‘जातियाँ’ बाइबलीय संदर्भ में परिचित और संक्षिप्त है।
- source_word: אֲשֶׁר אַתָּה יוֹרֵשׁ אֹתָם
  choice: जिन्हें तुम बेदखल कर रहे हो
  rationale: ירשׁ यहाँ उन निवासियों को हटाकर उनके देश पर अधिकार करने का भाव रखता है। ‘बेदखल’ इस दोहरे संदर्भ में पूर्व निवासियों पर पड़नेवाले प्रभाव को स्पष्ट रखता है।
- source_word: מְעֹנְנִים
  choice: शकुन देखनेवालों
  rationale: यह शब्द शकुनों या लक्षणों के आधार पर भावी बात जानने का दावा करनेवाले लोगों को सूचित करता है। यह हिन्दी रूप किसी एक अनिश्चित विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: קֹסְמִים
  choice: भविष्य बतानेवालों
  rationale: यह קסם अर्थात भावी बात जानने या बताने की क्रिया करनेवालों के लिए प्रयुक्त है; सरल हिन्दी में यह अर्थ सहजता से समझ आता है।
- source_word: יִשְׁמָעוּ
  choice: की सुनती हैं
  rationale: שׁמע का मूल अर्थ सुनना है और यहाँ उनकी बात मानने या उन पर ध्यान देने का भाव है; ‘की सुनती हैं’ दोनों को स्वाभाविक रूप से समेटता है।
- source_word: וְאַתָּה לֹא כֵן נָתַן לְךָ
  choice: लेकिन तुम्हें ... ऐसा करने की अनुमति नहीं दी है
  rationale: इब्रानी वाक्य संक्षिप्त और वस्तु-विहीन है—शाब्दिक रूप से ‘पर तुम, ऐसा नहीं ... तुम्हें दिया।’ हिन्दी में अर्थपूर्ण वाक्य के लिए संदर्भ से ‘ऐसा करने’ और נתן के प्रसंगगत अनुमति-भाव को व्यक्त किया गया है; शाब्दिक बनावट पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: याहवे तुम्हारे परमेश्वर
  rationale: व्यक्तिगत वाचा-नाम יהוה को ‘याहवे’ और אֱלֹהֶיךָ को प्रचलित, गरिमापूर्ण हिन्दी ‘तुम्हारे परमेश्वर’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: नָתַן לְךָ के बाद निहित कर्म
  choice: ऐसा करने की अनुमति नहीं दी है
  alternative: तुम्हें ऐसा नहीं दिया है
  rationale: इब्रानी में कर्म स्पष्ट नहीं है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए पिछले संदर्भ की प्रथाओं को ‘ऐसा करने’ से संकेतित किया गया है, जबकि पादटिप्पणी मूल की संक्षिप्तता और वैकल्पिक शाब्दिक रूप को बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज स्तर रखा गया है। ‘शकुन देखनेवाले’ और ‘भविष्य बतानेवाले’ सामान्य पाठक के लिए बोधगम्य हैं, फिर भी दोनों इब्रानी पदों का अंतर बनाए रखते हैं। वचन में एकवचन संबोधन ‘तुम’ सुरक्षित रखा गया है।
