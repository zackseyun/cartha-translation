source:
  edition: WLC
  text: לֹֽא יִ֠הְיֶה לַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם כָּל שֵׁ֧בֶט לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם יִשְׂרָאֵ֑ל אִשֵּׁ֧י יְהוָ֛ה וְ/נַחֲלָת֖/וֹ יֹאכֵלֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/001.yaml
  text: The Levitical priests—all the tribe of Levi—shall have no portion or inheritance with Israel[a]; they shall eat the food offerings of Yahweh, that is[b], his inheritance.
translation:
  language: hi
  text: लेवीय याजकों—अर्थात् लेवी के पूरे गोत्र—का इस्राएल के साथ कोई भाग या विरासत नहीं होगा। वे याहवे की अग्नि-भेंटें[a] और उसकी विरासत[b] खाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे की आग में चढ़ाई गई भेंटें।” इस शब्द में उन बलिदानी भेंटों का भाव है जिनका कुछ भाग आग पर चढ़ाया जाता था।
    reason: lexical_alternative
  - marker: b
    text: “उसकी विरासत” में “उसकी” सामूहिक रूप से लेवी अथवा लेवी के गोत्र की ओर संकेत कर सकता है; पद 2 में याहवे को उनकी विरासत कहा गया है। व्याकरण की दृष्टि से इसका संकेत निकटवर्ती “याहवे” की ओर समझना भी संभव है।
    reason: ambiguity_and_cross_reference
lexical_decisions:
- source_word: לַכֹּהֲנִים הַלְוִיִּם
  choice: लेवीय याजकों
  rationale: यह पदबंध याजकों की पहचान लेवी से संबंधित याजकों के रूप में करता है। ‘लेवीय याजक’ संक्षिप्त, स्वाभाविक और प्रचलित हिन्दी है।
- source_word: כָּל שֵׁבֶט לֵוִי
  choice: अर्थात् लेवी के पूरे गोत्र
  rationale: यह संलग्न पद पहले पदबंध का दायरा पूरे लेवी गोत्र तक फैलाता है। ‘पूरे’ से כָּל का बल सुरक्षित रहता है।
- source_word: חֵלֶק וְנַחֲלָה
  choice: न कोई भाग ... न विरासत
  rationale: दोनों निकटार्थी कानूनी शब्द भूमि अथवा संपत्ति में मिले आवंटित अधिकार को व्यक्त करते हैं। ‘न...न...’ हिन्दी में निषेध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: עִם יִשְׂרָאֵל
  choice: इस्राएल के साथ
  rationale: मूल का עִם साझा अधिकार अथवा आवंटन का भाव रखता है; शाब्दिक निकटता बनाए रखते हुए इसे ‘इस्राएल के साथ’ कहा गया है।
- source_word: אִשֵּׁי יְהוָה
  choice: याहवे की अग्नि-भेंटें
  rationale: אִשִּׁים आग पर अर्पित बलिदानी भेंटों को सूचित करता है। ‘अग्नि-भेंटें’ मूल बिंब और धार्मिक संदर्भ दोनों को सुरक्षित रखता है।
- source_word: וְנַחֲלָתוֹ
  choice: और उसकी विरासत
  rationale: वाव को ‘और’ तथा एकवचन पुल्लिंग प्रत्यय को ‘उसकी’ के रूप में रखा गया है, ताकि संबंध और सर्वनाम का संदर्भ अनावश्यक रूप से निश्चित न किया जाए।
- source_word: יֹאכֵלוּן
  choice: खाएँगे
  rationale: विधिक प्रसंग में अपूर्ण क्रिया नियमित अथवा निर्धारित प्रावधान व्यक्त करती है; हिन्दी का सामान्य भविष्यत् रूप इसे स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का विशिष्ट वाचा-नाम है; लिप्यंतरण उसे सामान्य उपाधि से नहीं बदलता।
theological_decisions:
- issue: וְנַחֲלָתוֹ में ‘उसकी विरासत’ का संदर्भ
  choice: मुख्य पाठ में ‘उसकी’ को अस्पष्ट रखा गया
  alternative: ‘उनकी विरासत’ अथवा ‘याहवे की विरासत’
  rationale: मूल प्रत्यय एकवचन पुल्लिंग है। उसका संकेत सामूहिक रूप से लेवी/लेवी के गोत्र की ओर हो सकता है, पर निकटवर्ती יְהוָה की ओर संकेत की व्याकरणिक संभावना भी बनी रहती है। स्पष्ट बहुवचन या स्वामी का नाम रख देने से मूल की अस्पष्टता मिट जाती।
- issue: אִשֵּׁי יְהוָה וְנַחֲלָתוֹ के बीच संबंध
  choice: ‘और’ के द्वारा दोनों पदों को जोड़ा गया
  alternative: ‘अर्थात् उसकी विरासत’ अथवा ‘अपनी विरासत के रूप में’
  rationale: मूल में वाव है। दूसरा पद पहले का समानाधिकरण हो सकता है, किंतु उसे ‘अर्थात्’ बनाना व्याख्या को मुख्य पाठ में निश्चित कर देता; इसलिए समन्वय और संभावित समानाधिकरण दोनों खुले रखे गए हैं।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: विशिष्ट इब्रानी नाम को नाम के रूप में प्रस्तुत किया गया है, न कि उपाधि से प्रतिस्थापित किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘याजक’, ‘गोत्र’, ‘विरासत’ और ‘अग्नि-भेंट’ जैसे स्थापित बाइबलीय शब्द संदर्भ की विधिक और उपासना-संबंधी गंभीरता बनाए रखते हैं।
