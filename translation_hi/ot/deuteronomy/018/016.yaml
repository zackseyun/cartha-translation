source:
  edition: WLC
  text: כְּ/כֹ֨ל אֲשֶׁר שָׁאַ֜לְתָּ מֵ/עִ֨ם יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/חֹרֵ֔ב בְּ/י֥וֹם הַ/קָּהָ֖ל לֵ/אמֹ֑ר לֹ֣א אֹסֵ֗ף לִ/שְׁמֹ֨עַ֙ אֶת קוֹל֙ יְהוָ֣ה אֱלֹהָ֔/י וְ/אֶת הָ/אֵ֨שׁ הַ/גְּדֹלָ֥ה הַ/זֹּ֛את לֹֽא אֶרְאֶ֥ה ע֖וֹד וְ/לֹ֥א אָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/016.yaml
  text: just as you asked from the LORD your God at Horeb on the day of the assembly, saying, ‘Let me not continue to hear the voice of the LORD my God, and let me not see this great fire anymore, lest I die.’
translation:
  language: hi
  text: जैसा तूने होरेब में सभा के दिन अपने परमेश्वर यहोवा से यह कहकर माँगा था, “मैं अपने परमेश्वर यहोवा की वाणी फिर न सुनूँ और इस बड़ी आग को फिर न देखूँ, कहीं ऐसा न हो कि मैं मर जाऊँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר שָׁאַלְתָּ מֵעִם
  choice: ठीक वैसे ही जैसे तूने ... से ... माँगा था
  rationale: כְּכֹל אֲשֶׁר का तुलनात्मक बल और שׁאל के अनुरोध/माँगने के अर्थ को स्वाभाविक हिन्दी में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को सामान्य हिन्दी बाइबलीय लिप्यंतरण द्वारा स्पष्ट रखा गया है, न कि उपाधि में बदल दिया गया है।
- source_word: בְּחֹרֵב
  choice: होरेब में
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप।
- source_word: בְּיוֹם הַקָּהָל
  choice: सभा के दिन
  rationale: הַקָּהָל यहाँ लोगों के एकत्र होने की घटना/सभा को सूचित करता है; संक्षिप्त और स्रोत-संगत अनुवाद।
- source_word: לֹא אֹסֵף לִשְׁמֹעַ
  choice: फिर सुनता न रहूँ
  rationale: יסף + infinitive के ‘आगे जारी रखना/फिर और करना’ अर्थ को व्यक्त करता है।
- source_word: וְאֶת הָאֵשׁ הַגְּדֹלָה הַזֹּאת לֹא אֶרְאֶה עוֹד
  choice: और यह बड़ी आग फिर न देखूँ
  rationale: עוֹד के पुनरावृत्ति-विरोधी अर्थ तथा demonstrative ‘यह’ को बनाए रखा गया है।
- source_word: וְלֹא אָמוּת
  choice: कहीं ऐसा न हो कि मैं मर जाऊँ
  rationale: समन्वित रूप शाब्दिकतः ‘और मैं न मरूँ’ है, पर प्रसंग में आशंकित परिणाम व्यक्त करता है; हिन्दी में यह उद्देश्य/भय स्वाभाविक रूप से ‘कहीं ... न’ से आता है।
theological_decisions:
- issue: ईश्वरीय नाम का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में टेट्राग्रामटन יהוה है; ‘यहोवा’ पाठक को व्यक्तिगत नाम और אֱלֹהִים (‘परमेश्वर’) के बीच का भेद दिखाता है।
- issue: अंतिम वाक्यांश का संबंध
  choice: कहीं ऐसा न हो कि मैं मर जाऊँ
  alternative: और मैं न मरूँ
  rationale: इसे पिछली माँग का आशंकित परिणाम माना गया है, बिना मृत्यु के कारण के विषय में अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। व्यवस्थाविवरण में मूसा द्वारा इस्राएल को एकवचन संबोधन के अनुरूप ‘तू/तेरा’ रखा गया है। प्रत्यक्ष कथन के भीतर भी मूल का प्रथम पुरुष बनाए रखा गया है।
