source:
  edition: WLC
  text: כִּ֣י ב֗/וֹ בָּחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/כָּל שְׁבָטֶ֑י/ךָ לַ/עֲמֹ֨ד לְ/שָׁרֵ֧ת בְּ/שֵׁם יְהוָ֛ה ה֥וּא וּ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/005.yaml
  text: For Yahweh your God has chosen him from all your tribes to stand and minister in the name of Yahweh[a], he and his sons all the days.
translation:
  language: hi
  text: क्योंकि तुम्हारे परमेश्वर यहोवा ने तुम्हारे सब गोत्रों में से उसे चुना है, कि वह और उसके पुत्र सदा यहोवा के नाम से सेवा करने के लिए खड़े रहें[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सभी दिनों तक”; यहाँ इसका आशय निरंतर, स्थायी याजकीय सेवा से है।
    reason: मूल इब्रानी मुहावरे का शाब्दिक रूप और संदर्भगत अर्थ दोनों बताने के लिए।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले विधान का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בּוֹ בָּחַר
  choice: उसे चुन लिया है
  rationale: בחר के साथ ב चुने गए व्यक्ति को चिह्नित करता है। पूर्ण क्रिया को ‘चुन लिया है’ से व्यक्त करने पर अतीत का चुनाव और उसकी वर्तमान प्रासंगिकता दोनों बने रहते हैं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षर दिव्य नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है, सामान्य उपाधि से नहीं।
- source_word: מִכָּל שְׁבָטֶיךָ
  choice: तुम्हारे सब गोत्रों में से
  rationale: यह इस्राएल के समस्त गोत्रों के बीच से किए गए चुनाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַעֲמֹד לְשָׁרֵת
  choice: सेवा करने के लिए खड़ा रहे
  rationale: ‘खड़ा रहना’ याजकीय उपस्थिति की ठोस छवि को सुरक्षित रखता है, जबकि ‘सेवा करना’ धार्मिक सेवा के अर्थ को सहज हिन्दी में पहुँचाता है।
- source_word: בְּשֵׁם יְהוָה
  choice: यहोवा के नाम से
  rationale: यह सेवा यहोवा के नाम के अधिकार और प्रतिनिधित्व में की जाती है; ‘नाम से’ मूल वाक्यांश की अर्थगत व्यापकता बनाए रखता है।
- source_word: הוּא וּבָנָיו
  choice: वह और उसके पुत्र
  rationale: मूल पाठ स्पष्ट रूप से पुत्रों का उल्लेख करता है और लेवीय याजकीय उत्तराधिकार की पुरुषवंशीय भाषा को सुरक्षित रखता है।
- source_word: כָּל הַיָּמִים
  choice: सदा
  rationale: शाब्दिक ‘सारे दिन’ यहाँ निरंतर और स्थायी याजकीय सेवा का मुहावरेदार बोध देता है; मुख्य पाठ में ‘सदा’ प्राकृतिक हिन्दी है और पादटिप्पणी शाब्दिक रूप बताती है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों में स्थापित देवनागरी रूप ‘यहोवा’ नाम की विशिष्टता को बनाए रखता है; इसे ‘प्रभु’ जैसी उपाधि में नहीं बदला गया।
- issue: याजकीय उत्तराधिकार की लिंग-विशिष्ट भाषा
  choice: वह और उसके पुत्र
  alternative: वह और उसकी संतान
  rationale: בָּנָיו स्पष्टतः ‘उसके पुत्र’ है और प्रसंग लेवीय याजकीय उत्तराधिकार का है; अतः इसे लिंग-निरपेक्ष नहीं किया गया।
- issue: כָּל הַיָּמִים की अवधि
  choice: सदा
  alternative: सारे दिन
  rationale: मुहावरा लगातार, दीर्घस्थायी याजकीय सेवा को दर्शाता है। ‘सदा’ अर्थ को स्वाभाविक हिन्दी में देता है, जबकि पादटिप्पणी मूल की अधिक शाब्दिक अभिव्यक्ति सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘गोत्र’, ‘यहोवा’ और ‘पुत्र’ जैसे संदर्भ-विशिष्ट शब्द सुरक्षित हैं; वाक्य में दीर्घ विराम याजक और उसके पुत्रों पर अंतिम बल को स्पष्ट करता है।
