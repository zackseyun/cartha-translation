  text: נָבִ֨יא אָקִ֥ים לָ/הֶ֛ם מִ/קֶּ֥רֶב אֲחֵי/הֶ֖ם כָּמ֑וֹ/ךָ וְ/נָתַתִּ֤י דְבָרַ/י֙ בְּ/פִ֔י/ו וְ/דִבֶּ֣ר אֲלֵי/הֶ֔ם אֵ֖ת כָּל אֲשֶׁ֥ר אֲצַוֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/018.yaml
  text: I will raise up for them a prophet like you from among their brothers[a], and I will put my words in his mouth, and he will speak to them all that I command him.
translation:
  language: hi
  text: मैं उनके लिए उनके भाइयों[a] के बीच में से तुम्हारे समान एक नबी खड़ा करूँगा। मैं अपने वचन उसके मुँह में रखूँगा, और वह उनसे वह सब कहेगा जो कुछ मैं उसे आज्ञा दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके बंधुजनों’ अथवा ‘उनके साथी इस्राएलियों’; इब्रानी में शाब्दिक रूप से ‘उनके भाइयों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  choice: एक नबी
  rationale: यह परमेश्वर की ओर से बोलने वाले व्यक्ति के लिए प्रचलित इब्रानी शब्द है; इस भविष्यसूचक संदर्भ में अनिश्चित अर्थ को ‘एक’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָקִים
  choice: खड़ा करूँगा
  rationale: קום के हिफ़ील रूप में यहाँ किसी नबी को उठाने अथवा नियुक्त करने का भाव है; ‘खड़ा करूँगा’ दैवी प्रबंध और नियुक्ति दोनों को सहज हिंदी में बनाए रखता है।
- source_word: לָהֶם
  choice: उनके लिए
  rationale: ל यहाँ लोगों के हित में परमेश्वर द्वारा नबी देने का भाव प्रकट करता है।
- source_word: מִקֶּרֶב אֲחֵיהֶם
  choice: उनके भाइयों के बीच में से
  rationale: מִקֶּרֶב का अर्थ ‘के बीच में से’ और אֲחֵיהֶם का शाब्दिक अर्थ ‘उनके भाई’ है। मुख्य पाठ स्रोत की पारिवारिक-सामुदायिक भाषा को रखता है; पादटिप्पणी इसके व्यापक बंधुजन/इस्राएली अर्थ को स्पष्ट करती है।
- source_word: כָּמוֹךָ
  choice: तुम्हारे समान
  rationale: मूसा से स्पष्ट तुलना को संक्षिप्त और गरिमापूर्ण ढंग से बनाए रखता है।
- source_word: וְנָתַתִּי דְבָרַי בְּפִיו
  choice: मैं अपने वचन उसके मुँह में डालूँगा
  rationale: नबी को परमेश्वर से वाणी मिलने का सजीव रूपक ज्यों का त्यों रखा गया है। דְבָרַי बहुवचन होते हुए भी हिंदी में सामूहिक अर्थ वाला ‘मेरे वचन’ स्वाभाविक है।
- source_word: וְדִבֶּר אֲלֵיהֶם
  choice: और वह उनसे ... कहेगा
  rationale: אֶל की दिशात्मकता और आगे आने वाली कथ्य-वस्तु को हिंदी में ‘उनसे ... कहेगा’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּנּוּ
  choice: वह सब ... जिसकी आज्ञा मैं उसे दूँगा
  rationale: כָּל אֲשֶׁר की व्यापकता और भविष्यगत दैवी आदेश दोनों स्पष्ट रहते हैं; हिंदी में यह संरचना सहज और सटीक है।
theological_decisions:
- issue: प्रतिज्ञात नबी की संभावित मसीही विशिष्टता
  choice: मुख्य पाठ केवल ‘तुम्हारे समान एक नबी’ कहता है और उसकी पहचान स्पष्ट नहीं करता।
  alternative: इसे नबियों की सामूहिक परंपरा अथवा मसीह में पूर्ण होने वाले एक अंतिम नबी के रूप में स्पष्ट करना।
  rationale: पद स्वयं नबी की आगे की पहचान नहीं बताता; इसलिए अनुवाद सामूहिक और मसीही पाठों के बीच की वास्तविक धर्मवैज्ञानिक संभावना को खुला रखता है।
- issue: אֲחֵיהֶם का सामुदायिक अर्थ
  choice: मुख्य पाठ में ‘उनके भाइयों’ रखा गया है।
  alternative: ‘उनके बंधुजनों’ या ‘उनके साथी इस्राएलियों’ का प्रयोग करना।
  rationale: शाब्दिक पुरुषवाचक पारिवारिक शब्द को सुरक्षित रखते हुए पादटिप्पणी व्यवस्थाविवरण में उसके व्यापक वाचा-संबंधी अर्थ को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘खड़ा करूँगा’ और ‘मुँह में डालूँगा’ जैसे स्रोत-रूपकों को स्वाभाविक हिंदी में सुरक्षित रखा गया है।
