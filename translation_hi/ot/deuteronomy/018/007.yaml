base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/007.yaml
  text: then he may minister in the name of Yahweh his God[c][b][a], like all his brothers the Levites who stand there before Yahweh.
translation:
  language: hi
  text: तब वह अपने परमेश्वर याहवे[c] के नाम से सेवा कर सकता है[a], अपने सभी लेवी भाइयों[b] के समान, जो वहाँ याहवे के सामने खड़े रहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘और वह सेवा करे।’ हिब्रू अपूर्ण क्रिया को इस विधिक संदर्भ में अनुमति या अधिक प्रत्यक्ष विधान—दोनों रूपों में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उसके भाई,’ अर्थात उसके साथी लेवी।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू YHWH; पारंपरिक रूप से ‘यहोवा,’ और कई अनुवादों में ‘प्रभु।’
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: तब वह … सेवा कर सकता है
  rationale: पिएल रूप यहाँ पवित्र-स्थान की सेवकाई को सूचित करता है। पिछले पद की शर्त के परिणाम को ‘तब’ स्वाभाविक रूप से जोड़ता है, और ‘कर सकता है’ हिब्रू अपूर्ण क्रिया के अनुमतिसूचक अर्थ को बनाए रखता है।
- source_word: בְּשֵׁם
  choice: के नाम से
  rationale: यह हिंदी में किसी के नाम और अधिकार के अधीन कार्य करने का स्वाभाविक मुहावरा है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम YHWH का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: אֱלֹהָיו
  choice: अपने परमेश्वर
  rationale: हिंदी में कर्ता की ओर लौटते संबंध को ‘अपने’ स्वाभाविक ढंग से व्यक्त करता है और हिब्रू के एकवचन संबंधसूचक प्रत्यय को सुरक्षित रखता है।
- source_word: כְּכָל אֶחָיו הַלְוִיִּם
  choice: अपने सभी लेवी भाइयों के समान
  rationale: तुलना, ‘सभी’ का व्यापक अर्थ, पुरुषवाचक संबंध-संज्ञा और ‘लेवी’ द्वारा उसकी प्रासंगिक स्पष्टता—चारों सुरक्षित हैं।
- source_word: הָעֹמְדִים שָׁם
  choice: जो वहाँ … खड़े रहते हैं
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ बनाए रखा गया है; ‘रहते हैं’ उनकी नियमित उपस्थिति को सहज हिंदी में व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: यह परमेश्वर की उपस्थिति में खड़े होने के हिब्रू कथन का सीधा और स्वाभाविक हिंदी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-नाम सीधे आया है। ‘याहवे’ उसे एक व्यक्तिगत नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ नाम को उपाधि से बदल देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक उच्चारण है।
- issue: אֶחָיו में पुरुषवाचक संबंध-संज्ञा
  choice: उसके/अपने … भाई
  alternative: उसके साथी लेवी
  rationale: ‘भाई’ मूल के पुरुषवाचक संबंध को बनाए रखता है, और साथ आया ‘लेवी’ स्पष्ट करता है कि आशय उसके सहलेवियों से है।
- issue: וְשֵׁרֵת की विधिक शक्ति
  choice: सेवा कर सकता है
  alternative: सेवा करे / सेवा करेगा
  rationale: संदर्भ में यह शर्त पूरी होने पर मिली अनुमति को व्यक्त कर सकता है। फिर भी हिब्रू अपूर्ण क्रिया प्रत्यक्ष विधान या भविष्य की छाया भी रखती है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सेवा’ मंदिर-संबंधी सेवकाई के लिए पर्याप्त स्पष्ट है; अधिक तकनीकी शब्दावली से बचा गया है।
