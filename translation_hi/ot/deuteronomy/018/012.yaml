  text: כִּֽי תוֹעֲבַ֥ת יְהוָ֖ה כָּל עֹ֣שֵׂה אֵ֑לֶּה וּ/בִ/גְלַל֙ הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔לֶּה יְהוָ֣ה אֱלֹהֶ֔י/ךָ מוֹרִ֥ישׁ אוֹתָ֖/ם מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/012.yaml
  text: For everyone who does these things is an abomination to Yahweh[a], and because of these abominations Yahweh your God is driving them out before you.
translation:
  language: hi
  text: क्योंकि जो कोई ये काम करता है, वह यहोवा की दृष्टि में घृणित वस्तु है; और इन घृणित बातों के कारण यहोवा तुम्हारा परमेश्वर उन लोगों को तुम्हारे सामने से बेदखल कर रहा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें तुम्हारे सामने से निकाल रहा है।” इब्रानी क्रिया राष्ट्रों को भूमि के अधिकार से वंचित करने और उन्हें वहाँ से निकालने—दोनों भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले निषेधों का कारण बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תוֹעֲבַת יְהוָה
  choice: यहोवा के लिए घृणित
  rationale: यह वाक्यांश यहोवा की दृष्टि में अत्यंत निंदनीय और अस्वीकार्य होने का प्रबल नैतिक भाव रखता है; ‘घृणित’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के निज नाम को हिन्दी की प्रचलित बाइबलीय वर्तनी ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: जो कोई ये काम करता है
  rationale: כָּל और कृदंत का मेल ऐसे प्रत्येक व्यक्ति को समेटता है जो इन कामों में लगा है; यह हिन्दी में स्वाभाविक सार्वभौमिक अभिव्यक्ति है।
- source_word: וּבִגְלַל
  choice: और ... के कारण
  rationale: यह आगे बताए गए न्याय का कारण प्रकट करता है।
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: इन्हीं घृणित कामों
  rationale: यह पिछले पदों में वर्णित निषिद्ध प्रथाओं की ओर संकेत करता है। ‘इन्हीं’ कारण पर बल को और ‘घृणित कामों’ को हिन्दी में स्पष्ट रखता है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: एकवचन द्वितीय पुरुष संबोधन को बनाए रखते हुए इस्राएल को प्रत्यक्ष संबोधन सुरक्षित रखा गया है।
- source_word: מוֹרִישׁ אֹתָם
  choice: उन लोगों को ... बेदखल कर रहा है
  rationale: ירש के हिफ़ईल रूप में यहाँ भूमि के अधिकार से वंचित करके निकालने का भाव है; ‘बेदखल’ इस भूमि-संबंधी अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִפָּנֶיךָ
  choice: तुम्हारे सामने से
  rationale: शाब्दिक रूप से ‘तुम्हारे मुख/उपस्थिति के सामने से’; विजय और निष्कासन के प्रसंग में यह हिन्दी अभिव्यक्ति मूल स्थानिक भाव को सुरक्षित रखती है।
theological_decisions:
- issue: परमेश्वर के निज नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: टेट्राग्राम को उपाधि से बदलने के बजाय निज नाम के रूप में रखा गया है; ‘यहोवा’ आधुनिक हिन्दी बाइबल पाठकों में अधिक परिचित मानक रूप है।
- issue: व्यक्ति और कर्म के बीच תוֹעֲבַת का संबंध
  choice: काम करने वाला व्यक्ति ‘यहोवा के लिए घृणित’ है
  alternative: केवल ये काम ‘यहोवा के लिए घृणित’ हैं
  rationale: मूल व्याकरण में כָּל עֹשֵׂה אֵלֶּה, अर्थात काम करने वाला प्रत्येक व्यक्ति, תוֹעֲבַת יְהוָה का विधेय है; इसलिए पाठ की कठोरता को केवल कर्मों तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, स्पष्ट और सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘घृणित’ से תועבה की प्रबल नैतिक तीव्रता रखी गई है, और ‘बेदखल’ से भूमि-अधिकार खोने का मूल भाव सामने आता है।
