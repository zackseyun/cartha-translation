  yaml_path: translation/ot/deuteronomy/018/011.yaml
  text: or one who binds a spell[a], or one who consults a medium or a spiritist[d][c][b], or one who seeks the dead.
translation:
  language: hi
  text: या टोना-मंत्र करनेवाला,[a] या आत्मा-माध्यम अथवा प्रेत-साधक से पूछनेवाला,[b][c] या मरे हुओं से पूछनेवाला।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘बंधन बाँधनेवाला’; आशय जादुई मंत्र बाँधने या करने से है।
    reason: lexical_alternative
  - marker: b
    text: ‘आत्मा-माध्यम से पूछनेवाला’ का अनुवाद ‘प्रेतात्मा से पूछनेवाला’ भी हो सकता है; इब्रानी शब्द माध्यम अथवा उससे संबंधित आत्मा को सूचित कर सकता है।
    reason: lexical_ambiguity
  - marker: c
    text: ‘प्रेत-साधक’ के लिए पारंपरिक अनुवाद ‘जादूगर’ भी मिलता है, पर आधुनिक हिन्दी में वह भ्रामक हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: या, ‘मरे हुओं की खोज करनेवाला’; यहाँ खोजने का आशय उनसे जानकारी माँगना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹבֵר חָבֶר
  choice: टोना-मंत्र करनेवाला
  rationale: इब्रानी मुहावरे का शाब्दिक भाव ‘बंधन बाँधनेवाला’ है, पर निषिद्ध गूढ़ प्रथाओं की इस सूची में आशय जादुई मंत्र करने से है। ‘टोना-मंत्र करनेवाला’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: שֹׁאֵל אוֹב
  choice: ओझे से पूछनेवाला
  rationale: אוֹב मृतात्मा अथवा उससे संपर्क करानेवाले माध्यम—दोनों की ओर संकेत कर सकता है। ‘ओझा’ सामान्य हिन्दी में ऐसे माध्यम के लिए समझ में आता है; संभावित दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יִדְּעֹנִי
  choice: प्रेत-साधक
  rationale: यह गूढ़ ज्ञान अथवा आत्माओं से संबंधित साधक को सूचित करता है और प्रायः אוֹב के साथ आता है। ‘प्रेत-साधक’ काल्पनिक साहित्य से जुड़े ‘जादूगर’ जैसे भ्रामक संकेत से बचता है।
- source_word: דֹרֵשׁ אֶל הַמֵּתִים
  choice: मरे हुओं से पूछताछ करनेवाला
  rationale: דֹרֵשׁ का अर्थ यहाँ जानकारी पाने के लिए खोजने या पूछने से है। यह अनुवाद मृतकों से परामर्श की क्रिया को स्पष्ट करता है और मूल की दिशा ‘मृतकों की ओर’ बनाए रखता है।
- source_word: וְ
  choice: या
  rationale: निषेध की जारी सूची में इब्रानी संयोजक को हिन्दी में विकल्पसूचक ‘या’ से देना स्वाभाविक है।
theological_decisions:
- issue: गूढ़ प्रथाओं के शब्दों में बाद की लोककथाओं या सांप्रदायिक धारणाओं को आरोपित करना
  choice: आधुनिक और सहज शब्द—‘टोना-मंत्र’, ‘ओझा’, ‘प्रेत-साधक’—प्रयोग किए गए हैं।
  alternative: शाब्दिक या पारंपरिक पद, जैसे ‘बंधन बाँधनेवाला’, ‘भूत से पूछनेवाला’ या ‘जादूगर’।
  rationale: पद निषिद्ध मंत्र-तंत्र और मृतात्माओं से जानकारी लेने की प्रथाओं को गिनाता है। चुने हुए पद अर्थ स्पष्ट करते हैं, पर संबंधित इब्रानी शब्दों की वास्तविक संदिग्धता पादटिप्पणियों में बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, संक्षिप्त और विधिक सूची के अनुरूप है। ‘करनेवाला/पूछनेवाला’ की समान संरचना सूची की लय बनाए रखती है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
