  text: אַ֣ךְ הַ/נָּבִ֡יא אֲשֶׁ֣ר יָזִיד֩ לְ/דַבֵּ֨ר דָּבָ֜ר בִּ/שְׁמִ֗/י אֵ֣ת אֲשֶׁ֤ר לֹֽא צִוִּיתִי/ו֙ לְ/דַבֵּ֔ר וַ/אֲשֶׁ֣ר יְדַבֵּ֔ר בְּ/שֵׁ֖ם אֱלֹהִ֣ים אֲחֵרִ֑ים וּ/מֵ֖ת הַ/נָּבִ֥יא הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/020.yaml
  text: But the prophet who presumptuously speaks a word in my name that I have not commanded him to speak[b][a], or who speaks in the name of other gods—that prophet shall die.
translation:
  language: hi
  text: परन्तु जो भविष्यद्वक्ता मेरे नाम से ऐसी बात कहने का दुस्साहस करे[a], जिसे कहने की आज्ञा मैंने उसे नहीं दी, या जो दूसरे देवताओं के नाम से बोले—वह भविष्यद्वक्ता अवश्य मरेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो भविष्यद्वक्ता ढिठाई से काम करे” अथवा “अभिमानपूर्वक बोले।” हिब्रू क्रिया जान-बूझकर अधिकार की सीमा लाँघने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उस भविष्यद्वक्ता को मरना ही होगा” अथवा “उस भविष्यद्वक्ता को मार डाला जाए।” हिब्रू में मृत्यु-दण्ड का विधान बहुत संक्षेप में दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु
  rationale: यह पिछले संदर्भ में सच्चे भविष्यद्वक्ता के विपरीत स्थिति प्रस्तुत करता है; ‘परन्तु’ उस विरोध को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יָזִיד
  choice: दुस्साहस करे
  rationale: हिफ़ील रूप जान-बूझकर मर्यादा लाँघने, ढिठाई या अभिमानी धृष्टता का भाव देता है। ‘दुस्साहस करे’ नैतिक और विधिक गंभीरता को सहज हिन्दी में बनाए रखता है।
- source_word: לְדַבֵּר דָּבָר
  choice: ऐसी बात कहने
  rationale: ‘बात कहना’ हिब्रू के क्रिया-संज्ञा विन्यास का स्वाभाविक हिन्दी रूप है और संदेश की विषयवस्तु को अनावश्यक विस्तार दिए बिना व्यक्त करता है।
- source_word: בִּשְׁמִי
  choice: मेरे नाम से
  rationale: यह ईश्वरीय अधिकार का दावा करने का प्रचलित बाइबलीय मुहावरा है और प्रथम पुरुष को सुरक्षित रखता है।
- source_word: אֵת אֲשֶׁר לֹא צִוִּיתִיו לְדַבֵּר
  choice: जिसे कहने की आज्ञा मैंने उसे नहीं दी
  rationale: यह निषेध, ईश्वरीय आज्ञा और भविष्यद्वक्ता को सूचित कर्म—तीनों को स्पष्ट रूप से बनाए रखता है।
- source_word: וַאֲשֶׁר יְדַבֵּר
  choice: या जो ... बोले
  rationale: 'वाव यहाँ दूसरे वैकल्पिक अपराध को जोड़ता है: या तो परमेश्वर के नाम से अनधिकृत वचन, या अन्य देवताओं के नाम से कथन।'
- source_word: בְּשֵׁם אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के नाम से
  rationale: यह मूल वाक्यांश का निकट और स्वाभाविक हिन्दी रूप है, जिसमें प्रतिद्वंद्वी देवताओं के अधिकार का दावा निहित है।
- source_word: וּמֵת
  choice: अवश्य मरेगा
  rationale: हिब्रू का संक्षिप्त विधिक दण्ड-वचन मृत्यु की निश्चितता और बाध्यता बताता है। ‘अवश्य मरेगा’ इसे बनाए रखता है, पर दण्ड दिए जाने की ऐसी स्पष्ट कर्मवाच्य प्रक्रिया नहीं जोड़ता जो रूप में प्रत्यक्ष नहीं है।
- source_word: הַנָּבִיא הַהוּא
  choice: वह भविष्यद्वक्ता
  rationale: संज्ञा और संकेतवाचक के बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम का प्रथम-पुरुष संदर्भ
  choice: ‘मेरे नाम से’ के रूप में प्रत्यक्ष ईश्वरीय वाणी बनाए रखी गई।
  alternative: ‘यहोवा के नाम से’ जैसा विस्तारित रूप
  rationale: मूल पाठ में वक्ता प्रथम पुरुष में बोलता है; किसी विशिष्ट नाम को जोड़ना पाठ से अधिक कहना होता।
- issue: मृत्युदण्ड का सूत्र
  choice: ‘अवश्य मरेगा’
  alternative: ‘उसे मार डाला जाए’ या ‘उसे मरना ही होगा’
  rationale: मूल का וּמֵת संक्षिप्त न्यायिक परिणाम बताता है। चुना गया रूप निश्चित दण्ड को व्यक्त करता है, पर क्रियान्वयन की विधि को अनावश्यक रूप से स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य स्तर रखा गया है। ‘भविष्यद्वक्ता’, ‘आज्ञा’ और ‘देवताओं’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं; वाक्यरचना को मूल के विधिक और गंभीर स्वर के निकट रखते हुए स्वाभाविक बनाया गया है।
