source:
  edition: WLC
  text: וְ/כִ֥י תֹאמַ֖ר בִּ/לְבָבֶ֑/ךָ אֵיכָה֙ נֵדַ֣ע אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/021.yaml
  text: And if you say in your heart[a], ‘How shall we know the word that Yahweh has not spoken?’
translation:
  language: hi
  text: और यदि तुम अपने मन में कहो, “हम कैसे जानें कि कौन-सा वचन[a] याहवे ने नहीं कहा है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बात” अथवा “संदेश”; इब्रानी शब्द दावार का अर्थ व्यापक हो सकता है। भविष्यवाणी के इस प्रसंग में “वचन” सबसे उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: और यदि
  rationale: यह पद पिछले प्रसंग से जुड़ते हुए एक संभावित शर्त प्रस्तुत करता है; इसलिए ‘और यदि’ संबंध और शर्त दोनों को बनाए रखता है।
- source_word: בִּלְבָבֶךָ
  choice: अपने मन में
  rationale: शाब्दिक रूप ‘अपने हृदय में’ है, पर यहाँ हृदय भीतरी विचार का केंद्र है। आधुनिक हिन्दी में ‘अपने मन में कहना’ उसी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵיכָה נֵדַע
  choice: हम कैसे जानें
  rationale: यह पहचानने के साधन के बारे में विचारात्मक प्रश्न है। ‘कैसे जानें’ मूल की सरलता और अनिश्चितता दोनों रखता है।
- source_word: הַדָּבָר
  choice: वचन
  rationale: דָּבָר के अर्थों में वचन, बात और संदेश शामिल हैं। भविष्यवाणी के इस प्रसंग में परमेश्वर की ओर से कहे गए कथन के लिए ‘वचन’ उपयुक्त है।
- source_word: אֲשֶׁר לֹא דִבְּרוֹ
  choice: कौन-सा ... नहीं कहा है
  rationale: सम्बन्धवाचक उपवाक्य उस वचन की पहचान पूछता है जिसे याहवे ने नहीं कहा। हिन्दी में प्रश्न को स्वाभाविक बनाने के लिए ‘कौन-सा’ प्रयोग किया गया है, जबकि निषेध और स्रोत-संबंध सुरक्षित हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में ‘याहवे’ लिखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण को देवनागरी में रखता है और उसे उपाधि में नहीं बदलता।
- issue: झूठे भविष्यसूचक वचन की पहचान से जुड़े प्रश्न का स्वर
  choice: हम कैसे जानें कि कौन-सा वचन याहवे ने नहीं कहा है?
  alternative: हम उस वचन को कैसे पहचानें जिसे याहवे ने नहीं कहा?
  rationale: मुख्य पाठ ידע के सामान्य अर्थ ‘जानना’ को बनाए रखता है और अगले पद में आने वाली कसौटी को इस पद में पहले से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपने मन में’ हिन्दी का स्वाभाविक मुहावरा है; प्रत्यक्ष प्रश्न सामूहिक ‘हम’ और मूल पाठ की विचारात्मक अनिश्चितता को बनाए रखता है।
