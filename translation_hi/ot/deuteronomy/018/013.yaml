  text: You shall be blameless with Yahweh your God[a].
translation:
  language: hi
  text: तुम याहवे, अपने परमेश्वर, के साथ खरे रहना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे, अपने परमेश्वर, के साथ पूर्ण” अथवा “संपूर्ण”।
    reason: תָּמִים का अर्थ खरा, पूर्ण या संपूर्ण हो सकता है; इस संदर्भ में यह परमेश्वर के प्रति अखंड निष्ठा और नैतिक खराई का भाव देता है।
lexical_decisions:
- source_word: תָּמִים
  choice: खरे
  rationale: यह शब्द संपूर्णता, अखंड निष्ठा और निर्दोष चाल-चलन का भाव रखता है। इस प्रसंग में “खरे” जादू-टोने और भावी-कथन की निषिद्ध प्रथाओं के विपरीत, परमेश्वर के प्रति निष्कपट और अविभाजित निष्ठा को स्वाभाविक हिन्दी में व्यक्त करता है, पर पापरहित सिद्धता का अनावश्यक अर्थ नहीं देता।
- source_word: תִּהְיֶה
  choice: बने रहना
  rationale: यह कालरूप यहाँ आज्ञा या आग्रह का कार्य करता है। “बने रहना” हिन्दी में निरंतर आचरण की अपेक्षा और वाचा-संबंधी निर्देश, दोनों को सहज रूप से व्यक्त करता है।
- source_word: עִם
  choice: के साथ
  rationale: पूर्वसर्ग का सीधा अर्थ “साथ” है। यह याहवे के साथ संबंध में खराई का भाव बनाए रखता है; “के सामने” या “के प्रति” कहना स्रोत की तुलना में अधिक व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप “याहवे” से प्रस्तुत किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय और याहवे के संदर्भ के कारण इसका अर्थ एकवचन “तुम्हारे परमेश्वर” है। “अपने परमेश्वर” आधुनिक हिन्दी में संबोधन के साथ अधिक स्वाभाविक है।
theological_decisions:
- issue: वाचा के आह्वान में תָּמִים का आशय
  choice: परमेश्वर के साथ संबंध में खरा और अखंड निष्ठावान रहना
  alternative: सिद्ध, निष्कलंक या पूरी तरह समर्पित रहना
  rationale: आसपास के पदों में अन्यजातीय शकुन-विचार और जादू-टोने से दूर रहने की आज्ञा है। इसलिए यहाँ मुख्य बल याहवे के प्रति अविभाजित निष्ठा और खराई पर है। “खरे” नैतिक गंभीरता को बनाए रखता है, लेकिन कथन को पूर्ण पापरहितता की व्यवस्थित धर्मशास्त्रीय धारणा में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। एकवचन “तुम” मूल के 2ms रूप को दर्शाता है। “खरे बने रहना” साधारण पाठक के लिए सहज है और मूल शब्द की नैतिक तथा संबंधपरक व्यापकता को खुला रखता है।
