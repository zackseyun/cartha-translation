source:
  edition: WLC
  text: כֵּ֤ן תַּעֲשֶׂה֙ לְ/כָל הֶ֣/עָרִ֔ים הָ/רְחֹקֹ֥ת מִמְּ/ךָ֖ מְאֹ֑ד אֲשֶׁ֛ר לֹא מֵ/עָרֵ֥י הַ/גּֽוֹיִם הָ/אֵ֖לֶּה הֵֽנָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/015.yaml
  text: Thus you shall do to all the cities that are very far from you[b][a], which are not among the cities of these nations.
translation:
  language: hi
  text: जो नगर तुमसे बहुत दूर हैं और इन जातियों के नगरों में से नहीं हैं, उन सभी के साथ तुम इसी प्रकार करना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: इसी प्रकार
  rationale: यह पिछले पदों में बताए गए व्यवहार की रीति की ओर संकेत करता है; आधुनिक हिन्दी में यह स्वाभाविक और विधिक निर्देश के अनुकूल है।
- source_word: תַּעֲשֶׂה
  choice: तुम ... करना
  rationale: क़ाल अपूर्ण रूप यहाँ आदेशात्मक बल रखता है। हिन्दी का यह प्रयोग स्पष्ट निर्देश देता है और अनावश्यक कठोरता नहीं जोड़ता।
- source_word: לְכָל הֶעָרִים
  choice: उन सभी के साथ
  rationale: लाम से चिह्नित प्रभावित वस्तु 'नगर' है। हिन्दी में नगरों के प्रति किए जाने वाले व्यवहार के लिए 'उन सभी के साथ' अधिक स्वाभाविक है।
- source_word: הָרְחֹקֹת מִמְּךָ מְאֹד
  choice: जो नगर तुमसे बहुत दूर हैं
  rationale: स्थानगत दूरी और מְאֹד के तीव्रताबोध, दोनों को सीधे सुरक्षित रखता है।
- source_word: אֲשֶׁר לֹא מֵעָרֵי
  choice: और ... नगरों में से नहीं हैं
  rationale: מִן का अंशसूचक भाव 'में से' द्वारा निकटता से व्यक्त होता है और निर्दिष्ट समूह से इन नगरों का बहिष्करण स्पष्ट रहता है।
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: इन जातियों
  rationale: यहाँ גּוֹיִם आसपास के भू-राजनीतिक जनसमूहों को दर्शाता है। 'जातियाँ' प्रचलित बाइबिलीय हिन्दी है और बाद के 'अन्यजाति' संबंधी अर्थ नहीं थोपता।
- source_word: הֵנָּה
  choice: इन
  rationale: स्त्रीलिंग बहुवचन संकेतवाचक का बल हिन्दी के निकटवाची 'इन' में स्वाभाविक रूप से समाहित है।
theological_decisions:
- issue: दूर के नगरों और आसपास के संदर्भ में विनाश के लिए ठहराई गई जातियों के नगरों के बीच दायरे का भेद
  choice: 'पद को स्पष्ट विधिक भेद के रूप में रखना: पिछली रीति दूर के उन नगरों पर लागू है जो इन जातियों के नगरों में से नहीं हैं।'
  alternative: इसी पद में पिछले घेराबंदी-नियमों को विस्तार से समझाना अथवा इसे सामान्य विदेशी नगरों के विषय में नरम कथन बनाना।
  rationale: मूल पाठ इस पद में सीमा निर्धारित करता है, पर आसपास के पदों की व्याख्या मुख्य पाठ में नहीं जोड़ता। अनुवाद उसके सैन्य-विधिक तनाव को न तो नरम करता है, न विस्तार देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्यक्रम हिन्दी की स्वाभाविकता के लिए पुनर्गठित है, जबकि मूल पाठ का दायरा और विरोध स्पष्ट रखा गया है।
