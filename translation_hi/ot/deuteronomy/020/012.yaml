  text: וְ/אִם לֹ֤א תַשְׁלִים֙ עִמָּ֔/ךְ וְ/עָשְׂתָ֥ה עִמְּ/ךָ֖ מִלְחָמָ֑ה וְ/צַרְתָּ֖ עָלֶֽי/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/012.yaml
  text: But if it does not make peace with you[a], but makes war against you[b], then you shall besiege it.
translation:
  language: hi
  text: परन्तु यदि वह नगर तुम्हारे साथ शांति न करे, बल्कि तुमसे युद्ध करे, तो तुम उसकी घेराबंदी करना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: परन्तु यदि ... न
  rationale: यह संयोजन पिछले पद में बताए गए शान्तिपूर्ण परिणाम के विपरीत स्थिति प्रस्तुत करता है; आधुनिक हिन्दी में ‘परन्तु यदि’ इस विरोध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תַשְׁלִים עִמָּךְ
  choice: तुम्हारे साथ शान्ति न करे
  rationale: שׁלם के हिफ़ील रूप का अर्थ यहाँ शान्तिपूर्ण सम्बन्ध स्थापित करना या शान्ति करना है। ‘शान्ति करे’ सक्रिय अर्थ को बनाए रखता है और सामान्य हिन्दी में स्पष्ट है।
- source_word: וְעָשְׂתָה עִמְּךָ מִלְחָמָה
  choice: बल्कि तुमसे युद्ध करे
  rationale: עשה מלחמה का अर्थ युद्ध करना या छेड़ना है। ‘तुमसे युद्ध करे’ इब्रानी में עִם की संबंधात्मक दिशा को बनाए रखते हुए हिन्दी में सहज है; ‘बल्कि’ पूर्ववर्ती निषेध के साथ विरोध दर्शाता है।
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: तो तुम उसे घेर लेना
  rationale: צור का अर्थ किसी नगर को सैन्य घेराबंदी में लेना है। ‘घेर लेना’ आधुनिक सामान्य हिन्दी में स्वाभाविक है और इस कानूनी निर्देश की आज्ञात्मक शक्ति व्यक्त करता है।
- source_word: עָלֶיהָ
  choice: उसे
  rationale: צור के साथ עַל घेराबंदी के लक्ष्य को चिह्नित करता है; हिन्दी में इसे ‘उसे घेरना’ कहकर स्वाभाविक रूप से व्यक्त किया जाता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और निर्देशात्मक स्वर रखा गया है। स्त्रीलिंग इब्रानी प्रत्ययों का संदर्भ नगर से है, इसलिए स्पष्टता हेतु पहली बार ‘वह नगर’ कहा गया है। ‘घेर लेना’ सामान्य पाठक के लिए ‘घेराबंदी करना’ से अधिक सहज है और सैन्य संदर्भ में अर्थ स्पष्ट रखता है।
