  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘दाख की बारी’ बाइबिलीय संदर्भ में प्रचलित और स्पष्ट है। मुख्य पाठ में मुहावरे का अर्थ दिया गया है और अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखे गए हैं।
