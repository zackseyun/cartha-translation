  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר נָטַ֥ע כֶּ֨רֶם֙ וְ/לֹ֣א חִלְּל֔/וֹ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יְחַלְּלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/006.yaml
  text: And who is the man who has planted a vineyard and has not yet enjoyed its fruit? Let him go and return to his house[a], lest he die in the battle and another man enjoy its fruit.
translation:
  language: hi
  text: और वह कौन पुरुष है जिसने दाख की बारी लगाई है, पर अब तक उसके फल का आनंद नहीं लिया? वह अपने घर लौट जाए,[a] कहीं ऐसा न हो कि वह युद्ध में मारा जाए और कोई दूसरा पुरुष उसके फल का आनंद ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “उसका समर्पण नहीं किया” या “उसका उपयोग आरम्भ नहीं किया।” यहाँ प्रयुक्त इब्रानी क्रिया दाख की बारी को पहली बार सामान्य उपयोग में लाने की ओर संकेत करती है—सम्भवतः आरम्भिक निषिद्ध वर्षों के बाद उसके फल का आनंद लेने की ओर (लैव्यव्यवस्था 19:23–25 से तुलना करें)।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: और वह कौन पुरुष है
  rationale: सैनिकों के बीच छूट पाने वाले व्यक्ति का परिचय देने वाली इब्रानी प्रश्नवाचक शैली और पुरुष युद्धार्थी का स्पष्ट संदर्भ बनाए रखा गया है।
- source_word: נָטַע כֶּרֶם
  choice: जिसने दाख की बारी लगाई है
  rationale: पूर्ण हो चुके कार्य की वर्तमान प्रासंगिकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא חִלְּלוֹ
  choice: पर अब तक उसका फल नहीं चखा
  rationale: इस संदर्भ में חלל का अर्थ अपवित्र करना नहीं, बल्कि दाख की बारी का पहली बार सामान्य उपभोग करना है; ‘फल चखा’ इस व्यावहारिक लाभ को सहज रूप में बताता है, जबकि ‘अब तक’ अपेक्षित आरम्भ न होने का भाव स्पष्ट करता है।
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: वह अपने घर लौट जाए
  rationale: दो इब्रानी क्रियाओं का निर्देशात्मक आशय संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: कहीं ऐसा न हो कि वह युद्ध में मारा जाए
  rationale: פֶּן की निवारक चेतावनी को सुरक्षित रखता है; युद्ध-संदर्भ में ‘मारा जाए’ स्वाभाविक हिन्दी है।
- source_word: וְאִישׁ אַחֵר יְחַלְּלֶנּוּ
  choice: और कोई दूसरा पुरुष उसका फल चखे
  rationale: אִישׁ का पुरुषवाचक संदर्भ और पहले חלל के लिए चुना गया अर्थ दोनों निरंतर रखे गए हैं।
