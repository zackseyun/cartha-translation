  verdict: revise
  source_fidelity: The sequence of the four exhortations and the military setting are accurately represented. However, “तुम्हारा मन कच्चा न पड़े” is not the clearest modern-standard Hindi rendering of the Hebrew idiom for loss of courage; “हृदय दुर्बल न हो” retains the source image and sense more transparently.
  naturalness: The wording is generally fluent and appropriately formal. “युद्ध करने के लिए निकट आ रहे हो” is acceptable, and the final three prohibitions are clear. Replacing the somewhat regional/colloquial-sounding “मन कच्चा न पड़े” improves broad modern Hindi readability.
  terminology: “इस्राएल,” “शत्रुओं,” and “युद्ध” are suitable. “हृदय” is preferable here because it directly corresponds to the Hebrew לבב while naturally conveying courage in this context.
  issues:
  - severity: low
    issue: “मन कच्चा न पड़े” is less transparent and less standard across modern Hindi usage than a direct courage-related expression.
    rationale: The Hebrew says literally that the heart should not become soft/faint. “तुम्हारा हृदय दुर्बल न हो” preserves both the heart imagery and the intended loss-of-courage sense without introducing ambiguity.
