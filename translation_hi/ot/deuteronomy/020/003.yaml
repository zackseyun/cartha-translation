source:
  edition: WLC
  text: וְ/אָמַ֤ר אֲלֵ/הֶם֙ שְׁמַ֣ע יִשְׂרָאֵ֔ל אַתֶּ֨ם קְרֵבִ֥ים הַ/יּ֛וֹם לַ/מִּלְחָמָ֖ה עַל אֹיְבֵי/כֶ֑ם אַל יֵרַ֣ךְ לְבַבְ/כֶ֗ם אַל תִּֽירְא֧וּ וְ/אַֽל תַּחְפְּז֛וּ וְ/אַל תַּֽעַרְצ֖וּ מִ/פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/003.yaml
  text: 'and say to them[a], ‘Hear, Israel: today you are drawing near to battle against your enemies. Do not let your heart grow faint. Do not fear, or panic[b], or be terrified because of them.’'
translation:
  language: hi
  text: और वह उनसे कहे, “हे इस्राएल, सुनो! आज तुम अपने शत्रुओं से युद्ध करने के लिए निकट आ रहे हो। तुम्हारा हृदय दुर्बल न हो। मत डरो, न घबराओ, और न उनके सामने आतंकित हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַר אֲלֵהֶם
  choice: और वह उनसे कहे
  rationale: वाव-संयुक्त पूर्ण क्रिया यहाँ विधिक निर्देश के क्रम को आगे बढ़ाती है। पिछले पद के याजक को स्पष्ट कर्ता मानते हुए हिंदी में ‘वह ... कहे’ स्वाभाविक है।
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: हे इस्राएल, सुनो!
  rationale: व्यवस्थाविवरण की परिचित आह्वान-शैली और सुनकर ध्यान देने की भावना दोनों बनी रहती हैं। संबोधन को स्पष्ट करने के लिए ‘हे’ जोड़ा गया है।
- source_word: קְרֵבִים הַיּוֹם לַמִּלְחָמָה
  choice: आज ... युद्ध करने के लिए निकट आ रहे हो
  rationale: वर्तमान कृदंत आसन्न रूप से आगे बढ़ने का भाव देता है। ‘युद्ध करने के लिए’ गंतव्य और प्रयोजन को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עַל אֹיְבֵיכֶם
  choice: अपने शत्रुओं से
  rationale: युद्ध के प्रसंग में עַל विरोधी मुठभेड़ दर्शाता है; हिंदी में ‘शत्रुओं से युद्ध’ अधिक स्वाभाविक है।
- source_word: אַל יֵרַךְ לְבַבְכֶם
  choice: तुम्हारा मन कच्चा न पड़े
  rationale: यह साहस टूटने का हिब्रू मुहावरा है। ‘मन कच्चा पड़ना’ स्रोत की आंतरिक दुर्बलता की छवि को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: אַל תִּירְאוּ
  choice: मत डरो
  rationale: प्रत्यक्ष, स्पष्ट और सामान्य हिंदी निषेध।
- source_word: וְאַל תַּחְפְּזוּ
  choice: न घबराओ
  rationale: युद्धभूमि में यह क्रिया जल्दबाजी से अधिक भयजनित व्याकुलता या बदहवासी व्यक्त करती है; ‘घबराओ’ इसका स्वाभाविक हिंदी समतुल्य है।
- source_word: וְאַל תַּעַרְצוּ
  choice: और न ... आतंकित हो
  rationale: यह विरोधी के सामने तीव्र भय से अभिभूत होने का भाव देता है और तीन निषेधों की बढ़ती तीव्रता बनाए रखता है।
- source_word: מִפְּנֵיהֶם
  choice: उनके सामने
  rationale: शाब्दिक स्थानिक अभिव्यक्ति ‘उनके सामने’ हिंदी में स्वाभाविक है और शत्रु की उपस्थिति के कारण भयभीत होने का भाव भी रहने देती है।
