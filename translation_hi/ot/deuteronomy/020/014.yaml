base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/014.yaml
  text: Only the women[a], the little children, the livestock, and everything that is in the city—all its spoil—you may take as plunder for yourself; and you may eat the spoil of your enemies, which Yahweh your God has given you.
translation:
  language: hi
  text: केवल स्त्रियों, छोटे बच्चों, पशुधन और नगर में जो कुछ हो—उसकी सारी लूट—को तुम अपने लिए लूट के रूप में ले सकते हो; और अपने शत्रुओं की उस लूट का उपभोग कर सकते हो[a], जिसे तुम्हारे परमेश्वर याहवे ने तुम्हें दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने शत्रुओं की लूट खा सकते हो।” इब्रानी क्रिया का मूल अर्थ “खाना” है, पर इसका अर्थ ली गई वस्तुओं का उपयोग करना या उनसे लाभ उठाना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: परन्तु
  rationale: यह पिछले आदेश के विपरीत एक अपवाद प्रस्तुत करता है; हिन्दी में ‘परन्तु’ इस संक्रमण को स्वाभाविक रूप से व्यक्त करता है, जबकि आगे की सूची अपवाद की सीमा स्पष्ट करती है।
- source_word: הַנָּשִׁים
  choice: स्त्रियों
  rationale: यह विशिष्ट रूप से स्त्रियों के लिए प्रयुक्त बहुवचन संज्ञा है।
- source_word: הַטַּף
  choice: छोटे बच्चों
  rationale: टफ़ प्रायः छोटे बच्चों अथवा आश्रित बालकों को दर्शाता है; ‘छोटे बच्चों’ से आयु-संबंधी भाव स्पष्ट रहता है।
- source_word: הַבְּהֵמָה
  choice: पशुधन
  rationale: युद्ध की लूट के संदर्भ में यह पालतू और संपत्ति माने जाने वाले पशुओं को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְכֹל אֲשֶׁר יִהְיֶה בָעִיר
  choice: और नगर में जो कुछ हो
  rationale: मूल के व्यापक, समावेशी अर्थ को संक्षिप्त और सहज हिन्दी में सुरक्षित रखता है।
- source_word: כָּל שְׁלָלָהּ
  choice: उसकी सारी लूट
  rationale: शׁלל युद्ध में प्राप्त वस्तुओं या माल को दर्शाता है; ‘लूट’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: תָּבֹז לָךְ
  choice: तुम अपने लिए लूट के रूप में ले सकते हो
  rationale: विधिक संदर्भ में यह अधिकृत या अनुमत कार्य है; ‘ले सकते हो’ इसे केवल भविष्यवाणी या अनिवार्य आज्ञा बनाने से बचाता है।
- source_word: וְאָכַלְתָּ אֶת שְׁלַל אֹיְבֶיךָ
  choice: और अपने शत्रुओं की उस लूट का उपभोग कर सकते हो
  rationale: אָכַל का मूल अर्थ ‘खाना’ है, पर लूट के संबंध में इसका आशय उससे लाभ उठाना या उसे उपयोग में लाना भी हो सकता है। ‘उपभोग’ इस विस्तृत अर्थ को व्यक्त करता है और शाब्दिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत करता है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन के साथ वाचा-संबंधी संबोधन को सीधे व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: विधिक निर्देश में द्वितीय पुरुष क्रियाओं का बल
  choice: अनुमतिमूलक ‘ले सकते हो’ और ‘उपभोग कर सकते हो’
  alternative: आज्ञार्थक ‘लूट लो/उपभोग करो’ अथवा भविष्यसूचक ‘लोगे/खाओगे’
  rationale: संदर्भ नगर की वस्तुओं के संबंध में अधिकृत कार्य बताता है। अनुमतिमूलक रूप मूल की निर्देशात्मक शक्ति को व्यक्त करता है, पर उसे आवश्यकता से अधिक कठोर आज्ञा नहीं बनाता।
- issue: लूट को ‘खाने’ की अभिव्यक्ति
  choice: मुख्य पाठ में ‘उपभोग’, शाब्दिक विकल्प पादटिप्पणी में
  alternative: ‘अपने शत्रुओं की लूट खा सकते हो’
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘खाना’ है, किन्तु लूट में पशु और अन्य वस्तुएँ भी सम्मिलित हैं। विस्तृत अर्थ सम्भव है; पादटिप्पणी वास्तविक शाब्दिकता और अर्थगत तनाव दोनों को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। युद्ध-संबंधी कठोरता को नरम या व्याख्यात्मक बनाकर नहीं छिपाया गया। एकवचन ‘तुम’ मूल के सामूहिक प्रतिनिधिक संबोधन को सुरक्षित रखता है। पादटिप्पणी-चिह्न उसी वाक्यांश के बाद रखा गया है जिस पर टिप्पणी लागू होती है।
