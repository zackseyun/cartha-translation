source:
  edition: WLC
  text: לְמַ֗עַן אֲשֶׁ֨ר לֹֽא יְלַמְּד֤וּ אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת כְּ/כֹל֙ תּֽוֹעֲבֹתָ֔/ם אֲשֶׁ֥ר עָשׂ֖וּ לֵֽ/אלֹהֵי/הֶ֑ם וַ/חֲטָאתֶ֖ם לַ/יהוָ֥ה אֱלֹהֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/018.yaml
  text: so that they may not teach you to do according to all their abominations that they have done for their gods[a], and you would sin against Yahweh your God.
translation:
  language: hi
  text: ताकि वे तुम्हें उनके सभी घिनौने कामों के अनुसार काम करना न सिखाएँ, जो उन्होंने अपने देवताओं के लिए किए हैं, और तुम यहोवा, अपने परमेश्वर, के विरुद्ध पाप न करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר לֹא
  choice: ताकि ... न
  rationale: यह रचना उद्देश्य और रोकथाम का भाव व्यक्त करती है; आधुनिक हिन्दी में ‘ताकि ... न’ स्वाभाविक है।
- source_word: יְלַמְּדוּ אֶתְכֶם לַעֲשׂוֹת
  choice: वे तुम्हें ... करना न सिखाएँ
  rationale: पिएल क्रिया ‘सिखाना’ और उसके बाद आए क्रियार्थक संज्ञा-रूप ‘करना’ को सीधे और सहज रूप में रखा गया है।
- source_word: כְּכֹל תּוֹעֲבֹתָם
  choice: वे सारे घिनौने काम
  rationale: כְּ अनुरूपता और כֹּל समग्रता दर्शाते हैं। ‘घिनौने काम’ תועבות के प्रबल नैतिक-धार्मिक अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: אֲשֶׁר עָשׂוּ
  choice: जो वे ... करते आए हैं
  rationale: सम्बन्धवाचक उपवाक्य को सहज हिन्दी में रखा गया है; ‘करते आए हैं’ उन स्थापित उपासना-प्रथाओं और उनकी वर्तमान प्रासंगिकता को व्यक्त करता है।
- source_word: לֵאלֹהֵיהֶם
  choice: अपने देवताओं के लिए
  rationale: לְ यहाँ उपासना के कार्यों का देवताओं की ओर निर्देशित या उनके निमित्त होना बता सकता है। ‘के लिए’ मुख्य पाठ में स्वाभाविक है; ‘के प्रति’ सम्भव विकल्प है।
- source_word: וַחֲטָאתֶם לַיהוָה
  choice: और तुम ... यहोवा के विरुद्ध पाप न करो
  rationale: वाव के साथ पूर्ण क्रिया उद्देश्य-वाक्य के आशंकित परिणाम को आगे बढ़ाती है। हिन्दी में समन्वित निषेध उस रोकथाम के भाव को स्वाभाविक रूप से व्यक्त करता है; חטא के साथ לְ अपराध के लक्ष्य को दर्शाता है।
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर यहोवा
  rationale: दिव्य नाम को ‘यहोवा’ के रूप में रखा गया है और אֱלֹהֵיכֶם को सम्बन्धसूचक ‘अपने परमेश्वर’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। हिन्दी बाइबल परम्परा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से नाम को शीर्षक में बदले बिना सुरक्षित रखा गया है।
- issue: अन्तिम क्रिया का उद्देश्य या परिणाम
  choice: और तुम ... पाप न करो
  alternative: और तुम ... पाप करोगे
  rationale: וַחֲטָאתֶם रूपतः पूर्ण क्रिया है, पर לְמַעַן אֲשֶׁר לֹא से आरम्भ रोकथाम-वाक्य के भीतर आशंकित परिणाम बताती है। हिन्दी का समन्वित निषेध इस सम्बन्ध को स्वाभाविक रखता है, जबकि विकल्प परिणाम को अधिक स्पष्ट पर अधिक कठोरता से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमामय पर सरल शैली। ‘घिनौने काम’ सामान्य पाठक के लिए ‘घृणित प्रथाएँ’ से अधिक सहज है, जबकि मूल की तीव्र निन्दात्मक शक्ति बनाए रखता है। बहुवचन ‘तुम्हें/तुम’ हिन्दी में संख्या नहीं दिखाता, पर सन्दर्भ सामूहिक इस्राएल का है।
