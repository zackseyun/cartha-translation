base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/005.yaml
  text: Then the officers shall speak to the people[a], saying, ‘Who is the man who has built a new house and has not dedicated it? Let him go and return to his house, lest he die in the battle and another man dedicate it.’
translation:
  language: hi
  text: तब अधिकारी लोगों से कहें, ‘कौन ऐसा पुरुष है जिसने नया घर बनाया है, पर उसका उद्घाटन[a] नहीं किया? वह जाए और अपने घर लौट जाए, कहीं ऐसा न हो कि वह युद्ध में मर जाए और कोई दूसरा पुरुष उसका उद्घाटन करे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसका विधिवत उपयोग आरम्भ नहीं किया।” इब्रानी क्रिया नए घर का औपचारिक रूप से उपयोग आरम्भ करने को दर्शाती है, जिसमें प्रायः उद्घाटन का भाव भी होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁטְרִים
  choice: अधिकारी
  rationale: व्यवस्थाविवरण के नागरिक और सैनिक संदर्भ में यह शब्द नियुक्त पदाधिकारियों को दर्शाता है; ‘अधिकारी’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: הָעָם
  choice: लोगों
  rationale: इब्रानी का सामान्य अर्थ ‘लोग’ है। प्रसंग में ये युद्ध के लिए इकट्ठे हुए लोग हैं, पर अनुवाद में ‘सैनिकों’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: מִי הָאִישׁ
  choice: तुममें कौन ऐसा पुरुष है
  rationale: ‘पुरुष’ मूल के एकवचन पुल्लिंग को सुरक्षित रखता है और युद्ध के लिए पात्र पुरुषों के प्रसंग में उपयुक्त है; ‘तुममें’ हिन्दी में संबोधन को स्वाभाविक बनाता है।
- source_word: בָּנָה בַיִת חָדָשׁ
  choice: नया घर बनाया है
  rationale: ‘घर’ בַּיִת का सीधा और सामान्य हिन्दी समतुल्य है।
- source_word: וְלֹא חֲנָכוֹ / יַחְנְכֶנּוּ
  choice: उसका समर्पण नहीं किया / उस घर का समर्पण करे
  rationale: חנך नए घर के उपयोग का औपचारिक आरम्भ, प्रायः समर्पण के भाव सहित, व्यक्त करता है। दोनों स्थानों पर ‘समर्पण’ दोहराने से मूल की शब्दगत पुनरावृत्ति बनी रहती है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: वह जाए और अपने घर लौट जाए
  rationale: इस विधिक-प्रक्रियात्मक संदर्भ में अपूर्ण क्रियाएँ निर्देशात्मक बल रखती हैं; हिन्दी संभावनार्थक रूप उस निर्देश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: कहीं ऐसा न हो कि वह युद्ध में मारा जाए
  rationale: यह रचना פֶּן की आशंकापरक और निवारक छाया को सहज आधुनिक हिन्दी में व्यक्त करती है। ‘मारा जाए’ युद्ध में मृत्यु के अभिप्रेत अर्थ को स्वाभाविक रूप देता है।
- source_word: וְאִישׁ אַחֵר
  choice: और कोई दूसरा पुरुष
  rationale: यह मूल के स्पष्ट एकवचन और पुल्लिंग को बनाए रखता है।
