source:
  edition: WLC
  text: כִּֽי תָצ֣וּר אֶל עִיר֩ יָמִ֨ים רַבִּ֜ים לְֽ/הִלָּחֵ֧ם עָלֶ֣י/הָ לְ/תָפְשָׂ֗/הּ לֹֽא תַשְׁחִ֤ית אֶת עֵצָ/הּ֙ לִ/נְדֹּ֤חַ עָלָי/ו֙ גַּרְזֶ֔ן כִּ֚י מִמֶּ֣/נּוּ תֹאכֵ֔ל וְ/אֹת֖/וֹ לֹ֣א תִכְרֹ֑ת כִּ֤י הָֽ/אָדָם֙ עֵ֣ץ הַ/שָּׂדֶ֔ה לָ/בֹ֥א מִ/פָּנֶ֖י/ךָ בַּ/מָּצֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/019.yaml
  text: When you besiege a city for many days[a], fighting against it to capture it, you shall not destroy its trees by swinging an axe against them, for you may eat from them, and you shall not cut them down. For is the tree of the field a man, that it should come before you in the siege?
translation:
  language: hi
  text: जब तुम किसी नगर को अपने अधिकार में लेने के लिए उसके विरुद्ध युद्ध करते हुए बहुत दिनों तक उसे घेरकर रखो, तब उसके वृक्षों पर कुल्हाड़ी चलाकर उन्हें नष्ट न करना, क्योंकि तुम उनके फल खा सकते हो; उन्हें न काटना। क्या खेत का वृक्ष कोई मनुष्य है कि वह घेराबंदी में तुम्हारा सामना करने आए?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस कठिन इब्रानी वाक्य का अनुवाद इस प्रकार भी किया गया है: “क्योंकि मनुष्य खेत का वृक्ष है,” अथवा “क्योंकि खेत का वृक्ष मनुष्य का भोजन है।” मुख्य पाठ इसे एक अलंकारिक प्रश्न मानता है, जो वृक्ष की तुलना मानव शत्रु से करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: תָצוּר אֶל־עִיר
  choice: किसी नगर को ... घेरकर रखो
  rationale: צור यहाँ सैन्य घेराबंदी करना दर्शाता है। यह हिंदी में स्वाभाविक है और लंबे समय तक जारी रहने वाली कार्रवाई का भाव भी व्यक्त करता है।
- source_word: יָמִים רַבִּים
  choice: बहुत दिनों तक
  rationale: यह मूल इब्रानी कालवाचक पद का सीधा और सहज अनुवाद है।
- source_word: לְהִלָּחֵם עָלֶיהָ לְתָפְשָׂהּ
  choice: अपने अधिकार में लेने के लिए उससे युद्ध करते हुए
  rationale: यह नगर के विरुद्ध युद्ध और उसे लेने के उद्देश्य—दोनों को स्पष्ट रखता है। 'अपने अधिकार में लेना' सैन्य प्रसंग में תפשׂ का स्वाभाविक अर्थ देता है।
- source_word: לֹא תַשְׁחִית אֶת־עֵצָהּ
  choice: उसके वृक्षों को ... नष्ट न करना
  rationale: हिफ़ील שׁחת का प्रबल अर्थ 'नष्ट करना' है; नगर के वृक्षों को हिंदी में बहुवचन रखना स्वाभाविक है।
- source_word: לִנְדֹּחַ עָלָיו גַּרְזֶן
  choice: उनके वृक्षों पर कुल्हाड़ी चलाकर
  rationale: यह कठिन इब्रानी मुहावरे का स्वाभाविक हिंदी रूप है और वृक्षों को क्षति पहुँचाने के साधन को स्पष्ट करता है।
- source_word: כִּי מִמֶּנּוּ תֹאכֵל
  choice: क्योंकि तुम उनके फल खा सकते हो
  rationale: मूल में शाब्दिक रूप से 'उससे खाओगे' है; वृक्ष से खाने का स्वाभाविक आशय उसके फल खाना है। 'सकते हो' वृक्षों की खाद्य उपयोगिता को व्यक्त करता है।
- source_word: וְאֹתוֹ לֹא תִכְרֹת
  choice: इसलिए उन्हें न काटना
  rationale: כרת वृक्ष काट गिराने का सामान्य शब्द है। 'इसलिए' प्रसंग में निषेध को पूर्ववर्ती कारण से सहज रूप से जोड़ता है।
- source_word: הָאָדָם
  choice: कोई मनुष्य
  rationale: यहाँ אדם एक मानव युद्ध-प्रतिद्वंद्वी और वृक्ष के बीच विरोध स्थापित करता है; 'कोई मनुष्य' हिंदी में अलंकारिक प्रश्न के लिए स्वाभाविक है।
- source_word: עֵץ הַשָּׂדֶה
  choice: मैदान का वृक्ष
  rationale: यह इब्रानी संबंधवाचक रचना के निकट रहते हुए हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: कि वह घेराबंदी में तुम्हारा सामना करने आए
  rationale: 'यह कठिन पद को अलंकारिक प्रश्न के रूप में समझता है: वृक्ष कोई मानव शत्रु नहीं जो युद्ध में सामने आए।'
theological_decisions:
- issue: कठिन अंतिम उपवाक्य כִּי הָאָדָם עֵץ הַשָּׂדֶה ... की व्याख्या
  choice: 'अलंकारिक प्रश्न: ''क्या मैदान का वृक्ष कोई मनुष्य है कि वह घेराबंदी में तुम्हारा सामना करने आए?'''
  alternative: '''क्योंकि मनुष्य मैदान का वृक्ष है'' अथवा ''क्योंकि मैदान का वृक्ष मनुष्य का भोजन है'''
  rationale: इब्रानी वाक्य-विन्यास वास्तव में कठिन और बहुअर्थी है। मुख्य पाठ में अलंकारिक प्रश्न प्रसंग के सैन्य विरोध को अच्छी तरह व्यक्त करता है, जबकि अन्य प्राचीन और संभव समझों को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; आज्ञार्थक शैली में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज भाषा। कठिन अंतिम वाक्य की वास्तविक अस्पष्टता पादटिप्पणी में बनाए रखी गई है।
