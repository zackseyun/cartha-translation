  edition: WLC
  text: כִּֽי הַחֲרֵ֣ם תַּחֲרִימֵ֗/ם הַ/חִתִּ֤י וְ/הָ/אֱמֹרִי֙ הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/017.yaml
  text: Instead[a], you must utterly destroy them—the Hittites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—as Yahweh your God has commanded you.
translation:
  language: hi
  text: बल्कि हित्तियों, एमोरियों, कनानियों, परिज्जियों, हिव्वियों और यबूसियों को पूरी तरह विनाश के लिए समर्पित कर देना[a], जैसा कि तुम्हारे परमेश्वर याहवे ने तुम्हें आज्ञा दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक भाव है, “तुम उन्हें निश्चय ही पूर्ण विनाश के लिए समर्पित करोगे”; यह क्रिया उन्हें पूर्ण प्रतिबंध के अधीन करके विनाश के लिए समर्पित करने का भाव रखती है।
    reason: חֵרֶם के विशिष्ट वैधानिक-धार्मिक अर्थ और इब्रानी के बलवर्धक क्रियारूप को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: बल्कि
  rationale: पिछले पद में दूर के नगरों को जीवित छोड़ने की बात के विपरीत यहाँ निकटवर्ती जातियों के लिए आदेश दिया गया है; इसलिए प्रसंग में विरोधसूचक ‘बल्कि’ स्वाभाविक है।
- source_word: הַחֲרֵם תַּחֲרִימֵם
  choice: तुम उनका पूरी तरह नाश कर देना
  rationale: धातु חרם किसी को पूर्णतः प्रतिबंध के अधीन करके विनाश के लिए समर्पित करने का भाव रखती है। infinitive absolute और finite verb का मेल आदेश को तीव्र करता है; मुख्य पाठ में यह भाव सहज हिन्दी में दिया गया है और विशिष्ट वैधानिक-धार्मिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי וְהַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: हित्तियों, एमोरियों, कनानियों, परिज्जियों, हिव्वियों और यबूसियों
  rationale: एकवचन जातिवाचक रूपों को सामूहिक अर्थ के अनुसार हिन्दी के प्रचलित बहुवचन जातिनामों में प्रस्तुत किया गया है।
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: जैसा कि ... ने तुम्हें आज्ञा दी है
  rationale: तुलनात्मक उपवाक्य और पहले दी गई, अब भी प्रभावी आज्ञा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: मूल के वाचिक और वाचा-संबंधी संबोधन को सीधे तथा स्वाभाविक ढंग से रखा गया है।
theological_decisions:
- issue: युद्ध-संबंधी आदेश में חרם का अनुवाद
  choice: पूरी तरह नाश कर देना
  alternative: पूरी तरह विनाश के लिए समर्पित कर देना; प्रतिबंध के अधीन कर देना
  rationale: मुख्य पाठ में स्पष्ट और स्वाभाविक हिन्दी रखते हुए पूर्ण विनाश की तीव्रता व्यक्त की गई है। חרם के केवल सामान्य हत्या से अधिक वैधानिक-धार्मिक आशय को पादटिप्पणी में बताया गया है, ताकि उसका तनाव मिटे नहीं।
- issue: परमेश्वर के नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘पूरी तरह नाश कर देना’ स्वाभाविक मुख्य-पाठीय अभिव्यक्ति है; जातिनाम प्रचलित हिन्दी बाइबलीय रूपों में और יְהוָה ‘याहवे’ के रूप में दिया गया है।
