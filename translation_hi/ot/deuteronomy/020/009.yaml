base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/009.yaml
  text: And when the officers have finished speaking to the people[a], they shall appoint commanders of armies at the head of the people.
translation:
  language: hi
  text: जब अधिकारी लोगों से बात कर चुकें, तब वे लोगों के आगे सेनाओं के प्रधानों को नियुक्त[a] करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे लोगों के ऊपर सेनाओं के प्रधानों को तैनात करें।” यहाँ प्रयुक्त क्रिया का अर्थ प्रसंग के अनुसार नियुक्त करना, जुटान के लिए बुलाना, अथवा किसी को दायित्व सौंपना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּת
  choice: जब ... चुकें, तब
  rationale: यह इब्रानी रचना पहले कार्य की समाप्ति के बाद अगला कार्य होने का समय बताती है; आधुनिक हिन्दी में ‘जब ... चुकें, तब’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַשֹּׁטְרִים
  choice: अधिकारी
  rationale: व्यवस्थाविवरण के इस सैनिक-नागरिक प्रसंग में यह शब्द व्यवस्था और संगठन का दायित्व निभाने वाले अधिकारियों को दर्शाता है; ‘शास्त्री’ यहाँ अनावश्यक रूप से संकीर्ण होगा।
- source_word: לְדַבֵּר אֶל־הָעָם
  choice: लोगों से बात कर
  rationale: यह עָם को सामान्य अर्थ ‘लोग’ में रखते हुए सीधे संबोधन का स्वाभाविक हिन्दी रूप है; ‘सैनिकों’ कहना मूल से अधिक विशिष्ट होता।
- source_word: וּפָקְדוּ
  choice: नियुक्त करें
  rationale: פקד के अनेक अर्थ हो सकते हैं—नियुक्त करना, गिनना या एकत्र करना। यहाँ सेनाओं के प्रधानों और नेतृत्व-स्थान के उल्लेख के कारण ‘नियुक्त करें’ संदर्भानुकूल है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: שָׂרֵי צְבָאוֹת
  choice: सेनाओं के प्रधान
  rationale: שָׂרִים नेतृत्व अथवा कमान रखने वालों और צְבָאוֹת सैन्य दलों को दर्शाता है। ‘प्रधान’ dignified और सामान्य हिन्दी है तथा बहुवचन को सुरक्षित रखता है।
- source_word: בְּרֹאשׁ הָעָם
  choice: लोगों के आगे
  rationale: शाब्दिक चित्र ‘लोगों के सिर/अग्रभाग में’ है। ‘लोगों के आगे’ अग्रणी स्थान को स्वाभाविक हिन्दी में बनाए रखता है; इसका आशय ‘लोगों पर’ अधिकार भी हो सकता है।
