source:
  edition: WLC
  text: כִּֽי תֵצֵ֨א לַ/מִּלְחָמָ֜ה עַל אֹיְבֶ֗י/ךָ וְֽ/רָאִ֜יתָ ס֤וּס וָ/רֶ֨כֶב֙ עַ֚ם רַ֣ב מִמְּ/ךָ֔ לֹ֥א תִירָ֖א מֵ/הֶ֑ם כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ הַ/מַּֽעַלְ/ךָ֖ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/001.yaml
  text: When you go out to battle against your enemies and see horses and chariots[a], a people more numerous than you, do not fear them, for Yahweh your God is with you[c][b], who brought you up from the land of Egypt.
translation:
  language: hi
  text: जब तुम अपने शत्रुओं के विरुद्ध युद्ध करने निकलो और घोड़े, रथ[a] और अपने से अधिक संख्या वाला एक जनसमूह[b] देखो, तो उनसे मत डरना; क्योंकि यहोवा, तुम्हारा परमेश्वर, तुम्हारे साथ है—वही जो तुम्हें मिस्र देश से ऊपर ले आया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘घोड़ा और रथ’; इब्रानी के एकवचन रूप यहाँ संभवतः सैन्य बल के सामूहिक अर्थ में हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने से बड़ा जनसमूह।’ प्रसंग में यह वाक्यांश संभवतः शत्रु की अधिक संख्या पर बल देता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘जो तुम्हें मिस्र देश से ऊपर ले आया।’ यह निर्गमन की घटना को इस्राएल के भरोसे का आधार बताता है।
    reason: cross_reference
lexical_decisions:
- source_word: כִּי תֵצֵא לַמִּלְחָמָה
  choice: जब तुम ... युद्ध करने निकलो
  rationale: כִּי यहाँ भावी परिस्थिति प्रस्तुत करता है और יצא למלחמה युद्ध के लिए निकलने का प्रचलित सैन्य मुहावरा है।
- source_word: עַל אֹיְבֶיךָ
  choice: अपने शत्रुओं के विरुद्ध
  rationale: शत्रुतापूर्ण कार्रवाई के साथ עַל का स्वाभाविक अर्थ ‘के विरुद्ध’ है।
- source_word: סוּס וָרֶכֶב
  choice: घोड़े, रथ
  rationale: एकवचन इब्रानी संज्ञाएँ यहाँ सामूहिक अर्थ में घुड़सवार और रथ-बल को सूचित करती हैं; हिन्दी में बहुवचन अधिक स्पष्ट है।
- source_word: עַם רַב מִמְּךָ
  choice: अपने से अधिक संख्या वाली सेना
  rationale: רַב מִן संख्यात्मक तुलना व्यक्त करता है। सैन्य प्रसंग में עַם को ‘सेना’ कहना स्वाभाविक है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: לֹא תִירָא מֵהֶם
  choice: उनसे मत डरना
  rationale: विधिक-उपदेशात्मक प्रसंग में अपूर्ण क्रिया निषेध व्यक्त करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֶיךָ עִמָּךְ
  choice: तुम्हारा परमेश्वर ... तुम्हारे साथ है
  rationale: यह वाचा-संबंधी परमेश्वर की उपस्थिति का सीधा और स्वाभाविक अनुवाद है।
- source_word: הַמַּעַלְךָ מֵאֶרֶץ מִצְרָיִם
  choice: वही जो तुम्हें मिस्र देश से निकालकर ऊपर ले आया
  rationale: עלה के ‘ऊपर लाने’ वाले निर्गमन-मुहावरे को बनाए रखते हुए हिन्दी में स्रोत से बाहर निकलने का आशय स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों के बीच स्थापित रूप ‘यहोवा’ चुना गया; ‘याहवे’ संभावित ध्वन्यात्मक विकल्प है।
- issue: इस्राएल के साहस का आधार
  choice: परमेश्वर की उपस्थिति और मिस्र से निर्गमन, दोनों को स्पष्टतः जोड़ा गया
  alternative: केवल ‘परमेश्वर तुम्हारे साथ है’ पर वाक्य समाप्त करना
  rationale: हिब्रू कृदंत הַמַּעַלְךָ उसी परमेश्वर की पहचान उसके निर्गमनकारी कार्य से कराता है; इसे अलग या गौण नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और निर्देशात्मक स्वर रखा गया है। एकवचन ‘तुम’ इब्रानी के 2ms सामूहिक संबोधन के अनुरूप पूरे वाक्य में बनाए रखा गया है।
