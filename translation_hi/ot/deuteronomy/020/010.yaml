  yaml_path: translation/ot/deuteronomy/020/010.yaml
  text: When you draw near to a city to fight against it[a], you shall call out to it for peace.
translation:
  language: hi
  text: जब तुम किसी नगर पर युद्ध करने के लिए उसके निकट पहुँचो, तो उसे शांति की पेशकश करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ यह कारण नहीं, बल्कि युद्ध-संबंधी विधि लागू होने की परिस्थिति बताता है; इसलिए ‘जब’ स्वाभाविक है।
- source_word: תִקְרַב אֶל עִיר
  choice: किसी नगर के पास पहुँचो
  rationale: קרב के निकट आने के ठोस अर्थ को आधुनिक और सहज हिन्दी में व्यक्त करता है।
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: उससे युद्ध करने के लिए
  rationale: यह पद नगर के विरुद्ध युद्ध करने का उद्देश्य बताता है; हिन्दी में ‘नगर से युद्ध करना’ स्वाभाविक प्रयोग है।
- source_word: וְקָרָאתָ אֵלֶיהָ לְשָׁלוֹם
  choice: उसे शान्ति का प्रस्ताव दो
  rationale: शाब्दिक रूप से ‘उसकी ओर शान्ति के लिए पुकारना’ है, पर इस युद्ध-संदर्भ में आशय शान्ति की पेशकश करना है; चुना हुआ रूप वही अर्थ स्पष्ट और स्वाभाविक हिन्दी में देता है।
