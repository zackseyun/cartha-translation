- from: जब तुम किसी नगर से युद्ध करने के लिए उसके पास पहुँचो, तो उसे शान्ति का प्रस्ताव दो।
  to: जब तुम किसी नगर पर युद्ध करने के लिए उसके निकट पहुँचो, तो उसे शांति की पेशकश करो।
  rationale: The revision changes only the warfare construction to make the Hebrew ‘against it’ explicit and idiomatic in Hindi. It retains the temporal legal instruction, the approach to a city, and the contextual sense of calling to it for peace.
