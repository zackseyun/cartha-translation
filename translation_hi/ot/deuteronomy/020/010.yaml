review_pass:
  verdict: revise
  source_fidelity: The draft correctly takes כִּי as a temporal ‘when’ and conveys the pre-battle offer of peace. However, ‘नगर से युद्ध करना’ normally suggests fighting with the city rather than against it, whereas עָלֶיהָ explicitly means ‘against it.’
  naturalness: The sentence is generally clear, but ‘किसी नगर से युद्ध करने के लिए उसके पास पहुँचो’ is semantically awkward because of ‘नगर से युद्ध.’ ‘किसी नगर पर युद्ध करने के लिए उसके निकट पहुँचो’ is natural formal Hindi.
  terminology: ‘नगर,’ ‘युद्ध,’ and ‘शांति की पेशकश’ are appropriate modern-standard Hindi terms. ‘शांति की पेशकश करो’ accurately expresses the contextual force of לְשָׁלוֹם without claiming a more specific technical formulation than the Hebrew requires.
  issues:
  - severity: medium
    issue: ‘नगर से युद्ध करने’ reverses/obscures the directional relation of the warfare phrase.
    rationale: The Hebrew infinitive phrase לְהִלָּחֵם עָלֶיהָ means ‘to fight against it [the city].’ In Hindi, ‘X से युद्ध करना’ commonly means to wage war against X when X is an opposing people or power, but with ‘नगर’ it is awkward and can be read as association rather than attack; ‘नगर पर युद्ध करना’ clearly preserves the intended direction.
  revised_text: जब तुम किसी नगर पर युद्ध करने के लिए उसके निकट पहुँचो, तो उसे शांति की पेशकश करो।
  revised_footnotes: []
  revision_rationale: The revision changes only the warfare construction to make the Hebrew ‘against it’ explicit and idiomatic in Hindi. It retains the temporal legal instruction, the approach to a city, and the contextual sense of calling to it for peace.
