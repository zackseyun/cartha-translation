source:
  edition: WLC
  text: וּ/נְתָנָ֛/הּ יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וְ/הִכִּיתָ֥ אֶת כָּל זְכוּרָ֖/הּ לְ/פִי חָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/013.yaml
  text: And Yahweh your God will give it into your hand[a], and you shall strike down all its males with the edge of the sword.
translation:
  language: hi
  text: और याहवे, तुम्हारा परमेश्वर, उसे तुम्हारे हाथ में दे देगा, और तुम उसके सभी पुरुषों[a] को तलवार की धार से मार डालना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: ‘उसके सभी नर’; इब्रानी शब्द सामान्य ‘लोगों’ के बजाय विशेष रूप से पुरुषों को निर्दिष्ट करता है।'
    reason: मूल शब्द की लैंगिक विशिष्टता को स्पष्ट करना।
lexical_decisions:
- source_word: וּנְתָנָהּ
  choice: और ... उसे ... दे देगा
  rationale: क्रिया נתן के साथ स्त्रीलिंग एकवचन कर्म-प्रत्यय नगर की ओर संकेत करता है। आरंभिक ו को क्रमसूचक ‘और’ के रूप में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले दिव्य नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित ध्वन्यात्मक लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: यह 2 पुरुष एकवचन प्रत्यय सहित वाचा-संबंधी सामान्य अभिव्यक्ति है।
- source_word: בְּיָדֶךָ
  choice: तुम्हारे हाथ में
  rationale: यह किसी नगर को अधिकार में सौंपने का मुहावरा है; हिन्दी में मूल ‘हाथ’ का बिंब स्वाभाविक रूप से सुरक्षित रहता है।
- source_word: וְהִכִּיתָ
  choice: और तुम ... मार डालना
  rationale: सैनिक प्रसंग में נכה का हिफ़ील रूप प्राणघातक रूप से मार गिराने का अर्थ देता है। ‘मार डालना’ हिंसा की वास्तविकता को न तो हल्का करता है, न अतिरिक्त व्याख्या जोड़ता है।
- source_word: כָּל זְכוּרָהּ
  choice: उसके सभी पुरुषों
  rationale: זְכוּר पुरुष-लिंग को स्पष्ट करता है और स्त्रीलिंग प्रत्यय नगर की ओर संकेत करता है। सहज हिन्दी के लिए ‘सभी पुरुषों’ चुना गया है, जबकि पादटिप्पणी इसकी शाब्दिक लैंगिक विशिष्टता बताती है।
- source_word: לְפִי חָרֶב
  choice: तलवार की धार से
  rationale: शाब्दिक बिंब ‘तलवार के मुँह से’ है; ‘तलवार की धार से’ हिन्दी में स्वाभाविक मुहावरेदार समतुल्य है और मूल बिंब को बनाए रखता है।
theological_decisions:
- issue: ईश्वर द्वारा सौंपे गए नगर के विरुद्ध प्राणघातक युद्धादेश को प्रस्तुत करना
  choice: 'आदेश को सीधे और स्पष्ट रूप में रखा गया है: ‘उसके सभी पुरुषों को तलवार की धार से मार डालना।’'
  alternative: इसे केवल ‘हरा देना’ कहकर नरम करना, या न्याय अथवा पवित्र युद्ध की व्याख्या जोड़ना।
  rationale: इब्रानी पाठ नगर को याहवे द्वारा अधिकार में दिए जाने और उसके सभी पुरुषों को प्राणघातक रूप से मारने—दोनों को स्पष्ट करता है। अनुवाद इस तनाव और गंभीरता को बिना शमन अथवा धर्मवैज्ञानिक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याहवे’ दिव्य नाम का लिप्यंतरण है; ‘तुम्हारे हाथ में’ और ‘तलवार की धार से’ मूल इब्रानी बिंबों को स्वाभाविक हिन्दी में सुरक्षित रखते हैं।
