base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/008.yaml
  text: Then the officers shall continue to speak to the people and say[a], ‘Who is the man who is fearful and fainthearted? Let him go and return to his house[b], lest he melt the heart of his brothers like his own heart.’
translation:
  language: hi
  text: फिर अधिकारी लोगों से बोलना जारी रखें और कहें, “कौन ऐसा पुरुष है जो भयभीत और कच्चे हृदय का है?[a] वह अपने घर लौट जाए, कहीं ऐसा न हो कि वह अपने भाइयों[b] का हृदय अपने हृदय के समान पिघला दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भयभीत और नरम/कोमल हृदय का।” यहाँ आशय युद्ध का सामना करने के साहस की कमी से है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाइयों” से आशय उसके साथी इस्राएलियों या साथी सैनिकों से है।
    reason: cultural_note
lexical_decisions:
- source_word: וְיָסְפוּ
  choice: आगे कहें
  rationale: יסף के साथ ‘बोलना’ वाला यह मुहावरा बात को जारी रखने या आगे बढ़ाने का अर्थ देता है। ‘आगे कहें’ क्रम और निरंतरता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַשֹּׁטְרִים
  choice: अधिकारी
  rationale: यहाँ शब्द आधुनिक पुलिसकर्मियों के लिए नहीं, नियुक्त प्रशासनिक या सैन्य अधिकारियों के लिए है; इसलिए ‘अधिकारी’ उपयुक्त है।
- source_word: מִי הָאִישׁ
  choice: कौन ऐसा पुरुष है
  rationale: मूल पाठ का पुल्लिंग एकवचन युद्ध में जाने वाले एक पुरुष को सामने रखता है। ‘पुरुष’ इस लिंग-सूचना को बनाए रखता है।
- source_word: הַיָּרֵא וְרַךְ הַלֵּבָב
  choice: भयभीत और दिल का कमज़ोर
  rationale: पहला पद भयभीत होने और दूसरा शाब्दिक रूप से ‘नरम/कोमल हृदय’ होने को बताता है। ‘दिल का कमज़ोर’ युद्ध में साहस की कमी का स्वाभाविक हिन्दी बोध देता है, बिना दोनों विशेषणों को एक में मिलाए।
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: वह अपने घर लौट जाए
  rationale: दोनों क्रियाएँ निर्देशात्मक बल रखती हैं। हिन्दी में ‘लौट जाए’ जाने और घर वापस पहुँचने की संयुक्त गति को सहज रूप से व्यक्त करता है।
- source_word: וְלֹא יִמַּס
  choice: कहीं ऐसा न हो कि वह ... पिघला दे
  rationale: מסס साहस टूटने के लिए प्रयुक्त ‘पिघलना’ रूपक है। वाक्य में दूसरे सैनिकों का हृदय कर्म होने के कारण हिन्दी में ‘पिघला दे’ कारणवाचक भाव को स्पष्ट और संक्षिप्त रखता है।
- source_word: לְבַב אֶחָיו
  choice: अपने भाइयों का हृदय
  rationale: एकवचन सामूहिक ‘हृदय’ और बहुवचन संबंधसूचक ‘भाइयों’ को मूल के निकट रखा गया है। प्रसंग में भाई सह-इस्राएली या साथी सैनिक हैं।
- source_word: כִּלְבָבוֹ
  choice: अपने हृदय के समान
  rationale: यह तुलना विशेष रूप से उसके अपने हृदय से है। ‘हृदय’ की पुनरावृत्ति मूल पाठ के रूपक और शब्द-साम्य को बनाए रखती है।
theological_decisions:
- issue: युद्ध-संदर्भ की लिंग-सूचक भाषा
  choice: मुख्य पाठ में ‘पुरुष’ और ‘भाइयों’ को बनाए रखना
  alternative: ‘व्यक्ति’ और ‘साथियों/साथी सैनिकों’ का प्रयोग
  rationale: इब्रानी पाठ पुल्लिंग एकवचन और पुरुष संबंधसूचक बहुवचन का प्रयोग करता है। युद्ध-संदर्भ की मूल सामाजिक बनावट को बनाए रखते हुए ‘भाइयों’ का आशय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दिल का कमज़ोर’ स्वाभाविक मुहावरा है, जबकि दो बार ‘हृदय’ रखकर अंतिम रूपक और मूल की शब्द-पुनरावृत्ति सुरक्षित की गई है।
