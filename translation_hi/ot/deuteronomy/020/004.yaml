  text: For Yahweh your God is the one who goes with you to fight for you against your enemies[a], to save you.
translation:
  language: hi
  text: क्योंकि तुम्हारा परमेश्वर याहवे ही तुम्हारे साथ जाता है, ताकि तुम्हारी ओर से तुम्हारे शत्रुओं के विरुद्ध लड़े और तुम्हें बचाए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हें छुड़ाए” अथवा “तुम्हें विजय दिलाए।” इब्रानी क्रिया बचाने या छुड़ाने का अर्थ दे सकती है; यहाँ उसका संदर्भ युद्ध है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शब्द पिछली exhortation का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ उसका व्याख्यात्मक संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: रचना में द्वितीय पुरुष बहुवचन प्रत्यय है; सामूहिक संबोधन के लिए हिन्दी में ‘तुम्हारा परमेश्वर’ स्वाभाविक है।
- source_word: הַהֹלֵךְ
  choice: ही ... जाता है
  rationale: कृदन्त का वर्णनात्मक और सतत भाव रखा गया है; ‘ही’ ‘वही है जो’ की अपेक्षा अधिक सहज हिन्दी में कर्ता पर बल देता है।
- source_word: עִמָּכֶם
  choice: तुम्हारे साथ
  rationale: यह परमेश्वर की संगति और उपस्थिति का सीधा अर्थ व्यक्त करता है।
- source_word: לְהִלָּחֵם לָכֶם
  choice: तुम्हारी ओर से ... लड़े
  rationale: क्रिया युद्ध करने को और לָכֶם हितार्थ भाव को दर्शाता है; ‘तुम्हारी ओर से’ स्पष्ट करता है कि वह उनके पक्ष में लड़ता है।
- source_word: עִם אֹיְבֵיכֶם
  choice: तुम्हारे शत्रुओं के विरुद्ध
  rationale: युद्ध के प्रसंग में עִם विरोध का संबंध बताता है, जिसे हिन्दी में ‘के विरुद्ध’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְהוֹשִׁיעַ אֶתְכֶם
  choice: तुम्हें बचाए
  rationale: हिफ़ील क्रिया उद्धार, छुड़ाने या विजय दिलाने का अर्थ दे सकती है; ‘बचाए’ व्यापक अर्थ को रखते हुए युद्ध-संदर्भ में सहज है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है और नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: युद्ध-संदर्भ में לְהוֹשִׁיעַ का अर्थ-क्षेत्र
  choice: तुम्हें बचाए
  alternative: तुम्हें छुड़ाए; तुम्हें विजय दिलाए
  rationale: ‘बचाए’ क्रिया के व्यापक उद्धारात्मक अर्थ को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि तत्काल युद्ध-संदर्भ में छुड़ाना या विजय दिलाना भी निहित हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। बहुवचन सामूहिक संबोधन को सामान्य हिन्दी रूप ‘तुम्हारा/तुम्हारे/तुम्हें’ से व्यक्त किया गया है; पद की व्याख्यात्मक शुरुआत और ईश्वरीय साथ, युद्ध तथा बचाव की क्रमिकता सुरक्षित है।
