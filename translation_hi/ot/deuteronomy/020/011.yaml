base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/011.yaml
  text: And if it answers you with peace and opens to you[b][a], then all the people found in it shall become forced labor for you and shall serve you.
translation:
  language: hi
  text: और यदि वह तुम्हें शांति का उत्तर दे[a] और तुम्हारे लिए खोल दे, तो उसमें पाए जाने वाले सभी लोग तुम्हारे लिए बेगार के अधीन होंगे[b] और तुम्हारी सेवा करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शांति की शर्तों के साथ तुम्हें उत्तर दे।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारे लिए कर या बेगार के अधीन होंगे।” इब्रानी शब्द מַס कर, लगान या अनिवार्य बेगार को सूचित कर सकता है; यहाँ प्रसंग बाध्य श्रम की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: शान्ति के साथ
  rationale: संज्ञा का मूल अर्थ ‘शान्ति’ बनाए रखते हुए युद्ध और आत्मसमर्पण के प्रसंग में शांतिपूर्ण उत्तर का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: תַּעַנְךָ
  choice: तुम्हें उत्तर दे
  rationale: यहाँ ענה का सीधा अर्थ ‘उत्तर देना’ है; स्त्रीलिंग एकवचन क्रिया नगर को व्यक्तिवाचक रूप में प्रस्तुत करती है।
- source_word: וּפָתְחָה לָךְ
  choice: तुम्हारे लिए खोल दे
  rationale: इब्रानी में कर्म, जैसे ‘फाटक’, स्पष्ट नहीं है; इसलिए उसे मुख्य पाठ में जोड़ने के बजाय मूल की संक्षिप्तता और अस्पष्टता रखी गई है।
- source_word: הָעָם הַנִּמְצָא בָהּ
  choice: उसमें पाए जाने वाले सभी लोग
  rationale: निफ़ाल कृदन्त का ‘पाए जाने वाले’ अनुवाद मूल अभिव्यक्ति के निकट और हिन्दी में बोधगम्य है।
- source_word: לָמַס
  choice: बेगार करेंगे
  rationale: מַס कर, लगान या अनिवार्य श्रम को सूचित कर सकता है। अगले वाक्यांश ‘सेवा करेंगे’ और युद्धाधीनता के प्रसंग में ‘बेगार’ बाध्य श्रम का सटीक, संक्षिप्त और परिचित हिन्दी शब्द है।
- source_word: וַעֲבָדוּךָ
  choice: तुम्हारी सेवा करेंगे
  rationale: עבד के सामान्य अर्थ ‘सेवा करना/काम करना’ को बनाए रखता है और किसी अधिक विशिष्ट संस्था को अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: युद्ध-विधान में अधीनता और बाध्य श्रम की भाषा
  choice: ‘तुम्हारे लिए बेगार करेंगे और तुम्हारी सेवा करेंगे’ के द्वारा थोपे गए श्रम और अधीनता का स्पष्ट अर्थ बनाए रखा गया है।
  alternative: ‘तुम्हें कर देंगे और तुम्हारी सेवा करेंगे’ अथवा ‘तुम्हारे अधीन होकर बेगार करेंगे।’
  rationale: מַס का अर्थ केवल आर्थिक कर तक सीमित नहीं है और निकटवर्ती עבד श्रम-सेवा की ओर संकेत करता है। अनुवाद न तो इस कठोरता को नरम करता है, न इब्रानी से अधिक विशिष्ट व्यवस्था आरोपित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज स्तर रखा गया है। ‘बेगार’ coercive labor को सामान्य पाठक के लिए संक्षेप में स्पष्ट करता है। ‘तुम्हारे लिए खोल दे’ में मूल पाठ की अनिर्दिष्ट वस्तु सुरक्षित है; ‘फाटक’ को व्याख्यात्मक रूप से नहीं जोड़ा गया।
