source:
  edition: WLC
  text: רַ֗ק מֵ/עָרֵ֤י הָֽ/עַמִּים֙ הָ/אֵ֔לֶּה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה לֹ֥א תְחַיֶּ֖ה כָּל נְשָׁמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/016.yaml
  text: But from the cities of these peoples that Yahweh your God is giving you as an inheritance[a], you shall not let any living thing remain alive.
translation:
  language: hi
  text: परन्तु इन लोगों के नगरों में से, जो याहवे, तुम्हारा परमेश्वर, तुम्हें विरासत के रूप में दे रहा है, किसी भी प्राणधारी[a] को जीवित न छोड़ना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “हर साँस लेनेवाला।”'
    reason: כָּל נְשָׁמָה की ठोस इब्रानी अभिव्यक्ति और उसके संभावित अर्थ-विस्तार को दिखाने के लिए।
lexical_decisions:
- source_word: רַק
  choice: परन्तु
  rationale: यहाँ यह शब्द पहले दिए गए दूर के नगरों संबंधी निर्देशों के विपरीत, एक अपवाद प्रस्तुत करता है; इसलिए विरोधसूचक संयोजक स्वाभाविक है।
- source_word: הָעַמִּים הָאֵלֶּה
  choice: इन लोगों
  rationale: עַמִּים का मूल अर्थ ‘लोग/जनसमूह’ है; यह आधुनिक राष्ट्र-राज्य का भाव जोड़े बिना इब्रानी अर्थ को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: तुम्हें विरासत में दे रहा है
  rationale: नֹתֵן के कृदन्त रूप की जारी क्रिया और נַחֲלָה की वाचा-संबंधी ‘विरासत’ की धारणा दोनों सुरक्षित रहती हैं।
- source_word: לֹא תְחַיֶּה
  choice: जीवित न छोड़ना
  rationale: חיה के पिएल रूप का कारक अर्थ ‘जीवित रहने देना/जीवित रखना’ है; हिंदी में यह निषेधात्मक आज्ञा का सीधा और स्वाभाविक रूप है।
- source_word: כָּל נְשָׁמָה
  choice: किसी भी प्राणधारी
  rationale: शाब्दिक भाव ‘हर साँस लेनेवाला’ है। ‘प्राणधारी’ साँस और जीवन की ठोस छवि को बनाए रखते हुए आधुनिक हिंदी में सहज है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका प्रत्यक्ष लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: נַחֲלָה की वाचा-संबंधी भूमि-शब्दावली
  choice: विरासत में
  alternative: अधिकार के रूप में
  rationale: ‘विरासत’ इस्राएल को दिए जानेवाले देश की वाचा-संबंधी धारणा को सुरक्षित रखती है और उसे केवल संपत्ति तक सीमित नहीं करती।
- issue: כָּל נְשָׁמָה का विस्तार
  choice: किसी भी प्राणधारी
  alternative: किसी भी मनुष्य; किसी भी जीवित वस्तु
  rationale: इब्रानी पद स्वयं ‘हर साँस/साँस लेनेवाले’ कहता है। व्यापकता या संदर्भगत सीमा को चुपचाप निश्चित करने के बजाय मूल अभिव्यक्ति की व्यापकता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। एकवचन संबोधन के अनुरूप ‘तुम्हारा/तुम्हें’ तथा आज्ञार्थक ‘न छोड़ना’ प्रयुक्त है। ‘प्राणधारी’ औपचारिकता और सामान्य बोधगम्यता के बीच संतुलन रखता है।
