  yaml_path: translation/ot/deuteronomy/020/002.yaml
  text: And when you draw near to the battle[a], the priest shall come forward and speak to the people[b],
translation:
  language: hi
  text: जब तुम युद्ध के निकट पहुँचोगे[a], तब याजक आगे आएगा और लोगों से बोलेगा[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लड़ाई के निकट पहुँचोगे।” हिब्रू शब्द מִלְחָמָה सामान्य रूप से युद्ध या किसी विशिष्ट लड़ाई—दोनों का अर्थ दे सकता है; यहाँ युद्ध के निकट आने का संदर्भ “लड़ाई” को भी संभव बनाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “लोगों” से आशय एकत्र इस्राएली योद्धाओं से है, पर हिब्रू में “सैनिकों” जैसा संकीर्ण सैन्य शब्द नहीं, बल्कि व्यापक शब्द “लोग” ही है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: जब…तब
  rationale: यह रचना भविष्य में घटने वाली परिस्थिति का परिचय देती है; आधुनिक हिन्दी में ‘जब…तब’ इसके कालवाचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּקָרָבְכֶם
  choice: तुम…के निकट पहुँचो
  rationale: קרב का अर्थ निकट आना या पहुँचना है; infinitive construct और द्वितीय पुरुष बहुवचन प्रत्यय को हिन्दी कालवाचक उपवाक्य में व्यक्त किया गया है।
- source_word: אֶל הַמִּלְחָמָה
  choice: युद्ध के निकट
  rationale: מִלְחָמָה युद्ध या किसी विशिष्ट लड़ाई दोनों का बोध करा सकता है। निकट जाने की स्थानिक भाषा बनाए रखने के लिए ‘के निकट’ रखा गया है, जबकि ‘युद्ध’ हिन्दी में दोनों स्तरों की कुछ व्यापकता बनाए रखता है।
- source_word: וְנִגַּשׁ
  choice: आगे आकर
  rationale: נגשׁ में पास आने का भाव है; लोगों को संबोधित करने के प्रसंग में ‘आगे आकर’ स्वाभाविक और अर्थानुकूल है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: निश्चित एकवचन संज्ञा का पारंपरिक, स्पष्ट और गरिमापूर्ण हिन्दी प्रतिरूप।
- source_word: וְדִבֶּר
  choice: कहे
  rationale: पिएल रूप यहाँ बोलने या संबोधित करने का अर्थ देता है। ‘कहे’ अगले पद में आने वाले प्रत्यक्ष कथन के लिए स्वाभाविक है।
- source_word: אֶל הָעָם
  choice: लोगों से
  rationale: हिब्रू में व्यापक शब्द ‘लोग’ है, कोई संकीर्ण सैन्य पद नहीं; हिन्दी में बोलने के साथ ‘से’ स्वाभाविक कारक है।
