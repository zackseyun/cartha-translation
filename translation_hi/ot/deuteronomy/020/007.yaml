  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר אֵרַ֤שׂ אִשָּׁה֙ וְ/לֹ֣א לְקָחָ֔/הּ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יִקָּחֶֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/007.yaml
  text: And who is the man who has become engaged to a woman and has not taken her? Let him go and return to his house[c][b][a], lest he die in the battle and another man take her.
translation:
  language: hi
  text: और कौन ऐसा पुरुष है जिसने किसी स्त्री से मंगनी की है, पर अभी उसे पत्नी बनाकर अपने घर नहीं लाया?[a] वह जाए और अपने घर लौट जाए, कहीं ऐसा न हो कि वह युद्ध में मर जाए और कोई दूसरा पुरुष उससे विवाह कर ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पर उसे नहीं लिया”; यहाँ आशय मंगनी के बाद उसे पत्नी के रूप में ग्रहण करके घर लाने से है।
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: और कौन ऐसा पुरुष है
  rationale: यह सैनिकों को मिली अगली छूट का प्रश्नात्मक परिचय है; ‘पुरुष’ इब्रानी के पुल्लिंग एकवचन और सैन्य प्रसंग को बनाए रखता है।
- source_word: אֵרַשׂ אִשָּׁה
  choice: किसी स्त्री से मंगनी की है
  rationale: אֵרַשׂ औपचारिक विवाह-पूर्व वाग्दान को दर्शाता है। आधुनिक हिन्दी में ‘मंगनी की है’ स्वाभाविक और व्यापक रूप से बोधगम्य है।
- source_word: וְלֹא לְקָחָהּ
  choice: पर अभी उसे पत्नी बनाकर अपने घर नहीं लाया
  rationale: לקח का यहाँ विवाह-संबंधी अर्थ है—मंगनी के बाद स्त्री को पत्नी के रूप में ग्रहण करना। यह अनुवाद शाब्दिक ‘उसे नहीं लिया’ की अस्पष्टता से बचते हुए मंगनी और पूर्ण विवाह का अंतर स्पष्ट करता है।
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: वह अपने घर लौट जाए
  rationale: संयुक्त क्रियाएँ जाने और घर वापस लौटने का निर्देश देती हैं; हिन्दी में ‘अपने घर लौट जाए’ निर्देशात्मक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: कहीं ऐसा न हो कि वह युद्ध में मारा जाए
  rationale: פֶּן चेतावनी या आशंकित परिणाम प्रस्तुत करता है। युद्ध के प्रसंग में ‘मारा जाए’ हिन्दी में ‘मर जाए’ की अपेक्षा अधिक सटीक और स्वाभाविक है।
- source_word: וְאִישׁ אַחֵר יִקָּחֶנָּה
  choice: और कोई दूसरा पुरुष उससे विवाह कर ले
  rationale: दूसरी बार प्रयुक्त לקח भी इसी विवाह-संबंधी अर्थ में है। ‘विवाह कर ले’ लक्ष्य-पाठक के लिए अर्थ स्पष्ट करता है और संभावित गैर-विवाहिक अर्थ से बचाता है।
