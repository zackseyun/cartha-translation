translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, स्पष्ट और गरिमापूर्ण रखी गई है। विधिक अनुमति को ‘सकते हो’ से व्यक्त किया गया है। ‘फलदार’ अकेले कहने से अखाद्य फल वाले पेड़ भी समझे जा सकते थे, इसलिए ‘खाने योग्य फल देने वाले’ चुना गया। मूल के घेराबंदी-संबंधी तकनीकी शब्द की व्यापकता और अंतिम क्रिया की पतन-छवि को पादटिप्पणियों में सुरक्षित रखा गया है।
