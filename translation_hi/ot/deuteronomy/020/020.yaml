source:
  edition: WLC
  text: רַ֞ק עֵ֣ץ אֲשֶׁר תֵּדַ֗ע כִּֽי לֹא עֵ֤ץ מַאֲכָל֙ ה֔וּא אֹת֥/וֹ תַשְׁחִ֖ית וְ/כָרָ֑תָּ וּ/בָנִ֣יתָ מָצ֗וֹר עַל הָ/עִיר֙ אֲשֶׁר הִ֨וא עֹשָׂ֧ה עִמְּ/ךָ֛ מִלְחָמָ֖ה עַ֥ד רִדְתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/020.yaml
  text: Only the trees that you know are not trees for food[a], those you may destroy and cut down, and build siegeworks against the city that is making war with you[b], until you bring it down.
translation:
  language: hi
  text: केवल उन पेड़ों को, जिनके बारे में तुम जानते हो कि वे खाने योग्य फल देने वाले पेड़ नहीं हैं, तुम नष्ट कर सकते हो और काट डाल सकते हो। उनसे उस नगर के विरुद्ध घेराबंदी की संरचनाएँ[a] बना सकते हो, जो तुमसे युद्ध कर रहा है, जब तक कि वह गिर न जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घेराबंदी की ढाल बनाओ” अथवा “घेराबंदी की संरचनाएँ बनाओ।” इब्रानी מָצוֹר किसी एक खास संरचना के बजाय घेराबंदी की संरचनाओं या किलेबंदी के लिए व्यापक रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “जब तक उसका पतन न हो जाए।” इब्रानी में नगर के नीचे आने या गिरने की भाषा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: केवल
  rationale: पिछले पद में फलदार पेड़ों को नष्ट करने की मनाही के बाद यह शब्द अपवाद को सीमित करता है।
- source_word: עֵץ מַאֲכָל
  choice: खाने योग्य फल देने वाले पेड़
  rationale: शाब्दिक अर्थ ‘भोजन का पेड़’ है; संदर्भ में आशय ऐसे जीवित पेड़ों से है जिनकी उपज भोजन के काम आती है।
- source_word: אֲשֶׁר תֵּדַע כִּי לֹא ... הוּא
  choice: जिनके बारे में तुम जानते हो कि वे ... नहीं हैं
  rationale: पेड़ों की पहचान के विषय में निश्चित जानकारी को स्वाभाविक हिन्दी में व्यक्त करता है और इब्रानी के वितरक एकवचन को हिन्दी बहुवचन में स्पष्ट करता है।
- source_word: אֹתוֹ תַשְׁחִית וְכָרָתָּ
  choice: तुम नष्ट करके काट सकते हो
  rationale: विधिक संदर्भ में यह आज्ञा से अधिक अनुमति देता है; ‘नष्ट’ और ‘काट’ दोनों क्रियाओं को बनाए रखा गया है।
- source_word: וּבָנִיתָ מָצוֹר
  choice: घेराबंदी की संरचनाएँ खड़ी कर सकते हो
  rationale: מָצוֹר किसी एक निश्चित यंत्र तक सीमित न होकर घेराबंदी के लिए बनाई गई संरचनाओं या मोर्चेबंदी को सूचित कर सकता है।
- source_word: עַל הָעִיר
  choice: नगर के विरुद्ध
  rationale: सैन्य संदर्भ में עַל का विरोधात्मक बल व्यक्त करता है।
- source_word: אֲשֶׁר הִוא עֹשָׂה עִמְּךָ מִלְחָמָה
  choice: जो तुमसे युद्ध कर रहा है
  rationale: इब्रानी मुहावरे ‘तुम्हारे साथ युद्ध कर रहा है’ को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: עַד רִדְתָּהּ
  choice: जब तक कि वह गिर न जाए
  rationale: यह रूप नगर के पतन तक की अवधि बताता है। हिन्दी में ‘गिरना’ नगर की सैन्य पराजय का स्वाभाविक रूपक है और इब्रानी की अवरोह/पतन की छवि को बनाए रखता है।
