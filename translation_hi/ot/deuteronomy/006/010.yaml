base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/010.yaml
  text: And when Yahweh your God brings you into the land that he swore to your fathers—to Abraham[a], to Isaac, and to Jacob—to give you, with great and good cities that you did not build,
translation:
  language: hi
  text: और जब तुम्हारा परमेश्वर याहवे तुम्हें उस देश में ले आए, जिसे तुम्हें देने की शपथ उसने तुम्हारे पितरों[a]—अब्राहम, इसहाक और याकूब—से खाई थी, जहाँ बड़े और अच्छे नगर हैं जिन्हें तुमने नहीं बनाया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारे पूर्वजों’। इब्रानी में शाब्दिक अर्थ ‘तुम्हारे पितरों’ है, और यहाँ विशेष रूप से अब्राहम, इसहाक और याकूब के नाम दिए गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और जब
  rationale: यह रचना भविष्य में आने वाली परिस्थिति का परिचय देती है; ‘और जब’ प्रवाह को स्वाभाविक रखते हुए भविष्याभिमुख अर्थ व्यक्त करता है।
- source_word: יְבִיאֲךָ
  choice: तुम्हें ... में ले आए
  rationale: בוא के हिफ़ील रूप का कारक अर्थ ‘अंदर लाना/ले आना’ है; हिंदी में यह सहज और अर्थनिष्ठ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय को ‘तुम्हारा’ से स्पष्ट किया गया है; ‘परमेश्वर’ आधुनिक हिंदी बाइबलीय शैली में स्वाभाविक है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: व्यवस्थाविवरण के प्रतिज्ञा-संदर्भ में אֶרֶץ निर्दिष्ट प्रतिज्ञात भूभाग को दर्शाता है; ‘उस देश’ हिंदी में निश्चितता और संदर्भ दोनों स्पष्ट करता है।
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: जिसे ... देने की शपथ उसने ... से खाई थी
  rationale: निफ़ाल क्रिया का शपथ लेना अर्थ सुरक्षित है; हिंदी वाक्य-विन्यास में प्रतिज्ञात देश, देने के उद्देश्य और पूर्वजों से खाई शपथ का संबंध स्वाभाविक बनाया गया है।
- source_word: לַאֲבֹתֶיךָ
  choice: तुम्हारे पितरों
  rationale: संज्ञा पुरुषवाचक बहुवचन है और आगे अब्राहम, इसहाक और याकूब के नाम आते हैं; ‘पितर’ इस विशिष्ट पूर्वज-संदर्भ को बनाए रखता है।
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: अब्राहम, इसहाक और याकूब
  rationale: नामों के मानक हिंदी रूप प्रयुक्त हैं; हिंदी में प्रत्येक नाम से पहले परसर्ग दोहराना आवश्यक नहीं है।
- source_word: לָתֶת לָךְ
  choice: तुम्हें देने
  rationale: उद्देश्यसूचक अनंत रूप और सर्वनामिक पूरक को संक्षिप्त, स्वाभाविक हिंदी में रखा गया है।
- source_word: עָרִים גְּדֹלֹת וְטֹבֹת
  choice: बड़े और अच्छे नगर
  rationale: גדל के आकार/महानता और טוב के अच्छाई/वांछनीयता संबंधी सामान्य अर्थ को अनावश्यक व्याख्या के बिना सुरक्षित रखा गया है।
- source_word: אֲשֶׁר לֹא בָנִיתָ
  choice: जिन्हें तुमने नहीं बनाया
  rationale: नकार सहित द्वितीय पुरुष एकवचन पूर्ण क्रिया को सीधे और सहज रूप में अनूदित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है, इसलिए इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ हिंदी पाठकों में अधिक परिचित लिप्यंतरण है, यद्यपि ‘याहवे’ संभावित उच्चारण के अधिक निकट माना जाता है।
- issue: לַאֲבֹתֶיךָ में पुरुषवाचक संबंध-संज्ञा
  choice: तुम्हारे पितरों
  alternative: तुम्हारे पूर्वजों
  rationale: मूल का पुरुषवाचक बहुवचन और तत्काल उल्लिखित अब्राहम, इसहाक और याकूब की विशिष्टता सुरक्षित रखने के लिए ‘पितरों’ चुना गया; सामान्य पाठक के लिए ‘पूर्वजों’ विकल्प पादटिप्पणी में दिया गया है।
- issue: शपथ और देने के उद्देश्य का संबंध
  choice: जिसे तुम्हें देने की शपथ उसने तुम्हारे पितरों से खाई थी
  alternative: जिसके विषय में उसने तुम्हारे पितरों से शपथ खाई थी कि वह तुम्हें देगा
  rationale: संक्षिप्त हिंदी रचना मूल के अर्थ-संबंध को व्यक्त करती है और शपथ को मात्र सामान्य वादे में नहीं बदलती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन ‘तुम’ मूल के द्वितीय पुरुष पुल्लिंग एकवचन को दर्शाता है। पद अगले पद में जारी सूची का आरंभ है, इसलिए अंत में अल्पविराम रखा गया है।
