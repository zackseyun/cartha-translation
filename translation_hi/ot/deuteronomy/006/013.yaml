base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/013.yaml
  text: You shall fear Yahweh your God[a], and him you shall serve[b], and by his name you shall swear.
translation:
  language: hi
  text: तुम अपने परमेश्वर याहवे का भय मानो[a], उसकी सेवा करो[b], और उसके नाम की शपथ खाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने परमेश्वर याहवे के प्रति श्रद्धा और विस्मय रखो’; इब्रानी क्रिया में श्रद्धामय भय और विस्मय शामिल हैं, केवल आतंक नहीं।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी आराधना करो’; इब्रानी क्रिया का सामान्य अर्थ ‘सेवा करना’ है और इस संदर्भ में आराधनापूर्ण सेवा भी शामिल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय को स्वाभाविक हिन्दी में ‘अपने परमेश्वर’ से व्यक्त किया गया है।
- source_word: תִּירָא
  choice: भय मानो
  rationale: यह क्रिया श्रद्धामय भय, विस्मय और गंभीर आदर को समेटती है; ‘भय मानो’ इसकी व्यापकता और वाचा-संबंधी गंभीरता बनाए रखता है।
- source_word: וְאֹתוֹ
  choice: उसकी
  rationale: इब्रानी में स्पष्ट कर्मवाचक सर्वनाम को हिन्दी के स्वाभाविक वाक्य-विन्यास में रखा गया है; ‘केवल’ नहीं जोड़ा गया, क्योंकि वह इस पद में प्रत्यक्ष रूप से नहीं है।
- source_word: תַעֲבֹד
  choice: सेवा करो
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है और इस धार्मिक संदर्भ में उसमें आराधनापूर्ण सेवा भी निहित है।
- source_word: וּבִשְׁמוֹ
  choice: और उसके नाम की
  rationale: शपथ के प्रसंग में ב उस नाम को दर्शाता है जिसे शपथ में प्रमाण या आधार के रूप में पुकारा जाता है; हिन्दी मुहावरे में ‘उसके नाम की शपथ’ स्वाभाविक है।
- source_word: תִּשָּׁבֵעַ
  choice: शपथ खाओ
  rationale: निफ़अल रूप का अर्थ शपथ लेना है; ‘शपथ खाओ’ वर्तमान मानक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह कर्म-चिह्न है, जिसका हिन्दी में स्वतंत्र शब्दगत समकक्ष आवश्यक नहीं है।
theological_decisions:
- issue: परमेश्वर के प्रति उचित भाव के लिए ‘भय’ को नरम करके केवल ‘श्रद्धा’ करना या नहीं
  choice: मुख्य पाठ में ‘भय मानो’
  alternative: ‘श्रद्धा रखो’ या ‘विस्मय मानो’
  rationale: इब्रानी शब्द केवल आतंक नहीं, बल्कि श्रद्धामय भय और विस्मय भी व्यक्त करता है। केवल ‘श्रद्धा’ कहने से आज्ञा की वाचा-संबंधी गंभीरता घट सकती है।
- issue: עבד का अनुवाद ‘सेवा करना’ हो या ‘आराधना करना’
  choice: ‘सेवा करो’
  alternative: ‘आराधना करो’
  rationale: ‘सेवा’ मूल शब्द की व्यापकता और व्यावहारिक वाचा-निष्ठा को बनाए रखती है, जबकि इस संदर्भ में आराधना का भाव भी निहित रहता है।
- issue: स्पष्ट सर्वनाम के आधार पर ‘केवल उसी’ जोड़ना या नहीं
  choice: ‘उसकी सेवा करो’
  alternative: ‘केवल उसी की सेवा करो’
  rationale: आस-पास का प्रसंग अनन्यता की ओर संकेत करता है, पर इस पद में ‘केवल’ के लिए अलग स्पष्ट शब्द नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और आज्ञार्थक बहुवचन/सम्मानसूचक रूप अपनाया गया है। मूल इब्रानी का संबोधन व्याकरणतः पुल्लिंग एकवचन है, पर हिन्दी में ‘तुम’ सामुदायिक पाठक के लिए स्वाभाविक है। समानांतर तीन आज्ञाओं की संक्षिप्त लय बनाए रखी गई है।
