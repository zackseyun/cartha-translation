id: DEU.6.12
reference: Deuteronomy 6:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֑ה אֲשֶׁ֧ר הוֹצִֽיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/012.yaml
  text: Be careful lest you forget Yahweh[a], who brought you out of the land of Egypt, out of the house of servants.
translation:
  language: hi
  text: सावधान रहो, कहीं तुम याहवे को भूल न जाओ, जिसने तुम्हें मिस्र देश से, दासों के घर से[a] बाहर निकाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक मुहावरेदार ढंग से, ‘दासता के घर से।’ इब्रानी में शाब्दिक रूप से ‘दासों के घर से’ है।
    reason: मִבֵּית עֲבָדִים के लिए मुहावरेदार वैकल्पिक अनुवाद; मुख्य पाठ में इब्रानी की ठोस अभिव्यक्ति रखी गई है।
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: सावधान रहना
  rationale: निफ़अल आज्ञार्थक और לְךָ मिलकर स्वयं सचेत रहने की गंभीर चेतावनी देते हैं। हिंदी में ‘सावधान रहना’ स्वाभाविक है और एकवचन संबोधन को बनाए रखता है।
- source_word: פֶּן תִּשְׁכַּח
  choice: कि तुम ... भूल न जाओ
  rationale: פֶּן आशंकित परिणाम से बचने की चेतावनी देता है। ‘कि ... भूल न जाओ’ आधुनिक हिंदी में इस नकारात्मक चेतावनी को सहज रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הוֹצִיאֲךָ
  choice: तुम्हें ... से निकाल लाया
  rationale: יצא का हिफ़ईल रूप निर्गमन के संदर्भ में ‘बाहर निकाल लाना’ है; यह हिंदी प्रयोग उस उद्धारकारी कार्य को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: मूल के אֶרֶץ ‘देश/भूमि’ को बनाए रखते हुए हिंदी का स्वाभाविक पदक्रम अपनाया गया है।
- source_word: מִבֵּית עֲבָדִים
  choice: दासों के घर से
  rationale: मूल में עֲבָדִים ठोस बहुवचन ‘दास’ है, अमूर्त ‘दासता’ नहीं। इसलिए रूपक की ठोस अभिव्यक्ति जानबूझकर सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे आया है। हिंदी पाठकों में सुस्थापित लिप्यंतरण ‘यहोवा’ नाम को नाम ही रहने देता है, उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: עֲבָדִים की ठोस या अमूर्त अभिव्यक्ति
  choice: दासों के घर से
  alternative: दासता के घर से
  rationale: इब्रानी में ठोस बहुवचन ‘दासों’ है। चुना हुआ पाठ उस ठोस भाषा और मिस्र की वास्तविक दास स्थिति को सुरक्षित रखता है; अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर किंतु सहज चेतावनी-वाक्य। ‘तुम’ मूल के पुल्लिंग एकवचन संबोधन को दर्शाता है। अंतिम पदबंध में इब्रानी की ठोस और कुछ असामान्य छवि को जानबूझकर रखा गया है।
