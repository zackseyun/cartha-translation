revisions:
- from: और वह हमें वहाँ से निकाल लाया, ताकि हमें भीतर ले आए और वह देश हमें दे, जिसके विषय में उसने हमारे पूर्वजों[a] से शपथ खाई थी।
  to: और वह हमें वहाँ से निकाल लाया, ताकि वह हमें उस देश में ले आए और हमें वह देश दे, जिसे उसने हमारे पितरों[a] को देने की शपथ खाई थी।
  rationale: 'The revision resolves the Hindi idiom and restores the source relationship: God brought Israel out in order to bring them into the land and give them the land he had sworn to give their fathers. It also retains the masculine plural wording of the Hebrew in the main text while offering the natural lexical alternative in a footnote.'
