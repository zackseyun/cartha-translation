source:
  edition: WLC
  text: וְ/אוֹתָ֖/נוּ הוֹצִ֣יא מִ/שָּׁ֑ם לְמַ֨עַן֙ הָבִ֣יא אֹתָ֔/נוּ לָ֤/תֶת לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/023.yaml
  text: And he brought us out from there[a], so that he might bring us in, to give us the land that he swore to our fathers.
translation:
  language: hi
  text: और वह हमें वहाँ से निकाल लाया, ताकि वह हमें उस देश में ले आए और हमें वह देश दे, जिसे उसने हमारे पितरों[a] को देने की शपथ खाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “हमारे पूर्वजों।” हिब्रू: “हमारे पितरों।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוֹתָנוּ הוֹצִיא מִשָּׁם
  choice: और वह हमें वहाँ से निकाल लाया
  rationale: वाक्य के आरम्भ में आए कर्म וְאוֹתָנוּ का बल सहज हिन्दी शब्दक्रम में रखते हुए, הוֹצִיא को ‘निकाल लाया’ किया गया है; इससे निर्गमन का भाव और आगे के ‘भीतर ले आए’ के साथ विरोध बना रहता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य सूचित करता है; आधुनिक हिन्दी में ‘ताकि’ संक्षिप्त और स्वाभाविक है।
- source_word: הָבִיא אֹתָנוּ
  choice: हमें भीतर ले आए
  rationale: בוא के हिफ़ील रूप में प्रवेश कराने का भाव है। ‘भीतर’ गन्तव्य में प्रवेश को स्पष्ट करता और ‘निकाल लाया’ के साथ स्रोत का विरोध सुरक्षित रखता है।
- source_word: לָתֵת לָנוּ אֶת־הָאָרֶץ
  choice: वह देश हमें दे
  rationale: נתן का सीधा अर्थ ‘देना’ और הָאָרֶץ का वाचा-सन्दर्भित अर्थ ‘वह देश’ रखा गया है; निश्चितता बताने के लिए ‘वह’ स्वाभाविक हिन्दी है।
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: जिसके विषय में उसने ... से शपथ खाई थी
  rationale: हिब्रू में शपथ का विषय भूमि है और अप्रत्यक्ष कर्म पूर्वज हैं। हिन्दी में ‘जिसके विषय में ... से शपथ खाई’ इस सम्बन्ध को स्पष्ट रखते हुए शपथ-संबंधी भाषा सुरक्षित करता है।
- source_word: לַאֲבֹתֵינוּ
  choice: हमारे पूर्वजों
  rationale: אָבוֹת बहुवचन सन्दर्भ में इस्राएल के पहले पितरों/पुरखों को सूचित करता है। ‘पूर्वजों’ आधुनिक, सम्मानपूर्ण और व्यापक रूप से बोधगम्य है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: לַאֲבֹתֵינוּ में वाचागत पूर्वजों का उल्लेख
  choice: हमारे पूर्वजों
  alternative: हमारे पितरों / हमारे पुरखों
  rationale: सन्दर्भ इस्राएल के उन पहले पूर्वजों की ओर है जिनसे भूमि की शपथ खाई गई थी। ‘पूर्वजों’ किसी विशेष व्याख्यात्मक सूची को आरोपित किए बिना सम्बन्ध को व्यक्त करता है; हिब्रू के अधिक शाब्दिक पुरुषवाची रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: נִשְׁבַּע की वाचा-शपथ भाषा
  choice: शपथ खाई थी
  alternative: प्रतिज्ञा की थी
  rationale: मूल क्रिया केवल सामान्य प्रतिज्ञा नहीं, शपथ लेने को व्यक्त करती है। ‘शपथ खाई थी’ परमेश्वर की शपथबद्ध प्रतिबद्धता का भार बनाए रखता है।
- issue: निर्गमन और प्रवेश का उद्देश्यात्मक सम्बन्ध
  choice: ताकि हमें भीतर ले आए और वह देश हमें दे
  alternative: कि वह हमें ले आए और वह देश हमें दे
  rationale: לְמַעַן स्पष्ट उद्देश्य बताता है और הָבִיא प्रवेश कराने का भाव रखता है। अनुवाद इस तनाव को बनाए रखता है कि बाहर निकालना अपने आप में अन्त नहीं, देश में पहुँचाकर उसे देना था।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किन्तु गरिमापूर्ण रखी गई है। ‘निकाल लाया—भीतर ले आए’ से हिब्रू का बाहर/अन्दर विरोध उभरता है। पादटिप्पणी चिह्न [a] मुख्य पाठ में सम्बद्ध शब्द के तुरन्त बाद दिया गया है।
