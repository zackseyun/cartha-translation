  text: וַ/יְצַוֵּ֣/נוּ יְהוָ֗ה לַ/עֲשׂוֹת֙ אֶת כָּל הַ/חֻקִּ֣ים הָ/אֵ֔לֶּה לְ/יִרְאָ֖ה אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/ט֥וֹב לָ֨/נוּ֙ כָּל הַ/יָּמִ֔ים לְ/חַיֹּתֵ֖/נוּ כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/024.yaml
  text: And the LORD commanded us to do all these statutes, to fear the LORD our God, for our good always, to keep us alive as it is this day.
translation:
  language: hi
  text: और यहोवा ने हमें इन सभी विधियों का पालन करने और अपने परमेश्वर यहोवा का भय मानने की आज्ञा दी, ताकि सदा हमारा भला हो और वह हमें जीवित रखे, जैसा कि आज के दिन है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַוֵּנוּ
  choice: हमें ... आज्ञा दी
  rationale: हिब्रू क्रिया का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: לַעֲשׂוֹת אֶת כָּל־הַחֻקִּים הָאֵלֶּה
  choice: इन सभी विधियों का पालन करने
  rationale: यहाँ עשה का आशय नियमों को केवल ‘करना’ नहीं, बल्कि उनका आचरण/पालन करना है; חֻקִּים के लिए ‘विधियाँ’ औपचारिक-कानूनी भाव बनाए रखता है।
- source_word: לְיִרְאָה אֶת־יְהוָה
  choice: यहोवा का भय मानने
  rationale: ‘भय मानना’ श्रद्धा और भय दोनों की स्रोतगत अर्थ-सीमा को बिना केवल ‘आदर’ तक सीमित किए सुरक्षित रखता है।
- source_word: לְטוֹב לָנוּ כָּל־הַיָּמִים
  choice: ताकि सदा हमारा भला हो
  rationale: उद्देश्यसूचक לְ और כָּל־הַיָּמִים का सहज हिन्दी अनुवाद; ‘सदा’ निरंतर हित का भाव देता है।
- source_word: לְחַיֹּתֵנוּ
  choice: और वह हमें जीवित रखे
  rationale: पियेल रूप का कारक अर्थ ‘हमें जीवित रखना’ स्पष्ट किया गया है; कर्ता प्रसंगानुसार यहोवा है।
- source_word: כְּהַיּוֹם הַזֶּה
  choice: जैसा कि आज है
  rationale: हिब्रू की संक्षिप्त तुलना और वर्तमान जीवित अवस्था के संदर्भ को निकटता से बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; हिन्दी बाइबल परंपरा में परिचित लिप्यंतरण इसे सामान्य उपाधि से अलग रखता है।
- issue: आज्ञापालन के उद्देश्य और फल का संबंध
  choice: ‘ताकि ... हमारा भला हो और वह हमें जीवित रखे’
  alternative: आज्ञापालन को अर्जित उद्धार या योग्यता के रूप में स्पष्ट करना
  rationale: पद स्वयं आज्ञा के हितकारी और जीवन-संरक्षक उद्देश्य को बताता है; इससे आगे कोई सांप्रदायिक कारण-व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली। वाक्य-संरचना स्वाभाविक रखी गई है, जबकि ‘विधियाँ’, ‘भय मानना’ और ‘यहोवा’ स्रोत के कानूनी तथा वाचा-संबंधी स्वर को सुरक्षित रखते हैं।
