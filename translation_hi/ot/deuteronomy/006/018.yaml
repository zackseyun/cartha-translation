source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ הַ/יָּשָׁ֥ר וְ/הַ/טּ֖וֹב בְּ/עֵינֵ֣י יְהוָ֑ה לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ וּ/בָ֗אתָ וְ/יָֽרַשְׁתָּ֙ אֶת הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/018.yaml
  text: And you shall do what is right and good in the eyes of Yahweh[a], so that it may go well for you, and you may go in and take possession of the good land that Yahweh swore to your fathers.
translation:
  language: hi
  text: और तुम वही करना जो यहोवा की दृष्टि में सही और अच्छा है, ताकि तुम्हारा भला हो और तुम उस अच्छे देश में प्रवेश करके उसे अपने अधिकार में ले सको[a], जिसे यहोवा ने तुम्हारे पितरों को देने की शपथ खाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विरासत में पाओ।” इब्रानी क्रिया का अर्थ ‘विरासत में पाना,’ ‘अधिकार रखना,’ या ‘अधिकार में लेना’ हो सकता है। यहाँ इसका अर्थ उस देश में प्रवेश करके उसे अपने अधिकार में लेना है।
    reason: וְיָרַשְׁתָּ के वैध lexical alternatives को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: और तुम वही करना
  rationale: निर्देशात्मक संदर्भ में यह रूप आगे के लिए आज्ञा का भाव रखता है; ‘करना’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट निर्देश है।
- source_word: הַיָּשָׁר וְהַטּוֹב
  choice: सही और अच्छा
  rationale: दोनों नैतिक विशेषणों को अलग रखते हुए हिन्दी की स्वाभाविक युग्म-अभिव्यक्ति अपनाई गई है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: इब्रानी मूल्यांकन-सूचक मुहावरे को प्राकृतिक हिन्दी में व्यक्त करता है और मूल बिंब को पर्याप्त रूप से बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित देवनागरी रूप द्वारा परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत किया गया है।
- source_word: לְמַעַן יִיטַב לָךְ
  choice: ताकि तुम्हारा भला हो
  rationale: उद्देश्य अथवा परिणाम और व्यापक कुशल-मंगल का भाव व्यक्त करता है; इसे केवल आर्थिक समृद्धि तक सीमित नहीं करता।
- source_word: וּבָאתָ וְיָרַשְׁתָּ
  choice: तुम जाकर ... अधिकार कर लो
  rationale: देश में प्रवेश करने और उसे अपने अधिकार में लेने की क्रमिक क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: उस अच्छे देश
  rationale: मूल के सीधे मूल्यांकन ‘अच्छा’ को बिना ‘उपजाऊ’ जैसे व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ
  choice: जिसे देने की शपथ यहोवा ने तुम्हारे पूर्वजों से खाई थी
  rationale: נשבע के शपथ-संबंधी बल को स्पष्ट रखता है; भूमि देने की बात सन्दर्भ से निहित है और हिन्दी वाक्य को पूर्ण बनाती है। ‘पूर्वजों’ से पितृपुरुषों सहित पिछली पीढ़ियों का स्वाभाविक बोध होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। आधुनिक हिन्दी पाठकों के लिए ‘यहोवा’ अधिक पहचाना हुआ देवनागरी रूप है, यद्यपि ‘याहवे’ संभावित उच्चारण के अधिक निकट माना जाता है।
- issue: לַאֲבֹתֶיךָ में पितृवाचक शब्द
  choice: तुम्हारे पूर्वजों
  alternative: तुम्हारे पितरों
  rationale: सन्दर्भ अब्राहम, इसहाक और याकूब जैसे पितृपुरुषों की ओर संकेत करता है। ‘पूर्वजों’ आधुनिक और सामान्य-बोधगम्य है; यह ऐतिहासिक वाचा-सन्दर्भ को नहीं मिटाता, जबकि ‘पितरों’ का अर्थ कुछ पाठकों के लिए धार्मिक कर्मकांड से जुड़ सकता है।
- issue: וְיָרַשְׁתָּ की अर्थ-सीमा
  choice: अधिकार कर लो
  alternative: विरासत में पाओ
  rationale: क्रिया विरासत पाने, अधिकार रखने या अधिकार में लेने का अर्थ दे सकती है। यहाँ देश में जाकर उसे ग्रहण करने की सक्रिय प्रक्रिया प्रमुख है, फिर भी विरासत का वाचागत आयाम निहित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सहज। एकवचन ‘तुम’ मूल के एकवचन सामुदायिक संबोधन को बनाए रखता है। वाक्य में अनावश्यक संस्कृतनिष्ठता से बचते हुए वाचा और शपथ की गंभीरता सुरक्षित रखी गई है।
