  yaml_path: translation/ot/deuteronomy/006/019.yaml
  text: to drive out all your enemies from before you[b][a], as Yahweh has spoken.
translation:
  language: hi
  text: तुम्हारे सभी शत्रुओं को तुम्हारे सामने से खदेड़ने के लिए[a], जैसा याहवे ने कहा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे सामने से”; यह शत्रुओं को किसी के मार्ग या उपस्थिति से हटा देने का हिब्रू मुहावरा है।
    reason: cultural_note
  - marker: b
    text: या “कहा था”; हिब्रू क्रिया का शाब्दिक अर्थ “कहा” है और यहाँ पहले कहे गए उस ईश्वरीय वचन की ओर संकेत है जो अब भी प्रभावी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַהֲדֹף
  choice: खदेड़ दे
  rationale: ल־युक्त हिफ़ील क्रियार्थक रूप पिछले वाक्य से जुड़े उद्देश्य या परिणाम को व्यक्त करता है। ‘खदेड़ दे’ शत्रुओं को बलपूर्वक मार्ग या उपस्थिति से हटाने का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: כָּל אֹיְבֶיךָ
  choice: तुम्हारे सभी शत्रुओं को
  rationale: כָּל की समग्रता और एकवचन संबोधन के द्वितीय पुरुष प्रत्यय—दोनों को स्पष्ट रूप से सुरक्षित रखता है। אֶת हिन्दी में कर्म-चिह्न ‘को’ के माध्यम से स्वाभाविक रूप से व्यक्त होता है।
- source_word: מִפָּנֶיךָ
  choice: तुम्हारे सामने से
  rationale: शाब्दिक अर्थ ‘तुम्हारे मुख/उपस्थिति से’ है। सैन्य प्रसंग में ‘तुम्हारे सामने से’ मूल बिंब और मार्ग अथवा उपस्थिति से हटाए जाने का भाव दोनों बनाए रखता है।
- source_word: כַּאֲשֶׁר
  choice: जैसा
  rationale: यह पहले कहे गए ईश्वरीय वचन के साथ अनुरूपता व्यक्त करता है और हिन्दी में संक्षिप्त तथा स्वाभाविक है।
- source_word: דִּבֶּר
  choice: कहा है
  rationale: हिब्रू पूर्ण क्रिया पूर्व में कहे गए ऐसे वचन को सूचित करती है जिसका प्रभाव बना हुआ है। हिन्दी पूर्ण वर्तमान ‘कहा है’ इस सतत प्रासंगिकता को व्यक्त करता है, जबकि ‘प्रतिज्ञा की है’ मूल क्रिया से अधिक व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी के सामान्य पाठकों के लिए ‘यहोवा’ प्रतिष्ठित और पहचानने योग्य नामरूप है; यह ‘प्रभु’ जैसी उपाधि रखकर नाम को छिपाता नहीं।
- issue: वाचा-संदर्भ में דִּבֶּר का बल
  choice: कहा है
  alternative: कहा था / प्रतिज्ञा की है
  rationale: ‘कहा है’ मूल क्रिया ‘कहना’ के निकट रहते हुए पूर्व ईश्वरीय वचन की वर्तमान वैधता का संकेत देता है। ‘कहा था’ सम्भव है पर वर्तमान प्रभाव कम सुनाई दे सकता है; ‘प्रतिज्ञा की है’ संदर्भगत अर्थ को स्पष्ट करता, पर मूल से अधिक व्याख्यात्मक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पिछले वाक्य से व्याकरणिक रूप से जुड़ा है, इसलिए आरम्भ में ‘ताकि’ रखा गया है। मूल सैन्य बिंब को नरम या संप्रदायगत व्याख्या से प्रतिस्थापित नहीं किया गया।
