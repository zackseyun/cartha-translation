source:
  edition: WLC
  text: וּ/בָ֨תִּ֜ים מְלֵאִ֣ים כָּל טוּב֮ אֲשֶׁ֣ר לֹא מִלֵּאתָ֒ וּ/בֹרֹ֤ת חֲצוּבִים֙ אֲשֶׁ֣ר לֹא חָצַ֔בְתָּ כְּרָמִ֥ים וְ/זֵיתִ֖ים אֲשֶׁ֣ר לֹא נָטָ֑עְתָּ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/011.yaml
  text: and houses full of every good thing that you did not fill[a], and hewn cisterns that you did not hew[b], vineyards and olive trees that you did not plant—and you eat and are satisfied—
translation:
  language: hi
  text: और ऐसे घर जो हर प्रकार की अच्छी वस्तुओं से भरे हैं, जिन्हें तूने नहीं भरा; चट्टान में काटे गए जलकुंड[a], जिन्हें तूने नहीं तराशा; दाख की बारियाँ और जैतून के पेड़, जिन्हें तूने नहीं लगाया—और तू खाएगा और तृप्त होगा—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कुंड’। इब्रानी शब्द यहाँ अधिक ठीक रूप से पानी जमा करने के लिए चट्टान में काटे गए जलकुंडों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘और तू खाएगा और भरपेट होगा।’ इब्रानी क्रियाएँ उस घटनाक्रम को आगे बढ़ाती हैं जो इस्राएल के देश में प्रवेश करने पर होगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָתִּים
  choice: घर
  rationale: बहुवचन संज्ञा का सीधा और स्वाभाविक हिन्दी रूप; यहाँ भौतिक संपत्ति की सूची है।
- source_word: מְלֵאִים כָּל טוּב
  choice: हर प्रकार की अच्छी वस्तुओं से भरे
  rationale: כָּל טוּב का आशय उपयोगी और मनभावनी सामग्री तथा प्रावधानों से है, केवल नैतिक भलाई से नहीं।
- source_word: אֲשֶׁר לֹא מִלֵּאתָ
  choice: जिन्हें तूने नहीं भरा
  rationale: सम्बन्धवाचक उपवाक्य और दूसरे पुरुष एकवचन को बनाए रखता है।
- source_word: בֹרֹת חֲצוּבִים
  choice: चट्टान काटकर बनाए गए जलकुंड
  rationale: בֹרֹת यहाँ पानी जमा करने के लिए चट्टान में काटे गए कुंडों को सूचित करता है; यह सामान्य कुओं से अधिक सटीक है।
- source_word: אֲשֶׁר לֹא חָצַבְתָּ
  choice: जिन्हें तूने नहीं काटा
  rationale: חצב की काटने/तराशने की छवि तथा पूर्ववर्ती कृदन्त के साथ शब्दगत संबंध सुरक्षित रहता है।
- source_word: כְּרָמִים
  choice: दाख की बारियाँ
  rationale: यह अलग-अलग बेलों के बजाय अंगूर की खेती वाले भूखंडों को दर्शाता है।
- source_word: זֵיתִים
  choice: जैतून के पेड़
  rationale: रोपण के संदर्भ में बहुवचन का स्पष्ट अर्थ जैतून के वृक्ष हैं; 'बाग' कहना अतिरिक्त सामूहिकता जोड़ता।
- source_word: אֲשֶׁר לֹא נָטָעְתָּ
  choice: जिन्हें तूने नहीं लगाया
  rationale: दोहराए गए ढाँचे और इस तथ्य को सुरक्षित रखता है कि ये संसाधन इस्राएल के अपने श्रम से उत्पन्न नहीं हुए।
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: और तू खाएगा और तृप्त होगा
  rationale: सन्दर्भ में ये क्रियाएँ देश में प्रवेश के बाद होने वाले परिणामों की शृंखला आगे बढ़ाती हैं; हिन्दी भविष्यकाल इसे स्वाभाविक और स्पष्ट बनाता है।
theological_decisions:
- issue: प्रतिज्ञात बहुतायत का स्वरूप
  choice: इस्राएल को मिले भौतिक प्रावधानों की सूची को बिना अतिरिक्त नैतिक टिप्पणी के प्रस्तुत किया गया है।
  alternative: इसी पद में चेतावनी जोड़ना अथवा इन वस्तुओं को अनुचित रूप से हथियाई हुई संपत्ति बताना।
  rationale: यह पद उन संसाधनों को गिनाता है जिन्हें इस्राएल ने स्वयं तैयार नहीं किया; स्पष्ट चेतावनी अगले पद में आती है, इसलिए उसे यहाँ पहले से नहीं जोड़ा गया।
- issue: दूसरे पुरुष का एकवचन संबोधन
  choice: पूरे पद में ‘तू’ रखा गया है।
  alternative: सामूहिक बहुवचन ‘तुम’ करना।
  rationale: इब्रानी में इस्राएल को वाचा-संबंधी प्रतिनिधिक एकवचन में संबोधित किया गया है; ‘तू’ उस व्याकरणिक और साहित्यिक विशेषता को बनाए रखता है।
- issue: अंतिम क्रियाओं का कालगत बल
  choice: ‘खाएगा और तृप्त होगा’ द्वारा भावी परिणाम व्यक्त किया गया है।
  alternative: शाब्दिक रूप-साम्य के लिए ‘खाता है और तृप्त होता है’ अथवा शर्तसूचक ‘जब तू खाए’ कहना।
  rationale: आसपास का वाक्य-विन्यास देश में प्रवेश के समय होने वाली घटनाओं को आगे बढ़ाता है। भविष्यकाल अर्थ को स्पष्ट करता है, जबकि शर्त का ऐसा भाव नहीं जोड़ता जो मूल में प्रत्यक्ष नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली अपनाई गई है। ‘जलकुंड’ की सटीकता को ‘चट्टान काटकर बनाए गए’ वाक्यांश से साधारण पाठक के लिए स्पष्ट किया गया है। अर्धविराम सूची की समानांतर संरचना दिखाते हैं और अंतिम दीर्घ विराम अगले पद से निरंतरता बनाए रखता है।
