  yaml_path: translation/ot/deuteronomy/006/008.yaml
  text: And you shall bind them as a sign on your hand[a], and they shall be as frontlets between your eyes.
translation:
  language: hi
  text: तुम इन्हें अपने हाथ पर एक चिन्ह के रूप में बाँधो, और वे तुम्हारी आँखों के बीच पट्टियों के समान हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּקְשַׁרְתָּם
  choice: तुम इन्हें ... बाँधना
  rationale: निर्देशात्मक क्रम में यह क्रिया आज्ञा का भाव रखती है। ‘बाँधना’ ठोस क्रिया को बनाए रखता है, और ‘इन्हें’ का संकेत पिछले प्रसंग में कही गई बातों की ओर है।
- source_word: לְאוֹת
  choice: एक चिन्ह के रूप में
  rationale: אוֹת का सामान्य अर्थ ‘चिन्ह’ है। यह अनुवाद प्रतीकात्मक अर्थ को सुरक्षित रखता है, पर उसका स्वरूप तय नहीं करता।
- source_word: עַל יָדֶךָ
  choice: अपने हाथ पर
  rationale: יָד का सीधा और सामान्य अर्थ ‘हाथ’ है; ‘बाँह’ कहना अधिक व्याख्यात्मक होता।
- source_word: וְהָיוּ
  choice: और ये ... हों
  rationale: यह पहले निर्देश को आगे बढ़ाता है। ‘हों’ आज्ञात्मक भाव और समानांतर वाक्य-रचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְטֹטָפֹת
  choice: माथे की पट्टियों के रूप में
  rationale: טֹטָפֹת एक दुर्लभ शब्द है और सामान्यतः माथे पर पहनी जाने वाली वस्तु के लिए समझा जाता है। ‘माथे की पट्टियाँ’ स्थान और सामान्य रूप का संकेत देता है, पर इसे बाद की किसी खास प्रथा तक सीमित नहीं करता।
- source_word: בֵּין עֵינֶיךָ
  choice: तुम्हारी आँखों के बीच
  rationale: यह इब्रानी मुहावरे का सीधा रूप है। इसे बनाए रखने से ठोस शारीरिक बिंब सुरक्षित रहता है और ‘माथे पर’ जैसी व्याख्यात्मक सामान्यीकरण से बचा जाता है।
theological_decisions:
- issue: क्या आज्ञा को शारीरिक अभ्यास, प्रतीकात्मक स्मरण, या दोनों के रूप में निश्चित किया जाए
  choice: ठोस शारीरिक भाषा को बनाए रखते हुए प्रश्न खुला रखना
  alternative: इसे केवल निरंतर स्मरण का रूपक कहना, या इसे स्पष्टतः बाद की तफ़िलीन-प्रथा से जोड़ना
  rationale: इब्रानी पाठ ठोस शारीरिक बिंब प्रस्तुत करता है, लेकिन अनुवाद स्वयं यह तय नहीं करता कि उसका आशय केवल शाब्दिक है, केवल प्रतीकात्मक है, या दोनों।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और निर्देशात्मक शैली रखी गई है। ‘तुम’ इब्रानी के एकवचन संबोधन को सहज हिन्दी में व्यक्त करता है। ‘आँखों के बीच’ की मूल छवि और दुर्लभ वस्तु-संज्ञा की अनिश्चितता सुरक्षित रखी गई है।
