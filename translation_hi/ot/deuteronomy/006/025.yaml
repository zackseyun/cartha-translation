  text: וּ/צְדָקָ֖ה תִּֽהְיֶה לָּ֑/נוּ כִּֽי נִשְׁמֹ֨ר לַ/עֲשׂ֜וֹת אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵ֖י/נוּ כַּ/אֲשֶׁ֥ר צִוָּֽ/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/025.yaml
  text: And it will be righteousness for us if we are careful to do all this commandment before Yahweh our God[b][a], as he has commanded us.
translation:
  language: hi
  text: और यदि हम याहवे, अपने परमेश्वर, के सामने इस पूरी आज्ञा[b] का सावधानी से पालन करें, जैसा उसने हमें आज्ञा दी है, तो यह हमारे लिए धार्मिकता[a] होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जो हमारे लिए उचित है’ अथवा ‘हमारे लिए न्याय।’ इब्रानी शब्द צְדָקָה उस बात का अर्थ भी दे सकता है जो सही या न्यायपूर्ण है; यहाँ ‘धार्मिकता’ वाचा-संबंधी संदर्भ के लिए सबसे उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘इस सारी आज्ञा।’ एकवचन ‘आज्ञा’ संभवतः पूरी शिक्षा को एक समग्र इकाई के रूप में दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְדָקָה
  choice: धार्मिकता
  rationale: צְדָקָה यहाँ उस स्थिति या आचरण को दर्शाता है जो परमेश्वर की दृष्टि में सही है। ‘धार्मिकता’ इसके नैतिक और वाचा-संबंधी अर्थ को बनाए रखता है; इसे केवल सामाजिक ‘न्याय’ तक सीमित नहीं करता।
- source_word: תִּהְיֶה לָּנוּ
  choice: यह हमारे लिए ... होगी
  rationale: यह विधेयात्मक इब्रानी रचना को स्वाभाविक हिन्दी में व्यक्त करता है और ‘गिनी जाएगी’ जैसी बाद की तकनीकी धर्मवैज्ञानिक शब्दावली को पाठ में नहीं जोड़ता।
- source_word: כִּי
  choice: यदि
  rationale: इस प्रसंग में כִּי उस शर्त का परिचय देता है जिसके अंतर्गत यह कथन सत्य होगा।
- source_word: נִשְׁמֹר לַעֲשׂוֹת
  choice: पालन करने में सावधानी बरतें
  rationale: שׁמר के साथ क्रियार्थक לַעֲשׂוֹת ध्यानपूर्वक करने या पालन करने का भाव देता है। यह हिन्दी में स्वाभाविक रहते हुए दोनों पदों की संयुक्त अर्थछाया व्यक्त करता है।
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: इस पूरी आज्ञा
  rationale: एकवचन מִצְוָה को बनाए रखते हुए यह आज्ञा या शिक्षा को एक समग्र इकाई के रूप में प्रस्तुत करता है।
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: याहवे हमारे परमेश्वर के सामने
  rationale: לִפְנֵי का मूल अर्थ ‘के सामने/उपस्थिति में’ है। वाक्य को स्वाभाविक बनाने के लिए हिन्दी अनुवाद में यह संबंध मुख्य उपवाक्य की संरचना में निहित है, जबकि याहवे नाम और ‘हमारे परमेश्वर’ का वाचा-संबंधी संबोधन स्पष्ट रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: जैसा ... ने हमें आज्ञा दी है
  rationale: यह पहले दी जा चुकी आज्ञा और उसके वर्तमान प्रभाव, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: वाचा के प्रति आज्ञाकारिता के संदर्भ में ‘धार्मिकता’ का अर्थ
  choice: आज्ञा का सावधानी से पालन ‘हमारे लिए धार्मिकता’ होगा—अर्थात वाचा के संदर्भ में परमेश्वर की दृष्टि में सही ठहरने या सही होने से इसका वास्तविक संबंध है।
  alternative: इसे केवल ‘न्याय’ कहना, या ‘धार्मिकता हमारे खाते में गिनी जाएगी’ जैसी तकनीकी आरोपण-संबंधी भाषा जोड़ना।
  rationale: इब्रानी पाठ आज्ञाकारिता और धार्मिकता के बीच संबंध की पुष्टि करता है, पर बाद की किसी व्यवस्थित धर्मवैज्ञानिक प्रक्रिया को स्पष्ट नहीं करता। अनुवाद इस तनाव को यथावत रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए शर्त पहले रखी गई है। ‘धार्मिकता’ धर्मवैज्ञानिक गंभीरता बनाए रखता है, और वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
