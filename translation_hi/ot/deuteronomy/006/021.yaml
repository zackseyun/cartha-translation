base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/021.yaml
  text: then you shall say to your son[a], ‘We were servants to Pharaoh in Egypt[b], and Yahweh brought us out from Egypt with a strong hand.’
translation:
  language: hi
  text: तब अपने बेटे को यह कहना[a], ‘हम मिस्र में फ़िरौन के दास थे, और याहवे हमें मिस्र से शक्तिशाली हाथ से[b] बाहर निकाल लाया।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अपने बेटे को यह कहना।” हिब्रू संयोजक का सामान्य अर्थ “और” भी हो सकता है; “तब” पिछले पद के प्रश्न और इस उत्तर के क्रम को स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “बलवन्त हाथ से।” यह हिब्रू मुहावरा याहवे के सामर्थ्यपूर्ण उद्धार-कार्य को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: तब तुम ... कहना
  rationale: पूर्ववर्ती प्रश्न के उत्तर में निर्देशात्मक क्रम को स्वाभाविक हिन्दी में व्यक्त करता है; हिब्रू वाव का सामान्य ‘और’ अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לְבִנְךָ
  choice: अपने बेटे से
  rationale: हिब्रू संज्ञा स्पष्ट रूप से पुल्लिंग एकवचन है; ‘बेटा’ उसी रूप को बनाए रखता है।
- source_word: עֲבָדִים הָיִינוּ לְפַרְעֹה
  choice: हम ... फ़िरौन के दास थे
  rationale: निर्गमन के प्रसंग में עֲבָדִים बन्धुआ दासता को दर्शाता है; सम्बन्धसूचक לְ को स्वाभाविक हिन्दी ‘फ़िरौन के’ से व्यक्त किया गया है।
- source_word: בְּמִצְרָיִם
  choice: मिस्र में
  rationale: स्थानसूचक בְּ का सीधा और स्वाभाविक अनुवाद।
- source_word: וַיּוֹצִיאֵנוּ
  choice: हमें ... बाहर निकाल लाया
  rationale: יצא के हिफ़ील रूप का अर्थ ‘बाहर ले आना/निकाल लाना’ है; यह उद्धार की पूर्ण क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षर को उपाधि से बदलने के बजाय हिन्दी में लिप्यन्तरित किया गया है।
- source_word: מִמִּצְרַיִם
  choice: मिस्र से
  rationale: מן स्रोत या प्रस्थान-बिन्दु बताता है; ‘मिस्र से’ संक्षिप्त और स्पष्ट है।
- source_word: בְּיָד חֲזָקָה
  choice: बलवन्त हाथ से
  rationale: हिब्रू रूपक को बनाए रखते हुए यह परमेश्वर के सामर्थ्यपूर्ण उद्धार-कार्य को व्यक्त करता है; ‘शक्तिशाली हाथ से’ सम्भव विकल्प है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘यहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिप्यन्तरण में सुरक्षित रखता है।
- issue: עֲבָדִים में दासता की तीव्रता
  choice: दास
  alternative: सेवक
  rationale: मिस्र और फ़िरौन के प्रसंग में यह बाध्यकारी दासता है; ‘सेवक’ उस ऐतिहासिक उत्पीड़न को अनावश्यक रूप से हल्का कर सकता है।
- issue: בְּיָד חֲזָקָה का रूपक
  choice: बलवन्त हाथ से
  alternative: शक्तिशाली हाथ से
  rationale: ‘हाथ’ को हटाकर केवल ‘सामर्थ्य से’ कहना मूल बिंब मिटा देता; चुना हुआ रूपक सामर्थ्यपूर्ण हस्तक्षेप का भाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, मौखिक निर्देश के अनुकूल शैली रखी गई है। ‘दास’ ऐतिहासिक बन्धन को स्पष्ट करता है, और ‘बलवन्त हाथ’ मूल हिब्रू बिंब को समझने योग्य हिन्दी में बनाए रखता है।
