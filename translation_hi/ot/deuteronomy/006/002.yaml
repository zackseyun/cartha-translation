base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/002.yaml
  text: so that you may fear Yahweh your God[a], by keeping all his statutes and his commandments that I am commanding you—you and your son and your grandson—all the days of your life[c][b], and so that your days may be prolonged.
translation:
  language: hi
  text: ताकि तुम यहोवा, अपने परमेश्वर, का भय मानो[a] और उसकी सारी विधियों और आज्ञाओं का पालन करो, जिनकी मैं तुम्हें आज्ञा दे रहा हूँ—तुम, तुम्हारा बेटा और तुम्हारे बेटे का बेटा[b]—अपने जीवन के सभी दिनों में; और ताकि तुम्हारे दिन लंबे हों[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा, अपने परमेश्वर, के प्रति श्रद्धा और विस्मय रखो।” इब्रानी क्रिया में भय के साथ श्रद्धा और विस्मय का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तुम, तुम्हारा बेटा और तुम्हारे बेटे का बेटा”; अर्थात तीन पीढ़ियाँ।
    reason: clarification
  - marker: c
    text: या “तुम्हारी आयु लंबी हो।” शाब्दिक रूप से, “तुम्हारे दिन लंबे हों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן תִּירָא
  choice: ताकि तुम ... का भय मानो
  rationale: לְמַעַן उद्देश्य या परिणाम सूचित करता है और ירא परमेश्वर के प्रति भय, श्रद्धा और विस्मय के अर्थ समेटे हुए है। ‘भय मानो’ इस वाचाई और धर्मवैज्ञानिक तनाव को बनाए रखता है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा
  rationale: यहोवा व्यक्तिगत दिव्य नाम को लिप्यंतरित करता है; ‘अपने परमेश्वर’ द्वितीय पुरुष एकवचन और वाचाई संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִשְׁמֹר
  choice: पालन करो
  rationale: यह क्रिया विधियों और आज्ञाओं को सावधानी से मानने का भाव देती है। हिन्दी में ‘पालन करना’ इस संदर्भ में स्वाभाविक है और भय मानने के व्यावहारिक रूप को स्पष्ट करता है।
- source_word: חֻקֹּתָיו וּמִצְוֺתָיו
  choice: उसकी ... विधियों और आज्ञाओं
  rationale: ‘विधियाँ’ और ‘आज्ञाएँ’ दो इब्रानी संज्ञाओं का भेद बनाए रखते हुए सुबोध वाचाई भाषा प्रदान करती हैं।
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּךָ
  choice: जिन्हें मैं तुम्हें दे रहा हूँ
  rationale: מְצַוֶּה वर्तमान भाषण-स्थिति में आज्ञा दिए जाने को व्यक्त करता है। हिन्दी में ‘आज्ञाएँ ... दे रहा हूँ’ स्वाभाविक है और वर्तमानगत बल बनाए रखता है।
- source_word: אַתָּה וּבִנְךָ וּבֶן בִּנְךָ
  choice: तुम, तुम्हारा बेटा और तुम्हारे बेटे का बेटा
  rationale: मूल पाठ की तीन पीढ़ियों और ‘बेटे का बेटा’ की स्पष्ट पुरुष-संतान भाषा को सामान्यीकृत किए बिना बनाए रखता है।
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: अपने जीवन भर
  rationale: ‘तुम्हारे जीवन के सब दिन’ का स्वाभाविक आधुनिक हिन्दी समतुल्य है।
- source_word: וּלְמַעַן יַאֲרִכֻן יָמֶיךָ
  choice: और ताकि तुम्हारे दिन लंबे हों
  rationale: दूसरे उद्देश्य/परिणाम खंड और ‘दिन लंबे होना’ की इब्रानी अभिव्यक्ति को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुराक्षरी व्यक्तिगत नाम है। ‘यहोवा’ हिन्दी में परिचित लिप्यंतरण है और नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: परमेश्वर के प्रति ירא का अर्थ
  choice: भय मानो
  alternative: श्रद्धा रखो
  rationale: यह क्रिया भय के साथ श्रद्धा और विस्मय भी समेट सकती है। मुख्य पाठ में ‘भय’ रखने से मूल की धर्मवैज्ञानिक तीक्ष्णता बनी रहती है; व्यापक अर्थ पादटिप्पणी में बताया गया है।
- issue: आज्ञापालन और परमेश्वर के भय का संबंध
  choice: भय मानो और ... पालन करो
  alternative: पालन करने के द्वारा भय मानो
  rationale: इब्रानी infinitive לִשְׁמֹר भय मानने के उद्देश्य से जुड़ा है और उसके व्यावहारिक निर्वाह या साधन को इंगित कर सकता है। हिन्दी में संयोजन संबंध को खुला रखता है और उसे केवल साधन तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। एकवचन ‘तुम’ मूल के 2ms संबोधन को बनाए रखता है। ‘विधियाँ’ और ‘आज्ञाएँ’ वाचाई शब्दावली का भेद रखती हैं; मुख्य पाठ में दिव्य नाम ‘यहोवा’ प्रयुक्त है।
