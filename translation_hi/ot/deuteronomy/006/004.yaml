base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/004.yaml
  text: 'Hear[a], Israel: Yahweh our God, Yahweh is one.'
translation:
  language: hi
  text: 'सुनो, हे इस्राएल: याहवे हमारा परमेश्वर है, याहवे एक है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे ही हमारा परमेश्वर है, केवल याहवे ही”; अथवा, “याहवे हमारा परमेश्वर एक ही याहवे है।” इब्रानी कथन अत्यंत संक्षिप्त है और उसकी वाक्य-रचना के एक से अधिक सम्भव अर्थ हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: सुनो
  rationale: एकवचन आज्ञार्थक रूप पूरे इस्राएल को सामूहिक रूप से संबोधित करता है। ‘सुनो’ सुनने और बात पर ध्यान देकर मानने—दोनों भावों को स्वाभाविक आधुनिक हिन्दी में व्यक्त कर सकता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: वाचा के लोगों का व्यक्तिवाचक नाम; हिन्दी में प्रचलित बाइबलीय लिप्यंतरण रखा गया है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के निजी नाम को उपाधि से बदलने के बजाय देवनागरी में उसका निकट लिप्यंतरण किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारा परमेश्वर
  rationale: रूप की बाहरी बहुवचन-सदृश बनावट के बावजूद इस वाचिक संदर्भ में यह इस्राएल के परमेश्वर के लिए एकवचन पद है; प्रथम पुरुष बहुवचन प्रत्यय ‘हमारा’ से व्यक्त किया गया है।
- source_word: אֶחָד
  choice: एक
  rationale: मूल संख्यात्मक/विशेषणात्मक अर्थ ‘एक’ है। ‘केवल’ या ‘अकेला’ को मुख्य पाठ में रखने से एक सम्भव व्याख्या निर्णायक हो जाती; ‘एक’ मूल की संक्षिप्तता और धार्मिक तनाव बनाए रखता है।
theological_decisions:
- issue: शेमा के अंतिम पदबंध की वाक्य-रचना और अर्थ
  choice: यहवे हमारा परमेश्वर है, यहवे एक है
  alternative: यहवे हमारा परमेश्वर है, केवल यहवे; अथवा, यहवे हमारा परमेश्वर एक ही यहवे है
  rationale: इब्रानी में स्पष्ट संयोजक क्रिया न होने के कारण एक से अधिक वाक्य-विन्यास सम्भव हैं। मुख्य पाठ पारम्परिक एकेश्वरवादी उद्घोष को न्यूनतम विस्तार के साथ रखता है, जबकि वैकल्पिक विशिष्टतावादी और संयुक्त वाक्य-विन्यास को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘हे इस्राएल’ सम्बोधन को स्पष्ट करता है; ‘यहवे’ निजी नाम को सुरक्षित रखता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
