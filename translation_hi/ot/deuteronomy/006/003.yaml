source:
  edition: WLC
  text: וְ/שָׁמַעְתָּ֤ יִשְׂרָאֵל֙ וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת אֲשֶׁר֙ יִיטַ֣ב לְ/ךָ֔ וַ/אֲשֶׁ֥ר תִּרְבּ֖וּ/ן מְאֹ֑ד כַּ/אֲשֶׁר֩ דִּבֶּ֨ר יְהוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֨י/ךָ֙ לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/003.yaml
  text: So hear[a], Israel, and be careful to do it, that it may go well with you and that you may multiply greatly, just as Yahweh, the God of your fathers, has spoken to you[b], in a land flowing with milk and honey.
translation:
  language: hi
  text: इसलिए, हे इस्राएल, सुन और उनका पालन करने की सावधानी रख, ताकि तेरा भला हो और तुम बहुत बढ़ जाओ, ठीक जैसा याहवे, तेरे पितरों[a] के परमेश्वर ने तुझसे कहा था[b], उस देश में जो दूध और मधु से बहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे पूर्वजों के परमेश्वर।” इब्रानी में शाब्दिक अर्थ “तेरे पिताओं” है।
    reason: lexical_alternative
  - marker: b
    text: या, “ठीक जैसा याहवे, तेरे पितरों के परमेश्वर ने तुझसे प्रतिज्ञा की थी—एक ऐसा देश जो दूध और मधु से बहता है।” इब्रानी वाक्य-विन्यास संक्षिप्त है; अंतिम देश-वाक्यांश को याहवे की कही हुई बात की विषय-वस्तु भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: सुन
  rationale: शׁמע के ‘सुनना’, ‘ध्यान देना’ और ‘आज्ञा मानना’ जैसे अर्थ हो सकते हैं। यहाँ ‘सुन’ मूल शब्द को बनाए रखता है, जबकि आगे की ‘करने में सावधानी’ आज्ञाकारिता का भाव स्पष्ट करती है।
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: इन बातों को करने में सावधानी बरत
  rationale: שׁמר और עשה का मेल ध्यानपूर्वक पालन करके कार्य में उतारने का भाव देता है। ‘इन बातों’ को संदर्भ से स्पष्टता के लिए जोड़ा गया है।
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: ताकि तेरा भला हो
  rationale: यह व्यवस्थाविवरण में प्रचलित हितसूचक मुहावरा है; हिंदी में ‘तेरा भला हो’ सहज और व्यापक है।
- source_word: וַאֲשֶׁר תִּרְבּוּן מְאֹד
  choice: और तुम बहुत अधिक बढ़ जाओ
  rationale: רבה यहाँ मुख्यतः जनसंख्या में बड़ी वृद्धि को दर्शाता है। इब्रानी में इस क्रिया का बहुवचन रूप है; इसलिए हिंदी में ‘तुम’ रखा गया है, यद्यपि आसपास इस्राएल को एक सामूहिक इकाई मानकर एकवचन संबोधन है।
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: ठीक जैसा ... ने तुझसे कहा था
  rationale: דבר का मूल अर्थ ‘कहना/बोलना’ है। ‘वादा किया था’ संदर्भानुकूल है, पर मुख्य पाठ में उसे रखकर अर्थ को आवश्यकता से अधिक निश्चित नहीं किया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: तेरे पुरखाओं के परमेश्वर
  rationale: ‘पुरखा’ आधुनिक हिंदी में समझ में आने वाला और मूल के पुरुषवाची बहुवचन ‘पिताओं’ का स्वाभाविक समतुल्य है।
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: उस देश में जिसमें दूध और मधु की धाराएँ बहती हैं
  rationale: यह प्रतिज्ञात देश का स्थापित वर्णन है। ‘धाराएँ बहती हैं’ प्रचुरता का रूपक बनाए रखता है और हिंदी में स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। लिप्यंतरण नाम और उपाधि के बीच का भेद सुरक्षित रखता है।
- issue: אֱלֹהֵי אֲבֹתֶיךָ में पुरुषवाची संबंध-संज्ञा
  choice: तेरे पुरखाओं के परमेश्वर
  alternative: तेरे पूर्वजों के परमेश्वर
  rationale: ‘पुरखाओं’ से मूल का स्पष्ट पुरुषवाची रूप बना रहता है; अधिक समावेशी ‘पूर्वजों’ को पाठ में चुपचाप प्रतिस्थापित नहीं किया गया।
- issue: अंतिम देश-वाक्यांश का वाक्य-संबंध
  choice: वृद्धि और भलाई के स्थान के रूप में—‘उस देश में...’
  alternative: याहवे की कही हुई प्रतिज्ञा की विषय-वस्तु के रूप में—‘...ने तुझसे एक ऐसे देश का वादा किया था...’
  rationale: इब्रानी वाक्य-विन्यास संक्षिप्त है और दोनों संबंध संभव हैं। मुख्य पाठ तत्काल प्रवाह के अनुसार स्थानसूचक संबंध रखता है, जबकि वैकल्पिक समझ को पाद-टिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल किंतु गरिमापूर्ण संबोधन रखा गया है। इस्राएल के लिए इब्रानी में एकवचन ‘सुन/तेरा/तुझसे’ और बीच में बहुवचन ‘तुम ... बढ़ जाओ’ का तनाव जानबूझकर सुरक्षित रखा गया है। ‘इन बातों’ संदर्भगत पूर्ति है।
