  text: לֹ֣א תֵֽלְכ֔וּ/ן אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים מֵ/אֱלֹהֵי֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר סְבִיבוֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/014.yaml
  text: You shall not go after other gods[a], the gods of the peoples who are around you.
translation:
  language: hi
  text: तुम अपने आस-पास के लोगों के देवताओं में से किसी भी दूसरे देवता के पीछे न चलना[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक मुहावरेदार रूप में: “तुम अपने आस-पास के लोगों के देवताओं में से किसी दूसरे देवता का अनुसरण न करना।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֵלְכוּן
  choice: तुम ... न चलना
  rationale: निषेध के साथ प्रयुक्त क़ाल अपूर्णकाल द्वितीय पुरुष बहुवचन को आधुनिक हिन्दी की स्पष्ट निषेधात्मक आज्ञा के रूप में व्यक्त किया गया है।
- source_word: אַחֲרֵי
  choice: के पीछे
  rationale: הלך के साथ यह मुहावरा किसी का अनुसरण करने और उसके प्रति निष्ठा रखने का भाव देता है। ‘पीछे चलना’ हिब्रानी बिंब को बनाए रखते हुए हिन्दी में भी समझ में आता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह इस्राएल के परमेश्वर के अतिरिक्त अन्य देवताओं को सूचित करता है। ‘पराए देवता’ की अपेक्षा ‘दूसरे देवता’ मूल के אֲחֵרִים का अधिक सीधा अनुवाद है।
- source_word: מֵאֱלֹהֵי
  choice: देवताओं में से किसी
  rationale: उपसर्ग מִן यहाँ अंशवाचक अर्थ रखता है। ‘में से किसी’ उस भाव को स्वाभाविक हिन्दी में स्पष्ट करता है, बिना इसे केवल समानाधिकरण मानकर छोड़ देने के।
- source_word: הָעַמִּים
  choice: लोगों
  rationale: עַמִּים का अर्थ यहाँ आसपास रहने वाले जनसमूह हैं। ‘लोगों’ सामान्य आधुनिक हिन्दी में सहज है और अनावश्यक राजनीतिक अर्थ वाले ‘राष्ट्रों’ से बचता है।
- source_word: אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: तुम्हारे आस-पास के
  rationale: यह आसपास बसे पड़ोसी लोगों को सूचित करता है; संक्षिप्त विशेषणात्मक रचना हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: ‘पीछे चलने’ के निषेध का स्वरूप
  choice: अन्य देवताओं का अनुसरण करने या उनके प्रति धार्मिक निष्ठा रखने का वाचा-संबंधी निषेध
  alternative: केवल उनके मंदिरों की ओर शारीरिक रूप से जाने का निषेध
  rationale: व्यवस्थाविवरण में הלך אחרי नियमित रूप से अनुसरण और धार्मिक निष्ठा का मुहावरा है। मुख्य पाठ मूल बिंब को बनाए रखता है और उसे सीधे ‘उपासना करना’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- issue: מֵאֱלֹהֵי का संबंध
  choice: आसपास के लोगों के देवताओं के समूह में से किसी को भी ‘दूसरे देवताओं’ में शामिल बताना
  alternative: इसे केवल ‘दूसरे देवता, अर्थात् आसपास के लोगों के देवता’ के समानाधिकरण के रूप में प्रस्तुत करना
  rationale: מִן का अंशवाचक बल ‘में से किसी’ द्वारा संरक्षित है; वाक्य का निषेध स्वाभाविक हिन्दी में ‘किसी ... भी नहीं’ से स्पष्ट होता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘के पीछे चलना’ मूल हिब्रानी मुहावरे और उसकी धार्मिक निष्ठा की ध्वनि को सुरक्षित रखता है; पादटिप्पणी अधिक मुहावरेदार हिन्दी विकल्प देती है।
