  yaml_path: translation/ot/deuteronomy/006/006.yaml
  text: And these words that I am commanding you today shall be on your heart[a].
translation:
  language: hi
  text: और ये वचन, जिनकी आज मैं तुम्हें आज्ञा देता हूँ, तुम्हारे हृदय पर रहें[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुम्हारे हृदय में रहें।’ इब्रानी में शाब्दिक रूप से ‘तुम्हारे हृदय पर’ है—यह इन वचनों को अपने भीतरी जीवन में निरंतर रखने का बिम्ब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: बने रहें
  rationale: यह रूप पिछले आदेशात्मक संदर्भ में अपेक्षा/आज्ञा का भाव रखता है। ‘बने रहें’ निरंतर आंतरिक उपस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ये वचन
  rationale: דְּבָרִים का मूल अर्थ ‘शब्द/वचन’ है और यहाँ यह अभी दिए जा रहे आदेशों की बात करता है; ‘वचन’ गरिमापूर्ण और सहज है तथा ‘आज्ञाएँ’ की अपेक्षा मूल रूप को अधिक निकटता से रखता है।
- source_word: אֲשֶׁר
  choice: जिन्हें
  rationale: बहुवचन ‘वचन’ से जुड़ने वाला स्वाभाविक हिन्दी सम्बन्धवाचक रूप।
- source_word: אָנֹכִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम में हल्का बल हो सकता है, पर हिन्दी में ‘मैं’ पर्याप्त है; ‘मैं स्वयं’ कहना अनावश्यक अतिशयोक्ति होती।
- source_word: מְצַוְּךָ
  choice: तुम्हें दे रहा हूँ
  rationale: सन्दर्भ में आशय वचनों को आज्ञा के रूप में देने का है। केवल ‘आज्ञा दे रहा हूँ’ के साथ ‘वचन’ का सम्बन्ध हिन्दी में कुछ असहज पड़ता है; यह चयन वर्तमान भाषण-क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: मूसा के वर्तमान सम्बोधन की तात्कालिकता का सीधा और आधुनिक हिन्दी समतुल्य।
- source_word: עַל לְבָבֶךָ
  choice: तुम्हारे हृदय पर
  rationale: עַל का सीधा अर्थ ‘पर’ है। यह चयन इब्रानी बिम्ब को बनाए रखता है, जबकि मुहावरे का आशय वचनों को अपने भीतरी जीवन में निरंतर सँजोए रखना है।
theological_decisions:
- issue: לְבָב का मानव-आन्तरिकता सम्बन्धी मुहावरा
  choice: हृदय
  alternative: मन; अंतर्मन
  rationale: इब्रानी ‘हृदय’ विचार, इच्छा और भाव—तीनों को समेट सकता है। ‘हृदय’ रखने से बाइबलीय बिम्ब सुरक्षित रहता है और अर्थ केवल बुद्धि तक सीमित नहीं होता।
- issue: עַל לְבָבֶךָ में सम्बन्धसूचक बिम्ब
  choice: हृदय पर
  alternative: हृदय में
  rationale: ‘पर’ मूल इब्रानी संरचना और उसके तनाव को सुरक्षित रखता है; ‘में’ अधिक सहज हिन्दी है, पर मूल बिम्ब को चुपचाप बदल देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। एकवचन सम्बोधन ‘तुम’ रखा गया है। ‘हृदय पर’ मूल इब्रानी बिम्ब को बचाता है और पादटिप्पणी उसका स्वाभाविक हिन्दी विकल्प स्पष्ट करती है।
