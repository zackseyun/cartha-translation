  text: כִּ֣י אֵ֥ל קַנָּ֛א יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/קִרְבֶּ֑/ךָ פֶּן יֶ֠חֱרֶה אַף יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/ךְ וְ/הִשְׁמִ֣ידְ/ךָ֔ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/015.yaml
  text: for Yahweh your God in your midst is a jealous God[b][a], lest the anger of Yahweh your God burn against you and he destroy you from the face of the earth.
translation:
  language: hi
  text: क्योंकि तुम्हारे बीच में तुम्हारा परमेश्वर याहवे जलन रखने वाला परमेश्वर है[a]; कहीं ऐसा न हो कि तुम्हारे परमेश्वर याहवे का क्रोध तुम पर भड़क उठे और वह तुम्हें धरती पर से मिटा डाले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने लिए अनन्य भक्ति चाहने वाला परमेश्वर।” हिब्रू शब्द परमेश्वर के उस अनन्य वाचा-दावे पर बल देता है कि उसके लोग किसी प्रतिद्वंद्वी देवता की उपासना न करें।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “धरती के मुख के ऊपर से”; यह पूरी तरह हटा दिए जाने का हिब्रू मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद के निषेध का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक कारणसूचक संयोजक है।
- source_word: אֵל קַנָּא
  choice: जलन रखनेवाला परमेश्वर
  rationale: यह पदबंध प्रतिद्वंद्वी उपासना को अस्वीकार करने वाले परमेश्वर के अनन्य वाचा-दावे को व्यक्त करता है। ‘जलन’ मूल की संबंधपरक तीव्रता और धर्मवैज्ञानिक तनाव बनाए रखती है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुर्वर्णी दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में उसके व्यक्तिगत वाचा-नाम का लिप्यंतरण किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: यह द्वितीय पुरुष एकवचन प्रत्यययुक्त रूप है; हिन्दी में सीधा और स्पष्ट अनुवाद।
- source_word: בְּקִרְבֶּךָ
  choice: तुम्हारे बीच
  rationale: यह इस्राएली समुदाय के मध्य परमेश्वर की उपस्थिति बताता है; ‘तुम्हारे भीतर’ जैसी केवल व्यक्तिगत समझ से बचाता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: संभावित दण्ड की गंभीर चेतावनी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יֶחֱרֶה אַף
  choice: क्रोध ... भड़क उठे
  rationale: हिब्रू के जलने या प्रज्वलित होने के रूपक को सुबोध हिन्दी में सुरक्षित रखता है।
- source_word: בָּךְ
  choice: तुम पर
  rationale: क्रोध के संदर्भ में यह विरोधी दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִשְׁמִידְךָ
  choice: और वह तुम्हें ... मिटा डाले
  rationale: हिफ़ील रूप पूर्ण विनाश या हटाए जाने का प्रबल भाव देता है; ‘मिटा डाले’ हिन्दी में उसी कठोर परिणाम को व्यक्त करता है।
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: धरती पर से
  rationale: हिब्रू मुहावरे ‘भूमि के मुख के ऊपर से’ का स्वाभाविक हिन्दी रूप, जो पूर्णतः हटा दिए जाने का अर्थ देता है।
theological_decisions:
- issue: परमेश्वर की קַנָּא विशेषता का अनुवाद
  choice: जलन रखनेवाला परमेश्वर
  alternative: उत्साही परमेश्वर
  rationale: ‘जलन’ परमेश्वर के अनन्य वाचा-दावे और प्रतिद्वंद्वी उपासना के प्रति उसकी असहिष्णुता को बनाए रखती है। इसे केवल ‘उत्साही’ कहना संबंधपरक और धर्मवैज्ञानिक तनाव को कमजोर कर सकता है।
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; उसका लिप्यंतरण वाचा-नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। द्वितीय पुरुष एकवचन ‘तुम’ मूल के सामूहिक एकवचन संबोधन को बनाए रखता है। ‘जलन’ के संभावित गलत अर्थ को पादटिप्पणी में स्पष्ट किया गया है, मुख्य पाठ में धर्मवैज्ञानिक तनाव हटाया नहीं गया।
