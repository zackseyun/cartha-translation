base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/001.yaml
  text: This is the commandment—the statutes and the judgments—that Yahweh your God commanded to teach you[a], so that you may do them in the land into which you are crossing[c][b], to possess it.
translation:
  language: hi
  text: यह आज्ञा है[a]—वे विधियाँ और न्याय-विधान—जिन्हें तुम्हारे परमेश्वर याहवे[b] ने तुम्हें सिखाने की आज्ञा दी, ताकि तुम उस देश में उनका पालन करो, जिसे अपने अधिकार में लेने[c] के लिए तुम पार जा रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और यह आज्ञा है।” आरंभिक संयोजक का अनुवाद “और” किया जा सकता है; “न्याय-विधान” का अनुवाद “विधि-विधान” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “याहवे” इब्रानी ईश्वरीय नाम YHWH का लिप्यंतरण है; अनेक अनुवाद इसकी जगह “प्रभु” लिखते हैं।
    reason: alternative_reading
  - marker: c
    text: या, “अपने अधिकार में लेने” अथवा “विरासत में पाने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: यह ... है
  rationale: आरंभिक וְ पिछले प्रसंग से संबंध जोड़ता है, पर आधुनिक हिन्दी में यहाँ अनिवार्य रूप से ‘और’ कहना असहज है; वैकल्पिक रूप पादटिप्पणी में रखा गया है।
- source_word: הַמִּצְוָה
  choice: आज्ञा
  rationale: एकवचन को बनाए रखा गया है; यह आगे आने वाली बहुवचन विधियों और न्याय-विधानों के सामूहिक शीर्षक के रूप में कार्य करता है।
- source_word: הַחֻקִּים
  choice: विधियाँ
  rationale: यह निश्चित रूप से ठहराए गए विधान या नियमों का कानूनी-वाचायी भाव व्यक्त करता है।
- source_word: וְהַמִּשְׁפָּטִים
  choice: और न्याय-विधान
  rationale: מִשְׁפָּטִים के न्यायिक तथा वैधानिक दोनों पहलुओं को व्यक्त करते हुए इसे חֻקִּים से अलग रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत वाचायी नाम YHWH का हिन्दी लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: לְלַמֵּד אֶתְכֶם
  choice: तुम्हें सिखाने की आज्ञा दी
  rationale: हिब्रू में आज्ञा पाने वाला व्यक्ति स्पष्ट नहीं किया गया है; हिन्दी वाक्य भी उसे जोड़े बिना सिखाने के उद्देश्य को बनाए रखता है।
- source_word: לַעֲשׂוֹת
  choice: उनका पालन करो
  rationale: शाब्दिक ‘उन्हें करो’ की अपेक्षा हिन्दी में विधियों और न्याय-विधानों के संबंध में ‘पालन करना’ स्वाभाविक है और क्रियान्वयन का आशय सुरक्षित रखता है।
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: जिसमें तुम ... पार जा रहे हो
  rationale: चल रही और निकट भविष्य की प्रवेश-क्रिया तथा गंतव्य की दिशा दोनों व्यक्त होते हैं।
- source_word: לְרִשְׁתָּהּ
  choice: अधिकार करने
  rationale: यरश का भूमि पर अधिकार प्राप्त करने/उसे अपने अधिकार में लेने का सक्रिय भाव संक्षेप में व्यक्त होता है।
theological_decisions:
- issue: एकवचन ‘आज्ञा’ और बहुवचन ‘विधियाँ और न्याय-विधान’ का संबंध
  choice: एकवचन को सामूहिक शीर्षक रखकर बहुवचन पदों को ‘अर्थात्’ द्वारा उसका स्पष्टीकरण बनाया गया
  alternative: ‘आज्ञाओं, विधियों और न्याय-विधानों’ के रूप में सबको बहुवचन करना
  rationale: मूल पाठ की संख्या-संबंधी विशिष्टता और उसके सारांश-फिर-विस्तार वाले तनाव को बनाए रखा गया है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु अथवा यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है; इसलिए उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण रखा गया है।
- issue: लְלַמֵּד में आज्ञा पाने वाले का अनुल्लेख
  choice: आज्ञा पाने वाले व्यक्ति का नाम या सर्वनाम नहीं जोड़ा गया
  alternative: ‘मुझे तुम्हें सिखाने की आज्ञा दी’
  rationale: प्रसंग से मूसा समझे जा सकते हैं, पर इस पद के हिब्रू में कर्म स्पष्ट नहीं है; उसे जोड़ना वास्तविक व्याकरणिक अस्पष्टता को हल कर देता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कानूनी-वाचायी भाव के लिए ‘विधियाँ’ और ‘न्याय-विधान’ प्रयुक्त हैं। ‘अर्थात्’ हिन्दी में एकवचन सामूहिक शीर्षक और उसके बहुवचन विस्तार के बीच व्याकरणिक संबंध स्पष्ट करता है, बिना संख्या-भेद मिटाए।
