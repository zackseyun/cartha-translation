language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שָׁמ֣וֹר תִּשְׁמְר֔וּ/ן אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/עֵדֹתָ֥י/ו וְ/חֻקָּ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/017.yaml
  text: You shall diligently keep the commandments of Yahweh your God[a], and his testimonies and his statutes[b], which he has commanded you.
translation:
  language: hi
  text: तुम अपने परमेश्वर यहोवा की आज्ञाओं, उसके साक्ष्यों और उसकी विधियों का बड़ी सावधानी से पालन करना, जिनकी आज्ञा उसने तुम्हें दी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמוֹר תִּשְׁמְרוּן
  choice: पूरी लगन से पालन करना
  rationale: इनफिनिटिव ऐब्सोल्यूट के साथ अपूर्ण क्रिया आज्ञा को बल देती है। यह अभिव्यक्ति उस जोर को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: מִצְוֺת
  choice: आज्ञाओं
  rationale: यह शब्द आदेश के रूप में दिए गए वाचा-संबंधी दायित्वों को सूचित करता है; ‘आज्ञाएँ’ कानूनी और धार्मिक संदर्भ दोनों में स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित लिप्यंतरण द्वारा परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: सर्वनामयुक्त बहुवचन रूप का अर्थ ‘तुम्हारे परमेश्वर’ है; ‘अपने परमेश्वर यहोवा’ हिन्दी में वाचा-सूत्र को सहजता से व्यक्त करता है।
- source_word: עֵדֹתָיו
  choice: चितौनियों
  rationale: यह वाचा के उन निर्देशों को दर्शाता है जो साक्षी या प्रमाण का काम करते हैं। ‘चितौनियाँ’ पारंपरिक बाइबलीय कानूनी भेद बनाए रखती है, जबकि पादटिप्पणी अन्य संभावित अर्थ स्पष्ट करती है।
- source_word: חֻקָּיו
  choice: विधियों
  rationale: यह निर्धारित और स्थापित नियमों को दर्शाता है। ‘विधियाँ’ ‘आज्ञाओं’ और ‘चितौनियों’ से इसका शब्दगत भेद बनाए रखती है।
- source_word: אֲשֶׁר צִוָּךְ
  choice: जिन्हें उसने तुम्हें दिया है
  rationale: सापेक्ष उपवाक्य तीनों कानूनी पदों को सामूहिक रूप से संबोधित करता है। हिन्दी में ‘दिया है’ आज्ञा देने के आशय और वर्तमान वाचा-बाध्यता को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के लिए स्थापित रूप ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है; ‘याहवे’ अधिक प्रत्यक्ष शैक्षिक लिप्यंतरण है।
- issue: עֵדֹתָיו का कानूनी-वाचागत अर्थ
  choice: चितौनियों
  alternative: वाचा की शर्तों / साक्षियों
  rationale: आस-पास के ‘आज्ञाओं’ और ‘विधियों’ से शब्दगत भेद रखते हुए वाचा-संबंधी निर्देश का अर्थ दिया गया है; इसकी सटीक अर्थ-सीमा पादटिप्पणी में खुली रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी। वाक्य में बलयुक्त इब्रानी आज्ञा को ‘पूरी लगन से’ द्वारा व्यक्त किया गया है। तीन निकटवर्ती कानूनी शब्दों का भेद ‘आज्ञाएँ, चितौनियाँ और विधियाँ’ के रूप में सुरक्षित रखा गया है।
