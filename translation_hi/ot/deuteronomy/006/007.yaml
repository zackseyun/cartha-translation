base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/007.yaml
  text: You shall teach them diligently to your sons[a], and you shall speak of them when you sit in your house, and when you walk on the road, and when you lie down[b], and when you rise.
translation:
  language: hi
  text: तू अपने बेटों को उन्हें बार-बार सिखाना[a], और उनके विषय में बात करना—जब तू अपने घर में बैठे, जब रास्ते पर चले, जब लेटे और जब उठे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें मन में गहराई से बैठाना।” इब्रानी क्रिया का मूल अर्थ “पैना करना” है; यहाँ वह बार-बार और सावधानी से शिक्षा देने के लिए रूपक के रूप में प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנַּנְתָּם
  choice: उन्हें ... बार-बार सिखाना
  rationale: שׁנן का मूल बोध ‘पैना करना’ है; यहाँ रूपकतः बातों को पुनरावृत्ति और सावधानी से मन में बैठाने की शिक्षा है। ‘बार-बार सिखाना’ इस गहन और दोहराए जाने वाले शिक्षण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְבָנֶיךָ
  choice: अपने बेटों को
  rationale: בנים का रूप स्पष्टतः पुल्लिंग बहुवचन ‘बेटे’ है। मुख्य पाठ स्रोत की लैंगिक विशिष्टता बनाए रखता है; व्यापक पारिवारिक आशय टिप्पणी में बताया गया है।
- source_word: וְדִבַּרְתָּ בָּם
  choice: उनकी चर्चा करना
  rationale: דבר के साथ בָּם का स्वाभाविक अर्थ ‘उनके विषय में बोलना’ है। ‘उनकी चर्चा करना’ आधुनिक हिन्दी में सहज है और केवल शब्दों को दुहराने के बजाय उनके विषय में बातचीत का भाव रखता है।
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: जब तू अपने घर में बैठा हो
  rationale: בְּ के साथ infinitive construct समय अथवा परिस्थिति बताता है। यह अनुवाद नियमित घरेलू प्रसंग को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: जब मार्ग पर चलता हो
  rationale: דרך का अर्थ ‘मार्ग/रास्ता’ है। ‘मार्ग पर चलता हो’ स्रोत की गति और स्थान दोनों को संक्षेप में सुरक्षित रखता है।
- source_word: וּבְשָׁכְבְּךָ
  choice: जब लेटता हो
  rationale: यह लेटने, विशेषकर विश्राम अथवा सोने के लिए लेटने, का समय सूचित करता है। ‘जब लेटता हो’ मूल की संक्षिप्तता और सामान्यता बनाए रखता है।
- source_word: וּבְקוּמֶךָ
  choice: जब उठता हो
  rationale: यह उठने, विशेषतः नींद से उठने, को सूचित करता है और ‘जब लेटता हो’ के साथ मूल का युग्म सुरक्षित रखता है।
theological_decisions:
- issue: वाचा-संबंधी शिक्षा में लैंगिक रूप से विशिष्ट संतान-संज्ञा
  choice: अपने बेटों को
  alternative: अपने बच्चों को
  rationale: इब्रानी पाठ में पुल्लिंग बहुवचन ‘तेरे बेटे’ है। इसलिए मुख्य पाठ उसी रूप को रखता है; साथ ही पादटिप्पणी यह स्पष्ट करती है कि इस पारिवारिक शिक्षा का प्रभाव व्यापक घराने तक पहुँचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। पूरे अनुच्छेद के एकवचन संबोधन को दिखाने के लिए ‘तू’ रखा गया है; यह यहाँ अनौपचारिक असम्मान नहीं, बल्कि इब्रानी के एकवचन प्रत्यक्ष संबोधन का निकट रूप है। ‘बेटों’ स्रोत की स्पष्ट पुल्लिंग संज्ञा को सुरक्षित रखता है।
