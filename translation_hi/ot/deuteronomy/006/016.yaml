base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/016.yaml
  text: You shall not test Yahweh your God[b][a], as you tested him at Massah.
translation:
  language: hi
  text: अपने परमेश्वर यहवे की परीक्षा मत लेना,[a] जैसे तुमने मस्सा में उसकी परीक्षा ली थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “तुम अपने परमेश्वर यहवे को कसौटी पर मत रखना।”'
    reason: lexical_alternative
  - marker: b
    text: मस्सा वह स्थान था जहाँ इस्राएल ने जंगल में यहवे की परीक्षा ली थी (निर्गमन 17:1–7)। “मस्सा” नाम का संबंध “परीक्षा लेना” शब्द से है।
    reason: cross_reference
lexical_decisions:
- source_word: לֹא תְנַסּוּ
  choice: परीक्षा न लेना
  rationale: לֹא के साथ पिएल अपूर्णकाल बहुवचन निषेध व्यक्त करता है। आधुनिक मानक हिन्दी में ‘परीक्षा न लेना’ स्वाभाविक है और किसी को प्रमाण देने के लिए कसौटी पर रखने का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित ध्वन्यात्मक रूप ‘यहवे’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय ‘तुम्हारे’ का अर्थ देता है; निषेधात्मक हिन्दी वाक्य में ‘तुम अपने परमेश्वर’ अधिक स्वाभाविक है।
- source_word: כַּאֲשֶׁר
  choice: जैसे
  rationale: यह पहले घटित ऐतिहासिक कार्य के साथ सीधी तुलना स्थापित करता है।
- source_word: נִסִּיתֶם
  choice: तुमने … परीक्षा ली थी
  rationale: उसी मूल נסה की पुनरावृत्ति को ‘परीक्षा’ दोहराकर सुरक्षित रखा गया है; पूर्ण क्रिया का पूर्वकालिक संदर्भ ‘ली थी’ से स्पष्ट होता है।
- source_word: בַּמַּסָּה
  choice: मस्सा में
  rationale: यह स्थान-नाम है, इसलिए मुख्य पाठ में इसका लिप्यंतरण किया गया है; नाम और ‘परीक्षा’ के शब्द-संबंध की व्याख्या पादटिप्पणी में है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहवे’ उसे नाम के रूप में सुरक्षित रखता है, जबकि ‘प्रभु’ उसे एक उपाधि से बदल देता।
- issue: נסה का अर्थ
  choice: परीक्षा लेना
  alternative: परखना; कसौटी पर रखना
  rationale: ‘परीक्षा लेना’ उस चेतावनी को सुरक्षित रखता है जिसमें लोग परमेश्वर से अपनी शर्तों पर प्रमाण माँगते हैं, पर मुख्य पाठ में घटना की व्याख्या जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- issue: मस्सा और निर्गमन 17 के संकेत को स्पष्ट करना
  choice: मुख्य पाठ में केवल ‘मस्सा में’ रखना
  alternative: मस्सा अर्थात परीक्षा के स्थान में
  rationale: इब्रानी में स्थान-नाम ही है। उसका अर्थ और ऐतिहासिक प्रसंग पादटिप्पणी में देना मूल और व्याख्या के बीच अंतर बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन-सामूहिक ‘तुम’ के साथ मूल के बहुवचन संबोधन का अर्थ स्वाभाविक हिन्दी में व्यक्त हुआ है। दोनों बार נסה के लिए एक ही पदावली रखकर मूल का शब्द-संबंध सुरक्षित किया गया है।
