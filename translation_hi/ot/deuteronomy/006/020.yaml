  text: כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֑ר מָ֣ה הָ/עֵדֹ֗ת וְ/הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/020.yaml
  text: When your son asks you in time to come[a], saying[b], ‘What are the testimonies and the statutes and the judgments that Yahweh our God commanded you?’
translation:
  language: hi
  text: जब भविष्य में तुम्हारा बेटा तुमसे पूछे[a], ‘वे साक्षियाँ, विधियाँ और न्याय-विधान क्या हैं, जिन्हें याहवे, हमारे परमेश्वर, ने तुम्हें मानने की आज्ञा दी है?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भविष्य में’ का शाब्दिक अर्थ ‘कल’ है; यहाँ यह आगे आने वाले समय के लिए मुहावरे के रूप में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ यह शब्द अपेक्षित भावी परिस्थिति प्रस्तुत करता है; इसलिए शर्तसूचक ‘यदि’ की अपेक्षा ‘जब’ अधिक उपयुक्त है।
- source_word: יִשְׁאָלְךָ
  choice: तुमसे पूछे
  rationale: सरल, स्वाभाविक हिन्दी में क्रिया और एकवचन संबोधन दोनों सुरक्षित रहते हैं।
- source_word: בִנְךָ
  choice: तुम्हारा बेटा
  rationale: इब्रानी पद स्पष्ट रूप से पुल्लिंग एकवचन है; अतः इसे लिंग-निरपेक्ष नहीं किया गया।
- source_word: מָחָר
  choice: भविष्य में
  rationale: शाब्दिक अर्थ ‘कल’ है, पर यहाँ मुहावरे के रूप में आगे आने वाले समय का बोध कराता है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष प्रश्न में समाहित
  rationale: इब्रानी ‘यह कहते हुए’ प्रश्न की विषयवस्तु प्रस्तुत करता है; हिन्दी में अलग से ‘कहकर’ जोड़ना अनावश्यक और अस्वाभाविक होगा।
- source_word: מָה
  choice: क्या हैं
  rationale: स्रोत के सीधे प्रश्न को सुरक्षित रखा गया है; ‘इनका अर्थ क्या है’ निहित भाव को स्पष्ट तो करता, पर मूल में उपस्थित नहीं है।
- source_word: הָעֵדֹת
  choice: साक्षियाँ
  rationale: यह वाचा-संबंधी गवाही देने वाले निर्देशों का विशिष्ट कानूनी पद है और अगले दो पदों से इसका भेद बनाए रखता है।
- source_word: הַחֻקִּים
  choice: विधियाँ
  rationale: निर्धारित नियमों के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता और त्रिपदी का भेद बनाए रखता है।
- source_word: הַמִּשְׁפָּטִים
  choice: न्याय-विधान
  rationale: कानूनी निर्णयों और न्यायसंगत नियमों की छाया को सुरक्षित रखता है तथा सामान्य ‘नियम’ में अर्थ को समतल नहीं करता।
- source_word: יְהוָה
  choice: यहवे
  rationale: ईश्वरीय व्यक्तिगत नाम को उपाधि से प्रतिस्थापित न करके हिन्दी में प्रचलित निकट लिप्यंतरण दिया गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन स्वामित्व और वाचागत संबंध दोनों सीधे व्यक्त होते हैं।
- source_word: צִוָּה ... אֶתְכֶם
  choice: तुम लोगों को मानने की आज्ञा दी है
  rationale: אֶתְכֶם बहुवचन है, जिसे ‘तुम लोगों को’ स्पष्ट करता है। ‘मानने की’ हिन्दी में आज्ञा की स्वाभाविक पूर्ति है, यद्यपि स्रोत में क्रिया का कर्म सीधे विधानों का समूह है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; इसलिए उसे उपाधि ‘प्रभु’ से नहीं बदला गया। ‘यहवे’ स्रोत उच्चारण के निकट आधुनिक हिन्दी लिप्यंतरण है।
- issue: בִנְךָ का लिंग
  choice: तुम्हारा बेटा
  alternative: तुम्हारी संतान
  rationale: मूल पद पुल्लिंग एकवचन है, इसलिए उसकी विशिष्टता सुरक्षित रखी गई है।
- issue: कानूनी त्रिपदी का भेद
  choice: साक्षियाँ, विधियाँ और न्याय-विधान
  alternative: आज्ञाएँ, नियम और कानून
  rationale: तीनों इब्रानी संज्ञाओं को एक सामान्य कानूनी अर्थ में मिला देने के बजाय उनके अलग-अलग पारंपरिक और अर्थगत पक्ष सुरक्षित रखे गए हैं।
- issue: מָה में निहित प्रश्न
  choice: क्या हैं
  alternative: इनका अर्थ क्या है
  rationale: मूल पाठ केवल ‘क्या’ पूछता है। व्याख्यात्मक अर्थ संभव है, पर उसे मुख्य पाठ में अनिवार्य बनाना वास्तविक अस्पष्टता को घटाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। एकवचन ‘तुम्हारा/तुमसे’ और बहुवचन ‘तुम लोगों को’ का अंतर मूल पाठ के वचन-भेद को स्पष्ट करता है। कानूनी त्रिपदी को तकनीकी गरिमा सहित रखा गया है, किंतु अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
