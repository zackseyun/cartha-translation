  text: तुम उन्हें अपने घर की चौखटों पर और अपने फाटकों पर लिखना।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “द्वार के खंभों पर।” इब्रानी शब्द विशेष रूप से द्वार के दोनों ओर के खड़े भागों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने फाटकों के खंभों पर” अथवा “अपने फाटकों के पास।” इब्रानी शब्द फाटक, उसके प्रवेश-क्षेत्र या प्रवेश की संरचना को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: तुम उन्हें ... लिखना
  rationale: संयोजक उपसर्ग सहित काल रूप यहाँ आज्ञात्मक क्रम में निर्देश व्यक्त करता है। ‘उन्हें’ प्रत्यय को स्पष्ट रखता है और पिछले प्रसंग के वचनों की ओर संकेत करता है। आधुनिक हिंदी में ‘लिखना’ सीधा और स्वाभाविक निर्देश है।
- source_word: עַל
  choice: पर
  rationale: यह पूर्वसर्ग लिखने के स्थान को दर्शाता है; ‘पर’ इसका स्वाभाविक हिंदी समतुल्य है।
- source_word: מְזוּזֹת
  choice: चौखटों
  rationale: यह शब्द प्रवेश-द्वार के खड़े पार्श्व-स्तंभों को दर्शाता है। सामान्य हिंदी में ‘चौखट’ सबसे सुबोध विकल्प है, यद्यपि वह कभी-कभी पूरे द्वार-ढाँचे के लिए भी प्रयुक्त होता है।
- source_word: בֵּיתֶךָ
  choice: अपने घर की
  rationale: ‘घर’ בַּיִת के ठोस, घरेलू और संरचनात्मक अर्थ को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: וּבִשְׁעָרֶיךָ
  choice: और अपने फाटकों पर
  rationale: שַׁעַר किसी संपत्ति, बस्ती या परिसर के प्रवेश-फाटक अथवा उसके प्रवेश-क्षेत्र को दर्शा सकता है। ‘फाटकों’ बहुवचन को बनाए रखता है और पहले खंड के समान लिखने का स्थान स्पष्ट करता है।
