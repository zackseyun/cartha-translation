  yaml_path: translation/ot/deuteronomy/006/005.yaml
  text: And you shall love Yahweh your God with all your heart and with all your soul and with all your might[a][b].
translation:
  language: hi
  text: और तुम अपने परमेश्वर यहोवा से अपने पूरे हृदय से, अपने पूरे प्राण[a] से, और अपनी पूरी सामर्थ्य[b] से प्रेम करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी ‘प्राण’ (नेफ़ेश) का अर्थ ‘जीवन’ या ‘स्वयं’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी ‘सामर्थ्य’ (मेओद) का शाब्दिक संबंध ‘बहुतायत’ से है और यह शक्ति, तीव्रता या साधनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: और ... प्रेम करना
  rationale: संयोजक वाव के साथ द्वितीय पुरुष एकवचन पूर्ण क्रिया इस विधिक-उपदेशात्मक संदर्भ में आज्ञार्थक बल रखती है। आधुनिक हिन्दी में अनंत क्रिया-रूप ‘प्रेम करना’ इस आदेश को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: यहाँ रूप बहुवचन-जैसा होने पर भी प्रत्यय और संदर्भ इस्राएल के एक परमेश्वर को सूचित करते हैं। ‘अपने’ हिन्दी में कर्ता से संबंध स्वाभाविक रूप से दिखाता है।
- source_word: בְּכָל
  choice: अपने सारे ... के साथ
  rationale: हर पद के साथ दोहराया गया בְּכָל सम्पूर्ण समर्पण पर बल देता है; हिन्दी में ‘अपने सारे/अपनी सारी ... के साथ’ उसी पुनरुक्ति और साधनात्मक भाव को सुरक्षित रखता है।
- source_word: לְבָבְךָ
  choice: अपने सारे हृदय
  rationale: לֵבָב मन, इच्छा और भाव सहित भीतरी व्यक्ति को दर्शा सकता है। ‘हृदय’ अर्थ को केवल भावना या केवल बुद्धि तक सीमित नहीं करता।
- source_word: נַפְשְׁךָ
  choice: अपने सारे प्राण
  rationale: נֶפֶשׁ का अर्थ प्राण, जीवन, स्वयं या जीवित व्यक्ति हो सकता है। ‘प्राण’ हिन्दी में व्यक्ति के जीवित अस्तित्व का व्यापक भाव रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: מְאֹדֶךָ
  choice: अपनी सारी सामर्थ्य
  rationale: מְאֹד मूलतः ‘बहुतायत’ से जुड़ा शब्द है और यहाँ संज्ञात्मक रूप में सम्पूर्ण क्षमता, तीव्रता या साधनों का बोध करा सकता है। ‘सामर्थ्य’ हिन्दी में इस व्यापक बल को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- issue: हृदय, प्राण और सामर्थ्य के मानवशास्त्रीय पद
  choice: हृदय ... प्राण ... सामर्थ्य
  alternative: मन ... जीवन ... शक्ति
  rationale: ये इब्रानी पद व्यक्ति की कठोरता से अलग-अलग परिभाषित क्षमताएँ नहीं, बल्कि परस्पर व्याप्त और समग्र पहलू हैं। अनुवाद उनकी त्रिपदी संरचना और अर्थगत तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रेम करना’ आज्ञार्थक विधान का स्वाभाविक हिन्दी रूप है। समानांतर ‘अपने सारे/अपनी सारी’ को दोहराकर मूल की सम्पूर्णता और लय सुरक्षित रखी गई है।
