language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן יְהוָ֡ה אוֹתֹ֣ת וּ֠/מֹפְתִים גְּדֹלִ֨ים וְ/רָעִ֧ים בְּ/מִצְרַ֛יִם בְּ/פַרְעֹ֥ה וּ/בְ/כָל בֵּית֖/וֹ לְ/עֵינֵֽי/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/022.yaml
  text: And Yahweh gave great and grievous signs and wonders in Egypt[a], against Pharaoh and against all his house[b], before our eyes.
translation:
  language: hi
  text: और यहोवा ने हमारी आँखों के सामने मिस्र में[a], फ़िरौन और उसके सारे घराने पर, बड़े-बड़े और विनाशकारी चिन्ह और अद्भुत काम किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मिस्र पर।” इब्रानी संबंधबोधक शब्द स्थान (“में”) या प्रभावित लक्ष्य (“पर”)—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: किए
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘दिया’ है, पर ‘चिन्ह और अद्भुत काम दिए’ हिन्दी में अस्वाभाविक है। इस इब्रानी प्रयोग का स्वाभाविक और अर्थ-संगत हिन्दी रूप ‘किए’ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ रखा गया है।
- source_word: אוֹתֹת וּמֹפְתִים
  choice: चिन्ह और अद्भुत काम
  rationale: ‘चिन्ह’ संकेतात्मक अर्थ को और ‘अद्भुत काम’ विस्मयकारी दैवी कृत्यों को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גְּדֹלִים וְרָעִים
  choice: बड़े-बड़े और विनाशकारी
  rationale: गुणवाचक शब्द दोनों संज्ञाओं से संबंधित हैं। ‘विनाशकारी’ רָעִים के हानिकारक और विपत्तिपूर्ण प्रभाव को व्यक्त करता है, उसे नैतिक बुराई कहे बिना।
- source_word: בְּמִצְרַיִם
  choice: मिस्र में
  rationale: בְ का सीधा स्थानवाचक अर्थ यहाँ संभव और स्वाभाविक है; आगे फ़िरौन और उसके घराने के साथ प्रयुक्त समान संबंधबोधक रूप लक्ष्य या प्रभावित पक्ष का भाव देता है।
- source_word: בְּפַרְעֹה וּבְכָל־בֵּיתוֹ
  choice: फ़िरौन और उसके सारे घराने पर
  rationale: इस प्रसंग में फ़िरौन और उसका घराना इन दैवी कृत्यों से प्रभावित लक्ष्य हैं। ‘पर’ हिन्दी में यह संबंध सहज रूप से व्यक्त करता है।
- source_word: לְעֵינֵינוּ
  choice: हमारी आँखों के सामने
  rationale: यह इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है और प्रत्यक्षदर्शिता पर बल बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत नाम है। हिन्दी पाठकों के लिए स्थापित लिप्यंतरण ‘यहोवा’ नाम को नाम के रूप में सुरक्षित रखता है; उपाधि ‘प्रभु’ मूल के भेद को मिटा देती।
- issue: וְרָעִים द्वारा दैवी कृत्यों का वर्णन
  choice: विनाशकारी
  alternative: भयंकर / बुरे
  rationale: यहाँ शब्द मिस्र पर पड़े घातक या विपत्तिपूर्ण प्रभाव को बताता है। ‘बुरे’ से नैतिक बुराई का अनावश्यक अर्थ निकल सकता है, जबकि ‘विनाशकारी’ प्रसंगगत तीव्रता को बनाए रखता है।
- issue: मिस्र से पहले בְ का अर्थ
  choice: मिस्र में
  alternative: मिस्र पर / मिस्र के विरुद्ध
  rationale: स्थानवाचक अर्थ व्याकरणतः सीधा है और प्रसंग में पूर्णतः उपयुक्त है। फिर भी लक्ष्यवाचक अर्थ संभव होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘घराना’ यहाँ भवन नहीं, फ़िरौन के परिवार और राजपरिवार से जुड़े लोगों का व्यापक समूह दर्शाता है। विशेषणों को ‘चिन्ह और अद्भुत काम’ के बाद रखने के बजाय हिन्दी की स्वाभाविक शब्दावली के अनुसार पहले रखा गया है।
