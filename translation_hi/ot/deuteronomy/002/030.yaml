  text: וְ/לֹ֣א אָבָ֗ה סִיחֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַעֲבִרֵ֖/נוּ בּ֑/וֹ כִּֽי הִקְשָׁה֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת רוּח֗/וֹ וְ/אִמֵּץ֙ אֶת לְבָב֔/וֹ לְמַ֛עַן תִּתּ֥/וֹ בְ/יָדְ/ךָ֖ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/030.yaml
  text: But Sihon king of Heshbon was not willing to let us pass through his land[a], because Yahweh your God had hardened his spirit and made his heart stubborn, in order to give him into your hand, as it is this day.
translation:
  language: hi
  text: परन्तु हेशबोन का राजा सीहोन हमें अपने देश में से होकर जाने देने को तैयार नहीं हुआ, क्योंकि तुम्हारे परमेश्वर यहोवा ने उसकी आत्मा को कठोर कर दिया और उसके हृदय को हठी बना दिया[a], ताकि उसे तुम्हारे हाथ में सौंप दे, जैसा आज है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके हृदय को दृढ़ कर दिया।” हिब्रू क्रिया का अर्थ ‘दृढ़ करना’ या ‘बलवान करना’ हो सकता है, पर यहाँ प्रसंग में हठी बनाने का भाव सम्भावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: तैयार नहीं हुआ
  rationale: यह क्रिया इच्छा अथवा सहमति न होने को व्यक्त करती है; यह सहज हिन्दी में आन्तरिक अनिच्छा को बनाए रखती है।
- source_word: הַעֲבִרֵנוּ בּוֹ
  choice: हमें अपने देश में से होकर जाने देने
  rationale: हिफ़ील रूप अनुमति देने का भाव रखता है और בּוֹ प्रसंग में सीहोन के भूभाग की ओर संकेत करता है; इसलिए स्पष्ट और स्वाभाविक हिन्दी में ‘अपने देश में से’ कहा गया है।
- source_word: הִקְשָׁה ... אֶת רוּחוֹ
  choice: उसकी आत्मा को कठोर कर दिया
  rationale: ‘आत्मा’ को बनाए रखते हुए हिब्रू के ‘कठोर करना’ अर्थ और उसके धर्मवैचारिक भार को सीधे व्यक्त किया गया है।
- source_word: וְאִמֵּץ אֶת לְבָבוֹ
  choice: उसके हृदय को हठी बना दिया
  rationale: אָמַץ का मूल भाव दृढ़ या बलवान करना है, पर इस प्रसंग में वह सीहोन के अड़ियल प्रतिरोध को सूचित करता है; ‘हठी’ प्रसंगगत अर्थ बताता है और पिछले ‘कठोर’ से भेद भी रखता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणाम का बोध कराने वाला स्वाभाविक हिन्दी संयोजक है।
- source_word: תִּתּוֹ בְיָדְךָ
  choice: उसे तुम्हारे हाथ में कर दे
  rationale: हिब्रू मुहावरे में किसी को दूसरे के अधिकार में सौंपना निहित है; यह हिन्दी अभिव्यक्ति ‘हाथ’ की मूल उपमा को बनाए रखती है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा आज दिखाई देता है
  rationale: यह व्यवस्थाविवरणीय मुहावरा वर्तमान में प्रत्यक्ष स्थिति की ओर संकेत करता है; चुना हुआ रूप अर्थ को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: परमेश्वर द्वारा कठोर किया जाना और मनुष्य की अनिच्छा
  choice: सीहोन की अपनी अनिच्छा और यहोवा द्वारा उसकी आत्मा तथा हृदय को कठोर/हठी किए जाने—दोनों कथनों को स्पष्ट रूप से बनाए रखा गया है।
  alternative: परमेश्वर को केवल कठोरता की अनुमति देते हुए दिखाना, या केवल सीहोन के स्वयं कठोर होने पर बल देना।
  rationale: हिब्रू पाठ मानवीय अनिच्छा और परमेश्वर के सक्रिय कठोर करने—दोनों को साथ रखता है; अनुवाद इस धर्मवैचारिक तनाव को हल्का या एकतरफ़ा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘परन्तु’, ‘हृदय’ और ‘आत्मा’ जैसे पारम्परिक किन्तु आज भी समझे जाने वाले बाइबलीय शब्द रखे गए हैं; वाक्यरचना को अनावश्यक रूप से संस्कृतनिष्ठ नहीं बनाया गया।
