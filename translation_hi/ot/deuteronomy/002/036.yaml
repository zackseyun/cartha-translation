source:
  edition: WLC
  text: מֵֽ/עֲרֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנֹ֜ן וְ/הָ/עִ֨יר אֲשֶׁ֤ר בַּ/נַּ֨חַל֙ וְ/עַד הַ/גִּלְעָ֔ד לֹ֤א הָֽיְתָה֙ קִרְיָ֔ה אֲשֶׁ֥ר שָׂגְבָ֖ה מִמֶּ֑/נּוּ אֶת הַ/כֹּ֕ל נָתַ֛ן יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/פָנֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/036.yaml
  text: From Aroer[a], which is on the edge of the Arnon Valley, and the city that is in the valley, as far as Gilead, there was no town too high for us; Yahweh our God gave all of it before us.
translation:
  language: hi
  text: अर्नोन घाटी के किनारे बसे अरोएर से और घाटी के भीतर के नगर से लेकर गिलाद तक कोई भी नगर हमारी पहुँच से बाहर नहीं था[a]; याहवे हमारे परमेश्वर ने यह सब हमारे अधिकार में दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कोई नगर हमारे लिए बहुत ऊँचा नहीं था।” यहाँ ऊँचाई रक्षात्मक सामर्थ्य या अगम्यता का रूपक है; अनुवाद “कोई नगर हमारे लिए बहुत शक्तिशाली नहीं था” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֲרֹעֵר
  choice: अरोएर से
  rationale: उपसर्ग מ geographic सीमा के आरंभ-बिंदु को सूचित करता है; ‘अरोएर से’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׂפַת נַחַל אַרְנֹן
  choice: अर्नोन घाटी के किनारे
  rationale: שָׂפָה का मूल अर्थ ‘होंठ/किनारा/तट’ है और נַחַל यहाँ घाटी अथवा वादी को दर्शाता है; चुना हुआ रूप स्थलाकृति को सरल आधुनिक हिन्दी में रखता है।
- source_word: וְהָעִיר אֲשֶׁר בַּנַּחַל
  choice: और घाटी के भीतर के नगर से
  rationale: वाव को साधारण ‘और’ के रूप में रखा गया है; हिन्दी में भौगोलिक विस्तार स्पष्ट करने के लिए साझा परसर्ग ‘से लेकर’ दोनों स्थानों पर लागू होता है, बिना इब्रानी में दूसरा מ मान लेने के।
- source_word: וְעַד הַגִּלְעָד
  choice: गिलाद तक
  rationale: עַד भौगोलिक विस्तार के अंतिम बिंदु को दर्शाता है।
- source_word: קִרְיָה
  choice: नगर
  rationale: यह शब्द नगर अथवा बस्ती को सूचित कर सकता है; ‘नगर’ संदर्भ के गढ़वाले आबादी-केंद्रों के लिए उपयुक्त और सहज है।
- source_word: שָׂגְבָה מִמֶּנּוּ
  choice: हमारी पहुँच से बाहर
  rationale: शाब्दिक ऊँचाई यहाँ रक्षात्मक दृढ़ता या अगम्यता का रूपक है; मुख्य पाठ में उसका प्रासंगिक अर्थ दिया गया है और शाब्दिक रूपक पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֶת־הַכֹּל
  choice: यह सब
  rationale: एकवचन सामूहिक अभिव्यक्ति पूरे वर्णित क्षेत्र और उसके नगरों की समग्रता को सूचित करती है।
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: याहवे हमारे परमेश्वर
  rationale: व्यक्तिगत वाचा-नाम יהוה को ‘याहवे’ और אֱלֹהֵינוּ को स्वाभाविक रूप से ‘हमारे परमेश्वर’ अनूदित किया गया है।
- source_word: לְפָנֵינוּ
  choice: हमारे अधिकार में
  rationale: विजय के प्रसंग में ‘हमारे सामने देना’ वस्तुओं या स्थानों को विजेताओं के वश में सौंपने का मुहावरा है; हिन्दी में उसका आशय स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में टेट्राग्रामटन व्यक्तिगत नाम के रूप में आया है; ‘याहवे’ उस वाचा-नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: विजय में परमेश्वर की भूमिका
  choice: याहवे ने यह सब हमारे अधिकार में दे दिया
  alternative: हमने यह सब जीत लिया
  rationale: मूल वाक्य विजय का निर्णायक कर्ता याहवे को बताता है; अनुवाद इसी दावे को बनाए रखता है और केवल मानवीय सैन्य सफलता के रूप में नहीं ढालता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण गद्य अपनाया गया है। भौगोलिक क्रम को एक प्रवाही वाक्य में रखा गया है; दुर्बोध इब्रानी रूपक का अर्थ मुख्य पाठ में और उसका शाब्दिक स्वरूप पादटिप्पणी में दिया गया है।
