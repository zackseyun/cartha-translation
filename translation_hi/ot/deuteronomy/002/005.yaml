  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תִּתְגָּר֣וּ בָ֔/ם כִּ֠י לֹֽא אֶתֵּ֤ן לָ/כֶם֙ מֵֽ/אַרְצָ֔/ם עַ֖ד מִדְרַ֣ךְ כַּף רָ֑גֶל כִּֽי יְרֻשָּׁ֣ה לְ/עֵשָׂ֔ו נָתַ֖תִּי אֶת הַ֥ר שֵׂעִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/005.yaml
  text: Do not provoke them[a], for I will not give you any of their land, not even enough to set the sole of a foot on[c][b], because I have given Mount Seir to Esau as a possession.
translation:
  language: hi
  text: उनसे झगड़ा मत मोल लेना, क्योंकि मैं उनके देश में से तुम्हें कुछ भी नहीं दूँगा—पाँव का तलवा रखने भर की जगह भी नहीं। क्योंकि मैंने सेईर पर्वत एसाव को अधिकार के रूप में दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתְגָּרוּ בָם
  choice: उनसे झगड़ा न मोल लेना
  rationale: हित्पएल रूप और ב के साथ यह अभिव्यक्ति शत्रुतापूर्ण टकराव भड़काने या उसमें उलझने का बोध देती है। यह हिंदी प्रयोग युद्ध तक अर्थ को सीमित किए बिना जानबूझकर संघर्ष आरंभ करने की मनाही स्पष्ट करता है।
- source_word: לֹא אֶתֵּן לָכֶם מֵאַרְצָם
  choice: मैं उनके देश में से तुम्हें कुछ भी नहीं दूँगा
  rationale: 'מִן का अंशवाचक भाव सुरक्षित रखा गया है: उनके भूभाग का कोई भी अंश इस्राएल को नहीं मिलेगा।'
- source_word: עַד מִדְרַךְ כַּף רָגֶל
  choice: पाँव का तलवा रखने भर की जगह भी नहीं
  rationale: मूल की देहात्मक छवि बनाए रखते हुए मुहावरे का आशय व्यक्त किया गया है कि भूमि का अत्यंत छोटा अंश भी नहीं दिया जाएगा।
- source_word: יְרֻשָּׁה
  choice: अधिकार में
  rationale: यहाँ शब्द ईश्वर द्वारा दिए गए स्थायी भू-अधिकार या संपत्ति का बोध देता है। ‘अधिकार में’ सहज हिंदी है; ‘विरासत के रूप में’ भी संभव है।
- source_word: לְעֵשָׂו
  choice: एसाव को
  rationale: सम्प्रदान कारक भूमि के दान के प्राप्तकर्ता को दर्शाता है; नाम का प्रचलित हिंदी लिप्यंतरण रखा गया है।
- source_word: הַר שֵׂעִיר
  choice: सेईर पर्वत
  rationale: शाब्दिक भौगोलिक पद रखा गया है, जो संदर्भ में सेईर के पर्वतीय क्षेत्र को भी सूचित कर सकता है।
theological_decisions:
- issue: एदोम के भूभाग का ईश्वरीय आवंटन
  choice: इस्राएल को संघर्ष से इसलिए रोका गया है कि परमेश्वर ने सेईर एसाव को दिया है।
  alternative: इसे केवल एक राजनीतिक निषेध समझना।
  rationale: दोनों כִּי उपवाक्य निषेध का आधार परमेश्वर के भूमि-वितरण में रखते हैं; अनुवाद इस कारण-संबंध को बिना अतिरिक्त धर्मवैज्ञानिक विस्तार के बनाए रखता है।
- issue: יְרֻשָּׁה का अर्थ
  choice: अधिकार में
  alternative: विरासत के रूप में
  rationale: दोनों अर्थ संभव हैं। इस प्रसंग में भूभाग पर प्रदत्त अधिकार प्रमुख है, पर वंशगत विरासत की अर्थछाया को नकारा नहीं गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। वचन में कोई पादटिप्पणी आवश्यक नहीं मानी गई; वास्तविक अर्थ-विकल्पों को निर्णय-सूची में दर्ज किया गया है।
