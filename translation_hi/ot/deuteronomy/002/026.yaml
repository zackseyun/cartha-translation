  edition: WLC
  text: וָ/אֶשְׁלַ֤ח מַלְאָכִים֙ מִ/מִּדְבַּ֣ר קְדֵמ֔וֹת אֶל סִיח֖וֹן מֶ֣לֶךְ חֶשְׁבּ֑וֹן דִּבְרֵ֥י שָׁל֖וֹם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/026.yaml
  text: So I sent messengers from the wilderness of Kedemoth to Sihon king of Heshbon with words of peace[a], saying,
translation:
  language: hi
  text: 'तब मैंने कदेमोत के निर्जन प्रदेश से हेशबोन के राजा सीहोन के पास शांति की बातें[a] कहने के लिए दूत भेजे:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शांति का प्रस्ताव।” इब्रानी में शाब्दिक रूप से “शांति की बातें” है—यह शांतिपूर्ण राजनयिक पहल के लिए प्रयुक्त अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: तब मैंने ... भेजे
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रमसूचक बल व्यक्त करता है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: यह राजनयिक मानवीय संदर्भ है, इसलिए यहाँ स्वर्गदूत नहीं, भेजे गए प्रतिनिधि अभिप्रेत हैं।
- source_word: מִמִּדְבַּר קְדֵמוֹת
  choice: कदेमोत के निर्जन प्रदेश से
  rationale: מִדְבָּר बस्ती से बाहर के निर्जन अथवा अर्ध-शुष्क भूभाग को दर्शाता है; ‘निर्जन प्रदेश’ आधुनिक हिन्दी में अर्थ स्पष्ट रखता है और स्थान-नाम का संबंध सुरक्षित करता है।
- source_word: אֶל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: हेशबोन के राजा सीहोन के पास
  rationale: אֶל मिशन के प्राप्तकर्ता को सूचित करता है; हिन्दी में ‘के पास’ दूत भेजने के प्रसंग में स्वाभाविक है। पदवी और स्थान-नाम का संबंध स्पष्ट रखा गया है।
- source_word: דִּבְרֵי שָׁלוֹם
  choice: शांति की बातें
  rationale: यह इब्रानी के शाब्दिक रूप ‘शांति के वचन/बातें’ को निकटता से रखता है और शांतिपूर्ण राजनयिक प्रस्ताव का संकेत देता है, बिना उसे निश्चित संधि-शर्तों के रूप में सीमित किए।
- source_word: לֵאמֹר
  choice: कहने के लिए
  rationale: यह आगे आने वाले प्रत्यक्ष कथन का परिचय देता है; हिन्दी वाक्य-रचना में उद्देश्यसूचक रूप स्वाभाविक है।
