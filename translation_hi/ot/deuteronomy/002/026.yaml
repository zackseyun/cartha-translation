  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘शांति की बातें’ मूल अभिव्यक्ति की खुली अर्थ-सीमा बनाए रखता है; अधिक व्याख्यात्मक विकल्प पाद-टिप्पणी में दिया गया है।
