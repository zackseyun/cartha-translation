source:
  edition: WLC
  text: וַ/נִּלְכֹּ֤ד אֶת כָּל עָרָי/ו֙ בָּ/עֵ֣ת הַ/הִ֔וא וַֽ/נַּחֲרֵם֙ אֶת כָּל עִ֣יר מְתִ֔ם וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּ֑ף לֹ֥א הִשְׁאַ֖רְנוּ שָׂרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/034.yaml
  text: At that time we captured all his cities[a], and we devoted to destruction every inhabited city, with the women and the little children. We left no survivor.
translation:
  language: hi
  text: उस समय हमने उसके सभी नगरों पर अधिकार कर लिया और प्रत्येक नगर को—पुरुषों, स्त्रियों और छोटे बच्चों समेत—विनाश के लिए समर्पित कर दिया[a]। हमने किसी भी जीवित बचे व्यक्ति को नहीं छोड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “हर नगर को विनाश के लिए अलग ठहरा दिया।” इब्रानी क्रिया में नगर और उसके निवासियों को ख़ेरम के अधीन, अर्थात विनाश के लिए अलग कर देने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: हमने…पर अधिकार कर लिया
  rationale: לכד युद्ध के प्रसंग में किसी नगर को जीतकर अपने अधिकार में लेने का सामान्य क्रियापद है। यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है और सैन्य संदर्भ को स्पष्ट रखता है।
- source_word: כָּל עָרָיו
  choice: उसके सभी नगरों
  rationale: עיר नगर या शहर हो सकता है; यहाँ “नगर” व्यापक, स्वाभाविक और विजय-वर्णन के अनुकूल है। כָּל की समग्रता “सभी” से बनी रहती है।
- source_word: בָּעֵת הַהִוא
  choice: उस समय
  rationale: यह सीधे और स्वाभाविक रूप से इब्रानी काल-सूचक पद का अर्थ देता है।
- source_word: וַנַּחֲרֵם
  choice: विनाश के लिए समर्पित कर दिया
  rationale: חרם के हिफ़ील रूप में किसी वस्तु या समुदाय को ḥerem के अधीन, अर्थात विनाश के लिए अलग कर देने का तकनीकी और धार्मिक भाव है। यह अनुवाद केवल “पूरी तरह नष्ट किया” कहने की अपेक्षा उस भाव को अधिक सुरक्षित रखता है।
- source_word: כָּל עִיר מְתִם
  choice: प्रत्येक नगर को—पुरुषों…समेत
  rationale: מְתִם मानव पुरुषों को सूचित करता है और आगे स्त्रियों तथा छोटे बच्चों की सूची आती है। विराम-चिह्नों और “समेत” से इस संक्षिप्त इब्रानी रचना को स्पष्ट किया गया है, बिना उसे सामान्य “लोगों” में बदलकर लिंग-भेद मिटाए।
- source_word: הַנָּשִׁים
  choice: स्त्रियों
  rationale: स्त्रीलिंग बहुवचन का सीधा और सटीक अनुवाद।
- source_word: הַטָּף
  choice: छोटे बच्चों
  rationale: טף छोटे बच्चों अथवा कम आयु के आश्रितों को दर्शाता है; “छोटे बच्चे” आयु और असहायता के भाव को स्पष्ट रखता है।
- source_word: לֹא הִשְׁאַרְנוּ שָׂרִיד
  choice: हमने किसी भी जीवित बचे व्यक्ति को नहीं छोड़ा
  rationale: שָׂרִיד युद्ध के संदर्भ में जीवित बचे व्यक्ति को दर्शाता है। यह हिन्दी में स्पष्ट है और वाक्य की पूर्ण नकारात्मकता बनाए रखता है।
theological_decisions:
- issue: विजय-वर्णन में חרם का अनुवाद
  choice: विनाश के लिए समर्पित कर दिया
  alternative: पूरी तरह नष्ट कर दिया; विनाश-व्रत के अधीन कर दिया
  rationale: चुना गया रूप वास्तविक हिंसा को नरम नहीं करता और साथ ही חרם के तकनीकी, धार्मिक आयाम को बनाए रखता है। मुख्य पाठ में अपरिचित पारिभाषिक शब्द थोपने के बजाय उसका अधिक औपचारिक विकल्प पादटिप्पणी में दिया गया है।
- issue: מְתִם की लिंग-विशिष्टता
  choice: पुरुषों, स्त्रियों और छोटे बच्चों समेत
  alternative: लोगों को, स्त्रियों और बच्चों समेत; हर आबाद नगर
  rationale: इब्रानी पाठ पुरुषों, स्त्रियों और छोटे बच्चों को अलग-अलग बताता है। चुना गया रूप उस भेद और पाठ की कठोरता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। “पर अधिकार कर लिया” विजय के सैन्य संदर्भ को स्वाभाविक ढंग से व्यक्त करता है। डैश से इब्रानी की संक्षिप्त सूची स्पष्ट होती है, जबकि “विनाश के लिए समर्पित” חרם की धार्मिक-सैन्य धारणा को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
