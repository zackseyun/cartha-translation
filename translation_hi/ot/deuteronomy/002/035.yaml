  yaml_path: translation/ot/deuteronomy/002/035.yaml
  text: Only the livestock we took as plunder for ourselves[a], along with the spoil of the cities that we captured.
translation:
  language: hi
  text: केवल पशुधन और जिन नगरों को हमने जीत लिया था उनका लूट का माल ही हमने अपने लिए ले लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: केवल
  rationale: यह पिछले पद में बताए गए पूर्ण विनाश के विपरीत उस अपवाद को सीमित करता है जिसे इस्राएलियों ने अपने लिए रख लिया।
- source_word: הַבְּהֵמָה
  choice: पशुधन
  rationale: यहाँ आशय सामान्य रूप से सभी पशुओं से नहीं, बल्कि पाले हुए उन पशुओं से है जिन्हें युद्ध की लूट के रूप में लिया गया।
- source_word: בָּזַזְנוּ לָנוּ
  choice: हमने अपने लिए ले लिया
  rationale: בזז युद्ध में लूटने या लूट के रूप में लेने को व्यक्त करता है, और לָנוּ अपने लाभ के लिए लेने का भाव जोड़ता है। हिंदी में पूरा पद पहले ही ‘लूट का माल’ कहता है, इसलिए यह रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता और अनावश्यक पुनरुक्ति से बचता है।
- source_word: וּשְׁלַל
  choice: और ... लूट का माल
  rationale: שׁלל युद्ध में प्राप्त लूट या माल को दर्शाता है। ‘लूट का माल’ आधुनिक हिंदी में स्पष्ट और प्रसंगानुकूल है।
- source_word: הֶעָרִים
  choice: उन नगरों
  rationale: עיר नगर या शहर को दर्शाता है; विजय-वर्णन में ‘नगर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אֲשֶׁר לָכָדְנוּ
  choice: जिन्हें हमने जीत लिया था
  rationale: לכד सैन्य प्रसंग में किसी नगर को अधिकार में लेने या जीतने का अर्थ देता है। ‘जीत लिया था’ क्रम और विजय, दोनों को सहज हिंदी में व्यक्त करता है।
