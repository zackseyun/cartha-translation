translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, कथात्मक और गरिमापूर्ण शैली रखी गई है। वाक्य की आरंभिक सीमा-सूचक भूमिका के लिए ‘केवल’ रखा गया है, और युद्ध-संबंधी शब्दावली को सामान्य पाठक के लिए स्पष्ट बनाया गया है।
