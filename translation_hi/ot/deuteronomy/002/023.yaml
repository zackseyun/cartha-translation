base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/023.yaml
  text: As for the Avvim[a], who lived in villages as far as Gaza, the Caphtorim, who came out from Caphtor[b], destroyed them and settled in their place.
translation:
  language: hi
  text: और गाज़ा तक की बस्तियों में रहनेवाले अव्वी लोगों को कप्तोर से निकले कप्तोरियों ने नष्ट कर दिया और उनके स्थान पर बस गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעַוִּים
  choice: अव्वी लोग
  rationale: यह एक जाति का नाम है। हिन्दी में स्वाभाविक स्पष्टता के लिए लिप्यंतरण के साथ ‘लोग’ रखा गया है।
- source_word: הַיֹּשְׁבִים
  choice: जो ... रहते थे
  rationale: ישב यहाँ स्थायी निवास का बोध देता है; ‘रहते थे’ आधुनिक और सहज हिन्दी है।
- source_word: בַּחֲצֵרִים
  choice: बस्तियों में
  rationale: חֲצֵרִים का अर्थ गाँव, छोटी बस्ती या निवास-स्थान हो सकता है। ‘बस्तियों’ इस व्यापकता को बनाए रखता है।
- source_word: עַד עַזָּה
  choice: गाज़ा तक
  rationale: यह भौगोलिक विस्तार की सीमा बताता है; ‘गाज़ा तक’ संक्षिप्त और स्वाभाविक है।
- source_word: כַּפְתֹּרִים
  choice: कप्तोरियों
  rationale: जाति के नाम का हिन्दी लिप्यंतरण और बहुवचन रूप।
- source_word: הַיֹּצְאִים מִכַּפְתּוֹר
  choice: कप्तोर से निकले
  rationale: יצא की गति-संबंधी छवि को ‘से निकले’ बनाए रखता है और केवल ‘से आए’ की अपेक्षा मूल के अधिक निकट है।
- source_word: הִשְׁמִידֻם
  choice: उन्हें नष्ट कर दिया
  rationale: שׁמד के हिफ़ील रूप का प्रबल विनाशार्थक भाव व्यक्त होता है, बिना अनावश्यक अतिशयोक्ति के।
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: उनके स्थान पर बस गए
  rationale: यह मुहावरा पहले निवासियों का स्थान लेने और उनके भूभाग में बसने, दोनों का बोध देता है।
