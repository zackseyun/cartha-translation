language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/נַּעֲבֹ֞ר מֵ/אֵ֧ת אַחֵ֣י/נוּ בְנֵי עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר מִ/דֶּ֨רֶךְ֙ הָֽ/עֲרָבָ֔ה מֵ/אֵילַ֖ת וּ/מֵ/עֶצְיֹ֣ן גָּ֑בֶר וַ/נֵּ֨פֶן֙ וַֽ/נַּעֲבֹ֔ר דֶּ֖רֶךְ מִדְבַּ֥ר מוֹאָֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/008.yaml
  text: So we passed on from our brothers[a], the sons of Esau, who live in Seir, away from the way of the Arabah, from Elath and from Ezion-geber[b]; and we turned and passed by the way of the wilderness of Moab.
translation:
  language: hi
  text: इसलिए हम अपने भाइयों, एसाव के वंशजों, जो सेईर में रहते हैं, के पास से आगे बढ़े—अराबा के मार्ग से, एलत और एस्योन-गेबेर से; फिर हम मुड़े और मोआब की मरुभूमि के मार्ग से आगे बढ़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנַּעֲבֹר מֵאֵת
  choice: के पास से आगे बढ़े
  rationale: עבר के साथ מֵאֵת यहाँ लोगों के पास से गुजरकर यात्रा जारी रखने का भाव देता है; यह अनुवाद न तो जलराशि पार करने का अर्थ थोपता है, न केवल विदाई का।
- source_word: אַחֵינוּ בְנֵי עֵשָׂו
  choice: अपने भाइयों, एसाव के वंशजों
  rationale: ‘भाइयों’ से इदोम के साथ इस्राएल का संबंध-सूचक मूल शब्द सुरक्षित रहता है; ‘वंशजों’ आधुनिक हिन्दी में בְנֵי की वंशगत भावना स्पष्ट करता है।
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: जो सेईर में रहते हैं
  rationale: ישב का कृदन्त स्थायी निवास सूचित करता है; ‘रहते हैं’ सहज आधुनिक हिन्दी है।
- source_word: מִדֶּרֶךְ הָעֲרָבָה מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר
  choice: एलत और एस्योन-गेबेर से होकर जानेवाले अराबा के मार्ग से हट गए
  rationale: वाक्य-विन्यास के अनुसार स्थानों को अराबा के मार्ग से जोड़ना स्वाभाविक है। מן के अलगाव-बोध को ‘से हट गए’ व्यक्त करता है और अराबा को भू-नाम के रूप में सुरक्षित रखा गया है।
- source_word: וַנֵּפֶן
  choice: फिर मुड़कर
  rationale: פנה यात्रा की दिशा बदलने को सूचित करता है; ‘मुड़कर’ संक्षिप्त और स्वाभाविक है।
- source_word: וַנַּעֲבֹר דֶּרֶךְ מִדְבַּר מוֹאָב
  choice: मोआब के निर्जन प्रदेश के मार्ग से आगे बढ़े
  rationale: עבר की पुनरावृत्ति को ‘आगे बढ़े’ से और דֶּרֶךְ को ‘मार्ग’ से व्यक्त किया गया है। מִדְבָּר के लिए ‘निर्जन प्रदेश’ आधुनिक पाठक को भूभाग का अर्थ देता है, केवल रेत के रेगिस्तान का नहीं।
theological_decisions:
- issue: इदोमियों के लिए संबंध-सूचक भाषा
  choice: अपने भाइयों, एसाव के वंशजों
  alternative: अपने संबंधियों, एसाव के वंशजों
  rationale: मूल का אַחֵינוּ शाब्दिक रूप से ‘हमारे भाई’ है। ‘भाइयों’ को बनाए रखने से इस्राएल और एसाव के वंशजों के ऐतिहासिक पारिवारिक संबंध पर दिया गया बल सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। स्थान-नामों का लिप्यंतरण ‘सेईर’, ‘एलत’, ‘एस्योन-गेबेर’, ‘अराबा’ और ‘मोआब’ किया गया है। मूल अंग्रेज़ी परामर्श-पाठ की पादटिप्पणियों के चिह्न और विषय परस्पर असंगत प्रतीत होते हैं; हिन्दी मुख्य पाठ में आवश्यक अर्थ स्पष्ट होने के कारण कोई पादटिप्पणी नहीं जोड़ी गई।
