- from: इसलिए हम अपने भाइयों, एसाव के वंशजों के पास से आगे बढ़े, जो सेईर में रहते हैं। हम एलत और एस्योन-गेबेर से होकर जानेवाले अराबा के मार्ग से हट गए; फिर मुड़कर मोआब के निर्जन प्रदेश के मार्ग से आगे बढ़े।
  to: इसलिए हम अपने भाइयों, एसाव के वंशजों, जो सेईर में रहते हैं, के पास से आगे बढ़े—अराबा के मार्ग से, एलत और एस्योन-गेबेर से; फिर हम मुड़े और मोआब की मरुभूमि के मार्ग से आगे बढ़े।
