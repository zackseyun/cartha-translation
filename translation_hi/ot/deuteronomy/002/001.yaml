  text: וַ/נֵּ֜פֶן וַ/נִּסַּ֤ע הַ/מִּדְבָּ֨רָ/ה֙ דֶּ֣רֶךְ יַם ס֔וּף כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה אֵלָ֑/י וַ/נָּ֥סָב אֶת הַר שֵׂעִ֖יר יָמִ֥ים רַבִּֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/001.yaml
  text: Then we turned and set out for the wilderness by the way of the Red Sea[a], just as Yahweh had spoken to me, and we went around Mount Seir for many days.
translation:
  language: hi
  text: तब हम मुड़े और लाल सागर[a] के मार्ग से जंगल की ओर चल पड़े, जैसा याहवे ने मुझसे कहा था; और हम बहुत दिनों तक सेईर पर्वत के चारों ओर घूमते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सरकंडों का सागर।” हिब्रू नाम याम सूफ़ का अधिक शाब्दिक अनुवाद इस प्रकार हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: तब हम मुड़े
  rationale: क्रिया פנה दिशा बदलने को व्यक्त करती है; कथात्मक क्रम के लिए ‘तब’ स्वाभाविक है, जबकि ‘वापस मुड़े’ अनावश्यक व्याख्या जोड़ता।
- source_word: וַנִּסַּע הַמִּדְבָּרָה
  choice: जंगल की ओर चल पड़े
  rationale: נסע पड़ाव उठाकर प्रस्थान करने का भाव देता है और दिशासूचक ה लक्ष्य की ओर गति दर्शाता है।
- source_word: דֶּרֶךְ יַם סוּף
  choice: लाल सागर के मार्ग से होकर
  rationale: דֶּרֶךְ मार्ग अथवा रास्ते का बोध कराता है। יַם סוּף का प्रचलित भौगोलिक नाम ‘लाल सागर’ मुख्य पाठ में रखा गया है और अधिक शाब्दिक विकल्प पादटिप्पणी में है।
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֵלַי
  choice: यहोवा ने मुझसे जैसा कहा था, उसके अनुसार
  rationale: כַּאֲשֶׁר अनुरूपता दर्शाता है और पूर्व कथन के लिए ‘कहा था’ हिंदी कथा-क्रम में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित रूप ‘यहोवा’ व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- source_word: וַנָּסָב אֶת הַר שֵׂעִיר
  choice: हम सेईर पर्वत के चारों ओर घूमते रहे
  rationale: סבב यहाँ किसी भूभाग के चारों ओर जाने को बताता है; बहुवचन संदर्भ और दीर्घ अवधि के साथ ‘घूमते रहे’ स्वाभाविक है।
- source_word: יָמִים רַבִּים
  choice: बहुत दिनों तक
  rationale: यह अवधि-सूचक पद का निकट और सहज हिंदी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत नाम है। हिंदी पाठकों में पहचाने जाने वाले ‘यहोवा’ से उसे ‘प्रभु’ जैसी उपाधि में बदलने से बचाया गया है; ‘याहवे’ अधिक प्रत्यक्ष लिप्यंतरण का संभव विकल्प है।
- issue: יַם סוּף की भौगोलिक पहचान
  choice: लाल सागर
  alternative: सरकंडों का सागर
  rationale: पारंपरिक और व्यापक रूप से पहचाना जाने वाला नाम मुख्य पाठ में है, पर हिब्रू पद की शाब्दिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक स्वर रखा गया है। ‘चल पड़े’ प्रस्थान का भाव देता है और ‘घूमते रहे’ बहुत दिनों तक जारी यात्रा को स्पष्ट करता है।
