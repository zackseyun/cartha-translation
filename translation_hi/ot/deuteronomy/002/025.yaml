  text: הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ תֵּ֤ת פַּחְדְּ/ךָ֙ וְ/יִרְאָ֣תְ/ךָ֔ עַל פְּנֵי֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָ֑יִם אֲשֶׁ֤ר יִשְׁמְעוּ/ן֙ שִׁמְעֲ/ךָ֔ וְ/רָגְז֥וּ וְ/חָל֖וּ מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/025.yaml
  text: Today I will begin to put the dread and fear of you on the face of the peoples under all the heavens[b][a], who will hear the report about you and will tremble and writhe because of you.
translation:
  language: hi
  text: आज से मैं आकाश के नीचे की सब जातियों पर तुम्हारा भय और आतंक डालना आरम्भ करूँगा। वे तुम्हारे विषय में समाचार सुनेंगे[a] और तुम्हारे कारण थरथराएँगे और पीड़ा से तड़पेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी ख्याति सुनेंगे” अथवा “तुम्हारे बारे में चर्चा सुनेंगे।” इब्रानी पद ऐसे समाचार को भी सूचित कर सकता है जिससे किसी की ख्याति बनती है।
    reason: lexical_alternative
  - marker: b
    text: या “व्याकुल हो जाएँगे” अथवा “प्रसव-वेदना में स्त्री के समान तड़पेंगे।” इब्रानी क्रिया तीव्र शारीरिक पीड़ा का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: आज ही
  rationale: इब्रानी में संकेतवाचक पद दिन की तात्कालिकता पर बल देता है; आधुनिक हिन्दी में ‘आज ही’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אָחֵל תֵּת
  choice: डालना आरम्भ करूँगा
  rationale: חלל का हिफ़ील रूप और נתן का क्रियार्थक संज्ञा-रूप मिलकर ‘देना/डालना आरम्भ करना’ बताते हैं। भय के साथ हिन्दी में ‘डालना’ स्वाभाविक है।
- source_word: פַּחְדְּךָ וְיִרְאָתְךָ
  choice: तुम्हारा भय और आतंक
  rationale: दोनों समानान्तर संज्ञाओं का भेद बनाए रखा गया है। सन्दर्भ में इसका अर्थ वह भय और आतंक है जो इस्राएल के कारण लोगों में उत्पन्न होगा, न कि इस्राएल का अपना भय।
- source_word: עַל פְּנֵי הָעַמִּים
  choice: सब लोगों पर
  rationale: शाब्दिक रूप ‘लोगों के मुख पर’ है, पर यहाँ עַל־פְּנֵי का आशय उन लोगों पर भय डालना है। हिन्दी में शाब्दिक मुख-चित्र अस्वाभाविक और भ्रामक होता, इसलिए अर्थ को सहज रूप दिया गया है।
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: आकाश के नीचे के सब
  rationale: यह समस्त आकाश के नीचे रहने वाले लोगों के लिए व्यापक बाइबलीय मुहावरा है। हिन्दी में एकवचन ‘आकाश’ स्वाभाविक है।
- source_word: אֲשֶׁר יִשְׁמְעוּן שִׁמְעֲךָ
  choice: वे तुम्हारे विषय में समाचार सुनेंगे
  rationale: שֵׁמַע समाचार, चर्चा या उससे बनी ख्याति को सूचित कर सकता है। मुख्य पाठ में व्यापक ‘समाचार’ रखा गया और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: וְרָגְזוּ
  choice: थरथराएँगे
  rationale: क्रिया भय के कारण काँपने या विचलित होने का बोध देती है; ‘थरथराना’ आधुनिक हिन्दी में सजीव और स्पष्ट है।
- source_word: וְחָלוּ
  choice: पीड़ा से तड़पेंगे
  rationale: क्रिया तीव्र शारीरिक व्यथा में ऐंठने या प्रसव-वेदना जैसी तड़प का चित्र देती है। मुख्य पाठ अर्थ स्पष्ट करता है और विशिष्ट प्रसव-चित्र पादटिप्पणी में सुरक्षित है।
- source_word: מִפָּנֶיךָ
  choice: तुम्हारे कारण
  rationale: शाब्दिक अर्थ ‘तुम्हारे सामने/उपस्थित होने से’ है; प्रसंग में यह उनके भय और तड़प के कारण को व्यक्त करता है।
