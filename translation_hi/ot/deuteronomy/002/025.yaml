  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सर्वसुलभ रूप अपनाया गया है। एकवचन सम्बोधन ‘तुम्हारा/तुम्हारे’ रखा गया है क्योंकि मूसा से सम्बोधित इब्रानी प्रत्यय एकवचन हैं। ‘लोगों’ बहुवचन जातियों/जनसमूहों को समेटता है; वाक्य-विन्यास को हिन्दी में स्पष्ट करने के लिए सम्बन्धवाचक उपवाक्य को अलग वाक्य बनाया गया है।
