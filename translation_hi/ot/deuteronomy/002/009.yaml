base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/009.yaml
  text: And Yahweh said to me[a], “Do not harass Moab or provoke them to war, for I will not give you any of its land as a possession[b], because I have given Ar to the sons of Lot as a possession.”
translation:
  language: hi
  text: तब याहवे ने मुझसे कहा, “मोआब को न सताना और न उनसे युद्ध छेड़ना[a], क्योंकि मैं उसके देश में से कोई भाग तुम्हारे अधिकार में नहीं दूँगा[b], क्योंकि मैंने आर को लूत के पुत्रों के अधिकार में दे दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मोआब को संकट में न डालना और उनसे युद्ध में न उलझना।”
    reason: पहली क्रिया शत्रुतापूर्ण दबाव या संकट पहुँचाने और दूसरी युद्ध भड़काने या उसमें भिड़ने—दोनों अर्थ-छायाएँ रखती है।
  - marker: b
    text: दोनों स्थानों पर “विरासत के रूप में” भी अनुवाद सम्भव है।
    reason: יְרֻשָּׁה अधिकार में मिली संपत्ति अथवा विरासत को सूचित कर सकता है।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण; इसे किसी उपाधि से नहीं बदला गया है।
- source_word: אֶל תָּצַר אֶת מוֹאָב
  choice: मोआब को तंग न करना
  rationale: צרר यहाँ युद्ध से पहले के शत्रुतापूर्ण दबाव या उत्पीड़न को व्यक्त करता है; ‘तंग न करना’ सहज आधुनिक हिन्दी में इस व्यापक अर्थ को रखता है।
- source_word: וְאַל תִּתְגָּר בָּם מִלְחָמָה
  choice: और न उनसे युद्ध छेड़ना
  rationale: यह पदबंध उनके विरुद्ध सैन्य संघर्ष आरम्भ करने या उसमें उलझने से रोकता है। ‘युद्ध छेड़ना’ स्वाभाविक हिन्दी है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: מֵאַרְצוֹ
  choice: उसके देश का कोई भी भाग
  rationale: מִן का अंशवाचक बल स्पष्ट करता है कि मोआब के देश का कोई हिस्सा भी इस्राएल को नहीं मिलेगा; एकवचन प्रत्यय मोआब को सामूहिक इकाई मानता है।
- source_word: יְרֻשָּׁה
  choice: अधिकार में
  rationale: यह शब्द आबंटित स्थायी संपत्ति या विरासत को सूचित करता है। ‘अधिकार में’ दोनों प्रयोगों में सहज है और भूमि पर प्राप्त अधिकार का भाव देता है।
- source_word: לִבְנֵי לוֹט
  choice: लूत के वंशजों
  rationale: शाब्दिक रूप ‘लूत के पुत्रों’ है, पर यहाँ बाद की पीढ़ियाँ अभिप्रेत हैं; ‘वंशजों’ आधुनिक हिन्दी में आशय को स्पष्ट रखता है।
- source_word: עָר
  choice: आर
  rationale: स्थान-नाम का सीधा देवनागरी लिप्यंतरण।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है। ‘याहवे’ उसका प्रचलित निकट लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: יְרֻשָּׁה में संपत्ति और विरासत का संबंध
  choice: अधिकार में
  alternative: विरासत के रूप में
  rationale: मूल शब्द आबंटित संपत्ति और विरासत दोनों का भाव रख सकता है। मुख्य पाठ में सरल ‘अधिकार में’ चुना गया है और विरासत वाला अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आज्ञाओं में हिन्दी का स्वाभाविक क्रियार्थक रूप प्रयुक्त है। ‘लूत के वंशज’ शाब्दिक ‘लूत के पुत्रों’ का प्रसंगानुकूल, सामान्य पाठक के लिए स्पष्ट रूप है।
