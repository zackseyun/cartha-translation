source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י רְאֵ֗ה הַֽחִלֹּ֨תִי֙ תֵּ֣ת לְ/פָנֶ֔י/ךָ אֶת סִיחֹ֖ן וְ/אֶת אַרְצ֑/וֹ הָחֵ֣ל רָ֔שׁ לָ/רֶ֖שֶׁת אֶת אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/031.yaml
  text: And Yahweh said to me[a], “See, I have begun to give Sihon and his land over to you[b]. Begin to take possession of his land.”
translation:
  language: hi
  text: और याहवे ने मुझसे कहा, “देख, मैंने सीहोन और उसके देश को तेरे हाथ में देना आरंभ कर दिया है[a]। उसके देश को अपने अधिकार में लेना आरंभ कर।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘तेरे सामने’। यहाँ इसका आशय सीहोन और उसके देश को तेरे वश में कर देना है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘अधिकार करना आरंभ कर, उसके देश को अधिकार में लेने के लिए।’ इब्रानी में ‘अधिकार करना/लेना’ की एक ही धातु दोहराकर बात पर बल दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: רְאֵה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाली आज्ञा है; ‘देख’ इसकी सीधी शक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: הַחִלֹּתִי תֵּת
  choice: मैंने ... देना आरंभ कर दिया है
  rationale: पूर्ण क्रिया के साथ आरंभ हो चुकी और अब जारी कार्रवाई का भाव व्यक्त होता है।
- source_word: לְפָנֶיךָ
  choice: तेरे हाथ में
  rationale: शाब्दिक अर्थ ‘तेरे सामने’ है, पर युद्ध-संदर्भ में वाक्यांश सीहोन और उसके देश को इस्राएल के अधिकार में देने का बोध कराता है।
- source_word: הָחֵל רָשׁ לָרֶשֶׁת
  choice: अब ... पर अधिकार करना आरंभ कर
  rationale: परमेश्वर के ‘आरंभ’ करने और इस्राएल को ‘आरंभ’ करने की आज्ञा के समानांतर भाव को रखा गया है; ירש का भूमि को अपने अधिकार में लेने वाला अर्थ स्पष्ट किया गया है।
- source_word: אַרְצוֹ
  choice: उसका देश
  rationale: यहाँ אֶרֶץ सीहोन के अधीन भू-भाग को दर्शाता है; ‘देश’ सहज और संदर्भानुकूल है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना हिन्दी में प्रस्तुत करता है।
- issue: देश देने में दैवी और मानवीय क्रिया का संबंध
  choice: परमेश्वर ने देना आरंभ किया है; इस्राएल को अधिकार करना आरंभ करने की आज्ञा है
  alternative: विजय को केवल पूर्ण दैवी कार्य या केवल मानवीय उपलब्धि के रूप में कहना
  rationale: मूल की जानबूझकर रखी गई समानांतरता दैवी पहल और इस्राएल की अपेक्षित कार्रवाई—दोनों को साथ रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली हिन्दी अपनाई गई है। ‘तेरे’ का प्रयोग मूसा से एकवचन संबोधन के कारण है। ‘अब’ आज्ञा की तात्कालिकता स्वाभाविक हिन्दी में व्यक्त करता है।
