    reason: lexical_alternative
lexical_decisions:
- source_word: רַב לָכֶם
  choice: बहुत ... चुके हो
  rationale: यह इब्रानी मुहावरा प्रसंग में पर्याप्तता की सीमा बताता है—इस क्षेत्र के चारों ओर घूमना अब बहुत हो चुका है। हिंदी में पूर्णताबोधक रचना के साथ ‘बहुत’ इसका स्वाभाविक भाव व्यक्त करता है।
- source_word: סֹב
  choice: चारों ओर ... घूम चुके हो
  rationale: סבב से निकला यह रूप किसी स्थान के चारों ओर घूमने या चक्कर लगाने को दर्शाता है। यात्रा के पिछले चरण को देखते हुए ‘घूम चुके हो’ उपयुक्त है।
- source_word: הָהָר הַזֶּה
  choice: इस पहाड़ी प्रदेश
  rationale: הַר का अर्थ एक पहाड़ भी हो सकता है और पहाड़ी भूभाग भी। यहाँ व्यापक यात्रा-प्रसंग के कारण ‘पहाड़ी प्रदेश’ स्वाभाविक भौगोलिक अर्थ देता है।
- source_word: פְּנוּ
  choice: मुड़ो
  rationale: פנה का आज्ञार्थक रूप यहाँ यात्रा की दिशा बदलने की आज्ञा देता है; ‘मुड़ो’ सीधा और सहज अनुवाद है।
- source_word: לָכֶם
  choice: अलग से व्यक्त नहीं किया
  rationale: आज्ञार्थक क्रिया के बाद आया यह दत्तिव बहुवचन हिंदी में अलग से ‘अपने लिए’ कहने पर अस्वाभाविक और भ्रामक लगेगा; क्रिया के बहुवचन रूप में संबोधन स्पष्ट है।
- source_word: צָפֹנָה
  choice: उत्तर की ओर
  rationale: दिशासूचक प्रत्यय उत्तर दिशा की ओर गति बताता है; ‘उत्तर की ओर’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
