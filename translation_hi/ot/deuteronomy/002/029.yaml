base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/029.yaml
  text: just as the sons of Esau who live in Seir and the Moabites who live in Ar did for me[a], until I cross the Jordan into the land that Yahweh our God is giving to us.
translation:
  language: hi
  text: ठीक वैसे ही—जैसा सेईर में रहने वाले एसाव के वंशजों और आर में रहने वाले मोआबियों ने मेरे लिए किया था[a]—जब तक कि मैं यरदन पार करके उस देश में न पहुँच जाऊँ जिसे याहवे, हमारा परमेश्वर, हमें दे रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे साथ वैसा व्यवहार किया था।” इब्रानी में शाब्दिक अर्थ “मेरे लिए किया” है; सन्दर्भ में यह मार्ग देने और आवश्यक वस्तुएँ उपलब्ध कराने की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: जैसा
  rationale: तुलना का भाव स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: עָשׂוּ לִי
  choice: मेरे लिए ... किया था
  rationale: इब्रानी का निकट रूप बनाए रखता है और सन्दर्भ में मार्ग तथा आवश्यक वस्तुएँ देने की ओर संकेत करता है, बिना उसे मुख्य पाठ में अत्यधिक स्पष्ट किए।
- source_word: בְּנֵי עֵשָׂו
  choice: एसाव के वंशजों
  rationale: शाब्दिक 'एसाव के पुत्र' यहाँ एक जनसमूह को सूचित करता है; 'वंशज' आधुनिक हिन्दी में उसका स्वाभाविक सामूहिक अर्थ देता है।
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: सेईर में रहने वाले
  rationale: स्थायी निवास सूचित करने वाले कृदन्त का सहज हिन्दी रूप।
- source_word: וְהַמּוֹאָבִים
  choice: और ... मोआबियों
  rationale: जातिवाचक बहुवचन का सीधा हिन्दी रूप।
- source_word: הַיֹּשְׁבִים בְּעָר
  choice: आर में रहने वाले
  rationale: पहले समान कृदन्तीय वाक्यांश के अनुरूप अनुवाद; आर स्थान-नाम है।
- source_word: עַד אֲשֶׁר אֶעֱבֹר אֶת הַיַּרְדֵּן
  choice: जब तक कि मैं यरदन पार करके ... न पहुँच जाऊँ
  rationale: हिन्दी में 'जब तक कि ... न' स्वाभाविक है; गन्तव्य के साथ 'पहुँच जाऊँ' जोड़ने से पार होकर देश में प्रवेश का भाव स्पष्ट होता है।
- source_word: אֶל הָאָרֶץ
  choice: उस देश में
  rationale: यरदन पार करके सीमाबद्ध भूभाग में प्रवेश का भाव देता है।
- source_word: יְהוָה
  choice: याहवेह
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम का देवनागरी लिप्यन्तरण, किसी उपाधि से प्रतिस्थापन नहीं।
- source_word: אֱלֹהֵינוּ
  choice: हमारा परमेश्वर
  rationale: वाचा-संबंधी सम्बोधन का मानक और गरिमापूर्ण हिन्दी रूप।
- source_word: נֹתֵן לָנוּ
  choice: हमें दे रहा है
  rationale: इब्रानी कृदन्त के वर्तमान और सुनिश्चित दान के पक्ष को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; लिप्यन्तरण उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: עָשׂוּ לִי में व्यवहार की प्रकृति
  choice: मेरे लिए ... किया था
  alternative: मेरे साथ वैसा व्यवहार किया था
  rationale: मूल वाक्यांश सामान्य है। मुख्य पाठ उसकी अस्पष्टता बनाए रखता है, जबकि पाद-टिप्पणी निकटवर्ती सन्दर्भ—मार्ग और आवश्यक वस्तुएँ—बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। वाक्य पिछले पदों से जुड़ा होने के कारण आरम्भिक तुलना को स्वतंत्र वाक्य बनाने के बजाय उसी प्रवाह में रखा गया है।
