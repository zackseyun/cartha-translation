base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/010.yaml
  text: The Emim formerly lived there[a], a people great and numerous and tall as the Anakim.
translation:
  language: hi
  text: एमीम पहले[a] वहाँ रहते थे—एक बड़ा, बहुत-से लोगोंवाला और अनाकीम के समान ऊँचे कदवाला जनसमूह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, पूर्वकाल में।
    reason: ‘पहले’ के लिए לְפָנִים का वैकल्पिक कालवाचक अनुवाद।
lexical_decisions:
- source_word: הָאֵמִים
  choice: एमीम
  rationale: यह एक जाति का नाम है, इसलिए इसका अर्थानुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
- source_word: לְפָנִים
  choice: पहले
  rationale: यहाँ इसका प्रयोग स्थान के लिए नहीं, बल्कि समय के अर्थ में है—अर्थात् पहले या पुराने समय में।
- source_word: יָשְׁבוּ בָהּ
  choice: वहाँ रहते थे
  rationale: ישׁב के साथ ב यहाँ किसी भूभाग में निवास करने का भाव देता है; स्त्रीलिंग एकवचन सर्वनाम का संदर्भ उस स्थान या भूमि से है।
- source_word: עַם
  choice: जाति
  rationale: यहाँ शब्द एक जातीय जनसमूह को सूचित करता है; आधुनिक हिन्दी में ‘जाति’ इस सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גָּדוֹל
  choice: बड़ी
  rationale: यह जनसमूह के विशाल और प्रभावशाली होने का सामान्य वर्णन है।
- source_word: וְרַב
  choice: बहुसंख्यक
  rationale: यह लोगों की बड़ी संख्या को सूचित करता है और विशेषण-श्रृंखला में स्वाभाविक हिन्दी देता है।
- source_word: וָרָם
  choice: लंबे
  rationale: अनाकीम से तुलना के संदर्भ में यह शारीरिक ऊँचाई का वर्णन करता है।
- source_word: כָּעֲנָקִים
  choice: अनाकीम के समान
  rationale: तुलनासूचक כ को ‘के समान’ से व्यक्त किया गया है और जातिनाम का लिप्यंतरण रखा गया है।
