translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सहज रखी गई है। एकवचन संबोधन को ‘तुम’ से व्यक्त किया गया है। ‘बेच देना’ और ‘दे देना’ आदेश से अधिक विनम्र निवेदन के प्रसंगानुकूल हैं। अंतिम डैश वाक्य के अगले पद में जारी रहने का संकेत देता है।
