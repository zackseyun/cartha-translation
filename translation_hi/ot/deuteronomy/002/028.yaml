base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/028.yaml
  text: You may sell me food for silver[a], so that I may eat, and give me water for silver, so that I may drink[b]; only let me pass through on my feet—
translation:
  language: hi
  text: तुम मुझे चाँदी के बदले[a] भोजन बेच देना, ताकि मैं खा सकूँ, और चाँदी के बदले पानी दे देना, ताकि मैं पी सकूँ; बस मुझे पैदल[b] होकर गुजर जाने देना—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पैसे देकर।” इब्रानी में शाब्दिक रूप से “चाँदी के बदले/से” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “अपने पैरों पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכֶל
  choice: भोजन
  rationale: यहाँ शब्द सामान्य रूप से खाने की वस्तु को दर्शाता है; इसे रोटी या अनाज तक सीमित करना उचित नहीं।
- source_word: בַּכֶּסֶף
  choice: चाँदी के बदले
  rationale: इब्रानी में ठोस संज्ञा ‘चाँदी’ है और पूर्वसर्ग भुगतान या विनिमय का भाव देता है। यह अनुवाद स्रोत की ठोस अभिव्यक्ति बनाए रखता है।
- source_word: תַּשְׁבִּרֵנִי
  choice: मुझे … भोजन बेच देना
  rationale: इस प्रसंग में שׁבר का हिफ़ील रूप भोजन बेचने का अर्थ देता है। ‘बेच देना’ निवेदन के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאָכַלְתִּי
  choice: ताकि मैं खा सकूँ
  rationale: वाव के साथ पूर्ण रूप यहाँ अनुरोध के अभिप्रेत परिणाम या उद्देश्य को व्यक्त करता है।
- source_word: וּמַיִם
  choice: पानी
  rationale: सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: תִּתֶּן לִי
  choice: मुझे … पानी दे देना
  rationale: נתן और ל का सरल अनुरोधात्मक अनुवाद।
- source_word: וְשָׁתִיתִי
  choice: ताकि मैं पी सकूँ
  rationale: यह रूप पिछले खंड के समान अभिप्रेत परिणाम या उद्देश्य बताता है।
- source_word: רַק
  choice: बस
  rationale: यह अनुरोध को सीमित करता है; आधुनिक हिन्दी में ‘बस’ संक्षिप्त और स्वाभाविक है।
- source_word: אֶעְבְּרָה
  choice: निकल जाने देना
  rationale: सहोरटेटिव रूप प्रसंग में अनुमति माँगने वाला है। ‘निकल जाने देना’ मार्ग से होकर आगे बढ़ने की विनती व्यक्त करता है।
- source_word: בְרַגְלָי
  choice: पैदल
  rationale: शाब्दिक अर्थ ‘अपने पैरों पर/से’ है। ‘पैदल’ उसी आशय का स्वाभाविक हिन्दी मुहावरा है।
