  text: וְ/קָרַבְתָּ֗ מ֚וּל בְּנֵ֣י עַמּ֔וֹן אַל תְּצֻרֵ֖/ם וְ/אַל תִּתְגָּ֣ר בָּ֑/ם כִּ֣י לֹֽא אֶ֠תֵּן מֵ/אֶ֨רֶץ בְּנֵי עַמּ֤וֹן לְ/ךָ֙ יְרֻשָּׁ֔ה כִּ֥י לִ/בְנֵי ל֖וֹט נְתַתִּ֥י/הָ יְרֻשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/019.yaml
  text: When you come opposite the sons of Ammon[a], do not harass them or provoke them, for I will not give you any of the land of the sons of Ammon as a possession[c][b], because I have given it as a possession to the sons of Lot.
translation:
  language: hi
  text: जब तुम अम्मोन के वंशजों[a] के सामने पहुँचो, तो न उन्हें सताना[b] और न उनसे झगड़ा मोल लेना; क्योंकि मैं अम्मोन के वंशजों की भूमि में से कोई भाग तुम्हारी संपत्ति के रूप में नहीं दूँगा, क्योंकि मैंने वह भूमि लूत के वंशजों को उनकी संपत्ति के रूप में दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘अम्मोन के पुत्र’; पूरे पद में इसे ‘अम्मोनी लोग’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उन पर आक्रमण न करना।’ इब्रानी शब्द केवल औपचारिक घेराबंदी नहीं, बल्कि व्यापक शत्रुतापूर्ण कार्रवाई का निषेध कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַבְתָּ מוּל
  choice: जब तुम ... के सामने पहुँचो
  rationale: यह पदबंध किसी जनसमूह के भूभाग के सामने या निकट पहुँचने की स्थिति बताता है। ‘के सामने पहुँचो’ מוּל के स्थानिक अर्थ को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोन के वंशज
  rationale: शाब्दिक ‘अम्मोन के पुत्र’ आधुनिक हिन्दी में केवल प्रत्यक्ष पुत्रों का बोध करा सकता है। ‘वंशज’ इब्रानी के जातीय और पारिवारिक दोनों भावों को स्पष्ट रूप से व्यक्त करता है।
- source_word: אַל תְּצֻרֵם
  choice: उन्हें न सताना
  rationale: यहाँ क्रिया व्यापक शत्रुतापूर्ण दबाव या व्यवहार का निषेध कर सकती है; ‘सताना’ इसे किसी नगर की औपचारिक घेराबंदी तक सीमित नहीं करता।
- source_word: וְאַל תִּתְגָּר בָּם
  choice: न उनसे झगड़ा मोल लेना
  rationale: हित्पएल रूप संघर्ष भड़काने या शत्रुता में उलझने का भाव देता है। यह हिन्दी अभिव्यक्ति अनावश्यक रूप से ‘युद्ध’ शब्द जोड़े बिना उस सक्रिय उकसावे को व्यक्त करती है।
- source_word: מֵאֶרֶץ בְּנֵי עַמּוֹן
  choice: अम्मोन के वंशजों की भूमि में से कोई भाग
  rationale: निषेध के साथ מִן का अंशवाचक बल है—उस भूमि का कोई भी हिस्सा इस्राएल को नहीं दिया जाएगा।
- source_word: יְרֻשָּׁה
  choice: अधिकार
  rationale: भूमि के स्थायी रूप से दिए गए भाग या संपत्ति का भाव व्यक्त होता है। ‘अधिकार’ वर्तमान हिन्दी में सहज है और पारिवारिक उत्तराधिकार का अर्थ अनिवार्य नहीं बनाता।
- source_word: לִבְנֵי לוֹט
  choice: लूत के वंशजों को
  rationale: यह चयन समान בְּנֵי पदबंध के अनुवाद में संगति रखते हुए राष्ट्रीय वंश-सम्बन्ध को स्पष्ट करता है।
- source_word: נְתַתִּיהָ
  choice: मैंने वह ... दिया है
  rationale: इब्रानी पूर्ण क्रिया पहले से सम्पन्न और अब भी प्रभावी ईश्वरीय अनुदान को सूचित करती है; हिन्दी पूर्ण वर्तमान इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: राष्ट्रीय नामों में בְּנֵי का अनुवाद
  choice: अम्मोन के वंशज / लूत के वंशज
  alternative: अम्मोन के पुत्र / लूत के पुत्र; अम्मोनी लोग
  rationale: ‘वंशज’ मूल के पारिवारिक-वंशगत बल को बनाए रखता है, पर पाठक को इसे केवल प्रत्यक्ष पुत्रों तक सीमित समझने से बचाता है।
- issue: יְרֻשָּׁה में अधिकार और विरासत का सम्बन्ध
  choice: अधिकार
  alternative: विरासत; निज-सम्पत्ति
  rationale: पद भूमि पर परमेश्वर द्वारा दिए गए स्थायी अधिकार की बात करता है। मुख्य पाठ एक अर्थ को स्पष्ट हिन्दी में रखता है और ‘विरासत’ की वास्तविक वैकल्पिक छाया को पादटिप्पणी में सुरक्षित करता है।
- issue: दोनों निषेधों में शत्रुता की सीमा
  choice: सताना / झगड़ा मोल लेना
  alternative: आक्रमण करना / युद्ध छेड़ना
  rationale: मूल पाठ शत्रुतापूर्ण कार्रवाई और संघर्ष भड़काने को रोकता है, पर औपचारिक घेराबंदी या घोषित युद्ध तक अर्थ को स्पष्ट रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली रखी गई है। ‘वंशज’, ‘सताना’, ‘झगड़ा मोल लेना’ और ‘अधिकार’ सामान्य पाठक के लिए स्पष्ट हैं; पादटिप्पणियाँ मूल की प्रमुख शब्दार्थगत सम्भावनाएँ सुरक्षित रखती हैं।
