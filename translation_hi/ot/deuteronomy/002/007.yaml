base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/007.yaml
  text: For Yahweh your God has blessed you in all the work of your hands[a]. He has known your walking through this great wilderness. These forty years Yahweh your God has been with you; you have lacked nothing.
translation:
  language: hi
  text: क्योंकि तुम्हारे परमेश्वर यहोवा ने तुम्हारे हाथ के हर काम में तुम्हें आशीष दी है। वह इस विशाल वीराने से होकर तुम्हारी यात्रा को जानता रहा है।[a] इन चालीस वर्षों से तुम्हारा परमेश्वर यहोवा तुम्हारे साथ रहा है; तुम्हें किसी चीज़ की कमी नहीं हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जानता रहा है” का अर्थ यहाँ “इस विशाल वीराने से होकर तुम्हारी यात्रा की देखभाल करता रहा है” भी हो सकता है। मूल इब्रानी क्रिया का शाब्दिक अर्थ “जानना” है, पर प्रसंग में वह सजग देखभाल का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: בֵּרַכְךָ
  choice: तुम्हें आशीष दी है
  rationale: पूर्ण क्रिया का वर्तमान तक प्रभाव दिखाने के लिए यह स्वाभाविक हिन्दी रूप है और धार्मिक अर्थ को बनाए रखता है।
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: तुम्हारे हाथ के हर काम में
  rationale: मूल के एकवचन ‘हाथ’ और श्रम/उद्यम के मुहावरे को समझने योग्य हिन्दी में सुरक्षित रखा गया है।
- source_word: יָדַע
  choice: जानता रहा है
  rationale: मूल अर्थ ‘जानना’ को बनाए रखते हुए सतत अवधि का संकेत दिया गया है; प्रसंग में निहित देखभाल को मुख्य पाठ में स्पष्ट करके नहीं जोड़ा गया।
- source_word: לֶכְתְּךָ
  choice: तुम्हारे चलते रहने को
  rationale: הלך के गतिशील और निरंतर यात्रा-संबंधी भाव को अपेक्षाकृत निकट, फिर भी बोधगम्य हिन्दी में व्यक्त करता है।
- source_word: אֶת הַמִּדְבָּר הַגָּדֹל הַזֶּה
  choice: इस बड़े वीराने में
  rationale: निर्जन मरुस्थलीय क्षेत्र के लिए ‘वीराना’ सहज है और यहाँ से होकर चलने का स्थानगत संबंध स्पष्ट करता है।
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: इन चालीस वर्षों से
  rationale: दीर्घ अवधि को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: עִמָּךְ
  choice: तुम्हारे साथ रहा है
  rationale: मूल में निहित अस्तित्वसूचक क्रिया को हिन्दी में पूरा करते हुए निरंतर उपस्थिति व्यक्त की गई है।
- source_word: לֹא חָסַרְתָּ דָּבָר
  choice: तुम्हें किसी बात की घटी नहीं हुई
  rationale: पूर्ण अभाव-रहित प्रबंध को व्यक्त करने वाला स्वाभाविक और गरिमापूर्ण हिन्दी मुहावरा है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: יָדַע में निहित सचेत देखभाल
  choice: मुख्य पाठ में ‘जानता रहा है’
  alternative: ‘तुम्हारी यात्रा की देखभाल करता रहा है’
  rationale: शाब्दिक ‘जानना’ और प्रसंगगत संरक्षण के बीच अर्थगत तनाव को बनाए रखा गया है; व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, एकवचन संबोधन और गरिमापूर्ण बाइबलीय शैली। ‘यहोवा’ को ईश्वरीय नाम के रूप में रखा गया है। पादटिप्पणी का संकेत उस वाक्य के अंत में रखा गया है जिसकी अर्थगत व्याख्या वह स्पष्ट करती है।
