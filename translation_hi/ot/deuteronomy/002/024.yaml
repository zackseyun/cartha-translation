base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/024.yaml
  text: Rise up[a], set out, and cross over the Arnon Valley. See, I have given into your hand Sihon king of Heshbon, the Amorite, and his land. Begin to take possession of it[c][b], and engage him in battle.
translation:
  language: hi
  text: उठो, कूच करो और अर्नोन की घाटी[a] को पार करो। देख, मैंने हेशबोन के राजा, अमोरी सीहोन को और उसके देश को तेरे हाथ में दे दिया है। उस देश पर अधिकार करना शुरू कर[b] और उससे युद्ध छेड़।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अर्नोन की वादी,” “अर्नोन की जलधारा,” या “अर्नोन का नदी-तल।” इब्रानी नखल किसी वादी, जलधारा, नदी-तल या घाटी का सूचक हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उस पर अधिकार जमा लेना शुरू कर।” इस क्रिया का अर्थ सन्दर्भ के अनुसार “अधिकार करना” या “बेदखल करना” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “उससे युद्ध में भिड़” अथवा “उसे युद्ध के लिए ललकार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ סְּע֗וּ
  choice: उठो, कूच करो
  rationale: दोनों बहुवचन आज्ञाओं को अलग रखा गया है। ‘उठो’ आगे बढ़ने की तत्परता और ‘कूच करो’ यात्रा आरम्भ करने का भाव स्वाभाविक आधुनिक हिन्दी में देते हैं।
- source_word: וְ/עִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן
  choice: और अर्नोन की घाटी को पार करो
  rationale: עבר भौगोलिक अवरोध पार करने को व्यक्त करता है। נחל सूखी नदी-घाटी, जलधारा या उसके तल को सूचित कर सकता है; मुख्य पाठ में ‘घाटी’ सुबोध है।
- source_word: רְאֵ֣ה
  choice: देख
  rationale: यह एकवचन आज्ञा है, जो मूसा को सम्बोधित घोषणा में ध्यान खींचती है; इसलिए आसपास के बहुवचन आदेशों के विपरीत एकवचन ‘देख’ रखा गया है।
- source_word: נָתַ֣תִּי בְ֠/יָדְ/ךָ
  choice: मैंने ... तेरे हाथ में दे दिया है
  rationale: पूर्ण क्रिया और ‘हाथ में देना’ की इब्रानी छवि दोनों सुरक्षित हैं; मुहावरा अधिकार या नियंत्रण सौंपने का अर्थ देता है।
- source_word: סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י
  choice: हेशबोन के राजा सीहोन अमोरी को
  rationale: नाम, राजपद और जातीय पहचान—तीनों सुरक्षित हैं। यह क्रम स्रोत की उपपदात्मक संरचना के निकट रहते हुए हिन्दी में समझने योग्य है।
- source_word: וְ/אֶת אַרְצ֖/וֹ
  choice: और उसके देश को
  rationale: אֶרֶץ यहाँ सीहोन के अधीन भूभाग को दर्शाता है; ‘देश’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
- source_word: הָחֵ֣ל רָ֑שׁ
  choice: उस पर अधिकार करना शुरू कर
  rationale: החל आरम्भ करने की आज्ञा है और ירש यहाँ पहले उल्लिखित देश को अपने अधिकार में लेने का अर्थ देता है। सर्वनाम ‘उस’ का निकटतम सन्दर्भ ‘देश’ है।
- source_word: וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה
  choice: और उससे युद्ध छेड़
  rationale: यह पद सक्रिय रूप से वैर या युद्ध आरम्भ करने की आज्ञा देता है। ‘युद्ध छेड़’ संक्षिप्त, स्पष्ट और वर्तमान हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर का पूर्ण किया हुआ दान और इस्राएल की आज्ञापित कार्रवाई
  choice: ‘मैंने ... दे दिया है’ के साथ ‘अधिकार करना शुरू कर’ और ‘युद्ध छेड़’—दोनों पक्ष यथावत रखे गए हैं।
  alternative: पूर्ण क्रिया को भविष्यकाल ‘मैं दूँगा’ बनाना, या मानवीय विजय-कार्य को नरम करना।
  rationale: इब्रानी पाठ परमेश्वर के पूर्ण माने गए दान और इस्राएल की अपेक्षित कार्रवाई को साथ रखता है। अनुवाद इस तनाव का समाधान किए बिना दोनों को व्यक्त करता है।
- issue: ירש का अर्थ
  choice: मुख्य पाठ में भूमि पर ‘अधिकार करना’।
  alternative: ‘उसे बेदखल करना’ या केवल ‘उसे अपना लेना’।
  rationale: निकटवर्ती प्रत्यक्ष कर्म सीहोन का देश है, इसलिए भूमि-अधिग्रहण मुख्य अर्थ है; फिर भी क्रिया की अर्थ-सीमा पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सामूहिक आदेशों में बहुवचन ‘उठो/करो’ और मूसा को सम्बोधित एकवचन ‘देख/तेरे/कर’ का स्रोतगत परिवर्तन सुरक्षित है। ‘सीहोन अमोरी’ में जातीय विशेषण को नाम के बाद रखा गया है।
