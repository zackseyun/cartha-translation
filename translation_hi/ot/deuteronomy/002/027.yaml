  text: मुझे अपने देश में से होकर जाने दे। मैं केवल मार्ग पर ही चलूँगा[a]; मैं न दाहिनी ओर हटूँगा, न बाईं ओर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मार्ग पर, मार्ग पर।” यह बलसूचक पुनरुक्ति है, जिसका अर्थ है कि मैं मार्ग पर ही बना रहूँगा।
    reason: lexical_alternative
