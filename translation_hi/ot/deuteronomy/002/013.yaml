translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। आदेश और उसके पालन की पुनरावृत्ति सुरक्षित रखी गई है। ‘वादी’ जैसे कम परिचित उधार-शब्द के बजाय ‘घाटी’ चुना गया है, और मूल शब्द की भौगोलिक व्यापकता पादटिप्पणी में दी गई है।
