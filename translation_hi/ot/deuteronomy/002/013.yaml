  yaml_path: translation/ot/deuteronomy/002/013.yaml
  text: Now rise up and cross over the Wadi Zered[a]. So we crossed over the Wadi Zered.
translation:
  language: hi
  text: अब उठो और जेरेद की घाटी[a] को पार करो। तब हमने जेरेद की घाटी को पार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जेरेद का नाला’ अथवा ‘जेरेद की जलधारा’। इब्रानी शब्द נַחַל प्रसंग के अनुसार घाटी, खड्ड, नाला या जलधारा के पाट का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: यह समय-सूचक कथन अगले आदेश को तत्काल आरम्भ करता है; ‘अब’ स्वाभाविक और सीधा है।
- source_word: קֻמוּ
  choice: उठो
  rationale: बहुवचन आज्ञार्थ का बल बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְעִבְרוּ
  choice: पार करो
  rationale: यात्रा के प्रसंग में עבר का अर्थ एक ओर से दूसरी ओर जाना है; ‘पार करो’ इस दिशा-सूचक भाव को स्पष्ट रखता है।
- source_word: לָכֶם
  choice: आज्ञा के भाव में समाहित
  rationale: यह नैतिक/हितार्थक सम्प्रदान आदेश में मुहावरेदार बल जोड़ता है, पर हिन्दी में इसे अलग से कहना अस्वाभाविक और अनावश्यक होगा।
- source_word: נַחַל
  choice: घाटी
  rationale: यह शब्द मौसमी जलधारा, नाला, नदी-तल या खड्ड वाली घाटी का संकेत दे सकता है। इस मरुभूमीय भूगोल में ‘घाटी’ सहज है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: זָרֶד
  choice: जेरेद
  rationale: स्थान-नाम का हिन्दी ध्वन्यात्मक लिप्यंतरण।
- source_word: וַנַּעֲבֹר
  choice: तब हमने ... पार किया
  rationale: प्रथम पुरुष बहुवचन वय्यिक्तोल आदेश के बाद उसके पूरा होने की क्रमिक कथा बताता है; ‘तब’ उस अनुक्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
