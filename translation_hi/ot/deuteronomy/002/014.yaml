  text: וְ/הַ/יָּמִ֞ים אֲשֶׁר הָלַ֣כְנוּ מִ/קָּדֵ֣שׁ בַּרְנֵ֗עַ עַ֤ד אֲשֶׁר עָבַ֨רְנוּ֙ אֶת נַ֣חַל זֶ֔רֶד שְׁלֹשִׁ֥ים וּ/שְׁמֹנֶ֖ה שָׁנָ֑ה עַד תֹּ֨ם כָּל הַ/דּ֜וֹר אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֔ה כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/014.yaml
  text: And the days that we traveled from Kadesh-barnea until we crossed the Wadi Zered were thirty-eight years[a], until the entire generation of the men of war had come to an end from the midst of the camp, just as Yahweh had sworn to them.
translation:
  language: hi
  text: और कादेश-बर्नेआ से चलने से लेकर जेरेद की घाटी[a] पार करने तक हमें अड़तीस वर्ष लगे। तब तक युद्ध करने वाले पुरुषों की वह पूरी पीढ़ी छावनी के बीच में से समाप्त हो चुकी थी, जैसा यहोवा ने उनसे शपथ खाकर कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जेरेद का नाला।” इब्रानी शब्द सूखी या मौसमी जलधारा वाली घाटी, नदी-नाला या जलधारा के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר הָלַכְנוּ
  choice: चलने से लेकर ... तक हमें ... वर्ष लगे
  rationale: इब्रानी का शाब्दिक अर्थ ‘और वे दिन जिनमें हम चले’ है; हिन्दी में अवधि को स्वाभाविक ढंग से व्यक्त करते हुए यात्रा का भाव सुरक्षित रखा गया है।
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: कादेश-बर्नेआ से
  rationale: स्थान-नाम का निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: עַד אֲשֶׁר עָבַרְנוּ
  choice: पार करने तक
  rationale: जलधारा अथवा घाटी के संदर्भ में עבר का स्वाभाविक अर्थ ‘पार करना’ है।
- source_word: נַחַל זֶרֶד
  choice: जेरेद की घाटी
  rationale: נַחַל सूखी या मौसमी जलधारा वाली घाटी, नदी-नाला अथवा जलधारा को सूचित कर सकता है; क्षेत्रीय भूगोल के अनुरूप ‘घाटी’ मुख्य पाठ में रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: अड़तीस वर्ष
  rationale: संख्या का मानक आधुनिक हिन्दी रूप।
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: तब तक ... वह पूरी पीढ़ी ... समाप्त हो चुकी थी
  rationale: תֹּם पूर्ण हो जाने या अंत तक पहुँचने का भाव देता है; हिन्दी में क्रमिक समाप्ति और समय-सीमा दोनों स्पष्ट हैं।
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: युद्ध के पुरुषों
  rationale: इब्रानी पद स्पष्टतः पुरुषवाचक है और युद्धयोग्य पुरुषों की दोषी पीढ़ी की ओर संकेत करता है; औपचारिक निकटता बनाए रखी गई है।
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: छावनी के बीच से
  rationale: קֶרֶב के ‘बीच/मध्य’ भाव को सुरक्षित रखते हुए मुहावरे को संक्षिप्त रखा गया है।
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: ठीक जैसा यहोवा ने उनसे शपथ खाई थी
  rationale: शपथ की स्पष्ट भाषा और पूर्वकालिकता सुरक्षित है; יהוה को उसके प्रचलित हिन्दी नामरूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम है, इसलिए उपाधि ‘प्रभु’ के बजाय नाम रखा गया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में अधिक पहचाना जाने वाला रूप है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: אַנְשֵׁי הַמִּלְחָמָה में लिंग-सूचना
  choice: युद्ध के पुरुषों
  alternative: योद्धाओं
  rationale: संदर्भ युद्धयोग्य पुरुषों की उस पीढ़ी का है जिस पर न्याय आया; मूल की पुरुषवाचक विशिष्टता को सामान्य लिंगरहित पद से नहीं बदला गया।
- issue: תֹּם का आशय
  choice: समाप्त हो चुकी थी
  alternative: मर चुकी थी
  rationale: मूल में सीधे ‘मरना’ नहीं बल्कि ‘समाप्त होना’ है; इसलिए न्याय का परिणाम स्पष्ट रहते हुए मूल की संयत अभिव्यक्ति सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। अवधि बताने के लिए हिन्दी का स्वाभाविक ‘हमें अड़तीस वर्ष लगे’ प्रयोग किया गया है, जबकि ‘पूरी पीढ़ी’, ‘छावनी के बीच से’ और शपथ की भाषा मूल के निकट रखी गई है।
