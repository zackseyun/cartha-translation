  yaml_path: translation/ot/deuteronomy/002/018.yaml
  text: You are crossing today the border of Moab at Ar[a].
translation:
  language: hi
  text: आज तुम आर पर मोआब की सीमा को पार कर रहे हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹבֵר
  choice: पार जा रहे हो
  rationale: कर्ता सर्वनाम के साथ प्रयुक्त कालवाचक कृदन्त प्रसंग में तत्काल घट रही गति को व्यक्त करता है; यह हिन्दी में स्वाभाविक प्रगतिशील रूप है।
- source_word: הַיּוֹם
  choice: आज
  rationale: सामान्य कालवाचक क्रियाविशेषण का सहज आधुनिक हिन्दी रूप।
- source_word: גְּבוּל מוֹאָב
  choice: मोआब की सीमा
  rationale: यह मोआब की भौगोलिक सीमा को सूचित करता है; ‘सीमा’ स्पष्ट और स्वाभाविक है।
- source_word: עָר
  choice: आर
  rationale: स्थाननाम का देवनागरी लिप्यंतरण।
- source_word: אֶת ... אֶת
  choice: सीमा पर, आर से होकर
  rationale: दोहराया हुआ कर्मचिह्न ‘आर’ को मोआब की सीमा से निकट व्याकरणिक सम्बन्ध में रखता है। मुख्य पाठ में ‘आर से होकर’ मार्ग/सीमा-बिंदु का स्वाभाविक भौगोलिक अर्थ देता है, जबकि सामानाधिकरण की सम्भावना को निर्णयात्मक ढंग से नहीं थोपता।
- source_word: אַתָּה
  choice: तुम
  rationale: द्वितीय पुरुष एकवचन रूप है, जो इस्राएल को सामूहिक इकाई के रूप में सम्बोधित करता है; हिन्दी ‘तुम’ संख्या को अनावश्यक रूप से स्पष्ट किए बिना स्वाभाविक सम्बोधन देता है।
theological_decisions:
- issue: इस्राएल के लिए एकवचन सम्बोधन
  choice: ‘तुम’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘तुम सब’ या ‘हे इस्राएल, तुम’
  rationale: इब्रानी में एकवचन सम्बोधन इस्राएल को सामूहिक रूप से देखता है। ‘तुम’ स्रोत की वाक्पद्धति बचाता है और व्याख्या नहीं जोड़ता।
- issue: आर और मोआब की सीमा का सम्बन्ध
  choice: आर को सीमा पार करने के भौगोलिक बिंदु/मार्ग के रूप में व्यक्त किया
  alternative: ‘मोआब की सीमा, अर्थात् आर’
  rationale: दोहरा אֶת सामानाधिकरण की अनुमति देता है, पर सम्बन्ध पूरी तरह स्पष्ट नहीं करता। मुख्य पाठ सहज भौगोलिक हिन्दी रखता है; वैकल्पिक सामानाधिकरण को टिप्पणी में सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और मौखिक पाठ में सहज। ‘पार जा रहे हो’ तत्काल गति को व्यक्त करता है।
