  text: Then Sihon came out to meet us[a], he and all his people[b], for battle at Jahaz.
translation:
  language: hi
  text: तब सीहोन अपने सभी लोगों के साथ हमसे युद्ध करने के लिए याहस की ओर निकला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकलकर … आया
  rationale: क्रिया יצא का मूल भाव ‘निकलना’ है। हिंदी में ‘निकलकर … आया’ कथावाचक के दृष्टिकोण और गंतव्य की गति—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: סִיחֹן
  choice: सीहोन
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: לִקְרָאתֵנוּ
  choice: हमसे … करने के लिए
  rationale: शाब्दिक अर्थ ‘हमसे मिलने/हमारा सामना करने’ है; युद्ध के स्पष्ट संदर्भ में इसे ‘हमसे युद्ध करने’ के वाक्यांश में स्वाभाविक रूप से समाहित किया गया है।
- source_word: הוּא וְכָל־עַמּוֹ
  choice: सीहोन अपने सभी लोगों के साथ
  rationale: स्वतंत्र सर्वनाम הוּא सीहोन पर ध्यान बनाए रखता है, जबकि עַם का व्यापक अर्थ ‘लोग’ है; इसे अनावश्यक रूप से ‘सेना’ तक सीमित नहीं किया गया।
- source_word: לַמִּלְחָמָה
  choice: युद्ध करने के लिए
  rationale: लामेद उपसर्ग यहाँ उद्देश्य व्यक्त करता है; यह हिंदी में स्पष्ट और स्वाभाविक उद्देश्य-वाचक रूप है।
- source_word: יָהְצָה
  choice: याहस … आया
  rationale: स्थान-नाम के साथ दिशासूचक ה गति को याहस की ओर दर्शाता है; हिंदी वाक्य में गंतव्य के रूप में ‘याहस आया’ रखा गया है।
