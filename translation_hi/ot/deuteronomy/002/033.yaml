base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/033.yaml
  text: And Yahweh our God gave him over to us[a], and we struck him down[b], along with his sons and all his people.
translation:
  language: hi
  text: और हमारे परमेश्वर याहवे ने उसे हमारे वश में कर दिया[a], और हमने उसे, उसके बेटे[b] और उसकी सारी प्रजा को मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘हमारे सामने’; यहाँ इसका अर्थ है कि याहवे ने उसे इस्राएल के वश में कर दिया।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी व्यंजन-पाठ में ‘उसका बेटा’ है; इस प्रसंग में बहुत-से लोग इसे सामूहिक अर्थ में ‘उसके बेटे’ समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... לְפָנֵינוּ
  choice: उसे हमारे वश में कर दिया
  rationale: युद्ध के प्रसंग में נתן के साथ לְפָנֵינוּ का शाब्दिक अर्थ ‘हमारे सामने’ है, पर मुहावरे का आशय शत्रु को इस्राएल के अधिकार में सौंपना है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचा-नाम के प्रचलित लिप्यंतरण ‘यहोवा’ का प्रयोग किया गया है, न कि किसी उपाधि का।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित रूप का सीधा और स्वाभाविक अनुवाद।
- source_word: וַנַּךְ
  choice: हमने ... मार गिराया
  rationale: सैन्य वृत्तांत में נכה निर्णायक प्रहार और पराजय अथवा वध का बोध कराता है; ‘मार गिराया’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בנו
  choice: उसके बेटे
  rationale: व्यंजन-पाठ को एकवचन ‘उसका बेटा’ पढ़ा जा सकता है, जबकि पारंपरिक पठन और प्रसंग इसे बहुवचन समझते हैं; अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: כָּל עַמּוֹ
  choice: उसकी सारी प्रजा
  rationale: עַם का मूल अर्थ ‘लोग/प्रजा’ है। राजा सीहोन के संदर्भ में ‘उसकी सारी प्रजा’ शासकीय संबंध को सहज हिन्दी में व्यक्त करता है, बिना इसे केवल सेना तक सीमित किए।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के लिए सुस्थापित रूप ‘यहोवा’ नाम को उपाधि से प्रतिस्थापित किए बिना स्पष्ट रखता है।
- issue: युद्ध में विजय के लिए परमेश्वर की भूमिका
  choice: यहोवा ने उसे हमारे वश में कर दिया
  alternative: यहोवा ने उसे हमारे सामने कर दिया
  rationale: यह अनुवाद मूल युद्ध-संबंधी मुहावरे का आशय व्यक्त करता है कि सीहोन इस्राएल के अधिकार में सौंपा गया; इस कथन के धार्मिक तनाव को कम या विस्तृत नहीं किया गया।
- issue: בנו की वचन-संबंधी अस्पष्टता
  choice: उसके बेटे
  alternative: उसका बेटा
  rationale: प्रसंग और पारंपरिक पठन बहुवचन का समर्थन करते हैं, लेकिन व्यंजन-पाठ की एकवचन सम्भावना को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कथात्मक शैली। ‘हमारे वश में कर दिया’ युद्ध-संबंधी मुहावरे को स्पष्ट करता है; ‘प्रजा’ राजा के अधीन लोगों के लिए स्वाभाविक है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
