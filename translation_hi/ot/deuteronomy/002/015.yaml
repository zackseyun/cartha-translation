  text: וְ/גַ֤ם יַד יְהוָה֙ הָ֣יְתָה בָּ֔/ם לְ/הֻמָּ֖/ם מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֑ה עַ֖ד תֻּמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/015.yaml
  text: Moreover[a], the hand of Yahweh was against them[b], to throw them into confusion from the midst of the camp until they were finished off.
translation:
  language: hi
  text: और याहवे का हाथ भी उनके विरुद्ध था, उन्हें छावनी के बीच से आतंकित करने के लिए[a], जब तक कि वे पूरी तरह समाप्त न हो गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें घबराहट में डालने के लिए” अथवा “उन्हें तितर-बितर करने के लिए”; इब्रानी क्रिया ईश्वरीय न्याय के रूप में घबराहट या अव्यवस्था उत्पन्न करने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “जब तक कि उनका अंत न हो गया” अथवा “जब तक कि वे नाश न हो गए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: और ... भी
  rationale: यह पिछले कथन से संबंध जोड़ते हुए उसके अर्थ पर बल देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יַד יְהוָה
  choice: याहवे का हाथ
  rationale: ईश्वरीय सामर्थ्य और सक्रिय हस्तक्षेप के इब्रानी मुहावरे को बनाए रखता है तथा יהוה को उसके व्यक्तिवाचक वाचा-नाम के रूप में प्रस्तुत करता है।
- source_word: בָם
  choice: उनके विरुद्ध
  rationale: इस प्रसंग में पूर्वसर्ग उन पर लक्षित प्रतिकूल ईश्वरीय कार्रवाई व्यक्त करता है।
- source_word: לְהֻמָּם
  choice: उन्हें घबराहट में डाल दे
  rationale: המם का मूल भाव आतंक, घबराहट या अव्यवस्था उत्पन्न करना है; यह अनुवाद उसे अंतिम परिणाम, अर्थात मृत्यु, में नहीं मिला देता।
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: छावनी के बीच से
  rationale: मूल पाठ की स्थान-सूचक अभिव्यक्ति को सुरक्षित रखता है और समुदाय के भीतर से उनके हटने का भाव देता है।
- source_word: עַד תֻּמָּם
  choice: जब तक कि उनका अंत न हो गया
  rationale: समूह के पूर्णतः समाप्त हो जाने का परिणाम व्यक्त करता है, पर यह अनावश्यक रूप से प्रक्रिया को अधिक विशिष्ट नहीं बनाता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिवाचक नाम सीधे प्रयुक्त हुआ है; ‘याहवे’ उसे उपाधि से बदलने के बजाय वाचा-नाम के रूप में सुरक्षित रखता है।
- issue: ईश्वरीय न्याय में המם का आशय
  choice: घबराहट में डालना
  alternative: नष्ट करना
  rationale: यह चयन ईश्वरीय न्याय की कठोरता को बनाए रखते हुए क्रिया के आतंक या अव्यवस्था उत्पन्न करने वाले अर्थ को आगे आने वाले पूर्ण अंत से अलग रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याहवे का हाथ’ जैसे प्रमुख इब्रानी मुहावरे को सुरक्षित रखा गया है, जबकि वाक्य-विन्यास स्वाभाविक हिन्दी के अनुरूप है।
