lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब … ने कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” घटनाक्रम की अगली कड़ी को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिवाचक नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण “याहवे” से व्यक्त किया गया है।
- source_word: אֵלַי
  choice: मुझसे
  rationale: पूर्वसर्ग אֶל और प्रथम पुरुष एकवचन प्रत्यय का प्रसंगानुकूल, स्वाभाविक हिन्दी रूप “मुझसे” है।
- source_word: לֵאמֹר
  choice: 'कहा:'
  rationale: यह रूप अगले पद में आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में “कहा:” वही कार्य स्वाभाविक ढंग से करता है; शाब्दिक “यह कहते हुए” मुख्य पाठ में अनावश्यक पुनरुक्ति पैदा करता।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिवाचक चतुरक्षरी नाम है। “याहवे” उसे उपाधि में बदले बिना और किसी संप्रदायगत विस्तार के बिना प्रस्तुत करता है।
