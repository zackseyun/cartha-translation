  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। “तब” कथात्मक क्रम को, “मुझसे कहा” सामान्य हिन्दी प्रयोग को, और विसर्ग अगले पद के प्रत्यक्ष कथन को संकेत करता है।
