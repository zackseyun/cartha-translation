  text: 'तब याहवे ने मुझसे कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है। यद्यपि דִּבֵּר का मूल अर्थ ‘बोलना’ है, हिंदी में אֵלַי לֵאמֹר के साथ ‘मुझसे कहा’ प्रत्यक्ष वाणी की भूमिका के रूप में अधिक स्वाभाविक है और अर्थ को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि ‘प्रभु’ से बदलने के बजाय आधुनिक हिंदी में उसके प्रचलित लिप्यंतरण ‘यहवे’ से व्यक्त किया गया है।
- source_word: אֵלַי
  choice: मुझसे
  rationale: यहाँ אֶל प्रथम पुरुष एकवचन प्रत्यय के साथ वाणी के संबोधन का लक्ष्य बताता है। हिंदी में ‘मुझसे कहा’ ‘मेरी ओर बोला’ की अपेक्षा अधिक सहज है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह क्रियारूप आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिंदी में इसे मुख्य क्रिया के साथ समेटकर ‘कहा’ कहना स्वाभाविक है; अलग से ‘यह कहते हुए’ अनावश्यक रूप से भारी होता।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत परमेश्वर-नाम का स्पष्ट प्रयोग करता है। ‘यहवे’ उस नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे एक उपाधि से बदल देता है। ‘यहोवा’ पारंपरिक वैकल्पिक रूप है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और कथात्मक है। हिंदी की स्वाभाविक वाक्-भूमिका ‘मुझसे कहा’ अपनाई गई है; पद अगले कथन का परिचय होने के कारण अल्पविराम पर समाप्त होता है।
