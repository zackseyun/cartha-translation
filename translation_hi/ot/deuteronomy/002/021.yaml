source:
  edition: WLC
  text: עַ֣ם גָּד֥וֹל וְ/רַ֛ב וָ/רָ֖ם כָּ/עֲנָקִ֑ים וַ/יַּשְׁמִידֵ֤/ם יְהוָה֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּירָשֻׁ֖/ם וַ/יֵּשְׁב֥וּ תַחְתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/021.yaml
  text: a people great[a], numerous, and tall like the Anakim. Yahweh destroyed them from before them, and they dispossessed them and lived in their place.
translation:
  language: hi
  text: एक बड़ी, बहुत बड़ी संख्या वाली और अनाकियों[a] के समान लंबे कद की जाति। याहवे ने उन्हें उनके सामने से नष्ट कर दिया, और उन्होंने उन्हें बेदखल कर दिया और उनकी जगह पर बस गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “अनाकवंशियों के समान।”
    reason: अनाकिम जाति-नाम को हिन्दी में लिप्यंतरित ‘अनाकियों’ अथवा वंश-सूचक ‘अनाकवंशियों’ के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: עַם גָּדוֹל
  choice: एक विशाल … जाति
  rationale: עַם एकवचन सामूहिक संज्ञा है और גָּדוֹל यहाँ उस जाति के बड़े आकार या सामर्थ्य का वर्णन करता है। ‘विशाल जाति’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: רַב
  choice: बहुसंख्यक
  rationale: यह जनसंख्या की अधिकता बताता है और גָּדוֹל से इसका भेद बनाए रखता है।
- source_word: רָם
  choice: लम्बी
  rationale: अनाकियों से तुलना के संदर्भ में यह शारीरिक कद की ऊँचाई को सूचित करता है।
- source_word: כָּעֲנָקִים
  choice: अनाकियों के समान
  rationale: उपसर्ग כְּ तुलना व्यक्त करता है; עֲנָקִים जाति-नाम का बहुवचन है, जिसे लिप्यंतरित रूप में रखा गया है।
- source_word: וַיַּשְׁמִידֵם
  choice: उन्हें … नष्ट कर दिया
  rationale: שׁמד का हिफ़ील रूप विनाश या हटाए जाने का प्रबल भाव देता है, पर ‘पूरी तरह मिटा दिया’ जैसी अतिरिक्त पूर्णता नहीं जोड़ता।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के चार-अक्षरीय व्यक्तिगत दिव्य नाम का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: מִפְּנֵיהֶם
  choice: उनके सामने से
  rationale: यह इब्रानी स्थानवाचक मुहावरे को बनाए रखते हुए उनके मार्ग या उपस्थिति से हटाए जाने का भाव देता है।
- source_word: וַיִּירָשֻׁם
  choice: उन्होंने उन्हें बेदखल करके
  rationale: ירשׁ यहाँ पहले के निवासियों को हटाकर अधिकार लेने का अर्थ देता है; ‘बेदखल’ इस संदर्भ में संक्षिप्त और स्पष्ट है।
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: उनकी जगह निवास किया
  rationale: यह वाक्यांश पूर्व निवासियों का स्थान लेकर उसी भूभाग में बसने को व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम सीधे प्रयुक्त है। ‘याहवे’ उसका लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: विनाश की सीमा
  choice: नष्ट कर दिया
  alternative: पूरी तरह मिटा दिया
  rationale: हिफ़ील שׁמד प्रबल विनाश व्यक्त करता है, लेकिन इस पद में उसके दार्शनिक या जैविक रूप से पूर्ण होने की अलग व्याख्या जोड़ना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरम्भिक संज्ञा-वाक्यांश मूल इब्रानी और प्रसंग की वर्णनात्मक निरंतरता को बनाए रखता है। बहुवचन सर्वनामों की मूल संदर्भगत संरचना को स्पष्ट नाम जोड़कर अनावश्यक रूप से नहीं सुलझाया गया है।
