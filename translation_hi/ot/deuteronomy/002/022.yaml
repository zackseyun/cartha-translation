  text: כַּ/אֲשֶׁ֤ר עָשָׂה֙ לִ/בְנֵ֣י עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר אֲשֶׁ֨ר הִשְׁמִ֤יד אֶת הַ/חֹרִי֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּֽירָשֻׁ/ם֙ וַ/יֵּשְׁב֣וּ תַחְתָּ֔/ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/022.yaml
  text: just as he did for the sons of Esau who live in Seir[a], when he destroyed the Horites from before them[c][b], and they dispossessed them and settled in their place to this day.
translation:
  language: hi
  text: ठीक वैसे ही जैसे उसने सेईर में रहनेवाले एसाव के वंशजों के लिए किया था, जब उसने उनके सामने से होरियों का नाश कर दिया; और उन्होंने होरियों को बेदखल करके उनके स्थान पर बस गए, और आज तक वहीं बसे हुए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: पूर्ववर्ती कथन से स्पष्ट तुलना व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עָשָׂה לִבְנֵי עֵשָׂו
  choice: उसने एसाव के वंशजों के लिए किया था
  rationale: क्रिया के व्यापक अर्थ को बिना अनावश्यक विशिष्टता के रखता है; जातीय-सामूहिक अर्थ में בְּנֵי को ‘वंशज’ कहना अधिक स्पष्ट है।
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: सेईर में रहनेवाले
  rationale: वर्तमान कृदंत का सहज आधुनिक हिन्दी रूप है।
- source_word: הִשְׁמִיד אֶת הַחֹרִי
  choice: होरियों का नाश कर दिया
  rationale: हिफ़ील क्रिया की प्रबल विनाशकारी धारणा को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: מִפְּנֵיהֶם
  choice: उनके सामने से
  rationale: इब्रानी स्थानिक मुहावरे को निकटता से रखता है; अर्थ उनकी उपस्थिति अथवा भूभाग से हटा देना है।
- source_word: וַיִּירָשֻׁם
  choice: उन्होंने होरियों को बेदखल किया
  rationale: विजय-संदर्भ में ירשׁ का अर्थ पूर्व निवासियों को हटाकर अधिकार करना है; सर्वनाम की अस्पष्टता हिन्दी में नाम दोहराकर दूर की गई है।
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: उनकी जगह निवास किया
  rationale: पूर्व निवासियों का स्थान ग्रहण करके बसने का अर्थ सुरक्षित रखता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: जैसा वे आज तक करते हैं
  rationale: ‘आज तक’ को अंतिम निवास-क्रिया से स्वाभाविक हिन्दी में जोड़ता है।
theological_decisions:
- issue: עָשָׂה और הִשְׁמִיד का निहित कर्ता
  choice: एकवचन ‘उसने’, जिसका संदर्भ निकट प्रसंग में यहोवा से है
  alternative: कर्त्ता को अनिर्दिष्ट छोड़ना
  rationale: इब्रानी क्रियाएँ पुल्लिंग एकवचन हैं और पिछले प्रसंग में यहोवा के कार्य की ओर संकेत करती हैं; पद में नाम जोड़ने के बजाय सर्वनाम मूल की शैली बचाता है।
- issue: וַיִּירָשֻׁם और וַיֵּשְׁבוּ का कर्ता
  choice: एसाव के वंशज
  alternative: परमेश्वर को कर्ता मानना
  rationale: बहुवचन क्रियाएँ निकटतम बहुवचन समूह, एसाव के वंशजों, की ओर लौटती हैं; वे होरियों को बेदखल कर उनकी जगह बसे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘वंशज’, ‘बेदखल’ और ‘निवास’ ऐतिहासिक-भौगोलिक संदर्भ को बिना अति-व्याख्या के व्यक्त करते हैं।
