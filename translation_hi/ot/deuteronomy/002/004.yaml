source:
  edition: WLC
  text: וְ/אֶת הָ/עָם֮ צַ֣ו לֵ/אמֹר֒ אַתֶּ֣ם עֹֽבְרִ֗ים בִּ/גְבוּל֙ אֲחֵי/כֶ֣ם בְּנֵי עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר וְ/יִֽירְא֣וּ מִ/כֶּ֔ם וְ/נִשְׁמַרְתֶּ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/004.yaml
  text: And command the people[a], saying, ‘You are about to pass through the territory of your brothers, the sons of Esau, who live in Seir; and they will be afraid of you[c][b]. So be very careful.’
translation:
  language: hi
  text: 'और लोगों को यह आज्ञा दो: ‘तुम अपने भाइयों—सेईर में रहनेवाले एसाव के वंशजों—के क्षेत्र[b] से होकर जानेवाले हो[a]। वे तुमसे डरेंगे; इसलिए बहुत सावधान रहना[c]।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘से होकर जा रहे हो’ अथवा ‘से होकर जाओगे।’ इब्रानी कृदन्त निकट भविष्य में होनेवाली क्रिया को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सीमा।’ इब्रानी शब्द का अर्थ सीमा-रेखा या उस सीमा के भीतर का क्षेत्र, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘और अपने आप को बहुत सावधानी से सँभालना।’
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: आज्ञा दो
  rationale: यह צוה का आज्ञार्थक रूप है और अधिकारपूर्ण निर्देश व्यक्त करता है; ‘आज्ञा दो’ उसके बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָעָם
  choice: लोगों
  rationale: עם यहाँ इस्राएल के लोगों को सामूहिक रूप से दर्शाता है; ‘लोगों’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: אַתֶּם עֹבְרִים
  choice: तुम ... से होकर जानेवाले हो
  rationale: स्वतंत्र सर्वनाम के साथ कृदन्त यहाँ निकट भविष्य की क्रिया दर्शाता है; यह अनुवाद आसन्न यात्रा को स्पष्ट करता है और वर्तमान अथवा सामान्य भविष्य की सम्भावना को पादटिप्पणी में बनाए रखता है।
- source_word: בִּגְבוּל
  choice: के क्षेत्र से
  rationale: גְּבוּל सीमा-रेखा अथवा उससे घिरे भूभाग, दोनों को दर्शा सकता है। यात्रा के प्रसंग में ‘क्षेत्र’ अधिक स्वाभाविक है, जबकि ‘सीमा’ को पादटिप्पणी में रखा गया है।
- source_word: אֲחֵיכֶם בְּנֵי עֵשָׂו
  choice: अपने भाइयों—... एसाव के वंशजों—
  rationale: ‘भाइयों’ से इस्राएल और एदोम का पारिवारिक सम्बन्ध सुरक्षित रहता है। בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर वंशगत समूह के लिए आधुनिक हिन्दी में ‘वंशज’ अधिक स्पष्ट है।
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: सेईर में रहनेवाले
  rationale: यह कृदन्त स्थायी निवास को व्यक्त करता है; ‘रहनेवाले’ स्पष्ट, वर्तमान और स्वाभाविक हिन्दी है।
- source_word: וְיִירְאוּ מִכֶּם
  choice: वे तुमसे डरेंगे
  rationale: ירא के साथ מן यहाँ इस्राएल के कारण या उसके प्रति भय को व्यक्त करता है; ‘तुमसे डरेंगे’ हिन्दी में सीधा और सटीक है।
- source_word: וְנִשְׁמַרְתֶּם מְאֹד
  choice: इसलिए बहुत सावधान रहना
  rationale: שמר का निफ़अल रूप यहाँ आत्म-सावधानी का भाव देता है और מְאֹד तीव्रता जोड़ता है। प्रसंग में ‘इसलिए बहुत सावधान रहना’ चेतावनी का व्यावहारिक बल स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: एदोम के लिए पारिवारिक सम्बन्ध की भाषा
  choice: अपने भाइयों—एसाव के वंशजों—
  alternative: अपने सम्बन्धियों—एसाव की सन्तान—
  rationale: मूल पाठ इस्राएल के व्यवहार को एदोम के साथ उसके वंशगत भाईचारे से जोड़ता है। ‘भाइयों’ को बनाए रखने से यह धर्मवैधानिक और ऐतिहासिक तनाव सुरक्षित रहता है, जबकि ‘वंशजों’ से आधुनिक पाठक समझ पाता है कि यहाँ एसाव की बाद की पीढ़ियों की बात है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘भाइयों’ को मूल की पारिवारिक भाषा सुरक्षित रखने के लिए रखा गया है, और डैश से ‘एसाव के वंशजों’ को उसका स्पष्टकारी समानाधिकरण बनाया गया है। आज्ञा के अंतिम खंड में बोलचाल की सहजता और मूल चेतावनी के बल, दोनों के लिए ‘बहुत सावधान रहना’ चुना गया है।
