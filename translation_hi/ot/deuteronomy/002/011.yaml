- source_word: יִקְרְאוּ לָהֶם
  choice: उन्हें ... कहते हैं
  rationale: קרא ל का अर्थ किसी को किसी नाम से पुकारना या कहना है; हिंदी में यह सबसे स्वाभाविक प्रयोग है।
- source_word: אֵמִים
  choice: एमी
  rationale: इसे मोआबियों द्वारा प्रयुक्त प्राचीन जनसमूह के नाम के रूप में लिप्यंतरित किया गया है; इब्रानी में यहाँ निश्चित उपपद नहीं है।
