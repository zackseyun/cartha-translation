  text: וּ/בְ/שֵׂעִ֞יר יָשְׁב֣וּ הַ/חֹרִים֮ לְ/פָנִים֒ וּ/בְנֵ֧י עֵשָׂ֣ו יִֽירָשׁ֗וּ/ם וַ/יַּשְׁמִידוּ/ם֙ מִ/פְּנֵי/הֶ֔ם וַ/יֵּשְׁב֖וּ תַּחְתָּ֑/ם כַּ/אֲשֶׁ֧ר עָשָׂ֣ה יִשְׂרָאֵ֗ל לְ/אֶ֨רֶץ֙ יְרֻשָּׁת֔/וֹ אֲשֶׁר נָתַ֥ן יְהוָ֖ה לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/012.yaml
  text: And in Seir the Horites formerly lived[a], but the sons of Esau dispossessed them and destroyed them from before them, and settled in their place, just as Israel did to the land of his possession[c][b], which Yahweh gave to them.
translation:
  language: hi
  text: और सेईर में पहले होरी लोग रहते थे; पर एसाव के वंशजों ने उन्हें बेदखल कर दिया[a], उन्हें अपने सामने से मिटा दिया[b] और उनकी जगह बस गए—ठीक वैसे ही जैसे इस्राएल ने अपनी विरासत की भूमि[c] के संबंध में किया, जिसे यहोवा ने उन्हें दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें निकालकर उनकी भूमि पर अधिकार कर लिया।” इब्रानी क्रिया में पहले निवासियों को हटाकर अधिकार लेने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “अपने सामने से”; यह उन्हें अपनी उपस्थिति से हटा देने का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या “अपने अधिकार की भूमि।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: होरी लोग
  rationale: जाति के नाम को हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरित किया गया और ‘लोग’ जोड़कर अर्थ स्पष्ट रखा गया।
- source_word: לְפָנִים
  choice: पहले
  rationale: यहाँ इसका कालवाचक अर्थ ‘पूर्वकाल में’ है; ‘पहले’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: יִירָשׁוּם
  choice: उन्हें बेदखल कर दिया
  rationale: ירשׁ यहाँ पहले निवासियों को हटाकर अधिकार लेने का बोध देता है; ‘बेदखल’ इस दोहरे भाव को संक्षेप में व्यक्त करता है।
- source_word: וַיַּשְׁמִידוּם
  choice: उनका नाश किया
  rationale: שׁמד की प्रबल विनाश-सूचक भाषा को बनाए रखता है, पर ‘पूरी तरह मिटा दिया’ जैसी अतिरिक्त पूर्णता नहीं जोड़ता।
- source_word: מִפְּנֵיהֶם
  choice: अपने सामने से
  rationale: इब्रानी मुहावरे का स्वर बनाए रखते हुए हटाए जाने का भाव व्यक्त करता है।
- source_word: תַּחְתָּם
  choice: उनकी जगह
  rationale: संदर्भ में पुराने निवासियों के स्थान पर बसने का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: כַּאֲשֶׁר עָשָׂה יִשְׂרָאֵל
  choice: ठीक वैसे ही जैसे इस्राएल ने ... किया
  rationale: तुलना और पूर्ण भूतकालीन कथन दोनों को सीधे बनाए रखता है।
- source_word: לְאֶרֶץ יְרֻשָּׁתוֹ
  choice: अपने अधिकार की भूमि
  rationale: יְרֻשָּׁה में प्राप्त विरासत और स्थायी अधिकार दोनों निहित हैं; मुख्य पाठ में सहज हिन्दी रखी गई है और ‘विरासत’ को पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम का रूप, उपाधि से प्रतिस्थापन किए बिना चतुरक्षरीय ईश-नाम को व्यक्त करता है।
- source_word: לָהֶם
  choice: उन्हें
  rationale: मूल के बहुवचन को सुरक्षित रखता है, जो सामूहिक एकवचन ‘इस्राएल/अपने’ के बाद इस्राएली लोगों की ओर संकेत करता है।
theological_decisions:
- issue: ‘जैसे इस्राएल ने अपने अधिकार की भूमि के साथ किया’ का कालगत संदर्भ
  choice: इसे मूल पाठ में दिए ऐतिहासिक तुलनात्मक कथन के रूप में यथावत रखना
  alternative: इसे बाद की संपादकीय टिप्पणी मानना या अनुवाद द्वारा इस्राएल के पहले ही अधिकार कर लेने के संकेत को टालना
  rationale: इब्रानी पाठ स्पष्टतः इस्राएल के कार्य से तुलना करता है। अनुवाद स्रोत-आलोचनात्मक या सामंजस्यकारी निष्कर्ष थोपे बिना इस तनाव को बनाए रखता है।
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत ईश-नाम को हिन्दी में परिचित रूप से प्रस्तुत किया गया है, न कि उसे किसी उपाधि से बदला गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की तुलना, ‘इस्राएल’ का सामूहिक एकवचन और अंत में बहुवचन ‘उन्हें’ सुरक्षित हैं। ‘बेदखल’ अधिकार छीनने और हटाने दोनों को व्यक्त करता है; संभावित विस्तृत अर्थ पादटिप्पणी में है।
