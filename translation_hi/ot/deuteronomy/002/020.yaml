source:
  edition: WLC
  text: אֶֽרֶץ רְפָאִ֥ים תֵּחָשֵׁ֖ב אַף הִ֑וא רְפָאִ֤ים יָֽשְׁבוּ בָ/הּ֙ לְ/פָנִ֔ים וְ/הָֽ/עַמֹּנִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם זַמְזֻמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/020.yaml
  text: That also is considered a land of the Rephaim[a]; Rephaim lived in it formerly[b], but the Ammonites call them Zamzummim.
translation:
  language: hi
  text: वह भूमि भी रपाइयों की भूमि मानी जाती है[a]। पहले उसमें रपाई लोग रहते थे[b], और अम्मोनी उन्हें ज़मज़ुम्मी कहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रपाइयों का देश।”
    reason: हिब्रू पदबंध אֶרֶץ רְפָאִים को हिन्दी में “रपाइयों की भूमि” अथवा “रपाइयों का देश” कहा जा सकता है।
  - marker: b
    text: “रपाई” संभवतः एक प्राचीन जनसमूह का नाम है, जिसे परंपरा में असाधारण रूप से बड़े कद के लोगों से जोड़ा गया है; कुछ अनुवाद यहाँ “दैत्य” लिखते हैं।
    reason: जातिनाम के व्याख्यात्मक अनुवाद और उससे जुड़ी प्राचीन परंपरा को स्पष्ट करना।
lexical_decisions:
- source_word: אֶרֶץ רְפָאִים
  choice: रपाइयों का देश
  rationale: यह पदबंध उस भूभाग को रपाई नामक प्राचीन जनसमूह से जोड़ता है। जातिनाम का लिप्यंतरण करना ‘दैत्य’ जैसे व्याख्यात्मक अनुवाद से अधिक स्रोत-संगत है।
- source_word: תֵּחָשֵׁב
  choice: माना जाता है
  rationale: निफ़अल रूप यहाँ किसी वस्तु को एक श्रेणी में गिने या समझे जाने का कर्मवाच्य भाव देता है।
- source_word: אַף הִוא
  choice: वह भी
  rationale: यह निकटवर्ती पूर्ववर्ती भूभाग को पिछली चर्चा में उल्लिखित अन्य भूभागों के साथ जोड़ता है।
- source_word: רְפָאִים
  choice: रपाई लोग
  rationale: संदर्भ में यह एक जनसमूह का नाम है; इसे ‘दैत्य’ कहने से आकार-संबंधी पारंपरिक व्याख्या मूल पाठ में अनावश्यक रूप से निश्चित हो जाएगी।
- source_word: יָשְׁבוּ בָהּ
  choice: उसमें रहते थे
  rationale: यह सहज आधुनिक हिन्दी में उस स्थान पर निवास करने का अर्थ स्पष्ट करता है।
- source_word: לְפָנִים
  choice: पहले
  rationale: यह बीते समय का संकेत देने वाला स्वाभाविक और सरल हिन्दी क्रियाविशेषण है।
- source_word: וְהָעַמֹּנִים
  choice: और अम्मोनी
  rationale: हिब्रू संयोजक को सीधे ‘और’ से प्रस्तुत किया गया है; नामकरण में अंतर पाठ से स्वयं स्पष्ट है, इसलिए ‘परन्तु’ जोड़ना आवश्यक नहीं।
- source_word: יִקְרְאוּ לָהֶם
  choice: उन्हें ... कहते थे
  rationale: यह उस जनसमूह के लिए अम्मोनियों द्वारा प्रचलित नाम को व्यक्त करता है। वर्णन का कालगत संदर्भ अतीत का है, इसलिए हिन्दी में अपूर्ण भूतकाल स्वाभाविक है।
- source_word: זַמְזֻמִּים
  choice: ज़मज़ुम्मी
  rationale: यह जनसमूह का विशिष्ट नाम है, इसलिए इसका अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
theological_decisions:
- issue: רְפָאִים की पहचान और कद-काठी
  choice: रपाई नामक प्राचीन जनसमूह
  alternative: दैत्य
  rationale: पद में यह जातिनाम के रूप में प्रयुक्त है। ‘दैत्य’ कहना उनके असाधारण आकार से जुड़ी परंपरा को सीधे मुख्य पाठ में स्थापित कर देगा, जबकि मूल शब्द उस व्याख्या को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। प्राचीन जातिनामों को देवनागरी में लिप्यंतरित किया गया है। ‘रपाई लोग’ सामान्य पाठक के लिए बहुवचन जातिनाम को स्पष्ट करता है, जबकि ‘ज़मज़ुम्मी’ हिन्दी में समुदाय-सूचक रूप बनाए रखता है।
