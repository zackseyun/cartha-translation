source:
  edition: WLC
  text: אֹ֣כֶל תִּשְׁבְּר֧וּ מֵֽ/אִתָּ֛/ם בַּ/כֶּ֖סֶף וַ/אֲכַלְתֶּ֑ם וְ/גַם מַ֜יִם תִּכְר֧וּ מֵ/אִתָּ֛/ם בַּ/כֶּ֖סֶף וּ/שְׁתִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/006.yaml
  text: You shall buy food from them with silver[a], so that you may eat; and you shall also buy water from them with silver, so that you may drink.
translation:
  language: hi
  text: तुम उनसे चाँदी देकर भोजन खरीदना, ताकि तुम खा सको; और पानी भी उनसे चाँदी देकर खरीदना, ताकि तुम पी सको।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक रूपगत अनुवाद: “और तुम खाओ” तथा “और तुम पिओ।” हिब्रू में ये क्रियाएँ ‘और’ से जुड़ी हैं; इस संदर्भ में यह क्रम खरीदने के अभिप्रेत परिणाम को भी व्यक्त कर सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכֶל
  choice: भोजन
  rationale: यह खाने की वस्तुओं के लिए सामान्य शब्द है; संदर्भ इसे केवल अनाज तक सीमित नहीं करता।
- source_word: תִּשְׁבְּרוּ
  choice: मोल लेना
  rationale: यहाँ שׁבר का अर्थ भुगतान करके भोजन खरीदना है। ‘मोल लेना’ सामान्य हिंदी में व्यापारिक क्रिया को स्पष्ट करता है।
- source_word: מֵאִתָּם
  choice: उनसे
  rationale: 'यह स्रोत को व्यक्त करता है: इस्राएल को सामग्री उन्हीं लोगों से लेनी है, छीननी नहीं।'
- source_word: בַּכֶּסֶף
  choice: चाँदी देकर
  rationale: यह भुगतान के साधन के रूप में प्रयुक्त मूल ठोस संज्ञा ‘चाँदी’ को बनाए रखता है और हिंदी में स्वाभाविक है।
- source_word: וַאֲכַלְתֶּם
  choice: ताकि तुम खा सको
  rationale: निर्देशात्मक संदर्भ में समन्वित पूर्ण क्रिया खरीदने के अभिप्रेत परिणाम को व्यक्त कर सकती है; पादटिप्पणी अधिक रूपगत विकल्प सुरक्षित रखती है।
- source_word: וְגַם
  choice: और ... भी
  rationale: यह पानी से संबंधित दूसरे, समानांतर निर्देश की अतिरिक्तता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מַיִם
  choice: पानी
  rationale: यह सामान्य और सीधा हिंदी पर्याय है।
- source_word: תִּכְרוּ
  choice: मोल लेना
  rationale: यद्यपि כרה का अर्थ अन्यत्र ‘खोदना’ हो सकता है, ‘उनसे’ और ‘चाँदी देकर’ तथा भोजन वाले समानांतर वाक्य के कारण यहाँ खरीदना अभिप्रेत है।
- source_word: וּשְׁתִיתֶם
  choice: ताकि तुम पी सको
  rationale: यह पानी खरीदने के अभिप्रेत परिणाम को सहज हिंदी में व्यक्त करता है, जबकि पादटिप्पणी मूल समन्वय का अधिक रूपगत अनुवाद देती है।
theological_decisions:
- issue: एदोम के संसाधनों के संबंध में आज्ञा का नैतिक और कानूनी बल
  choice: इस्राएलियों को भोजन और पानी छीनने के बजाय भुगतान करके लेना है।
  alternative: अधिक रूपगत अनुवाद अंतिम क्रियाओं को केवल ‘और खाना’ तथा ‘और पीना’ कह सकता है।
  rationale: ‘उनसे चाँदी देकर’ स्पष्ट रूप से वैध खरीद का निर्देश देता है। परिणामसूचक हिंदी स्रोत-संदर्भ के आशय को स्वाभाविक ढंग से बताती है, और पादटिप्पणी हिब्रू समन्वय की वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी; आज्ञा के लिए सहज ‘लेना’ शैली, सम्मानपूर्ण किंतु सामान्य शब्दावली। ‘चाँदी देकर’ मूल की ठोस भुगतान-संज्ञा को बनाए रखता है।
