id: DEU.2.37
reference: Deuteronomy 2:37
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רַ֛ק אֶל אֶ֥רֶץ בְּנֵי עַמּ֖וֹן לֹ֣א קָרָ֑בְתָּ כָּל יַ֞ד נַ֤חַל יַבֹּק֙ וְ/עָרֵ֣י הָ/הָ֔ר וְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/037.yaml
  text: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
translation:
  language: hi
  text: तुम केवल अम्मोनियों के देश[a] के पास नहीं गए—यब्बोक नाले के किनारे के किसी भी भाग[b] के पास, पहाड़ी प्रदेश के नगरों के पास, और उन सभी स्थानों के पास जिनके बारे में याहवे, हमारे परमेश्वर, ने आज्ञा दी थी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अम्मोन के पुत्रों का देश।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “यब्बोक नाले का सारा हाथ”; यह मुहावरा नाले के किनारे, उसकी बगल या उससे लगे क्षेत्र को दर्शाता है।
    reason: cultural_note
  - marker: c
    text: इब्रानी में “वे सब जिनके बारे में याहवे, हमारे परमेश्वर, ने आज्ञा दी थी” है; ‘स्थान’ प्रसंग से समझा जाता है। आज्ञा का विषय स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: केवल
  rationale: यह पिछले वर्णन के संबंध में एक अपवाद या सीमा प्रकट करता है; ‘केवल’ संक्षिप्त और स्वाभाविक है।
- source_word: אֶל אֶרֶץ בְּנֵי עַמּוֹן
  choice: अम्मोनियों के देश के पास
  rationale: मुख्य पाठ में आधुनिक हिन्दी का स्वाभाविक जातिनाम रखा गया है; शाब्दिक ‘अम्मोन के पुत्रों’ को पादटिप्पणी में बताया गया है।
- source_word: לֹא קָרָבְתָּ
  choice: तुम नहीं गए
  rationale: קרב का मूल भाव निकट जाने का है। ‘के पास ... नहीं गए’ स्थानिक अर्थ बनाए रखता है और इसे स्पष्ट रूप से सैन्य आक्रमण नहीं बनाता।
- source_word: כָּל יַד נַחַל יַבֹּק
  choice: यब्बोक नाले के किनारे के किसी भी भाग में
  rationale: जलधारा के साथ ‘हाथ’ उसके किनारे, बगल या साथ लगे क्षेत्र का मुहावरा है। निषेध के भीतर כָּל को हिन्दी में ‘किसी भी भाग’ कहना स्वाभाविक है।
- source_word: וְעָרֵי הָהָר
  choice: न पहाड़ी प्रदेश के नगरों में
  rationale: הָהָר यहाँ किसी एक पहाड़ की अपेक्षा ऊँचे या पहाड़ी भूभाग का सूचक है; עָרֵי के लिए ‘नगर’ रखा गया है।
- source_word: וְכֹל אֲשֶׁר צִוָּה
  choice: और न किसी ऐसी जगह में, जिसके विषय में ... ने आज्ञा दी थी
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ हद तक लुप्तार्थक है। प्रसंग स्थानों की सीमा का है, इसलिए ‘किसी ऐसी जगह’ जोड़ा गया, पर आज्ञा की निषेधात्मक व्याख्या मुख्य पाठ में स्पष्ट रूप से आरोपित नहीं की गई।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: यह वाचा-संबंधी सामान्य संबंधसूचक पद है और हिन्दी में सीधा, स्वाभाविक अनुवाद है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उस नाम को एक उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: וְכֹל אֲשֶׁר צִוָּה में आज्ञा का आशय
  choice: मुख्य पाठ में सामान्य ‘आज्ञा दी थी’ रखते हुए स्थान-संबंधी लुप्त पद को स्पष्ट करना
  alternative: ‘जहाँ जाने से याहवे ने हमें मना किया था’
  rationale: प्रसंग से निषेध का अर्थ संभावित और स्वाभाविक है, पर צִוָּה स्वयं ‘आज्ञा देना’ कहता है, ‘मना करना’ नहीं। इसलिए मुख्य पाठ मूल की खुली अभिव्यक्ति बनाए रखता है और निषेधात्मक समझ पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की निषेधात्मक सूची को हिन्दी में ‘न ... न ... और न ...’ से स्पष्ट किया गया है। ‘नाला’ נחל के मौसमी जलमार्ग/वादी-सदृश भाव को सामान्य हिन्दी में व्यक्त करता है।
