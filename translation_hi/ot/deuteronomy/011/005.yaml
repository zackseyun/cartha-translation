  text: וַ/אֲשֶׁ֥ר עָשָׂ֛ה לָ/כֶ֖ם בַּ/מִּדְבָּ֑ר עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/005.yaml
  text: and what he did for you in the wilderness until you came to this place—
translation:
  language: hi
  text: और जो कुछ उसने तुम्हारे लिए निर्जन प्रदेश में किया, जब तक तुम इस स्थान तक नहीं पहुँच गए—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: और जो कुछ
  rationale: यह पिछले पदों में गिनाए जा रहे कार्यों की सूची को आगे बढ़ाता है और सम्बन्धवाचक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עָשָׂה
  choice: उसने…किया
  rationale: सामान्य क्रिया עשה का सीधा अर्थ ‘करना’ है; कर्ता निकटवर्ती प्रसंग से यहोवा समझा जाता है।
- source_word: לָכֶם
  choice: तुम्हारे लिए
  rationale: यहाँ לָכֶם इस्राएल के सम्बन्ध में और उसके हित में किए गए कार्यों को व्यक्त करता है; ‘तुम्हारे लिए’ स्वाभाविक हिन्दी है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר आबादी से दूर वन्य अथवा शुष्क भूभाग को दर्शाता है; ‘निर्जन प्रदेश’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है और इसे केवल रेतीले मरुस्थल तक सीमित नहीं करता।
- source_word: עַד בֹּאֲכֶם
  choice: जब तक कि तुम…नहीं पहुँचे
  rationale: पहला עַד समय की सीमा बताता है; हिन्दी में ‘जब तक कि…नहीं’ इस आगमन तक जारी अवधि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַד הַמָּקוֹם הַזֶּה
  choice: इस स्थान पर
  rationale: दूसरा עַד आगमन की स्थानिक सीमा अथवा गन्तव्य बताता है। ‘इस स्थान पर पहुँचे’ हिन्दी में स्वाभाविक रूप से वही अर्थ देता है।
theological_decisions:
- issue: עָשָׂה का निहित कर्ता
  choice: ‘उसने’—प्रसंगानुसार यहोवा
  alternative: 'नाम को स्पष्ट रूप से जोड़ना: ‘यहोवा ने’'
  rationale: इब्रानी पाठ में कर्ता पिछले प्रसंग से आता है। सर्वनाम रखना पाठ की संरचना को सुरक्षित रखता है और इस पद में नाम अनावश्यक रूप से नहीं जोड़ता।
- issue: לָכֶם में कार्य का सम्बन्ध
  choice: ‘तुम्हारे लिए’
  alternative: ‘तुम्हारे साथ’ या ‘तुम पर’
  rationale: ‘तुम्हारे लिए’ मूल पूर्वसर्ग का लाभकारी अथवा सम्बन्धात्मक भाव बनाए रखता है; दूसरे विकल्प परमेश्वर के कार्यों की प्रकृति को अधिक निश्चित कर सकते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आरम्भ का ‘और’ तथा अन्त का दीर्घ विराम-चिह्न इस अंश के बड़े वाक्य और जारी सूची का भाग होने को दर्शाते हैं।
