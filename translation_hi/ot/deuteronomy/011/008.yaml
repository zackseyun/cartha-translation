source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת כָּל הַ/מִּצְוָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְמַ֣עַן תֶּחֶזְק֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/008.yaml
  text: So keep every commandment that I am commanding you today[c][b][a], so that you may be strong and go in and possess the land that you are crossing over to possess.
translation:
  language: hi
  text: इसलिए उस सारी आज्ञा[c] का पालन करो जो मैं आज तुम्हें दे रहा हूँ, ताकि तुम बलवान हो जाओ[a] और उस देश में प्रवेश करके उस पर अधिकार कर सको[b], जिसे अधिकार में लेने के लिए तुम उस पार जा रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम बलवान बनो।”
    reason: इब्रानी क्रिया यहाँ बलवान होने या सामर्थ्य प्राप्त करने का भाव व्यक्त करती है।
  - marker: b
    text: या, “उसे विरासत में पाओ” अथवा “उसे अपने अधीन करो।” यह विकल्प यहाँ ‘अधिकार कर सको’ और ‘अधिकार में लेने’ दोनों के लिए है।
    reason: इब्रानी क्रिया ירשׁ की अर्थ-सीमा में विरासत पाना, अधिकार करना और अपने अधीन करना सम्मिलित हैं।
  - marker: c
    text: शाब्दिक रूप से, “सारी आज्ञा”; यहाँ एकवचन ‘आज्ञा’ सभी आज्ञाओं के पूरे समूह के लिए प्रयुक्त हुआ है।
    reason: मूल इब्रानी के सामूहिक एकवचन को स्पष्ट करना।
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: इसलिए...पालन करो
  rationale: वाचा और व्यवस्था के संदर्भ में שׁמר का अर्थ आज्ञा को मानना या उसका पालन करना है। आरंभिक ו को पिछले संदर्भ से निष्कर्षात्मक संबंध दिखाने के लिए ‘इसलिए’ कहा गया है।
- source_word: כָּל הַמִּצְוָה
  choice: सारी आज्ञा
  rationale: इब्रानी में ‘आज्ञा’ एकवचन में सामूहिक अर्थ रखती है और आज्ञाओं के पूरे निकाय को दर्शाती है। ‘सारी आज्ञा’ इस रूप और व्यापकता दोनों को बनाए रखता है।
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: आज जो...मैं तुम्हें दे रहा हूँ
  rationale: मूल का वर्तमान कृदंत इस समय दिए जा रहे आदेश का जीवंत भाव व्यक्त करता है। हिंदी में ‘आज्ञा देना’ स्वाभाविक है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यहाँ उद्देश्य अथवा अपेक्षित परिणाम बताने वाला सामान्य संयोजक है।
- source_word: תֶּחֶזְקוּ
  choice: तुम सामर्थी हो जाओ
  rationale: חזק का Qal रूप यहाँ आगे के कार्य के लिए बलवान या समर्थ होने का भाव देता है; इसे केवल साहस या युद्ध-कौशल तक सीमित नहीं किया गया।
- source_word: וּבָאתֶם
  choice: जाकर
  rationale: देश में प्रवेश के संदर्भ में בוא का आशय भीतर जाना या प्रवेश करना है। ‘जाकर’ हिंदी में अगले क्रियापद के साथ सहज रूप से जुड़ता है।
- source_word: וִירִשְׁתֶּם / לְרִשְׁתָּהּ
  choice: उस पर अधिकार कर लो / अधिकार में लेने के लिए
  rationale: ירשׁ में विरासत पाने, अधिकार करने और अपने अधीन लेने की अर्थ-सीमा है। इस भूमि-प्रवेश संदर्भ में ‘अधिकार करना’ सक्रिय अधिग्रहण और स्वामित्व दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: व्यवस्थाविवरण में यह प्रतिज्ञात भूभाग को सूचित करता है। संदर्भित और निश्चित भूमि के लिए ‘उस देश’ स्पष्ट तथा स्वाभाविक है।
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: जिसे...तुम पार जा रहे हो
  rationale: עֹבְרִים यरदन पार करने की गति दर्शाता है। שָׁמָּה का दिशात्मक भाव हिंदी वाक्य में लक्ष्यसूचक रचना द्वारा व्यक्त हो जाता है; अलग से ‘वहाँ’ कहना असहज और अनावश्यक होता।
theological_decisions:
- issue: वाचा-संबंधी संबोधन में एकवचन और बहुवचन का मिश्रण
  choice: सामान्य हिंदी ‘तुम’ का प्रयोग
  alternative: रूप-परिवर्तन स्पष्ट करने के लिए ‘तू’ और ‘तुम लोग’ का अदल-बदल
  rationale: मूल में ‘तुम्हें आज्ञा दे रहा हूँ’ का प्रत्यय एकवचन है, जबकि अन्य क्रियाएँ बहुवचन हैं; यह इस्राएल को एक समुदाय के रूप में संबोधित करने की विशेषता है। हिंदी ‘तुम’ संख्या को अनावश्यक रूप से निश्चित किए बिना इस सामूहिक संबोधन को स्वाभाविक बनाए रखता है।
- issue: ירשׁ का भूमि के संबंध में अर्थ
  choice: अधिकार करना
  alternative: विरासत में पाना / अपने अधीन करना
  rationale: मूल क्रिया उत्तराधिकार और सक्रिय अधिकार-ग्रहण दोनों अर्थ दे सकती है। मुख्य पाठ में संदर्भानुकूल ‘अधिकार’ रखा गया है और अर्थ-सीमा को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और वाचा-संबंधी विधिक लहजा रखा गया है। वाक्य की उद्देश्यसूचक संरचना और ‘अधिकार’ क्रिया की पुनरावृत्ति मूल के तर्क तथा शब्द-संबंध को यथासंभव बनाए रखती है।
