  yaml_path: translation/ot/deuteronomy/011/003.yaml
  text: and his signs and his deeds that he did in the midst of Egypt[c][b][a], to Pharaoh king of Egypt and to all his land—
translation:
  language: hi
  text: और उसके चिन्हों[a] और उसके कामों को, जो उसने मिस्र के बीच में[b] मिस्र के राजा फ़िरौन और उसके पूरे देश पर किए[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके आश्चर्यकर्मों।”
    reason: lexical_alternative
  - marker: b
    text: या “मिस्र में”; इब्रानी में अधिक शाब्दिक रूप से “मिस्र के बीच में।”
    reason: lexical_alternative
  - marker: c
    text: या “मिस्र के राजा फ़िरौन और उसके पूरे देश के विरुद्ध”; इब्रानी संबंधबोधक शब्द का शाब्दिक अर्थ “को” है, पर संदर्भ न्याय के लिए किए गए कामों का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתָיו
  choice: उसके चिन्हों
  rationale: אוֹת का मूल अर्थ ‘चिन्ह’ या ‘संकेत’ है। यहाँ ‘चिन्ह’ चमत्कारी संदर्भ को खुला रखते हुए मूल शब्द का व्यापक अर्थ सुरक्षित रखता है।
- source_word: מַעֲשָׂיו
  choice: उसके उन कामों
  rationale: מַעֲשֶׂה किसी किए हुए कार्य या कर्म को दर्शाता है। आधुनिक हिन्दी में ‘कामों’ स्वाभाविक और ठोस है; ‘उन’ आगे आने वाले संबंधवाचक उपवाक्य से इसे सहज रूप से जोड़ता है।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो उसने ... किए
  rationale: यह संबंधवाचक उपवाक्य पहले आए ‘चिन्हों’ और ‘कामों’ को संशोधित करता है। हिन्दी वाक्य-विन्यास के अनुसार क्रिया को उपवाक्य के अंत में रखा गया है।
- source_word: בְּתוֹךְ מִצְרַיִם
  choice: मिस्र के बीच में
  rationale: בְּתוֹךְ का अधिक शाब्दिक अर्थ ‘के बीच/मध्य में’ है। यह घटनाओं के मिस्र के भीतर घटित होने पर मूल पाठ का बल बनाए रखता है।
- source_word: לְפַרְעֹה
  choice: फ़िरौन ... के साथ
  rationale: לְ यहाँ उन व्यक्तियों या क्षेत्रों को चिह्नित करता है जिन पर कार्य घटित हुए। हिन्दी में ‘फ़िरौन के साथ किए’ सहज है और ‘के विरुद्ध’ जितना स्पष्ट व्याख्यात्मक नहीं है।
- source_word: מֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा
  rationale: यह इब्रानी रचनात्मक संबंध का सीधा और मानक हिन्दी रूप है।
- source_word: וּלְכָל אַרְצוֹ
  choice: और उसके सारे देश के साथ
  rationale: אֶרֶץ यहाँ फ़िरौन के अधीन पूरे भूभाग/देश को दर्शाता है। ‘सारे देश’ כָּל और संबंधसूचक प्रत्यय दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאֶת ... וְאֶת
  choice: और ... और
  rationale: दोहराया हुआ संयोजक और कर्मसूचक चिह्न पिछले पद के ‘देखा’ से जुड़े कर्मों की सूची को आगे बढ़ाता है; हिन्दी में दोनों पदों से पहले ‘और’ रखकर यह समन्वय सुरक्षित किया गया है।
theological_decisions:
- issue: לְ के द्वारा फ़िरौन और उसके देश से परमेश्वर के कामों का संबंध
  choice: के साथ
  alternative: के विरुद्ध
  rationale: संदर्भ न्यायपूर्ण प्रहारों की ओर संकेत करता है, पर לְ स्वयं व्यापक संबंध/लक्ष्य सूचक है। मुख्य पाठ में कम व्याख्यात्मक ‘के साथ’ रखा गया है और न्याय-विरोध का स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और पद 2 से जुड़ी अपूर्ण सूची का रूप रखा गया है। अंतिम दीर्घ डैश वाक्य के अगले पद में जारी रहने को दर्शाता है। ‘फ़िरौन’ प्रचलित हिन्दी बाइबिलीय नामरूप है।
