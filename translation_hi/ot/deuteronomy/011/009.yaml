source:
  edition: WLC
  text: וּ/לְמַ֨עַן תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֧ה לַ/אֲבֹתֵי/כֶ֛ם לָ/תֵ֥ת לָ/הֶ֖ם וּ/לְ/זַרְעָ֑/ם אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/009.yaml
  text: so that you may live long on the land that Yahweh swore to your fathers to give to them and to their offspring[b][a], a land flowing with milk and honey.
translation:
  language: hi
  text: जिससे तुम उस भूमि पर बहुत दिनों तक जीवित रहो, जिसे यहोवा ने तुम्हारे पितरों को, उन्हें और उनके वंश को देने की शपथ खाई थी—वह भूमि जिसमें दूध और मधु की धाराएँ बहती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְמַעַן
  choice: जिससे
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम का संबंध व्यक्त करता है और पिछले संदर्भ से स्वाभाविक रूप से जुड़ता है।
- source_word: תַּאֲרִיכוּ יָמִים
  choice: बहुत दिनों तक जीवित रहो
  rationale: शाब्दिक रूप से ‘दिन लम्बे करना’ दीर्घायु का इब्रानी मुहावरा है; यह हिंदी में उसका स्पष्ट और स्वाभाविक अर्थ देता है।
- source_word: עַל הָאֲדָמָה
  choice: उस भूमि पर
  rationale: व्यवस्थाविवरण के संदर्भ में אֲדָמָה केवल मिट्टी नहीं, प्रतिज्ञात भूभाग को दर्शाता है; עַל का भाव ‘पर’ से सुरक्षित रहता है।
- source_word: נִשְׁבַּע יְהוָה
  choice: यहोवा ने ... शपथ खाकर ... वचन दिया था
  rationale: נשבע की शपथ-संबंधी गंभीरता को स्पष्ट रखते हुए हिंदी में देने की प्रतिज्ञा से स्वाभाविक रूप से जोड़ा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी विशिष्ट ईश्वरीय नाम को उपाधि से बदलने के बजाय प्रचलित हिंदी रूप में सुरक्षित रखा गया है।
- source_word: לַאֲבֹתֵיכֶם
  choice: तुम्हारे पितरों
  rationale: मूल का ‘तुम्हारे पिताओं’ वाला पुरुषवाची और पूर्वज-संबंधी भाव ‘पितरों’ में संक्षिप्त तथा गरिमापूर्ण ढंग से आता है।
- source_word: לָהֶם וּלְזַרְעָם
  choice: उन्हें और उनके वंश को
  rationale: זֶרַע एक सामूहिक एकवचन है; ‘वंश’ संतान और आगे के वंशजों के सामूहिक भाव को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: जिसमें दूध और मधु की धाराएँ बहती हैं
  rationale: यह उपजाऊपन और प्रचुरता का चित्रात्मक मुहावरा है; ‘धाराएँ बहती हैं’ मूल के बहने वाले बिंब को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके उसका व्यक्तिगत वाचा-संबंधी स्वरूप रखा गया है; ‘यहोवा’ सामान्य हिंदी बाइबलीय प्रयोग में अधिक पहचाना जाता है।
- issue: पितरों और उनके वंश को भूमि देने की शपथ
  choice: ‘उन्हें और उनके वंश को’—दोनों कर्मों को स्पष्ट रखा गया है
  alternative: केवल ‘उनके वंशजों को’
  rationale: मूल पाठ לָהֶם וּלְזַרְעָם में स्वयं पितरों और उनके वंश दोनों का उल्लेख करता है। संभावित कालगत या प्रतिज्ञा-संबंधी तनाव को हटाने के लिए ‘उन्हें’ को लोप नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। ‘पितरों’ और ‘मधु’ से बाइबलीय गरिमा बनी रहती है, जबकि वाक्य-विन्यास समकालीन रखा गया है।
