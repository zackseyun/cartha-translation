base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/014.yaml
  text: then I will give the rain for your land in its season[a], the early rain and the late rain, and you will gather in your grain, your new wine[c][b], and your oil.
translation:
  language: hi
  text: तब मैं तुम्हारी भूमि के लिए समय पर वर्षा दूँगा—आरम्भ की वर्षा और अन्त की वर्षा[a]—और तुम अपना अनाज, अपना नया दाखरस[b] और अपना तेल[c] बटोरोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ऋतु के आरम्भ की वर्षा और ऋतु के अन्त की वर्षा; या “पहले की वर्षा और बाद की वर्षा।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात् ताज़ा तैयार किया गया दाखरस; या केवल “दाखरस।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात् जैतून का तेल।
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: तब मैं ... दूँगा
  rationale: पूर्ववर्ती शर्त के परिणाम को दिखाते हुए प्रथम पुरुष में परमेश्वर की प्रतिज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְטַר אַרְצְכֶם
  choice: तुम्हारे देश में ... वर्षा
  rationale: אֶרֶץ यहाँ इस्राएलियों की कृषि-भूमि/देश को सूचित करता है; हिन्दी में वर्षा के साथ ‘देश में’ स्वाभाविक है।
- source_word: בְּעִתּוֹ
  choice: ठीक समय पर
  rationale: वर्षा के उचित और नियत समय का भाव स्पष्ट करता है।
- source_word: יוֹרֶה
  choice: पहली वर्षा
  rationale: खेती के मौसम के आरम्भ में होने वाली वर्षा को दर्शाता है और מַלְקוֹשׁ के साथ कालगत विरोध बनाए रखता है।
- source_word: וּמַלְקוֹשׁ
  choice: और आखिरी वर्षा
  rationale: फसल पकने से पहले की बाद वाली मौसमी वर्षा को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְאָסַפְתָּ
  choice: और तुम ... बटोरोगे
  rationale: मूल क्रिया के इकट्ठा करने के अर्थ को बनाए रखता है, बिना उसे अधिक विशिष्ट ‘कटाई’ तक सीमित किए।
- source_word: דְגָנֶךָ
  choice: अपना अनाज
  rationale: विभिन्न अन्न-उपज के लिए व्यापक और सहज हिन्दी शब्द है।
- source_word: וְתִירֹשְׁךָ
  choice: अपना नया दाखमधु
  rationale: תִּירוֹשׁ की ताज़ा उत्पादित दाखमधु की कृषि-संबंधी विशिष्टता को सुरक्षित रखता है।
- source_word: וְיִצְהָרֶךָ
  choice: अपना तेल
  rationale: इस पारंपरिक कृषि-त्रयी में आशय जैतून का तेल है; मुख्य पाठ में संक्षिप्त ‘तेल’ और पादटिप्पणी में स्पष्टता दी गई है।
theological_decisions:
- issue: वाचा के सन्दर्भ में कृषि-आशीष की भाषा
  choice: समय पर वर्षा और उपज की ठोस प्रतिज्ञा के रूप में अनुवाद
  alternative: वर्षा को मुख्यतः आत्मिक, संस्कारात्मक, युगान्त-संबंधी या समृद्धि-सिद्धान्त का प्रतीक मानना
  rationale: इब्रानी पाठ सीधे इस्राएल की भूमि और उसकी कृषि-उपज की बात करता है; अनुवाद बाद की धर्मवैज्ञानिक व्याख्या आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कृषि-संबंधी पद-विन्यास अपनाया गया है। ‘पहली वर्षा’ और ‘आखिरी वर्षा’ सामान्य पाठक के लिए सहज हैं; उनकी मौसमी विशेषता पादटिप्पणी में स्पष्ट की गई है।
