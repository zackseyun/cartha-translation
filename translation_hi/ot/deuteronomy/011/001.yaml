source:
  edition: WLC
  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/שָׁמַרְתָּ֣ מִשְׁמַרְתּ֗/וֹ וְ/חֻקֹּתָ֧י/ו וּ/מִשְׁפָּטָ֛י/ו וּ/מִצְוֺתָ֖י/ו כָּל הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/001.yaml
  text: Therefore you shall love Yahweh your God and keep his charge[a], his statutes, his judgments[b], and his commandments all your days.
translation:
  language: hi
  text: इसलिए[a] तुम अपने परमेश्वर याहवे से प्रेम करो और उसकी अपेक्षा, उसकी विधियों, उसके न्यायादेशों[b] और उसकी आज्ञाओं का पालन जीवन भर करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘और तुम अपने परमेश्वर याहवे से प्रेम करो।’ इब्रानी संयोजक का सामान्य अर्थ ‘और’ है; यहाँ पिछले प्रसंग से निकलने वाले निष्कर्ष के कारण उसका अनुवाद ‘इसलिए’ किया गया है।
    reason: alternative_reading
  - marker: b
    text: या, ‘उसके नियमों’ अथवा ‘उसके निर्णयों।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָהַבְתָּ
  choice: इसलिए तुम … से प्रेम रखना
  rationale: אָהַב का अर्थ ‘प्रेम करना’ है। आरंभिक וְ को पिछले प्रसंग से निकलने वाले निष्कर्ष के रूप में ‘इसलिए’ कहा गया है; इसकी सामान्य संयोजक संभावना पाद-टिप्पणी में रखी गई है। एकवचन संबोधन ‘तुम’ इब्रानी के 2ms रूप को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: यह 2ms प्रत्यय सहित रचना है, अर्थात ‘तुम्हारा परमेश्वर।’ हिन्दी में ‘अपने’ कर्ता और परमेश्वर के बीच वही संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְ/שָׁמַרְתָּ
  choice: पालन … करना
  rationale: שׁמר का अर्थ ‘रखना, रक्षा करना, पालन करना’ हो सकता है। नियमों और आज्ञाओं के साथ ‘पालन करना’ सहज तथा संदर्भानुकूल है।
- source_word: מִשְׁמַרְתּוֹ
  choice: उसकी सौंपी हुई ज़िम्मेदारी
  rationale: מִשְׁמֶרֶת किसी सौंपे हुए दायित्व, कर्तव्य या पालन योग्य निर्देश को दर्शाता है। यह रूप अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है और आगे आने वाली विशिष्ट कानूनी श्रेणियों में इसे मिला नहीं देता।
- source_word: חֻקֹּתָיו
  choice: उसकी विधियों
  rationale: חֻקּוֹת कानूनी और वाचा-संबंधी संदर्भ में स्थापित विधियों को दर्शाता है; ‘विधियाँ’ पास के अन्य कानूनी पदों से इसका भेद बनाए रखता है।
- source_word: וּמִשְׁפָּטָיו
  choice: उसके न्याय-विधानों
  rationale: מִשְׁפָּט न्यायिक निर्णय, नियम या विधान का अर्थ दे सकता है। ‘न्याय-विधान’ उसके न्याय-संबंधी और विधिक दोनों पक्षों को संक्षेप में व्यक्त करता है; वैकल्पिक अनुवाद पाद-टिप्पणी में दिया गया है।
- source_word: וּמִצְוֺתָיו
  choice: उसकी आज्ञाओं
  rationale: מִצְוָה का सामान्य अर्थ ‘आज्ञा’ है। यह हिन्दी बाइबलीय कानूनी भाषा में स्पष्ट और स्वाभाविक है।
- source_word: כָּל הַיָּמִים
  choice: जीवन भर
  rationale: शाब्दिक अर्थ ‘सारे दिन’ है। संबोधित व्यक्ति के लिए इसका स्वाभाविक हिन्दी अर्थ ‘जीवन भर’ है, जो निरंतरता और आजीवन अवधि दोनों व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है और उसे उपाधि ‘प्रभु’ से नहीं बदलता; ‘यहोवा’ एक वैकल्पिक पारंपरिक स्वरूप है।
- issue: מִשְׁפָּטָיו की कानूनी बारीकी
  choice: उसके न्याय-विधान
  alternative: उसके नियम; उसके निर्णय
  rationale: यह पद न्याय, न्यायिक निर्णय और बाध्यकारी विधान के अर्थ-क्षेत्र को समेटता है। ‘न्याय-विधान’ निकटवर्ती ‘विधियों’ और ‘आज्ञाओं’ से कुछ भेद बनाए रखते हुए इस व्यापकता को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, एकवचन ‘तुम’ के साथ, निर्देशात्मक किंतु सहज और गरिमापूर्ण रखी गई है। कानूनी पदों का परस्पर भेद यथासंभव सुरक्षित है। ‘सौंपी हुई ज़िम्मेदारी’ अपेक्षाकृत औपचारिक ‘प्रभार’ की तुलना में सामान्य पाठक के लिए अधिक स्पष्ट है।
