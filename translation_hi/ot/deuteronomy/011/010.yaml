reference: Deuteronomy 11:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתָּ֤ה בָא שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ לֹ֣א כְ/אֶ֤רֶץ מִצְרַ֨יִם֙ הִ֔וא אֲשֶׁ֥ר יְצָאתֶ֖ם מִ/שָּׁ֑ם אֲשֶׁ֤ר תִּזְרַע֙ אֶֽת זַרְעֲ/ךָ֔ וְ/הִשְׁקִ֥יתָ בְ/רַגְלְ/ךָ֖ כְּ/גַ֥ן הַ/יָּרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/010.yaml
  text: For the land that you are entering to possess is not like the land of Egypt[a], from which you came out, where you sowed your seed and watered it with your foot[b], like a vegetable garden.
translation:
  language: hi
  text: क्योंकि जिस देश पर अधिकार करने के लिए तुम प्रवेश कर रहे हो, वह मिस्र देश जैसा नहीं है, जहाँ से तुम निकलकर आए हो। वहाँ तुम अपना बीज बोते थे और सब्ज़ियों की बारी की तरह अपने पैर से[a] पानी देते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने पैर से” का आशय शायद पैर से चलाए जाने वाले सिंचाई-यंत्र का उपयोग करना या पैर से छोटी नालियों में पानी का बहाव नियंत्रित करना है।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: व्यवस्थाविवरण के भौगोलिक और वाचागत संदर्भ में ‘देश’ स्वाभाविक हिन्दी है और प्रतिज्ञात भूभाग का भाव बनाए रखता है।
- source_word: בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: जिस देश पर अधिकार करने के लिए तुम प्रवेश कर रहे हो
  rationale: ‘प्रवेश कर रहे हो’ आसन्न प्रवेश को और ‘अधिकार करने’ ירשׁ के अधिकार-प्राप्ति संबंधी भाव को व्यक्त करता है।
- source_word: לֹא כְאֶרֶץ מִצְרַיִם הִוא
  choice: वह मिस्र देश जैसा नहीं है
  rationale: स्पष्ट तुलना को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: אֲשֶׁר יְצָאתֶם מִשָּׁם
  choice: जहाँ से तुम निकलकर आए हो
  rationale: ‘निकलकर आए’ निर्गमन की मूल इब्रानी अभिव्यक्ति और उसके प्रसंगगत महत्व को बनाए रखता है।
- source_word: אֲשֶׁר תִּזְרַע אֶת זַרְעֲךָ
  choice: वहाँ तुम अपना बीज बोते ... थे
  rationale: इब्रानी अपूर्ण क्रिया का यहाँ अतीत की अभ्यस्त कृषि-प्रथा वाला भाव है; ‘बोते थे’ उसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהִשְׁקִיתָ בְרַגְלְךָ
  choice: अपने पैर से उसे सींचते थे
  rationale: ‘पैर से’ के ठोस किंतु सांस्कृतिक रूप से अस्पष्ट चित्र को बिना अनावश्यक व्याख्या के बनाए रखता है; ‘उसे’ कृषि-संदर्भ से पूरित कर्म है।
- source_word: כְּגַן הַיָּרָק
  choice: सब्ज़ियों की बारी के समान
  rationale: ‘बारी’ छोटे, सघन रूप से सींचे जाने वाले सब्ज़ी-क्षेत्र को स्वाभाविक हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: वाचा-संदर्भ में निर्गमन की अभिव्यक्ति
  choice: जहाँ से तुम निकलकर आए हो
  alternative: जिसे तुम छोड़ आए हो
  rationale: ‘निकलकर आए’ केवल प्रस्थान कहने के बजाय मूल निर्गमन-वाचक मुहावरे को सुरक्षित रखता है, पर पाठ में कोई अतिरिक्त धार्मिक व्याख्या नहीं जोड़ता।
- issue: मिस्र की सिंचाई-प्रथा का संकेत
  choice: अपने पैर से उसे सींचते थे
  alternative: पैर से नालियों का पानी चलाकर उसे सींचते थे
  rationale: मूल पाठ सिंचाई में पैर के उपयोग का ढंग स्पष्ट नहीं करता; इसलिए संभावित विधि को मुख्य पाठ में निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। सामूहिक इस्राएल को संबोधित करते हुए हिन्दी की स्वाभाविक एकवचन ‘तुम’ शैली रखी गई है।
