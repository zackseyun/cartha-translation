  text: הִשָּֽׁמְר֣וּ לָ/כֶ֔ם פֶּ֥ן יִפְתֶּ֖ה לְבַבְ/כֶ֑ם וְ/סַרְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/016.yaml
  text: Be careful lest your heart be deceived and you turn aside and serve other gods and bow down to them[a].
translation:
  language: hi
  text: सावधान रहो, कहीं तुम्हारा मन बहक न जाए और तुम भटक जाओ, दूसरे देवताओं की सेवा करो और उन्हें दण्डवत् करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा मन लुभ जाए।” इब्रानी क्रिया में फुसलाए जाने, लुभाए जाने या धोखा खाने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: सावधान रहो
  rationale: निफ़अल आज्ञार्थक और לָכֶם मिलकर आत्म-सावधानी की चेतावनी देते हैं। आधुनिक हिन्दी में ‘सावधान रहो’ स्वाभाविक रूप से यही बल व्यक्त करता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह पद नकारात्मक आशंका या चेतावनी आरम्भ करता है; यह हिन्दी प्रयोग अर्थ और गंभीरता दोनों को स्वाभाविक ढंग से रखता है।
- source_word: יִפְתֶּה לְבַבְכֶם
  choice: तुम्हारा मन बहक जाए
  rationale: פתה में फुसलाए, लुभाए या धोखा दिए जाने का अर्थ हो सकता है। ‘मन बहक जाए’ हिन्दी में भीतरी इच्छा और समझ के पथभ्रष्ट होने को व्यक्त करता है और कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: וְסַרְתֶּם
  choice: और तुम भटककर
  rationale: סור उचित मार्ग या निष्ठा से हटने को दर्शाता है। ‘भटककर’ अगले कार्यों की ओर जाने वाली गति को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं की सेवा करने लगो
  rationale: עבד धार्मिक निष्ठा में सेवा को दर्शाता है। ‘सेवा’ अगले स्पष्ट उपासना-कर्म से भेद बनाए रखती है, जबकि ‘करने लगो’ चेतावनी की हिन्दी वाक्य-रचना को सहज बनाता है।
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: और उन्हें दण्डवत् करने लगो
  rationale: השתחוה झुकने या भूमि पर दण्डवत् होने के ठोस उपासना-कर्म को दर्शाता है। ‘दण्डवत् करना’ गरिमापूर्ण और सामान्य धार्मिक हिन्दी में समझने योग्य है।
theological_decisions:
- issue: धर्मत्याग की चेतावनी का क्रम
  choice: मन के बहकने से भटकाव, फिर दूसरे देवताओं की सेवा और उनके आगे दण्डवत् करने तक की क्रमिक गति को बनाए रखा गया है।
  alternative: इसे समेटकर ‘मूर्तिपूजा में फँस जाओ’ कहा जा सकता था।
  rationale: मूल इब्रानी भीतरी बहकाव से बाहरी उपासना-कर्म तक अलग-अलग चरण रखता है; उन्हें एक व्याख्यात्मक पद में समेटना उसके तनाव और क्रम को घटा देता।
- issue: פתה की अर्थ-व्याप्ति
  choice: मुख्य पाठ में ‘मन बहक जाए’
  alternative: ‘मन लुभाया जाए’ या ‘मन धोखा खा जाए’
  rationale: क्रिया में लुभाने, फुसलाने और धोखा देने की मिली-जुली संभावना है। मुख्य पाठ में व्यापक और स्वाभाविक हिन्दी चुनी गई तथा वैकल्पिक अर्थ पादटिप्पणी में रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गंभीर और वाचा-संबंधी चेतावनी के अनुकूल लहजा रखा गया है। ‘मन’ सामान्य हिन्दी में भीतरी सोच, इच्छा और संकल्प को ‘हृदय’ की अपेक्षा अधिक सहजता से व्यक्त करता है; ‘दण्डवत्’ उपासना के ठोस शारीरिक कर्म को सुरक्षित रखता है।
