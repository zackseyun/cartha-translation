source:
  edition: WLC
  text: הֲ/לֹא הֵ֜מָּה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן אַֽחֲרֵי֙ דֶּ֚רֶךְ מְב֣וֹא הַ/שֶּׁ֔מֶשׁ בְּ/אֶ֨רֶץ֙ הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/עֲרָבָ֑ה מ֚וּל הַ/גִּלְגָּ֔ל אֵ֖צֶל אֵלוֹנֵ֥י מֹרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/030.yaml
  text: Are they not beyond the Jordan[a], behind the way of the setting sun, in the land of the Canaanites who dwell in the Arabah, opposite Gilgal[c][b], beside the oaks of Moreh?
translation:
  language: hi
  text: क्या वे यरदन के पार[a], सूर्यास्त की ओर जाने वाले मार्ग के पीछे[b], अराबा में रहने वाले कनानियों के देश में, गिलगाल के सामने, मोरे के बलूत के वृक्षों[c] के पास नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरदन के उस पार।” इब्रानी का यह भौगोलिक मुहावरा है; ठीक दिशा देखनेवाले के स्थान पर निर्भर करती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “सूर्य के प्रवेश करने के मार्ग के पीछे”; अर्थात सूर्यास्त या पश्चिम की दिशा में।
    reason: lexical_alternative
  - marker: c
    text: या, “मोरे के तारपीन वृक्षों।” इब्रानी शब्द दोनों में से किसी प्रकार के बड़े वृक्ष को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֵמָּה
  choice: क्या वे ... नहीं हैं?
  rationale: इब्रानी में यह बहुवचन सर्वनाम के साथ ऐसा अलंकारिक प्रश्न है जिसका अपेक्षित उत्तर ‘हाँ’ है; ‘वे’ पिछले पद में आए दोनों पहाड़ों की ओर संकेत करता है।
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार
  rationale: यह प्रचलित भौगोलिक मुहावरा है। ‘पार’ मूल अभिव्यक्ति को बनाए रखता है, जबकि ठीक दिशा वक्ता के दृष्टिकोण पर निर्भर हो सकती है।
- source_word: אַחֲרֵי דֶּרֶךְ מְבוֹא הַשֶּׁמֶשׁ
  choice: सूर्यास्त की ओर जानेवाले मार्ग के पीछे
  rationale: यह रूप ‘मार्ग,’ ‘पीछे’ और सूर्य के अस्त होने की मूल छवि को बनाए रखता है तथा केवल ‘पश्चिम में’ कहकर कठिन भौगोलिक वाक्यांश को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בְּאֶרֶץ הַכְּנַעֲנִי
  choice: कनानियों के देश में
  rationale: इब्रानी का एकवचन जातिनाम सामूहिक अर्थ में है; आधुनिक हिन्दी में बहुवचन अधिक स्वाभाविक है।
- source_word: הַיֹּשֵׁב בָּעֲרָבָה
  choice: अराबा में रहनेवाले
  rationale: सामूहिक एकवचन कृदंत को कनानियों के साथ स्वाभाविक हिन्दी बहुवचन अर्थ में रखा गया है। ‘अराबा’ को सामान्य ‘मैदान’ न बनाकर भौगोलिक नाम के रूप में सुरक्षित रखा गया है।
- source_word: מוּל הַגִּלְגָּל
  choice: गिलगाल के सामने
  rationale: ‘सामने’ स्थानगत आमने-सामने होने का स्पष्ट और सहज हिन्दी रूप है; स्थाननाम का लिप्यंतरण किया गया है।
- source_word: אֵצֶל אֵלוֹנֵי מֹרֶה
  choice: मोरे के बाँज वृक्षों के पास
  rationale: אֵצֶל निकटता बताता है। אֵלוֹן किसी बड़े बाँज अथवा तारपीन-जैसे वृक्ष को सूचित कर सकता है; मुख्य पाठ में परिचित ‘बाँज’ और पादटिप्पणी में वनस्पतिगत विकल्प रखा गया है।
